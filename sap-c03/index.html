O 与 RPO 要求都能满足"}],"a":["B"],"e":"✅ 正确项：B。灾难恢复设计要从业务需求出发，先明确 RTO 与 RPO，再选择能达到指标的备份与复制策略并核算成本，避免盲目堆高规格。关联考点：域 4.2.1「设计灾难恢复方案以满足业务需求」。\n\n❌ A：不选最贵就不是尽责，正确的做法是按需求匹配规格，一味堆高会浪费预算。\n❌ C：RTO 与 RPO 是业务给出的目标，不能由技术架构倒推后让业务迁就。\n❌ D：只做备份无法满足严格的恢复时间目标，备份与灾难恢复不是一回事。\n\n📌 关键概念：RTO 管多久能恢复、RPO 管能丢多少数据，灾难恢复方案要由这两个指标倒推出来。","s":"自编·4.2.1"},{"id":"D4-002","d":4,"t":"single","q":"公司在多账户环境下运营，要求统一备份策略、支持跨账户备份，并且备份不能被勒索软件篡改删除。哪种做法最直接","o":[{"l":"A","t":"各账户各自配置备份，中心不做统一干预"},{"l":"B","t":"只依赖单账户快照，不做跨账户复制"},{"l":"C","t":"用 AWS Backup 集中配置备份计划、跨账户备份并设置 Vault Lock 防篡改"},{"l":"D","t":"用 S3 生命周期规则替代备份机制"}],"a":["C"],"e":"✅ 正确项：C。AWS Backup 支持集中式备份计划与跨账户备份，Vault Lock 提供合规锁防止篡改删除，正好满足统一治理与防勒索要求。关联考点：域 4.3.1「配置集中备份治理与跨账户备份策略」。\n\n❌ A：分散配置无法统一治理，各账户策略容易漂移不一致。\n❌ B：单账户快照既没有跨账户保护也缺少集中管控，还可能被一并删除。\n❌ D：S3 生命周期是存储分层机制，不能替代备份与灾难恢复方案。\n\n📌 关键概念：集中备份治理靠 AWS Backup 的计划与跨账户能力，防篡改靠 Vault Lock 的合规锁。","s":"自编·4.3.1"},{"id":"D4-003","d":4,"t":"multiple","q":"Fabrikam 三百个应用要迁云，项目刚立项。哪些做法符合发现与批次规划的原则（选所有适用项）","o":[{"l":"A","t":"不摸底，直接按服务器资产清单顺序逐台搬"},{"l":"B","t":"发现工具自动采集依赖图与性能画像，再人工摸底补齐"},{"l":"C","t":"依赖少的先行打样，共依赖的成组同批，核心复杂的后行"},{"l":"D","t":"批次以能回滚的业务单元为边界切分"},{"l":"E","t":"评估分诊出的退役应用也一并搬上云再处置"}],"a":["B","C","D"],"e":"✅ 正确项：B、C、D。迁移从摸底开始：发现工具自动采集应用清单、依赖与性能画像，人工摸底补齐网络流量与隐性依赖；评估按复杂度、依赖密度、业务价值分诊路线与优先级；批次规划——依赖少的先行打样、共依赖的成组同批、核心复杂的后行，且以能回滚的业务单元为边界切分，一批出问题影响面可控。关联考点：域 4.1.1「设计发现和资产组合评估方案，梳理依赖并规划迁移批次」。\n\n❌ A：不摸底直接搬是把风险放大，依赖断裂与批次失控都是必然。\n❌ E：评估分诊出该退役的应用就不要搬，为退役资源付迁移费是白花。\n\n📌 关键概念：先发现评估再动工；批次以回滚单元切；路线分诊该退役的别搬。","s":"自编·4.1.1"},{"id":"D4-004","d":4,"t":"single","q":"Contoso 机房租约还剩半年必须退出，两百台服务器承载的应用不想做改造，要快速平稳上云。方案怎么选","o":[{"l":"A","t":"用 Transform MGN 平迁：代理持续块级复制到云，低峰窗口割接，回退路径保留到观察期满"},{"l":"B","t":"先全部重构为微服务再上云"},{"l":"C","t":"手工逐台开新实例再拷贝数据"},{"l":"D","t":"停机三天做一次性全量搬迁"}],"a":["A"],"e":"✅ 正确项：A。重新托管是这组约束的正解：Transform MGN（曾用名 AWS Application Migration Service）的迁移代理在源机做持续块级复制到云上复制区；选定变更窗口停写、同步差量、云上实例先做测试验证；割接后回退路径保留到观察期满——应用零改造、风险最低、半年内可退租。关联考点：域 4.1.2「实施重新托管策略」。\n\n❌ B：重构工期与风险远超半年窗口，与「不想改造、要快」的约束全冲突。\n❌ C：手工逐台拷数据易漏易错，两百台规模下不可持续，也没有回退设计。\n❌ D：三天停机业务不可承受，且一次性搬迁无验证无回退。\n\n📌 关键概念：平迁三步是复制、切换测试、割接留回退；拿不到云原生优势但风险最低。","s":"自编·4.1.2"},{"id":"D4-005","d":4,"t":"single","q":"Fabrikam 的核心商业库要从商业引擎迁到 Aurora PostgreSQL，停机窗口只有十五分钟。迁移怎么配","o":[{"l":"A","t":"停机窗口内做全量导出导入，一次搬完"},{"l":"B","t":"只迁表结构，数据靠手工脚本事后补"},{"l":"C","t":"DMS 全量加载加 CDC 持续追平增量，差量到秒级时切应用连接；存储过程方言改写提前评估"},{"l":"D","t":"DMS 能顺便把存储过程的方言差异也转好"}],"a":["C"],"e":"✅ 正确项：C。DMS 三段配齐：全量加载把存量灌进目标库；变更数据捕获持续追平增量，源库全程不停服务；差量追平到秒级时切应用连接，停机窗口压到分钟级。异构换引擎同时配模式转换工具处理表结构，存储过程的 SQL 方言改写提前三个月评估——那是应用层改造。关联考点：域 4.1.3「设计数据库和数据迁移策略」。\n\n❌ A：存量数据十五分钟装不下，全量导出导入的停机口径不成立。\n❌ B：只迁结构靠脚本补数据，一致性无保障，回退与校验全无。\n❌ D：DMS 搬数据不改代码，方言差异是应用层改造，别指望迁移工具顺手解决。\n\n📌 关键概念：全量加 CDC 追平加分钟级割接；DMS 不解决方言——应用层改造常比数据更难。","s":"自编·4.1.3"},{"id":"D4-006","d":4,"t":"single","q":"Tailspin 想吃托管红利但重构预算有限：自管数据库补丁备份工单重、自管容器集群运维重、夜间对账批处理靠定时脚本。平台重塑怎么配","o":[{"l":"A","t":"全部推倒重构成无服务器架构一步到位"},{"l":"B","t":"把自管数据库整体改换为 DynamoDB"},{"l":"C","t":"维持现状，等以后有预算再整体改造"},{"l":"D","t":"自管库换 Aurora、自管集群换 ECS、夜间对账换 Lambda 定时触发，补丁备份运维交给托管层"}],"a":["D"],"e":"✅ 正确项：D。平台重塑的三条常用换法正好各对一个痛点：数据库换 Aurora，补丁、备份、高可用交给云；自管容器运行时换 ECS 托管集群；夜间对账批处理换 Lambda 定时触发——应用主体不动、关键部件换托管服务，改动可控还能吃到托管红利。关联考点：域 4.1.4「设计平台重塑策略，使用托管服务降低运维开销」。\n\n❌ A：推倒重构超出预算与风险承受，与「改动可控」的诉求相反。\n❌ B：换引擎是大改造不是重塑，查询与事务模型全要重写。\n❌ C：维持现状吃不到托管红利，工单成本继续付。\n\n📌 关键概念：重塑换部件不换架构；顺手小重构滑成大工程是常见翻车点，克制是纪律。","s":"自编·4.1.4"},{"id":"D4-007","d":4,"t":"single","q":"Fabrikam 的十年单体电商要现代化，业务要求演进快，但核心下单链路不能长时间停机。现代化路线怎么走","o":[{"l":"A","t":"大爆炸式整体重写，一次切换上线"},{"l":"B","t":"绞杀者模式：门面网关按业务域分流，下单域先拆出微服务双跑验证后切流，老单体逐域收缩最后下线"},{"l":"C","t":"单体原样平迁上云，架构先不动"},{"l":"D","t":"新系统整体重写完成后一次性替换，旧系统直接作废"}],"a":["B"],"e":"✅ 正确项：B。绞杀者模式专治「不敢停机的核心系统」：路由门面先把流量按业务能力分到新旧两侧；逐个业务域拆出微服务，双跑验证后切流；迁完的模块下线，老单体逐步收缩到零——把大爆炸风险摊成每次可控的小切换，演进诉求与不停机约束同时满足。关联考点：域 4.1.5「实施重构策略，如微服务拆分、无服务器化和渐进式现代化模式」。\n\n❌ A：大爆炸把全部风险压在一次切换上，核心下单链路赌不起。\n❌ C：平迁解决退租问题，拿不到架构演进收益，与业务要求演进快的目标不符。\n❌ D：与 A 同病——一次性替换没有灰度验证，回退路径全无。\n\n📌 关键概念：绞杀者三步是门面前置分流、逐线迁移验证切流、老系统收缩到零。","s":"自编·4.1.5"},{"id":"D4-008","d":4,"t":"single","q":"Contoso 要把单体里的事件处理模块拆出来做无服务器化。微服务的拆分边界怎么定","o":[{"l":"A","t":"按技术分层拆：数据库一层、接口一层、业务逻辑一层"},{"l":"B","t":"按团队人数把模块平均切开"},{"l":"C","t":"按业务能力定边界：事件处理按收单、审核、通知拆成独立函数与队列，数据边界跟着业务走"},{"l":"D","t":"一次性把整个单体全部函数化，一步到位"}],"a":["C"],"e":"✅ 正确项：C。微服务与函数的拆分边界按业务能力定：事件处理按收单、审核、通知三个业务能力拆成独立函数与队列，每个能力有自己的数据边界，接口与扩缩容独立演进——业务对齐的边界才能独立交付与替换。关联考点：域 4.1.5「实施重构策略，如微服务拆分、无服务器化和渐进式现代化模式」。\n\n❌ A：按技术分层拆出的还是层不是服务，耦合原样保留，独立演进无从谈起。\n❌ B：按人数平均切与业务语义无关，切出来的边界谁也独立不了。\n❌ D：全量函数化一次到位，范围失控风险一次压上，与渐进式现代化的原则相反。\n\n📌 关键概念：拆分边界按业务能力；无服务器化配队列与事件驱动，与绞杀者模式组合推进。","s":"自编·4.1.5"},{"id":"D4-009","d":4,"t":"single","q":"Contoso 的核心大型机跑 COBOL 批处理，懂它的工程师陆续退休、年维护费高昂。现代化路线怎么选","o":[{"l":"A","t":"翻译重编译与封装渐进并用：稳定模块经转换工具译成现代语言并做行为保真验证；对账等高风险模块先门面包住逐步换血；先补自动化测试再动手"},{"l":"B","t":"一次性全量翻译替换上线，出问题再回退"},{"l":"C","t":"只做接口封装，内核永远不动"},{"l":"D","t":"继续招聘 COBOL 工程师维持现状"}],"a":["A"],"e":"✅ 正确项：A。大型机现代化两派并用各取所长：翻译重编译——稳定模块经转换工具译成现代语言，行为保真验证后替换运行时；封装渐进——对账这类翻译风险高的模块先包住接口逐步换血（绞杀者模式在大型机上的应用）；没有测试资产的老系统先补自动化测试，否则没有安全网。关联考点：域 4.1.6「实现遗留工作负载现代化，包括大型机、应用和数据库」。\n\n❌ B：行为保真验证占项目大头，全量翻译一次上线，风险没有任何缓冲。\n❌ C：只封装不换内核，技术断代与成本失控照样发展，现代化没发生。\n❌ D：招人维持现状，人才断代趋势不变，维护费继续涨。\n\n📌 关键概念：两派路线是翻译重编译与封装渐进；验证工作量别低估，没测试资产先补安全网。","s":"自编·4.1.6"},{"id":"D4-010","d":4,"t":"single","q":"Contoso 机房两百台服务器要分钟级 RTO 的云上灾备，又不想为温备养常驻资源。方案怎么配","o":[{"l":"A","t":"每晚备份到 S3，出事时起新环境恢复"},{"l":"B","t":"常驻一套温备集群随时顶上"},{"l":"C","t":"出事时按文档手工逐台重建实例"},{"l":"D","t":"Elastic Disaster Recovery 持续块级复制进云上暂存区，出事按需拉起恢复实例并切流量，季度演练验证"}],"a":["D"],"e":"✅ 正确项：D。持续复制是这组约束的正解：源机装代理持续块级复制到云上轻量暂存区，平时不占常驻计算资源；出事按需拉起恢复实例、按任意时间点恢复并切流量；演练随时拉恢复实例验证、不扰生产——比先恢复备份再重启的路径快一个量级。关联考点：域 4.2.2「配置持续复制以从事件中快速恢复」。\n\n❌ A：备份恢复是灾备四档里最慢的一档，分钟级 RTO 到不了。\n❌ B：温备常驻资源正是题给「不想养」的成本。\n❌ C：手工逐台重建连小时级都难保证，更谈不上分钟级。\n\n📌 关键概念：持续块级复制加按需拉起；任意时间点恢复、演练不扰生产，恢复后可反向同步回源。","s":"自编·4.2.2"},{"id":"D4-011","d":4,"t":"single","q":"Fabrikam 灾备架构建好了但从没验证过，真出事时谁按哪步恢复没人说得清。怎么补齐评估与规程","o":[{"l":"A","t":"出事时靠资深工程师的记忆现场指挥"},{"l":"B","t":"Resilience Hub 设 RTO/RPO 目标并自动评估差距修齐，恢复步骤写成 Systems Manager 运行手册，架构变更后重跑评估"},{"l":"C","t":"评估报告做一次归档备查即可"},{"l":"D","t":"灾备达标由团队口头承诺担保"}],"a":["B"],"e":"✅ 正确项：B。评估与规程两件一起补：Resilience Hub 按设定的 RTO/RPO 政策自动扫描架构与配置，对照目标给「哪不达标、怎么补」的差距清单，修完再评；恢复规程写成 Systems Manager 运行手册——出事按文档自动执行，不靠老员工记忆；架构一变评估就过期，定期重跑。关联考点：域 4.2.3「建立灾难恢复评估和恢复规程」。\n\n❌ A：靠记忆的预案等于没有，人不在场流程就断。\n❌ C：一次性归档的评估随架构演进过期，纸面达标不等于真达标。\n❌ D：口头承诺在合规审计面前不构成证据链。\n\n📌 关键概念：韧性中心评差距、恢复步骤运行手册化；评估随架构变更重跑。","s":"自编·4.2.3"},{"id":"D4-012","d":4,"t":"single","q":"Contoso 的双区域交易平台要故障转移：确定性故障要自动切、区域级重大切换要防误切、整体要求分钟级 RTO。切流怎么配","o":[{"l":"A","t":"全部依赖 DNS 故障转移记录切换"},{"l":"B","t":"所有切换全自动执行，不设人工环节"},{"l":"C","t":"健康检查自动摘除确定性故障，区域级重大切换走路由控制由值班经理确认后拨闸，加速器层保秒级摘除"},{"l":"D","t":"先把用户流量切过去，数据层复制另行安排"}],"a":["C"],"e":"✅ 正确项：C。切流三层配齐：探测层健康检查盯端点存活，聚合健康面；切换层确定性故障（区域级失联）自动摘除——加速器终端组秒级生效；控制层区域级重大切换走路由控制开关，人工确认后一键拨闸，防抖动型故障被自动切误伤；数据层复制同步就位，流量与数据一起切。关联考点：域 4.2.4「实施多区域灾难恢复方案，包含数据复制和故障转移」。\n\n❌ A：DNS 切换受客户端 TTL 缓存影响，分钟级 RTO 靠它不稳。\n❌ B：全自动切换对抖动型故障会误切，重大切换要有人工闸。\n❌ D：光切流量不切数据是空转——用户到了新区域，数据不在那。\n\n📌 关键概念：探测、自动切换、人工闸三层配；切流与数据复制同步就位。","s":"自编·4.2.4"},{"id":"D4-013","d":4,"t":"single","q":"Contoso 的值班经理担心：区域故障拨闸切换时，备用区域的资源与配置未必真的就绪。哪个机制直接回答这个顾虑","o":[{"l":"A","t":"拨闸前手工登录备用区域逐项检查配置"},{"l":"B","t":"应用恢复控制器的就绪检查持续确认备用区域的资源与配置就位，拨闸前有明确依据"},{"l":"C","t":"备用区域配置与主区域天然永远一致，无需检查"},{"l":"D","t":"就绪检查和健康检查是同一个机制，配一个就够"}],"a":["B"],"e":"✅ 正确项：B。应用恢复控制器（ARC）有路由控制与就绪检查两层：路由控制开关负责拨区域流量；就绪检查持续确认备用区域的资源与配置真的备好了——拨闸前先看就绪检查结果，避免切到一个没就绪的区域造成二次事故。关联考点：域 4.2.4「实施多区域灾难恢复方案，包含数据复制和故障转移」。\n\n❌ A：手工逐项检查不可持续，也追不上配置变更速度。\n❌ C：跨区域配置会漂移，「天然一致」是错觉，这正是就绪检查要抓的。\n❌ D：健康检查探测运行中端点的存活，就绪检查确认备用资源的就位状态，两个层面不是一回事。\n\n📌 关键概念：切流三层之外还有就绪检查兜底——先确认备区就绪再拨闸，误切有两道保护。","s":"自编·4.2.4"},{"id":"D4-014","d":4,"t":"single","q":"Fabrikam 要建立灾备演练体系：既要持续验证又不能被演练成本拖垮。演练怎么分级安排","o":[{"l":"A","t":"每月都做全程切换演练，练得越勤越稳"},{"l":"B","t":"演练跑一遍流程留下记录就算完成"},{"l":"C","t":"只做桌面推演，实际切换永远不测"},{"l":"D","t":"桌面推演月度、组件测试季度、全程切换演练年度带剧本与裁判并实测 RTO 报数"}],"a":["D"],"e":"✅ 正确项：D。演练按成本分级排：桌面推演走查恢复路径与责任人，月度做、最便宜；组件测试断一个可用区或实例验证自动切换行为，季度做；全程演练按真实剧本切到备用区跑一段再回，年度做，审计级证据带 RTO 实测值。每级有剧本、有裁判、有回退线。关联考点：域 4.2.5「建立灾难恢复测试和验证规程」。\n\n❌ A：全程演练要双倍资源跑一段，频率贪高成本不可持续，年度已够。\n❌ B：走过场的演练只会给假信心，比不练更危险。\n❌ C：纸面推演验证不了切流与扩容的真实行为，RTO 永远是纸面值。\n\n📌 关键概念：演练分级是月度推演、季度组件、年度全程；核心系统频率对齐业务等级。","s":"自编·4.2.5"},{"id":"D4-015","d":4,"t":"single","q":"Contoso 的容器平台要扛住区域级故障：常态单集群承载、故障时接住全量、成本要压住。多集群怎么配","o":[{"l":"A","t":"三套区域集群同构、配置经基础设施即代码同步；常态单集群承载、两套温备缩量待命；区域故障拨流量、温备自动扩容接住全量"},{"l":"B","t":"三套区域集群全量双活常驻运行"},{"l":"C","t":"单集群节点跨多个可用区分布就够用"},{"l":"D","t":"等区域故障发生时再临时新建一套集群顶上"}],"a":["A"],"e":"✅ 正确项：A。多集群温备形态一次配齐：两区域各一套独立集群（同构、配置经基础设施即代码同步，不同步就是空架子）；常态单集群承载、两套温备缩量待命，成本压住；区域故障时拨流量、温备集群自动扩容接住全量——演练实测「切换加扩容」八分钟量级。关联考点：域 4.2.6「实施多集群容器策略以提供高可用和灾难恢复」。\n\n❌ B：三套全量双活成本翻倍再翻倍，状态同步复杂度也最高。\n❌ C：多可用区解决组件故障，扛不住区域级故障——那是多集群的地盘。\n❌ D：故障时现建集群，分钟级目标根本来不及。\n\n📌 关键概念：多集群三件是同构配置同步、数据各自跨区复制、全局负载切流；温备加自动扩容是性价比档。","s":"自编·4.2.6"},{"id":"D4-016","d":4,"t":"single","q":"Fabrikam 半年一次故障转移演练，这次要产出实测 RTO 与 RPO 报表给审计。测试怎么设计","o":[{"l":"A","t":"直接在生产环境拔网线模拟故障，最真实"},{"l":"B","t":"演练不设指标，跑完流程留记录即可"},{"l":"C","t":"先记录稳态基线（错误率、延迟），FIS 实验模板断主区可用区（模板带角色与停止条件护栏），切流与扩容全程打点，演练后数据校验丢失点"},{"l":"D","t":"RTO 直接按方案设计值填报，不必实测"}],"a":["C"],"e":"✅ 正确项：C。故障转移测试四步：先定基线——稳态指标记录在案，切完对得回来；用 AWS Fault Injection Service 按实验模板注入故障（断可用区或停实例），模板带角色、目标与停止条件的爆炸半径护栏；切换全程打点观测；报数——RTO 是从注入到恢复的实测墙钟时间，RPO 用数据校验比对丢失点。关联考点：域 4.3.2「设计故障转移测试并测量恢复时间」。\n\n❌ A：真拔线不可控不可回退，受控注入比真破坏安全。\n❌ B：不设指标的演练是演戏，产不出审计要的实测值。\n❌ D：RTO 是测出来的，纸面声明不算数。\n\n📌 关键概念：基线、受控注入、打点、报数四步；爆炸半径护栏与停止条件是资格线。","s":"自编·4.3.2"},{"id":"D4-017","d":4,"t":"single","q":"Contoso 要给订单核心链路设计技术韧性。分层方案怎么配","o":[{"l":"A","t":"全部资源集中在一个可用区部署，省跨区流量费"},{"l":"B","t":"跨可用区冗余部署防单点，数据库多可用区自动换主做容错，扩缩组健康检查自动换机做自愈"},{"l":"C","t":"配齐高可用组件就等于验证了韧性，无需再测"},{"l":"D","t":"边缘报表工具也上全套三层韧性配置"}],"a":["B"],"e":"✅ 正确项：B。技术韧性三层对号入座：冗余层——跨可用区多副本部署，把单点消掉；容错层——数据库多可用区复制与自动换主，请求层重试与负载分担；自愈层——扩缩组按健康检查自动换机、容器任务自动替换。核心链路三层配全，每季度注入验证。关联考点：域 4.3.3「设计具备冗余、容错和自愈能力等技术韧性特性的架构」。\n\n❌ A：单可用区集中部署，可用区一故障全链路倒，单点就是最大风险。\n❌ C：配置与测试是两回事——高可用配了不等于韧性验证过，注入验证才算数。\n❌ D：边缘组件按等级配一层或两层就够，全套三层是均摊成本浪费。\n\n📌 关键概念：韧性三层是冗余防单点、容错自动换主、自愈自动换组件；按业务等级配，不均摊。","s":"自编·4.3.3"},{"id":"D4-018","d":4,"t":"single","q":"Fabrikam 的自愈机制上线后出过一次事故：实例反复替换把上游服务打爆，形成自愈风暴。这轮加固要补的关键一环是","o":[{"l":"A","t":"把自愈触发阈值调得更敏感，故障更快发现"},{"l":"B","t":"直接关掉自愈机制，恢复为人工处理"},{"l":"C","t":"换更大规格的实例，让替换次数变少"},{"l":"D","t":"自愈配熔断与限流：替换频率超阈值时熔断暂停、限流保护上游，风暴场景有退避"}],"a":["D"],"e":"✅ 正确项：D。自愈风暴的病根是替换动作没有安全约束：实例反复替换会持续冲击上游，越换越坏。补的是熔断与限流——替换频率超过阈值时熔断暂停自愈，对上游做限流保护，风暴场景进入退避而不是连环替换，自愈从「无限循环」变成「有闸门的自动修复」。关联考点：域 4.3.3「设计具备冗余、容错和自愈能力等技术韧性特性的架构」。\n\n❌ A：阈值更敏感等于替换更频繁，风暴更烈，方向反了。\n❌ B：因噎废食关掉自愈，回到人肉运维，韧性倒退。\n❌ C：换大规格没改风暴机制，根因不在规格在无闸门。\n\n📌 关键概念：自愈要配熔断与限流防风暴；故障替换有频率闸门，自动修复不能变成连环打击。","s":"自编·4.3.3"},{"id":"D4-019","d":4,"t":"multiple","q":"Fabrikam 要防勒索加密与误删，给核心数据配不可变防线。哪些做法正确（选所有适用项）","o":[{"l":"A","t":"核心桶开版本控制加对象锁合规模式——勒索拿到生产权限也删不动旧版本"},{"l":"B","t":"备份账户的备份库上 Vault Lock，保留期内副本不可删、库策略不可改"},{"l":"C","t":"用治理模式的对象锁就够防勒索，不必上合规模式"},{"l":"D","t":"上长锁前先用短保留期试跑，验证保留策略后再上长锁"},{"l":"E","t":"备份与生产放同一账户，方便集中管理副本"}],"a":["A","B","D"],"e":"✅ 正确项：A、B、D。防勒索三层锁就位：存储层——核心桶版本控制加对象锁，合规模式下谁都不能绕，勒索加密了当天数据、旧版本照样删不掉；备份层——独立备份账户的库上 Vault Lock，保留期内副本与库策略都动不了；节奏层——锁是双刃剑，先用短保留期试跑验证策略，再上长锁，配错改不回。关联考点：域 4.3.4「保护数据免受勒索软件和误删除」。\n\n❌ C：治理模式有特权例外，防勒索要的是谁都不能绕的合规模式。\n❌ E：备份与生产同账户，勒索进了生产账户就能连带删备份——独立备份账户正是隔离爆炸半径。\n\n📌 关键概念：三把锁是 S3 对象锁、EBS 快照锁、Backup Vault Lock；合规模式才硬，锁与生命周期要协同。","s":"自编·4.3.4"},{"id":"D4-020","d":4,"t":"single","q":"Contoso 要开始混沌工程，主动暴露系统暗病。正确的实验流程是","o":[{"l":"A","t":"直接对生产随机注入故障，看系统真实反应"},{"l":"B","t":"不设稳态基线，注入后翻日志找问题"},{"l":"C","t":"先定稳态基线（延迟、错误率、可用性），声明「注入某故障后指标仍在界内」的假设，FIS 模板限范围注入，观测记录后复盘找暗病"},{"l":"D","t":"混沌实验做一次拿到结论就长期结束"}],"a":["C"],"e":"✅ 正确项：C。混沌工程五步循环：定稳态——健康指标的基线先立起来；做假设——声明注入某故障后指标仍在界内；注入——FIS 按实验模板断可用区、停实例，模板限定范围与护栏；观测——指标与告警行为全程记录；复盘——找暗病修复，扩护栏再试下一轮。关联考点：域 4.3.5「通过受控故障场景实施混沌工程」。\n\n❌ A：随机打生产没有护栏没有稳态，是捣乱不是混沌工程。\n❌ B：没基线的注入过后无从判断「异常」，观测没有刻度。\n❌ D：暗病是打一轮暴露一批，实验要常态化滚动，一次结束等于白建。\n\n📌 关键概念：五步是定稳态、做假设、限范围注入、观测、复盘；没建稳态与告警先补观测再玩混沌。","s":"自编·4.3.5"},{"id":"D4-021","d":4,"t":"single","q":"Fabrikam 的混沌实验要从预发环境扩到生产环境。护栏怎么配才有资格进生产","o":[{"l":"A","t":"实验模板限范围：目标只选带标签的资源、角色最小权限、配停止条件；生产注入挑业务低峰，观测与回退就位"},{"l":"B","t":"生产注入不限范围，练才是真本事"},{"l":"C","t":"永远只在预发环境注入，生产绝对不碰"},{"l":"D","t":"实验不需要停止条件，跑完自然结束"}],"a":["A"],"e":"✅ 正确项：A。进生产的资格是护栏配齐：实验模板限定爆炸半径——目标只选带测试标签的资源、执行角色最小权限、停止条件写明；生产注入挑业务低峰窗口；观测与回退路径就位，出界即停。有护栏才有资格玩，这是混沌工程与捣乱的分界线。关联考点：域 4.3.5「通过受控故障场景实施混沌工程」。\n\n❌ B：不限范围的生产注入，一次误伤就是真事故。\n❌ C：预发打逻辑、生产打真环境且挑低峰——分级推进，绝对不碰生产等于永远验证不了真实韧性。\n❌ D：停止条件是护栏核心，没有它实验失控时无法刹车。\n\n📌 关键概念：护栏三件是模板限范围、停止条件、低峰窗口；先在预发打逻辑，护栏验证后才进生产。","s":"自编·4.3.5"},{"id":"D5-001","d":5,"t":"single","q":"团队要用基础设施即代码管理多环境，既要复用通用组件，又要支持条件判断与循环。哪种组合合适","o":[{"l":"A","t":"全部用控制台手工操作，不引入基础设施即代码"},{"l":"B","t":"只用 CloudFormation 模板，不能采用其他方式"},{"l":"C","t":"只用 CDK，完全放弃声明式模板"},{"l":"D","t":"用 CloudFormation 编写声明式模板，用 CDK 以代码方式生成模板，两者互补"}],"a":["D"],"e":"✅ 正确项：D。CloudFormation 是声明式模板，CDK 以代码方式生成 CloudFormation 模板，两者可并存互补，兼顾组件复用与逻辑表达。关联考点：域 5.1.1「用声明式与命令式方法实现基础设施即代码」。\n\n❌ A：手工控制台不可版本化、容易产生配置漂移，违背基础设施即代码原则。\n❌ B：CloudFormation 虽是基础，但否定 CDK 就放弃了代码复用与逻辑表达的优势。\n❌ C：放弃声明式模板会失去 CloudFormation 原生的治理与直接部署能力。\n\n📌 关键概念：声明式与命令式不是二选一，CDK 最终也产出 CloudFormation 模板，二者互补。","s":"自编·5.1.1"},{"id":"D5-002","d":5,"t":"single","q":"分布式应用排障困难，团队要建立可观测性，统一收集指标与日志，并做跨服务调用链追踪。哪种组合完整覆盖这三要素","o":[{"l":"A","t":"用 CloudWatch 收集指标与日志，用 AWS X-Ray 做分布式追踪"},{"l":"B","t":"只看 CloudWatch 指标就够了，日志和追踪是多余的"},{"l":"C","t":"只在出错时打印日志，不做主动采集"},{"l":"D","t":"用 S3 存放日志即可替代指标采集与分布式追踪"}],"a":["A"],"e":"✅ 正确项：A。可观测性三要素是指标、日志与分布式追踪，CloudWatch 覆盖指标与日志，X-Ray 覆盖调用链追踪，组合完整。关联考点：域 5.3.1「用标准化采集实现可观测性」。\n\n❌ B：只有指标无法定位跨服务调用链问题，日志与追踪不可省略。\n❌ C：被动打印日志缺少标准化采集与关联，排障时信息零散难用。\n❌ D：S3 只是存储，不能替代指标采集与分布式追踪的能力。\n\n📌 关键概念：可观测性等于指标加日志加追踪三者齐备，单靠任一项都不足以排查分布式故障。","s":"自编·5.3.1"},{"id":"D5-003","d":5,"t":"single","q":"Fabrikam 的治理要求：未加密的桶不允许创建、所有存储必须带租户标签、存量资源的漂移要被发现。策略即代码怎么配","o":[{"l":"A","t":"只上 Config 周报软约束，违规记录月度回顾"},{"l":"B","t":"治理规则写进制度文档，要求团队自觉遵守"},{"l":"C","t":"CloudFormation Hooks 在部署时拒绝不合规资源，CDK aspects 在合成期强制加租户标签，Config 规则运行期持续检出漂移"},{"l":"D","t":"靠人工代码评审识别全部违规配置"}],"a":["C"],"e":"✅ 正确项：C。策略即代码四件武器各守一层：CloudFormation Hooks 在栈部署时逐资源评估，不合规直接拒绝——事前拦截；CDK aspects 在合成期遍历构造树，强制加标签与加密这类出厂设置；Config 规则运行期持续评估存量——事前事后两层齐，红线才立得住。关联考点：域 5.1.2「设计策略即代码以执行主动校验、强制实施和漂移修复」。\n\n❌ A：只有事后软约束，事前该拦的照样创建出来，红线半截。\n❌ B：制度文档不是可执行拦截，策略即代码的核心就是机器执行。\n❌ D：人工评审追不上规模化变更速度，漏检是常态。\n\n📌 关键概念：三道策略是事前 Hooks、合成期 aspects、运行期 Config；事前事后两层才完整。","s":"自编·5.1.2"},{"id":"D5-004","d":5,"t":"single","q":"Contoso 漂移检测报出三处手改：两处是运维误操作，一处是故障当晚紧急手工加了节点。漂移修复怎么处理","o":[{"l":"A","t":"三处一律自动拉回模板定义状态"},{"l":"B","t":"分类处理：误操作两处自动拉回定义态，紧急扩容属于正当变更，把节点数回填进模板成为新定义态"},{"l":"C","t":"三处全部回填模板，模板跟随实际配置走"},{"l":"D","t":"忽略漂移告警，等下次变更自然覆盖"}],"a":["B"],"e":"✅ 正确项：B。漂移修复先分对错再动手：误操作的手改偏离了定义态，自动拉回恢复一致；紧急扩容是有正当理由的变更，直接拉回会把生产容量砍掉伤业务——正确动作是把节点数回填进模板，让定义态跟上经过授权的变更。关联考点：域 5.1.2「设计策略即代码以执行主动校验、强制实施和漂移修复」。\n\n❌ A：一律拉回会把紧急扩容的节点砍掉，盲目的「修复」自己就是故障源。\n❌ C：全部回填等于模板跟着手改走，误操作也变成定义态，治理失效。\n❌ D：漂移放着不管，基础设施即代码的收敛保证就名存实亡。\n\n📌 关键概念：漂移分两类——误操作拉回、正当变更回填模板；先查为什么漂，再决定怎么修。","s":"自编·5.1.2"},{"id":"D5-005","d":5,"t":"single","q":"Contoso 的数据库栈模板要求：仓库零明文密码、参数回显不泄密、数据库凭据全自动轮换。密钥管理怎么配","o":[{"l":"A","t":"密码写进模板默认参数，随模板一起入库方便查阅"},{"l":"B","t":"模板只写动态引用，创建时从 Secrets Manager 取真值，轮换由 Secrets Manager 托管，管道敏感参数不回显并过滤日志"},{"l":"C","t":"各环境统一用同一个密码，减少管理负担"},{"l":"D","t":"密码放加密参数存储，配置后不再变更"}],"a":["B"],"e":"✅ 正确项：B。基础设施代码里的密钥原则是只存引用不存真值：模板写动态引用，创建时从 Secrets Manager 动态取值——仓库与模板零明文；数据库凭据挂 Secrets Manager 自动轮换，应用经授权取用；敏感参数配不回显，管道输出日志加过滤，三处泄密口一起封。关联考点：域 5.1.3「管理基础设施代码中的密钥」。\n\n❌ A：模板入库等于密钥入库，每一个能读仓库的人都能读到密码。\n❌ C：各环境共用一个密码，泄露一次爆炸半径覆盖全部环境。\n❌ D：不轮换的凭据泄露窗口无限大，轮换与审计都是托管服务的基本价值。\n\n📌 关键概念：密钥只引用不落值；轮换托管给 Secrets Manager；不回显与日志过滤是防漏的最后两道。","s":"自编·5.1.3"},{"id":"D5-006","d":5,"t":"single","q":"Fabrikam 的基线栈（日志、网络、身份）要铺到几十个账户三个区域，新开的账户要自动继承基线。基础设施部署怎么配","o":[{"l":"A","t":"写脚本循环登录每个账户逐个跑模板"},{"l":"B","t":"用可管理权限模式，先逐账户找管理员授权"},{"l":"C","t":"把模板拷贝给各账户团队自行修改部署"},{"l":"D","t":"StackSets 服务托管模式以组织单元为目标一次定义并行铺开，开自动部署让新账户进单元即自动继承基线"}],"a":["D"],"e":"✅ 正确项：D。规模化部署的正解是 StackSets：服务托管模式配合 Organizations——以组织单元为目标、免逐账户授权；一份模板并行铺到多账户多区域，一次定义全组织收敛；开启自动部署后，新账户进入组织单元基线栈自动创建，零手工继承。关联考点：域 5.1.4「设计多账户和多区域的基础设施部署」。\n\n❌ A：逐账户跑脚本没有自动继承，新账户照旧漏基线，规模化下不可持续。\n❌ B：既然有 Organizations，服务托管模式免逐账户授权，选还要授权的模式是自找麻烦。\n❌ C：模板拷贝各改各的，基线定义态四处发散，漂移从源头就管不住。\n\n📌 关键概念：StackSets 三件是一次定义全组织收敛、服务托管免授权、新账户自动继承；手改靠漂移检测兜住。","s":"自编·5.1.4"},{"id":"D5-007","d":5,"t":"single","q":"Tailspin 要把从代码提交到生产的发布全流程自动化。CI/CD 管道怎么编排","o":[{"l":"A","t":"跳过测试阶段，构建完直接部署抢速度"},{"l":"B","t":"提交触发管道，CodeBuild 按构建规范编译加单元测试，构建后自动测试与镜像扫描，CodeDeploy 按策略部署，制品带提交指纹全程可回溯"},{"l":"C","t":"每个环境各自重新构建一套制品，环境隔离更干净"},{"l":"D","t":"生产部署完全自动放行，不设人工环节"}],"a":["B"],"e":"✅ 正确项：B。管道四阶段各司其职：源阶段——代码提交自动触发；构建阶段——CodeBuild 按构建规范跑编译、单元测试、打镜像；测试阶段——自动验证接在构建后，集成测试加镜像扫描；部署阶段——CodeDeploy 按策略上环境；制品带提交指纹一路带到生产，出问题可回溯到具体提交。关联考点：域 5.2.1「设计 CI/CD 方案以编排自动化构建和部署管道」。\n\n❌ A：跳过测试省十分钟，一次生产事故赔的是一晚上加信任。\n❌ C：各环境重新构建破坏「测试过的二进制才是上生产的二进制」，不可比。\n❌ D：自动化到可自动的部分，生产晋级的人闸与门禁仍要在。\n\n📌 关键概念：四阶段是源、构建、测试、部署；制品可追溯贯穿全程。","s":"自编·5.2.1"},{"id":"D5-008","d":5,"t":"multiple","q":"Contoso 的支付服务管道要上 DevSecOps 门禁：漏洞不带上线、制品防篡改。哪些配置正确（选所有适用项）","o":[{"l":"A","t":"构建阶段 Inspector 扫依赖与代码，镜像入仓即扫，部署前再复扫——三层扫描"},{"l":"B","t":"只在构建时扫一次，后续环节不再扫"},{"l":"C","t":"扫描结果分级处置：高危红牌停线，中危开单限期修，低危进债务清单月度清"},{"l":"D","t":"制品出库前签名，部署前验签，被篡改的制品部署不了"},{"l":"E","t":"门禁一律设为阻断，任何级别漏洞都停线"}],"a":["A","C","D"],"e":"✅ 正确项：A、C、D。管道安全三件配齐：扫描三层——构建时 Inspector 扫依赖与代码、镜像入仓即扫、部署前复扫，三层时效不同各有把关；门禁分级——高危停线、中危限期、低危进债务清单，按严重度处置才不堵发布；签名链——制品出库前签名、部署前验签，跨环境流转全程防篡改。关联考点：域 5.2.2「在管道中实施安全扫描以评估漏洞并签名制品」。\n\n❌ B：只扫一次漏掉入仓与部署窗口的新披露漏洞，时效不齐。\n❌ E：任何级别都停线，低危漏洞堵死发布节奏，分级处置才是可持续的门禁。\n\n📌 关键概念：扫描三层、门禁分级、制品签名验签；签名在跨环境流转时价值最大。","s":"自编·5.2.2"},{"id":"D5-009","d":5,"t":"single","q":"Fabrikam 的制品要在开发、测试、生产三个账户间流转，要防止被篡改的制品混进部署。机制怎么配","o":[{"l":"A","t":"制品桶设为私有，访问受限就等于防篡改"},{"l":"B","t":"签名验证流程太繁琐，靠人工核对版本号确认"},{"l":"C","t":"制品出库前签名，部署前验签，验签不过直接拒绝部署"},{"l":"D","t":"只在生产部署这一步做签名校验"}],"a":["C"],"e":"✅ 正确项：C。制品防篡改靠签名链闭环：制品构建完成、出库前做签名——签的是真身；每次部署前验签——被篡改或来源不明的制品验签不过，部署直接拒绝，跨环境流转全程可控。关联考点：域 5.2.2「在管道中实施安全扫描以评估漏洞并签名制品」。\n\n❌ A：私有桶限制访问权，防不了中途被改内容，私有与防篡改是两回事。\n❌ B：人工核对版本号挡不住同名假制品，机器验签才是硬闸。\n❌ D：只在最后一步验签，中间环节被换的制品一路绿灯，签名在流转全程都要验。\n\n📌 关键概念：出库前签名、部署前验签；签名链的价值随跨环境流转而放大。","s":"自编·5.2.2"},{"id":"D5-010","d":5,"t":"single","q":"Fabrikam 的集中发布平台：管道账户负责构建与测试，部署目标是各业务账户的三个区域环境。跨账户管道怎么配","o":[{"l":"A","t":"在各业务账户创建长期 IAM 用户，管道保存凭据部署"},{"l":"B","t":"各环境重新构建一次，保证环境制品干净"},{"l":"C","t":"生产晋级全自动放行，加快发布节奏"},{"l":"D","t":"目标账户建部署角色信任管道角色并带外部 ID，制品一次构建流经三区域，生产晋级前人工审批"}],"a":["D"],"e":"✅ 正确项：D。跨账户管道三件配齐：角色委派——目标账户的部署角色只信任管道角色切换过来执行，信任条件带外部 ID，全程无长期凭据；制品流——一次构建处处部署，同一制品流经三个区域，测试过的就是部署的；门禁——晋级到生产的最后一段加人工审批动作放行。关联考点：域 5.2.3「配置多账户和多区域部署管道，包含角色委派和制品晋级」。\n\n❌ A：长期凭据散在各账户是泄露面，角色委派加外部 ID 才是正解。\n❌ B：各环境重编译破坏制品一致性，测试过的二进制才敢上生产。\n❌ C：生产晋级的人闸是最后防线，全自动放行省不了这一步。\n\n📌 关键概念：委派不落凭据、一次构建处处部署、生产晋级有人闸。","s":"自编·5.2.3"},{"id":"D5-011","d":5,"t":"single","q":"Contoso 的客服助手上线前有三个候选模型，RAG 的答案质量要评，上线后每个版本都要有质量门槛。评估体系怎么配","o":[{"l":"A","t":"三个候选模型用同一套固定评测集同卷打分；RAG 的检索命中率与答案接地度分开评；上线后每版本跑回归评测，分数跌破门槛自动回滚"},{"l":"B","t":"选型靠团队感觉，用着顺就是好模型"},{"l":"C","t":"评测题集每次随机换一批，考察更全面"},{"l":"D","t":"上线即终点，模型行为长期稳定无需评估"}],"a":["A"],"e":"✅ 正确项：A。AI 质量门三段配齐：选型评估——三个候选模型跑同一套固定评测集，同卷打分才可比；RAG 评估——检索质量与答案接地度分开评，检索对不对与答案贴不贴是两件事；持续验证——上线后每版本跑回归评测，分数跌破门槛自动回滚版本，「感觉不错」不是质量证据。关联考点：域 5.2.4「评估 AI/ML 应用并验证输出」。\n\n❌ B：模型选型靠人感没有证据链，换个人感受就换结论。\n❌ C：评测集要固定，换题就不可比——回归评测的意义在同卷对照。\n❌ D：上线后模型会漂移、版本会变化，没有回归门槛就是裸奔。\n\n📌 关键概念：Bedrock Evaluations 三段是选型同卷、RAG 分评、上线回归；评测集是资产要维护。","s":"自编·5.2.4"},{"id":"D5-012","d":5,"t":"multiple","q":"Fabrikam 的接口发布要求又快又稳且出问题能回退。关于部署策略，哪些说法正确（选所有适用项）","o":[{"l":"A","t":"金丝雀按 5% 放量观察，错误率与延迟达标再自动放量，出问题一键收流量回退"},{"l":"B","t":"蓝绿部署回滚等于切回旧环境，秒级完成，代价是窗口期双倍资源"},{"l":"C","t":"数据库表结构变更靠蓝绿切流回滚数据"},{"l":"D","t":"无状态可快速重建的服务用滚动部署，成本最低"},{"l":"E","t":"滚动部署把全部实例一批同时替换，速度最快"}],"a":["A","B","D"],"e":"✅ 正确项：A、B、D。三策略各取所长：金丝雀先放小流量试错——5% 放量观察十五分钟，指标达标自动放量，出问题收流量即回退，风险最小；蓝绿两套环境并行——回滚就是切回旧环境，秒级，代价是窗口期双倍资源；无状态可快速重建的服务滚动部署分批替换，成本最低。关联考点：域 5.2.5「实施提供回滚能力的部署策略」。\n\n❌ C：蓝绿回滚的是流量不是数据——数据库变更要走向前兼容设计：新列先加、代码分两版上、旧列后删。\n❌ E：滚动分批替换批次间有缓冲，全量一批同时替换没有灰度，出问题就是全停。\n\n📌 关键概念：秒级回退选蓝绿、风险最小选金丝雀、成本最低选滚动；数据变更向前兼容，别指望切流回滚。","s":"自编·5.2.5"},{"id":"D5-013","d":5,"t":"single","q":"Contoso 的发布要携带数据库表结构变更，同时不能破坏代码回滚能力。数据库变更怎么设计","o":[{"l":"A","t":"表结构与代码同一版本一次上线，回滚时连数据一起回退"},{"l":"B","t":"先删旧列再上新列，避免新旧列冲突"},{"l":"C","t":"向前兼容三步走：新列先加并双写过渡，代码分两版上线，旧列确认无引用后再删；回滚只切代码版本不动数据"},{"l":"D","t":"数据库变更配合蓝绿切换，靠切流回滚数据"}],"a":["C"],"e":"✅ 正确项：C。数据库变更的回滚靠向前兼容设计：第一步新列先加上、新代码双写新旧列；第二步代码分两版上线过渡，读写逐步切到新列；第三步旧列确认无引用后再删——任何一步出问题，回滚只需切回旧代码版本，数据层始终兼容两版代码。关联考点：域 5.2.5「实施提供回滚能力的部署策略」。\n\n❌ A：结构与代码绑死一版，回滚就要连带回退数据，删掉的列回不来。\n❌ B：先删旧列等于旧代码立即失效，两版并存过渡期被跳过，出问题无路可退。\n❌ D：蓝绿回滚的是流量不是数据——切流救不了已经执行的表结构变更。\n\n📌 关键概念：数据变更向前兼容三步走；回滚切流量不切数据，数据库别指望切流回滚。","s":"自编·5.2.5"},{"id":"D5-014","d":5,"t":"single","q":"Fabrikam 的容器平台有三个集群，要快速排出「内存打满被逐」的嫌疑任务，并把应用指标关联到任务维度。监控怎么配","o":[{"l":"A","t":"登录每个节点手工跑进程监控命令排查"},{"l":"B","t":"显式启用 Container Insights，用集群、服务、任务级的资源与健康指标聚合视图排嫌疑，应用指标打通到任务维度可跳转"},{"l":"C","t":"容器洞察默认自动开启，无需配置"},{"l":"D","t":"只看节点 CPU 利用率就足够定位"}],"a":["B"],"e":"✅ 正确项：B。容器监控三层一次配齐：资源面——Container Insights 出集群、节点、任务级的 CPU、内存用量与限额利用率，限额打满的嫌疑任务一眼排出；健康面——重启计数与失联状态；应用面——应用指标关联到任务维度，深排障可跳转链路。关联考点：域 5.3.2「为容器化应用实施监控」。\n\n❌ A：手工逐节点排查在多集群规模下不现实，也没有任务维度的聚合视图。\n❌ C：容器洞察默认不开，要显式启用——这是最常见的配置遗漏。\n❌ D：只看资源面看不出业务慢——容器级、应用级、追踪三层联动才是深排障。\n\n📌 关键概念：容器洞察三层是资源、健康、应用；默认不开要显式启用，大集群注意指标成本。","s":"自编·5.3.2"},{"id":"D5-015","d":5,"t":"single","q":"Contoso 三十多个账户的审计与应用错误日志要集中检索并长期归档。日志聚合怎么配","o":[{"l":"A","t":"各账户每周手工导出日志文件传到中心账户"},{"l":"B","t":"全部日志原样复制进中心账户全量保存"},{"l":"C","t":"日志各自留在各账户本地，检索时逐账户登入"},{"l":"D","t":"日志账户建共享目标并以资源策略授权成员账户投递，成员账户配订阅过滤器只送有价值日志，检索期短留 CloudWatch 后转 S3 归档层长留"}],"a":["D"],"e":"✅ 正确项：D。多账户日志聚合三步配齐：目标建立——日志账户建共享目标，资源策略授权成员账户投递；订阅过滤——成员账户日志组配订阅过滤器，按模式筛，有价值的才进中心，全量搬是成本黑洞；分层归档——检索期短留在 CloudWatch，长期转 S3 归档层，月成本比全量聚合省一个量级。关联考点：域 5.3.3「通过跨账户订阅和集中归档实现多账户日志聚合」。\n\n❌ A：手工导出不可持续，时间序与完整性都保证不了。\n❌ B：全量原样复制，调试级日志也进中心，聚合成本失控。\n❌ C：集中检索落空，跨账户排障等于没有日志中台。\n\n📌 关键概念：跨账户订阅带过滤、检索短留、归档转 S3；全量聚合是成本黑洞，先筛再送。","s":"自编·5.3.3"},{"id":"D5-016","d":5,"t":"single","q":"Fabrikam 的日志中台上线后发现中心成本远超预算。优化方向是","o":[{"l":"A","t":"订阅过滤器按模式收紧：调试级日志不送中心，只送错误与审计类高价值日志"},{"l":"B","t":"把订阅过滤规则全部去掉，多送一些日志不遗漏"},{"l":"C","t":"中心存储全部用热存储层，检索快最重要"},{"l":"D","t":"错误日志也停送，出事时再到各账户本地查"}],"a":["A"],"e":"✅ 正确项：A。日志聚合成本超支的第一杠杆是入口过滤：订阅过滤器按模式收紧——调试级日志留在本地不送中心，只有错误与审计类高价值日志进入集中体系；配合分层归档（检索期短留、之后转 S3 归档层），中心成本从源头压下来。关联考点：域 5.3.3「通过跨账户订阅和集中归档实现多账户日志聚合」。\n\n❌ B：去掉过滤多送日志，中心成本进一步失控，方向反了。\n❌ C：全用热存储层，长期留存的部分白付贵档，归档层就是为长留设计的。\n❌ D：错误日志停送等于把最有排障价值的日志挡在门外，中台失去意义。\n\n📌 关键概念：聚合先筛——订阅过滤是入口闸门；检索短留、归档长留分层控成本。","s":"自编·5.3.3"},{"id":"D5-017","d":5,"t":"single","q":"Contoso 的告警体系信噪比太低，值班疲于奔命，真实故障反而被淹没。告警治理怎么配","o":[{"l":"A","t":"告警全量发送给全员，确保一个不漏"},{"l":"B","t":"分级扇出（一级电话短信、二级值班群、三级工单），流量型指标用异常检测基线、错误率用固定红线，多周期确认防抖动，季度回顾砍掉无人认领的告警"},{"l":"C","t":"把所有告警阈值一律调高，减少告警数量"},{"l":"D","t":"告警统一发邮件，值班人员自行认领"}],"a":["B"],"e":"✅ 正确项：B。告警治理四件一起上：分级扇出——一级电话加短信双通道、二级值班群、三级工单，级别对应响应方式；策略分型——流量型周期波动指标用异常检测基线，错误率这类硬红线用固定阈值；防抖动——阈值加持续期多周期确认；信噪比闭环——季度回顾会砍掉没人认领的噪音告警。关联考点：域 5.3.4「配置告警方案」。\n\n❌ A：全量发全员，每个人都淹没在噪音里，真正的紧急告警失去区分度。\n❌ C：一律调高阈值，真实故障被漏报，用漏报换降噪是拆东墙补西墙。\n❌ D：邮件自认领没有责任人闭环，告警等于没报。\n\n📌 关键概念：告警要分级、分型、防抖、季度砍噪音；信噪比是告警体系的生命线。","s":"自编·5.3.4"},{"id":"D5-018","d":5,"t":"multiple","q":"Fabrikam 的智能客服上线后要持续监控，防止模型悄悄变差没人发现。哪些指标该纳入监控（选所有适用项）","o":[{"l":"A","t":"只要盯推理时延与错误率就足够了"},{"l":"B","t":"模型性能：月度用带标注的评测集跑回归，跟踪准确率变化"},{"l":"C","t":"智能体性能：任务与步骤成功率、工具调用失败率"},{"l":"D","t":"模型漂移：输入分布与预测分布的监控，偏移即预警"},{"l":"E","t":"准确性监控不用评测集，统计用户点踩数量就行"}],"a":["B","C","D"],"e":"✅ 正确项：B、C、D。AI 监控四类指标配齐：模型性能——固定评测集月度回归，准确率随时间的变化可对比；智能体性能——任务与步骤成功率、工具调用失败率，卡在哪一步一目了然；模型漂移——输入与预测分布监控，数据漂移与概念漂移两种形态都要盯，缺漂移的监控是温水煮青蛙。关联考点：域 5.3.5「监控 AI/ML 工作负载指标，包括模型性能、AI 智能体性能、推理时延和模型漂移」。\n\n❌ A：时延与错误率是运行面指标，模型变差不报错不超时，四类缺一不可。\n❌ E：点踩数可作参考但样本有偏——没带标注评测集的准确性监控是空话。\n\n📌 关键概念：AI 四指标是性能、智能体、时延、漂移；准确性监控的前提是带标注的评测集。","s":"自编·5.3.5"},{"id":"D5-019","d":5,"t":"single","q":"Contoso 的风控模型分数近一个月整体偏移，事后排查发现是人群结构变化所致。哪类监控能提前发现这类问题","o":[{"l":"A","t":"输入特征分布监控——数据漂移预警后触发重训评估"},{"l":"B","t":"推理时延监控——时延升高说明分布变了"},{"l":"C","t":"调用错误率监控——分布偏移会先报错"},{"l":"D","t":"无需监控，训练好的模型天然稳定"}],"a":["A"],"e":"✅ 正确项：A。模型漂移监控盯分布：输入特征的分布随时间偏移（人群结构变化就是典型数据漂移），监控面板在分布偏移时就预警——早于业务侧发现分数整体跑偏，预警后触发重训或再评估，把问题挡在业务感知之前。关联考点：域 5.3.5「监控 AI/ML 工作负载指标，包括模型性能、AI 智能体性能、推理时延和模型漂移」。\n\n❌ B：时延监控管响应速度，分布变化不影响推理耗时，看不见漂移。\n❌ C：分布漂移不产生调用错误——模型照常出分，只是分不准，错误率抓不到。\n❌ D：模型不静态——数据在变、行为在漂，没监控的模型是悄悄失效的。\n\n📌 关键概念：漂移两形态是数据漂移与概念漂移；盯输入与预测分布，预警早于业务感知。","s":"自编·5.3.5"},{"id":"D5-020","d":5,"t":"single","q":"Fabrikam 遇到一次亚太用户投诉页面慢、但服务器侧指标全部正常的体验问题。哪组监控能定位这类问题","o":[{"l":"A","t":"只看服务器侧 CPU 与延迟指标"},{"l":"B","t":"全靠用户投诉发现体验问题"},{"l":"C","t":"合成金丝雀多地域全天候跑关键路径排除自家服务故障，RUM 采集真实会话的加载与报错，定位到第三方脚本阻塞"},{"l":"D","t":"RUM 把用户表单原值全量采集回来分析"}],"a":["C"],"e":"✅ 正确项：C。体验监控两路互补：合成监控——金丝雀脚本多地域全天候跑「登录、下单」关键路径，自家服务是否挂、是否地域性问题先排除；真实用户监控——RUM 收真实会话的加载时间、前端错误与地理分布，用户真实感受直采——第三方脚本阻塞这类「服务端正常但用户端慢」的问题只有 RUM 看得见。关联考点：域 5.3.6「为用户体验设计监控方案，使用合成事务和真实用户监控」。\n\n❌ A：服务器指标正常恰恰是这类问题的特征，用户侧瓶颈在服务端视图之外。\n❌ B：等投诉才发现，被动且样本有偏，没有连续观测面。\n❌ D：RUM 采集要脱敏，表单原值带回敏感数据是隐私事故。\n\n📌 关键概念：合成知道挂没挂、RUM 知道慢不慢——两路互补；RUM 采集内容要脱敏。","s":"自编·5.3.6"},{"id":"D5-021","d":5,"t":"single","q":"Contoso 的交易服务对外承诺 99.95% 月度可用性。内部服务质量管理怎么配","o":[{"l":"A","t":"对外承诺由市场部自行确定，技术团队不用跟进"},{"l":"B","t":"SLO 定完就供着，达成与否年底看一次"},{"l":"C","t":"内部工具全部上 SLO，一视同仁"},{"l":"D","t":"SLI 用成功请求率加 P99 延迟，SLO 定月度 99.95%，错误预算跟踪——预算烧太快按燃烧率提前告警，烧完冻结新功能先修稳定性"}],"a":["D"],"e":"✅ 正确项：D。SLO 落地三件事：定 SLI——可用性（成功请求占比）与延迟（P99 达标占比）两件最常用；定预算——99.95% 月度对应允许失败的余量，预算花法是产品决策；告警联动——按燃烧率告警，预算消耗速度异常提前叫，不是月末才发现；预算烧完，当期优先修可靠性冻结新功能。关联考点：域 5.3.7「设计服务级别目标，具有可度量指标和告警」。\n\n❌ A：对外承诺 99.95 实际只有 99.5 是合同事故——承诺必须有内部 SLO 支撑。\n❌ B：SLO 要定期复盘：达不成就松一松或投入修，定完就供着失去管理意义。\n❌ C：内部工具不必全员上 SLO，核心链路先。\n\n📌 关键概念：SLO 是内部量化管理带错误预算；燃烧率告警优于低于阈值告警。","s":"自编·5.3.7"},{"id":"D5-022","d":5,"t":"single","q":"Fabrikam 的一次发布半天烧掉月度错误预算的一半。哪种告警方式能最早发现这种异常消耗","o":[{"l":"A","t":"月末汇总报表回顾预算使用情况"},{"l":"B","t":"燃烧率告警——预算消耗速度超阈值就提前告警，而不是等月底看总数"},{"l":"C","t":"只在可用性低于 99.9% 时才触发告警"},{"l":"D","t":"不设预算告警，等用户投诉自然暴露"}],"a":["B"],"e":"✅ 正确项：B。燃烧率告警盯的是预算消耗的速度而非期末总量：错误预算按速率烧——半天烧掉一半意味着燃烧率是预算允许的十几倍，燃烧率告警在消耗速度超阈值时就触发，当周就能冻结发布先修稳定性；月末报表回顾发现同样问题时，预算早已烧穿。关联考点：域 5.3.7「设计服务级别目标，具有可度量指标和告警」。\n\n❌ A：月末回顾发现「半天烧一半」时已经过去数周，错过止血窗口。\n❌ C：低于 99.9% 才告警——可用性跌破线时预算实际已经烧穿了，滞后。\n❌ D：用户投诉是被动信号，等它暴露时故障面已经扩散。\n\n📌 关键概念：燃烧率管速度、总量告警管结果——预算烧太快提前叫，Application Signals 自动发现服务并联动。","s":"自编·5.3.7"},{"id":"D5-023","d":5,"t":"single","q":"Fabrikam 的运营底盘要求：核心指标告警要有值班响应、容量瓶颈要提前发现（曾发生过业务涨三倍先撞限额）、事件处理要有闭环。怎么配","o":[{"l":"A","t":"告警统一发邮件，容量靠季度人工评估"},{"l":"B","t":"只监控资源水位，配额上限不用管"},{"l":"C","t":"CloudWatch 告警三级进值班渠道，Service Quotas 给限额设八成预警提前发现，EventBridge 把事件路由到工单进运维项闭环跟踪"},{"l":"D","t":"容量问题一律靠加资源解决"}],"a":["C"],"e":"✅ 正确项：C。运营底盘三件配齐：健康层——CloudWatch 告警盯关键指标，按级别进值班渠道；容量层——Service Quotas 盯限额使用率并设八成预警，云上「容量不足」常是配额不是资源，提前两天发现比事后救火从容；响应层——EventBridge 把告警与事件路由到值班与工单，运维项聚合成待办闭环跟踪。关联考点：域 5.4.1「实施健康监控、容量规划和运营响应」。\n\n❌ A：邮件告警没有响应分级，季度人工评估配不上「业务涨三倍」的动态节奏。\n❌ B：忽略配额监控，撞限额的时候资源水位完全正常，瓶颈在配额侧。\n❌ D：撞限额的「容量不足」加资源没用——先提配额或做架构优化，一概加资源是误诊。\n\n📌 关键概念：运营三件是健康告警、配额预警、事件响应链；告警没人认领等于没有。","s":"自编·5.4.1"},{"id":"D5-024","d":5,"t":"multiple","q":"Contoso 的自动修复方案上线前评审「失控形态」，防止修复动作自己变成故障源。哪些护栏该配上（选所有适用项）","o":[{"l":"A","t":"重试用指数退避加随机抖动，并设次数上限"},{"l":"B","t":"对慢响应的下游配熔断，连续失败到阈值就断开走降级路径"},{"l":"C","t":"修复脚本失败后无限重试，直到成功为止"},{"l":"D","t":"调用不同下游的资源分舱隔离，一舱堆积不拖垮其他任务"},{"l":"E","t":"重试间隔固定统一，所有客户端整齐重试"}],"a":["A","B","D"],"e":"✅ 正确项：A、B、D。受控修复四件护栏配三件齐：指数退避加抖动——间隔随失败次数翻倍并加随机量错开，防齐步走打爆下游，配次数上限；熔断——连续失败到阈值断开一段时间，快速失败走缓存降级；舱壁——调用不同下游的资源分舱隔离，一舱打满不拖全船。关联考点：域 5.4.2「配置带安全约束的受控修复方案」。\n\n❌ C：无限重试是自愈风暴的源头，修复动作自己变成故障源。\n❌ E：固定间隔统一重试，所有客户端同一时刻齐步走，瞬时流量尖峰直接打爆下游。\n\n📌 关键概念：修复四护栏是退避加抖动、熔断、限流、舱壁；先想好失控形态再上自动化。","s":"自编·5.4.2"},{"id":"D5-025","d":5,"t":"single","q":"Fabrikam 的修复脚本调用下游失败时要做受控重试。重试间隔怎么设计","o":[{"l":"A","t":"固定短间隔连续重试，尽快恢复服务"},{"l":"B","t":"指数退避加随机抖动：间隔随失败次数指数增长，再叠加随机量把各客户端的重试错开"},{"l":"C","t":"间隔越短越好，密集试探下游状态"},{"l":"D","t":"不做任何重试，失败直接放弃上报"}],"a":["B"],"e":"✅ 正确项：B。受控重试的正确形态：间隔随失败次数指数增长——给下游喘息与恢复的时间窗；叠加随机抖动——把不同客户端的重试时刻错开，避免同一瞬间齐步走形成流量尖峰；配合次数上限，超限转熔断或人工，重试从「轰炸」变成「有节奏的试探」。关联考点：域 5.4.2「配置带安全约束的受控修复方案」。\n\n❌ A：固定短间隔连发等于持续轰炸，下游没恢复反而被压得更死。\n❌ C：密集试探与连续轰炸同病，越短越危险。\n❌ D：完全不重试丢掉了对瞬态故障的自愈能力——受控重试正是为此设计。\n\n📌 关键概念：指数退避加抖动防齐步走；重试要带次数上限，超限走熔断降级。","s":"自编·5.4.2"},{"id":"D5-026","d":5,"t":"single","q":"Tailspin 的行情网关流量有明确的开收盘规律加盘中波动，要求开盘即满血、夜间不浪费。扩缩容怎么配","o":[{"l":"A","t":"只用 CPU 利用率做目标跟踪扩缩"},{"l":"B","t":"全天常驻满容量，确保任何时刻都顶得住"},{"l":"C","t":"人工盯盘，高峰前手工扩容"},{"l":"D","t":"预测性按周规律开盘前预热，目标跟踪盯每实例请求速率动态加减，收盘定时缩容——三层组合"}],"a":["D"],"e":"✅ 正确项：D。扩缩容三层各管一段：预测性扩缩容学习日与周的流量规律，开盘前三十分钟把容量布好——流量到了容量已在；目标跟踪盯对用户体感敏感的指标（每实例请求速率），盘中波动动态加减；定时扩缩容卡收盘日程，夜间缩容不浪费。扩快缩慢，缩容带冷却期防抖动。关联考点：域 5.4.3「配置基于指标的自动扩缩容策略和定时扩缩容策略」。\n\n❌ A：CPU 是滞后指标——等 CPU 报警时用户体感已经慢了；扩容指标要选对体感敏感的。\n❌ B：全天满容量，夜间闲置部分白付，弹性价值全丢。\n❌ C：人工盯盘既不可持续也跟不上分钟级流量变化。\n\n📌 关键概念：预测性预热、目标跟踪跟流量、定时卡日程；指标选体感敏感的，别选滞后的 CPU。","s":"自编·5.4.3"},{"id":"D5-027","d":5,"t":"single","q":"Contoso 的无状态接入层要配置全自动故障恢复。哪种组合正确","o":[{"l":"A","t":"Auto Scaling 用负载均衡健康检查判定换机，ECS 任务失败自动替换并配部署断路器回滚坏版本，异步函数失败自动重试、超限进死信队列"},{"l":"B","t":"数据库实例也用替换式自愈，崩了直接换台新的"},{"l":"C","t":"用实例自检脚本作为健康判定依据"},{"l":"D","t":"重试不设上限，修不好就一直重试下去"}],"a":["A"],"e":"✅ 正确项：A。无状态层的自愈三层就位：实例层——Auto Scaling 用负载均衡健康检查判定换机，它比实例自检真实，应用挂了实例还在的假健康逃不掉；容器层——ECS 任务失败自动替换，部署断路器连续失败自动回滚上个版本；函数层——异步调用失败自动重试，超限进死信队列供人工处置。关联考点：域 5.4.4「设计使用健康检查和替换策略的自动故障恢复方案」。\n\n❌ B：有状态层不能替换式自愈——数据库的恢复是复制与切换，直接换新等于丢数据。\n❌ C：实例自检探不到「应用挂了实例还在」的假健康，负载均衡健康检查才从外部验真实。\n❌ D：无限重试是自愈风暴，修不了的转人工升级。\n\n📌 关键概念：自愈三层是换机、替任务、函数重试进死信；替换要有频率护栏，有状态层的恢复走复制与切换。","s":"自编·5.4.4"},{"id":"D5-028","d":5,"t":"single","q":"Fabrikam 的例行运维任务（补丁、日志清理、扩容）长期「有文档没人跑、跑的时候文档已过期」。怎么根治","o":[{"l":"A","t":"把文档重新抄写一遍发给全员强调执行"},{"l":"B","t":"复盘改成追责会，谁没按文档执行谁担责"},{"l":"C","t":"操作写成 Systems Manager 自动化文档由机器执行、带审批与执行记录，定时任务调度触发、事件走应急通道，复盘改进项回填手册并跟踪手册过期率"},{"l":"D","t":"文档归档存证备查即可，执行靠自觉"}],"a":["C"],"e":"✅ 正确项：C。手册即代码根治执行难：例行操作写成 Systems Manager 自动化文档——机器可执行、可参数化、留执行记录；触发分路——定时跑批用调度触发，事件触发走应急通道，人工一键执行走审批；闭环回填——每次复盘的改进项回填手册，手册过期率当团队指标，文档不再过期。关联考点：域 5.4.5「为运营任务配置自动化运行手册和事件响应规程」。\n\n❌ A：重新抄写一遍文档，执行的痛点是没人跑与过期，不是没文档。\n❌ B：追责氛围只会让问题被掩盖——复盘的产出是改进项，不是责任人名单。\n❌ D：归档存证的文档没有执行链路，过期照旧过期。\n\n📌 关键概念：手册即代码是机器执行加审批留痕；复盘产出改进项回填手册，过期率当指标。","s":"自编·5.4.5"}];
const QUIZ_MOCK_POOL = [];
const QUIZ_MOCK_SCORED = [];
</script>
<script>

/* ================================================================
   ===================== 题库数据（构建注入 QUIZ_META + QUIZ_QUESTIONS） ================
   ================================================================ */
// 模考池隔离（构建注入 QUIZ_MOCK_POOL；无模考池的科目为空集，行为不变）
const MOCK_IDS = (typeof QUIZ_MOCK_POOL !== "undefined" && QUIZ_MOCK_POOL) ? new Set(QUIZ_MOCK_POOL) : new Set();
// 模考池题目（仅全真模考可见；练习模式与统计一律不含）
const MOCK_QUESTIONS = QUIZ_QUESTIONS.filter(q => MOCK_IDS.has(q.id));
// 计分题 id：官方 65 题里 50 题计分、15 题不计分 —— 不计分题只上卷面，不参与判分
const MOCK_SCORED = (typeof QUIZ_MOCK_SCORED !== "undefined" && QUIZ_MOCK_SCORED) ? new Set(QUIZ_MOCK_SCORED) : new Set();
const QUESTIONS = QUIZ_QUESTIONS.filter(q => !MOCK_IDS.has(q.id));
const META = (typeof QUIZ_META !== 'undefined' && QUIZ_META) ? QUIZ_META : {};
const EXAM = META.exam || 'QUIZ';
const LS_PREFIX = META.lsPrefix || EXAM.toLowerCase();

const GLOSSARY = META.glossary || {};

function getGlossaryForQuestion(q) {
  const texts = [q.q];
  if(q.o && Array.isArray(q.o)) q.o.forEach(o => texts.push(o.t));
  if(q.e) texts.push(q.e);
  const fullText = texts.join(' ');
  const found = [];
  const sorted = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
  for(const term of sorted) {
    if(fullText.includes(term)) found.push({term, def: GLOSSARY[term]});
  }
  return found;
}

/* ================================================================
   ===================== 术语高亮 + 弹定义 ================
   ================================================================ */
// 长词优先排序，独立 token 边界匹配，避免 EBS 误标 Amazon EBS 中的 EBS 等
function getGlossarySortedKeys() {
  return Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
}

// 判断术语在文本中是否为独立出现（前后非字母/数字）
function isIndependentToken(text, idx, term) {
  const before = text[idx-1];
  const after = text[idx + term.length];
  const isLetter = c => c && /[A-Za-z0-9]/.test(c);
  return !isLetter(before) && !isLetter(after);
}

// 将解析正文中的术语高亮为可点击 span，返回 HTML
function fmtExp(s){ let t=(s===undefined||s===null)?'':String(s); t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); t=t.replace(/\n/g,'<br>'); t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); return t; }
function highlightGlossaryTerms(text) {
  if(!text) return text;
  const sortedKeys = getGlossarySortedKeys();
  let result = '';
  let i = 0;
  while(i < text.length) {
    let matched = false;
    for(const term of sortedKeys) {
      if(!term) continue;
      const idx = text.indexOf(term, i);
      if(idx === i && isIndependentToken(text, idx, term)) {
        const def = GLOSSARY[term] || '（暂无定义）';
        const termEsc = term.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const defEsc = def.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        result += `<span class="gloss-term" onclick="showGlossTip(event,'${termEsc}','${defEsc}')">${term}</span>`;
        i += term.length;
        matched = true;
        break;
      }
    }
    if(!matched) {
      // 中文等宽字符直接输出，保持原文本
      result += text[i];
      i++;
    }
  }
  return result;
}

// 点击术语弹出定义浮层
function showGlossTip(e, term, def) {
  e.stopPropagation();
  const tip = document.getElementById('glossTip');
  document.getElementById('glossTipTerm').textContent = term;
  document.getElementById('glossTipDef').textContent = def || '（暂无定义）';
  tip.style.display = 'block';
  // 定位：优先在点击位置下方，避免超出视口
  const pad = 12;
  let left = e.clientX + pad;
  let top = e.clientY + pad;
  // 先渲染再量尺寸
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if(left + tw > window.innerWidth - 8) left = e.clientX - tw - pad;
  if(top + th > window.innerHeight - 8) top = e.clientY - th - pad;
  if(left < 8) left = 8;
  if(top < 8) top = 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

function closeGlossTip() {

/* ================================================================
   ===================== localStorage 操作 =========================
   ================================================================ */
const LS_ANSWERS = LS_PREFIX + '_answers';
const LS_WRONG   = LS_PREFIX + '_wrong';
const LS_PROGRESS = LS_PREFIX + '_progress';

function getAnswers() { return JSON.parse(localStorage.getItem(LS_ANSWERS)||'[]'); }
function setAnswers(a) { localStorage.setItem(LS_ANSWERS,JSON.stringify(a)); }
function getWrong() { return JSON.parse(localStorage.getItem(LS_WRONG)||'[]'); }
function setWrong(w) { localStorage.setItem(LS_WRONG,JSON.stringify(w)); }
function getProgress() { return JSON.parse(localStorage.getItem(LS_PROGRESS)||'{}'); }
function setProgress(p) { localStorage.setItem(LS_PROGRESS,JSON.stringify(p)); }

/* ----------------------------------------------------------------
   作答记录：会话态 / 累计统计态分离（修复）
   旧缺陷：模拟考核误读全局 localStorage 历史 → 进场即显示「已答对/曾答错」、
   题号导航提前染色、成绩单把练习与往场算进本次（实测正确数>题数、未答为负、
   分数超满分、正确率>100%）。
   三态口径：
     · sessionResults()       本场逐题作答（quizState.results）＝「本次」唯一真源
     · sessionScopedAnswers() 视图用作答集：考核=仅本场；练习模式=全局历史（原行为）
     · recordAnswer()         仍写全局 store → 错题集与统计口径不变
   ---------------------------------------------------------------- */
function sessionResults() {
  const r = (quizState && quizState.results) || {};
  return Object.keys(r).map(id => ({id, ua:r[id].ua, ok:r[id].ok, ts:r[id].ts}));
}
function sessionScopedAnswers() {
  return (quizState && quizState.mode === 'exam') ? sessionResults() : getAnswers();
}

function recordAnswer(qId, userAnswer, isCorrect) {
  const answers = getAnswers();
  answers.push({id:qId,ua:userAnswer,ok:isCorrect,ts:Date.now()});
  setAnswers(answers);
  const wrong = getWrong();
  const idx = wrong.findIndex(w=>w.id===qId);
  if(!isCorrect) {
    if(idx>=0) { wrong[idx].count++; wrong[idx].last=Date.now(); }
    else { wrong.push({id:qId,count:1,last:Date.now(),mastered:false}); }
  }
  setWrong(wrong);
}

function markMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=true;
  setWrong(wrong);
}
function unmarkMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=false;
  setWrong(wrong);
}
function removeWrong(qId) {
  setWrong(getWrong().filter(x=>x.id!==qId));
}

/* ================================================================
   ===================== 辅助函数 =================================
   ================================================================ */
const DOMAIN_NAMES = META.domains || {};
const DOMAIN_WEIGHTS = META.weights || {};
const DOMAIN_KEYS = Object.keys(DOMAIN_NAMES).map(Number).sort((a,b)=>a-b);
const EXAM_P = META.examParams || {};
const EXAM_COUNT = EXAM_P.count || 50;
const EXAM_MIN = EXAM_P.minutes || 60;
const EXAM_PASS = EXAM_P.pass || 700;
const TYPE_NAMES = {single:'单选题',multiple:'多选题',hot:'拖拽题'};

// 走全集：模考池题目不在练习池里，但模考错题会进错题集，取题必须能取到
function getQById(id) { return QUIZ_QUESTIONS.find(q=>q.id===id); }
function shuffle(arr) { const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function generateShuffledOptions(questions) {
  const opts = {};
  const newAnswers = {};
  questions.forEach(q => {
    if(q.t==='single'||q.t==='multiple') {
      const shuffled = shuffle([...q.o]);
      const labels = 'ABCDEFGHIJ';
      const relabeled = shuffled.map((item, i) => ({l: labels[i], t: item.t}));
      opts[q.id] = relabeled;
      const contentToNewLabel = {};
      relabeled.forEach(item => { contentToNewLabel[item.t] = item.l; });
      newAnswers[q.id] = q.a.map(oldL => {
        const oldItem = q.o.find(o => o.l === oldL);
        return oldItem ? contentToNewLabel[oldItem.t] : oldL;
      });
    }
  });
  return { opts, newAnswers };
}

function getStats() {
  const answers = getAnswers();
  const wrong = getWrong();
  const totalCorrect = answers.filter(a=>a.ok).length;
  const totalAnswered = answers.length;
  const acc = totalAnswered ? Math.round(totalCorrect/totalAnswered*100) : 0;
  const doneIds = [...new Set(answers.map(a=>a.id))];
  const completion = Math.round(doneIds.length/QUESTIONS.length*100);
  const domainStats = {};
  for(const d of DOMAIN_KEYS) {
    const dQIds = QUESTIONS.filter(q=>q.d===d).map(q=>q.id);
    const dAnswers = answers.filter(a=>dQIds.includes(a.id));
    const dCorrect = dAnswers.filter(a=>a.ok).length;
    const dTotal = dAnswers.length;
    domainStats[d] = {
      total:dQIds.length, answered:dTotal, correct:dCorrect,
      acc: dTotal ? Math.round(dCorrect/dTotal*100) : 0
    };
  }
  const typeStats = {};
  for(const t of ['single','multiple']) {
    const tQIds = QUESTIONS.filter(q=>q.t===t).map(q=>q.id);
    const tAnswers = answers.filter(a=>tQIds.includes(a.id));
    const tCorrect = tAnswers.filter(a=>a.ok).length;
    const tTotal = tAnswers.length;
    typeStats[t] = { answered:tTotal, correct:tCorrect, acc: tTotal ? Math.round(tCorrect/tTotal*100) : 0 };
  }
  const recentWrong = wrong.filter(w=>!w.mastered).sort((a,b)=>b.last-a.last).slice(0,5);
  const recent = answers.slice(-20).reverse();
  let streak = 0;
  for(const a of recent) { if(a.ok) streak++; else break; }
  return {totalCorrect,totalAnswered,acc,completion,domainStats,typeStats,recentWrong,streak,doneIds:doneIds.length};
}

let currentPage = 'dashboard';
let quizState = null;

function navigate(page) {

}

function renderDashboard() {

    <button class="btn-primary" onclick="startWrongReview()" style="background:var(--wrong)">🔄 错题重练 (${s.recentWrong.length}题待复习)</button>
    <button class="btn-primary" onclick="startExam()" style="background:var(--correct);color:#fff">📋 模拟考核（${EXAM_COUNT}题/${EXAM_MIN}分钟/${EXAM_PASS}分及格）</button>` + (MOCK_QUESTIONS.length ? `
    <button class="btn-primary" onclick="startRealExam()" style="background:#7c3aed;color:#fff">🎯 全真模考（${MOCK_QUESTIONS.length}题 · ${MOCK_SCORED.size}题计分 / ${EXAM_MIN}分钟）</button>` : '') + `
  </div>`;

    s.recentWrong.forEach(w=>{

function renderQuiz() {
  const el = document.getElementById('page-quiz');
  if(!quizState || !quizState.questions.length) {
    el.innerHTML = `<div class="header"><button class="back-btn" onclick="navigate('dashboard')">←</button><h1>刷题</h1></div>
    <p style="text-align:center;margin-top:60px;color:var(--text2)">暂无题目，请从仪表盘选择模式开始练习</p>`;
    return;
  }
  const q = quizState.questions[quizState.currentIdx];
  const isHot = q.t === 'hot';
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  // 考核=仅本场作答；练习模式=全局历史（含本场）——防练习记录串进考核视图
  const answers = sessionScopedAnswers();
  const prevAnswers = answers.filter(a=>a.id===q.id);
  const everCorrect = prevAnswers.some(a=>a.ok);
  const everWrong = prevAnswers.some(a=>!a.ok);
  const answered = quizState.answered || {};
  let userAns = answered[q.id];
  const finished = quizState.submitted && quizState.submitted[q.id];
  const correct = finished && isAnswerCorrect(q, userAns);

  let modeLabel = quizState.mode==='exam'?'📋 模拟考核':quizState.mode==='wrong'?'❌ 错题重练':quizState.mode==='domain'?'📖 章节练习':quizState.mode==='single'?'📝 单题练习':'📝 顺序练习';

  let html = `<div class="quiz-header">
    <button class="back-btn" onclick="exitQuiz()">←</button>
    <span style="font-weight:600;font-size:15px">${modeLabel}</span>
    ${quizState.mode==='exam'?`<span class="timer" id="quizTimer"></span>`:''}
    <span class="quiz-progress">${quizState.currentIdx+1}/${quizState.questions.length}</span>
  </div>`;
  html += `<div class="quiz-meta">
    <span class="domain-tag">Domain ${q.d}</span>
    <span>${DOMAIN_NAMES[q.d]}</span>
    <span>${TYPE_NAMES[q.t]}</span>
    ${everCorrect?'<span style="background:rgba(6,214,160,.15);color:var(--correct)">已答对</span>':''}
    ${everWrong?'<span style="background:rgba(239,71,111,.15);color:var(--wrong)">曾答错</span>':''}
  </div>`;
  html += `<div class="question-text">${q.q}</div>`;

  const renderOpts = getOptionsHTML(q, userAns, finished, correct, getShuffledAnswer(q));
  html += renderOpts;

  if(isHot) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?'▶ 完成返回':'▶ 下一题'}</button>
    </div>`;
  } else if(!finished) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>✅ 确认</button>
    </div>`;
  } else {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?(quizState.mode==='exam'?'📊 交卷查看成绩':'▶ 完成返回'):'▶ 下一题'}</button>
    </div>`;
  }

  if(finished) {
    const badge = correct ? '✅ 回答正确!' : '❌ 回答错误';
    const cls = correct ? 'correct' : 'wrong';
    const gItems = getGlossaryForQuestion(q);
    let gHtml = '';
    if(gItems.length) {
      gHtml = '<div class="glossary"><div class="glossary-title">词汇附录</div>';
      gItems.forEach(g => {
        gHtml += '<div class="glossary-item"><span class="glossary-term">' + g.term + '</span><span class="glossary-def">\u00a0\u2014\u00a0' + g.def.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span></div>';
      });
      gHtml += '</div>';
    }
    html += `<div class="explanation show">
      <div class="result-badge ${cls}">${badge}</div>
      <div class="exp-text"><strong>正确答案：</strong>${formatAnswer(q)}</div>
      <div class="exp-text" style="margin-top:8px"><strong>解析：</strong>${highlightGlossaryTerms(fmtExp(q.e))}</div>
      ${q.s?`<div class="exp-source">来源：${q.s}</div>`:''}
      ${gHtml}
    </div>`;
  }

  html += `<div class="qnav"><h4>题号导航</h4><div class="qnav-grid">`;
  quizState.questions.forEach((qq, i) => {
    const qAnswers = answers.filter(a=>a.id===qq.id);
    const qCor = qAnswers.some(a=>a.ok);
    const qWro = qAnswers.some(a=>!a.ok);
    let cls = '';
    if(i===quizState.currentIdx) cls='current';
    else if(qCor) cls='done-correct';
    else if(qWro) cls='done-wrong';
    html += `<div class="qnav-item ${cls}" onclick="jumpToQuestion(${i})">${i+1}</div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
  if(!finished) updateSubmitButton();
}

function getOptionsHTML(q, userAns, finished, correct, shuffledAns) {
  let html = '';
  const qtype = q.t;
  if(qtype === 'hot') {
    html += `<div class="options-list" style="background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:16px">
      <div style="font-weight:600;color:var(--primary);margin-bottom:8px">🖱 本题为拖拽/操作题（HOTSPOT）</div>
      <div style="font-size:13px;line-height:1.7;color:var(--text2)">本题无标准 A/B/C/D 选项，答题形式为图形拖拽/区域选择。题目与图形见源 PDF 原图，答案请参照源文件。</div>`;
    if(q.e) {
      html += `<div style="margin-top:10px;font-size:13px;line-height:1.7;color:var(--text2);border-top:1px solid var(--border);padding-top:10px"><strong>解析/提示：</strong><br>${highlightGlossaryTerms(fmtExp(q.e))}</div>`;
    }
    html += `</div>`;
    return html;
  }
  if(qtype === 'single' || qtype === 'multiple') {
    const isMulti = qtype === 'multiple';
    html += `<div class="options-list">`;
    const opts = quizState.shuffledOptions && quizState.shuffledOptions[q.id] ? quizState.shuffledOptions[q.id] : q.o;
    opts.forEach(o => {
      const isSelected = userAns && userAns.includes(o.l);
      let cls = 'option-item';
      if(isMulti) cls += ' multi';
      if(isSelected && !finished) cls += ' selected';
      if(finished) {
        if(shuffledAns.includes(o.l)) cls += ' correct';
        else if(isSelected) cls += ' wrong';
      }
      const onclick = finished ? '' : `toggleOption('${o.l}')`;
      html += `<div class="${cls}" onclick="${onclick}">
        <span class="opt-label">${o.l}</span>
        <span>${o.t}</span>
      </div>`;
    });
    html += `</div>`;
    if(isMulti && !finished) html += `<div style="font-size:13px;color:var(--text2);margin-top:-12px;margin-bottom:16px">多选——请选择所有正确答案后提交（至少选 2 项）</div>`;
  }
  return html;
}

/* ================================================================
   ===================== 交互逻辑 =================================
   ================================================================ */

function toggleOption(label) {
  const q = quizState.questions[quizState.currentIdx];
  if(!quizState.answered) quizState.answered = {};
  if(q.t==='single') {
    quizState.answered[q.id] = [label];
  } else {
    const arr = quizState.answered[q.id] || [];
    const idx = arr.indexOf(label);
    if(idx>=0) arr.splice(idx,1);
    else arr.push(label);
    quizState.answered[q.id] = arr;
  }
  renderQuiz();
}

function updateSubmitButton() {
  const q = quizState.questions[quizState.currentIdx];
  if(q.t === 'hot') return;
  const ans = quizState.answered && quizState.answered[q.id];
  const btn = document.getElementById('submitBtn');
  if(!btn) return;
  if(q.t==='single') btn.disabled = !ans || !ans.length;
  else if(q.t==='multiple') btn.disabled = !ans || ans.length < 2;
}

function getShuffledAnswer(q) {
  if(quizState && quizState.shuffledAnswers && quizState.shuffledAnswers[q.id]) {
    return quizState.shuffledAnswers[q.id];
  }
  return q.a;
}

function isAnswerCorrect(q, userAns) {
  if(!userAns) return false;
  const ca = getShuffledAnswer(q);
  if(q.t==='single') return userAns[0]===ca[0];
  if(q.t==='multiple') { const a=[...userAns].sort(); const b=[...ca].sort(); return JSON.stringify(a)===JSON.stringify(b); }
  return false;
}

function formatAnswer(q) {
  const ca = getShuffledAnswer(q);
  if(q.t==='single'||q.t==='multiple') return ca.join(', ');
  if(q.t==='hot') return '本题为拖拽/操作题，答案为图形区域匹配，见源 PDF 原图';
  return '';
}

function submitAnswer() {
  const q = quizState.questions[quizState.currentIdx];
  let userAns = quizState.answered && quizState.answered[q.id];
  if(!userAns) return;
  if(q.t==='multiple' && userAns.length < 2) {
    alert('多选题至少选择 2 个答案，当前只选了' + userAns.length + '个');
    return;
  }
  const correct = isAnswerCorrect(q, userAns);
  if(!quizState.submitted) quizState.submitted={};
  quizState.submitted[q.id]=true;
  // 本场作答留痕（考核判分唯一依据；不与全局统计混用）
  if(!quizState.results) quizState.results={};
  quizState.results[q.id]={ua:[...userAns], ok:correct, ts:Date.now()};
  recordAnswer(q.id, userAns, correct);
  renderQuiz();
  updateSubmitButton();
}

function prevQuestion() {
  if(quizState.currentIdx > 0) { quizState.currentIdx--; renderQuiz(); }
}
function nextQuestion() {
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  if(isLast) {
    if(quizState.mode==='exam') renderExamResult();
    else navigate('dashboard');
  } else {
    quizState.currentIdx++;
    renderQuiz();
  }
}
function jumpToQuestion(idx) {
  quizState.currentIdx = idx;
  renderQuiz();
}
function exitQuiz() {
  // 考核中途退出必须停表：否则过期计时器归零时会把之后的练习页改写成「考核成绩单」
  if(quizState && quizState.mode==='exam') stopExamTimer();
  if(quizState && quizState.mode!=='exam') {
    setProgress({mode:quizState.mode,domain:quizState.domain||null,idx:quizState.currentIdx,time:Date.now()});
  }
  quizState = null;
  navigate('dashboard');
}

/* ================================================================
   ===================== 刷题模式启动 ==============================
   ================================================================ */
function startDomain(d) {
  const qs = QUESTIONS.filter(q=>q.d===d);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'domain',domain:d,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startContinue() {
  const p = getProgress();
  if(p.mode && p.mode!=='exam') {
    if(p.mode==='domain' && p.domain) {
      const qs = QUESTIONS.filter(q=>q.d===p.domain);
      const _sr=generateShuffledOptions(qs);
      quizState = {mode:'domain',domain:p.domain,questions:qs,currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    } else {
      const _sr=generateShuffledOptions([...QUESTIONS]);
      quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    }
  } else {
    const _sr=generateShuffledOptions([...QUESTIONS]);
    quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  }
  navigate('quiz');
}
function startWrongReview() {
  const wrong = getWrong().filter(w=>!w.mastered);
  if(!wrong.length) { alert('暂无错题需要复习！'); return; }
  const qs = wrong.map(w=>getQById(w.id)).filter(Boolean);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'wrong',domain:null,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startSingle(id) {
  const q = getQById(id);
  if(!q) return;
  const _sr=generateShuffledOptions([q]);
  quizState = {mode:'single',domain:null,questions:[q],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startExam() {
  // 模拟考核：按 meta 权重 × meta 题数分配各域配额（最大余数法，保证总和=EXAM_COUNT）
  const counts = {};
  let sumInt = 0;
  const raw = {}, rem = {};
  DOMAIN_KEYS.forEach(k => {
    const w = parseFloat(String(DOMAIN_WEIGHTS[k]||'0').replace('%',''))/100;
    raw[k] = w * EXAM_COUNT;
    counts[k] = Math.floor(raw[k]);
    rem[k] = raw[k] - counts[k];
    sumInt += counts[k];
  });
  let deficit = EXAM_COUNT - sumInt;
  const order = [...DOMAIN_KEYS].sort((a,b)=>rem[b]-rem[a]);
  let i = 0;
  while(deficit > 0) { counts[order[i % order.length]]++; deficit--; i++; }
  let selected = [];
  DOMAIN_KEYS.forEach(d => {
    const pool = shuffle(QUESTIONS.filter(q=>q.d===d && q.t!=='hot'));
    selected.push(...pool.slice(0, counts[d]));
  });
  selected = shuffle(selected);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam',domain:null,questions:selected,currentIdx:0,answered:{},submitted:{},results:{},shuffledOptions:_exam.opts,shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  // 场次标识：计时回调据此判定「本场是否仍在进行」，防过期计时器串场
  quizState.examToken = 'ex-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

function startRealExam() {
  // 全真模考：固定用模考池出卷（题数/计分结构/时长按官方口径），每次只重排题序与选项。
  // 与随机模考的区别：题目固定可复现，分数可跨场对比；题目与练习池隔离，平时练不到。
  const pool = MOCK_QUESTIONS.slice();
  if(!pool.length) { alert('本卷未配置模考池，请用随机模考'); return; }
  const selected = shuffle(pool);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam', fullMock:true, domain:null, questions:selected, currentIdx:0, answered:{}, submitted:{}, shuffledOptions:_exam.opts, shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  quizState.examToken = 'mx-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

let examTimerInterval = null;
function stopExamTimer() {
  if(examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
}
function startExamTimer() {
  let secs = quizState.examDuration;
  const token = quizState.examToken;
  const timerEl = document.getElementById('quizTimer');
  if(!timerEl) return;
  stopExamTimer();
  examTimerInterval = setInterval(() => {
    // 场次校验：已退出或已换场（新 token）立即自毁
    if(!quizState || quizState.mode!=='exam' || quizState.examToken!==token) { stopExamTimer(); return; }
    secs--;
    const m = Math.floor(secs/60), s = secs%60;
    const el = document.getElementById('quizTimer');
    if(el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if(secs<=60 && el) el.classList.add('warning');
    if(secs<=0) { stopExamTimer(); finishExam(token); }
  }, 1000);
}

function finishExam(token) {
  stopExamTimer();
  // 只对「发起本场计时」的考核会话生效
  if(quizState && quizState.mode==='exam' && (token===undefined || quizState.examToken===token)) renderExamResult();
}

function renderExamResult() {
  if(!quizState) return;
  stopExamTimer();
  const qs = quizState.questions;
  const results = quizState.results || {};
  const fullMock = !!quizState.fullMock;
  // 全真模考按官方口径只判计分题（50 题）；随机模考与其它模式仍整卷计分
  const counted = fullMock ? qs.filter(q => MOCK_SCORED.has(q.id)) : qs;
  const total = counted.length;
  // 逐题按本场作答判分；全局历史与往场作答一律不计
  let correct = 0, wrong = 0, unanswered = 0;
  const domStat = {};
  DOMAIN_KEYS.forEach(d => domStat[d] = {n:0, cor:0});
  counted.forEach(q => {
    if(!domStat[q.d]) domStat[q.d] = {n:0, cor:0};
    domStat[q.d].n++;
    const r = results[q.id];
    if(!r) unanswered++;
    else if(r.ok) { correct++; domStat[q.d].cor++; }
    else wrong++;
  });
  // 不变量自校验：正确 + 错误 + 未答 必须等于计分题数
  if(correct + wrong + unanswered !== total) console.warn('[exam] 判分不变量异常', {correct, wrong, unanswered, total});
  const el = document.getElementById('page-quiz');
  const pct = total ? Math.round(correct/total*100) : 0;
  // 1000-point scale, 700 to pass
  const scaledScore = total ? Math.round(correct/total*1000) : 0;
  const passed = scaledScore >= EXAM_PASS;
  // Time used
  const timeUsed = quizState.examStartTime ? Math.round((Date.now()-quizState.examStartTime)/1000) : 0;
  const timeM = Math.floor(timeUsed/60), timeS = timeUsed%60;

  // Domain breakdown
  let domainHtml = '';
  for(const d of DOMAIN_KEYS) {
    const dd = domStat[d] || {n:0, cor:0};
    const dPct = dd.n ? Math.round(dd.cor/dd.n*100) : 0;
    domainHtml += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${dd.n}</td><td>${dd.cor}</td><td style="color:${dPct>=70?'var(--correct)':'var(--wrong)'}">${dPct}%</td></tr>`;
  }

  el.innerHTML = `<div class="header"><button class="back-btn" onclick="exitExam()">←</button><h1>${fullMock ? '🎯 全真模考成绩单' : '📋 考核成绩单'}</h1></div>
  <div style="text-align:center;padding:30px 20px">
    <div style="font-size:48px;font-weight:700;color:${passed?'var(--correct)':'var(--wrong)'}">${scaledScore}</div>
    <div style="font-size:14px;color:var(--text2);margin:4px 0">满分 1000 分 | 及格线 ${EXAM_PASS} 分${fullMock ? " | 计分题 " + total + " 题（卷面 " + qs.length + " 题，不计分 " + (qs.length - total) + " 题）" : ""}</div>
    <div style="font-size:16px;color:var(--text);margin:12px 0;font-weight:600">${passed?'✅ 通过！':'❌ 未通过'}</div>
    <div style="display:flex;justify-content:center;gap:20px;margin:16px 0;flex-wrap:wrap">
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--correct)">${correct}</div><div style="font-size:12px;color:var(--text2)">正确</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--wrong)">${wrong}</div><div style="font-size:12px;color:var(--text2)">错误</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text2)">${unanswered}</div><div style="font-size:12px;color:var(--text2)">未答</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--primary)">${pct}%</div><div style="font-size:12px;color:var(--text2)">正确率</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text)">${timeM}分${timeS.toString().padStart(2,'0')}秒</div><div style="font-size:12px;color:var(--text2)">用时</div></div>
    </div>
  </div>
  <div class="stats-chart">
    <h3>各章节成绩</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>题数</th><th>正确</th><th>正确率</th></tr></thead><tbody>
    ${domainHtml}
    </tbody></table>
  </div>
  <div style="text-align:center;padding:20px">
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn-secondary" onclick="exitExam()" style="width:auto">返回首页</button>
      <button class="btn-primary" onclick="${fullMock ? 'startRealExam()' : 'startExam()'}" style="width:auto;flex:none">再考一次</button>
    </div>
  </div>`;
  quizState = null;
}

function exitExam() {
  quizState = null;
  navigate('dashboard');
}

let wrongFilter = 0;

function renderWrongBook() {

    <div class="stat-card"><div class="stat-num">${mastered.length}</div><div class="stat-label">已掌握</div></div>
    <div class="stat-card"><div class="stat-num">${wrong.length+mastered.length}</div><div class="stat-label">共错题</div></div>
  </div>`;
  html += `<div class="wrong-tabs">
    <button class="wrong-tab ${wrongFilter===0?'active':''}" onclick="wrongFilter=0;renderWrongBook()">全部</button>`;
  for(const d of DOMAIN_KEYS) {
    html += `<button class="wrong-tab ${wrongFilter===d?'active':''}" onclick="wrongFilter=${d};renderWrongBook()">${DOMAIN_NAMES[d]}</button>`;
  }
  html += `</div>`;
  let items = wrongFilter ? wrong.filter(w=>{const q=getQById(w.id);return q&&q.d===wrongFilter}) : wrong;
  items.sort((a,b)=>b.count-a.count);
  if(!items.length) {
    html += `<p style="text-align:center;margin-top:40px;color:var(--text2)">🎉 暂无错题！</p>`;
  } else {
    items.forEach(w=>{
      const q = getQById(w.id);
      if(!q) return;
      html += `<div class="wrong-item">
        <div class="wi-header">
          <span><strong>Domain ${q.d}</strong> | ${TYPE_NAMES[q.t]}</span>
          <span style="color:var(--wrong)">答错${w.count}次</span>
        </div>
        <div style="font-size:14px;margin-bottom:6px">${q.q.slice(0,60)}${q.q.length>60?'…':''}</div>
        <div style="font-size:12px;color:var(--text2)">最近答错：${new Date(w.last).toLocaleString()}</div>
        <div class="wi-actions">
          <button onclick="startSingle('${w.id}')">📝 重练本题</button>
          <button onclick="markMastered('${w.id}');renderWrongBook()">✅ 标记已掌握</button>
          <button onclick="removeWrong('${w.id}');renderWrongBook()">🗑️ 移除</button>

  if(mastered.length) {
    html += `<div style="margin-top:20px"><h3 style="font-size:14px;margin-bottom:8px;color:var(--text2)">已掌握 (${mastered.length})</h3>`;
    html += `<button class="btn-secondary" onclick="if(confirm('确定清空所有已掌握的错题吗？')){setWrong(getWrong().filter(w=>!w.mastered));renderWrongBook();}" style="width:auto">清空已掌握</button></div>`;
  }
  el.innerHTML = html;
}

function renderStats() {
  const s = getStats();
  const el = document.getElementById('page-stats');
  let html = `<div class="header"><h1>📊 统计分析</h1></div>`;
  html += `<div class="stats-chart">
    <h3>总进度</h3>
    <div style="height:30px;background:var(--border);border-radius:15px;overflow:hidden">
      <div style="height:100%;width:${s.completion}%;background:var(--primary);border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600">${s.completion}%</div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--text2)">
      <span>已答 ${s.doneIds}/${QUESTIONS.length} 题</span>
      <span>正确率 ${s.acc}%</span>
    </div>
  </div>`;
  html += `<div class="stats-chart"><h3>各章节正确率</h3><canvas id="chartDomain"></canvas></div>`;
  html += `<div class="stats-chart"><h3>各题型正确率</h3><canvas id="chartType"></canvas></div>`;
  html += `<div class="stats-chart"><h3>详细数据</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>总题</th><th>已答</th><th>正确</th><th>正确率</th></tr></thead><tbody>`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${ds.total}</td><td>${ds.answered}</td><td>${ds.correct}</td><td style="color:${ds.acc>=70?'var(--correct)':'var(--wrong)'};font-weight:600">${ds.acc}%</td></tr>`;
  }
  html += `</tbody></table></div>`;
  el.innerHTML = html;
  setTimeout(() => {
    drawDomainChart(s);
    drawTypeChart(s);
  }, 50);
}

function drawDomainChart(s) {
  const c = document.getElementById('chartDomain');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = DOMAIN_KEYS.map(k=>'D'+k);
  const colors = ['#4361ee','#4cc9f0','#06d6a0','#f8961e','#9b5de5'];
  const barW = (W-80) / (labels.length*1.5);
  labels.forEach((l,i)=>{
    const val = s.domainStats[i+1].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(l, x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

function drawTypeChart(s) {
  const c = document.getElementById('chartType');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = ['单选','多选'];
  const keys = ['single','multiple'];
  const colors = ['#4361ee','#4cc9f0'];
  const barW = (W-80) / 4;
  keys.forEach((k,i)=>{
    const val = s.typeStats[k].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

/* roundRect polyfill */
if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(r>w/2) r=w/2;
    if(r>h/2) r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    return this;
  };
}

/* ================================================================
   ===================== 工具函数 ==================================
   ================================================================ */
function exportData() {
  const data = {
    answers: getAnswers(),
    wrong: getWrong(),
    progress: getProgress(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${LS_PREFIX}-quiz-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.answers) setAnswers(data.answers);
        if(data.wrong) setWrong(data.wrong);
        if(data.progress) setProgress(data.progress);
        alert('数据导入成功！');
        navigate(currentPage);
      } catch(err) { alert('数据格式错误，请检查文件。'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetData() {
  showModal('确认重置', '确定要清除所有答题记录、错题集和进度吗？此操作不可恢复！', () => {
    localStorage.removeItem(LS_ANSWERS);
    localStorage.removeItem(LS_WRONG);
    localStorage.removeItem(LS_PROGRESS);
    navigate('dashboard');
  });
}

let modalCallback = null;
function showModal(title, text, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOverlay').classList.add('show');
  modalCallback = onConfirm;
  document.getElementById('modalConfirmBtn').onclick = () => {
    closeModal();
    if(modalCallback) modalCallback();
  };
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function toggleTheme() {
  document.getElementById('quizView').classList.toggle('dark');
  localStorage.setItem(LS_PREFIX+'_theme', document.getElementById('quizView').classList.contains('dark')?'dark':'light');
  navigate(currentPage);
}

/* ================================================================
   ===================== 初始化 ====================================
   ================================================================ */
function init() {
  if(localStorage.getItem(LS_PREFIX+'_theme')==='dark') document.getElementById('quizView').classList.add('dark');
  const pages = ['dashboard','quiz','wrongbook','stats','settings'];
  const app = document.getElementById('app');
  pages.forEach(p => {
    const div = document.createElement('div');
    div.id = 'page-'+p;
    div.className = 'page' + (p==='dashboard'?' active':'');
    app.appendChild(div);
  });
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => { if(btn.dataset.page==='learn'){ if(window.kbShowLearnHome) window.kbShowLearnHome(); } else navigate(btn.dataset.page); });
  });
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', init);

pic":"D2 安全性、合规性和监管 · 设计实现加密和密钥管理策略的方案 / 设计满足合规要求的架构","focus":"本章练习 12 题","domain":2},{"day":5,"topic":"D3 成本优化型架构设计 · 基于 AWS 定价模型设计架构 / 设计成本分摊和可视化方案","focus":"官方权重 15","domain":3},{"day":6,"topic":"D3 成本优化型架构设计 · 优化数据传输和网络成本 / 优化存储和数据库成本","focus":"本章练习 12 题","domain":3},{"day":7,"topic":"D4 韧性、迁移和业务连续性 · 使用 AWS 框架设计迁移策略 / 设计满足业务连续性和韧性要求的方案","focus":"官方权重 15","domain":4},{"day":8,"topic":"D4 韧性、迁移和业务连续性 · 设计灾难恢复架构","focus":"本章练习 12 题","domain":4},{"day":9,"topic":"D5 卓越运营和自动化 · 设计基础设施即代码 / 设计可观测性和监控方案","focus":"官方权重 20","domain":5},{"day":10,"topic":"D5 卓越运营和自动化 · 设计 CI/CD 和 DevSecOps 管道 / 设计运营自动化和韧性系统","focus":"本章练习 12 题","domain":5}],"planAuto":true},"chapters":[{"domain":1,"name":"设计和实施专为云构建的架构","weight":"25%","practice":[{"id":"D1-001","d":1,"t":"single","q":"某电商平台的订单创建后要触发扣库存、发通知、更新报表三个下游动作。要求同一订单的事件严格按顺序处理，消费失败可重试且不能重复扣减。哪种消息方案最合适","o":[{"l":"A","t":"用标准 SQS 队列让多个消费者并发处理，靠应用层加锁保证顺序"},{"l":"B","t":"用 SQS FIFO 队列以订单号作 MessageGroupId，配合消费端按订单号幂等去重"},{"l":"C","t":"用 SNS 主题广播，每个下游各订阅一个队列，靠 SNS 自身保证处理顺序"},{"l":"D","t":"用 EventBridge 规则直接调用 Lambda，靠 Lambda 的并发控制保证顺序"}],"a":["B"],"e":"✅ 正确项：B。SQS FIFO 以 MessageGroupId 分区，同组消息严格按序投递，配合消费端按订单号幂等去重，正好满足同订单有序且不重复扣减。关联考点：域 1.1.1「设计事件驱动架构与消息传递模式」。\n\n❌ A：标准队列是尽力排序、多消费者并发，无法保证严格顺序，靠应用层加锁既脆弱又添复杂度。\n❌ C：SNS 是发布订阅广播，不保证跨订阅者的处理顺序，顺序语义不在 SNS 这一层。\n❌ D：EventBridge 规则触发 Lambda 是并发执行，本身不提供严格顺序保证。\n\n📌 关键概念：要顺序就想到 FIFO 的 MessageGroupId 分区，要不重复就想到消费端幂等，两者配合才完整。","s":"自编·1.1.1"},{"id":"D1-002","d":1,"t":"multiple","q":"一家公司多个业务单元共用 AWS Organization，各自要调用 Amazon Bedrock 构建生成式 AI 应用。架构师设计多账户部署模式，哪些做法是合理的（选所有适用项）","o":[{"l":"A","t":"通过 IAM 角色与权限边界控制各账户可访问的模型范围"},{"l":"B","t":"所有负载一律放开调用，不需要任何权限与成本约束"},{"l":"C","t":"预置容量只适合无法预测的场景，稳定负载不该使用"},{"l":"D","t":"各业务账户独立调用 Bedrock，模型访问与配额各自管理，边界清晰"},{"l":"E","t":"用标签与成本分摊按业务单元归集 Bedrock 用量"}],"a":["A","D","E"],"e":"✅ 正确项：A、D、E。多账户模式下各账户可独立调用 Bedrock 保持隔离，用 IAM 角色与权限边界约束可访问模型，用标签归集成本，都是可行做法。关联考点：域 1.2.1「为应用设计生成式 AI 集成与多账户部署」。\n\n❌ B：完全放开调用会让权限与成本失控，与多账户治理目标相反。\n❌ C：预置容量适合可预测的持续需求，说它只适合不可预测场景是把适用条件讲反了。\n\n📌 关键概念：GenAI 多账户部署的核心是隔离、可控、可归属，靠 IAM 与标签实现，而不是彻底放开或共享凭证。","s":"自编·1.2.1"},{"id":"D1-003","d":1,"t":"single","q":"Fabrikam 的电商应用准备改造成实例可随时替换、可横向扩容。会话要求毫秒级读写且丢失后可自动重建，商品图片属大对象，订单这类业务状态要持久保存。状态外置怎么配最合适","o":[{"l":"A","t":"会话与业务状态都存实例本地盘，扩容时用脚本逐台同步拷贝"},{"l":"B","t":"会话与业务状态存 RDS 每请求查库读写，图片放单实例 EBS 卷"},{"l":"C","t":"会话放 ElastiCache，业务状态放 DynamoDB，图片放 S3"},{"l":"D","t":"状态序列化进 Cookie 随请求往返客户端"}],"a":["C"],"e":"✅ 正确项：C。状态外置按状态类型配去处：会话要亚毫秒且能重建，放 ElastiCache；订单这类业务状态要毫秒级读写与持久，放 DynamoDB；图片大对象放 S3 便宜且天然持久，计算层因此可随意替换与横向扩容。关联考点：域 1.1.2「设计无状态应用，使用外部化状态管理」。\n\n❌ A：本地盘存状态与「实例随时替换」直接冲突，脚本逐台同步拷贝既慢又易丢状态，是无状态改造要消灭的形态。\n❌ B：会话每请求都查 RDS 会把库拖垮，毫秒级响应靠内存层；EBS 卷只挂单个实例，谈不上多实例共享状态。\n❌ D：Cookie 的容量与安全边界都装不下会话与业务状态，还放大请求体积并引入篡改风险。\n\n📌 关键概念：无状态不是没有状态，是状态外置——会话进缓存、结构化状态进 DynamoDB、大对象进 S3，丢了能重建的才敢放缓存。","s":"自编·1.1.2"},{"id":"D1-004","d":1,"t":"single","q":"Contoso 要把设备日志从自管虚拟机批处理改成无服务器管道：日志持续流入、先做轻量清洗再支持即席 SQL 分析，不想运维任何服务器。哪个组合最合适","o":[{"l":"A","t":"Kinesis Data Streams 收流，Lambda 按事件轻清洗落 S3，Glue Data Catalog 登记表，Athena 即席查询"},{"l":"B","t":"EMR 常驻集群跑 Spark，全链在集群内闭环"},{"l":"C","t":"日志写入 RDS，报表用 SQL 直接查库"},{"l":"D","t":"Glue 作业逐条实时处理每条日志并即时返回"}],"a":["A"],"e":"✅ 正确项：A。无服务器管道四环各管一段：Kinesis Data Streams 收实时流，Lambda 按事件触发做轻清洗落 S3，Glue Data Catalog 给数据建表元数据，Athena 按需对 S3 跑 SQL，摄入到查询全程零服务器运维。关联考点：域 1.1.3「设计无服务器数据处理与分析管道」。\n\n❌ B：EMR 是常驻大数据集群，控制面与节点都要人管，与「不想管服务器」的约束相反，它是稳定大流量重型 ETL 的去处。\n❌ C：半结构化海量日志塞 RDS，写入模型与存储成本都不匹配，且 RDS 常驻更谈不上无服务器。\n❌ D：Glue 是面向批的 ETL 引擎，按作业跑而不是逐条实时处理，拿它扛持续日志流是形态错配。\n\n📌 关键概念：无服务器管道等于托管摄入加轻转换加托管目录加按需查询；Athena 按扫描计费，大表要靠分区与压缩控费。","s":"自编·1.1.3"},{"id":"D1-005","d":1,"t":"single","q":"Fabrikam 的采购审批流程要跨三个工作日，含两级人工审批，中途系统重启或断电后必须从断点继续而不是整条重跑。选哪种执行形态","o":[{"l":"A","t":"用一个 Lambda 函数同步串完所有环节，失败后整条重跑"},{"l":"B","t":"Step Functions 标准工作流串起流程，人工环节用回调挂起"},{"l":"C","t":"Step Functions 快速工作流跑全程，速度优先"},{"l":"D","t":"常驻容器里跑审批脚本，状态存容器内存"}],"a":["B"],"e":"✅ 正确项：B。标准工作流的状态由引擎持久化，单次执行最长可跑一年，人工审批环节用回调挂起等待答复，系统重启后从最近一步恢复，断点续跑由引擎保证，正对跨天带审批的长流程。关联考点：域 1.1.4「设计具有持久执行模式的多步骤工作流」。\n\n❌ A：单函数同步硬扛跨天流程，十五分钟执行上限直接封死，失败整条重跑也没有断点概念。\n❌ C：快速工作流为毫秒级高频短任务设计，单次执行上限五分钟，跨三天的流程必挂。\n❌ D：容器内存态在重启即丢，持久执行靠引擎或外部检查点，不是常驻脚本能扛的。\n\n📌 关键概念：持久执行等于状态引擎化——标准工作流管长事务与人工环节，快速工作流管高频短任务，Lambda 加外部检查点是轻量替代。","s":"自编·1.1.4"},{"id":"D1-006","d":1,"t":"single","q":"Contoso 多个业务账号要向中心安全账号投递安全事件统一消费，另有一个海外区域的事件也要汇总到总部区域。事件路由怎么配","o":[{"l":"A","t":"各业务账号直接把事件写进安全账号的 S3 桶留痕"},{"l":"B","t":"各账号自建事件总线，安全账号定时轮询拉取"},{"l":"C","t":"事件全部发到一个 SNS 主题，各账号自行订阅"},{"l":"D","t":"安全账号总线授权成员账号投递，海外区域事件经转发汇到总部区域总线"}],"a":["D"],"e":"✅ 正确项：D。跨账户路由先授权后投递：目标账户总线用资源策略放行成员账号的 PutEvents，来源账号规则再把事件投过去；跨区域汇总靠各区域总线把事件转发到中心区域总线统一消费，两个需求各对一路。关联考点：域 1.1.5「实现跨账户和跨区域的事件路由模式」。\n\n❌ A：直写 S3 桶不是事件总线路由形态，没有规则过滤、目标编排与投递保障，权限模型也不对。\n❌ B：EventBridge 是推送式投递，没有轮询拉取模式，自造轮询既慢又贵还容易漏。\n❌ C：SNS 能扇出订阅，但跨账户集中治理、按规则路由与区域汇总都是总线层职责，SNS 顶不上。\n\n📌 关键概念：跨账户授权用 put-permission，跨区域用转发汇中心；单向够用就别配回环，事件风暴时回环会放大。","s":"自编·1.1.5"},{"id":"D1-007","d":1,"t":"single","q":"Tailspin 团队有多年 Kubernetes 经验，重度依赖 Operator 与 Helm 生态；另一组边缘无状态服务负载中等，团队不想管任何节点。容器编排怎么选","o":[{"l":"A","t":"全部服务迁 ECS 自管集群，弃用 Kubernetes 生态"},{"l":"B","t":"全部服务自管 EC2 上的 Kubernetes 集群"},{"l":"C","t":"Kubernetes 依赖的服务上 EKS，边缘无状态服务用 ECS 加 Fargate"},{"l":"D","t":"边缘服务改写成 Lambda 函数跑"}],"a":["C"],"e":"✅ 正确项：C。编排按团队基因与运维胃口分层：重度依赖 Operator 与 Helm 的服务上 EKS 吃 Kubernetes 生态；边缘无状态、负载中等且不想管节点的服务用 ECS 加 Fargate，节点层全部托管，两种形态并存按需取用。关联考点：域 1.1.6「使用托管服务设计微服务的容器编排」。\n\n❌ A：团队经验与生态依赖被强行作废，Operator 这类存量资产全要重写，迁移代价最大。\n❌ B：全量自管集群等于控制面与节点运维全自己扛，边缘服务那点负载根本不需要这么重的形态。\n❌ D：为迁形态改写业务，长连接与运行特征对不上 Lambda，改造成本与收益倒挂。\n\n📌 关键概念：EKS 吃 K8s 生态、ECS 轻量原生、Fargate 连节点都托管；大型常驻或特殊内核需求才考虑自管节点池。","s":"自编·1.1.6"},{"id":"D1-008","d":1,"t":"single","q":"Fabrikam 的结算与账单服务分居两个 VPC，要求服务间调用统一鉴权、灰度切流与流量观测，且不想改造应用代码。哪种方案最合适","o":[{"l":"A","t":"在两个服务的代码里自实现双向 TLS 与调用链埋点"},{"l":"B","t":"两服务迁入同一 VPC，靠安全组互通"},{"l":"C","t":"VPC Lattice 服务网络连通，IAM 策略鉴权，灰度在网格层切流"},{"l":"D","t":"API Gateway 给两服务间调用做统一门面"}],"a":["C"],"e":"✅ 正确项：C。VPC Lattice 把服务间连接、安全与观测下沉到基础设施层：服务按逻辑名互调、跨 VPC 可达，访问靠 IAM 策略控制，灰度切流在网格层配，成功率与时延在网格层统一采集，应用代码零改造。关联考点：域 1.1.7「设计服务网格架构，促进微服务通信与可观测性」。\n\n❌ A：在业务代码里自实现双向 TLS 与埋点，正是网格要下沉掉的负担，两个服务同步改造还容易漏。\n❌ B：合并 VPC 治标不治本，统一鉴权、灰度与流量观测一层都没解决，跨 VPC 约束也没了。\n❌ D：API Gateway 是对外的 API 门面，管南北向入口，不是服务间东西向调用的网格治理层。\n\n📌 关键概念：服务网格的价值是应用零改造拿到连接、安全、观测三件事；跨 VPC 场景 VPC Lattice 是托管正解。","s":"自编·1.1.7"},{"id":"D1-009","d":1,"t":"single","q":"Contoso 每天构建几十个容器镜像版本，仓库存储持续膨胀，安全团队要求高危漏洞镜像不能进生产。ECR 镜像治理怎么配","o":[{"l":"A","t":"关闭自动扫描省成本，上线前人工核对漏洞清单"},{"l":"B","t":"开启推送即扫，发布管道对高危设门禁，生命周期策略保最近若干标签并排除生产在用标签"},{"l":"C","t":"生命周期策略保留全部带标签镜像三年"},{"l":"D","t":"定期手工登录控制台逐个删除旧镜像"}],"a":["B"],"e":"✅ 正确项：B。镜像治理三件一起配：推送即扫让每个镜像漏洞按严重度可见；发布管道对高危漏洞设门禁，修完再放行；生命周期策略按保留最近若干标签自动清理旧镜像，且把生产在用标签排除在清理之外，风险与仓库体积一起控住。关联考点：域 1.1.8「通过配置安全扫描和生命周期策略管理容器镜像」。\n\n❌ A：关掉扫描等于让漏洞镜像裸奔，人工核对清单既慢又不可持续，高危拦截形同虚设。\n❌ C：全部镜像保留三年，存储费随构建频率线性膨胀，与治理初衷相反。\n❌ D：手工逐个删镜像易误删生产标签，也不可持续，清理本来就该交给自动策略。\n\n📌 关键概念：镜像治理三件套是推送扫描、管道门禁、生命周期清理；清理可以大胆配，但生产标签必须豁免。","s":"自编·1.1.8"},{"id":"D1-010","d":1,"t":"multiple","q":"Contoso 的行情查询系统盘前流量是收盘后的十倍，架构是 Lambda 加 EKS 混合。为应对这种早晚差十倍的流量，哪些做法合理（选所有适用项）","o":[{"l":"A","t":"把关键 Lambda 函数全部预留并发到账户上限"},{"l":"B","t":"EKS 用 HPA 按查询速率调 Pod，配 Cluster Autoscaler 补节点"},{"l":"C","t":"把缩容等待期拉长，收盘后缓慢回落"},{"l":"D","t":"账户 Lambda 并发上限留余量，超发流量进队列削峰"},{"l":"E","t":"高峰一到就把 Pod 数手工固定，收盘后再手工改回"}],"a":["B","C","D"],"e":"✅ 正确项：B、C、D。多层扩缩各管一层：HPA 按指标调 Pod、Cluster Autoscaler 补节点，两层都配才不会出现排不下的 Pod；缩容等待期拉长防抖动，收盘后缓慢回落；账户并发上限留余量并用队列削峰，超发流量不直接打死函数。关联考点：域 1.1.9「为无服务器和容器化工作负载设计自动扩缩容模式」。\n\n❌ A：预留并发是资源抢占，全预留等于没有弹性池，给关键函数打底即可，讲义明确要克制。\n❌ E：高峰手工固定 Pod 数、收盘手工改回，既丢弹性也不防抖，等于退回人肉运维。\n\n📌 关键概念：扩缩容口诀是扩快缩慢防抖动、并发留余量、Pod 与节点两层分治、突发流量靠队列削峰。","s":"自编·1.1.9"},{"id":"D1-011","d":1,"t":"single","q":"Fabrikam 对外开放 API 需要密钥管理与限流，内部 HTTP 微服务要按路径分流，另有一条私有 TCP 长连接要求静态 IP。入口层怎么配","o":[{"l":"A","t":"三类流量统一走一个 NLB 四层直通"},{"l":"B","t":"对外与内部都直接暴露 ALB，限流各自在应用里写"},{"l":"C","t":"全部入口收进一个 API Gateway 统一治理"},{"l":"D","t":"对外走 API Gateway 管密钥限流，内部 ALB 按路径分流，TCP 长连接用 NLB"}],"a":["D"],"e":"✅ 正确项：D。入口按流量形态分工：对外 API 要治理，密钥、限流、版本、计费在门口统一做完，走 API Gateway；内部 HTTP 微服务按路径与主机头分流是 ALB 的地盘；私有 TCP 长连接要静态 IP 与四层直通，归 NLB，三者各就各位。关联考点：域 1.1.10「设计入口流量模式，针对特定使用模式优化资源」。\n\n❌ A：NLB 看不懂 HTTP 路径与主机头，更做不了 API 密钥与限流治理，三类流量一锅端必然顾此失彼。\n❌ B：内部服务直接暴露 ALB 且限流靠应用自写，治理分散难审计，对外应有的密钥管理也没有。\n❌ C：API Gateway 是 API 门面，不是内部微服务分流器，也接不了私有 TCP 长连接。\n\n📌 关键概念：常见组合是 API Gateway 接外部、ALB 转内部；选型看协议层次与治理需求，NLB 只管四层静态 IP。","s":"自编·1.1.10"},{"id":"D1-012","d":1,"t":"single","q":"Contoso 全球营销站点要全球加速：静态资源就近命中，URL 改写与请求头规范这类小逻辑贴节点跑，按地理位置分流落地页这层较重逻辑放区域边缘。边缘架构怎么配","o":[{"l":"A","t":"URL 改写与地理分流都塞进 Lambda@Edge 跑"},{"l":"B","t":"静态资源不做缓存，每个请求都回源站取"},{"l":"C","t":"静态内容走 CDN 缓存，URL 改写用 CloudFront Functions，地理分流交给 Lambda@Edge"},{"l":"D","t":"把实时库存查询也缓存到边缘节点提升命中率"}],"a":["C"],"e":"✅ 正确项：C。边缘三层分工：静态内容走 CDN 缓存就近命中不回源；URL 改写与请求头规范是纳秒级轻逻辑，用 CloudFront Functions 在节点完成；按地理位置分流要算力，交给 Lambda@Edge 在区域边缘跑，首字节时延从跨洲回源压到近端命中。关联考点：域 1.1.11「设计边缘架构以满足时延要求」。\n\n❌ A：轻逻辑塞进 Lambda@Edge，冷启动与执行成本被放大，这类活 CloudFront Functions 干得又快又便宜。\n❌ B：放弃边缘缓存等于每个请求都跨洲回源，全球时延目标直接破产。\n❌ D：实时库存这类必须新鲜的数据不能推边缘缓存，过期窗口会卖出对不上的库存。\n\n📌 关键概念：边缘定位是缓存贴节点、轻逻辑贴边缘函数、重逻辑回源；新鲜度敏感的数据不进缓存。","s":"自编·1.1.11"}],"sections":[{"h":"设计专为云构建的架构","body":"### 这一域考什么\n\n这一域问的是：一套架构怎么「生在云上、长在云上」。从事件驱动、无状态、无服务器这些云原生底盘，到 AI 与机器学习的集成，再到混合云、网络与数据层的设计。。\n\n五条线串起全章：\n\n1. **云原生应用形态**：事件驱动、无状态、无服务器管道、持久工作流，对应任务 1.1。\n2. **AI 与 ML 集成**：生成式 AI、智能体、推理与 RAG，对应任务 1.2。\n3. **混合云**：连接、数据同步、遗留系统改造、DNS 与混合计算，对应任务 1.3。\n4. **网络**：多 VPC、子网与分段、安全、IPv6 与全局路由，对应任务 1.4。\n5. **数据与存储**：湖仓、分析管道、数据库选型与扩缩容、缓存、编目共享，对应任务 1.5。\n\n这门课是专业级（Professional），考核动词以 Design（设计）、Implement（实现）为主。它考的不是「认不认识某个服务」，而是给你一组性能、成本与演进约束，你能选出架构形态并讲清取舍。\n\n### 读完这个域要能做什么\n\n这门课写给有两年以上 AWS 实操经验的架构师。读完本域应能：\n\n- 给一组业务事件，配出恰当的消息模式——幂等、排序、投递保证各就各位。\n- 把状态从计算层剥出来，让计算随意伸缩、随时替换。\n- 画出一套生成式 AI 或 RAG 的集成架构，讲清摄取与检索策略。\n- 给混合云场景选对连接、同步与 DNS 方案。\n- 设计多 VPC 网络与分层安全，含 IPv6 双栈迁移路径。\n- 按访问模式选数据库与存储，配好缓存与跨账号共享。\n\n### 和其他认证怎么接\n\n| 其他认证/能力 | 对应的那件事 | 这里有什么不同 | 什么时候该想起它 |\n|---|---|---|---|\n| SAA-C03（解决方案架构师助理级） | 都讲 VPC、负载均衡、存储选型 | 助理级认得出服务与基本形态；专业级要你在多账号、多区域、事件驱动场景下做形态设计与取舍 | 遇到「跨账号跨区域」「消息可靠性」就卡住时 |\n| 开发者级（Developer Associate） | 都讲事件驱动与无服务器 | 开发者级偏实现细节；本课站在架构视角定形态
