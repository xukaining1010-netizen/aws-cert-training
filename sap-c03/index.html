载全部改写成 Lambda 函数"},{"l":"B","t":"全部长驻容器换成 Graviton 实例即可"},{"l":"C","t":"批处理容器换 Graviton 集群；小时级流程拆成快速工作流链；凌晨零流量接口改 Lambda 按毫秒计费"},{"l":"D","t":"多步流程继续用标准工作流，不动形态"}],"a":["C"],"e":"✅ 正确项：C。换装三路各对各负载：容器 JVM 脚本类负载验证兼容后换 Graviton，同负载单价直降近乎白赚；每晚的小时级流程实际是短高频任务，拆成快速工作流链，单次执行价与标准工作流差数量级；凌晨零流量接口从常驻容器改 Lambda，按毫秒计费闲置归零。关联考点：域 3.1.2「设计成本优化的架构以满足工作负载要求」。\n\n❌ A：批处理集群改写成 Lambda 既不现实也不必要，形态与负载特征错配。\n❌ B：只换芯片没动形态——短高频流程与凌晨闲置两处浪费原样留着。\n❌ D：短高频流程留在标准工作流，单次执行费比快速工作流贵一个量级，放着最大的省钱旋钮不拧。\n\n📌 关键概念：换装三路是 Graviton、工作流分档、无服务器化；先验证兼容与回本再动生产。","s":"自编·3.1.2"},{"id":"D3-004","d":3,"t":"single","q":"Fabrikam 三百台实例利用率常年只有一成、规格是当初拍的；交易网关有开盘前流量节奏。规格与扩缩容怎么优化","o":[{"l":"A","t":"把超配实例一次全砍到最小规格，省到底"},{"l":"B","t":"Compute Optimizer 体检出超配清单分步降档留观测期，交易网关开盘前定时预热加目标跟踪双层扩缩"},{"l":"C","t":"利用率低是业务属性使然，无法优化"},{"l":"D","t":"锯齿型波动的负载也一并降规格"}],"a":["B"],"e":"✅ 正确项：B。规格优化按三步走：先用 Compute Optimizer 分析利用率，出机读的超配与欠配清单；超配实例分步降档、每步留观测期，砍过会限流；交易网关这类有时刻表的负载，开盘前定时预热加指标目标跟踪双层配，夜间不闲置。关联考点：域 3.1.3「基于性能指标实施规格调整和扩缩容策略」。\n\n❌ A：一次砍到底没有观测期，流量一起来先限流，省的钱不够赔。\n❌ C：利用率一成是典型超配浪费，正是规格调整的主场，不是无解属性。\n❌ D：天生锯齿的负载该用弹性伸缩吃波动，缩规格只会让波峰更挤。\n\n📌 关键概念：机读建议先体检、分步降档留观测期、可预测节奏用定时策略；锯齿负载给弹性不给缩规格。","s":"自编·3.1.3"},{"id":"D3-005","d":3,"t":"single","q":"Contoso 的客服 AI token 账单爆了：FAQ 类问题占大头且重复率高、夜间工单批量分类不赶时效、复杂投诉才需要旗舰模型。降本怎么配","o":[{"l":"A","t":"全部流量换最便宜的小模型，投诉也降档"},{"l":"B","t":"夜间工单也走实时接口，保持链路统一"},{"l":"C","t":"FAQ 不做缓存，靠加大并发硬扛"},{"l":"D","t":"FAQ 走缓存命中直接返回，夜间工单攒批走批量接口，复杂投诉留旗舰模型"}],"a":["D"],"e":"✅ 正确项：D。AI 成本三杠杆全用上：高频重复的 FAQ 上缓存，命中直接返回、token 费不出；夜间工单分类不赶时效，攒批走批量接口按批量价算；复杂投诉保留旗舰模型，能力不掉档——质量指标持平、账单降一大截。关联考点：域 3.1.4「优化 AI/ML 工作负载成本」。\n\n❌ A：旗舰模型的复杂推理能力别为省钱降档，投诉处理降档业务受损。\n❌ B：能攒批的非实时任务不走批量价，实时接口按标准单价付费，白白多付。\n❌ C：FAQ 重复率高正说明缓存收益大，加大并发只是花更多钱处理同样的问题。\n\n📌 关键概念：AI 三杠杆是层级降档、攒批走批量价、高频问答走缓存；先评测质量差距再降档。","s":"自编·3.1.4"},{"id":"D3-006","d":3,"t":"single","q":"Fabrikam 多个应用共用同一批 Bedrock 模型，AI 成本要落到各业务单元头上。token 成本的记账口径怎么建","o":[{"l":"A","t":"用 Bedrock 的 token 用量监控，按应用与租户维度归集，各应用用量可分账"},{"l":"B","t":"只看账户级的模型调用总额记账"},{"l":"C","t":"让各应用团队自己上报调用量对账"},{"l":"D","t":"token 费统一记到中心平台账号下，不做分摊"}],"a":["A"],"e":"✅ 正确项：A。共用模型场景下，成本归集要细到按应用、按租户的 token 口径：Bedrock 的 token 用量监控提供这一层维度，哪个应用调了多少 token 可分账，再往下接到成本分摊体系，AI 账单才能落到业务单元头上。关联考点：域 3.1.4「优化 AI/ML 工作负载成本」。\n\n❌ B：账户级总额分不到应用，共用模型的成本归属直接丢失。\n❌ C：自报口径漂移、时区不一，对账对不拢，监控数据才是权威口径。\n❌ D：不分摊等于吃大锅饭，用量大的应用没有降本动力，成本治理失效。\n\n📌 关键概念：AI 成本监控要细到按应用与租户的 token 口径；缓存命中的请求注意别重复计费。","s":"自编·3.1.4"},{"id":"D3-007","d":3,"t":"single","q":"Tailspin 的全球下载站回源费高：源是 S3、静态软件包都带版本化文件名。内容分发怎么配最省","o":[{"l":"A","t":"自建多区域镜像服务器替代 CDN"},{"l":"B","t":"CloudFront 直挂自建 EC2 源站"},{"l":"C","t":"S3 源直挂 CloudFront（同区域回源免数据传输费），开 Origin Shield 收敛回源，静态包配长 TTL"},{"l":"D","t":"动态个性化页面也硬配长缓存 TTL"}],"a":["C"],"e":"✅ 正确项：C。分发降本三件一起配：S3 直挂 CloudFront 是最省的源站形态，同区域回源不产生数据传输费；Origin Shield 在边缘之上再收敛一层回源量；静态包带版本化文件名，放心配长 TTL，命中率上去回源费再降一截。关联考点：域 3.2.1「设计内容分发架构、源站选择策略、缓存策略和故障转移模式」。\n\n❌ A：自建镜像服务器把 CDN 的活自己扛，硬件与运维成本远高于托管分发。\n❌ B：直挂 EC2 源站，回源流量要付传输费，放弃 S3 直挂的免费路径。\n❌ D：动态个性化内容不可缓存，硬配长 TTL 会把每人一份的页面串味返回。\n\n📌 关键概念：S3 源免回源费、Origin Shield 收敛、长 TTL 加版本化文件名——分发三件省钱旋钮。","s":"自编·3.2.1"},{"id":"D3-008","d":3,"t":"multiple","q":"Contoso 的 ETL 集群每天经 NAT 网关搬 S3 数据，数据处理费爆表，跨可用区调用费也不低。哪些优化合理（选所有适用项）","o":[{"l":"A","t":"S3 流量改走互联网直连，绕开 NAT 网关"},{"l":"B","t":"S3 流量改走免费的网关型终端节点，不经 NAT"},{"l":"C","t":"ETL 计算与 S3 数据同可用区落位，收敛跨 AZ 费"},{"l":"D","t":"NAT 网关只保留管理流量"},{"l":"E","t":"数据库的多 AZ 高可用部署也改单 AZ，省跨 AZ 费"}],"a":["B","C","D"],"e":"✅ 正确项：B、C、D。传输路径三步归位：S3 走免费的网关型终端节点，流量不经 NAT 不出互联网；ETL 计算与所搬的 S3 数据同可用区部署，跨 AZ 调用收敛到必要交互；NAT 只留管理流量，处理费大头消掉。关联考点：域 3.2.2「优化数据传输成本」。\n\n❌ A：走互联网出网费比 NAT 处理费更贵，方向反了。\n❌ E：可用性要求跨 AZ 分布的该跨就跨——数据库多 AZ 是高可用底线，流量费给可用性让路。\n\n📌 关键概念：网关型终端节点免费、接口型按需上；同 AZ 免费跨 AZ 计费；可用性优先于流量费。","s":"自编·3.2.2"},{"id":"D3-009","d":3,"t":"single","q":"Fabrikam 的审计数据要做跨区域容灾复制，复制费要控住。复制策略怎么配","o":[{"l":"A","t":"复制规则只筛 audit 关键前缀，目标区副本按独立生命周期转低频层"},{"l":"B","t":"全桶无差别跨区复制，以防万一"},{"l":"C","t":"高频小文件逐个复制，保持副本新鲜"},{"l":"D","t":"目标区副本全部留在标准层，方便随时读取"}],"a":["A"],"e":"✅ 正确项：A。成本感知复制的两个旋钮一起拧：范围筛选——复制规则按前缀筛，只复制审计这类关键数据，非关键数据不跨区；目标区分层——副本配独立生命周期转低频层，容灾副本不占标准层费用。关联考点：域 3.2.3「配置成本感知的多区域数据复制」。\n\n❌ B：为以防万一全桶跨区，大部分数据坏了也无所谓，双倍存储费白付。\n❌ C：高频小文件逐个复制，请求费按写入计，先打包再复制更省。\n❌ D：容灾副本读取频率低，全留标准层是白付贵档位，该分层。\n\n📌 关键概念：复制费由传输、目标存储、请求三块组成；筛前缀是第一旋钮，分层副本是第二旋钮。","s":"自编·3.2.3"},{"id":"D3-010","d":3,"t":"single","q":"Contoso 二十个 VPC 组网：核心三 VPC 之间的流量最大，全部 VPC 要求互相可达，另有一个集中服务账户要给各 VPC 私有访问。组网怎么配最省钱又好管","o":[{"l":"A","t":"二十个 VPC 全部两两建对等连接"},{"l":"B","t":"全部流量统一走 Transit Gateway 处理"},{"l":"C","t":"集中服务暴露公网端点，各 VPC 走公网访问"},{"l":"D","t":"核心三 VPC 走对等零处理费，全部 VPC 挂 Transit Gateway 保可达，集中服务用 PrivateLink 按接口计费"}],"a":["D"],"e":"✅ 正确项：D。组网按流量画像选计费形态：核心三 VPC 流量最大，对等连接零数据处理费最省；全部二十个 VPC 挂 Transit Gateway 保互相可达，长尾流量付处理费换集中管理；集中服务给各 VPC 私有访问用 PrivateLink，按接口终端节点计费，不出网也不建全网互联。关联考点：域 3.2.4「设计高性价比的网络架构」。\n\n❌ A：二十个 VPC 两两对等是一百多条连接的网状拓扑，配置与运维灾难。\n❌ B：全部流量走 TGW，核心大流量也付每 GB 处理费，最贵的路给最大的流。\n❌ C：服务暴露公网，出网费与安全暴露面双输。\n\n📌 关键概念：对等零处理费管核心、TGW 管长尾保可达、PrivateLink 管服务面——三条计费形态按画像混配。","s":"自编·3.2.4"},{"id":"D3-011","d":3,"t":"single","q":"Fabrikam 的全球智能客服在各区域部署同款模型，知识库向量库与检索流量的传输费与延迟都要控。AI 传输成本怎么配","o":[{"l":"A","t":"模型集中部署在单区域，全球请求统一路由过去推理"},{"l":"B","t":"各区模型、向量库、应用同区闭环，高峰溢出请求才路由到邻近空闲区"},{"l":"C","t":"向量库集中一个区域，方便统一管理"},{"l":"D","t":"原始数据全部拉到模型所在区域统一摄取"}],"a":["B"],"e":"✅ 正确项：B。AI 传输的第一优先是同区闭环：各区部署同款模型，知识库向量随区复制，检索与推理流量不出区；高峰期单区容量不足时，才把溢出请求路由到邻近空闲区执行——跨区只发生在溢出时刻，延迟与费用都控住。关联考点：域 3.2.5「优化 AI/ML 工作负载的数据传输成本」。\n\n❌ A：全球请求都跑一个区，检索流量跨区付费又慢，传输费与延迟双输。\n❌ C：向量库集中意味着每次检索都跨区，是最常见的隐性成本来源。\n❌ D：摄取管道应就近在数据所在区域跑，把大数据集拉到模型区，传输费把省的钱吃回去。\n\n📌 关键概念：模型向量同区闭环优先，跨区推理路由只在单区容量不足或各区利用率差明显时启用。","s":"自编·3.2.5"},{"id":"D3-012","d":3,"t":"single","q":"Contoso 四条业务线、十几个项目共用云平台，财务要求按业务线结算云成本。标签地基怎么打","o":[{"l":"A","t":"等资源都跑起来，再组织人力批量补标签"},{"l":"B","t":"键设计越全越好，一次定二十个维度覆盖所有信息"},{"l":"C","t":"定业务单元、项目、环境、负责人四个核心键、值域枚举，基础设施即代码创建时统一打标，周报盯覆盖率"},{"l":"D","t":"键值由各团队自由命名，灵活优先"}],"a":["C"],"e":"✅ 正确项：C。标签地基四步打牢：键设计取业务单元、项目、环境、负责人四个核心键，值域定成枚举防自由发挥；打点时机放在创建时——基础设施即代码里统一带标签，事后补标漏率高；覆盖核对按周盯未标资源清零；账号本身也是分摊维度时可做一级、标签做二级细分。关联考点：域 3.3.1「为成本分摊设计标签策略」。\n\n❌ A：回头补标比同步打标贵数倍，技术债越滚越大。\n❌ B：二十个键的报表没人看，核心四键先跑通，键太碎是给自己找麻烦。\n❌ D：自由命名会出同义不同拼，摊账口径直接乱掉。\n\n📌 关键概念：四键地基加值域枚举加创建时打标；先跑通核心键，标签覆盖率是摊账的生命线。","s":"自编·3.3.1"}],"sections":[{"h":"基于 AWS 定价模型设计架构","body":"### 这一域考什么\n\n这一域问的是：同样的架构，钱怎么少花——买法怎么配、流量费怎么降、账单怎么摊、存储与数据库怎么分层降本。\n\n四条线串起全章：\n\n1. **买法与形态**：购买选项组合与更省的架构形态，对应任务 3.1。\n2. **流量与网络费**：内容分发、传输路径、复制与组网的数据费优化，对应任务 3.2。\n3. **分摊与可视化**：标签、报告、强制与告警，对应任务 3.3。\n4. **存储与数据库费**：分层、卷型、容量模式与保留策略，对应任务 3.4。\n\n这门课是专业级（Professional），成本题的考法是给一组使用画像与约束，让你挑「性价比最优且风险可接受」的组合——不是背折扣数字，是讲「为什么这样配」。\n\n### 读完这个域要能做什么\n\n这门课写给要为账单负责的架构师。读完本域应能：\n\n- 给一份负载画像配上购买选项组合——基线、突发、可中断各归其位。\n- 把架构换成更省的形态，讲清「换装的收益与代价」。\n- 看着数据传输路径说出钱花在哪、怎么降。\n- 设计标签与分摊方案，把成本落到业务单元头上。\n- 给存储与数据库配分层与容量模式，讲清降本逻辑。\n\n### 和其他认证怎么接\n\n| 其他认证/能力 | 对应的那件事 | 这里有什么不同 | 什么时候该想起它 |\n|---|---|---|---|\n| SAA-C03（解决方案架构师助理级） | 都讲实例买法与存储分层 | 助理级认得选项名；专业级要配组合、算账、讲取舍 | 遇到「组合买法」「跨域降本」就卡住时 |\n| DevOps Professional（DOP-C02） | 都讲成本监控与可观测 | DOP 偏运营视角的预算与告警；本域偏架构设计本身的降本 | 要在设计期就锁住成本形态时 |\n\n对照只用来迁移已有理解。做题以本域官方口径为准。\n\n### 官方口径的三条边界\n\n- 官方 Exam Guide 给出技能点编号与原文，不给逐考点的出现频率。\n- 官方认证页写明题型含单选与多选，多选必须全选对才得分。\n- 及格线 720 分（100–1000 补偿式计分），不要求每域单独达线。\n\n#### 这一节学什么\n这一节对应考纲任务 3.1「基于 AWS 定价模型设计架构」。\n\n> 官方原名：Design architectures based on AWS pricing models.\n\n这一任务是全域的买法总纲。四个技能点从购买选项讲到架构换装，再到规格调整与 AI 成本。主线是：买法组合 → 形态换装 → 规格调整 → AI 降本。\n\n#### 根据使用模式选择适当的购买选项\n\n> 官方原名：Select appropriate purchase options based on usage patterns, including commitment-based and capacity-based options (for example, provisioned capacity, Reserved Instances, AWS Savings Plans, Spot Instances, On-Demand Instances).\n\n**这条在问什么。** 考题给你一份负载画像——稳定基线、弹性突发、可中断批处理——让你配买法组合。\n\n**定义**：按需实例（On-Demand）按秒计费零承诺；Savings Plans（省钱的承诺计划）与 Reserved Instances（预留实例）用一到三年的使用承诺换折扣；Spot Instances（竞价型实例）用闲余容量换最大折扣但可能被回收；预置容量是按服务的容量承诺，保供给又降单价。\n\n**怎么运作**。四种买法各管一段：\n\n1. 按需：零承诺打底，弹性层的默认选项。\n2. 承诺类：稳定基线流量用 Savings Plans 或预留实例锁折扣。\n3. Spot：可中断任务（批处理、夜间渲染、低优先级容器）吃闲余容量。\n4. 容量承诺类：按服务的预置容量（如数据库吞吐预留），既保供给又省单价。\n\n**什么时候用，什么时候别用**。基线稳定的部分上承诺，先一年后三年。突发部分按需。能容忍中断的用 Spot——回收前只有两分钟通知，关键链路别放。承诺买法先看利用率：买了用不满等于白付，承诺盖的是「有把握的基线」。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的转码集群：三成基线买一年期 Compute Savings Plans，六成高峰按需弹性，夜间渲染全走 Spot 加检查点续跑；回收通知一到保存进度自动换机。\n\n**关联服务**：AWS Savings Plans、Reserved Instances、Spot Instances、按需实例。\n\n#### 设计成本优化的架构以满足工作负载要求\n\n> 官方原名：Design cost-optimized architectures to meet workload requirements (for example, by using Graviton-based instances, AWS Step Functions Standard Workflows or Express Workflows, AWS Lambda functions).\n\n**这条在问什么。** 考题给你「同样的活要更省的形态」这类降本目标，让你换架构形态。\n\n**定义**：成本优化架构就是同样的活用更便宜的形态干。Graviton 是 AWS 自研 ARM 架构芯片，同代同规格单价比传统架构低；Step Functions 标准工作流与快速工作流两档计费差数量级；Lambda 按毫秒计费零闲置。\n\n**怎么运作**。三条换装路线各管一段：\n\n1. 算力换装：应用换 Graviton 实例，同负载单价更低——先验证兼容再迁。\n2. 工作流分档：短高频流程从标准工作流换快速工作流，单次执行价差数量级。\n3. 无服务器化：长驻小服务换按量计费，闲置时段不付钱。\n\n**什么时候用，什么时候别用**。运行时兼容 ARM 的负载（容器、JVM、脚本类）换 Graviton 几乎白赚。快速工作流单次执行上限五分钟，超时流程换不得。长驻高利用率的服务「无服务器化」反而更贵——按量价是用溢价换弹性，只该给弹性负载。降本改造先算迁移工时：省下的月费能不能覆盖改造投入，一年回不了本就缓一缓。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的报表流水线：批处理容器换 Graviton 集群；每晚跑的小时级流程拆成快速工作流链；凌晨零流量的接口从常驻容器改 Lambda。三处换装，闲置费归零。\n\n**关联服务**：Graviton 实例、AWS Step Functions（标准/快速工作流）、AWS Lambda。\n\n#### 基于性能指标实施规格调整和扩缩容策略\n\n> 官方原名：Implement rightsizing and scaling strategies based on performance metrics (for example, by using AWS Compute Optimizer, scheduled scaling, target tracking policies, AWS Fargate Spot).\n\n**这条在问什么。** 考题给你「实例利用率常年一成、规格是拍的、业务有定时节奏」这类浪费场景。\n\n**定义**：规格调整（rightsizing）按实测性能数据改资源配置。AWS Compute Optimizer 分析利用率出机读建议；定时扩缩容按时刻表加减容量；目标跟踪策略按指标自动定容量；AWS Fargate Spot 是容器任务的闲余容量买法。\n\n**怎么运作**。三件事各管一段：\n\n1. 建议层：Compute Optimizer 分析利用率，给出超配与欠配清单。\n2. 策略层：目标跟踪按 CPU 或请求速率定容量；定时扩缩容卡业务节奏（开盘前预热）。\n3. 买法层：可中断的 Fargate 任务走 Spot 买法。\n\n**什么时候用，什么时候别用**。利用率长期偏低的资源先做规格调整。可预测波动用定时策略省夜间闲置。指标驱动的波动用目标跟踪。规格别一次砍到底——分步降留观测期，砍过了会限流。先分辨负载特征：天生锯齿的负载该用弹性，不是缩规格。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的三百台实例经 Compute Optimizer 体检：两成超配建议降两档；批处理任务改 Fargate Spot；交易网关按「开盘前定时预热加目标跟踪」双层扩缩。\n\n**最小配置示意**（教学示意；建议清单看四类资源）：\n\n```\naws compute-optimizer get-recommendation-summaries \\\n  --region <区域>\n# 控制台看 EC2/Lambda/EBS/ASG 四类建议；\n# 每条建议带：当前配置、建议配置、预估月省金额\n```\n\n**关联服务**：AWS Compute Optimizer、定时扩缩容、目标跟踪策略、AWS Fargate Spot。\n\n#### 优化 AI/ML 工作负载成本\n\n> 官方原名：Optimize costs for AI/ML workloads by selecting the appropriate service tier, implementing batching strategies, and designing caching patterns (for example, by using Amazon Bedrock, Amazon SageMaker AI).\n\n**这条在问什么。** 考题给你「token 账单爆了、推理实例闲置、重复问题反复付费」这类 AI 成本场景。\n\n**定义**：AI 成本有三个杠杆——服务层级（tier，按模型能力分档计费）、批处理（batching，把请求攒批用批量价）、缓存（caching，重复问题直接命中返回）。\n\n**怎么运作**。三个杠杆各管一段：\n\n1. 层级：非关键场景用小模型或轻档，关键场景才上旗舰模型。\n2. 批处理：夜间汇总分析、文档批跑走批量接口，单价按批量档算。\n3. 缓存：高频重复问答（FAQ、模板）命中缓存直接返回，token 费不出。\n\n**什么时候用，什么时候别用**。同屏「够用的小模型」是最快的降本路径——先评测质量差距再换。能攒批的非实时任务走批量价。高频重复问答上缓存。旗舰模型的复杂推理能力别为省钱降档——能力掉档业务受损。AI 成本监控要细到按应用、按租户的 token 口径。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的客服 AI：FAQ 走缓存命中；夜间工单批量分类走批量接口；复杂投诉留旗舰模型。质量指标持平，月账单降下来一大截。\n\n**关联服务**：Amazon Bedrock（模型层级、批量接口、提示词缓存）、Amazon SageMaker AI。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「全量买承诺最省钱」 | 承诺只盖有把握的基线；买了用不满是纯亏 |\n| 2 | 「Spot 也能放生产关键链路」 | 回收前只有两分钟通知；关键链路用按需或承诺 |\n| 3 | 「无服务器一定更便宜」 | 长驻高利用率场景按量价更贵；溢价只给弹性负载 |\n| 4 | 「规格调整一次砍到位」 | 分步降留观测期；砍过会限流 |\n| 5 | 「旗舰模型才够专业」 | 够用的小模型是最快降本路径，先评测再换 |\n| 6 | 「缓存只影响速度不影响账单」 | 命中缓存的请求 token 费少一大截 |\n\n#### 记忆要点\n\n1. **买法四层**：按需打底、承诺盖基线、Spot 吃中断、容量承诺保供给。\n2. **换装三路**：Graviton、工作流分档、无服务器化。\n3. **规格三步**：机读建议、定时卡节奏、目标跟踪卡指标。\n4. **AI 三杠杆**：层级降档、攒批走批量价、高频问答走缓存。\n5. **先测后换**：兼容与质量先验证，再动生产。\n6. **利用率优先**：先看利用率，再谈承诺与规格。\n\n---"},{"h":"优化数据传输和网络成本","body":"#### 这一节学什么\n这一节对应考纲任务 3.2「优化数据传输和网络成本」。\n\n> 官方原名：Optimize data transfer and network costs.\n\n这一任务管流量账。五个技能点从内容分发讲到出网路径，再到复制策略、组网计费与 AI 传输。主线是：分发降本 → 路径优化 → 复制感知 → 组网选型 → AI 闭环。\n\n#### 设计内容分发架构、源站选择策略、缓存策略和故障转移模式\n\n> 官方原名：Design content delivery architectures, origin selection strategies, caching strategies, and failover patterns (for example, by using Amazon CloudFront, Amazon CloudFront Origin Shield).\n\n**这条在问什么。** 考题给你「全球用户回源贵、源站怎么选、缓存怎么配、源站故障怎么切」这类分发成本与体验题。\n\n**定义**：Amazon CloudFront 是 CDN。源站选择决定缓存未命中去哪拿数据；缓存策略决定命中率；故障转移配「主源失败切备用源」。Origin Shield（源站屏蔽）是 CloudFront 之上的再一层缓存，收敛回源量。\n\n**怎么运作**。四件事各管一段：\n\n1. 源站选择：S3 直挂最省——CloudFront 回源同区域 S3 不产生数据传输费。\n2. 缓存策略：静态内容长 TTL 加版本化文件名；动态内容按头部与 Cookie 细分。\n3. Origin Shield：边缘节点的回源先收敛到这一层，再省一截回源费。\n4. 故障转移：主源健康检查失败自动切备用源，多区域源站保可用。\n\n**什么时候用，什么时候别用**。全球静态内容分发必上 CDN——用户拿得近、回源付得少。单区域源站开 Origin Shield 收益明显；源站本身多区域分布时收益小。动态不可缓存内容（个性化页面）CDN 只做传输加速，别硬配缓存。故障转移别只配 CDN 层：源站的多区域容灾要配好，CDN 才有得切。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的全球下载站：S3 源直挂 CloudFront，开 Origin Shield 二层缓存；静态包带哈希文件名配一年 TTL；主源故障自动切备用源。分发费与回源费双降。\n\n**关联服务**：Amazon CloudFront、CloudFront Origin Shield、Amazon S3（源站）。\n\n#### 优化数据传输成本\n\n> 官方原名：Optimize data transfer costs by using strategies such as private connectivity, Regional traffic patterns, and inter-Availability Zone/inter-Region strategies (for example, by using VPC endpoints, NAT gateways, Availability Zone-aware architectures).\n\n**这条在问什么。** 考题给你「出网费、跨可用区费、跨区域费都在涨」这类流量账，让你改架构路径。\n\n**定义**：数据传输费按「跨了什么界」计——出互联网最贵，跨区域按方向计费，同区域跨可用区每方向计费，同可用区内免费。VPC 终端节点走私有路径免出网；NAT 网关收数据处理费；可用区感知架构让服务与数据同区同 AZ 落位。\n\n**怎么运作**。三类路径优化各管一段：\n\n1. 免出网：S3 与 DynamoDB 走网关型终端节点（免费）或接口型终端节点，流量不经 NAT 不出互联网。\n2. AZ 内聚拢：服务与所依赖的数据同可用区部署，跨 AZ 调用收敛到必要交互。\n3. 区域感知：跨区域复制按业务价值定「复制什么、复制几份」，非关键数据不跨区。\n\n**什么时候用，什么时候别用**。S3 与 DynamoDB 重流量场景，终端节点的成本很快被省下的 NAT 处理费覆盖——先算量再上。AZ 聚拢别做绝：可用性要求跨 AZ 分布的（数据库多 AZ），该跨就跨，可用性比流量费贵。S3 与 DynamoDB 用免费的网关型，其余服务用接口型按需上。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的 ETL 集群每天经 NAT 网关搬 S3 数据，处理费爆表。改走免费的 S3 网关终端节点后，NAT 只剩管理流量；数据处理与 S3 同可用区落位，跨 AZ 费同步收敛。\n\n**关联服务**：VPC 终端节点（网关型/接口型）、NAT 网关、可用区感知部署。\n\n#### 配置成本感知的多区域数据复制\n\n> 官方原名：Configure cost-aware, multi-Region data replication (for example, by using Amazon S3 Cross-Region Replication, Amazon DynamoDB global tables).\n\n**这条在问什么。** 考题给你「要跨区域容灾或全球就近访问，但复制费要控」这类权衡题。\n\n**定义**：S3 跨区域复制（CRR）把对象异步复制到另一区域；DynamoDB global tables 做多区域双活复制。复制的成本由三块组成：传输费、目标区存储费、请求费。\n\n**怎么运作**。三个省钱旋钮各管一段：\n\n1. 范围筛选：复制规则按前缀与标签筛——只复制关键前缀，非关键不跨区。\n2. 存储分层：目标区副本配独立分层策略，转低频或归档层。\n3. 请求感知：复制请求费按写入计——高频小文件先打包再复制更省。\n\n**什么时候用，什么时候别用**。合规与容灾要跨区的关键数据，复制是必要成本，用筛选与分层压到「只复制该复制的」。全球读就近用 global tables，按「读多写少」评估收益。别为以防万一全桶跨区——大部分数据坏了也无所谓。global tables 的双写冲突要用业务规则兜住。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的审计数据要双区域容灾：复制规则只筛 audit 前缀，目标区副本按独立生命周期转低频层；电商商品表走 global tables 支撑全球读，写集中在单区域。\n\n**最小配置示意**（教学示意；CRR 规则按前缀筛选）：\n\n```\naws s3api put-bucket-replication \\\n  --bucket <源桶> \\\n  --replication-configuration '{\n    \"Role\": \"<IAM角色ARN>\",\n    \"Rules\": [{\n      \"Status\": \"Enabled\",\n      \"Filter\": { \"Prefix\": \"audit/\" },\n      \"Destination\": { \"Bucket\": \"arn:aws:s3:::<目标桶>\" }\n    }]\n  }'\n```\n\n**关联服务**：Amazon S3 跨区域复制、Amazon DynamoDB global tables。\n\n#### 设计高性价比的网络架构\n\n> 官方原名：Design cost-effective network architectures (for example, by using AWS Transit Gateway data processing charges, AWS PrivateLink pricing models).\n\n**这条在问什么。** 考题给你「VPC 互联的流量怎么走最省、私有服务访问怎么计费」这类组网成本题。\n\n**定义**：Transit Gateway 的费用有两块——附件的小时费与每 GB 的数据处理费；AWS PrivateLink 按接口终端节点小时费加数据处理费计价。选组网形态就是选计费形态。\n\n**怎么运作**。三条组网路径对比着选：\n\n1. 对等连接：VPC 间点对点，无数据处理费，但网状拓扑难管。\n2. Transit Gateway：星型好管、路由集中可控，付附件费与每 GB 处理费。\n3. PrivateLink：跨账户私访服务免出网费，付接口小时费与处理费。\n\n**什么时候用，什么时候别用**。流量小拓扑简单，对等免处理费最省。几十 VPC 要集中管路由，TGW 的管理价值大于处理费。跨账户消费服务用 PrivateLink 按接口付费，比建全网互联省。混合场景别一刀切——对等管核心链路、TGW 管长尾、PrivateLink 管服务面。\n\n💡 **场景举例**（虚构教学示意）：Contoso 二十个 VPC：核心三 VPC 流量最大走对等，零处理费；全部 VPC 挂 TGW 保可达，长尾流量付处理费；集中服务用 PrivateLink 按接口计费。三条路径各按流量画像选。\n\n**关联服务**：AWS Transit Gateway（附件与数据处理费）、AWS PrivateLink（接口终端节点计费）、VPC 对等连接。\n\n#### 优化 AI/ML 工作负载的数据传输成本\n\n> 官方原名：Optimize data transfer costs for AI/ML workloads by using strategies such as cross-Region inference routing.\n\n**这条在问什么。** 考题给你「推理要跨区域、向量库放在哪、检索流量费怎么控」这类 AI 传输成本题。\n\n**定义**：跨区域推理路由把推理请求引向「容量与成本更优」的区域执行。模型与向量库同区部署是基本盘——检索流量跨区是最常见的隐性成本。\n\n**怎么运作**。三个降本动作各管一段：\n\n1. 同区闭环：模型、向量库、应用同区域部署，检索与推理流量不出区。\n2. 跨区路由：高峰溢出时把请求路由到邻近空闲区执行。\n3. 摄取就近：数据摄取管道在数据所在区域跑，别把原始数据拉到模型区。\n\n**什么时候用，什么时候别用**。推理与检索同区闭环是第一优先——跨区检索延迟与费用双输。跨区推理路由适合「单区容量不足或各区利用率差明显」的场景，普通流量就近出。摄取就近对大数据集收益最大。别为省模型侧费用把数据拉半个地球——传输费与延迟会把省的钱吃回去。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的全球智能客服：各区部署同款模型，知识库向量随区复制，检索推理区内闭环；高峰期把溢出请求路由到邻近空闲区——跨区只在溢出时发生。\n\n**关联服务**：Amazon Bedrock（跨区域推理路由）、向量存储（同区部署）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「CDN 只是加速工具」 | CDN 同时是降本工具：就近命中减少回源与出网费 |\n| 2 | 「NAT 网关是唯一出口」 | S3 与 DynamoDB 走网关终端节点免 NAT 处理费 |\n| 3 | 「跨可用区免费、跨区域才收费」 | 同区域跨可用区每方向计费；同可用区才免费 |\n| 4 | 「CRR 复制的是整个费用模型」 | 复制费由传输、目标存储、请求三块组成；筛前缀是第一旋钮 |\n| 5 | 「TGW 更高级所以选 TGW」 | 对等零处理费、TGW 好管但收处理费；按流量画像选 |\n| 6 | 「模型与向量库分开部署更灵活」 | 分区部署意味着每次检索跨区付费又慢；同区闭环优先 |\n\n#### 记忆要点\n\n1. **分发省钱**：S3 源免回源费、Origin Shield 收敛、长 TTL 加版本化。\n2. **出网归零**：网关终端节点免费、接口型按需、NAT 只留管理流量。\n3. **AZ 内聚拢**：同 AZ 免费跨 AZ 计费；可用性优先于流量费。\n4. **复制三旋钮**：筛范围、分层副本、批量请求。\n5. **组网按画像**：对等零处理费、TGW 管长尾、PrivateLink 管服务面。\n6. **AI 同区闭环**：模型向量同区，溢出才跨区路由。\n\n---"},{"h":"设计成本分摊和可视化方案","body":"#### 这一节学什么\n这一节对应考纲任务 3.3「设计成本分摊和可视化方案」。\n\n> 官方原名：Design cost allocation and visibility solutions.\n\n这一任务让每一分钱有主。五个技能点从标签地基讲到账单数据，再到强制与分摊落地，最后配监控告警。主线是：标签地基 → 账单数据 → 标签强制 → 分摊落地 → 监控告警。\n\n#### 为成本分摊设计标签策略\n\n> 官方原名：Design tagging strategies for cost allocation (for example, by using tags for business units, projects, and environments).\n\n**这条在问什么。** 考题给你「多个 BU 共用云、账单要按业务单元结算、标签是摊账的地基」这类场景。\n\n**定义**：标签是资源的键值对，是成本分摊的原子。BU（business unit，业务单元）按业务线划分。标签策略定「打什么键、什么值域、谁负责打」。\n\n**怎么运作**。四步各管一段：\n\n1. 键设计：业务单元、项目、环境、负责人是四类基本键；值域定成枚举，防自由发挥。\n2. 打点时机：创建时就打——基础设施即代码里统一带标签，事后补打漏率高。\n3. 覆盖核对：按标签维度查覆盖率，未标资源按计划清理。\n4. 账号配合：账号本身也是分摊维度（一 BU 一账号）时，标签做二级细分。\n\n**什么时候用，什么时候别用**。多 BU 多项目摊账，标签是地基；「先跑起来再补标签」会欠技术债——回头补标比同步打标贵数倍。粗粒度分摊可以账号优先，标签做补充。键别设计太碎——二十个键的报表没人看，核心四键先跑通。\n\n💡 **场景举例**（虚构教学示意）：Contoso 四条 BU 十几个项目：标签规范定业务单元、环境、负责人、项目四个键，值域枚举；资源经基础设施即代码统一带标签，周报盯未标资源，清零后再摊账。\n\n**关联服务**：标签体系、AWS Resource Groups（按标签聚合视图）。\n\n#### 配置使用详细账单数据的成本报告与分析方案\n\n> 官方原名：Configure cost reporting and analytics solutions that use detailed billing data (for example, by using AWS Cost Explorer, AWS Cost and Usage Reports).\n\n**这条在问什么。** 考题给你「要按 BU、项目、服务拆账单，要出月报」这类报告需求。\n\n**定义**：AWS Cost Explorer 是交互式成本分析；AWS Cost and Usage Reports（CUR，成本与使用报告）把逐行级账单数据落到 S3，是深度分析的数据源。\n\n**怎么运作**。三件各管一段：\n\n1. 交互分析：Cost Explorer 按服务、标签、时间切账，出趋势与预测。\n2. 明细数据：CUR 逐行落 S3，带标签与折扣明细，Athena 直接 SQL 查。\n3. 汇报口径：成本类别把分组规则固化成「谁看哪组成本」，报表一键出。\n\n**什么时候用，什么时候别用**。日常看趋势与异常用 Cost Explorer；自定义口径的深度摊账分析用 CUR 加 Athena。标签没打齐前别急着建报表——垃圾进垃圾出。CUR 注意账单周期与数据日期口径，跨月对账按数据日期算。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的财务月报：CUR 落 S3 经 Athena 出「BU 乘服务乘环境」三维账单；成本类别把「共享平台成本按用户数摊」固化成规则，月报自动化。\n\n**关联服务**：AWS Cost Explorer、AWS Cost and Usage Reports、Amazon Athena（账单查询）。\n\n#### 为成本分摊实施基于策略的标签强制\n\n> 官方原名：Implement policy-based tagging enforcement for cost allocation (for example, by using SCPs, AWS Config rules, tag policies).\n\n**这条在问什么。** 考题给你「要求所有资源必须带标签，怎么强制落地」这类治理需求。\n\n**定义**：标签强制有三件武器——SCP 在组织层拒绝无标签的创建动作；AWS Config 规则持续查出未标资源；标签策略管键名与值域的规范性。\n\n**怎么运作**。三件各管一段：\n\n1. 事前拦：SCP 拒绝不带必填标签的创建（开实例、建桶这类动作）。\n2. 事中查：Config 的 required-tags 托管规则持续报未标资源。\n3. 规范值：标签策略管键名拼写与枚举值，防「同义不同拼」。\n\n**什么时候用，什么时候别用**。成熟组织用 SCP 硬拦最彻底；刚起步先用 Config 周报软约束，存量清完再上硬拦。别一上来全资源类型硬拦——从费用大头（实例、对象存储、数据库）开始逐步扩。标签策略与 SCP 是互补不是替代。\n\n💡 **场景举例**（虚构教学示意）：Contoso 先用 Config 规则清存量，三个月后上 SCP：无业务单元标签拒绝创建。新资源从「漏打」变「创建不了」，摊账覆盖率稳住。\n\n**最小配置示意**（教学示意；无必填标签的创建拒绝）：\n\n```\n{\n  \"Statement\": [{\n    \"Sid\": \"DenyCreateWithoutCostCenter\",\n    \"Effect\": \"Deny\",\n    \"Action\": [\"ec2:RunInstances\", \"s3:CreateBucket\", \"rds:CreateDBInstance\"],\n    \"Resource\": \"*\",\n    \"Condition\": {\n      \"Null\": { \"aws:RequestTag/cost-center\": \"true\" }\n    }\n  }]\n}\n```\n\n**关联服务**：SCP（标签强制）、AWS Config 规则（required-tags）、AWS Organizations 标签策略。\n\n#### 实施费用返还和成本展示能力\n\n> 官方原名：Implement chargeback and showback capabilities for cost allocation (for example, by using cost categories, split cost allocation, token usage monitoring for Amazon Bedrock).\n\n**这条在问什么。** 考题给你「要向 BU 收钱或亮账、共享成本怎么摊、AI 的 token 费怎么记账」这类分摊落地题。\n\n**定义**：费用返还（chargeback）真扣钱；成本展示（showback）只亮账不扣钱。成本类别是固化分组规则；成本拆分（split cost allocation）把共享资源成本按实际用量拆给使用者；Bedrock 的 token 用量监控把 AI 成本落到调用方。\n\n**怎么运作**。三件事各管一段：\n\n1. 口径层：成本类别固化「谁看哪组成本」的规则，按视图出账。\n2. 摊账层：共享成本按用量指标拆分（存储按容量、平台按调用量），CUR 里带明细。\n3. AI 记账：Bedrock 的 token 用量指标接监控体系，按应用与租户归集。\n\n**什么时候用，什么时候别用**。先 showback 再 chargeback：亮账半年让 BU 认账，再真扣钱阻力小。共享成本的摊账规则要业务认账——「按用户数还是按调用量」是管理决策不是技术决策。AI 成本按 token 归集时注意缓存命中别重复计费。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 平台成本先 showback 半年：成本类别按 BU 出账，共享数据平台按存储量拆分；下一季度转 chargeback，Bedrock token 费按应用维度归集。每个 BU 月账单一页纸。\n\n**关联服务**：成本类别、成本拆分（CUR）、Amazon Bedrock token 用量监控。\n\n#### 配置成本监控和告警方案，包含预算阈值和异常检测\n\n> 官方原名：Configure cost monitoring and alerting solutions that include budget thresholds and anomaly detection (for example, by using AWS Budgets, AWS Cost Anomaly Detection).\n\n**这条在问什么。** 考题给你「成本要提前预警：预算别爆、异常别迟发现」这类监控需求。\n\n**定义**：AWS Budgets 按成本、用量或利用率设预算阈值告警；AWS Cost Anomaly Detection（成本异常检测）用机器学习基线分离真异常与正常波动。\n\n**怎么运作**。三件事各管一段：\n\n1. 预算层：按 BU 与项目设月度成本预算，阈值分档逐级告警。\n2. 异常层：异常检测盯单日突增与服务突跳，过滤节假日正常波动。\n3. 闭环层：告警接通知与工单，责任人明确，超配有处置流程。\n\n**什么时候用，什么时候别用**。固定成本基线用预算盯；不规则波动用异常检测的学习基线。预算别只设总账——按 BU 与服务分层设，否则「总量正常但某 BU 爆了」看不见。告警没有闭环等于没告警：收到的人知道该干什么最重要。\n\n💡 **场景举例**（虚构教学示意）：Contoso 给每 BU 设预算三档告警；异常检测盯出「某测试环境深夜跑了三倍的推理量」，工单自动到负责人，两小时定位到新加的批处理脚本。\n\n**关联服务**：AWS Budgets、AWS Cost Anomaly Detection、Amazon SNS（告警通知）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「标签可以事后补」 | 创建时同步打最省；存量补标成本数倍 |\n| 2 | 「Cost Explorer 就是全部报表」 | 深度摊账要 CUR 逐行数据加 Athena |\n| 3 | 「标签策略能强制必打」 | 标签策略管规范性；必打强制是 SCP 的活 |\n| 4 | 「showback 直接跳 chargeback」 | 先亮账认账再真扣钱，阻力最小 |\n| 5 | 「预算只设总账就够」 | 按 BU 与服务分层设，否则局部爆雷看不见 |\n| 6 | 「异常检测误报多不如人盯」 | 学习基线恰恰过滤正常波动；闭环靠人 |\n\n#### 记忆要点\n\n1. **四键地基**：业务单元、项目、环境、负责人，值域枚举。\n2. **两层数据**：交互看 Explorer，深分析走 CUR 加 Athena。\n3. **强制三段**：事前 SCP 拦、事中 Config 查、值域标签策略管。\n4. **先亮后扣**：showback 认账，chargeback 落地。\n5. **预算分层**：总账、BU、服务三层阈值。\n6. **异常有基线**：学习分离波动，告警要闭环。\n\n---"},{"h":"优化存储和数据库成本","body":"#### 这一节学什么\n这一节对应考纲任务 3.4「优化存储和数据库成本」。\n\n> 官方原名：Optimize storage and database costs.\n\n这一任务管存量数据的账单。五个技能点从存储分层讲到卷型选配，再到数据库容量模式、备份保留与可观测性成本。主线是：存储分层 → 卷型 IOPS → 容量模式 → 备份保留 → 观测降本。\n\n#### 实施智能存储分层和生命周期策略\n\n> 官方原名：Implement intelligent storage tiering and lifecycle policies (for example, by using Amazon S3 Intelligent-Tiering, S3 Lifecycle policies, S3 Glacier storage classes, Amazon EFS lifecycle policies).\n\n**这条在问什么。** 考题给你「访问模式说不准或数据会老化、存储费要自动降下来」这类分层题。\n\n**定义**：S3 存储类别从标准、低频到归档（Glacier 的即时取回、灵活取回、深度归档三档），一档比一档便宜、一档比一档取回慢。Intelligent-Tiering（智能分层）按访问频率自动换层；生命周期策略按时间规则转层与过期；EFS 生命周期策略把冷文件转低频层。\n\n**怎么运作**。三条路各管一段：\n\n1. 拿不准访问模式：Intelligent-Tiering 自动在频繁、不频繁、归档档间迁移，用少量监控费换「不猜错」。\n2. 访问规律明确：生命周期规则定时转层（九十天转低频、一年转深度归档）与到期删除。\n3. 文件系统侧：EFS 生命周期把不动的文件转低频层，访问时自动回暖。\n\n**什么时候用，什么时候别用**。访问模式随机或不可预测，用 Intelligent-Tiering；模式稳定可预期，直接写生命周期规则更省。归档档取回慢且有取回费——「万一要看」的频率真低才配归档。别把可能要用的数据直接归档，取回等待与费用都疼。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的日志桶：当月标准层、九十天转低频、一年转深度归档；访问模式不明的分析数据进智能分层桶。多年日志存储费降到直存的零头。\n\n**最小配置示意**（教学示意；生命周期转层规则）：\n\n```\naws s3api put-bucket-lifecycle-configuration \\\n  --bucket <日志桶> \\\n  --lifecycle-configuration '{\n    \"Rules\": [{\n      \"ID\": \"logs-tiering\",\n      \"Status\": \"Enabled\",\n      \"Filter\": { \"Prefix\": \"logs/\" },\n      \"Transitions\": [\n        { \"Days\": 90, \"StorageClass\": \"STANDARD_IA\" },\n        { \"Days\": 365, \"StorageClass\": \"DEEP_ARCHIVE\" }\n      ]\n    }]\n  }'\n```\n\n**关联服务**：Amazon S3 Intelligent-Tiering、S3 生命周期策略、S3 Glacier 存储类别、Amazon EFS 生命周期。\n\n#### 通过选择适当卷类型和配置适当的 IOPS 优化块存储成本\n\n> 官方原名：Optimize block storage costs by selecting appropriate volume types and provisioning appropriate input/output operations per second (IOPS) (for example, Amazon EBS gp3 volumes, EBS gp2 volumes, Provisioned IOPS).\n\n**这条在问什么。** 考题给你「数据库要 IOPS、卷型怎么选、IOPS 怎么配」这类块存储账单题。\n\n**定义**：EBS 卷型分通用型（gp2 与 gp3）与高 IOPS 型（io 系列）。IOPS（input/output operations per second，每秒输入输出操作数）是卷的性能口径。gp3 的基线性能与容量解耦、单价低于 gp2；io 系列按需预置超高 IOPS。\n\n**怎么运作**。三条选型线各管一段：\n\n1. 换代：在产 gp2 卷直接换 gp3——同规格单价下降，性能基线还独立于容量。\n2. 基线与付费解耦：gp3 的 IOPS 与吞吐单独加钱，「小盘高 IOPS」的卷不再被迫买大容量。\n3. 高档专用：io 系列给延迟敏感的核心数据库（单卷超高 IOPS），按需预置。\n\n**什么时候用，什么时候别用**。通用负载（启动盘、应用盘）一律 gp3；gp2 旧卷迁移是白赚。核心交易数据库要稳定低延迟与超高 IOPS 才上 io；普通数据库 gp3 加够 IOPS 大多够用。快照是增量存的，但数量失控照样费钱又难管，过期快照要按周期清。\n\n💡 **场景举例**（虚构教学示意）：Contoso 体检 EBS：三百个 gp2 卷全换 gp3 同规格月费直降；报表数据库「小盘要高 IOPS」按 gp3 独立买 IOPS 不再买大容量；核心账务库走 io 系列保尾延迟。三类负载三种卷型。\n\n**关联服务**：Amazon EBS（gp2/gp3/io 系列）、EBS 快照（增量与保留）。\n\n#### 通过选择适当的容量模式和预留容量优化数据库成本\n\n> 官方原名：Optimize database costs by selecting appropriate capacity modes and reserved capacity (for example, DynamoDB capacity modes, Amazon RDS reserved DB instances, Amazon Aurora serverless, Aurora I/O-Optimized, Database Savings Plans).\n\n**这条在问什么。** 考题给你「数据库流量画像各异——稳定、波动、I/O 重——容量与承诺怎么配」这类数据库账单题。\n\n**定义**：容量模式是计费形态——DynamoDB 按需模式按请求计费、预置模式按容量计费；Aurora Serverless 按计算单元自动伸缩；预留容量用使用承诺换折扣（RDS 预留数据库实例、Database Savings Plans）；Aurora I/O-Optimized 是「I/O 不计费」的计价形态。\n\n**怎么运作**。四种形态各管一段：\n\n1. 按需模式：DynamoDB 按请求计费，波动的兜底。\n2. 预置模式：DynamoDB 按容量计费，稳定流量便宜；配自动扩缩容防尖峰。\n3. Serverless：Aurora Serverless 按需伸缩，闲时近乎零费，适合波动与间歇负载。\n4. 承诺与特殊价：稳定长跑库买预留或 Savings Plans；I/O 费占大头的库换 I/O-Optimized——存储与计算费用上调、I/O 零费。\n\n**什么时候用，什么时候别用**。稳定高流量用预置加自动扩缩容；忽高忽低或间歇用 Serverless；长跑一年以上锁承诺折扣；I/O 占账单大头的库算 I/O-Optimized 的账。别用 Serverless 撑持续满载——按量价对满载负载是溢价。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 数据库组合：购物车表预置加自动扩缩容；营销活动库 Aurora Serverless 吃活动期起伏；主交易库三年预留；日志分析库 I/O 费占六成，换 I/O-Optimized 后总账反降。\n\n**关联服务**：Amazon DynamoDB（容量模式与自动扩缩容）、Amazon RDS 预留数据库实例、Aurora Serverless、Aurora I/O-Optimized、Database Savings Plans。\n\n#### 实施采用成本优化保留策略的备份和灾难恢复机制\n\n> 官方原名：Implement backup and disaster recovery mechanisms that use cost-optimized retention policies (for example, by using AWS Backup, Amazon Data Lifecycle Manager).\n\n**这条在问什么。** 考题给你「备份要合规又不想无限留、跨区副本费要控」这类备份账单题。\n\n**定义**：AWS Backup 是统一备份服务，跨服务统一策略；Amazon Data Lifecycle Manager（DLM，数据生命周期管理器）自动做 EBS 快照的创建与清理。保留策略定「每类备份留多久、留几份」。\n\n**怎么运作**。三个旋钮各管一段：\n\n1. 分级保留：日备、周备、月备的阶梯保留，到期自动删。\n2. 跨区副本按需：关键数据跨区副本留精简档，非关键不跨区。\n3. 自动化：DLM 管快照生命周期；AWS Backup 计划带保留期与冷存转层选项。\n\n**什么时候用，什么时候别用**。合规要求年限的（金融记录）留够但配归档层。多数业务数据的保留期对齐恢复目标，别无限留。跨区副本按「真会切换」的灾备范围配——全量跨区是双倍存储费。快照数量失控是常见隐性成本，保留规则必须自动清理。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的备份策略：核心库日备保三十天、周备保十二周、月备保七年，阶梯到期自动删；跨区副本只留周备；EBS 快照经 DLM 自动清过期。备份账单与容量同步压住。\n\n**关联服务**：AWS Backup（策略与冷存）、Amazon Data Lifecycle Manager（EBS 快照生命周期）。\n\n#### 设计高性价比的可观测性方案\n\n> 官方原名：Design cost-effective observability solutions that include features such as log filtering, metric aggregation, and retention optimization.\n\n**这条在问什么。** 考题给你「日志与指标费随规模线性涨、可观测性要又全又省」这类观测账单题。\n\n**定义**：可观测性成本有三头：日志摄入与存储、指标数与分辨率、告警通知。降本靠三个杠杆——日志过滤、指标聚合、保留优化。高基数（high-cardinality，维度组合极多）指标最贵：每个组合一条时序。\n\n**怎么运作**。三个杠杆各管一段：\n\n1. 日志过滤：采集侧先滤（调试级不上生产、健康检查日志丢弃），订阅过滤器只把有价值日志送下游。\n2. 指标聚合：高基数维度合并（实例明细聚成集群级），明细按需抽样。\n3. 保留优化：排障热数据短期留、审计数据转 S3 长留，分级各归其位。\n\n**什么时候用，什么时候别用**。健康检查与调试级这类「看了也不排障」的日志，采都不该采。指标基数控制住比事后删指标有效。保留分级前先问合规底线——审计类日志的保留是合规决定的，不是成本决定的。别为省观测费砍黄金指标——排障时缺数据的代价更大。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 观测降本：调试级日志不上生产、负载均衡健康检查日志经订阅过滤丢弃；每实例指标聚成集群级；排障日志短留、审计日志转 S3 归档层长留。观测费降半而黄金指标一个不少。\n\n**关联服务**：Amazon CloudWatch Logs（订阅过滤）、CloudWatch 指标（聚合）、Amazon S3（审计长留）。\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「数据放着不管也免费」 | 存储按月计费；老数据不转层就是白付 |\n| 2 | 「访问模式拿不准就选归档」 | 拿不准用 Intelligent-Tiering；归档取回慢且有费 |\n| 3 | 「gp2 换 gp3 有迁移风险」 | 同为通用型，官方支持直接换，单价还降 |\n| 4 | 「Serverless 一定更省」 | 满载负载按量价是溢价；波动负载才划算 |\n| 5 | 「备份留得越多越安全」 | 保留按恢复目标定；跨区全量复制是双倍存储费 |\n| 6 | 「日志全采最保险」 | 健康检查与调试级采了也排不了障，纯花钱 |\n\n#### 记忆要点\n\n1. **分层三路**：模式不定走智能分层、规律明确走生命周期、文件系统走 EFS 生命周期。\n2. **卷型三选**：通用 gp3、小盘高 IOPS 独立配、核心库 io。\n3. **容量四态**：按需兜底、预置稳态、Serverless 波动、承诺锁长跑。\n4. **I/O 形态**：I/O 重的库算 Aurora I/O-Optimized 的账。\n5. **备份阶梯**：日、周、月分级保留，跨区只留关键。\n6. **观测三杠杆**：滤日志、聚指标、分保留。\n\n---"}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 3.1.1 | 购买选项组合（按需/承诺/Spot/容量） | ⭐⭐⭐ | 情景单选/多选 |\n| 3.1.2 | 换装三路（Graviton/工作流分档/无服务器） | ⭐⭐ | 情景单选 |\n| 3.1.3 | 规格调整与扩缩容策略 | ⭐⭐⭐ | 情景单选 |\n| 3.1.4 | AI 成本三杠杆（层级/批量/缓存） | ⭐⭐ | 情景单选 |\n| 3.2.1 | CloudFront 源站选择与 Origin Shield | ⭐⭐ | 情景单选 |\n| 3.2.2 | 传输路径优化（终端节点/AZ 聚拢） | ⭐⭐⭐ | 情景单选/多选 |\n| 3.2.3 | 成本感知复制（CRR/global tables 旋钮） | ⭐⭐ | 情景单选 |\n| 3.2.4 | 组网计费形态选型（对等/TGW/PrivateLink） | ⭐⭐ | 情景单选 |\n| 3.2.5 | AI 同区闭环与跨区推理路由 | ⭐⭐ | 单选 |\n| 3.3.1 | 标签策略与四键地基 | ⭐⭐⭐ | 情景单选 |\n| 3.3.2 | Cost Explorer 与 CUR 两层数据 | ⭐⭐ | 情景单选 |\n| 3.3.3 | 标签强制三段（SCP/Config/标签策略） | ⭐⭐⭐ | 情景多选 |\n| 3.3.4 | showback 与 chargeback、AI token 记账 | ⭐⭐ | 单选 |\n| 3.3.5 | 预算分层与异常检测 | ⭐⭐ | 单选 |\n| 3.4.1 | 智能分层与生命周期三路 | ⭐⭐⭐ | 情景单选 |\n| 3.4.2 | gp3 与 io 选型、IOPS 独立配 | ⭐⭐ | 情景单选 |\n| 3.4.3 | 容量模式四态与 I/O-Optimized | ⭐⭐⭐ | 情景单选 |\n| 3.4.4 | 备份阶梯保留与跨区副本 | ⭐⭐ | 情景单选 |\n| 3.4.5 | 可观测性三杠杆（过滤/聚合/保留） | ⭐⭐ | 情景多选 |","services":"| 服务 | 主要用途 | 涉及知识点 |\n|---|---|---|\n| Savings Plans / Reserved Instances / Spot Instances / 按需实例 | 购买选项组合 | 3.1.1 |\n| Graviton 实例 / Step Functions（两档工作流） / Lambda | 架构换装 | 3.1.2 |\n| AWS Compute Optimizer / 定时与目标跟踪扩缩容 / Fargate Spot | 规格与扩缩 | 3.1.3 |\n| Amazon Bedrock（层级/批量/缓存） / SageMaker AI | AI 成本杠杆 | 3.1.4、3.2.5 |\n| Amazon CloudFront / Origin Shield | 分发降本 | 3.2.1 |\n| VPC 终端节点 / NAT 网关 / 可用区感知部署 | 传输路径 | 3.2.2 |\n| S3 跨区域复制 / DynamoDB global tables | 复制感知 | 3.2.3 |\n| Transit Gateway / PrivateLink / VPC 对等连接 | 组网计费形态 | 3.2.4 |\n| 标签体系 / AWS Resource Groups | 分摊地基 | 3.3.1 |\n| AWS Cost Explorer / Cost and Usage Reports / Athena | 账单分析 | 3.3.2 |\n| SCP / AWS Config 规则 / Organizations 标签策略 | 标签强制 | 3.3.3 |\n| 成本类别 / 成本拆分 / Bedrock token 用量监控 | 分摊落地 | 3.3.4 |\n| AWS Budgets / Cost Anomaly Detection / SNS | 监控告警 | 3.3.5 |\n| S3 Intelligent-Tiering / 生命周期 / Glacier / EFS 生命周期 | 存储分层 | 3.4.1 |\n| Amazon EBS（gp2/gp3/io） | 块存储选型 | 3.4.2 |\n| DynamoDB 容量模式 / RDS 预留 / Aurora Serverless / I/O-Optimized / Database Savings Plans | 数据库容量 | 3.4.3 |\n| AWS Backup / Data Lifecycle Manager | 备份保留 | 3.4.4 |\n| CloudWatch Logs（订阅过滤）/ CloudWatch 指标 | 观测降本 | 3.4.5 |","furtherReading":"| 页面 | 什么时候去看 | URL |\n|---|---|---|\n| SAP-C03 Exam Guide · Domain 3 | 本域技能点原文与权重 | https://docs.aws.amazon.com/aws-certification/latest/solutions-architect-professional-03/solutions-architect-professional-03-domain3.html |\n| AWS Savings Plans 用户指南 | 承诺买法官方口径 | https://docs.aws.amazon.com/savingsplans/latest/userguide/ |\n| Amazon S3 用户指南 | 存储类别与生命周期 | https://docs.aws.amazon.com/AmazonS3/latest/userguide/ |\n| AWS Billing 用户指南 | Cost Explorer/Budgets/CUR 口径 | https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/ |\n| Amazon CloudFront 开发者指南 | 源站选择与 Origin Shield | https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/ |\n\n这些页面都是 AWS 官方公开文档。中文资料与英文原文说法不一致时，以英文原文为准。"}},{"domain":4,"name":"韧性、迁移和业务连续性","weight":"15%","practice":[{"id":"D4-001","d":4,"t":"single","q":"业务要求灾难时 15 分钟内恢复、数据丢失不超过 5 分钟，但预算有限。架构师应如何从 RTO 与 RPO 出发设计方案","o":[{"l":"A","t":"直接选最贵的全量热备，不考虑需求差异"},{"l":"B","t":"先与业务确认 RTO 与 RPO，再据此选择满足指标的灾难恢复策略并核算成本"},{"l":"C","t":"先定技术架构，再倒推 RTO 与 RPO 让业务接受"},{"l":"D","t":"只做定期备份即可，任何 RTO 与 RPO 要求都能满足"}],"a":["B"],"e":"✅ 正确项：B。灾难恢复设计要从业务需求出发，先明确 RTO 与 RPO，再选择能达到指标的备份与复制策略并核算成本，避免盲目堆高规格。关联考点：域 4.2.1「设计灾难恢复方案以满足业务需求」。\n\n❌ A：不选最贵就不是尽责，正确的做法是按需求匹配规格，一味堆高会浪费预算。\n❌ C：RTO 与 RPO 是业务给出的目标，不能由技术架构倒推后让业务迁就。\n❌ D：只做备份无法满足严格的恢复时间目标，备份与灾难恢复不是一回事。\n\n📌 关键概念：RTO 管多久能恢复、RPO 管能丢多少数据，灾难恢复方案要由这两个指标倒推出来。","s":"自编·4.2.1"},{"id":"D4-002","d":4,"t":"single","q":"公司在多账户环境下运营，要求统一备份策略、支持跨账户备份，并且备份不能被勒索软件篡改删除。哪种做法最直接","o":[{"l":"A","t":"各账户各自配置备份，中心不做统一干预"},{"l":"B","t":"只依赖单账户快照，不做跨账户复制"},{"l":"C","t":"用 AWS Backup 集中配置备份计划、跨账户备份并设置 Vault Lock 防篡改"},{"l":"D","t":"用 S3 生命周期规则替代备份机制"}],"a":["C"],"e":"✅ 正确项：C。AWS Backup 支持集中式备份计划与跨账户备份，Vault Lock 提供合规锁防止篡改删除，正好满足统一治理与防勒索要求。关联考点：域 4.3.1「配置集中备份治理与跨账户备份策略」。\n\n❌ A：分散配置无法统一治理，各账户策略容易漂移不一致。\n❌ B：单账户快照既没有跨账户保护也缺少集中管控，还可能被一并删除。\n❌ D：S3 生命周期是存储分层机制，不能替代备份与灾难恢复方案。\n\n📌 关键概念：集中备份治理靠 AWS Backup 的计划与跨账户能力，防篡改靠 Vault Lock 的合规锁。","s":"自编·4.3.1"},{"id":"D4-003","d":4,"t":"multiple","q":"Fabrikam 三百个应用要迁云，项目刚立项。哪些做法符合发现与批次规划的原则（选所有适用项）","o":[{"l":"A","t":"不摸底，直接按服务器资产清单顺序逐台搬"},{"l":"B","t":"发现工具自动采集依赖图与性能画像，再人工摸底补齐"},{"l":"C","t":"依赖少的先行打样，共依赖的成组同批，核心复杂的后行"},{"l":"D","t":"批次以能回滚的业务单元为边界切分"},{"l":"E","t":"评估分诊出的退役应用也一并搬上云再处置"}],"a":["B","C","D"],"e":"✅ 正确项：B、C、D。迁移从摸底开始：发现工具自动采集应用清单、依赖与性能画像，人工摸底补齐网络流量与隐性依赖；评估按复杂度、依赖密度、业务价值分诊路线与优先级；批次规划——依赖少的先行打样、共依赖的成组同批、核心复杂的后行，且以能回滚的业务单元为边界切分，一批出问题影响面可控。关联考点：域 4.1.1「设计发现和资产组合评估方案，梳理依赖并规划迁移批次」。\n\n❌ A：不摸底直接搬是把风险放大，依赖断裂与批次失控都是必然。\n❌ E：评估分诊出该退役的应用就不要搬，为退役资源付迁移费是白花。\n\n📌 关键概念：先发现评估再动工；批次以回滚单元切；路线分诊该退役的别搬。","s":"自编·4.1.1"},{"id":"D4-004","d":4,"t":"single","q":"Contoso 机房租约还剩半年必须退出，两百台服务器承载的应用不想做改造，要快速平稳上云。方案怎么选","o":[{"l":"A","t":"用 Transform MGN 平迁：代理持续块级复制到云，低峰窗口割接，回退路径保留到观察期满"},{"l":"B","t":"先全部重构为微服务再上云"},{"l":"C","t":"手工逐台开新实例再拷贝数据"},{"l":"D","t":"停机三天做一次性全量搬迁"}],"a":["A"],"e":"✅ 正确项：A。重新托管是这组约束的正解：Transform MGN（曾用名 AWS Application Migration Service）的迁移代理在源机做持续块级复制到云上复制区；选定变更窗口停写、同步差量、云上实例先做测试验证；割接后回退路径保留到观察期满——应用零改造、风险最低、半年内可退租。关联考点：域 4.1.2「实施重新托管策略」。\n\n❌ B：重构工期与风险远超半年窗口，与「不想改造、要快」的约束全冲突。\n❌ C：手工逐台拷数据易漏易错，两百台规模下不可持续，也没有回退设计。\n❌ D：三天停机业务不可承受，且一次性搬迁无验证无回退。\n\n📌 关键概念：平迁三步是复制、切换测试、割接留回退；拿不到云原生优势但风险最低。","s":"自编·4.1.2"},{"id":"D4-005","d":4,"t":"single","q":"Fabrikam 的核心商业库要从商业引擎迁到 Aurora PostgreSQL，停机窗口只有十五分钟。迁移怎么配","o":[{"l":"A","t":"停机窗口内做全量导出导入，一次搬完"},{"l":"B","t":"只迁表结构，数据靠手工脚本事后补"},{"l":"C","t":"DMS 全量加载加 CDC 持续追平增量，差量到秒级时切应用连接；存储过程方言改写提前评估"},{"l":"D","t":"DMS 能顺便把存储过程的方言差异也转好"}],"a":["C"],"e":"✅ 正确项：C。DMS 三段配齐：全量加载把存量灌进目标库；变更数据捕获持续追平增量，源库全程不停服务；差量追平到秒级时切应用连接，停机窗口压到分钟级。异构换引擎同时配模式转换工具处理表结构，存储过程的 SQL 方言改写提前三个月评估——那是应用层改造。关联考点：域 4.1.3「设计数据库和数据迁移策略」。\n\n❌ A：存量数据十五分钟装不下，全量导出导入的停机口径不成立。\n❌ B：只迁结构靠脚本补数据，一致性无保障，回退与校验全无。\n❌ D：DMS 搬数据不改代码，方言差异是应用层改造，别指望迁移工具顺手解决。\n\n📌 关键概念：全量加 CDC 追平加分钟级割接；DMS 不解决方言——应用层改造常比数据更难。","s":"自编·4.1.3"},{"id":"D4-006","d":4,"t":"single","q":"Tailspin 想吃托管红利但重构预算有限：自管数据库补丁备份工单重、自管容器集群运维重、夜间对账批处理靠定时脚本。平台重塑怎么配","o":[{"l":"A","t":"全部推倒重构成无服务器架构一步到位"},{"l":"B","t":"把自管数据库整体改换为 DynamoDB"},{"l":"C","t":"维持现状，等以后有预算再整体改造"},{"l":"D","t":"自管库换 Aurora、自管集群换 ECS、夜间对账换 Lambda 定时触发，补丁备份运维交给托管层"}],"a":["D"],"e":"✅ 正确项：D。平台重塑的三条常用换法正好各对一个痛点：数据库换 Aurora，补丁、备份、高可用交给云；自管容器运行时换 ECS 托管集群；夜间对账批处理换 Lambda 定时触发——应用主体不动、关键部件换托管服务，改动可控还能吃到托管红利。关联考点：域 4.1.4「设计平台重塑策略，使用托管服务降低运维开销」。\n\n❌ A：推倒重构超出预算与风险承受，与「改动可控」的诉求相反。\n❌ B：换引擎是大改造不是重塑，查询与事务模型全要重写。\n❌ C：维持现状吃不到托管红利，工单成本继续付。\n\n📌 关键概念：重塑换部件不换架构；顺手小重构滑成大工程是常见翻车点，克制是纪律。","s":"自编·4.1.4"},{"id":"D4-007","d":4,"t":"single","q":"Fabrikam 的十年单体电商要现代化，业务要求演进快，但核心下单链路不能长时间停机。现代化路线怎么走","o":[{"l":"A","t":"大爆炸式整体重写，一次切换上线"},{"l":"B","t":"绞杀者模式：门面网关按业务域分流，下单域先拆出微服务双跑验证后切流，老单体逐域收缩最后下线"},{"l":"C","t":"单体原样平迁上云，架构先不动"},{"l":"D","t":"新系统整体重写完成后一次性替换，旧系统直接作废"}],"a":["B"],"e":"✅ 正确项：B。绞杀者模式专治「不敢停机的核心系统」：路由门面先把流量按业务能力分到新旧两侧；逐个业务域拆出微服务，双跑验证后切流；迁完的模块下线，老单体逐步收缩到零——把大爆炸风险摊成每次可控的小切换，演进诉求与不停机约束同时满足。关联考点：域 4.1.5「实施重构策略，如微服务拆分、无服务器化和渐进式现代化模式」。\n\n❌ A：大爆炸把全部风险压在一次切换上，核心下单链路赌不起。\n❌ C：平迁解决退租问题，拿不到架构演进收益，与业务要求演进快的目标不符。\n❌ D：与 A 同病——一次性替换没有灰度验证，回退路径全无。\n\n📌 关键概念：绞杀者三步是门面前置分流、逐线迁移验证切流、老系统收缩到零。","s":"自编·4.1.5"},{"id":"D4-008","d":4,"t":"single","q":"Contoso 要把单体里的事件处理模块拆出来做无服务器化。微服务的拆分边界怎么定","o":[{"l":"A","t":"按技术分层拆：数据库一层、接口一层、业务逻辑一层"},{"l":"B","t":"按团队人数把模块平均切开"},{"l":"C","t":"按业务能力定边界：事件处理按收单、审核、通知拆成独立函数与队列，数据边界跟着业务走"},{"l":"D","t":"一次性把整个单体全部函数化，一步到位"}],"a":["C"],"e":"✅ 正确项：C。微服务与函数的拆分边界按业务能力定：事件处理按收单、审核、通知三个业务能力拆成独立函数与队列，每个能力有自己的数据边界，接口与扩缩容独立演进——业务对齐的边界才能独立交付与替换。关联考点：域 4.1.5「实施重构策略，如微服务拆分、无服务器化和渐进式现代化模式」。\n\n❌ A：按技术分层拆出的还是层不是服务，耦合原样保留，独立演进无从谈起。\n❌ B：按人数平均切与业务语义无关，切出来的边界谁也独立不了。\n❌ D：全量函数化一次到位，范围失控风险一次压上，与渐进式现代化的原则相反。\n\n📌 关键概念：拆分边界按业务能力；无服务器化配队列与事件驱动，与绞杀者模式组合推进。","s":"自编·4.1.5"},{"id":"D4-009","d":4,"t":"single","q":"Contoso 的核心大型机跑 COBOL 批处理，懂它的工程师陆续退休、年维护费高昂。现代化路线怎么选","o":[{"l":"A","t":"翻译重编译与封装渐进并用：稳定模块经转换工具译成现代语言并做行为保真验证；对账等高风险模块先门面包住逐步换血；先补自动化测试再动手"},{"l":"B","t":"一次性全量翻译替换上线，出问题再回退"},{"l":"C","t":"只做接口封装，内核永远不动"},{"l":"D","t":"继续招聘 COBOL 工程师维持现状"}],"a":["A"],"e":"✅ 正确项：A。大型机现代化两派并用各取所长：翻译重编译——稳定模块经转换工具译成现代语言，行为保真验证后替换运行时；封装渐进——对账这类翻译风险高的模块先包住接口逐步换血（绞杀者模式在大型机上的应用）；没有测试资产的老系统先补自动化测试，否则没有安全网。关联考点：域 4.1.6「实现遗留工作负载现代化，包括大型机、应用和数据库」。\n\n❌ B：行为保真验证占项目大头，全量翻译一次上线，风险没有任何缓冲。\n❌ C：只封装不换内核，技术断代与成本失控照样发展，现代化没发生。\n❌ D：招人维持现状，人才断代趋势不变，维护费继续涨。\n\n📌 关键概念：两派路线是翻译重编译与封装渐进；验证工作量别低估，没测试资产先补安全网。","s":"自编·4.1.6"},{"id":"D4-010","d":4,"t":"single","q":"Contoso 机房两百台服务器要分钟级 RTO 的云上灾备，又不想为温备养常驻资源。方案怎么配","o":[{"l":"A","t":"每晚备份到 S3，出事时起新环境恢复"},{"l":"B","t":"常驻一套温备集群随时顶上"},{"l":"C","t":"出事时按文档手工逐台重建实例"},{"l":"D","t":"Elastic Disaster Recovery 持续块级复制进云上暂存区，出事按需拉起恢复实例并切流量，季度演练验证"}],"a":["D"],"e":"✅ 正确项：D。持续复制是这组约束的正解：源机装代理持续块级复制到云上轻量暂存区，平时不占常驻计算资源；出事按需拉起恢复实例、按任意时间点恢复并切流量；演练随时拉恢复实例验证、不扰生产——比先恢复备份再重启的路径快一个量级。关联考点：域 4.2.2「配置持续复制以从事件中快速恢复」。\n\n❌ A：备份恢复是灾备四档里最慢的一档，分钟级 RTO 到不了。\n❌ B：温备常驻资源正是题给「不想养」的成本。\n❌ C：手工逐台重建连小时级都难保证，更谈不上分钟级。\n\n📌 关键概念：持续块级复制加按需拉起；任意时间点恢复、演练不扰生产，恢复后可反向同步回源。","s":"自编·4.2.2"},{"id":"D4-011","d":4,"t":"single","q":"Fabrikam 灾备架构建好了但从没验证过，真出事时谁按哪步恢复没人说得清。怎么补齐评估与规程","o":[{"l":"A","t":"出事时靠资深工程师的记忆现场指挥"},{"l":"B","t":"Resilience Hub 设 RTO/RPO 目标并自动评估差距修齐，恢复步骤写成 Systems Manager 运行手册，架构变更后重跑评估"},{"l":"C","t":"评估报告做一次归档备查即可"},{"l":"D","t":"灾备达标由团队口头承诺担保"}],"a":["B"],"e":"✅ 正确项：B。评估与规程两件一起补：Resilience Hub 按设定的 RTO/RPO 政策自动扫描架构与配置，对照目标给「哪不达标、怎么补」的差距清单，修完再评；恢复规程写成 Systems Manager 运行手册——出事按文档自动执行，不靠老员工记忆；架构一变评估就过期，定期重跑。关联考点：域 4.2.3「建立灾难恢复评估和恢复规程」。\n\n❌ A：靠记忆的预案等于没有，人不在场流程就断。\n❌ C：一次性归档的评估随架构演进过期，纸面达标不等于真达标。\n❌ D：口头承诺在合规审计面前不构成证据链。\n\n📌 关键概念：韧性中心评差距、恢复步骤运行手册化；评估随架构变更重跑。","s":"自编·4.2.3"},{"id":"D4-012","d":4,"t":"single","q":"Contoso 的双区域交易平台要故障转移：确定性故障要自动切、区域级重大切换要防误切、整体要求分钟级 RTO。切流怎么配","o":[{"l":"A","t":"全部依赖 DNS 故障转移记录切换"},{"l":"B","t":"所有切换全自动执行，不设人工环节"},{"l":"C","t":"健康检查自动摘除确定性故障，区域级重大切换走路由控制由值班经理确认后拨闸，加速器层保秒级摘除"},{"l":"D","t":"先把用户流量切过去，数据层复制另行安排"}],"a":["C"],"e":"✅ 正确项：C。切流三层配齐：探测层健康检查盯端点存活，聚合健康面；切换层确定性故障（区域级失联）自动摘除——加速器终端组秒级生效；控制层区域级重大切换走路由控制开关，人工确认后一键拨闸，防抖动型故障被自动切误伤；数据层复制同步就位，流量与数据一起切。关联考点：域 4.2.4「实施多区域灾难恢复方案，包含数据复制和故障转移」。\n\n❌ A：DNS 切换受客户端 TTL 缓存影响，分钟级 RTO 靠它不稳。\n❌ B：全自动切换对抖动型故障会误切，重大切换要有人工闸。\n❌ D：光切流量不切数据是空转——用户到了新区域，数据不在那。\n\n📌 关键概念：探测、自动切换、人工闸三层配；切流与数据复制同步就位。","s":"自编·4.2.4"}],"sections":[{"h":"使用 AWS 框架设计迁移策略","body":"### 这一域考什么\n\n这一域问的是：存量怎么搬上来、出了事怎么站起来、平时怎么不倒——迁移、灾备、韧性三件事一条龙。\n\n三条线串起全章：\n\n1. **迁移**：发现评估、6R 路线、批量平迁与数据迁移，对应任务 4.1。\n2. **灾难恢复**：RTO/RPO 定档、持续复制、多区域故障转移与演练，对应任务 4.2。\n3. **业务连续与韧性**：备份治理、故障注入测试、防勒索与自愈架构，对应任务 4.3。\n\n这门课是专业级（Professional），考法是给一组业务容忍度（停多久、丢多少、何时恢复），让你选成本与风险平衡的方案。不是背灾备等级名词，是算恢复目标与代价的账。。\n\n### 读完这个域要能做什么\n\n这门课写给要为「出事之后」负责的架构师。读完本域应能：\n\n- 组织一次迁移摸底：发现、评估、分诊、排批次。\n- 给应用配上 6R 里对的那条路线，讲清代价。\n- 按 RTO/RPO 给灾备定档，选出对应技术组合。\n- 设计多区域故障转移并演练它，不是画完就完。\n- 给数据配防勒索与防误删的不可变层。\n- 用故障注入验证系统的自愈能力。\n\n### 和其他认证怎么接\n\n| 其他认证/能力 | 对应的那件事 | 这里有什么不同 | 什么时候该想起它 |\n|---|---|---|---|\n| SAA-C03（解决方案架构师助理级） | 都讲灾备四策略与备份 | 助理级认得策略名词；专业级要按 RTO/RPO 算账、配组合、做演练 | 遇到「多区域方案与演练」就卡住时 |\n| DevOps Professional（DOP-C02） | 都讲高可用与自动恢复 | DOP 偏实现与运营；本域站在架构视角定灾备形态与迁移路线 | 要定「迁什么、怎么备、怎么测」时 |\n\n对照只用来迁移已有理解。做题以本域官方口径为准。\n\n### 官方口径的三条边界\n\n- 官方 Exam Guide 给出技能点编号与原文，不给逐考点的出现频率。\n- 官方认证页写明题型含单选与多选，多选必须全选对才得分。\n- 及格线 720 分（100–1000 补偿式计分），不要求每域单独达线。\n\n#### 这一节学什么\n这一节对应考纲任务 4.1「使用 AWS 框架设计迁移策略」。\n\n> 官方原名：Design migration strategies by using AWS frameworks.\n\n这一任务解决「存量怎么上云」。六个技能点从摸底评估讲到平迁与数据迁移，再到中间路线与深度重构，最后到大型机这个最深水区。主线是：发现评估 → 平迁 → 数据迁移 → 平台重塑 → 重构 → 遗留现代化。\n\n#### 设计发现和资产组合评估方案，梳理依赖并规划迁移批次\n\n> 官方原名：Design discovery and portfolio assessment solutions to map dependencies and plan migration waves.\n\n**这条在问什么。** 考题给你「几百个应用要上云、先摸清家底、批次怎么切」这类迁移起点题。\n\n**定义**：发现是看清有什么——应用、依赖、性能画像；资产组合评估按路线分诊——每个应用归到重托管、平台重塑、重构、重购、保留、退役六条路线之一；迁移批次按依赖与风险分波次。\n\n**怎么运作**。三步各管一段：\n\n1. 发现：自动采集清单（装代理或无代理采集），加人工摸底补依赖图与网络流量。\n2. 评估：每个应用按复杂度、依赖密度、业务价值定走哪条路线、优先级多高。\n3. 批次：依赖少的先行打样，共依赖的成组同批，核心复杂的后行。\n\n**什么时候用，什么时候别用**。几百应用的大迁移必须先评估再动——不摸底直接搬是把风险放大。十来个应用的小迁移，轻量摸底加白板排依赖就够。批次以「能回滚」为单位切——一批出问题影响面可控。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 三百个应用迁云：发现工具跑两周出依赖图与性能画像；评估分诊出六十个重托管先行打样、五十个退役别搬、核心二十个重构后行；每批按业务域加回滚单元切分。\n\n**关联服务**：AWS 发现工具（代理与无代理采集）、6R 路线分诊。\n\n#### 实施重新托管策略\n\n> 官方原名：Implement rehosting strategies (for example, by using AWS Transform MGN [previously known as AWS Application Migration Service], AWS Transform).\n\n**这条在问什么。** 考题给你「要快迁、不想改应用、机房合同到期」这类约束，让你配平迁方案。\n\n**定义**：重新托管（rehost，俗称平移）把应用原样搬上云不改架构。AWS Transform MGN（曾用名 AWS Application Migration Service）是官方批量平迁工具，把源端机器转为云上实例。\n\n**怎么运作**。三件事各管一段：\n\n1. 复制：迁移代理装在源机持续块级复制到云上复制区。\n2. 切换：选定变更窗口，停写、同步差量、启动云上实例做测试验证。\n3. 割接：测试通过后正式切换，回退路径保留到观察期满。\n\n**什么时候用，什么时候别用**。要快速退出机房、应用能不动就不动，平迁最快最稳。它省了改造风险，但云原生优势（弹性、托管服务）拿不到，账单也不一定降。适合「先上云再优化」的第一波；长期看，纯平迁的存量是后续优化的池子。\n\n💡 **场景举例**（虚构教学示意）：Contoso 机房租约还剩半年：两百台服务器分批平迁，割接窗口选业务低峰，回退保留一个月。六个月完成退出，应用零改造。\n\n**关联服务**：AWS Transform MGN（曾用名 AWS Application Migration Service）、AWS Transform。\n\n#### 设计数据库和数据迁移策略\n\n> 官方原名：Design database and data migration strategies (for example, by using AWS Database Migration Service, AWS DataSync).\n\n**这条在问什么。** 考题给你「数据库要换引擎、数据要搬迁、停机窗口有限」这类数据迁移题。\n\n**定义**：AWS DMS（Database Migration Service，数据库迁移服务）做库到库的迁移与持续复制；AWS DataSync 搬文件与对象类数据。同构迁移是换地方，异构迁移是换引擎——配模式转换工具处理表结构与代码差异。\n\n**怎么运作**。三段各管一段：\n\n1. 全量加载：DMS 把存量数据灌到目标库。\n2. 持续复制：变更数据捕获（CDC）持续追平增量，源库不停服务。\n3. 割接：差量追平到秒级时切应用连接，停机窗口压到分钟级。\n\nDataSync 管文件态数据的一次性与定时同步，带校验。\n\n**什么时候用，什么时候别用**。异构换引擎（商业库到开源）用 DMS 加模式转换，先做兼容性评估。同构搬迁也走 DMS 但工作量小。海量小文件与对象走 DataSync。停机窗口极小的靠 CDC 追平。要提醒：异构迁移的应用层改造（SQL 方言差异）常比数据本身更难——DMS 不解决方言。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的核心商业库迁 Aurora PostgreSQL：DMS 全量加 CDC 追平，停机窗口压到十五分钟；存储过程方言改写提前三个月评估；历史归档走 DataSync。\n\n**最小配置示意**（教学示意；DMS 复制任务是三件套的最后一环）：\n\n```\naws dms create-replication-task \\\n  --replication-task-id oracle-to-aurora \\\n  --source-endpoint-arn <源终端节点ARN> \\\n  --target-endpoint-arn <目标终端节点ARN> \\\n  --replication-instance-arn <复制实例ARN> \\\n  --migration-type full-load-and-cdc\n```\n\n**关联服务**：AWS Database Migration Service（全量与 CDC）、AWS Schema Conversion Tool、AWS DataSync。\n\n#### 设计平台重塑策略，使用托管服务降低运维开销\n\n> 官方原名：Design replatforming strategies that use managed services to reduce operational overhead (for example, Amazon RDS, Amazon Aurora, Amazon ECS, AWS Lambda).\n\n**这条在问什么。** 考题给你「不求重构但想吃托管红利、改动要可控」这类中间路线题。\n\n**定义**：平台重塑（replatform，俗称搬家顺手换几样）是应用主体不动、关键部件换托管服务——数据库换 RDS、运行时换托管集群、边缘部件换无服务器。\n\n**怎么运作**。三条常用换法各管一段：\n\n1. 数据库：自管库换 RDS 或 Aurora，补丁、备份、高可用交给云。\n2. 运行时：自管容器与虚拟机运行时换 ECS 托管集群。\n3. 边缘部件：定时任务与批处理换 Lambda 触发，自管队列换 SQS。\n\n**什么时候用，什么时候别用**。想拿托管红利但重构预算与风险承受有限，平台重塑是性价比档。改动幅度要克制——换部件不是改架构，顺手「小重构」滑成大工程是常见翻车点。已计划深度重构的组件别重复投资，等重构一起换。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的中间件平台：自管库换 Aurora，补丁备份归零运维；自管容器集群换 ECS；夜间对账批处理换 Lambda 定时触发。三个月完成，运维工单大幅下降。\n\n**关联服务**：Amazon RDS、Amazon Aurora、Amazon ECS、AWS Lambda。\n\n#### 实施重构策略，如微服务拆分、无服务器化和渐进式现代化模式（绞杀者模式）\n\n> 官方原名：Implement refactor strategies such as microservices decomposition, serverless adoption, and incremental modernization patterns (for example, strangler fig pattern).\n\n**这条在问什么。** 考题给你「要吃透云原生红利、大单体又不能一次推倒」这类重构路线题。\n\n**定义**：重构（refactor）改应用架构本身。绞杀者模式（strangler fig pattern）是渐进式现代化：新系统在外圈逐步包住老系统，一条业务线一条业务线地迁走，老系统最终被绞杀退役。\n\n**怎么运作**。三步各管一段：\n\n1. 门面前置：路由层把流量按业务能力分到新旧两侧。\n2. 逐线迁移：按业务域拆出微服务或无服务器函数，逐条切流验证。\n3. 收缩老系统：迁完的模块下线，老单体逐步缩到零。\n\n**什么时候用，什么时候别用**。业务要快速演进、单体变更牵一发动全身，重构长期回报最大；成本与风险也最大——没有产品改造诉求只为「上云好看」不值得。绞杀者模式专治「不敢停机的核心系统」：把大爆炸风险摊成每次小切换。团队没有微服务经验先补课，别拿生产练手。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的十年单体电商：门面网关按下单、库存、营销三域分流；下单域先拆成事件驱动微服务，双跑验证后切流；两年内单体收缩到只剩营销域，最后下线。\n\n**关联服务**：微服务拆分、AWS Lambda 与 Step Functions（无服务器化）、绞杀者模式与门面路由。\n\n#### 实现遗留工作负载现代化，包括大型机、应用和数据库\n\n> 官方原名：Modernize legacy workloads, including mainframes, applications, and databases.\n\n**这条在问什么。** 考题给你「大型机 COBOL 生态、懂的人陆续退休、年维护费高昂」这类最深水区。\n\n**定义**：遗留现代化按对象分三类——大型机（批量 COBOL 生态）、应用（老语言老框架）、数据库（老引擎老模式）。路径分两派：翻译重编译（自动转换代码）与封装渐进（包住接口逐步换血）。\n\n**怎么运作**。三条路各管一段：\n\n1. 自动翻译：大型机代码经转换工具译成现代语言，行为保真验证后替换运行时。\n2. 封装渐进：接口先包住（门面或消息桥），内部逐步替换——绞杀者模式在大型机上的应用。\n3. 数据先行：数据库先迁移、应用分层跟进；或反过来，按风险取向定。\n\n**什么时候用，什么时候别用**。技术断代风险、供应商锁死、成本失控——现代化是必答题。别低估验证工作量：翻译后的行为保真测试占项目大头。没有测试资产的老系统先补自动化测试再现代化，否则没有安全网。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的核心大型机：转换工具把 COBOL 批处理译成 Java 微服务；对账这类翻译风险高的模块走封装渐进；数据库先行迁移。三年下来大型机退租，年度维护费大幅下降。\n\n**关联服务**：AWS Transform（大型机现代化）、转换与验证工具链、绞杀者模式（大型机场景）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「迁移从选服务开始」 | 从发现与评估开始；摸不清家底没法定路线 |\n| 2 | 「平迁是偷懒路线」 | 平迁是风险最低的快迁路线；存量是后续优化池子 |\n| 3 | 「DMS 能解决 SQL 方言差异」 | DMS 搬数据不改代码；方言是应用层改造 |\n| 4 | 「平台重塑顺手小重构没关系」 | 换部件不是改架构；滑成大工程是常见翻车点 |\n| 5 | 「绞杀者模式太慢不如大爆炸」 | 绞杀者把大爆炸风险摊成可控小切换；核心系统该这么走 |\n| 6 | 「翻译后的代码不用充分测试」 | 行为保真验证是大型机现代化的大头；没测试资产先补测试 |\n\n#### 记忆要点\n\n1. **先摸底**：发现、评估、批次，按回滚单元切波次。\n2. **路线分诊**：每个应用归一条路线，该退役的别搬。\n3. **平迁三步**：复制、切换测试、割接留回退。\n4. **DMS 三段**：全量、CDC 追平、分钟级停机割接。\n5. **中间档克制**：平台重塑换部件吃托管红利，别滑成大工程。\n6. **绞杀渐进**：门面分流、逐线迁移、老系统收缩到零。\n\n---"},{"h":"设计灾难恢复架构","body":"#### 这一节学什么\n这一节对应考纲任务 4.2「设计灾难恢复架构」。\n\n> 官方原名：Design disaster recovery architectures.\n\n这一任务管「出了事怎么站起来」。六个技能点从 RTO/RPO 定档讲到持续复制，再到评估规程与多区域切流，最后补上演练与容器多集群。主线是：定档 → 快复 → 规程 → 切流 → 演练 → 容器多集群。\n\n#### 设计灾难恢复方案以满足业务需求\n\n> 官方原名：Design disaster recovery solutions to meet business requirements (for example, RTO, RPO, costs).\n\n**这条在问什么。** 考题给你一组业务容忍度——停多久、丢多少、预算多少——让你定灾备档位。\n\n**定义**：RTO（Recovery Time Objective，恢复时间目标）是从出事到恢复服务的时限；RPO（Recovery Point Objective，恢复点目标）是最多能丢多少数据。灾备四档从便宜到贵：备份与恢复、灯塔、温备、多站点主动。\n\n**怎么运作**。四档各管一段：\n\n1. 备份与恢复：数据备份跨区存，出事起新环境恢复——最便宜、最慢。\n2. 灯塔：数据层常备（跨区复制就绪），计算层出事才拉起。\n3. 温备：小规模常驻运行，出事扩容切流。\n4. 多站点主动：双区域全量服务，路由拨流量，RTO 最小。\n\n**什么时候用，什么时候别用**。档位由 RTO 与 RPO 驱动，不由「安全感」驱动——只有分钟级 RTO 的核心交易才上多站点主动。成本随档位翻倍。合规定的 RPO（金融级「一笔都不能丢」）决定复制形态。别全应用一个档：按业务分级，三档三条成本线。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 业务分三档：交易走多站点主动、结算走温备、报表与归档走备份恢复。三档对应三种恢复目标，总账最省。\n\n**关联服务**：灾备四档策略、AWS Backup、跨区复制、Route 53 与 Global Accelerator（切流）。\n\n#### 配置持续复制以从事件中快速恢复\n\n> 官方原名：Configure continuous replication to recover quickly from incidents (for example, by using AWS Elastic Disaster Recovery).\n\n**这条在问什么。** 考题给你「机房灾备要分钟级 RTO、先恢复备份再重启太慢」这类场景。\n\n**定义**：AWS Elastic Disaster Recovery（弹性灾难恢复）把源端机器持续块级复制到云上轻量暂存区，出事按需拉起恢复实例——比恢复备份的路径快一个量级。\n\n**怎么运作**。三段各管一段：\n\n1. 常态复制：源机装代理连续块级复制，数据进云上暂存区。\n2. 演练与恢复：随时拉起恢复实例做演练，不扰生产；出事按任意时间点恢复。\n3. 故障转移：拉起全量恢复实例、切流量；恢复后可反向同步回源。\n\n**什么时候用，什么时候别用**。机房与多云负载要分钟级 RTO、又不想为温备养常驻资源，持续复制加按需拉起最合算。纯云内负载用多可用区与多区域原生机制即可。数据量巨大时，复制带宽与暂存成本要先算。\n\n💡 **场景举例**（虚构教学示意）：Contoso 机房两百台服务器用持续复制进云：季度演练拉恢复实例验证；一次机房电力故障真实切换，全程十五分钟恢复服务。\n\n**关联服务**：AWS Elastic Disaster Recovery、云上暂存区、DNS 切流量。\n\n#### 建立灾难恢复评估和恢复规程\n\n> 官方原名：Establish disaster recovery assessment and recovery procedures (for example, by using AWS Resilience Hub, AWS Systems Manager runbooks).\n\n**这条在问什么。** 考题给你「灾备建好了但没人验证过、真出事谁按哪步做」这类规程题。\n\n**定义**：AWS Resilience Hub（韧性中心）按设定的 RTO/RPO 政策评估应用韧性、给差距清单；AWS Systems Manager 运行手册把恢复步骤写成可执行的自动化流程。\n\n**怎么运作**。三件事各管一段：\n\n1. 政策定档：在韧性中心给应用设 RTO 与 RPO 目标。\n2. 评估差距：自动扫架构与配置，对照目标给「哪不达标、怎么补」。\n3. 规程自动化：恢复步骤写成运行手册——出事按文档执行，不靠老员工记忆。\n\n**什么时候用，什么时候别用**。有合规审计要证明「灾备达标」的，韧性中心评估是官方证据链。恢复规程必须文档化与自动化——纸面预案等于没有。小团队至少把「谁、按什么顺序、跑什么命令」写成运行手册。评估要定期重跑：架构一变，旧评估就过期。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 给十二个核心应用设 RTO/RPO 目标：三轮评估修完差距（补跨区副本、加自动切流）；恢复规程全部转运行手册，审计时评估报告直接交。\n\n**关联服务**：AWS Resilience Hub（韧性政策与评估）、AWS Systems Manager 运行手册。\n\n#### 实施多区域灾难恢复方案，包含数据复制和故障转移\n\n> 官方原名：Implement multi-Region disaster recovery solutions that include features such as data replication and failover (for example, by using Amazon Route 53 health checks, AWS Global Accelerator, Amazon Application Recovery Controller).\n\n**这条在问什么。** 考题给你「双区域部署完了，出事怎么把用户流量自动切走」这类故障转移题。\n\n**定义**：Route 53 健康检查探测端点存活；AWS Global Accelerator 全局固定入口层秒级摘除故障终端；ARC（Application Recovery Controller，应用恢复控制器）用路由控制开关一格一格拨走区域流量，另有就绪检查确认备用区域真的备好了。\n\n**怎么运作**。三层各管一段：\n\n1. 探测层：健康检查盯应用端点，聚合多个目标的健康面。\n2. 切换层：DNS 故障转移记录主备切换，或加速器终端组自动摘除。\n3. 控制层：路由控制开关拨区域流量——重大切换走人工确认的一键拨闸，防自动误切。\n\n**什么时候用，什么时候别用**。确定性故障（区域级失联）适合自动切换；抖动型故障会被自动切误伤——重大切换配人工闸。DNS 切换受 TTL 缓存影响，分钟级 RTO 用加速器或路由控制。切流之外数据层复制要同步就位——光切流量不切数据是空转。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的双区域交易平台：常态按权重分流；健康检查自动摘除确定故障；区域级重大故障由值班经理确认后拨路由控制闸，三十秒完成切换，误切有两道保护。\n\n**最小配置示意**（教学示意；Route 53 故障转移记录对）：\n\n```\naws route53 change-resource-record-sets --hosted-zone-id <区域ID> \\\n  --change-batch '{\n    \"Changes\": [\n      { \"Action\": \"UPSERT\",\n        \"ResourceRecordSet\": {\n          \"Name\": \"api.example.com\", \"Type\": \"CNAME\", \"SetIdentifier\": \"primary\",\n          \"Failover\": \"PRIMARY\", \"TTL\": 60,\n          \"ResourceRecords\": [{\"Value\": \"primary-api.example.com\"}],\n          \"EvaluateTargetHealth\": true } },\n      { \"Action\": \"UPSERT\",\n        \"ResourceRecordSet\": {\n          \"Name\": \"api.example.com\", \"Type\": \"CNAME\", \"SetIdentifier\": \"secondary\",\n          \"Failover\": \"SECONDARY\", \"TTL\": 60,\n          \"ResourceRecords\": [{\"Value\": \"secondary-api.example.com\"}],\n          \"EvaluateTargetHealth\": true } }\n    ]\n  }'\n```\n\n**关联服务**：Amazon Route 53（健康检查与故障转移记录）、AWS Global Accelerator、Amazon Application Recovery Controller。\n\n#### 建立灾难恢复测试和验证规程\n\n> 官方原名：Establish disaster recovery testing and validation procedures (for example, by using AWS Resilience Hub).\n\n**这条在问什么。** 考题给你「灾备方案写完没测过、审计要演练证据」这类验证题。\n\n**定义**：灾备测试按场景注入故障验证恢复路径。Resilience Hub 除评估外还能给韧性测试建议（配合故障注入服务执行，任务 4.3.5 展开）。\n\n**怎么运作**。三件事各管一段：\n\n1. 桌面推演：变更走查恢复路径与责任人——最便宜的验证。\n2. 组件测试：断一个可用区或一个实例，验证自动切换行为。\n3. 全程演练：按真实剧本切到备用区跑一段再回——审计级证据带 RTO 实测值。\n\n**什么时候用，什么时候别用**。演练频率与业务等级对齐——核心系统季度级、普通系统年检级。演练要当真：有剧本、有裁判、有回退线；走过场只会给假信心。全程演练成本高（双倍资源跑一段），频率别贪。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的演练日历：桌面推演月度、组件测试季度、全程切换演练年度。年度演练实测 RTO 比目标快一倍，报告与改进项闭环入档。\n\n**关联服务**：AWS Resilience Hub（评估与测试建议）、AWS Fault Injection Service（故障注入）。\n\n#### 实施多集群容器策略以提供高可用和灾难恢复\n\n> 官方原名：Implement multi-cluster container strategies to provide high availability and disaster recovery (for example, by using Amazon EKS, Amazon ECS).\n\n**这条在问什么。** 考题给你「单集群不是天花板、跨集群怎么同步与切流」这类容器高可用题。\n\n**定义**：单集群高可用靠多可用区节点分布与调度；多集群是高一档——跨区域独立集群互为灾备或双活。切流靠全局负载把入口拨到健康集群。\n\n**怎么运作**。三件事各管一段：\n\n1. 集群内：节点跨可用区分布、Pod 反亲和分散、副本冗余——单集群地基。\n2. 集群间：两个区域各一套独立集群，配置经基础设施即代码同步（任务 5.1 展开）——同构双集群。\n3. 切流：入口层全局负载拨流量；数据层各自跨区复制。\n\n**什么时候用，什么时候别用**。多可用区单集群解决组件故障；要扛区域故障才上多集群——成本约翻倍（温备形态可压）。双活收益高但状态同步复杂，多数业务「温备集群加自动扩容切流」够用。别为看着稳上双活，先问业务损得起多少。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的容器平台：三套区域集群同构同步配置，常态单集群承载、两套温备缩量；区域故障时拨流量、温备集群自动扩容接住全量。演练实测切换加扩容八分钟。\n\n**关联服务**：Amazon EKS 与 Amazon ECS（多集群）、AWS Global Accelerator（切流）、配置同步（基础设施即代码）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「灾备档位越高越好」 | 档位由 RTO 与 RPO 驱动；多站点主动是双倍成本 |\n| 2 | 「备份跨区存就是灾备」 | 备份恢复是最慢一档；分钟级 RTO 要持续复制或温备 |\n| 3 | 「切流自动化就万事大吉」 | 抖动型故障会被误切；重大切换要人工闸 |\n| 4 | 「演练走过场也算数」 | 演练要有剧本、裁判、回退线；走过场给假信心 |\n| 5 | 「多集群等于多可用区再多点」 | 多可用区解决组件故障；多集群解决区域故障，成本翻倍 |\n| 6 | 「切了流没切数据」 | 切流与数据复制同步就位；光拨流量是空转 |\n\n#### 记忆要点\n\n1. **两目标驱动**：RTO 管恢复快慢，RPO 管丢多少；档位跟目标走。\n2. **四档阶梯**：备份恢复、灯塔、温备、多站点主动，成本档档翻。\n3. **快恢复路径**：持续块级复制、按需拉起、任意时间点恢复。\n4. **评估加规程**：韧性中心评差距，恢复步骤运行手册化。\n5. **切流三层**：探测、自动切换、人工闸三层配。\n6. **多集群同步**：配置同步、数据跨区复制、全局负载切流。\n\n---"},{"h":"设计满足业务连续性和韧性要求的方案","body":"#### 这一节学什么\n这一节对应考纲任务 4.3「设计满足业务连续性和韧性要求的方案」。\n\n> 官方原名：Design solutions to meet business continuity and resiliency requirements.\n\n这一任务管「平时怎么不倒」。五个技能点从备份治理讲到故障转移测试，再到韧性三层、防勒索与混沌工程。主线是：备份治理 → 切换实测 → 韧性分层 → 不可变防线 → 混沌验证。\n\n#### 配置集中式备份治理和跨账户备份策略\n\n> 官方原名：Configure centralized backup governance and cross-account backup policies (for example, by using AWS Backup).\n\n**这条在问什么。** 考题给你「多账户备份各配各的、标准不一、审计时抓瞎」这类治理题。\n\n**定义**：集中备份治理指备份策略由管理账户统一下发——备份计划、保留、加密、跨账户复制一条龙；AWS Backup 是统一执行引擎。\n\n**怎么运作**。三件事各管一段：\n\n1. 统一策略：管理账户配备份计划（频率、保留、窗口、冷存转层），按组织单元、账户或资源标签下发。\n2. 跨账户复制：备份副本推到独立的备份账户，隔离爆炸半径。\n3. 合规视图：备份合规报告跨账户聚合，未覆盖资源一清二楚。\n\n**什么时候用，什么时候别用**。多账户组织（尤其受监管的）必上集中治理——分散配置的备份就是自以为有。备份账户独立于生产组织单元：勒索进了生产账户，也删不到备份账户的副本。单账户小团队直接配备份计划就够，别上跨账户复杂度。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的备份账户独立：管理账户下发「实例、数据库、卷、桶统一日备、三十天保留」策略到全部组织单元；副本跨账户复制进备份账户并锁库（任务 4.3.4 展开）；月度合规报告列出未覆盖资源。\n\n**关联服务**：AWS Backup（集中策略与跨账户复制）、独立备份账户。\n\n#### 设计故障转移测试并测量恢复时间\n\n> 官方原名：Design failover tests and measure recovery times (for example, by using AWS Fault Injection Service, Amazon Route 53 health checks).\n\n**这条在问什么。** 考题给你「要证明切得动、要测出真实 RTO」这类验证题。\n\n**定义**：故障转移测试是在受控环境注入故障、触发切换、测量「从注入到恢复」的墙钟时间。AWS Fault Injection Service（FIS，故障注入服务）按实验模板注入故障；Route 53 健康检查做探测。\n\n**怎么运作**。四步各管一段：\n\n1. 定基线：先把稳态指标记录下来（错误率、延迟）——切完要能对得回来。\n2. 注入：FIS 按实验模板断可用区或停实例——受控范围。\n3. 观测切换：健康检查触发、切流动作、扩容时长全程打点。\n4. 报数：RTO 实测值是注入到恢复的墙钟时间；RPO 用数据校验比对丢失点。\n\n**什么时候用，什么时候别用**。生产切流演练用 FIS 注入比「真拔线」可控可回退。测试前要有爆炸半径护栏——实验模板的角色与停止条件。演练目标要先定「测什么」：不设指标的演练是演戏。切完要验数据一致性——RPO 是测出来的，不是声明出来的。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 半年一次切换演练：FIS 模板断主区可用区，稳态基线提前记录；切流与扩容全程打点，实测 RTO 上报表；演练后数据校验丢失点为零，RPO 达标。\n\n**关联服务**：AWS Fault Injection Service（注入）、Amazon Route 53 健康检查（探测）、Amazon CloudWatch（打点观测）。\n\n#### 设计具备冗余、容错和自愈能力等技术韧性特性的架构\n\n> 官方原名：Design technically resilient architectures that have features such as redundancy, fault tolerance, and self-healing capabilities.\n\n**这条在问什么。** 考题给你「不许人为介入、组件挂了自己好」这类韧性需求，让你分层设计。\n\n**定义**：技术韧性分三层——冗余（多副本防单点）、容错（副本间自动复制与换主）、自愈（故障组件自动替换）。\n\n**怎么运作**。三层各管一段：\n\n1. 冗余层：N+1 部署——跨可用区副本、多实例、多路径。\n2. 容错层：数据层多可用区复制与自动换主；请求层重试与负载分担。\n3. 自愈层：自动替换——扩缩组健康检查换机、容器任务替换、函数重试与事件驱动修复（任务 5.4 展开）。\n\n**什么时候用，什么时候别用**。核心链路三层配全；边缘组件两层甚至一层够用——韧性是有成本的，按业务等级配。自愈要配熔断与限流防自愈风暴：实例反复替换会打爆上游。别把「配了高可用」当「验证了韧性」——配置与测试是两回事（任务 4.3.2 的演练管验证）。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的订单链路：跨可用区冗余部署、数据库多可用区容错、扩缩组与容器自愈加熔断防风暴，每季度注入验证三层。边缘报表工具单可用区无自愈——按等级配，不均摊成本。\n\n**关联服务**：跨可用区冗余、数据库多可用区、自动扩缩组与容器任务替换、熔断限流。\n\n#### 保护数据免受勒索软件和误删除\n\n> 官方原名：Protect data against ransomware and accidental deletion (for example, by using Amazon S3 Object Lock, Amazon EBS snapshot lock, AWS Backup Vault Lock).\n\n**这条在问什么。** 考题给你「勒索加密生产线、管理员误删、要不可变防线」这类数据保命题。\n\n**定义**：不可变保留指保留期内谁都不能删改。S3 Object Lock（对象锁）让对象在锁定期内不可删改，合规模式谁都不能绕、治理模式有特权例外；EBS 快照锁同样保护快照；AWS Backup Vault Lock（备份库锁）锁住备份库内副本的删除与库策略修改。\n\n**怎么运作**。三层防线各管一段：\n\n1. 存储层：关键桶开版本控制加对象锁——加密了当天数据，旧版本照样删不掉。\n2. 快照层：核心卷的历史快照上快照锁。\n3. 备份层：备份账户的库上库锁，保留期内副本不可删、策略不可改。\n\n**什么时候用，什么时候别用**。受监管与高价值数据（金融记录、核心知识产权）全上合规模式。误删风险大的多人共管桶至少开治理模式。锁是双刃剑：删不掉也意味着真删不掉——保留期配错代价高，先用短保留期试跑再上长锁。锁与生命周期要协同：锁到期才允许转层与删除。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 三层锁：核心桶版本控制加对象锁、核心卷快照锁、备份账户库锁。一次勒索拿到生产账户权限——当天数据被加密，锁住的备份纹丝不动，次日完整恢复。\n\n**最小配置示意**（教学示意；备份库锁住删除权）：\n\n```\naws backup put-backup-vault-lock-configuration \\\n  --backup-vault-name <备份库名> \\\n  --min-retention-days 365 \\\n  --max-retention-days 3650\n```\n\n**关联服务**：Amazon S3 Object Lock、Amazon EBS 快照锁、AWS Backup Vault Lock、版本控制。\n\n#### 通过受控故障场景实施混沌工程\n\n> 官方原名：Implement chaos engineering with controlled failure scenarios (for example, by using AWS Fault Injection Service experiment templates, steady-state hypotheses).\n\n**这条在问什么。** 考题给你「怕系统有暗病、要在上线前按剧本主动打它」这类韧性验证题。\n\n**定义**：混沌工程是在受控范围主动注入故障、观察系统行为的学科。FIS 实验模板定义「注入什么故障、对哪些资源、什么护栏」；稳态假设（steady-state hypothesis）是「系统健康时可测的指标基线」——注入后指标不出界，验证才算通过。\n\n**怎么运作**。五步循环各管一段：\n\n1. 定稳态：健康指标基线（延迟、错误率、可用性）。\n2. 假设：声明「注入某故障后指标仍在界内」。\n3. 注入：FIS 按模板断可用区、停实例、耗尽资源。\n4. 观测：指标与告警行为全程记录。\n5. 复盘：找暗病修复，扩护栏再试下一轮。\n\n**什么时候用，什么时候别用**。高韧性要求系统（交易、支付）把混沌实验常态化——暗病是没打过才暴露的。有护栏才有资格玩：实验模板限范围（角色、目标标签、停止条件）。生产注入与预发注入分级：预发打逻辑、生产打真环境且挑业务低峰。没建立稳态与告警的系统先补观测——没刻度的混沌是捣乱。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的混沌日：每月一次 FIS 实验，模板只打带测试标签的资源；「断单可用区」实验验证降级与自愈，一次实验揪出缓存冷启动风暴的暗病，修复后护栏才扩到生产低峰窗口。\n\n**关联服务**：AWS Fault Injection Service（实验模板与稳态假设）、Amazon CloudWatch（指标观测）。\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「备份配了就算灾备达标」 | 要集中治理加合规报告加演练证据；分散备份是自以为有 |\n| 2 | 「演练 RTO 写在纸面就行」 | RTO 是测出来的墙钟时间；纸面值不算数 |\n| 3 | 「高可用配了就等于韧性」 | 配置与测试是两回事；注入验证才算数 |\n| 4 | 「对象锁治理模式就防勒索」 | 治理模式有特权例外；防勒索要合规模式 |\n| 5 | 「锁得越久越安全」 | 锁是双刃剑；保留期配错改不了，先短保留试跑 |\n| 6 | 「混沌工程等于乱打生产」 | 有护栏（模板限范围、停止条件、稳态基线）才叫混沌工程 |\n\n#### 记忆要点\n\n1. **备份集中**：管理账户下发策略，副本进独立备份账户。\n2. **演练测真**：基线、注入、打点，报实测 RTO。\n3. **韧性三层**：冗余防单点、容错自动换主、自愈自动换组件。\n4. **三把锁**：S3 对象锁、EBS 快照锁、备份库锁，合规模式才硬。\n5. **锁先试跑**：短保留验证再上长锁，锁死不可逆。\n6. **混沌有护栏**：稳态、假设、模板、停止条件缺一不可。\n\n---"}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 4.1.1 | 发现评估与批次规划 | ⭐⭐ | 情景单选/排序 |\n| 4.1.2 | 平迁三步与 Transform MGN | ⭐⭐ | 情景单选 |\n| 4.1.3 | DMS 三段与方言边界 | ⭐⭐⭐ | 情景单选 |\n| 4.1.4 | 平台重塑换部件清单 | ⭐⭐ | 情景单选/多选 |\n| 4.1.5 | 绞杀者模式三步 | ⭐⭐⭐ | 情景单选 |\n| 4.1.6 | 大型机现代化两派路线 | ⭐⭐ | 单选 |\n| 4.2.1 | RTO/RPO 定档与灾备四档 | ⭐⭐⭐ | 情景单选 |\n| 4.2.2 | 持续复制与按需拉起 | ⭐⭐ | 情景单选 |\n| 4.2.3 | 韧性中心评估与运行手册 | ⭐⭐ | 单选/多选 |\n| 4.2.4 | 切流三层（探测/自动/人工闸） | ⭐⭐⭐ | 情景单选/多选 |\n| 4.2.5 | 演练分级与实测 RTO | ⭐⭐ | 情景单选 |\n| 4.2.6 | 多集群同步与温备切流 | ⭐⭐ | 情景单选 |\n| 4.3.1 | 集中备份治理与跨账户复制 | ⭐⭐⭐ | 情景多选 |\n| 4.3.2 | 故障转移测试与打点报数 | ⭐⭐ | 情景单选 |\n| 4.3.3 | 韧性三层（冗余/容错/自愈） | ⭐⭐⭐ | 情景多选 |\n| 4.3.4 | 三把锁与合规模式 | ⭐⭐⭐ | 情景单选/多选 |\n| 4.3.5 | 混沌五步与护栏 | ⭐⭐ | 情景单选/排序 |","services":"| 服务 | 主要用途 | 涉及知识点 |\n|---|---|---|\n| 发现工具与评估分诊 | 迁移摸底 | 4.1.1 |\n| AWS Transform MGN（曾用名 AWS Application Migration Service） | 批量平迁 | 4.1.2 |\n| AWS Database Migration Service / Schema Conversion Tool / DataSync | 数据迁移 | 4.1.3 |\n| Amazon RDS / Aurora / ECS / Lambda | 平台重塑 | 4.1.4 |\n| 微服务拆分与绞杀者模式 | 重构路线 | 4.1.5 |\n| AWS Transform（大型机现代化） | 遗留现代化 | 4.1.6 |\n| 灾备四档策略 / AWS Backup | 定档与备份恢复 | 4.2.1、4.3.1 |\n| AWS Elastic Disaster Recovery | 持续复制快恢复 | 4.2.2 |\n| AWS Resilience Hub / Systems Manager 运行手册 | 评估与规程 | 4.2.3、4.2.5 |\n| Route 53 健康检查与故障转移记录 / Global Accelerator / ARC | 多区域切流 | 4.2.4 |\n| Amazon EKS / ECS（多集群） | 容器高可用 | 4.2.6 |\n| AWS Fault Injection Service | 故障注入与混沌 | 4.3.2、4.3.5 |\n| 跨可用区冗余 / 数据库多可用区 / 自愈替换 | 韧性三层 | 4.3.3 |\n| S3 Object Lock / EBS 快照锁 / Backup Vault Lock | 不可变防线 | 4.3.4 |","furtherReading":"| 页面 | 什么时候去看 | URL |\n|---|---|---|\n| SAP-C03 Exam Guide · Domain 4 | 本域技能点原文与权重 | https://docs.aws.amazon.com/aws-certification/latest/solutions-architect-professional-03/solutions-architect-professional-03-domain4.html |\n| AWS Backup 开发者指南 | 集中治理与库锁口径 | https://docs.aws.amazon.com/aws-backup/latest/devguide/ |\n| AWS Elastic Disaster Recovery 用户指南 | 持续复制与恢复 | https://docs.aws.amazon.com/drs/latest/userguide/ |\n| AWS Resilience Hub 用户指南 | 韧性评估与测试 | https://docs.aws.amazon.com/resiliencehub/latest/userguide/ |\n| AWS Fault Injection Service 用户指南 | 实验模板与稳态假设 | https://docs.aws.amazon.com/fis/latest/userguide/ |\n\n这些页面都是 AWS 官方公开文档。中文资料与英文原文说法不一致时，以英文原文为准。"}},{"domain":5,"name":"卓越运营和自动化","weight":"20%","practice":[{"id":"D5-001","d":5,"t":"single","q":"团队要用基础设施即代码管理多环境，既要复用通用组件，又要支持条件判断与循环。哪种组合合适","o":[{"l":"A","t":"全部用控制台手工操作，不引入基础设施即代码"},{"l":"B","t":"只用 CloudFormation 模板，不能采用其他方式"},{"l":"C","t":"只用 CDK，完全放弃声明式模板"},{"l":"D","t":"用 CloudFormation 编写声明式模板，用 CDK 以代码方式生成模板，两者互补"}],"a":["D"],"e":"✅ 正确项：D。CloudFormation 是声明式模板，CDK 以代码方式生成 CloudFormation 模板，两者可并存互补，兼顾组件复用与逻辑表达。关联考点：域 5.1.1「用声明式与命令式方法实现基础设施即代码」。\n\n❌ A：手工控制台不可版本化、容易产生配置漂移，违背基础设施即代码原则。\n❌ B：CloudFormation 虽是基础，但否定 CDK 就放弃了代码复用与逻辑表达的优势。\n❌ C：放弃声明式模板会失去 CloudFormation 原生的治理与直接部署能力。\n\n📌 关键概念：声明式与命令式不是二选一，CDK 最终也产出 CloudFormation 模板，二者互补。","s":"自编·5.1.1"},{"id":"D5-002","d":5,"t":"single","q":"分布式应用排障困难，团队要建立可观测性，统一收集指标与日志，并做跨服务调用链追踪。哪种组合完整覆盖这三要素","o":[{"l":"A","t":"用 CloudWatch 收集指标与日志，用 AWS X-Ray 做分布式追踪"},{"l":"B","t":"只看 CloudWatch 指标就够了，日志和追踪是多余的"},{"l":"C","t":"只在出错时打印日志，不做主动采集"},{"l":"D","t":"用 S3 存放日志即可替代指标采集与分布式追踪"}],"a":["A"],"e":"✅ 正确项：A。可观测性三要素是指标、日志与分布式追踪，CloudWatch 覆盖指标与日志，X-Ray 覆盖调用链追踪，组合完整。关联考点：域 5.3.1「用标准化采集实现可观测性」。\n\n❌ B：只有指标无法定位跨服务调用链问题，日志与追踪不可省略。\n❌ C：被动打印日志缺少标准化采集与关联，排障时信息零散难用。\n❌ D：S3 只是存储，不能替代指标采集与分布式追踪的能力。\n\n📌 关键概念：可观测性等于指标加日志加追踪三者齐备，单靠任一项都不足以排查分布式故障。","s":"自编·5.3.1"},{"id":"D5-003","d":5,"t":"single","q":"Fabrikam 的治理要求：未加密的桶不允许创建、所有存储必须带租户标签、存量资源的漂移要被发现。策略即代码怎么配","o":[{"l":"A","t":"只上 Config 周报软约束，违规记录月度回顾"},{"l":"B","t":"治理规则写进制度文档，要求团队自觉遵守"},{"l":"C","t":"CloudFormation Hooks 在部署时拒绝不合规资源，CDK aspects 在合成期强制加租户标签，Config 规则运行期持续检出漂移"},{"l":"D","t":"靠人工代码评审识别全部违规配置"}],"a":["C"],"e":"✅ 正确项：C。策略即代码四件武器各守一层：CloudFormation Hooks 在栈部署时逐资源评估，不合规直接拒绝——事前拦截；CDK aspects 在合成期遍历构造树，强制加标签与加密这类出厂设置；Config 规则运行期持续评估存量——事前事后两层齐，红线才立得住。关联考点：域 5.1.2「设计策略即代码以执行主动校验、强制实施和漂移修复」。\n\n❌ A：只有事后软约束，事前该拦的照样创建出来，红线半截。\n❌ B：制度文档不是可执行拦截，策略即代码的核心就是机器执行。\n❌ D：人工评审追不上规模化变更速度，漏检是常态。\n\n📌 关键概念：三道策略是事前 Hooks、合成期 aspects、运行期 Config；事前事后两层才完整。","s":"自编·5.1.2"},{"id":"D5-004","d":5,"t":"single","q":"Contoso 漂移检测报出三处手改：两处是运维误操作，一处是故障当晚紧急手工加了节点。漂移修复怎么处理","o":[{"l":"A","t":"三处一律自动拉回模板定义状态"},{"l":"B","t":"分类处理：误操作两处自动拉回定义态，紧急扩容属于正当变更，把节点数回填进模板成为新定义态"},{"l":"C","t":"三处全部回填模板，模板跟随实际配置走"},{"l":"D","t":"忽略漂移告警，等下次变更自然覆盖"}],"a":["B"],"e":"✅ 正确项：B。漂移修复先分对错再动手：误操作的手改偏离了定义态，自动拉回恢复一致；紧急扩容是有正当理由的变更，直接拉回会把生产容量砍掉伤业务——正确动作是把节点数回填进模板，让定义态跟上经过授权的变更。关联考点：域 5.1.2「设计策略即代码以执行主动校验、强制实施和漂移修复」。\n\n❌ A：一律拉回会把紧急扩容的节点砍掉，盲目的「修复」自己就是故障源。\n❌ C：全部回填等于模板跟着手改走，误操作也变成定义态，治理失效。\n❌ D：漂移放着不管，基础设施即代码的收敛保证就名存实亡。\n\n📌 关键概念：漂移分两类——误操作拉回、正当变更回填模板；先查为什么漂，再决定怎么修。","s":"自编·5.1.2"},{"id":"D5-005","d":5,"t":"single","q":"Contoso 的数据库栈模板要求：仓库零明文密码、参数回显不泄密、数据库凭据全自动轮换。密钥管理怎么配","o":[{"l":"A","t":"密码写进模板默认参数，随模板一起入库方便查阅"},{"l":"B","t":"模板只写动态引用，创建时从 Secrets Manager 取真值，轮换由 Secrets Manager 托管，管道敏感参数不回显并过滤日志"},{"l":"C","t":"各环境统一用同一个密码，减少管理负担"},{"l":"D","t":"密码放加密参数存储，配置后不再变更"}],"a":["B"],"e":"✅ 正确项：B。基础设施代码里的密钥原则是只存引用不存真值：模板写动态引用，创建时从 Secrets Manager 动态取值——仓库与模板零明文；数据库凭据挂 Secrets Manager 自动轮换，应用经授权取用；敏感参数配不回显，管道输出日志加过滤，三处泄密口一起封。关联考点：域 5.1.3「管理基础设施代码中的密钥」。\n\n❌ A：模板入库等于密钥入库，每一个能读仓库的人都能读到密码。\n❌ C：各环境共用一个密码，泄露一次爆炸半径覆盖全部环境。\n❌ D：不轮换的凭据泄露窗口无限大，轮换与审计都是托管服务的基本价值。\n\n📌 关键概念：密钥只引用不落值；轮换托管给 Secrets Manager；不回显与日志过滤是防漏的最后两道。","s":"自编·5.1.3"},{"id":"D5-006","d":5,"t":"single","q":"Fabrikam 的基线栈（日志、网络、身份）要铺到几十个账户三个区域，新开的账户要自动继承基线。基础设施部署怎么配","o":[{"l":"A","t":"写脚本循环登录每个账户逐个跑模板"},{"l":"B","t":"用可管理权限模式，先逐账户找管理员授权"},{"l":"C","t":"把模板拷贝给各账户团队自行修改部署"},{"l":"D","t":"StackSets 服务托管模式以组织单元为目标一次定义并行铺开，开自动部署让新账户进单元即自动继承基线"}],"a":["D"],"e":"✅ 正确项：D。规模化部署的正解是 StackSets：服务托管模式配合 Organizations——以组织单元为目标、免逐账户授权；一份模板并行铺到多账户多区域，一次定义全组织收敛；开启自动部署后，新账户进入组织单元基线栈自动创建，零手工继承。关联考点：域 5.1.4「设计多账户和多区域的基础设施部署」。\n\n❌ A：逐账户跑脚本没有自动继承，新账户照旧漏基线，规模化下不可持续。\n❌ B：既然有 Organizations，服务托管模式免逐账户授权，选还要授权的模式是自找麻烦。\n❌ C：模板拷贝各改各的，基线定义态四处发散，漂移从源头就管不住。\n\n📌 关键概念：StackSets 三件是一次定义全组织收敛、服务托管免授权、新账户自动继承；手改靠漂移检测兜住。","s":"自编·5.1.4"},{"id":"D5-007","d":5,"t":"single","q":"Tailspin 要把从代码提交到生产的发布全流程自动化。CI/CD 管道怎么编排","o":[{"l":"A","t":"跳过测试阶段，构建完直接部署抢速度"},{"l":"B","t":"提交触发管道，CodeBuild 按构建规范编译加单元测试，构建后自动测试与镜像扫描，CodeDeploy 按策略部署，制品带提交指纹全程可回溯"},{"l":"C","t":"每个环境各自重新构建一套制品，环境隔离更干净"},{"l":"D","t":"生产部署完全自动放行，不设人工环节"}],"a":["B"],"e":"✅ 正确项：B。管道四阶段各司其职：源阶段——代码提交自动触发；构建阶段——CodeBuild 按构建规范跑编译、单元测试、打镜像；测试阶段——自动验证接在构建后，集成测试加镜像扫描；部署阶段——CodeDeploy 按策略上环境；制品带提交指纹一路带到生产，出问题可回溯到具体提交。关联考点：域 5.2.1「设计 CI/CD 方案以编排自动化构建和部署管道」。\n\n❌ A：跳过测试省十分钟，一次生产事故赔的是一晚上加信任。\n❌ C：各环境重新构建破坏「测试过的二进制才是上生产的二进制」，不可比。\n❌ D：自动化到可自动的部分，生产晋级的人闸与门禁仍要在。\n\n📌 关键概念：四阶段是源、构建、测试、部署；制品可追溯贯穿全程。","s":"自编·5.2.1"},{"id":"D5-008","d":5,"t":"multiple","q":"Contoso 的支付服务管道要上 DevSecOps 门禁：漏洞不带上线、制品防篡改。哪些配置正确（选所有适用项）","o":[{"l":"A","t":"构建阶段 Inspector 扫依赖与代码，镜像入仓即扫，部署前再复扫——三层扫描"},{"l":"B","t":"只在构建时扫一次，后续环节不再扫"},{"l":"C","t":"扫描结果分级处置：高危红牌停线，中危开单限期修，低危进债务清单月度清"},{"l":"D","t":"制品出库前签名，部署前验签，被篡改的制品部署不了"},{"l":"E","t":"门禁一律设为阻断，任何级别漏洞都停线"}],"a":["A","C","D"],"e":"✅ 正确项：A、C、D。管道安全三件配齐：扫描三层——构建时 Inspector 扫依赖与代码、镜像入仓即扫、部署前复扫，三层时效不同各有把关；门禁分级——高危停线、中危限期、低危进债务清单，按严重度处置才不堵发布；签名链——制品出库前签名、部署前验签，跨环境流转全程防篡改。关联考点：域 5.2.2「在管道中实施安全扫描以评估漏洞并签名制品」。\n\n❌ B：只扫一次漏掉入仓与部署窗口的新披露漏洞，时效不齐。\n❌ E：任何级别都停线，低危漏洞堵死发布节奏，分级处置才是可持续的门禁。\n\n📌 关键概念：扫描三层、门禁分级、制品签名验签；签名在跨环境流转时价值最大。","s":"自编·5.2.2"},{"id":"D5-009","d":5,"t":"single","q":"Fabrikam 的制品要在开发、测试、生产三个账户间流转，要防止被篡改的制品混进部署。机制怎么配","o":[{"l":"A","t":"制品桶设为私有，访问受限就等于防篡改"},{"l":"B","t":"签名验证流程太繁琐，靠人工核对版本号确认"},{"l":"C","t":"制品出库前签名，部署前验签，验签不过直接拒绝部署"},{"l":"D","t":"只在生产部署这一步做签名校验"}],"a":["C"],"e":"✅ 正确项：C。制品防篡改靠签名链闭环：制品构建完成、出库前做签名——签的是真身；每次部署前验签——被篡改或来源不明的制品验签不过，部署直接拒绝，跨环境流转全程可控。关联考点：域 5.2.2「在管道中实施安全扫描以评估漏洞并签名制品」。\n\n❌ A：私有桶限制访问权，防不了中途被改内容，私有与防篡改是两回事。\n❌ B：人工核对版本号挡不住同名假制品，机器验签才是硬闸。\n❌ D：只在最后一步验签，中间环节被换的制品一路绿灯，签名在流转全程都要验。\n\n📌 关键概念：出库前签名、部署前验签；签名链的价值随跨环境流转而放大。","s":"自编·5.2.2"},{"id":"D5-010","d":5,"t":"single","q":"Fabrikam 的集中发布平台：管道账户负责构建与测试，部署目标是各业务账户的三个区域环境。跨账户管道怎么配","o":[{"l":"A","t":"在各业务账户创建长期 IAM 用户，管道保存凭据部署"},{"l":"B","t":"各环境重新构建一次，保证环境制品干净"},{"l":"C","t":"生产晋级全自动放行，加快发布节奏"},{"l":"D","t":"目标账户建部署角色信任管道角色并带外部 ID，制品一次构建流经三区域，生产晋级前人工审批"}],"a":["D"],"e":"✅ 正确项：D。跨账户管道三件配齐：角色委派——目标账户的部署角色只信任管道角色切换过来执行，信任条件带外部 ID，全程无长期凭据；制品流——一次构建处处部署，同一制品流经三个区域，测试过的就是部署的；门禁——晋级到生产的最后一段加人工审批动作放行。关联考点：域 5.2.3「配置多账户和多区域部署管道，包含角色委派和制品晋级」。\n\n❌ A：长期凭据散在各账户是泄露面，角色委派加外部 ID 才是正解。\n❌ B：各环境重编译破坏制品一致性，测试过的二进制才敢上生产。\n❌ C：生产晋级的人闸是最后防线，全自动放行省不了这一步。\n\n📌 关键概念：委派不落凭据、一次构建处处部署、生产晋级有人闸。","s":"自编·5.2.3"},{"id":"D5-011","d":5,"t":"single","q":"Contoso 的客服助手上线前有三个候选模型，RAG 的答案质量要评，上线后每个版本都要有质量门槛。评估体系怎么配","o":[{"l":"A","t":"三个候选模型用同一套固定评测集同卷打分；RAG 的检索命中率与答案接地度分开评；上线后每版本跑回归评测，分数跌破门槛自动回滚"},{"l":"B","t":"选型靠团队感觉，用着顺就是好模型"},{"l":"C","t":"评测题集每次随机换一批，考察更全面"},{"l":"D","t":"上线即终点，模型行为长期稳定无需评估"}],"a":["A"],"e":"✅ 正确项：A。AI 质量门三段配齐：选型评估——三个候选模型跑同一套固定评测集，同卷打分才可比；RAG 评估——检索质量与答案接地度分开评，检索对不对与答案贴不贴是两件事；持续验证——上线后每版本跑回归评测，分数跌破门槛自动回滚版本，「感觉不错」不是质量证据。关联考点：域 5.2.4「评估 AI/ML 应用并验证输出」。\n\n❌ B：模型选型靠人感没有证据链，换个人感受就换结论。\n❌ C：评测集要固定，换题就不可比——回归评测的意义在同卷对照。\n❌ D：上线后模型会漂移、版本会变化，没有回归门槛就是裸奔。\n\n📌 关键概念：Bedrock Evaluations 三段是选型同卷、RAG 分评、上线回归；评测集是资产要维护。","s":"自编·5.2.4"},{"id":"D5-012","d":5,"t":"multiple","q":"Fabrikam 的接口发布要求又快又稳且出问题能回退。关于部署策略，哪些说法正确（选所有适用项）","o":[{"l":"A","t":"金丝雀按 5% 放量观察，错误率与延迟达标再自动放量，出问题一键收流量回退"},{"l":"B","t":"蓝绿部署回滚等于切回旧环境，秒级完成，代价是窗口期双倍资源"},{"l":"C","t":"数据库表结构变更靠蓝绿切流回滚数据"},{"l":"D","t":"无状态可快速重建的服务用滚动部署，成本最低"},{"l":"E","t":"滚动部署把全部实例一批同时替换，速度最快"}],"a":["A","B","D"],"e":"✅ 正确项：A、B、D。三策略各取所长：金丝雀先放小流量试错——5% 放量观察十五分钟，指标达标自动放量，出问题收流量即回退，风险最小；蓝绿两套环境并行——回滚就是切回旧环境，秒级，代价是窗口期双倍资源；无状态可快速重建的服务滚动部署分批替换，成本最低。关联考点：域 5.2.5「实施提供回滚能力的部署策略」。\n\n❌ C：蓝绿回滚的是流量不是数据——数据库变更要走向前兼容设计：新列先加、代码分两版上、旧列后删。\n❌ E：滚动分批替换批次间有缓冲，全量一批同时替换没有灰度，出问题就是全停。\n\n📌 关键概念：秒级回退选蓝绿、风险最小选金丝雀、成本最低选滚动；数据变更向前兼容，别指望切流回滚。","s":"自编·5.2.5"}],"sections":[{"h":"设计基础设施即代码","body":"### 这一域考什么\n\n这一域问的是：系统跑起来之后，怎么让它「变更有流程、出事有信号、修复有自动化」——运营的自动化与可观测是主题。\n\n四条线串起全章：\n\n1. **基础设施即代码**：声明式与命令式工具、策略即代码、密钥管理与批量部署，对应任务 5.1。\n2. **CI/CD 与 DevSecOps**：管道编排、安全扫描、跨账户晋级、部署策略与 AI 评估，对应任务 5.2。\n3. **可观测性**：指标日志追踪三支柱、容器监控、日志聚合、告警与 SLO，对应任务 5.3。\n4. **运营自动化与韧性**：健康响应、受控修复、自动扩缩、故障恢复与运行手册，对应任务 5.4。\n\n这门课是专业级（Professional），考法是给一组运营目标（发布节奏、恢复要求、信噪比），让你设计对应的自动化与观测链路，并讲清代价与边界。\n\n### 读完这个域要能做什么\n\n这门课写给要为「系统怎么跑」负责的架构师。读完本域应能：\n\n- 选对基础设施即代码工具与策略层，讲清声明式与命令式的取舍。\n- 设计带安全门禁的发布管道，含跨账户晋级与回滚。\n- 搭可观测三支柱，配出告警与服务级别目标。\n- 给运营任务配自动修复，带熔断与限流的安全约束。\n- 给 AI 应用配评估与监控，别让它裸奔。\n\n### 和其他认证怎么接\n\n| 其他认证/能力 | 对应的那件事 | 这里有什么不同 | 什么时候该想起它 |\n|---|---|---|---|\n| DevOps Professional（DOP-C02） | 都讲 CI/CD 与可观测 | DOP 偏实现与工具链细节；本课站在架构视角定形态与治理层 | 要定「管道形态与治理门」而不是「怎么配管道」时 |\n| SAA-C03（解决方案架构师助理级） | 都讲监控与自动扩缩 | 助理级配得会；专业级要设计多账户信噪比与受控修复链路 | 遇到「告警风暴」「修复风暴」治理就卡住时 |\n\n对照只用来迁移已有理解。做题以本域官方口径为准。\n\n### 官方口径的三条边界\n\n- 官方 Exam Guide 给出技能点编号与原文，不给逐考点的出现频率。\n- 官方认证页写明题型含单选与多选，多选必须全选对才得分。\n- 及格线 720 分（100–1000 补偿式计分），不要求每域单独达线。\n\n#### 这一节学什么\n这一节对应考纲任务 5.1「设计基础设施即代码」。\n\n> 官方原名：Design infrastructure as code.\n\n这一任务是运营自动化的地基。四个技能点从工具范式讲到策略即代码，再到密钥管理与规模化部署。主线是：工具范式 → 策略前置 → 密钥托管 → 批量铺开。\n\n#### 使用声明式和命令式方法实现基础设施即代码\n\n> 官方原名：Implement infrastructure as code by using declarative and imperative approaches (for example, AWS CloudFormation, AWS CDK).\n\n**这条在问什么。** 考题给你「基础设施变更要走可评审可回滚的代码路径、选什么工具」这类起点题。\n\n**定义**：基础设施即代码（IaC，infrastructure as code）把基础设施定义写成代码入库。声明式描述「要什么结果」——CloudFormation 模板写目标态；命令式描述「按什么步骤做」——AWS CDK 用编程语言组装资源，合成出模板再部署。\n\n**怎么运作**。两条路各管一段：\n\n1. CloudFormation：模板声明目标态；变更集预览差异；执行栈按模板收敛。\n2. CDK：编程语言建模，合成模板后走同一部署引擎；构造库可复用抽象。\n\n**什么时候用，什么时候别用**。团队要抽象复用与编程语言的效率，选 CDK；要模板直读可审计的，选 CloudFormation。两者产物同引擎，可并存分场景。别用控制台手改——手改即漂移，是基础设施即代码的头号反模式。变更要走代码评审加变更集预览，别跑一把试试。\n\n💡 **场景举例**（虚构教学示意）：Contoso 平台组：网络与基线用 CloudFormation 模板直读可审计；业务应用栈用 CDK 构造库快速铺。两者入库同走评审，控制台只读。\n\n**关联服务**：AWS CloudFormation（模板与变更集）、AWS CDK（构造库与合成）。\n\n#### 设计策略即代码以执行主动校验、强制实施和漂移修复\n\n> 官方原名：Design policy as code to perform proactive validation, enforcement, and drift remediation (for example, by using AWS CloudFormation Hooks, AWS CDK aspects, AWS Config rules, SCPs).\n\n**这条在问什么。** 考题给你「资源不合规就不能创建、配置漂了要发现并修」这类前置治理题。\n\n**定义**：策略即代码把治理规则写成可执行的代码——部署前拦（Hooks 与 aspects）、运行期查（Config 规则）、组织层兜（SCP）。漂移修复是「实际态偏离定义态」的发现与拉回。\n\n**怎么运作**。四件武器各管一段：\n\n1. CloudFormation Hooks：栈部署时逐资源评估，不合规直接拒——事前拦截。\n2. CDK aspects：合成期遍历构造树改资源，强制加标签与加密这类出厂设置。\n3. Config 规则：运行期持续评估存量，违规即发现（任务 2.3.5 展开）。\n4. 漂移检测：CloudFormation 的漂移检测发现手改，与定义态比对拉回。\n\n**什么时候用，什么时候别用**。合规红线要在事前层拦（Hooks 与 aspects），Config 管存量发现——事前事后两层才齐。轻治理场景只上 Config 周报软约束。漂移修复自动拉回前先查为什么漂：有正当理由的变更回填到模板，不是盲目拉回。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 治理三道：Hooks 拦「未加密的桶」；aspects 给所有存储强制加租户标签；Config 检出三处手改——两处误操作自动拉回，一处紧急扩容回填模板。\n\n**关联服务**：AWS CloudFormation Hooks、AWS CDK aspects、AWS Config 规则、SCP。\n\n#### 管理基础设施代码中的密钥\n\n> 官方原名：Manage secrets in infrastructure code (for example, by using AWS Secrets Manager, AWS Systems Manager Parameter Store).\n\n**这条在问什么。** 考题给你「模板里的密码不能明文、参数与日志不能泄密」这类密钥题。\n\n**定义**：AWS Secrets Manager 管密钥全生命周期（含自动轮换）；AWS Systems Manager Parameter Store 存配置参数（SecureString 是加密形态）。基础设施即代码里的密钥原则：代码只存引用，真值进托管服务。\n\n**怎么运作**。三件事各管一段：\n\n1. 引用不落值：模板里写密钥的动态引用，创建时动态取真值；敏感参数配不回显。\n2. 轮换托管：数据库与第三方凭据挂 Secrets Manager 自动轮换，应用经授权取用。\n3. 环境分层：各环境的密钥与参数按环境命名空间隔离。\n\n**什么时候用，什么时候别用**。数据库与第三方接口凭据必须托管——轮换与审计都是刚需。非敏感静态配置用参数存储的普通形态就够。别把密钥写进模板默认值——模板入库等于密钥入库。管道输出日志也要防泄露：不回显与日志过滤都配上。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的数据库栈：密码经动态引用取自 Secrets Manager；模板与仓库零明文；管道输出过滤敏感字段；轮换全自动。\n\n**关联服务**：AWS Secrets Manager（轮换与审计）、AWS Systems Manager Parameter Store（SecureString）、CloudFormation 动态引用。\n\n#### 设计多账户和多区域的基础设施部署\n\n> 官方原名：Design multi-account and multi-Region infrastructure deployments (for example, by using CloudFormation StackSets).\n\n**这条在问什么。** 考题给你「基线栈要铺到几十个账户三个区域、不能逐个跑」这类规模化部署题。\n\n**定义**：StackSets 把一份模板铺到多个账户与区域；服务托管模式配合 Organizations 实现自动开栈——新账户进组织单元自动继承基线。\n\n**怎么运作**。三件事各管一段：\n\n1. 批量铺开：StackSets 按账户列表或组织单元选目标，并行部署同一模板。\n2. 自动继承：服务托管模式加自动部署，新账户进单元基线栈自动创建。\n3. 权限模式：可管理权限模式要被管账户先授权；服务托管模式走组织信任免授权。\n\n**什么时候用，什么时候别用**。多账户多区域的基线（网络、日志、治理）用 StackSets 一次定义全组织收敛。业务应用栈谁部署谁管，单栈就够。有 Organizations 就用服务托管模式——免逐账户授权。批量铺开后的手改要靠漂移检测兜住（任务 5.1.2 展开）。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的基线：StackSets 服务托管模式把「日志、网络、身份」三个基线栈铺到全部组织单元；新账户由开号流水线创建（任务 2.3.1 展开），入单元自动继承基线，零手工。\n\n**最小配置示意**（教学示意；服务托管模式的组织级铺开）：\n\n```\naws cloudformation create-stack-set \\\n  --stack-set-name baseline-logging \\\n  --template-url s3://templates/logging-baseline.yaml \\\n  --permission-model SERVICE_MANAGED \\\n  --auto-deployment Enabled=true,RetainStacksOnAccountRemoval=false\n```\n\n**关联服务**：AWS CloudFormation StackSets（服务托管模式）、AWS Organizations（组织单元目标）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「基础设施即代码就是把手工操作记下来」 | 是声明目标态让引擎收敛，不是操作录像 |\n| 2 | 「CDK 与 CloudFormation 二选一」 | CDK 合成出 CloudFormation 模板，两者同引擎可并存 |\n| 3 | 「策略即代码就是写制度文档」 | 是可执行拦截与检测：Hooks 拦、aspects 改、Config 查 |\n| 4 | 「密钥放加密参数就万事大吉」 | 还要轮换与审计；模板默认值里出现就是入库泄露 |\n| 5 | 「漂移一律自动拉回」 | 有正当理由的变更回填模板；盲目拉回伤生产 |\n| 6 | 「多账户部署逐个跑脚本也行」 | 规模化用 StackSets：一次定义、全组织收敛、新账户自动继承 |\n\n#### 记忆要点\n\n1. **两式两器**：声明式 CloudFormation、命令式 CDK，同引擎并存。\n2. **三道策略**：事前 Hooks、合成期 aspects、运行期 Config。\n3. **密钥只引用**：动态引用取真值，敏感参数不回显。\n4. **托管轮换**：凭据进 Secrets Manager，应用经授权取。\n5. **批量铺开**：StackSets 服务托管模式，新账户自动继承。\n6. **漂移分类**：误操作拉回，正当变更回填模板。\n\n---"},{"h":"设计 CI/CD 和 DevSecOps 管道","body":"#### 这一节学什么\n这一节对应考纲任务 5.2「设计 CI/CD 和 DevSecOps 管道」。\n\n> 官方原名：Design CI/CD and DevSecOps pipelines.\n\n这一任务把发布变成流水线。五个技能点从管道编排讲到安全门禁，再到跨账户晋级、AI 评估与部署策略。主线是：编排 → 安全门禁 → 跨账户晋级 → AI 质量门 → 部署与回滚。\n\n#### 设计 CI/CD 方案以编排自动化构建和部署管道\n\n> 官方原名：Design CI/CD solutions to orchestrate automated build and deployment pipelines (for example, by using AWS CodePipeline, AWS CodeBuild, AWS CodeDeploy, AWS CodeCommit).\n\n**这条在问什么。** 考题给你「从提交到生产的全流程自动化、每个环节谁干」这类管道编排题。\n\n**定义**：CI/CD 管道把「提交、构建、测试、部署」串成自动化。AWS CodePipeline 编排各阶段；CodeBuild 按构建规范跑编译与测试；CodeDeploy 按策略把版本铺到环境；CodeCommit 是托管代码仓。\n\n**怎么运作**。四阶段各管一段：\n\n1. 源：代码提交触发管道，源阶段支持托管仓库与外部仓库。\n2. 构建：CodeBuild 按构建规范跑编译、单元测试、打镜像。\n3. 测试：自动验证接在构建后——集成测试与镜像扫描。\n4. 部署：CodeDeploy 按策略上环境，策略在任务 5.2.5 展开。\n\n**什么时候用，什么时候别用**。全托管管道适合要「少自维护」的团队；已有第三方流水线投入的可复用，CodePipeline 也能当编排壳混搭。制品可追溯要保住：带提交指纹的制品一路带到生产。别跳过测试阶段直上生产——省十分钟可能赔一晚上。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的发布流水线：提交触发构建与单测，镜像推送即扫描，测试环境自动部署跑集成测试，生产走金丝雀。制品全程带提交指纹可回溯。\n\n**关联服务**：AWS CodePipeline（编排）、AWS CodeBuild（构建）、AWS CodeDeploy（部署）、AWS CodeCommit（代码仓）。\n\n#### 在管道中实施安全扫描以评估漏洞并签名制品\n\n> 官方原名：Implement security scanning in pipelines to assess vulnerabilities and sign artifacts (for example, by using Amazon Inspector, Amazon ECR image scanning).\n\n**这条在问什么。** 考题给你「漏洞别带上线、制品要能验真身」这类 DevSecOps 门禁题。\n\n**定义**：管道安全两件事——扫描（对代码与镜像跑漏洞评估，高危拦停）与签名（制品发布前签名、部署时验签防篡改）。Amazon Inspector 是托管扫描引擎；ECR 镜像扫描在推送时跑（任务 1.1.8 展开）。\n\n**怎么运作**。三件事各管一段：\n\n1. 扫描层：构建阶段跑 Inspector 扫依赖与代码，镜像入仓即扫。\n2. 门禁层：扫描结果分级——高危不过、中危限期、低危记录。\n3. 签名层：制品出库前签名，部署前验签，被篡改的制品部署不了。\n\n**什么时候用，什么时候别用**。对外服务与受监管系统的管道，扫描门禁必配。扫描别只跑一次：构建扫、入仓扫、部署前复扫——三层时效不同。签名在制品跨环境流转时价值最大。门禁太紧会堵发布，按严重度分级处置。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的支付服务管道：构建后扫依赖、镜像入仓即扫、部署前验签；高危红牌停线，中危开单限期修，低危进债务清单月度清。\n\n**关联服务**：Amazon Inspector（依赖与代码扫描）、Amazon ECR 镜像扫描、制品签名与验签。\n\n#### 配置多账户和多区域部署管道，包含角色委派和制品晋级\n\n> 官方原名：Configure multi-account and multi-Region deployment pipelines that include features such as role delegation and artifact promotion (for example, by using CodePipeline cross-account deployments).\n\n**这条在问什么。** 考题给你「构建在管道账户、部署到各业务账户多区域、权限怎么给、制品怎么流」这类跨账户管道题。\n\n**定义**：跨账户管道指管道账户负责构建与测试，目标账户接收部署。角色委派是管道角色切换为目标账户的部署角色执行动作；制品晋级是制品逐环境流转，每级带门禁。\n\n**怎么运作**。三件事各管一段：\n\n1. 委派：目标账户建部署角色，只信任管道角色切换过来执行——不给长期凭据。\n2. 制品流：制品桶配跨账户权限与共享密钥，一次构建处处部署，不重编译。\n3. 门禁：晋级到生产的最后一段加人工审批动作放行。\n\n**什么时候用，什么时候别用**。多账户组织的集中发布平台用跨账户管道——安全边界加一次构建。小团队单账户普通管道就够。区域扩展按运维节奏决定：同一管道多区域动作，或按区域分管道。「各环境重新构建」是反模式——测试过的二进制才是上生产的二进制。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的发布平台：管道账户构建测试，生产晋级前人工审批；部署角色只限当次资源范围；制品一次构建流经三个区域的环境。\n\n**最小配置示意**（教学示意；目标账户的部署角色信任管道角色）：\n\n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\n    \"Effect\": \"Allow\",\n    \"Principal\": { \"AWS\": \"arn:aws:iam::<管道账户>:role/pipeline-role\" },\n    \"Action\": \"sts:AssumeRole\",\n    \"Condition\": { \"StringEquals\": { \"sts:ExternalId\": \"<外部ID>\" } }\n  }]\n}\n```\n\n**关联服务**：AWS CodePipeline（跨账户动作与人工审批）、AWS STS（角色委派）、制品桶与共享密钥。\n\n#### 评估 AI/ML 应用并验证输出\n\n> 官方原名：Evaluate AI/ML applications and validate outputs (for example, by using Amazon Bedrock Evaluations).\n\n**这条在问什么。** 考题给你「AI 应用上线前要评测、上线后要持续验证」这类 AI 质量门题。\n\n**定义**：Bedrock Evaluations（Bedrock 评估）对模型与 RAG 做系统化评测——用固定数据集与指标打分比较。验证输出是应用层再配护栏与抽检，不让模型裸奔。\n\n**怎么运作**。三件事各管一段：\n\n1. 选型评估：上线前对候选模型跑评估任务，用固定题集同卷打分。\n2. RAG 评估：检索质量与答案接地度分开评——检索对不对与答案贴不贴是两件事。\n3. 持续验证：上线后跑回归评测，版本更新先过门槛再放量。\n\n**什么时候用，什么时候别用**。生产 AI 应用必须有上线评测门槛与上线后回归评测——「感觉不错」不是质量证据。评测集要固定，换题就不可比。护栏与评估分工：护栏管红线，评估管质量。低风险内部工具可以轻配抽检。评测集是资产，标注与维护要预算。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的客服助手上线：三个候选模型同卷评测，RAG 的检索命中率与答案接地度分开打分；上线后每版本跑回归评测——分数跌过门槛自动回滚版本。\n\n**关联服务**：Amazon Bedrock Evaluations（评估任务与指标）、Amazon Bedrock Guardrails（护栏，任务 2.5.1 展开）。\n\n#### 实施提供回滚能力的部署策略\n\n> 官方原名：Implement deployment strategies that provide rollback capabilities (for example, blue/green, canary, rolling deployments).\n\n**这条在问什么。** 考题给你「发布要快要稳、出问题要秒级回退」这类部署策略题。\n\n**定义**：三种策略——蓝绿部署开新旧两套环境切流量；金丝雀部署放小流量试错再放量；滚动部署分批替换实例。回滚是各自的反向动作。\n\n**怎么运作**。三策略各管一段：\n\n1. 蓝绿：新版本整套并行跑，验证后流量一刀切到新环境；回滚等于切回旧环境，秒级。\n2. 金丝雀：先放小比例流量到新版本，指标达标再逐步放量；回滚把流量收回来。\n3. 滚动：分批替换实例，批次间有缓冲；回滚是换回旧版本重新铺。\n\n**什么时候用，什么时候别用**。要秒级回退选蓝绿，代价是窗口期双倍资源。要风险最小选金丝雀，代价是放量周期长且指标门槛要自动化。无状态可快速重建的服务滚动就够，成本最低。数据库变更不适用环境切换式回滚——要向前兼容设计：新列先加、代码分两版上、旧列后删，别指望切流回滚数据。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的接口发布：金丝雀按 5% 放量观察十五分钟，错误率与延迟达标自动放大到全量，出问题一键收流量回退。数据库变更走向前兼容三步走。\n\n**关联服务**：AWS CodeDeploy（蓝绿与金丝雀编排）、负载均衡加权目标组（切流）、Lambda 版本与别名（金丝雀流量）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「管道自动化了就不需要审批」 | 自动化到可自动的部分；生产晋级的人闸与门禁仍在 |\n| 2 | 「扫描一次就够」 | 构建扫、入仓扫、部署前复扫，三层时效不同 |\n| 3 | 「跨账户给长期凭据最简单」 | 走角色委派加外部 ID；长期凭据是泄露面 |\n| 4 | 「各环境重新构建最干净」 | 一次构建处处部署；重编译破坏「测过的就是上的」 |\n| 5 | 「AI 质量靠人感」 | 评估任务、固定评测集、回归门槛才是证据 |\n| 6 | 「蓝绿万能回滚」 | 蓝绿回滚的是流量不是数据；数据要向前兼容设计 |\n\n#### 记忆要点\n\n1. **四阶段**：源、构建、测试、部署各司其职。\n2. **门禁分级**：高危停线、中危限期、低危入债。\n3. **委派不落凭据**：角色切换加外部 ID；一次构建处处部署。\n4. **AI 评三段**：选型同卷、RAG 分评、上线回归。\n5. **策略三选**：秒级回退蓝绿、风险最小金丝雀、成本最低滚动。\n6. **数据向前兼容**：回滚切流量不切数据。\n\n---"},{"h":"设计可观测性和监控方案","body":"#### 这一节学什么\n这一节对应考纲任务 5.3「设计可观测性和监控方案」。\n\n> 官方原名：Design observability and monitoring solutions.\n\n这一任务让系统「会说话」。七个技能点从三支柱地基讲到容器监控，再到日志聚合、告警链路、AI 指标、体验监控与 SLO。主线是：三支柱 → 容器 → 聚合 → 告警 → AI → 体验 → SLO。\n\n#### 实现可观测性：标准化检测收集指标、日志和分布式追踪\n\n> 官方原名：Implement observability by collecting metrics, logs, and distributed tracing by using standardized instrumentation (for example, by using Amazon CloudWatch, AWS X-Ray, AWS Distro for OpenTelemetry).\n\n**这条在问什么。** 考题给你「系统出问题要快速定位、三支柱怎么统一采集」这类可观测地基题。\n\n**定义**：可观测性三大支柱——指标（metrics，数值时序）、日志（logs，事件文本）、分布式追踪（distributed tracing，请求跨服务的路径）。AWS Distro for OpenTelemetry（ADOT，AWS 的 OpenTelemetry 发行版）是标准化采集层；CloudWatch 收指标与日志，X-Ray 出追踪拓扑。\n\n**怎么运作**。三件各管一段：\n\n1. 统一采集：应用埋点走 OpenTelemetry 标准，换后端不改埋点。\n2. 指标与日志：CloudWatch 指标按时序存，日志按流存。\n3. 追踪：X-Ray 把跨服务调用串成链路图——这次慢在哪个环节，一眼看穿。\n\n**什么时候用，什么时候别用**。微服务多、跨服务排障频繁，三支柱都要；单体小系统指标加日志两件够用。埋点标准化优先用 OpenTelemetry，别自造格式——换工具链就重埋。追踪有采样成本：全采只给高价值排障路径，常态采样率按流量定。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的微服务群：标准 SDK 统一埋点，指标、日志、追踪一套标准。排障从「翻日志猜环节」变「打开链路看红点」，定位时间从小时级到分钟级。\n\n**关联服务**：Amazon CloudWatch（指标与日志）、AWS X-Ray（追踪）、AWS Distro for OpenTelemetry。\n\n#### 为容器化应用实施监控\n\n> 官方原名：Implement monitoring for containerized applications (for example, by using Amazon ECS, Amazon EKS with Container Insights).\n\n**这条在问什么。** 考题给你「容器层的资源、健康、性能要看清」这类容器观测题。\n\n**定义**：Container Insights（容器洞察）是 CloudWatch 对 ECS 与 EKS 的聚合监控——集群、服务、任务级的资源与性能指标开箱即得。\n\n**怎么运作**。三件各管一段：\n\n1. 资源面：集群、节点、Pod 与任务的 CPU、内存用量与限额利用率。\n2. 健康面：重启计数、待机与失联状态。\n3. 应用面：应用指标与日志关联到任务维度，可跳转。\n\n**什么时候用，什么时候别用**。容器规模到几十任务以上，容器洞察的聚合视图是标配——它默认不开，要显式启用。深排障要容器级、应用级、追踪三层联动，只看资源面看不出业务慢。已有自建监控投入的可双轨并存。指标成本在大集群上是真金白银（任务 3.4.5 展开）。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的容器平台：三个集群开容器洞察，服务级限额利用率一眼排出「内存打满被逐」的嫌疑任务；应用指标打通后，任务维度一键跳链路。\n\n**关联服务**：Amazon CloudWatch Container Insights（ECS/EKS）。\n\n#### 通过跨账户订阅和集中归档实现多账户日志聚合\n\n> 官方原名：Implement multi-account log aggregation with cross-account subscriptions and centralized archives (for example, by using Amazon CloudWatch Logs subscriptions, Amazon S3 archival storage tiers).\n\n**这条在问什么。** 考题给你「几十个账户的日志要集中一处检索与归档」这类聚合题。\n\n**定义**：跨账户订阅指成员账户的日志流订阅到中央账户的共享目标；集中归档指统一落 S3 归档层长期保存。\n\n**怎么运作**。三步各管一段：\n\n1. 目标建立：日志账户建共享目标，资源策略授权成员账户投递。\n2. 订阅过滤：成员账户日志组配订阅过滤器，按模式筛——有价值的才进中心。\n3. 分层归档：检索期短留在 CloudWatch，长期归档转 S3 归档层。\n\n**什么时候用，什么时候别用**。多账户治理与审计必配集中日志——API 日志（任务 2.3.2 展开）与应用日志两路都集中。全量搬日志贵：订阅过滤先筛，调试级不送。归档保留期对合规定（任务 2.4.3 展开）。小组织单账户在 CloudWatch 内检索就够，别上跨账户架构。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的日志中台：三十多个账户的审计与应用错误日志经订阅过滤器汇入日志账户；检索期七天，之后转 S3 归档层长留。月成本比全量聚合省一个量级。\n\n**关联服务**：Amazon CloudWatch Logs（跨账户订阅）、Amazon S3（归档层）。\n\n#### 配置告警方案\n\n> 官方原名：Configure alerting solutions (for example, by using CloudWatch alarms, Amazon SNS, AWS Systems Manager).\n\n**这条在问什么。** 考题给你「信号要有阈值、告警要有人管、最好还能自动处置」这类告警链路题。\n\n**定义**：CloudWatch 告警对指标设阈值与持续期；Amazon SNS 扇出通知（邮件、短信、值班群）；AWS Systems Manager 接自动化——告警转事件进运维项或自动文档（任务 5.4 展开）。\n\n**怎么运作**。三件各管一段：\n\n1. 告警定义：指标加阈值加持续期，外加「缺数据算什么」的处理。\n2. 扇出：通知主题多订阅渠道——值班群、工单、备用值班。\n3. 联动：告警转事件接自动化运行手册，自动处置。\n\n**什么时候用，什么时候别用**。阈值告警配多周期确认，防抖动。告警要分级——不分级的告警全是噪音。异常检测型告警适合周期波动指标（流量日规律），固定阈值适合硬红线（错误率）。信噪比是生命线：没人看的告警要砍（任务 3.4.5 展开）。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的告警治理：一级电话加短信双通道、二级值班群、三级工单；流量型指标用异常检测基线，错误率用固定红线。季度回顾会砍掉无人认领的噪音告警，信噪比翻倍。\n\n**最小配置示意**（教学示意；负载均衡 5xx 告警）：\n\n```\naws cloudwatch put-metric-alarm \\\n  --alarm-name \"api-5xx-high\" \\\n  --metric-name HTTPCode_ELB_5XX_Count \\\n  --namespace AWS/ApplicationELB \\\n  --statistic Sum \\\n  --period 300 \\\n  --threshold 20 \\\n  --comparison-operator GreaterThanThreshold \\\n  --evaluation-periods 2 \\\n  --treat-missing-data notBreaching \\\n  --alarm-actions <SNS主题ARN>\n```\n\n**关联服务**：Amazon CloudWatch 告警、Amazon SNS（扇出）、AWS Systems Manager（运维项与自动化联动）。\n\n#### 监控 AI/ML 工作负载指标\n\n> 官方原名：Monitor metrics for AI/ML workloads, including model performance, AI agent performance, inference latency, and model drift.\n\n**这条在问什么。** 考题给你「模型上线后的性能、时延、漂移，还有智能体的任务完成率怎么持续盯」这类 AI 观测题。\n\n**定义**：AI 监控四类指标——模型性能（准确性随时间变化）、AI 智能体性能（任务与步骤完成率）、推理时延（用户体感响应时间）、模型漂移（数据分布与行为的偏移）。\n\n**怎么运作**。三件事各管一段：\n\n1. 指标层：推理时延与错误走 CloudWatch，准确性靠定期评测打分（任务 5.2.4 展开）。\n2. 漂移层：输入分布与预测分布监控，偏移就预警——数据漂移与概念漂移两形态。\n3. 智能体层：步骤成功率与工具调用失败率，卡在哪一步一眼可见（Bedrock 的轨迹可看步骤链）。\n\n**什么时候用，什么时候别用**。生产 AI 应用四类指标配齐——缺漂移的监控是温水煮青蛙。内部工具配时延与错误率就够。准确性监控要有带标注的评测集，没评测集的准确性监控是空话。漂移别只看统计量，把业务影响接上才有说服力。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的风控模型：月度评测集回归跟踪准确率；输入特征分布监控漂移——人群结构变化后模型分数整体偏移，预警后重训。智能体助手盯步骤成功率面板，工具调用失败的热点一目了然。\n\n**关联服务**：Amazon CloudWatch（时延与错误）、Amazon Bedrock（模型指标与轨迹）、评测集回归。\n\n#### 为用户体验设计监控方案：合成事务与真实用户监控\n\n> 官方原名：Design monitoring solutions for the user experience by using strategies such as synthetic transactions and real user monitoring (for example, by using Amazon CloudWatch Synthetics, Amazon CloudWatch RUM).\n\n**这条在问什么。** 考题给你「用户说卡但系统指标正常、到底哪里的问题」这类体验侧观测题。\n\n**定义**：合成监控用脚本定时模拟用户操作（Synthetics 的金丝雀脚本）；真实
