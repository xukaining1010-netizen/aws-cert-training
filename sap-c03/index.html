<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>学习材料</title>
<style>
/* ===== 页面结构：首页目录 + 章级分页 SPA（非单一长页） ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;font-size:17px;line-height:1.7}
.wrap{max-width:1200px;margin:0 auto;padding:24px 28px 60px}
@media(max-width:768px){.wrap{padding:16px 14px 48px}}

/* ===== 首页 ===== */
.hdr{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:12px;padding:30px 32px 26px;margin-bottom:18px}
.hdr-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:3px 12px;border-radius:20px;margin-bottom:10px}
.hdr h1{font-size:24px;font-weight:800;line-height:1.4}
.hdr-sub{font-size:13px;opacity:.9;margin-top:8px}
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.ov-item{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.ov-num{font-size:28px;font-weight:800;color:#4f46e5;line-height:1.2}
.ov-lbl{font-size:12px;color:#64748b;margin-top:4px}
@media(max-width:768px){.ov{grid-template-columns:repeat(2,1fr)}}

.card-s{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.cs-title{font-size:18px;font-weight:700;color:#374151;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}

/* 章节目录卡 */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ch-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 16px;cursor:pointer;transition:.2s;margin-bottom:0}
.ch-card:hover{border-color:#7c3aed;transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,70,229,.12)}
.ch-card.done{border-color:#16a34a}
.cc-num{font-size:11px;font-weight:700;margin-bottom:3px}
.cc-title{font-size:15px;font-weight:700;color:#1e293b;margin-bottom:6px}
.cc-meta{font-size:13px;color:#64748b}
.cc-prog{margin-top:8px}
.pm{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:3px}
.pbar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .4s}

/* 考试速览 */
.exam-quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.eq-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 10px;text-align:center}
.eq-num{font-size:20px;font-weight:800;color:#4f46e5;line-height:1.2}
.eq-sub{font-size:10.5px;color:#64748b;margin-top:2px}
.eq-lbl{font-size:11px;color:#64748b;margin-top:5px}
.exam-two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:10px}
@media(max-width:768px){.exam-two-col{grid-template-columns:1fr}}
.exam-sub-t{font-size:14px;font-weight:700;color:#374151;margin:4px 0 10px}
.exam-domain-tbl{width:100%;border-collapse:collapse;font-size:15px}
.exam-domain-tbl th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;padding:9px 12px;text-align:left;font-weight:700}
.exam-domain-tbl td{padding:9px 12px;border-bottom:1px solid #e9d5ff;vertical-align:middle}
.exam-domain-tbl tr:nth-child(even) td{background:#faf5ff}
.domain-chip{display:inline-block;border-radius:20px;padding:2px 11px;font-size:12px;font-weight:700;background:#ede9fe;color:#5b21b6;cursor:pointer;border:none;transition:.15s}
.domain-chip:hover{background:#ddd6fe}
.exam-info-list{font-size:15px;color:#374151;margin:0 0 12px 18px}
.exam-info-list li{margin-bottom:6px;line-height:1.7}
.exam-steps{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px;font-size:14px}
.step-block{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;padding:9px 12px;font-size:13px;color:#4338ca;flex:1 1 150px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.step-block b{display:block;font-size:13px}
.step-block span{display:block;font-size:11.5px;color:#6d28d9;margin-top:3px}
.step-arrow{color:#a78bfa;font-weight:700;font-size:16px;padding:0 4px;flex:0 0 auto;align-self:center}
details.exam-faq{margin-top:12px;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;background:#f8fafc}
details.exam-faq summary{font-size:14px;font-weight:700;color:#374151;cursor:pointer}
details.exam-faq p{margin:9px 0 0;font-size:14px;color:#475569;line-height:1.75}

/* 14 天计划 */
.ptbl{width:100%;border-collapse:collapse;font-size:15px}
.ptbl th{background:#f8fafc;padding:11px 12px;text-align:left;font-weight:600;color:#374151;border-bottom:2px solid #e2e8f0;font-size:14px}
.ptbl td{padding:10px 12px;border-bottom:1px solid #f8fafc;vertical-align:middle}
.ptbl tr:last-child td{border-bottom:none}
.day{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.chip-p{background:#ede9fe;color:#5b21b6}.chip-p:hover{background:#ddd6fe}
.focus{font-size:12px;color:#64748b}

/* ===== 章面板 ===== */
.ch-topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);padding:8px 18px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px}
.back-btn{background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:13px;font-weight:600;border-radius:8px;padding:5px 14px;cursor:pointer;white-space:nowrap;transition:.15s}
.back-btn:hover{background:#ede9fe}
.tn-title{font-size:15px;font-weight:700;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-hdr{color:#fff;padding:20px 22px 16px;border-radius:12px 12px 0 0;margin-bottom:0}
.ch-badge{font-size:13px;font-weight:700;opacity:.9;margin-bottom:5px;display:block}
.ch-title{font-size:22px;font-weight:800}
.panel{margin-bottom:14px}
.task-list{padding-left:22px;font-size:16px;color:#374151;line-height:2.0}
.task-list li::marker{color:#a78bfa}
.task-list a{color:#374151;text-decoration:none}
.task-list a:hover{color:#4f46e5}
.tl-id{display:inline-block;min-width:38px;font-weight:700;color:#4f46e5;margin-right:6px}
.panel-hr{border:none;border-top:1px solid #e2e8f0;margin:14px 0}

/* ===== 正文排版（规范 B） ===== */
.mdbody .sec-block h2.mh2{font-size:19px;font-weight:700;color:#4f46e5;margin:4px 0 12px;padding:10px 0 8px;border-top:1px solid #e2e8f0}
.mdbody p{font-size:17px;color:#374151;margin-bottom:14px;line-height:1.9}
.mdbody ul,.mdbody ol{font-size:17px;color:#374151;padding-left:24px;margin-bottom:12px}
.mdbody li{margin-bottom:8px;line-height:1.9}
.mdbody blockquote{border-left:3px solid #a78bfa;padding:10px 16px;background:#f5f3ff;font-size:15px;color:#5b21b6;margin:0 0 14px;border-radius:0 6px 6px 0;line-height:1.8}
.mdbody code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.mdbody h4.sec-h{font-size:17px;font-weight:600;color:#374151;margin:24px 0 10px;padding-left:12px;border-left:3px solid #a78bfa;line-height:1.4}
.mdbody .case-card,.mdbody .mem-card{border-radius:10px;padding:13px 16px;margin-bottom:14px}
.mdbody .case-card{background:#fff8e6;border:1px solid #ecd9a0}
.mdbody .mem-card{background:#eef3ff;border:1px solid #b9c9f7}
.mdbody .case-card h4.sec-h,.mdbody .mem-card h4.sec-h{border-left:none;padding-left:0;margin:0 0 8px;font-size:14px;font-weight:700}
.mdbody .case-card h4.sec-h{color:#9a7b1e}
.mdbody .mem-card h4.sec-h{color:#4361ee}
.mdbody .case-card p,.mdbody .mem-card p{font-size:15px}
.mdbody .case-card ul,.mdbody .mem-card ul{margin-bottom:0;font-size:15px}
/* 表格（规范 C） */
.tbl-wrap{overflow-x:auto;margin:0 0 14px;border:1px solid #e9d5ff;border-radius:10px}
.tbl-wrap table{min-width:480px}
table{border-collapse:collapse;width:100%;font-size:16px}
.mdbody th,.mdbody td{padding:11px 16px;text-align:left;border-bottom:1px solid #e9d5ff;vertical-align:top;line-height:1.6}
.mdbody thead th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;font-weight:700;font-size:15px;white-space:nowrap}
.mdbody tbody tr:nth-child(even) td{background:#faf5ff}
.mdbody tbody tr:last-child td{border-bottom:none}
/* 图块（v2.1 图文同流） */
.fig-block{background:#f8f7ff;border:1px solid #ddd6fe;border-radius:12px;padding:14px 16px;margin:0 0 14px}
.fig-placeholder{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fbfafd;border:1.6px dashed #c4b5fd;border-radius:12px;padding:12px 16px;margin:0 0 14px}
.fig-img{background:#f8f7ff;border:1px solid #ddd6fe;border-radius:12px;padding:10px 12px;margin:0 0 14px;text-align:center}
.fig-img img{max-width:100%;height:auto;border-radius:8px}
.fig-img figcaption{font-size:12px;color:#64748b;margin-top:6px;line-height:1.5}
.mdbody .inline-img{max-width:100%;height:auto;vertical-align:middle;border-radius:6px;margin:0 2px}
.mdbody .img-bad{display:inline-block;background:#fef2f2;border:1px dashed #ef4444;color:#b91c1c;font-size:13px;padding:1px 8px;border-radius:6px}
.fig-placeholder .fp-num{background:#7c3aed;color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.fig-placeholder .fp-type{background:#ede9fe;color:#6d28d9;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.fig-placeholder .fp-alt{color:#334155;font-size:14px;flex:1 1 auto;min-width:120px}
.fig-placeholder .fp-note{color:#94a3b8;font-size:12px;white-space:nowrap;border:1px dashed #cbd5e1;border-radius:6px;padding:2px 8px}
.fig-title{font-size:13px;font-weight:700;color:#4f46e5;text-align:center;margin-bottom:10px}
.fig-body{overflow-x:auto}
.fig-body svg{display:block;margin:0 auto;height:auto}
.fig-caption{font-size:12px;color:#6b7280;text-align:center;margin-top:10px;font-style:italic}
/* 手绘图 CSS 类（兼容） */
.compare-tbl{width:100%;border-collapse:collapse;font-size:13px}
.compare-tbl th{padding:9px 12px;font-weight:700;font-size:12px;text-align:center}
.compare-tbl td{padding:8px 12px;border:1px solid #e2e8f0;font-size:13px;vertical-align:top;line-height:1.5}
.compare-tbl tr:nth-child(even) td{background:#faf9ff}
.flow-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.flow-node{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;text-align:center;min-width:80px}
.flow-node.light{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#4338ca}
.flow-node.green{background:linear-gradient(135deg,#06d6a0,#059669);color:#fff}
.flow-arrow{color:#a78bfa;font-size:18px;font-weight:700;flex-shrink:0}
.cycle-wrap{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.cycle-step{display:flex;flex-direction:column;align-items:center;gap:4px}
.cycle-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.cycle-label{font-size:11px;color:#374151;text-align:center;max-width:70px;line-height:1.3}
.cycle-arrow{color:#a78bfa;font-size:16px;align-self:flex-start;margin-top:6px}
.stair-wrap{display:flex;align-items:flex-end;gap:8px;padding:8px 0;justify-content:center;flex-wrap:wrap}
.stair-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.stair-bar{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:6px 6px 0 0;width:80px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;padding:4px}
.stair-label{font-size:11px;color:#374151;text-align:center;max-width:80px;line-height:1.3}

/* 域尾提示卡 */
.tips-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tips-card .tc-title{font-size:15px;font-weight:700;margin-bottom:10px;color:#374151}
.tips-card table{font-size:14px}
.tips-card th{padding:9px 12px;font-size:13px}
.tips-card td{padding:9px 12px;font-size:14px;line-height:1.6}

/* ===== 章末练习 quiz-box（模块 10） ===== */
.quiz-box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:18px 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);scroll-margin-top:78px}
.quiz-hdr{display:flex;align-items:baseline;gap:14px;font-size:18px;font-weight:700;color:#374151;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}
.quiz-score{font-size:14px;font-weight:700;color:#4f46e5;margin-left:auto;white-space:nowrap}
.qi{border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.qi.done{background:#fafafa}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qbadge{background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:700}
.qtype{font-size:11px;border-radius:12px;padding:1px 9px;font-weight:600}
.qtype-s{background:#e0f2fe;color:#0369a1}
.qtype-m{background:#fce7f3;color:#be185d}
.qstem{font-size:16px;color:#1e293b;margin-bottom:10px;line-height:1.8}
.qstem code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{background:#fff;border:1.5px solid #e2e8f0;border-radius:9px;padding:11px 14px;font-size:15.5px;color:#374151;cursor:pointer;transition:.15s;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:#a78bfa}
.opt .ol{font-weight:700;color:#4f46e5;flex-shrink:0}
.opt.sel{border-color:#4f46e5;background:#ede9fe}
.opt.cor{border-color:#16a34a;background:#dcfce7}
.opt.wrg{border-color:#dc2626;background:#fee2e2}
.opt.shc{border-color:#16a34a;background:#f0fdf4}
.qi.done .opt{cursor:default;pointer-events:none}
.qrow{margin-top:10px;display:flex;align-items:center;gap:12px}
.qbtn{background:#4f46e5;color:#fff;font-size:12px;font-weight:600;border:none;border-radius:7px;padding:7px 18px;cursor:pointer;transition:.15s}
.qbtn:hover{background:#4338ca}
.qbtn:disabled{background:#cbd5e1;cursor:default}
.qres{display:none;flex:1;border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.7}
.qres.ok{background:#dcfce7;color:#15803d}
.qres.err{background:#fee2e2;color:#b91c1c}
.qres.na{background:#fef3c7;color:#b45309}
.qres.show{display:block}
/* 长串防溢出：overflow-wrap:anywhere 仅在 token 放不下时词内断行，普通文本断词行为不变；
   根治 SCP JSON/ARN 等不可断长串撑破移动端面板（SAP-C02 实测 sw=448→390） */
.mdbody,.quiz-box,.qi,.qstem,.opts,.opt{overflow-wrap:anywhere}
.qstem code,.opt code{white-space:pre-wrap;word-break:break-all}
.score-box{display:none;text-align:center;background:#f5f3ff;border-radius:10px;padding:22px 16px;margin-top:16px}
.score-box.show{display:block}
.score-num{font-size:32px;font-weight:700;color:#4f46e5;line-height:1.3}
.score-lbl{font-size:13px;color:#6d28d9;margin-top:4px}
.score-box .sb-tip{font-size:12px;color:#64748b;margin-top:8px;line-height:1.7}

.footer{margin-top:26px;padding:18px 10px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:12.5px;text-align:center;line-height:1.9}
.footer a{color:#4f46e5;text-decoration:none}
@media(max-width:768px){.ptbl th,.ptbl td{font-size:13px}.mdbody th,.mdbody td{font-size:13px}}

/* ===== 章面板 v6 布局：左侧常驻目录槽 + 正文列 =====
   三条布局约定：① 正文 #### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点，见下方 .mh3）
   ② 左侧目录两级（节 ▸ 知识点，单开手风琴 + 滚动自动跟读）③ 左右两侧任何分辨率留白，目录常驻不遮正文：
   ≥1200px：.panel 栅格 [236px 目录槽 | 正文列]，目录 sticky 常驻；<1200px：目录槽变左侧抽屉（☰+遮罩）。 */
body.chapView .wrap{max-width:1420px}
.panel{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start;margin-bottom:14px}
.ch-side{position:sticky;top:14px;min-width:0;z-index:30}
.side-close{display:none}
.toc-open-btn{display:none}
.side-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:85;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.side-mask.show{opacity:1;visibility:visible}
.ch-toc{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 6px 24px rgba(15,23,42,.06);overflow:hidden}
.ch-toc .toc-hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;border-bottom:1px solid #f1f5f9}
.ch-toc .th-title{font-size:13px;font-weight:800;color:#4f46e5;white-space:nowrap}
.ch-toc .th-meta{font-size:11px;color:#94a3b8;font-weight:600;white-space:nowrap}
.ch-toc .toc-body{max-height:calc(100vh - 46px);overflow-y:auto;padding:8px}
.toc-list{list-style:none;margin:0;padding:0}
.toc-list a{display:flex;align-items:baseline;gap:6px;padding:5px 6px;border-radius:7px;color:#475569;text-decoration:none;line-height:1.45;font-size:13px;transition:.12s}
.toc-list a:hover{background:#f5f3ff;color:#4f46e5}
.toc-list a.act{background:#ede9fe;color:#3730a3;font-weight:600}
.toc-list .tl-id{font-size:11.5px;font-weight:700;color:#a78bfa;flex-shrink:0;font-variant-numeric:tabular-nums}
.toc-list a.act .tl-id{color:#4f46e5}
.toc-t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toc-sec>a.toc-sec-link{font-weight:600;color:#334155;padding-top:6px;padding-bottom:6px}
.toc-sec>a .toc-ar{margin-left:auto;flex-shrink:0;font-size:9px;color:#94a3b8;transition:transform .18s}
.toc-sec.open>a .toc-ar{transform:rotate(90deg);color:#4f46e5}
.toc-sub{list-style:none;margin:0;padding:0 0 3px;display:none}
.toc-sec.open>.toc-sub{display:block}
.toc-sub a{padding:3px 6px 3px 20px;font-size:12.5px;color:#64748b;line-height:1.4}
.toc-sub a .tl-id{font-size:11px;color:#c4b5fd}
/* 目录尾【本章练习】入口（v6.2 新增）：独立条目，虚线分隔，点击滚到章末练习区 #quiz-dX */
.toc-quiz{margin-top:7px;padding-top:3px;border-top:1px dashed #ddd6fe}
.toc-quiz>a.toc-quiz-link{font-weight:700;color:#6d28d9;padding-top:6px;padding-bottom:6px}

// 题库数据注入区（构建系统自动注入，含考试元信息与题目全集，勿手改）
const QUIZ_META = {"exam":"SAP-C03","title":"AWS Certified Solutions Architect - Professional 题库","lang":"zh","updated":"2026-11-18","domains":{"1":"设计和实施专为云构建的架构","2":"安全性、合规性和监管","3":"成本优化型架构设计","4":"韧性、迁移和业务连续性","5":"卓越运营和自动化"},"weights":{"1":"25","2":"25","3":"15","4":"15","5":"20"},"examParams":{"count":75,"scored":65,"minutes":180,"pass":720},"footerNote":"题库来源：按 AWS SAP-C03 官方考纲（5 域 / 21 任务 / 115 技能点）自建命题，共 140 题；以 AWS 官方文档与 Exam Guide 为准；域按官方 25/25/15/15/20 划分","version":"v0.1（题库 140 题 · 样题 10 + 铺量 130）"};
const QUIZ_QUESTIONS = [{"id":"D1-001","d":1,"t":"single","q":"某电商平台的订单创建后要触发扣库存、发通知、更新报表三个下游动作。要求同一订单的事件严格按顺序处理，消费失败可重试且不能重复扣减。哪种消息方案最合适","o":[{"l":"A","t":"用标准 SQS 队列让多个消费者并发处理，靠应用层加锁保证顺序"},{"l":"B","t":"用 SQS FIFO 队列以订单号作 MessageGroupId，配合消费端按订单号幂等去重"},{"l":"C","t":"用 SNS 主题广播，每个下游各订阅一个队列，靠 SNS 自身保证处理顺序"},{"l":"D","t":"用 EventBridge 规则直接调用 Lambda，靠 Lambda 的并发控制保证顺序"}],"a":["B"],"e":"✅ 正确项：B。SQS FIFO 以 MessageGroupId 分区，同组消息严格按序投递，配合消费端按订单号幂等去重，正好满足同订单有序且不重复扣减。关联考点：域 1.1.1「设计事件驱动架构与消息传递模式」。\n\n❌ A：标准队列是尽力排序、多消费者并发，无法保证严格顺序，靠应用层加锁既脆弱又添复杂度。\n❌ C：SNS 是发布订阅广播，不保证跨订阅者的处理顺序，顺序语义不在 SNS 这一层。\n❌ D：EventBridge 规则触发 Lambda 是并发执行，本身不提供严格顺序保证。\n\n📌 关键概念：要顺序就想到 FIFO 的 MessageGroupId 分区，要不重复就想到消费端幂等，两者配合才完整。","s":"自编·1.1.1"},{"id":"D1-002","d":1,"t":"multiple","q":"一家公司多个业务单元共用 AWS Organization，各自要调用 Amazon Bedrock 构建生成式 AI 应用。架构师设计多账户部署模式，哪些做法是合理的（选所有适用项）","o":[{"l":"A","t":"通过 IAM 角色与权限边界控制各账户可访问的模型范围"},{"l":"B","t":"所有负载一律放开调用，不需要任何权限与成本约束"},{"l":"C","t":"预置容量只适合无法预测的场景，稳定负载不该使用"},{"l":"D","t":"各业务账户独立调用 Bedrock，模型访问与配额各自管理，边界清晰"},{"l":"E","t":"用标签与成本分摊按业务单元归集 Bedrock 用量"}],"a":["A","D","E"],"e":"✅ 正确项：A、D、E。多账户模式下各账户可独立调用 Bedrock 保持隔离，用 IAM 角色与权限边界约束可访问模型，用标签归集成本，都是可行做法。关联考点：域 1.2.1「为应用设计生成式 AI 集成与多账户部署」。\n\n❌ B：完全放开调用会让权限与成本失控，与多账户治理目标相反。\n❌ C：预置容量适合可预测的持续需求，说它只适合不可预测场景是把适用条件讲反了。\n\n📌 关键概念：GenAI 多账户部署的核心是隔离、可控、可归属，靠 IAM 与标签实现，而不是彻底放开或共享凭证。","s":"自编·1.2.1"},{"id":"D1-003","d":1,"t":"single","q":"Fabrikam 的电商应用准备改造成实例可随时替换、可横向扩容。会话要求毫秒级读写且丢失后可自动重建，商品图片属大对象，订单这类业务状态要持久保存。状态外置怎么配最合适","o":[{"l":"A","t":"会话与业务状态都存实例本地盘，扩容时用脚本逐台同步拷贝"},{"l":"B","t":"会话与业务状态存 RDS 每请求查库读写，图片放单实例 EBS 卷"},{"l":"C","t":"会话放 ElastiCache，业务状态放 DynamoDB，图片放 S3"},{"l":"D","t":"状态序列化进 Cookie 随请求往返客户端"}],"a":["C"],"e":"✅ 正确项：C。状态外置按状态类型配去处：会话要亚毫秒且能重建，放 ElastiCache；订单这类业务状态要毫秒级读写与持久，放 DynamoDB；图片大对象放 S3 便宜且天然持久，计算层因此可随意替换与横向扩容。关联考点：域 1.1.2「设计无状态应用，使用外部化状态管理」。\n\n❌ A：本地盘存状态与「实例随时替换」直接冲突，脚本逐台同步拷贝既慢又易丢状态，是无状态改造要消灭的形态。\n❌ B：会话每请求都查 RDS 会把库拖垮，毫秒级响应靠内存层；EBS 卷只挂单个实例，谈不上多实例共享状态。\n❌ D：Cookie 的容量与安全边界都装不下会话与业务状态，还放大请求体积并引入篡改风险。\n\n📌 关键概念：无状态不是没有状态，是状态外置——会话进缓存、结构化状态进 DynamoDB、大对象进 S3，丢了能重建的才敢放缓存。","s":"自编·1.1.2"},{"id":"D1-004","d":1,"t":"single","q":"Contoso 要把设备日志从自管虚拟机批处理改成无服务器管道：日志持续流入、先做轻量清洗再支持即席 SQL 分析，不想运维任何服务器。哪个组合最合适","o":[{"l":"A","t":"Kinesis Data Streams 收流，Lambda 按事件轻清洗落 S3，Glue Data Catalog 登记表，Athena 即席查询"},{"l":"B","t":"EMR 常驻集群跑 Spark，全链在集群内闭环"},{"l":"C","t":"日志写入 RDS，报表用 SQL 直接查库"},{"l":"D","t":"Glue 作业逐条实时处理每条日志并即时返回"}],"a":["A"],"e":"✅ 正确项：A。无服务器管道四环各管一段：Kinesis Data Streams 收实时流，Lambda 按事件触发做轻清洗落 S3，Glue Data Catalog 给数据建表元数据，Athena 按需对 S3 跑 SQL，摄入到查询全程零服务器运维。关联考点：域 1.1.3「设计无服务器数据处理与分析管道」。\n\n❌ B：EMR 是常驻大数据集群，控制面与节点都要人管，与「不想管服务器」的约束相反，它是稳定大流量重型 ETL 的去处。\n❌ C：半结构化海量日志塞 RDS，写入模型与存储成本都不匹配，且 RDS 常驻更谈不上无服务器。\n❌ D：Glue 是面向批的 ETL 引擎，按作业跑而不是逐条实时处理，拿它扛持续日志流是形态错配。\n\n📌 关键概念：无服务器管道等于托管摄入加轻转换加托管目录加按需查询；Athena 按扫描计费，大表要靠分区与压缩控费。","s":"自编·1.1.3"},{"id":"D1-005","d":1,"t":"single","q":"Fabrikam 的采购审批流程要跨三个工作日，含两级人工审批，中途系统重启或断电后必须从断点继续而不是整条重跑。选哪种执行形态","o":[{"l":"A","t":"用一个 Lambda 函数同步串完所有环节，失败后整条重跑"},{"l":"B","t":"Step Functions 标准工作流串起流程，人工环节用回调挂起"},{"l":"C","t":"Step Functions 快速工作流跑全程，速度优先"},{"l":"D","t":"常驻容器里跑审批脚本，状态存容器内存"}],"a":["B"],"e":"✅ 正确项：B。标准工作流的状态由引擎持久化，单次执行最长可跑一年，人工审批环节用回调挂起等待答复，系统重启后从最近一步恢复，断点续跑由引擎保证，正对跨天带审批的长流程。关联考点：域 1.1.4「设计具有持久执行模式的多步骤工作流」。\n\n❌ A：单函数同步硬扛跨天流程，十五分钟执行上限直接封死，失败整条重跑也没有断点概念。\n❌ C：快速工作流为毫秒级高频短任务设计，单次执行上限五分钟，跨三天的流程必挂。\n❌ D：容器内存态在重启即丢，持久执行靠引擎或外部检查点，不是常驻脚本能扛的。\n\n📌 关键概念：持久执行等于状态引擎化——标准工作流管长事务与人工环节，快速工作流管高频短任务，Lambda 加外部检查点是轻量替代。","s":"自编·1.1.4"},{"id":"D1-006","d":1,"t":"single","q":"Contoso 多个业务账号要向中心安全账号投递安全事件统一消费，另有一个海外区域的事件也要汇总到总部区域。事件路由怎么配","o":[{"l":"A","t":"各业务账号直接把事件写进安全账号的 S3 桶留痕"},{"l":"B","t":"各账号自建事件总线，安全账号定时轮询拉取"},{"l":"C","t":"事件全部发到一个 SNS 主题，各账号自行订阅"},{"l":"D","t":"安全账号总线授权成员账号投递，海外区域事件经转发汇到总部区域总线"}],"a":["D"],"e":"✅ 正确项：D。跨账户路由先授权后投递：目标账户总线用资源策略放行成员账号的 PutEvents，来源账号规则再把事件投过去；跨区域汇总靠各区域总线把事件转发到中心区域总线统一消费，两个需求各对一路。关联考点：域 1.1.5「实现跨账户和跨区域的事件路由模式」。\n\n❌ A：直写 S3 桶不是事件总线路由形态，没有规则过滤、目标编排与投递保障，权限模型也不对。\n❌ B：EventBridge 是推送式投递，没有轮询拉取模式，自造轮询既慢又贵还容易漏。\n❌ C：SNS 能扇出订阅，但跨账户集中治理、按规则路由与区域汇总都是总线层职责，SNS 顶不上。\n\n📌 关键概念：跨账户授权用 put-permission，跨区域用转发汇中心；单向够用就别配回环，事件风暴时回环会放大。","s":"自编·1.1.5"},{"id":"D1-007","d":1,"t":"single","q":"Tailspin 团队有多年 Kubernetes 经验，重度依赖 Operator 与 Helm 生态；另一组边缘无状态服务负载中等，团队不想管任何节点。容器编排怎么选","o":[{"l":"A","t":"全部服务迁 ECS 自管集群，弃用 Kubernetes 生态"},{"l":"B","t":"全部服务自管 EC2 上的 Kubernetes 集群"},{"l":"C","t":"Kubernetes 依赖的服务上 EKS，边缘无状态服务用 ECS 加 Fargate"},{"l":"D","t":"边缘服务改写成 Lambda 函数跑"}],"a":["C"],"e":"✅ 正确项：C。编排按团队基因与运维胃口分层：重度依赖 Operator 与 Helm 的服务上 EKS 吃 Kubernetes 生态；边缘无状态、负载中等且不想管节点的服务用 ECS 加 Fargate，节点层全部托管，两种形态并存按需取用。关联考点：域 1.1.6「使用托管服务设计微服务的容器编排」。\n\n❌ A：团队经验与生态依赖被强行作废，Operator 这类存量资产全要重写，迁移代价最大。\n❌ B：全量自管集群等于控制面与节点运维全自己扛，边缘服务那点负载根本不需要这么重的形态。\n❌ D：为迁形态改写业务，长连接与运行特征对不上 Lambda，改造成本与收益倒挂。\n\n📌 关键概念：EKS 吃 K8s 生态、ECS 轻量原生、Fargate 连节点都托管；大型常驻或特殊内核需求才考虑自管节点池。","s":"自编·1.1.6"},{"id":"D1-008","d":1,"t":"single","q":"Fabrikam 的结算与账单服务分居两个 VPC，要求服务间调用统一鉴权、灰度切流与流量观测，且不想改造应用代码。哪种方案最合适","o":[{"l":"A","t":"在两个服务的代码里自实现双向 TLS 与调用链埋点"},{"l":"B","t":"两服务迁入同一 VPC，靠安全组互通"},{"l":"C","t":"VPC Lattice 服务网络连通，IAM 策略鉴权，灰度在网格层切流"},{"l":"D","t":"API Gateway 给两服务间调用做统一门面"}],"a":["C"],"e":"✅ 正确项：C。VPC Lattice 把服务间连接、安全与观测下沉到基础设施层：服务按逻辑名互调、跨 VPC 可达，访问靠 IAM 策略控制，灰度切流在网格层配，成功率与时延在网格层统一采集，应用代码零改造。关联考点：域 1.1.7「设计服务网格架构，促进微服务通信与可观测性」。\n\n❌ A：在业务代码里自实现双向 TLS 与埋点，正是网格要下沉掉的负担，两个服务同步改造还容易漏。\n❌ B：合并 VPC 治标不治本，统一鉴权、灰度与流量观测一层都没解决，跨 VPC 约束也没了。\n❌ D：API Gateway 是对外的 API 门面，管南北向入口，不是服务间东西向调用的网格治理层。\n\n📌 关键概念：服务网格的价值是应用零改造拿到连接、安全、观测三件事；跨 VPC 场景 VPC Lattice 是托管正解。","s":"自编·1.1.7"},{"id":"D1-009","d":1,"t":"single","q":"Contoso 每天构建几十个容器镜像版本，仓库存储持续膨胀，安全团队要求高危漏洞镜像不能进生产。ECR 镜像治理怎么配","o":[{"l":"A","t":"关闭自动扫描省成本，上线前人工核对漏洞清单"},{"l":"B","t":"开启推送即扫，发布管道对高危设门禁，生命周期策略保最近若干标签并排除生产在用标签"},{"l":"C","t":"生命周期策略保留全部带标签镜像三年"},{"l":"D","t":"定期手工登录控制台逐个删除旧镜像"}],"a":["B"],"e":"✅ 正确项：B。镜像治理三件一起配：推送即扫让每个镜像漏洞按严重度可见；发布管道对高危漏洞设门禁，修完再放行；生命周期策略按保留最近若干标签自动清理旧镜像，且把生产在用标签排除在清理之外，风险与仓库体积一起控住。关联考点：域 1.1.8「通过配置安全扫描和生命周期策略管理容器镜像」。\n\n❌ A：关掉扫描等于让漏洞镜像裸奔，人工核对清单既慢又不可持续，高危拦截形同虚设。\n❌ C：全部镜像保留三年，存储费随构建频率线性膨胀，与治理初衷相反。\n❌ D：手工逐个删镜像易误删生产标签，也不可持续，清理本来就该交给自动策略。\n\n📌 关键概念：镜像治理三件套是推送扫描、管道门禁、生命周期清理；清理可以大胆配，但生产标签必须豁免。","s":"自编·1.1.8"},{"id":"D1-010","d":1,"t":"multiple","q":"Contoso 的行情查询系统盘前流量是收盘后的十倍，架构是 Lambda 加 EKS 混合。为应对这种早晚差十倍的流量，哪些做法合理（选所有适用项）","o":[{"l":"A","t":"把关键 Lambda 函数全部预留并发到账户上限"},{"l":"B","t":"EKS 用 HPA 按查询速率调 Pod，配 Cluster Autoscaler 补节点"},{"l":"C","t":"把缩容等待期拉长，收盘后缓慢回落"},{"l":"D","t":"账户 Lambda 并发上限留余量，超发流量进队列削峰"},{"l":"E","t":"高峰一到就把 Pod 数手工固定，收盘后再手工改回"}],"a":["B","C","D"],"e":"✅ 正确项：B、C、D。多层扩缩各管一层：HPA 按指标调 Pod、Cluster Autoscaler 补节点，两层都配才不会出现排不下的 Pod；缩容等待期拉长防抖动，收盘后缓慢回落；账户并发上限留余量并用队列削峰，超发流量不直接打死函数。关联考点：域 1.1.9「为无服务器和容器化工作负载设计自动扩缩容模式」。\n\n❌ A：预留并发是资源抢占，全预留等于没有弹性池，给关键函数打底即可，讲义明确要克制。\n❌ E：高峰手工固定 Pod 数、收盘手工改回，既丢弹性也不防抖，等于退回人肉运维。\n\n📌 关键概念：扩缩容口诀是扩快缩慢防抖动、并发留余量、Pod 与节点两层分治、突发流量靠队列削峰。","s":"自编·1.1.9"},{"id":"D1-011","d":1,"t":"single","q":"Fabrikam 对外开放 API 需要密钥管理与限流，内部 HTTP 微服务要按路径分流，另有一条私有 TCP 长连接要求静态 IP。入口层怎么配","o":[{"l":"A","t":"三类流量统一走一个 NLB 四层直通"},{"l":"B","t":"对外与内部都直接暴露 ALB，限流各自在应用里写"},{"l":"C","t":"全部入口收进一个 API Gateway 统一治理"},{"l":"D","t":"对外走 API Gateway 管密钥限流，内部 ALB 按路径分流，TCP 长连接用 NLB"}],"a":["D"],"e":"✅ 正确项：D。入口按流量形态分工：对外 API 要治理，密钥、限流、版本、计费在门口统一做完，走 API Gateway；内部 HTTP 微服务按路径与主机头分流是 ALB 的地盘；私有 TCP 长连接要静态 IP 与四层直通，归 NLB，三者各就各位。关联考点：域 1.1.10「设计入口流量模式，针对特定使用模式优化资源」。\n\n❌ A：NLB 看不懂 HTTP 路径与主机头，更做不了 API 密钥与限流治理，三类流量一锅端必然顾此失彼。\n❌ B：内部服务直接暴露 ALB 且限流靠应用自写，治理分散难审计，对外应有的密钥管理也没有。\n❌ C：API Gateway 是 API 门面，不是内部微服务分流器，也接不了私有 TCP 长连接。\n\n📌 关键概念：常见组合是 API Gateway 接外部、ALB 转内部；选型看协议层次与治理需求，NLB 只管四层静态 IP。","s":"自编·1.1.10"},{"id":"D1-012","d":1,"t":"single","q":"Contoso 全球营销站点要全球加速：静态资源就近命中，URL 改写与请求头规范这类小逻辑贴节点跑，按地理位置分流落地页这层较重逻辑放区域边缘。边缘架构怎么配","o":[{"l":"A","t":"URL 改写与地理分流都塞进 Lambda@Edge 跑"},{"l":"B","t":"静态资源不做缓存，每个请求都回源站取"},{"l":"C","t":"静态内容走 CDN 缓存，URL 改写用 CloudFront Functions，地理分流交给 Lambda@Edge"},{"l":"D","t":"把实时库存查询也缓存到边缘节点提升命中率"}],"a":["C"],"e":"✅ 正确项：C。边缘三层分工：静态内容走 CDN 缓存就近命中不回源；URL 改写与请求头规范是纳秒级轻逻辑，用 CloudFront Functions 在节点完成；按地理位置分流要算力，交给 Lambda@Edge 在区域边缘跑，首字节时延从跨洲回源压到近端命中。关联考点：域 1.1.11「设计边缘架构以满足时延要求」。\n\n❌ A：轻逻辑塞进 Lambda@Edge，冷启动与执行成本被放大，这类活 CloudFront Functions 干得又快又便宜。\n❌ B：放弃边缘缓存等于每个请求都跨洲回源，全球时延目标直接破产。\n❌ D：实时库存这类必须新鲜的数据不能推边缘缓存，过期窗口会卖出对不上的库存。\n\n📌 关键概念：边缘定位是缓存贴节点、轻逻辑贴边缘函数、重逻辑回源；新鲜度敏感的数据不进缓存。","s":"自编·1.1.11"},{"id":"D1-013","d":1,"t":"single","q":"Fabrikam 的协作看板要双向实时：客户端操作要广播给同房间其他端，服务端有变更也要主动推给在线客户端。选哪种实时通道最合适","o":[{"l":"A","t":"客户端定时轮询 REST 接口拉取增量"},{"l":"B","t":"API Gateway 的 WebSocket API：上行按路由键进后端，服务端拿连接 ID 主动回推"},{"l":"C","t":"SNS 主题广播，各客户端自行订阅"},{"l":"D","t":"客户端写 Kinesis，服务端消费后再回写"}],"a":["B"],"e":"✅ 正确项：B。WebSocket 是全双工长连接，两端可互推：API Gateway 的 WebSocket API 托管握手与保活，给每个连接发连接 ID；客户端上行按路由键进对应后端处理，服务端变更拿连接 ID 经网关主动回推，双向通道一次打通。关联考点：域 1.1.12「设计支持实时数据处理的架构，使用 WebSocket 和发布订阅模式」。\n\n❌ A：轮询的时延与空转成本都与双向高频推送的需求相反，协作场景下操作同步明显滞后。\n❌ C：SNS 面向队列、邮箱这类订阅端点做单向扇出，不是浏览器双向会话通道。\n❌ D：Kinesis 管流摄入与下游消费，不提供向客户端回推的通道，方向就反了。\n\n📌 关键概念：WebSocket 的三件托管事是连接管理、路由键分发、连接 ID 回推；单向广播用扇出订阅更省。","s":"自编·1.1.12"},{"id":"D1-014","d":1,"t":"multiple","q":"Contoso 的 SaaS 平台服务多档客户，既要控制成本，又要保证租户数据绝不串。哪些做法符合多租户隔离设计（选所有适用项）","o":[{"l":"A","t":"合规要求物理隔离的银行客户用独享账户栈部署"},{"l":"B","t":"共享池全混布，不引入租户上下文，靠应用代码自查数据归属"},{"l":"C","t":"Cognito 把租户上下文写进令牌，从网关贯穿到数据库"},{"l":"D","t":"共享池数据表配行级安全，查询天然只回本租户的行"},{"l":"E","t":"共享池不设配额与限流，租户之间自由竞争资源"}],"a":["A","C","D"],"e":"✅ 正确项：A、C、D。隔离按档位配强度：合规要物理隔离的大客户独享账户栈，隔离最强；共享池摊成本的前提是租户上下文贯穿全层——Cognito 把租户上下文写进令牌、请求自带归属，行级安全让查询只回本租户的行，层层咬合数据才不串。关联考点：域 1.1.13「设计多租户架构，使用租户隔离模式」。\n\n❌ B：不引入租户上下文靠应用自查，漏一层就串数据，是共享池里最危险的做法。\n❌ E：不设配额与限流，噪音邻居会抢光共享资源，中小租户体验互相拖累。\n\n📌 关键概念：独享到共享是成本与隔离强度的谱系；共享必须让租户上下文贯穿资源、身份、数据、加密每一层。","s":"自编·1.1.13"},{"id":"D1-015","d":1,"t":"single","q":"Fabrikam 要做差旅助手：自动查差旅政策、调内部比价工具、必要时替员工下单。哪种智能体架构设计最合理","o":[{"l":"A","t":"单轮问答式直调大模型，比价与下单让员工自己完成"},{"l":"B","t":"给智能体开放全部内部系统权限，能力越全越好"},{"l":"C","t":"下单失败时让智能体自主无限重试直到成功"},{"l":"D","t":"用 Bedrock AgentCore 托管运行时，工具只授权政策检索、比价、下单三项，下单超时转人工工单"}],"a":["D"],"e":"✅ 正确项：D。差旅助手是要动态决定下一步的多步任务，适合智能体形态：AgentCore 托管运行时管会话、状态与记忆；工具权限收敛到任务必需的三样；下单这类高风险动作超时转人工工单降级，不给自主无限重试的机会。关联考点：域 1.2.2「设计与工具集成的 AI 智能体架构」。\n\n❌ A：单轮直调模型只适合翻译摘要这类一问一答，查库算价下单要多步决策，套不进去。\n❌ B：工具越多决策越乱，权限全开放大误操作半径，讲义明确要收敛到必需集。\n❌ C：无限重试没有失败回退，既烧钱又拖垮下游，上线前必须定义降级路径。\n\n📌 关键概念：智能体四件是运行时、工具、知识、身份治理；安全上线靠权限收敛与失败降级两道闸。","s":"自编·1.2.2"},{"id":"D1-016","d":1,"t":"single","q":"Contoso 的风控评分模型三类负载：白天在线请求要低时延、夜间对存量用户全量重评分是离线大吞吐、另有小流量实验模型要最省成本。推理形态怎么配","o":[{"l":"A","t":"白天走常驻实时终端节点，夜间用批量转换，实验模型用无服务器推理"},{"l":"B","t":"三类负载全压在一个常驻实时终端节点上"},{"l":"C","t":"全部攒批处理，白天在线请求排队等批"},{"l":"D","t":"三类都上无服务器推理，统一按请求计费"}],"a":["A"],"e":"✅ 正确项：A。推理三态按时延与流量配：在线低时延走常驻实时终端节点，扩缩容跟请求指标；夜间存量全量评分是离线大吞吐，批量转换跑完即收不占常驻；小流量实验模型用无服务器推理，按请求计费零常驻，验证后再升常驻。关联考点：域 1.2.3「设计 ML 推理架构」。\n\n❌ B：批量与实验负载全压常驻端点，闲置时段照样烧钱，三种成本形态错配成一种。\n❌ C：白天在线请求排队等批，低时延目标直接破产，在线与离线不能混一条路径。\n❌ D：无服务器推理的冷启动在流量尖峰顶不住在线时延要求，它只适合中低流量场景。\n\n📌 关键概念：实时端点管在线低时延、批量转换管离线大吞吐、无服务器管中低流量；扩缩容还要考虑模型加载时间。","s":"自编·1.2.3"},{"id":"D1-017","d":1,"t":"single","q":"Fabrikam 要做制度问答助手：几万篇公司制度文档、答案要注明出处、不同部门只能看到自己权限内的制度。RAG 设计里哪项做法最关键","o":[{"l":"A","t":"把全部文档整篇塞进模型上下文"},{"l":"B","t":"切块切得越大越好，上下文信息更完整"},{"l":"C","t":"权限过滤前置到检索层：先按部门元数据过滤，再相似度取回"},{"l":"D","t":"权限检查放在生成之后，输出前删掉越权内容"}],"a":["C"],"e":"✅ 正确项：C。RAG 的权限必须前置到检索层：先按部门元数据过滤候选片段，再做相似度取回，用户只见自己有权限的片段；几万篇文档靠切块加向量检索控制上下文长度，答案再注明来源章节，规模与合规一次满足。关联考点：域 1.2.4「设计 RAG 架构，包括摄取与检索策略」。\n\n❌ A：整篇塞上下文装不下几万篇文档，成本失控，也丢掉了检索增强的本意。\n❌ B：切块太大检索不准，语义命中漂移；块的大小是精度参数，不是越大越好。\n❌ D：生成后再删越权内容已经晚了，模型在生成时已读到越权文本，泄露面反而扩大。\n\n📌 关键概念：RAG 两段是摄取管切块与向量化、检索管过滤与取回；权限过滤在检索层做完才不越权。","s":"自编·1.2.4"},{"id":"D1-018","d":1,"t":"single","q":"Contoso 的产品知识库每周更新数百篇文档，RAG 管道既要保证知识新鲜又要检索精准。摄取与切块策略怎么配","o":[{"l":"A","t":"每周把全量文档从零重建一遍向量库"},{"l":"B","t":"按文档标题层级切块，带部门与版本元数据，文档变更触发增量更新"},{"l":"C","t":"不切块，整篇文档直接做向量化"},{"l":"D","t":"摄取管道手动触发，想起来才跑一次"}],"a":["B"],"e":"✅ 正确项：B。摄取侧按标题层级切块、带上部门与版本元数据，增量更新由文档变更触发——每周数百篇的更新量靠增量才能跟上新鲜度；检索侧有了元数据才能先过滤再取回，检索精度靠这一层提，比换模型更能见效。关联考点：域 1.2.4「设计 RAG 架构，包括摄取与检索策略」。\n\n❌ A：每周全量重建，算力与时间都浪费在没变的文档上，增量触发才是与更新量匹配的做法。\n❌ C：整篇向量化等于切块过大，检索不准，答案定位漂移到无关章节。\n❌ D：手动想起才跑摄取，新鲜度完全失控，用户会问到还没入库的新制度。\n\n📌 关键概念：切块大小定检索精度，元数据过滤比换模型更能提准，增量摄取按变更触发。","s":"自编·1.2.4"},{"id":"D1-019","d":1,"t":"multiple","q":"Tailspin 机房到 AWS 的主链路走 Direct Connect 专线、承载大带宽稳定流量。为避免链路单点，哪些组合合理（选所有适用项）","o":[{"l":"A","t":"只配一条 DX 专线即可，专线本身很稳定"},{"l":"B","t":"两条 DX 接不同机房路由器，BGP 自动切换"},{"l":"C","t":"专线常态承载，另备两条 VPN 隧道，专线故障时顶上"},{"l":"D","t":"各条链路汇入 Transit Gateway，统一接各 VPC"},{"l":"E","t":"备份链路走同一条物理线路上的逻辑子通道"}],"a":["B","C","D"],"e":"✅ 正确项：B、C、D。混合连接冗余按物理路径算：双专线接不同机房路由器，BGP 自动切换是链路级冗余最彻底的形态；专线加 VPN 备份是成本与冗余的平衡点，常态走专线、故障时 VPN 顶上；各链路汇入 Transit Gateway，任何 VPC 一挂即通所有通道，路由表控分流。关联考点：域 1.3.1「设计提供冗余和故障转移能力的混合连接」。\n\n❌ A：单条专线再稳也是最大单点，链路故障切换有收敛时间，时敏业务要先评估。\n❌ E：备份走同一物理线路的逻辑子通道，线路一断全部跟着断，不构成物理冗余。\n\n📌 关键概念：冗余标配是双 DX 或 DX 加 VPN；BGP 自动切换，TGW 统一汇聚，别让备份共享故障域。","s":"自编·1.3.1"},{"id":"D1-020","d":1,"t":"single","q":"Contoso 机房文件服务器数据要上云：机房程序不能改造、白天还要本地读写体验，夜间做一次全量校验同步，合作伙伴的对账文件要走 SFTP 进云。数据同步怎么配","o":[{"l":"A","t":"白天走 Storage Gateway 文件网关本地缓存，夜间 DataSync 全量校验，伙伴文件经 Transfer Family 的 SFTP 直落 S3"},{"l":"B","t":"全量数据每五分钟跑一次 DataSync 增量，机房程序改读 S3"},{"l":"C","t":"机房程序直接改造为原生调用 S3 API 读写"},{"l":"D","t":"夜间同步任务跑完不配监控，失败第二天自然重跑"}],"a":["A"],"e":"✅ 正确项：A。三件事各归其位：机房程序不能改还要本地读写体验，用 Storage Gateway 文件网关的本地缓存加云端持久层；夜间全量校验是 DataSync 的增量校验搬运；外部伙伴只认 SFTP，Transfer Family 把文件直接收进 S3，账号与密钥托管。关联考点：域 1.3.2「为混合工作负载设计数据同步策略」。\n\n❌ B：程序不能改造是题给硬约束，改读 S3 直接违反；小量高频同步反复起任务也不如网关缓存顺。\n❌ C：同样违反不能改造的约束，改造成本远高于挂一层网关。\n❌ D：同步链路不配监控，静默失败是混合场景最常见的典型事故，数据悄悄不一致很久才暴露。\n\n📌 关键概念：同步三件是搬运用 DataSync、本地读写用网关、SFTP 收口用 Transfer Family；同步链路必须配监控。","s":"自编·1.3.2"},{"id":"D1-021","d":1,"t":"single","q":"Fabrikam 的老计费系统只会发 MQ 消息、输出定长文本报表，新系统要 REST 接口与 JSON。老核心一行不能改。怎么接最合适","o":[{"l":"A","t":"直接改写老计费核心，让它原生支持 REST 与 JSON"},{"l":"B","t":"老系统推倒重写为云原生微服务"},{"l":"C","t":"Amazon MQ 接住老消息桥接进 EventBridge，API Gateway 加 Lambda 做 REST 门面，定长文本由 Lambda 转 JSON"},{"l":"D","t":"搭三层转换链：MQ 转队列、队列转 XML、XML 再转 JSON"}],"a":["C"],"e":"✅ 正确项：C。不动核心的包装三接法一次配齐：Amazon MQ 接住老系统的消息再桥接进 EventBridge；API Gateway 加 Lambda 给老接口包一层对外 REST 门面；定长文本由 Lambda 转成 JSON 给新系统——核心一行没改，新旧两边都接上。关联考点：域 1.3.3「设计集成模式，通过数据转换实现遗留系统现代化」。\n\n❌ A：改写老计费核心直接违反题给约束，风险与工期都是最大。\n❌ B：推倒重写放弃包装缓冲带，迁移风险一次性压上来，与渐进现代化路线相反。\n❌ D：三层转换链层层加码，排障是噩梦，讲义明确能压一层是一层。\n\n📌 关键概念：遗留现代化靠门面、消息桥、格式转换三层包装；包装层同时是将来下线老系统的迁移缓冲带。","s":"自编·1.3.3"},{"id":"D1-022","d":1,"t":"single","q":"Contoso 混合环境里，云上 VPC 要解析机房私有域名，机房也要反查云上私有域，内外同名的域名要给不同答案。混合 DNS 怎么配","o":[{"l":"A","t":"把 VPC 全部查询都转发到机房中心 DNS 统一应答"},{"l":"B","t":"机房与云各自维护独立 DNS，互不联通"},{"l":"C","t":"内外同名域名配同一答案，减少维护两份记录"},{"l":"D","t":"Resolver 出站规则条件转发机房域，入站终端节点应答机房查云，同名域配公有区与私有区分离视域"}],"a":["D"],"e":"✅ 正确项：D。混合 DNS 三件事配齐：出站终端节点加条件转发规则，把机房域名的查询转给机房 DNS，云内域名留在 VPC 默认解析；入站终端节点应答机房对云上私有域的查询；内外同名的域配公有区与私有区分离视域，内外各得其所。关联考点：域 1.3.4「为混合环境设计 DNS 方案」。\n\n❌ A：全量转发把云内解析也绕道机房，VPC 默认解析本来就够快，白白加时延与故障面。\n❌ B：两边 DNS 不互联，云查机房、机房查云的双向需求一个都没解决。\n❌ C：内外同名同答案正是要避免的，分离视域的意义就是按来源给不同答案。\n\n📌 关键概念：Resolver 出站转机房、入站答云上；条件转发只转非云域名；分离视域同名不同答案。","s":"自编·1.3.4"},{"id":"D1-023","d":1,"t":"single","q":"Contoso 有三类本地算力需求：工厂质检要本地推理且数据不许出厂，ERP 集群要复用既有机房硬件统一编排，直播推流只要求大都市低时延。混合计算怎么配","o":[{"l":"A","t":"三种负载全部买 Outposts 整机柜进机房"},{"l":"B","t":"三种负载全部放 Local Zones"},{"l":"C","t":"质检用 Outposts 保数据不出厂，ERP 用 EKS Anywhere 复用既有硬件，直播走 Local Zones 压时延"},{"l":"D","t":"三种负载全部改公有云区域部署"}],"a":["C"],"e":"✅ 正确项：C。混合计算四态各对一类需求：数据不许出厂的合规硬约束用 Outposts 整机柜进机房，云运维本地数据；既有机房硬件要复用并统一编排用 EKS Anywhere；只求大都市低时延、不涉本地合规用 Local Zones，比整机柜便宜得多。关联考点：域 1.3.5「设计混合计算模式」。\n\n❌ A：三种需求一把梭全上 Outposts，时延需求与硬件复用需求都付出整机柜的冤枉钱，选型没分层。\n❌ B：Local Zones 是把云资源放到大都市边缘，数据不出厂这个合规约束它做不到。\n❌ D：公有云区域部署直接违反数据不出厂的要求，合规红线顶死。\n\n📌 关键概念：混合算力先分需求——合规整机柜、已有硬件用 Anywhere、纯时延用 Local Zones。","s":"自编·1.3.5"},{"id":"D1-024","d":1,"t":"single","q":"Fabrikam 三十个 VPC 要互通且路由按生产与测试分段管控；另有一个集中镜像服务要给全组织各账户私网直连，不走公网也不开对等。多 VPC 架构怎么设计","o":[{"l":"A","t":"三十个 VPC 挂 Transit Gateway 星型互联，路由表分段管控；集中镜像服务用 PrivateLink 给各账户私网直连"},{"l":"B","t":"三十个 VPC 两两建对等连接，全网状互通"},{"l":"C","t":"集中镜像服务挂公网端点，靠 IP 白名单限制访问"},{"l":"D","t":"对等可以传递：A 通 B、B 通 C 就能推出 A 通 C，逐段接力组网"}],"a":["A"],"e":"✅ 正确项：A。互通三式各就各位：几十个 VPC 全网状互通上 Transit Gateway 星型架构，任何 VPC 一挂即通，路由表分生产与测试两段控互通；跨账户集中提供共享服务用 PrivateLink，服务方出终端节点、消费方私网直达，免对等也不走公网，天然隔离。关联考点：域 1.4.1「设计提供混合和多账户连接的多 VPC 架构」。\n\n❌ B：对等两两互联，三十个 VPC 要四百多条连接，连接数按平方涨，配置与运维都不可行。\n❌ C：镜像服务挂公网端点靠白名单，暴露面与审计口径都不如私网直达标准。\n❌ D：对等不传递是硬性质，A 通 B、B 通 C 不代表 A 通 C，接力组网思路直接不成立。\n\n📌 关键概念：对等点对点、PrivateLink 服务直达、TGW 星型全网；跨账户共享服务是 PrivateLink 的标准场景。","s":"自编·1.4.1"},{"id":"D1-025","d":1,"t":"single","q":"Contoso 未来三年要新增两百个 VPC，多账户并行开发，历史上已出现两次网段冲突。编址管理与网络分段怎么管","o":[{"l":"A","t":"手工维护网段电子表格，开 VPC 前人工查重"},{"l":"B","t":"上 IPAM 顶层池统一划段，生产测试各领子池，新 VPC 自动领段；分段粒度对齐故障域与权限域"},{"l":"C","t":"全部 VPC 用同一个大网段，靠安全组隔离"},{"l":"D","t":"分段越细越好，每个应用一个独立 VPC"}],"a":["B"],"e":"✅ 正确项：B。账户多、VPC 增长快且已有两次撞段记录，正该上 IPAM：顶层池统一划段，各账户子池领段，新 VPC 自动分配地址，撞段在设计上杜绝；网络分段粒度对齐故障域与权限域，不为细而细。关联考点：域 1.4.2「使用子网策略、IP 地址管理和网络分段设计 VPC 架构」。\n\n❌ A：电子表格人工查重就是撞了两次的老路，两百个 VPC 的规模下迟早再撞。\n❌ C：全部 VPC 同一大网段，网段重叠根本无法路由互通，是设计上的死局。\n❌ D：每应用一个 VPC 粒度过细，每段都有路由与安全组要维护，运维成本爆炸。\n\n📌 关键概念：IPAM 顶层池分账户子池自动领段；公私子网分层；分段粒度对齐故障域与权限域。","s":"自编·1.4.2"},{"id":"D1-026","d":1,"t":"single","q":"Fabrikam 支付 VPC 要多层防护：Web 层防注入与限速、VPC 出网只允许白名单域名、实例按角色最小开端口、全部流量元数据留档备取证。防护怎么配","o":[{"l":"A","t":"只上 WAF 一层，其余靠默认安全组全通"},{"l":"B","t":"全部防护压在网络 ACL 上统一管"},{"l":"C","t":"安全组一律开 0.0.0.0/0 全通，省去维护"},{"l":"D","t":"WAF 挂 ALB 管注入限速，Network Firewall 管出网白名单，安全组按角色最小开端口，Flow Logs 全量入湖备取证"}],"a":["D"],"e":"✅ 正确项：D。防护四层各就各位：WAF 挂 ALB 在应用层挡注入攻击与限速；Network Firewall 在 VPC 边界管出网域名白名单与东西向检查；安全组在实例层按角色最小开端口；Flow Logs 全量记录流量元数据入数据湖备审计取证。关联考点：域 1.4.3「设计网络安全架构，包括流量检查、流量过滤和应用层防护」。\n\n❌ A：一层 WAF 顶不了出网管控、实例端口收敛与取证留痕四个需求，防护是分层的不是一层的。\n❌ B：网络 ACL 是子网级无状态兜底，做不了应用层防护与域名级出网管控这类主力工作。\n❌ C：安全组开全通等于把第一道免费防线拱手送掉，先做对安全组再谈买高级工具。\n\n📌 关键概念：防护四层口诀——WAF 应用、防火墙边界、安全组实例、Flow Logs 观测；第三方检查设备用 GLB 串进路径。","s":"自编·1.4.3"},{"id":"D1-027","d":1,"t":"single","q":"Contoso 的物联网平台上百万终端要从 IPv4 迁 IPv6，要求不停机、存量管理面保留回退路径。迁移怎么走","o":[{"l":"A","t":"第一天就关闭 v4，强制全量终端走 v6"},{"l":"B","t":"v6 出网沿用现有 NAT 网关不动"},{"l":"C","t":"子网补 v6 段、均衡器双栈监听、路由表补 v6 默认路由配 egress-only 出网，双栈期观察流量占比再收敛"},{"l":"D","t":"终端与平台同步做一次性切换"}],"a":["C"],"e":"✅ 正确项：C。双栈迁移四步走：先给 VPC 与子网补 v6 网段，新终端直连 v6；均衡器开双栈监听、安全组与 ACL 放行 v6；路由表补 v6 默认路由，纯出网用 egress-only 网关；双栈期观察流量占比，v4 保留审计通道再逐步收敛，回退路径全程都在。关联考点：域 1.4.4「设计 IPv6 采用和双栈迁移策略」。\n\n❌ A：第一天关 v4 一刀切，丢掉双栈保险期，存量终端一旦不适配就无路可退。\n❌ B：NAT 网关是 v4 概念，v6 出网走 egress-only 网关，费用模型也不同，沿用会把出口设计做错。\n❌ D：终端与平台同步一次性切换，任一侧适配出问题就是全局停机，与不能停机的要求相反。\n\n📌 关键概念：双栈期就是保险期，编址、应用、路由、收敛四步走；v6 出网别套 v4 的 NAT 老路。","s":"自编·1.4.4"},{"id":"D1-028","d":1,"t":"single","q":"Fabrikam 全球交易入口部署两大区域：合作方白名单要求固定 IP、区域故障要秒级切走、新版本要先按 5% 灰度放量。全局流量怎么配","o":[{"l":"A","t":"Global Accelerator 固定入口 IP 接两大区域、区域故障自动摘除，Route 53 加权路由做 5% 灰度"},{"l":"B","t":"全部依赖 Route 53 延迟路由就近分流"},{"l":"C","t":"两区域各买一组弹性 IP，故障时手工改 DNS"},{"l":"D","t":"Global Accelerator 挂上全部入口，包括后台管理页"}],"a":["A"],"e":"✅ 正确项：A。两类工具各用所长：要固定入口 IP 与秒级故障摘除，上 Global Accelerator——固定双 IP、流量走 AWS 骨干、终端组挂健康检查、区域故障自动摘除；灰度放量用 Route 53 加权路由按 5% 切流，观察稳定后再放全量。关联考点：域 1.4.5「为多区域应用设计全局流量路由策略」。\n\n❌ B：纯 DNS 路由给不了固定入口 IP，客户端缓存还会拖慢切换时效，秒级容灾做不到。\n❌ C：手工换 DNS 的弹性 IP 方案既不秒级也不自动，人力值守扛不住故障切换窗口。\n❌ D：Global Accelerator 按流量计费，全入口都挂上去是为低价值流量买单，只保关键入口。\n\n📌 关键概念：DNS 分流用 Route 53 策略、固定 IP 与秒级摘除用 Global Accelerator；时效敏感容灾两者并用。","s":"自编·1.4.5"},{"id":"D1-029","d":1,"t":"single","q":"Contoso 要建湖仓：一份数据多个分析引擎共用、要 ACID 事务与模式演进、财务数据行只有财务团队能读。湖仓怎么设计","o":[{"l":"A","t":"一个大 S3 桶全堆原始数据，各引擎直接扫全量"},{"l":"B","t":"S3 按原始清洗集市分层，Iceberg 建表带事务与模式演进，Lake Formation 管行级权限，Athena 与 Redshift Spectrum 双引擎查同一份数据"},{"l":"C","t":"全部数据先导入 Redshift，再给各引擎查询"},{"l":"D","t":"湖上权限先开放给全组织，治理以后再补"}],"a":["B"],"e":"✅ 正确项：B。湖仓四件一次配齐：S3 按原始、清洗、集市分层，生命周期控成本；Iceberg 开放表格式给湖上数据建表，带 ACID 事务与模式演进；Lake Formation 统一目录与权限，财务行只授权财务团队；Athena 即席查、Redshift Spectrum 用数仓引擎查湖，一份数据多引擎不搬数。关联考点：域 1.5.1「设计数据湖和湖仓架构」。\n\n❌ A：一个大桶全堆原始数据，没分层、没目录、没权限层，这样的湖是沼泽不是湖仓。\n❌ C：全量入 Redshift 再给引擎查，搬数破坏一份数据多引擎共用的初衷，存储费翻倍。\n❌ D：先开放后补治理，越权查询与脏数据会抢在治理之前发生，建湖容易管湖难。\n\n📌 关键概念：湖仓四件是 S3 分层、Iceberg 表、Lake Formation 权限、多引擎查询；没权限层的湖是沼泽。","s":"自编·1.5.1"},{"id":"D1-030","d":1,"t":"single","q":"Fabrikam 销售分析同一条数据流要两个节奏：实时看板监控毛利、隔夜全量对账进数仓；CRM 的 SaaS 数据也要每日同步进来。分析管道怎么配","o":[{"l":"A","t":"全部数据走隔夜批处理，看板次日再看"},{"l":"B","t":"为看板把对账链路也全量实时化，统一一套流处理"},{"l":"C","t":"自建采集服务器每日手工抽取 CRM 数据"},{"l":"D","t":"MSK 收门店事件分流：一路流处理出实时看板，一路落 S3 夜间 EMR 全量对账进 Redshift；CRM 经 AppFlow 每日同步"}],"a":["D"],"e":"✅ 正确项：D。同源双节奏用分流：MSK 托管 Kafka 收门店事件，一路流处理出实时看板监控毛利，一路落 S3 夜间 EMR 全量对账进 Redshift；CRM 这类 SaaS 数据源用 AppFlow 托管搬运每日同步，免自建采集，一套管道双节奏各司其职。关联考点：域 1.5.2「设计实时和批处理分析管道」。\n\n❌ A：全部隔夜批，实时看板需求直接落空，双节奏里实时那一拍没了。\n❌ B：对账本是分钟级需求，为它上全量流处理是为实时硬上流，花冤枉钱还添运维。\n❌ C：CRM 采集自建服务器，AppFlow 就是干这个的托管搬运服务，自建是重复造轮子。\n\n📌 关键概念：流批双节奏各司其职、SaaS 搬运走 AppFlow；先判断需求是秒级还是分钟级，别为实时硬上流。","s":"自编·1.5.2"},{"id":"D1-031","d":1,"t":"single","q":"Contoso 电商三类负载：订单要强事务与关系报表、购物车要高并发毫秒读写扁平结构、夜间大规模聚合分析。数据库怎么选","o":[{"l":"A","t":"订单走 Aurora 保事务与关系报表，购物车走 DynamoDB 毫秒横向扩，夜间聚合进 Redshift"},{"l":"B","t":"三类负载全部用 DynamoDB 统一引擎"},{"l":"C","t":"购物车写进 Aurora 再多挂几个读副本分担"},{"l":"D","t":"夜间分析直接跑在订单事务库上"}],"a":["A"],"e":"✅ 正确项：A。选库三问逐个对：订单要强事务与关系查询，走 Aurora 这类云原生关系引擎；购物车是高并发键值扁平结构，走 DynamoDB 毫秒级任意规模横向扩；夜间大规模聚合分析是列存数仓的地盘，进 Redshift。三类负载三种引擎各不越界。关联考点：域 1.5.3「根据工作负载要求选择适当的数据库服务」。\n\n❌ B：全用 DynamoDB，订单的关系查询与强事务、夜间的聚合分析都不是键值引擎的强项，一刀切选型最省事也最容易错。\n❌ C：购物车这类高并发毫秒键值场景，用关系库加读副本，扩展形态与成本都不如 DynamoDB 合身。\n❌ D：夜间分析直接跑订单库，锁与扫描互相拖垮，分析负载该进数仓而不是事务库。\n\n📌 关键概念：选库三问是访问模式、一致性需求、扩展方式；事务库不跑分析、数仓不跑事务。","s":"自编·1.5.3"},{"id":"D1-032","d":1,"t":"multiple","q":"Fabrikam 的全球订单库要分层高可用：单可用区故障不能停、读压力大要横向扩读、区域级故障要能接棒。哪些做法正确（选所有适用项）","o":[{"l":"A","t":"Multi-AZ 部署保同区热备，秒级换向保可用性"},{"l":"B","t":"读副本横向扩读，区域故障时可提升为主接棒"},{"l":"C","t":"把写流量也分流一部分到读副本分担主库压力"},{"l":"D","t":"Aurora Global Database 跨区域复制，主区故障把读区提升为写区"},{"l":"E","t":"读副本越多越好，一次加到十个"}],"a":["A","B","D"],"e":"✅ 正确项：A、B、D。数据库高可用分三层配：Multi-AZ 同区热备，主备秒级换向，是单可用区故障不停服的底线；读副本横向扩读，跨区副本可提升为主做区域故障接替；Aurora Global Database 做跨区域低延迟复制，主区故障把读区提升为写区，三层对应三个恢复目标。关联考点：域 1.5.4「设计数据库扩缩容方案以提供高可用」。\n\n❌ C：副本是读的，把写流量分给副本，复制方向就错了，写必须落在主库。\n❌ E：副本越多复制滞后越明显，读到旧数据的面越大，按业务可容忍的滞后配数量。\n\n📌 关键概念：Multi-AZ 保可用性不是扩读、读副本扩读、全局库跨区容灾；副本配多少看可容忍滞后。","s":"自编·1.5.4"},{"id":"D1-033","d":1,"t":"single","q":"Tailspin 的混合负载：数据库要高 IOPS 数据盘、多实例应用集群要共享配置目录、Windows 行政区要域内共享盘、网站图片与备份数海量。四类存储怎么配","o":[{"l":"A","t":"四类需求全部用 S3 对象存储统一管理"},{"l":"B","t":"数据库用高 IOPS 档 EBS 卷，共享配置用 EFS，Windows 域共享用 FSx，图片备份进 S3 分层"},{"l":"C","t":"数据库文件放 EFS 共享文件系统，多实例直接读写"},{"l":"D","t":"所有卷一律选最高 IOPS 档位顶配，保证性能"}],"a":["B"],"e":"✅ 正确项：B。存储四类各管一类：数据库数据盘是单实例块存储，用高 IOPS 档 EBS 卷；多实例共享配置目录用 EFS 弹性文件系统；Windows 域内共享用 FSx 对应形态；网站图片与备份是海量对象，进 S3 分层控成本。关联考点：域 1.5.5「根据访问模式和性能要求设计存储架构」。\n\n❌ A：块与文件的语义用对象存储顶替，数据库与域共享两类需求直接做不了，一刀切选型不成立。\n❌ C：数据库文件放共享文件系统，锁语义不对，除非引擎明确支持，否则是事故配置。\n❌ D：高 IOPS 档贵一个量级，先量出实际 IOPS 与吞吐再选档位，默认顶配是花钱买不需要的性能。\n\n📌 关键概念：存储四类是块 EBS、共享 EFS、专用 FSx、对象 S3；按访问语义选型，性能档位先量再选。","s":"自编·1.5.5"},{"id":"D1-034","d":1,"t":"single","q":"Contoso 商品页读流量是写的一百倍，用 ElastiCache 旁路缓存带 TTL。秒杀热点键怕过期瞬间全部打到库，大批键怕同时过期集体压库，恶意查询怕打穿缓存。缓存三坑怎么防","o":[{"l":"A","t":"全部键配置同一个 TTL，到期统一刷新"},{"l":"B","t":"读路径上的强一致校验结果也缓存起来提速"},{"l":"C","t":"不存在的键每次都落到数据库查一遍再返回空"},{"l":"D","t":"热点键提前刷新防击穿，TTL 加随机抖动错开防雪崩，不存在的键用空值占位防穿透"}],"a":["D"],"e":"✅ 正确项：D。缓存三坑各有解法：击穿是热键过期瞬间压库，用提前刷新；雪崩是大量键同时过期，给 TTL 加随机抖动错开过期时间；穿透是查不存在的键反复打穿缓存，用空值占位把这类查询挡在缓存层。关联考点：域 1.5.6「设计数据缓存策略以优化性能」。\n\n❌ A：全部键同一 TTL，到期时刻集中，正是雪崩的标准触发姿势，方向完全反了。\n❌ B：强一致读路径不该缓存，或每次校验版本；把校验结果也缓存等于把一致性缺口埋进缓存层。\n❌ C：不存在的键每次落库，穿透就发生在这条路径上，空值占位才是挡板。\n\n📌 关键概念：三坑三解——提前刷新防击穿、错开 TTL 防雪崩、空值占位防穿透；缓存全挂时库顶不顶得住要预先心里有数。","s":"自编·1.5.6"},{"id":"D1-035","d":1,"t":"multiple","q":"Fabrikam 要与合作银行做反欺诈联查，双方都不能把可疑账户原始数据交给对方；同时要在全组织统一数据目录并集中管理跨账户授权。哪些做法符合要求（选所有适用项）","o":[{"l":"A","t":"双方数据留在各自账户，Clean Rooms 协作区跑交集分析"},{"l":"B","t":"Fabrikam 把原始数据拷贝一份发给银行账户再联合统计"},{"l":"C","t":"Glue Data Catalog 统一登记全组织数据资产的表与技术元数据"},{"l":"D","t":"Lake Formation 集中按列按行把库表授权给其他账户，撤销即时生效"},{"l":"E","t":"各团队各自用资源策略散着授权，不做集中管理"}],"a":["A","C","D"],"e":"✅ 正确项：A、C、D。三件事各就各位：联合分析不交原始数据用 Clean Rooms，双方数据留在各自账户、查询在协作区跑、互相看不到对方原始数据；数据资产可找靠 Glue Data Catalog 统一编目；跨账户授权靠 Lake Formation 集中按列按行授予，撤销即时生效，审计链完整。关联考点：域 1.5.7「设计数据编目和跨账户数据共享模式」。\n\n❌ B：拷一份数据发过去，违反不交原始数据的合规约束，权限分散也难审计，正是要避免的做法。\n❌ E：资源策略散授权只在一次性小规模共享勉强可用，常态化治理下权限分散、审计困难，集中授权是标配。\n\n📌 关键概念：跨账户共享的原则是数据不动权限动——目录可找、授权可撤、协作不出原始数据。","s":"自编·1.5.7"},{"id":"D2-001","d":2,"t":"single","q":"公司用 Microsoft Entra ID 管理员工，希望员工用同一账号登录 AWS 控制台，且员工离职后能自动在 AWS 侧停用账号。哪种组合最合适","o":[{"l":"A","t":"为每个员工在 IAM 建长期用户，定期手工核对离职名单"},{"l":"B","t":"配置 SAML 2.0 联合做控制台登录，配合 SCIM 同步用户生命周期"},{"l":"C","t":"用 IAM Roles Anywhere 让员工用证书换临时凭证访问控制台"},{"l":"D","t":"把根用户凭证开放给员工共享使用"}],"a":["B"],"e":"✅ 正确项：B。SAML 2.0 把控制台登录信任交给企业 IdP 实现单点登录，SCIM 负责入离职的用户生命周期自动同步，两者配合正好覆盖登录与停用。关联考点：域 2.1.1「使用标准协议实现身份联合」。\n\n❌ A：长期 IAM 用户加手工核对不符合联合理念，离职停用也容易遗漏。\n❌ C：Roles Anywhere 面向机器与工作负载用证书换凭证，不是员工控制台登录的方案。\n❌ D：共享根用户凭证违反最小权限与可追溯原则，是严重安全反模式。\n\n📌 关键概念：SAML 与 OIDC 管登录信任，SCIM 管用户生命周期，身份联合是两者配合而非单一协议。","s":"自编·2.1.1"},{"id":"D2-002","d":2,"t":"single","q":"客服机器人接入 Amazon Bedrock 对外服务，要求屏蔽涉敏内容、防止提示注入，并且输出要可审计。哪项方案最直接","o":[{"l":"A","t":"配置 Amazon Bedrock Guardrails 设置内容过滤、拒绝话题与敏感信息掩码"},{"l":"B","t":"在应用层自写关键词过滤，不引入 Bedrock 的专用能力"},{"l":"C","t":"把模型温度调到最低就能杜绝有害输出"},{"l":"D","t":"只在测试环境做人工审核，生产环境不设过滤"}],"a":["A"],"e":"✅ 正确项：A。Bedrock Guardrails 原生提供内容过滤、拒绝话题、敏感信息掩码与提示注入防护，是满足合规控制的最直接手段。关联考点：域 2.5.1「为生成式 AI 实施内容过滤与合规控制」。\n\n❌ B：自写关键词过滤覆盖有限、难以维护，也挡不住语义层面的注入与敏感情形。\n❌ C：调低温度只影响输出随机性，与内容安全合规无关，不能杜绝有害内容。\n❌ D：生产环境不设过滤等于没有控制，直接违反负责任 AI 的合规要求。\n\n📌 关键概念：GenAI 的内容合规要靠专门的护栏能力，不是靠调参数或关键词黑名单。","s":"自编·2.5.1"},{"id":"D2-003","d":2,"t":"single","q":"Fabrikam 做面向客户的门户：客户要注册登录，登录后要直接读自己目录里的 S3 文件；门户后端跑在 EKS 上要写日志，全程不落长期密钥。身份方案怎么配","o":[{"l":"A","t":"为每个客户建 IAM 用户，把访问密钥发给门户后端代为调用"},{"l":"B","t":"用户池管登录，客户拿用户池签发的令牌直接调 S3 API"},{"l":"C","t":"用户池管注册登录，身份池把登录身份换成受限角色凭证读自己前缀；EKS 后端用 Pod Identity 拿角色写日志"},{"l":"D","t":"客户全部走 IAM Identity Center 单点登录"}],"a":["C"],"e":"✅ 正确项：C。认证与授权分开设计：用户池管客户身份（注册、登录、多因素认证，签发 JWT）；身份池把登录身份换成临时 AWS 凭证，以受限角色只读自己前缀；容器后端用 EKS Pod Identity 把服务账号映射成 IAM 角色，全程零长期密钥。关联考点：域 2.1.2「设计应用认证和授权方案」。\n\n❌ A：客户级 IAM 用户加长期密钥是双重反模式——权限模型错位且泄露窗口大。\n❌ B：用户池令牌不是 AWS 凭证，直调 S3 走不通，中间缺身份池换凭证这一环。\n❌ D：IAM Identity Center 是员工身份联合的通道，不是面向外部客户的形态。\n\n📌 关键概念：用户池认人、身份池发 AWS 凭证、Pod Identity 给容器身份；三件事别混用。","s":"自编·2.1.2"},{"id":"D2-004","d":2,"t":"multiple","q":"Contoso 请一家 MSP 代管多个 AWS 账号，既要让 MSP 干得了活，又要防它权限过大或内部误配置。哪些机制能落地最小权限（选所有适用项）","o":[{"l":"A","t":"给 MSP 的跨账户角色强制带外部 ID"},{"l":"B","t":"给 MSP 角色挂权限边界，上限只到运维操作"},{"l":"C","t":"给 MSP 角色直接挂 AdministratorAccess，省得来回改策略"},{"l":"D","t":"财务数据按 ABAC 标签隔离，MSP 角色无对应标签授权即不可见"},{"l":"E","t":"生成长期访问密钥发给 MSP 写进配置文件"}],"a":["A","B","D"],"e":"✅ 正确项：A、B、D。最小权限靠机制组合落地：跨账户访问强制带外部 ID，防第三方被诱导操作别的账号的混淆代理人问题；权限边界给角色设权限上限，即使 MSP 内部误挂管理员策略也越不过线；ABAC 按标签授权，财务数据对无标签授权的主体天然不可见。关联考点：域 2.1.3「设计最小权限访问控制，如跨账户访问和临时凭证」。\n\n❌ C：挂 AdministratorAccess 与最小权限的目标直接相反，一次误操作就是全域事故。\n❌ E：长期密钥写进配置文件，泄露窗口无限大，应换 STS 临时凭证。\n\n📌 关键概念：最小权限六件套是角色策略、权限边界、外部 ID、会话策略、ABAC、临时凭证——各卡一类风险。","s":"自编·2.1.3"},{"id":"D2-005","d":2,"t":"single","q":"Fabrikam 的第三方运维商通过跨账户角色接入后，还希望每次运维会话的权限临时再收一档，会话结束即恢复。用哪种机制","o":[{"l":"A","t":"给角色再追加一个更大的托管策略扩大灵活度"},{"l":"B","t":"STS 换凭证时叠会话策略，本次会话权限取更小集合"},{"l":"C","t":"让运维商共享根用户凭证手工操作"},{"l":"D","t":"会话级收紧做不到，只能预先把角色权限收到最小"}],"a":["B"],"e":"✅ 正确项：B。会话策略是专门给临时会话再叠一层限制的机制：AssumeRole 时带上会话策略，本次会话的有效权限是角色策略与会话策略的交集，比角色本身更小；会话凭证到期，限制随之消失，角色权限不用改。关联考点：域 2.1.3「设计最小权限访问控制，如跨账户访问和临时凭证」。\n\n❌ A：追加更大策略是放宽不是收紧，方向反了。\n❌ C：共享根用户凭证违反最小权限与可追溯原则，是严重反模式。\n❌ D：会话级收紧正是会话策略存在的意义，「做不到」的说法不成立。\n\n📌 关键概念：会话策略管单次会话的再收紧；角色不动、会话变短、权限更小，是临时凭证体系的第三道口。","s":"自编·2.1.3"},{"id":"D2-006","d":2,"t":"single","q":"Tailspin 的 S3 数据湖要求数据只能从公司 VPC 内访问，同时担心某个桶策略被误配置成允许外部账号读取。防护怎么配","o":[{"l":"A","t":"只配安全组限制对 S3 的访问"},{"l":"B","t":"桶策略保持开放，靠季度人工审计兜底"},{"l":"C","t":"把数据拷贝到各团队本地自行管理"},{"l":"D","t":"S3 配 VPC 终端节点策略只认公司 VPC 的终端节点，同时开 Access Analyzer 扫描资源策略，发现意外外部共享即告警"}],"a":["D"],"e":"✅ 正确项：D。数据边界要身份与网络两道门一起守：VPC 终端节点策略把访问路径锁在公司网络内，数据只能从指定终端节点进出；IAM Access Analyzer 持续分析资源策略，一旦桶被误配成允许外部账户访问立即告警——网络边界与身份越界各有一道闸。关联考点：域 2.1.4「设计数据边界控制和外部访问校验方案」。\n\n❌ A：S3 不由安全组管辖，数据边界也不等于安全组，这层管不住对象存储的访问路径。\n❌ B：开放加事后人工审计是被动脉冲，误共享窗口期敞着。\n❌ C：拷贝分发数据破坏集中治理，还制造一堆权限失控的副本。\n\n📌 关键概念：数据边界三门是 Access Analyzer 查身份越界、终端节点策略锁网络、Verified Access 放外部用户，叠加而非三选一。","s":"自编·2.1.4"},{"id":"D2-007","d":2,"t":"single","q":"Fabrikam 的远程审计人员要访问内部报表应用，公司不想为这批外部用户专门上 VPN，还要求按设备合规状态与身份双重放行。怎么配","o":[{"l":"A","t":"用 AWS Verified Access 按设备状态与身份做应用级零信任放行"},{"l":"B","t":"为审计人员逐个创建 IAM 用户并发放长期密码"},{"l":"C","t":"把报表应用暴露到公网，配 IP 白名单限制"},{"l":"D","t":"给所有外部用户开通 Site-to-Site VPN 连进 VPC"}],"a":["A"],"e":"✅ 正确项：A。Verified Access 正是给没有 VPN 的外部用户做应用级零信任访问的服务：按设备合规状态与用户身份逐次评估放行，应用不暴露公网，也不需要为外部用户建 VPN 通道，两个约束一次满足。关联考点：域 2.1.4「设计数据边界控制和外部访问校验方案」。\n\n❌ B：外部用户发 IAM 用户加长期密码，凭证泄露窗口大且没有设备状态评估这一层。\n❌ C：公网暴露加 IP 白名单，设备合规评估做不到，暴露面也大了一圈。\n❌ D：为少数外部用户上整条 VPN，成本与运维负担最重，且与题给约束相反。\n\n📌 关键概念：Verified Access 管外部用户怎么安全进来——设备状态加身份的应用级零信任，VPN 的轻量替代。","s":"自编·2.1.4"},{"id":"D2-008","d":2,"t":"single","q":"Contoso 机房的批处理程序每天要往 S3 上传对账文件，目前把长期访问密钥写在十几台机器的配置文件里，轮换一次要改一遍。怎么改最合适","o":[{"l":"A","t":"长期密钥改成每季度手工轮换一次，减少改动频率"},{"l":"B","t":"把程序全部搬进 EC2 用实例角色取凭证"},{"l":"C","t":"用 Roles Anywhere：程序持 X.509 证书对请求签名，经信任锚校验换出临时凭证，到期自动失效"},{"l":"D","t":"建一个专用 IAM 用户，密钥只存在一台中心机器"}],"a":["C"],"e":"✅ 正确项：C。负载跑在 AWS 之外又要调 AWS，是 Roles Anywhere 的标准场景：程序持有受信 CA 签发的 X.509 证书对请求签名，Roles Anywhere 经信任锚校验后换出临时凭证，凭证到期自动失效，机房配置文件里不再存任何长期密钥。关联考点：域 2.1.5「为混合云和多云环境设计工作负载身份」。\n\n❌ A：季度手工轮换仍是长期密钥，泄露窗口只是变长变短的区别，问题没解决。\n❌ B：程序跑在机房是题给约束，搬进 EC2 等于为身份问题重写部署形态，代价错配。\n❌ D：专用 IAM 用户还是长期密钥，集中存放只是把风险换个单点。\n\n📌 关键概念：AWS 内的负载用各自 IAM 角色，AWS 外的负载用 Roles Anywhere 加证书换临时凭证。","s":"自编·2.1.5"},{"id":"D2-009","d":2,"t":"single","q":"Tailspin 的数据湖被审计方要求「密钥每年轮换且记录可查、密钥策略要自主管理、要能跨账户集中管密钥」。KMS 怎么配","o":[{"l":"A","t":"全部使用 AWS 托管密钥，服务自动创建与轮换"},{"l":"B","t":"建客户管理密钥并开自动轮换，数据湖桶默认加密指向该密钥，轮换状态与历史可查"},{"l":"C","t":"手工每季度重建新密钥并把全部旧数据重新加密一遍"},{"l":"D","t":"为每个桶各建一把专属客户管理密钥并全部开轮换"}],"a":["B"],"e":"✅ 正确项：B。审计要求证明轮换策略与策略自主管理，指向客户管理密钥：自建密钥能配 key policy 与跨账户授权，开启自动轮换后轮换状态与历史可直接取证，桶默认加密指向该密钥即全量生效。关联考点：域 2.2.1「使用客户管理密钥和自动密钥轮换实现静态加密」。\n\n❌ A：AWS 托管密钥零维护，但策略不可自定义，审计要的「策略自主管理、轮换可证明」给不出来。\n❌ C：轮换换的是密钥材料不是重建密钥，旧数据无需重加密；手工重建既费力又不是自动轮换证据。\n❌ D：每个桶一把专属密钥是过度设计，策略维护成本翻数倍，讲义明确内部低敏数据不必如此。\n\n📌 关键概念：两档密钥的取舍在控制权不在强度——托管省心不可控，客户管理可控但要管轮换与策略。","s":"自编·2.2.1"},{"id":"D2-010","d":2,"t":"single","q":"Contoso 给客户管理密钥开了自动轮换后，安全团队问「旧数据要不要跟着重加密、应用引用要不要改」。正确的解释是","o":[{"l":"A","t":"轮换后旧数据必须全部重新加密一遍，否则读不出来"},{"l":"B","t":"轮换会生成新密钥 ID，所有应用引用都要更新"},{"l":"C","t":"轮换切换期间相关服务要停机配合"},{"l":"D","t":"轮换只换密钥材料，密钥 ID 不变；旧数据用旧材料解、新数据用新材料加密，无需重加密"}],"a":["D"],"e":"✅ 正确项：D。自动轮换的机制是换密钥材料不换密钥 ID：轮换后新数据用新材料加密，旧数据继续用保留下来的旧材料解密，应用侧引用的密钥 ID 不变，既不用改代码也不用停机重加密，轮换对业务透明。关联考点：域 2.2.1「使用客户管理密钥和自动密钥轮换实现静态加密」。\n\n❌ A：旧数据用旧材料照常解密，重加密一说把机制讲反了，白白引发一轮全量重写。\n❌ B：密钥 ID 保持不变正是设计的巧处，改引用这个说法与机制相反。\n❌ C：轮换是元数据层动作，服务无感知，不存在停机窗口。\n\n📌 关键概念：轮换换材料不换 ID、旧数据不重加密、新旧材料并存——这三句话是 KMS 轮换机制的考点核心。","s":"自编·2.2.1"},{"id":"D2-011","d":2,"t":"single","q":"Fabrikam 的证书需求分三路：公网官网要零成本全自动续期；内部微服务之间要双向 TLS 认证且域名全是内部名；另有一批第三方 CA 签发的证书要挂负载均衡器。证书管理怎么配","o":[{"l":"A","t":"公网证书走 ACM 自动续期，内部域名用 Private CA 签私有证书做双向 TLS，第三方证书导入 ACM 挂载"},{"l":"B","t":"内部域名找公有 CA 付费签发证书"},{"l":"C","t":"导入的第三方证书同样依赖 ACM 自动续期"},{"l":"D","t":"内部服务之间不配 TLS，内网传输天然可信"}],"a":["A"],"e":"✅ 正确项：A。证书三路各归其位：公网域名证书让 ACM 签发，免费且自动续期，运维零介入；内部域名与双向 TLS 场景用 AWS Private CA 签私有证书，带组织身份体系；第三方 CA 签的证书导入 ACM 挂载负载均衡器即可复用，只是续期要自己管。关联考点：域 2.2.2「使用证书管理实现传输中加密」。\n\n❌ B：公有 CA 不给内部域名签发证书，这条路从规则上就走不通。\n❌ C：ACM 自动续期只覆盖 ACM 亲自签发的证书，导入的证书续期责任在使用方自己。\n❌ D：内网明文传输是常见错误认知，传输加密对内部流量同样缺一不可。\n\n📌 关键概念：证书三路——公有走 ACM 自动续、导入的自己续、内部域名走 Private CA；TLS 1.3 是现行标准协议。","s":"自编·2.2.2"},{"id":"D2-012","d":2,"t":"single","q":"Contoso 的支付通道被卡组织要求「支付密钥只能存储在单租户独占的 FIPS 三级验证硬件里」。方案怎么选","o":[{"l":"A","t":"用 KMS 托管服务，本身就是安全硬件"},{"l":"B","t":"用客户管理密钥并配最严格的 key policy 即可等效满足"},{"l":"C","t":"双实例 CloudHSM 集群管支付密钥，应用经 KMS 自定义密钥存储调用，合规报告写明硬件独占"},{"l":"D","t":"把密钥文件存在加密 EBS 卷上由应用自管"}],"a":["C"],"e":"✅ 正确项：C。合规条文白纸黑字写了「单租户」「三级验证硬件」，这类硬性要求只有 CloudHSM 能满足：单租户专属实例、FIPS 140-2 三级验证的硬件；双实例起步保高可用，应用侧经 KMS 自定义密钥存储照常调 API，合规报告可写明硬件独占。关联考点：域 2.2.3「实施专用硬件安全模块以满足合规要求」。\n\n❌ A：KMS 是多租户共享的托管服务，共享硬件这一条就过不了关。\n❌ B：客户管理密钥拿到的是控制权不是硬件独占，与三级验证的条文要求是两回事。\n❌ D：加密 EBS 卷不是抗篡改的专用密码硬件，合规语义完全对不上。\n\n📌 关键概念：CloudHSM 的触发条件是单租户与三级硬件的硬合规；常规加密 KMS 就够，成本差一个量级。","s":"自编·2.2.3"},{"id":"D2-013","d":2,"t":"single","q":"Fabrikam 的医疗影像按法规要保密二十年，安全团队评估量子解密风险十年内兑现。后量子密码策略怎么准备","o":[{"l":"A","t":"后量子是将来的事，等供应商全面切换后再跟随"},{"l":"B","t":"全部系统一次性切换到纯后量子算法，一步到位"},{"l":"C","t":"会话流量保密期短，先全部换后量子，档案数据慢慢来"},{"l":"D","t":"长保密期医疗影像先套混合加密（经典与后量子算法并用），密钥用 KMS 后量子密钥类型，其余系统按年度盘点节奏换装"}],"a":["D"],"e":"✅ 正确项：D。后量子迁移按保密期分层：医疗影像这类保密二十年的数据，「先抓取、将来解密」的威胁已经存在，现在就要套混合模式——经典算法与后量子算法并用，安全性取两者并集；短保密期数据跟随供应商默认节奏即可。关联考点：域 2.2.4「设计后量子密码策略」。\n\n❌ A：长保密期数据等不起，抓取存储式攻击今天就在积累素材，等切换等于裸奔十年。\n❌ B：纯后量子一步到位，生态还没成熟，切换风险一次全压上来，与分层的迁移节奏相反。\n❌ C：分层方向反了——先动的该是长寿命数据，会话流量几个月失效，不必抢跑。\n\n📌 关键概念：迁移节奏按保密期分层：长寿命数据先上混合模式，短命数据跟随默认；ML-DSA 管签名、ML-KEM 管封装。","s":"自编·2.2.4"},{"id":"D2-014","d":2,"t":"single","q":"Contoso 安全团队在学习后量子算法分工：数字签名与密钥封装分别对应哪个算法。正确的说法是","o":[{"l":"A","t":"ML-DSA 管密钥封装，ML-KEM 管数字签名"},{"l":"B","t":"ML-DSA 管数字签名，ML-KEM 管密钥封装，两者同出 NIST 标准化的格密码家族"},{"l":"C","t":"两个算法都只负责加密数据本体，用法相同"},{"l":"D","t":"后量子算法尚处于草案阶段，还没有形成标准"}],"a":["B"],"e":"✅ 正确项：B。两个算法分工明确：ML-DSA（Module-Lattice Digital Signature Algorithm）管数字签名，验明数据来源与完整性；ML-KEM（Module-Lattice-Based Key-Encapsulation Mechanism）管密钥封装，用安全方式把对称密钥送到对端；两者都出自 NIST 标准化的格密码家族。关联考点：域 2.2.4「设计后量子密码策略」。\n\n❌ A：两个算法的分工恰好说反了，签名与封装张冠李戴。\n❌ C：签名与封装是两种密码原语，都不直接加密数据本体，加密靠它们协商或保护出来的对称密钥。\n❌ D：格密码家族已完成 NIST 标准化，KMS 已提供后量子密钥类型，不是草案阶段。\n\n📌 关键概念：签名归 ML-DSA、封装归 ML-KEM；现阶段主流形态是与经典算法并用的混合模式。","s":"自编·2.2.4"},{"id":"D2-015","d":2,"t":"single","q":"Contoso 五个业务线每年新开十几个项目账号，要求新账号开通即带日志基线与区域护栏，不靠手工配置。组织结构怎么设计","o":[{"l":"A","t":"所有账号平铺在组织根下，不做分组"},{"l":"B","t":"每开一个账号，手工逐项配置日志与护栏"},{"l":"C","t":"Control Tower 打底着陆区，各业务线建 OU，新项目走 Account Factory 开号，开通即带日志基线与护栏"},{"l":"D","t":"OU 层级越深越好，按部门科组逐层细分"}],"a":["C"],"e":"✅ 正确项：C。治理四件套一次配齐：Control Tower 给着陆区打底，统一日志账户与安全护栏；每个业务线一个 OU，护栏按层挂、按层收；新项目账号走 Account Factory 按模板自动开通，网络、角色、基线一步到位，开通即达标。关联考点：域 2.3.1「设计包含防护栏、着陆区和自动账户开通的组织结构」。\n\n❌ A：账号平铺在根下，护栏无法按业务线分层挂，治理粒度全丢。\n❌ B：手工逐项配置在每年十几个账号的增速下不可持续，且配置漂移难免。\n❌ D：OU 分层别太深，两层够用，层数多了策略继承关系难排查。\n\n📌 关键概念：Organizations 分组、Control Tower 打底、Account Factory 自动开号、OU 分层挂护栏——治理四件各司其职。","s":"自编·2.3.1"},{"id":"D2-016","d":2,"t":"multiple","q":"Fabrikam 几十个账户的日志与配置要集中查看，用 Bedrock 做的客服助手的对话内容也要留痕可回溯。哪些做法正确（选所有适用项）","o":[{"l":"A","t":"开 CloudTrail 组织跟踪，全部成员账户的 API 事件自动覆盖"},{"l":"B","t":"各账户日志每天手工导出到日志账户保存"},{"l":"C","t":"给 Bedrock 开模型调用日志，调用与响应落到 S3 专桶，再入 Security Lake 统一分析"},{"l":"D","t":"用 Config 聚合器把各账户资源配置与变更汇总到一处"},{"l":"E","t":"AI 对话原文不做脱敏处理，全量直接落盘留证"}],"a":["A","C","D"],"e":"✅ 正确项：A、C、D。集中化治理底座一次到位：CloudTrail 组织跟踪开在组织层，所有成员账户自动覆盖，不必逐账户配置；Bedrock 的模型调用日志把调用与响应落到 S3 专桶，AI 说了什么可回溯，再入 Security Lake 归一检索；Config 聚合器把各账户资源配置与漂移拉到一处统一看。关联考点：域 2.3.2「实现集中式日志和配置管理方案，包括 AI 模型调用与响应的记录」。\n\n❌ B：组织跟踪自动覆盖成员账户，逐日手工导出是重复劳动且必有遗漏。\n❌ E：提示词与回复里可能有敏感数据，先定脱敏规则再落盘，合规与隐私都要过。\n\n📌 关键概念：组织跟踪全覆盖、Config 聚合配置、AI 调用单独开模型日志——治理底座三件，AI 留痕是这版考纲点名的新形态。","s":"自编·2.3.2"},{"id":"D2-017","d":2,"t":"single","q":"Contoso 的监管要求能回放「AI 助手当时对客户说了什么」。审计方案怎么配才能真正回放对话内容","o":[{"l":"A","t":"只开 CloudTrail 记录 InvokeModel 的 API 事件即可"},{"l":"B","t":"开 Bedrock 模型调用日志，把调用输入与响应落到 S3 专桶，按会话回放"},{"l":"C","t":"在应用里自己打日志记对话，关掉服务侧日志省成本"},{"l":"D","t":"对话内容属于敏感数据，按合规精神不应记录"}],"a":["B"],"e":"✅ 正确项：B。AI 服务的审计有自己的形态：Bedrock 的模型调用日志把每次调用的输入与输出完整落盘，指向 S3 专桶即可按会话与时间轴回放，对话内容可回溯这一监管要求才算真正落地。关联考点：域 2.3.2「实现集中式日志和配置管理方案，包括 AI 模型调用与响应的记录」。\n\n❌ A：CloudTrail 的 API 事件只有调用元数据（谁调了哪个模型），还原不了输入输出内容，回放对话无从谈起。\n❌ C：应用自记日志链路易断、格式漂移、防篡改缺失，服务侧留痕才是权威链。\n❌ D：监管点名要可回溯，合规要求恰恰是记录，回避记录与要求相反。\n\n📌 关键概念：API 事件还原不了对话内容，模型调用日志才记输入与输出；AI 审计链要单独开这一条。","s":"自编·2.3.2"},{"id":"D2-018","d":2,"t":"single","q":"Tailspin 的网络账号有一对专线接入的 Transit Gateway，要让各业务账号的 VPC 共用这对网关出入机房，不重复建设。资源共享怎么配","o":[{"l":"A","t":"Transit Gateway 走 RAM 共享给各业务账号，各 VPC 挂同一网关，流量集中治理"},{"l":"B","t":"每个业务账号各自购买专线并自建网关"},{"l":"C","t":"网关共享出去后，各账号 VPC 的安全组与路由表也统一由网络账号代管"},{"l":"D","t":"用 VPC 对等连接把各业务 VPC 逐一连到网络账号再走网关"}],"a":["A"],"e":"✅ 正确项：A。网络类共享的正解：Transit Gateway 本身支持跨账户共享，走 RAM 把网关共享给各业务账号（与组织共享还免逐账号邀请），各 VPC 挂同一网关，出入机房的流量集中治理，专线不用重复买。关联考点：域 2.3.3「配置跨账户资源共享」。\n\n❌ B：逐账号买专线是重复建设，成本与治理都翻倍，共享模式正为此而生。\n❌ C：共享有边界——网关共享了，各账号 VPC 的安全组与路由表仍由各账号自理，代管说法越界。\n❌ D：对等方式要维护两两连接与复杂路由，网关既然支持共享就不必绕对等这条路。\n\n📌 关键概念：RAM 管账号资产共享、TGW 共享走 RAM；共享边界要清楚——资源共用，管控自理。","s":"自编·2.3.3"},{"id":"D2-019","d":2,"t":"multiple","q":"Fabrikam 要划组织级红线：业务只能在两个批准区域跑、关键桶只能被组织内身份访问、任何账号都不能关掉集中日志。哪些做法能真正强制（选所有适用项）","o":[{"l":"A","t":"在各成员账户里写 IAM 拒绝策略实现区域限制"},{"l":"B","t":"在 OU 上挂 SCP，拒绝批准区域之外的所有动作"},{"l":"C","t":"关键桶的访问边界靠各账户管理员自觉维护桶策略"},{"l":"D","t":"挂 RCP 限定关键桶只接受组织内身份访问，成员误配的开放策略也被压住"},{"l":"E","t":"把 SCP 写成逐条枚举允许操作的巨型白名单"}],"a":["B","D"],"e":"✅ 正确项：B、D。组织级红线要用组织层策略强制：SCP 挂在 OU 层对成员账户设操作天花板，拒绝批准区域外的动作，成员管理员改不动；RCP 作用在资源侧设准入门槛，限定关键桶只接受组织内身份，即使成员误配了开放策略也被 RCP 压住。关联考点：域 2.3.4「使用 SCP 和 RCP 设计策略强制实施」。\n\n❌ A：IAM 策略在成员账户里，管理员自己改得动，红线随时可被拆，不构成强制。\n❌ C：靠自觉维护桶策略等于没有兜底，误配一次红线就破。\n❌ E：SCP 是天花板不是授权书，巨型白名单难维护，精细授权留在 IAM 层做。\n\n📌 关键概念：SCP 管本账户主体出去、RCP 管外部主体进来；与 IAM 层层求交集，全部放行才放行。","s":"自编·2.3.4"},{"id":"D2-020","d":2,"t":"single","q":"Contoso 的管理员问「SCP 与 IAM 策略是什么关系」。正确的解释是","o":[{"l":"A","t":"SCP 是授权书，挂上 SCP 就代表允许做这些操作"},{"l":"B","t":"SCP 挂到账户后，账户内主体权限只看 IAM 策略即可"},{"l":"C","t":"SCP 设操作上限，IAM 策略管精细授权，两层取交集，都放行才放行"},{"l":"D","t":"SCP 应该逐 OU 复制全量策略，确保层层都有限制"}],"a":["C"],"e":"✅ 正确项：C。SCP 与 IAM 是叠加求交集的关系：SCP 挂在组织或 OU 层，给成员账户主体设操作上限；IAM 策略管精细授权；一次请求要同时通过 SCP 与 IAM 两层，都放行才放行——SCP 不授予权限，只切天花板。关联考点：域 2.3.4「使用 SCP 和 RCP 设计策略强制实施」。\n\n❌ A：SCP 是天花板不是授权书，挂了 SCP 不等于允许，授权仍在 IAM 层。\n❌ B：只看 IAM 是漏了组织层限制，SCP 划的线会先拦住越界请求。\n❌ D：逐 OU 复制全量策略制造维护灾难，策略应按层挂、按层继承。\n\n📌 关键概念：SCP 管出去、RCP 管进来、IAM 管精细授权——三层策略求交集，交集之外一律拒绝。","s":"自编·2.3.4"},{"id":"D2-021","d":2,"t":"single","q":"Contoso 每季度要向监管交付合规证据，合规状态要持续可证明，不能靠年度人工检查。自动合规监控怎么配","o":[{"l":"A","t":"Config 托管规则铺满 OU 持续评估，Security Hub 聚合评分出趋势，违规事件自动落证据桶，季报一键导出"},{"l":"B","t":"每季度人工逐账号跑检查清单，截图存档交差"},{"l":"C","t":"全部违规项都配自动修复脚本，发现即改"},{"l":"D","t":"合规证据等审计进场时再临时翻日志补齐"}],"a":["A"],"e":"✅ 正确项：A。持续合规三步到位：Config 规则逐项持续评估，托管规则开箱即用先铺满；Security Hub 把违规与各安全服务发现聚合，按严重度分级出态势趋势；违规触发事件自动落进证据桶，季度报告一键导出，证据链持续而非脉冲。关联考点：域 2.3.5「实现自动化合规监控」。\n\n❌ B：季度人工截图是脉冲式取证，两次检查之间的漂移全部看不见。\n❌ C：自动修复要分级——有些资源改了会断业务，先人工确认再自动化，不能一律即改。\n❌ D：审计进场才翻日志来不及，证据收集要定时自动化。\n\n📌 关键概念：托管规则先铺满、违规转事件、证据自动落桶；修复分级推进，断业务类先人工确认。","s":"自编·2.3.5"},{"id":"D2-022","d":2,"t":"single","q":"Fabrikam 两百台 EC2 分生产与测试两套环境，要自动化漏洞扫描与补丁管理，且补丁不能一刀切直接上生产。流水线怎么配","o":[{"l":"A","t":"补丁基线直接全量推生产，出问题再整体回滚"},{"l":"B","t":"漏扫靠运维人工登录每台实例跑扫描脚本"},{"l":"C","t":"补丁在各台机器上手工逐台执行更新命令"},{"l":"D","t":"Inspector 持续扫 EC2 与 ECR 镜像、高危发现自动生成工单；补丁基线先在测试窗口跑两周验证，再克隆到生产窗口分批推，出问题只回滚当批"}],"a":["D"],"e":"✅ 正确项：D。漏扫与补丁流水线三步走：Inspector 对 EC2 免代理持续扫描，容器镜像在 ECR 推送时自动扫，高危发现按严重度与暴露面排优先级并自动生成工单；Patch Manager 按补丁基线在维护窗口批量执行——基线先在测试窗口跑两周验证，再克隆到生产窗口分批推，出问题只回滚当批。关联考点：域 2.3.6「配置自动化漏洞扫描和补丁管理」。\n\n❌ A：全量直推生产没有灰度路径，一次坏补丁就是全局事故。\n❌ B：两百台实例人工跑脚本不可持续，Inspector 免代理扫描就是为此而生。\n❌ C：手工逐台更新既慢又漏，批量基线加维护窗口才是规模化做法。\n\n📌 关键概念：扫描免代理、定级看暴露面、补丁走窗口；测试先行、生产分批、当批可回滚。","s":"自编·2.3.6"},{"id":"D2-023","d":2,"t":"single","q":"Tailspin 按数据保护法改造客户数据平台，合规顾问要求「数据全生命周期受保护」。架构上怎么落地","o":[{"l":"A","t":"把静态加密全量开启，就等于数据保护达标"},{"l":"B","t":"加密层 KMS 密钥按数据域分层、静态与传输全覆盖，访问层身份权限数据边界三重收口，审计层三条日志链集中留存"},{"l":"C","t":"访问控制交给各业务团队自己认领配置"},{"l":"D","t":"审计日志按需人工导出，平时不留存"}],"a":["B"],"e":"✅ 正确项：B。数据保护三支柱逐层落地：加密层按数据域分层配 KMS 密钥，静态与传输全覆盖；访问层用身份、权限、数据边界三重收口把最小权限做实；审计层把 API 事件、资源访问、应用日志三条链集中留存——三件齐了法规底层要求才算落地。关联考点：域 2.4.1「设计满足数据保护要求的架构」。\n\n❌ A：加密只是三支柱之一，访问控制与审计日志同样缺一不可，只开加密是单腿站立。\n❌ C：访问控制各团队各自认领，收口不统一，最小权限无从验证。\n❌ D：审计日志是支柱不是可选件，按需导出等于没有完整审计链。\n\n📌 关键概念：三支柱是加密、访问控制、审计日志；受监管场景配分层密钥加专属日志账户强化。","s":"自编·2.4.1"},{"id":"D2-024","d":2,"t":"single","q":"Fabrikam 承接某国政务数据平台，合同要求数据、处理、密钥全部留在境内。主权方案的设计要点是什么","o":[{"l":"A","t":"数据存境内区域即可，密钥放邻近区域方便灾备"},{"l":"B","t":"数据与计算放境内，运维入口开放给全球团队提高效率"},{"l":"C","t":"只用该国区域，KMS 密钥建在本区，运维入口走境内网络，管理账号不配境外访问路径"},{"l":"D","t":"主权只看数据存储位置，处理与管理不用管"}],"a":["C"],"e":"✅ 正确项：C。数据主权三条边界一次配齐：存储边界——数据只落该国区域，区域的地理属性是主权的物理基础；处理边界——计算与密钥同在境内，密钥出境等于把控制权送出去；管理边界——运维入口与根账号管理也在境内完成，不留跨境通道。关联考点：域 2.4.2「设计满足监管要求的方案，如数据主权控制」。\n\n❌ A：密钥放邻近区域是把处理边界的控制权拱手送出，主权的芯被抽走。\n❌ B：运维入口全球开放，管理边界形同虚设，跨境通道没堵住。\n❌ D：只管存储位置是单边界思维，主权要求三条边界同时成立。\n\n📌 关键概念：主权三边界是存储、处理、管理全在境内；缺任何一条，法律管辖就有缺口。","s":"自编·2.4.2"},{"id":"D2-025","d":2,"t":"single","q":"Contoso 政务项目评审会上，评审员问「数据主权的处理边界」具体指什么。正确的解释是","o":[{"l":"A","t":"计算与密钥同在境内——密钥出境等于把控制权送出去"},{"l":"B","t":"只限制数据不能出境，计算资源放哪里都可以"},{"l":"C","t":"指办公室的物理边界，机房必须建在政府院区之内"},{"l":"D","t":"是网络时延边界，跨区域延迟超标就算出境"}],"a":["A"],"e":"✅ 正确项：A。处理边界指计算与密钥同在境内：处理这批数据的计算资源必须在指定区域内，加密密钥也必须在本区生成与使用——密钥跟着数据走，密钥出境等于把数据的控制权一起送出去，处理边界就被击穿。关联考点：域 2.4.2「设计满足监管要求的方案，如数据主权控制」。\n\n❌ B：计算随便放就把「处理」这一环挪出边界，数据可能在境外被加工。\n❌ C：把处理边界歪曲成办公室物理边界，概念偷换，机房位置与主权处理边界不是一回事。\n❌ D：用时延指标定义主权边界属于自造概念，主权看的是法律与地理，不看毫秒数。\n\n📌 关键概念：处理边界=计算在境内加密钥在境内；密钥出境就是控制权出境。","s":"自编·2.4.2"},{"id":"D2-026","d":2,"t":"single","q":"Contoso 的交易系统按监管要保留五年的不可篡改审计链，审计抽查时按时间轴回放。审计链怎么配","o":[{"l":"A","t":"日志集中存一个桶，桶策略开放，方便各团队查阅"},{"l":"B","t":"留存期直接拉到十年，显示对合规的重视"},{"l":"C","t":"定期人工把日志刻录光盘存进保险柜"},{"l":"D","t":"组织跟踪写进开了对象锁的专桶，加密并收紧删除权限，留存期对齐法规五年"}],"a":["D"],"e":"✅ 正确项：D。审计链三段配齐：采集侧组织跟踪全覆盖 API 事件；防篡改侧日志桶开对象锁、加密、删除权限收紧——集中存储不等于防删，对象锁与删除权隔离才立得住；留存期对齐法规五年，到期转低成本归档层，按时间轴回放有完整链条。关联考点：域 2.4.3「为受监管工作负载实现审计追踪管理，包括 AI 服务」。\n\n❌ A：桶策略开放等于谁都能删，集中存储与防篡改是两回事。\n❌ B：留存期无脑拉长，存储成本随年限线性涨，按法规最低要求加缓冲才是正解。\n❌ C：人工刻录归档不可持续，也没有连续时间序链，谈不上审计追踪。\n\n📌 关键概念：审计链条是采集全覆盖、对象锁防删、留存对法规；AI 对话留痕要另开模型调用日志。","s":"自编·2.4.3"},{"id":"D2-027","d":2,"t":"multiple","q":"Fabrikam 的健康数据限定单区域驻留，且副本也算数。哪些做法符合驻留控制（选所有适用项）","o":[{"l":"A","t":"组织策略锁死区域，备份与日志投递都在本区桶内闭环"},{"l":"B","t":"页面加速可用 CDN，但对健康记录关闭缓存，副本不落地境外边缘节点"},{"l":"C","t":"为容灾在境外区域悄悄建一个备份副本，等审计来了再删"},{"l":"D","t":"确需跨境的传输单列审批通道，其余默认全部禁止"},{"l":"E","t":"驻留只约束主数据，缓存与日志副本不算数据"}],"a":["A","B","D"],"e":"✅ 正确项：A、B、D。驻留三类控制一次配齐：部署控制——组织层策略锁死区域，服务只开指定区域；传输限制——复制、备份、日志投递路径都在区域内闭环，边缘加速对受驻留约束的内容关闭缓存；例外管理——确需跨境的传输单列审批通道，其余默认全禁。关联考点：域 2.4.4「设计数据驻留控制」。\n\n❌ C：副本也算「数据在场」，境外备份落地即违规，事后删改不了既成事实。\n❌ E：缓存副本与日志同样算数据在场，把它们豁免出驻留范围是自造漏洞。\n\n📌 关键概念：驻留三控制是部署锁区、传输限域、例外审批；缓存副本也算数据在场，边缘节点要过审。","s":"自编·2.4.4"},{"id":"D2-028","d":2,"t":"single","q":"Contoso 的健康数据平台限定单区域驻留，业务方问页面加载慢能不能上 CDN。架构师的正确判断是","o":[{"l":"A","t":"可以用，但对受驻留约束的健康记录关闭缓存，这类内容不落边缘节点"},{"l":"B","t":"CDN 缓存的是副本不算数据，随便开"},{"l":"C","t":"凡涉驻留场景一律禁用 CDN，别引入风险"},{"l":"D","t":"CDN 边缘节点物理上都在同一国，天然合规"}],"a":["A"],"e":"✅ 正确项：A。CDN 与驻留可以共存：边缘加速对公开静态内容照常开，受驻留约束的健康记录关闭缓存策略，让这类请求回源取数，副本不落地境外边缘节点——性能优化与驻留合规逐项评估、分层处理。关联考点：域 2.4.4「设计数据驻留控制」。\n\n❌ B：缓存副本也算「数据在场」，说副本不算数据是给自己埋雷。\n❌ C：一律禁用是一刀切，公开内容与受约束内容分开处理即可，不必全禁。\n❌ D：边缘节点遍布全球各地，「天然合规」的说法没有依据，节点位置恰恰是审查点。\n\n📌 关键概念：全球服务的性能优化与驻留冲突时逐项评估——缓存副本也算数据在场，边缘节点要过审。","s":"自编·2.4.4"},{"id":"D2-029","d":2,"t":"single","q":"Tailspin 的银行客户年审要交 ISO 与 SOC 报告以及配置达标证据。合规证据收集方案怎么配","o":[{"l":"A","t":"只下载 Artifact 平台报告交差，平台合规即代表我方合规"},{"l":"B","t":"等审计进场前一周再突击整理证据"},{"l":"C","t":"Artifact 平台报告按月下载归档，Config 合规快照定期落桶，两路合并成审计包，Security Hub 出态势趋势"},{"l":"D","t":"以口头说明加现场演示为主要证明形式"}],"a":["C"],"e":"✅ 正确项：C。合规证据两路合并：平台侧用 Artifact 按月下载第三方审计报告（SOC、PCI、ISO 类）归档；我方侧用 Config 合规快照与 CloudTrail 摘要定期落桶，证明自己的配置达标；两路证据定时自动汇成审计包，Security Hub 出态势趋势页，年审材料随取随有。关联考点：域 2.4.5「实现合规证据收集和报告方案」。\n\n❌ A：Artifact 证明的是云平台侧合规，我方配置证据要另出，只有一路证据不完整。\n❌ B：审计进场才翻日志来不及，证据收集要定时自动化，不是突击工程。\n❌ D：审计收证据不收口头保证，演示更替代不了持续证据链。\n\n📌 关键概念：证据两路——平台报告走 Artifact、我方证据走 Config 快照；定时自动化，审计包随时可拼。","s":"自编·2.4.5"},{"id":"D2-030","d":2,"t":"single","q":"Fabrikam 上线一个新的对外 API，团队要做威胁建模。正确的做法是","o":[{"l":"A","t":"上线后按季度复盘一次安全即可"},{"l":"B","t":"先画资产与数据流（入口、存储、密钥、信任边界），逐组件找机密性完整性可用性威胁，每条配缓解，缓解不了的记剩余风险，架构变更后复评"},{"l":"C","t":"把威胁清单外包给安全厂商一次性做完归档"},{"l":"D","t":"只对数据库做威胁分析，API 层交给 WAF 管"}],"a":["B"],"e":"✅ 正确项：B。威胁建模四步循环：先画资产与数据流，入口、存储、密钥、信任边界画清楚；对每个组件问谁能破坏机密性、完整性、可用性；每条威胁配缓解措施，缓解不了的登记剩余风险；架构变更后重跑复评，威胁表滚动更新为活文档。关联考点：域 2.4.6「为云架构实施风险评估方案，如威胁建模和缓解策略」。\n\n❌ A：新系统上线与涉敏数据场景必做建模，事后季度复盘错过了设计期缓解窗口。\n❌ C：一次性文档归档后过期，过期的威胁表比没有更危险，要按变更复评。\n❌ D：只建模数据库，API 入口与密钥这些组件的威胁面全漏掉，WAF 也替代不了建模分析。\n\n📌 关键概念：建模四步是画数据流、找威胁、配缓解、变更复评；产出是威胁与缓解对照的活文档。","s":"自编·2.4.6"},{"id":"D2-031","d":2,"t":"single","q":"Fabrikam 的销售助手智能体要代客户查库存与改收货地址，还会调用支付查询接口。智能体的访问控制怎么设计","o":[{"l":"A","t":"智能体直接继承客户全部权限，客户能干什么它就能干什么"},{"l":"B","t":"智能体与所有客户共用一个 IAM 用户身份"},{"l":"C","t":"工具侧保存长期密钥，供智能体随时调用"},{"l":"D","t":"智能体走 AgentCore Identity 独立身份与短期凭证，工具网关按代表关系校验，客户未授权的动作直接拒绝"}],"a":["D"],"e":"✅ 正确项：D。智能体访问控制三层齐：身份层——独立身份主体与用户身份分开记，操作可归因；凭证层——按会话发短期凭证，工具侧不落长期密钥；授权层——能用什么工具、代表谁去用，单列授权矩阵，客户未授权的动作（如改支付方式）网关直接拒。关联考点：域 2.5.2「为生成式和智能体 AI 应用实施访问控制」。\n\n❌ A：继承用户全部权限，误操作半径等于客户全部权限，是事故源，最小代表权才是止血关键。\n❌ B：共用身份后操作不可归因，出了事回答不了「谁做的」。\n❌ C：长期密钥写在工具侧，泄露窗口无限大，短期凭证是体系标配。\n\n📌 关键概念：智能体身份三问——独立主体、短期凭证、最小代表权；AgentCore Identity 是这套体系的落地服务。","s":"自编·2.5.2"},{"id":"D2-032","d":2,"t":"single","q":"Contoso 的智能体平台出过一次误操作，事后追责时答不上「这个智能体当时代表谁、做了什么」。重新设计时要补的关键一环是","o":[{"l":"A","t":"把所有智能体的操作合并记在一个共享账号下统一记账"},{"l":"B","t":"日志只记录成功操作，失败的记录了也没有价值"},{"l":"C","t":"智能体用独立身份主体、与用户身份分开记录，操作可归因可撤销，代表权限最小化单列矩阵"},{"l":"D","t":"代表权默认配置成最大权限范围，保证任何任务都能完成"}],"a":["C"],"e":"✅ 正确项：C。可归因是智能体身份体系的核心目标：智能体用独立身份主体，与用户身份分开记录；每次操作都能回答「谁授权、代表谁、做了什么」三问；代表权限最小化单列成矩阵，出问题可精准撤销某个智能体的授权而不牵连他人。关联考点：域 2.5.2「为生成式和智能体 AI 应用实施访问控制」。\n\n❌ A：共享账号记账，操作与智能体对不上号，归因链路天生断的。\n❌ B：失败操作恰恰是排障与追责的关键素材，只记成功等于审计链只留一半。\n❌ D：最大权限保证完成任务，代价是误操作半径也最大，与最小代表权相反。\n\n📌 关键概念：闭环归因三问是「谁授权、代表谁、做了什么」；独立身份加分权矩阵让三问随时可答。","s":"自编·2.5.2"},{"id":"D2-033","d":2,"t":"multiple","q":"Contoso 的理赔 AI 自动预审：低于阈值的直接批，高于阈值的转理赔员复核，审批不能拖死流程吞吐。哪些设计符合人工监督（选所有适用项）","o":[{"l":"A","t":"高于阈值的理赔用 Step Functions 回调模式发任务令牌挂起等审批，批准后续跑"},{"l":"B","t":"全部理赔一律人工审批，一个不漏"},{"l":"C","t":"审批超时一小时未处理自动升级主管，不让流程永远挂着"},{"l":"D","t":"低金额低风险理赔由 AI 直接批，人工按比例抽检复核"},{"l":"E","t":"挂起等待期间持续占用执行资源，直到审批人处理完"}],"a":["A","C","D"],"e":"✅ 正确项：A、C、D。人工监督按风险分层落地：高风险理赔用回调模式——工作流发任务令牌挂起，审批人处理后回填令牌续走；审批配超时默认路径，超时自动升级，别让流程挂死；低风险高频动作交给 AI 直批加人工抽检，吞吐不被审批拖垮。关联考点：域 2.5.3「设计人工监督工作流，包含 AI 操作的审批机制」。\n\n❌ B：全量人工审批把低风险高频动作也压上人，吞吐被拖死，抽检与事后审计才是分层正解。\n❌ E：回调模式挂起期间不占执行资源，等待由令牌机制承接，不是持续占用。\n\n📌 关键概念：风险分层是高险审批、低险抽检、超时默认拒或升级；回调挂起不占执行。","s":"自编·2.5.3"},{"id":"D2-034","d":2,"t":"single","q":"Fabrikam 的退款审批工作流采用 Step Functions 回调模式。关于审批等待期间的状态，描述正确的是","o":[{"l":"A","t":"等待期间工作流持续轮询审批接口，消耗算力等待结果"},{"l":"B","t":"工作流发出任务令牌后挂起，等待期间不占执行，审批结果回填令牌后继续走"},{"l":"C","t":"审批人手工修改数据库状态字段来触发工作流续跑"},{"l":"D","t":"审批流程必须挂在一台常驻服务器上保活"}],"a":["B"],"e":"✅ 正确项：B。回调模式的机制：工作流执行到审批步时发出任务令牌并挂起，等待期间不占用执行资源；审批人处理完毕，把结果回填到令牌，工作流收到回调后从挂起点继续走或进拒绝分支——挂起与续跑都由托管引擎承接。关联考点：域 2.5.3「设计人工监督工作流，包含 AI 操作的审批机制」。\n\n❌ A：回调是事件驱动不是轮询，持续轮询消耗算力的说法与机制相反。\n❌ C：改数据库状态字段是自造同步机制，绕开令牌回调，挂起的工作流根本感知不到。\n❌ D：托管状态机引擎本身就持久化执行状态，不需要常驻服务器保活。\n\n📌 关键概念：任务令牌出去、人批了才续；挂起不占执行、超时有默认路径，是回调模式三要点。","s":"自编·2.5.3"},{"id":"D2-035","d":2,"t":"single","q":"Contoso 每年要开十几个新项目账号，网络基线（VPC 与子网段）和角色基线每次都要重新配，出错率不低。Account Factory 能怎么帮忙","o":[{"l":"A","t":"Account Factory 只是改名后的手工开号控制台页面"},{"l":"B","t":"账号开通后仍需人工逐项配置网络与角色基线"},{"l":"C","t":"按模板自动开号，网络、角色、基线一步到位，开通即达标准着陆区基线"},{"l":"D","t":"只支持给组织开第一个账号做初始化"}],"a":["C"],"e":"✅ 正确项：C。Account Factory 是 Control Tower 的自动开号流水线：按模板开新账号，VPC 网络、IAM 角色、日志基线一步到位，开通即达标——十几分钟出号，不必手工逐项配置，出错率与漂移都消掉。关联考点：域 2.3.1「设计包含防护栏、着陆区和自动账户开通的组织结构」。\n\n❌ A：它不是改名后的页面，而是模板化的自动开通流水线，能力完全不同。\n❌ B：人工逐项配置正是 Account Factory 要消灭的环节，与它的价值相反。\n❌ D：它面向持续开号场景，每年十几个新项目账号正是它的用武之地。\n\n📌 关键概念：Account Factory 是自动开号流水线——模板一步到位，开通即达标，着陆区基线跟着账号走。","s":"自编·2.3.1"},{"id":"D3-001","d":3,"t":"multiple","q":"某服务的负载分为三部分：常年稳定的基线、季节性高峰、可中断的批处理。架构师要优化采购成本，哪些选择合理（选所有适用项）","o":[{"l":"A","t":"常年稳定部分用 Savings Plans 或 Reserved Instances 换取承诺折扣"},{"l":"B","t":"可中断的批处理用 Spot Instances 大幅降价"},{"l":"C","t":"所有负载一律用按量付费实例，保持最大灵活"},{"l":"D","t":"预置容量只适合无法预测的场景，稳定负载不该使用"},{"l":"E","t":"季节性高峰用按需或短期容量补足，不为短暂峰值买长期承诺"}],"a":["A","B","E"],"e":"✅ 正确项：A、B、E。稳定基线用承诺型折扣、可中断批处理用 Spot、季节性峰值用按需补足，是按使用模式匹配购买选项的正确思路。关联考点：域 3.1.1「根据使用模式选择购买选项」。\n\n❌ C：全部按需会放弃承诺折扣，稳定负载的成本明显偏高。\n❌ D：预置容量适用于可预测的持续容量需求，稳定负载恰是其适用场景，这一项把话说反了。\n\n📌 关键概念：采购优化的关键是让购买方式与负载特征匹配，稳定用承诺、波动用按需、可中断用 Spot。","s":"自编·3.1.1"},{"id":"D3-002","d":3,"t":"single","q":"日志数据写入 S3 后前 30 天常被查询，之后几乎不再访问但必须保留 7 年以备审计。哪种存储策略最省成本又满足要求","o":[{"l":"A","t":"全部存 S3 Standard 并长期保留，简单但成本高"},{"l":"B","t":"30 天后直接删除对象，需要时再重新生成"},{"l":"C","t":"全部存 Glacier 即时读取类别以便随时快速读取"},{"l":"D","t":"用 S3 Intelligent-Tiering 配合生命周期，30 天后转入 Glacier 类别"}],"a":["D"],"e":"✅ 正确项：D。Intelligent-Tiering 会在访问频率变化时自动调档，配合生命周期在 30 天后转入 Glacier 归档类别，既降成本又保留 7 年满足审计。关联考点：域 3.4.1「实施智能存储分层与生命周期策略」。\n\n❌ A：全量标准存储长期保留成本最高，完全没有利用访问模式的差异。\n❌ B：审计要求保留 7 年，直接删除违反合规，且数据事后无法重建。\n❌ C：全用 Glacier 即时读取类别的费用高于分层方案，冷数据无需一直保持可即时读取。\n\n📌 关键概念：存储成本优化就是让数据随时间与访问频率自动落到合适档位，分层加生命周期是关键手段。","s":"自编·3.4.1"},{"id":"D3-003","d":3,"t":"single","q":"Contoso 的报表流水线要降本：批处理容器集群负载已验证兼容 ARM；每晚跑的小时级流程实际每步只需几十秒；凌晨零流量的接口还养着常驻容器。架构换装怎么配","o":[{"l":"A","t":"三处负载全部改写成 Lambda 函数"},{"l":"B","t":"全部长驻容器换成 Graviton 实例即可"},{"l":"C","t":"批处理容器换 Graviton 集群；小时级流程拆成快速工作流链；凌晨零流量接口改 Lambda 按毫秒计费"},{"l":"D","t":"多步流程继续用标准工作流，不动形态"}],"a":["C"],"e":"✅ 正确项：C。换装三路各对各负载：容器 JVM 脚本类负载验证兼容后换 Graviton，同负载单价直降近乎白赚；每晚的小时级流程实际是短高频任务，拆成快速工作流链，单次执行价与标准工作流差数量级；凌晨零流量接口从常驻容器改 Lambda，按毫秒计费闲置归零。关联考点：域 3.1.2「设计成本优化的架构以满足工作负载要求」。\n\n❌ A：批处理集群改写成 Lambda 既不现实也不必要，形态与负载特征错配。\n❌ B：只换芯片没动形态——短高频流程与凌晨闲置两处浪费原样留着。\n❌ D：短高频流程留在标准工作流，单次执行费比快速工作流贵一个量级，放着最大的省钱旋钮不拧。\n\n📌 关键概念：换装三路是 Graviton、工作流分档、无服务器化；先验证兼容与回本再动生产。","s":"自编·3.1.2"},{"id":"D3-004","d":3,"t":"single","q":"Fabrikam 三百台实例利用率常年只有一成、规格是当初拍的；交易网关有开盘前流量节奏。规格与扩缩容怎么优化","o":[{"l":"A","t":"把超配实例一次全砍到最小规格，省到底"},{"l":"B","t":"Compute Optimizer 体检出超配清单分步降档留观测期，交易网关开盘前定时预热加目标跟踪双层扩缩"},{"l":"C","t":"利用率低是业务属性使然，无法优化"},{"l":"D","t":"锯齿型波动的负载也一并降规格"}],"a":["B"],"e":"✅ 正确项：B。规格优化按三步走：先用 Compute Optimizer 分析利用率，出机读的超配与欠配清单；超配实例分步降档、每步留观测期，砍过会限流；交易网关这类有时刻表的负载，开盘前定时预热加指标目标跟踪双层配，夜间不闲置。关联考点：域 3.1.3「基于性能指标实施规格调整和扩缩容策略」。\n\n❌ A：一次砍到底没有观测期，流量一起来先限流，省的钱不够赔。\n❌ C：利用率一成是典型超配浪费，正是规格调整的主场，不是无解属性。\n❌ D：天生锯齿的负载该用弹性伸缩吃波动，缩规格只会让波峰更挤。\n\n📌 关键概念：机读建议先体检、分步降档留观测期、可预测节奏用定时策略；锯齿负载给弹性不给缩规格。","s":"自编·3.1.3"},{"id":"D3-005","d":3,"t":"single","q":"Contoso 的客服 AI token 账单爆了：FAQ 类问题占大头且重复率高、夜间工单批量分类不赶时效、复杂投诉才需要旗舰模型。降本怎么配","o":[{"l":"A","t":"全部流量换最便宜的小模型，投诉也降档"},{"l":"B","t":"夜间工单也走实时接口，保持链路统一"},{"l":"C","t":"FAQ 不做缓存，靠加大并发硬扛"},{"l":"D","t":"FAQ 走缓存命中直接返回，夜间工单攒批走批量接口，复杂投诉留旗舰模型"}],"a":["D"],"e":"✅ 正确项：D。AI 成本三杠杆全用上：高频重复的 FAQ 上缓存，命中直接返回、token 费不出；夜间工单分类不赶时效，攒批走批量接口按批量价算；复杂投诉保留旗舰模型，能力不掉档——质量指标持平、账单降一大截。关联考点：域 3.1.4「优化 AI/ML 工作负载成本」。\n\n❌ A：旗舰模型的复杂推理能力别为省钱降档，投诉处理降档业务受损。\n❌ B：能攒批的非实时任务不走批量价，实时接口按标准单价付费，白白多付。\n❌ C：FAQ 重复率高正说明缓存收益大，加大并发只是花更多钱处理同样的问题。\n\n📌 关键概念：AI 三杠杆是层级降档、攒批走批量价、高频问答走缓存；先评测质量差距再降档。","s":"自编·3.1.4"},{"id":"D3-006","d":3,"t":"single","q":"Fabrikam 多个应用共用同一批 Bedrock 模型，AI 成本要落到各业务单元头上。token 成本的记账口径怎么建","o":[{"l":"A","t":"用 Bedrock 的 token 用量监控，按应用与租户维度归集，各应用用量可分账"},{"l":"B","t":"只看账户级的模型调用总额记账"},{"l":"C","t":"让各应用团队自己上报调用量对账"},{"l":"D","t":"token 费统一记到中心平台账号下，不做分摊"}],"a":["A"],"e":"✅ 正确项：A。共用模型场景下，成本归集要细到按应用、按租户的 token 口径：Bedrock 的 token 用量监控提供这一层维度，哪个应用调了多少 token 可分账，再往下接到成本分摊体系，AI 账单才能落到业务单元头上。关联考点：域 3.1.4「优化 AI/ML 工作负载成本」。\n\n❌ B：账户级总额分不到应用，共用模型的成本归属直接丢失。\n❌ C：自报口径漂移、时区不一，对账对不拢，监控数据才是权威口径。\n❌ D：不分摊等于吃大锅饭，用量大的应用没有降本动力，成本治理失效。\n\n📌 关键概念：AI 成本监控要细到按应用与租户的 token 口径；缓存命中的请求注意别重复计费。","s":"自编·3.1.4"},{"id":"D3-007","d":3,"t":"single","q":"Tailspin 的全球下载站回源费高：源是 S3、静态软件包都带版本化文件名。内容分发怎么配最省","o":[{"l":"A","t":"自建多区域镜像服务器替代 CDN"},{"l":"B","t":"CloudFront 直挂自建 EC2 源站"},{"l":"C","t":"S3 源直挂 CloudFront（同区域回源免数据传输费），开 Origin Shield 收敛回源，静态包配长 TTL"},{"l":"D","t":"动态个性化页面也硬配长缓存 TTL"}],"a":["C"],"e":"✅ 正确项：C。分发降本三件一起配：S3 直挂 CloudFront 是最省的源站形态，同区域回源不产生数据传输费；Origin Shield 在边缘之上再收敛一层回源量；静态包带版本化文件名，放心配长 TTL，命中率上去回源费再降一截。关联考点：域 3.2.1「设计内容分发架构、源站选择策略、缓存策略和故障转移模式」。\n\n❌ A：自建镜像服务器把 CDN 的活自己扛，硬件与运维成本远高于托管分发。\n❌ B：直挂 EC2 源站，回源流量要付传输费，放弃 S3 直挂的免费路径。\n❌ D：动态个性化内容不可缓存，硬配长 TTL 会把每人一份的页面串味返回。\n\n📌 关键概念：S3 源免回源费、Origin Shield 收敛、长 TTL 加版本化文件名——分发三件省钱旋钮。","s":"自编·3.2.1"},{"id":"D3-008","d":3,"t":"multiple","q":"Contoso 的 ETL 集群每天经 NAT 网关搬 S3 数据，数据处理费爆表，跨可用区调用费也不低。哪些优化合理（选所有适用项）","o":[{"l":"A","t":"S3 流量改走互联网直连，绕开 NAT 网关"},{"l":"B","t":"S3 流量改走免费的网关型终端节点，不经 NAT"},{"l":"C","t":"ETL 计算与 S3 数据同可用区落位，收敛跨 AZ 费"},{"l":"D","t":"NAT 网关只保留管理流量"},{"l":"E","t":"数据库的多 AZ 高可用部署也改单 AZ，省跨 AZ 费"}],"a":["B","C","D"],"e":"✅ 正确项：B、C、D。传输路径三步归位：S3 走免费的网关型终端节点，流量不经 NAT 不出互联网；ETL 计算与所搬的 S3 数据同可用区部署，跨 AZ 调用收敛到必要交互；NAT 只留管理流量，处理费大头消掉。关联考点：域 3.2.2「优化数据传输成本」。\n\n❌ A：走互联网出网费比 NAT 处理费更贵，方向反了。\n❌ E：可用性要求跨 AZ 分布的该跨就跨——数据库多 AZ 是高可用底线，流量费给可用性让路。\n\n📌 关键概念：网关型终端节点免费、接口型按需上；同 AZ 免费跨 AZ 计费；可用性优先于流量费。","s":"自编·3.2.2"},{"id":"D3-009","d":3,"t":"single","q":"Fabrikam 的审计数据要做跨区域容灾复制，复制费要控住。复制策略怎么配","o":[{"l":"A","t":"复制规则只筛 audit 关键前缀，目标区副本按独立生命周期转低频层"},{"l":"B","t":"全桶无差别跨区复制，以防万一"},{"l":"C","t":"高频小文件逐个复制，保持副本新鲜"},{"l":"D","t":"目标区副本全部留在标准层，方便随时读取"}],"a":["A"],"e":"✅ 正确项：A。成本感知复制的两个旋钮一起拧：范围筛选——复制规则按前缀筛，只复制审计这类关键数据，非关键数据不跨区；目标区分层——副本配独立生命周期转低频层，容灾副本不占标准层费用。关联考点：域 3.2.3「配置成本感知的多区域数据复制」。\n\n❌ B：为以防万一全桶跨区，大部分数据坏了也无所谓，双倍存储费白付。\n❌ C：高频小文件逐个复制，请求费按写入计，先打包再复制更省。\n❌ D：容灾副本读取频率低，全留标准层是白付贵档位，该分层。\n\n📌 关键概念：复制费由传输、目标存储、请求三块组成；筛前缀是第一旋钮，分层副本是第二旋钮。","s":"自编·3.2.3"},{"id":"D3-010","d":3,"t":"single","q":"Contoso 二十个 VPC 组网：核心三 VPC 之间的流量最大，全部 VPC 要求互相可达，另有一个集中服务账户要给各 VPC 私有访问。组网怎么配最省钱又好管","o":[{"l":"A","t":"二十个 VPC 全部两两建对等连接"},{"l":"B","t":"全部流量统一走 Transit Gateway 处理"},{"l":"C","t":"集中服务暴露公网端点，各 VPC 走公网访问"},{"l":"D","t":"核心三 VPC 走对等零处理费，全部 VPC 挂 Transit Gateway 保可达，集中服务用 PrivateLink 按接口计费"}],"a":["D"],"e":"✅ 正确项：D。组网按流量画像选计费形态：核心三 VPC 流量最大，对等连接零数据处理费最省；全部二十个 VPC 挂 Transit Gateway 保互相可达，长尾流量付处理费换集中管理；集中服务给各 VPC 私有访问用 PrivateLink，按接口终端节点计费，不出网也不建全网互联。关联考点：域 3.2.4「设计高性价比的网络架构」。\n\n❌ A：二十个 VPC 两两对等是一百多条连接的网状拓扑，配置与运维灾难。\n❌ B：全部流量走 TGW，核心大流量也付每 GB 处理费，最贵的路给最大的流。\n❌ C：服务暴露公网，出网费与安全暴露面双输。\n\n📌 关键概念：对等零处理费管核心、TGW 管长尾保可达、PrivateLink 管服务面——三条计费形态按画像混配。","s":"自编·3.2.4"},{"id":"D3-011","d":3,"t":"single","q":"Fabrikam 的全球智能客服在各区域部署同款模型，知识库向量库与检索流量的传输费与延迟都要控。AI 传输成本怎么配","o":[{"l":"A","t":"模型集中部署在单区域，全球请求统一路由过去推理"},{"l":"B","t":"各区模型、向量库、应用同区闭环，高峰溢出请求才路由到邻近空闲区"},{"l":"C","t":"向量库集中一个区域，方便统一管理"},{"l":"D","t":"原始数据全部拉到模型所在区域统一摄取"}],"a":["B"],"e":"✅ 正确项：B。AI 传输的第一优先是同区闭环：各区部署同款模型，知识库向量随区复制，检索与推理流量不出区；高峰期单区容量不足时，才把溢出请求路由到邻近空闲区执行——跨区只发生在溢出时刻，延迟与费用都控住。关联考点：域 3.2.5「优化 AI/ML 工作负载的数据传输成本」。\n\n❌ A：全球请求都跑一个区，检索流量跨区付费又慢，传输费与延迟双输。\n❌ C：向量库集中意味着每次检索都跨区，是最常见的隐性成本来源。\n❌ D：摄取管道应就近在数据所在区域跑，把大数据集拉到模型区，传输费把省的钱吃回去。\n\n📌 关键概念：模型向量同区闭环优先，跨区推理路由只在单区容量不足或各区利用率差明显时启用。","s":"自编·3.2.5"},{"id":"D3-012","d":3,"t":"single","q":"Contoso 四条业务线、十几个项目共用云平台，财务要求按业务线结算云成本。标签地基怎么打","o":[{"l":"A","t":"等资源都跑起来，再组织人力批量补标签"},{"l":"B","t":"键设计越全越好，一次定二十个维度覆盖所有信息"},{"l":"C","t":"定业务单元、项目、环境、负责人四个核心键、值域枚举，基础设施即代码创建时统一打标，周报盯覆盖率"},{"l":"D","t":"键值由各团队自由命名，灵活优先"}],"a":["C"],"e":"✅ 正确项：C。标签地基四步打牢：键设计取业务单元、项目、环境、负责人四个核心键，值域定成枚举防自由发挥；打点时机放在创建时——基础设施即代码里统一带标签，事后补标漏率高；覆盖核对按周盯未标资源清零；账号本身也是分摊维度时可做一级、标签做二级细分。关联考点：域 3.3.1「为成本分摊设计标签策略」。\n\n❌ A：回头补标比同步打标贵数倍，技术债越滚越大。\n❌ B：二十个键的报表没人看，核心四键先跑通，键太碎是给自己找麻烦。\n❌ D：自由命名会出同义不同拼，摊账口径直接乱掉。\n\n📌 关键概念：四键地基加值域枚举加创建时打标；先跑通核心键，标签覆盖率是摊账的生命线。","s":"自编·3.3.1"},{"id":"D3-013","d":3,"t":"single","q":"Fabrikam 的财务月报要出「业务线乘服务乘环境」三维账单，还有自定义的摊账规则。报告方案怎么配","o":[{"l":"A","t":"只用 Cost Explorer 控制台逐次筛选后截图存档"},{"l":"B","t":"CUR 逐行账单数据落 S3，经 Athena 出三维账单，成本类别把分组规则固化，月报自动化"},{"l":"C","t":"手工整理各服务控制台的计费页面数据"},{"l":"D","t":"标签覆盖率刚到六成，先把报表体系建起来，标签边用边补"}],"a":["B"],"e":"✅ 正确项：B。两层数据分工：交互看趋势用 Cost Explorer，自定义口径的深度摊账要用 CUR——逐行级账单数据带标签与折扣明细落 S3，Athena 直接 SQL 出三维账单；成本类别把「谁看哪组成本」的分组规则固化，月报自动化出。关联考点：域 3.3.2「配置使用详细账单数据的成本报告与分析方案」。\n\n❌ A：控制台截图是手工脉冲式取数，自定义口径的三维摊账做不了，也谈不上自动化。\n❌ C：手工抄计费页不可持续且口径对不拢，深度分析没有数据源。\n❌ D：标签没打齐就建报表是垃圾进垃圾出，先补齐标签再上报表体系。\n\n📌 关键概念：交互看 Explorer、深分析走 CUR 加 Athena；跨月对账按数据日期口径。","s":"自编·3.3.2"},{"id":"D3-014","d":3,"t":"single","q":"Contoso 要求所有新资源创建时必须带业务单元标签，存量资源也要清理。标签强制怎么落地","o":[{"l":"A","t":"发通知要求各团队自觉打标"},{"l":"B","t":"用标签策略就能强制必打"},{"l":"C","t":"起步第一天就全资源类型 SCP 硬拦"},{"l":"D","t":"先用 Config 的 required-tags 规则清存量，再上 SCP 拒绝无标签创建，从实例与存储等费用大头逐步扩"}],"a":["D"],"e":"✅ 正确项：D。标签强制三段推进：事中 Config 的 required-tags 托管规则持续查出未标资源，先把存量清零；事前上 SCP，无必填标签的创建动作直接拒绝，新资源从「漏打」变「创建不了」；范围从费用大头（实例、对象存储、数据库）起步逐步扩，摊账覆盖率稳住。关联考点：域 3.3.3「为成本分摊实施基于策略的标签强制」。\n\n❌ A：靠自觉的标签治理必漏，覆盖率永远追不上资源增速。\n❌ B：标签策略管键名拼写与值域规范性，必打强制是 SCP 的职责，两者互补不是替代。\n❌ C：起步就全类型硬拦，存量没清完会把正常业务也拦停。\n\n📌 关键概念：强制三段是事前 SCP 拦、事中 Config 查、值域标签策略管；先软约束清存量再硬拦。","s":"自编·3.3.3"},{"id":"D3-015","d":3,"t":"multiple","q":"Fabrikam 要把共享平台成本分摊到各业务线落地。哪些做法合理（选所有适用项）","o":[{"l":"A","t":"先 showback 亮账半年让各业务线认账，再转 chargeback 真扣钱"},{"l":"B","t":"第一个月就直接 chargeback 硬扣，快速建立成本意识"},{"l":"C","t":"共享数据平台成本按存储量拆分，CUR 里带明细"},{"l":"D","t":"Bedrock 的 token 费按应用维度归集到调用方"},{"l":"E","t":"摊账规则由技术团队单方面定死后直接执行"}],"a":["A","C","D"],"e":"✅ 正确项：A、C、D。分摊落地三件正确姿势：先 showback 后 chargeback——亮账半年让业务线认账，再真扣钱阻力最小；共享成本按实际用量指标拆分（存储按容量），CUR 逐行明细支撑；AI 的 token 费按应用维度归集到调用方，谁调用谁担费。关联考点：域 3.3.4「实施费用返还和成本展示能力」。\n\n❌ B：直接硬扣钱，业务线没认过账的口径立刻起争议，阻力最大化。\n❌ E：按用户数还是按调用量摊是管理决策不是技术决策，要业务认账后执行。\n\n📌 关键概念：先亮后扣、共享成本按用量拆、AI token 按应用归集；缓存命中注意别重复计费。","s":"自编·3.3.4"},{"id":"D3-016","d":3,"t":"single","q":"Contoso 的共享平台（数据平台加 AI 模型服务）成本要摊给各业务线，但「按什么摊」争执不下。正确的处理方式是","o":[{"l":"A","t":"按各业务线人头数等分，最简单直接"},{"l":"B","t":"技术团队直接定死按 CPU 时长摊，定了就执行"},{"l":"C","t":"摊账规则作为管理决策由业务认账后固化，存储按容量、AI 按调用量分维度拆分，CUR 带明细支撑"},{"l":"D","t":"共享成本不分摊，全记在平台团队头上"}],"a":["C"],"e":"✅ 正确项：C。共享成本摊账的正确路径：规则先过业务认账——按用户数还是按调用量是管理决策；认账后按维度拆分固化，存储按容量、AI 按调用量，CUR 的逐行明细支撑每一笔归属；口径透明可复算，争议自然落地。关联考点：域 3.3.4「实施费用返还和成本展示能力」。\n\n❌ A：人头等分与实际用量无关，用得少的业务线补贴用得多的，账面必起争议。\n❌ B：技术单方面定死规则，业务没认账的口径执行不下去，摊账是管理决策。\n❌ D：全记平台团队，各业务线对成本无感知，降本动力归零，分摊失去意义。\n\n📌 关键概念：摊账规则是管理决策——先认账后固化；按用量维度拆分、明细可复算。","s":"自编·3.3.4"},{"id":"D3-017","d":3,"t":"single","q":"Tailspin 的成本监控要求：月度预算不能爆、某测试环境深夜跑出三倍推理量这类异常要尽快发现。方案怎么配","o":[{"l":"A","t":"按业务线与项目分层设预算三档告警，异常检测用学习基线盯单日突增并过滤正常波动，告警接工单到责任人"},{"l":"B","t":"只设一个账户级总预算告警"},{"l":"C","t":"异常靠运维每日人工翻账单比对"},{"l":"D","t":"告警统一发给全员邮件列表"}],"a":["A"],"e":"✅ 正确项：A。成本监控三层闭环：预算层按业务线与项目分层设阈值、分档逐级告警——只设总账会出现「总量正常但某条线爆了」的盲区；异常层用 Cost Anomaly Detection 的学习基线分离真异常与正常波动，深夜三倍推理量这类突增能被机器学习基线抓出来；闭环层告警接通知与工单，责任人明确。关联考点：域 3.3.5「配置成本监控和告警方案，包含预算阈值和异常检测」。\n\n❌ B：总账正常不代表局部正常，分层预算才看得见局部爆雷。\n❌ C：人工翻账单既慢又不持续，深夜突增等看到已隔天。\n❌ D：全员邮件没有责任人闭环，收到的人不知道该干什么，告警等于没报。\n\n📌 关键概念：预算分层三档告警、异常靠学习基线分离波动、告警必须接闭环责任人。","s":"自编·3.3.5"},{"id":"D3-018","d":3,"t":"single","q":"Contoso 做 EBS 体检发现：三百个 gp2 旧卷在产、一个报表数据库「小盘要高 IOPS」被迫配了大容量卷、核心账务库要求稳定超低延迟。卷型怎么配","o":[{"l":"A","t":"全部卷换成 io 系列顶配，一步到位"},{"l":"B","t":"gp2 旧卷全换 gp3 同规格直降，报表库走 gp3 独立配 IOPS 不买大容量，核心账务库用 io 系列"},{"l":"C","t":"小盘要高 IOPS 只能靠买大容量卷解决"},{"l":"D","t":"快照全部无限期保留以备不时之需"}],"a":["B"],"e":"✅ 正确项：B。块存储三类负载三种卷型：在产 gp2 换 gp3 是白赚——官方支持直接换、同规格单价下降；gp3 的基线性能与容量解耦，报表库按需独立买 IOPS，不再为性能被迫买大容量；核心账务库的稳定超低延迟才上 io 系列。关联考点：域 3.4.2「通过选择适当卷类型和配置适当的 IOPS 优化块存储成本」。\n\n❌ A：通用负载上 io 顶配贵一个量级，为不需要的性能买单。\n❌ C：gp3 的 IOPS 独立配置正是为解耦这一点设计，「只能买大容量」把机制讲反了。\n❌ D：快照增量存储但数量失控照样费钱难管，按周期清理过期快照。\n\n📌 关键概念：gp2 换 gp3 白赚、gp3 性能与容量解耦、io 留给延迟敏感的核心库。","s":"自编·3.4.2"},{"id":"D3-019","d":3,"t":"single","q":"Fabrikam 的数据库组合四类画像：购物车表流量稳定偏高、营销活动库只在活动期起伏、主交易库要长跑三年、日志分析库 I/O 费占账单六成。容量怎么配","o":[{"l":"A","t":"全部换 Aurora Serverless 统一形态最灵活"},{"l":"B","t":"日志分析库维持标准计费不动"},{"l":"C","t":"主交易库按月付费不留承诺"},{"l":"D","t":"购物车表预置加自动扩缩容，活动库 Aurora Serverless 吃起伏，主交易库锁三年承诺，日志分析库换 Aurora I/O-Optimized"}],"a":["D"],"e":"✅ 正确项：D。容量模式按画像逐库配：稳定偏高流量用预置模式加自动扩缩容，防尖峰兜底；活动期起伏与间歇负载用 Aurora Serverless，闲时近乎零费；长跑三年的主交易库锁预留或 Savings Plans 承诺折扣；I/O 费占六成的日志分析库换 Aurora I/O-Optimized——存储与计算费用上调、I/O 零费，总账反降。关联考点：域 3.4.3「通过选择适当的容量模式和预留容量优化数据库成本」。\n\n❌ A：满载负载按量价是溢价，稳定高流量的购物车表用 Serverless 反而更贵。\n❌ B：I/O 占账单六成正是 I/O-Optimized 的适用画像，不动等于白付大头。\n❌ C：长跑一年以上不锁承诺，按月价白白放弃折扣。\n\n📌 关键概念：容量四态按需兜底、预置稳态、Serverless 波动、承诺锁长跑；I/O 重的库算 I/O-Optimized 的账。","s":"自编·3.4.3"},{"id":"D3-020","d":3,"t":"single","q":"Contoso 的备份策略要同时满足：合规月备保七年、日备要能快速恢复、跨区副本费要控住。保留策略怎么配","o":[{"l":"A","t":"全部备份一律跨区复制保安全"},{"l":"B","t":"日备月备统一保留七年对齐合规口径"},{"l":"C","t":"日备保三十天、周备保十二周、月备保七年阶梯到期自动删，跨区副本只留周备档，EBS 快照经 DLM 自动清过期"},{"l":"D","t":"快照手工清理，等存储告警再删"}],"a":["C"],"e":"✅ 正确项：C。备份降本三旋钮一起拧：分级保留——日备、周备、月备阶梯保留各自对齐恢复目标与合规，到期自动删；跨区按需——副本只留周备档这类关键，不全量跨区（那是双倍存储费）；自动化——DLM 管快照生命周期，过期自动清理，数量不失控。关联考点：域 3.4.4「实施采用成本优化保留策略的备份和灾难恢复机制」。\n\n❌ A：全量跨区复制是双倍存储费，多数数据坏了也无所谓，按真会切换的灾备范围配。\n❌ B：日备也保七年，合规没要求的部分白付七年存储，保留期该分级。\n❌ D：快照手工清理数量必失控，这是常见的隐性成本来源。\n\n📌 关键概念：日周月阶梯保留、跨区只留关键档、DLM 自动清快照；保留期对齐恢复目标而非越长越安全。","s":"自编·3.4.4"},{"id":"D3-021","d":3,"t":"single","q":"Fabrikam 的可观测性费用随规模线性上涨，要把观测费降下来但不许牺牲排障能力。怎么做","o":[{"l":"A","t":"调试级日志不上生产、健康检查日志经订阅过滤丢弃，每实例指标聚成集群级，排障热日志短留、审计日志转 S3 归档层长留"},{"l":"B","t":"为省钱先砍延迟类黄金指标"},{"l":"C","t":"审计日志的保留期按省钱原则定得越短越好"},{"l":"D","t":"负载均衡健康检查日志全量保留以备万一"}],"a":["A"],"e":"✅ 正确项：A。可观测性三杠杆一起用：日志过滤——调试级不采、健康检查日志订阅过滤丢弃，看了也排不了障的日志不花钱；指标聚合——高基数维度合并，每实例明细聚成集群级时序；保留分级——排障热数据短期留、审计数据转 S3 归档层长留，分级各归其位，黄金指标一个不少。关联考点：域 3.4.5「设计高性价比的可观测性方案」。\n\n❌ B：砍黄金指标省的是小钱，排障时缺数据的代价更大。\n❌ C：审计类日志的保留是合规决定的，不是成本决定的，先问合规底线。\n❌ D：健康检查日志采了也排不了障，全量保留是纯花钱。\n\n📌 关键概念：三杠杆是滤日志、聚指标、分保留；高基数指标最贵——每个维度组合一条时序。","s":"自编·3.4.5"},{"id":"D4-001","d":4,"t":"single","q":"业务要求灾难时 15 分钟内恢复、数据丢失不超过 5 分钟，但预算有限。架构师应如何从 RTO 与 RPO 出发设计方案","o":[{"l":"A","t":"直接选最贵的全量热备，不考虑需求差异"},{"l":"B","t":"先与业务确认 RTO 与 RPO，再据此选择满足指标的灾难恢复策略并核算成本"},{"l":"C","t":"先定技术架构，再倒推 RTO 与 RPO 让业务接受"},{"l":"D","t":"只做定期备份即可，任何 RT
