、定边界、定演进路线 | 要定「用什么形态」而不是「怎么写」时 |\n\n对照只用来迁移已有理解。做题以本域官方口径为准。\n\n### 官方口径的三条边界\n\n- 官方 Exam Guide 给出技能点编号与原文，不给逐考点的出现频率。\n- 官方认证页写明题型含单选与多选，多选必须全选对才得分。\n- 及格线 720 分（100–1000 补偿式计分），不要求每域单独达线。\n\n#### 这一节学什么\n这一节对应考纲任务 1.1「设计专为云构建的架构」。\n\n> 官方原名：Design architectures built for the cloud.\n\n这一任务是全域的底盘：应用形态、消息模式、工作流、容器、入口与边缘、多租户都从这里长出来。十三个技能点从消息与状态讲到管道与工作流，再到容器编排与镜像治理，然后是扩缩容与入口流量，最后覆盖边缘、实时与多租户。主线是：消息与状态 → 管道与工作流 → 容器与镜像 → 扩缩容与入口 → 边缘与实时 → 多租户隔离。\n\n#### 设计事件驱动架构，使用恰当的消息传递模式\n\n> 官方原名：Design event-driven architectures that use appropriate messaging patterns such as idempotency, ordering, and delivery guarantees (for example, by using Amazon EventBridge, Amazon SQS FIFO queues and standard queues, Amazon SNS, Amazon Kinesis with partition keys).\n\n**这条在问什么。** 考题给你「订单事件不能乱序、重复消息不能重复扣款、消息不能丢」这类业务约束，让你把消息模式配对。\n\n**定义**：事件驱动架构用事件的产生与消费代替点对点调用。三个消息模式是硬考点——幂等（重复消费不出错）、排序（先来后到）、投递保证（消息到没到的口径）。\n\n**怎么运作**。四个服务各管一段：\n\n- EventBridge：事件路由总线，按规则把事件分发到目标，长于应用集成与跨账号投递。\n- SQS 标准队列：至少一次投递，可能乱序与重复，吞吐最大。\n- SQS FIFO 队列：按消息组保序，配去重 ID 在窗口内不重复投递。\n- SNS：扇出到多订阅者；Kinesis 按分区键保序，同一键进同一分片。\n\n**什么时候用，什么时候别用**。强排序（订单状态机）用 FIFO 或 Kinesis 分区键。高吞吐可容忍重复（埋点）用标准队列，消费端做幂等。「恰好一次」常用两条路：FIFO 加去重，或至少一次加倍消费幂等——后者更通用，代价是消费逻辑多写一层。消息不丢的硬保障靠死信队列留存与重放设计，别指望单靠服务本身。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的订单流要求「同订单事件不乱序、不重复扣款」。方案是 Kinesis 按订单号做分区键，消费端按订单号加锁幂等；埋点走标准队列，重复消息直接丢弃。\n\n**关联服务**：Amazon EventBridge、Amazon SQS（标准/FIFO）、Amazon SNS、Amazon Kinesis、死信队列。\n\n#### 设计无状态应用，使用外部化状态管理\n\n> 官方原名：Design stateless applications that use externalized state management (for example, by using Amazon DynamoDB, Amazon S3, Amazon ElastiCache).\n\n**这条在问什么。** 考题给你「实例随时会被替换、会话不能丢、扩容要横向」这类约束，让你把状态从计算层剥出来。\n\n**定义**：无状态应用把会话与业务状态放到外部存储，计算单元本身不带状态，随便加、随便换。外部化状态管理就是给不同状态选对去处。\n\n**怎么运作**。三个去处各管一类状态：\n\n- DynamoDB：结构化业务状态与会话，毫秒级读写，按分区键水平扩。\n- S3：大对象与文件类状态，天然持久、按量廉价。\n- ElastiCache：热点会话与缓存，亚毫秒响应，但丢了要能重建。\n\n**什么时候用，什么时候别用**。计算层要随意伸缩、蓝绿替换、突发缩容，无状态是前提。会话要求亚毫秒，放 ElastiCache；丢了能重建才敢放缓存，放不了重建的进 DynamoDB。本地盘存状态只在「实例不换、丢了能重来」的场景才可接受。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的电商应用从「实例本地存会话」改造：会话入 DynamoDB 带 TTL 自动过期，购物车入 ElastiCache，图片直传 S3。替换实例不丢任何会话，扩容从改配置变成点按钮。\n\n**关联服务**：Amazon DynamoDB（TTL）、Amazon S3、Amazon ElastiCache。\n\n#### 设计无服务器数据处理与分析管道\n\n> 官方原名：Design serverless data processing and analysis pipelines (for example, by using Amazon Kinesis Data Streams, AWS Glue, Amazon Athena, AWS Lambda).\n\n**这条在问什么。** 考题给你「数据流进来要边收边处理，还要能即席查询，不想管任何服务器」这类场景，让你拼无服务器管道。\n\n**定义**：无服务器管道的每一环都是托管服务——摄入、转换、查询都不碰基础设施。Kinesis Data Streams 收实时流，Lambda 做轻转换，Glue 管目录与重型 ETL，Athena 直接对 S3 跑 SQL。\n\n**怎么运作**。四环各管一段：\n\n1. 摄入：Kinesis Data Streams 分片收实时流，或 S3 直收文件。\n2. 转换：Lambda 按事件触发做轻转换，重活交给 Glue 任务。\n3. 目录：Glue Data Catalog 给数据建表元数据，供下游查询。\n4. 查询：Athena 按需 SQL 扫描 S3，按扫描量计费。\n\n**什么时候用，什么时候别用**。数据量中等、要即席分析、不想养集群，无服务器管道最划算。稳定大流量的重型 ETL，用 EMR 这类集群单位成本更低。Athena 按扫描计费——大表不分区不压缩，查询费会失控。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的日志分析从「每晚批处理虚拟机」改无服务器：日志入 S3 按日期分区分层，Glue 爬虫建目录，Athena 直接查。当天数据五分钟可查，成本从包月虚拟机变成按扫描付费。\n\n**关联服务**：Amazon Kinesis Data Streams、AWS Lambda、AWS Glue（目录与 ETL）、Amazon Athena。\n\n#### 设计具有持久执行模式的多步骤工作流\n\n> 官方原名：Design multi-step workflows that have durable execution patterns (for example, by using AWS Step Functions, durable Lambda functions).\n\n**这条在问什么。** 考题给你「跨小时跨天的多步流程，中间断了要从断点续跑」这类需求，让你选持久执行形态。\n\n**定义**：持久执行（durable execution）指工作流状态由引擎持久化，崩溃后从最近一步恢复。Step Functions 是托管状态机引擎；Lambda 单函数最长跑十五分钟，长流程不能靠单函数硬扛。\n\n**怎么运作**。三种形态各管一段：\n\n1. 标准工作流：状态持久化，最长跑一年，支持人工审批回调。\n2. 快速工作流：毫秒级启动、高吞吐，单次执行上限五分钟。\n3. 持久 Lambda：检查点存外部（如 DynamoDB），函数自己做断点续跑，适合不想引入状态机的团队。\n\n**什么时候用，什么时候别用**。跨账号审批、长事务、含人工环节，上标准工作流。纯高速短任务（每秒上千次）上快速工作流。只有两三步且无人工环节，Lambda 直连接口即可，别为「看着高级」硬上状态机。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的开户流程含征信查询、风控审核、人工复核三个环节，整体跑两天。Step Functions 标准工作流串起来，人工步用回调挂起；征信接口超时自动重试两次，断点不用自己存。\n\n**关联服务**：AWS Step Functions（标准/快速工作流）、AWS Lambda（检查点模式）。\n\n#### 实现跨账户和跨区域的事件路由模式\n\n> 官方原名：Implement cross-account and cross-Region event routing patterns that use event buses and event forwarding.\n\n**这条在问什么。** 考题给你「生产账号的事件要让审计账号、监控账号都收到，多区域事件要汇总」这类场景，让你配事件路由。\n\n**定义**：事件总线（event bus）是 EventBridge 的路由枢纽。跨账户路由靠「目标账户总线授权来源账户投递」；跨区域靠「区域间转发汇到中心区域」。\n\n**怎么运作**。两段路由各管一段：\n\n1. 跨账户：目标账户总线先授权放行，来源账户的规则再把事件投过去。\n2. 跨区域：各区域总线把事件转发到中心区域总线，中心统一消费入湖。\n\n**什么时候用，什么时候别用**。集中审计与安全监控必须跨账户收事件。跨区域转发只在「必须单点消费全区域事件」时做——每多一跳转发就多一跳延迟与成本。单向够用就别配双向回环，事件风暴时会放大。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 十几个业务账号向安全账号的总线投安全事件，审计账号再从安全账号订阅一份；两个海外区域的事件先汇到总部区域再统一入湖。跨账户授权用资源策略一行配置。\n\n**最小配置示意**（教学示意；账号 ID 换成自己的成员账号）：\n\n```\naws events put-permission \\\n  --event-bus-name security-events \\\n  --action events:PutEvents \\\n  --principal <成员账号ID> \\\n  --statement-id AllowMemberApps\n```\n\n**关联服务**：Amazon EventBridge（事件总线与授权）、跨区域事件目标。\n\n#### 使用托管服务设计微服务的容器编排\n\n> 官方原名：Design container orchestration for microservices by using managed services (for example, Amazon EKS, Amazon ECS, AWS Fargate).\n\n**这条在问什么。** 考题给你「几十个微服务要编排、团队有 Kubernetes 经验但不想管控制面」这类约束，让你选编排形态。\n\n**定义**：容器编排管容器的调度、伸缩与联网。Amazon EKS 是托管的 Kubernetes；Amazon ECS 是 AWS 原生编排；AWS Fargate 是「无节点」的容器运行层，可挂在前两者上。\n\n**怎么运作**。三种形态各管一段：\n\n- EKS：标准 Kubernetes 生态，会 k8s 的团队迁移顺滑，部分插件与运维自己兜。\n- ECS：更轻的 AWS 原生编排，控制面托管到底，与 IAM 和负载均衡集成直。\n- Fargate：把「节点」也托管掉，按任务规格付费，无节点补丁与容量规划。\n\n**什么时候用，什么时候别用**。团队有 Kubernetes 基因、要吃其生态（Operator、Helm），选 EKS。纯 AWS 技术栈、要最少运维，选 ECS。不想管任何节点、负载中等，上 Fargate。大型常驻计算或特殊内核需求，自管节点池反而更省。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的平台团队从自建 k8s 迁到 EKS 保留 Operator 生态；无状态边缘服务跑 ECS 加 Fargate 不养节点。两种形态并存，网关统一接入。\n\n**关联服务**：Amazon EKS、Amazon ECS、AWS Fargate、Amazon ECR（镜像仓）。\n\n#### 设计服务网格架构，促进微服务通信与可观测性\n\n> 官方原名：Design service mesh architectures that facilitate microservice communication and observability (for example, by using Amazon VPC Lattice, Amazon ECS Service Connect).\n\n**这条在问什么。** 考题给你「服务间调用要统一鉴权、加密、灰度与流量观测，不想每个服务自己实现」这类需求，让你选网格形态。\n\n**定义**：服务网格（service mesh）把服务间通信的连接、安全与观测下沉到基础设施层，应用代码不改。VPC Lattice 是面向 VPC 的托管服务网络；ECS Service Connect 是 ECS 的服务间连接层。\n\n**怎么运作**。三件事各管一段：\n\n1. 连接：服务按「逻辑名」互调，网格做发现与路由，跨 VPC 跨账号也可达。\n2. 安全：网格层做双向认证与访问策略，服务自身零改造。\n3. 观测：调用的成功率、时延与拓扑在网格层统一采集。\n\n**什么时候用，什么时候别用**。服务数多、跨 VPC 跨账号、要统一流量治理，上 VPC Lattice。ECS 内部互通用 Service Connect 开箱得观测。三五个服务用负载均衡加服务发现就够，上网格是给自己加运维税——多一层抽象就多一套排障视角。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的结算与账单服务分居两个 VPC。用 VPC Lattice 服务网络连通，调用走逻辑名与 IAM 策略鉴权，灰度切流在网格层配；ECS 老服务用 Service Connect 补齐加密与指标。\n\n**关联服务**：Amazon VPC Lattice、Amazon ECS Service Connect、Amazon Cloud Map（轻量发现替代）。\n#### 通过配置安全扫描和生命周期策略管理容器镜像\n\n> 官方原名：Manage container images by configuring security scans and lifecycle policies (for example, by using Amazon ECR).\n\n**这条在问什么。** 考题给你「镜像越积越多、老镜像有漏洞要拦、仓库费用要控」这类场景，让你配镜像治理。\n\n**定义**：Amazon ECR（Elastic Container Registry）是托管容器镜像仓。安全扫描在推送时找漏洞；生命周期策略按规则自动清理旧镜像。\n\n**怎么运作**。三件事各管一段：\n\n1. 扫描：仓库开推送即扫，漏洞按严重度分级列出。\n2. 拦截：发现高危漏洞，发布管道设卡拦下，修完再放行。\n3. 清理：生命周期策略按「保留最近几个标签或天数」自动删旧镜像。\n\n**什么时候用，什么时候别用**。镜像更新频繁、合规要求漏洞可见，扫描必开。基础镜像来自第三方共享库时别过度自扫——重复扫费时费力，用上游扫描结果即可。清理策略可以大胆配：镜像重建成本低，保留过多只涨存储费；但生产在用的标签要排除在清理之外。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 每天产出几十个镜像版本。仓库全开推送即扫，管道设「高危不过」的门禁；生命周期策略保最近十个标签，生产标签永久保留，仓库体积稳定不失控。\n\n**最小配置示意**（教学示意；保留数量与规则按自己的发布节奏调）：\n\n```\naws ecr put-lifecycle-policy \\\n  --repository-name app-repo \\\n  --lifecycle-policy-text '{\n    \"rules\": [\n      { \"rulePriority\": 1, \"description\": \"keep-last-10\",\n        \"selection\": { \"tagStatus\": \"tagged\", \"countType\": \"imageCountMoreThan\", \"countNumber\": 10 },\n        \"action\": { \"type\": \"expire\" } }\n    ]\n  }'\n```\n\n**关联服务**：Amazon ECR（扫描与生命周期策略）、Amazon Inspector（增强扫描）、发布管道门禁。\n\n#### 为无服务器和容器化工作负载设计自动扩缩容模式\n\n> 官方原名：Design auto scaling patterns for serverless and containerized workloads (for example, by using Lambda concurrency, Horizontal Pod Autoscaler, Cluster Autoscaler, Amazon ECS service auto scaling, AWS Application Auto Scaling).\n\n**这条在问什么。** 考题给你「流量早晚差十倍、容量要自动跟、还要防雪崩与抖动」这类场景，让你配多层扩缩容。\n\n**定义**：自动扩缩容按信号加减容量。Lambda 按并发调；容器分 Pod 层与节点层；Application Auto Scaling 是统一的策略引擎。\n\n**怎么运作**。三层各管一层：\n\n- Lambda 并发：预留并发保关键函数，账户并发上限留余量，突发受限靠队列削峰。\n- Pod 层：HPA（水平 Pod 自动扩缩容）按 CPU、内存或自定义指标加减 Pod。\n- 节点层：Cluster Autoscaler 按排不下的 Pod 加减节点；ECS 服务自动扩缩容按目标跟踪调任务数。\n\n**什么时候用，什么时候别用**。流量可预测用定时扩缩容做预热；突发不可预测用目标跟踪。扩容要快、缩容要慢，防抖动。预留并发是资源抢占，给关键函数要克制——全预留等于没有弹性池。冷启动敏感的突发流量，预置并发或常驻预热是「花代价买稳定」的权衡。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的盘前行情查询流量差十倍。关键 Lambda 函数预留并发打底，超发部分进队列削峰；EKS 上 HPA 按查询速率调 Pod，Cluster Autoscaler 补节点；缩容等待期拉长，收盘后缓慢回落不抖动。\n\n**关联服务**：AWS Lambda（并发管理）、Horizontal Pod Autoscaler、Cluster Autoscaler、Amazon ECS 服务自动扩缩容、AWS Application Auto Scaling。\n\n#### 设计入口流量模式，针对特定使用模式优化资源\n\n> 官方原名：Design ingress patterns and optimize resources for specific usage patterns (for example, Application Load Balancer, Network Load Balancer, AWS Load Balancer Controller, Amazon API Gateway).\n\n**这条在问什么。** 考题给你「入口流量是 HTTP 还是 TCP、要不要按路径分流、容器入口谁来管」这类问题，让你选入口形态。\n\n**定义**：入口（ingress）是流量进系统的第一站。ALB（应用负载均衡器）按 HTTP 内容分流；NLB（网络负载均衡器）按连接四层直通；AWS Load Balancer Controller 把负载均衡器接进 Kubernetes；Amazon API Gateway 是 API 的托管门面。\n\n**怎么运作**。三种入口各管一段：\n\n- ALB：按路径、主机、头部路由到目标组，容器场景由控制器自动挂载。\n- NLB：四层直通，静态 IP 与超低延迟，长连接与 TCP 协议用。\n- API Gateway：鉴权、限流、版本、计费在门口统一做完。\n\n**什么时候用，什么时候别用**。HTTP 微服务入口用 ALB；要静态 IP 或非 HTTP 协议用 NLB；对外 API 要治理（密钥、限流、监控）上 API Gateway。三者不互斥——常见组合是「API Gateway 接外部、ALB 转内部」。Kubernetes 里用控制器把 Ingress 声明翻译成均衡器规则，别手工双写。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的开放平台：外部走 API Gateway 限流与管密钥，内部微服务入口是 ALB，Kubernetes 里由 Load Balancer Controller 声明式挂目标组；私有 TCP 长连接走 NLB 的静态 IP。\n\n**关联服务**：Application Load Balancer、Network Load Balancer、AWS Load Balancer Controller、Amazon API Gateway。\n\n#### 设计边缘架构以满足时延要求\n\n> 官方原名：Design edge architectures to meet latency requirements (for example, by using Amazon CloudFront Functions, Lambda@Edge).\n\n**这条在问什么。** 考题给你「全球用户、首字节要快、部分逻辑要贴着用户跑」这类时延约束，让你把内容与轻逻辑搬到边缘。\n\n**定义**：边缘架构把内容与轻逻辑放到离用户最近的节点。CloudFront Functions 跑亚毫秒级小函数（改头、改写、轻鉴权）；Lambda@Edge 在区域边缘跑更重的请求响应改写。\n\n**怎么运作**。三层分工：\n\n1. 缓存层：内容在边缘节点命中即回，不回源。\n2. 轻逻辑：CloudFront Functions 在节点上改写请求与响应，纳秒级执行。\n3. 重逻辑：Lambda@Edge 在区域边缘做认证代理、按地理位置分流这类要算力的活。\n\n**什么时候用，什么时候别用**。全球静态内容分发与头部改写，CloudFront Functions 足够。要查数据库或做复杂校验，Lambda@Edge 也只适合轻依赖——重业务逻辑别塞边缘，冷启动与区域带宽会放大代价。「必须新鲜」的数据别推到边缘缓存。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的全球营销页：图片与字体全走 CDN 缓存；URL 改写与请求头规范用 CloudFront Functions 在节点完成；按地理位置分流到不同落地页交给 Lambda@Edge。首字节时延从跨洲回源压到近端命中。\n\n**关联服务**：Amazon CloudFront、CloudFront Functions、Lambda@Edge。\n\n#### 设计支持实时数据处理的架构，使用 WebSocket 和发布订阅模式\n\n> 官方原名：Design architectures that support real-time data processing by using WebSocket and publish-subscribe patterns (for example, by using API Gateway WebSocket APIs).\n\n**这条在问什么。** 考题给你「双向实时通信：服务端要能主动推、客户端也要发」这类需求，让你选实时通道。\n\n**定义**：WebSocket 是全双工长连接协议，两端可互推。API Gateway 的 WebSocket API 把连接管理与消息路由托管掉。\n\n**怎么运作**。三件事各管一段：\n\n1. 连接管理：网关管握手与保活，每个连接发一个连接 ID。\n2. 路由：消息按路由键进不同后端处理。\n3. 主动推：服务端拿连接 ID 经网关回推——服务端找客户端的路由此打通。\n\n**什么时候用，什么时候别用**。双向高频推送（协作编辑、行情、聊天）用 WebSocket。单向广播（通知、快照）用扇出订阅更省。连接规模特别大时要先评估网关配额与连接成本，必要时分层接入。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的协作看板：客户端操作经 WebSocket 上行广播给同房间其他端；服务端变更由后端拿连接 ID 主动推。断线重连带状态恢复，房间路由用路由键直连对应处理函数。\n\n**关联服务**：Amazon API Gateway（WebSocket API）、AWS Lambda（路由处理）。\n\n#### 设计多租户架构，使用租户隔离模式\n\n> 官方原名：Design multi-tenant architectures that use tenant isolation patterns (for example, siloed or pooled resources, Amazon Cognito tenant context, row-level security, tenant-specific encryption).\n\n**这条在问什么。** 考题给你「一套系统服务多个客户，成本要摊、数据绝不能串」这类约束，让你选隔离模式。\n\n**定义**：多租户（multi-tenant）是一套基础设施服务多个客户。隔离模式从独享（每租户独立栈）到共享（全租户共用池）是个谱系：越靠独享隔离越强、成本越高。\n\n**怎么运作**。四层隔离各管一段：\n\n1. 资源层：独享、分区、共享三档，按客户档位与合规要求选。\n2. 身份层：Cognito 把租户上下文写进令牌，请求自带归属。\n3. 数据层：行级安全让查询天然只回本租户的行。\n4. 加密层：租户专属加密让数据物理混存、密钥隔离，泄露半径收窄。\n\n**什么时候用，什么时候别用**。合规要求物理隔离的大客户用独享；中小客户走共享摊成本。共享池必须让租户上下文贯穿每一层——漏一层就串数据。噪音邻居用配额与限流挡。从共享升独享要预留演进路径，别把租户信息焊死在代码里。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的 SaaS 分三层客户：银行客户独享账户与专属加密；中型客户共享池加分区间行级安全；长尾客户共享池全混布。Cognito 令牌带租户上下文贯穿网关到数据库，隔离强度与收费档位对齐。\n\n**关联服务**：Amazon Cognito（租户上下文）、行级安全、AWS KMS（租户专属加密）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「消息队列天然保序」 | 标准队列不保证顺序；要序用 FIFO 消息组或 Kinesis 分区键 |\n| 2 | 「无服务器就是没有状态」 | 是状态外置不是没有状态；去处选错照样丢会话 |\n| 3 | 「FIFO 队列能解决一切重复」 | 去重只在窗口内有效；消费端幂等是最后一道闸 |\n| 4 | 「Pod 会扩、节点就不会缺」 | HPA 只管 Pod 层；节点层要 Cluster Autoscaler 另配 |\n| 5 | 「边缘能跑就能塞业务逻辑」 | 边缘限轻逻辑；重逻辑回源或区域级，冷启动与带宽会放大 |\n| 6 | 「多租户共享池最省事」 | 共享必须租户上下文贯穿全层，漏一层就串数据；独享档位要预留演进 |\n\n#### 记忆要点\n\n1. **消息三模式**：幂等、排序、投递保证；标准队列靠幂等兜底。\n2. **状态外置**：DynamoDB 存会话、S3 存对象、ElastiCache 提速，计算层可替换。\n3. **工作流分档**：跨天带审批走标准工作流，毫秒级高频走快速工作流。\n4. **扩缩两层**：Pod 层 HPA、节点层 Cluster Autoscaler；扩快缩慢。\n5. **边缘定位**：缓存贴节点、轻逻辑贴边缘、重逻辑回源。\n6. **租户隔离谱系**：独享到共享是成本与强度的谱，上下文贯穿全层。\n\n---"},{"h":"将 AI 和 ML 服务集成到架构中","body":"#### 这一节学什么\n这一节对应考纲任务 1.2「将 AI 和 ML 服务集成到架构中」。\n\n> 官方原名：Integrate AI and ML services into architectures.\n\n这一任务把 AI 与机器学习接进现有架构。四个技能点从生成式 AI 集成讲到智能体架构，再到推理形态与 RAG 全链路。主线是：生成式集成 → 智能体架构 → 推理形态 → RAG 检索增强。\n\n#### 为应用设计生成式 AI 集成，包括多账户部署模式\n\n> 官方原名：Design generative AI integrations for applications, including for multi-account deployment patterns (for example, by using Amazon Bedrock).\n\n**这条在问什么。** 考题给你「应用要接大模型、模型访问与费用要集中管、多账户怎么统一走」这类场景。\n\n**定义**：Amazon Bedrock 是托管模型服务——基础模型一个 API 调用即用，不建基础设施。多账户部署模式指模型访问集中在一处、各业务账户统一走的组织形态。\n\n**怎么运作**。三段各管一段：\n\n1. 集中模式：中心账户开通 Bedrock 模型访问，成员账户经跨账户角色调用。\n2. 权益与计费：token 费用归集中心账户，预算与配额统一管。\n3. 治理：模型名单、护栏策略、调用日志集中在中心账户。\n\n**什么时候用，什么时候别用**。几十个业务账户都用生成式 AI，集中模式一次授权全组织生效，配额与费用统一管。只有一两个账户用，就地开通更简单。集中模式的代价是多一跳角色假设的时延与排障链路，时延敏感的应用要做本地缓存或路由优化。\n\n💡 **场景举例**（虚构教学示意）：Contoso 二十个业务账户都要生成营销文案。中心 AI 账户开通 Bedrock 模型集，成员账户经跨账户角色调用；护栏与调用日志全在中心，预算超限自动停。\n\n**最小配置示意**（教学示意；成员账户调用角色挂这段权限，模型按名单收口）：\n\n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\n    \"Effect\": \"Allow\",\n    \"Action\": [\"bedrock:InvokeModel\", \"bedrock:InvokeModelWithResponseStream\"],\n    \"Resource\": \"arn:aws:bedrock:<区域>::foundation-model/<模型ID>\"\n  }]\n}\n```\n\n**关联服务**：Amazon Bedrock、跨账户 IAM 角色、Amazon Bedrock Guardrails（护栏层）。\n\n#### 设计与工具集成的 AI 智能体架构\n\n> 官方原名：Design AI agent architectures that integrate with tools (for example, by using Amazon Bedrock AgentCore, Amazon Bedrock Knowledge Bases).\n\n**这条在问什么。** 考题给你「智能体要自己决定调哪个工具、串多步完成任务」这类场景，让你设计智能体架构。\n\n**定义**：AI 智能体（AI agent）是能规划、调用工具、并根据结果继续的 AI 系统。AgentCore 是 Bedrock 智能体的运行时与管理套件；Knowledge Bases（知识库）给智能体配可检索的知识。\n\n**怎么运作**。四件各管一段：\n\n1. 运行时：AgentCore 托管智能体执行——会话、状态与记忆不自己搭。\n2. 工具：智能体按任务清单调用工具（接口、函数、内部系统）。\n3. 知识：Knowledge Bases 管检索增强，答案带出处。\n4. 身份与治理：AgentCore Identity 发独立身份，护栏挡危险输出。\n\n**什么时候用，什么时候别用**。任务多步、要动态决定下一步（查库、算价、下单）上智能体。单轮问答（翻译、摘要）直接调模型就够，套智能体是过度设计。工具越多越要收敛权限——智能体只拿任务必需的工具集。上线前定义失败回退：工具超时或调用失败走降级路径，别让智能体自主重试无限循环。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的差旅助手智能体：查政策（知识库检索）、比价（内部工具）、下单（外部接口）。工具权限只给这三样；下单超时转人工工单，不让智能体反复重试。\n\n**关联服务**：Amazon Bedrock AgentCore（运行时与身份）、Amazon Bedrock Knowledge Bases。\n\n#### 设计 ML 推理架构\n\n> 官方原名：Design ML inference architectures (for example, Amazon SageMaker AI endpoints).\n\n**这条在问什么。** 考题给你「模型训练好了、要稳定低延迟对外提供推理、还要控住成本」这类场景。\n\n**定义**：推理（inference）是模型上线后对请求出结果。SageMaker AI 终端节点（endpoint）是托管的推理服务，实例规格与自动扩缩容可控。\n\n**怎么运作**。三种形态各管一段：\n\n1. 实时推理：终端节点常驻，扩缩容跟指标，适合在线低时延。\n2. 批量推理：批量转换任务对数据集跑完即收，适合离线大吞吐。\n3. 无服务器推理：按请求计费零常驻，用冷启动换成本，适合中低流量。\n\n**什么时候用，什么时候别用**。在线低时延用实时终端节点；夜间批量评分用批量转换；流量波动大且能接受冷启动，无服务器能省大头成本。生成式大模型别自建推理——用 Bedrock 托管调用或预留吞吐按量配。扩缩容要考虑模型加载时间：加载慢于扩容节奏，流量尖峰会先雪崩。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的风控评分模型：白天在线推理走实时端点按请求速率扩缩容；夜间对存量用户重评分用批量转换；小流量实验模型走无服务器，验证后再升常驻。\n\n**关联服务**：Amazon SageMaker AI（终端节点/批量转换/无服务器推理）、Amazon Bedrock（生成式模型托管）。\n\n#### 设计 RAG 架构，包括摄取与检索策略\n\n> 官方原名：Design RAG architectures, including ingestion and retrieval strategies (for example, Amazon Bedrock knowledge bases that use vector stores).\n\n**这条在问什么。** 考题给你「模型不能瞎编、答案要引用公司文档、文档几万篇怎么管」这类场景，让你设计 RAG。\n\n**定义**：RAG（Retrieval-Augmented Generation，检索增强生成）是先检索再生成——答案从检索到的内容里长出来，不靠模型记忆。向量存储把文档切块转成向量，按相似度取回。\n\n**怎么运作**。两段各管一段：\n\n1. 摄取（ingestion）：文档切块 → 向量化 → 入向量库，增量更新按变更触发。\n2. 检索（retrieval）：用户问题向量化 → 相似度取回前若干片段 → 送模型生成，答案带出处。\n\n**什么时候用，什么时候别用**。知识频繁更新、答案要可溯源（客服、制度问答）用 RAG。知识稳定且量小，直接塞进模型上下文更简单。切块大小是核心参数：太大检索不准、太小语义碎；元数据过滤（部门、版本）比换模型更能提准。权限要在检索层过滤——用户只见自己有权限的片段，生成后再删就晚了。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的制度问答助手：摄取侧按章节切块带部门标签，夜间增量更新；检索侧先按部门元数据过滤再相似度取回，答案注明来源章节。\n\n**关联服务**：Amazon Bedrock Knowledge Bases、向量存储、切块与向量化策略。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「Bedrock 各账户各开通最省事」 | 多账户重度用时，集中开通加跨账户角色统一治理配额与费用 |\n| 2 | 「智能体工具越多越强」 | 工具越多决策越乱；收敛到任务必需集，失败要有降级 |\n| 3 | 「生成式模型要自己部署推理」 | 生成式优先 Bedrock 托管调用；自建端点留给传统 ML |\n| 4 | 「RAG 等于把文档塞进上下文」 | RAG 是检索增强；切块加向量检索控制上下文长度 |\n| 5 | 「检索层不用管权限」 | 检索层就按用户过滤，生成后再删已经晚了 |\n| 6 | 「批量与实时推理一个端点通吃」 | 在线要常驻低时延、批量跑完即收，混用两头不讨好 |\n\n#### 记忆要点\n\n1. **集中供模**：多账户经跨账户角色调中心 Bedrock，配额预算统一。\n2. **智能体四件**：运行时、工具、知识、身份治理。\n3. **推理三态**：实时端点、批量转换、无服务器，按时延与流量配。\n4. **RAG 两段**：摄取管切块与向量化，检索管过滤与取回。\n5. **切块是参数**：大小定精度，元数据过滤提准。\n6. **权限前置**：检索层过滤权限，答案才不越权。\n\n---"},{"h":"设计混合云集成模式","body":"#### 这一节学什么\n这一节对应考纲任务 1.3「设计混合云集成模式」。\n\n> 官方原名：Design hybrid cloud integration patterns.\n\n这一任务把云与机房连成一张能用的网。五个技能点从连接冗余讲到数据同步，再到遗留系统包装、混合 DNS 与本地算力。主线是：连接冗余 → 数据同步 → 遗留包装 → 混合 DNS → 混合计算。\n\n#### 设计提供冗余和故障转移能力的混合连接\n\n> 官方原名：Design hybrid connectivity that provides redundancy and failover capabilities (for example, by using AWS Direct Connect, AWS VPN, AWS Transit Gateway).\n\n**这条在问什么。** 考题给你「机房到云的链路不能断、一条专线不够、故障要自动切换」这类约束。\n\n**定义**：混合连接是机房与云之间的通道。AWS Direct Connect（DX）是专用物理专线；Site-to-Site VPN 是走公网的加密隧道；Transit Gateway（TGW）是网络中转枢纽，把多通道归一。\n\n**怎么运作**。三种冗余模式各管一段：\n\n1. 双专线：两条 DX 接不同设备与机房路由器，BGP 自动切换，链路级冗余。\n2. 专线加 VPN 备份：常态走专线，专线故障 VPN 顶上——成本与冗余的平衡点。\n3. 双 VPN：两条隧道走不同公网出口，轻量兜底。\n\nTransit Gateway 把这些链路汇成一张网：任何 VPC 挂上网关即通所有通道，路由表控分流。\n\n**什么时候用，什么时候别用**。大带宽稳定流量必上 DX，冗余按「双 DX 或 DX 加 VPN」配。流量小时 VPN 起步，长大了再升级。只配一条 DX 不带备份是最大的单点——链路故障切换有收敛时间，时敏业务要先评估。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 主链路双专线入 Transit Gateway，接在不同机房路由器上；另备两条 VPN 隧道常态待命。专线闪断时 BGP 秒级切换，VPN 只兜维护窗口。\n\n**关联服务**：AWS Direct Connect、AWS Site-to-Site VPN、AWS Transit Gateway。\n\n#### 为混合工作负载设计数据同步策略\n\n> 官方原名：Design data synchronization strategies for hybrid workloads (for example, by using AWS DataSync, AWS Storage Gateway, AWS Transfer Family).\n\n**这条在问什么。** 考题给你「机房数据要上云、机房程序还要继续读写、上云要快且省」这类场景。\n\n**定义**：AWS DataSync 是点到点的数据搬运；AWS Storage Gateway 在机房侧伪装存储设备，本地程序照常读写、数据落云；AWS Transfer Family 给 SFTP 这类文件协议接上云存储。\n\n**怎么运作**。三个服务各管一段：\n\n- DataSync：机房到 S3、EFS、FSx 的批量搬运，带增量校验，适合迁移与定期同步。\n- Storage Gateway：文件、卷、磁带三形态网关，机房本地缓存加云端持久层。\n- Transfer Family：外部伙伴用 SFTP 交接文件时直接落 S3，账号与密钥托管。\n\n**什么时候用，什么时候别用**。一次性迁移与夜间批量，DataSync 直接干。机房程序不能改造、还要本地读写体验，Storage Gateway 文件网关挂着用。外部伙伴只认 SFTP，Transfer Family 收口。小量高频的改动同步，网关缓存比反复跑同步任务更顺。同步链路本身要配监控——同步静默失败是混合场景的常见事故。\n\n💡 **场景举例**（虚构教学示意）：Contoso 机房文件服务器上云：白天业务走文件网关的本地缓存，夜间 DataSync 全量校验一遍；合作伙伴的对账文件经 Transfer Family 的 SFTP 直落 S3。\n\n**关联服务**：AWS DataSync、AWS Storage Gateway（文件/卷/磁带网关）、AWS Transfer Family。\n\n#### 设计集成模式，通过数据转换实现遗留系统现代化\n\n> 官方原名：Design integration patterns to modernize legacy systems by using data transformations (for example, by using API Gateway, Lambda, Amazon MQ).\n\n**这条在问什么。** 考题给你「老系统只会发消息或输出老格式、新系统要 REST、中间要做转换」这类场景。\n\n**定义**：遗留系统现代化常用「不动核心、外套一层」的集成模式——API Gateway 做 REST 门面，Lambda 做协议与格式转换，Amazon MQ 托管消息代理接住老系统的消息。\n\n**怎么运作**。三种接法各管一段：\n\n1. 门面模式：老系统只有内部接口，API Gateway 加 Lambda 包装成对外 REST。\n2. 消息桥接：老系统只会消息队列，Amazon MQ 接住再转到 SQS 或 EventBridge。\n3. 数据转换：Lambda 把定长文本、老式 XML 这类格式转成 JSON 给新系统。\n\n**什么时候用，什么时候别用**。老系统不能改或不值得改，集成层包装最划算。要逐步下线老系统时，这层包装就是迁移的缓冲带。数据量极大且转换逻辑稳定，用 ETL 服务比每请求过 Lambda 更省。转换层别堆太厚——三层转换链排障是噩梦，能压一层是一层。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的老计费系统只会发 MQ 消息。Amazon MQ 接住，Lambda 转成 JSON 事件进 EventBridge；外部查询经 API Gateway 门面调老系统既有接口。核心一行没改，外面包了两层。\n\n**关联服务**：Amazon API Gateway、AWS Lambda、Amazon MQ。\n\n#### 为混合环境设计 DNS 方案\n\n> 官方原名：Design DNS solutions for hybrid environments (for example, by using Amazon Route 53 Resolver endpoints, Route 53 private hosted zones, split-horizon DNS, conditional forwarding).\n\n**这条在问什么。** 考题给你「云上要解析机房域名、机房要解析云上私有域名、内外同名要不同答案」这类需求。\n\n**定义**：Route 53 Resolver 是 VPC 内的递归解析器。出站终端节点把「该机房答的查询」转给机房 DNS；入站终端节点让机房查云上私有域。私有托管区管 VPC 内可见的域。分离视域（split-horizon）让内外同名域给不同答案；条件转发按域名把查询交给指定的解析器。\n\n**怎么运作**。三件事各管一段：\n\n1. 云查机房：Resolver 出站规则匹配机房域名，出口终端节点转给机房 DNS。\n2. 机房查云：入站终端节点收机房查询，应答云上私有域记录。\n3. 分离视域：同一域名公有区答外部、私有区答内部，按来源各得其所。\n\n**什么时候用，什么时候别用**。混合双向解析必配 Resolver 终端节点对。内外同名的域用分离视域。别把所有查询都转发到中心 DNS——VPC 默认解析已经够快，只把非云域名按条件转。多账户多 VPC 用规则共享，别逐 VPC 手配。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的应用域内外分开：公网区答营销页地址，私有区答内网均衡器；机房查询云上私有域经入站终端节点应答，云上查询机房域走条件转发到机房 DNS。同名记录，内外各得其所。\n\n**最小配置示意**（教学示意；把机房域名转发给机房 DNS）：\n\n```\naws route53resolver create-resolver-rule \\\n  --name \"to-onprem\" \\\n  --rule-type FORWARD \\\n  --domain-name \"corp.contoso.internal\" \\\n  --resolver-endpoint-id <出站终端节点ID> \\\n  --target-ips Ip=10.0.0.53,Port=53\n```\n\n**关联服务**：Amazon Route 53 Resolver（入站/出站终端节点）、Route 53 私有托管区、条件转发规则。\n\n#### 设计混合计算模式\n\n> 官方原名：Design hybrid compute patterns (for example, by using Amazon EKS Anywhere, Amazon ECS Anywhere, AWS Outposts, AWS Local Zones).\n\n**这条在问什么。** 考题给你「算力要留在本地（法规、时延、既有硬件），但要用云的运维模式」这类约束。\n\n**定义**：混合计算把 AWS 的运维形态延伸到本地。AWS Outposts 是 AWS 硬件整柜进机房；Amazon EKS Anywhere 与 ECS Anywhere 把编排的控制面放云上、节点留在本地；AWS Local Zones 把云资源放到大都市边缘。\n\n**怎么运作**。四种形态各管一段：\n\n1. Outposts：AWS 设计的硬件整柜进机房，跑云服务，控制台与 API 同云一致。\n2. EKS Anywhere：自己机房跑 Kubernetes 集群，控制面订阅制，云上统一纳管。\n3. ECS Anywhere：本地服务器注册进 ECS 集群，统一调度与运维。\n4. Local Zones：在大都市边缘放核心资源，给终端用户压时延，运维仍是云的。\n\n**什么时候用，什么时候别用**。法规强制数据不出机房，Outposts 保「云运维、本地数据」。已有本地 Kubernetes 投入，EKS Anywhere 延续复用。杂牌本地服务器要统一编排，ECS Anywhere 收编。只要低时延不涉本地合规，Local Zones 比整机柜便宜得多。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的工厂质检要本地推理且数据不许出厂：产线侧 Outposts 跑推理，数据不出厂；ERP 集群用 EKS Anywhere 复用既有机房硬件；面向客户的直播推流走 Local Zones 压时延。\n\n**关联服务**：AWS Outposts、Amazon EKS Anywhere、Amazon ECS Anywhere、AWS Local Zones。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「一条专线就够高可用」 | 单链路是最大单点；双专线或专线加 VPN 备份是标配 |\n| 2 | 「Storage Gateway 会自动同步一切」 | 网关管本地读写加云端持久；批量搬运另用 DataSync |\n| 3 | 「机房程序上云必须先改造」 | 集成层包装（门面、消息桥）不动核心就能接 |\n| 4 | 「混合 DNS 要全量转发到机房」 | 只按域名条件转发，云内解析留在 VPC 默认 |\n| 5 | 「分离视域就是内外同一答案」 | 分离视域正是内外不同答案；同名域分公有区与私有区 |\n| 6 | 「要本地算力就买 Outposts」 | 先分需求：时延用 Local Zones、已有硬件用 Anywhere、合规才整机柜 |\n\n#### 记忆要点\n\n1. **链路冗余**：双专线或专线加 VPN，BGP 自动切换。\n2. **同步三件**：搬运用 DataSync、本地读写用网关、SFTP 收口用 Transfer Family。\n3. **包装改造**：门面、消息桥、格式转换三层不动核心。\n4. **双向解析**：出站转机房、入站答云上，同名内外分离视域。\n5. **混合算力四态**：整机柜、Anywhere 收编、大都市边缘 Local Zones。\n6. **同步要监控**：静默失败是混合场景最常见事故。\n\n---"},{"h":"设计网络架构","body":"#### 这一节学什么\n这一节对应考纲任务 1.4「设计网络架构」。\n\n> 官方原名：Design network architectures.\n\n这一任务给云上交通定规则。五个技能点从多 VPC 互通讲到编址分段，再到多层防护、IPv6 双栈与全局分流。主线是：多 VPC 互通 → 编址分段 → 分层防护 → IPv6 双栈 → 全局路由。\n\n#### 设计提供混合和多账户连接的多 VPC 架构\n\n> 官方原名：Design multi-VPC architectures that provide hybrid and multi-account connectivity (for example, VPC peering, AWS PrivateLink).\n\n**这条在问什么。** 考题给你「几十个 VPC 要互通、又要控制谁能通谁、成本要省」这类场景。\n\n**定义**：VPC 对等连接（peering）是两个 VPC 间点对点直连；AWS PrivateLink 让服务方开一个接口终端节点，消费方 VPC 私网直达，流量不出 AWS 骨干网。\n\n**怎么运作**。三种形态各管一段：\n\n1. 对等连接：点对点、配置简单，适合少量 VPC 两两互通；不传递——A 通 B、B 通 C，不代表 A 通 C。\n2. PrivateLink：服务方挂负载均衡器出终端节点，消费方建接口终端节点访问，是跨账户共享服务的标准形。\n3. Transit Gateway：星型架构，多个 VPC 一挂全网可达，路由表控分区互通。\n\n**什么时候用，什么时候别用**。少量 VPC 互访，对等直连最省。跨账户提供共享服务（内部接口、镜像仓），PrivateLink 免建对等链路还天然隔离。几十个 VPC 全网状互通，上 Transit Gateway——对等的连接数按平方涨。对等不传递这点心里要有数：每个 VPC 的路由要显式配。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 三十个 VPC：业务 VPC 走 Transit Gateway 星型互联，路由表分生产与测试两段；集中镜像服务与内部接口用 PrivateLink 给全组织私网直连，不走公网也不开对等。\n\n**关联服务**：VPC 对等连接、AWS PrivateLink、AWS Transit Gateway。\n\n#### 使用子网策略、IP 地址管理和网络分段设计 VPC 架构\n\n> 官方原名：Design VPC architectures by using subnet strategies, IP address management, and network segmentation (for example, by using Amazon VPC IP Address Manager [IPAM], public and private subnets).\n\n**这条在问什么。** 考题给你「几十个 VPC 的地址不能撞、公私边界要清晰、网络要按层分段」这类约束。\n\n**定义**：IPAM（VPC IP Address Manager，IP 地址管理器）是地址池管理器，跨账户统一分配不撞段。子网策略是「哪层资源放哪段」的规划；网络分段按层或按业务切隔离域。\n\n**怎么运作**。三层规划各管一段：\n\n1. 地址层：IPAM 顶层池划大段，各账户子池领段，新 VPC 自动分配，撞段在设计上杜绝。\n2. 子网层：公有子网放面向互联网的入口（均衡器、堡垒机），私有子网放应用与数据，路由分层。\n3. 分段层：按环境（生产、测试）与业务线分 VPC 或分段，层间走受控通道。\n\n**什么时候用，什么时候别用**。账户多、VPC 增长快，IPAM 必上——手工管网段迟早撞。小规模一两个 VPC，手工规划加文档也行。分段粒度别过细：每段都有路由与安全组要维护，粒度对齐故障域与权限域才有意义。\n\n💡 **场景举例**（虚构教学示意）：Contoso 上 IPAM：顶层池统一划段，生产测试各领子池；新项目开 VPC 走自动领段。三年新增两百个 VPC 无一撞段。\n\n**关联服务**：Amazon VPC IPAM、公有/私有子网分层、网络分段。\n\n#### 设计网络安全架构，包括流量检查、流量过滤和应用层防护\n\n> 官方原名：Design network security architectures that include traffic inspection, traffic filtering, and application layer protection (for example, by using AWS Network Firewall, AWS WAF, Gateway Load Balancers, security groups, network ACLs, VPC Flow Logs).\n\n**这条在问什么。** 考题给你「东西向（VPC 间）流量要检查、出网要过滤、Web 层要防注入」这类多层防护需求。\n\n**定义**：AWS Network Firewall 是 VPC 边界的托管防火墙，做状态规则、域名过滤与出口管控；AWS WAF 是应用层防护，挡注入与限速；Gateway Load Balancer（GLB）把第三方检查设备串进流量路径。安全组与网络 ACL 是 VPC 内两层过滤；VPC Flow Logs 记流量元数据。\n\n**怎么运作**。四层各管一段：\n\n1. 应用层：WAF 挂 CloudFront 或 ALB，挡注入攻击与限速。\n2. VPC 边界：Network Firewall 管出网域名白名单与东西向检查。\n3. 实例层：安全组按角色最小开端口；ACL 做子网级无状态兜底。\n4. 观测层：Flow Logs 全量记录，供审计与取证回溯。\n\n**什么时候用，什么时候别用**。合规要「出网管控加流量检查」，Network Firewall 起步。Web 暴露面先用 WAF 托管规则铺底。第三方检查设备要串进流量，GLB 加 PrivateLink 是标准接法。安全组是第一道且免费——先把安全组做对，再买高级工具。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的支付 VPC：入口 WAF 限速加托管规则；VPC 边界 Network Firewall 只允许白名单域名出网；实例安全组按角色最小开端口，Flow Logs 入数据湖备取证。\n\n**最小配置示意**（教学示意；WAF 限速规则节选）：\n\n```\n{\n  \"Name\": \"RateLimitPerIP\",\n  \"Priority\": 1,\n  \"Statement\": {\n    \"RateBasedStatement\": { \"Limit\": 2000, \"AggregateKeyType\": \"IP\" }\n  },\n  \"Action\": { \"Block\": {} },\n  \"VisibilityConfig\": {\n    \"SampledRequestsEnabled\": true,\n    \"CloudWatchMetricsEnabled\": true,\n    \"MetricName\": \"RateLimitPerIP\"\n  }\n}\n```\n\n**关联服务**：AWS Network Firewall、AWS WAF、Gateway Load Balancer、安全组/网络 ACL、VPC Flow Logs。\n\n#### 设计 IPv6 采用和双栈迁移策略\n\n> 官方原名：Design IPv6 adoption and dual-stack migration strategies.\n\n**这条在问什么。** 考题给你「地址不够用、要对齐 IPv6、又不能停机切换」这类约束。\n\n**定义**：双栈（dual-stack）是资源同时挂 IPv4 与 IPv6 两套地址；迁移期间两边并存，逐步过渡到 v6 优先。\n\n**怎么运作**。四步迁移：\n\n1. 编址：VPC 与子网补 IPv6 网段，地址由 AWS 分配的前缀。\n2. 应用：均衡器先开双栈监听，安全组与 ACL 放行 v6。\n3. 路由：路由表补 v6 默认路由；纯出网用 egress-only（出网单行）网关。\n4. 收敛：客户端逐步 v6 优先，观察流量占比，v4 保留或退役。\n\n**什么时候用，什么时候别用**。地址紧张、海量终端接入（物联网）、对齐监管要求，走双栈迁移。存量系统依赖 v4 私网且无外部诉求，v6 可以缓。迁移别一刀切停 v4——双栈期就是保险期，回退路径要留着。NAT 网关是 v4 概念，v6 出网走 egress-only 网关，费用模型不同要重算。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的物联网平台上百万终端切 v6：子网补 v6 段，设备直连 v6；存量管理面双栈观察半年，流量占比到九成后 v4 只留审计通道。\n\n**关联服务**：IPv6 双栈、Egress-only Internet Gateway、路由表与安全组（v6 规则）。\n\n#### 为多区域应用设计全局流量路由策略\n\n> 官方原名：Design global traffic routing strategies for multi-Region applications (for example, by using Route 53 routing policies, AWS Global Accelerator).\n\n**这条在问什么。** 考题给你「多区域部署、用户就近进、某区域故障要切走」这类全局分流需求。\n\n**定义**：Route 53 的路由策略决定 DNS 怎么答——加权、延迟、地理位置、故障转移各有分工。AWS Global Accelerator 是全局加速层，用两个固定入口 IP 把用户引到最近的边缘节点，再走 AWS 骨干网到目标区域。\n\n**怎么运作**。两种工具各管一段：\n\n1. Route 53 策略：延迟路由按用户实测延迟选区域；故障转移配主备记录加健康检查；加权做灰度分压；地理位置按用户位置定向。\n2. Global Accelerator：固定入口 IP，流量走 AWS 骨干，终端组挂健康检查，区域故障自动摘除。\n\n**什么时候用，什么时候别用**。静态域名分流用 Route 53 就够。要固定 IP（合作方白名单）、要 TCP 与 UDP 加速、或要更快的故障切换，上 Global Accelerator。DNS 切换受客户端缓存影响，时效敏感的容灾要 Global Accelerator 或两者并用。别把所有入口都堆上它——按流量计费，只保关键入口。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的全球交易入口：Global Accelerator 固定双 IP 接两大区域边缘，区域故障秒级摘除；Route 53 故障转移记录兜底跨区域灾备；新版本发布用加权路由按 5% 灰度放量。\n\n**关联服务**：Amazon Route 53（路由策略与健康检查）、AWS Global Accelerator。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「对等连接可传递，A 通 B、B 通 C 则 A 通 C」 | 对等不传递；全网状互通用 Transit Gateway |\n| 2 | 「PrivateLink 要先建对等才能通」 | PrivateLink 走终端节点私网直达，无需对等 |\n| 3 | 「网络 ACL 比安全组更该用」 | 安全组是有状态白名单，是第一道；ACL 是子网级无状态兜底 |\n| 4 | 「IPv6 迁移第一步先关 v4」 | 双栈共存期就是保险期，回退路径留着 |\n| 5 | 「DNS 切换就是秒级容灾」 | DNS 受客户端缓存影响；秒级摘除要 Global Accelerator |\n| 6 | 「WAF 能挡网络层攻击」 | WAF 在应用层；网络层过滤是 Network Firewall 的地盘 |\n\n#### 记忆要点\n\n1. **互通三式**：对等点对点、PrivateLink 服务直达、TGW 星型全网。\n2. **IPAM 管段**：顶层池分账户子池，新 VPC 自动领段不撞。\n3. **防护四层**：WAF 应用、防火墙边界、安全组实例、Flow Logs 观测。\n4. **双栈四步**：编址、应用、路由、收敛；v6 出网走 egress-only。\n5. **全局两件**：Route 53 策略管 DNS 分流，Global Accelerator 管固定 IP 与秒级摘除。\n6. **分段对齐**：粒度对齐故障域与权限域，别为细而细。\n\n---"},{"h":"设计数据、存储和数据库架构","body":"#### 这一节学什么\n这一节对应考纲任务 1.5「设计数据、存储和数据库架构」。\n\n> 官方原名：Design data, storage, and database architectures.\n\n这一任务给数据找对家。七个技能点从湖仓底盘讲到分析管道，再到选库、扩缩容、存储分层、缓存与共享治理。主线是：湖仓与管道 → 选库与扩容 → 存储与缓存 → 编目与共享。\n\n#### 设计数据湖和湖仓架构\n\n> 官方原名：Design data lake and lakehouse architectures (for example, by using Amazon S3, AWS Lake Formation, Amazon Redshift Spectrum, Apache Iceberg).\n\n**这条在问什么。** 考题给你「数据要统一入湖、要事务与模式演进、多个分析引擎要即插即用」这类需求。\n\n**定义**：数据湖（data lake）以 S3 为底集中存储；湖仓（lakehouse）在湖上加表格式与治理——Apache Iceberg 这类开放表格式提供 ACID 事务与模式演进；Redshift Spectrum 是 Redshift 直接查 S3 的扩展；Lake Formation 管目录与权限。\n\n**怎么运作**。四件各管一段：\n\n1. 存储层：S3 按「原始、清洗、集市」分层，生命周期策略控成本。\n2. 表格式：Iceberg 给湖上数据建表，带事务、增量读取与模式演进。\n3. 治理层：Lake Formation 统一目录与权限，引擎按权限取数。\n4. 查询层：Athena 即席查，Redshift Spectrum 用数仓引擎查湖，EMR 跑重处理。\n\n**什么时候用，什么时候别用**。一份数据多引擎共用、要模式演进与行级权限，湖仓最合算。纯数仓场景（强一致的报表分析）直接 Redshift。数据量小，直存数据库比建湖省事。湖治理别省——没权限层的湖是沼泽，建湖容易管湖难。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的湖仓：原始层按「来源/日期」分区入湖，Iceberg 建表统一模式；Lake Formation 管行级权限，财务行只有财务可读；分析师用 Athena 即席，报表走 Redshift Spectrum。同一份数据，两个引擎不搬数。\n\n**最小配置示意**（教学示意；S3 湖分层布局，Iceberg 表登记进 Glue 目录）：\n\n```\ns3://datalake/\n  raw/                 # 原始层：按来源与日期分区\n    orders/2026/11/18/\n  curated/             # 清洗层：Iceberg 表（事务与模式演进）\n    iceberg_orders/\n  consumption/         # 集市层：按业务域出小宽表\n    finance/\n# Glue Data Catalog 登记表；Lake Formation 按列/行授权\n```\n\n**关联服务**：Amazon S3、AWS Lake Formation、Amazon Redshift Spectrum、Apache Iceberg、AWS Glue Data Catalog。\n\n#### 设计实时和批处理分析管道\n\n> 官方原名：Design real-time and batch analytics pipelines (for example, by using Amazon EMR, Amazon Redshift, Amazon Managed Streaming for Apache Kafka [Amazon MSK], Amazon AppFlow).\n\n**这条在问什么。** 考题给你「一条数据流既要实时看板、又要隔夜全量对账」这类双节奏需求。\n\n**定义**：实时管道是数据到即处理（秒级内），批处理是攒一批统一处理。SaaS 数据源接云用 AppFlow 托管搬运。\n\n**怎么运作**。四个服务各管一段：\n\n- MSK：托管 Kafka 收高吞吐流，多消费组各自消费。\n- EMR：跑重型批处理（Spark 这类大数据栈），集群按需伸缩。\n- Redshift：数仓层做复杂查询与报表，加载与查询分离。\n- AppFlow：SaaS 到 S3 或 Redshift 的托管搬运，免自建采集。\n\n**什么时候用，什么时候别用**。同源双节奏用分流：一路进流处理出实时看板，一路落 S3 夜间批校对账。流量小用托管的轻量流服务，流量大且要 Kafka 生态才上 MSK。批处理重且多框架用 EMR；以 SQL 分析为主直接 Redshift。别为「实时」硬上流——真需求是分钟级的，批加微批就够。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的销售分析：MSK 收门店事件，一路流处理出实时看板监控毛利，一路落 S3 夜间 EMR 全量对账进 Redshift；CRM 数据经 AppFlow 每日同步。一套管道双节奏。\n\n**关联服务**：Amazon MSK、Amazon EMR、Amazon Redshift、Amazon AppFlow。\n\n#### 根据工作负载要求选择适当的数据库服务\n\n> 官方原名：Select appropriate database services based on workload requirements such as access patterns, consistency needs, and scalability (for example, Amazon RDS, Amazon Aurora, Amazon DynamoDB, Amazon Redshift).\n\n**这条在问什么。** 考题给你访问模式、一致性要求、规模三件信息，让你选对数据库引擎。\n\n**定义**：选库看三问——怎么访问（键值、关系、文档）、要多强的一致性（最终一致或强一致）、怎么扩（纵向或横向）。\n\n**怎么运作**。四种引擎各管一类：\n\n1. RDS：经典关系型（MySQL、PostgreSQL 等），事务型负载的保底。\n2. Aurora：云原生关系引擎，存储计算分离，读扩展强，兼容 MySQL 与 PostgreSQL。\n3. DynamoDB：键值与文档，毫秒级响应任意规模，以最终一致为主、强一致读可选。\n4. Redshift：列存数仓，联机分析专用。\n\n**什么时候用，什么时候别用**。强事务加关系查询用 RDS 或 Aurora；高并发键值访问、扁平结构用 DynamoDB；大规模分析聚合用 Redshift。别拿事务库跑分析——锁与扫描互相拖垮；也别拿数仓跑事务，写入路径不对。一致性按业务选：扣款要强一致，计数可以最终一致。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 电商：订单走 Aurora 保事务与关系报表，购物车与秒杀计数走 DynamoDB 毫秒横向扩，夜间聚合分析进 Redshift。三类负载三种引擎。\n\n**关联服务**：Amazon RDS、Amazon Aurora、Amazon DynamoDB、Amazon Redshift。\n\n#### 设计数据库扩缩容方案以提供高可用\n\n> 官方原名：Design database scaling solutions to provide high availability (for example, by using read replicas, Amazon Aurora Global Database, Amazon DynamoDB global tables, Amazon RDS Multi-AZ deployments).\n\n**这条在问什么。** 考题给你「读压力大要扩读、区域故障要能切、单可用区故障不能停」这类高可用需求。\n\n**定义**：读副本（read replica）是主库的复制从库，分流读流量；Multi-AZ 是同区域热备，主备秒级换向；Aurora Global Database 做跨区域低延迟复制；DynamoDB global tables 多区域双向同步。\n\n**怎么运作**。四种形态各管一段：\n\n1. Multi-AZ：同区热备，秒级换向保可用性——不是为了扩读。\n2. 读副本：横向扩读，可提升为主做故障接替；跨区副本还能就近读。\n3. Aurora Global Database：跨区域复制延迟典型在秒内，承担灾备与全球读。\n4. DynamoDB global tables：多区域双活，就近读写。\n\n**什么时候用，什么时候别用**。生产库先保 Multi-AZ（可用性底线），再按读压力加副本。全球用户就近读、区域级容灾用 Global Database 或 global tables。副本不是越多越好——复制滞后会读到旧数据，按可容忍的滞后配。副本是读的，别把写流量分给副本。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的全球订单库：Aurora Global Database 主区写、两个只读区就近读，区域故障把读区提升为写区接棒；同区再套 Multi-AZ 保单区故障。三层容灾对应三个恢复目标。\n\n**关联服务**：Amazon RDS/Aurora（Multi-AZ 与读副本）、Aurora Global Database、DynamoDB global tables。\n\n#### 根据访问模式和性能要求设计存储架构\n\n> 官方原名：Design storage architectures based on access patterns and performance requirements (for example, by using Amazon S3, Amazon EBS, Amazon EFS, Amazon FSx).\n\n**这条在问什么。** 考题给你「块、文件、对象三类需求加性能档次」让你选存储形态。\n\n**定义**：EBS 是给单个实例挂载的块卷；EFS 是多实例共享的文件系统；FSx 是专用文件系统（Windows 域共享、高性能并行文件等形态）；S3 是对象存储。\n\n**怎么运作**。四种存储各管一类：\n\n- EBS：实例的「硬盘」，按 IOPS 档位选型（通用档与高 IOPS 档）。\n- EFS：多实例共享目录，容量弹性，按吞吐性能模式分档。\n- FSx：Windows 域内共享与高性能并行文件各有专用形态。\n- S3：海量对象与静态内容，分层存储控成本。\n\n**什么时候用，什么时候别用**。单实例系统盘与数据盘用 EBS；多实例共享目录用 EFS；Windows 域共享或高性能计算热数据用 FSx 对应形态；Web 资产、备份、数据湖用 S3。数据库文件别放共享文件系统——锁语义不对，除非引擎明确支持。性能档位先量 IOPS 与吞吐再选，高 IOPS 档贵一个量级，别默认顶配。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的混合负载：数据库用高 IOPS 档 EBS 卷，应用集群共享配置走 EFS，Windows 行政区共享盘用 FSx，网站图片与备份在 S3 分层。四类需求四类存储，各不越界。\n\n**关联服务**：Amazon EBS、Amazon EFS、Amazon FSx（Windows/Lustre）、Amazon S3。\n#### 设计数据缓存策略以优化性能\n\n> 官方原名：Design data caching strategies to optimize performance (for example, by using ElastiCache, DynamoDB Accelerator [DAX]).\n\n**这条在问什么。** 考题给你「数据库读放大、热点数据重复查询、要亚毫秒响应」这类性能场景。\n\n**定义**：缓存把热点数据放进近处内存，读不再落库。ElastiCache 托管 Redis 与 Memcached；DAX 是 DynamoDB 专用缓存层，对应用透明。\n\n**怎么运作**。三个机制各管一段：\n\n1. 旁路缓存：应用先查缓存，未命中查库再回填——最通用的模式。\n2. TTL 过期：条目带生存时间，到期重查，保数据新鲜度。\n3. DAX 透明加速：应用把端点改成 DAX 即生效，不用写缓存逻辑。\n\n**什么时候用，什么时候别用**。读多写少、能容忍短暂陈旧的数据（目录、商品页）适合缓存。强一致读路径别缓存，或每次校验版本。缓存三大坑要防：击穿（热键过期瞬间压库）用提前刷新，雪崩（大量键同时过期）用错开 TTL，穿透（查不存在的键打穿缓存）用空值占位。缓存全挂时库顶不顶得住要心里有数——顶不住就是缓存依赖过度。\n\n💡 **场景举例**（虚构教学示意）：Contoso 商品页读流量是写的一百倍：目录数据旁路缓存带五分钟 TTL，秒杀热点键提前刷新防击穿，订单查询走 DAX 免改代码。库压降下来大半。\n\n**关联服务**：Amazon ElastiCache（Redis/Memcached）、DynamoDB Accelerator（DAX）。\n\n#### 设计数据编目和跨账户数据共享模式\n\n> 官方原名：Design data cataloging and cross-account data sharing patterns (for example, AWS Glue Data Catalog, Lake Formation, AWS Clean Rooms).\n\n**这条在问什么。** 考题给你「数据资产要可找、跨账户要安全共享、对外合作不能交原始数据」这类需求。\n\n**定义**：编目（cataloging）给数据建元数据账本，Glue Data Catalog 是统一目录；跨账户共享走 Lake Formation 的集中授权；AWS Clean Rooms 让双方在不交出原始数据的前提下联合分析。\n\n**怎么运作**。三件各管一段：\n\n1. 目录：Glue Data Catalog 集中登记表与技术元数据，支持跨账户共享。\n2. 授权：Lake Formation 把库表按列、按行授予其他账户，撤销即时生效。\n3. 协作：Clean Rooms 双方数据留在各自账户，查询在协作区跑，互相看不到原始数据。\n\n**什么时候用，什么时候别用**。多账户数据资产多，统一目录加集中授权是治理标配。一次性小规模共享用资源策略也能做，但权限分散难审计。Clean Rooms 用于「要合作但不能交数据」的合规场景（联合分析、反欺诈联查）；直接拷数据能解决就用不着它。共享要留账：谁授权给谁、查了什么，审计链补齐。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 与合作银行做反欺诈联查：双方把可疑账户数据留在各自账户，Clean Rooms 协作区跑交集分析，结果只出命中与否；数据目录全组织共享，权限由数据团队集中授予与撤销。\n\n**关联服务**：AWS Glue Data Catalog、AWS Lake Formation、AWS Clean Rooms。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「数据湖就是个大 S3 桶」 | 湖要分层、目录与权限配套；没治理的湖是沼泽 |\n| 2 | 「实时管道替代批处理」 | 双节奏并存：实时看板加批校对账各司其职 |\n| 3 | 「DynamoDB 什么都能存」 | 键值与文档是强项；复杂关系查询还是关系库 |\n| 4 | 「Multi-AZ 就是读扩展」 | Multi-AZ 是热备保可用；扩读用读副本 |\n| 5 | 「缓存一致性靠数据库保证」 | 缓存一致性自己设计：TTL、防击穿、丢缓存预案 |\n| 6 | 「跨账户共享先拷一份数据」 | 目录加集中授权加必要时 Clean Rooms——数据不动权限动 |\n\n#### 记忆要点\n\n1. **湖仓四件**：S3 分层、Iceberg 表、Lake Formation 权限、多引擎查询。\n2. **管道双节奏**：流即席、批对账；SaaS 搬运走 AppFlow。\n3. **选库三问**：访问模式、一致性、扩法。\n4. **高可用四层**：Multi-AZ 保底、副本扩读、全局库跨区、global tables 双活。\n5. **存储四类**：块 EBS、共享 EFS、专用 FSx、对象 S3。\n6. **共享不动数**：目录可找、权限可撤、协作不出原始数据。\n\n---"}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 1.1.1 | 幂等/排序/投递保证与消息服务匹配 | ⭐⭐⭐ | 情景单选/多选 |\n| 1.1.2 | 无状态与状态外置三去处 | ⭐⭐ | 情景单选 |\n| 1.1.3 | 无服务器管道四环（摄入到查询） | ⭐⭐ | 情景单选 |\n| 1.1.4 | 标准工作流 vs 快速工作流 vs 检查点 | ⭐⭐⭐ | 情景单选 |\n| 1.1.5 | 跨账户/跨区域事件路由与授权 | ⭐⭐ | 情景单选 |\n| 1.1.6 | EKS/ECS/Fargate 选型 | ⭐⭐⭐ | 情景单选 |\n| 1.1.7 | VPC Lattice 与 Service Connect 网格 | ⭐⭐ | 情景单选 |\n| 1.1.8 | ECR 扫描与生命周期策略 | ⭐⭐ | 情景单选 |\n| 1.1.9 | Lambda 并发/HPA/节点层扩缩 | ⭐⭐⭐ | 情景多选 |\n| 1.1.10 | ALB/NLB/API Gateway 入口分工 | ⭐⭐⭐ | 情景单选 |\n| 1.1.11 | CloudFront Functions 与 Lambda@Edge 分层 | ⭐⭐ | 情景单选 |\n| 1.1.12 | WebSocket 路由与主动推 | ⭐⭐ | 情景单选 |\n| 1.1.13 | 多租户隔离谱系（独享到共享） | ⭐⭐⭐ | 情景多选 |\n| 1.2.1 | Bedrock 集中开通与跨账户角色 | ⭐⭐ | 情景单选 |\n| 1.2.2 | 智能体四件（运行时/工具/知识/身份） | ⭐⭐ | 情景单选/多选 |\n| 1.2.3 | 推理三态（实时/批量/无服务器） | ⭐⭐⭐ | 情景单选 |\n| 1.2.4 | RAG 摄取与检索策略、权限前置 | ⭐⭐⭐ | 情景单选/多选 |\n| 1.3.1 | DX/VPN/TGW 冗余组合 | ⭐⭐⭐ | 情景单选/多选 |\n| 1.3.2 | DataSync/Storage Gateway/Transfer Family 分工 | ⭐⭐⭐ | 情景单选 |\n| 1.3.3 | 遗留包装三接法（门面/消息桥/转换） | ⭐⭐ | 情景单选 |\n| 1.3.4 | Resolver 双向解析与分离视域 | ⭐⭐⭐ | 情景单选 |\n| 1.3.5 | 混合计算四态选型 | ⭐⭐ | 情景单选 |\n| 1.4.1 | 对等/PrivateLink/TGW 互通三式 | ⭐⭐⭐ | 情景单选/多选 |\n| 1.4.2 | IPAM 与子网分层分段 | ⭐⭐ | 情景单选 |\n| 1.4.3 | 防护四层（WAF/防火墙/安全组/Flow Logs） | ⭐⭐⭐ | 情景多选 |\n| 1.4.4 | IPv6 双栈四步与 egress-only | ⭐⭐ | 情景单选 |\n| 1.4.5 | Route 53 策略与 Global Accelerator 分工 | ⭐⭐⭐ | 情景单选 |\n| 1.5.1 | 湖仓四件（S3/Iceberg/Lake Formation/Spectrum） | ⭐⭐⭐ | 情景单选 |\n| 1.5.2 | 流批双节奏与 AppFlow | ⭐⭐ | 情景单选 |\n| 1.5.3 | 选库三问与四引擎 | ⭐⭐⭐ | 情景单选 |\n| 1.5.4 | Multi-AZ/副本/全局库分层高可用 | ⭐⭐⭐ | 情景单选/多选 |\n| 1.5.5 | 块/文件/对象存储四类分工 | ⭐⭐⭐ | 情景单选 |\n| 1.5.6 | 缓存机制与三坑防护 | ⭐⭐ | 情景单选 |\n| 1.5.7 | 编目授权与 Clean Rooms 协作 | ⭐⭐ | 情景单选 |","services":"| 服务 | 主要用途 | 涉及知识点 |\n|---|---|---|\n| Amazon EventBridge / SQS（标准/FIFO）/ SNS / Kinesis | 事件驱动与消息模式 | 1.1.1、1.1.5 |\n| Amazon DynamoDB / S3 / ElastiCache | 状态外置三去处 | 1.1.2、1.5.6 |\n| AWS Glue / Amazon Athena / Kinesis Data Streams | 无服务器管道 | 1.1.3 |\n| AWS Step Functions（标准/快速工作流） | 持久执行与审批回调 | 1.1.4 |\n| Amazon EKS / ECS / Fargate / ECR | 容器编排与镜像治理 | 1.1.6、1.1.8 |\n| Amazon VPC Lattice / ECS Service Connect | 服务网格 | 1.1.7 |\n| Lambda 并发 / HPA / Cluster Autoscaler / Application Auto Scaling | 扩缩容分层 | 1.1.9 |\n| ALB / NLB / AWS Load Balancer Controller / API Gateway（含 WebSocket） | 入口与实时通道 | 1.1.10、1.1.12 |\n| CloudFront / CloudFront Functions / Lambda@Edge | 边缘架构 | 1.1.11 |\n| Amazon Cognito（租户上下文）/ 行级安全 / KMS | 多租户隔离 | 1.1.13 |\n| Amazon Bedrock（含跨账户模式）/ Guardrails | 生成式 AI 集成 | 1.2.1 |\n| Amazon Bedrock AgentCore / Knowledge Bases | 智能体与 RAG | 1.2.2、1.2.4 |\n| Amazon SageMaker AI（终端节点/批量转换/无服务器） | ML 推理 | 1.2.3 |\n| AWS Direct Connect / VPN / Transit Gateway | 混合连接冗余 | 1.3.1、1.4.1 |\n| AWS DataSync / Storage Gateway / Transfer Family | 混合数据同步 | 1.3.2 |\n| Amazon API Gateway / Lambda / Amazon MQ | 遗留系统包装 | 1.3.3 |\n| Amazon Route 53 Resolver / 私有托管区 | 混合 DNS | 1.3.4 |\n| AWS Outposts / EKS Anywhere / ECS Anywhere / Local Zones | 混合计算 | 1.3.5 |\n| Amazon VPC IPAM / 安全组 / 网络 ACL | 编址与分段 | 1.4.2、1.4.3 |\n| AWS Network Firewall / AWS WAF / Gateway Load Balancer / VPC Flow Logs | 分层防护 | 1.4.3 |\n| IPv6 双栈 / Egress-only Internet Gateway | 双栈迁移 | 1.4.4 |\n| Amazon Route 53（路由策略）/ AWS Global Accelerator | 全局流量 | 1.4.5 |\n| Amazon S3 / Lake Formation / Redshift Spectrum / Apache Iceberg | 湖仓 | 1.5.1 |\n| Amazon MSK / EMR / Redshift / AppFlow | 分析管道 | 1.5.2 |\n| Amazon RDS / Aurora / DynamoDB / Redshift | 数据库选型 | 1.5.3 |\n| Multi-AZ / 读副本 / Aurora Global Database / global tables | 数据库高可用 | 1.5.4 |\n| Amazon EBS / EFS / FSx | 存储分工 | 1.5.5 |\n| ElastiCache / DAX | 缓存 | 1.5.6 |\n| AWS Glue Data Catalog / AWS Clean Rooms | 编目与协作共享 | 1.5.7 |","furtherReading":"| 页面 | 什么时候去看 | URL |\n|---|---|---|\n| SAP-C03 Exam Guide · Domain 1 | 本域技能点原文与权重 | https://docs.aws.amazon.com/aws-certification/latest/solutions-architect-professional-03/solutions-architect-professional-03-domain1.html |\n| AWS Step Functions 开发者指南 | 工作流模式与回调 | https://docs.aws.amazon.com/step-functions/latest/dg/ |\n| Amazon Bedrock 用户指南 | 生成式 AI 集成与护栏 | https://docs.aws.amazon.com/bedrock/latest/userguide/ |\n| Amazon Route 53 开发者指南 | Resolver 与路由策略 | https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/ |\n| Amazon SageMaker AI 开发者指南 | 推理形态 | https://docs.aws.amazon.com/sagemaker/latest/dg/ |\n\n这些页面都是 AWS 官方公开文档。中文资料与英文原文说法不一致时，以英文原文为准。"}},{"domain":2,"name":"安全性、合规性和监管","weight":"25%","practice":[{"id":"D2-001","d":2,"t":"single","q":"公司用 Microsoft Entra ID 管理员工，希望员工用同一账号登录 AWS 控制台，且员工离职后能自动在 AWS 侧停用账号。哪种组合最合适","o":[{"l":"A","t":"为每个员工在 IAM 建长期用户，定期手工核对离职名单"},{"l":"B","t":"配置 SAML 2.0 联合做控制台登录，配合 SCIM 同步用户生命周期"},{"l":"C","t":"用 IAM Roles Anywhere 让员工用证书换临时凭证访问控制台"},{"l":"D","t":"把根用户凭证开放给员工共享使用"}],"a":["B"],"e":"✅ 正确项：B。SAML 2.0 把控制台登录信任交给企业 IdP 实现单点登录，SCIM 负责入离职的用户生命周期自动同步，两者配合正好覆盖登录与停用。关联考点：域 2.1.1「使用标准协议实现身份联合」。\n\n❌ A：长期 IAM 用户加手工核对不符合联合理念，离职停用也容易遗漏。\n❌ C：Roles Anywhere 面向机器与工作负载用证书换凭证，不是员工控制台登录的方案。\n❌ D：共享根用户凭证违反最小权限与可追溯原则，是严重安全反模式。\n\n📌 关键概念：SAML 与 OIDC 管登录信任，SCIM 管用户生命周期，身份联合是两者配合而非单一协议。","s":"自编·2.1.1"},{"id":"D2-002","d":2,"t":"single","q":"客服机器人接入 Amazon Bedrock 对外服务，要求屏蔽涉敏内容、防止提示注入，并且输出要可审计。哪项方案最直接","o":[{"l":"A","t":"配置 Amazon Bedrock Guardrails 设置内容过滤、拒绝话题与敏感信息掩码"},{"l":"B","t":"在应用层自写关键词过滤，不引入 Bedrock 的专用能力"},{"l":"C","t":"把模型温度调到最低就能杜绝有害输出"},{"l":"D","t":"只在测试环境做人工审核，生产环境不设过滤"}],"a":["A"],"e":"✅ 正确项：A。Bedrock Guardrails 原生提供内容过滤、拒绝话题、敏感信息掩码与提示注入防护，是满足合规控制的最直接手段。关联考点：域 2.5.1「为生成式 AI 实施内容过滤与合规控制」。\n\n❌ B：自写关键词过滤覆盖有限、难以维护，也挡不住语义层面的注入与敏感情形。\n❌ C：调低温度只影响输出随机性，与内容安全合规无关，不能杜绝有害内容。\n❌ D：生产环境不设过滤等于没有控制，直接违反负责任 AI 的合规要求。\n\n📌 关键概念：GenAI 的内容合规要靠专门的护栏能力，不是靠调参数或关键词黑名单。","s":"自编·2.5.1"},{"id":"D2-003","d":2,"t":"single","q":"Fabrikam 做面向客户的门户：客户要注册登录，登录后要直接读自己目录里的 S3 文件；门户后端跑在 EKS 上要写日志，全程不落长期密钥。身份方案怎么配","o":[{"l":"A","t":"为每个客户建 IAM 用户，把访问密钥发给门户后端代为调用"},{"l":"B","t":"用户池管登录，客户拿用户池签发的令牌直接调 S3 API"},{"l":"C","t":"用户池管注册登录，身份池把登录身份换成受限角色凭证读自己前缀；EKS 后端用 Pod Identity 拿角色写日志"},{"l":"D","t":"客户全部走 IAM Identity Center 单点登录"}],"a":["C"],"e":"✅ 正确项：C。认证与授权分开设计：用户池管客户身份（注册、登录、多因素认证，签发 JWT）；身份池把登录身份换成临时 AWS 凭证，以受限角色只读自己前缀；容器后端用 EKS Pod Identity 把服务账号映射成 IAM 角色，全程零长期密钥。关联考点：域 2.1.2「设计应用认证和授权方案」。\n\n❌ A：客户级 IAM 用户加长期密钥是双重反模式——权限模型错位且泄露窗口大。\n❌ B：用户池令牌不是 AWS 凭证，直调 S3 走不通，中间缺身份池换凭证这一环。\n❌ D：IAM Identity Center 是员工身份联合的通道，不是面向外部客户的形态。\n\n📌 关键概念：用户池认人、身份池发 AWS 凭证、Pod Identity 给容器身份；三件事别混用。","s":"自编·2.1.2"},{"id":"D2-004","d":2,"t":"multiple","q":"Contoso 请一家 MSP 代管多个 AWS 账号，既要让 MSP 干得了活，又要防它权限过大或内部误配置。哪些机制能落地最小权限（选所有适用项）","o":[{"l":"A","t":"给 MSP 的跨账户角色强制带外部 ID"},{"l":"B","t":"给 MSP 角色挂权限边界，上限只到运维操作"},{"l":"C","t":"给 MSP 角色直接挂 AdministratorAccess，省得来回改策略"},{"l":"D","t":"财务数据按 ABAC 标签隔离，MSP 角色无对应标签授权即不可见"},{"l":"E","t":"生成长期访问密钥发给 MSP 写进配置文件"}],"a":["A","B","D"],"e":"✅ 正确项：A、B、D。最小权限靠机制组合落地：跨账户访问强制带外部 ID，防第三方被诱导操作别的账号的混淆代理人问题；权限边界给角色设权限上限，即使 MSP 内部误挂管理员策略也越不过线；ABAC 按标签授权，财务数据对无标签授权的主体天然不可见。关联考点：域 2.1.3「设计最小权限访问控制，如跨账户访问和临时凭证」。\n\n❌ C：挂 AdministratorAccess 与最小权限的目标直接相反，一次误操作就是全域事故。\n❌ E：长期密钥写进配置文件，泄露窗口无限大，应换 STS 临时凭证。\n\n📌 关键概念：最小权限六件套是角色策略、权限边界、外部 ID、会话策略、ABAC、临时凭证——各卡一类风险。","s":"自编·2.1.3"},{"id":"D2-005","d":2,"t":"single","q":"Fabrikam 的第三方运维商通过跨账户角色接入后，还希望每次运维会话的权限临时再收一档，会话结束即恢复。用哪种机制","o":[{"l":"A","t":"给角色再追加一个更大的托管策略扩大灵活度"},{"l":"B","t":"STS 换凭证时叠会话策略，本次会话权限取更小集合"},{"l":"C","t":"让运维商共享根用户凭证手工操作"},{"l":"D","t":"会话级收紧做不到，只能预先把角色权限收到最小"}],"a":["B"],"e":"✅ 正确项：B。会话策略是专门给临时会话再叠一层限制的机制：AssumeRole 时带上会话策略，本次会话的有效权限是角色策略与会话策略的交集，比角色本身更小；会话凭证到期，限制随之消失，角色权限不用改。关联考点：域 2.1.3「设计最小权限访问控制，如跨账户访问和临时凭证」。\n\n❌ A：追加更大策略是放宽不是收紧，方向反了。\n❌ C：共享根用户凭证违反最小权限与可追溯原则，是严重反模式。\n❌ D：会话级收紧正是会话策略存在的意义，「做不到」的说法不成立。\n\n📌 关键概念：会话策略管单次会话的再收紧；角色不动、会话变短、权限更小，是临时凭证体系的第三道口。","s":"自编·2.1.3"},{"id":"D2-006","d":2,"t":"single","q":"Tailspin 的 S3 数据湖要求数据只能从公司 VPC 内访问，同时担心某个桶策略被误配置成允许外部账号读取。防护怎么配","o":[{"l":"A","t":"只配安全组限制对 S3 的访问"},{"l":"B","t":"桶策略保持开放，靠季度人工审计兜底"},{"l":"C","t":"把数据拷贝到各团队本地自行管理"},{"l":"D","t":"S3 配 VPC 终端节点策略只认公司 VPC 的终端节点，同时开 Access Analyzer 扫描资源策略，发现意外外部共享即告警"}],"a":["D"],"e":"✅ 正确项：D。数据边界要身份与网络两道门一起守：VPC 终端节点策略把访问路径锁在公司网络内，数据只能从指定终端节点进出；IAM Access Analyzer 持续分析资源策略，一旦桶被误配成允许外部账户访问立即告警——网络边界与身份越界各有一道闸。关联考点：域 2.1.4「设计数据边界控制和外部访问校验方案」。\n\n❌ A：S3 不由安全组管辖，数据边界也不等于安全组，这层管不住对象存储的访问路径。\n❌ B：开放加事后人工审计是被动脉冲，误共享窗口期敞着。\n❌ C：拷贝分发数据破坏集中治理，还制造一堆权限失控的副本。\n\n📌 关键概念：数据边界三门是 Access Analyzer 查身份越界、终端节点策略锁网络、Verified Access 放外部用户，叠加而非三选一。","s":"自编·2.1.4"},{"id":"D2-007","d":2,"t":"single","q":"Fabrikam 的远程审计人员要访问内部报表应用，公司不想为这批外部用户专门上 VPN，还要求按设备合规状态与身份双重放行。怎么配","o":[{"l":"A","t":"用 AWS Verified Access 按设备状态与身份做应用级零信任放行"},{"l":"B","t":"为审计人员逐个创建 IAM 用户并发放长期密码"},{"l":"C","t":"把报表应用暴露到公网，配 IP 白名单限制"},{"l":"D","t":"给所有外部用户开通 Site-to-Site VPN 连进 VPC"}],"a":["A"],"e":"✅ 正确项：A。Verified Access 正是给没有 VPN 的外部用户做应用级零信任访问的服务：按设备合规状态与用户身份逐次评估放行，应用不暴露公网，也不需要为外部用户建 VPN 通道，两个约束一次满足。关联考点：域 2.1.4「设计数据边界控制和外部访问校验方案」。\n\n❌ B：外部用户发 IAM 用户加长期密码，凭证泄露窗口大且没有设备状态评估这一层。\n❌ C：公网暴露加 IP 白名单，设备合规评估做不到，暴露面也大了一圈。\n❌ D：为少数外部用户上整条 VPN，成本与运维负担最重，且与题给约束相反。\n\n📌 关键概念：Verified Access 管外部用户怎么安全进来——设备状态加身份的应用级零信任，VPN 的轻量替代。","s":"自编·2.1.4"},{"id":"D2-008","d":2,"t":"single","q":"Contoso 机房的批处理程序每天要往 S3 上传对账文件，目前把长期访问密钥写在十几台机器的配置文件里，轮换一次要改一遍。怎么改最合适","o":[{"l":"A","t":"长期密钥改成每季度手工轮换一次，减少改动频率"},{"l":"B","t":"把程序全部搬进 EC2 用实例角色取凭证"},{"l":"C","t":"用 Roles Anywhere：程序持 X.509 证书对请求签名，经信任锚校验换出临时凭证，到期自动失效"},{"l":"D","t":"建一个专用 IAM 用户，密钥只存在一台中心机器"}],"a":["C"],"e":"✅ 正确项：C。负载跑在 AWS 之外又要调 AWS，是 Roles Anywhere 的标准场景：程序持有受信 CA 签发的 X.509 证书对请求签名，Roles Anywhere 经信任锚校验后换出临时凭证，凭证到期自动失效，机房配置文件里不再存任何长期密钥。关联考点：域 2.1.5「为混合云和多云环境设计工作负载身份」。\n\n❌ A：季度手工轮换仍是长期密钥，泄露窗口只是变长变短的区别，问题没解决。\n❌ B：程序跑在机房是题给约束，搬进 EC2 等于为身份问题重写部署形态，代价错配。\n❌ D：专用 IAM 用户还是长期密钥，集中存放只是把风险换个单点。\n\n📌 关键概念：AWS 内的负载用各自 IAM 角色，AWS 外的负载用 Roles Anywhere 加证书换临时凭证。","s":"自编·2.1.5"},{"id":"D2-009","d":2,"t":"single","q":"Tailspin 的数据湖被审计方要求「密钥每年轮换且记录可查、密钥策略要自主管理、要能跨账户集中管密钥」。KMS 怎么配","o":[{"l":"A","t":"全部使用 AWS 托管密钥，服务自动创建与轮换"},{"l":"B","t":"建客户管理密钥并开自动轮换，数据湖桶默认加密指向该密钥，轮换状态与历史可查"},{"l":"C","t":"手工每季度重建新密钥并把全部旧数据重新加密一遍"},{"l":"D","t":"为每个桶各建一把专属客户管理密钥并全部开轮换"}],"a":["B"],"e":"✅ 正确项：B。审计要求证明轮换策略与策略自主管理，指向客户管理密钥：自建密钥能配 key policy 与跨账户授权，开启自动轮换后轮换状态与历史可直接取证，桶默认加密指向该密钥即全量生效。关联考点：域 2.2.1「使用客户管理密钥和自动密钥轮换实现静态加密」。\n\n❌ A：AWS 托管密钥零维护，但策略不可自定义，审计要的「策略自主管理、轮换可证明」给不出来。\n❌ C：轮换换的是密钥材料不是重建密钥，旧数据无需重加密；手工重建既费力又不是自动轮换证据。\n❌ D：每个桶一把专属密钥是过度设计，策略维护成本翻数倍，讲义明确内部低敏数据不必如此。\n\n📌 关键概念：两档密钥的取舍在控制权不在强度——托管省心不可控，客户管理可控但要管轮换与策略。","s":"自编·2.2.1"},{"id":"D2-010","d":2,"t":"single","q":"Contoso 给客户管理密钥开了自动轮换后，安全团队问「旧数据要不要跟着重加密、应用引用要不要改」。正确的解释是","o":[{"l":"A","t":"轮换后旧数据必须全部重新加密一遍，否则读不出来"},{"l":"B","t":"轮换会生成新密钥 ID，所有应用引用都要更新"},{"l":"C","t":"轮换切换期间相关服务要停机配合"},{"l":"D","t":"轮换只换密钥材料，密钥 ID 不变；旧数据用旧材料解、新数据用新材料加密，无需重加密"}],"a":["D"],"e":"✅ 正确项：D。自动轮换的机制是换密钥材料不换密钥 ID：轮换后新数据用新材料加密，旧数据继续用保留下来的旧材料解密，应用侧引用的密钥 ID 不变，既不用改代码也不用停机重加密，轮换对业务透明。关联考点：域 2.2.1「使用客户管理密钥和自动密钥轮换实现静态加密」。\n\n❌ A：旧数据用旧材料照常解密，重加密一说把机制讲反了，白白引发一轮全量重写。\n❌ B：密钥 ID 保持不变正是设计的巧处，改引用这个说法与机制相反。\n❌ C：轮换是元数据层动作，服务无感知，不存在停机窗口。\n\n📌 关键概念：轮换换材料不换 ID、旧数据不重加密、新旧材料并存——这三句话是 KMS 轮换机制的考点核心。","s":"自编·2.2.1"},{"id":"D2-011","d":2,"t":"single","q":"Fabrikam 的证书需求分三路：公网官网要零成本全自动续期；内部微服务之间要双向 TLS 认证且域名全是内部名；另有一批第三方 CA 签发的证书要挂负载均衡器。证书管理怎么配","o":[{"l":"A","t":"公网证书走 ACM 自动续期，内部域名用 Private CA 签私有证书做双向 TLS，第三方证书导入 ACM 挂载"},{"l":"B","t":"内部域名找公有 CA 付费签发证书"},{"l":"C","t":"导入的第三方证书同样依赖 ACM 自动续期"},{"l":"D","t":"内部服务之间不配 TLS，内网传输天然可信"}],"a":["A"],"e":"✅ 正确项：A。证书三路各归其位：公网域名证书让 ACM 签发，免费且自动续期，运维零介入；内部域名与双向 TLS 场景用 AWS Private CA 签私有证书，带组织身份体系；第三方 CA 签的证书导入 ACM 挂载负载均衡器即可复用，只是续期要自己管。关联考点：域 2.2.2「使用证书管理实现传输中加密」。\n\n❌ B：公有 CA 不给内部域名签发证书，这条路从规则上就走不通。\n❌ C：ACM 自动续期只覆盖 ACM 亲自签发的证书，导入的证书续期责任在使用方自己。\n❌ D：内网明文传输是常见错误认知，传输加密对内部流量同样缺一不可。\n\n📌 关键概念：证书三路——公有走 ACM 自动续、导入的自己续、内部域名走 Private CA；TLS 1.3 是现行标准协议。","s":"自编·2.2.2"},{"id":"D2-012","d":2,"t":"single","q":"Contoso 的支付通道被卡组织要求「支付密钥只能存储在单租户独占的 FIPS 三级验证硬件里」。方案怎么选","o":[{"l":"A","t":"用 KMS 托管服务，本身就是安全硬件"},{"l":"B","t":"用客户管理密钥并配最严格的 key policy 即可等效满足"},{"l":"C","t":"双实例 CloudHSM 集群管支付密钥，应用经 KMS 自定义密钥存储调用，合规报告写明硬件独占"},{"l":"D","t":"把密钥文件存在加密 EBS 卷上由应用自管"}],"a":["C"],"e":"✅ 正确项：C。合规条文白纸黑字写了「单租户」「三级验证硬件」，这类硬性要求只有 CloudHSM 能满足：单租户专属实例、FIPS 140-2 三级验证的硬件；双实例起步保高可用，应用侧经 KMS 自定义密钥存储照常调 API，合规报告可写明硬件独占。关联考点：域 2.2.3「实施专用硬件安全模块以满足合规要求」。\n\n❌ A：KMS 是多租户共享的托管服务，共享硬件这一条就过不了关。\n❌ B：客户管理密钥拿到的是控制权不是硬件独占，与三级验证的条文要求是两回事。\n❌ D：加密 EBS 卷不是抗篡改的专用密码硬件，合规语义完全对不上。\n\n📌 关键概念：CloudHSM 的触发条件是单租户与三级硬件的硬合规；常规加密 KMS 就够，成本差一个量级。","s":"自编·2.2.3"}],"sections":[{"h":"设计身份安全架构","body":"### 这一域考什么\n\n这一域问的是：怎么给一套复杂的 AWS 架构配上安全、合规与治理的护栏。\n\n四条线串起全章：\n\n1. **身份与访问**：谁能进、能做什么、跨账号怎么授权，对应任务 2.1。\n2. **加密与密钥**：静态数据怎么加密、密钥怎么管、后量子怎么准备，对应任务 2.2。\n3. **多账号治理与合规**：组织单元、防护栏、集中日志、自动化合规，对应任务 2.3 和 2.4。\n4. **负责任 AI**：生成式 AI 内容过滤、访问控制、人工监督，对应任务 2.5。\n\n这门课是专业级（Professional），考核动词以 Design（设计）、Implement（实现）、Configure（配置）为主。它不考你认不认识某个服务，考的是给你一个有约束的场景，你能说出用哪套机制、为什么、代价是什么。\n\n### 读完这个域要能做什么\n\n这门课写给有两年以上 AWS 实操经验、做过账号规划或安全设计的架构师。读完本域应能：\n\n- 说清身份 federation（联合）解决什么问题，SAML 与 OIDC 各用在什么场合。\n- 判断一个应用该用用户池还是身份池，说出两者分工。\n- 设计一套最小权限方案，讲得出权限边界、外部 ID、ABAC 各自卡住哪类风险。\n- 区分数据边界控制与传统网络控制，说出 AWS 里对应哪几个服务。\n- 为静态与传输中数据选对加密方案，讲清客户管理密钥、证书与硬件模块的取舍。\n- 搭起多账号组织结构与防护栏，配出集中日志与自动合规监控。\n- 为生成式 AI 应用配内容过滤、访问控制与人工审批。\n\n### 和其他认证怎么接\n\n| 其他认证/能力 | 对应的那件事 | 这里有什么不同 | 什么时候该想起它 |\n|---|---|---|---|\n| SAA-C03（解决方案架构师助理级） | 都讲 IAM 基本对象 | 助理级要求你认得角色和策略；专业级要求你在多账号、跨区域场景下设计最小权限与联合 | 只会配单账号、遇到跨账号就卡住时 |\n| 安全专项（Security Specialty） | 都讲身份与加密 | 专项深挖检测与事件响应；本课只到你作为架构师要做的顶层设计 | 要判断「这该架构师管还是安全团队管」时 |\n\n对照只用来迁移已有理解。做题以本域官方口径为准。\n\n### 官方口径的三条边界\n\n- 官方 Exam Guide 给出技能点编号与原文，不给逐考点的出现频率。\n- 官方认证页写明题型含单选与多选，多选必须全选对才得分。\n- 及格线 720 分（100–1000 补偿式计分），不要求每域单独达线。\n\n#### 这一节学什么\n这一节对应考纲任务 2.1「设计身份安全架构」。\n\n> 官方原名：Design identity security architectures.\n\n这一任务解决一个问题：在一个有多个账号、多个应用、还有混合云的场景里，怎么把「谁是谁、谁能做什么」设计清楚。五个技能点从外到内推进：先打通外部身份（联合），再解决应用的认证与授权，然后收紧到最小权限，接着守住数据边界，最后覆盖跑在 AWS 之外的负载身份。\n\n考题喜欢给一个组织现状，让你挑合适的身份机制。学的时候抓住这条主线：联合登录 → 应用认证 → 最小授权 → 数据边界 → 工作负载身份。\n\n#### 用标准协议实现身份联合\n\n> 官方原名：Implement identity federation by using standard protocols (for example, AWS IAM Identity Center, SAML 2.0, OpenID Connect, System for Cross-domain Identity Management [SCIM]).\n\n**这条在问什么。** 考题给你「公司用微软 Entra ID 管员工，员工要用同一个账号登录 AWS 控制台」这类场景，让你说出该用什么机制打通。答案是身份联合，并说清 SAML 与 OIDC 各管什么。\n\n**定义**：身份联合（identity federation）是把 AWS 的登录信任交给一个外部身份提供方（IdP，identity provider）——员工在 IdP 登录，拿到一个断言，AWS 凭这个断言放行，不必在 AWS 里再建一套账号密码。\n\n**怎么运作**。三种协议各管一段：\n\n- SAML 2.0：偏企业单点登录，浏览器访问控制台用得多，IdP 返回一段 XML 断言。\n- OIDC（OpenID Connect）：偏应用与 API 场景，基于 OAuth 2.0，返回的是 JSON 格式的 ID 令牌。\n- SCIM（跨域身份管理系统）：管的是「人」的同步——员工入职、调岗、离职，自动在 IAM Identity Center 里建号、改组、停用，避免手工维护。\n\nAWS 侧把这些收拢到 IAM Identity Center：它接住外部 IdP 的断言，再按权限集（permission set）把访问权限分配到账号。\n\n**什么时候用，什么时候别用**。员工身份已经在企业 IdP 里管，就用联合，别在 AWS 里另建一套。员工数量少、没有企业 IdP，直接用 IAM Identity Center 的内置目录更省事。SCIM 只在需要自动同步生命周期时才上，人不多时手工反而简单。\n\n💡 **场景举例**（虚构教学示意）：Contoso 用 Entra ID 管两千名员工。接入 IAM Identity Center 后，员工用公司账号单点登录 AWS 控制台；离职员工在 Entra ID 停用，SCIM 当天同步把 AWS 侧账号也停掉，没有留下孤儿账号。\n\n**关联服务**：AWS IAM Identity Center、SAML 2.0、OIDC、SCIM、企业 IdP（如 Microsoft Entra ID）。\n\n#### 设计应用的认证与授权方案\n\n> 官方原名：Design application authentication and authorization solutions (for example, by using Amazon Cognito user pools, identity pools, OAuth 2.0, Amazon EKS Pod Identity).\n\n**这条在问什么。** 考题给你「一个面向客户的 Web 应用要注册登录，还要能调 AWS API」这类场景，让你把认证和授权两件事分开设计。考点是分清用户池与身份池的分工。\n\n**定义**：认证（authentication）回答「你是谁」，授权（authorization）回答「你能做什么」。这两件事在 AWS 里由不同组件承担，混用是常见错误。\n\n**怎么运作**。Cognito 把两者拆开：\n\n- 用户池（user pool）：管客户身份——注册、登录、密码策略、多因素认证，登录后给的是 JWT 令牌。它管的是「客户是谁」。\n- 身份池（identity pool）：管 AWS 凭证——把用户池或第三方身份换成临时的 AWS 访问凭证，让你能以某个 IAM 角色调 API。它管的是「能调哪些 AWS 资源」。\n- OAuth 2.0：应用之间标准的授权框架，用来对接第三方登录。\n- EKS Pod Identity：容器场景专用，把 Kubernetes 服务账号直接映射成 IAM 角色，Pod 不用自己管理密钥。\n\n**什么时候用，什么时候别用**。要客户能注册登录，上用户池；要这些客户直接访问 S3 或 DynamoDB，再配身份池。容器里跑的应用要调 AWS，用 EKS Pod Identity，别把长期密钥塞进环境变量。只是内部服务之间调用，用 IAM 角色即可，不必引入用户池。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 做一个客户门户。客户在 Cognito 用户池注册登录；登录后通过身份池换到临时凭证，只能读自己那一个 S3 前缀的文件。门户后端跑在 EKS 上，用 Pod Identity 拿角色去写日志，全程没有写死密钥。\n\n**关联服务**：Amazon Cognito（用户池、身份池）、OAuth 2.0、Amazon EKS Pod Identity、IAM 角色。\n\n#### 设计最小权限访问控制\n\n> 官方原名：Design least-privilege access controls such as cross-account access and temporary credentials (for example, by using IAM roles, IAM policies, permissions boundaries, external IDs, session policies, attribute-based access control [ABAC]).\n\n**这条在问什么。** 考题给你一个「权限太大、怕越权」的场景，让你在几种收紧手段里选对组合。它考的是你能不能说出每种手段具体卡住哪类风险，而不是背名字。\n\n**定义**：最小权限（least privilege）是只给完成工作必需的最小权限，不多给一分。专业级考的不是「要不要最小权限」——大家都说要——而是给你一个组织，你用哪几种机制把它落地。\n\n**怎么运作**。六种手段各管一个口子：\n\n- IAM 角色与策略：基础，用角色代替长期用户，权限按策略授予。\n- 权限边界（permissions boundary）：给身份能拿到的权限设上限——即使有人误挂了管理员策略，也越不过这条线。\n- 外部 ID（external ID）：第三方跨账号访问时必带的标识，专门防「混淆代理人」问题——防止第三方被诱导去操作别的账号。\n- 会话策略（session policy）：临时会话再叠一层限制，让这次会话比角色本身的权限更小。\n- ABAC（基于属性的访问控制）：按标签授权，比如「只能操作带自己部门标签的资源」，人多了也不必为每个岗位写一套策略。\n- 临时凭证：用 STS 换取短期凭证，替代长期密钥，泄露窗口短。\n\n**什么时候用，什么时候别用**。跨账号访问一定要配外部 ID，这是硬要求。人员或资源按维度归类、权限随标签走，用 ABAC 比维护几十条策略省事。权限边界适合给非管理员开放「自己建角色」能力时兜底。只是单人单账号，标准角色加策略就够，不必上全套。\n\n💡 **场景举例**（虚构教学示意）：Contoso 请一家 MSP 代管账号。MSP 用跨账号角色接入，策略里强制带外部 ID；给 MSP 的角色挂权限边界，上限只到运维操作；财务数据由 ABAC 按标签隔离，MSP 看不到。即使 MSP 内部配错策略，也越不过边界。\n\n**关联服务**：AWS IAM（角色、策略、权限边界）、AWS STS（临时凭证、会话策略）、ABAC 标签体系。\n\n#### 设计数据边界控制与外部访问校验\n\n> 官方原名：Design data perimeter controls and external access validation solutions (for example, by using AWS Identity and Access Management Access Analyzer, VPC endpoint policies, AWS Verified Access).\n\n**这条在问什么。** 考题给你「怎么防止数据被从公司网络外访问」这类场景，让你把身份边界和网络边界配合起来设计。考点是分清哪几个服务守哪一道门。\n\n**定义**：数据边界（data perimeter）是一组护栏，保证「只有可信身份、从可信网络、用可信资源」才能访问数据。它不是单个服务，而是几类控制拼出来的整体。\n\n**怎么运作**。三道门各管一段：\n\n- IAM Access Analyzer：持续分析资源策略，找出哪些资源被意外共享给外部账号——它管的是「身份边界」，发现越界的共享就报警。\n- VPC 终端节点策略：限制数据只能从指定的 VPC 终端节点访问，等于把访问路径锁在公司网络内——它管的是「网络边界」。\n- AWS Verified Access：给没有 VPN 的用户做应用级零信任访问，按设备状态和身份放行——它管的是「外部用户怎么安全进来」。\n\n**什么时候用，什么时候别用**。担心 S3 桶被跨账号读，用 Access Analyzer 定期扫。要求数据不出内网，用终端节点策略。要给远程员工或第三方访问内部应用，又不想上 VPN，才用 Verified Access。这三道是叠加关系，不是三选一：身份、网络、应用各守一层。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的 S3 数据湖要求不出公司 VPC。做法是给 S3 配终端节点策略，只认本公司 VPC 的终端节点；同时开 Access Analyzer，一旦发现某个桶策略被误改成允许外部账号，立刻告警。远程审计人员要看报表，走 Verified Access，按设备合规状态放行。\n\n**关联服务**：AWS IAM Access Analyzer、VPC 终端节点策略、AWS Verified Access、Amazon S3 资源策略。\n\n#### 为混合云和多云设计工作负载身份\n\n> 官方原名：Design workload identities for hybrid and multi-cloud environments (for example, by using IAM Roles Anywhere).\n\n**这条在问什么。** 考题给你「跑在机房或另一朵云上的程序要调 AWS API，怎么给它身份」这类场景。考点是认出这种情况不能用长期密钥，要用工作负载身份联合。\n\n**定义**：工作负载身份（workload identity）是给「程序」而不是「人」发的身份。混合云场景里，程序跑在 AWS 之外，却需要调用 AWS，这时的问题是怎么让它证明自己的身份、又不留下长期密钥。\n\n**怎么运作**。IAM Roles Anywhere 的做法是：\n\n- 你持有一张受信任的 X.509 证书，用私钥对 AWS API 请求签名。\n- Roles Anywhere 拿这张证书去信任锚（trust anchor）校验，验证通过就换出临时凭证。\n- 程序拿临时凭证调 AWS，凭证到期自动失效。\n\n这样就不需要在机房机器上存长期访问密钥。证书本身也要管好——私钥泄露等同于身份泄露。\n\n**什么时候用，什么时候别用**。负载跑在 EC2、ECS、Lambda 上，用各自的 IAM 角色，不需要 Roles Anywhere。负载跑在 AWS 之外（机房、另一朵云），又必须调 AWS，才用 Roles Anywhere。负载完全不碰 AWS，就不用管这套。\n\n💡 **场景举例**（虚构教学示意）：Contoso 有一套跑在自有数据中心的批处理程序，每天要往 S3 上传对账文件。以前把长期密钥写在配置里，轮换一次要改十几台机器。改用 Roles Anywhere 后，程序用机器证书换临时凭证，证书由内部 CA 统一轮换，配置里不再有密钥。\n\n**最小配置示意**（教学示意，占位符换成自己的值；生产环境私钥改用硬件保护）：\n\n```\n# 1) 用内部 CA 的证书建信任锚\naws rolesanywhere create-trust-anchor \\\n  --name corp-ca-anchor \\\n  --source \"sourceData={acmPcaArn=arn:aws:acm-pca:<区域>:<账号>:certificate-authority/<ID>}\"\n\n# 2) 建角色，信任策略允许 Roles Anywhere 主体\n#    信任策略条件里绑定 CA 的 subject，只有本机构证书能换凭证\n\n# 3) 建配置文件，把角色挂到信任锚\naws rolesanywhere create-profile \\\n  --name upload-role-profile \\\n  --role-arns arn:aws:iam::<账号>:role/OnPremUploadRole \\\n  --trust-anchor-arn <步骤1返回的信任锚ARN>\n\n# 4) 机房程序用 signing helper 换凭证（无长期密钥）\naws_signing_helper credential-process \\\n  --certificate /etc/certs/host.pem \\\n  --private-key /etc/certs/host.key \\\n  --trust-anchor-arn <信任锚ARN> \\\n  --profile-arn <配置文件ARN> \\\n  --role-arn arn:aws:iam::<账号>:role/OnPremUploadRole\n```\n\n**关联服务**：AWS IAM Roles Anywhere、AWS Private CA（签发 X.509 证书）、AWS IAM（信任锚与角色）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「用户池和身份池是一回事」 | 用户池管客户身份，身份池换 AWS 凭证，两者分工不同，常配合使用 |\n| 2 | 「联合登录就是把账号密码同步到 AWS」 | 联合是把信任交给外部 IdP，AWS 侧不存密码；SCIM 同步的是账号生命周期 |\n| 3 | 「最小权限就是策略写得细一点」 | 靠的是多种机制组合：权限边界设上限、外部 ID 防混淆代理人、ABAC 按标签收口 |\n| 4 | 「跨账号访问带不带外部 ID 无所谓」 | 第三方跨账号必带外部 ID，否则有混淆代理人风险 |\n| 5 | 「数据边界等于安全组」 | 数据边界同时管身份、网络和外部访问三道门，安全组只管网络一层 |\n| 6 | 「机房程序调 AWS 就把密钥配上去」 | 用 Roles Anywhere 换临时凭证，长期密钥泄露窗口太大 |\n\n#### 记忆要点\n\n1. **联合三协议**：SAML 管控制台单点登录，OIDC 管应用令牌，SCIM 管账号生命周期同步。\n2. **Cognito 两池**：用户池认人，身份池发 AWS 凭证，别混用。\n3. **最小权限六件套**：角色策略、权限边界、外部 ID、会话策略、ABAC、临时凭证。\n4. **数据边界三门**：Access Analyzer 查身份越界，终端节点策略锁网络，Verified Access 放外部用户。\n5. **工作负载身份**：AWS 内用各自角色，AWS 外用 Roles Anywhere 加证书换临时凭证。\n6. **专业级考法**：题目给约束场景，要你说「用哪个机制、为什么、代价」——不是选服务名。\n\n---"},{"h":"设计实现加密和密钥管理策略的方案","body":"#### 这一节学什么\n这一节对应考纲任务 2.2「设计实现加密和密钥管理策略的方案」。\n\n> 官方原名：Design solutions to implement encryption and key management strategies.\n\n这一任务把「数据怎么加密、密钥放谁手里」设计清楚。四个技能点从静态加密走到传输加密，再到合规要的专用硬件，最后准备后量子时代。主线是：静态加密 → 传输加密 → 硬件合规 → 后量子准备。\n\n#### 使用客户管理密钥和自动密钥轮换实现静态加密\n\n> 官方原名：Implement encryption at rest by using customer managed keys and automatic key rotation (for example, by using AWS KMS).\n\n**这条在问什么。** 考题给你「数据要加密、审计要求密钥每年换、密钥策略要自己管」这类约束，让你在几种密钥形态里选对组合。\n\n**定义**：静态加密（encryption at rest）是数据落盘时加密。AWS KMS（Key Management Service）是托管密钥服务，密钥材料留在受控硬件里。密钥分两档：AWS 托管密钥由服务自动创建与轮换，客户管理密钥由你自己建、自己配策略。\n\n**怎么运作**。四件事各管一段：\n\n- AWS 托管密钥：服务自动建自动轮换，零维护，但策略不可自定义。\n- 客户管理密钥：自己建，能配 key policy、别名与跨账号授权。\n- 自动轮换：换的是密钥材料，密钥 ID 不变；旧材料留着解旧数据，新数据用新材料。\n- 对称与非对称：对称密钥加解密同钥，多数服务集成用对称；非对称留给签名场景。\n\n**什么时候用，什么时候别用**。合规要求你能证明轮换策略、或要跨账号集中管密钥，用客户管理密钥。没有这类要求，AWS 托管密钥省事。别为了「看起来更安全」全上客户管理密钥——代价是要管策略，配错策略会把服务锁死。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的数据湖被审计要求「密钥每年轮换、轮换记录可查」。做法是建客户管理密钥并开自动轮换，桶默认加密指向该密钥；审计员要看证据，轮换状态与历史直接可查。\n\n**最小配置示意**（教学示意；区域与账号占位符换成自己的值）：\n\n```\n# 1) 建客户管理密钥（对称，用于加密/解密）\naws kms create-key --description \"datalake-cmk\" --key-usage ENCRYPT_DECRYPT\n\n# 2) 开启自动轮换（年周期，默认策略）\naws kms enable-key-rotation --key-id <密钥ID>\n\n# 3) S3 桶默认加密指向该密钥\naws s3api put-bucket-encryption --bucket <桶名> \\\n  --server-side-encryption-configuration '{\n    \"Rules\": [{\n      \"ApplyServerSideEncryptionByDefault\": {\n        \"SSEAlgorithm\": \"aws:kms\",\n        \"KMSMasterKeyID\": \"<密钥ID>\"\n      }\n    }]\n  }'\n```\n\n**关联服务**：AWS KMS、Amazon S3 服务端加密、AWS CloudTrail（密钥操作审计）。\n\n#### 使用证书管理实现传输中加密\n\n> 官方原名：Implement encryption in transit by using certificate management (for example, TLS 1.3, AWS Certificate Manager [ACM], AWS Private CA).\n\n**这条在问什么。** 考题给你「内外网流量都要 TLS、内部域名也要证书、续期不能靠人盯」这类场景，让你配证书管理方案。\n\n**定义**：传输中加密（encryption in transit）是数据在网络上传时加密。TLS 1.3 是现行标准协议。AWS Certificate Manager（ACM）管证书的签发与续期；AWS Private CA 在组织内部当发证机构。\n\n**怎么运作**。三条路各管一段：\n\n- ACM 公有证书：给公网域名签免费证书，挂到负载均衡器或 CDN 上自动续。\n- ACM 导入证书：第三方 CA 签的证书也能导入 ACM 使用，但续期要自己管。\n- AWS Private CA：给内部域名签私有证书，双向 TLS 与组织内身份体系用它。\n\n**什么时候用，什么时候别用**。公网入口证书让 ACM 签，零成本全自动。内部系统要双向认证、或证书要带组织身份，才上 Private CA——它有固定月费，证书量少时不上算。已有商业 CA 合同的，导入 ACM 挂负载均衡器即可，不必迁移。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的内部微服务之间要双向认证。做法是 Private CA 给每个服务签证书，调用方校验证书再放行，到期前统一换发；公网官网证书走 ACM 自动续期，运维不碰。\n\n**关联服务**：AWS Certificate Manager、AWS Private CA、Application Load Balancer、Amazon CloudFront（证书挂载点）。\n\n#### 实施专用硬件安全模块以满足合规要求\n\n> 官方原名：Implement dedicated hardware security modules to comply with regulations (for example, AWS CloudHSM).\n\n**这条在问什么。** 考题给你「监管要求密钥必须放在专用硬件、单租户独占、甚至要求 FIPS 三级验证」这类约束，问 KMS 还是 CloudHSM。\n\n**定义**：硬件安全模块（HSM，hardware security module）是抗篡改的专用密码硬件。AWS CloudHSM 提供单租户专属实例，密钥材料在你的 HSM 里生成与使用。\n\n**怎么运作**。与 KMS 的分工看三层：\n\n1. KMS：托管共享服务，多租户共用底层硬件，策略与轮换全托管。\n2. CloudHSM：单租户专属实例，官方口径为 FIPS 140-2 三级验证的硬件。\n3. 集成形态：CloudHSM 可以作为 KMS 的自定义密钥存储，应用侧照常调 KMS API。\n\n**什么时候用，什么时候别用**。合规条文白纸黑字写「专用硬件」「单租户」「三级验证」，只能 CloudHSM。常规加密需求用 KMS 就够，成本与运维差一个量级。代价要算清：CloudHSM 按小时计费，高可用还要至少两个实例起步。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的支付通道被卡组织要求「密钥只能存在单租户三级硬件里」。方案是双实例 CloudHSM 集群管支付密钥，应用经 KMS 自定义密钥存储调用，合规报告写明硬件独占。\n\n**关联服务**：AWS CloudHSM、AWS KMS（自定义密钥存储）、FIPS 140-2 Level 3。\n\n#### 设计后量子密码策略\n\n> 官方原名：Design post-quantum cryptography strategies (for example, by using AWS KMS with Module-Lattice Digital Signature Algorithm [ML-DSA], Module-Lattice-Based Key-Encapsulation Mechanism [ML-KEM]).\n\n**这条在问什么。** 考题给你「这批数据要保密十年以上、担心将来被量子计算机解开」这类前瞻约束，问后量子怎么准备。\n\n**定义**：后量子密码（PQC，post-quantum cryptography）是能抵抗量子攻击的新算法。ML-DSA 管数字签名，ML-KEM 管密钥封装，两者都出自 NIST 标准化的格密码家族。\n\n**怎么运作**。三条策略并行推进：\n\n1. 混合模式：经典算法与后量子算法并用，安全性取两者并集，是现阶段迁移的主流形态。\n2. 纯后量子：只跑 ML-DSA 与 ML-KEM，等生态完全成熟再切换。\n3. 数据分层：先换「现在抓取、将来解密」的长保密期高价值数据，普通数据按节奏跟。\n\n**什么时候用，什么时候别用**。数据保密期超过十年（医疗记录、长期档案），现在就上混合模式——「先抓后存、将来解密」的威胁已经存在。几个月就失效的会话流量，跟随供应商默认节奏即可，不必抢跑。证书体系整体换装工程量大，先盘点再动手。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的医疗影像按法规要保密二十年，安全团队评估量子风险十年内兑现。方案是先给这批数据套混合加密，密钥用 KMS 的后量子密钥类型，其余系统按年度盘点节奏换装。\n\n**关联服务**：AWS KMS（ML-DSA/ML-KEM 密钥类型）、TLS 1.3 混合密钥交换。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「客户管理密钥一定比 AWS 托管密钥安全」 | 差别在控制权不在强度；配错 key policy 反而把服务锁死 |\n| 2 | 「自动轮换会把旧数据重新加密一遍」 | 轮换只换新材料，旧数据用旧材料解，无需重加密 |\n| 3 | 「ACM 里的证书都能自动续期」 | 自动续期覆盖 ACM 签发的证书；导入的证书要自己续 |\n| 4 | 「内部域名找公有 CA 签最省事」 | 内部域名走 Private CA，公有 CA 不给内网名签发 |\n| 5 | 「要更安全就上 CloudHSM」 | 只有单租户与三级硬件的硬性合规要求才上，双实例起步成本高一个量级 |\n| 6 | 「后量子是将来的事现在不用管」 | 长保密期数据现在就要换混合模式，抓取存储式威胁已在路上 |\n\n#### 记忆要点\n\n1. **两档密钥**：AWS 托管省心不可控，客户管理可控但要管轮换与策略。\n2. **轮换机制**：换材料不换 ID，旧数据不重加密。\n3. **证书三路**：公有走 ACM 自动续，导入的自己续，内部域名走 Private CA。\n4. **HSM 分界**：单租户与三级验证的硬要求才上 CloudHSM，双实例起步。\n5. **后量子两算法**：ML-DSA 管签名，ML-KEM 管封装，现阶段以混合模式为主。\n6. **迁移节奏**：按保密期分层换装，长寿命数据先动。\n\n---"},{"h":"设计多账户治理和合规方案","body":"#### 这一节学什么\n这一节对应考纲任务 2.3「设计多账户治理和合规方案」。\n\n> 官方原名：Design multi-account governance and compliance solutions.\n\n这一任务解决「账号多了怎么管得住」的问题。六个技能点从组织结构铺到集中日志，再到资源共享与双层策略，最后补上自动合规与补丁。主线是：组织结构 → 集中日志 → 资源共享 → 策略强制 → 合规监控 → 漏扫补丁。\n\n#### 设计包含防护栏、着陆区和自动账户开通的组织结构\n\n> 官方原名：Design organizational structures that include features such as guardrails, landing zones, and automated account provisioning (for example, by using AWS Organizations, OUs, AWS Control Tower, AWS Control Tower Account Factory).\n\n**这条在问什么。** 考题给你「上百家账号要统一治理、新账号开通不能靠手工」这类场景，让你设计组织结构。\n\n**定义**：AWS Organizations 是多账户的管理容器；OU（organizational unit，组织单元）是组织内的分组；防护栏（guardrails）是组织层的强制规则；着陆区（landing zone）是账号开通即达标的基线环境；Account Factory 是 Control Tower 的自动开号流水线。\n\n**怎么运作**。四件事各管一段：\n\n- Organizations：注册账户、按 OU 分组、把 SCP 与 RCP 挂到层级上。\n- Control Tower：给着陆区打底，统一日志账户、审计账户与安全护栏。\n- Account Factory：按模板自动开新账号，网络、角色、基线一步到位。\n- OU 分层：按环境或业务线分组，护栏按层挂、按层收。\n\n**什么时候用，什么时候别用**。账户数上双位数、或要强制隔离环境，就上 Organizations 加 Control Tower。三五个人两三个账号，手工管理反而轻。OU 分层别太深——两层够用，层数多了策略继承难排查。\n\n💡 **场景举例**（虚构教学示意）：Contoso 分五个业务线，每年新开十几个项目账号。做法是 Control Tower 打底，每个业务线一个 OU，新项目走 Account Factory 开号，开通即带日志基线与区域护栏。\n\n**关联服务**：AWS Organizations、AWS Control Tower、Control Tower Account Factory。\n\n#### 实现集中式日志和配置管理方案，包括 AI 模型调用与响应的记录\n\n> 官方原名：Implement centralized logging and configuration management solutions, including solutions for AI model invocations and responses (for example, by using AWS CloudTrail organization trails, AWS Config aggregation, AWS GuardDuty, Amazon Security Lake, AWS Security Hub, Amazon CloudWatch Logs).\n\n**这条在问什么。** 考题给你「几十个账号的日志与配置要集中看、AI 调用也要留痕」这类场景，让你设计集中化方案。\n\n**定义**：组织跟踪（organization trail）是 CloudTrail 在组织层开的统一跟踪，所有成员账户自动覆盖。AWS Config 聚合器把各账号资源配置变更汇总到一处。Amazon Security Lake 把异构安全日志归一成统一数据湖。\n\n**怎么运作**。四层各管一段：\n\n1. 日志层：组织跟踪收全账号 API 事件，CloudWatch Logs 订阅集中应用日志。\n2. 配置层：Config 聚合器拉各账号资源配置与漂移。\n3. 分析层：GuardDuty 做威胁检测，Security Hub 汇总各安全服务的发现。\n4. 数据层：Security Lake 把异构日志归一，供检索与第三方分析。\n\nAI 调用留痕是这一版考纲点名的新形态：Bedrock 的模型调用日志可把调用与响应落到 S3 与 CloudWatch Logs，再入 Security Lake 统一分析。\n\n**什么时候用，什么时候别用**。多账户环境必上组织跟踪与 Config 聚合，这是治理底座。日志量大、要多工具联合分析时才上 Security Lake——存储本身是成本。AI 调用记录先定脱敏规则再落盘，提示词里可能有敏感数据。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 用 Bedrock 做客服助手，合规要求「AI 说了什么要可回溯」。做法是组织跟踪集中到日志账户，Bedrock 开模型调用日志指向专桶，Security Lake 归一检索，审计时按会话回放。\n\n**关联服务**：AWS CloudTrail（组织跟踪）、AWS Config（聚合）、AWS GuardDuty、Amazon Security Lake、AWS Security Hub、Amazon CloudWatch Logs、Amazon Bedrock（模型调用日志）。\n\n#### 配置跨账户资源共享\n\n> 官方原名：Configure cross-account resource sharing (for example, AWS Resource Access Manager [AWS RAM], AWS Transit Gateway).\n\n**这条在问什么。** 考题给你「多个账号要共用子网、镜像、专线这类资源，不想每个账号各买一套」这类场景，让你配共享方案。\n\n**定义**：AWS RAM（Resource Access Manager）把一个账号里的资源共享给其他账号或整个组织。Transit Gateway（传输网关）是网络层的中转枢纽，本身就支持跨账户挂载。\n\n**怎么运作**。三种共享各管一段：\n\n- RAM 共享资源：子网、解析规则、镜像这类「账号资产」按资源共享单元分发。\n- Transit Gateway 共享：网关本身走 RAM 共享，各账号 VPC 挂同一网关。\n- 共享边界：与组织共享可免逐账号邀请，组织外共享默认关闭。\n\n**什么时候用，什么时候别用**。网络类共享（子网、网关）用 RAM，省重复建设。共享给足边界——子网共享了，安全组与路由表还是各自管。怕共享失控，用「与组织共享」的集中开关，不要逐账号手点。\n\n💡 **场景举例**（虚构教学示意）：Contoso 网络账号里有一对专线接入的 Transit Gateway。各业务账号的 VPC 通过 RAM 共享挂上这对网关出公网与进机房，不用各自买专线，流量集中治理。\n\n**关联服务**：AWS Resource Access Manager、AWS Transit Gateway、AWS Organizations（组织内共享）。\n\n#### 使用 SCP 和 RCP 设计策略强制实施\n\n> 官方原名：Design policy enforcement by using SCPs and RCPs.\n\n**这条在问什么。** 考题给你「不许任何账号在指定区域外动资源、不许关日志、不许外部主体乱进」这类组织级红线，问 SCP 与 RCP 怎么分工。\n\n**定义**：SCP（service control policy，服务控制策略）挂在组织或 OU 层，限制成员账户里 IAM 主体能做的操作。RCP（resource control policy，资源控制策略）作用在资源侧，限制外部主体能怎么访问你账户里的资源。\n\n**怎么运作**。三条线叠加求交集：\n\n1. SCP 管出去：对成员账户设「操作天花板」，例如禁用高权限动作、限定可用区域。\n2. RCP 管进来：对资源设「准入门槛」，例如关键桶只接受组织内身份访问。\n3. 叠加关系：SCP、RCP 与 IAM 策略层层收窄，全部放行才放行。\n\n**什么时候用，什么时候别用**。组织级红线（区域边界、动作封禁、日志保护）用 SCP 与 RCP——IAM 策略成员账号管理员改得动，组织层策略改不动。精细授权留在 IAM 层做，SCP 别写成巨型白名单，难维护。RCP 对「防误共享给外部」特别好使，与资源策略叠加生效。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 划定业务只在两个区域跑。OU 上挂 SCP 拒绝其他区域的动作；再挂 RCP 限定关键桶只接受组织内身份，成员误配的开放策略也被 RCP 压住。\n\n**最小配置示意**（教学示意；区域按自己的合规范围改）：\n\n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"DenyOutsideApprovedRegions\",\n      \"Effect\": \"Deny\",\n      \"Action\": \"*\",\n      \"Resource\": \"*\",\n      \"Condition\": {\n        \"StringNotEquals\": {\n          \"aws:RequestedRegion\": [\"us-east-1\", \"us-west-2\"]\n        }\n      }\n    }\n  ]\n}\n```\n\n**关联服务**：AWS Organizations（SCP/RCP 挂载与继承）、AWS IAM（策略叠加关系）。\n\n#### 实现自动化合规监控\n\n> 官方原名：Implement automated compliance monitoring (for example, by using AWS Config rules, AWS Security Hub CSPM).\n\n**这条在问什么。** 考题给你「合规要持续可证明，不能靠年度人工检查」这类场景，让你配自动监控。\n\n**定义**：AWS Config 规则持续评估资源配置是否合规，违规即打标记。Security Hub 的 CSPM（cloud security posture management，云安全态势管理）把各账号安全态势聚合评分，持续对标准基线。\n\n**怎么运作**。三层各管一段：\n\n1. 检测层：Config 规则逐项判定，托管规则开箱即用，行业特殊项写自定义规则。\n2. 汇总层：Security Hub 聚合 Config 违规与各安全服务发现，按严重度分级。\n3. 响应层：违规触发事件，接自动修复或转工单，处理结果回流。\n\n**什么时候用，什么时候别用**。受监管工作负载（金融、医疗）必配持续合规：托管规则先铺满，自定义规则补行业项。小环境控制台看违规就够，不必全接自动修复。自动修复要分级——有些资源改了会断业务，先人工确认再自动化。\n\n💡 **场景举例**（虚构教学示意）：Contoso 每季度要向监管交合规证据。做法是托管规则铺满 OU，违规自动记录进证据桶，Security Hub 出评分趋势，季度报告一键导出。\n\n**关联服务**：AWS Config 规则、AWS Security Hub（CSPM）、Amazon EventBridge（违规事件流转）。\n\n#### 配置自动化漏洞扫描和补丁管理\n\n> 官方原名：Configure automated vulnerability scanning and patch management (for example, by using Amazon Inspector, AWS Systems Manager Patch Manager).\n\n**这条在问什么。** 考题给你「几百台实例的漏扫与打补丁要自动化、补丁要灰度不能一刀切」这类场景，让你配扫描与补丁流水线。\n\n**定义**：Amazon Inspector 自动扫描 EC2 实例、容器镜像与 Lambda 函数代码的软件漏洞。Systems Manager Patch Manager 按补丁基线与维护窗口给实例批量打补丁。\n\n**怎么运作**。三步流水线：\n\n1. 扫描：Inspector 对 EC2 免代理扫描，容器镜像在 ECR 推送时自动扫。\n2. 定级：按严重度与暴露面排优先级，公网可达的先修。\n3. 补丁：Patch Manager 按基线（哪些补丁、哪些实例）在维护窗口批量执行并出报告。\n\n**什么时候用，什么时候别用**。EC2 与容器为主的资产，Inspector 开箱即扫。补丁别直接全量上生产——基线先在测试窗口跑，验证后推生产窗口分批执行。Lambda 的依赖漏洞靠函数版本迭代修，不要指望运行中热修。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 两百台 EC2 分生产与测试 OU。Inspector 持续扫，高危发现自动生成工单；补丁基线先在测试窗口跑两周，再克隆到生产窗口分批推，出问题只回滚当批。\n\n**关联服务**：Amazon Inspector、AWS Systems Manager Patch Manager、AWS Security Hub（发现汇总）、Amazon ECR（镜像扫描）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「Control Tower 装完就万事大吉」 | 着陆区只是底座；护栏维护与 OU 演进要持续管 |\n| 2 | 「集中日志要逐账号拷一份到日志账户」 | 组织跟踪自动覆盖成员账户，Config 聚合器自动拉配置 |\n| 3 | 「SCP 能做精细授权」 | SCP 是天花板不是授权书，精细权限留在 IAM 层做 |\n| 4 | 「SCP 和 RCP 管的是同一件事」 | SCP 管本账户主体出去，RCP 管外部主体进来 |\n| 5 | 「RAM 共享了子网就共享了安全组」 | 子网共享了，安全组与路由表仍由各账号自理 |\n| 6 | 「补丁直接全量上生产最省事」 | 基线先测试窗口验证，再分批推生产，留回滚路径 |\n\n#### 记忆要点\n\n1. **治理四件**：Organizations 分组、Control Tower 打底、Account Factory 开号、OU 分层挂护栏。\n2. **集中日志**：组织跟踪全覆盖，Config 聚合配置，AI 调用单独开模型日志。\n3. **共享边界**：RAM 管账号资产共享，TGW 共享走 RAM，组织内共享免邀请。\n4. **双向策略**：SCP 管出去，RCP 管进来，与 IAM 层层求交集。\n5. **合规持续化**：托管规则先铺满，违规转事件，证据自动落桶。\n6. **补丁节奏**：扫描免代理，基线走窗口，测试先行生产分批。\n\n---"},{"h":"设计满足合规要求的架构","body":"#### 这一节学什么\n这一节对应考纲任务 2.4「设计满足合规要求的架构」。\n\n> 官方原名：Design architectures to meet compliance requirements.\n\n这一任务把「法规怎么说」翻译成「架构怎么建」。六个技能点从数据保护三支柱讲到主权与驻留，再到审计追踪、证据收集与风险评估。主线是：数据保护 → 数据主权 → 审计追踪 → 驻留控制 → 证据收集 → 风险评估。\n\n#### 设计满足数据保护要求的架构\n\n> 官方原名：Design architectures to meet data protection requirements (for example, by implementing encryption, access controls, audit logging).\n\n**这条在问什么。** 考题给你「法规要求数据全生命周期受保护」这类约束，让你把加密、访问控制与审计日志落到架构上。\n\n**定义**：数据保护三支柱是静态与传输加密、最小权限访问控制、完整审计日志。多数数据保护法规的底层要求都能归到这三件上。\n\n**怎么运作**。三层各管一段：\n\n1. 加密层：KMS 密钥按数据域分层，静态与传输全覆盖。\n2. 访问层：身份、权限、数据边界三重收口，最小权限落地。\n3. 审计层：API 事件、资源访问、应用日志三条链集中留存。\n\n**什么时候用，什么时候别用**。受监管场景配「分层密钥 + 专属日志账户」强化。内部低敏数据用默认加密与托管密钥即可——为每个桶建专属客户管理密钥，策略维护成本不划算。\n\n💡 **场景举例**（虚构教学示意）：Contoso 按数据保护法改造客户数据平台。每数据域一把 KMS 密钥，权限按岗位收窄，访问审计集中到安全账户。年度评估直接对照三支柱出证据。\n\n**关联服务**：AWS KMS、AWS IAM、AWS CloudTrail（三支柱的落点）。\n\n#### 设计满足监管要求的方案，如数据主权控制\n\n> 官方原名：Design solutions to meet regulatory requirements such as data sovereignty controls.\n\n**这条在问什么。** 考题给你「某国家或地区要求数据只能在其境内存储与处理」这类主权级约束，让你设计边界。\n\n**定义**：数据主权（data sovereignty）指数据受存储地所在国家或地区法律管辖的状态。技术上落地为「数据、处理、密钥都不出指定地理边界」的架构约束。\n\n**怎么运作**。三条主权线：\n\n1. 存储边界：数据只落指定区域，区域的地理属性是主权的物理基础。\n2. 处理边界：计算与密钥同在境内——密钥出境等于把控制权送出去。\n3. 管理边界：运维入口与根账号管理也在境内完成，不留跨境通道。\n\n**什么时候用，什么时候别用**。有明确主权法规的市场（政府、关键基础设施）按三边界设计。跨国业务先看合规评估结论，全套境内独立栈的成本与灵活性损失要算清。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 承接某国政务数据平台，合同要求数据、处理、密钥全部境内。方案是只用该国区域，KMS 密钥建在本区，运维入口走境内网络，管理账号不配境外访问路径。\n\n**关联服务**：AWS Region（地理边界）、AWS KMS（密钥属地）、数据边界控制（任务 2.1）。\n\n#### 为受监管工作负载实现审计追踪管理，包括 AI 服务\n\n> 官方原名：Implement audit trail management for regulated workloads, including for AI services.\n\n**这条在问什么。** 考题给你「监管要回放『谁、何时、对什么、做了什么』，AI 服务的对话也要留痕」这类场景，让你设计审计链。\n\n**定义**：审计追踪（audit trail）是带时间序的操作记录链，能还原事件经过。受监管负载要求它完整、防篡改、留存期达标。\n\n**怎么运作**。三段各管一段：\n\n1. 采集：CloudTrail 记 API 调用，应用与数据库日志入 CloudWatch，AI 调用一并覆盖。\n2. 防篡改：日志桶开对象锁（Object Lock），加密并收紧删除权限。\n3. 留存：留存期对齐法规要求，到期转低成本归档层。\n\nAI 服务的审计有自己的形态：Bedrock 的模型调用日志记输入与输出，只看 API 事件还原不了对话内容。\n\n**什么时候用，什么时候别用**。受监管负载必配「不可篡改链」。普通业务用默认 CloudTrail 即可。留存期别无脑拉长——存储成本随年限线性涨，按法规最低要求加缓冲定。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的交易系统按监管要留五年审计链。组织跟踪写进开了对象锁的专桶，Bedrock 助手的调用与响应也归档进去。监管抽查时按时间轴回放。\n\n**最小配置示意**（教学示意；桶名与日志账户按自己的环境替换）：\n\n```\n# 组织级多区域审计跟踪（集中到日志账户专用桶）\naws cloudtrail create-trail \\\n  --name org-audit-trail \\\n  --s3-bucket-name <审计日志桶> \\\n  --is-multi-region-trail \\\n  --is-organization-trail\n```\n\n**关联服务**：AWS CloudTrail、Amazon S3 Object Lock、Amazon CloudWatch Logs、Amazon Bedrock（模型调用日志）。\n\n#### 设计数据驻留控制\n\n> 官方原名：Design data residency controls such as AWS Region-specific deployments and transfer restrictions.\n\n**这条在问什么。** 考题给你「数据物理上只能留在指定区域，副本也算数」这类场景，让你设计驻留控制。\n\n**定义**：数据驻留（data residency）是数据存储的物理位置约束。与主权（法律管辖）呼应但更偏物理层，用区域专属部署与传输限制实现。\n\n**怎么运作**。三类控制各管一段：\n\n1. 部署控制：服务只开指定区域，组织层策略拒绝区域外动作。\n2. 传输限制：复制、备份、日志投递路径都在区域内闭环。\n3. 例外管理：确需跨境的传输单列审批通道，其余默认全禁。\n\n**什么时候用，什么时候别用**。有驻留法规的数据（金融、健康）上三类控制。全球服务的延迟优化与驻留冲突时要逐项评估——缓存副本也算「数据在场」，边缘节点要过审。没有法规要求时按性能优先选区域即可。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的健康数据限定单区域驻留。组织策略锁死区域，备份与日志都在本区桶。页面加速用 CDN 但对健康记录关闭缓存，副本不落地境外。\n\n**关联服务**：AWS Organizations（区域策略）、Amazon S3 桶策略、区域专属部署。\n\n#### 实现合规证据收集与报告方案\n\n> 官方原名：Implement compliance evidence collection and reporting solutions (for example, by using AWS Artifact).\n\n**这条在问什么。** 考题给你「审计要交证据不收口头保证」这类场景，让你把证据收集系统化。\n\n**定义**：AWS Artifact 是官方合规报告库，提供第三方审计报告（SOC、PCI、ISO 类）的查阅与下载。\n\n**怎么运作**。三路证据各管一段：\n\n1. 平台侧：Artifact 下载云平台本身的合规报告。\n2. 我方侧：Config 合规快照、CloudTrail 摘要，证明自己的配置达标。\n3. 汇总层：两路证据合并成审计包，Security Hub 出态势趋势页。\n\n**什么时候用，什么时候别用**。应对金融与行业审计，用「Artifact 平台报告 + Config 我方证据」的标准组合。小规模内审控制台导出就够。证据收集要定时自动化——审计进场时再翻日志，来不及。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的银行客户年审要 ISO 与 SOC 报告。审计包自动拼装：Artifact 报告按月下载归档，Config 合规快照定期落桶，缺失项人工补录页签。年审材料两周备齐。\n\n**关联服务**：AWS Artifact、AWS Config、AWS Security Hub。\n\n#### 为云架构实施风险评估方案，如威胁建模和缓解策略\n\n> 官方原名：Implement risk assessment solutions for cloud architectures such as threat modeling and mitigation strategies.\n\n**这条在问什么。** 考题给你一个新架构让你做威胁建模——识别入口、找威胁、定缓解、评剩余风险。\n\n**定义**：威胁建模（threat modeling）是系统化找出「谁能怎么伤到系统」的方法。产出是威胁清单与缓解措施的对照表。\n\n**怎么运作**。四步循环：\n\n1. 画资产与数据流：入口、存储、密钥、信任边界先画清楚。\n2. 找威胁：对每个组件问「谁能破坏机密性、完整性、可用性」。\n3. 定缓解：每条威胁配控制措施，缓解不了的记剩余风险。\n4. 复评：架构变更后重跑，威胁表滚动更新。\n\n**什么时候用，什么时候别用**。新系统上线、重大变更、涉敏感数据时必做。周期性复评用轻量版，只对变更部分。别把它做成一次性文档——过期的威胁表比没有更危险。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 上线新的对外 API。建模发现「令牌校验绕过」与「日志泄露个人信息」两条高危；前者在网关加严格校验，后者给日志加脱敏管道，剩余风险登记为监控观察并配告警。\n\n**关联服务**：威胁建模四步法、AWS WAF、数据边界控制（任务 2.1）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「数据保护等于加密」 | 加密只是一支柱，访问控制与审计日志同样缺一不可 |\n| 2 | 「主权与驻留是一回事」 | 主权讲法律管辖，驻留讲物理位置；主权通常要求驻留，反之不必然 |\n| 3 | 「日志集中存储就防篡改」 | 集中不等于防删；对象锁与删除权隔离才立得住 |\n| 4 | 「AI 审计看 API 日志就够」 | 对话内容靠模型调用日志，API 事件还原不了输入输出 |\n| 5 | 「Artifact 报告等于我方合规」 | Artifact 证平台侧；我方配置证据要另出，合并才完整 |\n| 6 | 「威胁建模做完一次就结束」 | 架构变更要复评，威胁表是活文档不是归档件 |\n\n#### 记忆要点\n\n1. **三支柱**：加密、访问控制、审计日志，缺一不可。\n2. **主权三边界**：存储、处理、密钥全在境内。\n3. **驻留三控制**：部署锁区、传输限域、例外审批。\n4. **审计链条**：采集全覆盖、对象锁防删、留存对法规。\n5. **证据两路**：平台报告走 Artifact，我方证据走 Config 快照。\n6. **建模四步**：画数据流、找威胁、配缓解、变更复评。\n\n---"},{"h":"设计安全和负责任的 AI 控制","body":"#### 这一节学什么\n这一节对应考纲任务 2.5「设计安全和负责任的 AI 控制」。\n\n> 官方原名：Design security and responsible AI controls.\n\n这一任务给生成式 AI 应用补上「安全与责任」这一层。三个技能点从内容护栏讲到智能体身份，再到人工审批。主线是：内容护栏 → 智能体身份 → 人工监督。\n\n#### 为生成式 AI 服务实施内容过滤和合规控制\n\n> 官方原名：Implement content filtering and compliance controls for generative AI services (for example, by using Amazon Bedrock Guardrails).\n\n**这条在问什么。** 考题给你「面向客户的 AI 助手不能胡说、不能泄露个人信息、不能碰违禁话题」这类场景，让你配护栏。\n\n**定义**：Amazon Bedrock Guardrails（护栏）是 Bedrock 的策略层，套在模型调用外面按规则过滤与改写内容——模型换谁，护栏都生效。\n\n**怎么运作**。五类控制各管一段：\n\n1. 内容过滤：对仇恨、侮辱、色情、暴力、不当行为等类别按强度分级拦截。\n2. 拒绝话题：自定义禁聊话题，用户绕着问也拦。\n3. 词过滤：自定义词表拦截，粗口与竞品名都能管。\n4. 敏感信息：个人身份信息识别后屏蔽或掩码。\n5. 接地检查：答案必须能在来源资料里找到依据，编造就拦。\n\n**什么时候用，什么时候别用**。面向公众的生成式应用必配：内容过滤打底，话题与词过滤按业务红线加，敏感信息看数据形态定掩码或阻断。内部低风险工具（如代码助手）可轻配——护栏太紧会把有用输出也拦掉，误杀率是代价。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的客服助手上线。护栏配了侮辱类高强度过滤、理赔话术话题拒绝、证件号自动掩码、答案接地检查。模型换了三代，护栏一层没动。\n\n**最小配置示意**（教学示意；类别与强度按自己的风险清单调）：\n\n```\naws bedrock create-guardrail \\\n  --name \"assistant-guardrail\" \\\n  --content-policy-config '{\n    \"filtersConfig\": [\n      { \"type\": \"HATE\", \"inputStrength\": \"HIGH\", \"outputStrength\": \"HIGH\" }\n    ]\n  }' \\\n  --blocked-input-messaging \"该话题不在服务范围\" \\\n  --blocked-outputs-messaging \"该回复已被策略拦截\"\n```\n\n**关联服务**：Amazon Bedrock Guardrails、Amazon Bedrock（被护栏包裹的模型调用）。\n\n#### 为生成式和智能体 AI 应用实施访问控制\n\n> 官方原名：Implement access controls for generative and agentic AI applications (for example, by using Amazon Bedrock AgentCore Identity).\n\n**这条在问什么。** 考题给你「智能体要代表用户去调外部工具，凭什么身份调、权限怎么给」这类场景，让你设计智能体的访问控制。\n\n**定义**：智能体（agent）是能自主调工具完成任务的程序。它访问外部系统时的身份与人的身份不同——AgentCore Identity 给智能体发可验证身份与短期凭证，让外部资源认得出是谁在调。\n\n**怎么运作**。三层各管一段：\n\n1. 身份层：智能体有独立身份主体，与用户身份分开记，操作可归因。\n2. 凭证层：按会话发短期凭证，工具侧不落长期密钥。\n3. 授权层：智能体能用什么工具、代表谁去用，权限单列成矩阵，不继承用户全部权限。\n\n**什么时候用，什么时候别用**。智能体会调外部敏感系统（客户数据、支付、内部接口）时，身份与凭证必须成体系——出了事要能回答「这个智能体代表谁做了什么」。只读的轻量智能体可以简化起步。别让智能体直接继承用户全部权限，最小化的「代表权」是止血关键。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的销售助手要代客户查库存与改收货地址。智能体走独立身份，工具网关按「代表客户 X」校验会话凭证——客户未授权的动作（改支付方式）网关直接拒。\n\n**关联服务**：Amazon Bedrock AgentCore Identity、Amazon Bedrock AgentCore、最小权限设计（任务 2.1 的原则复用）。\n\n#### 设计人工监督工作流，包含 AI 操作的审批机制\n\n> 官方原名：Design human oversight workflows that include approval mechanisms for AI operations (for example, by using AWS Step Functions).\n\n**这条在问什么。** 考题给你「AI 的输出不能直接生效，人工确认后才执行」这类监管或风控要求，让你设计审批流。\n\n**定义**：人工监督（human oversight）是在 AI 动作与生效之间插入人工审批节点。Step Functions 的回调模式能把工作流挂起等审批，批完续跑。\n\n**怎么运作**。三段式：\n\n1. 挂起待批：工作流发出任务令牌（Task Token）并挂起，等待期间不占执行。\n2. 审批处理：令牌连同待审内容推给审批人，批准或拒绝。\n3. 结果回传：令牌回填成功或失败，工作流续走或进拒绝分支。\n\n**什么时候用，什么时候别用**。高风险动作（退款、对外发信、改数据）必须人工把关，监管也常点名要求。低风险高频动作（推荐文案微调）人工介入会拖死吞吐，用抽检或事后审计替代。审批要配超时默认路径——自动拒绝或升级，别让流程永远挂着。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的理赔 AI 自动预审。低于阈值直接批，高于阈值转人工：工作流把令牌推给理赔员，批准后自动放款，拒绝则转复核单。超时一小时未处理自动升级主管。\n\n**最小配置示意**（教学示意；状态机 JSON 节选审批步）：\n\n```\n\"NeedApproval\": {\n  \"Type\": \"Task\",\n  \"Resource\": \"arn:aws:states:::sqs:sendMessage.waitForTaskToken\",\n  \"Parameters\": {\n    \"MessageBody\": {\n      \"taskToken.$\": \"$$.Task.Token\",\n      \"claim.$\": \"$.claim\"\n    }\n  },\n  \"TimeoutSeconds\": 3600,\n  \"Next\": \"Disburse\",\n  \"Catch\": [{ \"ErrorEquals\": [\"States.Timeout\"], \"Next\": \"Escalate\" }]\n}\n```\n\n**关联服务**：AWS Step Functions（回调模式）、Amazon SQS（审批消息传递）、审批人界面。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「护栏调到最严最安全」 | 强度全顶格会误杀正常输出，按业务风险分级配置 |\n| 2 | 「护栏跟着模型一起配」 | 护栏是独立策略层，模型可换，护栏不动 |\n| 3 | 「智能体借用用户身份调工具最简单」 | 智能体要有独立身份才可归因可撤销，继承用户全权是事故源 |\n| 4 | 「AI 都要人工审批才稳」 | 按风险分层：高风险审批、低风险抽检，全审批拖死吞吐 |\n| 5 | 「审批等待会一直占着算力」 | 回调模式挂起等回传，不占执行 |\n| 6 | 「审批人不批流程就卡死」 | 超时要有默认路径：自动拒绝或升级，别挂死 |\n\n#### 记忆要点\n\n1. **护栏五控**：内容、话题、词、敏感信息、接地。\n2. **护栏独立**：套在调用外，换模型不动护栏。\n3. **智能体身份**：独立主体、短期凭证、最小代表权。\n4. **回调挂起**：任务令牌出去，人批了才续。\n5. **风险分层**：高险审批、低险抽检、超时默认拒。\n6. **闭环归因**：谁授权、代表谁、做了什么，三问可答。\n\n---"}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 2.1.1 | SAML/OIDC/SCIM 分工与 IAM Identity Center | ⭐⭐⭐ | 情景单选 |\n| 2.1.2 | 用户池 vs 身份池、Pod Identity | ⭐⭐⭐ | 情景单选/多选 |\n| 2.1.3 | 最小权限六件套与混淆代理人 | ⭐⭐⭐ | 情景多选 |\n| 2.1.4 | 数据边界三道门的服务对应 | ⭐⭐ | 情景单选/多选 |\n| 2.1.5 | Roles Anywhere 与工作负载身份 | ⭐⭐ | 情景单选 |\n| 2.2.1 | 客户管理密钥与自动轮换 | ⭐⭐⭐ | 情景单选 |\n| 2.2.2 | ACM 三路证书与传输加密 | ⭐⭐ | 情景单选 |\n| 2.2.3 | CloudHSM 的合规触发条件 | ⭐⭐ | 情景单选 |\n| 2.2.4 | 后量子混合模式与迁移节奏 | ⭐⭐ | 单选/多选 |\n| 2.3.1 | Organizations/Control Tower/Account Factory 分层 | ⭐⭐⭐ | 情景单选/多选 |\n| 2.3.2 | 组织跟踪与 AI 调用留痕 | ⭐⭐⭐ | 情景单选 |\n| 2.3.3 | RAM 共享边界 | ⭐⭐ | 情景单选 |\n| 2.3.4 | SCP 与 RCP 的方向分工 | ⭐⭐⭐ | 情景单选/多选 |\n| 2.3.5 | Config 规则与 Security Hub 联动 | ⭐⭐ | 情景单选 |\n| 2.3.6 | Inspector 与 Patch Manager 流水线 | ⭐⭐ | 情景单选 |\n| 2.4.1 | 数据保护三支柱 | ⭐⭐⭐ | 情景多选 |\n| 2.4.2 | 数据主权三边界 | ⭐⭐ | 情景单选 |\n| 2.4.3 | 审计链防篡改与 AI 留痕 | ⭐⭐ | 情景单选 |\n| 2.4.4 | 驻留三控制与缓存副本 | ⭐⭐ | 情景单选 |\n| 2.4.5 | Artifact 平台报告与我方证据 | ⭐⭐ | 单选 |\n| 2.4.6 | 威胁建模四步循环 | ⭐⭐ | 单选/排序 |\n| 2.5.1 | Guardrails 五类控制 | ⭐⭐⭐ | 情景单选/多选 |\n| 2.5.2 | 智能体身份与最小代表权 | ⭐⭐ | 情景单选 |\n| 2.5.3 | 回调模式与人工审批 | ⭐⭐ | 情景单选 |","services":"| 服务 | 主要用途 | 涉及知识点 |\n|---|---|---|\n| AWS IAM Identity Center / SAML 2.0 / OIDC / SCIM | 联合登录与账号同步 | 2.1.1 |\n| Amazon Cognito（用户池/身份池）/ EKS Pod Identity | 应用认证与容器身份 | 2.1.2 |\n| AWS IAM（权限边界/外部 ID/ABAC）/ AWS STS | 最小权限六件套 | 2.1.3 |\n| AWS IAM Access Analyzer / VPC 终端节点策略 / AWS Verified Access | 数据边界三道门 | 2.1.4 |\n| AWS IAM Roles Anywhere / AWS Private CA | AWS 外负载身份 | 2.1.5 |\n| AWS KMS / Amazon S3 服务端加密 | 静态加密与轮换 | 2.2.1 |\n| AWS Certificate Manager / AWS Private CA / TLS 1.3 | 传输加密与证书 | 2.2.2 |\n| AWS CloudHSM | 单租户三级硬件 | 2.2.3 |\n| AWS KMS（ML-DSA/ML-KEM） | 后量子密钥 | 2.2.4 |\n| AWS Organizations / AWS Control Tower / Account Factory | 组织结构与自动开号 | 2.3.1 |\n| AWS CloudTrail（组织跟踪）/ AWS Config / Amazon Security Lake / GuardDuty / Security Hub | 集中日志与态势 | 2.3.2、2.4.3 |\n| AWS Resource Access Manager / AWS Transit Gateway | 跨账户共享 | 2.3.3 |\n| SCP / RCP | 组织层双向策略 | 2.3.4 |\n| Amazon Inspector / AWS Systems Manager Patch Manager | 漏扫与补丁 | 2.3.6 |\n| Amazon S3 Object Lock | 审计防篡改 | 2.4.3 |\n| AWS Artifact | 合规报告 | 2.4.5 |\n| Amazon Bedrock Guardrails | AI 内容护栏 | 2.5.1 |\n| Amazon Bedrock AgentCore Identity | 智能体身份 | 2.5.2 |\n| AWS Step Functions（回调模式）/ Amazon SQS | 人工审批工作流 | 2.5.3 |","furtherReading":"| 页面 | 什么时候去看 | URL |\n|---|---|---|\n| SAP-C03 Exam Guide · Domain 2 | 本域技能点原文与权重 | https://docs.aws.amazon.com/aws-certification/latest/solutions-architect-professional-03/solutions-architect-professional-03-domain2.html |\n| AWS KMS 开发者指南 | 密钥类型与自动轮换机制 | https://docs.aws.amazon.com/kms/latest/developerguide/ |\n| AWS Organizations 文档 | SCP/RCP 与组织结构 | https://docs.aws.amazon.com/organizations/latest/userguide/ |\n| Amazon Bedrock Guardrails 文档 | 五类护栏控制官方口径 | https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html |\n| AWS Step Functions 开发者指南 | 回调模式（waitForTaskToken） | https://docs.aws.amazon.com/step-functions/latest/dg/ |\n\n这些页面都是 AWS 官方公开文档。中文资料与英文原文说法不一致时，以英文原文为准。"}},{"domain":3,"name":"成本优化型架构设计","weight":"15%","practice":[{"id":"D3-001","d":3,"t":"multiple","q":"某服务的负载分为三部分：常年稳定的基线、季节性高峰、可中断的批处理。架构师要优化采购成本，哪些选择合理（选所有适用项）","o":[{"l":"A","t":"常年稳定部分用 Savings Plans 或 Reserved Instances 换取承诺折扣"},{"l":"B","t":"可中断的批处理用 Spot Instances 大幅降价"},{"l":"C","t":"所有负载一律用按量付费实例，保持最大灵活"},{"l":"D","t":"预置容量只适合无法预测的场景，稳定负载不该使用"},{"l":"E","t":"季节性高峰用按需或短期容量补足，不为短暂峰值买长期承诺"}],"a":["A","B","E"],"e":"✅ 正确项：A、B、E。稳定基线用承诺型折扣、可中断批处理用 Spot、季节性峰值用按需补足，是按使用模式匹配购买选项的正确思路。关联考点：域 3.1.1「根据使用模式选择购买选项」。\n\n❌ C：全部按需会放弃承诺折扣，稳定负载的成本明显偏高。\n❌ D：预置容量适用于可预测的持续容量需求，稳定负载恰是其适用场景，这一项把话说反了。\n\n📌 关键概念：采购优化的关键是让购买方式与负载特征匹配，稳定用承诺、波动用按需、可中断用 Spot。","s":"自编·3.1.1"},{"id":"D3-002","d":3,"t":"single","q":"日志数据写入 S3 后前 30 天常被查询，之后几乎不再访问但必须保留 7 年以备审计。哪种存储策略最省成本又满足要求","o":[{"l":"A","t":"全部存 S3 Standard 并长期保留，简单但成本高"},{"l":"B","t":"30 天后直接删除对象，需要时再重新生成"},{"l":"C","t":"全部存 Glacier 即时读取类别以便随时快速读取"},{"l":"D","t":"用 S3 Intelligent-Tiering 配合生命周期，30 天后转入 Glacier 类别"}],"a":["D"],"e":"✅ 正确项：D。Intelligent-Tiering 会在访问频率变化时自动调档，配合生命周期在 30 天后转入 Glacier 归档类别，既降成本又保留 7 年满足审计。关联考点：域 3.4.1「实施智能存储分层与生命周期策略」。\n\n❌ A：全量标准存储长期保留成本最高，完全没有利用访问模式的差异。\n❌ B：审计要求保留 7 年，直接删除违反合规，且数据事后无法重建。\n❌ C：全用 Glacier 即时读取类别的费用高于分层方案，冷数据无需一直保持可即时读取。\n\n📌 关键概念：存储成本优化就是让数据随时间与访问频率自动落到合适档位，分层加生命周期是关键手段。","s":"自编·3.4.1"},{"id":"D3-003","d":3,"t":"single","q":"Contoso 的报表流水线要降本：批处理容器集群负载已验证兼容 ARM；每晚跑的小时级流程实际每步只需几十秒；凌晨零流量的接口还养着常驻容器。架构换装怎么配","o":[{"l":"A","t":"三处负
