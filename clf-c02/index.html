":["D"],"e":"**✅ 为什么 D. AWS CloudTrail 对**：CloudTrail 记录 API 调用与用户活动历史，审查 API 层面的用户活动正是其核心用途。CloudTrail 记录 API 调用与用户活动历史，包括谁在何时调用了什么 API，是审查用户活动、提升安全姿态的审计基础。安全团队可据此发现异常调用模式（如非常用区域的 Root 操作），并联动告警及时响应。\n\n**❌ 为什么其他选项错**：\n- A. AWS WAF：Web 流量过滤\n- B. Amazon Detective：安全事件调查（分析已发生事件）\n- C. Amazon CloudWatch：指标与日志监控\n\n**📌 关键概念**：API 调用审计 → CloudTrail；安全事件溯源调查 → Detective；监控告警 → CloudWatch。典型错因：Detective 要先有数据才能调查（其数据源常含 CloudTrail），题目问「审查用户活动」时基础层先选 CloudTrail。","s":"源#244"},{"id":"D2-249","d":2,"t":"single","q":"根据 AWS 共享责任模型，哪个选项是 AWS 和客户之间的共享控制？","o":[{"l":"A","t":"配置管理"},{"l":"B","t":"物理和环境控制"},{"l":"C","t":"数据完整性认证"},{"l":"D","t":"身份和访问管理"}],"a":["D"],"e":"**✅ 为什么 D. 身份和访问管理 对**：身份与访问管理是共享控制——AWS 负责 IAM 服务自身安全，客户负责管理自己的用户、组、角色与策略。共享控制（shared controls）典型：身份与访问管理（AWS 管服务、客户管用法）、补丁管理、配置管理。物理环境完全归 AWS。\n\n**❌ 为什么其他选项错**：\n- A. 配置管理：双方各有职责但表述笼统，非标准共享控制分类\n- B. 物理和环境控制：完全由 AWS 负责\n- C. 数据完整性认证：属客户侧数据责任\n\n**📌 关键概念**：共享控制典型 = IAM/补丁管理/配置管理；「云内部」物理环境 = AWS 独有责任。IAM 属共享控制；物理/环境控制 = AWS 独占。","s":"源#249"},{"id":"D2-273","d":2,"t":"multiple","q":"AWS Trusted Advisor 的以下哪些好处？（选择两个）","o":[{"l":"A","t":"访问 Amazon Simple Queue Service（Amazon SQS）"},{"l":"B","t":"成本优化建议"},{"l":"C","t":"服务限制检查每小时更新"},{"l":"D","t":"安全检查"},{"l":"E","t":"AWS Identity and Access Management（IAM）审批管理"}],"a":["B","D"],"e":"**✅ 为什么 B、D 对**：\n- B. 成本优化建议：Trusted Advisor 成本检查帮您找出未用资源与省钱机会\n- D. 安全检查：TA 五类检查之一，识别安全配置风险\n\n**❌ 为什么其他选项错**：\n- A. 访问 SQS：TA 不提供任何队列服务访问\n- C. 服务限制检查每小时更新：TA 确有服务限额（Service Limits）检查类别，但刷新频率是 Business+ 每周自动、Basic/Developer 手动刷新，「每小时更新」与事实不符\n- E. IAM 审批管理：IAM 的职责，非 TA 功能\n\n**📌 关键概念**：TA 五类 = 成本优化、性能、安全、容错、服务限制；服务限额检查属 Basic/Developer 免费可用的核心检查，其刷新周期为 Business+ 每周自动、更低档位需手动刷新——「每小时」是本题唯一错误点。","s":"源#273"},{"id":"D2-277","d":2,"t":"single","q":"以下哪项是 AWS 良好构建框架在 AWS 云中实现运营卓越的设计原则？","o":[{"l":"A","t":"数分钟内实现全球化。"},{"l":"B","t":"频繁进行小的、可逆的更改。"},{"l":"C","t":"实施强大的身份和访问管理基础。"},{"l":"D","t":"停止在数据中心运营硬件基础设施上的支出。"}],"a":["B"],"e":"**✅ 为什么 B. 频繁进行小的、可逆的更改 对**：运营卓越支柱的设计原则之一，小步快跑、可回滚的变更降低风险并支持持续改进。\n\n**❌ 为什么其他选项错**：\n- A. 数分钟内实现全球化：属可靠性/全球基础设施优势，非运营卓越原则\n- C. 实施强大的身份和访问管理基础：属安全支柱原则\n- D. 停止在数据中心硬件上的支出：属成本优化支柱原则\n\n**📌 关键概念**：运营卓越 = 小而可逆的变更、从失败中学习、运营即代码；安全支柱才有 IAM 基础原则。","s":"源#277"},{"id":"D2-279","d":2,"t":"single","q":"开发人员希望 AWS 用户使用临时安全凭据访问 AWS 服务。开发人员应该使用哪个AWS 服务或功能来提供这些凭据？","o":[{"l":"A","t":"IAM 策略"},{"l":"B","t":"IAM 用户组"},{"l":"C","t":"AWS 安全令牌服务（AWS STS）"},{"l":"D","t":"AWS IAM 身份中心（AWS 单点登录）"}],"a":["C"],"e":"**✅ 为什么 C. AWS 安全令牌服务（AWS STS）对**：STS 专门签发临时安全凭据（限时、自动过期），正符合「开发人员为用户提供临时凭据」。AWS STS 签发临时安全凭据（可配置有效期），配合 IAM 角色使用，过期自动失效，是比长期访问密钥更安全的最佳实践。\n\n**❌ 为什么其他选项错**：\n- A. IAM 策略：定义权限的文档，不签发凭据\n- B. IAM 用户组：权限分组管理，无临时凭据\n- D. AWS IAM 身份中心：面向人的 SSO，非程序化临时凭据服务\n\n**📌 关键概念**：临时凭据签发 → STS（配合角色使用）；SSO 门户 → IAM Identity Center。临时凭据 → STS+角色；长期密钥 → IAM 用户（不推荐）。","s":"源#279"},{"id":"D2-280","d":2,"t":"single","q":"一家全球性公司想要使用一个托管的安全服务来防护 SQL 注入攻击。该服务还必须提供有关访问公司电子商务应用程序的详细日志信息。哪个 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS 网络防火墙"},{"l":"B","t":"适用于 SQL Server 的 Amazon RDS"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"AWS WAF"}],"a":["D"],"e":"**✅ 为什么 D. AWS WAF 对**：WAF 防护 SQL 注入等 Web 攻击，并可选开启详细 Web 访问日志，满足「防护+详细日志」双需求。AWS WAF 部署在 CloudFront/API Gateway/ALB 上，用托管规则防护 SQL 注入/XSS，可开启详细 Web 访问日志投递 S3/CloudWatch/Kinesis。托管规则组由 AWS 维护更新，无需自写正则；日志可对接 Athena 做访问行为分析。\n\n**❌ 为什么其他选项错**：\n- A. AWS 网络防火墙：网络层防火墙（VPC 边界），不管应用层 SQL 注入\n- B. 适用于 SQL Server 的 RDS：只是数据库产品，不是防护服务\n- C. Amazon GuardDuty：威胁检测，不拦截攻击流量\n\n**📌 关键概念**：SQL 注入/XSS 防护 + 访问日志 → WAF；网络层 VPC 边界 → Network Firewall。易混对照：WAF 挂在 CloudFront/ALB/API Gateway 上管应用层七层攻击；Network Firewall 守 VPC 边界管三四层流量，SQL 注入属七层必选 WAF。","s":"源#280"},{"id":"D2-282","d":2,"t":"multiple","q":"以下哪项是客户根据 AWS 共享责任模型的责任？（选择两个）","o":[{"l":"A","t":"维护基础设施设备的配置。"},{"l":"B","t":"在硬件基础设施内进行补丁和更新。"},{"l":"C","t":"维护客户操作系统和应用程序的配置。"},{"l":"D","t":"管理涉及加密选项的决策。"},{"l":"E","t":"维护基础设施硬件。"}],"a":["C","D"],"e":"**✅ 为什么 C、D 对**：\n- C. 维护客户操作系统和应用程序的配置：EC2 客户 OS 与应用配置归客户\n- D. 管理涉及加密选项的决策：客户决定是否加密、用什么密钥\n\n**❌ 为什么其他选项错**：\n- A. 维护基础设施设备的配置：AWS 责任\n- B. 在硬件基础设施内补丁与更新：AWS 责任\n- E. 维护基础设施硬件：AWS 责任\n\n**📌 关键概念**：EC2 场景客户侧 = 客户 OS 补丁/配置、应用、加密选项、安全组；AWS 侧 = 硬件、虚拟化、物理设施。易错点：C「维护客户操作系统和应用程序的配置」与 D「加密选项决策」最易被误判为 AWS 责任，实际客户 OS 与应用由客户维护。口诀：客户管到 OS 为止，AWS 管到硬件为止。","s":"源#282"},{"id":"D2-283","d":2,"t":"single","q":"一家公司想要验证是否为所有 AWS 账户中的用户启用了多因素认证（MFA）。哪家AWS 服务或资源将满足此要求？","o":[{"l":"A","t":"AWS 成本和使用情况报告"},{"l":"B","t":"IAM 凭据报告"},{"l":"C","t":"AWS Artifact"},{"l":"D","t":"Amazon CloudFront 报告"}],"a":["B"],"e":"**✅ 为什么 B. IAM 凭据报告 对**：IAM 凭据报告列出了账户内所有用户凭据与 MFA 使用状态，可下载验证全部账户是否启用 MFA。IAM 凭据报告覆盖账户全部用户，含密码/MFA/访问密钥状态（生成时间、是否启用、上次使用），CSV 下载即可核对 MFA 全员覆盖。\n\n**❌ 为什么其他选项错**：\n- A. AWS 成本和使用情况报告：费用数据，无 MFA 信息\n- C. AWS Artifact：AWS 合规报告，非账户用户清单\n- D. Amazon CloudFront 报告：CDN 分析报告\n\n**📌 关键概念**：验证用户 MFA/密码/密钥状态 → IAM 凭据报告（账户级、可 CSV 下载）。全员 MFA 验证 → 凭据报告；合规报告 → Artifact。","s":"源#283"},{"id":"D2-284","d":2,"t":"single","q":"一家公司使用 AWS 安全服务和工具。公司需要一项服务来帮助管理安全警报，并将警报组织到一个单一的仪表板中。公司应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"Amazon Macie"},{"l":"D","t":"AWS Security Hub"}],"a":["D"],"e":"**✅ 为什么 D. AWS Security Hub 对**：Security Hub 聚合多源安全发现到统一仪表板，统一管理安全告警与合规状态。Security Hub 聚合 GuardDuty/Inspector/Macie/Config 等安全发现到统一仪表板，支持 CIS AWS 基准自动检查与跨账户汇总。通过安全标准（CIS AWS 基准等）自动评分，帮助管理层直观掌握整体安全态势与薄弱点。\n\n**❌ 为什么其他选项错**：\n- A. Amazon GuardDuty：产生威胁发现（检测者），不是聚合者\n- B. Amazon Inspector：漏洞扫描发现来源\n- C. Amazon Macie：敏感数据发现来源\n\n**📌 关键概念**：安全发现「聚合」 → Security Hub；「产生」发现的 = GuardDuty/Inspector/Macie/Config 等。典型错因：题干问「统一仪表板/集中管理告警」时选聚合者 Security Hub，别选只产生单一类型发现的检测服务。","s":"源#284"},{"id":"D2-286","d":2,"t":"single","q":"一家公司使用 Amazon S3 存储可能包含个人身份信息（PII）的记录。公司想要一个解决方案，可以监控所有 S3 存储桶中的 PII，并在发现漏洞时立即向员工发出警报。哪个 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"Amazon Detective"},{"l":"C","t":"Amazon Macie"},{"l":"D","t":"AWS Shield"}],"a":["C"],"e":"**✅ 为什么 C. Amazon Macie 对**：Macie 持续监控 S3 敏感数据（PII），发现敏感数据暴露风险可告警，正符合「监控 PII+立即告警」。Macie 持续扫描 S3 敏感数据（PII），发现风险通过 EventBridge 通知员工，实现「监控+立即告警」闭环。Macie 发现结果含敏感类别、对象位置与严重度，可按存储桶配置扫描范围与频率。告警可分级推送给不同责任人，形成从发现到处置的完整闭环流程。\n\n**❌ 为什么其他选项错**：\n- A. Amazon GuardDuty：API 层威胁检测\n- B. Amazon Detective：安全事件调查\n- D. AWS Shield：DDoS 防护\n\n**📌 关键概念**：S3 中的 PII 发现与告警 → Macie；调查已发生事件 → Detective。题干「S3+PII+告警」三要素齐现即锁 Macie；若问「事后回溯攻击路径」则是 Detective 的活，方向一反就错。","s":"源#286"},{"id":"D2-287","d":2,"t":"single","q":"哪个 AWS 服务允许用户按需下载有关 AWS 基础设施的安全和合规性报告？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"AWS Security Hub"},{"l":"C","t":"AWS Artifact"},{"l":"D","t":"AWS Shield"}],"a":["C"],"e":"**✅ 为什么 C. AWS Artifact 对**：Artifact 按需提供 AWS 安全与合规性报告（SOC/ISO/PCI 等），正符合「按需下载合规报告」。Artifact 按需下载 AWS 安全与合规报告（SOC/ISO/PCI 等）与已签署协议，无需提交工单。除下载报告外，还可在线签署商业协议（如 BAA、NDA），覆盖金融与医疗行业常见合规需求。\n\n**❌ 为什么其他选项错**：\n- A. Amazon GuardDuty：威胁检测\n- B. AWS Security Hub：安全告警聚合\n- D. AWS Shield：DDoS 防护\n\n**📌 关键概念**：下载 AWS 合规报告 → Artifact；自己的安全状态聚合 → Security Hub。「按需下载」+「合规报告」组合关键词是 Artifact 识别特征；Artifact 管第三方审计视角，Security Hub 管自家配置风险。","s":"源#287"},{"id":"D2-288","d":2,"t":"single","q":"外部审计师已请求一家公司提供其所有 IAM 用户列表，包括用户凭据和访问密钥的状态。提供此信息的最简单方法是什么？","o":[{"l":"A","t":"为审计师创建一个 IAM 用户账户，授予审计师管理员权限。"},{"l":"B","t":"截取 AWS 管理控制台中每个用户的页面的屏幕截图，然后将截图提供给审计师。"},{"l":"C","t":"下载 IAM 凭据报告，然后将报告提供给审计师。"},{"l":"D","t":"下载 AWS Trusted Advisor 报告，然后将报告提供给审计师。"}],"a":["C"],"e":"**✅ 为什么 C. 下载 IAM 凭据报告 对**：IAM 凭据报告一次性列全员用户与凭据/密钥状态，下载交给审计师是最简方式。IAM 凭据报告一键导出账户内所有用户的凭据与密钥状态，交审计师前无需逐用户操作，是「最简单」答案。\n\n**❌ 为什么其他选项错**：\n- A. 给审计师建管理员 IAM 用户：过度授权，违反最小权限\n- B. 逐页截图：无法覆盖全部用户且不可靠\n- D. Trusted Advisor 报告：最佳实践检查，无用户清单\n\n**📌 关键概念**：向审计提供 IAM 用户与凭据状态 → 凭据报告（CSV）；「最简单」关键词锁定报告下载。审计要用户清单 → 凭据报告 CSV。","s":"源#288"},{"id":"D2-289","d":2,"t":"single","q":"公司可以通过使用 AWS 云中的安全组执行哪些任务？","o":[{"l":"A","t":"仅通过特定端口允许访问 Amazon EC2 实例。"},{"l":"B","t":"在子网级别拒绝恶意 IP 地址的访问。"},{"l":"C","t":"保护 Amazon CloudFront 缓存的数据。"},{"l":"D","t":"对 Amazon EC2 实例应用无状态防火墙。"}],"a":["A"],"e":"**✅ 为什么 A. 仅通过特定端口允许访问 Amazon EC2 实例 对**：安全组规则按端口/协议控制 EC2 出入站访问，精确放行特定端口。安全组规则按协议+端口精确放行 EC2 访问（如只开 443），有状态、无拒绝规则；拒绝恶意 IP 需用 NACL。\n\n**❌ 为什么其他选项错**：\n- B. 子网级拒绝恶意 IP：NACL 的能力（安全组无拒绝规则）\n- C. 保护 CloudFront 缓存数据：CDN 缓存不归安全组管\n- D. 应用无状态防火墙：安全组是有状态的\n\n**📌 关键概念**：安全组 = 实例级、有状态、只允许规则；NACL = 子网级、无状态、有拒绝规则。安全组无拒绝规则——拒绝场景 → NACL。","s":"源#289"},{"id":"D2-296","d":2,"t":"single","q":"一家公司有一个管理 IAM 策略，该策略没有授予用户完成所需任务所需的权限。如何解决问题？","o":[{"l":"A","t":"启用 AWS Shield 高级版。"},{"l":"B","t":"创建自定义 IAM 策略。"},{"l":"C","t":"从 AWS Marketplace 使用第三方 Web 应用程序防火墙（WAF）管理规则。"},{"l":"D","t":"使用 AWS 密钥管理服务（AWS KMS）创建客户管理的密钥。"}],"a":["B"],"e":"**✅ 为什么 B. 创建自定义 IAM 策略 对**：托管策略权限不足时，可创建自定义策略精确匹配任务所需权限。自定义 IAM 策略可精确匹配任务所需权限，弥补托管策略粒度不足；遵循最小权限原则逐条定义允许操作。\n\n**❌ 为什么其他选项错**：\n- A. 启用 Shield 高级版：DDoS 防护，与 IAM 权限无关\n- C. Marketplace 第三方 WAF 规则：Web 防护，不解决 IAM 权限\n- D. KMS 创建客户密钥：密钥管理，与权限不足无关\n\n**📌 关键概念**：权限不足 → 自定义策略或角色调整；三个干扰项都属安全服务而非 IAM 权限工具。权限不足 → 自定义策略；Shield/WAF/KMS 均与 IAM 权限无关。","s":"源#296"},{"id":"D2-297","d":2,"t":"single","q":"根据 AWS 共享责任模型，谁负责管理 IAM 用户访问和密钥？","o":[{"l":"A","t":"IAM 访问和密钥是静态的，因此无需旋转它们。"},{"l":"B","t":"客户负责旋转密钥。"},{"l":"C","t":"AWS 将在需要时旋转密钥。"},{"l":"D","t":"AWS 支持团队将在客户请求时旋转密钥。"}],"a":["B"],"e":"**✅ 为什么 B. 客户负责旋转密钥 对**：共享责任模型中 IAM 用户访问密钥归客户管理，包括定期轮换，AWS 不会代为轮换。客户需自行创建与保管密钥、设定轮换周期，并在人员变动时及时停用对应密钥。\n\n**❌ 为什么其他选项错**：\n- A. 密钥静态无需旋转：错误，长期密钥必须轮换\n- C. AWS 将在需要时旋转密钥：AWS 不代管客户密钥生命周期\n- D. AWS 支持团队代为旋转：支持团队不执行此操作\n\n**📌 关键概念**：IAM 密钥轮换 = 客户责任；长期密钥存在泄露风险，最佳实践是改用角色+临时凭据。密钥轮换 = 客户责任；更佳实践 = 角色临时凭据替代长期密钥。","s":"源#297"},{"id":"D2-298","d":2,"t":"single","q":"一家公司需要在 Amazon EC2 实例上运行预安装的第三方防火墙。哪个 AWS 服务或功能可以提供此解决方案？","o":[{"l":"A","t":"网络 ACLs"},{"l":"B","t":"安全组"},{"l":"C","t":"AWS Marketplace"},{"l":"D","t":"AWS Trusted Advisor"}],"a":["C"],"e":"**✅ 为什么 C. AWS Marketplace 对**：Marketplace 提供预配置第三方软件（含防火墙产品），可直接部署到 EC2 实例上运行。AWS Marketplace 汇聚第三方安全厂商产品（如 Fortinet/Palo Alto 防火墙 AMI），订阅后可直接在 EC2 上部署运行。产品按需付费，可先订阅试用再规模化，也支持私有报价与整合交付。\n\n**❌ 为什么其他选项错**：\n- A. 网络 ACL：AWS 原生子网防火墙，非第三方产品\n- B. 安全组：AWS 原生实例防火墙，非第三方\n- D. AWS Trusted Advisor：建议服务，不提供软件\n\n**📌 关键概念**：预装第三方软件 → Marketplace（AMI/产品订阅）；原生防火墙 = 安全组/NACL。预装第三方软件 → Marketplace；原生防火墙 → SG/NACL。","s":"源#298"},{"id":"D2-300","d":2,"t":"single","q":"根据 AWS 共享责任模型，以下哪项完全由 AWS 负责？","o":[{"l":"A","t":"安全意识和培训"},{"l":"B","t":"开发 IAM 密码策略"},{"l":"C","t":"修补客户操作系统"},{"l":"D","t":"物理和环境控制"}],"a":["D"],"e":"**✅ 为什么 D. 物理和环境控制 对**：物理硬件、设施与机房环境安全完全由 AWS 负责，不涉及客户侧操作。「云本身的安全」= AWS 独占：物理设施、硬件、网络、虚拟化层与托管服务底座；安全意识培训、IAM 策略、客户 OS 补丁均为客户责任。\n\n**❌ 为什么其他选项错**：\n- A. 安全意识和培训：客户责任（培养自己员工）\n- B. 开发 IAM 密码策略：客户配置 IAM 策略\n- C. 修补客户操作系统：客户责任\n\n**📌 关键概念**：「云本身的安全」= AWS 独占（物理/硬件/虚拟化/托管服务底座）；「云中的安全」= 客户（数据、OS、IAM）。问 AWS 独占责任 → 找物理/基础设施关键词。","s":"源#300"},{"id":"D2-301","d":2,"t":"single","q":"AWS 账户根用户的特征是什么？","o":[{"l":"A","t":"根用户是唯一可以配置多因素认证（MFA）的用户。"},{"l":"B","t":"根用户是唯一可以访问 AWS 管理控制台的用户。"},{"l":"C","t":"根用户是在创建 AWS 账户时可用的第一种身份。"},{"l":"D","t":"根用户的密码不能更改。"}],"a":["C"],"e":"**✅ 为什么 C. 根用户是在创建 AWS 账户时可用的第一种身份 对**：账户创建时即生成根用户，是账户内首个身份，拥有全部权限。根用户随账户创建而生成，是账户内第一种身份、天然拥有全部权限；日常操作应改用 IAM 用户/角色，根用户启用 MFA 后锁定备用。\n\n**❌ 为什么其他选项错**：\n- A. 唯一可配置 MFA 的用户：任何 IAM 用户都可配置 MFA\n- B. 唯一可访问控制台的用户：所有用户均可登录控制台\n- D. 根用户密码不能更改：密码可以更改\n\n**📌 关键概念**：根用户 = 账户首身份、日常应锁定不用、改用 IAM 用户/角色；MFA 与控制台访问并非根用户独有。根用户 = 首身份+全权限；「唯一」类表述多为陷阱。","s":"源#301"},{"id":"D2-304","d":2,"t":"single","q":"一家公司想要将非结构化数据迁移到 AWS。数据需要安全移动，具有洞察力的加密和端到端数据验证。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS 应用程序迁移服务"},{"l":"B","t":"Amazon Elastic File System（Amazon EFS）"},{"l":"C","t":"AWS DataSync"},{"l":"D","t":"AWS 迁移中心"}],"a":["C"],"e":"**✅ 为什么 C. AWS DataSync 对**：DataSync 在线迁移/同步数据到 AWS，提供传输中加密与端到端数据校验，正符合「安全移动+验证」。DataSync 在线迁移数据（NFS/SMB/HDFS/S3 等）到 AWS，内置传输中加密、TLS 与端到端校验，支持带宽限速与调度。\n\n**❌ 为什么其他选项错**：\n- A. AWS 应用程序迁移服务：迁移整个应用服务器，非数据传输\n- B. Amazon EFS：文件存储服务，本身不执行迁移\n- D. AWS 迁移中心：迁移项目统一跟踪门户，不搬数据\n\n**📌 关键概念**：数据在线迁移+校验 → DataSync；大规模离线 → Snowball 系列；应用整机迁移 → MGN。边界条件：DataSync 适合 NFS/SMB 在线搬迁，但受带宽限制；数据量到 PB 级或网络差，换 Snow 家族离线运。","s":"源#304"},{"id":"D2-306","d":2,"t":"single","q":"一家公司想要快速实施持续集成/持续交付（CI/CD）流水线。哪家 AWS 服务将满足这一要求？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"Amazon Cognito"},{"l":"C","t":"AWS DataSync"},{"l":"D","t":"AWS CodeStar"}],"a":["D"],"e":"**✅ 为什么 D. AWS CodeStar 对**：CodeStar 提供统一界面与项目模板，可快速搭好含 CI/CD 流水线的开发项目，正符合「快速实施」。CodeStar 统一界面快速创建项目（含代码仓库+流水线+部署），模板预配置整条 CI/CD 工具链，几分钟搭好发布流程。项目模板覆盖常见语言与部署目标（EC2/Lambda/ECS），成员权限与看板一并就绪。\n\n**❌ 为什么其他选项错**：\n- A. AWS Config：配置合规审计\n- B. Amazon Cognito：用户身份认证\n- C. AWS DataSync：数据迁移\n\n**📌 关键概念**：快速 CI/CD 工具链 → CodeStar；流水线单件 → CodePipeline。⚠️ 时效标注：CodeStar 已于 2024-07 全量停服（End of Support 2024-07-25），官方推荐替代为 Amazon CodeCatalyst；本题为历史题库题，答案照录源题。","s":"源#306"},{"id":"D2-309","d":2,"t":"single","q":"哪项 AWS 服务或功能允许管理员为多名员工提供桌面环境？","o":[{"l":"A","t":"AWS Organizations"},{"l":"B","t":"AWS Fargate"},{"l":"C","t":"AWS WAF"},{"l":"D","t":"AWS WorkSpaces"}],"a":["D"],"e":"**✅ 为什么 D. AWS WorkSpaces 对**：WorkSpaces 是托管云桌面（DaaS），管理员可为多名员工配置桌面环境。WorkSpaces 是全托管虚拟桌面（DaaS），管理员按用户分配桌面，数据不留本地设备，支持多种设备接入。按月付费用量计费，弹性扩容，客户端支持 Windows/Mac 与浏览器访问。桌面镜像统一管理打补丁，员工设备故障换机即可恢复工作环境。\n\n**❌ 为什么其他选项错**：\n- A. AWS Organizations：多账户管理\n- B. AWS Fargate：容器运行时\n- C. AWS WAF：Web 防火墙\n\n**📌 关键概念**：托管虚拟桌面 → WorkSpaces；容器运行 → Fargate/ECS。题干出现「为多名员工提供桌面」即锁 WorkSpaces；若题目问「无服务器跑容器」则选 Fargate，桌面与容器是两个场景。","s":"源#309"},{"id":"D2-310","d":2,"t":"single","q":"哪项 AWS 服务或功能使用户能够捕获有关 VPC 中网络流量的信息？","o":[{"l":"A","t":"VPC 流日志"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"VPC 路由表"},{"l":"D","t":"AWS CloudTrail"}],"a":["A"],"e":"**✅ 为什么 A. VPC 流日志 对**：VPC Flow Logs 捕获进出 VPC 网络接口的 IP 流量信息（源/目的、端口、字节数等）。VPC Flow Logs 记录网络接口级 IP 流量元数据（可投递 CloudWatch/S3），用于安全分析、故障排查与流量审计。日志可按需创建（全部/自定义/接受），适合安全取证与合规留痕场景。\n\n**❌ 为什么其他选项错**：\n- B. Amazon Inspector：漏洞扫描\n- C. VPC 路由表：定义路由路径，不记录流量\n- D. AWS CloudTrail：API 调用日志，非网络流量\n\n**📌 关键概念**：网络流量捕获 → VPC Flow Logs；API 审计 → CloudTrail。题干出现「捕获 VPC 网络流量」即锁 Flow Logs；CloudTrail 记录的是控制面 API 调用而非数据面网络包，问流量就别选它。","s":"源#310"},{"id":"D2-319","d":2,"t":"single","q":"哪个 AWS 功能为 AWS 用户提供了一个无成本的平台，用于加入社区团体，提问，找到答案，并阅读社区生成的关于最佳实践的文章？","o":[{"l":"A","t":"AWS 知识中心"},{"l":"B","t":"AWS re:Post"},{"l":"C","t":"AWS IQ"},{"l":"D","t":"AWS 企业支持"}],"a":["B"],"e":"**✅ 为什么 B. AWS re:Post 对**：re:Post 是免费的社区问答平台，可加入社区、提问、找答案并阅读最佳实践文章。AWS re:Post 是免费社区知识平台，可加入标签社区、提问回答、阅读实践文章； Knowledge Center 是官方 KB，AWS IQ 是付费专家市场。社区内容按标签组织，既有官方布道者也有认证用户参与，沉淀了大量实战经验帖。\n\n**❌ 为什么其他选项错**：\n- A. AWS 知识中心：官方常见问题知识库，非社区互动平台\n- C. AWS IQ：付费聘请 AWS 认证专家的服务\n- D. AWS 企业支持：付费官方支持计划\n\n**📌 关键概念**：免费社区问答 → re:Post；官方 KB → Knowledge Center；付费找专家 → AWS IQ。易混对照：re:Post 是社区互助（免费），AWS IQ 是认证专家市场（付费）——按「免费社区 vs 付费专家」二分即可定位。","s":"源#319"},{"id":"D2-324","d":2,"t":"single","q":"开发人员可以通过哪种机制从应用程序代码中访问 AWS 服务？","o":[{"l":"A","t":"AWS 软件开发工具包"},{"l":"B","t":"AWS 管理控制台"},{"l":"C","t":"AWS CodePipeline"},{"l":"D","t":"AWS Config"}],"a":["A"],"e":"**✅ 为什么 A. AWS 软件开发工具包 对**：SDK 提供多语言编程库，让开发者在应用程序代码中调用 AWS 服务 API。SDK 提供多语言 API 库（Java/Python/JS 等），让代码直接调用 AWS 服务；CLI 面向命令行，控制台面向网页操作。各语言 SDK 与 CLI 共享同一套 API 与凭证链，本地开发与自动化脚本可无缝切换。\n\n**❌ 为什么其他选项错**：\n- B. AWS 管理控制台：网页界面人工操作，非代码调用\n- C. AWS CodePipeline：CI/CD 流水线\n- D. AWS Config：配置审计\n\n**📌 关键概念**：代码中访问 AWS → SDK；命令行 → CLI；网页 → 控制台；三者是访问 AWS 的三大通道。代码→SDK、命令行→CLI、网页→控制台。","s":"源#324"},{"id":"D2-325","d":2,"t":"single","q":"一家公司正在迁移到 AWS 云。公司想要了解和识别潜在的安全配置错误或意外行为。公司想要优先考虑它可能需要的任何保护控制。哪个 AWS 云采用框架（AWS CAF）安全视角能力将满足这些要求？","o":[{"l":"A","t":"身份和访问管理"},{"l":"B","t":"威胁检测"},{"l":"C","t":"平台工程"},{"l":"D","t":"可用性和连续性管理"}],"a":["B"],"e":"**✅ 为什么 B. 威胁检测 对**：AWS CAF 安全视角的威胁检测能力帮助组织了解和识别潜在的安全配置错误、威胁或意外行为，并据此优先规划所需的保护控制，与题干「识别意外行为并优先考虑保护控制」完全对应。\n\n**❌ 为什么其他选项错**：\n- A. 身份和访问管理：属于安全视角，但聚焦身份凭证与权限治理，不涉及意外行为识别\n- C. 平台工程：属于平台视角，关注云平台架构与工程化，不是安全视角能力\n- D. 可用性和连续性管理：关注业务连续性与可用性保障，与威胁识别无关\n\n**📌 关键概念**：识别安全配置错误/意外行为并规划防护 → CAF 安全视角·威胁检测；身份凭证治理 → 身份和访问管理能力（同属安全视角）。","s":"源#325"},{"id":"D2-334","d":2,"t":"single","q":"根据 AWS 共享责任模型，以下哪项是 AWS 的责任？","o":[{"l":"A","t":"应用数据安全"},{"l":"B","t":"在 Amazon EC2 实例上运行的应用程序的补丁管理"},{"l":"C","t":"管理服务的底层基础设施的补丁管理"},{"l":"D","t":"应用身份和访问管理"}],"a":["C"],"e":"**✅ 为什么 C. 管理服务的底层基础设施的补丁管理 对**：共享责任模型中 AWS 负责「云的安全性」，即托管服务底层基础设施（服务器、网络、虚拟化层等）的补丁由 AWS 打，客户无需参与。\n\n**❌ 为什么其他选项错**：\n- A. 应用数据安全：属于客户责任「云中的安全性」\n- B. EC2 实例上运行的应用程序补丁：客户操作系统与以上软件均由客户负责\n- D. 应用身份和访问管理：客户应用层 IAM 归客户管理\n\n**📌 关键概念**：判断口诀——托管服务底层设施→AWS；客户操作系统/应用/数据→客户；EC2 属 IaaS，其上 OS 与应用补丁全归客户。","s":"源#334"},{"id":"D2-336","d":2,"t":"single","q":"一家公司想要生成 IAM 用户的列表。公司还想要查看与用户相关联的各种凭据的状态，如密码、访问密钥和多因素认证（MFA）设备。哪个 AWS 服务或功能将满足这些要求？","o":[{"l":"A","t":"IAM 凭据报告"},{"l":"B","t":"AWS IAM 身份中心（AWS 单点登录）"},{"l":"C","t":"AWS 身份和访问管理访问分析器"},{"l":"D","t":"AWS 成本和使用情况报告"}],"a":["A"],"e":"**✅ 为什么 A. IAM 凭据报告 对**：凭据报告可生成账户内全部 IAM 用户列表，并展示密码、访问密钥、MFA 设备等凭据的使用与轮换状态，逐项对应题干要求。\n\n**❌ 为什么其他选项错**：\n- B. AWS IAM 身份中心：集中管理 SSO 登录，不输出用户级凭据状态报告\n- C. 访问分析器：识别跨账户共享的 IAM 资源风险，非凭据状态清单\n- D. 成本和使用情况报告：财务数据，与凭据无关\n\n**📌 关键概念**：审计 IAM 用户密码/访问密钥/MFA 状态 → IAM 凭据报告（可下载 CSV，最长 4 小时刷新一次）；跨账户资源暴露 → IAM Access Analyzer。","s":"源#336"},{"id":"D2-339","d":2,"t":"single","q":"一家公司想要使用单一凭据集允许用户对多个 AWS 账户进行身份验证和授权。哪个AWS 服务或资源将满足这个要求？","o":[{"l":"A","t":"AWS 组织"},{"l":"B","t":"IAM 用户"},{"l":"C","t":"AWS IAM 身份中心（AWS 单点登录）"},{"l":"D","t":"AWS 控制塔"}],"a":["C"],"e":"**✅ 为什么 C. AWS IAM 身份中心（AWS 单点登录） 对**：IAM Identity Center 支持用单一凭据集对多个 AWS 账户和云应用做集中身份验证与授权，正是「一套凭据访问多账户」的场景。\n\n**❌ 为什么其他选项错**：\n- A. AWS 组织：多账户整合与策略管理，本身不提供登录凭据\n- B. IAM 用户：单个账户内身份，跨账户访问需切换角色，非单一凭据\n- D. AWS 控制塔：多账户治理着陆区方案，本身不提供统一登录入口\n\n**📌 关键概念**：一套凭据跨多 AWS 账户 SSO → IAM Identity Center；账户组织与策略 → Organizations；治理基线 → Control Tower；三者分工：身份中心管「登录」、组织管「账户结构」、控制塔管「合规基线」，考试常互为干扰项。","s":"源#339"},{"id":"D2-343","d":2,"t":"single","q":"一家公司正在从本地迁移其应用程序到 AWS 云。公司想要确保应用程序只分配执行所有操作所需的最低权限。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS 身份和访问管理（IAM）"},{"l":"B","t":"Amazon CloudWatch"},{"l":"C","t":"Amazon Macie"},{"l":"D","t":"Amazon GuardDuty"}],"a":["A"],"e":"**✅ 为什么 A. AWS 身份和访问管理（IAM） 对**：IAM 通过策略实现最小权限原则，可精确控制应用程序和用户仅获得执行操作所必需的最低权限。\n\n**❌ 为什么其他选项错**：\n- B. Amazon CloudWatch：监控指标与日志，不管权限\n- C. Amazon Macie：发现和保护 S3 敏感数据，属于数据安全服务\n- D. Amazon GuardDuty：智能威胁检测服务，持续分析账户与工作负载的恶意活动\n\n**📌 关键概念**：最低权限分配 → IAM 策略（least privilege），这是权限治理唯一正确选项；监控 → CloudWatch、敏感数据保护 → Macie、威胁检测 → GuardDuty 分别服务不同目标，与权限分配互不替代，注意审清题干问「权限」还是问「安全检测」。","s":"源#343"},{"id":"D2-344","d":2,"t":"multiple","q":"哪些选项是 AWS 云采用框架（AWS CAF）治理视角能力？（选择两个）","o":[{"l":"A","t":"身份和访问管理"},{"l":"B","t":"云财务管理"},{"l":"C","t":"应用程序组合管理"},{"l":"D","t":"创新管理"},{"l":"E","t":"产品管理"}],"a":["B","C"],"e":"**✅ 为什么 B、C 对**：\n- B. 云财务管理：治理视角核心能力，覆盖预算/账单/成本优化治理\n- C. 应用程序组合管理：治理视角核心能力，管理应用组合与优先级\n\n**❌ 为什么其他选项错**：\n- A. 身份和访问管理：属于安全视角，治理身份凭证与权限\n- D. 创新管理：不属于 CAF 治理视角能力\n- E. 产品管理：不属于 CAF 治理视角能力\n\n**📌 关键概念**：治理视角核心能力=云财务管理+应用程序组合管理+云转型+风险管理+数据治理；「身份和访问管理」属于安全视角，勿被「管理」后缀带偏；做 CAF 题先记准六大常用视角（治理/安全/平台/运营/人员/财务）各自代表能力再判断。","s":"源#344"},{"id":"D2-345","d":2,"t":"single","q":"哪家 AWS 服务提供单一位置以跟踪应用程序迁移的进展？","o":[{"l":"A","t":"AWS 应用程序发现服务"},{"l":"B","t":"AWS 应用程序迁移服务"},{"l":"C","t":"AWS 服务目录"},{"l":"D","t":"AWS 迁移中心"}],"a":["D"],"e":"**✅ 为什么 D. AWS 迁移中心 对**：AWS Migration Hub 提供单一位置跟踪各应用程序迁移进展，支持从本地到 AWS 的迁移状态可视化，与题干「单一位置跟踪迁移进展」一致。\n\n**❌ 为什么其他选项错**：\n- A. 应用程序发现服务：采集本地服务器清单与依赖数据，供迁移评估用\n- B. 应用程序迁移服务：执行 lift-and-shift 复制迁移动作，不提供组合级跟踪视图\n- C. 服务目录：IT 服务目录治理，与迁移跟踪无关\n\n**📌 关键概念**：迁移「计划+跟踪」看板 → Migration Hub；「发现」本地资产 → ADS；「执行」复制切换 → MGN，三服务分工递进。","s":"源#345"},{"id":"D2-346","d":2,"t":"multiple","q":"一家公司使用最新的 Amazon Linux 2 Amazon Machine Image（AMI）启动了 Amazon EC2 实例。系统管理员可以采取哪些操作连接到 EC2 实例？（选择两个）","o":[{"l":"A","t":"使用 Amazon EC2 实例连接。"},{"l":"B","t":"使用远程桌面协议（RDP）连接。"},{"l":"C","t":"使用 AWS 批处理。"},{"l":"D","t":"使用 AWS 系统管理会话管理器。"},{"l":"E","t":"使用 Amazon Connect。"}],"a":["A","D"],"e":"**✅ 为什么 A、D 对**：\n- A. 使用 Amazon EC2 实例连接：浏览器/CLI 一键 SSH，AWS 原生安全登录方式\n- D. 使用 AWS 系统管理会话管理器：SSM Session Manager，免开 22 端口且全程审计\n\n**❌ 为什么其他选项错**：\n- B. RDP：Windows 远程桌面协议，Linux 实例不适用\n- C. AWS 批处理：批量计算任务服务，不是实例连接工具\n- E. Amazon Connect：云联络中心服务，与实例登录无关，注意与 EC2 Instance Connect 名字相似但完全不同\n\n**📌 关键概念**：Linux EC2 连接四选一=SSH 密钥/EC2 Instance Connect/Session Manager/EC2 串行控制台；RDP 仅用于 Windows 实例；Session Manager 的加分点是不开 22 端口、免密钥且操作全程留审计记录，安全类题目优先选它。","s":"源#346"},{"id":"D2-348","d":2,"t":"single","q":"哪个任务需要用户以 AWS 账户根用户身份登录？","o":[{"l":"A","t":"删除 IAM 用户"},{"l":"B","t":"删除 AWS 账户"},{"l":"C","t":"在 AWS 组织中创建组织"},{"l":"D","t":"删除 Amazon EC2 实例"}],"a":["B"],"e":"**✅ 为什么 B. 删除 AWS 账户 对**：删除 AWS 账户是不可委托给 IAM 用户的根级操作，必须以根用户身份登录执行。\n\n**❌ 为什么其他选项错**：\n- A. 删除 IAM 用户：具备 IAM 权限的普通用户即可操作\n- C. 在 AWS 组织中创建组织：可由具备组织管理权限的用户完成，无需根用户\n- D. 删除 Amazon EC2 实例：常规资源操作，授权即可\n\n**📌 关键概念**：必须根用户操作的事项=关闭/删除 AWS 账户、修改根邮箱/电话、恢复被删的 SQS 队列及某些账户级设置变更；日常资源操作一律走 IAM 用户/角色。","s":"源#348"},{"id":"D2-352","d":2,"t":"single","q":"哪家 AWS 服务或组件允许从互联网进入 VPC 的入站流量？","o":[{"l":"A","t":"互联网网关"},{"l":"B","t":"NAT 网关"},{"l":"C","t":"AWS WAF"},{"l":"D","t":"VPC 对等"}],"a":["A"],"e":"**✅ 为什么 A. 互联网网关 对**：Internet Gateway 是 VPC 与互联网之间的水平扩展冗余组件，允许互联网入站流量进入 VPC，是公网访问的必经组件。\n\n**❌ 为什么其他选项错**：\n- B. NAT 网关：仅让私有子网「主动出访」互联网，不接受入站发起的连接\n- C. AWS WAF：Web 应用防火墙，过滤的是请求内容而非网络出入口\n- D. VPC 对等：连接两个 VPC 的私有通道，不提供互联网接入\n\n**📌 关键概念**：公网双向通信 → IGW（必须显式挂载到 VPC 才生效）；私有子网单向出访 → NAT 网关（隐藏内网、只出不进）；VPC 互连 → VPC 对等连接；WAF 管 L7 请求过滤。「入站」二字是本题题眼，NAT 网关不支持外部主动入站。","s":"源#352"},{"id":"D2-354","d":2,"t":"single","q":"哪个准则是构建云应用程序的良好构建设计原则？","o":[{"l":"A","t":"将静态数据保持在计算资源附近。"},{"l":"B","t":"为峰值容量预置资源。"},{"l":"C","t":"设计以实现从故障中自动恢复。"},{"l":"D","t":"使用紧密耦合的组件。"}],"a":["C"],"e":"**✅ 为什么 C. 设计以实现从故障中自动恢复 对**：从故障中自动恢复是 Well-Architected 可靠性支柱的核心设计原则，通过健康检查与自动替换保证组件故障后应用仍可用。\n\n**❌ 为什么其他选项错**：\n- A. 静态数据靠近计算资源：与可用性设计原则无关，性能考量也不充分\n- B. 为峰值容量预置资源：违背云弹性按需原则，应按需伸缩\n- D. 紧密耦合组件：放大单点故障影响，良好设计反而要求松散耦合\n\n**📌 关键概念**：可靠性支柱口诀=测试恢复流程、从故障自动恢复、水平扩展、停止猜测容量；「紧耦合」永远是坏设计信号词。","s":"源#354"},{"id":"D2-367","d":2,"t":"single","q":"一家公司想要将自然语言处理（NLP）集成到商业智能（BI）仪表板中。公司想要提出问题并收到带有相关可视化的答案。哪个 AWS 服务或工具将满足这些要求？","o":[{"l":"A","t":"Amazon Macie"},{"l":"B","t":"Amazon Rekognition"},{"l":"C","t":"Amazon QuickSight Q"},{"l":"D","t":"Amazon Lex"}],"a":["C"],"e":"**✅ 为什么 C. Amazon QuickSight Q 对**：QuickSight Q（现称 Q in QuickSight）将机器学习/NLP 集成进 BI 仪表板，用户用自然语言提问即可获得带可视化的答案。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Macie：S3 敏感数据发现与保护服务，面向数据分类而非 BI 分析\n- B. Amazon Rekognition：图像/视频识别分析，不处理商业数据问答\n- D. Amazon Lex：构建对话机器人/聊天界面的服务，输出是会话而非 BI 图表\n\n**📌 关键概念**：自然语言问数+自动出图表 → Q in QuickSight（BI 场景专属）；图像视频识别 → Rekognition；搭建聊天机器人 → Lex。区分记忆点：题干出现「仪表板/BI/可视化」选 QuickSight Q，出现「机器人/客服对话」选 Lex。","s":"源#367"},{"id":"D2-373","d":2,"t":"single","q":"哪个 AWS 服务使公司更容易监视和排除应用程序日志和云资源的故障？","o":[{"l":"A","t":"Amazon EC2"},{"l":"B","t":"AWS 身份和访问管理（IAM）"},{"l":"C","t":"Amazon CloudWatch"},{"l":"D","t":"AWS CloudTrail"}],"a":["C"],"e":"**✅ 为什么 C. Amazon CloudWatch 对**：CloudWatch 收集指标、日志和事件，集中监控应用程序与云资源运行状况并可设置告警，是「监视+排除故障」的统一平台。\n\n**❌ 为什么其他选项错**：\n- A. Amazon EC2：计算服务本身，不是监控工具\n- B. IAM：权限管理，不涉及运维监控\n- D. AWS CloudTrail：记录账号内 API 调用历史供审计，不做资源指标监控与告警\n\n**📌 关键概念**：指标/日志/告警/面板 → CloudWatch（可跨服务统一看资源健康）；「谁在什么时候对什么资源干了什么」→ CloudTrail 审计日志；两者常成对出现在干扰项，判断锚点是「看运行状态」还是「查操作记录」。","s":"源#373"},{"id":"D2-384","d":2,"t":"single","q":"根据 AWS 共享责任模型，以下哪项是 AWS 的责任？","o":[{"l":"A","t":"应用数据安全"},{"l":"B","t":"在 Amazon EC2 实例上运行的应用程序的补丁管理"},{"l":"C","t":"管理服务的底层基础设施的补丁管理"},{"l":"D","t":"应用身份和访问管理"}],"a":["C"],"e":"**✅ 为什么 C. 管理服务的底层基础设施的补丁管理 对**：AWS 负责「云的安全性」，即托管服务底层基础设施（服务器、网络、虚拟化层等）的补丁由 AWS 打，客户无需参与。\n\n**❌ 为什么其他选项错**：\n- A. 应用数据安全：属于客户责任「云中的安全性」\n- B. EC2 实例上运行的应用程序补丁：客户操作系统与以上软件均由客户负责\n- D. 应用身份和访问管理：客户应用层 IAM 归客户管理\n\n**📌 关键概念**：判断口诀——托管服务底层设施→AWS；客户操作系统/应用/数据→客户；EC2 属 IaaS，其上 OS 与应用补丁全归客户。","s":"源#384"},{"id":"D2-385","d":2,"t":"single","q":"哪个 AWS 服务或资源可以识别并报告一个 AWS 账户中的 IAM 资源与另一个AWS 账户共享的情况？","o":[{"l":"A","t":"IAM 凭据报告"},{"l":"B","t":"AWS IAM 身份中心（AWS 单点登录）"},{"l":"C","t":"AWS 身份和访问管理访问分析器"},{"l":"D","t":"Amazon Cognito 用户池"}],"a":["C"],"e":"**✅ 为什么 C. AWS 身份和访问管理访问分析器 对**：IAM Access Analyzer 持续分析跨账户访问的 IAM 资源（策略、角色、S3 桶等），识别并报告资源被共享到外部账户的情况，与题干场景一致。\n\n**❌ 为什么其他选项错**：\n- A. IAM 凭据报告：列出用户密码/密钥/MFA 状态，不检测资源外享\n- B. AWS IAM 身份中心：SSO 集中登录管理\n- D. Amazon Cognito 用户池：面向应用终端用户的注册登录，不管理 AWS 账户间资源分享\n\n**📌 关键概念**：跨账户 IAM 资源共享风险识别 → IAM Access Analyzer（自动分析策略并标记对外暴露的资源，含信任区域概念）；终端用户认证 → Cognito；账户级 SSO → IAM Identity Center；「共享/暴露/外部账户」是 Access Analyzer 的题眼词。","s":"源#385"},{"id":"D2-391","d":2,"t":"single","q":"一家公司想要管理劳动力用户的登录安全性。公司需要创建劳动力用户，并集中管理他们在公司所有AWS 账户和应用程序中的访问权限。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS AWS Audit Manager"},{"l":"B","t":"Amazon Cognito"},{"l":"C","t":"AWS 安全中心"},{"l":"D","t":"AWS IAM 身份中心（AWS 单点登录）"}],"a":["D"],"e":"**✅ 为什么 D. AWS IAM 身份中心（AWS 单点登录） 对**：IAM Identity Center 专门用于创建和管理劳动力用户（workforce identity），集中控制他们对企业所有 AWS 账户和应用程序的访问权限，与题干逐字对应。\n\n**❌ 为什么其他选项错**：\n- A. AWS Audit Manager：合规审计自动化，不管理用户登录\n- B. Amazon Cognito：面向应用终端客户的注册登录，非劳动力用户\n- C. AWS 安全中心：本题机翻名，指 AWS Security Hub，聚合安全告警，与身份管理无关\n\n**📌 关键概念**：劳动力用户集中管理 → IAM Identity Center；外部终端用户（App 注册/社交登录）→ Cognito；身份对象不同是两者根本分界，机翻名「安全中心」=Security Hub（聚合安全检查结果）。","s":"源#391"},{"id":"D2-392","d":2,"t":"single","q":"一家公司想要一份报告，列出公司 AWS 账户中所有用户使用的多因素认证（MFA）设备的状态。哪个 AWS 功能或服务将满足这个要求？","o":[{"l":"A","t":"AWS 成本和使用情况报告"},{"l":"B","t":"IAM 凭据报告"},{"l":"C","t":"详细计费报告"},{"l":"D","t":"AWS 成本探索器报告"}],"a":["B"],"e":"**✅ 为什么 B. IAM 凭据报告 对**：凭据报告列出账户内所有 IAM 用户及其密码、访问密钥、MFA 设备的使用状态，可逐人核对 MFA 是否启用，满足「报告 MFA 设备状态」的要求。\n\n**❌ 为什么其他选项错**：\n- A. AWS 成本和使用情况报告：费用数据，与 MFA 无关\n- C. 详细计费报告：旧版计费报表，不含身份信息\n- D. AWS 成本探索器报告：成本趋势分析工具，不涉及凭据状态\n\n**📌 关键概念**：查 MFA/密码/访问密钥状态 → IAM 凭据报告（账户级 CSV 报告）；查成本 → CUR/成本探索器；两类报告常互为干扰项，判断锚点是「身份凭据」还是「费用」。","s":"源#392"},{"id":"D2-394","d":2,"t":"single","q":"一家公司正在 AWS 云中推出移动应用程序。公司希望应用程序的用户可以通过社交媒体身份提供者（IdP）进行登录。哪家 AWS 服务将满足这个要求？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"Amazon Cognito"},{"l":"C","t":"AWS Secrets Manager"},{"l":"D","t":"Amazon CloudFront"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Cognito 对**：Cognito 用户池原生支持通过社交媒体身份提供者（Facebook、Google、Amazon 等）登录，为移动应用提供注册、登录与会话管理，正是题干场景。\n\n**❌ 为什么其他选项错**：\n- A. AWS Lambda：无服务器计算，不做用户身份\n- C. AWS Secrets Manager：保管应用密钥凭据，不面向终端用户登录\n- D. Amazon CloudFront：内容分发网络，与身份认证无关\n\n**📌 关键概念**：终端用户社交登录/注册 → Cognito（用户池支持社交 IdP 与 SAML/OIDC 联合身份）；「社交媒体 IdP 登录」是 Cognito 用户池的标志性题眼，与面向企业员工的 IAM Identity Center 相区分。","s":"源#394"},{"id":"D2-396","d":2,"t":"single","q":"使用 AWS 成本探索器演示了哪个云概念？","o":[{"l":"A","t":"正确尺寸"},{"l":"B","t":"可靠性"},{"l":"C","t":"弹性"},{"l":"D","t":"现代化"}],"a":["A"],"e":"**✅ 为什么 A. 正确尺寸 对**：成本探索器通过分析资源使用量与成本趋势，帮助用户发现过度配置的资源并调整为合适规格，这正是 right-sizing（正确尺寸）优化技术的体现。\n\n**❌ 为什么其他选项错**：\n- B. 可靠性：架构能力属性，非成本优化手段\n- C. 弹性：按需伸缩应对负载变化，成本探索器不执行伸缩\n- D. 现代化：应用架构升级（如上云改造），与成本分析工具无直接对应\n\n**📌 关键概念**：成本探索器+成本和使用报告 → 成本可视化与正确尺寸决策依据；降本三板斧=正确尺寸/预留实例(RI/Savings Plans)/弹性伸缩；勿把「弹性」误当成本分析能力。","s":"源#396"},{"id":"D2-398","d":2,"t":"single","q":"哪个 AWS 服务或工具使用户能够以编程方式连接 AWS 并部署资源？","o":[{"l":"A","t":"Amazon QuickSight"},{"l":"B","t":"AWS PrivateLink"},{"l":"C","t":"AWS Direct Connect"},{"l":"D","t":"AWS SDKs"}],"a":["D"],"e":"**✅ 为什么 D. AWS SDKs 对**：SDK 提供各主流编程语言的 API 封装库，让开发者以编程方式调用 AWS 服务并创建/部署资源，正对应「程序化连接与部署」。\n\n**❌ 为什么其他选项错**：\n- A. Amazon QuickSight：BI 可视化分析服务，面向业务报表而非开发工具\n- B. AWS PrivateLink：私有网络连接服务，面向流量而非编程接口\n- C. AWS Direct Connect：专线接入网络服务，不提供 API 编程能力\n\n**📌 关键概念**：编程访问 AWS 的四条路=SDK（语言库）/CLI（命令行）/API（原始 REST）/CloudFormation（模板声明式部署）；PrivateLink 与 Direct Connect 属网络接入层，是「连网」不是「编程」，注意区分连接的层级。","s":"源#398"},{"id":"D2-405","d":2,"t":"single","q":"一家公司需要合并多个 AWS 账户的计费。公司需要使用一个账户代表所有其他账户支付。公司应该使用哪个 AWS 服务或工具来满足这个要求？","o":[{"l":"A","t":"AWS 信任顾问"},{"l":"B","t":"AWS 组织"},{"l":"C","t":"AWS 预算"},{"l":"D","t":"AWS 服务目录"}],"a":["B"],"e":"**✅ 为什么 B. AWS 组织 对**：AWS Organizations 支持合并计费（consolidated billing），管理账户可作为付款账户统一支付所有成员账户费用，与题干「一个账户代付」完全一致。\n\n**❌ 为什么其他选项错**：\n- A. AWS 信任顾问：本题机翻名，即 AWS Trusted Advisor，提供优化建议，不整合账单\n- C. AWS 预算：即 AWS Budgets，预算告警工具，不做合并支付\n- D. AWS 服务目录：IT 服务目录治理，与计费无关\n\n**📌 关键概念**：多账户合并计费+统一付款 → Organizations（还可叠加 SCP 策略）；预算超支告警 → Budgets； Trusted Advisor 负责优化建议（安全/成本/性能/容错/服务限额五类检查）。","s":"源#405"},{"id":"D2-408","d":2,"t":"single","q":"用户在哪里可以找到 AWS 云解决方案设计的例子？","o":[{"l":"A","t":"AWS 市场"},{"l":"B","t":"AWS 服务目录"},{"l":"C","t":"AWS 架构中心"},{"l":"D","t":"AWS 信任顾问"}],"a":["C"],"e":"**✅ 为什么 C. AWS 架构中心 对**：AWS Architecture Center（架构中心）按行业与场景提供经过验证的参考架构图和解决方案设计模式，是查找云方案设计范例的官方资源。\n\n**❌ 为什么其他选项错**：\n- A. AWS 市场：第三方软件与服务采购平台，非架构参考库\n- B. AWS 服务目录：企业内 IT 服务目录治理工具\n- D. AWS 信任顾问：AWS Trusted Advisor 的机翻名，输出优化建议而非架构图\n\n**📌 关键概念**：找参考架构/解决方案设计 → Architecture Center（架构中心）；买第三方软件 → Marketplace；找最佳实践指南/白皮书 → AWS Prescriptive Guidance；找合规审计报告 → Artifact。","s":"源#408"},{"id":"D2-409","d":2,"t":"single","q":"一家公司正在使用 Amazon RDS。使用 Amazon RDS 时，公司的哪项任务是责任？","o":[{"l":"A","t":"配置底层基础设施。"},{"l":"B","t":"创建 IAM 策略以控制对服务的管理访问。"},{"l":"C","t":"安装连接计算和存储硬件的电缆。"},{"l":"D","t":"安装和修补 RDS 操作系统。"}],"a":["B"],"e":"**✅ 为什么 B. 创建 IAM 策略以控制对服务的管理访问 对**：RDS 属托管服务，底层设施与数据库引擎补丁由 AWS 负责；但「谁能管理这个 RDS 资源」属客户侧 IAM 治理，创建 IAM 策略控制访问是客户责任。\n\n**❌ 为什么其他选项错**：\n- A. 配置底层基础设施：托管服务的设施归 AWS 管\n- C. 安装连接计算和存储硬件的电缆：物理层完全由 AWS 负责\n- D. 安装和修补 RDS 操作系统：数据库服务器 OS/引擎补丁由 AWS 负责\n\n**📌 关键概念**：RDS 客户责任=数据库内建用户/权限/表结构+备份策略选择+网络安全组配置+IAM 管控；引擎与底层全部 AWS 负责；「IAM 管控」是托管服务题里最常见的客户责任答案。","s":"源#409"},{"id":"D2-412","d":2,"t":"single","q":"一家公司需要检查最近没有旋转的 IAM 访问密钥。公司应该使用哪个 AWS 服务来满足这个要求？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"AWS Shield"},{"l":"C","t":"Amazon Cognito"},{"l":"D","t":"AWS 信任顾问"}],"a":["D"],"e":"**✅ 为什么 D. AWS 信任顾问 对**：Trusted Advisor 的安全检查包含 IAM 访问密钥轮换检查，会标记 90 天以上未轮换的访问密钥，正对应「检查最近未轮换的密钥」。\n\n**❌ 为什么其他选项错**：\n- A. AWS WAF：Web 应用防火墙，过滤 HTTP 请求\n- B. AWS Shield：DDoS 防护，与密钥轮换无关\n- C. Amazon Cognito：终端用户身份认证服务，不检查账户内 IAM 密钥状态\n\n**📌 关键概念**：Trusted Advisor 检查范围=成本优化/性能/安全/容错/服务限额五类，其中安全类含 MFA 启用、根密钥存在性、IAM 密钥轮换（90 天）；查「密钥使用状态明细」→ 凭据报告，查「密钥是否该轮换」→ Trusted Advisor。","s":"源#412"},{"id":"D2-413","d":2,"t":"single","q":"一家公司在 VPC 中运行许多 Amazon EC2 实例。公司想要使用原生 AWS 安全资源来控制特定EC2 实例之间的网络流量。哪个 AWS 服务或功能将满足这个要求？","o":[{"l":"A","t":"网络 ACLs"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"安全组"}],"a":["D"],"e":"**✅ 为什么 D. 安全组 对**：安全组是实例级（ENI 级）虚拟防火墙，可精确控制「特定 EC2 实例间」的出入站流量，与题干「特定实例之间的网络流量」精确对应。\n\n**❌ 为什么其他选项错**：\n- A. 网络 ACLs：子网级无状态防火墙，粒度是整个子网而非特定实例\n- B. AWS WAF：L7 Web 请求过滤，不管理实例间 VPC 内流量\n- C. Amazon GuardDuty：威胁检测，只报警不阻断流量\n\n**📌 关键概念**：安全组=实例级/有状态/默认全拒入站；网络 ACL=子网级/无状态/默认全放行；「特定实例」题眼选安全组，「子网级」题眼选 NACL；GuardDuty 是检测（detect）不是防护（prevent）。","s":"源#413"},{"id":"D2-415","d":2,"t":"single","q":"一家公司正在 AWS 上构建新应用程序。公司需要应用程序在单个应用程序组件失败时保持可用。为了满足这个要求，公司应该使用哪个设计原则？","o":[{"l":"A","t":"可处置资源"},{"l":"B","t":"自动化"},{"l":"C","t":"正确尺寸"},{"l":"D","t":"松散耦合"}],"a":["D"],"e":"**✅ 为什么 D. 松散耦合 对**：松散耦合让组件间通过接口/消息交互，单个组件故障不会级联拖垮整体，应用仍保持可用，正是「单组件失败不影响应用可用」的设计原则。\n\n**❌ 为什么其他选项错**：\n- A. 可处置资源：服务器如牲畜可随时替换，关注点是无状态化与替换，不直接解决故障隔离\n- B. 自动化：减少人工操作，不隔离组件故障\n- C. 正确尺寸：按需选规格，属成本优化\n\n**📌 关键概念**：故障隔离/单点失效不扩散 → 松散耦合（常配 SQS 队列解耦）；快速替换 → 可处置资源；两者常同时出现，题干强调「单组件失败仍可用」优先选松散耦合。","s":"源#415"},{"id":"D2-416","d":2,"t":"single","q":"一家公司想要使用一个托管服务来识别和保护存储在 Amazon S3 中的敏感数据。哪家AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS IAM 访问分析器"},{"l":"B","t":"Amazon GuardDuty"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"Amazon Macie"}],"a":["D"],"e":"**✅ 为什么 D. Amazon Macie 对**：Macie 是全托管数据安全服务，用机器学习和模式匹配自动发现、分类并保护 S3 中的敏感数据（PII、财务、凭证等），与题干逐字对应。\n\n**❌ 为什么其他选项错**：\n- A. AWS IAM 访问分析器：识别跨账户资源暴露风险，不识别数据内容\n- B. Amazon GuardDuty：账户与工作负载威胁检测\n- C. Amazon Inspector：EC2/ECR/Lambda 软件漏洞与网络配置扫描\n\n**📌 关键概念**：S3 敏感数据发现保护 → Macie；软件漏洞扫描 → Inspector；恶意行为检测 → GuardDuty；三者是安全三兄弟高频干扰组，锚点分别是「数据内容/漏洞/行为」。","s":"源#416"},{"id":"D2-417","d":2,"t":"single","q":"哪个 AWS 服务或功能可以让用户在子网级别限制网络访问？","o":[{"l":"A","t":"AWS Shield"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"网络 ACL"},{"l":"D","t":"安全组"}],"a":["C"],"e":"**✅ 为什么 C. 网络 ACL 对**：网络 ACL 在子网级别对进出子网的流量做无状态过滤，是 VPC 的可选第二道防线，与「子网级别限制访问」对应。\n\n**❌ 为什么其他选项错**：\n- A. AWS Shield：DDoS 防护服务，不在子网层做访问控制\n- B. AWS WAF：L7 应用层防火墙，挂 CloudFront/ALB 等\n- D. 安全组：实例/ENI 级防火墙，作用粒度不是子网级\n\n**📌 关键概念**：子网级防火墙 → 网络 ACL（无状态、需同时配出入站规则、按序号评估）；实例级防火墙 → 安全组（有状态、默认拒入站）；记牢两级粒度即可秒答此类题，网络层防护优先安全组、子网层补充 NACL。","s":"源#417"},{"id":"D2-418","d":2,"t":"single","q":"一家公司想要在云端管理加密密钥。可以使用哪个 AWS 服务？","o":[{"l":"A","t":"AWS License Manager"},{"l":"B","t":"AWS 证书管理器（ACM）"},{"l":"C","t":"AWS CloudHSM"},{"l":"D","t":"AWS 目录服务"}],"a":["C"],"e":"**✅ 为什么 C. AWS CloudHSM 对**：CloudHSM 提供云上单租户硬件安全模块（FIPS 140-2 三级验证），可生成、存储和管理加密密钥并满足合规要求的密钥完全控制，正对应「云端管理加密密钥」。\n\n**❌ 为什么其他选项错**：\n- A. AWS License Manager：软件许可证跟踪管理，与密钥无关\n- B. AWS 证书管理器（ACM）：签发管理 TLS/SSL 证书，不是加密密钥\n- D. AWS 目录服务：托管 Active Directory，不做密钥管理\n\n**📌 关键概念**：加密密钥管理三档=KMS（托管共享，默认选择）/CloudHSM（专属硬件，合规高要求）/Secrets Manager（存的是「凭据」不是密钥材料）；证书（TLS）→ ACM，证书不是密钥管理题的答案。","s":"源#418"},{"id":"D2-422","d":2,"t":"single","q":"AWS 云采用框架（AWS CAF）哪个视角侧重于大规模管理身份和权限？","o":[{"l":"A","t":"运营"},{"l":"B","t":"平台"},{"l":"C","t":"治理"},{"l":"D","t":"安全"}],"a":["D"],"e":"**✅ 为什么 D. 安全 对**：AWS CAF 安全视角的使命是「大规模管理身份和权限」，涵盖身份和访问管理、威胁检测、基础设施保护、事件响应等能力，题干原文即安全视角定位。\n\n**❌ 为什么其他选项错**：\n- A. 运营：关注日常运维支持与业务连续性\n- B. 平台：关注云平台架构设计与工程实现\n- C. 治理：关注云财务、风险与组合管理，虽涉及策略但不含身份权限大规模管理\n\n**📌 关键概念**：身份和权限大规模管理 → CAF 安全视角；治理视角管「钱与风险」（云财务管理/风险管理）；两者中文都带「管理」，按「身份权限归属安全」口诀区分。","s":"源#422"},{"id":"D2-423","d":2,"t":"single","q":"哪个 AWS 服务或功能允许用户安全地存储加密的凭据，并在需要时检索这些凭据？","o":[{"l":"A","t":"AWS 加密 SDK"},{"l":"B","t":"AWS 安全中心"},{"l":"C","t":"AWS Secrets Manager"},{"l":"D","t":"AWS Artifact"}],"a":["C"],"e":"**✅ 为什么 C. AWS Secrets Manager 对**：Secrets Manager 专门用于安全存储数据库凭据、API 密钥等机密信息，支持自动轮换与按需检索，与「存加密凭据+需要时取回」逐项对应。\n\n**❌ 为什么其他选项错**：\n- A. AWS 加密 SDK：客户端加密开发库，不提供存储检索服务\n- B. AWS 安全中心：Security Hub 聚合安全检查结果，不存机密\n- D. AWS Artifact：合规报告下载门户，与凭据管理无关\n\n**📌 关键概念**：存取数据库/应用凭据+自动轮换 → Secrets Manager；管理「加密密钥材料」→ KMS/CloudHSM；下载合规审计报告 → Artifact；三题眼分别是「凭据/密钥/审计报告」。","s":"源#423"},{"id":"D2-428","d":2,"t":"multiple","q":"一家公司想要为其员工提供对 Amazon RDS 的访问权限。公司还希望将交互限制为仅使用AWS CLI 和 AWS 软件开发工具包（SDK）。为了满足这些要求并遵循最小权限原则，公司应该采取哪些组合行动？（选择两个）","o":[{"l":"A","t":"创建 IAM 用户并仅提供 AWS 管理控制台访问权限。"},{"l":"B","t":"创建 IAM 用户并仅提供程序访问权限。"},{"l":"C","t":"创建 IAM 角色并仅提供 AWS 管理控制台访问权限。"},{"l":"D","t":"创建具有管理员访问权限的 IAM 策略，并将其附加到 IAM 用户。"},{"l":"E","t":"创建具有 Amazon RDS 访问权限的 IAM 策略，并将其附加到 IAM 用户。"}],"a":["B","E"],"e":"**✅ 为什么 B、E 对**：\n- B. 创建 IAM 用户并仅提供程序访问权限：程序访问型用户才支持 CLI/SDK 调用，满足「仅命令行与 SDK 交互」\n- E. 创建具有 Amazon RDS 访问权限的 IAM 策略并附加：策略仅授权 RDS，落实最小权限\n\n**❌ 为什么其他选项错**：\n- A. 仅控制台访问：与「仅 CLI/SDK」背道而驰\n- C. 仅控制台访问的角色：同样不满足程序访问要求\n- D. 管理员访问权限策略：违反最小权限原则\n\n**📌 关键概念**：IAM 用户创建时可选控制台访问/程序访问（密钥对）两种通道；「仅 CLI/SDK」=只勾程序访问；最小权限落地=按服务粒度写策略（如仅 RDS 读写），绝不给 AdministratorAccess。","s":"源#428"},{"id":"D2-433","d":2,"t":"single","q":"一家公司想要组织其用户，以便公司可以按组授予用户权限。公司可以使用哪个AWS 服务或工具来满足这个要求？","o":[{"l":"A","t":"安全组"},{"l":"B","t":"AWS 身份和访问管理（IAM）"},{"l":"C","t":"资源组"},{"l":"D","t":"AWS 安全中心"}],"a":["B"],"e":"**✅ 为什么 B. AWS 身份和访问管理（IAM） 对**：IAM 支持创建 IAM 组并按组附加策略，将用户加入组即继承组权限，实现「按组授权」的集中管理方式。\n\n**❌ 为什么其他选项错**：\n- A. 安全组：VPC 实例级网络防火墙，与用户权限无关\n- C. 资源组：资源的逻辑编组（便于运维管理），不管人\n- D. AWS 安全中心：Security Hub 安全告警聚合，不管理用户组织\n\n**📌 关键概念**：「组织用户按组授权」→ IAM 组；「组织云资源便于运维」→ Resource Groups（资源组）；两个「组」同词不同义，网络安全语境下的「安全组」更是高频陷阱。","s":"源#433"},{"id":"D2-434","d":2,"t":"multiple","q":"一家公司想要在 AWS Lambda 上使用 Python 代码运行 AWS Lambda。在 AWS 共享责任模型下，哪些任务将是公司的责任？（选择两个）","o":[{"l":"A","t":"管理底层基础设施。"},{"l":"B","t":"管理操作系统。"},{"l":"C","t":"编写业务逻辑代码。"},{"l":"D","t":"安装计算机语言运行时。"},{"l":"E","t":"提供 AWS 身份和访问管理（IAM）对 Lambda 服务的访问权限。"}],"a":["C","E"],"e":"**✅ 为什么 C、E 对**：\n- C. 编写业务逻辑代码：Lambda 是 FaaS，代码完全归客户负责\n- E. 提供 AWS 身份和访问管理（IAM）对 Lambda 服务的访问权限：执行角色/资源策略均由客户配置\n\n**❌ 为什么其他选项错**：\n- A. 管理底层基础设施：Serverless 底层由 AWS 全托管\n- B. 管理操作系统：Lambda 无客户可见 OS，AWS 负责\n- D. 安装计算机语言运行时：Lambda 托管运行时，客户只选版本\n\n**📌 关键概念**：Lambda 客户责任=代码+IAM 权限（执行角色/资源策略）+环境变量与并发配置；运行时/OS/底层设施全归 AWS；FaaS 的责任边界比 EC2 更向客户倾斜，「写代码+配权限」是万能答案。","s":"源#434"},{"id":"D2-435","d":2,"t":"single","q":"一家公司需要确定谁在特定时间段内访问了 AWS 服务以及执行了什么操作。公司应该使用哪个AWS服务来满足这个要求？","o":[{"l":"A","t":"Amazon CloudWatch"},{"l":"B","t":"AWS CloudTrail"},{"l":"C","t":"AWS 安全中心"},{"l":"D","t":"Amazon Inspector"}],"a":["B"],"e":"**✅ 为什么 B. AWS CloudTrail 对**：CloudTrail 记录账户内所有 API 调用（谁、何时、对哪个资源、做了什么），可按时间段检索，是「确定谁在何时访问了什么服务」的审计服务。\n\n**❌ 为什么其他选项错**：\n- A. Amazon CloudWatch：看资源运行指标与日志，不记「谁操作了」\n- C. AWS 安全中心：Security Hub 聚合安全检查结果与告警\n- D. Amazon Inspector：EC2/ECR/Lambda 软件漏洞扫描，不记录操作者行为\n\n**📌 关键概念**：操作审计/取证/合规 → CloudTrail（默认记录 90 天管理事件历史，可开数据事件）；运行监控 → CloudWatch；题干出现「谁访问了/执行了什么操作」直接锁定 CloudTrail，两个口诀分开记。","s":"源#435"},{"id":"D2-436","d":2,"t":"single","q":"一家公司想要使用一个集中式的 AWS 服务来强制执行符合组织业务标准的情况。公司想要使用一个AWS 服务，可以治理和控制谁可以部署、管理和退役 AWS 资源。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon CloudWatch"},{"l":"B","t":"AWS 服务目录"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"AWS 安全中心"}],"a":["B"],"e":"**✅ 为什么 B. AWS 服务目录 对**：Service Catalog 让企业创建经审批的标准化产品目录，集中治理「谁可以部署、管理和退役哪些 AWS 资源」，确保部署符合组织标准，与题干逐项对应。\n\n**❌ 为什么其他选项错**：\n- A. Amazon CloudWatch：监控告警，不控制资源部署\n- C. Amazon GuardDuty：威胁检测服务\n- D. AWS 安全中心：Security Hub 合规态势聚合，不管理资源部署流程\n\n**📌 关键概念**：IT 服务标准化+部署权限治理 → Service Catalog（产品组合/组合/最终用户自助）；多账户合规基线 → Control Tower；两者区别是 Service Catalog 管「能部署什么」，Control Tower 管「部署后是否合规」。","s":"源#436"},{"id":"D2-437","d":2,"t":"single","q":"\"云的安全性\"在 AWS 共享责任模型中指的是什么？","o":[{"l":"A","t":"AWS 服务的可用性，如 Amazon EC2"},{"l":"B","t":"运行所有 AWS 服务的云基础设施的安全性"},{"l":"C","t":"为 IAM 用户实施密码策略"},{"l":"D","t":"通过使用 AWS 网络防火墙合作伙伴确保客户环境的安全性"}],"a":["B"],"e":"**✅ 为什么 B. 运行所有 AWS 服务的云基础设施的安全性 对**：共享责任模型中「云的安全性（security OF the cloud）」专指 AWS 侧——数据中心、硬件、网络与虚拟化层等全局基础设施由 AWS 保护和维护。\n\n**❌ 为什么其他选项错**：\n- A. AWS 服务可用性：属服务 SLA 范畴，不是「云的安全性」定义\n- C. 为 IAM 用户实施密码策略：典型的客户责任「云中的安全性」\n- D. 通过网络防火墙合作伙伴确保客户环境安全：客户侧防护由客户选择配置，AWS 不代管客户环境\n\n**📌 关键概念**：security OF the cloud（云本身）→ AWS 责任；security IN the cloud（云中内容）→ 客户责任；英文字眼 of/in 是判断锚点，中文翻译后易混，建议记「基础设施归 AWS、客户数据与应用归客户」。","s":"源#437"},{"id":"D2-447","d":2,"t":"single","q":"为了提高 AWS 账户的安全性，公司应该采取哪些行动？","o":[{"l":"A","t":"为特权用户要求多因素认证（MFA）。"},{"l":"B","t":"删除根用户账户。"},{"l":"C","t":"为 AWS 账户根用户创建访问密钥。"},{"l":"D","t":"为每个特权用户创建访问密钥。"}],"a":["A"],"e":"**✅ 为什么 A. 为特权用户要求多因素认证（MFA） 对**：特权用户权限大、风险高，强制 MFA 在密码外增加第二验证因子，能显著降低凭据泄露导致的账户接管风险，是提升账户安全的标准做法。\n\n**❌ 为什么其他选项错**：\n- B. 删除根用户账户：根用户无法删除，只能加强保护（MFA+不日常使用）\n- C. 为根用户创建访问密钥：反模式，根密钥泄露风险极大，应避免创建\n- D. 为每个特权用户创建访问密钥：密钥是静态凭据，不如 MFA 提升安全，且应按需最小化\n\n**📌 关键概念**：账户安全四件套=MFA（根+特权用户）+不用根做日常操作+不给根建长期密钥+定期轮换凭据；「删除根用户」「创建根访问密钥」这类选项可直接判为反模式。","s":"源#447"},{"id":"D2-448","d":2,"t":"multiple","q":"以下哪些是提高 AWS 安全性的方法？（选择两个）","o":[{"l":"A","t":"使用 AWS Artifact"},{"l":"B","t":"为所有 IAM 角色授予最广泛的权限"},{"l":"C","t":"使用 AWS Cloud 运行应用程序代码"},{"l":"D","t":"在 Amazon Cognito 上启用多因素认证（MFA）"},{"l":"E","t":"使用 AWS Trusted Advisor 安全检查"}],"a":["D","E"],"e":"**✅ 为什么 D、E 对**：\n- D. 在 Amazon Cognito 上启用多因素认证（MFA）：为终端用户登录增加第二验证因子\n- E. 使用 AWS Trusted Advisor 安全检查：发现 MFA 未启用、根密钥存在等安全隐患\n\n**❌ 为什么其他选项错**：\n- A. 使用 AWS Artifact：是下载合规报告的门户，本身不提升安全配置\n- B. 为所有 IAM 角色授予最广泛的权限：严重违反最小权限原则，反而放大风险\n- C. 使用 AWS Cloud 运行应用程序代码：仅是使用云平台，不构成安全措施\n\n**📌 关键概念**：提高安全性的可操作项=MFA/IAM 最小权限/轮换密钥/启用 GuardDuty 等；Artifact 只提供合规证明文件；「最广泛权限」类表述永远是错误选项信号词。","s":"源#448"},{"id":"D2-449","d":2,"t":"single","q":"公司可以使用哪个 AWS 服务在云端管理加密密钥？","o":[{"l":"A","t":"AWS License Manager"},{"l":"B","t":"AWS 证书管理器（ACM）"},{"l":"C","t":"AWS CloudHSM"},{"l":"D","t":"AWS 目录服务"}],"a":["C"],"e":"**✅ 为什么 C. AWS CloudHSM 对**：CloudHSM 提供云上单租户硬件安全模块，以高安全方式生成和管理加密密钥，满足「云端管理加密密钥」的需求，与 D2-418 同题干照录。\n\n**❌ 为什么其他选项错**：\n- A. AWS License Manager：软件许可证管理，与密钥无关\n- B. AWS 证书管理器（ACM）：管理 TLS/SSL 证书的签发与续期，不是加密密钥\n- D. AWS 目录服务：托管 AD 域服务，不做密钥管理\n\n**📌 关键概念**：加密密钥管理三档=KMS（托管共享，默认选择）/CloudHSM（专属硬件，合规高要求）/Secrets Manager（存「凭据」非密钥材料）；证书（TLS）→ ACM，证书不是密钥管理题的答案。","s":"源#449"},{"id":"D2-457","d":2,"t":"single","q":"哪个 AWS 服务为用户提供 AWS 发布的报告、认证、认可和第三方证明？","o":[{"l":"A","t":"AWS Artifact"},{"l":"B","t":"AWS Trusted Advisor"},{"l":"C","t":"AWS Health Dashboard"},{"l":"D","t":"AWS Config"}],"a":["A"],"e":"**✅ 为什么 A. AWS Artifact 对**：Artifact 是按需下载 AWS 合规材料的中心门户，提供 AWS 发布的审计报告、认证、认可与第三方证明（SOC、PCI、ISO 等），与题干逐字对应。\n\n**❌ 为什么其他选项错**：\n- B. AWS Trusted Advisor：优化建议工具，不出具合规报告\n- C. AWS Health Dashboard：服务健康与事件状态面板\n- D. AWS Config：记录资源配置与合规评估，属自查工具而非第三方证明来源\n\n**📌 关键概念**：下载 AWS 官方合规报告/第三方审计证明 → Artifact（需 NDA 的报告也在内）；「资源配置合规自查+给审计师看配置历史」→ Config；一个是「证明文件」一个是「配置记录」，题干出现「审计师/认证/认可」选 Artifact。","s":"源#457"},{"id":"D2-460","d":2,"t":"single","q":"一家公司运营一个本地客户联系中心。公司需要迁移到一个基于云的解决方案，该解决方案可以提供人工智能功能以改善用户体验。哪个 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Wavelength"},{"l":"B","t":"AWS IAM 身份中心（AWS 单点登录）"},{"l":"C","t":"AWS Direct Connect"},{"l":"D","t":"Amazon Connect"}],"a":["D"],"e":"**✅ 为什么 D. Amazon Connect 对**：Connect 是全托管云联络中心（客服呼叫中心）服务，内置 AI 能力（智能路由、聊天机器人、对话转写、坐席辅助等），可提升客户体验，对应「本地联系中心迁移上云+AI」场景。\n\n**❌ 为什么其他选项错**：\n- A. AWS Wavelength：5G 边缘计算部署平台，与呼叫中心无关\n- B. AWS IAM 身份中心：企业员工 SSO，不提供联络中心功能\n- C. AWS Direct Connect：专线网络接入服务\n\n**📌 关键概念**：云呼叫中心/客服中心 → Amazon Connect（含 omnichannel 全渠道）；边缘 5G 低时延 → Wavelength；专线入云 → Direct Connect；「联系中心/联络中心」是 Connect 的唯一题眼词。","s":"源#460"},{"id":"D2-463","d":2,"t":"single","q":"一家公司想要安全地登录 Linux Amazon EC2 实例。公司如何实现这个目标？","o":[{"l":"A","t":"使用 SSH 密钥。"},{"l":"B","t":"使用 VPN。"},{"l":"C","t":"使用端到端加密。"},{"l":"D","t":"使用 Amazon Route 53。"}],"a":["A"],"e":"**✅ 为什么 A. 使用 SSH 密钥 对**：Linux EC2 实例的标准安全登录方式是 SSH 密钥对（公有密钥注入实例、私钥由用户保管），替代密码登录，满足「安全登录 Linux 实例」要求。\n\n**❌ 为什么其他选项错**：\n- B. 使用 VPN：网络层加密通道，不解决实例登录认证问题\n- C. 使用端到端加密：数据传输保护技术，不是登录手段\n- D. 使用 Amazon Route 53：DNS 域名解析服务，与登录无关\n\n**📌 关键概念**：Linux 登录 → SSH 密钥对（启动时指定，密钥不可换只能改 authorized_keys）；Windows 登录 → RDP（密码或密钥解密取密）；更安全的进阶方式是 Session Manager（免开端口、留审计）。","s":"源#463"},{"id":"D2-468","d":2,"t":"single","q":"一家公司想要监控并阻止其 Amazon CloudFront 分发接收到的恶意 HTTP 和 HTTPS 请求。公司应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"AWS WAF"},{"l":"D","t":"Amazon Detective"}],"a":["C"],"e":"**✅ 为什么 C. AWS WAF 对**：WAF 可部署在 CloudFront 分发上，按规则过滤恶意 HTTP/HTTPS 请求（SQL 注入、XSS、速率限制等），「监控+阻止」Web 层恶意请求正对应。\n\n**❌ 为什么其他选项错**：\n- A. Amazon GuardDuty：威胁检测服务，只发现告警不实时阻断请求\n- B. Amazon Inspector：软件漏洞扫描，不拦截流量\n- D. Amazon Detective：安全事件调查分析（可视化关联），属于事后追因不是事中拦截\n\n**📌 关键概念**：L7 Web 恶意请求过滤 → WAF（可挂 CloudFront/ALB/API Gateway，支持托管规则+速率限制）；检测不阻断 → GuardDuty；事后调查 → Detective；「阻止/拦截」是防护类题眼，检测类服务（GuardDuty/Inspector/Detective）均不满足阻断需求。","s":"源#468"},{"id":"D2-470","d":2,"t":"single","q":"哪个 AWS 服务可以生成可供外部审计师使用的信息？","o":[{"l":"A","t":"Amazon Cognito"},{"l":"B","t":"Amazon FSx"},{"l":"C","t":"AWS Config"},{"l":"D","t":"Amazon Inspector"}],"a":["C"],"e":"**✅ 为什么 C. AWS Config 对**：Config 持续记录资源配置及其变更历史，可按时间线导出「某资源在何时是什么配置」，供外部审计师核查合规性，与题干对应。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Cognito：终端用户身份认证，无审计输出\n- B. Amazon FSx：托管文件系统（Windows/Lustre 等），不是审计工具\n- D. Amazon Inspector：漏洞扫描报告，不是配置合规记录\n\n**📌 关键概念**：给审计师看「资源配置与变更历史」→ Config（评估规则可判合规状态）；给审计师看「AWS 官方合规认证文件」→ Artifact；Config 记「自己的配置」，Artifact 给「AWS 的证明」，两服务在审计场景常互为干扰。","s":"源#470"},{"id":"D2-474","d":2,"t":"single","q":"一家公司需要在 AWS 组织内管理多个登录，跨同一个组织内的 AWS 账户。公司应该使用哪个AWS服务来满足这个要求？","o":[{"l":"A","t":"Amazon VPC"},{"l":"B","t":"Amazon GuardDuty"},{"l":"C","t":"Amazon Cognito"},{"l":"D","t":"AWS IAM 身份中心"}],"a":["D"],"e":"**✅ 为什么 D. AWS IAM 身份中心 对**：IAM Identity Center 为组织内多 AWS 账户提供集中登录管理，一次登录即可访问组织内各账户，消除多套账户密码，正对应「组织内跨账户管理多个登录」。\n\n**❌ 为什么其他选项错**：\n- A. Amazon VPC：虚拟私有网络，与身份登录无关\n- B. Amazon GuardDuty：威胁检测服务\n- C. Amazon Cognito：面向应用终端用户的注册登录，非企业多账户场景\n\n**📌 关键概念**：组织内多账户统一登录 → IAM Identity Center（配合 Organizations 使用，可设权限集）；终端用户 App 登录 → Cognito；「组织/多个 AWS 账户+单一登录」是身份中心的组合题眼。","s":"源#474"},{"id":"D2-475","d":2,"t":"single","q":"公司使用 Amazon WorkSpaces。根据 AWS 共享责任模型，AWS 的责任是什么？","o":[{"l":"A","t":"为每个 WorkSpaces 用户账户设置多因素认证（MFA）。"},{"l":"B","t":"确保托管 WorkSpaces 的 AWS 基础设施的环境安全和安全。"},{"l":"C","t":"通过 AWS 身份和访问管理（IAM）为 WorkSpaces 用户账户提供安全性。"},{"l":"D","t":"配置 AWS CloudTrail 记录 API 调用和用户活动。"}],"a":["B"],"e":"**✅ 为什么 B. 确保托管 WorkSpaces 的 AWS 基础设施的环境安全和安全 对**：WorkSpaces 属托管服务（DaaS），AWS 负责「云的安全性」——数据中心、硬件与底层基础设施的物理与逻辑安全。\n\n**❌ 为什么其他选项错**：\n- A. 为 WorkSpaces 用户账户设置 MFA：客户侧配置（可配 AD 集成或目录策略），属客户责任\n- C. 通过 IAM 为用户账户提供安全性：客户侧身份治理\n- D. 配置 CloudTrail 记录 API 调用：客户侧可选的审计配置\n\n**📌 关键概念**：托管桌面类服务（WorkSpaces/AppStream）客户责任=用户目录/权限/MFA/客户端侧安全策略+数据管理；AWS 责任=底层设施与运行环境；判断锚点仍是「云的安全性 vs 云中的安全性」。","s":"源#475"},{"id":"D2-477","d":2,"t":"single","q":"一家公司使用第三方身份提供者（IdP）。公司希望为其员工提供访问 AWS 账户和服务的权限，而不需要另一组登录凭据。哪个 AWS 服务将满足这个要求？","o":[{"l":"A","t":"AWS Directory Service"},{"l":"B","t":"Amazon Cognito"},{"l":"C","t":"AWS IAM 身份中心"},{"l":"D","t":"AWS 资源访问管理器（AWS RAM）"}],"a":["C"],"e":"**✅ 为什么 C. AWS IAM 身份中心 对**：IAM Identity Center 支持联合第三方身份提供者（SAML 2.0 或外部 IdP），员工用现有企业凭据即可登录 AWS 账户与服务，无需新建一组登录，正是题干场景。\n\n**❌ 为什么其他选项错**：\n- A. AWS Directory Service：托管 AD/AD Connector，是目录基础设施本身，不是面向用户的 SSO 门户\n- B. Amazon Cognito：面向应用终端用户，非企业员工访问 AWS\n- D. AWS 资源访问管理器（AWS RAM）：跨账户共享资源（如子网、镜像），与登录无关\n\n**📌 关键概念**：员工用现有 IdP 凭据登 AWS → IAM Identity Center（支持 Microsoft Entra ID/Okta 等联合身份）；共享资源给别的账户 → RAM；「不需要另一组凭据/单点登录」是身份中心的标志性题眼。","s":"源#477"},{"id":"D2-479","d":2,"t":"single","q":"哪个 AWS 服务允许用户按需获取 AWS 合规性控制报告？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"Amazon GuardDuty"},{"l":"C","t":"AWS Trusted Advisor"},{"l":"D","t":"AWS Artifact"}],"a":["D"],"e":"**✅ 为什么 D. AWS Artifact 对**：Artifact 提供按需（on-demand）下载 AWS 合规性控制报告（SOC/PCI/ISO/FedRAMP 等），「按需获取合规报告」与题干完全一致，是唯一集中存放 AWS 侧合规文件的门户。\n\n**❌ 为什么其他选项错**：\n- A. AWS Config：记录客户资源配置合规，不是 AWS 侧合规报告库\n- B. Amazon GuardDuty：威胁检测，不涉及合规文件\n- C. AWS Trusted Advisor：优化建议（成本/安全/性能等），不出具合规报告\n\n**📌 关键概念**：按需下载 AWS 合规报告 → Artifact（与 D2-457 同考点，一个问「报告/认证/证明」，一个问「按需获取」，均选 Artifact）；Config 管「自己资源的合规」；Trusted Advisor 给「优化建议」，三者按服务对象区分。","s":"源#479"},{"id":"D2-482","d":2,"t":"multiple","q":"使用 AWS 身份和访问管理（IAM）的最佳实践建议有哪些？（选择两个）","o":[{"l":"A","t":"使用 AWS 账户根用户进行日常访问。"},{"l":"B","t":"在 Amazon EC2 上使用访问密钥和秘密访问密钥。"},{"l":"C","t":"定期旋转凭据。"},{"l":"D","t":"为系统管理员创建一组共享的访问密钥。"},{"l":"E","t":"配置多因素认证（MFA）"}],"a":["C","E"],"e":"**✅ 为什么 C、E 对**：\n- C. 定期旋转凭据：压缩泄露凭据的可用窗口，官方 IAM 最佳实践\n- E. 配置多因素认证（MFA）：密码外增加验证因子，直接提升凭据安全\n\n**❌ 为什么其他选项错**：\n- A. 用根用户日常访问：官方明确反模式，根用户仅限特定账户级任务\n- B. 在 EC2 上用访问密钥：应改用 IAM 角色临时凭据，长期密钥嵌入实例是风险项\n- D. 共享系统管理员访问密钥：凭据必须一人一套，共享违反可追溯与最小权限\n\n**📌 关键概念**：IAM 最佳实践=根用户锁定不用+一人一套凭据+MFA+定期轮换+角色替代长期密钥；选项出现「共享密钥/根用户日常/EC2 内嵌密钥」三类表述可直接判错。","s":"源#482"},{"id":"D2-483","d":2,"t":"single","q":"根据 AWS 共享责任模型，AWS 负责哪个选项？","o":[{"l":"A","t":"网络和防火墙配置"},{"l":"B","t":"客户端数据加密"},{"l":"C","t":"管理用户权限"},{"l":"D","t":"硬件和基础设施"}],"a":["D"],"e":"**✅ 为什么 D. 硬件和基础设施 对**：共享责任模型中 AWS 负责「云的安全性」：数据中心物理设施、服务器硬件、网络设备与虚拟化层的运行与安全，题干 D 即其核心内容。\n\n**❌ 为什么其他选项错**：\n- A. 网络和防火墙配置：VPC 内安全组/NACL 由客户配置（EC2 类责任示例）\n- B. 客户端数据加密：客户数据的加密责任在客户\n- C. 管理用户权限：客户侧 IAM 治理责任\n\n**📌 关键概念**：AWS 侧=硬件/设施/虚拟化/托管服务底层；客户侧=数据加密/IAM 权限/网络配置（IaaS 场景）；「物理」相关选项几乎必属 AWS，「配置/加密/权限」类多属客户。","s":"源#483"},{"id":"D2-487","d":2,"t":"single","q":"哪个 AWS 服务允许用户部署高度可重复的基础设施配置？","o":[{"l":"A","t":"AWS CloudFormation"},{"l":"B","t":"AWS CodeDeploy"},{"l":"C","t":"AWS CodeBuild"},{"l":"D","t":"AWS Systems Manager"}],"a":["A"],"e":"**✅ 为什么 A. AWS CloudFormation 对**：CloudFormation 用 JSON/YAML 模板声明式地定义资源，同模板可反复部署出一致的基础设施，天然支持版本控制与「高度可重复」的配置管理。\n\n**❌ 为什么其他选项错**：\n- B. AWS CodeDeploy：应用代码部署自动化（EC2/Lambda 等），不是基础设施模板\n- C. AWS CodeBuild：编译构建测试服务\n- D. AWS Systems Manager：运维管理套件（补丁/会话/自动化），模板化基础设施非其主业\n\n**📌 关键概念**：基础设施即代码/模板化重复部署 → CloudFormation；应用代码部署 → CodeDeploy；构建 → CodeBuild；「可重复/模板/版本控制」是 IaC 题眼，与 CI/CD 工具链相区分。","s":"源#487"},{"id":"D2-490","d":2,"t":"single","q":"一家公司正在使用 AWS 构建一个 Web 应用程序。哪个 AWS 服务将帮助防止对Web 应用程序的网络层 DDoS 攻击？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"AWS Firewall Manager"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"AWS Shield"}],"a":["D"],"e":"**✅ 为什么 D. AWS Shield 对**：Shield 是托管 DDoS 防护服务（Standard 免费自动启用，Advanced 付费增强），专门抵御网络层（L3/L4）DDoS 攻击，与「网络层 DDoS」题眼精确对应。\n\n**❌ 为什么其他选项错**：\n- A. AWS WAF：L7 应用层防火墙，防 SQL 注入/XSS 等，不主打 DDoS\n- B. AWS Firewall Manager：集中管理 WAF/Shield 规则的跨账户策略工具，防护本体仍是前者\n- C. Amazon GuardDuty：威胁检测服务，发现问题只告警不拦截\n\n**📌 关键概念**：DDoS（尤其 L3/L4 网络层）→ Shield（Standard 免费+Advanced 付费增强）；Web 应用层攻击 → WAF；多账户统一管理规则 → Firewall Manager；三者是 DDoS/Web 攻防题的高频组合，按「网络层/应用层/管理面」选服务。","s":"源#490"},{"id":"D2-493","d":2,"t":"single","q":"哪个 AWS 工具或功能在子网级别充当 VPC 防火墙？","o":[{"l":"A","t":"安全组"},{"l":"B","t":"网络 ACL"},{"l":"C","t":"流量镜像"},{"l":"D","t":"网关"}],"a":["B"],"e":"**✅ 为什么 B. 网络 ACL 对**：网络 ACL 在子网级别对进出子网流量做无状态过滤，题干「子网级别+VPC 防火墙」即网络 ACL 的标准定义。\n\n**❌ 为什么其他选项错**：\n- A. 安全组：实例/ENI 级防火墙，作用层不是子网\n- C. 流量镜像：抓包复制供分析，不过滤流量\n- D. 网关：泛指流量出入口组件（IGW/NAT 等），不做规则过滤\n\n**📌 关键概念**：VPC 两级防火墙=NACL（子网级/无状态/默认放行）+安全组（实例级/有状态/默认拒入站）；流量镜像仅「复制」不「控制」；本题与 D2-417 同考点，题眼词「子网级」锁定 NACL。","s":"源#493"},{"id":"D2-498","d":2,"t":"multiple","q":"一家公司正在了解其与 Amazon EC2 实例管理相关的责任。根据 AWS 共享责任模型，哪些EC2 实例任务是公司的职责？（选择两项。）","o":[{"l":"A","t":"安装并修补机器虚拟机。"},{"l":"B","t":"修补客户操作系统。"},{"l":"C","t":"对关联存储上的数据进行静态加密。"},{"l":"D","t":"安装物理硬件和布线。"},{"l":"E","t":"为 EC2 实例提供物理安全。"}],"a":["B","C"],"e":"**✅ 为什么 B、C 对**：\n- B. 修补客户操作系统：EC2 属 IaaS，实例内客户 OS 补丁归客户\n- C. 对关联存储上的数据进行静态加密：EBS 加密配置是客户责任\n\n**❌ 为什么其他选项错**：\n- A. 安装并修补机器虚拟机：虚拟化管理层由 AWS 维护\n- D. 安装物理硬件和布线：物理设施全归 AWS\n- E. 为 EC2 实例提供物理安全：数据中心物理安全归 AWS\n\n**📌 关键概念**：EC2 客户责任=客户 OS 补丁/安全组与防火墙配置/数据加密/IAM；AWS 责任=硬件/设施/虚拟化层/物理安全；「物理」相关一律 AWS，「系统内」一律客户，此题与 D2-511 构成镜像考点。","s":"源#498"},{"id":"D2-504","d":2,"t":"single","q":"哪个 AWS 服务或功能支持 AWS 账户的治理、合规性和风险审计？","o":[{"l":"A","t":"多因素认证（MFA）"},{"l":"B","t":"AWS Lambda"},{"l":"C","t":"Amazon Simple Notification Service (Amazon SNS)"},{"l":"D","t":"AWS CloudTrail"}],"a":["D"],"e":"**✅ 为什么 D. AWS CloudTrail 对**：CloudTrail 记录账户内用户、角色与服务执行的操作（API 调用历史），是治理、合规与运营审计的事实来源，与题干「治理/合规/风险审计」逐字对应。\n\n**❌ 为什么其他选项错**：\n- A. 多因素认证（MFA）：登录验证手段，非审计服务\n- B. AWS Lambda：无服务器计算服务，与审计无关\n- C. Amazon SNS：消息发布订阅通知服务，仅推送告警\n\n**📌 关键概念**：API 调用审计/操作记录 → CloudTrail；配置变更记录 → Config；消息通知 → SNS；「谁对 AWS 干了什么+治理审计」是 CloudTrail 的官方定位句，与 D2-435 呼应（一个问操作细节、一个问治理定位）。","s":"源#504"},{"id":"D2-506","d":2,"t":"single","q":"一家公司需要一个威胁检测服务，该服务将连续监控其 AWS 账户、工作负载和Amazon S3 存储桶，以寻找恶意活动和未经授权的行为。哪个 AWS 服务满足这些要求？","o":[{"l":"A","t":"AWS Shield"},{"l":"B","t":"AWS Firewall Manager"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"Amazon Inspector"}],"a":["C"],"e":"**✅ 为什么 C. Amazon GuardDuty 对**：GuardDuty 是智能威胁检测服务，持续监控账户、工作负载与 S3 数据访问，发现恶意活动和未授权行为（异常 API 调用、可疑登录、挖矿等）并告警，与题干逐字对应。\n\n**❌ 为什么其他选项错**：\n- A. AWS Shield：DDoS 防护，专防流量型攻击不分析行为\n- B. AWS Firewall Manager：跨账户集中管理防火墙规则，不做威胁侦测\n- D. Amazon Inspector：软件漏洞与网络配置扫描，对象是漏洞不是行为\n\n**📌 关键概念**：威胁检测三剑客=GuardDuty（行为威胁）/Inspector（漏洞）/Macie（敏感数据）；「连续监控+恶意活动+未授权行为」是 GuardDuty 标志性题眼；Shield 是「防」、GuardDuty 是「侦」，一字之差对应防护与检测两类需求。","s":"源#506"},{"id":"D2-509","d":2,"t":"single","q":"哪个 AWS 服务支持移动和 Web 应用程序的用户注册功能和身份验证？","o":[{"l":"A","t":"Amazon Cognito"},{"l":"B","t":"AWS Config"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"AWS Systems Manager"}],"a":["A"],"e":"**✅ 为什么 A. Amazon Cognito 对**：Cognito 为移动和 Web 应用提供用户注册、登录、访客访问等身份能力，支持社交 IdP 与企业联合身份，与题干「注册+身份验证」完全对应。\n\n**❌ 为什么其他选项错**：\n- B. AWS Config：资源配置记录与合规评估，不管理终端用户\n- C. Amazon GuardDuty：威胁检测服务，面向账户与工作负载\n- D. AWS Systems Manager：运维管理套件，管资源不管应用用户身份\n\n**📌 关键概念**：App 终端用户注册/登录 → Cognito（用户池+身份池双模式）；企业员工登 AWS → IAM Identity Center；「移动/Web 应用+用户注册」是 Cognito 固定题眼，与 D2-394 构成同考点重复题。","s":"源#509"},{"id":"D2-511","d":2,"t":"single","q":"根据 AWS 共享责任模型，哪项任务是客户的责任？","o":[{"l":"A","t":"在 Amazon EC2 实例上部署的客户端操作系统打补丁。"},{"l":"B","t":"控制对 AWS 数据中心的物理访问。"},{"l":"C","t":"控制对 AWS 底层硬件的访问。"},{"l":"D","t":"在 Amazon S3 上部署的主机操作系统打补丁。"}],"a":["A"],"e":"**✅ 为什么 A. 在 Amazon EC2 实例上部署的客户端操作系统打补丁 对**：EC2 上运行的客户操作系统（含补丁、加固）属客户「云中的安全性」责任，AWS 只负责虚拟化层以下的部分。\n\n**❌ 为什么其他选项错**：\n- B. 控制对 AWS 数据中心的物理访问：物理安全归 AWS\n- C. 控制对 AWS 底层硬件的访问：底层硬件归 AWS\n- D. 在 Amazon S3 上部署的主机操作系统打补丁：S3 是无服务器对象存储，没有「主机操作系统」概念，属编造干扰项\n\n**📌 关键概念**：EC2 客户责任=客户 OS 补丁/应用/数据/网络配置；「物理访问/底层硬件」必属 AWS；D 选项利用 S3 的无服务器特性设陷——无 OS 就无 OS 补丁，遇到「S3 主机操作系统」直接判错。","s":"源#511"},{"id":"D2-512","d":2,"t":"single","q":"一家公司想要使用基础设施即代码（IaC）模板管理其云资源。公司需要满足合规性要求。公司应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS Artifact"},{"l":"B","t":"AWS Resource Explorer"},{"l":"C","t":"AWS License Manager"},{"l":"D","t":"AWS Service Catalog"}],"a":["D"],"e":"**✅ 为什么 D. AWS Service Catalog 对**：Service Catalog 通过 IaC 模板（CloudFormation 产品）预置标准化资源组合，确保用户只能部署经审批、满足合规要求的配置，将 IaC 与合规治理结合。\n\n**❌ 为什么其他选项错**：\n- A. AWS Artifact：下载 AWS 合规报告的门户，不管理云资源\n- B. AWS Resource Explorer：跨区域搜索资源清单，不做部署管控\n- C. AWS License Manager：软件许可证跟踪管理\n\n**📌 关键概念**：IaC 模板+合规管控（只允许部署合规配置）→ Service Catalog；单纯用模板建资源 → CloudFormation（无审批约束）；Artifact 只提供合规证明文件，一个「管部署」一个「给报告」，需求里的「合规」指向审批控制而非审计文件。","s":"源#512"},{"id":"D2-514","d":2,"t":"single","q":"一家公司想要将其所有本地基础设施迁移到 AWS 云。在迁移之前，公司想要对其按原样运行的基础设施的成本进行估算。公司应该使用哪个 AWS 服务或原则来满足此要求？","o":[{"l":"A","t":"AWS 定价计算器"},{"l":"B","t":"AWS 良好架构框架"},{"l":"C","t":"AWS 共享责任模型"},{"l":"D","t":"AWS 云采用框架（AWS CA"}],"a":["A"],"e":"**✅ 为什么 A. AWS 定价计算器 对**：Pricing Calculator 可输入预估的资源规格与用量，估算本地基础设施「按原样」（lift-and-shift）迁到 AWS 后的成本，是迁移前成本估算的官方工具。\n\n**❌ 为什么其他选项错**：\n- B. AWS 良好架构框架：架构质量审查方法论，不出成本估算\n- C. AWS 共享责任模型：责任划分框架，与成本无关\n- D. AWS 云采用框架（AWS CA…，选项文本截断）：迁移指导框架，提供流程方法论而非成本数字\n\n**📌 关键概念**：迁移前估算云端成本 → Pricing Calculator（按服务/规格建模）；本地环境评估与成本洞察 → Migration Evaluator；WAAP 管「架构好不好」、CAF 管「怎么迁」，均不输出账单数字。","s":"源#514"},{"id":"D2-517","d":2,"t":"single","q":"哪个 AWS 服务支持公司将基础设施视为代码的能力？","o":[{"l":"A","t":"AWS CodeDeploy"},{"l":"B","t":"AWS Elastic Beanstalk"},{"l":"C","t":"Amazon API Gateway"},{"l":"D","t":"AWS CloudFormation"}],"a":["D"],"e":"**✅ 为什么 D. AWS CloudFormation 对**：CloudFormation 用声明式模板（JSON/YAML）把基础设施定义为代码，可版本控制、可重复部署，是 AWS「基础设施即代码」的代表服务。\n\n**❌ 为什么其他选项错**：\n- A. AWS CodeDeploy：应用代码部署自动化，不定义基础设施\n- B. AWS Elastic Beanstalk：应用平台即服务（PaaS），侧重应用托管而非 IaC 模板管理\n- C. Amazon API Gateway：API 创建与管理服务，不管理基础设施\n\n**📌 关键概念**：基础设施即代码（IaC）→ CloudFormation（模板/栈模型，可跨账号重复部署）；用编程语言生成 IaC → CDK；应用部署 → CodeDeploy；「模板/栈/版本控制」是 CloudFormation 题眼，与 CI/CD 工具链相区分。","s":"源#517"},{"id":"D2-519","d":2,"t":"single","q":"一位 AWS 用户想要主动检测实例或账户可能被入侵或存在攻击威胁的情况。用户应该选择哪个AWS服务？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"AWS Shield"},{"l":"D","t":"Amazon Inspector"}],"a":["A"],"e":"**✅ 为什么 A. Amazon GuardDuty 对**：GuardDuty 是智能威胁检测服务，持续分析账户与工作负载的可疑活动（异常登录、恶意 IP 通信、挖矿行为等），主动发现「账户被入侵或存在攻击威胁」的情况。\n\n**❌ 为什么其他选项错**：\n- B. AWS WAF：L7 Web 请求过滤，防 SQL 注入/XSS，不做账户威胁侦测\n- C. AWS Shield：DDoS 流量防护，专注流量型攻击\n- D. Amazon Inspector：扫描软件漏洞与网络配置，不分析行为威胁\n\n**📌 关键概念**：账户/实例「被入侵」威胁检测 → GuardDuty（行为分析+威胁情报）；Web 应用攻击 → WAF；DDoS → Shield；漏洞 → Inspector；四个安全服务按「行为/请求/流量/漏洞」四象限记忆。","s":"源#519"},{"id":"D2-523","d":2,"t":"single","q":"一家公司必须使用一次写入、多次读取（WORM）模型来存档其文件，以满足法律和合规义务。公司可以使用哪个 Amazon S3 功能来满足此要求？","o":[{"l":"A","t":"S3 版本控制"},{"l":"B","t":"S3 存储桶策略"},{"l":"C","t":"S3 Glacier Vault Lock"},{"l":"D","t":"S3 多因素认证"}],"a":["C"],"e":"**✅ 为什么 C. S3 Glacier Vault Lock 对**：Glacier Vault Lock 通过保管库锁策略强制执行一次写入、多次读取（WORM）模型，策略一旦锁定便不可更改，满足法规留存的不可篡改要求。\n\n**❌ 为什么其他选项错**：\n- A. S3 版本控制：保留多版本防误删，但可删除版本，不满足不可改\n- B. S3 存储桶策略：访问控制手段，随时可改，无 WORM 能力\n- D. S3 多因素认证：应为 S3 MFA Delete（版本控制下的删除保护），非 WORM 存档方案\n\n**📌 关键概念**：法规级 WORM 合规留存 → Glacier Vault Lock（锁后策略不可变）；对象级保留 → S3 Object Lock（合规模式/治理模式）；版本控制+MFA Delete 是防误删组合，均弱于 Vault Lock 的不可逆性。","s":"源#523"},{"id":"D2-526","d":2,"t":"single","q":"在 AWS 上存储密码的最安全方式是什么？","o":[{"l":"A","t":"将密码存储在 Amazon S3 存储桶中。"},{"l":"B","t":"将密码作为 AWS CloudFormation 参数存储。"},{"l":"C","t":"将密码存储在 AWS Storage Gateway 中。"},{"l":"D","t":"将密码存储在 AWS Secrets Manager 中。"}],"a":["D"],"e":"**✅ 为什么 D. 将密码存储在 AWS Secrets Manager 中 对**：Secrets Manager 专为安全保管密码、数据库凭据等机密设计，支持加密存储、自动轮换与细粒度审计，是存密码的官方推荐方式。\n\n**❌ 为什么其他选项错**：\n- A. 存储在 S3 存储桶中：通用对象存储，即使加密也不具备机密管理的轮换与审计能力\n- B. 作为 CloudFormation 参数存储：模板参数会留存于栈元数据，明文风险大\n- C. 存储在 AWS Storage Gateway 中：本地与云的混合存储网关，不是机密管理服务\n\n**📌 关键概念**：密码/数据库凭据/API 密钥 → Secrets Manager（KMS 加密+自动轮换+审计）；加密密钥材料 → KMS/CloudHSM；「任何能存的东西」不等于「该存的地方」，机密必须走机密管理服务。","s":"源#526"},{"id":"D2-534","d":2,"t":"multiple","q":"用户已被授权更改自己的 IAM 用户密码。用户可以使用哪些 AWS 服务来更改密码？（选择两项。）","o":[{"l":"A","t":"AWS 命令行界面（AWS CLI）"},{"l":"B","t":"AWS 密钥管理服务（AWS KMS）"},{"l":"C","t":"AWS 管理控制台"},{"l":"D","t":"AWS 资源访问管理器（AWS RAM）"},{"l":"E","t":"AWS Secrets Manager"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A. AWS 命令行界面（AWS CLI）：aws iam change-password 命令可自助修改自己的密码\n- C. AWS 管理控制台：控制台安全凭证页面支持用户自助改密\n\n**❌ 为什么其他选项错**：\n- B. AWS 密钥管理服务（AWS KMS）：管理加密密钥，不管理用户密码\n- D. AWS 资源访问管理器（AWS RAM）：跨账户共享资源，与改密无关\n- E. AWS Secrets Manager：保管应用机密，不是 IAM 用户密码修改入口\n\n**📌 关键概念**：自助改密的两个入口=控制台（图形）+CLI（命令行）；前提是账户策略允许 self-service password change；KMS/Secrets Manager 管的是「密钥/机密」这类数据对象，不是用户登录密码。","s":"源#534"},{"id":"D2-536","d":2,"t":"single","q":"哪个 AWS 服务或功能在 VPC 中的子网级别提供防火墙？","o":[{"l":"A","t":"安全组"},{"l":"B","t":"网络 ACL"},{"l":"C","t":"弹性网络接口"},{"l":"D","t":"AWS WAF"}],"a":["B"],"e":"**✅ 为什么 B. 网络 ACL 对**：网络 ACL 在子网级别对进出子网流量做过滤，是 VPC 内子网层的防火墙，与题干「子网级别提供防火墙」逐字对应。\n\n**❌ 为什么其他选项错**：\n- A. 安全组：实例/ENI 级防火墙，作用层不是子网\n- C. 弹性网络接口：实例的虚拟网卡，本身不做过滤\n- D. AWS WAF：L7 应用层防火墙，挂在 CloudFront/ALB 等入口\n\n**📌 关键概念**：子网级防火墙 → 网络 ACL（无状态、默认放行、规则按序号评估）；实例级 → 安全组（有状态、默认拒入站）；两级防线配合使用，粒度是判断的唯一锚点。","s":"源#536"},{"id":"D2-539","d":2,"t":"multiple","q":"使用 AWS 身份和访问管理（IAM）的最佳实践指南有哪些？（选择两项。）","o":[{"l":"A","t":"共享访问密钥。"},{"l":"B","t":"创建个人 IAM 用户。"},{"l":"C","t":"使用内联策略而不是客户管理策略。"},{"l":"D","t":"向 IAM 用户授予最大权限。"},{"l":"E","t":"使用组为 IAM 用户分配权限。"}],"a":["B","E"],"e":"**✅ 为什么 B、E 对**：\n- B. 创建个人 IAM 用户：一人一套身份，操作可审计可追责，官方最佳实践\n- E. 使用组为 IAM 用户分配权限：按组授权便于批量管理与权限一致性，官方最佳实践\n\n**❌ 为什么其他选项错**：\n- A. 共享访问密钥：凭据共享导致无法追责，违反基本原则\n- C. 使用内联策略而不是客户管理策略：托管策略更利于复用与统一变更，官方反而推荐托管策略\n- D. 向 IAM 用户授予最大权限：违反最小权限原则\n\n**📌 关键概念**：IAM 最佳实践=个人用户+按组授权+最小权限+MFA+定期轮换；共享凭据/最大权限/根用户日常操作是三大反模式信号词，出现即错。","s":"源#539"},{"id":"D2-540","d":2,"t":"single","q":"云计算的哪个优势允许用户根据应用程序支持的负载量来扩展资源？","o":[{"l":"A","t":"几分钟内走向全球"},{"l":"B","t":"停止猜测容量"},{"l":"C","t":"从大规模经济中获益"},{"l":"D","t":"将固定费用转换为变动费用"}],"a":["B"],"e":"**✅ 为什么 B. 停止猜测容量 对**：云可按应用实际负载弹性扩缩资源，无需提前采购峰值容量，正是六大云优势中的「停止猜测容量」，与题干「按负载量扩展资源」直接对应。\n\n**❌ 为什么其他选项错**：\n- A. 几分钟内走向全球：指全球基础设施快速部署，非容量伸缩\n- C. 从大规模经济中获益：指规模化带来的低价，与扩容能力无关\n- D. 将固定费用转换为变动费用：指付费模式（CAPEX→OPEX），非资源伸缩本身\n\n**📌 关键概念**：负载伸缩资源 → 停止猜测容量（配合 Auto Scaling）；全球部署 → 分钟级全球化；成本模式转变 → 前期投入转按用付费；规模效益 → 规模化经济，六大优势各管一事，按题干动词判断。","s":"源#540"},{"id":"D2-541","d":2,"t":"single","q":"一家公司正在请求支付卡行业（PCI）报告，以验证 AWS 安全控制的操作有效性。公司应如何获取这些报告？","o":[{"l":"A","t":"联系 AWS 支持。"},{"l":"B","t":"从 AWS Artifact 下载报告。"},{"l":"C","t":"从 AWS Security Hub 下载报告。"},{"l":"D","t":"联系 AWS 技术账户经理（TAM）。"}],"a":["B"],"e":"**✅ 为什么 B. 从 AWS Artifact 下载报告 对**：PCI 报告（含 AoC、SOC 报告等）集中在 Artifact 门户按需下载，用于验证 AWS 安全控制的有效性，无需人工流程。\n\n**❌ 为什么其他选项错**：\n- A. 联系 AWS 支持：报告不需要工单获取，Artifact 自助下载即可\n- C. 从 AWS Security Hub 下载：Security Hub 是合规态势聚合面板，不提供 PCI 审计报告文件\n- D. 联系 AWS 技术账户经理（TAM）：辅助渠道不是必需，且 TAM 属企业支持计划角色\n\n**📌 关键概念**：PCI/SOC/ISO 等合规审计报告 → Artifact（按需自助下载，部分需 NDA）；合规态势自查 → Security Hub；题干出现「报告/审计师/认证」三词优先选 Artifact。","s":"源#541"},{"id":"D2-544","d":2,"t":"multiple","q":"根据 AWS 共享责任模型，以下哪些是 AWS 的责任？（选择两项。）","o":[{"l":"A","t":"网络基础设施和基础设施的虚拟化"},{"l":"B","t":"应用数据的安全性"},{"l":"C","t":"客户操作系统"},{"l":"D","t":"硬件的物理安全性"},{"l":"E","t":"凭据和策略"}],"a":["A","D"],"e":"**✅ 为什么 A、D 对**：\n- A. 网络基础设施和基础设施的虚拟化：AWS 负责「云的安全性」，含网络与虚拟化层\n- D. 硬件的物理安全性：数据中心物理安全完全由 AWS 承担\n\n**❌ 为什么其他选项错**：\n- B. 应用数据的安全性：客户责任「云中的安全性」\n- C. 客户操作系统：EC2 上客户 OS 归客户\n- E. 凭据和策略：客户侧 IAM 治理责任\n\n**📌 关键概念**：AWS 侧三件套=物理设施+网络+虚拟化；客户侧三件套=数据+客户 OS+IAM 凭据策略；「物理/虚拟化/网络基础设施」出现即 AWS 侧，「数据/系统内/权限」即客户侧。","s":"源#544"},{"id":"D2-545","d":2,"t":"single","q":"一家公司使用 Amazon Aurora 作为其数据库服务。公司想要加密其数据库和数据库备份。根据AWS共享责任模型，哪一方管理数据库集群和数据库快照的加密？","o":[{"l":"A","t":"AWS"},{"l":"B","t":"公司"},{"l":"C","t":"AWS Marketplace 合作伙伴"},{"l":"D","t":"第三方合作伙伴"}],"a":["A"],"e":"**✅ 为什么 A. AWS 对**：Aurora 的存储与备份底层加密由 AWS 托管管理——Aurora 集群与快照默认启用加密（KMS 密钥），加密基础设施与密钥服务由 AWS 侧维护。\n\n**❌ 为什么其他选项错**：\n- B. 公司：客户可选择密钥与启用配置，但「集群与快照加密的底层管理」由 AWS 承担\n- C. AWS Marketplace 合作伙伴：市场第三方卖家，与数据库加密无关\n- D. 第三方合作伙伴：无此责任划分\n\n**📌 关键概念**：托管服务（Aurora/RDS）底层存储与备份加密机制 → AWS；客户责任=选择 KMS 密钥、配置访问控制与数据库内安全；托管程度越高，客户责任越偏向「配置与数据治理」。","s":"源#545"},{"id":"D2-546","d":2,"t":"single","q":"一家公司在 Amazon EC2 实例上托管了一个 Web 应用程序。公司想要实施自定义条件来过滤和控制入站 Web 流量。哪个 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"Amazon Macie"},{"l":"D","t":"AWS Shield"}],"a":["B"],"e":"**✅ 为什么 B. AWS WAF 对**：WAF 支持自定义规则（IP 来源、地理位置、请求特征、速率等条件）过滤和控制入站 Web 流量，满足「自定义条件过滤 Web 流量」的要求。\n\n**❌ 为什么其他选项错**：\n- A. Amazon GuardDuty：威胁检测服务，只告警不过滤流量\n- C. Amazon Macie：S3 敏感数据发现，不处理网络流量\n- D. AWS Shield：DDoS 防护，规则面向流量攻击且不可自定义过滤条件\n\n**📌 关键概念**：自定义规则过滤 L7 Web 流量 → WAF（Web ACL+托管规则+自定义规则，可挂 ALB/CloudFront/API Gateway）；DDoS → Shield；威胁检测 → GuardDuty；「自定义条件」是 WAF 的专属题眼，Shield 不开放自定义过滤。","s":"源#546"},{"id":"D2-549","d":2,"t":"single","q":"一家公司的员工正在家工作。公司希望其员工使用他们的个人设备连接到 AWS 云中的托管工作站。公司应该使用哪个 AWS 服务来提供远程环境？","o":[{"l":"A","t":"Amazon WorkSpaces"},{"l":"B","t":"AWS Cloud9"},{"l":"C","t":"AWS Outposts"},{"l":"D","t":"Amazon Lightsail"}],"a":["A"],"e":"**✅ 为什么 A. Amazon WorkSpaces 对**：WorkSpaces 是全托管云桌面（DaaS）服务，员工用个人设备（BYOD）即可连到云中的托管 Windows/Linux 工作站，数据留在云端，正对应「远程托管工作站」场景。\n\n**❌ 为什么其他选项错**：\n- B. AWS Cloud9：基于浏览器的 IDE 开发环境，仅面向编码而非通用办公工作站\n- C. AWS Outposts：把 AWS 硬件延伸部署到本地机房，方向相反\n- D. Amazon Lightsail：面向轻量应用的虚拟机/容器平台，不是托管桌面\n\n**📌 关键概念**：远程办公/托管桌面（DaaS）→ WorkSpaces（个人设备接入+数据不落地）；浏览器 IDE → Cloud9；本地延伸 AWS → Outposts；「个人设备+托管工作站」组合词出现即选 WorkSpaces。","s":"源#549"},{"id":"D2-554","d":2,"t":"single","q":"一家公司需要一个防火墙来控制与单个 Amazon EC2 实例的网络连接。此防火墙将不控制与同一子网中的其他实例的网络连接。公司可以使用哪个 AWS 服务或功能来满足这些要求？","o":[{"l":"A","t":"网络 ACL"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"路由表"},{"l":"D","t":"安全组"}],"a":["D"],"e":"**✅ 为什么 D. 安全组 对**：安全组作用于单个 EC2 实例（ENI 级），只控制进出该实例的流量，不影响同子网其他实例，与题干「只控制单个实例」精确对应。\n\n**❌ 为什么其他选项错**：\n- A. 网络 ACL：子网级防火墙，规则作用于整个子网的所有实例，粒度不符\n- B. AWS WAF：L7 应用层防火墙，不管理 VPC 内实例间连接\n- C. 路由表：决定流量去向（下一跳），不做允许/拒绝过滤\n\n**📌 关键概念**：单实例粒度 → 安全组（实例级/有状态）；子网整层粒度 → NACL（无状态）；路由表只管「往哪走」不管「能否走」，三者按功能与粒度区分，此题与子网级 NACL 题互为镜像。","s":"源#554"},{"id":"D2-563","d":2,"t":"single","q":"哪个 AWS 服务公司可以用来订阅 RSS 源，以获取有关所有 AWS 服务问题更新的信息？","o":[{"l":"A","t":"Amazon Simple Notification Service（Amazon SNS）"},{"l":"B","t":"AWS Health Dashboard"},{"l":"C","t":"AWS Config"},{"l":"D","t":"AWS CodeCommit"}],"a":["A"],"e":"**✅ 为什么 A. Amazon Simple Notification Service（Amazon SNS） 对**：SNS 支持「RSS 源订阅」的发布/订阅模式，用户订阅主题后自动接收 AWS 服务事件更新推送，正对应题干场景。\n\n**❌ 为什么其他选项错**：\n- B. AWS Health Dashboard：被动查看服务健康状态的页面，不主动推送订阅\n- C. AWS Config：资源配置记录与合规评估\n- D. AWS CodeCommit：托管 Git 代码仓库（现已对新客户停服），与事件订阅无关\n\n**📌 关键概念**：服务事件/消息订阅推送 → SNS（主题+订阅者模型，支持邮件/SMS/HTTP 等）；查看服务健康 → Health Dashboard；「订阅+自动接收」是 SNS 的功能性题眼，被动查看型工具不满足「获取更新」的推送需求。","s":"源#563"},{"id":"D2-567","d":2,"t":"single","q":"一位新的 AWS 用户需要通过 API 调用与 AWS 支持交互。哪种 AWS 支持计划最经济地满足此要求？","o":[{"l":"A","t":"AWS 基础支持"},{"l":"B","t":"AWS 开发人员支持"},{"l":"C","t":"AWS 商业支持"},{"l":"D","t":"AWS 企业支持"}],"a":["C"],"e":"**✅ 为什么 C. AWS 商业支持 对**：五种支持计划中，基础支持无人工/API 工单；开发人员支持仅限「一名主联系人通过邮件联系」；商业支持起才开放不限次数的 API 提交工单能力，且价格低于企业支持，是「API 调用交互+最经济」的平衡点。\n\n**❌ 为什么其他选项错**：\n- A. AWS 基础支持：免费但只有文档/论坛等自助渠道，不支持 API 开工单\n- B. AWS 开发人员支持：支持渠道限邮件联系主联系人，不含 API 工单能力\n- D. AWS 企业支持：含 API 工单但价格最高，不满足「最经济」\n\n**📌 关键概念**：API 工单准入线=商业支持（Business）；企业支持贵在 TAM、15 分钟响应与事件管理团队；「最经济地满足功能」类题要同时核功能门槛与价格，勿只看功能够就选顶配。","s":"源#567"},{"id":"D2-571","d":2,"t":"single","q":"一家公司想要集中管理其员工对多个 AWS 账户的访问。公司应该使用哪个 AWS 服务或功能来满足此要求？","o":[{"l":"A","t":"AWS 身份和访问管理访问分析器"},{"l":"B","t":"AWS Secrets Manager"},{"l":"C","t":"AWS IAM 身份中心"},{"l":"D","t":"AWS 安全令牌服务（AWS STS）"}],"a":["C"],"e":"**✅ 为什么 C. AWS IAM 身份中心 对**：IAM Identity Center 集中管理员工对多个 AWS 账户与应用的访问（一次登录、按权限集分配），是「集中管理多账户访问」的官方服务。\n\n**❌ 为什么其他选项错**：\n- A. AWS 身份和访问管理访问分析器：识别跨账户资源暴露风险，不提供集中登录管理\n- B. AWS Secrets Manager：保管应用机密凭据\n- D. AWS 安全令牌服务（AWS STS）：签发临时凭据的底层服务，不提供用户目录与管理门户\n\n**📌 关键概念**：多账户集中访问管理 → IAM Identity Center（配合 Organizations）；临时凭据签发 → STS（常作为身份中心的底层组件出现）；「员工+多账户+集中」三词组合锁定身份中心。","s":"源#571"},{"id":"D2-574","d":2,"t":"single","q":"一家公司有多个账户和团队，想要设置一个新的多账户 AWS 环境。哪个 AWS 服务支持此要求？","o":[{"l":"A","t":"AWS CloudFormation"},{"l":"B","t":"AWS Control Tower"},{"l":"C","t":"AWS Config"},{"l":"D","t":"Amazon 虚拟专用云（Amazon VP"}],"a":["B"],"e":"**✅ 为什么 B. AWS Control Tower 对**：Control Tower 提供多账户环境的「着陆区」最佳实践（治理护栏、账户工厂、统一计费视图），专用于从零搭建合规的多账户 AWS 环境。\n\n**❌ 为什么其他选项错**：\n- A. AWS CloudFormation：单栈资源编排，不提供多账户治理基线\n- C. AWS Config：资源配置与合规记录，不搭建账户环境\n- D. Amazon 虚拟专用云（Amazon VP…，选项文本截断）：网络隔离服务，与多账户环境搭建无关\n\n**📌 关键概念**：新建多账户环境+治理 → Control Tower（基于 Organizations+SCP 护栏+账户工厂）；已有账户整合 → Organizations 直用；Config 是事后审计而非环境搭建，「设置新环境」题眼优先控制塔。","s":"源#574"},{"id":"D2-576","d":2,"t":"single","q":"哪个 AWS 服务帮助用户规划和跟踪其服务器和应用程序库存迁移数据到 AWS？","o":[{"l":"A","t":"Amazon CloudWatch"},{"l":"B","t":"AWS DataSync"},{"l":"C","t":"AWS 迁移中心"},{"l":"D","t":"AWS 应用程序迁移服务"}],"a":["C"],"e":"**✅ 为什么 C. AWS 迁移中心 对**：Migration Hub 集中规划和跟踪服务器与应用迁移到 AWS 的进度（含迁移状态看板），与题干「规划+跟踪迁移」逐字对应。\n\n**❌ 为什么其他选项错**：\n- A. Amazon CloudWatch：资源监控告警，不跟踪迁移\n- B. AWS DataSync：本地与 AWS 间批量数据传输执行工具\n- D. AWS 应用程序迁移服务：执行 lift-and-shift 复制切换，不提供组合级规划视图\n\n**📌 关键概念**：迁移规划与进度跟踪 → Migration Hub（单一位置看全貌）；发现本地资产 → ADS；执行数据搬移 → DataSync/MGN；「计划/跟踪/进度」归 Hub，「动手搬」归执行类服务。","s":"源#576"},{"id":"D2-580","d":2,"t":"single","q":"哪些 AWS 服务或功能使用户能够以编程方式配置 AWS 基础设施？","o":[{"l":"A","t":"AWS 云开发工具包（AWS CDK）"},{"l":"B","t":"Amazon CodeGuru"},{"l":"C","t":"AWS 配置"},{"l":"D","t":"AWS CodeCommit"}],"a":["A"],"e":"**✅ 为什么 A. AWS 云开发工具包（AWS CDK） 对**：CDK 用 TypeScript/Python 等编程语言定义云资源，通过合成 CloudFormation 模板以编程方式预置基础设施，正对应「编程方式配置基础设施」。\n\n**❌ 为什么其他选项错**：\n- B. Amazon CodeGuru：代码审查与性能剖析，面向应用代码质量\n- C. AWS 配置：即 AWS Config（机翻名），记录资源配置而非编程创建资源\n- D. AWS CodeCommit：托管 Git 仓库（现已对新客户停服），与基础设施配置无关\n\n**📌 关键概念**：用编程语言建模基础设施 → CDK（代码抽象+合成 CFN 模板）；声明式模板 → CloudFormation；记录配置变更 → Config；CDK 与 CFN 是「写法」不同、产物同类，CodeGuru/CodeCommit 属应用开发工具链。","s":"源#580"},{"id":"D2-582","d":2,"t":"multiple","q":"以下哪些操作是由 AWS Identity and Access Management（IAM）控制的？（选择两项）","o":[{"l":"A","t":"控制对 AWS 服务 API 和其他特定资源的访问"},{"l":"B","t":"为应用程序提供针对常见网络攻击的防火墙保护。"},{"l":"C","t":"使用多因素身份验证（MFA）保护 AWS 环境。"},{"l":"D","t":"授予用户访问 AWS 数据中心的权限。"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A. 控制对 AWS 服务 API 和其他特定资源的访问：IAM 通过策略精确控制谁能调用哪些 API/资源\n- C. 使用多因素身份验证（MFA）保护 AWS 环境：MFA 是 IAM 提供的身份验证强化能力\n\n**❌ 为什么其他选项错**：\n- B. 为应用程序提供针对常见网络攻击的防火墙保护：防火墙属 WAF/Shield 职责，非 IAM\n- D. 授予用户访问 AWS 数据中心的权限：物理访问永远不开放给客户\n\n**📌 关键概念**：IAM 管两件事=认证（谁能进来，含 MFA）+授权（能干什么，策略控制 API）；网络攻击防护与物理访问均不在 IAM 边界内，「数据中心物理访问」类选项可直接判错。","s":"源#582"},{"id":"D2-584","d":2,"t":"single","q":"一家公司正在使用 AWS Identity and Access Management（IAM）。 谁可以管理AWS 账户根用户的访问密钥？","o":[{"l":"A","t":"同一账户中已被授予权限的 IAM 用户"},{"l":"B","t":"任何账户中已被授予权限的 IAM 角色"},{"l":"C","t":"已被授予权限的 IAM 用户和角色"},{"l":"D","t":"AWS 账户所有者"}],"a":["D"],"e":"**✅ 为什么 D. AWS 账户所有者 对**：根用户（账户所有者）的访问密钥只能由根用户本人管理——根凭据不可委托给任何 IAM 用户或角色，这是安全边界的基本设定。\n\n**❌ 为什么其他选项错**：\n- A. 同一账户中被授权的 IAM 用户：无权管理根用户密钥\n- B. 任何账户中被授权的 IAM 角色：同样无权\n- C. 被授权的 IAM 用户和角色：IAM 身份只能管理自己或被授权对象的凭据，够不到根\n\n**📌 关键概念**：根用户凭据（密码/MFA/访问密钥）只能根用户本人管理，任何 IAM 权限都无法代理；最佳实践是不给根创建访问密钥、日常用 IAM 身份操作；「谁能管根」类题答案永远是账户所有者（根）。","s":"源#584"},{"id":"D2-585","d":2,"t":"single","q":"在 AWS 账户和资源的安全与合规方面，哪一方与 AWS 共同承担责任？","o":[{"l":"A","t":"第三方供应商"},{"l":"B","t":"客户"},{"l":"C","t":"经销商合作伙伴"},{"l":"D","t":"互联网提供商"}],"a":["B"],"e":"**✅ 为什么 B. 客户 对**：共享责任模型是 AWS 与客户双方的责任划分：AWS 负责「云的安全性」，客户（与 AWS 共同）承担「云中的安全性」——数据、应用、身份与配置，第三方不参与该模型。\n\n**❌ 为什么其他选项错**：\n- A. 第三方供应商：不在共享责任模型的责任主体内\n- C. 经销商合作伙伴：渠道角色，不承担客户侧安全责任\n- D. 互联网提供商：网络接入商，与云安全责任无关\n\n**📌 关键概念**：共享责任模型的责任双方=AWS+客户，别无其他主体；模型之外的参与者（供应商/经销商）不改变责任划分；「共同承担责任」在官方表述中即指客户侧与 AWS 分工协作。","s":"源#585"},{"id":"D2-589","d":2,"t":"single","q":"一家公司的云环境包括 Amazon EC2 实例和 Application Load Balancers。该公司希望改善其云资源对DDoS 攻击的保护。该公司还希望对任何 DDoS 攻击具有实时可见性。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Shield Standard"},{"l":"B","t":"AWS Firewall Manager"},{"l":"C","t":"AWS Shield Advanced"},{"l":"D","t":"Amazon GuardDuty"}],"a":["C"],"e":"**✅ 为什么 C. AWS Shield Advanced 对**：Shield Advanced 提供 L3/L4 与 L7 的增强 DDoS 防护、攻击近实时可见性指标，并附带 DDoS 响应团队（DRT）与成本保护，同时满足题干「改善防护+实时可见性」两项要求。\n\n**❌ 为什么其他选项错**：\n- A. AWS Shield Standard：免费自动启用，但无实时可见性与高级响应能力\n- B. AWS Firewall Manager：跨账户统一管理防火墙规则的管理面工具，不做 DDoS 缓解\n- D. Amazon GuardDuty：威胁检测服务，发现问题只告警不拦截攻击流量\n\n**📌 关键概念**：DDoS 防护两档=Standard（免费基础自动启用）/Advanced（付费：覆盖 ALB/CloudFront/Route 53 等入口、实时攻击指标、DRT 响应团队、费用报销保护）；「实时可见性/成本保护/DRT」是 Advanced 的三件专属题眼，与 ELB/EC2 组合场景搭配时优先 Advanced。","s":"源#589"},{"id":"D2-591","d":2,"t":"single","q":"哪项 AWS 服务使用户能够在 AWS 区域之间创建资源的副本？","o":[{"l":"A","t":"Amazon ElastiCache"},{"l":"B","t":"AWS CloudFormation"},{"l":"C","t":"AWS CloudTrail"},{"l":"D","t":"AWS Systems Manager"}],"a":["B"],"e":"**✅ 为什么 B. AWS CloudFormation 对**：CloudFormation StackSets 支持跨区域（和跨账户）用同一模板批量创建一致的资源副本，实现「区域之间创建资源副本」的标准化复制部署。\n\n**❌ 为什么其他选项错**：\n- A. Amazon ElastiCache：内存缓存服务，与跨区域复制基础设施无关\n- C. AWS CloudTrail：API 审计日志，不复制资源\n- D. AWS Systems Manager：运维管理套件（补丁/会话等）\n\n**📌 关键概念**：跨区域/跨账户批量部署同一套资源 → CloudFormation StackSets；单区域建栈 → 普通 CFN 栈；数据级跨区域复制（S3 复制/DynamoDB 全局表）是另一类考点，注意区分「资源副本」与「数据副本」。","s":"源#591"},{"id":"D2-595","d":2,"t":"single","q":"一家公司希望管理其第三方软件即服务（SaaS）应用程序的访问和权限。该公司希望使用一个门户，使最终用户可以访问分配的 AWS 账户和 AWS 云应用程序。 该公司应该使用哪项 AWS 服务来满足这些要求？","o":[{"l":"A","t":"Amazon Cognito"},{"l":"B","t":"AWS IAM Identity Center（AWS 单点登录）"},{"l":"C","t":"AWS Identity and Access Management（IAM）"},{"l":"D","t":"AWS Directory Service for Microsoft Active Directory"}],"a":["B"],"e":"**✅ 为什么 B. AWS IAM Identity Center（AWS 单点登录） 对**：IAM Identity Center 提供云访问门户，员工一次登录即可访问被分配的 AWS 账户与云应用（含第三方 SaaS），并集中管理其权限，与题干逐项对应。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Cognito：面向应用终端用户的注册登录，非企业员工门户\n- C. AWS Identity and Access Management（IAM）：账户内权限管理，本身不提供面向最终用户的统一门户\n- D. AWS Directory Service for Microsoft AD：托管 AD 目录基础设施，是身份源而非访问门户\n\n**📌 关键概念**：员工访问门户+多账户/多应用（含 SaaS）SSO → IAM Identity Center；终端用户认证 → Cognito；AD 目录是「身份数据源」，门户与策略仍需身份中心；「门户/最终用户访问分配的应用」是身份中心题眼。","s":"源#595"},{"id":"D2-603","d":2,"t":"single","q":"Amazon GuardDuty 的主要用例是什么？","o":[{"l":"A","t":"预防 DDoS 攻击"},{"l":"B","t":"防范 SQL 注入攻击"},{"l":"C","t":"自动监控对 AWS 工作负载的威胁"},{"l":"D","t":"自动配置 AWS 资源"}],"a":["C"],"e":"**✅ 为什么 C. 自动监控对 AWS 工作负载的威胁 对**：GuardDuty 的核心用例是持续、自动化的威胁监控——分析 CloudTrail/VPC 流日志/DNS 日志，发现账户与工作负载的恶意活动，无需人工部署传感器。\n\n**❌ 为什么其他选项错**：\n- A. 预防 DDoS 攻击：Shield 的职责\n- B. 防范 SQL 注入攻击：WAF 的职责\n- D. 自动配置 AWS 资源：属 IaC/自动化工具（CloudFormation/SSM）职责\n\n**📌 关键概念**：GuardDuty 定位=「自动+持续+威胁监控」（智能威胁检测）；防（Shield/WAF）与侦（GuardDuty）分属不同能力；「主要用例」类题要求选服务的第一定位，勿选边缘交集功能。","s":"源#603"},{"id":"D2-605","d":2,"t":"single","q":"开发人员需要使用 AWS CLI 与 AWS 进行交互。 开发人员的账户中必须配置哪个安全功能或AWS服务才能满足此要求？","o":[{"l":"A","t":"用户名和密码"},{"l":"B","t":"AWS Systems Manager"},{"l":"C","t":"根密码访问"},{"l":"D","t":"AWS 访问密钥"}],"a":["D"],"e":"**✅ 为什么 D. AWS 访问密钥 对**：CLI 属程序化访问通道，必须为开发者配置访问密钥 ID+秘密访问密钥（或临时凭据）才能完成签名调用，用户名密码是控制台凭据，不能用于 CLI。\n\n**❌ 为什么其他选项错**：\n- A. 用户名和密码：控制台登录凭据，CLI 不识别\n- B. AWS Systems Manager：运维管理服务，不是凭据\n- C. 根密码访问：根密码仅用于控制台登录根账户，且不应日常使用\n\n**📌 关键概念**：访问通道与凭据类型必须匹配：控制台→密码+MFA，CLI/SDK→访问密钥（或 AssumeRole 临时凭据）；「CLI 交互」类题的答案永远是访问密钥体系，根凭据与密码可直接排除。","s":"源#605"},{"id":"D2-606","d":2,"t":"single","q":"一家食品配送公司需要阻止某些国家的用户访问其网站。 该公司应该使用哪项AWS 服务来满足此要求？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"AWS Control Tower"},{"l":"C","t":"Amazon Fraud Detector"},{"l":"D","t":"Amazon Pinpoint"}],"a":["A"],"e":"**✅ 为什么 A. AWS WAF 对**：WAF 的地理位置规则可按源 IP 所属国家阻断请求，实现「阻止某些国家用户访问网站」的访问控制。\n\n**❌ 为什么其他选项错**：\n- B. AWS Control Tower：多账户环境治理，不做流量地理封禁\n- C. Amazon Fraud Detector：机器学习识别欺诈交易风险，非地理访问控制\n- D. Amazon Pinpoint：营销消息推送服务，与访问拦截无关\n\n**📌 关键概念**：按国家/地理封禁 Web 访问 → WAF 地理匹配规则（geo match）；欺诈检测 → Fraud Detector；营销触达 → Pinpoint；「某些国家」是 WAF geo 规则的标志性题眼，与 DDoS/内容过滤题共用 WAF 但规则类型不同。","s":"源#606"},{"id":"D2-609","d":2,"t":"single","q":"在使用 AWS Lambda 时，根据 AWS 共享责任模型，客户的责任是什么？","o":[{"l":"A","t":"维护底层 Lambda 硬件。"},{"l":"B","t":"维护 Lambda 网络基础设施。"},{"l":"C","t":"Lambda 函数中运行的代码和库。"},{"l":"D","t":"Lambda 服务器软件。"}],"a":["C"],"e":"**✅ 为什么 C. Lambda 函数中运行的代码和库 对**：Lambda 属 FaaS，客户只需负责函数代码及其依赖库；运行时、OS、底层硬件与网络全由 AWS 托管。\n\n**❌ 为什么其他选项错**：\n- A. 维护底层 Lambda 硬件：AWS 责任，客户不可见\n- B. 维护 Lambda 网络基础设施：AWS 责任，随服务自动扩展\n- D. Lambda 服务器软件：运行时与系统层均由 AWS 管理与打补丁\n\n**📌 关键概念**：Lambda 客户责任=代码+依赖库+IAM 执行角色+配置（内存/超时/环境变量）；「硬件/网络/服务器软件」在 FaaS 场景全部下沉给 AWS；与 EC2（客户管 OS）相比，责任边界随服务托管程度移动。","s":"源#609"},{"id":"D2-610","d":2,"t":"multiple","q":"根据 AWS 共享责任模型，哪些任务是 AWS 的责任？（选择两项）","o":[{"l":"A","t":"配置 AWS Identity and Access Management（IAM）。"},{"l":"B","t":"在 Amazon EC2 实例上配置安全组。"},{"l":"C","t":"保护 AWS 物理设施的访问安全。"},{"l":"D","t":"修补在 Amazon EC2 实例上运行的应用程序。"},{"l":"E","t":"执行基础设施补丁和维护。"}],"a":["C","E"],"e":"**✅ 为什么 C、E 对**：\n- C. 保护 AWS 物理设施的访问安全：数据中心物理安全由 AWS 承担\n- E. 执行基础设施补丁和维护：底层设施的补丁维护由 AWS 执行\n\n**❌ 为什么其他选项错**：\n- A. 配置 AWS Identity and Access Management（IAM）：客户侧身份权限治理\n- B. 在 Amazon EC2 实例上配置安全组：客户网络配置责任\n- D. 修补在 Amazon EC2 实例上运行的应用程序：客户应用层责任\n\n**📌 关键概念**：AWS 侧=物理设施+基础设施补丁维护；客户侧=IAM 配置+安全组+应用补丁；此题为共享责任「选 AWS 侧」的标准镜像题，与选客户侧的 D2-627 形成对照组。","s":"源#610"},{"id":"D2-611","d":2,"t":"single","q":"公司的合规官员想要审查 AWS 服务组织控制（S0C）报告。 合规官员应该使用哪项AWS 服务或功能来完成此任务？","o":[{"l":"A","t":"AWS Artifact"},{"l":"B","t":"AWS Concierge Support"},{"l":"C","t":"AWS Support"},{"l":"D","t":"AWS Trusted Advisor"}],"a":["A"],"e":"**✅ 为什么 A. AWS Artifact 对**：SOC 报告（SOC 1/2/3）由独立审计师出具并集中存放于 Artifact，合规官员可在门户自助下载审查，是获取审计报告的唯一标准渠道。\n\n**❌ 为什么其他选项错**：\n- B. AWS Concierge Support：企业支持计划里的账务与账户管理支持团队，不提供审计报告\n- C. AWS Support：技术支持服务，不是合规报告库\n- D. AWS Trusted Advisor：优化建议工具，不出具 SOC 审计报告\n\n**📌 关键概念**：SOC/PCI/ISO 审计报告 → Artifact（自助下载，部分需签 NDA）；Concierge Support 服务对象是「账单与账户管理」；「审查报告」类题几乎固定选 Artifact，支持类选项是干扰项。","s":"源#611"},{"id":"D2-612","d":2,"t":"single","q":"一家公司有合规要求，需要记录和评估配置更改，并对 AWS 资源执行补救措施。该公司应该使用哪项 AWS 服务？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"AWS Secrets Manager"},{"l":"C","t":"AWS CloudTrail"},{"l":"D","t":"AWS Trusted Advisor"}],"a":["A"],"e":"**✅ 为什么 A. AWS Config 对**：Config 持续记录资源配置与变更历史，可用 Config 规则评估合规性并触发自动补救（SSM Automation），「记录+评估+补救」三件事正好对应题干。\n\n**❌ 为什么其他选项错**：\n- B. AWS Secrets Manager：机密保管与轮换，不涉及配置审计\n- C. AWS CloudTrail：记录 API 调用操作日志，不评估配置合规、不执行补救\n- D. AWS Trusted Advisor：给出优化建议，不做合规规则评估与自动补救\n\n**📌 关键概念**：配置变更记录+合规评估+自动补救 → Config（规则+SSM Automation 联动）；只查「谁做了什么」→ CloudTrail；只看建议 → Trusted Advisor；「评估+补救」组合词是 Config 的独有题眼。","s":"源#612"},{"id":"D2-617","d":2,"t":"single","q":"一家公司需要使用仪表板和图表来分析业务数据的洞察。 哪项 AWS 服务将为这些洞察提供仪表板和图表？","o":[{"l":"A","t":"Amazon Macie"},{"l":"B","t":"Amazon Aurora"},{"l":"C","t":"Amazon QuickSight"},{"l":"D","t":"AWS CloudTrail"}],"a":["C"],"e":"**✅ 为什么 C. Amazon QuickSight 对**：QuickSight 是云原生 BI 服务，提供交互式仪表板、图表与 ML 洞察，用于业务数据分析可视化，与题干逐字对应。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Macie：S3 敏感数据发现保护，面向数据分类而非分析\n- B. Amazon Aurora：托管关系数据库，负责存数据不负责可视化呈现\n- D. AWS CloudTrail：API 审计日志服务，记录操作不做分析\n\n**📌 关键概念**：业务数据仪表板/图表/洞察 → QuickSight（SPICE 内存引擎加速查询+ML Insights 自动找异常）；数据库托管 → Aurora；安全与审计服务均不做 BI 可视化；「仪表板+图表+业务洞察」三连词出现即选 QuickSight。","s":"源#617"},{"id":"D2-620","d":2,"t":"single","q":"哪项 AWS 服务用于临时提供联邦安全凭证以访问 AWS 资源？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"AWS Simple Token Service（AWS STS）"},{"l":"C","t":"AWS Secrets Manager"},{"l":"D","t":"AWS Certificate Manager"}],"a":["B"],"e":"**✅ 为什么 B. AWS Simple Token Service（AWS STS） 对**：STS 专门签发临时安全凭据（含访问密钥/会话令牌，可限制时长与权限），供联合身份用户临时访问 AWS 资源，与题干逐字对应。\n\n**❌ 为什么其他选项错**：\n- A. Amazon GuardDuty：威胁检测服务，不签发任何凭据\n- C. AWS Secrets Manager：长期保管机密并轮换，非临时凭据签发通道\n- D. AWS Certificate Manager：签发管理 TLS/SSL 证书，服务的是传输加密而非身份访问\n\n**📌 关键概念**：临时安全凭据 → STS（AssumeRole 等操作，默认 15 分钟~12 小时）；长期机密保管 → Secrets Manager；TLS 证书 → ACM；「临时+联合身份+访问凭据」三词锁定 STS，勿与证书类服务混淆。","s":"源#620"},{"id":"D2-627","d":2,"t":"multiple","q":"根据 AWS 共享责任模型，哪些任务是客户的责任？（选择两项）","o":[{"l":"A","t":"保护虚拟化层的安全。"},{"l":"B","t":"加密数据并维护数据完整性。"},{"l":"C","t":"修补 Amazon RDS 操作系统。"},{"l":"D","t":"维护身份和访问管理控制。"},{"l":"E","t":"保护可用区的安全。"}],"a":["B","D"],"e":"**✅ 为什么 B、D 对**：\n- B. 加密数据并维护数据完整性：客户数据的加密与完整性属客户责任「云中的安全性」\n- D. 维护身份和访问管理控制：IAM 用户/策略/权限由客户治理\n\n**❌ 为什么其他选项错**：\n- A. 保护虚拟化层的安全：虚拟化管理程序归 AWS\n- C. 修补 Amazon RDS 操作系统：RDS 托管实例的 OS 补丁由 AWS 负责\n- E. 保护可用区的安全：AZ 的物理与基础设施安全归 AWS\n\n**📌 关键概念**：客户侧=数据加密/完整性+IAM 控制+客户 OS+应用；AWS 侧=虚拟化层+托管服务 OS+可用区物理安全；「RDS 补丁」是易错点——托管数据库的系统补丁属 AWS 而非客户。","s":"源#627"},{"id":"D2-628","d":2,"t":"multiple","q":"一家在线零售公司希望将其本地工作负载迁移到 AWS。该公司需要以成本效益的方式自动处理季节性工作负载增加。 哪些 AWS 云功能将帮助该公司满足此要求？（选择两项）","o":[{"l":"A","t":"跨区域工作负载部署"},{"l":"B","t":"按需付费定价"},{"l":"C","t":"内置的 AWS CloudTrail 审计功能"},{"l":"D","t":"自动扩展策略"},{"l":"E","t":"集中式日志记录"}],"a":["B","D"],"e":"**✅ 为什么 B、D 对**：\n- B. 按需付费定价：只为实际使用的资源付费，季节性低峰不产生闲置成本\n- D. 自动扩展策略：按负载自动增减容量，季节性高峰自动扩容、回落后自动缩容\n\n**❌ 为什么其他选项错**：\n- A. 跨区域工作负载部署：面向全球分发与容灾，与季节性伸缩无关\n- C. 内置的 AWS CloudTrail 审计功能：审计操作日志，不降本不扩容\n- E. 集中式日志记录：运维便利性能力，非弹性成本方案\n\n**📌 关键概念**：季节性负载+成本效益 → 「弹性伸缩+按需付费」组合拳；Auto Scaling 应对峰值、按需付费消除闲置期支出；审计/日志类选项与「成本效益」诉求无关，可快速排除。","s":"源#628"},{"id":"D2-629","d":2,"t":"single","q":"开发人员需要使用标准化模板为公司的 AWS 架构创建开发、测试和生产环境的副本。开发人员应该使用哪项 AWS 服务来满足此要求？","o":[{"l":"A","t":"AWS Cloud Map"},{"l":"B","t":"AWS CloudFormation"},{"l":"C","t":"Amazon Cloud Front"},{"l":"D","t":"AWS CloudTrail"}],"a":["B"],"e":"**✅ 为什么 B. AWS CloudFormation 对**：CloudFormation 用标准化模板定义环境，同一模板可在不同账户/项目重复部署出一致的开发、测试、生产环境副本，是「标准化模板+环境副本」的标准答案。\n\n**❌ 为什么其他选项错**：\n- A. AWS Cloud Map：服务发现与注册（给资源起可查找的名字），不做环境编排\n- C. Amazon CloudFront：内容分发网络，加速静态内容而非部署环境\n- D. AWS CloudTrail：API 审计日志，只记录操作不创建资源\n\n**📌 关键概念**：同一模板复制多套环境 → CloudFormation（参数化模板+栈集）；服务发现 → Cloud Map；Cloud Map 与 CloudFormation 是「Map 找资源、Formation 建资源」的关系，名称相近但功能完全不同。","s":"源#629"},{"id":"D2-631","d":2,"t":"single","q":"根据 AWS 共享责任模型，以下哪项是客户的责任？","o":[{"l":"A","t":"为 Amazon S3 基础设施设备应用安全补丁。"},{"l":"B","t":"为 AWS 数据中心提供物理安全。"},{"l":"C","t":"在 Lambda@Edge 上安装操作系统更新。"},{"l":"D","t":"为 IAM 用户账户实施多因素身份验证（MFA）。"}],"a":["D"],"e":"**✅ 为什么 D. 为 IAM 用户账户实施多因素身份验证（MFA） 对**：IAM 用户的 MFA 配置是客户侧身份安全治理的典型责任，其余三项均属 AWS 侧（S3 基础设施补丁、数据中心物理安全、Lambda@Edge 底层维护）。\n\n**❌ 为什么其他选项错**：\n- A. 为 Amazon S3 基础设施设备应用安全补丁：S3 底层设施归 AWS 维护\n- B. 为 AWS 数据中心提供物理安全：AWS 责任\n- C. 在 Lambda@Edge 上安装操作系统更新：Lambda 系运行时由 AWS 托管，无客户 OS 更新一说\n\n**📌 关键概念**：客户责任四象限=数据+IAM/MFA+客户 OS+网络配置；「基础设施补丁/物理安全/托管服务运行时」全部下沉 AWS；选项宾语是 AWS 资产本身时，直接判 AWS 责任。","s":"源#631"},{"id":"D2-633","d":2,"t":"single","q":"哪项 AWS 服务或工具为用户提供了一个图形界面，他们可以使用该界面来管理AWS 服务？","o":[{"l":"A","t":"AWS Copilot"},{"l":"B","t":"AWS CLI"},{"l":"C","t":"AWS Management Console"},{"l":"D","t":"AWS 软件开发工具包（SDKs）"}],"a":["C"],"e":"**✅ 为什么 C. AWS Management Console 对**：管理控制台是基于浏览器的图形界面（GUI），可点选式管理全部 AWS 服务，是「图形界面管理服务」的直接对应。\n\n**❌ 为什么其他选项错**：\n- A. AWS Copilot：容器应用部署的命令行工具，仍是敲命令不是图形界面\n- B. AWS CLI：命令行界面，适合脚本自动化，非图形化操作\n- D. AWS 软件开发工具包（SDKs）：面向编程语言的代码库，用于把 AWS 嵌入应用\n\n**📌 关键概念**：访问 AWS 三通道=Console（图形）/CLI（命令行）/SDK（编程）；「图形界面」题眼锁定 Console；Copilot 虽面向开发者较友好但仍是命令行工具，勿被名字带偏。","s":"源#633"},{"id":"D2-635","d":2,"t":"single","q":"一家公司已将其系统迁移到 AWS 云。系统已进行了适当的调整，安全审查未发现任何问题。该公司必须确保额外的开发、集成、更改和系统使用增长不会危及此优化的 AWS 基础设施。 该公司应该使用哪项AWS服务来报告持续的优化和安全？","o":[{"l":"A","t":"AWS Trusted Advisor"},{"l":"B","t":"AWS Health Dashboard"},{"l":"C","t":"Amazon Connect"},{"l":"D","t":"AWS Systems Manager"}],"a":["A"],"e":"**✅ 为什么 A. AWS Trusted Advisor 对**：Trusted Advisor 持续巡检账户，在成本、性能、安全、容错、服务限额五个维度给出优化建议与风险提示，可支撑「持续优化与安全」的运营要求。\n\n**❌ 为什么其他选项错**：\n- B. AWS Health Dashboard：展示 AWS 服务健康事件，不做账户优化巡检\n- C. Amazon Connect：云联络中心服务\n- D. AWS Systems Manager：运维操作套件（补丁/会话），不输出架构优化建议\n\n**📌 关键概念**：持续优化建议（含安全检查）→ Trusted Advisor（五类检查：成本/性能/安全/容错/限额）；资源运行健康 → Health Dashboard；运维执行 → SSM；「报告持续优化」的「建议」属性是判题锚点。","s":"源#635"},{"id":"D2-636","d":2,"t":"single","q":"哪项 AWS 服务与其他 AWS 服务集成，提供在静态时加密数据的能力？","o":[{"l":"A","t":"AWS Key Management Service（AWS KMS）"},{"l":"B","t":"AWS Certificate Manager（ACM）"},{"l":"C","t":"AWS Identity and Access Management（IAM）"},{"l":"D","t":"AWS Security Hub"}],"a":["A"],"e":"**✅ 为什么 A. AWS Key Management Service（AWS KMS） 对**：KMS 与 S3/RDS/EBS/DynamoDB 等大量服务原生集成，提供静态加密（encryption at rest）的密钥创建与管理能力，是「与 AWS 服务集成的静态加密」标准服务。\n\n**❌ 为什么其他选项错**：\n- B. AWS Certificate Manager（ACM）：管理 TLS/SSL 证书，服务传输中加密而非静态数据加密\n- C. AWS Identity and Access Management（IAM）：权限管理服务，本身不加密任何数据\n- D. AWS Security Hub：安全告警聚合面板，发现风险但不提供加密能力\n\n**📌 关键概念**：静态数据加密密钥 → KMS（与各服务集成，含信封加密）；传输加密证书 → ACM；静态（at rest）与传输（in transit）是加密题的第一分叉点，证书类服务只覆盖传输侧。","s":"源#636"},{"id":"D2-640","d":2,"t":"single","q":"一家公司拥有 AWS 商业支持计划。该公司需要访问 AWS DDoS 响应团队（DRT）来帮助缓解DDoS事件。 该公司必须使用哪项 AWS 服务或资源来满足这些要求？","o":[{"l":"A","t":"AWS Shield Standard"},{"l":"B","t":"AWS Enterprise Support"},{"l":"C","t":"AWS WAF"},{"l":"D","t":"AWS Shield Advanced"}],"a":["D"],"e":"**✅ 为什么 D. AWS Shield Advanced 对**：DDoS 响应团队（DRT）是 Shield Advanced 的专属权益——商业支持计划基础上开通 Shield Advanced 后即可获得 DRT 协助缓解攻击事件。\n\n**❌ 为什么其他选项错**：\n- A. AWS Shield Standard：免费版自动启用，不含 DRT 支持与实时指标\n- B. AWS Enterprise Support：企业支持提供 TAM 与事件管理，但不提供 DDoS 响应团队\n- C. AWS WAF：Web 流量过滤规则引擎，不提供人工响应团队\n\n**📌 关键概念**：DRT（DDoS Response Team）只随 Shield Advanced 提供（同期附带成本保护与实时可见性权益）；支持计划（商业/企业）提供的是 TAM 与事件管理，两者能力不可互替；题干出现 DDoS 响应团队（DRT）时唯一答案就是 Shield Advanced。","s":"源#640"},{"id":"D2-648","d":2,"t":"single","q":"根据 AWS 共享责任模型，以下哪项是客户的责任？","o":[{"l":"A","t":"为 Amazon S3 基础设施设备应用安全补丁。"},{"l":"B","t":"为 AWS 数据中心提供物理安全。"},{"l":"C","t":"在 Lambda@Edge 上安装操作系统更新。"},{"l":"D","t":"为 IAM 用户账户实施多因素身份验证（MFA）。"}],"a":["D"],"e":"**✅ 为什么 D. 为 IAM 用户账户实施多因素身份验证（MFA） 对**：与 D2-631 同题照录——IAM 用户 MFA 属客户身份安全治理；S3 基础设
