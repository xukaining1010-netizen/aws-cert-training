DP）\n\n对于大型企业客户（年消费达到一定规模），AWS 提供 EDP——签订多年合同承诺一定消费金额，获得基于总消费的全局折扣（折扣率因合同而异，需要联系 AWS 销售协商）。EDP 与 Savings Plans 可以叠加使用。CLF-C02 考试中 EDP 偶尔出现在\"大型企业如何进一步降低成本\"的选项中。（来源：aws-edp-enterprise-discount-program.md）\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n电商公司\"快买\"全年运行两类工作负载：核心交易系统全天候运行，流量可预测；数据分析任务不定期批量跑，中断了重提交即可。技术总监的定价策略组合：核心交易系统用 Compute Savings Plans（承诺每小时 $50，获得约 66% 折扣，未来换实例类型不影响折扣）；数据分析用 Spot Instances（省最多 90%，用 AWS Batch 管理中断和重试）；临时项目测试环境用 On-Demand（要几台开几台，不用了就关）。三种模型搭配使用，整体账单比全 On-Demand 显著降低。\n\n#### 常见误区与易错点\n\n- **误区一：Savings Plans 和 RI 是同一个东西**。错——两者的承诺对象不同：SP 承诺\"每小时花多少钱\"，RI 承诺\"预购多少台特定规格的机器\"。SP 更灵活，AWS 更推荐。\n- **误区二：Spot Instances 随时会被终止**。部分对——Spot 确实可能被回收，但 AWS 会提前 2 分钟发通知，你的应用可以利用这 2 分钟做优雅退出（保存进度、转移任务）。Spot 不适合不能中断的工作负载（如数据库主节点），但非常适合能容错的批处理。\n- **误区三：Free Tier 只有 12 个月**。错——Free Tier 有三种类型，其中 Always Free 永久有效。Lambda 的免费额度就是 Always Free，不会过期。\n\n#### 记忆要点\n\n- 三大计费驱动：计算按时间、存储按容量、流量按出站\n- On-Demand = 灵活无承诺；SP = 承诺使用量换折扣（推荐）；RI = 预购固定规格；Spot = 竞价闲置容量（可中断）\n- Compute SP 最灵活（66%）；EC2 Instance SP 折扣最大（72%）\n- Free Tier 三种：Always Free / 12 个月 / 试用\n- DTO 入站免费，每月前 100 GB 出站免费（全球汇总），AWS 到 CloudFront 传输免费，CloudFront 另有每月 1 TB 免费额度可叠加\n- Stop 实例停止计算费但 EBS 继续收费；Terminate 终止全部计费（含删除根卷）\n\n对于初创公司或刚上云的团队，建议的起步策略是：先用按需实例跑业务、观察实际用量模式，两到三个月后在 Cost Explorer 里看清楚使用曲线，再购买匹配度最高的 Savings Plans 锁定折扣。对于开发测试环境，优先使用 Spot 实例节省成本；对于稳定生产负载，用 Compute Savings Plans 兼顾灵活与折扣。","figures":[{"id":"f08","title":"EC2 四种定价模型对比","caption":"考点：折扣梯度 Spot(90%) > RI(75%) > SP(72%) > On-Demand(0)；Spot 是唯一有中断风险（2 分钟通知回收）的模型，适合容错批处理","html":"<svg viewBox=\"0 0 640 310\" style=\"width:100%;max-width:640px;display:block;margin:0 auto\">\n  <text x=\"30\" y=\"26\" font-size=\"13\" font-weight=\"700\" fill=\"#1e1b4b\">EC2 四种定价模型对比<\/text>\n  <rect x=\"15\" y=\"40\" width=\"148\" height=\"42\" rx=\"6\" fill=\"#7c3aed\"/>\n  <text x=\"89\" y=\"60\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">On-Demand<\/text>\n  <text x=\"89\" y=\"75\" font-size=\"9.5\" fill=\"#ede9fe\" text-anchor=\"middle\">按需（基准价）<\/text>\n  <rect x=\"168\" y=\"40\" width=\"148\" height=\"42\" rx=\"6\" fill=\"#6d28d9\"/>\n  <text x=\"242\" y=\"60\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Savings Plans<\/text>\n  <text x=\"242\" y=\"75\" font-size=\"9.5\" fill=\"#ede9fe\" text-anchor=\"middle\">承诺用量 · 最高省 72%<\/text>\n  <rect x=\"321\" y=\"40\" width=\"148\" height=\"42\" rx=\"6\" fill=\"#5b21b6\"/>\n  <text x=\"395\" y=\"60\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Reserved<\/text>\n  <text x=\"395\" y=\"75\" font-size=\"9.5\" fill=\"#ede9fe\" text-anchor=\"middle\">预购规格 · 最高省 75%<\/text>\n  <rect x=\"474\" y=\"40\" width=\"151\" height=\"42\" rx=\"6\" fill=\"#4c1d95\"/>\n  <text x=\"549\" y=\"60\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Spot<\/text>\n  <text x=\"549\" y=\"75\" font-size=\"9.5\" fill=\"#ede9fe\" text-anchor=\"middle\">闲置竞价 · 最高省 90%<\/text>\n  <rect x=\"15\" y=\"92\" width=\"148\" height=\"176\" rx=\"8\" fill=\"#f5f3ff\" stroke=\"#ddd6fe\"/>\n  <text x=\"89\" y=\"116\" font-size=\"10.5\" font-weight=\"700\" fill=\"#3730a3\" text-anchor=\"middle\">折扣：无（基准价）<\/text>\n  <text x=\"89\" y=\"140\" font-size=\"10.5\" fill=\"#1e1b4b\" text-anchor=\"middle\">承诺：无<\/text>\n  <text x=\"89\" y=\"164\" font-size=\"10.5\" fill=\"#1e1b4b\" text-anchor=\"middle\">中断：无<\/text>\n  <text x=\"89\" y=\"200\" font-size=\"10\" font-weight=\"700\" fill=\"#4338ca\" text-anchor=\"middle\">适合：短期/不可预<\/text>\n  <text x=\"89\" y=\"218\" font-size=\"10\" font-weight=\"700\" fill=\"#4338ca\" text-anchor=\"middle\">测负载、测试开发<\/text>\n  <text x=\"89\" y=\"248\" font-size=\"9.5\" fill=\"#6d28d9\" text-anchor=\"middle\">灵活性最高<\/text>\n  <rect x=\"168\" y=\"92\" width=\"148\" height=\"176\" rx=\"8\" fill=\"#f5f3ff\" stroke=\"#ddd6fe\"/>\n  <text x=\"242\" y=\"116\" font-size=\"10.5\" font-weight=\"700\" fill=\"#3730a3\" text-anchor=\"middle\">折扣：最高 72%<\/text>\n  <text x=\"242\" y=\"140\" font-size=\"10.5\" fill=\"#1e1b4b\" text-anchor=\"middle\">承诺：1 年或 3 年<\/text>\n  <text x=\"242\" y=\"164\" font-size=\"10.5\" fill=\"#1e1b4b\" text-anchor=\"middle\">中断：无<\/text>\n  <text x=\"242\" y=\"200\" font-size=\"10\" font-weight=\"700\" fill=\"#4338ca\" text-anchor=\"middle\">适合：长期稳定负载<\/text>\n  <text x=\"242\" y=\"218\" font-size=\"10\" font-weight=\"700\" fill=\"#4338ca\" text-anchor=\"middle\">且想保留灵活性<\/text>\n  <text x=\"242\" y=\"248\" font-size=\"9.5\" fill=\"#6d28d9\" text-anchor=\"middle\">按每小时用量承诺<\/text>\n  <rect x=\"321\" y=\"92\" width=\"148\" height=\"176\" rx=\"8\" fill=\"#f5f3ff\" stroke=\"#ddd6fe\"/>\n  <text x=\"395\" y=\"116\" font-size=\"10.5\" font-weight=\"700\" fill=\"#3730a3\" text-anchor=\"middle\">折扣：最高 75%<\/text>\n  <text x=\"395\" y=\"140\" font-size=\"10.5\" fill=\"#1e1b4b\" text-anchor=\"middle\">承诺：1 年或 3 年<\/text>\n  <text x=\"395\" y=\"164\" font-size=\"10.5\" fill=\"#1e1b4b\" text-anchor=\"middle\">中断：无<\/text>\n  <text x=\"395\" y=\"200\" font-size=\"10\" font-weight=\"700\" fill=\"#4338ca\" text-anchor=\"middle\">适合：长期稳定且规<\/text>\n  <text x=\"395\" y=\"218\" font-size=\"10\" font-weight=\"700\" fill=\"#4338ca\" text-anchor=\"middle\">格确定的负载<\/text>\n  <text x=\"395\" y=\"248\" font-size=\"9.5\" fill=\"#6d28d9\" text-anchor=\"middle\">绑定实例类型/区域<\/text>\n  <rect x=\"474\" y=\"92\" width=\"151\" height=\"176\" rx=\"8\" fill=\"#fdf2f8\" stroke=\"#fbcfe8\"/>\n  <text x=\"549\" y=\"116\" font-size=\"10.5\" font-weight=\"700\" fill=\"#9d174d\" text-anchor=\"middle\">折扣：最高 90%<\/text>\n  <text x=\"549\" y=\"140\" font-size=\"10.5\" fill=\"#1e1b4b\" text-anchor=\"middle\">承诺：无<\/text>\n  <text x=\"549\" y=\"164\" font-size=\"10.5\" font-weight=\"700\" fill=\"#b91c1c\" text-anchor=\"middle\">中断：有（2 分钟通知）<\/text>\n  <text x=\"549\" y=\"200\" font-size=\"10\" font-weight=\"700\" fill=\"#4338ca\" text-anchor=\"middle\">适合：容错批处理、<\/text>\n  <text x=\"549\" y=\"218\" font-size=\"10\" font-weight=\"700\" fill=\"#4338ca\" text-anchor=\"middle\">CI/CD、大数据分析<\/text>\n  <text x=\"549\" y=\"248\" font-size=\"9.5\" fill=\"#6d28d9\" text-anchor=\"middle\">唯一有中断风险<\/text>\n  <text x=\"30\" y=\"286\" font-size=\"10.5\" fill=\"#4338ca\">考试对比题：按需=灵活无折扣｜RI/SP=承诺换折扣（无中断）｜Spot=便宜但可被回收（先确认工作负载能容忍中断）<\/text>\n<\/svg>"}]},{"h":"账单、预算与成本管理资源","body":"> 本域对应官方考纲任务声明 4.2。\n\n#### 本节定位\n\n本节对应考纲任务声明 4.2，考试里常以工具选择题出现——给定一个成本管理需求，判断该用哪个工具。学完后你应该能回答：Cost Explorer、Budgets、Cost Anomaly Detection 各自做什么；合并计费（Consolidated Billing）有什么好处；Cost Allocation Tags 怎么帮你按团队/项目分账。\n\n#### AWS Billing and Cost Management 控制台\n\n这是 AWS 账单管理的总入口，提供以下核心功能模块：（来源：aws-billing-cost-management-savings-plans.md）\n\n- **Bills 页面**：查看每月详细账单和发票下载——这是权威的发票数据\n- **Payments**：查看待付/逾期余额和支付历史\n- **Credits**：查看积分余额\n- **Billing Preferences**：启用邮件账单、积分共享、折扣共享偏好\n- **Free Tier 监控**：追踪免费层服务的当前和预测使用量\n\n#### AWS Cost Explorer\n\nCost Explorer 是最核心的成本分析可视化工具——用图表展示你过去、当前和预测的 AWS 费用。（来源：aws-billing-cost-management-savings-plans.md）\n\n核心能力：\n- 按服务、账号、标签、区域等维度过滤和分组查看费用\n- 预测未来 12 个月的费用走势\n- 创建自定义报告并保存\n- 查看 Savings Plans 和 RI 的利用率和覆盖率\n- 在 Cost Explorer 中直接购买 Savings Plans\n\n重要提示：Cost Explorer 数据与 Bills 页面数据可能有差异——Cost Explorer 按 AWS 服务分组显示，可能包含不同的折扣/积分显示方式。以 Bills 页面为权威发票数据。（来源：aws-billing-cost-management-savings-plans.md）\n\n#### AWS Budgets\n\nAWS Budgets 让你设置预算上限并在接近或超过时自动告警。（来源：aws-budgets-billing-alerts.md）\n\n六种预算类型：\n\n| 预算类型 | 用途 |\n|---|---|\n| **费用预算（Cost）** | 为服务设费用上限，接近/超过时告警 |\n| **用量预算（Usage）** | 为服务设用量上限 |\n| **RI 利用率预算** | 利用率低于阈值时告警（识别闲置 RI） |\n| **RI 覆盖率预算** | 覆盖率低于阈值时告警 |\n| **SP 利用率预算** | Savings Plans 利用率低于阈值时告警 |\n| **SP 覆盖率预算** | Savings Plans 覆盖率低于阈值时告警 |\n\nBudgets 每天更新约 3 次（8-12 小时间隔），通知可发送到 SNS 主题和/或邮件。重要优势：Budgets 可以覆盖 AWS Marketplace 第三方产品的费用（Cost Anomaly Detection 不覆盖这块）。（来源：aws-budgets-billing-alerts.md）\n\n#### AWS Cost Anomaly Detection\n\n用机器学习自动检测异常消费模式并告警。每天运行约 3 次扫描净成本数据。从使用发生到检测到异常最多需要 24 小时延迟。新服务需要 10 天历史数据才能开始检测。（来源：aws-cost-anomaly-detection.md）\n\n重要限制：**不覆盖 AWS Marketplace 第三方产品**（包括 Amazon Bedrock 上的第三方模型如 Anthropic Claude）。这类费用需要改用 AWS Budgets 设置告警。（来源：aws-cost-anomaly-detection.md）\n\n考试诀窍：Budgets = 设定绝对金额阈值告警（主动管控）；Cost Anomaly Detection = ML 自动发现异常消费模式（被动检测）。两者互补，建议组合使用。\n\n#### 合并计费（Consolidated Billing）\n\n通过 AWS Organizations 合并多账号计费，完全免费。四大好处：（来源：aws-billing-cost-management-savings-plans.md）\n\n- **单一账单**：多账号统一出账，简化财务管理\n- **聚合用量折扣**：跨账号汇总用量，共享分层定价的更优价格段（如 S3/DTO 的分级折扣）\n- **RI/SP 共享**：一个账号购买的 Reserved Instances 或 Savings Plans 可以被组织内其他账号使用\n- **无额外费用**\n\n#### 成本组织工具\n\n- **Cost Allocation Tags（成本分配标签）**：给 AWS 资源打标签（如 team:marketing、project:alpha），然后在 Cost Explorer 中按标签维度查看费用分布。AWS 生成的标签（如 aws:createdBy）和用户自定义标签都可以用于成本分配。\n- **Cost Categories（成本类别）**：把费用按规则映射到团队/应用/环境等维度，在 Cost Explorer 中按类别查看。\n- **Cost Optimization Hub**：通过删除未使用资源、调整规格、购买 Savings Plans/RI 等建议识别节省机会。\n\n#### AWS 定价计算器\n\n两种定价计算器：\n- **AWS Pricing Calculator（公开网站版）**：用 On-Demand 价格创建成本估算，无需登录 AWS 账号\n- **Pricing Calculator（控制台内版）**：可以使用你的折扣和购买承诺来估算成本\n\n考试中\"估算未来 AWS 费用\"→ Pricing Calculator。\n\n\n#### Cost Explorer 深度使用场景\n\nCost Explorer 不只是看账单——它是成本优化的起点。几个关键使用场景：\n\n第一，**按服务查看费用分布**。进入 Cost Explorer 选择按\"Service\"分组，立刻看到哪个服务花钱最多。大多数新用户会发现 EC2 和数据传输费（DTO）占大头。\n\n第二，**预测未来费用**。Cost Explorer 基于过去的使用趋势自动预测未来 12 个月的费用，帮你提前规划预算。预测精度取决于历史数据的稳定性。\n\n第三，**查看 Savings Plans 推荐**。在 Cost Explorer 的 Savings Plans 栏目中，AWS 会根据你过去 7/30/60 天的使用模式推荐最优的承诺量，告诉你每月能省多少。可以直接在这里购买 Savings Plans。\n\n第四，**按标签维度分析**。如果你给资源打了成本分配标签（如 team:engineering 和 team:marketing），可以在 Cost Explorer 中按标签查看各团队的费用，精确到每天、每个服务。\n\n#### Budgets 的四种核心动作\n\nBudgets 不只是被动告警——它还可以触发自动操作：\n\n- **通知动作**：超过阈值时发邮件或 SNS 通知\n- **IAM 策略动作**：自动附加一条 IAM 策略，阻止新建资源（如\"当月 EC2 费用超过 $1,000 后禁止启动新实例\"）\n- **SCP 动作**：通过 Organizations SCP 限制整个账号的操作\n- **自动停止实例**：配合 Lambda 实现超预算时自动停止非关键实例\n\n实际使用中，建议至少设置两个预算：一个跟踪整个账号的月度费用（绝对金额告警），一个跟踪 Savings Plans/RI 的利用率（确保买了的折扣没浪费）。（来源：aws-budgets-billing-alerts.md）\n\n#### Cost Allocation Tags 与 Cost Categories 的区别\n\n两者都是\"按维度分账\"的工具，但层级不同：\n\n| 维度 | Cost Allocation Tags | Cost Categories |\n|---|---|---|\n| 作用位置 | 直接打在资源上 | 在 Billing 控制台定义规则 |\n| 粒度 | 资源级别 | 可以按规则聚合多标签 |\n| 创建方式 | 在资源上加标签，然后在 Billing 中激活 | 在 Cost Management 中定义映射规则 |\n| 典型用途 | 按项目/团队/环境标记单个资源 | 把多个标签规则组合成业务维度（如\"北方大区\"包含多个标签值） |\n\n考试中\"按团队查看费用\"→ Cost Allocation Tags；\"把费用映射到业务维度\"→ Cost Categories。\n\n\n#### AWS Data Exports\n\n从账单数据集创建自定义数据导出，可以将详细的成本和用量数据导出到 S3 桶，用自己的分析工具（如 Athena 查询或第三方 BI 工具）做深度分析。适合需要自定义报表或跨系统集成的企业。\n\n#### Free Tier 监控\n\n在 Billing 控制台中可以查看 Free Tier 服务的当前和预测使用量。建议新账号第一件事就是设置 Budgets 告警——哪怕只是一个零元预算（Zero Dollar Budget），超过免费额度时立刻收到邮件通知，避免意外扣费。很多初学者在 12 个月免费到期后忘记关闭实验用的 EC2 实例，导致意外产生费用。\n\n#### Organizations 合并计费深度理解\n\n合并计费最大的隐藏价值是**跨账号聚合用量**。举例：三个账号的 S3 出站流量分别是 8 TB、5 TB、7 TB，合计 20 TB。如果分开算，每个账号都在低价段；合并后 20 TB 可以更快达到 S3 DTO 分级定价的高用量段，获得更低单价。同理，一个账号买的 Savings Plans 如果自己用不完，多余的折扣可以自动被组织内其他账号使用。（来源：aws-billing-cost-management-savings-plans.md）\n\nOrganizations 合并计费的限制：管理账号负责支付所有成员账号的费用，成员账号看不到其他账号的费用细节。管理账号不应放业务工作负载（安全最佳实践）。\n\n\n#### Billing and Cost Management 的权限控制\n\n默认情况下，只有 AWS 账号根用户可以查看账单信息。如果需要让 IAM 用户查看账单，根用户必须在\"我的账户\"页面中启用\"IAM 用户和角色访问账单信息\"选项。之后通过 IAM 策略（如 Billing 只读策略）授权特定用户或角色访问。在 Organizations 环境中，管理账号可以通过 IAM 策略控制成员账号对 Budgets 的访问权限。Budgets 不支持跨账号使用——每个账号的预算只对有权限的用户可见。（来源：aws-budgets-billing-alerts.md）\n\n#### Cost Anomaly Detection 运行机制\n\nCost Anomaly Detection 使用机器学习分析历史消费模式（包括每周/每月的季节性变化和自然增长趋势），减少误报。它沿四个维度分析根因：AWS 服务、AWS 账号、区域和使用类型。你可以配置监控器只监控特定账号或成本分配标签，也可以监控整个组织。新服务订阅需要积累 10 天的历史使用数据后才能开始检测该服务的异常。（来源：aws-cost-anomaly-detection.md）\n\n#### Cost Optimization Hub\n\nCost Optimization Hub 是集中查看所有成本优化机会的入口（来源：aws-billing-cost-management-savings-plans.md）。它汇总以下几类建议：\n- 删除未使用的资源（闲置 EBS 卷、未附加的 Elastic IP）\n- 调整过大的实例规格（Right-sizing，如把 CPU 常年低于 10% 的 m5.4xlarge 降到 m5.xlarge）\n- 购买 Savings Plans 或 Reserved Instances 覆盖稳定负载\n- 使用 Spot Instances 替代按需运行的容错负载\n\n每条建议附带预估月度节省金额，方便按优先级执行。\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\nSaaS 公司\"云策\"有三个 AWS 账号（开发、测试、生产）都在同一个 Organization 下，通过合并计费共享 Savings Plans 折扣和 S3 分级定价。财务团队在每个账号的资源上打了 cost-center 标签，每月用 Cost Explorer 按标签查看各部门花费。运营团队设置了两层告警：Budgets 设月度费用预算（超过 80% 时邮件通知技术总监）+ Cost Anomaly Detection 监控异常飙升模式（自动发 SNS 到 Slack 频道）。\n\n#### 常见误区与易错点\n\n- **误区一：Cost Explorer 和 Bills 页面数据完全相同**。错——两者数据来源和展示方式不同，以 Bills 为权威发票数据。\n- **误区二：Cost Anomaly Detection 能监控所有 AWS 费用**。错——不覆盖 AWS Marketplace 第三方产品（含 Bedrock 第三方模型），这部分需要用 Budgets 告警。（来源：aws-cost-anomaly-detection.md）\n- **误区三：合并计费需要额外付费**。错——通过 Organizations 的合并计费功能完全免费。\n\n#### 记忆要点\n\n- Cost Explorer = 可视化分析成本（看趋势、做预测）\n- Budgets = 设预算阈值 + 告警（6 种预算类型，覆盖 Marketplace）\n- Cost Anomaly Detection = ML 自动发现异常消费（不覆盖 Marketplace）\n- 合并计费 = 聚合用量折扣 + RI/SP 共享 + 免费\n- Tags = 资源级标签分账；Categories = 规则化映射业务维度分账\n\n在实际运营中，建议把 Budgets 告警和 Cost Anomaly Detection 同时开启形成双保险——Budgets 管预算线，Anomaly Detection 管意外峰值，两者互补覆盖不同风险面。"},{"h":"AWS 技术资源与支持选项","body":"> 本域对应官方考纲任务声明 4.3–4.4。\n\n#### 本节定位\n\n本节对应考纲任务声明 4.3 和 4.4。考试里最常考的是 5 种支持计划的对比和 Trusted Advisor 的检查范围。学完后你应该能回答：各支持计划的响应时间和价格差异；Trusted Advisor 在不同支持计划下能检查什么；还有哪些自助技术资源可以使用。\n\n#### 五种 AWS 支持计划\n\nAWS 提供由低到高五种支持计划（注意：Developer、Business 和 Enterprise On-Ramp 将于 2027-01-01 停服，被 Business Support+ 替代）：（来源：aws-support-plans.md）\n\n| 维度 | Basic | Developer | Business | Enterprise On-Ramp | Enterprise |\n|---|---|---|---|---|---|\n| **月费** | 免费 | $29+ | $100+ | $5,500+ | $15,000+ |\n| **技术支持渠道** | 无（仅账单/账号） | 邮件（工作时间） | 24/7 电话/聊天/邮件 | 24/7 电话/聊天/邮件 | 24/7 电话/聊天/邮件 |\n| **严重故障响应** | — | 12 小时 | 1 小时 | 30 分钟 | 15 分钟 |\n| **Trusted Advisor** | 7 项核心检查 | 7 项核心检查 | 全部检查 | 全部检查 | 全部检查 |\n| **TAM（技术客户经理）** | 无 | 无 | 无 | 共享 TAM 池 | 指定 TAM |\n| **第三方软件支持** | 无 | 无 | 有 | 有 | 有 |\n| **Support API** | 无 | 无 | 有 | 有 | 有 |\n\n重要变化（2027-01-01 生效）：Developer/Business/Enterprise On-Ramp 三个计划将被统一替换为 **Business Support+**（$29/月/账号起，24/7 电话/Chat/邮件，业务关键 30 分钟响应，500+ 项 Trusted Advisor 检查）。Enterprise Support 最低费从 $15,000 降到 **$5,000/月**，新增 AWS Security Incident Response（无额外费用）。（来源：aws-support-plans.md）\n\n\n[[fig:f07]]\n\n#### AWS Trusted Advisor\n\nTrusted Advisor 是自动化的最佳实践检查工具，从五个类别检查你的 AWS 环境并给出建议：\n\n| 类别 | 检查什么 | 典型建议 |\n|---|---|---|\n| **成本优化** | 闲置资源、未使用的 RI/SP | 删除闲置 EBS 卷、降低未充分利用的实例规格 |\n| **性能** | 资源配置是否合理 | 调整实例类型、启用 CloudFront |\n| **安全** | 安全最佳实践 | 根用户未启用 MFA、S3 桶公开访问 |\n| **容错** | 高可用和备份 | 启用多 AZ、配置 EBS 快照 |\n| **服务限制** | 资源配额是否接近上限 | 申请提升 EC2 实例数量限制 |\n\nBasic 和 Developer 支持计划只能看 7 项核心安全检查（如根用户 MFA、S3 桶权限）。Business 及以上可看全部 500+ 项检查。（来源：aws-support-plans.md）\n\n#### 其他技术资源\n\n**AWS re:Post**：AWS 官方的技术问答社区（原 AWS Forums 的升级版），可以提问和搜索技术问题的解答。\n\n**AWS IQ**：连接 AWS 认证专家与客户的平台。你发布项目需求，AWS 认证专家竞标报价，你选择专家并支付费用，费用通过 AWS 账单结算。\n\n**AWS Knowledge Center**：AWS 整理的常见技术问题和解决方案集合，按服务分类，是自助排查问题的第一站。\n\n**AWS Partner Network（APN）**：AWS 合作伙伴生态系统。技术合作伙伴（提供产品和方案）和咨询合作伙伴（提供迁移和实施服务）。\n\n**AWS Marketplace**：在线软件商店，可以发现、购买、部署第三方软件（安全、网络、开发工具、机器学习模型等），费用统一出现在 AWS 账单中。\n\n**AWS Well-Architected Tool**：基于六大支柱的免费自助架构评估工具。回答一系列问题后获得改进建议和最佳实践指导。\n\n**AWS 培训与认证**：AWS 提供数字培训课程（在线免费）、课堂培训和认证考试。Cloud Practitioner 就是基础级认证，往上有 Associate、Professional 和 Specialty 级别。\n\n**AWS 文档与白皮书**：所有 AWS 服务的详细技术文档和架构白皮书，完全免费公开。Well-Architected Framework 白皮书是考试常引用的权威来源。\n\n\n#### 支持计划选型逻辑\n\n对初学者来说，最重要的是理解\"什么时候需要升级支持计划\"。核心判断标准是：你的工作负载对停机时间的容忍度有多低。\n\n**只是学习和实验** → Basic（免费）就够了。遇到问题看文档和 re:Post 社区。\n\n**有开发环境在跑，但不是生产系统** → Developer（$29/月）。可以通过邮件提交技术问题，工作时间内响应。\n\n**有生产系统在跑，停机会影响业务** → Business（$100/月起）。24/7 技术支持，关键系统故障 1 小时响应，解锁全部 Trusted Advisor 检查。\n\n**生产系统对业务至关重要，需要深度技术指导** → Enterprise（$15,000/月起，即将降到 $5,000）。指定 TAM 做架构回顾和优化建议，最严重故障 15 分钟响应。\n\n注意 2027 年变化：Developer 和 Business 将合并为 Business Support+（$29 起，保留 24/7 支持和 30 分钟关键响应），是性价比最高的选择。（来源：aws-support-plans.md）\n\n#### Trusted Advisor 深度理解\n\nTrusted Advisor 最容易在考试中以\"哪个工具检查 XX\"的形式出现。记住五个类别以及典型检查项：\n\n- **成本优化**：发现闲置的 EC2 实例（CPU 低于 10%）、未使用的 EBS 卷、过期的 Reserved Instances\n- **安全**：根用户是否启用 MFA、S3 桶是否公开访问、安全组是否开放了过多端口（0.0.0.0/0）\n- **容错**：EC2 是否跨多个可用区部署、RDS 是否启用 Multi-AZ、EBS 是否有近期快照\n- **性能**：实例类型是否匹配工作负载、是否使用了 CloudFront 加速内容分发\n- **服务限制**：当前使用量是否接近 AWS 服务配额（如 EC2 实例数量上限、VPC 数量上限）\n\nBasic 和 Developer 只能看到**7 项核心安全检查**（如根用户 MFA、S3 公开访问、安全组规则等），这些检查也可以通过 AWS Health 获取。Business 及以上计划解锁全部 500+ 项检查，并可以通过 Support API 自动化获取检查结果。（来源：aws-support-plans.md）\n\n#### re:Post、Knowledge Center 与 AWS IQ 的区别\n\n| 资源 | 是什么 | 适合谁 | 费用 |\n|---|---|---|---|\n| **AWS re:Post** | 技术问答社区（原 AWS Forums 升级版） | 所有用户自助搜索和提问 | 免费 |\n| **AWS Knowledge Center** | 官方常见问题与解答集合 | 快速查找已知问题的解决方案 | 免费 |\n| **AWS IQ** | 连接 AWS 认证专家的平台 | 需要一对一专家指导的客户 | 按项目付费（通过 AWS 账单结算） |\n| **AWS Partner Network** | 合作伙伴生态（技术+咨询） | 需要迁移实施或方案设计的企业 | 由合作伙伴报价 |\n\n#### AWS 定价计算器 vs Cost Explorer\n\n这两个工具名字相似但用途不同：\n\n| 维度 | AWS Pricing Calculator | Cost Explorer |\n|---|---|---|\n| 什么时候用 | **用之前估算**（还没花钱） | **用之后分析**（已经花了钱） |\n| 数据来源 | 公开定价或你的折扣 | 你的实际账单数据 |\n| 核心功能 | 根据服务/规格/用量估算月费 | 查看历史费用、预测趋势、优化建议 |\n\n考试中\"估算新项目的 AWS 费用\"→ Pricing Calculator；\"分析现有费用和趋势\"→ Cost Explorer。\n\n\n#### AWS Security Incident Response（Enterprise 专属）\n\nEnterprise 支持计划的新增重磅功能（无额外费用）：涵盖账号劫持、数据泄露、勒索软件攻击等安全事件的专业响应服务。AWS 安全专家团队协助调查和修复。这是之前只有极大型客户才能获得的服务，现在纳入 Enterprise 标准权益。（来源：aws-support-plans.md）\n\n#### AWS Countdown\n\nEnterprise 支持计划中的另一个独特权益：在关键业务活动期间（如大促、新产品发布、大型迁移），由 TAM 主导提供专项支持——包括提前架构审查、活动期间实时监控和快速响应。帮助确保业务关键时刻的平稳运行。（来源：aws-support-plans.md）\n\n#### AWS Health Dashboard 深度理解\n\nAWS Health Dashboard 分为两个视图：\n\n**Service Health Dashboard**（全局视图）：显示所有 AWS 区域和服务的实时运行状态。任何人都可以访问，不需要登录。当 AWS 某个区域的某项服务出现故障时，会在这里更新状态。\n\n**Personal Health Dashboard**（个人视图）：只显示**影响你账号下资源**的事件。比如你的 EC2 实例所在的物理主机计划维护，Personal Health 会提前通知你并给出迁移建议。通过 Amazon EventBridge 可以把 Personal Health 事件自动路由到 Lambda 或 SNS，实现自动化响应。\n\n考试中\"全局 AWS 服务状态\"→ Service Health Dashboard；\"影响我的特定事件\"→ Personal Health Dashboard。\n\n#### SLA 与 Service Credits\n\nAWS 为主要服务提供服务级别协议（SLA），承诺一定的可用性。如果实际可用性低于 SLA 承诺，客户可以申请 Service Credits（服务积分）作为补偿。（来源：aws-sla-service-credits.md）\n\n几个关键 SLA 数字：EC2 单实例 SLA 99.5%、EC2 Multi-AZ 99.99%；S3 Standard 99.9%；RDS Multi-AZ 99.95%。积分通常以月费的百分比计算，不是现金退款。考试中\"AWS 承诺的可用性\"→ SLA；\"低于承诺可用性的补偿\"→ Service Credits。\n\n\n#### AWS Unified Operations（统一运营计划）\n\n这是比 Enterprise 更高级的支持层级，面向需要深度运营指导的大型企业。包含应用架构指导（顾问式服务建议）、基础设施事件管理、指定 TAM 和领域专家工程师（DSE）、定期 Well-Architected 审查、个性化运维手册。考试中偶尔提及，知道\"比 Enterprise 更高端\"即可。（来源：aws-support-plans.md）\n\n#### AWS Marketplace 计费特点\n\n在 AWS Marketplace 购买的第三方软件（如安全扫描器、数据库、ML 模型订阅）的费用会出现在你的 AWS 账单中——统一支付，简化采购。但需要注意两点：（来源：aws-cost-anomaly-detection.md）\n\n第一，Marketplace 费用在 Cost Explorer 中以第三方供应商的法律实体名称显示（如\"Anthropic, PBC\"），不在 AWS 原生服务下。\n\n第二，AWS Cost Anomaly Detection 不监控 Marketplace 费用——如果你在 Bedrock 上大量调用 Claude 模型导致费用飙升，Cost Anomaly Detection 不会告警。必须用 AWS Budgets 对 Marketplace 费用单独设置预算告警。\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n初创公司\"新芽科技\"刚上 AWS，选了 Basic 支持计划（免费），遇到技术问题主要靠 AWS 文档和 re:Post 社区自助解决。随着业务增长上了生产环境，升级到 Business 支持计划——解锁了全部 Trusted Advisor 检查后，第一次全量扫描发现 3 个 S3 桶意外开了公开访问，立刻修复。两年后公司成为上市公司，合规要求严格，升级到 Enterprise 支持计划，获得了指定 TAM 和 15 分钟严重故障响应保障。TAM 每季度做一次架构回顾，帮团队持续优化成本和安全态势。\n\n#### 常见误区与易错点\n\n- **误区一：所有支持计划都有 Trusted Advisor 全部检查**。错——Basic 和 Developer 只有 7 项核心安全检查。全部检查需要 Business 及以上。\n- **误区二：TAM 从 Business 计划开始提供**。错——Business 计划没有 TAM。Enterprise On-Ramp 有共享 TAM 池，Enterprise 才有指定 TAM。\n- **误区三：AWS 技术支持是免费的**。部分对——Basic 的账单/账号支持和文档/社区是免费的，但技术问题的一对一支持需要付费计划。\n\n#### 记忆要点\n\n- Basic = 免费 + 7 项检查 + 无技术支持\n- Business = 24/7 支持 + 全部 Trusted Advisor + 1 小时响应\n- Enterprise = TAM + 15 分钟响应 + 安全事件响应\n- 2027 变化：Developer/Business/EOR → Business Support+（$29 起）；Enterprise 降到 $5,000 起\n- Trusted Advisor 五类：成本、性能、安全、容错、服务限制\n- re:Post = 社区问答（免费）；IQ = 连接认证专家（按项目付费）；Marketplace = 第三方软件商店（费用入 AWS 账单）\n\n选择支持计划的核心原则是按业务影响等级匹配：个人学习或概念验证用 Basic 就够；跑生产系统的企业至少需要 Business 级（获得全部 Trusted Advisor 检查和工程师级支持）；承载关键业务的大客户应选 Enterprise（获得 TAM 专属顾问和最快的 SLA 响应时间）。","figures":[{"id":"f07","title":"AWS 支持计划五级阶梯","caption":"考点：对比题核心=费用与严重故障响应时间（Basic 免费无渠道 → Enterprise $15,000+/月 15 分钟+指定 TAM）；注意 Developer/Business/EOR 2027-01-01 起由 Business Support+ 替代","html":"<svg viewBox=\"0 0 640 310\" style=\"width:100%;max-width:640px;display:block;margin:0 auto\">\n  <text x=\"30\" y=\"26\" font-size=\"13\" font-weight=\"700\" fill=\"#1e1b4b\">AWS 支持计划：阶梯越高，响应越快、支持越强<\/text>\n  <rect x=\"410\" y=\"46\" width=\"200\" height=\"32\" rx=\"6\" fill=\"#a78bfa\"/>\n  <text x=\"424\" y=\"66\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">Basic（免费）<\/text>\n  <text x=\"598\" y=\"66\" font-size=\"9.5\" fill=\"#fff\" text-anchor=\"end\">无技术渠道 · TA 7 项<\/text>\n  <rect x=\"310\" y=\"86\" width=\"300\" height=\"32\" rx=\"6\" fill=\"#8b5cf6\"/>\n  <text x=\"324\" y=\"106\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">Developer（$29+/月）<\/text>\n  <text x=\"598\" y=\"106\" font-size=\"9.5\" fill=\"#fff\" text-anchor=\"end\">邮件 12h · TA 7 项<\/text>\n  <rect x=\"210\" y=\"126\" width=\"400\" height=\"32\" rx=\"6\" fill=\"#7c3aed\"/>\n  <text x=\"224\" y=\"146\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">Business（$100+/月）<\/text>\n  <text x=\"598\" y=\"146\" font-size=\"9.5\" fill=\"#fff\" text-anchor=\"end\">24/7 电话 · 1h · TA 全量<\/text>\n  <rect x=\"110\" y=\"166\" width=\"500\" height=\"32\" rx=\"6\" fill=\"#6d28d9\"/>\n  <text x=\"124\" y=\"186\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">Enterprise On-Ramp（$5,500+/月）<\/text>\n  <text x=\"598\" y=\"186\" font-size=\"9.5\" fill=\"#fff\" text-anchor=\"end\">30 分钟 · 共享 TAM<\/text>\n  <rect x=\"10\" y=\"206\" width=\"600\" height=\"32\" rx=\"6\" fill=\"#4c1d95\"/>\n  <text x=\"24\" y=\"226\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">Enterprise（$15,000+/月）<\/text>\n  <text x=\"598\" y=\"226\" font-size=\"9.5\" fill=\"#fff\" text-anchor=\"end\">15 分钟 · 指定 TAM<\/text>\n  <text x=\"30\" y=\"262\" font-size=\"10.5\" font-weight=\"700\" fill=\"#b91c1c\">⚠️ 时效：Developer / Business / Enterprise On-Ramp 将于 2027-01-01 停服，由 Business Support+ 替代<\/text>\n  <text x=\"30\" y=\"286\" font-size=\"10.5\" fill=\"#4338ca\">记忆：TAM（技术客户经理）从 Enterprise On-Ramp 起才有；Trusted Advisor 全量检查从 Business 起<\/text>\n<\/svg>"}]}],"practice":[{"id":"Q128","d":4,"t":"multiple","q":"一家公司有一个稳定、可预测且不间断的计算工作负载。哪种 Amazon EC2 实例购买选项最具成本效益？（选择两个。）","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"预留实例"},{"l":"C","t":"竞价实例"},{"l":"D","t":"节省计划"},{"l":"E","t":"专用主机"}],"a":["B","D"],"e":"对于稳定、可预测且不间断的计算工作负载，最具成本效益的 Amazon EC2 实例购买选项通常是：B. 预留实例：预留实例与按需实例相比提供显著折扣，以换取一到三年的期限承诺。由于工作负载是稳定和可预测的，您可以预测您的使用情况，并相应地购买预留实例，随着时间的推移优化成本。D. 节省计划：与预留实例类似，节省计划提供显著折扣，以换取在一到三年的期限内承诺特定数量的计算使用量（以每小时美元计）。与预留实例相比，节省计划在更广泛的实例类型和地区提供灵活性。","s":""},{"id":"Q136","d":4,"t":"single","q":"哪种定价模型会在容量暂时不可用时中断运行中的 Amazon EC2 实例？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"标准预留实例"},{"l":"C","t":"竞价实例"},{"l":"D","t":"可转换预留实例"}],"a":["C"],"e":"竞价实例（选项 C）可能会被 AWS 中断，如果竞价价格超过您愿意支付的最高价格，或者如果 AWS 需要容量进行其他任务。这使它们适合灵活的、非关键的工作负载，这些工作负载可以被中断。","s":""},{"id":"Q213","d":4,"t":"single","q":"哪种 Amazon EC2 实例定价模型可以提供高达 90%的折扣？","o":[{"l":"A","t":"预留实例（Reserved Instances）"},{"l":"B","t":"按需实例（On-Demand）"},{"l":"C","t":"专用主机（Dedicated Hosts）"},{"l":"D","t":"竞价实例（Spot Instances）"}],"a":["D"],"e":"能提供高达 90%折扣的Amazon EC2 实例定价模式是：D. 竞价实例以下是关于Amazon EC2 竞价实例的一些要点：1. 竞价实例使您能够以相较于按需定价大幅折扣的价格，使用Amazon EC2 的闲置计算资源。2. 与按需实例价格相比，它们有可能节省高达 90%的成本。3. 竞价实例非常适合灵活且容错的工作负载，如批处理、大数据分析、容器化应用程序以及高性能计算（HPC）。4. 主要的权衡在于，当EC2 需要收回计算资源时，竞价实例可能会在提前两分钟收到通知的情况下被 AWS 中断。5. 与预留实例或节省计划不同，竞价实例无需任何前期承诺即可实现成本节约。6. 竞价实例的价格会根据 EC2 计算资源的供需情况波动。7. 平均而言，竞价实例被中断的时间不到 5%。需要注意的是，尽管竞价实例能节省大量成本，但由于存在可能被中断的情况，它们可能并不适用于所有工作负载。如需获取关于竞价实例定价和最佳实践的最新信息，请参考 AWS 官方文档。资料来源：[1] [Amazon EC2 竞价实例概述 - Amazon EC2 竞价实例概述](https://docs.aws.amazon.com/whitepapers/latest/cost-optimization-leveraging-ec2-spot-instances/cost-optimization-leveraging-ec2-spotinstances.html)[3] [选择最佳定价模式 - 成本优化支柱](https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/select-the-best- pricing-model.html)[6] [Amazon EC2 竞价实例 - 产品详情](https://aws.amazon.com/ec2/spot/pricing/)","s":""},{"id":"Q222","d":4,"t":"single","q":"一个客户运行了一个按需的 Amazon Linux EC2 实例 3 小时 5 分钟 6 秒。客户将被计费多长时间？","o":[{"l":"A","t":"3 小时 5 分钟"},{"l":"B","t":"3 小时 5 分钟 6 秒"},{"l":"C","t":"3 小时 6 分钟"},{"l":"D","t":"4 小时"}],"a":["B"],"e":"正确答案是：B. 3 小时 5 分 6 秒原因如下：1. 运行Amazon Linux 系统的Amazon EC2 实例按秒计费，最低计费时长为60 秒。2. 这意味着对于按需使用的Amazon Linux EC2 实例，您将按实例实际运行的精确时间计费，精确到秒。3. 在这种情况下，客户的实例恰好运行了3 小时5分 6 秒，因此他们将按此确切时长计费。4. 对于Amazon Linux EC2 实例，不会向上取整到最接近的分钟或小时。需要注意的是，计费方式可能因具体的实例类型、操作系统和定价模式而有所不同。如需获取关于 EC2 定价和计费的最新详细信息，建议查阅 AWS EC2 官方定价文档。另外，请记住，虽然按秒计费有助于更精确地管理成本，但始终应监控使用情况并实施成本优化策略，例如针对可预测的工作负载使用预留实例或节省计划，针对灵活且容错的应用程序使用竞价实例。资料来源：[1] [特定时间段内 EC2 实例的计费问题 | AWSre:Post](https://repost.aws/questions/QUSJTvpxadRM-W6PudmmPWfQ/billing-on-ec2-instance-for-a-particular-time)[3] [非持久桌面和应用程序- Amazon AppStream 2.0 定价 - AWS](https://aws.amazon.com/appstream2/pricing/)[6] [关键原则 - AWS 定价机制](https://docs.aws.amazon.com/whitepapers/latest/how-aws-pricing-works/key-principles.html)","s":""},{"id":"Q265","d":4,"t":"single","q":"AWS 企业支持礼宾团队如何帮助用户？","o":[{"l":"A","t":"支持应用开发"},{"l":"B","t":"提供架构指导"},{"l":"C","t":"回答计费和账户查询"},{"l":"D","t":"回答有关技术支持案例的问题"}],"a":["C"],"e":"AWS 企业支持礼宾团队为企业客户提供个性化支持，专注于帮助解决计费和账户相关查询，确保顺利的 AWS 体验。","s":""},{"id":"Q532","d":4,"t":"single","q":"AWS 定价计算器可以做什么？","o":[{"l":"A","t":"预测 AWS 每月成本。"},{"l":"B","t":"计算历史 AWS 成本。"},{"l":"C","t":"提供有关 AWS 定价策略的深入信息。"},{"l":"D","t":"为用户提供他们的月度账单访问权限。"}],"a":["A"],"e":"AWS 定价计算器可用于估计和预测与 AWS 服务相关的每月成本。它帮助用户规划他们的 AWS 预算，并了解其架构的成本结构。","s":""},{"id":"Q553","d":4,"t":"single","q":"一家公司使用多个 AWS 账户用于不同的业务团队。财务团队希望收到公司所有账户的一张账单。财务团队应该使用哪个 AWS 服务或工具来满足此要求？","o":[{"l":"A","t":"AWS Organizations"},{"l":"B","t":"AWS Trusted Advisor"},{"l":"C","t":"Cost Explorer"},{"l":"D","t":"AWS Budgets"}],"a":["A"],"e":"AWS Organizations 是一项服务，可让您将多个 AWS 账户合并到一个组织中。它允许对账户进行集中控制，包括为所有账户创建一张账单，这对于需要综合账单视图的财务团队非常理想。","s":""},{"id":"Q570","d":4,"t":"single","q":"一家公司想要在迁移前估计其 AWS 架构解决方案的成本。哪个 AWS 服务或功能将满足此要求？","o":[{"l":"A","t":"Amazon Detective"},{"l":"B","t":"AWS Budgets"},{"l":"C","t":"AWS Resource Explorer"},{"l":"D","t":"AWS 定价计算器"}],"a":["D"],"e":"AWS 定价计算器是一个工具，使用户能够在迁移前估计和计划他们的 AWS 成本。它允许公司输入他们的预期使用情况，并提供相关成本的估计。","s":""},{"id":"Q602","d":4,"t":"single","q":"一家公司在 AWS 云中运行其生产工作负载。该公司需要选择一项 AWS 支持计划。哪项AWS 支持计划将以最低成本满足这些要求？","o":[{"l":"A","t":"开发者"},{"l":"B","t":"企业入门版"},{"l":"C","t":"企业版"},{"l":"D","t":"业务版"}],"a":["D"],"e":"业务支持计划专为在 AWS 云中运行生产工作负载的公司设计，与企业计划相比，它以相对较低的成本提供基本支持。而开发人员支持计划适合测试和实验，但可能无法提供生产工作负载所需的支持级别。","s":""},{"id":"Q634","d":4,"t":"single","q":"一家公司有一个将连续运行 1 年的工作负载。该工作负载不能容忍服务中断。哪种Amazon EC2 购买选项将是最具成本效益的？","o":[{"l":"A","t":"所有预付预留实例"},{"l":"B","t":"部分预付预留实例"},{"l":"C","t":"专用实例"},{"l":"D","t":"按需实例"}],"a":["A"],"e":"对于将连续运行 1 年且不能容忍服务中断的工作负载，所有预付预留实例提供了最具成本效益的选项。通过使用所有预付预留实例，公司可以预先支付实例的全部费用，并与按需实例相比获得显著的折扣。此选项提供了成本节约，并确保实例在工作负载的持续时间内可用。","s":""}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 4.1.1 | 四种定价模型对比（折扣/承诺/中断风险） | ⭐⭐⭐ 高 | 对比/场景题 |\n| 4.1.2 | Savings Plans vs Reserved Instances | ⭐⭐ 中 | 对比题 |\n| 4.1.3 | Free Tier 三种类型与 DTO 免费规则 | ⭐⭐ 中 | 概念题 |\n| 4.2.1 | Cost Explorer / Budgets / Anomaly Detection 区分 | ⭐⭐⭐ 高 | 工具选择题 |\n| 4.2.2 | 合并计费与成本分摊标签 | ⭐ 低 | 概念题 |\n| 4.3.1 | 五种支持计划对比（费用/响应时间/TAM） | ⭐⭐⭐ 高 | 对比题 |\n| 4.3.2 | Trusted Advisor 检查范围（7 项 vs 全量） | ⭐⭐ 中 | 概念题 |\n| 4.3.3 | 支持计划 2027 变更（Business Support+） | ⭐ 低 | 时效题 |","services":"| 服务/工具 | 主要用途 | 涉及 Task |\n|---|---|---|\n| AWS Cost Explorer | 成本可视化分析与预测 | 4.2 |\n| AWS Budgets | 预算设置与用量告警 | 4.2 |\n| AWS Cost Anomaly Detection | 成本异常检测 | 4.2 |\n| AWS Trusted Advisor | 五类最佳实践自动检查 | 4.3 |\n| AWS 支持计划（Basic~Enterprise 5 级） | 技术支持与响应 | 4.3 |\n| AWS 定价计算器 | 部署前成本估算 | 4.1 |"}}]};

<script>
(function(){
'use strict';
const DATA = (typeof LEARNING_DATA !== 'undefined' && LEARNING_DATA) ? LEARNING_DATA : null;

/* ============ 常量与工具 ============ */
const EXAM = DATA ? (DATA.meta.exam || 'CERT').toLowerCase() : 'cert';   // clf-c02
const STORE_KEY = EXAM + '-v2';                                          // 进度键：clf-c02-v2
const COLORS = ['#4f46e5','#7c3aed','#9333ea','#a855f7'];                // 每章主题色（N 章 N 色，N>4 循环）
const home = document.getElementById('home');
const chapBox = document.getElementById('chapters');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inlineMd(s){
  let t = esc(s);
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
  return t;
}
function isTblSep(ln){ const core = ln.replace(/^\s*\|/,'').replace(/\|\s*$/,''); if(!core.includes('-')) return false; return /^[\s:\-|]+$/.test(ln) && /-/.test(ln); }
function loadProg(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveProg(p){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){} }

/* ============ 块级 md 渲染（段落/引用/表格/列表/图占位符） ============ */
function renderBlocks(seg, figs){
  const lines = seg.replace(/\r/g,'').split('\n');
  let html = ''; let i = 0; const n = lines.length;
  while(i < n){
    const ln = lines[i]; const s = ln.trim();
    if(s === ''){ i++; continue; }
    const fm = s.match(/^\[\[fig:([\w-]+)\]\]$/);
    if(fm){ const f = (figs||{})[fm[1]]; if(f) html += figHtml(f); i++; continue; }
    if(s.startsWith('|') && i+1 < n && isTblSep(lines[i+1].trim())){
      let rows = [];
      while(i < n && lines[i].trim().startsWith('|')){ rows.push(lines[i].trim()); i++; }
      const heads = rows[0].replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim()));
      const data = rows.slice(2).map(r => r.replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim())));
      html += '<div class="tbl-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'
        + data.map(r => '<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if(s.startsWith('>')){
      let q = [];
      while(i < n && lines[i].trim().startsWith('>')){ q.push(lines[i].replace(/^\s*>\s?/,'').trim()); i++; }
      html += '<blockquote>'+inlineMd(q.join(' '))+'</blockquote>'; continue;
    }
    if(/^[-*]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^[-*]\s+/.test(t)){ items.push(inlineMd(t.replace(/^[-*]\s+/,''))); i++; } else break; }
      html += '<ul>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; continue;
    }
    if(/^\d+[.、]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^\d+[.、]\s+/.test(t)){ items.push(inlineMd(t.replace(/^\d+[.、]\s+/,''))); i++; } else break; }
      html += '<ol>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ol>'; continue;
    }
    const hm = s.match(/^(#{1,6})\s+(.+)$/);
    if(hm){ html += '<h4 class="sec-h">'+inlineMd(hm[2])+'</h4>'; i++; continue; }
    let para = [];
    while(i < n){
      const t = lines[i].trim();
      if(t === '' || t.startsWith('|') || t.startsWith('>') || /^[-*]\s+/.test(t) || /^\d+[.、]\s+/.test(t) || /^#{1,6}\s/.test(t) || /^\[\[fig:[\w-]+\]\]$/.test(t)) break;
      para.push(t); i++;
    }
    if(para.length) html += '<p>'+inlineMd(para.join(' '))+'</p>';
  }
  return html;
}

/* ===== 节内子块解析与渲染（v6）：#### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点）
   本节定位=弱化引言、案例/记忆要点=卡片、常见误区与易错点=警示小节——均不占编号。
   解析与渲染共用 parseSectionBlocks，保证正文 h3 与左侧目录两级条目 1:1。 ===== */
const SUB_RAW='raw', SUB_LEAD='lead', SUB_KP='kp', SUB_CASE='case', SUB_MIS='mis', SUB_MEM='mem';
function subTypeOf(title){
  if(title === '本节定位') return SUB_LEAD;
  if(title === '案例') return SUB_CASE;
  if(title === '记忆要点') return SUB_MEM;
  if(title === '常见误区与易错点') return SUB_MIS;
  return SUB_KP;
}
function parseSectionBlocks(md){
  const parts = (md||'').replace(/\r/g,'').split(/\n(?=####\s)/);
  const out = [];
  parts.forEach(part=>{
    const m = part.match(/^####\s*(.+?)\s*\n([\s\S]*)$/);
    if(!m){ const t = part.trim(); if(t) out.push({ type:SUB_RAW, title:'', body:t }); return; }
    out.push({ type:subTypeOf(m[1].trim()), title:m[1].trim(), body:(m[2]||'').trim() });
  });
  return out;
}
function countKp(body){ let m=0; parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP) m++; }); return m; }
function kpListOf(body){
  const kps=[]; let m=0;
  parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP){ m++; kps.push({ m:m, title:b.title }); } });
  return kps;
}
function renderSectionBody(md, figs, d, n){
  const blocks = parseSectionBlocks(md);
  let h = ''; let kp = 0;
  for(const b of blocks){
    if(b.type === SUB_RAW){ h += renderBlocks(b.body, figs); continue; }
    if(b.type === SUB_KP){
      kp++;
      h += '<h3 class="mh3" id="sec-'+d+'-'+n+'-'+kp+'"><span class="h3no">'+d+'.'+n+'.'+kp+'</span><span>'+inlineMd(b.title)+'</span></h3>'
         + renderBlocks(b.body, figs);
      continue;
    }
    if(b.type === SUB_CASE){ h += '<div class="case-card"><h4 class="sec-h">案例</h4>'+renderBlocks(b.body, figs)+'</div>'; continue; }
    if(b.type === SUB_MEM){ h += '<div class="mem-card"><h4 class="sec-h">记忆要点</h4>'+renderBlocks(b.body, figs)+'</div>'; continue; }
    h += '<h4 class="sec-h'+(b.type===SUB_LEAD?' sec-lead-h':'')+'">'+inlineMd(b.title)+'</h4>'+renderBlocks(b.body, figs);
  }
  return h;
}
function figsById(fs){ const m={}; (fs||[]).forEach(f=>{ m[f.id]=f; }); return m; }
function figHtml(f){
  return '<div class="fig-block"><div class="fig-title">'+esc(f.title)+'</div>'
    + '<div class="fig-body">'+(f.html||'')+'</div>'
    + (f.caption ? '<div class="fig-caption">'+esc(f.caption)+'</div>' : '') + '</div>';
}

/* ============ 章内滚动（v6）：几何法 scrollspy + 阅读进度 ============
   同一 rAF 节流的 scroll 监听做两件事：① 顶部细进度条（#rdFill-d / #readPct-d）
   ② 高亮"最新越过吸顶线(READ_LINE)的锚点"（.sec-block 节 / .mh3 知识点），并自动单开其节组。 */
let spyD = 0, spyEls = [], spyTick = null, spyOn = false;
const READ_LINE = 86;      // 吸顶条下方阅读线
const ACT_WIN = 160;       // 节/知识点标题进入线下方窗口即视为"当前"（点击跳转后立即生效）
function setAct(id){
  if(!id) return;
  /* 锚点两类：正文节/知识点 sec-域-序号[-序号]，章末练习 quiz-d域 */
  const mk = id.match(/^(?:sec-|quiz-d)(\d+)/); if(!mk) return;
  const d = +mk[1];
  const toc = document.getElementById('toc-d'+d); if(!toc) return;
  toc.querySelectorAll('.toc-link.act').forEach(a=>a.classList.remove('act'));
  const link = toc.querySelector('a[href="#'+id+'"]');
  if(link){
    link.classList.add('act');
    const li = link.closest('.toc-sec');
    if(li && !li.classList.contains('open')){
      toc.querySelectorAll('.toc-sec.open').forEach(x=>x.classList.remove('open'));
      li.classList.add('open');
    } else if(!li){
      /* 独立条目（练习入口等）：高亮时收起所有展开节组，聚焦本条 */
      toc.querySelectorAll('.toc-sec.open').forEach(x=>x.classList.remove('open'));
    }
  }
}
function computeSpy(){
  const host = document.getElementById('panel-d'+spyD); if(!host) return;
  /* ① 阅读进度：以当前面板总高扣视口高的滚动行程计百分比（+页脚尾距近似） */
  const total = host.offsetHeight - window.innerHeight + 110;
  const p = total > 0 ? Math.max(0, Math.min(100, Math.round(window.scrollY / total * 100))) : 0;
  const fill = document.getElementById('rdFill-'+spyD); if(fill) fill.style.width = p + '%';
  const pct = document.getElementById('readPct-'+spyD); if(pct) pct.textContent = p + '%';
  /* ② 当前锚（三层）：
     视口内(含阅读线下方窗口)：选最靠上者 → 点击跳转/节首即生效；
     视口内无锚(读至章末练习/底部)：取最近滚出视口的锚，保持高亮最后小节；
     首屏未滚：回退最先可见锚 */
  const hi = READ_LINE + ACT_WIN;
  let best = null;
  for(const el of spyEls){
    const r = el.getBoundingClientRect();
    if(r.top <= hi && r.bottom >= 0){ if(!best || r.top > best.r.top) best = { el:el, r:r }; }
  }
  if(!best){
    for(const el of spyEls){
      const r = el.getBoundingClientRect();
      if(r.bottom < 0){ if(!best || r.bottom > best.r.bottom) best = { el:el, r:r }; }
    }
  }
  if(!best){
    for(const el of spyEls){
      const r = el.getBoundingClientRect();
      if(r.top >= 0 && r.top < window.innerHeight * 0.7){ if(!best || r.top < best.r.top) best = { el:el, r:r }; }
    }
    if(!best && spyEls.length) best = { el:spyEls[0], r:null };
  }
  if(best && best.el.id) setAct(best.el.id);
}
function onSpyScroll(){
  if(spyTick) return;
  spyTick = requestAnimationFrame(()=>{ spyTick = null; computeSpy(); });
}
function initSpy(d){
  detachSpy(false);
  spyD = d;
  const host = document.getElementById('panel-d'+d); if(!host) return;
  spyEls = Array.from(host.querySelectorAll('.sec-block, .mh3, .quiz-box'));
  if(!spyOn){ spyOn = true; window.addEventListener('scroll', onSpyScroll, { passive:true }); }
  document.body.classList.add('chapView');
  computeSpy();
}
function detachSpy(resetAct){
  if(spyOn){ window.removeEventListener('scroll', onSpyScroll); spyOn = false; }
  if(spyTick){ cancelAnimationFrame(spyTick); spyTick = null; }
  document.body.classList.remove('chapView');
  spyEls = []; spyD = 0;
  if(resetAct !== false){
    document.querySelectorAll('.toc-link.act').forEach(a=>a.classList.remove('act'));
    document.querySelectorAll('.toc-sec.open').forEach(li=>li.classList.remove('open'));
  }
}

/* ============ 章末练习 ============ */
/* 答案/题型归一化（2026-09-10 修复：双科数据格式不一致导致章末练习失效）
   数据真源存在两种历史格式：
     CLF  a = ["C"] / ["B","E"]   t = 'single' / 'multiple'
     AIF  a = "B"   / "AE"        t = '单选' / '多选'
   原实现把 q.a 经 JSON.stringify+esc 写进 data-ans 属性，esc 不转义双引号 →
   属性被 HTML 截断（CLF 抛 JSON 解析错→提交无反应；AIF 读出空→恒判错）。
   现改为：答案只从数据真源按 qid 反查，渲染层统一归一化，不再进 HTML 属性。 */
function normAns(v){
  if(v === null || v === undefined) return [];
  if(Array.isArray(v)) return v.map(x=>String(x).trim().toUpperCase()).filter(x=>/^[A-Z]$/.test(x));
  const raw = String(v).trim();
  /* 严格形态：整串只允许字母与分隔符。防从说明文字里误提字母
     （历史案例：AIF D5-030 答案字段为「⚠️待核（…见源PDF）」→ 误提出 P/D/F） */
  if(!/^[A-Za-z][A-Za-z,，、;；\s]*$/.test(raw)) return [];
  return raw.toUpperCase().replace(/[^A-Z]/g, '').split('').filter(Boolean);
}
/* 可作答判定：答案可解析 + 至少一个选项。不可作答题不渲染交互（防误判） */
function isAnswerable(q){ return !!(q && normAns(q.a).length && (q.o || []).length); }
/* 可答题数（进度分母用，不可作答题不计入） */
function answerableCount(d){
  const ch = (DATA && DATA.chapters) ? DATA.chapters[d-1] : null;
  return ((ch && ch.practice) || []).filter(isAnswerable).length;
}
function isMultiQ(q){
  if(!q) return false;
  if(q.t === 'multiple' || q.t === 'multi' || q.t === '多选') return true;
  return normAns(q.a).length > 1;   // 兜底：答案多字母必为多选
}
function findQ(d, qid){
  const ch = (DATA && DATA.chapters) ? DATA.chapters[d-1] : null;
  const qs = (ch && ch.practice) || [];
  for(let i=0;i<qs.length;i++){ if(String(qs[i].id) === String(qid)) return qs[i]; }
  return null;
}
function renderQuiz(d, qs){
  const host = document.getElementById('quiz-d'+d);
  if(!qs.length){ host.innerHTML = '<div class="quiz-hdr">✅ 本章练习</div><p style="font-size:14px;color:#94a3b8">本章暂无配套练习，可到刷题工具练习。</p>'; return; }
  const nAns = qs.filter(isAnswerable).length;
  const naTip = (nAns < qs.length) ? '（另有 '+(qs.length-nAns)+' 题特殊题型待补充）' : '';
  let h = '<div class="quiz-hdr"><span>✅ 本章练习（'+nAns+' 题）'+naTip+'</span><span class="quiz-score" id="qscore-'+d+'">正确 0/'+nAns+'</span></div>';
  qs.forEach((q,qi)=>{
    const multi = isMultiQ(q);
    /* 不可作答防御（2026-09-10）：答案或选项缺失时不渲染答题交互，
       避免学员点击后被误判（历史案例：AIF D5-030 配对题占位形态） */
    if(!isAnswerable(q)){
      h += '<div class="qi qi-na" data-d="'+d+'" data-qid="'+esc(q.id||(d+'-'+qi))+'" data-qi="'+qi+'" data-na="1">'
        + '<div class="qmeta"><span class="qbadge">第 '+(qi+1)+' 题</span><span class="qtype">特殊题型</span></div>'
        + '<div class="qstem">'+inlineMd(q.q||'')+'</div>'
        + '<div class="qrow"><div class="qres show na">⚠️ 本题为配对/特殊题型，暂不支持在线作答（内容待补充）</div></div></div>';
      return;
    }
    h += '<div class="qi" data-d="'+d+'" data-qid="'+esc(q.id||(d+'-'+qi))+'" data-qi="'+qi
      + '" data-multi="'+(multi?'1':'0')+'">'
      + '<div class="qmeta"><span class="qbadge">第 '+(qi+1)+' 题</span><span class="qtype '+(multi?'qtype-m':'qtype-s')+'">'+(multi?'多选':'单选')+'</span></div>'
      + '<div class="qstem">'+inlineMd(q.q||'')+'</div><div class="opts">';
    (q.o||[]).forEach(op=>{
      h += '<div class="opt" data-l="'+esc(op.l)+'"><span class="ol">'+esc(op.l)+'.</span><span>'+inlineMd(op.t||'')+'</span></div>';
    });
    h += '</div><div class="qexp" style="display:none">'+esc(q.e||'')+'</div>'
      + '<div class="qrow"><button class="qbtn">确认答案</button><div class="qres"></div></div></div>';
  });
  h += '<div class="score-box" id="scorebox-'+d+'"><div class="score-num" id="scorenum-'+d+'"></div><div class="score-lbl"></div>'
    + '<div class="sb-tip">完整题库与限时模拟考核见首页「题库刷题」入口；未作答的题目在返回目录再进入后仍可继续作答。</div></div>';
  host.innerHTML = h;
  /* 恢复已作答状态 */
  const prog = loadProg();
  const rec = (prog['quiz_d'+d] && prog['quiz_d'+d].answered) || {};
  host.querySelectorAll('.qi').forEach(qi=>{
    const qid = qi.dataset.qid;
    if(rec[qid] !== undefined){
      applyResult(qi, rec[qid].right === 1, rec[qid].sel || [], normAns((findQ(d, qid) || {}).a), true);
    }
  });
  host.querySelectorAll('.qi').forEach(qi=>{
    const qid = qi.dataset.qid; const prog2 = loadProg();
    const rec2 = (prog2['quiz_d'+d] && prog2['quiz_d'+d].answered) || {};
    if(rec2[qid] !== undefined) return;   // 已答锁题
    const optsBox = qi.querySelector('.opts'), btn = qi.querySelector('.qbtn');
    if(!optsBox || !btn) return;          // 不可作答题（特殊题型占位卡）无交互
    const multi = qi.dataset.multi === '1';
    const opts = qi.querySelectorAll('.opt');
    optsBox.addEventListener('click', e=>{
      const o = e.target.closest('.opt'); if(!o) return;
      if(multi){ o.classList.toggle('sel'); }
      else{ opts.forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); }
    });
    btn.addEventListener('click', ()=>{ judge(qi); });
  });
  updateScore(d);
  checkScoreBox(d);
}

function judge(qi){
  const d = qi.dataset.d;
  const ans = normAns((findQ(d, qi.dataset.qid) || {}).a);
  const sel = Array.from(qi.querySelectorAll('.opt.sel')).map(o=>o.dataset.l);
  /* 防复发：答案数据异常时大声报错，不得静默判错（2026-09-10） */
  if(!ans.length){
    const r = qi.querySelector('.qres');
    r.className = 'qres show err';
    r.textContent = '⚠️ 本题答案数据异常，无法判定，请反馈管理员';
    return;
  }
  const right = sel.length === ans.length && ans.every(a=>sel.includes(a));
  applyResult(qi, right, sel, ans, false);
  /* 持久化 */
  const prog = loadProg();
  const key = 'quiz_d'+d;
  if(!prog[key]) prog[key] = { answered:{} };
  prog[key].answered[qi.dataset.qid] = { right: right?1:0, sel: sel };
  saveProg(prog);
  updateScore(d);
  refreshProgress();
  checkScoreBox(d);
}

function applyResult(qi, right, sel, ans, restored){
  qi.classList.add('done');
  const opts = Array.from(qi.querySelectorAll('.opt'));
  opts.forEach(o=>{
    const l = o.dataset.l;
    if(ans.includes(l)) o.classList.add(sel.includes(l) ? 'cor' : 'shc');
    else if(sel.includes(l)) o.classList.add('wrg');
  });
  const qres = qi.querySelector('.qres');
  qres.className = 'qres show ' + (right ? 'ok' : 'err');
  const exp = qi.querySelector('.qexp');
  qres.innerHTML = (right ? '✅ 回答正确' : '❌ 回答错误') + '　<span style="font-weight:400">' + inlineMd(exp ? exp.textContent : '') + '</span>';
  qi.querySelector('.qbtn').disabled = true;
  qi.querySelector('.qbtn').textContent = restored ? '已作答' : '已确认';
}

function updateScore(d){
  const prog = loadProg();
  const key = 'quiz_d'+d;
  const rec = (prog[key] && prog[key].answered) || {};
  let right = 0;
  Object.values(rec).forEach(v=>{ if(v.right === 1) right++; });
  const total = answerableCount(d);   // 分母=可答题数（特殊题型占位卡不计入）
  const sc = document.getElementById('qscore-'+d);
  if(sc) sc.textContent = '正确 ' + right + '/' + total;
}

function checkScoreBox(d){
  const prog = loadProg();
  const key = 'quiz_d'+d;
  const rec = (prog[key] && prog[key].answered) || {};
  const total = answerableCount(d);
  if(Object.keys(rec).length >= total && total > 0){
    let right = 0; Object.values(rec).forEach(v=>{ if(v.right === 1) right++; });
    const box = document.getElementById('scorebox-'+d);
    document.getElementById('scorenum-'+d).textContent = right + ' / ' + total;
    box.querySelector('.score-lbl').textContent = right === total ? '🎉 全对，本章掌握扎实！' : (right >= total*0.7 ? '👍 达到及格线（70%），可进入下一章' : '📖 建议回到正文复习错题对应的知识点');
    box.classList.add('show');
  }
}

/* ============ 视图切换与进度 ============ */
function go(d){
  const chapters = DATA.chapters;
  closeSide();
  home.style.display = 'none';
  chapBox.style.display = '';
  chapBox.querySelectorAll('.panel').forEach(p=>{ p.style.display = (p.id === 'panel-d'+d) ? '' : 'none'; });
  const prog = loadProg();
  prog['read_d'+d] = 1;                 // 已读标记
  saveProg(prog);
  window.scrollTo(0,0);
  document.title = baseTitle() + ' · 第 ' + d + ' 章';
  initSpy(d);                            // 常驻目录/进度条/scrollspy 跟随当前章
}

function backHome(){
  detachSpy();
  closeSide();
  chapBox.style.display = 'none';
  home.style.display = '';
  window.scrollTo(0,0);
  document.title = baseTitle();
  refreshProgress();
}

/* 刷新首页进度看板：统计已完成数 + 章卡状态/进度条 */
function refreshProgress(){
  const prog = loadProg();
  const chapters = DATA.chapters;
  let doneCnt = 0;
  chapters.forEach((ch,di)=>{
    const d = di+1;
    const total = (ch.practice||[]).length;
    const rec = (prog['quiz_d'+d] && prog['quiz_d'+d].answered) || {};
    const nDone = Object.keys(rec).length;
    const right = Object.values(rec).filter(v=>v.right===1).length;
    const read = prog['read_d'+d] === 1;
    const pm = document.getElementById('pm-'+d);
    const pmn = document.getElementById('pmn-'+d);
    const pf = document.getElementById('pf-'+d);
    const card = pm ? pm.closest('.ch-card') : null;
    if(!pm) return;
    let state = '未开始', pct = 0;
    if(nDone >= total && total > 0){ state = '已完成'; doneCnt++; card.classList.add('done'); }
    else if(read || nDone > 0){ state = nDone > 0 ? '学习中 ' + nDone + '/' + total : '学习中'; }
    pm.textContent = state;
    if(card) card.classList.toggle('done', nDone >= total && total > 0);
    pct = total ? Math.round(nDone/total*100) : 0;
    if(pf) pf.style.width = pct + '%';
    if(pmn) pmn.textContent = total ? ('答对 ' + right + '/' + total) : '';
  });
  const od = document.getElementById('ovDone');
  if(od) od.textContent = doneCnt;
}

/* ============ 启动 ============ */
if(!DATA){
  document.body.innerHTML = '<div style="padding:60px 24px;text-align:center;font-size:14px;color:#64748b">学习数据未注入：此模板需经构建脚本注入数据后方可使用。</div>';
} else {
  buildHome();
  buildPanels();
  refreshProgress();
}

/* ============ 合体视图切换：学习区 ↔ 题库刷题区 ============
   quiz-embed 内的「← 返回学习目录」按钮与底部导航「📚 学习」都调用 window.kbShowLearnHome */
function kbShowQuiz(){
  detachSpy();
  closeSide();
  home.style.display = 'none';
  chapBox.style.display = 'none';
  const f = document.querySelector('.footer'); if(f) f.style.display = 'none';
  // 修复 2026-09-09：.wrap 外壳仅藏子元素会残留 padding（24+60px），把题库顶栏顶离顶部 84px
  // → 外壳自身一并隐藏，保证进入题库视图即贴顶
  const w = document.querySelector('.wrap'); if(w) w.style.display = 'none';
  const qv = document.getElementById('quizView');
  if(qv){
    qv.style.display = 'block';
    const tt = document.getElementById('qzTopTitle');
    if(tt) tt.textContent = (DATA.meta.cnName ? DATA.meta.exam + ' · ' + DATA.meta.cnName : DATA.meta.exam) + ' 题库刷题';
  }
  window.scrollTo(0,0);
  document.title = baseTitle() + ' · 题库刷题';
}
function kbShowLearnHome(){
  detachSpy();
  closeSide();
  const qv = document.getElementById('quizView');
  if(qv) qv.style.display = 'none';
  const f = document.querySelector('.footer'); if(f) f.style.display = '';
  home.style.display = '';
  const w = document.querySelector('.wrap'); if(w) w.style.display = '';
  window.scrollTo(0,0);
  document.title = baseTitle();
  refreshProgress();
}
window.kbShowQuiz = kbShowQuiz;
window.kbShowLearnHome = kbShowLearnHome;
})();
</script>
<script>
/* 图灯箱（2026-09-09 移动适配 P1=A）：正文图当前渲染等效字号 <9.5px 时点击可放大到原始 viewBox 尺寸
   等效字号 = 图内最小 text 字号 × (当前渲染宽 ÷ viewBox 宽)；桌面可读图不触发，不打断阅读 */
(function(){
  'use strict';
  var box = null, stage = null;
  function minFontPx(svg){
    var t = svg.querySelectorAll('text'), mn = Infinity;
    for (var i = 0; i < t.length; i++){
      var v = parseFloat(t[i].getAttribute('font-size'));
      if (isNaN(v)){ var cs = getComputedStyle(t[i]); v = parseFloat(cs.fontSize); }
      if (!isNaN(v) && v < mn) mn = v;
    }
    return isFinite(mn) ? mn : 12;
  }
  function effFont(svg){
    var vb = svg.viewBox && svg.viewBox.baseVal;
    if (!vb || !vb.width) return 99;                 // 无 viewBox：不介入
    var w = svg.getBoundingClientRect().width || vb.width;
    return minFontPx(svg) * (w / vb.width);
  }
  function close(){
    if (box) box.classList.remove('show');
    document.documentElement.style.overflow = '';
  }
  function open(svg){
    if (!box){
      box = document.createElement('div');
      box.className = 'fig-lightbox';
      box.innerHTML = '<button class="lb-close" aria-label="关闭放大图">✕</button><div class="lb-stage"></div>';
      document.body.appendChild(box);
      stage = box.querySelector('.lb-stage');
      box.querySelector('.lb-close').addEventListener('click', close);
      box.addEventListener('click', function(e){ if (e.target === box) close(); });
    }
    var vb = svg.viewBox.baseVal;
    var clone = svg.cloneNode(true);
    clone.style.width = vb.width + 'px';             // 原始 viewBox 尺寸 1:1
    clone.style.maxWidth = 'none';
    clone.style.height = 'auto';
    stage.innerHTML = '';
    stage.appendChild(clone);
    box.classList.add('show');
    document.documentElement.style.overflow = 'hidden';
    stage.scrollTop = 0; stage.scrollLeft = 0;
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
  document.addEventListener('click', function(e){
    var svg = e.target.closest ? e.target.closest('.fig-body svg') : null;
    if (!svg) return;
    if (effFont(svg) >= 9.5) return;                 // 当前渲染下可读 → 不打断
    e.preventDefault();
    open(svg);
  });
})();
</script>
