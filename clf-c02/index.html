有完全控制权"},{"l":"D","t":"随着应用程序受欢迎，几分钟内灵活扩展"},{"l":"E","t":"选择将托管应用程序服务器的特定数据中心"}],"a":["B","D"],"e":"**✅ 为什么 B、D 对**：\n- B.尝试新项目的加快速度：云上分钟级拉起环境、快速试错，显著快于本地采购部署\n- D.随着应用程序受欢迎，几分钟内灵活扩展：弹性伸缩随流量增长即时扩容，无需提前采购\n\n**❌ 为什么其他选项错**：\n- A.大量的前期资本支出和低可变成本：云恰恰是低前期投入+按用量付费（可变成本），表述颠倒\n- C.对基础设施的物理安全性拥有完全控制权：物理安全由 AWS 负责管理，客户不控制机房\n- E.选择将托管应用程序服务器的特定数据中心：客户可选区域，但不能指定具体数据中心\n\n**📌 关键概念**：云 vs 本地对比题三陷阱：前期资本支出（云更少）、物理控制权（云没有）、指定数据中心（做不到）；正确项总落在「快+弹性」两关键词上。","s":"源#522"},{"id":"D1-525","d":1,"t":"single","q":"一家公司需要在 Amazon RDS 中部署 PostgreSQL 数据库。数据库必须是高可用和容错的。公司应该使用哪种 AWS 解决方案来满足这些要求？","o":[{"l":"A","t":"单个可用区的 Amazon RDS"},{"l":"B","t":"Amazon RDS 快照"},{"l":"C","t":"多个可用区的 Amazon RDS"},{"l":"D","t":"AWS 数据库迁移服务（AWS DMS）"}],"a":["C"],"e":"**✅ 为什么 C.多个可用区的 Amazon RDS 对**：RDS 多可用区（Multi-AZ）部署自动在另一可用区维护同步备用实例，主库故障时自动故障转移到备用库，提供高可用与容错，正符合题干双要求。\n\n**❌ 为什么其他选项错**：\n- A.单个可用区的 Amazon RDS：单 AZ 无冗余实例，故障即中断，不满足高可用\n- B.Amazon RDS 快照：快照是备份恢复手段，有时间点丢失且恢复耗时，非高可用架构\n- D.AWS 数据库迁移服务（AWS DMS）：负责数据库搬迁与复制，不是运行时高可用方案\n\n**📌 关键概念**：RDS 可用性分级：单 AZ（无冗余）→ Multi-AZ（同步备用+自动故障转移，高可用）；快照属备份（RPO>0）、Multi-AZ 属容错（近零中断），两回事。","s":"源#525"},{"id":"D1-527","d":1,"t":"multiple","q":"哪些陈述准确地描述了 AWS 全球基础设施组件之间的关系？（选择两项。）","o":[{"l":"A","t":"AWS 区域比可用区多。"},{"l":"B","t":"边缘位置比 AWS 区域多。"},{"l":"C","t":"边缘位置是可用区。"},{"l":"D","t":"AWS 区域比边缘位置多。"},{"l":"E","t":"可用区比 AWS 区域多。"}],"a":["B","E"],"e":"**✅ 为什么 B、E 对**：\n- B.边缘位置比 AWS 区域多：全球边缘站点（400+ PoP）数量远超区域（30+），用于内容缓存分发\n- E.可用区比 AWS 区域多：每个区域含 2 个以上可用区，总数（100+）远超区域数\n\n**❌ 为什么其他选项错**：\n- A.AWS 区域比可用区多：数量关系颠倒，区域数远少于可用区数\n- C.边缘位置是可用区：边缘位置是缓存内容的 PoP，与承载计算的可用区是不同概念\n- D.AWS 区域比边缘位置多：同样颠倒，区域数远少于边缘站点数\n\n**📌 关键概念**：数量级排序：边缘站点（数百）> 可用区（百余）> 区域（数十）；层级上区域 ⊃ 可用区，边缘站点独立于区域体系外，二者不可混淆。","s":"源#527"},{"id":"D1-529","d":1,"t":"single","q":"一家公司需要在特定地理区域托管应用程序以遵守法规。AWS 全球基础设施的哪个特性将帮助公司满足此要求？","o":[{"l":"A","t":"可扩展性"},{"l":"B","t":"全球足迹"},{"l":"C","t":"可用性"},{"l":"D","t":"性能"}],"a":["B"],"e":"**✅ 为什么 B.全球足迹 对**：全球足迹（Global Footprint）指 AWS 覆盖全球的区域网络，客户可选择特定地理区域部署应用以满足数据驻留与属地法规，正符合「特定地理区域托管+遵守法规」的要求。\n\n**❌ 为什么其他选项错**：\n- A.可扩展性：是容量伸缩能力，不涉及地理位置选择\n- C.可用性：是持续运行能力，与合规选址无关\n- D.性能：是延迟与吞吐表现，不是合规特性\n\n**📌 关键概念**：全球基础设施特性对号：合规与数据驻留=全球足迹（选区域的能力）；容量=可扩展性；韧性=可用性；「特定地理区域+法规」是全球足迹的标准题眼。","s":"源#529"},{"id":"D1-531","d":1,"t":"single","q":"设计 AWS 工作负载以在组件故障时仍可操作，AWS 的最佳实践是什么？","o":[{"l":"A","t":"每季度进行灾难恢复测试。"},{"l":"B","t":"将主要组件放在 us-east-1 区域。"},{"l":"C","t":"设计为自动故障转移到健康的资源。"},{"l":"D","t":"设计工作负载以适应单个 Amazon EC2 实例。"}],"a":["C"],"e":"**✅ 为什么 C.设计为自动故障转移到健康的资源。 对**：组件故障时自动切换到健康资源（多 AZ 冗余+健康检查+自动故障转移）是 AWS 高可用容错设计的最佳实践，无需人工介入即可维持服务，正符合题干要求。\n\n**❌ 为什么其他选项错**：\n- A.每季度进行灾难恢复测试。：定期演练有价值，但那是验证手段而非故障时保持运行的机制\n- B.将主要组件放在 us-east-1 区域。：单区域集中部署反而放大区域级故障风险\n- D.设计工作负载以适应单个 Amazon EC2 实例。：单实例是单点故障，与容错目标相反\n\n**📌 关键概念**：故障时仍可操作 = 自动故障转移（多 AZ+健康检查+备用资源即时接管）；「手动演练」「单实例」「单区域」都是反面选项，自动与冗余是关键词。","s":"源#531"},{"id":"D1-543","d":1,"t":"multiple","q":"哪些 AWS 服务或功能构成了 AWS 云全球基础设施？（选择两项。）","o":[{"l":"A","t":"可用区"},{"l":"B","t":"Amazon ElastiCache"},{"l":"C","t":"AWS 区域"},{"l":"D","t":"Amazon S3"},{"l":"E","t":"Amazon VPC"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A.可用区：Availability Zone 是全球基础设施的基本组成单元（隔离的数据中心集群）\n- C.AWS 区域：Region 同为基础设施骨干（地理区域，内含多个可用区）\n\n**❌ 为什么其他选项错**：\n- B.Amazon ElastiCache：是运行在基础设施上的托管 Redis/Memcached 服务，不是基础设施本身\n- D.Amazon S3：是对象存储服务，属服务层而非基础设施组成\n- E.Amazon VPC：是虚拟网络的逻辑划分功能，属网络服务\n\n**📌 关键概念**：全球基础设施 = 区域 + 可用区 + 边缘站点/Local Zones/Wavelength 等部署点位；ElastiCache/S3/VPC 都是跑在基础设施之上的「服务」，注意基础设施与服务的层级区分。","s":"源#543"},{"id":"D1-559","d":1,"t":"multiple","q":"以下哪些设计原则包含在 AWS 良好架构框架的可靠性支柱中？（选择两项。）","o":[{"l":"A","t":"自动从故障中恢复。"},{"l":"B","t":"授予每个人增加 AWS 服务配额的访问权限。"},{"l":"C","t":"停止猜测容量。"},{"l":"D","t":"设计应用程序在单个可用区运行。"},{"l":"E","t":"首先在辅助 AWS 区域中计划增加 AWS 服务配额。"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A.自动从故障中恢复：可靠性支柱核心原则——用自动恢复机制从中断中恢复\n- C.停止猜测容量：可靠性支柱要求按需获取资源、以自动扩缩消除容量预估\n\n**❌ 为什么其他选项错**：\n- B.授予每个人增加 AWS 服务配额的访问权限。：放开配额权限是安全风险，与可靠性原则无关\n- D.设计应用程序在单个可用区运行。：单 AZ 运行无冗余，违背可靠性设计\n- E.首先在辅助 AWS 区域中计划增加 AWS 服务配额。：配额规划是辅助动作，不是可靠性支柱的设计原则表述\n\n**📌 关键概念**：可靠性支柱原则组：测试恢复程序、自动从故障恢复、水平扩展扩容、停止猜测容量；干扰项用「配额」类运维细节偷换概念。","s":"源#559"},{"id":"D1-562","d":1,"t":"single","q":"一家公司希望在单个 AWS 区域的多个可用区部署应用程序。这种部署将为公司提供哪些好处？","o":[{"l":"A","t":"改善全球客户的连接性能"},{"l":"B","t":"弹性架构和高可用性解决方案"},{"l":"C","t":"降低整体数据存储成本"},{"l":"D","t":"在需求低的时候关闭可用区的能力"}],"a":["B"],"e":"**✅ 为什么 B.弹性架构和高可用性解决方案 对**：同区域跨多个可用区部署，各 AZ 物理隔离、独立供电组网，单 AZ 故障时其余 AZ 继续承载流量，天然构成弹性（可自动扩缩）与高可用（故障不中断）的架构，正符合题干问的部署收益。\n\n**❌ 为什么其他选项错**：\n- A.改善全球客户的连接性能：跨 AZ 部署只覆盖单一区域，改善全球性能需 CloudFront/多区域\n- C.降低整体数据存储成本：可用区数量与存储单价无关，不带来成本下降\n- D.在需求低的时候关闭可用区的能力：可用区是 AWS 基础设施站点，客户无权关闭\n\n**📌 关键概念**：多 AZ 部署的收益锚点：区域内容错（单 AZ 故障不影响整体）+ 高可用；全球性能靠边缘分发（CloudFront）或跨区域部署，成本优化靠 FinOps 手段。","s":"源#562"},{"id":"D1-575","d":1,"t":"single","q":"一家公司需要访问检查和建议，以帮助公司遵循 AWS 最佳实践，以实现成本优化、安全性、容错性、性能和服务配额。哪个 AWS 服务和 AWS 支持计划的组合将满足这些要求？","o":[{"l":"A","t":"AWS Trusted Advisor 与 AWS 开发人员支持"},{"l":"B","t":"AWS 健康仪表板与 AWS 企业支持"},{"l":"C","t":"AWS Trusted Advisor 与 AWS 商业支持"},{"l":"D","t":"AWS 健康仪表板与 AWS 企业入门支持"}],"a":["C"],"e":"**✅ 为什么 C.AWS Trusted Advisor 与 AWS 商业支持 对**：Trusted Advisor 提供成本优化、安全、容错、性能与服务配额五大类检查建议，而完整访问全部检查项的最低支持计划门槛是商业支持（Business），二者组合精准匹配题干要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS Trusted Advisor 与 AWS 开发人员支持：开发者支持仅含基础版 Trusted Advisor（少数检查项），覆盖不全\n- B.AWS 健康仪表板与 AWS 企业支持：Health Dashboard 是服务运行状态公告，不是最佳实践巡检工具\n- D.AWS 健康仪表板与 AWS 企业入门支持：同样错在工具（健康仪表板），且无「企业入门支持」此计划名\n\n**📌 关键概念**：Trusted Advisor 权益阶梯：开发者（基础检查）→ 商业（全部检查+API）→ 企业（增加 TAM 等服务）；题干列全五大类检查即商业支持起步；Health Dashboard 管状态公告，两者勿混。","s":"源#575"},{"id":"D1-579","d":1,"t":"multiple","q":"AWS 云开发工具包（AWS CDK）目前支持哪些编程语言？（选择两项。）","o":[{"l":"A","t":"Python"},{"l":"B","t":"Swift"},{"l":"C","t":"TypeScript"},{"l":"D","t":"Ruby"},{"l":"E","t":"PHP"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A.Python：Python 是 AWS CDK 首批官方支持的语言之一，开发者可以用熟悉的 Python 代码定义和构建云基础设施资源，生态成熟、示例丰富。\n- C.TypeScript：TypeScript 是 CDK 的首发支持语言，拥有最完整的类型定义与文档支持，同等成熟稳定，适合前端背景团队上手。\n\n**❌ 为什么其他选项错**：\n- B.Swift：Swift 不在 CDK 官方支持语言列表中，无法用于定义基础设施。\n- D.Ruby：Ruby 曾有实验性支持，但已终止，当前官方支持列表中不含 Ruby。\n- E.PHP：PHP 从未被 CDK 官方支持，不能作为 CDK 开发语言。\n\n**📌 关键概念**：CDK 官方支持语言五件套 = TypeScript、JavaScript、Python、Java、C#/.NET（Go 为预览级）；记忆口诀「两大脚本+两大企业级+一大 .NET」；Swift/Ruby/PHP 均为干扰项，遇到语言类多选题按此清单作答。","s":"源#579"},{"id":"D1-581","d":1,"t":"single","q":"哪项 AWS 服务或功能允许公司在 AWS 云中拥有自己逻辑隔离的部分？","o":[{"l":"A","t":"AWS VPN"},{"l":"B","t":"可用区"},{"l":"C","t":"Amazon 虚拟私有云（Amazon VPC）"},{"l":"D","t":"AWS 区域"}],"a":["C"],"e":"**✅ 为什么 C.Amazon 虚拟私有云（Amazon VPC） 对**：VPC 让客户在 AWS 云中划出一段逻辑隔离的虚拟网络——自定义 IP 段、子网、路由与网关，资源在私有隔离环境中启动，正符合「云中自己逻辑隔离的一部分」的定义。\n\n**❌ 为什么其他选项错**：\n- A.AWS VPN：建立本地与 AWS 间的加密隧道连接，不提供云内隔离网络\n- B.可用区：是基础设施的物理部署单元，不是客户可自定义的逻辑网络\n- D.AWS 区域：是地理部署概念，粒度远大于逻辑隔离网络\n\n**📌 关键概念**：「逻辑隔离的网络分区」是 VPC 的定义性表述；区域/AZ 是物理基础设施层级，VPN 是连接通道，与逻辑隔离网络概念分层不同。","s":"源#581"},{"id":"D1-583","d":1,"t":"single","q":"为什么使用 AWS CloudFormation 模板？","o":[{"l":"A","t":"通过使用自动化减少配置时间。"},{"l":"B","t":"将现有基础设施转移到另一家公司。"},{"l":"C","t":"在 AWS 云中重用本地基础设施。"},{"l":"D","t":"部署大型基础设施且没有成本影响。"}],"a":["A"],"e":"**✅ 为什么 A.通过使用自动化减少配置时间。 对**：CloudFormation 模板把整套基础设施定义成代码，一键自动创建所有资源，消除手工逐项配置，大幅缩短供应时间并保证环境一致性，正符合题干目的。\n\n**❌ 为什么其他选项错**：\n- B.将现有基础设施转移到另一家公司。：模板定义的是资源配置，无法把基础设施「转移」给他人\n- C.在 AWS 云中重用本地基础设施。：本地物理硬件不能经模板搬入云中复用\n- D.部署大型基础设施且没有成本影响。：模板部署的资源照常计费，「没有成本影响」不成立\n\n**📌 关键概念**：CloudFormation 核心价值 = 自动化（省时）+ 一致性（可重复）+ 版本化（可审计）；「自动化减少配置时间」是它最本质的收益表述。","s":"源#583"},{"id":"D1-601","d":1,"t":"single","q":"AWS 云采用框架（AWS CAF）的哪个视角专注于在数据目录中组织数据产品的清单？","o":[{"l":"A","t":"运营"},{"l":"B","t":"治理"},{"l":"C","t":"业务"},{"l":"D","t":"平台"}],"a":["B"],"e":"**✅ 为什么 B.治理 对**：CAF 治理（Governance）视角中的数据治理能力负责在数据目录（Data Catalog）中组织数据产品清单，登记来源与质量等背景信息，支撑数据货币化与自助分析，正符合题干描述。\n\n**❌ 为什么其他选项错**：\n- A.运营：运营视角负责云上系统运行监控，不管理数据资产目录\n- C.业务：业务视角关注业务价值与产品，数据目录治理不在其能力清单\n- D.平台：平台视角构建数据平台的技术架构，目录的「组织管理」归治理\n\n**📌 关键概念**：数据治理分工：平台视角「建」数据平台（管道、架构），治理视角「管」数据资产（目录、质量、合规）；「数据目录组织清单」是治理视角的标志性动作。","s":"源#601"},{"id":"D1-613","d":1,"t":"single","q":"一家公司计划将其本地数据中心的一个包含数百万文件的大型数据集一次性迁移到AWS 云。该公司应该使用哪项 AWS 服务进行迁移？","o":[{"l":"A","t":"AWS Database Migration Service（AWS DMS）"},{"l":"B","t":"AWS DataSync"},{"l":"C","t":"AWS Migration Hub"},{"l":"D","t":"AWS Application Migration Service"}],"a":["B"],"e":"**✅ 为什么 B.AWS DataSync 对**：DataSync 面向「本地↔AWS」大批量数据迁移，自动处理调度、加密与校验，适合数百万文件规模的一次性搬迁到 S3/EFS 等存储服务，正符合题干场景。\n\n**❌ 为什么其他选项错**：\n- A.AWS Database Migration Service（AWS DMS）：专搬数据库（同构/异构复制），不管文件数据集\n- C.AWS Migration Hub：是迁移项目进度跟踪门户，本身不执行数据传输\n- D.AWS Application Migration Service：搬的是整套应用与服务器（lift-and-shift），不面向纯文件数据集\n\n**📌 关键概念**：数据搬运工具对号：文件/对象批量传输 = DataSync；数据库 = DMS；应用整机 = MGN；进度协调 = Migration Hub；「数百万文件+一次性」是 DataSync 的标准场景。","s":"源#613"},{"id":"D1-618","d":1,"t":"single","q":"一家公司想要将其本地基础设施迁移到 AWS 云。 云计算的哪个优势将帮助该公司降低前期成本？","o":[{"l":"A","t":"在几分钟内实现全球化"},{"l":"B","t":"提高速度和敏捷性"},{"l":"C","t":"受益于大规模的经济规模"},{"l":"D","t":"将固定费用转换为可变费用"}],"a":["D"],"e":"**✅ 为什么 D.将固定费用转换为可变费用 对**：上云以租代买——本地模式的硬件购置与机房固定投入（CAPEX）转为按实际用量付费的可变支出（OPEX），前期资金门槛大幅降低，正符合「降低前期成本」的要求。\n\n**❌ 为什么其他选项错**：\n- A.在几分钟内实现全球化：是全球部署速度优势，不直接降低前期投入\n- B.提高速度和敏捷性：是快速供应与实验优势，属效率维度\n- C.受益于大规模的经济规模：规模经济降低的是单位成本，非「前期投入」问题\n\n**📌 关键概念**：前期成本问题的标准答案：CAPEX→OPEX（固定转可变、以租代买）；规模经济管「单价」，速度敏捷管「快」，题干盯「前期」二字。","s":"源#618"},{"id":"D1-619","d":1,"t":"single","q":"一家公司正在 AWS 云中设计工作负载。该公司希望工作负载在其生命周期内正确且一致地执行其预期功能。 AWS 良好架构框架的哪个支柱代表了这一目标？","o":[{"l":"A","t":"运营卓越"},{"l":"B","t":"安全性"},{"l":"C","t":"可靠性"},{"l":"D","t":"性能效率"}],"a":["C"],"e":"**✅ 为什么 C.可靠性 对**：可靠性（Reliability）支柱的定义正是「让工作负载在其生命周期内正确且一致地执行其预期功能」——包括从故障中恢复、动态获取资源，与题干表述逐字对应。\n\n**❌ 为什么其他选项错**：\n- A.运营卓越：聚焦运维流程与持续改进，不定义功能执行的一致性\n- B.安全性：聚焦权限、加密与审计，与功能正确执行无关\n- D.性能效率：聚焦资源选型与效率，不保障正确一致运行\n\n**📌 关键概念**：可靠性支柱标准定义句：「正确且一致地执行预期功能（perform intended function correctly and consistently）」；见到这句就锁定可靠性。","s":"源#619"},{"id":"D1-624","d":1,"t":"single","q":"一家公司需要能够在几分钟内为新应用程序设置基础设施。 云计算的哪个优势将帮助该公司满足此要求？","o":[{"l":"A","t":"将固定费用转换为可变费用"},{"l":"B","t":"在几分钟内实现全球化"},{"l":"C","t":"提高速度和敏捷性"},{"l":"D","t":"停止猜测容量"}],"a":["C"],"e":"**✅ 为什么 C.提高速度和敏捷性 对**：几分钟内设置好新应用的基础设施，正是「速度和敏捷性」优势的直接体现——资源分钟级供应、随需即取，业务想法快速落地，符合题干要求。\n\n**❌ 为什么其他选项错**：\n- A.将固定费用转换为可变费用：是成本维度的优势，与「快」无关\n- B.在几分钟内实现全球化：强调的是全球多点部署，不是单纯快速拉起环境\n- D.停止猜测容量：是弹性按需供给免除容量预估，非速度诉求\n\n**📌 关键概念**：「几分钟内设置基础设施」的表述重心在快（速度敏捷）；「分钟级全球化」重心在全球覆盖；两词相似，看修饰语指向即区分。","s":"源#624"},{"id":"D1-626","d":1,"t":"single","q":"一家公司计划迁移到 AWS 云。该公司希望收集有关其本地数据中心的信息。该公司应该使用哪项AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS Application Discovery Service"},{"l":"B","t":"AWS DataSync"},{"l":"C","t":"AWS Storage Gateway"},{"l":"D","t":"AWS Database Migration Service（AWS DMS）"}],"a":["A"],"e":"**✅ 为什么 A.AWS Application Discovery Service 对**：Application Discovery Service 采集本地数据中心信息（服务器、应用、依赖关系与使用数据），为迁移规划提供输入，正符合「收集本地数据中心信息」的要求。\n\n**❌ 为什么其他选项错**：\n- B.AWS DataSync：执行本地到 AWS 的数据传输，不做环境信息采集\n- C.AWS Storage Gateway：本地与云存储间的混合网关（缓存/分层），不采集数据中心清单\n- D.AWS Database Migration Service（AWS DMS）：搬迁数据库，不收集基础设施信息\n\n**📌 关键概念**：迁移规划第一站 = 发现（Discovery）：ADS 采集「有什么、跑多满、依赖谁」；随后才是 Migration Evaluator 估算成本、DataSync/DMS/MGN 执行搬迁。","s":"源#626"},{"id":"D1-638","d":1,"t":"single","q":"一家公司希望能够根据需要自动获取资源，并在不再需要时释放这些资源。 哪个云概念描述了此功能？","o":[{"l":"A","t":"可用性"},{"l":"B","t":"弹性"},{"l":"C","t":"持久性"},{"l":"D","t":"可靠性"}],"a":["B"],"e":"**✅ 为什么 B.弹性 对**：弹性（Elasticity）的定义就是按需自动获取资源、不需要时自动释放——资源随负载自动扩缩，正符合题干对功能的描述。\n\n**❌ 为什么其他选项错**：\n- A.可用性：描述系统持续可用的运行状态，不定义资源获取与释放\n- C.持久性：描述数据长期完整保存的能力（如 S3 11 个 9），与资源伸缩无关\n- D.可靠性：描述系统执行预期功能并从故障恢复，不是伸缩概念\n\n**📌 关键概念**：「自动获取+自动释放」双动作齐现即弹性；持久性管数据不丢、可用性管服务不断、可靠性管故障恢复，四个概念按题干动词区分。","s":"源#638"},{"id":"D1-642","d":1,"t":"multiple","q":"一家公司正在迁移到 AWS 云而不是在本地运行其基础设施。 以下哪些是此迁移的优势？（选择两项）","o":[{"l":"A","t":"无需进行安全审计"},{"l":"B","t":"增加全球覆盖范围和敏捷性"},{"l":"C","t":"能够在几分钟内全球部署"},{"l":"D","t":"无需 IT 人员成本"},{"l":"E","t":"所有计算服务默认具有冗余性"}],"a":["B","C"],"e":"**✅ 为什么 B、C 对**：\n- B.增加全球覆盖范围和敏捷性：AWS 全球基础设施让应用触达全球，资源分钟级供应提升敏捷\n- C.能够在几分钟内全球部署：多区域部署可在数分钟内完成，快速进入新市场\n\n**❌ 为什么其他选项错**：\n- A.无需进行安全审计：云上仍需合规与安全审计，责任共享不等于免除\n- D.无需 IT 人员成本：云降低部分运维负担，但 IT 团队依然必要\n- E.所有计算服务默认具有冗余性：并非所有服务默认多 AZ 冗余，冗余常需客户架构设计\n\n**📌 关键概念**：云迁移优势的正确表述：全球覆盖、分钟级部署、敏捷提速；「免审计/免 IT/默认全冗余」三类绝对化表述都是经典陷阱选项。","s":"源#642"},{"id":"D1-647","d":1,"t":"single","q":"一家公司希望不断改进流程和程序以提供业务价值。 AWS 良好架构框架的哪个支柱代表了这一目标？","o":[{"l":"A","t":"性能效率"},{"l":"B","t":"运营卓越"},{"l":"C","t":"可靠性"},{"l":"D","t":"可持续性"}],"a":["B"],"e":"**✅ 为什么 B.运营卓越 对**：运营卓越（Operational Excellence）支柱聚焦持续改进流程与程序以交付业务价值——运行监控、小步演进、自动化优化，与题干「不断改进流程和程序以提供业务价值」逐字对应。\n\n**❌ 为什么其他选项错**：\n- A.性能效率：聚焦资源选型与运行效率，不涉及流程改进\n- C.可靠性：聚焦故障恢复与功能一致执行，不管流程演进\n- D.可持续性：聚焦环境影响与资源利用效率，与流程改进无关\n\n**📌 关键概念**：「持续改进（continuously improve）」是运营卓越的核心动词；可靠性管「不出事」、性能效率管「跑得省」、运营卓越管「越干越好」。","s":"源#647"},{"id":"D1-651","d":1,"t":"single","q":"一家公司需要在本地运行一些工作负载以遵守监管准则。该公司希望使用 AWS 云来运行不需要在本地运行的工作负载。该公司还希望能够对本地工作负载和云工作负载使用相同的 API 调用。 该公司应该使用哪项AWS 服务或功能来满足这些要求？","o":[{"l":"A","t":"专用主机"},{"l":"B","t":"AWS Outposts"},{"l":"C","t":"可用区"},{"l":"D","t":"AWS Wavelength"}],"a":["B"],"e":"**✅ 为什么 B.AWS Outposts 对**：Outposts 在客户本地机房运行原生 AWS 基础设施，本地工作负载与云端工作负载使用完全相同的 API、控制台与工具，满足监管留在本地的要求同时保持操作一致性，正符合题干三项要求。\n\n**❌ 为什么其他选项错**：\n- A.专用主机（Dedicated Hosts）：是 EC2 单租户物理服务器，仍在 AWS 区域内，不满足本地运行\n- C.可用区：AWS 区域内的数据中心集群，不是本地部署形态\n- D.AWS Wavelength：5G 网络边缘的部署点位，服务移动低延迟，不承载本地机房工作负载\n\n**📌 关键概念**：Outposts 三大特性：本地运行（合规驻留）+ 相同 API（一致性）+ 统一管理；「本地+云同 API」是其区别于所有其他边缘形态的独有卖点。","s":"源#651"},{"id":"D1-659","d":1,"t":"single","q":"根据 AWS 良好架构框架，哪个设计原则与可靠性支柱相关？","o":[{"l":"A","t":"测试恢复程序。"},{"l":"B","t":"更频繁地实验。"},{"l":"C","t":"在几分钟内实现全球化。"},{"l":"D","t":"分析并归因于支出。"}],"a":["A"],"e":"**✅ 为什么 A.测试恢复程序。 对**：可靠性支柱明确列出「测试恢复程序（Test recovery procedures）」设计原则——定期演练故障恢复流程，确保真实故障时恢复机制按预期工作，是题干所问的正确答案。\n\n**❌ 为什么其他选项错**：\n- B.更频繁地实验。：属于性能效率支柱的「试验新类型资源」原则\n- C.在几分钟内实现全球化。：是全球部署优势/基础设施特性，不是可靠性设计原则\n- D.分析并归因于支出。：属于成本优化支柱的原则（成本归因分析）\n\n**📌 关键概念**：支柱原则速记：可靠性=测试恢复程序+自动恢复+停止猜测容量；性能效率=更频繁实验；成本优化=分析归因支出；跨支柱选项是本类题的固定干扰套路。","s":"源#659"},{"id":"D1-663","d":1,"t":"single","q":"一家公司在全球多个 AWS 区域部署了应用程序。该公司希望提高应用程序的性能和可用性。哪项AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Global Accelerator"},{"l":"B","t":"Amazon DataZone"},{"l":"C","t":"AWS Cloud Map"},{"l":"D","t":"AWS Auto Scaling"}],"a":["A"],"e":"**✅ 为什么 A.AWS Global Accelerator 对**：Global Accelerator 提供静态任播 IP，经 AWS 全球骨干网把用户流量导向最优健康区域，单区域故障时秒级故障转移，同时提升性能与可用性，正符合「多区域应用+提高性能可用性」的要求。\n\n**❌ 为什么其他选项错**：\n- B.Amazon DataZone：数据目录与数据共享治理服务，与流量调度无关\n- C.AWS Cloud Map：服务发现（登记与查找服务端点），不做全球流量路由\n- D.AWS Auto Scaling：自动扩缩资源容量，不解决跨区域用户接入路径优化\n\n**📌 关键概念**：多区域应用的流量层方案 = Global Accelerator（静态 IP+骨干网加速+故障转移）；Cloud Map 管「找到服务」、Auto Scaling 管「够不够用」、DataZone 管「数据共享」。","s":"源#663"},{"id":"D1-666","d":1,"t":"single","q":"AWS 云计算的哪个选项可以最小化可变成本？","o":[{"l":"A","t":"高可用性"},{"l":"B","t":"规模经济"},{"l":"C","t":"全球覆盖"},{"l":"D","t":"敏捷性"}],"a":["B"],"e":"**✅ 为什么 B.规模经济 对**：规模经济让 AWS 以聚合的海量需求实现采购与运营效率，单位计算能力成本持续下降，客户按更低单价付费，可变成本得以最小化，正符合题干要求。\n\n**❌ 为什么其他选项错**：\n- A.高可用性：是持续运行能力，与成本无关\n- C.全球覆盖：是地理网络广度，不直接降低单价\n- D.敏捷性：是快速供应与实验能力，属效率维度\n\n**📌 关键概念**：成本三连：规模经济（降单价）、CAPEX 转 OPEX（降门槛）、按需付费（免浪费）；「最小化可变成本」的表述指向规模经济。","s":"源#666"},{"id":"D1-669","d":1,"t":"multiple","q":"当公司从本地 IT 架构迁移到 AWS 云时，会获得哪些好处？（选择两项）","o":[{"l":"A","t":"减少或消除硬件故障排除、容量规划和采购的任务。"},{"l":"B","t":"消除对训练有素的 IT 人员的需求。"},{"l":"C","t":"消除对灾难恢复规划的需求。"},{"l":"D","t":"更快地部署新功能和应用程序。"},{"l":"E","t":"自动为迁移到云的所有应用程序配置安全设置。"}],"a":["A","D"],"e":"**✅ 为什么 A、D 对**：\n- A.减少或消除硬件故障排除、容量规划和采购的任务。：基础设施层由 AWS 托管，硬件运维与采购负担大幅减轻\n- D.更快地部署新功能和应用程序。：资源分钟级供应，交付节奏显著加快\n\n**❌ 为什么其他选项错**：\n- B.消除对训练有素的 IT 人员的需求。：云上仍需云技能人才做架构、安全与成本管理，并未消除\n- C.消除对灾难恢复规划的需求。：云上仍要做 DR 方案（只是部分服务提供内置容错），规划不可省\n- E.自动为迁移到云的所有应用程序配置安全设置。：安全配置仍需客户按共享责任模型自行设置\n\n**📌 关键概念**：云迁移红利 = 减负（硬件/容量/采购外包给 AWS）+ 提速（分钟级部署）；「消除 IT 人员/DR 规划/自动安全」三个「消除」都是过度绝对化陷阱。","s":"源#669"},{"id":"D1-670","d":1,"t":"multiple","q":"一家公司计划迁移到 AWS 云。该公司正在进行组织转型，并希望对客户询问和反馈更加响应。根据AWS 云采用框架（AWS CAF），该公司应该执行哪些任务来满足这些要求？（选择两项）","o":[{"l":"A","t":"重新调整团队以专注于产品和价值流。"},{"l":"B","t":"用新产品和服务创建新的价值主张。"},{"l":"C","t":"使用敏捷方法快速迭代和演进。"},{"l":"D","t":"使用新的数据和分析平台创建可操作的洞察。"},{"l":"E","t":"迁移和现代化遗留基础设施。"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A.重新调整团队以专注于产品和价值流：产品导向团队缩短与客户的反馈回路，直接提升响应度\n- C.使用敏捷方法快速迭代和演进：敏捷迭代让公司根据客户反馈快速调整产品方向\n\n**❌ 为什么其他选项错**：\n- B.用新产品和服务创建新的价值主张：是业务创新举措，不直接提升对客户询问的响应速度\n- D.使用新的数据和分析平台创建可操作的洞察：是数据平台视角的技术能力\n- E.迁移和现代化遗留基础设施：是技术现代化任务，与客户响应力无直接关联\n\n**📌 关键概念**：客户响应力双抓手：组织侧（产品与价值流重组）+ 方法侧（敏捷迭代）；本题与 D1-507 同源，多选版本把「敏捷方法」补为第二个正确项。","s":"源#670"},{"id":"D1-676","d":1,"t":"single","q":"AWS 云采用框架（AWS CAF）的哪个视角专注于提供实时洞察并回答有关战略的问题？","o":[{"l":"A","t":"运营"},{"l":"B","t":"人员"},{"l":"C","t":"业务"},{"l":"D","t":"平台"}],"a":["C"],"e":"**✅ 为什么 C.业务 对**：CAF 业务（Business）视角包含战略管理能力，负责将云投资与业务目标对齐、提供实时业务洞察并回答战略性问题，正符合「实时洞察+战略问题」的描述。\n\n**❌ 为什么其他选项错**：\n- A.运营：运营视角负责云上系统的运行与监控，不管战略洞察\n- B.人员：人员视角聚焦劳动力转型与文化技能\n- D.平台：平台视角聚焦技术架构与数据平台建设\n\n**📌 关键概念**：业务视角 = 「业务价值中枢」：战略管理、产品管理、数据科学、实时洞察；「战略」关键词出现即锁定业务（商业）视角。","s":"源#676"},{"id":"D1-678","d":1,"t":"single","q":"AWS 良好架构框架的哪个概念代表系统在遇到操作问题时保持功能？","o":[{"l":"A","t":"一致性"},{"l":"B","t":"弹性"},{"l":"C","t":"耐久性"},{"l":"D","t":"延迟"}],"a":["B"],"e":"**✅ 为什么 B.弹性 对**：Well-Architected 语境中，弹性（Resilience，韧性）指系统遭遇操作问题（组件故障、瞬时网络错误、配置失误）时仍能保持功能运行或快速恢复的能力，是可靠性支柱的核心追求，符合题干描述。\n\n**❌ 为什么其他选项错**：\n- A.一致性：指数据或行为的一致性属性，不是抗扰动能力\n- C.耐久性：指数据长期存储不丢失的能力（如 S3 持久性），与功能保持无关\n- D.延迟：是响应时间指标，不是韧性概念\n\n**📌 关键概念**：易混词辨析：Resilience（韧性）= 出问题仍工作/能恢复；Durability（持久性）= 数据不丢；Availability（可用性）= 持续可用；中文都带「性」，按英文本义区分。","s":"源#678"},{"id":"D1-679","d":1,"t":"single","q":"AWS 良好架构框架的哪个支柱专注于从服务中断中自动恢复的能力？","o":[{"l":"A","t":"安全性"},{"l":"B","t":"性能效率"},{"l":"C","t":"运营卓越"},{"l":"D","t":"可靠性"}],"a":["D"],"e":"**✅ 为什么 D.可靠性 对**：可靠性（Reliability）支柱的定义即「从基础设施或服务中断中自动恢复的能力」，通过容错设计、备份恢复与自动故障转移实现，与题干表述逐字对应。\n\n**❌ 为什么其他选项错**：\n- A.安全性：聚焦权限与防护，不管中断恢复\n- B.性能效率：聚焦资源选型与效率，不涉及恢复机制\n- C.运营卓越：聚焦运行流程改进，「自动恢复」归属可靠性支柱\n\n**📌 关键概念**：可靠性支柱最强信号词：「从中断中自动恢复（automatically recover from disruptions）」；四大支柱职责一句话区分：安全管防护、性能管效率、运营管流程、可靠管恢复。","s":"源#679"},{"id":"D1-687","d":1,"t":"single","q":"哪个设计原则与 AWS 良好架构框架的性能效率支柱相一致？","o":[{"l":"A","t":"使用无服务器架构"},{"l":"B","t":"水平扩展"},{"l":"C","t":"测量工作负载的成本"},{"l":"D","t":"使用托管服务"}],"a":["A"],"e":"**✅ 为什么 A.使用无服务器架构 对**：性能效率支柱明确将「采用无服务器架构（Go serverless）」列为设计原则——托管服务随需自动伸缩、免管服务器，让资源利用与性能成本最优化，正符合题干要求。\n\n**❌ 为什么其他选项错**：\n- B.水平扩展：横向扩容是可靠性的扩展策略（多实例冗余），不是性能效率支柱列名原则\n- C.测量工作负载的成本：成本度量属成本优化支柱原则\n- D.使用托管服务：托管服务是广泛最佳实践，列为可靠性支柱相关原则而非性能效率支柱列名项\n\n**📌 关键概念**：性能效率支柱原则组：无服务器架构、更频繁试验新资源类型、机械化（mechanize）；干扰项常拿其他支柱原则（成本测量、水平扩展）混入。","s":"源#687"},{"id":"D1-703","d":1,"t":"single","q":"一家公司正计划迁移到 AWS 云。该公司需要了解现有的本地使用情况和配置。该公司目前还不想将其工作负载复制到 AWS。 哪个 AWS 服务或工具能满足这些要求？","o":[{"l":"A","t":"AWS 应用发现服务"},{"l":"B","t":"AWS 应用迁移服务"},{"l":"C","t":"云迁移工厂"},{"l":"D","t":"AWS 迁移中心"}],"a":["A"],"e":"**✅ 为什么 A.AWS 应用发现服务 对**：Application Discovery Service 只做「采集与评估」——收集本地使用情况与配置数据用于迁移规划，本身不迁移任何工作负载，正符合「了解现状+暂不迁移」的双重要求。\n\n**❌ 为什么其他选项错**：\n- B.AWS 应用迁移服务（MGN）：直接执行工作负载复制与割接迁移，超出「暂不迁移」边界\n- C.云迁移工厂：迁移工厂是方法论与工具集（含实施），非单纯发现工具\n- D.AWS 迁移中心（Migration Hub）：跟踪与管理已启动的迁移任务进度，不做本地数据采集\n\n**📌 关键概念**：只评估不迁移 = 发现工具（ADS）；一旦要动真格搬工作负载 = MGN/DataSync/DMS；进度看板 = Migration Hub；按「是否触碰工作负载」划分工具边界。","s":"源#703"},{"id":"D1-704","d":1,"t":"single","q":"一家公司希望允许其员工在家远程工作。该公司的员工使用 Windows 或 Linux 桌面。公司的员工需要通过任何支持的设备随时随地访问。 哪个 AWS 服务能满足这些要求？","o":[{"l":"A","t":"Amazon Workspaces"},{"l":"B","t":"Amazon AppStream 2.0"},{"l":"C","t":"Amazon Keyspaces（适用于 Apache Cassandra）"},{"l":"D","t":"AWS Cloud9"}],"a":["A"],"e":"**✅ 为什么 A.Amazon Workspaces 对**：WorkSpaces 是完全托管的虚拟桌面（DaaS）服务，支持 Windows 与 Linux 桌面，员工用任意受支持的设备随时随地登录使用，正符合「远程办公+双系统桌面+任意设备访问」的要求。\n\n**❌ 为什么其他选项错**：\n- B.Amazon AppStream 2.0：流式传输单个应用（应用虚拟化），不是完整虚拟桌面\n- C.Amazon Keyspaces（适用于 Apache Cassandra）：托管 Cassandra 数据库服务，与桌面无关\n- D.AWS Cloud9：云端 IDE 开发环境，不是通用办公桌面\n\n**📌 关键概念**：远程桌面三选一：完整桌面 = WorkSpaces（DaaS）；单个应用流 = AppStream 2.0；开发环境 = Cloud9；题干「Windows/Linux 桌面+任意设备」指向 WorkSpaces。","s":"源#704"},{"id":"D1-709","d":1,"t":"single","q":"一家公司正在了解 AWS 云采用框架（AWS CAF）的各个视角。AWS CAF 的哪个视角涉及战略管理能力？","o":[{"l":"A","t":"商业观点"},{"l":"B","t":"人员观点"},{"l":"C","t":"治理观点"},{"l":"D","t":"运营观点"}],"a":["A"],"e":"**✅ 为什么 A.商业观点 对**：CAF 商业（Business）视角包含战略管理（Strategic Management）能力，负责战略规划、将云计划与业务目标对齐，正符合「涉及战略管理能力」的提问。\n\n**❌ 为什么其他选项错**：\n- B.人员观点：聚焦劳动力、文化、技能转型，不管战略管理\n- C.治理观点：负责政策、风险与项目治理框架，战略管理归商业\n- D.运营观点：负责云上系统运行监控，与战略能力无关\n\n**📌 关键概念**：战略管理是商业视角的招牌能力（与产品管理、数据科学并列）；治理视角管「规则与风险」，商业视角管「战略与价值」，一字之差分野清晰。","s":"源#709"},{"id":"D2-002","d":2,"t":"single","q":"一家公司在 Amazon EC2 实例上部署了应用程序。公司需要评估应用程序的漏洞，并必须识别不符合最佳实践的基础设施部署。公司可以使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS Trusted Advisor"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"AWS Config"},{"l":"D","t":"Amazon GuardDuty"}],"a":["B"],"e":"**✅ 为什么 B.Amazon Inspector 对**：Amazon Inspector 是托管式漏洞管理服务，自动扫描 EC2 实例等负载的工作负载漏洞，并能识别偏离安全最佳实践的基础设施部署，正符合「评估漏洞+识别不符合最佳实践的基础设施」两项要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS Trusted Advisor：提供成本/性能/安全等五类最佳实践建议，但不做漏洞扫描\n- C. AWS Config：记录资源配置变更与合规评估，不扫描应用漏洞\n- D. Amazon GuardDuty：威胁检测服务，监控恶意活动，不评估漏洞\n\n**📌 关键概念**：漏洞扫描对号 Inspector；配置合规看 Config；威胁检测看 GuardDuty；「评估漏洞」是 Inspector 的标志性题眼。","s":"源#2"},{"id":"D2-004","d":2,"t":"single","q":"根据安全最佳实践，应该如何使 Amazon EC2 实例能够访问 Amazon S3 存储桶？","o":[{"l":"A","t":"在应用程序中直接硬编码 IAM 用户的密钥和访问密钥，并上传文件。"},{"l":"B","t":"在 EC2 实例上将 IAM 用户的密钥和访问密钥存储在文本文件中，读取密钥，然后上传文件。"},{"l":"C","t":"让 EC2 实例假定角色以获取上传文件的权限。"},{"l":"D","t":"修改 S3 存储桶策略，以便任何服务随时都可以上传到其中。"}],"a":["C"],"e":"**✅ 为什么 C. 让 EC2 实例假定角色以获取上传文件的权限 对**：EC2 实例通过 IAM 角色获取临时凭证访问 S3，遵循最小权限原则，避免长期密钥落入实例，是官方推荐的安全实践。\n\n**❌ 为什么其他选项错**：\n- A. 在应用程序中直接硬编码 IAM 用户的密钥和访问密钥：长期密钥写进代码易泄露，违反安全实践\n- B. 在 EC2 实例上以文本文件存储密钥：明文密钥文件泄露风险更高\n- D. 修改 S3 存储桶策略使任何服务随时上传：权限过宽，违背最小权限原则\n\n**📌 关键概念**：实例访问 AWS 服务的正确姿势是「附加 IAM 角色」——角色提供临时凭证且无需把长期密钥放进实例；硬编码、明文存储、开放存储桶全是反例。","s":"源#4"},{"id":"D2-005","d":2,"t":"single","q":"在 AWS 共享责任模型下，以下哪项是客户使用 Amazon DynamoDB 时的责任？","o":[{"l":"A","t":"DynamoDB 的物理安全"},{"l":"B","t":"DynamoDB 的补丁"},{"l":"C","t":"对 DynamoDB 表的访问"},{"l":"D","t":"DynamoDB 中数据的静态加密"}],"a":["C"],"e":"**✅ 为什么 C. 对 DynamoDB 表的访问 对**：共享责任模型下，客户负责「云中安全」，管理对 DynamoDB 表的访问权限（IAM 策略与角色配置）属于客户责任。\n\n**❌ 为什么其他选项错**：\n- A. DynamoDB 的物理安全：数据中心物理安全由 AWS 负责\n- B. DynamoDB 的补丁：底层基础设施补丁由 AWS 负责\n- D. DynamoDB 中数据的静态加密：托管服务静态加密由 AWS 负责（客户可选自带密钥）\n\n**📌 关键概念**：无服务器/托管服务（DynamoDB、RDS、Lambda）中客户责任收敛为「配置与访问管理」；物理、补丁、基础设施一律归 AWS；客户同时负责数据访问策略的审查与日常维护。","s":"源#5"},{"id":"D2-010","d":2,"t":"multiple","q":"使用 AWS Trusted Advisor 的以下哪些好处？（选择两项。）","o":[{"l":"A","t":"提供高性能容器编排"},{"l":"B","t":"创建和轮换加密密钥"},{"l":"C","t":"通过主动监控 AWS 环境来检测未充分利用的资源以节省成本"},{"l":"D","t":"通过主动监控 AWS 环境提高安全性"},{"l":"E","t":"在 AWS 资源中实施强制标记"}],"a":["C","D"],"e":"**✅ 为什么 C、D 对**：\n- C. 通过主动监控 AWS 环境来检测未充分利用的资源以节省成本：Trusted Advisor 的成本优化检查会标记闲置资源，帮用户省钱\n- D. 通过主动监控 AWS 环境提高安全性：TA 提供安全类检查（如开放端口、S3 公开访问）并给出修复建议\n\n**❌ 为什么其他选项错**：\n- A. 提供高性能容器编排：容器编排是 ECS/EKS 的能力，Trusted Advisor 不编排容器\n- B. 创建和轮换加密密钥：密钥管理是 KMS 的功能\n- E. 在 AWS 资源中实施强制标记：强制标记要靠 Organization SCP 或 Config 规则\n\n**📌 关键概念**：Trusted Advisor 核心是「检查+建议」：成本、性能、安全、容错、服务限制五类检查；不做容器编排、不做密钥管理、不做强制标记。","s":"源#10"},{"id":"D2-012","d":2,"t":"single","q":"一家公司想要管理部署的 IT 服务并管理其基础设施即代码（IaC）模板。哪个 AWS 服务将满足此要求？","o":[{"l":"A","t":"AWS 资源浏览器"},{"l":"B","t":"AWS 服务目录"},{"l":"C","t":"AWS 组织"},{"l":"D","t":"AWS 系统管理器"}],"a":["B"],"e":"**✅ 为什么 B. AWS 服务目录 对**：Service Catalog 允许组织创建和管理获批的 IT 服务目录，集中治理包括 IaC 模板（CloudFormation 模板）在内的产品，正符合「管理部署的 IT 服务+管理 IaC 模板」要求。\n\n**❌ 为什么其他选项错**：\n- A. AWS 资源浏览器：用于搜索查看资源，不具备服务目录治理能力\n- C. AWS 组织：多账户分组与管理，不管理 IT 服务模板\n- D. AWS 系统管理器：运维工具（补丁、参数、会话），不是 IaC 模板治理\n\n**📌 关键概念**：Service Catalog = 企业级「服务商店」，管理员预置标准模板供团队自服务；题干「管理 IT 服务+IaC 模板」双特征直指它。","s":"源#12"},{"id":"D2-013","d":2,"t":"single","q":"哪个 AWS 服务或工具帮助用户可视化、理解和管理随时间变化的支出和使用情况？","o":[{"l":"A","t":"AWS 组织"},{"l":"B","t":"AWS 定价计算器"},{"l":"C","t":"AWS 成本探索器"},{"l":"D","t":"AWS 服务目录"}],"a":["C"],"e":"**✅ 为什么 C. AWS 成本探索器 对**：Cost Explorer 可视化 AWS 成本与用量随时间的变化，支持按服务/账户/标签筛选，还能基于历史预测未来支出，正符合「可视化、理解、管理随时间变化的支出」描述。\n\n**❌ 为什么其他选项错**：\n- A. AWS 组织：管理多账户与账单聚合，不做可视化分析\n- B. AWS 定价计算器：估价未来成本，不追踪实际历史支出\n- D. AWS 服务目录：IT 服务标准化与治理，与成本无关\n\n**📌 关键概念**：历史与趋势分析、可视化、预测 → Cost Explorer；事前估价 → Pricing Calculator；预算告警 → Budgets；账单聚合 → Organizations。","s":"源#13"},{"id":"D2-018","d":2,"t":"single","q":"一家公司在 Amazon S3 存储桶中存储敏感客户数据。公司希望保护数据免受意外删除或覆盖。公司应该使用哪个 S3 功能来满足这些要求？","o":[{"l":"A","t":"S3 生命周期规则"},{"l":"B","t":"S3 版本控制"},{"l":"C","t":"S3 存储桶策略"},{"l":"D","t":"S3 服务器端加密"}],"a":["B"],"e":"**✅ 为什么 B. S3 版本控制 对**：版本控制保留对象每次覆盖/删除前的旧版本，可随时回滚恢复，专门防止意外删除或覆盖。\n\n**❌ 为什么其他选项错**：\n- A. S3 生命周期规则：按龄自动转储/删除对象，不提供版本恢复\n- C. S3 存储桶策略：控制访问权限，不防删除覆盖\n- D. S3 服务器端加密：加密静态数据，不涉及版本保留\n\n**📌 关键概念**：防误删误覆盖的核心是 S3 Versioning（版本控制）+ MFA Delete；生命周期只管「过期清理」，作用方向相反；可先启用版本控制保留历史，再配合生命周期规则控制存储成本，两者组合使用。","s":"源#18"},{"id":"D2-019","d":2,"t":"single","q":"哪个 AWS 服务提供了管理基础设施即代码的能力？","o":[{"l":"A","t":"AWS CodePipeline"},{"l":"B","t":"AWS CodeDeploy"},{"l":"C","t":"AWS 直接连接"},{"l":"D","t":"AWS CloudFormation"}],"a":["D"],"e":"**✅ 为什么 D. AWS CloudFormation 对**：CloudFormation 用模板（YAML/JSON）把基础设施声明为代码，支持自动化、可重复地建模配置与管理资源，是 AWS 上 IaC 的标准服务。\n\n**❌ 为什么其他选项错**：\n- A. AWS CodePipeline：持续交付流水线，编排构建部署\n- B. AWS CodeDeploy：部署应用代码到计算服务\n- C. AWS Direct Connect：本地与云专用网络连接\n\n**📌 关键概念**：IaC 的招牌工具是 CloudFormation（声明式模板）与 CDK（代码式）；CodePipeline/CodeDeploy 属 CI/CD 部署链，Direct Connect 是网络服务，均与「模板管理资源」无关；CloudFormation 支持变更集预览变更影响、嵌套模板复用组件，编排更可控；资源栈支持回滚与删除保护，便于安全变更。","s":"源#19"},{"id":"D2-023","d":2,"t":"single","q":"一家公司想要保护其 AWS 云信息、系统和资产，同时执行风险评估和缓解任务。哪个AWS 良好架构框架的支柱支持这些目标？","o":[{"l":"A","t":"可靠性"},{"l":"B","t":"安全"},{"l":"C","t":"运营卓越"},{"l":"D","t":"性能效率"}],"a":["B"],"e":"**✅ 为什么 B. 安全 对**：Well-Architected 安全支柱专注保护信息、系统与资产，涵盖身份与访问管理、数据保护、风险评估与缓解，正对应题干「保护云信息、系统和资产+风险评估与缓解」。\n\n**❌ 为什么其他选项错**：\n- A. 可靠性：应对故障与恢复能力\n- C. 运营卓越：监控与流程改进\n- D. 性能效率：资源合理选型与高效使用\n\n**📌 关键概念**：安全支柱 = 「保护信息/系统/资产」+ 风险评估缓解；可靠性讲故障恢复、运营卓越讲流程、性能效率讲资源优化。","s":"源#23"},{"id":"D2-026","d":2,"t":"single","q":"一家公司有一个 AWS 账户。公司想要审计其密码和访问密钥轮换的详细信息以进行合规性目的。哪个AWS 服务或工具将满足此要求？","o":[{"l":"A","t":"IAM 访问分析器"},{"l":"B","t":"AWS 工件"},{"l":"C","t":"IAM 凭据报告"},{"l":"D","t":"AWS AWS Audit Manager"}],"a":["C"],"e":"**✅ 为什么 C. IAM 凭据报告 对**：IAM Credential Report 提供账号内全部 IAM 用户的密码与访问密钥轮换、最后使用等详情，正好用于合规审计轮换情况。\n\n**❌ 为什么其他选项错**：\n- A. IAM 访问分析器：分析外部资源共享，不审计凭证轮换\n- B. AWS 工件：提供合规报告与认证文档，不检查自家账户凭证\n- D. AWS Audit Manager：审计框架自动化，但题干特指密码/密钥轮换明细，Credential Report 更贴切\n\n**📌 关键概念**：要审计「谁多久没轮换凭证」→ IAM 凭据报告；要发现「外部共享」→ Access Analyzer；要下载合规证书 → Artifact。","s":"源#26"},{"id":"D2-028","d":2,"t":"single","q":"哪个 AWS 服务或资源提供了 AWS 收到的最常见的安全相关问题的答案？","o":[{"l":"A","t":"AWS 工件"},{"l":"B","t":"Amazon Connect"},{"l":"C","t":"AWS 聊天机器人"},{"l":"D","t":"AWS 知识中心"}],"a":["D"],"e":"**✅ 为什么 D. AWS 知识中心 对**：AWS Knowledge Center 汇集了官方对客户高频问题的解答（文章、视频），其中包含大量常见安全问题的标准答复，正符合「AWS 收到的最常见安全问题的答案」的描述。\n\n**❌ 为什么其他选项错**：\n- A. AWS 工件：提供合规性报告与认证文档，不是问答知识库\n- B. Amazon Connect：云联络中心服务，与安全知识无关\n- C. AWS 聊天机器人：泛指对话机器人产品，不是官方知识库资源\n\n**📌 关键概念**：「常见问题+官方答案」= AWS Knowledge Center（知识中心）；Artifact 是合规报告门户，Connect 是呼叫中心；知识中心支持按服务与分类浏览，覆盖安全、网络、存储等主题。","s":"源#28"},{"id":"D2-032","d":2,"t":"single","q":"用户需要通过 AWS CLI 或 AWS API 以编程方式访问 AWS 资源。哪个选项将为用户提供适当的访问权限？","o":[{"l":"A","t":"Amazon Inspector"},{"l":"B","t":"访问密钥"},{"l":"C","t":"SSH 公钥"},{"l":"D","t":"AWS 密钥管理服务 (AWS KMS) 密钥"}],"a":["B"],"e":"**✅ 为什么 B. 访问密钥 对**：访问密钥（Access Key ID + Secret Access Key）关联 IAM 用户，用于 AWS CLI/SDK/API 的编程方式签名请求，正符合「以编程方式访问 AWS 资源」的场景。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Inspector：漏洞扫描服务，与编程访问无关\n- C. SSH 公钥：用于登录 EC2 实例的 SSH 认证，不是 AWS API 凭证\n- D. AWS KMS 密钥：加密密钥，不用于 API 身份认证\n\n**📌 关键概念**：编程访问（CLI/SDK/API）→ 访问密钥；控制台登录 → 用户名+密码+MFA；实例内授权 → IAM 角色；SSH 公钥只管 EC2 登录；访问密钥应妥善保管并定期轮换，一旦泄露须立即删除重建。","s":"源#32"},{"id":"D2-035","d":2,"t":"single","q":"一家公司需要阻止 SQL 注入攻击。哪个 AWS 服务或功能可以满足这个要求？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"AWS 盾牌"},{"l":"C","t":"网络 ACL"},{"l":"D","t":"安全组"}],"a":["A"],"e":"**✅ 为什么 A. AWS WAF 对**：AWS WAF（Web 应用防火墙）用可配置规则过滤 Web 请求，可阻止 SQL 注入、XSS 等常见攻击，正是防 SQL 注入的专用服务。\n\n**❌ 为什么其他选项错**：\n- B. AWS 盾牌（Shield）：分布式拒绝服务（DDoS）防护，不针对应用层注入攻击\n- C. 网络 ACL：VPC 子网层状态无关过滤，不做应用层检测\n- D. 安全组：实例级状态防火墙，不识别 SQL 注入特征\n\n**📌 关键概念**：SQL 注入/XSS 等应用层攻击 → WAF（可配规则集）；DDoS 大流量攻击 → Shield；VPC 内网流量控制 → NACL/安全组；WAF 常与 CloudFront、ALB 组合使用，构成多层 Web 防护；对已部署的 WAF 可随时调整规则并查看拦截日志，快速响应新攻击。","s":"源#35"},{"id":"D2-036","d":2,"t":"single","q":"哪个 AWS 服务或功能可以识别 Amazon S3 存储桶或 IAM 角色是否已与外部实体共享？","o":[{"l":"A","t":"AWS 服务目录"},{"l":"B","t":"AWS 系统管理器"},{"l":"C","t":"AWS IAM 访问分析器"},{"l":"D","t":"AWS 组织"}],"a":["C"],"e":"**✅ 为什么 C. AWS IAM 访问分析器 对**：Access Analyzer 持续分析资源策略，识别 S3 存储桶、IAM 角色等是否与外部实体共享访问权限，正符合题干要求。\n\n**❌ 为什么其他选项错**：\n- A. AWS 服务目录：IT 服务标准化治理，不分析资源共享\n- B. AWS 系统管理器：运维与参数管理，不分析访问策略\n- D. AWS 组织：多账户管理与策略下发，不识别外部共享\n\n**📌 关键概念**：识别「谁与外部共享了资源」→ IAM Access Analyzer（对外部主体范围分析）；评估资源配置合规 → Config；威胁告警 → GuardDuty；Access Analyzer 还提供未使用访问分析，可收敛闲置权限。","s":"源#36"},{"id":"D2-037","d":2,"t":"single","q":"一位云从业者在迁移环境到 AWS 云之前需要获得 AWS 合规性报告。这些报告如何生成？","o":[{"l":"A","t":"联系 AWS 合规团队。"},{"l":"B","t":"从 AWS 工件下载报告。"},{"l":"C","t":"向 AWS 支持开启案例。"},{"l":"D","t":"使用Amazon Macie 生成报告。"}],"a":["B"],"e":"**✅ 为什么 B. 从 AWS 工件下载报告 对**：AWS Artifact 是自助合规门户，按需提供合规性报告、认证与保证文档，迁移前获取 AWS 合规性报告最便捷的方式就是从 Artifact 下载。\n\n**❌ 为什么其他选项错**：\n- A. 联系 AWS 合规团队：非自助常规路径，不适用于按需取报告\n- C. 向 AWS 支持开启案例：工单流程不用于直接获取合规报告\n- D. 使用 Amazon Macie 生成报告：Macie 是数据敏感信息发现服务，不产出合规报告\n\n**📌 关键概念**：合规报告下载通道 = AWS Artifact（自助门户）；合规相关知识点常考「在哪里下载报告」——答案几乎总是 Artifact。","s":"源#37"},{"id":"D2-039","d":2,"t":"single","q":"一家公司正在 AWS 账户上设置 AWS 身份和访问管理 (IAM)。哪个建议符合 IAM安全最佳实践？","o":[{"l":"A","t":"使用帐户根用户访问密钥进行管理任务。"},{"l":"B","t":"授予广泛的权限，以便所有公司员工都可以访问他们需要的资源。"},{"l":"C","t":"启用多因素认证 (MF"},{"l":"D","t":"在登录过程中增加安全性。"},{"l":"E","t":"避免轮换凭证，以防止生产应用程序出现问题。"}],"a":["C"],"e":"**✅ 为什么 C. 启用多因素认证（MFA） 对**：启用 MFA 要求密码之外的第二种认证因素，是 IAM 最重要的安全最佳实践之一，即使凭证泄露也能阻止未授权访问。说明：选项 C 原文「启用多因素认证 (MF」疑似截断，按题干语境与答案 C 理解。\n\n**❌ 为什么其他选项错**：\n- A. 使用账户根用户访问密钥进行管理任务：根用户访问密钥权限过大，官方明令避免\n- B. 授予广泛的权限给所有员工：违背最小权限原则\n- D. 在登录过程中增加安全性：表述模糊，未指明 MFA 这一具体实践\n- E. 避免轮换凭证：不轮换长期凭证是安全反例\n\n**📌 关键概念**：IAM 最佳实践口诀：删根密钥、最小权限、启用 MFA、定期轮换、用角色替代长期密钥；「第二种认证因素」题眼必选 MFA。","s":"源#39"},{"id":"D2-041","d":2,"t":"single","q":"哪个服务使客户能够在其 AWS 账户中审计 API 调用？","o":[{"l":"A","t":"AWS CloudTrail"},{"l":"B","t":"AWS Trusted Advisor"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"AWS X-Ray"}],"a":["A"],"e":"**✅ 为什么 A. AWS CloudTrail 对**：CloudTrail 记录账号内 API 调用事件，提供谁在何时调用了什么 API 的审计日志，正是「审计 API 调用」的标准服务。\n\n**❌ 为什么其他选项错**：\n- B. AWS Trusted Advisor：提供最佳实践检查建议，不记录 API\n- C. Amazon Inspector：漏洞扫描，不审计 API 调用\n- D. AWS X-Ray：应用性能追踪与调试，不审计账号级 API\n\n**📌 关键概念**：API 调用审计 = CloudTrail（默认开启，最近 90 天事件历史可查）；资源变更合规 = Config；性能追踪 = X-Ray；CloudTrail 事件可投递至 S3 或 CloudWatch Logs 长期留存，支持按动作分析，是合规审计与取证的基础；事件还包含请求参数与响应状态，可用于异常行为分析。","s":"源#41"},{"id":"D2-042","d":2,"t":"single","q":"根据 AWS 共享责任模型，使用 AWS Lambda 时客户的责任是什么？","o":[{"l":"A","t":"管理 Lambda 函数内的代码"},{"l":"B","t":"确认数据中心的硬件是否正常工作"},{"l":"C","t":"修补操作系统"},{"l":"D","t":"当 Lambda 函数不再使用时关闭它们"}],"a":["A"],"e":"**✅ 为什么 A. 管理 Lambda 函数内的代码 对**：共享责任模型下客户负责「云中安全」，Lambda 中客户责任聚焦函数代码与配置（开发、部署、维护依赖）；基础设施由 AWS 托管。\n\n**❌ 为什么其他选项错**：\n- B. 确认数据中心的硬件是否正常：硬件物理层由 AWS 负责\n- C. 修补操作系统：Lambda 底层运行时与 OS 由 AWS 修补\n- D. 当 Lambda 不再使用时关闭：Lambda 无实例概念，由平台按需运行，不存在手动关闭\n\n**📌 关键概念**：无服务器客户责任 = 代码 + 配置 + IAM 权限；「打补丁、硬件、运行时」全部归 AWS；服务器场景（EC2）客户才需管理 OS 补丁。","s":"源#42"},{"id":"D2-044","d":2,"t":"single","q":"以下哪个 AWS 服务可以免费使用？","o":[{"l":"A","t":"Amazon SageMaker"},{"l":"B","t":"AWS Config"},{"l":"C","t":"AWS 组织"},{"l":"D","t":"Amazon CloudWatch"}],"a":["C"],"e":"**✅ 为什么 C. AWS 组织 对**：AWS Organizations 免费提供，用于整合与集中管理多个账户，费用只在成员账户实际使用资源时产生。\n\n**❌ 为什么其他选项错**：\n- A. Amazon SageMaker：机器学习平台按用量计费\n- B. AWS Config：按配置项记录数计费\n- D. Amazon CloudWatch：按指标、日志存储量计费\n\n**📌 关键概念**：账户管理面服务（Organizations、IAM、CloudFormation 等）通常免费，数据面/计算/存储服务几乎都收费；考「免费」题要选管理与治理类服务；组织内 SCP 可实现多账户统一治理，让账号边界保持一致；组织可把多账户账单合并，统一查看与分摊成本。","s":"源#44"},{"id":"D2-052","d":2,"t":"single","q":"一家公司正在开发使用多个 AWS 服务的应用程序。该应用程序需要使用临时的、有限权限的凭证对其他 AWS API 进行身份验证。公司应该使用哪个 AWS 服务或功能来满足这些身份验证要求？","o":[{"l":"A","t":"Amazon API 网关"},{"l":"B","t":"IAM 用户"},{"l":"C","t":"AWS 安全令牌服务 (AWS STS)"},{"l":"D","t":"IAM 实例配置文件"}],"a":["C"],"e":"**✅ 为什么 C. AWS 安全令牌服务（AWS STS） 对**：STS 签发临时、有限权限的安全凭证，供应用对其他 AWS API 完成身份认证，正符合「临时凭证、无需暴露长期密钥」的需求。\n\n**❌ 为什么其他选项错**：\n- A. Amazon API 网关：构建 API 入口，不签发凭证\n- B. IAM 用户：长期凭证，不是临时的\n- D. IAM 实例配置文件：只是让 EC2 角色凭证可用，不提供跨服务通用的临时认证\n\n**📌 关键概念**：临时凭证 → STS（AssumeRole 等 API）；长期凭证 → IAM 用户访问密钥；「临时+有限权限」两个关键词锁定 STS；STS 也是 AssumeRole、SAML 联邦与跨账户访问的底层机制，应用广泛。","s":"源#52"},{"id":"D2-053","d":2,"t":"single","q":"哪个 AWS 服务是一个云安全态势管理 (CSPM) 服务，它以标准化格式聚合来自各种AWS 服务和合作伙伴产品警报？","o":[{"l":"A","t":"AWS 安全中心"},{"l":"B","t":"AWS 可信顾问"},{"l":"C","t":"Amazon EventBridge"},{"l":"D","t":"Amazon GuardDuty"}],"a":["A"],"e":"**✅ 为什么 A. AWS 安全中心 对**：AWS Security Hub 是 CSPM 服务，汇总 AWS 各服务与合作伙伴的安全告警并标准化（如 ASFF 格式），执行最佳实践检查，正符合题干「标准化聚合各种来源警报」。\n\n**❌ 为什么其他选项错**：\n- B. AWS Trusted Advisor：提供检查建议但非警报聚合中心\n- C. Amazon EventBridge：事件总线，不属于安全态势管理\n- D. Amazon GuardDuty：威胁检测生成告警的源头之一，不是聚合中心\n\n**📌 关键概念**：CSPM 聚合中心 = Security Hub（统一收口 GuardDuty、Inspector、Macie 等告警）；GuardDuty 是告警源不是聚合器；EventBridge 是通用事件路由；Security Hub 支持统一启用与态势评分，是安全治理入口。","s":"源#53"},{"id":"D2-054","d":2,"t":"single","q":"哪个 AWS 服务始终免费提供？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"AWS 身份和访问管理 (IAM)"},{"l":"C","t":"弹性负载均衡器"},{"l":"D","t":"AWS WAF"}],"a":["B"],"e":"**✅ 为什么 B. AWS 身份和访问管理（IAM） 对**：IAM 允许创建用户/组/角色管理访问，且对 AWS 客户始终免费提供（即使付费账户也不单独收 IAM 费）。\n\n**❌ 为什么其他选项错**：\n- A. Amazon S3：存储按容量/请求数收费\n- C. 弹性负载均衡器：按运行小时与数据量计费\n- D. AWS WAF：按规则数与请求数计费\n\n**📌 关键概念**：IAM 永久免费（Access Analyzer、CloudWatch 基础指标、VPC 基础组件等也常免费）；数据库/存储/计算服务都付费；IAM 的常规用户、组、角色管理均免费，仅部分高级能力额外计费；IAM 的权限边界与策略模拟工具也免费，便于安全调试。","s":"源#54"},{"id":"D2-056","d":2,"t":"single","q":"一家公司正在使用 Amazon DynamoDB。根据 AWS 共享责任模型，公司的哪项任务是其责任？","o":[{"l":"A","t":"修补操作系统。"},{"l":"B","t":"配置主机。"},{"l":"C","t":"管理数据库访问权限。"},{"l":"D","t":"保护操作系统安全。"}],"a":["C"],"e":"**✅ 为什么 C. 管理数据库访问权限 对**：共享责任模型下，DynamoDB 客户负责「云中安全」，管理对表的访问权限（配置 IAM 策略与角色、实施最小权限）属于客户责任，与 D2-005 同类考点。\n\n**❌ 为什么其他选项错**：\n- A. 修补操作系统：DynamoDB 底层基础设施由 AWS 负责\n- B. 配置主机：托管服务不暴露主机，主机配置由 AWS 负责\n- D. 保护操作系统安全：基础设施安全归 AWS（原 e 已为超长 AI 文本，已重写）\n\n**📌 关键概念**：托管数据服务的客户责任清单：访问管理、数据加密策略选择、备份配置、补丁与基础设施全归 AWS；「访问权限」永远是客户责任题的首选答案。","s":"源#56"},{"id":"D2-058","d":2,"t":"single","q":"哪个 AWS 服务使用户能够发现并保护存储在 Amazon S3 存储桶中的敏感数据？","o":[{"l":"A","t":"Amazon Macie"},{"l":"B","t":"Amazon Detective"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"AWS IAM 访问分析器"}],"a":["A"],"e":"**✅ 为什么 A. Amazon Macie 对**：Macie 使用机器学习自动发现、分类并保护 S3 中的敏感数据（如 PII），正符合「发现并保护 S3 存储桶中的敏感数据」。\n\n**❌ 为什么其他选项错**：\n- B. Amazon Detective：安全调查分析（关联威胁数据）\n- C. Amazon GuardDuty：威胁检测告警\n- D. AWS IAM 访问分析器：分析外部资源共享\n\n**📌 关键概念**：S3 敏感数据发现 → Macie（机器学习+模式匹配）；威胁检测 → GuardDuty；调查分析 → Detective；资源外共享 → Access Analyzer；Macie 自动输出敏感数据发现，并可与 Security Hub 联动处置；发现结果可按严重程度分级，便于优先处置高风险数据。","s":"源#58"},{"id":"D2-060","d":2,"t":"single","q":"哪个 AWS 服务可以识别 Amazon EC2 实例何时被终止？","o":[{"l":"A","t":"AWS 身份和访问管理 (IAM)"},{"l":"B","t":"AWS CloudTrail"},{"l":"C","t":"AWS 计算优化器"},{"l":"D","t":"Amazon EventBridge"}],"a":["B"],"e":"**✅ 为什么 B. AWS CloudTrail 对**：CloudTrail 记录账号内 API 事件，EC2 实例被终止的 TerminateInstances 调用会留下审计日志，可据此识别终止时间与发起者。\n\n**❌ 为什么其他选项错**：\n- A. AWS IAM：身份与权限管理，不记录资源变更事件\n- C. AWS 计算优化器：分析实例利用率的建议工具\n- D. Amazon EventBridge：事件路由，需要先有事件源产生事件\n\n**📌 关键概念**：「识别资源被终止/创建/修改的 API 行为」→ CloudTrail；CloudWatch 看指标告警，Config 看配置漂移，EventBridge 做事件驱动；配合 CloudTrail 事件可定位终止实例的操作者与源 IP，便于回溯；审计日志默认保留 90 天，满足多数回溯需求。","s":"源#60"},{"id":"D2-065","d":2,"t":"single","q":"一家公司想要监控允许对特定端口的无限制访问的配置错误的安全组。哪个 AWS 服务将满足这个要求？","o":[{"l":"A","t":"AWS 可信顾问"},{"l":"B","t":"Amazon CloudWatch"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"AWS 健康仪表板"}],"a":["A"],"e":"**✅ 为什么 A. AWS Trusted Advisor 对**：Trusted Advisor 的安全检查中有一项专门检查「对特定端口无限制访问的安全组」，可标记过度宽松规则，正符合「监控允许无限制访问端口的安全组」。\n\n**❌ 为什么其他选项错**：\n- B. Amazon CloudWatch：监控指标与日志，不检查安全组规则\n- C. Amazon GuardDuty：检测威胁活动，不做配置检查\n- D. AWS 健康仪表板：服务运行状态，与安全组无关\n\n**📌 关键概念**：安全组「过宽开放」检查 → Trusted Advisor（安全检查项）；实时网络流量威胁 → GuardDuty；资源合规 → Config；Health Dashboard 只管 AWS 服务状态；TA 安全检查还包括公开 S3 桶、根用户 MFA 缺失等高风险项。","s":"源#65"},{"id":"D2-069","d":2,"t":"single","q":"哪个 AWS 服务提供命令行访问 AWS 工具和资源，直接从 Web 浏览器？","o":[{"l":"A","t":"AWS CloudHSM"},{"l":"B","t":"AWS CloudShell"},{"l":"C","t":"Amazon WorkSpaces"},{"l":"D","t":"AWS Cloud Map"}],"a":["B"],"e":"**✅ 为什么 B. AWS CloudShell 对**：CloudShell 是浏览器内的 CLI 环境，登录控制台即可直接运行 AWS CLI 与工具，无需本地安装，正符合「浏览器命令行访问 AWS」。\n\n**❌ 为什么其他选项错**：\n- A. AWS CloudHSM：硬件安全模块服务，与命令行无关\n- C. Amazon WorkSpaces：虚拟桌面，不是命令行工具\n- D. AWS Cloud Map：服务发现，不是终端\n\n**📌 关键概念**：浏览器内命令行 = CloudShell（零安装、预置凭证）；本地命令行 = 安装 AWS CLI；CloudHSM 是加密硬件，WorkSpaces 是云桌面；CloudShell 预置 5GB 存储与已登录凭证，开箱即用；文件可持久化保存，适合在浏览器中执行日常运维脚本。","s":"源#69"},{"id":"D2-072","d":2,"t":"single","q":"一家公司想要为数据库用户凭证建立轮换计划。哪个 AWS 服务将以最小的运营开销支持这一要求？","o":[{"l":"A","t":"AWS 系统管理员"},{"l":"B","t":"AWS 密钥管理器"},{"l":"C","t":"AWS 许可证管理器"},{"l":"D","t":"AWS 托管服务"}],"a":["B"],"e":"**✅ 为什么 B. AWS 密钥管理器 对**：AWS Secrets Manager 专门存储并自动轮换数据库凭证、API 密钥等敏感信息，托管式轮换降低运维开销，正符合「为数据库凭证建立轮换计划+最小运营开销」。\n\n**❌ 为什么其他选项错**：\n- A. AWS 系统管理器：运维管理工具，不具备自动凭证轮换\n- C. AWS 许可证管理器：管理软件许可，与凭证无关\n- D. AWS 托管服务：泛指托管服务，不针对凭证轮换\n\n**📌 关键概念**：自动凭证轮换 + 托管 → Secrets Manager；参数存储（Parameter Store）管配置但轮换能力弱；KMS 管加密密钥不是凭证。","s":"源#72"},{"id":"D2-074","d":2,"t":"single","q":"哪个 AWS 服务用于为 Amazon EBS 提供加密？","o":[{"l":"A","t":"AWS 证书管理器"},{"l":"B","t":"AWS 系统管理员"},{"l":"C","t":"AWS 密钥管理服务 (AWS KMS)"},{"l":"D","t":"AWS 配置"}],"a":["C"],"e":"**✅ 为什么 C. AWS 密钥管理服务（AWS KMS） 对**：KMS 是托管密钥服务，创建与管控加密密钥，与 EBS 无缝集成提供静态加密（EBS 默认也可用 AWS 托管密钥），正符合「为 EBS 提供加密」。\n\n**❌ 为什么其他选项错**：\n- A. AWS 证书管理器：管理 TLS/SSL 证书，不加密 EBS\n- B. AWS 系统管理员：运维工具，不提供块存储加密\n- D. AWS 配置：合规记录，与加密无关\n\n**📌 关键概念**：EBS 加密 → KMS（含默认 aws/ebs 密钥）；证书 → ACM；配置评估 → Config；「加密密钥」题眼锁定 KMS；EBS 默认用 aws/ebs 托管密钥，也可指定自定义 KMS 密钥便于审计与吊销。","s":"源#74"},{"id":"D2-075","d":2,"t":"single","q":"一家公司希望通过 Web 界面管理其 AWS 云资源。哪个 AWS 服务将满足这一要求？","o":[{"l":"A","t":"AWS 管理控制台"},{"l":"B","t":"AWS CLI"},{"l":"C","t":"AWS SDK"},{"l":"D","t":"AWS Cloud9"}],"a":["A"],"e":"**✅ 为什么 A. AWS 管理控制台 对**：AWS Management Console 是基于 Web 的图形界面，通过浏览器管理云资源，正符合「Web 界面管理 AWS 云资源」；图形化视图与引导式操作大幅降低使用门槛。\n\n**❌ 为什么其他选项错**：\n- B. AWS CLI：命令行工具，非 Web 界面\n- C. AWS SDK：编程接口库，非界面\n- D. AWS Cloud9：云 IDE，偏开发环境，不是资源管理界面\n\n**📌 关键概念**：GUI 管理 → Console；命令行 → CLI；编程集成 → SDK；「Web 图形界面」题眼锁定 Console；控制台还支持按服务浏览、查看账单与 IAM 管理，是云资源统一入口；还提供成本与用量面板，帮助快速定位消费热点。","s":"源#75"},{"id":"D2-079","d":2,"t":"single","q":"根据 AWS 共享责任模型，以下哪项是客户的责任？","o":[{"l":"A","t":"为 Amazon S3 基础设施设备应用安全补丁。"},{"l":"B","t":"为 AWS 数据中心提供物理安全。"},{"l":"C","t":"在 Lambda@Edge 上安装操作系统更新。"},{"l":"D","t":"为 IAM 用户账户实施多因素身份验证（MFA）。"}],"a":["D"],"e":"**✅ 为什么 D. 为 IAM 用户账户实施多因素认证（MFA） 对**：客户负责「云中安全」，为 IAM 用户启用 MFA 属于客户账户内的安全措施，是典型客户责任。\n\n**❌ 为什么其他选项错**：\n- A. 为 Amazon S3 基础设施设备应用安全补丁：基础设施由 AWS 维护\n- B. 为 AWS 数据中心提供物理安全：AWS 负责物理层\n- C. 在 Lambda@Edge 上安装操作系统更新：Edge 节点基础设施归 AWS，Lambda 无需客户装 OS\n\n**📌 关键概念**：MFA、IAM 策略、数据加密、OS 补丁（EC2 自管时）→ 客户；物理设施、数据中心、S3 底层 → AWS；Edge/无服务器运行时 → AWS；MFA 是成本最低的防护手段，根账户与特权账户都应强制启用。","s":"源#79"},{"id":"D2-083","d":2,"t":"single","q":"用户想在 S3 控制台中查看所有带有 ACL 和 S3 存储桶策略的 Amazon S3 存储桶。哪个AWS 服务或资源将满足此要求？","o":[{"l":"A","t":"S3 多区域访问点"},{"l":"B","t":"S3 存储镜头"},{"l":"C","t":"AWS IAM 身份中心 (AWS 单一登录)"},{"l":"D","t":"S3 访问分析器"}],"a":["D"],"e":"**✅ 为什么 D. S3 访问分析器 对**：题干问「查看所有带 ACL 和存储桶策略的 S3 存储桶」，S3 Access Analyzer（依托 IAM Access Analyzer）分析并审查 S3 存储桶访问策略与 ACL，帮助识别访问开放情况。\n\n**❌ 为什么其他选项错**：\n- A. S3 多区域访问点：多区域访问加速，与策略审查无关\n- B. S3 存储镜头：存储成本与使用分析，不审查访问策略\n- C. AWS IAM 身份中心：企业身份联邦门户，不直接分析 S3 策略\n\n**📌 关键概念**：审查 S3 访问策略/ACL → IAM Access Analyzer（含 S3 专用分析）；成本优化看 Storage Lens；多区域加速看多区域访问点。","s":"源#83"},{"id":"D2-084","d":2,"t":"single","q":"用户在哪里可以找到有关 AWS 的合规性相关信息和报告的最佳资源？","o":[{"l":"A","t":"AWS 工件"},{"l":"B","t":"AWS 市场"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"AWS 支持"}],"a":["A"],"e":"**✅ 为什么 A. AWS 工件 对**：AWS Artifact 是合规性报告与认证的自助下载门户，用户在此查看与下载合规报告、SOC/ISO 等证明文件，是合规相关信息与报告的最佳来源。\n\n**❌ 为什么其他选项错**：\n- B. AWS 市场：第三方软件交易市场\n- C. Amazon Inspector：漏洞扫描服务\n- D. AWS 支持：支持中心，不直接承载合规报告库\n\n**📌 关键概念**：「合规报告/认证/保证文件下载」永远选 AWS Artifact；它与 Knowledge Center（知识问答）是互补的两个自助资源；Artifact 还支持在线协议签署，可用于合规性协议确认。","s":"源#84"},{"id":"D2-092","d":2,"t":"single","q":"开发人员应该使用哪个工具将 AWS 服务功能直接集成到应用程序中？","o":[{"l":"A","t":"AWS 软件开发工具包"},{"l":"B","t":"AWS 代码部署"},{"l":"C","t":"AWS Lambda"},{"l":"D","t":"AWS Batch"}],"a":["A"],"e":"**✅ 为什么 A. AWS 软件开发工具包（SDK） 对**：SDK 提供多种编程语言的库与 API，让开发者把 AWS 服务功能直接集成进应用程序，正符合「将 AWS 服务功能直接集成到应用程序」。\n\n**❌ 为什么其他选项错**：\n- B. AWS CodeDeploy：部署应用代码的服务\n- C. AWS Lambda：无服务器计算服务\n- D. AWS Batch：批量计算服务\n\n**📌 关键概念**：应用内集成 AWS 能力 → SDK（语言库）；应用部署 → CodeDeploy；跑代码 → Lambda/Batch；「开发集成」题眼锁定 SDK；SDK 覆盖 Java、Python、Go 等主流语言，配合 IAM 权限即可调用 AWS 能力；SDK 支持重试与凭证链等机制，简化服务调用开发。","s":"源#92"},{"id":"D2-094","d":2,"t":"single","q":"使用 AWS 身份和访问管理 (IAM) 仅授予执行任务所需的资源访问权限的概念被称为：","o":[{"l":"A","t":"受限访问"},{"l":"B","t":"按需访问"},{"l":"C","t":"最小权限访问"},{"l":"D","t":"令牌访问"}],"a":["C"],"e":"**✅ 为什么 C. 最小权限访问 对**：Least Privilege（最小权限）指只授予完成任务所需的最低权限，是 IAM 的核心安全原则，正符合题干定义。\n\n**❌ 为什么其他选项错**：\n- A. 受限访问：泛指受限，非 AWS 标准术语\n- B. 按需访问：非标准概念，与题干「仅授予所需」侧重点不同\n- D. 令牌访问：指临时凭证机制，不是权限授予原则\n\n**📌 关键概念**：最小权限（Least Privilege）是 IAM 第一原则：只给「完成工作所需的最小权限」；防泄露、防越权都靠它；与分组管理、角色、策略分层结合，可构建清晰的权限体系。","s":"源#94"},{"id":"D2-095","d":2,"t":"single","q":"哪个 AWS 服务或工具可以用来设置防火墙，控制进入和离开 Amazon VPC 子网的流量？","o":[{"l":"A","t":"安全组"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"AWS 防火墙管理器"},{"l":"D","t":"网络 ACL"}],"a":["D"],"e":"**✅ 为什么 D. 网络 ACL 对**：网络 ACL（NACL）是 VPC 子网层面的无状态防火墙，控制进出子网的流量（支持允许/拒绝规则），正符合「控制进入和离开子网的流量」。\n\n**❌ 为什么其他选项错**：\n- A. 安全组：实例级有状态防火墙，控制的是实例而非子网\n- B. AWS WAF：应用层 Web 流量过滤，不是 VPC 子网防火墙\n- C. AWS 防火墙管理器：统一管理防火墙策略的服务，本身不是子网防火墙\n\n**📌 关键概念**：子网边界流量控制 → 网络 ACL（无状态、需双向规则）；实例流量控制 → 安全组（有状态）；题干「子网」是 NACL 的标志性关键词。","s":"源#95"},{"id":"D2-098","d":2,"t":"single","q":"一家公司希望将一个 AWS 账户中的用户授予访问另一个 AWS 账户中的资源的权限。用户目前没有访问这些资源的权限。哪家 AWS 服务能满足这一要求？","o":[{"l":"A","t":"IAM 组"},{"l":"B","t":"IAM 角色"},{"l":"C","t":"IAM 标签"},{"l":"D","t":"IAM 访问分析器"}],"a":["B"],"e":"**✅ 为什么 B. IAM 角色 对**：跨账户访问依靠 IAM 角色委派——在目标账户创建角色并信任源账户，源账户用户 AssumeRole 后获得临时凭证访问资源，正符合「一个账户用户访问另一个账户资源」。\n\n**❌ 为什么其他选项错**：\n- A. IAM 组：组只在本账户内管理用户，不能跨账户授权\n- C. IAM 标签：标签用于分类与成本分配，不授权\n- D. IAM 访问分析器：分析共享情况，不提供访问能力\n\n**📌 关键概念**：跨账户访问的标准答案是 IAM Role（信任策略+委派权限）；「跨账户+临时凭证」双关键词锁定角色。","s":"源#98"},{"id":"D2-099","d":2,"t":"single","q":"使用 AWS 服务时，哪项任务是 AWS 的责任？","o":[{"l":"A","t":"管理 IAM 用户权限"},{"l":"B","t":"为出站访问创建安全组规则"},{"l":"C","t":"维护物理和环境控制"},{"l":"D","t":"应用 Amazon EC2 操作系统补丁"}],"a":["C"],"e":"**✅ 为什么 C. 维护物理和环境控制 对**：物理与环境安全（数据中心门禁、冷却、供电）是 AWS 负责的「云安全」部分，正符合题干。\n\n**❌ 为什么其他选项错**：\n- A. 管理 IAM 用户权限：客户责任（云中安全）\n- B. 创建安全组规则：客户责任\n- D. 应用 Amazon EC2 操作系统补丁：EC2 上客户 OS 的补丁由客户负责\n\n**📌 关键概念**：物理设施、环境控制、网络骨干 → AWS；IAM、安全组、OS 补丁（EC2 自管）→ 客户；该分野是共享责任模型最高频考点；数据中心的风火水电、门禁监控同样属 AWS「云安全」责任。","s":"源#99"},{"id":"D2-101","d":2,"t":"single","q":"哪个选项是 AWS Cloud Adoption Framework (AWS CAF) 平台视角的能力？","o":[{"l":"A","t":"数据架构"},{"l":"B","t":"数据保护"},{"l":"C","t":"数据治理"},{"l":"D","t":"数据科学"}],"a":["A"],"e":"正确答案：A. 数据架构解析：AWS 云采纳框架（AWS CAF） 是一个全面的框架，旨在帮助组织迁移到云端。它提供了跨六个视角的最佳实践和指导：业务（Business）、人员（People）、治理（Governance）、平台（Platform）、安全（Security）和运营（Operations）。平台视角：平台视角专注于云迁移所需的基础架构和云原生服务。其技术能力包括：\n- 数据架构：在云中构建、管理和优化数据。\n- 云基础架构设计。\n- 应用程序架构。为什么其他选项不正确：\n- B. 数据保护：属于安全视角（Security Perspective），涉及保护数据安全和确保合规性。\n- C. 数据治理：与**治理视角（Governance Perspective）** 相关，主要处理管理云采纳的政策、流程和控制。\n- D. 数据科学：不属于 AWS CAF 的任何视角，而是专注于分析和建模数据的一个专业领域。因此，A. 数据架构是正确答案，因为它与 AWS CAF 的平台视角一致。","s":"源#101"},{"id":"D2-104","d":2,"t":"single","q":"哪个 AWS 工具允许用户规划其服务使用、服务成本和实例预留，并且还允许他们设置自定义警报，当他们的成本或使用超过设定的阈值时？","o":[{"l":"A","t":"成本探索器"},{"l":"B","t":"AWS 预算"},{"l":"C","t":"AWS 成本和使用情况报告"},{"l":"D","t":"预留实例报告"}],"a":["B"],"e":"**✅ 为什么 B. AWS 预算 对**：AWS Budgets 可规划服务使用与预留，设置自定义预算并在成本/使用超过阈值时告警，正符合「规划使用/预留+自定义告警」。\n\n**❌ 为什么其他选项错**：\n- A. Cost Explorer：历史成本可视化，不设告警\n- C. AWS 成本和使用情况报告（CUR）：详细账单数据导出，不设阈值告警\n- D. 预留实例报告：只呈现预留实例使用，不做预算告警\n\n**📌 关键概念**：预算与阈值告警 → Budgets；历史分析预测 → Cost Explorer；详细账单数据 → CUR；「设置自定义告警」是 Budgets 的题眼；预算支持按月/季/年周期，并可通过邮件与 SNS 通知超支。","s":"源#104"},{"id":"D2-105","d":2,"t":"multiple","q":"根据 AWS 共享责任模型，以下哪两项任务是客户的职责？","o":[{"l":"A","t":"建立全球基础设施"},{"l":"B","t":"执行客户端数据加密"},{"l":"C","t":"配置 IAM 凭证"},{"l":"D","t":"保护边缘位置的安全"},{"l":"E","t":"修补 Amazon RDS 数据库实例"}],"a":["B","C"],"e":"**✅ 为什么 B、C 对**：\n- B. 执行客户端数据加密：数据加密责任在客户侧（选择加密方式、管理自身密钥），属于客户职责\n- C. 配置 IAM 凭证：管理用户与权限是客户「云中安全」的核心职责\n\n**❌ 为什么其他选项错**：\n- A. 建立全球基础设施：全球骨干与可用区由 AWS 负责\n- D. 保护边缘位置的安全：边缘基础设施由 AWS 负责\n- E. 修补 Amazon RDS 数据库实例：RDS 托管实例的补丁由 AWS 负责\n\n**📌 关键概念**：共享责任边界：客户=数据、身份、客户端配置、自管 OS；AWS=全球基础设施、托管服务补丁、物理安全；RDS 补丁归 AWS 是经典陷阱。","s":"源#105"},{"id":"D2-106","d":2,"t":"multiple","q":"一位开发人员被一家大公司雇佣，需要 AWS 凭证。应该遵循哪些安全最佳实践？（选择两项。）","o":[{"l":"A","t":"仅授予开发人员访问 AWS 资源的权限，以执行工作。"},{"l":"B","t":"与开发人员共享 AWS 帐户根用户凭证。"},{"l":"C","t":"将开发人员添加到 AWS IAM 的管理员组。"},{"l":"D","t":"配置密码策略，确保开发人员的密码不能更改。"},{"l":"E","t":"确保帐户密码策略要求最小长度。"}],"a":["A","E"],"e":"**✅ 为什么 A、E 对**：\n- A. 仅授予开发人员执行工作所需的权限：最小权限原则，是凭证管理首要最佳实践\n- E. 确保账户密码策略要求最小长度：强密码策略提升凭证安全性\n\n**❌ 为什么其他选项错**：\n- B. 与开发人员共享根用户凭证：共享根凭证是严重安全违规\n- C. 将开发人员加入管理员组：权限过大，违背最小权限\n- D. 配置密码策略使密码不可更改：锁定密码反而降低安全性，且与轮换原则相悖\n\n**📌 关键概念**：新员工凭证最佳实践 = 最小权限 + 强密码策略 + MFA；根凭证共享、管理员组、禁改密码都是反例。","s":"源#106"},{"id":"D2-108","d":2,"t":"single","q":"用户希望允许在 Amazon EC2 实例上运行的应用程序调用其他 AWS 服务。授予的访问权限必须是安全的。应该使用哪个 AWS 服务或功能？","o":[{"l":"A","t":"安全组"},{"l":"B","t":"AWS 防火墙管理器"},{"l":"C","t":"IAM 角色"},{"l":"D","t":"IAM 用户 SSH 密钥"}],"a":["C"],"e":"**✅ 为什么 C. IAM 角色 对**：为 EC2 实例附加 IAM 角色，实例内的应用通过临时凭证安全调用其他 AWS 服务，避免在实例中存放长期密钥，正符合「安全调用其他 AWS 服务」。\n\n**❌ 为什么其他选项错**：\n- A. 安全组：控制网络流量，不管理 API 权限\n- B. AWS 防火墙管理器：集中管理防火墙策略，与授权无关\n- D. IAM 用户 SSH 密钥：SSH 密钥只用于登录，不授权 API 调用\n\n**📌 关键概念**：实例内应用访问 AWS API 的标准做法 = 实例配置文件 + IAM 角色（临时凭证）；SSH 密钥 ≠ API 凭证；用角色替代长期共享密钥，避免密钥随镜像或代码扩散，是实例授权标准做法。","s":"源#108"},{"id":"D2-111","d":2,"t":"single","q":"一家公司需要跟踪其 AWS 账户中的活动，并需要知道何时对其 AWS 资源进行了API 调用。可以使用哪个 AWS 工具或服务来满足这些要求？","o":[{"l":"A","t":"Amazon CloudWatch"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"AWS CloudTrail"},{"l":"D","t":"AWS IAM"}],"a":["C"],"e":"**✅ 为什么 C. AWS CloudTrail 对**：CloudTrail 记录账号 API 活动，配合 CloudWatch/EventBridge 可在特定 API 调用时告警，既满足「跟踪活动」也满足「知道何时发生 API 调用」；事件含调用者、时间、动作与结果，构成完整审计链。\n\n**❌ 为什么其他选项错**：\n- A. Amazon CloudWatch：监控指标日志，不记录 API 调用本身\n- B. Amazon Inspector：漏洞扫描服务\n- D. AWS IAM：权限管理，不记录调用事件\n\n**📌 关键概念**：API 调用记录与通知 = CloudTrail（记录） + CloudWatch/EventBridge（告警）；「跟踪 API 调用」首选 CloudTrail；默认 90 天事件历史免费可查，长期留存需配置投递到 S3 或 CloudWatch Logs；多账户集中审计可建组织级跟踪（Organization Trail），对所有成员账号统一记录。","s":"源#111"},{"id":"D2-115","d":2,"t":"single","q":"一家社交媒体公司希望保护其 Web 应用程序免受常见的网络攻击，如 SQL 注入和跨站脚本攻击。哪个 AWS 服务能满足这些要求？","o":[{"l":"A","t":"Amazon Inspector"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"Amazon CloudWatch"}],"a":["B"],"e":"**✅ 为什么 B. AWS WAF 对**：WAF 通过自定义规则允许/阻止/监控 Web 请求，可抵御 SQL 注入、XSS 等常见 Web 攻击，正符合「保护 Web 应用免受常见攻击」；WAF 支持 IP、速率、字符串与正则规则，灵活匹配攻击特征。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Inspector：漏洞扫描，不拦截攻击流量\n- C. Amazon GuardDuty：威胁检测告警，不直接防护\n- D. Amazon CloudWatch：监控与告警服务\n\n**📌 关键概念**：SQL 注入/XSS → WAF（Web 应用防火墙）；DDoS → Shield；威胁检测 → GuardDuty；「Web 应用保护」题眼锁定 WAF；WAF 可与 CloudFront、ALB、API Gateway 集成，并加载托管规则集；也可结合托管规则集自动更新防护策略，降低人工维护负担。","s":"源#115"},{"id":"D2-120","d":2,"t":"single","q":"一家公司想要设计一个集中存储系统，用于管理其关键业务应用程序的配置数据和密码。哪个AWS服务或功能将以最具成本效益的方式满足这些要求？","o":[{"l":"A","t":"AWS 系统管理器参数存储"},{"l":"B","t":"AWS 密钥管理器"},{"l":"C","t":"AWS 合规性"},{"l":"D","t":"Amazon S3"}],"a":["A"],"e":"**✅ 为什么 A. AWS 系统管理器参数存储 对**：Systems Manager Parameter Store 是分层安全存储，可集中保存配置数据与密码，集成 IAM 做细粒度访问控制，且比 Secrets Manager 更经济，正符合「集中存储配置+密码+最具成本效益」。\n\n**❌ 为什么其他选项错**：\n- B. AWS 密钥管理器：也能管密码但成本更高，题干强调「最具成本效益」，参数存储更优\n- C. AWS 合规性：不是存储服务\n- D. Amazon S3：适合对象存储，但作为敏感配置存储不如参数存储贴合且需额外管理访问\n\n**📌 关键概念**：配置+密码兼顾成本 → Parameter Store（标准版免费/高级版收费）；仅密码+自动轮换 → Secrets Manager；「成本效益」是选参数存储的关键词。","s":"源#120"},{"id":"D2-122","d":2,"t":"single","q":"一家公司想要创建新的 AWS 账户，将多个账户分组以组织工作流程，并对账户组应用策略。哪个AWS 服务或功能允许用户这样做？","o":[{"l":"A","t":"AWS 身份和访问管理（IAM）"},{"l":"B","t":"AWS 信任顾问"},{"l":"C","t":"AWS CloudFormation"},{"l":"D","t":"AWS 组织"}],"a":["D"],"e":"**✅ 为什么 D. AWS 组织 对**：AWS Organizations 支持创建新账户、分组管理账户、对账户组应用 SCP 等策略，正符合「创建账户+分组+对账户组应用策略」三连要求。\n\n**❌ 为什么其他选项错**：\n- A. AWS IAM：管理用户与权限，不管理账户组织\n- B. AWS Trusted Advisor：检查建议服务\n- C. AWS CloudFormation：IaC 资源编排，不分组账户\n\n**📌 关键概念**：多账户治理三件套 = Organizations（账户分组+SCP+集中账单）；「创建账户+分组+应用策略」三特征直指 Organizations；SCP 可跨账户统一设限，结合集中账单提升治理效率；组织级策略还可统一管理成员账户的合规基线。","s":"源#122"},{"id":"D2-124","d":2,"t":"single","q":"一家公司希望阻止 SQL 注入攻击。为了满足此要求，公司应该使用哪种 AWS 服务或功能？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"网络 ACL"},{"l":"C","t":"安全组"},{"l":"D","t":"AWS 证书管理器（ACM）"}],"a":["A"],"e":"**✅ 为什么 A. AWS WAF 对**：WAF 通过规则过滤 Web 请求，阻止 SQL 注入等应用层攻击，是防 SQL 注入的专用服务。\n\n**❌ 为什么其他选项错**：\n- B. 网络 ACL：VPC 子网层过滤，不做应用层注入检测\n- C. 安全组：实例级防火墙，不识别 SQL 注入\n- D. AWS 证书管理器（ACM）：管理 TLS 证书，与攻击防护无关\n\n**📌 关键概念**：SQL 注入 → WAF（应用层）；子网流量 → NACL；实例流量 → 安全组；证书 → ACM；四个方向四个服务，注意区分；WAF 可借助托管规则集自动更新，减少人工维护成本；规则引擎支持条件组合，实现灵活的访问控制策略。","s":"源#124"},{"id":"D2-126","d":2,"t":"single","q":"一家公司需要评估其 AWS 环境，并在五个类别中提供最佳实践建议：成本、性能、服务限制、容错和安全性。公司可以使用哪种 AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS Shield"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"AWS Trusted Advisor"},{"l":"D","t":"AWS Service Catalog"}],"a":["C"],"e":"**✅ 为什么 C. AWS Trusted Advisor 对**：Trusted Advisor 在成本优化、性能、服务限制、容错、安全五个类别提供最佳实践建议与检查，与题干「五个类别」完全对应，是官方给出的体检式建议清单。\n\n**❌ 为什么其他选项错**：\n- A. AWS Shield：DDoS 防护\n- B. AWS WAF：Web 应用防火墙\n- D. AWS Service Catalog：服务目录治理\n\n**📌 关键概念**：Trusted Advisor 五类检查：成本优化、性能、服务限制、容错、安全；题干点名五类别即锁定 TA；GuardDuty/Inspector 都不是「建议类」服务；TA 核心检查对商业支持计划及以上用户开放，是日常运营体检表；核心检查项会持续更新，覆盖新出现的风险类型。","s":"源#126"},{"id":"D2-130","d":2,"t":"single","q":"在 AWS 共享责任模型下，哪个选项是 AWS 和其客户之间的共同责任？","o":[{"l":"A","t":"配置 Amazon EC2 实例操作系统"},{"l":"B","t":"应用程序文件系统服务器端加密"},{"l":"C","t":"补丁管理"},{"l":"D","t":"物理基础设施的安全性"}],"a":["C"],"e":"**✅ 为什么 C. 补丁管理 对**：补丁管理是共享责任：AWS 修补底层基础设施（托管服务/主机 OS 由 AWS 管的部分），客户修补自管 EC2 的客户 OS 与应用程序补丁。\n\n**❌ 为什么其他选项错**：\n- A. 配置 Amazon EC2 实例操作系统：EC2 客户 OS 配置由客户负责\n- B. 应用程序文件系统服务器端加密：应用层数据加密属客户\n- D. 物理基础设施的安全性：物理层由 AWS 全责\n\n**📌 关键概念**：共享责任的「共享点」典型是补丁管理：基础设施补丁归 AWS、客户 OS 与应用补丁归客户；其余选项几乎全归一方。","s":"源#130"},{"id":"D2-132","d":2,"t":"single","q":"根据 AWS 共享责任模型，哪项任务是 AWS 的责任？","o":[{"l":"A","t":"对 Amazon EC2 实例应用客操作系统补丁。"},{"l":"B","t":"提供人力资源信息管理（HRIM）系统的监控。"},{"l":"C","t":"对 Amazon RDS 实例执行自动备份。"},{"l":"D","t":"优化运行 AWS 服务的成本。"}],"a":["C"],"e":"**✅ 为什么 C. 对 Amazon RDS 实例执行自动备份 对**：RDS 是托管数据库，自动备份由 AWS 负责（客户可配置备份窗口与保留期），正符合「AWS 的责任」。\n\n**❌ 为什么其他选项错**：\n- A. 对 Amazon EC2 实例应用客户操作系统补丁：EC2 客户 OS 补丁归客户\n- B. 提供 HRIM 系统的监控：客户应用层监控归客户\n- D. 优化运行 AWS 服务的成本：成本优化责任在客户\n\n**📌 关键概念**：托管服务（RDS）的备份/补丁/硬件 = AWS；EC2 的 OS、应用监控、成本优化 = 客户；「自动备份」题眼指向托管服务归属 AWS；RDS 备份窗口与保留期可配置，执行本身由 AWS 自动完成。","s":"源#132"},{"id":"D2-140","d":2,"t":"multiple","q":"哪些 AWS 服务可以用于实现松耦合架构？（选择两个。）","o":[{"l":"A","t":"Amazon WorkSpaces"},{"l":"B","t":"Amazon Simple Queue Service（Amazon SQS）"},{"l":"C","t":"Amazon Connect"},{"l":"D","t":"AWS Trusted Advisor"},{"l":"E","t":"AWS Step Functions"}],"a":["B","E"],"e":"**✅ 为什么 B、E 对**：\n- B. Amazon SQS：消息队列实现组件间异步解耦，是松耦合架构的标志性服务\n- E. AWS Step Functions：无服务器工作流编排，服务间通过状态机解耦集成\n\n**❌ 为什么其他选项错**：\n- A. Amazon WorkSpaces：虚拟桌面服务，与架构耦合无关\n- C. Amazon Connect：云联络中心\n- D. AWS Trusted Advisor：检查建议服务\n\n**📌 关键概念**：松耦合 = 异步消息（SQS/SNS）+ 工作流编排（Step Functions）+ 事件驱动（EventBridge）；紧耦合反例=直接同步调用、共享数据库模式；队列还能削峰填谷、缓冲突发流量，提升整体稳定性；Step Functions 则负责把多个服务编排为可靠工作流。","s":"源#140"},{"id":"D2-146","d":2,"t":"single","q":"在 AWS 共享责任模型下，哪个选项是客户的责任？","o":[{"l":"A","t":"维护 Amazon EC2 实例的底层硬件"},{"l":"B","t":"应用程序数据安全"},{"l":"C","t":"数据中心的物理安全"},{"l":"D","t":"VPC 组件的维护"}],"a":["B"],"e":"**✅ 为什么 B. 应用程序数据安全 对**：客户负责「云中安全」，包括应用数据的安全（访问控制、加密管理），正符合题干「客户的责任」。\n\n**❌ 为什么其他选项错**：\n- A. 维护 Amazon EC2 实例的底层硬件：底层硬件由 AWS\n- C. 数据中心的物理安全：AWS 负责\n- D. VPC 组件的维护：VPC 基础设施维护由 AWS 负责（客户负责 VPC 内配置）\n\n**📌 关键概念**：数据安全、IAM、应用配置、自管 OS → 客户；硬件、物理、VPC 底层组件 → AWS；「应用数据」是客户责任的高频题眼；数据安全涵盖访问控制、加密、备份与可用性，均由客户配置维护。","s":"源#146"},{"id":"D2-149","d":2,"t":"single","q":"系统管理员为开发人员创建了一个新的 IAM 用户，并为用户分配了一个访问密钥，而不是用户名和密码。访问密钥的用途是什么？","o":[{"l":"A","t":"作为 AWS 账户根用户访问 AWS 账户"},{"l":"B","t":"通过 AWS 管理控制台访问 AWS 账户"},{"l":"C","t":"通过 CLI 访问 AWS 账户"},{"l":"D","t":"访问公司的所有 AWS 账户"}],"a":["C"],"e":"**✅ 为什么 C. 通过 CLI 访问 AWS 账户 对**：访问密钥（Access Key ID + Secret）用于 CLI/SDK/API 的编程访问，签名每个请求，是开发人员通过 CLI 访问 AWS 的凭证。\n\n**❌ 为什么其他选项错**：\n- A. 作为 AWS 账户根用户访问：根用户登录用邮箱+密码，不用访问密钥\n- B. 通过 AWS 管理控制台访问：控制台登录用密码+MFA，不用访问密钥\n- D. 访问公司的所有 AWS 账户：访问密钥不跨账户\n\n**📌 关键概念**：访问密钥 = 编程访问（CLI/SDK/API）；密码 = 控制台登录；二者用途分离是常考陷阱；访问密钥还分根密钥与 IAM 用户密钥，根用户密钥应避免创建。","s":"源#149"},{"id":"D2-155","d":2,"t":"single","q":"哪种 AWS 服务帮助用户审核其 AWS 账户中的 API 活动？","o":[{"l":"A","t":"AWS CloudTrail"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"AWS WAF"},{"l":"D","t":"AWS Config"}],"a":["A"],"e":"**✅ 为什么 A. AWS CloudTrail 对**：CloudTrail 提供账户 AWS API 调用历史记录，支持治理、合规与操作审计，正符合「审核 AWS 账户中的 API 活动」；事件含调用者、动作、源 IP 与结果，可完整审计。\n\n**❌ 为什么其他选项错**：\n- B. Amazon Inspector：漏洞扫描\n- C. AWS WAF：Web 攻击防护\n- D. AWS Config：资源配置合规评估（记录配置变更，不审 API 调用）\n\n**📌 关键概念**：审 API 调用 → CloudTrail；审配置合规 → Config；「API 活动」与「配置变更」是两个不同题眼；CloudTrail 与 Config 常组合用于合规审查；日志可通过 CloudWatch 告警实现异常调用的实时提醒。；CloudTrail 事件历史默认保留 90 天，长期留存需配置投递到 S3","s":"源#155"},{"id":"D2-156","d":2,"t":"single","q":"根据 AWS 共享责任模型，哪项任务是客户的职责？","o":[{"l":"A","t":"维护运行 AWS Lambda 所需的基础设施"},{"l":"B","t":"更新 Amazon DynamoDB 实例的操作系统"},{"l":"C","t":"维护 Amazon S3 基础设施"},{"l":"D","t":"更新 Amazon EC2 实例上的客户操作系统"}],"a":["D"],"e":"**✅ 为什么 D. 更新 Amazon EC2 实例上的客户操作系统 对**：客户负责自管 EC2 上的客户 OS（Guest OS）更新与补丁，这是客户「云中安全」的典型责任。\n\n**❌ 为什么其他选项错**：\n- A. 维护运行 AWS Lambda 所需的基础设施：Lambda 基础设施由 AWS 维护\n- B. 更新 Amazon DynamoDB 实例的操作系统：托管服务无客户 OS 概念，由 AWS 负责\n- C. 维护 Amazon S3 基础设施：S3 基础设施由 AWS 负责\n\n**📌 关键概念**：EC2 是客户责任重灾区（OS、安全组、应用、数据）；Lambda/DynamoDB/S3 等托管服务基础设施全归 AWS；EC2 客户需自行维护 OS 补丁、安全组与应用配置。","s":"源#156"},{"id":"D2-158","d":2,"t":"single","q":"用户想要安全地自动化管理和轮换在应用程序之间共享的凭证，同时在管理任务上花费最少的时间。哪种 AWS 服务或功能可以用来实现这一点？","o":[{"l":"A","t":"AWS CloudHSM"},{"l":"B","t":"AWS 密钥管理服务（AWS KMS）"},{"l":"C","t":"AWS Secrets Manager"},{"l":"D","t":"服务器端加密"}],"a":["C"],"e":"**✅ 为什么 C. AWS Secrets Manager 对**：Secrets Manager 集中存储、自动轮换并安全管理应用共享的凭证，托管轮换大幅减少管理时间，正符合「自动化管理和轮换凭证+最少管理时间」。\n\n**❌ 为什么其他选项错**：\n- A. AWS CloudHSM：硬件加密模块，不自动轮换凭证\n- B. AWS KMS：管理加密密钥，不是凭证\n- D. 服务器端加密：加密存储数据，不管凭证轮换\n\n**📌 关键概念**：自动轮换凭证 → Secrets Manager（Lambda 支撑轮换）；KMS 管密钥、CloudHSM 管硬件加密、SSE 管存储加密；Secrets Manager 还支持自动轮换 RDS 等数据库凭证；它还支持 IAM 策略示例，便于与 Lambda 集成实现轮换。","s":"源#158"},{"id":"D2-159","d":2,"t":"single","q":"哪种安全服务可以自动识别并分类 AWS 上的敏感数据或知识产权？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"Amazon Macie"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"AWS Shield"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Macie 对**：Macie 用机器学习与模式匹配自动发现、分类 AWS 上的敏感数据（PII、知识产权），正符合题干；能识别 S3 中的 PII、密钥与机密文档，并给出分级与处置建议。\n\n**❌ 为什么其他选项错**：\n- A. Amazon GuardDuty：威胁检测（恶意活动）\n- C. Amazon Inspector：漏洞扫描（工作负载）\n- D. AWS Shield：DDoS 防护\n\n**📌 关键概念**：敏感数据发现 → Macie；威胁活动 → GuardDuty；漏洞 → Inspector；DDoS → Shield；四服务按「数据/威胁/漏洞/流量」分；Macie 输出敏感数据报告并联动 Security Hub，形成数据安全闭环；分类结果可导出报告，满足数据安全审计需要。","s":"源#159"},{"id":"D2-160","d":2,"t":"multiple","q":"AWS 账户根用户的最佳实践操作是什么？（选择两个。）","o":[{"l":"A","t":"与团队成员共享根用户凭据。"},{"l":"B","t":"为账户创建多个根用户，按环境分开。"},{"l":"C","t":"为根用户启用多因素认证（MFA）。"},{"l":"D","t":"为日常管理任务创建具有管理员权限的 IAM 用户，而不是使用根用户。"},{"l":"E","t":"使用程序化访问而不是根用户和密码。"}],"a":["C","D"],"e":"**✅ 为什么 C、D 对**：\n- C. 为根用户启用 MFA：根用户权限最高，MFA 是保护根用户的第一道防线\n- D. 为日常管理任务创建具有管理员权限的 IAM 用户：避免日常使用根用户，是根用户最佳实践核心\n\n**❌ 为什么其他选项错**：\n- A. 与团队成员共享根用户凭据：共享根凭证严重违规\n- B. 按环境创建多个根用户：一个账户只有一个根用户，不存在多个\n- E. 使用程序化访问而不是根用户和密码：程序化访问需访问密钥，根用户应避免创建访问密钥\n\n**📌 关键概念**：根用户三原则：启用 MFA、创建日常 IAM 用户、不建根访问密钥（仅少数管理任务用根）；共享、多根、根密钥全为反例。","s":"源#160"},{"id":"D2-163","d":2,"t":"single","q":"一家公司需要在 Amazon S3 存储桶和本地应用程序之间传输数据。根据 AWS 共享责任模型，谁负责这些数据的安全性？","o":[{"l":"A","t":"公司"},{"l":"B","t":"AWS"},{"l":"C","t":"防火墙供应商"},{"l":"D","t":"AWS Marketplace 合作伙伴"}],"a":["A"],"e":"**✅ 为什么 A. 公司 对**：共享责任模型下，客户负责自己数据的端到端安全，S3 与本地间传输的数据安全（含访问管理与加密）由公司负责。\n\n**❌ 为什么其他选项错**：\n- B. AWS：AWS 负责云基础设施，不负责客户数据的传输安全\n- C. 防火墙供应商：防火墙厂商只负责其产品，不负责客户数据\n- D. AWS Marketplace 合作伙伴：同理，不承担客户数据安全\n\n**📌 关键概念**：数据的责任归属 = 客户（数据永远客户负责，无论存哪里）；AWS 负责承载数据的服务与基础设施，不负责客户数据内容本身。","s":"源#163"},{"id":"D2-168","d":2,"t":"single","q":"对于存储在 Amazon S3 存储桶中的敏感数据的访问，哪种操作是安全最佳实践？","o":[{"l":"A","t":"在 S3 存储桶上启用 S3 跨区域复制（CRR）。"},{"l":"B","t":"对需要访问 S3 存储桶的应用程序使用 IAM 角色。"},{"l":"C","t":"配置 AWS WAF 以防止未经授权访问 S3 存储桶。"},{"l":"D","t":"配置 Amazon GuardDuty 以防止未经授权访问 S3 存储桶。"}],"a":["B"],"e":"**✅ 为什么 B. 对需要访问 S3 存储桶的应用程序使用 IAM 角色 对**：为应用附加 IAM 角色获取临时凭证访问 S3，遵循最小权限原则且无长期密钥泄露风险，是访问 S3 敏感数据的安全最佳实践。\n\n**❌ 为什么其他选项错**：\n- A. 启用 S3 跨区域复制（CRR）：复制用于容灾/合规，不解决访问授权问题\n- C. 配置 AWS WAF 防止未授权访问 S3 存储桶：WAF 保护 Web 流量，不控制 S3 API 访问\n- D. 配置 Amazon GuardDuty 防止未授权访问 S3：GuardDuty 检测威胁，不阻止访问\n\n**📌 关键概念**：S3 访问控制正解 = IAM 角色/策略 + 存储桶策略 + 最小权限；CRR 管复制、WAF 管 Web、GuardDuty 管检测，都不是「访问授权」手段。","s":"源#168"},{"id":"D2-170","d":2,"t":"single","q":"一家公司需要一个中央用户门户，以便用户可以登录到支持安全断言标记语言（SAML）2.0 的第三方业务应用程序。哪个 AWS 服务将满足此要求？","o":[{"l":"A","t":"AWS 身份和访问管理（IAM）"},{"l":"B","t":"Amazon Cognito"},{"l":"C","t":"AWS IAM 身份中心（AWS 单点登录）"},{"l":"D","t":"AWS CLI"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Cognito 对**：Cognito 用户池支持 SAML 2.0 身份提供商（IdP）集成，可让用户登录第三方业务应用，正符合「中央用户门户+SAML 2.0 第三方应用」的场景。\n\n**❌ 为什么其他选项错**：\n- A. AWS IAM：管理 AWS 资源权限，不支持面向终端用户的第三方应用登录\n- C. AWS IAM 身份中心：面向 AWS 账户与云应用的 SSO，题干明确是第三方业务应用且选 Cognito\n- D. AWS CLI：命令行工具，与用户门户无关\n\n**📌 关键概念**：面向应用终端的用户认证/登录 → Cognito（支持 SAML、OIDC、社交登录）；面向 AWS 资源与账户 SSO → IAM Identity Center；两者服务对象不同。","s":"源#170"},{"id":"D2-171","d":2,"t":"single","q":"用户应该使用哪个 AWS 服务来了解 AWS 服务的可用性和运营情况？","o":[{"l":"A","t":"Amazon EventBridge"},{"l":"B","t":"AWS 服务目录"},{"l":"C","t":"AWS 控制塔"},{"l":"D","t":"AWS 健康仪表板"}],"a":["D"],"e":"**✅ 为什么 D. AWS 健康仪表板 对**：AWS Health Dashboard 集中展示 AWS 服务可用性、事件与运行状态，用户可了解服务健康与运营情况。AWS Health Dashboard 集中展示 AWS 服务可用性、运行状态与影响事件，无需逐个查询。运行状态页面含当前事件与历史事件，可按区域和服务筛选，运营与值班人员可据此判断影响范围与处置节奏。\n\n**❌ 为什么其他选项错**：\n- A. Amazon EventBridge：事件路由服务\n- B. AWS 服务目录：IT 服务标准化治理\n- C. AWS 控制塔：多账户治理与合规基线\n\n**📌 关键概念**：服务可用性/运行状态 → AWS Health Dashboard（含个人与服务两级）；治理基线 → Control Tower。易混对照：Health Dashboard 只「展示」状态，EventBridge 才「响应」事件做自动化编排；看健康去仪表板、要触发动作用事件总线。","s":"源#171"},{"id":"D2-172","d":2,"t":"single","q":"哪种 AWS 服务或工具可用于捕获 Amazon VPC 中进出流量的信息？","o":[{"l":"A","t":"VPC 流日志"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"VPC 端点服务"},{"l":"D","t":"NAT 网关"}],"a":["A"],"e":"**✅ 为什么 A. VPC 流日志 对**：VPC Flow Logs 捕获进出 VPC 网络接口的 IP 流量信息（源/目的 IP、端口、协议等），提供网络流量可见性，正符合「捕获进出流量信息」。VPC Flow Logs 捕获进出 VPC 网络接口的 IP 流量信息（源/目的 IP、端口、协议、字节数等），可投递到 CloudWatch Logs 或 S3 分析，是网络层流量可见性的标准答案。\n\n**❌ 为什么其他选项错**：\n- B. Amazon Inspector：漏洞扫描服务\n- C. VPC 端点服务：私有连接服务，不记录流量\n- D. NAT 网关：提供出站网络地址转换，不记录流量日志\n\n**📌 关键概念**：流量日志 → VPC Flow Logs（可投递 CloudWatch Logs/S3）；出网代理 → NAT 网关。易混对照：Flow Logs 记录「经过的流量」，Inspector 扫描「主机漏洞」，两者一个管网络层可见性、一个管工作负载安全，勿混选。","s":"源#172"},{"id":"D2-173","d":2,"t":"single","q":"根据 AWS 共享责任模型，客户始终负责管理什么？","o":[{"l":"A","t":"软件许可证"},{"l":"B","t":"网络"},{"l":"C","t":"客户数据"},{"l":"D","t":"加密密钥"}],"a":["C"],"e":"**✅ 为什么 C. 客户数据 对**：共享责任模型中客户「始终」负责自己的客户数据（内容、保护、合规处理），不随服务形态改变。\n\n**❌ 为什么其他选项错**：\n- A. 软件许可证：部分场景（自带许可 BYOL）客户负责，但托管服务中 AWS 管理许可，非「始终」\n- B. 网络：AWS 负责骨干网络，客户负责 VPC 内配置\n- D. 加密密钥：可选用 AWS 托管密钥，客户不始终负责\n\n**📌 关键概念**：「始终负责」题眼 = 客户数据；许可证、网络、密钥都随场景在共享边界上移动，数据永远归客户。","s":"源#173"},{"id":"D2-174","d":2,"t":"single","q":"哪种 AWS 服务可以用来按需检索合规性报告？","o":[{"l":"A","t":"AWS Secrets Manager"},{"l":"B","t":"AWS Artifact"},{"l":"C","t":"AWS Security Hub"},{"l":"D","t":"AWS 证书管理器"}],"a":["B"],"e":"**✅ 为什么 B. AWS Artifact 对**：AWS Artifact 是合规性报告自助门户，用户按需下载 SOC、ISO 等合规报告与文档，正符合题干。AWS Artifact 是合规文档自助门户，按需下载 SOC、ISO、PCI 等第三方审计报告，供监管与审计场景直接使用。对需要向监管机构证明 AWS 侧合规的金融、医疗等行业客户，Artifact 是获取第三方审计报告的唯一官方入口。\n\n**❌ 为什么其他选项错**：\n- A. AWS Secrets Manager：管理凭证与密钥\n- C. AWS Security Hub：安全告警聚合仪表板\n- D. AWS 证书管理器：管理 TLS/SSL 证书\n\n**📌 关键概念**：合规报告按需下载 → Artifact（唯一标准答案）；凭证 → Secrets Manager；证书 → ACM。典型错因：把 Artifact 与 ACM 混淆——Artifact 出「审计报告」（SOC/ISO），ACM 管「TLS 证书」，首字母相近但职能完全不同。","s":"源#174"},{"id":"D2-175","d":2,"t":"single","q":"哪种 AWS 服务使用户能够使用预定义的评估模板检查 Amazon EC2 实例上的漏洞？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"AWS Trusted Advisor"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"AWS Shield"}],"a":["C"],"e":"**✅ 为什么 C. Amazon Inspector 对**：Inspector 使用预定义或自定义评估模板自动检查 EC2 等工作负载的漏洞与最佳实践偏差，符合「预定义评估模板+EC2 漏洞」。Amazon Inspector 用预定义或自定义评估模板自动扫描 EC2 等工作负载的网络可达性与软件漏洞，输出带严重度的发现清单。\n\n**❌ 为什么其他选项错**：\n- A. AWS WAF：Web 应用层防护\n- B. AWS Trusted Advisor：五类最佳实践建议（不扫描漏洞）\n- D. AWS Shield：DDoS 防护\n\n**📌 关键概念**：漏洞评估模板 → Amazon Inspector（网络可达性/主机/容器扫描）；WAF 管攻击流量、Shield 管 DDoS、TA 管建议。漏洞扫描 → Inspector；Web 攻击 → WAF；DDoS → Shield。","s":"源#175"},{"id":"D2-177","d":2,"t":"single","q":"哪种行动将有助于提高 AWS 云的安全性？","o":[{"l":"A","t":"为所有 IAM 用户启用程序化访问。"},{"l":"B","t":"使用 IAM 用户而不是 IAM 角色来委派权限。"},{"l":"C","t":"定期轮换访问密钥。"},{"l":"D","t":"使用内联策略而不是客户管理的策略。"}],"a":["C"],"e":"**✅ 为什么 C. 定期轮换访问密钥 对**：定期轮换访问密钥限制泄露凭证的可用窗口，是官方明确的安全最佳实践，正符合「提高安全性」。\n\n**❌ 为什么其他选项错**：\n- A. 为所有 IAM 用户启用程序化访问：增加暴露面，非普遍建议\n- B. 使用 IAM 用户而非角色委派：角色（临时凭证）优于长期用户密钥，方向相反\n- D. 使用内联策略而非托管策略：托管策略更利于维护与最小权限，方向相反\n\n**📌 关键概念**：密钥卫生三件套=轮换、删除未用、用角色替代长期密钥；轮换访问密钥是提高安全性的直接动作。","s":"源#177"},{"id":"D2-184","d":2,"t":"single","q":"公司可以使用哪种 AWS 服务或功能对特定的 Amazon EC2 实例应用安全规则？","o":[{"l":"A","t":"网络 ACL"},{"l":"B","t":"安全组"},{"l":"C","t":"AWS Trusted Advisor"},{"l":"D","t":"AWS WAF"}],"a":["B"],"e":"**✅ 为什么 B. 安全组 对**：安全组是 EC2 实例的虚拟防火墙，按规则控制出入站流量，正符合「对特定 EC2 实例应用安全规则」。安全组是 EC2 实例级虚拟防火墙，按协议/端口控制出入站流量，只允许规则、有状态，正符合「特定实例」题眼。\n\n**❌ 为什么其他选项错**：\n- A. 网络 ACL：作用于子网层面，不是「特定实例」\n- C. AWS Trusted Advisor：建议服务\n- D. AWS WAF：Web 应用层过滤（不直接绑定实例）\n\n**📌 关键概念**：实例级防火墙 = 安全组（有状态）；子网级 = NACL（无状态）；题干「特定 EC2 实例」锁定安全组。实例级 → 安全组（有状态）；子网级 → NACL（无状态、可拒绝）。","s":"源#184"},{"id":"D2-187","d":2,"t":"single","q":"一家公司想要创建模板，以便公司可以重复使用来部署多个 AWS 资源。公司可以使用哪种AWS 服务或功能来满足此要求？","o":[{"l":"A","t":"AWS Marketplace"},{"l":"B","t":"Amazon Machine Image（AMI）"},{"l":"C","t":"AWS CloudFormation"},{"l":"D","t":"AWS OpsWorks"}],"a":["C"],"e":"**✅ 为什么 C. AWS CloudFormation 对**：CloudFormation 用模板（堆栈）声明式部署多个 AWS 资源，模板可重复使用，正符合「模板+重复使用+多资源部署」。CloudFormation 以模板声明式定义资源集合，一个模板可重复创建堆栈，跨环境复用，符合「模板+复用+多资源」。\n\n**❌ 为什么其他选项错**：\n- A. AWS Marketplace：软件市场\n- B. AMI：预配置的虚拟机镜像，不含资源编排模板\n- D. AWS OpsWorks：配置管理（Chef/Puppet），不是 IaC 模板\n\n**📌 关键概念**：重复使用模板部署多资源 = CloudFormation 堆栈；AMI 只管「一台实例的镜像」，Ops 管配置自动化。模板复用 → CloudFormation；编程语言 → CDK；镜像单机 → AMI。","s":"源#187"},{"id":"D2-189","d":2,"t":"single","q":"哪种 AWS 服务或功能是一种基于浏览器的、预身份验证的服务，可以直接从 AWS 管理控制台启动？","o":[{"l":"A","t":"AWS API"},{"l":"B","t":"AWS Lightsail"},{"l":"C","t":"AWS Cloud9"},{"l":"D","t":"AWS CloudShell"}],"a":["D"],"e":"**✅ 为什么 D. AWS CloudShell 对**：CloudShell 是基于浏览器的预认证 shell，从控制台一键启动，内置 CLI 与临时凭证，符合题干全部特征。CloudShell 是浏览器内置的预认证 shell，一键从控制台启动，自带 AWS CLI 与临时凭证，免本地安装配置。适合临时排查与脚本调试场景，会话凭证自动处理，省去本地安装 CLI 与配置密钥的步骤。\n\n**❌ 为什么其他选项错**：\n- A. AWS API：不是浏览器服务\n- B. AWS Lightsail：轻量云主机产品\n- C. AWS Cloud9：云端 IDE（开发环境），且非「预认证 shell」\n\n**📌 关键概念**：浏览器+预认证+控制台启动三特征 → CloudShell；云端 IDE → Cloud9。边界条件：CloudShell 适合临时命令与脚本验证，但它不是持久开发环境——多文件工程、断点调试仍应选 Cloud9。","s":"源#189"},{"id":"D2-192","d":2,"t":"single","q":"一家公司在多个 Amazon EC2 实例上托管了一个应用程序。该应用程序使用 Amazon Simple Notification Service（Amazon SNS）发送消息。哪种 AWS 服务或功能将为应用程序提供访问所需AWS 服务的权限？","o":[{"l":"A","t":"AWS 证书管理器（ACM）"},{"l":"B","t":"IAM 角色"},{"l":"C","t":"AWS Security Hub"},{"l":"D","t":"Amazon GuardDuty"}],"a":["B"],"e":"**✅ 为什么 B. IAM 角色 对**：EC2 实例通过附加 IAM 角色获得访问 SNS 等服务的权限，避免长期密钥入实例，正符合「为应用提供访问 AWS 服务权限」。IAM 角色通过实例配置文件附加到 EC2，实例内应用自动获得临时凭证访问 SNS 等服务，无需硬编码密钥。\n\n**❌ 为什么其他选项错**：\n- A. AWS 证书管理器（ACM）：TLS 证书\n- C. AWS Security Hub：安全告警聚合\n- D. Amazon GuardDuty：威胁检测\n\n**📌 关键概念**：实例内应用访问 AWS 服务 → IAM 角色（实例配置文件）；ACM 管证书、GuardDuty 管检测、Security Hub 管聚合。实例用权限 → IAM 角色；凭证存储 → Secrets Manager。","s":"源#192"},{"id":"D2-197","d":2,"t":"single","q":"一家公司需要集中配置和管理 AWS 组织中的 Amazon VPC 安全组，跨多个 AWS 账户。公司应该使用哪种 AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS Firewall Manager"},{"l":"B","t":"Amazon GuardDuty"},{"l":"C","t":"Amazon Detective"},{"l":"D","t":"AWS WAF"}],"a":["A"],"e":"**✅ 为什么 A. AWS Firewall Manager 对**：Firewall Manager 跨账户、跨 VPC 集中管理安全组与 WAF 等安全策略，正符合「集中管理多账户 VPC 安全组」。Firewall Manager 跨账户、跨区域集中管理安全组与 WAF 等策略，配合 AWS Organizations 统一治理。适合多账户企业统一安全基线：一次定义策略、全组织生效，避免逐账户手工配置漂移。\n\n**❌ 为什么其他选项错**：\n- B. Amazon GuardDuty：威胁检测\n- C. Amazon Detective：安全调查\n- D. AWS WAF：单应用层防护（FM 管理 WAF 策略但本身不集中管安全组）\n\n**📌 关键概念**：跨账户集中防火墙策略 → Firewall Manager（需 Organizations）；「集中+多账户」关键词锁定 FM。典型错因：选 WAF——WAF 只管单应用层防护，FM 才是跨账户统一管理 WAF/安全组策略的那一层。","s":"源#197"},{"id":"D2-198","d":2,"t":"single","q":"根据 AWS 共享责任模型，哪项任务是 AWS 的责任？","o":[{"l":"A","t":"对 Amazon EC2 实例应用客操作系统补丁。"},{"l":"B","t":"提供人力资源信息管理（HRIM）系统的监控。"},{"l":"C","t":"对 Amazon RDS 实例执行自动备份。"},{"l":"D","t":"优化运行 AWS 服务的成本。"}],"a":["C"],"e":"**✅ 为什么 C. 对 Amazon RDS 实例执行自动备份 对**：RDS 是托管服务，自动备份由 AWS 负责执行（客户可配置窗口与保留期），属 AWS 责任。RDS 是托管数据库服务，自动备份由 AWS 在客户设定窗口执行，客户只配置窗口与保留期。\n\n**❌ 为什么其他选项错**：\n- A. 对 EC2 实例应用客户 OS 补丁：客户责任\n- B. 提供 HRIM 系统监控：客户应用层\n- D. 优化 AWS 服务成本：客户责任\n\n**📌 关键概念**：RDS 自动备份 = AWS；EC2 OS 补丁、应用监控、成本优化 = 客户。托管服务内部操作 → AWS；客户侧配置决策 → 客户。","s":"源#198"},{"id":"D2-200","d":2,"t":"multiple","q":"根据 AWS 共享责任模型，哪两项行动是 AWS 的责任？","o":[{"l":"A","t":"保护虚拟化层"},{"l":"B","t":"修补 Amazon EC2 实例上的操作系统"},{"l":"C","t":"为 IAM 用户强制执行严格的密码策略"},{"l":"D","t":"修补 Amazon RDS 实例上的操作系统"},{"l":"E","t":"配置安全组和网络 ACL"}],"a":["A","D"],"e":"**✅ 为什么 A、D 对**：\n- A. 保护虚拟化层：虚拟化（Hypervisor）层由 AWS 负责，是「云安全」基础设施部分\n- D. 修补 Amazon RDS 实例上的操作系统：RDS 托管实例的 OS 补丁由 AWS 负责\n\n**❌ 为什么其他选项错**：\n- B. 修补 EC2 实例上的操作系统：EC2 客户 OS 补丁属客户\n- C. 为 IAM 用户强制密码策略：客户 IAM 管理责任\n- E. 配置安全组和网络 ACL：客户网络配置责任\n\n**📌 关键概念**：共享责任模型看「谁能动那层」——虚拟化层、物理硬件、托管服务（RDS/Aurora 等）OS 补丁归 AWS；EC2 客户 OS、IAM 策略、安全组/网络 ACL 归客户。典型错因：把「托管服务」误当客户责任。区分句：AWS 管云（of the cloud），客户管云中（in the cloud）。","s":"源#200"},{"id":"D2-202","d":2,"t":"single","q":"哪种 AWS 服务或资源可以用来识别用户在指定日期范围内使用过的服务？","o":[{"l":"A","t":"Amazon S3 访问控制列表（ACL）"},{"l":"B","t":"AWS 证书管理器（ACM）"},{"l":"C","t":"网络访问分析器"},{"l":"D","t":"AWS 身份和访问管理访问分析器"}],"a":["D"],"e":"**✅ 为什么 D. AWS 身份和访问管理访问分析器 对**：IAM Access Analyzer 与 CloudTrail 集成，可分析 IAM 主体在指定日期范围内实际使用过的服务，正符合题干。IAM Access Analyzer 结合 CloudTrail 数据生成 IAM 实体清单，可查看用户/角色在指定时间范围内实际访问的服务，用于权限审计与未用权限清理。\n\n**❌ 为什么其他选项错**：\n- A. Amazon S3 ACL：控制对象访问，不记录服务使用历史\n- B. AWS 证书管理器（ACM）：TLS 证书管理\n- C. 网络访问分析器：分析 VPC 网络可达性，不追踪服务使用\n\n**📌 关键概念**：服务使用历史 → IAM Access Analyzer（+CloudTrail 数据）；网络路径 → Network Access Analyzer。服务使用历史 → Access Analyzer；外部共享识别 → 同源功能。","s":"源#202"},{"id":"D2-203","d":2,"t":"single","q":"一家公司需要聘请第三方顾问来帮助维护和支持其 AWS 环境以及公司的业务需求。哪种AWS 服务或资源将满足这些要求？","o":[{"l":"A","t":"AWS 支持"},{"l":"B","t":"AWS 组织"},{"l":"C","t":"AWS 服务目录"},{"l":"D","t":"AWS 合作伙伴网络（APN）"}],"a":["D"],"e":"**✅ 为什么 D. AWS 合作伙伴网络（APN）对**：APN 是第三方伙伴计划，可对接外部顾问公司提供环境维护与业务支持，正符合「聘请第三方顾问」。APN 是 AWS 全球合作伙伴生态，覆盖咨询、集成、托管服务等类型，客户可从中选聘顾问维护 AWS 环境。\n\n**❌ 为什么其他选项错**：\n- A. AWS 支持：AWS 官方支持计划，不替代第三方顾问\n- B. AWS 组织：多账户管理服务\n- C. AWS 服务目录：IT 服务目录治理\n\n**📌 关键概念**：找第三方服务商 → APN 合作伙伴；找 AWS 官方 → Support 计划；两者服务提供方不同。边界条件：题目要「聘请顾问维护环境」这类人力服务时选 APN；要官方响应 SLA 时选 Support，别反选。","s":"源#203"},{"id":"D2-211","d":2,"t":"single","q":"哪种 AWS 安全服务通过始终开启的检测和自动内联缓解措施来保护应用程序免受分布式拒绝服务（DDoS）攻击？","o":[{"l":"A","t":"Amazon Inspector"},{"l":"B","t":"AWS Web 应用程序防火墙（AWS WAF）"},{"l":"C","t":"弹性负载均衡（ELB）"},{"l":"D","t":"AWS Shield"}],"a":["D"],"e":"**✅ 为什么 D. AWS Shield 对**：AWS Shield 提供始终开启的 DDoS 检测与自动内联缓解，专门防护分布式拒绝服务攻击。AWS Shield 提供始终开启的 DDoS 检测与自动内联缓解（Standard 免费内置），Advanced 版增加成本保护与 24×7 SRT 团队。攻击发生时自动内联缓解意味着无需人工介入即可清洗流量，保障业务连续性与可用性。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Inspector：漏洞扫描\n- B. AWS WAF：Web 应用层过滤（不主打 DDoS）\n- C. ELB：负载均衡，无 DDoS 缓解能力\n\n**📌 关键概念**：DDoS 防护 → Shield（默认/高级两档）；漏洞 → Inspector；Web 攻击 → WAF。记住「始终开启」四个字是 Shield 专属表述，题干出现即选 Shield；WAF 需自行配置规则，并非始终开启。","s":"源#211"},{"id":"D2-212","d":2,"t":"single","q":"哪个 AWS 服务允许用户使用常见的编程语言来建模和配置 AWS 资源？","o":[{"l":"A","t":"AWS CloudFormation"},{"l":"B","t":"AWS CodePipeline"},{"l":"C","t":"AWS Cloud Development Kit (AWS CDK)"},{"l":"D","t":"AWS Systems Manager"}],"a":["C"],"e":"**✅ 为什么 C. AWS Cloud Development Kit (AWS CDK) 对**：CDK 允许用 TypeScript、Python、Java、C# 等常见编程语言建模并配置 AWS 资源，以代码方式定义基础设施。CDK 用 TypeScript/Python/Java/C# 等编程语言定义云资源，代码化基础设施（IaC），底层仍合成 CloudFormation 模板部署。相比手写 JSON/YAML 模板，编程语言带来循环、条件、抽象与类型检查，适合熟悉代码的团队提升 IaC 效率。\n\n**❌ 为什么其他选项错**：\n- A. AWS CloudFormation：用 JSON/YAML 模板而非编程语言\n- B. AWS CodePipeline：CI/CD 流水线服务\n- D. AWS Systems Manager：运维管理服务\n\n**📌 关键概念**：编程语言定义资源 → CDK（IaC 进阶）；模板文件定义 → CloudFormation。易混对照：CDK 底层仍合成 CloudFormation 模板——两者是「写法」之别（代码 vs 声明文件），不是两套部署体系。","s":"源#212"},{"id":"D2-214","d":2,"t":"single","q":"以下哪个作为实例级防火墙控制入站和出站访问？","o":[{"l":"A","t":"网络访问控制列表"},{"l":"B","t":"安全组"},{"l":"C","t":"AWS Trusted Advisor"},{"l":"D","t":"虚拟私有网关"}],"a":["B"],"e":"**✅ 为什么 B. 安全组 对**：安全组是实例级虚拟防火墙，控制单个 EC2 实例的入站与出站流量，正符合题干「实例级」。安全组是 EC2 实例的虚拟防火墙，规则按协议/端口双向控制，有状态且回包自动放行，是实例级访问控制标准答案。\n\n**❌ 为什么其他选项错**：\n- A. 网络 ACL：子网级防火墙（无状态）\n- C. AWS Trusted Advisor：最佳实践建议\n- D. 虚拟私有网关：VPN 接入组件\n\n**📌 关键概念**：实例级 → 安全组（有状态）；子网级 → NACL（无状态）。实例级有状态 → 安全组；子网级无状态 → NACL。","s":"源#214"},{"id":"D2-216","d":2,"t":"single","q":"一家公司有具有不同工作角色和职责的团队。公司的员工经常更换团队。公司需要管理员工的权限，以便权限适合工作职责。公司应该使用哪种 IAM 资源以最小的运营开销满足此要求？","o":[{"l":"A","t":"IAM 用户组"},{"l":"B","t":"IAM 角色"},{"l":"C","t":"IAM 实例配置文件"},{"l":"D","t":"针对个别用户的 IAM 策略"}],"a":["B"],"e":"**✅ 为什么 B. IAM 角色 对**：员工频繁更换团队时，按角色分配临时权限比逐个维护用户策略更灵活、运维开销更小，正符合「最小运营开销」。IAM 角色按职责定义权限集，员工换团队时只需切换角色，无需逐人改策略，运营开销最小。\n\n**❌ 为什么其他选项错**：\n- A. IAM 用户组：按固定组划分，人员流动仍需频繁改组成员\n- C. IAM 实例配置文件：给 EC2 实例用，不是给人\n- D. 针对个别用户的 IAM 策略：逐人维护策略，开销大\n\n**📌 关键概念**：人员频繁变动 → 用角色/临时凭证；固定组织 → 用户组；「最小运维开销」关键词锁定角色。人员流动 → 角色（临时凭证）；「最小运营开销」题眼锁角色。","s":"源#216"},{"id":"D2-217","d":2,"t":"single","q":"一家公司可以使用哪个 AWS 服务来安全地存储和加密数据库的密码？","o":[{"l":"A","t":"AWS Shield"},{"l":"B","t":"AWS Secrets Manager"},{"l":"C","t":"AWS Identity and Access Management (IAM)"},{"l":"D","t":"Amazon Cognito"}],"a":["B"],"e":"**✅ 为什么 B. AWS Secrets Manager 对**：Secrets Manager 专用于安全存储、自动轮换数据库密码等敏感凭据，内置加密与细粒度权限。Secrets Manager 安全存储数据库密码等凭据，内置 KMS 加密、细粒度 IAM 权限与自动轮换，原生支持 RDS 等数据库引擎。配合自动轮换功能，数据库密码可按周期自动更新而无需修改应用（SDK 原生支持取密），显著降低泄露影响面。\n\n**❌ 为什么其他选项错**：\n- A. AWS Shield：DDoS 防护\n- C. IAM：身份与权限管理，不是凭据存储库\n- D. Amazon Cognito：用户身份认证池\n\n**📌 关键概念**：存密码/凭据 → Secrets Manager；身份认证 → Cognito；权限管理 → IAM。易混对照：Secrets Manager 管「应用的秘密」（数据库密码），KMS 管「加密的密钥材料」——一个存凭据、一个造密钥。","s":"源#217"},{"id":"D2-218","d":2,"t":"single","q":"云从业者可以使用什么来检索 AWS 安全和合规文件，并将它们作为证据提交给审计师或监管机构？","o":[{"l":"A","t":"AWS Certificate Manager"},{"l":"B","t":"AWS Systems Manager"},{"l":"C","t":"AWS Artifact"},{"l":"D","t":"Amazon Inspector"}],"a":["C"],"e":"**✅ 为什么 C. AWS Artifact 对**：Artifact 提供 AWS 安全与合规文档（SOC/ISO/PCI 等报告）的按需访问，可作为审计证据。AWS Artifact 提供 SOC/ISO/PCI 等合规报告与协议的自助下载，是向审计师提交 AWS 侧合规证据的标准入口。报告类型包括 SOC 1/2/3、ISO 27001/9001/27017/27018、PCI DSS 等，覆盖主流合规框架需求。报告全程自助式获取，速度快，无需等待人工处理流程，审计窗口期紧张时尤其实用。\n\n**❌ 为什么其他选项错**：\n- A. ACM：TLS 证书管理\n- B. Systems Manager：运维管理\n- D. Amazon Inspector：漏洞扫描\n\n**📌 关键概念**：合规报告下载 → Artifact；证书 → ACM；漏洞 → Inspector；运维 → Systems Manager。Artifact 名字含义即「合规文档库」，与安全检测类服务职能完全不同。","s":"源#218"},{"id":"D2-219","d":2,"t":"multiple","q":"哪种加密类型可用于保护 Amazon S3 中静止的对象？（选择两个）","o":[{"l":"A","t":"使用 Amazon S3 管理的加密密钥的服务器端加密（SSE-S3）"},{"l":"B","t":"使用 AWS KMS 管理的密钥的服务器端加密（SSE-KMS）"},{"l":"C","t":"TLS"},{"l":"D","t":"SSL"},{"l":"E","t":"透明数据加密（TDE）"}],"a":["A","B"],"e":"**✅ 为什么 A、B 对**：\n- A. SSE-S3：使用 Amazon S3 管理的密钥加密静态对象，属服务器端加密\n- B. SSE-KMS：使用 AWS KMS 管理的密钥做服务器端加密，也是 S3 静态加密\n\n**❌ 为什么其他选项错**：\n- C. TLS：传输层加密（数据在途），不加密静止对象\n- D. SSL：传输层协议，同样管传输\n- E. TDE：透明数据加密用于数据库，不适用 S3 对象\n\n**📌 关键概念**：S3 静态加密三选：SSE-S3（S3 管理密钥）、SSE-KMS（KMS 管理密钥）、SSE-C（客户提供密钥）；TLS/SSL 管传输中加密，TDE 是数据库技术。高频易错：题干写「at rest / 静态」选 SSE 系，写「in transit / 在途」选 TLS/SSL，方向一反即错。","s":"源#219"},{"id":"D2-220","d":2,"t":"single","q":"一家公司希望将其在线购物网站与社交媒体登录凭据集成。公司可以使用哪个AWS 服务来实现此集成？","o":[{"l":"A","t":"AWS Directory Service"},{"l":"B","t":"AWS Identity and Access Management (IAM)"},{"l":"C","t":"Amazon Cognito"},{"l":"D","t":"AWS IAM Identity Center (AWS Single Sign-On)"}],"a":["C"],"e":"**✅ 为什么 C. Amazon Cognito 对**：Cognito 支持社交媒体登录（Facebook、Google 等第三方 IdP）集成，可直接为购物网站提供社交登录能力。Cognito 用户池原生支持 Facebook/Google/Amazon 等社交 IdP 与 SAML/OIDC 企业 IdP，为应用终端用户提供注册登录与令牌签发。相比自建用户体系，Cognito 免去密码存储与找回等开发量，并可与用户目录（LDAP/AD）打通。\n\n**❌ 为什么其他选项错**：\n- A. AWS Directory Service：活动目录接入\n- B. IAM：管理 AWS 资源权限，不面向网站用户\n- D. AWS IAM Identity Center：面向 AWS 与云应用的 SSO\n\n**📌 关键概念**：社交登录/终端用户身份 → Cognito；AWS 账户 SSO → IAM Identity Center。典型错因：面向「自己员工进 AWS 控制台」的场景选 IAM Identity Center；面向「网站/App 终端用户」的场景才选 Cognito，服务对象是分水岭。","s":"源#220"},{"id":"D2-221","d":2,"t":"single","q":"哪家公司可以使用 AWS 服务来跟踪、记录和审计对 AWS 资源所做的配置更改？","o":[{"l":"A","t":"AWS Shield"},{"l":"B","t":"AWS Config"},{"l":"C","t":"AWS IAM"},{"l":"D","t":"Amazon Inspector"}],"a":["B"],"e":"**✅ 为什么 B. AWS Config 对**：Config 持续监控并记录 AWS 资源配置变更，提供配置历史与合规审计，正符合「跟踪、记录、审计配置更改」。AWS Config 持续记录资源配置快照与变更历史，可按规则评估合规性，正符合「跟踪、记录、审计配置更改」三关键词。配置项历史可回溯任意时间点资源状态，支持合规规则（Config Rules）自动评估与不合规资源告警。\n\n**❌ 为什么其他选项错**：\n- A. AWS Shield：DDoS 防护\n- C. AWS IAM：身份权限管理\n- D. Amazon Inspector：漏洞扫描\n\n**📌 关键概念**：配置变更审计 → Config；API 调用审计 → CloudTrail；漏洞 → Inspector。典型错因：两者都带「审计」字样——Config 审计「资源长什么样」，CloudTrail 审计「谁调用了什么 API」，前者看状态、后者看动作。","s":"源#221"},{"id":"D2-223","d":2,"t":"single","q":"一家公司的网站正在遭受 DDoS 攻击。哪家 AWS 服务可以帮助保护该公司的网站免受这些攻击？","o":[{"l":"A","t":"AWS Resource Access Manager"},{"l":"B","t":"AWS Amplify"},{"l":"C","t":"AWS Shield"},{"l":"D","t":"Amazon GuardDuty"}],"a":["C"],"e":"**✅ 为什么 C. AWS Shield 对**：Shield 提供托管 DDoS 防护（Standard 免费内置、Advanced 增强），正符合网站防 DDoS 场景。AWS Shield 提供托管 DDoS 防护：Standard 全账户免费内置，Advanced 提供高级缓解与成本保护。网站正遭 DDoS → Shield。ELB 与 Route 53 等架构组件也参与流量分发与容灾，但真正识别并清洗 DDoS 流量的服务是 Shield。\n\n**❌ 为什么其他选项错**：\n- A. AWS Resource Access Manager：资源共享\n- B. AWS Amplify：Web 应用开发部署平台\n- D. Amazon GuardDuty：威胁检测（发现威胁≠缓解 DDoS）\n\n**📌 关键概念**：DDoS 缓解 → Shield；威胁发现 → GuardDuty；Web 应用攻击过滤 → WAF。考试出现「正遭受 DDoS」措辞时，答案基本锁定 Shield；GuardDuty 只「发现」威胁情报线索，不负责「清洗」流量。","s":"源#223"},{"id":"D2-224","d":2,"t":"single","q":"一家公司想要对其当前的本地环境进行定制评估。公司想要了解其在 AWS 云中的预计运行成本。哪家 AWS 服务或工具将满足这些要求？","o":[{"l":"A","t":"AWS Trusted Advisor"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"AWS Control Tower"},{"l":"D","t":"Migration Evaluator"}],"a":["D"],"e":"**✅ 为什么 D. Migration Evaluator 对**：Migration Evaluator 免费提供本地环境评估与 AWS 云运行成本预测，正符合「定制评估+预计运行成本」。Migration Evaluator（原 TSO Logic）免费提供本地环境评估，基于真实数据估算 AWS 运行成本，输出迁移商业案例。评估基于本地虚拟化环境真实负载数据，输出 TCO 对比与实例规格建议，帮助决策迁移优先级。\n\n**❌ 为什么其他选项错**：\n- A. AWS Trusted Advisor：账号最佳实践检查\n- B. Amazon Inspector：漏洞扫描\n- C. AWS Control Tower：多账户治理\n\n**📌 关键概念**：迁移前成本评估 → Migration Evaluator；迁移执行 → Application Migration Service / Migration Hub。边界条件：题目问「预计要花多少钱」选前者；问「怎么把机器搬过去」选 MGN，别把评估工具当执行工具。","s":"源#224"},{"id":"D2-226","d":2,"t":"multiple","q":"一家公司在 AWS 云中托管了一个应用程序。公司想要验证底层 AWS 服务和通用AWS 基础设施是否正常运行。公司可以使用哪种 AWS 服务组合来收集所需信息？（选择两个）","o":[{"l":"A","t":"AWS 个人健康仪表板"},{"l":"B","t":"AWS 系统管理器"},{"l":"C","t":"AWS Trusted Advisor"},{"l":"D","t":"AWS 服务健康仪表板"},{"l":"E","t":"AWS 服务目录"}],"a":["A","D"],"e":"**✅ 为什么 A、D 对**：\n- A. AWS 个人健康仪表板：显示当前账户所用 AWS 服务状态（个性化）\n- D. AWS 服务健康仪表板：显示 AWS 所有服务的通用状态\n\n**❌ 为什么其他选项错**：\n- B. AWS 系统管理器：运维管理，不展示服务运行状态\n- C. AWS Trusted Advisor：最佳实践建议\n- E. AWS 服务目录：IT 服务治理\n\n**📌 关键概念**：验证服务运行状态 → 个人 + 服务健康仪表板组合；一个看自己、一个看全局。PHD 看自己、SHD 看全局；验证服务可用性两个仪表板都是答案。个人健康仪表板（PHD）展示影响「本账户」的服务事件；服务健康仪表板展示「所有」服务状态。两者结合既看个人又看全局。","s":"源#226"},{"id":"D2-229","d":2,"t":"single","q":"一家公司在 AWS 上托管了大量数据。公司想要确定是否有任何数据应被视为敏感。AWS 服务将满足该要求？","o":[{"l":"A","t":"Amazon Inspector"},{"l":"B","t":"Amazon Macie"},{"l":"C","t":"AWS Identity and Access Management (IAM)"},{"l":"D","t":"Amazon CloudWatch"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Macie 对**：Macie 用机器学习自动发现、分类 S3 中敏感数据（PII 等），正符合「确定哪些数据应被视为敏感」。Macie 用机器学习与模式识别自动发现、分类 S3 中敏感数据（PII/密钥/财务），持续监控并生成发现报告。发现结果按敏感类别分级呈现，可与 Security Hub 集成统一查看，是数据保护与隐私合规的起点。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Inspector：工作负载漏洞扫描\n- C. AWS IAM：身份权限管理\n- D. Amazon CloudWatch：监控与告警\n\n**📌 关键概念**：敏感数据识别 → Macie；监控指标/告警 → CloudWatch。易混对照：Macie 认的是「数据内容敏感不敏感」，Inspector 查的是「工作负载有没有漏洞」——一个审数据、一个审主机，PII 场景必选 Macie。","s":"源#229"},{"id":"D2-231","d":2,"t":"single","q":"谁为 Amazon Elastic Block Store（AmazonEBS）启用了静态数据的加密？","o":[{"l":"A","t":"AWS 支持"},{"l":"B","t":"AWS 客户"},{"l":"C","t":"AWS 密钥管理服务（AWS KMS）"},{"l":"D","t":"AWS Trusted Advisor"}],"a":["B"],"e":"**✅ 为什么 B. AWS 客户 对**：EBS 加密需客户在创建卷时手动启用（或在 KMS 配置默认加密），属客户责任。EBS 加密由客户在创建卷/快照时启用（或账户级默认加密），密钥可选用 KMS；AWS 只提供加密能力，启用决策在客户。\n\n**❌ 为什么其他选项错**：\n- A. AWS 支持：提供咨询，不负责启用\n- C. AWS KMS：提供密钥基础设施，但加密由客户触发\n- D. AWS Trusted Advisor：建议服务\n\n**📌 关键概念**：EBS 加密默认关闭，必须由客户启用；KMS 是密钥后端，不是「谁启用」的答案。EBS 加密「谁启用」→ 客户；密钥基础设施 → KMS。","s":"源#231"},{"id":"D2-232","d":2,"t":"single","q":"用户可以使用 AWS CloudTrail 完成什么？","o":[{"l":"A","t":"生成 IAM 用户凭据报告。"},{"l":"B","t":"记录对 AWS 服务的 API 调用。"},{"l":"C","t":"评估 AWS 资源配置与策略和指南的合规性。"},{"l":"D","t":"确保 Amazon EC2 实例使用最新的安全更新进行补丁修补。"}],"a":["B"],"e":"**✅ 为什么 B. 记录对 AWS 服务的 API 调用 对**：CloudTrail 记录账户内 API 调用（谁、何时、什么操作），用于治理与审计。CloudTrail 记录账户内 API 调用（含控制台操作），默认保留 90 天事件历史，可投递 S3 长期归档，是治理与审计基础。可配置多区域轨迹与组织级轨迹，配合 CloudWatch 或 EventBridge 对敏感 API（如删桶）实时告警。\n\n**❌ 为什么其他选项错**：\n- A. 生成 IAM 凭据报告：由 IAM 控制台/CLI 生成\n- C. 评估配置合规性：AWS Config 的职责\n- D. 确保 EC2 补丁：Systems Manager Patch Manager\n\n**📌 关键概念**：API 调用日志 → CloudTrail；配置合规 → Config；凭据报告 → IAM。典型错因：三个审计口各管一段——CloudTrail 管「操作」，Config 管「配置状态」，凭据报告管「用户凭证状态」，按审计对象分流。","s":"源#232"},{"id":"D2-234","d":2,"t":"single","q":"AWS 服务或功能将搜索并识别 AWS 资源是否与外部共享？","o":[{"l":"A","t":"Amazon OpenSearch Service"},{"l":"B","t":"AWS Control Tower"},{"l":"C","t":"AWS IAM 访问分析器"},{"l":"D","t":"AWS Fargate"}],"a":["C"],"e":"**✅ 为什么 C. AWS IAM 访问分析器 对**：IAM Access Analyzer 分析资源策略，识别与外部主体意外共享的 AWS 资源，正符合「识别资源是否与外部共享」。IAM Access Analyzer 基于区域启用，分析资源策略识别「与外部主体共享」的资源（S3 桶策略、KMS 密钥策略等），产出安全风险发现。例如桶策略误将「*」设为主体时，Access Analyzer 会标记为外部共享风险，提示收敛权限。\n\n**❌ 为什么其他选项错**：\n- A. Amazon OpenSearch Service：搜索分析引擎\n- B. AWS Control Tower：多账户治理基线\n- D. AWS Fargate：无服务器容器运行时\n\n**📌 关键概念**：外部共享风险识别 → IAM Access Analyzer（基于区域启用、分析资源策略）。外部共享识别 → Access Analyzer；多账户治理 → Control Tower。","s":"源#234"},{"id":"D2-236","d":2,"t":"single","q":"在哪个支持级别下，用户可以获得支持礼宾服务？","o":[{"l":"A","t":"基础支持"},{"l":"B","t":"开发者支持"},{"l":"C","t":"商业支持"},{"l":"D","t":"企业支持"}],"a":["D"],"e":"**✅ 为什么 D. 企业支持 对**：企业支持（Enterprise Support）独享支持礼宾服务（Support Concierge），面向关键任务负载的组织。企业支持独享支持礼宾（Concierge）与 TAM 技术客户经理，面向任务关键型工作负载；商业支持有 24×7 电话但无礼宾与 TAM。\n\n**❌ 为什么其他选项错**：\n- A. 基础支持：免费，无人工礼宾\n- B. 开发者支持：仅工作时间邮件支持\n- C. 商业支持：无礼宾服务\n\n**📌 关键概念**：礼宾服务（TAM、Concierge）→ 企业支持专属；商业支持有 24×7 电话但无 TAM。易混对照：商业级 = 24×7 电话+第三方案例支持；企业级在此之上加 TAM+礼宾——「礼宾」二字出现即锁最高档。","s":"源#236"},{"id":"D2-237","d":2,"t":"single","q":"一家公司可以使用哪家 AWS 服务来可视化设计和构建无服务器应用程序？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"AWS Batch"},{"l":"C","t":"AWS 应用程序组合器"},{"l":"D","t":"AWS App Runner"}],"a":["C"],"e":"**✅ 为什么 C. AWS 应用程序组合器 对**：AWS Application Composer 提供可视化画布，拖拽组合无服务器架构并生成 IaC 模板，正符合「可视化设计构建无服务器应用」。Application Composer 提供可视化画布，拖拽 Lambda/API Gateway/DynamoDB 等无服务器组件连线即生成 IaC 模板，降低无服务器设计门槛。生成的模板可入 Git 版本管理与团队协作，兼顾可视化易用性与 IaC 工程化。\n\n**❌ 为什么其他选项错**：\n- A. AWS Lambda：无服务器计算执行，不是设计工具\n- B. AWS Batch：批量计算作业服务\n- D. AWS App Runner：容器/Web 应用快速部署\n\n**📌 关键概念**：可视化设计无服务器 → Application Composer；云端 IDE → Cloud9。边界条件：Composer 产出的是「架构与 IaC 模板」，不是代码编辑器——写代码回 Cloud9，画无服务器架构才用 Composer。","s":"源#237"},{"id":"D2-239","d":2,"t":"single","q":"一家公司已部署了 Amazon EC2 实例。哪个选项是 AWS 根据 AWS 共享责任模型的责任？","o":[{"l":"A","t":"管理和加密应用程序数据"},{"l":"B","t":"安装客户操作系统的更新和安全补丁"},{"l":"C","t":"基础设施设备的配置"},{"l":"D","t":"每个实例上安全组的配置"}],"a":["C"],"e":"**✅ 为什么 C. 基础设施设备的配置 对**：共享责任模型中，物理与基础设施设备（含硬件、网络、虚拟化层）由 AWS 负责配置维护。共享责任模型：AWS 负责「云本身」安全（物理、硬件、网络、虚拟化、基础设施设备配置）；客户负责「云中」安全（数据、客户 OS、应用、安全组）。\n\n**❌ 为什么其他选项错**：\n- A. 管理和加密应用程序数据：客户责任\n- B. 安装客户 OS 更新与补丁：客户责任\n- D. 每个实例上安全组的配置：客户责任\n\n**📌 关键概念**：EC2 场景 = AWS 管到虚拟化层；客户 OS/安全组/数据 = 客户。基础设施设备配置 → AWS 责任高频考点。","s":"源#239"},{"id":"D2-241","d":2,"t":"multiple","q":"一家公司正在使用 Amazon DynamoDB 作为其应用程序数据库。根据 AWS 共享责任模型，哪些任务是 AWS 的责任？（选择两个）","o":[{"l":"A","t":"数据分类。"},{"l":"B","t":"配置访问权限。"},{"l":"C","t":"管理加密选项。"},{"l":"D","t":"提供公共端点以存储和检索数据。"},{"l":"E","t":"管理基础设施层和操作系统。"}],"a":["D","E"],"e":"**✅ 为什么 D、E 对**：\n- D. 提供公共端点以存储和检索数据：DynamoDB 的服务端点由 AWS 提供并维护\n- E. 管理基础设施层和操作系统：托管数据库的底座与 OS 由 AWS 负责\n\n**❌ 为什么其他选项错**：\n- A. 数据分类：客户对自己数据负责\n- B. 配置访问权限：客户用 IAM 管理访问\n- C. 管理加密选项：客户选择与配置加密方式\n\n**📌 关键概念**：托管服务（DynamoDB）责任边界——AWS 管端点、基础设施层与底座 OS；客户管数据分类、访问权限（IAM）、加密选项等决策。与自建对比：EC2 自建数据库时 OS 与补丁全归客户，换 DynamoDB 托管后底座上移给 AWS，属共享责任模型高频对比考点。","s":"源#241"},{"id":"D2-244","d":2,"t":"single","q":"一家公司想要通过 API 调用审查用户活动来提高其安全姿态。哪个 AWS 服务将满足此要求？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"Amazon Detective"},{"l":"C","t":"Amazon CloudWatch"},{"l":"D","t":"AWS CloudTrail"}],"a
