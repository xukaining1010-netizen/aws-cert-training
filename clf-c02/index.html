A","t":"Amazon Aurora"},{"l":"B","t":"Amazon Redshift Serverless"},{"l":"C","t":"AWS Lambda"},{"l":"D","t":"Amazon RDS"}],"a":["B"],"e":"Amazon Redshift Serverless（选项 B）是 AWS 服务，允许公司运营数据仓库以分析数据，而无需管理底层数据仓库基础设施。它是一个完全托管的无服务器数据仓库服务，可以轻松运行任何规模的分析工作负载。","s":"源#96"},{"id":"D3-097","d":3,"t":"multiple","q":"AWS 云计算如何帮助企业降低成本？（选择两项。）","o":[{"l":"A","t":"AWS 在每个 AWS 区域收取相同的服务价格。"},{"l":"B","t":"AWS 允许按需调整容量。"},{"l":"C","t":"AWS 为连续空闲超过 1 周的 Amazon EC2 实例提供折扣。"},{"l":"D","t":"AWS 不收取额外费用，用于从 AWS 云发送到互联网的数据。"},{"l":"E","t":"AWS 消除了构建和维护本地数据中心的许多成本。"}],"a":["B","E"],"e":"AWS 云计算通过允许按需调整容量（选项 B）帮助企业降低成本，这使得企业可以仅支付他们实际使用的资源，优化成本。此外，AWS 消除了与构建和维护本地数据中心相关的许多成本（选项 E），因为企业可以利用云基础设施而无需这些费用。","s":"源#97"},{"id":"D3-102","d":3,"t":"single","q":"一家公司在 AWS 云上运行工作负载。哪个 AWS 最佳实践确保了工作负载最具成本效益的架构？","o":[{"l":"A","t":"松耦合"},{"l":"B","t":"合适尺寸"},{"l":"C","t":"缓存"},{"l":"D","t":"冗余"}],"a":["B"],"e":"确保工作负载最具成本效益架构的 AWS 最佳实践是合适尺寸（选项 B）。合适尺寸涉及将实例类型和大小与工作负载的性能和容量要求相匹配，以最低可能的成本帮助优化成本和资源利用率。","s":"源#102"},{"id":"D3-103","d":3,"t":"single","q":"一家公司使用第三方服务将 10 TB 数据备份到磁带库。本地备份服务器的存储空间不足。公司希望使用 AWS 服务进行备份，而不需要更改其现有的备份工作流程。公司应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"Amazon EBS (Amazon EBS)"},{"l":"B","t":"AWS 存储网关"},{"l":"C","t":"Amazon ECS (Amazon ECS)"},{"l":"D","t":"AWS Lambda"}],"a":["B"],"e":"公司应该使用 AWS 存储网关（选项 B）来满足其要求，而不需要更改现有的备份工作流程。这个混合云存储服务集成了本地应用程序与云存储，支持各种存储协议，并允许数据备份到 AWS。","s":"源#103"},{"id":"D3-109","d":3,"t":"single","q":"一家公司想要为其基于 Windows 的应用程序提供完全托管的 Windows 文件服务器。哪家AWS 服务将满足此要求？","o":[{"l":"A","t":"Amazon FSx"},{"l":"B","t":"Amazon EKS (Amazon EKS)"},{"l":"C","t":"Amazon ECS (Amazon ECS)"},{"l":"D","t":"Amazon EMR"}],"a":["A"],"e":"满足为基于 Windows 的应用程序提供完全托管的 Windows 文件服务器要求的 AWS 服务是Amazon FSx（选项 A）。Amazon FSx 是一个完全托管的文件存储服务，与 Windows 文件服务器兼容。","s":"源#109"},{"id":"D3-110","d":3,"t":"single","q":"一家公司想要将其 NFS 本地工作负载迁移到 AWS。为了满足此要求，公司应该使用哪种AWS 存储网关类型？","o":[{"l":"A","t":"磁带网关"},{"l":"B","t":"卷网关"},{"l":"C","t":"Amazon FSx 文件网关"},{"l":"D","t":"Amazon S3 文件网关"}],"a":["D"],"e":"为了将 NFS 本地工作负载迁移到 AWS，公司应该使用Amazon S3 文件网关（选项 D）。这个网关支持文件接口到Amazon S3，并允许使用行业标准的文件协议如 NFS 存储和检索Amazon S3 中的对象。选项 D，Amazon S3 文件网关，是正确答案，因为它支持进入Amazon S3 的文件接口，并允许使用 NFS 等业界标准文件协议在 Amazon S3 中存储和检索对象。这使其适合将 NFS 工作负载迁移到 AWS，因为它使本地基于文件的应用程序能够与 Amazon S3 集成。","s":"源#110"},{"id":"D3-112","d":3,"t":"single","q":"一家公司有一个在 Amazon EC2 实例上运行的不间断应用程序。该应用程序不断地处理Amazon Simple Queue Service (SQS) 队列中的文件积压。这种使用预计将持续增长多年。哪种 EC2 实例购买模型最能以成本效益的方式满足这些要求？","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"按需实例"},{"l":"C","t":"储蓄计划"},{"l":"D","t":"专用主机"}],"a":["C"],"e":"对于一个预计会持续增长多年的不间断应用程序，最符合成本效益的 EC2 实例购买模型是储蓄计划（选项 C）。与按需实例相比，储蓄计划提供显著的成本节省，并提供在 1 年或 3 年期限内承诺一定使用量的灵活性。","s":"源#112"},{"id":"D3-113","d":3,"t":"single","q":"一家公司希望为其客户数据提供产品推荐。哪个 AWS 服务能满足这一要求？","o":[{"l":"A","t":"Amazon Polly"},{"l":"B","t":"Amazon Personalize"},{"l":"C","t":"Amazon Comprehend"},{"l":"D","t":"Amazon Rekognition"}],"a":["B"],"e":"Amazon Personalize（选项 B）是一个机器学习服务，可以根据客户数据提供个性化的产品推荐。","s":"源#113"},{"id":"D3-116","d":3,"t":"single","q":"一家公司希望使用一个完全托管的服务来帮助创建、测试和管理自定义 Amazon EC2 镜像。哪个AWS 服务能满足这些要求？","o":[{"l":"A","t":"EC2 图像构建器"},{"l":"B","t":"Amazon Machine Image (AMI)"},{"l":"C","t":"AWS 发射向导"},{"l":"D","t":"AWS Elastic Beanstalk"}],"a":["A"],"e":"EC2 图像构建器（选项 A）是一个完全托管的服务，可以帮助创建、测试和管理自定义 Amazon EC2 镜像。EC2 镜像构建器（选项A）是一种完全托管的 AWS 服务，自动化创建、测试和部署自定义服务器镜像。它简化了构建和维护自定义 EC2 AMI 的过程，使复制和部署服务器环境变得更加容易。","s":"源#116"},{"id":"D3-117","d":3,"t":"single","q":"一家公司希望自动化其 Amazon EC2 实例的软件漏洞持续扫描过程。哪个 AWS 服务能满足这些要求？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"Amazon Detective"},{"l":"D","t":"Amazon Cognito"}],"a":["B"],"e":"Amazon Inspector 是一个自动化漏洞管理服务，可连续扫描 Amazon Elastic Compute Cloud (EC2)、AWS Lambda 函数和容器工作负载，以查找软件漏洞和意外的网络暴露。","s":"源#117"},{"id":"D3-118","d":3,"t":"single","q":"一家公司需要每周执行一次数据处理，通常需要大约 5 小时才能完成。公司应该使用哪个AWS服务来处理这个工作负载？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"Amazon EC2"},{"l":"C","t":"AWS CodeDeploy"},{"l":"D","t":"AWS Wavelength"}],"a":["B"],"e":"对于需要每周处理一次大约 5 小时的工作负载，最好的 AWS 服务是 Amazon EC2。AWS Lambda 是一个无服务器计算服务，可以在不配置或管理服务器的情况下运行您的代码。然而，Lambda 函数的最大执行时间是 15 分钟。因此，Lambda 不适合需要运行超过15 分钟的工作负载。Amazon EC2 是一个可扩展的计算服务，提供具有不同功能和定价选项的实例。您可以选择适合您数据处理工作的EC2 实例，然后在工作完成时终止实例。","s":"源#118"},{"id":"D3-119","d":3,"t":"single","q":"哪个 AWS 服务或功能提供 VPC 中网络接口的入站和出站流量的日志信息？","o":[{"l":"A","t":"Amazon CloudWatch Logs"},{"l":"B","t":"AWS CloudTrail"},{"l":"C","t":"VPC 流日志"},{"l":"D","t":"AWS 身份和访问管理 (IAM)"}],"a":["C"],"e":"VPC 流日志是一个功能，可让您捕获有关 VPC 中网络接口的 IP 流量进出的信息。流日志数据可以发布到 Amazon CloudWatch Logs 或 Amazon S3。您可以监控 VPC 流日志，以获得有关网络依赖项和流量模式的操作可见性，检测异常和防止数据泄漏，或排除网络连接和配置问题。","s":"源#119"},{"id":"D3-121","d":3,"t":"single","q":"一家公司计划在 AWS 上部署容器。公司希望完全控制托管容器的计算资源。应该使用哪个AWS服务来满足这些要求？","o":[{"l":"A","t":"Amazon EKS（Amazon Elastic Kubernetes Service，简称 Amazon EKS）"},{"l":"B","t":"AWS Fargate"},{"l":"C","t":"Amazon EC2（Amazon EC2）"},{"l":"D","t":"Amazon ECS（Amazon Elastic Container Service，简称 Amazon ECS）"}],"a":["C"],"e":"本题答案选 C。原因如下：- 选项 A：Amazon EKS：它是一项托管式的 Kubernetes 服务，AWS 负责管理 Kubernetes 控制平面，但底层计算资源（如工作节点）可以使用 EC2 实例，也可以使用 Fargate。当使用 EC2 实例时，用户有一定对计算资源的控制权，但整体还是基于Kubernetes 编排，并非完全自由地控制计算资源，它更多强调的是 Kubernetes 环境的托管和容器编排功能。- 选项 B：AWS Fargate：是一种无服务器计算引擎，用于运行容器。用户无需管理底层的计算资源（如 EC2 实例），AWS 会自动分配和管理资源，用户只需专注于容器本身，所以不满足用户完全控制计算资源的需求。- 选项 C：Amazon EC2：用户可以完全自主地控制实例的配置，包括选择实例类型、CPU、内存、存储等，并且可以按照自己的需求进行操作系统的安装、配置和管理。用户可以在 EC2 实例上部署容器，从而实现对托管容器的计算资源的完全控制，符合题目要求。- 选项 D：Amazon ECS：是 AWS 提供的托管式容器编排服务，虽然可以结合 EC2 实例使用，但它主要侧重于容器的编排和管理，用户对底层计算资源的控制程度不如直接使用 EC2 实例。而且也可以和 Fargate 结合使用，当结合 Fargate 时，计算资源由AWS管理。","s":"源#121"},{"id":"D3-123","d":3,"t":"single","q":"一家公司希望通过使用行业标准文件系统协议，在 Amazon S3 中存储和检索文件，以供其现有的本地应用程序使用。哪个 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS DataSync"},{"l":"B","t":"AWS Snowball Edge"},{"l":"C","t":"Amazon S3 文件网关"},{"l":"D","t":"AWS Transfer Family"}],"a":["C"],"e":"Amazon S3 文件网关是 AWS 存储网关服务的一种配置，它为应用程序提供了一个文件接口，以无缝地将文件存储为Amazon S3 中的对象，并使用行业标准文件协议访问它们。这使其成为将本地应用程序与 Amazon S3 存储集成的理想解决方案。 Amazon S3 文件网关（选项C）使用户能够使用 NFS 或 SMB 等行业标准文件系统协议在 Amazon S3 中存储和检索对象。它作为 S3 的文件系统接口，允许本地应用程序与S3 交互，就像它是一个本地文件系统一样。","s":"源#123"},{"id":"D3-125","d":3,"t":"single","q":"一家公司想要一个统一的工具，提供一种与 AWS 服务交互的一致方法。哪种 AWS 服务或工具将满足此要求？","o":[{"l":"A","t":"AWS CLI"},{"l":"B","t":"Amazon Elastic 容器服务（Amazon ECS）"},{"l":"C","t":"AWS Cloud9"},{"l":"D","t":"AWS 虚拟专用网络（AWS VPN）"}],"a":["A"],"e":"AWS CLI（选项 A）是一个统一的命令行工具，旨在管理 AWS 服务。它提供了一种与 AWS 服务交互的一致方法，并通过脚本自动化任务。","s":"源#125"},{"id":"D3-138","d":3,"t":"single","q":"一家公司希望在 Amazon EC2 实例上运行其工作负载超过 1 年。该工作负载将连续运行。哪种选项提供了比按需实例每小时费率更优惠的费率？","o":[{"l":"A","t":"AWS Graviton 处理器"},{"l":"B","t":"专用主机"},{"l":"C","t":"EC2 实例节省计划"},{"l":"D","t":"Amazon EC2 自动扩展实例"}],"a":["C"],"e":"EC2 实例节省计划（选项 C）提供了比按需定价更优惠的每小时费率。通过承诺在 1 年或 3 年的期限内保持一致的使用量（以每小时美元计），客户可以节省计算成本。","s":"源#138"},{"id":"D3-139","d":3,"t":"single","q":"AWS 云的哪种特性帮助用户消除未充分利用的 CPU 容量？","o":[{"l":"A","t":"敏捷性"},{"l":"B","t":"弹性"},{"l":"C","t":"可靠性"},{"l":"D","t":"持久性"}],"a":["B"],"e":"弹性（选项 B）是允许用户根据需求扩展或缩减计算资源的特性。这有助于优化资源利用率并消除未充分利用的 CPU 容量。","s":"源#139"},{"id":"D3-143","d":3,"t":"single","q":"一家公司需要在客户端和 Amazon S3 存储桶之间快速安全地传输文件。哪个 S3 功能将满足此要求？","o":[{"l":"A","t":"S3 版本控制"},{"l":"B","t":"S3 传输加速"},{"l":"C","t":"S3 ACL"},{"l":"D","t":"S3 智能分层"}],"a":["B"],"e":"S3 传输加速（选项 B）旨在通过利用 Amazon CloudFront 的全球分布式边缘位置，快速安全地传输文件。它优化了传输速度并降低了延迟。","s":"源#143"},{"id":"D3-150","d":3,"t":"single","q":"哪个选项是由一个或多个数据中心组成的环境？","o":[{"l":"A","t":"Amazon CloudFront"},{"l":"B","t":"可用区"},{"l":"C","t":"VPC"},{"l":"D","t":"AWS Outposts"}],"a":["B"],"e":"可用区（选项 B）是 AWS 区域内的一个物理位置，由一个或多个数据中心组成，每个数据中心都具有冗余的电力、网络连接和连接性。","s":"源#150"},{"id":"D3-151","d":3,"t":"single","q":"一家公司正在将本地数据中心迁移到 AWS 云。公司必须将 50PB 的文件存储数据迁移到AWS，同时尽可能减少运营开销。为了满足这些要求，公司应该使用哪种 AWS 服务或资源？","o":[{"l":"A","t":"AWS Snowmobile"},{"l":"B","t":"AWS Snowball Edge"},{"l":"C","t":"AWS Data Exchange"},{"l":"D","t":"AWS 数据库迁移服务（AWS DMS）"}],"a":["A"],"e":"AWS Snowmobile（选项 A）是一项服务，旨在通过将数据物理传输到 AWS 数据中心，迁移非常大的数据量到 AWS，例如50PB。","s":"源#151"},{"id":"D3-153","d":3,"t":"single","q":"一家公司想要查询其服务器日志，以了解其客户体验的洞察。哪种 AWS 服务将以最具成本效益的方式存储这些数据？","o":[{"l":"A","t":"Amazon Aurora"},{"l":"B","t":"Amazon Elastic File System（Amazon EFS）"},{"l":"C","t":"Amazon Elastic Block Store（Amazon EBS）"},{"l":"D","t":"Amazon S3"}],"a":["D"],"e":"Amazon S3（选项 D）是一个可扩展且具有成本效益的对象存储服务，适合存储大量数据，如服务器日志，用于长期保留和查询。","s":"源#153"},{"id":"D3-157","d":3,"t":"single","q":"一家公司想要自动添加和删除 Amazon EC2 实例。公司希望 EC2 实例根据不同的工作负载动态调整。哪种服务或功能将满足这些要求？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon EC2 竞价实例"},{"l":"C","t":"AWS Snow Family"},{"l":"D","t":"Amazon EC2 自动扩展"}],"a":["D"],"e":"Amazon EC2 自动扩展（选项 D）根据需求自动扩展 EC2 实例的规模，确保应用程序以最佳性能和成本效率运行。","s":"源#157"},{"id":"D3-161","d":3,"t":"single","q":"一家公司在 Amazon RDS 数据库实例上运行关键工作负载。公司需要数据库实例具有高可用性，恢复时间少于 5 分钟。哪种解决方案将满足这些要求？","o":[{"l":"A","t":"为数据库实例创建读取副本。"},{"l":"B","t":"使用 AWS CloudFormation 创建数据库实例的模板。"},{"l":"C","t":"定期拍摄数据库实例的快照。将快照存储在 Amazon S3 中。"},{"l":"D","t":"将数据库实例修改为多 AZ 部署。"}],"a":["D"],"e":"Amazon RDS 数据库实例的多 AZ 部署（选项 D）自动创建一个主实例，并在不同的可用区同步复制数据到备用实例。在发生故障时，RDS 自动切换到备用实例，确保高可用性并满足恢复时间目标。","s":"源#161"},{"id":"D3-165","d":3,"t":"single","q":"一家公司想要识别与另一个 AWS 账户共享的 Amazon S3 存储桶。哪种 AWS 服务或功能将满足这些要求？","o":[{"l":"A","t":"AWS Lake Formation"},{"l":"B","t":"IAM 凭证报告"},{"l":"C","t":"Amazon CloudWatch"},{"l":"D","t":"IAM 访问分析器"}],"a":["D"],"e":"IAM 访问分析器（选项 D）是一项 AWS 服务，可帮助识别与外部实体共享的资源，包括 S3 存储桶、IAM 角色和其他AWS 资源。","s":"源#165"},{"id":"D3-166","d":3,"t":"single","q":"哪种 AWS 服务使用户能够构建包含机器学习洞察的交互式商业智能仪表板？","o":[{"l":"A","t":"Amazon Athena"},{"l":"B","t":"Amazon Kendra"},{"l":"C","t":"Amazon QuickSight"},{"l":"D","t":"Amazon Redshift"}],"a":["C"],"e":"Amazon QuickSight（选项 C）是一项商业智能服务，允许用户创建交互式仪表板，并包括机器学习能力，用于洞察和预测分析。","s":"源#166"},{"id":"D3-179","d":3,"t":"single","q":"以下哪项描述了 Amazon S3 的一些核心功能？","o":[{"l":"A","t":"Amazon S3 是为 Amazon EC2 设计的高性能块存储服务。"},{"l":"B","t":"Amazon S3 是提供高性能、安全性、可扩展性和数据可用性的的对象存储服务。"},{"l":"C","t":"Amazon S3 是一种完全托管的、高可靠性和可扩展性文件存储系统，可通过行业标准的 SMB 协议访问。"},{"l":"D","t":"Amazon S3 是一种可扩展的、完全托管的 Elastic NFS，用于 AWS 云服务和本地资源。"}],"a":["B"],"e":"Amazon S3（选项 B）是一种对象存储服务，以其高性能、安全性、可扩展性和数据可用性而闻名，使其成为在云中存储和检索数据的基础服务。","s":"源#179"},{"id":"D3-181","d":3,"t":"multiple","q":"哪些 AWS 服务或功能使用户能够将本地网络连接到 VPC？（选择两个。）","o":[{"l":"A","t":"AWS VPN"},{"l":"B","t":"弹性负载均衡"},{"l":"C","t":"AWS Direct Connect"},{"l":"D","t":"VPC peering"},{"l":"E","t":"Amazon CloudFront"}],"a":["A","C"],"e":"AWS VPN（选项 A）和 AWS Direct Connect（选项 C）是使用户能够在本地网络和 VPC 之间创建安全连接的服务，促进了本地网络向云的扩展。","s":"源#181"},{"id":"D3-182","d":3,"t":"single","q":"用户需要在 AWS 上快速部署非关系型数据库。用户不想管理底层硬件或数据库软件。哪种AWS 服务可以用来实现这一点？","o":[{"l":"A","t":"Amazon RDS"},{"l":"B","t":"Amazon DynamoDB"},{"l":"C","t":"Amazon Aurora"},{"l":"D","t":"Amazon Redshift"}],"a":["B"],"e":"Amazon DynamoDB（选项 B）是一种完全托管的非关系型数据库服务，消除了用户管理底层硬件或软件的需要，使其易于部署和使用。","s":"源#182"},{"id":"D3-183","d":3,"t":"multiple","q":"一个公司采取了哪些行动来优化其 AWS 资源以控制云成本？（选择两个。）","o":[{"l":"A","t":"从 Amazon RDS 切换到 Amazon DynamoDB 以适应 NoSQL 数据集。"},{"l":"B","t":"基于过去的使用模式选择 Amazon EC2 实例类型。"},{"l":"C","t":"使用 Amazon S3 生命周期策略将用户不频繁访问的对象移动到成本较低的存储层。"},{"l":"D","t":"对 Amazon RDS 使用多 AZ 部署。"},{"l":"E","t":"用 AWS Elastic Beanstalk 替换现有的 Amazon EC2 实例。"}],"a":["B","C"],"e":"基于过去的使用模式选择 Amazon EC2 实例类型（选项 B）和使用 Amazon S3 生命周期策略将不频繁访问的对象移动到成本较低的存储层（选项 C）是优化资源使用和控制成本的权利调整努力的例子。","s":"源#183"},{"id":"D3-188","d":3,"t":"single","q":"一家公司正在构建一个应用程序，该应用程序需要能够在应用程序组件之间发送、存储和接收消息。公司还有另一个要求，即以先进先出（FIFO）的顺序处理消息。公司应该使用哪种 AWS 服务？","o":[{"l":"A","t":"AWS Step Functions"},{"l":"B","t":"Amazon SNS（Amazon SNS）"},{"l":"C","t":"Amazon Kinesis 数据流"},{"l":"D","t":"Amazon SQS（Amazon SQS）"}],"a":["D"],"e":"Amazon SQS（Amazon SQS）（选项 D）是一种消息队列服务，它能够在应用程序组件之间发送、存储和接收消息，同时保持消息的 FIFO 顺序。","s":"源#188"},{"id":"D3-190","d":3,"t":"multiple","q":"一家公司想要将其数据库迁移到一个与 PostgreSQL 兼容的托管 AWS 服务。哪些AWS 服务将满足这些要求？（选择两个。）","o":[{"l":"A","t":"Amazon Athena"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"Amazon EC2"},{"l":"D","t":"Amazon DynamoDB"},{"l":"E","t":"Amazon Aurora"}],"a":["B","E"],"e":"Amazon RDS（选项 B）和 Amazon Aurora（选项 E）都提供了与 PostgreSQL 兼容的托管数据库服务，为公司的数据库提供了一个简单的迁移路径。","s":"源#190"},{"id":"D3-191","d":3,"t":"single","q":"一家公司有一支货船队。货船上装有在海上收集数据的传感器，海上可能存在间歇性或没有互联网连接的情况。公司需要在海上收集、格式化和处理数据，然后将数据稍后转移到 AWS。为了满足这些要求，公司应该使用哪种 AWS 服务？","o":[{"l":"A","t":"AWS IoT Core"},{"l":"B","t":"Amazon Lightsail"},{"l":"C","t":"AWS Storage Gateway"},{"l":"D","t":"AWS Snowball Edge"}],"a":["D"],"e":"AWS Snowball Edge（选项 D）是一项专为有限或没有互联网连接情况下的数据传输而设计的服务。它允许收集、处理数据，并在稍后将数据传输到 AWS。","s":"源#191"},{"id":"D3-194","d":3,"t":"single","q":"一家公司需要一个内容分发网络，提供安全的数据、视频、应用程序和 API 的全球交付，具有低延迟和高传输速度。哪种 AWS 服务满足这些要求？","o":[{"l":"A","t":"Amazon CloudFront"},{"l":"B","t":"弹性负载均衡"},{"l":"C","t":"Amazon S3"},{"l":"D","t":"Amazon Elastic Transcoder"}],"a":["A"],"e":"Amazon CloudFront（选项 A）是一个内容分发网络（CDN）服务，安全地向全球用户交付数据、视频、应用程序和API，具有低延迟和高传输速度。","s":"源#194"},{"id":"D3-196","d":3,"t":"single","q":"一家公司需要完全托管、高可靠性和可扩展的文件存储，可通过服务器消息块（SMB）协议访问。哪种 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"Amazon Elastic File System（Amazon EFS）"},{"l":"C","t":"Amazon FSx for Windows File Server"},{"l":"D","t":"Amazon Elastic Block Store（Amazon EBS）"}],"a":["C"],"e":"Amazon FSx for Windows File Server（选项 C）是一项完全托管的服务，提供高可靠性和可扩展的文件存储，并支持SMB 协议，适合基于 Windows 的工作负载。","s":"源#196"},{"id":"D3-199","d":3,"t":"single","q":"一家公司在私有子网中有 Amazon EC2 实例。公司想要启动连接到互联网以获取操作系统更新，同时阻止来自互联网的流量访问 EC2 实例。哪种 AWS 托管服务允许这样做？","o":[{"l":"A","t":"VPC 端点"},{"l":"B","t":"NAT 网关"},{"l":"C","t":"Amazon PrivateLink"},{"l":"D","t":"VPC 对等连接"}],"a":["B"],"e":"NAT 网关（选项 B）使私有子网中的实例能够访问互联网以进行更新操作系统等操作，同时阻止互联网启动连接到这些实例。","s":"源#199"},{"id":"D3-201","d":3,"t":"single","q":"一家公司正在 AWS 云中存储不常访问的数据。如果公司需要访问数据，则需要在12 小时内检索数据。公司希望解决方案对于每吉字节的存储成本具有成本效益。哪种 Amazon S3 存储类别将满足这些要求？","o":[{"l":"A","t":"S3 标准"},{"l":"B","t":"S3 Glacier Flexible Retrieval"},{"l":"C","t":"S3 One Zone-Infrequent Access（S3 One Zone-IA）"},{"l":"D","t":"S3 Standard-Infrequent Access（S3 Standard-IA）"}],"a":["B"],"e":"S3 Glacier Flexible Retrieval（选项 B）旨在提供长期存储和灵活的检索选项。与 S3 标准相比，它提供更低的存储成本，并且可以根据所选的检索选项在几分钟到几小时内访问，使其成为需要在 12 小时内检索的不常访问数据的成本效益选择。","s":"源#201"},{"id":"D3-205","d":3,"t":"single","q":"一家公司计划将数据备份移动到 AWS 云。公司需要用具有本地缓存的基于云的存储替换本地存储。哪种 AWS 服务满足这些要求？","o":[{"l":"A","t":"AWS 存储网关"},{"l":"B","t":"AWS Snowcone"},{"l":"C","t":"AWS 备份"},{"l":"D","t":"Amazon EFS（Amazon EFS）"}],"a":["A"],"e":"AWS 存储网关（选项 A）是一项服务，将本地存储系统连接到基于云的存储，提供混合存储解决方案，包括对频繁访问数据的本地缓存。","s":"源#205"},{"id":"D3-207","d":3,"t":"single","q":"一家公司需要在 AWS 上计划、安排和运行数十万个计算作业。公司可以使用哪种AWS 服务来满足此要求？","o":[{"l":"A","t":"AWS Step Functions"},{"l":"B","t":"AWS 服务目录"},{"l":"C","t":"Amazon SQS（Amazon SQS）"},{"l":"D","t":"AWS Batch"}],"a":["D"],"e":"AWS Batch（选项 D）是一项托管服务，使用户能够在 AWS 上运行批量计算作业。它旨在有效运行数十万个并行作业，适合大规模作业处理。","s":"源#207"},{"id":"D3-208","d":3,"t":"multiple","q":"哪些 AWS 服务或功能通过在不同的 AWS 区域之间启用故障转移来提供高可用性和低延迟？（选择两个。）","o":[{"l":"A","t":"Amazon Route 53（Amazon Route 53）"},{"l":"B","t":"网络负载均衡器（Network Load Balancer）"},{"l":"C","t":"Amazon S3 传输加速（Amazon S3 Transfer Acceleration）"},{"l":"D","t":"AWS 全球加速器（AWS Global Accelerator）"},{"l":"E","t":"应用程序负载均衡器（Application Load Balancer）"}],"a":["A","D"],"e":"根据该问题，通过在不同的 AWS 区域间实现故障转移来提供高可用性和低延迟的两项 AWS 服务或功能如下：1. Amazon Route 53；2. AWS 全球加速器。以下简要说明这些服务如何实现跨区域故障转移，并提供具有低延迟的高可用性：1. Amazon Route 53： - 它是一项全球域名系统（DNS）服务，支持在多个 AWS 区域间进行智能流量路由。 - Route 53 提供多种路由策略，包括基于延迟的路由和地理位置路由，可将用户引导至距离最近的健康端点。 - 它会执行健康检查，以监控资源的运行状况，一旦检测到问题，能够自动故障转移到不同区域中的健康端点。 - 该服务有助于提升全球用户使用应用程序时的可用性和性能。2. AWS 全球加速器： - 这是一项网络服务，可提升面向本地和全球用户的应用程序的可用性和性能。 - 全球加速器提供静态 IP 地址，这些地址作为通往位于多个 AWS 区域中的应用程序端点的固定入口点。- 它利用 AWS 全球网络优化从用户到应用程序的路径，降低 TCP 和 UDP 流量的延迟。 - 该服务持续监控应用程序端点的运行状况，一旦出现故障，会自动将流量重定向到距离最近的健康端点。 - 对于需要在不同地理区域实现高可用性和低延迟的应用程序而言，它特别有用。这两项服务均在全球范围内发挥作用，旨在跨多个 AWS 区域高效地路由流量，因此非常适合实施跨区域故障转移策略，并确保应用程序具有高可用性和低延迟。","s":"源#208"},{"id":"D3-209","d":3,"t":"single","q":"以下哪种方式是使用 Amazon EC2 自动扩展组在 AWS 云中扩展容量的方法？","o":[{"l":"A","t":"根据需求自动扩展或缩小 EC2 实例的数量。"},{"l":"B","t":"使用无服务器 EC2 实例。"},{"l":"C","t":"根据需求自动扩展或缩小 EC2 实例的大小。"},{"l":"D","t":"在 EC2 实例之间转移未使用的 CPU 资源。"}],"a":["A"],"e":"Amazon EC2 自动扩展组（选项 A）允许根据需求自动扩展实例的数量，有助于维护应用程序的可用性和性能。","s":"源#209"},{"id":"D3-215","d":3,"t":"single","q":"一家公司必须能够快速地在 AWS 云中开发、测试和发布应用程序。哪种云计算的优势能满足这些要求？","o":[{"l":"A","t":"停止猜测容量"},{"l":"B","t":"将固定费用转换为变动费用"},{"l":"C","t":"实现规模经济"},{"l":"D","t":"提高速度和灵活性"}],"a":["D"],"e":"在云中快速开发、测试和发布应用程序的能力是云计算的优势之一，被称为提高速度和灵活性（选项 D）。这允许更快地上市，并灵活适应变化的需求。","s":"源#215"},{"id":"D3-227","d":3,"t":"single","q":"一家公司需要将 PostgreSQL 数据库从本地迁移到 Amazon RDS。公司应该使用哪家AWS 服务或工具来满足此要求？","o":[{"l":"A","t":"云采用准备工具"},{"l":"B","t":"AWS 迁移中心"},{"l":"C","t":"AWS 数据库迁移服务（AWS DMS）"},{"l":"D","t":"AWS 应用程序迁移服务"}],"a":["C"],"e":"AWS 数据库迁移服务（AWS DMS）是一个托管服务，旨在帮助将数据库和分析工作负载迁移到 AWS，使其适合将PostgreSQL 数据库迁移到 Amazon RDS。","s":"源#227"},{"id":"D3-228","d":3,"t":"single","q":"使用 AWS Compute Optimizer 演示了哪种云计算概念？","o":[{"l":"A","t":"安全验证"},{"l":"B","t":"正确规模"},{"l":"C","t":"弹性"},{"l":"D","t":"全球覆盖"}],"a":["B"],"e":"AWS Compute Optimizer 通过分析 Amazon EC2 实例的利用指标，并推荐最佳的实例类型和大小以提高性能并降低成本，从而演示了正确规模的概念。","s":"源#228"},{"id":"D3-233","d":3,"t":"single","q":"一家公司计划在 AWS 上托管其工作负载。哪家 AWS 服务要求公司更新和修补客户操作系统？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon S3"},{"l":"C","t":"Amazon EC2"},{"l":"D","t":"Amazon Aurora"}],"a":["C"],"e":"Amazon EC2 提供可调整大小的计算能力，用户可以控制客户操作系统，包括更新和修补的责任。","s":"源#233"},{"id":"D3-235","d":3,"t":"single","q":"一家公司正在将其工作负载迁移到 AWS 云。公司必须保留对其应用程序所托管的客操作系统的补丁管理的完全控制权。公司应该使用哪家 AWS 服务来满足这些要求？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon EC2"},{"l":"C","t":"AWS Lambda"},{"l":"D","t":"Amazon RDS"}],"a":["B"],"e":"Amazon EC2 允许公司保留对客操作系统的完全控制权，包括补丁管理，通过提供灵活性来根据需要选择和配置操作系统。","s":"源#235"},{"id":"D3-240","d":3,"t":"single","q":"一家公司想要将其 PostgreSQL 数据库迁移到 AWS。公司不经常使用数据库。哪种AWS 服务或资源将满足这些要求，并具有最小的管理开销？","o":[{"l":"A","t":"Amazon EC2 上的 PostgreSQL"},{"l":"B","t":"Amazon RDS for PostgreSQL"},{"l":"C","t":"Amazon Aurora PostgreSQL 兼容版"},{"l":"D","t":"Amazon Aurora Serverless"}],"a":["D"],"e":"Amazon Aurora Serverless 是无服务器数据库选项，它根据应用程序的需求自动扩展，并需要最小的管理开销。它非常适合不频繁使用的用例，因为它可以在不使用时扩展到零计算能力，无需管理数据库实例。","s":"源#240"},{"id":"D3-242","d":3,"t":"single","q":"一家公司想要为其客户创建一个全球可访问的电子商务平台。公司想要使用一个高度可用且可扩展的DNS 网络服务，将用户连接到平台。哪个 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon EC2"},{"l":"B","t":"Amazon VPC"},{"l":"C","t":"Amazon Route 53"},{"l":"D","t":"Amazon RDS"}],"a":["C"],"e":"Amazon Route 53 是一个可扩展且高度可用的 DNS 网络服务，旨在将最终用户的请求路由到资源，如 Amazon EC2 实例或AWS 弹性负载均衡器。它提供了一种可靠的方式，确保以低延迟全球访问电子商务平台。","s":"源#242"},{"id":"D3-243","d":3,"t":"single","q":"根据 AWS 共享责任模型，哪项维护任务是客户的责任？","o":[{"l":"A","t":"可用区之间的物理连接"},{"l":"B","t":"网络交换机维护"},{"l":"C","t":"硬件更新和固件补丁"},{"l":"D","t":"Amazon EC2 更新和安全补丁"}],"a":["D"],"e":"根据 AWS 共享责任模型，客户负责 Amazon EC2 实例的客户操作系统的安全和维护，包括更新和安全补丁。","s":"源#243"},{"id":"D3-246","d":3,"t":"single","q":"一家公司拥有 AWS 企业支持，在 2 个月后将发布一个受欢迎的产品的新版本。公司预计其网站的流量将大幅增加。该网站托管在 Amazon EC2 实例上。公司应该采取什么行动来评估其为此次发布扩展的准备情况？","o":[{"l":"A","t":"用 AWS Lambda 函数替换 EC2 实例。"},{"l":"B","t":"使用 AWS 基础设施事件管理（IEM）支持。"},{"l":"C","t":"在 AWS 市场上提交一个请求来监控事件。"},{"l":"D","t":"查看 AWS 成本管理控制台中的覆盖报告。"}],"a":["B"],"e":"AWS 基础设施事件管理（IEM）支持旨在帮助客户准备和响应可能影响其 AWS 基础设施的事件，如产品发布或流量激增。它提供了针对公司特定情况的主动指导和最佳实践。","s":"源#246"},{"id":"D3-248","d":3,"t":"single","q":"一家公司想要一个时间序列数据库服务，使其更容易存储和分析每天数万亿的事件。哪个AWS 服务将满足此要求？","o":[{"l":"A","t":"Amazon Neptune"},{"l":"B","t":"Amazon Timestream"},{"l":"C","t":"Amazon Forecast"},{"l":"D","t":"与 MongoDB 兼容的 Amazon DocumentDB"}],"a":["B"],"e":"根据题目中描述的要求，正确答案是：B. Amazon Timestream（Amazon Timestream）Amazon Timestream是最适合此场景的 AWS 服务，原因如下：1. 它是专门设计的时间序列数据库服务。2. 其构建目的是处理和分析每天数万亿条事件，这与该公司的需求完美契合。3. 时间流是完全托管且无服务器的，这使得公司能够更轻松地存储和分析大量时间序列数据，而无需担心基础设施管理问题。4. 它提供了针对时间序列数据优化的功能，例如自动扩展、数据保留策略以及内置的基于时间的分析功能。5. 与传统关系数据库相比，时间流在存储和查询时间序列数据方面具有成本效益。其他选项不适合此特定要求： - Amazon Neptune是一种图数据库服务，并非针对时间序列数据进行优化。- Amazon Forecast是一种用于生成预测的机器学习服务，并非数据库服务。 - Amazon DocumentDB（Amazon DocumentDB）是一种文档数据库服务，并非专门为如此大规模的时间序列数据而设计。有关Amazon Timestream功能、定价及最佳实践的最新信息，建议查阅AWS 官方文档。","s":"源#248"},{"id":"D3-251","d":3,"t":"single","q":"一家公司想要在 Amazon S3 中存储数据。公司很少访问数据，如果必要，数据可以重新生成。公司想要以最具成本效益的方式存储数据。哪种 S3 存储类别将满足此要求？","o":[{"l":"A","t":"S3 标准"},{"l":"B","t":"S3 智能分层"},{"l":"C","t":"S3 标准不频繁访问（S3 标准 IA）"},{"l":"D","t":"S3 单区不频繁访问（S3 单区 IA）"}],"a":["D"],"e":"对于很少访问并且如果丢失可以重新生成的数据，S3 单区不频繁访问（S3 单区 IA）是最具成本效益的存储类别。它专为每月访问少于一次的数据设计，并提供比其他类别更低的存储成本。","s":"源#251"},{"id":"D3-253","d":3,"t":"single","q":"一家公司想要使用 Typescript、Python、Java 和.NET 等常用编程语言来配置和管理其AWS 基础设施。哪家 AWS 服务将满足此要求？","o":[{"l":"A","t":"AWS CodeBuild"},{"l":"B","t":"AWS CloudFormation"},{"l":"C","t":"AWS CLI"},{"l":"D","t":"AWS 云开发工具包（AWS CDK）"}],"a":["D"],"e":"AWS 云开发工具包（AWS CDK）是一个开源软件开发框架，允许开发人员使用熟悉的编程语言，如 TypeScript、Python、Java 和.NET，以代码形式定义云基础设施，并通过 AWS CloudFormation 进行配置。","s":"源#253"},{"id":"D3-254","d":3,"t":"single","q":"哪种 Amazon EC2 定价模型为始终运行、正确大小的数据库服务器提供一年项目中最大的成本节省？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"可转换预留实例"},{"l":"C","t":"现货实例"},{"l":"D","t":"标准预留实例"}],"a":["D"],"e":"（本题缺解析，源文件无解析文字）","s":"源#254"},{"id":"D3-255","d":3,"t":"single","q":"一家公司有一个物理磁带库来存储数据备份。磁带库的存储空间不足。公司需要将磁带库的容量扩展到 AWS 云中。公司应该使用哪家 AWS 服务来满足此要求？","o":[{"l":"A","t":"Amazon Elastic File System（Amazon EFS）"},{"l":"B","t":"Amazon Elastic Block Store（Amazon EBS）"},{"l":"C","t":"Amazon S3"},{"l":"D","t":"AWS Storage Gateway"}],"a":["D"],"e":"AWS Storage Gateway 是一个服务，它将本地软件设备与基于云的存储连接起来，提供本地 IT 环境与 AWS 存储基础设施之间的无缝集成和数据安全功能。它提供了一个磁带网关，可用于将物理磁带库的容量扩展到 AWS 云中。","s":"源#255"},{"id":"D3-262","d":3,"t":"single","q":"以下哪个是用于提取、转换和加载（ETL）数据的托管 AWS 服务？","o":[{"l":"A","t":"Amazon Athena"},{"l":"B","t":"AWS Glue"},{"l":"C","t":"Amazon S3"},{"l":"D","t":"AWS Snowball Edge"}],"a":["B"],"e":"AWS Glue 是一个完全托管的 ETL 服务，它使分类、清理、丰富和移动数据变得简单且具有成本效益。","s":"源#262"},{"id":"D3-263","d":3,"t":"single","q":"一家公司想要将其在本地数据中心的 PB 级数据迁移到 AWS。公司不想使用互联网连接来执行迁移。哪个 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS DataSync"},{"l":"B","t":"Amazon Connect"},{"l":"C","t":"AWS Snowmobile"},{"l":"D","t":"AWS Direct Connect"}],"a":["C"],"e":"AWS Snowmobile 是一项专为在不使用互联网的情况下将大量数据传输到 AWS 的服务。它使用物理容器将 EB 级数据直接移动到AWS内外。","s":"源#263"},{"id":"D3-269","d":3,"t":"single","q":"一家公司想要使用 Amazon EC2 实例为用户提供静态网站。公司需要为全球用户最小化延迟。哪种解决方案满足这些要求？","o":[{"l":"A","t":"在多个边缘位置使用 EC2 实例。"},{"l":"B","t":"在不同的 AWS 区域中使用同一可用区的 EC2 实例。"},{"l":"C","t":"使用 Amazon CloudFront，并将 EC2 实例配置为来源。"},{"l":"D","t":"在不同的 AWS 账户中使用同一可用区的 EC2 实例。"}],"a":["C"],"e":"Amazon CloudFront 是一个内容分发网络（CDN）服务，可以与 Amazon EC2 实例结合使用，通过在边缘位置缓存内容，最小化全球用户的延迟。","s":"源#269"},{"id":"D3-270","d":3,"t":"single","q":"一个研究团队将在世界各地的偏远地区收集数据。许多地点没有互联网连接。团队需要在现场捕获数据并稍后将其传输到 AWS 云。哪个 AWS 服务将支持这些要求？","o":[{"l":"A","t":"AWS Outposts"},{"l":"B","t":"AWS Transfer Family"},{"l":"C","t":"AWS Snow Family"},{"l":"D","t":"AWS Migration Hub"}],"a":["C"],"e":"AWS Snow Family 设备旨在将大量数据传输到 AWS，即使在有限或没有互联网连接的偏远地区，也适合研究人员的需求。","s":"源#270"},{"id":"D3-274","d":3,"t":"single","q":"一家公司想要通过存档不再频繁访问最终用户的数据来节省成本。哪个 Amazon S3 功能将满足此要求？","o":[{"l":"A","t":"S3 版本控制"},{"l":"B","t":"S3 生命周期"},{"l":"C","t":"S3 对象锁定"},{"l":"D","t":"S3 清单"}],"a":["B"],"e":"S3 生命周期策略允许用户定义规则，自动将对象过渡到更便宜的存储类别，如 S3 Glacier，或者在不再需要时删除它们，有助于节省不频繁访问数据的成本。","s":"源#274"},{"id":"D3-276","d":3,"t":"single","q":"一家公司想要收集和处理 10TB 的数据，并在公司间歇性连接的情况下将数据传输到AWS。哪家AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS 数据库迁移服务（AWS DMS）"},{"l":"B","t":"AWS DataSync"},{"l":"C","t":"AWS 备份"},{"l":"D","t":"AWS Snowball Edge"}],"a":["D"],"e":"AWS Snowball Edge 旨在在间歇性连接的情况下安全地将大量数据传输到 AWS。它允许在单个、易于管理的设备中进行数据处理和传输。","s":"源#276"},{"id":"D3-278","d":3,"t":"single","q":"使用 AWS 无服务器计算的一个好处是什么？","o":[{"l":"A","t":"不需要应用程序部署和管理。"},{"l":"B","t":"应用程序安全将完全由 AWS 管理。"},{"l":"C","t":"不需要监控和日志记录。"},{"l":"D","t":"基础设施管理被卸载到 AWS。"}],"a":["D"],"e":"AWS 无服务器计算的一个关键好处是它将基础设施管理卸载到 AWS。这允许开发人员专注于构建和部署应用程序，而无需管理服务器的开销。","s":"源#278"},{"id":"D3-290","d":3,"t":"single","q":"一家公司计划运行一个使用图形处理单元（GPU）的计算密集型工作负载。公司应该使用哪种Amazon EC2 实例类型？","o":[{"l":"A","t":"加速计算"},{"l":"B","t":"计算优化"},{"l":"C","t":"存储优化"},{"l":"D","t":"通用"}],"a":["A"],"e":"对于计算密集型工作负载，使用 GPU，加速计算实例类型旨在提供必要的性能。这些实例配备了 GPU 硬件，以处理图形密集型应用程序。","s":"源#290"},{"id":"D3-291","d":3,"t":"multiple","q":"以下哪些是 AWS 云中网络 ACLs 使用的特点？（选择两个）","o":[{"l":"A","t":"它们是无状态的。"},{"l":"B","t":"它们是有状态的。"},{"l":"C","t":"它们在允许流量之前评估所有规则。"},{"l":"D","t":"它们按顺序处理规则，从最低编号的规则开始，决定是否允许流量。"},{"l":"E","t":"它们在实例级别运行。"}],"a":["A","D"],"e":"AWS 中的网络 ACLs 是无状态的（A），并按顺序处理规则，从最低编号的规则开始（D），以决定是否允许或拒绝流量。它们还在子网级别运行，而不是实例级别（E），使选项 E 不正确。","s":"源#291"},{"id":"D3-293","d":3,"t":"single","q":"根据 AWS 共享责任模型，客户负责为以下哪项应用最新的安全更新和补丁？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon EC2 实例"},{"l":"C","t":"Amazon RDS 实例"},{"l":"D","t":"Amazon S3"}],"a":["B"],"e":"在 AWS 共享责任模型中，客户负责为其 Amazon EC2 实例应用最新的安全更新和补丁，而 AWS 管理底层基础设施和虚拟化的安全。","s":"源#293"},{"id":"D3-294","d":3,"t":"single","q":"对于未知的访问模式，哪种 Amazon S3 存储类别最具成本效益？","o":[{"l":"A","t":"S3 标准"},{"l":"B","t":"S3 标准不频繁访问（S3 标准 IA）"},{"l":"C","t":"S3 单区不频繁访问（S3 单区 IA）"},{"l":"D","t":"S3 智能分层"}],"a":["D"],"e":"S3 智能分层旨在为具有未知或不可预测访问模式的数据提供成本效益。它根据访问频率自动在访问层之间移动数据，优化成本，无需手动干预。","s":"源#294"},{"id":"D3-299","d":3,"t":"single","q":"哪种 AWS 云优势使公司能够快速部署云资源，以在几分钟内访问计算、存储和数据库基础设施？","o":[{"l":"A","t":"弹性"},{"l":"B","t":"成本节约"},{"l":"C","t":"敏捷性"},{"l":"D","t":"可靠性"}],"a":["C"],"e":"在 AWS 云的背景下，敏捷性指的是能够快速部署和配置云资源，包括计算、存储和数据库服务，以满足业务需求。","s":"源#299"},{"id":"D3-302","d":3,"t":"single","q":"之前用于开发的 Amazon EC2 实例无法访问，并且在 AWS 管理控制台中不再出现。应该使用哪个AWS 服务来确定是什么操作使此 EC2 实例无法访问？","o":[{"l":"A","t":"Amazon CloudWatch 日志"},{"l":"B","t":"AWS Security Hub"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"AWS CloudTrail"}],"a":["D"],"e":"AWS CloudTrail 是一个记录和记录 AWS 资源 API 调用的服务。它可以用来跟踪对 EC2 实例采取的操作，包括可能导致无法访问的操作。","s":"源#302"},{"id":"D3-305","d":3,"t":"single","q":"一个开发团队想要快速、可重复地部署应用程序的多个测试环境。团队应该使用哪个AWS 服务？","o":[{"l":"A","t":"Amazon EC2"},{"l":"B","t":"AWS CloudFormation"},{"l":"C","t":"Amazon QuickSight"},{"l":"D","t":"Amazon Elastic Container Service（Amazon ECS）"}],"a":["B"],"e":"AWS CloudFormation 允许用户通过模板创建和管理 AWS 资源，实现基础设施的可重复和自动化部署，包括测试环境。","s":"源#305"},{"id":"D3-308","d":3,"t":"single","q":"以下哪项是 AWS 上的完全托管图形数据库服务？","o":[{"l":"A","t":"Amazon Aurora"},{"l":"B","t":"Amazon FSx"},{"l":"C","t":"Amazon DynamoDB"},{"l":"D","t":"Amazon Neptune"}],"a":["D"],"e":"Amazon Neptune 是 AWS 上的完全托管图形数据库服务，旨在处理高度连接的数据，并为基于图形的工作负载提供快速、可靠的性能。","s":"源#308"},{"id":"D3-311","d":3,"t":"single","q":"哪种 AWS 存储是临时性的，当 Amazon EC2 实例停止或终止时会被删除？","o":[{"l":"A","t":"Amazon Elastic Block Store（Amazon EBS）"},{"l":"B","t":"Amazon EC2 实例存储"},{"l":"C","t":"Amazon Elastic File System（Amazon EFS）"},{"l":"D","t":"Amazon S3"}],"a":["B"],"e":"Amazon EC2 实例存储提供直接附加到 EC2 实例的临时块级存储。实例存储中的数据是临时性的，当 EC2 实例停止或终止时会被删除。","s":"源#311"},{"id":"D3-312","d":3,"t":"single","q":"一家公司想要从其本地工作负载访问 AWS 中的 Windows 文件共享。公司不想在其数据中心中配置任何额外的基础设施或应用程序。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon FSx 文件网关"},{"l":"B","t":"AWS DataSync"},{"l":"C","t":"Amazon S3"},{"l":"D","t":"AWS Snow 家族"}],"a":["A"],"e":"Amazon FSx 文件网关使本地能够访问存储在 Amazon FSx for Windows 文件服务器中的文件数据，允许公司在不在其数据中心中配置额外基础设施或应用程序的情况下访问 AWS 中的文件共享。","s":"源#312"},{"id":"D3-313","d":3,"t":"single","q":"一家公司想要持久性存储静态内容，并具有无限可扩展的数据存储基础设施，以最低成本。公司应该选择哪家 AWS 服务？","o":[{"l":"A","t":"Amazon Elastic Block Store（Amazon EBS）"},{"l":"B","t":"Amazon S3"},{"l":"C","t":"AWS Storage Gateway"},{"l":"D","t":"Amazon Elastic File System（Amazon EFS）"}],"a":["B"],"e":"Amazon S3（简单存储服务）是一种完全托管的对象存储服务，为静态内容提供持久性存储。它旨在实现可扩展性、高可用性和低延迟访问，以存储和检索任何数量的数据，使其成为持久性和可扩展性存储基础设施最具成本效益的选择。","s":"源#313"},{"id":"D3-314","d":3,"t":"single","q":"一家电子商务公司想要使用 Amazon EC2 自动扩展根据 CPU 利用率添加和删除EC2 实例。哪家AWS服务或功能可以启动 Amazon EC2 自动扩展操作以实现此目标？","o":[{"l":"A","t":"Amazon Simple Queue Service（Amazon SQS）"},{"l":"B","t":"Amazon Simple Notification Service（Amazon SNS）"},{"l":"C","t":"AWS 系统管理器"},{"l":"D","t":"Amazon CloudWatch 警报"}],"a":["D"],"e":"Amazon CloudWatch 警报可用于监视诸如 CPU 利用率之类的指标，并根据定义的阈值触发 Amazon EC2 自动扩展操作。这允许电子商务公司根据 CPU 使用情况的变化自动扩展其 EC2 实例。","s":"源#314"},{"id":"D3-316","d":3,"t":"single","q":"一家公司想要将其本地数据库迁移到托管的云数据库服务，使用简化的迁移流程。哪家AWS 服务或工具可以帮助公司满足此要求？","o":[{"l":"A","t":"AWS 存储网关"},{"l":"B","t":"AWS 应用程序迁移服务"},{"l":"C","t":"AWS 数据同步"},{"l":"D","t":"AWS 数据库迁移服务（AWS DMS）"}],"a":["D"],"e":"AWS 数据库迁移服务（AWS DMS）旨在帮助以简化和高效的方式将本地数据库迁移到托管的云数据库服务，支持各种数据库引擎，并提供可靠的方式来迁移数据，最小化停机时间。","s":"源#316"},{"id":"D3-317","d":3,"t":"single","q":"一家公司需要一个完全托管的文件服务器，该服务器本地支持 Microsoft 工作负载和文件系统。文件服务器还必须支持 SMB 协议。公司应该使用哪家 AWS 服务来满足这些要求？","o":[{"l":"A","t":"Amazon Elastic File System（Amazon EFS）"},{"l":"B","t":"Amazon FSx for Lustre"},{"l":"C","t":"Amazon FSx for Windows File Server"},{"l":"D","t":"Amazon Elastic Block Store（Amazon EBS）"}],"a":["C"],"e":"Amazon FSx for Windows File Server 是一个完全托管的服务，提供本地支持 Microsoft 工作负载和文件系统的文件服务器。它建立在Windows Server 上，并支持服务器消息块（SMB）协议，使其适合与 Microsoft 应用程序和工作负载集成。","s":"源#317"},{"id":"D3-318","d":3,"t":"single","q":"一家公司在 Amazon S3 存储桶中存储月度报告。公司将报告数据导出为逗号分隔值（.csv）文件。开发人员想要编写一个简单的查询，可以读取所有这些文件并生成摘要报告。开发人员应该使用哪个AWS 服务或功能以最小的运营开销满足这些要求？","o":[{"l":"A","t":"Amazon S3 选择"},{"l":"B","t":"Amazon Athena"},{"l":"C","t":"Amazon Redshift"},{"l":"D","t":"Amazon EC2"}],"a":["B"],"e":"Amazon Athena 是一个无服务器查询服务，允许开发人员直接在 Amazon S3 中使用标准 SQL 分析数据。它支持查询存储在Amazon S3 中的.csv 文件，无需设置和管理基础设施，使其成为生成摘要报告的最直接选择，运营开销最小。","s":"源#318"},{"id":"D3-320","d":3,"t":"single","q":"一家公司需要在 Amazon S3 中存储的文档中搜索文本。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon Kendra"},{"l":"B","t":"Amazon Rekognition"},{"l":"C","t":"Amazon Polly"},{"l":"D","t":"Amazon Lex"}],"a":["A"],"e":"Amazon Kendra 是 AWS 服务，旨在将智能搜索功能构建到应用程序中。它支持自然语言查询，并允许在包括 Amazon S3 在内的各种来源中搜索文本，使其成为公司需求的适当服务。","s":"源#320"},{"id":"D3-321","d":3,"t":"multiple","q":"哪些 AWS 服务利用全球边缘位置？（选择两个）","o":[{"l":"A","t":"AWS Fargate"},{"l":"B","t":"Amazon CloudFront"},{"l":"C","t":"AWS Global Accelerator"},{"l":"D","t":"AWS Wavelength"},{"l":"E","t":"Amazon VPC"}],"a":["B","C"],"e":"Amazon CloudFront 和 AWS Global Accelerator 是利用全球边缘位置的 AWS 服务。Amazon CloudFront 是一个内容交付网络（CDN）服务，使用全球边缘网络位置以低延迟和高传输速度提供内容。AWS Global Accelerator 使用 AWS 边缘位置网络路由流量穿过AWS 全球网络，提高应用程序的可用性和性能。","s":"源#321"},{"id":"D3-322","d":3,"t":"single","q":"用户需要一个关系数据库，但没有资源来管理硬件、弹性和复制。哪个 AWS 服务选项满足用户的要求？","o":[{"l":"A","t":"在 Amazon Elastic Container Service（Amazon ECS）上运行 MySQL。"},{"l":"B","t":"在 Amazon EC2 上运行 MySQL。"},{"l":"C","t":"选择 Amazon RDS for MySQL。"},{"l":"D","t":"选择 Amazon ElastiCache for Redis。"}],"a":["C"],"e":"Amazon RDS（关系数据库服务）是一个完全托管的关系数据库服务，处理硬件配置、数据库设置、补丁和备份等任务。它为各种数据库引擎（包括 MySQL）提供托管环境，并允许用户专注于应用程序开发，而无需管理底层数据库基础设施。","s":"源#322"},{"id":"D3-323","d":3,"t":"single","q":"一家公司需要尽快在 AWS 云中部署应用程序。公司还需要最小化与 AWS 资源管理相关的复杂性。公司应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"AWS Elastic Beanstalk"},{"l":"C","t":"Amazon EC2"},{"l":"D","t":"Amazon Personalize"}],"a":["B"],"e":"AWS Elastic Beanstalk 是一个完全托管的服务，简化了在 AWS 上使用多种语言部署和运行应用程序的过程。它抽象了底层基础设施，使开发人员能够专注于编写代码，而 AWS 处理部署、容量配置、负载均衡和自动扩展，满足公司快速部署和最小化管理复杂性的要求。","s":"源#323"},{"id":"D3-326","d":3,"t":"single","q":"一家公司想要建立 AWS 与其公司网络之间的私有网络连接。哪家 AWS 服务或功能将满足此要求？","o":[{"l":"A","t":"Amazon Connect"},{"l":"B","t":"Amazon Route 53"},{"l":"C","t":"AWS Direct Connect"},{"l":"D","t":"VPC 对等"}],"a":["C"],"e":"AWS Direct Connect 是一项服务，允许公司在其公司网络和 Amazon 虚拟专用云（VPC）之间建立私有网络连接。它提供了从公司本地数据中心或公司办公室到 AWS 的专用网络连接，绕过公共互联网，确保私有和安全的连接。","s":"源#326"},{"id":"D3-327","d":3,"t":"multiple","q":"以下哪些 AWS 服务或功能使用户能够在两个 VPC 之间创建网络连接？（选择两个）","o":[{"l":"A","t":"VPC 端点"},{"l":"B","t":"Amazon Route 53"},{"l":"C","t":"VPC 对等"},{"l":"D","t":"AWS Direct Connect"},{"l":"E","t":"AWS Transit Gateway"}],"a":["C","E"],"e":"VPC 对等（选项 C）和 AWS Transit Gateway（选项 E）是使用户能够在两个 VPC 之间创建网络连接的 AWS 服务。VPC 对等允许在同一 AWS 区域中的两个 VPC 之间进行连接，而 AWS Transit Gateway 充当中心枢纽，连接多个 VPC，并且还可以扩展到本地环境的连接。","s":"源#327"},{"id":"D3-328","d":3,"t":"single","q":"哪个 AWS 服务将文本转换为逼真的声音？","o":[{"l":"A","t":"Amazon Transcribe"},{"l":"B","t":"Amazon Rekognition"},{"l":"C","t":"Amazon Polly"},{"l":"D","t":"Amazon Textract"}],"a":["C"],"e":"Amazon Polly 是将文本转换为逼真声音的 AWS 服务。它是一个文本到语音（TTS）服务，允许将自然的听起来的语音集成到应用程序中，支持多种语言，并提供具有不同口音和风格的各种声音，可用于增强语音交互中的用户体验。","s":"源#328"},{"id":"D3-329","d":3,"t":"single","q":"一家公司想使用应用堆栈在 AWS 云中运行工作负载。公司想使用预配置的实例。哪家AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon Lightsail"},{"l":"B","t":"Amazon Athena"},{"l":"C","t":"AWS Outposts"},{"l":"D","t":"Amazon EC2"}],"a":["A"],"e":"Amazon Lightsail 提供预配置的实例和应用堆栈，旨在简化云中应用程序的部署和管理。它提供了一系列预配置的实例，其中已经安装了流行的软件堆栈，这使得它成为需要一种简单方法来启动具有常见用例模板的实例，而无需广泛的 AWS 专业知识的用户的理想服务。","s":"源#329"},{"id":"D3-330","d":3,"t":"multiple","q":"哪些 AWS 服务支持 Savings Plans？（选择两个）","o":[{"l":"A","t":"Amazon EC2"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"Amazon SageMaker"},{"l":"D","t":"Amazon Redshift"},{"l":"E","t":"Amazon DynamoDB"}],"a":["A","C"],"e":"Savings Plans 是一种灵活的定价模型，为 AWS 计算使用提供了显著的节省。Amazon EC2（选项 A）和 Amazon SageMaker（选项C）是支持 Savings Plans 的 AWS 服务，允许客户通过承诺 1 年或 3 年期限内的一致使用量（以$/小时计）来实现成本节省。","s":"源#330"},{"id":"D3-331","d":3,"t":"single","q":"哪家 AWS 服务或工具可以免费提供 Amazon EC2 资源的合适尺寸建议？","o":[{"l":"A","t":"AWS 良好构建工具"},{"l":"B","t":"Amazon CloudWatch"},{"l":"C","t":"AWS 成本探索器"},{"l":"D","t":"Amazon S3 分析"}],"a":["C"],"e":"AWS 成本探索器是一项服务，使用户能够可视化、理解和管理他们的 AWS 成本和使用情况。它的一个关键特性是能够免费为Amazon EC2 资源提供合适尺寸建议，帮助用户优化他们的资源分配并降低成本。","s":"源#331"},{"id":"D3-332","d":3,"t":"single","q":"一家公司运营一个 PB 级数据仓库来分析其数据。公司想要一个解决方案，不需要手动管理和软件。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon DocumentDB（与 MongoDB 兼容）"},{"l":"B","t":"Amazon Redshift"},{"l":"C","t":"Amazon Neptune"},{"l":"D","t":"Amazon ElastiCache"}],"a":["B"],"e":"Amazon Redshift 是一个完全托管的 PB 级数据仓库服务，旨在简化和成本有效地分析大量数据。它消除了手动硬件和软件管理的需求，因为 AWS 负责提供、配置和维护基础设施，使其成为公司要求的理想解决方案。","s":"源#332"},{"id":"D3-333","d":3,"t":"single","q":"图书馆想要自动化基于电子书内容的分类。图书馆应该使用哪个 AWS 服务来满足这个要求？","o":[{"l":"A","t":"Amazon Redshift"},{"l":"B","t":"Amazon CloudSearch"},{"l":"C","t":"Amazon Comprehend"},{"l":"D","t":"Amazon Aurora"}],"a":["C"],"e":"Amazon Comprehend 是提供自然语言处理（NLP）能力的 AWS 服务，可用于分析和理解电子书的内容。它可以自动根据内容对书籍进行分类，使其适合图书馆自动化分类过程的要求。","s":"源#333"},{"id":"D3-338","d":3,"t":"single","q":"一家公司想要跟踪其 Amazon S3 对象的标签、存储桶和前缀。哪个 S3 功能将满足这个要求？","o":[{"l":"A","t":"S3 库存报告"},{"l":"B","t":"S3 生命周期"},{"l":"C","t":"S3 版本控制"},{"l":"D","t":"S3 ACLs"}],"a":["A"],"e":"答案为 A","s":"源#338"},{"id":"D3-340","d":3,"t":"single","q":"一家公司创建了一个 Amazon EC2 实例。公司想要控制实例级别的入站和出站网络流量。哪个AWS资源或服务将满足这个要求？","o":[{"l":"A","t":"AWS 盾牌"},{"l":"B","t":"安全组"},{"l":"C","t":"网络访问分析器"},{"l":"D","t":"VPC 端点"}],"a":["B"],"e":"安全组充当 Amazon EC2 实例的虚拟防火墙，控制入站和出站流量。通过在安全组内定义规则，用户可以管理实例级别的网络流量。","s":"源#340"},{"id":"D3-342","d":3,"t":"single","q":"一家公司想要让网络应用程序与各种 AWS 服务进行交互。哪种 AWS 服务或资源将满足这个要求？","o":[{"l":"A","t":"AWS CloudShell"},{"l":"B","t":"AWS Marketplace"},{"l":"C","t":"AWS 管理控制台"},{"l":"D","t":"AWS CLI"}],"a":["C"],"e":"AWS 管理控制台是一个基于 Web 的界面，使用户能够与各种 AWS 服务进行交互和管理，因此适合网络应用程序执行此类交互。","s":"源#342"},{"id":"D3-349","d":3,"t":"single","q":"Amazon S3 Intelligent-Tiering 存储类别提供什么？","o":[{"l":"A","t":"通过预留存储容量提供支付灵活性"},{"l":"B","t":"通过将数据复制到加密的 Amazon Elastic Block Store（Amazon EBS）卷进行长期数据保留"},{"l":"C","t":"通过在访问模式变化时在层之间移动对象来自动节省成本"},{"l":"D","t":"为数据归档提供安全、持久和最低成本的存储"}],"a":["C"],"e":"Amazon S3 Intelligent-Tiering 存储类别通过在访问模式变化时在频繁访问和不频繁访问两个访问层之间自动移动对象来提供自动成本节省，而不影响性能。","s":"源#349"},{"id":"D3-357","d":3,"t":"single","q":"一家公司需要将其本地数据中心连接到 AWS 云。公司需要一个专用的、低延迟的连接，具有一致的网络性能。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Global Accelerator"},{"l":"B","t":"Amazon CloudFront"},{"l":"C","t":"AWS Direct Connect"},{"l":"D","t":"AWS Managed VPN"}],"a":["C"],"e":"AWS Direct Connect 提供了一个专用的网络连接，在本地数据中心和 AWS 之间，提供低延迟和一致的网络性能。这是一种私有的、高带宽的连接，不经过公共互联网。","s":"源#357"},{"id":"D3-358","d":3,"t":"multiple","q":"为了最大化可持续性和最小化环境影响，公司应该应用哪些设计原则到 AWS 云工作负载？（选择两个）","o":[{"l":"A","t":"最大化 Amazon EC2 实例的利用率。"},{"l":"B","t":"最小化 Amazon EC2 实例的利用率。"},{"l":"C","t":"最小化使用托管服务。"},{"l":"D","t":"强制用户频繁重新安装应用程序。"},{"l":"E","t":"减少用户重新安装应用程序的需求。"}],"a":["A","E"],"e":"为了最大化可持续性和最小化环境影响，公司应该应用最大化 Amazon EC2 实例的利用率（A）和减少用户重新安装应用程序的需求（E）的原则。这些原则促进了资源的有效使用，并减少了浪费。","s":"源#358"},{"id":"D3-361","d":3,"t":"multiple","q":"以下哪些 AWS 服务是无服务器的？（选择两个）","o":[{"l":"A","t":"AWS Outposts"},{"l":"B","t":"Amazon EC2"},{"l":"C","t":"Amazon Elastic Kubernetes Service（Amazon EKS）"},{"l":"D","t":"AWS Fargate"},{"l":"E","t":"AWS Lambda"}],"a":["D","E"],"e":"AWS Fargate（D）和 AWS Lambda（E）是无服务器服务。AWS Fargate 允许您在不管理服务器的情况下运行容器，而AWS Lambda 让您在不配置或管理服务器的情况下运行代码，根据传入流量自动扩展应用程序。","s":"源#361"},{"id":"D3-362","d":3,"t":"single","q":"当用户想要利用他们现有的每个套接字、每个核心或每个虚拟机的软件许可证，在AWS 上运行Microsoft Windows 服务器时，需要哪种 Amazon EC2 实例类型？","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"专用实例"},{"l":"C","t":"专用主机"},{"l":"D","t":"预留实例"}],"a":["C"],"e":"专用主机（C）是 Amazon EC2 实例类型，当用户想要利用他们现有的每个套接字、每个核心或每个虚拟机的软件许可证，在AWS 上运行 Microsoft Windows 服务器时需要。这允许全面的自带许可证（BYOL）支持。","s":"源#362"},{"id":"D3-363","d":3,"t":"single","q":"解决方案架构师需要维护一组 Amazon EC2 实例，以便任何受损的实例都被新实例替换。解决方案架构师应该使用哪个 AWS 服务？","o":[{"l":"A","t":"Amazon Elastic Container Service（Amazon ECS）"},{"l":"B","t":"Amazon GuardDuty"},{"l":"C","t":"AWS Shield"},{"l":"D","t":"AWS Auto Scaling"}],"a":["D"],"e":"AWS Auto Scaling 是解决方案架构师应该使用的服务，以维护一组 Amazon EC2 实例，并自动替换任何受损的实例。它有助于确保所需的 EC2 实例数量可用于处理应用程序的负载。","s":"源#363"},{"id":"D3-364","d":3,"t":"single","q":"哪个 AWS 服务为本地应用程序提供对存储在 AWS 云中的数据的低延迟访问？","o":[{"l":"A","t":"Amazon CloudFront"},{"l":"B","t":"AWS Storage Gateway"},{"l":"C","t":"AWS Backup"},{"l":"D","t":"AWS DataSync"}],"a":["B"],"e":"AWS Storage Gateway 是一个服务，为本地应用程序提供对存储在 AWS 云中的数据的低延迟访问。它使本地应用程序能够访问和处理云中的数据，确保数据具有最小的延迟可用。","s":"源#364"},{"id":"D3-365","d":3,"t":"single","q":"Amazon CloudFront 提供什么？","o":[{"l":"A","t":"所有资源的自动扩展，以从单一统一界面为应用程序提供动力"},{"l":"B","t":"使用低延迟向全球用户安全交付数据、视频、应用程序和 API"},{"l":"C","t":"能够通过各种路由类型直接管理全球流量，包括基于延迟的路由、地理 DNS、地理接近性和加权轮询"},{"l":"D","t":"自动将传入应用程序流量分配到多个目标，例如 Amazon EC2 实例、容器、IP 地址和 AWS Lambda 函数"}],"a":["B"],"e":"Amazon CloudFront 是一个内容交付网络（CDN）服务，使用低延迟向全球用户安全交付数据、视频、应用程序和 API。它通过边缘位置网络加速内容交付。","s":"源#365"},{"id":"D3-366","d":3,"t":"single","q":"哪个 AWS 服务支持在 AWS 云中部署和管理应用程序？","o":[{"l":"A","t":"Amazon CodeGuru"},{"l":"B","t":"AWS Fargate"},{"l":"C","t":"AWS CodeCommit"},{"l":"D","t":"AWS Elastic Beanstalk"}],"a":["D"],"e":"AWS Elastic Beanstalk 是一个服务，支持在 AWS 云中部署和管理应用程序。它提供了一个平台即服务（PaaS）环境，抽象了底层基础设施，允许开发人员专注于编写代码。","s":"源#366"},{"id":"D3-368","d":3,"t":"single","q":"哪个 Amazon S3 功能或存储类别使用 AWS 骨干网络和边缘位置来减少最终用户到Amazon S3 的延迟？","o":[{"l":"A","t":"S3 跨区域复制"},{"l":"B","t":"S3 传输加速"},{"l":"C","t":"S3 事件通知"},{"l":"D","t":"S3 标准不频繁访问（S3 标准 I"}],"a":["B"],"e":"Amazon S3 传输加速是使用 AWS 骨干网络和 Amazon CloudFront 的边缘位置来减少数据传输到和从 Amazon S3 的延迟的功能。它对于远离托管 S3 存储桶的 AWS 区域的用户特别有用。","s":"源#368"},{"id":"D3-369","d":3,"t":"single","q":"哪个 AWS 服务提供在 AWS 云中托管 NoSQL 数据库的能力？","o":[{"l":"A","t":"Amazon Aurora"},{"l":"B","t":"Amazon DynamoDB"},{"l":"C","t":"Amazon RDS"},{"l":"D","t":"Amazon Redshift"}],"a":["B"],"e":"Amazon DynamoDB 是 AWS 服务，提供在 AWS 云中托管 NoSQL 数据库的能力。它是一个完全托管的、无服务器的、高度可扩展的NoSQL 数据库服务。","s":"源#369"},{"id":"D3-370","d":3,"t":"single","q":"哪个 AWS 服务是与 MySQL 和 PostgreSQL 兼容的关系数据库？","o":[{"l":"A","t":"Amazon Redshift"},{"l":"B","t":"Amazon DynamoDB"},{"l":"C","t":"Amazon Aurora"},{"l":"D","t":"Amazon Neptune"}],"a":["C"],"e":"Amazon Aurora 是 AWS 提供的关系数据库服务，与 MySQL 和 PostgreSQL 兼容。它提供高性能、可扩展性，并且由AWS 完全管理。","s":"源#370"},{"id":"D3-374","d":3,"t":"single","q":"哪个 AWS 服务使用 AWS Compute Optimizer 根据工作负载指标提供大小建议？","o":[{"l":"A","t":"Amazon EC2"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"Amazon Lightsail"},{"l":"D","t":"AWS Step Functions"}],"a":["A"],"e":"AWS Compute Optimizer 由 Amazon EC2 使用，根据工作负载指标提供大小建议。它通过分析历史资源利用数据来识别优化机会，并建议最佳的实例类型和大小，以提高性能和成本效率。","s":"源#374"},{"id":"D3-376","d":3,"t":"single","q":"哪个 AWS 服务使用发布者和订阅者的组合？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"Amazon SNS（Amazon SNS）"},{"l":"C","t":"Amazon CloudWatch"},{"l":"D","t":"AWS CloudFormation"}],"a":["B"],"e":"Amazon SNS（Amazon SNS）是使用发布者-订阅者消息模型的 AWS 服务。它使应用程序能够以可扩展和成本效益的方式向客户或其他应用程序发送消息。","s":"源#376"},{"id":"D3-377","d":3,"t":"single","q":"一家公司正处于计划迁移到 AWS 的早期阶段。公司想要获得未来 Amazon EC2 实例及其相关存储的每月预测总拥有成本。","o":[{"l":"A","t":"AWS 定价计算器"},{"l":"B","t":"AWS 计算优化器"},{"l":"C","t":"AWS 信任顾问"},{"l":"D","t":"AWS 应用程序迁移服务"}],"a":["A"],"e":"AWS 定价计算器是公司在 AWS 迁移计划的早期阶段使用的适当工具。它允许公司根据使用模式、配置和要求估算Amazon EC2 实例及其相关存储的每月预测总成本。","s":"源#377"},{"id":"D3-378","d":3,"t":"single","q":"哪个 AWS 服务或工具可以实时监视 AWS 资源和应用程序？","o":[{"l":"A","t":"AWS 信任顾问"},{"l":"B","t":"Amazon CloudWatch"},{"l":"C","t":"AWS CloudTrail"},{"l":"D","t":"AWS 成本探索器"}],"a":["B"],"e":"Amazon CloudWatch 是 AWS 服务，可以实时监视 AWS 资源和应用程序。它提供了对资源利用、应用程序性能和运营健康的洞察。","s":"源#378"},{"id":"D3-380","d":3,"t":"single","q":"哪个 AWS 资源可以帮助公司在使用 Amazon EC2 实例时以使用承诺换取成本降低？","o":[{"l":"A","t":"计算储蓄计划"},{"l":"B","t":"自动扩展组"},{"l":"C","t":"按需实例"},{"l":"D","t":"EC2 实例存储"}],"a":["A"],"e":"计算储蓄计划是旨在帮助公司在使用 Amazon EC2 实例时以一定的使用水平承诺换取成本降低的 AWS 资源。与按需定价相比，它提供了显著的节省。","s":"源#380"},{"id":"D3-389","d":3,"t":"single","q":"一家公司想要将其本地 NoSQL 工作负载迁移到 Amazon DynamoDB。哪家 AWS 服务将满足这个要求？","o":[{"l":"A","t":"AWS 迁移中心"},{"l":"B","t":"AWS 数据库迁移服务（AWS DMS）"},{"l":"C","t":"迁移评估员"},{"l":"D","t":"AWS 应用程序迁移服务"}],"a":["B"],"e":"AWS 数据库迁移服务（AWS DMS）是旨在促进数据库迁移到 AWS 的服务，包括 MongoDB、Cassandra 和 Couchbase 等NoSQL 数据库。它适用于将本地 NoSQL 工作负载迁移到 Amazon DynamoDB。","s":"源#389"},{"id":"D3-390","d":3,"t":"single","q":"一家公司正在寻找满足其性能和容量要求的正确 Amazon EC2 实例类型和大小。公司想要找到可能的最低成本。哪个选项准确地描述了公司的行为？","o":[{"l":"A","t":"自动扩展"},{"l":"B","t":"存储分层"},{"l":"C","t":"正确尺寸"},{"l":"D","t":"实例调度"}],"a":["C"],"e":"正确尺寸（C）是寻找与公司的性能和容量要求相匹配的最优 Amazon EC2 实例类型和大小的过程，同时最小化成本。这确保资源不会被低估或过度配置。","s":"源#390"},{"id":"D3-393","d":3,"t":"single","q":"一家公司想要使用机器学习能力来分析其 Amazon EC2 实例的日志数据，并有效地进行安全调查。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon Inspector"},{"l":"B","t":"Amazon QuickSight"},{"l":"C","t":"Amazon Detective"},{"l":"D","t":"Amazon GuardDuty"}],"a":["C"],"e":"Amazon Detective 是一个完全托管的服务，使用机器学习、统计分析和图论来分析 Amazon EC2 实例和其他 AWS 资源的日志数据。它有助于通过识别安全问题或可疑活动来进行安全调查。","s":"源#393"},{"id":"D3-397","d":3,"t":"single","q":"一家公司想要在 AWS 上部署一个非容器化的基于 Java 的 Web 应用程序。公司希望使用一个托管服务快速部署应用程序。公司希望该服务自动提供容量、负载平衡、扩展和监控应用程序健康。哪家AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon Elastic Container Service（Amazon ECS）"},{"l":"B","t":"AWS Lambda"},{"l":"C","t":"Amazon Elastic Kubernetes Service（Amazon EKS）"},{"l":"D","t":"AWS Elastic Beanstalk"}],"a":["D"],"e":"AWS Elastic Beanstalk 是满足部署非容器化的基于 Java 的 Web 应用程序要求的服务。它提供了一个简单的上传代码的过程，并自动处理部署、容量提供、负载平衡、自动扩展和应用程序健康监控。","s":"源#397"},{"id":"D3-399","d":3,"t":"single","q":"一家公司在 Amazon EC2 实例上部署了一个 Web 应用程序。EC2 实例的使用率很低。公司应该使用哪个 AWS 服务或功能来正确调整 EC2 实例的大小？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"AWS 成本异常检测"},{"l":"C","t":"AWS 预算"},{"l":"D","t":"AWS 计算优化器"}],"a":["D"],"e":"AWS 计算优化器是应该用来正确调整使用率低的 EC2 实例大小的服务。它根据工作负载性能和容量要求提供有关最佳实例类型和大小的建议，帮助降低成本。","s":"源#399"},{"id":"D3-400","d":3,"t":"single","q":"一家公司想要定义一个跨 AWS 服务的中央数据保护政策，用于计算、存储和数据库资源。哪家AWS服务将满足这个要求？","o":[{"l":"A","t":"AWS Batch"},{"l":"B","t":"AWS 弹性灾难恢复"},{"l":"C","t":"AWS 备份"},{"l":"D","t":"Amazon FSx"}],"a":["C"],"e":"AWS 备份是一个服务，使公司能够在各种 AWS 服务中定义中央数据保护政策，包括计算（EC2 实例）、存储（EBS 卷）和数据库（RDS 数据库）资源。它允许集中备份策略配置和监控备份活动。","s":"源#400"},{"id":"D3-401","d":3,"t":"single","q":"一家公司需要根据业务类别对 AWS 使用成本进行分类和跟踪。公司应该使用哪个AWS 服务或功能来满足这些要求？","o":[{"l":"A","t":"成本分配标签"},{"l":"B","t":"AWS 组织"},{"l":"C","t":"AWS 安全中心"},{"l":"D","t":"AWS 成本和使用情况报告"}],"a":["A"],"e":"成本分配标签是一个功能，允许组织根据不同的业务维度（如项目、部门或应用程序）对 AWS 成本进行分类。通过对EC2 实例或S3 存储桶等 AWS 资源应用标签，AWS 成本和使用情况报告随后可以根据这些标签汇总使用情况和成本，便于跟踪和管理不同业务类别的支出。","s":"源#401"},{"id":"D3-402","d":3,"t":"single","q":"哪个 AWS 服务可以迁移 AWS 存储服务之间的数据？","o":[{"l":"A","t":"AWS DataSync"},{"l":"B","t":"AWS Direct Connect"},{"l":"C","t":"AWS Lake Formation"},{"l":"D","t":"Amazon S3"}],"a":["A"],"e":"AWS DataSync 是一个旨在自动化不同 AWS 存储服务之间数据传输的服务，确保数据可以安全高效地移动。这个服务特别适用于将数据迁移到和从 Amazon S3、EFS 和 FSx 等 AWS 提供的其他存储解决方案的任务。","s":"源#402"},{"id":"D3-411","d":3,"t":"single","q":"哪个 Amazon RDS 功能提供自动创建主数据库实例的能力，并同步将数据复制到另一个可用区的实例？","o":[{"l":"A","t":"只读副本"},{"l":"B","t":"蓝/绿部署"},{"l":"C","t":"多 AZ 部署"},{"l":"D","t":"预留实例"}],"a":["C"],"e":"多 AZ 部署是 Amazon RDS 的一个功能，它自动创建一个主数据库实例，并同步将数据复制到另一个不同的可用区的备用实例。这提供了高可用性和数据冗余，确保即使在一个可用区发生故障时，数据库仍然可用于读写操作。","s":"源#411"},{"id":"D3-414","d":3,"t":"multiple","q":"以下哪些可以是 AWS 云中的 VPC 组件？（选择两个）","o":[{"l":"A","t":"Amazon API Gateway"},{"l":"B","t":"Amazon S3 存储桶和对象"},{"l":"C","t":"AWS 存储网关"},{"l":"D","t":"互联网网关"},{"l":"E","t":"子网"}],"a":["D","E"],"e":"在 AWS 虚拟专用云（VPC）中，互联网网关（D）和子网（E）是两个主要组件。互联网网关用于将 VPC 连接到互联网，允许VPC内的实例与互联网之间进行通信。子网是 VPC IP 地址范围内的段，您可以在其中启动资源，如 Amazon EC2 实例。","s":"源#414"},{"id":"D3-425","d":3,"t":"single","q":"哪个 AWS 服务或资源可以用来部署 AWS WAF 规则？","o":[{"l":"A","t":"Amazon EC2"},{"l":"B","t":"应用程序负载均衡器"},{"l":"C","t":"AWS 信任顾问"},{"l":"D","t":"网络负载均衡器"}],"a":["B"],"e":"AWS WAF（Web 应用程序防火墙）规则可以使用应用程序负载均衡器部署。这些规则有助于保护您的应用程序免受可能影响可用性、危及安全或消耗过多资源的常见 Web 漏洞的侵害。","s":"源#425"},{"id":"D3-426","d":3,"t":"single","q":"一家公司在 Amazon EC2 实例上托管其网站。公司需要确保网站能够到达全球受众，并向用户提供最小的延迟。公司应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"Amazon Route 53"},{"l":"B","t":"Amazon CloudFront"},{"l":"C","t":"弹性负载均衡"},{"l":"D","t":"AWS Lambda"}],"a":["B"],"e":"Amazon CloudFront 是一个内容交付网络（CDN）服务，可以加速向全球用户交付网站和应用程序。通过在全球范围内分发内容，并将内容缓存在更接近用户的边缘位置，CloudFront 减少了延迟，改善了公司全球受众的用户体验。","s":"源#426"},{"id":"D3-430","d":3,"t":"single","q":"一家公司想要发现、准备、移动和整合来自多个来源的数据，用于数据分析和机器学习。哪家AWS无服务器数据集成服务可以满足这些要求？","o":[{"l":"A","t":"AWS Glue"},{"l":"B","t":"AWS 数据交换"},{"l":"C","t":"Amazon Athena"},{"l":"D","t":"Amazon EMR"}],"a":["A"],"e":"AWS Glue 是一个无服务器数据集成服务，使发现、准备和整合数据以用于分析、机器学习和应用开发变得容易。它减少了数据集成任务的复杂性和开销，是公司需求的理想选择。","s":"源#430"},{"id":"D3-432","d":3,"t":"single","q":"一家公司在 Amazon EC2 实例上部署了其应用程序。该应用程序偶尔会出现需求的突然增加。公司希望确保其应用程序能够以最低的成本应对需求的变化。哪个 AWS 服务或概念将满足这些要求？","o":[{"l":"A","t":"AWS 自动扩展"},{"l":"B","t":"AWS 计算优化器"},{"l":"C","t":"AWS 成本探索器"},{"l":"D","t":"AWS 良好构建框架"}],"a":["A"],"e":"AWS 自动扩展自动调整使用的 EC2 实例数量以响应需求，确保应用程序具有处理负载的正确数量的资源。这项服务通过在需求高峰期间扩展（增加实例）和需求低的期间缩减（删除实例），帮助维护性能和成本效益。","s":"源#432"},{"id":"D3-438","d":3,"t":"single","q":"一家公司有不断产生的非结构化数据的应用程序。公司需要以持久和易于查询的方式存储数据。哪家AWS 服务可以满足这些要求？","o":[{"l":"A","t":"Amazon RDS"},{"l":"B","t":"Amazon Aurora"},{"l":"C","t":"Amazon QuickSight"},{"l":"D","t":"Amazon DynamoDB"}],"a":["D"],"e":"Amazon DynamoDB 是一个完全托管的 NoSQL 数据库服务，提供快速和可预测的性能以及无缝的可扩展性。它旨在处理大量非结构化数据，并提供持久性和执行高效查询的能力。","s":"源#438"},{"id":"D3-440","d":3,"t":"single","q":"一家公司想要将公司的本地容器基础设施迁移到 AWS 云。公司想要防止非计划的管理和运营成本，并适应无服务器架构。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon Connect"},{"l":"B","t":"AWS Fargate"},{"l":"C","t":"Amazon Lightsail"},{"l":"D","t":"Amazon EC2"}],"a":["B"],"e":"AWS Fargate 是一个无服务器计算引擎，适用于容器，可与 Amazon Elastic Container Service（ECS）和 Amazon Elastic Kubernetes Service （EKS）配合使用。它消除了公司管理服务器的需要，允许公司专注于构建和部署应用程序，而不必担心基础设施。","s":"源#440"},{"id":"D3-442","d":3,"t":"single","q":"一家电子商务公司已在 Amazon EC2 实例上部署了一个新的 Web 应用程序。公司希望将传入的HTTP流量均匀地分布在所有运行的实例上。哪个 AWS 服务或资源将满足这个要求？","o":[{"l":"A","t":"Amazon EC2 自动扩展"},{"l":"B","t":"应用程序负载均衡器"},{"l":"C","t":"网关负载均衡器"},{"l":"D","t":"网络负载均衡器"}],"a":["B"],"e":"应用程序负载均衡器旨在自动将传入的应用程序流量均匀地分布在多个目标上，例如 EC2 实例。它确保流量均匀分布，并有助于提高应用程序的可用性和容错能力。","s":"源#442"},{"id":"D3-443","d":3,"t":"single","q":"哪个 AWS 服务或功能使用户能够将 VPC 和本地网络连接到一个中央枢纽？","o":[{"l":"A","t":"虚拟专用网关"},{"l":"B","t":"AWS 传输网关"},{"l":"C","t":"互联网网关"},{"l":"D","t":"客户端网关"}],"a":["B"],"e":"AWS 传输网关是一个服务，通过充当中心枢纽，简化了您的 VPC 和本地网络之间的连接。它允许您将多个 VPC 和本地网络连接到一个中央枢纽，使管理和路由不同环境之间的流量变得更加容易。","s":"源#443"},{"id":"D3-444","d":3,"t":"single","q":"一家公司希望在多个 Amazon EC2 实例上运行 CPU 密集型工作负载。为了满足这个要求，公司应该使用哪种 EC2 实例类型？","o":[{"l":"A","t":"通用实例"},{"l":"B","t":"计算优化实例"},{"l":"C","t":"内存优化实例"},{"l":"D","t":"存储优化实例"}],"a":["B"],"e":"计算优化实例旨在为需要高计算能力的工作负载提供服务，并为 CPU 密集型应用程序提供最佳的价格性能。这些实例为处理大量数据或运行计算密集型任务提供了计算、内存和网络资源的良好平衡。","s":"源#444"},{"id":"D3-445","d":3,"t":"single","q":"一家公司正在连接多个 VPC 和本地网络。公司需要使用 AWS 服务作为云路由器来简化对等关系。公司应该使用哪家 AWS 服务来满足这个要求？","o":[{"l":"A","t":"AWS Direct Connect"},{"l":"B","t":"AWS 传输网关"},{"l":"C","t":"Amazon Connect"},{"l":"D","t":"Amazon Route 53"}],"a":["B"],"e":"AWS 传输网关是一个服务，允许您轻松地将 VPC 和本地网络连接。它充当云路由器，简化了不同网络之间的路由和对等过程，是复杂网络架构的理想解决方案。","s":"源#445"},{"id":"D3-446","d":3,"t":"single","q":"一家公司存储大量数据，审计员每年只访问两次。为了以最低成本存储数据，公司应该使用哪种Amazon S3 存储类别？","o":[{"l":"A","t":"Amazon S3 Outposts"},{"l":"B","t":"Amazon S3 Glacier 即时检索"},{"l":"C","t":"Amazon S3 标准"},{"l":"D","t":"Amazon S3 智能分层"}],"a":["B"],"e":"Amazon S3 Glacier 即时检索旨在以低成本存储不频繁访问的长期数据。它在偶尔需要时提供对您归档数据的即时访问，使其成为每年只访问几次的数据的成本效益选择。","s":"源#446"},{"id":"D3-450","d":3,"t":"single","q":"一家公司希望在 AWS 云中存储其文件。用户需要能够直接使用公共 URL 下载这些文件。哪个AWS服务或功能将满足此要求？","o":[{"l":"A","t":"Amazon Redshift"},{"l":"B","t":"Amazon Elastic Block Store（Amazon EBS）"},{"l":"C","t":"Amazon Elastic File System（Amazon EFS）"},{"l":"D","t":"Amazon S3"}],"a":["D"],"e":"Amazon S3 是一个可扩展的对象存储服务，允许用户从网络上的任何地方存储和检索任意数量的数据。它可以用于存储文件，并通过公共 URL 提供访问，使其成为与用户直接共享文件的合适选择。","s":"源#450"},{"id":"D3-451","d":3,"t":"single","q":"一家公司正在使用 AWS 作为其所有 IT 基础设施。公司的开发者被允许自己部署应用程序。开发者希望部署他们的应用程序，而不必自己提供基础设施。开发者应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS CloudFormation"},{"l":"B","t":"AWS CodeBuild"},{"l":"C","t":"AWS Elastic Beanstalk"},{"l":"D","t":"AWS CodeDeploy"}],"a":["C"],"e":"AWS Elastic Beanstalk 是一个编排服务，处理应用程序的部署。它抽象了底层基础设施的配置，并允许开发者简单地上传他们的代码，而 Elastic Beanstalk 负责部署、从容量配置、负载平衡、自动扩展到应用程序健康监控。","s":"源#451"},{"id":"D3-452","d":3,"t":"single","q":"一家公司希望从其数据中获得洞察，并构建交互式数据可视化仪表板。哪个 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon SageMaker"},{"l":"B","t":"Amazon Rekognition"},{"l":"C","t":"Amazon QuickSight"},{"l":"D","t":"Amazon Kinesis"}],"a":["C"],"e":"Amazon QuickSight 是一个快速的、基于云的商业智能服务，使向组织中的每个人提供洞察变得容易。它可用于创建交互式仪表板并可视化数据以获得洞察。","s":"源#452"},{"id":"D3-453","d":3,"t":"single","q":"一位云工程师想要在 Amazon S3 中存储数据。工程师将每年访问一些数据，每天访问一些数据。哪种S3 存储类别将以最具成本效益的方式满足这些要求？","o":[{"l":"A","t":"S3 标准"},{"l":"B","t":"S3 Glacier Deep Archive"},{"l":"C","t":"S3 One Zone-Infrequent Access（S3 One Zone-IA）"},{"l":"D","t":"S3 智能分层"}],"a":["D"],"e":"S3 智能分层旨在通过自动将数据移动到最具成本效益的访问层，而不影响性能或运营开销，来优化存储成本。它适用于具有未知或变化访问模式的数据，使其成为访问频率和不频繁访问的数据的成本效益选择。","s":"源#453"},{"id":"D3-456","d":3,"t":"single","q":"一家公司需要存储不经常使用的数据以进行数据存档和长期备份。哪种 AWS 服务或存储类别将以最具成本效益的方式满足这些要求？","o":[{"l":"A","t":"Amazon FSx for Lustre"},{"l":"B","t":"Amazon Elastic Block Store（Amazon EBS）"},{"l":"C","t":"Amazon Elastic File System（Amazon EFS）"},{"l":"D","t":"Amazon S3 Glacier Flexible Retrieval"}],"a":["D"],"e":"Amazon S3 Glacier Flexible Retrieval 是一种存储类别，为数据存档和长期备份提供安全、持久且极低成本的存储。它旨在在偶尔需要时提供对数据的快速访问，使其成为不经常访问数据的成本效益选择。","s":"源#456"},{"id":"D3-458","d":3,"t":"single","q":"一家公司需要创建和发布交互式商业智能仪表板。仪表板需要由机器学习驱动的洞察力。哪个AWS服务或工具将满足这些要求？","o":[{"l":"A","t":"AWS Glue Studio"},{"l":"B","t":"Amazon QuickSight"},{"l":"C","t":"Amazon Redshift"},{"l":"D","t":"Amazon Athena"}],"a":["B"],"e":"Amazon QuickSight 是一个商业分析服务，可用于创建交互式仪表板。它还与其他 AWS 服务（如 Amazon Redshift 和AWS Glue）集成，用于数据准备和查询，并且可以利用机器学习提供洞察力和预测分析。","s":"源#458"},{"id":"D3-464","d":3,"t":"single","q":"一家公司想要使用无服务器计算服务运行应用程序。哪个 AWS 服务将满足这个要求？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"AWS CloudFormation"},{"l":"C","t":"AWS Elastic Beanstalk"},{"l":"D","t":"弹性负载均衡"}],"a":["A"],"e":"AWS Lambda 是一个无服务器计算服务，让您无需配置或管理服务器即可运行代码。它仅在需要时执行您的代码，并自动扩展，非常适合需要无服务器计算能力的应用程序。","s":"源#464"},{"id":"D3-465","d":3,"t":"single","q":"一家公司想要一个解决方案，根据当前负载自动调整使用的 Amazon EC2 实例数量。哪个AWS 产品将满足这些要求？","o":[{"l":"A","t":"专用主机"},{"l":"B","t":"放置组"},{"l":"C","t":"自动扩展组"},{"l":"D","t":"预留实例"}],"a":["C"],"e":"Amazon EC2 中的自动扩展组自动调整实例数量以响应需求变化。这确保应用程序保持可用，并且通过自动启动或终止实例来控制成本。","s":"源#465"},{"id":"D3-466","d":3,"t":"single","q":"一家公司正在构建 AWS 架构，以将实时数据源从本地数据中心传输到在 AWS 上运行的应用程序。公司需要一个一致的网络连接，最小化延迟。公司应该使用什么来连接应用程序和数据中心，以满足这些要求？","o":[{"l":"A","t":"AWS Direct Connect"},{"l":"B","t":"公共互联网"},{"l":"C","t":"AWS VPN"},{"l":"D","t":"Amazon Connect"}],"a":["A"],"e":"AWS Direct Connect 建立了从本地数据中心到 AWS 的专用网络连接，与公共互联网相比，可以减少延迟并提高网络性能。它提供了一个一致且安全的连接，非常适合实时数据源。","s":"源#466"},{"id":"D3-467","d":3,"t":"single","q":"一家公司计划将其自定义营销应用程序和订单处理应用程序迁移到 AWS。公司需要在具有不同CPU、内存、存储和网络容量配置的不同类型的实例上部署应用程序。公司应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"Amazon Cognito"},{"l":"C","t":"Amazon Athena"},{"l":"D","t":"Amazon EC2"}],"a":["D"],"e":"Amazon EC2（弹性计算云）是一项 Web 服务，提供可调整大小的云中计算能力。它允许用户在世界各地的多个可用区启动和管理虚拟服务器。这是部署具有特定 CPU、内存、存储和网络容量配置的应用程序的理想服务。","s":"源#467"},{"id":"D3-469","d":3,"t":"multiple","q":"哪些 AWS 服务可以托管 PostgreSQL 数据库？（选择两个）","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"Amazon Aurora"},{"l":"C","t":"Amazon EC2"},{"l":"D","t":"Amazon OpenSearch Service"},{"l":"E","t":"Amazon Elastic File System（Amazon EFS）"}],"a":["B","C"],"e":"Amazon Aurora 是一种与 PostgreSQL 兼容的全托管关系数据库，Amazon EC2 实例可用于托管自管理的 PostgreSQL 数据库。这两种服务都可用于在 AWS 上托管 PostgreSQL 数据库。","s":"源#469"},{"id":"D3-471","d":3,"t":"single","q":"哪个 AWS 服务或功能需要互联网服务提供商（ISP）和托管设施来实施？","o":[{"l":"A"
