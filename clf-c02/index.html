施补丁、数据中心物理安全、Lambda@Edge 运行时维护均归 AWS。\n\n**❌ 为什么其他选项错**：\n- A. 为 Amazon S3 基础设施设备应用安全补丁：S3 底层归 AWS\n- B. 为 AWS 数据中心提供物理安全：AWS 责任\n- C. 在 Lambda@Edge 上安装操作系统更新：Lambda 无客户可见 OS，运行时由 AWS 托管\n\n**📌 关键概念**：客户侧=MFA/IAM+数据+客户 OS+网络配置；AWS 侧=托管服务底层+物理设施+运行时；本题与 D2-631 构成重复题，答案与口径完全一致，题库重复题按同口径独立成文。","s":"源#648"},{"id":"D2-650","d":2,"t":"single","q":"哪项 AWS 服务始终免费提供给用户？","o":[{"l":"A","t":"Amazon Athena"},{"l":"B","t":"AWS Identity and Access Management（IAM）"},{"l":"C","t":"AWS Secrets Manager"},{"l":"D","t":"Amazon ElastiCache"}],"a":["B"],"e":"**✅ 为什么 B. AWS Identity and Access Management（IAM） 对**：IAM 对所有账户永久免费（不按用户数/策略数收费），属于「始终免费」类服务。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Athena：按扫描数据量计费的交互式查询服务，用得越多越贵\n- C. AWS Secrets Manager：按机密数量与 API 调用次数收费的托管服务\n- D. Amazon ElastiCache：按缓存节点规格与运行时长计费的资源型服务\n\n**📌 关键概念**：永久免费代表=IAM/CloudFormation/Auto Scaling/CloudFront（部分）；Athena 虽有免费套餐但属按量计费类；「始终免费」类考题集中在身份/编排/伸缩等平台基础能力上，数据类服务基本都收费。","s":"源#650"},{"id":"D2-654","d":2,"t":"single","q":"管理员观察到昨天有多个 AWS 资源被删除。 哪项 AWS 服务将帮助确定原因并确定是哪个用户删除了这些资源？","o":[{"l":"A","t":"AWS CloudTrail"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"AWS Trusted Advisor"}],"a":["A"],"e":"**✅ 为什么 A. AWS CloudTrail 对**：CloudTrail 记录账户内 API 调用事件（含资源删除操作的操作者、时间与参数），可回溯「昨天谁删除了哪些资源」，是删除事件溯源的标准工具。\n\n**❌ 为什么其他选项错**：\n- B. Amazon Inspector：漏洞扫描，不记录操作\n- C. Amazon GuardDuty：威胁检测，识别恶意行为但不输出操作审计明细\n- D. AWS Trusted Advisor：优化建议，无操作日志\n\n**📌 关键概念**：谁删了资源/何时操作 → CloudTrail（事件历史可查 90 天，可接 S3 长期留存）；「异常行为检测」→ GuardDuty；排查类题先问「要操作记录还是检测结果」，要记录即 CloudTrail。","s":"源#654"},{"id":"D2-655","d":2,"t":"single","q":"为了协助公司在云中遵守支付卡行业数据安全标准（PCI DSS），AWS 提供：","o":[{"l":"A","t":"通过预约对数据中心进行物理检查。"},{"l":"B","t":"为在 AWS 上运行的任何应用程序提供所需的 PCI 合规认证。"},{"l":"C","t":"针对特定 AWS 服务的 AWS 合规性声明（A0C）报告。"},{"l":"D","t":"专业的 PCI 合规服务。"}],"a":["C"],"e":"**✅ 为什么 C. 针对特定 AWS 服务的 AWS 合规性声明（AoC）报告 对**：AWS 为 PCI DSS 提供的是「AWS 服务的合规性声明（AoC）」等审计报告，证明 AWS 侧控制有效；客户应用自身的 PCI 认证仍需客户自行完成。\n\n**❌ 为什么其他选项错**：\n- A. 通过预约对数据中心进行物理检查：AWS 不向客户提供数据中心物理检查\n- B. 为在 AWS 上运行的任何应用程序提供 PCI 合规认证：合规责任共担，AWS 不为客户应用背书认证\n- D. 专业的 PCI 合规服务：AWS 不提供 PCI 合规咨询服务\n\n**📌 关键概念**：AWS 在 PCI DSS 中提供=服务级 AoC/SOC 报告（经 Artifact 获取）+合规云环境；客户责任=应用层 PCI 合规；共享责任模型决定「认证各管各的」，AWS 从不认证客户应用。","s":"源#655"},{"id":"D2-656","d":2,"t":"single","q":"在哪些情况下，公司应该创建 IAM 用户而不是 IAM 角色？","o":[{"l":"A","t":"当在 Amazon EC2 实例上运行的应用程序需要访问其他 AWS 服务时。"},{"l":"B","t":"当公司为个人创建 AWS 访问凭据时。"},{"l":"C","t":"当公司创建在移动电话上运行并向 AWS 发出请求的应用程序时。"},{"l":"D","t":"当公司需要将用户添加到 IAM 组时。"},{"l":"E","t":"当用户在公司网络中进行身份验证并希望能够使用 AWS 而无需再次登录时。"}],"a":["B"],"e":"**✅ 为什么 B. 当公司为个人创建 AWS 访问凭据时 对**：IAM 用户的本质是「长期身份对应的长期凭据」，适合为具体个人（员工）发放可审计的固定身份；场景中的人与应用均应优先用角色或联合身份。\n\n**❌ 为什么其他选项错**：\n- A. EC2 上的应用访问其他服务：应使用附加到实例的 IAM 角色（临时凭据）\n- C. 手机应用向 AWS 发请求：终端用户身份应走 Cognito 或角色联合\n- D. 需要将用户添加到 IAM 组：加组是用户创建后的授权动作，不是「何时创建用户」的判据\n- E. 公司网络验证后免再次登录 AWS：应走 SAML/OIDC 联合身份（SSO），无需 IAM 用户\n\n**📌 关键概念**：IAM 用户定位=需要长期固定身份的个人（如审计要求人对应凭据）；应用/SSO 场景一律用角色或联合身份；官方最佳实践是尽量以角色替代长期用户，减少长期密钥暴露面（本题为 5 选项单选，四个干扰项均指向更优替代方案）。","s":"源#656"},{"id":"D2-665","d":2,"t":"single","q":"一家公司需要为其 VPC 进行无状态网络过滤。 哪项 AWS 服务、工具或功能将满足此要求？","o":[{"l":"A","t":"AWS PrivateLink"},{"l":"B","t":"安全组"},{"l":"C","t":"网络访问控制列表（ACL）"},{"l":"D","t":"AWS WAF"}],"a":["C"],"e":"**✅ 为什么 C. 网络访问控制列表（ACL） 对**：网络 ACL 是 VPC 中唯一的无状态过滤组件（需分别配置入/出站规则、规则按序号评估），与题干「无状态网络过滤」逐字对应。\n\n**❌ 为什么其他选项错**：\n- A. AWS PrivateLink：私有连接 AWS 服务的通道，不过滤流量\n- B. 安全组：有状态过滤（回包自动放行），不满足「无状态」\n- D. AWS WAF：L7 应用层防火墙，非 VPC 网络层组件\n\n**📌 关键概念**：无状态 → NACL（出入站规则独立、序号评估、默认放行）；有状态 → 安全组（自动回程放行）；「无状态/子网级」双属性锁定 NACL，与「有状态/实例级」的安全组互为对照考点。","s":"源#665"},{"id":"D2-667","d":2,"t":"multiple","q":"一家公司希望将其基于服务器的应用程序迁移到 AWS 云。该公司希望确定将在AWS 云上托管的计算资源的总拥有成本。 哪些 AWS 服务或工具的组合将满足这些要求？（选择两项）","o":[{"l":"A","t":"AWS Pricing Calculator"},{"l":"B","t":"Migration Evaluator"},{"l":"C","t":"AWS Support Center"},{"l":"D","t":"AWS Application Discovery Service"},{"l":"E","t":"AWS Database Migration Service（AWS DMS）"}],"a":["A","B"],"e":"**✅ 为什么 A、B 对**：\n- A. AWS Pricing Calculator：输入评估后的资源规格，估算 AWS 云端成本\n- B. Migration Evaluator：分析本地环境数据，产出迁移成本评估与 TCO 报告\n\n**❌ 为什么其他选项错**：\n- C. AWS Support Center：技术支持门户，提交工单的地方，不做成本测算\n- D. AWS Application Discovery Service：采集本地资产与依赖数据，是评估的输入而非成本测算工具本身\n- E. AWS Database Migration Service（AWS DMS）：执行数据库搬迁动作，不计算总拥有成本\n\n**📌 关键概念**：TCO 评估组合=Migration Evaluator（本地侧分析）+Pricing Calculator（云端侧估算）；ADS 提供数据源、DMS 执行迁移，均非成本计算工具；「总拥有成本」题眼优先这两个工具的组合。","s":"源#667"},{"id":"D2-685","d":2,"t":"single","q":"一家公司想要一个完全托管的服务，该服务可以集中和自动化跨 AWS 服务和混合工作负载的数据保护。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Artifact"},{"l":"B","t":"AWS Backup"},{"l":"C","t":"AWS Batch"},{"l":"D","t":"AWS Shield"}],"a":["B"],"e":"**✅ 为什么 B. AWS Backup 对**：AWS Backup 是全托管集中式备份服务，可跨 AWS 服务（EC2/RDS/EBS/DynamoDB 等）与混合工作负载统一制定备份计划、保留策略与合规审计，与题干逐字对应。\n\n**❌ 为什么其他选项错**：\n- A. AWS Artifact：合规报告下载门户，不做任何数据备份\n- C. AWS Batch：批量计算任务调度服务，处理作业而非保护数据\n- D. AWS Shield：DDoS 流量防护服务，与备份恢复无关\n\n**📌 关键概念**：集中式自动化备份（跨服务+混合）→ AWS Backup（策略驱动+按需备份+备份计划合规审计）；单服务自带快照（RDS 快照等）是局部能力，「集中+自动化+混合」三词同时出现选 Backup。","s":"源#685"},{"id":"D2-686","d":2,"t":"single","q":"一家公司计划将其应用程序从本地迁移到 AWS 云。该公司需要收集应用程序组件的使用和配置数据。哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Database Migration Service（AWS DMS）"},{"l":"B","t":"AWS Transfer Family"},{"l":"C","t":"AWS Application Discovery Service"},{"l":"D","t":"AWS Global Accelerator"}],"a":["C"],"e":"**✅ 为什么 C. AWS Application Discovery Service 对**：ADS 采集本地服务器的使用量、性能与配置数据及依赖关系映射，为迁移规划提供输入，与题干「收集使用和配置数据」逐字对应。\n\n**❌ 为什么其他选项错**：\n- A. AWS Database Migration Service（AWS DMS）：执行数据库迁移搬迁，不采集服务器资产数据\n- B. AWS Transfer Family：SFTP/FTPS 等文件传输托管服务，管传文件不管摸家底\n- D. AWS Global Accelerator：全球流量加速网络服务，面向用户访问加速\n\n**📌 关键概念**：本地资产「发现」（清单/性能/依赖）→ ADS；数据搬家执行 → DMS/DataSync/MGN；迁移第一步永远是「摸清家底」，ADS 是迁移评估链路的起点工具。","s":"源#686"},{"id":"D2-693","d":2,"t":"single","q":"哪项 AWS 产品可以分析公司的 AWS 环境，以发现 Amazon EC2 实例上的安全漏洞？","o":[{"l":"A","t":"Amazon Inspector"},{"l":"B","t":"Amazon Macie"},{"l":"C","t":"AWS Shield Standard"},{"l":"D","t":"安全组"}],"a":["A"],"e":"**✅ 为什么 A. Amazon Inspector 对**：Inspector 自动扫描 EC2 实例（含容器镜像与 Lambda）的软件漏洞与网络暴露问题，产出带严重度分级的风险报告，正对应「发现 EC2 安全漏洞」。\n\n**❌ 为什么其他选项错**：\n- B. Amazon Macie：S3 敏感数据发现与分类，不扫实例软件漏洞\n- C. AWS Shield Standard：DDoS 基础防护，不评估系统漏洞\n- D. 安全组：网络访问控制组件，管放行不管体检，不是扫描服务\n\n**📌 关键概念**：EC2/ECR/Lambda 漏洞扫描 → Inspector（持续扫描+SSM Agent 集成+按严重度分级报告）；S3 数据分类 → Macie；DDoS → Shield；「漏洞（vulnerability）」题眼固定指向 Inspector，勿与威胁检测（GuardDuty 查行为）混淆。","s":"源#693"},{"id":"D2-698","d":2,"t":"single","q":"一家公司正在发布一个关键业务应用程序。在发布之前，该公司需要来自 AWS 的战略规划协助。在发布期间，该公司需要 AWS 基础设施事件管理和实时支持。 该公司应该怎么做来满足这些要求？","o":[{"l":"A","t":"访问 AWS Trusted Advisor。"},{"l":"B","t":"联系 AWS 合作伙伴网络（APN）。"},{"l":"C","t":"注册 AWS 企业支持。"},{"l":"D","t":"联系 AWS 专业服务。"}],"a":["C"],"e":"**✅ 为什么 C. 注册 AWS 企业支持 对**：企业支持计划提供发布前的架构审查与战略规划协助（含 TAM、Well-Architected 审查），以及发布期间的基础设施事件管理（IEM）与 15 分钟级实时支持，覆盖题干全部要求。\n\n**❌ 为什么其他选项错**：\n- A. 访问 AWS Trusted Advisor：优化建议工具，不提供人工规划与事件管理\n- B. 联系 AWS 合作伙伴网络（APN）：第三方伙伴网络，非 AWS 官方支持体系\n- D. 联系 AWS 专业服务：可提供咨询，但基础设施事件管理与全天候实时支持仍是企业支持计划的核心权益\n\n**📌 关键概念**：关键发布场景=企业支持（TAM+IEM 事件管理+15 分钟 SLA）；APN 是伙伴生态、Professional Services 是咨询团队，「发布期实时支持+事件管理」权益只有企业支持计划配套。","s":"源#698"},{"id":"D2-713","d":2,"t":"single","q":"一家公司需要阻止 SQL 注入攻击。 哪个 AWS 服务或功能提供此功能？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"网络 ACL"},{"l":"C","t":"安全组"},{"l":"D","t":"AWS 信任顾问"}],"a":["A"],"e":"**✅ 为什么 A. AWS WAF 对**：WAF 提供 SQL 注入规则集（托管规则+自定义规则），在请求到达应用前识别并拦截恶意 SQL 语句，是防 SQL 注入的标准服务。\n\n**❌ 为什么其他选项错**：\n- B. 网络 ACL：L3/L4 子网级过滤，不解析 SQL 语句\n- C. 安全组：实例级 IP/端口过滤，无应用层语义\n- D. AWS 信任顾问：Trusted Advisor 机翻名，优化建议工具，不拦截攻击\n\n**📌 关键概念**：SQL 注入/XSS → WAF（L7 规则引擎）；NACL/安全组只在网络层（IP/端口）工作，看不见 HTTP 内容；「信任顾问」等机翻名按标准英文名理解，Trusted Advisor 与攻击防护无关。","s":"源#713"},{"id":"D2-716","d":2,"t":"single","q":"哪个 AWS 服务可以通过使用策略来管理 AWS 资源的权限？","o":[{"l":"A","t":"Amazon Inspector"},{"l":"B","t":"Amazon Detective"},{"l":"C","t":"AWS 身份和访问管理 (IAM)"},{"l":"D","t":"Amazon GuardDuty"}],"a":["C"],"e":"**✅ 为什么 C. AWS 身份和访问管理 (IAM) 对**：IAM 通过 JSON 策略定义允许/拒绝的操作与资源条件，是「用策略管理 AWS 资源权限」的核心服务，与题干逐字对应。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Inspector：漏洞扫描服务，产出的是漏洞清单不是权限策略\n- B. Amazon Detective：安全事件调查分析，可视化关联溯源\n- D. Amazon GuardDuty：威胁检测服务，发现恶意行为并告警\n\n**📌 关键概念**：策略（policy）管理权限 → IAM（身份策略+资源策略+权限边界）；三个安全检测/调查服务与「策略授权」无关；「策略」二字出现在题干时，答案基本锁定 IAM 或 SCP（组织策略）二选一。","s":"源#716"},{"id":"D2-717","d":2,"t":"single","q":"一家公司需要在 AWS 云中运行部分工作负载。由于合规原因，公司需要将部分工作负载保留在自己的现场数据中心。 哪个 AWS 服务能满足这些要求？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"AWS Outposts"},{"l":"C","t":"Amazon Lightsail"},{"l":"D","t":"Amazon Connect"}],"a":["B"],"e":"**✅ 为什么 B. AWS Outposts 对**：Outposts 把 AWS 的计算/存储/数据库等硬件与服务延伸部署到客户本地数据中心，同一套 API 与控制平面，满足「云上运行+本地保留部分工作负载」的合规混合需求。\n\n**❌ 为什么其他选项错**：\n- A. AWS Config：配置审计服务，不提供本地运行能力\n- C. Amazon Lightsail：轻量云虚拟机服务，仍运行在 AWS 区域内\n- D. Amazon Connect：云联络中心服务\n\n**📌 关键概念**：本地延伸 AWS 基础设施（同一 API/控制台/计费）→ Outposts；「云+本地混合+合规原因留在本地」是 Outposts 的固定题眼；Lightsail 虽轻量但仍在云端，不满足本地运行诉求。","s":"源#717"},{"id":"D3-001","d":3,"t":"single","q":"一家公司计划使用 Amazon Snowball Edge 设备将文件传输到 AWS 云。哪些与 Snowball Edge 设备相关的活动对公司来说是免费的？","o":[{"l":"A","t":"10 天内使用 Snowball Edge 设备"},{"l":"B","t":"将数据从 Amazon S3 传输到 Snowball Edge 设备"},{"l":"C","t":"将数据从 Snowball Edge 设备传输到 Amazon S3"},{"l":"D","t":"10 天后每天使用 Snowball Edge 设备"}],"a":["C"],"e":"**✅ 为什么 C. 将数据从 Snowball Edge 设备传输到 Amazon S3 对**：Snowball Edge 的计费规则是设备使用前 10 天免费，且数据回传 AWS（设备→S3）方向的传输免费；题干问「免费的活动」，入云传输正是免费项。\n\n**❌ 为什么其他选项错**：\n- A. 10 天内使用 Snowball Edge 设备：设备 10 天内确实免费，但选项答的是「免费期」而非题干问的传输活动，非最佳答案\n- B. 将数据从 Amazon S3 传输到 Snowball Edge 设备：出云方向（S3→设备）数据传出不免费\n- D. 10 天后每天使用 Snowball Edge 设备：超出 10 天免费期后按天计费，明确收费项\n\n**📌 关键概念**：Snowball Edge 计费三要点=设备 10 天内免费+入云传输免费+出云收费；「传进 AWS 免费、传出 AWS 收费」是 AWS 传输计费通则；免费方向要认准「设备→S3」，与出云方向严格区分。","s":"源#1"},{"id":"D3-003","d":3,"t":"single","q":"一家公司有一个集中的用户群体，他们对大文件存储的需求超出了公司内部可用的空间。公司希望在保留共享内容的本地性能优势的同时，扩展该群体的文件存储能力。哪种 AWS 解决方案在操作上最有效？","o":[{"l":"A","t":"为每个用户创建一个 Amazon S3 存储桶。使用 S3 文件系统挂载工具挂载每个存储桶。"},{"l":"B","t":"配置并部署 AWS Storage Gateway 文件网关。将每个用户的工作站连接到文件网关。"},{"l":"C","t":"将每个用户的工作环境移动到 Amazon WorkSpaces。为每个用户设置 Amazon WorkDocs 账户。"},{"l":"D","t":"部署 Amazon EC2 实例并附加 Amazon Elastic Block Store (Amazon EBS) Provisioned IOPS 卷。直接与用户共享 EBS 卷。"}],"a":["B"],"e":"**✅ 为什么 B. 配置并部署 AWS Storage Gateway 文件网关 对**：文件网关在本地提供 NFS/SMB 文件接口、数据以对象形式落到 Amazon S3，本地缓存保障「本地性能」，S3 提供近无限容量，恰好满足「扩容+保留本地性能」双诉求。\n\n**❌ 为什么其他选项错**：\n- A. 为每个用户创建 Amazon S3 存储桶并挂载：「S3 文件系统挂载工具」并非 AWS 官方服务，属编造选项\n- C. 移动到 Amazon WorkSpaces+WorkDocs：替换用户工作环境，改变使用方式且非存储扩容方案\n- D. EC2+EBS Provisioned IOPS 卷直接共享：EBS 卷只能挂载到单实例，无法多用户共享\n\n**📌 关键概念**：本地文件协议访问+S3 后端存储 → Storage Gateway 文件网关（缓存保留本地读写体验）；共享文件系统用 EFS/FSx，块存储 EBS 不可跨实例共享；见「S3 挂载工具」类字眼要警惕编造服务名。","s":"源#3"},{"id":"D3-007","d":3,"t":"single","q":"一家公司正在 Amazon EC2 实例上运行和管理自己的 Docker 环境。公司想要一种替代方案来帮助管理集群大小、调度和环境维护。哪个 AWS 服务满足这些要求？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"AWS Fargate"},{"l":"D","t":"Amazon Athena"}],"a":["C"],"e":"**✅ 为什么 C. AWS Fargate 对**：Fargate 是无服务器容器运行时，由 AWS 托管底层基础设施，用户无需管理集群、调度与服务器维护，「替代自管 Docker 环境」正是其定位。\n\n**❌ 为什么其他选项错**：\n- A. AWS Lambda：函数级计算，不支持长期运行任意容器镜像\n- B. Amazon RDS：托管关系型数据库，与容器管理无关\n- D. Amazon Athena：S3 数据交互式查询服务，非计算服务\n\n**📌 关键概念**：不想管容器基础设施 → Fargate（无服务器容器，按任务付费）；想自己控制节点 → ECS/EKS on EC2；「托管集群/调度/维护」出现时在 Fargate 与 ECS 托管型之间辨析，本题强调「完全不管」选 Fargate。","s":"源#7"},{"id":"D3-008","d":3,"t":"single","q":"一家公司想要在 Amazon EC2 实例上运行 NoSQL 数据库。在这种情况下，AWS 的哪项任务是AWS的责任？","o":[{"l":"A","t":"更新 EC2 实例的来宾操作系统。"},{"l":"B","t":"在数据库层面维护高可用性。"},{"l":"C","t":"修补托管 EC2 实例的物理基础设施。"},{"l":"D","t":"配置安全组防火墙。"}],"a":["C"],"e":"**✅ 为什么 C. 修补托管 EC2 实例的物理基础设施 对**：共享责任模型下 EC2 归 AWS 责任的是「云本身」——物理主机、网络、虚拟化层；物理基础设施修补属于硬件层运维，全程由 AWS 负责。\n\n**❌ 为什么其他选项错**：\n- A. 更新 EC2 实例的来宾操作系统：客户责任（云中安全）\n- B. 在数据库层面维护高可用：EC2 自装数据库的应用层设计归客户\n- D. 配置安全组防火墙：安全组由客户设置，属客户责任\n\n**📌 关键概念**：EC2 责任分界线=AWS 管物理/虚拟化层，客户管来宾 OS 以上；「物理」二字是 AWS 责任的题眼；数据库跑在 EC2 上时，其 HA、补丁、备份全部归客户，与 RDS 托管责任形成对比。","s":"源#8"},{"id":"D3-009","d":3,"t":"multiple","q":"以下哪些 AWS 服务或工具可以识别 Amazon EC2 实例的合适尺寸机会？（选择两项。）","o":[{"l":"A","t":"AWS 成本探索器"},{"l":"B","t":"AWS 计费指挥家"},{"l":"C","t":"Amazon CodeGuru"},{"l":"D","t":"Amazon SageMaker"},{"l":"E","t":"AWS 计算优化器"}],"a":["A","E"],"e":"**✅ 为什么 A、E 对**：\n- A. AWS 成本探索器：可按服务/实例维度查看成本与用量历史，人工发现过度配置的实例\n- E. AWS 计算优化器：分析配置与利用率指标，自动推荐合适的实例类型与大小\n\n**❌ 为什么其他选项错**：\n- B. AWS 计费指挥家：定制计费视图与分摊规则，不做尺寸推荐\n- C. Amazon CodeGuru：代码审查与性能剖析，对象是代码不是实例\n- D. Amazon SageMaker：机器学习平台，与成本优化无关\n\n**📌 关键概念**：找「合适尺寸（right-sizing）」机会的工具=Compute Optimizer（自动推荐）+Cost Explorer（人工分析）；Billing Conductor 管账单展示、CodeGuru 管代码质量、SageMaker 管 ML，三者均不碰资源尺寸。","s":"源#9"},{"id":"D3-014","d":3,"t":"multiple","q":"一家公司正在使用中央数据平台来管理其客户的多种类型的数据。公司想使用 AWS 服务来发现、转换和可视化数据。 公司应该使用哪些 AWS 服务组合来满足这些要求？（选择两项。）","o":[{"l":"A","t":"AWS 胶"},{"l":"B","t":"Amazon EFS（Amazon EFS）"},{"l":"C","t":"Amazon Redshift"},{"l":"D","t":"Amazon QuickSight"},{"l":"E","t":"Amazon QLDB（Amazon QLD"}],"a":["A","D"],"e":"**✅ 为什么 A、D 对**：\n- A. AWS 胶（AWS Glue）：托管 ETL 服务，负责「发现+转换」数据\n- D. Amazon QuickSight：托管 BI 服务，负责「可视化」数据\n\n**❌ 为什么其他选项错**：\n- B. Amazon EFS：弹性文件系统，是存储服务而非数据处理/可视化工具\n- C. Amazon Redshift：数据仓库，存储与查询分析用，不承担可视化\n- E. Amazon QLDB（选项文本截断）：账本数据库，与数据发现/可视化无关\n\n**📌 关键概念**：发现+转换 → Glue（爬网程序编目+ETL 作业）；可视化 → QuickSight；数据仓库存查 → Redshift；考点是「ETL+BI」组合，两个职责各对应一个服务，存储类与账本类服务均不入选。","s":"源#14"},{"id":"D3-017","d":3,"t":"single","q":"一个开发人员想在 AWS 上快速部署应用程序，而不需要手动创建所需的资源。哪个AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon EC2"},{"l":"B","t":"AWS 弹性豆荚"},{"l":"C","t":"AWS 代码构建"},{"l":"D","t":"Amazon Personalize"}],"a":["B"],"e":"**✅ 为什么 B. AWS 弹性豆荚（AWS Elastic Beanstalk）对**：Elastic Beanstalk 只需上传代码，服务自动完成容量配置、负载均衡、伸缩与健康监控，「快速部署应用且不手动建资源」正是其口号式定位。\n\n**❌ 为什么其他选项错**：\n- A. Amazon EC2：裸虚拟机，需要自己创建配置实例\n- C. AWS 代码构建（AWS CodeBuild）：CI 编译测试服务，产出构件不部署运行环境\n- D. Amazon Personalize：个性化推荐 ML 服务，与应用部署无关\n\n**📌 关键概念**：上传代码即部署（全托管应用平台）→ Elastic Beanstalk；持续编译构建 → CodeBuild；Beanstalk 底层仍用 EC2/ELB/ASG，但全部由服务托管；「不想管基础设施只想跑应用」是 Beanstalk 固定题眼。","s":"源#17"},{"id":"D3-020","d":3,"t":"single","q":"一家在线游戏公司需要为其 Amazon EC2 实例选择一个购买选项，以运行一年。网络流量是一致的，任何流量增加都是可预测的。EC2 实例必须在线并随时可用，没有任何中断。哪种 EC2 实例购买选项将最符合成本效益？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"预留实例"},{"l":"C","t":"现货实例"},{"l":"D","t":"现货舰队"}],"a":["B"],"e":"**✅ 为什么 B. 预留实例 对**：流量稳定、一年期、不能中断的负载，预留实例承诺 1 年或 3 年使用量换最高 72% 折扣，且实例持续保留在线，最符合「稳定+必须在线+省钱」三要素。\n\n**❌ 为什么其他选项错**：\n- A. 按需实例：随时可用但无折扣，长期稳定负载成本最高\n- C. 现货实例：可被随时回收，违反「无中断」要求\n- D. 现货舰队：仍是现货组合，存在中断风险\n\n**📌 关键概念**：EC2 购买选项按负载画像选择=稳定在线→RI、短期突发→按需、可中断型负载→首选 Spot（折扣最高）、容器/Serverless 承诺→储蓄计划；「必须随时可用」一票否决 Spot 系选项，本题与 D3-057（可中断选现货）互为正反面。","s":"源#20"},{"id":"D3-021","d":3,"t":"single","q":"哪个 AWS 服务或功能允许用户在公司的本地数据中心和 AWS 云之间建立专用网络连接？","o":[{"l":"A","t":"AWS 直接连接"},{"l":"B","t":"VPC 对等"},{"l":"C","t":"AWS VPN"},{"l":"D","t":"Amazon Route 53"}],"a":["A"],"e":"**✅ 为什么 A. AWS 直接连接（AWS Direct Connect）对**：Direct Connect 在本地数据中心与 AWS 之间建立专用物理专线连接，绕开公网，提供低延迟、高带宽的私有链路，「专用网络连接」逐字对应其定位。\n\n**❌ 为什么其他选项错**：\n- B. VPC 对等：两个 VPC 之间的私有互通，不连接本地数据中心\n- C. AWS VPN：走公网加密隧道的连接，非「专用」线路\n- D. Amazon Route 53：托管 DNS 服务，不提供网络连接\n\n**📌 关键概念**：本地↔AWS 专线 → Direct Connect（物理专用端口）；加密走公网 → Site-to-Site VPN（便宜但共享公网）；VPC 对等只管云内 VPC 互联；「专用/私有物理连接」是 DX 题眼，与 VPN 的「隧道」措辞严格区分。","s":"源#21"},{"id":"D3-024","d":3,"t":"single","q":"在 VPC 中拥有互联网网关的目的是？","o":[{"l":"A","t":"创建到 VPC 的 VPN 连接"},{"l":"B","t":"允许 VPC 和互联网之间的通信"},{"l":"C","t":"对互联网流量施加带宽限制"},{"l":"D","t":"从互联网跨 Amazon EC2 实例负载均衡流量"}],"a":["B"],"e":"**✅ 为什么 B. 允许 VPC 和互联网之间的通信 对**：互联网网关（IGW）是 VPC 与公网之间的出口门户，实例要访问互联网或被公网访问，路由表必须指向 IGW，其唯一职责就是打通 VPC↔互联网双向通信。\n\n**❌ 为什么其他选项错**：\n- A. 创建到 VPC 的 VPN 连接：VPN 网关负责，与 IGW 无关\n- C. 对互联网流量施加带宽限制：IGW 不做限速，带宽管控靠其他机制\n- D. 从互联网跨 EC2 实例负载均衡流量：负载均衡由 ELB 负责\n\n**📌 关键概念**：VPC 上公网两件套=IGW（网关挂载）+路由表（0.0.0.0/0 指向）+公网 IP；负载均衡 → ELB；VPN 连接 → Virtual Private Gateway；IGW 只做「门」，不管分配也不管均衡。","s":"源#24"},{"id":"D3-027","d":3,"t":"multiple","q":"一家公司想要在达到特定 AWS 成本阈值时收到通知。公司可以使用哪些 AWS 服务或工具来满足此要求？（选择两项。）","o":[{"l":"A","t":"Amazon SQS（Amazon SQS）"},{"l":"B","t":"AWS 预算"},{"l":"C","t":"成本探索器"},{"l":"D","t":"Amazon CloudWatch"},{"l":"E","t":"AWS 成本和使用情况报告"}],"a":["B","D"],"e":"**✅ 为什么 B、D 对**：\n- B. AWS 预算（AWS Budgets）：可设成本阈值，超过即触发通知（邮件/SNS），为成本告警而生\n- D. Amazon CloudWatch：CloudWatch 告警可基于成本相关指标触发通知（如 billing 指标），满足阈值告警需求\n\n**❌ 为什么其他选项错**：\n- A. Amazon SQS：消息队列服务，不做成本监控\n- C. 成本探索器：成本分析与可视化，无阈值告警能力\n- E. AWS 成本和使用情况报告：全量成本数据文件，供分析消费，无通知功能\n\n**📌 关键概念**：成本阈值告警首选 → Budgets（自定义预算线+多渠道通知）；通用指标告警 → CloudWatch；Cost Explorer 管分析、CUR 管数据、SQS 管队列，「告警/通知」字眼把工具锁定在 Budgets 与 CloudWatch 二者。","s":"源#27"},{"id":"D3-029","d":3,"t":"multiple","q":"根据 AWS 共享责任模型，以下哪些任务是客户的责任？（选择两项。）","o":[{"l":"A","t":"配置 AWS 提供的安全组防火墙。"},{"l":"B","t":"在 AWS 云中对公司资产进行分类。"},{"l":"C","t":"确定用于 Amazon S3 存储桶的可用区。"},{"l":"D","t":"修补或升级 Amazon DynamoDB。"},{"l":"E","t":"选择运行 AWS Lambda 的 Amazon EC2 实例。"}],"a":["A","B"],"e":"**✅ 为什么 A、B 对**：\n- A. 配置 AWS 提供的安全组防火墙：云中安全归客户，安全组是客户侧设置项\n- B. 在 AWS 云中对公司资产进行分类：数据分类是典型的客户责任\n\n**❌ 为什么其他选项错**：\n- C. 确定 S3 存储桶的可用区：S3 是区域级服务，不存在选 AZ 的概念，且基础设施由 AWS 管理\n- D. 修补或升级 Amazon DynamoDB：托管服务，打补丁归 AWS\n- E. 选择运行 AWS Lambda 的 EC2 实例：Lambda 无服务器，底层由 AWS 管理，客户无从选择\n\n**📌 关键概念**：客户责任=云中安全（OS 补丁、安全组、数据分类加密）；AWS 责任=云本身（硬件、托管服务底层）；选项 C/E 是概念陷阱——S3 无 AZ、Lambda 无 EC2，用假前提引误选，识别陷阱比记忆责任清单更有效。","s":"源#29"},{"id":"D3-031","d":3,"t":"single","q":"哪个 AWS 服务或功能用于从分布式应用程序发送文本和电子邮件消息？","o":[{"l":"A","t":"Amazon SNS (Amazon SNS)"},{"l":"B","t":"Amazon SES (Amazon SES)"},{"l":"C","t":"Amazon CloudWatch Alarms"},{"l":"D","t":"Amazon SQS (Amazon SQS)"}],"a":["A"],"e":"**✅ 为什么 A. Amazon SNS 对**：SNS 是发布/订阅消息服务，主题支持多种终端订阅（短信、邮件、移动推送等），分布式应用向一个主题发布一次即可送达多种接收方，「文本和电子邮件消息」正是 SNS 典型订阅协议。\n\n**❌ 为什么其他选项错**：\n- B. Amazon SES：纯电子邮件发送服务，不含短信能力\n- C. Amazon CloudWatch Alarms：监控告警服务，通知是告警的副产品而非通用消息服务\n- D. Amazon SQS：队列服务，消息排队供消费者拉取，不主动推送通知\n\n**📌 关键概念**：多渠道通知（邮件+短信+推送）→ SNS（扇出推送）；纯邮件 → SES；解耦排队 → SQS（拉模式）；「短信+邮件都要」是 SNS 区别于 SES 的判据，推送 vs 拉取是 SNS vs SQS 的分水岭。","s":"源#31"},{"id":"D3-043","d":3,"t":"single","q":"一家公司在 Amazon S3 中存储了 5 TB 的数据。公司计划偶尔对数据运行查询进行分析。公司应该使用哪个 AWS 服务以最具成本效益的方式运行这些查询？","o":[{"l":"A","t":"Amazon Redshift"},{"l":"B","t":"Amazon Athena"},{"l":"C","t":"Amazon Kinesis"},{"l":"D","t":"Amazon RDS"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Athena 对**：Athena 是无服务器交互式查询服务，直接对 S3 数据运行标准 SQL，按扫描数据量计费；偶发查询无需常驻集群，5TB 数据偶尔查是最典型的 Athena 场景，「按查询付费」实现最低成本。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Redshift：数据仓库集群，常驻资源按小时计费，偶发查询不划算\n- C. Amazon Kinesis：流数据实时摄取处理，非查询分析工具\n- D. Amazon RDS：事务型数据库，装载日志查询成本高\n\n**📌 关键概念**：S3 数据+偶发 SQL 查询 → Athena（Serverless、按扫描量计费）；持续高频 BI → Redshift；实时流 → Kinesis；「偶尔查询+成本效益」两个关键词叠加出现时，答案几乎必是 Athena。","s":"源#43"},{"id":"D3-047","d":3,"t":"single","q":"一家公司想要将其本地关系型数据库迁移到 AWS 云。公司希望使用尽可能接近其当前地理位置的基础设施。公司应该使用哪个 AWS 服务或资源来选择其 Amazon RDS 部署区域？","o":[{"l":"A","t":"Amazon Connect"},{"l":"B","t":"AWS 波长"},{"l":"C","t":"AWS 区域"},{"l":"D","t":"AWS 直接连接"}],"a":["C"],"e":"**✅ 为什么 C. AWS 区域（AWS Region）对**：AWS 基础设施分层为 Region→AZ→数据中心，选择部署位置首先是选 Region；「尽可能接近当前地理位置」正是选 Region 的官方依据（低延迟、合规、成本三因素），RDS 部署区选择走的就是这条路径。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Connect：云联络中心服务，不是基础设施概念\n- B. AWS 波长（AWS Wavelength）：把计算嵌入 5G 边缘的专项部署，面向超低延迟 5G 应用\n- D. AWS 直接连接：本地到 AWS 的专线连接服务，不是选址资源\n\n**📌 关键概念**：选址三问=选 Region（地理/合规/服务）→ 选 AZ（容灾隔离）→ 边缘加速用 CloudFront/Wavelength；Connect 是业务应用、DX 是连接管道，均不提供「选择部署地理位置」的能力，Wavelength 仅限 5G 场景。","s":"源#47"},{"id":"D3-049","d":3,"t":"single","q":"一家公司正在构建一个需要在全球范围内以最小的延迟传递图像和视频的应用程序。公司可以使用哪种方法以成本效益的方式实现这一点？","o":[{"l":"A","t":"通过 Amazon CloudFront 传递内容。"},{"l":"B","t":"将内容存储在 Amazon S3 并启用 S3 跨区域复制。"},{"l":"C","t":"在多个 AWS 区域之间实现 VPN。"},{"l":"D","t":"通过 AWS PrivateLink 传递内容。"}],"a":["A"],"e":"**✅ 为什么 A. 通过 Amazon CloudFront 传递内容 对**：CloudFront 是全球 CDN，把图片视频缓存到全球边缘节点，用户就近获取内容，以最低成本实现全球最小延迟分发；静态内容+全球加速是 CDN 的教科书场景。\n\n**❌ 为什么其他选项错**：\n- B. S3 跨区域复制：只把数据复制到别的区域桶，用户仍直连源站，不提供边缘加速\n- C. 多区域间 VPN：VPN 提供连接性而非分发加速，且成本高\n- D. AWS PrivateLink：私有网络连接服务，不对公网最终用户提供内容分发\n\n**📌 关键概念**：全球低延迟交付静态内容 → CloudFront（边缘缓存+就近服务）；跨区域复制只管数据冗余、不管用户接入；PrivateLink 面向 VPC 私有互联；「全球用户+图像视频+最小延迟」三要素齐备即锁定 CDN。","s":"源#49"},{"id":"D3-051","d":3,"t":"single","q":"以下哪项是一个软件开发框架，公司可以用来定义云资源为代码，并通过 AWS CloudFormation 配置资源？","o":[{"l":"A","t":"AWS CLI"},{"l":"B","t":"AWS 开发者中心"},{"l":"C","t":"AWS 云开发工具包 (AWS CDK)"},{"l":"D","t":"AWS CodeStar"}],"a":["C"],"e":"**✅ 为什么 C. AWS 云开发工具包（AWS CDK）对**：CDK 是「以编程语言定义云资源」的开发框架，代码经合成生成 CloudFormation 模板再配置资源，把「资源即代码+CloudFormation 部署」串成一条链，与题干「软件开发框架+经 CloudFormation 配置」逐字吻合。\n\n**❌ 为什么其他选项错**：\n- A. AWS CLI：命令行工具，非开发框架\n- B. AWS 开发者中心：开发者门户/信息资源，不定义资源\n- D. AWS CodeStar：应用项目模板与 CI/CD 协作套件，非 IaC 定义框架\n\n**📌 关键概念**：用高级语言写基础设施 → CDK（合成 CFN 模板）；用 YAML/JSON 写 → CloudFormation；CDK 与 CFN 是「编写方式」与「部署引擎」的关系；CLI 是运维入口、CodeStar 是项目协作，考「框架」二字选 CDK。","s":"源#51"},{"id":"D3-055","d":3,"t":"single","q":"为了降低成本，一家公司计划将 NoSQL 数据库迁移到 AWS。哪个 AWS 服务是完全托管的，并且可以自动扩展吞吐量以满足数据库工作负载需求？","o":[{"l":"A","t":"Amazon Redshift"},{"l":"B","t":"Amazon Aurora"},{"l":"C","t":"Amazon DynamoDB"},{"l":"D","t":"Amazon RDS"}],"a":["C"],"e":"**✅ 为什么 C. Amazon DynamoDB 对**：DynamoDB 是全托管 NoSQL 键值数据库，表级自动伸缩吞吐容量（按需或预置模式），无需运维即可应对负载波动，「完全托管+自动扩展吞吐量+NoSQL」三个标签同时命中。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Redshift：数据仓库，非 NoSQL 场景\n- B. Amazon Aurora：托管关系型数据库，是 SQL 不是 NoSQL\n- D. Amazon RDS：托管关系型数据库服务，同为 SQL 系\n\n**📌 关键概念**：NoSQL 键值+亚毫秒延迟 → DynamoDB；关系型托管 → RDS/Aurora；数仓 → Redshift；「NoSQL」一词直接排除三个 SQL 系选项，考点在于数据库类型识别而非托管能力差异；自动扩展吞吐量是 DynamoDB 按需模式的核心卖点，记忆锚点为「表级吞吐自动伸缩」。","s":"源#55"},{"id":"D3-057","d":3,"t":"single","q":"一家公司拥有一个测试用的 AWS 环境。公司计划在 AWS 中测试一个应用程序。应用程序测试可以中断，不需要连续运行。哪种 Amazon EC2 购买选项将最符合成本效益？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"专用实例"},{"l":"C","t":"现货实例"},{"l":"D","t":"预留实例"}],"a":["C"],"e":"**✅ 为什么 C. 现货实例 对**：测试负载可中断、无需连续运行，Spot 实例利用 AWS 闲置容量，折扣最高可达 90%，「可中断+最省钱」完全匹配；中断风险对测试场景无实质影响。\n\n**❌ 为什么其他选项错**：\n- A. 按需实例：无折扣，非成本最优\n- B. 专用实例：硬件隔离计费更贵，与测试需求无关\n- D. 预留实例：适合长期稳定负载，短期测试承诺 1 年反而浪费\n\n**📌 关键概念**：购买选项决策树=可中断→Spot（最省）；稳定长期→RI/储蓄计划；短期不可断→按需；专用硬件需求→专用主机；本题与 D3-020 互为镜像，「测试/批处理/可中断」字眼=Spot 信号。","s":"源#57"},{"id":"D3-059","d":3,"t":"multiple","q":"以下哪些服务可以用来阻止对实例的网络流量？（选择两项。）","o":[{"l":"A","t":"安全组"},{"l":"B","t":"Amazon VPC 流日志"},{"l":"C","t":"网络 ACL"},{"l":"D","t":"Amazon CloudWatch"},{"l":"E","t":"AWS CloudTrail"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A. 安全组：实例级有状态防火墙，可显式拒绝入站流量\n- C. 网络 ACL：子网级无状态过滤，可设置拒绝规则阻断流量\n\n**❌ 为什么其他选项错**：\n- B. Amazon VPC 流日志：记录流量供审计分析，不做阻断\n- D. Amazon CloudWatch：监控告警，无流量控制能力\n- E. AWS CloudTrail：API 操作审计日志，与网络流量过滤无关\n\n**📌 关键概念**：VPC 内两级防火墙=安全组（实例级、有状态、默认拒绝入站）+网络 ACL（子网级、无状态、支持显式拒绝）；流日志是「看」、防火墙是「挡」；监控审计类服务（CloudWatch/CloudTrail）永远不做流量阻断。","s":"源#59"},{"id":"D3-061","d":3,"t":"single","q":"以下哪项是完全托管的 MySQL 兼容数据库？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"Amazon DynamoDB"},{"l":"C","t":"Amazon Redshift"},{"l":"D","t":"Amazon Aurora"}],"a":["D"],"e":"**✅ 为什么 D. Amazon Aurora 对**：Aurora 是 AWS 自研的 MySQL 兼容（也兼容 PostgreSQL）托管数据库，兼容性+高性能+自动存储扩展，题干「完全托管的 MySQL 兼容数据库」正是 Aurora 的产品定义。\n\n**❌ 为什么其他选项错**：\n- A. Amazon S3：对象存储，不是数据库\n- B. Amazon DynamoDB：NoSQL 键值库，不兼容 MySQL\n- C. Amazon Redshift：数据仓库，面向分析而非 MySQL 兼容 OLTP\n\n**📌 关键概念**：MySQL/PostgreSQL 兼容托管库 → Aurora（性能最高、存储自动扩展）；标准开源引擎托管 → RDS（MySQL/PostgreSQL 等）；NoSQL → DynamoDB；「兼容 MySQL」字眼在 Aurora 与 RDS 之间辨析，Aurora 强调自研高性能存储层；题干出现「完全托管」时，先排除对象存储与 NoSQL，再在 SQL 系托管库里二选一。","s":"源#61"},{"id":"D3-062","d":3,"t":"single","q":"哪个 AWS 服务支持混合架构，使用户能够将 AWS 基础设施、AWS 服务、API 和工具扩展到数据中心、共址环境或本地设施？","o":[{"l":"A","t":"AWS Snowmobile"},{"l":"B","t":"AWS 本地区域"},{"l":"C","t":"AWS Outposts"},{"l":"D","t":"AWS Fargate"}],"a":["C"],"e":"**✅ 为什么 C. AWS Outposts 对**：Outposts 把 AWS 计算/存储/数据库硬件与全套 API、服务、工具延伸到本地数据中心，「同一套云体验跑在本地」，混合架构要求「AWS 基础设施与服务扩展到本地」逐字对应其产品定位。\n\n**❌ 为什么其他选项错**：\n- A. AWS Snowmobile：PB 级数据迁移的集装箱卡车，是一次性搬运工具\n- B. AWS 本地区域（AWS Local Zones）：把 AWS 算力放到大都市边缘，仍属 AWS 运营的站点\n- D. AWS Fargate：无服务器容器运行时，与本地部署无关\n\n**📌 关键概念**：AWS 全栈延伸到自家机房 → Outposts（同 API/控制台/计费）；超大城市低延迟 → Local Zones；一次性大数据搬云 → Snow Family；Outposts 与 Local Zones 的区别在「客户机房 vs AWS 城市站点」。","s":"源#62"},{"id":"D3-063","d":3,"t":"single","q":"哪个 AWS 服务可以运行一个托管的 PostgreSQL 数据库，提供在线事务处理 (OLTP)？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon Athena"},{"l":"C","t":"Amazon RDS"},{"l":"D","t":"Amazon EMR"}],"a":["C"],"e":"**✅ 为什么 C. Amazon RDS 对**：RDS 是托管关系型数据库服务，支持 PostgreSQL 等多种引擎，自动备份/补丁/高可用，标准 OLTP 事务负载直接选用；PostgreSQL 之上的普通事务需求无需 Aurora 级别的高级特性。\n\n**❌ 为什么其他选项错**：\n- A. Amazon DynamoDB：NoSQL，非关系型\n- B. Amazon Athena：S3 查询分析工具，非事务数据库\n- D. Amazon EMR：大数据集群（Hadoop/Spark），非 OLTP 数据库\n\n**📌 关键概念**：托管 PostgreSQL 跑 OLTP → RDS（六引擎可选）；要更高性能/存储自动扩展 → Aurora PostgreSQL；NoSQL → DynamoDB；OLTP（事务）与 OLAP（分析）先分清，再在 RDS/Aurora 里按性能需求分层；本题题干只强调「托管+PostgreSQL+OLTP」，未提性能溢价，选标准 RDS 即为安全答案。","s":"源#63"},{"id":"D3-064","d":3,"t":"multiple","q":"一家公司想要为其远程员工提供管理的 Windows 虚拟桌面和应用程序，通过安全的网络连接。公司可以使用哪些 AWS 服务来满足这些要求？（选择两项。）","o":[{"l":"A","t":"Amazon Connect"},{"l":"B","t":"Amazon AppStream 2.0"},{"l":"C","t":"Amazon WorkSpaces"},{"l":"D","t":"AWS 站点到站点 VPN"},{"l":"E","t":"Amazon ECS (Amazon ECS)"}],"a":["B","C"],"e":"**✅ 为什么 B、C 对**：\n- B. Amazon AppStream 2.0：流式交付 Windows 应用/桌面的托管服务，满足「管理的虚拟桌面与应用」\n- C. Amazon WorkSpaces：完全托管的 Windows 虚拟桌面，配合 Site-to-Site VPN 等安全连接供远程办公\n\n**❌ 为什么其他选项错**：\n- A. Amazon Connect：云联络中心，不是桌面服务\n- D. AWS 站点到站点 VPN：只提供网络连接，不提供桌面/应用本身，单独不满足需求\n- E. Amazon ECS：容器编排，与虚拟桌面无关\n\n**📌 关键概念**：Windows 托管桌面 → WorkSpaces；流式应用交付（浏览器即用）→ AppStream 2.0；VPN/Secure Access 只是连接通道；远程办公题先分「桌面容器」与「网络管道」两类资源，别把通道当服务。","s":"源#64"},{"id":"D3-066","d":3,"t":"single","q":"哪个 AWS 服务是一个键值数据库，提供大规模的亚毫秒级延迟？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon Aurora"},{"l":"C","t":"Amazon DocumentDB（与 MongoDB 兼容）"},{"l":"D","t":"Amazon Neptune"}],"a":["A"],"e":"**✅ 为什么 A. Amazon DynamoDB 对**：DynamoDB 是键值/文档型 NoSQL 数据库，单数毫秒级延迟，可扩展到任意规模吞吐，「键值+大规模+亚毫秒」三个关键词都是 DynamoDB 的产品标签。\n\n**❌ 为什么其他选项错**：\n- B. Amazon Aurora：关系型 SQL 库，延迟与扩展模型不匹配键值场景\n- C. Amazon DocumentDB：文档型（MongoDB 兼容），非键值定位\n- D. Amazon Neptune：图数据库，面向关系图谱查询\n\n**📌 关键概念**：数据库选型速查=键值+亚毫秒 → DynamoDB；文档 → DocumentDB；图 → Neptune；SQL → RDS/Aurora；「键值」二字出现即锁定 DynamoDB，本题考的是 NoSQL 四兄弟的品类识别；大规模吞吐自动扩展是 DynamoDB 区别于 DocumentDB 的加分项，答题时先认品类再比细节。","s":"源#66"},{"id":"D3-067","d":3,"t":"single","q":"一家公司正在部署一个机器学习 (ML) 研究项目，该项目将需要大量的计算能力，持续几个月。ML处理作业不需要在特定时间运行。哪种 Amazon EC2 实例购买选项将满足这些要求，以最低成本？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"现货实例"},{"l":"C","t":"预留实例"},{"l":"D","t":"专用实例"}],"a":["B"],"e":"**✅ 为什么 B. 现货实例 对**：ML 研究持续数月、无时间窗口约束，对中断不敏感，Spot 实例最高 90% 折扣，大规模计算+可中断+最低成本是 Spot 的黄金场景；检查点机制可缓解中断影响。\n\n**❌ 为什么其他选项错**：\n- A. 按需实例：数月大规模计算全按需付费，成本最高\n- C. 预留实例：适合明确长期稳定的生产负载，研究项目弹性大\n- D. 专用实例：硬件隔离溢价，与研究需求无关\n\n**📌 关键概念**：大批量计算+不怕中断 → Spot（配合 checkpoint 更稳）；本题与 D3-057/D3-020 构成购买选项三连题；「不需要特定时间运行」=中断容忍信号词，出现即优先考虑 Spot。","s":"源#67"},{"id":"D3-068","d":3,"t":"multiple","q":"哪个 AWS 服务或功能为 Amazon EC2 实例提供灾难恢复解决方案？（选择两项。）","o":[{"l":"A","t":"EC2 预留实例"},{"l":"B","t":"EC2 Amazon Machine Image (AMI)"},{"l":"C","t":"Amazon EBS (EBS) 快照"},{"l":"D","t":"AWS 盾牌"},{"l":"E","t":"Amazon GuardDuty"}],"a":["B","C"],"e":"**✅ 为什么 B、C 对**：\n- B. EC2 Amazon Machine Image (AMI)：镜像保存实例启动配置，实例故障后快速重建\n- C. Amazon EBS 快照：块存储增量备份，存于 S3，可跨可用区恢复卷数据\n\n**❌ 为什么其他选项错**：\n- A. EC2 预留实例：计费优惠模型，与灾备无关\n- D. AWS 盾牌（AWS Shield）：DDoS 防护服务，不是恢复机制\n- E. Amazon GuardDuty：威胁检测服务，不做备份恢复\n\n**📌 关键概念**：EC2 灾备组合=AMI（整机配置备份）+EBS 快照（数据备份）；两者一「模板」一「数据」互补，配合起来可在故障后几分钟内重建实例；计费类（RI）、防护类（Shield）、检测类（GuardDuty）都不提供恢复能力，恢复题只看备份与镜像两类产品，其他选项直接排除。","s":"源#68"},{"id":"D3-081","d":3,"t":"single","q":"一家公司有一组电子商务应用程序。这些应用程序需要能够相互发送消息。哪个AWS 服务满足此要求？","o":[{"l":"A","t":"AWS 自动扩展"},{"l":"B","t":"弹性负载均衡"},{"l":"C","t":"Amazon SQS (Amazon SQS)"},{"l":"D","t":"Amazon Kinesis 数据流"}],"a":["C"],"e":"**✅ 为什么 C. Amazon SQS 对**：SQS 是托管消息队列，生产者发送消息入队、消费者按序拉取，应用间通过队列交换消息实现解耦，「应用程序之间相互发送消息」正是队列的教科书用途。\n\n**❌ 为什么其他选项错**：\n- A. AWS 自动扩展：容量伸缩，不传消息\n- B. 弹性负载均衡：分发请求，不是消息中介\n- D. Amazon Kinesis 数据流：实时流数据摄取，面向海量数据管道而非应用间消息\n\n**📌 关键概念**：应用解耦消息 → SQS（队列、拉取、至少一次投递）；发布订阅多播 → SNS；实时流 → Kinesis；「应用 A 与应用 B 通信」是队列场景标志，消息持久排队避免下游不可用时丢失。","s":"源#81"},{"id":"D3-085","d":3,"t":"single","q":"哪个 AWS 服务使公司能够部署应用程序，以靠近最终用户？","o":[{"l":"A","t":"Amazon CloudFront"},{"l":"B","t":"AWS 自动扩展"},{"l":"C","t":"AWS AppSync"},{"l":"D","t":"Amazon Route 53"}],"a":["A"],"e":"**✅ 为什么 A. Amazon CloudFront 对**：CloudFront 在全球数百个边缘节点缓存内容，用户请求就近终结，应用内容靠近最终用户交付；「部署靠近用户」在 CDN 语境下即边缘缓存分发。\n\n**❌ 为什么其他选项错**：\n- B. AWS 自动扩展：按负载增减实例，不改变用户接入距离\n- C. AWS AppSync：托管 GraphQL API 服务，与内容分发位置无关\n- D. Amazon Route 53：DNS 解析，只管域名到地址的映射\n\n**📌 关键概念**：靠近最终用户交付内容 → CloudFront（边缘站点缓存）；域名解析 → Route 53；自动扩展管容量、AppSync 管 API，均不缩短物理距离；「靠近用户/低延迟交付」类措辞先想 CDN。","s":"源#85"},{"id":"D3-086","d":3,"t":"single","q":"哪个 AWS 服务或功能通过使用 AWS 全球网络基础设施发送流量来提高网络性能？","o":[{"l":"A","t":"路由表"},{"l":"B","t":"AWS 传输网关"},{"l":"C","t":"AWS 全球加速器"},{"l":"D","t":"Amazon VPC"}],"a":["C"],"e":"**✅ 为什么 C. AWS 全球加速器（AWS Global Accelerator）对**：Global Accelerator 提供两个静态任播 IP，用户流量从最近的边缘点进入 AWS 全球骨干网，经 AWS 专网直达区域端点，「用 AWS 全球网络基础设施提升性能」是其产品定义原文。\n\n**❌ 为什么其他选项错**：\n- A. 路由表：VPC 内转发规则，不涉及全球网络优化\n- B. AWS 传输网关（AWS Transit Gateway）：VPC/VPN 互联枢纽，管云内组网\n- D. Amazon VPC：私有网络容器，本身不优化公网接入路径\n\n**📌 关键概念**：公网入口+全球骨干网 → Global Accelerator（任播 IP+静态 IP+故障转移）；内容缓存 → CloudFront；VPC 互联 → Transit Gateway；GA 优化「网络路径」，CloudFront 优化「内容分发」，两者常成对混淆要分清。","s":"源#86"},{"id":"D3-087","d":3,"t":"single","q":"哪个 AWS 服务提供高度耐用的对象存储？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"Amazon EFS (Amazon EFS)"},{"l":"C","t":"Amazon EBS (Amazon EBS)"},{"l":"D","t":"Amazon FSx"}],"a":["A"],"e":"**✅ 为什么 A. Amazon S3 对**：S3 是对象存储服务，11 个 9（99.999999999%）的数据持久性是其标志性 SLA，对象自动冗余存储在多设施多设备，「高度耐用的对象存储」是 S3 的官方定位原文。\n\n**❌ 为什么其他选项错**：\n- B. Amazon EFS：弹性文件系统，面向共享挂载场景而非极限持久性指标\n- C. Amazon EBS：块存储，持久性低于 S3（快照需转存 S3 加强）\n- D. Amazon FSx：托管文件系统（Windows/Lustre 等），非对象存储\n\n**📌 关键概念**：对象+最高持久性 → S3（11 个 9，即 99.999999999%）；块 → EBS（快照需转存 S3 加固）；文件 → EFS/FSx；持久性考题出现「99.999999999%」或「高度耐用+对象」即锁 S3；同类考点还会把 S3 的「持久性」与 EBS 的「可用性」并列出现，先分清存储形态再选答案。","s":"源#87"},{"id":"D3-088","d":3,"t":"single","q":"当一家公司在 Amazon EC2 实例上托管其数据库时，AWS 承担哪项责任？","o":[{"l":"A","t":"数据库备份"},{"l":"B","t":"数据库软件补丁"},{"l":"C","t":"操作系统补丁"},{"l":"D","t":"操作系统安装"}],"a":["D"],"e":"**✅ 为什么 D. 操作系统安装 对**：EC2 上自管数据库时，AWS 责任止于虚拟化层之下；来宾 OS 本身属于客户域，但其「初始安装/镜像提供」由 AWS 完成（AMI 由 AWS 提供），这一项是四个选项中唯一归 AWS 的动作。\n\n**❌ 为什么其他选项错**：\n- A. 数据库备份：客户在 OS 之上自管，完全客户责任\n- B. 数据库软件补丁：客户自装软件由客户打补丁\n- C. 操作系统补丁：来宾 OS 的持续维护归客户\n\n**📌 关键概念**：EC2 责任线=AWS 交付可用虚拟机（含 OS 安装/镜像），客户负责 OS 补丁与以上一切；本题与 D3-008 同考点不同切入——一个问物理层（AWS），一个问 OS 层（安装 AWS/维护客户）；「装好给你，后续你管」是分界口诀。","s":"源#88"},{"id":"D3-090","d":3,"t":"single","q":"哪个 AWS 服务是一个混合云存储服务，为本地用户提供几乎无限的云存储访问权限？","o":[{"l":"A","t":"AWS DataSync"},{"l":"B","t":"Amazon S3 Glacier"},{"l":"C","t":"AWS 存储网关"},{"l":"D","t":"Amazon EBS (Amazon EBS)"}],"a":["C"],"e":"**✅ 为什么 C. AWS 存储网关（AWS Storage Gateway）对**：Storage Gateway 是混合云存储服务，本地以缓存方式访问近无限的云端容量（S3 后端），「本地用户+几乎无限云存储」是其混合场景的标准描述。\n\n**❌ 为什么其他选项错**：\n- A. AWS DataSync：在线数据搬迁工具，一次性或计划性传输，非持续访问\n- B. Amazon S3 Glacier：归档冷存储，取回需分钟到小时级，不适合在线访问\n- D. Amazon EBS：块存储，单实例挂载，无本地访问能力\n\n**📌 关键概念**：本地持续访问云端容量 → Storage Gateway（文件/卷/磁带三种网关）；在线数据传输 → DataSync；深度归档 → Glacier；「混合云存储」四字是 Storage Gateway 的专属标签。","s":"源#90"},{"id":"D3-096","d":3,"t":"single","q":"一家公司希望运营一个数据仓库来分析数据，而无需管理数据仓库基础设施。哪家AWS 服务能满足这一要求？","o":[{"l":"A","t":"Amazon Aurora"},{"l":"B","t":"Amazon Redshift Serverless"},{"l":"C","t":"AWS Lambda"},{"l":"D","t":"Amazon RDS"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Redshift Serverless 对**：Redshift Serverless 按查询自动配置与伸缩数据仓库容量，无需集群管理，付费用量即出分析结果，「无需管理基础设施的数据仓库」正是其无服务器形态。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Aurora：托管事务型数据库，不是数据仓库\n- C. AWS Lambda：函数计算，不能当数据仓库\n- D. Amazon RDS：托管 OLTP 数据库，面向事务非分析\n\n**📌 关键概念**：无服务器数仓 → Redshift Serverless（免集群运维）；传统数仓 → Redshift（自己定节点）；分析型 vs 事务型先分层（Redshift 系 vs RDS/Aurora 系），再在分析型里按「要不要管集群」细分。","s":"源#96"},{"id":"D3-097","d":3,"t":"multiple","q":"AWS 云计算如何帮助企业降低成本？（选择两项。）","o":[{"l":"A","t":"AWS 在每个 AWS 区域收取相同的服务价格。"},{"l":"B","t":"AWS 允许按需调整容量。"},{"l":"C","t":"AWS 为连续空闲超过 1 周的 Amazon EC2 实例提供折扣。"},{"l":"D","t":"AWS 不收取额外费用，用于从 AWS 云发送到互联网的数据。"},{"l":"E","t":"AWS 消除了构建和维护本地数据中心的许多成本。"}],"a":["B","E"],"e":"**✅ 为什么 B、E 对**：\n- B. AWS 允许按需调整容量：随业务增减资源，不养闲置设备，从源头减少浪费\n- E. AWS 消除了构建和维护本地数据中心的许多成本：机房、硬件、电力、运维人员等固定投入转为按用量付费\n\n**❌ 为什么其他选项错**：\n- A. 每个 AWS 区域收取相同价格：事实错误，区域间价格有差异\n- C. 连续空闲超过 1 周的 EC2 折扣：AWS 无此政策\n- D. 云到互联网的数据传出不收费：事实相反，出向流量收费、入向免费\n\n**📌 关键概念**：AWS 省钱逻辑=弹性伸缩（不付闲置）+免建数据中心（CapEx 转 OpEx）+规模经济；多选里出现「绝对化表述」（相同价格/不收费/免费折扣）大概率是错误项，与免费出向、区域同价等虚构政策对照记忆。","s":"源#97"},{"id":"D3-102","d":3,"t":"single","q":"一家公司在 AWS 云上运行工作负载。哪个 AWS 最佳实践确保了工作负载最具成本效益的架构？","o":[{"l":"A","t":"松耦合"},{"l":"B","t":"合适尺寸"},{"l":"C","t":"缓存"},{"l":"D","t":"冗余"}],"a":["B"],"e":"**✅ 为什么 B. 合适尺寸 对**：成本优化支柱的最佳实践：right-sizing 指按实际负载选择最贴合的实例类型与大小，避免过度配置，是「最具成本效益架构」的核心手段，工作量级与资源规格精确匹配。\n\n**❌ 为什么其他选项错**：\n- A. 松耦合：可靠性支柱的架构模式，间接影响成本但非直接成本实践\n- C. 缓存：性能支柱手段，降低延迟与后端压力，成本收益是副产品\n- D. 冗余：可靠性手段，增加资源反而推高成本\n\n**📌 关键概念**：成本支柱三件套=合适尺寸（选对规格）+按需伸缩（自动扩展）+购买策略（RI/Spot/储蓄计划）；松耦合/冗余属可靠性、缓存属性能，答案要看题干指向的支柱，成本效益题先想 right-sizing。","s":"源#102"},{"id":"D3-103","d":3,"t":"single","q":"一家公司使用第三方服务将 10 TB 数据备份到磁带库。本地备份服务器的存储空间不足。公司希望使用 AWS 服务进行备份，而不需要更改其现有的备份工作流程。公司应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"Amazon EBS (Amazon EBS)"},{"l":"B","t":"AWS 存储网关"},{"l":"C","t":"Amazon ECS (Amazon ECS)"},{"l":"D","t":"AWS Lambda"}],"a":["B"],"e":"**✅ 为什么 B. AWS 存储网关（AWS Storage Gateway）对**：磁带网关形态把 S3 云端备份呈现为虚拟磁带库（VTL），第三方备份软件以为还在写磁带，实际数据落在 AWS，本地零扩容，「不改备份工作流程」正中其兼容设计。\n\n**❌ 为什么其他选项错**：\n- A. Amazon EBS：块存储，挂给单实例，备份软件无法当磁带库用\n- C. Amazon ECS：容器编排，与备份存储无关\n- D. AWS Lambda：函数计算，不是存储服务\n\n**📌 关键概念**：磁带库备份上云 → Storage Gateway 磁带网关（VTL 兼容 NetBackup 等第三方软件）；文件场景 → 文件网关；块场景 → 卷网关；「保留现有备份流程」是网关类服务的设计初衷，改流程的上云方案先排除。","s":"源#103"},{"id":"D3-109","d":3,"t":"single","q":"一家公司想要为其基于 Windows 的应用程序提供完全托管的 Windows 文件服务器。哪家AWS 服务将满足此要求？","o":[{"l":"A","t":"Amazon FSx"},{"l":"B","t":"Amazon EKS (Amazon EKS)"},{"l":"C","t":"Amazon ECS (Amazon ECS)"},{"l":"D","t":"Amazon EMR"}],"a":["A"],"e":"**✅ 为什么 A. Amazon FSx 对**：FSx for Windows File Server 提供完全托管的 Windows 文件服务器（SMB 协议、Active Directory 集成），「完全托管的 Windows 文件服务器」是其产品名即答案的直给题。\n\n**❌ 为什么其他选项错**：\n- B. Amazon EKS：Kubernetes 容器编排，非文件服务\n- C. Amazon ECS：容器编排，同理排除\n- D. Amazon EMR：大数据集群，与文件服务器无关\n\n**📌 关键概念**：Windows 文件服务 → FSx for Windows File Server（SMB+AD 集成）；高性能并行文件 → FSx for Lustre；容器编排两个「C 开头」（ECS/EKS）与文件服务无关；题干与产品名逐字对应时优先直选；注意 EFS 是 Linux 文件系统，本题问 Windows，答案只能是 FSx 系，四个选项中只有 FSx 带 Windows 语义。","s":"源#109"},{"id":"D3-110","d":3,"t":"single","q":"一家公司想要将其 NFS 本地工作负载迁移到 AWS。为了满足此要求，公司应该使用哪种AWS 存储网关类型？","o":[{"l":"A","t":"磁带网关"},{"l":"B","t":"卷网关"},{"l":"C","t":"Amazon FSx 文件网关"},{"l":"D","t":"Amazon S3 文件网关"}],"a":["D"],"e":"**✅ 为什么 D. Amazon S3 文件网关 对**：S3 文件网关提供 NFS/SMB 接口，本地应用以文件协议读写、数据以对象形式存入 S3；「NFS 本地工作负载迁移到 AWS」需要保留 NFS 接口，S3 文件网关是唯一匹配项。\n\n**❌ 为什么其他选项错**：\n- A. 磁带网关：模拟磁带库给备份软件用，接口不是 NFS\n- B. 卷网关：提供 iSCSI 块卷，不是文件协议\n- C. Amazon FSx 文件网关：面向 FSx for Windows File Server 的本地缓存加速，不是 S3 后端\n\n**📌 关键概念**：Storage Gateway 三形态速记=文件网关（NFS/SMB→S3 或 FSx）、卷网关（iSCSI 块）、磁带网关（VTL 备份）；NFS 上云先分「S3 后端还是 FSx 后端」，本题问的是 S3 网关类型中的文件形态。","s":"源#110"},{"id":"D3-112","d":3,"t":"single","q":"一家公司有一个在 Amazon EC2 实例上运行的不间断应用程序。该应用程序不断地处理Amazon Simple Queue Service (SQS) 队列中的文件积压。这种使用预计将持续增长多年。哪种 EC2 实例购买模型最能以成本效益的方式满足这些要求？","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"按需实例"},{"l":"C","t":"储蓄计划"},{"l":"D","t":"专用主机"}],"a":["C"],"e":"**✅ 为什么 C. 储蓄计划 对**：储蓄计划承诺 1 年或 3 年的稳定用量（按每小时美元计），换取最高 72% 折扣，自动覆盖 EC2/Fargate/Lambda 等计算；多年持续增长的 SQS 处理负载，用储蓄计划锁定基线用量最省钱。\n\n**❌ 为什么其他选项错**：\n- A. 现货实例：可被回收，处理「不间断」队列积压会中断\n- B. 按需实例：无折扣，多年长跑成本最高\n- D. 专用主机：整机租用更贵，面向合规需求而非省钱\n\n**📌 关键概念**：储蓄计划=按「用量金额」承诺（弹性匹配实例家族变化），RI=按「具体实例配置」承诺；本题负载形态固定且不可断，储蓄计划比 RI 更适配「持续增长」的弹性；Spot 被不间断一票否决。","s":"源#112"},{"id":"D3-113","d":3,"t":"single","q":"一家公司希望为其客户数据提供产品推荐。哪个 AWS 服务能满足这一要求？","o":[{"l":"A","t":"Amazon Polly"},{"l":"B","t":"Amazon Personalize"},{"l":"C","t":"Amazon Comprehend"},{"l":"D","t":"Amazon Rekognition"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Personalize 对**：Personalize 基于客户行为数据自动训练推荐模型，输出个性化产品推荐，「产品推荐」是其唯一且核心的产品功能，直给型考题。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Polly：文本转语音服务\n- C. Amazon Comprehend：自然语言处理（情感/实体分析）\n- D. Amazon Rekognition：图像视频识别分析\n\n**📌 关键概念**：AI 服务功能对照=推荐 → Personalize、语音合成 → Polly、文本理解 → Comprehend、图像视频 → Rekognition；四个 AI 服务各占一个模态，按「推荐/说/读/看」四字诀区分即可秒答；本题选项清一色 AI 服务，认产品定位比背功能清单更快，产品名即功能。","s":"源#113"},{"id":"D3-116","d":3,"t":"single","q":"一家公司希望使用一个完全托管的服务来帮助创建、测试和管理自定义 Amazon EC2 镜像。哪个AWS 服务能满足这些要求？","o":[{"l":"A","t":"EC2 图像构建器"},{"l":"B","t":"Amazon Machine Image (AMI)"},{"l":"C","t":"AWS 发射向导"},{"l":"D","t":"AWS Elastic Beanstalk"}],"a":["A"],"e":"**✅ 为什么 A. EC2 图像构建器（EC2 Image Builder）对**：Image Builder 是托管流水线服务，自动执行自定义镜像的构建、测试与分发，定期更新 AMI 无需人工脚本，「创建+测试+管理自定义 EC2 镜像」是其功能清单原文。\n\n**❌ 为什么其他选项错**：\n- B. Amazon Machine Image (AMI)：镜像本身是产物，不是构建工具\n- C. AWS 发射向导（AWS Launch Wizard）：引导式部署第三方应用，不产出自定义镜像\n- D. AWS Elastic Beanstalk：应用托管平台，不做镜像流水线\n\n**📌 关键概念**：自定义 AMI 流水线 → Image Builder（构建/测试/分发自动化）；AMI 是「物」、Image Builder 是「工厂」；Launch Wizard 管「装应用」、Beanstalk 管「跑应用」，与镜像生产线职责不同。","s":"源#116"},{"id":"D3-117","d":3,"t":"single","q":"一家公司希望自动化其 Amazon EC2 实例的软件漏洞持续扫描过程。哪个 AWS 服务能满足这些要求？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"Amazon Detective"},{"l":"D","t":"Amazon Cognito"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Inspector 对**：Inspector 是自动化漏洞管理服务，持续扫描 EC2/Lambda/容器镜像的软件漏洞与意外网络暴露，并产出修复建议，「自动化的持续漏洞扫描」是其当前产品定位。\n\n**❌ 为什么其他选项错**：\n- A. Amazon GuardDuty：威胁检测（行为分析），不扫软件漏洞\n- C. Amazon Detective：安全事件调查与关联分析，事后溯源\n- D. Amazon Cognito：用户身份认证授权，非安全扫描\n\n**📌 关键概念**：安全服务四分工=漏洞 → Inspector、威胁 → GuardDuty、调查 → Detective、身份 → Cognito；「扫描+漏洞」字眼锁 Inspector，GuardDuty 看行为不看版本缺口，两者是「查漏洞 vs 查行为」的关系。","s":"源#117"},{"id":"D3-118","d":3,"t":"single","q":"一家公司需要每周执行一次数据处理，通常需要大约 5 小时才能完成。公司应该使用哪个AWS服务来处理这个工作负载？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"Amazon EC2"},{"l":"C","t":"AWS CodeDeploy"},{"l":"D","t":"AWS Wavelength"}],"a":["B"],"e":"**✅ 为什么 B. Amazon EC2 对**：作业单次运行约 5 小时，远超 Lambda 15 分钟上限，需要可长时间运行的计算资源；EC2 可每周定时启停实例，按实际开机时间付费，匹配每周一次的批处理节奏。\n\n**❌ 为什么其他选项错**：\n- A. AWS Lambda：单次执行上限 15 分钟，无法完成 5 小时任务\n- C. AWS CodeDeploy：应用部署自动化，不是计算执行平台\n- D. AWS Wavelength：5G 边缘部署形态，与批量作业调度无关\n\n**📌 关键概念**：Lambda 15 分钟红线是高频考点，超长任务必排除 Lambda；批处理长任务 → EC2（配合 EventBridge 定时启停）或 Batch 服务；「每周一次+数小时」的画像直接指向可开关的虚机模式。","s":"源#118"},{"id":"D3-119","d":3,"t":"single","q":"哪个 AWS 服务或功能提供 VPC 中网络接口的入站和出站流量的日志信息？","o":[{"l":"A","t":"Amazon CloudWatch Logs"},{"l":"B","t":"AWS CloudTrail"},{"l":"C","t":"VPC 流日志"},{"l":"D","t":"AWS 身份和访问管理 (IAM)"}],"a":["C"],"e":"**✅ 为什么 C. VPC 流日志 对**：VPC Flow Logs 记录 VPC 内网络接口（ENI）级别的进出 IP 流量元数据，可投递到 CloudWatch Logs 或 S3，「VPC 网络接口入站出站流量日志」与其功能定义逐字对应。\n\n**❌ 为什么其他选项错**：\n- A. Amazon CloudWatch Logs：通用日志存储与检索，是流日志的投递目的地而非采集源\n- B. AWS CloudTrail：记录账户 API 操作（谁在什么时间调了什么），不记包级流量\n- D. AWS IAM：身份权限管理，与流量日志无关\n\n**📌 关键概念**：包级网络流量 → VPC Flow Logs（ENI 级）；控制面 API 操作 → CloudTrail；两者一个是「数据面」一个是「控制面」；CloudWatch Logs 只是日志仓库，本身不产生任何日志。","s":"源#119"},{"id":"D3-121","d":3,"t":"single","q":"一家公司计划在 AWS 上部署容器。公司希望完全控制托管容器的计算资源。应该使用哪个AWS服务来满足这些要求？","o":[{"l":"A","t":"Amazon EKS（Amazon Elastic Kubernetes Service，简称 Amazon EKS）"},{"l":"B","t":"AWS Fargate"},{"l":"C","t":"Amazon EC2（Amazon EC2）"},{"l":"D","t":"Amazon ECS（Amazon Elastic Container Service，简称 Amazon ECS）"}],"a":["C"],"e":"**✅ 为什么 C. Amazon EC2 对**：在 AWS 上跑容器且要「完全控制计算资源」，唯一途径是自管 EC2 集群：EC2 上自建或作为 ECS/EKS 的工作节点，CPU/内存/网络全部自行决定与调优。\n\n**❌ 为什么其他选项错**：\n- A. Amazon EKS：托管 Kubernetes 控制平面，但节点仍可选 EC2/Fargate，服务本身不等于「完全控制」\n- B. AWS Fargate：无服务器容器，计算资源完全由 AWS 托管，用户零控制\n- D. Amazon ECS：编排服务，控制平面托管，同样不直接提供资源控制权\n\n**📌 关键概念**：容器资源控制光谱=EC2（全控）→ECS/EKS on EC2（半控，管节点）→Fargate（零控）；「完全控制计算资源」反向排除一切托管形态；ECS/EKS/Fargate 是「编排/运行时」层，真正决定资源粒度的是底层 EC2。","s":"源#121"},{"id":"D3-123","d":3,"t":"single","q":"一家公司希望通过使用行业标准文件系统协议，在 Amazon S3 中存储和检索文件，以供其现有的本地应用程序使用。哪个 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS DataSync"},{"l":"B","t":"AWS Snowball Edge"},{"l":"C","t":"Amazon S3 文件网关"},{"l":"D","t":"AWS Transfer Family"}],"a":["C"],"e":"**✅ 为什么 C. Amazon S3 文件网关 对**：S3 文件网关为本地应用提供 NFS/SMB 等标准文件协议接口，后端以对象形式存储到 S3，「用行业标准文件协议在 S3 存取文件」正是其设计初衷，与题干措辞逐字对应。\n\n**❌ 为什么其他选项错**：\n- A. AWS DataSync：数据批量搬迁工具，不提供持续的文件协议接口\n- B. AWS Snowball Edge：离线数据传输设备，一次性搬运\n- D. AWS Transfer Family：提供 SFTP/FTP 的托管入口服务，面向外部用户访问而非本地应用挂载\n\n**📌 关键概念**：本地应用用标准协议持续读写 S3 → S3 文件网关（NFS/SMB 前端+S3 对象后端）；一次性传输 → DataSync/Snowball；外网文件传输 → Transfer Family；「标准文件协议+S3」组合词锁定文件网关。","s":"源#123"},{"id":"D3-125","d":3,"t":"single","q":"一家公司想要一个统一的工具，提供一种与 AWS 服务交互的一致方法。哪种 AWS 服务或工具将满足此要求？","o":[{"l":"A","t":"AWS CLI"},{"l":"B","t":"Amazon Elastic 容器服务（Amazon ECS）"},{"l":"C","t":"AWS Cloud9"},{"l":"D","t":"AWS 虚拟专用网络（AWS VPN）"}],"a":["A"],"e":"**✅ 为什么 A. AWS CLI 对**：AWS CLI 是统一的命令行工具，一套命令覆盖全部 AWS 服务，支持脚本自动化与一致的配置，与题干「统一的工具+一致的方法」逐字对应，是管理 AWS 的标准入口。\n\n**❌ 为什么其他选项错**：\n- B. Amazon ECS：容器编排服务，不是管理工具\n- C. AWS Cloud9：云端 IDE 开发环境，可执行命令但本身是编辑器\n- D. AWS VPN：网络连接服务，与工具交互无关\n\n**📌 关键概念**：命令行统一管理 → AWS CLI（脚本化/自动化）；图形化管理 → 控制台；程序化 API → SDK；Cloud9 是写代码的环境、不是管理入口；「一致的方法」字眼是 CLI 的题眼，与 SDK/控制台并列记忆。","s":"源#125"},{"id":"D3-138","d":3,"t":"single","q":"一家公司希望在 Amazon EC2 实例上运行其工作负载超过 1 年。该工作负载将连续运行。哪种选项提供了比按需实例每小时费率更优惠的费率？","o":[{"l":"A","t":"AWS Graviton 处理器"},{"l":"B","t":"专用主机"},{"l":"C","t":"EC2 实例节省计划"},{"l":"D","t":"Amazon EC2 自动扩展实例"}],"a":["C"],"e":"**✅ 为什么 C. EC2 实例节省计划 对**：EC2 Instance Savings Plan 承诺 1 年或 3 年的稳定用量（每小时美元），换取比按需更低的费率，且自动应用于匹配的实例家族，长期连续运行的负载用它最省钱。\n\n**❌ 为什么其他选项错**：\n- A. AWS Graviton 处理器：芯片型号，不是购买模型，不改变计费费率\n- B. 专用主机：硬件专用计费模式，面向合规与许可，单价高于按需\n- D. Amazon EC2 自动扩展实例：自动伸缩是运营手段，本身不提供费率折扣\n\n**📌 关键概念**：比按需便宜的费率=储蓄计划（实例级或计算级）或 RI；Graviton 是架构（同规格更便宜但这是芯片特性）、专用主机是隔离选项、自动扩展是弹性选项，三个都不属于「购买模型」；「连续运行 1 年+更优惠费率」锁储蓄计划/RI。","s":"源#138"},{"id":"D3-139","d":3,"t":"single","q":"AWS 云的哪种特性帮助用户消除未充分利用的 CPU 容量？","o":[{"l":"A","t":"敏捷性"},{"l":"B","t":"弹性"},{"l":"C","t":"可靠性"},{"l":"D","t":"持久性"}],"a":["B"],"e":"**✅ 为什么 B. 弹性 对**：弹性（Elasticity）指根据需求自动伸缩计算资源，负载高时扩展、低时缩减，避免资源闲置，「消除未充分利用的 CPU 容量」正是弹性的价值描述；云计算按需扩容是其核心特征。\n\n**❌ 为什么其他选项错**：\n- A. 敏捷性：快速开发迭代交付，关注交付速度而非资源利用\n- C. 可靠性：故障恢复与可用性保障，不解决闲置浪费\n- D. 持久性：数据不丢失，与容量利用无关\n\n**📌 关键概念**：六特性对号入座=弹性（扩缩容）、敏捷（交付快）、可靠（不故障）、持久（数据在）、可用（不掉线）、可扩展（支持增长）；「消除未利用容量」=弹性是五支柱里的典型「按需支付」体现。","s":"源#139"},{"id":"D3-143","d":3,"t":"single","q":"一家公司需要在客户端和 Amazon S3 存储桶之间快速安全地传输文件。哪个 S3 功能将满足此要求？","o":[{"l":"A","t":"S3 版本控制"},{"l":"B","t":"S3 传输加速"},{"l":"C","t":"S3 ACL"},{"l":"D","t":"S3 智能分层"}],"a":["B"],"e":"**✅ 为什么 B. S3 传输加速 (S3 Transfer Acceleration) 对**：传输加速利用 CloudFront 全球边缘节点，客户端先上传到就近边缘，再经 AWS 骨干网转发到 S3，远端大文件上传提速，「客户端到 S3 快速安全传输」正是其专设功能。\n\n**❌ 为什么其他选项错**：\n- A. S3 版本控制：对象版本管理，与传输速度无关\n- C. S3 ACL：对象/桶访问控制列表，是权限不是加速\n- D. S3 智能分层：存储层自动迁移（标准/IA/Glacier），优化存储成本非传输\n\n**📌 关键概念**：跨区域大文件传输优化 → S3 Transfer Acceleration（边缘入口+骨干网）；存储分层省钱 → Intelligent-Tiering；权限 → ACL/Bucket Policy；版本 → Versioning；S3 功能四分类=速度/成本/权限/版本，题干问「传输速度」即锁定加速。","s":"源#143"},{"id":"D3-150","d":3,"t":"single","q":"哪个选项是由一个或多个数据中心组成的环境？","o":[{"l":"A","t":"Amazon CloudFront"},{"l":"B","t":"可用区"},{"l":"C","t":"VPC"},{"l":"D","t":"AWS Outposts"}],"a":["B"],"e":"**✅ 为什么 B. 可用区 对**：可用区（AZ）是区域内相互独立的数据中心群，每个 AZ 具备独立电力、制冷与网络，一个或多个数据中心组成，是 AWS 容灾部署的基本单元。\n\n**❌ 为什么其他选项错**：\n- A. Amazon CloudFront：全球 CDN 服务，不是地理位置单元\n- C. VPC：逻辑隔离网络，不包含物理数据中心\n- D. AWS Outposts：本地机房延伸，不是云内区域组件\n\n**📌 关键概念**：AWS 地理分层=Region（多地多 AZ）→AZ（≥1 数据中心）→数据中心；「一个或多个数据中心组成」的措辞即 AZ 定义；VPC 是逻辑网络容器与物理数据中心无关；考试先分层级再答题。","s":"源#150"},{"id":"D3-151","d":3,"t":"single","q":"一家公司正在将本地数据中心迁移到 AWS 云。公司必须将 50PB 的文件存储数据迁移到AWS，同时尽可能减少运营开销。为了满足这些要求，公司应该使用哪种 AWS 服务或资源？","o":[{"l":"A","t":"AWS Snowmobile"},{"l":"B","t":"AWS Snowball Edge"},{"l":"C","t":"AWS Data Exchange"},{"l":"D","t":"AWS 数据库迁移服务（AWS DMS）"}],"a":["A"],"e":"**✅ 为什么 A. AWS Snowmobile 对**：Snowmobile 是集装箱式卡车，单次可运输高达 100PB 数据，专为 EB 级超大规模迁移设计；50PB 文件数据+最少运营开销，只有 Snowmobile 一次成行。\n\n**❌ 为什么其他选项错**：\n- B. AWS Snowball Edge：单台设备数十 TB，50PB 需上千台次，运营开销巨大\n- C. AWS Data Exchange：数据订阅与交易市场，不是迁移工具\n- D. AWS 数据库迁移服务（AWS DMS）：在线数据库迁移，面向结构化库而非文件存储\n\n**📌 关键概念**：Snow 家族容量阶梯=Snowcone（TB 级）→Snowball Edge（数十 TB）→Snowmobile（EB 级/100PB）；50PB 是「Snowmobile」专属信号，10TB 级用 Snowball；物理设备选择看数据量，PB 级优先集装箱。","s":"源#151"},{"id":"D3-153","d":3,"t":"single","q":"一家公司想要查询其服务器日志，以了解其客户体验的洞察。哪种 AWS 服务将以最具成本效益的方式存储这些数据？","o":[{"l":"A","t":"Amazon Aurora"},{"l":"B","t":"Amazon Elastic File System（Amazon EFS）"},{"l":"C","t":"Amazon Elastic Block Store（Amazon EBS）"},{"l":"D","t":"Amazon S3"}],"a":["D"],"e":"**✅ 为什么 D. Amazon S3 对**：S3 是低成本高持久对象存储，适合海量日志长期保留，可配合 Athena/Glacier 等按需查询归档，「以最具成本效益的方式存储大量服务器日志」即 S3 定位；日志查询场景下 S3+Athena 是标准组合。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Aurora：关系型数据库，存储日志成本高且结构不符\n- B. Amazon EFS：文件系统，单价高于对象存储，不适合海量冷数据\n- C. Amazon EBS：块存储，按容量付费且持久性需快照加持\n\n**📌 关键概念**：海量日志+低成本长期保存 → S3（生命周期管理可转 IA/Glacier）；分析日志 → S3+Athena；数据库文件 → RDS/Aurora；块/文件/对象三类存储按「查询方式+成本」选型，日志属于典型的对象存储场景。","s":"源#153"},{"id":"D3-157","d":3,"t":"single","q":"一家公司想要自动添加和删除 Amazon EC2 实例。公司希望 EC2 实例根据不同的工作负载动态调整。哪种服务或功能将满足这些要求？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon EC2 竞价实例"},{"l":"C","t":"AWS Snow Family"},{"l":"D","t":"Amazon EC2 自动扩展"}],"a":["D"],"e":"**✅ 为什么 D. Amazon EC2 自动扩展 对**：Auto Scaling 组按需求自动增减 EC2 实例数量，可基于 CPU/网络等指标动态调整容量，实现「自动添加删除+随负载变化」的需求，弹性伸缩的旗舰服务。\n\n**❌ 为什么其他选项错**：\n- A. Amazon DynamoDB：NoSQL 数据库，不管理 EC2\n- B. Amazon EC2 竞价实例：购买方式（Spot），提供折扣但不自动伸缩\n- C. AWS Snow Family：离线数据迁移设备，与计算伸缩无关\n\n**📌 关键概念**：自动增删 EC2 → Auto Scaling（动态/预测伸缩策略）；Spot 是省钱购买形态，需配合 ASG 才实现弹性；「根据负载自动调整实例数」出现即 Auto Scaling，购买方式与伸缩机制是两个维度别混淆。","s":"源#157"},{"id":"D3-161","d":3,"t":"single","q":"一家公司在 Amazon RDS 数据库实例上运行关键工作负载。公司需要数据库实例具有高可用性，恢复时间少于 5 分钟。哪种解决方案将满足这些要求？","o":[{"l":"A","t":"为数据库实例创建读取副本。"},{"l":"B","t":"使用 AWS CloudFormation 创建数据库实例的模板。"},{"l":"C","t":"定期拍摄数据库实例的快照。将快照存储在 Amazon S3 中。"},{"l":"D","t":"将数据库实例修改为多 AZ 部署。"}],"a":["D"],"e":"**✅ 为什么 D. 将数据库实例修改为多 AZ 部署 对**：多 AZ 部署在主可用区创建同步备用实例，主库故障时 RDS 自动切换，故障转移时间通常以分钟计（RTO 典型 <5 分钟），满足高可用与快速恢复要求，是 RDS 高可用标准方案。\n\n**❌ 为什么其他选项错**：\n- A. 创建读取副本：Read Replica 用于读扩展与灾备，不能自动故障转移\n- B. 使用 CloudFormation 模板：仅自动化资源创建，与运行时高可用无关\n- C. 定期拍摄快照并存储到 S3：快照恢复需人工触发且耗时，无法满足 <5 分钟 RTO\n\n**📌 关键概念**：RDS 高可用=多 AZ（同步复制+自动切换）；读扩展=只读副本；备份恢复=快照（人工、慢）；RTO 短且自动切换的需求锁定 Multi-AZ，与备份方案区分开。","s":"源#161"},{"id":"D3-165","d":3,"t":"single","q":"一家公司想要识别与另一个 AWS 账户共享的 Amazon S3 存储桶。哪种 AWS 服务或功能将满足这些要求？","o":[{"l":"A","t":"AWS Lake Formation"},{"l":"B","t":"IAM 凭证报告"},{"l":"C","t":"Amazon CloudWatch"},{"l":"D","t":"IAM 访问分析器"}],"a":["D"],"e":"**✅ 为什么 D. IAM 访问分析器 对**：IAM Access Analyzer 持续分析资源策略，发现与外部主体共享的 S3 存储桶、IAM 角色等资源并生成 findings，「识别与另一 AWS 账户共享的资源」正是其设计目的。\n\n**❌ 为什么其他选项错**：\n- A. AWS Lake Formation：数据湖权限服务，不检测共享关系\n- B. IAM 凭证报告：报告用户凭证状态，不分析资源共享\n- C. Amazon CloudWatch：监控与告警，与资源共享检测无关\n\n**📌 关键概念**：发现外部共享/暴露 → IAM Access Analyzer（外部访问探测）；凭证审计 → IAM 凭证报告；「另一个账户共享」字眼锁定 Access Analyzer，与 Config（配置审计）、CloudTrail（API 审计）区分。","s":"源#165"},{"id":"D3-166","d":3,"t":"single","q":"哪种 AWS 服务使用户能够构建包含机器学习洞察的交互式商业智能仪表板？","o":[{"l":"A","t":"Amazon Athena"},{"l":"B","t":"Amazon Kendra"},{"l":"C","t":"Amazon QuickSight"},{"l":"D","t":"Amazon Redshift"}],"a":["C"],"e":"**✅ 为什么 C.Amazon QuickSight 对**：QuickSight 是托管 BI 服务，创建交互式仪表板并内置 ML Insights（异常检测/预测/自动叙事），「含机器学习洞察的交互式仪表板」正对应其核心功能组合。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Athena：S3 交互式 SQL 查询，不是仪表板工具\n- B. Amazon Kendra：企业智能搜索，非 BI 可视化\n- D. Amazon Redshift：数据仓库，存储与查询分析，不直接产出仪表板\n\n**📌 关键概念**：BI 仪表板+ML 洞察 → QuickSight；SQL 查询 → Athena；数仓 → Redshift；搜索 → Kendra；「仪表板」字眼锁定 QuickSight，与其他分析工具形成场景区分。BI 工具与数仓分工：QuickSight 直连 RDS/S3/Athena 等源出报表，Redshift 负责底层大规模查询。","s":"源#166"},{"id":"D3-179","d":3,"t":"single","q":"以下哪项描述了 Amazon S3 的一些核心功能？","o":[{"l":"A","t":"Amazon S3 是为 Amazon EC2 设计的高性能块存储服务。"},{"l":"B","t":"Amazon S3 是提供高性能、安全性、可扩展性和数据可用性的的对象存储服务。"},{"l":"C","t":"Amazon S3 是一种完全托管的、高可靠性和可扩展性文件存储系统，可通过行业标准的 SMB 协议访问。"},{"l":"D","t":"Amazon S3 是一种可扩展的、完全托管的 Elastic NFS，用于 AWS 云服务和本地资源。"}],"a":["B"],"e":"**✅ 为什么 B.Amazon S3 是提供高性能、安全性、可扩展性和数据可用性的的对象存储服务。 对**：Amazon S3 是对象存储服务，提供高性能、安全性、可扩展性与数据可用性，选项 B 的描述与 S3 官方定位逐字吻合，是四个选项中唯一准确描述 S3 核心功能的表述。\n\n**❌ 为什么其他选项错**：\n- A. 高性能块存储：块存储是 EBS，S3 是对象存储\n- C. SMB 文件存储：SMB 是 FSx for Windows 的协议，非 S3\n- D. Elastic NFS：NFS 文件系统是 EFS，非对象存储\n\n**📌 关键概念**：存储三分类=对象（S3）、块（EBS）、文件（EFS/FSx，含 SMB/NFS 协议）；题干出现「对象存储」即 S3；SMB→FSx、NFS→EFS，按协议识别文件存储服务。","s":"源#179"},{"id":"D3-181","d":3,"t":"multiple","q":"哪些 AWS 服务或功能使用户能够将本地网络连接到 VPC？（选择两个。）","o":[{"l":"A","t":"AWS VPN"},{"l":"B","t":"弹性负载均衡"},{"l":"C","t":"AWS Direct Connect"},{"l":"D","t":"VPC peering"},{"l":"E","t":"Amazon CloudFront"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：AWS VPN 走互联网加密隧道（站点到站点），Direct Connect 走专用物理线路，两者都建立本地网络与 VPC 的连接，是「本地网络接入 VPC」的两个标准通道。\n- A. AWS VPN：经互联网加密隧道连接本地网络与 VPC（站点到站点 VPN）\n- C. AWS Direct Connect：通过专用物理线路连接本地数据中心与 VPC\n\n**❌ 为什么其他选项错**：\n- B. 弹性负载均衡：流量分发，不提供本地连接\n- D. VPC peering：连接两个 VPC，不连接本地网络\n- E. Amazon CloudFront：CDN，与本地网络接入无关\n\n**📌 关键概念**：本地网络接入 VPC 两通道=VPN（走互联网加密）与 Direct Connect（走专线）；VPC peering 用于 VPC 互联、负载均衡与 CDN 均不提供本地接入；题干「本地网络连接 VPC」直接锁定 VPN/DC。","s":"源#181"},{"id":"D3-182","d":3,"t":"single","q":"用户需要在 AWS 上快速部署非关系型数据库。用户不想管理底层硬件或数据库软件。哪种AWS 服务可以用来实现这一点？","o":[{"l":"A","t":"Amazon RDS"},{"l":"B","t":"Amazon DynamoDB"},{"l":"C","t":"Amazon Aurora"},{"l":"D","t":"Amazon Redshift"}],"a":["B"],"e":"**✅ 为什么 B.Amazon DynamoDB 对**：DynamoDB 是托管 NoSQL 键值数据库，无需管理底层硬件与数据库软件，自动扩缩吞吐，上传数据即可使用，满足「快速部署非关系型数据库+不想管硬件软件」双诉求。\n\n**❌ 为什么其他选项错**：\n- A. Amazon RDS：托管关系型数据库，是 SQL 不是 NoSQL\n- C. Amazon Aurora：关系型数据库引擎，非 NoSQL\n- D. Amazon Redshift：数据仓库，面向分析\n\n**📌 关键概念**：非关系型+免运维 → DynamoDB；关系型托管 → RDS/Aurora；「NoSQL+不想管理」直接锁定 DynamoDB，考点在于数据库类型判断。NoSQL 场景常见于会话、购物车、用户画像，建模以主键查询为主，与 SQL 联合查询场景互补。","s":"源#182"},{"id":"D3-183","d":3,"t":"multiple","q":"一个公司采取了哪些行动来优化其 AWS 资源以控制云成本？（选择两个。）","o":[{"l":"A","t":"从 Amazon RDS 切换到 Amazon DynamoDB 以适应 NoSQL 数据集。"},{"l":"B","t":"基于过去的使用模式选择 Amazon EC2 实例类型。"},{"l":"C","t":"使用 Amazon S3 生命周期策略将用户不频繁访问的对象移动到成本较低的存储层。"},{"l":"D","t":"对 Amazon RDS 使用多 AZ 部署。"},{"l":"E","t":"用 AWS Elastic Beanstalk 替换现有的 Amazon EC2 实例。"}],"a":["B","C"],"e":"**✅ 为什么 B、C 对**：\n- B. 基于过去使用模式选择 EC2 实例类型：right-sizing 实例规格，避免过度配置\n- C. 使用 S3 生命周期策略迁移不常访问对象：自动转存储层节省成本\n\n**❌ 为什么其他选项错**：\n- A. RDS 换 DynamoDB：更换数据库类型是架构变更，非成本优化行动\n- D. 对 RDS 使用多 AZ：高可用设计，增加成本而非节省\n- E. 用 Beanstalk 替换 EC2：部署方式变更，非直接成本优化\n\n**📌 关键概念**：成本优化两手=选对规格（Compute Optimizer/实例类型）+生命周期分层（S3 Lifecycle）；「过去使用模式+低成本层」两个关键词即 B/C；多 AZ 属高可用投入，与成本控制方向相反。","s":"源#183"},{"id":"D3-188","d":3,"t":"single","q":"一家公司正在构建一个应用程序，该应用程序需要能够在应用程序组件之间发送、存储和接收消息。公司还有另一个要求，即以先进先出（FIFO）的顺序处理消息。公司应该使用哪种 AWS 服务？","o":[{"l":"A","t":"AWS Step Functions"},{"l":"B","t":"Amazon SNS（Amazon SNS）"},{"l":"C","t":"Amazon Kinesis 数据流"},{"l":"D","t":"Amazon SQS（Amazon SQS）"}],"a":["D"],"e":"**✅ 为什么 D.Amazon SQS（Amazon SQS） 对**：SQS 是消息队列服务，标准队列外还提供 FIFO 队列，FIFO 保证消息先进先出且恰好投递一次，满足「组件间发送/存储/接收消息+FIFO 顺序」双重需求。\n\n**❌ 为什么其他选项错**：\n- A. AWS Step Functions：工作流编排，不是消息队列\n- B. Amazon SNS：发布/订阅通知，不保证 FIFO 存储\n- C. Amazon Kinesis 数据流：流式数据处理，非队列 FIFO 语义\n\n**📌 关键概念**：消息队列 → SQS（标准/FIFO）；发布订阅 → SNS；「FIFO」出现即 SQS FIFO 队列；SNS 是推模式不存储、SQS 是拉模式可存储，按顺序要求区分。FIFO 队列吞吐低于标准队列，只在顺序敏感场景（订单/账务）启用，普通解耦用标准队列即可。","s":"源#188"},{"id":"D3-190","d":3,"t":"multiple","q":"一家公司想要将其数据库迁移到一个与 PostgreSQL 兼容的托管 AWS 服务。哪些AWS 服务将满足这些要求？（选择两个。）","o":[{"l":"A","t":"Amazon Athena"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"Amazon EC2"},{"l":"D","t":"Amazon DynamoDB"},{"l":"E","t":"Amazon Aurora"}],"a":["B","E"],"e":"**✅ 为什么 B、E 对**：RDS 支持 PostgreSQL 引擎的托管数据库，Aurora 是 PostgreSQL 兼容的托管数据库，两者都满足「与 PostgreSQL 兼容的托管 AWS 服务」要求。\n- B. Amazon RDS：支持 PostgreSQL 引擎的托管数据库\n- E. Amazon Aurora：PostgreSQL 兼容的托管数据库（Aurora PostgreSQL）\n\n**❌ 为什么其他选项错**：\n- A. Amazon Athena：S3 查询服务，不是数据库\n- C. Amazon EC2：自管虚拟机，非托管数据库服务\n- D. Amazon DynamoDB：NoSQL，不兼容 PostgreSQL\n\n**📌 关键概念**：PostgreSQL 兼容托管数据库=RDS（标准引擎）+Aurora（自研高性能版）；EC2 自装 PG 不属托管、DynamoDB 为 NoSQL、Athena 为查询服务，均在「兼容+托管」双标签下排除。RDS 与 Aurora 的 PG 兼容是两档选择：常规负载用 RDS，高并发/大存储升 Aurora，均免 OS 运维。","s":"源#190"},{"id":"D3-191","d":3,"t":"single","q":"一家公司有一支货船队。货船上装有在海上收集数据的传感器，海上可能存在间歇性或没有互联网连接的情况。公司需要在海上收集、格式化和处理数据，然后将数据稍后转移到 AWS。为了满足这些要求，公司应该使用哪种 AWS 服务？","o":[{"l":"A","t":"AWS IoT Core"},{"l":"B","t":"Amazon Lightsail"},{"l":"C","t":"AWS Storage Gateway"},{"l":"D","t":"AWS Snowball Edge"}],"a":["D"],"e":"**✅ 为什么 D.AWS Snowball Edge 对**：Snowball Edge 是自带存储与计算能力的边缘设备，可在无互联网的船只上采集、格式化、处理数据，再整机运回 AWS 上传，符合「海上无网+就地处理+延迟传输」场景。\n\n**❌ 为什么其他选项错**：\n- A. AWS IoT Core：需要网络接入云端，离线场景不适用\n- B. Amazon Lightsail：云上虚拟服务器，无法部署在船上\n- C. AWS Storage Gateway：需本地与云间网络，离线不适用\n\n**📌 关键概念**：离线/弱网+就地处理+海量数据 → Snowball Edge；在线传输 → DataSync；IoT 设备管理 → IoT Core；「间歇或没有互联网」是 Snow 家族固定题眼，边缘计算需求由 Snowball Edge 的 EC2 兼容能力支撑。","s":"源#191"},{"id":"D3-194","d":3,"t":"single","q":"一家公司需要一个内容分发网络，提供安全的数据、视频、应用程序和 API 的全球交付，具有低延迟和高传输速度。哪种 AWS 服务满足这些要求？","o":[{"l":"A","t":"Amazon CloudFront"},{"l":"B","t":"弹性负载均衡"},{"l":"C","t":"Amazon S3"},{"l":"D","t":"Amazon Elastic Transcoder"}],"a":["A"],"e":"**✅ 为什么 A.Amazon CloudFront 对**：CloudFront 是 CDN 服务，通过全球边缘节点缓存并加速数据、视频、应用与 API 的交付，支持 HTTPS 安全传输，与「低延迟高速度全球交付」题干逐字对应。\n\n**❌ 为什么其他选项错**：\n- B. 弹性负载均衡：流量分发，不缓存内容\n- C. Amazon S3：对象存储，不提供全球边缘加速\n- D. Amazon Elastic Transcoder：媒体转码服务，与内容分发无关\n\n**📌 关键概念**：CDN 全球交付低延迟 → CloudFront；负载均衡 → ELB；存储 → S3；「内容分发网络」出现即 CloudFront，边缘缓存+安全交付是核心能力，与 S3 源站配合使用。CloudFront 与 S3 源站组合是静态网站加速标准架构，回源可配 OAC 保持桶私有。","s":"源#194"},{"id":"D3-196","d":3,"t":"single","q":"一家公司需要完全托管、高可靠性和可扩展的文件存储，可通过服务器消息块（SMB）协议访问。哪种 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"Amazon Elastic File System（Amazon EFS）"},{"l":"C","t":"Amazon FSx for Windows File Server"},{"l":"D","t":"Amazon Elastic Block Store（Amazon EBS）"}],"a":["C"],"e":"**✅ 为什么 C.Amazon FSx for Windows File Server 对**：FSx for Windows File Server 提供全托管 Windows 文件系统，原生支持 SMB 协议并与 AD 集成，满足「SMB 协议+完全托管+高可靠文件存储」三要素。\n\n**❌ 为什么其他选项错**：\n- A. Amazon S3：对象存储，非 SMB 文件协议\n- B. Amazon EFS：NFS 协议文件系统，不是 SMB\n- D. Amazon EBS：块存储，非文件共享协议\n\n**📌 关键概念**：SMB（Windows 文件共享）→ FSx for Windows；NFS（Linux 共享）→ EFS；「SMB」出现即 FSx for Windows File Server，与 EFS（NFS）形成协议二选一分流。EFS 与 FSx Windows 的场景边界按「Linux vs Windows」划分，混合环境可并存互不冲突。Windows 应用（SQL Server/.NET）的文件后端首选 FSx Windows，避免自行搭建 AD 与 SMB 服务。此外 FSx Windows 支持每日自动备份到 S3 与静态加密，合规与容灾开箱即用，管理负担远低于自建 Windows 文件集群。协议判读先看「SMB vs NFS」：SMB 是 Windows 共享、NFS 是 Linux 共享，题干给 SMB 就直接排除 EFS 与 EBS。","s":"源#196"},{"id":"D3-199","d":3,"t":"single","q":"一家公司在私有子网中有 Amazon EC2 实例。公司想要启动连接到互联网以获取操作系统更新，同时阻止来自互联网的流量访问 EC2 实例。哪种 AWS 托管服务允许这样做？","o":[{"l":"A","t":"VPC 端点"},{"l":"B","t":"NAT 网关"},{"l":"C","t":"Amazon PrivateLink"},{"l":"D","t":"VPC 对等连接"}],"a":["B"],"e":"**✅ 为什么 B.NAT 网关 对**：NAT 网关部署在公有子网，让私有子网实例主动发起互联网访问（出站），同时外部无法主动访问这些实例（无入站），实现「获取系统更新+阻挡入站」的单向访问。\n\n**❌ 为什么其他选项错**：\n- A. VPC 端点：私密访问 AWS 服务，不提供互联网出口\n- C. Amazon PrivateLink：VPC 间私密连接，非互联网访问\n- D. VPC 对等连接：VPC 互联，与互联网无关\n\n**📌 关键概念**：私有子网出站访问互联网 → NAT 网关/实例（单向出站）；入站公网访问 → IGW+公有子网；「出站可+入站不可」的双向描述即 NAT 网关，与 IGW 的区别在于方向性。","s":"源#199"},{"id":"D3-201","d":3,"t":"single","q":"一家公司正在 AWS 云中存储不常访问的数据。如果公司需要访问数据，则需要在12 小时内检索数据。公司希望解决方案对于每吉字节的存储成本具有成本效益。哪种 Amazon S3 存储类别将满足这些要求？","o":[{"l":"A","t":"S3 标准"},{"l":"B","t":"S3 Glacier Flexible Retrieval"},{"l":"C","t":"S3 One Zone-Infrequent Access（S3 One Zone-IA）"},{"l":"D","t":"S3 Standard-Infrequent Access（S3 Standard-IA）"}],"a":["B"],"e":"**✅ 为什么 B.S3 Glacier Flexible Retrieval 对**：Glacier Flexible Retrieval 适合不常访问的长期归档数据，存储单价远低于标准/IA 层，检索在几分钟到 12 小时内完成，满足「12 小时内检索+每 GB 成本效益」双要求。\n\n**❌ 为什么其他选项错**：\n- A. S3 标准：存储成本高，不适合归档\n- C. S3 One Zone-IA：低频但数据仅在单可用区，且检索仍非归档级低价\n- D. S3 Standard-IA：低频存储成本高于 Glacier\n\n**📌 关键概念**：S3 存储层级=Standard（热）→IA（低频）→Glacier（归档）→Deep Archive；「12 小时内检索+不常访问+低成本」→ Glacier Flexible Retrieval（分钟级~12h）；「小时级检索」是 Glacier Flexible 与 Deep Archive（12-48h）的区分点。S3 存储类选型口诀：热数据 Standard、低频 IA、归档 Glacier、深度归档 Deep Archive。","s":"源#201"},{"id":"D3-205","d":3,"t":"single","q":"一家公司计划将数据备份移动到 AWS 云。公司需要用具有本地缓存的基于云的存储替换本地存储。哪种 AWS 服务满足这些要求？","o":[{"l":"A","t":"AWS 存储网关"},{"l":"B","t":"AWS Snowcone"},{"l":"C","t":"AWS 备份"},{"l":"D","t":"Amazon EFS（Amazon EFS）"}],"a":["A"],"e":"**✅ 为什么 A.AWS 存储网关 对**：Storage Gateway 在本地部署网关（虚拟机/硬件），提供本地缓存并将数据后端落到 S3 等云存储，「基于云的存储+本地缓存」正是其混合存储定位。\n\n**❌ 为什么其他选项错**：\n- B. AWS Snowcone：一次性离线搬迁设备，非持续存储服务\n- C. AWS Backup：备份编排服务，不提供本地缓存\n- D. Amazon EFS：云内 NFS 文件系统，无本地缓存层\n\n**📌 关键概念**：本地缓存+云端后端 → Storage Gateway；离线搬迁 → Snow 家族；备份编排 → AWS Backup；「本地缓存」字眼是 Storage Gateway 独有特征，混合存储场景固定答案。三种网关配置各有定位：文件网关（NFS/SMB→S3）、卷网关（iSCSI 块）、磁带网关（VTL→Glacier）。","s":"源#205"},{"id":"D3-207","d":3,"t":"single","q":"一家公司需要在 AWS 上计划、安排和运行数十万个计算作业。公司可以使用哪种AWS 服务来满足此要求？","o":[{"l":"A","t":"AWS Step Functions"},{"l":"B","t":"AWS 服务目录"},{"l":"C","t":"Amazon SQS（Amazon SQS）"},{"l":"D","t":"AWS Batch"}],"a":["D"],"e":"**✅ 为什么 D.AWS Batch 对**：AWS Batch 是托管批量计算服务，自动规划、调度并运行大规模并行作业（数十万级别），无需自建调度集群，「计划、安排和运行数十万计算作业」是其产品定位。\n\n**❌ 为什么其他选项错**：\n- A. AWS Step Functions：工作流编排，面向状态机而非批量作业\n- B. AWS 服务目录：目录与治理，与计算调度无关\n- C. Amazon SQS：消息队列，需自行写代码消费\n\n**📌 关键概念**：大规模批处理调度 → AWS Batch；工作流/状态机 → Step Functions；「数十万个作业+计划调度」是 Batch 的题眼；与 Lambda（15 分钟限制）相比适合长时批作业。","s":"源#207"},{"id":"D3-208","d":3,"t":"multiple","q":"哪些 AWS 服务或功能通过在不同的 AWS 区域之间启用故障转移来提供高可用性和低延迟？（选择两个。）","o":[{"l":"A","t":"Amazon Route 53（Amazon Route 53）"},{"l":"B","t":"网络负载均衡器（Network Load Balancer）"},{"l":"C","t":"Amazon S3 传输加速（Amazon S3 Transfer Acceleration）"},{"l":"D","t":"AWS 全球加速器（AWS Global Accelerator）"},{"l":"E","t":"应用程序负载均衡器（Application Load Balancer）"}],"a":["A","D"],"e":"**✅ 为什么 A、D 对**：Route 53 通过 DNS 层路由与健康检查实现跨区域故障转移；Global Accelerator 提供静态任播 IP，基于 AWS 骨干网将用户流量导向最近健康区域端点。\n- A. Amazon Route 53：DNS 服务，支持延迟路由、故障转移路由等策略，健康检查失败自动切换到另一区域的健康端点\n- D. AWS 全球加速器（AWS Global Accelerator）：提供静态任播 IP，基于 AWS 骨干网将用户流量导向最近的健康区域端点，端点故障自动重定向\n\n**❌ 为什么其他选项错**：\n- B. Network Load Balancer：单区域内负载均衡（跨 AZ），不跨区域\n- C. S3 Transfer Acceleration：加速对象上传，非通用应用流量故障转移\n- E. Application Load Balancer：区域内七层负载均衡，不跨区域\n\n**📌 关键概念**：跨区域故障转移两件套=Route 53（DNS 层路由+健康检查）+Global Accelerator（网络层任播 IP）；NLB/ALB 只管区内或跨 AZ，不跨区域；「不同区域之间故障转移」即锁 R53+GA。","s":"源#208"},{"id":"D3-209","d":3,"t":"single","q":"以下哪种方式是使用 Amazon EC2 自动扩展组在 AWS 云中扩展容量的方法？","o":[{"l":"A","t":"根据需求自动扩展或缩小 EC2 实例的数量。"},{"l":"B","t":"使用无服务器 EC2 实例。"},{"l":"C","t":"根据需求自动扩展或缩小 EC2 实例的大小。"},{"l":"D","t":"在 EC2 实例之间转移未使用的 CPU 资源。"}],"a":["A"],"e":"**✅ 为什么 A.根据需求自动扩展或缩小 EC2 实例的数量。 对**：Auto Scaling 组按策略自动增减 EC2 实例数量（横向扩展），基于需求指标（CPU/负载）触发扩容或缩容，是 AWS 云中扩容的标准方式，与「改实例大小」的纵向调整不同。\n\n**❌ 为什么其他选项错**：\n- B. 无服务器 EC2 实例：EC2 是虚拟机不存在无服务器形态（那是 Lambda/Fargate）\n- C. 自动调整实例大小：Auto Scaling 管数量，不改实例规格\n- D. 转移未使用 CPU 资源：CPU 不能在实例间转移\n\n**📌 关键概念**：ASG 扩容=横向（增减实例数），非纵向（改大小）；「自动扩展组」管实例数量；纵向变规格叫 resize、由人触发；区分横向/纵向伸缩是本题考点。","s":"源#209"},{"id":"D3-215","d":3,"t":"single","q":"一家公司必须能够快速地在 AWS 云中开发、测试和发布应用程序。哪种云计算的优势能满足这些要求？","o":[{"l":"A","t":"停止猜测容量"},{"l":"B","t":"将固定费用转换为变动费用"},{"l":"C","t":"实现规模经济"},{"l":"D","t":"提高速度和灵活性"}],"a":["D"],"e":"**✅ 为什么 D.提高速度和灵活性 对**：云计算优势中「速度与敏捷性」指资源分钟级获取、开发测试环境快速搭建，使应用能快速开发、测试、上线，「快速开发、测试、发布」正对应敏捷优势。\n\n**❌ 为什么其他选项错**：\n- A. 停止猜测容量：指弹性按需分配，不是交付速度\n- B. 固定费用转变动费用：成本模式优势，与交付速度无关\n- C. 实现规模经济：成本优势，不描述交付速度\n\n**📌 关键概念**：云优势对号入座=快速交付/试验 → 敏捷性；按需分配 → 弹性；费用模式 → CapEx→OpEx；「快速开发、测试、发布」锁定敏捷性/速度与灵活性。","s":"源#215"},{"id":"D3-227","d":3,"t":"single","q":"一家公司需要将 PostgreSQL 数据库从本地迁移到 Amazon RDS。公司应该使用哪家AWS 服务或工具来满足此要求？","o":[{"l":"A","t":"云采用准备工具"},{"l":"B","t":"AWS 迁移中心"},{"l":"C","t":"AWS 数据库迁移服务（AWS DMS）"},{"l":"D","t":"AWS 应用程序迁移服务"}],"a":["C"],"e":"**✅ 为什么 C.AWS 数据库迁移服务（AWS DMS） 对**：DMS 是托管数据库迁移服务，支持 PostgreSQL 源到 Amazon RDS 的同构迁移，最小化停机时间，「本地 PG 迁移到 RDS」正是其经典场景。\n\n**❌ 为什么其他选项错**：\n- A. 云采用准备工具：评估上云准备度，不执行迁移\n- B. AWS 迁移中心：迁移进度追踪面板，不执行数据搬迁\n- D. AWS 应用程序迁移服务：整机应用迁移（MGN），面向服务器而非数据库\n\n**📌 关键概念**：数据库迁移 → DMS；服务器/应用整机迁移 → Application Migration Service (MGN)；迁移进度统一视图 → Migration Hub；「数据库+本地到云」即 DMS。","s":"源#227"},{"id":"D3-228","d":3,"t":"single","q":"使用 AWS Compute Optimizer 演示了哪种云计算概念？","o":[{"l":"A","t":"安全验证"},{"l":"B","t":"正确规模"},{"l":"C","t":"弹性"},{"l":"D","t":"全球覆盖"}],"a":["B"],"e":"**✅ 为什么 B.正确规模 对**：Compute Optimizer 通过分析实例利用率指标（CPU/内存）推荐最合适的实例类型与大小，避免过度配置浪费，这正是 right-sizing（正确规模）概念的自动化体现。\n\n**❌ 为什么其他选项错**：\n- A. 安全验证：与实例规格推荐无关\n- C. 弹性：自动伸缩容量，与规格推荐不同\n- D. 全球覆盖：地域覆盖，与成本优化无关\n\n**📌 关键概念**：Compute Optimizer=right-sizing 推荐工具；「过去利用率+推荐规格」是 right-sizing 题眼；与 Cost Explorer（成本分析）、Auto Scaling（弹性）职能区分。除 Compute Optimizer 外，Cost Explorer 的利用率报告与 right-sizing 建议同属成本优化工具箱。","s":"源#228"},{"id":"D3-233","d":3,"t":"single","q":"一家公司计划在 AWS 上托管其工作负载。哪家 AWS 服务要求公司更新和修补客户操作系统？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon S3"},{"l":"C","t":"Amazon EC2"},{"l":"D","t":"Amazon Aurora"}],"a":["C"],"e":"**✅ 为什么 C.Amazon EC2 对**：EC2 提供裸虚拟机，客户操作系统（来宾 OS）完全由客户控制，其补丁与更新责任在客户侧，是共享责任模型中「云中安全」的典型代表。\n\n**❌ 为什么其他选项错**：\n- A. Amazon DynamoDB：NoSQL 托管服务，OS 由 AWS 管\n- B. Amazon S3：对象存储，无客户 OS 概念\n- D. Amazon Aurora：托管数据库，OS 由 AWS 管\n\n**📌 关键概念**：需要客户打 OS 补丁的=EC2 类 IaaS；托管服务（DynamoDB/S3/Aurora）的 OS 归 AWS；「更新修补客户操作系统」出现即选 EC2，是共享责任模型固定考点。共享责任模型按服务类型分层：IaaS 客户管 OS 及以上，PaaS/SaaS 客户只管数据与配置。","s":"源#233"},{"id":"D3-235","d":3,"t":"single","q":"一家公司正在将其工作负载迁移到 AWS 云。公司必须保留对其应用程序所托管的客操作系统的补丁管理的完全控制权。公司应该使用哪家 AWS 服务来满足这些要求？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon EC2"},{"l":"C","t":"AWS Lambda"},{"l":"D","t":"Amazon RDS"}],"a":["B"],"e":"**✅ 为什么 B.Amazon EC2 对**：EC2 上运行的工作负载由客户全权管理客户 OS，包括补丁管理，需要完全控制权时选 EC2 自管模式，与 Lambda/RDS 等托管服务形成对照。\n\n**❌ 为什么其他选项错**：\n- A. Amazon DynamoDB：NoSQL 托管，无 OS 控制权\n- C. AWS Lambda：无服务器，OS 不可见不可控\n- D. Amazon RDS：托管数据库，OS 归 AWS 管\n\n**📌 关键概念**：「对客户 OS 完全控制」=EC2（IaaS）；托管服务操作系统不可见；共享责任模型中 EC2 的 OS 层归客户，IaaS 与 PaaS/SaaS 的控制权差异是本题核心。控制权与运维量成正比：EC2 全控全管，Lambda 无 OS 概念，RDS 管 DB 不管 OS。考试中「保留对客户 OS 的完全控制权」几乎总是 EC2 的同义词，可直接锁定。","s":"源#235"},{"id":"D3-240","d":3,"t":"single","q":"一家公司想要将其 PostgreSQL 数据库迁移到 AWS。公司不经常使用数据库。哪种AWS 服务或资源将满足这些要求，并具有最小的管理开销？","o":[{"l":"A","t":"Amazon EC2 上的 PostgreSQL"},{"l":"B","t":"Amazon RDS for PostgreSQL"},{"l":"C","t":"Amazon Aurora PostgreSQL 兼容版"},{"l":"D","t":"Amazon Aurora Serverless"}],"a":["D"],"e":"**✅ 为什么 D.Amazon Aurora Serverless 对**：Aurora Serverless 按需自动启停与扩展数据库容量，不用时缩容到零，按秒计费，完美匹配「不经常使用+最小管理开销」的低频数据库场景。\n\n**❌ 为什么其他选项错**：\n- A. EC2 上的 PostgreSQL：需自管 OS、补丁与实例，运维开销最大\n- B. RDS for PostgreSQL：需选择实例规格并持续运行\n- C. Aurora PostgreSQL 兼容版：仍需指定实例大小，非按需启停\n\n**📌 关键概念**：低频使用+免运维 → Aurora Serverless（ACU 按需扩展到零）；持续负载 → RDS/Aurora 常规版；「不经常使用+最小管理开销」是 Serverless 数据库的固定题眼。Aurora Serverless 以 ACU 为计费单位，自动启停适合开发测试、间歇报表等低频负载。","s":"源#240"},{"id":"D3-242","d":3,"t":"single","q":"一家公司想要为其客户创建一个全球可访问的电子商务平台。公司想要使用一个高度可用且可扩展的DNS 网络服务，将用户连接到平台。哪个 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon EC2"},{"l":"B","t":"Amazon VPC"},{"l":"C","t":"Amazon Route 53"},{"l":"D","t":"Amazon RDS"}],"a":["C"],"e":"**✅ 为什么 C.Amazon Route 53 对**：Route 53 是托管 DNS 服务，高度可用且可扩展，支持基于延迟/地理位置的路由策略将全球用户引导到最近端点，满足全球电商平台访问需求。\n\n**❌ 为什么其他选项错**：\n- A. Amazon EC2：计算服务，不是 DNS\n- B. Amazon VPC：逻辑网络，不解析域名\n- D. Amazon RDS：数据库服务\n\n**📌 关键概念**：DNS 解析+全球路由 → Route 53；「高度可用且可扩展的 DNS」字眼即 Route 53；域名解析与流量路由（延迟/地理/故障转移策略）是其核心能力。Route 53 100% 可用性 SLA，支持延迟/加权/故障转移/地理位置等多策略路由。","s":"源#242"},{"id":"D3-243","d":3,"t":"single","q":"根据 AWS 共享责任模型，哪项维护任务是客户的责任？","o":[{"l":"A","t":"可用区之间的物理连接"},{"l":"B","t":"网络交换机维护"},{"l":"C","t":"硬件更新和固件补丁"},{"l":"D","t":"Amazon EC2 更新和安全补丁"}],"a":["D"],"e":"**✅ 为什么 D.Amazon EC2 更新和安全补丁 对**：共享责任模型中 EC2 实例的客户操作系统更新与安全补丁由客户负责，AWS 只管物理与虚拟化层，「客户责任」在 EC2 上就是 OS 及以上。\n\n**❌ 为什么其他选项错**：\n- A. 可用区之间的物理连接：AWS 责任\n- B. 网络交换机维护：AWS 责任\n- C. 硬件更新和固件补丁：AWS 财务与运维责任\n\n**📌 关键概念**：客户责任=EC2 客户 OS 更新/补丁+安全组+数据；物理连接/交换机/固件全归 AWS；「谁打补丁」类题先分 IaaS/托管服务，EC2 是客户责任边界题。","s":"源#243"},{"id":"D3-246","d":3,"t":"single","q":"一家公司拥有 AWS 企业支持，在 2 个月后将发布一个受欢迎的产品的新版本。公司预计其网站的流量将大幅增加。该网站托管在 Amazon EC2 实例上。公司应该采取什么行动来评估其为此次发布扩展的准备情况？","o":[{"l":"A","t":"用 AWS Lambda 函数替换 EC2 实例。"},{"l":"B","t":"使用 AWS 基础设施事件管理（IEM）支持。"},{"l":"C","t":"在 AWS 市场上提交一个请求来监控事件。"},{"l":"D","t":"查看 AWS 成本管理控制台中的覆盖报告。"}],"a":["B"],"e":"**✅ 为什么 B.使用 AWS 基础设施事件管理（IEM）支持。 对**：IEM 是企业支持专属服务，在大版本发布、大促等预期流量高峰前提供专家协作评估扩容准备、制定保障方案，正是「评估扩展准备情况」的支持资源。\n\n**❌ 为什么其他选项错**：\n- A. 用 Lambda 替换 EC2：架构改造，不评估扩容准备\n- C. 在 AWS 市场提交请求监控事件：市场是软件目录，无此功能\n- D. 查看成本管理控制台覆盖报告：覆盖率是 Savings Plan 视角，与扩容无关\n\n**📌 关键概念**：预期高峰保障 → IEM（Infrastructure Event Management，企业支持专属）；「评估扩容准备+即将到来的事件」即 IEM；与 TAM（日常技术经理）区分，IEM 面向具体事件保障。","s":"源#246"},{"id":"D3-248","d":3,"t":"single","q":"一家公司想要一个时间序列数据库服务，使其更容易存储和分析每天数万亿的事件。哪个AWS 服务将满足此要求？","o":[{"l":"A","t":"Amazon Neptune"},{"l":"B","t":"Amazon Timestream"},{"l":"C","t":"Amazon Forecast"},{"l":"D","t":"与 MongoDB 兼容的 Amazon DocumentDB"}],"a":["B"],"e":"**✅ 为什么 B.Amazon Timestream 对**：Timestream 是托管时间序列数据库，专为每天数万亿事件级别设计，自动管理时间分区与保留策略，是 IoT/运维事件存储分析的标准选择。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Neptune：图数据库，非时间序列\n- C. Amazon Forecast：时序预测 ML 服务，非数据库\n- D. Amazon DocumentDB：文档数据库（MongoDB 兼容），非时序\n\n**📌 关键概念**：时间序列数据库 → Timestream；图 → Neptune；文档 → DocumentDB；预测 → Forecast（ML 非存储）；「每天数万亿事件+时间序列」锁定 Timestream。时序数据典型来源：IoT 传感器、应用指标、点击流，按时间分区存取是时序库核心机制。","s":"源#248"},{"id":"D3-251","d":3,"t":"single","q":"一家公司想要在 Amazon S3 中存储数据。公司很少访问数据，如果必要，数据可以重新生成。公司想要以最具成本效益的方式存储数据。哪种 S3 存储类别将满足此要求？","o":[{"l":"A","t":"S3 标准"},{"l":"B","t":"S3 智能分层"},{"l":"C","t":"S3 标准不频繁访问（S3 标准 IA）"},{"l":"D","t":"S3 单区不频繁访问（S3 单区 IA）"}],"a":["D"],"e":"**✅ 为什么 D.S3 单区不频繁访问（S3 One Zone-IA） 对**：One Zone-IA 存储成本低于 Standard-IA（仅单可用区冗余），适合「很少访问+可重新生成」的非关键数据，是低访问频率下最省钱的选项。\n\n**❌ 为什么其他选项错**：\n- A. S3 标准：访问热数据定价，成本最高\n- B. S3 智能分层：适合未知访问模式，非最便宜选项\n- C. S3 Standard-IA：比单区 IA 贵（多 AZ 冗余）\n\n**📌 关键概念**：很少访问+可重建+最便宜 → One Zone-IA；访问模式未知 → Intelligent-Tiering；可承受丢失的风险换低价是 One Zone 与 Standard-IA 的差异点；S3 层级按「访问频率+冗余要求」选。层级选择先看两个问题：多久访问一次（频率）+丢了能不能重建（冗余要求）。","s":"源#251"},{"id":"D3-253","d":3,"t":"single","q":"一家公司想要使用 Typescript、Python、Java 和.NET 等常用编程语言来配置和管理其AWS 基础设施。哪家 AWS 服务将满足此要求？","o":[{"l":"A","t":"AWS CodeBuild"},{"l":"B","t":"AWS CloudFormation"},{"l":"C","t":"AWS CLI"},{"l":"D","t":"AWS 云开发工具包（AWS CDK）"}],"a":["D"],"e":"**✅ 为什么 D.AWS 云开发工具包（AWS CDK） 对**：CDK 是软件开发框架，用 TypeScript/Python/Java/.NET 等语言定义云基础设施，合成 CloudFormation 模板部署，「编程语言+IaC」正是其定位。\n\n**❌ 为什么其他选项错**：\n- A. AWS CodeBuild：编译构建服务，不是 IaC 工具\n- B. AWS CloudFormation：模板文件（YAML/JSON）声明式定义，不是编程语言\n- C. AWS CLI：命令行工具，无开发框架概念\n\n**📌 关键概念**：编程语言写基础设施 → CDK；模板文件 → CloudFormation（CDK 底层合成 CFN）；CDK 与 CFN 是「代码 vs 声明」之别；「TypeScript/Python/Java/.NET」字眼即 CDK。CDK 高阶组件（Constructs）封装最佳实践，比手写 CFN 模板更简洁，且可版本化管理。CDK 合成的 CloudFormation 模板可审计可回滚，兼顾开发效率与部署合规。","s":"源#253"},{"id":"D3-254","d":3,"t":"single","q":"哪种 Amazon EC2 定价模型为始终运行、正确大小的数据库服务器提供一年项目中最大的成本节省？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"可转换预留实例"},{"l":"C","t":"现货实例"},{"l":"D","t":"标准预留实例"}],"a":["D"],"e":"**✅ 为什么 D.标准预留实例 对**：数据库服务器全年无休运行，标准 RI 承诺 1 年或 3 年固定规格，提供最高约 72% 折扣（高于可转换 RI），对「始终运行+一年期」稳定负载节省最大。\n\n**❌ 为什么其他选项错**：\n- A. 按需实例：无任何折扣\n- B. 可转换预留实例：可换规格但折扣低于标准 RI\n- C. 现货实例：可能被回收，不适合必须始终在线的数据库\n\n**📌 关键概念**：始终运行+长周期+最大折扣 → 标准 RI（或 Savings Plans）；可换规格选可转换 RI（折扣略低）；可中断负载选 Spot；RI 三型=标准/可转换/计划型，折扣与灵活性成反比。","s":"源#254"},{"id":"D3-255","d":3,"t":"single","q":"一家公司有一个物理磁带库来存储数据备份。磁带库的存储空间不足。公司需要将磁带库的容量扩展到 AWS 云中。公司应该使用哪家 AWS 服务来满足此要求？","o":[{"l":"A","t":"Amazon Elastic File System（Amazon EFS）"},{"l":"B","t":"Amazon Elastic Block Store（Amazon EBS）"},{"l":"C","t":"Amazon S3"},{"l":"D","t":"AWS Storage Gateway"}],"a":["D"],"e":"**✅ 为什么 D.AWS Storage Gateway 对**：Storage Gateway 的磁带网关（Tape Gateway）以虚拟磁带库形式对接现有备份软件，将磁带备份无缝扩展到 S3 Glacier，无需更改流程即可扩容磁带库。\n\n**❌ 为什么其他选项错**：\n- A. Amazon EFS：NFS 文件系统，无磁带接口\n- B. Amazon EBS：块存储，非磁带场景\n- C. Amazon S3：对象存储本身，无本地磁带模拟\n\n**📌 关键概念**：磁带库扩展 → Storage Gateway 磁带网关（VTL 模拟+S3/Glacier 后端）；文件场景 → 文件网关；卷场景 → 卷网关；「磁带」字眼即磁带网关，混合存储三模式按协议分。磁带网关兼容主流备份软件（Veeam/NetBackup 等），现有备份策略无需改动即上云。","s":"源#255"},{"id":"D3-262","d":3,"t":"single","q":"以下哪个是用于提取、转换和加载（ETL）数据的托管 AWS 服务？","o":[{"l":"A","t":"Amazon Athena"},{"l":"B","t":"AWS Glue"},{"l":"C","t":"Amazon S3"},{"l":"D","t":"AWS Snowball Edge"}],"a":["B"],"e":"**✅ 为什么 B.AWS Glue 对**：Glue 是完全托管的 ETL 服务，自动发现数据（爬网程序）、转换（Spark 作业）、加载到目标，是 AWS 官方 ETL 代表服务。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Athena：S3 查询服务，不做 ETL 管道\n- C. Amazon S3：对象存储，无转换能力\n- D. AWS Snowball Edge：离线数据传输设备\n\n**📌 关键概念**：ETL 托管 → Glue（爬网编目+Spark ETL）；查询 → Athena；「提取转换加载」字眼即 Glue；Glue 与 Athena 常配合（Glue 数据目录供 Athena 查询），但职能不同。Glue 爬网程序自动生成数据目录，EMR 偏重自定义大数据集群，两者在大数据栈分工不同。ETL 场景识别：题干出现「提取、转换、加载」「数据清洗」「批处理管道」即 Glue。","s":"源#262"},{"id":"D3-263","d":3,"t":"single","q":"一家公司想要将其在本地数据中心的 PB 级数据迁移到 AWS。公司不想使用互联网连接来执行迁移。哪个 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS DataSync"},{"l":"B","t":"Amazon Connect"},{"l":"C","t":"AWS Snowmobile"},{"l":"D","t":"AWS Direct Connect"}],"a":["C"],"e":"**✅ 为什么 C.AWS Snowmobile 对**：Snowmobile 是集装箱级数据迁移服务，单次可运 EB 级数据，完全不经互联网，PB 级+不走网的要求只能由物理运输满足。\n\n**❌ 为什么其他选项错**：\n- A. AWS DataSync：在线传输，依赖网络\n- B. Amazon Connect：呼叫中心服务，与迁移无关\n- D. AWS Direct Connect：专线网络连接，仍是网络传输\n\n**📌 关键概念**：PB 级+不用互联网 → Snowmobile（集装箱卡车）；10TB~PB 且少量网络 → Snowball；在线加速 → DataSync/直连；数据量与网络条件决定 Snow 家族选型。Snowmobile 有安保押运，适合数据中心整体搬迁；在线迁移适合持续更新的热数据。","s":"源#263"},{"id":"D3-269","d":3,"t":"single","q":"一家公司想要使用 Amazon EC2 实例为用户提供静态网站。公司需要为全球用户最小化延迟。哪种解决方案满足这些要求？","o":[{"l":"A","t":"在多个边缘位置使用 EC2 实例。"},{"l":"B","t":"在不同的 AWS 区域中使用同一可用区的 EC2 实例。"},{"l":"C","t":"使用 Amazon CloudFront，并将 EC2 实例配置为来源。"},{"l":"D","t":"在不同的 AWS 账户中使用同一可用区的 EC2 实例。"}],"a":["C"],"e":"**✅ 为什么 C.使用 Amazon CloudFront，并将 EC2 实例配置为来源。 对**：CloudFront 在全球边缘节点缓存 EC2 提供的静态内容，用户就近访问缓存副本，全球延迟最小化，EC2 作为源站承接回源请求。\n\n**❌ 为什么其他选项错**：\n- A. 在多个边缘位置使用 EC2 实例：EC2 无法部署到边缘位置（那是 Lambda@Edge/CloudFront Functions）\n- B. 不同区域使用同一可用区的 EC2：区域选择不影响全球加速本质\n- D. 不同账户使用 EC2：账户维度与延迟无关\n\n**📌 关键概念**：全球低延迟静态内容 → CloudFront CDN+源站（EC2/S3）；「边缘位置+缓存」是 CDN 固定模式；EC2 部署在区域/可用区，不部署边缘节点。","s":"源#269"},{"id":"D3-270","d":3,"t":"single","q":"一个研究团队将在世界各地的偏远地区收集数据。许多地点没有互联网连接。团队需要在现场捕获数据并稍后将其传输到 AWS 云。哪个 AWS 服务将支持这些要求？","o":[{"l":"A","t":"AWS Outposts"},{"l":"B","t":"AWS Transfer Family"},{"l":"C","t":"AWS Snow Family"},{"l":"D","t":"AWS Migration Hub"}],"a":["C"],"e":"**✅ 为什么 C.AWS Snow Family 对**：\n\n**❌ 为什么其他选项错**：\n- A. AWS Outposts：把 AWS 硬件放进本地机房，需持续连接云\n- B. AWS Transfer Family：SFTP 等托管文件传输，需网络\n- D. AWS Migration Hub：迁移进度追踪，不执行传输\n\n**📌 关键概念**：偏远无网+数据采集运输 → Snow Family；本地机房延伸 → Outposts；在线文件传输 → Transfer Family；「无互联网连接的偏远地区」是 Snow 家族固定题眼。Snowcone 是最小号（TB 级），可随身携带；Snowball Edge 支持边缘计算；Snowmobile 集装箱级。Snow 家族选型按数据量递进：8TB 内 Snowcone、数十 TB Snowball Edge、PB~EB 级 Snowmobile。Snowcone 机身小巧可邮寄往返，Snowball Edge 上可跑 EC2 实例就地预处理，Snowmobile 由卡车整体运输并配安保，三者按容量与算力需求分层选用。离线传输四件套按场景分：无网选 Snow 家族、有网选 Transfer Family、机房延伸选 Outposts、追踪进度选 Migration Hub。","s":"源#270"},{"id":"D3-274","d":3,"t":"single","q":"一家公司想要通过存档不再频繁访问最终用户的数据来节省成本。哪个 Amazon S3 功能将满足此要求？","o":[{"l":"A","t":"S3 版本控制"},{"l":"B","t":"S3 生命周期"},{"l":"C","t":"S3 对象锁定"},{"l":"D","t":"S3 清单"}],"a":["B"],"e":"**✅ 为什么 B.S3 生命周期 对**：S3 Lifecycle 策略按规则自动将对象从高成本层迁移到低成本层（如 Standard→Glacier）或到期删除，实现「自动归档省钱」，无需人工干预。\n\n**❌ 为什么其他选项错**：\n- A. S3 版本控制：管理对象版本，不迁移存储层\n- C. S3 对象锁定：合规保留（WORM），与成本无关\n- D. S3 清单：对象清单报告，不执行迁移\n\n**📌 关键概念**：自动分层归档省钱 → S3 Lifecycle（可配置前缀/标签规则）；版本 → Versioning；合规锁定 → Object Lock；清单 → Inventory；「自动移动到低成本层」即 Lifecycle。Lifecycle 规则可按前缀/标签过滤，常见策略：30 天转 IA、90 天转 Glacier、365 天过期删除。","s":"源#274"},{"id":"D3-276","d":3,"t":"single","q":"一家公司想要收集和处理 10TB 的数据，并在公司间歇性连接的情况下将数据传输到AWS。哪家AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS 数据库迁移服务（AWS DMS）"},{"l":"B","t":"AWS DataSync"},{"l":"C","t":"AWS 备份"},{"l":"D","t":"AWS Snowball Edge"}],"a":["D"],"e":"**✅ 为什么 D.AWS Snowball Edge 对**：Snowball Edge 适合 10TB 级数据+间歇性连接场景，设备支持本地处理（EC2/Lambda 兼容），再批量回传 AWS，比 DataSync 更抗弱网。\n\n**❌ 为什么其他选项错**：\n- A. AWS DMS：数据库迁移，非通用数据传输\n- B. AWS DataSync：在线传输工具，弱网下不可靠\n- C. AWS 备份：备份编排，不执行跨环境搬迁\n\n**📌 关键概念**：TB 级+弱网/间歇 → Snowball Edge；PB 级 → Snowmobile；稳定网络 → DataSync；「间歇性连接+10TB」组合锁定 Snowball Edge。Snowball Edge 三种形态：存储优化/计算优化/GPU 版，边缘场景选计算型。「间歇性连接/弱网」是 Snowball Edge 区别于 DataSync 的关键信号词。DataSync 适合稳定带宽下的在线批量同步，而 Snowball Edge 的设备化传输不受带宽波动影响，弱网环境下可靠性更高。选型锚点：数据量决定设备（10TB 级选 Snowball Edge、PB 级选 Snowmobile）、网络状况决定在线/离线方案（弱网选设备运输）。","s":"源#276"},{"id":"D3-278","d":3,"t":"single","q":"使用 AWS 无服务器计算的一个好处是什么？","o":[{"l":"A","t":"不需要应用程序部署和管理。"},{"l":"B","t":"应用程序安全将完全由 AWS 管理。"},{"l":"C","t":"不需要监控和日志记录。"},{"l":"D","t":"基础设施管理被卸载到 AWS。"}],"a":["D"],"e":"**✅ 为什么 D.基础设施管理被卸载到 AWS。 对**：无服务器计算（Lambda/Fargate）的核心优势是服务器与基础设施由 AWS 托管，客户专注代码与应用逻辑，「基础设施管理卸载」是对其价值最准确的描述。\n\n**❌ 为什么其他选项错**：\n- A. 不需要应用程序部署和管理：应用仍需客户部署管理\n- B. 应用程序安全完全由 AWS 管理：客户仍负责应用层安全\n- C. 不需要监控和日志记录：监控日志仍需要，只是工具托管\n\n**📌 关键概念**：无服务器=基础设施托管，非「什么都不管」；共享责任模型下应用与数据安全、部署、监控仍属客户；「卸载基础设施管理」是无服务器准确表述，警惕绝对化选项（完全/不需要）。","s":"源#278"},{"id":"D3-290","d":3,"t":"single","q":"一家公司计划运行一个使用图形处理单元（GPU）的计算密集型工作负载。公司应该使用哪种Amazon EC2 实例类型？","o":[{"l":"A","t":"加速计算"},{"l":"B","t":"计算优化"},{"l":"C","t":"存储优化"},{"l":"D","t":"通用"}],"a":["A"],"e":"**✅ 为什么 A.加速计算 对**：GPU 工作负载对应加速计算实例（P/G 系列等），配备硬件加速器（GPU/FPGA），专为图形渲染、ML 训练推理等计算密集任务设计。\n\n**❌ 为什么其他选项错**：\n- B. 计算优化：CPU 密集（C 系列），无 GPU\n- C. 存储优化：高磁盘 IO（D/I 系列），与图形计算无关\n- D. 通用：均衡配置（M 系列），无专用硬件加速\n\n**📌 关键概念**：GPU/FPGA → 加速计算（P/G）；高 CPU → 计算优化（C）；高 IO → 存储优化（D/I）；均衡 → 通用（M）；内存型（R/X）为第五类，按硬件特征对号入座。EC2 实例族速记：P=GPU 训练、G=GPU 图形、Inf=推理芯片、C=CPU 密集、M=通用、R=内存。","s":"源#290"},{"id":"D3-291","d":3,"t":"multiple","q":"以下哪些是 AWS 云中网络 ACLs 使用的特点？（选择两个）","o":[{"l":"A","t":"它们是无状态的。"},{"l":"B","t":"它们是有状态的。"},{"l":"C","t":"它们在允许流量之前评估所有规则。"},{"l":"D","t":"它们按顺序处理规则，从最低编号的规则开始，决定是否允许流量。"},{"l":"E","t":"它们在实例级别运行。"}],"a":["A","D"],"e":"**✅ 为什么 A、D 对**：\n- A. 它们是无状态的：网络 ACL 无连接状态跟踪，往返流量需双向规则放行\n- D. 它们按顺序处理规则，从最低编号的规则开始：规则按编号升序评估，命中即执行（允许/拒绝）\n\n**❌ 为什么其他选项错**：\n- B. 它们是有状态的：有状态的是安全组，NACL 无状态\n- C. 它们在允许流量之前评估所有规则：NACL 命中即停，不评估全部规则\n- E. 它们在实例级别运行：NACL 在子网级别运行，安全组才在实例级别\n\n**📌 关键概念**：NACL vs 安全组=NACL 无状态+子网级+按编号顺序+可显式拒绝；安全组有状态+实例级+全放行规则+默认拒绝；「无状态+顺序评估」是 NACL 两大特征，双向规则需成对配置。","s":"源#291"},{"id":"D3-293","d":3,"t":"single","q":"根据 AWS 共享责任模型，客户负责为以下哪项应用最新的安全更新和补丁？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon EC2 实例"},{"l":"C","t":"Amazon RDS 实例"},{"l":"D","t":"Amazon S3"}],"a":["B"],"e":"**✅ 为什么 B.Amazon EC2 实例 对**：共享责任模型中，EC2 实例的客户操作系统安全更新与补丁由客户负责（云中的安全），其余托管服务 OS 均由 AWS 维护。\n\n**❌ 为什么其他选项错**：\n- A. Amazon DynamoDB：托管 NoSQL，OS 归 AWS\n- C. Amazon RDS 实例：托管数据库，OS 归 AWS\n- D. Amazon S3：对象存储，无 OS 概念\n\n**📌 关键概念**：客户打补丁的服务=EC2 等自管服务；DynamoDB/RDS/S3 为托管服务，其 OS 层补丁归 AWS；「应用最新安全更新和补丁」题干出现即找 IaaS 类服务。「AWS 管云的安全，客户管云中的安全」是共享责任模型的标准总结句。托管服务（RDS/DynamoDB/S3）的补丁全归 AWS，考试见到这类选项直接排除客户责任。","s":"源#293"},{"id":"D3-294","d":3,"t":"single","q":"对于未知的访问模式，哪种 Amazon S3 存储类别最具成本效益？","o":[{"l":"A","t":"S3 标准"},{"l":"B","t":"S3 标准不频繁访问（S3 标准 IA）"},{"l":"C","t":"S3 单区不频繁访问（S3 单区 IA）"},{"l":"D","t":"S3 智能分层"}],"a":["D"],"e":"**✅ 为什么 D.S3 智能分层 对**：Intelligent-Tiering 自动监控访问模式，将对象在频繁/不频繁/归档层间自动迁移，无检索费用，为「未知访问模式」提供自动成本优化。\n\n**❌ 为什么其他选项错**：\n- A. S3 标准：持续热数据定价，未知模式下不经济\n- B. S3 Standard-IA：适合已知低频访问，未知模式不合适\n- C. S3 One Zone-IA：同样假设低频访问且单区冗余\n\n**📌 关键概念**：未知/不可预测访问模式 → Intelligent-Tiering（自动分层+无检索费）；已知低频 → Standard-IA；可重建+最省 → One Zone-IA；「自动层间迁移」是 IT 层独有能力。Intelligent-Tiering 有频繁/不频繁/归档即时访问三档，自动升降层无检索费。","s":"源#294"},{"id":"D3-299","d":3,"t":"single","q":"哪种 AWS 云优势使公司能够快速部署云资源，以在几分钟内访问计算、存储和数据库基础设施？","o":[{"l":"A","t":"弹性"},{"l":"B","t":"成本节约"},{"l":"C","t":"敏捷性"},{"l":"D","t":"可靠性"}],"a":["C"],"e":"**✅ 为什么 C.敏捷性 对**：敏捷性指快速获取与部署资源的能力，几分钟内得到计算、存储、数据库资源正是「按需自助服务+快速交付」的体现，题干时间描述指向敏捷。\n\n**❌ 为什么其他选项错**：\n- A. 弹性：按需扩缩容，关注容量匹配\n- B. 成本节约：省钱维度，与部署速度无关\n- D. 可靠性：稳定与容灾，与部署速度无关\n\n**📌 关键概念**：几分钟部署资源 → 敏捷性；按需扩缩 → 弹性；省钱 → 成本优化；不掉线 → 可靠性；题干时间词（几分钟/秒级）是敏捷性的固定信号。","s":"源#299"},{"id":"D3-302","d":3,"t":"single","q":"之前用于开发的 Amazon EC2 实例无法访问，并且在 AWS 管理控制台中不再出现。应该使用哪个AWS 服务来确定是什么操作使此 EC2 实例无法访问？","o":[{"l":"A","t":"Amazon CloudWatch 日志"},{"l":"B","t":"AWS Security Hub"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"AWS CloudTrail"}],"a":["D"],"e":"**✅ 为什么 D.AWS CloudTrail 对**：CloudTrail 记录账户 API 调用历史（谁在何时执行了什么操作），排查「什么操作导致 EC2 不可用」正是查操作审计日志的场景。\n\n**❌ 为什么其他选项错**：\n- A. Amazon CloudWatch 日志：应用与系统日志，不记录 API 调用方\n- B. AWS Security Hub：安全发现聚合，非操作审计\n- C. Amazon Inspector：漏洞扫描，与操作历史无关\n\n**📌 关键概念**：谁做了什么操作 → CloudTrail（API 审计）；应用日志 → CloudWatch Logs；安全状态 → Security Hub；「确定是什么操作」字眼即 CloudTrail。CloudTrail 默认保留 90 天，长期留存需投递 S3 或 CloudWatch Logs。排查资源变更类问题（谁删的/谁停的）先查 CloudTrail 事件历史，再按用户与时间过滤。操作溯源三查：CloudTrail 查谁做了什么（API 级）、CloudWatch 查运行日志、Config 查配置漂移，先分清再下手。","s":"源#302"},{"id":"D3-305","d":3,"t":"single","q":"一个开发团队想要快速、可重复地部署应用程序的多个测试环境。团队应该使用哪个AWS 服务？","o":[{"l":"A","t":"Amazon EC2"},{"l":"B","t":"AWS CloudFormation"},{"l":"C","t":"Amazon QuickSight"},{"l":"D","t":"Amazon Elastic Container Service（Amazon ECS）"}],"a":["B"],"e":"**✅ 为什么 B.AWS CloudFormation 对**：CloudFormation 用模板（JSON/YAML）声明式定义资源栈，一键部署可重复一致的环境，「快速+可重复部署多个测试环境」正是 IaC 价值。\n\n**❌ 为什么其他选项错**：\n- A. Amazon EC2：需逐台手工配置\n- C. Amazon QuickSight：BI 仪表板服务\n- D. Amazon ECS：容器编排，不编排全部基础设施\n\n**📌 关键概念**：可重复环境部署 → CloudFormation（模板+栈）；「快速+可重复」是 IaC 题眼；模板化环境（开发/测试/生产一致）是 CFN 的经典场景。CFN 栈可跨环境克隆，模板即文档，漂移检测功能可发现手工改动。「多个相同环境」「一键创建/删除」类需求是模板化 IaC 的固定场景。","s":"源#305"},{"id":"D3-308","d":3,"t":"single","q":"以下哪项是 AWS 上的完全托管图形数据库服务？","o":[{"l":"A","t":"Amazon Aurora"},{"l":"B","t":"Amazon FSx"},{"l":"C","t":"Amazon DynamoDB"},{"l":"D","t":"Amazon Neptune"}],"a":["D"],"e":"**✅ 为什么 D.Amazon Neptune 对**：Neptune 是完全托管图数据库，支持高度关联数据的快速遍历查询（社交网络/知识图谱/欺诈检测），「图数据库」唯一直选。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Aurora：关系型数据库\n- B. Amazon FSx：文件存储\n- C. Amazon DynamoDB：键值 NoSQL\n\n**📌 关键概念**：图数据库 → Neptune；键值 → DynamoDB；文档 → DocumentDB；时序 → Timestream；账本 → QLDB；内存 → ElastiCache；按数据模型对号入座是数据库选型基本盘。图查询典型场景：社交关系、推荐路径、欺诈团伙识别，关系深度遍历是 SQL 弱项。Neptune 支持 openCypher/Gremlin/SPARQL 查询语言，关系型查询性能远超 SQL 自关联。","s":"源#308"},{"id":"D3-311","d":3,"t":"single","q":"哪种 AWS 存储是临时性的，当 Amazon EC2 实例停止或终止时会被删除？","o":[{"l":"A","t":"Amazon Elastic Block Store（Amazon EBS）"},{"l":"B","t":"Amazon EC2 实例存储"},{"l":"C","t":"Amazon Elastic File System（Amazon EFS）"},{"l":"D","t":"Amazon S3"}],"a":["B"],"e":"**✅ 为什么 B.Amazon EC2 实例存储 对**：实例存储（Instance Store）是物理挂载在宿主机上的临时块存储，实例停止或终止即数据丢失，适合缓存/临时数据。\n\n**❌ 为什么其他选项错**：\n- A. Amazon EBS：持久块存储，实例停止数据保留\n- C. Amazon EFS：持久共享文件存储\n- D. Amazon S3：持久对象存储\n\n**📌 关键概念**：临时存储 → 实例存储（停机即失）；持久块 → EBS；「停止或终止时被删除」是实例存储定义；临时数据（缓冲/缓存/临时文件）用它，重要数据必须放持久存储。实例存储与 EBS 的取舍：性能要求高且可丢的数据用实例存储，持久性要求用 EBS。","s":"源#311"},{"id":"D3-312","d":3,"t":"single","q":"一家公司想要从其本地工作负载访问 AWS 中的 Windows 文件共享。公司不想在其数据中心中配置任何额外的基础设施或应用程序。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon FSx 文件网关"},{"l":"B","t":"AWS DataSync"},{"l":"C","t":"Amazon S3"},{"l":"D","t":"AWS Snow 家族"}],"a":["A"],"e":"**✅ 为什么 A.Amazon FSx 文件网关 对**：FSx File Gateway 是 Storage Gateway 的一种配置，本地无网关外基础设施即可通过 SMB 访问 FSx for Windows File Server，兼具本地缓存。\n\n**❌ 为什么其他选项错**：\n- B. AWS DataSync：数据搬迁工具，非持续文件共享访问\n- C. Amazon S3：对象存储，非 Windows 文件共享\n- D. AWS Snow 家族：离线迁移设备\n\n**📌 关键概念**：本地无缝访问 FSx → FSx File Gateway（SMB 接口+本地缓存）；本地访问 S3 → S3 File Gateway；「不想在数据中心配置额外设施」由网关的轻量部署满足。Storage Gateway 四配置：S3 文件网关、FSx 文件网关、卷网关、磁带网关，按后端与协议选。FSx 文件网关与 S3 文件网关的区分在后端：一个对接 FSx Windows、一个对接 S3。","s":"源#312"},{"id":"D3-313","d":3,"t":"single","q":"一家公司想要持久性存储静态内容，并具有无限可扩展的数据存储基础设施，以最低成本。公司应该选择哪家 AWS 服务？","o":[{"l":"A","t":"Amazon Elastic Block Store（Amazon EBS）"},{"l":"B","t":"Amazon S3"},{"l":"C","t":"AWS Storage Gateway"},{"l":"D","t":"Amazon Elastic File System（Amazon EFS）"}],"a":["B"],"e":"**✅ 为什么 B.Amazon S3 对**：S3 是无限扩展的对象存储，持久性 11 个 9，存储单价随层级递减，静态内容存储的标准选择，满足「持久+无限扩展+最低成本」。\n\n**❌ 为什么其他选项错**：\n- A. Amazon EBS：块存储，容量受限于卷规格且不能共享\n- C. AWS Storage Gateway：混合存储接入，后端仍是 S3\n- D. Amazon EFS：文件存储，单价高于对象存储\n\n**📌 关键概念**：静态内容+无限容量+便宜 → S3；「无限可扩展+持久」是 S3 标志性能力；静态网站托管是 S3 原生功能，配合 CloudFront 加速。S3 桶名全局唯一，静态网站托管原生支持，配 CloudFront 即可全球加速。","s":"源#313"},{"id":"D3-314","d":3,"t":"single","q":"一家电子商务公司想要使用 Amazon EC2 自动扩展根据 CPU 利用率添加和删除EC2 实例。哪家AWS服务或功能可以启动 Amazon EC2 自动扩展操作以实现此目标？","o":[{"l":"A","t":"Amazon Simple Queue Service（Amazon SQS）"},{"l":"B","t":"Amazon Simple Notification Service（Amazon SNS）"},{"l":"C","t":"AWS 系统管理器"},{"l":"D","t":"Amazon CloudWatch 警报"}],"a":["D"],"e":"**✅ 为什么 D.Amazon CloudWatch 警报 对**：CloudWatch Alarms 监控 CPU 利用率等指标，超阈值时触发 Auto Scaling 策略（扩展或缩减），是「基于指标自动伸缩」的标准触发链路。\n\n**❌ 为什么其他选项错**：\n- A. Amazon SQS：消息队列，不监控指标\n- B. Amazon SNS：通知服务，可发告警但不直接驱动伸缩\n- C. AWS 系统管理器：运维管理工具集，非指标监控\n\n**📌 关键概念**：指标→警报→伸缩链路=CloudWatch Alarm+ASG 策略；CPU 利用率是 ASG 最常用触发指标；SNS 用于告警通知（人），CloudWatch Alarm 直接触发 ASG（自动）。ASG 策略类型：简单（步进）/目标追踪/预测性伸缩，目标追踪最常用（如 CPU 保持 50%）。","s":"源#314"},{"id":"D3-316","d":3,"t":"single","q":"一家公司想要将其本地数据库迁移到托管的云数据库服务，使用简化的迁移流程。哪家AWS 服务或工具可以帮助公司满足此要求？","o":[{"l":"A","t":"AWS 存储网关"},{"l":"B","t":"AWS 应用程序迁移服务"},{"l":"C","t":"AWS 数据同步"},{"l":"D","t":"AWS 数据库迁移服务（AWS DMS）"}],"a":["D"],"e":"**✅ 为什么 D.AWS 数据库迁移服务（AWS DMS） 对**：DMS 专用于数据库迁移，支持同构/异构引擎，持续复制最小化停机，托管服务免运维，「本地数据库迁托管云数据库+简化流程」正是其定位。\n\n**❌ 为什么其他选项错**：\n- A. AWS 存储网关：混合存储接入，非数据库迁移\n- B. AWS 应用程序迁移服务：整机/应用层迁移\n- C. AWS 数据同步（DataSync）：文件/对象数据传输，不迁数据库\n\n**📌 关键概念**：数据库迁移 → DMS；服务器整机 → MGN；文件对象在线传输 → DataSync；「数据库+简化流程+最小停机」锁定 DMS。","s":"源#316"},{"id":"D3-317","d":3,"t":"single","q":"一家公司需要一个完全托管的文件服务器，该服务器本地支持 Microsoft 工作负载和文件系统。文件服务器还必须支持 SMB 协议。公司应该使用哪家 AWS 服务来
