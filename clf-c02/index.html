,{"l":"E","t":"确保帐户密码策略要求最小长度。"}],"a":["A","E"],"e":"在提供 AWS 凭证给开发人员时应遵循的安全最佳实践是，仅授予开发人员访问 AWS 资源的权限以执行工作（选项A），遵循最小权限原则，以及确保帐户密码策略要求最小长度（选项 E），增强密码的强度和安全性。","s":"源#106"},{"id":"D2-108","d":2,"t":"single","q":"用户希望允许在 Amazon EC2 实例上运行的应用程序调用其他 AWS 服务。授予的访问权限必须是安全的。应该使用哪个 AWS 服务或功能？","o":[{"l":"A","t":"安全组"},{"l":"B","t":"AWS 防火墙管理器"},{"l":"C","t":"IAM 角色"},{"l":"D","t":"IAM 用户 SSH 密钥"}],"a":["C"],"e":"为了允许在 Amazon EC2 实例上运行的应用程序安全地调用其他 AWS 服务，推荐的 AWS 服务或功能是 IAM 角色（选项C）。IAM 角色提供了一种安全的方式，将权限委派给 AWS 服务和资源，无需长期凭证。","s":"源#108"},{"id":"D2-111","d":2,"t":"single","q":"一家公司需要跟踪其 AWS 账户中的活动，并需要知道何时对其 AWS 资源进行了API 调用。可以使用哪个 AWS 工具或服务来满足这些要求？","o":[{"l":"A","t":"Amazon CloudWatch"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"AWS CloudTrail"},{"l":"D","t":"AWS IAM"}],"a":["C"],"e":"AWS CloudTrail（选项 C）是一个工具或服务，可用于跟踪 AWS 账户中的活动，并在对 AWS 资源进行 API 调用时发出通知。CloudTrail 通过跟踪用户活动和 API 使用情况，支持审计、安全监控和操作故障排除。","s":"源#111"},{"id":"D2-115","d":2,"t":"single","q":"一家社交媒体公司希望保护其 Web 应用程序免受常见的网络攻击，如 SQL 注入和跨站脚本攻击。哪个 AWS 服务能满足这些要求？","o":[{"l":"A","t":"Amazon Inspector"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"Amazon CloudWatch"}],"a":["B"],"e":"AWS WAF（Web 应用程序防火墙，选项 B）是一个服务，可以保护 Web 应用程序免受常见的网络攻击，如 SQL 注入和跨站脚本攻击。它允许配置规则以允许、阻止或监控基于定义条件的 Web 请求。","s":"源#115"},{"id":"D2-120","d":2,"t":"single","q":"一家公司想要设计一个集中存储系统，用于管理其关键业务应用程序的配置数据和密码。哪个AWS服务或功能将以最具成本效益的方式满足这些要求？","o":[{"l":"A","t":"AWS 系统管理器参数存储"},{"l":"B","t":"AWS 密钥管理器"},{"l":"C","t":"AWS 合规性"},{"l":"D","t":"Amazon S3"}],"a":["A"],"e":"AWS 系统管理器参数存储提供了一个安全、分层的存储库，用于存储配置数据、密码和其他敏感信息。它提供与 AWS 身份和访问管理 (IAM) 的集成，以实现细粒度的访问控制，并提供静态加密，以增强安全性。虽然 AWS 密钥管理器（选项 B）专门设计用于管理密码、API 密钥和其他敏感信息，但与参数存储相比，它通常会产生更高的成本。参数存储可以有效地管理配置数据和密码，使其成为所描述场景的成本效益解决方案。","s":"源#120"},{"id":"D2-122","d":2,"t":"single","q":"一家公司想要创建新的 AWS 账户，将多个账户分组以组织工作流程，并对账户组应用策略。哪个AWS 服务或功能允许用户这样做？","o":[{"l":"A","t":"AWS 身份和访问管理（IAM）"},{"l":"B","t":"AWS 信任顾问"},{"l":"C","t":"AWS CloudFormation"},{"l":"D","t":"AWS 组织"}],"a":["D"],"e":"AWS 组织是一个服务，使用户能够分组和管理多个 AWS 账户。使用 AWS 组织，用户可以创建新账户，对账户进行分组，对账户组应用策略，并为整个组织创建策略。此服务提供了集中管理和治理您的云环境的能力，允许您在单一账单下管理和组织您的账户，为您的整个组织设置中央策略和配置要求，创建组织内的自定义权限或功能，并委派责任给其他账户，以便它们代表组织进行管理。 AWS 组织（选项D）使您能够将多个 AWS 账户合并到您创建的组织中。它允许您集中管理这些账户，包括创建新账户、对它们进行分组和跨账户应用策略，以实现一致的治理。","s":"源#122"},{"id":"D2-124","d":2,"t":"single","q":"一家公司希望阻止 SQL 注入攻击。为了满足此要求，公司应该使用哪种 AWS 服务或功能？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"网络 ACL"},{"l":"C","t":"安全组"},{"l":"D","t":"AWS 证书管理器（ACM）"}],"a":["A"],"e":"AWS WAF（选项 A）代表 Web 应用程序防火墙。它通过允许您配置规则来阻止 SQL 注入攻击等威胁，从而帮助保护Web 应用程序。","s":"源#124"},{"id":"D2-126","d":2,"t":"single","q":"一家公司需要评估其 AWS 环境，并在五个类别中提供最佳实践建议：成本、性能、服务限制、容错和安全性。公司可以使用哪种 AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS Shield"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"AWS Trusted Advisor"},{"l":"D","t":"AWS Service Catalog"}],"a":["C"],"e":"AWS Trusted Advisor（选项 C）在包括成本优化、性能、服务限制、容错和安全等多个类别中提供最佳实践建议，帮助用户优化和保护其 AWS 环境。","s":"源#126"},{"id":"D2-130","d":2,"t":"single","q":"在 AWS 共享责任模型下，哪个选项是 AWS 和其客户之间的共同责任？","o":[{"l":"A","t":"配置 Amazon EC2 实例操作系统"},{"l":"B","t":"应用程序文件系统服务器端加密"},{"l":"C","t":"补丁管理"},{"l":"D","t":"物理基础设施的安全性"}],"a":["C"],"e":"补丁管理（选项 C）是共同责任。AWS 负责底层基础设施，而客户负责为其客户操作系统和应用程序打补丁。","s":"源#130"},{"id":"D2-132","d":2,"t":"single","q":"根据 AWS 共享责任模型，哪项任务是 AWS 的责任？","o":[{"l":"A","t":"对 Amazon EC2 实例应用客操作系统补丁。"},{"l":"B","t":"提供人力资源信息管理（HRIM）系统的监控。"},{"l":"C","t":"对 Amazon RDS 实例执行自动备份。"},{"l":"D","t":"优化运行 AWS 服务的成本。"}],"a":["C"],"e":"根据 AWS 共享责任模型，AWS 负责对 Amazon RDS 实例进行自动备份。客户负责其他任务，如应用 Amazon EC2 实例的客操作系统补丁。","s":"源#132"},{"id":"D2-140","d":2,"t":"multiple","q":"哪些 AWS 服务可以用于实现松耦合架构？（选择两个。）","o":[{"l":"A","t":"Amazon WorkSpaces"},{"l":"B","t":"Amazon Simple Queue Service（Amazon SQS）"},{"l":"C","t":"Amazon Connect"},{"l":"D","t":"AWS Trusted Advisor"},{"l":"E","t":"AWS Step Functions"}],"a":["B","E"],"e":"Amazon Simple Queue Service（Amazon SQS）（选项 B）和 AWS Step Functions（选项 E）可用于实现松耦合架构。Amazon SQS 实现应用程序组件之间的异步通信，而 AWS Step Functions 协调多个 AWS 服务进入无服务器工作流，促进可扩展性和弹性。","s":"源#140"},{"id":"D2-146","d":2,"t":"single","q":"在 AWS 共享责任模型下，哪个选项是客户的责任？","o":[{"l":"A","t":"维护 Amazon EC2 实例的底层硬件"},{"l":"B","t":"应用程序数据安全"},{"l":"C","t":"数据中心的物理安全"},{"l":"D","t":"VPC 组件的维护"}],"a":["B"],"e":"在 AWS 共享责任模型下，客户负责某些云中的安全方面。应用程序数据安全（选项 B）属于客户的责任范围，而 AWS 负责底层基础设施的安全性。","s":"源#146"},{"id":"D2-149","d":2,"t":"single","q":"系统管理员为开发人员创建了一个新的 IAM 用户，并为用户分配了一个访问密钥，而不是用户名和密码。访问密钥的用途是什么？","o":[{"l":"A","t":"作为 AWS 账户根用户访问 AWS 账户"},{"l":"B","t":"通过 AWS 管理控制台访问 AWS 账户"},{"l":"C","t":"通过 CLI 访问 AWS 账户"},{"l":"D","t":"访问公司的所有 AWS 账户"}],"a":["C"],"e":"访问密钥（选项 C）用于通过命令行界面（CLI）、SDK 或其他编程方法对 AWS 服务进行程序化访问。它不用于通过AWS 管理控制台登录。","s":"源#149"},{"id":"D2-155","d":2,"t":"single","q":"哪种 AWS 服务帮助用户审核其 AWS 账户中的 API 活动？","o":[{"l":"A","t":"AWS CloudTrail"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"AWS WAF"},{"l":"D","t":"AWS Config"}],"a":["A"],"e":"AWS CloudTrail（选项 A）是一项服务，可实现对 AWS 账户的治理、合规性、操作审计和风险审计。它为您提供了账户的AWS API 调用历史记录，允许您审核 API 活动。","s":"源#155"},{"id":"D2-156","d":2,"t":"single","q":"根据 AWS 共享责任模型，哪项任务是客户的职责？","o":[{"l":"A","t":"维护运行 AWS Lambda 所需的基础设施"},{"l":"B","t":"更新 Amazon DynamoDB 实例的操作系统"},{"l":"C","t":"维护 Amazon S3 基础设施"},{"l":"D","t":"更新 Amazon EC2 实例上的客户操作系统"}],"a":["D"],"e":"在 AWS 共享责任模型中，客户负责云中的安全，其中包括任务，例如更新 Amazon EC2 实例上的客户操作系统。AWS 负责云的安全，包括维护底层基础设施。","s":"源#156"},{"id":"D2-158","d":2,"t":"single","q":"用户想要安全地自动化管理和轮换在应用程序之间共享的凭证，同时在管理任务上花费最少的时间。哪种 AWS 服务或功能可以用来实现这一点？","o":[{"l":"A","t":"AWS CloudHSM"},{"l":"B","t":"AWS 密钥管理服务（AWS KMS）"},{"l":"C","t":"AWS Secrets Manager"},{"l":"D","t":"服务器端加密"}],"a":["C"],"e":"AWS Secrets Manager（选项 C）帮助用户安全地存储、管理和检索应用程序、服务和设备使用的凭证和其他密钥，减少了管理这些任务的开销。","s":"源#158"},{"id":"D2-159","d":2,"t":"single","q":"哪种安全服务可以自动识别并分类 AWS 上的敏感数据或知识产权？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"Amazon Macie"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"AWS Shield"}],"a":["B"],"e":"Amazon Macie（选项 B）使用机器学习和模式匹配自动发现、分类和保护 AWS 中的敏感数据。","s":"源#159"},{"id":"D2-160","d":2,"t":"multiple","q":"AWS 账户根用户的最佳实践操作是什么？（选择两个。）","o":[{"l":"A","t":"与团队成员共享根用户凭据。"},{"l":"B","t":"为账户创建多个根用户，按环境分开。"},{"l":"C","t":"为根用户启用多因素认证（MFA）。"},{"l":"D","t":"为日常管理任务创建具有管理员权限的 IAM 用户，而不是使用根用户。"},{"l":"E","t":"使用程序化访问而不是根用户和密码。"}],"a":["C","D"],"e":"为根用户启用多因素认证（选项 C）增加了额外的安全层，为日常任务创建具有管理员权限的 IAM 用户（选项 D）减少了使用权限高且风险大的根用户账户的风险。","s":"源#160"},{"id":"D2-163","d":2,"t":"single","q":"一家公司需要在 Amazon S3 存储桶和本地应用程序之间传输数据。根据 AWS 共享责任模型，谁负责这些数据的安全性？","o":[{"l":"A","t":"公司"},{"l":"B","t":"AWS"},{"l":"C","t":"防火墙供应商"},{"l":"D","t":"AWS Marketplace 合作伙伴"}],"a":["A"],"e":"根据 AWS 共享责任模型，公司（选项 A）负责在 Amazon S3 存储桶和本地应用程序之间传输的数据的安全性，包括管理访问和加密。","s":"源#163"},{"id":"D2-168","d":2,"t":"single","q":"对于存储在 Amazon S3 存储桶中的敏感数据的访问，哪种操作是安全最佳实践？","o":[{"l":"A","t":"在 S3 存储桶上启用 S3 跨区域复制（CRR）。"},{"l":"B","t":"对需要访问 S3 存储桶的应用程序使用 IAM 角色。"},{"l":"C","t":"配置 AWS WAF 以防止未经授权访问 S3 存储桶。"},{"l":"D","t":"配置 Amazon GuardDuty 以防止未经授权访问 S3 存储桶。"}],"a":["B"],"e":"对需要访问 S3 存储桶的应用程序使用 IAM 角色（选项 B）是安全最佳实践。IAM 角色有助于实施最少权限原则，确保应用程序仅具有执行其任务所必需的权限。","s":"源#168"},{"id":"D2-170","d":2,"t":"single","q":"一家公司需要一个中央用户门户，以便用户可以登录到支持安全断言标记语言（SAML）2.0 的第三方业务应用程序。哪个 AWS 服务将满足此要求？","o":[{"l":"A","t":"AWS 身份和访问管理（IAM）"},{"l":"B","t":"Amazon Cognito"},{"l":"C","t":"AWS IAM 身份中心（AWS 单点登录）"},{"l":"D","t":"AWS CLI"}],"a":["B"],"e":"Amazon Cognito 是正确的答案。用户想要登录到第三方应用程序，而不是 AWS 服务。Cognito 的定义 - Amazon Cognito 支持通过安全断言标记语言 2.0（SAML 2.0）与身份提供商（IdP）进行身份验证。您可以使用支持 SAML 的 IdP 与 Amazon Cognito 一起，为用户提供简单的注册流程。支持页面 - https://docs.aws.amazon.com/cognito/latest/developerguide/saml-identity-provider.html","s":"源#170"},{"id":"D2-171","d":2,"t":"single","q":"用户应该使用哪个 AWS 服务来了解 AWS 服务的可用性和运营情况？","o":[{"l":"A","t":"Amazon EventBridge"},{"l":"B","t":"AWS 服务目录"},{"l":"C","t":"AWS 控制塔"},{"l":"D","t":"AWS 健康仪表板"}],"a":["D"],"e":"AWS 健康仪表板（选项 D）是一项服务，为用户提供了 AWS 服务的操作状态和健康的集中视图，包括有关服务可用性和事件的信息。","s":"源#171"},{"id":"D2-172","d":2,"t":"single","q":"哪种 AWS 服务或工具可用于捕获 Amazon VPC 中进出流量的信息？","o":[{"l":"A","t":"VPC 流日志"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"VPC 端点服务"},{"l":"D","t":"NAT 网关"}],"a":["A"],"e":"VPC 流日志（选项 A）是一项服务，使用户能够捕获进出 Amazon VPC 中网络接口的 IP 流量信息，提供对网络流量模式的可见性。","s":"源#172"},{"id":"D2-173","d":2,"t":"single","q":"根据 AWS 共享责任模型，客户始终负责管理什么？","o":[{"l":"A","t":"软件许可证"},{"l":"B","t":"网络"},{"l":"C","t":"客户数据"},{"l":"D","t":"加密密钥"}],"a":["C"],"e":"根据 AWS 共享责任模型，客户始终负责管理自己的客户数据（选项 C），包括保护数据，根据合规性要求处理数据，并应用必要的加密。","s":"源#173"},{"id":"D2-174","d":2,"t":"single","q":"哪种 AWS 服务可以用来按需检索合规性报告？","o":[{"l":"A","t":"AWS Secrets Manager"},{"l":"B","t":"AWS Artifact"},{"l":"C","t":"AWS Security Hub"},{"l":"D","t":"AWS 证书管理器"}],"a":["B"],"e":"AWS Artifact（选项 B）是一项服务，允许用户按需下载合规性报告和其他 AWS 服务文档，帮助他们进行合规性和治理。","s":"源#174"},{"id":"D2-175","d":2,"t":"single","q":"哪种 AWS 服务使用户能够使用预定义的评估模板检查 Amazon EC2 实例上的漏洞？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"AWS Trusted Advisor"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"AWS Shield"}],"a":["C"],"e":"Amazon Inspector（选项 C）是一项服务，它使用预定义或自定义的评估模板评估应用程序的漏洞或最佳实践的偏差，以帮助提高EC2 实例的安全性。","s":"源#175"},{"id":"D2-177","d":2,"t":"single","q":"哪种行动将有助于提高 AWS 云的安全性？","o":[{"l":"A","t":"为所有 IAM 用户启用程序化访问。"},{"l":"B","t":"使用 IAM 用户而不是 IAM 角色来委派权限。"},{"l":"C","t":"定期轮换访问密钥。"},{"l":"D","t":"使用内联策略而不是客户管理的策略。"}],"a":["C"],"e":"定期轮换访问密钥（选项 C）是一种安全最佳实践，有助于限制泄露的密钥可能被用于未经授权访问 AWS 资源的时间。","s":"源#177"},{"id":"D2-184","d":2,"t":"single","q":"公司可以使用哪种 AWS 服务或功能对特定的 Amazon EC2 实例应用安全规则？","o":[{"l":"A","t":"网络 ACL"},{"l":"B","t":"安全组"},{"l":"C","t":"AWS Trusted Advisor"},{"l":"D","t":"AWS WAF"}],"a":["B"],"e":"安全组（选项 B）是 AWS 的一个功能，充当 EC2 实例的虚拟防火墙，根据用户定义的规则控制实例的入站和出站流量。","s":"源#184"},{"id":"D2-187","d":2,"t":"single","q":"一家公司想要创建模板，以便公司可以重复使用来部署多个 AWS 资源。公司可以使用哪种AWS 服务或功能来满足此要求？","o":[{"l":"A","t":"AWS Marketplace"},{"l":"B","t":"Amazon Machine Image（AMI）"},{"l":"C","t":"AWS CloudFormation"},{"l":"D","t":"AWS OpsWorks"}],"a":["C"],"e":"AWS CloudFormation（选项 C）使用户能够创建模板，称为堆栈，这些模板可以重复使用，以可预测和一致的方式部署AWS 资源集合。","s":"源#187"},{"id":"D2-189","d":2,"t":"single","q":"哪种 AWS 服务或功能是一种基于浏览器的、预身份验证的服务，可以直接从 AWS 管理控制台启动？","o":[{"l":"A","t":"AWS API"},{"l":"B","t":"AWS Lightsail"},{"l":"C","t":"AWS Cloud9"},{"l":"D","t":"AWS CloudShell"}],"a":["D"],"e":"AWS CloudShell（选项 D）是一种基于浏览器的、预身份验证的服务，为用户提供了一个 shell 环境，可以直接从 AWS 管理控制台与AWS 服务交互。","s":"源#189"},{"id":"D2-192","d":2,"t":"single","q":"一家公司在多个 Amazon EC2 实例上托管了一个应用程序。该应用程序使用 Amazon Simple Notification Service（Amazon SNS）发送消息。哪种 AWS 服务或功能将为应用程序提供访问所需AWS 服务的权限？","o":[{"l":"A","t":"AWS 证书管理器（ACM）"},{"l":"B","t":"IAM 角色"},{"l":"C","t":"AWS Security Hub"},{"l":"D","t":"Amazon GuardDuty"}],"a":["B"],"e":"IAM 角色（选项 B）为在 Amazon EC2 实例上运行的应用程序提供必要的权限，以安全和受控的方式访问 AWS 服务，例如Amazon SNS。","s":"源#192"},{"id":"D2-197","d":2,"t":"single","q":"一家公司需要集中配置和管理 AWS 组织中的 Amazon VPC 安全组，跨多个 AWS 账户。公司应该使用哪种 AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS Firewall Manager"},{"l":"B","t":"Amazon GuardDuty"},{"l":"C","t":"Amazon Detective"},{"l":"D","t":"AWS WAF"}],"a":["A"],"e":"AWS Firewall Manager（选项 A）是一项服务，允许跨多个 AWS 账户和 VPC 集中管理安全组和网络 ACL，帮助维护一致的安全策略。","s":"源#197"},{"id":"D2-198","d":2,"t":"single","q":"根据 AWS 共享责任模型，哪项任务是 AWS 的责任？","o":[{"l":"A","t":"对 Amazon EC2 实例应用客操作系统补丁。"},{"l":"B","t":"提供人力资源信息管理（HRIM）系统的监控。"},{"l":"C","t":"对 Amazon RDS 实例执行自动备份。"},{"l":"D","t":"优化运行 AWS 服务的成本。"}],"a":["C"],"e":"根据 AWS 共享责任模型，AWS 负责对 Amazon RDS 实例进行自动备份。客户负责其他任务，如应用 Amazon EC2 实例的客操作系统补丁。","s":"源#198"},{"id":"D2-200","d":2,"t":"multiple","q":"根据 AWS 共享责任模型，哪两项行动是 AWS 的责任？","o":[{"l":"A","t":"保护虚拟化层"},{"l":"B","t":"修补 Amazon EC2 实例上的操作系统"},{"l":"C","t":"为 IAM 用户强制执行严格的密码策略"},{"l":"D","t":"修补 Amazon RDS 实例上的操作系统"},{"l":"E","t":"配置安全组和网络 ACL"}],"a":["A","D"],"e":"保护虚拟化层（选项 A）和修补 Amazon RDS 实例上的操作系统（选项 D）是 AWS 的责任。AWS 处理底层基础设施，包括虚拟化层，并管理其托管服务（如 Amazon RDS）的补丁。","s":"源#200"},{"id":"D2-202","d":2,"t":"single","q":"哪种 AWS 服务或资源可以用来识别用户在指定日期范围内使用过的服务？","o":[{"l":"A","t":"Amazon S3 访问控制列表（ACL）"},{"l":"B","t":"AWS 证书管理器（ACM）"},{"l":"C","t":"网络访问分析器"},{"l":"D","t":"AWS 身份和访问管理访问分析器"}],"a":["D"],"e":"AWS 身份和访问管理访问分析器（选项 D）与 AWS CloudTrail 集成，提供 IAM 主体（用户或角色）可以访问的 AWS 资源清单，并且它可以识别用户在指定日期范围内使用过的服务。","s":"源#202"},{"id":"D2-203","d":2,"t":"single","q":"一家公司需要聘请第三方顾问来帮助维护和支持其 AWS 环境以及公司的业务需求。哪种AWS 服务或资源将满足这些要求？","o":[{"l":"A","t":"AWS 支持"},{"l":"B","t":"AWS 组织"},{"l":"C","t":"AWS 服务目录"},{"l":"D","t":"AWS 合作伙伴网络（APN）"}],"a":["D"],"e":"AWS 合作伙伴网络（APN）（选项 D）是一个计划，提供访问全球 AWS 合作伙伴网络，他们可以提供一系列服务和解决方案，帮助维护和支持 AWS 环境。","s":"源#203"},{"id":"D2-211","d":2,"t":"single","q":"哪种 AWS 安全服务通过始终开启的检测和自动内联缓解措施来保护应用程序免受分布式拒绝服务（DDoS）攻击？","o":[{"l":"A","t":"Amazon Inspector"},{"l":"B","t":"AWS Web 应用程序防火墙（AWS WAF）"},{"l":"C","t":"弹性负载均衡（ELB）"},{"l":"D","t":"AWS Shield"}],"a":["D"],"e":"AWS Shield（选项 D）是一项安全服务，提供始终开启的检测和自动内联缓解措施，以保护应用程序免受 DDoS 攻击，确保应用程序的可用性和性能。","s":"源#211"},{"id":"D2-212","d":2,"t":"single","q":"哪个 AWS 服务允许用户使用常见的编程语言来建模和配置 AWS 资源？","o":[{"l":"A","t":"AWS CloudFormation"},{"l":"B","t":"AWS CodePipeline"},{"l":"C","t":"AWS Cloud Development Kit (AWS CDK)"},{"l":"D","t":"AWS Systems Manager"}],"a":["C"],"e":"AWS Cloud Development Kit (AWS CDK)（选项 C）使用户能够使用熟悉的编程语言，如 TypeScript、Python、Java 和C#来定义云基础设施。它允许基础设施即代码，使其更易于管理和自动化部署。","s":"源#212"},{"id":"D2-214","d":2,"t":"single","q":"以下哪个作为实例级防火墙控制入站和出站访问？","o":[{"l":"A","t":"网络访问控制列表"},{"l":"B","t":"安全组"},{"l":"C","t":"AWS Trusted Advisor"},{"l":"D","t":"虚拟私有网关"}],"a":["B"],"e":"安全组作为实例的虚拟防火墙，使用指定的规则启用您控制入站和出站流量。","s":"源#214"},{"id":"D2-216","d":2,"t":"single","q":"一家公司有具有不同工作角色和职责的团队。公司的员工经常更换团队。公司需要管理员工的权限，以便权限适合工作职责。公司应该使用哪种 IAM 资源以最小的运营开销满足此要求？","o":[{"l":"A","t":"IAM 用户组"},{"l":"B","t":"IAM 角色"},{"l":"C","t":"IAM 实例配置文件"},{"l":"D","t":"针对个别用户的 IAM 策略"}],"a":["B"],"e":"IAM 角色允许您根据用户当前的工作职责分配临时访问权限，这非常适合动态团队结构，其中员工经常更换团队。","s":"源#216"},{"id":"D2-217","d":2,"t":"single","q":"一家公司可以使用哪个 AWS 服务来安全地存储和加密数据库的密码？","o":[{"l":"A","t":"AWS Shield"},{"l":"B","t":"AWS Secrets Manager"},{"l":"C","t":"AWS Identity and Access Management (IAM)"},{"l":"D","t":"Amazon Cognito"}],"a":["B"],"e":"AWS Secrets Manager 旨在安全存储、检索和管理诸如数据库凭据之类的敏感信息，使用内置加密和细粒度访问控制。","s":"源#217"},{"id":"D2-218","d":2,"t":"single","q":"云从业者可以使用什么来检索 AWS 安全和合规文件，并将它们作为证据提交给审计师或监管机构？","o":[{"l":"A","t":"AWS Certificate Manager"},{"l":"B","t":"AWS Systems Manager"},{"l":"C","t":"AWS Artifact"},{"l":"D","t":"Amazon Inspector"}],"a":["C"],"e":"AWS Artifact 提供了 AWS 安全和合规文件的访问权限，包括报告和认证，这些可以作为合规性的证据提交给审计师或监管机构。","s":"源#218"},{"id":"D2-219","d":2,"t":"multiple","q":"哪种加密类型可用于保护 Amazon S3 中静止的对象？（选择两个）","o":[{"l":"A","t":"使用 Amazon S3 管理的加密密钥的服务器端加密（SSE-S3）"},{"l":"B","t":"使用 AWS KMS 管理的密钥的服务器端加密（SSE-KMS）"},{"l":"C","t":"TLS"},{"l":"D","t":"SSL"},{"l":"E","t":"透明数据加密（TDE）"}],"a":["A","B"],"e":"SSE-S3 和 SSE-KMS 都为存储在 Amazon S3 中的数据提供加密，SSE-S3 使用由 Amazon S3 管理的密钥，SSE-KMS 使用由AWS 密钥管理服务（KMS）管理的密钥。","s":"源#219"},{"id":"D2-220","d":2,"t":"single","q":"一家公司希望将其在线购物网站与社交媒体登录凭据集成。公司可以使用哪个AWS 服务来实现此集成？","o":[{"l":"A","t":"AWS Directory Service"},{"l":"B","t":"AWS Identity and Access Management (IAM)"},{"l":"C","t":"Amazon Cognito"},{"l":"D","t":"AWS IAM Identity Center (AWS Single Sign-On)"}],"a":["C"],"e":"Amazon Cognito 提供用户身份和数据同步服务，促进将社交媒体登录功能集成到应用程序和网站中，支持各种社交媒体身份提供者。","s":"源#220"},{"id":"D2-221","d":2,"t":"single","q":"哪家公司可以使用 AWS 服务来跟踪、记录和审计对 AWS 资源所做的配置更改？","o":[{"l":"A","t":"AWS Shield"},{"l":"B","t":"AWS Config"},{"l":"C","t":"AWS IAM"},{"l":"D","t":"Amazon Inspector"}],"a":["B"],"e":"AWS Config 提供 AWS 资源的详细清单，并持续监控和记录配置更改，有助于合规性、故障排除和更改跟踪。","s":"源#221"},{"id":"D2-223","d":2,"t":"single","q":"一家公司的网站正在遭受 DDoS 攻击。哪家 AWS 服务可以帮助保护该公司的网站免受这些攻击？","o":[{"l":"A","t":"AWS Resource Access Manager"},{"l":"B","t":"AWS Amplify"},{"l":"C","t":"AWS Shield"},{"l":"D","t":"Amazon GuardDuty"}],"a":["C"],"e":"AWS Shield 提供管理的 DDoS 保护，帮助保护在 AWS 上运行的应用程序免受 DDoS 攻击。","s":"源#223"},{"id":"D2-224","d":2,"t":"single","q":"一家公司想要对其当前的本地环境进行定制评估。公司想要了解其在 AWS 云中的预计运行成本。哪家 AWS 服务或工具将满足这些要求？","o":[{"l":"A","t":"AWS Trusted Advisor"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"AWS Control Tower"},{"l":"D","t":"Migration Evaluator"}],"a":["D"],"e":"Migration Evaluator 提供了一项服务，为 AWS 云规划和迁移创建方向性商业案例，提供对 AWS 中预计运行成本的洞察。","s":"源#224"},{"id":"D2-226","d":2,"t":"multiple","q":"一家公司在 AWS 云中托管了一个应用程序。公司想要验证底层 AWS 服务和通用AWS 基础设施是否正常运行。公司可以使用哪种 AWS 服务组合来收集所需信息？（选择两个）","o":[{"l":"A","t":"AWS 个人健康仪表板"},{"l":"B","t":"AWS 系统管理器"},{"l":"C","t":"AWS Trusted Advisor"},{"l":"D","t":"AWS 服务健康仪表板"},{"l":"E","t":"AWS 服务目录"}],"a":["A","D"],"e":"AWS 个人健康仪表板提供了使用的 AWS 服务状态的个性化视图，而 AWS 服务健康仪表板提供了所有 AWS 服务的通用状态。它们一起可以帮助验证底层服务和基础设施的运行情况。","s":"源#226"},{"id":"D2-229","d":2,"t":"single","q":"一家公司在 AWS 上托管了大量数据。公司想要确定是否有任何数据应被视为敏感。AWS 服务将满足该要求？","o":[{"l":"A","t":"Amazon Inspector"},{"l":"B","t":"Amazon Macie"},{"l":"C","t":"AWS Identity and Access Management (IAM)"},{"l":"D","t":"Amazon CloudWatch"}],"a":["B"],"e":"Amazon Macie 是一项数据安全和隐私服务，使用机器学习自动发现、分类和保护 AWS 中的敏感数据，使其适合于识别敏感数据。","s":"源#229"},{"id":"D2-231","d":2,"t":"single","q":"谁为 Amazon Elastic Block Store（AmazonEBS）启用了静态数据的加密？","o":[{"l":"A","t":"AWS 支持"},{"l":"B","t":"AWS 客户"},{"l":"C","t":"AWS 密钥管理服务（AWS KMS）"},{"l":"D","t":"AWS Trusted Advisor"}],"a":["B"],"e":"虽然 AWS KMS 在技术上执行加密，但必须由 AWS 客户启动并在 AWS KMS 中为其 EBS 卷配置加密设置。","s":"源#231"},{"id":"D2-232","d":2,"t":"single","q":"用户可以使用 AWS CloudTrail 完成什么？","o":[{"l":"A","t":"生成 IAM 用户凭据报告。"},{"l":"B","t":"记录对 AWS 服务的 API 调用。"},{"l":"C","t":"评估 AWS 资源配置与策略和指南的合规性。"},{"l":"D","t":"确保 Amazon EC2 实例使用最新的安全更新进行补丁修补。"}],"a":["B"],"e":"AWS CloudTrail 通过记录 AWS 账户内进行的 API 调用，实现治理、合规性和审计，为安全分析和故障排除提供有价值的信息。","s":"源#232"},{"id":"D2-234","d":2,"t":"single","q":"AWS 服务或功能将搜索并识别 AWS 资源是否与外部共享？","o":[{"l":"A","t":"Amazon OpenSearch Service"},{"l":"B","t":"AWS Control Tower"},{"l":"C","t":"AWS IAM 访问分析器"},{"l":"D","t":"AWS Fargate"}],"a":["C"],"e":"AWS IAM 访问分析器有助于识别和管理访问权限，包括能够分析资源策略以用于意外的外部共享，提供潜在安全风险的见解。","s":"源#234"},{"id":"D2-236","d":2,"t":"single","q":"在哪个支持级别下，用户可以获得支持礼宾服务？","o":[{"l":"A","t":"基础支持"},{"l":"B","t":"开发者支持"},{"l":"C","t":"商业支持"},{"l":"D","t":"企业支持"}],"a":["D"],"e":"企业支持是在用户获得支持礼宾服务的级别，为企业客户提供案例管理、最佳实践指导和帮助处理与 AWS 相关的查询，适用于具有关键任务工作负载的组织。","s":"源#236"},{"id":"D2-237","d":2,"t":"single","q":"一家公司可以使用哪家 AWS 服务来可视化设计和构建无服务器应用程序？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"AWS Batch"},{"l":"C","t":"AWS 应用程序组合器"},{"l":"D","t":"AWS App Runner"}],"a":["C"],"e":"AWS 应用程序组合器使用户能够通过基础设施即代码支持，可视化地组合和配置 AWS 服务到无服务器应用程序中。","s":"源#237"},{"id":"D2-239","d":2,"t":"single","q":"一家公司已部署了 Amazon EC2 实例。哪个选项是 AWS 根据 AWS 共享责任模型的责任？","o":[{"l":"A","t":"管理和加密应用程序数据"},{"l":"B","t":"安装客户操作系统的更新和安全补丁"},{"l":"C","t":"基础设施设备的配置"},{"l":"D","t":"每个实例上安全组的配置"}],"a":["C"],"e":"根据 AWS 共享责任模型，AWS 负责基础设施设备的配置，而客户负责安全组配置和与他们使用 AWS 服务相关的其他方面。","s":"源#239"},{"id":"D2-241","d":2,"t":"multiple","q":"一家公司正在使用 Amazon DynamoDB 作为其应用程序数据库。根据 AWS 共享责任模型，哪些任务是 AWS 的责任？（选择两个）","o":[{"l":"A","t":"数据分类。"},{"l":"B","t":"配置访问权限。"},{"l":"C","t":"管理加密选项。"},{"l":"D","t":"提供公共端点以存储和检索数据。"},{"l":"E","t":"管理基础设施层和操作系统。"}],"a":["D","E"],"e":"根据 AWS 共享责任模型，AWS 负责基础设施的安全，包括管理基础设施层和操作系统（E），并提供公共端点用于访问（D）。客户负责其他方面，如数据分类、配置访问权限和管理加密选项。","s":"源#241"},{"id":"D2-244","d":2,"t":"single","q":"一家公司想要通过 API 调用审查用户活动来提高其安全姿态。哪个 AWS 服务将满足此要求？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"Amazon Detective"},{"l":"C","t":"Amazon CloudWatch"},{"l":"D","t":"AWS CloudTrail"}],"a":["D"],"e":"AWS CloudTrail 是一个服务，可实现对 AWS 账户的治理、合规性、操作审计和风险审计。它记录了对您账户的 API 调用，提供了用户活动和 API 使用的历史记录，可用于审查和提高安全姿态。","s":"源#244"},{"id":"D2-249","d":2,"t":"single","q":"根据 AWS 共享责任模型，哪个选项是 AWS 和客户之间的共享控制？","o":[{"l":"A","t":"配置管理"},{"l":"B","t":"物理和环境控制"},{"l":"C","t":"数据完整性认证"},{"l":"D","t":"身份和访问管理"}],"a":["D"],"e":"身份和访问管理是 AWS 共享责任模型中的共享控制。AWS 负责 IAM 服务本身的安全性，而客户负责管理他们的 IAM 用户、组、角色和策略。","s":"源#249"},{"id":"D2-273","d":2,"t":"multiple","q":"AWS Trusted Advisor 的以下哪些好处？（选择两个）","o":[{"l":"A","t":"访问 Amazon Simple Queue Service（Amazon SQS）"},{"l":"B","t":"成本优化建议"},{"l":"C","t":"服务限制检查每小时更新"},{"l":"D","t":"安全检查"},{"l":"E","t":"AWS Identity and Access Management（IAM）审批管理"}],"a":["B","D"],"e":"AWS Trusted Advisor 提供的好处包括成本优化建议，帮助用户节省成本，以及安全检查，帮助提高云安全姿态。","s":"源#273"},{"id":"D2-277","d":2,"t":"single","q":"以下哪项是 AWS 良好构建框架在 AWS 云中实现运营卓越的设计原则？","o":[{"l":"A","t":"数分钟内实现全球化。"},{"l":"B","t":"频繁进行小的、可逆的更改。"},{"l":"C","t":"实施强大的身份和访问管理基础。"},{"l":"D","t":"停止在数据中心运营硬件基础设施上的支出。"}],"a":["B"],"e":"AWS 良好构建框架强调频繁进行小的、可逆的更改作为其运营卓越核心设计原则之一。这种方法有助于降低风险，并确保持续改进和适应性。","s":"源#277"},{"id":"D2-279","d":2,"t":"single","q":"开发人员希望 AWS 用户使用临时安全凭据访问 AWS 服务。开发人员应该使用哪个AWS 服务或功能来提供这些凭据？","o":[{"l":"A","t":"IAM 策略"},{"l":"B","t":"IAM 用户组"},{"l":"C","t":"AWS 安全令牌服务（AWS STS）"},{"l":"D","t":"AWS IAM 身份中心（AWS 单点登录）"}],"a":["C"],"e":"AWS 安全令牌服务（AWS STS）是使开发人员能够为 AWS 用户提供临时安全凭据的服务。这些凭据可以安全地用于在有限的时间内访问 AWS 服务。","s":"源#279"},{"id":"D2-280","d":2,"t":"single","q":"一家全球性公司想要使用一个托管的安全服务来防护 SQL 注入攻击。该服务还必须提供有关访问公司电子商务应用程序的详细日志信息。哪个 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS 网络防火墙"},{"l":"B","t":"适用于 SQL Server 的 Amazon RDS"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"AWS WAF"}],"a":["D"],"e":"AWS WAF（Web 应用程序防火墙）旨在保护 Web 应用程序免受常见的 Web 漏洞攻击，包括 SQL 注入攻击。它还提供有关访问应用程序的详细日志，满足公司对安全和日志记录的要求。","s":"源#280"},{"id":"D2-282","d":2,"t":"multiple","q":"以下哪项是客户根据 AWS 共享责任模型的责任？（选择两个）","o":[{"l":"A","t":"维护基础设施设备的配置。"},{"l":"B","t":"在硬件基础设施内进行补丁和更新。"},{"l":"C","t":"维护客户操作系统和应用程序的配置。"},{"l":"D","t":"管理涉及加密选项的决策。"},{"l":"E","t":"维护基础设施硬件。"}],"a":["C","D"],"e":"根据 AWS 共享责任模型，客户负责维护客户操作系统和应用程序的配置（C）和管理涉及加密选项的决策（D），而AWS 负责底层基础设施。","s":"源#282"},{"id":"D2-283","d":2,"t":"single","q":"一家公司想要验证是否为所有 AWS 账户中的用户启用了多因素认证（MFA）。哪家AWS 服务或资源将满足此要求？","o":[{"l":"A","t":"AWS 成本和使用情况报告"},{"l":"B","t":"IAM 凭据报告"},{"l":"C","t":"AWS Artifact"},{"l":"D","t":"Amazon CloudFront 报告"}],"a":["B"],"e":"IAM 凭据报告提供有关 AWS 账户中所有用户是否启用了 MFA 的信息，这对于根据公司要求验证 MFA 配置至关重要。","s":"源#283"},{"id":"D2-284","d":2,"t":"single","q":"一家公司使用 AWS 安全服务和工具。公司需要一项服务来帮助管理安全警报，并将警报组织到一个单一的仪表板中。公司应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"Amazon Macie"},{"l":"D","t":"AWS Security Hub"}],"a":["D"],"e":"AWS Security Hub 将来自各种 AWS 安全服务的发现汇总到一个单一的仪表板中，提供对安全警报的全面视图，并帮助公司有效管理其安全姿态。","s":"源#284"},{"id":"D2-286","d":2,"t":"single","q":"一家公司使用 Amazon S3 存储可能包含个人身份信息（PII）的记录。公司想要一个解决方案，可以监控所有 S3 存储桶中的 PII，并在发现漏洞时立即向员工发出警报。哪个 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"Amazon Detective"},{"l":"C","t":"Amazon Macie"},{"l":"D","t":"AWS Shield"}],"a":["C"],"e":"Amazon Macie 旨在发现、分类和保护 AWS 中的敏感数据，如 PII，包括监控 S3 存储桶并提供有关潜在漏洞的警报。","s":"源#286"},{"id":"D2-287","d":2,"t":"single","q":"哪个 AWS 服务允许用户按需下载有关 AWS 基础设施的安全和合规性报告？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"AWS Security Hub"},{"l":"C","t":"AWS Artifact"},{"l":"D","t":"AWS Shield"}],"a":["C"],"e":"AWS Artifact 是一个服务，使用户能够按需下载有关 AWS 基础设施的安全和合规性报告，提供广泛的合规性信息访问。","s":"源#287"},{"id":"D2-288","d":2,"t":"single","q":"外部审计师已请求一家公司提供其所有 IAM 用户列表，包括用户凭据和访问密钥的状态。提供此信息的最简单方法是什么？","o":[{"l":"A","t":"为审计师创建一个 IAM 用户账户，授予审计师管理员权限。"},{"l":"B","t":"截取 AWS 管理控制台中每个用户的页面的屏幕截图，然后将截图提供给审计师。"},{"l":"C","t":"下载 IAM 凭据报告，然后将报告提供给审计师。"},{"l":"D","t":"下载 AWS Trusted Advisor 报告，然后将报告提供给审计师。"}],"a":["C"],"e":"向外部审计师提供 IAM 用户列表以及他们凭据和访问密钥状态的最简单方法是下载 IAM 凭据报告。","s":"源#288"},{"id":"D2-289","d":2,"t":"single","q":"公司可以通过使用 AWS 云中的安全组执行哪些任务？","o":[{"l":"A","t":"仅通过特定端口允许访问 Amazon EC2 实例。"},{"l":"B","t":"在子网级别拒绝恶意 IP 地址的访问。"},{"l":"C","t":"保护 Amazon CloudFront 缓存的数据。"},{"l":"D","t":"对 Amazon EC2 实例应用无状态防火墙。"}],"a":["A"],"e":"AWS 中的安全组充当虚拟防火墙，控制对 Amazon EC2 实例的入站和出站流量。它们可以被配置为允许通过特定端口访问EC2 实例，有效管理允许实例的流量。","s":"源#289"},{"id":"D2-296","d":2,"t":"single","q":"一家公司有一个管理 IAM 策略，该策略没有授予用户完成所需任务所需的权限。如何解决问题？","o":[{"l":"A","t":"启用 AWS Shield 高级版。"},{"l":"B","t":"创建自定义 IAM 策略。"},{"l":"C","t":"从 AWS Marketplace 使用第三方 Web 应用程序防火墙（WAF）管理规则。"},{"l":"D","t":"使用 AWS 密钥管理服务（AWS KMS）创建客户管理的密钥。"}],"a":["B"],"e":"要解决管理 IAM 策略未提供足够权限的问题，可以创建一个自定义 IAM 策略，特别针对用户完成任务所需的权限。","s":"源#296"},{"id":"D2-297","d":2,"t":"single","q":"根据 AWS 共享责任模型，谁负责管理 IAM 用户访问和密钥？","o":[{"l":"A","t":"IAM 访问和密钥是静态的，因此无需旋转它们。"},{"l":"B","t":"客户负责旋转密钥。"},{"l":"C","t":"AWS 将在需要时旋转密钥。"},{"l":"D","t":"AWS 支持团队将在客户请求时旋转密钥。"}],"a":["B"],"e":"根据 AWS 共享责任模型，客户负责管理自己的 IAM 用户访问和密钥，包括旋转密钥以维护安全性。","s":"源#297"},{"id":"D2-298","d":2,"t":"single","q":"一家公司需要在 Amazon EC2 实例上运行预安装的第三方防火墙。哪个 AWS 服务或功能可以提供此解决方案？","o":[{"l":"A","t":"网络 ACLs"},{"l":"B","t":"安全组"},{"l":"C","t":"AWS Marketplace"},{"l":"D","t":"AWS Trusted Advisor"}],"a":["C"],"e":"AWS Marketplace 提供各种第三方软件解决方案，包括预安装的防火墙，可以部署在 Amazon EC2 实例上，以满足公司的安全要求。","s":"源#298"},{"id":"D2-300","d":2,"t":"single","q":"根据 AWS 共享责任模型，以下哪项完全由 AWS 负责？","o":[{"l":"A","t":"安全意识和培训"},{"l":"B","t":"开发 IAM 密码策略"},{"l":"C","t":"修补客户操作系统"},{"l":"D","t":"物理和环境控制"}],"a":["D"],"e":"AWS 负责共享责任模型中的物理和环境控制，包括云基础设施本身的安全和维护。","s":"源#300"},{"id":"D2-301","d":2,"t":"single","q":"AWS 账户根用户的特征是什么？","o":[{"l":"A","t":"根用户是唯一可以配置多因素认证（MFA）的用户。"},{"l":"B","t":"根用户是唯一可以访问 AWS 管理控制台的用户。"},{"l":"C","t":"根用户是在创建 AWS 账户时可用的第一种身份。"},{"l":"D","t":"根用户的密码不能更改。"}],"a":["C"],"e":"根用户是在首次设置 AWS 账户时创建的初始身份，允许初始账户持有人登录并配置账户。","s":"源#301"},{"id":"D2-304","d":2,"t":"single","q":"一家公司想要将非结构化数据迁移到 AWS。数据需要安全移动，具有洞察力的加密和端到端数据验证。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS 应用程序迁移服务"},{"l":"B","t":"Amazon Elastic File System（Amazon EFS）"},{"l":"C","t":"AWS DataSync"},{"l":"D","t":"AWS 迁移中心"}],"a":["C"],"e":"AWS DataSync 旨在安全地将数据传输到 AWS，提供飞行中加密和端到端数据验证，以确保迁移数据的完整性和安全性。","s":"源#304"},{"id":"D2-306","d":2,"t":"single","q":"一家公司想要快速实施持续集成/持续交付（CI/CD）流水线。哪家 AWS 服务将满足这一要求？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"Amazon Cognito"},{"l":"C","t":"AWS DataSync"},{"l":"D","t":"AWS CodeStar"}],"a":["D"],"e":"AWS CodeStar 提供了一个统一的界面和预配置的项目模板，与其他 AWS 服务集成，快速设置 CI/CD 流水线，简化软件发布过程。","s":"源#306"},{"id":"D2-309","d":2,"t":"single","q":"哪项 AWS 服务或功能允许管理员为多名员工提供桌面环境？","o":[{"l":"A","t":"AWS Organizations"},{"l":"B","t":"AWS Fargate"},{"l":"C","t":"AWS WAF"},{"l":"D","t":"AWS WorkSpaces"}],"a":["D"],"e":"AWS WorkSpaces 是基于云的桌面计算服务，允许管理员为用户配置和管理桌面环境，提供一种安全、可扩展的解决方案，可从各种设备访问桌面。","s":"源#309"},{"id":"D2-310","d":2,"t":"single","q":"哪项 AWS 服务或功能使用户能够捕获有关 VPC 中网络流量的信息？","o":[{"l":"A","t":"VPC 流日志"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"VPC 路由表"},{"l":"D","t":"AWS CloudTrail"}],"a":["A"],"e":"VPC 流日志是一项功能，可捕获有关进出 VPC 中网络接口的 IP 流量的信息，提供对网络流量模式和行为的可见性。","s":"源#310"},{"id":"D2-319","d":2,"t":"single","q":"哪个 AWS 功能为 AWS 用户提供了一个无成本的平台，用于加入社区团体，提问，找到答案，并阅读社区生成的关于最佳实践的文章？","o":[{"l":"A","t":"AWS 知识中心"},{"l":"B","t":"AWS re:Post"},{"l":"C","t":"AWS IQ"},{"l":"D","t":"AWS 企业支持"}],"a":["B"],"e":"AWS re:Post 是一个无成本的平台，为 AWS 用户提供了一个社区空间，用于提问，找到答案，并与其他用户进行交流。用户可以加入社区团体，参与讨论，并阅读社区生成的关于最佳实践的文章，使其成为满足这些要求的理想功能。","s":"源#319"},{"id":"D2-324","d":2,"t":"single","q":"开发人员可以通过哪种机制从应用程序代码中访问 AWS 服务？","o":[{"l":"A","t":"AWS 软件开发工具包"},{"l":"B","t":"AWS 管理控制台"},{"l":"C","t":"AWS CodePipeline"},{"l":"D","t":"AWS Config"}],"a":["A"],"e":"AWS 软件开发工具包（SDK）是开发人员从应用程序代码中访问 AWS 服务的机制。SDK 提供了可以用于以编程方式与AWS 服务交互的库和 API，支持多种编程语言，使将 AWS 服务集成到应用程序中变得更加容易。","s":"源#324"},{"id":"D2-325","d":2,"t":"single","q":"一家公司正在迁移到 AWS 云。公司想要了解和识别潜在的安全配置错误或意外行为。公司想要优先考虑它可能需要的任何保护控制。哪个 AWS 云采用框架（AWS CAF）安全视角能力将满足这些要求？","o":[{"l":"A","t":"身份和访问管理"},{"l":"B","t":"威胁检测"},{"l":"C","t":"平台工程"},{"l":"D","t":"可用性和连续性管理"}],"a":["B"],"e":"AWS 云采用框架安全视角中的威胁检测能力使组织能够了解和识别潜在的安全配置错误、威胁或意外行为。此能力有助于优先考虑安全迁移到 AWS 云所需的保护控制。","s":"源#325"},{"id":"D2-334","d":2,"t":"single","q":"根据 AWS 共享责任模型，以下哪项是 AWS 的责任？","o":[{"l":"A","t":"应用数据安全"},{"l":"B","t":"在 Amazon EC2 实例上运行的应用程序的补丁管理"},{"l":"C","t":"管理服务的底层基础设施的补丁管理"},{"l":"D","t":"应用身份和访问管理"}],"a":["C"],"e":"根据 AWS 共享责任模型，AWS 负责云的安全性，其中包括管理服务的底层基础设施的补丁管理（C）。客户负责云中的安全性，涉及保护他们的应用程序和管理访问。","s":"源#334"},{"id":"D2-336","d":2,"t":"single","q":"一家公司想要生成 IAM 用户的列表。公司还想要查看与用户相关联的各种凭据的状态，如密码、访问密钥和多因素认证（MFA）设备。哪个 AWS 服务或功能将满足这些要求？","o":[{"l":"A","t":"IAM 凭据报告"},{"l":"B","t":"AWS IAM 身份中心（AWS 单点登录）"},{"l":"C","t":"AWS 身份和访问管理访问分析器"},{"l":"D","t":"AWS 成本和使用情况报告"}],"a":["A"],"e":"IAM 凭据报告是 AWS 身份和访问管理（IAM）内的一个功能，提供了一种审核 AWS 账户中所有 IAM 用户凭据状态的方法。它包括有关密码、访问密钥和 MFA 设备的信息，使其成为满足公司生成 IAM 用户列表和查看相关凭据状态要求的适当服务。","s":"源#336"},{"id":"D2-339","d":2,"t":"single","q":"一家公司想要使用单一凭据集允许用户对多个 AWS 账户进行身份验证和授权。哪个AWS 服务或资源将满足这个要求？","o":[{"l":"A","t":"AWS 组织"},{"l":"B","t":"IAM 用户"},{"l":"C","t":"AWS IAM 身份中心（AWS 单点登录）"},{"l":"D","t":"AWS 控制塔"}],"a":["C"],"e":"AWS IAM 身份中心，也称为 AWS 单点登录（SSO），使用户能够使用单一凭据集对多个 AWS 账户进行身份验证和授权。这简化了多账户环境中的访问管理。","s":"源#339"},{"id":"D2-343","d":2,"t":"single","q":"一家公司正在从本地迁移其应用程序到 AWS 云。公司想要确保应用程序只分配执行所有操作所需的最低权限。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS 身份和访问管理（IAM）"},{"l":"B","t":"Amazon CloudWatch"},{"l":"C","t":"Amazon Macie"},{"l":"D","t":"Amazon GuardDuty"}],"a":["A"],"e":"AWS 身份和访问管理（IAM）允许精确控制分配给应用程序和用户的权限，确保他们在 AWS 云中执行操作所需的最低访问权限。","s":"源#343"},{"id":"D2-344","d":2,"t":"multiple","q":"哪些选项是 AWS 云采用框架（AWS CAF）治理视角能力？（选择两个）","o":[{"l":"A","t":"身份和访问管理"},{"l":"B","t":"云财务管理"},{"l":"C","t":"应用程序组合管理"},{"l":"D","t":"创新管理"},{"l":"E","t":"产品管理"}],"a":["B","C"],"e":"从 AWS 云采用框架（AWS CAF）的治理视角来看，治理视角能力的正确选项是：B. 云财务管理 C. 应用程序组合管理以下是对这些能力的简要解释：1. 云财务管理：此能力聚焦于规划、衡量和优化云支出。它涵盖明确财务角色与职责，采用动态预测和预算流程，以及构建规范云使用的防护措施。2. 应用程序组合管理：该能力有助于管理和优化应用程序，以支持业务战略。这包括识别关键应用程序、评估其健康状况，并尽量减少应用程序的无序扩展。其他选项并非 AWS CAF 治理视角的特定组成部分： - 身份与访问管理通常属于安全视角。- 创新管理和产品管理在 AWS CAF 中并未明确列为治理视角能力。需要注意的是，AWS CAF 旨在帮助组织为其云采用之旅制定高效且有效的计划。特别是治理视角，专注于在使转型相关风险最小化的同时，实现组织效益最大化。如需获取关于 AWS 云采用框架的最新且详细信息，建议参考 AWS 官方文档。","s":"源#344"},{"id":"D2-345","d":2,"t":"single","q":"哪家 AWS 服务提供单一位置以跟踪应用程序迁移的进展？","o":[{"l":"A","t":"AWS 应用程序发现服务"},{"l":"B","t":"AWS 应用程序迁移服务"},{"l":"C","t":"AWS 服务目录"},{"l":"D","t":"AWS 迁移中心"}],"a":["D"],"e":"AWS 迁移中心旨在提供跟踪应用程序迁移进展的集中位置，提供对应用程序组合的可见性，并简化规划和跟踪。","s":"源#345"},{"id":"D2-346","d":2,"t":"multiple","q":"一家公司使用最新的 Amazon Linux 2 Amazon Machine Image（AMI）启动了 Amazon EC2 实例。系统管理员可以采取哪些操作连接到 EC2 实例？（选择两个）","o":[{"l":"A","t":"使用 Amazon EC2 实例连接。"},{"l":"B","t":"使用远程桌面协议（RDP）连接。"},{"l":"C","t":"使用 AWS 批处理。"},{"l":"D","t":"使用 AWS 系统管理会话管理器。"},{"l":"E","t":"使用 Amazon Connect。"}],"a":["A","D"],"e":"系统管理员可以使用 Amazon EC2 实例连接（A）进行简单安全的 SSH 连接到 Amazon Linux 2 EC2 实例，并使用 AWS 系统管理会话管理器（D）进行安全和可审计的连接，而不需要公共 IP 地址或标准入口安全组。","s":"源#346"},{"id":"D2-348","d":2,"t":"single","q":"哪个任务需要用户以 AWS 账户根用户身份登录？","o":[{"l":"A","t":"删除 IAM 用户"},{"l":"B","t":"删除 AWS 账户"},{"l":"C","t":"在 AWS 组织中创建组织"},{"l":"D","t":"删除 Amazon EC2 实例"}],"a":["B"],"e":"删除 AWS 账户是一项只能由 AWS 账户根用户执行的任务，根用户具有与账户电子邮件地址相关联的最高访问级别。","s":"源#348"},{"id":"D2-352","d":2,"t":"single","q":"哪家 AWS 服务或组件允许从互联网进入 VPC 的入站流量？","o":[{"l":"A","t":"互联网网关"},{"l":"B","t":"NAT 网关"},{"l":"C","t":"AWS WAF"},{"l":"D","t":"VPC 对等"}],"a":["A"],"e":"互联网网关是一个 VPC 组件，允许 VPC 与互联网通信。它支持 IPv4 和 IPv6 流量，并提供一种不会导致可用性风险或带宽限制的连接。","s":"源#352"},{"id":"D2-354","d":2,"t":"single","q":"哪个准则是构建云应用程序的良好构建设计原则？","o":[{"l":"A","t":"将静态数据保持在计算资源附近。"},{"l":"B","t":"为峰值容量预置资源。"},{"l":"C","t":"设计以实现从故障中自动恢复。"},{"l":"D","t":"使用紧密耦合的组件。"}],"a":["C"],"e":"设计以实现从故障中自动恢复是 AWS 良好构建框架的关键原则。它强调将弹性构建到云应用程序中的重要性，以确保它们可以自动从故障中恢复。","s":"源#354"},{"id":"D2-367","d":2,"t":"single","q":"一家公司想要将自然语言处理（NLP）集成到商业智能（BI）仪表板中。公司想要提出问题并收到带有相关可视化的答案。哪个 AWS 服务或工具将满足这些要求？","o":[{"l":"A","t":"Amazon Macie"},{"l":"B","t":"Amazon Rekognition"},{"l":"C","t":"Amazon QuickSight Q"},{"l":"D","t":"Amazon Lex"}],"a":["C"],"e":"Amazon QuickSight Q 是一个服务，允许将自然语言处理（NLP）集成到商业智能（BI）仪表板中。它允许用户使用自然语言提问并收到带有相关可视化的答案，增强了数据查询和探索的交互性和对话体验。","s":"源#367"},{"id":"D2-373","d":2,"t":"single","q":"哪个 AWS 服务使公司更容易监视和排除应用程序日志和云资源的故障？","o":[{"l":"A","t":"Amazon EC2"},{"l":"B","t":"AWS 身份和访问管理（IAM）"},{"l":"C","t":"Amazon CloudWatch"},{"l":"D","t":"AWS CloudTrail"}],"a":["C"],"e":"Amazon CloudWatch 是简化监视和排除应用程序日志和云资源故障的 AWS 服务。它提供收集和跟踪指标、监视日志文件、设置警报和获得对资源利用和应用程序性能的系统级可见性的功能。","s":"源#373"},{"id":"D2-384","d":2,"t":"single","q":"根据 AWS 共享责任模型，以下哪项是 AWS 的责任？","o":[{"l":"A","t":"应用数据安全"},{"l":"B","t":"在 Amazon EC2 实例上运行的应用程序的补丁管理"},{"l":"C","t":"管理服务的底层基础设施的补丁管理"},{"l":"D","t":"应用身份和访问管理"}],"a":["C"],"e":"根据 AWS 共享责任模型，AWS 负责云的安全性，其中包括管理服务的底层基础设施的补丁管理（C）。客户负责云中的安全性，涉及保护他们的应用程序和管理访问。","s":"源#384"},{"id":"D2-385","d":2,"t":"single","q":"哪个 AWS 服务或资源可以识别并报告一个 AWS 账户中的 IAM 资源与另一个AWS 账户共享的情况？","o":[{"l":"A","t":"IAM 凭据报告"},{"l":"B","t":"AWS IAM 身份中心（AWS 单点登录）"},{"l":"C","t":"AWS 身份和访问管理访问分析器"},{"l":"D","t":"Amazon Cognito 用户池"}],"a":["C"],"e":"AWS 身份和访问管理访问分析器（C）是服务，可以识别并报告一个 AWS 账户中的 IAM 资源与另一个 AWS 账户共享的情况。它有助于分析资源访问策略，包括跨账户共享的策略。","s":"源#385"},{"id":"D2-391","d":2,"t":"single","q":"一家公司想要管理劳动力用户的登录安全性。公司需要创建劳动力用户，并集中管理他们在公司所有AWS 账户和应用程序中的访问权限。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS AWS Audit Manager"},{"l":"B","t":"Amazon Cognito"},{"l":"C","t":"AWS 安全中心"},{"l":"D","t":"AWS IAM 身份中心（AWS 单点登录）"}],"a":["D"],"e":"AWS IAM 身份中心，也称为 AWS 单点登录（SSO），是允许集中管理和访问控制劳动力用户跨 AWS 账户和应用程序的服务。它允许创建和管理用户，通过单点登录控制访问，并执行多因素身份验证。","s":"源#391"},{"id":"D2-392","d":2,"t":"single","q":"一家公司想要一份报告，列出公司 AWS 账户中所有用户使用的多因素认证（MFA）设备的状态。哪个 AWS 功能或服务将满足这个要求？","o":[{"l":"A","t":"AWS 成本和使用情况报告"},{"l":"B","t":"IAM 凭据报告"},{"l":"C","t":"详细计费报告"},{"l":"D","t":"AWS 成本探索器报告"}],"a":["B"],"e":"（本题缺解析，源文件无解析文字）","s":"源#392"},{"id":"D2-394","d":2,"t":"single","q":"一家公司正在 AWS 云中推出移动应用程序。公司希望应用程序的用户可以通过社交媒体身份提供者（IdP）进行登录。哪家 AWS 服务将满足这个要求？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"Amazon Cognito"},{"l":"C","t":"AWS Secrets Manager"},{"l":"D","t":"Amazon CloudFront"}],"a":["B"],"e":"Amazon Cognito 是 AWS 服务，允许对移动和 Web 应用程序进行用户认证和访问控制。它支持 Facebook、Google 和Amazon 等社交媒体身份提供者（IdP），允许用户通过他们的社交媒体账户登录。","s":"源#394"},{"id":"D2-396","d":2,"t":"single","q":"使用 AWS 成本探索器演示了哪个云概念？","o":[{"l":"A","t":"正确尺寸"},{"l":"B","t":"可靠性"},{"l":"C","t":"弹性"},{"l":"D","t":"现代化"}],"a":["A"],"e":"AWS 成本探索器是一个工具，演示了云概念的正确尺寸。它有助于可视化、理解和管理 AWS 成本和使用情况，使用户能够根据实际使用情况和成本识别和优化资源分配。","s":"源#396"},{"id":"D2-398","d":2,"t":"single","q":"哪个 AWS 服务或工具使用户能够以编程方式连接 AWS 并部署资源？","o":[{"l":"A","t":"Amazon QuickSight"},{"l":"B","t":"AWS PrivateLink"},{"l":"C","t":"AWS Direct Connect"},{"l":"D","t":"AWS SDKs"}],"a":["D"],"e":"AWS SDKs（软件开发工具包）是提供开发人员连接 AWS 服务并编程部署资源的工具。它们支持多种编程语言，允许开发人员通过他们选择的语言与 AWS 服务交互。","s":"源#398"},{"id":"D2-405","d":2,"t":"single","q":"一家公司需要合并多个 AWS 账户的计费。公司需要使用一个账户代表所有其他账户支付。公司应该使用哪个 AWS 服务或工具来满足这个要求？","o":[{"l":"A","t":"AWS 信任顾问"},{"l":"B","t":"AWS 组织"},{"l":"C","t":"AWS 预算"},{"l":"D","t":"AWS 服务目录"}],"a":["B"],"e":"AWS 组织是一个服务，使您能够合并和集中管理多个 AWS 账户。它允许您设置策略和标准，这些策略和标准会自动应用到您的组织中，确保一致的治理和合规性。这个服务非常适合需要简化多个账户的计费和管理的公司。","s":"源#405"},{"id":"D2-408","d":2,"t":"single","q":"用户在哪里可以找到 AWS 云解决方案设计的例子？","o":[{"l":"A","t":"AWS 市场"},{"l":"B","t":"AWS 服务目录"},{"l":"C","t":"AWS 架构中心"},{"l":"D","t":"AWS 信任顾问"}],"a":["C"],"e":"AWS 架构中心是一个资源，用户可以找到各种 AWS 云解决方案设计。它提供了架构图和最佳实践，帮助用户在 AWS 上设计和构建他们的解决方案，满足广泛的用例。","s":"源#408"},{"id":"D2-409","d":2,"t":"single","q":"一家公司正在使用 Amazon RDS。使用 Amazon RDS 时，公司的哪项任务是责任？","o":[{"l":"A","t":"配置底层基础设施。"},{"l":"B","t":"创建 IAM 策略以控制对服务的管理访问。"},{"l":"C","t":"安装连接计算和存储硬件的电缆。"},{"l":"D","t":"安装和修补 RDS 操作系统。"}],"a":["B"],"e":"使用 Amazon RDS 时，公司的一项责任是创建 IAM（AWS 身份和访问管理）策略，以控制对服务的管理访问。这确保只有授权用户才能管理和访问 RDS 实例，维护安全性和合规性。","s":"源#409"},{"id":"D2-412","d":2,"t":"single","q":"一家公司需要检查最近没有旋转的 IAM 访问密钥。公司应该使用哪个 AWS 服务来满足这个要求？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"AWS Shield"},{"l":"C","t":"Amazon Cognito"},{"l":"D","t":"AWS 信任顾问"}],"a":["D"],"e":"AWS 信任顾问是一个服务，提供建议和见解，帮助用户优化他们的 AWS 基础设施。它包括检查各种最佳实践，包括IAM访问密钥的旋转。通过使用信任顾问，公司可以识别最近没有旋转的密钥，并采取适当的行动以维护安全性。","s":"源#412"},{"id":"D2-413","d":2,"t":"single","q":"一家公司在 VPC 中运行许多 Amazon EC2 实例。公司想要使用原生 AWS 安全资源来控制特定EC2 实例之间的网络流量。哪个 AWS 服务或功能将满足这个要求？","o":[{"l":"A","t":"网络 ACLs"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"安全组"}],"a":["D"],"e":"安全组充当 Amazon EC2 实例的虚拟防火墙，以控制入站和出站流量。它们是保护 VPC 内实例的安全的重要组成部分，允许在每个实例的基础上对网络流量进行调节，这符合控制特定 EC2 实例之间流量的要求。","s":"源#413"},{"id":"D2-415","d":2,"t":"single","q":"一家公司正在 AWS 上构建新应用程序。公司需要应用程序在单个应用程序组件失败时保持可用。为了满足这个要求，公司应该使用哪个设计原则？","o":[{"l":"A","t":"可处置资源"},{"l":"B","t":"自动化"},{"l":"C","t":"正确尺寸"},{"l":"D","t":"松散耦合"}],"a":["D"],"e":"松散耦合是一个设计原则，涉及创建在很大程度上相互独立的应用程序组件。这种方法允许单个组件失败而不影响整个应用程序，从而提高系统的总体可用性和弹性。","s":"源#415"},{"id":"D2-416","d":2,"t":"single","q":"一家公司想要使用一个托管服务来识别和保护存储在 Amazon S3 中的敏感数据。哪家AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS IAM 访问分析器"},{"l":"B","t":"Amazon GuardDuty"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"Amazon Macie"}],"a":["D"],"e":"Amazon Macie 是一个完全托管的服务，使用机器学习和模式匹配来发现和保护 AWS 中的敏感数据，如 PII/PHI。它有助于监视和管理系统中敏感数据的安全性，自动识别潜在的数据访问或泄露问题。","s":"源#416"},{"id":"D2-417","d":2,"t":"single","q":"哪个 AWS 服务或功能可以让用户在子网级别限制网络访问？","o":[{"l":"A","t":"AWS Shield"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"网络 ACL"},{"l":"D","t":"安全组"}],"a":["C"],"e":"网络 ACL（访问控制列表）是一个功能，为子网内的资源提供网络级访问控制。它们作为子网的防火墙，比在实例级别运行的安全组，更细粒度地控制入站和出站流量。","s":"源#417"},{"id":"D2-418","d":2,"t":"single","q":"一家公司想要在云端管理加密密钥。可以使用哪个 AWS 服务？","o":[{"l":"A","t":"AWS License Manager"},{"l":"B","t":"AWS 证书管理器（ACM）"},{"l":"C","t":"AWS CloudHSM"},{"l":"D","t":"AWS 目录服务"}],"a":["C"],"e":"AWS CloudHSM（硬件安全模块）服务允许您以高度安全的方式轻松生成和管理加密密钥。它旨在通过确保加密密钥安全存储和管理来保护数据。","s":"源#418"},{"id":"D2-422","d":2,"t":"single","q":"AWS 云采用框架（AWS CAF）哪个视角侧重于大规模管理身份和权限？","o":[{"l":"A","t":"运营"},{"l":"B","t":"平台"},{"l":"C","t":"治理"},{"l":"D","t":"安全"}],"a":["D"],"e":"AWS 云采用框架（AWS CAF）的安全视角涉及大规模管理身份和权限。它提供实施整个 AWS 环境中的强大安全措施的指导，确保执行和遵守访问控制策略。","s":"源#422"},{"id":"D2-423","d":2,"t":"single","q":"哪个 AWS 服务或功能允许用户安全地存储加密的凭据，并在需要时检索这些凭据？","o":[{"l":"A","t":"AWS 加密 SDK"},{"l":"B","t":"AWS 安全中心"},{"l":"C","t":"AWS Secrets Manager"},{"l":"D","t":"AWS Artifact"}],"a":["C"],"e":"AWS Secrets Manager 是一个服务，帮助您保护对应用程序、服务和 IT 资源的访问。它允许您安全地存储、管理和检索凭据，例如数据库密码、API 密钥和其他机密。该服务确保敏感信息被加密，并且只能被授权实体访问。","s":"源#423"},{"id":"D2-428","d":2,"t":"multiple","q":"一家公司想要为其员工提供对 Amazon RDS 的访问权限。公司还希望将交互限制为仅使用AWS CLI 和 AWS 软件开发工具包（SDK）。为了满足这些要求并遵循最小权限原则，公司应该采取哪些组合行动？（选择两个）","o":[{"l":"A","t":"创建 IAM 用户并仅提供 AWS 管理控制台访问权限。"},{"l":"B","t":"创建 IAM 用户并仅提供程序访问权限。"},{"l":"C","t":"创建 IAM 角色并仅提供 AWS 管理控制台访问权限。"},{"l":"D","t":"创建具有管理员访问权限的 IAM 策略，并将其附加到 IAM 用户。"},{"l":"E","t":"创建具有 Amazon RDS 访问权限的 IAM 策略，并将其附加到 IAM 用户。"}],"a":["B","E"],"e":"为了遵守最小权限原则，公司应该创建一个 IAM 用户，该用户仅具有通过 AWS CLI 和 SDK 与 Amazon RDS 交互所必需的权限。选项B，创建 IAM 用户并仅提供程序访问权限，满足此要求。此外，选项 E，创建具有特定 Amazon RDS 访问权限的 IAM 策略并将其附加到IAM用户，确保员工具有执行任务所需的最低权限，而没有过多的权限。","s":"源#428"},{"id":"D2-433","d":2,"t":"single","q":"一家公司想要组织其用户，以便公司可以按组授予用户权限。公司可以使用哪个AWS 服务或工具来满足这个要求？","o":[{"l":"A","t":"安全组"},{"l":"B","t":"AWS 身份和访问管理（IAM）"},{"l":"C","t":"资源组"},{"l":"D","t":"AWS 安全中心"}],"a":["B"],"e":"AWS 身份和访问管理（IAM）允许组织管理用户和组，并设置控制访问 AWS 资源的权限。通过创建 IAM 组并将用户添加到这些组中，公司可以有效地一次管理多个用户的权限，满足按组组织用户和按组授予权限的要求。","s":"源#433"},{"id":"D2-434","d":2,"t":"multiple","q":"一家公司想要在 AWS Lambda 上使用 Python 代码运行 AWS Lambda。在 AWS 共享责任模型下，哪些任务将是公司的责任？（选择两个）","o":[{"l":"A","t":"管理底层基础设施。"},{"l":"B","t":"管理操作系统。"},{"l":"C","t":"编写业务逻辑代码。"},{"l":"D","t":"安装计算机语言运行时。"},{"l":"E","t":"提供 AWS 身份和访问管理（IAM）对 Lambda 服务的访问权限。"}],"a":["C","E"],"e":"根据 AWS 共享责任模型，客户负责某些安全方面的任务，而 AWS 负责其他任务。在 AWS Lambda 的情况下，公司负责编写业务逻辑代码（C）和管理 IAM 访问（E）对 Lambda 服务。AWS 处理底层基础设施和操作系统管理。","s":"源#434"},{"id":"D2-435","d":2,"t":"single","q":"一家公司需要确定谁在特定时间段内访问了 AWS 服务以及执行了什么操作。公司应该使用哪个AWS服务来满足这个要求？","o":[{"l":"A","t":"Amazon CloudWatch"},{"l":"B","t":"AWS CloudTrail"},{"l":"C","t":"AWS 安全中心"},{"l":"D","t":"Amazon Inspector"}],"a":["B"],"e":"AWS CloudTrail 是一个服务，可实现对 AWS 和 AWS Marketplace 订阅的治理、合规性、运营审计和风险审计。它提供AWS 账户活动事件的历史记录，包括 IAM 用户采取的操作，通过这些操作，公司可以确定谁访问了 AWS 服务以及执行了什么操作。","s":"源#435"},{"id":"D2-436","d":2,"t":"single","q":"一家公司想要使用一个集中式的 AWS 服务来强制执行符合组织业务标准的情况。公司想要使用一个AWS 服务，可以治理和控制谁可以部署、管理和退役 AWS 资源。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon CloudWatch"},{"l":"B","t":"AWS 服务目录"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"AWS 安全中心"}],"a":["B"],"e":"（本题缺解析，源文件无解析文字）","s":"源#436"},{"id":"D2-437","d":2,"t":"single","q":"\"云的安全性\"在 AWS 共享责任模型中指的是什么？","o":[{"l":"A","t":"AWS 服务的可用性，如 Amazon EC2"},{"l":"B","t":"运行所有 AWS 服务的云基础设施的安全性"},{"l":"C","t":"为 IAM 用户实施密码策略"},{"l":"D","t":"通过使用 AWS 网络防火墙合作伙伴确保客户环境的安全性"}],"a":["B"],"e":"在 AWS 共享责任模型中，\"云的安全性\"指的是 AWS 拥有和管理的底层云基础设施的安全性。这包括 AWS 数据中心、服务器和网络设备的物理和环境安全性。","s":"源#437"},{"id":"D2-447","d":2,"t":"single","q":"为了提高 AWS 账户的安全性，公司应该采取哪些行动？","o":[{"l":"A","t":"为特权用户要求多因素认证（MFA）。"},{"l":"B","t":"删除根用户账户。"},{"l":"C","t":"为 AWS 账户根用户创建访问密钥。"},{"l":"D","t":"为每个特权用户创建访问密钥。"}],"a":["A"],"e":"为特权用户要求多因素认证（MFA）通过除了标准的用户名和密码之外，还需要第二种形式的验证，为 AWS 账户增加了额外的安全层。这使得未经授权的用户更难访问敏感资源。","s":"源#447"},{"id":"D2-448","d":2,"t":"multiple","q":"以下哪些是提高 AWS 安全性的方法？（选择两个）","o":[{"l":"A","t":"使用 AWS Artifact"},{"l":"B","t":"为所有 IAM 角色授予最广泛的权限"},{"l":"C","t":"使用 AWS Cloud 运行应用程序代码"},{"l":"D","t":"在 Amazon Cognito 上启用多因素认证（MFA）"},{"l":"E","t":"使用 AWS Trusted Advisor 安全检查"}],"a":["D","E"],"e":"在 Amazon Cognito 上启用多因素认证（MFA）通过要求用户提供两种身份识别形式来增加安全性。使用 AWS Trusted Advisor 安全检查通过提供最佳实践和潜在安全问题的建议和检查来帮助提高安全性。","s":"源#448"},{"id":"D2-449","d":2,"t":"single","q":"公司可以使用哪个 AWS 服务在云端管理加密密钥？","o":[{"l":"A","t":"AWS License Manager"},{"l":"B","t":"AWS 证书管理器（ACM）"},{"l":"C","t":"AWS CloudHSM"},{"l":"D","t":"AWS 目录服务"}],"a":["C"],"e":"AWS CloudHSM 是基于云的硬件安全模块（HSM）服务，使您能够以高度安全的方式轻松生成和管理加密密钥。它旨在通过确保加密密钥安全存储和管理来保护数据。","s":"源#449"},{"id":"D2-457","d":2,"t":"single","q":"哪个 AWS 服务为用户提供 AWS 发布的报告、认证、认可和第三方证明？","o":[{"l":"A","t":"AWS Artifact"},{"l":"B","t":"AWS Trusted Advisor"},{"l":"C","t":"AWS Health Dashboard"},{"l":"D","t":"AWS Config"}],"a":["A"],"e":"AWS Artifact 是一个服务，提供按需访问 AWS 的安全和合规性报告。它提供了一系列合规性文件，包括 AWS 的 ISO、SOC 和PCI DSS报告，这可以帮助用户展示符合各种行业标准和法规的合规性。","s":"源#457"},{"id":"D2-460","d":2,"t":"single","q":"一家公司运营一个本地客户联系中心。公司需要迁移到一个基于云的解决方案，该解决方案可以提供人工智能功能以改善用户体验。哪个 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Wavelength"},{"l":"B","t":"AWS IAM 身份中心（AWS 单点登录）"},{"l":"C","t":"AWS Direct Connect"},{"l":"D","t":"Amazon Connect"}],"a":["D"],"e":"Amazon Connect 是一个基于云的客户联系中心服务，可以提供 AI 驱动的洞察力和自动化，以改善客户互动。它使公司能够通过轻松设置和管理任何规模的客户联系中心，提供更好的客户服务体验。","s":"源#460"},{"id":"D2-463","d":2,"t":"single","q":"一家公司想要安全地登录 Linux Amazon EC2 实例。公司如何实现这个目标？","o":[{"l":"A","t":"使用 SSH 密钥。"},{"l":"B","t":"使用 VPN。"},{"l":"C","t":"使用端到端加密。"},{"l":"D","t":"使用 Amazon Route 53。"}],"a":["A"],"e":"SSH 密钥为登录 Linux EC2 实例提供了一种安全方法，无需使用密码。AWS 支持 SSH 密钥对，用于对 EC2 Linux 实例进行身份验证，这通过消除基于密码的身份验证的需要来增强安全性。","s":"源#463"},{"id":"D2-468","d":2,"t":"single","q":"一家公司想要监控并阻止其 Amazon CloudFront 分发接收到的恶意 HTTP 和 HTTPS 请求。公司应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"AWS WAF"},{"l":"D","t":"Amazon Detective"}],"a":["C"],"e":"AWS WAF（Web 应用程序防火墙）旨在通过允许创建并应用规则到分发，来保护 Web 应用程序免受 SQL 注入和跨站脚本攻击。它监控并阻止恶意请求，提供对 Web 漏洞和机器人的保护。","s":"源#468"},{"id":"D2-470","d":2,"t":"single","q":"哪个 AWS 服务可以生成可供外部审计师使用的信息？","o":[{"l":"A","t":"Amazon Cognito"},{"l":"B","t":"Amazon FSx"},{"l":"C","t":"AWS Config"},{"l":"D","t":"Amazon Inspector"}],"a":["C"],"e":"AWS Config 是一项服务，提供 AWS 资源及其配置的详细清单，持续监控和记录它们的相互关系。这些信息可供外部审计师用来评估符合内部和外部标准的情况。","s":"源#470"},{"id":"D2-474","d":2,"t":"single","q":"一家公司需要在 AWS 组织内管理多个登录，跨同一个组织内的 AWS 账户。公司应该使用哪个AWS服务来满足这个要求？","o":[{"l":"A","t":"Amazon VPC"},{"l":"B","t":"Amazon GuardDuty"},{"l":"C","t":"Amazon Cognito"},{"l":"D","t":"AWS IAM 身份中心"}],"a":["D"],"e":"AWS IAM 身份中心，也称为 AWS 单点登录（AWS SSO），使您的员工可以使用他们现有的公司凭据，获得对所有AWS 云应用程序的单点登录访问，包括 AWS 管理控制台、业务应用程序以及 AWS 和非 AWS SaaS 应用程序。","s":"源#474"},{"id":"D2-475","d":2,"t":"single","q":"公司使用 Amazon WorkSpaces。根据 AWS 共享责任模型，AWS 的责任是什么？","o":[{"l":"A","t":"为每个 WorkSpaces 用户账户设置多因素认证（MFA）。"},{"l":"B","t":"确保托管 WorkSpaces 的 AWS 基础设施的环境安全和安全。"},{"l":"C","t":"通过 AWS 身份和访问管理（IAM）为 WorkSpaces 用户账户提供安全性。"},{"l":"D","t":"配置 AWS CloudTrail 记录 API 调用和用户活动。"}],"a":["B"],"e":"根据 AWS 共享责任模型，AWS 负责云的安全性，包括保护运行 AWS 云中所有服务的基础架构。这包括 AWS 数据中心的环境安全和安全。","s":"源#475"},{"id":"D2-477","d":2,"t":"single","q":"一家公司使用第三方身份提供者（IdP）。公司希望为其员工提供访问 AWS 账户和服务的权限，而不需要另一组登录凭据。哪个 AWS 服务将满足这个要求？","o":[{"l":"A","t":"AWS Directory Service"},{"l":"B","t":"Amazon Cognito"},{"l":"C","t":"AWS IAM 身份中心"},{"l":"D","t":"AWS 资源访问管理器（AWS RAM）"}],"a":["C"],"e":"AWS IAM 身份中心（AWS SSO）是一项服务，提供集中的用户目录，用于管理和提供对 AWS 账户和商业应用程序的访问。它允许用户使用他们现有的公司凭据访问多个 AWS 账户和应用程序，而无需创建和记住多组凭据。","s":"源#477"},{"id":"D2-479","d":2,"t":"single","q":"哪个 AWS 服务允许用户按需获取 AWS 合规性控制报告？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"Amazon GuardDuty"},{"l":"C","t":"AWS Trusted Advisor"},{"l":"D","t":"AWS Artifact"}],"a":["D"],"e":"AWS Artifact 是一项服务，提供按需访问 AWS 合规性报告和认证。它提供了一系列合规性文件，包括 AWS 的 ISO、SOC 和PCI DSS 报告，这可以帮助用户展示符合各种行业标准和法规的合规性。","s":"源#479"},{"id":"D2-482","d":2,"t":"multiple","q":"使用 AWS 身份和访问管理（IAM）的最佳实践建议有哪些？（选择两个）","o":[{"l":"A","t":"使用 AWS 账户根用户进行日常访问。"},{"l":"B","t":"在 Amazon EC2 上使用访问密钥和秘密访问密钥。"},{"l":"C","t":"定期旋转凭据。"},{"l":"D","t":"为系统管理员创建一组共享的访问密钥。"},{"l":"E","t":"配置多因素认证（MFA）"}],"a":["C","E"],"e":"AWS IAM 的最佳实践包括配置多因素认证（MFA）以增加安全性，并定期旋转凭据以限制泄露的密钥的潜在损害。还建议根据最少权限原则创建单独的 IAM 用户和角色，避免使用根账户进行日常访问。","s":"源#482"},{"id":"D2-483","d":2,"t":"single","q":"根据 AWS 共享责任模型，AWS 负责哪个选项？","o":[{"l":"A","t":"网络和防火墙配置"},{"l":"B","t":"客户端数据加密"},{"l":"C","t":"管理用户权限"},{"l":"D","t":"硬件和基础设施"}],"a":["D"],"e":"根据 AWS 共享责任模型，AWS 负责云的安全性，包括运行所有 AWS 服务的硬件和基础设施。客户负责云中的安全性，包括管理用户权限、网络配置和客户端数据加密。","s":"源#483"},{"id":"D2-487","d":2,"t":"single","q":"哪个 AWS 服务允许用户部署高度可重复的基础设施配置？","o":[{"l":"A","t":"AWS CloudFormation"},{"l":"B","t":"AWS CodeDeploy"},{"l":"C","t":"AWS CodeBuild"},{"l":"D","t":"AWS Systems Manager"}],"a":["A"],"e":"AWS CloudFormation 允许用户使用模板创建和管理 AWS 基础设施，这些模板可以进行版本控制并作为代码处理。这使得在AWS 环境中部署高度可重复和一致的基础设施配置成为可能。","s":"源#487"},{"id":"D2-490","d":2,"t":"single","q":"一家公司正在使用 AWS 构建一个 Web 应用程序。哪个 AWS 服务将帮助防止对Web 应用程序的网络层 DDoS 攻击？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"AWS Firewall Manager"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"AWS Shield"}],"a":["D"],"e":"AWS Shield 是一个管理型的 DDoS 保护服务，用于保护在 AWS 上运行的应用程序。它提供对网络层 DDoS 攻击的保护，这有助于确保Web 应用程序保持可用性和安全性。","s":"源#490"},{"id":"D2-493","d":2,"t":"single","q":"哪个 AWS 工具或功能在子网级别充当 VPC 防火墙？","o":[{"l":"A","t":"安全组"},{"l":"B","t":"网络 ACL"},{"l":"C","t":"流量镜像"},{"l":"D","t":"网关"}],"a":["B"],"e":"网络访问控制列表（ACL）在子网级别充当 VPC 防火墙。它们为 Amazon Virtual Private Cloud（VPC）子网提供网络级流量过滤，并作为控制入站和出站流量的额外安全层。","s":"源#493"},{"id":"D2-498","d":2,"t":"multiple","q":"一家公司正在了解其与 Amazon EC2 实例管理相关的责任。根据 AWS 共享责任模型，哪些EC2 实例任务是公司的职责？（选择两项。）","o":[{"l":"A","t":"安装并修补机器虚拟机。"},{"l":"B","t":"修补客户操作系统。"},{"l":"C","t":"对关联存储上的数据进行静态加密。"},{"l":"D","t":"安装物理硬件和布线。"},{"l":"E","t":"为 EC2 实例提供物理安全。"}],"a":["B","C"],"e":"根据 AWS 共享责任模型，客户负责云中的安全。这包括任务，例如修补 Amazon EC2 实例上的客户操作系统和对关联存储上的数据进行静态加密。AWS 负责云的安全，包括物理基础设施。","s":"源#498"},{"id":"D2-504","d":2,"t":"single","q":"哪个 AWS 服务或功能支持 AWS 账户的治理、合规性和风险审计？","o":[{"l":"A","t":"多因素认证（MFA）"},{"l":"B","t":"AWS Lambda"},{"l":"C","t":"Amazon Simple Notification Service (Amazon SNS)"},{"l":"D","t":"AWS CloudTrail"}],"a":["D"],"e":"AWS CloudTrail 是一个服务，通过提供用户、角色或 AWS 服务所采取行动的记录，支持 AWS 账户的治理、合规性和风险审计。它记录了您账户的 AWS API 调用，包括有关谁发起了调用、源 IP 地址等信息。","s":"源#504"},{"id":"D2-506","d":2,"t":"single","q":"一家公司需要一个威胁检测服务，该服务将连续监控其 AWS 账户、工作负载和Amazon S3 存储桶，以寻找恶意活动和未经授权的行为。哪个 AWS 服务满足这些要求？","o":[{"l":"A","t":"AWS Shield"},{"l":"B","t":"AWS Firewall Manager"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"Amazon Inspector"}],"a":["C"],"e":"Amazon GuardDuty 是一个威胁检测服务，连续监控 AWS 账户和工作负载（如 Amazon S3 存储桶）以寻找恶意活动或未经授权的行为。它使用先进的机器学习和异常检测技术来识别潜在威胁。","s":"源#506"},{"id":"D2-509","d":2,"t":"single","q":"哪个 AWS 服务支持移动和 Web 应用程序的用户注册功能和身份验证？","o":[{"l":"A","t":"Amazon Cognito"},{"l":"B","t":"AWS Config"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"AWS Systems Manager"}],"a":["A"],"e":"Amazon Cognito 是一项服务，可以轻松地为移动和 Web 应用程序添加用户注册、登录和访问控制。它与现有的第三方身份提供者集成，并提供用户资料管理和身份验证等功能。","s":"源#509"},{"id":"D2-511","d":2,"t":"single","q":"根据 AWS 共享责任模型，哪项任务是客户的责任？","o":[{"l":"A","t":"在 Amazon EC2 实例上部署的客户端操作系统打补丁。"},{"l":"B","t":"控制对 AWS 数据中心的物理访问。"},{"l":"C","t":"控制对 AWS 底层硬件的访问。"},{"l":"D","t":"在 Amazon S3 上部署的主机操作系统打补丁。"}],"a":["A"],"e":"根据 AWS 共享责任模型，客户负责云中的安全，其中包括任务，例如在 Amazon EC2 实例上部署的客户端操作系统打补丁。AWS 负责云的安全，包括对数据中心和底层硬件的物理访问。","s":"源#511"},{"id":"D2-512","d":2,"t":"single","q":"一家公司想要使用基础设施即代码（IaC）模板管理其云资源。公司需要满足合规性要求。公司应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS Artifact"},{"l":"B","t":"AWS Resource Explorer"},{"l":"C","t":"AWS License Manager"},{"l":"D","t":"AWS Service Catalog"}],"a":["D"],"e":"AWS Service Catalog 允许组织创建和管理已批准在 AWS 上使用的 IT 服务目录。它支持使用基础设施即代码（IaC）模板，并有助于通过确保资源根据定义的政策和标准部署来满足合规性要求。","s":"源#512"},{"id":"D2-514","d":2,"t":"single","q":"一家公司想要将其所有本地基础设施迁移到 AWS 云。在迁移之前，公司想要对其按原样运行的基础设施的成本进行估算。公司应该使用哪个 AWS 服务或原则来满足此要求？","o":[{"l":"A","t":"AWS 定价计算器"},{"l":"B","t":"AWS 良好架构框架"},{"l":"C","t":"AWS 共享责任模型"},{"l":"D","t":"AWS 云采用框架（AWS CA"}],"a":["A"],"e":"AWS 定价计算器是一个工具，帮助用户估算在 AWS 上运行其基础设施的成本。它允许用户输入预期的使用情况，并提供相关成本的估算，这对于计划和预算编制非常有用。","s":"源#514"},{"id":"D2-517","d":2,"t":"single","q":"哪个 AWS 服务支持公司将基础设施视为代码的能力？","o":[{"l":"A","t":"AWS CodeDeploy"},{"l":"B","t":"AWS Elastic Beanstalk"},{"l":"C","t":"Amazon API Gateway"},{"l":"D","t":"AWS CloudFormation"}],"a":["D"],"e":"AWS CloudFormation 提供了一种通用语言，用于描述和提供云环境中的所有基础设施资源。它允许用户通过使用 JSON 或YAML 定义和部署资源，将基础设施视为代码。","s":"源#517"},{"id":"D2-519","d":2,"t":"single","q":"一位 AWS 用户想要主动检测实例或账户可能被入侵或存在攻击威胁的情况。用户应该选择哪个AWS服务？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"AWS Shield"},{"l":"D","t":"Amazon Inspector"}],"a":["A"],"e":"Amazon GuardDuty 是一个威胁检测服务，连续监控 AWS 账户和工作负载，例如 Amazon S3 存储桶，寻找恶意活动或未经授权的行为。它使用机器学习和异常检测来识别潜在威胁，帮助用户主动检测和响应安全问题。","s":"源#519"},{"id":"D2-523","d":2,"t":"single","q":"一家公司必须使用一次写入、多次读取（WORM）模型来存档其文件，以满足法律和合规义务。公司可以使用哪个 Amazon S3 功能来满足此要求？","o":[{"l":"A","t":"S3 版本控制"},{"l":"B","t":"S3 存储桶策略"},{"l":"C","t":"S3 Glacier Vault Lock"},{"l":"D","t":"S3 多因素认证"}],"a":["C"],"e":"（MFA）删除 Amazon S3 Glacier Vault Lock 提供了一个功能，允许用户锁定他们的 S3 Glacier 存储类别，使数据成为一次写入、多次读取（WORM）和不可变的。这对于满足强制使用 WORM 模型进行数据保留的法律和合规要求非常有用。","s":"源#523"},{"id":"D2-526","d":2,"t":"single","q":"在 AWS 上存储密码的最安全方式是什么？","o":[{"l":"A","t":"将密码存储在 Amazon S3 存储桶中。"},{"l":"B","t":"将密码作为 AWS CloudFormation 参数存储。"},{"l":"C","t":"将密码存储在 AWS Storage Gateway 中。"},{"l":"D","t":"将密码存储在 AWS Secrets Manager 中。"}],"a":["D"],"e":"在 AWS 上存储密码的最安全方式是使用 AWS Secrets Manager。它是一项服务，旨在安全地存储、管理和检索密码、API 密钥和其他敏感数据。它提供强大的加密和访问控制以保护秘密。","s":"源#526"},{"id":"D2-534","d":2,"t":"multiple","q":"用户已被授权更改自己的 IAM 用户密码。用户可以使用哪些 AWS 服务来更改密码？（选择两项。）","o":[{"l":"A","t":"AWS 命令行界面（AWS CLI）"},{"l":"B","t":"AWS 密钥管理服务（AWS KMS）"},{"l":"C","t":"AWS 管理控制台"},{"l":"D","t":"AWS 资源访问管理器（AWS RAM）"},{"l":"E","t":"AWS Secrets Manager"}],"a":["A","C"],"e":"用户可以通过 AWS 管理控制台在“我的账户”部分下更改自己的 IAM 用户密码，或者使用 AWS CLI 和适当的命令来更改。AWS KMS 和 AWS Secrets Manager 不用于更改 IAM 用户密码，而 AWS RAM 用于资源共享，而不是密码管理。","s":"源#534"},{"id":"D2-536","d":2,"t":"single","q":"哪个 AWS 服务或功能在 VPC 中的子网级别提供防火墙？","o":[{"l":"A","t":"安全组"},{"l":"B","t":"网络 ACL"},{"l":"C","t":"弹性网络接口"},{"l":"D","t":"AWS WAF"}],"a":["B"],"e":"网络访问控制列表（ACL）在 Amazon 虚拟专用云（VPC）中的子网级别提供防火墙。它们用于控制子网内资源的入站和出站流量。","s":"源#536"},{"id":"D2-539","d":2,"t":"multiple","q":"使用 AWS 身份和访问管理（IAM）的最佳实践指南有哪些？（选择两项。）","o":[{"l":"A","t":"共享访问密钥。"},{"l":"B","t":"创建个人 IAM 用户。"},{"l":"C","t":"使用内联策略而不是客户管理策略。"},{"l":"D","t":"向 IAM 用户授予最大权限。"},{"l":"E","t":"使用组为 IAM 用户分配权限。"}],"a":["B","E"],"e":"AWS IAM 最佳实践包括创建个人 IAM 用户和使用组为 IAM 用户分配权限。这有助于遵守最小权限原则，并使权限管理更加容易。共享访问密钥和向用户授予最大权限不建议，因为它们可能导致安全风险。","s":"源#539"},{"id":"D2-540","d":2,"t":"single","q":"云计算的哪个优势允许用户根据应用程序支持的负载量来扩展资源？","o":[{"l":"A","t":"几分钟内走向全球"},{"l":"B","t":"停止猜测容量"},{"l":"C","t":"从大规模经济中获益"},{"l":"D","t":"将固定费用转换为变动费用"}],"a":["B"],"e":"“停止猜测容量”是云计算的一个关键优势。这使用户能够根据应用程序的实际负载匹配资源使用情况，优化性能和成本。","s":"源#540"},{"id":"D2-541","d":2,"t":"single","q":"一家公司正在请求支付卡行业（PCI）报告，以验证 AWS 安全控制的操作有效性。公司应如何获取这些报告？","o":[{"l":"A","t":"联系 AWS 支持。"},{"l":"B","t":"从 AWS Artifact 下载报告。"},{"l":"C","t":"从 AWS Security Hub 下载报告。"},{"l":"D","t":"联系 AWS 技术账户经理（TAM）。"}],"a":["B"],"e":"AWS Artifact 是 AWS 提供合规性报告的门户，包括来自支付卡行业的报告。公司可以访问和下载这些报告，以验证AWS 安全控制的操作有效性。","s":"源#541"},{"id":"D2-544","d":2,"t":"multiple","q":"根据 AWS 共享责任模型，以下哪些是 AWS 的责任？（选择两项。）","o":[{"l":"A","t":"网络基础设施和基础设施的虚拟化"},{"l":"B","t":"应用数据的安全性"},{"l":"C","t":"客户操作系统"},{"l":"D","t":"硬件的物理安全性"},{"l":"E","t":"凭据和策略"}],"a":["A","D"],"e":"在 AWS 共享责任模型中，AWS 负责云的安全性，包括硬件的物理安全性（D）和网络基础设施及基础设施的虚拟化（A）。应用数据的安全性（B）、客户操作系统（C）和凭据和策略（E）通常是客户的责任。","s":"源#544"},{"id":"D2-545","d":2,"t":"single","q":"一家公司使用 Amazon Aurora 作为其数据库服务。公司想要加密其数据库和数据库备份。根据AWS共享责任模型，哪一方管理数据库集群和数据库快照的加密？","o":[{"l":"A","t":"AWS"},{"l":"B","t":"公司"},{"l":"C","t":"AWS Marketplace 合作伙伴"},{"l":"D","t":"第三方合作伙伴"}],"a":["A"],"e":"根据 AWS 共享责任模型，AWS 管理 Amazon Aurora 数据库集群和数据库快照的加密。这意味着加密由 AWS 处理，确保数据在静止时受到保护。","s":"源#545"},{"id":"D2-546","d":2,"t":"single","q":"一家公司在 Amazon EC2 实例上托管了一个 Web 应用程序。公司想要实施自定义条件来过滤和控制入站 Web 流量。哪个 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"Amazon Macie"},{"l":"D","t":"AWS Shield"}],"a":["B"],"e":"AWS WAF（Web 应用程序防火墙）是一项服务，允许客户设置规则并创建 Web 应用程序防火墙以保护 Web 应用程序免受常见Web 漏洞的攻击。它支持实施自定义条件来过滤和控制入站 Web 流量，因此是满足此要求的适当选择。","s":"源#546"},{"id":"D2-549","d":2,"t":"single","q":"一家公司的员工正在家工作。公司希望其员工使用他们的个人设备连接到 AWS 云中的托管工作站。公司应该使用哪个 AWS 服务来提供远程环境？","o":[{"l":"A","t":"Amazon WorkSpaces"},{"l":"B","t":"AWS Cloud9"},{"l":"C","t":"AWS Outposts"},{"l":"D","t":"Amazon Lightsail"}],"a":["A"],"e":"Amazon WorkSpaces 是一个托管的、安全的桌面即服务（DaaS）解决方案，允许用户通过连接到基于云的桌面环境来远程工作。它非常适合在 AWS 云中提供可以从个人设备访问的托管工作站。","s":"源#549"},{"id":"D2-554","d":2,"t":"single","q":"一家公司需要一个防火墙来控制与单个 Amazon EC2 实例的网络连接。此防火墙将不控制与同一子网中的其他实例的网络连接。公司可以使用哪个 AWS 服务或功能来满足这些要求？","o":[{"l":"A","t":"网络 ACL"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"路由表"},{"l":"D","t":"安全组"}],"a":["D"],"e":"安全组在实例级别充当 Amazon EC2 实例的虚拟防火墙。它们控制单个实例的入站和出站流量，允许公司管理单个 EC2 实例的网络连接，而不影响同一子网中的其他实例。","s":"源#554"},{"id":"D2-563","d":2,"t":"single","q":"哪个 AWS 服务公司可以用来订阅 RSS 源，以获取有关所有 AWS 服务问题更新的信息？","o":[{"l":"A","t":"Amazon Simple Notification Service（Amazon SNS）"},{"l":"B","t":"AWS Health Dashboard"},{"l":"C","t":"AWS Config"},{"l":"D","t":"AWS CodeCommit"}],"a":["A"],"e":"Amazon SNS 是一项服务，使应用程序、服务和设备能够通过标准消息协议相互通信。公司可以使用 SNS 订阅 RSS 源，接收有关AWS服务问题的更新。","s":"源#563"},{"id":"D2-567","d":2,"t":"single","q":"一位新的 AWS 用户需要通过 API 调用与 AWS 支持交互。哪种 AWS 支持计划最经济地满足此要求？","o":[{"l":"A","t":"AWS 基础支持"},{"l":"B","t":"AWS 开发人员支持"},{"l":"C","t":"AWS 商业支持"},{"l":"D","t":"AWS 企业支持"}],"a":["C"],"e":"AWS 商业支持是包括通过 API 调用与 AWS 支持交互的能力的最经济的支持计划。它为企业提供了一系列技术支持和指导功能。","s":"源#567"},{"id":"D2-571","d":2,"t":"single","q":"一家公司想要集中管理其员工对多个 AWS 账户的访问。公司应该使用哪个 AWS 服务或功能来满足此要求？","o":[{"l":"A","t":"AWS 身份和访问管理访问分析器"},{"l":"B","t":"AWS Secrets Manager"},{"l":"C","t":"AWS IAM 身份中心"},{"l":"D","t":"AWS 安全令牌服务（AWS STS）"}],"a":["C"],"e":"AWS IAM 身份中心，也称为 AWS 单点登录（AWS SSO），允许组织集中管理对多个 AWS 账户的访问。它使用户可以使用相同的登录凭据访问多个账户，简化了身份管理和访问控制。","s":"源#571"},{"id":"D2-574","d":2,"t":"single","q":"一家公司有多个账户和团队，想要设置一个新的多账户 AWS 环境。哪个 AWS 服务支持此要求？","o":[{"l":"A","t":"AWS CloudFormation"},{"l":"B","t":"AWS Control Tower"},{"l":"C","t":"AWS Config"},{"l":"D","t":"Amazon 虚拟专用云（Amazon VP"}],"a":["B"],"e":"AWS Control Tower 旨在帮助 IT 和财务团队设置和管理多账户环境。它提供了工具来简化新账户的创建，建立安全和合规的护栏，并持续监控和审计账户。","s":"源#574"},{"id":"D2-576","d":2,"t":"single","q":"哪个 AWS 服务帮助用户规划和跟踪其服务器和应用程序库存迁移数据到 AWS？","o":[{"l":"A","t":"Amazon CloudWatch"},{"l":"B","t":"AWS DataSync"},{"l":"C","t":"AWS 迁移中心"},{"l":"D","t":"AWS 应用程序迁移服务"}],"a":["C"],"e":"AWS 迁移中心帮助用户规划和跟踪其服务器和应用程序库存迁移数据到 AWS。它提供了一个单一的位置来跟踪应用程序和资源的迁移状态，使管理迁移过程变得更加容易。","s":"源#576"},{"id":"D2-580","d":2,"t":"single","q":"哪些 AWS 服务或功能使用户能够以编程方式配置 AWS 基础设施？","o":[{"l":"A","t":"AWS 云开发工具包（AWS CDK）"},{"l":"B","t":"Amazon CodeGuru"},{"l":"C","t":"AWS 配置"},{"l":"D","t":"AWS CodeCommit"}],"a":["A"],"e":"AWS 云开发工具包（AWS CDK）是一个开源的软件开发框架，允许用户通过代码定义云基础设施，并通过 AWS CloudFormation 进行配置，从而使用户能够以编程方式配置 AWS 基础设施。","s":"源#580"},{"id":"D2-582","d":2,"t":"multiple","q":"以下哪些操作是由 AWS Identity and Access Management（IAM）控制的？（选择两项）","o":[{"l":"A","t":"控制对 AWS 服务 API 和其他特定资源的访问"},{"l":"B","t":"为应用程序提供针对常见网络攻击的防火墙保护。"},{"l":"C","t":"使用多因素身份验证（MFA）保护 AWS 环境。"},{"l":"D","t":"授予用户访问 AWS 数据中心的权限。"}],"a":["A","C"],"e":"AWS Identity and Access Management（IAM）用于控制对 AWS 服务 API 和其他特定资源的访问（A），并支持使用多因素身份验证（MFA）来增强 AWS 环境的安全性（C）。","s":"源#582"},{"id":"D2-584","d":2,"t":"single","q":"一家公司正在使用 AWS Identity and Access Management（IAM）。 谁可以管理AWS 账户根用户的访问密钥？","o":[{"l":"A","t":"同一账户中已被授予权限的 IAM 用户"},{"l":"B","t":"任何账户中已被授予权限的 IAM 角色"},{"l":"C","t":"已被授予权限的 IAM 用户和角色"},{"l":"D","t":"AWS 账户所有者"}],"a":["D"],"e":"AWS 账户根用户的访问密钥由 AWS 账户所有者管理。确保根用户访问密钥的安全非常重要，因为它们具有广泛的权限。","s":"源#584"},{"id":"D2-585","d":2,"t":"single","q":"在 AWS 账户和资源的安全与合规方面，哪一方与 AWS 共同承担责任？","o":[{"l":"A","t":"第三方供应商"},{"l":"B","t":"客户"},{"l":"C","t":"经销商合作伙伴"},{"l":"D","t":"互联网提供商"}],"a":["B"],"e":"在 AWS 共享责任模型中，客户与 AWS 共同承担其 AWS 账户和资源的安全和合规责任。客户负责某些方面，如配置安全设置、加密数据和管理对其资源的访问。","s":"源#585"},{"id":"D2-589","d":2,"t":"single","q":"一家公司的云环境包括 Amazon EC2 实例和 Application Load Balancers。该公司希望改善其云资源对DDoS 攻击的保护。该公司还希望对任何 DDoS 攻击具有实时可见性。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Shield Standard"},{"l":"B","t":"AWS Firewall Manager"},{"l":"C","t":"AWS Shield Advanced"},{"l":"D","t":"Amazon GuardDuty"}],"a":["C"],"e":"AWS Shield Advanced 提供增强的 DDoS 攻击防护，并提供对 DDoS 攻击的实时可见性和威胁检测，满足公司的需求。","s":"源#589"},{"id":"D2-591","d":2,"t":"single","q":"哪项 AWS 服务使用户能够在 AWS 区域之间创建资源的副本？","o":[{"l":"A","t":"Amazon ElastiCache"},{"l":"B","t":"AWS CloudFormation"},{"l":"C","t":"AWS CloudTrail"},{"l":"D","t":"AWS Systems Manager"}],"a":["B"],"e":"AWS CloudFormation 允许用户使用模板定义基础设施，并使用这些模板在 AWS 区域之间创建资源的副本，实现资源部署的一致性和自动化。","s":"源#591"},{"id":"D2-595","d":2,"t":"single","q":"一家公司希望管理其第三方软件即服务（SaaS）应用程序的访问和权限。该公司希望使用一个门户，使最终用户可以访问分配的 AWS 账户和 AWS 云应用程序。 该公司应该使用哪项 AWS 服务来满足这些要求？","o":[{"l":"A","t":"Amazon Cognito"},{"l":"B","t":"AWS IAM Identity Center（AWS 单点登录）"},{"l":"C","t":"AWS Identity and Access Management（IAM）"},{"l":"D","t":"AWS Directory Service for Microsoft Active Directory"}],"a":["B"],"e":"AWS IAM Identity Center（AWS 单点登录）允许公司管理对第三方 SaaS 应用程序的访问和权限，并为最终用户提供一个门户，以便他们使用一组凭据访问分配的 AWS 账户和 AWS 云应用程序。","s":"源#595"},{"id":"D2-603","d":2,"t":"single","q":"Amazon GuardDuty 的主要用例是什么？","o":[{"l":"A","t":"预防 DDoS 攻击"},{"l":"B","t":"防范 SQL 注入攻击"},{"l":"C","t":"自动监控对 AWS 工作负载的威胁"},{"l":"D","t":"自动配置 AWS 资源"}],"a":["C"],"e":"Amazon GuardDuty 主要用于自动监控和检测对 AWS 工作负载的潜在威胁，提供实时威胁检测和持续监控，以帮助保护AWS 环境。","s":"源#603"},{"id":"D2-605","d":2,"t":"single","q":"开发人员需要使用 AWS CLI 与 AWS 进行交互。 开发人员的账户中必须配置哪个安全功能或AWS服务才能满足此要求？","o":[{"l":"A","t":"用户名和密码"},{"l":"B","t":"AWS Systems Manager"},{"l":"C","t":"根密码访问"},{"l":"D","t":"AWS 访问密钥"}],"a":["D"],"e":"要使用 AWS CLI 与 AWS 进行交互，开发人员需要一个 AWS 访问密钥，该密钥提供了访问 AWS 资源和服务所需的必要身份验证凭据。","s":"源#605"},{"id":"D2-606","d":2,"t":"single","q":"一家食品配送公司需要阻止某些国家的用户访问其网站。 该公司应该使用哪项AWS 服务来满足此要求？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"AWS Control Tower"},{"l":"C","t":"Amazon Fraud Detector"},{"l":"D","t":"Amazon Pinpoint"}],"a":["A"],"e":"AWS WAF（Web Application Firewall）可用于阻止来自特定国家或 IP 地址的流量，帮助食品配送公司防止未经授权访问其网站。","s":"源#606"},{"id":"D2-609","d":2,"t":"single","q":"在使用 AWS Lambda 时，根据 AWS 共享责任模型，客户的责任是什么？","o":[{"l":"A","t":"维护底层 Lambda 硬件。"},{"l":"B","t":"维护 Lambda 网络基础设施。"},{"l":"C","t":"Lambda 函数中运行的代码和库。"},{"l":"D","t":"Lambda 服务器软件。"}],"a":["C"],"e":"在使用 AWS Lambda 时，根据 AWS 共享责任模型，客户负责在 Lambda 函数中运行的代码和库。AWS 负责底层基础设施，包括硬件和网络。","s":"源#609"},{"id":"D2-610","d":2,"t":"multiple","q":"根据 AWS 共享责任模型，哪些任务是 AWS 的责任？（选择两项）","o":[{"l":"A","t":"配置 AWS Identity and Access Management（IAM）。"},{"l":"B","t":"在 Amazon EC2 实例上配置安全组。"},{"l":"C","t":"保护 AWS 物理设施的访问安全。"},{"l":"D","t":"修补在 Amazon EC2 实例上运行的应用程序。"},{"l":"E","t":"执行基础设施补丁和维护。"}],"a":["C","E"],"e":"AWS 负责保护物理 AWS 设施的访问安全（C）并执行基础设施补丁和维护（E）。在 EC2 实例上配置 IAM 和安全组通常是客户的责任，就像修补在 EC2 实例上运行的应用程序一样。","s":"源#610"},{"id":"D2-611","d":2,"t":"single","q":"公司的合规官员想要审查 AWS 服务组织控制（S0C）报告。 合规官员应该使用哪项AWS 服务或功能来完成此任务？","o":[{"l":"A","t":"AWS Artifact"},{"l":"B","t":"AWS Concierge Support"},{"l":"C","t":"AWS Support"},{"l":"D","t":"AWS Trusted Advisor"}],"a":["A"],"e":"AWS Artifact 提供对 AWS 合规报告的访问，包括 SOC 报告，因此是合规官员审查所需报告的合适服务。","s":"源#611"},{"id":"D2-612","d":2,"t":"single","q":"一家公司有合规要求，需要记录和评估配置更改，并对 AWS 资源执行补救措施。该公司应该使用哪项 AWS 服务？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"AWS Secrets Manager"},{"l":"C","t":"AWS CloudTrail"},{"l":"D","t":"AWS Trusted Advisor"}],"a":["A"],"e":"AWS Config 旨在跟踪和记录 AWS 资源上的配置更改，允许公司评估这些更改并采取适当的补救措施以确保合规性。","s":"源#612"},{"id":"D2-617","d":2,"t":"single","q":"一家公司需要使用仪表板和图表来分析业务数据的洞察。 哪项 AWS 服务将为这些洞察提供仪表板和图表？","o":[{"l":"A","t":"Amazon Macie"},{"l":"B","t":"Amazon Aurora"},{"l":"C","t":"Amazon QuickSight"},{"l":"D","t":"AWS CloudTrail"}],"a":["C"],"e":"Amazon QuickSight 是一项商业智能服务，允许用户创建仪表板和可视化效果，以分析和从业务数据中获取洞察。","s":"源#617"},{"id":"D2-620","d":2,"t":"single","q":"哪项 AWS 服务用于临时提供联邦安全凭证以访问 AWS 资源？","o":[{"l":"A","t":"Amazon GuardDuty"},{"l":"B","t":"AWS Simple Token Service（AWS STS）"},{"l":"C","t":"AWS Secrets Manager"},{"l":"D","t":"AWS Certificate Manager"}],"a":["B"],"e":"AWS Simple Token Service（AWS STS）用于临时提供联邦安全凭证，允许用户安全地访问 AWS 资源，而无需管理长期凭证。","s":"源#620"},{"id":"D2-627","d":2,"t":"multiple","q":"根据 AWS 共享责任模型，哪些任务是客户的责任？（选择两项）","o":[{"l":"A","t":"保护虚拟化层的安全。"},{"l":"B","t":"加密数据并维护数据完整性。"},{"l":"C","t":"修补 Amazon RDS 操作系统。"},{"l":"D","t":"维护身份和访问管理控制。"},{"l":"E","t":"保护可用区的安全。"}],"a":["B","D"],"e":"根据 AWS 共享责任模型，客户负责加密数据并维护数据完整性（B）以及维护身份和访问管理控制（D），以确保其AWS 资源的安全。","s":"源#627"},{"id":"D2-628","d":2,"t":"multiple","q":"一家在线零售公司希望将其本地工作负载迁移到 AWS。该公司需要以成本效益的方式自动处理季节性工作负载增加。 哪些 AWS 云功能将帮助该公司满足此要求？（选择两项）","o":[{"l":"A","t":"跨区域工作负载部署"},{"l":"B","t":"按需付费定价"},{"l":"C","t":"内置的 AWS CloudTrail 审计功能"},{"l":"D","t":"自动扩展策略"},{"l":"E","t":"集中式日志记录"}],"a":["B","D"],"e":"按需付费定价允许公司仅为使用的资源付费，对于处理季节性工作负载变化具有成本效益。自动扩展策略使资源能够根据工作负载需求自动调整，确保公司能够在高峰季节处理增加的工作负载而不会过度配置。","s":"源#628"},{"id":"D2-629","d":2,"t":"single","q":"开发人员需要使用标准化模板为公司的 AWS 架构创建开发、测试和生产环境的副本。开发人员应该使用哪项 AWS 服务来满足此要求？","o":[{"l":"A","t":"AWS Cloud Map"},{"l":"B","t":"AWS CloudFormation"},{"l":"C","t":"Amazon Cloud Front"},{"l":"D","t":"AWS CloudTrail"}],"a":["B"],"e":"AWS CloudFormation 允许开发人员使用模板将基础设施定义为代码。这些模板可用于在不同环境（如开发、测试和生产）中创建AWS架构的一致副本。通过使用 CloudFormation，开发人员可以确保基础设施以标准化和可重复的方式部署。","s":"源#629"},{"id":"D2-631","d":2,"t":"single","q":"根据 AWS 共享责任模型，以下哪项是客户的责任？","o":[{"l":"A","t":"为 Amazon S3 基础设施设备应用安全补丁。"},{"l":"B","t":"为 AWS 数据中心提供物理安全。"},{"l":"C","t":"在 Lambda@Edge 上安装操作系统更新。"},{"l":"D","t":"为 IAM 用户账户实施多因素身份验证（MFA）。"}],"a":["D"],"e":"根据 AWS 共享责任模型，客户负责为 IAM 用户账户实施多因素身份验证（MFA），以增强其 AWS 资源的安全性。虽然AWS 负责底层基础设施的安全，但客户有责任在其应用程序和账户内采取适当的安全措施。","s":"源#631"},{"id":"D2-633","d":2,"t":"single","q":"哪项 AWS 服务或工具为用户提供了一个图形界面，他们可以使用该界面来管理AWS 服务？","o":[{"l":"A","t":"AWS Copilot"},{"l":"B","t":"AWS CLI"},{"l":"C","t":"AWS Management Console"},{"l":"D","t":"AWS 软件开发工具包（SDKs）"}],"a":["C"],"e":"AWS Management Console 提供了一个用户友好的图形界面，允许用户轻松管理和配置 AWS 服务。通过控制台，用户可以访问和控制各种 AWS 资源，监控性能，并执行管理任务，而无需使用命令行或编程专业知识。","s":"源#633"},{"id":"D2-635","d":2,"t":"single","q":"一家公司已将其系统迁移到 AWS 云。系统已进行了适当的调整，安全审查未发现任何问题。该公司必须确保额外的开发、集成、更改和系统使用增长不会危及此优化的 AWS 基础设施。 该公司应该使用哪项AWS服务来报告持续的优化和安全？","o":[{"l":"A","t":"AWS Trusted Advisor"},{"l":"B","t":"AWS Health Dashboard"},{"l":"C","t":"Amazon Connect"},{"l":"D","t":"AWS Systems Manager"}],"a":["A"],"e":"AWS Trusted Advisor 提供建议和见解，帮助优化 AWS 基础设施、提高性能并增强安全性。它可以识别潜在问题并提供改进建议，使公司能够确保基础设施在进行进一步的开发和更改时保持优化和安全。","s":"源#635"},{"id":"D2-636","d":2,"t":"single","q":"哪项 AWS 服务与其他 AWS 服务集成，提供在静态时加密数据的能力？","o":[{"l":"A","t":"AWS Key Management Service（AWS KMS）"},{"l":"B","t":"AWS Certificate Manager（ACM）"},{"l":"C","t":"AWS Identity and Access Management（IAM）"},{"l":"D","t":"AWS Security Hub"}],"a":["A"],"e":"AWS Key Management Service（AWS KMS）是一项中央服务，与其他 AWS 服务集成，为静态数据加密提供加密密钥。它使用户能够管理加密密钥并控制对加密数据的访问，确保数据的安全性和保密性。","s":"源#636"},{"id":"D2-640","d":2,"t":"single","q":"一家公司拥有 AWS 商业支持计划。该公司需要访问 AWS DDoS 响应团队（DRT）来帮助缓解DDoS事件。 该公司必须使用哪项 AWS 服务或资源来满足这些要求？","o":[{"l":"A","t":"AWS Shield Standard"},{"l":"B","t":"AWS Enterprise Support"},{"l":"C","t":"AWS WAF"},{"l":"D","t":"AWS Shield Advanced"}],"a":["D"],"e":"AWS Shield Advanced 提供对 AWS DDoS 响应团队（DRT）的访问，并提供增强的 DDoS 攻击防护。使用 AWS Shield Advanced，公司可以获得 DRT 的专门支持和协助，以有效地缓解和响应 DDoS 事件。","s":"源#640"},{"id":"D2-648","d":2,"t":"single","q":"根据 AWS 共享责任模型，以下哪项是客户的责任？","o":[{"l":"A","t":"为 Amazon S3 基础设施设备应用安全补丁。"},{"l":"B","t":"为 AWS 数据中心提供物理安全。"},{"l":"C","t":"在 Lambda@Edge 上安装操作系统更新。"},{"l":"D","t":"为 IAM 用户账户实施多因素身份验证（MFA）。"}],"a":["D"],"e":"根据 AWS 共享责任模型，客户负责为 IAM 用户账户实施多因素身份验证（MFA），以增强其 AWS 资源的安全性。虽然AWS 负责底层基础设施的安全，但客户有责任在其应用程序和账户内采取适当的安全措施。","s":"源#648"},{"id":"D2-650","d":2,"t":"single","q":"哪项 AWS 服务始终免费提供给用户？","o":[{"l":"A","t":"Amazon Athena"},{"l":"B","t":"AWS Identity and Access Management（IAM）"},{"l":"C","t":"AWS Secrets Manager"},{"l":"D","t":"Amazon ElastiCache"}],"a":["B"],"e":"AWS Identity and Access Management（IAM）是 AWS 提供的一项基本服务，始终免费提供给用户。它允许用户管理对AWS 资源的访问，是 AWS 生态系统中安全和访问控制的重要组成部分。","s":"源#650"},{"id":"D2-654","d":2,"t":"single","q":"管理员观察到昨天有多个 AWS 资源被删除。 哪项 AWS 服务将帮助确定原因并确定是哪个用户删除了这些资源？","o":[{"l":"A","t":"AWS CloudTrail"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"AWS Trusted Advisor"}],"a":["A"],"e":"AWS CloudTrail 记录 AWS 账户中的所有 API 调用和事件，包括资源删除。通过查看 CloudTrail 日志，管理员可以确定资源删除的原因，并确定是哪个用户或服务进行了删除资源的 API 调用。","s":"源#654"},{"id":"D2-655","d":2,"t":"single","q":"为了协助公司在云中遵守支付卡行业数据安全标准（PCI DSS），AWS 提供：","o":[{"l":"A","t":"通过预约对数据中心进行物理检查。"},{"l":"B","t":"为在 AWS 上运行的任何应用程序提供所需的 PCI 合规认证。"},{"l":"C","t":"针对特定 AWS 服务的 AWS 合规性声明（A0C）报告。"},{"l":"D","t":"专业的 PCI 合规服务。"}],"a":["C"],"e":"AWS 为特定 AWS 服务提供 AWS 合规性声明（AOC）报告，以协助公司在云中证明 PCI DSS 合规性。AOC 报告提供证据表明AWS 服务满足相关的安全和合规要求。","s":"源#655"},{"id":"D2-656","d":2,"t":"single","q":"在哪些情况下，公司应该创建 IAM 用户而不是 IAM 角色？","o":[{"l":"A","t":"当在 Amazon EC2 实例上运行的应用程序需要访问其他 AWS 服务时。"},{"l":"B","t":"当公司为个人创建 AWS 访问凭据时。"},{"l":"C","t":"当公司创建在移动电话上运行并向 AWS 发出请求的应用程序时。"},{"l":"D","t":"当公司需要将用户添加到 IAM 组时。"},{"l":"E","t":"当用户在公司网络中进行身份验证并希望能够使用 AWS 而无需再次登录时。"}],"a":["B"],"e":"当公司需要为个人创建 AWS 访问凭据时，应该创建 IAM 用户。IAM 角色通常用于为代表用户或实体运行的应用程序或服务授予临时访问 AWS 服务的权限。","s":"源#656"},{"id":"D2-665","d":2,"t":"single","q":"一家公司需要为其 VPC 进行无状态网络过滤。 哪项 AWS 服务、工具或功能将满足此要求？","o":[{"l":"A","t":"AWS PrivateLink"},{"l":"B","t":"安全组"},{"l":"C","t":"网络访问控制列表（ACL）"},{"l":"D","t":"AWS WAF"}],"a":["C"],"e":"网络访问控制列表（ACL）为 VPC 提供无状态网络过滤。它允许公司根据 IP 协议、端口和 CIDR 块控制子网级别的入站和出站流量。","s":"源#665"},{"id":"D2-667","d":2,"t":"multiple","q":"一家公司希望将其基于服务器的应用程序迁移到 AWS 云。该公司希望确定将在AWS 云上托管的计算资源的总拥有成本。 哪些 AWS 服务或工具的组合将满足这些要求？（选择两项）","o":[{"l":"A","t":"AWS Pricing Calculator"},{"l":"B","t":"Migration Evaluator"},{"l":"C","t":"AWS Support Center"},{"l":"D","t":"AWS Application Discovery Service"},{"l":"E","t":"AWS Database Migration Service（AWS DMS）"}],"a":["A","B"],"e":"AWS Pricing Calculator 帮助公司根据其具体要求估算使用 AWS 服务的成本，从而确定其计算资源的总拥有成本。Migration Evaluator 可以协助评估将基于服务器的应用程序迁移到 AWS 云的兼容性和成本影响。","s":"源#667"},{"id":"D2-685","d":2,"t":"single","q":"一家公司想要一个完全托管的服务，该服务可以集中和自动化跨 AWS 服务和混合工作负载的数据保护。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Artifact"},{"l":"B","t":"AWS Backup"},{"l":"C","t":"AWS Batch"},{"l":"D","t":"AWS Shield"}],"a":["B"],"e":"AWS Backup 是一项完全托管的服务，提供了跨 AWS 服务和混合工作负载的集中和自动化数据保护。它简化了备份过程，并确保数据的可靠性和可恢复性。","s":"源#685"},{"id":"D2-686","d":2,"t":"single","q":"一家公司计划将其应用程序从本地迁移到 AWS 云。该公司需要收集应用程序组件的使用和配置数据。哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Database Migration Service（AWS DMS）"},{"l":"B","t":"AWS Transfer Family"},{"l":"C","t":"AWS Application Discovery Service"},{"l":"D","t":"AWS Global Accelerator"}],"a":["C"],"e":"AWS Application Discovery Service 帮助公司收集有关其本地应用程序的使用和配置数据，包括应用程序、服务器和依赖关系的信息。这对于规划向 AWS 云的迁移并确保顺利过渡非常有价值。","s":"源#686"},{"id":"D2-693","d":2,"t":"single","q":"哪项 AWS 产品可以分析公司的 AWS 环境，以发现 Amazon EC2 实例上的安全漏洞？","o":[{"l":"A","t":"Amazon Inspector"},{"l":"B","t":"Amazon Macie"},{"l":"C","t":"AWS Shield Standard"},{"l":"D","t":"安全组"}],"a":["A"],"e":"Amazon Inspector 是一项 AWS 服务，可以分析 AWS 环境，包括 Amazon EC2 实例，以发现安全漏洞。它提供详细的报告和建议，帮助公司解决和缓解已识别的漏洞。","s":"源#693"},{"id":"D2-698","d":2,"t":"single","q":"一家公司正在发布一个关键业务应用程序。在发布之前，该公司需要来自 AWS 的战略规划协助。在发布期间，该公司需要 AWS 基础设施事件管理和实时支持。 该公司应该怎么做来满足这些要求？","o":[{"l":"A","t":"访问 AWS Trusted Advisor。"},{"l":"B","t":"联系 AWS 合作伙伴网络（APN）。"},{"l":"C","t":"注册 AWS 企业支持。"},{"l":"D","t":"联系 AWS 专业服务。"}],"a":["C"],"e":"注册 AWS 企业支持为公司提供了访问战略规划协助、基础设施事件管理和实时支持的权限。它专为具有关键业务应用程序的企业设计，确保在发布过程中获得高水平的支持。","s":"源#698"},{"id":"D2-713","d":2,"t":"single","q":"一家公司需要阻止 SQL 注入攻击。 哪个 AWS 服务或功能提供此功能？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"网络 ACL"},{"l":"C","t":"安全组"},{"l":"D","t":"AWS 信任顾问"}],"a":["A"],"e":"AWS WAF（Web 应用防火墙）是一项服务，有助于保护您的应用程序免受常见网络攻击，包括 SQL 注入攻击。它允许您创建自定义规则以阻止此类攻击。","s":"源#713"},{"id":"D2-716","d":2,"t":"single","q":"哪个 AWS 服务可以通过使用策略来管理 AWS 资源的权限？","o":[{"l":"A","t":"Amazon Inspector"},{"l":"B","t":"Amazon Detective"},{"l":"C","t":"AWS 身份和访问管理 (IAM)"},{"l":"D","t":"Amazon GuardDuty"}],"a":["C"],"e":"AWS 身份和访问管理 (IAM) 是一项服务，允许您安全地控制用户对 AWS 服务和资源的访问。它使用策略来管理权限，确保只有授权用户才能访问特定资源。","s":"源#716"},{"id":"D2-717","d":2,"t":"single","q":"一家公司需要在 AWS 云中运行部分工作负载。由于合规原因，公司需要将部分工作负载保留在自己的现场数据中心。 哪个 AWS 服务能满足这些要求？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"AWS Outposts"},{"l":"C","t":"Amazon Lightsail"},{"l":"D","t":"Amazon Connect"}],"a":["B"],"e":"AWS Outposts 允许您在本地运行 AWS 服务，提供了一种混合解决方案，既满足合规要求，同时仍然利用 AWS 服务和基础设施。","s":"源#717"},{"id":"D3-001","d":3,"t":"single","q":"一家公司计划使用 Amazon Snowball Edge 设备将文件传输到 AWS 云。哪些与 Snowball Edge 设备相关的活动对公司来说是免费的？","o":[{"l":"A","t":"10 天内使用 Snowball Edge 设备"},{"l":"B","t":"将数据从 Amazon S3 传输到 Snowball Edge 设备"},{"l":"C","t":"将数据从 Snowball Edge 设备传输到 Amazon S3"},{"l":"D","t":"10 天后每天使用 Snowball Edge 设备"}],"a":["C"],"e":"将数据从 Snowball Edge 设备传输到 Amazon S3 是 AWS 提供的不额外收费的活动。使用 Snowball Edge 设备本身以及从Amazon S3 传输数据到设备都不是免费服务。","s":"源#1"},{"id":"D3-003","d":3,"t":"single","q":"一家公司有一个集中的用户群体，他们对大文件存储的需求超出了公司内部可用的空间。公司希望在保留共享内容的本地性能优势的同时，扩展该群体的文件存储能力。哪种 AWS 解决方案在操作上最有效？","o":[{"l":"A","t":"为每个用户创建一个 Amazon S3 存储桶。使用 S3 文件系统挂载工具挂载每个存储桶。"},{"l":"B","t":"配置并部署 AWS Storage Gateway 文件网关。将每个用户的工作站连接到文件网关。"},{"l":"C","t":"将每个用户的工作环境移动到 Amazon WorkSpaces。为每个用户设置 Amazon WorkDocs 账户。"},{"l":"D","t":"部署 Amazon EC2 实例并附加 Amazon Elastic Block Store (Amazon EBS) Provisioned IOPS 卷。直接与用户共享 EBS 卷。"}],"a":["B"],"e":"在扩展文件存储的同时保留本地访问性能的最具操作效率的解决方案是配置并部署 AWS Storage Gateway 文件网关。这允许用户访问存储在 Amazon S3 中的文件，就像它们存储在本地一样，提供本地存储的无缝扩展。","s":"源#3"},{"id":"D3-007","d":3,"t":"single","q":"一家公司正在 Amazon EC2 实例上运行和管理自己的 Docker 环境。公司想要一种替代方案来帮助管理集群大小、调度和环境维护。哪个 AWS 服务满足这些要求？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"AWS Fargate"},{"l":"D","t":"Amazon Athena"}],"a":["C"],"e":"AWS Fargate 是一个用于容器的无服务器计算引擎，允许用户在不管理底层基础设施的情况下运行容器。它简化了集群管理、任务调度和容器化应用程序的环境维护。","s":"源#7"},{"id":"D3-008","d":3,"t":"single","q":"一家公司想要在 Amazon EC2 实例上运行 NoSQL 数据库。在这种情况下，AWS 的哪项任务是AWS的责任？","o":[{"l":"A","t":"更新 EC2 实例的来宾操作系统。"},{"l":"B","t":"在数据库层面维护高可用性。"},{"l":"C","t":"修补托管 EC2 实例的物理基础设施。"},{"l":"D","t":"配置安全组防火墙。"}],"a":["C"],"e":"AWS 负责维护和修补托管 EC2 实例的物理基础设施。这包括服务器、网络设备和其他硬件组件。","s":"源#8"},{"id":"D3-009","d":3,"t":"multiple","q":"以下哪些 AWS 服务或工具可以识别 Amazon EC2 实例的合适尺寸机会？（选择两项。）","o":[{"l":"A","t":"AWS 成本探索器"},{"l":"B","t":"AWS 计费指挥家"},{"l":"C","t":"Amazon CodeGuru"},{"l":"D","t":"Amazon SageMaker"},{"l":"E","t":"AWS 计算优化器"}],"a":["A","E"],"e":"AWS 成本探索器提供成本管理工具，使用户能够分析支出和使用模式，这可以为合适尺寸决策提供信息。AWS 计算优化器分析EC2 使用模式，并提供合适尺寸实例以优化性能并降低成本的建议。","s":"源#9"},{"id":"D3-014","d":3,"t":"multiple","q":"一家公司正在使用中央数据平台来管理其客户的多种类型的数据。公司想使用 AWS 服务来发现、转换和可视化数据。 公司应该使用哪些 AWS 服务组合来满足这些要求？（选择两项。）","o":[{"l":"A","t":"AWS 胶"},{"l":"B","t":"Amazon EFS（Amazon EFS）"},{"l":"C","t":"Amazon Redshift"},{"l":"D","t":"Amazon QuickSight"},{"l":"E","t":"Amazon QLDB（Amazon QLD"}],"a":["A","D"],"e":"AWS 胶是一个无服务器数据集成服务，有助于发现、转换和加载数据。Amazon QuickSight是一个商业智能服务，可以为数据分析创建交互式仪表板和可视化。","s":"源#14"},{"id":"D3-017","d":3,"t":"single","q":"一个开发人员想在 AWS 上快速部署应用程序，而不需要手动创建所需的资源。哪个AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon EC2"},{"l":"B","t":"AWS 弹性豆荚"},{"l":"C","t":"AWS 代码构建"},{"l":"D","t":"Amazon Personalize"}],"a":["B"],"e":"AWS 弹性豆荚旨在在 AWS 云中快速部署和管理应用程序，无需开发人员了解底层基础设施。它处理容量供应、负载均衡、扩展和应用程序健康监控。","s":"源#17"},{"id":"D3-020","d":3,"t":"single","q":"一家在线游戏公司需要为其 Amazon EC2 实例选择一个购买选项，以运行一年。网络流量是一致的，任何流量增加都是可预测的。EC2 实例必须在线并随时可用，没有任何中断。哪种 EC2 实例购买选项将最符合成本效益？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"预留实例"},{"l":"C","t":"现货实例"},{"l":"D","t":"现货舰队"}],"a":["B"],"e":"预留实例与按需实例相比提供显著折扣，以换取一年或三年的承诺。它们适用于一致的、可预测的工作负载，并确保实例在没有中断的情况下可用。","s":"源#20"},{"id":"D3-021","d":3,"t":"single","q":"哪个 AWS 服务或功能允许用户在公司的本地数据中心和 AWS 云之间建立专用网络连接？","o":[{"l":"A","t":"AWS 直接连接"},{"l":"B","t":"VPC 对等"},{"l":"C","t":"AWS VPN"},{"l":"D","t":"Amazon Route 53"}],"a":["A"],"e":"AWS 直接连接允许用户在本地数据中心和 AWS 云之间建立专用网络连接。它提供了一个私有的、专用的连接，增强了网络性能和可靠性。","s":"源#21"},{"id":"D3-024","d":3,"t":"single","q":"在 VPC 中拥有互联网网关的目的是？","o":[{"l":"A","t":"创建到 VPC 的 VPN 连接"},{"l":"B","t":"允许 VPC 和互联网之间的通信"},{"l":"C","t":"对互联网流量施加带宽限制"},{"l":"D","t":"从互联网跨 Amazon EC2 实例负载均衡流量"}],"a":["B"],"e":"VPC 中的互联网网关允许 VPC 和互联网之间的通信。它是一个水平扩展、冗余且高度可用的 VPC 组件，允许 VPC 与互联网之间的出站流量和反之亦然。","s":"源#24"},{"id":"D3-027","d":3,"t":"multiple","q":"一家公司想要在达到特定 AWS 成本阈值时收到通知。公司可以使用哪些 AWS 服务或工具来满足此要求？（选择两项。）","o":[{"l":"A","t":"Amazon SQS（Amazon SQS）"},{"l":"B","t":"AWS 预算"},{"l":"C","t":"成本探索器"},{"l":"D","t":"Amazon CloudWatch"},{"l":"E","t":"AWS 成本和使用情况报告"}],"a":["B","D"],"e":"AWS 预算允许公司设置自定义成本和使用预算，并在达到这些阈值时定义操作，例如发送通知。Amazon CloudWatch可以用来创建基于成本指标的警报，在特定成本阈值满足或超过时触发通知。","s":"源#27"},{"id":"D3-029","d":3,"t":"multiple","q":"根据 AWS 共享责任模型，以下哪些任务是客户的责任？（选择两项。）","o":[{"l":"A","t":"配置 AWS 提供的安全组防火墙。"},{"l":"B","t":"在 AWS 云中对公司资产进行分类。"},{"l":"C","t":"确定用于 Amazon S3 存储桶的可用区。"},{"l":"D","t":"修补或升级 Amazon DynamoDB。"},{"l":"E","t":"选择运行 AWS Lambda 的 Amazon EC2 实例。"}],"a":["A","B"],"e":"根据 AWS 共享责任模型，客户负责配置安全组防火墙以控制其资源的入站和出站流量，并在 AWS 云中对公司资产进行分类，作为其数据治理和安全实践的一部分。","s":"源#29"},{"id":"D3-031","d":3,"t":"single","q":"哪个 AWS 服务或功能用于从分布式应用程序发送文本和电子邮件消息？","o":[{"l":"A","t":"Amazon SNS (Amazon SNS)"},{"l":"B","t":"Amazon SES (Amazon SES)"},{"l":"C","t":"Amazon CloudWatch Alarms"},{"l":"D","t":"Amazon SQS (Amazon SQS)"}],"a":["A"],"e":"Amazon SNS (Amazon SNS) 是一项服务，它允许从分布式应用程序发送文本（SMS）和电子邮件消息。它支持各种通信方式，包括电子邮件、短信、HTTP/HTTPS 等。","s":"源#31"},{"id":"D3-043","d":3,"t":"single","q":"一家公司在 Amazon S3 中存储了 5 TB 的数据。公司计划偶尔对数据运行查询进行分析。公司应该使用哪个 AWS 服务以最具成本效益的方式运行这些查询？","o":[{"l":"A","t":"Amazon Redshift"},{"l":"B","t":"Amazon Athena"},{"l":"C","t":"Amazon Kinesis"},{"l":"D","t":"Amazon RDS"}],"a":["B"],"e":"Amazon Athena 是一项无服务器查询服务，允许用户直接在 Amazon S3 中使用标准 SQL 分析数据。它适用于偶尔或临时查询，因为用户只需为他们运行的查询付费，无需管理底层基础设施。","s":"源#43"},{"id":"D3-047","d":3,"t":"single","q":"一家公司想要将其本地关系型数据库迁移到 AWS 云。公司希望使用尽可能接近其当前地理位置的基础设施。公司应该使用哪个 AWS 服务或资源来选择其 Amazon RDS 部署区域？","o":[{"l":"A","t":"Amazon Connect"},{"l":"B","t":"AWS 波长"},{"l":"C","t":"AWS 区域"},{"l":"D","t":"AWS 直接连接"}],"a":["C"],"e":"AWS 区域是 AWS 数据中心所在地的地理位置。部署 Amazon RDS 时，公司可以选择与其当前位置地理位置最近的AWS 区域，以减少延迟并提高性能。","s":"源#47"},{"id":"D3-049","d":3,"t":"single","q":"一家公司正在构建一个需要在全球范围内以最小的延迟传递图像和视频的应用程序。公司可以使用哪种方法以成本效益的方式实现这一点？","o":[{"l":"A","t":"通过 Amazon CloudFront 传递内容。"},{"l":"B","t":"将内容存储在 Amazon S3 并启用 S3 跨区域复制。"},{"l":"C","t":"在多个 AWS 区域之间实现 VPN。"},{"l":"D","t":"通过 AWS PrivateLink 传递内容。"}],"a":["A"],"e":"Amazon CloudFront 是一个内容分发网络 (CDN) 服务，可以加速向全球用户传递静态和动态内容，包括图像和视频。它通过在世界各地的边缘位置缓存内容，最小化延迟，是全球内容传递的低成本解决方案。","s":"源#49"},{"id":"D3-051","d":3,"t":"single","q":"以下哪项是一个软件开发框架，公司可以用来定义云资源为代码，并通过 AWS CloudFormation 配置资源？","o":[{"l":"A","t":"AWS CLI"},{"l":"B","t":"AWS 开发者中心"},{"l":"C","t":"AWS 云开发工具包 (AWS CDK)"},{"l":"D","t":"AWS CodeStar"}],"a":["C"],"e":"AWS 云开发工具包 (AWS CDK) 是一个软件开发框架，允许开发人员使用熟悉的编程语言定义基础设施即代码 (IaC)。它支持定义云资源、它们的关系和配置逻辑，并生成 CloudFormation 模板，以便更轻松地管理和部署 AWS 中的基础设施资源。","s":"源#51"},{"id":"D3-055","d":3,"t":"single","q":"为了降低成本，一家公司计划将 NoSQL 数据库迁移到 AWS。哪个 AWS 服务是完全托管的，并且可以自动扩展吞吐量以满足数据库工作负载需求？","o":[{"l":"A","t":"Amazon Redshift"},{"l":"B","t":"Amazon Aurora"},{"l":"C","t":"Amazon DynamoDB"},{"l":"D","t":"Amazon RDS"}],"a":["C"],"e":"Amazon DynamoDB 是一个完全托管的 NoSQL 数据库服务，可以根据应用程序需求自动扩展吞吐量。它提供低延迟、高吞吐量的性能，非常适合具有变化流量模式的工作负载。","s":"源#55"},{"id":"D3-057","d":3,"t":"single","q":"一家公司拥有一个测试用的 AWS 环境。公司计划在 AWS 中测试一个应用程序。应用程序测试可以中断，不需要连续运行。哪种 Amazon EC2 购买选项将最符合成本效益？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"专用实例"},{"l":"C","t":"现货实例"},{"l":"D","t":"预留实例"}],"a":["C"],"e":"现货实例是中断性工作负载最符合成本效益的选项，不需要连续运行。它们允许用户以潜在的低成本竞标未使用的 EC2 容量，并且如果按需或预留实例需要容量，可以在短时间内被终止。","s":"源#57"},{"id":"D3-059","d":3,"t":"multiple","q":"以下哪些服务可以用来阻止对实例的网络流量？（选择两项。）","o":[{"l":"A","t":"安全组"},{"l":"B","t":"Amazon VPC 流日志"},{"l":"C","t":"网络 ACL"},{"l":"D","t":"Amazon CloudWatch"},{"l":"E","t":"AWS CloudTrail"}],"a":["A","C"],"e":"安全组作为实例的虚拟防火墙，控制实例级别的入站和出站流量。网络 ACL（访问控制列表）是基于状态的防火墙，根据源和目的IP地址、端口和协议，在子网级别控制流量。","s":"源#59"},{"id":"D3-061","d":3,"t":"single","q":"以下哪项是完全托管的 MySQL 兼容数据库？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"Amazon DynamoDB"},{"l":"C","t":"Amazon Redshift"},{"l":"D","t":"Amazon Aurora"}],"a":["D"],"e":"Amazon Aurora 是一个完全托管的关系数据库引擎，与 MySQL 和 PostgreSQL 兼容。它结合了商业数据库的性能和可用性以及开源数据库的简单性和成本效益。","s":"源#61"},{"id":"D3-062","d":3,"t":"single","q":"哪个 AWS 服务支持混合架构，使用户能够将 AWS 基础设施、AWS 服务、API 和工具扩展到数据中心、共址环境或本地设施？","o":[{"l":"A","t":"AWS Snowmobile"},{"l":"B","t":"AWS 本地区域"},{"l":"C","t":"AWS Outposts"},{"l":"D","t":"AWS Fargate"}],"a":["C"],"e":"AWS Outposts 使用户能够在本地运行 AWS 基础设施和服务，同时无缝连接到 AWS 云。它将 AWS 生态系统扩展到本地位置，允许用户利用云计算的优势，同时解决混合环境中的数据居住、低延迟应用和特定监管需求。","s":"源#62"},{"id":"D3-063","d":3,"t":"single","q":"哪个 AWS 服务可以运行一个托管的 PostgreSQL 数据库，提供在线事务处理 (OLTP)？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon Athena"},{"l":"C","t":"Amazon RDS"},{"l":"D","t":"Amazon EMR"}],"a":["C"],"e":"Amazon RDS（关系数据库服务）是一个托管数据库服务，支持包括 PostgreSQL 在内的多种数据库引擎。它旨在提供在线事务处理(OLTP)，并提供轻松设置、操作和扩展 PostgreSQL 数据库的能力，而无需管理底层基础设施。","s":"源#63"},{"id":"D3-064","d":3,"t":"multiple","q":"一家公司想要为其远程员工提供管理的 Windows 虚拟桌面和应用程序，通过安全的网络连接。公司可以使用哪些 AWS 服务来满足这些要求？（选择两项。）","o":[{"l":"A","t":"Amazon Connect"},{"l":"B","t":"Amazon AppStream 2.0"},{"l":"C","t":"Amazon WorkSpaces"},{"l":"D","t":"AWS 站点到站点 VPN"},{"l":"E","t":"Amazon ECS (Amazon ECS)"}],"a":["B","C"],"e":"Amazon AppStream 2.0 是一个完全托管的应用程序流服务，允许用户安全地将桌面应用程序流式传输到任何运行网络浏览器的设备。Amazon WorkSpaces 是一个完全托管的桌面即服务 (DaaS) 解决方案，为用户提供 Windows 虚拟桌面，允许远程员工安全地访问Windows 桌面和应用程序。","s":"源#64"},{"id":"D3-066","d":3,"t":"single","q":"哪个 AWS 服务是一个键值数据库，提供大规模的亚毫秒级延迟？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon Aurora"},{"l":"C","t":"Amazon DocumentDB（与 MongoDB 兼容）"},{"l":"D","t":"Amazon Neptune"}],"a":["A"],"e":"Amazon DynamoDB 是一个键值和文档数据库，提供任何规模的个位数毫秒延迟。它是一个完全托管的 NoSQL 数据库服务，设计用于快速和可预测的性能，非常适合需要一致、低延迟访问的应用程序。","s":"源#66"},{"id":"D3-067","d":3,"t":"single","q":"一家公司正在部署一个机器学习 (ML) 研究项目，该项目将需要大量的计算能力，持续几个月。ML处理作业不需要在特定时间运行。哪种 Amazon EC2 实例购买选项将满足这些要求，以最低成本？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"现货实例"},{"l":"C","t":"预留实例"},{"l":"D","t":"专用实例"}],"a":["B"],"e":"（本题缺解析，源文件无解析文字）","s":"源#67"},{"id":"D3-068","d":3,"t":"multiple","q":"哪个 AWS 服务或功能为 Amazon EC2 实例提供灾难恢复解决方案？（选择两项。）","o":[{"l":"A","t":"EC2 预留实例"},{"l":"B","t":"EC2 Amazon Machine Image (AMI)"},{"l":"C","t":"Amazon EBS (EBS) 快照"},{"l":"D","t":"AWS 盾牌"},{"l":"E","t":"Amazon GuardDuty"}],"a":["B","C"],"e":"EC2 Amazon Machine Image (AMI) 和Amazon EBS 快照是 EC2 实例灾难恢复的关键组成部分。AMI 捕获实例的配置、数据和权限，允许在故障情况下启动新实例。EBS 快照创建 EBS 卷的即时备份，可用于恢复数据或创建新卷。","s":"源#68"},{"id":"D3-081","d":3,"t":"single","q":"一家公司有一组电子商务应用程序。这些应用程序需要能够相互发送消息。哪个AWS 服务满足此要求？","o":[{"l":"A","t":"AWS 自动扩展"},{"l":"B","t":"弹性负载均衡"},{"l":"C","t":"Amazon SQS (Amazon SQS)"},{"l":"D","t":"Amazon Kinesis 数据流"}],"a":["C"],"e":"它是一个完全托管的消息队列服务，使应用程序能够相互发送消息，并有助于构建分布式、松散耦合的系统。","s":"源#81"},{"id":"D3-085","d":3,"t":"single","q":"哪个 AWS 服务使公司能够部署应用程序，以靠近最终用户？","o":[{"l":"A","t":"Amazon CloudFront"},{"l":"B","t":"AWS 自动扩展"},{"l":"C","t":"AWS AppSync"},{"l":"D","t":"Amazon Route 53"}],"a":["A"],"e":"它是一个内容分发网络 (CDN) 服务，使公司能够以低延迟和高传输速度向最终用户提供静态和动态 Web 内容，包括应用程序。","s":"源#85"},{"id":"D3-086","d":3,"t":"single","q":"哪个 AWS 服务或功能通过使用 AWS 全球网络基础设施发送流量来提高网络性能？","o":[{"l":"A","t":"路由表"},{"l":"B","t":"AWS 传输网关"},{"l":"C","t":"AWS 全球加速器"},{"l":"D","t":"Amazon VPC"}],"a":["C"],"e":"该服务使用 AWS 全球网络优化应用程序的流量路由，通过使用任播 IP 地址提高应用程序的可用性和性能。","s":"源#86"},{"id":"D3-087","d":3,"t":"single","q":"哪个 AWS 服务提供高度耐用的对象存储？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"Amazon EFS (Amazon EFS)"},{"l":"C","t":"Amazon EBS (Amazon EBS)"},{"l":"D","t":"Amazon FSx"}],"a":["A"],"e":"(简单存储服务) 提供高度耐用的对象存储，具有 99.999999999% (11 个 9 的) 耐用性。它适用于存储和检索任何数量的数据。","s":"源#87"},{"id":"D3-088","d":3,"t":"single","q":"当一家公司在 Amazon EC2 实例上托管其数据库时，AWS 承担哪项责任？","o":[{"l":"A","t":"数据库备份"},{"l":"B","t":"数据库软件补丁"},{"l":"C","t":"操作系统补丁"},{"l":"D","t":"操作系统安装"}],"a":["D"],"e":"AWS 提供基础设施和服务，如 EC2，其中包括一系列预安装操作系统的 Amazon 机器映像 (AMI)。AWS 负责确保这些AMI 可用，以及运行这些实例的底层基础设施是安全和可靠的。","s":"源#88"},{"id":"D3-090","d":3,"t":"single","q":"哪个 AWS 服务是一个混合云存储服务，为本地用户提供几乎无限的云存储访问权限？","o":[{"l":"A","t":"AWS DataSync"},{"l":"B","t":"Amazon S3 Glacier"},{"l":"C","t":"AWS 存储网关"},{"l":"D","t":"Amazon EBS (Amazon EBS)"}],"a":["C"],"e":"AWS 存储网关是一个混合云存储服务，使本地应用程序能够无缝地使用云存储。它提供文件、卷和磁带网关接口，将本地环境与AWS 云存储集成。","s":"源#90"},{"id":"D3-096","d":3,"t":"single","q":"一家公司希望运营一个数据仓库来分析数据，而无需管理数据仓库基础设施。哪家AWS 服务能满足这一要求？","o":[{"l":"
