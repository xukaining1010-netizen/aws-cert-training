——不需要对方扮演角色，直接在资源策略里允许对方账号。\n- **SCP（服务控制策略）**——附加在 Organizations 的 OU 或账号上，设定成员账号权限的最大上限。SCP 不直接授权，只画天花板。（来源：aws-iam-full-guide.md）\n\nIAM 的权限评估有一条铁律：**默认拒绝，显式拒绝最优先**。具体逻辑按以下顺序评估（来源：aws-iam-full-guide.md）：\n\n1. **默认拒绝**：所有请求默认被拒绝（根用户例外，根用户天然有全部权限）\n2. **显式 Allow 覆盖默认拒绝**：如果策略中有明确的 Allow 语句匹配到这个请求，就覆盖默认拒绝\n3. **上限策略必须同时允许**：如果存在 SCP、权限边界（Permissions Boundary）等上限策略，请求必须也被这些上限允许才行\n4. **显式 Deny 覆盖一切**：如果任何策略中有明确的 Deny 语句匹配到这个请求，无论其他策略写了什么 Allow，这个请求铁定被拒绝\n\n简化记忆公式：**Deny > 上限策略 > Allow > 默认拒绝**。考试里经常考「某个用户有 Allow * 的策略但某个操作仍然被拒绝」——答案通常是 SCP 或权限边界设了更严格的上限。\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n电商创业公司「趣购」有 5 个开发人员和 2 个运维人员。CTO 初始设计的权限方案是给每人创建一个 IAM 用户，每人各自一套访问密钥。半年后发现三个严重问题：第一，5 个开发人员的访问密钥从未轮换过，其中一个人的密钥被误提交到了 GitHub 公开仓库，被扫描机器人在 15 分钟内发现并用来启动了大量 EC2 挖矿实例（账单暴增）。第二，一名运维人员离职后 IAM 用户没有及时删除，账号在离职两个月后仍然有效。第三，新入职的人需要 CTO 手动复制一套权限，操作复杂且容易出错。\n\n改进方案：第一，取消所有 IAM 用户的长期访问密钥，改用 IAM 角色——开发人员通过 IAM Identity Center 联合登录后扮演开发角色，获得临时凭证，几小时后自动失效，即使泄露危害也有时间窗口限制。第二，把权限策略附加到角色上而不是个人，新人入职只需分配对应角色，离职时在企业身份系统禁用即可。第三，为根用户启用了两个 MFA 设备并删除了根用户的访问密钥，根用户密码和 MFA 设备分别由两个不同的人保管。\n\n#### 常见误区与易错点\n\n**误区一：IAM 用户和 IAM 角色差不多。** 错。最核心的区别是凭证生命周期：IAM 用户有长期凭证（密码和访问密钥不主动换就一直有效），IAM 角色只有临时凭证（STS 发放，自动过期）。这个区别直接影响安全风险——长期凭证泄露危害持续，临时凭证泄露危害有限。\n\n**误区二：SCP 能给成员账号授权。** 错。SCP 只设上限（天花板），不授权。即使 SCP 写了 Allow *，成员账号内还需要有 IAM 策略的显式 Allow 才能执行操作。反过来，SCP 写了 Deny 某操作，即使账号内 IAM 策略写了 Allow，也铁定无法执行。（来源：aws-organizations-multi-account.md）\n\n**误区三：根用户开了 MFA 就万事大吉了。** 不够。MFA 是必要条件但不是充分条件。还需要不创建根用户访问密钥、使用组邮箱注册（防个人离职）、多人审批登录（密码和 MFA 分开保管）等综合措施。（来源：aws-iam-root-user-security-best-practices.md）\n\n#### 记忆要点\n\n- IAM = 门禁系统：认证（你是谁）→ 授权（策略检查）→ 操作（执行请求）\n- 根用户：最高权限，日常绝不用，必须开 MFA（35 天内注册义务，最多 8 个设备），不创建访问密钥，用组邮箱注册\n- IAM 用户 = 长期凭证（高泄露风险，正在被替代）；IAM 角色 = 临时凭证（低风险，最佳实践）\n- 联合身份 = 用企业现有身份系统登录 AWS，不需要单独创建 IAM 用户\n- 策略评估铁律：Deny > 上限 > Allow > 默认拒绝\n- SCP 是天花板不是授权，Deny 铁定生效\n\n---"},{"h":"安全组件与资源","body":"> 本域对应官方考纲任务声明 2.1–2.4：责任共担模型、安全治理合规概念、访问管理、安全组件与资源。\n\n#### 本节定位\n\n本节对应考纲任务声明 2.4「识别安全组件与资源」。学完之后你应该能回答：安全组和网络 ACL 有什么区别？AWS 有哪些威胁检测和数据保护服务？DDoS 防护和 Web 应用防火墙分别是什么？遇到具体安全场景时该选哪个服务？\n\n#### 网络安全两道门——安全组与网络 ACL\n\n当你在 AWS 上启动一台 EC2 实例（虚拟机），网络流量要经过两层检查才能到达它。可以想象成进入一栋办公楼：先过大门（子网级的网络 ACL），再过办公室门（实例级的安全组）。两层各有不同的检查规则。\n\n**安全组（Security Group）** 相当于每间办公室的门锁，守在实例门口。它有几个重要特性（来源：aws-vpc-network-core-concepts.md）：\n\n- **有状态（Stateful）**——如果你允许了一个请求进来，它的响应流量**自动放行**，不需要单独配出站规则。比如你允许了 80 端口的入站请求，服务器返回的响应数据包不需要额外的出站规则就能出去。\n- **只有允许规则**——你只能写「允许某某 IP 访问某端口」，不能写「拒绝某某 IP」。要拒绝特定 IP，得用网络 ACL。\n- **默认设置**：入站全部拒绝，出站全部允许。\n- 安全组可以引用其他安全组——比如「允许来自安全组 A 的流量进入」，而不需要写具体 IP，这在微服务架构中非常有用。\n\n**网络 ACL（NACL, Network Access Control List）** 相当于大楼大门的保安，守在子网入口。它的特性与安全组正好互补（来源：aws-vpc-network-core-concepts.md）：\n\n- **无状态（Stateless）**——入站和出站规则**独立评估**。即使你允许了入站请求，响应流量也必须有对应的出站规则才能出去。\n- **允许和拒绝规则都可以写**——这是它比安全组多出来的能力。如果你需要显式拒绝某个恶意 IP，NACL 可以做到。\n- **规则按编号从小到大匹配，命中即停**——编号越小的规则优先级越高。\n- **默认 NACL 允许所有流量**，自定义 NACL 默认拒绝所有流量。\n\n| 维度 | 安全组（Security Group） | 网络 ACL（NACL） |\n| --- | --- | --- |\n| 作用层级 | 实例级（绑定在网络接口上） | 子网级（每个子网关联一个） |\n| 状态 | 有状态（响应流量自动放行） | 无状态（入出站规则独立评估） |\n| 规则类型 | 只有允许规则 | 允许 + 拒绝规则 |\n| 规则评估 | 所有规则一起评估（有一条允许就放行） | 按编号从小到大匹配，命中即停 |\n| 默认行为 | 入站拒绝所有，出站允许所有 | 默认 NACL 允许所有；自定义 NACL 拒绝所有 |\n| 使用频率 | 主要流量控制手段（几乎每个资源都要配） | 补充性防线（特定场景才单独配置） |\n\n考试诀窍：看到「有状态」就选安全组，看到「无状态」就选 NACL。看到「实例级防火墙」就选安全组，看到「子网级防火墙」就选 NACL。看到「需要显式拒绝某个 IP」就选 NACL（安全组做不到）。\n\n#### 威胁检测与安全监控服务\n\nAWS 提供了一组服务来帮你发现和响应安全威胁——你不需要自己搭建安全运营中心（SOC），开启这些服务就能获得持续的安全监控能力。\n\n**Amazon GuardDuty**——智能威胁检测服务。它持续监控 AWS 账号中的恶意活动和异常行为，比如有人从一个从未出现过的国家 IP 登录你的账号、某台 EC2 实例突然开始向已知的恶意 IP 发送大量数据（可能在挖矿或数据外泄）、S3 存储桶出现可疑的下载模式。GuardDuty 不需要你部署任何代理或传感器——一键开启，它自动分析 CloudTrail 日志、VPC 流日志和 DNS 查询日志来发现威胁。\n\n**AWS Security Hub**——安全态势的「仪表盘」。它汇总来自 GuardDuty、Inspector、Macie、AWS Config 等多个安全服务的检测结果，给你一个统一的安全视图。它还能按行业标准（如 CIS AWS Foundations Benchmark）自动评估你的账号安全状态，给每个检查项打分，告诉你哪些地方不合规需要修复。\n\n**Amazon Inspector**——自动化漏洞扫描服务。它可以检测 EC2 实例上的操作系统漏洞（比如某个内核版本有已知 CVE）和 Lambda 函数的代码依赖漏洞，按严重程度排序输出报告。Inspector 是自动化的——开启后会持续扫描，不需要你手动跑扫描工具。\n\n**Amazon Macie**——用机器学习自动发现和保护 S3 中的敏感数据。比如自动扫描你的 S3 存储桶，告诉你哪些文件包含身份证号、信用卡号、社保号等个人可识别信息（PII，Personally Identifiable Information）。在数据量大的时候人工排查不现实，Macie 自动帮你盘点敏感数据分布。\n\n#### 数据保护服务\n\n**AWS KMS（Key Management Service，密钥管理服务）**——集中管理加密密钥。你可以创建密钥、设定轮换策略和控制谁能使用密钥。KMS 与 S3、EBS、RDS、DynamoDB 等 AWS 服务深度集成——这些服务里勾选「启用加密」时，底层就是调用 KMS。\n\n**AWS CloudHSM（Hardware Security Module，硬件安全模块）**——在 AWS 云中提供专属的硬件加密设备，运行在你 VPC 内的单租户硬件上。与 KMS 不同，CloudHSM 由你完全控制密钥——AWS 连访问你密钥的能力都没有。适合法规要求必须使用硬件加密模块的场景（如某些 PCI DSS 场景、FIPS 140-2 Level 3 要求）。价格比 KMS 贵得多，只有真正有合规硬性要求时才用。\n\n**AWS Secrets Manager**——管理应用程序密钥（数据库密码、API 密钥、OAuth 令牌等）。它帮你把密码从代码里拿出来，存在一个安全的地方，应用运行时通过 API 调用获取。它还能自动轮换数据库密码——设定轮换周期后，Secrets Manager 自动更新 RDS 数据库的密码，应用代码不需要改动。\n\n**AWS Certificate Manager（ACM，证书管理器）**——免费提供和管理 SSL/TLS 证书，用于加密网站和 API 的 HTTPS 传输。与 ELB（负载均衡器）、CloudFront（CDN）等服务深度集成，证书到期前**自动续期**，不需要你手动处理。\n\n| 服务 | 一句话定位 | 对应安全维度 |\n| --- | --- | --- |\n| Amazon GuardDuty | 智能威胁检测（分析日志发现异常行为） | 检测 |\n| AWS Security Hub | 安全态势仪表盘（多服务检测结果汇总+合规评分） | 治理 |\n| Amazon Inspector | 自动化漏洞扫描（EC2 操作系统 + Lambda 依赖） | 检测 |\n| Amazon Macie | S3 敏感数据发现（PII 自动识别） | 数据保护 |\n| AWS KMS | 加密密钥管理（与 AWS 服务集成，三种密钥方式） | 数据保护 |\n| AWS CloudHSM | 专属硬件加密模块（客户完全控制密钥，AWS 无法访问） | 数据保护 |\n| AWS Secrets Manager | 应用密钥管理 + 自动轮换（数据库密码/API密钥） | 数据保护 |\n| ACM | SSL/TLS 证书管理（免费+自动续期） | 数据保护 |\n\n#### DDoS 防护与 Web 应用防火墙\n\n**DDoS（分布式拒绝服务攻击）** 就是攻击者用大量假流量淹没你的服务，让正常用户无法访问——就像在高速公路上放几万辆车把路堵死，正常车辆过不去。AWS 提供 **AWS Shield** 来防 DDoS：\n\n- **Shield Standard**：免费，自动保护所有 AWS 客户，防御最常见的网络层（L3）和传输层（L4）DDoS 攻击（如 SYN 洪水、UDP 反射）。你不需要做任何配置，开了 AWS 账号就自动有。\n- **Shield Advanced**：付费（月费起步），提供更高级的防护（包括应用层 L7 攻击检测）、7×24 小时 DDoS 响应团队（DRT）专家支持，以及因 DDoS 导致的意外扩容费用退款（Cost Protection）。适合对可用性要求极高的业务。\n\n**AWS WAF（Web Application Firewall，Web 应用防火墙）** 保护 Web 应用免受常见的应用层攻击，比如 SQL 注入（攻击者在输入框里写 SQL 语句试图操控你的数据库）和跨站脚本 XSS（攻击者在网页里注入恶意脚本窃取用户信息）。WAF 可以部署在 Amazon CloudFront（CDN）、Application Load Balancer（应用负载均衡器）或 Amazon API Gateway 前面。你可以自定义过滤规则，也可以直接使用 AWS 和安全厂商提供的托管规则集。\n\nShield 和 WAF 的核心区别：**Shield 防的是暴力流量洪水（DDoS），WAF 防的是应用层恶意请求（SQL注入/XSS 等）**。两者经常一起部署——Shield 在前面挡住流量洪水，WAF 在后面过滤恶意请求。\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n在线票务平台「快票网」上线后一个月内发生了三件安全事件，每件都用到了不同的安全服务。\n\n第一，安全团队收到 GuardDuty 告警：某台 EC2 实例在凌晨 3 点向一个已知的恶意命令控制服务器 IP 发送大量数据。GuardDuty 通过分析 VPC 流日志发现了这个异常通信模式。调查后发现该实例被植入了挖矿脚本——运维团队立即隔离实例并重建。\n\n第二，Inspector 扫描发现 12 台 EC2 实例的操作系统有一个高危漏洞（CVE 评分 9.8），属于远程代码执行漏洞。Inspector 按严重程度标红并通知了运维团队，团队在 48 小时内完成了补丁更新。\n\n第三，演唱会开票当天遭遇 DDoS 攻击。Shield Standard 自动拦截了网络层的 SYN 洪水攻击，没有让假流量到达服务器。与此同时，攻击者还发起了大量恶意购票请求（应用层攻击），WAF 的 Rate-based 规则检测到单个 IP 每分钟请求超过阈值，自动封锁了这些 IP。三层防护（GuardDuty 检测异常行为 + Inspector 扫漏洞 + Shield/WAF 防攻击）协同工作，没有造成服务中断。\n\n#### 常见误区与易错点\n\n**误区一：安全组可以写拒绝规则。** 错。安全组只能写允许规则（Allow only）。如果你需要显式拒绝某个特定 IP 访问，必须用网络 ACL（NACL）来做。这是安全组和 NACL 最常被考到的区别。\n\n**误区二：Shield Standard 需要额外购买或开启。** 错。Shield Standard 对所有 AWS 客户自动免费开启——你不需要做任何操作，开了 AWS 账号就自动享有网络层和传输层的基础 DDoS 防护。只有 Shield Advanced 才需要额外付费和手动开通。\n\n**误区三：KMS 和 CloudHSM 是一回事。** 不是。最核心的区别：KMS 是 AWS 托管的密钥管理服务（AWS 维护基础设施，但你定义和控制密钥使用策略）；CloudHSM 是你独占的硬件加密模块（AWS 完全无法访问你的密钥材料）。CloudHSM 贵且复杂，只在合规硬性要求时使用；绝大多数场景用 KMS 就够了。\n\n#### 记忆要点\n\n- 安全组 = 实例级 + 有状态 + 只允许规则；NACL = 子网级 + 无状态 + 允许和拒绝规则\n- GuardDuty = 智能威胁检测（一键开启，分析 CloudTrail/VPC Flow/DNS 日志）\n- Inspector = 漏洞扫描（EC2 操作系统 + Lambda 依赖）；Macie = S3 敏感数据发现\n- KMS = 托管密钥管理（与 AWS 服务集成）；CloudHSM = 专属硬件加密（客户完全控制）\n- Secrets Manager = 应用密码管理 + 自动轮换；ACM = 免费 SSL/TLS 证书 + 自动续期\n- Shield Standard = 免费自动 DDoS 防护（L3/L4）；Shield Advanced = 付费高级防护（含 L7 + DRT + 费用退款）\n- WAF = Web 应用防火墙（SQL注入/XSS 防护），部署在 CloudFront/ALB/API Gateway 前面\n- Security Hub = 安全仪表盘，汇总多服务检测结果，按标准自动评分"}],"practice":[{"id":"Q5","d":2,"t":"single","q":"在 AWS 共享责任模型下，以下哪项是客户使用 Amazon DynamoDB 时的责任？","o":[{"l":"A","t":"DynamoDB 的物理安全"},{"l":"B","t":"DynamoDB 的补丁"},{"l":"C","t":"对 DynamoDB 表的访问"},{"l":"D","t":"DynamoDB 中数据的静态加密"}],"a":["C"],"e":"根据 AWS 共享责任模型，客户负责管理对其 DynamoDB 表的访问。这包括设置适当的 IAM 策略和角色，以控制谁可以访问表以及他们可以执行的操作。","s":""},{"id":"Q39","d":2,"t":"single","q":"一家公司正在 AWS 账户上设置 AWS 身份和访问管理 (IAM)。哪个建议符合 IAM安全最佳实践？","o":[{"l":"A","t":"使用帐户根用户访问密钥进行管理任务。"},{"l":"B","t":"授予广泛的权限，以便所有公司员工都可以访问他们需要的资源。"},{"l":"C","t":"启用多因素认证 (MF"},{"l":"D","t":"在登录过程中增加安全性。"},{"l":"E","t":"避免轮换凭证，以防止生产应用程序出现问题。"}],"a":["C"],"e":"启用多因素认证 (MFA) 是一种安全最佳实践，通过要求用户在密码之外提供第二种形式的认证，增加了额外的安全层。这有助于防止未经授权的访问，即使凭证被泄露。","s":""},{"id":"Q41","d":2,"t":"single","q":"哪个服务使客户能够在其 AWS 账户中审计 API 调用？","o":[{"l":"A","t":"AWS CloudTrail"},{"l":"B","t":"AWS Trusted Advisor"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"AWS X-Ray"}],"a":["A"],"e":"AWS CloudTrail 通过捕获和记录这些调用，使客户能够在其 AWS 账户中审计 API 调用。它提供了用户和资源活动的可见性，可用于安全分析、合规性检查和故障排除。","s":""},{"id":"Q84","d":2,"t":"single","q":"用户在哪里可以找到有关 AWS 的合规性相关信息和报告的最佳资源？","o":[{"l":"A","t":"AWS 工件"},{"l":"B","t":"AWS 市场"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"AWS 支持"}],"a":["A"],"e":"它是一个门户，提供按需访问 AWS 合规性报告、认证和证明。它是各种合规性相关文档的集中位置。","s":""},{"id":"Q105","d":2,"t":"multiple","q":"根据 AWS 共享责任模型，以下哪两项任务是客户的职责？","o":[{"l":"A","t":"建立全球基础设施"},{"l":"B","t":"执行客户端数据加密"},{"l":"C","t":"配置 IAM 凭证"},{"l":"D","t":"保护边缘位置的安全"},{"l":"E","t":"修补 Amazon RDS 数据库实例"}],"a":["B","C"],"e":"根据 AWS 共享责任模型，客户的职责包括执行客户端数据加密（选项 B），以确保数据在传输过程中的安全，以及配置IAM凭证（选项 C）以管理对 AWS 资源的访问。","s":""},{"id":"Q108","d":2,"t":"single","q":"用户希望允许在 Amazon EC2 实例上运行的应用程序调用其他 AWS 服务。授予的访问权限必须是安全的。应该使用哪个 AWS 服务或功能？","o":[{"l":"A","t":"安全组"},{"l":"B","t":"AWS 防火墙管理器"},{"l":"C","t":"IAM 角色"},{"l":"D","t":"IAM 用户 SSH 密钥"}],"a":["C"],"e":"为了允许在 Amazon EC2 实例上运行的应用程序安全地调用其他 AWS 服务，推荐的 AWS 服务或功能是 IAM 角色（选项C）。IAM 角色提供了一种安全的方式，将权限委派给 AWS 服务和资源，无需长期凭证。","s":""},{"id":"Q219","d":2,"t":"multiple","q":"哪种加密类型可用于保护 Amazon S3 中静止的对象？（选择两个）","o":[{"l":"A","t":"使用 Amazon S3 管理的加密密钥的服务器端加密（SSE-S3）"},{"l":"B","t":"使用 AWS KMS 管理的密钥的服务器端加密（SSE-KMS）"},{"l":"C","t":"TLS"},{"l":"D","t":"SSL"},{"l":"E","t":"透明数据加密（TDE）"}],"a":["A","B"],"e":"SSE-S3 和 SSE-KMS 都为存储在 Amazon S3 中的数据提供加密，SSE-S3 使用由 Amazon S3 管理的密钥，SSE-KMS 使用由AWS 密钥管理服务（KMS）管理的密钥。","s":""},{"id":"Q288","d":2,"t":"single","q":"外部审计师已请求一家公司提供其所有 IAM 用户列表，包括用户凭据和访问密钥的状态。提供此信息的最简单方法是什么？","o":[{"l":"A","t":"为审计师创建一个 IAM 用户账户，授予审计师管理员权限。"},{"l":"B","t":"截取 AWS 管理控制台中每个用户的页面的屏幕截图，然后将截图提供给审计师。"},{"l":"C","t":"下载 IAM 凭据报告，然后将报告提供给审计师。"},{"l":"D","t":"下载 AWS Trusted Advisor 报告，然后将报告提供给审计师。"}],"a":["C"],"e":"向外部审计师提供 IAM 用户列表以及他们凭据和访问密钥状态的最简单方法是下载 IAM 凭据报告。","s":""},{"id":"Q437","d":2,"t":"single","q":"\"云的安全性\"在 AWS 共享责任模型中指的是什么？","o":[{"l":"A","t":"AWS 服务的可用性，如 Amazon EC2"},{"l":"B","t":"运行所有 AWS 服务的云基础设施的安全性"},{"l":"C","t":"为 IAM 用户实施密码策略"},{"l":"D","t":"通过使用 AWS 网络防火墙合作伙伴确保客户环境的安全性"}],"a":["B"],"e":"在 AWS 共享责任模型中，\"云的安全性\"指的是 AWS 拥有和管理的底层云基础设施的安全性。这包括 AWS 数据中心、服务器和网络设备的物理和环境安全性。","s":""},{"id":"Q603","d":2,"t":"single","q":"Amazon GuardDuty 的主要用例是什么？","o":[{"l":"A","t":"预防 DDoS 攻击"},{"l":"B","t":"防范 SQL 注入攻击"},{"l":"C","t":"自动监控对 AWS 工作负载的威胁"},{"l":"D","t":"自动配置 AWS 资源"}],"a":["C"],"e":"Amazon GuardDuty 主要用于自动监控和检测对 AWS 工作负载的潜在威胁，提供实时威胁检测和持续监控，以帮助保护AWS 环境。","s":""}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 2.1.1 | 责任共担分界线（OF the Cloud vs IN the Cloud） | ⭐⭐⭐ 高 | 场景判断题 |\n| 2.1.2 | 托管服务越多，客户责任越少 | ⭐⭐⭐ 高 | 场景题 |\n| 2.2.1 | 传输中加密 vs 静态加密 | ⭐⭐ 中 | 概念题 |\n| 2.2.2 | CloudTrail vs Config 工具区分 | ⭐⭐⭐ 高 | 配对题 |\n| 2.2.3 | Organizations 与 SCP 多账号治理 | ⭐ 低 | 概念题 |\n| 2.3.1 | IAM 流程：认证→授权→操作 | ⭐⭐ 中 | 流程题 |\n| 2.3.2 | 根用户保护（MFA/最小权限/不用日常操作） | ⭐⭐⭐ 高 | 安全最佳实践题 |\n| 2.3.3 | IAM 用户 vs 角色 vs 联合身份 | ⭐⭐ 中 | 概念题 |\n| 2.3.4 | IAM 策略默认拒绝逻辑 | ⭐⭐ 中 | 概念题 |\n| 2.4.1 | 安全组 vs 网络 ACL（有状态/无状态） | ⭐⭐⭐ 高 | 对比题 |\n| 2.4.2 | 安全服务场景选择（GuardDuty/Inspector/WAF/Shield 等） | ⭐⭐⭐ 高 | 场景题 |","services":"| 服务 | 主要用途 | 涉及 Task |\n|---|---|---|\n| AWS IAM | 身份与访问管理（免费，认证+授权） | 2.3 |\n| AWS KMS | 密钥管理与加密 | 2.2 |\n| AWS CloudTrail | API 调用审计日志 | 2.2 |\n| AWS Config | 资源配置合规评估 | 2.2 |\n| AWS Organizations + SCP | 多账号统一治理 | 2.2 |\n| Amazon GuardDuty | 威胁检测 | 2.4 |\n| Amazon Inspector | 漏洞扫描 | 2.4 |\n| AWS WAF / AWS Shield | Web 应用防火墙 / DDoS 防护 | 2.4 |"}},{"domain":3,"name":"云技术与服务","weight":"34%","sections":[{"h":"在 AWS 云中部署与运营的方法","body":"> 本域对应官方考纲任务声明 3.1–3.8：部署与运营方法、全球基础设施、计算、数据库、网络、存储、AI/ML 与分析、其他服务类别。\n\n#### 本节定位\n\n本节对应考纲 3.1「定义在 AWS 云中部署和运营的方法」。学完之后你应该能回答：除了在网页上手动点点点，还有哪些方式可以操作 AWS？什么是\"基础设施即代码\"，它比手动操作好在哪里？AWS 提供了哪些工具帮你管理和部署资源？考试遇到「可重复部署」「版本控制基础设施」「自动化运维」这类关键词时，你应该第一时间想到什么服务？这些问题几乎每次考试都会出，是域 3 的入门基石。\n\n#### 与 AWS 交互的三种方式\n\n你在 AWS 上做的每一个操作——不管是开一台虚拟机还是创建一个数据库——本质上都是在调用 AWS 的 API（Application Programming Interface，程序接口——你可以把它想象成餐厅的点菜窗口：你把需求写在单子上递进去，后厨按单出菜）。AWS 提供三种方式让你下单：\n\n**第一种：AWS Management Console（管理控制台）**。这是一个网页界面，登录后用鼠标点击就能操作。适合刚入门的人探索和学习，也适合做一次性的小操作。缺点是不可重复——你手动点了 20 步创建一套环境，下次想再来一套完全一样的，只能再点 20 步，容易漏步骤或点错。而且手动操作没有天然的记录，出了问题很难追溯是谁、什么时间、点了哪个按钮导致的。\n\n**第二种：AWS CLI（Command Line Interface，命令行界面）**。在终端（类似 Windows 的命令提示符或 Mac 的终端窗口）输入文字命令操作 AWS。例如 `aws ec2 run-instances --image-id ami-xxx --instance-type t3.micro` 就能启动一台虚拟机。CLI 的好处是命令可以保存成脚本文件，下次原样再跑一遍就能得到完全相同的结果，天然可重复。脚本还可以放进版本管理工具（如 Git），谁改了什么一目了然。运维人员日常用 CLI 最多，批量操作几十台机器只需要一个循环脚本。\n\n**第三种：AWS SDK（Software Development Kit，软件开发工具包）**。在你写的程序代码里直接调用 AWS 服务。比如用 Python 的 boto3 库，几行代码就能上传文件到 Amazon S3 或者查询数据库状态。SDK 目前支持十几种编程语言（Python、Java、JavaScript、Go、.NET 等）。适合需要在应用程序中自动化调用 AWS 的场景——比如用户在你的网站上注册账号，后台代码自动在 S3 里创建一个用户文件夹。\n\n这三种方式底层都是同一套 API，区别只是交互界面不同。用 Console 点出来的效果和用 CLI 跑出来的效果完全一致。考试考点：看到「哪种方式适合自动化/可重复」→ CLI 或 SDK；「哪种适合探索和学习」→ Console。如果题目提到「开发者需要在应用代码中集成 AWS 功能」→ SDK。\n\n#### 基础设施即代码（IaC）\n\n「基础设施即代码」（Infrastructure as Code，IaC）是云时代最重要的运维理念之一。传统做法是运维工程师登录服务器一台一台手动配置——开防火墙端口、安装软件、改配置文件——每台机器都要操作一遍，而且两个工程师配出来的机器可能不一样（因为有人漏了一步或者改了某个参数）。IaC 的做法是把你想要的基础设施——几台服务器、什么规格、怎么联网、装什么软件——全部写进一个模板文件，然后让工具自动按模板创建出来。\n\n这样做有三个核心好处。**可重复**：同一个模板跑十次，出来十套一模一样的环境——不会有「我的机器上能跑你的不行」的问题。**可版本控制**：模板放进 Git，谁改了什么一目了然，改坏了可以回滚到上一版。**可审计**：模板本身就是文档，审计人员直接看模板就知道当前环境长什么样，不需要一台一台登录检查。这三个好处直接对应 Well-Architected Framework 卓越运营支柱的设计原则——「把运维动作变成代码」「频繁、小规模、可逆地变更」。（来源：official-wa-framework.md，Pillar 1 设计原则第 3 条和第 4 条）\n\nAWS 上实现 IaC 的核心服务是 **AWS CloudFormation**。你写一个 JSON 或 YAML 格式的模板文件（模板里描述你要的资源——比如一个 VPC、两个子网、三台 EC2、一个负载均衡器），然后把模板提交给 CloudFormation，它自动创建所有资源。这套资源的集合叫做一个「栈」（Stack）。后续想改环境，修改模板再提交，CloudFormation 自动算出哪些资源要新增、修改还是删除。想彻底清理环境？删除栈就行——CloudFormation 会按依赖顺序反向删除所有资源，不需要你一个一个手动找。\n\n另一个常见工具是 **AWS CDK（Cloud Development Kit）**，它允许你用熟悉的编程语言（Python、TypeScript、Java 等）定义基础设施。CDK 在底层会把你写的代码编译成 CloudFormation 模板再执行——所以 CDK 本质上是 CloudFormation 的「编程语言包装」。对开发者来说，用 Python 写比直接编辑 YAML 文件更自然，还能利用编程语言的循环和条件判断动态生成模板。\n\n还有一个常出现在考题里的服务是 **AWS Elastic Beanstalk**。它的定位不是 IaC，而是「平台即服务」（PaaS，Platform as a Service）——你把应用代码上传，Beanstalk 自动帮你创建运行环境（EC2 实例、负载均衡器、Auto Scaling 策略、数据库连接）。底层确实用了 CloudFormation，但面向的是「不想操心基础设施的开发者」。考试区分：IaC/模板化基础设施 → CloudFormation/CDK；PaaS 快速部署应用代码 → Beanstalk。\n\n\n#### AWS Systems Manager：运行中资源的批量管理\n\nCloudFormation 管的是「创建和变更基础设施」，而 **AWS Systems Manager** 管的是「已经在运行的资源怎么日常维护」。它就像一个远程管理平台，可以同时对上百台 EC2 实例批量执行操作：\n\n- **Run Command**：不用 SSH 登录就能在多台实例上远程执行命令（比如批量安装补丁、重启服务、收集日志）。\n- **Patch Manager**：自动化操作系统补丁管理——设定补丁基线和维护窗口，Systems Manager 按计划自动给所有实例打补丁。\n- **Parameter Store**：安全存储配置参数和密钥（如数据库密码、API 密钥），应用程序运行时读取，不用硬编码在代码里。\n- **Session Manager**：通过浏览器或 CLI 直接连接实例的终端，无需打开 SSH 端口——更安全。\n- **Inventory**：自动收集所有管理实例的软件清单（装了什么软件、什么版本），方便合规审计。\n\n考试考点：看到「批量管理运行中的实例」「远程命令」「补丁管理」→ Systems Manager。它和 CloudFormation 不冲突——CloudFormation 负责创建环境，Systems Manager 负责运维环境。\n\n#### CI/CD 持续集成与持续部署\n\n考试偶尔出现的 AWS 开发者工具三件套：**AWS CodePipeline**（自动化发布流水线——代码提交后自动触发构建、测试、部署的全过程）、**AWS CodeBuild**（托管构建服务——编译代码、跑单元测试、打包）、**AWS CodeDeploy**（自动化部署——把构建好的代码部署到 EC2 或 Lambda 上，支持蓝绿部署和滚动更新）。这三个服务串在一起就是完整的 CI/CD 流水线。考试遇到「自动化发布流程」「代码提交后自动部署」→ CodePipeline。\n\n#### 部署与管理工具速查表\n\n| 工具 | 一句话定位 | 适合谁 |\n|---|---|---|\n| AWS Management Console | 网页图形界面，点击操作 | 学习探索、一次性操作 |\n| AWS CLI | 终端命令行，可脚本化 | 运维自动化、批量操作 |\n| AWS SDK | 程序代码中调用 API | 应用开发、深度集成 |\n| AWS CloudFormation | 模板定义基础设施（IaC） | 可重复部署、版本化管理 |\n| AWS CDK | 用编程语言写 IaC | 开发者偏好代码而非模板 |\n| AWS Elastic Beanstalk | 上传代码自动部署运行环境 | 快速部署 Web 应用（PaaS） |\n| AWS Systems Manager | 批量管理运行中的实例和资源 | 运维巡检、补丁、远程命令 |\n| AWS CodePipeline / CodeBuild / CodeDeploy | CI/CD 持续集成与持续部署 | 自动化发布流水线 |\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n初创公司「码上飞」的后端跑在 3 台 EC2 上，最初开发者通过控制台手动创建，每次要搭一套测试环境就得花半天。后来改用 CloudFormation：把 VPC、安全组、EC2、负载均衡器全写进一个模板，`aws cloudformation create-stack` 一条命令 10 分钟自动搭好。开发环境、测试环境、生产环境用同一个模板的不同参数，三套环境配置完全一致，再也没出过「测试环境正常、生产环境报错」的问题。一次模板更新意外把安全组端口改错了，因为模板在 Git 里有版本记录，团队 5 分钟就定位到是哪次提交引入的，回滚到上一版本即恢复正常。\n\n#### 常见误区与易错点\n\n- **误区一：CloudFormation 只能创建资源，不能更新和删除**。错。CloudFormation 支持「更新栈」（修改模板后重新部署，自动算出哪些资源要增删改）和「删除栈」（一键清理所有资源）。考试常考「如何安全地清理一整套环境」→ 答案就是删除 CloudFormation 栈。\n- **误区二：Elastic Beanstalk 是 IaC 工具**。不是。Beanstalk 是 PaaS（平台即服务），你上传应用代码，它自动帮你创建运行环境。底层用了 CloudFormation 但定位完全不同——Beanstalk 管的是应用部署，CloudFormation 管的是基础设施定义。考试看到「用模板描述基础设施」→ CloudFormation；「上传代码自动部署」→ Beanstalk。\n- **误区三：CLI 和 SDK 做的事不一样**。它们调的是同一套 API，结果完全一致。CLI 适合运维脚本和终端交互，SDK 适合嵌入应用程序代码。考试不会问哪个「更强大」——它们能力等价。\n\n#### 记忆要点\n\n- 三种交互方式：Console（网页）/ CLI（命令行）/ SDK（代码）——底层同一套 API\n- IaC 核心服务 = CloudFormation（模板描述→栈→自动创建/更新/删除）\n- CDK = 用编程语言写 IaC → 底层编译成 CloudFormation 模板\n- Beanstalk = PaaS 快速部署应用代码（不是 IaC）\n- 看到「可重复」「版本控制」「自动化部署」→ CloudFormation/CDK\n- Systems Manager = 已运行资源的批量管理（补丁、命令、清单）"},{"h":"AWS 全球基础设施","body":"#### 本节定位\n\n本节对应考纲 3.2 的基础设施部分。学完你应该能回答：AWS 在全球的机房是怎么组织的？Region（区域）和 Availability Zone（可用区）到底是什么关系？为什么 AWS 要在一个 Region 里放好几个可用区？Edge Location（边缘站点）又是做什么的？给定一个场景，你能不能判断该选哪个 Region？这些是考试高频考点，几乎每套题都有两三道。\n\n#### 什么是 Region、AZ 和 Edge Location\n\nAWS 的全球基础设施从大到小分三层。理解这三层是理解所有 AWS 服务部署方式的基础。\n\n**Region（区域）**是最大的单元——每个 Region 是一个独立的地理区域，比如「美东弗吉尼亚 us-east-1」「亚太东京 ap-northeast-1」「中国宁夏 cn-northwest-1」。截至目前 AWS 在全球运营超过 30 个 Region。关键特性：每个 Region 之间的数据和服务**完全独立、互不影响**——你在东京 Region 创建的 EC2 实例和 S3 存储桶，新加坡 Region 看不到也访问不到（除非你主动设置跨区域复制）。这种隔离是数据主权和合规的基础。\n\n**Availability Zone（可用区，简称 AZ）**是 Region 内部的子单元。每个 Region 至少包含 3 个 AZ（这是 AWS 的设计标准）。每个 AZ 本质上是一个或多个独立的数据中心（数据中心 = 放服务器的大型专用建筑，配有独立供电系统、冷却系统和网络接入）。AZ 之间的关键设计：**物理距离足够远**——避免一场火灾或洪水同时影响两个 AZ；**但又通过高带宽、低延迟的专用光纤互联**——AZ 间通信延迟通常在个位数毫秒级。AWS 全球骨干网 p99 每小时丢包率目标低于 0.0001%（来源：aws-vpc-network-core-concepts.md）。\nAWS 在每个 AZ 内使用的是自己设计的高性能服务器（搭载 AWS Nitro System 虚拟化平台）和自研的网络交换设备。AZ 之间通过冗余的私有光纤链路互联——同一 Region 内 AZ 间的通信不经过公共互联网，全部在 AWS 私有骨干网上传输。这意味着跨 AZ 的数据传输既安全（加密+隔离）又稳定（丢包率极低）。用户访问时感知不到自己的请求被哪个 AZ 处理——负载均衡器会自动把请求分配到健康的 AZ。\n\n从计费角度看：同一 AZ 内的数据传输通常**免费**；跨 AZ 的数据传输按 $0.01/GB 收费（这就是所谓的 DTAZ 费用）。（来源：aws-vpc-network-core-concepts.md，VPC Peering 同 AZ 免费 / 跨 AZ $0.01/GB）\n\n这种\"远到不会一起挂、近到通信不卡\"的设计，使得你可以跨 AZ 部署应用来获得高可用性。\n\n这种设计的目的就是**高可用**（High Availability）。你的应用部署在同一 Region 的多个 AZ 上，即使其中一个 AZ 整个故障（比如发生断电或网络中断这种极端情况），另外两个 AZ 仍然在跑，用户几乎感觉不到中断。这就是考纲反复考的「多 AZ 部署」概念。很多 AWS 服务（如 Amazon RDS 的 Multi-AZ、S3 的跨 AZ 存储）都是基于这个机制实现高可用的。\n\n**Edge Location（边缘站点）**是 AWS 在全球各大城市部署的缓存节点，数量远多于 Region——目前超过 400 个点分布在几十个国家。它们不运行你的应用或数据库，而是把你的内容（图片、视频、网页、API 响应等）缓存到离用户最近的位置，让用户就近获取而不用跑到远处的源服务器。这种技术叫 CDN（Content Delivery Network，内容分发网络）。与 Edge Location 最相关的 AWS 服务是 **Amazon CloudFront**。\n\n除了 CloudFront 的缓存节点，Edge Location 还部署了 **AWS WAF**（Web 应用防火墙）的规则执行、**AWS Shield**（DDoS 防护）的就近清洗、以及 **Route 53**（DNS 解析）的端点。所以\"边缘\"不只是缓存加速，还包含安全防护和 DNS 解析。\n\n\n[[fig:f01]]\n\n#### Region 选择的四个考量\n\n考试经常出这样的题：「一家公司主要客户在欧洲，需要遵守 GDPR，该选哪个 Region？」判断依据按优先级排序：\n\n1. **合规要求**（最高优先级）：某些行业或国家法规要求数据不能出境。例如中国的《数据安全法》要求数据留在中国境内，欧盟 GDPR 要求欧洲公民数据受欧盟管辖。这种情况下 Region 选择没有余地——必须选满足合规的那个。\n2. **延迟**：用户主要在哪里，Region 就选离用户近的。东南亚用户多 → 选新加坡 Region；美国东部用户多 → 选 us-east-1。\n3. **服务可用性**：不是所有 AWS 服务在所有 Region 都可用。新服务通常先在美东 us-east-1 上线，然后逐步扩展到其他 Region。如果你的应用依赖某个较新的服务，需要确认它在目标 Region 可用。\n4. **价格**：同样的服务在不同 Region 价格不同。通常美东 us-east-1 价格最低（AWS 起家的地方，规模最大），巴西和中东 Region 通常较贵。\n\n考试口诀：**合规第一、延迟第二、服务第三、价格第四**。\n\n#### Region vs AZ vs Edge Location 对比表\n\n| 维度 | Region（区域）| AZ（可用区）| Edge Location（边缘站点）|\n|---|---|---|---|\n| 是什么 | 一个独立的地理区域 | Region 内的独立数据中心群 | 全球缓存/安全/DNS 节点 |\n| 数量级 | 30+ | 每个 Region ≥ 3 | 400+ |\n| 功能 | 完整运行所有 AWS 服务 | 提供物理隔离的高可用 | 缓存内容/加速访问/安全防护/DNS 解析 |\n| 数据隔离 | Region 间完全独立 | 同 Region 内互通（低延迟专线） | 只缓存副本，不存储用户源数据 |\n| 选择依据 | 合规/延迟/服务/价格 | 自动或手动分散部署 | CloudFront/WAF/Shield/Route 53 自动就近 |\n| 典型考题 | 选 Region 的判断标准 | 多 AZ 高可用 | CloudFront 加速/WAF 边缘防护 |\n\n#### 全球服务 vs 区域服务\n\n大多数 AWS 服务是「区域级」的——在哪个 Region 创建就属于哪个 Region。但有少数是「全球级」的：\n\n- **IAM**（身份和访问管理）：用户、角色、策略全球生效\n- **Route 53**（DNS）：全球 DNS 解析\n- **CloudFront**（CDN）：全球内容分发\n- **AWS WAF**（挂在 CloudFront 上时）：全球边缘防护\n\n考试常考：「IAM 创建的用户在哪个 Region 生效？」→ 所有 Region 都生效（全球服务）。\n\n\n#### Local Zones 和 Wavelength Zones\n\n除了 Region、AZ 和 Edge Location 这三层核心架构，AWS 还有两种延伸基础设施值得了解：\n\n**AWS Local Zones**（本地区域）：AWS 将计算、存储等服务延伸到靠近人口密集城市的位置——比如洛杉矶、波士顿这样的城市有 Local Zone，让这些城市的用户获得个位数毫秒的延迟。Local Zone 逻辑上属于某个 Region（比如洛杉矶 Local Zone 属于 us-west-2），但物理位置在城市附近。适合对延迟极度敏感的应用（如实时视频编辑、游戏流媒体、机器学习推理）。\n\n**AWS Wavelength Zones**（波长区域）：AWS 将计算和存储服务嵌入到电信运营商的 5G 网络边缘。这样通过 5G 手机访问的应用可以获得超低延迟——数据不出运营商网络就能被处理。适合 5G 应用场景（如增强现实、联网汽车、实时游戏）。\n\n考试不常深入考这两个概念的细节，但可能出现在选择题选项里——看到「靠近大城市的超低延迟计算」→ Local Zone；「5G 边缘计算」→ Wavelength Zone。\n\n#### 高可用架构的完整图景\n\n把前面讲的组件串起来，一个典型的高可用架构是这样的：\n\n- 选一个满足合规要求的 Region\n- 应用部署在该 Region 的至少 2 个 AZ（最好 3 个）\n- 前面挂 ELB（负载均衡器）做流量分发和健康检查\n- 用 Auto Scaling 按负载自动增减实例\n- 静态内容用 CloudFront 通过全球 Edge Location 加速分发\n- 数据库用 Multi-AZ 部署（RDS）或跨 AZ 分布式存储（Aurora）\n\n这套组合就是 Well-Architected Framework 可靠性支柱的核心实践——「从故障中自动恢复」「水平扩展提升整体可用性」「停止猜测容量」。（来源：official-wa-framework.md，Pillar 3 设计原则）\n\n考试看到「如何设计高可用架构」→ 答案一定包含「多 AZ 部署」+ 「ELB」+ 「Auto Scaling」。看到「如何实现灾难恢复」→ 可能涉及跨 Region 复制（如 S3 跨区域复制、Aurora Global Database）。\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n在线教育公司「知学堂」在东京 Region 部署了一套视频课程平台。学生遍布日本、韩国和东南亚。视频存储在 Amazon S3，前面用 CloudFront 分发。一个韩国学生点开课程视频时，CloudFront 自动从离他最近的首尔 Edge Location 返回缓存内容，加载速度从原来直连东京源服务器的 3 秒降到 0.5 秒。后端应用部署在东京 Region 的三个 AZ 上——某天 AZ-1 的供电系统故障导致整个 AZ 不可用，但 AZ-2 和 AZ-3 自动接管所有流量，负载均衡器（ELB）检测到 AZ-1 的实例健康检查失败后自动停止向其分发请求，学生完全无感知。这就是「多 AZ 高可用 + CloudFront 边缘加速」的典型组合。\n\n#### 常见误区与易错点\n\n- **误区一：一个 AZ 就是一台服务器或一个机柜**。不是。一个 AZ 是一组物理上独立的数据中心设施（可能有多栋建筑），有独立的供电、冷却和网络接入。它比「一台服务器」大得多——一个 AZ 里可能有上万台服务器。\n- **误区二：Edge Location 和 AZ 是一回事**。完全不同。AZ 跑你的应用和数据库（EC2、RDS 等都部署在 AZ 里），Edge Location 只做缓存加速和边缘安全。你不能在 Edge Location 上部署 EC2 实例或运行数据库。\n- **误区三：选 Region 主要看价格**。考试中合规要求永远排第一。如果题目提到「法规要求数据存储在特定国家」或「GDPR」，那 Region 只能选那个国家或区域——即使它更贵、延迟更高。价格只在其他条件相同时才是决定因素。\n\n\n还有一个考试偶尔提及的概念：**AWS Outposts**——AWS 把自家的硬件机柜直接装到你的本地数据中心里，让你在自己的机房中运行和云上一模一样的 AWS 服务。Outposts 适合「数据必须留在本地但又想用 AWS 服务和 API」的场景（如工厂车间的低延迟本地处理、某些国家的数据驻留法规）。它不是远程访问云，而是「把云搬到你家」。考试考点：看到「在本地数据中心运行 AWS 服务」→ Outposts。\n\n#### 记忆要点\n\n- Region > AZ > Edge Location（从大到小三层）\n- 每个 Region ≥ 3 个 AZ；AZ 之间物理隔离但专线互联（毫秒级延迟）\n- 多 AZ 部署 = 高可用的核心手段\n- Edge Location = CloudFront 缓存 + WAF 安全 + Route 53 DNS，不跑应用\n- 全球服务：IAM / Route 53 / CloudFront / WAF（挂 CloudFront 时）\n- Region 选择口诀：合规 > 延迟 > 服务 > 价格","figures":[{"id":"f01","title":"AWS 全球基础设施分层：Region → AZ → 数据中心","caption":"考点：Region 间完全隔离；AZ=独立供电/冷却+光纤互联，高可用需跨至少 2 个 AZ；Edge 只做 CDN 内容分发（不含计算）","html":"<svg viewBox=\"0 0 640 300\" style=\"width:100%;max-width:640px;display:block;margin:0 auto\">\n  <text x=\"20\" y=\"30\" font-size=\"13\" font-weight=\"700\" fill=\"#1e1b4b\">① Region 区域（全球 30+ 个，互相独立、数据隔离）<\/text>\n  <rect x=\"20\" y=\"44\" width=\"390\" height=\"216\" rx=\"12\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"2\" stroke-dasharray=\"7 4\"/>\n  <!-- AZ x3 -->\n  <rect x=\"40\" y=\"86\" width=\"110\" height=\"140\" rx=\"8\" fill=\"#ddd6fe\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/>\n  <text x=\"95\" y=\"104\" font-size=\"11\" font-weight=\"700\" fill=\"#3730a3\" text-anchor=\"middle\">AZ 可用区<\/text>\n  <rect x=\"52\" y=\"116\" width=\"86\" height=\"32\" rx=\"5\" fill=\"#818cf8\"/>\n  <text x=\"95\" y=\"136\" font-size=\"9.5\" fill=\"#fff\" text-anchor=\"middle\">数据中心<\/text>\n  <rect x=\"52\" y=\"154\" width=\"86\" height=\"32\" rx=\"5\" fill=\"#a5b4fc\"/>\n  <text x=\"95\" y=\"174\" font-size=\"9.5\" fill=\"#312e81\" text-anchor=\"middle\">数据中心<\/text>\n  <rect x=\"160\" y=\"86\" width=\"110\" height=\"140\" rx=\"8\" fill=\"#ddd6fe\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/>\n  <text x=\"215\" y=\"104\" font-size=\"11\" font-weight=\"700\" fill=\"#3730a3\" text-anchor=\"middle\">AZ 可用区<\/text>\n  <rect x=\"172\" y=\"116\" width=\"86\" height=\"32\" rx=\"5\" fill=\"#818cf8\"/>\n  <text x=\"215\" y=\"136\" font-size=\"9.5\" fill=\"#fff\" text-anchor=\"middle\">数据中心<\/text>\n  <rect x=\"172\" y=\"154\" width=\"86\" height=\"32\" rx=\"5\" fill=\"#a5b4fc\"/>\n  <text x=\"215\" y=\"174\" font-size=\"9.5\" fill=\"#312e81\" text-anchor=\"middle\">数据中心<\/text>\n  <rect x=\"280\" y=\"86\" width=\"110\" height=\"140\" rx=\"8\" fill=\"#ddd6fe\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/>\n  <text x=\"335\" y=\"104\" font-size=\"11\" font-weight=\"700\" fill=\"#3730a3\" text-anchor=\"middle\">AZ 可用区<\/text>\n  <rect x=\"292\" y=\"116\" width=\"86\" height=\"32\" rx=\"5\" fill=\"#818cf8\"/>\n  <text x=\"335\" y=\"136\" font-size=\"9.5\" fill=\"#fff\" text-anchor=\"middle\">数据中心<\/text>\n  <rect x=\"292\" y=\"154\" width=\"86\" height=\"32\" rx=\"5\" fill=\"#a5b4fc\"/>\n  <text x=\"335\" y=\"174\" font-size=\"9.5\" fill=\"#312e81\" text-anchor=\"middle\">数据中心<\/text>\n  <text x=\"30\" y=\"244\" font-size=\"10\" fill=\"#4338ca\">每个 Region ≥3 个 AZ；AZ 间物理隔离但光纤互联<\/text>\n  <!-- Edge -->\n  <rect x=\"430\" y=\"60\" width=\"190\" height=\"200\" rx=\"12\" fill=\"#c7d2fe\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <text x=\"525\" y=\"82\" font-size=\"13\" font-weight=\"700\" fill=\"#3730a3\" text-anchor=\"middle\">② Edge Location<\/text>\n  <rect x=\"448\" y=\"96\" width=\"154\" height=\"34\" rx=\"6\" fill=\"#4f46e5\"/>\n  <text x=\"525\" y=\"117\" font-size=\"10.5\" fill=\"#fff\" text-anchor=\"middle\">CloudFront 边缘缓存<\/text>\n  <text x=\"525\" y=\"158\" font-size=\"10.5\" fill=\"#1e1b4b\" text-anchor=\"middle\">内容就近分发、加速访问<\/text>\n  <text x=\"525\" y=\"178\" font-size=\"10.5\" fill=\"#1e1b4b\" text-anchor=\"middle\">（只缓存内容，不是计算资源）<\/text>\n  <text x=\"525\" y=\"210\" font-size=\"10.5\" fill=\"#3730a3\" text-anchor=\"middle\">全球数百个站点<\/text>\n  <!-- bottom note -->\n  <text x=\"20\" y=\"286\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1e1b4b\">③ 层级记忆：Region（区域）→ AZ（可用区）→ 数据中心；CDN 走 Edge，不等于在 Edge 上跑应用<\/text>\n<\/svg>"}]},{"h":"AWS 计算服务","body":"#### 本节定位\n\n本节对应考纲 3.3「识别 AWS 计算服务」。计算（Compute）是云服务最基础也最核心的类别——如果把云比作一台超级电脑，计算就是它的 CPU。从最底层你自己管的虚拟机到完全不管服务器的函数执行，AWS 提供了一整个光谱的计算选项。学完之后你应该能清楚回答：EC2 和 Lambda 有什么本质区别？什么时候用虚拟机，什么时候用无服务器？容器是什么东西，和虚拟机有什么不同？Auto Scaling 怎么做到「流量大了自动加机器、流量小了自动减机器」？负载均衡器为什么是高可用的前提？\n\n#### Amazon EC2：云上的虚拟机\n\n**Amazon EC2**（Elastic Compute Cloud，弹性计算云）是 AWS 最基础的计算服务——它给你一台运行在 AWS 数据中心里的虚拟机。虚拟机（Virtual Machine）就是一台物理服务器被软件切分出的多个「虚拟电脑」，彼此隔离，各跑各的操作系统——就像一栋大楼隔成了多个独立公寓，每家有自己的门锁和水电。你可以选操作系统（Linux 或 Windows）、CPU 和内存规格、存储大小，然后在上面安装任何你想要的软件——和你在自家电脑上装软件一样自由。\n\nEC2 的实例按功能分为六大家族（来源：aws-ec2-instance-types-billing.md）：\n\n| 家族 | 代表系列 | 一句话定位 | 典型场景 |\n|---|---|---|---|\n| 通用型 | M/T | CPU、内存、网络均衡 | Web 服务器、中小型数据库、企业应用 |\n| 计算优化型 | C | CPU 密集，计算能力最强 | 批处理、视频转码、科学计算、游戏服务器 |\n| 内存优化型 | R/X | 大内存，适合内存密集应用 | 内存数据库（Redis）、实时大数据分析 |\n| 存储优化型 | D/I | 高磁盘读写速度 | 数据仓库、日志处理、NoSQL 数据库 |\n| 加速计算型 | G/P/Inf/Trn | GPU 或 AWS 专用 AI 芯片 | 深度学习训练与推理、3D 图形渲染 |\n| 高性能计算 | Hpc | 超高网络带宽与低延迟 | 科学仿真（流体力学、天气预报） |\n\n实例命名规则很有规律：以 `m7g.xlarge` 为例——`m` = 通用型家族；`7` = 第 7 代（代越大越新）；`g` = 用 AWS Graviton 处理器（ARM 架构，性价比最高）；`xlarge` = 规格大小。无字母后缀 = Intel Xeon；`a` = AMD EPYC。（来源：aws-ec2-instance-types-billing.md）\n\n**EC2 四种主要计费模型**——这是考试必考的高频对比题（来源：aws-ec2-instance-types-billing.md）：\n\n| 模型 | 怎么付费 | 能省多少 | 要不要承诺 | 最适合什么 |\n|---|---|---|---|---|\n| On-Demand（按需） | 按秒/小时，用多少付多少 | 基准价（不省） | 无承诺，随时开关 | 短期测试、流量不可预测的新应用 |\n| Savings Plans | 承诺每小时花多少钱（如 $10/小时），换折扣 | 最高 72% | 1 年或 3 年 | 长期稳定负载（最灵活的承诺方式） |\n| Reserved Instances（RI） | 预购特定实例规格的容量 | 最高 75% | 1 年或 3 年 | 容量需求明确且不变的负载 |\n| Spot Instances | 竞价使用 AWS 空闲容量 | 最高 90% | 无承诺，但可被 2 分钟通知回收 | 可中断的批处理、CI/CD、大数据分析 |\n\n考试最常考的对比：「长期稳定、灵活度高选什么」→ Savings Plans；「预算严格、容量固定选什么」→ RI；「容错批处理省钱选什么」→ Spot；「灵活无承诺选什么」→ On-Demand。\n\n**计费细节**：EC2 按秒计费（最低收 60 秒）；Stop 实例后计算停止计费但 EBS 存储继续收费；Terminate 实例后完全停止计费。（来源：aws-ec2-instance-types-billing.md）\n\n#### Amazon EC2 Auto Scaling：自动伸缩\n\nAuto Scaling 解决的问题是「流量是波动的，机器数量应该跟着波动」。你设定三个参数：最小值（如 2 台，保证最低可用性）、最大值（如 20 台，防止失控扩张导致天价账单）、伸缩策略（如\"CPU 使用率超过 70% 持续 5 分钟就加 2 台，低于 30% 持续 10 分钟就减 1 台\"）。Auto Scaling 组会自动在这个范围内增减 EC2 实例数量。\n\n这就是 Well-Architected Framework 里「停止猜测容量」（Stop guessing capacity）设计原则的技术实现——你不用提前猜未来需要多少机器，让 Auto Scaling 根据实际负载自动调整。（来源：official-wa-framework.md，Pillar 3 设计原则第 4 条）\n\nAuto Scaling 通常和 ELB（负载均衡器）配合使用：新增的实例自动注册到 ELB 上接收流量，被回收的实例自动从 ELB 上摘除。\n\n#### AWS Lambda：无服务器计算\n\n**AWS Lambda** 是无服务器（Serverless）计算——「无服务器」不是说没有服务器，而是说你不需要管服务器——不需要选规格、不需要装系统、不需要打补丁、不需要操心扩容。你只写一段代码函数上传，告诉 Lambda「什么时候触发这段代码」（比如用户上传文件到 S3、API Gateway 收到 HTTP 请求、EventBridge 定时每小时触发一次），Lambda 自动执行。执行完就结束，你只为代码实际运行的时间付费。\n\n计费方式是按**请求次数 + GB-秒执行时间**。GB-秒的意思是：你给函数分配的内存量（GB）乘以函数运行的秒数。比如分配 512MB 内存跑了 2 秒 = 0.5 × 2 = 1 GB-秒。Lambda 支持 200 多种 AWS 服务作为触发器。（来源：aws-lambda-serverless-core-concepts.md）\n\n**Lambda 单次执行最长 15 分钟**。如果你的任务要跑几个小时或需要持续运行（如 WebSocket 长连接服务、数据库进程），Lambda 不合适，应该用 EC2 或容器。（来源：aws-lambda-serverless-core-concepts.md）\n\n#### 容器服务：ECS、EKS 与 Fargate\n\n容器（Container）是介于虚拟机和函数之间的一种打包方式。虚拟机虚拟的是整台电脑（包括操作系统），容器虚拟的只是应用及其依赖环境——更轻量、启动更快（秒级 vs 分钟级）。你可以把容器理解为一个标准化的「快递箱」：把应用和它需要的所有库、配置打成一个标准箱子，在任何支持容器的环境都能原样运行。\n\nAWS 提供三个相关服务：\n\n- **Amazon ECS**（Elastic Container Service）：AWS 自研的容器编排服务（编排 = 管理多个容器的启动、停止、调度和通信），用 AWS 自己的 API 和控制面板管理。\n- **Amazon EKS**（Elastic Kubernetes Service）：运行 Kubernetes（全球最流行的开源容器编排系统）的托管服务。如果你的团队已经在用 Kubernetes 或有 K8s 专业技能，选 EKS。\n- **AWS Fargate**：无服务器容器引擎——你不需要管底层服务器，Fargate 自动为每个容器分配计算资源。可以和 ECS 或 EKS 搭配使用。\n\n考试区分口诀：ECS = AWS 原生容器编排；EKS = Kubernetes 托管；Fargate = 容器的无服务器运行方式（你不管机器，只管容器）。Fargate 不是独立服务，它是一种「启动类型」——必须搭配 ECS 或 EKS 使用。\n\n#### Elastic Load Balancing（ELB）：负载均衡\n\n负载均衡器（Load Balancer）的作用是把用户请求均匀分发到后面多台服务器上——就像银行大厅的取号机，把客户分配到不同窗口，避免某个窗口排长队而其他窗口空着。负载均衡还有一个关键功能是**健康检查**：如果后面某台服务器挂了，负载均衡器自动停止向它发请求，把流量切到健康的服务器——这是高可用的基石。\n\nAWS 提供四种负载均衡器（来源：aws-alb-nlb-load-balancer-overview.md）：\n\n| 类型 | 工作层 | 核心特点 | 典型场景 |\n|---|---|---|---|\n| ALB（Application LB） | 第 7 层（HTTP/HTTPS） | 按 URL 路径/域名/请求头路由 | Web 应用、微服务、API |\n| NLB（Network LB） | 第 4 层（TCP/UDP） | 极高性能、百万级并发、超低延迟、支持静态 IP | 游戏、IoT、需要固定 IP 地址的场景 |\n| GWLB（Gateway LB） | 第 3 层（IP 层） | 透明代理到第三方安全设备 | 防火墙、入侵检测系统 |\n| CLB（Classic LB） | 第 4/7 层 | 旧版，已不推荐新建 | 只用于迁移遗留系统 |\n\n考试最常考 ALB vs NLB：HTTP/HTTPS 应用选 ALB（内容路由能力更强）；TCP/UDP 或需要固定 IP 选 NLB（性能更高）。（来源：aws-alb-nlb-load-balancer-overview.md）\n\n计费方式：ALB 和 NLB 都按**固定小时费 + 容量单位（LCU/NLCU）使用量**计费。即使没有请求也收小时费。（来源：aws-alb-nlb-load-balancer-overview.md）\n\n#### EC2 vs Lambda vs 容器 对比表\n\n| 维度 | EC2 | Lambda | ECS/EKS + Fargate |\n|---|---|---|---|\n| 你管什么 | 虚拟机（OS/补丁/软件） | 只管代码函数 | 容器镜像（应用+依赖） |\n| 运行时长 | 无限制 | 单次最长 15 分钟 | 无限制 |\n| 伸缩方式 | Auto Scaling（配策略） | 按请求自动伸缩（无需配置） | 任务级别伸缩 |\n| 计费 | 按实例小时/秒 | 按请求数 + GB-秒 | Fargate 按 vCPU + 内存秒 |\n| 启动速度 | 分钟级 | 毫秒到秒级 | 秒级 |\n| 适合场景 | 需要完全控制 OS 的传统应用 | 事件驱动的短时任务 | 微服务架构 |\n\n\n[[fig:f04]]\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n外卖平台「饱了么」的技术架构采用了三种计算方式的组合。核心订单系统用 EC2 实例（需要持续运行、完全控制操作系统配置），部署在 3 个 AZ 上，前面挂 ALB 做 HTTP 请求分发。用餐高峰（11:00–13:00）Auto Scaling 自动从 6 台扩到 20 台；凌晨缩回 4 台，月度计算成本比固定 20 台节省约 60%。用户上传消费收据后触发 Lambda 函数自动做 OCR 识别——每张图处理 2 秒，平均每天 10 万张，按调用次数和 GB-秒付费，比专门跑一台 EC2 便宜得多（因为大部分时间没有图片上传，EC2 会空跑计费）。骑手轨迹服务用 ECS + Fargate 跑容器——微服务架构方便独立迭代（改轨迹算法不影响订单系统），Fargate 不用管机器，团队只维护容器镜像即可。\n\n#### 常见误区与易错点\n\n- **误区一：Lambda 可以替代所有 EC2 场景**。不行。Lambda 单次最长 15 分钟，不能跑持续运行的服务（如数据库、WebSocket 长连接、后台进程）。考试看到「需要 7×24 持续运行」「需要 SSH 登录配置操作系统」→ EC2。\n- **误区二：Fargate 是独立的计算服务，和 ECS/EKS 无关**。Fargate 是一种「启动类型」（Launch Type），必须和 ECS 或 EKS 配合使用。它决定的是容器跑在谁管理的机器上——Fargate 启动类型 = AWS 管底层机器；EC2 启动类型 = 你自己管底层机器。\n- **误区三：负载均衡器只是分流工具，可有可无**。ELB 除了分流，还做健康检查和自动故障剔除。没有 ELB，Auto Scaling 加了新机器用户也找不到它（因为用户不知道新机器的地址）。ELB + Auto Scaling 是弹性架构的标配组合。\n\n#### 记忆要点\n\n- EC2 = 虚拟机，你管 OS；Lambda = 无服务器，你只管代码；Fargate = 无服务器容器\n- Lambda 计费 = 请求数 + GB-秒；单次最长 15 分钟\n- EC2 四种计费：On-Demand（灵活）/ Savings Plans（承诺金额省 72%）/ RI（预购容量省 75%）/ Spot（竞价省 90%，可回收）\n- ELB 四种：ALB（HTTP 路由）/ NLB（TCP 高性能静态 IP）/ GWLB（安全设备）/ CLB（旧不推荐）\n- Auto Scaling + ELB = 弹性高可用的标配组合 = 「停止猜测容量」的技术实现","figures":[{"id":"f04","title":"计算服务选型：EC2 vs 容器(Fargate) vs Lambda","caption":"考点：场景题三选一——要完全控制 OS 选 EC2；微服务/容器化选 ECS/EKS+Fargate；事件驱动短任务(≤15min)选 Lambda","html":"<svg viewBox=\"0 0 640 310\" style=\"width:100%;max-width:640px;display:block;margin:0 auto\">\n  <text x=\"320\" y=\"26\" font-size=\"14\" font-weight=\"700\" fill=\"#1e1b4b\" text-anchor=\"middle\">在 AWS 上跑应用，计算服务怎么选？<\/text>\n  <rect x=\"20\" y=\"44\" width=\"190\" height=\"196\" rx=\"10\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/>\n  <text x=\"115\" y=\"72\" font-size=\"13\" font-weight=\"700\" fill=\"#3730a3\" text-anchor=\"middle\">Amazon EC2<\/text>\n  <text x=\"115\" y=\"90\" font-size=\"10\" fill=\"#6d28d9\" text-anchor=\"middle\">虚拟机（最自由）<\/text>\n  <line x1=\"36\" y1=\"104\" x2=\"194\" y2=\"104\" stroke=\"#c4b5fd\" stroke-width=\"1\"/>\n  <text x=\"115\" y=\"124\" font-size=\"10\" fill=\"#1e1b4b\" text-anchor=\"middle\">你管：OS/补丁/软件<\/text>\n  <text x=\"115\" y=\"146\" font-size=\"10\" fill=\"#1e1b4b\" text-anchor=\"middle\">启动：分钟级<\/text>\n  <text x=\"115\" y=\"168\" font-size=\"10\" fill=\"#1e1b4b\" text-anchor=\"middle\">计费：按实例小时/秒<\/text>\n  <text x=\"115\" y=\"200\" font-size=\"10.5\" font-weight=\"700\" fill=\"#4338ca\" text-anchor=\"middle\">适合：传统应用、<\/text>\n  <text x=\"115\" y=\"218\" font-size=\"10.5\" font-weight=\"700\" fill=\"#4338ca\" text-anchor=\"middle\">需完全控制 OS<\/text>\n  <rect x=\"225\" y=\"44\" width=\"190\" height=\"196\" rx=\"10\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/>\n  <text x=\"320\" y=\"72\" font-size=\"13\" font-weight=\"700\" fill=\"#3730a3\" text-anchor=\"middle\">ECS/EKS + Fargate<\/text>\n  <text x=\"320\" y=\"90\" font-size=\"10\" fill=\"#6d28d9\" text-anchor=\"middle\">容器（不用管服务器）<\/text>\n  <line x1=\"241\" y1=\"104\" x2=\"399\" y2=\"104\" stroke=\"#c4b5fd\" stroke-width=\"1\"/>\n  <text x=\"320\" y=\"124\" font-size=\"10\" fill=\"#1e1b4b\" text-anchor=\"middle\">你管：容器镜像<\/text>\n  <text x=\"320\" y=\"146\" font-size=\"10\" fill=\"#1e1b4b\" text-anchor=\"middle\">启动：秒级<\/text>\n  <text x=\"320\" y=\"168\" font-size=\"10\" fill=\"#1e1b4b\" text-anchor=\"middle\">计费：vCPU+内存(秒)<\/text>\n  <text x=\"320\" y=\"200\" font-size=\"10.5\" font-weight=\"700\" fill=\"#4338ca\" text-anchor=\"middle\">适合：微服务架构、<\/text>\n  <text x=\"320\" y=\"218\" font-size=\"10.5\" font-weight=\"700\" fill=\"#4338ca\" text-anchor=\"middle\">可移植容器化应用<\/text>\n  <rect x=\"430\" y=\"44\" width=\"190\" height=\"196\" rx=\"10\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/>\n  <text x=\"525\" y=\"72\" font-size=\"13\" font-weight=\"700\" fill=\"#3730a3\" text-anchor=\"middle\">AWS Lambda<\/text>\n  <text x=\"525\" y=\"90\" font-size=\"10\" fill=\"#6d28d9\" text-anchor=\"middle\">无服务器（只管代码）<\/text>\n  <line x1=\"446\" y1=\"104\" x2=\"604\" y2=\"104\" stroke=\"#c4b5fd\" stroke-width=\"1\"/>\n  <text x=\"525\" y=\"124\" font-size=\"10\" fill=\"#1e1b4b\" text-anchor=\"middle\">你管：代码函数<\/text>\n  <text x=\"525\" y=\"146\" font-size=\"10\" fill=\"#1e1b4b\" text-anchor=\"middle\">启动：毫秒~秒级<\/text>\n  <text x=\"525\" y=\"168\" font-size=\"10\" fill=\"#1e1b4b\" text-anchor=\"middle\">计费：请求+GB-秒<\/text>\n  <text x=\"525\" y=\"200\" font-size=\"10.5\" font-weight=\"700\" fill=\"#4338ca\" text-anchor=\"middle\">适合：事件驱动、<\/text>\n  <text x=\"525\" y=\"218\" font-size=\"10.5\" font-weight=\"700\" fill=\"#4338ca\" text-anchor=\"middle\">短任务（单次≤15min）<\/text>\n  <rect x=\"20\" y=\"254\" width=\"600\" height=\"34\" rx=\"8\" fill=\"#7c3aed\"/>\n  <text x=\"320\" y=\"275\" font-size=\"11.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">口诀：要控制选 EC2｜要容器化选 Fargate｜事件驱动短任务选 Lambda<\/text>\n<\/svg>"}]},{"h":"AWS 数据库服务","body":"#### 本节定位\n\n本节对应考纲 3.4「识别 AWS 数据库服务」。数据库（Database）就是专门用来存放和管理数据的系统——你可以把它想成一个超级 Excel 表格：可以存放几亿行数据、支持几百人同时读写、断电不丢数据、能快速找到你要的那一条记录。学完之后你应该能回答：关系型数据库和 NoSQL 数据库有什么区别，各适合什么场景？Amazon RDS 和 Amazon Aurora 有什么关系和区别？DynamoDB 什么时候用？考试遇到「毫秒延迟的键值查询」该选什么？遇到「兼容 MySQL 的高可用数据库」该选什么？遇到「PB 级数据分析」该选什么？\n\n#### 两大数据库类型：关系型 vs NoSQL\n\n**关系型数据库（Relational Database）**用表格（行和列）存数据——就像 Excel 工作表，每一行是一条记录，每一列是一个字段。表和表之间可以通过某个共同字段（比如「客户编号」）关联起来——这种关联就是「关系」。操作关系型数据库用 SQL（Structured Query Language，结构化查询语言），比如 `SELECT * FROM orders WHERE customer_id = 123` 就能查到某个客户的所有订单。关系型数据库的核心优势是**事务一致性**（Transaction Consistency）——比如转账操作「从 A 扣 100 元」和「给 B 加 100 元」要么同时成功、要么同时失败，绝不会出现「A 扣了钱但 B 没收到」的情况。适合结构固定、需要复杂查询和事务保证的场景（订单系统、财务系统、ERP）。\n\n**NoSQL 数据库**（Not Only SQL）不强制使用固定表结构。它有多种形式：键值对（Key-Value，像字典：用一个 key 直接查到对应的 value）、文档（Document，存 JSON 格式数据，字段灵活可变）、图（Graph，存实体之间的关系网络）等。NoSQL 的核心优势是**读写速度极快、可水平扩展到巨大规模**——当你有几十亿条数据、每秒几百万次查询时，NoSQL 通常比关系型数据库更合适。适合结构灵活、数据量巨大、需要极高读写速度的场景（用户画像、IoT 传感器数据、游戏排行榜、购物车）。\n\n#### Amazon RDS：托管关系型数据库\n\n**Amazon RDS**（Relational Database Service，关系型数据库服务）是 AWS 的托管关系型数据库服务。「托管」（Managed）意思是 AWS 帮你处理数据库的日常运维工作——打安全补丁、自动备份、监控性能、故障切换——你只管数据本身和查询语句，不用操心底层服务器怎么维护。RDS 目前支持 7 种主流数据库引擎：MySQL、PostgreSQL、MariaDB、Oracle、Microsoft SQL Server、Db2、Amazon Aurora。每个 AWS 账号在每个 Region 最多可创建 40 个 RDS 实例。（来源：official-rds-aurora.md）\n\n**Multi-AZ 部署**是 RDS 实现高可用的核心机制。开启 Multi-AZ 后，RDS 会自动在另一个可用区创建一个**同步副本**（Standby Replica）——主数据库的每一笔写入都会同步复制到备用副本，确保两边数据完全一致。一旦主库故障（硬件坏了、AZ 断电等），RDS 自动将流量切换到备用副本，切换时间通常 60–120 秒（Multi-AZ DB instance 部署）或 35 秒以内（Multi-AZ DB cluster 部署）。（来源：official-rds-aurora.md）\n\n\nRDS 自动备份机制：RDS 在设定的备份窗口内自动创建数据库快照（首次全量，后续增量），备份保存在 Amazon S3 上。默认保留 7 天（可设置 0–35 天），支持恢复到保留期内的任意时间点（Point-in-Time Recovery，PITR）——精确到秒。手动快照（DB Snapshot）可以永久保存直到你主动删除，且不受自动备份保留期限制。每个 Region 最多 100 个手动快照。（来源：official-rds-aurora.md）\n\n**关键考点**：标准 RDS Multi-AZ 的 Standby **不提供读流量**——它只是一个热备，平时不接受任何读写请求，只在主库故障时自动顶上。如果你需要「读扩展」（把大量读查询分摊到多台机器上），需要创建 **Read Replica（只读副本）**。Read Replica 通过**异步复制**从主库同步数据，可以接受读查询，但因为是异步的所以数据可能有几秒的延迟。一个 RDS 实例通常可以创建最多 5 个 Read Replica。（来源：official-rds-aurora.md）\n\n#### Amazon Aurora：兼容 MySQL/PostgreSQL 的增强版\n\n**Amazon Aurora** 是 AWS 自研的关系型数据库，兼容 MySQL 和 PostgreSQL——意思是你现有的 MySQL 或 PostgreSQL 应用几乎不用改代码就能迁到 Aurora 上。但 Aurora 和普通 RDS 最大的区别在底层存储架构：Aurora 使用**共享分布式存储**（Shared Distributed Storage）——数据自动在 3 个 AZ 的 6 个存储节点上保存 6 份副本。这意味着即使你不手动开启 Multi-AZ，底层存储已经跨 AZ 冗余了。存储容量自动扩展，最高 128 TiB，不需要你提前规划。（来源：official-rds-aurora.md）\n\nAurora 最多支持 **15 个只读副本**（Aurora Replica），比普通 RDS 的 5 个多得多。而且 Aurora Replica 和主库共享同一份存储数据，副本延迟通常**小于 100 毫秒**——比普通 RDS Read Replica（异步复制，延迟可能几秒）快得多。主库故障时 Aurora 自动将一个 Replica 提升为新主库，整个切换过程比普通 RDS 快很多。（来源：official-rds-aurora.md）\n\nAurora 还提供两个值得了解的变体：**Aurora Serverless**（按需自动分配计算资源，适合流量波动大或不确定的数据库）和 **Aurora Global Database**（跨区域多活，支持全球读写）。\n\n#### Amazon DynamoDB：全托管 NoSQL\n\n**Amazon DynamoDB** 是 AWS 的全托管 NoSQL 数据库，核心数据模型是 Key-Value（键值对）和 Document（JSON 文档）。它的设计目标是**毫秒级延迟 + 无限水平扩展**：支持每天处理数万亿次请求，全球表（Global Tables）设计可用性 99.999%。（来源：aws-dynamodb-core-concepts-pricing.md）\n\nDynamoDB 有两种容量模式，考试必考（来源：aws-dynamodb-core-concepts-pricing.md）：\n\n| 模式 | 计费方式 | 核心特点 | 适合场景 |\n|---|---|---|---|\n| On-Demand（按需） | 按实际读写请求次数付费（RRU/WRU） | 无需预估容量，自动即时扩缩（最高扩到之前峰值的 2 倍） | 流量不可预测、新应用、开发测试 |\n| Provisioned（预置） | 按预设的 RCU/WCU 每小时付费 | 需提前规划容量，配合 Auto Scaling 自动调整；可用 Reserved Capacity（预购 1–3 年）再降 25–60% | 流量稳定可预测的生产负载 |\n\n两种模式每个表每 24 小时最多切换 2 次。1 RCU = 每秒 1 次强一致性读取（≤4KB）或 2 次最终一致性读取；1 WCU = 每秒 1 次写入（≤1KB）。（来源：aws-dynamodb-core-concepts-pricing.md）\n\nDynamoDB 不是关系型数据库——它不支持 SQL 的 JOIN（联表查询）、GROUP BY 等复杂关系查询。它的强项是按主键极速查询海量数据。\n\n#### 其他数据库服务一句话定位\n\n| 服务 | 类型 | 一句话定位 |\n|---|---|---|\n| Amazon Redshift | 数据仓库 | 超大数据集的分析查询（列式存储，PB 级，用 SQL 查但不是 OLTP 事务数据库） |\n| Amazon ElastiCache | 内存缓存 | Redis 或 Memcached 的托管版，微秒级读取——用来加速数据库查询（把热数据放内存） |\n| Amazon Neptune | 图数据库 | 存储和查询实体间关系网络——社交网络关系、推荐引擎、知识图谱 |\n| Amazon DocumentDB | 文档数据库 | 兼容 MongoDB API，适合存 JSON 文档 |\n| Amazon MemoryDB | 持久内存数据库 | 兼容 Redis，毫秒写入 + 数据持久化（普通 Redis 重启会丢数据，MemoryDB 不会） |\n\n#### 关系型选型：RDS vs Aurora 核心对比\n\n| 维度 | Amazon RDS | Amazon Aurora |\n|---|---|---|\n| 支持引擎 | MySQL / PostgreSQL / Oracle / SQL Server / MariaDB / Db2 | MySQL-Compatible / PostgreSQL-Compatible |\n| 存储架构 | 传统 EBS 卷（单 AZ 存储） | 共享分布式存储（6 副本跨 3 AZ） |\n| 只读副本数 | 通常 5 个 | 最多 15 个 |\n| 副本延迟 | 取决于异步复制（可能秒级） | 通常 < 100 毫秒（共享存储）|\n| 故障切换 | Multi-AZ 60–120 秒（DB instance）/ < 35 秒（DB cluster）| 通常 < 30 秒 |\n| 存储自动扩展 | 需配置 | 自动扩展至 128 TiB |\n| Serverless | 无 | Aurora Serverless |\n| Global Database | 无 | Aurora Global Database（跨区域多活）|\n| 适合场景 | 需要 Oracle/SQL Server 等非 MySQL 引擎 | 高并发、高可用的 MySQL/PostgreSQL 应用 |\n\n#### SQL vs NoSQL 选型对比\n\n| 维度 | 关系型（RDS / Aurora） | NoSQL（DynamoDB） |\n|---|---|---|\n| 数据模型 | 表格（行列），固定 schema | 键值 / 文档，灵活 schema |\n| 查询语言 | SQL（支持 JOIN、GROUP BY） | 按主键查询（不支持 SQL JOIN） |\n| 事务保证 | 强事务（ACID） | 有限事务（单表事务） |\n| 扩展方式 | 垂直扩展（升级实例规格）为主 | 水平扩展（分区自动扩散）为主 |\n| 延迟 | 毫秒级（取决于查询复杂度） | 个位数毫秒（按键查询固定快） |\n| 典型场景 | 订单/财务/ERP（需要关系查询和事务） | 用户画像/IoT/游戏/购物车（海量键值读写） |\n\n\n#### 数据库迁移服务\n\n考试偶尔出现的服务：**AWS Database Migration Service（AWS DMS）** 帮你把现有数据库迁移到 AWS。它支持同构迁移（如本地 MySQL → Amazon RDS MySQL）和异构迁移（如 Oracle → Aurora PostgreSQL，需配合 AWS Schema Conversion Tool 先转换表结构）。DMS 在迁移期间保持源数据库正常运行——所以迁移过程中业务不中断。考试考点：看到「数据库迁移」「把本地数据库搬到 AWS」→ AWS DMS。\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n社交 App「圈圈」需要两种数据库处理完全不同的数据特征。用户注册和订单支付用 Aurora MySQL——因为这些操作需要事务一致性（扣款和发货要么同时成功要么同时失败），Aurora 的 3 AZ 6 副本存储保证了即使一个 AZ 故障数据也不丢。Aurora 部署了 3 个只读副本分担查询压力，主库故障自动切换 < 30 秒。用户动态消息流（每天几亿条浏览、点赞、评论记录）用 DynamoDB On-Demand 模式——这些数据的特征是「量极大、按用户 ID 查询、不需要跨表 JOIN」，DynamoDB 毫秒响应正好合适；平时流量低成本低，突然有热门话题流量飙升也不用提前扩容。CTO 还用 Amazon Redshift 做每周业务分析报表——从 Aurora 和 DynamoDB 定期导入数据，用 SQL 做跨库聚合分析（如「上周各城市新用户转化率」），这类复杂分析查询是 Redshift 数据仓库的强项。用户登录时的 Session 信息缓存在 ElastiCache（Redis）里，微秒级读取，避免每次登录都查数据库。\n\n#### 常见误区与易错点\n\n- **误区一：Aurora 是一个全新的数据库引擎，和 MySQL 不兼容**。不是。Aurora 兼容 MySQL 和 PostgreSQL，你的现有 MySQL 应用可以几乎不改代码迁到 Aurora。它是「增强版 RDS」——底层存储架构换了，但上层接口和语法不变。\n- **误区二：DynamoDB 可以做复杂的 SQL JOIN 查询**。不行。DynamoDB 是 NoSQL，它的优势在于按主键极速查询海量数据，但不支持 SQL 的 JOIN、GROUP BY 等复杂关系查询。需要关系查询 → 用 RDS 或 Aurora；需要 PB 级分析查询 → 用 Redshift。\n- **误区三：Multi-AZ 的 Standby 可以用来读数据**。标准 RDS Multi-AZ DB instance 部署中，Standby **不提供读流量**——它只在主库故障时自动顶上。要读扩展必须创建 Read Replica。但 Multi-AZ DB cluster 部署（RDS）和 Aurora Replica 可以提供读流量——这是考试常设的陷阱题。（来源：official-rds-aurora.md）\n\n#### 记忆要点\n\n- 关系型（SQL） → RDS（7 引擎）或 Aurora（MySQL/PostgreSQL 增强版）\n- NoSQL → DynamoDB（键值/文档，毫秒延迟，99.999% SLA）\n- Aurora vs RDS：共享分布式存储 / 15 副本 / 自动扩展 / 更快故障切换\n- DynamoDB On-Demand = 按请求付费不用猜容量；Provisioned = 按 RCU/WCU 小时付费\n- Multi-AZ Standby = 同步复制但不读；Read Replica = 异步复制可读\n- Redshift = 数据仓库（PB 级分析）；ElastiCache = 内存缓存（微秒级加速）\n- 选型口诀：需要 JOIN/事务 → RDS/Aurora；海量键值 → DynamoDB；分析报表 → Redshift"},{"h":"AWS 网络服务","body":"> 本域对应官方考纲任务声明 3.5：识别 AWS 网络服务。\n\n#### 本节定位\n\n本节对应考纲任务声明 3.5，考试占比高，常考选择题形式：给定场景判断该用哪个网络组件。学完之后你应该能回答：VPC 里有哪些核心组件、公有子网和私有子网的区别是什么、安全组和网络 ACL 有哪些关键差异、Route 53 和 CloudFront 分别解决什么问题、Direct Connect 和 VPN 各自适合什么场景。\n\n#### VPC 与子网基础\n\n**Amazon VPC（Virtual Private Cloud，虚拟私有云）** 是你在 AWS 云里的一个\"私人网络隔间\"——逻辑上与其他用户完全隔离。你可以指定 IP 地址范围、划分子网、配置路由表和安全规则，就像在自己的数据中心里布线一样，但不用真的买交换机和拉网线。（来源：aws-vpc-network-core-concepts.md）\n\n**子网（Subnet）** 是 VPC 内部的一段 IP 地址范围。子网有两种：\n\n- **公有子网**：路由表中有一条指向 Internet Gateway 的路由，子网内的实例可以直接访问互联网，也能被互联网访问（前提是分配了公有 IP）。典型用途：放 Web 服务器、负载均衡器。\n- **私有子网**：没有直接通往互联网的路由。实例无法被互联网直接访问。如果私有子网内的实例需要下载软件包或调用外部 API，必须通过 NAT Gateway 中转。典型用途：放数据库、后端应用。\n\n**路由表（Route Table）** 决定网络流量去哪里。每条规则包含目的地址范围和出口目标。每个子网必须关联一个路由表，要么显式指定，要么使用 VPC 的主路由表。（来源：aws-vpc-network-core-concepts.md）\n\n#### 核心网络组件\n\n**Internet Gateway（互联网网关）**：连接 VPC 和互联网的大门。一个 VPC 只需要一个，公有子网的路由表把 0.0.0.0/0 指向它即可让实例上网。\n\n**NAT Gateway（NAT 网关）**：让私有子网的实例能\"出站\"访问互联网（比如下载补丁），但外部无法主动连入。工作原理是把多个私有 IP 映射到一个公有 IP 再转发。注意：NAT Gateway 收取约 $0.045/GB 的数据处理费，独立于出站数据传输费。（来源：aws-vpc-network-core-concepts.md）\n\n**Amazon Route 53（DNS 服务）**：AWS 的域名系统服务。作用就像电话号码簿——把人类读得懂的域名（如 www.example.com）翻译成机器需要的 IP 地址。Route 53 支持多种路由策略：简单路由、加权路由（按比例分流）、延迟路由（就近响应）、故障转移路由（主备切换）、地理位置路由。考试常考\"哪种路由策略适合 XX 场景\"。\n\n**Amazon CloudFront（CDN）**：AWS 的内容分发网络。它在全球数百个边缘站点缓存你的内容（网页、视频、API 响应等），用户访问时从离自己最近的站点获取，减少延迟。从 AWS 源站到 CloudFront 的数据传输免费。（来源：aws-data-transfer-pricing-dto.md）\n\n**AWS Direct Connect（专线）**：在你的数据中心和 AWS 之间建立一条物理专线，不经过公共互联网。适合对延迟和带宽有严格要求的场景（如大规模数据迁移、实时金融交易）。\n\n**AWS VPN（虚拟专用网络）**：通过加密隧道在互联网上建立与 AWS 的安全连接。部署比 Direct Connect 快（几分钟 vs 几周），适合对延迟要求不极端、或作为 Direct Connect 的备份。\n\n\n**VPC 对等连接（VPC Peering）**：两个 VPC 之间的私有路由连接，流量走 AWS 内部骨干网络而不经公共互联网。同可用区内的对等连接免费，跨可用区收费 $0.01/GB。VPC 对等连接不支持传递路由——如果 VPC-A 与 VPC-B 对等，VPC-B 与 VPC-C 对等，VPC-A 并不能直接访问 VPC-C，必须单独建立对等连接或使用 Transit Gateway。（来源：aws-vpc-network-core-concepts.md）\n\n**AWS Transit Gateway（中转网关）**：充当区域级虚拟路由器，一个 Transit Gateway 可以互联多个 VPC 和本地网络，解决多 VPC 需要两两对等连接导致的管理复杂度。适合有几十甚至上百个 VPC 的大型企业。\n\n**AWS Global Accelerator**：通过 AWS 全球骨干网络优化用户到应用的网络路径。它给你两个全球任播 IP 地址，用户的请求先到达最近的 AWS 边缘站点，然后走 AWS 内部骨干网到达你的应用所在区域，避免在公共互联网上绕远路。与 CloudFront 的区别：CloudFront 用于缓存内容减少延迟，Global Accelerator 用于非缓存场景（如 TCP/UDP 实时流量）的网络路径优化。\n\n**Elastic Load Balancing（ELB，弹性负载均衡）**：把进入的流量分配到多个目标（EC2 实例、容器、Lambda 函数等），防止单点过载。AWS 提供三种负载均衡器：Application Load Balancer（ALB，七层，按 HTTP 内容路由，适合 Web 应用）、Network Load Balancer（NLB，四层，超低延迟，适合游戏/IoT）、Gateway Load Balancer（GWLB，部署第三方安全设备如防火墙）。（来源：aws-alb-nlb-load-balancer-overview.md）\n\n**AWS PrivateLink**：让你通过私有连接访问 AWS 服务或第三方 SaaS 服务，流量不经过公共互联网。与 VPC 端点配合使用，是零信任架构中的重要组件。\n\n#### 安全组与网络 ACL 对比\n\n这是考试最高频的对比题之一。两者都是网络流量控制工具，但机制完全不同：\n\n| 维度 | 安全组（Security Group） | 网络 ACL（NACL） |\n|---|---|---|\n| 作用层级 | 实例级别（绑定到 ENI） | 子网级别（绑定到子网） |\n| 状态 | **有状态**：允许入站后，响应流量自动放行 | **无状态**：入站和出站规则独立判断 |\n| 规则类型 | **只有允许规则**，没有拒绝规则 | 有允许规则**和拒绝规则** |\n| 默认行为 | 默认拒绝所有入站，允许所有出站 | 默认 NACL 允许所有流量 |\n| 评估顺序 | 所有规则同时评估 | 按规则编号从小到大依次匹配 |\n| 典型用途 | 主要流量控制手段（推荐） | 子网级别的额外防线 |\n\n（来源：aws-vpc-network-core-concepts.md）\n\n考试诀窍：看到\"有状态\"选安全组；看到\"拒绝规则\"或\"子网级别\"选 NACL。\n\n\n**网络 ACL（NACL）深入理解**：NACL 绑定在子网级别，每条规则带编号，从小到大依次匹配，第一条命中就停止。规则包含允许和拒绝两种，必须同时配置入站和出站规则（因为无状态）。默认 NACL 允许所有流量进出，但自建 NACL 默认拒绝所有。实际使用中，安全组是主要流量控制手段，NACL 作为子网级别的额外防线——考试如果问\"需要在子网层面拒绝特定 IP\"，答案是 NACL。\n\n**AWS 私有全球骨干网络**：AWS 各区域之间通过高性能低延迟的私有全球骨干网络互联。在 AWS 内部发起的数据包（无论使用公有 IP 还是私有 IP）不经过公共互联网，全程走 AWS 自有光纤。骨干网 p99 每小时丢包率目标低于 0.0001%。这意味着跨区域复制、多区域灾备的网络质量远优于走公网的方案。（来源：aws-vpc-network-core-concepts.md）\n\n#### Direct Connect vs VPN 对比\n\n| 维度 | AWS Direct Connect | AWS VPN |\n|---|---|---|\n| 连接方式 | 物理专线（需到合作站点） | 通过公共互联网的加密隧道 |\n| 部署时间 | 数周（涉及物理布线） | 几分钟 |\n| 带宽 | 1 Gbps / 10 Gbps / 100 Gbps | 受互联网带宽限制 |\n| 延迟 | 低且稳定 | 取决于互联网状况 |\n| 成本 | 端口费 + 数据传输费 | 连接费 + 数据传输费 |\n| 适用场景 | 大规模迁移、实时交易、混合云 | 快速启用、备份线路、临时连接 |\n\n\n**考试选型口诀——网络服务速查**：需要域名解析 → Route 53；需要缓存加速 → CloudFront；需要物理专线低延迟 → Direct Connect；需要快速加密连接 → VPN；需要互联多个 VPC → Transit Gateway；需要两个 VPC 直连 → VPC Peering；需要实例级防火墙 → 安全组；需要子网级拒绝规则 → NACL；需要负载均衡 → ELB（Web 用 ALB，TCP/UDP 用 NLB）；需要非缓存场景的全球网络优化 → Global Accelerator。\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n**VPC 端点（VPC Endpoint）**：让 VPC 内的资源直接访问 S3 或 DynamoDB 等 AWS 服务，不经过互联网和 NAT Gateway。网关端点（Gateway Endpoint）专门给 S3 和 DynamoDB 使用，免费；接口端点（Interface Endpoint）基于 PrivateLink，支持更多 AWS 服务，按小时和数据量收费。考试中\"不经过互联网访问 S3\"→ VPC Gateway Endpoint。\n\n在线教育平台\"学海无涯\"在 VPC 中部署了三层架构：公有子网放 Application Load Balancer（接收用户请求）；私有子网放 EC2 应用服务器和 RDS 数据库。Route 53 用延迟路由策略让亚太用户访问新加坡区域、欧洲用户访问法兰克福区域。视频课件通过 CloudFront 分发，首次加载延迟从 3 秒降到 300 毫秒。公司总部与 AWS VPC 之间用 Direct Connect 传输学员数据（每天 500 GB），另用 VPN 作为 Direct Connect 的备份线路。\n\n#### 常见误区与易错点\n\n**ALB vs NLB 快速对比**：ALB 工作在第七层（HTTP/HTTPS），支持基于路径、主机名、HTTP 头等内容路由请求到不同目标组，适合 Web 应用和微服务；NLB 工作在第四层（TCP/UDP），处理百万级并发连接和极低延迟流量，适合游戏、IoT 和实时通信。考试中\"基于 URL 路径路由\"→ ALB；\"超低延迟\"或\"静态 IP\"→ NLB。（来源：aws-alb-nlb-load-balancer-overview.md）\n\n- **误区一：安全组可以设拒绝规则**。错——安全组只有允许规则，默认拒绝所有未明确允许的流量。只有 NACL 才同时支持允许和拒绝规则。\n- **误区二：NAT Gateway 免费**。错——NAT Gateway 除了出站数据传输费（DTO）外，还单独收取约 $0.045/GB 的数据处理费，两项费用叠加。（来源：aws-vpc-network-core-concepts.md）\n- **误区三：CloudFront 只能加速静态内容**。错——CloudFront 可以加速动态内容（API 响应等），通过边缘站点与源站之间的优化连接减少延迟。\n\n\n**Elastic IP 地址**：一个可以绑定到任意 EC2 实例的固定公有 IP 地址。默认公有 IP 在实例停止再启动后会变化，Elastic IP 不会，适合需要固定入口地址的场景。绑定到运行中的实例免费，未绑定时按小时收费。\n\nCloudFront 边缘缓存有一个关键计费细节：从源站（Origin）到 CloudFront 边缘节点的数据传输免费，但从边缘节点到用户的传输按区域阶梯计费（来源：aws-vpc-network-core-concepts.md）。VPC 终端节点分两种：Gateway Endpoint（免费，仅支持 S3 和 DynamoDB）和 Interface Endpoint（收费，基于 AWS PrivateLink，支持几乎所有 AWS 服务）。考试中\"让私有子网的 EC2 访问 S3 但不经过互联网\"的正确答案通常是 S3 Gateway Endpoint 而非 NAT Gateway——前者免费且流量不出 VPC，后者收数据处理费。\n\n#### 记忆要点\n\n- 安全组 = 有状态 + 只有允许规则 + 实例级别；NACL = 无状态 + 有拒绝规则 + 子网级别\n- 公有子网 = 路由表有 Internet Gateway；私有子网 = 没有\n- Route 53 = DNS + 多种路由策略；CloudFront = CDN + 源站到 CF 免费\n- Direct Connect = 物理专线 + 低延迟 + 部署慢；VPN = 加密隧道 + 部署快 + 做备份\n- VPC 端点 = 不走互联网访问 S3/DynamoDB；PrivateLink = 私有连接到其他 AWS 服务\n- ALB = 第七层按内容路由（Web 应用）；NLB = 第四层超低延迟（游戏/IoT）\n- Transit Gateway = 多 VPC 互联的中心路由器；VPC Peering = 两两直连（不传递）"},{"h":"AWS 存储服务","body":"> 本域对应官方考纲任务声明 3.6：识别 AWS 存储服务。\n\n#### 本节定位\n\n本节对应考纲任务声明 3.6，是考试高频区。你需要掌握：S3 有哪些存储类别、各自适合什么场景；EBS 和 EFS 有什么区别；S3、EBS、EFS 三者的选型逻辑是什么。存储服务的核心考点不是背参数表，而是**给定场景选对存储类型**。\n\n#### Amazon S3 基础\n\n**Amazon S3（Simple Storage Service，简单存储服务）** 是 AWS 的对象存储服务。你可以把它想象成一个无限大的网盘——往里放文件（AWS 称之为\"对象\"），每个文件有唯一的 Key（文件名路径），文件存在\"桶\"（Bucket）里。S3 的设计耐久性达到 11 个 9（99.999999999%），意味着如果你存 1000 万个文件，统计上一万年才可能丢一个。（来源：aws-s3-storage-classes-ebs-pricing.md）\n\nS3 不是硬盘，不能像 Windows 资源管理器那样\"挂载\"到操作系统上当本地磁盘用。它通过 HTTP API 存取文件，适合图片、视频、日志、备份、静态网站托管等场景。\n\n#### S3 存储类别详解\n\nS3 共有 8 种存储类别，按访问频率从高到低排列，存储单价递减，但检索费递增：\n\n| 存储类别 | 一句话定位 | 访问频率 | 最短存储期 | 关键特点 |\n|---|---|---|---|---|\n| **S3 Standard** | 默认选这个 | 频繁（>1次/月） | 无 | 毫秒延迟，≥3 AZ |\n| **S3 Intelligent-Tiering** | 不确定访问频率选这个 | 不确定 | 无 | 自动在层级间移动，无检索费 |\n| **S3 Standard-IA** | 偶尔访问但要秒取 | 低频（约1次/月） | 30天 | 有检索费，≥3 AZ |\n| **S3 One Zone-IA** | 能重建的低频数据 | 低频 | 30天 | 单 AZ，比 Standard-IA 便宜 |\n| **S3 Glacier Instant Retrieval** | 每季度访问一次，秒取 | 极低频 | 90天 | 有检索费，毫秒取回 |\n| **S3 Glacier Flexible Retrieval** | 每年访问，分钟到小时取 | 归档 | 90天 | 不能实时访问，需先 Restore |\n| **S3 Glacier Deep Archive** | 几乎不访问，合规留存 | 极少 | 180天 | 成本最低，取回最慢（小时级） |\n| **S3 Express One Zone** | 延迟极敏感 | 极频繁 | 无 | 比 Standard 快 10x，单 AZ |\n\n（来源：aws-s3-storage-classes-ebs-pricing.md）\n\n选型口诀：常用选 Standard，不确定选 Intelligent-Tiering，偶尔用选 IA，归档选 Glacier，合规留存选 Deep Archive。\n\n\n**S3 计费组成**：S3 不只收存储费，一共有六个计费维度——存储定价（按 GB/月）、请求和数据检索费（PUT/GET 按请求数，IA 和 Glacier 类有检索费）、出站数据传输费（DTO，每月前 100 GB 免费）、数据管理功能费、复制定价、转换和查询功能费（如 S3 Select）。（来源：aws-s3-storage-classes-ebs-pricing.md）\n\n**S3 生命周期策略**：你可以设置规则让对象自动在存储类之间流转。比如：对象创建后 30 天从 Standard 转到 Standard-IA，90 天后转到 Glacier Flexible Retrieval，365 天后转到 Deep Archive，7 年后自动删除。这是节省长期存储成本最常用的机制。\n\n**S3 版本控制（Versioning）**：启用后，每次覆盖或删除对象时 S3 都保留旧版本。误删后可以恢复到任意历史版本。注意：每个版本都会占用存储空间并产生费用。\n\n**S3 加密**：S3 默认对所有新上传的对象启用服务端加密（SSE-S3，由 AWS 管理密钥）。也可以选择 SSE-KMS（用 AWS KMS 管理的密钥，可审计密钥使用记录）或 SSE-C（客户自行提供密钥）。\n\n**Amazon S3 Glacier 系列**：Glacier 是 S3 的归档存储品牌，现在作为 S3 存储类别的一部分统一管理（不再是独立服务）。三个 Glacier 层级的核心区别就是取回速度和成本——Instant Retrieval 毫秒取回（贵一点），Flexible Retrieval 分钟到小时（便宜），Deep Archive 小时级（最便宜，适合合规留存 7-10 年的数据）。\n\n\n[[fig:f05]]\n\n#### Amazon EBS 与 Amazon EFS\n\n**Amazon EBS（Elastic Block Store，弹性块存储）** 是块存储，相当于给虚拟机挂一块硬盘。EBS 卷只能挂载到**同一可用区**的一台 EC2 实例（io2 支持多挂载但属高级用法）。EBS 按预置的 GB/月收费，不按实际使用量。（来源：aws-s3-storage-classes-ebs-pricing.md）\n\nEBS 主流卷类型：gp3（通用推荐，含 3,000 IOPS 基线免费，比 gp2 便宜 20%）；io2 Block Express（关键数据库，256,000 IOPS）；st1（大数据流式读写）；sc1（冷数据归档，成本最低）。（来源：aws-s3-storage-classes-ebs-pricing.md）\n\n**Amazon EFS（Elastic File System，弹性文件系统）** 是网络文件存储，相当于一个共享网盘。多台 EC2 实例可以同时读写同一个 EFS 文件系统，跨可用区访问。EFS 按实际使用的 GB/月收费（不需要预置容量），自动扩缩。适合需要共享文件的场景，如 Web 内容管理、机器学习训练数据共享。\n\n\n**EBS 卷类型选型逻辑**：考试最常考 gp3 和 io2 的区别。gp3 是通用推荐型——基线包含 3,000 IOPS 和 125 MiB/s 吞吐量（免费），存储单价比 gp2 便宜 20%，且 IOPS 和吞吐量可以独立于容量单独调整（gp2 的 IOPS 与容量绑定，想要更多 IOPS 必须扩容）。io2 Block Express 适合最严苛的数据库场景——256,000 IOPS、99.999% 耐久性、亚毫秒延迟，但价格高得多。HDD 类（st1/sc1）只适合大数据流式读写和冷存储，不能用作启动卷。（来源：aws-s3-storage-classes-ebs-pricing.md）\n\n**EBS 快照（Snapshot）**：EBS 支持对卷拍快照，快照存储在 S3 上（用户不可见的内部 S3）。第一次快照为全量，后续为增量。快照可以跨区域复制，是跨区域灾备的基础。恢复快照可以创建新卷——新卷可以与原卷不同 AZ，用于灾难恢复。EBS Free Tier 包含 30 GB 存储 + 200 万次 I/O + 1 GB 快照存储。（来源：aws-s3-storage-classes-ebs-pricing.md）\n\n**Amazon FSx**：AWS 还提供 Amazon FSx 系列——托管的高性能文件系统，支持多种协议。FSx for Windows File Server 支持 SMB 协议（适合 Windows 环境共享文件），FSx for Lustre 支持高性能计算（HPC）和机器学习训练数据。CLF-C02 考试中 FSx 偶尔出现，知道它是\"托管高性能文件系统\"即可。\n\n**AWS Storage Gateway**：一个混合云存储服务，在本地数据中心部署一个虚拟机网关，让本地应用通过标准存储协议（NFS/SMB/iSCSI）无缝访问 AWS 云存储（S3/Glacier）。典型场景：把本地备份自动同步到 S3、为本地应用提供低延迟缓存同时数据持久化在云端。\n\n#### S3 vs EBS vs EFS 对比\n\n| 维度 | Amazon S3 | Amazon EBS | Amazon EFS |\n|---|---|---|---|\n| 存储类型 | 对象存储（HTTP API 访问） | 块存储（挂载为硬盘） | 文件存储（NFS 协议挂载） |\n| 挂载方式 | 不挂载，通过 API/SDK 访问 | 挂载到单台 EC2（同 AZ） | 多台 EC2 同时挂载（跨 AZ） |\n| 容量 | 无限 | 预置（1 GiB–64 TiB） | 自动扩缩（PB 级） |\n| 计费 | 按实际存储量 + 请求数 | 按预置容量（不论是否用满） | 按实际使用量 |\n| 典型场景 | 图片/视频/备份/静态网站 | 操作系统盘/数据库 | 共享文件/CMS/ML 数据 |\n| 耐久性 | 11 个 9 | 99.8–99.999% | 11 个 9（跨多 AZ） |\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n**EBS 卷类型选型逻辑**：gp3 是通用推荐——包含 3,000 IOPS 和 125 MiB/s 吞吐量基线免费，存储单价比 gp2 便宜 20%，且 IOPS 和吞吐量可以独立于容量单独调整。io2 Block Express 适合最严苛的数据库——256,000 IOPS、99.999% 耐久性。HDD 类（st1/sc1）只适合大数据流式和冷存储，不能用作启动卷。（来源：aws-s3-storage-classes-ebs-pricing.md）\n\n**EBS 快照（Snapshot）**：对卷拍快照存储在 S3 上，首次全量后续增量。快照可跨区域复制用于灾备。EBS Free Tier 含 30 GB 存储 + 200 万次 I/O + 1 GB 快照。（来源：aws-s3-storage-classes-ebs-pricing.md）\n\n**实例存储 vs EBS**：EC2 可用两种块存储——EBS（网络附加，持久化，实例停止后数据保留）和实例存储（Instance Store，物理挂载在宿主机，实例停止或终止后数据丢失）。实例存储适合临时缓存，不适合持久化数据。\n\n**S3 Object Lock**：对 S3 对象设置保留期和法律保留，期间不可覆盖或删除，满足金融合规要求。与版本控制配合确保审计数据完整性。\n\n**S3 Transfer Acceleration**：利用 CloudFront 边缘站点加速长距离 S3 上传。数据先到最近的边缘站点，再走 AWS 内部骨干网到 S3 桶所在区域。\n\n**AWS Backup**：集中管理多个 AWS 服务的备份（EBS 快照、RDS 快照、DynamoDB 备份、EFS 备份），统一备份计划、保留策略和跨区域复制。考试中\"集中管理多服务备份\"→ AWS Backup。\n\n**AWS Storage Gateway**：混合云存储服务，本地部署虚拟机网关，让本地应用通过 NFS/SMB/iSCSI 协议无缝访问 S3/Glacier。适合本地备份自动上云、为本地应用提供低延迟缓存。\n\n电商公司\"乐购汇\"的存储架构：商品图片和视频放 S3 Standard（频繁展示）；用户上传但 30 天未被浏览的图片通过 S3 生命周期策略自动转到 Standard-IA（省 40% 存储费）；合规要求的交易日志保留 7 年，放 S3 Glacier Deep Archive。EC2 应用服务器挂 gp3 EBS 卷跑数据库。10 台内容编辑服务器共享一个 EFS 文件系统处理商品详情页模板，任何一台修改的文件其他 9 台立刻可见。\n\n#### 常见误区与易错点\n\n**Amazon FSx 家族**：AWS 提供多种托管高性能文件系统——FSx for Windows File Server（SMB 协议，适合 Windows 环境共享文件）、FSx for Lustre（高性能计算和 ML 训练数据）、FSx for NetApp ONTAP（混合云 NAS）、FSx for OpenZFS（高性能 Linux 文件存储）。CLF-C02 知道\"托管高性能文件系统\"= FSx 即可。\n\n**存储选型终极速查**：放文件对象（图片/视频/日志/备份）→ S3；给虚拟机挂硬盘（操作系统盘/数据库）→ EBS；多台机器共享文件 → EFS；归档合规数据 → S3 Glacier 系列；本地到云的混合存储网关 → Storage Gateway；高性能文件系统（HPC/Windows 共享）→ FSx；大量数据物理搬运 → Snow Family。\n\n- **误区一：S3 可以当操作系统磁盘用**。错——S3 是对象存储，不支持挂载为文件系统。操作系统盘必须用 EBS。\n- **误区二：EBS 按实际使用量计费**。错——EBS 按预置容量收费。你开了 100 GB 的 gp3，即使只用了 10 GB，也按 100 GB 付费。S3 才是按实际使用量收费。（来源：aws-s3-storage-classes-ebs-pricing.md）\n- **误区三：Glacier 可以实时读取**。部分错——Glacier Instant Retrieval 可以毫秒取回，但 Glacier Flexible Retrieval 和 Deep Archive 必须先发起 Restore 请求，等待分钟到小时才能读取。\n\n\n**S3 Access Points**：为不同团队创建独立的访问入口，每个有自己的权限策略，简化多租户共享桶的权限管理。考试中\"简化大规模共享桶的权限管理\"选 Access Points。S3 还支持跨区域复制（灾备和降低延迟）和同区域复制（日志聚合和合规副本）。\n\nEFS 的吞吐模式分弹性（Elastic，按实际用量付费，推荐大多数场景）和预置（Provisioned，固定吞吐量），选型时注意区分。\n\n#### 记忆要点\n\n- S3 = 对象存储 + 无限容量 + 11 个 9 耐久性 + 8 种存储类\n- EBS = 块存储 + 挂一台 EC2 + 按预置容量收费 + gp3 推荐\n- EFS = 文件存储 + 多台共享 + 按实际用量收费 + 自动扩缩\n- 选型口诀：挂硬盘用 EBS，共享文件用 EFS，放对象用 S3\n- S3 计费六维度：存储 + 请求 + 检索 + DTO + 管理功能 + 复制\n- Glacier 三层：Instant Retrieval（毫秒取）> Flexible Retrieval（分钟-小时）> Deep Archive（小时级，最便宜）\n- EBS gp3 包含 3,000 IOPS 基线免费，比 gp2 便宜 20%；io2 = 极致 IOPS（256,000）\n- Instance Store = 临时存储（实例停止数据丢失）；EBS = 持久化存储","figures":[{"id":"f05","title":"S3 存储类别速览（6 大梯队，完整 8 类见正文表）","caption":"考点：场景题选存储类——常用 Standard、不确定 Intelligent-Tiering、偶尔用 IA、归档 Glacier、合规留存 Deep Archive；成本越往下越低、取回越慢","html":"<svg viewBox=\"0 0 640 360\" style=\"width:100%;max-width:640px;display:block;margin:0 auto\">\n  <text x=\"30\" y=\"28\" font-size=\"13\" font-weight=\"700\" fill=\"#1e1b4b\">S3 存储类别速览：访问越少越便宜，取回越慢<\/text>\n  <rect x=\"30\" y=\"44\" width=\"580\" height=\"42\" rx=\"6\" fill=\"#a78bfa\"/>\n  <text x=\"50\" y=\"70\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">S3 Standard（热数据·频繁访问）<\/text>\n  <text x=\"592\" y=\"70\" font-size=\"10.5\" fill=\"#f5f3ff\" text-anchor=\"end\">毫秒取回 · 单价最高<\/text>\n  <rect x=\"30\" y=\"92\" width=\"580\" height=\"42\" rx=\"6\" fill=\"#8b5cf6\"/>\n  <text x=\"50\" y=\"118\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">S3 Intelligent-Tiering（访问频率不确定）<\/text>\n  <text x=\"592\" y=\"118\" font-size=\"10.5\" fill=\"#f5f3ff\" text-anchor=\"end\">自动分层 · 无检索费<\/text>\n  <rect x=\"30\" y=\"140\" width=\"580\" height=\"42\" rx=\"6\" fill=\"#7c3aed\"/>\n  <text x=\"50\" y=\"166\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">S3 Standard-IA（低频 · 约 1 次/月）<\/text>\n  <text x=\"592\" y=\"166\" font-size=\"10.5\" fill=\"#f5f3ff\" text-anchor=\"end\">30 天最短存期 · 有检索费<\/text>\n  <rect x=\"30\" y=\"188\" width=\"580\" height=\"42\" rx=\"6\" fill=\"#6d28d9\"/>\n  <text x=\"50\" y=\"214\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">S3 One Zone-IA（可重建的低频数据）<\/text>\n  <text x=\"592\" y=\"214\" font-size=\"10.5\" fill=\"#f5f3ff\" text-anchor=\"end\">单 AZ · 比 IA 更便宜<\/text>\n  <rect x=\"30\" y=\"236\" width=\"580\" height=\"42\" rx=\"6\" fill=\"#5b21b6\"/>\n  <text x=\"50\" y=\"262\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">S3 Glacier（Instant / Flexible Retrieval）<\/text>\n  <text x=\"592\" y=\"262\" font-size=\"10.5\" fill=\"#f5f3ff\" text-anchor=\"end\">归档 · 分钟~小时取回<\/text>\n  <rect x=\"30\" y=\"284\" width=\"580\" height=\"42\" rx=\"6\" fill=\"#4c1d95\"/>\n  <text x=\"50\" y=\"310\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">S3 Glacier Deep Archive（合规留存）<\/text>\n  <text x=\"592\" y=\"310\" font-size=\"10.5\" fill=\"#f5f3ff\" text-anchor=\"end\">最便宜 · 小时级取回<\/text>\n  <text x=\"30\" y=\"346\" font-size=\"10.5\" fill=\"#4338ca\">注：另有 Express One Zone（极速单 AZ）与 Lifecycle 策略自动流转；考试选型=按访问频率与取回速度选层<\/text>\n<\/svg>"}]},{"h":"AWS AI/ML 与分析服务","body":"> 本域对应官方考纲任务声明 3.7：识别 AWS AI/ML 与分析服务。\n\n#### 本节定位\n\n本节对应考纲任务声明 3.7。CLF-C02 不要求你会写机器学习代码，但要求你知道 AWS 提供了哪些 AI/ML 服务、各自解决什么问题、分析服务怎么选。学完后你应该能回答：SageMaker AI 和 Bedrock 分别是什么；AWS 有哪些\"拿来即用\"的 AI 服务（识别图片、提取文本、理解语言等）；Athena、QuickSight 等分析工具各自的定位。\n\n#### 机器学习平台：SageMaker AI 与 Bedrock\n\n**Amazon SageMaker AI** 是 AWS 的全托管机器学习平台。如果你要**自己训练模型**（比如用公司的销售数据训练一个需求预测模型），从数据准备、模型训练到部署上线，SageMaker AI 提供一条龙服务，不用自己搭服务器。2024 年 12 月更名为 SageMaker AI（旧 API 不变）。（来源：aws-sagemaker-overview.md）\n\n**Amazon Bedrock** 是一个**托管基础模型平台**——你不需要自己训练模型，而是直接调用已经训练好的大语言模型（如 Anthropic Claude、Meta Llama 等），通过 API 发送提示词就能获得回答。适合快速构建生成式 AI 应用（聊天机器人、文本摘要、代码生成等）。Bedrock 按调用量（输入/输出 Token 数）计费。（来源：aws-bedrock-pricing-models.md）\n\n区分诀窍：SageMaker AI = 自己训练模型的工场；Bedrock = 直接用别人训好的大模型的商店。\n\n#### \"拿来即用\"的 AI 服务\n\nAWS 提供一系列预训练 AI 服务，无需机器学习经验，调 API 就能用：\n\n| 服务 | 一句话定位 | 典型用途 |\n|---|---|---|\n| **Amazon Rekognition** | 图像和视频分析 | 人脸识别、物体检测、内容审核 |\n| **Amazon Textract** | 从文档中提取文字和结构 | 发票、合同、身份证的自动识别 |\n| **Amazon Comprehend** | 自然语言处理（NLP） | 情感分析、关键词提取、语言检测 |\n| **Amazon Polly** | 文字转语音 | 新闻播报、无障碍阅读 |\n| **Amazon Transcribe** | 语音转文字 | 会议记录、字幕生成 |\n| **Amazon Translate** | 机器翻译 | 多语言网站、文档翻译 |\n| **Amazon Lex** | 对话机器人引擎 | 客服聊天机器人、语音助手 |\n\n#### 数据分析服务\n\n| 服务 | 一句话定位 | 关键特点 |\n|---|---|---|\n| **Amazon Athena** | 用 SQL 直接查 S3 里的数据 | 无服务器，按扫描量计费，无需搭数据库 |\n| **Amazon QuickSight** | BI 可视化仪表盘 | 按用户/按会话计费，支持 ML 驱动的异常检测 |\n| **Amazon EMR** | 托管大数据框架 | 运行 Spark/Hadoop 等框架处理 PB 级数据 |\n| **AWS Glue** | 无服务器 ETL | 数据抽取、转换、加载（ETL）+ 数据目录 |\n| **Amazon Kinesis** | 实时数据流处理 | 日志流、点击流、IoT 传感器数据的实时分析 |\n| **Amazon Redshift** | 云数据仓库 | PB 级结构化数据的 SQL 分析，列式存储 |\n\n\n**SageMaker AI vs Bedrock 选型**：如果你的场景是\"我有自己的数据和算法，要从头训练一个模型\"，选 SageMaker AI。如果你的场景是\"我想用已有的大语言模型来做文本生成、对话、摘要\"，选 Bedrock。很多企业两个都用——Bedrock 做生成式 AI 应用，SageMaker AI 做传统预测模型（需求预测、异常检测等）。SageMaker AI 实例用量支持 Savings Plans 优化成本，最高省 64%。（来源：aws-sagemaker-overview.md）\n\n**Amazon Bedrock 计费**：按推理调用量收费——On-Demand 模式按输入/输出 Token 数计费（不用不花钱）；Provisioned Throughput 模式按预购的模型单元按小时计费（保障容量）。2025 年新增四种服务层级（Reserved/Priority/Standard/Flex），可以在可用性和成本之间做取舍。需要注意：Bedrock 上的第三方模型（如 Anthropic Claude）在账单中以第三方法律实体名称显示（如\"Anthropic, PBC\"），不在 AWS Cost Anomaly Detection 监控范围内，必须用 AWS Budgets 设置告警。（来源：aws-bedrock-pricing-models.md）\n\n**Athena 深度理解**：Athena 的核心价值是\"不用搭数据库就能用 SQL 查询 S3 上的数据\"。它是无服务器的（Serverless），你不需要管理任何服务器或集群。计费方式是按每次查询扫描的数据量收费——数据压缩和列式存储格式（如 Parquet）可以大幅降低扫描量和费用。典型场景：日志分析（直接查 S3 上的应用日志）、临时查询（一次性数据探索）、与 QuickSight 搭配做 BI。\n\n**Redshift vs Athena 选型**：Redshift 是专门的数据仓库，适合长期、频繁、复杂的 SQL 分析（PB 级数据、定时报表、多表关联）；Athena 适合临时查询和不愿维护基础设施的场景。简化判断：数据已在 S3 且只需偶尔查 → Athena；需要持续高性能分析 → Redshift。\n\n**Amazon Kinesis 家族**：Kinesis 不是单一服务，而是一组实时数据处理服务。Kinesis Data Streams 处理实时数据流（如点击流、日志流）；Kinesis Data Firehose 是最简单的方式把流数据加载到 S3/Redshift 等目的地（完全托管，无需写代码）；Kinesis Data Analytics 在流数据上运行 SQL 或 Apache Flink 查询。\n\n\n**Amazon Personalize**：个性化推荐服务，无需机器学习经验即可构建实时推荐系统。输入用户行为数据（浏览、购买、评分等），Personalize 自动训练模型并输出个性化推荐。\n\n**Amazon Forecast**：时间序列预测服务。输入历史数据，自动选择最优算法并生成未来预测。适合需求预测、库存规划、资源容量规划。\n\n**Amazon Kendra**：企业级智能搜索服务，理解自然语言提问并从企业文档中找到精确答案。\n\n**SageMaker AI vs Bedrock 选型**：如果你要\"自己训练模型\"→ SageMaker AI；如果要\"用现成大模型做文本生成/对话\"→ Bedrock。SageMaker AI Savings Plans 最高省 64%。（来源：aws-sagemaker-overview.md）\n\n**Amazon Bedrock 计费要点**：On-Demand 按 Token 数计费；Provisioned Throughput 按小时计费。2025 年新增四种服务层级（Reserved/Priority/Standard/Flex）。第三方模型（如 Anthropic Claude）在账单中以法律实体名称显示，不在 Cost Anomaly Detection 监控范围内。（来源：aws-bedrock-pricing-models.md）\n\n\n**Amazon QuickSight 深度理解**：QuickSight 是 AWS 的商业智能（BI）可视化工具，用来创建交互式仪表盘。最大特点是按会话计费（Session-based pricing）——读者每次打开仪表盘只收 $0.30/session（封顶 $5/月/读者），如果某个月没人看就不花钱。数据源可以是 Athena、Redshift、S3、RDS 等。内置 ML 驱动的异常检测和预测功能（ML Insights），能自动在数据中发现异常趋势。考试中\"最低成本的 BI 仪表盘\"或\"嵌入式分析\"→ QuickSight。\n\n**Amazon EMR（Elastic MapReduce）**：托管的大数据处理框架，支持运行 Apache Spark、Hadoop、Hive、Presto 等开源框架。适合 PB 级数据的批处理、交互式查询、机器学习。与 Athena 的区别：EMR 需要你管理集群（选实例类型、配置节点数量），但灵活性更高；Athena 完全无服务器但只支持 SQL 查询。\n\n**AWS Glue 深度理解**：Glue 是无服务器 ETL 服务，核心组件包括 Glue Crawler（自动发现数据结构并建立数据目录 Data Catalog）、Glue Job（执行 ETL 转换，支持 Python/Spark）和 Data Catalog（统一元数据存储，Athena 和 Redshift Spectrum 都可以引用）。考试中\"自动发现 S3 中数据的结构\"→ Glue Crawler。\n\n**分析服务选型口诀**：数据在 S3 偶尔查 → Athena；长期高性能 SQL → Redshift；实时流 → Kinesis；ETL → Glue；BI 仪表盘 → QuickSight；Spark/Hadoop → EMR。\n\n**考试重点：AI/ML 服务分三层**。底层 SageMaker AI（全流程自建）；中间层 Bedrock（调用现成模型）；上层预训练 API（Rekognition/Textract/Comprehend 等，调 API 即用）。给定场景判断用哪一层是核心考法。\n\n**Athena 计费与优化**：按每次查询扫描的数据量收费（$5/TB 扫描量）。数据压缩（如 GZIP）和列式存储格式（如 Parquet、ORC）可以减少扫描量 30-90%，直接降低费用。\n\n**Amazon Kinesis 家族**：Data Streams（自己管分片容量的实时流）、Data Firehose（完全托管的数据投递到 S3/Redshift，无需写代码）、Data Analytics（在流上跑 SQL/Flink 查询）。考试最常见考法：哪种 Kinesis 服务最适合\"实时分析\"vs\"数据投递\"。\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n**Amazon EMR（Elastic MapReduce）**：托管大数据处理框架，运行 Spark/Hadoop/Hive/Presto。适合 PB 级数据批处理和交互式查询。与 Athena 的区别：EMR 需管理集群但灵活性更高，Athena 完全无服务器但只支持 SQL。\n\n**AWS Glue**：无服务器 ETL 服务。Glue Crawler 自动发现数据结构建立 Data Catalog；Glue Job 执行 ETL 转换（Python/Spark）。Data Catalog 是统一元数据存储，Athena 和 Redshift Spectrum 都可引用。考试中\"自动发现 S3 数据结构\"→ Glue Crawler。\n\n**QuickSight 计费亮点**：按会话计费（$0.30/session，封顶 $5/月/读者），没人看不花钱。内置 ML 驱动的异常检测功能（ML Insights）。\n\n物流公司\"速达通\"构建了一套智能物流系统：用 Amazon Textract 自动从纸质运单中提取收件人信息和快递单号（每天处理 5 万张运单图片）；用 Amazon Comprehend 分析客户投诉邮件的情感倾向，自动标记\"紧急\"和\"普通\"；仓库监控摄像头的画面通过 Amazon Rekognition 检测异常行为。业务数据分析方面，运营团队用 Athena 直接查询 S3 上的物流日志（不用建数据库），用 QuickSight 制作每日配送效率仪表盘。\n\n#### 常见误区与易错点\n\n**Rekognition vs Textract vs Comprehend 快速区分**：这三个是考试最常混淆的 AI 服务。Rekognition 处理**图像和视频**（人脸检测、物体识别、内容审核）；Textract 从**文档图片**中提取文字和结构（发票、合同的字段提取，不仅是纯 OCR 还能识别表格和表单结构）；Comprehend 处理**纯文本**（情感分析、关键词提取、语言检测、实体识别）。口诀：看图找物选 Rekognition，看图提字选 Textract，看文本分析选 Comprehend。\n\n**Amazon Translate vs Amazon Transcribe vs Amazon Polly**：Translate 是文本翻译（中文→英文）；Transcribe 是语音转文字（录音→文字稿）；Polly 是文字转语音（文字→朗读音频）。三者常组合使用：Transcribe 把会议录音转文字 → Translate 翻译成其他语言 → Polly 把翻译结果读出来。\n\n- **误区一：Bedrock 和 SageMaker AI 是同一个东西**。错——SageMaker AI 是训练+部署自定义模型的平台；Bedrock 是调用现成大模型的平台。两者互补，不冲突。\n- **误区二：Athena 需要先把数据从 S3 导入数据库**。错——Athena 的核心优势就是直接在 S3 上用 SQL 查询，无需导入，无需搭建任何服务器。\n- **误区三：所有 AI 服务都需要机器学习经验**。错——Rekognition、Textract、Comprehend 等都是预训练好的 API，开发者调 API 就能用，不需要了解模型训练。\n\n**Amazon Lex** 是对话式 AI 引擎，用于构建聊天机器人和语音助手。\n#### 记忆要点\n\n\n**Amazon Lex**：对话式 AI 引擎，构建聊天机器人和语音助手。它是 Alexa 背后的同一技术。支持自然语言理解（NLU）和自动语音识别（ASR），可以与 Lambda 集成实现业务逻辑。考试中\"构建聊天机器人\"→ Lex。\n\n- SageMaker AI = 自己训练模型；Bedrock = 调用现成大模型\n- Rekognition = 图像视频；Textract = 文档提取；Comprehend = 语言理解\n- Athena = SQL 查 S3（无服务器，按扫描量计费）；QuickSight = BI 仪表盘（按会话计费）；Kinesis = 实时流\n- EMR = 托管 Spark/Hadoop（需管集群）；Glue = 无服务器 ETL + Data Catalog\n- Bedrock 第三方模型（如 Claude）不在 Cost Anomaly Detection 监控范围，需用 Budgets 告警\n- Personalize = 推荐系统；Forecast = 时间序列预测；Kendra = 智能搜索"},{"h":"其他范围内的服务类别","body":"> 本域对应官方考纲任务声明 3.8：识别其他范围内的 AWS 服务类别。\n\n#### 本节定位\n\n本节覆盖考纲 3.8，考试中以\"定位题\"为主——给定一个需求场景，判断该用哪个管理/监控/集成/迁移工具。这些工具单个不深但种类多，需要逐个知道\"做什么用的\"。\n\n#### 管理与监控工具\n\n**Amazon CloudWatch**：AWS 的统一监控服务，收集 AWS 资源的指标（CPU、内存、网络等）和日志，设置告警。告警可以触发 SNS 通知、Auto Scaling 策略或 EC2 操作（重启/终止）。指标按粒度保留 3 小时到 15 个月不等。（来源：aws-cloudwatch-monitoring.md）\n\n**AWS CloudFormation**：基础设施即代码（IaC）工具。用 JSON 或 YAML 模板描述你想要的 AWS 资源（EC2、S3、RDS 等），CloudFormation 自动创建和管理这些资源。模板可重复使用、版本控制，确保每次部署一致。考试里\"基础设施即代码\"= CloudFormation。\n\n**AWS Systems Manager**：统一管理大量 EC2 实例和本地服务器的工具集。功能包括：批量打补丁（Patch Manager）、远程执行命令（Run Command）、参数存储（Parameter Store，安全存放配置项和密钥）、会话管理器（Session Manager，不用 SSH 就能登录实例）。\n\n**AWS Trusted Advisor**：自动检查你的 AWS 环境，给出五个类别的最佳实践建议——成本优化、性能、安全、容错、服务限制。Basic 支持计划可看 7 项核心检查；Business Support+ 或更高计划可看 500+ 项检查。（来源：aws-support-plans.md）\n\n**AWS Health Dashboard**：显示 AWS 服务和你的资源的健康状态。分两部分：Service Health Dashboard（全局 AWS 服务状态）和 Personal Health Dashboard（影响你账号资源的事件通知）。\n\n#### 应用集成服务\n\n**Amazon SNS（Simple Notification Service）**：消息推送服务，一条消息可以同时发给多个订阅者（邮件、短信、HTTP 端点、Lambda 函数等）。模式是\"发布-订阅\"（pub-sub）。\n\n**Amazon SQS（Simple Queue Service）**：消息队列服务，发送方把消息放进队列，接收方按自己的速度从队列取出处理。实现应用组件之间的松耦合——发送方不用等接收方处理完。\n\n**AWS Step Functions**：工作流编排服务，用可视化状态机串联多个 AWS 服务调用（Lambda、ECS、SNS 等），实现复杂业务流程的自动化。比如：新用户注册 → 验证邮箱 → 创建账号 → 发欢迎邮件。\n\n**Amazon EventBridge**：事件总线服务，把来自 AWS 服务、SaaS 应用或自定义应用的事件路由到目标处理程序。比如：EC2 实例状态变化 → 触发 Lambda → 发 Slack 通知。\n\n#### SNS vs SQS 对比\n\n| 维度 | Amazon SNS | Amazon SQS |\n|---|---|---|\n| 模式 | 发布-订阅（一对多） | 点对点队列（一对一处理） |\n| 消息持久性 | 不保留（推送后即失） | 保留在队列中直到被消费 |\n| 消费者 | 多个订阅者同时收到 | 一条消息只被一个消费者处理 |\n| 典型用途 | 通知广播（邮件/短信/HTTP） | 解耦异步处理（订单→支付→发货） |\n\n#### 迁移工具\n\n**AWS Database Migration Service（DMS）**：数据库迁移服务，支持同构迁移（MySQL→MySQL）和异构迁移（Oracle→Aurora）。迁移期间源数据库保持运行，最小化停机。\n\n**AWS Application Migration Service（MGN）**：应用迁移服务，把本地服务器\"原样搬\"（Rehost）到 AWS EC2 上，不用改代码。\n\n**AWS Snow Family**：物理数据传输设备家族，适合网络传输不现实的超大数据量搬迁：\n- **Snowcone**：小型设备（8–14 TB），便携，适合边缘采集\n- **Snowball Edge**：中型设备（80 TB 存储），带本地计算能力\n- **Snowmobile**：集装箱卡车（100 PB），适合数据中心级别迁移\n\n#### 开发者工具\n\n**AWS CodePipeline**：持续集成/持续交付（CI/CD）管道，把代码变更自动从代码库推到测试再到生产环境。\n\n**AWS CodeBuild**：完全托管的构建服务，编译代码、运行测试、生成部署包，不用自己搭构建服务器。\n\n**AWS CodeDeploy**：自动化部署服务，把代码部署到 EC2、Lambda 或本地服务器，支持滚动更新和蓝绿部署。\n\n**AWS X-Ray**：分布式追踪服务，帮你分析微服务架构中请求的路径和延迟瓶颈。\n\n\n\n**AWS Organizations 与 SCP**：Organizations 是多账号管理框架，让企业把多个 AWS 账号组织在一个树形结构中统一治理。服务控制策略（SCP）是 Organizations 的核心管控工具——它设置成员账号 IAM 权限的**最大上限**，即使账号管理员有完整 IAM 权限，SCP 拒绝的操作也无法执行。常见用途：限制成员账号只能在指定区域创建资源、禁止关闭 CloudTrail。（来源：aws-organizations-multi-account.md）\n\n**AWS Config 规则与合规性评估**：Config 不只是追踪配置变化，还可以设置合规规则。比如规则\"所有 S3 桶必须启用版本控制\"，Config 会持续评估账号内所有 S3 桶，不合规的桶自动标记为 noncompliant 并发送通知，甚至可以触发自动修复（通过 Systems Manager Automation）。Conformance Packs 把多条规则打包为一个单元部署，适合一次性落实行业合规基线（如 PCI DSS 合规包）。（来源：aws-cloudtrail-config-audit.md）\n\n**AWS Well-Architected Tool**：基于 Well-Architected Framework 六大支柱的自助评估工具，通过回答一系列问题来识别架构中的风险和改进机会。免费使用，结果以改进计划形式呈现。考试中\"评估架构是否遵循最佳实践\"→ Well-Architected Tool。\n\n**Amazon CloudWatch Logs 与 CloudWatch Logs Insights**：CloudWatch 不只收集指标，还可以集中存储和分析日志。应用程序日志、Lambda 执行日志、VPC 流日志都可以发送到 CloudWatch Logs。Logs Insights 提供交互式查询语言，几秒钟内搜索和分析数百万条日志记录。（来源：aws-cloudwatch-monitoring.md）\n\n**AWS CloudTrail + AWS Config**：这两个审计工具经常一起出现在考试中。CloudTrail 回答\"谁在什么时间做了什么操作\"（API 操作审计日志），Config 回答\"资源的配置现在和历史上是什么\"（配置状态快照）。两者配合使用才能形成完整的审计能力。CloudTrail 事件历史免费保留 90 天；Config 按评估的规则数收费。（来源：aws-cloudtrail-config-audit.md）\n\n**AWS CloudTrail vs CloudWatch 对比**：CloudTrail 记录\"谁做了什么操作\"（审计），CloudWatch 记录\"资源运行状况如何\"（监控）。看到审计/合规/操作追踪 → CloudTrail；看到 CPU/内存/告警/指标 → CloudWatch。\n\n| 维度 | AWS CloudTrail | Amazon CloudWatch |\n|---|---|---|\n| 核心问题 | 谁在什么时候做了什么？ | 资源运行状况如何？ |\n| 数据类型 | API 调用事件日志 | 指标（时序数据）+ 日志 |\n| 免费额度 | 事件历史 90 天免费 | 基础指标免费 |\n| 典型用途 | 安全审计、合规溯源 | 性能监控、告警通知 |\n\n**AWS Marketplace**：一个在线商店，可以发现、购买和部署第三方软件——从安全扫描器到机器学习模型到 SaaS 订阅。在 Marketplace 上购买的软件费用会出现在你的 AWS 账单中，统一支付。\n\n**Amazon EventBridge 与 SNS 的区别**：SNS 是通用的消息推送服务（发布-订阅），适合简单的通知场景。EventBridge 是事件总线，支持基于事件内容的精细路由规则、事件转换、归档与重放，适合事件驱动架构。简单广播选 SNS，复杂事件路由选 EventBridge。\n\n**AWS Elastic Beanstalk**：一个快速部署 Web 应用的服务——你只需要上传代码，Beanstalk 自动处理容量预置、负载均衡、Auto Scaling 和健康监控。支持 Java、.NET、PHP、Node.js、Python、Ruby、Go 等语言。你不需要理解底层基础设施，但仍然可以访问和控制底层资源（EC2、ELB 等）。考试中\"最快方式部署 Web 应用\"经常指向 Elastic Beanstalk。\n\n\n**AWS Elastic Beanstalk**：快速部署 Web 应用——上传代码，Beanstalk 自动处理容量预置、负载均衡、Auto Scaling 和健康监控。支持 Java/.NET/PHP/Node.js/Python/Ruby/Go。你不需要理解底层基础设施，但仍可以访问和控制底层资源。考试中\"最快方式部署 Web 应用\"→ Beanstalk。\n\n\n**AWS Personal Health Dashboard vs Service Health Dashboard**：Service Health Dashboard 显示所有 AWS 区域所有服务的通用状态（全局视图）。Personal Health Dashboard 只显示**影响你账号资源的事件**（比如你的 EC2 实例所在的物理主机计划维护），并给出具体的修复建议。考试中\"影响我的账号的特定 AWS 事件通知\"→ Personal Health Dashboard。\n\n**AWS License Manager**：集中管理软件许可证（Oracle、SQL Server、SAP 等），追踪许可证使用情况，设置规则防止许可证超额使用。在迁移到云的过程中确保 BYOL（自带许可证）合规。\n\n**考试选型口诀——管理与集成服务速查**：监控指标和告警 → CloudWatch；基础设施即代码 → CloudFormation；最佳实践检查 → Trusted Advisor；批量管理实例 → Systems Manager；审计操作日志 → CloudTrail；配置合规评估 → Config；消息广播 → SNS；异步解耦 → SQS；工作流编排 → Step Functions；事件路由 → EventBridge；数据库迁移 → DMS；应用原样搬迁 → MGN；大量数据物理搬运 → Snow Family；CI/CD → CodePipeline + CodeBuild + CodeDeploy。\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n**AWS License Manager**：集中管理软件许可证（Oracle/SQL Server/SAP 等），追踪使用情况，防止超额。BYOL 迁移场景必备工具。\n\n**Personal Health Dashboard vs Service Health Dashboard**：Service Health 显示全局 AWS 服务状态；Personal Health 只显示影响你账号资源的事件并给修复建议。考试中\"影响我的 AWS 事件通知\"→ Personal Health Dashboard。\n\n创业公司\"智慧办公\"搭建了一套自动化运维体系：用 CloudFormation 模板定义整套基础设施（VPC+EC2+RDS+S3），新环境一键部署只需 15 分钟。CloudWatch 监控所有 EC2 实例的 CPU 和内存，CPU 超过 80% 持续 5 分钟触发告警，告警通过 SNS 发送到运维团队的 Slack 频道。用户注册流程用 Step Functions 编排：Lambda 验证邮箱 → SQS 队列异步创建账号 → SNS 发送欢迎邮件。每月用 Trusted Advisor 做一次安全和成本巡检。\n\n#### 常见误区与易错点\n\n**AWS Config vs CloudFormation**：Config 检查\"现有资源的配置是否合规\"（事后审计），CloudFormation 定义\"资源应该长什么样\"（事先创建）。两者互补：CloudFormation 保证创建时一致，Config 保证运行期间不漂移。\n\n- **误区一：CloudWatch 只能监控 EC2**。错——CloudWatch 可以监控几乎所有 AWS 服务（RDS、Lambda、S3 等），还支持自定义指标。\n- **误区二：SNS 和 SQS 功能相同**。错——SNS 是广播（一条消息多人收到），SQS 是队列（一条消息只被一个消费者处理）。两者经常组合使用：SNS 接收事件后扇出到多个 SQS 队列。\n- **误区三：Snow Family 是云服务**。准确说 Snow Family 是**物理设备**。AWS 把硬件寄给你，你把数据拷进去再寄回 AWS，适合网络传输太慢或不可用的场景。\n\n#### 记忆要点\n\n- CloudWatch = 监控+告警；CloudFormation = 基础设施即代码；Trusted Advisor = 最佳实践检查\n- SNS = 发布订阅（一对多）；SQS = 消息队列（点对点解耦）\n- DMS = 数据库迁移；MGN = 应用迁移（Rehost）；Snow Family = 物理搬运设备\n- CodePipeline/CodeBuild/CodeDeploy = CI/CD 三件套\n**X-Ray** 分析微服务架构中请求延迟瓶颈，是分布式追踪的核心工具。\n- Elastic Beanstalk = 最快部署 Web 应用（上传代码自动搞定一切）\n- Config 检查配置是否合规（事后审计）；CloudFormation 定义资源应该长什么样（事先创建）"}],"practice":[{"id":"Q21","d":3,"t":"single","q":"哪个 AWS 服务或功能允许用户在公司的本地数据中心和 AWS 云之间建立专用网络连接？","o":[{"l":"A","t":"AWS 直接连接"},{"l":"B","t":"VPC 对等"},{"l":"C","t":"AWS VPN"},{"l":"D","t":"Amazon Route 53"}],"a":["A"],"e":"AWS 直接连接允许用户在本地数据中心和 AWS 云之间建立专用网络连接。它提供了一个私有的、专用的连接，增强了网络性能和可靠性。","s":""},{"id":"Q43","d":3,"t":"single","q":"一家公司在 Amazon S3 中存储了 5 TB 的数据。公司计划偶尔对数据运行查询进行分析。公司应该使用哪个 AWS 服务以最具成本效益的方式运行这些查询？","o":[{"l":"A","t":"Amazon Redshift"},{"l":"B","t":"Amazon Athena"},{"l":"C","t":"Amazon Kinesis"},{"l":"D","t":"Amazon RDS"}],"a":["B"],"e":"Amazon Athena 是一项无服务器查询服务，允许用户直接在 Amazon S3 中使用标准 SQL 分析数据。它适用于偶尔或临时查询，因为用户只需为他们运行的查询付费，无需管理底层基础设施。","s":""},{"id":"Q61","d":3,"t":"single","q":"以下哪项是完全托管的 MySQL 兼容数据库？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"Amazon DynamoDB"},{"l":"C","t":"Amazon Redshift"},{"l":"D","t":"Amazon Aurora"}],"a":["D"],"e":"Amazon Aurora 是一个完全托管的关系数据库引擎，与 MySQL 和 PostgreSQL 兼容。它结合了商业数据库的性能和可用性以及开源数据库的简单性和成本效益。","s":""},{"id":"Q66","d":3,"t":"single","q":"哪个 AWS 服务是一个键值数据库，提供大规模的亚毫秒级延迟？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon Aurora"},{"l":"C","t":"Amazon DocumentDB（与 MongoDB 兼容）"},{"l":"D","t":"Amazon Neptune"}],"a":["A"],"e":"Amazon DynamoDB 是一个键值和文档数据库，提供任何规模的个位数毫秒延迟。它是一个完全托管的 NoSQL 数据库服务，设计用于快速和可预测的性能，非常适合需要一致、低延迟访问的应用程序。","s":""},{"id":"Q87","d":3,"t":"single","q":"哪个 AWS 服务提供高度耐用的对象存储？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"Amazon EFS"},{"l":"C","t":"Amazon EBS"},{"l":"D","t":"Amazon FSx"}],"a":["A"],"e":"(简单存储服务) 提供高度耐用的对象存储，具有 99.999999999% (11 个 9 的) 耐用性。它适用于存储和检索任何数量的数据。","s":""},{"id":"Q199","d":3,"t":"single","q":"一家公司在私有子网中有 Amazon EC2 实例。公司想要启动连接到互联网以获取操作系统更新，同时阻止来自互联网的流量访问 EC2 实例。哪种 AWS 托管服务允许这样做？","o":[{"l":"A","t":"VPC 端点"},{"l":"B","t":"NAT 网关"},{"l":"C","t":"Amazon PrivateLink"},{"l":"D","t":"VPC 对等连接"}],"a":["B"],"e":"NAT 网关（选项 B）使私有子网中的实例能够访问互联网以进行更新操作系统等操作，同时阻止互联网启动连接到这些实例。","s":""},{"id":"Q302","d":3,"t":"single","q":"之前用于开发的 Amazon EC2 实例无法访问，并且在 AWS 管理控制台中不再出现。应该使用哪个AWS 服务来确定是什么操作使此 EC2 实例无法访问？","o":[{"l":"A","t":"Amazon CloudWatch 日志"},{"l":"B","t":"AWS Security Hub"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"AWS CloudTrail"}],"a":["D"],"e":"AWS CloudTrail 是一个记录和记录 AWS 资源 API 调用的服务。它可以用来跟踪对 EC2 实例采取的操作，包括可能导致无法访问的操作。","s":""},{"id":"Q361","d":3,"t":"multiple","q":"以下哪些 AWS 服务是无服务器的？（选择两个）","o":[{"l":"A","t":"AWS Outposts"},{"l":"B","t":"Amazon EC2"},{"l":"C","t":"Amazon Elastic Kubernetes Service（Amazon EKS）"},{"l":"D","t":"AWS Fargate"},{"l":"E","t":"AWS Lambda"}],"a":["D","E"],"e":"AWS Fargate（D）和 AWS Lambda（E）是无服务器服务。AWS Fargate 允许您在不管理服务器的情况下运行容器，而AWS Lambda 让您在不配置或管理服务器的情况下运行代码，根据传入流量自动扩展应用程序。","s":""},{"id":"Q492","d":3,"t":"single","q":"哪个 AWS 计算服务使用户能够安全、可靠地大规模运行容器？","o":[{"l":"A","t":"Amazon Elastic Container Service (Amazon ECS)"},{"l":"B","t":"Amazon Aurora"},{"l":"C","t":"Amazon Athena"},{"l":"D","t":"Amazon Polly"}],"a":["A"],"e":"Amazon Elastic Container Service (ECS)是一个完全托管的容器编排服务，使用户能够运行和扩展容器化应用程序。它为大规模运行容器提供了一个安全和可靠的环境，是管理容器化工作负载的理想选择。","s":""},{"id":"Q621","d":3,"t":"single","q":"使用弹性负载均衡（ELB）负载均衡器与在 AWS 云中运行的应用程序一起使用的好处是什么？","o":[{"l":"A","t":"ELB 将自动扩展资源以满足容量需求。"},{"l":"B","t":"ELB 可以在多个计算资源之间平衡流量。"},{"l":"C","t":"ELB 可以在多个互联网网关之间平衡流量。"},{"l":"D","t":"ELB 可以跨越多个 AWS 区域。"}],"a":["B"],"e":"使用弹性负载均衡（ELB）负载均衡器的主要好处是在多个计算资源之间分配流量，确保应用程序的高效利用和提高可用性。","s":""}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 3.1.1 | Console / CLI / SDK 三种交互方式 | ⭐⭐ 中 | 匹配题 |\n| 3.1.2 | 基础设施即代码（IaC）概念与好处 | ⭐⭐ 中 | 概念题 |\n| 3.2.1 | Region / AZ / Edge 层级关系 | ⭐⭐⭐ 高 | 概念/场景题 |\n| 3.2.2 | Region 选择考量（延迟/合规/价格） | ⭐⭐ 中 | 场景题 |\n| 3.3.1 | EC2 vs Lambda vs 容器（Fargate）选型 | ⭐⭐⭐ 高 | 场景题 |\n| 3.3.2 | Auto Scaling 与 ELB 的高可用作用 | ⭐⭐ 中 | 概念题 |\n| 3.4.1 | RDS vs Aurora vs DynamoDB 选型 | ⭐⭐⭐ 高 | 场景题 |\n| 3.4.2 | Redshift/ElastiCache 一句话定位 | ⭐⭐ 中 | 匹配题 |\n| 3.5.1 | VPC/子网/IGW/NAT 基础组件 | ⭐⭐ 中 | 概念题 |\n| 3.5.2 | Route 53 / CloudFront / Direct Connect 定位 | ⭐⭐⭐ 高 | 匹配题 |\n| 3.6.1 | S3 存储类别选型（频率与取回速度） | ⭐⭐⭐ 高 | 场景题 |\n| 3.6.2 | S3 vs EBS vs EFS | ⭐⭐⭐ 高 | 场景题 |\n| 3.7.1 | SageMaker AI vs Bedrock 区分 | ⭐ 低 | 概念题 |\n| 3.7.2 | 即用 AI 服务与 Athena/QuickSight 定位 | ⭐⭐ 中 | 匹配题 |\n| 3.8.1 | CloudWatch/CloudFormation/Systems Manager 等定位 | ⭐⭐ 中 | 匹配题 |","services":"| 服务 | 主要用途 | 涉及 Task |\n|---|---|---|\n| Amazon EC2 / Auto Scaling / ELB | 虚拟机 + 弹性伸缩 + 负载均衡 | 3.3 |\n| AWS Lambda | 无服务器函数计算 | 3.3 |\n| Amazon ECS / EKS + Fargate | 容器编排（无需管服务器） | 3.3 |\n| Amazon RDS / Aurora / DynamoDB | 关系型 / 兼容增强 / NoSQL | 3.4 |\n| Amazon VPC / CloudFront / Route 53 / Direct Connect | 网络：隔离/分发/DNS/专线 | 3.5 |\n| Amazon S3 / EBS / EFS | 对象 / 块 / 文件存储 | 3.6 |\n| Amazon SageMaker AI / Amazon Bedrock | ML 训练平台 / 基础模型调用 | 3.7 |\n| Amazon Athena / QuickSight | 数据交互查询 / BI 可视化 | 3.7 |\n| Amazon CloudWatch / CloudFormation / Systems Manager | 监控告警 / IaC / 批量运维 | 3.8 |"}},{"domain":4,"name":"计费、定价与支持","weight":"12%","sections":[{"h":"比较 AWS 定价模型","body":"> 本域对应官方考纲任务声明 4.1–4.4：定价模型、账单与成本管理工具、支持计划与技术资源。\n\n#### 本节定位\n\n本节对应考纲任务声明 4.1。虽然域4 只占 12%，但定价模型和成本管理在实际工作中极其重要，也是考试里的\"送分区\"——只要搞清楚几种定价模型的区别和适用场景，这部分的题目很好拿分。学完之后你应该能回答：AWS 有哪几种主要定价模型，各自适合什么场景；什么是 Savings Plans 和 Reserved Instances，区别是什么；AWS 的\"三大计费驱动力\"是什么；Free Tier 有哪几种类型。\n\n#### AWS 计费三大驱动力\n\nAWS 绝大多数服务的费用都可以拆解为三个维度。理解这三个维度是理解任何 AWS 账单的基础。（来源：aws-ec2-instance-types-billing.md）\n\n- **计算（Compute）**：你运行的虚拟机、容器或函数——按运行时长收费（EC2 按小时/秒，Lambda 按请求数+执行时长）\n- **存储（Storage）**：你存放的数据——按 GB/月收费（S3 按实际使用量，EBS 按预置容量）\n- **出站数据传输（Data Transfer Out / DTO）**：从 AWS 传出到互联网的数据——按 GB 收费，传输量越大单价越低（分级定价）。数据传入 AWS（ingress）免费。同一区域内同一可用区的服务间传输大多免费。（来源：aws-data-transfer-pricing-dto.md）\n\n记住这个口诀：**计算按时间，存储按容量，流量按出站**。\n\n#### 四种主要定价模型\n\nAWS 的计算资源（主要是 EC2）有四种定价模型，考试必考的横向对比：\n\n| 定价模型 | 一句话定位 | 折扣幅度 | 承诺期 | 中断风险 | 适合场景 |\n|---|---|---|---|---|---|\n| **On-Demand（按需）** | 用多少付多少 | 无折扣（基准价） | 无 | 无 | 短期、不可预测的工作负载；测试开发 |\n| **Savings Plans** | 承诺每小时使用量换折扣 | 最高 72%（EC2 Instance SP） | 1年或3年 | 无 | 长期稳定负载，想保留灵活性 |\n| **Reserved Instances（RI）** | 预购指定规格的容量 | 最高 75% | 1年或3年 | 无 | 长期稳定且规格确定的负载 |\n| **Spot Instances（竞价）** | 竞价使用闲置容量 | 最高 90% | 无 | **有**（2分钟通知后可被回收） | 容错批处理、CI/CD、大数据分析 |\n\n（来源：aws-ec2-instance-types-billing.md、aws-billing-cost-management-savings-plans.md）\n\n\n[[fig:f08]]\n\n#### Savings Plans 三种类型\n\nSavings Plans 是 AWS 推荐的长期省钱工具（比 RI 更灵活），通过承诺每小时的使用量（美元/小时）换取折扣：\n\n| 类型 | 覆盖服务 | 最高折扣 | 灵活性 |\n|---|---|---|---|\n| **Compute Savings Plans** | EC2 + Fargate + Lambda | 最高 66% | 最灵活：不限实例家族/大小/OS/区域 |\n| **EC2 Instance Savings Plans** | EC2（特定家族+区域） | 最高 72% | 需指定实例家族和区域 |\n| **SageMaker AI Savings Plans** | SageMaker AI 实例 | 最高 64% | 不限实例家族/大小/组件/区域 |\n\n承诺期：1 年或 3 年（3 年折扣更大）。付款方式：全额预付（折扣最大）> 部分预付 > 无预付（折扣最小但无资金占用）。（来源：aws-billing-cost-management-savings-plans.md）\n\n#### Savings Plans vs Reserved Instances\n\n| 维度 | Savings Plans | Reserved Instances |\n|---|---|---|\n| 承诺对象 | 每小时使用金额（$/小时） | 特定实例规格的容量 |\n| 灵活性 | Compute SP 不限实例/区域/OS | 锁定实例类型、区域、OS |\n| 覆盖范围 | EC2 + Fargate + Lambda | 仅 EC2（另有 RDS/Redshift 单独的 RI） |\n| AWS 推荐 | 推荐首选 | 仍然可用，适合完全确定规格的场景 |\n\n考试诀窍：看到\"灵活\"选 Savings Plans；看到\"特定实例规格预购\"选 RI。\n\n#### AWS Free Tier 三种类型\n\n| 类型 | 说明 | 典型例子 |\n|---|---|---|\n| **永久免费（Always Free）** | 不限时间，用量不超限即免费 | Lambda 每月 100 万次请求 + 40 万 GB-秒；DynamoDB 每月 25 GB 存储 |\n| **12 个月免费** | 新账号注册后 12 个月内免费 | EC2 t2.micro/t3.micro 每月 750 小时；S3 每月 5 GB；RDS t2.micro 每月 750 小时 |\n| **短期试用（Trials）** | 首次使用时有限期/限量免费 | SageMaker Studio 前 2 个月免费；Redshift 60 天免费试用 |\n\n考试诀窍：Lambda 属于永久免费层（Always Free），不会在 12 个月后过期。\n\n#### DTO 免费规则\n\n出站数据传输（DTO）有一套重要的免费规则：数据传入 AWS（ingress）全免费；每月前 100 GB 出站到互联网免费（全球汇总，不含中国区和 GovCloud）；从 AWS 服务到 CloudFront 免费；同一可用区内同一服务间的传输大多免费。超过 100 GB 后按分级定价收费，量越大单价越低。（来源：aws-data-transfer-pricing-dto.md）\n\n\n#### On-Demand 深度理解\n\n按需实例是 AWS 定价的基准——没有任何预付费或长期承诺，按实际使用的计算时间付费。EC2 按需实例最小计费 60 秒，之后按秒计费。你什么时候想用就启动，不想用就停止，停止后不再计费（但挂载的 EBS 卷继续按预置容量收费）。（来源：aws-ec2-instance-types-billing.md）\n\n按需的核心价值是**零承诺的灵活性**——你不需要预测未来一年的用量，不需要指定实例类型，不需要预付任何费用。代价是单价最高。适合以下场景：新应用刚上线，流量还不确定；测试和开发环境，用完就关；业务高峰期需要临时扩容（与 Savings Plans 覆盖的基础容量搭配）。\n\n#### Spot Instances 深度理解\n\nSpot 实例让你竞价使用 AWS 数据中心里暂时空闲的计算容量，价格比按需最多便宜 90%。但空闲容量是不保证的——当 AWS 需要这些容量时，会提前 2 分钟通知你并回收实例。（来源：aws-ec2-instance-types-billing.md）\n\nSpot 适合的工作负载有一个共同特点：**可以中断并重新运行**。典型场景包括：大数据处理（Hadoop/Spark 集群，任务失败了重跑即可）、持续集成构建（代码编译，中断了重新排队）、容器化微服务（自动重新调度到新节点）、科学计算和渲染任务。绝对不适合的：数据库主节点、有状态的单体应用、不能中断的实时事务。\n\n使用 Spot 的最佳实践是设置 Spot Fleet（跨多种实例类型和可用区分散），配合 AWS Batch 或 ECS 自动处理中断和重试。\n\n#### Reserved Instances 深度理解\n\nRI 是最早期的长期折扣工具——你预购一年或三年的特定实例规格（如 m5.xlarge、us-east-1、Linux），用不用都按折扣价付费。三种付款方式：全额预付（折扣最大）、部分预付、无预付（折扣最小）。（来源：aws-ec2-instance-types-billing.md）\n\nRI 目前仍然可用，但 AWS 更推荐 Savings Plans（更灵活）。RI 适合完全确定实例规格且不会换代的场景。注意：除了 EC2 RI，AWS 还有 RDS RI、Redshift RI、ElastiCache RI 和 DynamoDB Reserved Capacity——这些是服务专属的，考试偶尔会考。\n\n\n#### 定价模型选型决策树\n\n面对考题时，按以下顺序判断：\n第一步：工作负载能不能中断？如果能容忍中断（批处理、CI/CD、科学计算）→ 首选 Spot Instances（省最多 90%）。\n第二步：是否长期运行且用量可预测？如果是 → Savings Plans（灵活性好）或 RI（规格完全确定时折扣最大）。\n第三步：短期或不确定 → On-Demand（零承诺，按需付费）。\n实际生产中通常三种模型组合使用：Savings Plans 覆盖基线用量，Spot 覆盖可中断的弹性部分，On-Demand 覆盖临时峰值和新项目测试。\n\n\n#### DTO 分级定价机制详解\n\n出站数据传输费采用分级定价（Tiered Pricing）——传输量越大，每 GB 单价越低。以美国区域为参考：前 10 TB 约 $0.09/GB，后续逐段递减到大客户约 $0.05/GB。这个分级是跨所有服务汇总的——你的 EC2 出站和 S3 出站加在一起计入同一个分级阶梯。这就是为什么合并计费能省钱：多个账号的出站流量汇总后更容易达到更低的价格段。此外，每月前 100 GB 出站完全免费（全球汇总，不含中国区域和 GovCloud），CloudFront 另有独立的每月 1 TB 免费额度可以叠加。（来源：aws-data-transfer-pricing-dto.md）\n\n#### EC2 计费精度与 Stop vs Terminate\n\nEC2 按需实例的计费精度：最小计费 60 秒，之后按秒计费（部分老一代实例按小时计费）。Stop（停止）和 Terminate（终止）的计费影响不同：Stop 停止计算计费但 EBS 卷继续按预置容量收费；Terminate 终止所有计费（默认删除根卷，自定义卷可选保留）。考试中\"如何完全停止 EC2 费用\"→ Terminate 实例并释放 EBS 和 Elastic IP。（来源：aws-ec2-instance-types-billing.md）\n\n#### Enterprise Discount Program（E
