document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') closeGlossTip();
});

/* ================================================================
   ===================== localStorage 操作 =========================
   ================================================================ */
const LS_ANSWERS = LS_PREFIX + '_answers';
const LS_WRONG   = LS_PREFIX + '_wrong';
const LS_PROGRESS = LS_PREFIX + '_progress';

function getAnswers() { return JSON.parse(localStorage.getItem(LS_ANSWERS)||'[]'); }
function setAnswers(a) { localStorage.setItem(LS_ANSWERS,JSON.stringify(a)); }
function getWrong() { return JSON.parse(localStorage.getItem(LS_WRONG)||'[]'); }
function setWrong(w) { localStorage.setItem(LS_WRONG,JSON.stringify(w)); }
function getProgress() { return JSON.parse(localStorage.getItem(LS_PROGRESS)||'{}'); }
function setProgress(p) { localStorage.setItem(LS_PROGRESS,JSON.stringify(p)); }

/* ----------------------------------------------------------------
   作答记录：会话态 / 累计统计态分离（修复）
   旧缺陷：模拟考核误读全局 localStorage 历史 → 进场即显示「已答对/曾答错」、
   题号导航提前染色、成绩单把练习与往场算进本次（实测正确数>题数、未答为负、
   分数超满分、正确率>100%）。
   三态口径：
     · sessionResults()       本场逐题作答（quizState.results）＝「本次」唯一真源
     · sessionScopedAnswers() 视图用作答集：考核=仅本场；练习模式=全局历史（原行为）
     · recordAnswer()         仍写全局 store → 错题集与统计口径不变
   ---------------------------------------------------------------- */
function sessionResults() {
  const r = (quizState && quizState.results) || {};
  return Object.keys(r).map(id => ({id, ua:r[id].ua, ok:r[id].ok, ts:r[id].ts}));
}
function sessionScopedAnswers() {
  return (quizState && quizState.mode === 'exam') ? sessionResults() : getAnswers();
}

function recordAnswer(qId, userAnswer, isCorrect) {
  const answers = getAnswers();
  answers.push({id:qId,ua:userAnswer,ok:isCorrect,ts:Date.now()});
  setAnswers(answers);
  const wrong = getWrong();
  const idx = wrong.findIndex(w=>w.id===qId);
  if(!isCorrect) {
    if(idx>=0) { wrong[idx].count++; wrong[idx].last=Date.now(); }
    else { wrong.push({id:qId,count:1,last:Date.now(),mastered:false}); }
  }
  setWrong(wrong);
}

function markMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=true;
  setWrong(wrong);
}
function unmarkMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=false;
  setWrong(wrong);
}
function removeWrong(qId) {
  setWrong(getWrong().filter(x=>x.id!==qId));
}

/* ================================================================
   ===================== 辅助函数 =================================
   ================================================================ */
const DOMAIN_NAMES = META.domains || {};
const DOMAIN_WEIGHTS = META.weights || {};
const DOMAIN_KEYS = Object.keys(DOMAIN_NAMES).map(Number).sort((a,b)=>a-b);
const EXAM_P = META.examParams || {};
const EXAM_COUNT = EXAM_P.count || 50;
const EXAM_MIN = EXAM_P.minutes || 60;
const EXAM_PASS = EXAM_P.pass || 700;
const TYPE_NAMES = {single:'单选题',multiple:'多选题',hot:'拖拽题'};

function getQById(id) { return QUESTIONS.find(q=>q.id===id); }
function shuffle(arr) { const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function generateShuffledOptions(questions) {
  const opts = {};
  const newAnswers = {};
  questions.forEach(q => {
    if(q.t==='single'||q.t==='multiple') {
      const shuffled = shuffle([...q.o]);
      const labels = 'ABCDEFGHIJ';
      const relabeled = shuffled.map((item, i) => ({l: labels[i], t: item.t}));
      opts[q.id] = relabeled;
      const contentToNewLabel = {};
      relabeled.forEach(item => { contentToNewLabel[item.t] = item.l; });
      newAnswers[q.id] = q.a.map(oldL => {
        const oldItem = q.o.find(o => o.l === oldL);
        return oldItem ? contentToNewLabel[oldItem.t] : oldL;
      });
    }
  });
  return { opts, newAnswers };
}

function getStats() {
  const answers = getAnswers();
  const wrong = getWrong();
  const totalCorrect = answers.filter(a=>a.ok).length;
  const totalAnswered = answers.length;
  const acc = totalAnswered ? Math.round(totalCorrect/totalAnswered*100) : 0;
  const doneIds = [...new Set(answers.map(a=>a.id))];
  const completion = Math.round(doneIds.length/QUESTIONS.length*100);
  const domainStats = {};
  for(const d of DOMAIN_KEYS) {
    const dQIds = QUESTIONS.filter(q=>q.d===d).map(q=>q.id);
    const dAnswers = answers.filter(a=>dQIds.includes(a.id));
    const dCorrect = dAnswers.filter(a=>a.ok).length;
    const dTotal = dAnswers.length;
    domainStats[d] = {
      total:dQIds.length, answered:dTotal, correct:dCorrect,
      acc: dTotal ? Math.round(dCorrect/dTotal*100) : 0
    };
  }
  const typeStats = {};
  for(const t of ['single','multiple']) {
    const tQIds = QUESTIONS.filter(q=>q.t===t).map(q=>q.id);
    const tAnswers = answers.filter(a=>tQIds.includes(a.id));
    const tCorrect = tAnswers.filter(a=>a.ok).length;
    const tTotal = tAnswers.length;
    typeStats[t] = { answered:tTotal, correct:tCorrect, acc: tTotal ? Math.round(tCorrect/tTotal*100) : 0 };
  }
  const recentWrong = wrong.filter(w=>!w.mastered).sort((a,b)=>b.last-a.last).slice(0,5);
  const recent = answers.slice(-20).reverse();
  let streak = 0;
  for(const a of recent) { if(a.ok) streak++; else break; }
  return {totalCorrect,totalAnswered,acc,completion,domainStats,typeStats,recentWrong,streak,doneIds:doneIds.length};
}

function renderQuiz() {
  const el = document.getElementById('page-quiz');
  if(!quizState || !quizState.questions.length) {
    el.innerHTML = `<div class="header"><button class="back-btn" onclick="navigate('dashboard')">←</button><h1>刷题</h1></div>
    <p style="text-align:center;margin-top:60px;color:var(--text2)">暂无题目，请从仪表盘选择模式开始练习</p>`;
    return;
  }
  const q = quizState.questions[quizState.currentIdx];
  const isHot = q.t === 'hot';
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  // 考核=仅本场作答；练习模式=全局历史（含本场）——防练习记录串进考核视图
  const answers = sessionScopedAnswers();
  const prevAnswers = answers.filter(a=>a.id===q.id);
  const everCorrect = prevAnswers.some(a=>a.ok);
  const everWrong = prevAnswers.some(a=>!a.ok);
  const answered = quizState.answered || {};
  let userAns = answered[q.id];
  const finished = quizState.submitted && quizState.submitted[q.id];
  const correct = finished && isAnswerCorrect(q, userAns);

  let modeLabel = quizState.mode==='exam'?'📋 模拟考核':quizState.mode==='wrong'?'❌ 错题重练':quizState.mode==='domain'?'📖 章节练习':quizState.mode==='single'?'📝 单题练习':'📝 顺序练习';

  let html = `<div class="quiz-header">
    <button class="back-btn" onclick="exitQuiz()">←</button>
    <span style="font-weight:600;font-size:15px">${modeLabel}</span>
    ${quizState.mode==='exam'?`<span class="timer" id="quizTimer"></span>`:''}
    <span class="quiz-progress">${quizState.currentIdx+1}/${quizState.questions.length}</span>
  </div>`;
  html += `<div class="quiz-meta">
    <span class="domain-tag">Domain ${q.d}</span>
    <span>${DOMAIN_NAMES[q.d]}</span>
    <span>${TYPE_NAMES[q.t]}</span>
    ${everCorrect?'<span style="background:rgba(6,214,160,.15);color:var(--correct)">已答对</span>':''}
    ${everWrong?'<span style="background:rgba(239,71,111,.15);color:var(--wrong)">曾答错</span>':''}
  </div>`;
  html += `<div class="question-text">${q.q}</div>`;

  const renderOpts = getOptionsHTML(q, userAns, finished, correct, getShuffledAnswer(q));
  html += renderOpts;

  if(isHot) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?'▶ 完成返回':'▶ 下一题'}</button>
    </div>`;
  } else if(!finished) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>✅ 确认</button>
    </div>`;
  } else {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?(quizState.mode==='exam'?'📊 交卷查看成绩':'▶ 完成返回'):'▶ 下一题'}</button>
    </div>`;
  }

  if(finished) {
    const badge = correct ? '✅ 回答正确!' : '❌ 回答错误';
    const cls = correct ? 'correct' : 'wrong';
    const gItems = getGlossaryForQuestion(q);
    let gHtml = '';
    if(gItems.length) {
      gHtml = '<div class="glossary"><div class="glossary-title">词汇附录</div>';
      gItems.forEach(g => {
        gHtml += '<div class="glossary-item"><span class="glossary-term">' + g.term + '</span><span class="glossary-def">\u00a0\u2014\u00a0' + g.def.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span></div>';
      });
      gHtml += '</div>';
    }
    html += `<div class="explanation show">
      <div class="result-badge ${cls}">${badge}</div>
      <div class="exp-text"><strong>正确答案：</strong>${formatAnswer(q)}</div>
      <div class="exp-text" style="margin-top:8px"><strong>解析：</strong>${highlightGlossaryTerms(fmtExp(q.e))}</div>
      ${q.s?`<div class="exp-source">来源：${q.s}</div>`:''}
      ${gHtml}
    </div>`;
  }

  html += `<div class="qnav"><h4>题号导航</h4><div class="qnav-grid">`;
  quizState.questions.forEach((qq, i) => {
    const qAnswers = answers.filter(a=>a.id===qq.id);
    const qCor = qAnswers.some(a=>a.ok);
    const qWro = qAnswers.some(a=>!a.ok);
    let cls = '';
    if(i===quizState.currentIdx) cls='current';
    else if(qCor) cls='done-correct';
    else if(qWro) cls='done-wrong';
    html += `<div class="qnav-item ${cls}" onclick="jumpToQuestion(${i})">${i+1}</div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
  if(!finished) updateSubmitButton();
}

function getOptionsHTML(q, userAns, finished, correct, shuffledAns) {
  let html = '';
  const qtype = q.t;
  if(qtype === 'hot') {
    html += `<div class="options-list" style="background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:16px">
      <div style="font-weight:600;color:var(--primary);margin-bottom:8px">🖱 本题为拖拽/操作题（HOTSPOT）</div>
      <div style="font-size:13px;line-height:1.7;color:var(--text2)">本题无标准 A/B/C/D 选项，答题形式为图形拖拽/区域选择。题目与图形见源 PDF 原图，答案请参照源文件。</div>`;
    if(q.e) {
      html += `<div style="margin-top:10px;font-size:13px;line-height:1.7;color:var(--text2);border-top:1px solid var(--border);padding-top:10px"><strong>解析/提示：</strong><br>${highlightGlossaryTerms(fmtExp(q.e))}</div>`;
    }
    html += `</div>`;
    return html;
  }
  if(qtype === 'single' || qtype === 'multiple') {
    const isMulti = qtype === 'multiple';
    html += `<div class="options-list">`;
    const opts = quizState.shuffledOptions && quizState.shuffledOptions[q.id] ? quizState.shuffledOptions[q.id] : q.o;
    opts.forEach(o => {
      const isSelected = userAns && userAns.includes(o.l);
      let cls = 'option-item';
      if(isMulti) cls += ' multi';
      if(isSelected && !finished) cls += ' selected';
      if(finished) {
        if(shuffledAns.includes(o.l)) cls += ' correct';
        else if(isSelected) cls += ' wrong';
      }
      const onclick = finished ? '' : `toggleOption('${o.l}')`;
      html += `<div class="${cls}" onclick="${onclick}">
        <span class="opt-label">${o.l}</span>
        <span>${o.t}</span>
      </div>`;
    });
    html += `</div>`;
    if(isMulti && !finished) html += `<div style="font-size:13px;color:var(--text2);margin-top:-12px;margin-bottom:16px">多选——请选择所有正确答案后提交（至少选2项）</div>`;
  }
  return html;
}

function toggleOption(label) {
  const q = quizState.questions[quizState.currentIdx];
  if(!quizState.answered) quizState.answered = {};
  if(q.t==='single') {
    quizState.answered[q.id] = [label];
  } else {
    const arr = quizState.answered[q.id] || [];
    const idx = arr.indexOf(label);
    if(idx>=0) arr.splice(idx,1);
    else arr.push(label);
    quizState.answered[q.id] = arr;
  }
  renderQuiz();
}

function updateSubmitButton() {
  const q = quizState.questions[quizState.currentIdx];
  if(q.t === 'hot') return;
  const ans = quizState.answered && quizState.answered[q.id];
  const btn = document.getElementById('submitBtn');
  if(!btn) return;
  if(q.t==='single') btn.disabled = !ans || !ans.length;
  else if(q.t==='multiple') btn.disabled = !ans || ans.length < 2;
}

function getShuffledAnswer(q) {
  if(quizState && quizState.shuffledAnswers && quizState.shuffledAnswers[q.id]) {
    return quizState.shuffledAnswers[q.id];
  }
  return q.a;
}

function isAnswerCorrect(q, userAns) {
  if(!userAns) return false;
  const ca = getShuffledAnswer(q);
  if(q.t==='single') return userAns[0]===ca[0];
  if(q.t==='multiple') { const a=[...userAns].sort(); const b=[...ca].sort(); return JSON.stringify(a)===JSON.stringify(b); }
  return false;
}

function formatAnswer(q) {
  const ca = getShuffledAnswer(q);
  if(q.t==='single'||q.t==='multiple') return ca.join(', ');
  if(q.t==='hot') return '本题为拖拽/操作题，答案为图形区域匹配，见源 PDF 原图';
  return '';
}

function submitAnswer() {
  const q = quizState.questions[quizState.currentIdx];
  let userAns = quizState.answered && quizState.answered[q.id];
  if(!userAns) return;
  if(q.t==='multiple' && userAns.length < 2) {
    alert('多选题至少选择2个答案，当前只选了' + userAns.length + '个');
    return;
  }
  const correct = isAnswerCorrect(q, userAns);
  if(!quizState.submitted) quizState.submitted={};
  quizState.submitted[q.id]=true;
  // 本场作答留痕（考核判分唯一依据；不与全局统计混用）
  if(!quizState.results) quizState.results={};
  quizState.results[q.id]={ua:[...userAns], ok:correct, ts:Date.now()};
  recordAnswer(q.id, userAns, correct);
  renderQuiz();
  updateSubmitButton();
}

function prevQuestion() {
  if(quizState.currentIdx > 0) { quizState.currentIdx--; renderQuiz(); }
}
function nextQuestion() {
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  if(isLast) {
    if(quizState.mode==='exam') renderExamResult();
    else navigate('dashboard');
  } else {
    quizState.currentIdx++;
    renderQuiz();
  }
}
function jumpToQuestion(idx) {
  quizState.currentIdx = idx;
  renderQuiz();
}
function exitQuiz() {
  // 考核中途退出必须停表：否则过期计时器归零时会把之后的练习页改写成「考核成绩单」
  if(quizState && quizState.mode==='exam') stopExamTimer();
  if(quizState && quizState.mode!=='exam') {
    setProgress({mode:quizState.mode,domain:quizState.domain||null,idx:quizState.currentIdx,time:Date.now()});
  }
  quizState = null;
  navigate('dashboard');
}

/* ================================================================
   ===================== 刷题模式启动 ==============================
   ================================================================ */
function startDomain(d) {
  const qs = QUESTIONS.filter(q=>q.d===d);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'domain',domain:d,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startContinue() {
  const p = getProgress();
  if(p.mode && p.mode!=='exam') {
    if(p.mode==='domain' && p.domain) {
      const qs = QUESTIONS.filter(q=>q.d===p.domain);
      const _sr=generateShuffledOptions(qs);
      quizState = {mode:'domain',domain:p.domain,questions:qs,currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    } else {
      const _sr=generateShuffledOptions([...QUESTIONS]);
      quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    }
  } else {
    const _sr=generateShuffledOptions([...QUESTIONS]);
    quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  }
  navigate('quiz');
}
function startWrongReview() {
  const wrong = getWrong().filter(w=>!w.mastered);
  if(!wrong.length) { alert('暂无错题需要复习！'); return; }
  const qs = wrong.map(w=>getQById(w.id)).filter(Boolean);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'wrong',domain:null,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startSingle(id) {
  const q = getQById(id);
  if(!q) return;
  const _sr=generateShuffledOptions([q]);
  quizState = {mode:'single',domain:null,questions:[q],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startExam() {
  // 模拟考核：按 meta 权重 × meta 题数分配各域配额（最大余数法，保证总和=EXAM_COUNT）
  const counts = {};
  let sumInt = 0;
  const raw = {}, rem = {};
  DOMAIN_KEYS.forEach(k => {
    const w = parseFloat(String(DOMAIN_WEIGHTS[k]||'0').replace('%',''))/100;
    raw[k] = w * EXAM_COUNT;
    counts[k] = Math.floor(raw[k]);
    rem[k] = raw[k] - counts[k];
    sumInt += counts[k];
  });
  let deficit = EXAM_COUNT - sumInt;
  const order = [...DOMAIN_KEYS].sort((a,b)=>rem[b]-rem[a]);
  let i = 0;
  while(deficit > 0) { counts[order[i % order.length]]++; deficit--; i++; }
  let selected = [];
  DOMAIN_KEYS.forEach(d => {
    const pool = shuffle(QUESTIONS.filter(q=>q.d===d && q.t!=='hot'));
    selected.push(...pool.slice(0, counts[d]));
  });
  selected = shuffle(selected);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam',domain:null,questions:selected,currentIdx:0,answered:{},submitted:{},results:{},shuffledOptions:_exam.opts,shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  // 场次标识：计时回调据此判定「本场是否仍在进行」，防过期计时器串场
  quizState.examToken = 'ex-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

let examTimerInterval = null;
function stopExamTimer() {
  if(examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
}
function startExamTimer() {
  let secs = quizState.examDuration;
  const token = quizState.examToken;
  const timerEl = document.getElementById('quizTimer');
  if(!timerEl) return;
  stopExamTimer();
  examTimerInterval = setInterval(() => {
    // 场次校验：已退出或已换场（新 token）立即自毁
    if(!quizState || quizState.mode!=='exam' || quizState.examToken!==token) { stopExamTimer(); return; }
    secs--;
    const m = Math.floor(secs/60), s = secs%60;
    const el = document.getElementById('quizTimer');
    if(el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if(secs<=60 && el) el.classList.add('warning');
    if(secs<=0) { stopExamTimer(); finishExam(token); }
  }, 1000);
}

function finishExam(token) {
  stopExamTimer();
  // 只对「发起本场计时」的考核会话生效
  if(quizState && quizState.mode==='exam' && (token===undefined || quizState.examToken===token)) renderExamResult();
}

function renderExamResult() {
  if(!quizState) return;
  stopExamTimer();
  const qs = quizState.questions;
  const results = quizState.results || {};
  const total = qs.length;
  // 逐题按本场作答判分；全局历史与往场作答一律不计
  let correct = 0, wrong = 0, unanswered = 0;
  const domStat = {};
  DOMAIN_KEYS.forEach(d => domStat[d] = {n:0, cor:0});
  qs.forEach(q => {
    if(!domStat[q.d]) domStat[q.d] = {n:0, cor:0};
    domStat[q.d].n++;
    const r = results[q.id];
    if(!r) unanswered++;
    else if(r.ok) { correct++; domStat[q.d].cor++; }
    else wrong++;
  });
  // 不变量自校验：正确 + 错误 + 未答 必须等于试卷题数
  if(correct + wrong + unanswered !== total) console.warn('[exam] 判分不变量异常', {correct, wrong, unanswered, total});
  const el = document.getElementById('page-quiz');
  const pct = total ? Math.round(correct/total*100) : 0;
  // 1000-point scale, 700 to pass
  const scaledScore = total ? Math.round(correct/total*1000) : 0;
  const passed = scaledScore >= EXAM_PASS;
  // Time used
  const timeUsed = quizState.examStartTime ? Math.round((Date.now()-quizState.examStartTime)/1000) : 0;
  const timeM = Math.floor(timeUsed/60), timeS = timeUsed%60;

  // Domain breakdown
  let domainHtml = '';
  for(const d of DOMAIN_KEYS) {
    const dd = domStat[d] || {n:0, cor:0};
    const dPct = dd.n ? Math.round(dd.cor/dd.n*100) : 0;
    domainHtml += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${dd.n}</td><td>${dd.cor}</td><td style="color:${dPct>=70?'var(--correct)':'var(--wrong)'}">${dPct}%</td></tr>`;
  }

  el.innerHTML = `<div class="header"><button class="back-btn" onclick="exitExam()">←</button><h1>📋 考核成绩单</h1></div>
  <div style="text-align:center;padding:30px 20px">
    <div style="font-size:48px;font-weight:700;color:${passed?'var(--correct)':'var(--wrong)'}">${scaledScore}</div>
    <div style="font-size:14px;color:var(--text2);margin:4px 0">满分 1000 分 | 及格线 ${EXAM_PASS} 分</div>
    <div style="font-size:16px;color:var(--text);margin:12px 0;font-weight:600">${passed?'✅ 通过！':'❌ 未通过'}</div>
    <div style="display:flex;justify-content:center;gap:20px;margin:16px 0;flex-wrap:wrap">
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--correct)">${correct}</div><div style="font-size:12px;color:var(--text2)">正确</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--wrong)">${wrong}</div><div style="font-size:12px;color:var(--text2)">错误</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text2)">${unanswered}</div><div style="font-size:12px;color:var(--text2)">未答</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--primary)">${pct}%</div><div style="font-size:12px;color:var(--text2)">正确率</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text)">${timeM}分${timeS.toString().padStart(2,'0')}秒</div><div style="font-size:12px;color:var(--text2)">用时</div></div>
    </div>
  </div>
  <div class="stats-chart">
    <h3>各章节成绩</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>题数</th><th>正确</th><th>正确率</th></tr></thead><tbody>
    ${domainHtml}
    </tbody></table>
  </div>
  <div style="text-align:center;padding:20px">
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn-secondary" onclick="exitExam()" style="width:auto">返回首页</button>
      <button class="btn-primary" onclick="startExam()" style="width:auto;flex:none">再考一次</button>
    </div>
  </div>`;
  quizState = null;
}

function exitExam() {
  quizState = null;
  navigate('dashboard');
}

let wrongFilter = 0;

function renderWrongBook() {
  const wrong = getWrong().filter(w=>!w.mastered);
  const mastered = getWrong().filter(w=>w.mastered);
  const el = document.getElementById('page-wrongbook');
  let html = `<div class="header"><h1>❌ 错题集</h1></div>`;
  html += `<div class="wrong-stats">
    <div class="stat-card"><div class="stat-num">${wrong.length}</div><div class="stat-label">待复习</div></div>
    <div class="stat-card"><div class="stat-num">${mastered.length}</div><div class="stat-label">已掌握</div></div>
    <div class="stat-card"><div class="stat-num">${wrong.length+mastered.length}</div><div class="stat-label">共错题</div></div>
  </div>`;
  html += `<div class="wrong-tabs">
    <button class="wrong-tab ${wrongFilter===0?'active':''}" onclick="wrongFilter=0;renderWrongBook()">全部</button>`;
  for(const d of DOMAIN_KEYS) {
    html += `<button class="wrong-tab ${wrongFilter===d?'active':''}" onclick="wrongFilter=${d};renderWrongBook()">${DOMAIN_NAMES[d]}</button>`;
  }
  html += `</div>`;
  let items = wrongFilter ? wrong.filter(w=>{const q=getQById(w.id);return q&&q.d===wrongFilter}) : wrong;
  items.sort((a,b)=>b.count-a.count);
  if(!items.length) {
    html += `<p style="text-align:center;margin-top:40px;color:var(--text2)">🎉 暂无错题！</p>`;
  } else {
    items.forEach(w=>{
      const q = getQById(w.id);
      if(!q) return;
      html += `<div class="wrong-item">
        <div class="wi-header">
          <span><strong>Domain ${q.d}</strong> | ${TYPE_NAMES[q.t]}</span>
          <span style="color:var(--wrong)">答错${w.count}次</span>
        </div>
        <div style="font-size:14px;margin-bottom:6px">${q.q.slice(0,60)}${q.q.length>60?'…':''}</div>
        <div style="font-size:12px;color:var(--text2)">最近答错：${new Date(w.last).toLocaleString()}</div>
        <div class="wi-actions">
          <button onclick="startSingle('${w.id}')">📝 重练本题</button>
          <button onclick="markMastered('${w.id}');renderWrongBook()">✅ 标记已掌握</button>
          <button onclick="removeWrong('${w.id}');renderWrongBook()">🗑️ 移除</button>
        </div>
      </div>`;
    });
  }
  if(mastered.length) {
    html += `<div style="margin-top:20px"><h3 style="font-size:14px;margin-bottom:8px;color:var(--text2)">已掌握 (${mastered.length})</h3>`;
    html += `<button class="btn-secondary" onclick="if(confirm('确定清空所有已掌握的错题吗？')){setWrong(getWrong().filter(w=>!w.mastered));renderWrongBook();}" style="width:auto">清空已掌握</button></div>`;
  }
  el.innerHTML = html;
}

/* ================================================================
   ===================== 统计页面 ==================================
   ================================================================ */
function renderStats() {
  const s = getStats();
  const el = document.getElementById('page-stats');
  let html = `<div class="header"><h1>📊 统计分析</h1></div>`;
  html += `<div class="stats-chart">
    <h3>总进度</h3>
    <div style="height:30px;background:var(--border);border-radius:15px;overflow:hidden">
      <div style="height:100%;width:${s.completion}%;background:var(--primary);border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600">${s.completion}%</div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--text2)">
      <span>已答 ${s.doneIds}/${QUESTIONS.length} 题</span>
      <span>正确率 ${s.acc}%</span>
    </div>
  </div>`;
  html += `<div class="stats-chart"><h3>各章节正确率</h3><canvas id="chartDomain"></canvas></div>`;
  html += `<div class="stats-chart"><h3>各题型正确率</h3><canvas id="chartType"></canvas></div>`;
  html += `<div class="stats-chart"><h3>详细数据</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>总题</th><th>已答</th><th>正确</th><th>正确率</th></tr></thead><tbody>`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${ds.total}</td><td>${ds.answered}</td><td>${ds.correct}</td><td style="color:${ds.acc>=70?'var(--correct)':'var(--wrong)'};font-weight:600">${ds.acc}%</td></tr>`;
  }
  html += `</tbody></table></div>`;
  el.innerHTML = html;
  setTimeout(() => {
    drawDomainChart(s);
    drawTypeChart(s);
  }, 50);
}

function drawDomainChart(s) {
  const c = document.getElementById('chartDomain');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = DOMAIN_KEYS.map(k=>'D'+k);
  const colors = ['#4361ee','#4cc9f0','#06d6a0','#f8961e','#9b5de5'];
  const barW = (W-80) / (labels.length*1.5);
  labels.forEach((l,i)=>{
    const val = s.domainStats[i+1].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(l, x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

function drawTypeChart(s) {
  const c = document.getElementById('chartType');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = ['单选','多选'];
  const keys = ['single','multiple'];
  const colors = ['#4361ee','#4cc9f0'];
  const barW = (W-80) / 4;
  keys.forEach((k,i)=>{
    const val = s.typeStats[k].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

/* roundRect polyfill */
if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(r>w/2) r=w/2;
    if(r>h/2) r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    return this;
  };
}

   ================================================================ */
function exportData() {
  const data = {
    answers: getAnswers(),
    wrong: getWrong(),
    progress: getProgress(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${LS_PREFIX}-quiz-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.answers) setAnswers(data.answers);
        if(data.wrong) setWrong(data.wrong);
        if(data.progress) setProgress(data.progress);
        alert('数据导入成功！');
        navigate(currentPage);
      } catch(err) { alert('数据格式错误，请检查文件。'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetData() {
  showModal('确认重置', '确定要清除所有答题记录、错题集和进度吗？此操作不可恢复！', () => {
    localStorage.removeItem(LS_ANSWERS);
    localStorage.removeItem(LS_WRONG);
    localStorage.removeItem(LS_PROGRESS);
    navigate('dashboard');
  });
}

let modalCallback = null;
function showModal(title, text, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOverlay').classList.add('show');
  modalCallback = onConfirm;
  document.getElementById('modalConfirmBtn').onclick = () => {
    closeModal();
    if(modalCallback) modalCallback();
  };
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

   ===================== 主题切换 ==================================
   ================================================================ */
function toggleTheme() {
  document.getElementById('quizView').classList.toggle('dark');
  localStorage.setItem(LS_PREFIX+'_theme', document.getElementById('quizView').classList.contains('dark')?'dark':'light');
  navigate(currentPage);
}

/* ================================================================
   ===================== 初始化 ====================================
   ================================================================ */
function init() {
  if(localStorage.getItem(LS_PREFIX+'_theme')==='dark') document.getElementById('quizView').classList.add('dark');
  const pages = ['dashboard','quiz','wrongbook','stats','settings'];
  const app = document.getElementById('app');
  pages.forEach(p => {
    const div = document.createElement('div');
    div.id = 'page-'+p;
    div.className = 'page' + (p==='dashboard'?' active':'');
    app.appendChild(div);
  });
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => { if(btn.dataset.page==='learn'){ if(window.kbShowLearnHome) window.kbShowLearnHome(); } else navigate(btn.dataset.page); });
  });
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', init);

需要猜容量、不再需要一次性巨额投入、不再需要养运维团队做这些与你业务无关的体力活。这就是云的底层价值逻辑——**把 IT 从重资产变成水电一样的公用服务**。\n\n#### AWS 云的六大价值主张\n\nAWS 官方文档将云的核心价值总结为以下六条。这六条在考试中以各种变体反复出现，必须逐条理解到能用自己的话复述。\n\n**第一条：以可变成本替代前期固定投入**\n\n英文原文是 Trade upfront expense for variable expense。传统模式下，你需要先花一大笔钱买服务器和建机房，这笔钱记在资产负债表上，叫资本支出（CapEx）——不管后面用不用，钱已经花了。云模式下，你只为实际消耗的计算、存储和网络流量付费，云账单记在利润表里，叫运营支出（OpEx）——账单金额跟着业务走。考试中这条最常以「CapEx vs OpEx」的对比形式出现，看到就选这条。\n\n**第二条：受益于大规模经济效益**\n\n英文原文是 Benefit from massive economies of scale。AWS 聚合了全球数百万客户的用量，在芯片、硬盘、网络设备的采购中有远超任何单个企业的议价能力。这份规模优势会以更低的按需价格传导给所有用户——AWS 历史上已经多次降价，降价次数超过一百次。考试里看到「聚合用量降低单价」「规模效应」就对应这条。\n\n**第三条：停止猜测容量**\n\n英文原文是 Stop guessing capacity。自建机房最头疼的事情之一是容量规划。买多了，资源常年闲置；买少了，大促当天系统崩溃、客户流失。两种结果都是亏钱。云上用 Amazon EC2 Auto Scaling 等弹性服务，系统根据实际负载指标自动添加或减少资源，不需要人工提前预估。你只需要设定伸缩策略，剩下的交给 AWS 去做。\n\n**第四条：提升速度与敏捷性**\n\n英文原文是 Increase speed and agility。传统 IT 采购周期以周甚至月计。云上几分钟就能启动一台虚拟机、建好一个数据库、配好一套 CI/CD 流水线。开发团队可以快速创建实验环境、验证想法，不行就关掉重来，试错成本接近零。这种速度对产品迭代和创新至关重要。考试里「更快的试验」「加速创新」「敏捷性」都指向这条。\n\n**第五条：停止在数据中心上花钱**\n\n英文原文是 Stop spending money running and maintaining data centers。机房运维是典型的「无差异化重活」（undifferentiated heavy lifting）——上架、布线、散热、物理安全、硬件故障更换。这些工作对每家企业都一样，不会给你的产品带来竞争优势。把这些活交给 AWS，你的工程师就能把全部精力放在写代码、做产品、服务客户这些真正创造业务价值的事情上。\n\n**第六条：几分钟内全球部署**\n\n英文原文是 Go global in minutes。AWS 在全球数十个地理区域（Region）运营基础设施，每个 Region 内有多个可用区（Availability Zone）。你可以在几分钟之内把应用部署到离终端用户最近的 Region，大幅降低访问延迟。同样一套代码，在东京、法兰克福、弗吉尼亚各部署一份，就能覆盖三大洲的用户。自建等量基础设施要谈场地、拉专线、等采购，周期以年计。（来源：official-wa-framework.md，Performance Efficiency 支柱设计原则 \"Go global in minutes\"）\n\n[[fig:f06]]\n\n#### 三种云部署模型对比\n\n| 部署模型 | 定义 | 适用场景 | 典型例子 |\n| --- | --- | --- | --- |\n| **公有云（Public Cloud）** | 所有 IT 资源运行在云服务商的共享基础设施上，通过互联网按需使用 | 初创公司全量上云、SaaS 应用、全球化业务 | 一家互联网公司的全部业务都跑在 AWS 上 |\n| **私有云（On-Premises / Private Cloud）** | 企业在自有数据中心内使用虚拟化技术搭建云环境，资源专属 | 强监管行业的极敏感数据、已有巨额投资的遗留系统 | 银行核心账务系统在自有机房运行 |\n| **混合云（Hybrid Cloud）** | 公有云与私有云或本地数据中心联合使用，数据和应用可在两者之间流转 | 部分上云（核心留本地、非核心上云）、灾备、逐步迁移过渡 | 制造企业工厂数据留本地，分析报表跑在 AWS |\n\n考试判题诀窍：看到「同时保留本地数据中心」加「使用 AWS 服务」就选混合云；看到「所有资源都在 AWS」就选公有云；看到「完全在自有数据中心」就选私有云或本地部署。另外注意：AWS Outposts 是一种把 AWS 硬件和软件部署到你的本地数据中心的服务——它本质上仍然属于混合云范畴。\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n连锁烘焙品牌「麦香坊」每年中秋前大促，线上商城流量是平时的 8 倍。过去的做法是在大促前三个月提前采购一批服务器，上架部署后扛住峰值；大促结束后机器闲置十一个月，占着机柜和电费，利用率不到 10%。\n\n上云后方案完全不同：平时用 2 台 Amazon EC2 实例跑商城后端，大促前一周配好 Auto Scaling 策略，流量上来时自动扩到 16 台，大促结束第二天自动缩回 2 台。\n\n总成本反而比自建低——因为只付了大促那几天的额外机器费用。财务上最大的变化是：过去买服务器是 CapEx，一次性花 120 万，折旧三年；现在云账单是 OpEx，大促月账单 3 万、平月 8 千，现金流更可控，财务报表更灵活。\n\n#### 常见误区与易错点\n\n**误区 1：「上云一定省钱」**\n\n上云的核心价值是灵活性和敏捷性，不是绝对省钱。如果一个工作负载 7×24 小时满负荷运行，而且你不做任何优化（不用 Savings Plans、不用 Spot、不关闲置资源），按需价格确实可能比自建三年均摊成本贵。省钱需要搭配弹性伸缩、长期承诺折扣（Savings Plans / RI）和成本监控工具。考试里问「上云的主要价值是什么」时，正确选项通常是「以可变成本替代固定成本」「提升敏捷性」「停止猜测容量」，而不是「一定更便宜」。\n\n**误区 2：把「敏捷性」和「弹性」搞混**\n\n敏捷性（agility）强调的是速度——更快地部署新资源、更快地试验新想法、更快地把产品推向市场。弹性（elasticity）强调的是容量伸缩——系统根据负载自动扩大或缩小资源。两者是不同的价值点。考试如果问「以下哪项描述了云的敏捷性？」选「几分钟内部署新资源」而不是「自动扩缩容量」。\n\n**误区 3：把「高可用」当成 AWS 列出的核心价值主张**\n\n高可用性（High Availability）是一个架构设计目标，属于可靠性支柱的范畴，但它不在 AWS 官方列出的六大云价值主张里。考试若问「以下哪些是 AWS 云的价值主张」，「高可用」通常不是正确选项——它更适合出现在 Well-Architected Framework 的考题里。\n\n#### 记忆要点\n\n- 六大价值主张口诀：**变成本、规模省、别猜量、快试错、别运维、全球飞**\n- CapEx = 买服务器（固定、前期、沉没）；OpEx = 云账单（可变、按用、灵活）\n- 「停止猜测容量」对应 Auto Scaling；「几分钟内全球部署」对应多 Region\n- 三种部署模型：公有云、私有云、混合云——看到「保留本地 + 用 AWS」= 混合云\n- AWS Outposts = 把 AWS 部署到你的机房 → 仍然是混合云\n- AWS 降价超过一百次 → 规模经济的体现\n\n---","figures":[{"id":"f06","title":"AWS 云六大价值主张","caption":"考点：给表述选对应价值点——「CapEx→OpEx」=①；「聚合用量降价」=②；「弹性伸缩」=③；「快速试验」=④；「免运维机房」=⑤；「就近部署全球」=⑥","html":"<svg viewBox=\"0 0 640 365\" style=\"width:100%;max-width:640px;display:block;margin:0 auto\">\n  <text x=\"320\" y=\"28\" font-size=\"14\" font-weight=\"700\" fill=\"#1e1b4b\" text-anchor=\"middle\">AWS 云六大价值主张（高频变体考点）<\/text>\n  <rect x=\"15\" y=\"48\" width=\"298\" height=\"94\" rx=\"10\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/>\n  <rect x=\"28\" y=\"62\" width=\"24\" height=\"24\" rx=\"6\" fill=\"#7c3aed\"/>\n  <text x=\"40\" y=\"79\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1<\/text>\n  <text x=\"64\" y=\"79\" font-size=\"12.5\" font-weight=\"700\" fill=\"#3730a3\">可变成本替代固定投入<\/text>\n  <text x=\"30\" y=\"106\" font-size=\"10.5\" fill=\"#1e1b4b\">前期大额采购（CapEx）→ 按用量付费（OpEx）<\/text>\n  <text x=\"30\" y=\"126\" font-size=\"10.5\" fill=\"#1e1b4b\">账单跟着业务走，不做沉没成本<\/text>\n  <rect x=\"327\" y=\"48\" width=\"298\" height=\"94\" rx=\"10\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/>\n  <rect x=\"340\" y=\"62\" width=\"24\" height=\"24\" rx=\"6\" fill=\"#7c3aed\"/>\n  <text x=\"352\" y=\"79\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">2<\/text>\n  <text x=\"376\" y=\"79\" font-size=\"12.5\" font-weight=\"700\" fill=\"#3730a3\">大规模经济效益<\/text>\n  <text x=\"342\" y=\"106\" font-size=\"10.5\" fill=\"#1e1b4b\">聚合全球数百万客户用量<\/text>\n  <text x=\"342\" y=\"126\" font-size=\"10.5\" fill=\"#1e1b4b\">采购议价强，单价持续下降<\/text>\n  <rect x=\"15\" y=\"152\" width=\"298\" height=\"94\" rx=\"10\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/>\n  <rect x=\"28\" y=\"166\" width=\"24\" height=\"24\" rx=\"6\" fill=\"#7c3aed\"/>\n  <text x=\"40\" y=\"183\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">3<\/text>\n  <text x=\"64\" y=\"183\" font-size=\"12.5\" font-weight=\"700\" fill=\"#3730a3\">停止猜测容量<\/text>\n  <text x=\"30\" y=\"210\" font-size=\"10.5\" fill=\"#1e1b4b\">Auto Scaling 弹性伸缩，随负载自动加减<\/text>\n  <text x=\"30\" y=\"230\" font-size=\"10.5\" fill=\"#1e1b4b\">买多了闲置、买少了崩盘，都不用猜<\/text>\n  <rect x=\"327\" y=\"152\" width=\"298\" height=\"94\" rx=\"10\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/>\n  <rect x=\"340\" y=\"166\" width=\"24\" height=\"24\" rx=\"6\" fill=\"#7c3aed\"/>\n  <text x=\"352\" y=\"183\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">4<\/text>\n  <text x=\"376\" y=\"183\" font-size=\"12.5\" font-weight=\"700\" fill=\"#3730a3\">提升速度与敏捷性<\/text>\n  <text x=\"342\" y=\"210\" font-size=\"10.5\" fill=\"#1e1b4b\">几分钟建好环境，试验不行就关掉重来<\/text>\n  <text x=\"342\" y=\"230\" font-size=\"10.5\" fill=\"#1e1b4b\">试错成本接近零，加速创新<\/text>\n  <rect x=\"15\" y=\"256\" width=\"298\" height=\"94\" rx=\"10\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/>\n  <rect x=\"28\" y=\"270\" width=\"24\" height=\"24\" rx=\"6\" fill=\"#7c3aed\"/>\n  <text x=\"40\" y=\"287\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">5<\/text>\n  <text x=\"64\" y=\"287\" font-size=\"12.5\" font-weight=\"700\" fill=\"#3730a3\">停止在数据中心上花钱<\/text>\n  <text x=\"30\" y=\"314\" font-size=\"10.5\" fill=\"#1e1b4b\">上架/布线/散热/物理安全=无差异化重活<\/text>\n  <text x=\"30\" y=\"334\" font-size=\"10.5\" fill=\"#1e1b4b\">交给 AWS，工程师专注业务价值<\/text>\n  <rect x=\"327\" y=\"256\" width=\"298\" height=\"94\" rx=\"10\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/>\n  <rect x=\"340\" y=\"270\" width=\"24\" height=\"24\" rx=\"6\" fill=\"#7c3aed\"/>\n  <text x=\"352\" y=\"287\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">6<\/text>\n  <text x=\"376\" y=\"287\" font-size=\"12.5\" font-weight=\"700\" fill=\"#3730a3\">几分钟内全球部署<\/text>\n  <text x=\"342\" y=\"314\" font-size=\"10.5\" fill=\"#1e1b4b\">多 Region 就近部署，降低访问延迟<\/text>\n  <text x=\"342\" y=\"334\" font-size=\"10.5\" fill=\"#1e1b4b\">一套代码覆盖全球，自建周期以年计<\/text>\n<\/svg>"}]},{"h":"识别 AWS 云的设计原则","body":"> 本域对应官方考纲任务声明 1.1–1.4：云的价值、设计原则、迁移、云经济学。\n\n#### 本节定位\n\n本节对应考纲任务声明 1.2「识别 AWS 云的设计原则」。这一节的核心知识锚点是 AWS Well-Architected Framework（良好架构框架）及其六大支柱。学完之后你应该能做到以下几件事：\n\n- 不看书默写六大支柱的名称和核心关注点。\n- 给定一个场景描述能判断它属于哪个支柱。\n- 清楚区分「设计原则」和「支柱」这两个层次的概念。\n- 知道 Well-Architected Tool 是什么、干什么用。\n\n#### AWS Well-Architected Framework 是什么\n\n一句话概括：AWS 把多年服务全球客户的经验总结成了一套架构评审方法论，叫做 AWS Well-Architected Framework（简称 WAF 或良好架构框架）。它不是一个软件产品，也不是一个要花钱买的服务，而是一套免费的方法论文档加配套工具。它的作用是帮助架构师和开发者在构建云上系统时，从安全、可靠、高效、省钱、可持续等多个维度做出有据可依的权衡决策，而不是凭感觉拍脑袋。（来源：official-wa-framework.md，概述段：\"helps you understand the pros and cons of decisions you make while building systems on AWS\"）\n\n框架的核心骨架是**六大支柱（Six Pillars）**。每个支柱下面有若干条设计原则（Design Principles）和若干个最佳实践领域（Best Practice Areas）。六个支柱之间是平行关系，没有优先级高低之分——具体项目中你需要根据业务需求在支柱之间做取舍和平衡。\n\n#### 六大支柱逐个讲透\n\n| 支柱 | 英文名称 | 一句话定位 | 设计原则条数 | 最佳实践领域 | 考试记忆口诀 |\n| --- | --- | --- | --- | --- | --- |\n| 卓越运营 | Operational Excellence | 把运维动作变成代码，持续迭代改进流程 | 8 条 | 组织/准备/运营/演进 | 「运维变代码」 |\n| 安全性 | Security | 保护数据、系统和资产，做到最小权限和全程加密 | 7 条 | 安全基础/身份/检测/基础设施/数据/事件响应/应用安全 | 「最小权限 + 全程加密」 |\n| 可靠性 | Reliability | 系统出故障能自愈，按需自动获取资源 | 5 条 | 基础/架构/变更管理/故障管理 | 「挂了能自愈」 |\n| 性能效率 | Performance Efficiency | 用对资源类型和规模，不浪费也不欠配 | 5 条 | 架构选择/计算/数据/网络/流程 | 「合适的活用合适的机器」 |\n| 成本优化 | Cost Optimization | 不为用不到的资源花冤枉钱 | 5 条 | 财务管理/感知/资源/供需/持续优化 | 「不为闲置买单」 |\n| 可持续性 | Sustainability | 降低工作负载的能耗和碳足迹 | 6 条 | 区域选择/需求对齐/架构/数据/硬件/流程 | 「少开机器省碳」 |\n\n（来源：official-wa-framework.md，六支柱各节设计原则逐条列出，计数分别为 8/7/5/5/5/6，共 36 条设计原则）\n\n下面逐个支柱展开讲，重点放在考试频繁考到的设计原则和判题线索上。\n\n**卓越运营（Operational Excellence）**\n\n这个支柱关注的核心问题是：怎么把日常运维工作做好，而且越做越好？它的八条设计原则里，考试最爱考以下几条：\n\n「频繁、小规模、可逆的变更」（Make frequent, small, reversible changes）——把大版本发布拆成小批量迭代，每次改动范围小、出了问题容易回滚。这条原则和 DevOps 实践高度相关。考试看到「自动化部署」「小批量发布」「可逆变更」就选卓越运营。\n\n「预见故障」（Anticipate failure）——主动做故障演练，理解系统在各种异常场景下的行为。看到「混沌工程」「故障注入测试」→ 卓越运营。\n\n「使用托管服务」（Use managed services）——用 AWS 的托管服务（如 Amazon RDS 代替自建数据库）减轻运维负担。看到「减少运维工作量」→ 可以是卓越运营。\n\n（来源：official-wa-framework.md，Pillar 1 设计原则第 4、6、8 条）\n\n**安全性（Security）**\n\n这个支柱关注的核心问题是：怎么保护你的数据、系统和资源不被未授权访问、泄露或破坏？七条设计原则里，最重要的三条：\n\n「实施强身份基础」（Implement a strong identity foundation）——落实最小权限原则，每个用户和服务只给完成工作所需的最少权限；消除对长期静态凭证的依赖，改用临时凭证和角色。这条是考试安全类题目的第一抓手。\n\n「在所有层级应用安全」（Apply security at all layers）——不只在网络边界做防护，而是从网络边缘、VPC、负载均衡器、每台实例、操作系统到应用代码，每一层都加安全控制，形成纵深防御。\n\n「保护传输中和静态数据」（Protect data in transit and at rest）——数据在网络上传输时加密，存储在磁盘上时也加密。分类数据敏感级别，按级别选择加密和访问控制策略。\n\n考试里看到「最小权限」「纵深防御」「数据加密」「审计追溯」→ 安全性支柱。（来源：official-wa-framework.md，Pillar 2 设计原则第 1、3、5 条）\n\n**可靠性（Reliability）**\n\n这个支柱关注的核心问题是：系统能不能持续正常工作？出了故障能不能自动恢复？五条设计原则中最重要的两条：\n\n「自动从故障中恢复」（Automatically recover from failure）——监控关键业务指标（KPI），当指标超过阈值时自动触发恢复动作。注意：这里监控的应该是业务指标（比如订单处理延迟），而不是技术指标（比如 CPU 利用率）。考试里看到「从服务中断中自动恢复」→ 可靠性。\n\n「停止猜测容量」（Stop guessing capacity）——根据实际需求自动伸缩资源，而不是提前猜一个数字。这条原则同时也是前面讲过的 AWS 云价值主张之一，考试里两种语境都可能出现。\n\n「水平扩展」（Scale horizontally）——用多个小资源替代一个大资源，减少单点故障对整体的影响。看到「多个小实例 + 负载均衡」→ 可靠性。\n\n关键数字：99.99% 可用性（俗称\"four nines\"）= 每年允许停机时间约 52.6 分钟。99.999%（\"five nines\"）= 每年约 5.26 分钟。可靠性设计应最大化 MTBF（平均故障间隔）同时最小化 MTTR（平均恢复时间）。（来源：official-wa-framework.md，Pillar 3 关键数字）\n\n**性能效率（Performance Efficiency）**\n\n这个支柱关注的核心问题是：你选的资源类型和规模合不合适？五条设计原则中考试最爱考的：\n\n「使用无服务器架构」（Use serverless architectures）——去掉管理物理服务器的运维负担，比如用 AWS Lambda 替代 EC2 跑事件驱动型任务。\n\n「几分钟内全球部署」（Go global in minutes）——在全球多个 Region 部署应用，降低用户延迟。\n\n「更频繁地实验」（Experiment more often）——云上资源是虚拟的、可自动化的，可以快速做 A/B 测试，用不同实例类型和配置做对比。\n\n考试看到「选对实例类型」「无服务器」「全球低延迟」→ 性能效率。（来源：official-wa-framework.md，Pillar 4 设计原则第 2、3、4 条）\n\n**成本优化（Cost Optimization）**\n\n这个支柱关注的核心问题是：怎么避免浪费，用最少的钱办最多的事？五条设计原则中最重要的：\n\n「采用消费模型」（Adopt a consumption model）——只为你用到的资源付费。官方给了一个有意思的数字：开发和测试环境通常只在工作日的 8 小时使用，如果非工作时间停掉这些环境，潜在节约高达 75%（一周实际使用 40 小时 vs 一周总共 168 小时）。（来源：official-wa-framework.md，Pillar 5 设计原则第 2 条及关键数字）\n\n「停止在无差异化重活上花钱」（Stop spending money on undifferentiated heavy lifting）——AWS 负责机房运营、硬件维护、操作系统补丁这些对每个企业都一样的工作。你集中精力做你的核心业务。\n\n考试看到「关掉闲置资源」「用 Savings Plans 降低长期成本」「分析哪些资源没在用」→ 成本优化。\n\n**可持续性（Sustainability）**\n\n这个支柱关注的核心问题是：怎么降低你的云工作负载对环境的影响？六条设计原则中最重要的：\n\n「最大化利用率」（Maximize utilization）——两台负载 30% 的主机不如一台负载 60% 的主机节能，因为每台主机都有固定的基线功耗。尽量减少闲置资源，提高每台机器的利用率。（来源：official-wa-framework.md，Pillar 6 设计原则第 3 条）\n\n考试里看到「碳足迹」「能源效率」「减少环境影响」→ 可持续性。这个支柱是相对较新的（2021 年加入），考试题目相对少但不能不会。\n\n[[fig:f03]]\n\n#### 设计原则 vs 支柱：考试最常见的混淆点\n\n支柱是六个大维度，设计原则是每个支柱下面的具体准则。考试喜欢在这两个层次之间设置陷阱：\n\n- **松耦合（Loose Coupling）** = 设计原则，不是支柱。松耦合的意思是组件之间低依赖、一个挂了不会拖垮全部。它属于架构设计层面的原则，在卓越运营（小规模可逆变更依赖松耦合架构）和可靠性（减少级联故障）中都有体现，但本身不是支柱。\n- **停止猜测容量** = 同时出现在两个地方——它是 AWS 云的价值主张之一，也是可靠性支柱下的一条设计原则。两边考试都可能出。\n- **弹性 ≠ 可靠性**。弹性（Elasticity）侧重资源自动伸缩（能力），可靠性（Reliability）侧重系统从故障中恢复（韧性）。弹性是实现可靠性的手段之一，但不等于可靠性本身。\n\n| 易混概念 | 实际归属 | 判题线索 |\n| --- | --- | --- |\n| 松耦合（Loose Coupling） | 设计原则 | 「组件独立、互不拖累」 |\n| 停止猜测容量 | 价值主张 + 可靠性设计原则 | 「Auto Scaling」「按需伸缩」 |\n| 弹性（Elasticity） | 特性/能力 | 「资源自动变大变小」 |\n| 可靠性（Reliability） | 支柱 | 「故障自愈」「从中断中恢复」 |\n| 高可用（High Availability） | 架构目标 | 「最大化正常运行时间」 |\n\n#### Well-Architected Tool\n\nAWS 提供了一个免费的服务叫 **AWS Well-Architected Tool**。你可以在 AWS 管理控制台中使用它，对照六大支柱逐条回答自查问题。完成后工具会自动生成一份改进建议报告，按风险级别排列——高风险的改进项排在最前面，帮你决定先做什么。考试偶尔会问「哪个 AWS 工具帮助你评估架构是否遵循 Well-Architected 最佳实践？」答案就是它。\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\nSaaS 创业公司「票易通」用 Well-Architected Framework 做了一次架构全面自查。结果发现三个可以立刻改进的点：\n\n1. 发布还在用手工脚本，改成 AWS CodePipeline 自动化流水线（对应卓越运营支柱——把运维变代码）。\n2. 数据库只有一份在单个可用区，加了跨可用区只读副本（对应可靠性支柱——从故障中恢复）。\n3. 用 AWS Compute Optimizer 发现有几台实例常年 CPU 利用率只有 20%，调小了实例规格（对应成本优化支柱——停止非工作时间环境可节约 75%）。\n\n每一项改进都有明确的支柱归属，而不是凭感觉优化。（来源：official-wa-framework.md，Pillar 5 关键数字）\n\n#### 常见误区与易错点\n\n**误区 1：以为六大支柱有优先级排序**\n\n六大支柱之间是平行关系——没有「安全比成本重要」或「可靠比性能重要」之说。实际项目中你需要在支柱之间做权衡。比如为了安全性增加的加密层可能对性能有轻微影响，为了可靠性做的多副本存储会增加存储成本。Well-Architected Framework 的价值就在于帮你做出有据可依的权衡，而不是教条地追求某一个支柱。\n\n**误区 2：把可持续性支柱和成本优化支柱搞混**\n\n两者确实有重叠区域——关掉闲置资源既省钱又环保。但判题时看关键词就能区分：提到「碳排放」「能源效率」「环境影响」→ 可持续性；提到「预算」「省钱」「投资回报 ROI」→ 成本优化。\n\n**误区 3：「全球基础设施」等于「可靠性」**\n\n可靠性支柱讲的是系统自愈和故障恢复能力。AWS 全球基础设施（多 Region、多可用区）是实现可靠性的手段之一（跨 AZ 部署可以避免单点故障），但不等于可靠性支柱本身。同样，全球基础设施也和性能效率支柱有关（离用户更近=延迟更低）。\n\n#### 记忆要点\n\n- 六支柱必须能默写：卓越运营、安全性、可靠性、性能效率、成本优化、可持续性——口诀：**运安可性成持**\n- 36 条设计原则不需要全背，但每个支柱的核心原则要能复述\n- 松耦合 = 设计原则，不是支柱\n- 「停止猜测容量」跨两个领域：价值主张 + 可靠性设计原则\n- 99.99% 可用性 = 每年约 52.6 分钟停机（four nines）\n- Well-Architected Tool = 免费架构评审工具（在控制台里用）\n- 成本优化关键数字：关掉非工作时间环境，潜在节约 75%\n\n---","figures":[{"id":"f03","title":"AWS Well-Architected 六大支柱","caption":"考点：给场景判断属于哪个支柱；六支柱平行无优先级，按业务需求权衡取舍","html":"<svg viewBox=\"0 0 640 340\" style=\"width:100%;max-width:640px;display:block;margin:0 auto\">\n  <text x=\"320\" y=\"26\" font-size=\"14\" font-weight=\"700\" fill=\"#1e1b4b\" text-anchor=\"middle\">AWS Well-Architected 六大支柱 \"20\" y=\"186\" width=\"185\" height=\"128\" rx=\"10\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/>\n  <text x=\"112\" y=\"214\" font-size=\"13\" font-weight=\"700\" fill=\"#3730a3\" text-anchor=\"middle\">性能效率<\/text>\n  <text x=\"112\" y=\"230\" font-size=\"9\" fill=\"#6d28d9\" text-anchor=\"middle\">Performance Efficiency<\/text>\n  <text x=\"112\" y=\"254\" font-size=\"10.5\" fill=\"#1e1b4b\" text-anchor=\"middle\">选对资源类型规模<\/text>\n  <text x=\"112\" y=\"270\" font-size=\"10.5\" fill=\"#1e1b4b\" text-anchor=\"middle\">不浪费也不欠配<\/text>\n  <text x=\"112\" y=\"294\" font-size=\"9.5\" fill=\"#4338ca\" text-anchor=\"middle\">合适活用合适机器<\/text>\n  <rect x=\"225\" y=\"186\" width=\"185\" height=\"128\" rx=\"10\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/>\n  <text x=\"317\" y=\"214\" font-size=\"13\" font-weight=\"700\" fill=\"#3730a3\" text-anchor=\"middle\">成本优化<\/text>\n  <text x=\"317\" y=\"230\" font-size=\"9\" fill=\"#6d28d9\" text-anchor=\"middle\">Cost Optimization<\/text>\n  <text x=\"317\" y=\"254\" font-size=\"10.5\" fill=\"#1e1b4b\" text-anchor=\"middle\">不为闲置买单<\/text>\n  <text x=\"317\" y=\"270\" font-size=\"10.5\" fill=\"#1e1b4b\" text-anchor=\"middle\">按需付费+弹性伸缩<\/text>\n  <text x=\"317\" y=\"294\" font-size=\"9.5\" fill=\"#4338ca\" text-anchor=\"middle\">账单监控·资源治理<\/text>\n  <rect x=\"430\" y=\"186\" width=\"185\" height=\"128\" rx=\"10\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/>\n  <text x=\"522\" y=\"214\" font-size=\"13\" font-weight=\"700\" fill=\"#3730a3\" text-anchor=\"middle\">可持续性<\/text>\n  <text x=\"522\" y=\"230\" font-size=\"9\" fill=\"#6d28d9\" text-anchor=\"middle\">Sustainability<\/text>\n  <text x=\"522\" y=\"254\" font-size=\"10.5\" fill=\"#1e1b4b\" text-anchor=\"middle\">少开机器省碳<\/text>\n  <text x=\"522\" y=\"270\" font-size=\"10.5\" fill=\"#1e1b4b\" text-anchor=\"middle\">降低能耗与碳足迹<\/text>\n  <text x=\"522\" y=\"294\" font-size=\"9.5\" fill=\"#4338ca\" text-anchor=\"middle\">负载与需求对齐<\/text>\n<\/svg>"}]},{"h":"理解迁移到 AWS 云的价值与策略","body":"> 本域对应官方考纲任务声明 1.1–1.4：云的价值、设计原则、迁移、云经济学。\n\n#### 本节定位\n\n本节对应考纲任务声明 1.3「理解 AWS 云迁移的好处与迁移策略」。CLF-C02 新增了 AWS Cloud Adoption Framework（CAF）的内容，这是和旧版 CLF-C01 考试的一个重要区别。学完之后你应该能回答以下问题：AWS CAF 的六个视角分别对应什么角色，管什么事？7R 迁移策略各自适用什么场景，Rehost 和 Replatform 怎么区分？MAP 的三阶段是什么，每个阶段做什么？\n\n#### 为什么要迁移\n\n企业从本地数据中心迁移到云上不是为了赶时髦。推动迁移的核心动力通常是以下几个：\n\n- **缩短产品上市时间**：自建基础设施的部署周期太长，上云后几分钟就能搭好环境，研发速度大幅提升；\n- **降低 TCO**：把硬件采购、机房租赁、运维人力等隐性成本算进去之后，很多场景下云的总拥有成本更低；\n- **获得全球部署能力**：自建覆盖全球需要巨额投资，用 AWS 只需选个 Region 部署即可；\n- **摆脱运维负担**：不再需要自己换硬盘、打补丁、维护空调和消防系统。\n\n但迁移不是「把机器搬过去就完了」——你需要方法论来组织这项复杂工程。AWS 提供了两套方法论。\n\n#### 方法论一：AWS Cloud Adoption Framework（AWS CAF）\n\nAWS CAF 是一套迁移准备框架。它不教你怎么搬服务器（那是迁移工具干的事），而是帮你回答「组织层面，我们准备好迁移了吗？」这个问题。CAF 从六个视角（Perspective）来审视迁移准备工作，每个视角对应一类干系人和一组需要具备的能力。\n\n| 视角 | 英文 | 核心关注点 | 典型能力举例 | 对应角色 |\n| --- | --- | --- | --- | --- |\n| 业务 | Business | 云投资如何支撑业务成果 | 财务管理、战略管理、创新管理 | CEO / CFO / 财务团队 |\n| 人员 | People | 团队能力和组织文化准备 | 转型管理、人才管理、变革领导力 | HR / 培训团队 / CTO |\n| 治理 | Governance | 转型方向与风险控制 | 项目治理、风险管理、许可证管理 | CIO / 合规团队 |\n| 平台 | Platform | 技术底座和架构设计 | 平台架构、数据工程、CI/CD、Landing Zone | CTO / 架构师团队 |\n| 安全 | Security | 信息安全与合规保障 | 身份管理、威胁检测、基础设施保护、数据保护 | CISO / 安全团队 |\n| 运营 | Operations | 迁移后的日常运转 | 可观测性、事件管理、变更管理、补丁管理 | IT 运维团队 |\n\n考试判题诀窍——看到以下关键词时对应的视角：\n\n- 「业务案例」「ROI」「投资回报」→ 业务视角\n- 「团队培训」「员工技能差距」「变革管理」→ 人员视角\n- 「风险评估」「合规策略」「许可证盘点」→ 治理视角\n- 「Landing Zone」「多账号架构」「网络设计」→ 平台视角\n- 「数据加密」「身份联邦」「渗透测试」→ 安全视角\n- 「监控报警」「自动化运维」「值班流程」→ 运营视角\n\n**各视角的关键能力详解**\n\n业务视角不只是算钱——它还包括创新管理和产品管理。迁移上云之后，业务团队应该思考「有了云的能力，我们能做哪些以前做不到的事？」比如利用 AI/ML 服务做智能推荐、用全球 Region 快速拓展海外市场。这些属于业务视角的「数字化转型」能力范畴。\n\n人员视角最容易被忽视。很多迁移项目技术上成功了，但因为团队不适应云上的工作方式（比如从手工运维转向基础设施即代码、从瀑布开发转向敏捷迭代）而效果打折。CAF 建议在迁移之前就做好技能差距评估和培训计划。\n\n治理视角涉及的不只是 IT 治理——在大型企业中，还涉及财务治理（谁为哪些云资源买单？如何做跨部门成本分摊？）和数据治理（哪些数据可以上云？如何满足不同国家的数据驻留要求？）。\n\n平台视角的核心产出是 **Landing Zone**——一个预配置好的、安全的、多账号的 AWS 起步环境。AWS 提供 **AWS Control Tower** 服务来自动化搭建 Landing Zone。考试偶尔会问「什么是 Landing Zone」或「哪个服务帮助建立多账号环境」，答案分别是「安全的多账号起步环境」和「AWS Control Tower」。\n\n安全视角除了传统的身份和数据保护，还特别强调「检测」能力——即使做了最好的预防措施，仍然需要有能力检测到异常行为。AWS GuardDuty、AWS Security Hub 等服务对应这个能力。\n\n运营视角关注的是「迁移后谁来管」这个问题。如果云上的监控、告警、事件响应流程没有提前定义好，迁移完成后系统出了问题会手忙脚乱。CAF 建议在动员阶段就设计好运营模型和值班流程。\n\n#### 方法论二：7R 迁移策略\n\nAWS 把迁移路径分成七种策略，简称 7R。考试重点考前四种，后三种了解即可。\n\n| 策略 | 英文 | 一句话说明 | 代码改动量 | 速度 | 云原生程度 | 考试口诀 |\n| --- | --- | --- | --- | --- | --- | --- |\n| 重新托管 | Rehost | 原封不动搬到 EC2，零代码改动 | 无 | 最快 | 最低 | Lift-and-Shift |\n| 重新平台化 | Replatform | 做少量改动以利用云服务 | 少量 | 较快 | 中等 | Lift-Tinker-Shift |\n| 重新架构 | Refactor / Re-architect | 利用云原生能力重写或大改 | 大量 | 最慢 | 最高 | 重写 |\n| 重新购买 | Repurchase | 换成现成的 SaaS 产品 | 不适用 | 快 | 取决于SaaS | 换产品 |\n| 保留 | Retain | 暂时不动，留在原地 | 无 | 即时 | 无 | 先不管 |\n| 退役 | Retire | 发现没人用了，直接关掉 | 无 | 即时 | 无 | 扔掉 |\n| 重新定位 | Relocate | 把整个虚拟化平台搬到 AWS | 无 | 较快 | 低 | 搬平台 |\n\n**Rehost 和 Replatform 怎么区分？** 核心区别就一个字——「改不改」。Rehost 是零改动，把服务器原样搬到 EC2 上跑，操作系统、应用、配置全都不变。Replatform 会做少量改动来利用云托管服务——最常见的例子是把自建 MySQL 数据库从 EC2 搬到 Amazon RDS，数据库引擎没变（还是 MySQL），但托管方式变了（不用自己打补丁和做备份了）。考试非常爱考这个区别。\n\n**什么时候选 Refactor？** 当你想要深度利用云原生能力（比如把单体应用拆成微服务、用 Lambda 做事件驱动）并且愿意投入时间和资源做大幅重写的时候。Refactor 速度最慢、投入最大，但云原生程度最高、长期收益最大。考试会设这样的场景：「公司想要充分利用 AWS 无服务器能力，愿意重新设计应用架构」→ 选 Refactor。\n\n#### AWS Migration Acceleration Program（MAP）\n\nMAP 是 AWS 支持企业进行大规模迁移的一项加速项目。它基于三阶段方法论（来源：official-map-2-0-guide.md，MAP 2.0 概述及 §1.1–§1.3）：\n\n1. **评估（Assess）**：评估组织当前的云运营准备度，确定期望的业务成果，开发迁移业务案例。AWS 提供 **Migration Evaluator**（免费服务）帮助企业快速创建方向性业务案例和 TCO 分析。\n2. **动员（Mobilize）**：创建详细的迁移计划，构建基线环境（Landing Zone——一个安全的、多账号的起步架构），培养团队的云技能，解决评估阶段识别出的差距。\n3. **迁移与现代化（Migrate & Modernize）**：逐个应用进行设计、迁移和验证。这个阶段会用到实际的迁移工具，如 AWS Application Migration Service（MGN）做服务器迁移、AWS Database Migration Service（DMS）做数据库迁移。\n\n#### 关键迁移工具对照表\n\n| 工具名称 | 用途 | 对应迁移阶段 |\n| --- | --- | --- |\n| **Migration Evaluator** | 创建方向性业务案例和 TCO 分析（免费） | 评估阶段 |\n| **AWS Migration Hub** | 统一跟踪所有迁移工作流的进度 | 全阶段 |\n| **AWS Application Migration Service（MGN）** | 把本地或其他云的服务器迁移到 AWS | 迁移阶段 |\n| **AWS Database Migration Service（DMS）** | 数据库迁移，支持 20+ 数据库引擎 | 迁移阶段 |\n| **AWS Schema Conversion Tool（SCT）** | 数据库 schema 转换（如 Oracle → PostgreSQL） | 迁移阶段 |\n\n（来源：official-map-2-0-guide.md，§11 迁移工具生态表）\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n制造企业「精密达」有 200 台本地服务器，机房租约明年到期。IT 总监带领团队按 AWS CAF 做了准备评估：\n\n1. 业务视角——算清了 TCO，三年节约 35%（来自 Migration Evaluator 的估算）。\n2. 人员视角——发现运维团队缺乏云技能，安排了为期两个月的 AWS 培训。\n3. 平台视角——架构师设计了基于 AWS Control Tower 的 Landing Zone（多账号、日志集中、安全基线）。\n\n然后按 7R 策略给 200 台服务器分类：\n\n1. ERP 系统用 Rehost 先搬到 EC2（快速止血，机房租约到期）。\n2. 自建 MySQL 集群用 Replatform 迁到 Amazon RDS（省运维但不改应用层）。\n3. 老旧的报表系统直接 Retire（没人在用了）。\n4. 用了十年的自研 HR 系统换成 SaaS 版（Repurchase）。\n\n整个迁移项目周期六个月，比从零自建新机房快了两年。\n\n#### 常见误区与易错点\n\n**误区 1：以为 AWS CAF 和 Well-Architected Framework 是同一套东西**\n\n考试最爱在这里设陷阱。CAF 是迁移准备方法论——告诉你迁移之前组织层面要准备什么，按角色分六个视角。Well-Architected Framework 是架构评审方法论——告诉你建好的系统好不好，按技术维度分六个支柱。两者名字里都有「框架」「六个」，但完全是不同的东西。\n\n| 对比维度 | AWS CAF | Well-Architected Framework |\n| --- | --- | --- |\n| 目的 | 迁移准备评估 | 架构质量评审 |\n| 核心单元 | 6 个视角（Perspective） | 6 个支柱（Pillar） |\n| 按什么分 | 按角色/干系人 | 按技术维度 |\n| 什么时候用 | 迁移前 | 架构设计时/运行后 |\n\n**误区 2：Rehost 和 Replatform 分不清**\n\n反复强调：Rehost 是零代码改动原样搬；Replatform 是做少量改动以利用云服务。考试经常给你一个场景「把数据库从自建 MySQL 迁移到 Amazon RDS」——这是 Replatform，不是 Rehost。因为虽然引擎没换，但你从自己管运维变成了 AWS 帮你管运维，这算「小改」。\n\n**误区 3：以为 MAP 就是打标签**\n\nMAP 2.0 项目中确实有一个环节是给迁移后的资源打 `map-migrated` 标签来追踪和申请 AWS 信用额度，但这只是 MAP 的一个操作步骤，不是 MAP 的全部。MAP 是一个完整的评估→动员→迁移与现代化的三阶段加速项目。\n\n#### 记忆要点\n\n- AWS CAF 六视角：**业人治平安运**（业务/人员/治理/平台/安全/运营）\n- 7R 策略前四个最重要：Rehost（直接搬）、Replatform（小改搬）、Refactor（重写）、Repurchase（换产品）\n- Rehost = 零改动；Replatform = 少量改动；Refactor = 大改 → 考试必考区别\n- MAP 三阶段：评估 → 动员 → 迁移与现代化\n- CAF ≠ Well-Architected：前者按角色分视角（迁移准备），后者按技术分支柱（架构评审）\n- Migration Evaluator = 免费 TCO 评估工具\n- AWS MGN = 服务器迁移；AWS DMS = 数据库迁移\n\n---"},{"h":"理解云经济学概念","body":"> 本域对应官方考纲任务声明 1.1–1.4：云的价值、设计原则、迁移、云经济学。\n\n#### 本节定位\n\n本节对应考纲任务声明 1.4「理解云经济学概念」。学完之后你应该能回答以下问题：什么是 TCO？CapEx 和 OpEx 的本质区别是什么？AWS 的计费三大驱动力分别是哪三个？On-Demand / Savings Plans / Reserved Instances / Spot 四种定价模型各自适合什么场景？什么是合并计费？AWS 有哪些成本管理工具？\n\n#### CapEx vs OpEx：云经济学的基石\n\n这是整个云经济学里最基础、出现频率最高的考点。每次做 CLF 模拟题几乎都会碰到。\n\n**资本支出（Capital Expenditure, CapEx）**：一次性购买长期资产的支出。传统 IT 里的典型 CapEx 包括：购买服务器和网络设备、租用或自建机房、购买软件许可证（买断型）。CapEx 的特征是前期投入大、资产需要折旧（通常 3-5 年）、一旦花了就是沉没成本（哪怕服务器闲着也不能退）。在财务报表上，CapEx 计入资产负债表。\n\n**运营支出（Operating Expenditure, OpEx）**：日常运营中持续发生的支出。云计算账单就是 OpEx——这个月用了多少计算和存储资源，付多少钱。OpEx 的特征是没有大额前期投入、金额随业务量波动、不需要也不产生资产折旧。在财务报表上，OpEx 计入利润表。\n\n上云的财务本质就是**把 CapEx 转化为 OpEx**。这不仅仅是记账科目的变化——它意味着企业不再需要为「未来三年可能用到」的容量提前买单，而是为「这个月实际用到」的容量付费。这让企业的现金流更可控，财务弹性更大。\n\n#### 总拥有成本（TCO）分析\n\n**TCO（Total Cost of Ownership，总拥有成本）** 是评估上云经济性的标准方法。很多人在比较云和自建的成本时，只拿云账单和服务器采购价做对比——这是不公平的。正确的做法是把自建方案的全部显性和隐性成本都算进来：\n\n| 成本类别 | 自建机房（全成本） | AWS 云 |\n| --- | --- | --- |\n| 硬件采购 | 服务器、交换机、防火墙、存储阵列、每 3-5 年换代一轮 | 无（按需付费） |\n| 机房设施 | 机柜租赁、电力、冷却系统、物理安全（门禁/监控/消防） | 无（AWS 承担） |\n| 网络 | 专线接入、冗余线路 | 按出站流量计费 |\n| 人力运维 | 7×24 运维团队、DBA、网络工程师、物理安全值班 | 大幅减少（托管服务分担大部分运维） |\n| 软件许可 | 操作系统、数据库、中间件的买断或订阅许可证 | 多数包含在云服务价格中 |\n| 扩容周期 | 采购+部署周期数周到数月；缩容几乎不可能（卖二手硬件？） | 几分钟扩容、随时缩容 |\n| 闲置浪费 | 必须按峰值配置，平时大量闲置（利用率通常 10%-30%） | 弹性伸缩，实际利用率可优化到 60%+ |\n| 容灾/备份 | 需要额外一套设备和站点 | 跨 AZ/跨 Region 原生支持 |\n\n考试常见问法：「哪个 AWS 工具帮助你评估从本地迁移到 AWS 的成本比较？」答案是 **AWS Pricing Calculator** 或者 **Migration Evaluator**。前者用来估算计划中的 AWS 工作负载成本，后者专门做本地→云的 TCO 对比分析。（来源：aws-billing-cost-management-savings-plans.md，§1.4 预算与规划中的 Pricing Calculator 描述）\n\n#### AWS 计费三大驱动力\n\nAWS 绝大多数服务的费用都由三个维度驱动（来源：aws-ec2-instance-types-billing.md，§二 AWS 计费三大核心驱动）：\n\n1. **计算（Compute）**：按小时或按秒计费（取决于具体服务和实例类型），从实例启动进入 running 状态开始计费，到停止或终止时停止计费\n2. **存储（Storage）**：按 GB/月计费，不管你有没有在读写，只要数据存在就收费\n3. **出站数据传输（Outbound Data Transfer, DTO）**：数据从 AWS 传到互联网按 GB 计费，传输量越大单价越低（分层折扣，即 tiered pricing）\n\n**两条重要的免费规则**：入站数据传输（数据从互联网传入 AWS）在绝大多数情况下**免费**；同一个 Region 内同一个可用区内的服务间数据传输通常也免费。考试非常喜欢在这里设陷阱——问「以下哪项会产生数据传输费用」，入站传输通常不是正确选项，但跨 Region 传输会产生费用。（来源：aws-ec2-instance-types-billing.md，§二\"入站和同Region内传输大多免费\"备注）\n\n#### EC2 四种主要定价模型深度对比\n\n| 定价模型 | 核心机制 | 最高折扣幅度 | 承诺要求 | 适用场景 | 关键风险 |\n| --- | --- | --- | --- | --- | --- |\n| **按需实例（On-Demand）** | 按秒或按小时计费，用多久付多久 | 无折扣（基准价） | 无 | 短期项目、不可预测的工作负载、测试环境 | 无风险，但单价最高 |\n| **Savings Plans** | 承诺每小时使用金额（$/小时），换取折扣 | EC2 Instance SP 最高 72%；Compute SP 最高 66% | 1 年或 3 年 | 长期稳定运行的计算负载 | 承诺期内无论是否用完都要付承诺金额 |\n| **预留实例（RI）** | 预购特定配置的容量 | 最高 75% | 1 年或 3 年 | 已知特定实例类型的长期稳定负载 | 锁定实例类型+区域，灵活性较低 |\n| **竞价实例（Spot）** | 竞价使用 AWS 空闲容量 | 最高 90% | 无长期承诺 | 可容忍中断的批处理、CI/CD、大数据分析 | AWS 可以 2 分钟通知回收 |\n\n（来源：aws-ec2-instance-types-billing.md，§三 EC2 主要计费模型表格）\n\n**Savings Plans 三种类型详解**（来源：aws-billing-cost-management-savings-plans.md，§三 Savings Plans 对比表）：\n\n| 类型 | 覆盖的服务 | 最高折扣 | 灵活性说明 |\n| --- | --- | --- | --- |\n| **Compute Savings Plans** | Amazon EC2 + AWS Fargate + AWS Lambda | 最高 66% | 最灵活：不限实例家族、大小、操作系统、租户、区域 |\n| **EC2 Instance Savings Plans** | Amazon EC2（特定实例家族） | 最高 72% | 需要指定实例家族和 Region，但大小和操作系统可灵活切换 |\n| **SageMaker AI Savings Plans** | Amazon SageMaker AI 实例 | 最高 64% | 不限实例家族、大小、组件、区域 |\n\n**Savings Plans vs Reserved Instances 怎么选？** 核心区别是承诺对象不同。Savings Plans 承诺的是「每小时花多少美元」（金额），RI 承诺的是「预购某种特定配置的容量」（配置）。因此 Savings Plans 灵活性更高——如果你的工作负载需要在不同实例类型、不同 Region 之间切换，Compute Savings Plans 是更好的选择。如果你确定要长期使用同一种实例家族且不会换 Region，EC2 Instance SP 或 RI 折扣更大。考试若问「最灵活的长期折扣方式」→ 选 Compute Savings Plans。（来源：Savings-Plans-中文.md，P5 对比表）\n\n#### 合并计费（Consolidated Billing）\n\n通过 AWS Organizations 可以把多个 AWS 账号的账单合并到一个管理账号下。三个核心好处（来源：aws-billing-cost-management-savings-plans.md，§四 合并计费）：\n\n1. **统一出账**：多个账号只出一张总账单，简化财务对账流程\n2. **聚合用量共享分层折扣**：多账号的 S3 存储、数据传输等用量汇总后可以触及更高的折扣阶梯，整体单价更低\n3. **跨账号共享 RI 和 Savings Plans**：一个账号买的折扣可以自动应用到组织内其他账号的匹配用量上\n\n合并计费**没有额外费用**——这一点考试可能会考。\n\n#### 成本管理工具速查表\n\n| 工具 | 一句话定位 | 核心用途 |\n| --- | --- | --- |\n| **AWS Cost Explorer** | 可视化成本分析 | 查看历史/当前成本趋势，按服务/账号/Tag 等维度切片分析，支持费用预测 |\n| **AWS Budgets** | 预算与告警 | 设定成本或用量预算，超过阈值时自动告警（邮件/SNS） |\n| **Cost Anomaly Detection** | 异常检测 | 自动识别费用异常波动并告警 |\n| **AWS Pricing Calculator** | 事前估算 | 用 On-Demand 价格估算计划工作负载的月度成本 |\n| **Cost Optimization Hub** | 优化建议汇总 | 集中展示所有优化建议：删除闲置资源、调整实例规格、购买 SP/RI |\n\n（来源：aws-billing-cost-management-savings-plans.md，§1.2–1.5 各工具描述）\n\n#### AWS Free Tier 的三种类型\n\nAWS 提供了 Free Tier（免费层），对初学者和小项目非常有价值。它分为三种：\n\n| 类型 | 说明 | 典型例子 |\n| --- | --- | --- |\n| **永久免费（Always Free）** | 不限时，只要不超过额度就一直免费 | AWS Lambda 每月 100 万次调用免费；Amazon DynamoDB 每月 25 GB 存储免费 |\n| **12 个月免费（Free for 12 months）** | 新账号注册后 12 个月内有效 | Amazon EC2 每月 750 小时 t2.micro/t3.micro；Amazon S3 每月 5 GB 标准存储 |\n| **短期试用（Trials）** | 特定服务的限时体验额度 | Amazon SageMaker 前 2 个月每月 250 小时 ml.t3.medium |\n\n考试考法通常是：「以下哪个服务包含在 AWS Free Tier 的 12 个月免费中？」或「以下哪种免费类型没有时间限制？」→ 答案分别是 EC2 t2.micro 和 Always Free。关键数字要记住：EC2 免费 750 小时/月、S3 免费 5 GB、Lambda 免费 100 万次调用/月。\n\n**注意**：Free Tier 额度超出后会自动按按需价格计费，不会提前警告（除非你自己设置了 AWS Budgets 告警）。这是很多新手踩坑的地方——忘记关掉实验环境，月底收到意外账单。AWS 提供了 Free Tier Usage Alert 功能，建议新账号一定要开启。\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n电商公司「快买」全年运行两类工作负载。\n\n1. 核心交易系统 7×24 运行，流量可预测（工作日是周末的 3 倍但不会断崖式波动）。\n2. 数据分析任务不定期批量跑，跑完即止，中断了重新提交即可。\n\nCTO 的定价策略组合：\n\n1. 核心交易系统用 Compute Savings Plans（承诺每小时 $50，获得 66% 折扣，未来如果换实例类型不影响折扣）。\n2. 数据分析用 Spot Instances（省最多 90%，用 AWS Batch 管理 Spot 中断和自动重试）。\n3. 临时项目测试环境用 On-Demand（要几台开几台，不用了就关）。\n\n三种模型搭配下来，整体账单比全 On-Demand 低约 55%。此外，「快买」的开发账号和生产账号都在同一个 AWS Organization 下，通过合并计费共享 Savings Plans 折扣。\n\n#### 常见误区与易错点\n\n**误区 1：以为 Spot 实例什么工作负载都能用**\n\nSpot 实例最大的风险是 AWS 可以在容量不足时 2 分钟通知回收你的实例。任何不能容忍中断的工作负载（在线交易、关系型数据库、有状态服务）都不适合 Spot。考试看到「容错」「可中断」「批处理」「无状态」→ Spot；看到「持续运行」「不可中断」「有状态」→ 不选 Spot。\n\n**误区 2：Savings Plans 和 Reserved Instances 搞混**\n\n最关键的区别要记住：Savings Plans 承诺金额（$/小时），RI 承诺配置（实例类型+区域+期限）。前者灵活性更高，后者折扣率略高。考试经常设这个对比题——问「以下哪种方式在更换实例类型时仍能保持折扣？」→ Compute Savings Plans。\n\n**误区 3：以为入站数据传输都免费就不会考**\n\n入站确实大多免费，但考试可能考「以下哪项产生数据传输费用」，答案是跨 Region 传输或出站传输——入站免费是排除法的依据。\n\n#### 记忆要点\n\n- CapEx = 买硬件（固定成本、提前投入、折旧 3-5 年）；OpEx = 云账单（可变成本、按用付费、无折旧）\n- 计费三大驱动力：**计算 + 存储 + 出站数据传输**（入站通常免费）\n- 四种定价模型折扣排序：Spot（~90%）> RI（~75%）> EC2 Instance SP（~72%）> Compute SP（~66%）> On-Demand（0%）\n- Savings Plans 承诺金额 → 灵活；RI 承诺配置 → 折扣大但不灵活\n- 问「最灵活」→ 选 Compute Savings Plans；问「折扣最大但可中断」→ 选 Spot\n- 合并计费三好处：统一出账 + 聚合折扣 + 共享 RI/SP，且零额外费用\n- TCO 分析要把自建方案的硬件+机房+人力+许可证+闲置浪费全算进来\n- Cost Explorer = 看账单历史；Budgets = 设预算告警；Pricing Calculator = 事前估价"}],"practice":[{"id":"Q6","d":1,"t":"single","q":"以下哪种观点包括 AWS 云采用框架（AWS CAF）的基础能力？","o":[{"l":"A","t":"可持续性"},{"l":"B","t":"性能效率"},{"l":"C","t":"治理"},{"l":"D","t":"可靠性"}],"a":["C"],"e":"治理是 AWS 云采用框架内的基础能力。它涉及建立和执行政策和控制措施，有效管理和优化云资源。","s":""},{"id":"Q22","d":1,"t":"single","q":"哪个选项是 AWS 全球基础设施的物理位置？","o":[{"l":"A","t":"AWS 数据同步"},{"l":"B","t":"AWS 区域"},{"l":"C","t":"Amazon Connect"},{"l":"D","t":"AWS 组织"}],"a":["B"],"e":"AWS 区域是 AWS 在世界范围内拥有多个数据中心的物理位置。它代表了一个地理区域，拥有多个可用区，以提供容错和稳定性。","s":""},{"id":"Q25","d":1,"t":"single","q":"一家公司正在运行一个单一的本地应用程序，该应用程序无法扩展且难以维护。该公司计划将应用程序迁移到 AWS 并将其拆分为微服务。该公司遵循 AWS 良好架构框架的哪个最佳实践？","o":[{"l":"A","t":"将功能测试作为 AWS 部署的一部分。"},{"l":"B","t":"使用自动化部署更改。"},{"l":"C","t":"将应用程序部署到多个位置。"},{"l":"D","t":"实现松散耦合的依赖关系。"}],"a":["D"],"e":"实现松散耦合的依赖关系是 AWS 良好架构框架的最佳实践，与公司将迁移到 AWS 并采用微服务架构的计划相一致。这种做法促进了服务的解耦，允许更大的灵活性、可扩展性和易于维护。","s":""},{"id":"Q30","d":1,"t":"multiple","q":"以下哪项是 AWS 良好架构框架的支柱？（选择两项。）","o":[{"l":"A","t":"可用性"},{"l":"B","t":"可靠性"},{"l":"C","t":"可扩展性"},{"l":"D","t":"响应式设计"},{"l":"E","t":"运营卓越"}],"a":["B","E"],"e":"AWS 良好架构框架围绕六个支柱构建：运营卓越、安全、可靠性、性能效率、成本优化和可持续性。在提供的选项中，可靠性和运营卓越是框架的两个支柱。 以下是文档中第 31 至 50 个问题翻译成中文的内容：","s":""},{"id":"Q45","d":1,"t":"single","q":"哪个 AWS 云采用框架 (AWS CAF) 能力属于人员视角？","o":[{"l":"A","t":"数据架构"},{"l":"B","t":"事件管理"},{"l":"C","t":"云流利度"},{"l":"D","t":"战略合作伙伴关系"}],"a":["C"],"e":"云流利度是 AWS 云采用框架内属于人员视角的能力。它侧重于确保组织内的个人具备有效使用云技术和服务所需的知识和技能。","s":""},{"id":"Q76","d":1,"t":"multiple","q":"以下哪些是 AWS 云的优势？（选择两项。）","o":[{"l":"A","t":"将可变成本转换为资本支出"},{"l":"B","t":"高规模经济"},{"l":"C","t":"几分钟内全球启动"},{"l":"D","t":"专注于管理硬件基础设施"},{"l":"E","t":"过度配置以确保容量"}],"a":["B","C"],"e":"AWS 云的优势包括高规模经济 (B) 和几分钟内全球启动 (C)。这些优势允许企业利用 AWS 的大规模基础设施实现成本节省，并在短时间内在全球部署应用程序和资源，从而提高灵活性和对业务需求变化的响应能力。","s":""},{"id":"Q147","d":1,"t":"single","q":"一家公司希望其 Amazon EC2 实例在高度可用的环境中运行，即使在特定地理区域发生自然灾害。哪种方法将实现这一目标？","o":[{"l":"A","t":"在多个 AWS 区域中使用 EC2 实例。"},{"l":"B","t":"在多个 Amazon CloudFront 位置使用 EC2 实例。"},{"l":"C","t":"在多个边缘位置使用 EC2 实例。"},{"l":"D","t":"在 AWS 本地区域中使用 EC2 实例。"}],"a":["A"],"e":"在多个 AWS 区域中使用 EC2 实例（选项 A）提供地理冗余，并有助于确保应用程序的高可用性，即使在特定区域发生自然灾害。","s":""},{"id":"Q164","d":1,"t":"single","q":"AWS Well-Architected Framework 的哪个支柱指的是系统从基础设施或服务中断中恢复并动态获取计算资源以满足需求的能力？","o":[{"l":"A","t":"安全"},{"l":"B","t":"可靠性"},{"l":"C","t":"性能效率"},{"l":"D","t":"成本优化"}],"a":["B"],"e":"可靠性（选项 B）是 AWS Well-Architected Framework 的一个支柱，专注于系统从中断中恢复并动态获取计算资源以维护性能和可用性的能力。","s":""},{"id":"Q480","d":1,"t":"single","q":"一家公司在本地数据中心运行遗留工作负载。公司希望将工作负载迁移到 AWS。公司不想对工作负载进行任何更改。公司应该使用哪种迁移策略？","o":[{"l":"A","t":"重新购买"},{"l":"B","t":"重新平台化"},{"l":"C","t":"重新托管"},{"l":"D","t":"重构"}],"a":["C"],"e":"迁移策略\"重新托管\"涉及将现有工作负载迁移到 AWS，而不需要对应用程序或基础设施进行任何更改。这也被称为\"提升和转移\"迁移，适用于不希望或不切实际进行更改的遗留工作负载。","s":""},{"id":"Q618","d":1,"t":"single","q":"一家公司想要将其本地基础设施迁移到 AWS 云。 云计算的哪个优势将帮助该公司降低前期成本？","o":[{"l":"A","t":"在几分钟内实现全球化"},{"l":"B","t":"提高速度和敏捷性"},{"l":"C","t":"受益于大规模的经济规模"},{"l":"D","t":"将固定费用转换为可变费用"}],"a":["D"],"e":"通过迁移到 AWS 云，该公司可以将与本地基础设施相关的固定费用（如硬件购买和维护）转换为基于使用的可变费用，有助于降低前期成本。","s":""}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 1.1.1 | 云计算定义三要素（按需/IT 资源/按量付费） | ⭐⭐ 中 | 概念题 |\n| 1.1.2 | 六大价值主张表述匹配 | ⭐⭐⭐ 高 | 匹配/场景题 |\n| 1.1.3 | 公有/私有/混合云部署模型判断 | ⭐⭐ 中 | 场景题 |\n| 1.2.1 | Well-Architected 六支柱名称与场景归属 | ⭐⭐⭐ 高 | 场景题 |\n| 1.2.2 | 设计原则 vs 支柱层次区分 | ⭐⭐ 中 | 概念题 |\n| 1.3.1 | AWS CAF 六视角匹配 | ⭐⭐ 中 | 匹配题 |\n| 1.3.2 | 7R 迁移策略辨析（Rehost/Replatform 等） | ⭐⭐⭐ 高 | 场景题 |\n| 1.3.3 | MAP 三阶段 | ⭐ 低 | 选择题 |\n| 1.4.1 | CapEx vs OpEx 本质区别 | ⭐⭐⭐ 高 | 概念/场景题 |\n| 1.4.2 | TCO 与计费三大驱动力（计算/存储/出站流量） | ⭐⭐ 中 | 概念题 |","services":"| 服务/工具 | 主要用途 | 涉及 Task |\n|---|---|---|\n| AWS Well-Architected Tool | 架构评审（六支柱落地检查） | 1.2 |\n| AWS CAF（方法论） | 迁移组织准备度评估（六视角） | 1.3 |\n| AWS MAP（迁移加速计划） | 迁移三阶段方法论 | 1.3 |\n| AWS Pricing Calculator | 估算计划中的 AWS 负载成本 | 1.4 |\n| AWS Migration Evaluator | 本地→云 TCO 对比分析 | 1.4 |"}},{"domain":2,"name":"安全与合规","weight":"30%","sections":[{"h":"AWS 共享责任模型","body":"> 本域对应官方考纲任务声明 2.1–2.4：责任共担模型、安全治理合规概念、访问管理、安全组件与资源。这是考试权重第二高的域（30%），安全几乎贯穿所有真题。\n\n#### 本节定位\n\n本节对应考纲任务声明 2.1「理解 AWS 共享责任模型」。学完之后你应该能回答：AWS 和客户各自负责哪些安全内容？同样是在 AWS 上跑一个应用，如果选了不同类型的服务（比如自己装操作系统的虚拟机 vs 全托管的数据库），客户的安全责任有什么变化？考试题里给你一个安全事故场景，你能判断这件事该 AWS 负责还是该客户负责吗？\n\n#### 什么是共享责任模型\n\n先用一个生活类比帮助理解。你租了一间写字楼办公室。物业公司负责大楼的结构安全、电梯维护、消防设施和公共区域的监控；你负责办公室里的门锁、保险箱、文件柜以及员工出入管理。如果大楼发生结构问题导致你的东西损坏，那是物业的责任；如果你忘锁门导致东西被偷，物业不背锅——即使大楼有再好的门禁系统。\n\nAWS 的共享责任模型（Shared Responsibility Model）和这个道理完全一样，只不过「大楼」换成了「云基础设施」，「办公室」换成了「你在云上跑的应用和数据」。\n\nAWS 官方把安全责任一分为二：\n\n- **AWS 的责任——Security OF the Cloud（云本身的安全）**：AWS 负责保护运行所有 AWS 云服务的底层基础设施。这包括物理数据中心（门禁、监控、供电、冷却——AWS 的数据中心不公开地址，访客不能随便进去参观）、服务器硬件（芯片、主板、硬盘）、网络设备（交换机、路由器、光纤骨干）和虚拟化层（Hypervisor——把一台物理服务器切分成多台虚拟机的底层软件）。简单说，你看不见也摸不到的那些「地基」，AWS 全包。AWS 有专门的安全团队 7×24 小时运营，并且取得了超过 50 个全球合规认证和评估来证明这部分安全做到位了。（来源：Module-3-安全.md，责任共担模型章节）\n- **客户的责任——Security IN the Cloud（云中内容的安全）**：客户负责自己放在云上的数据和应用的安全。具体包括：操作系统管理（如果你选了 Amazon EC2，你要自己给 Linux 或 Windows 打安全补丁）、应用程序代码（你的程序有没有漏洞，是你的事）、网络配置（安全组和网络 ACL 的规则由你设定，放行了不该放行的端口是你的责任）、数据加密（选不选加密、用什么密钥、谁能解密，由你决定）、以及身份和访问管理（IAM 配置——谁能登录、谁能操作什么、权限给得是否合理，全是你说了算也由你负责）。（来源：Module-3-安全.md，责任共担模型章节）\n\n一句话记忆口诀：**AWS 管「地基」，客户管「房间」**。考试中几乎每套题都会考到这个分界线。\n\n[[fig:f02]]\n\n#### 责任边界随服务类型而变\n\n这是考试最爱考的进阶点——不同类型的 AWS 服务，客户需要承担的安全责任不一样。AWS 官方把服务分成三类，客户责任从重到轻排列：\n\n**第一类：基础设施服务（Infrastructure Services）**——以 Amazon EC2（虚拟机）为代表。你得到的是一台虚拟服务器，AWS 只管到硬件和虚拟化层，操作系统以上全是你的：选什么操作系统、打不打补丁、装不装防火墙、配不配安全组、数据加不加密——全部由你负责。这类服务给你最大的灵活性，但也要求你有最强的安全意识和操作能力。客户责任最重。\n\n**第二类：容器服务（Container Services）**——以 Amazon RDS（托管关系型数据库）为代表。这里的「容器」不是指 Docker 容器，而是指 AWS 帮你「包装」了一层——AWS 帮你管了操作系统和数据库引擎的补丁更新，你不需要也无法登录 RDS 的底层操作系统。你只需要管数据本身的加密、访问控制（比如数据库的用户名密码和权限），以及网络配置（安全组规则）。客户责任减轻了一层。\n\n**第三类：抽象服务（Abstract Services）**——以 Amazon S3（对象存储）和 AWS Lambda（无服务器计算）为代表。AWS 管了几乎所有底层，你看不到也接触不到任何服务器或操作系统。\n\n你只需要管数据的分类（哪些是敏感数据、哪些可以公开）、访问权限（谁能读写这个 S3 存储桶）和加密设置（用哪种加密方式、密钥由谁管理）。\n\n客户责任最轻，但**数据安全永远是客户的责任**——无论你用的是哪种服务类型，你的数据放在 AWS 上，保护好它就是你的事。（来源：Module-3-安全.md，责任共担模型章节）\n\n| 服务类型 | 典型服务 | AWS 管到哪 | 客户管什么 |\n| --- | --- | --- | --- |\n| 基础设施服务 | Amazon EC2 | 硬件、虚拟化层 | 操作系统、补丁、防火墙、网络配置、数据加密、IAM |\n| 容器服务 | Amazon RDS | 硬件 + 操作系统 + 引擎补丁 | 数据加密、访问控制、网络配置 |\n| 抽象服务 | Amazon S3、AWS Lambda | 硬件 + 操作系统 + 运行时环境 | 数据分类、访问权限、加密设置 |\n\n**核心规律**：越往上（越托管），客户需要操心的安全细节越少；但数据安全和 IAM 权限配置**永远是客户的事**，这一点不会因为你选了全托管服务就自动变安全。考试遇到「以下哪些是客户的责任」类题目时，「数据加密」和「IAM 配置」几乎总是对的。\n\n#### 共享控制项——容易忽略的中间地带\n\n除了上面明确归 AWS 或归客户的部分，还有一些**共享控制项（Shared Controls）**——AWS 和客户各自在自己的层面负责。最典型的例子：\n\n- **补丁管理**：AWS 负责给自己基础设施（如 Hypervisor）打补丁；客户负责给自己的操作系统和应用打补丁。同一种安全活动，各管各的层。\n- **配置管理**：AWS 负责配置自己的基础设施设备；客户负责配置自己的操作系统、数据库和应用。\n- **培训与安全意识**：AWS 培训自己的员工保护数据中心；客户培训自己的员工不要把密码贴在显示器上。\n\n考试中不常直接考共享控制项，但如果选项里出现「补丁管理是 AWS 的责任还是客户的责任」这类题，正确答案通常是「取决于具体层——基础设施层补丁归 AWS，操作系统层补丁归客户」。\n\n#### 实际操作中怎么确认责任边界\n\nAWS 不会给你发一张清单告诉你「这些你管、那些我管」——但有两个实用方法可以帮你判断：\n\n1. 第一个方法是看服务的文档——每个 AWS 服务的官方文档都有一节叫「Security」，里面会明确说明该服务的共享责任分工。\n2. 第二个方法是看控制台——如果某个安全选项需要你手动开启或配置（比如 S3 加密、安全组规则、IAM 策略），那它就是你的责任。\n\n如果某个安全特性是默认就有的且你无法关闭（比如数据中心的物理安全、网络加密隧道），那它就是 AWS 的责任。\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n在线教育公司「学无涯」在 AWS 上运行两套系统。学员管理系统跑在 Amazon EC2 上，运维团队自己装了 Linux 操作系统和 MySQL 数据库；在线课堂的视频文件存放在 Amazon S3 上。某天安全审计发现两个问题：\n\n第一，EC2 上的 Linux 内核有已知高危漏洞（CVE 评分 9.8），运维团队三个月未打补丁。黑客利用这个漏洞进入了实例，窃取了学员数据。这件事该谁负责？——EC2 属于基础设施服务，操作系统补丁是客户责任，所以这是「学无涯」运维团队的失职。AWS 只管到虚拟化层，内核漏洞不在 AWS 的责任范围内。\n\n第二，S3 存储桶的访问策略被某个开发人员误配为公开可读，导致未付费用户也能直接下载课程视频。这件事该谁负责？——S3 属于抽象服务，但存储桶的访问策略由客户配置。S3 存储桶**默认是私有的**，是有人手动改成了公开。所以这也是「学无涯」的责任。\n\n两个案例中 AWS 都没有责任——AWS 负责的是数据中心的物理安全、S3 服务本身的可用性（11 个 9 的持久性）和 EC2 虚拟化层的安全。应用层面的安全——操作系统补丁、访问策略配置——这些全在客户的地盘。\n\n#### 常见误区与易错点\n\n**误区一：用了全托管服务就不用管安全了。** 错。即使用 Amazon S3（抽象服务），数据分类、访问权限和加密设置仍然由客户负责。S3 默认是私有的，但如果你手动把存储桶设为公开导致数据泄露，那是你的责任不是 AWS 的。\n\n**误区二：物理安全是客户的责任。** 错。数据中心的物理安全永远是 AWS 的责任——门禁、监控、供电、冷却、硬件销毁、介质擦除，这些全部由 AWS 负责。考试里如果选项出现「客户应确保数据中心的物理安全」，直接排除。\n\n**误区三：共享责任 = 共同操作。** 不是。共享责任模型是「责任分工」，不是说 AWS 和客户一起操作同一个东西。各管各的领地，边界清晰不交叉。如果 AWS 数据中心物理安全出了问题导致客户数据丢失，那是 AWS 的事；如果客户自己没打补丁被黑了，AWS 不承担任何责任。\n\n#### 记忆要点\n\n- AWS 管 OF the Cloud（地基），客户管 IN the Cloud（房间）\n- 三类服务：基础设施 > 容器 > 抽象，客户责任从重到轻递减\n- 数据安全和 IAM 权限配置——永远是客户的，不因服务类型改变\n- 物理安全——永远是 AWS 的，考试看到就排除\n- 考试关键词速判：「操作系统补丁」「安全组规则」「IAM 策略」「数据加密选项」→ 客户责任；「硬件故障」「数据中心供电」「虚拟化层漏洞」→ AWS 责任\n\n---","figures":[{"id":"f02","title":"AWS 责任共担模型：AWS 管地基，客户管房间","caption":"考点：给事故场景判断责任方——涉及物理/硬件/网络/虚拟化=AWS；涉及你的数据/应用/OS 补丁/网络配置/加密/IAM=客户；服务越托管，客户责任越少","html":"<svg viewBox=\"0 0 640 330\" style=\"width:100%;max-width:640px;display:block;margin:0 auto\">\n  <text x=\"320\" y=\"26\" font-size=\"14\" font-weight=\"700\" fill=\"#1e1b4b\" text-anchor=\"middle\">共享责任模型：AWS 管「地基」，客户管「房间」<\/text>\n  <!-- AWS half -->\n  <rect x=\"30\" y=\"46\" width=\"580\" height=\"118\" rx=\"10\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/>\n  <text x=\"50\" y=\"72\" font-size=\"12.5\" font-weight=\"700\" fill=\"#4338ca\">AWS 负责 —— Security OF the Cloud（云本身的安全）<\/text>\n  <rect x=\"50\" y=\"86\" width=\"132\" height=\"36\" rx=\"7\" fill=\"#7c3aed\"/>\n  <text x=\"116\" y=\"109\" font-size=\"10.5\" fill=\"#fff\" text-anchor=\"middle\">物理数据中心<\/text>\n  <rect x=\"193\" y=\"86\" width=\"132\" height=\"36\" rx=\"7\" fill=\"#7c3aed\"/>\n  <text x=\"259\" y=\"109\" font-size=\"10.5\" fill=\"#fff\" text-anchor=\"middle\">服务器硬件<\/text>\n  <rect x=\"336\" y=\"86\" width=\"132\" height=\"36\" rx=\"7\" fill=\"#7c3aed\"/>\n  <text x=\"402\" y=\"109\" font-size=\"10.5\" fill=\"#fff\" text-anchor=\"middle\">网络设备<\/text>\n  <rect x=\"479\" y=\"86\" width=\"122\" height=\"36\" rx=\"7\" fill=\"#7c3aed\"/>\n  <text x=\"540\" y=\"109\" font-size=\"10.5\" fill=\"#fff\" text-anchor=\"middle\">虚拟化层<\/text>\n  <text x=\"50\" y=\"150\" font-size=\"10.5\" fill=\"#6d28d9\">你看不见摸不到的「地基」全由 AWS 7×24 保障（50+ 合规认证背书）<\/text>\n  <!-- Customer half -->\n  <rect x=\"30\" y=\"176\" width=\"580\" height=\"118\" rx=\"10\" fill=\"#c7d2fe\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/>\n  <text x=\"50\" y=\"202\" font-size=\"12.5\" font-weight=\"700\" fill=\"#3730a3\">客户负责 —— Security IN the Cloud（云中内容的安全）<\/text>\n  <rect x=\"50\" y=\"216\" width=\"106\" height=\"36\" rx=\"7\" fill=\"#4f46e5\"/>\n  <text x=\"103\" y=\"238\" font-size=\"9.5\" fill=\"#fff\" text-anchor=\"middle\">操作系统补丁<\/text>\n  <rect x=\"164\" y=\"216\" width=\"106\" height=\"36\" rx=\"7\" fill=\"#4f46e5\"/>\n  <text x=\"217\" y=\"238\" font-size=\"9.5\" fill=\"#fff\" text-anchor=\"middle\">应用代码<\/text>\n  <rect x=\"278\" y=\"216\" width=\"106\" height=\"36\" rx=\"7\" fill=\"#4f46e5\"/>\n  <text x=\"331\" y=\"238\" font-size=\"9.5\" fill=\"#fff\" text-anchor=\"middle\">网络配置<\/text>\n  <rect x=\"392\" y=\"216\" width=\"106\" height=\"36\" rx=\"7\" fill=\"#4f46e5\"/>\n  <text x=\"445\" y=\"238\" font-size=\"9.5\" fill=\"#fff\" text-anchor=\"middle\">数据加密<\/text>\n  <rect x=\"506\" y=\"216\" width=\"96\" height=\"36\" rx=\"7\" fill=\"#4f46e5\"/>\n  <text x=\"554\" y=\"238\" font-size=\"9.5\" fill=\"#fff\" text-anchor=\"middle\">IAM 权限<\/text>\n  <text x=\"50\" y=\"280\" font-size=\"10.5\" fill=\"#312e81\">你房间里的数据/应用/配置归你管；选了全托管服务（如 RDS）AWS 分担更多<\/text>\n<\/svg>"}]},{"h":"安全、治理与合规概念","body":"> 本域对应官方考纲任务声明 2.1–2.4：责任共担模型、安全治理合规概念、访问管理、安全组件与资源。\n\n#### 本节定位\n\n本节对应考纲任务声明 2.2「理解 AWS 云安全、治理与合规概念」。学完之后你应该能回答：「加密」是什么、AWS 提供了哪些加密能力？什么是「合规」、AWS 用什么工具帮你证明合规？CloudTrail 和 AWS Config 这两个审计工具各自解决什么问题、考试怎么区分它俩？AWS 怎样管理多个账号并统一安全策略？\n\n#### 加密基础——传输中加密与静态加密\n\n加密（Encryption）用一句话解释：把可读的数据变成乱码，只有拿到「钥匙」（密钥）的人才能还原。你可以把它想象成把一封信放进密码箱——快递员可以搬运这个箱子，但打不开看不了内容。\n\nAWS 的加密分两个维度，考试经常分开考：\n\n**传输中加密（Encryption in Transit）**：数据在从 A 点传到 B 点的路上被加密。最常见的例子是 HTTPS——你的浏览器和 AWS 控制台之间的通信用 TLS（Transport Layer Security，传输层安全协议）加密。即使有人在中间截获了数据包，看到的也只是乱码。AWS 所有服务的 API 端点都默认支持 TLS 加密传输。考试中看到「保护传输中的数据」，优先选 TLS、SSL 或 HTTPS。\n\n**静态加密（Encryption at Rest）**：数据存放在磁盘或存储介质上时被加密。比如你往 Amazon S3 上传的文件、Amazon EBS（弹性块存储，虚拟硬盘）卷上的数据、Amazon RDS 数据库里的记录。即使有人偷走了物理硬盘，没有密钥也读不出数据。\n\nAWS 提供 **AWS KMS（Key Management Service，密钥管理服务）** 来集中管理加密密钥。KMS 与 S3、EBS、RDS 等 AWS 服务深度集成——你在这些服务的控制台里勾选「启用加密」时，底层就是调用 KMS 来管理密钥。你可以选择三种密钥管理方式：AWS 拥有的密钥（最省心，你看不到密钥细节）、AWS 托管密钥（AWS 帮你创建和轮换，你能在 KMS 控制台看到）、客户管理密钥（Customer Managed Key，CMK，你自己创建、轮换和控制使用权限，最灵活也最需要操心）。（来源：Module-3-安全.md，数据保护章节）\n\n考试高频问法：「以下哪种做法能保护传输中的数据？」→ 选 TLS/SSL/HTTPS。「以下哪种做法能保护静态数据？」→ 选 KMS 加密/S3 服务端加密/EBS 加密。\n\n#### 合规——什么是合规、AWS 怎么帮你\n\n合规（Compliance）说白了就是「按规矩办事」——你的系统需要满足法律法规、行业标准或公司内部政策的要求。\n\n比如医疗行业有 HIPAA（美国健康保险可携性与责任法案），要求保护患者健康信息；支付行业有 PCI DSS（支付卡行业数据安全标准），要求保护持卡人数据；欧盟有 GDPR（通用数据保护条例），要求保护个人隐私。\n\n如果你的应用处理这类数据，就必须满足对应的合规要求，否则可能面临巨额罚款甚至被禁止运营。\n\nAWS 在合规方面做了两件事帮助客户：\n\n1. AWS 自身取得了大量合规认证——目前超过 50 个全球合规认证和评估（来源：Module-3-安全.md），包括 ISO 27001、SOC 1/2/3、PCI DSS、HIPAA 等。这些认证证明 AWS 的**基础设施**（也就是共享责任模型中 AWS 负责的那部分）是合规的。\n2. AWS 提供了 **AWS Artifact** 这个自助门户，让你可以随时免费下载 AWS 的合规报告和协议。比如你的客户要求你提供 SOC 2 报告证明数据安全，你不需要找 AWS 销售要——登录 Artifact 自助下载即可。\n\n但是——合规也是共享责任。AWS 基础设施拿到了 ISO 27001 不代表你在上面跑的应用也合规。你仍然需要自己确保应用层面的配置、数据处理方式、访问控制都满足合规要求。AWS 提供了合规的「地基」，但「楼上的房间」达不达标取决于你自己。\n\n#### 审计双工具——CloudTrail 与 AWS Config\n\n审计（Audit）就是「有人查账时你得拿出证据」——证明谁做了什么、系统配置是否符合规定。在云上，审计的核心问题有两个，AWS 提供了两个专门的审计工具各管一个：\n\n**AWS CloudTrail**——记录「谁在什么时间做了什么操作」。可以把它想象成一个不间断的监控录像，记录 AWS 账号内所有的 API 调用：谁（哪个 IAM 用户或角色）在什么时候（时间戳精确到秒）通过什么方式（控制台、CLI 还是 SDK）对什么资源做了什么操作（创建、删除、修改）。\n\nCloudTrail 有三种记录方式（来源：aws-cloudtrail-config-audit.md）：\n\n- **Event History（事件历史）**：默认免费，自动记录过去 **90 天**的管理事件（Management Events），创建账号后就自动开启，不需要任何配置。管理事件包括创建/删除 EC2、修改 IAM 策略等操作。\n- **Trails（跟踪）**：持续记录事件并推送到 S3 存储桶长期保存，第一份管理事件副本免费。可以额外开启数据事件记录（如 S3 GetObject/PutObject），但按量收费。\n- **CloudTrail Lake**：托管数据湖，保留最长 **3,653 天（约 10 年）**，支持 SQL 查询，按摄入和存储量收费。\n\n**AWS Config**——追踪「资源的配置现在是什么样、历史上怎么变的」。它不记录操作行为，而是对资源做配置快照。比如：一个安全组的入站规则昨天还只开了 443 端口，今天被改成了 0.0.0.0/0 全放开——Config 能告诉你这个变化是什么时候发生的、变化前后的完整配置对比。\n\nConfig 更强大的能力是**合规规则（Config Rules）**——你可以设定条件（如「所有 S3 存储桶必须启用加密」「所有 EC2 必须打上 Project 标签」），Config 会**持续自动评估**所有资源是否符合条件，不合规的自动标记为 noncompliant 并发送通知。它还支持自动修复——通过 SSM Automation 触发修复操作。聚合器（Aggregator）功能可以跨多账号、多区域汇总合规数据到一个视图中。（来源：aws-cloudtrail-config-audit.md）\n\n| 维度 | AWS CloudTrail | AWS Config |\n| --- | --- | --- |\n| 核心问题 | 谁做了什么操作？ | 资源配置是否合规？ |\n| 数据内容 | API 调用记录（操作事件流） | 资源配置快照和变更历史 |\n| 免费能力 | Event History 90 天免费 | 无免费层 |\n| 典型场景 | 安全事件溯源、操作审计 | 配置漂移追踪、合规规则评估 |\n| 可视化/查询 | CloudTrail Lake 支持 SQL 查询 | Config Dashboard 合规视图 |\n| 跨账号支持 | Organizations 跟踪（统一日志） | 聚合器（统一合规视图） |\n\n考试最常见的混淆就是 CloudTrail 和 Config。记住一句话：**CloudTrail 看行为（谁做了什么），Config 看状态（资源配了什么）**。两者协同使用才形成完整审计能力——CloudTrail 告诉你「张三在下午 3 点改了安全组」，Config 告诉你「安全组从只开 443 变成了全放开，这违反了合规规则」。\n\n#### 多账号治理——AWS Organizations 与 SCP\n\n企业用 AWS 通常不只有一个账号——开发一个账号、测试一个账号、生产一个账号，不同业务线和部门各自一组。管理几十上百个账号需要集中治理工具。\n\n**AWS Organizations** 是多账号管理服务，它把所有账号组织成一棵树：最顶端是一个**管理账号（Management Account）**，负责创建组织、管理策略和统一出账——管理账号不应该放业务工作负载，专门用来管理。下面是若干**组织单元（OU, Organizational Unit）**，OU 是分组账号的容器（可以嵌套）。OU 里面放**成员账号（Member Account）**。策略可以附加到 OU 或账号上，**自动向下继承**到所有子 OU 和账号。（来源：aws-organizations-multi-account.md）\n\n其中最重要的安全工具是**服务控制策略（SCP, Service Control Policy）**。SCP 的作用是设定成员账号权限的**最大上限**——它只画「天花板」，不直接授权。即使某个成员账号的管理员给自己开了完全权限（IAM 策略写了 Allow *），如果 SCP 拒绝了某个操作，该操作就是无法执行。典型用法包括：禁止成员账号关闭 CloudTrail（确保审计日志不会被篡改）、限制成员账号只能使用特定区域（满足数据主权要求）、禁止退出 Organizations（防止有人搞分裂）。（来源：aws-organizations-multi-account.md）\n\nOrganizations 还自带**合并计费（Consolidated Billing）**——所有成员账号的费用统一汇到管理账号出账，并且跨账号聚合用量可以共享分层定价折扣和 Savings Plans，这是免费的附加好处。（来源：aws-organizations-multi-account.md）\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n金融科技公司「汇信达」有 12 个 AWS 账号（开发 4 个、测试 4 个、生产 4 个），统一由 AWS Organizations 管理。安全团队做了三件事搭建安全治理体系：\n\n1. 用 SCP 附加到所有成员账号所在的 OU 上，禁止关闭 CloudTrail、禁止退出组织——即使某个开发者拿到了管理员权限，也无法关闭审计日志或脱离组织管控。\n2. 用 AWS Config 设置合规规则，要求所有 S3 存储桶必须启用加密、所有 EC2 实例必须打上 Project 标签，不合规的自动标红并通知安全团队。\n3. 通过 CloudTrail 的组织级跟踪功能，把 12 个账号的操作日志统一归集到安全审计账号的 S3 存储桶中，安全团队在一处查看所有操作记录。\n\n#### 常见误区与易错点\n\n**误区一：SCP 可以给账号授权。** 错。SCP 只设上限（天花板），不授权。即使 SCP 允许了某个操作，账号内部还需要有对应的 IAM 策略才能真正执行。SCP Allow ≠ 这个操作就能做；SCP Deny = 这个操作铁定不能做。（来源：aws-organizations-multi-account.md）\n\n**误区二：CloudTrail 和 Config 是同一个东西。** 不是。CloudTrail 记录操作行为（谁做了什么），Config 追踪配置状态（资源变成了什么样）。「张三删了安全组规则」是 CloudTrail 记的；「安全组从合规变成不合规」是 Config 判的。两者协同使用才形成完整审计。\n\n**误区三：合规认证全部是 AWS 的事。** 错。AWS 基础设施拿到 ISO 27001 不代表你在上面跑的应用也合规。你需要自己确保应用层面的配置和数据处理满足合规要求——这又回到了共享责任模型。AWS Artifact 帮你证明 AWS 的地基合规，你自己的楼层需要自己管。\n\n#### 记忆要点\n\n- 加密两维度：传输中（TLS/SSL/HTTPS）+ 静态（KMS 管密钥）\n- KMS 三种密钥方式：AWS 拥有 / AWS 托管 / 客户管理（CMK）\n- CloudTrail 看行为（谁做了什么），Config 看状态（资源配了什么）\n- CloudTrail Event History 默认免费 90 天，Lake 最长保留约 10 年\n- AWS Artifact = 下载合规报告的免费门户\n- Organizations = 多账号树形管理（管理账号→OU→成员账号）\n- SCP = 权限天花板（不授权，只画上限，Deny 铁定生效）\n- 合规也是共享责任——AWS 基础设施合规 ≠ 你的应用合规\n\n---"},{"h":"AWS 访问管理能力","body":"> 本域对应官方考纲任务声明 2.1–2.4：责任共担模型、安全治理合规概念、访问管理、安全组件与资源。\n\n#### 本节定位\n\n本节对应考纲任务声明 2.3「识别 AWS 访问管理能力」。学完之后你应该能回答：IAM 是什么、它的工作流程是什么？根用户为什么危险、应该怎么保护？IAM 用户和 IAM 角色有什么本质区别、什么时候该用角色？IAM 策略怎么定义权限、「默认拒绝」是什么意思？MFA 是什么、为什么必须开？\n\n#### 什么是 IAM\n\n先解释两个基础概念。身份验证（Authentication）= 证明「你是谁」——就像进大楼要刷工卡，工卡上有你的照片和姓名，门禁系统核对通过才放你进去。授权（Authorization）= 确认「你能做什么」——你的工卡权限可能只能开你所在楼层的门，你进不了服务器机房，也刷不开财务部的保险柜。\n\n**AWS IAM（Identity and Access Management，身份与访问管理）** 就是 AWS 账号里的「门禁系统」，控制谁（身份）可以对什么 AWS 资源做什么操作。IAM 是完全免费的服务，每个 AWS 账号自带，不需要额外开通。它是 AWS 安全体系的基石——几乎所有安全配置都要经过 IAM。（来源：aws-iam-full-guide.md）\n\nIAM 的工作流程只有三步：**认证 → 授权 → 操作**。\n\n1. 你登录 AWS 时出示凭证（用户名密码或访问密钥），IAM 验证你是谁。\n2. IAM 检查附加在你身份上的策略文档，决定你这次请求的操作是否被允许。\n3. 如果策略允许，才真正执行你请求的操作（比如启动一台 EC2、删除一个 S3 对象）。\n\n如果策略不允许或显式拒绝，请求被驳回，你会看到 Access Denied 错误。（来源：aws-iam-full-guide.md）\n\n#### 根用户——最高权限，最要保护\n\n注册 AWS 账号时，你填写的邮箱和密码就是**根用户（Root User）**——它对账号内所有服务和资源有**不受限**的完全访问权，包括账单信息、账号设置、甚至可以关闭整个账号。（来源：aws-iam-root-user-security-best-practices.md）\n\n根用户这么强大，所以也最危险——如果被攻击者拿到了根用户凭证，整个账号就完了。AWS 官方的核心建议是：**日常绝对不要用根用户**。只在必须用根用户才能完成的任务时使用（比如修改账号邮箱、关闭账号、修改某些税务设置、查看第一份发票）。日常管理应该创建单独的管理员用户或使用 IAM Identity Center。（来源：aws-iam-root-user-security-best-practices.md）\n\n根用户保护的关键措施（考试高频考点）：\n\n- **必须启用 MFA（多因子认证）**。MFA（Multi-Factor Authentication）就像银行的 U 盾——除了密码（你「知道」的东西），还要提供一个动态验证码（你「拥有」的东西，如手机 APP 或硬件令牌），双重验证才能登录。即使密码泄露，攻击者没有 MFA 设备也无法登录。AWS 要求根用户首次登录后 **35 天内**必须注册 MFA，否则无法继续使用控制台。每个根用户最多可注册 **8 个 MFA 设
