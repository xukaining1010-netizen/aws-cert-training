据，并自动定期轮换用户密码。哪项AWS 服务或功能将满足这些要求？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"AWS Systems Manager Parameter Store"},{"l":"C","t":"AWS Secrets Manager"},{"l":"D","t":"AWS CloudTrail"}],"a":["C"],"e":"**✅ 为什么 C. AWS Secrets Manager 对**：Secrets Manager 专为凭据管理设计——加密存储 RDS 等数据库凭据，原生支持自动轮换（对接 RDS 直接改密码），「存储凭据+自动轮换」双关键词正中。\n\n**❌ 为什么其他选项错**：\n- A. Amazon S3：通用对象存储，无轮换能力\n- B. AWS Systems Manager Parameter Store：可存参数，标准版无自动轮换（凭据轮换要自己写）\n- D. AWS CloudTrail：审计日志\n\n**📌 关键概念**：凭据+自动轮换=Secrets Manager；Parameter Store 存配置参数为主（SecureString 也存凭据但轮换是收费版 Secrets Manager 的强项）。「定期轮换密码」是区分两者的题眼。Secrets Manager 原生对接 RDS/Redshift/DocumentDB 等轮换模板，凭据变更由服务推送到使用方，免去手工改密码的运维与安全风险。","s":"源#623"},{"id":"D3-625","d":3,"t":"single","q":"一家公司需要一个可管理的 NFS 文件系统，该公司可以将其与 AWS 计算资源一起使用。哪项AWS服务或功能将满足这些要求？","o":[{"l":"A","t":"Amazon Elastic Block Store（Amazon EBS）"},{"l":"B","t":"AWS Storage Gateway Tape Gateway"},{"l":"C","t":"Amazon S3 Glacier Flexible Retrieval"},{"l":"D","t":"Amazon Elastic File System（Amazon EFS）"}],"a":["D"],"e":"**✅ 为什么 D. Amazon Elastic File System（Amazon EFS） 对**：EFS 是托管 NFS 文件系统，即开即用与 EC2/Lambda 等 AWS 计算资源挂载集成，「可管理的 NFS 文件系统」就是其定义。\n\n**❌ 为什么其他选项错**：\n- A. Amazon EBS：块存储（非 NFS）\n- B. AWS Storage Gateway Tape Gateway：磁带备份网关\n- C. Amazon S3 Glacier Flexible Retrieval：归档存储层\n\n**📌 关键概念**：AWS 原生 NFS=EFS（Linux）；Windows/SMB 场景用 FSx for Windows File Server；「NFS」字眼出现秒选 EFS，除非题干强调 Windows 或 Lustre（HPC）。EFS 标准与 IA 存储类自动分层，生命周期策略 14/30/60/90 天可选；挂载目标每个 AZ 一个，跨 AZ 容灾开箱即用。吞吐模式（Provisioned Throughput）可满足高并发小文件场景，弹性吞吐按需付费。与块存储 EBS 的「挂单机」、对象存储 S3 的「走 API」形成三足鼎立，文件语义共享场景选 EFS。","s":"源#625"},{"id":"D3-630","d":3,"t":"single","q":"哪项 AWS 服务可以创建从本地到 AWS 云的专用网络连接？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"虚拟私有云（Amazon VPC）"},{"l":"C","t":"AWS Direct Connect"},{"l":"D","t":"Amazon Route 53"}],"a":["C"],"e":"**✅ 为什么 C. AWS Direct Connect 对**：Direct Connect 创建本地到 AWS 的专用私有连接，不走公网、低延迟，「专用网络连接」题眼直接锁定。\n\n**❌ 为什么其他选项错**：\n- A. AWS Config：配置审计\n- B. 虚拟私有云（Amazon VPC）：网络容器\n- D. Amazon Route 53：DNS\n\n**📌 关键概念**：「专用连接」=DX（物理专线）；选项混入 Config/Route 53 等非网络服务是常见干扰法。DX 需 ISP/托管设施配合落地物理链路。DX 建立后仍是客户自管 BGP 路由宣告，可与 VPN 组成主备混合链路；接入费之外数据传输按流出方向计费。Hosted Connection 由合作伙伴提供小带宽接入（50M~500M），Dedicated Connection 直连 AWS 端口 1G 起；跨国多区域可用 Direct Connect Gateway 统一接入，避免多条专线重复建设。","s":"源#630"},{"id":"D3-632","d":3,"t":"single","q":"哪项 AWS 服务使用语音到文本转换来帮助用户创建会议记录？","o":[{"l":"A","t":"Amazon Polly"},{"l":"B","t":"Amazon Textract"},{"l":"C","t":"Amazon Rekognition"},{"l":"D","t":"Amazon Transcribe"}],"a":["D"],"e":"**✅ 为什么 D. Amazon Transcribe 对**：Transcribe 是语音转文本（STT）服务，把会议录音转成文字记录，「语音到文本+会议记录」双关键词正中。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Polly：文本转语音（反方向）\n- B. Amazon Textract：文档图像提取文字\n- C. Amazon Rekognition：图像视频分析\n\n**📌 关键概念**：口诀「听写 Transcribe、朗读 Polly、读文档 Textract」；会议记录/字幕生成/客服录音质检是 Transcribe 高频场景，支持说话人分离与时间戳。Transcribe 支持自定义词汇表与频移掩蔽敏感信息，医学/法律领域有专用版；与 Translate 串联可产出会议多语言纪要。","s":"源#632"},{"id":"D3-637","d":3,"t":"single","q":"一家公司希望跟踪特定 AWS 环境中所有 Amazon EC2 实例的每月成本和使用情况。哪项AWS 服务或工具将满足这些要求？","o":[{"l":"A","t":"AWS Cost Anomaly Detection"},{"l":"B","t":"AWS Budgets"},{"l":"C","t":"AWS Compute Optimizer"},{"l":"D","t":"AWS Trusted Advisor"}],"a":["B"],"e":"**✅ 为什么 B. AWS Budgets 对**：Budgets 按自定义阈值跟踪成本与用量（可细化到服务/标签维度），超阈值即通知，「跟踪每月成本和使用情况+告警」正中其功能。\n\n**❌ 为什么其他选项错**：\n- A. AWS Cost Anomaly Detection：异常检测（找突变不设预算）\n- C. AWS Compute Optimizer：规格建议\n- D. AWS Trusted Advisor：最佳实践检查\n\n**📌 关键概念**：预算+阈值告警=Budgets；成本可视化分析=Cost Explorer；异常侦测=CAD。「每月成本+使用情况+通知」组合是 Budgets 题眼。Budgets 可按成本/用量/RI 利用率/SP 覆盖率四种口径建预算，目标值与实际值按日刷新；SNS 通知到邮件，还可联动自动响应动作。","s":"源#637"},{"id":"D3-643","d":3,"t":"single","q":"哪项 AWS 服务使用边缘位置来缓存内容？","o":[{"l":"A","t":"Amazon Kinesis"},{"l":"B","t":"Amazon Simple Queue Service（Amazon SQS）"},{"l":"C","t":"Amazon CloudFront"},{"l":"D","t":"Amazon Route 53"}],"a":["C"],"e":"**✅ 为什么 C. Amazon CloudFront 对**：CloudFront 通过全球边缘位置缓存内容，就近响应用户，「使用边缘位置缓存内容」就是 CDN 的定义。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Kinesis：流数据收集\n- B. Amazon SQS：消息队列\n- D. Amazon Route 53：DNS（用全球网络但不缓存内容）\n\n**📌 关键概念**：边缘缓存=CloudFront；Route 53 是解析不是缓存。「边缘位置+缓存」双词锁定 CDN，不用犹豫。CloudFront 全球数百个节点，回源可配 S3/ALB/自定义源站，Origin Shield 二级缓存进一步降低回源压力；HTTPS 证书与 WAF 可挂边缘。价格级（price class）可限定只走廉价区域节点控制成本，签名 URL/签名 Cookie 做私有内容防盗链，日志可投 S3 做访问分析；与 Shield Advanced、WAF 组成边缘安全栈。","s":"源#643"},{"id":"D3-644","d":3,"t":"single","q":"一家公司希望从 Amazon EC2 实例安全地访问 Amazon S3 存储桶，而无需访问互联网。该公司应该使用什么来实现此目标？","o":[{"l":"A","t":"VPN 连接"},{"l":"B","t":"互联网网关"},{"l":"C","t":"VPC 端点"},{"l":"D","t":"NAT 网关"}],"a":["C"],"e":"**✅ 为什么 C. VPC 端点 对**：VPC 端点（网关型/接口型）让 VPC 内 EC2 私网直连 S3 等服务，流量不出 AWS 骨干，「无需互联网访问 S3」正中其设计目的。\n\n**❌ 为什么其他选项错**：\n- A. VPN 连接：连本地网络\n- B. 互联网网关：恰恰是走公网的出口\n- D. NAT 网关：私有子网出站仍走公网路径\n\n**📌 关键概念**：私网访问 AWS 服务=VPC 端点（Gateway Endpoint 免费，S3/DynamoDB）；NAT/IGW 都要过公网。「不暴露公网+访问 S3」秒选端点。网关端点免费且走路由表，接口端点收费但走 ENI，支持的服务更多；配置后桶策略可加 vpce 条件拒绝走公网的请求，安全再加一层锁。","s":"源#644"},{"id":"D3-645","d":3,"t":"single","q":"一家公司希望使用一项 AWS 服务，该服务可以自动将软件部署到 Amazon EC2 实例和本地实例。哪项 AWS 服务将满足此要求？","o":[{"l":"A","t":"AWS CodeCommit"},{"l":"B","t":"AWS CodeBuild"},{"l":"C","t":"AWS CodeDeploy"},{"l":"D","t":"AWS CodePipeline"}],"a":["C"],"e":"**✅ 为什么 C. AWS CodeDeploy 对**：CodeDeploy 自动把代码部署到 EC2 实例与本地（on-premises）实例，滚动/蓝绿策略可编排，「部署到 EC2+本地」双场景是其独有卖点。\n\n**❌ 为什么其他选项错**：\n- A. AWS CodeCommit：代码仓库\n- B. AWS CodeBuild：构建编译\n- D. AWS CodePipeline：流水线编排（调度各环节但不直接执行部署）\n\n**📌 关键概念**：CI/CD 四件套=Commit（存）/Build（构建）/Deploy（部署）/Pipeline（串流程）；「本地实例部署」是 CodeDeploy 区别于其他工具的关键词，混合云发布场景只有它能覆盖。CodeDeploy 的就地部署与蓝绿部署都支持金丝雀/线性流量切分，标签或 ASG 选目标组；本地服务器装 Agent 即纳管，混合发布统一编排。","s":"源#645"},{"id":"D3-646","d":3,"t":"multiple","q":"哪些 AWS 服务是无服务器的？（选择两项）","o":[{"l":"A","t":"AWS Fargate"},{"l":"B","t":"Amazon Managed Streaming for Apache Kafka"},{"l":"C","t":"Amazon EMR"},{"l":"D","t":"Amazon S3"},{"l":"E","t":"Amazon EC2"}],"a":["A","D"],"e":"**✅ 为什么 A、D 对**：\n- A. AWS Fargate：无服务器容器计算，免管服务器\n- D. Amazon S3：无服务器对象存储，容量自动扩展\n\n**❌ 为什么其他选项错**：\n- B. Amazon MSK：托管 Kafka 但集群节点仍存在（非无服务器）\n- C. Amazon EMR：大数据集群（EC2 集群形态）\n- E. Amazon EC2：自管虚拟机\n\n**📌 关键概念**：无服务器不只计算——S3/DynamoDB/Athena 等存储与查询服务同样「无服务器」；判断标准是「无需配置/管理服务器与容量」。MSK/EMR 是「托管」但非「无服务器」。无服务器组合拳常见如 Lambda+S3+DynamoDB+SQS，全程零服务器管理；判断「无服务器」的试金石是账单里有没有实例小时数。","s":"源#646"},{"id":"D3-649","d":3,"t":"single","q":"一家公司应该使用哪项 AWS 服务来组织、表征和搜索大量图像？","o":[{"l":"A","t":"Amazon Transcribe"},{"l":"B","t":"Amazon Rekognition"},{"l":"C","t":"Amazon Aurora"},{"l":"D","t":"Amazon QuickSight"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Rekognition 对**：Rekognition 为图像打标签、识别对象与人脸并可搜索图库，「组织、表征和搜索大量图像」正是其图像分析能力组合。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Transcribe：语音转文字\n- C. Amazon Aurora：数据库\n- D. Amazon QuickSight：BI 可视化\n\n**📌 关键概念**：图像打标/搜图=Rekognition；「表征（label）」即图像元数据标注，图库管理、内容审核、媒体资产管理是其场景。与 D3-537/D3-485 同族考点。Rekognition 按图像张数与视频分钟计费，人脸集合可存上亿向量，CelebrityRecognition/PPE 检测等即调即用；与 D3-632 转写配合可做视频全元素检索。","s":"源#649"},{"id":"D3-652","d":3,"t":"single","q":"Amazon EC2 按需实例的推荐用例是什么？","o":[{"l":"A","t":"需要特定 EC2 实例配置且长时间稳定运行的工作负载。"},{"l":"B","t":"可以中断且成本最低的项目所需的工作负载。"},{"l":"C","t":"不需要长期承诺的不可预测工作负载。"},{"l":"D","t":"预计运行超过 1 年的工作负载。"}],"a":["C"],"e":"**✅ 为什么 C. 不需要长期承诺的不可预测工作负载。 对**：按需实例按小时秒计费、随开随停、零承诺，正是不可预测短期负载的推荐用法。\n\n**❌ 为什么其他选项错**：\n- A. 特定配置长期稳定：选预留实例/储蓄计划\n- B. 可中断成本最低：选 Spot\n- D. 运行超 1 年：长期承诺选 RI/SP 更省\n\n**📌 关键概念**：购买选项三岔口=On-Demand（灵活零承诺）/RI·SP（长期承诺折扣）/Spot（可中断最大折扣）；「不可预测+无承诺」两词锁定按需。按需实例按秒计费（60 秒起步），同一实例连续用满整月也不给折扣；题干出现「不可预测/临时/短期」字样时优先锁定按需。","s":"源#652"},{"id":"D3-653","d":3,"t":"single","q":"一家公司希望使用 AWS 网络解决方案，该方案可以作为多个 VPC 和本地网络之间的集中网关。哪项 AWS 服务或功能将满足此要求？","o":[{"l":"A","t":"网关 VPC 端点"},{"l":"B","t":"AWS Direct Connect"},{"l":"C","t":"AWS Transit Gateway"},{"l":"D","t":"AWS PrivateLink"}],"a":["C"],"e":"**✅ 为什么 C. AWS Transit Gateway 对**：TGW 是云中的集中路由枢纽，一个网关可挂载数十个 VPC 以及 VPN/DX 连接，星型结构替代 VPC 两两对等的全互联拓扑，「多个 VPC 和本地网络之间的集中网关」正是其定位原话。\n**❌ 为什么其他选项错**：\n- A. 网关 VPC 端点：仅打通 VPC 到 S3/DynamoDB 的私网路径，不连本地网络\n- B. AWS Direct Connect：本地到 AWS 的物理专线，不做多 VPC 中枢路由\n- D. AWS PrivateLink：把服务私有暴露给 VPC，非全网集散枢纽\n**📌 关键概念**：集中网关/中心枢纽=TGW；两两互联用 VPC 对等连接（无传递路由，网状难管理）；「多 VPC+本地+集散」三要素齐全即选 TGW，挂载即通、路由集中管理。","s":"源#653"},{"id":"D3-657","d":3,"t":"single","q":"一家公司在 AWS 上托管 Web 应用程序，通过配置多个 Amazon EC2 实例提高了应用程序的可用性。该公司希望在这些容器之间分发流量，同时为 Web 提供单一联系点。 哪项 AWS 服务可以将流量分发到多个EC2 实例作为目标？","o":[{"l":"A","t":"VPC 端点"},{"l":"B","t":"应用程序负载均衡器"},{"l":"C","t":"NAT 网关"},{"l":"D","t":"互联网网关"}],"a":["B"],"e":"**✅ 为什么 B. 应用程序负载均衡器 对**：ALB 把进入的 HTTP/HTTPS 流量按监听器规则分发到多个 EC2 实例目标，为客户端提供单一 DNS 联系点，「分发流量到多个 EC2 实例+单一联系点」正中负载均衡器本职。\n**❌ 为什么其他选项错**：\n- A. VPC 端点：VPC 私网访问 AWS 服务的通道\n- C. NAT 网关：私有子网出站上网代理\n- D. 互联网网关：VPC 整体公网出入口，不做实例级流量分发\n**📌 关键概念**：多实例分发+单点入口=ELB 家族（ALB 工作在 HTTP 层，可按路径/主机路由）；NAT/IGW 是网络出入口不是分配器。「单一联系点」是 LB 类题眼。","s":"源#657"},{"id":"D3-658","d":3,"t":"single","q":"Amazon S3 中可以存储的数据总量是多少？","o":[{"l":"A","t":"10 PB"},{"l":"B","t":"50 PB"},{"l":"C","t":"100 PB"},{"l":"D","t":"几乎无限"}],"a":["D"],"e":"**✅ 为什么 D. 几乎无限 对**：S3 是弹性对象存储，桶内对象数量、总存储容量均无上限，写入多少扩展多少，无需预先申请空间，官方口径即「几乎无限的存储」。\n**❌ 为什么其他选项错**：\n- A. 10 PB：人为设定的数字上限，S3 不存在总量封顶\n- B. 50 PB：同上，无此硬性限制\n- C. 100 PB：同上，容量随用随扩\n**📌 关键概念**：S3 容量「几乎无限」是官方原话；单对象最大 5TB，但桶内对象数不限、无需容量规划。「无限」考点常与 EBS 单卷上限（64TiB）对比出题，看到具体 PB 数字一律排除。","s":"源#658"},{"id":"D3-660","d":3,"t":"single","q":"一家公司将数据存储在 Amazon S3 存储桶中。 哪项任务是 AWS 的责任？","o":[{"l":"A","t":"配置 S3 生命周期政策。"},{"l":"B","t":"激活 S3 版本控制。"},{"l":"C","t":"配置 S3 存储桶政策。"},{"l":"D","t":"保护支持 S3 存储的基础设施。"}],"a":["D"],"e":"**✅ 为什么 D. 保护支持 S3 存储的基础设施。对**：共享责任模型中 AWS 负责「云本身的安全」——数据中心、服务器、磁盘与网络等支撑 S3 运行的底层设施；桶层面的配置与数据全归客户。\n**❌ 为什么其他选项错**：\n- A. 配置 S3 生命周期政策：客户在自家桶上设置\n- B. 激活 S3 版本控制：客户自行开关\n- C. 配置 S3 存储桶政策：客户的权限管理动作\n**📌 关键概念**：「云的安全」归 AWS、「云中的安全」归客户；S3 场景客户管桶策略/版本控制/生命周期/加密配置，AWS 管硬件与设施。判断法：凡是控制台里客户可改的配置都是客户责任。","s":"源#660"},{"id":"D3-661","d":3,"t":"single","q":"一家公司希望将当前在其自己的数据中心运行的虚拟 Windows Server 2022 转移到AWS。该公司希望自动将现有服务器转换为直接在 AWS 基础设施上运行，而不是在虚拟化硬件上运行。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS DataSync"},{"l":"B","t":"AWS Database Migration Service（AWS DMS）"},{"l":"C","t":"AWS Application Discovery Service"},{"l":"D","t":"AWS Application Migration Service"}],"a":["D"],"e":"**✅ 为什么 D. AWS Application Migration Service 对**：MGN 持续复制源服务器块数据（含本地虚拟机），自动将现有服务器转换为原生 EC2 在 AWS 基础设施上直接运行，lift-and-shift 首选，「自动转换+直接运行」正中。\n**❌ 为什么其他选项错**：\n- A. AWS DataSync：在线搬迁文件数据，不迁移服务器本身\n- B. AWS DMS：专管数据库迁移\n- C. Application Discovery Service：迁移前盘点摸底，不执行转换\n**📌 关键概念**：迁移工具链=Discovery（摸清家底）/DataSync（搬数据）/DMS（搬数据库）/MGN（搬整台服务器）；「rehost 换壳变 EC2」只有 MGN，Windows Server 2022 虚拟机是其典型场景。MGN 由 CloudEndure 技术演化而来，源端轻量 Agent 持续块复制，割接窗口可压缩到分钟级；目标实例可先做测试运行验证再正式切换。","s":"源#661"},{"id":"D3-662","d":3,"t":"single","q":"哪项 AWS 服务是完全托管的 NoSQL 数据库服务？","o":[{"l":"A","t":"Amazon RDS"},{"l":"B","t":"Amazon Redshift"},{"l":"C","t":"Amazon DynamoDB"},{"l":"D","t":"Amazon Aurora"}],"a":["C"],"e":"**✅ 为什么 C. Amazon DynamoDB 对**：DynamoDB 是 AWS 完全托管的键值/文档型 NoSQL 数据库，任意规模下毫秒级读写、自动分区扩展，「完全托管的 NoSQL 数据库」就是其定义级描述。\n**❌ 为什么其他选项错**：\n- A. Amazon RDS：托管关系型数据库\n- B. Amazon Redshift：数据仓库（分析型）\n- D. Amazon Aurora：RDS 家族的高性能关系型\n**📌 关键概念**：NoSQL 阵营=DynamoDB（键值/文档）/DocumentDB（Mongo 兼容）/Neptune（图）；题干无修饰词说「完全托管 NoSQL」默认 DynamoDB。关系型三兄弟 RDS/Aurora/Redshift 直接出局。DynamoDB 按需模式按请求计费免容量规划，预置模式配自动扩缩；单表设计（single-table design）是其特色玩法，全局表支持多区域活跃-活跃。","s":"源#662"},{"id":"D3-664","d":3,"t":"single","q":"一家公司希望将其本地 SQL Server 数据库迁移到 AWS 云。该公司希望 AWS 处理数据库的日常管理。哪项 AWS 服务将满足该公司的要求？","o":[{"l":"A","t":"Amazon EC2 for Microsoft SQL Server"},{"l":"B","t":"Amazon DynamoDB"},{"l":"C","t":"Amazon RDS"},{"l":"D","t":"Amazon Aurora"}],"a":["C"],"e":"**✅ 为什么 C. Amazon RDS 对**：RDS 托管 SQL Server 等 7 种引擎，备份、补丁、监控、故障切换等日常管理由 AWS 代劳，本地 SQL Server 搬进来即卸掉运维包袱，「AWS 处理日常管理」正中托管定位。\n**❌ 为什么其他选项错**：\n- A. EC2 for Microsoft SQL Server：自管方案，DBA 全套运维照做\n- B. DynamoDB：NoSQL，承载不了 SQL Server\n- D. Aurora：托管但只兼容 MySQL/PostgreSQL，无 SQL Server 引擎\n**📌 关键概念**：选托管库先查引擎支持表——SQL Server/Oracle 仅 RDS 提供，Aurora 不覆盖；题干「希望 AWS 处理日常管理」即排除 EC2 自建，两大条件交叉锁定 RDS。RDS 引擎支持 MySQL/PostgreSQL/MariaDB/Oracle/SQL Server 与两种 Aurora；License 包含（LI）或自带（BYOL）两种授权方式按合规需求选。","s":"源#664"},{"id":"D3-668","d":3,"t":"single","q":"一家公司拥有为高性能计算（HPC）工作负载设计的数据湖。 该公司应该使用哪种Amazon EC2 实例类型来满足这些要求？","o":[{"l":"A","t":"通用实例"},{"l":"B","t":"计算优化实例"},{"l":"C","t":"内存优化实例"},{"l":"D","t":"存储优化实例"}],"a":["B"],"e":"**✅ 为什么 B. 计算优化实例 对**：HPC 高性能计算属计算密集负载，计算优化型（C 系列）配高主频多核处理器，算力单价最优，正是 HPC/科学计算/批量处理的推荐实例族。\n**❌ 为什么其他选项错**：\n- A. 通用实例：均衡型，无算力侧重\n- C. 内存优化实例：面向内存数据库/大数据处理\n- D. 存储优化实例：面向高顺序 IO/大本地盘场景\n**📌 关键概念**：实例族口诀=通用 M、计算 C、内存 R、存储 D/I、加速 P/G；HPC/视频转码/游戏服务器→C 族。按负载瓶颈选族：卡 CPU 选 C、缺内存选 R、拼磁盘选 D。","s":"源#668"},{"id":"D3-671","d":3,"t":"single","q":"一家计划迁移到 AWS 云的公司位于一个网络连接有限的孤立地区。该公司需要在本地进行数据处理。该公司需要一种解决方案，能够在没有稳定互联网连接的情况下运行。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"AWS Snowball Edge"},{"l":"C","t":"AWS Storage Gateway"},{"l":"D","t":"AWS Backup"}],"a":["B"],"e":"**✅ 为什么 B. AWS Snowball Edge 对**：Snowball Edge 是可寄送的加固设备，自带算力可在本地离线跑处理任务，数据处理完再寄回 AWS 导入，「孤立地区+无稳定网络+本地处理」三重题眼全中。\n**❌ 为什么其他选项错**：\n- A. Amazon S3：纯云服务，断网即不可用\n- C. Storage Gateway：本地缓存网关，依赖与云的持续连接\n- D. AWS Backup：跨服务备份编排，无离线能力\n**📌 关键概念**：弱网/断网选 Snowball 家族（Edge 含 EC2/Lambda 可本地计算）；Storage Gateway 必须保持云连接。勘探、远洋、军事等无网环境数据搬运与边缘处理标配。Snowball Edge 有 Compute Optimized 与 Storage Optimized 两型，最多可级联组集群；设备有防拆封条与 KMS 加密，寄回后数据经安全擦除。","s":"源#671"},{"id":"D3-672","d":3,"t":"single","q":"一家公司想要构建用于实时欺诈模式检测的图查询。 哪项 AWS 服务将满足此要求？","o":[{"l":"A","t":"Amazon Neptune"},{"l":"B","t":"Amazon DynamoDB"},{"l":"C","t":"Amazon Timestream"},{"l":"D","t":"Amazon Forecast"}],"a":["A"],"e":"**✅ 为什么 A. Amazon Neptune 对**：Neptune 是完全托管图数据库，擅长高度关联数据的关系遍历，账户-交易-设备构成的欺诈团伙检测正是官方典型用例，「实时欺诈+图查询」双关键词锁定。\n**❌ 为什么其他选项错**：\n- B. DynamoDB：键值模型，无关系遍历能力\n- C. Timestream：时间序列数据库\n- D. Forecast：托管时序预测服务\n**📌 关键概念**：图数据库=Neptune，亿级节点边毫秒级多跳查询；欺诈环检测/社交网络/推荐/知识图谱是四大图场景。题眼是「关系查询」而非「键值查询」，与 D3-537 同族考点。","s":"源#672"},{"id":"D3-673","d":3,"t":"single","q":"一家公司想要迁移到 AWS 云。该公司需要在需要时获取资源，并在不再需要时释放这些资源。AWS 云的哪个架构概念满足这些要求？","o":[{"l":"A","t":"弹性"},{"l":"B","t":"可用性"},{"l":"C","t":"可靠性"},{"l":"D","t":"持久性"}],"a":["A"],"e":"**✅ 为什么 A. 弹性 对**：弹性指随需求自动增减资源——需要时获取、不需要时释放，按实际用量付费，题干「获取资源/释放资源」的动态伸缩描述就是弹性的教科书定义。\n**❌ 为什么其他选项错**：\n- B. 可用性：系统正常服务的时间比例\n- C. 可靠性：故障检测与恢复能力\n- D. 持久性：数据长期不丢失的保证\n**📌 关键概念**：六优势词辨析——弹性=伸缩（scale out/in）、敏捷=快速试验、耐用=数据保全、可用=正常运行。「随要随取随放」字面即弹性，与 D3-652 购买选项、D3-689 Spot 考点同源呼应。","s":"源#673"},{"id":"D3-674","d":3,"t":"single","q":"一家公司想要将 Web 应用程序部署为容器化应用程序。该公司希望使用一项托管服务，该服务可以自动从源代码创建容器镜像并部署容器化应用程序。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Elastic Beanstalk"},{"l":"B","t":"Amazon Elastic Container Service（Amazon ECS）"},{"l":"C","t":"AWS App Runner"},{"l":"D","t":"Amazon EC2"}],"a":["C"],"e":"**✅ 为什么 C. AWS App Runner 对**：App Runner 完全托管，从源代码仓库直接自动构建容器镜像并部署为容器化 Web 应用，免管任何基础设施，「自动从源代码创建容器镜像+部署」正是其独门卖点。\n**❌ 为什么其他选项错**：\n- A. Elastic Beanstalk：托管平台，但环境配置需参与，不自动从源码造镜像\n- B. Amazon ECS：容器编排服务，镜像构建需另行解决\n- D. Amazon EC2：裸虚拟机，一切自理\n**📌 关键概念**：源码→镜像→公网 URL 一条龙只有 App Runner；EB 是平台即服务但面向传统 Web 栈；ECS/EKS 只管容器运行不管源码构建。「从源代码自动构建」是本题题眼。","s":"源#674"},{"id":"D3-680","d":3,"t":"single","q":"一家公司在数据中心拥有多个基于 SQL 的数据库。该公司需要将所有数据库服务器迁移到AWS 云，以降低运营物理服务器的成本。 哪项 AWS 服务或资源将以最少的运营开销满足这些要求？","o":[{"l":"A","t":"Amazon EC2 实例"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"Amazon DynamoDB"},{"l":"D","t":"OpenSearch"}],"a":["B"],"e":"**✅ 为什么 B. Amazon RDS 对**：RDS 托管多种 SQL 引擎，备份、补丁、扩展等由 AWS 全权处理，把数据中心 SQL 库群整体迁入即摆脱物理服务器运维，「SQL 数据库+最少运营开销」正中。\n**❌ 为什么其他选项错**：\n- A. EC2 实例：装库管库全自己来，运营开销最大\n- C. DynamoDB：NoSQL，装不下 SQL 数据库\n- D. OpenSearch：搜索与分析引擎\n**📌 关键概念**：多套 SQL 库统一上云=RDS（迁移过程可配 DMS 通道）；「最少运营开销」=排除 EC2 自管路径。RDS 还可开 Multi-AZ 顺手提升可用性，是此场景标准答案。RDS 快照可跨区域复制做异地容灾，只读副本最多 15 个分摊读压力；与 DMS 打配合可在迁移期保持源库在线不停业务。","s":"源#680"},{"id":"D3-681","d":3,"t":"single","q":"一家公司想要构建、训练和部署机器学习（ML）模型。 哪项 AWS 服务可以满足该公司的需求？","o":[{"l":"A","t":"Amazon Personalize"},{"l":"B","t":"Amazon Comprehend"},{"l":"C","t":"Amazon Forecast"},{"l":"D","t":"Amazon SageMaker"}],"a":["D"],"e":"**✅ 为什么 D. Amazon SageMaker 对**：SageMaker 一站式覆盖 ML 全流程——构建（笔记本与特征工程）、训练（托管训练集群）、部署（实时端点），「构建、训练和部署」三连词就是其产品定位原话。\n**❌ 为什么其他选项错**：\n- A. Personalize：现成推荐系统，无需建模\n- B. Comprehend：现成 NLP 文本分析\n- C. Forecast：现成时序预测\n**📌 关键概念**：自己建模走全流程=SageMaker；直接调用成品能力=AI 应用服务（Personalize/Comprehend/Forecast 等）。「build, train, deploy」官方口号与题干逐字对应，秒选不犹豫。SageMaker Studio 一体化 IDE 覆盖全流程，Ground Truth 标数据、Pipelines 编排、Model Monitor 盯漂移；Canvas 给无代码人员可视建模。","s":"源#681"},{"id":"D3-682","d":3,"t":"single","q":"哪项 AWS 服务或工具提供建议，帮助用户根据历史工作负载使用数据来调整Amazon EC2 实例的大小？","o":[{"l":"A","t":"AWS Pricing Calculator"},{"l":"B","t":"AWS Compute Optimizer"},{"l":"C","t":"AWS App Runner"},{"l":"D","t":"AWS Systems Manager"}],"a":["B"],"e":"**✅ 为什么 B. AWS Compute Optimizer 对**：Compute Optimizer 用机器学习分析 EC2/ASG/EBS/Lambda 的历史用量指标，输出规格优化建议（升配/降配/换族），right-sizing 首选，「根据历史工作负载使用数据调整大小」正中。\n**❌ 为什么其他选项错**：\n- A. Pricing Calculator：手工报价估算，不看真实用量\n- C. App Runner：容器部署服务\n- D. Systems Manager：运维编排与打补丁\n**📌 关键概念**：right-sizing=Compute Optimizer（免费开启）；Cost Explorer 看花费、CO 看规格。「历史使用数据+调整建议」组合是 CO 题眼，与 Trusted Advisor 成本检查类考点区分。Compute Optimizer 建议分四档（超配/欠配/最优/未评估），可设偏好（如省成本优先）；ENI/ASG/EBS/Lambda 四类资源都在建议范围。","s":"源#682"},{"id":"D3-683","d":3,"t":"single","q":"一家公司想要通过使用编程语言来探索和分析 Amazon S3 中的数据。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon Kendra"},{"l":"B","t":"Amazon Athena"},{"l":"C","t":"Amazon Comprehend"},{"l":"D","t":"Amazon SageMaker"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Athena 对**：Athena 无服务器、标准 SQL 即查 S3 数据，支持 JDBC 驱动与 SDK 编程接入，「通过编程语言探索和分析 S3」正中；按扫描数据量计费，免建集群。\n**❌ 为什么其他选项错**：\n- A. Kendra：智能语义搜索（自然语言问答）\n- C. Comprehend：NLP 文本情感实体分析\n- D. SageMaker：建模训练平台\n**📌 关键概念**：S3 上跑 SQL=Athena，配 JDBC/boto3 即可编程调用；交互式即席查询选 Athena（无服务器按扫描计费），固定重度分析建 Redshift 数仓。Glue 负责目录与 ETL 配套。Athena 无服务器免建集群，按扫描 TB 计费，分区裁剪+列存格式（Parquet）可省数倍成本；引擎可切 Trino/Presto/Spark 三种。","s":"源#683"},{"id":"D3-689","d":3,"t":"single","q":"哪种类型的工作负载应该在 Amazon EC2 Spot 实例上运行？","o":[{"l":"A","t":"需要特定 EC2 实例配置且长时间稳定运行的工作负载。"},{"l":"B","t":"可以中断且对成本敏感的工作负载。"},{"l":"C","t":"不需要长期承诺的稳定工作负载。"},{"l":"D","t":"不能中断且对成本敏感的工作负载。"}],"a":["B"],"e":"**✅ 为什么 B. 可以中断且对成本敏感的工作负载。对**：Spot 用云端闲散容量，最高约 90% 折扣，代价是收到两分钟回收通知即让出实例，正适合可容错断点续传的省钱负载，「可中断+成本敏感」两词即定义。\n**❌ 为什么其他选项错**：\n- A. 特定配置长期稳定运行：选预留实例/节省计划\n- C. 稳定不需长期承诺：按需实例即可\n- D. 不能中断：与 Spot 可被回收的特性正面冲突\n**📌 关键概念**：Spot 两面=最便宜+可能被中断（2 分钟预警）；批处理、渲染、CI 构建、基因测序是典型场景。D 选项是反向陷阱，把「不能」换成「可以」才是正确表述。","s":"源#689"},{"id":"D3-691","d":3,"t":"single","q":"对于哪种用例，Amazon EC2 按需实例最具成本效益？","o":[{"l":"A","t":"需要可重启的计算密集型视频转码，如果必要的话。"},{"l":"B","t":"连续使用 1 个月进行质量保证测试的实例。"},{"l":"C","t":"将运行 1 年的 Web 服务器实例。"},{"l":"D","t":"将运行 3 年的数据库实例。"}],"a":["B"],"e":"**✅ 为什么 B. 连续使用 1 个月进行质量保证测试的实例。对**：QA 测试属短期负载，1 个月连续运行配按需实例零承诺、随停随关，时间上不到预留的划算门槛，也不能容忍测试中断风险，按需最优。\n**❌ 为什么其他选项错**：\n- A. 可重启的视频转码：可中断+容错，Spot 折扣更大更划算\n- C. 运行 1 年的 Web 服务器：长期稳定，RI/SP 有大幅折扣\n- D. 运行 3 年的数据库：更长周期承诺，RI/SP 全额预付折扣最深\n**📌 关键概念**：购买选项按「时长×中断容忍」分岔——1 个月以内的短期测试用按需；1~3 年稳定用 RI/SP；可中断用 Spot。A 与 B 的区别就在「能不能断」，A 能断就该选更便宜的 Spot。","s":"源#691"},{"id":"D3-692","d":3,"t":"single","q":"一家公司开发了一个新的内部应用程序。该公司没有办法确定或预测该应用程序将产生的使用需求。该公司正在寻求 AWS 云计算的哪个好处？","o":[{"l":"A","t":"易于使用"},{"l":"B","t":"成本效益"},{"l":"C","t":"安全"},{"l":"D","t":"可扩展性和高性能"}],"a":["D"],"e":"**✅ 为什么 D. 可扩展性和高性能 对**：需求无法预测时，云的价值在于随负载自动扩容缩容，流量洪峰照样撑住、低谷不浪费，这正是「无法确定或预测使用需求」场景所依赖的能力。\n**❌ 为什么其他选项错**：\n- A. 易于使用：讲的是上手门槛低\n- B. 成本效益：讲按用量付费不买硬件\n- C. 安全：讲基础设施与合规防护\n**📌 关键概念**：六优势对号入座——需求不可预测→弹性伸缩与高性能（云按需调用海量资源）；省钱诉求→成本效益；易用讲界面、安全讲防护。题干「无法确定或预测」直指伸缩能力。","s":"源#692"},{"id":"D3-694","d":3,"t":"single","q":"一家公司计划雇用新员工，这些员工将远程工作。该公司需要设置 Windows 虚拟桌面，为新员工创建工作环境。员工必须能够从任何地方使用他们的计算机或网络浏览器访问工作环境。 哪项AWS 服务或功能将满足这些要求？","o":[{"l":"A","t":"专用主机"},{"l":"B","t":"AWS Global Accelerator"},{"l":"C","t":"Amazon Workspaces"},{"l":"D","t":"Amazon CloudFront"}],"a":["C"],"e":"**✅ 为什么 C. Amazon Workspaces 对**：WorkSpaces 是 DaaS 桌面即服务，云端开 Windows 虚拟桌面，员工用任意电脑或浏览器远程接入，「Windows 虚拟桌面+远程访问」双关键词正中其定位。\n**❌ 为什么其他选项错**：\n- A. 专用主机：EC2 物理机独占，是裸算力非桌面方案\n- B. Global Accelerator：网络加速\n- D. CloudFront：CDN 分发\n**📌 关键概念**：虚拟桌面=WorkSpaces（Windows/Amazon Linux，按月计费，可接 AD）；浏览器内按需流式桌面是 WorkSpaces Web。新员工集中开通、外包/远程办公场景的标配答案。WorkSpaces 按月（含免费月度套餐换算）或按小时计费，可与 AD/目录服务集成单点登录，Root 卷加密支持；应用清单用 Amazon WorkDocs 补充。","s":"源#694"},{"id":"D3-696","d":3,"t":"single","q":"哪项 AWS 服务支持 MySQL 数据库引擎？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"Amazon DocumentDB（与 MongoDB 兼容）"},{"l":"D","t":"Amazon ElastiCache"}],"a":["B"],"e":"**✅ 为什么 B. Amazon RDS 对**：RDS 支持 MySQL、PostgreSQL、MariaDB、Oracle、SQL Server、Aurora 引擎等，是托管关系型库的唯一正主，「支持 MySQL 数据库引擎」直查引擎支持表即中。\n**❌ 为什么其他选项错**：\n- A. DynamoDB：NoSQL 键值库\n- C. DocumentDB：MongoDB 兼容的文档库\n- D. ElastiCache：内存缓存（Redis/Memcached）\n**📌 关键概念**：引擎速记——关系型（含 MySQL）=RDS/Aurora；NoSQL=DynamoDB/DocumentDB/Neptune；缓存=ElastiCache。凡题干点名具体 SQL 引擎，答案基本锁定 RDS（或 Aurora）。RDS 免费层含 750 小时 db.t3micro 等，Aurora 无免费层但性能与存储自动伸缩；MySQL 8.0/5.7 等版本按区域可用性选择。RDS 控制台一键选引擎版本、实例规格与存储类型（gp2/gp3/io1），维护窗口与备份窗口可自定义；Aurora 存储自动六副本三 AZ，MySQL 兼容版性能最高五倍于自建 MySQL。","s":"源#696"},{"id":"D3-697","d":3,"t":"single","q":"一家公司为其在 AWS 云中的工作负载购买了 Amazon EC2 标准预留实例（RIs）。该公司需要将部分工作负载转移到与这些标准 RIs 的实例家族不匹配的实例家族。 该公司如何利用不再需要的标准RIs？","o":[{"l":"A","t":"联系 AWS 支持团队，要求他们出售标准 RIs。"},{"l":"B","t":"在 Amazon EC2 预留实例市场上出售标准 RIs。"},{"l":"C","t":"作为第三方卖家在 AWS 市场上出售标准 RIs。"},{"l":"D","t":"将标准 RIs 转换为储蓄计划。"}],"a":["B"],"e":"**✅ 为什么 B. 在 Amazon EC2 预留实例市场上出售标准 RIs。对**：标准 RI 可在 AWS 官方的预留实例 Marketplace 挂单转售给其他客户，回收部分沉没成本，官方支持的标准出口。\n**❌ 为什么其他选项错**：\n- A. 联系支持团队代售：支持团队不提供代售服务\n- C. 作为第三方卖家在 AWS 市场上出售：RI 转售走 RI Marketplace，非通用 Marketplace\n- D. 转换为储蓄计划：RI 不可反向转为 Savings Plans\n**📌 关键概念**：标准 RI 可转售（RI Marketplace）；可转换 RI 不可转售但可换族换规格；SP 无转让机制。「卖掉不用的 RI」只有 B 一条官方路径，与 D3-701 购买选项考点呼应。","s":"源#697"},{"id":"D3-699","d":3,"t":"single","q":"一家公司希望通过为员工提供一种搜索问题并检索特定答案的方式来提高员工生产力。该公司希望使用一个单一的智能搜索界面。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon Connect"},{"l":"B","t":"Amazon Kendra"},{"l":"C","t":"Amazon Lex"},{"l":"D","t":"Amazon Comprehend"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Kendra 对**：Kendra 是企业智能搜索，用自然语言提问即从文档、Wiki、知识库中提取精准答案段落，「搜索问题并检索特定答案+单一智能搜索界面」正中其定位。\n**❌ 为什么其他选项错**：\n- A. Connect：云联络中心\n- C. Lex：对话机器人构建（ Alexa 同款引擎）\n- D. Comprehend：NLP 文本分析非搜索\n**📌 关键概念**：企业文档智能问答=Kendra（语义理解，非关键词匹配）；面向客户聊天机器人=Lex；NLP 分析=Comprehend。「智能搜索/一问一答」题眼区分三兄弟，与 D3-683 Athena 的 SQL 查询形成对照。Kendra 按索引存储与查询次数计费，增量爬取支持 30+ 数据源（S3/SharePoint/Confluence 等），反馈学习让排序越用越准。","s":"源#699"},{"id":"D3-700","d":3,"t":"single","q":"一家公司希望获得一个 Amazon S3 解决方案，该解决方案能够在个位数毫秒内提供对对象存储的访问。哪项解决方案将满足这些要求？","o":[{"l":"A","t":"S3 Express One Zone"},{"l":"B","t":"S3 Standard"},{"l":"C","t":"S3 Glacier Flexible Retrieval"},{"l":"D","t":"S3 Glacier Instant Retrieval"}],"a":["A"],"e":"**✅ 为什么 A. S3 Express One Zone 对**：S3 Express One Zone 是专为延迟敏感负载设计的新存储类，个位数毫秒级访问，比标准层快约 10 倍，「个位数毫秒内访问对象存储」正是其独有指标。\n**❌ 为什么其他选项错**：\n- B. S3 Standard：毫秒级（数十毫秒量级）但非个位数极致档\n- C. Glacier Flexible Retrieval：取回分钟到小时级\n- D. Glacier Instant Retrieval：毫秒级但针对冷数据的低频访问\n**📌 关键概念**：延迟榜——S3 Express One Zone（个位数毫秒）> Standard ≈ Glacier IR（数十毫秒）> Glacier 家族（分钟起）；Express One Zone 单 AZ 布局+连接池加持，HPC/分析/推理缓存场景。S3 Express One Zone 默认单 AZ 但可镜像到另一桶做容灾，Directory Bucket 命名规则与普通桶不同；对象级缓存与条件请求进一步压延迟。","s":"源#700"},{"id":"D3-701","d":3,"t":"multiple","q":"一家公司在 AWS 上全天候运行不间断的 Amazon EC2 工作负载。该公司将需要在接下来的12 个月内使用相同的实例系列和实例类型来运行工作负载。公司应该选择哪种购买选项组合以最大程度优化成本？（选择两个）","o":[{"l":"A","t":"标准预留实例"},{"l":"B","t":"可转换预留实例"},{"l":"C","t":"计算节省计划"},{"l":"D","t":"现货实例"},{"l":"E","t":"全额预付"}],"a":["A","E"],"e":"**✅ 为什么 A、E 对**：\n- A. 标准预留实例：全天候运行+12 个月固定实例系列类型，满足 RI 稳定承诺前提，标准 RI 比 Convertible RI 折扣更深\n- E. 全额预付：同样 1 年期下 All Upfront 比 No/Partial Upfront 总成本最低，与固定负载 12 个月承诺叠加最大化省钱\n**❌ 为什么其他选项错**：\n- B. 可转换预留实例：允许换族换规格但折扣浅于标准 RI，题干明确系列类型固定用不上其灵活性\n- C. 计算节省计划：灵活换实例族，但固定单一负载场景折扣率不如标准 RI 深榨干\n- D. 现货实例：全天候不间断负载不可承受回收中断风险\n**📌 关键概念**：全天候+固定类型+1 年期=标准 RI + All Upfront 组合拳最优；SP 的灵活性溢价在负载完全固定时不划算；Spot 与「不间断」互斥。原 e 为占位符，本解析按口径重写。","s":"源#701"},{"id":"D3-702","d":3,"t":"single","q":"一家公司希望运行其应用程序代码，而无需提供和管理服务器。 哪个 AWS 服务能满足这一要求？","o":[{"l":"A","t":"AWS Glue"},{"l":"B","t":"AWS Lambda"},{"l":"C","t":"AWS CodeDeploy"},{"l":"D","t":"Amazon CodeGuru"}],"a":["B"],"e":"**✅ 为什么 B. AWS Lambda 对**：Lambda 是无服务器计算服务，上传代码即响应事件运行，运行环境由 AWS 全权管理，「无需提供和管理服务器」就是 FaaS 的定义级描述。\n**❌ 为什么其他选项错**：\n- A. AWS Glue：托管 ETL 抽取转换作业\n- C. CodeDeploy：部署编排工具\n- D. CodeGuru：代码评审与性能画像\n**📌 关键概念**：「运行代码不用管服务器」=Lambda（按调用次数+执行时长计费，毫秒级计费粒度）；Glue/CodeDeploy/CodeGuru 分别管数据流水线、发布、代码质量，均非计算服务。与 D3-708 计费场景考点同源。Lambda 内存 128MB~10GB 线性可调，CPU 与内存同步分配，冷启动可用预置并发消除；别名+加权发布支持金丝雀流量切换。","s":"源#702"},{"id":"D3-707","d":3,"t":"single","q":"一家公司已经在应用程序负载均衡器后部署了几个公共应用程序。公司希望提高应用程序的性能。哪个 AWS 服务能满足这些要求？","o":[{"l":"A","t":"AWS 全球加速器"},{"l":"B","t":"Amazon Connect"},{"l":"C","t":"Amazon ElastiCache"},{"l":"D","t":"Amazon CloudWatch"}],"a":["A"],"e":"**✅ 为什么 A. AWS 全球加速器 对**：Global Accelerator 借 AWS 全球骨干网把用户流量引到 ALB 等端点的最优位置，绕开拥堵公网，全球用户访问速度全面提升，「提升 ALB 后应用性能」正中。\n**❌ 为什么其他选项错**：\n- B. Connect：联络中心服务\n- C. ElastiCache：数据库前加内存缓存（应用层提速）\n- D. CloudWatch：监控告警\n**📌 关键概念**：网络路径加速=GA（Anycast 静态 IP+全球骨干，计费按 DTX）；应用层数据提速=CloudFront（内容缓存）；计算/数据库层提速=ElastiCache。三层提速工具按题干对象选。GA 提供两个静态 Anycast IP 接入边缘，客户端流量就近入 AWS 骨干；按 DTX（目的流量出方向）计费，健康检查自动摘除故障端点。","s":"源#707"},{"id":"D3-708","d":3,"t":"single","q":"一家公司有一个本地应用程序。该应用程序的处理时间少于 5 分钟，并且每天只被调用几次。公司希望将应用程序迁移到 AWS 云。 哪个 AWS 服务将最经济有效地支持这个应用程序？","o":[{"l":"A","t":"Amazon ECS（Amazon ECS）"},{"l":"B","t":"AWS Lambda"},{"l":"C","t":"Amazon EKS（Amazon EKS）"},{"l":"D","t":"Amazon EC2"}],"a":["B"],"e":"**✅ 为什么 B. AWS Lambda 对**：处理 5 分钟内、日调用寥寥数次的小程序，Lambda 按实际执行时长毫秒计费，空闲期零成本，服务器容器常驻付费方案在低频场景反而贵，「短时+低频+最省钱」三词锁定。\n**❌ 为什么其他选项错**：\n- A. ECS：容器集群，常驻付费\n- C. EKS：K8s 集群，控制面与节点均常驻付费\n- D. EC2：虚拟机常开常收费\n**📌 关键概念**：低频短任务计费对比——Lambda 毫秒计费零闲置成本；ECS/EKS/EC2 均有常驻资源开销。Lambda 单次执行上限 15 分钟，题干「少于 5 分钟」特意落在安全区，与 D3-702 同族考点。","s":"源#708"},{"id":"D3-710","d":3,"t":"single","q":"一家公司希望整合其呼叫中心，以改善与呼叫中心代理的客户语音和聊天体验。哪个AWS 服务或工具能满足这些要求？","o":[{"l":"A","t":"Amazon SNS（Amazon SNS）"},{"l":"B","t":"AWS 支持中心"},{"l":"C","t":"Amazon Cognito"},{"l":"D","t":"Amazon Connect"}],"a":["D"],"e":"**✅ 为什么 D. Amazon Connect 对**：Connect 是云联络中心（联络中心即服务），自带全渠道接入、客服坐席管理与 IVR 编排，整合呼叫中心语音/聊天体验正是其核心场景。\n**❌ 为什么其他选项错**：\n- A. SNS：消息主题推送\n- B. AWS 支持中心：客户向 AWS 提工单的入口\n- C. Cognito：应用用户注册登录认证\n**📌 关键概念**：呼叫中心/坐席/客服机器人=Connect（可配 Lex 机器人与 Contact Lens 分析）；SNS 推消息、Support Center 是 AWS 自家售后、Cognito 管 App 用户池。「联络中心」字眼秒选 Connect。Connect 开通几分钟、按坐席与通话分钟计费，Contact Lens 自动质检（情绪/关键词），与 Lex 机器人、Lambda 流程编排深度联动。","s":"源#710"},{"id":"D3-712","d":3,"t":"single","q":"哪个 AWS 服务可以将 Amazon EC2 实例从一个 AWS 区域迁移到另一个？","o":[{"l":"A","t":"AWS 应用迁移服务"},{"l":"B","t":"AWS 数据库迁移服务（AWS DMS）"},{"l":"C","t":"AWS 数据同步"},{"l":"D","t":"AWS 迁移中心"}],"a":["A"],"e":"**✅ 为什么 A. AWS 应用迁移服务 对**：MGN 基于块级持续复制迁移整个 EC2 实例，目标端可在另一 AWS 区域，区域间迁移实例是其能力范围，「EC2 实例跨区域迁移」正中。\n**❌ 为什么其他选项错**：\n- B. DMS：只迁数据库\n- C. DataSync：迁移文件系统数据，不迁整机\n- D. 迁移中心：迁移项目的统一跟踪门户，不执行数据搬迁\n**📌 关键概念**：迁移全家桶=App Migration Service（整机）/DMS（库）/DataSync（文件）；Migration Hub 只做进度聚合不搬东西。「实例级跨区」唯 MGN 能做，与 D3-661 本地迁入场景同族。MGN 源端 Agent 支持跨区持续复制，目标实例启动模板可预先调整实例类型；迁移 Hub 汇总多地迁移进度做统一看板。","s":"源#712"},{"id":"D3-714","d":3,"t":"single","q":"一家公司希望在 Amazon EC2 实例上运行其应用程序。公司需要将应用程序保留在本地以满足合规要求。 哪个 AWS 提供能满足这些要求？","o":[{"l":"A","t":"专用实例"},{"l":"B","t":"Amazon CloudFront"},{"l":"C","t":"AWS Fargate"},{"l":"D","t":"AWS Outposts"}],"a":["D"],"e":"**✅ 为什么 D. AWS Outposts 对**：Outposts 把 AWS 硬件与服务原样延伸进本地机房，本地跑 EC2 但仍用 AWS API 与控制台管理，合规要求数据不出境不出楼的应用首选，「本地运行 EC2+合规」双词锁定。\n**❌ 为什么其他选项错**：\n- A. 专用实例：云上单租户物理隔离，物理位置仍在 AWS 区域\n- B. CloudFront：边缘内容分发\n- C. Fargate：云上容器引擎，非本地形态\n**📌 关键概念**：本地+AWS 体验=Outposts（42U 机柜）；专用实例只保隔离不保位置。数据主权/低延迟/法规滞留三场景选 Outposts，与 D3-600 工厂低延迟场景同族。","s":"源#714"},{"id":"D3-715","d":3,"t":"single","q":"一家公司希望连接其支持的 AWS 服务和 VPC。公司不希望将其内部流量暴露给公共互联网。哪个AWS 服务能满足这些要求？","o":[{"l":"A","t":"Amazon Inspector"},{"l":"B","t":"AWS PrivateLink"},{"l":"C","t":"Amazon Connect"},{"l":"D","t":"AWS 互联网网关"}],"a":["B"],"e":"**✅ 为什么 B. AWS PrivateLink 对**：PrivateLink 提供 VPC 与 AWS 服务间的私有直连，流量全程走 AWS 内网不出公网，「连接 AWS 服务和 VPC+不暴露公网」双关键词正中。\n**❌ 为什么其他选项错**：\n- A. Inspector：漏洞扫描\n- C. Connect：联络中心\n- D. 互联网网关：恰恰是 VPC 出公网的总闸\n**📌 关键概念**：私网访问服务三件套——PrivateLink（接口型，第三方服务也可私有暴露）/VPC 端点（网关型，S3/DynamoDB 免费）/Direct Connect（连本地）。IGW 是反面答案。PrivateLink 流量不出 AWS 网络，服务方在自己 VPC 暴露 NLB 端点服务即可；接口端点按小时+数据处理费计费，网关端点对 S3/DynamoDB 免费。","s":"源#715"},{"id":"D3-718","d":3,"t":"single","q":"一家公司想要部署一个存储数据在关系数据库中的应用程序。公司希望数据库任务，如自动备份和数据库快照，由 AWS 管理。 哪个 AWS 服务能满足这些要求？","o":[{"l":"A","t":"Amazon DocumentDB"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"Amazon EBS (Amazon EBS)"},{"l":"D","t":"Amazon S3"}],"a":["B"],"e":"**✅ 为什么 B. Amazon RDS 对**：RDS 自动接管关系型数据库的备份、快照、补丁、故障切换等管理任务，客户只管用库，「关系型+自动备份+快照由 AWS 管理」三关键词全部命中。\n**❌ 为什么其他选项错**：\n- A. DocumentDB：MongoDB 兼容文档库，非关系型\n- C. EBS：块存储卷，不是数据库\n- D. S3：对象存储，无数据库引擎\n**📌 关键概念**：托管关系库=RDS（自动备份保留期可设，手动快照随时建）；要 MySQL/PostgreSQL 极致性能升级 Aurora。「关系型+托管」组合是 RDS 专属答案，本题是 B17 域3 的收官压轴题。RDS 自动备份默认保留 7 天（最长 35 天），点时间恢复（PITR）精确到 5 秒内；快照与备份互补，跨区域复制实现异地容灾。","s":"源#718"},{"id":"D4-011","d":4,"t":"single","q":"用户将本地工作负载迁移到 AWS 云时会体验到以下哪个优势？","o":[{"l":"A","t":"消除了运行和维护数据中心的费用"},{"l":"B","t":"与硬件供应商提供的折扣相同的价格折扣"},{"l":"C","t":"将所有运营控制权分配给 AWS"},{"l":"D","t":"消除了运营费用"}],"a":["A"],"e":"**✅ 为什么 A. 消除了运行和维护数据中心的费用 对**：迁云后机房租用、电力制冷、硬件折旧与设施运维等资本开支（CapEx）整体消失，转为按用付费，这是「消除数据中心费用」的直接收益。\n**❌ 为什么其他选项错**：\n- B. 硬件供应商同等折扣：AWS 折扣来自规模经济，与硬件厂商折扣体系无关\n- C. 运营控制权全给 AWS：客户仍管理 OS、应用与数据，控制权并未让渡\n- D. 消除运营费用：运营费用依旧存在，只是从固定转为可变\n**📌 关键概念**：迁云价值=CapEx 变 OpEx（不买设备按需付账）+规模经济（AWS 海量采购摊薄单价）；「消除」的是数据中心级费用而非全部费用，题干限定「运行和维护数据中心」就是答案锚点。","s":"源#11"},{"id":"D4-016","d":4,"t":"single","q":"一个电子学习平台需要每年运行两个月的应用程序。该应用程序将部署在 Amazon EC2 实例上。在这两个月期间必须避免任何应用程序停机。哪种 EC2 购买选项将最符合成本效益地满足这些要求？","o":[{"l":"A","t":"预留实例"},{"l":"B","t":"专用主机"},{"l":"C","t":"现货实例"},{"l":"D","t":"按需实例"}],"a":["D"],"e":"**✅ 为什么 D. 按需实例 对**：每年只跑两个月且期间零容忍停机，按需实例即开即用、无承诺、无中断回收风险，是短期不可中断负载的唯一安全选项。\n**❌ 为什么其他选项错**：\n- A. 预留实例：需 1 年期承诺，10 个月闲置纯浪费\n- B. 专用主机：物理机独占，短期场景性价比最差\n- C. 现货实例：可能被回收中断，与「避免任何停机」冲突\n**📌 关键概念**：购买决策三问——时长多久？可否中断？能否承诺？本题主打「短+不可断」两特征，直接锁按需；现货 90% 折扣再香也不能碰不可中断负载。","s":"源#16"},{"id":"D4-033","d":4,"t":"single","q":"一家公司使用 AWS Batch 运行数千个同时进行的模拟。每个模拟是无状态的、容错的，并且运行时间长达 3 小时。哪种定价模式使公司能够优化成本并满足这些要求？","o":[{"l":"A","t":"预留实例"},{"l":"B","t":"现货实例"},{"l":"C","t":"按需实例"},{"l":"D","t":"专用实例"}],"a":["B"],"e":"**✅ 为什么 B. 现货实例 对**：数千并发模拟无状态、容错、单次 3 小时，可中断重跑成本极低，Spot 用闲置容量给最高 90% 折扣，「容错+可中断+成本优化」三关键词全中。\n**❌ 为什么其他选项错**：\n- A. 预留实例：适合长期稳定负载，短期爆发式并发不匹配\n- C. 按需实例：可中断负载用按需是浪费折扣\n- D. 专用实例：硬件隔离合规诉求，与成本优化无关\n**📌 关键概念**：无状态容错批处理是 Spot 官方推荐场景（Batch/EMR/CI）；Spot 两分钟回收预警+自动补位，中断成本远低于 60~90% 的节省幅度。与 D4-250/D4-272 同族考点。","s":"源#33"},{"id":"D4-040","d":4,"t":"multiple","q":"在 AWS 云中，弹性指的是以下哪些内容？（选择两项。）","o":[{"l":"A","t":"Amazon EC2 实例重新启动的速度"},{"l":"B","t":"需求变化时调整资源的能力"},{"l":"C","t":"Amazon EC2 实例可以使用的最大 RAM 数量"},{"l":"D","t":"按需付费计费模式"},{"l":"E","t":"需要时轻松获取资源的能力"}],"a":["B","E"],"e":"**✅ 为什么 B、E 对**：\n- B. 需求变化时调整资源的能力：弹性核心即随负载伸缩（scale out/in）\n- E. 需要时轻松获取资源的能力：分钟级开通资源同样是弹性的官方定义要素\n\n**❌ 为什么其他选项错**：\n- A. 实例重启速度：属运维指标非弹性概念\n- C. 最大 RAM 数量：是规格上限，与伸缩无关\n- D. 按需付费计费模式：是计费方式，题干问的是资源能力层面\n**📌 关键概念**：AWS 官方对弹性的定义=「按需获取资源+随需求自动调整」，双要素缺一不可；按需付费是弹性的计费伴侣而非弹性本身。与 D3-673 同族，注意概念边界。","s":"源#40"},{"id":"D4-046","d":4,"t":"multiple","q":"一家公司想要为继续使用其生产 Amazon EC2 实例做出前期承诺，以换取整体成本的降低。哪些定价选项满足这些要求且成本最低？（选择两项。）","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"按需实例"},{"l":"C","t":"预留实例"},{"l":"D","t":"储蓄计划"},{"l":"E","t":"专用主机"}],"a":["C","D"],"e":"**✅ 为什么 C、D 对**：\n- C. 预留实例：1~3 年期承诺换最大深度折扣，前期承诺的标志性选项\n- D. 储蓄计划：承诺小时用量换最高 72% 折扣，承诺换低价的另一形态\n\n**❌ 为什么其他选项错**：\n- A. 现货实例：零承诺，代价是可能被中断\n- B. 按需实例：零承诺零折扣，正是被承诺折扣对比的基准\n- E. 专用主机：物理机独占租用，非折扣承诺机制\n**📌 关键概念**：承诺换折扣的两兄弟=RI（承诺具体实例配置）与 SP（承诺用量金额，跨实例族灵活）；「前期承诺+整体成本降低」双词锁定这两项，题眼在「承诺」。","s":"源#46"},{"id":"D4-048","d":4,"t":"single","q":"一家公司正在探索使用 AWS 云，并且需要在基础设施配置之前为一个项目创建成本估算。公司可以使用哪个 AWS 服务或功能来在部署前估算成本？","o":[{"l":"A","t":"AWS 免费层"},{"l":"B","t":"AWS 定价计算器"},{"l":"C","t":"AWS 计费和成本管理"},{"l":"D","t":"AWS 成本和使用情况报告"}],"a":["B"],"e":"**✅ 为什么 B. AWS 定价计算器 对**：Pricing Calculator 按「还没部署」的假想架构逐项估算月度成本，正是「基础设施配置之前创建成本估算」的专用工具。\n**❌ 为什么其他选项错**：\n- A. 免费层：列免费额度，不做估算\n- C. 计费和成本管理控制台：看已发生的账单\n- D. 成本和使用情况报告：事后精细化账单数据\n**📌 关键概念**：事前估算=Pricing Calculator；事中监控=Budgets/Cost Explorer；事后细账=CUR 报表。「部署前」时间状语是题眼，与 D4-091 同题干家族。计算器支持保存估算链接与团队共享，导出 CSV 供预算评审；免费层与预估月成本可同屏对比，还提供本地环境对照模板，是架构师做方案报价的基本功。","s":"源#48"},{"id":"D4-082","d":4,"t":"multiple","q":"AWS 云服务的合并计费有哪些好处？（选择两项。）","o":[{"l":"A","t":"批量折扣"},{"l":"B","t":"使用的最低额外费用"},{"l":"C","t":"多个账户的单一账单"},{"l":"D","t":"安装付款选项"},{"l":"E","t":"自定义成本和使用预算创建"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A. 批量折扣：多账户用量聚合后达到阶梯折扣线，共享更低单价\n- C. 多个账户的单一账单：一张账单看全组织支出，即合并计费字面功能\n\n**❌ 为什么其他选项错**：\n- B. 使用的最低额外费用：合并计费本身不额外收费\n- D. 安装付款选项：无此说法\n- E. 自定义成本预算创建：那是 Budgets 的功能\n**📌 关键概念**：合并计费（Organizations 内置）两大红利=聚合用量享阶梯折扣（RI/SP 也能跨账户共享）+单一账单统一付款；注意「不再有 100 账户 100 张发票」的管理收益。","s":"源#82"},{"id":"D4-089","d":4,"t":"multiple","q":"以下哪两项是迁移到 AWS 云的优势？","o":[{"l":"A","t":"将所有安全责任转交给 AWS"},{"l":"B","t":"使用按需付费模型"},{"l":"C","t":"对物理基础设施拥有完全控制权"},{"l":"D","t":"不再需要猜测所需的容量"},{"l":"E","t":"不再担心用户访问控制"}],"a":["B","D"],"e":"**✅ 为什么 B、D 对**：\n- B. 按需付费模型：只付实际消耗，无前期投入与长期承诺\n- D. 不再需要猜测容量：云弹性随需伸缩，告别超容量采购与容量不足\n\n**❌ 为什么其他选项错**：\n- A. 全部安全责任转交 AWS：共享责任模型下客户仍管云中安全\n- C. 对物理设施完全控制：恰恰相反，控制权让渡给 AWS\n- E. 无需担心访问控制：IAM 用户权限管理仍是客户责任\n**📌 关键概念**：迁云核心红利=CapEx 变 OpEx（B）+ 去容量猜测（D）+ 全球分钟级部署；但安全、权限、数据治理仍属客户责任域，「全都交给 AWS」类表述永远错。","s":"源#89"},{"id":"D4-091","d":4,"t":"single","q":"一家公司计划迁移到 AWS，并希望为其 AWS 使用案例创建成本估算。公司可以使用哪个AWS 服务或工具来满足这些要求？","o":[{"l":"A","t":"AWS 定价计算器"},{"l":"B","t":"Amazon CloudWatch"},{"l":"C","t":"AWS 成本探索器"},{"l":"D","t":"AWS 预算"}],"a":["A"],"e":"**✅ 为什么 A. AWS 定价计算器 对**：Pricing Calculator 是 Web 版估算工具，按预期服务与用量组合出成本预估，「为使用案例创建成本估算」正是其唯一职责。\n**❌ 为什么其他选项错**：\n- B. CloudWatch：监控告警\n- C. 成本探索器：分析已发生花费\n- D. 预算：设阈值告警\n**📌 关键概念**：成本工具四分工——估算（Pricing Calculator）/分析（Cost Explorer）/告警（Budgets）/明细（CUR）；「估算」二字出现即锁定计算器，本批 D4-048 与其互为镜像题。估算时可逐服务调规格（EC2 实例型/EBS 容量/数据传输量），区域切换即见各地价差；与 Budgets 联动先估算再设阈值，形成事前-事中的成本闭环管理。","s":"源#91"},{"id":"D4-107","d":4,"t":"single","q":"一家公司有多个 AWS 账户，其中包括不能中断的计算工作负载。公司希望获得基于公司使用AWS服务的计费折扣。哪个 AWS 功能或购买选项将满足这些要求？","o":[{"l":"A","t":"资源标记"},{"l":"B","t":"合并计费"},{"l":"C","t":"按需付费定价"},{"l":"D","t":"现货实例"}],"a":["B"],"e":"**✅ 为什么 B. 合并计费 对**：合并计费把多账户用量聚合成单一账单，累计用量触发批量阶梯折扣（含 RI/SP 跨账户共享），「多账户+按使用拿折扣+负载不可中断」三点锁定。\n**❌ 为什么其他选项错**：\n- A. 资源标记：成本归属与追踪，非折扣机制\n- C. 按需付费：默认计价方式，无折扣\n- D. 现货实例：有折扣但可中断，与题干冲突\n**📌 关键概念**：折扣三通道=RI/SP（承诺换折扣）+合并计费（聚合用量换阶梯价）+免费层；「不能中断」排除了 Spot，多账户前提排除单账户选项。","s":"源#107"},{"id":"D4-128","d":4,"t":"multiple","q":"一家公司有一个稳定、可预测且不间断的计算工作负载。哪种 Amazon EC2 实例购买选项最具成本效益？（选择两个。）","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"预留实例"},{"l":"C","t":"竞价实例"},{"l":"D","t":"节省计划"},{"l":"E","t":"专用主机"}],"a":["B","D"],"e":"**✅ 为什么 B、D 对**：\n- B. 预留实例：稳定可预测负载+1~3 年承诺，折扣深且锁定实例配置\n- D. 节省计划：同样承诺换折扣，跨实例族/区域更灵活，适配稳定用量\n\n**❌ 为什么其他选项错**：\n- A. 按需实例：零承诺零折扣，稳定长期负载用它是最大浪费\n- C. 竞价实例：可被中断，与「不间断」冲突\n- E. 专用主机：为合规/许可证场景设计，非成本优化选项\n**📌 关键概念**：稳定+不间断+可预测=RI 或 SP 双正确（考试常一起考）；选 RI 看重具体配置锁死，选 SP 看重灵活性；「最具成本效益+不间断」是双答案题的信号词。","s":"源#128"},{"id":"D4-129","d":4,"t":"single","q":"哪种 Amazon EC2 定价模型对于每年运行一次、持续 24 小时的不间断工作负载最具成本效益？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"预留实例"},{"l":"C","t":"竞价实例"},{"l":"D","t":"专用实例"}],"a":["A"],"e":"**✅ 为什么 A. 按需实例 对**：每年一次、仅 24 小时的工作负载，任何长期承诺都是浪费，按需秒级计费用完即停，是极低频短任务的成本最优解。\n**❌ 为什么其他选项错**：\n- B. 预留实例：1 年期承诺跑 1 天，折扣倒贴\n- C. 竞价实例：虽便宜但可能中断，24 小时不间断任务有风险\n- D. 专用实例：无折扣意义\n**📌 关键概念**：频次极低+时长极短=按需；「每年一次」是极端时间信号词，承诺类选项全部出局；若题干加「可中断」则答案变 Spot，一词之差分野。","s":"源#129"},{"id":"D4-131","d":4,"t":"multiple","q":"一家公司希望将其本地工作负载迁移到 AWS 云。公司希望将工作负载分开，以便向不同的部门收费。哪些 AWS 服务或功能将满足这些要求？（选择两个。）","o":[{"l":"A","t":"放置组"},{"l":"B","t":"合并计费"},{"l":"C","t":"边缘位置"},{"l":"D","t":"AWS Config"},{"l":"E","t":"多个 AWS 账户"}],"a":["B","E"],"e":"**✅ 为什么 B、E 对**：\n- B. 合并计费：多账户统一付款，组织级账单管理的基础\n- E. 多个 AWS 账户：每部门独立账户，天然实现工作负载与成本隔离\n\n**❌ 为什么其他选项错**：\n- A. 放置组：实例物理布局策略\n- C. 边缘位置：CDN 概念\n- D. AWS Config：资源配置审计\n**📌 关键概念**：部门分账标准架构=Organizations 统辖多账户+合并计费+成本分配标签；账户即天然的权限/账单/资源隔离边界。「分开工作负载+向部门收费」双诉求对应双答案。配套实践：账户名与邮箱按部门规范命名，SCPs 限定各部门可用服务，成本分配标签在账户内再细分环境与应用，三层结构支撑精细化财务分账与治理。","s":"源#131"},{"id":"D4-133","d":4,"t":"single","q":"使用 AWS 进行云计算的一个好处是什么？","o":[{"l":"A","t":"将可变成本转换为固定成本"},{"l":"B","t":"按需付费定价"},{"l":"C","t":"降低速度和敏捷性"},{"l":"D","t":"花钱运行和维护数据中心"}],"a":["B"],"e":"**✅ 为什么 B. 按需付费定价 对**：按需付费让客户只付实际消耗，无需任何前期采购与长期承诺，把重资产投入变成随用随付，是云计算最核心的计费优势。\n**❌ 为什么其他选项错**：\n- A. 可变转固定：方向反了，云是固定转可变\n- C. 降低速度与敏捷性：云提升而非降低敏捷性\n- D. 花钱维护数据中心：那是自建模式的开销\n**📌 关键概念**：六优势正反辨析——正向：按需付费/规模化经济/弹性/敏捷/全球部署/高可用；反向陷阱词（降低敏捷/固定成本/维护机房）一律排除。B 选项是「好处」类考题的默认正确答案。","s":"源#133"},{"id":"D4-135","d":4,"t":"single","q":"一家公司正在评估其 AWS 商业支持计划，以确定该计划是否仍满足公司的需要。公司正在考虑切换到 AWS 企业支持。有了 AWS 企业支持，公司将获得哪些额外好处？","o":[{"l":"A","t":"一套完整的 AWS Trusted Advisor 检查"},{"l":"B","t":"电话、电子邮件和聊天访问云支持工程师，每周 7 天，每天 24 小时"},{"l":"C","t":"指定的技术账户经理（TAM）协助监控和优化"},{"l":"D","t":"为公司的应用程序提供咨询审查和架构指导"}],"a":["C"],"e":"**✅ 为什么 C. 指定的技术账户经理（TAM）对**：企业支持独有 TAM，专属跟进架构审查、主动监控与成本优化建议，是商 поддержка 到企业支持最显著的增值项。\n**❌ 为什么其他选项错**：\n- A. 完整 Trusted Advisor 检查：企业支持含全部检查，但商支持已含大部分（7 项核心检查全有）\n- B. 7×24 电话邮件聊天：商支持同样提供全渠道接入\n- D. 架构咨询审查指导：属于 TAM 职责的组成部分，C 更全面准确\n**📌 关键概念**：支持计划阶梯=基础（免费）/开发者（办公时间）/商业（7×24 全渠道+全 TA 检查）/企业（+TAM+15 分钟响应+架构审查）；「额外」二字要求选企业独有项。","s":"源#135"},{"id":"D4-136","d":4,"t":"single","q":"哪种定价模型会在容量暂时不可用时中断运行中的 Amazon EC2 实例？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"标准预留实例"},{"l":"C","t":"竞价实例"},{"l":"D","t":"可转换预留实例"}],"a":["C"],"e":"**✅ 为什么 C. 竞价实例 对**：Spot 实例在价格超限或容量回收时会被两分钟预警中断，正是「容量暂时不可用时中断运行」的定义描述。\n**❌ 为什么其他选项错**：\n- A. 按需实例：容量有保障，不会被回收中断\n- B. 标准预留实例：全程锁定容量\n- D. 可转换预留实例：同样属于承诺型，无中断机制\n**📌 关键概念**：只有 Spot 有「两分钟回收通知」机制；Spot 价格随供需浮动，出价低于市价或 EC2 需要容量时触发回收。「会中断」是 Spot 的身份证。","s":"源#136"},{"id":"D4-141","d":4,"t":"single","q":"哪种 AWS 云服务可以在超出自定义支出阈值时向客户发送警报？","o":[{"l":"A","t":"AWS Budgets"},{"l":"B","t":"AWS Cost Explorer"},{"l":"C","t":"AWS 成本分配标签"},{"l":"D","t":"AWS 组织"}],"a":["A"],"e":"**✅ 为什么 A. AWS Budgets 对**：Budgets 支持设定自定义支出/用量阈值，超限即发通知（邮件/SNS），「超出阈值发送警报」正是其核心功能定义。\n**❌ 为什么其他选项错**：\n- B. Cost Explorer：花费分析与趋势图，不主动报警\n- C. 成本分配标签：成本归属打标，非告警工具\n- D. AWS 组织：多账户治理，不监控单账户支出\n**📌 关键概念**：告警=Budgets（主动通知）/分析=Cost Explorer（被动看图）/异常侦测=CAD（AI 找突变）；「警报/告警/通知」字眼是 Budgets 题眼，与 D4-264 同族。预算类型除成本外还有用量/RI 利用率/SP 覆盖率；实际 vs 预算按日刷新，80% 提前预警留出处置时间，配合 Cost Explorer 下钻定位超支根因。","s":"源#141"},{"id":"D4-144","d":4,"t":"single","q":"一家公司需要在 Amazon EC2 实例上连续运行一个实验性工作负载，并在 12 小时后停止该实例。哪种实例购买选项将最具成本效益地满足此要求？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"预留实例"},{"l":"C","t":"竞价实例"},{"l":"D","t":"专用实例"}],"a":["A"],"e":"**✅ 为什么 A. 按需实例 对**：实验性负载连跑 12 小时后即停，按需秒级计费无承诺，实验性质也排除了长期折扣选项的适用性。\n**❌ 为什么其他选项错**：\n- B. 预留实例：1 年期承诺为 12 小时任务买单，严重浪费\n- C. 竞价实例：有更便宜的可能性，但实验中断重跑会引入额外复杂度（题干未说可中断）\n- D. 专用实例：无折扣逻辑\n**📌 关键概念**：实验/试点/PoC 类负载=按需（短+不可预期+不承诺）；12 小时是明确短时信号；「实验性」暗示需求不确定，承诺型与竞价型双双出局。","s":"源#144"},{"id":"D4-162","d":4,"t":"single","q":"一家公司计划将其应用程序迁移到 AWS，并在 Amazon EC2 实例上运行该应用程序。该应用程序将连续使用 1 年。哪种 EC2 实例购买选项将最具成本效益地满足这些要求？","o":[{"l":"A","t":"预留实例"},{"l":"B","t":"竞价实例"},{"l":"C","t":"按需实例"},{"l":"D","t":"专用主机"}],"a":["A"],"e":"**✅ 为什么 A. 预留实例 对**：应用连续跑满 1 年，稳定可预测，RI 用 1 年期承诺换约 40% 折扣，是长期连续负载的标准省钱选项。\n**❌ 为什么其他选项错**：\n- B. 竞价实例：可能被中断，无法保证 1 年连续\n- C. 按需实例：连续 1 年用按需比 RI 贵约 40%，成本劣势明显\n- D. 专用主机：物理独占贵，非成本优化选择\n**📌 关键概念**：连续 1 年=RI 的教科书场景（1 年期比 3 年期折扣略浅但仍远优于按需）；题干「连续使用 1 年」是 RI 题眼，与 D4-230/D4-266/D4-281 组成 RI 家族题组。付款档位选 All Upfront 总价最低；若实例需求后续有变，标准 RI 可在 RI Marketplace 转售回血；1 年期满自动转按需，续期需重新评估。","s":"源#162"},{"id":"D4-178","d":4,"t":"single","q":"一家公司计划将其应用程序迁移到 AWS 云。公司应该使用哪个 AWS 工具或一组资源来分析和评估其迁移的准备情况？","o":[{"l":"A","t":"AWS 云采用框架（AWS CAF）"},{"l":"B","t":"AWS 定价计算器"},{"l":"C","t":"AWS Well-Architected Framework"},{"l":"D","t":"AWS 预算"}],"a":["A"],"e":"**✅ 为什么 A. AWS 云采用框架（AWS CAF）对**：CAF 从六大视角（业务/人员/治理/平台/安全/运营）系统性评估组织上云就绪度，识别能力缺口，「分析和评估迁移准备情况」正是其定位。\n**❌ 为什么其他选项错**：\n- B. 定价计算器：只算钱\n- C. Well-Architected Framework：评估已在云上架构的质量，不评迁移准备度\n- D. 预算：支出管控\n**📌 关键概念**：CAF=上云前体检（组织流程人员就绪度）；WAF=云上架构体检（六大支柱）；「迁移准备/ready/评估流程」对应 CAF，「架构质量/支柱」对应 WAF。CAF 六视角两两配对（业务-人员-治理 vs 平台-安全-运营），输出能力差距与改造路线图；迁移评估工具（Migration Evaluator）可配合补充 TCO 测算。","s":"源#178"},{"id":"D4-180","d":4,"t":"single","q":"以下哪种 AWS 好处是通过按需技术服务实现的，使公司能够用可变成本来替代前期固定支出？","o":[{"l":"A","t":"高可用性"},{"l":"B","t":"规模经济"},{"l":"C","t":"按需付费定价"},{"l":"D","t":"全球覆盖"}],"a":["C"],"e":"**✅ 为什么 C. 按需付费定价 对**：按需付费把「先买服务器再等业务」的固定资本支出，替换成「用了才付钱」的可变运营支出，题干「可变成本替代前期固定支出」逐字命中。\n**❌ 为什么其他选项错**：\n- A. 高可用性：讲故障容忍与连续性\n- B. 规模经济：讲 AWS 采购摊薄带来的低价\n- D. 全球覆盖：讲区域与边缘节点的地理触达\n**📌 关键概念**：CapEx（买设备建房）→OpEx（按用付费）是云最经典的价值主张；「可变成本」「前期固定支出」两个财务词出现即锁定按需付费。与 D4-011/D4-359 同源。","s":"源#180"},{"id":"D4-204","d":4,"t":"single","q":"一家公司想要使用其账单数据每周创建 Amazon QuickSight 仪表板。公司可以使用哪种AWS 功能或工具来满足这些要求？","o":[{"l":"A","t":"AWS 预算"},{"l":"B","t":"AWS 成本探索器"},{"l":"C","t":"AWS 成本和使用情况报告"},{"l":"D","t":"AWS 成本异常检测"}],"a":["C"],"e":"**✅ 为什么 C. AWS 成本和使用情况报告（CUR）对**：CUR 提供最细粒度的账单明细（逐资源逐标签逐日），可入 S3 被 Athena/QuickSight 直接消费，「用账单数据每周做 QuickSight 仪表板」正是其标准用法。\n**❌ 为什么其他选项错**：\n- A. 预算：阈值告警，无明细数据\n- B. 成本探索器：自带界面看趋势，不供自定义仪表板数据源\n- D. 成本异常检测：AI 找异常花销\n**📌 关键概念**：CUR=最详细的账单数据源（每小时/逐资源），落 S3 后接 Athena 查询、QuickSight 可视化是官方推荐的成本分析管线；「自定义仪表板/深度分析」题眼锁定 CUR。","s":"源#204"},{"id":"D4-206","d":4,"t":"single","q":"一家公司需要组织其资源并在详细层面上跟踪 AWS 成本。公司需要按业务部门、环境和应用程序对成本进行分类。哪种解决方案将满足这些要求？","o":[{"l":"A","t":"访问 AWS 成本管理控制台以组织资源，设置 AWS 预算，并接收非预期使用的通知。"},{"l":"B","t":"使用标签组织资源。激活成本分配标签以在详细层面上跟踪 AWS 成本。"},{"l":"C","t":"创建 Amazon CloudWatch 仪表板，以直观地组织和单独跟踪成本。"},{"l":"D","t":"访问 AWS 计费和成本管理仪表板，以在详细层面上组织和跟踪资源消耗。"}],"a":["B"],"e":"**✅ 为什么 B. 使用标签组织资源。激活成本分配标签以在详细层面上跟踪 AWS 成本。对**：给资源打业务部门/环境/应用标签并激活成本分配标签，账单即按标签维度拆分成本，实现精细化归集。\n**❌ 为什么其他选项错**：\n- A. 成本管理控制台+预算：预算是告警工具，不做资源组织与成本分类\n- C. CloudWatch 仪表板：监控性能指标，不是成本管理工具\n- D. 计费控制台跟踪：只给账户级汇总，到不了部门/应用粒度\n**📌 关键概念**：精细化成本归属=标签（tag）体系；「激活成本分配标签」后标签才进账单；配合 CUR 报表可做到「每应用每环境」级成本核算，多部门企业标配。","s":"源#206"},{"id":"D4-213","d":4,"t":"single","q":"哪种 Amazon EC2 实例定价模型可以提供高达 90%的折扣？","o":[{"l":"A","t":"预留实例（Reserved Instances）"},{"l":"B","t":"按需实例（On-Demand）"},{"l":"C","t":"专用主机（Dedicated Hosts）"},{"l":"D","t":"竞价实例（Spot Instances）"}],"a":["D"],"e":"**✅ 为什么 D. 竞价实例 对**：Spot 用 EC2 闲散容量竞价出租，最高折扣可达按需价 90%，是所有 EC2 定价模型中的折扣之王，「高达 90% 折扣」就是 Spot 的数字标签。\n**❌ 为什么其他选项错**：\n- A. 预留实例：折扣约 30~40%，远达不到 90%\n- B. 按需实例：基准价，无折扣\n- C. 专用主机：物理独占溢价，不省钱\n**📌 关键概念**：折扣梯队=Spot（最高 90%）>SP（最高 72%）>RI（约 40%）；数字题记口诀「9 现货、7 储蓄、4 预留」；代价对应：Spot 会中断、SP/RI 要承诺。原 e 为 429 字长叙述，已按三段式整理。Spot 两分钟中断预警+自动补位（ASG/EMR/Batch 原生支持），平均中断率不到 5%；Spot Fleet 混合多种实例类型分散回收风险，批处理与容器负载首选。","s":"源#213"},{"id":"D4-222","d":4,"t":"single","q":"一个客户运行了一个按需的 Amazon Linux EC2 实例 3 小时 5 分钟 6 秒。客户将被计费多长时间？","o":[{"l":"A","t":"3 小时 5 分钟"},{"l":"B","t":"3 小时 5 分钟 6 秒"},{"l":"C","t":"3 小时 6 分钟"},{"l":"D","t":"4 小时"}],"a":["B"],"e":"**✅ 为什么 B. 3 小时 5 分钟 6 秒 对**：按需 Linux/Windows 实例按秒计费（最低 60 秒起），运行 3 小时 5 分 6 秒即按 3:05:06 精确计费，不取整到分钟或小时。\n**❌ 为什么其他选项错**：\n- A. 3 小时 5 分钟：向下抹秒，少收了 6 秒\n- C. 3 小时 6 分钟：向上取整，多收 54 秒\n- D. 4 小时：按小时取整是老黄历（2017 年前）\n**📌 关键概念**：EC2 按需计费=按秒计费+60 秒最低门槛；「精确到秒、不四舍五入」是本题唯一考点，选项间只差几秒的数值戏法，认准「实际运行时长原样计费」。计费起点是实例运行状态（pending 即起算），终止（terminated）即停止；EBS 卷与弹性 IP 空挂另计费，停机不删卷照样产生费用，账单要看到资源粒度。","s":"源#222"},{"id":"D4-225","d":4,"t":"single","q":"一家拥有多个业务单元的公司想要集中管理和治理其 AWS 云环境。公司想要自动化创建AWS 账户、应用服务控制策略（SCPs）并简化计费流程。公司应该使用哪家 AWS 服务或工具来满足这些要求？","o":[{"l":"A","t":"AWS Organizations"},{"l":"B","t":"Cost Explorer"},{"l":"C","t":"AWS Budgets"},{"l":"D","t":"AWS Trusted Advisor"}],"a":["A"],"e":"**✅ 为什么 A. AWS Organizations 对**：Organizations 集中管理多账户——账户自动创建（配 Account Factory）、SCP 统一策略管控、合并计费简化付款，「集中治理+自动化建账+SCPs+简化计费」四关键词全中。\n**❌ 为什么其他选项错**：\n- B. Cost Explorer：花费分析工具\n- C. Budgets：预算告警\n- D. Trusted Advisor：最佳实践检查\n**📌 关键概念**：多账户治理中枢=Organizations（SCP 权限边界+合并计费+账户编组 OU）；「集中管理+治理+多账户」三词出现即选它，与 D4-247/D4-260 同族。OU（组织单元）按部门/项目编组，SCP 挂 OU 或账户逐级收权；管理账户开 MFA 最小权限使用，成员账户日常操作；Account Factory 自动化开账配标准化基线。","s":"源#225"},{"id":"D4-230","d":4,"t":"single","q":"用户将在 Amazon EC2 上运行有状态工作负载，为期 3 年。这种工作负载最具成本效益的定价模型是什么？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"预留实例"},{"l":"C","t":"专用实例"},{"l":"D","t":"现货实例"}],"a":["B"],"e":"**✅ 为什么 B. 预留实例 对**：有状态负载需连续运行 3 年，RI 用 3 年期承诺换最深折扣（约 60%），锁定实例配置保证容量，「3 年+不可断+最省」三要素命中。\n**❌ 为什么其他选项错**：\n- A. 按需实例：3 年按需比 RI 贵出六成\n- C. 专用实例：无折扣优势\n- D. 现货实例：可被中断，有状态负载不可接受\n**📌 关键概念**：有状态=断不得=Spot 出局；3 年期 RI 折扣深于 1 年期；「有状态」是比「连续」更强的不可中断信号，做题时先把 Spot 排除再比较承诺类选项。3 年标准 RI 全额预付折扣最深；可转换 RI 可中途换实例族但折扣浅；若部分时段负载波动，RI+少量按需混搭兼顾弹性，超时未用满的 RI 可转售止损。","s":"源#230"},{"id":"D4-245","d":4,"t":"single","q":"一家公司正在迁移到 AWS 云，并计划在 AWS 上运行 3 到 6 个月的实验性工作负载。哪种定价模型将满足这些要求？","o":[{"l":"A","t":"使用 3 年期限的储蓄计划。"},{"l":"B","t":"使用专用主机。"},{"l":"C","t":"购买预留实例。"},{"l":"D","t":"使用按需实例。"}],"a":["D"],"e":"**✅ 为什么 D. 使用按需实例。对**：3~6 个月的实验性负载时长不定、需求难测，按需实例零承诺随开随停，实验结束即零成本，「实验性+3~6 个月」双信号锁定按需。\n**❌ 为什么其他选项错**：\n- A. 3 年期储蓄计划：为半年实验背 3 年承诺，严重错配\n- B. 专用主机：合规/许可场景，与省钱无关\n- C. 预留实例：最短 1 年承诺，实验期不满一年不划算\n**📌 关键概念**：实验/PoC/评估类=按需；时长「3~6 个月」不满一年是关键排除信号（RI/SP 最短 1 年）；实验成功转生产后再考虑承诺类折扣，分阶段演进。","s":"源#245"},{"id":"D4-247","d":4,"t":"single","q":"一家公司想要在 AWS 上启动多个工作负载。每个工作负载与不同的业务单元相关。公司想要分离并跟踪每个业务单元的成本。哪种解决方案将以最小的运营开销满足这些要求？","o":[{"l":"A","t":"使用 AWS 组织并为每个业务单元创建一个账户。"},{"l":"B","t":"使用电子表格控制每个资源的所有者和成本。"},{"l":"C","t":"使用 Amazon DynamoDB 表记录每个业务单元的成本。"},{"l":"D","t":"使用 AWS 计费控制台分配资源所有者并跟踪成本。"}],"a":["A"],"e":"**✅ 为什么 A. 使用 AWS 组织并为每个业务单元创建一个账户。对**：每业务单元一个账户（组织内统辖），账单天然隔离、权限天然隔离，合并计费再统一付款，「分离+跟踪成本+最小运营开销」全中。\n**❌ 为什么其他选项错**：\n- B. 电子表格记账：手工维护不可持续，运营开销大\n- C. DynamoDB 记成本：手工建表记台账，非原生方案\n- D. 计费控制台分配：控制台无自动分配资源归属能力\n**📌 关键概念**：分账最优解=多账户（账户即成本/权限边界）+合并计费（统一付款）+成本标签（账户内再细分）；「最小运营开销」排除一切手工方案，云原生结构优于表格式管理。","s":"源#247"},{"id":"D4-250","d":4,"t":"single","q":"一家公司经常不使用其所有当前的 Amazon EC2 容量来运行无状态工作负载。公司想要优化其EC2 成本。哪种 EC2 实例类型将满足这些要求？","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"专用实例"},{"l":"C","t":"预留实例"},{"l":"D","t":"按需实例"}],"a":["A"],"e":"**✅ 为什么 A. 现货实例 对**：无状态负载天然容错可中断，公司又有闲置容量可让，Spot 用闲散容量给最大折扣，「无状态+优化成本」双关键词锁定。\n**❌ 为什么其他选项错**：\n- B. 专用实例：硬件隔离，无成本优势\n- C. 预留实例：适合稳定可预测负载，闲置容量场景不匹配\n- D. 按需实例：基准价，可中断负载不用它是浪费折扣\n**📌 关键概念**：无状态+可中断=Spot 主场（官方推荐无状态服务/批处理/CI）；「无状态」一词是可中断的近义信号，出现即考虑 Spot；与 D4-033/D4-272/D4-350 组成 Spot 家族。","s":"源#250"},{"id":"D4-256","d":4,"t":"single","q":"一家公司正在使用 AWS 免费层服务的几个 AWS 服务进行应用程序。如果免费层使用期限到期，或者应用程序使用超出了免费层使用限制，会发生什么？","o":[{"l":"A","t":"公司将按超出免费层使用限制的标准按需服务费率收费。"},{"l":"B","t":"AWS 支持将联系公司，建立标准服务收费。"},{"l":"C","t":"公司将被收取在免费层期间消耗的服务费用，以及免费层期限后服务消耗的额外费用。"},{"l":"D","t":"公司的 AWS 账户将被冻结，可以在建立付款计划后重新启动。"}],"a":["A"],"e":"**✅ 为什么 A. 按标准按需服务费率收费。对**：免费层到期或超额后，服务照常可用，超出部分自动按标准按需价计费，无冻结、无追溯、无强制通知。\n**❌ 为什么其他选项错**：\n- B. 支持团队联系建立收费：无此流程\n- C. 免费期内消耗也补收费用：免费额度内不收费，无追溯\n- D. 账户冻结：AWS 不会因免费层到期冻结账户\n**📌 关键概念**：免费层（12 个月套餐+永久免费服务+试用）只影响价格不影响可用性；超额即标准价、到期即转按需是默认行为；「平滑过渡、无惩罚」是本题考点。","s":"源#256"},{"id":"D4-260","d":4,"t":"single","q":"一家公司收购了另一家公司。公司现在有两个 AWS 账户。公司可以使用哪个AWS 服务或工具来合并这两个账户的计费？","o":[{"l":"A","t":"AWS 系统管理器"},{"l":"B","t":"AWS 组织"},{"l":"C","t":"AWS 许可证管理器"},{"l":"D","t":"成本探索器"}],"a":["B"],"e":"**✅ 为什么 B. AWS 组织 对**：Organizations 把两个账户并入同一组织，合并计费生成单一发票，统一付款方式与集中成本视图，「合并两个账户的计费」正是其字面功能。\n**❌ 为什么其他选项错**：\n- A. 系统管理器：运维编排工具\n- C. 许可证管理器：软件许可追踪\n- D. 成本探索器：分析已聚合账单，自身不合并账户\n**📌 关键概念**：合并账单的唯一入口=Organizations（管理账户+成员账户结构）；收购/并购后统一账单是经典场景；Cost Explorer 是合并后的「看」工具， Organizations 才是「合」工具。","s":"源#260"},{"id":"D4-264","d":4,"t":"single","q":"一家公司想要接收警报以监控其 AWS 公共云基础设施的总体运营成本。哪个AWS 产品将满足这些要求？","o":[{"l":"A","t":"Amazon EventBridge"},{"l":"B","t":"计算储蓄计划"},{"l":"C","t":"AWS 预算"},{"l":"D","t":"迁移评估员"}],"a":["C"],"e":"**✅ 为什么 C. AWS 预算 对**：Budgets 设定总成本预算与阈值（如 80%/100%），超线即邮件/SNS 告警，「监控总体运营成本+警报」双关键词命中。\n**❌ 为什么其他选项错**：\n- A. EventBridge：事件路由总线，非成本工具\n- B. 计算储蓄计划：承诺折扣机制，非监控工具\n- D. 迁移评估员：Migration Evaluator 评估迁移成本，不做持续监控\n**📌 关键概念**：成本三件套=预算（阈值告警）/探索器（趋势分析）/CUR（明细数据）；「接收警报」四字一出就是 Budgets；可按月/季/年设预算，还能跟踪 RI 利用率与 SP 覆盖率。预算粒度可细化到服务/标签/关联账户维度，通知可发多邮箱；预留操作型预算盯 RI 使用率防闲置；预算数据每日刷新三次，接近准实时成本感知。","s":"源#264"},{"id":"D4-265","d":4,"t":"single","q":"AWS 企业支持礼宾团队如何帮助用户？","o":[{"l":"A","t":"支持应用开发"},{"l":"B","t":"提供架构指导"},{"l":"C","t":"回答计费和账户查询"},{"l":"D","t":"回答有关技术支持案例的问题"}],"a":["C"],"e":"**✅ 为什么 C. 回答计费和账户查询 对**：企业支持的礼宾团队（Concierge）专注账务与账户类问题（发票、付款方式、账户设置），是财务视角的专属支持通道。\n**❌ 为什么其他选项错**：\n- A. 应用开发支持：开发是客户与解决方案架构师的事\n- B. 架构指导：TAM 与解决方案架构师职责\n- D. 技术支持案例解答：云支持工程师职责\n**📌 关键概念**：企业支持三角色=礼宾（计费账户）/TAM（主动优化架构）/云支持工程师（技术工单）；「计费和账户」字眼专属礼宾团队，角色-职责对号入座是支持计划考点的基本功。","s":"源#265"},{"id":"D4-266","d":4,"t":"single","q":"一家公司想要运行一个持续 3 年的模拟，不得中断。哪种 Amazon EC2 实例购买选项将最符合成本效益？","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"预留实例"},{"l":"C","t":"专用主机"},{"l":"D","t":"按需实例"}],"a":["B"],"e":"**✅ 为什么 B. 预留实例 对**：模拟连续跑 3 年且不得中断，RI 3 年期承诺换最深折扣且锁定容量，「3 年+不可中断+最省」三要素齐全。\n**❌ 为什么其他选项错**：\n- A. 现货实例：中断风险与「不得中断」正面冲突\n- C. 专用主机：无折扣逻辑\n- D. 按需实例：3 年按需成本最高\n**📌 关键概念**：不可中断+长期=RI（3 年>1 年折扣深）；本题与 D4-230 同构（有状态 3 年 vs 模拟 3 年），「不得中断」直接排除 Spot；长期稳定承诺场景 RI 是默认最优。3 年期承诺前先用 Compute Optimizer 复核规格，避免锁错实例型；RI 账单层面是折扣不再单独显示实例费用，成本报告中以摊销口径核算实际节省。","s":"源#266"},{"id":"D4-267","d":4,"t":"single","q":"以下哪个 AWS 服务或资源可以提供对某些 AWS 服务成本的折扣，以换取消费承诺？","o":[{"l":"A","t":"Amazon Detective"},{"l":"B","t":"AWS 定价计算器"},{"l":"C","t":"储蓄计划"},{"l":"D","t":"基础支持"}],"a":["C"],"e":"**✅ 为什么 C. 储蓄计划 对**：Savings Plans 承诺 1~3 年内每小时固定用量（$），换取最高 72% 折扣，「消费承诺换折扣」正是其机制定义。\n**❌ 为什么其他选项错**：\n- A. Detective：安全调查分析\n- B. 定价计算器：成本估算工具\n- D. 基础支持：免费支持层级\n**📌 关键概念**：SP 三种形态=Compute SP（最灵活，覆盖 EC2/Fargate/Lambda，72%）/EC2 Instance SP（锁实例族，最深）/SageMaker SP；「以承诺换折扣」=RI 与 SP 共有机制，题干没提具体配置选 SP。SP 承诺口径是「每小时花费金额」而非实例数量，用量波动自动按需补差价；月末未用满的承诺额不结转，选型时留 10% 缓冲更稳妥。","s":"源#267"},{"id":"D4-271","d":4,"t":"multiple","q":"以下哪些是公司将本地生产工作负载迁移到 AWS 时获得的好处？（选择两个）","o":[{"l":"A","t":"AWS 培训公司员工使用所有 AWS 服务。"},{"l":"B","t":"AWS 管理云中的所有安全。"},{"l":"C","t":"AWS 提供技术支持账户经理（TAM）的免费支持。"},{"l":"D","t":"AWS 提供高可用性。"},{"l":"E","t":"AWS 提供规模经济。"}],"a":["D","E"],"e":"**✅ 为什么 D、E 对**：\n- D. AWS 提供高可用性：多 AZ/多区域基础设施让应用接近零单点\n- E. AWS 提供规模经济：AWS 海量采购摊薄成本持续降价，客户直接受益\n\n**❌ 为什么其他选项错**：\n- A. AWS 培训员工使用所有服务：培训是客户自身投入\n- B. AWS 管理云中的所有安全：共享责任模型下客户仍管云中安全\n- C. TAM 免费支持：TAM 是企业支持付费权益\n**📌 关键概念**：迁云好处正清单=高可用/规模经济/按需付费/弹性/全球部署；负清单=培训全包/安全全包/免费 TAM 等「全」与「免费」类承诺；与 D4-089/D4-359 组成迁云好处题组。","s":"源#271"},{"id":"D4-272","d":4,"t":"single","q":"一家公司决定采用 Amazon EC2 基础设施，并希望为短期使用扩展各种无状态服务。哪种EC2 定价模型最符合成本效益以满足这些要求？","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"按需实例"},{"l":"C","t":"预留实例"},{"l":"D","t":"专用主机"}],"a":["A"],"e":"**✅ 为什么 A. 现货实例 对**：短期+无状态服务=可中断容错场景，Spot 以最大折扣提供闲置容量，「短期+无状态+成本效益」三词全中。\n**❌ 为什么其他选项错**：\n- B. 按需实例：可中断负载按需计费放弃折扣\n- C. 预留实例：短期负载不匹配 1 年期承诺\n- D. 专用主机：无成本优势\n**📌 关键概念**：无状态=可水平扩展=可中断重试，是 Spot 的入场券；「短期扩展各种无状态服务」即弹性伸缩+Spot 的组合场景（配 ASG 自动补位被回收实例）；本题为 Spot 家族标准题。","s":"源#272"},{"id":"D4-275","d":4,"t":"single","q":"公司应用 AWS 区域来增加不同国家用户的应用程序可用性时，它正在应用哪种云计算优势？","o":[{"l":"A","t":"按需付费定价"},{"l":"B","t":"容量预测"},{"l":"C","t":"规模经济"},{"l":"D","t":"全球覆盖"}],"a":["D"],"e":"**✅ 为什么 D. 全球覆盖 对**：AWS 全球 30+ 区域 100+ 可用区，应用部署到贴近各国用户的区域即得低延迟高可用，利用区域铺开服务多国用户正是全球覆盖优势的定义。\n**❌ 为什么其他选项错**：\n- A. 按需付费定价：讲计费方式\n- B. 容量预测：讲去猜测容量，与地理部署无关\n- C. 规模经济：讲采购摊薄降价\n**📌 关键概念**：六优势场景对位——多国用户就近访问=全球覆盖（Global Reach）；跨区域部署是手段，全球覆盖是优势名；与 D4-180/D4-359 的按需付费、规模经济形成辨析组。","s":"源#275"},{"id":"D4-281","d":4,"t":"single","q":"一家公司正在将其本地服务器迁移到 Amazon EC2 实例。服务器在接下来的 12 个月内必须始终保持活动状态。哪种 EC2 定价选项对公司的负载最具成本效益？","o":[{"l":"A","t":"按需"},{"l":"B","t":"专用主机"},{"l":"C","t":"现货实例"},{"l":"D","t":"预留实例"}],"a":["D"],"e":"**✅ 为什么 D. 预留实例 对**：服务器 12 个月全程在线，RI 1 年期承诺换约 40% 折扣，「连续 12 个月+必须在线+最省」三点锁定。\n**❌ 为什么其他选项错**：\n- A. 按需：12 个月按需比 RI 贵约四成\n- B. 专用主机：为合规设计非为省钱\n- C. 现货：回收风险与「始终保持活动」冲突\n**📌 关键概念**：「接下来 12 个月」与 RI 最短承诺期严丝合缝；判断链=不可中断（排 Spot）→时长满 1 年（选 RI 而非按需）→题干无灵活换型需求（RI 优于 SP）；RI 家族收官题。选 RI 前确认实例族与区域稳定（标准 RI 锁配置，可转换 RI 可换型）；付款三档中 No Upfront 零预付门槛最低、All Upfront 总价最省，按现金流取舍。","s":"源#281"},{"id":"D4-350","d":4,"t":"single","q":"一家公司需要 Amazon EC2 实例来处理可以容忍中断的工作负载。哪种 EC2 实例购买选项与按需价格相比提供最大的折扣？","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"可转换预留实例"},{"l":"C","t":"标准预留实例"},{"l":"D","t":"专用主机"}],"a":["A"],"e":"**✅ 为什么 A. 现货实例 对**：负载可容忍中断，Spot 用闲散容量给最高 90% 折扣，「容忍中断+最大折扣」双关键词即为 Spot 身份证。\n**❌ 为什么其他选项错**：\n- B. 可转换预留实例：折扣约 30% 且需 1 年承诺\n- C. 标准预留实例：折扣深于可转换但不及 Spot\n- D. 专用主机：无折扣定位\n**📌 关键概念**：折扣排序=Spot（90%）＞SP（72%）＞标准 RI（约 60%/3 年）＞可转换 RI；「可中断」是解锁最大折扣的钥匙，Spot 家族压轴题，与 D4-213 的 90% 数字考点呼应。Spot Block（固定时长竞价）曾提供 1~6 小时无中断保证，现已转向标准 Spot+容量优化策略；数据科学、渲染农场、CI 集群是折扣率最高的三大落地场景。","s":"源#350"},{"id":"D4-359","d":4,"t":"multiple","q":"AWS 云如何提供比本地数据中心更低的计算资源总拥有成本（TCO）？（选择两个）","o":[{"l":"A","t":"AWS 用按需成本取代了前期资本支出。"},{"l":"B","t":"AWS 旨在实现高可用性，这消除了用户的停机时间。"},{"l":"C","t":"AWS 消除了对本地 IT 员工的需求。"},{"l":"D","t":"AWS 利用规模经济不断降低价格。"},{"l":"E","t":"AWS 为 Amazon EC2 实例提供单一定价模型。"}],"a":["A","D"],"e":"**✅ 为什么 A、D 对**：\n- A. 按需成本取代前期资本支出：不用买服务器建机房，CapEx 变 OpEx\n- D. 规模经济不断降低价格：AWS 海量采购与运营效率转化为持续降价\n\n**❌ 为什么其他选项错**：\n- B. 高可用消除停机：HA 显著降低而非消除停机\n- C. 消除本地 IT 员工需求：云运维团队仍需保留转型\n- E. EC2 单一定价模型：EC2 恰恰有按需/RI/SP/Spot 多模型\n**📌 关键概念**：TCO 优化双引擎=CapEx→OpEx（A）+规模经济（D）；「消除/单一/不再需要」绝对化表述是错误选项高发区；与 D4-011/D4-089/D4-271 构成迁云价值题组闭环。","s":"源#359"},{"id":"D4-395","d":4,"t":"single","q":"哪个免费的 AWS 服务或工具为云计划创建数据驱动的业务案例？","o":[{"l":"A","t":"迁移评估员"},{"l":"B","t":"AWS 计费指挥家"},{"l":"C","t":"AWS 计费控制台"},{"l":"D","t":"Amazon 预测"}],"a":["A"],"e":"**✅ 为什么 A. 迁移评估员 对**：Migration Evaluator（迁移评估员）是免费服务，分析本地 IT 资产的使用与成本数据，输出 TCO 测算与迁移规划建议，「为云计划创建数据驱动的业务案例」正是其产品定位原话。\n**❌ 为什么其他选项错**：\n- B. AWS 计费指挥家：Billing Conductor 做账单重摊，不做迁移评估\n- C. AWS 计费控制台：查账付款入口\n- D. Amazon 预测：Forecast 是时序预测 ML 服务\n**📌 关键概念**：迁移三步工具=Migration Evaluator（免费评估做业务案例）/CAF（组织就绪度框架）/MGN（实际搬迁）；「数据驱动+业务案例+免费」三词锁定评估员。","s":"源#395"},{"id":"D4-403","d":4,"t":"multiple","q":"以下哪些陈述代表了 AWS 云的成本效益？（选择两个）","o":[{"l":"A","t":"用户可以将固定费用转换为变动费用。"},{"l":"B","t":"用户可以在几分钟内在全世界部署。"},{"l":"C","t":"AWS 提供增加的速度和敏捷性。"},{"l":"D","t":"AWS 负责基础设施的补丁。"},{"l":"E","t":"用户从规模经济中受益。"}],"a":["A","E"],"e":"**✅ 为什么 A、E 对**：\n- A. 固定费用转换为变动费用：CapEx 变 OpEx，只为实际消耗付费\n- E. 规模经济：AWS 海量运营摊薄成本并让利客户\n\n**❌ 为什么其他选项错**：\n- B. 几分钟内部署全球：是敏捷优势非成本优势\n- C. 增加的速度和敏捷性：同上，讲快不讲省\n- D. AWS 负责基础设施补丁：是托管服务优势，与账面成本无直接关系\n**📌 关键概念**：成本效益专属双答案=固定转可变（A）+规模经济（E）；速度/敏捷/全球部署属于效率类优势，「成本」字眼是筛选器；与 D4-359/D4-454 组成经济优势题组。","s":"源#403"},{"id":"D4-406","d":4,"t":"single","q":"一家公司正在将一些本地 IT 服务转移到 AWS 云。财务部门想要看到整个账单，以便预测支出限制。公司可以使用哪个 AWS 服务来设置支出限制并在超出这些限制时接收通知？","o":[{"l":"A","t":"AWS 成本和使用情况报告"},{"l":"B","t":"AWS 预算"},{"l":"C","t":"AWS 组织合并计费"},{"l":"D","t":"成本探索器"}],"a":["B"],"e":"**✅ 为什么 B. AWS 预算 对**：Budgets 设定支出上限阈值，超限即触发通知（邮件/SNS），供财务预测与管控，「设置支出限制+超出接收通知」双关键词正中。\n**❌ 为什么其他选项错**：\n- A. 成本和使用情况报告：提供明细数据不做告警\n- C. 合并计费：聚合账单非预算管控\n- D. 成本探索器：看趋势图不设限\n**📌 关键概念**：财务视角三件套=预算（阈值告警）/探索器（趋势分析）/CUR（明细报表）；「设置限制+通知」组合是 Budgets 独有，与 D4-141/D4-264/D4-572 同族。预算可细化到服务/标签/关联账户维度，实际与预算对比按日刷新；财务还可设置多个阈值档（50%/80%/100%）分级预警，留足处置缓冲，是财务治理与云支出的标准衔接点。","s":"源#406"},{"id":"D4-407","d":4,"t":"multiple","q":"哪些 AWS 支持计划提供访问 AWS 技术账户经理（TAM）的权限？（选择两个）","o":[{"l":"A","t":"AWS 基本支持"},{"l":"B","t":"AWS 开发人员支持"},{"l":"C","t":"AWS 商业支持"},{"l":"D","t":"AWS 企业入门支持"},{"l":"E","t":"AWS 企业支持"}],"a":["D","E"],"e":"**✅ 为什么 D、E 对**：\n- D. AWS 企业入门支持：Enterprise On-Ramp 提供 TAM 访问（精简版）\n- E. AWS 企业支持：完整版 TAM 专属服务\n\n**❌ 为什么其他选项错**：\n- A. 基本支持：免费层，仅文档论坛\n- B. 开发人员支持：办公时间工单，无 TAM\n- C. 商业支持：7×24 全渠道但不含 TAM\n**📌 关键概念**：TAM 准入线=企业入门（On-Ramp）与企业级两档；支持计划阶梯=基础/开发者/商业/企业入门/企业；「TAM」字眼一出，答案必在最高两档中选。企业入门级 TAM 为一组客户的共享资源，企业级才是专属 TAM；两档还含架构评审与 30/15 分钟级响应差异；选型看月消费规模与是否需要主动式架构陪伴。","s":"源#407"},{"id":"D4-419","d":4,"t":"single","q":"一家公司想要通过其 AWS 账户启动第三方 ISP 入侵检测系统。为了满足这个要求，公司应该使用哪个 AWS 服务或资源？","o":[{"l":"A","t":"AWS Security Hub"},{"l":"B","t":"AWS 市场"},{"l":"C","t":"AWS 快速启动"},{"l":"D","t":"AWS 安全中心"}],"a":["B"],"e":"**✅ 为什么 B. AWS 市场 对**：Marketplace 是第三方软件数字目录，可一键订阅部署安全、网络等各类 ISV 产品（含入侵检测系统），「启动第三方 ISP 入侵检测系统」正中其定位。\n**❌ 为什么其他选项错**：\n- A. Security Hub：AWS 原生安全聚合面板，非第三方软件商店\n- C. AWS 快速启动：Quick Start 是官方架构模板\n- D. AWS 安全中心：机翻干扰项，即 Security Hub 别名\n**📌 关键概念**：第三方软件/商业安全产品=Marketplace（统一计费开票，集成到 AWS 账单）；原生安全服务=Shield/GuardDuty/Inspector；「第三方」三字是 Marketplace 的题眼。Marketplace 订阅按小时/月费统一并入 AWS 账单，费用聚合可见；安全类目含 IDS/IPS、WAF、漏洞扫描等数百家 ISV 产品，筛选「预留部署」类还可进私有子网。","s":"源#419"},{"id":"D4-429","d":4,"t":"single","q":"一家公司正在 Amazon EC2 实例上运行一个报告 Web 服务器应用程序。该应用程序每周运行一次，月底再次运行。EC2 实例在不使用时可以关闭。哪种计费模型是这种用例最具成本效益的？","o":[{"l":"A","t":"标准预留实例"},{"l":"B","t":"可转换预留实例"},{"l":"C","t":"按需容量预留"},{"l":"D","t":"按需实例"}],"a":["D"],"e":"**✅ 为什么 D. 按需实例 对**：报告应用每周跑一次、月底加跑，闲置时直接关机，按需秒级计费「用时付、停时停」，零星间歇模式成本最优。\n**❌ 为什么其他选项错**：\n- A. 标准预留实例：1 年期承诺为间歇负载买单，浪费\n- B. 可转换预留实例：同样要长期承诺\n- C. 按需容量预留：锁容量保供给但按时长计费，比按需贵\n**📌 关键概念**：间歇性负载（可关机）=按需；On-Demand Capacity Reservation 是「保容量」选项与省钱无关；「不使用时可以关闭」是题眼，能关机就按需计费。","s":"源#429"},{"id":"D4-431","d":4,"t":"single","q":"一家公司正在将其开发和测试环境转移到 AWS，以增加敏捷性并降低成本。因为这些不是生产工作负载，服务器没有完全利用，偶尔的不可用性是可以接受的。哪种 Amazon EC2 定价模型将最符合成本效益并满足这些要求？","o":[{"l":"A","t":"预留实例"},{"l":"B","t":"按需实例"},{"l":"C","t":"现货实例"},{"l":"D","t":"专用主机"}],"a":["C"],"e":"**✅ 为什么 C. 现货实例 对**：开发测试环境非生产、可容忍偶尔不可用，Spot 用闲置容量给大额折扣，「非关键+可中断+省成本」三关键词全中。\n**❌ 为什么其他选项错**：\n- A. 预留实例：测试环境负载形态多变，不适合承诺\n- B. 按需实例：可中断场景放弃折扣\n- D. 专用主机：合规隔离诉求，与省钱无关\n**📌 关键概念**：测试/开发环境是 Spot 官方推荐场景（环境挂了重开就行）；生产环境禁用 Spot、测试环境首选 Spot 是成本优化双原则；与 D4-565/D4-524 同族。","s":"源#431"},{"id":"D4-454","d":4,"t":"multiple","q":"使用 AWS 云的经济优势有哪些？（选择两个）","o":[{"l":"A","t":"基于消费的定价"},{"l":"B","t":"永久许可证"},{"l":"C","t":"规模经济"},{"l":"D","t":"不额外收费的 AWS 企业支持"},{"l":"E","t":"自带硬件模型"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A. 基于消费的定价：用多少付多少，无前期采购\n- C. 规模经济：AWS 大规模运营带来低价并让利\n\n**❌ 为什么其他选项错**：\n- B. 永久许可证：云订阅模式的对立面\n- D. 免费企业支持：企业支持是付费服务\n- E. 自带硬件模型：云是租用而非自带\n**📌 关键概念**：经济优势固定双答案=消费型定价+规模经济（与 D4-403/D4-359 三胞胎）；错误项特征=绝对化承诺（永久/免费/自带硬件）；「经济优势」类多选基本锁定 A/C 组合。消费型定价配合免费层与 Spot/RI/SP 折扣体系构成完整省钱矩阵；错误选项特征是「永久/免费/自带」等绝对化承诺词，经济类多选永远从「定价机制+规模让利」两端找答案。","s":"源#454"},{"id":"D4-462","d":4,"t":"single","q":"一家公司想在 AWS 上使用 Amazon EC2 实例运行稳定的生产工作负载，将持续运行1 年。哪种实例购买选项最符合成本效益？","o":[{"l":"A","t":"专用主机"},{"l":"B","t":"预留实例"},{"l":"C","t":"按需实例"},{"l":"D","t":"现货实例"}],"a":["B"],"e":"**✅ 为什么 B. 预留实例 对**：生产负载稳定连续跑 1 年，RI 用承诺换约 40% 折扣，「稳定+1 年+最省」三要素齐备。\n**❌ 为什么其他选项错**：\n- A. 专用主机：物理独占，贵且非成本优化项\n- C. 按需实例：连续 1 年按需比 RI 贵四成\n- D. 现货实例：生产负载不能冒中断风险\n**📌 关键概念**：连续 1 年生产负载=RI 教科书场景；「稳定」「生产」「持续」三词出现即排除 Spot/按需；RI 家族题（D4-162/230/266/281/538/557/634/677/684）判断链一致。选 RI 前用 Compute Optimizer 复核实例规格，锁错型号三年代价大；All Upfront 总价最低，现金流紧可退而求 Partial/No Upfront；标准 RI 后续还可在 RI Marketplace 转售。","s":"源#462"},{"id":"D4-494","d":4,"t":"single","q":"一家公司在 AWS 上运行一个应用程序，该应用程序执行批处理作业。该应用程序具有容错能力，并且可以处理中断。公司想要优化运行该应用程序的成本。哪个 AWS 产品将满足这些要求？","o":[{"l":"A","t":"Amazon Macie"},{"l":"B","t":"Amazon Neptune"},{"l":"C","t":"Amazon EC2 Spot Instances"},{"l":"D","t":"Amazon EC2 On-Demand Instances"}],"a":["C"],"e":"**✅ 为什么 C. Amazon EC2 Spot Instances 对**：批处理应用容错可中断，Spot 用闲散容量给最高 90% 折扣，「容错+可中断+优化成本」三关键词正中。\n**❌ 为什么其他选项错**：\n- A. Macie：S3 敏感数据发现\n- B. Neptune：图数据库\n- D. On-Demand：可中断负载用按需放弃折扣\n**📌 关键概念**：批处理+容错=Spot 第一场景（官方推荐 Batch/EMR/渲染）；判断顺序=先看可否中断（可断→Spot），再看时长承诺（长期→RI/SP），最后兜底按需；Spot 家族基准题。Spot 官方中断率平均不足 5%，两分钟预警足够框架做检查点保存；AWS Batch/EMR/Step Functions 原生支持 Spot 自动补位重试，容错批处理是折扣率与稳定性的最优交点。","s":"源#494"},{"id":"D4-501","d":4,"t":"single","q":"一家公司想要通过部门和项目来实现详细的云成本跟踪。公司应该使用哪个 AWS 功能或服务？","o":[{"l":"A","t":"合并计费"},{"l":"B","t":"成本分配标签"},{"l":"C","t":"AWS Marketplace"},{"l":"D","t":"AWS Budgets"}],"a":["B"],"e":"**✅ 为什么 B. 成本分配标签 对**：给资源打部门/项目标签并激活成本分配标签，账单即按标签维度拆分，实现按部门与项目的详细成本跟踪。\n**❌ 为什么其他选项错**：\n- A. 合并计费：账户级聚合，无部门项目粒度\n- C. Marketplace：软件商店\n- D. Budgets：阈值告警不做成本归属\n**📌 关键概念**：精细化分账=成本分配标签（激活后才进账单）+CUR 报表（按标签出明细）；「部门/项目维度跟踪」是标签专属能力；与 D4-206 同族，标签是账户内分账、账户间分账用多账户。","s":"源#501"},{"id":"D4-520","d":4,"t":"single","q":"哪个 AWS 支持计划以最低成本提供全套 AWS Trusted Advisor 检查？","o":[{"l":"A","t":"AWS Developer Support"},{"l":"B","t":"AWS Business Support"},{"l":"C","t":"AWS Enterprise On-Ramp Support"},{"l":"D","t":"AWS Enterprise Support"}],"a":["B"],"e":"**✅ 为什么 B. AWS Business Support 对**：商支持以最低成本提供全套 Trusted Advisor 检查（安全/成本/性能/容错/服务限制五类全部开放），是「全套检查+最低成本」的平衡点。\n**❌ 为什么其他选项错**：\n- A. Developer Support：仅 7 项核心检查\n- C. Enterprise On-Ramp：全套但价格高于商支持\n- D. Enterprise Support：全套但成本最高\n**📌 关键概念**：TA 检查阶梯=开发者（7 项核心）/商业起全套（100+ 检查）；「最低成本+全套」双条件交叉即商支持；企业档贵在 TAM 与响应速度而非检查项数量。全套 TA 检查含安全/成本/性能/容错/服务限额五大类百余项；商支持还含 7×24 全渠道工单与云支持工程师直连；开发者档仅 7 项核心检查且限办公时间响应。","s":"源#520"},{"id":"D4-521","d":4,"t":"single","q":"一家公司的应用程序正在 Amazon EC2 实例上运行。公司计划在明年部分迁移到无服务器架构，并希望预先支付资源费用。哪种 AWS 购买选项将优化公司的成本？","o":[{"l":"A","t":"可转换预留实例"},{"l":"B","t":"现货实例"},{"l":"C","t":"EC2 实例储蓄计划"},{"l":"D","t":"计算储蓄计划"}],"a":["C"],"e":"**✅ 为什么 C. EC2 实例储蓄计划 对**：明年部分迁无服务器，EC2 实例 SP 锁定实例族用量换最深折扣，剩余部分转 Lambda 后由 SP 灵活覆盖过渡，「预先支付+覆盖转型期」正中。\n**❌ 为什么其他选项错**：\n- A. 可转换预留实例：锁实例配置，转型灵活性不如 SP\n- B. 现货实例：可中断，不适合支撑业务基线\n- D. 计算储蓄计划：覆盖面最广（含 Fargate/Lambda）但单价折扣浅于实例 SP\n**📌 关键概念**：SP 两形态=Compute SP（跨 EC2/Fargate/Lambda，72%）/EC2 Instance SP（锁区域+实例族，最深）；「部分迁移无服务器」暗示混合期，实例 SP 对存量 EC2 部分最省。","s":"源#521"},{"id":"D4-524","d":4,"t":"single","q":"一家公司有批量工作负载，需要在 Amazon EC2 上短时间运行。工作负载可以处理中断，并可以从它们结束的地方重新开始。哪种最经济的 EC2 实例购买选项可以满足这些要求？","o":[{"l":"A","t":"预留实例"},{"l":"B","t":"现货实例"},{"l":"C","t":"专用实例"},{"l":"D","t":"按需实例"}],"a":["B"],"e":"**✅ 为什么 B. 现货实例 对**：批量短时负载可中断可断点续跑，Spot 折扣最高，「短时+可中断+可重启+最经济」四词全中。\n**❌ 为什么其他选项错**：\n- A. 预留实例：短期负载不适合长期承诺\n- C. 专用实例：无成本优势\n- D. 按需实例：可中断负载不用它是浪费\n**📌 关键概念**：断点续传（checkpoint-restart）能力是解锁 Spot 的钥匙；批处理作业框架（AWS Batch/EMR）原生支持 Spot 自动重试；与 D4-494/D4-431 组成批处理 Spot 组。作业框架配检查点机制（如 Spark 的 checkpoint 或自定义快照），Spot 回收后自动从断点续跑，整体成本仍远低于按需；Spot Block 可选固定时长进一步压低中断概率。","s":"源#524"},{"id":"D4-530","d":4,"t":"multiple","q":"一家电子商务公司计划将其数据中心工作负载迁移到 AWS 云，以支持高度动态的使用模式。哪些好处使 AWS 云对这种类型的工作负载迁移具有成本效益？（选择两项。）","o":[{"l":"A","t":"可靠性"},{"l":"B","t":"安全性"},{"l":"C","t":"弹性"},{"l":"D","t":"按需付费资源"},{"l":"E","t":"高可用性"}],"a":["C","D"],"e":"**✅ 为什么 C、D 对**：\n- C. 弹性：随动态使用模式自动扩缩，高峰不溢出低谷不浪费\n- D. 按需付费资源：只为实际用量买单，与动态负载天然匹配\n\n**❌ 为什么其他选项错**：\n- A. 可靠性：讲故障恢复，非成本效益\n- B. 安全性：讲防护能力\n- E. 高可用性：讲连续性\n**📌 关键概念**：动态负载省钱双引擎=弹性（自动伸缩）+按需付费（用啥付啥）；题干「高度动态的使用模式+成本效益」两信号词锁定这对组合；可靠性/安全/高可用是质量属性不是成本属性。","s":"源#530"},{"id":"D4-532","d":4,"t":"single","q":"AWS 定价计算器可以做什么？","o":[{"l":"A","t":"预测 AWS 每月成本。"},{"l":"B","t":"计算历史 AWS 成本。"},{"l":"C","t":"提供有关 AWS 定价策略的深入信息。"},{"l":"D","t":"为用户提供他们的月度账单访问权限。"}],"a":["A"],"e":"**✅ 为什么 A. 预测 AWS 每月成本。对**：Pricing Calculator 按假想架构与服务用量估算月度成本，供部署前预算规划，「预测每月成本」正是其功能定义。\n**❌ 为什么其他选项错**：\n- B. 计算历史成本：它只算未来不算过去\n- C. 定价策略深入信息：它算具体架构账，不解读定价哲学\n- D. 月度账单访问：看账单去计费控制台\n**📌 关键概念**：Pricing Calculator=事前估算（月成本预测+方案比价）；历史分析=Cost Explorer；账单查阅=计费控制台；时间维度（未来 vs 过去）是分辨成本工具的第一刀。","s":"源#532"},{"id":"D4-538","d":4,"t":"single","q":"一家公司需要在 Amazon EC2 实例上托管一个 Web 服务器至少 1 年。Web 服务器不能容忍中断。哪种 EC2 实例购买选项将最经济地满足这些要求？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"部分预付费预留实例"},{"l":"C","t":"现货实例"},{"l":"D","t":"无预付费预留实例"}],"a":["B"],"e":"**✅ 为什么 B. 部分预付费预留实例 对**：Web 服务器至少 1 年且不可中断，RI 承诺换折扣，部分预付档在预付压力与总成本间取最优平衡，「至少 1 年+不可断+最经济」锁定部分预付 RI。\n**❌ 为什么其他选项错**：\n- A. 按需实例：1 年期按需比 RI 贵四成\n- C. 现货实例：可中断与「不能容忍中断」冲突\n- D. 无预付费预留实例：同样折扣但月付总价略高于部分预付\n**📌 关键概念**：RI 三档付款=All（总价最低）/Partial（平衡）/No（门槛最低）；「最经济」比的是总成本→预付越多越省；选项间只差付款档位时，选预付多的那档。","s":"源#538"},{"id":"D4-548","d":4,"t":"single","q":"一家公司有临时工作负载，也是可变的。公司需要使用 Amazon EC2 实例来处理工作负载。EC2 实例需要处理无法在完成前停止的短暂工作爆发。哪种购买选项将满足这些要求？","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"按需实例"},{"l":"C","t":"储蓄计划"},{"l":"D","t":"预留实例"}],"a":["B"],"e":"**✅ 为什么 B. 按需实例 对**：临时可变负载+短暂爆发不可中途停，按需实例零承诺即开即用、保证不被回收，「无法停止的突发+临时」双信号锁定。\n**❌ 为什么其他选项错**：\n- A. 现货实例：可能中断，与「无法在完成前停止」冲突\n- C. 储蓄计划：临时负载不适合用量承诺\n- D. 预留实例：短期突发不适合长期承诺\n**📌 关键概念**：不可中断的短时爆发=按需（Spot 被排除是关键）；「临时+爆发」是按需求信号，「不能停」是排除 Spot 的信号；与 D4-429 的可关机按需形成对照。","s":"源#548"},{"id":"D4-553","d":4,"t":"single","q":"一家公司使用多个 AWS 账户用于不同的业务团队。财务团队希望收到公司所有账户的一张账单。财务团队应该使用哪个 AWS 服务或工具来满足此要求？","o":[{"l":"A","t":"AWS Organizations"},{"l":"B","t":"AWS Trusted Advisor"},{"l":"C","t":"Cost Explorer"},{"l":"D","t":"AWS Budgets"}],"a":["A"],"e":"**✅ 为什么 A. AWS Organizations 对**：Organizations 把多账户纳入一个组织，合并计费生成单一账单，「多账户+一张账单」正中其字面功能。\n**❌ 为什么其他选项错**：\n- B. Trusted Advisor：最佳实践检查\n- C. Cost Explorer：分析已合并账单，自身不合并\n- D. Budgets：预算告警\n**📌 关键概念**：一张发票的唯一定义=Organizations 合并计费；「财务团队要一张账单」是高频题干变体；Explorer/Budgets 是合并后的消费工具，组织才是账单归集主体。合并账单外，Organizations 还支持 SCP 权限收口、OU 编组与账户自动创建；财务用 CUR+标签在单一账单内做部门级二次拆分，实现「一张发票+多维核算」。","s":"源#553"},{"id":"D4-556","d":4,"t":"single","q":"哪个好处始终免费提供给 AWS 用户，无论其 AWS 支持计划如何？","o":[{"l":"A","t":"AWS 开发人员支持"},{"l":"B","t":"AWS 开发人员论坛"},{"l":"C","t":"程序化案例管理"},{"l":"D","t":"AWS 技术账户经理（TAM）"}],"a":["B"],"e":"**✅ 为什么 B. AWS 开发人员论坛 对**：开发人员论坛对所有 AWS 用户永久免费，不依赖任何支持计划，提问交流零门槛，「始终免费+无论支持计划」双限定命中。\n**❌ 为什么其他选项错**：\n- A. 开发人员支持：付费计划（办公时间工单）\n- C. 程序化案例管理：API 开工单属付费计划权益\n- D. TAM：企业级付费专属\n**📌 关键概念**：免费支持基线=文档/白皮书/论坛/健康面板/TA 核心检查；付费分档解锁=工单响应/TAM/架构审查；「免费」考点在支持计划题里高频出现，论坛是唯一全免费选项。","s":"源#556"},{"id":"D4-557","d":4,"t":"single","q":"一家公司使用 Amazon EC2 实例运行其应用程序。应用程序需要连续可用并运行三年或更长时间。公司应购买哪种类型的 EC2 实例以获得 EC2 定价的折扣？","o":[{"l":"A","t":"预留实例"},{"l":"B","t":"现货实例"},{"l":"C","t":"按需实例"},{"l":"D","t":"EC2 车队"}],"a":["A"],"e":"**✅ 为什么 A. 预留实例 对**：应用连续运行 3 年以上，RI 用长期承诺换实例小时费率的最大折扣，「连续+3 年+折扣」三要素正中。\n**❌ 为什么其他选项错**：\n- B. 现货实例：可中断不满足连续可用\n- C. 按需实例：3 年按需成本最高\n- D. EC2 车队：混合采购策略工具，非折扣承诺本身\n**📌 关键概念**：3 年期 RI 折扣最深的常规选项；「三年或更长」是 RI 最强信号词；EC2 Fleet 是按比例编排多购买选项的机制，不单独构成定价答案。3 年标准 RI 全额预付是价格谷底；若部分负载未来形态不确定，可用 RI 打底+SP 补充的混合策略；RI 折扣在账单中体现为费率优惠而非独立条目，报表按摊销口径核算节省。","s":"源#557"},{"id":"D4-565","d":4,"t":"single","q":"一家公司正在其 AWS 测试和开发服务器上运行大数据分析和大规模并行计算。公司可以容忍偶尔的停机。对于公司来说，最经济实惠的 Amazon EC2 购买选项是什么？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"现货实例"},{"l":"C","t":"预留实例"},{"l":"D","t":"储蓄计划"}],"a":["B"],"e":"**✅ 为什么 B. 现货实例 对**：测试开发服务器跑大数据与并行计算、可容忍偶尔停机，Spot 给最大折扣，「测试开发+容停机+最省」三关键词全中。\n**❌ 为什么其他选项错**：\n- A. 按需实例：可容忍中断却付全价，浪费\n- C. 预留实例：测试负载形态不适合承诺\n- D. 储蓄计划：同理，承诺机制错配\n**📌 关键概念**：大数据分析+HPC 在非生产环境=Spot 官方场景；「测试/开发」与「生产」是 Spot 题的分水岭信号；中断容忍词（偶尔停机可接受）出现即锁定 Spot。","s":"源#565"},{"id":"D4-566","d":4,"t":"single","q":"一家公司在研究实验室中运行 Amazon EC2 实例。实例每周运行 3 小时，不能被中断。哪种最经济实惠的实例购买选项可以满足这些要求？","o":[{"l":"A","t":"计算储蓄计划"},{"l":"B","t":"按需实例"},{"l":"C","t":"可转换预留实例"},{"l":"D","t":"现货实例"}],"a":["B"],"e":"**✅ 为什么 B. 按需实例 对**：每周仅 3 小时且不能中断——频次极低排除承诺类（RI/SP 最小成本单元远超此用量），不可中断排除 Spot，按需秒级计费用完即停正合适。\n**❌ 为什么其他选项错**：\n- A. 计算储蓄计划：按小时用量承诺，每周 3 小时摊不满\n- C. 可转换预留实例：1 年期承诺为 3 小时/周买单，严重浪费\n- D. 现货实例：中断风险与「不能被中断」冲突\n**📌 关键概念**：极低频+不可断=按需（双重排除法的典型题：承诺类被用量排除、Spot 被中断排除）；原 e 为 652 字超长多要点叙述，已按三段式浓缩整理。","s":"源#566"},{"id":"D4-568","d":4,"t":"single","q":"一家公司迁移到 AWS 云。现在公司按需支付服务费用。公司正在从云计算的哪个优势中受益？","o":[{"l":"A","t":"停止花费资金运行和维护数据中心"},{"l":"B","t":"提高速度和敏捷性"},{"l":"C","t":"几分钟内走向全球"},{"l":"D","t":"将固定费用转换为变动费用"}],"a":["D"],"e":"**✅ 为什么 D. 将固定费用转换为变动费用 对**：按需付费正是把「先投资基础设施」的固定资本支出变为「随实际用量浮动」的运营支出，题干「按需支付」四字直指这一优势。\n**❌ 为什么其他选项错**：\n- A. 停止数据中心开销：也是优势但不是「按需付费」的直接对应\n- B. 提高速度和敏捷性：讲快不讲钱\n- C. 几分钟内走向全球：讲部署速度\n**📌 关键概念**：按需付费=固定转可变（CapEx→OpEx）的同义改写；题干问「按需支付对应哪个优势」时，财务视角的 D 是最精确映射；与 D4-180/D4-403 同源考点。","s":"源#568"},{"id":"D4-570","d":4,"t":"single","q":"一家公司想要在迁移前估计其 AWS 架构解决方案的成本。哪个 AWS 服务或功能将满足此要求？","o":[{"l":"A","t":"Amazon Detective"},{"l":"B","t":"AWS Budgets"},{"l":"C","t":"AWS Resource Explorer"},{"l":"D","t":"AWS 定价计算器"}],"a":["D"],"e":"**✅ 为什么 D. AWS 定价计算器 对**：Pricing Calculator 在部署前按预期架构与用量估算成本，「迁移前估计架构方案成本」正是其唯一职责。\n**❌ 为什么其他选项错**：\n- A. Detective：安全调查\n- B. Budgets：部署后阈值告警\n- C. Resource Explorer：资源搜索工具\n**📌 关键概念**：事前估算=Pricing Calculator；「迁移前」「部署前」「规划阶段」等时间状语是它的题眼；本批 D4-532 是其功能定义题，本题是场景应用题，两题互证。估算模型可保存分享链接供团队评审；本地架构对照功能可直接对比上云前后 TCO；区域切换看价差，预留资源与数据传输费也要计入，避免估算漏项。","s":"源#570"},{"id":"D4-572","d":4,"t":"single","q":"一所大学获得一笔赠款，用于使用 AWS 服务进行研究。研究团队需要确保赠款资金在整个学年内持续。团队已决定每月分配一定金额，总计达到总赠款金额。哪个 AWS 服务或功能会在支出超过计划金额时通知团队？","o":[{"l":"A","t":"AWS Budgets"},{"l":"B","t":"成本探索器"},{"l":"C","t":"成本分配标签"},{"l":"D","t":"成本类别"}],"a":["A"],"e":"**✅ 为什么 A. AWS Budgets 对**：团队按月分配赠款额度，Budgets 设月度支出预算，超线即通知团队调整，确保资金撑满学年，「按月分配+超支通知」双关键词正中。\n**❌ 为什么其他选项错**：\n- B. 成本探索器：看趋势不告警\n- C. 成本分配标签：成本归属维度\n- D. 成本类别：账单分组规则\n**📌 关键概念**：预算周期对齐=按月设 Budgets（本题为赠款分配场景）；科研项目/赠款/预算管控是 Budgets 的故事化考法；「超支时通知」是 Budgets 不变的核心题眼。预算通知可发多邮箱+ SNS 多渠道；配合 Cost Explorer 的预测曲线可提前看到「按当前趋势会不会超」，把事后告警升级为事前干预，赠款类强约束场景的标准打法。","s":"源#572"},{"id":"D4-577","d":4,"t":"single","q":"哪个 AWS 团队或提供帮助用户通过在几个专业实践领域的付费参与来加速云采用？","o":[{"l":"A","t":"AWS 企业支持"},{"l":"B","t":"AWS 解决方案架构师"},{"l":"C","t":"AWS 专业服务"},{"l":"D","t":"AWS 账户经理"}],"a":["C"],"e":"**✅ 为什么 C. AWS 专业服务 对**：AWS Professional Services 是专家咨询团队，按专业实践领域（ProServe）提供付费项目制服务，帮助客户加速云采用，「付费专业实践领域+加速云采用」双关键词正中。\n**❌ 为什么其他选项错**：\n- A. 企业支持：工单响应与技术保障服务\n- B. 解决方案架构师：免费架构指导角色\n- D. 账户经理：商务关系维护\n**📌 关键概念**：人力支持四角色=专业服务（付费项目交付）/SA（免费架构指导）/TAM（企业支持专属）/客户经理（商务）；「专业实践领域+付费」组合是 ProServe 独有标签。","s":"源#577"},{"id":"D4-578","d":4,"t":"single","q":"一家公司需要购买 Amazon EC2 实例以支持将连续运行超过 1 年的应用程序。哪种EC2 实例购买选项最经济地满足这些要求？","o":[{"l":"A","t":"专用实例"},{"l":"B","t":"现货实例"},{"l":"C","t":"预留实例"},{"l":"D","t":"按需实例"}],"a":["C"],"e":"**✅ 为什么 C. 预留实例 对**：应用连续运行超过 1 年，RI 承诺期换折扣，超过 1 年的连续负载正是 RI 的目标场景，「连续+超 1 年+最经济」三要素锁定。\n**❌ 为什么其他选项错**：\n- A. 专用实例：无折扣机制\n- B. 现货实例：可中断，连续性无保障\n- D. 按需实例：长期按需成本显著高于 RI\n**📌 关键概念**：时长门槛记忆——不满 1 年按需、满 1 年起 RI/SP、3 年期折扣更深；「超过 1 年」比「恰好 1 年」更强的 RI 信号；RI 家族题判断链恒定：不可断排 Spot、满期排按需。超过 1 年但不到 3 年的负载，1 年期 RI 比 3 年期灵活；标准 RI 锁实例族/规格/区域/OS 四要素，区域级 RI 可在区域内换 AZ 使用；浮动部分用按需补位。","s":"源#578"},{"id":"D4-602","d":4,"t":"single","q":"一家公司在 AWS 云中运行其生产工作负载。该公司需要选择一项 AWS 支持计划。哪项AWS 支持计划将以最低成本满足这些要求？","o":[{"l":"A","t":"开发者"},{"l":"B","t":"企业入门版"},{"l":"C","t":"企业版"},{"l":"D","t":"业务版"}],"a":["D"],"e":"**✅ 为什么 D. 业务版 对**：生产工作负载要求 7×24 全渠道支持与全套 TA 检查，商支持是满足该底线的最低成本档位，「生产+最低成本」双条件交叉锁定。\n**❌ 为什么其他选项错**：\n- A. 开发者：办公时间支持，生产不可用\n- B. 企业入门版：有 TAM 但成本高于商支持\n- C. 企业版：功能最全但非最低成本\n**📌 关键概念**：支持计划选型=看负载等级（测试→开发者；生产→商业起）；「最低成本+生产」两约束并存的答案永远是商业版；企业档的 TAM/15 分钟响应是溢价项非必需项。","s":"源#602"},{"id":"D4-634","d":4,"t":"single","q":"一家公司有一个将连续运行 1 年的工作负载。该工作负载不能容忍服务中断。哪种Amazon EC2 购买选项将是最具成本效益的？","o":[{"l":"A","t":"所有预付预留实例"},{"l":"B","t":"部分预付预留实例"},{"l":"C","t":"专用实例"},{"l":"D","t":"按需实例"}],"a":["A"],"e":"**✅ 为什么 A. 所有预付预留实例 对**：连续 1 年+不可中断，RI 三档付款中 All Upfront 总成本最低，「最具成本效益+预付」组合锁定全额预付档。\n**❌ 为什么其他选项错**：\n- B. 部分预付预留实例：折扣同但总价略高\n- C. 专用实例：无折扣逻辑\n- D. 按需实例：1 年按需比 RI 贵约四成\n**📌 关键概念**：RI 付款三档总成本排序=All<Partial<No（预付越多省越多）；题干只问「最省」时选预付最深的档；与 D4-538 的部分预付题对照记忆——那题问「最经济」配「预付能力约束」，本题无约束直取 All。","s":"源#634"},{"id":"D4-639","d":4,"t":"single","q":"一家公司希望在 Amazon EC2 实例上运行其应用程序时具有成本效益的选项，并且应用程序可以被中断。 哪种 EC2 实例类型将满足这些要求？","o":[{"l":"A","t":"Spot 实例"},{"l":"B","t":"按需实例"},{"l":"C","t":"预留实例"},{"l":"D","t":"专用实例"}],"a":["A"],"e":"**✅ 为什么 A. Spot 实例 对**：应用可被中断+追求成本效益，Spot 用闲散容量给最高 90% 折扣，「可中断+成本效益」双词即 Spot 身份证。\n**❌ 为什么其他选项错**：\n- B. 按需实例：可中断负载按全价计费不划算\n- C. 预留实例：可中断短期负载不适合承诺\n- D. 专用实例：隔离合规诉求非省钱\n**📌 关键概念**：判断链第一步永远是「可否中断」——可断即 Spot 候选；「成本效益」配「可中断」是最高频的 Spot 题干组合；Spot 家族（D4-033/250/272/350/431/494/524/565/639）贯穿 B18/B19 两批。Spot Fleet 与容量优化分配策略可进一步降低中断率；配 ASG 时把 Spot 设为基准容量+按需兜底，中断自动重均衡；「可中断+省钱」两词几乎不会同时指向其他选项。","s":"源#639"},{"id":"D4-641","d":4,"t":"single","q":"哪项 AWS 服务或工具提供了历史 AWS 支出模式的可视化以及未来 AWS 成本的预测？","o":[{"l":"A","t":"AWS Cost and Usage Report"},{"l":"B","t":"AWS Budgets"},{"l":"C","t":"Cost Explorer"},{"l":"D","t":"Amazon Cloud Watch"}],"a":["C"],"e":"**✅ 为什么 C. Cost Explorer 对**：Cost Explorer 可视化历史支出模式，并基于历史趋势预测未来成本（最长 12 个月），「历史可视化+未来预测」双功能正中。\n**❌ 为什么其他选项错**：\n- A. 成本和使用情况报告：明细数据无预测\n- B. Budgets：阈值告警无预测图表\n- D. CloudWatch：性能监控非成本工具\n**📌 关键概念**：Cost Explorer 双能力=看过去（历史趋势图）+算未来（预测曲线）；CUR 给明细、Budgets 管阈值、Explorer 出图表；「预测」一词出现即选 Explorer。Explorer 默认视图含月度成本/用量趋势，预测基于过去 6 个月数据外推 12 个月；可按标签/服务/区域下钻，保存的报告支持定时邮件推送，规划与汇报两相宜。","s":"源#641"},{"id":"D4-675","d":4,"t":"single","q":"一家公司已将其所有基础设施迁移到 AWS 云。为了提前为每个季度做计划，财务团队希望跟踪前几个月所有资源的成本和使用数据。财务团队希望自动生成包含这些数据的报告。 该财务团队应该使用哪项AWS服务或功能来满足这些要求？","o":[{"l":"A","t":"Amazon Detective"},{"l":"B","t":"AWS Pricing Calculator"},{"l":"C","t":"AWS Budgets"},{"l":"D","t":"AWS Savings Plans"}],"a":["C"],"e":"**✅ 为什么 C. AWS Budgets 对**：Budgets 跟踪成本与用量数据，可配置周期性自动发送预算报告（含实际 vs 预算对照），「跟踪成本使用+自动生成报告」双关键词正中。\n**❌ 为什么其他选项错**：\n- A. Detective：安全调查\n- B. Pricing Calculator：事前估算非持续跟踪\n- D. Savings Plans：折扣承诺机制\n**📌 关键概念**：Budgets 附加能力=自动报告订阅（按周/月邮件推送）；「自动生成报告+提前规划」是 Budgets 的进阶考法；与 D4-406/D4-572 的告警考法互补，预算三场景=限值告警/周期报告/用量追踪。预算报告含实际支出、预测终值与预算余量三列对照，按周/月自动投递；配合 RI 利用率预算还能盯折扣资产是否用满，防止「买了承诺却闲置」的隐性浪费。","s":"源#675"},{"id":"D4-677","d":4,"t":"single","q":"一家公司想要将关键的本地生产系统迁移到 Amazon EC2 实例。生产实例将使用至少3 年。该公司希望选择一种成本最低的定价选项。 哪种解决方案将满足这些要求？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"预留实例"},{"l":"C","t":"Spot 实例"},{"l":"D","t":"AWS 免费套餐"}],"a":["B"],"e":"**✅ 为什么 B. 预留实例 对**：关键生产系统用 EC2 至少 3 年，RI 用 3 年期承诺锁定最低小时费率，「关键+3 年+成本最低」三要素正中。\n**❌ 为什么其他选项错**：\n- A. 按需实例：3 年按需成本最高\n- C. Spot：关键系统不可冒中断风险\n- D. 免费套餐：仅 12 个月微量额度，撑不起生产系统\n**📌 关键概念**：3 年期 RI 是常规选项中的价格谷底（标准 RI All Upfront）；「关键生产」强化不可中断信号；免费套餐出现在成人选项里基本是凑数干扰项。3 年期承诺前确认实例族稳定（标准 RI 锁型，可转换 RI 可换型但折扣浅）；All Upfront 一次付清总价最低；生产关键负载另配 Multi-AZ 与备份，RI 只管钱不管可用性。","s":"源#677"},{"id":"D4-684","d":4,"t":"single","q":"一家公司需要在 Amazon EC2 实例上运行应用程序而不中断。 哪种 EC2 实例购买选项将最具成本效益地满足此要求？","o":[{"l":"A","t":"标准预留实例"},{"l":"B","t":"可转换预留实例"},{"l":"C","t":"按需实例"},{"l":"D","t":"Spot 实例"}],"a":["A"],"e":"**✅ 为什么 A. 标准预留实例 对**：应用不中断长期运行，标准 RI 承诺具体实例配置换最大折扣且保证容量供给，「不中断+长期+最省」三词锁定标准 RI。\n**❌ 为什么其他选项错**：\n- B. 可转换预留实例：可换实例族但折扣浅于标准型\n- C. 按需实例：长期按需成本劣势明显\n- D. Spot：中断风险直接冲突\n**📌 关键概念**：标准 RI vs 可转换 RI——标准折扣深（约 60%/3 年）配置锁定，可转换折扣浅但可换族换规格；题干无换型需求时永远选标准；RI 家族收官题。","s":"源#684"},{"id":"D4-688","d":4,"t":"single","q":"一家公司想要为其全球用户提供低延迟。 AWS 云的哪个功能满足这一要求？","o":[{"l":"A","t":"全球基础设施"},{"l":"B","t":"按需付费定价"},{"l":"C","t":"托管服务"},{"l":"D","t":"规模经济"}],"a":["A"],"e":"**✅ 为什么 A. 全球基础设施 对**：AWS 全球 30+ 区域 100+ 可用区+400+ 边缘节点构成的基础设施网络，让应用贴近全球用户部署降低延迟，「全球用户+低延迟」正中。\n**❌ 为什么其他选项错**：\n- B. 按需付费定价：讲计费方式\n- C. 托管服务：讲运维减负\n- D. 规模经济：讲采购降价\n**📌 关键概念**：低延迟三工具=全球基础设施（区域就近部署）/CloudFront（边缘缓存）/Global Accelerator（骨干加速）；题干问「云的功能」且主语是地理位置类诉求时，选全球基础设施；与 D4-275 全球覆盖同源。","s":"源#688"},{"id":"D4-690","d":4,"t":"single","q":"一家公司拥有多个 AWS 账户。该公司需要从 AWS 接收合并账单，并集中管理安全和合规性。该公司应该使用哪项 AWS 服务或功能来满足这些要求？","o":[{"l":"A","t":"AWS Cost and Usage Report"},{"l":"B","t":"AWS Organizations"},{"l":"C","t":"AWS Config"},{"l":"D","t":"AWS Security Hub"}],"a":["B"],"e":"**✅ 为什么 B. AWS Organizations 对**：Organizations 集中管理多账户——合并账单统一付款+SCP 统一策略（含安全合规约束），「合并账单+集中安全合规管理」双诉求一次满足。\n**❌ 为什么其他选项错**：\n- A. 成本和使用情况报告：明细数据非管理工具\n- C. AWS Config：单账户资源配置审计\n- D. Security Hub：安全 findings 聚合，不管账单\n**📌 关键概念**：Organizations 双职能=财务（合并计费）+治理（SCP/账户编组）；「合并账单+集中安全」组合题干是 Organizations 的完形填空；Config/Hub 是单点工具不做组织级统筹。SCP 可封禁区域/服务/操作（如禁开昂贵区域），合规基线统一下发；管理账户用最小权限+MFA，成员账户日常作业；整合 Config 与 Security Hub 做合规证据链。","s":"源#690"},{"id":"D4-695","d":4,"t":"single","q":"一家公司想要可视化和管理特定时间段内的 AWS 云成本和使用情况。 哪项 AWS 服务或功能将满足这些要求？","o":[{"l":"A","t":"Cost Explorer"},{"l":"B","t":"Consolidated billing"},{"l":"C","t":"AWS Organizations"},{"l":"D","t":"AWS Budgets"}],"a":["A"],"e":"**✅ 为什么 A. Cost Explorer 对**：Cost Explorer 可视化特定时间段内的成本与用量（按日/月聚合、按服务/标签下钻），「可视化+特定时间段+成本使用」三关键词正中。\n**❌ 为什么其他选项错**：\n- B. 合并计费：账单归集非可视化\n- C. Organizations：多账户治理\n- D. Budgets：阈值告警非交互分析\n**📌 关键概念**：可视化分析=Cost Explorer（趋势图/对比/预测一体）；「特定时间段」「可视化」「分析」是 Explorer 三大题眼；与 D4-641 预测题、D4-532 估算题构成成本工具三角辨析。Explorer 支持自定义时间窗（最长 14 个月回溯）与保存视图；预留实例利用率、SP 覆盖率报告同屏可见；发现异常再下钻到 CUR 明细定位到具体资源与标签。","s":"源#695"},{"id":"D4-705","d":4,"t":"single","q":"一家公司想要测试一个新应用程序。 哪个 AWS 原则能帮助公司测试应用程序？","o":[{"l":"A","t":"为了换取成本折扣而做出长期承诺。"},{"l":"B","t":"根据需要进行扩展，无需任何长期承诺。"},{"l":"C","t":"对应用程序基础设施拥有完全控制权。"},{"l":"D","t":"管理与云相关的所有维护任务。"}],"a":["B"],"e":"**✅ 为什么 B. 根据需要进行扩展，无需任何长期承诺。对**：测试新应用需求不可预测，云弹性原则让资源随需伸缩、零承诺，测试完即释放，正是支持试验的架构原则。\n**❌ 为什么其他选项错**：\n- A. 长期承诺换折扣：测试负载不适合承诺\n- C. 对基础设施完全控制：云托管化恰恰减少控制细节\n- D. 管理所有维护任务：托管服务是 AWS 代劳\n**📌 关键概念**：测试/试验类负载=弹性伸缩+零承诺原则；「测试新应用程序」题干等价于「需求不可预测」；与购买选项题呼应——测试期按需，转生产后再评估承诺类折扣。","s":"源#705"},{"id":"D4-706","d":4,"t":"single","q":"一家公司计划启动一个包含许多产品目录图片的电子商务网站。公司希望将网站运营成本控制在特定预算内。 公司应该使用哪个 AWS 服务或工具来监控网站持续的成本？","o":[{"l":"A","t":"AWS 成本管理器"},{"l":"B","t":"AWS 软件开发工具包"},{"l":"C","t":"EC2 镜像构建器"},{"l":"D","t":"AWS 云形成"}],"a":["A"],"e":"**✅ 为什么 A. AWS 成本管理器 对**：成本管理器（Cost Explorer 所属的成本管理工具族）持续监控消费模式，配合预算控制成本，「监控持续成本+控制在预算内」双关键词正中。\n**❌ 为什么其他选项错**：\n- B. 软件开发工具包：API 编程接口\n- C. EC2 镜像构建器：AMI 自动构建\n- D. AWS 云形成：IaC 资源编排\n**📌 关键概念**：监控持续成本=成本管理工具族（Explorer/Budgets/CUR）；SDK/镜像构建器/CloudFormation 分别是编程/镜像/基建编排工具；「持续监控+预算」双词排除一切非成本类工具。成本监控体系=Budgets（阈值哨兵）+Explorer（趋势仪表）+CUR（明细账本）+CAD（异常侦测）四位一体；电商图片类静态资源还可配 CloudFront+S3 生命周期直接降本。","s":"源#706"},{"id":"D4-711","d":4,"t":"single","q":"一家公司需要在需要时提供不间断的 Amazon EC2 实例，并按秒支付计算能力。哪种EC2 实例购买选项能满足这些要求？","o":[{"l":"A","t":"预留实例"},{"l":"B","t":"现货实例"},{"l":"C","t":"按需实例"},{"l":"D","t":"专用实例"}],"a":["C"],"e":"**✅ 为什么 C. 按需实例 对**：需要时不间断供给+按秒计费+零承诺，正是按需实例的完整定义，「按需供给+按秒支付」双关键词逐字命中。\n**❌ 为什么其他选项错**：\n- A. 预留实例：承诺型计费非按秒弹性\n- B. 现货实例：可中断，不保证不间断供给\n- D. 专用实例：硬件隔离属性与计费粒度无关\n**📌 关键概念**：按秒计费=按需实例独有标签（60 秒起）；「需要时供给（无承诺）+按秒支付」组合是按需的完形填空；题干强调「不间断」时 Spot 必错。","s":"源#711"},{"id":"D4-719","d":4,"t":"single","q":"一家在本地服务器上运营的公司决定开展新的业务线。公司确定新工作负载需要额外的服务器。云计算的哪个优势可以帮助公司尽快提供额外的基础设施？","o":[{"l":"A","t":"从大规模经济中获益"},{"l":"B","t":"提高速度和敏捷性"},{"l":"C","t":"将固定费用转换为可变成本"},{"l":"D","t":"几分钟内全球化"}],"a":["B"],"e":"**✅ 为什么 B. 提高速度和敏捷性 对**：新业务线需要尽快补足服务器，云计算分钟级开通资源，免去本地采购的数周流程，「尽快提供基础设施」正中速度与敏捷优势。\n**❌ 为什么其他选项错**：\n- A. 规模经济：讲长期降本，不讲开通速度\n- C. 固定转可变：讲计费结构转型\n- D. 几分钟全球化：讲全球部署能力，本题是本地扩容场景\n**📌 关键概念**：速度敏捷=资源分钟级就绪+快速试验迭代；「尽快/快速/立即」类时间紧迫词是敏捷优势的信号；六优势最后一题收官——成本（按需付费/规模经济）、效率（敏捷/全球）、可靠（高可用/弹性）三类对号入座。","s":"源#719"}];
</script>
<script>

/* ================================================================
   ===================== 题库数据（构建注入 QUIZ_META + QUIZ_QUESTIONS） ================
   ================================================================ */
const QUESTIONS = QUIZ_QUESTIONS;
const META = (typeof QUIZ_META !== 'undefined' && QUIZ_META) ? QUIZ_META : {};
const EXAM = META.exam || 'QUIZ';
const LS_PREFIX = META.lsPrefix || EXAM.toLowerCase();

const GLOSSARY = META.glossary || {};

function getGlossaryForQuestion(q) {
  const texts = [q.q];
  if(q.o && Array.isArray(q.o)) q.o.forEach(o => texts.push(o.t));
  if(q.e) texts.push(q.e);
  const fullText = texts.join(' ');
  const found = [];
  const sorted = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
  for(const term of sorted) {
    if(fullText.includes(term)) found.push({term, def: GLOSSARY[term]});
  }
  return found;
}

/* ================================================================
   ===================== 术语高亮 + 弹定义 ================
   ================================================================ */
// 长词优先排序，独立 token 边界匹配，避免 EBS 误标 Amazon EBS 中的 EBS 等
function getGlossarySortedKeys() {
  return Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
}

// 判断术语在文本中是否为独立出现（前后非字母/数字）
function isIndependentToken(text, idx, term) {
  const before = text[idx-1];
  const after = text[idx + term.length];
  const isLetter = c => c && /[A-Za-z0-9]/.test(c);
  return !isLetter(before) && !isLetter(after);
}

// 将解析正文中的术语高亮为可点击 span，返回 HTML
function fmtExp(s){ let t=(s===undefined||s===null)?'':String(s); t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); t=t.replace(/\n/g,'<br>'); t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); return t; }
function highlightGlossaryTerms(text) {
  if(!text) return text;
  const sortedKeys = getGlossarySortedKeys();
  let result = '';
  let i = 0;
  while(i < text.length) {
    let matched = false;
    for(const term of sortedKeys) {
      if(!term) continue;
      const idx = text.indexOf(term, i);
      if(idx === i && isIndependentToken(text, idx, term)) {
        const def = GLOSSARY[term] || '（暂无定义）';
        const termEsc = term.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const defEsc = def.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        result += `<span class="gloss-term" onclick="showGlossTip(event,'${termEsc}','${defEsc}')">${term}</span>`;
        i += term.length;
        matched = true;
        break;
      }
    }
    if(!matched) {
      // 中文等宽字符直接输出，保持原文本
      result += text[i];
      i++;
    }
  }
  return result;
}

// 点击术语弹出定义浮层
function showGlossTip(e, term, def) {
  e.stopPropagation();
  const tip = document.getElementById('glossTip');
  document.getElementById('glossTipTerm').textContent = term;
  document.getElementById('glossTipDef').textContent = def || '（暂无定义）';
  tip.style.display = 'block';
  // 定位：优先在点击位置下方，避免超出视口
  const pad = 12;
  let left = e.clientX + pad;
  let top = e.clientY + pad;
  // 先渲染再量尺寸
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if(left + tw > window.innerWidth - 8) left = e.clientX - tw - pad;
  if(top + th > window.innerHeight - 8) top = e.clientY - th - pad;
  if(left < 8) left = 8;
  if(top < 8) top = 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

function closeGlossTip() {
  document.getElementById('glossTip').style.display = 'none';
}

// 点击页面其它区域关闭浮层
document.addEventListener('click', function(e) {
  const tip = document.getElementById('glossTip');
  if(tip && tip.style.display === 'block' && !tip.contains(e.target)) {
    closeGlossTip();
  }
});

// 按 Esc 关闭浮层
