满足这些要求？","o":[{"l":"A","t":"Amazon Elastic File System（Amazon EFS）"},{"l":"B","t":"Amazon FSx for Lustre"},{"l":"C","t":"Amazon FSx for Windows File Server"},{"l":"D","t":"Amazon Elastic Block Store（Amazon EBS）"}],"a":["C"],"e":"**✅ 为什么 C.Amazon FSx for Windows File Server 对**：FSx for Windows File Server 原生支持 Microsoft 工作负载与 Windows 文件系统，SMB 协议+AD 集成+完全托管，与题干要求逐项对应。\n\n**❌ 为什么其他选项错**：\n- A. Amazon EFS：Linux NFS 文件系统\n- B. Amazon FSx for Lustre：高性能计算并行文件系统\n- D. Amazon EBS：块存储，非文件服务器\n\n**📌 关键概念**：文件共享服务按协议分流——Windows+SMB 走 FSx for Windows、Linux+NFS 走 EFS、HPC 高性能计算走 FSx for Lustre、块级存储走 EBS。题干同时给出「Microsoft 工作负载+SMB」双关键词，直接锁定 FSx Windows 版。FSx Windows 深度集成 AD 域控与 NTFS ACL 权限体系，支持用户配额与数据去重，管理体验贴近本地 Windows 文件服务器，既有 Windows 运维团队无需额外学习成本即可上手，是 Windows 应用（SQL Server/.NET）文件后端的首选。EFS 按需弹性伸缩容量并按使用付费。","s":"源#317"},{"id":"D3-318","d":3,"t":"single","q":"一家公司在 Amazon S3 存储桶中存储月度报告。公司将报告数据导出为逗号分隔值（.csv）文件。开发人员想要编写一个简单的查询，可以读取所有这些文件并生成摘要报告。开发人员应该使用哪个AWS 服务或功能以最小的运营开销满足这些要求？","o":[{"l":"A","t":"Amazon S3 选择"},{"l":"B","t":"Amazon Athena"},{"l":"C","t":"Amazon Redshift"},{"l":"D","t":"Amazon EC2"}],"a":["B"],"e":"**✅ 为什么 B.Amazon Athena 对**：Athena 是无服务器 SQL 查询服务，直接查询 S3 中的 CSV 文件，按扫描量计费、零基础设施管理，「简单查询+最小运营开销」完全匹配。\n\n**❌ 为什么其他选项错**：\n- A. Amazon S3 选择（S3 Select）：单对象局部过滤，跨多文件汇总能力弱\n- C. Amazon Redshift：数据仓库，需建仓加载，开销大\n- D. Amazon EC2：自建服务器，运维负担最重\n\n**📌 关键概念**：S3+SQL+免运维 → Athena（按扫描计费）；大规模数仓 → Redshift；「读取所有 CSV+汇总报告」是 Athena 典型场景，S3 Select 只做单对象级过滤。Athena 按扫描数据量计费，分区与列存格式（Parquet）可显著降成本。","s":"源#318"},{"id":"D3-320","d":3,"t":"single","q":"一家公司需要在 Amazon S3 中存储的文档中搜索文本。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon Kendra"},{"l":"B","t":"Amazon Rekognition"},{"l":"C","t":"Amazon Polly"},{"l":"D","t":"Amazon Lex"}],"a":["A"],"e":"**✅ 为什么 A.Amazon Kendra 对**：Kendra 是企业智能搜索服务，支持自然语言提问，可索引 S3 文档在内的多数据源，「文档文本搜索」正是其核心功能。\n\n**❌ 为什么其他选项错**：\n- B. Amazon Rekognition：图像/视频分析\n- C. Amazon Polly：文本转语音\n- D. Amazon Lex：对话机器人框架\n\n**📌 关键概念**：智能搜索 → Kendra（自然语言+多源索引）；图像视频 → Rekognition；语音合成 → Polly；对话机器人 → Lex；「文档中搜索文本」即 Kendra 场景。Kendra 支持自然语言问答与文档级权限过滤，与 OpenSearch 的关键词检索互补。Kendra 用 ML 排序理解文档语义，比传统关键词搜索更智能，适合企业知识库场景。","s":"源#320"},{"id":"D3-321","d":3,"t":"multiple","q":"哪些 AWS 服务利用全球边缘位置？（选择两个）","o":[{"l":"A","t":"AWS Fargate"},{"l":"B","t":"Amazon CloudFront"},{"l":"C","t":"AWS Global Accelerator"},{"l":"D","t":"AWS Wavelength"},{"l":"E","t":"Amazon VPC"}],"a":["B","C"],"e":"**✅ 为什么 B、C 对**：\n- B. Amazon CloudFront：CDN 服务，在全球边缘位置缓存并分发内容，就近服务终端用户\n- C. AWS Global Accelerator：利用全球边缘位置就近接收流量，再经 AWS 骨干网路由到应用\n\n**❌ 为什么其他选项错**：\n- A. AWS Fargate：无服务器容器计算引擎，运行于区域内的计算基础设施，不涉及边缘位置\n- D. AWS Wavelength：把 AWS 计算和存储嵌入 5G 运营商边缘，属边缘部署但非本题「全球边缘位置」语义（官方口径两大全球边缘服务为 CloudFront 与 Global Accelerator）\n- E. Amazon VPC：虚拟私有网络，是区域级网络容器，与全球边缘无关\n\n**📌 关键概念**：利用「全球边缘位置」的经典服务对=CloudFront（CDN 缓存分发）+ Global Accelerator（全球流量入口）；Wavelength 是 5G 边缘计算、非全球 CDN 边缘，题干「全球」二字即区分点。","s":"源#321"},{"id":"D3-322","d":3,"t":"single","q":"用户需要一个关系数据库，但没有资源来管理硬件、弹性和复制。哪个 AWS 服务选项满足用户的要求？","o":[{"l":"A","t":"在 Amazon Elastic Container Service（Amazon ECS）上运行 MySQL。"},{"l":"B","t":"在 Amazon EC2 上运行 MySQL。"},{"l":"C","t":"选择 Amazon RDS for MySQL。"},{"l":"D","t":"选择 Amazon ElastiCache for Redis。"}],"a":["C"],"e":"**✅ 为什么 C. 选择 Amazon RDS for MySQL 对**：RDS 是完全托管关系数据库，自动处理硬件配置、补丁、备份与复制（多 AZ），用户只管数据与应用，正合「没有资源管理硬件/弹性/复制」的诉求。\n\n**❌ 为什么其他选项错**：\n- A. ECS 上运行 MySQL：容器仍需自管集群与数据持久化，弹性与复制要自己搭\n- B. EC2 上运行 MySQL：IaaS 自管一切，硬件、补丁、复制全自理\n- D. ElastiCache for Redis：内存缓存引擎，非关系数据库，也不承载 MySQL 数据\n\n**📌 关键概念**：要「托管关系库+免运维」→ RDS；要「容器化自管」→ ECS；要「完全自控」→ EC2；题干「没有资源管理硬件/弹性/复制」三连即 RDS 题眼。","s":"源#322"},{"id":"D3-323","d":3,"t":"single","q":"一家公司需要尽快在 AWS 云中部署应用程序。公司还需要最小化与 AWS 资源管理相关的复杂性。公司应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"AWS Elastic Beanstalk"},{"l":"C","t":"Amazon EC2"},{"l":"D","t":"Amazon Personalize"}],"a":["B"],"e":"**✅ 为什么 B. AWS Elastic Beanstalk 对**：Elastic Beanstalk 是 PaaS 服务，自动完成容量供给、负载均衡、弹性伸缩与健康监控，开发者只需上传代码，「快速部署+最小化运维复杂性」两条件全中。\n\n**❌ 为什么其他选项错**：\n- A. AWS Config：配置审计与合规服务，不部署应用\n- C. Amazon EC2：IaaS 需自建整套部署与运维，复杂性与题干要求相反\n- D. Amazon Personalize：个性化推荐 ML 服务，与应用部署无关\n\n**📌 关键概念**：快速部署+自动管理基础设施 → Elastic Beanstalk（PaaS）；EC2 是 IaaS 全自管；Config 管合规、Personalize 管推荐，与部署无关。「不用管基础设施」=PaaS 题眼。","s":"源#323"},{"id":"D3-326","d":3,"t":"single","q":"一家公司想要建立 AWS 与其公司网络之间的私有网络连接。哪家 AWS 服务或功能将满足此要求？","o":[{"l":"A","t":"Amazon Connect"},{"l":"B","t":"Amazon Route 53"},{"l":"C","t":"AWS Direct Connect"},{"l":"D","t":"VPC 对等"}],"a":["C"],"e":"**✅ 为什么 C. AWS Direct Connect 对**：Direct Connect 通过物理专线在公司数据中心与 VPC 之间建立私有网络连接，绕开公网，安全稳定，正符合「建立私有网络连接」的表述。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Connect：云呼叫中心服务，与网络连接无关\n- B. Amazon Route 53：DNS 解析服务，不建网络通道\n- D. VPC 对等：连接两个 VPC 内部网络，不用于本地网络接入 AWS（且题干是「公司网络「公司网络↔AWS」）\n\n**📌 关键概念**：本地数据中心↔AWS 私有连接=Direct Connect（专线）；VPC 之间=对等连接；DNS=Route 53；「私有网络连接」与「公网 VPN 加密隧道」两类别要分清。","s":"源#326"},{"id":"D3-327","d":3,"t":"multiple","q":"以下哪些 AWS 服务或功能使用户能够在两个 VPC 之间创建网络连接？（选择两个）","o":[{"l":"A","t":"VPC 端点"},{"l":"B","t":"Amazon Route 53"},{"l":"C","t":"VPC 对等"},{"l":"D","t":"AWS Direct Connect"},{"l":"E","t":"AWS Transit Gateway"}],"a":["C","E"],"e":"**✅ 为什么 C、E 对**：\n- C. VPC 对等：直接连接两个 VPC，路由互通，是基础的双 VPC 互联方案\n- E. AWS Transit Gateway：中心枢纽式连接，可同时接入多个 VPC 与本地网络\n\n**❌ 为什么其他选项错**：\n- A. VPC 端点：私有连接 VPC 到 AWS 服务（如 S3），不连接 VPC 之间\n- B. Amazon Route 53：DNS 服务，不建网络通路\n- D. AWS Direct Connect：连接本地数据中心到 VPC，不是 VPC 互连\n\n**📌 关键概念**：VPC 互联两方案=VPC Peering（点对点）+ Transit Gateway（星型枢纽）；VPC Endpoint 是连服务、Direct Connect 是连本地，「两个 VPC 之间」题眼排除 A/D。另外注意 Peering 无传递性（A 连 B、B 连 C 不代表 A 连 C），多 VPC 网状互联正是 TGW 的价值所在。考试中「两个 VPC 之间」固定优先 Peering 与 TGW；出现「中心/多 VPC」字样则锁定 TGW。","s":"源#327"},{"id":"D3-328","d":3,"t":"single","q":"哪个 AWS 服务将文本转换为逼真的声音？","o":[{"l":"A","t":"Amazon Transcribe"},{"l":"B","t":"Amazon Rekognition"},{"l":"C","t":"Amazon Polly"},{"l":"D","t":"Amazon Textract"}],"a":["C"],"e":"**✅ 为什么 C. Amazon Polly 对**：Polly 是文本转语音（TTS）服务，将文本合成为逼真自然的人声，支持多语言多音色，「把文本转换为声音」正是其核心能力。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Transcribe：语音转文本（ASR），方向相反\n- B. Amazon Rekognition：图像/视频识别，不涉及语音\n- D. Amazon Textract：从文档提取文本与数据，与语音无关\n\n**📌 关键概念**：AI 服务四兄弟方向：Polly=文本→语音（TTS）、Transcribe=语音→文本（ASR）、Rekognition=看图、Textract=读文档；题干「文本转声音」即 Polly，方向别记反。Polly 支持神经语音（NTTS）音质更自然，适合有声读物、导航播报等场景。","s":"源#328"},{"id":"D3-329","d":3,"t":"single","q":"一家公司想使用应用堆栈在 AWS 云中运行工作负载。公司想使用预配置的实例。哪家AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon Lightsail"},{"l":"B","t":"Amazon Athena"},{"l":"C","t":"AWS Outposts"},{"l":"D","t":"Amazon EC2"}],"a":["A"],"e":"**✅ 为什么 A. Amazon Lightsail 对**：Lightsail 提供预配置实例与应用堆栈（WordPress、LAMP 等一键模板），起步简单、价格固定，正符合「使用预配置实例+应用堆栈」要求。\n\n**❌ 为什么其他选项错**：\n- B. Amazon Athena：S3 即席 SQL 查询服务，与应用部署无关\n- C. AWS Outposts：把 AWS 硬件放入本地机房，非预配置实例\n- D. Amazon EC2：裸 IaaS 虚拟机，需自行选型配置，非「预配置」定位\n\n**📌 关键概念**：预配置实例+固定月费一键起→Lightsail（轻量云）；EC2 需自管；Athena 查数据；Outposts 本地延伸；题干「预配置/应用堆栈」即 Lightsail 题眼。Lightsail 包含固定价格套餐（实例+存储+流量），适合小型网站与开发测试起步。","s":"源#329"},{"id":"D3-330","d":3,"t":"multiple","q":"哪些 AWS 服务支持 Savings Plans？（选择两个）","o":[{"l":"A","t":"Amazon EC2"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"Amazon SageMaker"},{"l":"D","t":"Amazon Redshift"},{"l":"E","t":"Amazon DynamoDB"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A. Amazon EC2：Savings Plans 覆盖 EC2 计算用量（含 Fargate/Lambda 用量）\n- C. Amazon SageMaker：其训练与推理用量同样支持 Savings Plans\n\n**❌ 为什么其他选项错**：\n- B. Amazon RDS：RDS 用预留实例（Reserved Instance）优惠，不纳入 Savings Plans\n- D. Amazon Redshift：Redshift 有自身 RI 体系，同样不属于 Savings Plans\n- E. Amazon DynamoDB：无 Savings Plans，按容量单位计费\n\n**📌 关键概念**：Savings Plans 覆盖面=EC2（含 Fargate/Lambda 用量）+ SageMaker；数据库类（RDS/Redshift/DynamoDB）走各自 RI/按量体系；「计算类服务」才是 Savings Plans 的适用对象。Savings Plans 承诺期可选 1 年或 3 年，付费方式可全预付/部分预付/无预付，与 RI 二选一使用。Savings Plans 与 RI 不可同时用于同一实例用量，规划时二选一即可享受最优折扣。","s":"源#330"},{"id":"D3-331","d":3,"t":"single","q":"哪家 AWS 服务或工具可以免费提供 Amazon EC2 资源的合适尺寸建议？","o":[{"l":"A","t":"AWS 良好构建工具"},{"l":"B","t":"Amazon CloudWatch"},{"l":"C","t":"AWS 成本探索器"},{"l":"D","t":"Amazon S3 分析"}],"a":["C"],"e":"**✅ 为什么 C. AWS 成本探索器 对**：Cost Explorer 内提供免费合适尺寸建议，基于利用率分析给出 EC2 实例的优化建议，「免费+合适尺寸建议」两要素同时满足。\n\n**❌ 为什么其他选项错**：\n- A. AWS 良好构建工具（Well-Architected Tool）：架构评审工具，审查设计而非做成本建议\n- B. Amazon CloudWatch：监控告警，不提供尺寸建议\n- D. Amazon S3 分析（Storage Analytics）：S3 存储分析，不针对 EC2\n\n**📌 关键概念**：EC2 合适尺寸建议的免费入口=Cost Explorer（成本优化视角）；计算优化器（Compute Optimizer）也做同样事但以 ML 引擎实现；本题「免费+EC2 尺寸」同时出现即指向 Cost Explorer。","s":"源#331"},{"id":"D3-332","d":3,"t":"single","q":"一家公司运营一个 PB 级数据仓库来分析其数据。公司想要一个解决方案，不需要手动管理和软件。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon DocumentDB（与 MongoDB 兼容）"},{"l":"B","t":"Amazon Redshift"},{"l":"C","t":"Amazon Neptune"},{"l":"D","t":"Amazon ElastiCache"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Redshift 对**：Redshift 是完全托管的 PB 级数据仓库，自动处理硬件与软件供给、补丁、备份，用户专注分析，「PB 级数据仓库+免运维」两条件同时命中。\n\n**❌ 为什么其他选项错**：\n- A. Amazon DocumentDB：MongoDB 兼容文档数据库，非数据仓库\n- C. Amazon Neptune：图数据库，存储与分析图结构数据\n- D. Amazon ElastiCache：内存缓存服务，不承担数据仓库分析\n\n**📌 关键概念**：PB 级+SQL 分析=Redshift；文档库=DocumentDB；图库=Neptune；缓存=ElastiCache；题干「PB 级数据仓库+无手动管理」即 Redshift 题眼。Redshift 列式存储+MPP 架构，适合大规模聚合分析；与 Athena（S3 查询）可互补组合。","s":"源#332"},{"id":"D3-333","d":3,"t":"single","q":"图书馆想要自动化基于电子书内容的分类。图书馆应该使用哪个 AWS 服务来满足这个要求？","o":[{"l":"A","t":"Amazon Redshift"},{"l":"B","t":"Amazon CloudSearch"},{"l":"C","t":"Amazon Comprehend"},{"l":"D","t":"Amazon Aurora"}],"a":["C"],"e":"**✅ 为什么 C. Amazon Comprehend 对**：Comprehend 是 NLP 服务，可自动识别文本主题、分类内容、提取关键短语，图书馆按电子书内容自动分类正是文本分类场景。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Redshift：数据仓库，分析结构化数据\n- B. Amazon CloudSearch：全文搜索引擎，检索文档但非自动分类\n- D. Amazon Aurora：关系型数据库，存储数据不做内容理解\n\n**📌 关键概念**：文本内容自动分类/理解→Comprehend（NLP）；全文检索→CloudSearch/OpenSearch；「按内容自动分类」即 Comprehend 题眼，与搜索（找得到）和存储（存得住）区分。Comprehend 还支持情绪分析、实体识别、语言检测，付费按处理文本量计费。","s":"源#333"},{"id":"D3-338","d":3,"t":"single","q":"一家公司想要跟踪其 Amazon S3 对象的标签、存储桶和前缀。哪个 S3 功能将满足这个要求？","o":[{"l":"A","t":"S3 库存报告"},{"l":"B","t":"S3 生命周期"},{"l":"C","t":"S3 版本控制"},{"l":"D","t":"S3 ACLs"}],"a":["A"],"e":"**✅ 为什么 A. S3 库存报告（Inventory）对**：S3 Inventory 定期输出对象的元数据清单（含标签、存储类别、加密状态等），可跟踪对象及其标签/存储桶/前缀，正是库存管理场景。\n\n**❌ 为什么其他选项错**：\n- B. S3 生命周期：自动在存储类间转移/过期对象，管理成本\n- C. S3 版本控制：保留对象版本历史，防误删\n- D. S3 ACLs：访问控制列表，管权限\n\n**📌 关键概念**：跟踪对象清单/标签→S3 Inventory；管理生命周期→Lifecycle 规则；版本历史→版本控制；权限→ACL/桶策略；题干「跟踪标签/存储桶/前缀」即 Inventory 题眼。","s":"源#338"},{"id":"D3-340","d":3,"t":"single","q":"一家公司创建了一个 Amazon EC2 实例。公司想要控制实例级别的入站和出站网络流量。哪个AWS资源或服务将满足这个要求？","o":[{"l":"A","t":"AWS 盾牌"},{"l":"B","t":"安全组"},{"l":"C","t":"网络访问分析器"},{"l":"D","t":"VPC 端点"}],"a":["B"],"e":"**✅ 为什么 B. 安全组 对**：安全组是实例级虚拟防火墙，通过入站/出站规则控制流向 EC2 实例的网络流量，「控制实例级别入站出站流量」正是安全组职责。\n\n**❌ 为什么其他选项错**：\n- A. AWS 盾牌（Shield）：DDoS 防护服务，不控制实例级流量规则\n- C. 网络访问分析器（Network Access Analyzer）：审计网络可达性，不执行流量控制\n- D. VPC 端点：私有连接 VPC 到服务，不控制实例流量\n\n**📌 关键概念**：实例级防火墙=安全组（SG，默认拒绝、显式允许）；子网级防火墙=网络 ACL（NACL，无状态）；「实例级别入站出站」即安全组题眼，与 NACL、Shield 区分。","s":"源#340"},{"id":"D3-342","d":3,"t":"single","q":"一家公司想要让网络应用程序与各种 AWS 服务进行交互。哪种 AWS 服务或资源将满足这个要求？","o":[{"l":"A","t":"AWS CloudShell"},{"l":"B","t":"AWS Marketplace"},{"l":"C","t":"AWS 管理控制台"},{"l":"D","t":"AWS CLI"}],"a":["C"],"e":"**✅ 为什么 C. AWS 管理控制台 对**：管理控制台是基于 Web 的图形界面，用户通过浏览器即可交互式管理各类 AWS 服务，**Web 界面+与多种服务交互**正是控制台定位。\n\n**❌ 为什么其他选项错**：\n- A. AWS CloudShell：浏览器内命令行终端，面向 CLI 用户\n- B. AWS Marketplace：应用/镜像商城，非管理入口\n- D. AWS CLI：命令行工具，需安装与编程使用，非 Web 界面\n\n**📌 关键概念**：图形化 Web 管理入口=AWS 管理控制台；命令行自动化=AWS CLI；浏览器内终端=CloudShell；题干强调「Web 应用程序+交互」即控制台题眼。管理控制台支持多因子认证（MFA）与 IAM 权限联动，是日常运维首选入口。","s":"源#342"},{"id":"D3-349","d":3,"t":"single","q":"Amazon S3 Intelligent-Tiering 存储类别提供什么？","o":[{"l":"A","t":"通过预留存储容量提供支付灵活性"},{"l":"B","t":"通过将数据复制到加密的 Amazon Elastic Block Store（Amazon EBS）卷进行长期数据保留"},{"l":"C","t":"通过在访问模式变化时在层之间移动对象来自动节省成本"},{"l":"D","t":"为数据归档提供安全、持久和最低成本的存储"}],"a":["C"],"e":"**✅ 为什么 C. 通过在访问模式变化时在层之间移动对象来自动节省成本 对**：S3 Intelligent-Tiering 监控访问模式，自动在频繁/不频繁访问层间移动对象（含归档即时访问层），无检索费，正符合**按访问模式自动分层省钱**描述。\n\n**❌ 为什么其他选项错**：\n- A. 通过预留存储容量提供支付灵活性：S3 无预留容量概念，这是计算 Savings 特征\n- B. 复制到加密 EBS 卷长期保留：EBS 是块存储，与 S3 分层无关\n- D. 为归档提供最低成本存储：这是 Glacier 的描述，非智能分层\n\n**📌 关键概念**：自动分层省钱=S3 Intelligent-Tiering（访问模式变化时自动移动，无检索费）；归档最低成本=Glacier/Deep Archive；「自动在层间移动」即智能分层题眼。","s":"源#349"},{"id":"D3-357","d":3,"t":"single","q":"一家公司需要将其本地数据中心连接到 AWS 云。公司需要一个专用的、低延迟的连接，具有一致的网络性能。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Global Accelerator"},{"l":"B","t":"Amazon CloudFront"},{"l":"C","t":"AWS Direct Connect"},{"l":"D","t":"AWS Managed VPN"}],"a":["C"],"e":"**✅ 为什么 C. AWS Direct Connect 对**：Direct Connect 提供本地数据中心到 AWS 的专用物理连接，低延迟、一致网络性能、绕过公网，**专用+低延迟+一致性能**三要素齐备。\n\n**❌ 为什么其他选项错**：\n- A. AWS Global Accelerator：优化公网流量路由，不建专用链路\n- B. Amazon CloudFront：CDN 内容分发，非网络连接服务\n- D. AWS Managed VPN：公网加密隧道，延迟受公网波动影响，非专用+一致\n\n**📌 关键概念**：本地↔AWS 专用低延迟=Direct Connect；成本敏感可接受公网=Site-to-Site VPN；题干「专用+一致网络性能」即专线题眼，与 VPN 区分。Direct Connect 可按带宽（1/10/100Gbps）选择，需配合虚拟接口（VIF）接入 VPC。","s":"源#357"},{"id":"D3-358","d":3,"t":"multiple","q":"为了最大化可持续性和最小化环境影响，公司应该应用哪些设计原则到 AWS 云工作负载？（选择两个）","o":[{"l":"A","t":"最大化 Amazon EC2 实例的利用率。"},{"l":"B","t":"最小化 Amazon EC2 实例的利用率。"},{"l":"C","t":"最小化使用托管服务。"},{"l":"D","t":"强制用户频繁重新安装应用程序。"},{"l":"E","t":"减少用户重新安装应用程序的需求。"}],"a":["A","E"],"e":"**✅ 为什么 A、E 对**：\n- A. 最大化 Amazon EC2 实例的利用率：提升资源利用率、减少闲置实例，是可持续性核心原则\n- E. 减少用户重新安装应用程序的需求：降低重复下载/安装的能耗与资源消耗\n\n**❌ 为什么其他选项错**：\n- B. 最小化 EC2 利用率：方向相反，降低利用率意味着浪费资源\n- C. 最小化使用托管服务：托管服务共享基础设施更节能高效，应多用而非少用\n- D. 频繁要求用户重装应用：增加不必要流量与能耗，违背可持续原则\n\n**📌 关键概念**：AWS 可持续性支柱=提升利用率（关闭闲置实例）+减少资源重复消耗（优化软件分发）；「最大化利用率、减少重复安装」是官方原则，反向选项直接排除。","s":"源#358"},{"id":"D3-361","d":3,"t":"multiple","q":"以下哪些 AWS 服务是无服务器的？（选择两个）","o":[{"l":"A","t":"AWS Outposts"},{"l":"B","t":"Amazon EC2"},{"l":"C","t":"Amazon Elastic Kubernetes Service（Amazon EKS）"},{"l":"D","t":"AWS Fargate"},{"l":"E","t":"AWS Lambda"}],"a":["D","E"],"e":"**✅ 为什么 D、E 对**：\n- D. AWS Fargate：无服务器容器计算引擎，无需管理底层服务器\n- E. AWS Lambda：事件驱动无服务器函数计算，免管理服务器\n\n**❌ 为什么其他选项错**：\n- A. AWS Outposts：本地机房硬件，非无服务器\n- B. Amazon EC2：需管理实例（补丁、容量、扩展），非无服务器\n- C. Amazon EKS：Kubernetes 编排平台，用户仍需管理控制平面与节点\n\n**📌 关键概念**：无服务器=不需管理服务器/容量（Lambda、Fargate、DynamoDB、S3 等）；「Fargate+Lambda」是容器与函数两大无服务器计算，与 EC2/EKS（自管计算）对照记忆。无服务器按需自动扩缩且只按用量付费，运行期间无闲置成本，是成本优化重要手段。","s":"源#361"},{"id":"D3-362","d":3,"t":"single","q":"当用户想要利用他们现有的每个套接字、每个核心或每个虚拟机的软件许可证，在AWS 上运行Microsoft Windows 服务器时，需要哪种 Amazon EC2 实例类型？","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"专用实例"},{"l":"C","t":"专用主机"},{"l":"D","t":"预留实例"}],"a":["C"],"e":"**✅ 为什么 C. 专用主机（Dedicated Host）对**：专用主机提供物理服务器整机专用，支持 BYOL（自带许可），可按套接字/核心/VM 粒度匹配自有许可证，正合「利用现有每套接字/核心/VM 软件许可」场景。\n\n**❌ 为什么其他选项错**：\n- A. 现货实例：竞价算力，无许可证承载能力\n- B. 专用实例：软硬件隔离但许可证按实例绑定，不提供主机级套接字可见性\n- D. 预留实例：计费折扣方式，不涉及物理主机与许可承载\n\n**📌 关键概念**：自带许可（BYOL）=专用主机（Dedicated Host，可见物理拓扑）；专用实例侧重隔离不侧重许可；「按套接字/核心/VM 授权」即专用主机题眼。","s":"源#362"},{"id":"D3-363","d":3,"t":"single","q":"解决方案架构师需要维护一组 Amazon EC2 实例，以便任何受损的实例都被新实例替换。解决方案架构师应该使用哪个 AWS 服务？","o":[{"l":"A","t":"Amazon Elastic Container Service（Amazon ECS）"},{"l":"B","t":"Amazon GuardDuty"},{"l":"C","t":"AWS Shield"},{"l":"D","t":"AWS Auto Scaling"}],"a":["D"],"e":"**✅ 为什么 D. AWS Auto Scaling 对**：Auto Scaling 维持实例组健康数量，健康检查失败/受损实例会自动终止并由新实例替换，保证组内实例数恒定，**受损实例被新实例替换**正是其行为。\n\n**❌ 为什么其他选项错**：\n- A. Amazon ECS：容器编排，不负责 EC2 替换\n- B. Amazon GuardDuty：威胁检测服务，发现威胁但不替换实例\n- C. AWS Shield：DDoS 防护，与实例替换无关\n\n**📌 关键概念**：自动替换受损实例→Auto Scaling（结合 ELB 健康检查）；发现威胁→GuardDuty；DDoS→Shield；「维护一组实例+自动替换」=ASG 题眼。ASG 常与 ELB 健康检查联动：ELB 判定不健康 → ASG 终止并新建，实现自愈。","s":"源#363"},{"id":"D3-364","d":3,"t":"single","q":"哪个 AWS 服务为本地应用程序提供对存储在 AWS 云中的数据的低延迟访问？","o":[{"l":"A","t":"Amazon CloudFront"},{"l":"B","t":"AWS Storage Gateway"},{"l":"C","t":"AWS Backup"},{"l":"D","t":"AWS DataSync"}],"a":["B"],"e":"**✅ 为什么 B. AWS Storage Gateway 对**：Storage Gateway 在本地部署虚拟设备，为本地应用提供低延迟访问云端数据的缓存（文件/卷/磁带网关），**本地应用低延迟访问云中数据**正是其核心场景。\n\n**❌ 为什么其他选项错**：\n- A. Amazon CloudFront：CDN，加速面向终端用户的 Web 内容，非本地应用直连\n- C. AWS Backup：备份编排服务，不提供在线低延迟访问\n- D. AWS DataSync：批量数据传输工具，非低延迟在线访问\n\n**📌 关键概念**：本地↔云低延迟访问=Storage Gateway（本地缓存加速）；批量迁移=DataSync；CDN 面向公网用户；「本地应用+低延迟访问云数据」即 Storage Gateway 题眼。","s":"源#364"},{"id":"D3-365","d":3,"t":"single","q":"Amazon CloudFront 提供什么？","o":[{"l":"A","t":"所有资源的自动扩展，以从单一统一界面为应用程序提供动力"},{"l":"B","t":"使用低延迟向全球用户安全交付数据、视频、应用程序和 API"},{"l":"C","t":"能够通过各种路由类型直接管理全球流量，包括基于延迟的路由、地理 DNS、地理接近性和加权轮询"},{"l":"D","t":"自动将传入应用程序流量分配到多个目标，例如 Amazon EC2 实例、容器、IP 地址和 AWS Lambda 函数"}],"a":["B"],"e":"**✅ 为什么 B. 使用低延迟向全球用户安全交付数据、视频、应用程序和 API 对**：Amazon CloudFront 是 CDN，通过全球边缘位置缓存内容，低延迟向全球用户安全交付数据、视频、应用程序与 API，正合定义。\n\n**❌ 为什么其他选项错**：\n- A. 所有资源自动扩展：这是 Auto Scaling 的描述\n- C. 多种路由类型直接管理全球流量：这是 Route 53 的特性（延迟路由/地理 DNS/加权轮询）\n- D. 自动分发流量到多目标：这是弹性负载均衡（ELB）的描述\n\n**📌 关键概念**：CDN=CloudFront（全球边缘缓存交付）；DNS 路由=Route 53；流量分发=ELB；自动扩展=Auto Scaling；「低延迟交付+边缘」即 CloudFront 题眼。CloudFront 还支持边缘函数（CloudFront Functions/Lambda@Edge）在边缘处理请求。","s":"源#365"},{"id":"D3-366","d":3,"t":"single","q":"哪个 AWS 服务支持在 AWS 云中部署和管理应用程序？","o":[{"l":"A","t":"Amazon CodeGuru"},{"l":"B","t":"AWS Fargate"},{"l":"C","t":"AWS CodeCommit"},{"l":"D","t":"AWS Elastic Beanstalk"}],"a":["D"],"e":"**✅ 为什么 D. AWS Elastic Beanstalk 对**：Elastic Beanstalk 是 PaaS，自动部署并管理应用（容量供给、负载均衡、扩展、监控），**在 AWS 云中部署与管理应用程序**正合定位。\n\n**❌ 为什么其他选项错**：\n- A. Amazon CodeGuru：代码审查与性能分析，不部署\n- B. AWS Fargate：容器计算引擎，需配合 ECS/EKS 使用\n- C. AWS CodeCommit：Git 托管仓库，存代码非部署\n\n**📌 关键概念**：部署并管理应用（PaaS）→Elastic Beanstalk；代码仓库→CodeCommit；代码审查→CodeGuru；容器运行时→Fargate；「部署+管理」即 Beanstalk 题眼。Beanstalk 支持 Java/Python/Node/Go 等多种平台，可随时切换到自管 EC2 环境。Beanstalk 兼容多种平台配置，可自定义 VPC 与实例类型，兼顾标准运维与自定义需求。","s":"源#366"},{"id":"D3-368","d":3,"t":"single","q":"哪个 Amazon S3 功能或存储类别使用 AWS 骨干网络和边缘位置来减少最终用户到Amazon S3 的延迟？","o":[{"l":"A","t":"S3 跨区域复制"},{"l":"B","t":"S3 传输加速"},{"l":"C","t":"S3 事件通知"},{"l":"D","t":"S3 标准不频繁访问（S3 标准 I"}],"a":["B"],"e":"**✅ 为什么 B. S3 传输加速对**：S3 Transfer Acceleration 使用 AWS 骨干网络与 CloudFront 边缘位置，优化数据上传/下载路径，降低远端用户到 S3 的延迟，**边缘+骨干网加速**双特征全中。\n\n**❌ 为什么其他选项错**：\n- A. S3 跨区域复制：数据在区域间复制，面向容灾与就近读取\n- C. S3 事件通知：对象事件触发通知，与网络加速无关\n- D. S3 标准-不频繁访问：存储类分层，不涉及网络路径\n\n**📌 关键概念**：边缘+骨干加速 S3 传输=Transfer Acceleration；跨区复制是容灾；事件通知是触发器；「减少延迟+边缘位置」即加速题眼。","s":"源#368"},{"id":"D3-369","d":3,"t":"single","q":"哪个 AWS 服务提供在 AWS 云中托管 NoSQL 数据库的能力？","o":[{"l":"A","t":"Amazon Aurora"},{"l":"B","t":"Amazon DynamoDB"},{"l":"C","t":"Amazon RDS"},{"l":"D","t":"Amazon Redshift"}],"a":["B"],"e":"**✅ 为什么 B. Amazon DynamoDB 对**：DynamoDB 是全托管、无服务器、高扩展 NoSQL 键值/文档数据库，**在 AWS 云中托管 NoSQL 数据库**能力与题设完全对应。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Aurora：关系型数据库（MySQL/PG 兼容）\n- C. Amazon RDS：关系型数据库服务\n- D. Amazon Redshift：数据仓库，非 NoSQL\n\n**📌 关键概念**：NoSQL→DynamoDB（键值/文档）；关系库→Aurora/RDS；数仓→Redshift；题干明确「NoSQL」即锁定 DynamoDB。DynamoDB 单表读写毫秒级延迟、自动分片扩展，支持 On-Demand 按量计费与自动扩缩，配 DAX 缓存可进一步提速，适合海量键值/文档类数据场景。常见考题干扰：RDS 是关系型、Redshift 是数仓，见到「键值/文档/无固定结构」字样即排除二者。","s":"源#369"},{"id":"D3-370","d":3,"t":"single","q":"哪个 AWS 服务是与 MySQL 和 PostgreSQL 兼容的关系数据库？","o":[{"l":"A","t":"Amazon Redshift"},{"l":"B","t":"Amazon DynamoDB"},{"l":"C","t":"Amazon Aurora"},{"l":"D","t":"Amazon Neptune"}],"a":["C"],"e":"**✅ 为什么 C. Amazon Aurora 对**：Aurora 是 AWS 自研关系数据库，与 MySQL 和 PostgreSQL 兼容，且性能更强（存储复制、自动扩展），是 AWS 对 MySQL/PG 的强化托管方案。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Redshift：列式数仓，不兼容 MySQL/PG 引擎\n- B. Amazon DynamoDB：NoSQL 键值库\n- D. Amazon Neptune：图数据库\n\n**📌 关键概念**：Aurora=与 MySQL/PG 兼容的高性能托管关系库；RDS 也可装 MySQL/PG 但 Aurora 是 AWS 原生强化版；题干「与 MySQL 和 PostgreSQL 兼容」即 Aurora。Aurora 存储自动扩展至 128TB、含跨可用区 6 副本且故障转移秒级完成；Serverless 模式可自动启停，适合间歇性数据库负载。常见考题干扰：Redshift 列式存储与 Neptune 图结构都不兼容 MySQL/PG 引擎，仅 Aurora/RDS 满足。","s":"源#370"},{"id":"D3-374","d":3,"t":"single","q":"哪个 AWS 服务使用 AWS Compute Optimizer 根据工作负载指标提供大小建议？","o":[{"l":"A","t":"Amazon EC2"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"Amazon Lightsail"},{"l":"D","t":"AWS Step Functions"}],"a":["A"],"e":"**✅ 为什么 A. Amazon EC2 对**：Compute Optimizer 通过分析资源利用率数据，为 Amazon EC2 实例（以及 Auto Scaling 组、Lambda、EBS 卷）提供合适尺寸建议，EC2 是其最主要服务对象。\n\n**❌ 为什么其他选项错**：\n- B. Amazon RDS：RDS 不在 Compute Optimizer 覆盖范围内（其建议面向计算类资源）\n- C. Amazon Lightsail：Lightsail 实例不纳入 Compute Optimizer 分析\n- D. AWS Step Functions：工作流编排服务，无实例尺寸概念\n\n**📌 关键概念**：Compute Optimizer 支持 EC2/ASG/Lambda/EBS；题干问「哪个 AWS 服务根据工作负载指标提供大小建议」= Compute Optimizer 应用在 EC2 上。Compute Optimizer 基于 CloudWatch 指标机器学习分析，可给出「降配/升配/无操作」三类建议。Compute Optimizer 需在控制台激活并授权，建议基于至少两周的指标数据生效。","s":"源#374"},{"id":"D3-376","d":3,"t":"single","q":"哪个 AWS 服务使用发布者和订阅者的组合？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"Amazon SNS（Amazon SNS）"},{"l":"C","t":"Amazon CloudWatch"},{"l":"D","t":"AWS CloudFormation"}],"a":["B"],"e":"**✅ 为什么 B. Amazon SNS 对**：SNS（Simple Notification Service）采用发布者-订阅者（Pub/Sub）消息模型，生产者向主题发布消息，多个订阅者异步接收，正是「使用发布者和订阅者的组合」的服务。\n\n**❌ 为什么其他选项错**：\n- A. AWS Lambda：函数计算，事件驱动但本身非 Pub/Sub 模型\n- C. Amazon CloudWatch：监控告警，不是消息分发模型\n- D. AWS CloudFormation：IaC 编排，与消息模型无关\n\n**📌 关键概念**：Pub/Sub=发布者/订阅者（SNS 主题+订阅）；队列=Poll 模型（SQS）；「发布者+订阅者」组合即 SNS 题眼，与 SQS（生产者消费者轮询）区分。SNS 主题可配多订阅端（Lambda/SQS/邮件/HTTP），实现一对多异步通知，与 SQS 解耦搭配。","s":"源#376"},{"id":"D3-377","d":3,"t":"single","q":"一家公司正处于计划迁移到 AWS 的早期阶段。公司想要获得未来 Amazon EC2 实例及其相关存储的每月预测总拥有成本。","o":[{"l":"A","t":"AWS 定价计算器"},{"l":"B","t":"AWS 计算优化器"},{"l":"C","t":"AWS 信任顾问"},{"l":"D","t":"AWS 应用程序迁移服务"}],"a":["A"],"e":"**✅ 为什么 A. AWS 定价计算器 对**：Pricing Calculator 是免费网页工具，按规划中的 EC2 实例、存储等配置估算月度成本，迁移早期「预估每月总拥有成本」正需此工具。\n\n**❌ 为什么其他选项错**：\n- B. AWS 计算优化器：对已运行资源给规格建议，不能预估未部署的成本\n- C. AWS 信任顾问：对现有部署做检查提示（ Trusted Advisor，机翻名），非成本预估\n- D. AWS 应用程序迁移服务：执行迁移的工具，不做成本测算\n\n**📌 关键概念**：事前预估成本 → Pricing Calculator（免费、配置即算）；事中优化 → Cost Explorer/Compute Optimizer；事后检查 → Trusted Advisor。「计划早期+预测月成本」即定价计算器题眼。","s":"源#377"},{"id":"D3-378","d":3,"t":"single","q":"哪个 AWS 服务或工具可以实时监视 AWS 资源和应用程序？","o":[{"l":"A","t":"AWS 信任顾问"},{"l":"B","t":"Amazon CloudWatch"},{"l":"C","t":"AWS CloudTrail"},{"l":"D","t":"AWS 成本探索器"}],"a":["B"],"e":"**✅ 为什么 B. Amazon CloudWatch 对**：CloudWatch 实时采集监控指标、日志与告警，展示资源利用与应用性能，**实时监控 AWS 资源和应用程序**正是其核心能力。\n\n**❌ 为什么其他选项错**：\n- A. AWS 信任顾问：最佳实践检查与建议，非实时监控\n- C. AWS CloudTrail：API 调用审计日志，管合规\n- D. AWS 成本探索器：成本可视化，非资源监控\n\n**📌 关键概念**：实时监控/指标/告警=CloudWatch；API 审计=CloudTrail；最佳实践=Trusted Advisor；成本=Cost Explorer；「实时监视资源」即 CloudWatch 题眼。CloudWatch 告警可触发 ASG 伸缩或 SNS 通知，支持自定义指标与日志监控。CloudWatch 日志可投递到 S3 长期留存，用于事后审计与分析。","s":"源#378"},{"id":"D3-380","d":3,"t":"single","q":"哪个 AWS 资源可以帮助公司在使用 Amazon EC2 实例时以使用承诺换取成本降低？","o":[{"l":"A","t":"计算储蓄计划"},{"l":"B","t":"自动扩展组"},{"l":"C","t":"按需实例"},{"l":"D","t":"EC2 实例存储"}],"a":["A"],"e":"**✅ 为什么 A. 计算储蓄计划对**：计算 Savings Plans（Compute Savings Plans）以 1 年/3 年使用量承诺换取折扣，覆盖 EC2/Fargate/Lambda 用量，正合「以使用承诺换取成本降低」描述。\n\n**❌ 为什么其他选项错**：\n- B. 自动扩展组：弹性伸缩机制，与定价折扣无关\n- C. 按需实例：按量付费无承诺，价格更高\n- D. EC2 实例存储：临时块存储，非定价方案\n\n**📌 关键概念**：承诺用量换折扣=Savings Plans（计算/EC2 实例两种）与预留实例；按需=无承诺全价；「使用承诺换取成本降低」即 Savings Plans 题眼。计算 Savings Plans 覆盖 EC2/Fargate/Lambda 三类用量，比 EC2 实例 Savings Plans 更灵活。","s":"源#380"},{"id":"D3-389","d":3,"t":"single","q":"一家公司想要将其本地 NoSQL 工作负载迁移到 Amazon DynamoDB。哪家 AWS 服务将满足这个要求？","o":[{"l":"A","t":"AWS 迁移中心"},{"l":"B","t":"AWS 数据库迁移服务（AWS DMS）"},{"l":"C","t":"迁移评估员"},{"l":"D","t":"AWS 应用程序迁移服务"}],"a":["B"],"e":"**✅ 为什么 B. AWS 数据库迁移服务（AWS DMS）对**：DMS 支持异构/同构数据库迁移，包括 MongoDB、Cassandra、Couchbase 等 NoSQL 源到 DynamoDB，**把本地 NoSQL 迁移到 DynamoDB**正是 DMS 场景。\n\n**❌ 为什么其他选项错**：\n- A. AWS 迁移中心：迁移项目跟踪与编排，不执行数据迁移\n- C. 迁移评估员：评估迁移可行性，不迁移数据\n- D. AWS 应用程序迁移服务（MGN）：服务器整机迁移，非数据库专项\n\n**📌 关键概念**：数据库迁移→DMS（含 NoSQL→DynamoDB）；服务器迁移→MGN；项目跟踪→Migration Hub；评估→Assessment；题干「NoSQL→DynamoDB」即 DMS。DMS 迁移过程中可持续复制（CDC），业务可不断服，切换窗口可控。DMS 支持不停机迁移（数据持续同步），配合 AWS SCT 做异构 schema 转换。","s":"源#389"},{"id":"D3-390","d":3,"t":"single","q":"一家公司正在寻找满足其性能和容量要求的正确 Amazon EC2 实例类型和大小。公司想要找到可能的最低成本。哪个选项准确地描述了公司的行为？","o":[{"l":"A","t":"自动扩展"},{"l":"B","t":"存储分层"},{"l":"C","t":"正确尺寸"},{"l":"D","t":"实例调度"}],"a":["C"],"e":"**✅ 为什么 C. 正确尺寸（Right-sizing）对**：正确尺寸指匹配性能/容量需求找到最优实例类型与大小、避免过度/不足配置，**以最低成本满足性能与容量要求**正是其定义。\n\n**❌ 为什么其他选项错**：\n- A. 自动扩展：动态增减实例应对负载变化\n- B. 存储分层：按访问频率转移数据到低成本存储类\n- D. 实例调度：定时启停实例省成本\n\n**📌 关键概念**：Right-sizing=选对实例规格（类型+大小）且不过配；Auto Scaling=调数量；「满足性能容量要求+最低成本」即正确尺寸题眼。","s":"源#390"},{"id":"D3-393","d":3,"t":"single","q":"一家公司想要使用机器学习能力来分析其 Amazon EC2 实例的日志数据，并有效地进行安全调查。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon Inspector"},{"l":"B","t":"Amazon QuickSight"},{"l":"C","t":"Amazon Detective"},{"l":"D","t":"Amazon GuardDuty"}],"a":["C"],"e":"**✅ 为什么 C. Amazon Detective 对**：Detective 用机器学习、统计分析与图论分析日志数据，自动生成安全调查结果（识别可疑活动与资源关联），**ML 分析日志+安全调查**正是其定位。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Inspector：漏洞与配置扫描，聚焦补丁与暴露面\n- B. Amazon QuickSight：BI 可视化，非安全调查\n- D. Amazon GuardDuty：持续威胁检测（找恶意活动），不侧重日志调查关联分析\n\n**📌 关键概念**：GuardDuty=持续威胁检测告警；Detective=事件调查分析（ML+图论）；Inspector=漏洞扫描；「分析日志+安全调查」→Detective 题眼。Detective 可与 GuardDuty/Security Hub 联动，一键生成调查包，减少人工排查工作量。","s":"源#393"},{"id":"D3-397","d":3,"t":"single","q":"一家公司想要在 AWS 上部署一个非容器化的基于 Java 的 Web 应用程序。公司希望使用一个托管服务快速部署应用程序。公司希望该服务自动提供容量、负载平衡、扩展和监控应用程序健康。哪家AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon Elastic Container Service（Amazon ECS）"},{"l":"B","t":"AWS Lambda"},{"l":"C","t":"Amazon Elastic Kubernetes Service（Amazon EKS）"},{"l":"D","t":"AWS Elastic Beanstalk"}],"a":["D"],"e":"**✅ 为什么 D. AWS Elastic Beanstalk 对**：Beanstalk 自动完成容量供给、负载均衡、弹性扩展与健康监控，支持 Java 应用直接部署（非容器），正合**非容器化 Java Web 应用+托管快速部署**要求。\n\n**❌ 为什么其他选项错**：\n- A. Amazon ECS：容器编排，需将应用容器化\n- B. AWS Lambda：函数计算，适合微服务/事件型，非 Web 应用整体部署\n- C. Amazon EKS：Kubernetes 容器编排，同样需容器化\n\n**📌 关键概念**：非容器化应用快速部署→Elastic Beanstalk（PaaS）；容器应用→ECS/EKS；函数→Lambda；题干「非容器化 Java」直接排除 ECS/EKS/Lambda。Beanstalk 支持滚动部署/分批更新，版本回滚便捷，适合快速迭代的 Web 应用。","s":"源#397"},{"id":"D3-399","d":3,"t":"single","q":"一家公司在 Amazon EC2 实例上部署了一个 Web 应用程序。EC2 实例的使用率很低。公司应该使用哪个 AWS 服务或功能来正确调整 EC2 实例的大小？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"AWS 成本异常检测"},{"l":"C","t":"AWS 预算"},{"l":"D","t":"AWS 计算优化器"}],"a":["D"],"e":"**✅ 为什么 D. AWS 计算优化器对**：Compute Optimizer 分析 EC2 利用率历史，识别过度配置，给出更合适实例类型/大小建议，**调整使用率低的 EC2 实例大小**正合题干。\n\n**❌ 为什么其他选项错**：\n- A. AWS Config：配置审计，不给尺寸建议\n- B. AWS 成本异常检测：检测异常支出，不做实例建议\n- C. AWS 预算：预算告警，不优化实例\n\n**📌 关键概念**：实例优化→Compute Optimizer；Cost Explorer 也含 right-sizing 建议；「低利用率 EC2→调整大小」即 Compute Optimizer 题眼。Compute Optimizer 需要至少 2 周（7 天最低）的利用率数据才给出建议，建议持续观察。低利用率实例（如 CPU 常年 <20%）是 Compute Optimizer 建议降配的典型对象。","s":"源#399"},{"id":"D3-400","d":3,"t":"single","q":"一家公司想要定义一个跨 AWS 服务的中央数据保护政策，用于计算、存储和数据库资源。哪家AWS服务将满足这个要求？","o":[{"l":"A","t":"AWS Batch"},{"l":"B","t":"AWS 弹性灾难恢复"},{"l":"C","t":"AWS 备份"},{"l":"D","t":"Amazon FSx"}],"a":["C"],"e":"**✅ 为什么 C. AWS 备份对**：AWS Backup 提供跨服务统一备份策略，可集中定义计算（EC2）、存储（EBS）、数据库（RDS）等资源的中央数据保护政策，正合**跨服务中央备份政策**要求。\n\n**❌ 为什么其他选项错**：\n- A. AWS Batch：批量作业计算服务，与备份无关\n- B. AWS 弹性灾难恢复（DRS）：灾备恢复编排，非日常备份策略\n- D. Amazon FSx：托管文件系统，非备份管理\n\n**📌 关键概念**：跨服务统一备份= AWS Backup（单一策略管 EC2/EBS/RDS 等）；DR 恢复=弹性灾难恢复 DRS；「中央数据保护政策」=Backup 题眼。AWS Backup 支持跨账户复制备份与集中审计，满足合规留存要求，比单服务手工快照更规范。","s":"源#400"},{"id":"D3-401","d":3,"t":"single","q":"一家公司需要根据业务类别对 AWS 使用成本进行分类和跟踪。公司应该使用哪个AWS 服务或功能来满足这些要求？","o":[{"l":"A","t":"成本分配标签"},{"l":"B","t":"AWS 组织"},{"l":"C","t":"AWS 安全中心"},{"l":"D","t":"AWS 成本和使用情况报告"}],"a":["A"],"e":"**✅ 为什么 A. 成本分配标签对**：成本分配标签（Cost Allocation Tags）激活后，可在成本报告/账单中按标签（项目/部门/应用）分类汇总成本，**按业务类别分类跟踪 AWS 成本**正是其用途。\n\n**❌ 为什么其他选项错**：\n- B. AWS 组织：多账户管理，不直接做成本分类维度\n- C. AWS 安全中心：安全态势聚合，与成本无关\n- D. AWS 成本和使用情况报告：输出原始账单数据，分类仍需标签支撑\n\n**📌 关键概念**：按业务标签分类成本=成本分配标签；预算告警=Budgets；成本可视化=Cost Explorer；「按业务类别分类跟踪」=标签题眼。","s":"源#401"},{"id":"D3-402","d":3,"t":"single","q":"哪个 AWS 服务可以迁移 AWS 存储服务之间的数据？","o":[{"l":"A","t":"AWS DataSync"},{"l":"B","t":"AWS Direct Connect"},{"l":"C","t":"AWS Lake Formation"},{"l":"D","t":"Amazon S3"}],"a":["A"],"e":"**✅ 为什么 A. AWS DataSync 对**：DataSync 自动化在线迁移/同步本地存储与 AWS 存储服务（S3、EFS、FSx 等）之间的数据，**迁移 AWS 存储服务之间的数据**正合定位。\n\n**❌ 为什么其他选项错**：\n- B. AWS Direct Connect：专线连接，不搬运数据\n- C. AWS Lake Formation：数据湖权限与建表服务\n- D. Amazon S3：对象存储本身，非迁移工具\n\n**📌 关键概念**：数据搬迁/同步=DataSync；云间存储迁移也常用 S3 Replication（跨桶/跨区）；专线=网络通道；「在 AWS 存储服务间迁移数据」=DataSync。DataSync 支持增量同步与限速调度，迁移后可自动校验完整性（checksum）。DataSync 同时支持线上（公网/VPN）与专线（DX）场景，传输全程加密。","s":"源#402"},{"id":"D3-411","d":3,"t":"single","q":"哪个 Amazon RDS 功能提供自动创建主数据库实例的能力，并同步将数据复制到另一个可用区的实例？","o":[{"l":"A","t":"只读副本"},{"l":"B","t":"蓝/绿部署"},{"l":"C","t":"多 AZ 部署"},{"l":"D","t":"预留实例"}],"a":["C"],"e":"**✅ 为什么 C. 多 AZ 部署 对**：多 AZ 部署自动在另一可用区创建备用实例并同步复制数据，主实例故障时自动切换，提供高可用与数据冗余，正合「自动创建主实例+同步复制到另一 AZ」的描述。\n\n**❌ 为什么其他选项错**：\n- A. 只读副本：异步复制、仅读、用于扩展读负载，不提供自动故障切换\n- B. 蓝/绿部署：两套环境做零停机切换发布，非高可用架构\n- D. 预留实例：计费折扣承诺，与复制无关\n\n**📌 关键概念**：高可用=多 AZ（同步复制+自动故障转移）；读扩展=只读副本（异步）；蓝绿=发布策略；RI=账单优惠。口诀「同步保命、异步扩读」。","s":"源#411"},{"id":"D3-414","d":3,"t":"multiple","q":"以下哪些可以是 AWS 云中的 VPC 组件？（选择两个）","o":[{"l":"A","t":"Amazon API Gateway"},{"l":"B","t":"Amazon S3 存储桶和对象"},{"l":"C","t":"AWS 存储网关"},{"l":"D","t":"互联网网关"},{"l":"E","t":"子网"}],"a":["D","E"],"e":"**✅ 为什么 D、E 对**：\n- D. 互联网网关：VPC 连接互联网的出口组件，是 VPC 的标准组成\n- E. 子网：VPC 内 IP 地址段的划分，资源（如 EC2）都在子网中启动\n\n**❌ 为什么其他选项错**：\n- A. Amazon API Gateway：API 托管服务，部署在 VPC 外\n- B. Amazon S3 存储桶和对象：S3 是区域级公共服务，不属于任何 VPC\n- C. AWS 存储网关：混合云存储服务，非 VPC 组件\n\n**📌 关键概念**：VPC 组件=子网/路由表/互联网网关/NAT 网关/安全组/网络 ACL 等；S3、API Gateway 等公共服务的资源不在 VPC 内（通过 VPC 端点私网访问它们）。VPC 内默认私有：无 IGW/路由指向即不可公网访问，公网访问需显式配置 IGW+NAT。","s":"源#414"},{"id":"D3-425","d":3,"t":"single","q":"哪个 AWS 服务或资源可以用来部署 AWS WAF 规则？","o":[{"l":"A","t":"Amazon EC2"},{"l":"B","t":"应用程序负载均衡器"},{"l":"C","t":"AWS 信任顾问"},{"l":"D","t":"网络负载均衡器"}],"a":["B"],"e":"**✅ 为什么 B. 应用程序负载均衡器 对**：AWS WAF 的 Web ACL 可挂载到 ALB（以及 CloudFront、API Gateway 等），在 ALB 上部署 WAF 规则可防护 HTTP/HTTPS 层攻击。\n\n**❌ 为什么其他选项错**：\n- A. Amazon EC2：计算实例，不能作为 WAF 规则部署位置\n- C. AWS 信任顾问：架构/成本检查工具，与 WAF 无关\n- D. 网络负载均衡器：四层（TCP）负载均衡，WAF 规则在七层，NLB 不支持挂载\n\n**📌 关键概念**：WAF 部署位置=CloudFront、ALB、API Gateway、AppSync、Cognito User Pool 等；NLB 是 L4 不支持。记「七层入口才能挂 WAF」。WAF 规则集（托管规则组）可一键启用常见 OWASP 攻击防护，如 SQL 注入/XSS 等。WAF 可结合托管规则组（AWS Managed Rules）快速上线基础防护，减少自写规则成本。","s":"源#425"},{"id":"D3-426","d":3,"t":"single","q":"一家公司在 Amazon EC2 实例上托管其网站。公司需要确保网站能够到达全球受众，并向用户提供最小的延迟。公司应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"Amazon Route 53"},{"l":"B","t":"Amazon CloudFront"},{"l":"C","t":"弹性负载均衡"},{"l":"D","t":"AWS Lambda"}],"a":["B"],"e":"**✅ 为什么 B. Amazon CloudFront 对**：CloudFront 是 CDN，把网站内容缓存到全球边缘节点，用户就近获取，全球受众+最小延迟两个要求同时满足。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Route 53：DNS 解析，不缓存内容\n- C. 弹性负载均衡：区域内多实例间分发流量，不解决全球距离问题\n- D. AWS Lambda：函数计算，与内容分发无关\n\n**📌 关键概念**：全球低延迟交付 → CloudFront；DNS → Route 53；区域内分发 → ELB。「全球+延迟」即 CDN 题眼。CloudFront 可与 S3 桶源站配合，实现静态资源全球加速，也可加速动态内容（API）。CloudFront 还提供 AWS Shield Standard 免费 DDoS 基础防护，与 CDN 搭配开箱即用。","s":"源#426"},{"id":"D3-430","d":3,"t":"single","q":"一家公司想要发现、准备、移动和整合来自多个来源的数据，用于数据分析和机器学习。哪家AWS无服务器数据集成服务可以满足这些要求？","o":[{"l":"A","t":"AWS Glue"},{"l":"B","t":"AWS 数据交换"},{"l":"C","t":"Amazon Athena"},{"l":"D","t":"Amazon EMR"}],"a":["A"],"e":"**✅ 为什么 A. AWS Glue 对**：Glue 是无服务器数据集成服务，自动发现、准备（ETL 清洗转换）、移动和整合多源数据，供分析与机器学习使用，「无服务器+数据集成」双关键词锁定。\n\n**❌ 为什么其他选项错**：\n- B. AWS 数据交换：第三方数据集订阅市场，非集成工具\n- C. Amazon Athena：S3 数据 SQL 查询，不做数据准备整合\n- D. Amazon EMR：托管 Spark/Hadoop 大数据集群，需管理集群\n\n**📌 关键概念**：数据集成/ETL → Glue（Serverless）；交互查询 → Athena；大数据集群 → EMR。「发现+准备+移动+整合」四动词连发即 Glue 题眼。Glue 的数据目录（Data Catalog）自动记录表结构，与 Athena 查询无缝衔接。","s":"源#430"},{"id":"D3-432","d":3,"t":"single","q":"一家公司在 Amazon EC2 实例上部署了其应用程序。该应用程序偶尔会出现需求的突然增加。公司希望确保其应用程序能够以最低的成本应对需求的变化。哪个 AWS 服务或概念将满足这些要求？","o":[{"l":"A","t":"AWS 自动扩展"},{"l":"B","t":"AWS 计算优化器"},{"l":"C","t":"AWS 成本探索器"},{"l":"D","t":"AWS 良好构建框架"}],"a":["A"],"e":"**✅ 为什么 A. AWS 自动扩展 对**：Auto Scaling 按需求自动增减 EC2 实例数量——需求激增时扩容保性能、低谷时缩容省成本，「应对需求变化+最低成本」正中其设计目标。\n\n**❌ 为什么其他选项错**：\n- B. AWS 计算优化器：给实例规格建议，不执行伸缩\n- C. AWS 成本探索器：成本分析与可视化，不调整容量\n- D. AWS 良好构建框架：架构方法论，非具体服务\n\n**📌 关键概念**：需求波动应对=Auto Scaling（弹性伸缩）；「偶尔激增+最低成本」是 ASG 的经典场景描述，配 CloudWatch 警报触发。ASG 支持最小/最大/期望实例数三值控制，配目标跟踪策略自动维持负载均衡目标。","s":"源#432"},{"id":"D3-438","d":3,"t":"single","q":"一家公司有不断产生的非结构化数据的应用程序。公司需要以持久和易于查询的方式存储数据。哪家AWS 服务可以满足这些要求？","o":[{"l":"A","t":"Amazon RDS"},{"l":"B","t":"Amazon Aurora"},{"l":"C","t":"Amazon QuickSight"},{"l":"D","t":"Amazon DynamoDB"}],"a":["D"],"e":"**✅ 为什么 D. Amazon DynamoDB 对**：DynamoDB 是全托管 NoSQL 数据库，天然适合非结构化/半结构化数据，持久可靠且支持灵活查询（键值/索引），三项要求全部覆盖。\n\n**❌ 为什么其他选项错**：\n- A. Amazon RDS：关系型，要求预定义 schema，不适合非结构化数据\n- B. Amazon Aurora：同样是关系型数据库\n- C. Amazon QuickSight：BI 可视化工具，不是数据库\n\n**📌 关键概念**：非结构化+易查询 → DynamoDB（NoSQL 灵活模型）；结构化事务 → RDS/Aurora。「不断产生的非结构化数据」是 DynamoDB 标志场景。DynamoDB 自动缩放到任意规模，可按需配置容量与自适应伸缩（On-Demand 模式）。","s":"源#438"},{"id":"D3-440","d":3,"t":"single","q":"一家公司想要将公司的本地容器基础设施迁移到 AWS 云。公司想要防止非计划的管理和运营成本，并适应无服务器架构。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon Connect"},{"l":"B","t":"AWS Fargate"},{"l":"C","t":"Amazon Lightsail"},{"l":"D","t":"Amazon EC2"}],"a":["B"],"e":"**✅ 为什么 B. AWS Fargate 对**：Fargate 是无服务器容器计算引擎，配 ECS/EKS 使用，用户不管理服务器、免运维，只按容器所需资源付费，防住了非计划的运营成本。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Connect：云联络中心服务\n- C. Amazon Lightsail：虚拟机套餐服务，非容器无服务器\n- D. Amazon EC2：虚拟机，需自管系统与容量\n\n**📌 关键概念**：容器无服务器=Fargate（Pay for 容器资源，无集群运维）；迁移到无服务器容器架构的标志性选择。「无服务器+容器」双关键词锁定。Fargate 无预留实例概念，按实际运行秒数计费，任务粒度资源隔离。","s":"源#440"},{"id":"D3-442","d":3,"t":"single","q":"一家电子商务公司已在 Amazon EC2 实例上部署了一个新的 Web 应用程序。公司希望将传入的HTTP流量均匀地分布在所有运行的实例上。哪个 AWS 服务或资源将满足这个要求？","o":[{"l":"A","t":"Amazon EC2 自动扩展"},{"l":"B","t":"应用程序负载均衡器"},{"l":"C","t":"网关负载均衡器"},{"l":"D","t":"网络负载均衡器"}],"a":["B"],"e":"**✅ 为什么 B. 应用程序负载均衡器 对**：ALB 工作在七层（HTTP/HTTPS），可将传入 HTTP 流量均匀分发到多个 EC2 实例等目标，正合「HTTP 流量+均匀分布」要求。\n\n**❌ 为什么其他选项错**：\n- A. Amazon EC2 自动扩展：增删实例数量，不分配流量\n- C. 网关负载均衡器：面向防火墙等第三方虚拟设备\n- D. 网络负载均衡器：四层（TCP/UDP）超高性能，非 HTTP 应用层分发\n\n**📌 关键概念**：HTTP/HTTPS 七层分发 → ALB；TCP/UDP 四层 → NLB；虚拟设备 → GWLB。「HTTP+均匀分布」即 ALB 题眼。ALB 支持基于路径/主机头的路由规则，可同时面向多目标组（蓝绿发布）。","s":"源#442"},{"id":"D3-443","d":3,"t":"single","q":"哪个 AWS 服务或功能使用户能够将 VPC 和本地网络连接到一个中央枢纽？","o":[{"l":"A","t":"虚拟专用网关"},{"l":"B","t":"AWS 传输网关"},{"l":"C","t":"互联网网关"},{"l":"D","t":"客户端网关"}],"a":["B"],"e":"**✅ 为什么 B. AWS 传输网关 对**：Transit Gateway 充当中心枢纽（云路由器），可将多个 VPC 与本地网络都接到这一个枢纽上，统一管理与路由，正合「VPC+本地网络连到中央枢纽」。\n\n**❌ 为什么其他选项错**：\n- A. 虚拟专用网关：VPN 接入侧网关，不做多网络枢纽\n- C. 互联网网关：VPC 连互联网出口，不连本地网络\n- D. 客户端网关：非 AWS 标准服务名（Site-to-Site VPN 用的是客户网关）\n\n**📌 关键概念**：中心枢纽/云路由器 → Transit Gateway；「多 VPC+本地网络+一个枢纽」是 TGW 教科书场景，替代全互联 peering。TGW 支持附件类型多样：VPC 附件、VPN 附件、DX 附件，路由表独立管理。","s":"源#443"},{"id":"D3-444","d":3,"t":"single","q":"一家公司希望在多个 Amazon EC2 实例上运行 CPU 密集型工作负载。为了满足这个要求，公司应该使用哪种 EC2 实例类型？","o":[{"l":"A","t":"通用实例"},{"l":"B","t":"计算优化实例"},{"l":"C","t":"内存优化实例"},{"l":"D","t":"存储优化实例"}],"a":["B"],"e":"**✅ 为什么 B. 计算优化实例 对**：计算优化型（C 系列）实例 CPU 与内存比例高，专为计算密集型工作负载提供最优性价比，CPU 密集型任务正选此型。\n\n**❌ 为什么其他选项错**：\n- A. 通用实例：CPU/内存均衡，适合日常多样化负载\n- C. 内存优化实例：大内存场景（如内存数据库）\n- D. 存储优化实例：高顺序读写存储场景\n\n**📌 关键概念**：实例族口诀=通用均衡（M/T）、计算优化（C）、内存优化（R/X）、存储优化（I/D）；「CPU 密集」秒选 C 系列。C 系列还可细分（如 C5/C6g），搭配弹性伸缩应对 CPU 负载波动效果更佳。","s":"源#444"},{"id":"D3-445","d":3,"t":"single","q":"一家公司正在连接多个 VPC 和本地网络。公司需要使用 AWS 服务作为云路由器来简化对等关系。公司应该使用哪家 AWS 服务来满足这个要求？","o":[{"l":"A","t":"AWS Direct Connect"},{"l":"B","t":"AWS 传输网关"},{"l":"C","t":"Amazon Connect"},{"l":"D","t":"Amazon Route 53"}],"a":["B"],"e":"**✅ 为什么 B. AWS 传输网关 对**：Transit Gateway 就是「云路由器」，连接多个 VPC 和本地网络，替代两两 peering，简化路由与对等关系管理。\n\n**❌ 为什么其他选项错**：\n- A. AWS Direct Connect：本地到 AWS 的专线，不做 VPC 间路由\n- C. Amazon Connect：云客服服务\n- D. Amazon Route 53：DNS 服务\n\n**📌 关键概念**：云路由器=Transit Gateway 的官方比喻；多网络互联+简化对等=TGW 题眼；与 D3-443 同考点（中央枢纽/云路由器）。n 个 VPC 只需 n 条连接到 TGW 即可全网互通，避免 peering 的 O(n²) 连接爆炸；跨区域互联需启用跨区域对等连接。与 VPC Peering 对比如下：Peering 无传递性且连接数随 VPC 数量平方增长，TGW 通过单一枢纽解决。","s":"源#445"},{"id":"D3-446","d":3,"t":"single","q":"一家公司存储大量数据，审计员每年只访问两次。为了以最低成本存储数据，公司应该使用哪种Amazon S3 存储类别？","o":[{"l":"A","t":"Amazon S3 Outposts"},{"l":"B","t":"Amazon S3 Glacier 即时检索"},{"l":"C","t":"Amazon S3 标准"},{"l":"D","t":"Amazon S3 智能分层"}],"a":["B"],"e":"**✅ 为什么 B. Amazon S3 Glacier 即时检索 对**：Glacier Instant Retrieval 面向一年访问几次的归档数据，毫秒级取回、存储成本远低于标准层，「每年访问两次+最低成本」正合其设计场景。\n\n**❌ 为什么其他选项错**：\n- A. Amazon S3 Outposts：本地部署的 S3，非低成本归档层\n- C. Amazon S3 标准：适合频繁访问，成本最高\n- D. Amazon S3 智能分层：适合访问模式未知/变化的数据，自动分层\n\n**📌 关键概念**：归档层选型=访问频率与取回速度的平衡；一年几次访问 → Glacier Instant Retrieval（毫秒取回）；极冷归档 → Deep Archive（最便宜但取回 12 小时）。「每年两次+低成本」锁定 GIR。","s":"源#446"},{"id":"D3-450","d":3,"t":"single","q":"一家公司希望在 AWS 云中存储其文件。用户需要能够直接使用公共 URL 下载这些文件。哪个AWS服务或功能将满足此要求？","o":[{"l":"A","t":"Amazon Redshift"},{"l":"B","t":"Amazon Elastic Block Store（Amazon EBS）"},{"l":"C","t":"Amazon Elastic File System（Amazon EFS）"},{"l":"D","t":"Amazon S3"}],"a":["D"],"e":"**✅ 为什么 D. Amazon S3 对**：S3 是对象存储，每个对象可通过 URL 直接访问，配置桶策略允许公共读后即可用公共 URL 下载文件，「公共 URL 下载」是 S3 原生能力。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Redshift：数据仓库，无公共 URL 文件下载\n- B. Amazon EBS：块存储，只能挂载到 EC2，无法直接 URL 访问\n- C. Amazon EFS：文件系统，通过 NFS 挂载访问，非公共 URL\n\n**📌 关键概念**：公共 URL 直达文件 → S3（对象存储+URL 寻址）；EBS 块挂载、EFS 网络挂载都不能直链。「URL 下载」是 S3 与块/文件存储的分水岭。S3 公共 URL 需注意安全：公开桶数据可被任何人下载，敏感文件应用预签名 URL。","s":"源#450"},{"id":"D3-451","d":3,"t":"single","q":"一家公司正在使用 AWS 作为其所有 IT 基础设施。公司的开发者被允许自己部署应用程序。开发者希望部署他们的应用程序，而不必自己提供基础设施。开发者应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS CloudFormation"},{"l":"B","t":"AWS CodeBuild"},{"l":"C","t":"AWS Elastic Beanstalk"},{"l":"D","t":"AWS CodeDeploy"}],"a":["C"],"e":"**✅ 为什么 C. AWS Elastic Beanstalk 对**：开发者只上传代码，Beanstalk 负责部署与容量供给、负载均衡、自动扩展、健康监控全套，「不必自己提供基础设施」的诉求完全命中。\n\n**❌ 为什么其他选项错**：\n- A. AWS CloudFormation：基础设施即代码，仍需编写模板自己定义\n- B. AWS CodeBuild：持续集成构建服务\n- D. AWS CodeDeploy：把代码部署到已有资源，不负责基础设施供给\n\n**📌 关键概念**：开发者免管基础设施 → Beanstalk（PaaS）；IaC 模板 → CloudFormation；CI/CD 流水线 → CodePipeline/CodeBuild/CodeDeploy。「上传代码即完事」是 Beanstalk 标志。Beanstalk 会自动生成环境 URL，支持蓝绿部署切换，降低上线风险。","s":"源#451"},{"id":"D3-452","d":3,"t":"single","q":"一家公司希望从其数据中获得洞察，并构建交互式数据可视化仪表板。哪个 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon SageMaker"},{"l":"B","t":"Amazon Rekognition"},{"l":"C","t":"Amazon QuickSight"},{"l":"D","t":"Amazon Kinesis"}],"a":["C"],"e":"**✅ 为什么 C. Amazon QuickSight 对**：QuickSight 是云 BI 服务，连接数据源构建交互式仪表板与可视化，向组织交付数据洞察，「交互式仪表板+洞察」正是其核心定位。\n\n**❌ 为什么其他选项错**：\n- A. Amazon SageMaker：机器学习建模平台\n- B. Amazon Rekognition：图像/视频分析\n- D. Amazon Kinesis：实时数据流收集\n\n**📌 关键概念**：BI 可视化/仪表板 → QuickSight；ML 建模 → SageMaker；流数据 → Kinesis。「交互式仪表板+洞察」即 QuickSight 题眼。QuickSight 提供 SPICE 内存引擎加速查询，可直连 Athena/Redshift/Glue 等数据源，支持嵌入企业应用与自然语言问答（Amazon Q）。注意与 SageMaker 区分：SageMaker 是 ML 建模训练，QuickSight 面向业务分析师的报表可视化。","s":"源#452"},{"id":"D3-453","d":3,"t":"single","q":"一位云工程师想要在 Amazon S3 中存储数据。工程师将每年访问一些数据，每天访问一些数据。哪种S3 存储类别将以最具成本效益的方式满足这些要求？","o":[{"l":"A","t":"S3 标准"},{"l":"B","t":"S3 Glacier Deep Archive"},{"l":"C","t":"S3 One Zone-Infrequent Access（S3 One Zone-IA）"},{"l":"D","t":"S3 智能分层"}],"a":["D"],"e":"**✅ 为什么 D. S3 智能分层 对**：智能分层自动在频繁/不频繁访问层之间移动对象，访问模式混合（一部分每年、一部分每天）正是其设计场景，无需人工干预即可成本最优。\n\n**❌ 为什么其他选项错**：\n- A. S3 标准：适合每天访问的数据，但每年访问的数据放这里成本偏高\n- B. S3 Glacier Deep Archive：最便宜的归档层，但取回需 12~48 小时，每天要访问的数据放不了\n- C. S3 One Zone-IA：仅适合不频繁访问且可容忍单 AZ 风险的数据\n\n**📌 关键概念**：访问模式混合/未知 → Intelligent-Tiering（自动分层无检索费）；「一部分这样、一部分那样」的混合场景是 IT 层的标志题眼。Deep Archive 只给极冷归档，标准层给高频访问。","s":"源#453"},{"id":"D3-456","d":3,"t":"single","q":"一家公司需要存储不经常使用的数据以进行数据存档和长期备份。哪种 AWS 服务或存储类别将以最具成本效益的方式满足这些要求？","o":[{"l":"A","t":"Amazon FSx for Lustre"},{"l":"B","t":"Amazon Elastic Block Store（Amazon EBS）"},{"l":"C","t":"Amazon Elastic File System（Amazon EFS）"},{"l":"D","t":"Amazon S3 Glacier Flexible Retrieval"}],"a":["D"],"e":"**✅ 为什么 D. Amazon S3 Glacier Flexible Retrieval 对**：Glacier Flexible Retrieval 面向存档与长期备份，存储成本极低，取回方式灵活（加速数分钟~标准 3~5 小时），「归档+长期备份+最低成本」三关键词全中。\n\n**❌ 为什么其他选项错**：\n- A. Amazon FSx for Lustre：高性能计算并行文件系统\n- B. Amazon EBS：块存储，挂载给 EC2 用，非归档层\n- C. Amazon EFS：文件存储，成本远高于归档层\n\n**📌 关键概念**：归档三档=Glacier Instant Retrieval（毫秒取回）、Glacier Flexible Retrieval（分钟~小时取回）、Deep Archive（12 小时+，最便宜）；「存档/长期备份」关键词锁定 Glacier 家族，非 S3 文件存储类。Glacier 家族与标准层的差价可达数倍，长期不动的备份数据放归档层是成本优化基本功；配合 S3 生命周期规则可实现自动降层。","s":"源#456"},{"id":"D3-458","d":3,"t":"single","q":"一家公司需要创建和发布交互式商业智能仪表板。仪表板需要由机器学习驱动的洞察力。哪个AWS服务或工具将满足这些要求？","o":[{"l":"A","t":"AWS Glue Studio"},{"l":"B","t":"Amazon QuickSight"},{"l":"C","t":"Amazon Redshift"},{"l":"D","t":"Amazon Athena"}],"a":["B"],"e":"**✅ 为什么 B. Amazon QuickSight 对**：QuickSight 是 BI 服务，创建交互式仪表板并内置 ML Insights（异常检测/预测/自动叙事），「交互式仪表板+机器学习洞察」双关键词正中其功能组合。\n\n**❌ 为什么其他选项错**：\n- A. AWS Glue Studio：ETL 数据准备的可视化界面，不做 BI 展示\n- C. Amazon Redshift：数据仓库，是数据源而非仪表板工具\n- D. Amazon Athena：SQL 查询服务，无仪表板能力\n\n**📌 关键概念**：BI+ML 仪表板=QuickSight（Q + ML Insights）；Glue 管数据准备、Redshift/Athena 管查询存储，QuickSight 管展示洞察。「仪表板+ML 洞察」组合秒选。QuickSight 采用按用户计费的 SPICE 加速引擎，与 Redshift/Athena/RDS 等数据源原生集成，Q 主题还支持自然语言提问。","s":"源#458"},{"id":"D3-464","d":3,"t":"single","q":"一家公司想要使用无服务器计算服务运行应用程序。哪个 AWS 服务将满足这个要求？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"AWS CloudFormation"},{"l":"C","t":"AWS Elastic Beanstalk"},{"l":"D","t":"弹性负载均衡"}],"a":["A"],"e":"**✅ 为什么 A. AWS Lambda 对**：Lambda 是无服务器计算服务，无需配置或管理服务器，按需执行代码并自动扩展，「无服务器计算」正是其定义。\n\n**❌ 为什么其他选项错**：\n- B. AWS CloudFormation：基础设施即代码模板服务\n- C. AWS Elastic Beanstalk：PaaS，底层仍是 EC2 服务器（只是托管）\n- D. 弹性负载均衡：流量分发，非计算服务\n\n**📌 关键概念**：无服务器计算三剑客=Lambda（函数）、Fargate（容器）、Aurora Serverless（数据库）；Beanstalk 是「托管服务器」而非「无服务器」。「无需管服务器跑代码」即 Lambda。Lambda 按请求次数与执行时长计费，闲时零成本，事件驱动架构（S3 上传、API 网关请求）是其经典触发源，冷启动是需要权衡的点。","s":"源#464"},{"id":"D3-465","d":3,"t":"single","q":"一家公司想要一个解决方案，根据当前负载自动调整使用的 Amazon EC2 实例数量。哪个AWS 产品将满足这些要求？","o":[{"l":"A","t":"专用主机"},{"l":"B","t":"放置组"},{"l":"C","t":"自动扩展组"},{"l":"D","t":"预留实例"}],"a":["C"],"e":"**✅ 为什么 C. 自动扩展组 对**：自动扩展组（ASG）按当前负载自动增减 EC2 实例数量——负载涨自动扩、负载落自动缩，「根据当前负载自动调整实例数量」正是 ASG 的核心机制。\n\n**❌ 为什么其他选项错**：\n- A. 专用主机：物理机独占，用于许可证合规\n- B. 放置组：控制实例物理摆放策略（集群/分布）\n- D. 预留实例：计费折扣承诺，不做容量调整\n\n**📌 关键概念**：自动扩缩=ASG（配 CloudWatch 警报触发）；专用主机管许可证、放置组管物理布局、RI 管账单。「根据负载自动调整数量」是 ASG 独有动词。","s":"源#465"},{"id":"D3-466","d":3,"t":"single","q":"一家公司正在构建 AWS 架构，以将实时数据源从本地数据中心传输到在 AWS 上运行的应用程序。公司需要一个一致的网络连接，最小化延迟。公司应该使用什么来连接应用程序和数据中心，以满足这些要求？","o":[{"l":"A","t":"AWS Direct Connect"},{"l":"B","t":"公共互联网"},{"l":"C","t":"AWS VPN"},{"l":"D","t":"Amazon Connect"}],"a":["A"],"e":"**✅ 为什么 A. AWS Direct Connect 对**：Direct Connect 提供本地数据中心到 AWS 的专用连接，不经公网、延迟低且网络体验一致，「实时数据+一致连接+最小延迟」正中专线场景。\n\n**❌ 为什么其他选项错**：\n- B. 公共互联网：延迟与带宽不可控\n- C. AWS VPN：走公网的加密隧道，性能受公网波动影响\n- D. Amazon Connect：云联络中心服务\n\n**📌 关键概念**：实时数据传输+一致性能=DX 专线；VPN 便宜但走公网；「一致+低延迟」双关键词排除公网类方案。DX 适合金融交易、实时流等对网络确定性要求高的场景。","s":"源#466"},{"id":"D3-467","d":3,"t":"single","q":"一家公司计划将其自定义营销应用程序和订单处理应用程序迁移到 AWS。公司需要在具有不同CPU、内存、存储和网络容量配置的不同类型的实例上部署应用程序。公司应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"Amazon Cognito"},{"l":"C","t":"Amazon Athena"},{"l":"D","t":"Amazon EC2"}],"a":["D"],"e":"**✅ 为什么 D. Amazon EC2 对**：EC2 提供多种实例类型，CPU/内存/存储/网络容量组合各异，可按应用需求精确选型，「不同类型实例部署不同应用」需要这种灵活的实例族矩阵。\n\n**❌ 为什么其他选项错**：\n- A. AWS Lambda：函数计算，无法自定义底层硬件配置\n- B. Amazon Cognito：用户身份认证服务\n- C. Amazon Athena：S3 数据查询，非计算服务\n\n**📌 关键概念**：自定义 CPU/内存/存储/网络组合=EC2 实例族（通用/计算优化/内存优化/存储优化）；Lambda 屏蔽底层无法选硬件。「精确控制实例配置」是 EC2 与无服务器服务的分界。","s":"源#467"},{"id":"D3-469","d":3,"t":"multiple","q":"哪些 AWS 服务可以托管 PostgreSQL 数据库？（选择两个）","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"Amazon Aurora"},{"l":"C","t":"Amazon EC2"},{"l":"D","t":"Amazon OpenSearch Service"},{"l":"E","t":"Amazon Elastic File System（Amazon EFS）"}],"a":["B","C"],"e":"**✅ 为什么 B、C 对**：\n- B. Amazon Aurora：提供与 PostgreSQL 兼容的托管版本，开箱即用\n- C. Amazon EC2：可在实例上自装自管 PostgreSQL\n\n**❌ 为什么其他选项错**：\n- A. Amazon S3：对象存储，不能跑数据库\n- D. Amazon OpenSearch Service：搜索/日志分析引擎\n- E. Amazon EFS：文件存储服务\n\n**📌 关键概念**：托管 PostgreSQL=Aurora PostgreSQL 版或 RDS for PostgreSQL；自管=EC2 自装；题干问「可以托管」故 EC2 也算。「托管 vs 自管」两条路都要看得见。托管路线省运维（自动补丁备份），自管路线 EC2 灵活可控（自定义引擎版本/参数），两者按团队运维能力取舍。若题干出现「托管/最小开销」优先 Aurora（自动备份补丁多 AZ），若强调「完全控制/自定义参数」则 EC2 自装 PostgreSQL 是唯一选择，考试常两者并列考。","s":"源#469"},{"id":"D3-471","d":3,"t":"single","q":"哪个 AWS 服务或功能需要互联网服务提供商（ISP）和托管设施来实施？","o":[{"l":"A","t":"AWS VPN"},{"l":"B","t":"Amazon Connect"},{"l":"C","t":"AWS Direct Connect"},{"l":"D","t":"互联网网关"}],"a":["C"],"e":"**✅ 为什么 C. AWS Direct Connect 对**：Direct Connect 建立专用物理连接，需要 ISP 或托管设施（colocation facility）提供到 AWS DX 接入点的物理链路，这是其部署前提。\n\n**❌ 为什么其他选项错**：\n- A. AWS VPN：走既有互联网，无需 ISP/机房介入\n- B. Amazon Connect：云客服服务\n- D. 互联网网关：VPC 逻辑组件，纯配置无需物理设施\n\n**📌 关键概念**：DX 的物理属性=需专线接入 AWS Direct Connect Location；VPN 是逻辑隧道即开即用。「需要 ISP/托管设施」是 DX 独有的部署特征。常见部署形态是在托管机房（如 Equinix）内完成交叉连接到 AWS DX 路由器，企业若无机房入驻则需向 ISP/合作伙伴购买转接服务。","s":"源#471"},{"id":"D3-473","d":3,"t":"single","q":"哪个 AWS 服务允许在多个 Amazon EC2 实例之间共享文件？","o":[{"l":"A","t":"AWS Direct Connect"},{"l":"B","t":"AWS Snowball Edge"},{"l":"C","t":"AWS Backup"},{"l":"D","t":"Amazon Elastic File System（Amazon EFS）"}],"a":["D"],"e":"**✅ 为什么 D. Amazon Elastic File System（Amazon EFS）对**：EFS 是弹性文件系统，可同时挂载到多个 EC2 实例实现文件共享，天然支持并发读写，「多个 EC2 实例之间共享文件」是其核心场景。\n\n**❌ 为什么其他选项错**：\n- A. AWS Direct Connect：网络专线\n- B. AWS Snowball Edge：离线迁移设备\n- C. AWS Backup：备份管理\n\n**📌 关键概念**：多实例共享存储=EFS（NFS 协议、多挂载）；EBS 是单实例块存储；「共享文件系统」关键词秒选 EFS。Windows 场景对应 FSx for Windows File Server。EFS 按实际使用量计费、容量自动伸缩，跨 AZ 高可用；同一文件系统可被数千实例并发挂载，是共享 HOME 目录/内容池的标准选择。","s":"源#473"},{"id":"D3-476","d":3,"t":"single","q":"一家公司正在将公共网站迁移到 AWS。公司希望在 AWS 上托管网站的域名。公司应该使用哪个AWS 服务来满足这个要求？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"Amazon Route 53"},{"l":"C","t":"Amazon CloudFront"},{"l":"D","t":"AWS Direct Connect"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Route 53 对**：Route 53 是高可用可扩展的 DNS 服务，支持域名注册与解析，把网站域名托管在 AWS 上正是其服务范围。\n\n**❌ 为什么其他选项错**：\n- A. AWS Lambda：函数计算\n- C. Amazon CloudFront：内容分发，不管理域名注册\n- D. AWS Direct Connect：网络专线\n\n**📌 关键概念**：域名注册/DNS 托管=Route 53；「托管域名」关键词秒选。Route 53 还提供健康检查与多种路由策略（延迟/加权/故障转移）。Route 53 100% 可用性 SLA，是全球任播网络；域名注册、健康检查、混合解析（公有/私有区域）一体化，53 端口即其名字由来。题干「托管网站的域名」指域名注册与 DNS 解析归 AWS 管，与网站文件放哪无关；注册新域名或转入现有域名都可在 Route 53 完成，年费按顶级域定价。","s":"源#476"},{"id":"D3-478","d":3,"t":"multiple","q":"哪种组合的 AWS 服务可用于将商业关系数据库迁移到 Amazon 管理的开源数据库？（选择两个）","o":[{"l":"A","t":"AWS 数据库迁移服务（AWS DMS）"},{"l":"B","t":"AWS 软件开发工具包（SDKs）"},{"l":"C","t":"AWS 架构转换工具"},{"l":"D","t":"AWS 系统管理器"},{"l":"E","t":"Amazon EMR"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A. AWS DMS：迁移数据本身，异构引擎（商业库→开源库）最小停机\n- C. AWS SCT（架构转换工具）：转换表结构、存储过程等 schema 从商业库到开源库\n\n**❌ 为什么其他选项错**：\n- B. AWS SDKs：开发工具包，与迁移无关\n- D. AWS 系统管理器：运维管理工具\n- E. Amazon EMR：大数据平台\n\n**📌 关键概念**：数据库迁移黄金组合=DMS（搬数据）+SCT（转结构）；「商业库→开源库」异构迁移必配 SCT。「架构转换」字眼就是 SCT 的中文名。DMS 支持同构与异构迁移，持续复制让源库保持在线，停机窗口可压缩到分钟级；SCT 还能评估转换工作量并生成迁移报告。","s":"源#478"},{"id":"D3-484","d":3,"t":"single","q":"一家公司想要运行一个图查询，提供信用卡用户的姓名、地址和交易。公司希望图表显示姓名、地址和交易是否表明可能的欺诈行为。哪家 AWS 数据库服务将满足这些要求？","o":[{"l":"A","t":"Amazon DocumentDB（与 MongoDB 兼容）"},{"l":"B","t":"Amazon Timestream"},{"l":"C","t":"Amazon DynamoDB"},{"l":"D","t":"Amazon Neptune"}],"a":["D"],"e":"**✅ 为什么 D. Amazon Neptune 对**：Neptune 是图数据库，擅长处理高度连接的数据关系（用户-地址-交易之间的关联网络），用图查询发现欺诈模式正是其典型场景。\n\n**❌ 为什么其他选项错**：\n- A. Amazon DocumentDB：文档数据库\n- B. Amazon Timestream：时间序列数据库\n- C. Amazon DynamoDB：键值 NoSQL\n\n**📌 关键概念**：「图查询」「关系网络」「高度连接数据」=Neptune 秒选；欺诈检测/社交网络/知识图谱是图数据库三大经典场景。关系型思维做关联查询会多表 JOIN 爆炸，图库天然高效。图数据库用顶点与边表达实体关系，多层关联遍历比关系库 JOIN 高效几个量级；Neptune 支持 openCypher/Gremlin/SPARQL 三种查询语言。","s":"源#484"},{"id":"D3-485","d":3,"t":"single","q":"哪个 AWS 服务提供机器学习能力，以检测和分析图像和视频中的内容？","o":[{"l":"A","t":"Amazon Connect"},{"l":"B","t":"Amazon Lightsail"},{"l":"C","t":"Amazon Personalize"},{"l":"D","t":"Amazon Rekognition"}],"a":["D"],"e":"**✅ 为什么 D. Amazon Rekognition 对**：Rekognition 提供图像与视频的 ML 分析能力（检测对象/场景/人脸/不当内容），「检测和分析图像和视频中的内容」就是它的官方定位。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Connect：云客服\n- B. Amazon Lightsail：轻量虚拟机\n- C. Amazon Personalize：个性化推荐\n\n**📌 关键概念**：视觉 AI=Rekognition；文本理解=Comprehend；语音转文字=Transcribe；文字转语音=Polly；个性化推荐=Personalize。「图像+视频」双关键词锁定 Rekognition。Rekognition 提供人脸比对、名人识别、内容审核（ unsafe content）、文字检测等 API，按图像/视频分钟数计费，无需 ML 背景。本题为定义类送分题，记住四个视觉动作：检测（Detect）、比对（Compare）、分析（Analyze）、审核（Moderation）都归 Rekognition，文档/音频类 AI 不沾边。","s":"源#485"},{"id":"D3-488","d":3,"t":"single","q":"一家公司需要提供客户服务，使用语音通话和网络聊天功能。哪家 AWS 服务可以满足这些要求？","o":[{"l":"A","t":"Amazon Aurora"},{"l":"B","t":"Amazon Connect"},{"l":"C","t":"Amazon WorkSpaces"},{"l":"D","t":"AWS Organizations"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Connect 对**：Amazon Connect 是云联络中心（contact center）服务，内置语音通话与网络聊天全渠道能力，「客服+语音+聊天」三关键词正中其定位。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Aurora：关系数据库\n- C. Amazon WorkSpaces：云桌面\n- D. AWS Organizations：多账户管理\n\n**📌 关键概念**：客户服务/联络中心=Connect；云桌面=WorkSpaces；多账户治理=Organizations。「提供客户服务」字眼是 Connect 题眼。Connect 基于云原生弹性扩容，按用量付费无最低承诺，提供全渠道路由、交互式语音应答与坐席管理面板，几步即可开通联络中心。注意与 Amazon Lex 区分：Lex 是构建聊天机器人的引擎，Connect 是完整客服中心（含坐席/路由/报表），题干出现「客户服务/客服/呼叫中心」即选 Connect。","s":"源#488"},{"id":"D3-489","d":3,"t":"single","q":"哪个 AWS 服务旨在帮助用户在数据仓库环境中处理大量数据？","o":[{"l":"A","t":"Amazon RDS"},{"l":"B","t":"Amazon DynamoDB"},{"l":"C","t":"Amazon Redshift"},{"l":"D","t":"Amazon Aurora"}],"a":["C"],"e":"**✅ 为什么 C. Amazon Redshift 对**：Redshift 是 PB 级云数据仓库，为大规模数据的复杂分析查询优化，「数据仓库+大量数据」双关键词锁定。\n\n**❌ 为什么其他选项错**：\n- A. Amazon RDS：事务型关系数据库\n- B. Amazon DynamoDB：NoSQL 键值库\n- D. Amazon Aurora：高性能事务型关系库\n\n**📌 关键概念**：数据仓库=Redshift（列存+MPP，面向分析）；RDS/Aurora 面向事务（OLTP）。「数据仓库环境」字眼出现即选 Redshift。Redshift 列存压缩比高，支持 Result Cache 与并发扩展，Redshift Spectrum 可直接查 S3 外表，数仓分层（ODS/DW/ADS）场景常用。数据仓库的判断词：星型/雪花模型、聚合分析、BI 报表、PB 级、列存；出现「事务/ACID/外键」则是 OLTP 方向，选 RDS/Aurora 而非 Redshift。","s":"源#489"},{"id":"D3-492","d":3,"t":"single","q":"哪个 AWS 计算服务使用户能够安全、可靠地大规模运行容器？","o":[{"l":"A","t":"Amazon Elastic Container Service (Amazon ECS)"},{"l":"B","t":"Amazon Aurora"},{"l":"C","t":"Amazon Athena"},{"l":"D","t":"Amazon Polly"}],"a":["A"],"e":"**✅ 为什么 A. Amazon Elastic Container Service (Amazon ECS) 对**：ECS 是全托管容器编排服务，安全可靠地大规模运行容器化应用，「大规模运行容器」正是其设计目标。\n\n**❌ 为什么其他选项错**：\n- B. Amazon Aurora：数据库\n- C. Amazon Athena：SQL 查询\n- D. Amazon Polly：语音合成\n\n**📌 关键概念**：容器编排=ECS（AWS 原生）或 EKS（Kubernetes）；Fargate 是其无服务器计算引擎。「容器+大规模」秒选 ECS/EKS。ECS 与 EC2/Fargate 两种启动类型搭配，任务定义声明容器规格，配 ALB 与自动扩展实现弹性服务， deeply 集成 IAM 与 VPC 网络。若题干强调「Kubernetes/开源生态/可移植」选 EKS，强调「AWS 原生/简单」选 ECS，强调「无服务器免管节点」则答案落到 Fargate，三词是容器题的三岔口。","s":"源#492"},{"id":"D3-495","d":3,"t":"single","q":"哪个 AWS 服务可以用来在特定的 Amazon CloudWatch 警报被触发时发送警报？","o":[{"l":"A","t":"AWS CloudTrail"},{"l":"B","t":"Amazon Simple Notification Service (Amazon SNS)"},{"l":"C","t":"Amazon Simple Queue Service (Amazon SQS)"},{"l":"D","t":"Amazon EventBridge"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Simple Notification Service (Amazon SNS) 对**：SNS 是发布/订阅通知服务，CloudWatch 警报触发的标准通知渠道就是 SNS（邮件/SMS/推送），「警报触发时发送警报」正中其用途。\n\n**❌ 为什么其他选项错**：\n- A. AWS CloudTrail：API 操作审计日志\n- C. Amazon SQS：消息队列（解耦），推送目标是服务而非人\n- D. Amazon EventBridge：事件路由总线，可触发但非「发送警报通知」首选\n\n**📌 关键概念**：CloudWatch Alarm → SNS → 人（邮件/短信）是告警通知经典链路；SQS 是队列缓冲、EventBridge 是事件路由。「发送警报（给人）」即 SNS。SNS 扇出多个订阅端，配合 SQS 可做消息持久化与削峰，CloudWatch→SNS→Lambda 也可实现告警自动处理，通知链路十分灵活。","s":"源#495"},{"id":"D3-496","d":3,"t":"single","q":"一位云实践者想要为其 AWS 工作负载使用一个高可用和可扩展的 DNS 服务。哪个AWS 服务将满足此要求？","o":[{"l":"A","t":"Amazon Route 53"},{"l":"B","t":"Amazon Lightsail"},{"l":"C","t":"AWS Amplify Hosting"},{"l":"D","t":"Amazon S3"}],"a":["A"],"e":"**✅ 为什么 A. Amazon Route 53 对**：Route 53 是高可用、可扩展的托管 DNS 服务，「高可用+可扩展+DNS」三关键词完全吻合其官方定位。\n\n**❌ 为什么其他选项错**：\n- B. Amazon Lightsail：轻量应用平台\n- C. AWS Amplify Hosting：Web 前端托管\n- D. Amazon S3：对象存储（可静态托管但非 DNS）\n\n**📌 关键概念**：DNS=Route 53（100% 可用性 SLA）；「DNS」字眼出现秒选。「托管域名+解析」组合是 Route 53 标志场景。DNS 是「域名→IP」的翻译官，Route 53 支持延迟路由/地理路由/加权轮询等策略，配合健康检查实现故障自动切换。本题为定义类送分题。DNS 服务的替代干扰项通常是 CloudFront（内容分发）与 VPC（网络隔离），看到「解析/域名/Zone」字眼直接锁定 Route 53 不动摇。","s":"源#496"},{"id":"D3-497","d":3,"t":"single","q":"根据 AWS 共享责任模型，哪项任务是客户的职责？","o":[{"l":"A","t":"维护运行 AWS Lambda 所需的基础设施"},{"l":"B","t":"更新 Amazon DynamoDB 实例的操作系统"},{"l":"C","t":"维护 Amazon S3 基础设施"},{"l":"D","t":"更新 Amazon EC2 实例上的客户操作系统"}],"a":["D"],"e":"**✅ 为什么 D. 更新 Amazon EC2 实例上的客户操作系统 对**：共享责任模型中客户负责「云中之安全」，EC2 实例内客户自装的 OS 打补丁是典型的客户责任。\n\n**❌ 为什么其他选项错**：\n- A. 维护 Lambda 基础设施：AWS 责任（无服务器底层全托管）\n- B. 更新 DynamoDB 实例的 OS：DynamoDB 无实例概念，底层由 AWS 管\n- C. 维护 S3 基础设施：AWS 责任\n\n**📌 关键概念**：责任分界线=客户管的都是「云中」（OS/应用/数据/IAM/网络配置）；AWS 管的「云本身」（硬件/设施/托管服务底层）。「EC2 上的客户 OS」是客户侧责任的标准样例。","s":"源#497"},{"id":"D3-502","d":3,"t":"single","q":"用户想要在 Amazon EC2 实例进入“停止”状态时调用 AWS Lambda 函数。哪种AWS 服务适用于此用例？","o":[{"l":"A","t":"Amazon EventBridge"},{"l":"B","t":"AWS Config"},{"l":"C","t":"Amazon Simple Notification Service (Amazon SNS)"},{"l":"D","t":"AWS CloudFormation"}],"a":["A"],"e":"**✅ 为什么 A. Amazon EventBridge 对**：EventBridge 是无服务器事件总线，可捕获 EC2 状态变化等 AWS 事件并路由到 Lambda 等目标，「EC2 进入停止状态时触发函数」是标准事件驱动模式。\n\n**❌ 为什么其他选项错**：\n- B. AWS Config：资源配置合规审计\n- C. Amazon SNS：通知推送（面向人/订阅端）\n- D. AWS CloudFormation：资源编排\n\n**📌 关键概念**：AWS 服务状态变化→触发函数=EventBridge（事件规则+目标）；「响应事件调用 Lambda」是 EB 的教科书场景。SNS 面向通知，EventBridge 面向事件路由。EventBridge 规则可按事件模式（如 instance state=stopped）精细匹配，还支持定时触发（原 CloudWatch Events 能力），是事件驱动架构核心组件。","s":"源#502"},{"id":"D3-503","d":3,"t":"single","q":"一家公司在本地拥有 MariaDB 数据库。公司想要将数据迁移到 AWS 云。哪个AWS 服务将以最小的运营开销托管此数据库？","o":[{"l":"A","t":"Amazon RDS"},{"l":"B","t":"Amazon Neptune"},{"l":"C","t":"Amazon S3"},{"l":"D","t":"Amazon DynamoDB"}],"a":["A"],"e":"**✅ 为什么 A. Amazon RDS 对**：RDS 是托管关系数据库，MariaDB 是其支持的引擎之一，硬件/设置/补丁/备份全由 AWS 处理，「最小运营开销托管 MariaDB」正中其定位。\n\n**❌ 为什么其他选项错**：\n- B. Amazon Neptune：图数据库\n- C. Amazon S3：对象存储\n- D. Amazon DynamoDB：NoSQL\n\n**📌 关键概念**：本地关系库上云=RDS（支持 MySQL/PostgreSQL/MariaDB/Oracle/SQL Server）；「托管+关系型+最小开销」三关键词锁定 RDS。迁移可用 DMS。RDS 提供 MariaDB/MySQL/PostgreSQL 等六大引擎，免费层含 750 小时 micro 实例；本地迁移用 DMS，同构引擎切换成本低。注意题干双关键词「关系数据库+托管自动更新」，DynamoDB 虽也是托管但是 NoSQL；EBS/S3 是存储不是数据库，MariaDB 属于 RDS 支持的引擎列表。","s":"源#503"},{"id":"D3-505","d":3,"t":"single","q":"公司实施 AWS CloudTrail 时使用了哪个 AWS 云设计原则？","o":[{"l":"A","t":"激活可追溯性。"},{"l":"B","t":"使用无服务器计算架构。"},{"l":"C","t":"按代码执行操作。"},{"l":"D","t":"在几分钟内走向全球。"}],"a":["A"],"e":"**✅ 为什么 A. 激活可追溯性。 对**：CloudTrail 记录账户内 API 操作历史，实现操作可审计可追溯，这正是 Well-Architected 的「启用可追溯性」设计原则。\n\n**❌ 为什么其他选项错**：\n- B. 使用无服务器计算架构：与审计日志无关\n- C. 按代码执行操作：IaC 原则，对应 CloudFormation\n- D. 在几分钟内走向全球：全球化部署原则，对应 CloudFront/边缘\n\n**📌 关键概念**：可追溯性=日志与审计（CloudTrail+Config）；「记录谁做了什么」即 Traceability。六大云设计原则之一，常与 IaC/无服务器/全球化原则互为干扰项。可追溯性要求日志集中化、可查询、可留存，CloudTrail 默认保留 90 天事件历史，可转存 S3 长期归档，配 Athena 即可 SQL 审计分析。","s":"源#505"},{"id":"D3-508","d":3,"t":"single","q":"一家公司想要调整其 Amazon EC2 实例的大小。哪种配置更改将以最小的运营开销满足此要求？","o":[{"l":"A","t":"在另一个可用区添加 EC2 实例。"},{"l":"B","t":"根据利用率更改 EC2 实例的大小和类型。"},{"l":"C","t":"将支付方式从按需更改为储蓄计划。"},{"l":"D","t":"使用更大的实例类型重新配置 EC2 实例。"}],"a":["B"],"e":"**✅ 为什么 B. 根据利用率更改 EC2 实例的大小和类型 对**：Right-sizing 就是按实际利用率调整实例规格——小马拉大车换小规格、大马拉小车换高规格，直接优化成本，运营开销最小。\n\n**❌ 为什么其他选项错**：\n- A. 在另一个可用区添加 EC2 实例：加实例提可用性，不是调整大小\n- C. 将支付方式从按需更改为储蓄计划：计费模式优化，与实例规格无关\n- D. 使用更大的实例类型重新配置 EC2 实例：方向单一（只升不降），且未提按利用率判断\n\n**📌 关键概念**：调整实例大小=按利用率选规格（配 Compute Optimizer 建议）；计费折扣（SP/RI）是另一维度。「根据利用率」是 Right-sizing 的题眼，C 选项混淆了「省钱」与「调整大小」两个概念。","s":"源#508"},{"id":"D3-513","d":3,"t":"single","q":"系统管理员想要监控公司 Amazon EC2 实例的 CPU 利用率。哪个 AWS 服务可以提供此信息？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"AWS Trusted Advisor"},{"l":"C","t":"AWS CloudTrail"},{"l":"D","t":"Amazon CloudWatch"}],"a":["D"],"e":"**✅ 为什么 D. Amazon CloudWatch 对**：CloudWatch 是 AWS 资源与应用的监控服务，CPU 利用率是 EC2 的标准指标，实时查看正是其基本功能。\n\n**❌ 为什么其他选项错**：\n- A. AWS Config：资源配置与合规审计\n- B. AWS Trusted Advisor：最佳实践检查建议\n- C. AWS CloudTrail：API 操作记录（谁做了什么）\n\n**📌 关键概念**：监控指标（CPU/内存/磁盘/网络）=CloudWatch；配置审计=Config；操作日志=CloudTrail；最佳实践建议=Trusted Advisor。四件套职责划分是 CLF 高频考点。CloudWatch 基本监控 5 分钟粒度免费，详细监控 1 分钟粒度收费；CPU/磁盘 IO/网络计数等指标自动上报，自定义指标可 PUT 上去。","s":"源#513"},{"id":"D3-515","d":3,"t":"single","q":"独立软件供应商想要交付和分享其自定义的 Amazon Machine Images（AMIs）给潜在客户。哪个AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Marketplace"},{"l":"B","t":"AWS Data Exchange"},{"l":"C","t":"Amazon EC2"},{"l":"D","t":"AWS Organizations"}],"a":["A"],"e":"**✅ 为什么 A. AWS Marketplace 对**：Marketplace 是数字软件目录，ISV 可上架自定义 AMI 等产品供客户查找、测试、购买、部署，「交付和分享自定义 AMI 给潜在客户」正是 ISV 上架场景。\n\n**❌ 为什么其他选项错**：\n- B. AWS Data Exchange：数据集订阅服务（卖数据不卖软件）\n- C. Amazon EC2：计算服务本身，非分发渠道\n- D. AWS Organizations：多账户管理\n\n**📌 关键概念**：软件/AMI 分发=Marketplace；数据集交易=Data Exchange。「交付给潜在客户」的商业化渠道字眼锁定 Marketplace。Marketplace 支持 AMI/容器镜像/SaaS 三种产品形态，ISV 列出产品后按实例小时或固定价计费分成，客户侧一键订阅部署。","s":"源#515"},{"id":"D3-516","d":3,"t":"single","q":"哪个组件必须附加到 VPC 以启用入站互联网访问？","o":[{"l":"A","t":"NAT 网关"},{"l":"B","t":"VPC 终端节点"},{"l":"C","t":"VPN 连接"},{"l":"D","t":"互联网网关"}],"a":["D"],"e":"**✅ 为什么 D. 互联网网关 对**：互联网网关（IGW）是 VPC 与互联网之间的水平扩展、高可用组件，必须附加到 VPC 才能让其中实例获得入站/出站互联网访问。\n\n**❌ 为什么其他选项错**：\n- A. NAT 网关：只解决私有子网出站，不提供入站访问\n- B. VPC 终端节点：私网访问 AWS 服务，不连互联网\n- C. VPN 连接：站点到站点加密通道，非互联网直连组件\n\n**📌 关键概念**：VPC 上互联网=必须挂 IGW；「入站互联网访问」关键词排除只管出站的 NAT。IGW+路由表+公有 IP 三者配合才通。","s":"源#516"},{"id":"D3-518","d":3,"t":"single","q":"一家公司正在构建一个应用程序，该应用程序每秒将接收数百万的数据库查询。公司需要数据存储能够扩展以满足这些需求。哪个 AWS 服务将满足此要求？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"AWS Cloud9"},{"l":"C","t":"Amazon ElastiCache for Memcached"},{"l":"D","t":"Amazon Neptune"}],"a":["A"],"e":"**✅ 为什么 A. Amazon DynamoDB 对**：DynamoDB 可支撑每秒数百万请求，毫秒级延迟、自动水平扩展，单表即可扛住超高吞吐，「每秒数百万查询+可扩展」正中其极限性能定位。\n\n**❌ 为什么其他选项错**：\n- B. AWS Cloud9：云 IDE\n- C. Amazon ElastiCache for Memcached：缓存层，加速用而非主存储\n- D. Amazon Neptune：图数据库，非通用高吞吐 KV\n\n**📌 关键概念**：超高吞吐+毫秒延迟=DynamoDB（自动分区扩容）；「每秒百万级」是 DynamoDB 标志题眼。广告/游戏/IoT 高并发场景标配。DynamoDB 自适应容量自动隔离热点分区，按需模式按读写请求计费免容量规划，全球表多区域复制毫秒级本地访问。","s":"源#518"},{"id":"D3-528","d":3,"t":"single","q":"哪个 AWS 服务提供 DNS 解析？","o":[{"l":"A","t":"Amazon CloudFront"},{"l":"B","t":"Amazon VPC"},{"l":"C","t":"Amazon Route 53"},{"l":"D","t":"AWS Direct Connect"}],"a":["C"],"e":"**✅ 为什么 C. Amazon Route 53 对**：Route 53 提供 DNS 解析服务（域名到 IP 的翻译），高可用可扩展，「DNS 解析」字眼直接锁定。\n\n**❌ 为什么其他选项错**：\n- A. Amazon CloudFront：内容分发（CDN）\n- B. Amazon VPC：私有网络\n- D. AWS Direct Connect：专线接入\n\n**📌 关键概念**：DNS=Route 53；CDN=CloudFront；专线=DX。三个网络服务职责清晰：解析/分发/接入。「提供 DNS 解析」是送分题眼。Route 53 解析记录类型有 A/AAAA/CNAME/ALIAS 等，ALIAS 可直指 AWS 资源（如 ELB/CloudFront）且健康检查联动免费查询。Route 53 域名由「zone」组织，分公有托管区（互联网解析）与私有托管区（VPC 内解析），流量策略还可做加权灰度发布，是 DNS 题的万能答案。","s":"源#528"},{"id":"D3-533","d":3,"t":"single","q":"哪个 AWS 解决方案使公司能够使用诸如 NFS 之类的协议在 Amazon S3 中存储和检索对象？","o":[{"l":"A","t":"Amazon FSx for Lustre"},{"l":"B","t":"AWS Storage Gateway 卷网关"},{"l":"C","t":"AWS Storage Gateway 文件网关"},{"l":"D","t":"Amazon Elastic File System（Amazon EFS）"}],"a":["C"],"e":"**✅ 为什么 C. AWS Storage Gateway 文件网关 对**：文件网关把 S3 桶通过 NFS/SMB 协议暴露成本地文件接口，应用程序像读写本地文件一样操作 S3 对象，「用 NFS 协议访问 S3」正是其功能。\n\n**❌ 为什么其他选项错**：\n- A. Amazon FSx for Lustre：HPC 并行文件系统（可链接 S3 但非网关形态）\n- B. AWS Storage Gateway 卷网关：暴露 iSCSI 块卷，非 NFS 文件接口\n- D. Amazon EFS：自己的文件系统，不是 S3 的协议入口\n\n**📌 关键概念**：文件协议访问 S3=Storage Gateway 文件网关（NFS/SMB→S3）；卷网关给块、磁带网关给备份。「用 NFS 存取 S3 对象」是文件网关标志题眼。文件网关本地缓存保留热数据，读写命中本地、未命中回源 S3，既保留文件语义又获得 S3 的 11 个 9 持久性与低成本。","s":"源#533"},{"id":"D3-535","d":3,"t":"single","q":"根据 AWS 共享责任模型，哪项任务是客户的责任？","o":[{"l":"A","t":"在 Amazon EC2 实例上部署的客户端操作系统打补丁。"},{"l":"B","t":"控制对 AWS 数据中心的物理访问。"},{"l":"C","t":"控制对 AWS 底层硬件的访问。"},{"l":"D","t":"在 Amazon S3 上部署的主机操作系统打补丁。"}],"a":["A"],"e":"**✅ 为什么 A. 在 Amazon EC2 实例上部署的客户端操作系统打补丁。 对**：共享责任模型中客户负责云中安全，EC2 实例内的客户操作系统（ guest OS）打补丁是客户的典型职责。\n\n**❌ 为什么其他选项错**：\n- B. 控制对 AWS 数据中心的物理访问：AWS 责任\n- C. 控制对 AWS 底层硬件的访问：AWS 责任\n- D. 在 Amazon S3 上部署的主机操作系统打补丁：S3 无主机 OS 概念（对象存储）\n\n**📌 关键概念**：客户侧=客户 OS 补丁/安全组/IAM/数据加密；AWS 侧=设施/硬件/托管服务底层。「数据中心/硬件/物理」字眼都是 AWS 责任侧。","s":"源#535"},{"id":"D3-537","d":3,"t":"single","q":"一家公司想要使用自动化视频分析来识别进入其办公室的员工。哪个 AWS 服务将满足此要求？","o":[{"l":"A","t":"Amazon Rekognition"},{"l":"B","t":"Amazon Polly"},{"l":"C","t":"Amazon Cognito"},{"l":"D","t":"AWS Lambda"}],"a":["A"],"e":"**✅ 为什么 A. Amazon Rekognition 对**：Rekognition 提供基于深度学习的图像/视频分析，可识别人员（人脸识别/人员检测），「自动化视频分析识别员工」正是其能力范围。\n\n**❌ 为什么其他选项错**：\n- B. Amazon Polly：文本转语音\n- C. Amazon Cognito：用户身份管理（认证授权）\n- D. AWS Lambda：函数计算\n\n**📌 关键概念**：视觉识别（人脸/人员/物体）=Rekognition；Cognito 管「登录身份」而非「摄像头识别」。视频里认人只能 Rekognition。人脸识别（face detection/comparison）与人员路径追踪是两个 API：DetectFaces 提取面部属性，SearchFacesByImage 在集合中比对身份。视频识别是流式任务：Kinesis Video Streams 传入，Rekognition Video 异步处理，结果含人脸轨迹与时间戳，门禁/考勤场景再加 Lambda 落库即可。","s":"源#537"},{"id":"D3-542","d":3,"t":"single","q":"一家电子商务公司想要在其托管网站的 Amazon EC2 实例之间分配流量。哪个AWS 服务或资源将满足这些要求？","o":[{"l":"A","t":"应用程序负载均衡器"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"AWS CloudHSM"},{"l":"D","t":"AWS Direct Connect"}],"a":["A"],"e":"**✅ 为什么 A. 应用程序负载均衡器 对**：ALB 把传入流量分发到多个 EC2 实例，支持七层（HTTP）路由，「在实例之间分配流量」正中负载均衡定义。\n\n**❌ 为什么其他选项错**：\n- B. AWS WAF：Web 应用防火墙（防护而非分发）\n- C. AWS CloudHSM：硬件加密机\n- D. AWS Direct Connect：专线接入\n\n**📌 关键概念**：流量分发=ALB/NLB/GWLB 家族；WAF 管安全、HSM 管加密、DX 管接入。「分配流量」动词一出就选 LB。ALB 支持路径/主机头/查询字符串等七层路由规则，健康检查自动剔除故障实例，跨 AZ 分发提升容错，配 ASG 实现弹性伸缩。","s":"源#542"},{"id":"D3-547","d":3,"t":"single","q":"一家公司需要维持带宽吞吐量并提供比基于公共互联网的连接更一致的网络体验。公司应该选择哪个AWS 服务？","o":[{"l":"A","t":"AWS VPN"},{"l":"B","t":"AWS Direct Connect"},{"l":"C","t":"Amazon Connect"},{"l":"D","t":"Amazon CloudFront"}],"a":["B"],"e":"**✅ 为什么 B. AWS Direct Connect 对**：Direct Connect 提供专用连接，带宽吞吐稳定、网络体验比公网一致，维持带宽+一致体验两个要求同时满足。\n\n**❌ 为什么其他选项错**：\n- A. AWS VPN：走公网加密，性能受公网波动影响\n- C. Amazon Connect：云客服\n- D. Amazon CloudFront：CDN\n\n**📌 关键概念**：一致网络体验=DX（专用线路无公网抖动）；「比公共互联网更一致」是 DX 官方对比口径。金融/实时场景选 DX。DX 提供 1/10/100 Gbps 端口，支持 BGP 动态路由与故障冗余，混合 DNS（Route 53 Resolver）配合可实现内外部域名互通。对比记忆：VPN 分钟级开通、按小时计费、性能随公网；DX 数周开通、端口小时费+专线月费、性能稳定。题目强调「一致/吞吐维持」就选 DX 无悬念。","s":"源#547"},{"id":"D3-550","d":3,"t":"single","q":"一家公司需要使用 SQL 语法直接查询 Amazon S3 存储桶中的对象。公司可以使用哪个AWS 服务来满足此要求？","o":[{"l":"A","t":"AWS Glue"},{"l":"B","t":"Amazon Athena"},{"l":"C","t":"AWS Lambda"},{"l":"D","t":"Amazon Kinesis"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Athena 对**：Athena 是无服务器交互式查询服务，用标准 SQL 直接查 S3 中的数据，无需任何基础设施，「SQL+直接查 S3」双关键词锁定。\n\n**❌ 为什么其他选项错**：\n- A. AWS Glue：ETL 数据集成（准备数据而非查询）\n- C. AWS Lambda：函数计算\n- D. Amazon Kinesis：实时流收集\n\n**📌 关键概念**：SQL 查 S3=Athena（按扫描量计费）；Glue 管 ETL、Kinesis 管流。「直接查询 S3」是 Athena 标志题眼。配 Glue Data Catalog 元数据。Athena 按扫描数据量每 TB 计费，分区裁剪与 Parquet 列存格式可将成本降低数倍；查询结果可回写 S3 或接 QuickSight 可视化。Athena 无服务器属性意味着无集群无容量规划，来一个查询起一个执行环境；与 Redshift 的区别：Athena 查存量数据偶尔分析，Redshift 是重度数仓场景。","s":"源#550"},{"id":"D3-551","d":3,"t":"single","q":"一家公司使用 Amazon RDS 进行产品数据库。公司希望确保数据库高度可用。哪个Amazon RDS 功能将满足此要求？","o":[{"l":"A","t":"读取副本"},{"l":"B","t":"蓝/绿部署"},{"l":"C","t":"多 AZ 部署"},{"l":"D","t":"预留实例"}],"a":["C"],"e":"**✅ 为什么 C. 多 AZ 部署 对**：多 AZ 部署在另一可用区维护同步备用副本，主库故障自动故障转移，是 RDS 高可用性的标准答案。\n\n**❌ 为什么其他选项错**：\n- A. 读取副本：异步复制、只读，主要为了扩展读负载\n- B. 蓝/绿部署：发布切换策略，非高可用机制\n- D. 预留实例：计费折扣\n\n**📌 关键概念**：RDS 高可用=多 AZ（同步+自动切换）；读扩展=只读副本（异步）。「高度可用」题眼配多 AZ。与 D3-411 同考点。多 AZ 切换是 RDS 免干预的自动过程，终端连接字符串保持不变（DNS 自动指向备用），生产数据库的高可用标配，与读扩展互不冲突可叠加。","s":"源#551"},{"id":"D3-552","d":3,"t":"single","q":"哪个 AWS 服务为容器提供无服务器计算？","o":[{"l":"A","t":"Amazon Simple Queue Service（Amazon SQS）"},{"l":"B","t":"AWS Fargate"},{"l":"C","t":"AWS Elastic Beanstalk"},{"l":"D","t":"Amazon SageMaker"}],"a":["B"],"e":"**✅ 为什么 B. AWS Fargate 对**：Fargate 是容器专用的无服务器计算引擎，不管理服务器或集群即可跑容器，「为容器提供无服务器计算」就是其定义。\n\n**❌ 为什么其他选项错**：\n- A. Amazon SQS：消息队列\n- C. AWS Elastic Beanstalk：应用托管平台（底层仍是服务器）\n- D. Amazon SageMaker：机器学习平台\n\n**📌 关键概念**：容器+无服务器=Fargate（配 ECS/EKS）；「容器的无服务器」是 Fargate 的官方标签。Lambda 是函数、Fargate 是容器。Fargate 按 vCPU 与内存的每秒用量计费，任务粒度隔离，免管节点补丁与集群自动升级，是容器安全合规场景的省心之选。","s":"源#552"},{"id":"D3-555","d":3,"t":"single","q":"一家公司计划将 Amazon EC2 实例用作 Web 服务器。来自世界各地的客户将使用这些Web 服务器。大多数客户每天只会在特定时段使用 Web 服务器。公司应如何部署 EC2 实例以实现最低运营成本？","o":[{"l":"A","t":"在多个可用区"},{"l":"B","t":"在自动扩展组中"},{"l":"C","t":"在放置组中"},{"l":"D","t":"在私有子网中"}],"a":["B"],"e":"**✅ 为什么 B. 在自动扩展组中 对**：ASG 按时段性需求自动增减实例，忙时扩、闲时缩，全球特定时段的潮汐流量正好用弹性伸缩省钱省运维。\n\n**❌ 为什么其他选项错**：\n- A. 在多个可用区：提升容错，不解决成本\n- C. 在放置组：物理布局策略\n- D. 在私有子网：网络隔离属性\n\n**📌 关键概念**：时段性负载+最低成本=ASG 弹性伸缩；「每天特定时段」是潮汐流量描述，配计划扩缩（scheduled scaling）。多 AZ 是可用性维度，与成本无关。ASG 可配 CloudWatch 指标目标追踪（如 CPU 保持 40%），也可用计划动作在可预期高峰前预热扩容，闲时缩到最小实例数守住成本。","s":"源#555"},{"id":"D3-558","d":3,"t":"single","q":"一家公司需要对最近的 AWS 账户活动进行审计。审计将调查谁发起了一个事件以及执行了哪些操作。公司应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"Amazon Rekognition"},{"l":"C","t":"AWS CloudTrail"},{"l":"D","t":"Amazon Simple Notification Service（Amazon SNS）"}],"a":["C"],"e":"**✅ 为什么 C. AWS CloudTrail 对**：CloudTrail 记录账户活动历史（谁在何时通过何种方式执行了什么操作），审计「谁发起了事件+执行了哪些操作」正是其核心价值。\n\n**❌ 为什么其他选项错**：\n- A. AWS Config：资源配置状态审计（配置了什么）\n- B. Amazon Rekognition：图像视频分析\n- D. Amazon SNS：通知服务\n\n**📌 关键概念**：谁做了什么=CloudTrail（API 调用日志）；资源配置变化=Config。「谁发起/执行操作」字眼是审计题眼，取证调查必选 CloudTrail。CloudTrail 记录管理事件（默认免费）与数据事件（收费），可配多 Trail 分发到不同 S3 桶，组织层面可统一收集所有账户日志。","s":"源#558"},{"id":"D3-560","d":3,"t":"single","q":"一家公司需要使用 AWS 技术部署静态网站。哪种解决方案以最小的运营开销满足此要求？","o":[{"l":"A","t":"在 Amazon EC2 上部署网站。"},{"l":"B","t":"在 AWS Elastic Beanstalk 上托管网站。"},{"l":"C","t":"使用 Amazon Lightsail 部署网站。"},{"l":"D","t":"在 Amazon S3 上托管网站。"}],"a":["D"],"e":"**✅ 为什么 D. 在 Amazon S3 上托管网站 对**：S3 静态网站托管无需任何服务器管理，上传文件开启即用，「静态网站+最小运营开销」正是 S3 的经典场景。\n\n**❌ 为什么其他选项错**：\n- A. 在 EC2 上部署：需要 OS/补丁/扩容全套运维\n- B. Elastic Beanstalk 托管：仍跑在 EC2 上，开销大于 S3\n- C. Lightsail 部署：虚拟机套餐，仍要管实例\n\n**📌 关键概念**：静态网站最省方案=S3 网站托管（可配 CloudFront+Route 53 加速域名）；「静态+最小开销」秒选 S3。动态网站才轮到 EC2/Beanstalk。S3 静态托管绑定自定义域名需配 Route 53 ALIAS，全球加速套 CloudFront 并开 HTTPS，整个静态站无一台服务器要管。","s":"源#560"},{"id":"D3-561","d":3,"t":"single","q":"AWS 成本探索器可以提供哪些建议来帮助降低成本？","o":[{"l":"A","t":"使用特定的数据库引擎。"},{"l":"B","t":"更改应用程序的编程语言。"},{"l":"C","t":"部署特定的操作系统。"},{"l":"D","t":"终止空闲实例。"}],"a":["D"],"e":"**✅ 为什么 D. 终止空闲实例 对**：Cost Explorer 的成本优化建议包含识别并终止闲置计费的空闲资源（idle resources），直接砍掉无效支出。\n\n**❌ 为什么其他选项错**：\n- A. 使用特定的数据库引擎：业务技术选型，不是成本工具建议\n- B. 更改应用程序的编程语言：与成本工具无关\n- C. 部署特定的操作系统：同上\n\n**📌 关键概念**：Cost Explorer 建议=闲置资源清理+Right-sizing+Savings Plans 推荐；「空闲实例」是成本工具能识别的浪费。技术栈选择不是成本工具的职责范围。Cost Explorer 还提供 Savings Plans 购买建议与预算告警联动，RES（右侧资源闲置）视图直接列出低利用 EC2/EBS/ELB 资源清单。","s":"源#561"},{"id":"D3-564","d":3,"t":"single","q":"哪个 Amazon EC2 预留实例的期限承诺将为用户提供最大的成本节省？","o":[{"l":"A","t":"1 年"},{"l":"B","t":"2 年"},{"l":"C","t":"3 年"},{"l":"D","t":"5 年"}],"a":["C"],"e":"**✅ 为什么 C. 3 年 对**：预留实例/储蓄计划的期限承诺越长折扣越大，可选期限为 1 年或 3 年，3 年承诺换最大节省。\n\n**❌ 为什么其他选项错**：\n- A. 1 年：折扣小于 3 年\n- B. 2 年：非 EC2 RI 标准期限选项（RI 只有 1 年/3 年两档）\n- D. 5 年：不存在的期限选项\n\n**📌 关键概念**：RI 期限只有 1 年/3 年两档，长期承诺=更深的折扣；「最大节省选最长承诺」。2 年/5 年都是干扰项，记住标准档位即可排除。RI 还有 All/Partial Upfront/No Upfront 三种付款档，付得越多折得越深；Savings Plans 同样 1/3 年档，灵活性高于 RI 但口径是用量承诺。","s":"源#564"},{"id":"D3-569","d":3,"t":"single","q":"一家公司将在未来 3 年内在 Amazon EC2 实例上运行可预测的计算工作负载。工作负载对公司至关重要。公司想要优化运行工作负载的成本。哪种解决方案将满足这些要求？","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"专用主机"},{"l":"C","t":"储蓄计划"},{"l":"D","t":"按需实例"}],"a":["C"],"e":"**✅ 为什么 C. 储蓄计划 对**：未来 3 年持续运行的可预测关键工作负载，用 Savings Plans 承诺 3 年稳定用量可换最大折扣，同时保障关键负载持续运行，成本与稳定性双达标。\n\n**❌ 为什么其他选项错**：\n- A. 现货实例：可能被回收，关键负载不可承受中断风险\n- B. 专用主机：物理独占，面向许可证合规而非省钱\n- D. 按需实例：无折扣，成本最高\n\n**📌 关键概念**：可预测+长期+关键=储蓄计划（承诺用量换折扣）；可中断+省钱=Spot；「至关重要」排除 Spot 的中断风险。SP 灵活覆盖 EC2/Fargate/Lambda。","s":"源#569"},{"id":"D3-573","d":3,"t":"multiple","q":"一家公司已将其工作负载迁移到 AWS 云。公司想要优化现有的 Amazon EC2 资源。哪些AWS 服务或工具提供此功能？（选择两项。）","o":[{"l":"A","t":"AWS Elastic Beanstalk"},{"l":"B","t":"AWS 成本探索器"},{"l":"C","t":"Amazon Detective"},{"l":"D","t":"AWS 计算优化器"},{"l":"E","t":"AWS 计费指挥家"}],"a":["B","D"],"e":"**✅ 为什么 B、D 对**：\n- B. AWS 成本探索器：成本视角分析+闲置/Right-sizing 建议\n- D. AWS 计算优化器：ML 分析使用模式推荐最优实例类型与大小\n\n**❌ 为什么其他选项错**：\n- A. AWS Elastic Beanstalk：应用部署平台\n- C. Amazon Detective：安全调查分析\n- E. AWS 计费指挥家：账单管理服务（Billing Conductor，机翻名），非资源优化\n\n**📌 关键概念**：EC2 优化双工具=Cost Explorer（成本+闲置建议）与 Compute Optimizer（规格推荐）；Detective 管安全调查、Billing Conductor 管账单展示，都不是优化工具。Compute Optimizer 基于至少 30 天 CloudWatch 指标出建议，分 EC2/EBS/Lambda/ASG 四类，可导出报告；Cost Explorer 侧重点是花钱视角。这题与单选版「优化 EC2 资源」互为变体：单选版常考 Compute Optimizer 一个，多选版加入 Cost Explorer；两个工具名称里都带「优化/成本」字样易混淆，按「规格推荐 vs 成本视角」区分。","s":"源#573"},{"id":"D3-586","d":3,"t":"single","q":"一家公司需要了解该公司创建的 AWS 资源的事件历史记录。 哪项 AWS 服务将提供此信息？","o":[{"l":"A","t":"Amazon CloudWatch"},{"l":"B","t":"AWS CloudTrail"},{"l":"C","t":"Amazon Aurora"},{"l":"D","t":"Amazon EventBridge"}],"a":["B"],"e":"**✅ 为什么 B. AWS CloudTrail 对**：CloudTrail 提供 AWS 账户的事件历史记录（API 调用等），「谁创建的什么资源」可从其日志中完整回溯。\n\n**❌ 为什么其他选项错**：\n- A. Amazon CloudWatch：监控指标与日志（性能视角）\n- C. Amazon Aurora：数据库\n- D. Amazon EventBridge：事件路由（转发不存历史）\n\n**📌 关键概念**：资源操作历史=CloudTrail（审计视角）；CloudWatch 管性能指标。「事件历史记录」字眼是 CloudTrail 题眼，与 CloudWatch 的 metrics 区分。CloudTrail 事件含「谁（用户身份）/何时（时间戳）/做什么（API 名）/对什么（资源 ARN）/从哪（源 IP）」五要素，审计取证按要素拼装即可。CloudTrail 与 Config 组合拳：Trail 记操作流水，Config 记配置快照与合规规则，安全事件复盘时两者时间线对齐分析，考点常互相做干扰项。","s":"源#586"},{"id":"D3-587","d":3,"t":"single","q":"一家公司想在 AWS 云中运行关系数据库。该公司想使用一项托管服务，该服务将安装数据库并运行定期的软件更新。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"Amazon Elastic Block Store（Amazon EBS）"},{"l":"D","t":"Amazon DynamoDB"}],"a":["B"],"e":"**✅ 为什么 B. Amazon RDS 对**：RDS 托管关系数据库，自动安装数据库软件并执行定期更新补丁，「托管+自动更新」两个关键词全中。\n\n**❌ 为什么其他选项错**：\n- A. Amazon S3：对象存储\n- C. Amazon EBS：块存储\n- D. Amazon DynamoDB：NoSQL（是托管但非关系型）\n\n**📌 关键概念**：托管关系库=RDS（自动补丁/备份/多 AZ）；「安装数据库+定期软件更新」正是 RDS 免运维描述。NoSQL 场景换 DynamoDB。RDS 自动补丁可设定维护窗口与版本升级，多 AZ 部署时补丁先从备用实例开始以降低影响；快照保留期可自定义。「托管服务」的标志能力就是题干两个动词：安装（自动部署引擎）与定期更新（自动补丁），这两个动词也出现在 RDS 官方产品描述里，遇到即秒选。","s":"源#587"},{"id":"D3-588","d":3,"t":"single","q":"哪项 AWS 服务为高度连接的数据集提供完全托管的图数据库？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"Amazon Neptune"},{"l":"D","t":"Amazon Aurora"}],"a":["C"],"e":"**✅ 为什么 C. Amazon Neptune 对**：Neptune 是全托管图数据库，专为高度连接数据集与图查询设计，「图数据库」字眼直接锁定。\n\n**❌ 为什么其他选项错**：\n- A. Amazon DynamoDB：键值 NoSQL\n- B. Amazon RDS：关系数据库\n- D. Amazon Aurora：关系数据库\n\n**📌 关键概念**：图数据库=Neptune（社交网络/欺诈检测/知识图谱）；DynamoDB 键值、RDS/Aurora 关系。「高度连接的数据集」是图场景标志描述。Neptune 全托管含备份与高可用，读写分离最多 15 个只读副本；社交关系/反洗钱/推荐引擎/网络拓扑是四大典型图场景。Neptune 与 Neptune Analytics/OpenSearch 的边界：属性图查询（gremlin/cypher）用 Neptune；文本关键词检索用 OpenSearch；本题主打「高度连接+图数据库」。","s":"源#588"},{"id":"D3-590","d":3,"t":"single","q":"一家公司希望通过实施每次运行 4 小时的基于容器的服务来更新其在线数据处理应用程序。该公司不想配置或管理服务器实例。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"AWS Fargate"},{"l":"C","t":"Amazon EC2"},{"l":"D","t":"AWS Elastic Beanstalk"}],"a":["B"],"e":"**✅ 为什么 B. AWS Fargate 对**：Fargate 无服务器容器运行，无需配置或管理服务器，跑 4 小时的批处理任务按需起停、按用量计费，完全匹配诉求。\n\n**❌ 为什么其他选项错**：\n- A. AWS Lambda：函数计算有 15 分钟超时上限，4 小时任务跑不了\n- C. Amazon EC2：需自己管理服务器实例\n- D. AWS Elastic Beanstalk：应用平台，底层仍是服务器\n\n**📌 关键概念**：长时任务容器=Fargate（无时长限制）；Lambda 15 分钟上限是关键排除点。「每次运行 4 小时」字眼直接排除 Lambda，考点藏在时长里。Fargate 任务可指定 CPU/内存组合（0.25 vCPU~16 vCPU），任务结束即停止计费，跑批与偶发长任务的成本效率显著优于常驻 EC2。","s":"源#590"},{"id":"D3-592","d":3,"t":"single","q":"根据 AWS 共享责任模型，哪项任务是 AWS 的责任？","o":[{"l":"A","t":"对 Amazon EC2 实例应用客操作系统补丁。"},{"l":"B","t":"提供人力资源信息管理（HRIM）系统的监控。"},{"l":"C","t":"对 Amazon RDS 实例执行自动备份。"},{"l":"D","t":"优化运行 AWS 服务的成本。"}],"a":["C"],"e":"**✅ 为什么 C. 对 Amazon RDS 实例执行自动备份 对**：RDS 是托管服务，其底层维护与自动备份由 AWS 负责，属于「云本身的安全」。\n\n**❌ 为什么其他选项错**：\n- A. 对 EC2 实例应用客户 OS 补丁：客户责任\n- B. 提供 HRIM 系统的监控：客户应用层，客户责任\n- D. 优化运行 AWS 服务的成本：客户的成本优化职责\n\n**📌 关键概念**：托管服务的底层运维（备份/补丁/HA）=AWS 责任；客户只管「云中」（OS/应用/数据/配置）。「RDS 自动备份」是 AWS 侧责任的标准样例。共享责任的快捷判断：客户能在控制台点到的（OS/应用/数据/权限）就是客户管；托管服务「看不见摸不着」的底层都是 AWS 管。","s":"源#592"},{"id":"D3-593","d":3,"t":"single","q":"用户需要对附加到 Amazon EC2 实例的 Amazon Elastic Block Store（Amazon EBS）卷进行一次性备份。执行此备份的最有效操作方式是什么？","o":[{"l":"A","t":"将另一个 EBS 卷附加到 EC2 实例，并复制内容。"},{"l":"B","t":"将 EBS 卷复制到在 AWS 外部运行并与 AWS Direct Connect 连接的服务器。"},{"l":"C","t":"创建卷的 EBS 快照。"},{"l":"D","t":"创建自定义脚本将 EBS 文件内容复制到 Amazon S3。"}],"a":["C"],"e":"**✅ 为什么 C. 创建卷的 EBS 快照 对**：EBS 快照是卷的增量备份，一条操作即可创建，存在 S3 跨 AZ 持久保存，可随时恢复，「一次性备份最有效」非它莫属。\n\n**❌ 为什么其他选项错**：\n- A. 附加新 EBS 卷复制内容：需挂载/文件级复制/卸载，繁琐低效\n- B. 复制到 AWS 外部 Direct Connect 服务器：绕远路且不必要\n- D. 自定义脚本复制文件到 S3：文件级操作，非卷级备份\n\n**📌 关键概念**：EBS 备份=快照（snapshot，增量、S3 后端）；「卷级一次性备份」标准答案。恢复时从快照建新卷。文件级备份才轮到脚本方案。","s":"源#593"},{"id":"D3-594","d":3,"t":"single","q":"一位没有 AWS 云经验的开发人员希望使用 AWS 技术构建 Web 应用程序。 开发人员应该使用哪项AWS 服务来开始构建应用程序？","o":[{"l":"A","t":"Amazon SageMaker"},{"l":"B","t":"AWS Lambda"},{"l":"C","t":"Amazon Lightsail"},{"l":"D","t":"Amazon Elastic Container Service（Amazon ECS）"}],"a":["C"],"e":"**✅ 为什么 C. Amazon Lightsail 对**：Lightsail 为新手提供预配置环境与固定套餐，控制台极简，无 AWS 经验的开发者用它起步 Web 应用门槛最低。\n\n**❌ 为什么其他选项错**：\n- A. Amazon SageMaker：机器学习平台\n- B. AWS Lambda：需要理解函数/事件等概念，对纯新手不直观\n- D. Amazon ECS：容器编排，学习曲线陡\n\n**📌 关键概念**：新手入门=Lightsail（打包模板+固定月费+简化控制台）；「没有 AWS 经验+开始构建」是 Lightsail 标志题眼。类似场景还有 D3-329。Lightsail 套餐固定月费含流量与 SSD，一键部署 WordPress/Node 等应用镜像，超出套餐需求时再平滑迁移到 EC2 全功能体系。","s":"源#594"},{"id":"D3-596","d":3,"t":"single","q":"哪项 AWS 服务专为运行包含 NoSQL 数据库的工作负载的用户设计？","o":[{"l":"A","t":"Amazon RDS"},{"l":"B","t":"Amazon S3"},{"l":"C","t":"Amazon Redshift"},{"l":"D","t":"Amazon DynamoDB"}],"a":["D"],"e":"**✅ 为什么 D. Amazon DynamoDB 对**：DynamoDB 是全托管 NoSQL 数据库，「专为 NoSQL 工作负载设计」就是其定位。\n\n**❌ 为什么其他选项错**：\n- A. Amazon RDS：关系型\n- B. Amazon S3：对象存储\n- C. Amazon Redshift：数据仓库\n\n**📌 关键概念**：NoSQL=DynamoDB；关系=RDS/Aurora；数仓=Redshift；对象=S3。「NoSQL 数据库工作负载」送分题眼。DynamoDB 键值/文档双模型，单表设计配合二级索引（GSI/LSI）覆盖多种访问模式；广告点击流、购物车、会话存储是高频场景。DynamoDB 的毫秒级性能来自 SSD 与分布式分区，容量模式有按需（突发友好）与预置（稳态省钱）两档；本题为 NoSQL 定义题，题眼即「NoSQL」三字。","s":"源#596"},{"id":"D3-597","d":3,"t":"single","q":"一家公司在 AWS 上有一个网站。该公司希望将网站交付给全球受众，并为全球用户提供低延迟响应时间。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS CloudFormation"},{"l":"B","t":"Amazon CloudFront"},{"l":"C","t":"Amazon ElastiCache"},{"l":"D","t":"Amazon DynamoDB"}],"a":["B"],"e":"**✅ 为什么 B. Amazon CloudFront 对**：CloudFront 通过全球边缘节点缓存网站内容就近交付，全球用户低延迟，「全球受众+低延迟」双关键词锁定 CDN。\n\n**❌ 为什么其他选项错**：\n- A. AWS CloudFormation：基础设施编排\n- C. Amazon ElastiCache：数据库缓存（服务内部加速）\n- D. Amazon DynamoDB：NoSQL 数据库\n\n**📌 关键概念**：全球分发+低延迟=CloudFront；ElastiCache 是「应用后端缓存」不面向终端用户分发。「全球+低延迟」是 CDN 标志题眼。CloudFront 全球 400+ 节点（PoP），源站可为 S3/ALB/任意 HTTP 服务器，配 Origin Shield 再省回源流量，动态内容也支持边缘函数处理。CDN 三判断词：全球（global）、边缘（edge）、缓存（cache）。ElastiCache 的干扰逻辑是「也是缓存」，但它缓存数据库查询结果面向应用内部，不面向全球终端用户。","s":"源#597"},{"id":"D3-598","d":3,"t":"single","q":"一家公司希望在其网站上添加一个对话式聊天机器人。 该公司可以使用以下哪项AWS 服务来满足这一需求？","o":[{"l":"A","t":"Amazon Textract（Amazon Textract）"},{"l":"B","t":"Amazon Lex（Amazon Lex）"},{"l":"C","t":"AWS Glue"},{"l":"D","t":"Amazon Rekognition（Amazon Rekognition）"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Lex 对**：Lex 是对话式界面构建服务（ASR 语音识别+NLU 意图理解），与 Alexa 同源技术，「网站聊天机器人」正是其教科书场景。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Textract：扫描文档提取文字\n- C. AWS Glue：ETL 数据集成\n- D. Amazon Rekognition：图像视频分析\n\n**📌 关键概念**：聊天机器人/对话界面=Lex（ASR+NLU）；Textract 读文档、Rekognition 看图、Glue 管 ETL。「对话式聊天机器人」秒选 Lex。原 e 为 641 字长叙述，已按三段式整理。Lex 提供意图/槽位/话术的对话模型，配 Lambda 实现业务逻辑，Connect 与 Facebook Messenger 都可作集成渠道；按文本请求次数计费。Lex 与 Polly/Transcribe 的三角关系：Transcribe 语音转文字、Polly 文字转语音、Lex 理解意图对话，机器人=Lex 是铁三角里唯一带「对话状态管理」的。","s":"源#598"},{"id":"D3-599","d":3,"t":"single","q":"哪项 AWS 服务或功能可用于监控在 Amazon EC2 上运行的系统上的潜在磁盘写入峰值？","o":[{"l":"A","t":"AWS CloudTrail"},{"l":"B","t":"AWS Health Dashboard"},{"l":"C","t":"AWS Trusted Advisor"},{"l":"D","t":"Amazon CloudWatch"}],"a":["D"],"e":"**✅ 为什么 D. Amazon CloudWatch 对**：CloudWatch 监控 EC2 的各类指标，磁盘写入活动（DiskWriteOps 等）是标准指标，可设阈值告警捕捉写入峰值，「监控指标+磁盘写入」双关键词锁定。\n\n**❌ 为什么其他选项错**：\n- A. AWS CloudTrail：记录 API 操作（谁做了什么），不采集性能指标\n- B. AWS Health Dashboard：展示 AWS 服务健康状态与账户事件\n- C. AWS Trusted Advisor：最佳实践与成本检查建议\n\n**📌 关键概念**：性能指标监控=CloudWatch（CPU/磁盘/网络计数）；Health Dashboard 管服务可用性公告。「磁盘写入峰值」是指标类需求，四件套中只有 CloudWatch 干这活。可配详细监控（1 分钟粒度）与告警动作。","s":"源#599"},{"id":"D3-600","d":3,"t":"single","q":"一家公司有控制本地工厂设备的应用程序。 该公司应该使用哪项 AWS 服务来运行这些应用程序，以实现最低延迟？","o":[{"l":"A","t":"AWS Outposts"},{"l":"B","t":"Amazon EC2"},{"l":"C","t":"AWS Lambda"},{"l":"D","t":"AWS Fargate"}],"a":["A"],"e":"**✅ 为什么 A. AWS Outposts 对**：Outposts 把 AWS 基础设施（EC2/EBS 等原生物理形态）延伸到本地机房，应用跑在工厂旁即得个位数毫秒延迟，「控制本地设备+最低延迟」正中其定位。\n\n**❌ 为什么其他选项错**：\n- B. Amazon EC2：云端虚拟机，到工厂设备有公网/专线往返延迟\n- C. AWS Lambda：云端函数，同样不在本地\n- D. AWS Fargate：云端容器引擎\n\n**📌 关键概念**：本地低延迟=Outposts（AWS 硬件进机房）或 Local Zones/Wavelength（城市/5G 边缘）；纯云服务管不了毫秒级本地控制回路（工业 PLC 场景）。Snowball Edge 是离线版近亲。Local Zones 把计算存储推到大城市边缘，Wavelength 对接 5G 运营商网络，与 Outposts 并列 AWS 三大混合边缘形态，按「离数据多近」分层选型。","s":"源#600"},{"id":"D3-604","d":3,"t":"single","q":"公司可以使用哪个 VPC 组件在 Amazon EC2 实例级别设置虚拟防火墙？","o":[{"l":"A","t":"网络访问控制列表（Network ACL）"},{"l":"B","t":"安全组"},{"l":"C","t":"路由表"},{"l":"D","t":"NAT 网关"}],"a":["B"],"e":"**✅ 为什么 B. 安全组 对**：安全组是 EC2 实例级虚拟防火墙，按规则控制入站/出站流量，「实例级别+虚拟防火墙」双关键词完全吻合。\n\n**❌ 为什么其他选项错**：\n- A. 网络 ACL：子网级防火墙（无状态）\n- C. 路由表：决定流量去向，不做过滤\n- D. NAT 网关：私有子网出站代理\n\n**📌 关键概念**：实例级=安全组（有状态），子网级=网络 ACL（无状态）。「实例级别」是关键区分词；两者都支持 CIDR 但作用层级不同。D3-614 与本题互为印证。安全组默认拒绝所有入站，规则只写放行条目；改动即时生效但不在规则间保持状态感知，生产环境通常安全组+网络 ACL 双层布防。","s":"源#604"},{"id":"D3-607","d":3,"t":"single","q":"一家公司需要使用 Amazon S3 存储每个大小为 5 兆字节的音频文件。该公司将频繁访问这些文件，并且必须能够立即检索这些文件。哪种 S3 存储类将最具成本效益地满足这些要求？","o":[{"l":"A","t":"S3 标准"},{"l":"B","t":"S3 标准 - 不频繁访问（S3 Standard - IA）"},{"l":"C","t":"S3 Glacier 灵活检索"},{"l":"D","t":"S3 Glacier 深度存档"}],"a":["A"],"e":"**✅ 为什么 A. S3 标准 对**：频繁访问+立即检索的小文件（5MB），标准层无检索费、毫秒级取回，虽然存储单价高但频繁访问场景总成本反而最低。\n\n**❌ 为什么其他选项错**：\n- B. S3 标准-IA：有 128KB 最小计费对象与最低 30 天存储期，小文件频繁访问不划算，且收检索费\n- C. S3 Glacier 灵活检索：取回要分钟到小时级，不满足立即检索\n- D. S3 Glacier 深度存档：取回 12~48 小时，最不适合\n\n**📌 关键概念**：频繁访问=标准层（贵存储免费检索）；不频繁=Standard-IA（省存储贵检索）；归档=Glacier 家族。「频繁+立即」双词锁定标准层，5MB 小文件更要避开 IA 的最小对象计费坑。原 e 为 455 字长叙述，已按三段式整理。","s":"源#607"},{"id":"D3-608","d":3,"t":"single","q":"一家公司希望在 1 周内建立从本地到 AWS 云的安全网络连接。 哪种解决方案将满足这些要求？","o":[{"l":"A","t":"AWS Direct Connect"},{"l":"B","t":"Amazon VPC"},{"l":"C","t":"AWS Site - to - Site VPN"},{"l":"D","t":"边缘位置"}],"a":["C"],"e":"**✅ 为什么 C. AWS Site-to-Site VPN 对**：VPN 基于既有互联网，分钟到小时级开通，加密隧道满足安全连接，「1 周内建立」的时间约束正是 VPN 快速开通的优势场景。\n\n**❌ 为什么其他选项错**：\n- A. AWS Direct Connect：专线开通需数周（物理布线+机房交叉连接）\n- B. Amazon VPC：网络容器本身，不是连接方案\n- D. 边缘位置：CloudFront 概念，非连接服务\n\n**📌 关键概念**：快开通=VPN（走互联网）；稳定低延迟=DX（慢开通贵）；题干有时间约束（几天/一周）就选 VPN。「1 周内」是题眼，直接排除 DX。VPN 两端走公网但全程 IPsec 加密，与 DX 组合可做专线备份链路；小时级可用性诉求先想 VPN，数周预算与预算充足才上 DX。","s":"源#608"},{"id":"D3-614","d":3,"t":"multiple","q":"哪些 AWS 网络服务或功能在提供 IP 地址范围时允许使用 CIDR 块表示法？（选择两项）","o":[{"l":"A","t":"安全组"},{"l":"B","t":"Amazon Machine Image（AMI）"},{"l":"C","t":"网络访问控制列表（网络 ACL）"},{"l":"D","t":"AWS Budgets"},{"l":"E","t":"Amazon Elastic Block Store（Amazon EBS）"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A. 安全组：实例级规则可用 CIDR 表示法指定 IP 范围\n- C. 网络访问控制列表（网络 ACL）：子网级规则同样支持 CIDR 块\n\n**❌ 为什么其他选项错**：\n- B. Amazon Machine Image（AMI）：系统镜像模板，与网络规则无关\n- D. AWS Budgets：预算告警工具\n- E. Amazon EBS：块存储卷\n\n**📌 关键概念**：CIDR（如 10.0.0.0/16）出现在两类网络控制面——安全组（实例级）与网络 ACL（子网级）；AMI/EBS/预算都不涉及 IP 规则编写。记「管 IP 规则的两兄弟都吃 CIDR」。安全组有状态（返回流量自动放行）、网络 ACL 无状态（出入站规则分开写）；两者都能用 CIDR 表达源与目标，是 VPC 网络控制的左右护法。","s":"源#614"},{"id":"D3-615","d":3,"t":"single","q":"一家公司想要开发一个将文本转换为可听语音的可访问性应用程序。 哪项 AWS 服务将满足此要求？","o":[{"l":"A","t":"Amazon MQ"},{"l":"B","t":"Amazon Polly"},{"l":"C","t":"Amazon Neptune"},{"l":"D","t":"Amazon Timestream"}],"a":["B"],"e":"**✅ 为什么 B. Amazon Polly 对**：Polly 是文本转语音（TTS）服务，把文字合成为自然语音，「文本转换为可听语音」的无障碍应用正是其典型场景。\n\n**❌ 为什么其他选项错**：\n- A. Amazon MQ：托管消息代理（ActiveMQ/RabbitMQ）\n- C. Amazon Neptune：图数据库\n- D. Amazon Timestream：时间序列数据库\n\n**📌 关键概念**：无障碍（accessibility）场景=屏幕阅读器语音输出→Polly；支持 SSML 控制语速/停顿，多语言多音色，是「读出来」方向唯一的答案。Transcribe 是反方向（听写）。Polly 的神经语音（neural voice）更接近真人，长文本可拆多任务合成再拼接；与 Amazon Translate 组合还能实现多语言语音播报。","s":"源#615"},{"id":"D3-616","d":3,"t":"single","q":"一家公司需要在其本地数据中心和 AWS 云之间建立专用网络连接，且该网络不能使用公共互联网。哪项 AWS 服务或功能将满足这些要求？","o":[{"l":"A","t":"AWS Transit Gateway"},{"l":"B","t":"AWS VPN"},{"l":"C","t":"Amazon CloudFront"},{"l":"D","t":"AWS Direct Connect"}],"a":["D"],"e":"**✅ 为什么 D. AWS Direct Connect 对**：Direct Connect 建立本地与 AWS 的专用私有连接，完全绕开公共互联网，「专用网络连接+不走公网」双关键词锁定。\n\n**❌ 为什么其他选项错**：\n- A. AWS Transit Gateway：VPC 互联枢纽，不提供本地专用线路\n- B. AWS VPN：走互联网的加密隧道\n- C. Amazon CloudFront：CDN\n\n**📌 关键概念**：「不能使用公共互联网」是最强题眼，VPN 因走公网出局；DX 专线 1/10/100Gbps，BGP 路由，金融等合规场景标配。TGW 是 VPC 侧枢纽，与本地接入是两回事。DX 专线端口费+数据传出费两部分计费，1/10/100 Gbps 带宽可选，需在托管机房完成交叉连接；金融交易、医疗影像等大带宽低抖动场景的刚需。","s":"源#616"},{"id":"D3-621","d":3,"t":"single","q":"使用弹性负载均衡（ELB）负载均衡器与在 AWS 云中运行的应用程序一起使用的好处是什么？","o":[{"l":"A","t":"ELB 将自动扩展资源以满足容量需求。"},{"l":"B","t":"ELB 可以在多个计算资源之间平衡流量。"},{"l":"C","t":"ELB 可以在多个互联网网关之间平衡流量。"},{"l":"D","t":"ELB 可以跨越多个 AWS 区域。"}],"a":["B"],"e":"**✅ 为什么 B. ELB 可以在多个计算资源之间平衡流量。 对**：负载均衡器的本职就是把传入流量分发到多个计算资源（EC2/容器/Lambda），提升可用性与利用率，这是 ELB 的定义级功能。\n\n**❌ 为什么其他选项错**：\n- A. ELB 将自动扩展资源以满足容量需求：那是 Auto Scaling 的职责（ELB 只分发不扩容）\n- C. 在多个互联网网关之间平衡流量：IGW 每个 VPC 只有一个，无从平衡\n- D. ELB 可以跨越多个 AWS 区域：ELB 是区域级服务（跨区域的是 Route 53/GA）\n\n**📌 关键概念**：职责边界=ELB 分发流量、ASG 增减实例；ELB 是区域级。「负载均衡」字面即答案；注意 A 选项偷换了 ASG 的能力。","s":"源#621"},{"id":"D3-622","d":3,"t":"single","q":"一家公司需要将视频文件和音频文件转换为可在智能手机上播放的格式。 哪项AWS 服务将满足此要求？","o":[{"l":"A","t":"Amazon Comprehend"},{"l":"B","t":"Amazon Rekognition"},{"l":"C","t":"Amazon Elastic Transcoder"},{"l":"D","t":"Amazon Polly"}],"a":["C"],"e":"**✅ 为什么 C. Amazon Elastic Transcoder 对**：Elastic Transcoder 是媒体转码服务，把视频/音频从一种格式转成多种设备适配格式（含智能手机播放格式），「转换格式+设备兼容」正是其用途。\n\n**❌ 为什么其他选项错**：\n- A. Amazon Comprehend：文本 NLP\n- B. Amazon Rekognition：图像视频内容分析（不转格式）\n- D. Amazon Polly：文本转语音\n\n**📌 关键概念**：媒体转码=Elastic Transcoder（按转码分钟计费，管道+预设模板）；分析视频内容用 Rekognition、生成语音用 Polly，三个「媒体沾边」服务各管一段。S3 上传事件可自动触发转码流水线。Elastic Transcoder 按分钟计费按需伸缩，任务管道配 S3 事件自动触发；媒体处理新项目也可评估 Elemental MediaConvert，功能更现代。","s":"源#622"},{"id":"D3-623","d":3,"t":"single","q":"一家公司希望安全地存储 Amazon RDS 数据库凭
