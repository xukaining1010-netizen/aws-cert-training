<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>学习材料</title>
<style>
/* ===== KB-074 页面规范：首页目录 + 章级分页 SPA（非单一长页） ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;font-size:17px;line-height:1.7}
.wrap{max-width:1200px;margin:0 auto;padding:24px 28px 60px}
@media(max-width:768px){.wrap{padding:16px 14px 48px}}

/* ===== 首页 ===== */
.hdr{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:12px;padding:30px 32px 26px;margin-bottom:18px}
.hdr-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:3px 12px;border-radius:20px;margin-bottom:10px}
.hdr h1{font-size:24px;font-weight:800;line-height:1.4}
.hdr-sub{font-size:13px;opacity:.9;margin-top:8px}
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.ov-item{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.ov-num{font-size:28px;font-weight:800;color:#4f46e5;line-height:1.2}
.ov-lbl{font-size:12px;color:#64748b;margin-top:4px}
@media(max-width:768px){.ov{grid-template-columns:repeat(2,1fr)}}

.card-s{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.cs-title{font-size:18px;font-weight:700;color:#374151;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}

/* 章节目录卡 */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ch-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 16px;cursor:pointer;transition:.2s;margin-bottom:0}
.ch-card:hover{border-color:#7c3aed;transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,70,229,.12)}
.ch-card.done{border-color:#16a34a}
.cc-num{font-size:11px;font-weight:700;margin-bottom:3px}
.cc-title{font-size:15px;font-weight:700;color:#1e293b;margin-bottom:6px}
.cc-meta{font-size:13px;color:#64748b}
.cc-prog{margin-top:8px}
.pm{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:3px}
.pbar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .4s}

/* 考试速览 */
.exam-quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.eq-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 10px;text-align:center}
.eq-num{font-size:20px;font-weight:800;color:#4f46e5;line-height:1.2}
.eq-sub{font-size:10.5px;color:#64748b;margin-top:2px}
.eq-lbl{font-size:11px;color:#64748b;margin-top:5px}
.exam-two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:10px}
@media(max-width:768px){.exam-two-col{grid-template-columns:1fr}}
.exam-sub-t{font-size:14px;font-weight:700;color:#374151;margin:4px 0 10px}
.exam-domain-tbl{width:100%;border-collapse:collapse;font-size:15px}
.exam-domain-tbl th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;padding:9px 12px;text-align:left;font-weight:700}
.exam-domain-tbl td{padding:9px 12px;border-bottom:1px solid #e9d5ff;vertical-align:middle}
.exam-domain-tbl tr:nth-child(even) td{background:#faf5ff}
.domain-chip{display:inline-block;border-radius:20px;padding:2px 11px;font-size:12px;font-weight:700;background:#ede9fe;color:#5b21b6;cursor:pointer;border:none;transition:.15s}
.domain-chip:hover{background:#ddd6fe}
.exam-info-list{font-size:15px;color:#374151;margin:0 0 12px 18px}
.exam-info-list li{margin-bottom:6px;line-height:1.7}
.exam-steps{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px;font-size:14px}
.step-block{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;padding:9px 12px;font-size:13px;color:#4338ca;flex:1 1 150px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.step-block b{display:block;font-size:13px}
.step-block span{display:block;font-size:11.5px;color:#6d28d9;margin-top:3px}
.step-arrow{color:#a78bfa;font-weight:700;font-size:16px;padding:0 4px;flex:0 0 auto;align-self:center}
details.exam-faq{margin-top:12px;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;background:#f8fafc}
details.exam-faq summary{font-size:14px;font-weight:700;color:#374151;cursor:pointer}
details.exam-faq p{margin:9px 0 0;font-size:14px;color:#475569;line-height:1.75}

/* 14 天计划 */
.ptbl{width:100%;border-collapse:collapse;font-size:15px}
.ptbl th{background:#f8fafc;padding:11px 12px;text-align:left;font-weight:600;color:#374151;border-bottom:2px solid #e2e8f0;font-size:14px}
.ptbl td{padding:10px 12px;border-bottom:1px solid #f8fafc;vertical-align:middle}
.ptbl tr:last-child td{border-bottom:none}
.day{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.chip-p{background:#ede9fe;color:#5b21b6}.chip-p:hover{background:#ddd6fe}
.focus{font-size:12px;color:#64748b}

/* ===== 章面板 ===== */
.ch-topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);padding:8px 18px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px}
.back-btn{background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:13px;font-weight:600;border-radius:8px;padding:5px 14px;cursor:pointer;white-space:nowrap;transition:.15s}
.back-btn:hover{background:#ede9fe}
.tn-title{font-size:15px;font-weight:700;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-hdr{color:#fff;padding:20px 22px 16px;border-radius:12px 12px 0 0;margin-bottom:0}
.ch-badge{font-size:13px;font-weight:700;opacity:.9;margin-bottom:5px;display:block}
.ch-title{font-size:22px;font-weight:800}
.panel{margin-bottom:14px}
.task-list{padding-left:22px;font-size:16px;color:#374151;line-height:2.0}
.task-list li::marker{color:#a78bfa}
.task-list a{color:#374151;text-decoration:none}
.task-list a:hover{color:#4f46e5}
.tl-id{display:inline-block;min-width:38px;font-weight:700;color:#4f46e5;margin-right:6px}
.panel-hr{border:none;border-top:1px solid #e2e8f0;margin:14px 0}

/* ===== 正文排版（规范 B） ===== */
.mdbody .sec-block h2.mh2{font-size:19px;font-weight:700;color:#4f46e5;margin:4px 0 12px;padding:10px 0 8px;border-top:1px solid #e2e8f0}
.mdbody p{font-size:17px;color:#374151;margin-bottom:14px;line-height:1.9}
.mdbody ul,.mdbody ol{font-size:17px;color:#374151;padding-left:24px;margin-bottom:12px}
.mdbody li{margin-bottom:8px;line-height:1.9}
.mdbody blockquote{border-left:3px solid #a78bfa;padding:10px 16px;background:#f5f3ff;font-size:15px;color:#5b21b6;margin:0 0 14px;border-radius:0 6px 6px 0;line-height:1.8}
.mdbody code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.mdbody h4.sec-h{font-size:17px;font-weight:600;color:#374151;margin:24px 0 10px;padding-left:12px;border-left:3px solid #a78bfa;line-height:1.4}
.mdbody .case-card,.mdbody .mem-card{border-radius:10px;padding:13px 16px;margin-bottom:14px}
.mdbody .case-card{background:#fff8e6;border:1px solid #ecd9a0}
.mdbody .mem-card{background:#eef3ff;border:1px solid #b9c9f7}
.mdbody .case-card h4.sec-h,.mdbody .mem-card h4.sec-h{border-left:none;padding-left:0;margin:0 0 8px;font-size:14px;font-weight:700}
.mdbody .case-card h4.sec-h{color:#9a7b1e}
.mdbody .mem-card h4.sec-h{color:#4361ee}
.mdbody .case-card p,.mdbody .mem-card p{font-size:15px}
.mdbody .case-card ul,.mdbody .mem-card ul{margin-bottom:0;font-size:15px}
/* 表格（规范 C） */
.tbl-wrap{overflow-x:auto;margin:0 0 14px;border:1px solid #e9d5ff;border-radius:10px}
.tbl-wrap table{min-width:480px}
table{border-collapse:collapse;width:100%;font-size:16px}
.mdbody th,.mdbody td{padding:11px 16px;text-align:left;border-bottom:1px solid #e9d5ff;vertical-align:top;line-height:1.6}
.mdbody thead th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;font-weight:700;font-size:15px;white-space:nowrap}
.mdbody tbody tr:nth-child(even) td{background:#faf5ff}
.mdbody tbody tr:last-child td{border-bottom:none}
/* 图块（v2.1 图文同流） */
.fig-block{background:#f8f7ff;border:1px solid #ddd6fe;border-radius:12px;padding:14px 16px;margin:0 0 14px}
.fig-title{font-size:13px;font-weight:700;color:#4f46e5;text-align:center;margin-bottom:10px}
.fig-body{overflow-x:auto}
.fig-body svg{display:block;margin:0 auto;height:auto}
.fig-caption{font-size:12px;color:#6b7280;text-align:center;margin-top:10px;font-style:italic}
/* 手绘图 CSS 类（兼容） */
.compare-tbl{width:100%;border-collapse:collapse;font-size:13px}
.compare-tbl th{padding:9px 12px;font-weight:700;font-size:12px;text-align:center}
.compare-tbl td{padding:8px 12px;border:1px solid #e2e8f0;font-size:13px;vertical-align:top;line-height:1.5}
.compare-tbl tr:nth-child(even) td{background:#faf9ff}
.flow-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.flow-node{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;text-align:center;min-width:80px}
.flow-node.light{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#4338ca}
.flow-node.green{background:linear-gradient(135deg,#06d6a0,#059669);color:#fff}
.flow-arrow{color:#a78bfa;font-size:18px;font-weight:700;flex-shrink:0}
.cycle-wrap{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.cycle-step{display:flex;flex-direction:column;align-items:center;gap:4px}
.cycle-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.cycle-label{font-size:11px;color:#374151;text-align:center;max-width:70px;line-height:1.3}
.cycle-arrow{color:#a78bfa;font-size:16px;align-self:flex-start;margin-top:6px}
.stair-wrap{display:flex;align-items:flex-end;gap:8px;padding:8px 0;justify-content:center;flex-wrap:wrap}
.stair-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.stair-bar{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:6px 6px 0 0;width:80px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;padding:4px}
.stair-label{font-size:11px;color:#374151;text-align:center;max-width:80px;line-height:1.3}

/* 域尾提示卡 */
.tips-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tips-card .tc-title{font-size:15px;font-weight:700;margin-bottom:10px;color:#374151}
.tips-card table{font-size:14px}
.tips-card th{padding:9px 12px;font-size:13px}
.tips-card td{padding:9px 12px;font-size:14px;line-height:1.6}

/* ===== 章末练习 quiz-box（模块 10） ===== */
.quiz-box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:18px 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);scroll-margin-top:78px}
.quiz-hdr{display:flex;align-items:baseline;gap:14px;font-size:18px;font-weight:700;color:#374151;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}
.quiz-score{font-size:14px;font-weight:700;color:#4f46e5;margin-left:auto;white-space:nowrap}
.qi{border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.qi.done{background:#fafafa}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qbadge{background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:700}
.qtype{font-size:11px;border-radius:12px;padding:1px 9px;font-weight:600}
.qtype-s{background:#e0f2fe;color:#0369a1}
.qtype-m{background:#fce7f3;color:#be185d}
.qstem{font-size:16px;color:#1e293b;margin-bottom:10px;line-height:1.8}
.qstem code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{background:#fff;border:1.5px solid #e2e8f0;border-radius:9px;padding:11px 14px;font-size:15.5px;color:#374151;cursor:pointer;transition:.15s;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:#a78bfa}
.opt .ol{font-weight:700;color:#4f46e5;flex-shrink:0}
.opt.sel{border-color:#4f46e5;background:#ede9fe}
.opt.cor{border-color:#16a34a;background:#dcfce7}
.opt.wrg{border-color:#dc2626;background:#fee2e2}
.opt.shc{border-color:#16a34a;background:#f0fdf4}
.qi.done .opt{cursor:default;pointer-events:none}
.qrow{margin-top:10px;display:flex;align-items:center;gap:12px}
.qbtn{background:#4f46e5;color:#fff;font-size:12px;font-weight:600;border:none;border-radius:7px;padding:7px 18px;cursor:pointer;transition:.15s}
.qbtn:hover{background:#4338ca}
.qbtn:disabled{background:#cbd5e1;cursor:default}
.qres{display:none;flex:1;border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.7}
.qres.ok{background:#dcfce7;color:#15803d}
.qres.err{background:#fee2e2;color:#b91c1c}
.qres.na{background:#fef3c7;color:#b45309}
.qres.show{display:block}
.score-box{display:none;text-align:center;background:#f5f3ff;border-radius:10px;padding:22px 16px;margin-top:16px}
.score-box.show{display:block}
.score-num{font-size:32px;font-weight:700;color:#4f46e5;line-height:1.3}
.score-lbl{font-size:13px;color:#6d28d9;margin-top:4px}
.score-box .sb-tip{font-size:12px;color:#64748b;margin-top:8px;line-height:1.7}

.footer{margin-top:26px;padding:18px 10px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:12.5px;text-align:center;line-height:1.9}
.footer a{color:#4f46e5;text-decoration:none}
@media(max-width:768px){.ptbl th,.ptbl td{font-size:13px}.mdbody th,.mdbody td{font-size:13px}}

/* ===== 章面板 v6 布局：左侧常驻目录槽 + 正文列（KB-074 模块 13 升级，2026-09-09 CLF v6 落地） =====
   拍板三要（老徐 2026-09-09）：① 正文 #### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点，见下方 .mh3）
   ② 左侧目录两级（节 ▸ 知识点，单开手风琴 + 滚动自动跟读）③ 左右两侧任何分辨率留白，目录常驻不遮正文：
   ≥1200px：.panel 栅格 [236px 目录槽 | 正文列]，目录 sticky 常驻；<1200px：目录槽变左侧抽屉（☰+遮罩）。 */
body.chapView .wrap{max-width:1420px}
.panel{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start;margin-bottom:14px}
.ch-side{position:sticky;top:14px;min-width:0;z-index:30}
.side-close{display:none}
.toc-open-btn{display:none}
.side-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:85;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.side-mask.show{opacity:1;visibility:visible}
.ch-toc{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 6px 24px rgba(15,23,42,.06);overflow:hidden}
.ch-toc .toc-hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;border-bottom:1px solid #f1f5f9}
.ch-toc .th-title{font-size:13px;font-weight:800;color:#4f46e5;white-space:nowrap}
.ch-toc .th-meta{font-size:11px;color:#94a3b8;font-weight:600;white-space:nowrap}
.ch-toc .toc-body{max-height:calc(100vh - 46px);overflow-y:auto;padding:8px}
.toc-list{list-style:none;margin:0;padding:0}
.toc-list a{display:flex;align-items:baseline;gap:6px;padding:5px 6px;border-radius:7px;color:#475569;text-decoration:none;line-height:1.45;font-size:13px;transition:.12s}
.toc-list a:hover{background:#f5f3ff;color:#4f46e5}
.toc-list a.act{background:#ede9fe;color:#3730a3;font-weight:600}
.toc-list .tl-id{font-size:11.5px;font-weight:700;color:#a78bfa;flex-shrink:0;font-variant-numeric:tabular-nums}
.toc-list a.act .tl-id{color:#4f46e5}
.toc-t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toc-sec>a.toc-sec-link{font-weight:600;color:#334155;padding-top:6px;padding-bottom:6px}
.toc-sec>a .toc-ar{margin-left:auto;flex-shrink:0;font-size:9px;color:#94a3b8;transition:transform .18s}
.toc-sec.open>a .toc-ar{transform:rotate(90deg);color:#4f46e5}
.toc-sub{list-style:none;margin:0;padding:0 0 3px;display:none}
.toc-sec.open>.toc-sub{display:block}
.toc-sub a{padding:3px 6px 3px 20px;font-size:12.5px;color:#64748b;line-height:1.4}
.toc-sub a .tl-id{font-size:11px;color:#c4b5fd}
/* 目录尾【本章练习】入口（v6.2 新增）：独立条目，虚线分隔，点击滚到章末练习区 #quiz-dX */
.toc-quiz{margin-top:7px;padding-top:3px;border-top:1px dashed #ddd6fe}
.toc-quiz>a.toc-quiz-link{font-weight:700;color:#6d28d9;padding-top:6px;padding-bottom:6px}
.toc-quiz>a .tl-id{color:#a78bfa}
.toc-quiz>a.act .tl-id{color:#6d28d9}
@media(max-width:1199px){
  .panel{display:block}
  .ch-side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:90;background:#fff;border-right:1px solid #e2e8f0;box-shadow:0 0 44px rgba(15,23,42,.18);transform:translateX(-102%);transition:transform .22s ease;padding:10px;overflow-y:auto}
  .ch-side.open{transform:none}
  .ch-side .ch-toc{border:none;box-shadow:none;border-radius:0}
  .ch-toc .toc-body{max-height:none;padding-right:4px}
  .toc-open-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:12.5px;font-weight:600;border-radius:8px;padding:4px 10px;cursor:pointer;transition:.15s;white-space:nowrap}
  .toc-open-btn:hover{background:#ede9fe}
  .side-close{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:none;background:#f1f5f9;color:#64748b;border-radius:7px;font-size:12px;cursor:pointer;font-weight:700;flex-shrink:0}
  .side-close:hover{background:#e2e8f0;color:#1e293b}
}
/* 阅读进度（吸顶条底部细线 + 百分比）：v6 新增
   注意：此处不再声明 position，78 行的 .ch-topnav{position:sticky;top:0} 保持生效——
   v6 曾误加 position:relative 覆盖导致吸顶丢失（2026-09-09 老徐反馈窄屏换章节要滚回顶，v6.1 修复） */

const QUIZ_META = {"exam":"CLF-C02","title":"AWS Certified Cloud Practitioner 题库","lang":"zh","updated":"2026-09-06","domains":{"1":"云概念","2":"安全与合规","3":"云技术与服务","4":"计费、定价与支持"},"weights":{"1":"24%","2":"30%","3":"34%","4":"12%"},"examParams":{"count":65,"minutes":90,"pass":700},"footerNote":"题库来源：AWS CLF-C02 中文官方题库 719 题整理；Domain 为关键词自动分类，以官方考纲为准","sourceNote":"题库来源：AWS CLF-C02 中文 719.docx（官方题库中文版）","glossary":{"Amazon EC2":"Amazon EC2 - 弹性计算云（Elastic Compute Cloud）。AWS 的核心虚拟机服务，提供可调整大小的安全计算容量。","AWS Lambda":"AWS Lambda - 无服务器计算服务。按事件运行代码，无需预置或管理服务器，按实际调用与计算时长计费。","Amazon ECS":"Amazon ECS - 弹性容器服务（Elastic Container Service）。AWS 的托管容器编排服务。","Amazon EKS":"Amazon EKS - 弹性 Kubernetes 服务（Elastic Kubernetes Service）。AWS 的托管 Kubernetes 服务。","AWS Fargate":"AWS Fargate - 无服务器容器计算引擎。为容器自动管理底层服务器，无需预置 EC2。","Amazon EC2 Auto Scaling":"Amazon EC2 Auto Scaling - 自动伸缩服务。按需求/策略自动增减 EC2 实例数量。","AWS Elastic Beanstalk":"AWS Elastic Beanstalk - PaaS 服务。自动处理应用部署、扩缩容、负载均衡与健康检查。","Amazon S3":"Amazon S3 - 简单存储服务（Simple Storage Service）。对象存储，可存储和检索任意数量数据，支持版本/生命周期/静态网站等。","Amazon S3 Glacier":"Amazon S3 Glacier - 归档存储。低成本长期归档，检索需数分钟到数小时。","Amazon EBS":"Amazon EBS - 弹性块存储（Elastic Block Store）。为 EC2 提供块级存储卷，可快照备份。","Amazon EFS":"Amazon EFS - 弹性文件系统（Elastic File System）。供 EC2 等多实例共享的托管文件系统（NFS）。","AWS Storage Gateway":"AWS Storage Gateway - 混合云存储网关。将本地存储接入 AWS 云存储。","Amazon FSx":"Amazon FSx - 托管文件系统族。含 FSx for Windows File Server、FSx for Lustre 等。","Amazon RDS":"Amazon RDS - 关系型数据库服务（Relational Database Service）。托管关系数据库（MySQL/PostgreSQL/SQL Server 等）。","Amazon Aurora":"Amazon Aurora - 托管关系数据库引擎。兼容 MySQL/PostgreSQL，性能与可用性更高。","Amazon DynamoDB":"Amazon DynamoDB - 托管 NoSQL 键值/文档数据库。毫秒级性能、自动扩展、完全托管。","Amazon Redshift":"Amazon Redshift - 云数据仓库服务。用于大规模分析查询（PB 级）。","Amazon ElastiCache":"Amazon ElastiCache - 托管缓存服务。兼容 Redis/Memcached，加速读取。","Amazon Neptune":"Amazon Neptune - 托管图数据库服务。","Amazon VPC":"Amazon VPC - 虚拟私有云（Virtual Private Cloud）。在 AWS 云中隔离的私有网络，可定义子网/路由/安全组。","Amazon CloudFront":"Amazon CloudFront - CDN 内容分发网络。全球边缘节点加速静态与动态内容分发。","Amazon Route 53":"Amazon Route 53 - DNS 域名解析服务。可路由流量至 AWS 内外资源，含健康检查与故障转移。","AWS Direct Connect":"AWS Direct Connect - 专线。通过专用网络连接本地数据中心与 AWS，替代公网。","AWS Global Accelerator":"AWS Global Accelerator - 全球加速。利用 AWS 骨干网改善应用访问性能与可用性。","Amazon API Gateway":"Amazon API Gateway - 托管 API 网关。创建/发布/维护 REST 与 WebSocket API。","AWS Site-to-Site VPN":"AWS Site-to-Site VPN - 站点到站点 VPN。通过加密隧道连接本地网络与 Amazon VPC。","弹性负载均衡":"Elastic Load Balancing (ELB) - 负载均衡。自动将流量分发到多个目标（EC2/容器/IP）并检查健康状态。","ELB":"Elastic Load Balancing (ELB) - 负载均衡。自动将流量分发到多个目标（EC2/容器/IP）并检查健康状态。","AWS IAM":"AWS IAM - 身份和访问管理（Identity and Access Management）。管理用户/组/角色与权限策略，控制 AWS 资源访问。","IAM 角色":"AWS IAM Role - IAM 角色。授予实体临时访问权限的身份，常用于 EC2/Lambda 等获取资源访问权。","AWS KMS":"AWS KMS - 密钥管理服务（Key Management Service）。创建和管理加密密钥（CMK），用于数据加密。","AWS WAF":"AWS WAF - Web 应用防火墙。过滤和监控 HTTP(S) 流量，防 SQL 注入/跨站脚本等。","AWS Shield":"AWS Shield - DDoS 防护服务。Standard 免费常驻防护，Advanced 提供增强防护与支持。","Amazon GuardDuty":"Amazon GuardDuty - 威胁检测服务。用 ML 持续监控账户/工作负载/数据中的恶意活动。","AWS CloudTrail":"AWS CloudTrail - 审计日志服务。记录账户内 API 调用与操作事件，供审计与追踪。","AWS Config":"AWS Config - 配置审计与合规服务。持续评估资源配置是否符合规则。","Amazon Inspector":"Amazon Inspector - 漏洞扫描。自动评估工作负载暴露面与安全漏洞。","AWS Organizations":"AWS Organizations - 组织管理。集中管理多个 AWS 账户、整合账单、应用 SCP 策略。","AWS Artifact":"AWS Artifact - 合规报告自助门户。获取 SOC/ISO/PCI 等合规报告与协议。","AWS Trusted Advisor（可信顾问）":"AWS Trusted Advisor（可信顾问）- 最佳实践检查。从成本优化/性能/安全/容错/服务限额五类给出建议。","AWS Secrets Manager":"AWS Secrets Manager - 密钥托管服务。管理数据库凭证/API 密钥等机密并自动轮换。","多因素认证":"Multi-Factor Authentication (MFA) - 多因素认证。除密码外要求第二因素（如验证码/硬件密钥）验证身份。","MFA":"Multi-Factor Authentication (MFA) - 多因素认证。除密码外要求第二因素（如验证码/硬件密钥）验证身份。","Amazon CloudWatch":"Amazon CloudWatch - 监控与可观测服务。收集指标/日志/告警，监控 AWS 资源与应用。","Amazon CloudWatch 警报":"Amazon CloudWatch Alarms - CloudWatch 告警。指标超过阈值时触发通知或自动动作。","AWS CloudFormation":"AWS CloudFormation - 基础设施即代码（IaC）。用模板以声明式方式创建和管理资源栈。","AWS Systems Manager":"AWS Systems Manager - 运维管理服务。集中管理 EC2 与本地服务器（补丁/会话/参数等）。","AWS 管理控制台":"AWS Management Console - AWS 管理控制台。基于 Web 的界面，用于创建与管理 AWS 资源。","AWS Cost Explorer":"AWS Cost Explorer - 成本探索。可视化分析历史与预测成本与用量。","AWS Budgets":"AWS Budgets - 预算服务。设置预算并在超支时发送告警。","AWS Pricing Calculator":"AWS Pricing Calculator - 定价计算器。预估 AWS 工作负载的成本。","AWS 账单与成本管理":"AWS Billing and Cost Management - 账单与成本管理。查看账单/成本分配标签/整合账单等。","AWS Marketplace":"AWS Marketplace - 数字软件目录。购买/订阅第三方软件与数据产品（自带许可或订阅计费）。","Amazon SageMaker":"Amazon SageMaker - ML 全生命周期平台。数据准备、训练、调优、部署一体化。","Amazon Athena":"Amazon Athena - 无服务器查询服务。直接用 SQL 查询 S3 中的数据。","Amazon QuickSight":"Amazon QuickSight - 商业智能（BI）可视化服务。","Amazon Polly":"Amazon Polly - 文本转语音（TTS）服务。","Amazon Transcribe":"Amazon Transcribe - 语音转文字（ASR）服务。","Amazon Translate":"Amazon Translate - 机器翻译服务。","Amazon Rekognition":"Amazon Rekognition - 图像/视频分析服务（人脸/物体/内容审核等）。","Amazon Comprehend":"Amazon Comprehend - NLP 文本分析服务（情感/实体/关键短语等）。","Amazon Textract":"Amazon Textract - 文档 OCR 服务。从扫描件/PDF 提取文本、表格、表单。","Amazon Lex":"Amazon Lex - 对话式 AI（聊天机器人）服务，支持语音与文本。","共享责任模型":"Shared Responsibility Model - 共享责任模型。AWS 负责云的安全（基础设施），客户负责云中的安全（数据/配置/访问）。","良好构建框架":"AWS Well-Architected Framework - 良好构建框架。六大支柱：卓越运营/安全性/可靠性/性能效率/成本优化/可持续性。","云采用框架":"AWS Cloud Adoption Framework (CAF) - 云采用框架。指导组织上云转型的六方面能力框架。","AWS CAF":"AWS Cloud Adoption Framework (CAF) - 云采用框架。","按需计费":"On-Demand - 按需计费。按实际用量付费，无预付与长期承诺，灵活但单价较高。","按需实例":"On-Demand Instance - 按需实例。按秒/小时计费、随开随停的 EC2 实例，无长期承诺。","预留实例":"Reserved Instance (RI) - 预留实例。承诺 1-3 年使用换取折扣（标准/可转换），适合稳定负载。","Savings Plans":"Savings Plans - 节省计划。承诺每小时固定用量（1/3 年）换取更低单价，覆盖 EC2/Lambda/Fargate。","竞价实例":"Spot Instance - 竞价实例。用闲置容量、价格折扣大，但可能被回收，适合可中断/容错工作负载。","可用区":"Availability Zone (AZ) - 可用区。区域内独立的可用设施，用于高可用部署。","AWS 区域":"AWS Region - 区域。AWS 全球的物理地域，每个区域含多个可用区。"}};
const QUIZ_QUESTIONS = [{"id":"D1-006","d":1,"t":"single","q":"以下哪种观点包括 AWS 云采用框架（AWS CAF）的基础能力？","o":[{"l":"A","t":"可持续性"},{"l":"B","t":"性能效率"},{"l":"C","t":"治理"},{"l":"D","t":"可靠性"}],"a":["C"],"e":"治理是 AWS 云采用框架内的基础能力。它涉及建立和执行政策和控制措施，有效管理和优化云资源。","s":"源#6"},{"id":"D1-015","d":1,"t":"single","q":"一家全球性公司想要将其第三方应用程序迁移到 AWS 云。公司希望得到一个全球专家团队的帮助，以更快、更可靠地完成迁移，并符合 AWS 内部最佳实践。哪个 AWS 服务或资源将满足这些要求？","o":[{"l":"A","t":"AWS 支持"},{"l":"B","t":"AWS 专业服务"},{"l":"C","t":"AWS 发射向导"},{"l":"D","t":"AWS 托管服务（AMS）"}],"a":["B"],"e":"AWS 专业服务提供了一个全球专家团队，可以提供实践帮助，规划、执行和优化 AWS 迁移，确保迁移过程更快、更可靠，并符合AWS 最佳实践。","s":"源#15"},{"id":"D1-022","d":1,"t":"single","q":"哪个选项是 AWS 全球基础设施的物理位置？","o":[{"l":"A","t":"AWS 数据同步"},{"l":"B","t":"AWS 区域"},{"l":"C","t":"Amazon Connect"},{"l":"D","t":"AWS 组织"}],"a":["B"],"e":"AWS 区域是 AWS 在世界范围内拥有多个数据中心的物理位置。它代表了一个地理区域，拥有多个可用区，以提供容错和稳定性。","s":"源#22"},{"id":"D1-025","d":1,"t":"single","q":"一家公司正在运行一个单一的本地应用程序，该应用程序无法扩展且难以维护。该公司计划将应用程序迁移到 AWS 并将其拆分为微服务。该公司遵循 AWS 良好架构框架的哪个最佳实践？","o":[{"l":"A","t":"将功能测试作为 AWS 部署的一部分。"},{"l":"B","t":"使用自动化部署更改。"},{"l":"C","t":"将应用程序部署到多个位置。"},{"l":"D","t":"实现松散耦合的依赖关系。"}],"a":["D"],"e":"实现松散耦合的依赖关系是 AWS 良好架构框架的最佳实践，与公司将迁移到 AWS 并采用微服务架构的计划相一致。这种做法促进了服务的解耦，允许更大的灵活性、可扩展性和易于维护。","s":"源#25"},{"id":"D1-030","d":1,"t":"multiple","q":"以下哪项是 AWS 良好架构框架的支柱？（选择两项。）","o":[{"l":"A","t":"可用性"},{"l":"B","t":"可靠性"},{"l":"C","t":"可扩展性"},{"l":"D","t":"响应式设计"},{"l":"E","t":"运营卓越"}],"a":["B","E"],"e":"AWS 良好架构框架围绕六个支柱构建：运营卓越、安全、可靠性、性能效率、成本优化和可持续性。在提供的选项中，可靠性和运营卓越是框架的两个支柱。","s":"源#30"},{"id":"D1-034","d":1,"t":"multiple","q":"在 AWS 云计算中，敏捷性的概念包括以下哪两项？","o":[{"l":"A","t":"实施 AWS 资源的速度"},{"l":"B","t":"AWS 创建新的 AWS 区域的速度"},{"l":"C","t":"快速实验的能力"},{"l":"D","t":"消除浪费的容量"},{"l":"E","t":"进入云计算的低成本"}],"a":["A","C"],"e":"AWS 云计算中的敏捷性指的是快速实施 AWS 资源的能力，允许快速配置和部署。它还包括快速实验的能力，使用户能够在云环境中创新、测试想法并快速迭代。","s":"源#34"},{"id":"D1-038","d":1,"t":"single","q":"一家电子商务公司已将其 IT 基础设施从本地数据中心迁移到 AWS 云。哪项成本是公司的直接责任？","o":[{"l":"A","t":"应用程序软件许可证的成本"},{"l":"B","t":"AWS 上的硬件基础设施成本"},{"l":"C","t":"AWS 服务器的电力成本"},{"l":"D","t":"AWS 数据中心的物理安全成本"}],"a":["A"],"e":"在 AWS 云中，客户负责运行应用程序所需的应用程序软件许可证的成本。AWS 管理底层基础设施成本，包括硬件、电力和物理安全。","s":"源#38"},{"id":"D1-045","d":1,"t":"single","q":"哪个 AWS 云采用框架 (AWS CAF) 能力属于人员视角？","o":[{"l":"A","t":"数据架构"},{"l":"B","t":"事件管理"},{"l":"C","t":"云流利度"},{"l":"D","t":"战略合作伙伴关系"}],"a":["C"],"e":"云流利度是 AWS 云采用框架内属于人员视角的能力。它侧重于确保组织内的个人具备有效使用云技术和服务所需的知识和技能。","s":"源#45"},{"id":"D1-050","d":1,"t":"single","q":"以下哪项是基于云计算优势的规模经济的好处？","o":[{"l":"A","t":"将可变成本转换为固定成本"},{"l":"B","t":"提高速度和敏捷性"},{"l":"C","t":"降低可变成本超过固定成本"},{"l":"D","t":"数据中心运营成本的增加"}],"a":["C"],"e":"云计算的规模经济指的是随着运营规模的增加而带来的成本优势。随着使用量的增加，由于大规模运营获得的效率，资源单位成本趋于降低，导致可变成本低于固定成本。","s":"源#50"},{"id":"D1-070","d":1,"t":"single","q":"一位网络工程师需要构建一个混合云架构，使用 AWS 直接连接将本地网络连接到AWS 云。该公司在单一 AWS 区域有几个 VPC，并预计随着时间的推移，VPC 的数量将增加到数百个。哪种AWS 服务或功能应该由工程师使用，以简化并扩展这种连接性，因为 VPC 数量增加？","o":[{"l":"A","t":"VPC 端点"},{"l":"B","t":"AWS 传输网关"},{"l":"C","t":"Amazon Route 53"},{"l":"D","t":"AWS 秘密管理器"}],"a":["B"],"e":"AWS 传输网关是一个服务，使用户能够通过中心枢纽连接多个 Amazon 虚拟私有云 (VPC) 和本地网络。它简化了VPC 之间的连接性和路由，使得随着 VPC 数量的增加更容易扩展。有了 AWS 传输网关，网络工程师可以集中管理连接性，使其成为需要将多个VPC连接到本地网络的场景的合适解决方案。","s":"源#70"},{"id":"D1-071","d":1,"t":"single","q":"一家公司希望评估其运营准备情况。同时，公司希望在新产品发布之前识别和缓解任何运营风险。哪个AWS 支持计划在不收取额外费用的情况下为此类事件提供指导和支持？","o":[{"l":"A","t":"AWS 商业支持"},{"l":"B","t":"AWS 基础支持"},{"l":"C","t":"AWS 开发者支持"},{"l":"D","t":"AWS 企业支持"}],"a":["D"],"e":"AWS 企业支持。AWS 企业支持是最高级的支持计划，提供广泛的福利，包括主动指导和支持，帮助客户优化他们的AWS 环境，提高运营性能，并降低风险。这包括访问 AWS 可信顾问，这是一个提供成本优化、性能、安全性和容错性最佳实践建议的工具。此外，AWS 企业支持提供全天候访问云支持工程师，协助解决运营问题、架构指导和新产品发布等事件的主动支持。","s":"源#71"},{"id":"D1-073","d":1,"t":"single","q":"哪个 AWS 服务或功能可用于创建在本地工作负载和 AWS 云工作负载之间的私有连接？","o":[{"l":"A","t":"Amazon Route 53"},{"l":"B","t":"Amazon Macie"},{"l":"C","t":"AWS 直接连接"},{"l":"D","t":"AWS PrivateLink"}],"a":["C"],"e":"AWS 直接连接在您的本地数据中心或办公室与 AWS 之间建立了专用的私有网络连接。这个连接绕过了公共互联网，提供了更低延迟、更一致和可预测的网络性能。它允许您安全和私密地访问 AWS 资源，适合连接本地工作负载到 AWS 服务和资源。","s":"源#73"},{"id":"D1-076","d":1,"t":"multiple","q":"以下哪些是 AWS 云的优势？（选择两项。）","o":[{"l":"A","t":"将可变成本转换为资本支出"},{"l":"B","t":"高规模经济"},{"l":"C","t":"几分钟内全球启动"},{"l":"D","t":"专注于管理硬件基础设施"},{"l":"E","t":"过度配置以确保容量"}],"a":["B","C"],"e":"AWS 云的优势包括高规模经济 (B) 和几分钟内全球启动 (C)。这些优势允许企业利用 AWS 的大规模基础设施实现成本节省，并在短时间内在全球部署应用程序和资源，从而提高灵活性和对业务需求变化的响应能力。","s":"源#76"},{"id":"D1-077","d":1,"t":"single","q":"AWS 云的优势之一是架构能够在最小化停机时间的情况下承受故障吗？","o":[{"l":"A","t":"敏捷性"},{"l":"B","t":"弹性"},{"l":"C","t":"可扩展性"},{"l":"D","t":"高可用性"}],"a":["D"],"e":"高可用性确保即使在发生故障的情况下，系统仍然可以运行并且可访问，最小化对用户的影响并保持服务的正常运行时间。这是云计算的一个关键优势，特别是在 AWS 中，架构旨在具有对故障的弹性。","s":"源#77"},{"id":"D1-078","d":1,"t":"single","q":"一个开发人员需要以可重复的方式维护开发环境基础设施和生产环境基础设施。开发人员应该使用哪个AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS 地面站"},{"l":"B","t":"AWS 盾牌"},{"l":"C","t":"AWS IoT 设备防御器"},{"l":"D","t":"AWS CloudFormation"}],"a":["D"],"e":"它是一项服务，允许您以安全、可预测且可重复的方式定义和配置 AWS 基础设施为代码。它使开发人员能够通过描述基础设施的模板来创建和管理 AWS 资源集合，这有助于一致地维护开发和生产环境。","s":"源#78"},{"id":"D1-080","d":1,"t":"single","q":"哪个 AWS 服务帮助提供具有快速故障转移功能的高可用应用程序，适用于多区域和多可用区架构？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"AWS 全球加速器"},{"l":"C","t":"AWS 盾牌"},{"l":"D","t":"AWS 直接连接"}],"a":["B"],"e":"该服务使用静态 IP 地址通过 AWS 全球网络将流量路由到基于健康、地理位置和路由策略的最佳 AWS 端点。它提供高度可用和性能良好的应用程序，具有多区域和多可用区 (AZ) 架构的快速故障转移功能。","s":"源#80"},{"id":"D1-093","d":1,"t":"single","q":"以下哪项是 AWS 良好架构框架的推荐设计原则？","o":[{"l":"A","t":"通过不频繁且大规模地进行基础设施更改来减少停机时间。"},{"l":"B","t":"投入时间手动配置基础设施。"},{"l":"C","t":"从操作故障中学习并改进。"},{"l":"D","t":"为集中化使用单体应用设计。"}],"a":["C"],"e":"AWS 良好架构框架的推荐设计原则是 \"从操作故障中学习并改进\"（选项 C）。这一原则强调了基于操作经验和从故障中学习以提高系统弹性的重要性。","s":"源#93"},{"id":"D1-100","d":1,"t":"single","q":"一家公司希望使用基础设施即代码 (IaC) 自动化基础设施部署。公司希望扩展生产堆栈，以便在多个AWS 区域部署。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon CloudWatch"},{"l":"B","t":"AWS 配置"},{"l":"C","t":"AWS 可信顾问"},{"l":"D","t":"AWS CloudFormation"}],"a":["D"],"e":"AWS CloudFormation 是一个服务，它允许使用模板创建和管理 AWS 基础设施，这些模板可以进行版本控制并被视为代码，从而实现基础设施部署的自动化。","s":"源#100"},{"id":"D1-114","d":1,"t":"single","q":"一家公司正在计划迁移到 AWS 云。公司正在使用 AWS 云采用框架 (CAF) 视角识别其能力差距。哪个云转型阶段包括这些识别活动？","o":[{"l":"A","t":"构想"},{"l":"B","t":"对齐"},{"l":"C","t":"扩展"},{"l":"D","t":"发布"}],"a":["B"],"e":"在云转型过程中，包括使用 AWS 云采用框架 (CAF) 视角识别能力差距的阶段是对齐阶段（选项 B）。在这个阶段，公司识别能力差距和跨组织依赖关系。","s":"源#114"},{"id":"D1-127","d":1,"t":"single","q":"在 AWS 云采用框架（AWS CAF）中，哪个角度包括配置管理和补丁管理的能力？","o":[{"l":"A","t":"平台"},{"l":"B","t":"运营"},{"l":"C","t":"安全"},{"l":"D","t":"治理"}],"a":["B"],"e":"运营角度（选项 B）在 AWS CAF 中包括配置管理和补丁管理的能力，专注于云基础设施的操作方面。","s":"源#127"},{"id":"D1-134","d":1,"t":"single","q":"哪个选项是 AWS 云采用框架（AWS CAF）商业角度能力？","o":[{"l":"A","t":"文化演变"},{"l":"B","t":"事件管理"},{"l":"C","t":"数据货币化"},{"l":"D","t":"平台架构"}],"a":["C"],"e":"（源解析仅为官方参考链接：https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/business-perspective.html）","s":"源#134"},{"id":"D1-137","d":1,"t":"multiple","q":"哪些选项是 AWS 云采用框架（AWS CAF）安全角度能力？（选择两个。）","o":[{"l":"A","t":"可观测性"},{"l":"B","t":"事件和问题管理"},{"l":"C","t":"事件响应"},{"l":"D","t":"基础设施保护"},{"l":"E","t":"可用性和连续性"}],"a":["C","D"],"e":"事件响应（选项 C）和基础设施保护（选项 D）是 AWS 云采用框架安全角度的能力。事件响应涉及准备和响应安全事件，而基础设施保护是关于保护底层系统和服务的安全。","s":"源#137"},{"id":"D1-142","d":1,"t":"single","q":"一家公司计划迁移到 AWS 云。公司希望使用 AWS 云采用框架（AWS CAF）作为其云转型之旅的一部分，定义和跟踪业务成果。哪个 AWS CAF 治理角度能力将满足这些要求？","o":[{"l":"A","t":"收益管理"},{"l":"B","t":"风险管理"},{"l":"C","t":"应用程序组合管理"},{"l":"D","t":"云财务管理"}],"a":["A"],"e":"收益管理（选项 A）在 AWS 云采用框架的治理角度中，专注于定义和跟踪预期从云采用中获得的业务成果和收益。它有助于确保云投资提供预期的价值。","s":"源#142"},{"id":"D1-145","d":1,"t":"single","q":"AWS 云采用框架（AWS CAF）的哪个云转型阶段专注于展示云如何加速业务成果？","o":[{"l":"A","t":"扩展"},{"l":"B","t":"构想"},{"l":"C","t":"对齐"},{"l":"D","t":"发布"}],"a":["B"],"e":"构想阶段（选项 B）的 AWS 云采用框架是关于识别和优先考虑与战略目标一致的转型机会。它专注于通过将倡议与可衡量的业务成果联系起来，展示云采用的价值。","s":"源#145"},{"id":"D1-147","d":1,"t":"single","q":"一家公司希望其 Amazon EC2 实例在高度可用的环境中运行，即使在特定地理区域发生自然灾害。哪种方法将实现这一目标？","o":[{"l":"A","t":"在多个 AWS 区域中使用 EC2 实例。"},{"l":"B","t":"在多个 Amazon CloudFront 位置使用 EC2 实例。"},{"l":"C","t":"在多个边缘位置使用 EC2 实例。"},{"l":"D","t":"在 AWS 本地区域中使用 EC2 实例。"}],"a":["A"],"e":"在多个 AWS 区域中使用 EC2 实例（选项 A）提供地理冗余，并有助于确保应用程序的高可用性，即使在特定区域发生自然灾害。","s":"源#147"},{"id":"D1-148","d":1,"t":"single","q":"一家公司想要现代化并将其单体应用程序转换为微服务。公司希望将应用程序迁移到AWS。公司应该使用哪种迁移策略？","o":[{"l":"A","t":"重新托管"},{"l":"B","t":"重新平台化"},{"l":"C","t":"重新购买"},{"l":"D","t":"重构"}],"a":["D"],"e":"重构（选项 D）是将单体应用程序转换为微服务的适当迁移策略。这种策略涉及修改应用程序，以更好地支持云环境，并利用微服务架构。","s":"源#148"},{"id":"D1-152","d":1,"t":"single","q":"一家公司有一个具有强大硬件要求的应用程序。该应用程序必须由使用轻量级、低成本笔记本电脑的学生访问。哪种 AWS 服务将帮助公司在不投资后端基础设施或高端客户端硬件的情况下部署应用程序？","o":[{"l":"A","t":"Amazon AppStream 2.0"},{"l":"B","t":"AWS AppSync"},{"l":"C","t":"Amazon WorkLink"},{"l":"D","t":"AWS Elastic Beanstalk"}],"a":["A"],"e":"Amazon AppStream 2.0（选项 A）是基于云的应用程序流服务，允许在 AWS 基础设施上运行应用程序并将其流式传输到各种设备，包括低成本笔记本电脑，无需强大的本地硬件。","s":"源#152"},{"id":"D1-154","d":1,"t":"single","q":"以下哪项是 AWS 云架构的推荐设计原则？","o":[{"l":"A","t":"设计紧密耦合的组件。"},{"l":"B","t":"构建一个可以处理所有应用程序功能的单一应用程序组件。"},{"l":"C","t":"在较少的迭代中进行大的更改，以减少失败的机会。"},{"l":"D","t":"通过分割工作负载避免单体架构。"}],"a":["D"],"e":"通过分割工作负载避免单体架构（选项 D）是 AWS 云架构的推荐设计原则。这种方法促进了云资源的可扩展性、弹性和更轻松的管理。","s":"源#154"},{"id":"D1-164","d":1,"t":"single","q":"AWS Well-Architected Framework 的哪个支柱指的是系统从基础设施或服务中断中恢复并动态获取计算资源以满足需求的能力？","o":[{"l":"A","t":"安全"},{"l":"B","t":"可靠性"},{"l":"C","t":"性能效率"},{"l":"D","t":"成本优化"}],"a":["B"],"e":"可靠性（选项 B）是 AWS Well-Architected Framework 的一个支柱，专注于系统从中断中恢复并动态获取计算资源以维护性能和可用性的能力。","s":"源#164"},{"id":"D1-167","d":1,"t":"single","q":"以下哪项是描述用户根据需求扩展基础设施能力的 AWS 价值主张？","o":[{"l":"A","t":"创新速度"},{"l":"B","t":"资源弹性"},{"l":"C","t":"解耦架构"},{"l":"D","t":"全球部署"}],"a":["B"],"e":"资源弹性（选项 B）是 AWS 的价值主张，指根据需求扩展或缩减基础设施的能力，提供根据需要调整资源的灵活性。","s":"源#167"},{"id":"D1-169","d":1,"t":"single","q":"一家公司想要了解更多关于云计算的好处。公司想要了解敏捷性的运营优势。AWS 如何为用户提供敏捷性？","o":[{"l":"A","t":"通过将工作负载部署到多个区域，确保高可用性"},{"l":"B","t":"许多服务和资源的按需付费模式"},{"l":"C","t":"将基础设施管理转移到 AWS 云"},{"l":"D","t":"快速提供和取消资源，几乎不需要努力"}],"a":["D"],"e":"AWS 通过使用户能够根据需要快速提供和取消资源（选项 D）来提供敏捷性。这允许快速扩展和有效管理基础设施，以应对不断变化的业务需求。","s":"源#169"},{"id":"D1-176","d":1,"t":"single","q":"一家公司计划迁移到 AWS 云。公司正在收集有关其本地基础设施的信息，需要诸如主机名、IP 地址和 MAC 地址等信息。哪种 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS DataSync"},{"l":"B","t":"AWS 应用程序迁移服务"},{"l":"C","t":"AWS 应用程序发现服务"},{"l":"D","t":"AWS 数据库迁移服务（AWS DMS）"}],"a":["C"],"e":"AWS 应用程序发现服务（选项 C）帮助企业规划其向 AWS 云的迁移，通过收集有关其本地数据中心的信息，包括主机名、IP 地址和MAC 地址等详细信息。","s":"源#176"},{"id":"D1-185","d":1,"t":"multiple","q":"哪些设计原则支持 AWS Well-Architected Framework 的可靠性支柱？（选择两个。）","o":[{"l":"A","t":"执行操作作为代码。"},{"l":"B","t":"启用可追溯性。"},{"l":"C","t":"根据需求自动扩展。"},{"l":"D","t":"部署资源到全球以提高响应时间。"},{"l":"E","t":"从故障中自动恢复。"}],"a":["C","E"],"e":"根据需求自动扩展（选项 C）和从故障中自动恢复（选项 E）是支持 AWS Well-Architected Framework 的可靠性支柱的设计原则。这些原则有助于确保应用程序能够处理负载变化，并从意外问题中恢复。","s":"源#185"},{"id":"D1-186","d":1,"t":"single","q":"一家公司需要传输 2TB 的数据。哪种类型的数据传输将使公司不承担任何成本？","o":[{"l":"A","t":"从互联网的入站数据传输"},{"l":"B","t":"到互联网的出站数据传输"},{"l":"C","t":"跨 AWS 区域的数据传输"},{"l":"D","t":"跨可用区的数据传输"}],"a":["A"],"e":"从互联网到 AWS 的入站数据传输（选项 A）通常是免费的，这使得它成为将大量数据传输到 AWS 的成本效益选择。","s":"源#186"},{"id":"D1-193","d":1,"t":"single","q":"一位用户对 AWS 服务了解有限，但想要在 AWS 云中快速部署一个可扩展的 Node.js 应用程序。应该使用哪种服务来部署应用程序？","o":[{"l":"A","t":"AWS CloudFormation"},{"l":"B","t":"AWS Elastic Beanstalk"},{"l":"C","t":"Amazon EC2"},{"l":"D","t":"AWS OpsWorks"}],"a":["B"],"e":"AWS Elastic Beanstalk（选项 B）是一项服务，旨在让用户在不需要深入了解 AWS 服务的情况下，快速部署和管理 AWS 云中的应用程序。它支持 Node.js 和其他流行的编程语言。","s":"源#193"},{"id":"D1-195","d":1,"t":"single","q":"一家公司需要在 AWS 上使用第三方软件进行其工作负载。公司可以使用哪种 AWS 服务或功能来购买该软件？","o":[{"l":"A","t":"AWS Resource Access Manager"},{"l":"B","t":"AWS Managed Services"},{"l":"C","t":"AWS License Manager"},{"l":"D","t":"AWS Marketplace"}],"a":["D"],"e":"AWS Marketplace（选项 D）是一个服务，公司可以在其中发现、购买和管理第三方软件和服务，以在 AWS 上运行。","s":"源#195"},{"id":"D1-210","d":1,"t":"multiple","q":"哪些能力是 AWS 云的好处？（选择两个。）","o":[{"l":"A","t":"将可变成本转换为资本支出。"},{"l":"B","t":"在几分钟内全球部署。"},{"l":"C","t":"在部署前计划容量。"},{"l":"D","t":"利用规模经济。"},{"l":"E","t":"减少对网络连接的依赖。"}],"a":["B","D"],"e":"在几分钟内全球部署（选项 B）和利用规模经济（选项 D）是 AWS 云的好处。AWS 允许在全球范围内快速部署资源，并从AWS 的大规模基础设施购买力和优化运营中获益。","s":"源#210"},{"id":"D1-238","d":1,"t":"single","q":"一家公司想要迁移到 AWS，并使用它在本地使用的相同安全软件。安全软件供应商在AWS 上提供其安全软件作为服务。公司在哪里可以购买安全解决方案？","o":[{"l":"A","t":"AWS 合作伙伴解决方案查找器"},{"l":"B","t":"AWS 支持中心"},{"l":"C","t":"AWS 管理控制台"},{"l":"D","t":"AWS 市场"}],"a":["D"],"e":"AWS 市场是平台，公司可以购买和订阅第三方软件和服务，包括在 AWS 上提供为服务的安全解决方案。","s":"源#238"},{"id":"D1-252","d":1,"t":"single","q":"一家公司已将其工作负载迁移到 AWS。公司想要大规模采用 AWS，以更有效、更安全的方式运营。公司应该使用哪个 AWS 服务或框架来获得运营支持？","o":[{"l":"A","t":"AWS 支持"},{"l":"B","t":"AWS 云采用框架（AWS CAF）"},{"l":"C","t":"AWS 托管服务（AMS）"},{"l":"D","t":"AWS 良好构建框架"}],"a":["C"],"e":"基于该问题以及公司的需求，最合适的答案是：C. AWS 托管服务（AWS Managed Services，简称 AMS）AWS 托管服务最适合此场景，原因如下：1. 它助力企业大规模采用 AWS，这与该公司大规模采用 AWS 的目标相符。2. AMS 旨在帮助组织在 AWS 云中更高效、安全地运营，直接契合了公司所述的需求。3. 它提供全面的运营支持，包括主动监控、事件管理、安全管理以及成本优化。4. AMS 提供针对公司环境和应用程序定制的专业自动化工具和专业知识。5. 通过使用 AMS，公司可以专注于创新和业务成果，而由 AWS 来处理无差异化的繁重运营工作。虽然其他选项也是有价值的 AWS 资源，但它们无法提供与 AWS 托管服务同等程度的实际操作运营支持： - AWS 支持服务提供技术协助，但并不直接管理运营。 - AWS 云采用框架（AWS Cloud Adoption Framework，简称 CAF）是一个指导框架，并非运营服务。- AWS 架构良好框架（AWS Well - Architected Framework）提供系统架构的最佳实践，但不提供直接的运营支持。如需获取关于 AWS 托管服务及其如何提供运营支持的最新信息，建议查阅 AWS 官方文档或联系 AWS 代表。","s":"源#252"},{"id":"D1-257","d":1,"t":"single","q":"一家公司想要监控其工作负载性能。公司希望确保云服务以满足其业务需求的水平交付。哪个AWS云采用框架（AWS CAF）视角将满足这些要求？","o":[{"l":"A","t":"商业"},{"l":"B","t":"治理"},{"l":"C","t":"平台"},{"l":"D","t":"运营"}],"a":["D"],"e":"（本题缺解析，源文件无解析文字）","s":"源#257"},{"id":"D1-258","d":1,"t":"single","q":"一家公司想要将其应用程序迁移到 AWS 云。公司计划识别和优先考虑任何业务转型机会，并评估其AWS 云准备情况。公司应该使用哪个 AWS 服务或工具来满足这些要求？","o":[{"l":"A","t":"AWS 云采用框架（AWS CAF）"},{"l":"B","t":"AWS 托管服务（AMS）"},{"l":"C","t":"AWS 良好构建框架"},{"l":"D","t":"AWS 迁移中心"}],"a":["A"],"e":"AWS 云采用框架（AWS CAF）提供指导和最佳实践，帮助组织规划和执行其云采用之旅，包括识别转型机会和评估云准备情况。","s":"源#258"},{"id":"D1-259","d":1,"t":"single","q":"一家公司需要 AWS 服务，为其提供公司在本地数据中心运行的清晰基线。公司需要在AWS 云中运行其本地工作负载的预计成本。哪家 AWS 服务或工具将满足这些要求？","o":[{"l":"A","t":"AWS 计算优化器"},{"l":"B","t":"AWS 成本探索器"},{"l":"C","t":"AWS 系统管理代理（SSM 代理）"},{"l":"D","t":"迁移评估员"}],"a":["D"],"e":"迁移评估员是一项 AWS 服务，通过提供公司在本地运行的清晰基线，并基于测量的配置和使用情况投影 AWS 成本，帮助组织为云规划和迁移创建方向性商业案例。","s":"源#259"},{"id":"D1-261","d":1,"t":"single","q":"一家公司希望设置其工作负载以执行其预期功能，并在发生故障时快速恢复。哪个AWS 良好构建框架支柱与这些目标一致？","o":[{"l":"A","t":"性能效率"},{"l":"B","t":"可持续性"},{"l":"C","t":"可靠性"},{"l":"D","t":"安全"}],"a":["C"],"e":"AWS 良好构建框架的可靠性支柱侧重于设计能够执行其预期功能并从故障中快速恢复的系统，确保工作负载能够承受中断并保持可用性。","s":"源#261"},{"id":"D1-268","d":1,"t":"multiple","q":"以下哪些是 AWS 良好构建框架的支柱？（选择两个）","o":[{"l":"A","t":"资源可扩展性"},{"l":"B","t":"性能效率"},{"l":"C","t":"系统弹性"},{"l":"D","t":"敏捷开发"},{"l":"E","t":"卓越运营"}],"a":["B","E"],"e":"AWS 良好构建框架由六个支柱组成，其中两个是性能效率（B）和运营卓越（E）。这些支柱提供了一个框架，用于设计安全、高性能、弹性和高效的基础设施。","s":"源#268"},{"id":"D1-285","d":1,"t":"single","q":"一家公司想要在 AWS 云中有效地运行其工作负载，减少管理开销，并改善流程。哪个AWS 良好构建框架支柱代表了这些要求？","o":[{"l":"A","t":"可靠性"},{"l":"B","t":"运营卓越"},{"l":"C","t":"性能效率"},{"l":"D","t":"成本优化"}],"a":["B"],"e":"AWS 良好构建框架的运营卓越支柱侧重于运行和监控系统，以提供业务价值，同时不断改进流程和程序。","s":"源#285"},{"id":"D1-292","d":1,"t":"multiple","q":"AWS 云采用框架（AWS CAF）平台视角包括哪些能力？（选择两个）","o":[{"l":"A","t":"性能和容量管理"},{"l":"B","t":"数据工程"},{"l":"C","t":"持续集成和持续交付（CI/CD）"},{"l":"D","t":"基础设施保护"},{"l":"E","t":"变更和发布管理"}],"a":["B","C"],"e":"AWS 云采用框架的平台视角包括数据工程（B）和持续集成和持续交付（CI/CD）（C）等能力，侧重于高效的数据管理和流线型软件开发流程。","s":"源#292"},{"id":"D1-295","d":1,"t":"multiple","q":"AWS 云采用框架（AWS CAF）安全视角的哪些能力？（选择两个）","o":[{"l":"A","t":"可观察性"},{"l":"B","t":"事件和问题管理"},{"l":"C","t":"事件响应"},{"l":"D","t":"基础设施保护"},{"l":"E","t":"可用性和连续性"}],"a":["C","D"],"e":"AWS 云采用框架的安全视角包括事件响应（C）和基础设施保护（D）等能力，重点关注响应安全事件的流程和实施保护云基础设施的安全措施。","s":"源#295"},{"id":"D1-303","d":1,"t":"single","q":"一家公司的应用开发人员需要快速地使用脚本配置和管理 AWS 服务。开发人员应该使用哪个AWS产品来满足这些要求？","o":[{"l":"A","t":"AWS CLI"},{"l":"B","t":"AWS CodeBuild"},{"l":"C","t":"AWS 云采用框架（AWS CAF）"},{"l":"D","t":"AWS 系统管理会话管理器"}],"a":["A"],"e":"AWS CLI 是一个命令行工具，允许开发人员与 AWS 服务交互并通过脚本自动化任务，非常适合快速配置和管理 AWS 服务。","s":"源#303"},{"id":"D1-307","d":1,"t":"single","q":"哪种 AWS 云部署模型使用 AWS Outposts 作为应用程序部署基础设施的一部分？","o":[{"l":"A","t":"本地"},{"l":"B","t":"无服务器"},{"l":"C","t":"云原生"},{"l":"D","t":"混合"}],"a":["D"],"e":"AWS Outposts 是一项服务，将 AWS 基础设施、服务、API 和工具扩展到几乎任何客户位置，创建一个混合部署模型，将本地与云资源融合。","s":"源#307"},{"id":"D1-315","d":1,"t":"single","q":"一家公司想要通过吸引和发展精通数字的高绩效团队来转变其劳动力。公司想要吸引一个多样化和包容性的劳动力，具有适当的技术和非技术技能混合。哪个 AWS 云采用框架（AWS CAF）视角将满足这些要求？","o":[{"l":"A","t":"商业"},{"l":"B","t":"人员"},{"l":"C","t":"平台"},{"l":"D","t":"运营"}],"a":["B"],"e":"AWS 云采用框架的人员视角侧重于劳动力转型，强调组织文化、技能发展的重要性，并创建一个具有技术和非技术技能平衡混合的多样化和包容性劳动力。","s":"源#315"},{"id":"D1-335","d":1,"t":"multiple","q":"哪些选项是 AWS 云采用框架（AWS CAF）云转型之旅的建议？（选择两个）","o":[{"l":"A","t":"构想阶段"},{"l":"B","t":"对齐阶段"},{"l":"C","t":"评估阶段"},{"l":"D","t":"动员阶段"},{"l":"E","t":"迁移和现代化阶段"}],"a":["A","B"],"e":"AWS 云采用框架（AWS CAF）概述了一个云转型之旅的几个阶段。构想阶段（选项 A）涉及根据战略目标识别和优先考虑转型机会。对齐阶段（选项 B）是关于识别能力差距和跨组织依赖关系。AWS CAF 的正确建议是构想和对齐阶段。","s":"源#335"},{"id":"D1-337","d":1,"t":"single","q":"一家公司正在设计其 AWS 工作负载，以便组件可以定期更新，并且可以以小的、可逆的增量进行更改。哪种 AWS 良好构建框架支柱支持这种设计？","o":[{"l":"A","t":"安全"},{"l":"B","t":"性能效率"},{"l":"C","t":"运营卓越"},{"l":"D","t":"可靠性"}],"a":["C"],"e":"定期更新组件和以小的、可逆的增量进行更改的设计原则与 AWS 良好构建框架的运营卓越支柱一致。这个支柱侧重于设计和操作工作负载以提供业务价值，同时强调持续改进、响应事件和自动化。","s":"源#337"},{"id":"D1-341","d":1,"t":"single","q":"一家公司想要在 AWS 云中部署应用程序。公司想要满足这个要求的哪种架构部署模型？","o":[{"l":"A","t":"多区域"},{"l":"B","t":"单区域"},{"l":"C","t":"多 AZ"},{"l":"D","t":"单 AZ"}],"a":["A"],"e":"根据公司使用 AWS 云全球部署应用程序的要求，推荐的架构部署模型是：A. 多区域这是全球部署最合适的选项，因为：1. 全球覆盖：多区域部署允许公司通过将资源放置在更接近最终用户的位置，为不同地理位置的用户服务，降低延迟。2. 高可用性：在多个AWS 区域部署提供了更好的抵御区域性故障或中断的能力。3. 合规性和数据驻留：一些国家有数据驻留要求，需要在特定的地理边界内存储数据。多区域部署可以帮助满足这些要求。4. 灾难恢复：多区域架构可以实现更强大的灾难恢复策略，即使整个区域出现问题，也允许应用程序继续运行。5. 性能优化：通过在多个区域部署资源，公司可以将用户路由到最近的地理位置，减少延迟，提高用户体验。虽然多区域部署提供了这些好处，但也要注意它也引入了数据同步、一致性和管理方面的额外复杂性。公司应仔细评估他们的具体需求，并考虑以下因素：- 他们的应用程序的性质及其全球用户基础- 法规和合规需求- 性能要求- 灾难恢复目标- 多区域部署的成本影响建议公司与 AWS 解决方案架构师或合作伙伴协商，设计一个符合他们特定需求的最优多区域架构，并遵循 AWS 全球部署的最佳实践。","s":"源#341"},{"id":"D1-347","d":1,"t":"single","q":"哪种架构概念描述了按需部署资源并在不再需要时释放资源的能力？","o":[{"l":"A","t":"高可用性"},{"l":"B","t":"解耦架构"},{"l":"C","t":"Resilience 弹性"},{"l":"D","t":"Elasticity 弹性故障恢复"}],"a":["D"],"e":"此题应该选择 D，弹性，参考文档：https://wa.aws.amazon.com/wat.concept.elasticity.en.html\n- Resilience：\n- 通常指的是在面对压力、挑战或逆境时，个体、系统或组织能够恢复或适应的能力。它强调的是从困难中恢复并继续前进的能力。\n- 在心理学中，resilience 指的是个人在面对生活压力和逆境时的心理韧性。\n- 在工程学或物理学中，resilience 可能指的是材料在受到冲击或压力后恢复原状的能力。\n- 在组织或社区层面，resilience 可以指它们在面对危机或灾难时保持功能和结构的能力。 -\n- Elasticity：\n- 这个词在物理学中通常用来描述材料在受到拉伸或压缩后能够恢复到其原始形状或尺寸的能力。它是材料的物理属性之一。\n- 在经济学中，elasticity 指的是需求或供给对价格变化的敏感度。例如，价格弹性描述了商品价格变化时需求量的变化程度。\n- 在更广泛的意义上，elasticity 可以指任何系统或过程对变化的响应能力，但这种响应通常与物理形态或尺寸的变化有关。","s":"源#347"},{"id":"D1-351","d":1,"t":"single","q":"一家公司计划迁移到 AWS 云。公司想要识别可衡量的业务成果，以解释公司决定迁移到AWS 的价值。哪个云转型阶段包括这些活动？","o":[{"l":"A","t":"构想"},{"l":"B","t":"对齐"},{"l":"C","t":"扩展"},{"l":"D","t":"启动"}],"a":["A"],"e":"云转型之旅的构想阶段涉及识别和优先考虑与战略目标一致的转型机会。正是在这个阶段，将可衡量的业务成果与转型计划相关联，以展示云迁移的价值。","s":"源#351"},{"id":"D1-353","d":1,"t":"single","q":"哪家 AWS 服务公司可以用来从代码创建基础设施？","o":[{"l":"A","t":"Amazon Elastic Kubernetes Service（Amazon EKS）"},{"l":"B","t":"AWS Outposts"},{"l":"C","t":"AWS CodePipeline"},{"l":"D","t":"AWS CloudFormation"}],"a":["D"],"e":"AWS CloudFormation 是允许公司从代码创建基础设施的服务。它启用了 AWS 和第三方资源的建模、配置和管理，作为代码。","s":"源#353"},{"id":"D1-355","d":1,"t":"single","q":"一家公司需要将其在本地数据中心的 75PB 数据移动到 AWS。哪家 AWS 服务应该以最具成本效益的方式满足这些要求？","o":[{"l":"A","t":"AWS Snowball Edge Storage Optimized"},{"l":"B","t":"AWS Snowmobile"},{"l":"C","t":"AWS Direct Connect"},{"l":"D","t":"AWS Storage Gateway"}],"a":["B"],"e":"AWS Snowmobile 旨在以具有成本效益的方式移动非常大的数据量到 AWS，例如 75PB。它提供了一种以 EB 为规模的数据传输服务，非常适合大规模数据迁移。","s":"源#355"},{"id":"D1-356","d":1,"t":"multiple","q":"以下哪些是 AWS 良好构建框架的支柱？（选择两个）","o":[{"l":"A","t":"资源可扩展性"},{"l":"B","t":"性能效率"},{"l":"C","t":"系统弹性"},{"l":"D","t":"敏捷开发"},{"l":"E","t":"卓越运营"}],"a":["B","E"],"e":"AWS 良好构建框架由六个支柱组成，其中两个是性能效率（B）和运营卓越（E）。这些支柱提供了一个框架，用于设计安全、高性能、弹性和高效的基础设施。","s":"源#356"},{"id":"D1-360","d":1,"t":"single","q":"一家公司想要在 AWS 云中部署一些资源。为了满足监管要求，数据必须保持本地并在本地。AWS和公司资源之间必须保持低延迟。哪家 AWS 服务或功能可以用来满足这些要求？","o":[{"l":"A","t":"AWS 本地区域"},{"l":"B","t":"可用区域"},{"l":"C","t":"AWS Outposts"},{"l":"D","t":"AWS Wavelength 区域"}],"a":["C"],"e":"AWS Outposts 是一项完全托管的服务，将 AWS 基础设施、服务和 API 带到几乎所有本地或边缘位置。它允许公司出于监管合规性而保持数据本地化，同时与 AWS 资源保持低延迟。","s":"源#360"},{"id":"D1-371","d":1,"t":"single","q":"哪种架构设计原则描述了在 AWS 云中隔离依赖组件之间故障的需求？","o":[{"l":"A","t":"使用单体设计。"},{"l":"B","t":"为自动化而设计。"},{"l":"C","t":"为单点故障而设计。"},{"l":"D","t":"松散耦合组件。"}],"a":["D"],"e":"松散耦合组件的架构设计原则旨在 AWS 云中隔离依赖组件之间的故障。这种方法通过最小化单点故障的影响，增加了系统的弹性和敏捷性。","s":"源#371"},{"id":"D1-372","d":1,"t":"single","q":"哪种云计算的好处使公司能够通过 AWS 区域、可用区域和边缘位置的网络，将应用程序部署到全球用户？","o":[{"l":"A","t":"规模经济"},{"l":"B","t":"全球覆盖"},{"l":"C","t":"敏捷性"},{"l":"D","t":"高可用性"}],"a":["B"],"e":"云计算的好处，允许公司通过 AWS 的区域、可用区域和边缘位置的广泛网络，将应用程序部署到全球用户，被称为“全球覆盖”。AWS的这种广泛的网络使企业能够更接近全球最终用户分发其应用程序和内容，减少延迟，增强用户体验。","s":"源#372"},{"id":"D1-375","d":1,"t":"single","q":"哪个 AWS 服务将帮助公司通过收集本地数据中心的配置、使用和行为数据来计划迁移到AWS？","o":[{"l":"A","t":"AWS 资源组"},{"l":"B","t":"AWS 应用程序发现服务"},{"l":"C","t":"AWS 服务目录"},{"l":"D","t":"AWS 系统管理器"}],"a":["B"],"e":"AWS 应用程序发现服务是一项服务，通过收集本地服务器和数据库的全面使用和配置数据，帮助公司规划迁移到 AWS。这些数据有助于就迁移过程做出明智的决策。","s":"源#375"},{"id":"D1-379","d":1,"t":"single","q":"哪个 AWS 云采用框架（AWS CAF）能力属于商业视角？","o":[{"l":"A","t":"程序和项目管理"},{"l":"B","t":"数据科学"},{"l":"C","t":"可观察性"},{"l":"D","t":"变更和发布管理"}],"a":["B"],"e":"数据科学是 AWS 云采用框架内属于商业视角的能力。它侧重于利用数据推动业务洞察和决策。","s":"源#379"},{"id":"D1-381","d":1,"t":"single","q":"哪个视角在 AWS 云采用框架（AWS CAF）中包括良好设计的数据和分析架构的能力？","o":[{"l":"A","t":"安全"},{"l":"B","t":"治理"},{"l":"C","t":"运营"},{"l":"D","t":"平台"}],"a":["D"],"e":"平台视角在 AWS 云采用框架中包括了良好设计的数据和分析架构的能力。它侧重于构建一个支持数据管理和分析的强大平台。","s":"源#381"},{"id":"D1-382","d":1,"t":"multiple","q":"哪些选项是 AWS 云采用框架（AWS CAF）人员视角能力？（选择两个）","o":[{"l":"A","t":"组织对齐"},{"l":"B","t":"组合管理"},{"l":"C","t":"组织设计"},{"l":"D","t":"风险管理"},{"l":"E","t":"现代应用开发"}],"a":["A","C"],"e":"组织对齐（A）和组织设计（C）是属于 AWS 云采用框架的人员视角的能力。这些侧重于使组织的组织结构和设计能够支持云采用并推动文化变革。","s":"源#382"},{"id":"D1-383","d":1,"t":"single","q":"一家公司需要在技术和业务之间架起一座桥梁，以帮助发展到持续增长和学习的文化。哪个AWS云采用框架（AWS CAF）视角作为这个桥梁？","o":[{"l":"A","t":"人员"},{"l":"B","t":"治理"},{"l":"C","t":"运营"},{"l":"D","t":"安全"}],"a":["A"],"e":"人员视角在 AWS 云采用框架中作为技术和业务之间的桥梁。它侧重于通过将人员战略与技术和业务目标对齐，促进持续增长和学习的文化。","s":"源#383"},{"id":"D1-386","d":1,"t":"single","q":"AWS 良好构建框架的哪个支柱侧重于结构化和简化计算资源的分配？","o":[{"l":"A","t":"可靠性"},{"l":"B","t":"运营卓越"},{"l":"C","t":"性能效率"},{"l":"D","t":"可持续性"}],"a":["C"],"e":"性能效率支柱的 AWS 良好构建框架侧重于结构化和简化计算资源的分配。它强调优化性能和效率，以满足所需的系统性能，同时具有成本效益。","s":"源#386"},{"id":"D1-387","d":1,"t":"multiple","q":"哪些 AWS 云采用框架（AWS CAF）能力属于治理视角？（选择两个）","o":[{"l":"A","t":"程序和项目管理"},{"l":"B","t":"产品管理"},{"l":"C","t":"组合管理"},{"l":"D","t":"风险管理"},{"l":"E","t":"事件管理"}],"a":["A","D"],"e":"AWS 云采用框架的治理视角包括程序和项目管理（A）和风险管理（D）等能力。这些能力有助于建立政策、控制和合规性，确保云环境安全并按照定义的指导方针运行。","s":"源#387"},{"id":"D1-388","d":1,"t":"single","q":"一家公司想要使用 AWS 托管服务（AMS）进行运营支持，并了解 AMS 的范围。哪个AMS 功能将满足这些要求？","o":[{"l":"A","t":"登录区域和网络管理"},{"l":"B","t":"客户应用开发"},{"l":"C","t":"DevSecOps 管道配置"},{"l":"D","t":"应用程序日志监控"}],"a":["A"],"e":"AWS 托管服务（AMS）提供 AWS 基础设施和服务的运营支持，包括登录区域和网络管理（A）。这个功能有助于为工作负载设置安全和良好构建的基础，管理网络连接，并确保符合最佳实践。","s":"源#388"},{"id":"D1-404","d":1,"t":"single","q":"一家公司想要设计其云架构，以便支持发展创新，并持续改进流程和程序。这是AWS 良好构建框架的哪个支柱的示例？","o":[{"l":"A","t":"安全"},{"l":"B","t":"性能效率"},{"l":"C","t":"运营卓越"},{"l":"D","t":"可靠性"}],"a":["C"],"e":"运营卓越是 AWS 良好构建框架的五个支柱之一。它侧重于开发和运营高度有效的系统，可以以可预测的方式持续改进和引入新功能和流程。这个支柱是关于使系统更好、更快、更可靠地工作。","s":"源#404"},{"id":"D1-410","d":1,"t":"single","q":"AWS 云为用户提供了以下哪个优势？","o":[{"l":"A","t":"用户消除了对基础设施容量需求的猜测。"},{"l":"B","t":"用户通过维护 IT 硬件的独有所有权，降低了变动成本。"},{"l":"C","t":"用户维护对基础 IT 基础设施硬件的控制。"},{"l":"D","t":"用户维护对托管服务的操作系统的控制。"}],"a":["A"],"e":"使用 AWS 云的一个优势是，它消除了用户对基础设施容量需求的猜测。AWS 提供可扩展的云服务，允许用户根据需要增加或减少资源，这意味着用户可以专注于开发和增长，而不必担心容量规划。","s":"源#410"},{"id":"D1-420","d":1,"t":"single","q":"AWS 云如何帮助公司在流程和云基础设施中构建敏捷性？","o":[{"l":"A","t":"公司可以在不知道需要多少容量的情况下避免分配过多的容量。"},{"l":"B","t":"公司可以扩展到新的地理区域。"},{"l":"C","t":"公司可以访问一系列技术，以快速进行实验和创新。"},{"l":"D","t":"公司只有在使用 IT 资源时才需要支付费用。"}],"a":["C"],"e":"AWS 云的敏捷性是通过为公司提供访问广泛的技术和服务来实现的。这使他们能够快速尝试和实施新解决方案，迭代他们的流程，并在没有大量前期投资基础设施的负担下推动创新。","s":"源#420"},{"id":"D1-421","d":1,"t":"single","q":"哪个 AWS 服务或工具使公司能够以自动化的方式发布应用程序更改？","o":[{"l":"A","t":"Amazon AppFlow"},{"l":"B","t":"AWS CodeDeploy"},{"l":"C","t":"AWS PrivateLink"},{"l":"D","t":"Amazon EKS 发行版"}],"a":["B"],"e":"AWS CodeDeploy 是一个服务，可以自动化部署应用程序更改。它简化了更新应用程序的过程，并确保部署以一致、可靠和可重复的方式完成。","s":"源#421"},{"id":"D1-424","d":1,"t":"single","q":"AWS 良好构建框架的哪个支柱与能够对 AWS 云架构进行频繁、小规模和可逆更改的能力一致？","o":[{"l":"A","t":"安全"},{"l":"B","t":"成本优化"},{"l":"C","t":"运营卓越"},{"l":"D","t":"性能效率"}],"a":["C"],"e":"运营卓越是 AWS 良好构建框架的支柱，强调以可预测、高效和有效的方式运营系统。它包括对架构进行频繁、小规模和可逆更改的实践，这有助于减少大规模中断的风险，并促进持续改进。","s":"源#424"},{"id":"D1-427","d":1,"t":"single","q":"AWS 设计原则中，哪个强调减少应用程序组件之间的相互依赖？","o":[{"l":"A","t":"可扩展性"},{"l":"B","t":"松散耦合"},{"l":"C","t":"自动化"},{"l":"D","t":"缓存"}],"a":["B"],"e":"松散耦合是一个 AWS 设计原则，侧重于最小化应用程序不同组件之间的依赖关系。这种方法允许更大的灵活性、更容易的维护和改进的故障隔离，因为对一个组件的更改不太可能影响其他组件。","s":"源#427"},{"id":"D1-439","d":1,"t":"multiple","q":"哪些选项是 AWS 云采用框架（AWS CAF）的视角？（选择两个）","o":[{"l":"A","t":"云流利度"},{"l":"B","t":"安全"},{"l":"C","t":"更改加速"},{"l":"D","t":"架构"},{"l":"E","t":"商业"}],"a":["B","E"],"e":"基于 AWS 云采用框架（AWS CAF），AWS CAF 视角的正确选项是：B. 安全 E. 商业 AWS CAF 将其指导内容分为六个视角：1. 商业；2. 人员 3. 治理 4. 平台 5. 安全 6. 运维。这些视角中的每一个都关注云采用和数字化转型的不同方面。安全视角对于确保组织在采用云技术时满足其安全目标至关重要。商业视角侧重于将云投资与业务目标和成果对齐。需要注意的是，尽管“云流利度”、“变革加速”和“架构”是云采用中的相关概念，但它们并未被列为六个核心 AWS CAF 视角之一。关于 AWS 云采用框架的最新和详细信息，我建议参考官方AWS 文档。","s":"源#439"},{"id":"D1-441","d":1,"t":"single","q":"一家公司希望其 Amazon EC2 实例位于不同的地点，但在同一地理区域内共享。公司还希望EC2 实例使用多个电网和独立的网络连接。哪种解决方案满足这些要求？","o":[{"l":"A","t":"在同一 AWS Region 的多个边缘位置使用 EC2 实例。"},{"l":"B","t":"在同一 AWS Region 的多个可用区使用 EC2 实例。"},{"l":"C","t":"在同一 AWS Region 的多个 Amazon Connect 位置使用 EC2 实例。"},{"l":"D","t":"在同一 AWS Region 的多个 AWS Artifact 位置使用 EC2 实例。"}],"a":["B"],"e":"通过在同一个 AWS Region 的多个可用区使用 EC2 实例，公司可以确保其实例位于不同的物理位置，拥有独立的电力和网络网格，从而提供冗余和增加容错能力。","s":"源#441"},{"id":"D1-455","d":1,"t":"single","q":"一家公司正在将工作负载从本地数据中心迁移到本地数据中心和 AWS 云之间的分布式架构中。这种迁移类型是什么？","o":[{"l":"A","t":"本地到云原生"},{"l":"B","t":"混合到云原生"},{"l":"C","t":"本地到混合"},{"l":"D","t":"云原生到混合"}],"a":["C"],"e":"这种迁移类型被称为\"本地到混合\"，因为它涉及将本地数据中心扩展到 AWS，创建一个混合环境，工作负载可以在任一位置运行。","s":"源#455"},{"id":"D1-459","d":1,"t":"single","q":"一家公司希望使用 AWS。公司对低延迟访问本地系统和数据居住地有严格的要求。公司应该使用哪个 AWS 服务来设计满足这些要求的解决方案？","o":[{"l":"A","t":"AWS Wavelength"},{"l":"B","t":"AWS 传输网关"},{"l":"C","t":"AWS 地面站"},{"l":"D","t":"AWS Outposts"}],"a":["D"],"e":"AWS Outposts 是一个完全托管的服务，将 AWS 基础设施、服务、API 和工具扩展到几乎所有数据中心、共置空间或本地设施。它非常适合需要低延迟访问本地系统并满足数据居住要求的应用程序。","s":"源#459"},{"id":"D1-461","d":1,"t":"single","q":"一家公司需要在需要时获取资源的能力。公司还需要在不再需要资源时释放资源的能力。哪个AWS概念代表公司的目标？","o":[{"l":"A","t":"可扩展性"},{"l":"B","t":"可持续性"},{"l":"C","t":"弹性"},{"l":"D","t":"卓越的运营"}],"a":["C"],"e":"弹性是云计算的概念，指的是根据需求扩展或缩小资源的能力。它允许公司在需要时获取资源，并在不再需要时释放它们，优化成本和资源使用。","s":"源#461"},{"id":"D1-472","d":1,"t":"single","q":"公司希望其 Amazon EC2 实例即使在特定地理区域发生自然灾害时也能在高度可用的环境中运行。哪种解决方案实现了这个目标？","o":[{"l":"A","t":"在多个 AWS 区域使用 EC2 实例。"},{"l":"B","t":"在多个边缘位置使用 EC2 实例。"},{"l":"C","t":"在不同的 AWS 区域中使用同一可用区的 EC2 实例。"},{"l":"D","t":"将 EC2 实例配置为源，使用 Amazon CloudFront。"}],"a":["A"],"e":"为了即使在自然灾害面前实现高可用性，建议在多个 AWS 区域部署 EC2 实例。这确保即使整个地理区域受到灾害影响，应用程序仍然可用。","s":"源#472"},{"id":"D1-480","d":1,"t":"single","q":"一家公司在本地数据中心运行遗留工作负载。公司希望将工作负载迁移到 AWS。公司不想对工作负载进行任何更改。公司应该使用哪种迁移策略？","o":[{"l":"A","t":"重新购买"},{"l":"B","t":"重新平台化"},{"l":"C","t":"重新托管"},{"l":"D","t":"重构"}],"a":["C"],"e":"迁移策略\"重新托管\"涉及将现有工作负载迁移到 AWS，而不需要对应用程序或基础设施进行任何更改。这也被称为\"提升和转移\"迁移，适用于不希望或不切实际进行更改的遗留工作负载。","s":"源#480"},{"id":"D1-481","d":1,"t":"multiple","q":"一家公司计划将应用程序迁移到 AWS 云。在系统审计期间，公司发现其内容管理系统（CMS）应用程序与云环境不兼容。哪种迁移策略将帮助公司以最少的努力迁移 CMS 应用程序？（选择两个）","o":[{"l":"A","t":"退休"},{"l":"B","t":"重新托管"},{"l":"C","t":"重新购买"},{"l":"D","t":"重新平台化"},{"l":"E","t":"重构"}],"a":["C","D"],"e":"在这种情况下，\"重新平台化\"和\"重新购买\"迁移策略将需要最少的努力。重新平台化涉及将应用程序移动到不同的平台，如AWS，进行最小的更改。重新购买涉及用云原生或云兼容的服务或产品替换现有应用程序。","s":"源#481"},{"id":"D1-486","d":1,"t":"single","q":"一家公司希望其 AWS 使用更加可持续。公司希望跟踪、测量、审查和预测由其AWS 应用程序产生的污染排放。公司可以使用哪个 AWS 服务或工具来满足这些要求？","o":[{"l":"A","t":"AWS 健康仪表板"},{"l":"B","t":"AWS 客户碳足迹工具"},{"l":"C","t":"AWS 支持中心"},{"l":"D","t":"Amazon QuickSight"}],"a":["B"],"e":"AWS 客户碳足迹工具可帮助客户估计和减少与其使用 AWS 服务相关的碳足迹。它提供能源使用和相应指标的详细分析，使客户能够跟踪、测量、审查和预测排放。","s":"源#486"},{"id":"D1-491","d":1,"t":"multiple","q":"转移到 AWS 云的以下哪些是优势？（选择两项。）","o":[{"l":"A","t":"用户可以在几秒钟内实现所有 AWS 服务。"},{"l":"B","t":"AWS 承担基础设施和应用程序安全的全部责任。"},{"l":"C","t":"用户体验到增加的速度和敏捷性。"},{"l":"D","t":"用户从规模经济中受益。"},{"l":"E","t":"用户可以将硬件从他们的数据中心转移到 AWS 云。"}],"a":["C","D"],"e":"转移到 AWS 云的两个优势包括增加的速度和敏捷性，因为用户可以快速部署和扩展资源以满足不断变化的需求。此外，用户从规模经济中受益，因为他们可以利用 AWS 所做的大量基础设施投资来降低自己的成本。","s":"源#491"},{"id":"D1-499","d":1,"t":"single","q":"一家公司在本地数据中心的自管理服务器上运行 MySQL 数据库工作负载。公司想要将数据库工作负载迁移到 AWS 管理服务。公司应该使用哪种迁移策略？","o":[{"l":"A","t":"重新托管"},{"l":"B","t":"重新购买"},{"l":"C","t":"重构"},{"l":"D","t":"重新平台化"}],"a":["D"],"e":"公司想要将其在本地数据中心的自管理服务器上运行的 MySQL 数据库工作负载迁移到 AWS 管理的服务上。我们需要从给定的选项中选择最合适的迁移策略。 -A. 重新托管：重新托管通常指的是将现有的 IT 资产或应用从一个托管环境转移到另一个托管环境，但本质上资产的所有权和控制权仍然保持不变。在这个场景中，虽然数据库会被迁移到 AWS，但“重新托管”没有准确描述出这种迁移是到AWS 的特定服务（如 RDS）上，且通常不涉及对应用或数据库本身的重大更改。 -B. 重新购买：这个选项显然不符合情境，因为重新购买意味着放弃现有的数据库实例并购买新的实例，这并不涉及迁移过程。 -C. 重构：重构通常指的是对软件或系统的内部结构进行重大更改，以提高其性能、可维护性或可扩展性。虽然迁移过程可能需要对数据库进行一些调整以适应新的环境，但“重构”一词在这里过于宽泛，且通常不用于描述简单的迁移操作。 -D. 重新平台化：重新平台化指的是将应用或数据从一个平台迁移到另一个平台，这通常涉及对应用或数据的适配以使其在新平台上正常运行。在这个场景中，公司想要将其 MySQL 数据库从本地数据中心迁移到 AWS 的 RDS 服务上，这正是一个典型的重新平台化过程。RDS 服务提供了托管式的 MySQL 数据库，公司可以将其现有的数据库实例迁移到 RDS 上，同时利用 AWS 提供的管理、监控、备份和扩展等功能。综上所述，公司应该采用的迁移策略是重新平台化（D 选项）。这种策略能够最好地描述公司将 MySQL 数据库从本地数据中心迁移到AWS RDS 服务的过程，同时利用了 AWS 提供的托管式数据库服务的优势。","s":"源#499"},{"id":"D1-500","d":1,"t":"single","q":"一家公司计划将单体应用程序迁移到 AWS。公司希望通过将其拆分为微服务来现代化应用程序。公司将在 AWS 上部署微服务。公司应该使用哪种迁移策略？","o":[{"l":"A","t":"重新托管"},{"l":"B","t":"重新购买"},{"l":"C","t":"重新平台化"},{"l":"D","t":"重构"}],"a":["D"],"e":"迁移策略“重构”涉及对应用程序的架构进行重大更改以改进它并促进云原生操作。当公司想要将单体应用程序拆分为微服务并在AWS 上部署它们时，这是适当的策略。","s":"源#500"},{"id":"D1-507","d":1,"t":"single","q":"一家公司计划迁移到 AWS 云。公司正在进行组织转型，希望对客户查询和反馈更加响应。根据AWS云采用框架（AWS CAF），公司应执行哪些任务以满足这些要求？","o":[{"l":"A","t":"重新调整团队，专注于产品和价值流。"},{"l":"B","t":"用新产品和新服务创造新的价值主张。"},{"l":"C","t":"使用新的数据和分析平台创建可操作的见解。"},{"l":"D","t":"迁移和现代化遗留基础设施。"}],"a":["A"],"e":"根据 AWS 云采用框架，为了对客户查询和反馈更加响应，公司应重新调整团队，专注于产品和价值流。这种方法有助于组织变得更加敏捷和以客户为中心。","s":"源#507"},{"id":"D1-510","d":1,"t":"single","q":"AWS 云的哪个优势帮助公司因所有 AWS 用户的聚合使用而实现更低的使用成本？","o":[{"l":"A","t":"不需要猜测容量"},{"l":"B","t":"几分钟内走向全球"},{"l":"C","t":"规模经济"},{"l":"D","t":"提高速度和敏捷性"}],"a":["C"],"e":"AWS 云的一个优势是能够因规模经济而实现更低的使用成本。这是因为 AWS 可以利用所有用户集体的使用模式和需求，谈判更好的定价并优化资源分配，这反过来可以为个别公司带来成本节省。","s":"源#510"},{"id":"D1-522","d":1,"t":"multiple","q":"一家零售公司正在构建一个新的移动应用程序。公司正在评估是在本地数据中心还是AWS 云中构建该应用程序。以下哪些是构建此应用程序在 AWS 云中的好处？（选择两项。）","o":[{"l":"A","t":"大量的前期资本支出和低可变成本"},{"l":"B","t":"尝试新项目的加快速度"},{"l":"C","t":"对基础设施的物理安全性拥有完全控制权"},{"l":"D","t":"随着应用程序受欢迎，几分钟内灵活扩展"},{"l":"E","t":"选择将托管应用程序服务器的特定数据中心"}],"a":["B","D"],"e":"在 AWS 云中构建移动应用程序的两个好处包括加快尝试新项目的速度和随着应用程序受欢迎，几分钟内灵活扩展的能力。AWS 提供了一个可扩展和灵活的环境，允许快速部署和轻松扩展资源。","s":"源#522"},{"id":"D1-525","d":1,"t":"single","q":"一家公司需要在 Amazon RDS 中部署 PostgreSQL 数据库。数据库必须是高可用和容错的。公司应该使用哪种 AWS 解决方案来满足这些要求？","o":[{"l":"A","t":"单个可用区的 Amazon RDS"},{"l":"B","t":"Amazon RDS 快照"},{"l":"C","t":"多个可用区的 Amazon RDS"},{"l":"D","t":"AWS 数据库迁移服务（AWS DMS）"}],"a":["C"],"e":"多个可用区的 Amazon RDS 为数据库提供了高可用和容错的解决方案。它自动跨多个可用区复制数据，确保即使在一个可用区发生故障，数据库仍然可用和持久。","s":"源#525"},{"id":"D1-527","d":1,"t":"multiple","q":"哪些陈述准确地描述了 AWS 全球基础设施组件之间的关系？（选择两项。）","o":[{"l":"A","t":"AWS 区域比可用区多。"},{"l":"B","t":"边缘位置比 AWS 区域多。"},{"l":"C","t":"边缘位置是可用区。"},{"l":"D","t":"AWS 区域比边缘位置多。"},{"l":"E","t":"可用区比 AWS 区域多。"}],"a":["B","E"],"e":"在 AWS 全球基础设施中，边缘位置比 AWS 区域多，而且可用区比边缘位置多。边缘位置是一个存在点（PoP），缓存来自AWS 服务的频繁访问内容，但它与可用区不同。","s":"源#527"},{"id":"D1-529","d":1,"t":"single","q":"一家公司需要在特定地理区域托管应用程序以遵守法规。AWS 全球基础设施的哪个特性将帮助公司满足此要求？","o":[{"l":"A","t":"可扩展性"},{"l":"B","t":"全球足迹"},{"l":"C","t":"可用性"},{"l":"D","t":"性能"}],"a":["B"],"e":"AWS 全球基础设施的全球足迹允许公司在特定地理区域托管其应用程序。这对于满足数据居住要求和遵守规定数据存储和处理地点的法规非常重要。","s":"源#529"},{"id":"D1-531","d":1,"t":"single","q":"设计 AWS 工作负载以在组件故障时仍可操作，AWS 的最佳实践是什么？","o":[{"l":"A","t":"每季度进行灾难恢复测试。"},{"l":"B","t":"将主要组件放在 us-east-1 区域。"},{"l":"C","t":"设计为自动故障转移到健康的资源。"},{"l":"D","t":"设计工作负载以适应单个 Amazon EC2 实例。"}],"a":["C"],"e":"设计在组件故障时仍可操作的工作负载的 AWS 最佳实践是实施自动故障转移到健康的资源。这确保了高可用性和容错性。","s":"源#531"},{"id":"D1-543","d":1,"t":"multiple","q":"哪些 AWS 服务或功能构成了 AWS 云全球基础设施？（选择两项。）","o":[{"l":"A","t":"可用区"},{"l":"B","t":"Amazon ElastiCache"},{"l":"C","t":"AWS 区域"},{"l":"D","t":"Amazon S3"},{"l":"E","t":"Amazon VPC"}],"a":["A","C"],"e":"AWS 云全球基础设施的基础组成部分是 AWS 区域和可用区。这些提供了 AWS 服务运行的地理分布和物理基础设施。","s":"源#543"},{"id":"D1-559","d":1,"t":"multiple","q":"以下哪些设计原则包含在 AWS 良好架构框架的可靠性支柱中？（选择两项。）","o":[{"l":"A","t":"自动从故障中恢复。"},{"l":"B","t":"授予每个人增加 AWS 服务配额的访问权限。"},{"l":"C","t":"停止猜测容量。"},{"l":"D","t":"设计应用程序在单个可用区运行。"},{"l":"E","t":"首先在辅助 AWS 区域中计划增加 AWS 服务配额。"}],"a":["A","C"],"e":"AWS 良好架构框架的可靠性支柱侧重于应用程序从基础设施或服务中断中恢复的能力，以及根据需求动态获取资源的能力。像自动从故障中恢复（A）和停止容量猜测（C）这样的原则是这一支柱的关键组成部分。","s":"源#559"},{"id":"D1-562","d":1,"t":"single","q":"一家公司希望在单个 AWS 区域的多个可用区部署应用程序。这种部署将为公司提供哪些好处？","o":[{"l":"A","t":"改善全球客户的连接性能"},{"l":"B","t":"弹性架构和高可用性解决方案"},{"l":"C","t":"降低整体数据存储成本"},{"l":"D","t":"在需求低的时候关闭可用区的能力"}],"a":["B"],"e":"在单个 AWS 区域的多个可用区部署应用程序可以提供弹性架构和高可用性解决方案的好处。这确保了即使在一个可用区发生服务中断，应用程序仍然可用。","s":"源#562"},{"id":"D1-575","d":1,"t":"single","q":"一家公司需要访问检查和建议，以帮助公司遵循 AWS 最佳实践，以实现成本优化、安全性、容错性、性能和服务配额。哪个 AWS 服务和 AWS 支持计划的组合将满足这些要求？","o":[{"l":"A","t":"AWS Trusted Advisor 与 AWS 开发人员支持"},{"l":"B","t":"AWS 健康仪表板与 AWS 企业支持"},{"l":"C","t":"AWS Trusted Advisor 与 AWS 商业支持"},{"l":"D","t":"AWS 健康仪表板与 AWS 企业入门支持"}],"a":["C"],"e":"AWS Trusted Advisor 提供建议和检查，以帮助改进成本优化、安全性、容错性、性能和服务使用。AWS 商业支持是一个支持计划，包括访问 AWS Trusted Advisor，使其成为寻求在这些领域遵循 AWS 最佳实践的公司的理想组合。","s":"源#575"},{"id":"D1-579","d":1,"t":"multiple","q":"AWS 云开发工具包（AWS CDK）目前支持哪些编程语言？（选择两项。）","o":[{"l":"A","t":"Python"},{"l":"B","t":"Swift"},{"l":"C","t":"TypeScript"},{"l":"D","t":"Ruby"},{"l":"E","t":"PHP"}],"a":["A","C"],"e":"AWS 云开发工具包（AWS CDK）是一个开源软件开发框架，允许开发人员使用熟悉的编程语言定义云基础设施。它目前支持TypeScript（C）和 Python（A），使开发人员能够在这些语言中工作以创建和管理 AWS 资源。","s":"源#579"},{"id":"D1-581","d":1,"t":"single","q":"哪项 AWS 服务或功能允许公司在 AWS 云中拥有自己逻辑隔离的部分？","o":[{"l":"A","t":"AWS VPN"},{"l":"B","t":"可用区"},{"l":"C","t":"Amazon 虚拟私有云（Amazon VPC）"},{"l":"D","t":"AWS 区域"}],"a":["C"],"e":"Amazon 虚拟私有云（Amazon VPC）使公司能够在 AWS 云中创建一个虚拟网络，提供一个逻辑上隔离的部分，在其中可以在私有、隔离的环境中启动 AWS 资源。","s":"源#581"},{"id":"D1-583","d":1,"t":"single","q":"为什么使用 AWS CloudFormation 模板？","o":[{"l":"A","t":"通过使用自动化减少配置时间。"},{"l":"B","t":"将现有基础设施转移到另一家公司。"},{"l":"C","t":"在 AWS 云中重用本地基础设施。"},{"l":"D","t":"部署大型基础设施且没有成本影响。"}],"a":["A"],"e":"AWS CloudFormation 模板用于通过自动化来减少配置时间。使用这些模板，基础设施可以更高效、一致地设置，从而提高配置效率。","s":"源#583"},{"id":"D1-601","d":1,"t":"single","q":"AWS 云采用框架（AWS CAF）的哪个视角专注于在数据目录中组织数据产品的清单？","o":[{"l":"A","t":"运营"},{"l":"B","t":"治理"},{"l":"C","t":"业务"},{"l":"D","t":"平台"}],"a":["B"],"e":"AWS CAF 中的治理视角专注于组织和管理数据资产，包括在数据目录中组织数据产品的清单。这有助于促进数据货币化和自助式分析，使数据消费者能够快速找到相关的数据产品并了解其背景，如来源和质量。","s":"源#601"},{"id":"D1-613","d":1,"t":"single","q":"一家公司计划将其本地数据中心的一个包含数百万文件的大型数据集一次性迁移到AWS 云。该公司应该使用哪项 AWS 服务进行迁移？","o":[{"l":"A","t":"AWS Database Migration Service（AWS DMS）"},{"l":"B","t":"AWS DataSync"},{"l":"C","t":"AWS Migration Hub"},{"l":"D","t":"AWS Application Migration Service"}],"a":["B"],"e":"AWS DataSync 专门用于在本地和 AWS 存储服务之间传输大量数据，适用于一次性迁移具有数百万文件的大型数据集。","s":"源#613"},{"id":"D1-618","d":1,"t":"single","q":"一家公司想要将其本地基础设施迁移到 AWS 云。 云计算的哪个优势将帮助该公司降低前期成本？","o":[{"l":"A","t":"在几分钟内实现全球化"},{"l":"B","t":"提高速度和敏捷性"},{"l":"C","t":"受益于大规模的经济规模"},{"l":"D","t":"将固定费用转换为可变费用"}],"a":["D"],"e":"通过迁移到 AWS 云，该公司可以将与本地基础设施相关的固定费用（如硬件购买和维护）转换为基于使用的可变费用，有助于降低前期成本。","s":"源#618"},{"id":"D1-619","d":1,"t":"single","q":"一家公司正在 AWS 云中设计工作负载。该公司希望工作负载在其生命周期内正确且一致地执行其预期功能。 AWS 良好架构框架的哪个支柱代表了这一目标？","o":[{"l":"A","t":"运营卓越"},{"l":"B","t":"安全性"},{"l":"C","t":"可靠性"},{"l":"D","t":"性能效率"}],"a":["C"],"e":"可靠性是 AWS 良好架构框架的一个支柱，专注于确保工作负载在时间上正确且一致地执行其预期功能，即使面对故障或中断。","s":"源#619"},{"id":"D1-624","d":1,"t":"single","q":"一家公司需要能够在几分钟内为新应用程序设置基础设施。 云计算的哪个优势将帮助该公司满足此要求？","o":[{"l":"A","t":"将固定费用转换为可变费用"},{"l":"B","t":"在几分钟内实现全球化"},{"l":"C","t":"提高速度和敏捷性"},{"l":"D","t":"停止猜测容量"}],"a":["C"],"e":"云计算能够快速设置基础设施的能力体现了其速度和敏捷性的优势，使公司能够快速响应业务需求。","s":"源#624"},{"id":"D1-626","d":1,"t":"single","q":"一家公司计划迁移到 AWS 云。该公司希望收集有关其本地数据中心的信息。该公司应该使用哪项AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS Application Discovery Service"},{"l":"B","t":"AWS DataSync"},{"l":"C","t":"AWS Storage Gateway"},{"l":"D","t":"AWS Database Migration Service（AWS DMS）"}],"a":["A"],"e":"AWS Application Discovery Service 帮助公司收集有关其本地数据中心的信息，包括应用程序、服务器和依赖关系的详细信息，以促进向AWS 云的迁移过程。","s":"源#626"},{"id":"D1-638","d":1,"t":"single","q":"一家公司希望能够根据需要自动获取资源，并在不再需要时释放这些资源。 哪个云概念描述了此功能？","o":[{"l":"A","t":"可用性"},{"l":"B","t":"弹性"},{"l":"C","t":"持久性"},{"l":"D","t":"可靠性"}],"a":["B"],"e":"弹性是云概念，允许根据需求自动获取和释放资源。它使公司能够动态地扩展或缩减其资源，以满足不断变化的工作负载需求，确保资源的高效利用和成本优化。","s":"源#638"},{"id":"D1-642","d":1,"t":"multiple","q":"一家公司正在迁移到 AWS 云而不是在本地运行其基础设施。 以下哪些是此迁移的优势？（选择两项）","o":[{"l":"A","t":"无需进行安全审计"},{"l":"B","t":"增加全球覆盖范围和敏捷性"},{"l":"C","t":"能够在几分钟内全球部署"},{"l":"D","t":"无需 IT 人员成本"},{"l":"E","t":"所有计算服务默认具有冗余性"}],"a":["B","C"],"e":"迁移到 AWS 云提供了增加全球覆盖范围和敏捷性的优势，因为公司可以利用 AWS 的全球基础设施在多个区域快速部署应用程序和服务。它还使公司能够在几分钟内全球部署，提供更快的上市时间和对业务需求的响应能力。","s":"源#642"},{"id":"D1-647","d":1,"t":"single","q":"一家公司希望不断改进流程和程序以提供业务价值。 AWS 良好架构框架的哪个支柱代表了这一目标？","o":[{"l":"A","t":"性能效率"},{"l":"B","t":"运营卓越"},{"l":"C","t":"可靠性"},{"l":"D","t":"可持续性"}],"a":["B"],"e":"运营卓越是 AWS 良好架构框架的一个支柱，专注于不断改进流程和程序以提供业务价值。它涉及优化运营、提高效率，并确保基础设施和应用程序的平稳运行。","s":"源#647"},{"id":"D1-651","d":1,"t":"single","q":"一家公司需要在本地运行一些工作负载以遵守监管准则。该公司希望使用 AWS 云来运行不需要在本地运行的工作负载。该公司还希望能够对本地工作负载和云工作负载使用相同的 API 调用。 该公司应该使用哪项AWS 服务或功能来满足这些要求？","o":[{"l":"A","t":"专用主机"},{"l":"B","t":"AWS Outposts"},{"l":"C","t":"可用区"},{"l":"D","t":"AWS Wavelength"}],"a":["B"],"e":"AWS Outposts 允许公司将 AWS 云扩展到本地位置，使他们能够在本地运行工作负载，同时仍然能够使用与在 AWS 云中相同的API 调用和管理工具。这有助于公司满足监管要求，同时保持其操作的一致性。","s":"源#651"},{"id":"D1-659","d":1,"t":"single","q":"根据 AWS 良好架构框架，哪个设计原则与可靠性支柱相关？","o":[{"l":"A","t":"测试恢复程序。"},{"l":"B","t":"更频繁地实验。"},{"l":"C","t":"在几分钟内实现全球化。"},{"l":"D","t":"分析并归因于支出。"}],"a":["A"],"e":"测试恢复程序是与 AWS 良好架构框架的可靠性支柱相关的设计原则。通过定期测试和验证恢复程序，公司可以确保其系统在发生故障或中断时能够快速可靠地恢复。","s":"源#659"},{"id":"D1-663","d":1,"t":"single","q":"一家公司在全球多个 AWS 区域部署了应用程序。该公司希望提高应用程序的性能和可用性。哪项AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Global Accelerator"},{"l":"B","t":"Amazon DataZone"},{"l":"C","t":"AWS Cloud Map"},{"l":"D","t":"AWS Auto Scaling"}],"a":["A"],"e":"AWS Global Accelerator 可以通过根据网络条件和用户位置将流量路由到最佳 AWS 区域来提高在多个 AWS 区域部署的应用程序的性能和可用性。它提供了全球网络基础设施来加速应用程序的交付。","s":"源#663"},{"id":"D1-666","d":1,"t":"single","q":"AWS 云计算的哪个选项可以最小化可变成本？","o":[{"l":"A","t":"高可用性"},{"l":"B","t":"规模经济"},{"l":"C","t":"全球覆盖"},{"l":"D","t":"敏捷性"}],"a":["B"],"e":"AWS 云计算中的规模经济允许高效的资源利用和成本优化，最小化可变成本。通过在多个用户之间共享资源，AWS 可以提供具有成本效益的解决方案，并降低每单位计算能力的成本。","s":"源#666"},{"id":"D1-669","d":1,"t":"multiple","q":"当公司从本地 IT 架构迁移到 AWS 云时，会获得哪些好处？（选择两项）","o":[{"l":"A","t":"减少或消除硬件故障排除、容量规划和采购的任务。"},{"l":"B","t":"消除对训练有素的 IT 人员的需求。"},{"l":"C","t":"消除对灾难恢复规划的需求。"},{"l":"D","t":"更快地部署新功能和应用程序。"},{"l":"E","t":"自动为迁移到云的所有应用程序配置安全设置。"}],"a":["A","D"],"e":"迁移到 AWS 云，公司可以减少或消除与硬件故障排除、容量规划和采购相关的任务，因为这些由 AWS 管理。此外，AWS 云使新功能和应用程序的部署更快，提供了更大的敏捷性和更快的市场响应能力。","s":"源#669"},{"id":"D1-670","d":1,"t":"multiple","q":"一家公司计划迁移到 AWS 云。该公司正在进行组织转型，并希望对客户询问和反馈更加响应。根据AWS 云采用框架（AWS CAF），该公司应该执行哪些任务来满足这些要求？（选择两项）","o":[{"l":"A","t":"重新调整团队以专注于产品和价值流。"},{"l":"B","t":"用新产品和服务创建新的价值主张。"},{"l":"C","t":"使用敏捷方法快速迭代和演进。"},{"l":"D","t":"使用新的数据和分析平台创建可操作的洞察。"},{"l":"E","t":"迁移和现代化遗留基础设施。"}],"a":["A","C"],"e":"根据 AWS 云采用框架（AWS CAF），该公司应该重新调整团队以专注于产品和价值流（A），以更响应客户询问和反馈。此外，使用敏捷方法快速迭代和演进（C）使公司能够快速适应不断变化的客户需求。","s":"源#670"},{"id":"D1-676","d":1,"t":"single","q":"AWS 云采用框架（AWS CAF）的哪个视角专注于提供实时洞察并回答有关战略的问题？","o":[{"l":"A","t":"运营"},{"l":"B","t":"人员"},{"l":"C","t":"业务"},{"l":"D","t":"平台"}],"a":["C"],"e":"AWS CAF 中的业务视角专注于提供实时洞察并回答与战略相关的问题。它帮助公司将云采用与业务目标对齐，并做出明智的决策以推动业务价值。","s":"源#676"},{"id":"D1-678","d":1,"t":"single","q":"AWS 良好架构框架的哪个概念代表系统在遇到操作问题时保持功能？","o":[{"l":"A","t":"一致性"},{"l":"B","t":"弹性"},{"l":"C","t":"耐久性"},{"l":"D","t":"延迟"}],"a":["B"],"e":"根据 AWS Well-Architected Framework（AWS 卓越架构框架），描述系统在遇到操作问题时仍能保持功能的能力的最佳概念是：B. 弹性然而，需要注意的是，尽管弹性是 AWS 中的一个关键概念，但它并没有完全捕捉到在操作问题期间保持功能的想法。你询问的概念更接近于“弹性”或“容错性”，它们是 AWS 卓越架构框架中可靠性支柱的一部分。以下是简要解释：1. 弹性：这是系统从基础设施或服务中断中恢复的能力，动态获取计算资源以满足需求，并减轻配置错误或瞬时网络问题等中断。2. 容错性：这指的是即使系统的某些组件失败，系统仍能保持运行的能力。3. 弹性：虽然重要，但这个概念主要指的是根据需求上下扩展资源的能力，这与性能效率支柱更相关。AWS 卓越架构框架强调设计能够承受故障并继续运行的系统。这涉及到以下实践：- 在多个可用区实现冗余- 使用提供内置容错性的托管服务- 设计松耦合组件- 实施适当的错误处理和优雅降级对于这些概念的最新和详细信息，以及如何在 AWS 架构中实现它们，我建议查阅官方 AWS 卓越架构框架文档，特别是可靠性支柱部分。","s":"源#678"},{"id":"D1-679","d":1,"t":"single","q":"AWS 良好架构框架的哪个支柱专注于从服务中断中自动恢复的能力？","o":[{"l":"A","t":"安全性"},{"l":"B","t":"性能效率"},{"l":"C","t":"运营卓越"},{"l":"D","t":"可靠性"}],"a":["D"],"e":"可靠性支柱是 AWS 良好架构框架的一部分，强调从服务中断中自动恢复的能力。这包括实施容错、备份和恢复策略，以及确保系统和应用程序的高可用性。","s":"源#679"},{"id":"D1-687","d":1,"t":"single","q":"哪个设计原则与 AWS 良好架构框架的性能效率支柱相一致？","o":[{"l":"A","t":"使用无服务器架构"},{"l":"B","t":"水平扩展"},{"l":"C","t":"测量工作负载的成本"},{"l":"D","t":"使用托管服务"}],"a":["A"],"e":"使用无服务器架构是与 AWS 良好架构框架的性能效率支柱相一致的设计原则。无服务器架构允许根据需求自动扩展和分配资源，优化了性能和成本效率。","s":"源#687"},{"id":"D1-703","d":1,"t":"single","q":"一家公司正计划迁移到 AWS 云。该公司需要了解现有的本地使用情况和配置。该公司目前还不想将其工作负载复制到 AWS。 哪个 AWS 服务或工具能满足这些要求？","o":[{"l":"A","t":"AWS 应用发现服务"},{"l":"B","t":"AWS 应用迁移服务"},{"l":"C","t":"云迁移工厂"},{"l":"D","t":"AWS 迁移中心"}],"a":["A"],"e":"AWS 应用发现服务是评估本地环境而不迁移工作负载的正确选择。它通过收集有关您的本地数据中心的信息来帮助规划迁移。","s":"源#703"},{"id":"D1-704","d":1,"t":"single","q":"一家公司希望允许其员工在家远程工作。该公司的员工使用 Windows 或 Linux 桌面。公司的员工需要通过任何支持的设备随时随地访问。 哪个 AWS 服务能满足这些要求？","o":[{"l":"A","t":"Amazon Workspaces"},{"l":"B","t":"Amazon AppStream 2.0"},{"l":"C","t":"Amazon Keyspaces（适用于 Apache Cassandra）"},{"l":"D","t":"AWS Cloud9"}],"a":["A"],"e":"Amazon Workspaces 是一种完全托管的桌面即服务，使您能够为员工提供虚拟桌面。它支持 Windows 和 Linux 桌面，并且可以从任何设备访问，非常适合远程工作场景。","s":"源#704"},{"id":"D1-709","d":1,"t":"single","q":"一家公司正在了解 AWS 云采用框架（AWS CAF）的各个视角。AWS CAF 的哪个视角涉及战略管理能力？","o":[{"l":"A","t":"商业观点"},{"l":"B","t":"人员观点"},{"l":"C","t":"治理观点"},{"l":"D","t":"运营观点"}],"a":["A"],"e":"AWS 云采用框架中的商业观点侧重于战略和规划，包括战略管理能力。它有助于将云计划与业务目标保持一致。","s":"源#709"},{"id":"D2-002","d":2,"t":"single","q":"一家公司在 Amazon EC2 实例上部署了应用程序。公司需要评估应用程序的漏洞，并必须识别不符合最佳实践的基础设施部署。公司可以使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS Trusted Advisor"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"AWS Config"},{"l":"D","t":"Amazon GuardDuty"}],"a":["B"],"e":"Amazon Inspector 是旨在评估应用程序漏洞并识别不符合最佳实践的基础设施部署的服务。它是一个安全评估服务，可以扫描漏洞并提供详细的发现。","s":"源#2"},{"id":"D2-004","d":2,"t":"single","q":"根据安全最佳实践，应该如何使 Amazon EC2 实例能够访问 Amazon S3 存储桶？","o":[{"l":"A","t":"在应用程序中直接硬编码 IAM 用户的密钥和访问密钥，并上传文件。"},{"l":"B","t":"在 EC2 实例上将 IAM 用户的密钥和访问密钥存储在文本文件中，读取密钥，然后上传文件。"},{"l":"C","t":"让 EC2 实例假定角色以获取上传文件的权限。"},{"l":"D","t":"修改 S3 存储桶策略，以便任何服务随时都可以上传到其中。"}],"a":["C"],"e":"授予 Amazon EC2 实例访问 Amazon S3 存储桶的最佳实践是让 EC2 实例假定带有必要权限的角色。这种方法遵循最小权限原则，并通过 AWS 提供的临时凭证增强安全性。","s":"源#4"},{"id":"D2-005","d":2,"t":"single","q":"在 AWS 共享责任模型下，以下哪项是客户使用 Amazon DynamoDB 时的责任？","o":[{"l":"A","t":"DynamoDB 的物理安全"},{"l":"B","t":"DynamoDB 的补丁"},{"l":"C","t":"对 DynamoDB 表的访问"},{"l":"D","t":"DynamoDB 中数据的静态加密"}],"a":["C"],"e":"根据 AWS 共享责任模型，客户负责管理对其 DynamoDB 表的访问。这包括设置适当的 IAM 策略和角色，以控制谁可以访问表以及他们可以执行的操作。","s":"源#5"},{"id":"D2-010","d":2,"t":"multiple","q":"使用 AWS Trusted Advisor 的以下哪些好处？（选择两项。）","o":[{"l":"A","t":"提供高性能容器编排"},{"l":"B","t":"创建和轮换加密密钥"},{"l":"C","t":"通过主动监控 AWS 环境来检测未充分利用的资源以节省成本"},{"l":"D","t":"通过主动监控 AWS 环境提高安全性"},{"l":"E","t":"在 AWS 资源中实施强制标记"}],"a":["C","D"],"e":"AWS Trusted Advisor 帮助检测未充分利用的资源，这可以通过优化资源使用来节省成本。它还通过提供建议和监控AWS 环境以识别潜在的漏洞和配置错误来提高安全性。","s":"源#10"},{"id":"D2-012","d":2,"t":"single","q":"一家公司想要管理部署的 IT 服务并管理其基础设施即代码（IaC）模板。哪个 AWS 服务将满足此要求？","o":[{"l":"A","t":"AWS 资源浏览器"},{"l":"B","t":"AWS 服务目录"},{"l":"C","t":"AWS 组织"},{"l":"D","t":"AWS 系统管理器"}],"a":["B"],"e":"AWS 服务目录允许组织创建和管理 AWS 上批准使用的 IT 服务目录。它使管理员能够集中管理和治理 IT 服务，包括基础设施即代码模板，确保符合组织政策和标准。","s":"源#12"},{"id":"D2-013","d":2,"t":"single","q":"哪个 AWS 服务或工具帮助用户可视化、理解和管理随时间变化的支出和使用情况？","o":[{"l":"A","t":"AWS 组织"},{"l":"B","t":"AWS 定价计算器"},{"l":"C","t":"AWS 成本探索器"},{"l":"D","t":"AWS 服务目录"}],"a":["C"],"e":"AWS 成本探索器是一个工具，允许用户可视化、理解和管理他们的 AWS 支出和使用情况随时间变化。它提供了详细的洞察、历史数据和预测。","s":"源#13"},{"id":"D2-018","d":2,"t":"single","q":"一家公司在 Amazon S3 存储桶中存储敏感客户数据。公司希望保护数据免受意外删除或覆盖。公司应该使用哪个 S3 功能来满足这些要求？","o":[{"l":"A","t":"S3 生命周期规则"},{"l":"B","t":"S3 版本控制"},{"l":"C","t":"S3 存储桶策略"},{"l":"D","t":"S3 服务器端加密"}],"a":["B"],"e":"S3 版本控制是一个功能，它在同一个存储桶中保留对象的多个变体，允许从意外删除或覆盖中恢复对象。它保存、检索和恢复每个对象的每个版本。","s":"源#18"},{"id":"D2-019","d":2,"t":"single","q":"哪个 AWS 服务提供了管理基础设施即代码的能力？","o":[{"l":"A","t":"AWS CodePipeline"},{"l":"B","t":"AWS CodeDeploy"},{"l":"C","t":"AWS 直接连接"},{"l":"D","t":"AWS CloudFormation"}],"a":["D"],"e":"AWS CloudFormation 允许用户通过将基础设施视为代码来建模、配置和管理系统。它使用模板描述和配置资源，以可重复和自动化的方式。","s":"源#19"},{"id":"D2-023","d":2,"t":"single","q":"一家公司想要保护其 AWS 云信息、系统和资产，同时执行风险评估和缓解任务。哪个AWS 良好架构框架的支柱支持这些目标？","o":[{"l":"A","t":"可靠性"},{"l":"B","t":"安全"},{"l":"C","t":"运营卓越"},{"l":"D","t":"性能效率"}],"a":["B"],"e":"AWS 良好架构框架的安全支柱专注于保护信息、系统和资产。它涉及实施最佳实践，用于身份和访问管理、数据保护以及风险评估和缓解。","s":"源#23"},{"id":"D2-026","d":2,"t":"single","q":"一家公司有一个 AWS 账户。公司想要审计其密码和访问密钥轮换的详细信息以进行合规性目的。哪个AWS 服务或工具将满足此要求？","o":[{"l":"A","t":"IAM 访问分析器"},{"l":"B","t":"AWS 工件"},{"l":"C","t":"IAM 凭据报告"},{"l":"D","t":"AWS AWS Audit Manager"}],"a":["C"],"e":"IAM 凭据报告是 AWS IAM 中的一个功能，提供有关用户密码和访问密钥轮换历史的详细信息。它用于审计密码和访问密钥轮换活动以进行合规性目的。","s":"源#26"},{"id":"D2-028","d":2,"t":"single","q":"哪个 AWS 服务或资源提供了 AWS 收到的最常见的安全相关问题的答案？","o":[{"l":"A","t":"AWS 工件"},{"l":"B","t":"Amazon Connect"},{"l":"C","t":"AWS 聊天机器人"},{"l":"D","t":"AWS 知识中心"}],"a":["D"],"e":"AWS 知识中心是一个资源，它提供了 AWS 收到的最常见的安全相关问题的答案，提供文章、视频和其他资源，帮助用户解决常见的安全查询和挑战。","s":"源#28"},{"id":"D2-032","d":2,"t":"single","q":"用户需要通过 AWS CLI 或 AWS API 以编程方式访问 AWS 资源。哪个选项将为用户提供适当的访问权限？","o":[{"l":"A","t":"Amazon Inspector"},{"l":"B","t":"访问密钥"},{"l":"C","t":"SSH 公钥"},{"l":"D","t":"AWS 密钥管理服务 (AWS KMS) 密钥"}],"a":["B"],"e":"访问密钥，由访问密钥 ID 和秘密访问密钥组成，提供对 AWS 资源的编程访问。它们与 IAM 用户关联，并用于签署编程请求的凭证。","s":"源#32"},{"id":"D2-035","d":2,"t":"single","q":"一家公司需要阻止 SQL 注入攻击。哪个 AWS 服务或功能可以满足这个要求？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"AWS 盾牌"},{"l":"C","t":"网络 ACL"},{"l":"D","t":"安全组"}],"a":["A"],"e":"AWS WAF（Web 应用程序防火墙）允许用户创建自定义规则以过滤和监视对 Web 应用程序的 HTTP 或 HTTPS 请求。它通过启用阻止或限制恶意请求，帮助保护免受常见 Web 漏洞的攻击，包括 SQL 注入攻击。","s":"源#35"},{"id":"D2-036","d":2,"t":"single","q":"哪个 AWS 服务或功能可以识别 Amazon S3 存储桶或 IAM 角色是否已与外部实体共享？","o":[{"l":"A","t":"AWS 服务目录"},{"l":"B","t":"AWS 系统管理器"},{"l":"C","t":"AWS IAM 访问分析器"},{"l":"D","t":"AWS 组织"}],"a":["C"],"e":"AWS IAM 访问分析器是一项服务，可帮助识别意外的资源访问和资源共享。它特别识别 Amazon S3 存储桶或 IAM 角色是否已与外部实体共享，并提供对资源访问策略的见解。","s":"源#36"},{"id":"D2-037","d":2,"t":"single","q":"一位云从业者在迁移环境到 AWS 云之前需要获得 AWS 合规性报告。这些报告如何生成？","o":[{"l":"A","t":"联系 AWS 合规团队。"},{"l":"B","t":"从 AWS 工件下载报告。"},{"l":"C","t":"向 AWS 支持开启案例。"},{"l":"D","t":"使用Amazon Macie 生成报告。"}],"a":["B"],"e":"AWS 工件是一个自助门户，提供按需访问 AWS 合规性报告。用户可以下载有关各种合规计划和认证的文档，使它成为在迁移到AWS 云之前获取合规性报告的便捷方式。","s":"源#37"},{"id":"D2-039","d":2,"t":"single","q":"一家公司正在 AWS 账户上设置 AWS 身份和访问管理 (IAM)。哪个建议符合 IAM安全最佳实践？","o":[{"l":"A","t":"使用帐户根用户访问密钥进行管理任务。"},{"l":"B","t":"授予广泛的权限，以便所有公司员工都可以访问他们需要的资源。"},{"l":"C","t":"启用多因素认证 (MF"},{"l":"D","t":"在登录过程中增加安全性。"},{"l":"E","t":"避免轮换凭证，以防止生产应用程序出现问题。"}],"a":["C"],"e":"启用多因素认证 (MFA) 是一种安全最佳实践，通过要求用户在密码之外提供第二种形式的认证，增加了额外的安全层。这有助于防止未经授权的访问，即使凭证被泄露。","s":"源#39"},{"id":"D2-041","d":2,"t":"single","q":"哪个服务使客户能够在其 AWS 账户中审计 API 调用？","o":[{"l":"A","t":"AWS CloudTrail"},{"l":"B","t":"AWS Trusted Advisor"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"AWS X-Ray"}],"a":["A"],"e":"AWS CloudTrail 通过捕获和记录这些调用，使客户能够在其 AWS 账户中审计 API 调用。它提供了用户和资源活动的可见性，可用于安全分析、合规性检查和故障排除。","s":"源#41"},{"id":"D2-042","d":2,"t":"single","q":"根据 AWS 共享责任模型，使用 AWS Lambda 时客户的责任是什么？","o":[{"l":"A","t":"管理 Lambda 函数内的代码"},{"l":"B","t":"确认数据中心的硬件是否正常工作"},{"l":"C","t":"修补操作系统"},{"l":"D","t":"当 Lambda 函数不再使用时关闭它们"}],"a":["A"],"e":"使用 AWS Lambda 的客户负责管理 Lambda 函数内的代码。这包括开发、部署和维护代码和依赖项。AWS 管理底层基础设施，包括操作系统，并处理硬件维护和安全修补等任务。","s":"源#42"},{"id":"D2-044","d":2,"t":"single","q":"以下哪个 AWS 服务可以免费使用？","o":[{"l":"A","t":"Amazon SageMaker"},{"l":"B","t":"AWS Config"},{"l":"C","t":"AWS 组织"},{"l":"D","t":"Amazon CloudWatch"}],"a":["C"],"e":"AWS 组织是一个账户管理服务，允许您将多个 AWS 账户合并到您创建的组织中，并集中管理。它免费提供，只有当用户或角色在您的成员账户中使用的 AWS 资源时才会产生费用。","s":"源#44"},{"id":"D2-052","d":2,"t":"single","q":"一家公司正在开发使用多个 AWS 服务的应用程序。该应用程序需要使用临时的、有限权限的凭证对其他 AWS API 进行身份验证。公司应该使用哪个 AWS 服务或功能来满足这些身份验证要求？","o":[{"l":"A","t":"Amazon API 网关"},{"l":"B","t":"IAM 用户"},{"l":"C","t":"AWS 安全令牌服务 (AWS STS)"},{"l":"D","t":"IAM 实例配置文件"}],"a":["C"],"e":"AWS 安全令牌服务 (AWS STS) 是一项服务，提供临时的、有限权限的凭证。它允许请求具有特定权限的临时凭证，用于对其他AWS服务的身份验证，适用于需要临时访问而不暴露长期凭证的场景。","s":"源#52"},{"id":"D2-053","d":2,"t":"single","q":"哪个 AWS 服务是一个云安全态势管理 (CSPM) 服务，它以标准化格式聚合来自各种AWS 服务和合作伙伴产品警报？","o":[{"l":"A","t":"AWS 安全中心"},{"l":"B","t":"AWS 可信顾问"},{"l":"C","t":"Amazon EventBridge"},{"l":"D","t":"Amazon GuardDuty"}],"a":["A"],"e":"AWS 安全中心是一个 CSPM 服务，它执行自动化的、持续的安全最佳实践检查，针对 AWS 资源，识别配置错误，并以标准化格式聚合安全警报，以便更容易地进行调查和修复。","s":"源#53"},{"id":"D2-054","d":2,"t":"single","q":"哪个 AWS 服务始终免费提供？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"AWS 身份和访问管理 (IAM)"},{"l":"C","t":"弹性负载均衡器"},{"l":"D","t":"AWS WAF"}],"a":["B"],"e":"AWS 身份和访问管理 (IAM) 始终免费提供。它允许安全控制对 AWS 服务和资源的访问，允许创建和管理用户、组和角色而不产生额外费用。","s":"源#54"},{"id":"D2-056","d":2,"t":"single","q":"一家公司正在使用 Amazon DynamoDB。根据 AWS 共享责任模型，公司的哪项任务是其责任？","o":[{"l":"A","t":"修补操作系统。"},{"l":"B","t":"配置主机。"},{"l":"C","t":"管理数据库访问权限。"},{"l":"D","t":"保护操作系统安全。"}],"a":["C"],"e":"基于 AWS 的共享责任模型，该问题的正确答案是：C. 管理数据库访问权限。原因如下：1. 在Amazon DynamoDB 的共享责任模型中，AWS 负责底层基础设施，包括操作系统打补丁、配置主机以及保障操作系统的安全。这些任务属于 AWS “云安全” 的责任范畴。2. 作为使用DynamoDB 的客户，你负责 “云中安全”，这其中包括管理对数据和资源的访问，也就涵盖了管理数据库访问权限。3. 管理数据库访问权限包括： - 配置 AWS 身份和访问管理（IAM）策略，以控制哪些人可以访问你的 DynamoDB 表以及他们能执行哪些操作。 - 使用IAM角色和策略实施细粒度的访问控制。 - 如果需要更精细的权限设置，可设置基于属性的访问控制（ABAC）。 - 定期审查和审计访问权限，确保其符合最小权限原则。4. 值得注意的是，虽然 AWS 提供了用于管理访问的工具和功能，但有效实施和维护这些安全控制是客户的责任。5. 作为最佳实践，你应定期审查和更新访问权限，尽可能使用 IAM 角色而非单个 IAM 用户，并为敏感操作实施多因素身份验证（MFA）。请查阅AWS 官方文档，以获取关于管理 DynamoDB 安全和访问权限的最新、最详细信息。","s":"源#56"},{"id":"D2-058","d":2,"t":"single","q":"哪个 AWS 服务使用户能够发现并保护存储在 Amazon S3 存储桶中的敏感数据？","o":[{"l":"A","t":"Amazon Macie"},{"l":"B","t":"Amazon Detective"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"AWS IAM 访问分析器"}],"a":["A"],"e":"Amazon Macie 是一项安全服务，使用机器学习自动发现、分类和保护 Amazon S3 中的敏感数据，例如个人身份信息(PII)。","s":"源#58"},{"id":"D2-060","d":2,"t":"single","q":"哪个 AWS 服务可以识别 Amazon EC2 实例何时被终止？","o":[{"l":"A","t":"AWS 身份和访问管理 (IAM)"},{"l":"B","t":"AWS CloudTrail"},{"l":"C","t":"AWS 计算优化器"},{"l":"D","t":"Amazon EventBridge"}],"a":["B"],"e":"AWS CloudTrail 是一项服务，记录 AWS 账户中的所有 API 活动，包括终止 EC2 实例。它提供对资源所采取行动的审计跟踪，允许用户识别 EC2 实例何时被终止以及其他相关信息。","s":"源#60"},{"id":"D2-065","d":2,"t":"single","q":"一家公司想要监控允许对特定端口的无限制访问的配置错误的安全组。哪个 AWS 服务将满足这个要求？","o":[{"l":"A","t":"AWS 可信顾问"},{"l":"B","t":"Amazon CloudWatch"},{"l":"C","t":"Amazon GuardDuty"},{"l":"D","t":"AWS 健康仪表板"}],"a":["A"],"e":"AWS 可信顾问包括一个安全检查，特别检查对特定端口有无限制访问的安全组。它识别具有过于宽松规则的安全组，这些规则可能带来安全风险，并向用户警告这些配置错误。","s":"源#65"},{"id":"D2-069","d":2,"t":"single","q":"哪个 AWS 服务提供命令行访问 AWS 工具和资源，直接从 Web 浏览器？","o":[{"l":"A","t":"AWS CloudHSM"},{"l":"B","t":"AWS CloudShell"},{"l":"C","t":"Amazon WorkSpaces"},{"l":"D","t":"AWS Cloud Map"}],"a":["B"],"e":"AWS CloudShell 是 AWS 提供的基于浏览器的 shell，它允许直接从 AWS 管理控制台通过命令行访问 AWS 资源。它允许用户运行AWS CLI 命令和使用各种 AWS 工具，而无需安装任何额外的软件。","s":"源#69"},{"id":"D2-072","d":2,"t":"single","q":"一家公司想要为数据库用户凭证建立轮换计划。哪个 AWS 服务将以最小的运营开销支持这一要求？","o":[{"l":"A","t":"AWS 系统管理员"},{"l":"B","t":"AWS 密钥管理器"},{"l":"C","t":"AWS 许可证管理器"},{"l":"D","t":"AWS 托管服务"}],"a":["B"],"e":"此服务专门设计用于管理敏感信息，如 API 密钥、密码和数据库凭证。它包括自动轮换密钥以增强安全性并降低运营开销。","s":"源#72"},{"id":"D2-074","d":2,"t":"single","q":"哪个 AWS 服务用于为 Amazon EBS 提供加密？","o":[{"l":"A","t":"AWS 证书管理器"},{"l":"B","t":"AWS 系统管理员"},{"l":"C","t":"AWS 密钥管理服务 (AWS KMS)"},{"l":"D","t":"AWS 配置"}],"a":["C"],"e":"AWS KMS 是一个完全托管的服务，使您能够轻松创建、控制和管理用于加密数据的加密密钥。它与其他 AWS 服务（包括Amazon EBS）无缝集成，用于加密目的。","s":"源#74"},{"id":"D2-075","d":2,"t":"single","q":"一家公司希望通过 Web 界面管理其 AWS 云资源。哪个 AWS 服务将满足这一要求？","o":[{"l":"A","t":"AWS 管理控制台"},{"l":"B","t":"AWS CLI"},{"l":"C","t":"AWS SDK"},{"l":"D","t":"AWS Cloud9"}],"a":["A"],"e":"它是一个基于 Web 的界面，允许用户使用图形用户界面 (GUI) 访问和管理他们的 AWS 资源。这个控制台为各种AWS 服务提供了一个易于使用的平台。","s":"源#75"},{"id":"D2-079","d":2,"t":"single","q":"根据 AWS 共享责任模型，以下哪项是客户的责任？","o":[{"l":"A","t":"为 Amazon S3 基础设施设备应用安全补丁。"},{"l":"B","t":"为 AWS 数据中心提供物理安全。"},{"l":"C","t":"在 Lambda@Edge 上安装操作系统更新。"},{"l":"D","t":"为 IAM 用户账户实施多因素身份验证（MFA）。"}],"a":["D"],"e":"根据 AWS 共享责任模型，客户负责为 IAM 用户账户实施多因素身份验证（MFA），以增强其 AWS 资源的安全性。虽然AWS 负责底层基础设施的安全，但客户有责任在其应用程序和账户内采取适当的安全措施。","s":"源#79"},{"id":"D2-083","d":2,"t":"single","q":"用户想在 S3 控制台中查看所有带有 ACL 和 S3 存储桶策略的 Amazon S3 存储桶。哪个AWS 服务或资源将满足此要求？","o":[{"l":"A","t":"S3 多区域访问点"},{"l":"B","t":"S3 存储镜头"},{"l":"C","t":"AWS IAM 身份中心 (AWS 单一登录)"},{"l":"D","t":"S3 访问分析器"}],"a":["D"],"e":"此服务旨在审查和分析 S3 存储桶的访问策略，提供有关谁可以访问您的存储桶以及如何授予该访问的见解。","s":"源#83"},{"id":"D2-084","d":2,"t":"single","q":"用户在哪里可以找到有关 AWS 的合规性相关信息和报告的最佳资源？","o":[{"l":"A","t":"AWS 工件"},{"l":"B","t":"AWS 市场"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"AWS 支持"}],"a":["A"],"e":"它是一个门户，提供按需访问 AWS 合规性报告、认证和证明。它是各种合规性相关文档的集中位置。","s":"源#84"},{"id":"D2-092","d":2,"t":"single","q":"开发人员应该使用哪个工具将 AWS 服务功能直接集成到应用程序中？","o":[{"l":"A","t":"AWS 软件开发工具包"},{"l":"B","t":"AWS 代码部署"},{"l":"C","t":"AWS Lambda"},{"l":"D","t":"AWS Batch"}],"a":["A"],"e":"开发人员应该使用 AWS 软件开发工具包 (SDK) 将 AWS 服务功能直接集成到应用程序中。SDK 提供了一组库和工具，允许开发人员直接从他们的应用程序中与 AWS 服务交互，提供各种编程语言的 API，以无缝集成 AWS 服务。","s":"源#92"},{"id":"D2-094","d":2,"t":"single","q":"使用 AWS 身份和访问管理 (IAM) 仅授予执行任务所需的资源访问权限的概念被称为：","o":[{"l":"A","t":"受限访问"},{"l":"B","t":"按需访问"},{"l":"C","t":"最小权限访问"},{"l":"D","t":"令牌访问"}],"a":["C"],"e":"使用 AWS IAM 仅授予执行任务所需的资源访问权限的概念被称为 \"最小权限访问\"（选项 C）。这种方法通过确保用户或实体仅具有完成其任务所需的最低权限级别，从而最小化了安全风险。","s":"源#94"},{"id":"D2-095","d":2,"t":"single","q":"哪个 AWS 服务或工具可以用来设置防火墙，控制进入和离开 Amazon VPC 子网的流量？","o":[{"l":"A","t":"安全组"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"AWS 防火墙管理器"},{"l":"D","t":"网络 ACL"}],"a":["D"],"e":"等待中....","s":"源#95"},{"id":"D2-098","d":2,"t":"single","q":"一家公司希望将一个 AWS 账户中的用户授予访问另一个 AWS 账户中的资源的权限。用户目前没有访问这些资源的权限。哪家 AWS 服务能满足这一要求？","o":[{"l":"A","t":"IAM 组"},{"l":"B","t":"IAM 角色"},{"l":"C","t":"IAM 标签"},{"l":"D","t":"IAM 访问分析器"}],"a":["B"],"e":"允许一个 AWS 账户中的用户访问另一个 AWS 账户中的资源的 AWS 服务是 IAM 角色（选项 B）。IAM 角色可以用于跨AWS 账户委派权限，使跨账户访问所需资源。","s":"源#98"},{"id":"D2-099","d":2,"t":"single","q":"使用 AWS 服务时，哪项任务是 AWS 的责任？","o":[{"l":"A","t":"管理 IAM 用户权限"},{"l":"B","t":"为出站访问创建安全组规则"},{"l":"C","t":"维护物理和环境控制"},{"l":"D","t":"应用 Amazon EC2 操作系统补丁"}],"a":["C"],"e":"使用 AWS 服务时，AWS 的责任是维护物理和环境控制（选项 C）。AWS 管理物理基础设施，包括数据中心安全、冷却和电源等环境控制，以及与底层基础设施相关的其他方面。","s":"源#99"},{"id":"D2-101","d":2,"t":"single","q":"哪个选项是 AWS Cloud Adoption Framework (AWS CAF) 平台视角的能力？","o":[{"l":"A","t":"数据架构"},{"l":"B","t":"数据保护"},{"l":"C","t":"数据治理"},{"l":"D","t":"数据科学"}],"a":["A"],"e":"正确答案：A. 数据架构解析：AWS 云采纳框架（AWS CAF） 是一个全面的框架，旨在帮助组织迁移到云端。它提供了跨六个视角的最佳实践和指导：业务（Business）、人员（People）、治理（Governance）、平台（Platform）、安全（Security）和运营（Operations）。平台视角：平台视角专注于云迁移所需的基础架构和云原生服务。其技术能力包括：\n- 数据架构：在云中构建、管理和优化数据。\n- 云基础架构设计。\n- 应用程序架构。为什么其他选项不正确：\n- B. 数据保护：属于安全视角（Security Perspective），涉及保护数据安全和确保合规性。\n- C. 数据治理：与**治理视角（Governance Perspective）** 相关，主要处理管理云采纳的政策、流程和控制。\n- D. 数据科学：不属于 AWS CAF 的任何视角，而是专注于分析和建模数据的一个专业领域。因此，A. 数据架构是正确答案，因为它与 AWS CAF 的平台视角一致。","s":"源#101"},{"id":"D2-104","d":2,"t":"single","q":"哪个 AWS 工具允许用户规划其服务使用、服务成本和实例预留，并且还允许他们设置自定义警报，当他们的成本或使用超过设定的阈值时？","o":[{"l":"A","t":"成本探索器"},{"l":"B","t":"AWS 预算"},{"l":"C","t":"AWS 成本和使用情况报告"},{"l":"D","t":"预留实例报告"}],"a":["B"],"e":"允许用户规划其服务使用、设置自定义成本和使用预算，并在成本或使用超过预定义阈值时接收警报的 AWS 工具是AWS 预算（选项 B）。这个工具帮助组织主动管理和控制他们的 AWS 支出。","s":"源#104"},{"id":"D2-105","d":2,"t":"multiple","q":"根据 AWS 共享责任模型，以下哪两项任务是客户的职责？","o":[{"l":"A","t":"建立全球基础设施"},{"l":"B","t":"执行客户端数据加密"},{"l":"C","t":"配置 IAM 凭证"},{"l":"D","t":"保护边缘位置的安全"},{"l":"E","t":"修补 Amazon RDS 数据库实例"}],"a":["B","C"],"e":"根据 AWS 共享责任模型，客户的职责包括执行客户端数据加密（选项 B），以确保数据在传输过程中的安全，以及配置IAM凭证（选项 C）以管理对 AWS 资源的访问。","s":"源#105"},{"id":"D2-106","d":2,"t":"multiple","q":"一位开发人员被一家大公司雇佣，需要 AWS 凭证。应该遵循哪些安全最佳实践？（选择两项。）","o":[{"l":"A","t":"仅授予开发人员访问 AWS 资源的权限，以执行工作。"},{"l":"B","t":"与开发人员共享 AWS 帐户根用户凭证。"},{"l":"C","t":"将开发人员添加到 AWS IAM 的管理员组。"},{"l":"D","t":"配置密码策略，确保开发人员的密码不能更改。"}
