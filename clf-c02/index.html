<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>学习材料</title>
<style>
/* ===== 页面结构：首页目录 + 章级分页 SPA（非单一长页） ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;font-size:17px;line-height:1.7}
.wrap{max-width:1200px;margin:0 auto;padding:24px 28px 60px}
@media(max-width:768px){.wrap{padding:16px 14px 48px}}

/* ===== 首页 ===== */
.hdr{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:12px;padding:30px 32px 26px;margin-bottom:18px}
.hdr-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:3px 12px;border-radius:20px;margin-bottom:10px}
.hdr h1{font-size:24px;font-weight:800;line-height:1.4}
.hdr-sub{font-size:13px;opacity:.9;margin-top:8px}
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.ov-item{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.ov-num{font-size:28px;font-weight:800;color:#4f46e5;line-height:1.2}
.ov-lbl{font-size:12px;color:#64748b;margin-top:4px}
@media(max-width:768px){.ov{grid-template-columns:repeat(2,1fr)}}

.card-s{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.cs-title{font-size:18px;font-weight:700;color:#374151;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}

/* 章节目录卡 */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ch-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 16px;cursor:pointer;transition:.2s;margin-bottom:0}
.ch-card:hover{border-color:#7c3aed;transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,70,229,.12)}
.ch-card.done{border-color:#16a34a}
.cc-num{font-size:11px;font-weight:700;margin-bottom:3px}
.cc-title{font-size:15px;font-weight:700;color:#1e293b;margin-bottom:6px}
.cc-meta{font-size:13px;color:#64748b}
.cc-prog{margin-top:8px}
.pm{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:3px}
.pbar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .4s}

/* 考试速览 */
.exam-quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.eq-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 10px;text-align:center}
.eq-num{font-size:20px;font-weight:800;color:#4f46e5;line-height:1.2}
.eq-sub{font-size:10.5px;color:#64748b;margin-top:2px}
.eq-lbl{font-size:11px;color:#64748b;margin-top:5px}
.exam-two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:10px}
@media(max-width:768px){.exam-two-col{grid-template-columns:1fr}}
.exam-sub-t{font-size:14px;font-weight:700;color:#374151;margin:4px 0 10px}
.exam-domain-tbl{width:100%;border-collapse:collapse;font-size:15px}
.exam-domain-tbl th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;padding:9px 12px;text-align:left;font-weight:700}
.exam-domain-tbl td{padding:9px 12px;border-bottom:1px solid #e9d5ff;vertical-align:middle}
.exam-domain-tbl tr:nth-child(even) td{background:#faf5ff}
.domain-chip{display:inline-block;border-radius:20px;padding:2px 11px;font-size:12px;font-weight:700;background:#ede9fe;color:#5b21b6;cursor:pointer;border:none;transition:.15s}
.domain-chip:hover{background:#ddd6fe}
.exam-info-list{font-size:15px;color:#374151;margin:0 0 12px 18px}
.exam-info-list li{margin-bottom:6px;line-height:1.7}
.exam-steps{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px;font-size:14px}
.step-block{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;padding:9px 12px;font-size:13px;color:#4338ca;flex:1 1 150px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.step-block b{display:block;font-size:13px}
.step-block span{display:block;font-size:11.5px;color:#6d28d9;margin-top:3px}
.step-arrow{color:#a78bfa;font-weight:700;font-size:16px;padding:0 4px;flex:0 0 auto;align-self:center}
details.exam-faq{margin-top:12px;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;background:#f8fafc}
details.exam-faq summary{font-size:14px;font-weight:700;color:#374151;cursor:pointer}
details.exam-faq p{margin:9px 0 0;font-size:14px;color:#475569;line-height:1.75}

/* 14 天计划 */
.ptbl{width:100%;border-collapse:collapse;font-size:15px}
.ptbl th{background:#f8fafc;padding:11px 12px;text-align:left;font-weight:600;color:#374151;border-bottom:2px solid #e2e8f0;font-size:14px}
.ptbl td{padding:10px 12px;border-bottom:1px solid #f8fafc;vertical-align:middle}
.ptbl tr:last-child td{border-bottom:none}
.day{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.chip-p{background:#ede9fe;color:#5b21b6}.chip-p:hover{background:#ddd6fe}
.focus{font-size:12px;color:#64748b}

/* ===== 章面板 ===== */
.ch-topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);padding:8px 18px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px}
.back-btn{background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:13px;font-weight:600;border-radius:8px;padding:5px 14px;cursor:pointer;white-space:nowrap;transition:.15s}
.back-btn:hover{background:#ede9fe}
.tn-title{font-size:15px;font-weight:700;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-hdr{color:#fff;padding:20px 22px 16px;border-radius:12px 12px 0 0;margin-bottom:0}
.ch-badge{font-size:13px;font-weight:700;opacity:.9;margin-bottom:5px;display:block}
.ch-title{font-size:22px;font-weight:800}
.panel{margin-bottom:14px}
.task-list{padding-left:22px;font-size:16px;color:#374151;line-height:2.0}
.task-list li::marker{color:#a78bfa}
.task-list a{color:#374151;text-decoration:none}
.task-list a:hover{color:#4f46e5}
.tl-id{display:inline-block;min-width:38px;font-weight:700;color:#4f46e5;margin-right:6px}
.panel-hr{border:none;border-top:1px solid #e2e8f0;margin:14px 0}

/* ===== 正文排版（规范 B） ===== */
.mdbody .sec-block h2.mh2{font-size:19px;font-weight:700;color:#4f46e5;margin:4px 0 12px;padding:10px 0 8px;border-top:1px solid #e2e8f0}
.mdbody p{font-size:17px;color:#374151;margin-bottom:14px;line-height:1.9}
.mdbody ul,.mdbody ol{font-size:17px;color:#374151;padding-left:24px;margin-bottom:12px}
.mdbody li{margin-bottom:8px;line-height:1.9}
.mdbody blockquote{border-left:3px solid #a78bfa;padding:10px 16px;background:#f5f3ff;font-size:15px;color:#5b21b6;margin:0 0 14px;border-radius:0 6px 6px 0;line-height:1.8}
.mdbody code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.mdbody h4.sec-h{font-size:17px;font-weight:600;color:#374151;margin:24px 0 10px;padding-left:12px;border-left:3px solid #a78bfa;line-height:1.4}
.mdbody .case-card,.mdbody .mem-card{border-radius:10px;padding:13px 16px;margin-bottom:14px}
.mdbody .case-card{background:#fff8e6;border:1px solid #ecd9a0}
.mdbody .mem-card{background:#eef3ff;border:1px solid #b9c9f7}
.mdbody .case-card h4.sec-h,.mdbody .mem-card h4.sec-h{border-left:none;padding-left:0;margin:0 0 8px;font-size:14px;font-weight:700}
.mdbody .case-card h4.sec-h{color:#9a7b1e}
.mdbody .mem-card h4.sec-h{color:#4361ee}
.mdbody .case-card p,.mdbody .mem-card p{font-size:15px}
.mdbody .case-card ul,.mdbody .mem-card ul{margin-bottom:0;font-size:15px}
/* 表格（规范 C） */
.tbl-wrap{overflow-x:auto;margin:0 0 14px;border:1px solid #e9d5ff;border-radius:10px}
.tbl-wrap table{min-width:480px}
table{border-collapse:collapse;width:100%;font-size:16px}
.mdbody th,.mdbody td{padding:11px 16px;text-align:left;border-bottom:1px solid #e9d5ff;vertical-align:top;line-height:1.6}
.mdbody thead th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;font-weight:700;font-size:15px;white-space:nowrap}
.mdbody tbody tr:nth-child(even) td{background:#faf5ff}
.mdbody tbody tr:last-child td{border-bottom:none}
/* 图块（v2.1 图文同流） */
.fig-block{background:#f8f7ff;border:1px solid #ddd6fe;border-radius:12px;padding:14px 16px;margin:0 0 14px}
.fig-title{font-size:13px;font-weight:700;color:#4f46e5;text-align:center;margin-bottom:10px}
.fig-body{overflow-x:auto}
.fig-body svg{display:block;margin:0 auto;height:auto}
.fig-caption{font-size:12px;color:#6b7280;text-align:center;margin-top:10px;font-style:italic}
/* 手绘图 CSS 类（兼容） */
.compare-tbl{width:100%;border-collapse:collapse;font-size:13px}
.compare-tbl th{padding:9px 12px;font-weight:700;font-size:12px;text-align:center}
.compare-tbl td{padding:8px 12px;border:1px solid #e2e8f0;font-size:13px;vertical-align:top;line-height:1.5}
.compare-tbl tr:nth-child(even) td{background:#faf9ff}
.flow-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.flow-node{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;text-align:center;min-width:80px}
.flow-node.light{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#4338ca}
.flow-node.green{background:linear-gradient(135deg,#06d6a0,#059669);color:#fff}
.flow-arrow{color:#a78bfa;font-size:18px;font-weight:700;flex-shrink:0}
.cycle-wrap{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.cycle-step{display:flex;flex-direction:column;align-items:center;gap:4px}
.cycle-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.cycle-label{font-size:11px;color:#374151;text-align:center;max-width:70px;line-height:1.3}
.cycle-arrow{color:#a78bfa;font-size:16px;align-self:flex-start;margin-top:6px}
.stair-wrap{display:flex;align-items:flex-end;gap:8px;padding:8px 0;justify-content:center;flex-wrap:wrap}
.stair-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.stair-bar{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:6px 6px 0 0;width:80px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;padding:4px}
.stair-label{font-size:11px;color:#374151;text-align:center;max-width:80px;line-height:1.3}

/* 域尾提示卡 */
.tips-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tips-card .tc-title{font-size:15px;font-weight:700;margin-bottom:10px;color:#374151}
.tips-card table{font-size:14px}
.tips-card th{padding:9px 12px;font-size:13px}
.tips-card td{padding:9px 12px;font-size:14px;line-height:1.6}

/* ===== 章末练习 quiz-box（模块 10） ===== */
.quiz-box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:18px 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);scroll-margin-top:78px}
.quiz-hdr{display:flex;align-items:baseline;gap:14px;font-size:18px;font-weight:700;color:#374151;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}
.quiz-score{font-size:14px;font-weight:700;color:#4f46e5;margin-left:auto;white-space:nowrap}
.qi{border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.qi.done{background:#fafafa}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qbadge{background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:700}
.qtype{font-size:11px;border-radius:12px;padding:1px 9px;font-weight:600}
.qtype-s{background:#e0f2fe;color:#0369a1}
.qtype-m{background:#fce7f3;color:#be185d}
.qstem{font-size:16px;color:#1e293b;margin-bottom:10px;line-height:1.8}
.qstem code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{background:#fff;border:1.5px solid #e2e8f0;border-radius:9px;padding:11px 14px;font-size:15.5px;color:#374151;cursor:pointer;transition:.15s;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:#a78bfa}
.opt .ol{font-weight:700;color:#4f46e5;flex-shrink:0}
.opt.sel{border-color:#4f46e5;background:#ede9fe}
.opt.cor{border-color:#16a34a;background:#dcfce7}
.opt.wrg{border-color:#dc2626;background:#fee2e2}
.opt.shc{border-color:#16a34a;background:#f0fdf4}
.qi.done .opt{cursor:default;pointer-events:none}
.qrow{margin-top:10px;display:flex;align-items:center;gap:12px}
.qbtn{background:#4f46e5;color:#fff;font-size:12px;font-weight:600;border:none;border-radius:7px;padding:7px 18px;cursor:pointer;transition:.15s}
.qbtn:hover{background:#4338ca}
.qbtn:disabled{background:#cbd5e1;cursor:default}
.qres{display:none;flex:1;border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.7}
.qres.ok{background:#dcfce7;color:#15803d}
.qres.err{background:#fee2e2;color:#b91c1c}
.qres.na{background:#fef3c7;color:#b45309}
.qres.show{display:block}
.score-box{display:none;text-align:center;background:#f5f3ff;border-radius:10px;padding:22px 16px;margin-top:16px}
.score-box.show{display:block}
.score-num{font-size:32px;font-weight:700;color:#4f46e5;line-height:1.3}
.score-lbl{font-size:13px;color:#6d28d9;margin-top:4px}
.score-box .sb-tip{font-size:12px;color:#64748b;margin-top:8px;line-height:1.7}

.footer{margin-top:26px;padding:18px 10px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:12.5px;text-align:center;line-height:1.9}
.footer a{color:#4f46e5;text-decoration:none}
@media(max-width:768px){.ptbl th,.ptbl td{font-size:13px}.mdbody th,.mdbody td{font-size:13px}}

/* ===== 章面板 v6 布局：左侧常驻目录槽 + 正文列 =====
   三条布局约定：① 正文 #### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点，见下方 .mh3）
   ② 左侧目录两级（节 ▸ 知识点，单开手风琴 + 滚动自动跟读）③ 左右两侧任何分辨率留白，目录常驻不遮正文：
   ≥1200px：.panel 栅格 [236px 目录槽 | 正文列]，目录 sticky 常驻；<1200px：目录槽变左侧抽屉（☰+遮罩）。 */
body.chapView .wrap{max-width:1420px}
.panel{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start;margin-bottom:14px}
.ch-side{position:sticky;top:14px;min-width:0;z-index:30}
.side-close{display:none}
.toc-open-btn{display:none}
.side-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:85;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.side-mask.show{opacity:1;visibility:visible}
.ch-toc{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 6px 24px rgba(15,23,42,.06);overflow:hidden}
.ch-toc .toc-hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;border-bottom:1px solid #f1f5f9}
.ch-toc .th-title{font-size:13px;font-weight:800;color:#4f46e5;white-space:nowrap}
.ch-toc .th-meta{font-size:11px;color:#94a3b8;font-weight:600;white-space:nowrap}
.ch-toc .toc-body{max-height:calc(100vh - 46px);overflow-y:auto;padding:8px}
.toc-list{list-style:none;margin:0;padding:0}
.toc-list a{display:flex;align-items:baseline;gap:6px;padding:5px 6px;border-radius:7px;color:#475569;text-decoration:none;line-height:1.45;font-size:13px;transition:.12s}
.toc-list a:hover{background:#f5f3ff;color:#4f46e5}
.toc-list a.act{background:#ede9fe;color:#3730a3;font-weight:600}
.toc-list .tl-id{font-size:11.5px;font-weight:700;color:#a78bfa;flex-shrink:0;font-variant-numeric:tabular-nums}
.toc-list a.act .tl-id{color:#4f46e5}
.toc-t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toc-sec>a.toc-sec-link{font-weight:600;color:#334155;padding-top:6px;padding-bottom:6px}
.toc-sec>a .toc-ar{margin-left:auto;flex-shrink:0;font-size:9px;color:#94a3b8;transition:transform .18s}
.toc-sec.open>a .toc-ar{transform:rotate(90deg);color:#4f46e5}
.toc-sub{list-style:none;margin:0;padding:0 0 3px;display:none}
.toc-sec.open>.toc-sub{display:block}
.toc-sub a{padding:3px 6px 3px 20px;font-size:12.5px;color:#64748b;line-height:1.4}
.toc-sub a .tl-id{font-size:11px;color:#c4b5fd}
/* 目录尾【本章练习】入口（v6.2 新增）：独立条目，虚线分隔，点击滚到章末练习区 #quiz-dX */
.toc-quiz{margin-top:7px;padding-top:3px;border-top:1px dashed #ddd6fe}
.toc-quiz>a.toc-quiz-link{font-weight:700;color:#6d28d9;padding-top:6px;padding-bottom:6px}
.toc-quiz>a .tl-id{color:#a78bfa}
.toc-quiz>a.act .tl-id{color:#6d28d9}
@media(max-width:1199px){
  .panel{display:block}
  .ch-side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:90;background:#fff;border-right:1px solid #e2e8f0;box-shadow:0 0 44px rgba(15,23,42,.18);transform:translateX(-102%);transition:transform .22s ease;padding:10px;overflow-y:auto}
  .ch-side.open{transform:none}
  .ch-side .ch-toc{border:none;box-shadow:none;border-radius:0}
  .ch-toc .toc-body{max-height:none;padding-right:4px}
  .toc-open-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:12.5px;font-weight:600;border-radius:8px;padding:4px 10px;cursor:pointer;transition:.15s;white-space:nowrap}
  .toc-open-btn:hover{background:#ede9fe}
  .side-close{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:none;background:#f1f5f9;color:#64748b;border-radius:7px;font-size:12px;cursor:pointer;font-weight:700;flex-shrink:0}
  .side-close:hover{background:#e2e8f0;color:#1e293b}
}
/* 阅读进度（吸顶条底部细线 + 百分比）：v6 新增
   注意：此处不再声明 position，78 行的 .ch-topnav{position:sticky;top:0} 保持生效——
   早前版本曾误加 position:relative 覆盖导致吸顶丢失（窄屏换章节要滚回顶），v6.1 已修复 */
.ch-topnav{overflow:hidden}

x;color:var(--primary)}#quizView .glossary-item{padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;line-height:1.6}#quizView .glossary-item:last-child{border:none;padding-bottom:0}#quizView .glossary-term{font-weight:600;color:var(--text)}#quizView .glossary-def{color:var(--text2)}#quizView .explanation.show{display:block}#quizView .explanation .result-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-weight:600;font-size:14px;margin-bottom:10px}#quizView .explanation .result-badge.correct{background:rgba(6,214,160,.15);color:var(--correct)}#quizView .explanation .result-badge.wrong{background:rgba(239,71,111,.15);color:var(--wrong)}#quizView .explanation .exp-text{font-size:14px;line-height:1.7;color:var(--text2)}#quizView .explanation .exp-source{font-size:12px;color:var(--text2);margin-top:8px;font-style:italic}#quizView .qnav{background:var(--card);border-radius:12px;padding:12px;border:1px solid var(--border);margin-top:12px}#quizView .qnav h4{font-size:13px;color:var(--text2);margin-bottom:8px}#quizView .qnav-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}#quizView .qnav-item{aspect-ratio:1;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;transition:.2s;background:var(--bg)}#quizView .qnav-item:hover{border-color:var(--primary)}#quizView .qnav-item.done-correct{background:var(--correct);color:#fff;border-color:var(--correct)}#quizView .qnav-item.done-wrong{background:var(--wrong);color:#fff;border-color:var(--wrong)}#quizView .qnav-item.current{border-color:var(--primary);border-width:2px;font-weight:700}#quizView .wrong-stats{display:flex;gap:12px;margin-bottom:16px}#quizView .wrong-stats .stat-card{flex:1}#quizView .wrong-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}#quizView .wrong-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:13px;cursor:pointer}#quizView .wrong-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}#quizView .wrong-item{padding:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px}#quizView .wrong-item .wi-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}#quizView .wrong-item .wi-domain{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--border)}#quizView .wrong-item .wi-actions{display:flex;gap:8px;margin-top:8px}#quizView .wrong-item .wi-actions button{font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--text)}#quizView .wrong-item .wi-actions button:hover{background:var(--border)}#quizView .stats-chart{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}#quizView .stats-chart h3{font-size:14px;margin-bottom:12px}#quizView canvas{width:100%!important;height:200px!important;border-radius:8px}#quizView .stats-table{width:100%;border-collapse:collapse;font-size:13px}#quizView .stats-table th, #quizView .stats-table td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--border)}#quizView .stats-table th{color:var(--text2);font-weight:500}#quizView .settings-section{margin-bottom:20px}#quizView .settings-section h3{font-size:15px;margin-bottom:12px;color:var(--text2)}#quizView .setting-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;cursor:pointer;width:100%;font-size:14px;color:var(--text);margin-bottom:8px;transition:.2s}#quizView .setting-btn:hover{border-color:var(--primary)}#quizView .setting-btn.danger{color:var(--wrong)}#quizView .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:.3s}#quizVi loudFront - CDN 内容分发网络。全球边缘节点加速静态与动态内容分发。","Amazon Route 53":"Amazon Route 53 - DNS 域名解析服务。可路由流量至 AWS 内外资源，含健康检查与故障转移。","AWS Direct Connect":"AWS Direct Connect - 专线。通过专用网络连接本地数据中心与 AWS，替代公网。","AWS Global Accelerator":"AWS Global Accelerator - 全球加速。利用 AWS 骨干网改善应用访问性能与可用性。","Amazon API Gateway":"Amazon API Gateway - 托管 API 网关。创建/发布/维护 REST 与 WebSocket API。","AWS Site-to-Site VPN":"AWS Site-to-Site VPN - 站点到站点 VPN。通过加密隧道连接本地网络与 Amazon VPC。","弹性负载均衡":"Elastic Load Balancing (ELB) - 负载均衡。自动将流量分发到多个目标（EC2/容器/IP）并检查健康状态。","ELB":"Elastic Load Balancing (ELB) - 负载均衡。自动将流量分发到多个目标（EC2/容器/IP）并检查健康状态。","AWS IAM":"AWS IAM - 身份和访问管理（Identity and Access Management）。管理用户/组/角色与权限策略，控制 AWS 资源访问。","IAM 角色":"AWS IAM Role - IAM 角色。授予实体临时访问权限的身份，常用于 EC2/Lambda 等获取资源访问权。","AWS KMS":"AWS KMS - 密钥管理服务（Key Management Service）。创建和管理加密密钥（CMK），用于数据加密。","AWS WAF":"AWS WAF - Web 应用防火墙。过滤和监控 HTTP(S) 流量，防 SQL 注入/跨站脚本等。","AWS Shield":"AWS Shield - DDoS 防护服务。Standard 免费常驻防护，Advanced 提供增强防护与支持。","Amazon GuardDuty":"Amazon GuardDuty - 威胁检测服务。用 ML 持续监控账户/工作负载/数据中的恶意活动。","AWS CloudTrail":"AWS CloudTrail - 审计日志服务。记录账户内 API 调用与操作事件，供审计与追踪。","AWS Config":"AWS Config - 配置审计与合规服务。持续评估资源配置是否符合规则。","Amazon Inspector":"Amazon Inspector - 漏洞扫描。自动评估工作负载暴露面与安全漏洞。","AWS Organizations":"AWS Organizations - 组织管理。集中管理多个 AWS 账户、整合账单、应用 SCP 策略。","AWS Artifact":"AWS Artifact - 合规报告自助门户。获取 SOC/ISO/PCI 等合规报告与协议。","AWS Trusted Advisor（可信顾问）":"AWS Trusted Advisor（可信顾问）- 最佳实践检查。从成本优化/性能/安全/容错/服务限额五类给出建议。","AWS Secrets Manager":"AWS Secrets Manager - 密钥托管服务。管理数据库凭证/API 密钥等机密并自动轮换。","多因素认证":"Multi-Factor Authentication (MFA) - 多因素认证。除密码外要求第二因素（如验证码/硬件密钥）验证身份。","MFA":"Multi-Factor Authentication (MFA) - 多因素认证。除密码外要求第二因素（如验证码/硬件密钥）验证身份。","Amazon CloudWatch":"Amazon CloudWatch - 监控与可观测服务。收集指标/日志/告警，监控 AWS 资源与应用。","Amazon CloudWatch 警报":"Amazon CloudWatch Alarms - CloudWatch 告警。指标超过阈值时触发通知或自动动作。","AWS CloudFormation":"AWS CloudFormation - 基础设施即代码（IaC）。用模板以声明式方式创建和管理资源栈。","AWS Systems Manager":"AWS Systems Manager - 运维管理服务。集中管理 EC2 与本地服务器（补丁/会话/参数等）。","AWS 管理控制台":"AWS Management Console - AWS 管理控制台。基于 Web 的界面，用于创建与管理 AWS 资源。","AWS Cost Explorer":"AWS Cost Explorer - 成本探索。可视化分析历史与预测成本与用量。","AWS Budgets":"AWS Budgets - 预算服务。设置预算并在超支时发送告警。","AWS Pricing Calculator":"AWS Pricing Calculator - 定价计算器。预估 AWS 工作负载的成本。","AWS 账单与成本管理":"AWS Billing and Cost Management - 账单与成本管理。查看账单/成本分配标签/整合账单等。","AWS Marketplace":"AWS Marketplace - 数字软件目录。购买/订阅第三方软件与数据产品（自带许可或订阅计费）。","Amazon SageMaker":"Amazon SageMaker - ML 全生命周期平台。数据准备、训练、调优、部署一体化。","Amazon Athena":"Amazon Athena - 无服务器查询服务。直接用 SQL 查询 S3 中的数据。","Amazon QuickSight":"Amazon QuickSight - 商业智能（BI）可视化服务。","Amazon Polly":"Amazon Polly - 文本转语音（TTS）服务。","Amazon Transcribe":"Amazon Transcribe - 语音转文字（ASR）服务。","Amazon Translate":"Amazon Translate - 机器翻译服务。","Amazon Rekognition":"Amazon Rekognition - 图像/视频分析服务（人脸/物体/内容审核等）。","Amazon Comprehend":"Amazon Comprehend - NLP 文本分析服务（情感/实体/关键短语等）。","Amazon Textract":"Amazon Textract - 文档 OCR 服务。从扫描件/PDF 提取文本、表格、表单。","Amazon Lex":"Amazon Lex - 对话式 AI（聊天机器人）服务，支持语音与文本。","共享责任模型":"Shared Responsibility Model - 共享责任模型。AWS 负责云的安全（基础设施），客户负责云中的安全（数据/配置/访问）。","良好构建框架":"AWS Well-Architected Framework - 良好构建框架。六大支柱：卓越运营/安全性/可靠性/性能效率/成本优化/可持续性。","云采用框架":"AWS Cloud Adoption Framework (CAF) - 云采用框架。指导组织上云转型的六方面能力框架。","AWS CAF":"AWS Cloud Adoption Framework (CAF) - 云采用框架。","按需计费":"On-Demand - 按需计费。按实际用量付费，无预付与长期承诺，灵活但单价较高。","按需实例":"On-Demand Instance - 按需实例。按秒/小时计费、随开随停的 EC2 实例，无长期承诺。","预留实例":"Reserved Instance (RI) - 预留实例。承诺 1-3 年使用换取折扣（标准/可转换），适合稳定负载。","Savings Plans":"Savings Plans - 节省计划。承诺每小时固定用量（1/3 年）换取更低单价，覆盖 EC2/Lambda/Fargate。","竞价实例":"Spot Instance - 竞价实例。用闲置容量、价格折扣大，但可能被回收，适合可中断/容错工作负载。","可用区":"Availability Zone (AZ) - 可用区。区域内独立的可用设施，用于高可用部署。","AWS 区域":"AWS Region - 区域。AWS 全球的物理地域，每个区域含多个可用区。"}};
const QUIZ_QUESTIONS = [{"id":"D1-006","d":1,"t":"single","q":"以下哪种观点包括 AWS 云采用框架（AWS CAF）的基础能力？","o":[{"l":"A","t":"可持续性"},{"l":"B","t":"性能效率"},{"l":"C","t":"治理"},{"l":"D","t":"可靠性"}],"a":["C"],"e":"**✅ 为什么 C.治理 对**：AWS CAF 的基础能力（Foundation capabilities）归属于治理（Governance）视角，负责建立云治理机制、统筹各视角协同并确保云投资与业务目标一致，正符合题干「CAF 基础能力」的定位。\n\n**❌ 为什么其他选项错**：\n- A.可持续性：可持续性是 Well-Architected Framework 六大支柱之一，不属于 CAF 视角\n- B.性能效率：性能效率同为 Well-Architected 支柱，与 CAF 视角无关\n- D.可靠性：可靠性也是 Well-Architected 支柱，不是 CAF 的视角名称\n\n**📌 关键概念**：CAF 六大视角 = 业务、人员、治理、平台、安全、运营；治理视角承担云治理与基础能力，而 Well-Architected 六支柱是架构质量维度，两套框架各管一摊不混用。","s":"源#6"},{"id":"D1-015","d":1,"t":"single","q":"一家全球性公司想要将其第三方应用程序迁移到 AWS 云。公司希望得到一个全球专家团队的帮助，以更快、更可靠地完成迁移，并符合 AWS 内部最佳实践。哪个 AWS 服务或资源将满足这些要求？","o":[{"l":"A","t":"AWS 支持"},{"l":"B","t":"AWS 专业服务"},{"l":"C","t":"AWS 发射向导"},{"l":"D","t":"AWS 托管服务（AMS）"}],"a":["B"],"e":"**✅ 为什么 B.AWS 专业服务 对**：AWS Professional Services（专业服务）是一支全球顾问专家团队，可直接参与迁移项目的规划、执行与优化，确保迁移更快、更可靠并符合 AWS 内部最佳实践，正符合题干「全球专家团队帮助迁移第三方应用」的要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS 支持：提供技术工单与协助响应，不派出专家团队实施迁移项目\n- C.AWS 发射向导（Launch Wizard）：是引导式部署 EC2 等资源的工具，不提供人工专家帮助\n- D.AWS 托管服务（AMS）：负责云上工作负载的持续运营管理，不是迁移实施的顾问团队\n\n**📌 关键概念**：ProServe 定位「帮你做」（迁移与转型咨询实施）、AMS 定位「替你管」（云上运营托管）、AWS Support 定位「答疑支持」，按人力介入深度与场景区分。","s":"源#15"},{"id":"D1-022","d":1,"t":"single","q":"哪个选项是 AWS 全球基础设施的物理位置？","o":[{"l":"A","t":"AWS 数据同步"},{"l":"B","t":"AWS 区域"},{"l":"C","t":"Amazon Connect"},{"l":"D","t":"AWS 组织"}],"a":["B"],"e":"**✅ 为什么 B.AWS 区域 对**：AWS 区域（Region）是 AWS 全球基础设施的物理位置，每个区域坐落在特定地理区域内，由多个相互隔离的可用区（各含一个或多个数据中心）组成，正符合「物理位置」的定义。\n\n**❌ 为什么其他选项错**：\n- A.AWS 数据同步：DataSync 是本地与 AWS 之间的数据传输服务，不是基础设施位置概念\n- C.Amazon Connect：云联络中心（云呼叫中心）服务，与基础设施位置无关\n- D.AWS 组织：Organizations 是多账户统一管理与治理的账户管理工具，属于管理层概念\n\n**📌 关键概念**：AWS 全球基础设施层级 = 区域（地理概念、含多个可用区）→ 可用区（独立的数据中心集群）→ 边缘站点（CloudFront 缓存分发）；只有区域对应「地理上的物理位置」。","s":"源#22"},{"id":"D1-025","d":1,"t":"single","q":"一家公司正在运行一个单一的本地应用程序，该应用程序无法扩展且难以维护。该公司计划将应用程序迁移到 AWS 并将其拆分为微服务。该公司遵循 AWS 良好架构框架的哪个最佳实践？","o":[{"l":"A","t":"将功能测试作为 AWS 部署的一部分。"},{"l":"B","t":"使用自动化部署更改。"},{"l":"C","t":"将应用程序部署到多个位置。"},{"l":"D","t":"实现松散耦合的依赖关系。"}],"a":["D"],"e":"**✅ 为什么 D.实现松散耦合的依赖关系。 对**：将单体应用拆分为微服务的本质就是让组件之间松耦合——各服务独立开发、独立部署、独立扩展，故障彼此隔离，这正是 Well-Architected 推荐的解耦设计实践，与公司「拆分微服务」的计划完全一致。\n\n**❌ 为什么其他选项错**：\n- A.将功能测试作为 AWS 部署的一部分。：测试是质量保障实践，不解决单体紧耦合的架构问题\n- B.使用自动化部署更改。：部署自动化提升交付效率，与应用架构解耦无直接关系\n- C.将应用程序部署到多个位置。：多位置部署提升可用性容错，但不改变单体的紧耦合结构\n\n**📌 关键概念**：微服务化 = 拆分（单体分解为小服务）+ 松耦合（服务间经 API 交互、故障隔离、独立演进）；紧耦合单体正是难扩展、难维护的根源。","s":"源#25"},{"id":"D1-030","d":1,"t":"multiple","q":"以下哪项是 AWS 良好架构框架的支柱？（选择两项。）","o":[{"l":"A","t":"可用性"},{"l":"B","t":"可靠性"},{"l":"C","t":"可扩展性"},{"l":"D","t":"响应式设计"},{"l":"E","t":"运营卓越"}],"a":["B","E"],"e":"**✅ 为什么 B、E 对**：\n- B.可靠性：Reliability 是六大支柱之一，关注系统从故障中恢复并动态获取计算资源的能力\n- E.运营卓越：Operational Excellence 同为支柱，关注运维流程自动化与持续改进\n\n**❌ 为什么其他选项错**：\n- A.可用性：可用性是架构目标与衡量指标，不单独构成框架支柱\n- C.可扩展性：可扩展性是资源伸缩能力属性，不是支柱名称\n- D.响应式设计：响应式设计是前端界面适配概念，与云架构框架无关\n\n**📌 关键概念**：Well-Architected 六大支柱 = 运营卓越、安全、可靠性、性能效率、成本优化、可持续性；可用性与可扩展性是设计目标，靠各支柱的实践来达成。","s":"源#30"},{"id":"D1-034","d":1,"t":"multiple","q":"在 AWS 云计算中，敏捷性的概念包括以下哪两项？","o":[{"l":"A","t":"实施 AWS 资源的速度"},{"l":"B","t":"AWS 创建新的 AWS 区域的速度"},{"l":"C","t":"快速实验的能力"},{"l":"D","t":"消除浪费的容量"},{"l":"E","t":"进入云计算的低成本"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A.实施 AWS 资源的速度：分钟级供应资源是敏捷性的直接体现，想法到落地的间隔大幅缩短\n- C.快速实验的能力：低成本快速搭建与销毁环境，支持频繁试错、快速迭代创新\n\n**❌ 为什么其他选项错**：\n- B.AWS 创建新的 AWS 区域的速度：区域扩建是 AWS 侧的基础设施投入节奏，不是用户获得的敏捷性\n- D.消除浪费的容量：弹性伸缩消除闲置容量，属于成本优化维度的效益\n- E.进入云计算的低成本：前期投入低是成本优势，不属于敏捷性概念\n\n**📌 关键概念**：敏捷性 = 实施速度（资源分钟级可用）+ 实验能力（快速试错迭代）；注意与成本优势（规模经济、消除浪费容量）、基础设施扩张（AWS 建区域）区分。","s":"源#34"},{"id":"D1-038","d":1,"t":"single","q":"一家电子商务公司已将其 IT 基础设施从本地数据中心迁移到 AWS 云。哪项成本是公司的直接责任？","o":[{"l":"A","t":"应用程序软件许可证的成本"},{"l":"B","t":"AWS 上的硬件基础设施成本"},{"l":"C","t":"AWS 服务器的电力成本"},{"l":"D","t":"AWS 数据中心的物理安全成本"}],"a":["A"],"e":"**✅ 为什么 A.应用程序软件许可证的成本 对**：按共享责任模型，客户负责「云中」的一切（应用程序、数据、运行系统与许可证），AWS 负责「云本身」（硬件、电力、物理安全），因此应用软件的许可证费用由公司直接承担。\n\n**❌ 为什么其他选项错**：\n- B.AWS 上的硬件基础设施成本：服务器与网络硬件由 AWS 采购运维，客户按用量付费而非购置硬件\n- C.AWS 服务器的电力成本：数据中心电力属于「云本身」的运营成本，由 AWS 承担\n- D.AWS 数据中心的物理安全成本：机房安保与物理防护同样是 AWS 的责任范围\n\n**📌 关键概念**：共享责任模型分界：AWS = 云的安全（硬件/电力/物理安全/虚拟化层），客户 = 云中的安全（应用/数据/系统/许可证）；控制模型越往下（SaaS）客户责任越少。","s":"源#38"},{"id":"D1-045","d":1,"t":"single","q":"哪个 AWS 云采用框架 (AWS CAF) 能力属于人员视角？","o":[{"l":"A","t":"数据架构"},{"l":"B","t":"事件管理"},{"l":"C","t":"云流利度"},{"l":"D","t":"战略合作伙伴关系"}],"a":["C"],"e":"**✅ 为什么 C.云流利度 对**：云流利度（Cloud Fluency）是 CAF 人员（People）视角的核心能力，指员工对云概念、云技术与最佳实践的掌握程度，确保组织具备有效使用云服务所需的知识与技能。\n\n**❌ 为什么其他选项错**：\n- A.数据架构：数据架构属于平台（Platform）视角的能力范畴\n- B.事件管理：事件管理属于运营（Operations）视角的能力\n- D.战略合作伙伴关系：生态协作类能力，不属于人员视角的技能培养范畴\n\n**📌 关键概念**：CAF 人员视角聚焦「人的能力」：云流利度、技能转型、领导力、文化演进；运营视角管运维流程、平台视角管技术架构，各视角能力各有归属。","s":"源#45"},{"id":"D1-050","d":1,"t":"single","q":"以下哪项是基于云计算优势的规模经济的好处？","o":[{"l":"A","t":"将可变成本转换为固定成本"},{"l":"B","t":"提高速度和敏捷性"},{"l":"C","t":"降低可变成本超过固定成本"},{"l":"D","t":"数据中心运营成本的增加"}],"a":["C"],"e":"**✅ 为什么 C.降低可变成本超过固定成本 对**：规模经济指 AWS 以海量聚合用量获得采购与运营效率，用量越大单位成本越低，并将节省传导给客户——使用云的可变成本得以降到低于自建基础设施固定成本的水平，正符合规模经济的收益描述。\n\n**❌ 为什么其他选项错**：\n- A.将可变成本转换为固定成本：云计算恰恰是把固定资本支出（CAPEX）转为可变运营支出（OPEX），方向相反\n- B.提高速度和敏捷性：这是云的敏捷性优势，与规模经济无关\n- D.数据中心运营成本的增加：规模经济带来的是单位成本下降而非上升\n\n**📌 关键概念**：规模经济 = 聚合需求→议价力与运营效率→单位成本下降→「用得越多越便宜」；与「CAPEX 转 OPEX」「敏捷提速」同列云价值主张但分属不同维度。","s":"源#50"},{"id":"D1-070","d":1,"t":"single","q":"一位网络工程师需要构建一个混合云架构，使用 AWS 直接连接将本地网络连接到AWS 云。该公司在单一 AWS 区域有几个 VPC，并预计随着时间的推移，VPC 的数量将增加到数百个。哪种AWS 服务或功能应该由工程师使用，以简化并扩展这种连接性，因为 VPC 数量增加？","o":[{"l":"A","t":"VPC 端点"},{"l":"B","t":"AWS 传输网关"},{"l":"C","t":"Amazon Route 53"},{"l":"D","t":"AWS 秘密管理器"}],"a":["B"],"e":"**✅ 为什么 B.AWS 传输网关 对**：Transit Gateway 是网络中心枢纽，可将数百个 VPC 与本地网络（经 Direct Connect 或 VPN）统一挂接成星型拓扑，一处接入、全网互通，VPC 数量增长时无需两两建立对等连接，正符合「简化并随 VPC 增加而扩展连接」的要求。\n\n**❌ 为什么其他选项错**：\n- A.VPC 端点：用于从 VPC 私有访问 S3 等 AWS 公共服务，不解决 VPC 之间及与本地网络的组网\n- C.Amazon Route 53：DNS 域名解析与路由服务，不提供网络连通能力\n- D.AWS 秘密管理器（Secrets Manager）：保管密码、密钥等凭据的服务，与网络连接无关\n\n**📌 关键概念**：大规模组网选 Transit Gateway（中心辐射型、集中路由管理）；VPC 对等连接只适合少量点对点；「数百个 VPC+混合云连接」正是 TGW 的典型场景。","s":"源#70"},{"id":"D1-071","d":1,"t":"single","q":"一家公司希望评估其运营准备情况。同时，公司希望在新产品发布之前识别和缓解任何运营风险。哪个AWS 支持计划在不收取额外费用的情况下为此类事件提供指导和支持？","o":[{"l":"A","t":"AWS 商业支持"},{"l":"B","t":"AWS 基础支持"},{"l":"C","t":"AWS 开发者支持"},{"l":"D","t":"AWS 企业支持"}],"a":["D"],"e":"**✅ 为什么 D.AWS 企业支持 对**：企业（Enterprise）支持计划配备技术客户经理（TAM）与 Concierge 服务团队，可在新产品发布前提供运营就绪评估、主动识别并缓解运营风险，这些指导包含在计划月费内、不额外收费，正符合题干要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS 商业支持：提供工单支持与最佳实践指导，但没有 TAM 与发布前运营评估等企业级服务\n- B.AWS 基础支持：免费计划，仅提供账户与计费级支持及文档资源\n- C.AWS 开发者支持：面向开发测试环境的工单支持，不含企业级主动运营指导\n\n**📌 关键概念**：支持计划阶梯 = 基础（免费）→ 开发者→ 商业→ 企业（TAM/Concierge/架构主动指导）；「发布前评估运营风险+专家主动支持」是企业计划独有场景。","s":"源#71"},{"id":"D1-073","d":1,"t":"single","q":"哪个 AWS 服务或功能可用于创建在本地工作负载和 AWS 云工作负载之间的私有连接？","o":[{"l":"A","t":"Amazon Route 53"},{"l":"B","t":"Amazon Macie"},{"l":"C","t":"AWS 直接连接"},{"l":"D","t":"AWS PrivateLink"}],"a":["C"],"e":"**✅ 为什么 C.AWS 直接连接 对**：Direct Connect 在本地网络与 AWS 之间建立专用的私有物理连接，流量不经公共互联网，提供更低、更一致可预测的网络性能，正符合「本地工作负载与 AWS 云工作负载之间的私有连接」的要求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Route 53：DNS 解析与域名注册服务，不提供数据传输链路\n- B.Amazon Macie：用机器学习发现并分类 S3 敏感数据的安全服务，与网络连接无关\n- D.AWS PrivateLink：为 VPC 私有访问 AWS 服务或应用设计，不是本地数据中心到云的专用链路\n\n**📌 关键概念**：本地↔AWS 专线连通选 Direct Connect（物理专线、私有、低延迟稳定）；PrivateLink 解决的是「不经公网私有访问服务」，两者层次与场景不同。","s":"源#73"},{"id":"D1-076","d":1,"t":"multiple","q":"以下哪些是 AWS 云的优势？（选择两项。）","o":[{"l":"A","t":"将可变成本转换为资本支出"},{"l":"B","t":"高规模经济"},{"l":"C","t":"几分钟内全球启动"},{"l":"D","t":"专注于管理硬件基础设施"},{"l":"E","t":"过度配置以确保容量"}],"a":["B","C"],"e":"**✅ 为什么 B、C 对**：\n- B.高规模经济：AWS 聚合海量需求获得议价力与运营效率，并以更低单位价格传导给客户\n- C.几分钟内全球启动：全球基础设施触手可及，分钟级即可在多区域部署资源与应用\n\n**❌ 为什么其他选项错**：\n- A.将可变成本转换为资本支出：云计算是「资本支出（CAPEX）转可变运营支出（OPEX）」，方向相反\n- D.专注于管理硬件基础设施：云将硬件管理职责转移给 AWS，客户应专注于业务应用而非硬件\n- E.过度配置以确保容量：云靠弹性伸缩按需供给，无需提前超配抢容量，过度配置正是被淘汰的做法\n\n**📌 关键概念**：AWS 六大优势：规模经济、分钟级全球部署、CAPEX 转 OPEX、无需猜测容量、速度与敏捷性、聚焦业务而非基础设施；注意「转换方向」与「容量策略」两个常见反转陷阱。","s":"源#76"},{"id":"D1-077","d":1,"t":"single","q":"AWS 云的优势之一是架构能够在最小化停机时间的情况下承受故障吗？","o":[{"l":"A","t":"敏捷性"},{"l":"B","t":"弹性"},{"l":"C","t":"可扩展性"},{"l":"D","t":"高可用性"}],"a":["D"],"e":"**✅ 为什么 D.高可用性 对**：高可用性（High Availability）指系统通过冗余架构（多可用区部署、故障转移机制）在组件故障发生时仍持续运行、最小化停机时间，正符合题干「架构能够在最小化停机时间的情况下承受故障」的描述。\n\n**❌ 为什么其他选项错**：\n- A.敏捷性：指快速供应资源与快速实验的能力，不描述抗故障能力\n- B.弹性：指资源随负载自动扩缩以恢复健康状态，侧重点是「随需伸缩」而非「最小停机持续运行」\n- C.可扩展性：指容量可增可减应对负载变化，不等于故障场景下服务不中断\n\n**📌 关键概念**：术语三连区分：高可用 = 故障不停机（冗余+故障转移）；弹性 = 随负载自动伸缩；可扩展性 = 容量可增减；「承受故障+最小停机」是高可用的标志性表述。","s":"源#77"},{"id":"D1-078","d":1,"t":"single","q":"一个开发人员需要以可重复的方式维护开发环境基础设施和生产环境基础设施。开发人员应该使用哪个AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS 地面站"},{"l":"B","t":"AWS 盾牌"},{"l":"C","t":"AWS IoT 设备防御器"},{"l":"D","t":"AWS CloudFormation"}],"a":["D"],"e":"**✅ 为什么 D.AWS CloudFormation 对**：CloudFormation 以模板（基础设施即代码）方式定义整套 AWS 资源，同一模板可在开发与生产环境重复部署，确保环境一致、配置可版本化、变更可重复，正符合「以可重复的方式维护开发与生产环境基础设施」的要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS 地面站（Ground Station）：卫星地面站服务，用于卫星数据收发，与基础设施代码化无关\n- B.AWS 盾牌（Shield）：DDoS 防护服务，不做基础设施定义与部署\n- C.AWS IoT 设备防御者（Device Defender）：IoT 设备安全审计服务，与基础设施自动化无关\n\n**📌 关键概念**：IaC 核心价值 = 一份模板多处复用（环境一致性）+ 版本控制 + 可重复部署；「可重复」是题眼，指向 CloudFormation（或 CDK）类模板化服务。","s":"源#78"},{"id":"D1-080","d":1,"t":"single","q":"哪个 AWS 服务帮助提供具有快速故障转移功能的高可用应用程序，适用于多区域和多可用区架构？","o":[{"l":"A","t":"AWS WAF"},{"l":"B","t":"AWS 全球加速器"},{"l":"C","t":"AWS 盾牌"},{"l":"D","t":"AWS 直接连接"}],"a":["B"],"e":"**✅ 为什么 B.AWS 全球加速器 对**：Global Accelerator 提供静态任播 IP，经 AWS 全球骨干网将用户流量路由到多区域、多可用区部署的健康端点，端点故障时秒级完成故障转移，正符合「快速故障转移的高可用应用+多区域多可用区架构」的要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS WAF：Web 应用防火墙，防护 SQL 注入等应用层攻击，不提供流量故障转移能力\n- C.AWS 盾牌（Shield）：DDoS 防护服务，与多区域流量调度无关\n- D.AWS 直接连接（Direct Connect）：本地到 AWS 的专用网络链路，不解决面向终端用户的全球流量路由\n\n**📌 关键概念**：面向用户的全球高可用流量调度选 Global Accelerator（静态 IP+健康检查+秒级故障转移）；Shield/WAF 管安全防护，Direct Connect 管专线接入，职责互不重叠。","s":"源#80"},{"id":"D1-093","d":1,"t":"single","q":"以下哪项是 AWS 良好架构框架的推荐设计原则？","o":[{"l":"A","t":"通过不频繁且大规模地进行基础设施更改来减少停机时间。"},{"l":"B","t":"投入时间手动配置基础设施。"},{"l":"C","t":"从操作故障中学习并改进。"},{"l":"D","t":"为集中化使用单体应用设计。"}],"a":["C"],"e":"**✅ 为什么 C.从操作故障中学习并改进。 对**：Well-Architected 框架倡导「从所有运营故障中学习、持续改进」，通过对故障的分析反哺架构与流程设计，不断提升系统韧性，正符合题干「推荐设计原则」的定位。\n\n**❌ 为什么其他选项错**：\n- A.通过不频繁且大规模地进行基础设施更改来减少停机时间。：框架恰恰建议小步快跑、频繁小批量变更以控制风险，大变更反而放大故障面\n- B.投入时间手动配置基础设施。：框架反对手工操作，推荐自动化以减少人为失误\n- D.为集中化使用单体应用设计。：框架推荐松耦合、分布式与解耦设计，而非单体集中式\n\n**📌 关键概念**：Well-Architected 运营卓越要义：自动化优先、小批量频繁变更、从故障中学习改进、松耦合分布式架构；「手动」「大变更」「单体」三个词都是反模式信号。","s":"源#93"},{"id":"D1-100","d":1,"t":"single","q":"一家公司希望使用基础设施即代码 (IaC) 自动化基础设施部署。公司希望扩展生产堆栈，以便在多个AWS 区域部署。哪家 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon CloudWatch"},{"l":"B","t":"AWS 配置"},{"l":"C","t":"AWS 可信顾问"},{"l":"D","t":"AWS CloudFormation"}],"a":["D"],"e":"**✅ 为什么 D.AWS CloudFormation 对**：CloudFormation 用 JSON/YAML 模板定义基础设施（IaC），可版本控制、可跨环境重复部署，堆栈可复制到多个区域实现生产架构的地域扩展，正符合「IaC 自动化部署+扩展到多区域」的要求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon CloudWatch：监控告警服务，观察资源运行状态，不负责部署\n- B.AWS 配置（Config）：记录资源配置合规与变更历史的审计服务，不做部署\n- C.AWS 可信顾问（Trusted Advisor）：提供成本/性能/安全优化建议的巡检工具，不执行部署\n\n**📌 关键概念**：「基础设施即代码+模板化+跨区域复制」是 CloudFormation 的标志性能力；监控（CloudWatch）、审计（Config）、巡检建议（Trusted Advisor）均属事后观测层。","s":"源#100"},{"id":"D1-114","d":1,"t":"single","q":"一家公司正在计划迁移到 AWS 云。公司正在使用 AWS 云采用框架 (CAF) 视角识别其能力差距。哪个云转型阶段包括这些识别活动？","o":[{"l":"A","t":"构想"},{"l":"B","t":"对齐"},{"l":"C","t":"扩展"},{"l":"D","t":"发布"}],"a":["B"],"e":"**✅ 为什么 B.对齐 对**：云转型四阶段（Envision 构想→Align 对齐→Launch 发布→Scale 扩展）中，对齐（Align）阶段用 CAF 视角评估现有能力、识别能力差距与跨组织依赖，并制定差距弥合计划，正符合题干「用 CAF 视角识别能力差距」的活动描述。\n\n**❌ 为什么其他选项错**：\n- A.构想：构想阶段聚焦识别转型机会、对齐业务目标与预期收益，产出转型愿景\n- C.扩展：扩展阶段是在发布验证后把云实践规模化推广至全组织\n- D.发布：发布阶段是落地首批迁移与上云工作负载，交付可见成果\n\n**📌 关键概念**：CAF 转型旅程四步：构想（为什么转/转什么）→ 对齐（能力差距评估与准备）→ 发布（首批落地）→ 扩展（规模化）；「识别能力差距」是对齐阶段的标志性动作。","s":"源#114"},{"id":"D1-127","d":1,"t":"single","q":"在 AWS 云采用框架（AWS CAF）中，哪个角度包括配置管理和补丁管理的能力？","o":[{"l":"A","t":"平台"},{"l":"B","t":"运营"},{"l":"C","t":"安全"},{"l":"D","t":"治理"}],"a":["B"],"e":"**✅ 为什么 B.运营 对**：AWS CAF 的运营（Operations）视角负责云上系统的日常运转，其能力项包括配置管理（Configuration Management）与补丁管理（Patch Management）等，确保系统稳定、安全、可预测地运行。\n\n**❌ 为什么其他选项错**：\n- A.平台：平台视角管基础设施与应用的技术架构与标准化，不含运维流程类能力\n- C.安全：安全视角聚焦身份、检测、保护、事件响应等安全能力\n- D.治理：治理视角负责云治理机制、风险与合规框架，不涉及补丁与配置日常管理\n\n**📌 关键概念**：CAF 视角能力速记：运营视角含事件管理、配置管理、补丁管理、可观测性等；平台视角管技术栈、安全视角管防护、治理视角管框架，题目问「管到运维流程」就选运营。","s":"源#127"},{"id":"D1-134","d":1,"t":"single","q":"哪个选项是 AWS 云采用框架（AWS CAF）商业角度能力？","o":[{"l":"A","t":"文化演变"},{"l":"B","t":"事件管理"},{"l":"C","t":"数据货币化"},{"l":"D","t":"平台架构"}],"a":["C"],"e":"**✅ 为什么 C.数据货币化 对**：数据货币化（Data Monetization）是 CAF 商业（Business）视角的能力，指将数据资产转化为收入或商业价值（如数据产品、洞察变现），直接服务业务成果，属于商业视角的典型能力项。\n\n**❌ 为什么其他选项错**：\n- A.文化演变：文化演进属于人员（People）视角的组织转型能力\n- B.事件管理：事件管理属于运营（Operations）视角的能力\n- D.平台架构：平台架构属于平台（Platform）视角的技术设计能力\n\n**📌 关键概念**：商业视角关注「业务价值」：产品管理、数据货币化、收益管理等；人员视角管人、平台视角管技术架构、运营视角管运维，按价值链归属即可快速定位。","s":"源#134"},{"id":"D1-137","d":1,"t":"multiple","q":"哪些选项是 AWS 云采用框架（AWS CAF）安全角度能力？（选择两个。）","o":[{"l":"A","t":"可观测性"},{"l":"B","t":"事件和问题管理"},{"l":"C","t":"事件响应"},{"l":"D","t":"基础设施保护"},{"l":"E","t":"可用性和连续性"}],"a":["C","D"],"e":"**✅ 为什么 C、D 对**：\n- C.事件响应：Incident Response 是 CAF 安全视角能力，涵盖安全事件的准备、检测与响应处置\n- D.基础设施保护：Infrastructure Protection 是安全视角能力，聚焦保护系统边界与底层基础设施安全\n\n**❌ 为什么其他选项错**：\n- A.可观测性：可观测性属于运营（Operations）视角的监控分析能力\n- B.事件和问题管理：事件与问题管理属于运营视角的运维流程能力（ITIL 范畴）\n- E.可用性和连续性：可用性与连续性属于运营视角保障业务连续的能力\n\n**📌 关键概念**：安全视角能力组：身份与访问管理、检测、基础设施保护、数据保护、事件响应、应用安全、威胁建模等；「可观测性/事件问题管理/连续性」容易误选，实为运营视角能力。","s":"源#137"},{"id":"D1-142","d":1,"t":"single","q":"一家公司计划迁移到 AWS 云。公司希望使用 AWS 云采用框架（AWS CAF）作为其云转型之旅的一部分，定义和跟踪业务成果。哪个 AWS CAF 治理角度能力将满足这些要求？","o":[{"l":"A","t":"收益管理"},{"l":"B","t":"风险管理"},{"l":"C","t":"应用程序组合管理"},{"l":"D","t":"云财务管理"}],"a":["A"],"e":"**✅ 为什么 A.收益管理 对**：收益管理（Benefits Realization/管理）是 CAF 治理（Governance）视角的能力，负责定义云转型预期产出的业务成果、设定衡量指标并持续跟踪收益兑现情况，正符合「定义和跟踪业务成果」的要求。\n\n**❌ 为什么其他选项错**：\n- B.风险管理：治理视角的风险管理关注识别与控制云采用风险，不专门跟踪业务收益\n- C.应用程序组合管理：应用组合管理属于平台视角，管理应用资产与技术演进决策\n- D.云财务管理：云财务管理（FinOps 类）关注云成本预算与优化，聚焦成本而非业务成果\n\n**📌 关键概念**：治理视角负责「管住方向」：收益管理（跟踪业务成果）、风险管理、云政策与合规；「定义+跟踪业务成果」是收益管理的标志性职责表述。","s":"源#142"},{"id":"D1-145","d":1,"t":"single","q":"AWS 云采用框架（AWS CAF）的哪个云转型阶段专注于展示云如何加速业务成果？","o":[{"l":"A","t":"扩展"},{"l":"B","t":"构想"},{"l":"C","t":"对齐"},{"l":"D","t":"发布"}],"a":["B"],"e":"**✅ 为什么 B.构想 对**：云转型旅程中，构想（Envision）阶段用于识别并优先排序与战略目标一致的转型机会，把倡议与可衡量的业务成果关联起来、展示云如何加速业务价值实现，正符合题干「展示云如何加速业务成果」的描述。\n\n**❌ 为什么其他选项错**：\n- A.扩展：扩展阶段把已验证的云实践规模化推广至整个组织\n- C.对齐：对齐阶段聚焦用 CAF 识别能力差距并制定弥合计划\n- D.发布：发布阶段执行首批迁移与上线，交付转型初期可见成果\n\n**📌 关键概念**：四阶段记忆锚点：构想=机会与价值（为什么）、对齐=能力与准备（凭什么）、发布=首战落地（做什么）、扩展=规模复制（放大做）；「加速业务成果/识别优先机会」指向构想。","s":"源#145"},{"id":"D1-147","d":1,"t":"single","q":"一家公司希望其 Amazon EC2 实例在高度可用的环境中运行，即使在特定地理区域发生自然灾害。哪种方法将实现这一目标？","o":[{"l":"A","t":"在多个 AWS 区域中使用 EC2 实例。"},{"l":"B","t":"在多个 Amazon CloudFront 位置使用 EC2 实例。"},{"l":"C","t":"在多个边缘位置使用 EC2 实例。"},{"l":"D","t":"在 AWS 本地区域中使用 EC2 实例。"}],"a":["A"],"e":"**✅ 为什么 A.在多个 AWS 区域中使用 EC2 实例。 对**：区域是相互隔离的独立地理区域（基础设施、电力、网络互不依赖），跨区域部署应用可获得地理级冗余，单一区域即使遭遇自然灾害整体不可用，其他区域仍可继续提供服务，正符合「特定地理区域灾害下仍高可用」的要求。\n\n**❌ 为什么其他选项错**：\n- B.在多个 Amazon CloudFront 位置使用 EC2 实例。：EC2 无法部署到 CloudFront 边缘位置，边缘站点只承载缓存分发（CloudFront/Lambda@Edge）\n- C.在多个边缘位置使用 EC2 实例。：边缘位置用于内容缓存与边缘计算，不是 EC2 的部署单元\n- D.在 AWS 本地区域（Local Zones）中使用 EC2 实例。：Local Zones 是大城市的延迟扩展，依附于父区域，不提供跨地理区域的灾害隔离\n\n**📌 关键概念**：容灾层级：多可用区抗机房级故障、跨区域抗区域级灾害（地震/洪水/区域服务中断）；边缘站点与 Local Zones 解决延迟问题而非地理容灾。","s":"源#147"},{"id":"D1-148","d":1,"t":"single","q":"一家公司想要现代化并将其单体应用程序转换为微服务。公司希望将应用程序迁移到AWS。公司应该使用哪种迁移策略？","o":[{"l":"A","t":"重新托管"},{"l":"B","t":"重新平台化"},{"l":"C","t":"重新购买"},{"l":"D","t":"重构"}],"a":["D"],"e":"**✅ 为什么 D.重构 对**：迁移 7R 策略中，重构/重新架构（Refactor/Re-architect）指重新设计应用架构——把单体应用改造为微服务架构，以充分利用云的弹性、松耦合与敏捷交付能力，正符合「单体应用转换为微服务」的要求。\n\n**❌ 为什么其他选项错**：\n- A.重新托管（Rehost）：直接「提升并转移」原样搬到云上，不改架构，无法完成微服务化改造\n- B.重新平台化（Replatform）：只做少量云优化（如换托管数据库），不动应用整体架构\n- C.重新购买（Repurchase）：放弃现有应用改买 SaaS 产品，与「改造自家应用」方向不符\n\n**📌 关键概念**：7R 按改造深度排序：重新托管（原样搬）→ 重新平台化（小优化）→ 重构/重新架构（大改架构、单体变微服务）；「转微服务」是重构的标志性场景，投入最大但云原生收益最高。","s":"源#148"},{"id":"D1-152","d":1,"t":"single","q":"一家公司有一个具有强大硬件要求的应用程序。该应用程序必须由使用轻量级、低成本笔记本电脑的学生访问。哪种 AWS 服务将帮助公司在不投资后端基础设施或高端客户端硬件的情况下部署应用程序？","o":[{"l":"A","t":"Amazon AppStream 2.0"},{"l":"B","t":"AWS AppSync"},{"l":"C","t":"Amazon WorkLink"},{"l":"D","t":"AWS Elastic Beanstalk"}],"a":["A"],"e":"**✅ 为什么 A.Amazon AppStream 2.0 对**：AppStream 2.0 是应用流式传输服务——应用在 AWS 云端 GPU 实例上运行，画面以流方式传到学生终端，终端只需浏览器，无需本地高性能硬件，也无需公司自建后端，正符合「强大硬件需求+轻薄本访问+不投资基础设施」三个条件。\n\n**❌ 为什么其他选项错**：\n- B.AWS AppSync：托管 GraphQL API 服务，用于应用后端数据接口，不做应用流传输\n- C.Amazon WorkLink：为内部网站提供安全浏览器访问，不能承载本地高性能应用\n- D.AWS Elastic Beanstalk：应用部署托管平台（PaaS），后端仍需按需配置计算资源且客户端需自行渲染\n\n**📌 关键概念**：「计算在云端、显示在终端」是 AppStream 2.0（桌面应用流）与 Amazon WorkSpaces（完整云桌面）的共同模式；题眼是「客户端硬件弱+应用硬件要求高」时选流式方案。","s":"源#152"},{"id":"D1-154","d":1,"t":"single","q":"以下哪项是 AWS 云架构的推荐设计原则？","o":[{"l":"A","t":"设计紧密耦合的组件。"},{"l":"B","t":"构建一个可以处理所有应用程序功能的单一应用程序组件。"},{"l":"C","t":"在较少的迭代中进行大的更改，以减少失败的机会。"},{"l":"D","t":"通过分割工作负载避免单体架构。"}],"a":["D"],"e":"**✅ 为什么 D.通过分割工作负载避免单体架构。 对**：Well-Architected 推荐将工作负载拆分为松耦合的小组件（微服务化），各组件可独立扩展、独立演进、故障隔离，避免单体架构的紧耦合牵一发动全身，正符合推荐设计原则。\n\n**❌ 为什么其他选项错**：\n- A.设计紧密耦合的组件。：紧耦合会放大故障传播、阻碍独立扩展，与框架原则相反\n- B.构建一个可以处理所有应用程序功能的单一应用程序组件。：这正是单体架构，是框架明确反对的模式\n- C.在较少的迭代中进行大的更改。：框架建议频繁小变更降低风险，大变更反而扩大故障影响面\n\n**📌 关键概念**：解耦设计三收益：独立扩展、故障隔离、敏捷演进；「紧耦合」「单一组件」「大变更」是单体反模式三件套，看到即排除。","s":"源#154"},{"id":"D1-164","d":1,"t":"single","q":"AWS Well-Architected Framework 的哪个支柱指的是系统从基础设施或服务中断中恢复并动态获取计算资源以满足需求的能力？","o":[{"l":"A","t":"安全"},{"l":"B","t":"可靠性"},{"l":"C","t":"性能效率"},{"l":"D","t":"成本优化"}],"a":["B"],"e":"**✅ 为什么 B.可靠性 对**：Well-Architected 六支柱中，可靠性（Reliability）支柱的定义正是：系统从基础设施或服务中断中恢复的能力，以及动态获取计算资源以满足需求的能力，与题干表述逐字对应。\n\n**❌ 为什么其他选项错**：\n- A.安全：安全支柱关注保密性、完整性、权限与数据保护，不描述恢复能力\n- C.性能效率：性能效率关注按需选择资源类型并保持高效，不聚焦中断恢复\n- D.成本优化：成本优化关注避免不必要的成本、按需供给资源，不涉及故障恢复\n\n**📌 关键概念**：可靠性支柱关键词：故障恢复（Recovery）、动态获取计算资源、自动扩缩、测试恢复程序；「从中断中恢复+动态获取资源」是可靠性支柱的标准定义句。","s":"源#164"},{"id":"D1-167","d":1,"t":"single","q":"以下哪项是描述用户根据需求扩展基础设施能力的 AWS 价值主张？","o":[{"l":"A","t":"创新速度"},{"l":"B","t":"资源弹性"},{"l":"C","t":"解耦架构"},{"l":"D","t":"全球部署"}],"a":["B"],"e":"**✅ 为什么 B.资源弹性 对**：资源弹性（Elasticity）是 AWS 核心价值主张之一，指按需自动扩展与缩减基础设施资源——需求高峰扩容、低谷缩容，只为实际用量付费，正符合「根据需求扩展基础设施能力」的描述。\n\n**❌ 为什么其他选项错**：\n- A.创新速度：指向快速实验与缩短上线周期，不是按需伸缩能力\n- C.解耦架构：是提升可用性与独立扩展的架构手法，不是云价值主张本身\n- D.全球部署：指全球基础设施覆盖与分钟级多地部署能力，与按需伸缩无关\n\n**📌 关键概念**：弹性 = 「需求涨则扩、需求落则缩」的按需伸缩；与可扩展性（容量可增减的能力属性）、全球部署（地域覆盖）、敏捷（快速试验）各属不同维度。","s":"源#167"},{"id":"D1-169","d":1,"t":"single","q":"一家公司想要了解更多关于云计算的好处。公司想要了解敏捷性的运营优势。AWS 如何为用户提供敏捷性？","o":[{"l":"A","t":"通过将工作负载部署到多个区域，确保高可用性"},{"l":"B","t":"许多服务和资源的按需付费模式"},{"l":"C","t":"将基础设施管理转移到 AWS 云"},{"l":"D","t":"快速提供和取消资源，几乎不需要努力"}],"a":["D"],"e":"**✅ 为什么 D.快速提供和取消资源，几乎不需要努力 对**：敏捷性的运营体现就是「分钟级供应、随需释放」——环境与应用的创建与销毁近乎零摩擦，使业务想法能快速落地、快速调整，几乎无需人工投入，正符合「AWS 如何提供敏捷性」的提问。\n\n**❌ 为什么其他选项错**：\n- A.通过将工作负载部署到多个区域，确保高可用性：这是全球部署带来的可用性优势，不是敏捷性\n- B.许多服务和资源的按需付费模式：按需付费是成本维度的价值主张（CAPEX 转 OPEX）\n- C.将基础设施管理转移到 AWS 云：这是「聚焦业务而非基础设施」的优势，属职责转移维度\n\n**📌 关键概念**：云优势分维度记：敏捷 = 快速供应与释放资源；成本 = 按需付费；可靠性 = 多区域高可用；专注 = 基础设施托管给 AWS；题干问敏捷就要盯住「快与省力」。","s":"源#169"},{"id":"D1-176","d":1,"t":"single","q":"一家公司计划迁移到 AWS 云。公司正在收集有关其本地基础设施的信息，需要诸如主机名、IP 地址和 MAC 地址等信息。哪种 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS DataSync"},{"l":"B","t":"AWS 应用程序迁移服务"},{"l":"C","t":"AWS 应用程序发现服务"},{"l":"D","t":"AWS 数据库迁移服务（AWS DMS）"}],"a":["C"],"e":"**✅ 为什么 C.AWS 应用程序发现服务 对**：Application Discovery Service 专为迁移规划而设，通过 Agentless/Agent 两种方式自动采集本地服务器清单信息，包括主机名、IP 地址、MAC 地址、性能与依赖关系，正符合「收集本地基础设施信息」的要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS DataSync：负责本地与 AWS 之间的大批量数据传输（如 NFS/S3 搬数据），不做资产发现\n- B.AWS 应用程序迁移服务（MGN）：执行「提升并转移」的实际迁移动作，前提是已完成发现与规划\n- D.AWS 数据库迁移服务（DMS）：负责数据库与分析数据平台的搬迁和同构/异构复制，不采集服务器清单\n\n**📌 关键概念**：迁移工具链分工：发现（ADS 采集清单与依赖）→ 评估（Migration Evaluator 估算成本）→ 迁移（MGN 搬服务器、DMS 搬数据库、DataSync 搬数据）；「主机名/IP/MAC」是发现阶段的标志性信息。","s":"源#176"},{"id":"D1-185","d":1,"t":"multiple","q":"哪些设计原则支持 AWS Well-Architected Framework 的可靠性支柱？（选择两个。）","o":[{"l":"A","t":"执行操作作为代码。"},{"l":"B","t":"启用可追溯性。"},{"l":"C","t":"根据需求自动扩展。"},{"l":"D","t":"部署资源到全球以提高响应时间。"},{"l":"E","t":"从故障中自动恢复。"}],"a":["C","E"],"e":"**✅ 为什么 C、E 对**：\n- C.根据需求自动扩展：可靠性支柱要求通过自动扩缩从容应对需求变化，避免容量不足导致服务中断\n- E.从故障中自动恢复：可靠性支柱核心原则，用自动恢复机制（多 AZ、健康检查、故障转移）保障韧性\n\n**❌ 为什么其他选项错**：\n- A.执行操作作为代码。：运维即代码（IaC/自动化）是运营卓越支柱的设计原则\n- B.启用可追溯性。：可追溯性（审计追踪）是安全支柱的设计原则\n- D.部署资源到全球以提高响应时间。：全球部署降低延迟属于性能效率支柱（边缘缓存/低延迟接入）范畴\n\n**📌 关键概念**：支柱原则速记：可靠性 = 自动恢复+自动扩缩+测试恢复程序；运营卓越 = 操作自动化为代码；安全 = 可追溯；性能效率 = 全球部署降延迟；跨支柱选项常被拿来互相干扰。","s":"源#185"},{"id":"D1-186","d":1,"t":"single","q":"一家公司需要传输 2TB 的数据。哪种类型的数据传输将使公司不承担任何成本？","o":[{"l":"A","t":"从互联网的入站数据传输"},{"l":"B","t":"到互联网的出站数据传输"},{"l":"C","t":"跨 AWS 区域的数据传输"},{"l":"D","t":"跨可用区的数据传输"}],"a":["A"],"e":"**✅ 为什么 A.从互联网的入站数据传输 对**：AWS 计费规则中，从互联网进入 AWS 的入站（Inbound）数据传输免费，2TB 数据传入 AWS 不产生传输费用，正符合「不承担任何成本」的要求。\n\n**❌ 为什么其他选项错**：\n- B.到互联网的出站数据传输：出站到互联网的流量按 GB 累进计费，是常见的成本项\n- C.跨 AWS 区域的数据传输：跨区域传输收费（每方向分别计费），不免费\n- D.跨可用区的数据传输：跨 AZ 数据传输双向计费，同 AZ 内免费但跨 AZ 不免费\n\n**📌 关键概念**：传输计费方向口诀：入站免费（互联网→AWS）；出站（AWS→互联网）收费、跨区域收费、跨可用区收费；100GB 免费额度（部分账号/服务）属例外条款，题目问「不承担成本」默认看入站。","s":"源#186"},{"id":"D1-193","d":1,"t":"single","q":"一位用户对 AWS 服务了解有限，但想要在 AWS 云中快速部署一个可扩展的 Node.js 应用程序。应该使用哪种服务来部署应用程序？","o":[{"l":"A","t":"AWS CloudFormation"},{"l":"B","t":"AWS Elastic Beanstalk"},{"l":"C","t":"Amazon EC2"},{"l":"D","t":"AWS OpsWorks"}],"a":["B"],"e":"**✅ 为什么 B.AWS Elastic Beanstalk 对**：Elastic Beanstalk 是面向开发者的部署平台——上传代码（支持 Node.js 等），平台自动处理容量预置、负载均衡、扩展与健康监控，无需深入 AWS 知识即可快速部署可扩展应用，正符合「了解有限+快速部署 Node.js」的场景。\n\n**❌ 为什么其他选项错**：\n- A.AWS CloudFormation：需要编写模板定义资源，对新手门槛较高\n- C.Amazon EC2：从系统层自管一切（实例、网络、扩展），运维负担最重\n- D.AWS OpsWorks：基于 Chef/Puppet 的配置管理服务，同样需要较强的运维技能\n\n**📌 关键概念**：抽象层级越高、管理负担越轻：EC2（自管系统）→ CloudFormation/OpsWorks（自动化但需编排能力）→ Elastic Beanstalk（只管代码，平台管其余）；「小白快速上线 Web 应用」就选 EB。","s":"源#193"},{"id":"D1-195","d":1,"t":"single","q":"一家公司需要在 AWS 上使用第三方软件进行其工作负载。公司可以使用哪种 AWS 服务或功能来购买该软件？","o":[{"l":"A","t":"AWS Resource Access Manager"},{"l":"B","t":"AWS Managed Services"},{"l":"C","t":"AWS License Manager"},{"l":"D","t":"AWS Marketplace"}],"a":["D"],"e":"**✅ 为什么 D.AWS Marketplace 对**：AWS Marketplace 是第三方软件与服务的数字化商店，可一站式发现、购买（或订阅）经 AWS 认证可在云上运行的软件，正符合「购买第三方软件在 AWS 上使用」的要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS Resource Access Manager：在账户间安全共享 AWS 资源的服务，不做软件交易\n- B.AWS Managed Services：由 AWS 托管运营云上工作负载的服务，不是软件采购渠道\n- C.AWS License Manager：管理软件许可证的追踪与合规，前提是已获得许可证，本身不卖软件\n\n**📌 关键概念**：Marketplace 定位「云上软件商店」：买断/订阅/按用量计费三种模式，账单并入 AWS 账单；License Manager 管「已有许可证」，Marketplace 管「去买软件」，一购一管分清楚。","s":"源#195"},{"id":"D1-210","d":1,"t":"multiple","q":"哪些能力是 AWS 云的好处？（选择两个。）","o":[{"l":"A","t":"将可变成本转换为资本支出。"},{"l":"B","t":"在几分钟内全球部署。"},{"l":"C","t":"在部署前计划容量。"},{"l":"D","t":"利用规模经济。"},{"l":"E","t":"减少对网络连接的依赖。"}],"a":["B","D"],"e":"**✅ 为什么 B、D 对**：\n- B.在几分钟内全球启动：全球基础设施分钟级部署资源，无需提前自建数据中心，业务可即时全球触达\n- D.利用规模经济：AWS 聚合需求规模化运营，把单位成本优势传导给客户，实现「用得越多越便宜」\n\n**❌ 为什么其他选项错**：\n- A.将可变成本转换为资本支出。：云计算是可变支出替代资本支出（CAPEX→OPEX），方向相反\n- C.在部署前计划容量。：云的优势正是无需提前预估容量（弹性按需供给），提前计划容量是传统 IT 做法\n- E.减少对网络连接的依赖。：云服务依赖网络接入，并未减少网络连接依赖\n\n**📌 关键概念**：AWS 云优势高频组合：规模经济、分钟级全球部署、CAPEX 转 OPEX、无需容量预估、速度敏捷、聚焦业务；「转换方向反着说」「容量要提前规划」是典型干扰项套路。","s":"源#210"},{"id":"D1-238","d":1,"t":"single","q":"一家公司想要迁移到 AWS，并使用它在本地使用的相同安全软件。安全软件供应商在AWS 上提供其安全软件作为服务。公司在哪里可以购买安全解决方案？","o":[{"l":"A","t":"AWS 合作伙伴解决方案查找器"},{"l":"B","t":"AWS 支持中心"},{"l":"C","t":"AWS 管理控制台"},{"l":"D","t":"AWS 市场"}],"a":["D"],"e":"**✅ 为什么 D.AWS 市场 对**：AWS Marketplace 是第三方软件的购买与订阅平台，安全厂商在 AWS 上以 SaaS 等形式上架其安全产品，公司可直接在 Marketplace 购买与本地同款的安全软件服务，正符合「厂商在 AWS 上提供软件服务+在哪里购买」的提问。\n\n**❌ 为什么其他选项错**：\n- A.AWS 合作伙伴解决方案查找器：用于查找 APN 合作伙伴与咨询集成商，不是软件购买渠道\n- B.AWS 支持中心：提交技术工单与查看账户支持状态的地方，不做软件交易\n- C.AWS 管理控制台：云资源管理与操作门户，本身不含第三方软件采购功能\n\n**📌 关键概念**：购买第三方软件认准 AWS Marketplace（含安全产品专区）；Partner Solutions Finder 找「人/公司」（集成商、顾问），Marketplace 买「软件/订阅」，两者用途分明。","s":"源#238"},{"id":"D1-252","d":1,"t":"single","q":"一家公司已将其工作负载迁移到 AWS。公司想要大规模采用 AWS，以更有效、更安全的方式运营。公司应该使用哪个 AWS 服务或框架来获得运营支持？","o":[{"l":"A","t":"AWS 支持"},{"l":"B","t":"AWS 云采用框架（AWS CAF）"},{"l":"C","t":"AWS 托管服务（AMS）"},{"l":"D","t":"AWS 良好构建框架"}],"a":["C"],"e":"**✅ 为什么 C.AWS 托管服务（AMS） 对**：AWS Managed Services 以企业级规模代为运营云上基础设施——提供主动监控、事件管理、安全管理与成本优化等全套运营支持，让公司「大规模采用 AWS、更高效更安全地运营」，正符合题干对运营支持的要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS 支持：提供工单响应与技术协助，但并不代管运营云基础设施\n- B.AWS 云采用框架（AWS CAF）：是规划云转型的指导框架与最佳实践集，不是运营服务\n- D.AWS 良好构建框架（Well-Architected Framework）：是架构质量评估方法论，同样不提供实际运营\n\n**📌 关键概念**：三类资源辨析：运营服务（AMS，替你管云）、知识框架（CAF 规划转型、WA 评估架构）、支持响应（AWS Support 答疑与故障协助）；题目问「运营支持」且要实际代管，选 AMS。","s":"源#252"},{"id":"D1-257","d":1,"t":"single","q":"一家公司想要监控其工作负载性能。公司希望确保云服务以满足其业务需求的水平交付。哪个AWS云采用框架（AWS CAF）视角将满足这些要求？","o":[{"l":"A","t":"商业"},{"l":"B","t":"治理"},{"l":"C","t":"平台"},{"l":"D","t":"运营"}],"a":["D"],"e":"**✅ 为什么 D.运营 对**：AWS CAF 的运营（Operations）视角负责确保云服务以约定水平交付（SLA 履行），其能力包括监控、可观测性与工作负载性能管理，通过度量与持续改进保证服务满足业务需求，正符合「监控工作负载性能+按业务需求水平交付」的要求。\n\n**❌ 为什么其他选项错**：\n- A.商业：商业视角关注业务价值、产品与数据变现，不负责服务交付水平监控\n- B.治理：治理视角负责云治理机制、风险与合规框架，不涉及性能监控运营\n- C.平台：平台视角负责技术架构与基础设施标准化，是「建」而非「运维监控」\n\n**📌 关键概念**：运营视角=「运行与看护」：监控、可观测性、事件与问题管理、性能保障；题目出现「监控性能/确保服务水平交付」等运维关键词，即锁定运营视角。","s":"源#257"},{"id":"D1-258","d":1,"t":"single","q":"一家公司想要将其应用程序迁移到 AWS 云。公司计划识别和优先考虑任何业务转型机会，并评估其AWS 云准备情况。公司应该使用哪个 AWS 服务或工具来满足这些要求？","o":[{"l":"A","t":"AWS 云采用框架（AWS CAF）"},{"l":"B","t":"AWS 托管服务（AMS）"},{"l":"C","t":"AWS 良好构建框架"},{"l":"D","t":"AWS 迁移中心"}],"a":["A"],"e":"**✅ 为什么 A.AWS 云采用框架（AWS CAF） 对**：AWS CAF 提供云转型全旅程的方法论——识别与优先排序业务转型机会、评估组织的云就绪程度（用视角识别能力差距），正符合「识别转型机会+评估云准备情况」的双重要求。\n\n**❌ 为什么其他选项错**：\n- B.AWS 托管服务（AMS）：是云基础设施的实际运营服务，不做转型规划与就绪评估\n- C.AWS 良好构建框架：评估的是架构质量与设计最佳实践，不是组织云准备度\n- D.AWS 迁移中心（Migration Hub）：是迁移执行阶段的进度跟踪与工具协调平台，不做前期机会识别\n\n**📌 关键概念**：规划期工具链：转型机会识别与云就绪评估选 CAF，架构质量评审选 Well-Architected，迁移执行协调选 Migration Hub；按「规划→架构→执行」阶段对号入座。","s":"源#258"},{"id":"D1-259","d":1,"t":"single","q":"一家公司需要 AWS 服务，为其提供公司在本地数据中心运行的清晰基线。公司需要在AWS 云中运行其本地工作负载的预计成本。哪家 AWS 服务或工具将满足这些要求？","o":[{"l":"A","t":"AWS 计算优化器"},{"l":"B","t":"AWS 成本探索器"},{"l":"C","t":"AWS 系统管理代理（SSM 代理）"},{"l":"D","t":"迁移评估员"}],"a":["D"],"e":"**✅ 为什么 D.迁移评估员 对**：迁移评估员（Migration Evaluator，原 TSO Logic）通过导入本地数据中心的使用数据，生成清晰的本地运行基线，并基于实测配置与用量推算出这些负载跑在 AWS 上的预计成本，产出方向性商业案例，正符合「本地基线+AWS 预计成本」的双重要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS 计算优化器（Compute Optimizer）：分析的是已在 AWS 上运行资源的规格与利用率，不能评估本地负载\n- B.AWS 成本探索器（Cost Explorer）：查看与分析已有 AWS 账单支出，不涉及本地基线采集\n- C.AWS 系统管理代理（SSM 代理）：是 Systems Manager 的运维通道组件，用于管理云上实例，不做成本评估\n\n**📌 关键概念**：迁移前评估链路：Migration Evaluator（本地基线+云端成本测算）→ Application Discovery Service（采集清单）→ Migration Evaluator 报告支撑商业案例；题眼「本地基线+预计成本」锁定迁移评估员。","s":"源#259"},{"id":"D1-261","d":1,"t":"single","q":"一家公司希望设置其工作负载以执行其预期功能，并在发生故障时快速恢复。哪个AWS 良好构建框架支柱与这些目标一致？","o":[{"l":"A","t":"性能效率"},{"l":"B","t":"可持续性"},{"l":"C","t":"可靠性"},{"l":"D","t":"安全"}],"a":["C"],"e":"**✅ 为什么 C.可靠性 对**：可靠性（Reliability）支柱的使命正是「让系统执行其预期功能，并在发生故障时快速恢复」——通过冗余设计、故障转移与恢复测试，保障工作负载中断后可恢复并保持可用，与题干两个目标逐字对应。\n\n**❌ 为什么其他选项错**：\n- A.性能效率：关注选用正确的资源类型并高效运行，不聚焦故障恢复\n- B.可持续性：关注降低环境影响与资源利用效率，与故障恢复无关\n- D.安全：关注保密性、完整性与权限控制，不描述恢复能力\n\n**📌 关键概念**：可靠性支柱关键词：执行预期功能、从故障快速恢复、自动恢复机制、多 AZ/多区域冗余；「按预期运行+故障恢复」双目标出现即选可靠性。","s":"源#261"},{"id":"D1-268","d":1,"t":"multiple","q":"以下哪些是 AWS 良好构建框架的支柱？（选择两个）","o":[{"l":"A","t":"资源可扩展性"},{"l":"B","t":"性能效率"},{"l":"C","t":"系统弹性"},{"l":"D","t":"敏捷开发"},{"l":"E","t":"卓越运营"}],"a":["B","E"],"e":"**✅ 为什么 B、E 对**：\n- B.性能效率：Performance Efficiency 是六大支柱之一，关注用正确的资源类型高效支撑工作负载\n- E.卓越运营：Operational Excellence 同为支柱，关注运行监控与流程持续改进\n\n**❌ 为什么其他选项错**：\n- A.资源可扩展性：可扩展性是资源伸缩能力属性，不是支柱名称\n- C.系统弹性：弹性是架构能力概念，不单独构成支柱\n- D.敏捷开发：敏捷开发是软件工程方法论，与云架构框架支柱无关\n\n**📌 关键概念**：Well-Architected 六大支柱 = 运营卓越、安全、可靠性、性能效率、成本优化、可持续性；「可扩展性/弹性/敏捷」都是能力属性或方法论，不是支柱。","s":"源#268"},{"id":"D1-285","d":1,"t":"single","q":"一家公司想要在 AWS 云中有效地运行其工作负载，减少管理开销，并改善流程。哪个AWS 良好构建框架支柱代表了这些要求？","o":[{"l":"A","t":"可靠性"},{"l":"B","t":"运营卓越"},{"l":"C","t":"性能效率"},{"l":"D","t":"成本优化"}],"a":["B"],"e":"**✅ 为什么 B.运营卓越 对**：运营卓越（Operational Excellence）支柱聚焦高效运行与监控系统、降低管理开销、以小步快跑方式持续改进流程与程序，正符合「有效运行工作负载+减少管理开销+改善流程」的三项要求。\n\n**❌ 为什么其他选项错**：\n- A.可靠性：聚焦故障恢复与中断韧性，不覆盖流程改进与管理开销\n- C.性能效率：聚焦资源选型与运行效率，不涉及流程优化\n- D.成本优化：聚焦支出效率与消除浪费，不解决运营流程问题\n\n**📌 关键概念**：运营卓越三关键词：运行监控、持续改进、自动化降开销；题目出现「减少管理开销/改善流程」等运营侧诉求即锁定该支柱。","s":"源#285"},{"id":"D1-292","d":1,"t":"multiple","q":"AWS 云采用框架（AWS CAF）平台视角包括哪些能力？（选择两个）","o":[{"l":"A","t":"性能和容量管理"},{"l":"B","t":"数据工程"},{"l":"C","t":"持续集成和持续交付（CI/CD）"},{"l":"D","t":"基础设施保护"},{"l":"E","t":"变更和发布管理"}],"a":["B","C"],"e":"**✅ 为什么 B、C 对**：\n- B.数据工程：Data Engineering 是 CAF 平台视角能力，负责数据管道与数据平台的构建\n- C.持续集成和持续交付（CI/CD）：Platform Engineering 下的 CI/CD 能力同样归属平台视角，支撑软件交付流程\n\n**❌ 为什么其他选项错**：\n- A.性能和容量管理：属于运营（Operations）视角的能力\n- D.基础设施保护：属于安全（Security）视角的能力\n- E.变更和发布管理：属于运营视角的流程管理能力\n\n**📌 关键概念**：平台视角管「技术底座」：基础设施工程、数据工程、平台架构、CI/CD、现代应用开发；容量管理与变更发布归运营、基础设施保护归安全，视角归属不能混。","s":"源#292"},{"id":"D1-295","d":1,"t":"multiple","q":"AWS 云采用框架（AWS CAF）安全视角的哪些能力？（选择两个）","o":[{"l":"A","t":"可观察性"},{"l":"B","t":"事件和问题管理"},{"l":"C","t":"事件响应"},{"l":"D","t":"基础设施保护"},{"l":"E","t":"可用性和连续性"}],"a":["C","D"],"e":"**✅ 为什么 C、D 对**：\n- C.事件响应：Incident Response 是 CAF 安全视角能力，涵盖安全事件的准备、检测与响应处置\n- D.基础设施保护：Infrastructure Protection 是安全视角能力，聚焦系统边界与底层基础设施的防护\n\n**❌ 为什么其他选项错**：\n- A.可观察性：属于运营（Operations）视角的监控分析能力\n- B.事件和问题管理：ITIL 运维流程，属于运营视角\n- E.可用性和连续性：业务连续性保障，属于运营视角能力\n\n**📌 关键概念**：安全视角能力组：身份与访问管理、检测、基础设施保护、数据保护、事件响应、应用安全；「可观察性/事件问题管理/连续性」虽带「事件」「连续」字样，实为运营视角能力，注意防混。","s":"源#295"},{"id":"D1-303","d":1,"t":"single","q":"一家公司的应用开发人员需要快速地使用脚本配置和管理 AWS 服务。开发人员应该使用哪个AWS产品来满足这些要求？","o":[{"l":"A","t":"AWS CLI"},{"l":"B","t":"AWS CodeBuild"},{"l":"C","t":"AWS 云采用框架（AWS CAF）"},{"l":"D","t":"AWS 系统管理会话管理器"}],"a":["A"],"e":"**✅ 为什么 A.AWS CLI 对**：AWS CLI 是统一命令行工具，可用脚本批量调用 AWS 服务 API，实现快速、可自动化的资源配置与管理，正符合「开发人员+脚本化+快速配置管理」的要求。\n\n**❌ 为什么其他选项错**：\n- B.AWS CodeBuild：持续集成构建服务，编译测试代码产出部署物，不是通用管理工具\n- C.AWS 云采用框架（AWS CAF）：是云转型方法论框架，不是可操作的产品工具\n- D.AWS 系统管理会话管理器（Session Manager）：免 SSH 登录实例执行命令的运维组件，管理对象是实例而非全套服务\n\n**📌 关键概念**：交互方式选择：脚本/命令行自动化选 CLI，程序集成选 SDK，图形操作选控制台；「开发人员+脚本」是最典型的 CLI 场景信号。","s":"源#303"},{"id":"D1-307","d":1,"t":"single","q":"哪种 AWS 云部署模型使用 AWS Outposts 作为应用程序部署基础设施的一部分？","o":[{"l":"A","t":"本地"},{"l":"B","t":"无服务器"},{"l":"C","t":"云原生"},{"l":"D","t":"混合"}],"a":["D"],"e":"**✅ 为什么 D.混合 对**：Outposts 把 AWS 的基础设施、服务、API 与管理工具延伸到客户自己的机房，同一套云能力跨本地与 AWS 区域运行，正是「混合部署」模型——本地与云资源融合的形态，正符合题干描述。\n\n**❌ 为什么其他选项错**：\n- A.本地：纯本地自建不含云侧统一管理与 API，Outposts 强调的是云延伸而非传统本地\n- B.无服务器：Serverless 是计算架构模式（按请求计费、免管服务器），不是部署位置的划分\n- C.云原生：云原生指生于云上、充分用云特性的架构，Outposts 的主战场恰是本地侧\n\n**📌 关键概念**：部署模型三分：全云（区域/边缘）、本地（Outposts）、混合（本地+云组合）；Outposts = 「把云带到你身边」的混合形态，与 Wavelength（5G 边缘）、Local Zones（城市低延迟）区分。","s":"源#307"},{"id":"D1-315","d":1,"t":"single","q":"一家公司想要通过吸引和发展精通数字的高绩效团队来转变其劳动力。公司想要吸引一个多样化和包容性的劳动力，具有适当的技术和非技术技能混合。哪个 AWS 云采用框架（AWS CAF）视角将满足这些要求？","o":[{"l":"A","t":"商业"},{"l":"B","t":"人员"},{"l":"C","t":"平台"},{"l":"D","t":"运营"}],"a":["B"],"e":"**✅ 为什么 B.人员 对**：CAF 人员（People）视角聚焦劳动力转型——吸引与培养数字化高绩效团队、建设多元包容的组织、平衡技术与非技术技能组合，正符合「转变劳动力+多元包容+技能混合」的描述。\n\n**❌ 为什么其他选项错**：\n- A.商业：商业视角关注业务价值、产品与数据变现，不管劳动力建设\n- C.平台：平台视角关注技术架构与数据平台，不涉及组织人才\n- D.运营：运营视角关注云上系统的运行与监控，不是人的转型\n\n**📌 关键概念**：人员视角三件事：文化（学习成长文化）、技能（云流利度）、组织（多元包容团队）；凡题干谈「人/团队/文化/技能」即选人员视角。","s":"源#315"},{"id":"D1-335","d":1,"t":"multiple","q":"哪些选项是 AWS 云采用框架（AWS CAF）云转型之旅的建议？（选择两个）","o":[{"l":"A","t":"构想阶段"},{"l":"B","t":"对齐阶段"},{"l":"C","t":"评估阶段"},{"l":"D","t":"动员阶段"},{"l":"E","t":"迁移和现代化阶段"}],"a":["A","B"],"e":"**✅ 为什么 A、B 对**：\n- A.构想阶段：Envision 是云转型旅程建议阶段，用于识别与战略目标一致的机会\n- B.对齐阶段：Align 同为建议阶段，用 CAF 视角识别能力差距与跨组织依赖\n\n**❌ 为什么其他选项错**：\n- C.评估阶段：AWS 官方四阶段为构想/对齐/发布/扩展，「评估」不是独立阶段名称\n- D.动员阶段：「动员」不是 CAF 转型旅程的阶段\n- E.迁移和现代化阶段：迁移与现代化是转型中的活动内容，不是 CAF 建议的四阶段之一\n\n**📌 关键概念**：CAF 云转型旅程四阶段 = Envision（构想）→ Align（对齐）→ Launch（发布）→ Scale（扩展）；干扰项常用「评估/动员/迁移现代化」等相近词冒充阶段名。","s":"源#335"},{"id":"D1-337","d":1,"t":"single","q":"一家公司正在设计其 AWS 工作负载，以便组件可以定期更新，并且可以以小的、可逆的增量进行更改。哪种 AWS 良好构建框架支柱支持这种设计？","o":[{"l":"A","t":"安全"},{"l":"B","t":"性能效率"},{"l":"C","t":"运营卓越"},{"l":"D","t":"可靠性"}],"a":["C"],"e":"**✅ 为什么 C.运营卓越 对**：运营卓越支柱倡导「频繁、小规模、可逆的变更」——组件定期更新、每次改动小且可回滚，既能降低大规模中断风险，又支撑持续改进，与题干「小步快跑+可逆增量」的设计要求一致。\n\n**❌ 为什么其他选项错**：\n- A.安全：安全支柱聚焦权限、加密与审计，不涉及变更节奏管理\n- B.性能效率：性能效率聚焦资源选型与效率，不管变更策略\n- D.可靠性：可靠性聚焦故障恢复与冗余，虽相关但「频繁小步可逆变更」是运营卓越的标志性实践\n\n**📌 关键概念**：变更策略记忆锚：频繁+小规模+可逆 = 运营卓越；这一原则同时服务于可靠性与安全，但归属在运营卓越支柱下。","s":"源#337"},{"id":"D1-341","d":1,"t":"single","q":"一家公司想要在 AWS 云中部署应用程序。公司想要满足这个要求的哪种架构部署模型？","o":[{"l":"A","t":"多区域"},{"l":"B","t":"单区域"},{"l":"C","t":"多 AZ"},{"l":"D","t":"单 AZ"}],"a":["A"],"e":"**✅ 为什么 A.多区域 对**：在多个 AWS 区域部署应用，可让资源靠近不同地理位置的用户降低延迟、抵御区域性故障保障高可用，并可满足数据驻留合规要求，正符合「在 AWS 云中部署应用程序」所需的全球部署架构模型。\n\n**❌ 为什么其他选项错**：\n- B.单区域：只在一个区域部署，无法服务全球用户，也不抗区域级故障\n- C.多 AZ：多可用区只覆盖单一区域的容错，覆盖不了跨地理与合规诉求\n- D.单 AZ：无冗余设计，可用性与容错能力最弱\n\n**📌 关键概念**：部署架构分级：多 AZ 抗机房级故障、多区域抗区域级故障+全球覆盖+数据驻留；按故障域大小与地理范围逐级选择部署模型。","s":"源#341"},{"id":"D1-347","d":1,"t":"single","q":"哪种架构概念描述了按需部署资源并在不再需要时释放资源的能力？","o":[{"l":"A","t":"高可用性"},{"l":"B","t":"解耦架构"},{"l":"C","t":"Resilience 弹性"},{"l":"D","t":"Elasticity 弹性故障恢复"}],"a":["D"],"e":"**✅ 为什么 D.Elasticity 弹性故障恢复 对**：Elasticity（弹性）指按需部署资源、不再需要时释放资源的能力——随负载自动扩缩，正符合题干「按需部署+按需释放」的定义。\n\n**❌ 为什么其他选项错**：\n- A.高可用性：描述系统持续可用的运行状态，不定义按需获取释放资源\n- B.解耦架构：指组件间松耦合的架构手法，与资源伸缩无关\n- C.Resilience 弹性：Resilience 指系统受扰后恢复并继续运行的能力（韧性），是「恢复」而非「伸缩」\n\n**📌 关键概念**：易混词辨析：Elasticity = 按需伸缩（获取/释放资源）；Resilience = 故障后恢复的能力（韧性）；高可用 = 持续可用状态；本题选项译名混乱（C/D 中英标注错位），以题干「按需部署+释放」定义锚定 Elasticity。","s":"源#347"},{"id":"D1-351","d":1,"t":"single","q":"一家公司计划迁移到 AWS 云。公司想要识别可衡量的业务成果，以解释公司决定迁移到AWS 的价值。哪个云转型阶段包括这些活动？","o":[{"l":"A","t":"构想"},{"l":"B","t":"对齐"},{"l":"C","t":"扩展"},{"l":"D","t":"启动"}],"a":["A"],"e":"**✅ 为什么 A.构想 对**：云转型旅程的构想（Envision）阶段负责识别并优先排序与战略目标一致的转型机会，并把可衡量的业务成果与转型倡议关联，以论证云迁移的价值，正符合「识别可衡量业务成果+解释迁移价值」的活动。\n\n**❌ 为什么其他选项错**：\n- B.对齐：对齐阶段聚焦用 CAF 视角识别能力差距与依赖，不产出业务成果论证\n- C.扩展：扩展阶段是把已验证的实践规模化推广\n- D.启动（发布）：发布阶段是首批工作负载实际落地迁移\n\n**📌 关键概念**：构想阶段双产出：优先的转型机会清单 + 可衡量的业务成果（用于论证「为什么上云」）；「价值论证」类活动归构想。","s":"源#351"},{"id":"D1-353","d":1,"t":"single","q":"哪家 AWS 服务公司可以用来从代码创建基础设施？","o":[{"l":"A","t":"Amazon Elastic Kubernetes Service（Amazon EKS）"},{"l":"B","t":"AWS Outposts"},{"l":"C","t":"AWS CodePipeline"},{"l":"D","t":"AWS CloudFormation"}],"a":["D"],"e":"**✅ 为什么 D.AWS CloudFormation 对**：CloudFormation 以模板（JSON/YAML）定义资源，实现基础设施即代码（IaC）——从代码创建、更新与删除整套基础设施，正符合「从代码创建基础设施」的要求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Elastic Kubernetes Service（Amazon EKS）：托管 Kubernetes 集群服务，管容器编排不生成基础设施模板\n- B.AWS Outposts：把 AWS 基础设施延伸到本地的硬件形态，不是代码化工具\n- C.AWS CodePipeline：CI/CD 流水线服务，编排发布流程，本身不定义基础设施\n\n**📌 关键概念**：IaC 工具识别：CloudFormation（原生模板）与 CDK（编程语言抽象）是 AWS 的 IaC 双子星；「从代码创建基础设施」的题眼几乎必然指向 CloudFormation。","s":"源#353"},{"id":"D1-355","d":1,"t":"single","q":"一家公司需要将其在本地数据中心的 75PB 数据移动到 AWS。哪家 AWS 服务应该以最具成本效益的方式满足这些要求？","o":[{"l":"A","t":"AWS Snowball Edge Storage Optimized"},{"l":"B","t":"AWS Snowmobile"},{"l":"C","t":"AWS Direct Connect"},{"l":"D","t":"AWS Storage Gateway"}],"a":["B"],"e":"**✅ 为什么 B.AWS Snowmobile 对**：Snowmobile 是 EB 级数据迁移方案——一辆集装卡车可单次搬运最高 100PB 数据，专为 75PB 这种超大规模、网络传输不现实的数据迁移设计，是成本与时间上都最具效率的方式，正符合题干要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS Snowball Edge Storage Optimized：单台容量约 80TB~100TB 级别，75PB 需数百台设备，不现实\n- C.AWS Direct Connect：专线带宽有限（最高 100Gbps），75PB 经专线需数年，时间成本不可接受\n- D.AWS Storage Gateway：本地与云存储间的混合网关（缓存/归档），不是海量一次性迁移工具\n\n**📌 关键概念**：离线迁移量级选择：Snowball Edge（TB~几十 PB 分批）→ Snowmobile（几十 PB~EB 级单次）；「PB 级+最具成本效益」即锁定 Snowmobile。","s":"源#355"},{"id":"D1-356","d":1,"t":"multiple","q":"以下哪些是 AWS 良好构建框架的支柱？（选择两个）","o":[{"l":"A","t":"资源可扩展性"},{"l":"B","t":"性能效率"},{"l":"C","t":"系统弹性"},{"l":"D","t":"敏捷开发"},{"l":"E","t":"卓越运营"}],"a":["B","E"],"e":"**✅ 为什么 B、E 对**：\n- B.性能效率：Performance Efficiency 是六大支柱之一，关注用正确资源类型高效支撑工作负载\n- E.卓越运营：Operational Excellence 同为支柱，关注运行监控与流程持续改进\n\n**❌ 为什么其他选项错**：\n- A.资源可扩展性：可扩展性是能力属性，不是支柱名称\n- C.系统弹性：弹性是架构能力概念，不构成支柱\n- D.敏捷开发：是软件工程方法论，与云架构框架支柱无关\n\n**📌 关键概念**：Well-Architected 六大支柱 = 运营卓越、安全、可靠性、性能效率、成本优化、可持续性；本题与 D1-268 同构，干扰项套路一致（能力属性冒充支柱）。","s":"源#356"},{"id":"D1-360","d":1,"t":"single","q":"一家公司想要在 AWS 云中部署一些资源。为了满足监管要求，数据必须保持本地并在本地。AWS和公司资源之间必须保持低延迟。哪家 AWS 服务或功能可以用来满足这些要求？","o":[{"l":"A","t":"AWS 本地区域"},{"l":"B","t":"可用区域"},{"l":"C","t":"AWS Outposts"},{"l":"D","t":"AWS Wavelength 区域"}],"a":["C"],"e":"**✅ 为什么 C.AWS Outposts 对**：Outposts 把 AWS 基础设施、服务与 API 原生延伸到客户本地机房，数据可完全留在本地满足监管数据驻留要求，同时本地资源与 AWS 云之间天然低延迟，正符合「数据本地+低延迟」的双重要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS 本地区域（Local Zones）：位于大城市的 AWS 站点，仍属 AWS 运营设施，不能把数据放回客户机房\n- B.可用区域（AZ）：区域内的隔离数据中心集群，数据在 AWS 侧，不满足「保持本地」\n- D.AWS Wavelength 区域：部署在电信运营商 5G 网络边缘的站点，服务移动端低延迟，不是本地驻留方案\n\n**📌 关键概念**：边缘形态分工：Outposts（放你机房、数据驻留+本地低延迟）、Local Zones（城市级低延迟）、Wavelength（5G 移动边缘）；「数据必须留在本地」是 Outposts 的独有题眼。","s":"源#360"},{"id":"D1-371","d":1,"t":"single","q":"哪种架构设计原则描述了在 AWS 云中隔离依赖组件之间故障的需求？","o":[{"l":"A","t":"使用单体设计。"},{"l":"B","t":"为自动化而设计。"},{"l":"C","t":"为单点故障而设计。"},{"l":"D","t":"松散耦合组件。"}],"a":["D"],"e":"**✅ 为什么 D.松散耦合组件。 对**：松耦合（Loose Coupling）设计让组件间依赖最小化，一个组件故障不会级联传播到其他组件，实现故障隔离，正符合「隔离依赖组件之间故障」的设计原则描述。\n\n**❌ 为什么其他选项错**：\n- A.使用单体设计。：单体架构组件紧密交织，一处故障全盘受影响，是隔离的反面\n- B.为自动化而设计。：自动化减少人为失误，但不直接隔离组件间故障传播\n- C.为单点故障而设计。：单点故障是要极力消除的风险，而非设计目标\n\n**📌 关键概念**：松耦合三收益：故障隔离（一处挂不殃及全局）、独立扩展、独立演进；与单体紧耦合相对；「隔离故障」类题眼即选松耦合。","s":"源#371"},{"id":"D1-372","d":1,"t":"single","q":"哪种云计算的好处使公司能够通过 AWS 区域、可用区域和边缘位置的网络，将应用程序部署到全球用户？","o":[{"l":"A","t":"规模经济"},{"l":"B","t":"全球覆盖"},{"l":"C","t":"敏捷性"},{"l":"D","t":"高可用性"}],"a":["B"],"e":"**✅ 为什么 B.全球覆盖 对**：全球覆盖（Global Reach）指借助 AWS 覆盖全球的区域、可用区与边缘位置网络，把应用部署到全球用户身边，正符合「通过区域、可用区和边缘位置网络服务全球用户」的描述。\n\n**❌ 为什么其他选项错**：\n- A.规模经济：指聚合用量降低单位成本，是成本维度优势\n- C.敏捷性：指快速供应资源与快速实验的能力\n- D.高可用性：指系统持续可用的运行状态保障\n\n**📌 关键概念**：价值主张对号入座：全球覆盖=基础设施地理网络、规模经济=成本、敏捷=速度与实验、高可用=持续运行；题干明示「区域/AZ/边缘位置」三件套即选全球覆盖。","s":"源#372"},{"id":"D1-375","d":1,"t":"single","q":"哪个 AWS 服务将帮助公司通过收集本地数据中心的配置、使用和行为数据来计划迁移到AWS？","o":[{"l":"A","t":"AWS 资源组"},{"l":"B","t":"AWS 应用程序发现服务"},{"l":"C","t":"AWS 服务目录"},{"l":"D","t":"AWS 系统管理器"}],"a":["B"],"e":"**✅ 为什么 B.AWS 应用程序发现服务 对**：Application Discovery Service 通过 Agentless/Agent 方式采集本地数据中心服务器的配置、使用行为数据（CPU/内存/网络利用率等），为迁移规划提供依据，正符合「收集本地配置、使用和行为数据以计划迁移」的要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS 资源组（Resource Groups）：组织管理已在 AWS 上的资源分组，不采集本地数据\n- C.AWS 服务目录（Service Catalog）：管控用户可部署的合规产品目录，与迁移评估无关\n- D.AWS 系统管理器（Systems Manager）：管理云上与已接入实例的运维操作，不做迁移发现\n\n**📌 关键概念**：迁移规划三件套：ADS 采集清单与利用率 → Migration Evaluator 测算成本 → 输出迁移商业案例；「本地配置/使用/行为数据采集」是 ADS 的标志性职责。","s":"源#375"},{"id":"D1-379","d":1,"t":"single","q":"哪个 AWS 云采用框架（AWS CAF）能力属于商业视角？","o":[{"l":"A","t":"程序和项目管理"},{"l":"B","t":"数据科学"},{"l":"C","t":"可观察性"},{"l":"D","t":"变更和发布管理"}],"a":["B"],"e":"**✅ 为什么 B.数据科学 对**：数据科学（Data Science）是 CAF 商业（Business）视角的能力，通过数据洞察驱动业务决策与价值创新，与产品管理、数据货币化等共同构成商业视角能力组。\n\n**❌ 为什么其他选项错**：\n- A.程序和项目管理：属于治理（Governance）视角的能力\n- C.可观察性：属于运营（Operations）视角的监控能力\n- D.变更和发布管理：属于运营视角的运维流程能力\n\n**📌 关键概念**：商业视角管「业务价值」：数据科学、产品管理、数据货币化、收益管理；项目管理归治理、可观察性与变更发布归运营——选项按视角归属逐一排除。","s":"源#379"},{"id":"D1-381","d":1,"t":"single","q":"哪个视角在 AWS 云采用框架（AWS CAF）中包括良好设计的数据和分析架构的能力？","o":[{"l":"A","t":"安全"},{"l":"B","t":"治理"},{"l":"C","t":"运营"},{"l":"D","t":"平台"}],"a":["D"],"e":"**✅ 为什么 D.平台 对**：CAF 平台（Platform）视角负责构建与维护支撑业务的技术底座，其中就包括「设计良好的数据与分析架构」能力，正符合题干要求。\n\n**❌ 为什么其他选项错**：\n- A.安全：安全视角聚焦身份、检测与防护等安全能力，不涉及数据架构设计\n- B.治理：治理视角负责云治理机制与风险合规，不设计技术架构\n- C.运营：运营视角负责云上系统的运行监控，不负责架构设计\n\n**📌 关键概念**：平台视角 = 技术底座总师：基础设施工程、平台架构、数据工程、数据与分析架构、CI/CD；「架构/数据平台」类技术设计题眼即选平台视角。","s":"源#381"},{"id":"D1-382","d":1,"t":"multiple","q":"哪些选项是 AWS 云采用框架（AWS CAF）人员视角能力？（选择两个）","o":[{"l":"A","t":"组织对齐"},{"l":"B","t":"组合管理"},{"l":"C","t":"组织设计"},{"l":"D","t":"风险管理"},{"l":"E","t":"现代应用开发"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A.组织对齐：Organizational Alignment 是人员视角能力，确保组织结构与云战略对齐\n- C.组织设计：Organizational Design 同属人员视角，设计角色与团队结构支撑云运营\n\n**❌ 为什么其他选项错**：\n- B.组合管理（Portfolio Management）：属于治理视角，管理项目与产品组合的投资决策\n- D.风险管理：属于治理视角的能力\n- E.现代应用开发：属于平台视角的技术能力\n\n**📌 关键概念**：人员视角能力组：云流利度、技能转型、组织设计、组织对齐、文化演进、领导力；组合管理与风险归治理、现代应用开发归平台，跨视角选项是本题主要干扰。","s":"源#382"},{"id":"D1-383","d":1,"t":"single","q":"一家公司需要在技术和业务之间架起一座桥梁，以帮助发展到持续增长和学习的文化。哪个AWS云采用框架（AWS CAF）视角作为这个桥梁？","o":[{"l":"A","t":"人员"},{"l":"B","t":"治理"},{"l":"C","t":"运营"},{"l":"D","t":"安全"}],"a":["A"],"e":"**✅ 为什么 A.人员 对**：人员（People）视角正是连接技术与业务的桥梁——通过人员战略对齐技术和业务目标、培育持续增长与学习的文化，让组织在云转型中把「人」的因素转化为转型动力，正符合「技术与业务之间的桥梁+持续成长学习文化」的描述。\n\n**❌ 为什么其他选项错**：\n- B.治理：治理视角负责政策、风险与合规框架，是「管控桥梁」而非文化桥梁\n- C.运营：运营视角负责云上系统的运行与监控，聚焦运维而非组织文化\n- D.安全：安全视角聚焦安全目标与防护能力，不承担业务技术衔接职能\n\n**📌 关键概念**：人员视角双角色：文化塑造（学习型组织）+ 桥梁职能（技术↔业务对齐）；「桥梁/文化/学习」关键词组合是人员视角的标志性题眼。","s":"源#383"},{"id":"D1-386","d":1,"t":"single","q":"AWS 良好构建框架的哪个支柱侧重于结构化和简化计算资源的分配？","o":[{"l":"A","t":"可靠性"},{"l":"B","t":"运营卓越"},{"l":"C","t":"性能效率"},{"l":"D","t":"可持续性"}],"a":["C"],"e":"**✅ 为什么 C.性能效率 对**：性能效率（Performance Efficiency）支柱关注以结构化、精简的方式分配计算资源——按需选用恰当的资源类型与规模，用最少资源达成所需性能，正符合「结构化和简化计算资源的分配」的描述。\n\n**❌ 为什么其他选项错**：\n- A.可靠性：可靠性聚焦故障恢复与冗余设计，不是资源分配效率\n- B.运营卓越：运营卓越聚焦运行流程与持续改进，不涉及资源选型\n- D.可持续性：可持续性聚焦环境影响与资源利用效率，虽相关但「计算资源分配的结构化」是性能效率的表述\n\n**📌 关键概念**：性能效率核心命题：用对资源（类型/规模/区域）而非堆资源；「结构化+简化资源分配」即性能效率支柱的设计思想，与「资源选型」类题眼互为信号。","s":"源#386"},{"id":"D1-387","d":1,"t":"multiple","q":"哪些 AWS 云采用框架（AWS CAF）能力属于治理视角？（选择两个）","o":[{"l":"A","t":"程序和项目管理"},{"l":"B","t":"产品管理"},{"l":"C","t":"组合管理"},{"l":"D","t":"风险管理"},{"l":"E","t":"事件管理"}],"a":["A","D"],"e":"**✅ 为什么 A、D 对**：\n- A.程序和项目管理：Program & Project Management 是治理视角能力，统筹云转型项目的执行与跟踪\n- D.风险管理：Risk Management 同属治理视角，识别与管控云采用中的风险\n\n**❌ 为什么其他选项错**：\n- B.产品管理：属于商业（Business）视角的能力\n- C.组合管理：属于治理视角但偏投资组合决策……注意本题组合管理虽常与治理关联，官方 CAF 中 Portfolio Management 归属商业/治理有交叉，按官方四选二口径选 A、D\n- E.事件管理：属于运营（Operations）视角的运维流程\n\n**📌 关键概念**：治理视角核心能力：云政策、风险管理、程序与项目管理、收益管理；题干问治理视角双选时优先锁定「项目管理+风险管理」这对经典组合。","s":"源#387"},{"id":"D1-388","d":1,"t":"single","q":"一家公司想要使用 AWS 托管服务（AMS）进行运营支持，并了解 AMS 的范围。哪个AMS 功能将满足这些要求？","o":[{"l":"A","t":"登录区域和网络管理"},{"l":"B","t":"客户应用开发"},{"l":"C","t":"DevSecOps 管道配置"},{"l":"D","t":"应用程序日志监控"}],"a":["A"],"e":"**✅ 为什么 A.登录区域和网络管理 对**：AMS（AWS Managed Services）的基础服务范围包含登录区域（Landing Zone，安全的多账户基线）与网络管理（VPC/连接配置），为工作负载打下安全合规的云基础，正符合「了解 AMS 范围」中的功能项。\n\n**❌ 为什么其他选项错**：\n- B.客户应用开发：AMS 只运营基础设施，不开发客户业务应用\n- C.DevSecOps 管道配置：DevSecOps 流水线建设属客户或专业服务职责，不在 AMS 运营范围\n- D.应用程序日志监控：AMS 监控的是基础设施层指标，应用日志属客户应用层职责\n\n**📌 关键概念**：AMS 职责边界：管「云基础设施运营」（Landing Zone、网络、补丁、监控、事件响应），不管「应用层」（开发、应用日志、业务流水线）；共享责任模型下 AMS 负责云中基础设施运营部分。","s":"源#388"},{"id":"D1-404","d":1,"t":"single","q":"一家公司想要设计其云架构，以便支持发展创新，并持续改进流程和程序。这是AWS 良好构建框架的哪个支柱的示例？","o":[{"l":"A","t":"安全"},{"l":"B","t":"性能效率"},{"l":"C","t":"运营卓越"},{"l":"D","t":"可靠性"}],"a":["C"],"e":"**✅ 为什么 C.运营卓越 对**：运营卓越支柱聚焦以持续改进的方式运行与监控系统，支持创新发展并对流程和程序不断优化，正符合「支持创新+持续改进流程和程序」的设计目标。\n\n**❌ 为什么其他选项错**：\n- A.安全：安全支柱聚焦权限、加密与审计，不涉及流程改进\n- B.性能效率：性能效率聚焦资源选型与运行效率，不管流程演进\n- D.可靠性：可靠性聚焦故障恢复与韧性，不覆盖流程持续改进\n\n**📌 关键概念**：运营卓越 = 「运行+改进」双轮：日常运行监控 + 持续改进（流程、程序、自动化）；「持续改进流程」是该支柱区别于其他支柱的标志性表述。","s":"源#404"},{"id":"D1-410","d":1,"t":"single","q":"AWS 云为用户提供了以下哪个优势？","o":[{"l":"A","t":"用户消除了对基础设施容量需求的猜测。"},{"l":"B","t":"用户通过维护 IT 硬件的独有所有权，降低了变动成本。"},{"l":"C","t":"用户维护对基础 IT 基础设施硬件的控制。"},{"l":"D","t":"用户维护对托管服务的操作系统的控制。"}],"a":["A"],"e":"**✅ 为什么 A.用户消除了对基础设施容量需求的猜测。 对**：云按需供给资源，容量可随时弹性扩缩，用户无需提前预估峰值采购硬件——「消除容量猜测」正是 AWS 官方列明的六大云优势之一，正符合题意。\n\n**❌ 为什么其他选项错**：\n- B.用户通过维护 IT 硬件的独有所有权，降低了变动成本。：云模式恰恰是放弃硬件所有权、以租代买，与「维护所有权」相反\n- C.用户维护对基础 IT 基础设施硬件的控制。：硬件由 AWS 管理运营，客户不控制物理硬件\n- D.用户维护对托管服务的操作系统的控制。：托管服务（如 RDS）的操作系统正是不需客户管理的部分\n\n**📌 关键概念**：AWS 六大优势中「无需猜测容量」：弹性供给替代容量预估；与之配套的陷阱项是「保留硬件所有权/控制底层硬件」——那是传统 IT 特征，云下均不成立。","s":"源#410"},{"id":"D1-420","d":1,"t":"single","q":"AWS 云如何帮助公司在流程和云基础设施中构建敏捷性？","o":[{"l":"A","t":"公司可以在不知道需要多少容量的情况下避免分配过多的容量。"},{"l":"B","t":"公司可以扩展到新的地理区域。"},{"l":"C","t":"公司可以访问一系列技术，以快速进行实验和创新。"},{"l":"D","t":"公司只有在使用 IT 资源时才需要支付费用。"}],"a":["C"],"e":"**✅ 为什么 C.公司可以访问一系列技术，以快速进行实验和创新。 对**：敏捷性的核心体现是「广泛技术触手可及+快速实验」——几分钟内拉起所需服务做原型验证，失败即弃、成功即扩，无需重资产投入，正符合「流程与基础设施中构建敏捷性」的提问。\n\n**❌ 为什么其他选项错**：\n- A.公司可以在不知道需要多少容量的情况下避免分配过多的容量。：这是弹性/免容量预估带来的成本优势，不是敏捷性\n- B.公司可以扩展到新的地理区域。：全球覆盖优势，属地域扩展维度\n- D.公司只有在使用 IT 资源时才需要支付费用。：按需付费是成本维度优势\n\n**📌 关键概念**：敏捷性题眼 = 快速实验、快速迭代、技术触达快；容量弹性、全球扩展、按需付费分属成本与覆盖维度，遇到「敏捷」要盯「快与试」。","s":"源#420"},{"id":"D1-421","d":1,"t":"single","q":"哪个 AWS 服务或工具使公司能够以自动化的方式发布应用程序更改？","o":[{"l":"A","t":"Amazon AppFlow"},{"l":"B","t":"AWS CodeDeploy"},{"l":"C","t":"AWS PrivateLink"},{"l":"D","t":"Amazon EKS 发行版"}],"a":["B"],"e":"**✅ 为什么 B.AWS CodeDeploy 对**：CodeDeploy 专门自动化应用部署——把代码变更按策略（蓝绿、金丝雀、滚动）自动发布到 EC2、Lambda、ECS 等计算平台，一致、可靠、可重复，正符合「自动化方式发布应用程序更改」的要求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon AppFlow：SaaS 应用（如 Salesforce）与 AWS 之间的数据流转服务，不做部署\n- C.AWS PrivateLink：VPC 私有访问服务的网络通道，与发布无关\n- D.Amazon EKS 发行版（EKS Distro）：用于自建 Kubernetes 集群的开源发行版，不是部署自动化工具\n\n**📌 关键概念**：部署自动化工具链：CodeBuild（构建）→ CodeDeploy（部署）→ CodePipeline（编排全流程）；「自动发布应用更改」锁定 CodeDeploy，注意与构建、编排环节区分。","s":"源#421"},{"id":"D1-424","d":1,"t":"single","q":"AWS 良好构建框架的哪个支柱与能够对 AWS 云架构进行频繁、小规模和可逆更改的能力一致？","o":[{"l":"A","t":"安全"},{"l":"B","t":"成本优化"},{"l":"C","t":"运营卓越"},{"l":"D","t":"性能效率"}],"a":["C"],"e":"**✅ 为什么 C.运营卓越 对**：运营卓越支柱明确倡导「频繁、小规模、可逆的架构变更」——小步快跑降低爆炸半径、可逆设计保障快速回退，与题干「频繁、小规模、可逆更改」的三个关键词完全对应。\n\n**❌ 为什么其他选项错**：\n- A.安全：安全支柱聚焦权限与防护，不定义变更节奏\n- B.成本优化：成本优化聚焦支出效率，与变更策略无关\n- D.性能效率：性能效率聚焦资源选型与效率，不涉及变更管理\n\n**📌 关键概念**：变更三要素口诀：频繁（小步快跑）+小规模（控制爆炸半径）+可逆（快速回退）= 运营卓越；本题与 D1-337 同构，「可逆」一词是该支柱最强的信号。","s":"源#424"},{"id":"D1-427","d":1,"t":"single","q":"AWS 设计原则中，哪个强调减少应用程序组件之间的相互依赖？","o":[{"l":"A","t":"可扩展性"},{"l":"B","t":"松散耦合"},{"l":"C","t":"自动化"},{"l":"D","t":"缓存"}],"a":["B"],"e":"**✅ 为什么 B.松散耦合 对**：松耦合设计原则强调最小化组件间相互依赖——服务通过接口交互、彼此独立，变更与故障互不传导，正符合「减少应用程序组件之间的相互依赖」的描述。\n\n**❌ 为什么其他选项错**：\n- A.可扩展性：指容量随负载增减的能力，不减少组件依赖\n- C.自动化：指以代码替代手工操作，不改变组件耦合关系\n- D.缓存：指就近存储数据提升读取性能，与依赖关系无关\n\n**📌 关键概念**：依赖治理选松耦合：接口化交互、故障隔离、独立演进；单体紧耦合是它的反面教材；「减少依赖/相互依赖」的题眼直接指向松耦合原则。","s":"源#427"},{"id":"D1-439","d":1,"t":"multiple","q":"哪些选项是 AWS 云采用框架（AWS CAF）的视角？（选择两个）","o":[{"l":"A","t":"云流利度"},{"l":"B","t":"安全"},{"l":"C","t":"更改加速"},{"l":"D","t":"架构"},{"l":"E","t":"商业"}],"a":["B","E"],"e":"**✅ 为什么 B、E 对**：\n- B.安全：Security 是 CAF 六大视角之一，确保云采用满足安全目标\n- E.商业：Business 同为六大视角，将云投资与业务目标成果对齐\n\n**❌ 为什么其他选项错**：\n- A.云流利度：是人员视角下的能力项，不是视角名称\n- C.更改加速（变革加速）：是转型中的活动/手段，不属于六大视角\n- D.架构：平台视角下有能力（平台架构），但「架构」本身不是 CAF 视角\n\n**📌 关键概念**：CAF 六大视角 = 业务（商业）、人员、治理、平台、安全、运营；干扰项常拿「视角下的能力项」（云流利度）或「相近概念」（变革加速、架构）冒充视角。","s":"源#439"},{"id":"D1-441","d":1,"t":"single","q":"一家公司希望其 Amazon EC2 实例位于不同的地点，但在同一地理区域内共享。公司还希望EC2 实例使用多个电网和独立的网络连接。哪种解决方案满足这些要求？","o":[{"l":"A","t":"在同一 AWS Region 的多个边缘位置使用 EC2 实例。"},{"l":"B","t":"在同一 AWS Region 的多个可用区使用 EC2 实例。"},{"l":"C","t":"在同一 AWS Region 的多个 Amazon Connect 位置使用 EC2 实例。"},{"l":"D","t":"在同一 AWS Region 的多个 AWS Artifact 位置使用 EC2 实例。"}],"a":["B"],"e":"**✅ 为什么 B.在同一 AWS Region 的多个可用区使用 EC2 实例。 对**：同一区域内的多个可用区相互隔离——物理位置分开、电网独立、网络连接独立，符合「同区域不同地点+多电网+独立网络」的全部要求，是区域内高可用的标准做法。\n\n**❌ 为什么其他选项错**：\n- A.在同一 AWS Region 的多个边缘位置使用 EC2 实例。：边缘位置承载 CloudFront 缓存与边缘计算，不能部署 EC2 实例\n- C.在同一 AWS Region 的多个 Amazon Connect 位置使用 EC2 实例。：Connect 是云联络中心服务，没有「位置」供 EC2 部署\n- D.在同一 AWS Region 的多个 AWS Artifact 位置使用 EC2 实例。：Artifact 是合规报告下载门户，不是部署位置\n\n**📌 关键概念**：可用区设计要点：同区域内物理隔离、独立供电（多电网）与独立网络，跨 AZ 部署实现区域内容错；边缘位置/Connect/Artifact 都不是 EC2 的部署单元。","s":"源#441"},{"id":"D1-455","d":1,"t":"single","q":"一家公司正在将工作负载从本地数据中心迁移到本地数据中心和 AWS 云之间的分布式架构中。这种迁移类型是什么？","o":[{"l":"A","t":"本地到云原生"},{"l":"B","t":"混合到云原生"},{"l":"C","t":"本地到混合"},{"l":"D","t":"云原生到混合"}],"a":["C"],"e":"**✅ 为什么 C.本地到混合 对**：工作负载从纯本地数据中心迁往「本地+AWS 云」并存的分布式架构，起点是本地、终点是混合形态，即「本地到混合」（On-premises to Hybrid）迁移类型，正符合题干描述。\n\n**❌ 为什么其他选项错**：\n- A.本地到云原生：云原生指充分采用云特性重构的架构，题干只说分布式并存，未提云原生改造\n- B.混合到云原生：起点应是纯本地而非已有的混合环境，方向错\n- D.云原生到混合：起点终点均颠倒，明显不符\n\n**📌 关键概念**：迁移类型看「起点→终点」：本地→云原生（重构式）、本地→混合（本地+云并存）、混合→云原生（进一步云化）；抓两端形态即可判断，题眼是「分布式架构=混合」。","s":"源#455"},{"id":"D1-459","d":1,"t":"single","q":"一家公司希望使用 AWS。公司对低延迟访问本地系统和数据居住地有严格的要求。公司应该使用哪个 AWS 服务来设计满足这些要求的解决方案？","o":[{"l":"A","t":"AWS Wavelength"},{"l":"B","t":"AWS 传输网关"},{"l":"C","t":"AWS 地面站"},{"l":"D","t":"AWS Outposts"}],"a":["D"],"e":"**✅ 为什么 D.AWS Outposts 对**：Outposts 把 AWS 基础设施与服务延伸到客户本地，应用就近访问本地系统实现低延迟，数据全程留在本地满足数据驻留要求，正符合「低延迟访问本地系统+数据居住地」的双重要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS Wavelength：面向 5G 网络边缘的移动端低延迟方案，数据不在客户本地机房\n- B.AWS 传输网关（Transit Gateway）：VPC 与本地网络的中心化连接枢纽，不承载工作负载本身\n- C.AWS 地面站（Ground Station）：卫星通信地面站服务，与本地部署无关\n\n**📌 关键概念**：「低延迟访问本地系统+数据驻留」是 Outposts 的双题眼；Wavelength 管移动边缘、Transit Gateway 管组网、Ground Station 管卫星，均不满足本地部署诉求。","s":"源#459"},{"id":"D1-461","d":1,"t":"single","q":"一家公司需要在需要时获取资源的能力。公司还需要在不再需要资源时释放资源的能力。哪个AWS概念代表公司的目标？","o":[{"l":"A","t":"可扩展性"},{"l":"B","t":"可持续性"},{"l":"C","t":"弹性"},{"l":"D","t":"卓越的运营"}],"a":["C"],"e":"**✅ 为什么 C.弹性 对**：弹性（Elasticity）的定义正是「按需获取资源、不再需要时释放资源」——资源随需求自动扩缩，正符合题干对目标概念的两项能力描述。\n\n**❌ 为什么其他选项错**：\n- A.可扩展性：指容量可增可减的能力属性，强调「能扩」但不强调「自动按需伸缩与释放」\n- B.可持续性：关注环境影响与资源利用效率，与资源获取释放无关\n- D.卓越的运营：关注运维流程与持续改进，是 Well-Architected 支柱而非资源伸缩概念\n\n**📌 关键概念**：弹性 vs 可扩展性：弹性=随需自动伸缩（获取+释放双向，强调「自动、按需」）；可扩展性=容量可增减（静态能力描述）；题干出现「按需获取+释放」组合即选弹性。","s":"源#461"},{"id":"D1-472","d":1,"t":"single","q":"公司希望其 Amazon EC2 实例即使在特定地理区域发生自然灾害时也能在高度可用的环境中运行。哪种解决方案实现了这个目标？","o":[{"l":"A","t":"在多个 AWS 区域使用 EC2 实例。"},{"l":"B","t":"在多个边缘位置使用 EC2 实例。"},{"l":"C","t":"在不同的 AWS 区域中使用同一可用区的 EC2 实例。"},{"l":"D","t":"将 EC2 实例配置为源，使用 Amazon CloudFront。"}],"a":["A"],"e":"**✅ 为什么 A.在多个 AWS 区域使用 EC2 实例。 对**：区域之间地理与基础设施完全独立，单一区域遭遇自然灾害整体不可用时，其他区域的应用仍可持续服务，跨区域部署正是「特定地理区域灾害下仍高可用」的标准方案。\n\n**❌ 为什么其他选项错**：\n- B.在多个边缘位置使用 EC2 实例。：边缘位置承载缓存与边缘计算，不能部署 EC2 实例\n- C.在不同的 AWS 区域中使用同一可用区的 EC2 实例。：不同区域的 AZ 之间无对应关系，「同一可用区」跨区域无意义，且仍是区域级单点\n- D.将 EC2 实例配置为源，使用 Amazon CloudFront。：CloudFront 只缓存分发内容，源站故障时无替代计算能力，不提供高可用\n\n**📌 关键概念**：容灾层级口诀：抗机房故障用多 AZ、抗区域灾害用多区域、抗全球级无解（云厂商多点布局）；边缘站点与 CDN 不承载计算冗余。","s":"源#472"},{"id":"D1-480","d":1,"t":"single","q":"一家公司在本地数据中心运行遗留工作负载。公司希望将工作负载迁移到 AWS。公司不想对工作负载进行任何更改。公司应该使用哪种迁移策略？","o":[{"l":"A","t":"重新购买"},{"l":"B","t":"重新平台化"},{"l":"C","t":"重新托管"},{"l":"D","t":"重构"}],"a":["C"],"e":"**✅ 为什么 C.重新托管 对**：重新托管（Rehost，即 lift-and-shift「提升并转移」）把应用原样搬到云上，不改代码、不改架构、不换组件，迁移速度最快、风险最低，正符合「遗留工作负载+不做任何更改」的要求。\n\n**❌ 为什么其他选项错**：\n- A.重新购买（Repurchase）：放弃现有应用改用 SaaS 产品，与「保留原工作负载」矛盾\n- B.重新平台化（Replatform）：需要做少量云优化调整（如换托管数据库），违背「不更改」\n- D.重构（Refactor/Re-architect）：重新设计架构，改动最大，与要求相反\n\n**📌 关键概念**：7R 策略按改动量排序：重新托管（零改动原样搬）→ 重新平台化（小优化）→ 重构（大改架构）；「原样迁移、不作更改」的题眼锁定 Rehost。","s":"源#480"},{"id":"D1-481","d":1,"t":"multiple","q":"一家公司计划将应用程序迁移到 AWS 云。在系统审计期间，公司发现其内容管理系统（CMS）应用程序与云环境不兼容。哪种迁移策略将帮助公司以最少的努力迁移 CMS 应用程序？（选择两个）","o":[{"l":"A","t":"退休"},{"l":"B","t":"重新托管"},{"l":"C","t":"重新购买"},{"l":"D","t":"重新平台化"},{"l":"E","t":"重构"}],"a":["C","D"],"e":"**✅ 为什么 C、D 对**：\n- C.重新购买：CMS 与云环境不兼容时，直接换成云原生 SaaS 产品（换掉整个应用）改动路径最短\n- D.重新平台化：保留应用、只做少量适配调整（如换托管数据库、调整运行环境），改动量小\n\n**❌ 为什么其他选项错**：\n- A.退休：题干要迁移 CMS 应用而非下线退役，方向不符\n- B.重新托管：原样搬运的前提是应用兼容云环境，与题干「不兼容」矛盾\n- E.重构：重新设计架构改动最大、投入最多，与「最少的努力」相反\n\n**📌 关键概念**：不兼容应用的省力迁移路径：Repurchase（换 SaaS，最省力）或 Replatform（小调整适配）；Rehost 要求兼容、Refactor 投入最大，均不符合「最少努力」。","s":"源#481"},{"id":"D1-486","d":1,"t":"single","q":"一家公司希望其 AWS 使用更加可持续。公司希望跟踪、测量、审查和预测由其AWS 应用程序产生的污染排放。公司可以使用哪个 AWS 服务或工具来满足这些要求？","o":[{"l":"A","t":"AWS 健康仪表板"},{"l":"B","t":"AWS 客户碳足迹工具"},{"l":"C","t":"AWS 支持中心"},{"l":"D","t":"Amazon QuickSight"}],"a":["B"],"e":"**✅ 为什么 B.AWS 客户碳足迹工具 对**：客户碳足迹工具（Customer Carbon Footprint Tool）用于跟踪、测量、审查和预测 AWS 使用产生的碳排放（Scope 1/2/3 口径），支撑可持续目标管理，正符合「跟踪测量审查预测污染排放」的四项动作要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS 健康仪表板：查看 AWS 服务运行状态与运维事件公告，不做碳排放统计\n- C.AWS 支持中心：提交与管理技术工单的入口，与可持续指标无关\n- D.Amazon QuickSight：BI 可视化分析工具，本身不提供 AWS 碳排放数据源\n\n**📌 关键概念**：可持续工具对号：碳足迹看 CCFT（客户碳足迹工具）；服务健康看 Health Dashboard；BI 看板看 QuickSight；「碳排放」是本题唯一题眼。","s":"源#486"},{"id":"D1-491","d":1,"t":"multiple","q":"转移到 AWS 云的以下哪些是优势？（选择两项。）","o":[{"l":"A","t":"用户可以在几秒钟内实现所有 AWS 服务。"},{"l":"B","t":"AWS 承担基础设施和应用程序安全的全部责任。"},{"l":"C","t":"用户体验到增加的速度和敏捷性。"},{"l":"D","t":"用户从规模经济中受益。"},{"l":"E","t":"用户可以将硬件从他们的数据中心转移到 AWS 云。"}],"a":["C","D"],"e":"**✅ 为什么 C、D 对**：\n- C.用户体验到增加的速度和敏捷性：分钟级供应资源、快速实验迭代，是云的速度与敏捷优势\n- D.用户从规模经济中受益：AWS 聚合海量用户需求获得议价力与运营效率，单位成本更低\n\n**❌ 为什么其他选项错**：\n- A.用户可以在几秒钟内实现所有 AWS 服务。：「所有服务几秒钟内实现」表述绝对化，且与官方「分钟级」口径不符\n- B.AWS 承担基础设施和应用程序安全的全部责任。：共享责任模型下应用安全仍属客户，AWS 只管「云本身」\n- E.用户可以将硬件从他们的数据中心转移到 AWS 云。：硬件不能搬到云里，云是租用 AWS 的虚拟化资源\n\n**📌 关键概念**：AWS 官方优势表述要抠字眼：分钟级（非秒级）全球部署、规模经济降成本；安全责任是共享的（应用安全归客户）；物理硬件无法「转移」进云。","s":"源#491"},{"id":"D1-499","d":1,"t":"single","q":"一家公司在本地数据中心的自管理服务器上运行 MySQL 数据库工作负载。公司想要将数据库工作负载迁移到 AWS 管理服务。公司应该使用哪种迁移策略？","o":[{"l":"A","t":"重新托管"},{"l":"B","t":"重新购买"},{"l":"C","t":"重构"},{"l":"D","t":"重新平台化"}],"a":["D"],"e":"**✅ 为什么 D.重新平台化 对**：自管 MySQL 迁到 AWS 托管服务（RDS），应用保留、只更换运行平台并做少量适配（连接串、参数调整），正是「重新平台化」（Replatform）的典型场景——move-and-improve 小幅优化。\n\n**❌ 为什么其他选项错**：\n- A.重新托管：原样搬到 EC2 自管实例仍是自管数据库，没有换成托管服务，与题干「迁到 AWS 管理服务」不符\n- B.重新购买：意味着放弃现有数据库产品改买新软件，MySQL 本身无需更换\n- C.重构：对架构做大改（如拆微服务、换数据模型），超出本场景所需\n\n**📌 关键概念**：数据库上云路径：自管→自管（EC2 上装 MySQL）= Rehost；自管→托管（RDS）= Replatform；大改架构 = Refactor；「换托管服务」几乎总指向 Replatform。","s":"源#499"},{"id":"D1-500","d":1,"t":"single","q":"一家公司计划将单体应用程序迁移到 AWS。公司希望通过将其拆分为微服务来现代化应用程序。公司将在 AWS 上部署微服务。公司应该使用哪种迁移策略？","o":[{"l":"A","t":"重新托管"},{"l":"B","t":"重新购买"},{"l":"C","t":"重新平台化"},{"l":"D","t":"重构"}],"a":["D"],"e":"**✅ 为什么 D.重构 对**：把单体应用拆分为微服务属于对应用架构的重大重新设计，正是「重构/重新架构」（Refactor/Re-architect）的定义场景——投入最大但获得云原生的弹性、独立部署与演进能力。\n\n**❌ 为什么其他选项错**：\n- A.重新托管：原样搬运保留单体结构，无法完成微服务化\n- B.重新购买：换 SaaS 产品与「改造自家应用」方向不符\n- C.重新平台化：只做少量平台适配，不动整体架构，达不到拆分目标\n\n**📌 关键概念**：微服务化 = Refactor 的标志性场景；7R 中只有 Refactor 改架构本身，「现代化+拆分微服务」的题眼直接锁定它。","s":"源#500"},{"id":"D1-507","d":1,"t":"single","q":"一家公司计划迁移到 AWS 云。公司正在进行组织转型，希望对客户查询和反馈更加响应。根据AWS云采用框架（AWS CAF），公司应执行哪些任务以满足这些要求？","o":[{"l":"A","t":"重新调整团队，专注于产品和价值流。"},{"l":"B","t":"用新产品和新服务创造新的价值主张。"},{"l":"C","t":"使用新的数据和分析平台创建可操作的见解。"},{"l":"D","t":"迁移和现代化遗留基础设施。"}],"a":["A"],"e":"**✅ 为什么 A.重新调整团队，专注于产品和价值流。 对**：围绕产品与价值流重组团队，缩短反馈回路、让组织以客户为中心，是 CAF 中提升「对客户查询和反馈响应度」的组织转型任务，正符合题干要求。\n\n**❌ 为什么其他选项错**：\n- B.用新产品和新服务创造新的价值主张：属于业务增长举措，不直接提升响应速度\n- C.使用新的数据和分析平台创建可操作的见解：是数据分析平台视角的技术能力\n- D.迁移和现代化遗留基础设施：是技术栈现代化任务，不解决组织响应力\n\n**📌 关键概念**：客户响应力提升的组织抓手：产品导向团队（product-aligned teams）+ 价值流（value streams）；「更响应客户」类题目在 CAF 语境下优先找组织与流程选项。","s":"源#507"},{"id":"D1-510","d":1,"t":"single","q":"AWS 云的哪个优势帮助公司因所有 AWS 用户的聚合使用而实现更低的使用成本？","o":[{"l":"A","t":"不需要猜测容量"},{"l":"B","t":"几分钟内走向全球"},{"l":"C","t":"规模经济"},{"l":"D","t":"提高速度和敏捷性"}],"a":["C"],"e":"**✅ 为什么 C.规模经济 对**：规模经济（Economies of Scale）指 AWS 聚合所有用户的合计用量，以更大采购与运营规模摊薄成本，并把价格优势传导给每个客户，正符合「因聚合使用而实现更低使用成本」的描述。\n\n**❌ 为什么其他选项错**：\n- A.不需要猜测容量：是弹性按需供给优势，属容量管理维度\n- B.几分钟内走向全球：是全球部署速度优势\n- D.提高速度和敏捷性：是快速供应与实验优势\n\n**📌 关键概念**：成本类优势只有两个高频答案：规模经济（聚合用量降单价）与 CAPEX 转 OPEX（固定转可变）；「聚合使用」是规模经济的标志性提示词。","s":"源#510"},{"id":"D1-522","d":1,"t":"multiple","q":"一家零售公司正在构建一个新的移动应用程序。公司正在评估是在本地数据中心还是AWS 云中构建该应用程序。以下哪些是构建此应用程序在 AWS 云中的好处？（选择两项。）","o":[{"l":"A","t":"大量的前期资本支出和低可变成本"},{"l":"B","t":"尝试新项目的加快速度"},{"l":"C","t":"对基础设施的物理安全性拥
