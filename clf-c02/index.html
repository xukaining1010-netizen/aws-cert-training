基础设施"},{"l":"B","t":"更新 Amazon DynamoDB 实例的操作系统"},{"l":"C","t":"维护 Amazon S3 基础设施"},{"l":"D","t":"更新 Amazon EC2 实例上的客户操作系统"}],"a":["D"],"e":"在 AWS 共享责任模型中，客户负责云中的安全，其中包括任务，例如更新 Amazon EC2 实例上的客户操作系统。AWS 负责云的安全，包括维护底层基础设施。","s":"源#497"},{"id":"D3-502","d":3,"t":"single","q":"用户想要在 Amazon EC2 实例进入“停止”状态时调用 AWS Lambda 函数。哪种AWS 服务适用于此用例？","o":[{"l":"A","t":"Amazon EventBridge"},{"l":"B","t":"AWS Config"},{"l":"C","t":"Amazon Simple Notification Service (Amazon SNS)"},{"l":"D","t":"AWS CloudFormation"}],"a":["A"],"e":"Amazon EventBridge 是一个无服务器事件总线服务，将应用程序与来自各种来源的数据连接起来。它可以用来响应事件触发AWSLambda 函数，例如 Amazon EC2 实例进入“停止”状态。","s":"源#502"},{"id":"D3-503","d":3,"t":"single","q":"一家公司在本地拥有 MariaDB 数据库。公司想要将数据迁移到 AWS 云。哪个AWS 服务将以最小的运营开销托管此数据库？","o":[{"l":"A","t":"Amazon RDS"},{"l":"B","t":"Amazon Neptune"},{"l":"C","t":"Amazon S3"},{"l":"D","t":"Amazon DynamoDB"}],"a":["A"],"e":"Amazon RDS（关系数据库服务）是一个管理型数据库服务，简化了在云中创建、操作和扩展关系数据库的过程。由于AWS 处理硬件配置、数据库设置、修补和备份等耗时任务，因此它需要最小的运营开销。","s":"源#503"},{"id":"D3-505","d":3,"t":"single","q":"公司实施 AWS CloudTrail 时使用了哪个 AWS 云设计原则？","o":[{"l":"A","t":"激活可追溯性。"},{"l":"B","t":"使用无服务器计算架构。"},{"l":"C","t":"按代码执行操作。"},{"l":"D","t":"在几分钟内走向全球。"}],"a":["A"],"e":"实施 AWS CloudTrail 体现了 AWS 云设计原则“激活可追溯性”。这一原则强调了在 AWS 环境中保持清晰、详细的行动记录的重要性，以增强安全性和合规性。","s":"源#505"},{"id":"D3-508","d":3,"t":"single","q":"一家公司想要调整其 Amazon EC2 实例的大小。哪种配置更改将以最小的运营开销满足此要求？","o":[{"l":"A","t":"在另一个可用区添加 EC2 实例。"},{"l":"B","t":"根据利用率更改 EC2 实例的大小和类型。"},{"l":"C","t":"将支付方式从按需更改为储蓄计划。"},{"l":"D","t":"使用更大的实例类型重新配置 EC2 实例。"}],"a":["B"],"e":"调整 Amazon EC2 实例的大小涉及根据实际使用情况调整实例的大小和类型，以优化性能和成本。这可以通过使用 AWS 计算优化器等工具，根据使用模式推荐最合适的 EC2 实例类型，以最小的运营开销完成。","s":"源#508"},{"id":"D3-513","d":3,"t":"single","q":"系统管理员想要监控公司 Amazon EC2 实例的 CPU 利用率。哪个 AWS 服务可以提供此信息？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"AWS Trusted Advisor"},{"l":"C","t":"AWS CloudTrail"},{"l":"D","t":"Amazon CloudWatch"}],"a":["D"],"e":"Amazon CloudWatch 是用于 AWS 资源和用户在其上运行的应用程序的监控服务。它可以用于监控 Amazon EC2 实例的CPU 利用率以及其他指标，并提供资源使用和性能的详细视图。","s":"源#513"},{"id":"D3-515","d":3,"t":"single","q":"独立软件供应商想要交付和分享其自定义的 Amazon Machine Images（AMIs）给潜在客户。哪个AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Marketplace"},{"l":"B","t":"AWS Data Exchange"},{"l":"C","t":"Amazon EC2"},{"l":"D","t":"AWS Organizations"}],"a":["A"],"e":"AWS Marketplace 是一个数字目录，提供技术软件，使用户可以轻松地找到、测试、购买和部署在 AWS 上运行的软件。独立软件供应商可以使用 AWS Marketplace 向广大受众交付和分享他们的自定义 Amazon Machine Images（AMIs）。","s":"源#515"},{"id":"D3-516","d":3,"t":"single","q":"哪个组件必须附加到 VPC 以启用入站互联网访问？","o":[{"l":"A","t":"NAT 网关"},{"l":"B","t":"VPC 终端节点"},{"l":"C","t":"VPN 连接"},{"l":"D","t":"互联网网关"}],"a":["D"],"e":"互联网网关是一个水平扩展、冗余和高可用性的 VPC 组件，允许 VPC 内的实例与互联网通信。它必须附加到 VPC 以启用VPC 内实例的入站和出站互联网访问。","s":"源#516"},{"id":"D3-518","d":3,"t":"single","q":"一家公司正在构建一个应用程序，该应用程序每秒将接收数百万的数据库查询。公司需要数据存储能够扩展以满足这些需求。哪个 AWS 服务将满足此要求？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"AWS Cloud9"},{"l":"C","t":"Amazon ElastiCache for Memcached"},{"l":"D","t":"Amazon Neptune"}],"a":["A"],"e":"Amazon DynamoDB 是一个完全托管的、快速且灵活的 NoSQL 数据库服务，提供无缝的可扩展性。它可以在低延迟下处理高吞吐量，并自动扩展以适应应用程序正在处理的数据和流量。","s":"源#518"},{"id":"D3-528","d":3,"t":"single","q":"哪个 AWS 服务提供 DNS 解析？","o":[{"l":"A","t":"Amazon CloudFront"},{"l":"B","t":"Amazon VPC"},{"l":"C","t":"Amazon Route 53"},{"l":"D","t":"AWS Direct Connect"}],"a":["C"],"e":"Amazon Route 53 是一个高可用和可扩展的云域名系统（DNS）网络服务。它旨在为开发人员和企业提供一种有效且可靠的方式，将最终用户路由到互联网应用程序，提供 DNS 解析。","s":"源#528"},{"id":"D3-533","d":3,"t":"single","q":"哪个 AWS 解决方案使公司能够使用诸如 NFS 之类的协议在 Amazon S3 中存储和检索对象？","o":[{"l":"A","t":"Amazon FSx for Lustre"},{"l":"B","t":"AWS Storage Gateway 卷网关"},{"l":"C","t":"AWS Storage Gateway 文件网关"},{"l":"D","t":"Amazon Elastic File System（Amazon EFS）"}],"a":["C"],"e":"AWS Storage Gateway 文件网关使用户能够使用 NFS 或 SMB 协议在 Amazon S3 中存储和检索对象，为基于文件的应用程序提供了一种简单且成本效益高的解决方案。","s":"源#533"},{"id":"D3-535","d":3,"t":"single","q":"根据 AWS 共享责任模型，哪项任务是客户的责任？","o":[{"l":"A","t":"在 Amazon EC2 实例上部署的客户端操作系统打补丁。"},{"l":"B","t":"控制对 AWS 数据中心的物理访问。"},{"l":"C","t":"控制对 AWS 底层硬件的访问。"},{"l":"D","t":"在 Amazon S3 上部署的主机操作系统打补丁。"}],"a":["A"],"e":"根据 AWS 共享责任模型，客户负责云中的安全，其中包括任务，例如在 Amazon EC2 实例上部署的客户端操作系统打补丁。AWS 负责云的安全，包括对数据中心和底层硬件的物理访问。","s":"源#535"},{"id":"D3-537","d":3,"t":"single","q":"一家公司想要使用自动化视频分析来识别进入其办公室的员工。哪个 AWS 服务将满足此要求？","o":[{"l":"A","t":"Amazon Rekognition"},{"l":"B","t":"Amazon Polly"},{"l":"C","t":"Amazon Cognito"},{"l":"D","t":"AWS Lambda"}],"a":["A"],"e":"Amazon Rekognition 是一项提供基于深度学习的图像和视频分析的服务。它可以用于识别图像和视频中的对象、人员、文本、场景和活动，非常适合用于自动化视频分析以识别员工。","s":"源#537"},{"id":"D3-542","d":3,"t":"single","q":"一家电子商务公司想要在其托管网站的 Amazon EC2 实例之间分配流量。哪个AWS 服务或资源将满足这些要求？","o":[{"l":"A","t":"应用程序负载均衡器"},{"l":"B","t":"AWS WAF"},{"l":"C","t":"AWS CloudHSM"},{"l":"D","t":"AWS Direct Connect"}],"a":["A"],"e":"应用程序负载均衡器可以在多个 Amazon EC2 实例之间分配传入的网络流量，这对于需要为可扩展性和可靠性平衡流量的电子商务网站非常理想。","s":"源#542"},{"id":"D3-547","d":3,"t":"single","q":"一家公司需要维持带宽吞吐量并提供比基于公共互联网的连接更一致的网络体验。公司应该选择哪个AWS 服务？","o":[{"l":"A","t":"AWS VPN"},{"l":"B","t":"AWS Direct Connect"},{"l":"C","t":"Amazon Connect"},{"l":"D","t":"Amazon CloudFront"}],"a":["B"],"e":"AWS Direct Connect 提供了从客户场所到 AWS 的专用网络连接，可以提供比公共互联网连接更一致的网络体验，具有更高的带宽吞吐量。它非常适合需要可靠和高性能网络连接到 AWS 的用例。","s":"源#547"},{"id":"D3-550","d":3,"t":"single","q":"一家公司需要使用 SQL 语法直接查询 Amazon S3 存储桶中的对象。公司可以使用哪个AWS 服务来满足此要求？","o":[{"l":"A","t":"AWS Glue"},{"l":"B","t":"Amazon Athena"},{"l":"C","t":"AWS Lambda"},{"l":"D","t":"Amazon Kinesis"}],"a":["B"],"e":"Amazon Athena 是一个交互式查询服务，允许用户使用标准 SQL 语法直接从 Amazon S3 分析数据。它是一个无服务器服务，使用户可以轻松地使用 SQL 查询 S3 中的数据，无需专用的数据分析基础设施。","s":"源#550"},{"id":"D3-551","d":3,"t":"single","q":"一家公司使用 Amazon RDS 进行产品数据库。公司希望确保数据库高度可用。哪个Amazon RDS 功能将满足此要求？","o":[{"l":"A","t":"读取副本"},{"l":"B","t":"蓝/绿部署"},{"l":"C","t":"多 AZ 部署"},{"l":"D","t":"预留实例"}],"a":["C"],"e":"Amazon RDS 中的多 AZ 部署旨在为数据库提供高可用性。它自动在不同的可用区创建主数据库的同步备用副本，可以在发生故障时接管，确保高可用性。","s":"源#551"},{"id":"D3-552","d":3,"t":"single","q":"哪个 AWS 服务为容器提供无服务器计算？","o":[{"l":"A","t":"Amazon Simple Queue Service（Amazon SQS）"},{"l":"B","t":"AWS Fargate"},{"l":"C","t":"AWS Elastic Beanstalk"},{"l":"D","t":"Amazon SageMaker"}],"a":["B"],"e":"AWS Fargate 是一个无服务器计算引擎，适用于容器，可与 Amazon Elastic Container Service（ECS）和 Amazon Elastic Kubernetes Service （EKS）配合使用。它允许用户在不管理底层服务器或集群基础设施的情况下运行容器。","s":"源#552"},{"id":"D3-555","d":3,"t":"single","q":"一家公司计划将 Amazon EC2 实例用作 Web 服务器。来自世界各地的客户将使用这些Web 服务器。大多数客户每天只会在特定时段使用 Web 服务器。公司应如何部署 EC2 实例以实现最低运营成本？","o":[{"l":"A","t":"在多个可用区"},{"l":"B","t":"在自动扩展组中"},{"l":"C","t":"在放置组中"},{"l":"D","t":"在私有子网中"}],"a":["B"],"e":"在自动扩展组中部署 EC2 实例允许公司根据需求扩展实例，确保资源得到有效利用，成本最小化。这对于具有变化使用模式的Web 服务器特别有效，例如那些在全球特定时段服务客户的服务器。","s":"源#555"},{"id":"D3-558","d":3,"t":"single","q":"一家公司需要对最近的 AWS 账户活动进行审计。审计将调查谁发起了一个事件以及执行了哪些操作。公司应该使用哪个 AWS 服务来满足这些要求？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"Amazon Rekognition"},{"l":"C","t":"AWS CloudTrail"},{"l":"D","t":"Amazon Simple Notification Service（Amazon SNS）"}],"a":["C"],"e":"AWS CloudTrail 是一项服务，提供您的 AWS 账户活动事件历史记录，包括通过 AWS 管理控制台、AWS SDK、AWS CLI 和更高级别的服务（如 AWS CloudFormation）采取的操作。它使您能够通过跟踪和分析这些事件来进行审计。","s":"源#558"},{"id":"D3-560","d":3,"t":"single","q":"一家公司需要使用 AWS 技术部署静态网站。哪种解决方案以最小的运营开销满足此要求？","o":[{"l":"A","t":"在 Amazon EC2 上部署网站。"},{"l":"B","t":"在 AWS Elastic Beanstalk 上托管网站。"},{"l":"C","t":"使用 Amazon Lightsail 部署网站。"},{"l":"D","t":"在 Amazon S3 上托管网站。"}],"a":["D"],"e":"Amazon S3 是一个高度耐用且可扩展的对象存储服务，可用于以最小的运营开销托管静态网站。它不需要服务器管理，并提供了一种简单的方式来部署和管理静态网站。","s":"源#560"},{"id":"D3-561","d":3,"t":"single","q":"AWS 成本探索器可以提供哪些建议来帮助降低成本？","o":[{"l":"A","t":"使用特定的数据库引擎。"},{"l":"B","t":"更改应用程序的编程语言。"},{"l":"C","t":"部署特定的操作系统。"},{"l":"D","t":"终止空闲实例。"}],"a":["D"],"e":"AWS 成本探索器是一个工具，使用户能够可视化、理解和管理他们的 AWS 成本和使用情况随时间的变化。它可以提供的建议之一，以帮助降低成本是识别和终止不在使用但仍然累积费用的空闲实例。","s":"源#561"},{"id":"D3-564","d":3,"t":"single","q":"哪个 Amazon EC2 预留实例的期限承诺将为用户提供最大的成本节省？","o":[{"l":"A","t":"1 年"},{"l":"B","t":"2 年"},{"l":"C","t":"3 年"},{"l":"D","t":"5 年"}],"a":["C"],"e":"Amazon EC2 预留实例在期限承诺越长时，相比按需实例提供更大的成本节省。3 年的期限承诺通常比 1 年或 2 年的承诺提供最大的成本节省。","s":"源#564"},{"id":"D3-569","d":3,"t":"single","q":"一家公司将在未来 3 年内在 Amazon EC2 实例上运行可预测的计算工作负载。工作负载对公司至关重要。公司想要优化运行工作负载的成本。哪种解决方案将满足这些要求？","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"专用主机"},{"l":"C","t":"储蓄计划"},{"l":"D","t":"按需实例"}],"a":["C"],"e":"储蓄计划为一致使用计算服务提供了显著的成本节省，超过了按需费率。对于一个可预测且关键的计算工作负载，将持续运行固定期限，例如 3 年，储蓄计划可以通过承诺一致的使用量来提供成本效益解决方案。","s":"源#569"},{"id":"D3-573","d":3,"t":"multiple","q":"一家公司已将其工作负载迁移到 AWS 云。公司想要优化现有的 Amazon EC2 资源。哪些AWS 服务或工具提供此功能？（选择两项。）","o":[{"l":"A","t":"AWS Elastic Beanstalk"},{"l":"B","t":"AWS 成本探索器"},{"l":"C","t":"Amazon Detective"},{"l":"D","t":"AWS 计算优化器"},{"l":"E","t":"AWS 计费指挥家"}],"a":["B","D"],"e":"AWS 成本探索器和 AWS 计算优化器是可以帮助优化 Amazon EC2 资源的工具。AWS 成本探索器提供了成本和使用情况的详细视图，而 AWS 计算优化器根据使用模式提供有关最佳实例类型和大小的建议，有助于降低成本。","s":"源#573"},{"id":"D3-586","d":3,"t":"single","q":"一家公司需要了解该公司创建的 AWS 资源的事件历史记录。 哪项 AWS 服务将提供此信息？","o":[{"l":"A","t":"Amazon CloudWatch"},{"l":"B","t":"AWS CloudTrail"},{"l":"C","t":"Amazon Aurora"},{"l":"D","t":"Amazon EventBridge"}],"a":["B"],"e":"AWS CloudTrail 是提供事件历史记录的服务，它跟踪与 AWS 资源相关的 API 调用和其他活动，允许公司获取有关创建了哪些资源的信息。","s":"源#586"},{"id":"D3-587","d":3,"t":"single","q":"一家公司想在 AWS 云中运行关系数据库。该公司想使用一项托管服务，该服务将安装数据库并运行定期的软件更新。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"Amazon Elastic Block Store（Amazon EBS）"},{"l":"D","t":"Amazon DynamoDB"}],"a":["B"],"e":"Amazon Relational Database Service（Amazon RDS）是一项托管服务，允许公司在 AWS 云中运行关系数据库。它负责安装数据库和执行定期的软件更新，满足公司的需求。","s":"源#587"},{"id":"D3-588","d":3,"t":"single","q":"哪项 AWS 服务为高度连接的数据集提供完全托管的图数据库？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"Amazon Neptune"},{"l":"D","t":"Amazon Aurora"}],"a":["C"],"e":"Amazon Neptune 是 AWS 提供的一项完全托管的图数据库服务，专为处理高度连接的数据集和基于图的查询而设计。","s":"源#588"},{"id":"D3-590","d":3,"t":"single","q":"一家公司希望通过实施每次运行 4 小时的基于容器的服务来更新其在线数据处理应用程序。该公司不想配置或管理服务器实例。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Lambda"},{"l":"B","t":"AWS Fargate"},{"l":"C","t":"Amazon EC2"},{"l":"D","t":"AWS Elastic Beanstalk"}],"a":["B"],"e":"AWS Fargate 是一种无服务器计算引擎，允许用户运行容器，而无需配置或管理服务器。它适合公司运行基于容器的服务且每次运行4 小时的需求，无需管理服务器实例。","s":"源#590"},{"id":"D3-592","d":3,"t":"single","q":"根据 AWS 共享责任模型，哪项任务是 AWS 的责任？","o":[{"l":"A","t":"对 Amazon EC2 实例应用客操作系统补丁。"},{"l":"B","t":"提供人力资源信息管理（HRIM）系统的监控。"},{"l":"C","t":"对 Amazon RDS 实例执行自动备份。"},{"l":"D","t":"优化运行 AWS 服务的成本。"}],"a":["C"],"e":"根据 AWS 共享责任模型，AWS 负责对 Amazon RDS 实例进行自动备份。客户负责其他任务，如应用 Amazon EC2 实例的客操作系统补丁。","s":"源#592"},{"id":"D3-593","d":3,"t":"single","q":"用户需要对附加到 Amazon EC2 实例的 Amazon Elastic Block Store（Amazon EBS）卷进行一次性备份。执行此备份的最有效操作方式是什么？","o":[{"l":"A","t":"将另一个 EBS 卷附加到 EC2 实例，并复制内容。"},{"l":"B","t":"将 EBS 卷复制到在 AWS 外部运行并与 AWS Direct Connect 连接的服务器。"},{"l":"C","t":"创建卷的 EBS 快照。"},{"l":"D","t":"创建自定义脚本将 EBS 文件内容复制到 Amazon S3。"}],"a":["C"],"e":"创建 EBS 快照是对附加到 Amazon EC2 实例的 Amazon Elastic Block Store（Amazon EBS）卷进行一次性备份的最有效操作方式。快照可以快速轻松地创建，并且在需要时可以用于将卷恢复到以前的状态。","s":"源#593"},{"id":"D3-594","d":3,"t":"single","q":"一位没有 AWS 云经验的开发人员希望使用 AWS 技术构建 Web 应用程序。 开发人员应该使用哪项AWS 服务来开始构建应用程序？","o":[{"l":"A","t":"Amazon SageMaker"},{"l":"B","t":"AWS Lambda"},{"l":"C","t":"Amazon Lightsail"},{"l":"D","t":"Amazon Elastic Container Service（Amazon ECS）"}],"a":["C"],"e":"Amazon Lightsail 是一项简单易用的服务，适合没有 AWS 云经验的开发人员。它提供预配置的环境和资源，使开发人员更容易在AWS云上开始构建 Web 应用程序。","s":"源#594"},{"id":"D3-596","d":3,"t":"single","q":"哪项 AWS 服务专为运行包含 NoSQL 数据库的工作负载的用户设计？","o":[{"l":"A","t":"Amazon RDS"},{"l":"B","t":"Amazon S3"},{"l":"C","t":"Amazon Redshift"},{"l":"D","t":"Amazon DynamoDB"}],"a":["D"],"e":"Amazon DynamoDB 是一项完全托管的 NoSQL 数据库服务，专为需要可扩展和灵活的 NoSQL 数据库的工作负载而设计。","s":"源#596"},{"id":"D3-597","d":3,"t":"single","q":"一家公司在 AWS 上有一个网站。该公司希望将网站交付给全球受众，并为全球用户提供低延迟响应时间。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS CloudFormation"},{"l":"B","t":"Amazon CloudFront"},{"l":"C","t":"Amazon ElastiCache"},{"l":"D","t":"Amazon DynamoDB"}],"a":["B"],"e":"Amazon CloudFront 是一种内容分发网络（CDN）服务，可以缓存和向全球用户交付网站内容，减少延迟并提高网站的性能。","s":"源#597"},{"id":"D3-598","d":3,"t":"single","q":"一家公司希望在其网站上添加一个对话式聊天机器人。 该公司可以使用以下哪项AWS 服务来满足这一需求？","o":[{"l":"A","t":"Amazon Textract（Amazon Textract）"},{"l":"B","t":"Amazon Lex（Amazon Lex）"},{"l":"C","t":"AWS Glue"},{"l":"D","t":"Amazon Rekognition（Amazon Rekognition）"}],"a":["B"],"e":"基于该公司在其网站上添加对话式聊天机器人的需求，最适合此目的的 AWS 服务是：B. Amazon Lex Amazon Lex 是正确选择，原因如下：1. 专为聊天机器人打造：Amazon Lex 是专门设计用于帮助开发人员利用语音和文本，将对话界面融入任何应用程序的工具。2. 自然语言理解：它运用先进的深度学习功能，通过自动语音识别（ASR）将语音转换为文本，并借助自然语言理解（NLU）识别文本意图。3. 易于集成：Amazon Lex 可以轻松集成到网站、移动应用程序和聊天平台中。4. 可扩展性：它是一项完全托管的服务，可自动扩展以支持具有大量且变化频繁的对话量的应用程序。5. 人工智能驱动：Lex 使用与驱动Amazon Alexa 相同的深度学习技术，提供复杂的自然语言交互体验。其他选项不适合构建对话式聊天机器人： - Amazon Textract 用于从扫描文档中提取文本和数据。 - AWS Glue 是一项完全托管的提取、转换和加载（ETL）服务。- Amazon Rekognition 用于图像和视频分析。要使用Amazon Lex 开始构建聊天机器人，通常可以按以下步骤进行：1. 设计对话流程。2. 使用Amazon Lex 控制台构建并测试聊天机器人。3. 使用 AWS 软件开发工具包（SDK）或应用程序编程接口（API）将聊天机器人集成到您的网站。有关实施Amazon Lex 的功能、定价和最佳实践的最新信息，建议查阅 AWS 官方文档。","s":"源#598"},{"id":"D3-599","d":3,"t":"single","q":"哪项 AWS 服务或功能可用于监控在 Amazon EC2 上运行的系统上的潜在磁盘写入峰值？","o":[{"l":"A","t":"AWS CloudTrail"},{"l":"B","t":"AWS Health Dashboard"},{"l":"C","t":"AWS Trusted Advisor"},{"l":"D","t":"Amazon CloudWatch"}],"a":["D"],"e":"Amazon CloudWatch 可用于监控在 Amazon EC2 上运行的系统上的各种指标和事件，包括磁盘写入活动。它可以提醒公司注意潜在的磁盘写入峰值，并帮助他们监控系统的性能。","s":"源#599"},{"id":"D3-600","d":3,"t":"single","q":"一家公司有控制本地工厂设备的应用程序。 该公司应该使用哪项 AWS 服务来运行这些应用程序，以实现最低延迟？","o":[{"l":"A","t":"AWS Outposts"},{"l":"B","t":"Amazon EC2"},{"l":"C","t":"AWS Lambda"},{"l":"D","t":"AWS Fargate"}],"a":["A"],"e":"AWS Outposts 将 AWS 基础设施带到本地位置，通过允许应用程序在更靠近工厂设备的地方运行来减少延迟。这对于需要低延迟和与本地设备进行实时交互的应用程序特别有益。","s":"源#600"},{"id":"D3-604","d":3,"t":"single","q":"公司可以使用哪个 VPC 组件在 Amazon EC2 实例级别设置虚拟防火墙？","o":[{"l":"A","t":"网络访问控制列表（Network ACL）"},{"l":"B","t":"安全组"},{"l":"C","t":"路由表"},{"l":"D","t":"NAT 网关"}],"a":["B"],"e":"安全组在 Amazon EC2 实例级别充当虚拟防火墙，允许公司根据特定规则控制进出实例的入站和出站流量。","s":"源#604"},{"id":"D3-607","d":3,"t":"single","q":"一家公司需要使用 Amazon S3 存储每个大小为 5 兆字节的音频文件。该公司将频繁访问这些文件，并且必须能够立即检索这些文件。哪种 S3 存储类将最具成本效益地满足这些要求？","o":[{"l":"A","t":"S3 标准"},{"l":"B","t":"S3 标准 - 不频繁访问（S3 Standard - IA）"},{"l":"C","t":"S3 Glacier 灵活检索"},{"l":"D","t":"S3 Glacier 深度存档"}],"a":["A"],"e":"根据提供的要求，存储需要频繁访问并立即检索的 5MB 音频文件，最具成本效益的 S3 存储类别是：A. S3 标准以下是S3 标准是此场景下最佳选择的原因：1. 频繁访问：S3 标准旨在存储频繁访问的数据，这与公司频繁访问文件的要求相符。2. 立即检索：S3 标准提供毫秒级访问时间，满足立即检索文件的要求。3. 无最小对象大小限制：与其他一些存储类别不同，S3 标准没有最小对象大小要求，适合存储5MB的文件。4. 无最小存储时长要求：S3 标准没有最低存储时长要求，允许在文件管理上具有灵活性。5. 频繁访问的成本效益：尽管S3 标准与其他类别相比可能存储成本更高，但由于检索成本较低，对于频繁访问的数据来说更具成本效益。其他选项不太适合的原因如下：- S3 标准-低频访问（B）是为不频繁访问的数据设计的，并且有 128KB 的最小对象大小要求，这可能导致较小文件的额外费用。- S3 Glacier 灵活检索（C）和S3Glacier 深归档（D）是具有更长检索时间的归档存储类别，不适合立即访问要求。","s":"源#607"},{"id":"D3-608","d":3,"t":"single","q":"一家公司希望在 1 周内建立从本地到 AWS 云的安全网络连接。 哪种解决方案将满足这些要求？","o":[{"l":"A","t":"AWS Direct Connect"},{"l":"B","t":"Amazon VPC"},{"l":"C","t":"AWS Site - to - Site VPN"},{"l":"D","t":"边缘位置"}],"a":["C"],"e":"AWS Site - to - Site VPN 是一种快速简便的方法，可以在本地和 AWS 云之间建立安全的网络连接。它可以在短时间内设置，适合公司在1 周内建立连接的要求。","s":"源#608"},{"id":"D3-614","d":3,"t":"multiple","q":"哪些 AWS 网络服务或功能在提供 IP 地址范围时允许使用 CIDR 块表示法？（选择两项）","o":[{"l":"A","t":"安全组"},{"l":"B","t":"Amazon Machine Image（AMI）"},{"l":"C","t":"网络访问控制列表（网络 ACL）"},{"l":"D","t":"AWS Budgets"},{"l":"E","t":"Amazon Elastic Block Store（Amazon EBS）"}],"a":["A","C"],"e":"AWS 中的安全组和网络访问控制列表（网络 ACL）在指定 IP 地址范围时允许使用 CIDR 块表示法，用于控制网络流量。","s":"源#614"},{"id":"D3-615","d":3,"t":"single","q":"一家公司想要开发一个将文本转换为可听语音的可访问性应用程序。 哪项 AWS 服务将满足此要求？","o":[{"l":"A","t":"Amazon MQ"},{"l":"B","t":"Amazon Polly"},{"l":"C","t":"Amazon Neptune"},{"l":"D","t":"Amazon Timestream"}],"a":["B"],"e":"Amazon Polly 是一项文本到语音的服务，可以将文本转换为自然流畅的语音，适合用于开发将文本转换为可听语音的可访问性应用程序。","s":"源#615"},{"id":"D3-616","d":3,"t":"single","q":"一家公司需要在其本地数据中心和 AWS 云之间建立专用网络连接，且该网络不能使用公共互联网。哪项 AWS 服务或功能将满足这些要求？","o":[{"l":"A","t":"AWS Transit Gateway"},{"l":"B","t":"AWS VPN"},{"l":"C","t":"Amazon CloudFront"},{"l":"D","t":"AWS Direct Connect"}],"a":["D"],"e":"AWS Direct Connect 提供了本地数据中心和 AWS 云之间的专用网络连接，绕过了公共互联网，确保了更安全和可靠的连接。","s":"源#616"},{"id":"D3-621","d":3,"t":"single","q":"使用弹性负载均衡（ELB）负载均衡器与在 AWS 云中运行的应用程序一起使用的好处是什么？","o":[{"l":"A","t":"ELB 将自动扩展资源以满足容量需求。"},{"l":"B","t":"ELB 可以在多个计算资源之间平衡流量。"},{"l":"C","t":"ELB 可以在多个互联网网关之间平衡流量。"},{"l":"D","t":"ELB 可以跨越多个 AWS 区域。"}],"a":["B"],"e":"使用弹性负载均衡（ELB）负载均衡器的主要好处是在多个计算资源之间分配流量，确保应用程序的高效利用和提高可用性。","s":"源#621"},{"id":"D3-622","d":3,"t":"single","q":"一家公司需要将视频文件和音频文件转换为可在智能手机上播放的格式。 哪项AWS 服务将满足此要求？","o":[{"l":"A","t":"Amazon Comprehend"},{"l":"B","t":"Amazon Rekognition"},{"l":"C","t":"Amazon Elastic Transcoder"},{"l":"D","t":"Amazon Polly"}],"a":["C"],"e":"Amazon Elastic Transcoder 旨在将视频和音频文件转换为不同的格式，使其与各种设备（包括智能手机）兼容。","s":"源#622"},{"id":"D3-623","d":3,"t":"single","q":"一家公司希望安全地存储 Amazon RDS 数据库凭据，并自动定期轮换用户密码。哪项AWS 服务或功能将满足这些要求？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"AWS Systems Manager Parameter Store"},{"l":"C","t":"AWS Secrets Manager"},{"l":"D","t":"AWS CloudTrail"}],"a":["C"],"e":"AWS Secrets Manager 用于安全地存储和管理机密信息，如数据库凭据，并可以自动轮换密码以增强安全性。","s":"源#623"},{"id":"D3-625","d":3,"t":"single","q":"一家公司需要一个可管理的 NFS 文件系统，该公司可以将其与 AWS 计算资源一起使用。哪项AWS服务或功能将满足这些要求？","o":[{"l":"A","t":"Amazon Elastic Block Store（Amazon EBS）"},{"l":"B","t":"AWS Storage Gateway Tape Gateway"},{"l":"C","t":"Amazon S3 Glacier Flexible Retrieval"},{"l":"D","t":"Amazon Elastic File System（Amazon EFS）"}],"a":["D"],"e":"Amazon Elastic File System（Amazon EFS）提供了一个可管理的 NFS 文件系统，可以轻松地与 AWS 计算资源集成，允许在多个实例之间共享存储。","s":"源#625"},{"id":"D3-630","d":3,"t":"single","q":"哪项 AWS 服务可以创建从本地到 AWS 云的专用网络连接？","o":[{"l":"A","t":"AWS Config"},{"l":"B","t":"虚拟私有云（Amazon VPC）"},{"l":"C","t":"AWS Direct Connect"},{"l":"D","t":"Amazon Route 53"}],"a":["C"],"e":"AWS Direct Connect 提供了本地到 AWS 云的专用、私有网络连接。这允许进行安全可靠的数据传输，具有低延迟。通过AWS DirectConnect，公司可以建立与 AWS 云的直接连接，而无需通过公共互联网，确保更私密和稳定的网络连接。","s":"源#630"},{"id":"D3-632","d":3,"t":"single","q":"哪项 AWS 服务使用语音到文本转换来帮助用户创建会议记录？","o":[{"l":"A","t":"Amazon Polly"},{"l":"B","t":"Amazon Textract"},{"l":"C","t":"Amazon Rekognition"},{"l":"D","t":"Amazon Transcribe"}],"a":["D"],"e":"Amazon Transcribe 是一项 AWS 服务，专门从事语音到文本的转换。它可以将音频记录转录为文本，这对于创建会议记录非常有用。通过使用 Amazon Transcribe，用户可以节省手动转录音频内容的时间和精力。","s":"源#632"},{"id":"D3-637","d":3,"t":"single","q":"一家公司希望跟踪特定 AWS 环境中所有 Amazon EC2 实例的每月成本和使用情况。哪项AWS 服务或工具将满足这些要求？","o":[{"l":"A","t":"AWS Cost Anomaly Detection"},{"l":"B","t":"AWS Budgets"},{"l":"C","t":"AWS Compute Optimizer"},{"l":"D","t":"AWS Trusted Advisor"}],"a":["B"],"e":"AWS Budgets 允许公司设置预算并跟踪 AWS 资源（包括 Amazon EC2 实例）的成本和使用情况。它在使用或成本超过定义的阈值时提供通知和警报，帮助公司有效地监控和管理其支出。","s":"源#637"},{"id":"D3-643","d":3,"t":"single","q":"哪项 AWS 服务使用边缘位置来缓存内容？","o":[{"l":"A","t":"Amazon Kinesis"},{"l":"B","t":"Amazon Simple Queue Service（Amazon SQS）"},{"l":"C","t":"Amazon CloudFront"},{"l":"D","t":"Amazon Route 53"}],"a":["C"],"e":"Amazon CloudFront 使用全球边缘位置网络来缓存内容，使其更接近最终用户，减少延迟并提高内容交付的性能。通过在边缘缓存内容，CloudFront 可以更快速有效地交付内容。","s":"源#643"},{"id":"D3-644","d":3,"t":"single","q":"一家公司希望从 Amazon EC2 实例安全地访问 Amazon S3 存储桶，而无需访问互联网。该公司应该使用什么来实现此目标？","o":[{"l":"A","t":"VPN 连接"},{"l":"B","t":"互联网网关"},{"l":"C","t":"VPC 端点"},{"l":"D","t":"NAT 网关"}],"a":["C"],"e":"VPC 端点允许从 VPC 内部私有且安全地访问 Amazon S3，无需通过互联网。它提供了 EC2 实例和 S3 存储桶之间的直接连接，确保数据传输安全高效。","s":"源#644"},{"id":"D3-645","d":3,"t":"single","q":"一家公司希望使用一项 AWS 服务，该服务可以自动将软件部署到 Amazon EC2 实例和本地实例。哪项 AWS 服务将满足此要求？","o":[{"l":"A","t":"AWS CodeCommit"},{"l":"B","t":"AWS CodeBuild"},{"l":"C","t":"AWS CodeDeploy"},{"l":"D","t":"AWS CodePipeline"}],"a":["C"],"e":"AWS CodeDeploy 旨在自动将软件部署到各种计算实例，包括 Amazon EC2 实例和本地实例。它简化了应用程序的部署过程，并确保一致和可靠的部署。","s":"源#645"},{"id":"D3-646","d":3,"t":"multiple","q":"哪些 AWS 服务是无服务器的？（选择两项）","o":[{"l":"A","t":"AWS Fargate"},{"l":"B","t":"Amazon Managed Streaming for Apache Kafka"},{"l":"C","t":"Amazon EMR"},{"l":"D","t":"Amazon S3"},{"l":"E","t":"Amazon EC2"}],"a":["A","D"],"e":"AWS Fargate 是一种无服务器计算引擎，允许用户运行容器而无需管理底层服务器。Amazon S3 是一种无服务器对象存储服务，自动扩展以处理大量数据。这两项服务都抽象了管理服务器的需求，提供了无服务器体验。","s":"源#646"},{"id":"D3-649","d":3,"t":"single","q":"一家公司应该使用哪项 AWS 服务来组织、表征和搜索大量图像？","o":[{"l":"A","t":"Amazon Transcribe"},{"l":"B","t":"Amazon Rekognition"},{"l":"C","t":"Amazon Aurora"},{"l":"D","t":"Amazon QuickSight"}],"a":["B"],"e":"Amazon Rekognition 是一项 AWS 服务，提供图像和视频分析能力。它可以用于组织、表征和搜索大量图像，实现图像分类、对象检测和面部识别等任务。","s":"源#649"},{"id":"D3-652","d":3,"t":"single","q":"Amazon EC2 按需实例的推荐用例是什么？","o":[{"l":"A","t":"需要特定 EC2 实例配置且长时间稳定运行的工作负载。"},{"l":"B","t":"可以中断且成本最低的项目所需的工作负载。"},{"l":"C","t":"不需要长期承诺的不可预测工作负载。"},{"l":"D","t":"预计运行超过 1 年的工作负载。"}],"a":["C"],"e":"Amazon EC2 按需实例适用于不需要长期承诺的不可预测工作负载。对于此类工作负载，公司可以根据实际使用情况支付实例费用，无需提前预订或签订长期合同。这使其成为需求模式变化的工作负载的理想选择。","s":"源#652"},{"id":"D3-653","d":3,"t":"single","q":"一家公司希望使用 AWS 网络解决方案，该方案可以作为多个 VPC 和本地网络之间的集中网关。哪项 AWS 服务或功能将满足此要求？","o":[{"l":"A","t":"网关 VPC 端点"},{"l":"B","t":"AWS Direct Connect"},{"l":"C","t":"AWS Transit Gateway"},{"l":"D","t":"AWS PrivateLink"}],"a":["C"],"e":"AWS Transit Gateway 充当多个 VPC 和本地网络之间的集中网关，为复杂环境提供可扩展和高效的网络解决方案。它简化了网络拓扑结构，允许不同部分的基础设施之间进行无缝通信。","s":"源#653"},{"id":"D3-657","d":3,"t":"single","q":"一家公司在 AWS 上托管 Web 应用程序，通过配置多个 Amazon EC2 实例提高了应用程序的可用性。该公司希望在这些容器之间分发流量，同时为 Web 提供单一联系点。 哪项 AWS 服务可以将流量分发到多个EC2 实例作为目标？","o":[{"l":"A","t":"VPC 端点"},{"l":"B","t":"应用程序负载均衡器"},{"l":"C","t":"NAT 网关"},{"l":"D","t":"互联网网关"}],"a":["B"],"e":"应用程序负载均衡器可以将流量分发到多个 EC2 实例，确保 Web 应用程序的高可用性和可扩展性。它为客户端提供单一联系点，并根据配置的规则智能地将流量路由到适当的实例。","s":"源#657"},{"id":"D3-658","d":3,"t":"single","q":"Amazon S3 中可以存储的数据总量是多少？","o":[{"l":"A","t":"10 PB"},{"l":"B","t":"50 PB"},{"l":"C","t":"100 PB"},{"l":"D","t":"几乎无限"}],"a":["D"],"e":"Amazon S3 提供几乎无限的存储容量，允许公司存储和管理大量数据，而无需担心具体的容量限制。它可以扩展以满足各种规模企业的需求。","s":"源#658"},{"id":"D3-660","d":3,"t":"single","q":"一家公司将数据存储在 Amazon S3 存储桶中。 哪项任务是 AWS 的责任？","o":[{"l":"A","t":"配置 S3 生命周期政策。"},{"l":"B","t":"激活 S3 版本控制。"},{"l":"C","t":"配置 S3 存储桶政策。"},{"l":"D","t":"保护支持 S3 存储的基础设施。"}],"a":["D"],"e":"AWS 负责保护支持 S3 存储的基础设施，包括确保底层硬件和网络的可靠性、可用性和安全性。配置 S3 生命周期政策、激活S3 版本控制和配置 S3 存储桶政策通常是客户的任务，他们可以根据具体需求管理和定制 S3 存储桶的行为。","s":"源#660"},{"id":"D3-661","d":3,"t":"single","q":"一家公司希望将当前在其自己的数据中心运行的虚拟 Windows Server 2022 转移到AWS。该公司希望自动将现有服务器转换为直接在 AWS 基础设施上运行，而不是在虚拟化硬件上运行。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS DataSync"},{"l":"B","t":"AWS Database Migration Service（AWS DMS）"},{"l":"C","t":"AWS Application Discovery Service"},{"l":"D","t":"AWS Application Migration Service"}],"a":["D"],"e":"AWS Application Migration Service 旨在将应用程序（包括虚拟机）迁移到 AWS。它可以自动将现有虚拟 Windows Server 2022 转换为直接在 AWS 基础设施上运行，消除了对虚拟化硬件的需求。","s":"源#661"},{"id":"D3-662","d":3,"t":"single","q":"哪项 AWS 服务是完全托管的 NoSQL 数据库服务？","o":[{"l":"A","t":"Amazon RDS"},{"l":"B","t":"Amazon Redshift"},{"l":"C","t":"Amazon DynamoDB"},{"l":"D","t":"Amazon Aurora"}],"a":["C"],"e":"Amazon DynamoDB 是由 AWS 提供的完全托管的 NoSQL 数据库服务。它为需要灵活数据模型和快速数据访问的应用程序提供可扩展和高性能的存储。","s":"源#662"},{"id":"D3-664","d":3,"t":"single","q":"一家公司希望将其本地 SQL Server 数据库迁移到 AWS 云。该公司希望 AWS 处理数据库的日常管理。哪项 AWS 服务将满足该公司的要求？","o":[{"l":"A","t":"Amazon EC2 for Microsoft SQL Server"},{"l":"B","t":"Amazon DynamoDB"},{"l":"C","t":"Amazon RDS"},{"l":"D","t":"Amazon Aurora"}],"a":["C"],"e":"Amazon RDS 是一项托管数据库服务，允许公司将其本地 SQL Server 数据库迁移到 AWS 云。AWS 负责处理数据库的日常管理任务，如备份、补丁和监控，减轻了公司的这些运营负担。","s":"源#664"},{"id":"D3-668","d":3,"t":"single","q":"一家公司拥有为高性能计算（HPC）工作负载设计的数据湖。 该公司应该使用哪种Amazon EC2 实例类型来满足这些要求？","o":[{"l":"A","t":"通用实例"},{"l":"B","t":"计算优化实例"},{"l":"C","t":"内存优化实例"},{"l":"D","t":"存储优化实例"}],"a":["B"],"e":"计算优化实例专为处理计算密集型工作负载而设计，例如高性能计算（HPC）中的工作负载。它们提供高性能处理器，并针对需要大量CPU 功率的任务进行了优化。","s":"源#668"},{"id":"D3-671","d":3,"t":"single","q":"一家计划迁移到 AWS 云的公司位于一个网络连接有限的孤立地区。该公司需要在本地进行数据处理。该公司需要一种解决方案，能够在没有稳定互联网连接的情况下运行。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"AWS Snowball Edge"},{"l":"C","t":"AWS Storage Gateway"},{"l":"D","t":"AWS Backup"}],"a":["B"],"e":"AWS Snowball Edge 是一种坚固的设备，可以运送到孤立的地点。它允许公司在本地和 AWS 云之间传输数据，并且还具有在本地进行数据处理的能力。这使其适合在没有稳定互联网连接的情况下使用。","s":"源#671"},{"id":"D3-672","d":3,"t":"single","q":"一家公司想要构建用于实时欺诈模式检测的图查询。 哪项 AWS 服务将满足此要求？","o":[{"l":"A","t":"Amazon Neptune"},{"l":"B","t":"Amazon DynamoDB"},{"l":"C","t":"Amazon Timestream"},{"l":"D","t":"Amazon Forecast"}],"a":["A"],"e":"Amazon Neptune 是一项完全托管的图数据库服务，专为处理高度连接的数据集和图查询而设计。它非常适合构建用于实时欺诈模式检测的图查询，因为它可以高效地存储和查询图数据以识别模式和关系。","s":"源#672"},{"id":"D3-673","d":3,"t":"single","q":"一家公司想要迁移到 AWS 云。该公司需要在需要时获取资源，并在不再需要时释放这些资源。AWS 云的哪个架构概念满足这些要求？","o":[{"l":"A","t":"弹性"},{"l":"B","t":"可用性"},{"l":"C","t":"可靠性"},{"l":"D","t":"持久性"}],"a":["A"],"e":"弹性是 AWS 云的架构概念，允许公司根据需求自动扩展或缩减资源。这意味着公司可以在需要时获取资源，并在不再需要时释放它们，确保资源的最佳利用和成本效率。","s":"源#673"},{"id":"D3-674","d":3,"t":"single","q":"一家公司想要将 Web 应用程序部署为容器化应用程序。该公司希望使用一项托管服务，该服务可以自动从源代码创建容器镜像并部署容器化应用程序。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"AWS Elastic Beanstalk"},{"l":"B","t":"Amazon Elastic Container Service（Amazon ECS）"},{"l":"C","t":"AWS App Runner"},{"l":"D","t":"Amazon EC2"}],"a":["C"],"e":"AWS App Runner 是一项完全托管的服务，简化了容器化应用程序的部署。它可以自动从源代码构建和部署容器镜像，使公司能够轻松地将 Web 应用程序部署为容器化应用程序，而无需管理底层基础设施。","s":"源#674"},{"id":"D3-680","d":3,"t":"single","q":"一家公司在数据中心拥有多个基于 SQL 的数据库。该公司需要将所有数据库服务器迁移到AWS 云，以降低运营物理服务器的成本。 哪项 AWS 服务或资源将以最少的运营开销满足这些要求？","o":[{"l":"A","t":"Amazon EC2 实例"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"Amazon DynamoDB"},{"l":"D","t":"OpenSearch"}],"a":["B"],"e":"Amazon RDS 是一项托管数据库服务，简化了 SQL-based 数据库的迁移和管理。它处理诸如备份、补丁和扩展等任务，与在Amazon EC2 实例上管理数据库相比，减少了公司的运营开销。","s":"源#680"},{"id":"D3-681","d":3,"t":"single","q":"一家公司想要构建、训练和部署机器学习（ML）模型。 哪项 AWS 服务可以满足该公司的需求？","o":[{"l":"A","t":"Amazon Personalize"},{"l":"B","t":"Amazon Comprehend"},{"l":"C","t":"Amazon Forecast"},{"l":"D","t":"Amazon SageMaker"}],"a":["D"],"e":"Amazon SageMaker 是一项完全托管的服务，提供了构建、训练和部署机器学习模型的全面工具和能力。它简化了 ML 工作流程，使公司能够专注于开发和部署 ML 应用程序。","s":"源#681"},{"id":"D3-682","d":3,"t":"single","q":"哪项 AWS 服务或工具提供建议，帮助用户根据历史工作负载使用数据来调整Amazon EC2 实例的大小？","o":[{"l":"A","t":"AWS Pricing Calculator"},{"l":"B","t":"AWS Compute Optimizer"},{"l":"C","t":"AWS App Runner"},{"l":"D","t":"AWS Systems Manager"}],"a":["B"],"e":"AWS Compute Optimizer 分析历史工作负载使用数据，并提供建议，帮助用户调整其 Amazon EC2 实例的大小，以确保实例大小适合工作负载需求，优化性能和成本。","s":"源#682"},{"id":"D3-683","d":3,"t":"single","q":"一家公司想要通过使用编程语言来探索和分析 Amazon S3 中的数据。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon Kendra"},{"l":"B","t":"Amazon Athena"},{"l":"C","t":"Amazon Comprehend"},{"l":"D","t":"Amazon SageMaker"}],"a":["B"],"e":"Amazon Athena 允许用户使用标准 SQL 语法查询和分析存储在 Amazon S3 中的数据。它与各种编程语言和工具集成，使得通过编程方式在 S3 中探索和分析数据变得容易。","s":"源#683"},{"id":"D3-689","d":3,"t":"single","q":"哪种类型的工作负载应该在 Amazon EC2 Spot 实例上运行？","o":[{"l":"A","t":"需要特定 EC2 实例配置且长时间稳定运行的工作负载。"},{"l":"B","t":"可以中断且对成本敏感的工作负载。"},{"l":"C","t":"不需要长期承诺的稳定工作负载。"},{"l":"D","t":"不能中断且对成本敏感的工作负载。"}],"a":["B"],"e":"Amazon EC2 Spot 实例适合运行可以中断且对成本敏感的工作负载。这些实例提供了显著的成本节约，但可能会在 Spot 价格上涨或容量不足时被中断。","s":"源#689"},{"id":"D3-691","d":3,"t":"single","q":"对于哪种用例，Amazon EC2 按需实例最具成本效益？","o":[{"l":"A","t":"需要可重启的计算密集型视频转码，如果必要的话。"},{"l":"B","t":"连续使用 1 个月进行质量保证测试的实例。"},{"l":"C","t":"将运行 1 年的 Web 服务器实例。"},{"l":"D","t":"将运行 3 年的数据库实例。"}],"a":["B"],"e":"Amazon EC2 按需实例对于短期、不可预测的工作负载且不需要长期承诺的情况最具成本效益。在这种情况下，连续使用1 个月进行质量保证测试的实例符合要求，因为它不需要预留实例的前期成本或 Spot 实例的潜在中断。","s":"源#691"},{"id":"D3-692","d":3,"t":"single","q":"一家公司开发了一个新的内部应用程序。该公司没有办法确定或预测该应用程序将产生的使用需求。该公司正在寻求 AWS 云计算的哪个好处？","o":[{"l":"A","t":"易于使用"},{"l":"B","t":"成本效益"},{"l":"C","t":"安全"},{"l":"D","t":"可扩展性和高性能"}],"a":["D"],"e":"由于该公司无法确定或预测新应用程序的使用需求，因此它正在寻求 AWS 云计算的可扩展性和高性能好处。AWS 云平台可以根据实际需求自动扩展资源，确保应用程序的最佳性能和成本效率。","s":"源#692"},{"id":"D3-694","d":3,"t":"single","q":"一家公司计划雇用新员工，这些员工将远程工作。该公司需要设置 Windows 虚拟桌面，为新员工创建工作环境。员工必须能够从任何地方使用他们的计算机或网络浏览器访问工作环境。 哪项AWS 服务或功能将满足这些要求？","o":[{"l":"A","t":"专用主机"},{"l":"B","t":"AWS Global Accelerator"},{"l":"C","t":"Amazon Workspaces"},{"l":"D","t":"Amazon CloudFront"}],"a":["C"],"e":"Amazon Workspaces 是一种桌面即服务（DaaS）产品，允许公司在云中设置 Windows 虚拟桌面。员工可以从任何地方使用他们的计算机或网络浏览器访问工作环境，非常适合远程工作场景。","s":"源#694"},{"id":"D3-696","d":3,"t":"single","q":"哪项 AWS 服务支持 MySQL 数据库引擎？","o":[{"l":"A","t":"Amazon DynamoDB"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"Amazon DocumentDB（与 MongoDB 兼容）"},{"l":"D","t":"Amazon ElastiCache"}],"a":["B"],"e":"Amazon RDS 支持多种数据库引擎，包括 MySQL。它提供了一种托管的数据库服务，简化了 MySQL 数据库在 AWS 云中的设置、操作和扩展。","s":"源#696"},{"id":"D3-697","d":3,"t":"single","q":"一家公司为其在 AWS 云中的工作负载购买了 Amazon EC2 标准预留实例（RIs）。该公司需要将部分工作负载转移到与这些标准 RIs 的实例家族不匹配的实例家族。 该公司如何利用不再需要的标准RIs？","o":[{"l":"A","t":"联系 AWS 支持团队，要求他们出售标准 RIs。"},{"l":"B","t":"在 Amazon EC2 预留实例市场上出售标准 RIs。"},{"l":"C","t":"作为第三方卖家在 AWS 市场上出售标准 RIs。"},{"l":"D","t":"将标准 RIs 转换为储蓄计划。"}],"a":["B"],"e":"该公司可以在 Amazon EC2 预留实例市场上出售不再需要的标准预留实例（RIs）。这允许其他 AWS 客户购买这些 RIs，帮助该公司回收部分成本。","s":"源#697"},{"id":"D3-699","d":3,"t":"single","q":"一家公司希望通过为员工提供一种搜索问题并检索特定答案的方式来提高员工生产力。该公司希望使用一个单一的智能搜索界面。 哪项 AWS 服务将满足这些要求？","o":[{"l":"A","t":"Amazon Connect"},{"l":"B","t":"Amazon Kendra"},{"l":"C","t":"Amazon Lex"},{"l":"D","t":"Amazon Comprehend"}],"a":["B"],"e":"Amazon Kendra 是一种智能搜索服务，可以对各种数据源进行索引和搜索。它提供了一个单一的智能搜索界面，允许员工搜索问题并检索特定答案，通过快速访问相关信息提高生产力。","s":"源#699"},{"id":"D3-700","d":3,"t":"single","q":"一家公司希望获得一个 Amazon S3 解决方案，该解决方案能够在个位数毫秒内提供对对象存储的访问。哪项解决方案将满足这些要求？","o":[{"l":"A","t":"S3 Express One Zone"},{"l":"B","t":"S3 Standard"},{"l":"C","t":"S3 Glacier Flexible Retrieval"},{"l":"D","t":"S3 Glacier Instant Retrieval"}],"a":["A"],"e":"S3 Express One Zone 旨在在个位数毫秒内提供对对象存储的访问。它针对对延迟敏感的工作负载进行了优化，需要对存储在Amazon S3 中的数据进行低延迟访问。","s":"源#700"},{"id":"D3-701","d":3,"t":"multiple","q":"一家公司在 AWS 上全天候运行不间断的 Amazon EC2 工作负载。该公司将需要在接下来的12 个月内使用相同的实例系列和实例类型来运行工作负载。公司应该选择哪种购买选项组合以最大程度优化成本？（选择两个）","o":[{"l":"A","t":"标准预留实例"},{"l":"B","t":"可转换预留实例"},{"l":"C","t":"计算节省计划"},{"l":"D","t":"现货实例"},{"l":"E","t":"全额预付"}],"a":["A","E"],"e":"（本题缺解析，源文件无解析文字）","s":"源#701"},{"id":"D3-702","d":3,"t":"single","q":"一家公司希望运行其应用程序代码，而无需提供和管理服务器。 哪个 AWS 服务能满足这一要求？","o":[{"l":"A","t":"AWS Glue"},{"l":"B","t":"AWS Lambda"},{"l":"C","t":"AWS CodeDeploy"},{"l":"D","t":"Amazon CodeGuru"}],"a":["B"],"e":"AWS Lambda 是一项服务，允许您在不提供或管理服务器的情况下运行代码。它是一种无服务器计算服务，可以在响应事件时运行您的代码，并自动为您管理计算资源。","s":"源#702"},{"id":"D3-707","d":3,"t":"single","q":"一家公司已经在应用程序负载均衡器后部署了几个公共应用程序。公司希望提高应用程序的性能。哪个 AWS 服务能满足这些要求？","o":[{"l":"A","t":"AWS 全球加速器"},{"l":"B","t":"Amazon Connect"},{"l":"C","t":"Amazon ElastiCache"},{"l":"D","t":"Amazon CloudWatch"}],"a":["A"],"e":"AWS 全球加速器通过使用全球网络将用户流量导向最佳端点来提高应用程序的性能。这可以显著降低全球用户访问负载均衡器后应用程序的延迟。","s":"源#707"},{"id":"D3-708","d":3,"t":"single","q":"一家公司有一个本地应用程序。该应用程序的处理时间少于 5 分钟，并且每天只被调用几次。公司希望将应用程序迁移到 AWS 云。 哪个 AWS 服务将最经济有效地支持这个应用程序？","o":[{"l":"A","t":"Amazon ECS（Amazon ECS）"},{"l":"B","t":"AWS Lambda"},{"l":"C","t":"Amazon EKS（Amazon EKS）"},{"l":"D","t":"Amazon EC2"}],"a":["B"],"e":"对于处理时间短且不频繁调用的应用程序，AWS Lambda 是最经济有效的服务。它允许您在不提供或管理服务器的情况下运行代码，并且您只需为所使用的计算时间付费。","s":"源#708"},{"id":"D3-710","d":3,"t":"single","q":"一家公司希望整合其呼叫中心，以改善与呼叫中心代理的客户语音和聊天体验。哪个AWS 服务或工具能满足这些要求？","o":[{"l":"A","t":"Amazon SNS（Amazon SNS）"},{"l":"B","t":"AWS 支持中心"},{"l":"C","t":"Amazon Cognito"},{"l":"D","t":"Amazon Connect"}],"a":["D"],"e":"Amazon Connect 是一种基于云的联络中心服务，使您能够在云端设置和管理联络中心。它旨在改善客户互动和代理体验，适合呼叫中心整合。","s":"源#710"},{"id":"D3-712","d":3,"t":"single","q":"哪个 AWS 服务可以将 Amazon EC2 实例从一个 AWS 区域迁移到另一个？","o":[{"l":"A","t":"AWS 应用迁移服务"},{"l":"B","t":"AWS 数据库迁移服务（AWS DMS）"},{"l":"C","t":"AWS 数据同步"},{"l":"D","t":"AWS 迁移中心"}],"a":["A"],"e":"AWS 应用迁移服务旨在帮助从本地环境或从一个云迁移到另一个云，包括在 AWS 区域之间迁移 Amazon EC2 实例。","s":"源#712"},{"id":"D3-714","d":3,"t":"single","q":"一家公司希望在 Amazon EC2 实例上运行其应用程序。公司需要将应用程序保留在本地以满足合规要求。 哪个 AWS 提供能满足这些要求？","o":[{"l":"A","t":"专用实例"},{"l":"B","t":"Amazon CloudFront"},{"l":"C","t":"AWS Fargate"},{"l":"D","t":"AWS Outposts"}],"a":["D"],"e":"AWS Outposts 是一项完全托管的服务，将 AWS 基础设施、服务、API 和工具扩展到几乎任何数据中心、共位空间或本地设施。它允许您在本地运行 Amazon EC2 实例上的应用程序，满足合规要求。","s":"源#714"},{"id":"D3-715","d":3,"t":"single","q":"一家公司希望连接其支持的 AWS 服务和 VPC。公司不希望将其内部流量暴露给公共互联网。哪个AWS 服务能满足这些要求？","o":[{"l":"A","t":"Amazon Inspector"},{"l":"B","t":"AWS PrivateLink"},{"l":"C","t":"Amazon Connect"},{"l":"D","t":"AWS 互联网网关"}],"a":["B"],"e":"AWS PrivateLink 允许在不将流量暴露给公共互联网的情况下，在 AWS 服务和 VPC 之间建立私有连接。它为内部流量提供了更安全、更可靠的连接。","s":"源#715"},{"id":"D3-718","d":3,"t":"single","q":"一家公司想要部署一个存储数据在关系数据库中的应用程序。公司希望数据库任务，如自动备份和数据库快照，由 AWS 管理。 哪个 AWS 服务能满足这些要求？","o":[{"l":"A","t":"Amazon DocumentDB"},{"l":"B","t":"Amazon RDS"},{"l":"C","t":"Amazon EBS (Amazon EBS)"},{"l":"D","t":"Amazon S3"}],"a":["B"],"e":"Amazon RDS（关系数据库服务）是一项托管数据库服务，它自动化了硬件配置、数据库设置、修补和备份等耗时的管理工作。它专为关系数据库设计，并满足由 AWS 管理数据库任务的要求。","s":"源#718"},{"id":"D4-011","d":4,"t":"single","q":"用户将本地工作负载迁移到 AWS 云时会体验到以下哪个优势？","o":[{"l":"A","t":"消除了运行和维护数据中心的费用"},{"l":"B","t":"与硬件供应商提供的折扣相同的价格折扣"},{"l":"C","t":"将所有运营控制权分配给 AWS"},{"l":"D","t":"消除了运营费用"}],"a":["A"],"e":"将本地工作负载迁移到 AWS 云消除了与运行和维护数据中心相关的费用，例如基础设施维护、设施管理和硬件升级。","s":"源#11"},{"id":"D4-016","d":4,"t":"single","q":"一个电子学习平台需要每年运行两个月的应用程序。该应用程序将部署在 Amazon EC2 实例上。在这两个月期间必须避免任何应用程序停机。哪种 EC2 购买选项将最符合成本效益地满足这些要求？","o":[{"l":"A","t":"预留实例"},{"l":"B","t":"专用主机"},{"l":"C","t":"现货实例"},{"l":"D","t":"按需实例"}],"a":["D"],"e":"按需实例提供按需付费的定价模式，无需任何长期承诺，适合像运行应用程序两个月这样的短期需求，避免为未使用的预留产生额外成本。","s":"源#16"},{"id":"D4-033","d":4,"t":"single","q":"一家公司使用 AWS Batch 运行数千个同时进行的模拟。每个模拟是无状态的、容错的，并且运行时间长达 3 小时。哪种定价模式使公司能够优化成本并满足这些要求？","o":[{"l":"A","t":"预留实例"},{"l":"B","t":"现货实例"},{"l":"C","t":"按需实例"},{"l":"D","t":"专用实例"}],"a":["B"],"e":"现货实例是对于能够处理中断的容错工作负载的一种成本效益选择。它们允许用户以可能低于按需实例的价格竞标未使用的EC2 容量，使它们适合于公司可以中断而不影响整体执行的无状态模拟。","s":"源#33"},{"id":"D4-040","d":4,"t":"multiple","q":"在 AWS 云中，弹性指的是以下哪些内容？（选择两项。）","o":[{"l":"A","t":"Amazon EC2 实例重新启动的速度"},{"l":"B","t":"需求变化时调整资源的能力"},{"l":"C","t":"Amazon EC2 实例可以使用的最大 RAM 数量"},{"l":"D","t":"按需付费计费模式"},{"l":"E","t":"需要时轻松获取资源的能力"}],"a":["B","E"],"e":"在 AWS 云中，弹性指的是根据需求动态调整资源的能力，其中包括调整资源大小（选项 B）和在需要时轻松获取资源（选项E）。这个概念是关于根据变化的需求高效地扩展或缩减资源。","s":"源#40"},{"id":"D4-046","d":4,"t":"multiple","q":"一家公司想要为继续使用其生产 Amazon EC2 实例做出前期承诺，以换取整体成本的降低。哪些定价选项满足这些要求且成本最低？（选择两项。）","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"按需实例"},{"l":"C","t":"预留实例"},{"l":"D","t":"储蓄计划"},{"l":"E","t":"专用主机"}],"a":["C","D"],"e":"预留实例和储蓄计划是提供最低成本的定价选项，以换取前期承诺。预留实例与按需定价相比提供显著折扣，通过一次性前期支付和/或更低的小时费率。储蓄计划提供灵活的定价，通过承诺一定期限内的一定使用量，折扣高达按需定价的 72%。","s":"源#46"},{"id":"D4-048","d":4,"t":"single","q":"一家公司正在探索使用 AWS 云，并且需要在基础设施配置之前为一个项目创建成本估算。公司可以使用哪个 AWS 服务或功能来在部署前估算成本？","o":[{"l":"A","t":"AWS 免费层"},{"l":"B","t":"AWS 定价计算器"},{"l":"C","t":"AWS 计费和成本管理"},{"l":"D","t":"AWS 成本和使用情况报告"}],"a":["B"],"e":"AWS 定价计算器是一个工具，允许用户根据其预计使用情况估算使用 AWS 服务的成本。它为不同服务和配置提供了详细的成本分解，适合在基础设施部署前创建成本估算。","s":"源#48"},{"id":"D4-082","d":4,"t":"multiple","q":"AWS 云服务的合并计费有哪些好处？（选择两项。）","o":[{"l":"A","t":"批量折扣"},{"l":"B","t":"使用的最低额外费用"},{"l":"C","t":"多个账户的单一账单"},{"l":"D","t":"安装付款选项"},{"l":"E","t":"自定义成本和使用预算创建"}],"a":["A","C"],"e":"AWS 云服务的合并计费的好处包括批量折扣 (A) 和多个账户的单一账单 (C)。这允许统一查看支出，并有可能通过跨账户聚合使用情况来节省成本。","s":"源#82"},{"id":"D4-089","d":4,"t":"multiple","q":"以下哪两项是迁移到 AWS 云的优势？","o":[{"l":"A","t":"将所有安全责任转交给 AWS"},{"l":"B","t":"使用按需付费模型"},{"l":"C","t":"对物理基础设施拥有完全控制权"},{"l":"D","t":"不再需要猜测所需的容量"},{"l":"E","t":"不再担心用户访问控制"}],"a":["B","D"],"e":"迁移到 AWS 云的优势包括使用按需付费模型 (B)，允许用户只支付他们实际使用的资源，没有前期成本或长期承诺，以及不再需要猜测所需的容量 (D)，因为 AWS 提供可动态扩展的资源以满足实际需求。","s":"源#89"},{"id":"D4-091","d":4,"t":"single","q":"一家公司计划迁移到 AWS，并希望为其 AWS 使用案例创建成本估算。公司可以使用哪个AWS 服务或工具来满足这些要求？","o":[{"l":"A","t":"AWS 定价计算器"},{"l":"B","t":"Amazon CloudWatch"},{"l":"C","t":"AWS 成本探索器"},{"l":"D","t":"AWS 预算"}],"a":["A"],"e":"正确答案是 AWS 定价计算器。这是一个基于 Web 的工具，允许用户估算使用 AWS 服务的成本，帮助理解并估算与各种AWS 资源相关的成本。","s":"源#91"},{"id":"D4-107","d":4,"t":"single","q":"一家公司有多个 AWS 账户，其中包括不能中断的计算工作负载。公司希望获得基于公司使用AWS服务的计费折扣。哪个 AWS 功能或购买选项将满足这些要求？","o":[{"l":"A","t":"资源标记"},{"l":"B","t":"合并计费"},{"l":"C","t":"按需付费定价"},{"l":"D","t":"现货实例"}],"a":["B"],"e":"允许公司根据其使用 AWS 服务的情况获得计费折扣的 AWS 功能是合并计费（选项 B）。此功能启用了跨所有链接账户的使用和成本聚合，允许公司从批量折扣中受益。","s":"源#107"},{"id":"D4-128","d":4,"t":"multiple","q":"一家公司有一个稳定、可预测且不间断的计算工作负载。哪种 Amazon EC2 实例购买选项最具成本效益？（选择两个。）","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"预留实例"},{"l":"C","t":"竞价实例"},{"l":"D","t":"节省计划"},{"l":"E","t":"专用主机"}],"a":["B","D"],"e":"对于稳定、可预测且不间断的计算工作负载，最具成本效益的 Amazon EC2 实例购买选项通常是：B. 预留实例：预留实例与按需实例相比提供显著折扣，以换取一到三年的期限承诺。由于工作负载是稳定和可预测的，您可以预测您的使用情况，并相应地购买预留实例，随着时间的推移优化成本。D. 节省计划：与预留实例类似，节省计划提供显著折扣，以换取在一到三年的期限内承诺特定数量的计算使用量（以每小时美元计）。与预留实例相比，节省计划在更广泛的实例类型和地区提供灵活性。","s":"源#128"},{"id":"D4-129","d":4,"t":"single","q":"哪种 Amazon EC2 定价模型对于每年运行一次、持续 24 小时的不间断工作负载最具成本效益？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"预留实例"},{"l":"C","t":"竞价实例"},{"l":"D","t":"专用实例"}],"a":["A"],"e":"按需实例（选项 A）对于偶尔运行的工作负载（例如每年一次 24 小时）最具成本效益，因为它们允许用户按小时或秒支付计算能力，无需长期承诺。","s":"源#129"},{"id":"D4-131","d":4,"t":"multiple","q":"一家公司希望将其本地工作负载迁移到 AWS 云。公司希望将工作负载分开，以便向不同的部门收费。哪些 AWS 服务或功能将满足这些要求？（选择两个。）","o":[{"l":"A","t":"放置组"},{"l":"B","t":"合并计费"},{"l":"C","t":"边缘位置"},{"l":"D","t":"AWS Config"},{"l":"E","t":"多个 AWS 账户"}],"a":["B","E"],"e":"合并计费（选项 B）允许跨多个 AWS 账户使用单一支付方式，多个 AWS 账户（选项 E）使工作负载分开，并管理不同部门的成本。","s":"源#131"},{"id":"D4-133","d":4,"t":"single","q":"使用 AWS 进行云计算的一个好处是什么？","o":[{"l":"A","t":"将可变成本转换为固定成本"},{"l":"B","t":"按需付费定价"},{"l":"C","t":"降低速度和敏捷性"},{"l":"D","t":"花钱运行和维护数据中心"}],"a":["B"],"e":"按需付费定价（选项 B）是使用 AWS 进行云计算的关键好处。它允许客户只支付他们消耗的资源，不会产生前期成本或长期承诺。","s":"源#133"},{"id":"D4-135","d":4,"t":"single","q":"一家公司正在评估其 AWS 商业支持计划，以确定该计划是否仍满足公司的需要。公司正在考虑切换到 AWS 企业支持。有了 AWS 企业支持，公司将获得哪些额外好处？","o":[{"l":"A","t":"一套完整的 AWS Trusted Advisor 检查"},{"l":"B","t":"电话、电子邮件和聊天访问云支持工程师，每周 7 天，每天 24 小时"},{"l":"C","t":"指定的技术账户经理（TAM）协助监控和优化"},{"l":"D","t":"为公司的应用程序提供咨询审查和架构指导"}],"a":["C"],"e":"有了 AWS 企业支持（选项 C），公司将获得一个指定的技术账户经理（TAM），他将提供咨询架构指导和支持，帮助公司优化其AWS的使用，并将其云架构与业务目标对齐。","s":"源#135"},{"id":"D4-136","d":4,"t":"single","q":"哪种定价模型会在容量暂时不可用时中断运行中的 Amazon EC2 实例？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"标准预留实例"},{"l":"C","t":"竞价实例"},{"l":"D","t":"可转换预留实例"}],"a":["C"],"e":"竞价实例（选项 C）可能会被 AWS 中断，如果竞价价格超过您愿意支付的最高价格，或者如果 AWS 需要容量进行其他任务。这使它们适合灵活的、非关键的工作负载，这些工作负载可以被中断。","s":"源#136"},{"id":"D4-141","d":4,"t":"single","q":"哪种 AWS 云服务可以在超出自定义支出阈值时向客户发送警报？","o":[{"l":"A","t":"AWS Budgets"},{"l":"B","t":"AWS Cost Explorer"},{"l":"C","t":"AWS 成本分配标签"},{"l":"D","t":"AWS 组织"}],"a":["A"],"e":"AWS Budgets（选项 A）允许客户设置自定义支出阈值并配置警报，当这些阈值被超出时通知他们，帮助管理和控制AWS 成本。","s":"源#141"},{"id":"D4-144","d":4,"t":"single","q":"一家公司需要在 Amazon EC2 实例上连续运行一个实验性工作负载，并在 12 小时后停止该实例。哪种实例购买选项将最具成本效益地满足此要求？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"预留实例"},{"l":"C","t":"竞价实例"},{"l":"D","t":"专用实例"}],"a":["A"],"e":"按需实例（选项 A）提供了运行实例所需的最短时长的能力，使它们成为短期、实验性工作负载的成本效益选择，这些工作负载需要在特定时期后停止。","s":"源#144"},{"id":"D4-162","d":4,"t":"single","q":"一家公司计划将其应用程序迁移到 AWS，并在 Amazon EC2 实例上运行该应用程序。该应用程序将连续使用 1 年。哪种 EC2 实例购买选项将最具成本效益地满足这些要求？","o":[{"l":"A","t":"预留实例"},{"l":"B","t":"竞价实例"},{"l":"C","t":"按需实例"},{"l":"D","t":"专用主机"}],"a":["A"],"e":"预留实例（选项 A）对于具有稳定、可预测工作负载的应用程序，在期限承诺期间（如一年）是最具成本效益的选择，因为与按需定价相比，它们提供显著的折扣。","s":"源#162"},{"id":"D4-178","d":4,"t":"single","q":"一家公司计划将其应用程序迁移到 AWS 云。公司应该使用哪个 AWS 工具或一组资源来分析和评估其迁移的准备情况？","o":[{"l":"A","t":"AWS 云采用框架（AWS CAF）"},{"l":"B","t":"AWS 定价计算器"},{"l":"C","t":"AWS Well-Architected Framework"},{"l":"D","t":"AWS 预算"}],"a":["A"],"e":"AWS 云采用框架（AWS CAF）（选项 A）提供了一种结构化的方法，帮助组织规划和执行其云采用之旅，包括评估迁移的准备情况。","s":"源#178"},{"id":"D4-180","d":4,"t":"single","q":"以下哪种 AWS 好处是通过按需技术服务实现的，使公司能够用可变成本来替代前期固定支出？","o":[{"l":"A","t":"高可用性"},{"l":"B","t":"规模经济"},{"l":"C","t":"按需付费定价"},{"l":"D","t":"全球覆盖"}],"a":["C"],"e":"按需付费定价（选项 C），允许公司用可变成本来替代前期固定支出，只支付它们消耗的资源。","s":"源#180"},{"id":"D4-204","d":4,"t":"single","q":"一家公司想要使用其账单数据每周创建 Amazon QuickSight 仪表板。公司可以使用哪种AWS 功能或工具来满足这些要求？","o":[{"l":"A","t":"AWS 预算"},{"l":"B","t":"AWS 成本探索器"},{"l":"C","t":"AWS 成本和使用情况报告"},{"l":"D","t":"AWS 成本异常检测"}],"a":["C"],"e":"AWS 成本和使用情况报告（选项 C）允许用户访问详细的账单数据，这些数据可以用来在 Amazon QuickSight 中创建仪表板，用于分析和可视化成本和使用模式。","s":"源#204"},{"id":"D4-206","d":4,"t":"single","q":"一家公司需要组织其资源并在详细层面上跟踪 AWS 成本。公司需要按业务部门、环境和应用程序对成本进行分类。哪种解决方案将满足这些要求？","o":[{"l":"A","t":"访问 AWS 成本管理控制台以组织资源，设置 AWS 预算，并接收非预期使用的通知。"},{"l":"B","t":"使用标签组织资源。激活成本分配标签以在详细层面上跟踪 AWS 成本。"},{"l":"C","t":"创建 Amazon CloudWatch 仪表板，以直观地组织和单独跟踪成本。"},{"l":"D","t":"访问 AWS 计费和成本管理仪表板，以在详细层面上组织和跟踪资源消耗。"}],"a":["B"],"e":"使用标签（选项 B）组织资源并激活成本分配标签，允许在详细层面上跟踪 AWS 成本。标签可用于按业务部门、环境和应用程序对成本进行分类，提供清晰的费用细分。","s":"源#206"},{"id":"D4-213","d":4,"t":"single","q":"哪种 Amazon EC2 实例定价模型可以提供高达 90%的折扣？","o":[{"l":"A","t":"预留实例（Reserved Instances）"},{"l":"B","t":"按需实例（On-Demand）"},{"l":"C","t":"专用主机（Dedicated Hosts）"},{"l":"D","t":"竞价实例（Spot Instances）"}],"a":["D"],"e":"能提供高达 90%折扣的Amazon EC2 实例定价模式是：D. 竞价实例以下是关于Amazon EC2 竞价实例的一些要点：1. 竞价实例使您能够以相较于按需定价大幅折扣的价格，使用Amazon EC2 的闲置计算资源。2. 与按需实例价格相比，它们有可能节省高达 90%的成本。3. 竞价实例非常适合灵活且容错的工作负载，如批处理、大数据分析、容器化应用程序以及高性能计算（HPC）。4. 主要的权衡在于，当EC2 需要收回计算资源时，竞价实例可能会在提前两分钟收到通知的情况下被 AWS 中断。5. 与预留实例或节省计划不同，竞价实例无需任何前期承诺即可实现成本节约。6. 竞价实例的价格会根据 EC2 计算资源的供需情况波动。7. 平均而言，竞价实例被中断的时间不到 5%。需要注意的是，尽管竞价实例能节省大量成本，但由于存在可能被中断的情况，它们可能并不适用于所有工作负载。如需获取关于竞价实例定价和最佳实践的最新信息，请参考 AWS 官方文档。","s":"源#213"},{"id":"D4-222","d":4,"t":"single","q":"一个客户运行了一个按需的 Amazon Linux EC2 实例 3 小时 5 分钟 6 秒。客户将被计费多长时间？","o":[{"l":"A","t":"3 小时 5 分钟"},{"l":"B","t":"3 小时 5 分钟 6 秒"},{"l":"C","t":"3 小时 6 分钟"},{"l":"D","t":"4 小时"}],"a":["B"],"e":"正确答案是：B. 3 小时 5 分 6 秒原因如下：1. 运行Amazon Linux 系统的Amazon EC2 实例按秒计费，最低计费时长为60 秒。2. 这意味着对于按需使用的Amazon Linux EC2 实例，您将按实例实际运行的精确时间计费，精确到秒。3. 在这种情况下，客户的实例恰好运行了3 小时5 分 6 秒，因此他们将按此确切时长计费。4. 对于Amazon Linux EC2 实例，不会向上取整到最接近的分钟或小时。需要注意的是，计费方式可能因具体的实例类型、操作系统和定价模式而有所不同。如需获取关于 EC2 定价和计费的最新详细信息，建议查阅 AWS EC2 官方定价文档。另外，请记住，虽然按秒计费有助于更精确地管理成本，但始终应监控使用情况并实施成本优化策略，例如针对可预测的工作负载使用预留实例或节省计划，针对灵活且容错的应用程序使用竞价实例。","s":"源#222"},{"id":"D4-225","d":4,"t":"single","q":"一家拥有多个业务单元的公司想要集中管理和治理其 AWS 云环境。公司想要自动化创建AWS 账户、应用服务控制策略（SCPs）并简化计费流程。公司应该使用哪家 AWS 服务或工具来满足这些要求？","o":[{"l":"A","t":"AWS Organizations"},{"l":"B","t":"Cost Explorer"},{"l":"C","t":"AWS Budgets"},{"l":"D","t":"AWS Trusted Advisor"}],"a":["A"],"e":"AWS Organizations 允许集中管理多个 AWS 账户，实现账户创建的自动化、权限管理的服务控制策略（SCPs）的应用以及计费流程的简化。","s":"源#225"},{"id":"D4-230","d":4,"t":"single","q":"用户将在 Amazon EC2 上运行有状态工作负载，为期 3 年。这种工作负载最具成本效益的定价模型是什么？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"预留实例"},{"l":"C","t":"专用实例"},{"l":"D","t":"现货实例"}],"a":["B"],"e":"预留实例为长期、有状态工作负载提供了显著的价格折扣，与按需定价相比，通过承诺特定实例类型在区域中使用 1 年或3 年，使其成为最具成本效益的选择。","s":"源#230"},{"id":"D4-245","d":4,"t":"single","q":"一家公司正在迁移到 AWS 云，并计划在 AWS 上运行 3 到 6 个月的实验性工作负载。哪种定价模型将满足这些要求？","o":[{"l":"A","t":"使用 3 年期限的储蓄计划。"},{"l":"B","t":"使用专用主机。"},{"l":"C","t":"购买预留实例。"},{"l":"D","t":"使用按需实例。"}],"a":["D"],"e":"按需实例适用于不可预测的工作负载，这些工作负载是短期的或持续时间不确定的，如实验性工作负载。它们允许通过小时或每秒立即访问 EC2 容量，无需长期承诺。","s":"源#245"},{"id":"D4-247","d":4,"t":"single","q":"一家公司想要在 AWS 上启动多个工作负载。每个工作负载与不同的业务单元相关。公司想要分离并跟踪每个业务单元的成本。哪种解决方案将以最小的运营开销满足这些要求？","o":[{"l":"A","t":"使用 AWS 组织并为每个业务单元创建一个账户。"},{"l":"B","t":"使用电子表格控制每个资源的所有者和成本。"},{"l":"C","t":"使用 Amazon DynamoDB 表记录每个业务单元的成本。"},{"l":"D","t":"使用 AWS 计费控制台分配资源所有者并跟踪成本。"}],"a":["A"],"e":"AWS 组织允许集中管理和治理多个 AWS 账户，通过合并计费和详细的成本分配，使公司能够以最小的运营开销分离每个业务单元的成本。","s":"源#247"},{"id":"D4-250","d":4,"t":"single","q":"一家公司经常不使用其所有当前的 Amazon EC2 容量来运行无状态工作负载。公司想要优化其EC2 成本。哪种 EC2 实例类型将满足这些要求？","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"专用实例"},{"l":"C","t":"预留实例"},{"l":"D","t":"按需实例"}],"a":["A"],"e":"现货实例是运行可以中断的无状态工作负载的成本效益选项。它们允许用户利用未使用的 EC2 容量，与按需实例相比，价格有显著折扣。","s":"源#250"},{"id":"D4-256","d":4,"t":"single","q":"一家公司正在使用 AWS 免费层服务的几个 AWS 服务进行应用程序。如果免费层使用期限到期，或者应用程序使用超出了免费层使用限制，会发生什么？","o":[{"l":"A","t":"公司将按超出免费层使用限制的标准按需服务费率收费。"},{"l":"B","t":"AWS 支持将联系公司，建立标准服务收费。"},{"l":"C","t":"公司将被收取在免费层期间消耗的服务费用，以及免费层期限后服务消耗的额外费用。"},{"l":"D","t":"公司的 AWS 账户将被冻结，可以在建立付款计划后重新启动。"}],"a":["A"],"e":"一旦超出免费层使用限制或使用期限到期，AWS 将开始按标准按需服务费率向公司收费，用于超出免费层限制的服务使用。","s":"源#256"},{"id":"D4-260","d":4,"t":"single","q":"一家公司收购了另一家公司。公司现在有两个 AWS 账户。公司可以使用哪个AWS 服务或工具来合并这两个账户的计费？","o":[{"l":"A","t":"AWS 系统管理器"},{"l":"B","t":"AWS 组织"},{"l":"C","t":"AWS 许可证管理器"},{"l":"D","t":"成本探索器"}],"a":["B"],"e":"AWS 组织是一项服务，允许您将多个 AWS 账户合并到您创建的组织中，并集中管理。它通过允许您为所有链接账户合并支付方式，并提供集中的 AWS 支出视图，帮助简化计费。","s":"源#260"},{"id":"D4-264","d":4,"t":"single","q":"一家公司想要接收警报以监控其 AWS 公共云基础设施的总体运营成本。哪个AWS 产品将满足这些要求？","o":[{"l":"A","t":"Amazon EventBridge"},{"l":"B","t":"计算储蓄计划"},{"l":"C","t":"AWS 预算"},{"l":"D","t":"迁移评估员"}],"a":["C"],"e":"AWS 预算允许客户设置自定义预算，并在成本或使用超过定义的阈值时接收警报，有助于有效监控和管理 AWS 支出。","s":"源#264"},{"id":"D4-265","d":4,"t":"single","q":"AWS 企业支持礼宾团队如何帮助用户？","o":[{"l":"A","t":"支持应用开发"},{"l":"B","t":"提供架构指导"},{"l":"C","t":"回答计费和账户查询"},{"l":"D","t":"回答有关技术支持案例的问题"}],"a":["C"],"e":"AWS 企业支持礼宾团队为企业客户提供个性化支持，专注于帮助解决计费和账户相关查询，确保顺利的 AWS 体验。","s":"源#265"},{"id":"D4-266","d":4,"t":"single","q":"一家公司想要运行一个持续 3 年的模拟，不得中断。哪种 Amazon EC2 实例购买选项将最符合成本效益？","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"预留实例"},{"l":"C","t":"专用主机"},{"l":"D","t":"按需实例"}],"a":["B"],"e":"预留实例为长期工作负载提供了显著的成本节省，与按需定价相比，是连续运行 3 年的模拟的最符合成本效益的选择。","s":"源#266"},{"id":"D4-267","d":4,"t":"single","q":"以下哪个 AWS 服务或资源可以提供对某些 AWS 服务成本的折扣，以换取消费承诺？","o":[{"l":"A","t":"Amazon Detective"},{"l":"B","t":"AWS 定价计算器"},{"l":"C","t":"储蓄计划"},{"l":"D","t":"基础支持"}],"a":["C"],"e":"AWS 储蓄计划提供显著的计算使用成本节省，超过按需定价，以换取在 1 年或 3 年期限内对一致使用量（以$/小时计）的承诺。","s":"源#267"},{"id":"D4-271","d":4,"t":"multiple","q":"以下哪些是公司将本地生产工作负载迁移到 AWS 时获得的好处？（选择两个）","o":[{"l":"A","t":"AWS 培训公司员工使用所有 AWS 服务。"},{"l":"B","t":"AWS 管理云中的所有安全。"},{"l":"C","t":"AWS 提供技术支持账户经理（TAM）的免费支持。"},{"l":"D","t":"AWS 提供高可用性。"},{"l":"E","t":"AWS 提供规模经济。"}],"a":["D","E"],"e":"将本地工作负载迁移到 AWS 时，公司可以从高可用性和规模经济中受益。AWS 提供高度可用的基础设施，公司可以利用AWS 实现的规模经济来降低成本。","s":"源#271"},{"id":"D4-272","d":4,"t":"single","q":"一家公司决定采用 Amazon EC2 基础设施，并希望为短期使用扩展各种无状态服务。哪种EC2 定价模型最符合成本效益以满足这些要求？","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"按需实例"},{"l":"C","t":"预留实例"},{"l":"D","t":"专用主机"}],"a":["A"],"e":"现货实例是短期、无状态服务的最符合成本效益的选择，因为它们允许用户以比按需价格显著折扣的价格利用未使用的EC2 容量。","s":"源#272"},{"id":"D4-275","d":4,"t":"single","q":"公司应用 AWS 区域来增加不同国家用户的应用程序可用性时，它正在应用哪种云计算优势？","o":[{"l":"A","t":"按需付费定价"},{"l":"B","t":"容量预测"},{"l":"C","t":"规模经济"},{"l":"D","t":"全球覆盖"}],"a":["D"],"e":"当公司利用 AWS 区域来增强其应用程序对世界各地用户的可用性时，它正在利用被称为全球覆盖的云计算优势。这种优势允许分布式基础设施，可以通过将应用程序更接近最终用户来降低延迟并改善用户体验。","s":"源#275"},{"id":"D4-281","d":4,"t":"single","q":"一家公司正在将其本地服务器迁移到 Amazon EC2 实例。服务器在接下来的 12 个月内必须始终保持活动状态。哪种 EC2 定价选项对公司的负载最具成本效益？","o":[{"l":"A","t":"按需"},{"l":"B","t":"专用主机"},{"l":"C","t":"现货实例"},{"l":"D","t":"预留实例"}],"a":["D"],"e":"对于需要连续运行超过一段延长时间的工作负载，例如 12 个月，预留实例提供了最具成本效益的定价选项，因为它们在按需定价上提供了显著的节省。","s":"源#281"},{"id":"D4-350","d":4,"t":"single","q":"一家公司需要 Amazon EC2 实例来处理可以容忍中断的工作负载。哪种 EC2 实例购买选项与按需价格相比提供最大的折扣？","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"可转换预留实例"},{"l":"C","t":"标准预留实例"},{"l":"D","t":"专用主机"}],"a":["A"],"e":"与按需价格相比，现货实例为可以容忍中断的工作负载提供最大的折扣。它们允许用户以显著降低的成本利用未使用的EC2 容量。","s":"源#350"},{"id":"D4-359","d":4,"t":"multiple","q":"AWS 云如何提供比本地数据中心更低的计算资源总拥有成本（TCO）？（选择两个）","o":[{"l":"A","t":"AWS 用按需成本取代了前期资本支出。"},{"l":"B","t":"AWS 旨在实现高可用性，这消除了用户的停机时间。"},{"l":"C","t":"AWS 消除了对本地 IT 员工的需求。"},{"l":"D","t":"AWS 利用规模经济不断降低价格。"},{"l":"E","t":"AWS 为 Amazon EC2 实例提供单一定价模型。"}],"a":["A","D"],"e":"AWS 云通过用按需成本取代前期资本支出（A）和利用规模经济不断降低价格（D）来提供更低的 TCO。这些因素有助于与本地数据中心相比，更经济地使用计算资源。","s":"源#359"},{"id":"D4-395","d":4,"t":"single","q":"哪个免费的 AWS 服务或工具为云计划创建数据驱动的业务案例？","o":[{"l":"A","t":"迁移评估员"},{"l":"B","t":"AWS 计费指挥家"},{"l":"C","t":"AWS 计费控制台"},{"l":"D","t":"Amazon 预测"}],"a":["A"],"e":"AWS 迁移评估员是免费服务，帮助为云计划创建数据驱动的业务案例。它分析本地 IT 基础设施的使用情况和成本，提供见解，为云迁移构建有说服力的案例。","s":"源#395"},{"id":"D4-403","d":4,"t":"multiple","q":"以下哪些陈述代表了 AWS 云的成本效益？（选择两个）","o":[{"l":"A","t":"用户可以将固定费用转换为变动费用。"},{"l":"B","t":"用户可以在几分钟内在全世界部署。"},{"l":"C","t":"AWS 提供增加的速度和敏捷性。"},{"l":"D","t":"AWS 负责基础设施的补丁。"},{"l":"E","t":"用户从规模经济中受益。"}],"a":["A","E"],"e":"AWS 云的成本效益通过使用户能够将固定费用转换为变动费用（A），这意味着他们只为所用付费，以及从规模经济（E）中受益，AWS 的大规模基础设施使用户能够从规模带来的成本节省中受益。这些选项反映了使用 AWS 的财务优势，而不是维护本地基础设施。","s":"源#403"},{"id":"D4-406","d":4,"t":"single","q":"一家公司正在将一些本地 IT 服务转移到 AWS 云。财务部门想要看到整个账单，以便预测支出限制。公司可以使用哪个 AWS 服务来设置支出限制并在超出这些限制时接收通知？","o":[{"l":"A","t":"AWS 成本和使用情况报告"},{"l":"B","t":"AWS 预算"},{"l":"C","t":"AWS 组织合并计费"},{"l":"D","t":"成本探索器"}],"a":["B"],"e":"AWS 预算是一个服务，使您能够为您的 AWS 资源设置自定义预算，并在这些预算超出时接收通知。这对于需要监控和预测支出的财务部门特别有用，确保公司保持在财务限制之内。","s":"源#406"},{"id":"D4-407","d":4,"t":"multiple","q":"哪些 AWS 支持计划提供访问 AWS 技术账户经理（TAM）的权限？（选择两个）","o":[{"l":"A","t":"AWS 基本支持"},{"l":"B","t":"AWS 开发人员支持"},{"l":"C","t":"AWS 商业支持"},{"l":"D","t":"AWS 企业入门支持"},{"l":"E","t":"AWS 企业支持"}],"a":["D","E"],"e":"在 AWS 企业入门支持和 AWS 企业支持级别，AWS 提供访问技术账户经理（TAM）的权限。TAM 是一个专用资源，与您合作了解您的业务需求和技术目标，提供个性化支持和指导，帮助您成功地完成 AWS 之旅。","s":"源#407"},{"id":"D4-419","d":4,"t":"single","q":"一家公司想要通过其 AWS 账户启动第三方 ISP 入侵检测系统。为了满足这个要求，公司应该使用哪个 AWS 服务或资源？","o":[{"l":"A","t":"AWS Security Hub"},{"l":"B","t":"AWS 市场"},{"l":"C","t":"AWS 快速启动"},{"l":"D","t":"AWS 安全中心"}],"a":["B"],"e":"AWS 市场是一个数字目录，您可以在其中找到各种在 AWS 上运行的第三方软件产品。这包括来自不同供应商的安全工具，如入侵检测系统。通过使用 AWS 市场，公司可以轻松地在 AWS 环境中启动和管理这些第三方应用程序。","s":"源#419"},{"id":"D4-429","d":4,"t":"single","q":"一家公司正在 Amazon EC2 实例上运行一个报告 Web 服务器应用程序。该应用程序每周运行一次，月底再次运行。EC2 实例在不使用时可以关闭。哪种计费模型是这种用例最具成本效益的？","o":[{"l":"A","t":"标准预留实例"},{"l":"B","t":"可转换预留实例"},{"l":"C","t":"按需容量预留"},{"l":"D","t":"按需实例"}],"a":["D"],"e":"考虑到报告 Web 服务器应用程序的偶尔和零星的使用模式，最具成本效益的计费模型是按需实例。这个选项允许公司按小时或秒支付计算能力的费用，仅在实例运行时支付，非常适合具有不可预测工作负载或不连续运行的应用程序。","s":"源#429"},{"id":"D4-431","d":4,"t":"single","q":"一家公司正在将其开发和测试环境转移到 AWS，以增加敏捷性并降低成本。因为这些不是生产工作负载，服务器没有完全利用，偶尔的不可用性是可以接受的。哪种 Amazon EC2 定价模型将最符合成本效益并满足这些要求？","o":[{"l":"A","t":"预留实例"},{"l":"B","t":"按需实例"},{"l":"C","t":"现货实例"},{"l":"D","t":"专用主机"}],"a":["C"],"e":"现货实例为开发和测试环境提供了一种成本效益高的选项，这些环境可以接受偶尔的中断。它们允许用户以比按需实例显著的成本节省利用未使用的 EC2 容量，使其成为非关键工作负载的合适选择。","s":"源#431"},{"id":"D4-454","d":4,"t":"multiple","q":"使用 AWS 云的经济优势有哪些？（选择两个）","o":[{"l":"A","t":"基于消费的定价"},{"l":"B","t":"永久许可证"},{"l":"C","t":"规模经济"},{"l":"D","t":"不额外收费的 AWS 企业支持"},{"l":"E","t":"自带硬件模型"}],"a":["A","C"],"e":"AWS 提供基于消费的定价，这意味着您只支付您使用的资源，无需前期成本。这允许与传统模型相比节省成本，传统模型可能需要过度配置资源。此外，AWS 从规模经济中受益，因为 AWS 运营的大规模可以带来基础设施和服务的低成本，然后这些成本优势转嫁给客户。","s":"源#454"},{"id":"D4-462","d":4,"t":"single","q":"一家公司想在 AWS 上使用 Amazon EC2 实例运行稳定的生产工作负载，将持续运行1 年。哪种实例购买选项最符合成本效益？","o":[{"l":"A","t":"专用主机"},{"l":"B","t":"预留实例"},{"l":"C","t":"按需实例"},{"l":"D","t":"现货实例"}],"a":["B"],"e":"预留实例提供了与按需定价相比的显著折扣，以换取对特定实例配置的特定持续时间的承诺。对于预计运行一整年的稳定生产工作负载，预留实例是最具成本效益的购买选项。","s":"源#462"},{"id":"D4-494","d":4,"t":"single","q":"一家公司在 AWS 上运行一个应用程序，该应用程序执行批处理作业。该应用程序具有容错能力，并且可以处理中断。公司想要优化运行该应用程序的成本。哪个 AWS 产品将满足这些要求？","o":[{"l":"A","t":"Amazon Macie"},{"l":"B","t":"Amazon Neptune"},{"l":"C","t":"Amazon EC2 Spot Instances"},{"l":"D","t":"Amazon EC2 On-Demand Instances"}],"a":["C"],"e":"Amazon EC2 Spot Instances 允许用户以远低于按需定价的价格利用 AWS 云中的未使用 EC2 容量。由于应用程序具有容错能力并且可以处理中断，使用 Spot Instances 可以显著降低运行批处理作业的成本。","s":"源#494"},{"id":"D4-501","d":4,"t":"single","q":"一家公司想要通过部门和项目来实现详细的云成本跟踪。公司应该使用哪个 AWS 功能或服务？","o":[{"l":"A","t":"合并计费"},{"l":"B","t":"成本分配标签"},{"l":"C","t":"AWS Marketplace"},{"l":"D","t":"AWS Budgets"}],"a":["B"],"e":"成本分配标签允许用户将自定义标签分配给他们的资源，从而能够根据各种维度（如部门和项目）详细跟踪和分配成本。这个功能使根据特定组织需求管理和分析云成本变得更加容易。","s":"源#501"},{"id":"D4-520","d":4,"t":"single","q":"哪个 AWS 支持计划以最低成本提供全套 AWS Trusted Advisor 检查？","o":[{"l":"A","t":"AWS Developer Support"},{"l":"B","t":"AWS Business Support"},{"l":"C","t":"AWS Enterprise On-Ramp Support"},{"l":"D","t":"AWS Enterprise Support"}],"a":["B"],"e":"AWS Business Support 包括全套 AWS Trusted Advisor 检查，旨在为有特定需求并寻求支持和成本平衡的企业设计。与企业级支持计划相比，它以较低的成本提供一套综合服务。","s":"源#520"},{"id":"D4-521","d":4,"t":"single","q":"一家公司的应用程序正在 Amazon EC2 实例上运行。公司计划在明年部分迁移到无服务器架构，并希望预先支付资源费用。哪种 AWS 购买选项将优化公司的成本？","o":[{"l":"A","t":"可转换预留实例"},{"l":"B","t":"现货实例"},{"l":"C","t":"EC2 实例储蓄计划"},{"l":"D","t":"计算储蓄计划"}],"a":["C"],"e":"EC2 实例储蓄计划提供了一种定价模型，与按需实例定价相比，可以提供显著的节省。它们允许客户承诺在 1 年或 3 年的期限内，为指定的 AWS 区域或 AWS 区域支付一致的用量（以每小时美元计）。这适合计划迁移到无服务器架构并寻求通过预先支付模型优化成本的公司。","s":"源#521"},{"id":"D4-524","d":4,"t":"single","q":"一家公司有批量工作负载，需要在 Amazon EC2 上短时间运行。工作负载可以处理中断，并可以从它们结束的地方重新开始。哪种最经济的 EC2 实例购买选项可以满足这些要求？","o":[{"l":"A","t":"预留实例"},{"l":"B","t":"现货实例"},{"l":"C","t":"专用实例"},{"l":"D","t":"按需实例"}],"a":["B"],"e":"现货实例允许用户以远低于按需定价的价格利用 AWS 云中的未使用 EC2 容量。由于批量工作负载可以处理中断，使用现货实例是运行这些类型作业的经济选择。","s":"源#524"},{"id":"D4-530","d":4,"t":"multiple","q":"一家电子商务公司计划将其数据中心工作负载迁移到 AWS 云，以支持高度动态的使用模式。哪些好处使 AWS 云对这种类型的工作负载迁移具有成本效益？（选择两项。）","o":[{"l":"A","t":"可靠性"},{"l":"B","t":"安全性"},{"l":"C","t":"弹性"},{"l":"D","t":"按需付费资源"},{"l":"E","t":"高可用性"}],"a":["C","D"],"e":"弹性和按需付费资源模型是使 AWS 云对迁移动态工作负载具有成本效益的关键好处。弹性允许基础设施根据需求自动扩展，而按需付费模型确保公司只支付实际使用的资源。","s":"源#530"},{"id":"D4-532","d":4,"t":"single","q":"AWS 定价计算器可以做什么？","o":[{"l":"A","t":"预测 AWS 每月成本。"},{"l":"B","t":"计算历史 AWS 成本。"},{"l":"C","t":"提供有关 AWS 定价策略的深入信息。"},{"l":"D","t":"为用户提供他们的月度账单访问权限。"}],"a":["A"],"e":"AWS 定价计算器可用于估计和预测与 AWS 服务相关的每月成本。它帮助用户规划他们的 AWS 预算，并了解其架构的成本结构。","s":"源#532"},{"id":"D4-538","d":4,"t":"single","q":"一家公司需要在 Amazon EC2 实例上托管一个 Web 服务器至少 1 年。Web 服务器不能容忍中断。哪种 EC2 实例购买选项将最经济地满足这些要求？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"部分预付费预留实例"},{"l":"C","t":"现货实例"},{"l":"D","t":"无预付费预留实例"}],"a":["B"],"e":"部分预付费预留实例与按需定价相比提供了显著的折扣，并且是长期运行且不中断的应用程序的良好选择。通过进行部分预付费用，公司可以在一年期间以最低成本运行实例。","s":"源#538"},{"id":"D4-548","d":4,"t":"single","q":"一家公司有临时工作负载，也是可变的。公司需要使用 Amazon EC2 实例来处理工作负载。EC2 实例需要处理无法在完成前停止的短暂工作爆发。哪种购买选项将满足这些要求？","o":[{"l":"A","t":"现货实例"},{"l":"B","t":"按需实例"},{"l":"C","t":"储蓄计划"},{"l":"D","t":"预留实例"}],"a":["B"],"e":"按需实例是处理可变和临时工作负载的最合适选择，这些工作负载需要能够处理短暂工作爆发而不受干扰。这种实例购买选项提供了根据需要运行实例的灵活性，并仅支付使用时间的费用。","s":"源#548"},{"id":"D4-553","d":4,"t":"single","q":"一家公司使用多个 AWS 账户用于不同的业务团队。财务团队希望收到公司所有账户的一张账单。财务团队应该使用哪个 AWS 服务或工具来满足此要求？","o":[{"l":"A","t":"AWS Organizations"},{"l":"B","t":"AWS Trusted Advisor"},{"l":"C","t":"Cost Explorer"},{"l":"D","t":"AWS Budgets"}],"a":["A"],"e":"AWS Organizations 是一项服务，可让您将多个 AWS 账户合并到一个组织中。它允许对账户进行集中控制，包括为所有账户创建一张账单，这对于需要综合账单视图的财务团队非常理想。","s":"源#553"},{"id":"D4-556","d":4,"t":"single","q":"哪个好处始终免费提供给 AWS 用户，无论其 AWS 支持计划如何？","o":[{"l":"A","t":"AWS 开发人员支持"},{"l":"B","t":"AWS 开发人员论坛"},{"l":"C","t":"程序化案例管理"},{"l":"D","t":"AWS 技术账户经理（TAM）"}],"a":["B"],"e":"AWS 开发人员论坛始终免费，不需要 AWS 支持计划。它们为用户提供了一个平台，用于提问、分享知识和与 AWS 社区联系。","s":"源#556"},{"id":"D4-557","d":4,"t":"single","q":"一家公司使用 Amazon EC2 实例运行其应用程序。应用程序需要连续可用并运行三年或更长时间。公司应购买哪种类型的 EC2 实例以获得 EC2 定价的折扣？","o":[{"l":"A","t":"预留实例"},{"l":"B","t":"现货实例"},{"l":"C","t":"按需实例"},{"l":"D","t":"EC2 车队"}],"a":["A"],"e":"预留实例适用于需要连续可用性超过长期的应用，例如三年或更长时间。通过承诺特定期限，公司可以获得实例小时费率的显著折扣。","s":"源#557"},{"id":"D4-565","d":4,"t":"single","q":"一家公司正在其 AWS 测试和开发服务器上运行大数据分析和大规模并行计算。公司可以容忍偶尔的停机。对于公司来说，最经济实惠的 Amazon EC2 购买选项是什么？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"现货实例"},{"l":"C","t":"预留实例"},{"l":"D","t":"储蓄计划"}],"a":["B"],"e":"现货实例允许用户以远低于按需定价的价格利用 AWS 云中的未使用 EC2 容量。由于公司可以容忍偶尔的停机，对于测试和开发工作负载来说，使用现货实例是一种经济实惠的选择。","s":"源#565"},{"id":"D4-566","d":4,"t":"single","q":"一家公司在研究实验室中运行 Amazon EC2 实例。实例每周运行 3 小时，不能被中断。哪种最经济实惠的实例购买选项可以满足这些要求？","o":[{"l":"A","t":"计算储蓄计划"},{"l":"B","t":"按需实例"},{"l":"C","t":"可转换预留实例"},{"l":"D","t":"现货实例"}],"a":["B"],"e":"基于所提供的要求，对于该公司研究实验室中的 EC2 实例而言，最具成本效益的实例购买选项是：B. 按需实例以下说明了为何按需实例是此场景的最佳选择：1. 运行时间短：这些实例每周仅运行 3 小时，这是一种非常短暂且不频繁的使用模式。按需实例非常适合短期、不规则的工作负载。2. 不允许中断：题目表明这些实例不能被中断。按需实例提供了最高级别的可用性，不会像竞价实例那样受到中断影响。3. 灵活性：使用按需实例，公司可以完全控制实例的生命周期，能够根据需要启动和停止实例，无需做出任何长期承诺。4. 短期使用的成本效益：对于每周如此有限的使用时间，按需实例比那些需要长期承诺或预付款的选项更具成本效益。我们简要分析一下为何其他选项不太合适：- 计算节省计划：这需要承诺持续使用一定量的计算资源，与所描述的不频繁使用模式不相符。 - 可转换预留实例：这些需要1 年或3 年的承诺，对于每周仅使用 3 小时的情况而言，并不具有成本效益。 - 竞价实例：虽然通常价格更低，但它们可能会被中断，这不符合实例不能被中断的要求。为了进一步优化成本，该公司应考虑：1. 合理调整实例大小，确保为其工作负载使用最合适的实例类型。2. 实施适当的启动和停止程序，确保实例每周仅在所需的 3 小时时间段内运行。3. 定期审查其使用模式和需求，以确保随着需求的变化，按需实例仍然是最具成本效益的选项。如需获取最新的定价信息并探索潜在的成本节省方法，建议使用 AWS 定价计算器，并查阅关于 EC2 定价选项的 AWS 官方文档。","s":"源#566"},{"id":"D4-568","d":4,"t":"single","q":"一家公司迁移到 AWS 云。现在公司按需支付服务费用。公司正在从云计算的哪个优势中受益？","o":[{"l":"A","t":"停止花费资金运行和维护数据中心"},{"l":"B","t":"提高速度和敏捷性"},{"l":"C","t":"几分钟内走向全球"},{"l":"D","t":"将固定费用转换为变动费用"}],"a":["D"],"e":"通过迁移到 AWS 云并按需支付服务费用，公司正在从将固定费用转换为变动费用的云计算优势中受益。这使他们能够根据实际使用情况上下调整成本，而不是承担固定的基础设施成本。","s":"源#568"},{"id":"D4-570","d":4,"t":"single","q":"一家公司想要在迁移前估计其 AWS 架构解决方案的成本。哪个 AWS 服务或功能将满足此要求？","o":[{"l":"A","t":"Amazon Detective"},{"l":"B","t":"AWS Budgets"},{"l":"C","t":"AWS Resource Explorer"},{"l":"D","t":"AWS 定价计算器"}],"a":["D"],"e":"AWS 定价计算器是一个工具，使用户能够在迁移前估计和计划他们的 AWS 成本。它允许公司输入他们的预期使用情况，并提供相关成本的估计。","s":"源#570"},{"id":"D4-572","d":4,"t":"single","q":"一所大学获得一笔赠款，用于使用 AWS 服务进行研究。研究团队需要确保赠款资金在整个学年内持续。团队已决定每月分配一定金额，总计达到总赠款金额。哪个 AWS 服务或功能会在支出超过计划金额时通知团队？","o":[{"l":"A","t":"AWS Budgets"},{"l":"B","t":"成本探索器"},{"l":"C","t":"成本分配标签"},{"l":"D","t":"成本类别"}],"a":["A"],"e":"AWS Budgets 是一项服务，使用户能够为他们的 AWS 资源设置自定义预算，并在成本或使用量超过预算金额时接收警报。这有助于随着时间的推移监控和管理成本，确保支出不会超过分配的预算。","s":"源#572"},{"id":"D4-577","d":4,"t":"single","q":"哪个 AWS 团队或提供帮助用户通过在几个专业实践领域的付费参与来加速云采用？","o":[{"l":"A","t":"AWS 企业支持"},{"l":"B","t":"AWS 解决方案架构师"},{"l":"C","t":"AWS 专业服务"},{"l":"D","t":"AWS 账户经理"}],"a":["C"],"e":"AWS 专业服务是一个专家团队，提供包括在各个专业实践领域的付费参与在内的广泛服务。这些服务旨在帮助用户加速他们的云采用，并充分利用他们的 AWS 环境。","s":"源#577"},{"id":"D4-578","d":4,"t":"single","q":"一家公司需要购买 Amazon EC2 实例以支持将连续运行超过 1 年的应用程序。哪种EC2 实例购买选项最经济地满足这些要求？","o":[{"l":"A","t":"专用实例"},{"l":"B","t":"现货实例"},{"l":"C","t":"预留实例"},{"l":"D","t":"按需实例"}],"a":["C"],"e":"预留实例为需要连续可用性超过一段较长时间（例如超过 1 年）的应用程序提供显著的成本节省。通过承诺特定期限，公司可以获得实例小时费率的折扣。","s":"源#578"},{"id":"D4-602","d":4,"t":"single","q":"一家公司在 AWS 云中运行其生产工作负载。该公司需要选择一项 AWS 支持计划。哪项AWS 支持计划将以最低成本满足这些要求？","o":[{"l":"A","t":"开发者"},{"l":"B","t":"企业入门版"},{"l":"C","t":"企业版"},{"l":"D","t":"业务版"}],"a":["D"],"e":"业务支持计划专为在 AWS 云中运行生产工作负载的公司设计，与企业计划相比，它以相对较低的成本提供基本支持。而开发人员支持计划适合测试和实验，但可能无法提供生产工作负载所需的支持级别。","s":"源#602"},{"id":"D4-634","d":4,"t":"single","q":"一家公司有一个将连续运行 1 年的工作负载。该工作负载不能容忍服务中断。哪种Amazon EC2 购买选项将是最具成本效益的？","o":[{"l":"A","t":"所有预付预留实例"},{"l":"B","t":"部分预付预留实例"},{"l":"C","t":"专用实例"},{"l":"D","t":"按需实例"}],"a":["A"],"e":"对于将连续运行 1 年且不能容忍服务中断的工作负载，所有预付预留实例提供了最具成本效益的选项。通过使用所有预付预留实例，公司可以预先支付实例的全部费用，并与按需实例相比获得显著的折扣。此选项提供了成本节约，并确保实例在工作负载的持续时间内可用。","s":"源#634"},{"id":"D4-639","d":4,"t":"single","q":"一家公司希望在 Amazon EC2 实例上运行其应用程序时具有成本效益的选项，并且应用程序可以被中断。 哪种 EC2 实例类型将满足这些要求？","o":[{"l":"A","t":"Spot 实例"},{"l":"B","t":"按需实例"},{"l":"C","t":"预留实例"},{"l":"D","t":"专用实例"}],"a":["A"],"e":"Spot 实例为可以被中断的短期工作负载提供了成本效益的选项。Spot 实例的价格与按需实例相比有折扣，使其适合于可以容忍中断且不需要保证可用性的应用程序。","s":"源#639"},{"id":"D4-641","d":4,"t":"single","q":"哪项 AWS 服务或工具提供了历史 AWS 支出模式的可视化以及未来 AWS 成本的预测？","o":[{"l":"A","t":"AWS Cost and Usage Report"},{"l":"B","t":"AWS Budgets"},{"l":"C","t":"Cost Explorer"},{"l":"D","t":"Amazon Cloud Watch"}],"a":["C"],"e":"Cost Explorer 提供了历史 AWS 支出模式的可视化，并允许用户分析成本数据。它还根据历史趋势和使用模式提供未来成本的预测，帮助公司规划和预算其 AWS 支出。","s":"源#641"},{"id":"D4-675","d":4,"t":"single","q":"一家公司已将其所有基础设施迁移到 AWS 云。为了提前为每个季度做计划，财务团队希望跟踪前几个月所有资源的成本和使用数据。财务团队希望自动生成包含这些数据的报告。 该财务团队应该使用哪项AWS服务或功能来满足这些要求？","o":[{"l":"A","t":"Amazon Detective"},{"l":"B","t":"AWS Pricing Calculator"},{"l":"C","t":"AWS Budgets"},{"l":"D","t":"AWS Savings Plans"}],"a":["C"],"e":"AWS Budgets 允许财务团队设置预算并跟踪 AWS 资源的成本和使用情况。它可以根据定义的预算和使用数据自动生成报告，帮助团队提前计划并监控 AWS 资源的支出。","s":"源#675"},{"id":"D4-677","d":4,"t":"single","q":"一家公司想要将关键的本地生产系统迁移到 Amazon EC2 实例。生产实例将使用至少3 年。该公司希望选择一种成本最低的定价选项。 哪种解决方案将满足这些要求？","o":[{"l":"A","t":"按需实例"},{"l":"B","t":"预留实例"},{"l":"C","t":"Spot 实例"},{"l":"D","t":"AWS 免费套餐"}],"a":["B"],"e":"预留实例与按需实例相比，在使用至少 3 年的情况下提供了显著的成本节约。通过购买预留实例，公司可以锁定较低的每小时费率，并最小化在 Amazon EC2 上运行生产系统的成本。","s":"源#677"},{"id":"D4-684","d":4,"t":"single","q":"一家公司需要在 Amazon EC2 实例上运行应用程序而不中断。 哪种 EC2 实例购买选项将最具成本效益地满足此要求？","o":[{"l":"A","t":"标准预留实例"},{"l":"B","t":"可转换预留实例"},{"l":"C","t":"按需实例"},{"l":"D","t":"Spot 实例"}],"a":["A"],"e":"对于需要在 Amazon EC2 实例上长期、不间断运行应用程序的情况，标准预留实例提供了最具成本效益的选项。与按需实例相比，标准预留实例在提前承诺使用特定实例类型的情况下，提供了显著的折扣，确保了应用程序的稳定运行和成本节约。","s":"源#684"},{"id":"D4-688","d":4,"t":"single","q":"一家公司想要为其全球用户提供低延迟。 AWS 云的哪个功能满足这一要求？","o":[{"l":"A","t":"全球基础设施"},{"l":"B","t":"按需付费定价"},{"l":"C","t":"托管服务"},{"l":"D","t":"规模经济"}],"a":["A"],"e":"AWS 云的全球基础设施允许公司在全球范围内部署应用程序和服务，使其更接近全球用户。这减少了数据传输的距离，从而降低了延迟，提供了更好的用户体验。","s":"源#688"},{"id":"D4-690","d":4,"t":"single","q":"一家公司拥有多个 AWS 账户。该公司需要从 AWS 接收合并账单，并集中管理安全和合规性。该公司应该使用哪项 AWS 服务或功能来满足这些要求？","o":[{"l":"A","t":"AWS Cost and Usage Report"},{"l":"B","t":"AWS Organizations"},{"l":"C","t":"AWS Config"},{"l":"D","t":"AWS Security Hub"}],"a":["B"],"e":"AWS Organizations 允许公司集中管理多个 AWS 账户，包括接收合并账单和在所有账户中强制执行安全和合规性政策。它提供了一个层次结构来管理 AWS 资源，简化了账户管理。","s":"源#690"},{"id":"D4-695","d":4,"t":"single","q":"一家公司想要可视化和管理特定时间段内的 AWS 云成本和使用情况。 哪项 AWS 服务或功能将满足这些要求？","o":[{"l":"A","t":"Cost Explorer"},{"l":"B","t":"Consolidated billing"},{"l":"C","t":"AWS Organizations"},{"l":"D","t":"AWS Budgets"}],"a":["A"],"e":"Cost Explorer 提供了可视化和洞察 AWS 云成本和使用情况的功能，允许公司在特定时间段内分析成本趋势、识别成本驱动因素，并做出明智的决策来优化成本。","s":"源#695"},{"id":"D4-705","d":4,"t":"single","q":"一家公司想要测试一个新应用程序。 哪个 AWS 原则能帮助公司测试应用程序？","o":[{"l":"A","t":"为了换取成本折扣而做出长期承诺。"},{"l":"B","t":"根据需要进行扩展，无需任何长期承诺。"},{"l":"C","t":"对应用程序基础设施拥有完全控制权。"},{"l":"D","t":"管理与云相关的所有维护任务。"}],"a":["B"],"e":"允许公司在没有长期承诺的情况下进行扩展（B）的原则对于测试新应用程序至关重要。这种灵活性确保可以根据测试阶段的需求调整资源，而测试阶段的需求通常是不可预测的。","s":"源#705"},{"id":"D4-706","d":4,"t":"single","q":"一家公司计划启动一个包含许多产品目录图片的电子商务网站。公司希望将网站运营成本控制在特定预算内。 公司应该使用哪个 AWS 服务或工具来监控网站持续的成本？","o":[{"l":"A","t":"AWS 成本管理器"},{"l":"B","t":"AWS 软件开发工具包"},{"l":"C","t":"EC2 镜像构建器"},{"l":"D","t":"AWS 云形成"}],"a":["A"],"e":"AWS 成本管理器是设计用来监控和管理 AWS 成本的工具。它提供了对您的消费模式的洞察，并帮助您预算和控制成本，使其成为保持网站成本在特定预算内的正确选择。","s":"源#706"},{"id":"D4-711","d":4,"t":"single","q":"一家公司需要在需要时提供不间断的 Amazon EC2 实例，并按秒支付计算能力。哪种EC2 实例购买选项能满足这些要求？","o":[{"l":"A","t":"预留实例"},{"l":"B","t":"现货实例"},{"l":"C","t":"按需实例"},{"l":"D","t":"专用实例"}],"a":["C"],"e":"按需实例是允许您按秒支付计算能力，无需长期承诺或预付费用的购买选项。这对于需要立即和持续访问实例的不间断工作负载来说是理想的。","s":"源#711"},{"id":"D4-719","d":4,"t":"single","q":"一家在本地服务器上运营的公司决定开展新的业务线。公司确定新工作负载需要额外的服务器。云计算的哪个优势可以帮助公司尽快提供额外的基础设施？","o":[{"l":"A","t":"从大规模经济中获益"},{"l":"B","t":"提高速度和敏捷性"},{"l":"C","t":"将固定费用转换为可变成本"},{"l":"D","t":"几分钟内全球化"}],"a":["B"],"e":"云计算的优势在于能够快速提供额外的基础设施，即提高速度和敏捷性 (B)。这意味着可以根据需求按需启动资源，无需与本地服务器相关的漫长采购流程。 [多选题]","s":"源#719"}];

<script>

/* ================================================================
   ===================== 题库数据（构建注入 QUIZ_META + QUIZ_QUESTIONS） ================
   ================================================================ */
const QUESTIONS = QUIZ_QUESTIONS;
const META = (typeof QUIZ_META !== 'undefined' && QUIZ_META) ? QUIZ_META : {};
const EXAM = META.exam || 'QUIZ';
const LS_PREFIX = META.lsPrefix || EXAM.toLowerCase();

const GLOSSARY = META.glossary || {};

function getGlossaryForQuestion(q) {
  const texts = [q.q];
  if(q.o && Array.isArray(q.o)) q.o.forEach(o => texts.push(o.t));
  if(q.e) texts.push(q.e);
  const fullText = texts.join(' ');
  const found = [];
  const sorted = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
  for(const term of sorted) {
    if(fullText.includes(term)) found.push({term, def: GLOSSARY[term]});
  }
  return found;
}

/* ================================================================
   ===================== 术语高亮 + 弹定义 ================
   ================================================================ */
// 长词优先排序，独立 token 边界匹配，避免 EBS 误标 Amazon EBS 中的 EBS 等
function getGlossarySortedKeys() {
  return Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
}

// 判断术语在文本中是否为独立出现（前后非字母/数字）
function isIndependentToken(text, idx, term) {
  const before = text[idx-1];
  const after = text[idx + term.length];
  const isLetter = c => c && /[A-Za-z0-9]/.test(c);
  return !isLetter(before) && !isLetter(after);
}

// 将解析正文中的术语高亮为可点击 span，返回 HTML
function highlightGlossaryTerms(text) {
  if(!text) return text;
  const sortedKeys = getGlossarySortedKeys();
  let result = '';
  let i = 0;
  while(i < text.length) {
    let matched = false;
    for(const term of sortedKeys) {
      if(!term) continue;
      const idx = text.indexOf(term, i);
      if(idx === i && isIndependentToken(text, idx, term)) {
        const def = GLOSSARY[term] || '（暂无定义）';
        const termEsc = term.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const defEsc = def.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        result += `<span class="gloss-term" onclick="showGlossTip(event,'${termEsc}','${defEsc}')">${term}</span>`;
        i += term.length;
        matched = true;
        break;
      }
    }
    if(!matched) {
      // 中文等宽字符直接输出，保持原文本
      result += text[i];
      i++;
    }
  }
  return result;
}

// 点击术语弹出定义浮层
function showGlossTip(e, term, def) {
  e.stopPropagation();
  const tip = document.getElementById('glossTip');
  document.getElementById('glossTipTerm').textContent = term;
  document.getElementById('glossTipDef').textContent = def || '（暂无定义）';
  tip.style.display = 'block';
  // 定位：优先在点击位置下方，避免超出视口
  const pad = 12;
  let left = e.clientX + pad;
  let top = e.clientY + pad;
  // 先渲染再量尺寸
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if(left + tw > window.innerWidth - 8) left = e.clientX - tw - pad;
  if(top + th > window.innerHeight - 8) top = e.clientY - th - pad;
  if(left < 8) left = 8;
  if(top < 8) top = 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

function closeGlossTip() {
  document.getElementById('glossTip').style.display = 'none';
}

// 点击页面其它区域关闭浮层
document.addEventListener('click', function(e) {
  const tip = document.getElementById('glossTip');
  if(tip && tip.style.display === 'block' && !tip.contains(e.target)) {
    closeGlossTip();
  }
});

// 按 Esc 关闭浮层
document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') closeGlossTip();
});

/* ================================================================
   ===================== localStorage 操作 =========================
   ================================================================ */
const LS_ANSWERS = LS_PREFIX + '_answers';
const LS_WRONG   = LS_PREFIX + '_wrong';
const LS_PROGRESS = LS_PREFIX + '_progress';

function getAnswers() { return JSON.parse(localStorage.getItem(LS_ANSWERS)||'[]'); }
function setAnswers(a) { localStorage.setItem(LS_ANSWERS,JSON.stringify(a)); }
function getWrong() { return JSON.parse(localStorage.getItem(LS_WRONG)||'[]'); }
function setWrong(w) { localStorage.setItem(LS_WRONG,JSON.stringify(w)); }
function getProgress() { return JSON.parse(localStorage.getItem(LS_PROGRESS)||'{}'); }
function setProgress(p) { localStorage.setItem(LS_PROGRESS,JSON.stringify(p)); }

/* ----------------------------------------------------------------
   作答记录：会话态 / 累计统计态分离（2026-09-11 修复）
   旧缺陷：模拟考核误读全局 localStorage 历史 → 进场即显示「已答对/曾答错」、
   题号导航提前染色、成绩单把练习与往场算进本次（实测正确数>题数、未答为负、
   分数超满分、正确率>100%）。
   三态口径：
     · sessionResults()       本场逐题作答（quizState.results）＝「本次」唯一真源
     · sessionScopedAnswers() 视图用作答集：考核=仅本场；练习模式=全局历史（原行为）
     · recordAnswer()         仍写全局 store → 错题集与统计口径不变
   ---------------------------------------------------------------- */
function sessionResults() {
  const r = (quizState && quizState.results) || {};
  return Object.keys(r).map(id => ({id, ua:r[id].ua, ok:r[id].ok, ts:r[id].ts}));
}
function sessionScopedAnswers() {
  return (quizState && quizState.mode === 'exam') ? sessionResults() : getAnswers();
}

function recordAnswer(qId, userAnswer, isCorrect) {
  const answers = getAnswers();
  answers.push({id:qId,ua:userAnswer,ok:isCorrect,ts:Date.now()});
  setAnswers(answers);
  const wrong = getWrong();
  const idx = wrong.findIndex(w=>w.id===qId);
  if(!isCorrect) {
    if(idx>=0) { wrong[idx].count++; wrong[idx].last=Date.now(); }
    else { wrong.push({id:qId,count:1,last:Date.now(),mastered:false}); }
  }
  setWrong(wrong);
}

function markMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=true;
  setWrong(wrong);
}
function unmarkMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=false;
  setWrong(wrong);
}
function removeWrong(qId) {
  setWrong(getWrong().filter(x=>x.id!==qId));
}

/* ================================================================
   ===================== 辅助函数 =================================
   ================================================================ */
const DOMAIN_NAMES = META.domains || {};
const DOMAIN_WEIGHTS = META.weights || {};
const DOMAIN_KEYS = Object.keys(DOMAIN_NAMES).map(Number).sort((a,b)=>a-b);
const EXAM_P = META.examParams || {};
const EXAM_COUNT = EXAM_P.count || 50;
const EXAM_MIN = EXAM_P.minutes || 60;
const EXAM_PASS = EXAM_P.pass || 700;
const TYPE_NAMES = {single:'单选题',multiple:'多选题',hot:'拖拽题'};

function getQById(id) { return QUESTIONS.find(q=>q.id===id); }
function shuffle(arr) { const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function generateShuffledOptions(questions) {
  const opts = {};
  const newAnswers = {};
  questions.forEach(q => {
    if(q.t==='single'||q.t==='multiple') {
      const shuffled = shuffle([...q.o]);
      const labels = 'ABCDEFGHIJ';
      const relabeled = shuffled.map((item, i) => ({l: labels[i], t: item.t}));
      opts[q.id] = relabeled;
      const contentToNewLabel = {};
      relabeled.forEach(item => { contentToNewLabel[item.t] = item.l; });
      newAnswers[q.id] = q.a.map(oldL => {
        const oldItem = q.o.find(o => o.l === oldL);
        return oldItem ? contentToNewLabel[oldItem.t] : oldL;
      });
    }
  });
  return { opts, newAnswers };
}

function getStats() {
  const answers = getAnswers();
  const wrong = getWrong();
  const totalCorrect = answers.filter(a=>a.ok).length;
  const totalAnswered = answers.length;
  const acc = totalAnswered ? Math.round(totalCorrect/totalAnswered*100) : 0;
  const doneIds = [...new Set(answers.map(a=>a.id))];
  const completion = Math.round(doneIds.length/QUESTIONS.length*100);
  const domainStats = {};
  for(const d of DOMAIN_KEYS) {
    const dQIds = QUESTIONS.filter(q=>q.d===d).map(q=>q.id);
    const dAnswers = answers.filter(a=>dQIds.includes(a.id));
    const dCorrect = dAnswers.filter(a=>a.ok).length;
    const dTotal = dAnswers.length;
    domainStats[d] = {
      total:dQIds.length, answered:dTotal, correct:dCorrect,
      acc: dTotal ? Math.round(dCorrect/dTotal*100) : 0
    };
  }
  const typeStats = {};
  for(const t of ['single','multiple']) {
    const tQIds = QUESTIONS.filter(q=>q.t===t).map(q=>q.id);
    const tAnswers = answers.filter(a=>tQIds.includes(a.id));
    const tCorrect = tAnswers.filter(a=>a.ok).length;
    const tTotal = tAnswers.length;
    typeStats[t] = { answered:tTotal, correct:tCorrect, acc: tTotal ? Math.round(tCorrect/tTotal*100) : 0 };
  }
  const recentWrong = wrong.filter(w=>!w.mastered).sort((a,b)=>b.last-a.last).slice(0,5);
  const recent = answers.slice(-20).reverse();
  let streak = 0;
  for(const a of recent) { if(a.ok) streak++; else break; }
  return {totalCorrect,totalAnswered,acc,completion,domainStats,typeStats,recentWrong,streak,doneIds:doneIds.length};
}

let currentPage = 'dashboard';
let quizState = null;

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el = document.getElementById('page-'+page);
  if(el) el.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  if(page==='dashboard') renderDashboard();
  else if(page==='quiz') renderQuiz();
  else if(page==='wrongbook') renderWrongBook();
  else if(page==='stats') renderStats();
  else if(page==='settings') renderSettings();
}

function renderDashboard() {
  const s = getStats();
  const el = document.getElementById('page-dashboard');
  let html = `<div class="header"><h1>${EXAM} 刷题工具</h1><button class="theme-btn" onclick="toggleTheme()">${document.getElementById('quizView').classList.contains('dark')?'☀️':'🌙'}</button></div>`;
  html += `<div class="stats-grid">
    <div class="stat-card"><div class="stat-num">${s.doneIds}/${QUESTIONS.length}</div><div class="stat-label">已做题量</div></div>
    <div class="stat-card"><div class="stat-num">${s.acc}%</div><div class="stat-label">总正确率</div></div>
    <div class="stat-card"><div class="stat-num">${s.completion}%</div><div class="stat-label">完成度</div></div>
    <div class="stat-card"><div class="stat-num">${s.streak}</div><div class="stat-label">连续正确</div></div>
  </div>`;
  html += `<div class="domain-grid">`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<div class="domain-card" onclick="startDomain(${d})">
      <div class="d-name">Domain ${d}: ${DOMAIN_NAMES[d]}</div>
      <div class="d-weight">权重 ${DOMAIN_WEIGHTS[d]} | 共${ds.total}题</div>
      <div class="d-bar"><div class="d-bar-fill" style="width:${ds.acc}%"></div></div>
      <div class="d-pct">${ds.answered?ds.acc+'%正确率':'未作答'}</div>
    </div>`;
  }
  html += `</div>`;
  html += `<div class="action-btns">
    <button class="btn-primary" onclick="startContinue()">📝 继续练习</button>
    <button class="btn-primary" onclick="startWrongReview()" style="background:var(--wrong)">🔄 错题重练 (${s.recentWrong.length}题待复习)</button>
    <button class="btn-primary" onclick="startExam()" style="background:var(--correct);color:#fff">📋 模拟考核（${EXAM_COUNT}题/${EXAM_MIN}分钟/${EXAM_PASS}分及格）</button>
  </div>`;
  if(s.recentWrong.length) {
    html += `<div class="recent-wrong"><h3>❌ 最近错题</h3><ul>`;
    s.recentWrong.forEach(w=>{
      const q = getQById(w.id);
      if(q) html += `<li onclick="startSingle('${w.id}')">Domain ${q.d} | ${q.q.slice(0,30)}… | 答错${w.count}次</li>`;
    });
    html += `</ul></div>`;
  }
  html += `<div class="footer-note">${META.footerNote || '题库来源：第三方中文整理，以 AWS 官方材料为准'}</div>`;
