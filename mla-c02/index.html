与定制","focus":"本章练习 12 题","domain":2},{"day":5,"topic":"D3 部署与工作流编排 · 部署基础设施管理 / CI/CD 与 MLOps 编排","focus":"官方权重 24%","domain":3},{"day":6,"topic":"D3 部署与工作流编排 · 资源供给与配置","focus":"本章练习 12 题","domain":3},{"day":7,"topic":"D4 运维、监控与安全 · 推理与性能监控 / 安全与端点防护","focus":"官方权重 24%","domain":4},{"day":8,"topic":"D4 运维、监控与安全 · 成本与性能优化","focus":"本章练习 12 题","domain":4}],"planAuto":true},"chapters":[{"domain":1,"name":"面向 ML 与 AI 的数据准备","weight":"28%","practice":[{"id":"D1-007","d":1,"t":"single","q":"一个缺陷检测项目有 200 万张工业相机图像，每张图带 30 个元数据字段（批次、工位、拍摄参数、人工判定结果）。训练时需要按任意元数据组合筛选出图片子集，并以高吞吐流式读取。最合适的存储设计是？","o":[{"l":"A","t":"图像与元数据一起写入 S3，用对象标签保存元数据字段"},{"l":"B","t":"图像以 BLOB 形式存入 Amazon RDS，元数据做成表字段"},{"l":"C","t":"图像存 S3，元数据入库供筛选，筛选结果生成清单文件驱动训练读取"},{"l":"D","t":"图像与元数据都写进 Amazon DynamoDB，单条记录存二进制图像"}],"a":["C"],"e":"**正确答案：C。** 图像放 S3，元数据进可查询的库（DynamoDB 或 Feature Store），筛选结果落成清单文件（manifest）交给训练作业按清单拉取。\n\n**为什么对：** 这是「双存储分工」的典型场景：像素数据要便宜、大吞吐、不可变，放 S3；元数据要多维组合筛选，放支持索引的库；两者用对象键关联。训练侧不逐条查询，而是一次性把筛选结果落成清单，训练进程按清单流式读 S3，既有高吞吐又不依赖在线查询 QPS。\n\n**其他选项为什么错：**\n- A. S3 对象标签适合生命周期与权限分类，组合筛选与查询能力有限，30 个字段的任意组合筛不动。\n- B. 200 万张图进关系库，备份、扩容、读取吞吐全是瓶颈，成本远高于 S3。\n- D. DynamoDB 单条记录有容量上限，存图像二进制会撞限，吞吐按条目计费。\n\n**关键概念：** 多模态通行做法：大对象进对象存储、小字段进索引、训练靠清单。数据库直接存像素的选项基本可直接排除。","s":"自编·1.1.8"},{"id":"D1-010","d":1,"t":"single","q":"业务分析师需要自己清洗一批 CSV 与 Excel 报表：统一日期格式、剔除异常值、统计各列缺失率，然后交给数据团队入库。分析师不会写代码，也不进入 SageMaker Studio。最合适的工具是？","o":[{"l":"A","t":"SageMaker Data Wrangler 的可视化流程"},{"l":"B","t":"AWS Glue DataBrew 的可视化配方"},{"l":"C","t":"SageMaker Processing 里写自定义 Python 脚本"},{"l":"D","t":"Amazon EMR 上的 Spark SQL 作业"}],"a":["B"],"e":"**正确答案：B。** 用 Glue DataBrew 的可视化配方（recipe）做清洗与剖析。\n\n**为什么对：** 题干给了三个限定：不会写代码、不进 SageMaker Studio、以数据剖析和格式清洗为主。DataBrew 面向的正是这类数据分析人员：内置两百多个预构建转换（格式统一、去重、异常值处理、缺失统计），在浏览器里点选即可，配方可保存复用、可挂到 Glue 作业或定时任务上，产物直接进 S3 或 Catalog，随后交给数据团队入库。\n\n**其他选项为什么错：**\n- A. Data Wrangler 也是可视化，但它嵌在 SageMaker Studio 里，定位是 ML 特征探索与导出到训练流程，题干明确不进入 Studio，且本任务不是特征工程。\n- C. Processing 要求写容器或脚本，分析师不具备这个能力。\n- D. EMR 需要写 Spark SQL 并管理集群，同样不满足“不会写代码”。\n\n**关键概念：** 四个数据转换工具的分工要背清楚：DataBrew＝分析师无代码清洗；Data Wrangler＝ML 特征探索；Glue/EMR＝大规模分布式转换；Processing＝自定义容器化逻辑。判断先看“谁来做”，再看“数据多大”。","s":"自编·1.2.1"},{"id":"D1-017","d":1,"t":"single","q":"一个已上线的推荐模型效果逐月下滑，怀疑线上输入数据的分布发生了变化。需要在训练数据上建立基线，并对线上请求的输入持续比对。最直接的做法是？","o":[{"l":"A","t":"用 Amazon SageMaker Model Monitor 的数据质量监控，以训练数据生成基线并持续比对"},{"l":"B","t":"用 AWS Glue Data Quality 在 ETL 环节做规则校验"},{"l":"C","t":"每周人工抽样 100 条请求看有没有异常"},{"l":"D","t":"提高模型监控的准确率告警阈值"}],"a":["A"],"e":"**正确答案：A。** 用 SageMaker Model Monitor 数据质量监控：以训练数据统计量生成基线，持续采集线上输入并计算偏离。\n\n**为什么对：** 这是「分布漂移」而非「精度下降」——模型没错，输入变了。Model Monitor 基线来自训练数据，算各特征均值、分位数、缺失率，对线上请求做同样统计，偏离超阈值即告警；也能检测数据质量（类型错误、越界、空值）与模型偏差。它监控数据面，能在精度指标掉下来之前先发信号。\n\n**其他选项为什么错：**\n- B. Glue Data Quality 面向 ETL 管道内的规则校验，不监控线上推理请求，也不与训练基线对比。\n- C. 每周看 100 条，样本量与频率撑不起「逐月下滑」的早期发现，且没有统计判据。\n- D. 准确率告警是结果指标，等它掉下来用户已受影响；调阈值只是让告警更迟钝。\n\n**关键概念：** 监控分三层：数据质量（输入对不对）、模型质量（预测准不准）、偏差与可解释（公不公平）。漂移属第一层，必须在推理链路上采集输入，不能靠离线抽查。","s":"自编·1.3.1"},{"id":"D1-018","d":1,"t":"single","q":"用三年前的简历数据训练筛选模型，评估发现女性候选人通过率显著偏低。数据团队只打算删除“性别”这一列后重训。这个做法的问题是什么？","o":[{"l":"A","t":"没有问题，去掉敏感字段即满足公平性要求"},{"l":"B","t":"代理变量仍会携带性别信息，应先用 SageMaker Clarify 度量偏差，再做前处理（重采样/重加权）并检查代理变量"},{"l":"C","t":"应把女性样本全部加权到与男性相同数量后直接上线"},{"l":"D","t":"偏差来自模型，应换一个更复杂的模型解决"}],"a":["B"],"e":"**正确答案：B。** 先用 Clarify 量化偏差，再处理代理变量与前处理，而非只删敏感列。\n\n**为什么对：** 删除敏感字段叫「看不见」，不叫「不存在」。毕业院校、专业、社团、职业空档期、通勤距离都与性别高度相关，模型可借它们重建性别信息，偏差照旧进入预测。正确路径三步：Clarify 计算 DPDI、CI 等指标定位偏差；检查并处理代理变量；用前处理（重采样、重加权）、训练中约束或后处理（分组阈值）降偏，上线前后持续监控。\n\n**其他选项为什么错：**\n- A. 删列不等于去偏，本题最典型的错误答案。\n- C. 等量重采样不解决代理变量问题，还改变业务真实比例；且不应「直接上线」，必须先验证。\n- D. 更复杂的模型更容易拟合历史偏差，方向相反。\n\n**关键概念：** 偏差三阶段：前处理（改数据分布）、中处理（加约束/正则）、后处理（改判定阈值）。度量工具是 Clarify，指标至少说出两个（DPDI、CI）。","s":"自编·1.3.3"},{"id":"D1-019","d":1,"t":"single","q":"信用卡欺诈检测数据中，欺诈样本仅占 0.3%。模型上线后准确率达到 99.7%，但业务反馈几乎抓不到欺诈。最应该改变的是什么？","o":[{"l":"A","t":"继续优化准确率，把 99.7% 提到 99.9%"},{"l":"B","t":"增加训练轮数让模型收敛更好"},{"l":"C","t":"改用 PR-AUC、召回率与 F1 等指标，并配合类权重或重采样处理不平衡"},{"l":"D","t":"把所有样本都预测为正常，也能获得 99.7% 的准确率，说明指标设置正确，问题在数据采集"}],"a":["C"],"e":"**正确答案：C。** 换掉指标，再改训练策略。\n\n**为什么对：** 0.3% 的正例下，全判为“正常”就能拿 99.7% 的准确率——这正好说明准确率在这个场景里没有信息量。评估要看正例：召回率（抓到多少欺诈）、精确率（报警里有多少是真的）、PR-AUC（不平衡下比 ROC-AUC 更敏感）。指标换了以后，训练侧再配类权重、过采样少数类、欠采样多数类或代价敏感学习，模型才会真正偏向识别少数类。\n\n**其他选项为什么错：**\n- A. 在无信息量的指标上继续优化，等于优化“更会忽略欺诈”。\n- B. 收敛更好只会让模型更坚定地判负，问题更严重。\n- D. 选项自己承认了“全判正常也有 99.7%”，却又说指标设置正确，逻辑自相矛盾；采集不是本轮的瓶颈。\n\n**关键概念：** 不平衡数据的第一原则是“先把指标换掉，再谈算法”。准确率在类别比例悬殊时必然虚高，这是必考判断点。","s":"自编·1.3.5"},{"id":"D1-020","d":1,"t":"single","q":"要给 10 万张工业图像做缺陷分类标注，预算有限，要求标注质量可控、并且不能把图像发到公网众包平台。最合适的方案是？","o":[{"l":"A","t":"用公网众包平台，价格最低且速度快"},{"l":"B","t":"让一名工程师全部手工标注，避免一致性判断分歧"},{"l":"C","t":"先用模型自动标注全部数据，人工不再复核"},{"l":"D","t":"用 Amazon SageMaker Ground Truth 的私有工作组，每条数据多人标注并混入黄金标准题做质检"}],"a":["D"],"e":"**正确答案：D。** Ground Truth + 私有工作组 + 多人标注 + 黄金标准题抽检。\n\n**为什么对：** 三个约束同时满足：数据不出可控范围（私有工作组只邀请内部或签约标注员，图像不进公开众包池）；质量可度量（同一张图多人标注看一致性，混入已知答案的黄金标准题持续测每个标注员准确率，识别敷衍者）；成本可控（自动标注辅助 + 低置信样本才送人工，10 万张大部分用主动学习筛过去）。\n\n**其他选项为什么错：**\n- A. 公网众包直接违反「不能发公网」，且工业缺陷需要领域知识，众包准确率不可接受。\n- B. 单人标注没有一致性检验，10 万张工时不现实，个人疲劳会带来系统性偏差。\n- C. 自动标注不做人工复核，等于把模型现有偏差固化进训练标签，缺陷被「洗白」。\n\n**关键概念：** 标注方案四要素：谁来做（人力来源）、怎么保质量（多人一致性 + 黄金题）、怎么省钱（主动学习/自动标注辅助）、合规边界（数据能否出去）。","s":"自编·1.3.2"},{"id":"D1-021","d":1,"t":"single","q":"某电商平台需要实时统计每个商品近 5 分钟的点击量，并将结果写入 SageMaker Feature Store 供实时推荐使用。数据源是 Kinesis Data Streams。以下哪种服务最适合实现这一窗口聚合？","o":[{"l":"A","t":"Managed Service for Apache Flink，按事件时间做 5 分钟窗口聚合"},{"l":"B","t":"AWS Lambda，逐条处理点击事件并累加计数"},{"l":"C","t":"AWS Glue DataBrew，定时刷新特征表"},{"l":"D","t":"Amazon Textract，抽取点击日志中的关键字段"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 窗口聚合是有状态计算：必须记住「5 分钟内已累计的点击数」，Lambda 无状态、逐条执行，除非借助外部存储否则无法维护窗口状态。Managed Service for Apache Flink 有状态、支持事件时间窗口与精确一次语义，是官方文档中该场景的标准答案。\n\n**其他选项为什么错：**\n- B. 用 Lambda 做窗口聚合是典型错误——无状态是它的硬边界\n- C. DataBrew 是可视化批处理工具，不适合毫秒级流式聚合\n- D. Textract 是文档 OCR 服务，与点击流无关。\n\n**关键概念：** 记忆口诀：逐条无状态选 Lambda，有状态窗口选 Flink 或 Spark Structured Streaming。此外业务窗口应按事件时间算，避免流量起伏导致结果漂移。","s":"自编·1.2.3"},{"id":"D1-022","d":1,"t":"single","q":"流式管道按「事件发生的时间」划分业务窗口，而不是按数据到达管道的时间。这样做的主要原因是：","o":[{"l":"A","t":"事件时间窗口实现更简单，不需要维护任何状态"},{"l":"B","t":"处理时间会因网络延迟与乱序导致窗口归属错误，业务语义失真"},{"l":"C","t":"事件时间窗口不需要处理迟到数据，成本更低"},{"l":"D","t":"处理时间无法与 Kinesis Data Streams 集成"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 用户的点击发生在 11:59:58、到达系统是 12:00:03，它应计入 11:55–12:00 的窗口（事件时间）而不是 12:00–12:05（处理时间）。若按处理时间，高峰期积压的事件会集中涌进同一个窗口，统计结果随流量起伏漂移，业务语义失真。\n\n**其他选项为什么错：**\n- A. 恰好相反：用事件时间必须维护 watermark 等状态机制，实现更复杂\n- C. 错误——事件时间必须处理迟到数据（watermark 机制就是为它设计的）\n- D. 处理时间与集成哪个服务无关，是任何流式框架都支持的时钟语义。\n\n**关键概念：** 事件时间=业务语义，处理时间=系统时钟；选事件时间的代价是必须面对迟到数据。","s":"自编·1.2.3"},{"id":"D1-023","d":1,"t":"single","q":"流式管道采用「至少一次」语义保证，特征写入 Feature Store。为避免故障重放导致特征被重复累加，正确的做法是：","o":[{"l":"A","t":"把管道改为「至多一次」语义，宁可丢数据也不重复"},{"l":"B","t":"在 Lambda 里加一个全局计数器，跳过重复事件"},{"l":"C","t":"按主键幂等覆盖写入，让重放的同一条事件只生效一次"},{"l":"D","t":"不做处理，重放概率极低可以忽略"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 至少一次语义下，故障重放会让同一条事件到达多次。特征写入按主键幂等覆盖（同一主键的新值覆盖旧值，而非追加累加），重放多少次结果都一致，这是工程上的标准解。\n\n**其他选项为什么错：**\n- A. 改为至多一次会丢数据，特征完整性更差\n- B. Lambda 是无状态的，跨条维护全局计数器本身就不可靠（实例并行、生命周期短）\n- D. 重放在流式系统是常态而非异常，忽略它会让特征值随时间持续虚高。\n\n**关键概念：** 语义保证三件套：至少一次→下游幂等；精确一次→实现复杂代价高；特征表的主键覆盖写入是幂等的标准实现。","s":"自编·1.2.3"},{"id":"D1-026","d":1,"t":"single","q":"清洗一批从 PDF 抽取的 HTML 内容用于训练语料。关于去除 HTML/XML 标签，正确的做法是：","o":[{"l":"A","t":"剥离标签时保留段落边界等结构信息，不要把结构一并删掉"},{"l":"B","t":"用正则一键删除所有尖括号内容，越干净越好"},{"l":"C","t":"保留全部标签原样进入模型，让模型自己学会忽略"},{"l":"D","t":"先删除标签，再统一删除所有换行符"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 标签剥离的目标是去掉标记噪声、保留内容结构：段落边界、标题层级是有价值的语义信号，一键去标签会把结构也毁掉，导致句段粘连、语义混乱。\n\n**其他选项为什么错：**\n- B. 正则去标签是典型粗暴做法，表格、嵌套结构会被撕碎\n- C. 保留全部标签让模型「自己学会忽略」会把宝贵的上下文窗口浪费在噪声上\n- D. 删光换行符会毁掉段落边界，与 A 背道而驰。\n\n**关键概念：** 清理顺序有讲究：先统一编码与不可见字符、再剥标签（保结构）、再去页眉页脚与重复行、最后分块。教材案例：300 页手册先清理再分块，token 数少 22%，检索命中率反而提高——噪声少了。","s":"自编·1.2.6"},{"id":"D1-027","d":1,"t":"single","q":"对一个情感分类数据集做数据增强（同义替换、回译）。以下哪条是增强操作必须遵守的红线？","o":[{"l":"A","t":"增强样本数不能超过原始样本数"},{"l":"B","t":"增强后样本的标签必须保持不变"},{"l":"C","t":"增强只能用于文本，不能用于图像"},{"l":"D","t":"增强后必须重新训练整个模型"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 增强的前提是样本语义等价：分类任务里，增强后的样本标签不变这条规则才成立。同义替换、回译都可能悄悄改动语义——尤其是金额、否定词被改动后，样本情感可能翻转，标签却没跟着改，等于给模型喂错误监督信号。\n\n**其他选项为什么错：**\n- A. 增强比例没有这种硬性上限，按需要定\n- C. 增强在图像里同样常用（翻转、裁剪、加噪）\n- D. 增强发生在数据准备阶段，是否重训与增强本身无关。\n\n**关键概念：** 红线记忆：凡增强，必须抽样人工核对；生成任务的改写更要小心，因为改写可能改变正确输出本身。","s":"自编·1.2.6"},{"id":"D1-028","d":1,"t":"single","q":"用「回译」（中译英再译回中文）扩充客服意图分类的训练样本。这种做法的主要风险是：","o":[{"l":"A","t":"回译生成的新样本会带有英文语法错误"},{"l":"B","t":"回译需要调用外部翻译 API，无法在 AWS 内完成"},{"l":"C","t":"回译可能改变句子的关键语义（如金额、否定词），样本标签随之失真"},{"l":"D","t":"回译后的样本长度必然超出模型输入上限"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 回译属于等价性改写，但翻译模型并不保证语义完全保真：「不退货」译回「不用退货」、「满 100 减 20」的金额结构都可能被改写。分类任务里标签不跟着语义变，就产生了带错误标签的样本。教材把「改变语义（金额、否定词被改动）」列为回译的头号风险。\n\n**其他选项为什么错：**\n- A. 语法问题不是主要风险，语义等价性才是\n- B. 翻译可用 Amazon Translate 在 AWS 内完成\n- D. 长度问题可通过截断与分块处理，不是回译特有的风险。\n\n**关键概念：** 三种领域增强的风险对照：同义替换/回译→改语义；模板化改写→学模板不学语义；术语归一→过度归一丢细粒度差异。","s":"自编·1.2.6"}],"sections":[{"h":"数据采集与存储（Collect and store data.）","body":"### 这一域考什么\n\nD1 占 28%，是四域之最。但它的\"重\"不在难度，而在**覆盖面**——考试默认你是一个要在真实环境里把数据搬到训练任务前面的人，而不是在 notebook 里读一份干净的 CSV。所以它问的问题都有共同形状：\n\n> 给定一个具体的源、一个具体的量、一个具体的成本约束，你选哪个服务、为什么不是另外那个、选错会付出什么代价。\n\n三条主线贯穿全域：\n\n1. **存取分离**（任务 1.1）：数据放在哪、怎么搬、搬多少、什么格式。\n2. **加工与表征**（任务 1.2）：原始数据怎么变成模型能吃的形态，包括传统特征工程和 C02 新增的 embedding、RAG 文档准备、微调数据准备。\n3. **可信度**（任务 1.3）：数据本身有没有问题——质量、标注、偏差、不平衡、完整性。\n\n### 与 AIP-C01 / AIF-C01 的问法差别\n\n同一批服务，三个级别问的层次完全不同。**这是最容易答错的地方**——用 AIF 的答法答 MLA 的题，方向对但落点空。\n\n| 级别 | 主问题 | 典型题干口吻 | 答案长什么样 |\n|---|---|---|---|\n| AIF-C01 | 这是什么 | \"以下哪项描述最符合……\" | 一句定义 |\n| AIP-C01 | 方案怎么设计 | \"为了支持 RAG，应如何设计向量存储\" | 架构与组件选择 |\n| **MLA-C02** | **工程上怎么落地、代价多大** | \"训练任务读取 S3 上的 2TB Parquet 数据耗时过长，应如何定位与改善\" | **具体服务配置 + 瓶颈点 + 成本/性能权衡** |\n\n看到\"如何设计\"→ AIP 语境；看到\"训练很慢 / 成本超了 / 摄取失败\"→ MLA 语境。MLA 的正确答案往往包含一个**约束条件**（成本、吞吐、延迟、合规）而不是单纯的功能描述。\n\n### 学习主线（不按编号顺序）\n\n官方编号 1.1 → 1.2 → 1.3 是逻辑顺序，但按这个顺序学，第 1.3 节的偏差管理会因为缺少前置概念而变成死记。建议的顺序：\n\n```\n1.1.2 存储选型四维  ← 先建立「成本/性能/结构/合规」这把尺子\n      ↓\n1.1.1 数据源抽取 · 1.1.4 流式 · 1.1.5 格式  ← 有了尺子再谈搬数据\n      ↓\n1.1.3 排障  ← 前面都懂了，才看得懂瓶颈在哪\n      ↓\n1.2.1 转换工具分工 · 1.2.4 特征工程  ← 传统 ML 的基本功\n      ↓\n1.2.5 embedding · 1.2.7 RAG 文档 · 1.2.9 微调数据  ← C02 新增，GenAI 线\n      ↓\n1.1.7 向量库 · 1.1.9 Feature Store  ← 承载上面两类加工结果的容器\n      ↓\n1.3 全节  ← 数据质量的把关，放最后反而顺\n```\n\n### 常见失分点（真实考试口吻）\n\n1. **把\"数据量\"当唯一变量**。MLA 的题几乎从不只问容量，而是\"容量够但慢\"——瓶颈常在实例带宽、EFS 突发额度、S3 前缀热区、DynamoDB 热分区，而不在总容量。\n2. **选最贵的服务当答案**。Glue/EMR 不一定优于一段 Lambda 或 PySpark，题干里有成本约束时要优先选\"够用且便宜\"的。\n3. **忽略训练与推理的一致性**。Feature Store、embedding 版本、数据划分方式，只要训练和线上不一致，模型效果就会在你没改代码的情况下悄悄掉。\n\n#### 这一节学什么\n这一节对应考纲任务 1.1「数据采集与存储（Collect and store data.）」。\n\n> 官方原名：Collect and store data.\n> 技能点 9 条｜C02 新增 2 条｜可复用 1 条\n\n| 编号 | 官方技能点（英文原文） | 中文速记 |\n|---|---|---|\n| 1.1.1 | Extract data from data sources (for example, Amazon S3, Amazon EBS, Amazon EFS, Amazon RDS, Amazon DynamoDB, Amazon OpenSearch Service). | 从六类数据源抽取数据 |\n| 1.1.2 | Make storage decisions and configure storage services based on cost, performance, data structure, and data compliance. | 按成本/性能/结构/合规四维选存储 |\n| 1.1.3 | Troubleshoot and debug data ingestion and storage issues that involve capacity and scalability. | 摄取与存储的容量和扩展性排障 |\n| 1.1.4 | Use AWS streaming data sources to ingest data (for example, by using Amazon Kinesis, Apache Flink, Apache Kafka). | 流式摄取 |\n| 1.1.5 | Ingest from and write by using appropriate data formats (for example, Apache Parquet, JSON, CSV, ORC) based on data access patterns. | 按访问模式选数据格式 |\n| 1.1.6 | Merge data from multiple sources (for example, by using programming techniques, AWS Glue, Apache Spark). | 多源数据合并 |\n| 1.1.7 | Configure scalable vector databases for AI applications (for example, OpenSearch Service, Amazon RDS with pgvector, Amazon S3) based on specifications. | 配置可扩展向量数据库 |\n| 1.1.8 | Ingest and store diverse data types (for example, text, images, audio) for AI and ML applications. | 多模态数据摄取与存储 |\n| 1.1.9 | Ingest data into SageMaker Feature Store. | 数据入 Feature Store |\n\n#### 从六类数据源抽取数据\n\n**定义**：把数据从\"它被业务系统写进去的地方\"搬到\"训练任务能高效读的地方\"。这两处几乎从来不是同一处，抽取就是把差异抹平的过程。\n\n**为什么不是\"直接读就行\"**：官方列的六个源，存储模型完全不同，直接读的代价也不同。\n\n| 数据源 | 存储模型 | 训练任务直读的问题 |\n|---|---|---|\n| Amazon S3 | 对象，扁平命名空间 | 小文件多时元数据请求开销大；跨区域有传输成本 |\n| Amazon EBS | 块设备，单实例挂载 | 不能多机共享；容量与性能绑在实例上；实例释放即失去 |\n| Amazon EFS | NFS 文件系统，多实例并发 | 高并发小文件读写时吞吐受限；跨 AZ 访问有延迟惩罚 |\n| Amazon RDS | 关系型，事务一致 | 训练长查询会占用连接与 IOPS，影响业务库 |\n| Amazon DynamoDB | 键值 / 文档 | 全表扫描极贵；按请求计费，批量读等于烧钱 |\n| Amazon OpenSearch Service | 搜索引擎，倒排 + 向量 | 适合检索不适合全量拉取；聚合查询成本高 |\n\n由此得到三条判断顺序：\n\n1. **能不能直读**——S3 直读通常最划算（SageMaker 训练任务原生支持 S3 输入通道）。EBS/EFS 只适合已经有共享文件系统语义的场景（如遗留训练脚本读本地路径）。\n2. **要不要落地一份副本**——业务库（RDS/DynamoDB）承载在线流量，训练拉全量必须走副本或导出，否则是在拿线上稳定性换离线分析。\n3. **全量还是增量**——首次全量 + 之后 CDC（变更数据捕获）增量，是成本与新鲜度的平衡点。DynamoDB Streams、RDS 的导出到 S3、Kinesis 都能承担增量侧。\n\n**抽取方式的三档**\n\n| 方式 | 适用 | 代价 |\n|---|---|---|\n| 批量全量（按天/按周） | 数据量中等、新鲜度要求低 | 每次重跑，成本线性增长 |\n| 增量 / CDC | 数据量大、需要准实时 | 实现复杂，要处理乱序与重复 |\n| 联邦查询（不落地） | 只做探索、样本量小 | 每次都打源系统，不能用于训练 |\n\n**教学案例（虚构示意）**：某制造企业的设备传感器数据在 DynamoDB（在线看板用）、工单在 RDS、历史明细归档在 S3。要做设备故障预测模型：\n- 历史训练集 → S3 上的归档明细（列式，直读）\n- 近 30 天补充 → 从 DynamoDB 按时间范围导出到 S3（不扫全表）\n- 工单标签 → RDS 只读副本 + 每日导出，不在主库跑 join\n\n**关联 AWS 服务**：AWS Glue（抽取编排 + Data Catalog）、AWS DataSync（本地/跨存储搬迁）、Amazon S3 Transfer Acceleration（远距离上传）、AWS Database Migration Service（持续复制）。\n\n#### 按成本、性能、数据结构、合规四维选存储\n\n**定义**：存储选型不是\"哪个快选哪个\"，而是四个维度同时约束下的可行解。任何一个维度上不可行，其他维度再优也不算答案。\n\n**四维的具体含义**\n\n| 维度 | 具体问什么 | 常见误判 |\n|---|---|---|\n| 成本 | 单位容量价格、请求价格、传输价格、留存策略 | 只看容量单价，忽略请求费与跨 AZ 传输费 |\n| 性能 | 吞吐、IOPS、延迟、并发数 | 只看平均吞吐，忽略尾延迟与突发行为 |\n| 数据结构 | 对象 / 块 / 文件 / 关系 / 键值 / 向量 | 用对象存储承担需要随机改写的小文件 |\n| 合规 | 加密方式、密钥归属、留存与不可篡改、数据驻留 | 只做了静态加密，没做密钥自主管理（CMK） |\n\n**选型决策路径**\n\n```\n需要多机并发、以文件路径访问？\n├─ 是 → 数据量 TB 级以内、通用场景 → Amazon EFS\n│        单机高性能、低延迟 → Amazon EBS（只挂一台）\n└─ 否 → 需要 SQL 事务与 join → Amazon RDS\n         需要毫秒级 KV 与弹性规模 → Amazon DynamoDB\n         需要全文/向量检索 → Amazon OpenSearch Service\n         以上都不是 / 大规模训练数据湖 → Amazon S3\n```\n\n**训练场景的三条硬约束**\n\n1. **吞吐优先于容量**：GPU 训练时数据供给跟不上就是 GPU 闲置。S3 的聚合吞吐靠并发请求拿，不是单流；EFS 要看吞吐模式（Bursting 靠突发额度，Provisioned 要单独买）。\n2. **随机读 vs 顺序读**：训练是大量小文件随机读（每个样本一个文件），这对 EFS 和 S3 的小文件都敏感。把样本打包成 Shuffle 友好的格式（如 TFRecord、WebDataset、Parquet 行组）比换存储更有效。\n3. **合规要落到密钥与留存**：S3 用 SSE-KMS + 自有 CMK 才算\"密钥自主可控\"；S3 Object Lock 用于不可篡改留存；跨区域复制要确认数据驻留要求是否允许。\n\n**成本上的相对关系（只记方向，不背单价）**\n\n| 存储 | 相对成本 | 相对延迟 | 典型用途 |\n|---|---|---|---|\n| S3 标准 | 低 | 毫秒～数十毫秒 | 数据湖、训练输入 |\n| S3 低频 / 归档 | 更低 | 更高（取回有延迟/费用） | 冷数据、合规留存 |\n| EBS gp3 | 中 | 亚毫秒 | 单机高性能训练/推理 |\n| EFS | 中高 | 毫秒 | 多机共享文件 |\n| OpenSearch | 高（按实例 + 存储） | 毫秒 | 检索服务 |\n\n**教学案例（虚构示意）**：一支团队把 20 万张 200KB 的小图片直接放 S3，训练时每个 epoch 读取耗时占 60%。四维分析后发现：成本没问题、结构没问题，**性能维度坏了**——小文件随机读把开销压在请求上。改法不是换存储，而是打包成每包 500MB 的分片格式 + 本地缓存，读取耗时降到 15%。\n\n**关联 AWS 服务**：Amazon S3（含 Storage Class 与生命周期策略）、Amazon EBS（gp3/io2）、Amazon EFS（吞吐模式）、AWS KMS（密钥策略）。\n\n#### 摄取与存储的容量和扩展性排障\n\n**定义**：这类题问的是\"能存但慢\"\"能跑但超时\"\"量一大就失败\"，要求你从不完整信息里定位瓶颈层。\n\n**排障的顺序（先分层，再定位）**\n\n```\n第 1 层 客户端：并发数、批大小、重试策略、连接池\n第 2 层 服务配额：每秒请求数、分片数、吞吐上限、实例带宽\n第 3 层 数据分布：分区键热点、S3 前缀热点、小文件数量\n第 4 层 网络：跨 AZ 传输、NAT 带宽、VPC 端点是否走公网\n```\n\n跳过第 2、3 层直接去优化代码，是这类题最常见的错误路径。\n\n**症状 → 根因对照表（高频）**\n\n| 症状 | 最可能根因 | 典型修法 |\n|---|---|---|\n| EBS 卷 IOPS 规格够，但实际吞吐上不去 | 实例的 EBS 带宽上限先撞墙 | 换更大规格实例族或加多卷做 RAID |\n| EFS 白天正常，月末批量任务时极慢 | Bursting 模式的突发额度被耗尽 | 改用 Provisioned 吞吐或提高额度 |\n| S3 上传大量对象时报 503 Slow Down | 所有请求压在同一前缀上 | 打散前缀 / 开启 S3 请求速率自适应 |\n| DynamoDB 写入成功但读取慢 | 分区键分布不均，形成热分区 | 重新设计分区键、加写分片 |\n| Kinesis 出现 ProvisionedThroughputExceeded | 分片数不足以承载写入速率 | 扩分片或改用按需模式 |\n| 训练任务读取 S3 时 GPU 空转 | 输入通道并发不足 / 文件太碎 | 提高输入通道并发、合并小文件 |\n\n**常被问到但容易记错的两个数**：S3 单前缀的请求速率建议值量级是\"每秒数千 GET、数百 PUT\"。官方为自适应设计，具体数值随前缀与对象大小浮动，**以最新官方文档为准**；Kinesis Data Streams 单分片写入上限量级是\"每秒 1MB、每秒 1000 条记录\"（读取为每分片每秒 2MB，共享模式）。\n\n**扩展性的两种思路**\n\n- **纵向**：加大单点规格（更大的实例、更多的分片）。快，但有上限，且成本台阶陡。\n- **横向**：拆并发（更多客户端并行、更多前缀、更多分片）。是数据湖场景的常态解。\n\n**教学案例（虚构示意）**：某团队的日志摄取管道每天凌晨 2 点报限流错误。查下来不是总吞吐不够（日均写量只到配额的 40%），而是所有 ETL 任务都在同一时刻启动、同一前缀写入。改法：任务起始时间错峰 + 前缀带日期与作业 ID + 失败重试加指数退避。错误消失，配额不用加。\n\n**关联 AWS 服务**：Amazon CloudWatch（指标与告警）、AWS Trusted Advisor / Service Quotas（配额视图）、S3 Storage Lens（用量与请求分析）。\n\n#### 流式摄取（Kinesis / Flink / Kafka）\n\n**定义**：数据不是\"一批一批到\"，而是\"持续不断来\"，此时不能等攒够再处理，要在流动中摄取、转换、落湖。\n\n**三个层次，别混**\n\n| 服务 | 角色 | 关键特征 | 什么时候选 |\n|---|---|---|---|\n| Amazon Kinesis Data Streams | 摄取缓冲（消息队列） | 分片模型、可重放（保留期内）、多消费者各自读 | 需要多个下游独立消费、需要重放 |\n| Amazon Data Firehose | 投递管道 | 托管、自动缓冲与格式转换、直接落到 S3/Redshift/OpenSearch | 只要\"进湖/进仓\"，不写消费逻辑 |\n| Managed Service for Apache Flink | 流计算 | 有状态算子、窗口聚合、CEP | 需要在流上做聚合/关联/异常检测 |\n| Amazon MSK | 托管 Kafka | Kafka 协议兼容、分区副本、生态完整 | 已有 Kafka 生态或需要 Kafka 特性 |\n\n**选型判断的三问**\n\n1. **下游有几个消费者？** 多个 → Data Streams 或 MSK（各自维护位点）。只有一个且只是落湖 → Firehose 最省事。\n2. **要不要重放历史？** 要 → Data Streams（保留期可到 365 天）/ MSK。Firehose 不负责重放。\n3. **要不要在流上算东西？** 要 → Flink（或 Lambda 做无状态轻转换）。注意：Firehose 内置的 Lambda 转换是**逐条无状态**的，做不了窗口聚合。\n\n**ML 场景里流式的三个用途**\n\n- **特征实时计算**：点击流 → Flink 窗口聚合 → 写 Feature Store 在线存储 → 推理时低延迟取特征。\n- **训练数据持续入湖**：Firehose 直接投 S3，按时间分区，天然形成增量训练集。\n- **模型监控输入**：推理请求与响应落流，供漂移检测（对应 4.1）。\n\n**易错点**：把 Kinesis 当数据库用（它不是，保留期有限）；以为 Firehose 能保证精确一次（它是至少一次，下游要幂等）；分片数与吞吐不匹配导致限流（见 1.1.3）。\n\n**关联 AWS 服务**：Amazon Kinesis Data Streams（含按需模式）、Amazon Data Firehose、Managed Service for Apache Flink、Amazon MSK、AWS Lambda（轻量转换）。\n\n#### 按访问模式选数据格式\n\n**定义**：格式决定\"读多少字节才能拿到你要的那一列\"。选错格式，存储费和计算费一起涨。\n\n**行式与列式的本质差别**\n\n| | 行式（CSV / JSON / Avro） | 列式（Parquet / ORC） |\n|---|---|---|\n| 存储布局 | 一条记录连续存放 | 一列的所有值连续存放 |\n| 读单列 | 要扫全行 | 只读该列 |\n| 压缩效率 | 一般（同列不同类型混在一起） | 高（同列同类型，压缩算法效果好） |\n| 谓词下推 | 基本没有 | 有（跳过分区/行组） |\n| 适合 | 写入频繁、整行读取、接口交换 | 分析聚合、宽表、训练集 |\n\n**选格式的判断顺序**\n\n1. **谁写、谁读、读几列？** 只读少数几列做聚合 → 列式；整行逐条处理（如流式消费）→ 行式。\n2. **是否要人眼可读？** 排障、交换、小样本核对 → JSON/CSV 有不可替代性。但**不要**把这种格式当训练集长期留存。\n3. **是否要 schema 演化？** Avro 在写侧 schema 演进上更成熟；Parquet 的 schema 合并需要工具支持。\n\n**Parquet 与 ORC 的取舍**：两者都是列式、都支持压缩与谓词下推。Parquet 在 Spark / Pandas / SageMaker 生态里支持最广，跨工具读取兼容性更好；ORC 在 Hive 系与部分引擎里压缩比略优。**考试里遇到\"要与现有 Hive 生态一致\"选 ORC，\"要与 Spark / 通用分析兼容\"选 Parquet**。\n\n**两个实操要点**\n\n- **文件大小**：单文件过小（几 MB 以下）会被元数据与请求开销拖死；过大（数 GB 以上）会限制并行度。经验区间在百 MB 到 1GB 量级，按分区粒度控制。\n- **分区设计**：按查询里最常用的过滤列分区（日期、区域），但分区键基数过大会产生海量小目录——两级分区（日期 + 粗粒度类别）通常比三级更稳。\n\n**教学案例（虚构示意）**：同一份 800GB 的交易明细，CSV 存储月扫描成本与 Parquet + 日期分区相比差异可达数倍——不是存储费差，而是**每次查询扫的字节数**差一个量级。改成列式后，只查三列的日报从 20 分钟降到 2 分钟。\n\n**关联 AWS 服务**：AWS Glue（格式转换与 Crawler）、Amazon Athena（列式 + 分区下推收益最直接）、Amazon EMR（Spark 读写）、Amazon S3（生命周期按格式分级）。\n\n#### 多源数据合并\n\n**定义**：把分散在不同系统、不同粒度、不同时间口径的数据拼成一张可用于训练的宽表。这是 ML 项目里最费工、也最影响效果的一步。\n\n**三种实现方式**\n\n| 方式 | 形态 | 适合 | 代价 |\n|---|---|---|---|\n| 编程合并（pandas / PySpark） | 代码里写 join | 数据量中等、逻辑一次性 | 难复用、难治理、易在内存里炸 |\n| AWS Glue | 托管 Spark + Data Catalog | 定期批量 ETL、需要目录与血缘 | 启动有冷启动延迟、按 DPU 时长计费 |\n| Amazon EMR | 自管集群跑 Spark/Hive | 数据量大、需要常驻集群或特殊调优 | 要管集群，闲置也计费 |\n\n判断顺序：**一次性探索用编程；周期性固化用 Glue；数据量超过单作业可承受范围或需要精细调优用 EMR。**\n\n**合并时真正难的四件事**（考题常从这里出）\n\n1. **键不一致**：客户 ID 在 CRM 是字符串、在工单系统是整数；手机号带不带国家码。合并前必须做键标准化，否则 join 出来的行数会莫名减少。\n2. **时间对齐**：事件时间 vs 处理时间。特征必须用\"预测时点可获得的信息\"，否则会把未来信息泄漏进训练集（这叫数据泄漏，是模型上线后效果骤降的头号原因）。\n3. **重复与缺失**：多源合并后同一条业务事实可能出现多次（如重试写入），要先按业务主键去重；缺失不能一律填 0，要区分\"没发生\"与\"没记录\"。\n4. **Schema 演化**：上游新增字段或改类型时，下游管道要能兼容。用 Data Catalog 管理 schema，比在代码里硬编码列名稳。\n\n**教学案例（虚构示意）**：合并 CRM 商机、工单、埋点三源做成交预测。第一版直接按客户名 join，结果只有 60% 的记录能匹配上——同名不同客户、简称/全称并存。改成先用统一的企业标识映射表做实体解析，匹配率提到 94%。这一步做完，模型 AUC 提升的幅度超过了后面调参的总和。\n\n**关联 AWS 服务**：AWS Glue（Job + Crawler + Data Catalog）、Amazon EMR、AWS Lambda（轻量合并）、Amazon Athena（合并后校验）。\n\n#### 配置可扩展的向量数据库\n\n**定义**：向量库要解决的是\"在几百万到几亿条高维向量里，几十毫秒内找到最相似的 K 条\"。它不是一个数据库产品，而是**一种索引结构 + 一个存储层**的组合。\n\n**三种载体的能力边界**\n\n| 载体 | 检索方式 | 规模量级 | 优势 | 限制 |\n|---|---|---|---|---|\n| Amazon OpenSearch Service | k-NN 索引（HNSW / IVF） | 千万～亿级 | 向量 + 关键词 + 过滤条件混合检索，托管运维 | 内存占用高，成本随规模陡增 |\n| Amazon RDS for PostgreSQL（pgvector） | IVFFlat / HNSW 索引 | 百万级以内 | 与业务表事务一致，SQL 直接 join | 超大规模时索引构建慢、内存压力大 |\n| Amazon S3（+ 自建检索层） | 自行加载索引 | 取决于自建方案 | 存储最便宜，适合冷数据/批处理 | 无原生低延迟检索，需自己实现 |\n\n**索引类型的三角权衡**（这是最常考的点）\n\n- **HNSW**（分层可导航小世界图）：召回率高、查询快，但**内存占用大、构建慢、更新代价高**。\n- **IVF**（倒排文件，先聚类再检索）：内存占用小、构建快，但需要调 `nprobe` 平衡召回与延迟，且对数据分布敏感。\n- **精确检索（暴力）**：召回率 100%，只在很小规模或验证召回率基线时用。\n\n三者的关系可以一句话记住：**HNSW 用内存换延迟与召回，IVF 用召回换内存与成本，精确检索用时间换正确性。**\n\n**选型要看四个参数，不只看向量条数**\n\n1. **QPS**：高并发 → HNSW；低并发批量 → IVF 或精确检索。\n2. **更新频率**：向量频繁增删 → HNSW 的更新代价会成为瓶颈，考虑 IVF 或分层存储。\n3. **过滤条件的复杂度**：需要\"先按租户/时间过滤再算相似度\" → OpenSearch 的混合检索比 pgvector 更顺手。\n4. **维度**：维度越高，索引内存越大。降维（如 1536 → 512）往往比换索引类型更省钱。\n\n**教学案例（虚构示意）**：某知识库 300 万条 chunk、峰值 200 QPS、需要按部门做权限过滤。方案对比：pgvector 单实例在 300 万条 HNSW 下内存吃紧且过滤后召回下降；OpenSearch 支持 filter + k-NN 组合，扩容靠加数据节点。最终选 OpenSearch，成本高但满足权限过滤与并发。反面案例是\"用 S3 存向量 + Lambda 现算\"，P99 延迟到了秒级，不可用。\n\n**关联 AWS 服务**：Amazon OpenSearch Service（k-NN）、Amazon RDS for PostgreSQL（pgvector 扩展）、Amazon S3（原始向量与冷备）、Amazon SageMaker（生成 embedding 的作业侧）。\n\n#### 多模态数据的摄取与存储\n\n**定义**：文本之外的图像、音频、视频、文档也要能被训练和检索使用。它们的共同特点是**文件大、元数据比内容更重要、处理要分两步**。\n\n**统一的三层存储结构**\n\n```\n原始层：S3 存原始文件（按 类型/日期/来源 分区），不可变，可回溯\n派生层：抽取出来的特征与文本（OCR 结果、ASR 转写、图像 embedding）存列式或向量库\n元图层：Glue Data Catalog / 对象标签，记录来源、采集时间、标注状态、许可信息\n```\n\n**各模态的实操要点**\n\n| 模态 | 摄取注意 | 存储注意 |\n|---|---|---|\n| 文本 | 编码统一（UTF-8）、去重、长度截断策略 | 原文 + 分块结果分开存，便于重建索引 |\n| 图像 | 分辨率与色彩空间统一、EXIF 方向校正 | 原图与模型输入尺寸的副本分开存，避免反复解码缩放 |\n| 音频 | 采样率与位深统一、静音段切分、声道处理 | 长音频按段切分并保留时间戳映射 |\n| 文档（PDF/扫描件） | 版面解析（文本层 vs 扫描层）、表格抽取 | 原文 + 文本层 + 版面坐标三元组一起留 |\n\n**最容易忽略的三件事**\n\n1. **去重**：多模态数据的重复率远高于文本（同一张图多次上传、同一段音频不同压缩率）。不去重会让训练集分布失真，也会让检索结果重复。\n2. **标注状态**：把\"已标注/未标注/标注中\"作为一等字段管理，否则训练时会把未标注样本当负样本。\n3. **许可与来源**：训练数据的版权与授权链条要可追溯，合规审查时这是硬要求。\n\n**教学案例（虚构示意）**：工业质检场景，20 万张缺陷图 + 检出记录。第一版直接把图片按上传日期堆在 S3，训练时扫描慢、去重靠人工。改成按\"产线/班次/缺陷类型\"三段分区 + 元数据表记录标注状态，训练集构建从两天缩到两小时。\n\n**关联 AWS 服务**：Amazon S3（原始与派生分层）、AWS Glue Data Catalog（元数据）、Amazon Rekognition / Amazon Transcribe / Amazon Textract（特征抽取，属 D2 服务选型范围）、Amazon OpenSearch（多模态检索）。\n\n#### 数据入 SageMaker Feature Store\n\n**定义**：Feature Store 是特征的**唯一可信来源**。它一份数据两种形态：在线存储（低延迟读，供推理）与离线存储（批量读，供训练），两者由同一套写入保证一致。\n\n**核心机制（必须理解这一层）**\n\n```\n写入 → Feature Group\n        ├─ 在线存储：毫秒级读，按 record identifier 取最新值\n        └─ 离线存储：S3 上的追加式表，含 event time，供训练/回溯\n```\n\n三个关键概念：\n\n| 概念 | 含义 | 为什么重要 |\n|---|---|---|\n| Record identifier | 特征所属实体的唯一键（如客户 ID） | 决定在线查询能否命中 |\n| Event time | 特征值对应的业务发生时间 | 训练时必须按 event time 取\"当时可见\"的值，否则数据泄漏 |\n| Feature Group | 一组 schema 相同、写入节奏相同的特征集合 | 是管理、权限、血缘的单位 |\n\n**它解决的真问题：训练-服务偏差**\n\n没有 Feature Store 时，训练用批处理 SQL 算特征、线上用另一套代码算特征，两边口径迟早不一致，模型效果会在某次改动后无声下滑。Feature Store 让两条路径**共用同一份特征定义与同一份数据**，偏差从\"设计问题\"变成\"不可能发生\"。\n\n**什么时候不该用它**\n\n- 特征极少（十几个）、只有离线训练没有在线推理 → 直接跑批更简单。\n- 一次性实验、不打算上线 → 引入 Feature Store 只是增加流程负担。\n- 需要复杂跨实体 join 的宽表 → 先用 Glue/Spark 加工成宽表，再把最终特征入 Store。\n\n**成本与容量提醒**：在线存储按实例/容量计费且常驻，特征多、实体多时这部分是主要成本；离线存储走 S3，便宜但要注意版本膨胀（保留 TTL 与快照策略）。\n\n**教学案例（虚构示意）**：某推荐场景，训练侧用 Hive 算用户近 7 天点击率、线上用 Java 服务另算一份。上线三个月后线上 CTR 比离线评估低 18%。接 Feature Store 后统一口径，差距收敛到 3% 以内。\n\n**关联 AWS 服务**：Amazon SageMaker Feature Store（在线 + 离线双存储）、AWS Glue（特征加工上游）、Amazon SageMaker Pipelines（把特征写入编进流程）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 认为存储选型就是比容量单价 | 请求费、跨 AZ/跨区传输费、取回费经常超过容量费本身 |\n| 2 | 认为 EBS 可以多机共享 | EBS 是块设备单挂载；多机共享要 EFS 或 FSx 类文件系统 |\n| 3 | 把 Glue 当万能 ETL，忽略冷启动 | 短小任务用 Glue 会被启动延迟拖累，Lambda 或 Athena 更合适 |\n| 4 | 以为 Firehose 能重放历史数据 | 重放要靠 Kinesis Data Streams 或 MSK 自己维护位点 |\n| 5 | 把 CSV 当长期训练集格式 | 列式格式在扫描字节数上通常优一个量级，成本差在计算侧 |\n| 6 | 认为向量库选型只看向量条数 | QPS、更新频率、过滤复杂度、维度四个参数一起决定 |\n| 7 | 训练集按\"当前最新特征值\"取 | 必须按 event time 取预测时点可见的值，否则数据泄漏 |\n| 8 | 把未标注样本当负样本 | 标注状态要作为一等字段管理，未标注 ≠ 负例 |\n\n#### 记忆要点\n\n1. **六类源的本质差别在存储模型**：对象（S3）、块（EBS）、文件（EFS）、关系（RDS）、键值（DynamoDB）、搜索（OpenSearch）。\n2. **四维选存储**：成本、性能、数据结构、合规，任一维不可行即出局。\n3. **排障先分层**：客户端 → 服务配额 → 数据分布 → 网络。跳过配额和分布直接改代码是最常见的错。\n4. **流式四件套分工**：Data Streams 缓冲可重放、Firehose 投递不写逻辑、Flink 流上计算、MSK 要 Kafka 生态。\n5. **格式口诀**：列式省扫描、行式便交换、小文件致命、分区别过细。\n6. **向量库三角**：HNSW 用内存换效果、IVF 用效果换成本、精确检索用时间换正确。\n7. **Feature Store 一句话**：一份特征两种形态，消灭训练与线上的口径差；关键是 event time，不是 record id。\n8. **多模态三层存**：原始层不可变、派生层可重建、元图层管状态与来源。\n\n---"},{"h":"数据转换、特征工程与预处理（Perform data transformation, feature engineering, and pre-processing.）","body":"#### 这一节学什么\n这一节对应考纲任务 1.2「数据转换、特征工程与预处理（Perform data transformation, feature engineering, and pre-processing.）」。\n\n> 官方原名：Perform data transformation, feature engineering, and pre-processing.\n> 技能点 9 条｜C02 新增 5 条｜可复用 2 条\n\n| 编号 | 官方技能点（英文原文） | 中文速记 |\n|---|---|---|\n| 1.2.1 | Transform data by using AWS tools (for example, AWS Glue, AWS Glue DataBrew, Spark on Amazon EMR, SageMaker Data Wrangler). | 四工具分工做转换 |\n| 1.2.2 | Create and manage features by using AWS tools (for example, SageMaker Feature Store). | 特征的创建与管理 |\n| 1.2.3 | Transform streaming data (for example, by using AWS Lambda, Spark). | 流式数据转换 |\n| 1.2.4 | Perform feature engineering (for example, scaling, standardization, feature splitting, binning, log transformation, normalization). | 特征工程六种手法 |\n| 1.2.5 | Configure and use embedding models to transform text and image data into numerical representations. | 用 embedding 模型转数值表示 |\n| 1.2.6 | Apply advanced text pre-processing techniques (for example, tokenization, domain-specific augmentation). | 高级文本预处理 |\n| 1.2.7 | Prepare documents for Retrieval Augmented Generation (RAG) applications (for example, chunking strategies, metadata extraction). | RAG 文档准备 |\n| 1.2.8 | Mask, redact, and anonymize data. | 数据遮蔽、脱敏与匿名化 |\n| 1.2.9 | Prepare data for FM fine-tuning, continuous pre-training, and model distillation. | 微调/续训/蒸馏的数据准备 |\n\n#### 四种转换工具的分工\n\n**定义**：转换就是把原始表变成模型可用的表——改类型、补缺失、聚合、派生、拼接。AWS 上能做这件事的工具很多，考题考的是\"这道工序该用哪个工具\"，而不是\"能不能做\"。\n\n**四种工具的定位差异**\n\n| 工具 | 交互形态 | 谁用 | 强项 | 弱项 |\n|---|---|---|---|---|\n| AWS Glue（ETL Job） | 代码（Spark / PySpark / Python Shell） | 数据工程师 | 可编排、可调度、与 Data Catalog 一体、能处理 TB 级 | 冷启动延迟，交互式探索不顺手 |\n| AWS Glue DataBrew | 可视化，250+ 预置转换 | 分析师、数据准备人员 | 不写代码、所见即所得、直出数据质量规则 | 复杂逻辑表达受限，超大作业成本偏高 |\n| Spark on Amazon EMR | 代码 + 自管集群 | 数据平台团队 | 完全可控、可调优、大集群吞吐高 | 要运维集群，闲置成本 |\n| SageMaker Data Wrangler | 可视化 + 导出到 Pipeline | ML 工程师 | 与 SageMaker 训练/流水线打通、内置 ML 专用转换（如目标编码） | 大规模时仍需导出到 Spark 处理 |\n\n**判断顺序（考试常用路径）**\n\n1. **是周期性生产作业，还是探索性加工？** 周期性 → Glue 或 EMR；探索 → DataBrew / Data Wrangler。\n2. **写不写代码？** 业务侧人员主导 → DataBrew；工程师主导 → Glue / Spark。\n3. **下游是不是 SageMaker 训练？** 是 → Data Wrangler 能直连特征与流水线；否 → Glue 更通用。\n4. **数据量是否超出单作业可承受范围？** 超出 → EMR 自调优；否则 Glue 托管更省心。\n\n**四者不是互斥的**。真实项目里常见的组合是：DataBrew 做业务侧的数据质量检查 → Glue 做定时 ETL → Data Wrangler 在建模阶段做特征实验 → 定型后固化成 Glue Job 或 SageMaker Processing。\n\n**教学案例（虚构示意）**：客户要把 40 个 Excel 月报（字段名不统一、有合并单元格）转成一张宽表。用 Glue 写代码约 3 天；用 DataBrew 的可视化 recipe 约 4 小时，且业务方能自己维护。判断依据不是技术先进，而是**谁维护、改多少次**。\n\n**关联 AWS 服务**：AWS Glue（Job / Crawler / Data Catalog / Data Quality）、AWS Glue DataBrew、Amazon EMR、Amazon SageMaker Data Wrangler。\n\n#### 特征创建与管理\n\n**定义**：特征一旦被多个模型、多个团队复用，就必须有\"定义、版本、血缘、一致性\"的管理，否则同一个指标会出现五个口径。这件事由 Feature Store 承担（机制见 数据入 SageMaker Feature Store（1.1.9），此处讲**怎么建、怎么管**）。\n\n**建特征的四个动作**\n\n| 动作 | 具体做什么 | 判断依据 |\n|---|---|---|\n| 划 Feature Group | 按实体 + 更新频率分组 | 同一实体、同一刷新节奏放一组，避免混写 |\n| 定 schema | 字段名、类型、默认值、是否可空 | 类型一旦上线就难改，宁可用更宽的类型 |\n| 定 event time | 用业务发生时间，不用写入时间 | 决定训练时能否正确回溯 |\n| 定 TTL 与版本 | 在线存储保留窗口、离线快照策略 | 成本与可复现性的平衡 |\n\n**特征管理的三条纪律**\n\n1. **一个特征一个定义**：名字、口径、计算逻辑写在一处（Feature Group 的 description 或数据字典），不允许各团队各写一份 SQL。\n2. **时间旅行要能跑通**：训练集必须能按\"当时的特征值\"重建。做法是离线存储保留 event time 维度，训练时按时间点取最新值（point-in-time join）。\n3. **上线前比对一次**：同一批实体，离线算一遍、在线查一遍，逐条比对差异，差异为 0 才能上线。这一步能拦住 90% 的训练-服务偏差。\n\n**什么时候用 Feature Store、什么时候用宽表**\n\n| 场景 | 建议 |\n|---|---|\n| 有在线推理、需要毫秒级取特征 | Feature Store |\n| 特征被 2 个以上模型复用 | Feature Store |\n| 只有离线训练、一次性分析 | Glue/Spark 宽表 |\n| 特征极多且跨实体需要大量 join | 先加工成宽表，再把最终特征入 Store |\n\n**教学案例（虚构示意）**：风控场景有 30 个特征，其中\"近 7 天交易次数\"被 3 个模型复用。第一版各自写 SQL，三个月后三份口径出现差异（一份含退款、一份不含）。迁到 Feature Store 后口径统一，且线上查询延迟从 80ms 降到 12ms。\n\n**关联 AWS 服务**：Amazon SageMaker Feature Store、AWS Glue（上游加工）、Amazon SageMaker Pipelines（把写入编排进流程）。\n\n#### 流式数据转换\n\n**定义**：数据在流动过程中被改写、聚合、富化，落点仍然是湖或 Feature Store。与批处理的本质差别是**不能看全量**——只能看窗口。\n\n**三种实现方式**\n\n| 方式 | 能力边界 | 适合 |\n|---|---|---|\n| AWS Lambda | 逐条、无状态、毫秒级启动 | 字段清洗、格式转换、简单富化（查一个字典） |\n| Spark Structured Streaming（EMR / Glue） | 有状态、支持窗口聚合与 join | 微批聚合、流表 join、复杂逻辑 |\n| Managed Service for Apache Flink | 有状态、事件时间语义、精确一次 | 严格的事件时间窗口、CEP、低延迟聚合 |\n\n**三个必须理解的概念**\n\n1. **事件时间 vs 处理时间**：窗口按事件发生时间算才是业务语义；按处理时间算会因乱序和延迟产生偏差。用事件时间就必须处理**迟到数据**（watermark 机制）。\n2. **有状态与无状态**：`SUM over 5 min window` 是有状态的，Lambda 做不到（除非借助外部存储）。这是 Lambda 与 Flink/Spark 的分界线。\n3. **语义保证**：至少一次（下游需幂等）与精确一次（实现复杂、代价高）。特征写入要按主键幂等覆盖，不能靠追加。\n\n**典型拓扑**\n\n```\n点击流 → Kinesis Data Streams → Flink（5 分钟窗口聚合）\n        → 写 Feature Store 在线存储（供实时推理）\n        → 同时写 S3（离线，供训练回溯）\n```\n\n**易错点**：用 Lambda 做窗口聚合（做不到）；用处理时间做业务窗口（结果随流量起伏而漂移）；流式写入不幂等导致特征重复累加。\n\n**关联 AWS 服务**：AWS Lambda、Managed Service for Apache Flink、Amazon EMR（Spark Structured Streaming）、Amazon Kinesis Data Streams、Amazon SageMaker Feature Store。\n\n#### 特征工程的六种手法\n\n**定义**：把原始数值/类别改成模型更容易学到的分布形态。这六种手法是**通用基本功**，与具体算法无关，但在树模型与线性模型上的作用完全不同。\n\n| 手法 | 做什么 | 什么时候用 | 什么时候不要用 |\n|---|---|---|---|\n| **标准化**（standardization） | 减均值、除标准差，得到均值 0、方差 1 | 线性模型、SVM、神经网络、需要正则化时 | 树模型（对其不敏感，做了也无害但无收益） |\n| **归一化**（normalization / min-max） | 线性缩放到 [0,1] 或 [-1,1] | 需要固定取值范围（图像像素、神经网络输入） | 有离群值（会被极端值压扁） |\n| **缩放**（scaling，泛指） | 乘系数改变量纲 | 让不同量纲的特征可比 | 无明确量纲需求的场景 |\n| **对数变换**（log transformation） | 对偏态分布取对数，压缩长尾 | 金额、计数、时长这类右偏数据 | 含 0 或负值（需先加常数或用 Box-Cox） |\n| **分箱**（binning） | 连续值切成区间 | 关系非线性、需要抗噪、需要可解释分段 | 信息损失敏感、区间边界无业务含义时 |\n| **特征拆分**（feature splitting） | 一个字段拆成多个（日期 → 年/月/日/星期；地址 → 省/市） | 原始字段内含多层信息 | 拆完维度爆炸且无业务意义 |\n\n**三条关键提醒**\n\n1. **统计量必须只用训练集算**。用全量数据算均值和方差再划分训练/测试，等于把测试集信息泄漏进训练——这是最隐蔽也最常见的数据泄漏。\n2. **训练与推理必须同一套变换**。标准化参数要保存并在推理侧复用，不能各算一遍（这也是 Feature Store 存在的理由之一）。\n3. **树模型对单调变换不敏感**。随机森林、XGBoost 这类基于分裂点的模型，标准化和归一化几乎不改变结果；但对数变换可能因为改变分裂点位置而有效。**这条经常作为\"哪个手法对树模型无效\"的选项出现**。\n\n**教学案例（虚构示意）**：欺诈检测里\"交易金额\"右偏严重，99 分位是均值的 40 倍。直接标准化后大多数样本挤在 0 附近，模型学不到差异；改为 log(1+x) 再标准化，召回率从 0.61 提到 0.74。\n\n**关联 AWS 服务**：Amazon SageMaker Data Wrangler（内置这些变换并可导出代码）、SageMaker Processing（批量跑变换）、AWS Glue（在 ETL 里做变换）。\n\n#### 用 embedding 模型把文本与图像转成数值\n\n**定义**：embedding 是把\"语义\"映射到高维向量空间，让相似的东西距离近。它是 RAG、语义检索、聚类、分类的共同地基，也是 C02 相对 C01 最重要的新增内容之一。\n\n**机制上的四个要点**\n\n1. **维度**：常见 256 / 512 / 1024 / 1536 / 3072 维。维度越高表达力越强，但存储与检索成本按维度线性增长。很多模型支持**输出维度可配**（如 Amazon Titan Text Embeddings V2 可选 1024/512/256），降维是省成本的第一手段。\n2. **归一化与相似度**：向量归一化后用**余弦相似度**；不归一化时点积与欧氏距离不等价。检索库里的距离度量必须与生成 embedding 时的假设一致，**混用是最隐蔽的召回率杀手**。\n3. **对称与非对称**：问题与答案的语义形态不同（短问句 vs 长段落），部分模型提供\"查询侧/文档侧\"不同的编码方式。RAG 场景要按模型文档区分，否则召回率明显下降。\n4. **多模态**：图像 embedding 模型把图片映射到与文本同一空间，才能做\"以文搜图\"。跨模态检索的前提是**同一模型族**，混用不同厂商的图像与文本模型通常无法直接比较。\n\n**选型看四个维度**\n\n| 维度 | 问什么 |\n|---|---|\n| 语言覆盖 | 中文效果是否达标（很多模型英文强、中文弱） |\n| 维度与成本 | 存储与检索成本 ∝ 维度 × 条数 |\n| 最大输入长度 | 决定分块大小上限（超过会被截断） |\n| 是否可私有部署 / 数据出境 | 合规要求高的场景必须考虑 |\n\n**实践中的三条经验**\n\n- **先做小样本评估再全量**：拿 200 条真实查询，比较 2–3 个模型的召回命中率，比看榜单可靠。\n- **换模型必须重建全量索引**：不同模型的向量空间不可比，不能只对新数据用新模型。\n- **embedding 版本要记录**：与模型版本、分块策略一起记录，否则检索效果下降时无法定位是哪一环变了。\n\n**教学案例（虚构示意）**：某客服知识库用英文优化模型做中文检索，Top-5 命中率只有 52%。换成中文效果更好的模型 + 512 维，命中率升到 78%，同时存储成本降了一半（维度从 1536 降下来）。\n\n**关联 AWS 服务**：Amazon Bedrock（Titan Text Embeddings、Cohere Embed 等基础模型）、Amazon SageMaker（自建/部署 embedding 模型）、Amazon OpenSearch Service 与 Amazon RDS pgvector（向量存储侧）。\n\n#### 高级文本预处理（分词与领域增强）\n\n**定义**：在文本进入模型之前做结构化处理——切成 token、清理噪声、扩充领域样本。它决定了模型\"看到什么\"，直接影响效果上限。\n\n**分词（tokenization）要理解的三层**\n\n| 层次 | 是什么 | 与考试的关系 |\n|---|---|---|\n| 子词切分（BPE / WordPiece / SentencePiece） | 把词切成词表里的子词单元 | 决定 token 数量 → 决定成本与可容纳长度 |\n| 领域词表 | 专业术语被切碎会增加 token 数与语义损失 | 医疗、法律、代码场景尤其明显 |\n| 特殊 token 与模板 | 模型需要的边界符、角色标记 | 不按模板拼接会导致指令微调失效 |\n\n**关键结论：token 数不等于字数**。中文场景下 token 与字的比例、英文下与词的比例，都随模型词表变化。**成本估算必须按 token 算，不能按字数估**——这是 C02 新增的实务考点。\n\n**文本清理的必做项**（顺序有讲究）\n\n1. 编码统一（UTF-8）与不可见字符清理（零宽空格、软连字符）。\n2. HTML/XML 标签剥离（保留段落边界，不要一键去标签把结构也删掉）。\n3. 重复行与页眉页脚去除（PDF 抽取后几乎必然出现）。\n4. 全半角统一、繁简统一（中文场景）。\n5. 长度截断或分块（超过模型上限会被静默截断）。\n\n**领域增强（domain-specific augmentation）的三种做法**\n\n| 做法 | 说明 | 风险 |\n|---|---|---|\n| 同义替换 / 回译 | 用同义表达生成等价样本 | 改变语义（如金额、否定词被改动） |\n| 模板化改写 | 用业务模板生成问答对 | 句式单一，模型学到模板而非语义 |\n| 术语归一 | 把同义术语映射到标准词（\"云主机\"→\"实例\"） | 过度归一会丢失细粒度差异 |\n\n**增强的红线**：**不许改变标签**。分类任务里增强后标签不变才成立；生成任务里改写可能改变正确输出。凡是增强，必须抽样人工核对。\n\n**教学案例（虚构示意）**：一份 300 页的技术手册，PDF 抽取后带大量页眉、断行、公式乱码。先做清理（去页眉页脚、合并断行、公式转占位符），再按标题层级分块，最终 token 数比直接分块少 22%，检索命中率反而提高——噪声少了。\n\n**关联 AWS 服务**：Amazon Comprehend（实体、关键词、语言检测辅助清理）、Amazon Textract（带版面信息的文档抽取）、Amazon SageMaker Processing（批量预处理作业）、AWS Glue（大规模文本清洗）。\n\n#### RAG 文档准备（分块与元数据）\n\n**定义**：把文档切成\"既可检索、又能独立回答\"的片段，并附上足够定位的元数据。这一步决定 RAG 的召回质量，**比换模型更能提升效果**。\n\n**四种分块策略的取舍**\n\n| 策略 | 做法 | 优点 | 缺点 |\n|---|---|---|---|\n| 固定长度 | 按 token 数硬切（如 512，带重叠） | 实现简单、长度均匀 | 会在语义中间切断 |\n| 按分隔符递归 | 先按段落、再按句子层级递归切 | 保留自然边界，通用性最好 | 段落极长时仍需硬切 |\n| 语义分块 | 按相邻句的语义相似度变化切 | 块内主题一致 | 计算成本高、阈值难调 |\n| 按文档结构 | 依标题层级、表格、代码块切 | 结构完整、可挂层级元数据 | 依赖文档本身结构良好 |\n\n**经验值**：块大小在数百 token 量级（如 256–512），重叠取块长的 10%–20%。块太小丢上下文，块太大稀释相关性且超出 embedding 模型输入上限。\n\n**进阶：小块检索、大块生成（small-to-big）**\n\n用小块做向量检索（精度高），命中后回溯到它所属的大块或整节送给模型（上下文完整）。这是当前工程实践里性价比最高的一招，比单纯调块大小收益更大。\n\n**元数据必须挂的六项**\n\n| 元数据 | 用途 |\n|---|---|\n| 文档 ID 与版本 | 更新时能定位替换，不产生孤儿块 |\n| 标题路径（一级/二级标题） | 检索结果可解释，也能辅助生成 |\n| 页码 / 段落位置 | 溯源与引用 |\n| 更新时间 | 时间敏感问题的过滤与提示 |\n| 权限标签 | 检索前过滤，防止越权（合规硬要求） |\n| 语言 / 文档类型 | 多语言与多类型混合库的路由 |\n\n**三个常见错误**\n\n1. **切完不存原文位置**：命中后无法引用出处，用户不信，也无法核查。\n2. **表格被按行切断**：表头与数据分离后语义全失。表格应整块保留或转成\"表头 + 行\"的文本化形式。\n3. **更新不重建**：文档改了但索引没更新，检索到旧内容。必须有\"文档版本 → 块版本\"的联动机制。\n\n**教学案例（虚构示意）**：某制度问答系统首版按 512 token 硬切，答案常缺前提条件。改为按章节结构切 + 小块检索大块生成后，答案完整率从 64% 升到 89%，且引用页码可追溯。\n\n**关联 AWS 服务**：Amazon Bedrock Knowledge Bases（托管的分块与向量化流程）、Amazon Textract（带结构的文档抽取）、Amazon OpenSearch Service / Amazon RDS pgvector（索引与检索）、AWS Lambda（自定义分块逻辑）。\n\n#### 数据遮蔽、脱敏与匿名化\n\n**定义**：在不破坏训练价值的前提下，让数据里不出现可识别到个人的信息。三个词的程度不同，考题常考区分。\n\n| 术语 | 做法 | 可逆性 | 训练可用性 |\n|---|---|---|---|\n| **遮蔽（masking）** | 用占位符替换（`***`、`[NAME]`） | 不可逆（原值丢弃） | 高，但会丢信息 |\n| **脱敏（redaction）** | 直接删除敏感片段 | 不可逆 | 中，可能破坏语义连贯 |\n| **匿名化（anonymization）** | 泛化、假名化、加噪、k-匿名 | 泛化不可逆；假名化可逆（有映射表） | 高，需防止重识别 |\n\n**五种手法与适用**\n\n| 手法 | 例子 | 注意 |\n|---|---|---|\n| 掩码 | `138****5678` | 保留格式，适合展示但不适合训练 |\n| 替换为类型占位 | `<PHONE>` | 保留句法结构，NLP 训练常用 |\n| 哈希 / 加盐哈希 | `sha256(id+salt)` | 可做关联分析，不可逆推 |\n| 假名化 | 真实姓名 → 生成的假名，映射表单独保管 | 保留指代关系，最接近真实分布 |\n| 泛化 | 年龄 32 → 30–40 区间 | 降低精度换隐私，注意别泛化到无信息 |\n\n**判断顺序**\n\n1. **数据要不要出公司边界？** 要 → 必须先脱敏，且按不可逆处理。\n2. **训练任务是否需要保留指代关系？** 需要（如对话、实体链接）→ 假名化；不需要 → 类型占位。\n3. **是否涉及特殊类别数据？** 生物特征、健康、金融账户这类要求更严，优先删除或泛化。\n\n**两个易错点**\n\n- **以为删掉姓名就匿名了**：组合字段（年龄 + 邮编 + 职业）足以重识别，这叫准标识符问题。\n- **在生成式场景忘了提示词里的 PII**：用户把身份证号写进 prompt，日志与训练数据都会带上。脱敏必须覆盖**输入侧**，不只是数据库侧。\n\n**教学案例（虚构示意）**：客服对话要用于微调，原始数据含姓名、手机、订单号。方案：姓名假名化（保指代）、手机与订单号替换为类型占位、地址泛化到城市级。脱敏后人工抽检 200 条，重识别风险为 0，微调效果与原始数据差异在 2% 以内。\n\n**关联 AWS 服务**：Amazon Comprehend（PII 识别）、Amazon Macie（S3 中的敏感数据发现）、AWS Glue（作业内做转换）、Amazon Bedrock Guardrails（推理侧拦截敏感信息）。\n\n#### 微调、续训与蒸馏的数据准备\n\n**定义**：三种\"让基础模型更像你的业务\"的路径，对数据的要求完全不同。**数据形态错了，训练一定失败**，而且失败得很隐蔽。\n\n| 路径 | 做什么 | 数据要求 | 量级 |\n|---|---|---|---|\n| **指令微调（fine-tuning）** | 用\"输入-期望输出\"对调整模型行为 | 高质量配对样本，格式严格按模型要求 | 数百到数万条 |\n| **持续预训练（continuous pre-training）** | 用领域语料继续无监督训练 | 大规模纯文本，去重与质量控制是重点 | 千万 token 起 |\n| **蒸馏（distillation）** | 用大模型输出训练小模型 | 输入 + 教师模型的输出（含理由更好） | 数千到数十万条 |\n\n**微调数据的四个格式要点**\n\n1. **严格按模板拼**：不同模型的对话模板（system / user / assistant 标记）不同，拼错等于教模型错误的格式。用模型厂商提供的模板函数，不要手写。\n2. **配对要一一对应**：输出必须是该输入的唯一合理答案，多解会让模型学到模棱两可。\n3. **质量远重于数量**：几百条干净、一致、覆盖典型场景的样本，通常优于几万条噪声数据。**先人工审核 100 条，再决定要不要扩量**。\n4. **留出验证集**：同一业务分布留 10%–20% 不进训练，用于判断是否过拟合（训练损失降、验证损失升就是过拟合信号）。\n\n**续训的三个注意**\n\n- 语料要去重与去噪（重复内容会让模型记住而非学会）。\n- 混入一定比例的通用语料，防止\"灾难性遗忘\"——只学领域文本会把通用能力练没。\n- 训练规模要与语料规模匹配，过度训练同样退化。\n\n**蒸馏的两个注意**\n\n- 教师的输出要包含**理由**（思维链）而不只是答案，学生会学到推理路径而非表面映射。\n- 教师难免有错，要抽检并过滤明显错误的样本，否则把教师的错误也学下来。\n\n**教学案例（虚构示意）**：某团队用 3 万条自动生成的问答做微调，效果反而不如基线。诊断：生成数据里有 30% 答案与问题不匹配、模板句式高度重复。收敛到 800 条人工审核过的样本后，任务准确率提升明显。\n\n**关联 AWS 服务**：Amazon Bedrock（模型微调与自定义模型）、Amazon SageMaker（自建训练与蒸馏作业）、Amazon Bedrock Model Evaluation（微调前后对比）、Amazon S3（训练数据组织与版本化）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 用 DataBrew 跑 TB 级周期性作业 | 可视化工具适合探索与中小规模；大规模周期作业用 Glue/Spark |\n| 2 | 以为 Feature Store 只是\"特征表\" | 它是在线+离线双存储，核心价值是消灭训练与推理的口径差 |\n| 3 | 用 Lambda 做流式窗口聚合 | Lambda 无状态，窗口聚合要用 Flink 或 Spark Structured Streaming |\n| 4 | 用全量数据算标准化参数 | 统计量只能来自训练集，否则数据泄漏 |\n| 5 | 认为标准化对树模型有显著收益 | 树模型对单调变换不敏感，这类选项通常是干扰项 |\n| 6 | 换 embedding 模型只对新数据重建索引 | 向量空间不可比，必须全量重建 |\n| 7 | RAG 分块只看长度不看结构 | 表格、代码、标题层级被切断后语义全失，结构优先于长度 |\n| 8 | 认为删掉姓名就等于匿名化 | 准标识符组合可重识别，需泛化或假名化 |\n| 9 | 微调数据越多越好 | 质量与一致性优先，噪声数据会让效果低于基线 |\n| 10 | 指令微调不按模型模板拼接 | 模板错等于教模型错误格式，必须用厂商模板函数 |\n\n#### 记忆要点\n\n1. **四工具分工口诀**：周期生产 Glue、业务探索 DataBrew、ML 实验 Data Wrangler、超大规模 EMR。\n2. **特征管理三件事**：一个特征一个定义、按 event time 时间旅行、上线前离线-在线逐条比对。\n3. **流式三分界**：逐条无状态 Lambda、有状态窗口 Flink/Spark、语义保证看幂等。\n4. **六手法一句话**：标准正态、归一限幅、缩放改量纲、对数压长尾、分箱换非线性、拆分提信息。\n5. **embedding 三铁律**：距离度量要一致、换模型必须全量重建、维度可降是省钱第一招。\n6. **RAG 分块优先级**：结构 > 语义 > 递归分隔符 > 固定长度；小块检索、大块生成。\n7. **脱敏三档**：遮蔽留格式、脱敏删内容、匿名化保关系；防重识别要盯准标识符。\n8. **三条训练路径**：微调改行为（配对数据）、续训补知识（大语料）、蒸馏搬家（教师输出带理由）。\n\n---"},{"h":"数据质量校验与偏差管理（Validate data quality and manage bias.）","body":"#### 这一节学什么\n这一节对应考纲任务 1.3「数据质量校验与偏差管理（Validate data quality and manage bias.）」。\n\n> 官方原名：Validate data quality and manage bias.\n> 技能点 7 条｜C02 新增 3 条｜可复用 1 条\n\n| 编号 | 官方技能点（英文原文） | 中文速记 |\n|---|---|---|\n| 1.3.1 | Validate data quality (for example, by using DataBrew, AWS Glue Data Quality). | 数据质量校验 |\n| 1.3.2 | Label and annotate data. | 数据标注 |\n| 1.3.3 | Identify and mitigate sources of bias in data by using AWS tools and techniques (for example, dataset splitting, shuffling, augmentation). | 偏差来源识别与缓解 |\n| 1.3.4 | Optimize multimodal data distributions by applying bias metrics across numeric, text, and image assets. | 多模态数据分布与偏差度量 |\n| 1.3.5 | Resolve class imbalance in numeric, text, and image datasets. | 类别不平衡处理 |\n| 1.3.6 | Validate AI training data integrity (for example, prompt-response pair validation, content safety screening). | AI 训练数据完整性校验 |\n| 1.3.7 | Clean data (for example, by detecting outliers, imputing missing data, deduplication). | 数据清洗 |\n\n#### 数据质量校验\n\n**定义**：用可执行的规则，自动判断一批数据\"能不能用来训练\"。质量不是主观评价，而是**六个维度上的可度量指标**。\n\n**六个维度与检查方式**\n\n| 维度 | 问什么 | 典型规则 |\n|---|---|---|\n| 完整性 | 关键字段有没有缺 | 非空率 ≥ 99%、必填列不缺失 |\n| 准确性 | 值是否在合理范围 | 金额 ≥ 0、年龄 0–120、枚举值在允许集合内 |\n| 一致性 | 跨表/跨字段是否自洽 | 订单总额 = 明细之和、日期先后顺序 |\n| 唯一性 | 有没有重复 | 主键唯一、业务键去重后行数偏差 ≤ 1% |\n| 及时性 | 数据到得够不够快 | 分区 T-1 在每日 6 点前到达 |\n| 有效性 | 格式/类型是否符合约定 | 手机号正则、日期格式、schema 类型匹配 |\n\n**两种工具的分工**\n\n| 工具 | 形态 | 适合 |\n|---|---|---|\n| AWS Glue Data Quality | 用 DQDL（声明式规则语言）写在 Glue 作业里 | 生产管道的常态化校验，结果可挂到 CloudWatch 告警 |\n| AWS Glue DataBrew | 可视化规则集 + 数据画像（profile） | 探索阶段快速摸清数据形状、生成候选规则 |\n\n**关键做法：质量门禁要\"卡住流程\"，不能只出报告**\n\n```\nGlue 作业跑规则 → 规则失败 → 阻断下游写入（不发布脏数据）→ 告警\n```\n\n只做报表的校验等于没做——没人看。**这是审计与生产实践里共同的判断标准**：规则必须能阻断，且阻断记录可查。\n\n**教学案例（虚构示意）**：某数仓日更任务连续一周产出空表，但监控只盯作业状态（成功），没盯输出行数。加了一条 DQDL 规则\"行数与上周同日偏差 ≤ 30%\"，当天就报出上游字段变更导致的解析失败。\n\n**关联 AWS 服务**：AWS Glue Data Quality（DQDL）、AWS Glue DataBrew（规则集与 profile）、Amazon CloudWatch（告警）。\n\n#### 数据标注\n\n**定义**：给样本打上正确答案。标注质量决定监督学习的上限——**标注错了，模型一定学错，且没法靠调参补救**。\n\n**四种标注方式**\n\n| 方式 | 做法 | 适合 | 成本 |\n|---|---|---|---|\n| 自建人工标注 | 内部团队按标注手册打标 | 领域门槛高、数据不能出内网 | 人力成本高、速度慢 |\n| 托管标注服务（Amazon SageMaker Ground Truth） | 内置标注界面 + 众包/自有标注员管理 | 通用任务、需要规模化 | 按标注量计费，可控 |\n| 自动标注（auto-labeling） | 用已有模型预标，人工只复核 | 已有基线模型、量大 | 最省，但会继承模型偏差 |\n| 程序化标注（弱监督） | 用规则/启发式函数生成标签 | 规则明确的场景 | 便宜，噪声大 |\n\n**标注质量的三道控制**\n\n1. **标注手册**：边界案例必须有明文规则（\"这句话算不算投诉\"），否则不同人打出不同结果。\n2. **多人标注 + 一致性度量**：同一批样本由 2–3 人独立标注，计算一致率（如 Cohen's Kappa）。一致率低就该改手册，而不是继续堆量。\n3. **黄金集抽检**：预埋一批已知答案的样本混在任务里，用于持续监控标注员质量。\n\n**主动学习能省多少**\n\n不随机选样本送标，而是优先标\"模型最不确定\"的样本。实践中通常能用 **30%–50% 的标注量**达到相近效果。判断依据是模型输出概率的熵或置信度边际。\n\n**教学案例（虚构示意）**：意图分类任务，10 人标了 2 万条，训练后准确率卡在 0.72。诊断发现\"退款咨询\"和\"售后投诉\"的边界在手册里没定义，两人一致率只有 0.55。补边界规则 + 重标 3000 条后，一致率升到 0.88，模型准确率到 0.85。\n\n**关联 AWS 服务**：Amazon SageMaker Ground Truth（人工 + 自动标注）、Amazon SageMaker Ground Truth Plus（托管标注 workforce）、Amazon Augmented AI（人工复核流程）。\n\n#### 偏差来源识别与缓解\n\n**定义**：偏差是\"模型对某些群体系统性表现更差\"。它多数**来自数据而不来自算法**，所以要在数据侧治理。\n\n**四类来源**\n\n| 来源 | 表现 | 例子 |\n|---|---|---|\n| 采样偏差 | 训练集不代表真实分布 | 只用了某个区域的客户数据 |\n| 测量偏差 | 采集方式本身有偏 | 只有被投诉的样本才有详细记录 |\n| 标签偏差 | 人工标注带有主观倾向 | 历史审批记录里存在地区差异 |\n| 历史偏差 | 数据反映了过去的既有偏见 | 过去某类人群通过率天然更低 |\n\n**四种缓解手段（对应考纲原文的三个词）**\n\n| 手段 | 做什么 | 注意 |\n|---|---|---|\n| **数据划分（splitting）** | 按时间、按群体划分，检查各子集表现 | 随机划分会掩盖群体差异，要按关键属性分层 |\n| **打乱（shuffling）** | 打散顺序，消除采集顺序带来的相关 | 时序数据不能随机打乱（会泄漏未来信息） |\n| **增强（augmentation）** | 对少数群体补样本 | 增强不能改变标签语义 |\n| **再加权 / 重采样** | 提高少数群体权重或过采样 | 过度过采样会导致过拟合少数类 |\n\n**度量侧的工具**\n\nSageMaker Clarify 可以计算类别不平衡指标（CI）与标签质量指标（DPL），并在训练后给出各群体的表现差异。**判断标准不是\"整体指标好\"，而是\"群体间差距是否可接受\"**——这是这类题的核心口径。\n\n**一条实务红线**：偏差治理不是\"把指标调平\"。若某群体的真实通过率确实更低（业务事实），强行调平会引入新的错误。正确做法是**先确认差异来自数据缺陷还是真实分布**，前者修数据，后者要在业务上解释。\n\n**教学案例（虚构示意）**：信贷审批模型整体 AUC 0.81，但某类客户群体的通过率显著低于其他群体。排查发现该群体在训练集里样本量仅占 3%，且历史上多数由少数审批人处理（标签偏差）。通过分层采样 + 补样本，群体差距缩小且整体 AUC 未降。\n\n**关联 AWS 服务**：Amazon SageMaker Clarify（偏差与可解释性）、Amazon SageMaker Data Wrangler（分层采样与增强）、AWS Glue（重采样 ETL）。\n\n#### 多模态数据分布与偏差度量\n\n**定义**：当数据里同时有数值、文本、图像时，偏差会以不同形态出现，度量方式也不同。C02 新增这一条，考的是\"你知不知道该看什么指标\"。\n\n| 模态 | 偏差的典型表现 | 度量什么 |\n|---|---|---|\n| 数值 | 某群体在关键字段上分布偏移；长尾被截断 | 分位数分布、群体均值差异、缺失率差异 |\n| 文本 | 某类表述被系统性标注为负面；语言/方言覆盖不足 | 词频分布、各类别文本长度分布、语言占比 |\n| 图像 | 光照/角度/设备/人群分布不均；某类场景样本极少 | 亮度与分辨率分布、类别占比、场景标签分布 |\n\n**优化多模态分布的四个动作**\n\n1. **先画像，再动手**：对每个模态分别出分布报告（直方图、类别占比、缺失率），找出\"长尾在哪个模态\"。\n2. **按最弱模态对齐**：多模态训练里，最稀缺的那个模态决定上限。图像够但对应文本标注少，等于白搭。\n3. **分层采样而非全局均衡**：均衡要在**关键交叉维度**上做（如\"场景 × 光照\"），只按单一维度均衡会制造新的偏斜。\n4. **补采优先于合成**：真实样本的分布最可靠；合成数据（生成图像/文本）只能补数量，容易引入生成器自身的偏差。\n\n**易错点**：把\"类别均衡\"等同于\"分布无偏\"。真实场景里类别均衡但交叉维度（如\"夜间 × 雨雪\"）严重缺失的情况非常常见。\n\n**关联 AWS 服务**：Amazon SageMaker Clarify（数值与类别偏差）、Amazon SageMaker Data Wrangler（分布可视化与分层采样）、Amazon Rekognition / Amazon Transcribe（多模态特征抽取侧的分布统计）。\n\n#### 类别不平衡处理\n\n**定义**：正负样本比例悬殊（如欺诈 0.1%、缺陷 0.5%）时，模型会倾向于\"全预测为多数类\"仍得到很高的准确率。**这类题的关键不是选方法，而是先换指标**。\n\n**四类处理手段**\n\n| 手段 | 做法 | 适用 | 风险 |\n|---|---|---|---|\n| 过采样（oversampling） | 复制或合成少数类（SMOTE 类方法） | 少数类样本极少 | 过拟合少数类；合成样本可能不真实 |\n| 欠采样（undersampling） | 减少多数类 | 多数类冗余大 | 丢信息，样本量不足时不可用 |\n| 类别权重（class weight） | 损失函数里给少数类更高权重 | 首选，改动最小 | 权重过大导致震荡 |\n| 阈值调整 | 不改训练，改判定阈值 | 已有模型、成本不对称 | 需要业务给出成本比 |\n\n**指标必须先换掉**\n\n| 不要用 | 为什么 | 改用 |\n|---|---|---|\n| 准确率（accuracy） | 全预测多数类就能很高 | 精确率 / 召回率 / F1 |\n| ROC-AUC（单独看） | 不平衡时看起来很好但与业务脱节 | PR-AUC（更适合不平衡） |\n| 单一阈值指标 | 掩盖代价不对称 | 按业务代价选阈值，报对应 P/R |\n\n**文本与图像的不平衡更麻烦**\n\n- 文本：少数类往往句式也独特，模型学到的是\"句式特征\"而非语义。增强时要做**语义等价改写**，不是简单复制。\n- 图像：少数类可能同时存在拍摄条件差异（缺陷图多在特定光照下拍），模型可能学到光照而非缺陷。**必须做条件均衡**，不能只按类别数量均衡。\n\n**教学案例（虚构示意）**：缺陷检出任务正负比 1:200。第一版用 accuracy 评估得到 0.995，上线后漏检率 60%。改用 PR-AUC 评估 + 类别权重 + 按漏检成本调阈值后，在误报率可接受的前提下召回率达到 0.88。\n\n**关联 AWS 服务**：Amazon SageMaker（内置类别权重与评估指标）、Amazon SageMaker Data Wrangler（重采样）、Amazon SageMaker Clarify（不平衡度量）、Amazon Bedrock Model Evaluation（分类任务指标对比）。\n\n#### AI 训练数据完整性校验\n\n**定义**：面向生成式模型的数据校验，检查的不只是\"字段有没有缺\"，而是\"输入输出配对是否成立、内容是否安全合规\"。C02 新增，是 GenAI 场景的必答题。\n\n**两类校验**\n\n**（一）prompt–response 配对校验**\n\n| 检查项 | 判断方法 |\n|---|---|\n| 配对完整性 | 每条 prompt 都有 response，无空值、无截断 |\n| 语义相关性 | response 是否在回答 prompt（可用模型或相似度打分，抽检） |\n| 格式合规 | 是否符合目标模型的对话模板（角色标记、结束符） |\n| 长度合规 | 是否超出上下文上限、是否被静默截断 |\n| 重复度 | prompt 重复率过高会导致过拟合模板 |\n| 拒答与安全拦截 | 是否存在本应拒答却被给了答案的样本 |\n\n**（二）内容安全筛查**\n\n在训练前扫描四类内容：违法违规、有害与暴力、个人敏感信息（PII）、以及厂商使用政策禁止的类别。工具上可用 Amazon Comprehend 做 PII 与毒性检测，用 Amazon Bedrock Guardrails 在推理侧做同类拦截——**训练前筛一遍、推理时再拦一遍**，两层都要有。\n\n**为什么这一步不能省**\n\n训练数据里的有害样本会被模型学成\"可接受输出\"。事后靠推理侧拦截只能挡住一部分（用户换个问法就绕过），根本解法是**不让它进训练集**。\n\n**易错点**\n\n- 只查结构不查语义：JSON 合法但答案是空的、跑题的，结构校验查不出来。\n- 只扫一遍不记录：筛查结果要留痕（哪些被剔除、剔除原因、剔除比例），否则无法向审计或客户解释数据来源的合规性。\n\n**关联 AWS 服务**：Amazon Comprehend（PII / 毒性检测）、Amazon Bedrock Guardrails（内容过滤策略）、AWS Glue Data Quality（结构类规则）、Amazon SageMaker Ground Truth（人工复核抽检）。\n\n#### 数据清洗\n\n**定义**：处理三类最常见的脏数据——离群值、缺失值、重复记录。三种处理各有\"看起来对但会害了模型\"的做法。\n\n**（一）离群值**\n\n| 检测方法 | 原理 | 适用 |\n|---|---|---|\n| 统计法（3σ / IQR） | 偏离均值若干倍标准差或四分位距之外 | 近似正态的连续变量 |\n| 分位数截断 | 按 1%/99% 分位裁剪 | 分布未知、长尾 |\n| 模型法（孤立森林、DBSCAN） | 密度/隔离难度判定异常 | 多维、非线性关系 |\n\n**处理方式的选择顺序**：先判断是\"错误值\"还是\"真实极端值\"。\n- 错误值（如年龄 999）→ 修正或置空。\n- 真实极端值（如大额交易）→ **不能删**，删了模型就学不到极端情况，而这往往正是业务最关心的。应保留并考虑单独建模或分箱。\n\n**（二）缺失值**\n\n| 方式 | 何时用 | 代价 |\n|---|---|---|\n| 删除行 | 缺失比例极低（<1%）、随机缺失 | 少量信息损失 |\n| 删除列 | 该列缺失率过高（>50%）且无业务含义 | 可能丢掉关键信号 |\n| 统计量填充（均值/中位数/众数） | 快速基线 | 低估方差、扭曲相关性 |\n| 模型填充（回归/KNN） | 缺失有规律、字段间相关强 | 引入模型误差，且可能放大偏差 |\n| 保留并标记（缺失指示变量） | 缺失本身有信息（\"没填\"=某种状态） | 需要模型支持 |\n\n**最重要的一条**：区分**随机缺失**与**非随机缺失**。若缺失与目标相关（如高收入客户不愿填收入），填充会系统性地扭曲分布。\n\n**（三）去重**\n\n| 方式 | 做法 | 适用 |\n|---|---|---|\n| 精确去重 | 按主键或全字段哈希 | 完全重复 |\n| 近似去重 | SimHash / MinHash / 编辑距离 / 向量相似度 | 文本近重复、图像近似重复 |\n\n**去重的必要性常被低估**：训练集里 5% 的重复样本会显著增加过拟合风险；RAG 索引里的重复块会让检索结果雷同、挤掉真正有用的内容。\n\n**教学案例（虚构示意）**：设备故障数据里\"运行时长\"有 12% 缺失，先按均值填充，模型对短周期设备预测偏差极大。改为\"缺失标记 + 按设备类型分组中位数填充\"后，偏差收敛。原因：缺失本身与设备新旧相关（老设备不上报），属非随机缺失。\n\n**关联 AWS 服务**：AWS Glue DataBrew（可视化清洗与去重）、AWS Glue Data Quality（规则化校验）、Amazon SageMaker Data Wrangler（清洗算子）、Amazon SageMaker Clarify（清洗前后的分布对比）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 质量校验只出报表不阻断流程 | 不能卡住下游的校验等于没做，必须能阻断且留痕 |\n| 2 | 标注量越大越好 | 一致率低时先改手册；主动学习可用三到五成标注量达到相近效果 |\n| 3 | 认为偏差是算法问题 | 多数偏差来自采样、测量、标签与历史数据，要在数据侧治理 |\n| 4 | 把整体指标好当成无偏 | 要看群体间差距，整体指标会掩盖少数群体表现 |\n| 5 | 只按类别数量做均衡 | 交叉维度（场景×条件）缺失才是常态问题 |\n| 6 | 不平衡数据仍看准确率 | 全预测多数类就能很高，改用 PR-AUC 与召回率 |\n| 7 | 删掉所有离群值 | 真实极端值往往是业务重点，应先分辨\"错误值\"与\"真实极端\" |\n| 8 | 缺失一律用均值填充 | 非随机缺失会被系统性扭曲，应分组填充或加缺失标记 |\n| 9 | 训练数据只查结构不查内容安全 | 有害样本会被学成可接受输出，推理侧拦截只能挡一部分 |\n\n#### 记忆要点\n\n1. **质量六维**：完整、准确、一致、唯一、及时、有效；规则必须能阻断。\n2. **标注三控**：手册定边界、多人算一致率、黄金集持续抽检。\n3. **偏差四源**：采样、测量、标签、历史；四手段：划分、打乱、增强、再加权。\n4. **不平衡先换指标**：准确率 → PR-AUC + 召回率；手段优先级：权重 > 阈值 > 过采样 > 欠采样。\n5. **多模态看最弱模态**：分布优化按交叉维度分层，不按单一类别均衡。\n6. **AI 数据双检**：prompt-response 配对校验（结构 + 语义）、内容安全筛查（训练前 + 推理时两层）。\n7. **清洗三分辨**：离群先分错误值与真实极端、缺失先分随机与非随机、重复用精确与近似两档。\n\n---"}],"tips":{"points":"| 考点 | 内容 | 提醒 |\n|---|---|---|\n| 存储选型四维 | 成本、性能、数据结构、合规 | 只看容量单价是标准错项 |\n| 小文件问题 | 大量小文件的元数据与请求开销 | 换格式/打包优于换存储 |\n| EFS 突发额度 | Bursting 模式在高负载时被耗尽 | 需改 Provisioned 吞吐 |\n| 实例 EBS 带宽 | 卷 IOPS 够但实例带宽先撞墙 | 先看实例规格再谈加卷 |\n| 流式四件套 | Data Streams / Firehose / Flink / MSK | Firehose 不重放、Lambda 不做窗口 |\n| 列式 vs 行式 | 扫描字节数决定分析成本 | Parquet 通用、ORC 偏 Hive |\n| 向量索引 | HNSW 内存换召回、IVF 召回换成本 | 与距离度量必须匹配 |\n| Feature Store | 在线 + 离线双存储、event time | 核心是消灭训练-服务偏差 |\n| embedding 换模型 | 向量空间不可比 | 必须全量重建索引 |\n| RAG 分块 | 结构 > 语义 > 递归 > 固定长度 | 小块检索、大块生成 |\n| 数据泄漏 | 标准化统计量只能用训练集 | 全量算均值是常见陷阱 |\n| 不平衡评估 | accuracy 无意义 | 用 PR-AUC 与召回率 |\n| 脱敏三档 | 遮蔽 / 脱敏 / 匿名化 | 准标识符组合可重识别 |\n| prompt-response 校验 | 结构 + 语义两层 | 训练前筛、推理时再拦 |","services":"| 服务 | 主要用途 | 涉及任务 |\n|---|---|---|\n| Amazon S3 | 数据湖、训练输入、原始与派生分层存储 | 1.1.1 / 1.1.2 / 1.1.5 / 1.1.8 |\n| Amazon EBS | 单机高性能块存储 | 1.1.1 / 1.1.2 / 1.1.3 |\n| Amazon EFS | 多实例共享文件系统 | 1.1.1 / 1.1.2 / 1.1.3 |\n| Amazon RDS | 关系型源、pgvector 向量检索 | 1.1.1 / 1.1.7 |\n| Amazon DynamoDB | 键值源、在线特征存储的常见上游 | 1.1.1 / 1.1.3 |\n| Amazon OpenSearch Service | 全文 + 向量混合检索 | 1.1.1 / 1.1.7 / 1.2.7 |\n| Amazon Kinesis Data Streams | 流式摄取缓冲、可重放 | 1.1.4 / 1.2.3 |\n| Amazon Data Firehose | 流式投递入湖，自动缓冲与转换 | 1.1.4 |\n| Managed Service for Apache Flink | 有状态流计算与窗口聚合 | 1.1.4 / 1.2.3 |\n| Amazon MSK | 托管 Kafka，Kafka 生态兼容 | 1.1.4 |\n| AWS Glue | ETL、Data Catalog、数据质量规则（DQDL） | 1.1.1 / 1.1.6 / 1.2.1 / 1.3.1 |\n| AWS Glue DataBrew | 可视化数据准备与规则集 | 1.2.1 / 1.3.1 / 1.3.7 |\n| Amazon EMR | Spark / Hive 大规模处理 | 1.1.6 / 1.2.1 / 1.2.3 |\n| Amazon SageMaker Data Wrangler | ML 侧可视化特征加工 | 1.2.1 / 1.2.4 / 1.2.5 |\n| Amazon SageMaker Feature Store | 在线 + 离线特征统一管理与复用 | 1.1.9 / 1.2.2 |\n| Amazon SageMaker Processing | 批量预处理与转换作业 | 1.2.4 / 1.2.6 |\n| Amazon SageMaker Ground Truth | 人工与自动标注、人工复核 | 1.3.2 / 1.3.6 |\n| Amazon SageMaker Clarify | 偏差度量与可解释性 | 1.3.3 / 1.3.4 / 1.3.5 |\n| Amazon Bedrock | embedding 模型、微调与蒸馏、Guardrails | 1.2.5 / 1.2.8 / 1.2.9 / 1.3.6 |\n| Amazon Comprehend | PII 识别、文本分析辅助清洗 | 1.2.6 / 1.2.8 / 1.3.6 |\n| Amazon Textract | 带版面信息的文档抽取 | 1.2.6 / 1.2.7 |\n| Amazon Macie | S3 中敏感数据发现 | 1.2.8 |\n| AWS KMS | 存储加密与密钥自主管理 | 1.1.2 |\n| Amazon CloudWatch | 管道与质量规则告警 | 1.1.3 / 1.3.1 |"}},{"domain":2,"name":"模型与基础模型开发","weight":"24%","practice":[{"id":"D2-001","d":2,"t":"single","q":"客服平台每天要对 8 万条工单做 12 类目分类，要求 2 秒内返回。用高能力 FM 直调准确率 93%，轻量模型 91%，但单价差近 10 倍。在满足时延与成本约束下，最合理的架构是？","o":[{"l":"A","t":"全部流量走高能力 FM，用 Provisioned Throughput 买断吞吐压单价"},{"l":"B","t":"自训一个 BERT 级分类器替换 FM，把准确率做到 95% 以上"},{"l":"C","t":"轻量模型承接全量，低置信度样本二次路由到高能力模型复核"},{"l":"D","t":"把 12 个类目拆成 12 个独立的高能力模型分别调用"}],"a":["C"],"e":"**正确答案：C。** 轻量模型承接全量 + 低置信度样本二次路由到高能力模型。\n\n**为什么对：** 这是「分层路由」标准解法：多数请求被轻量模型吃掉（单价低近 10 倍），只有少量不确定样本才付出高能力模型的钱。教材案例里该组合综合成本降到全用高能力模型的 1/6，准确率回到 92.4%——用极小的成本换回主要精度差距。\n\n**其他选项为什么错：**\n- A. 预置吞吐是买断容量，解决不了「能力过剩」：93% 与 91% 差 2 个点，不值得付 10 倍单价，成本结构没有变。\n- B. 自训是另一条路（2.1.4 的判断），但题干未给标注数据和团队条件，且「做到 95% 以上」是无依据的承诺。\n- D. 拆 12 个模型让调用量与运维翻 12 倍，与成本约束背道而驰。\n\n**关键概念：** 分层路由（简单请求给轻量模型）是推理降本幅度最大的一招，通常 3–6 倍；前提是能定义「低置信度」（如分类概率阈值）。","s":"自编·2.1.1"},{"id":"D2-003","d":2,"t":"single","q":"一个内容审核平台需要每晚对白天积累的约 10 万条用户评论跑一遍合规复审，非实时、允许数小时内完成、追求最低成本。在 Bedrock 上应选哪种推理方式？","o":[{"l":"A","t":"按需推理（On-Demand），白天流量低时顺便跑"},{"l":"B","t":"预置吞吐（Provisioned Throughput），买断一个模型单元"},{"l":"C","t":"流式响应（Streaming），逐条返回降低感知延迟"},{"l":"D","t":"批量推理（Batch Inference），夜间离线跑大批量"}],"a":["D"],"e":"**正确答案：D。** 批量推理：离线跑大批量、价格更低，专为非实时任务设计。\n\n**为什么对：** 题干三个信号——夜间、非实时、允许数小时——全部指向批量推理。它按作业提交整批请求，价格低于按需，也不占用在线容量。10 万条夜间跑完正好落在它的设计区间。\n\n**其他选项为什么错：**\n- A. 按需是为「流量不稳定、在线服务」设计的计费方式，单价比批量高；「白天顺便跑」还可能与在线流量互相挤占。\n- B. 预置吞吐是按模型单元买断、按时计费，适合稳定高流量且要延迟可预期的在线场景。夜间跑一次批处理会让买断的容量闲置 20 多个小时。\n- C. 流式响应改善的是首字时延的感知，不降单价，与离线批处理场景无关。\n\n**关键概念：** Bedrock 三种推理形态各管一段：按需=流量不稳定在线用；预置吞吐=稳定高流量买断；批量推理=离线大批量省钱。题干出现「夜间/非实时/大批量」就选批量。","s":"自编·2.1.1"},{"id":"D2-005","d":2,"t":"single","q":"法务团队用 800 份历史审阅记录微调模型输出合同风险条款，格式遵循率从 78% 升到 96%。但上线后发现模型开始编造不存在的条款。最对症的修复是？","o":[{"l":"A","t":"加大微调数据量到 5000 份，让模型见得更多"},{"l":"B","t":"训练集加入一定比例的「无风险」样本，并把「不确定就不输出」写进标注规范"},{"l":"C","t":"换用更大的基础模型再微调一次"},{"l":"D","t":"在提示词里加一句「不要编造条款」后直接上线"}],"a":["B"],"e":"**正确答案：B。** 数据分布修偏 + 标注规范固化行为。\n\n**为什么对：** 根因在训练数据：800 份样本全是「有风险」审阅记录，模型学到「总要找出几条」的隐含规则。修复必须回到数据——加入无风险样本让模型见过「答案是零条」的情况，同时用标注规范把「不确定不输出」固化成训练信号。这是微调最典型的副作用与解法。\n\n**其他选项为什么错：**\n- A. 加量不修分布，5000 份全是「有风险」样本只会把偏差学得更牢；且教材明确质量比数量重要。\n- C. 换大模型不改变数据分布问题，编造行为照样出现，成本还更高。\n- D. FM 过拟合很隐蔽：换个问法就崩，一句提示词压不住已学进权重的行为倾向，属于把训练问题交给推理端打补丁。\n\n**关键概念：** 微调数据的分布必须覆盖「正例 + 反例（无风险）」；FM 过拟合要专门准备同义改写测试集来发现。标注不一致（一致率低于 85%）先修规范再训。","s":"自编·2.1.2"},{"id":"D2-006","d":2,"t":"single","q":"一家药企有 200 万字内部研发报告（大量专业术语与行文惯例），没有任何标注，希望模型能更好地理解这个领域的语言。在 Bedrock 上应选哪种定制方式？","o":[{"l":"A","t":"微调（Fine-tuning），用报告当训练对"},{"l":"B","t":"蒸馏（Distillation）"},{"l":"C","t":"持续预训练（Continued Pre-training）"},{"l":"D","t":"提示工程，把术语表写进系统提示词"}],"a":["C"],"e":"**正确答案：C。** 持续预训练：输入无标注领域文本，改变领域语言分布。\n\n**为什么对：** 题干两个信号——大量领域原文、无标注——正好落在持续预训练的适用格：用无标注文本继续训练，吸收术语与行文惯例（改变「领域语言分布」）；之后有带标注任务数据可再叠微调。\n\n**其他选项为什么错：**\n- A. 微调的输入必须是带标注的输入-输出对，200 万字无标注原文没有可用的监督信号，硬凑对子成本极高且质量不可控。\n- B. 蒸馏是用小模型复现大模型表现、目的是降本，不是吸收领域语言。\n- D. 提示工程先试没错，但术语量大、行文惯例深时，几段提示词装不下 200 万字的语言分布，属于该升档不升。\n\n**关键概念：** 三档定制的判据看输入数据：无训练数据→提示工程；带标注对→微调；无标注领域原文→持续预训练；要降本保能力→蒸馏。判断顺序先看「知识会不会变的事实」，再看输入形态。","s":"自编·2.1.2"},{"id":"D2-008","d":2,"t":"single","q":"线上反欺诈评分服务要求 P99 延迟在 100ms 以内、每秒数千次请求，输入是结构化交易特征。用大语言模型直调能否满足？应该怎么选？","o":[{"l":"A","t":"不能；应选传统 ML 小模型部署在专用推理实例上"},{"l":"B","t":"能，用 Provisioned Throughput 买断吞吐即可压住延迟"},{"l":"C","t":"不能；应选更大算力的 FM 实例并开流式输出"},{"l":"D","t":"能，把 prompt 缩短到 100 token 以内即可"}],"a":["A"],"e":"**正确答案：A。** 硬延迟 + 高 QPS + 结构化输入，指向传统 ML 小模型。\n\n**为什么对：** 三条约束同时卡死 FM 路线：FM 的延迟受输出长度线性影响，长输出场景无法满足硬延迟；数千 QPS 的 token 计费成本也压不住；而反欺诈评分本质是结构化表格上的判别任务，XGBoost 类小模型毫秒级即可完成，天然匹配 P99 100ms。这是 2.1.3 延迟约束的标准结论。\n\n**其他选项为什么错：**\n- B. 预置吞吐买断的是容量、消除排队，但生成时延（逐 token 输出）买不掉，100ms 硬线仍然过不了。\n- C. 流式输出改善的是首字感知，总时长不变；更大算力提高的是吞吐，不是单次生成速度的数量级。\n- D. 缩短 prompt 只优化输入段；评分任务本身无长 prompt 问题，瓶颈在生成段，方向就错了。\n\n**关键概念：** 题干出现「P99 100ms/每秒数千请求」+ 结构化输入 → 传统 ML 小模型 + 专用推理实例。延迟、可解释、领域口径三条约束出现任何一条，都要先考虑非 FM 路线。","s":"自编·2.1.3"},{"id":"D2-009","d":2,"t":"single","q":"费用报销审核系统需要：识别发票金额与日期、判断是否符合报销政策、对异常项生成自然语言说明、全程可审计。以下哪条技术路线是对的？","o":[{"l":"A","t":"把发票图片直接交给一个 FM，让它完成识别、判断与说明的全部工作"},{"l":"B","t":"Textract 抽字段，规则引擎加小模型判断政策符合性，FM 只生成异常说明"},{"l":"C","t":"全流程用 Comprehend，它同时支持实体识别与文本分类"},{"l":"D","t":"Rekognition 识别发票版面，FM 完成其余全部判断"}],"a":["B"],"e":"**正确答案：B。** 把业务问题拆成标准能力，每步做自己最擅长的事。\n\n**为什么对：** 拆解后是三种技术：发票字段抽取是标准 OCR 任务 → Textract，无需自训；政策符合性判断的依据是条文 → 规则引擎 + 小模型，可解释可审计；异常说明是自然语言生成 → FM。三者各归其位，链路每一步都可审计，正是教材的原始案例。\n\n**其他选项为什么错：**\n- A. 「让大模型看图回答一切」是典型外行方案：延迟高、成本高、幻觉不可控、无法审计，也是考试最常见的干扰项。\n- C. Comprehend 处理纯文本，没有 OCR 能力，第一步就走不通；「一个服务包打天下」的思路本身错。\n- D. Rekognition 是图像识别服务（人脸/物体/文字），做发票版面属于用错工具，后面依然把判断全塞给 FM，审计问题没解决。\n\n**关键概念：** 托管 AI 服务的正确用法是「拆问题」而不是「找万能服务」：Textract=文档抽取、Rekognition=图像、Comprehend=文本实体与情感、Transcribe=语音。组合链路题先拆任务再配服务。","s":"自编·2.1.3"},{"id":"D2-011","d":2,"t":"single","q":"一个文本分类服务日调用量已达 300 万次且非常稳定，初期用 FM 托管调用，月成本随量线性上升，延迟 400ms。按单位经济性分析，成熟的架构演进方向是？","o":[{"l":"A","t":"继续用 FM 并谈判更大折扣，架构不动"},{"l":"B","t":"全部改成自训模型，下线 FM 调用"},{"l":"C","t":"引入消息队列削峰，FM 用量不变"},{"l":"D","t":"自训小型分类模型部署到 SageMaker，同时保留 FM 处理样本不足的新类目"}],"a":["D"],"e":"**正确答案：D。** 高量稳定 → 自训摊薄固定成本，但保留 FM 处理长尾。\n\n**为什么对：** 托管按调用计费、自建按算力计费，存在一个调用量阈值，超过后自建更便宜。日 300 万次且稳定已在阈值后：自训小模型摊薄固定成本，成本大降且延迟 400ms 降到 20ms。但「全部改自建」通常是错的——新类目没有训练样本，FM 少样本能力正好补位，混合架构才是真实答案。\n\n**其他选项为什么错：**\n- A. 折扣谈判不改变成本随量线性上升的结构，量再涨成本继续涨，也没解决延迟。\n- B. 「全部改自建」在长尾类目上无样本可训，等于放弃 FM 的少样本优势；考试里出现「全部改成自建」通常就是错的。\n- C. 削峰解决瞬时压力，300 万次是稳定日均非尖峰，成本结构没变。\n\n**关键概念：** 单位经济性逻辑与「按需 vs 预留实例」同构：低量选托管避固定成本，高量且稳定选自建摊薄固定成本。成熟形态多为混合架构。","s":"自编·2.1.4"},{"id":"D2-012","d":2,"t":"single","q":"公司要给报销系统加发票 OCR 能力。这是行业通用任务，公司没有差异化诉求，也没有 ML 团队。按四路权衡应选哪条路径？","o":[{"l":"A","t":"托管 AI 服务（Amazon Textract），直接调用"},{"l":"B","t":"自建模型，把 OCR 能力沉淀成公司资产"},{"l":"C","t":"开源 OCR 模型自托管，省下调用费"},{"l":"D","t":"用 FM 多模态读发票，顺便理解发票内容"}],"a":["A"],"e":"**正确答案：A。** 标准能力 + 无差异化 + 无团队 → 托管服务。\n\n**为什么对：** 四路权衡第二问「是不是我们的差异化」：发票 OCR 是行业通用能力，自建无法形成壁垒，纯属成本；团队条件（无 ML 团队）也排除了需要维护的自托管路线。Textract 文档文字/表格/表单抽取开箱即用，前期投入低、迭代快。\n\n**其他选项为什么错：**\n- B. 「把 OCR 沉淀成资产」的前提是它构成差异化，通用 OCR 不满足；自建需要数据、算力和团队，三项都不具备。\n- C. 自托管省下调用费，付出部署运维成本，无 ML 团队时维护负担更重。\n- D. FM 读发票单价高、延迟高、字段抽取精度不稳定，用大模型做标准 OCR 属于能力错配；理解发票内容另有 Comprehend 等更合适的工具。\n\n**关键概念：** 判断口诀：标准任务自训是浪费；不是差异化就选托管；数据不能出去才考虑自托管。Textract 能抽文字表格表单签名，但不理解条款含义——能力边界要能说清。","s":"自编·2.1.4"},{"id":"D2-013","d":2,"t":"single","q":"律所要建内部合同问答系统，要求：不同律师只能检索到自己有权查看的合同，答案必须标注出自哪份合同哪一条。以下说法正确的是？","o":[{"l":"A","t":"把合同全部微调进模型，再按用户角色配置不同的系统提示词"},{"l":"B","t":"只能采用 RAG，检索时按用户身份做元数据过滤，答案引用检索命中的文档"},{"l":"C","t":"用 FM 直接读全部合同，靠提示词声明当前用户权限"},{"l":"D","t":"先微调让模型学会「拒答无权内容」，再叠加出处标注微调"}],"a":["B"],"e":"**正确答案：B。** 行级权限 + 出处要求，答案只能是 RAG + 检索时过滤。\n\n**为什么对：** 微调把知识烧进权重，所有人共享同一套知识，提示词改变不了权重内容，「按用户隔离」微调做不到。RAG 的知识在检索层：检索时按用户身份注入元数据过滤条件，无权文档根本不会进入上下文；答案的出处就是检索命中的块，天然可溯源。教材原话：只要有行级权限，答案只能是 RAG + 检索时过滤。\n\n**其他选项为什么错：**\n- A. 系统提示词拦不住模型从权重里「说漏」无权内容，权限隔离是安全要求，不能建立在提示词上。\n- C. 提示词声明的权限没有强制力，FM 直读全部合同也给不出精确到条的可验证出处。\n- D. 「学会拒答」是概率行为不是访问控制，拒不准就是数据泄漏，出处也无法验证到条。\n\n**关键概念：** 权限隔离是必要项不是可选项，且只能做在检索层；出处标注也是 RAG 的天然能力（命中块即出处）。","s":"自编·2.1.5"},{"id":"D2-015","d":2,"t":"single","q":"业务方要对 RAG 助手提新需求：「查一下华东区上季度销售额前十的客户和它们的未结订单」。知识库团队该怎么做才是对的？","o":[{"l":"A","t":"把销售报表切块进向量库，检索后让模型数数排序"},{"l":"B","t":"用 GraphRAG 建客户关系图谱后查询"},{"l":"C","t":"走结构化数据检索：自然语言转 SQL 查询数据库，结果回填给模型组织答案"},{"l":"D","t":"让 FM 凭训练记忆直接回答，销售额是公开常识"}],"a":["C"],"e":"**正确答案：C。** 问的是数据库里的统计与明细 → 结构化数据检索（NL2SQL）。\n\n**为什么对：** 题干信号词是「销售额、订单、前十、上季度」——这是数据库里的统计与明细问题，要的是精确数值计算与排序，向量库和 FM 都不擅长。正确形态是自然语言转 SQL，数据库执行后结果回填给模型组织答案，数值精确可验证。\n\n**其他选项为什么错：**\n- A. 向量检索靠语义相似，不保证取全取准；让语言模型对几十行数字做排序统计，容易算错，且无法保证可复现。\n- B. GraphRAG 解决的是实体关系多跳推理（「母公司还投了谁」），不是数值统计，构图成本花在不对应的问题上。\n- D. 上季度内部销售数据不在任何模型训练集里，这是编造；「公开常识」的前提就是假的。\n\n**关键概念：** 架构信号词对应：销售额/库存/订单 → 结构化检索；多跳关系 → GraphRAG；快速上线 → 全托管；召回不达标 → 自建混合检索。「问数字就别走向量库」。","s":"自编·2.1.5"},{"id":"D2-017","d":2,"t":"single","q":"视觉质检模型训练一次 14 小时、约 900 元，业务要求每周重训。团队想在不换模型、不减数据的前提下把成本压下来。性价比最高的组合是？","o":[{"l":"A","t":"早停 + Spot 实例（checkpoint 续训）+ 优化数据管道（分片预取）"},{"l":"B","t":"换更大的模型一次训练到位，减少重训次数"},{"l":"C","t":"随机砍掉一半训练数据，时长自然减半"},{"l":"D","t":"把学习率调小让训练更稳，避免返工"}],"a":["A"],"e":"**正确答案：A。** 早停、Spot 续训、管道优化三招叠加，成本降到 45%。\n\n**为什么对：** 教材案例同款：调 batch 与学习率把 14h 压到 7h；数据管道从逐文件读取改分片预取消除数据等待降到 5h；剩余用 Spot 实例承担（单价低数成，中断后从 checkpoint 续训不丢进度）。三个动作都没换模型、没减数据。早停还同时改善过拟合，是三角里性价比最高的手段。\n\n**其他选项为什么错：**\n- B. 更大模型训练更慢更贵，与降本目标相反；「减少重训次数」也由业务节奏决定，不是模型说了算。\n- C. 砍数据等于砍性能，违反「不减数据」前提；质检模型漏检的代价远高于省下的训练费。\n- D. 调小学习率通常需要更多轮次收敛，时长和成本反而上升，方向就错了。\n\n**关键概念：** 训练成本三项构成：算力时长（最大项）、数据搬运、调参返工。降本顺序：先管道（数据搬运）、再早停（砍无效轮次）、最后 Spot（降单价）。","s":"自编·2.1.6"},{"id":"D2-018","d":2,"t":"single","q":"合同摘要服务总耗时 12 秒，用户调研显示「点了半天没反应」抱怨集中，但实际上用户从看到结果到读完只要几秒。最对症的改动是？","o":[{"l":"A","t":"换更贵的更高能力模型，缩短总时长"},{"l":"B","t":"开流式输出，让用户几秒内看到第一个字"},{"l":"C","t":"把摘要长度上限从 800 token 砍到 200 token"},{"l":"D","t":"在页面上加一个加载动画，缓解用户等待焦虑"}],"a":["B"],"e":"**正确答案：B。** 这是首字时延问题，不是总时延问题。\n\n**为什么对：** 题干信号：用户抱怨「等待」但「实际总时长可接受」——矛盾点在感知而非总量。流式输出不降低总时长，但把首字时延从「等全部生成完」降到「预填充完成」，用户几秒内开始看到内容滚出，感知差别巨大。教材明确：出现这种描述，答案就是流式输出。\n\n**其他选项为什么错：**\n- A. 高能力模型通常更慢不是更快，且成本上升；问题在感知，换模型没抓住矛盾。\n- C. 砍输出长度确实降总时长，但摘要信息量被砍，业务质量受损；而且总时长本来就「可接受」，砍错了对象。\n- D. 加载动画是产品手段，不改变任何时延；考试要的是技术方案。\n\n**关键概念：** 首字时延与总时延分开谈：抱怨「等不到反应」→ 流式；抱怨「转圈太久结果太慢」→ 才去压总时长（缩输入/限输出/换小模型）。","s":"自编·2.1.7"}],"sections":[{"h":"为 ML 与 AI 方案选择建模方法（Choose appropriate modeling approaches for ML and AI solutions.）","body":"### 这一域考什么\n\nD2 占 24%，是四域里**变化最大**的一域。C01 时代这一域叫「模型开发」，考的是怎么用 SageMaker 训一个模型；C02 把它改名为「模型与基础模型开发」，并新增了 11 条技能点，绝大多数围绕同一件事：\n\n> **你不一定需要训一个模型，但你必须能证明\"为什么不需要\"或\"为什么必须\"。**\n\n所以这一域的题有一个共同形状：给定业务约束（准确率、时延、预算、数据量、合规），在「托管 AI 服务 / 预训练 FM 直接调 / RAG / 微调 / 从头训」这条阶梯上选一级。并且要说出不选其他级的理由。**答对选型只是及格，答出\"为什么不选隔壁那一级\"才是得分点。**\n\n三条主线：\n\n1. **选型**（任务 2.1）：在五种建模路径之间做取舍，代价是钱、时间、可控性。\n2. **造模**（任务 2.2）：真要走训练/微调这条路时，算法、超参、加速、过拟合与遗忘的处理。\n3. **验模**（任务 2.3）：证明模型变好了、没变坏、并且能持续证明——传统指标与 GenAI 评估两套语言都要会。\n\n### 与 AIP-C01 / AIF-C01 的问法差别\n\n| 级别 | 主问题 | 典型题干 | 答案落点 |\n|---|---|---|---|\n| AIF-C01 | FM 是什么、有哪些 | \"以下哪项属于基础模型的特征\" | 概念辨析 |\n| AIP-C01 | 方案怎么设计 | \"为支持 RAG，应如何组织知识库与检索链\" | 架构与组件 |\n| **MLA-C02** | **这一级选型代价多大、怎么落地** | \"该场景下应选微调还是 RAG，需额外投入多少标注与训练成本\" | **具体路径 + 量化代价 + 失效条件** |\n\n最容易犯的错是**用 AIP 的答法答 MLA**。说\"用 RAG 更灵活\"是不够的。MLA 要的是\"该场景下 RAG 的检索召回率上限受分块策略限制，而微调无法注入新知识，因此选 RAG 并配 512 token 重叠分块\"。\n\n### 学习主线（不按编号顺序）\n\n```\n2.1.4 四路权衡  ← 先建立「托管/预训练/RAG/微调/自训」这条阶梯的成本直觉\n      ↓\n2.1.1 选 FM · 2.1.3 选算法/模板 · 2.1.8 选 AI 服务  ← 阶梯各层内部怎么选\n      ↓\n2.2.8 提示工程与定制手段 · 2.2.9 embedding  ← 最低成本的两级，先学\n      ↓\n2.1.5 RAG 架构 · 2.2.1 内置算法 · 2.2.2 script mode  ← 中间两级\n      ↓\n2.2.3 超参 · 2.2.4 加速 · 2.2.5 过拟合/遗忘 · 2.2.6 集成  ← 真训练时才需要\n      ↓\n2.1.6 / 2.1.7 三角权衡  ← 有了上面的代价感，权衡才不是背口诀\n      ↓\n2.3 全节  ← 评估放最后，因为要先有模型才谈得上评\n```\n\n### 常见失分点（真实考试口吻）\n\n1. **把「微调」当知识注入手段**。微调改的是行为与风格，不是事实记忆；要注入会变的业务知识，正确答案几乎总是 RAG。题干出现\"知识每周更新\"就是这一条的信号。\n2. **忽略灾难性遗忘**。在窄领域数据上继续训练，模型会在该领域变强、在通用能力上变差。C02 明确把这一条写进技能点（2.2.5），题干常以\"微调后其他任务表现下降\"出现。\n3. **评估只答指标名，不答怎么取数**。MLA 问评估时关心的是\"标注从哪来、人评怎么组织、LLM 裁判怎么防偏\"，而不是 BLEU 的定义。\n4. **把 Provisioned Throughput 当性能优化**。它是**成本与容量**手段（买断吞吐），不是让单次推理变快的手段；单次延迟要靠模型大小、输入长度、流式输出。\n\n#### 这一节学什么\n这一节对应考纲任务 2.1「为 ML 与 AI 方案选择建模方法（Choose appropriate modeling approaches for ML and AI solutions.）」。\n\n> 官方原名：Choose appropriate modeling approaches for ML and AI solutions.\n> 技能点 8 条｜C02 新增 5 条｜可复用 2 条\n\n这个任务是整门课的**分岔口**：后面 2.2 讲怎么造、2.3 讲怎么验，但前提是 2.1 已经选对了路。选错路的代价不是答错一道题，而是真做项目时多花三个月。\n\n| 编号 | 官方技能点（英文原文） | 中文速记 |\n|---|---|---|\n| 2.1.1 | Evaluate and select appropriate FMs from Amazon Bedrock based on task requirements and performance criteria. | 从 Bedrock 选基础模型 |\n| 2.1.2 | Identify fine-tuning strategies for pre-trained FMs to meet business needs. | 预训练 FM 的微调策略 |\n| 2.1.3 | Compare and select appropriate ML models, generative AI (GenAI) models, algorithms, and solution templates to meet business needs (for example, interpretability, domain-specific performance, latency). | 模型/算法/方案模板选型 |\n| 2.1.4 | Evaluate tradeoffs between custom solutions, managed services, pre-trained models, and FMs to meet business needs. | 自建/托管/预训练/FM 四路权衡 |\n| 2.1.5 | Select Retrieval Augmented Generation (RAG) architecture patterns based on use case requirements. | RAG 架构模式选择 |\n| 2.1.6 | Assess tradeoffs between ML model performance, training time, and cost. | 性能-训练时长-成本三角权衡 |\n| 2.1.7 | Assess tradeoffs between AI model performance, latency, and cost. | 性能-时延-成本三角权衡 |\n| 2.1.8 | Apply AWS AI services to solve specific business problems (for example, Amazon Textract, Amazon Rekognition, Amazon Comprehend, Amazon Transcribe). | 用 AWS AI 托管服务解题 |\n\n#### 从 Amazon Bedrock 选基础模型\n\n**定义**：Bedrock 是一个多模型接入层——同一个 API 形状（Converse / InvokeModel）后面挂着不同厂商的模型。选模型的本质不是\"哪个最强\"，而是**在能力、成本、上下文长度、可用区域、合规五条约束下找一个可行解**。\n\n**Bedrock 上模型的分层（按能力与成本大致排序）**\n\n| 层级 | 代表 | 特点 | 典型用途 |\n|---|---|---|---|\n| 轻量/高速 | Amazon Nova Micro、Claude Haiku 级、Llama 小参数 | 单 token 便宜、延迟低、上下文中等 | 分类、抽取、路由、内容审核 |\n| 通用 | Amazon Nova Lite/Pro、Claude Sonnet 级 | 能力与成本平衡点 | 摘要、问答、代码辅助、多数业务场景 |\n| 高能力 | Claude Opus 级、Nova Premier 级 | 复杂推理、长文档、多步任务 | 合同审阅、复杂 Agent 决策 |\n| 专用 | Titan Embeddings、Titan Image Generator、Stability 图像模型 | 单一任务专精 | 向量化、图像生成 |\n\n**五条筛选约束（按顺序问，前一条不过就不用看后面）**\n\n1. **区域可用性**：模型在不在你的合规区域。Bedrock 的模型不是每个区域都全，跨区域推理（cross-region inference）能扩大可选范围，但要确认数据是否会离开指定区域。\n2. **上下文窗口**：长文档场景先卡这一条。合同 200 页 ≈ 十几万 token，窗口不够就只能切块 + RAG。\n3. **模态**：纯文本 / 图像输入 / 语音，Bedrock 上不是所有模型都支持多模态输入。\n4. **能力档位**：用你的真实样本做一次小规模评测（Bedrock 的模型评估能力可以做人工或自动对比），而不是看榜单。\n5. **成本档位**：在满足前四条的中选最便宜的，而不是选最强的。\n\n**三个容易混的 Bedrock 概念**\n\n| 概念 | 是什么 | 什么时候用 |\n|---|---|---|\n| 按需（On-Demand） | 按输入/输出 token 计费，共享容量 | 流量不稳定、开发期 |\n| 预置吞吐（Provisioned Throughput） | 按模型单元买断吞吐，按时计费 | 稳定高流量、需要延迟可预期 |\n| 批量推理（Batch Inference） | 离线跑大批量、价格更低 | 夜间批处理、非实时任务 |\n\n**教学案例（虚构示意）**：一个客服工单分类场景，每天 8 万条短文本，要求 2 秒内返回。评测后发现轻量模型在 12 个工单类目上准确率 91%，高能力模型 93%——差 2 个点但单价差近 10 倍。选轻量模型 + 对低置信度样本走二次路由到高能力模型，综合成本降到全用高能力模型的 1/6，准确率回到 92.4%。**这就是\"分层路由\"的标准解法。**\n\n**关联 AWS 服务**：Amazon Bedrock（Converse API、Guardrails、模型评估、Provisioned Throughput、Batch Inference）、Amazon Bedrock Model Evaluation。\n\n#### 预训练 FM 的微调策略\n\n**定义**：微调是在已有模型权重上继续训练，用少量领域数据改变模型的行为。**它不是知识注入手段**——这条界线是本节全部判断的起点。\n\n**Bedrock 上的三档定制能力**\n\n| 方式 | 输入数据 | 改变什么 | 相对成本 | 适用 |\n|---|---|---|---|---|\n| 提示工程 / 少样本 | 无需训练数据 | 输出格式、语气、任务理解 | 最低 | 先试这一档，多数场景够用 |\n| 微调（Fine-tuning） | **带标注**的输入-输出对 | 行为、风格、格式遵循、领域语气 | 中 | 有稳定格式要求、有几百到几千条标注 |\n| 持续预训练（Continued Pre-training） | **无标注**的领域文本 | 领域语言分布（术语、行文） | 中高 | 大量领域原文（法规、工法、病历）但无标注 |\n| 蒸馏（Distillation） | 教师模型的输出 | 用小模型复现大模型在该任务上的表现 | 中 | 要降本但保住能力 |\n\n**判断顺序（考试几乎按这个顺序出题）**\n\n```\n知识是\"会变的事实\"吗？（价格、政策、库存、工单状态）\n├─ 是 → RAG，不要微调  ← 微调无法保证事实新鲜度，且无法溯源\n└─ 否 → 是\"输出格式/风格/口径\"问题吗？\n         ├─ 是 → 微调（有标注）或提示工程（无标注）\n         └─ 否 → 是\"领域语言不通\"吗？\n                  ├─ 是 → 持续预训练，再叠微调\n                  └─ 否 → 先做提示工程，别急着训\n```\n\n**微调策略的四个决策点**\n\n1. **数据量与质量**：Bedrock 微调通常需要数百条起，质量比数量重要——标注不一致的数据会让模型学到矛盾行为。要先做标注一致性检查（同一批样本两人标，一致率低于 85% 就先修标注规范）。\n2. **训练/验证切分**：必须留验证集，否则无法判断是学会了还是过拟合。Bedrock 微调会输出训练与验证损失曲线，两条曲线分叉即是过拟合信号。\n3. **过拟合的代价在 FM 上更隐蔽**：传统模型过拟合表现为验证集掉点；FM 过拟合常表现为\"只会说你训练数据里那种问法\"，换一种提问方式就崩。所以要专门准备**同义改写测试集**。\n4. **灾难性遗忘**：在窄领域数据上继续训练会让通用能力退化（见 2.2.5）。缓解办法是混入一定比例的通用数据，或在更小的学习率上做参数高效微调。\n\n**教学案例（虚构示意）**：某法务团队要模型按固定格式输出合同风险条款。试了提示工程，格式遵循率 78%，达不到上线要求。用 800 份历史审阅记录（条款原文 → 结构化风险项）做微调，格式遵循率到 96%。但上线后发现模型开始\"编造\"不存在的条款——因为微调数据里的条款都是真实存在的，模型学到了\"总要找出几条\"。修法：训练集里加入 15% 的\"无风险\"样本，并把\"不确定就不输出\"写进标注规范。**这是微调最典型的副作用与解法。**\n\n**关联 AWS 服务**：Amazon Bedrock 自定义模型（Fine-tuning / Continued Pre-training / Distillation）、Amazon SageMaker AI（自管训练时的等价能力）。\n\n#### 模型、算法与方案模板选型\n\n**定义**：这一条考的是\"在给定业务指标下，选哪种建模形态\"。它比基础模型选型（2.1.1）更宽——不只选 FM，还包括传统 ML 算法与 AWS 提供的方案模板。\n\n**四种建模形态的适用边界**\n\n| 形态 | 什么时候是正确答案 | 什么时候是错的 |\n|---|---|---|\n| **托管 AI 服务**（Textract/Rekognition/Comprehend/Transcribe/Forecast） | 任务属于\"标准能力\"：OCR、人脸、情绪、语音转写、时序预测 | 需要业务特有的判断口径 |\n| **传统 ML**（XGBoost、线性模型、时序、推荐） | 结构化表格数据、需要可解释、样本量万级、要求毫秒级 | 非结构化输入为主（图、文、音） |\n| **FM 直接调用** | 语言理解/生成、非结构化输入、少样本可用 | 需要严格数值计算、需要确定性输出 |\n| **自训/微调** | 有专有数据且行为需要固化 | 数据少、需求还在变 |\n\n**可解释性这条约束要单独说**：题干出现\"必须能向监管解释每个决策依据\"时，答案指向传统 ML（XGBoost + SageMaker Clarify 做特征归因）或规则模型，而不是 FM。FM 的输出解释不是决策依据。**这是金融、医疗、信贷场景的高频考点。**\n\n**延迟这条约束**：要求 P99 在 100ms 内、每秒数千请求时，通常指向传统 ML 的小模型 + 专用推理实例，而不是 FM。FM 的延迟受输出长度线性影响，长输出场景无法满足硬延迟约束。\n\n**方案模板（Solution Templates / 行业方案）的价值与陷阱**\n\nAWS 提供了一批开箱方案（如智能文档处理、个性化推荐、需求预测）。它们的价值是把\"架构已定、参数可调\"的部分直接给你；陷阱是**它们是起点不是终点**——考试里出现模板类选项时，只有当题干强调\"需要快速验证可行性/缺乏 ML 团队\"时才是最佳答案。\n\n**教学案例（虚构示意）**：一个费用报销审核场景，要求：识别发票金额与日期、判断是否符合报销政策、异常项给出理由、必须能审计。拆解后是三个不同技术：\n- 发票字段 → Textract（托管 AI 服务，不做自训）\n- 政策符合性 → 规则引擎 + 小模型（可解释，政策本身是条文）\n- 异常说明生成 → FM（生成自然语言解释）\n把三件事塞给一个模型是外行答法，也是本题的干扰项。\n\n**关联 AWS 服务**：Amazon Textract、Amazon Rekognition、Amazon Comprehend、Amazon Transcribe、Amazon Forecast、SageMaker AI 内置算法、SageMaker Clarify、AWS 行业方案模板。\n\n#### 自建、托管、预训练、FM 四路权衡\n\n**定义**：同一个业务问题，通常有四条路能走通。它们的差别不在\"能不能用\"，而在**前期投入、单位成本、可控性、迭代速度**四个方向上互有胜负。\n\n**四路的成本结构对比**\n\n| 路径 | 前期投入 | 单位推理成本 | 可控性 | 迭代速度 | 什么条件下必须选它 |\n|---|---|---|---|---|---|\n| 自建模型（从头训） | 最高（数据 + 算力 + 人） | 最低（可压到极小模型） | 最高（权重、结构全可控） | 最慢 | 有独家数据壁垒、模型本身是产品 |\n| 托管 AI 服务 | 低 | 中（按调用） | 低（只能调参） | 快 | 任务是标准能力、无差异化需求 |\n| 预训练模型（开源权重自托管） | 中（部署 + 运维） | 中（自付算力） | 中高（权重可改、可私有化） | 中 | 数据不能出 VPC、需要私有化部署 |\n| FM 托管调用（Bedrock） | 最低 | 按 token，长文本时偏高 | 低（受模型方约束） | 最快 | 需求还在探索、团队无 ML 能力 |\n\n**判断的第一问不是\"哪个好\"，而是\"数据和模型能不能出去\"**\n\n合规约束往往直接砍掉一半选项：数据不能出 VPC → 排除 SaaS 类托管 AI 服务与公网 FM 接口，转向自托管开源模型（SageMaker 或 Bedrock 的私有端点）；模型权重不能出境 → 只能自建或区域内托管。\n\n**第二问是\"这个能力是不是我们的差异化\"**\n\n- 是差异化（如独有的故障诊断模型）→ 倾向自建，因为托管服务无法形成壁垒\n- 不是差异化（如发票 OCR）→ 倾向托管，因为自建是纯成本\n\n**第三问是\"单位经济性在什么量级翻转\"**\n\n托管按调用计费，自建按算力计费。存在一个调用量阈值，超过后自建更便宜。做题时不需要精确数字，但要能说出方向：**低量选托管（避免固定成本），高量且稳定选自建（摊薄固定成本）**。这个逻辑和「按需 vs 预留实例」完全同构。\n\n**教学案例（虚构示意）**：一个日调用量 300 万次的文本分类任务。初期用 FM 托管调用，月成本随量线性上升；量稳定后改用自训的小型分类模型部署在 SageMaker 上，固定成本（实例）低于按量成本，且延迟从 400ms 降到 20ms。但团队保留了 FM 这条路，用于处理新出现的、样本不足的类目——**混合架构才是真实答案，题目里出现\"全部改成自建\"通常是错的。**\n\n**关联 AWS 服务**：Amazon SageMaker AI（训练与托管）、Amazon Bedrock（托管 FM）、Amazon Bedrock 自定义模型、AWS Marketplace（第三方模型）。\n\n#### 选择 RAG 架构模式\n\n**定义**：RAG 是\"检索到的证据 + 模型生成\"的组合。它的价值有两层——给模型提供它训练时没有的**事实**，以及给输出提供**可溯源的出处**。第二层在企业和合规场景里往往比第一层更重要。\n\n**RAG 与微调的分界线（这一条几乎每场考试都考）**\n\n| 判断项 | 指向 RAG | 指向微调 |\n|---|---|---|\n| 知识是否频繁变化 | 是（价格、政策、库存） | 否（口径、风格稳定） |\n| 是否需要引用出处 | 是 | 不要求 |\n| 是否有大量未标注文档 | 是 | 需要标注对 |\n| 问题是\"不知道事实\" | 是 | 否 |\n| 问题是\"说话方式不对/格式不遵循\" | 否 | 是 |\n| 是否有权限隔离要求（不同人看不同文档） | 是（检索层做过滤） | 微调做不到按用户隔离 |\n\n**最后一行是高频陷阱**：微调把知识烧进权重，所有人共享同一套知识，无法做\"这张合同只有法务能看\"。**只要有行级权限，答案只能是 RAG + 检索时过滤。**\n\n**四种 RAG 架构模式**\n\n| 模式 | 构成 | 适用 | 代价 |\n|---|---|---|---|\n| **全托管 RAG** | Bedrock Knowledge Bases（自动分块、向量化、检索、生成） | 快速上线、无专门检索团队 | 分块与检索策略可调空间小 |\n| **自建 RAG** | 自选向量库（OpenSearch / Aurora pgvector / Neptune）+ 自写编排 | 需要精细控制分块、混合检索、重排 | 要自己维护索引与管道 |\n| **GraphRAG** | 知识图谱（Neptune Analytics）+ 图检索 | 多跳关系推理（\"这家公司的母公司还投了谁\"） | 构图与更新成本高 |\n| **结构化数据 RAG** | 自然语言 → SQL/查询 → 结果回填 | 问的是数据库里的统计与明细 | 需要 schema 理解与查询校验 |\n\n**五种架构选择信号（题干里找这几个词）**\n\n1. \"快速上线 / 两周内出原型\" → 全托管\n2. \"召回率不达标 / 需要混合检索（关键词 + 向量）\" → 自建\n3. \"跨文档多跳推理 / 实体关系\" → GraphRAG\n4. \"问的是销售额、库存、订单\" → 结构化数据检索，不要用向量库\n5. \"不同用户只能看自己部门文档\" → 任意模式 + 检索时元数据过滤（**这是必要项不是可选项**）\n\n**分块策略的取舍（答 RAG 题绕不开）**\n\n| 策略 | 优点 | 缺点 |\n|---|---|---|\n| 固定长度（如 512 token） | 实现简单、块大小可控 | 会切断语义边界 |\n| 语义/段落分块 | 保留完整语义 | 块大小不均，超长段落需二次切 |\n| 层级分块（父块检索、子块喂模型） | 检索精度与上下文完整兼得 | 实现复杂、存储翻倍 |\n| 带重叠（overlap 10–20%） | 缓解边界信息丢失 | 冗余、成本上升 |\n\n**默认起点**：按文档结构（标题层级）分块 + 10–20% 重叠，块大小控制在 300–800 token；命中后取父块或相邻块作为上下文。\n\n**教学案例（虚构示意）**：某企业知识助手，文档 1.2 万份，用户按部门隔离。初期用固定 512 token 分块 + 纯向量检索，答\"某个流程需要谁审批\"时召回率只有 62%。原因：\"审批人\"这个词在文档里写作\"分管副总\"，向量相似度不够。改法三件：① 混合检索（BM25 关键词 + 向量，权重各半）② 分块改为按标题层级 ③ 检索时强制注入部门过滤条件。召回率到 89%。\n\n**关联 AWS 服务**：Amazon Bedrock Knowledge Bases、Amazon OpenSearch Service（向量引擎）、Amazon Aurora（pgvector）、Amazon Neptune Analytics、Amazon Kendra。\n\n#### 性能、训练时长与成本三角权衡\n\n**定义**：训练阶段的三个量彼此拉扯。想要更好的效果，通常要更大的模型或更多的数据（成本上升），或更长的训练（时长上升）。**这个三角的实操意义是：任何\"三个都要\"的方案都是错的。**\n\n**三个量各自的调节手段**\n\n| 想改善 | 手段 | 副作用 |\n|---|---|---|\n| 性能（准确率） | 更大模型、更多数据、更长训练、集成 | 成本上升、时长上升、过拟合风险 |\n| 缩短训练时长 | 分布式训练、混合精度、更小模型、早停 | 可能掉点；分布式有通信开销 |\n| 降成本 | Spot 实例、更小实例、减数据量、早停 | 中断风险；掉点 |\n\n**分布式的收益不是线性的（这条常作为判断依据）**\n\n数据并行时，加速比受通信开销与同步频率制约。8 卡通常能到 6–7 倍，到几十卡后曲线明显变平。**题干说\"把实例数从 8 加到 64 期望快 8 倍\"就是错误预期**。正确答法是先看瓶颈：GPU 利用率低，说明是数据供给瓶颈，该改输入管道；利用率高但扩展慢，说明是通信瓶颈，该改并行策略或增大 batch。\n\n**早停是三角里性价比最高的手段**：验证损失连续若干轮不降就停，等于用\"可能少训一点\"换取\"确定省下后面所有轮次\"。它同时改善成本和过拟合。\n\n**训练成本的三项构成**\n\n1. **算力时长**：实例数 × 时长 × 单价。最大项。\n2. **数据搬运**：跨区域传输、重复读取。常被忽略，小文件场景下很可观。\n3. **调参与返工**：跑 50 组超参 = 50 倍成本。这是 HPO 必须设上限的原因。\n\n**教学案例（虚构示意）**：一个视觉质检模型，训练一次 14 小时、成本约 900 元。业务要求每周重训。团队想缩短到 4 小时。第一步，把批次大小翻倍 + 学习率同比放大，3 轮后收敛质量与原方案相当，时长降到 7 小时。第二步，把数据管道从逐文件读取改为分片预取，降到 5 小时。剩余差距用 Spot 实例承担，中断后从 checkpoint 续训。三个动作叠加，成本降到原来的 45%，**没有换模型、没有减数据**。\n\n**关联 AWS 服务**：SageMaker AI 分布式训练（数据并行/模型并行）、SageMaker Experiments（对比不同配置的代价）、SageMaker Managed Spot Training（含 checkpoint 续训）、SageMaker 自动模型调优。\n\n#### 性能、时延与成本三角权衡（推理阶段）\n\n**定义**：推理阶段的三角与训练阶段不同——训练可以慢，推理不能慢。所以这里的核心矛盾是**时延与成本**，性能（质量）通常由模型档位决定，一旦选定就不再是可调变量。\n\n**时延的四个来源（定位问题必须分清）**\n\n| 来源 | 典型量级 | 降低手段 |\n|---|---|---|\n| 排队/冷启动 | 秒级（无预置容量时） | 预置吞吐、最小实例数、预热 |\n| 输入处理（长 prompt） | 与输入长度近似线性 | 缩短 prompt、RAG 只喂相关块、prompt 缓存 |\n| 生成（输出 token 数） | 与输出长度线性，主导项 | 限制输出长度、流式返回首字、用小模型 |\n| 网络与串接 | 数十至数百毫秒 | 同区域部署、减少 Agent 往返轮次 |\n\n**\"首字时延\"与\"总时延\"要分开谈**。流式输出不降低总时长。它把首字时延从\"总时长\"降到\"预填充时间\"，用户感知差别巨大。题干出现\"用户抱怨等待久但实际总时长可接受\"→ 答案是流式输出。\n\n**成本的三条杠杆（按性价比排序）**\n\n1. **路由分层**（完整账见基础模型选型的分层路由案例，2.1.1）：把简单请求给轻量模型，是降本幅度最大的一招，通常 3–6 倍。\n2. **控制输入长度**：RAG 只喂 top-k 相关块而不是整篇文档；避免把整段对话历史每次都带上（用摘要替代）。\n3. **缓存**：相同或高度相似的请求复用结果（prompt caching 或应用层缓存）。高频重复问题场景下命中率能到 30% 以上。\n\n**Provisioned Throughput 的正确定位**\n\n它是**买断吞吐**：适合流量稳定且高、且需要延迟可预期的场景。它不是\"让单次推理变快\"的开关。流量波动大时买断会浪费（闲置也要付），这时按需 + 分层路由更划算。**题干说\"流量波动剧烈、要求成本最优\"时选预置吞吐就是错的。**\n\n**教学案例（虚构示意）**：一个合同摘要服务，平均 4000 token 输入、800 token 输出，用户投诉\"点了要等 12 秒\"。拆解时延：排队 1.5 秒（无预置）、输入处理 4 秒（整份合同塞进去）、生成 6 秒（输出长）、网络 0.5 秒。三项改动：\n1. 开流式输出，用户 1.5 秒看到第一个字\n2. 先做章节定位再只摘要相关章节，输入降到 1200 token\n3. 输出长度上限设为 400 token，并分两段生成\n\n总时长降到 4.2 秒，单次成本降 62%。\n\n**关联 AWS 服务**：Amazon Bedrock（流式响应、Provisioned Throughput、prompt caching）、SageMaker AI 异步推理与 Serverless 推理、Amazon CloudWatch（时延分解观测）。\n\n#### 用 AWS AI 托管服务解决具体业务问题\n\n**定义**：AWS 有一批\"任务已定、无需训练\"的 AI 服务。它们的正确用法是**把一个业务问题拆成若干标准能力**，而不是找一个服务包打天下。\n\n**核心服务与能力边界**\n\n| 服务 | 做什么 | 不能做什么 |\n|---|---|---|\n| Amazon Textract | 文档文字/表格/表单/签名/查询式抽取 | 不理解条款法律含义 |\n| Amazon Rekognition | 图像/视频中的对象、人脸、文字、内容审核 | 不做细粒度工业缺陷判定（需自训） |\n| Amazon Comprehend | 实体、情感、关键词、语言识别、PII 检测、自定义分类 | 不做复杂推理 |\n| Amazon Transcribe | 语音转文字（含说话人分离、自定义词表） | 不做语义理解 |\n| Amazon Translate | 批量/实时翻译 | 不做领域术语一致性保证（需自定义术语表） |\n| Amazon Polly | 文本转语音 | 不做情感对话 |\n| Amazon Forecast / Amazon Personalize | 时序预测 / 个性化推荐 | 需要业务侧提供充分历史数据 |\n\n**选择托管服务还是自训，看三个信号**\n\n1. **任务是否是行业标准任务**：OCR、人脸、语音、翻译都是标准任务，自训是浪费。\n2. **是否有标注数据**：没有标注数据就没有自训的资格，托管服务是唯一现实选项。\n3. **误差容忍度**：托管服务有固定的能力上限，如果业务要求\"缺陷检出率 99.5%\"，通常必须自训——因为通用模型没见过你的缺陷形态。\n\n**组合使用的典型形态（考试常以架构题出现）**\n\n```\n扫描件合同\n  → Textract 抽文字与表格\n  → Comprehend 识别实体（甲乙方、金额、日期）与 PII\n  → 业务规则引擎校验（金额阈值、条款必备项）\n  → Bedrock FM 生成自然语言的风险说明\n  → 结果写入数据库 + 原文出处留痕\n```\n\n这条链里每一步都在做自己最擅长的那件事。**没有任何一步是\"让大模型看整张图然后回答一切\"**。后者是外行方案，也是考试里的典型干扰项：延迟高、成本高、无法审计、幻觉不可控。\n\n**教学案例（虚构示意）**：一个客服质检场景，需要从通话录音里找出\"未按话术致歉\"的会话。拆解：Transcribe 转写（开说话人分离 + 自定义词表加产品名）→ Comprehend 做情感与关键短语 → 规则匹配致歉话术 → 仅对疑似违规的 8% 会话调 FM 复核。全量调 FM 的成本是这套方案的 20 倍以上，且无法解释判定依据。\n\n**关联 AWS 服务**：上述六个服务 + Amazon Comprehend Medical（医疗实体）、Amazon HealthLake、Amazon Augmented AI（A2I，人审回流）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 拿微调解决知识新鲜度问题 | 价格、政策、库存这类会变的事实，微调烧进权重后无法更新也无法溯源；答案永远是选 RAG 架构模式（2.1.5） |\n| 2 | 有行级权限要求还选微调 | 微调做不到\"这张合同只有法务能看\"，权限隔离必须在检索层做过滤 |\n| 3 | 把方案模板当终点 | 开箱方案是起点，只有题干强调\"快速验证/缺 ML 团队\"时它才是最佳答案（模型/算法/方案模板选型，2.1.3） |\n| 4 | 用预置吞吐给单次推理提速 | 它是买断吞吐，不是加速开关；流量波动大时选它反而浪费（性能、时延与成本三角权衡，2.1.7） |\n| 5 | \"全部改成自建\" | 混合架构才是真实答案——稳定大批量走自建，新类目、样本不足的类目保留 FM 路径（2.1.4） |\n\n#### 记忆要点\n\n1. **选型第一问永远是合规**：数据能不能出 VPC，直接砍掉一半选项。\n2. **微调改行为，RAG 给事实**：知识会变、要溯源、要权限隔离，三条中一条就选 RAG。\n3. **训练三角没有\"三个都要\"**：性价比最高的单一手段是早停。\n4. **推理时延的主导项是输出 token 数**：降本性价比排序，路由分层 > 控制输入 > 缓存。\n5. **托管服务解题的姿势是拆能力**：把业务拆成标准能力，不是找一个服务包打天下。\n\n---"},{"h":"训练、微调与定制（Train, fine-tune, and customize models for ML and AI solutions.）","body":"#### 这一节学什么\n这一节对应考纲任务 2.2「训练、微调与定制（Train, fine-tune, and customize models for ML and AI solutions.）」。\n\n> 官方原名：Train, fine-tune, and customize models for ML and AI solutions.\n> 技能点 9 条｜C02 新增 2 条｜可复用 2 条\n\n这一任务的前提是 2.1 已经判定\"必须自己动手\"。它考的是工程细节：算法选哪个、代码怎么进来、超参怎么找、怎么训得快、怎么不训坏、怎么把多个模型合起来用、以及 FM 时代的三档定制手段。\n\n| 编号 | 官方技能点（英文原文） | 中文速记 |\n|---|---|---|\n| 2.2.1 | Apply Amazon SageMaker AI built-in algorithms and common ML libraries. | SageMaker 内置算法与常用库 |\n| 2.2.2 | Configure SageMaker AI for custom training (for example, script mode, bring your own container). | script mode 与自带容器配置 |\n| 2.2.3 | Implement hyperparameter tuning by using SageMaker AI automatic model tuning. | 自动模型调优（AMT） |\n| 2.2.4 | Implement training optimizations (for example, early stopping, distributed training). | 训练加速与早停 |\n| 2.2.5 | Troubleshoot model training issues (for example, overfitting, underfitting, catastrophic forgetting). | 过拟合/欠拟合/灾难性遗忘 |\n| 2.2.6 | Use ensemble methods to combine models. | 多模型集成 |\n| 2.2.7 | Tune hyperparameters for model performance. | 基础超参调整 |\n| 2.2.8 | Customize FMs by using techniques such as prompt engineering, fine-tuning, and continued pre-training. | 提示工程/微调/持续预训练三档定制 |\n| 2.2.9 | Optimize retrieval components and embeddings for RAG. | 检索组件与 embedding 优化 |\n\n#### SageMaker AI 内置算法与常用库\n\n**定义**：SageMaker 提供两类训练入口——**内置算法**（容器已封装，只给数据和超参就能跑）和**框架容器**（自带 TensorFlow/PyTorch/sklearn/Hugging Face 环境的容器，你写代码进去跑）。\n\n**内置算法按问题类型分**\n\n| 问题类型 | 算法 | 适用与边界 |\n|---|---|---|\n| 表格分类/回归 | XGBoost、Linear Learner | 结构化数据的默认首选；XGBoost 在中等数据量上极强 |\n| 表格异常/聚类 | Random Cut Forest、K-Means | 时序异常检测 / 客户分群 |\n| 时序预测 | DeepAR、Prophet | 多条相关序列一起预测时 DeepAR 更好 |\n| 文本 | BlazingText（词向量/分类） | 现在多数场景已被 FM 替代，仍用于轻量分类 |\n| 图像 | Image Classification、Object Detection、Semantic Segmentation | 迁移学习快，精度要求高时仍需自训现代检测器 |\n| 推荐 | Factorization Machines | 稀疏特征场景；深度推荐通常自写 |\n| 降维 | PCA | 特征压缩、可视化 |\n\n**什么时候内置算法是正确答案**\n\n1. 数据是结构化表格、目标是分类或回归 → XGBoost 几乎是默认答案\n2. 需要快速建立 baseline、判断\"这个数据能不能学出来\" → 内置算法最快\n3. 团队没有深度学习经验 → 内置算法不要求写训练循环\n\n**什么时候不该用**\n\n- 需要自定义损失函数、自定义网络结构 → 用框架容器\n- 输入是多模态、需要现代 Transformer 架构 → 用 Hugging Face 容器\n- 数据量小到线性模型就够 → 直接 scikit-learn 容器，别上 XGBoost\n\n**常用框架容器的分工**\n\n| 容器 | 何时用 |\n|---|---|\n| Scikit-learn | 传统 ML、特征处理管道、小数据 |\n| XGBoost / LightGBM | 表格数据的主力 |\n| PyTorch | 自定义网络、研究型模型 |\n| TensorFlow | 既有 TF 资产 |\n| Hugging Face | 预训练 Transformer 微调，**FM 微调的主力** |\n\n**教学案例（虚构示意）**：某零售企业要做门店日销售额预测，有 3 年历史、200 家门店、含促销日历。第一步用 DeepAR 跑 baseline（多条序列一起学，能利用门店间相关性），MAPE 12%。业务要求做到 8% 以内，追加特征（天气、商圈人流）后仍不达标。改法：XGBoost + 人工特征（滞后 7 天销量、促销标记、节假日距离天数），MAPE 降到 7.4%。**结论不是\"深度模型不如树模型\"，而是\"特征工程比换算法更能提升表格数据的效果\"。**\n\n**关联 AWS 服务**：SageMaker AI 内置算法容器、SageMaker 框架容器（预装 CUDA 与常用库）、SageMaker JumpStart（预训练模型一键部署）。\n\n#### script mode 与自带容器\n\n**定义**：script mode 是\"用 SageMaker 管好的框架容器，但跑你自己的脚本\"；bring your own container（BYOC）是\"连容器也自己带\"。两者的选择取决于依赖复杂度。\n\n**三种自定义程度的对比**\n\n| 模式 | 你提供 | SageMaker 提供 | 适用 |\n|---|---|---|---|\n| 内置算法 | 数据 + 超参 | 全部 | 标准任务 |\n| **script mode** | 一个训练脚本（约定入口函数） | 框架容器、依赖、分布式环境变量 | 绝大多数自定义模型 |\n| BYOC | Dockerfile + 推理服务代码 | 只提供运行环境与调度 | 特殊依赖（私有库、特定 CUDA、非 Python 服务） |\n\n**script mode 的四个约定（记错就跑不起来）**\n\n1. **入口脚本位置**：放在 `source_dir` 里，通过 `entry_point` 指定文件名\n2. **环境变量传参**：超参通过 `hyperparameters` 传入，脚本里从环境变量读取（SageMaker 会转成 `SM_HP_*`）\n3. **模型输出路径**：训练结束必须写到 `SM_MODEL_DIR`，否则部署时找不到模型\n4. **数据路径**：训练/验证/测试数据分别通过 `SM_CHANNEL_TRAIN` / `SM_CHANNEL_VALIDATION` 等环境变量给出，**不要硬编码 S3 路径**\n\n**分布式训练的环境变量（脚本要自己读）**\n\n| 变量 | 含义 |\n|---|---|\n| `SM_HOSTS` | 所有节点的主机名列表 |\n| `SM_CURRENT_HOST` | 当前节点主机名 |\n| `SM_NUM_GPUS` | 本机 GPU 数 |\n| `MASTER_ADDR` / `MASTER_PORT` | 分布式通信入口 |\n\n**常见失败模式与定位**\n\n| 现象 | 原因 | 处理 |\n|---|---|---|\n| 训练开始即退出，日志无输出 | 入口函数名不对 / 脚本路径错 | 检查 `entry_point` 与文件位置 |\n| 找不到依赖 | script mode 容器里没装 | 用 `requirements.txt` 或换 BYOC |\n| 训练成功但部署失败 | 模型没写到 `SM_MODEL_DIR` | 检查保存路径 |\n| 多机训练卡住 | 通信端口/网卡配置 | 用 SageMaker 分布式库而非手写初始化 |\n\n**教学案例（虚构示意）**：一个团队把本地 notebook 搬上 SageMaker，训练任务 30 秒就结束、日志只有一行报错。原因是他们直接把 notebook 内容粘成脚本，入口是 `if __name__ == '__main__'` 之后的顺序代码，而 SageMaker 要求提供明确的训练函数并在脚本末尾调用。改成标准入口 + 从 `SM_CHANNEL_TRAIN` 读路径 + 写 `SM_MODEL_DIR` 后一次通过。**这是 script mode 最高频的踩坑点。**\n\n**关联 AWS 服务**：SageMaker AI Training（script mode、BYOC、本地模式）、Amazon ECR（镜像仓库）、SageMaker 分布式训练库。\n\n#### 自动模型调优（AMT）\n\n**定义**：超参搜索的自动化。它的价值不是\"找到最优超参\"，而是**在有限预算下找到足够好的超参，并且不占用人力**。\n\n**三种搜索策略**\n\n| 策略 | 机制 | 适用 |\n|---|---|---|\n| 网格搜索 | 穷举所有组合 | 超参少（≤3 个）且每个取值少 |\n| 随机搜索 | 随机采样 | 超参多、维度高（实践中常优于网格） |\n| 贝叶斯优化 | 用历史结果建模，选择下一个最有希望的组合 | **SageMaker AMT 的默认策略**，预算有限时最优 |\n\n**AMT 的四个必设参数**\n\n| 参数 | 含义 | 设置要点 |\n|---|---|---|\n| 目标指标 | 优化什么 | 必须与业务目标一致；分类不平衡时用 F1 而非 accuracy |\n| 搜索空间 | 每个超参的类型与范围 | 连续型给范围（不要枚举），类别型给列表 |\n| 最大作业数 | 总共跑多少次 | 成本上限，直接决定账单 |\n| 最大并行作业数 | 同时跑几个 | 受配额限制；并行度高会降低贝叶斯优化的效率 |\n\n**早停（early stopping）在调优中的作用**：训练中途评估，明显劣于当前最优的试验直接终止。它能把调优成本降低 30–60%，但设错会误杀——如果指标在训练后期才改善（如学习率衰减后），早停会把好试验砍掉。\n\n**搜索空间的设置纪律**\n\n- 学习率用对数尺度（1e-5 到 1e-1），不要线性\n- 树模型的 `max_depth` 用整数范围，不要枚举十几个值\n- batch size 通常固定，不参与搜索（它与学习率耦合，一起搜会互相干扰）\n- **超参数量控制在 5 个以内**，超过后搜索空间爆炸、每个组合的样本不足\n\n**教学案例（虚构示意）**：一个 XGBoost 模型手工调参准确率 0.81，团队想上 0.85。AMT 设 5 个超参、60 个作业、4 并行、目标 `validation:auc`、早停开启。结果 AUC 从 0.862 提到 0.889，但业务指标（召回率）只从 0.74 到 0.755——**因为优化目标选的是 AUC 而不是业务关心的召回率**。改成目标 = `validation:f1` 重跑，召回率到 0.81，AUC 略降。**这就是\"优化目标必须与业务指标对齐\"的实证。**\n\n**关联 AWS 服务**：SageMaker AI 自动模型调优（AMT）、SageMaker Experiments（记录每次试验）、SageMaker 超参搜索的 warm start（从上次结果继续搜）。\n\n#### 训练加速与早停\n\n**定义**：加速有两类手段——**让它算得更快**（分布式、混合精度、编译优化）和**让它早点停**（早停）。前者改变单轮成本，后者改变轮数。\n\n**早停的判断逻辑**\n\n监控验证集指标，连续 `patience` 轮无改善即停，并回滚到最佳轮次的权重。\n\n| 设置项 | 常见值 | 设错的后果 |\n|---|---|---|\n| 监控指标 | 验证损失或业务指标 | 监控训练损失 → 永远不会触发（训练损失几乎总在降） |\n| patience | 3–10 轮 | 太小 → 过早停止；太大 → 省不下成本 |\n| 最小改善阈值 | 0.001 量级 | 不设 → 噪声波动也算改善，早停失效 |\n\n**分布式训练的两种并行与选择**\n\n| 并行方式 | 切分什么 | 适用 | 瓶颈 |\n|---|---|---|---|\n| 数据并行 | 切分数据，每卡一份完整模型 | 模型能装进单卡显存 | 梯度同步通信 |\n| 模型并行（张量/流水线） | 切分模型层 | 单卡装不下模型 | 卡间通信，实现复杂 |\n\n**加速比的经验规律**：8 卡数据并行通常到 6–7 倍；几十卡后收益递减明显。**判断瓶颈的方法**：GPU 利用率低（<60%）→ 数据供给不足，改输入管道（分片、预取、增加 worker）；GPU 利用率高但扩展差 → 通信瓶颈，改并行策略或增大单卡 batch。\n\n**混合精度（FP16/BF16）**：显存占用减半、吞吐提升，通常不掉点。BF16 比 FP16 数值稳定性好，现代 GPU 优先 BF16。**这是最省事的一档加速。**\n\n**梯度累积**：显存不够时模拟大 batch——累积 N 个小 batch 的梯度再更新一次。代价是单步变慢，收益是能上更大的等效 batch。**注意：它不是加速手段，是\"装得下\"的手段**，考试里常被误选为加速答案。\n\n**教学案例（虚构示意）**：一个图像分割模型训练一次 22 小时。诊断发现 GPU 利用率只有 45%——数据加载是瓶颈（每张图现场做增强，CPU 打满）。改法：增强移到 GPU 侧（或用预生成缓存）、DataLoader worker 从 4 提到 16、改用分片格式读取。GPU 利用率到 88%，时长降到 13 小时。再叠 BF16，降到 9 小时。**没有加一张卡。**\n\n**关联 AWS 服务**：SageMaker AI 分布式训练（数据并行/模型并行库）、SageMaker Managed Spot Training（配合 checkpoint）、SageMaker Training Compiler（图优化与算子融合）。\n\n#### 过拟合、欠拟合与灾难性遗忘的排查\n\n**定义**：三种训练病，症状相似但病因相反——过拟合是\"学得太死\"，欠拟合是\"没学到\"，灾难性遗忘是\"学了新的忘了旧的\"。**先分病症再开药，这是本节的唯一重点。**\n\n**三病的判别表**\n\n| 病症 | 训练集表现 | 验证集表现 | 根因 |\n|---|---|---|---|\n| 过拟合 | 很好（接近 100%） | 明显差、且差距随训练扩大 | 模型容量相对数据过大、训练过久、数据单一 |\n| 欠拟合 | 差 | 差（与训练集接近） | 模型容量不足、特征不足、学习率不当、训练不足 |\n| 灾难性遗忘 | 新任务好 | **新任务好、旧任务崩** | 在窄分布数据上继续训练，覆盖了原有权重 |\n\n**过拟合的六种处理（按性价比排序）**\n\n1. **加数据 / 数据增强**：最有效，尤其图像（裁剪、翻转、色彩抖动）与文本（同义改写、回译）\n2. **正则化**：L2 权重衰减、Dropout、标签平滑\n3. **早停**：见 训练加速与早停（2.2.4）\n4. **简化模型**：减层、减参、换更小的主干\n5. **交叉验证**：不是治疗手段，但是**诊断手段**——能确认是否真的过拟合\n6. **集成**：多模型平均能缓解，但成本高，属于最后手段\n\n**欠拟合的四种处理**\n\n1. 增加模型容量（层数、宽度、特征维度）\n2. 补特征（很多欠拟合是特征不够，不是模型不够）\n3. 调学习率（过高导致震荡不收敛，过低导致训不动）\n4. 延长训练 / 检查数据管道是否把标签搞错（**这条最容易被忽略，也最常见**）\n\n**灾难性遗忘的机制与缓解**\n\n机制：在新数据上做梯度更新时，权重会向新分布偏移，原先编码的能力被覆盖。FM 上尤其明显，因为参数承载了大量通用能力。\n\n| 缓解手段 | 做法 | 代价 |\n|---|---|---|\n| 混入通用数据 | 新领域数据 + 20–40% 通用数据一起训 | 需要准备通用数据集 |\n| 参数高效微调（PEFT/LoRA） | 只训练少量附加参数，原权重冻结 | 能力上限略低，但遗忘风险大幅下降 |\n| 更低学习率、更少轮次 | 减少权重偏移量 | 领域适应效果变弱 |\n| 正则约束（如 EWC） | 惩罚重要权重的变化 | 实现复杂、增加训练成本 |\n| 定期评估旧任务 | 建旧任务测试集，每轮回归 | 必须有旧任务基准 |\n\n**\"LoRA 是防遗忘的默认答案\"这条要记住**：它不改原权重，所以通用能力天然保住，且训练成本低。题干出现\"微调后通用能力下降、希望保留原能力\"→ 指向 PEFT/LoRA 或混入通用数据。\n\n**教学案例（虚构示意）**：某企业用内部工单数据微调一个 FM 做故障分类，新任务准确率 94%。上线一周后发现它回答通用问题（如\"帮我改一下这段代码\"）质量明显下降，且开始把不相关的问题也归到故障类。诊断：灾难性遗忘 + 过度拟合窄分布。修法：① 改用 LoRA 微调 ② 训练集混入 30% 通用指令数据 ③ 加一个\
