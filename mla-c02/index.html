** 分组监控四维度：新老客、地域、设备、业务线。3.3.4 的分层指标门禁（任一分组降超 5% 阻断）是它在流水线里的落位。","s":"自编·4.1.3"},{"id":"D4-013","d":4,"t":"single","q":"一个排序算法 A/B 实验第三天显示 B 组转化率高 6%，团队准备全量切换。多观察一周后发现 B 组回落到低于 A 组 2%。按教材，这揭示了什么？","o":[{"l":"A","t":"实验数据不可信，应放弃 A/B 测试"},{"l":"B","t":"新奇效应 + 周期性——新方案初期好、后期回落，实验时长必须覆盖完整业务周期（至少一周，含工作日与周末）"},{"l":"C","t":"第三天的 6% 应该立即锁定"},{"l":"D","t":"A/B 实验只需要跑 24 小时"}],"a":["B"],"e":"**正确答案：B。** 新奇效应与业务周期。\n\n**为什么对：** 教材四个必看监控项中的「新奇效应」：**新方案初期好、后期回落，需观察足够长的周期**；样本量与时长一节明确：**实验时长必须覆盖完整业务周期（至少一周，覆盖工作日与周末），否则会受周期性影响**。教学案例与本题主干一致：前三天高是「新奇效应 + 该周有促销」叠加，第二周回落且护栏（首屏加载 +400ms）也劣化——如果按三天数据决策，会切错版本。\n\n**其他选项为什么错：**\n- A. 数据不可信的根源是观测窗口太短，方法本身没问题。\n- C. 把早期峰值「锁定」正是错误决策。\n- D. 24 小时既不覆盖周期也不足以积累样本。\n\n**关键概念：** 实验时长两要素：覆盖完整业务周期（≥1 周）+ 样本量满足 MDE（想检测的提升越小需要样本越多）。","s":"自编·4.1.4"},{"id":"D4-014","d":4,"t":"single","q":"两个 A/B 实验：实验甲想检测 1% 的转化率提升，实验乙想检测 10% 的提升。按教材，两者的样本量关系是什么？","o":[{"l":"A","t":"两者需要的样本量相同"},{"l":"B","t":"检测 1% 提升需要的样本量远大于检测 10%——想检测的提升越小（MDE 越小），需要的样本量越大"},{"l":"C","t":"检测 1% 提升需要的样本更少"},{"l":"D","t":"样本量与想检测的提升幅度无关"}],"a":["B"],"e":"**正确答案：B。** MDE 越小，样本量越大。\n\n**为什么对：** 教材「样本量与实验时长」：样本量取决于基线指标、**想检测的最小提升（MDE）**、显著性水平、统计功效（通常 80%）；并直接给出：**「想检测 1% 的提升」需要的样本量远大于「检测 10% 的提升」，这是很多实验「跑了三周没结论」的原因**。直觉：越小的差异越容易被噪声淹没，要区分它就需要更多样本。\n\n**其他选项为什么错：**\n- A、C. 方向判断错误，与统计常识相反。\n- D. MDE 正是样本量计算的四个输入之一。\n\n**关键概念：** 实验「没结论」的两大原因：样本量不足（MDE 定小了）或时长不覆盖业务周期。设计实验前先算样本量，别先开跑再补。","s":"自编·4.1.4"},{"id":"D4-016","d":4,"t":"single","q":"多 Agent 协作中出现两类特有失败：「A 交给 B、B 又交回 A」的循环，以及「都以为对方会做、结果没人做」。按教材，这两个信号分别叫什么，怎么检测？","o":[{"l":"A","t":"死锁与饿死；看 CPU 时间片"},{"l":"B","t":"乒乓与责任真空；乒乓看同一任务在两个 Agent 间的交接次数，责任真空看任务最终状态为「未完成」且无错误"},{"l":"C","t":"超卖与超时；看队列长度"},{"l":"D","t":"两者都是模型能力问题，换大模型即可"}],"a":["B"],"e":"**正确答案：B。** 乒乓与责任真空，各有专属检测信号。\n\n**为什么对：** 教材「多 Agent 协作失败的两个特有信号」：①**乒乓：A 交给 B，B 又交回 A，形成循环。检测：同一任务在两个 Agent 间的交接次数**；②**责任真空：都以为对方会做，结果没人做。检测：任务最终状态为「未完成」且无错误**。两者都不会产生报错，只能靠交接计数与终态审计发现。\n\n**其他选项为什么错：**\n- A. 死锁/饿死是操作系统概念，检测手段（CPU 片）不适用于 Agent 编排层。\n- C. 队列长度测的是积压，测不出「来回踢皮球」。\n- D. 换模型不解决协作协议缺失，这是编排与监控设计问题。\n\n**关键概念：** 协调失败的共同特征是「无错误但无进展」：监控要盯「进展性指标」（交接次数、无进展轮次），而不是只盯错误率。","s":"自编·4.1.5"},{"id":"D4-017","d":4,"t":"single","q":"一个客服 Agent 平均会话成本是预期的 3 倍。追踪发现 8% 的会话步数超过 30 步，模式都是「查订单 → 未找到 → 换个参数再查」。根因是订单号格式校验缺失，模型不断尝试不同格式。按教材的修法与效果，正确的组合是什么？","o":[{"l":"A","t":"换更大的模型，让它一次就查对"},{"l":"B","t":"禁止 Agent 查询订单"},{"l":"C","t":"工具增加格式校验并返回明确错误码 + 提示里说明「两次失败后必须转人工」；修后平均步数从 9.2 降到 4.1"},{"l":"D","t":"把最大步数设为 100，允许它慢慢试"}],"a":["C"],"e":"**正确答案：C。** 工具校验 + 明确错误码 + 升级人工规则。\n\n**为什么对：** 教材教学案例与本题主干逐字对应：根因是**订单号格式校验缺失**，模型不断尝试不同格式；修法＝**工具增加格式校验并返回明确错误码，提示里说明「两次失败后必须转人工」**；效果＝平均步数从 9.2 降到 4.1。这是「Agent 的可靠性主要靠工具设计」在监控侧的镜像：步数异常 → 追踪定位 → 修工具契约。\n\n**其他选项为什么错：**\n- A. 模型再强也受工具接口质量约束，格式不校验它只能盲试。\n- B. 因噎废食，核心功能丧失。\n- D. 步数上限放到 100 只是把烧钱合法化，成本问题依旧（3.2.11 的成本护栏要的是收紧不是放宽）。\n\n**关键概念：** 步数膨胀类故障的标准修法：给工具加输入校验与明确错误码（让失败「早死早超生」）+ 失败次数规则（转人工）。","s":"自编·4.1.5"}],"sections":[{"h":"推理与性能监控（Monitor ML and AI model inference and performance.）","body":"### 这一域考什么\n\nD4 占 24%，是四域里最\"运维化\"的一域。它不再问\"怎么建\"，而问：\n\n> **上线之后，你怎么知道它还好？坏了你怎么在两小时内定位？钱怎么会被悄悄烧掉？谁不该看的东西被谁看了？**\n\nC02 在这一域加了 9 条 GenAI 相关技能点，集中在监控与成本两侧。因为 FM 应用的成本结构与传统模型完全不同：按 token 计费、成本随输入长度波动、向量库持续计费，传统的\"看实例数\"完全不够。\n\n三条主线：\n\n1. **看得见**（任务 4.1）：模型效果、数据分布、Agent 行为、FM 专项指标。\n2. **省得下**（任务 4.2）：实例选型、容量、配额、token 与向量库成本。\n3. **守得住**（任务 4.3）：最小权限、网络隔离、审计、凭证、Guardrails。\n\n### 与 AIP-C01 / AIF-C01 的问法差别\n\n| 级别 | 主问题 | 典型题干 | 答案落点 |\n|---|---|---|---|\n| AIF-C01 | 有哪些安全措施 | \"以下哪项属于数据加密方式\" | 概念识别 |\n| AIP-C01 | 安全架构怎么设计 | \"设计一个满足合规的 RAG 架构\" | 分层方案 |\n| **MLA-C02** | **具体故障怎么定位、配什么告警、权限怎么收** | \"训练任务读取 S3 报 AccessDenied，如何定位并修复\" | **具体权限项 + 定位工具 + 修复动作** |\n\n### 学习主线（不按编号顺序）\n\n```\n4.1.3 漂移检测 · 4.1.2 异常监控  ← 先建立\"什么算不正常\"的判据\n      ↓\n4.1.1 GenAI 可观测 · 4.1.6 FM 专项  ← GenAI 的监控语言\n      ↓\n4.1.4 A/B 监控 · 4.1.5 Agent 监控  ← 实验与 Agent 的特殊性\n      ↓\n4.2.4 容量三目标 · 4.2.1 实例选型  ← 性能与成本的平衡点\n      ↓\n4.2.5 配额 · 4.2.6 购买选项 · 4.2.2/4.2.3 排障与看板  ← 成本管控的工具箱\n      ↓\n4.2.7–4.2.10 FM/Agent/token/向量库成本  ← GenAI 特有的四笔账\n      ↓\n4.3 全节  ← 安全放最后，因为它约束前面所有决策\n```\n\n### 常见失分点（真实考试口吻）\n\n1. **监控只看模型指标，不看数据与业务指标**。模型准确率没变但业务转化率降了，说明数据或客群变了。\n2. **把 Guardrails 当唯一的安全手段**。它管输出内容，不管权限、不管网络、不管凭证。\n3. **成本优化只想到\"换便宜实例\"**。FM 场景下最大的成本杠杆通常是输入长度与调用次数，不是实例单价。\n4. **权限给\"足够大以免出错\"**。ML 场景的权限蔓延极快（训练角色常被授予全桶读写），是审计最常见的扣分项。\n\n#### 这一节学什么\n这一节对应考纲任务 4.1「推理与性能监控（Monitor ML and AI model inference and performance.）」。\n\n> 官方原名：Monitor ML and AI model inference and performance.\n> 技能点 6 条｜C02 新增 2 条｜可复用 3 条\n\n| 编号 | 官方技能点（英文原文） | 中文速记 |\n|---|---|---|\n| 4.1.1 | Monitor model performance in production by using Amazon CloudWatch generative AI observability, Amazon Bedrock Model Evaluation, and drift detection pipelines. | GenAI 可观测、模型评估与漂移监控 |\n| 4.1.2 | Monitor workflows to detect anomalies or errors in data processing or model inference. | 工作流异常与错误监控 |\n| 4.1.3 | Detect changes in data distribution that can affect model performance. | 数据分布变化的漂移检测 |\n| 4.1.4 | Monitor model performance in production by using A/B testing. | A/B 测试监控 |\n| 4.1.5 | Monitor and automate the management of agent performance and coordination (for example, coordination failure detection, truncated streaming, tool failures). | Agent 性能与协调失败监控 |\n| 4.1.6 | Configure AI-specific performance monitoring for foundation models (FMs), such as Amazon Bedrock evaluations. | FM 专属性能监控 |\n\n这一任务把\"监控\"从\"看 CPU 和延迟\"扩展到\"看效果、看数据、看 Agent 行为\"。**学员最常卡在\"知道要监控漂移，但不知道该监控哪个分布、阈值怎么定\"。**\n\n#### GenAI 应用的可观测性、模型评估与漂移监控\n\n**定义**：传统监控看\"系统活不活\"，GenAI 可观测要看\"答得好不好\"。它需要把**一次调用的完整链路**记录下来：输入、检索到的上下文、模型输出、耗时、token 数、是否被拦截。\n\n**GenAI 可观测的五个层次**\n\n| 层次 | 看什么 | 工具特征 |\n|---|---|---|\n| 系统层 | 端点可用性、错误率、延迟 | CloudWatch 标准指标 |\n| 调用层 | 每次调用的输入输出、token 数、耗时分解 | 追踪（tracing）能力 |\n| 质量层 | 输出质量评分、忠实度、拒答率 | 评估流水线 + LLM 裁判 |\n| 行为层 | 工具调用、Agent 步骤、循环检测 | Agent 追踪 |\n| 业务层 | 用户采纳率、追问率、投诉率 | 业务埋点 |\n\n**质量监控为什么要\"抽样 + 持续\"**：不可能对每次调用都做 LLM 裁判（成本），通常是**每日抽 1–5% 或固定 200–500 条**评分，看趋势而不是看单条。\n\n**GenAI 漂移的三个来源（比传统 ML 多一个）**\n\n| 来源 | 表现 |\n|---|---|\n| 输入分布变化 | 用户开始问新类型的问题 |\n| 知识源变化 | 文档更新、知识库失效 |\n| **模型端变化** | 平台侧模型版本更新（你什么都没改，行为却变了）——这是 GenAI 特有的 |\n\n**第三类是 C02 的新考点**：托管 FM 的模型可能被供应商更新或退役。**应对：锁定模型版本（不用 `latest`）、订阅退役公告、建立\"模型行为回归集\"（一批固定问题，定期跑，看输出是否漂移）。**\n\n**关键指标清单（可直接用于设计监控方案）**\n\n| 指标 | 含义 | 异常信号 |\n|---|---|---|\n| 拒答率 | 模型拒绝回答的比例 | 突增=检索变差或提示变了；突降=可能在编造 |\n| 引用覆盖率 | 输出中有出处的论断占比 | 下降=忠实度风险 |\n| 平均输出长度 | 输出 token 数 | 突增=模型在啰嗦或复读 |\n| 重复率 | n-gram 重复比例 | 上升=退化征兆 |\n| 端到端延迟分解 | 检索/重排/生成各段耗时 | 定位瓶颈 |\n| 每次调用成本 | token 数 × 单价 | 突增=输入变长或调用次数增加 |\n\n**教学案例（虚构示意）**：一个法律问答应用，某天开始用户投诉\"答案变短了、不给条款出处\"。系统监控一切正常（延迟、错误率、可用性全绿）。调出调用日志发现：检索返回的块数从平均 5 块降到 2 块——因为知识库某次同步时部分文档解析失败被跳过。**结论：只看系统指标永远发现不了质量退化，必须监控检索层与质量层。**\n\n**关联 AWS 服务**：Amazon CloudWatch（指标与日志）、AWS X-Ray（调用链追踪）、Amazon Bedrock 模型调用日志、SageMaker Model Monitor、Amazon Bedrock 模型评估。\n\n#### 工作流异常与错误的监控\n\n**定义**：ML 系统的失败很少是\"服务挂了\"，更多是\"某一步悄悄没按预期执行\"——数据没到、特征为空、模型输出了默认值、下游没收到结果。**这类\"静默失败\"是监控的重点。**\n\n**五类必须监控的异常**\n\n| 类型 | 例子 | 检测手段 |\n|---|---|---|\n| 数据未到达 | 上游作业延迟，训练/推理读到空分区 | 数据新鲜度告警、行数下限校验 |\n| 特征为空 | 某特征全部为空，模型输出恒定 | 缺失率监控、输出分布突变 |\n| 输出异常 | 全量返回同一类别/恒定分数 | 预测分布熵监控 |\n| 下游失败 | 结果写入失败、消息未投递 | 端到端成功率、队列积压 |\n| 部分失败 | 批量作业 30% 分片失败但整体报成功 | 分片级成功率，不看作业级状态 |\n\n**\"作业成功但结果错\"是最危险的一类**：批处理作业返回 `Completed`，但某个分片因数据格式问题被跳过。**检测方式：核对输入行数与输出行数，差值超阈值即告警。**\n\n**端到端监控 vs 单点监控**：单点都绿但端到端失败，通常是因为\"连接处\"没人管（A 的输出格式变了，B 没报错地读了错误字段）。**对策：埋一个端到端的\"金丝雀请求\"——每分钟发一条已知答案的请求，验证整条链路。**\n\n**告警设计的三条纪律**\n\n| 纪律 | 原因 |\n|---|---|\n| 告警要有可执行动作 | 无法行动的告警等于噪声 |\n| 分级（P1 立即/P2 当日/P3 观察） | 避免所有告警同等紧急 |\n| 抑制与聚合 | 上游故障导致的连锁告警要合并，否则淹没真问题 |\n\n**教学案例（虚构示意）**：一个推荐服务连续三天推荐结果\"看起来正常\"，但转化率下降 18%。查日志发现特征服务某天起返回全零（上游 bug），模型对全零特征输出的是\"热门商品\"——结果看起来完全合理，只是变成了无个性化推荐。**如果没有\"特征缺失率\"监控，这种故障可以持续数周不被发现。**\n\n**关联 AWS 服务**：Amazon CloudWatch（自定义指标与告警、日志洞察）、Amazon EventBridge（事件驱动告警）、AWS Step Functions（工作流状态）、Amazon SNS（告警分发）。\n\n#### 数据分布变化的漂移检测\n\n**定义**：漂移是\"现在的数据和训练时不一样了\"。它比\"模型准确率下降\"更早出现，因此是**预警指标**而不是结果指标。\n\n**三种检测方法的适用**\n\n| 方法 | 机制 | 适用 | 局限 |\n|---|---|---|---|\n| 统计检验（KS、卡方） | 检验两个分布是否同分布 | 连续/类别特征 | 样本大时微小差异也显著 |\n| PSI（群体稳定性指数） | 分箱后比较占比差异 | 业务上最常用 | 需要定分箱 |\n| 距离度量（KL、JS、Wasserstein） | 分布距离 | 输出分布监控 | 不易解释 |\n\n**PSI 的读数（业务上最实用）**\n\n| PSI 值 | 含义 | 动作 |\n|---|---|---|\n| < 0.1 | 稳定 | 无需动作 |\n| 0.1–0.25 | 有变化 | 观察，排查原因 |\n| > 0.25 | 显著变化 | 告警，评估重训 |\n\n**\"PSI 高不一定是坏事\"这个判断很重要**：营销活动带来新客群、季节性变化都会推高 PSI，但模型可能仍然有效。**所以 PSI 告警的正确响应是\"查原因 + 看分组指标\"，而不是\"立即重训\"。**\n\n**分组监控比整体监控更有效**：整体指标平稳可能掩盖某一人群的严重退化（该人群占比小）。**做法：按关键维度（新老客、地域、设备、业务线）分组算指标，任一分组下降超阈值即告警。**\n\n**教学案例（虚构示意）**：一个信贷模型，整体 AUC 三个月稳定在 0.78，但业务方反馈\"通过的人逾期变多\"。分组分析发现：新客群（占比 15%）的 AUC 从 0.74 掉到 0.61，老客群稳定。原因是新客的行为特征更稀疏。**若只看整体指标，这个退化会一直被掩盖。**\n\n**关联 AWS 服务**：SageMaker AI Model Monitor（数据质量与模型质量基线）、CloudWatch（自定义 PSI 指标）、Amazon QuickSight（分组趋势看板）。\n\n#### A/B 测试的监控\n\n**定义**：A/B 测试的监控要比\"哪个组指标高\"多三件事——**分流是否真的随机、样本量够不够、差异是不是噪声**。\n\n**四个必看的监控项**\n\n| 项 | 为什么 |\n|---|---|\n| 分流均衡性 | 两组样本量、关键特征分布应接近；不均衡说明分流有偏 |\n| 指标差异与置信区间 | 看区间是否跨 0，而不是只看点估计 |\n| 新奇效应 | 新方案初期好、后期回落，需观察足够长的周期 |\n| 护栏指标 | 转化率上升但客诉率/延迟也上升 → 不可接受 |\n\n**\"护栏指标\"是高频考点**：主指标改善可能以牺牲其他指标为代价。**任何 A/B 设计都要同时声明主指标与护栏指标**，否则会出现\"实验成功、业务变差\"。\n\n**样本量与实验时长**\n\n样本量取决于：基线指标、想检测的最小提升（MDE）、显著性水平、统计功效（通常 80%）。**\"想检测 1% 的提升\"需要的样本量远大于\"检测 10% 的提升\"**，这是很多实验\"跑了三周没结论\"的原因。\n\n**实验时长必须覆盖完整业务周期**（至少一周，覆盖工作日与周末），否则会受周期性影响。\n\n**教学案例（虚构示意）**：一次排序算法 A/B 实验，第三天看板显示 B 组转化率高 6%，团队准备全量切换。加看一周后发现：B 组在前三天高（新奇效应 + 该周有促销），第二周回落到低于 A 组 2%。同时护栏指标显示 B 组的首屏加载时间增加 400ms。**如果按三天数据决策，会切错版本。**\n\n**关联 AWS 服务**：SageMaker AI 端点多变体（流量分配）、CloudWatch（分组指标）、Amazon QuickSight（实验看板）、SageMaker Clarify（分组公平性检查）。\n\n#### Agent 的性能与协作失败监控\n\n**定义**：Agent 的失败模式与传统服务不同——它不会报错，而是**\"绕远路\"或\"卡住\"**。监控要能看出\"它做了多少不必要的步骤\"和\"它在哪里反复尝试\"。\n\n**Agent 的五类失败模式（本节核心）**\n\n| 失败模式 | 表现 | 监控信号 |\n|---|---|---|\n| 工具误选 | 调了不相关的工具 | 工具调用分布偏离预期 |\n| 循环 | 反复调同一工具 | 单次会话工具调用次数、重复调用率 |\n| 过早放弃 | 该调工具却直接回答 | 工具调用率下降、答案缺少实际数据 |\n| 步骤膨胀 | 5 步能完成却用了 20 步 | 平均步数、token 消耗 |\n| 多 Agent 协调失败 | 任务在 Agent 间来回传递 | 交接次数、无进展轮次 |\n\n**\"步数\"是最好的单一指标**：它同时反映成本（每步一次模型调用）、质量（绕路说明决策混乱）、延迟（步数 × 单步耗时）。**设一个\"P95 步数\"告警，能抓住大部分 Agent 性能问题。**\n\n**追踪（tracing）的必要性**：Agent 一次会话可能有 20 次调用，必须能把它们串成一条链（含每步输入输出、耗时、结果），否则排障无从下手。\n\n**多 Agent 协作失败的两个特有信号**\n\n1. **乒乓**：A 交给 B，B 又交回 A，形成循环。检测：同一任务在两个 Agent 间的交接次数。\n2. **责任真空**：都以为对方会做，结果没人做。检测：任务最终状态为\"未完成\"且无错误。\n\n**教学案例（虚构示意）**：一个客服 Agent 上线后，平均会话成本是预期的 3 倍。追踪发现：8% 的会话步数超过 30 步，这些会话的模式都是\"查订单 → 未找到 → 换个参数再查 → 仍未找到 → 再换\"。根因是订单号格式校验缺失，模型不断尝试不同格式。修法：工具增加格式校验并返回明确错误码，提示里说明\"两次失败后必须转人工\"。平均步数从 9.2 降到 4.1。\n\n**关联 AWS 服务**：Amazon Bedrock Agents（调用追踪与日志）、AWS X-Ray（分布式追踪）、CloudWatch（自定义步数与循环指标）、Amazon Bedrock AgentCore（运行时观测）。\n\n#### FM 专属的性能监控\n\n**定义**：FM 的监控指标与传统模型不同——没有\"准确率\"这种即时可得的指标，只能看**代理指标**：延迟分解、token 吞吐、限流率、输出特征。\n\n**六个 FM 专属指标**\n\n| 指标 | 含义 | 异常含义 |\n|---|---|---|\n| 首 token 延迟（TTFT） | 从请求到第一个 token | 上升=输入变长或容量不足 |\n| 每 token 生成时长（TPOT） | 平均每输出 token 耗时 | 上升=模型负载高或换了大模型 |\n| 输入/输出 token 数 | 每次调用规模 | 突增=提示变长或注入 |\n| 限流率（Throttling） | 被限流的请求占比 | >0 即容量不足 |\n| 截断率 | 输出因达到 max_tokens 被截断 | 上升=输出没写完，答案不完整 |\n| 缓存命中率 | prompt cache 命中比例 | 下降=成本上升 |\n\n**\"截断率\"是 GenAI 特有的质量指标**：输出被 `max_tokens` 截断时，API 通常正常返回，但内容是半句话。**这属于\"报告成功但结果错\"，必须单独监控。**\n\n**延迟分解的价值**：TTFT 高 → 输入处理/排队问题（缩短输入、加容量）；TPOT 高 → 生成阶段问题（换小模型、减少输出）；两者都高 → 整体容量不足。\n\n**教学案例（虚构示意）**：一个合同摘要服务，用户投诉\"摘要经常不完整\"。系统指标全绿（成功率 99.9%、P99 延迟 3 秒）。加监控后发现截断率 12%——因为 `max_tokens` 设为 500，而 12% 的合同需要 600+ token 才能写完。修法：按文档长度动态设 `max_tokens`，并在输出末尾检测是否自然结束（句号/结束标记），未结束则续写。投诉消失。\n\n**关联 AWS 服务**：Amazon Bedrock（CloudWatch 集成指标、调用日志）、CloudWatch（自定义 TTFT/TPOT）、AWS X-Ray、Amazon Bedrock 预置吞吐利用率指标。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 只监控\"服务活不活\" | ML 的失败多为静默失败：数据没到、特征为空、输出默认值、下游没收到 |\n| 2 | 把漂移当结果指标 | 漂移比准确率下降更早出现，它是预警指标 |\n| 3 | A/B 只看哪组指标高 | 还要看分流是否真的随机、样本量够不够、差异是不是噪声 |\n| 4 | 把 Agent 失败等同于报错 | Agent 的失败是\"绕远路\"或\"卡住\"，不报错；要看步骤数与重试点 |\n| 5 | FM 指标照搬传统模型 | 没有即时准确率，只能看代理指标：延迟分解、token 吞吐、限流率 |\n\n#### 记忆要点\n\n1. **静默失败是监控重点**：五类异常按\"悄悄没按预期执行\"排查。\n2. **漂移是预警不是结果**：PSI 读数业务上最实用。\n3. **A/B 三问**：随机、样本量、噪声。\n4. **GenAI 可观测记完整链路**：输入、检索上下文、输出、耗时、token 数、是否被拦截。\n5. **FM 的六个专属指标**按代理指标理解，不找准确率。\n\n---"},{"h":"成本与性能优化（Optimize and manage ML and AI infrastructure costs and performance.）","body":"#### 这一节学什么\n这一节对应考纲任务 4.2「成本与性能优化（Optimize and manage ML and AI infrastructure costs and performance.）」。\n\n> 官方原名：Optimize and manage ML and AI infrastructure costs and performance.\n> 技能点 10 条｜C02 新增 4 条｜可复用 3 条\n\n| 编号 | 官方技能点（英文原文） | 中文速记 |\n|---|---|---|\n| 4.2.1 | Select inference instance families to optimize performance and cost. | 推理实例族选型 |\n| 4.2.2 | Configure and use tools to troubleshoot and analyze resources (for example, Amazon CloudWatch, Amazon Bedrock AgentCore Observability, AWS X-Ray). | 资源排障与可观测工具 |\n| 4.2.3 | Set up dashboards to monitor performance metrics. | 监控仪表盘搭建 |\n| 4.2.4 | Optimize capacity for cost, performance, and reliability. | 容量优化三目标 |\n| 4.2.5 | Optimize costs and set cost quotas by using appropriate cost management tools. | 成本配额与管控 |\n| 4.2.6 | Optimize infrastructure costs by selecting purchasing options. | 购买选项优化成本 |\n| 4.2.7 | Evaluate cost implications of using FMs for inference in production. | FM 推理成本影响评估 |\n| 4.2.8 | Monitor agent resource consumption patterns. | Agent 资源消耗监控 |\n| 4.2.9 | Manage FM inference costs with usage optimization. | FM 用量成本优化 |\n| 4.2.10 | Monitor AI-specific cost patterns (for example, token usage optimization, embedding computation costs, vector database storage optimization). | token/Embedding/向量库成本监控 |\n\n这一任务的判断都指向同一个问题：**你花的钱买到了什么**。ML 的成本优化难点在于\"贵的部分未必是显眼的部分\"——GPU 贵，但 token 和向量库可能在悄悄吃掉更多预算。\n\n#### 推理实例族的选型\n\n**定义**：选实例族不是\"选最贵的\"，而是\"让瓶颈资源和实例的强项对齐\"。**选错族的代价通常是 2–3 倍成本，而且延迟还更差。**\n\n**按瓶颈匹配（这是判断的唯一标准）**\n\n| 瓶颈 | 应选 | 典型误配 |\n|---|---|---|\n| 显存（大模型） | GPU 实例，按显存定档 | 选算力强但显存小的卡 |\n| 计算（视觉推理、批处理） | GPU 计算型 | 选显存大但算力弱的推理卡 |\n| 内存（大表 join、特征工程） | 内存优化型 | 选计算型导致 swap |\n| CPU（传统 ML、小模型） | 计算优化型 | 直接上 GPU（浪费 10 倍成本） |\n| 网络（分布式训练、大流量） | 高带宽 + EFA | 忽视网络导致多卡效率低 |\n\n**\"传统 ML 上 GPU\"是最常见的浪费**：XGBoost、逻辑回归、小规模 sklearn 推理在 CPU 上完全够用，GPU 带来的提升远小于成本差距。**题干出现\"用 GPU 实例部署一个 XGBoost 模型\"通常是错的。**\n\n**推理专用的优化点（比换族更有效）**\n\n| 手段 | 效果 |\n|---|---|\n| 量化（int8） | 显存减半，可降一档实例 |\n| 批处理（动态 batch） | 吞吐提升数倍 |\n| 模型编译/图优化 | 推理提速 10–30% |\n| 蒸馏到更小模型 | 数量级降本 |\n\n**看\"单位成本\"而不是\"实例单价\"**：一台 4 卡的实例单价高，但吞吐可能是单卡的 3.5 倍，单位请求成本反而更低。**衡量指标应该是\"每千次推理成本\"和\"每千次推理的 P99 延迟\"。**\n\n**教学案例（虚构示意）**：一个 BERT 类文本分类服务，部署在 GPU 实例上，利用率只有 12%。改为 CPU 计算优化型实例 + 量化后的 ONNX 模型，吞吐略降 15%（仍满足需求），成本降 82%。**结论：先问\"这个模型真的需要 GPU 吗\"，再问\"需要哪一档 GPU\"。**\n\n**关联 AWS 服务**：Amazon EC2 实例族（通用/计算/内存/GPU/推理专用）、SageMaker AI 实例类型、SageMaker Inference Recommender（自动测出最优实例与配置）。\n\n#### 资源问题的排障与可观测工具\n\n**定义**：排障的第一步是\"分清是资源不足还是配置错误\"。两者症状相似（都表现为慢或失败），但处理方式相反。\n\n**四类症状与判据**\n\n| 症状 | 资源不足 | 配置错误 |\n|---|---|---|\n| 延迟高且随流量线性上升 | ✅ 容量不够 | — |\n| 延迟高但与流量无关 | — | ✅ 批大小、超时、重试配置 |\n| 偶发超时（尾延迟） | ✅ 抢占、GC、冷启动 | ✅ 连接池耗尽 |\n| OOM | ✅ 显存/内存不够 | ✅ 泄漏、未释放中间张量 |\n\n**必须掌握的四个观测工具**\n\n| 工具 | 看什么 |\n|---|---|\n| CloudWatch 指标 | 端点调用数、延迟分位数、错误率、实例利用率 |\n| CloudWatch Logs Insights | 从日志里按条件查询（如\"找出耗时 > 5 秒的请求的共同特征\"） |\n| AWS X-Ray | 跨服务调用链，定位是哪一跳慢 |\n| SageMaker 容器日志 | 模型内部的推理耗时、批处理队列长度 |\n\n**分位数比均值有用**：均值延迟 200ms 看起来很好，但 P99 是 8 秒——那 1% 的用户体验是全损。**监控要用 P50/P90/P99，不用平均值。**\n\n**常见误判：把\"扩缩没生效\"当\"容量不够\"**。查三件事——① 是否达到最大实例数上限 ② 扩缩指标是否真的在变 ③ 扩容是否因配额不足失败（这最隐蔽，控制台只显示\"扩缩中\"）。\n\n**教学案例（虚构示意）**：一个端点每天上午出现延迟尖峰，团队连续加实例无效。查 CloudWatch 发现：实例数确实在涨，但 `ModelLatency` 同时也在涨——说明瓶颈不在实例数，而在单实例内部（批处理队列溢出）。实际原因是并发批大小设得过大，请求在容器内排队。调整批处理策略后，实例数回到原来的 1/3，延迟下降。\n\n**关联 AWS 服务**：Amazon CloudWatch（指标、日志洞察、告警）、AWS X-Ray、SageMaker AI 容器日志与 Profiler、AWS Trusted Advisor（配额与服务限制）。\n\n#### 监控仪表盘的设计\n\n**定义**：仪表盘不是\"把所有指标放上去\"，而是**按\"谁来看、看完要做什么\"组织**。三个角色的仪表盘完全不同。\n\n**三个角色的三种看板**\n\n| 角色 | 看什么 | 更新频率 |\n|---|---|---|\n| 值班/运维 | 可用性、错误率、延迟、告警状态 | 实时 |\n| ML 工程师 | 模型指标、漂移、数据质量、版本 | 小时/天 |\n| 业务/管理层 | 调用量、成本、采纳率、投诉率 | 天/周 |\n\n**\"红黄绿\"三色原则**：每个面板顶部放一个综合状态灯，越界即变红。**看板的第一价值是\"30 秒内判断有没有事\"，不是\"提供全部数据\"。**\n\n**必备的六块面板（ML 服务）**\n\n1. **健康总览**：可用性、错误率、P99 延迟、当前告警\n2. **流量**：QPS、按接口/模型分布\n3. **质量**：模型指标趋势、拒答率、截断率\n4. **数据**：输入分布、缺失率、PSI\n5. **成本**：每日花费、单次调用成本、按模型/接口拆分\n6. **版本**：线上模型版本、最近部署时间、回滚状态\n\n**成本面板必须与调用量放一起**：只看花费会误判（花得多可能是量涨了），要算\"单位成本\"。**\"每千次调用成本\"是成本异常检测的最佳单一指标。**\n\n**教学案例（虚构示意）**：一次成本异常（月度账单涨 40%），团队在成本看板上只看到总额上升。追问后发现：调用量只涨 8%，但每次调用的输入 token 涨了 55%——因为某次改动把整段对话历史都塞进了 prompt。加了\"平均输入 token 数\"面板后，这类问题当天可发现。\n\n**关联 AWS 服务**：Amazon CloudWatch Dashboards、Amazon QuickSight、AWS Cost Explorer、AWS Budgets、Amazon Managed Grafana。\n\n#### 容量优化的三个目标\n\n**定义**：容量优化同时追三个目标——**够用（性能）、不浪费（成本）、有余量（可靠）**。三者互斥：追求极致成本必然牺牲余量，追求绝对可靠必然浪费。\n\n**三个目标的量化表达**\n\n| 目标 | 指标 | 典型做法 |\n|---|---|---|\n| 性能 | P99 延迟 ≤ SLA | 按峰值容量 + 缓冲 |\n| 成本 | 单位请求成本最低 | 提高利用率、选对实例、批量 |\n| 可靠 | 容量不足导致的失败率 < 0.1% | 留余量 + 降级路径 |\n\n**利用率的现实区间**：为了应对突发，生产系统通常只能跑到 40–60% 的平均利用率。**\"把利用率提到 90%\"这种目标在在线服务里通常不现实**——它意味着没有余量应对峰值。\n\n**提升有效容量的三条路（比加实例更好）**\n\n1. **削峰**：排队 + 异步化，把突发摊平\n2. **降级**：容量不足时切小模型/短回答，保可用性\n3. **缓存**：相同请求复用结果\n\n**\"降级路径\"是容量设计的必需品**：没有降级方案的系统，在流量翻倍时只能全部超时。**有降级的系统至少能保住核心功能。**\n\n**教学案例（虚构示意）**：一个问答服务按峰值买容量，月成本高但利用率仅 35%。改造为三层：① 正常请求走主模型 ② 队列积压超 2 秒时降级为\"简短回答模式\"（小模型 + 限 100 token）③ 极限情况返回缓存答案 + 提示\"稍后重试\"。容量降到原来的 55%，SLA 仍达标，成本降 45%。\n\n**关联 AWS 服务**：SageMaker AI 自动扩缩、Application Auto Scaling 的计划扩缩、Amazon API Gateway（限流与队列）、ElastiCache（缓存）。\n\n#### 成本的配额与管控\n\n**定义**：配额管控解决两个问题——**防意外**（一个 bug 烧掉一个月预算）和**可归因**（这笔钱是谁花的）。\n\n**三层管控机制**\n\n| 层 | 工具 | 作用 |\n|---|---|---|\n| 预算告警 | AWS Budgets | 花费超阈值通知（不阻断） |\n| 服务配额 | Service Quotas | 限制最大资源数（硬上限） |\n| 应用级限流 | API Gateway / 自建 | 限制调用速率与总量 |\n\n**\"预算告警不防事故\"这个区别很关键**：Budgets 只发通知，不阻止花费。真正的止损要靠配额（如限制端点最大实例数）与限流（限制单用户调用量）。**考试里出现\"如何防止成本失控\"，正确答案通常包含配额或限流，而不只是预算告警。**\n\n**成本归因的四个维度（标签策略）**\n\n```\n环境（prod/dev）、业务线、模型/应用、团队\n```\n\n**标签必须从创建时就打**，事后补标签极其困难（资源可能已被删）。**在 IaC 里强制标签是最可靠的做法。**\n\n**异常检测**：AWS Cost Anomaly Detection 可以发现\"某服务某天突然多花 X 元\"。它对\"训练作业忘了关\"这类事故特别有效。\n\n**教学案例（虚构示意）**：一个开发环境误把批量推理作业跑在全量数据上（1.2 亿条），未设实例上限，一夜花掉 3.8 万元。整改：① 按环境设 Service Quotas（dev 环境 GPU 实例最多 2 台）② 批量作业必须显式声明最大分片数 ③ 日预算告警 + 异常检测 ④ 非生产环境强制打 `env=dev` 标签便于单独核算。\n\n**关联 AWS 服务**：AWS Budgets、AWS Cost Anomaly Detection、AWS Service Quotas、AWS Cost Explorer（按标签分组）、AWS Organizations SCP（组织级限制）。\n\n#### 用购买选项优化成本\n\n**定义**：这是 按需与预留资源的取舍（3.2.1） 的成本侧深化——同一份算力，买法决定单价。**关键是\"按负载的确定性分配买法\"，而不是全部用同一种。**\n\n**四种买法的组合策略（生产标准做法）**\n\n```\n基线负载（全天都在跑的）  → 预留 / Savings Plans\n峰值负载（每天高峰几小时） → 按需\n溢出/突发                → 按需 + 限流保护\n容错任务（训练、批处理）  → Spot\n```\n\n**\"打底 + 溢出\"是所有成本优化的通用形状**：无论是实例、FM 容量还是数据库，稳定部分买承诺、波动部分按量。**能说出这个形状，就抓住了这一条的主体。**\n\n**承诺期的风险**：1 年或 3 年承诺在业务变化时会变成沉没成本。**判断依据：这项负载的确定性有多高、业务规划期有多长。** 新业务、试验性业务不要签长期承诺。\n\n**存储与网络也占成本（常被忽略）**\n\n| 项 | 优化手段 |\n|---|---|\n| S3 存储 | 生命周期策略（冷数据转低频繁/归档）、清理废弃版本 |\n| 向量库 | 降维、量化、按热度分层（热数据在高性能索引、冷数据在低成本存储） |\n| 跨区传输 | 把计算放到数据旁边（同区域处理），避免反复跨区 |\n| NAT 网关 | 用 S3/ DynamoDB 网关端点替代（按流量计费，量大很贵） |\n\n**教学案例（虚构示意）**：一个 ML 平台的月账单 18 万元，拆解后：训练 42%、推理 31%、存储 18%、网络 9%。优化动作：训练改 Spot（降 60%）、推理基线买 Savings Plans（降 35%）、S3 加生命周期（降 40%）、补 S3 网关端点（网络降 70%）。总成本降到 10.4 万元，**没有削减任何业务功能**。\n\n**关联 AWS 服务**：Savings Plans、预留实例、EC2 Spot、S3 生命周期策略、VPC 网关端点、AWS Cost Explorer（按服务拆分）。\n\n#### FM 推理成本的影响因素评估\n\n**定义**：FM 的成本由 token 决定，而 token 数量由**输入长度 × 调用次数 + 输出长度**决定。所以成本优化的杠杆顺序与传统模型完全不同。\n\n**成本的四个驱动因素（按影响大小排序）**\n\n| 因素 | 影响 | 优化手段 |\n|---|---|---|\n| 调用次数 | 线性 | 缓存、批处理、路由分层（简单问题不调大模型） |\n| 输入 token 数 | 线性 | 精简 prompt、RAG 只喂相关块、压缩对话历史 |\n| 输出 token 数 | 线性（且单价通常更高） | 限制 `max_tokens`、要求简洁输出、结构化输出 |\n| 模型档位 | 数倍到数十倍 | 分层路由、蒸馏到小模型 |\n\n**\"输出比输入贵\"这一条要记住**：多数 FM 的输出单价是输入的 2–4 倍。所以\"少说废话\"比\"少给资料\"更省钱——但两者的取舍要看质量要求。\n\n**输入长度的隐性膨胀（最常见的成本事故）**\n\n```\n第一版：系统提示 200 token + 用户问题 50 token = 250\n三个月后：系统提示 800（加了规则）+ 检索上下文 3000（从 3 块加到 10 块）\n          + 对话历史 2000（保留全部）+ 用户问题 50 = 5850\n→ 单次成本涨 23 倍，而\"没人改过计费\"\n```\n\n**这个膨胀过程是渐进的，所以必须有\"平均输入 token 数\"的监控**（呼应 4.2.3）。\n\n**成本估算的实操公式**\n\n```\n月成本 ≈ 月调用次数 × [(平均输入 token × 输入单价) + (平均输出 token × 输出单价)]\n```\n\n用它做方案对比：RAG vs 微调、大模型 vs 小模型、全量上下文 vs 摘要，都能算出一个量级差。**考试里的\"成本对比\"题，答出这个结构和方向即可，不必精确数字。**\n\n**教学案例（虚构示意）**：一个文档问答，单次调用平均 6000 输入 token、400 输出。月 12 万次调用。优化三步：① prompt 里的 8 条规则压成 4 条（-600 token）② 检索从 10 块减到重排后 4 块（-1800 token）③ 对话历史改摘要（-1200 token）。输入降到 2400 token，月成本降 58%，答案质量评分几乎不变（4.2 → 4.1）。\n\n**关联 AWS 服务**：Amazon Bedrock（按 token 计费、批量推理折扣、prompt caching）、AWS Cost Explorer（按模型拆分成本）、CloudWatch（token 数指标）。\n\n#### Agent 的资源消耗监控\n\n**定义**：Agent 的成本不是\"一次调用\"，而是\"一次任务\"——一个任务可能包含 20 次模型调用 + 15 次工具调用。**监控单位必须从\"调用\"改成\"任务\"。**\n\n**Agent 成本的四个组成**\n\n| 组成 | 说明 |\n|---|---|\n| 模型调用 | 步数 × 每次的 token（含不断增长的历史） |\n| 工具调用 | Lambda/API 的费用（通常小，但外部 API 可能按次收费） |\n| 检索 | 每次知识库检索的 embedding 与向量查询费用 |\n| 状态存储 | 会话读写（DynamoDB 按请求计费） |\n\n**\"历史累积\"是 Agent 成本的隐形放大器**：第 10 步的请求包含前 9 步的完整历史，所以 token 消耗随步数**超线性**增长。**这就是\"限制步数\"同时是成本手段的原因。**\n\n**三个必设的成本护栏**\n\n| 护栏 | 作用 |\n|---|---|\n| 最大步数 | 防循环烧钱 |\n| 单任务 token 预算 | 超预算强制终止并返回部分结果 |\n| 单用户/单租户配额 | 防单一用户刷爆 |\n\n**\"按任务计量\"的成本看板**：展示 P50/P95 单任务成本、成本最高的任务类型、异常任务（成本 > 均值 5 倍）。**异常任务通常就是逻辑有问题的那些。**\n\n**教学案例（虚构示意）**：一个运维 Agent 的月度成本是预期的 4 倍。按任务分析发现：85% 的成本来自 6% 的任务，这些任务的共同特征是\"工具调用超过 15 次\"。抽查发现是权限错误导致查询一直返回空，Agent 不断重试。修复权限后，平均步数从 11.3 降到 3.8，成本回到预期的 1.2 倍。\n\n**关联 AWS 服务**：Amazon Bedrock Agents（调用追踪）、CloudWatch（自定义任务级指标）、AWS Lambda（工具调用成本）、Amazon DynamoDB（状态存储费用）。\n\n#### FM 用量的成本优化\n\n**定义**：这一条是 FM 推理成本的影响因素评估（4.2.7） 的\"运营侧\"补充——不只是改 prompt，还包括**架构层的降本手段**：缓存、路由、批处理、蒸馏。\n\n**四种降本架构手段（按投入产出排序）**\n\n| 手段 | 机制 | 典型降幅 | 代价 |\n|---|---|---|---|\n| **分层路由** | 简单请求给小模型，复杂给大模型 | 40–70% | 需要可靠的复杂度判定 |\n| **缓存** | 相同/相似请求复用结果 | 10–40% | 命中率取决于重复度 |\n| **批量推理** | 离线任务用折扣价 | 30–50% | 只适用非实时 |\n| **蒸馏** | 小模型学大模型在本任务上的表现 | 60–90% | 一次性训练成本，能力上限受限 |\n\n**分层路由的判定方式**\n\n1. **按规则**：按接口/租户/长度路由（最简单可靠）\n2. **按置信度**：小模型先答，置信度低再升级（需要置信度估计）\n3. **按分类器**：训练一个小分类器判断\"这题难不难\"\n\n**规则路由最实用**：多数业务里\"哪类请求需要强模型\"是清楚的，不需要复杂的判定机制。**过度工程化的路由本身就是成本。**\n\n**缓存的三种粒度**\n\n| 粒度 | 命中条件 | 命中率 |\n|---|---|---|\n| 完全匹配 | 输入完全相同 | 低（除非高频重复问题） |\n| 语义缓存 | 语义相似度超阈值 | 中高（需注意误命中风险） |\n| 前缀缓存（prompt caching） | 相同前缀的 prompt | 高（系统提示固定时） |\n\n**语义缓存有风险**：相似问题可能需要不同答案（\"北京今天天气\" vs \"北京明天天气\"）。**必须设较高的相似度阈值，且对时间敏感类问题禁用缓存。**\n\n**教学案例（虚构示意）**：一个客服问答，日调用 30 万次。分析后发现：42% 是 20 个高频问题的重复、31% 可由小模型处理、其余需要大模型。三层改造：高频问题加缓存（命中 38%）+ 简单问题路由到小模型 + 剩余走大模型。月成本降 68%，首答准确率不变。\n\n**关联 AWS 服务**：Amazon Bedrock（prompt caching、批量推理、预置吞吐）、Amazon API Gateway（路由与限流）、ElastiCache（结果缓存）、Amazon Bedrock 蒸馏。\n\n#### token、Embedding 与向量库的成本监控\n\n**定义**：RAG 的成本有三笔互不相同的账——**生成 token、embedding 计算、向量库存储与查询**。它们的计费方式完全不同，必须分开监控。\n\n**三笔账的计费方式**\n\n| 项 | 计费方式 | 什么时候贵 |\n|---|---|---|\n| 生成 token | 按输入/输出 token | 上下文长、调用多 |\n| Embedding | 按 token（建库时）+ 按查询次数 | 全量重建索引、频繁查询 |\n| 向量库 | 按实例/存储/请求（视产品） | 向量维度高、条目多、常驻实例 |\n\n**向量库成本的三个驱动**\n\n1. **向量条数**：分块越小条目越多。512 token 分块比 1024 多一倍条目。\n2. **向量维度**：1024 维 vs 256 维，存储与查询成本差异明显。\n3. **常驻 vs 按需**：托管向量库（如 OpenSearch Serverless）按最小容量计费，低流量时相对贵。\n\n**\"重建索引\"是被低估的成本**：每次换 embedding 模型或改分块策略，都要对全量文档重新向量化。**10 万份文档 × 平均 5000 token = 5 亿 token 的 embedding 调用**，一次就是一笔可观支出。**所以 embedding 模型与分块策略要在建库前定好，别反复试。**\n\n**监控的三个指标**\n\n| 指标 | 异常含义 |\n|---|---|\n| 每日 embedding token 数 | 突增=重建了索引或有批量导入 |\n| 向量库条目数 | 只增不减=缺少删除逻辑（呼应 3.2.8） |\n| 平均查询次数/会话 | 突增=检索策略有问题（如模型反复检索） |\n\n**教学案例（虚构示意）**：一次 RAG 优化试验中，团队换了三次 embedding 模型、改了两次分块策略，每次都重建索引。当月 embedding 费用超过生成费用。此后纪律：① embedding 与分块决策先在 2% 样本上验证 ② 全量重建前先估算 token 成本并报备 ③ 用影子索引做 A/B，验证通过才切换。\n\n**关联 AWS 服务**：Amazon Titan Embeddings（按 token 计费）、Amazon OpenSearch Serverless（OCU 计费）、Amazon Aurora（实例 + 存储）、AWS Cost Explorer（按使用类型拆分）、CloudWatch（自定义成本指标）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 按单价选实例族 | 判断的唯一标准是让瓶颈资源与实例强项对齐；选错族代价 2–3 倍成本且延迟更差 |\n| 2 | 仪表盘堆满指标 | 按\"谁来看、看完要做什么\"组织，三个角色的看板完全不同 |\n| 3 | 容量三个目标全都要 | 够用、不浪费、有余量三者互斥，必须按业务定优先级 |\n| 4 | FM 成本按实例监控 | FM 成本由 token 决定：输入长度 × 调用次数 + 输出长度 |\n| 5 | Agent 成本按调用监控 | 单位必须改成\"任务\"：一个任务可能含 20 次模型调用 + 15 次工具调用 |\n\n#### 记忆要点\n\n1. **选族就是瓶颈匹配**：GPU/内存/网络对齐负载瓶颈。\n2. **FM 成本四驱动按影响排序**：输入长度的隐性膨胀是最常见的事故。\n3. **FM 降本四手段**：缓存、路由、批处理、蒸馏，按投入产出排序。\n4. **RAG 三笔账分开监控**：生成 token、embedding 计算、向量库存储与查询。\n5. **成本护栏必设**：预算告警、配额管控、标签归因，防意外也保可归因。\n\n---"},{"h":"安全与端点防护（Secure ML and AI workloads and model endpoints.）","body":"#### 这一节学什么\n这一节对应考纲任务 4.3「安全与端点防护（Secure ML and AI workloads and model endpoints.）」。\n\n> 官方原名：Secure ML and AI workloads and model endpoints.\n> 技能点 9 条｜C02 新增 3 条｜可复用 1 条\n\n| 编号 | 官方技能点（英文原文） | 中文速记 |\n|---|---|---|\n| 4.3.1 | Secure continuous integration and continuous delivery (CI/CD) pipelines by checking for code and image vulnerabilities (for example, by using Amazon CodeGuru, Amazon Inspector). | CI/CD 代码与镜像漏洞扫描 |\n| 4.3.2 | Configure least privilege access to ML and AI artifacts. | ML 资产最小权限 |\n| 4.3.3 | Configure IAM policies and roles for users and applications in ML and AI systems. | IAM 策略与角色配置 |\n| 4.3.4 | Configure comprehensive monitoring, auditing, compliance, and logging for ML and AI systems (for example, AWS CloudTrail, AWS Config). | 审计、合规与日志 |\n| 4.3.5 | Troubleshoot and debug security issues in ML and AI systems. | 安全问题排障 |\n| 4.3.6 | Create VPCs, subnets, and security groups to securely isolate ML and AI systems. | VPC/子网/安全组隔离 |\n| 4.3.7 | Identify and mitigate security risks and vulnerabilities in ML and AI systems. | 安全风险识别与缓解 |\n| 4.3.8 | Select the appropriate credential type to access FMs (for example, Amazon Bedrock API keys, IAM credentials). | 访问 FM 的凭证类型选择 |\n| 4.3.9 | Implement safeguards and sensitive data protection to meet application requirements and responsible AI policies (for example, by using Amazon Bedrock Guardrails). | Guardrails 与敏感数据保护 |\n\n安全这一任务在 MLA 里有一个特殊立场：**你要保护的不只是数据，还有模型本身**（权重、提示、训练数据、推理接口）。C02 新增的 4 条几乎全在 GenAI 侧：漏洞扫描进 CI/CD、访问 FM 的凭证类型、Guardrails、敏感数据保护。\n\n#### CI/CD 中的代码与镜像漏洞扫描\n\n**定义**：把安全检查左移到构建阶段——**在镜像进入仓库前就发现漏洞**，而不是上线后被扫描出来。\n\n**三道扫描门**\n\n| 门 | 扫什么 | 时机 | 阻断条件 |\n|---|---|---|---|\n| 依赖扫描 | 第三方库的已知 CVE | 构建时 | 高危漏洞存在即阻断 |\n| 镜像扫描 | 基础镜像与系统包漏洞 | 推送到 ECR 时 | 高危即阻断 |\n| 代码扫描 | 硬编码密钥、注入风险、不安全反序列化 | 提交时 | 发现密钥即阻断 |\n\n**\"硬编码密钥\"是 ML 场景的高发问题**：notebook 里习惯把 API key 写死在代码里，然后被提交到仓库。**必须用 Secrets Manager 或参数存储，且在 CI 里加密钥扫描（提交前拦截）。**\n\n**镜像的漏洞主要来自基础镜像**：`python:3.11` 这类通用镜像包含大量系统包。用框架官方的精简推理镜像可大幅减少攻击面。**\"镜像越小，漏洞越少\"是个可靠的直觉。**\n\n**模型文件也要当\"依赖\"看待**：从外部下载的模型权重可能包含恶意代码（pickle 反序列化执行）。**优先用 safetensors 这类纯数据格式，避免 pickle**。这个点在 GenAI 场景是新增考点。\n\n**教学案例（虚构示意）**：一次安全检查发现生产镜像有 340 个高危 CVE，全部来自基础镜像里的系统包。换用推理专用精简镜像 + 多阶段构建后，CVE 降到 12 个（且无高危）。同时把 `pickle` 格式的模型文件改为 `safetensors`，消除了反序列化执行风险。\n\n**关联 AWS 服务**：Amazon ECR（推送时自动扫描、增强扫描）、AWS CodeBuild（构建阶段扫描）、Amazon Inspector（EC2/镜像/函数的持续扫描）、AWS Secrets Manager。\n\n#### ML 资产的最小权限\n\n**定义**：最小权限在 ML 场景的难点是**角色多、权限交叉**：数据工程师读数据、训练角色读数据写模型、端点角色读模型写日志、流水线角色编排以上全部。**任何一处给宽了，就是整条链的漏洞。**\n\n**四类角色与应有权限**\n\n| 角色 | 需要 | 不该有 |\n|---|---|---|\n| 数据准备 | 指定 S3 前缀读写、Glue Catalog | 全桶读写、其他业务数据 |\n| 训练作业 | 训练数据只读、模型输出路径写 | 删除权限、其他前缀访问 |\n| 端点/推理 | 模型产物只读、日志写、必要的下游调用 | 训练数据访问、S3 写 |\n| 流水线 | 创建/更新训练与端点、PassRole | 直接读写数据（应由子角色完成） |\n\n**\"PassRole\"是最容易给宽的权限**：允许传递任意角色等于允许获得任意权限。**必须限定只能传递特定角色（用 `iam:PassedToService` 条件与资源 ARN 约束）。**\n\n**数据分层的实践**：把训练数据、测试数据、敏感数据放在不同前缀甚至不同桶，用桶策略 + KMS 密钥策略双重隔离。**测试集与敏感数据应做到\"训练角色根本无权限\"**（呼应 3.3.4）。\n\n**教学案例（虚构示意）**：审计发现训练角色的策略是 `s3:*` on `*`——能读写整个账号的所有桶。整改：改为按前缀的最小集合 + 显式拒绝删除 + 用 KMS 密钥策略限制解密范围。整改后一次误操作（脚本 bug 试图删除数据）被权限拦截，避免了事故。\n\n**关联 AWS 服务**：AWS IAM（角色、策略、条件键）、AWS KMS（密钥策略与授权）、Amazon S3（桶策略与 Access Points）、IAM Access Analyzer（找出过宽权限）。\n\n#### IAM 策略与角色的配置\n\n**定义**：这一条是 ML 资产的最小权限（4.3.2） 的机制层——**怎么把\"最小权限\"真的写出来**。核心工具是条件键与资源级权限。\n\n**四个高频使用的条件键**\n\n| 条件键 | 作用 | 典型用法 |\n|---|---|---|\n| `aws:SourceVpce` | 限制只能通过指定 VPC 端点访问 | 数据只能从 VPC 内读取 |\n| `aws:SourceIp` | 限制来源 IP | 管理操作只允许公司网段 |\n| `aws:PrincipalTag` | 按主体标签授权 | 按团队隔离资源 |\n| `s3:prefix` / `s3:ExistingObjectTag` | 限制前缀或对象标签 | 数据分层访问 |\n\n**跨账号访问的两种方式**\n\n| 方式 | 机制 | 适用 |\n|---|---|---|\n| 角色切换（AssumeRole） | 受信账号扮演角色 | **推荐**，可撤销、可审计 |\n| 资源策略直接授权 | 桶策略/密钥策略里写对方账号 | 简单但难管理 |\n\n**\"用长期访问密钥\"是最该被淘汰的做法**：密钥会泄露、会忘记轮换。**首选角色（临时凭证），其次才是有轮换策略的密钥。**\n\n**权限排障的标准流程（很实用）**\n\n```\n1. 看 CloudTrail 的 AccessDenied 事件 → 找到被拒的具体 action 与 resource\n2. 用 IAM Policy Simulator 验证策略是否允许\n3. 检查是否有 SCP（组织级）或 VPC 端点策略额外拦截\n4. 检查 KMS 密钥策略（加密数据的访问是双重的：S3 权限 + KMS 权限）\n5. 检查资源策略（桶策略、队列策略）是否显式拒绝\n```\n\n**第五步最容易漏**：S3 桶策略里有显式 `Deny` 时，即使 IAM 允许也无法访问。**\"权限明明给了却不生效\"十有八九是资源策略的显式拒绝。**\n\n**教学案例（虚构示意）**：一个训练作业无法读取 S3 数据，IAM 策略确认无误。查 CloudTrail 发现 `AccessDenied` 来自 KMS（`kms:Decrypt`）。原因是数据用 CMK 加密，训练角色有 S3 权限但没有该密钥的使用权限。加上密钥策略授权后解决。**双重授权的结构是 ML 数据访问最常见的坑。**\n\n**关联 AWS 服务**：AWS IAM（策略模拟器、Access Analyzer）、AWS KMS（密钥策略与 Grants）、AWS CloudTrail（权限事件）、AWS Organizations SCP、Amazon S3 桶策略。\n\n#### 审计、合规与日志\n\n**定义**：审计要回答\"谁在什么时候对什么做了什么\"。ML 场景的特殊性在于**模型决策本身也需要被记录**（尤其是受监管行业）。\n\n**四类必须留存的日志**\n\n| 日志 | 内容 | 保留期（典型） |\n|---|---|---|\n| 操作审计 | 谁创建/修改/删除了资源（CloudTrail） | 1 年以上（合规常要求） |\n| 数据访问 | 谁读了哪些数据（S3 访问日志 / CloudTrail 数据事件） | 3–12 个月 |\n| 推理日志 | 输入、输出、模型版本、时间戳 | 按业务与合规要求 |\n| 训练日志 | 超参、数据路径、指标、镜像 | 与模型同寿命 |\n\n**推理日志的合规矛盾**：留存推理输入输出便于审计，但可能包含个人信息。**解法：脱敏后留存（PII 掩码）+ 分权限访问 + 设保留期。** \"不留\"和\"全留\"都不对。\n\n**日志完整性**：审计日志必须防篡改。**做法：写入独立账号的桶 + S3 Object Lock（合规模式）+ 仅追加权限。**\n\n**模型决策的可解释性要求**：受监管场景下要能回答\"这笔决策为什么这样\"。所以推理日志除了输入输出，还要记录**模型版本 + 关键特征值 + 若使用 RAG 则记录检索到的文档 ID**。**没有文档 ID，事后无法还原\"当时依据什么回答\"。**\n\n**教学案例（虚构示意）**：一次合规检查要求提供\"某笔贷款拒绝的完整依据\"。团队只有预测结果和分数，没有当时的特征值与模型版本。整改：① 推理日志记录模型版本 + 关键特征快照 + 决策阈值 ② 保留 18 个月 ③ PII 字段掩码 ④ 日志写入独立账号的不可篡改桶。\n\n**关联 AWS 服务**：AWS CloudTrail（含数据事件、组织级追踪）、Amazon S3 Object Lock、AWS Config（配置变更记录）、Amazon CloudWatch Logs（日志组与保留策略）、AWS Audit Manager。\n\n#### 安全问题的排障\n\n**定义**：安全排障与性能排障的区别是——**症状常常是\"不该能做的做成了\"或\"该能做的做不了\"**，而原因往往在多层策略中的某一层。\n\n**五类常见症状与定位**\n\n| 症状 | 最可能原因 | 定位工具 |\n|---|---|---|\n| 数据被非预期账号访问 | 桶策略过宽 / 账号级授权过宽 | IAM Access Analyzer、S3 访问日志 |\n| 该访问的被拒 | KMS 密钥策略、SCP、端点策略、显式 Deny | CloudTrail + Policy Simulator |\n| 密钥疑似泄露 | 硬编码、日志打印、镜像层残留 | Secrets Manager 轮换、代码扫描 |\n| 端点被公网访问 | 未配 VPC、安全组过宽、端点策略允许 `*` | VPC 流日志、端点策略审查 |\n| 模型被提取/滥用 | 无限流、无鉴权、Prompt 泄露系统提示 | API Gateway 限流与鉴权审查 |\n\n**\"端点被公网访问\"在 ML 场景特别危险**：模型端点一旦公开，可能被大量调用（成本攻击）或用于提取行为特征。**必须做三件：私有网络 + 鉴权（IAM/SigV4）+ 限流。**\n\n**Prompt 泄露是新增的攻击面**：攻击者通过诱导让模型输出系统提示，从而了解你的规则并绕过。**缓解：系统提示中不放敏感信息（密钥、内部 URL）、输出侧过滤、对\"重复提问系统提示\"的行为做检测。**\n\n**排障的取证顺序**：先看 CloudTrail（谁做了什么），再看资源策略（允许吗），再看网络（能到达吗），最后看应用日志（应用自己拒了吗）。**顺序错会浪费大量时间。**\n\n**教学案例（虚构示意）**：发现某个 S3 桶被外部账号读取。查 CloudTrail 数据事件定位到访问来源账号，查桶策略发现有一条 `Principal: \"*\"` 的 `GetObject` 允许（历史遗留，为某次共享临时加的）。同时该桶未启用\"阻止公共访问\"。整改：删除该条策略、开启 Block Public Access、加 Access Analyzer 持续监控、对已有数据做影响评估。\n\n**关联 AWS 服务**：AWS CloudTrail、IAM Access Analyzer、Amazon GuardDuty（异常行为检测）、AWS Security Hub、Amazon Macie（敏感数据发现）、VPC 流日志。\n\n#### VPC、子网与安全组的隔离\n\n**定义**：网络隔离是 ML 安全的底座——**没有它，权限做得再好也可能被绕过**（因为服务间通信走公网）。ML 场景的特殊性在于训练任务要访问大数据、端点要被业务系统调用、模型要访问外部依赖。\n\n**一个完整的隔离设计（四层）**\n\n| 层 | 配置 | 作用 |\n|---|---|---|\n| VPC | 独立 VPC 或独立子网段 | 边界 |\n| 子网 | 公有（仅放 NAT/负载均衡）+ 私有（放训练与端点） | 不直接暴露 |\n| 安全组 | 只允许必要端口与来源（用安全组引用而非 IP 段） | 东西向控制 |\n| 端点策略 | 限制可访问的 S3 桶/资源 | 即使有网络权限也只能访问指定资源 |\n\n**\"安全组引用安全组\"这个技巧很实用**：不要写 `10.0.1.0/24`，而是写\"允许来自 `sg-xxx`（应用层安全组）的 443\"。IP 段会变，安全组引用不会。\n\n**ML 特有的三处网络配置**\n\n1. **训练任务的双向需求**：读 S3（需要网关端点）+ 拉镜像（需要 ECR 端点或 NAT）。只配一半会导致\"训练能启动但拉不到数据\"或\"拉不到镜像\"。\n2. **端点被业务系统调用**：业务在另一个 VPC 时，用 VPC Peering 或 Transit Gateway，不要走公网。\n3. **模型访问外部依赖**：自托管 FM 需要下载权重或调用包索引，需通过 NAT 或私有镜像仓库；强合规场景用网络隔离 + 预构建镜像。\n\n**\"阻断公共访问\"是一条独立开关**：S3 的 Block Public Access、端点的公有访问开关。**即使策略写错了，这个开关也能兜底。** 应该是所有账号的默认开启项。\n\n**教学案例（虚构示意）**：一次渗透测试中，测试方从互联网直接调用了模型端点（因为端点的\"公有访问\"没关，且鉴权配置允许匿名）。整改：关闭端点公有访问、只允许来自指定 VPC 端点与业务角色的 SigV4 签名请求、加 API Gateway 限流、开启端点访问日志。**这类问题在\"能跑通\"之后极容易被遗漏，因为它不影响功能。**\n\n**关联 AWS 服务**：Amazon VPC（子网、路由、安全组、NACL）、AWS PrivateLink（接口端点）、VPC Peering / Transit Gateway、S3 Block Public Access、AWS Network Firewall。\n\n#### 安全风险的识别与缓解\n\n**定义**：MLA 要能识别 ML 特有的攻击面。**这类风险与传统应用安全不重叠，是这一条的全部价值。**\n\n**ML 特有的六类风险**\n\n| 风险 | 机制 | 缓解 |\n|---|---|---|\n| 数据投毒 | 污染训练数据，植入后门 | 数据来源校验、异常样本检测、训练数据审计 |\n| 模型窃取/提取 | 大量查询推断模型行为 | 限流、输出置信度粗化、异常查询检测 |\n| 对抗样本 | 微小扰动导致误判 | 对抗训练、输入校验、多模型交叉验证 |\n| 成员推断 | 判断某条数据是否在训练集里 | 差分隐私、限制输出细节、正则化 |\n| 提示注入 | 用户输入篡改指令 | 输入与指令结构分离、输出过滤（见 3.3.7） |\n| 训练数据泄露 | 模型记忆并复述训练数据 | 去重与脱敏、差分隐私、输出过滤 |\n\n**\"成员推断\"在敏感数据场景是硬合规要求**：如果模型能被用来判断\"某人是否在某个名单里\"，那训练数据的隐私就没有保住。**缓解手段是差分隐私训练或限制输出粒度。**\n\n**风险评估的实用框架**：对每个风险问三件事——**发生的可能性、影响的范围（单个/批量/系统性）、可检测性**。三者都高的优先处理。**数据投毒是\"低概率但系统性影响\"的典型，所以必须有检测机制而不是只靠预防。**\n\n**教学案例（虚构示意）**：一个简历筛选模型的训练数据来自公开渠道，其中混入了少量刻意构造的\"特定关键词即高分\"的样本。上线后发现某些候选人的评分异常偏高。排查确认是数据污染。缓解：① 训练数据来源白名单与人工抽检 ② 特征重要性监控（若某单一特征权重异常高即告警）③ 分组公平性检查进流水线。\n\n**关联 AWS 服务**：SageMaker AI Clarify（偏差检测与特征归因）、Amazon Macie（敏感数据发现）、Amazon GuardDuty、AWS Config（配置合规）。\n\n#### 访问 FM 的凭证类型选择\n\n**定义**：调用 FM 需要凭证，凭证类型决定了\"泄露后能造成多大损失\"。**这一条是 C02 新增，考的是\"什么场景用什么凭证\"。**\n\n**四种常见凭证与适用**\n\n| 类型 | 机制 | 安全等级 | 适用 |\n|---|---|---|---|\n| IAM 角色（临时凭证） | 角色扮演，短期 token | **最高** | 所有 AWS 内的工作负载（首选） |\n| IAM 用户访问密钥 | 长期密钥 | 低 | 仅限无角色支持的场景，必须轮换 |\n| API Key（Bedrock 等） | 长期字符串 | 低 | 第三方工具集成、开发测试 |\n| 联合身份（OIDC/SAML） | 外部身份换取临时凭证 | 高 | 员工访问、CI/CD（GitHub Actions 等） |\n\n**\"首选角色\"的三条理由**：① 临时（自动过期）② 可细粒度授权 ③ 可审计到具体主体。\n\n**CI/CD 访问 FM 的正确方式**：用 OIDC 联合身份（如 GitHub Actions 通过 OIDC 换取角色），**不要往仓库里塞长期密钥**。这是当前最容易被审计挑出的问题。\n\n**API Key 的管理纪律（当不得不用时）**\n\n1. 存 Secrets Manager，不存代码/环境变量文件\n2. 按应用分配（一个应用一个 key，便于吊销与归因）\n3. 定期轮换，且轮换过程可自动化\n4. 设配额上限（key 泄露时的损失上限）\n\n**教学案例（虚构示意）**：审计发现三处问题：① 一个 Lambda 里硬编码了 FM 的 API Key ② 一个开发者的长期访问密钥用了两年未轮换 ③ CI 里用同一个密钥部署生产与测试。整改：Lambda 改用角色、CI 改 OIDC、开发者密钥停用并切换 SSO 角色。**顺带发现\"CI 密钥可部署生产\"是最高危的一项。**\n\n**关联 AWS 服务**：AWS IAM（角色、OIDC 身份提供方）、AWS Secrets Manager（密钥存储与自动轮换）、AWS IAM Identity Center（SSO）、Amazon Bedrock（SigV4 签名调用）。\n\n#### Guardrails 与敏感数据保护\n\n**定义**：Guardrails 是生成内容侧的护栏——**它管的是\"模型能说什么\"，不是\"谁能访问什么\"**。这个边界必须清楚，否则会把安全责任错误地压在它身上。\n\n**Guardrails 能做什么**\n\n| 能力 | 说明 |\n|---|---|\n| 内容过滤 | 按类别（仇恨、暴力、色情等）阻断输入与输出 |\n| 敏感信息过滤 | 检测并遮蔽 PII（姓名、证件号、电话、卡号） |\n| 主题拒绝 | 拒绝指定主题（如竞品咨询、内部薪资） |\n| 词表过滤 | 自定义禁止词与必含词 |\n| 上下文接地检查 | 检查输出是否有检索依据（防幻觉） |\n| 自动推理检查 | 用形式化策略校验输出是否违反规则 |\n\n**\"上下文接地检查\"是 RAG 场景最有价值的配置**：它直接针对\"答非所问/编造\"，把忠实度从\"事后评估\"变成\"事前约束\"。**这是 C02 里最实用的一条 GenAI 安全能力。**\n\n**Guardrails 做不到什么（这部分更重要）**\n\n| 做不到 | 应该由谁管 |\n|---|---|\n| 按用户隔离知识库文档 | 检索层元数据过滤（3.1.8） |\n| 防止模型被大量调用 | 限流与配额（4.2.5） |\n| 保护训练数据不被读取 | IAM 与网络隔离（4.3.2/4.3.6） |\n| 防止提示注入的成功执行 | 输入结构分离 + 工具权限服务端校验 |\n| 加密传输与存储 | KMS 与 TLS |\n\n**\"Guardrails 不是安全边界\"这个判断是高频考点**：它是内容安全的最后一道过滤，不能替代权限控制。**\"用 Guardrails 实现不同用户看不同文档\"是典型错误选项。**\n\n**PII 保护的两层设计**\n\n```\n输入侧：检测到 PII → 遮蔽后再送模型（避免进入日志与上下文）\n输出侧：检测到 PII → 遮蔽后返回（防模型复述训练数据中的 PII）\n```\n\n**教学案例（虚构示意）**：一个 HR 助手，允许查询制度但必须屏蔽员工个人信息。配置：① Guardrails PII 过滤（输入输出双向）② 检索层按部门过滤文档 ③ 系统提示明确\"不得输出任何员工个人数据\" ④ 输出后置检查（正则兜底身份证/手机号格式）。四层里**只有第 ① 层是 Guardrails，其余都是它做不到的**——这正是理解这条技能点的关键。\n\n**关联 AWS 服务**：Amazon Bedrock Guardrails（内容过滤、PII、主题拒绝、上下文接地检查、自动推理检查）、Amazon Comprehend（PII 检测）、AWS KMS（加密）、Amazon Macie（存储侧敏感数据发现）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 安全检查放在上线后 | 左移到构建阶段：镜像进仓库前就扫描，三道门依次过 |\n| 2 | 图省事给宽权限 | 四类角色权限交叉，任何一处给宽了就是整条链的漏洞 |\n| 3 | 只管权限不管网络 | 网络隔离是 ML 安全的底座；没有它，权限做得再好也可能被绕过 |\n| 4 | 审计只记操作不记决策 | 受监管行业里模型决策本身也需要被记录 |\n| 5 | 用传统应用安全覆盖 ML 攻击面 | 提示注入、模型窃取、数据投毒等 ML 特有风险与传统安全不重叠 |\n\n#### 记忆要点\n\n1. **扫描左移三道门**：镜像进仓库前完成，不是上线后补救。\n2. **最小权限靠条件键与资源级权限落地**：这是\"怎么写出来\"的核心工具。\n3. **审计四类日志**缺一不可，模型决策留痕是 ML 场景的特殊要求。\n4. **凭证类型决定泄露损失上限**：什么场景用什么凭证是考试重点。\n5. **安全症状分两层**：不该能的做成了、该能的做不了，定位走多层策略。\n\n---"}],"tips":{"points":"| 考点 | 出题形式 | 得分要点 |\n|---|---|---|\n| 漂移 vs 退化 | \"模型指标没变但业务变差\" | 查分组指标与数据分布；整体指标会掩盖小群体退化 |\n| 静默失败 | \"批处理报成功但结果不对\" | 核对输入输出行数、分片级成功率、特征缺失率 |\n| GenAI 质量监控 | \"系统全绿但用户投诉\" | 监控检索层与质量层（引用覆盖率、拒答率、截断率） |\n| Agent 成本异常 | \"Agent 成本是预期 3 倍\" | 按任务看步数分布；P95 步数告警 |\n| 截断率 | \"摘要经常不完整但接口成功\" | `max_tokens` 截断，需单独监控 |\n| 实例选型 | \"XGBoost 部署在 GPU 上\" | 错：CPU 足够，成本差一个数量级 |\n| 容量不足 vs 配置 | \"加了实例还是慢\" | 看 ModelLatency 与批处理队列，区分是否单实例瓶颈 |\n| 配额 vs 预算告警 | \"如何防止成本失控\" | 配额/限流是硬限制，预算告警只通知 |\n| token 成本膨胀 | \"没人改计费但成本涨 20 倍\" | 输入长度膨胀（规则累积、检索块变多、历史全带） |\n| 向量库成本 | \"embedding 费用超过生成费用\" | 反复重建索引；决策要先小样本验证 |\n| 权限排障 | \"权限给了还是不生效\" | KMS 密钥策略 + 资源策略显式 Deny + SCP |\n| PassRole | \"流水线权限过大\" | 限定特定角色与 `iam:PassedToService` |\n| 凭证类型 | \"CI 如何访问 FM\" | OIDC 联合身份，不用长期密钥 |\n| Guardrails 边界 | \"用 Guardrails 隔离文档权限\" | 错：它管内容不管权限 |\n| 网络隔离 | \"端点被公网调用\" | 关闭公有访问 + VPC 端点 + 鉴权 + 限流 |","services":"| 服务 | 在本域的作用 |\n|---|---|\n| Amazon CloudWatch | 指标、日志、告警、仪表盘；自定义业务与成本指标 |\n| AWS X-Ray | 跨服务调用链追踪（含 Agent 与会话串接） |\n| Amazon SageMaker Model Monitor | 数据质量、模型质量、偏差、特征归因四类监控 |\n| SageMaker AI Clarify | 偏差检测与特征归因（分组公平性） |\n| SageMaker Inference Recommender | 自动测出最优实例与配置（省去手工试） |\n| Amazon Bedrock Guardrails | 内容过滤、PII、主题拒绝、上下文接地检查 |\n| AWS Cost Explorer / Budgets | 成本归因与预算告警 |\n| AWS Cost Anomaly Detection | 异常花费检测 |\n| AWS Service Quotas | 硬上限（成本与容量护栏） |\n| AWS IAM / KMS | 最小权限、条件键、密钥策略、双重授权 |\n| IAM Access Analyzer | 发现过宽或跨账号暴露的权限 |\n| AWS CloudTrail | 操作审计与权限排障的第一现场 |\n| Amazon S3 Object Lock | 审计日志与训练数据的不可篡改留存 |\n| Amazon Macie | 存储侧敏感数据（PII）发现 |\n| Amazon GuardDuty | 异常行为与凭证滥用的持续检测 |\n| Amazon VPC / PrivateLink | 网络隔离基础（子网、安全组、端点、端点策略） |\n| AWS Secrets Manager | 密钥与 API Key 的存储与轮换 |\n| Amazon QuickSight / Managed Grafana | 多角色看板与分组趋势分析 |\n| Amazon OpenSearch Serverless / Aurora pgvector | 向量库（其成本与规模是 4.2.10 的主体） |"}}]};
const QUIZ_TOTAL = 380;
</script>
<script>
(function(){
'use strict';
const DATA = (typeof LEARNING_DATA !== 'undefined' && LEARNING_DATA) ? LEARNING_DATA : null;

// R5: meta.footerNote overrides default footer (AWS default kept when absent)
if (DATA && DATA.meta && DATA.meta.footerNote) {
  var fn = document.getElementById('footNote');
  if (fn) { fn.textContent = DATA.meta.footerNote; }
}

/* ============ 常量与工具 ============ */
const EXAM = DATA ? (DATA.meta.exam || 'CERT').toLowerCase() : 'cert';   // clf-c02
const STORE_KEY = EXAM + '-v2';                                          // 进度键：clf-c02-v2
const COLORS = ['#4f46e5','#7c3aed','#9333ea','#a855f7'];                // 每章主题色（N 章 N 色，N>4 循环）
const home = document.getElementById('home');
const chapBox = document.getElementById('chapters');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function imgSrcOk(src){ return /^(?:[\w.-]+\/)*[\w.-]+\.(?:png|jpe?g|webp|gif|svg)$/i.test(src); }
function inlineMd(s){
  let t = esc(s);
  t = t.replace(/\n/g,'<br>');
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t = t.replace(/!\[([^\]]*)\]\(([^()\s]+)\)/g, function(m0, alt, src){
    if(!imgSrcOk(src)) return '<span class="img-bad" title="非法图源">🖼 非法图源：'+src+'</span>';
    return '<img class="inline-img" loading="lazy" alt="'+alt.replace(/"/g,'&quot;')+'" src="'+src+'">';
  });
  return t;
}
function isTblSep(ln){ const core = ln.replace(/^\s*\|/,'').replace(/\|\s*$/,''); if(!core.includes('-')) return false; return /^[\s:\-|]+$/.test(ln) && /-/.test(ln); }
function loadProg(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveProg(p){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){} }

/* ============ 块级 md 渲染（段落/引用/表格/列表/图占位符） ============ */
function renderBlocks(seg, figs, fctr){
  fctr = fctr || {n:0};
  const lines = seg.replace(/\r/g,'').split('\n');
  let html = ''; let i = 0; const n = lines.length;
  while(i < n){
    const ln = lines[i]; const s = ln.trim();
    if(s === ''){ i++; continue; }
    const fm = s.match(/^\[\[fig:([\w-]+)\]\]$/);
    if(fm){ const f = (figs||{})[fm[1]]; if(f){ if(fctr) fctr.n++; html += figHtml(f); } i++; continue; }
    const fp = s.match(/^【图：(.+?)｜(概念图|截图)】$/);
    if(fp){ fctr.n++; html += '<div class="fig-placeholder" data-figtype="'+fp[2]+'"><span class="fp-num">图 '+fctr.n+'</span><span class="fp-type">'+fp[2]+'</span><span class="fp-alt">'+esc(fp[1])+'</span><span class="fp-note">真图待补</span></div>'; i++; continue; }
    const ib = s.match(/^!\[([^\]]*)\]\(([^()\s]+)\)$/);
    if(ib){
      const ialt = ib[1], isrc = ib[2];
      if(imgSrcOk(isrc)){ html += '<figure class="fig-img"><img loading="lazy" alt="'+ialt.replace(/"/g,'&quot;')+'" src="'+isrc+'"><figcaption>'+esc(ialt)+'</figcaption></figure>'; }
      else { html += '<div class="fig-placeholder"><span class="fp-type">非法图源</span><span class="fp-alt">'+esc(ialt)+' ← '+esc(isrc)+'</span><span class="fp-note">检查路径与扩展名</span></div>'; }
      i++; continue;
    }
    if(s.startsWith('|') && i+1 < n && isTblSep(lines[i+1].trim())){
      let rows = [];
      while(i < n && lines[i].trim().startsWith('|')){ rows.push(lines[i].trim()); i++; }
      const heads = rows[0].replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim()));
      const data = rows.slice(2).map(r => r.replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim())));
      html += '<div class="tbl-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'
        + data.map(r => '<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if(s.startsWith('>')){
      let q = [];
      while(i < n && lines[i].trim().startsWith('>')){ q.push(lines[i].replace(/^\s*>\s?/,'').trim()); i++; }
      html += '<blockquote>'+inlineMd(q.join(' '))+'</blockquote>'; continue;
    }
    if(/^[-*]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^[-*]\s+/.test(t)){ items.push(inlineMd(t.replace(/^[-*]\s+/,''))); i++; } else break; }
      html += '<ul>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; continue;
    }
    if(/^\d+[.、]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^\d+[.、]\s+/.test(t)){ items.push(inlineMd(t.replace(/^\d+[.、]\s+/,''))); i++; } else break; }
      html += '<ol>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ol>'; continue;
    }
    const hm = s.match(/^(#{1,6})\s+(.+)$/);
    if(hm){ html += '<h4 class="sec-h">'+inlineMd(hm[2])+'</h4>'; i++; continue; }
    let para = [];
    while(i < n){
      const t = lines[i].trim();
      if(t === '' || t.startsWith('|') || t.startsWith('>') || /^[-*]\s+/.test(t) || /^\d+[.、]\s+/.test(t) || /^#{1,6}\s/.test(t) || /^\[\[fig:[\w-]+\]\]$/.test(t) || /^【图：[^｜]*｜(?:概念图|截图)】$/.test(t) || /^!\[[^\]]*\]\([^()\s]+\)$/.test(t)) break;
      para.push(t); i++;
    }
    if(para.length) html += '<p>'+inlineMd(para.join(' '))+'</p>';
  }
  return html;
}

/* ===== 节内子块解析与渲染（v6）：#### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点）
   这一节学什么（旧值「本节定位」仍兼容）=弱化引言、案例/记忆要点=卡片、常见误区与易错点=警示小节——均不占编号。
   解析与渲染共用 parseSectionBlocks，保证正文 h3 与左侧目录两级条目 1:1。 ===== */
const SUB_RAW='raw', SUB_LEAD='lead', SUB_KP='kp', SUB_CASE='case', SUB_MIS='mis', SUB_MEM='mem';
function subTypeOf(title){
  if(title === '这一节学什么' || title === '本节定位') return SUB_LEAD;
  if(title === '案例') return SUB_CASE;
  if(title === '记忆要点') return SUB_MEM;
  if(title === '常见误区与易错点') return SUB_MIS;
  return SUB_KP;
}
function parseSectionBlocks(md){
  const parts = (md||'').replace(/\r/g,'').split(/\n(?=####\s)/);
  const out = [];
  parts.forEach(part=>{
    const m = part.match(/^####\s*(.+?)\s*\n([\s\S]*)$/);
    if(!m){ const t = part.trim(); if(t) out.push({ type:SUB_RAW, title:'', body:t }); return; }
    out.push({ type:subTypeOf(m[1].trim()), title:m[1].trim(), body:(m[2]||'').trim() });
  });
  return out;
}
function countKp(body){ let m=0; parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP) m++; }); return m; }
function kpListOf(body){
  const kps=[]; let m=0;
  parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP){ m++; kps.push({ m:m, title:b.title }); } });
  return kps;
}
function renderSectionBody(md, figs, d, n, fctr){
  fctr = fctr || {n:0};
  const blocks = parseSectionBlocks(md);
  let h = ''; let kp = 0;
  for(const b of blocks){
    if(b.type === SUB_RAW){ h += renderBlocks(b.body, figs, fctr); continue; }
    if(b.type === SUB_KP){
      kp++;
      h += '<h3 class="mh3" id="sec-'+d+'-'+n+'-'+kp+'"><span class="h3no">'+d+'.'+n+'.'+kp+'</span><span>'+inlineMd(b.title)+'</span></h3>'
         + renderBlocks(b.body, figs, fctr);
      continue;
    }
    if(b.type === SUB_CASE){ h += '<div class="case-card"><h4 class="sec-h">案例</h4>'+renderBlocks(b.body, figs, fctr)+'</div>'; continue; }
    if(b.type === SUB_MEM){ h += '<div class="mem-card"><h4 class="sec-h">记忆要点</h4>'+renderBlocks(b.body, figs, fctr)+'</div>'; continue; }
    h += '<h4 class="sec-h'+(b.type===SUB_LEAD?' sec-lead-h':'')+'">'+inlineMd(b.title)+'</h4>'+renderBlocks(b.body, figs, fctr);
  }
  return h;
}
function figsById(fs){ const m={}; (fs||[]).forEach(f=>{ m[f.id]=f; }); return m; }
function figHtml(f){
  return '<div class="fig-block"><div class="fig-title">'+esc(f.title)+'</div>'
    + '<div class="fig-body">'+(f.html||'')+'</div>'
    + (f.caption ? '<div class="fig-caption">'+esc(f.caption)+'</div>' : '') + '</div>';
}

/* ============ 章内滚动（v6）：几何法 scrollspy + 阅读进度 ============
   同一 rAF 节流的 scroll 监听做两件事：① 顶部细进度条（#rdFill-d / #readPct-d）
   ② 高亮"最新越过吸顶线(READ_LINE)的锚点"（.sec-block 节 / .mh3 知识点），并自动单开其节组。 */
let spyD = 0, spyEls = [], spyTick = null, spyOn = false;
const READ_LINE = 86;      // 吸顶条下方阅读线
const ACT_WIN = 160;       // 节/知识点标题进入线下方窗口即视为"当前"（点击跳转后立即生效）
function setAct(id){
  if(!id) return;
  /* 锚点两类：正文节/知识点 sec-域-序号[-序号]，章末练习 quiz-d域 */
  const mk = id.match(/^(?:sec-|quiz-d)(\d+)/); if(!mk) return;
  const d = +mk[1];
  const toc = document.getElementById('toc-d'+d); if(!toc) return;
  toc.querySelectorAll('.toc-link.act').forEach(a=>a.classList.remove('act'));
  const link = toc.querySelector('a[href="#'+id+'"]');
  if(link){
    link.classList.add('act');
    const li = link.closest('.toc-sec');
    if(li && !li.classList.contains('open')){
      toc.querySelectorAll('.toc-sec.open').forEach(x=>x.classList.remove('open'));
      li.classList.add('open');
    } else if(!li){
      /* 独立条目（练习入口等）：高亮时收起所有展开节组，聚焦本条 */
      toc.querySelectorAll('.toc-sec.open').forEach(x=>x.classList.remove('open'));
    }
  }
}
function computeSpy(){
  const host = document.getElementById('panel-d'+spyD); if(!host) return;
  /* ① 阅读进度：以当前面板总高扣视口高的滚动行程计百分比（+页脚尾距近似） */
  const total = host.offsetHeight - window.innerHeight + 110;
  const p = total > 0 ? Math.max(0, Math.min(100, Math.round(window.scrollY / total * 100))) : 0;
  const fill = document.getElementById('rdFill-'+spyD); if(fill) fill.style.width = p + '%';
  const pct = document.getElementById('readPct-'+spyD); if(pct) pct.textContent = p + '%';
  /* ② 当前锚（三层）：
     视口内(含阅读线下方窗口)：选最靠上者 → 点击跳转/节首即生效；
     视口内无锚(读至章末练习/底部)：取最近滚出视口的锚，保持高亮最后小节；
     首屏未滚：回退最先可见锚 */
  const hi = READ_LINE + ACT_WIN;
  let best = null;
  for(const el of spyEls){
    const r = el.getBoundingClientRect();
    if(r.top <= hi && r.bottom >= 0){ if(!best || r.top > best.r.top) best = { el:el, r:r }; }
  }
  if(!best){
    for(const el of spyEls){
      const r = el.getBoundingClientRect();
      if(r.bottom < 0){ if(!best || r.bottom > best.r.bottom) best = { el:el, r:r }; }
    }
  }
  if(!best){
    for(const el of spyEls){
      const r = el.getBoundingClientRect();
      if(r.top >= 0 && r.top < window.innerHeight * 0.7){ if(!best || r.top < best.r.top) best = { el:el, r:r }; }
    }
    if(!best && spyEls.length) best = { el:spyEls[0], r:null };
  }
  if(best && best.el.id) setAct(best.el.id);
}
function onSpyScroll(){
  if(spyTick) return;
  spyTick = requestAnimationFrame(()=>{ spyTick = null; computeSpy(); });
}
function initSpy(d){
  detachSpy(false);
  spyD = d;
  const host = document.getElementById('panel-d'+d); if(!host) return;
  spyEls = Array.from(host.querySelectorAll('.sec-block, .mh3, .quiz-box'));
  if(!spyOn){ spyOn = true; window.addEventListener('scroll', onSpyScroll, { passive:true }); }
  document.body.classList.add('chapView');
  computeSpy();
}
function detachSpy(resetAct){
  if(spyOn){ window.removeEventListener('scroll', onSpyScroll); spyOn = false; }
  if(spyTick){ cancelAnimationFrame(spyTick); spyTick = null; }
  document.body.classList.remove('chapView');
  spyEls = []; spyD = 0;
  if(resetAct !== false){
    document.querySelectorAll('.toc-link.act').forEach(a=>a.classList.remove('act'));
    document.querySelectorAll('.toc-sec.open').forEach(li=>li.classList.remove('open'));
  }
}

/* ============ 章末练习 ============ */
/* 答案/题型归一化（修复：双科数据格式不一致导致章末练习失效）
   数据真源存在两种历史格式：
     CLF  a = ["C"] / ["B","E"]   t = 'single' / 'multiple'
     AIF  a = "B"   / "AE"        t = '单选' / '多选'
   原实现把 q.a 经 JSON.stringify+esc 写进 data-ans 属性，esc 不转义双引号 →
   属性被 HTML 截断（CLF 抛 JSON 解析错→提交无反应；AIF 读出空→恒判错）。
   现改为：答案只从数据真源按 qid 反查，渲染层统一归一化，不再进 HTML 属性。 */
function normAns(v){
  if(v === null || v === undefined) return [];
  if(Array.isArray(v)) return v.map(x=>String(x).trim().toUpperCase()).filter(x=>/^[A-Z]$/.test(x));
  const raw = String(v).trim();
  /* 严格形态：整串只允许字母与分隔符。防从说明文字里误提字母
     （历史案例：某题答案字段为「⚠️待核（…见源PDF）」→ 误提出 P/D/F） */
  if(!/^[A-Za-z][A-Za-z,，、;；\s]*$/.test(raw)) return [];
  return raw.toUpperCase().replace(/[^A-Z]/g, '').split('').filter(Boolean);
}
/* 可作答判定：答案可解析 + 至少一个选项。不可作答题不渲染交互（防误判） */
function isAnswerable(q){ return !!(q && normAns(q.a).length && (q.o || []).length); }
/* 可答题数（进度分母用，不可作答题不计入） */
function answerableCount(d){
  const ch = (DATA && DATA.chapters) ? DATA.chapters[d-1] : null;
  return ((ch && ch.practice) || []).filter(isAnswerable).length;
}
function isMultiQ(q){
  if(!q) return false;
  if(q.t === 'multiple' || q.t === 'multi' || q.t === '多选') return true;
  return normAns(q.a).length > 1;   // 兜底：答案多字母必为多选
}
function findQ(d, qid){
  const ch = (DATA && DATA.chapters) ? DATA.chapters[d-1] : null;
  const qs = (ch && ch.practice) || [];
  for(let i=0;i<qs.length;i++){ if(String(qs[i].id) === String(qid)) return qs[i]; }
  return null;
}
function renderQuiz(d, qs){
  const host = document.getElementById('quiz-d'+d);
  if(!qs.length){ host.innerHTML = '<div class="quiz-hdr">✅ 本章练习</div><p style="font-size:14px;color:#94a3b8">本章暂无配套练习，可到刷题工具练习。</p>'; return; }
  const nAns = qs.filter(isAnswerable).length;
  const naTip = (nAns < qs.length) ? '（另有 '+(qs.length-nAns)+' 题特殊题型待补充）' : '';
  let h = '<div class="quiz-hdr"><span>✅ 本章练习（'+nAns+' 题）'+naTip+'</span><span class="quiz-score" id="qscore-'+d+'">正确 0/'+nAns+'</span></div>';
  qs.forEach((q,qi)=>{
    const multi = isMultiQ(q);
    /* 不可作答防御：答案或选项缺失时不渲染答题交互，
       避免学员点击后被误判（历史案例：配对题占位形态） */
    if(!isAnswerable(q)){
      h += '<div class="qi qi-na" data-d="'+d+'" data-qid="'+esc(q.id||(d+'-'+qi))+'" data-qi="'+qi+'" data-na="1">'
        + '<div class="qmeta"><span class="qbadge">第 '+(qi+1)+' 题</span><span class="qtype">特殊题型</span></div>'
        + '<div class="qstem">'+inlineMd(q.q||'')+'</div>'
        + '<div class="qrow"><div class="qres show na">⚠️ 本题为配对/特殊题型，暂不支持在线作答（内容待补充）</div></div></div>';
      return;
    }
    h += '<div class="qi" data-d="'+d+'" data-qid="'+esc(q.id||(d+'-'+qi))+'" data-qi="'+qi
      + '" data-multi="'+(multi?'1':'0')+'">'
      + '<div class="qmeta"><span class="qbadge">第 '+(qi+1)+' 题</span><span class="qtype '+(multi?'qtype-m':'qtype-s')+'">'+(multi?'多选':'单选')+'</span></div>'
      + '<div class="qstem">'+inlineMd(q.q||'')+'</div><div class="opts">';
    (q.o||[]).forEach(op=>{
      h += '<div class="opt" data-l="'+esc(op.l)+'"><span class="ol">'+esc(op.l)+'.</span><span>'+inlineMd(op.t||'')+'</span></div>';
    });
    h += '</div><div class="qexp" style="display:none">'+esc(q.e||'')+'</div>'
      + '<div class="qrow"><button class="qbtn">确认答案</button><div class="qres"></div></div></div>';
  });
  h += '<div class="score-box" id="scorebox-'+d+'"><div class="score-num" id="scorenum-'+d+'"></div><div class="score-lbl"></div>'
    + '<div class="sb-tip">完整题库与限时模拟考核见首页「题库刷题」入口；未作答的题目在返回目录再进入后仍可继续作答。</div></div>';
  host.innerHTML = h;
  /* 恢复已作答状态 */
  const prog = loadProg();
  const rec = (prog['quiz_d'+d] && prog['quiz_d'+d].answered) || {};
  host.querySelectorAll('.qi').forEach(qi=>{
    const qid = qi.dataset.qid;
    if(rec[qid] !== undefined){
      applyResult(qi, rec[qid].right === 1, rec[qid].sel || [], normAns((findQ(d, qid) || {}).a), true);
    }
  });
  host.querySelectorAll('.qi').forEach(qi=>{
    const qid = qi.dataset.qid; const prog2 = loadProg();
    const rec2 = (prog2['quiz_d'+d] && prog2['quiz_d'+d].answered) || {};
    if(rec2[qid] !== undefined) return;   // 已答锁题
    const optsBox = qi.querySelector('.opts'), btn = qi.querySelector('.qbtn');
    if(!optsBox || !btn) return;          // 不可作答题（特殊题型占位卡）无交互
    const multi = qi.dataset.multi === '1';
    const opts = qi.querySelectorAll('.opt');
    optsBox.addEventListener('click', e=>{
      const o = e.target.closest('.opt'); if(!o) return;
      if(multi){ o.classList.toggle('sel'); }
      else{ opts.forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); }
    });
    btn.addEventListener('click', ()=>{ judge(qi); });
  });
  updateScore(d);
  checkScoreBox(d);
}

function judge(qi){
  const d = qi.dataset.d;
  const ans = normAns((findQ(d, qi.dataset.qid) || {}).a);
  const sel = Array.from(qi.querySelectorAll('.opt.sel')).map(o=>o.dataset.l);
  /* 防复发：答案数据异常时大声报错，不得静默判错 */
  if(!ans.length){
    const r = qi.querySelector('.qres');
    r.className = 'qres show err';
    r.textContent = '⚠️ 本题答案数据异常，无法判定，请反馈管理员';
    return;
  }
  const right = sel.length === ans.length && ans.every(a=>sel.includes(a));
  applyResult(qi, right, sel, ans, false);
  /* 持久化 */
  const prog = loadProg();
  const key = 'quiz_d'+d;
  if(!prog[key]) prog[key] = { answered:{} };
  prog[key].answered[qi.dataset.qid] = { right: right?1:0, sel: sel };
  saveProg(prog);
  updateScore(d);
  refreshProgress();
  checkScoreBox(d);
}

function applyResult(qi, right, sel, ans, restored){
  qi.classList.add('done');
  const opts = Array.from(qi.querySelectorAll('.opt'));
  opts.forEach(o=>{
    const l = o.dataset.l;
    if(ans.includes(l)) o.classList.add(sel.includes(l) ? 'cor' : 'shc');
    else if(sel.includes(l)) o.classList.add('wrg');
  });
  const qres = qi.querySelector('.qres');
  qres.className = 'qres show ' + (right ? 'ok' : 'err');
  const exp = qi.querySelector('.qexp');
  qres.innerHTML = (right ? '✅ 回答正确' : '❌ 回答错误') + '　<span style="font-weight:400">' + inlineMd(exp ? exp.textContent : '') + '</span>';
  qi.querySelector('.qbtn').disabled = true;
  qi.querySelector('.qbtn').textContent = restored ? '已作答' : '已确认';
}

function updateScore(d){
  const prog = loadProg();
  const key = 'quiz_d'+d;
  const rec = (prog[key] && prog[key].answered) || {};
  let right = 0;
  Object.values(rec).forEach(v=>{ if(v.right === 1) right++; });
  const total = answerableCount(d);   // 分母=可答题数（特殊题型占位卡不计入）
  const sc = document.getElementById('qscore-'+d);
  if(sc) sc.textContent = '正确 ' + right + '/' + total;
}

function checkScoreBox(d){
  const prog = loadProg();
  const key = 'quiz_d'+d;
  const rec = (prog[key] && prog[key].answered) || {};
  const total = answerableCount(d);
  if(Object.keys(rec).length >= total && total > 0){
    let right = 0; Object.values(rec).forEach(v=>{ if(v.right === 1) right++; });
    const box = document.getElementById('scorebox-'+d);
    document.getElementById('scorenum-'+d).textContent = right + ' / ' + total;
    box.querySelector('.score-lbl').textContent = right === total ? '🎉 全对，本章掌握扎实！' : (right >= total*0.7 ? '👍 达到及格线（70%），可进入下一章' : '📖 建议回到正文复习错题对应的知识点');
    box.classList.add('show');
  }
}

/* ============ 视图切换与进度 ============ */
function go(d){
  const chapters = DATA.chapters;
  closeSide();
  home.style.display = 'none';
  chapBox.style.display = '';
  chapBox.querySelectorAll('.panel').forEach(p=>{ p.style.display = (p.id === 'panel-d'+d) ? '' : 'none'; });
  const prog = loadProg();
  prog['read_d'+d] = 1;                 // 已读标记
  saveProg(prog);
  window.scrollTo(0,0);
  document.title = baseTitle() + ' · 第 ' + d + ' 章';
  initSpy(d);                            // 常驻目录/进度条/scrollspy 跟随当前章
}

function backHome(){
  detachSpy();
  closeSide();
  chapBox.style.display = 'none';
  home.style.display = '';
  window.scrollTo(0,0);
  document.title = baseTitle();
  refreshProgress();
}

/* 刷新首页进度看板：统计已完成数 + 章卡状态/进度条 */
function refreshProgress(){
  const prog = loadProg();
  const chapters = DATA.chapters;
  let doneCnt = 0;
  chapters.forEach((ch,di)=>{
    const d = di+1;
    const total = (ch.practice||[]).length;
    const rec = (prog['quiz_d'+d] && prog['quiz_d'+d].answered) || {};
    const nDone = Object.keys(rec).length;
    const right = Object.values(rec).filter(v=>v.right===1).length;
    const read = prog['read_d'+d] === 1;
    const pm = document.getElementById('pm-'+d);
    const pmn = document.getElementById('pmn-'+d);
    const pf = document.getElementById('pf-'+d);
    const card = pm ? pm.closest('.ch-card') : null;
    if(!pm) return;
    let state = '未开始', pct = 0;
    if(nDone >= total && total > 0){ state = '已完成'; doneCnt++; card.classList.add('done'); }
    else if(read || nDone > 0){ state = nDone > 0 ? '学习中 ' + nDone + '/' + total : '学习中'; }
    pm.textContent = state;
    if(card) card.classList.toggle('done', nDone >= total && total > 0);
    pct = total ? Math.round(nDone/total*100) : 0;
    if(pf) pf.style.width = pct + '%';
    if(pmn) pmn.textContent = total ? ('答对 ' + right + '/' + total) : '';
  });
  const od = document.getElementById('ovDone');
  if(od) od.textContent = doneCnt;
}

/* ============ 启动 ============ */
if(!DATA){
  document.body.innerHTML = '<div style="padding:60px 24px;text-align:center;font-size:14px;color:#64748b">学习数据未注入：此模板需经构建脚本注入数据后方可使用。</div>';
} else {
  buildHome();
  buildPanels();
  refreshProgress();
}

/* ============ 合体视图切换：学习区 ↔ 题库刷题区 ============
   quiz-embed 内的「← 返回学习目录」按钮与底部导航「📚 学习」都调用 window.kbShowLearnHome */
function kbShowQuiz(){
  detachSpy();
  closeSide();
  home.style.display = 'none';
  chapBox.style.display = 'none';
  const f = document.querySelector('.footer'); if(f) f.style.display = 'none';
  // 修复：.wrap 外壳仅藏子元素会残留 padding（24+60px），把题库顶栏顶离顶部 84px
  // → 外壳自身一并隐藏，保证进入题库视图即贴顶
  const w = document.querySelector('.wrap'); if(w) w.style.display = 'none';
  const qv = document.getElementById('quizView');
  if(qv){
    qv.style.display = 'block';
    const tt = document.getElementById('qzTopTitle');
    if(tt) tt.textContent = (DATA.meta.cnName ? DATA.meta.exam + ' · ' + DATA.meta.cnName : DATA.meta.exam) + ' 题库刷题';
  }
  window.scrollTo(0,0);
  document.title = baseTitle() + ' · 题库刷题';
}
function kbShowLearnHome(){
  detachSpy();
  closeSide();
  const qv = document.getElementById('quizView');
  if(qv) qv.style.display = 'none';
  const f = document.querySelector('.footer'); if(f) f.style.display = '';
  home.style.display = '';
  const w = document.querySelector('.wrap'); if(w) w.style.display = '';
  window.scrollTo(0,0);
  document.title = baseTitle();
  refreshProgress();
}
window.kbShowQuiz = kbShowQuiz;
window.kbShowLearnHome = kbShowLearnHome;
})();
</script>
<script>
/* 图灯箱（移动适配 P1=A）：正文图当前渲染等效字号 <9.5px 时点击可放大到原始 viewBox 尺寸
   等效字号 = 图内最小 text 字号 × (当前渲染宽 ÷ viewBox 宽)；桌面可读图不触发，不打断阅读 */
(function(){
  'use strict';
  var box = null, stage = null;
  function minFontPx(svg){
    var t = svg.querySelectorAll('text'), mn = Infinity;
    for (var i = 0; i < t.length; i++){
      var v = parseFloat(t[i].getAttribute('font-size'));
      if (isNaN(v)){ var cs = getComputedStyle(t[i]); v = parseFloat(cs.fontSize); }
      if (!isNaN(v) && v < mn) mn = v;
    }
    return isFinite(mn) ? mn : 12;
  }
  function effFont(svg){
    var vb = svg.viewBox && svg.viewBox.baseVal;
    if (!vb || !vb.width) return 99;                 // 无 viewBox：不介入
    var w = svg.getBoundingClientRect().width || vb.width;
    return minFontPx(svg) * (w / vb.width);
  }
  function close(){
    if (box) box.classList.remove('show');
    document.documentElement.style.overflow = '';
  }
  function open(svg){
    if (!box){
      box = document.createElement('div');
      box.className = 'fig-lightbox';
      box.innerHTML = '<button class="lb-close" aria-label="关闭放大图">✕</button><div class="lb-stage"></div>';
      document.body.appendChild(box);
      stage = box.querySelector('.lb-stage');
      box.querySelector('.lb-close').addEventListener('click', close);
      box.addEventListener('click', function(e){ if (e.target === box) close(); });
    }
    var vb = svg.viewBox.baseVal;
    var clone = svg.cloneNode(true);
    clone.style.width = vb.width + 'px';             // 原始 viewBox 尺寸 1:1
    clone.style.maxWidth = 'none';
    clone.style.height = 'auto';
    stage.innerHTML = '';
    stage.appendChild(clone);
    box.classList.add('show');
    document.documentElement.style.overflow = 'hidden';
    stage.scrollTop = 0; stage.scrollLeft = 0;
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
  document.addEventListener('click', function(e){
    var svg = e.target.closest ? e.target.closest('.fig-body svg') : null;
    if (!svg) return;
    if (effFont(svg) >= 9.5) return;                 // 当前渲染下可读 → 不打断
    e.preventDefault();
    open(svg);
  });
})();
</script>
