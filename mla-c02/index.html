题干是典型的日志条件聚合分析，正对 Logs Insights。\n\n**其他选项为什么错：**\n- A. X-Ray 擅长「哪一跳慢」的链路定位，不是跨请求的特征聚合。\n- C. 容器日志是原始数据源，没有查询聚合层。\n- D. Budgets 是成本工具。\n\n**关键概念：** 四工具按问题类型选：多快/多错→指标；慢在哪一跳→X-Ray；慢的请求长什么样→Logs Insights；容器内发生了什么→容器日志。","s":"自编·4.2.2"},{"id":"D4-030","d":4,"t":"single","q":"按教材「三个角色的三种看板」，业务/管理层看的仪表盘应该放什么，更新频率如何？","o":[{"l":"A","t":"实例 CPU 利用率，实时"},{"l":"B","t":"模型训练超参，实时"},{"l":"C","t":"调用量、成本、采纳率、投诉率；天/周"},{"l":"D","t":"与运维看板完全相同"}],"a":["C"],"e":"**正确答案：C。** 业务看板看钱与效果，按天/周更新。\n\n**为什么对：** 教材「三个角色的三种看板」：值班/运维（可用性、错误率、延迟、告警——实时）；ML 工程师（模型指标、漂移、数据质量、版本——小时/天）；**业务/管理层（调用量、成本、采纳率、投诉率——天/周）**。看板设计的第一原则是「按谁来看、看完要做什么组织」，不是把所有指标堆上去。\n\n**其他选项为什么错：**\n- A. CPU 利用率是运维视角，管理层无法据其决策。\n- B. 超参是 ML 工程师的版本信息，对管理层是噪声。\n- D. 三个角色的关注点完全不同，照抄运维看板违背设计原则。\n\n**关键概念：** 看板三角色：值班（实时救火）、工程师（小时/天排障调优）、管理层（天/周看钱与业务）。每个面板都要能回答「看完做什么」。","s":"自编·4.2.3"},{"id":"D4-031","d":4,"t":"single","q":"一次成本异常：月账单涨 40%，但成本看板只看到总额上升。排查发现调用量只涨 8%，而每次调用的输入 token 涨了 55%（某次改动把整段对话历史塞进了 prompt）。按教材，看板缺了什么，最佳单一指标是什么？","o":[{"l":"A","t":"缺更多总额维度的图，最佳指标是月总额"},{"l":"B","t":"应该取消成本看板"},{"l":"C","t":"应该只看账单 PDF"},{"l":"D","t":"成本面板必须与调用量放一起——只看花费会误判；「每千次调用成本」是成本异常检测的最佳单一指标"}],"a":["D"],"e":"**正确答案：D。** 单位成本才是异常检测指标。\n\n**为什么对：** 教材「成本面板必须与调用量放一起」：**只看花费会误判（花得多可能是量涨了），要算「单位成本」；「每千次调用成本」是成本异常检测的最佳单一指标**。教学案例与本题主干一致：总额 +40% 被拆成「量 +8% × 单次成本 +30% 左右」，进一步定位到输入 token +55%——加了「平均输入 token 数」面板后这类问题当天可发现。\n\n**其他选项为什么错：**\n- A. 总额图再多也区分不了「量涨」与「单次贵」。\n- B. 取消看板放弃可观测性。\n- C. 账单 PDF 滞后且无归因维度。\n\n**关键概念：** 成本看板三件套：每日花费 + 调用量 + 每千次调用成本（按模型/接口拆分）。任何成本异常先拆「量 × 单价」。","s":"自编·4.2.3"},{"id":"D4-032","d":4,"t":"single","q":"按教材的「红黄绿三色原则」，仪表盘的第一价值是什么？","o":[{"l":"A","t":"30 秒内判断有没有事——每个面板顶部放综合状态灯，越界即变红"},{"l":"B","t":"提供尽可能多的数据维度"},{"l":"C","t":"展示团队的技术实力"},{"l":"D","t":"替代所有告警"}],"a":["A"],"e":"**正确答案：A。** 30 秒判断有没有事。\n\n**为什么对：** 教材「红黄绿三色原则」：**每个面板顶部放一个综合状态灯，越界即变红。看板的第一价值是「30 秒内判断有没有事」，不是「提供全部数据」**。这个原则决定看板的信息架构：状态灯在最上层（结论），细节在下层（证据），与「值班人员 30 秒扫一眼就要得出有无事故」的使用场景匹配。\n\n**其他选项为什么错：**\n- B. 数据维度多是细节层的事，堆在第一层反而拖慢判断。\n- C. 看板是运维工具不是展示品。\n- D. 看板与告警互补：告警主动找人，看板被动查看；互相不能替代。\n\n**关键概念：** 看板分层：状态灯（有无事）→ 六块面板（健康/流量/质量/数据/成本/版本）→ 明细下钻。","s":"自编·4.2.3"},{"id":"D4-033","d":4,"t":"single","q":"有成员提议「把在线服务的平均利用率提到 90%，把每分钱算力都用满」。按教材，这个目标为什么通常不现实？","o":[{"l":"A","t":"监控工具测不到 90%"},{"l":"B","t":"为应对突发，生产系统通常只能跑到 40–60% 的平均利用率——提到 90% 意味着没有余量应对峰值"},{"l":"C","t":"90% 会导致计费错误"},{"l":"D","t":"利用率与容量无关"}],"a":["B"],"e":"**正确答案：B。** 余量是必须付出的成本。\n\n**为什么对：** 教材「利用率的现实区间」：**为了应对突发，生产系统通常只能跑到 40–60% 的平均利用率。「把利用率提到 90%」这种目标在在线服务里通常不现实——它意味着没有余量应对峰值**。容量三目标（性能/成本/可靠）互斥：把利用率推到极限，就是把「可靠」清零——下一个流量尖峰直接打穿容量。\n\n**其他选项为什么错：**\n- A. 利用率测量没有障碍，问题在目标本身。\n- C. 与计费机制无关。\n- D. 利用率正是容量余量的直接度量。\n\n**关键概念：** 三目标互斥：极致成本→牺牲余量；绝对可靠→必然浪费。生产解法是中间态：40–60% 利用率 + 削峰/降级/缓存提升「有效容量」。","s":"自编·4.2.4"},{"id":"D4-034","d":4,"t":"single","q":"一个问答服务按峰值买容量，利用率仅 35%。改造后容量降到原来的 55%、SLA 仍达标、成本降 45%。按教材，这个改造的三层结构是什么？","o":[{"l":"A","t":"更多实例 + 更多实例 + 更便宜的实例"},{"l":"B","t":"换云厂商 + 换模型 + 换团队"},{"l":"C","t":"①正常请求走主模型 ②队列积压超 2 秒降级为简短回答模式（小模型+限 100 token）③极限情况返回缓存答案并提示稍后重试"},{"l":"D","t":"关闭监控 + 关闭告警 + 关闭日志"}],"a":["C"],"e":"**正确答案：C。** 主模型 → 降级模式 → 缓存兜底三层。\n\n**为什么对：** 教材教学案例与本题主干一致：①正常请求走主模型 ②队列积压超 2 秒时降级为「简短回答模式」（小模型 + 限 100 token）③极限情况返回缓存答案 + 提示「稍后重试」。这是「降级路径是容量设计的必需品」的完整落地：**没有降级方案的系统在流量翻倍时只能全部超时；有降级的系统至少能保住核心功能**。\n\n**其他选项为什么错：**\n- A. 全是加实例，没有解决「峰值利用率低」的结构问题。\n- B. 与容量设计无关。\n- D. 自毁可观测性。\n\n**关键概念：** 提升有效容量三条路（比加实例更好）：削峰（排队+异步化）、降级（切小模型/短回答）、缓存（相同请求复用）。降级路径让「容量不足」从全损变成可控的体验降级。","s":"自编·4.2.4"},{"id":"D4-035","d":4,"t":"single","q":"容量优化的三个目标——性能、成本、可靠——按教材的关系是什么？","o":[{"l":"A","t":"三者可以同时做到极致"},{"l":"B","t":"只需要优化成本，其他不重要"},{"l":"C","t":"只需要保证性能，成本无限"},{"l":"D","t":"三者互斥：追求极致成本必然牺牲余量，追求绝对可靠必然浪费；要在量化指标上找平衡（P99 ≤ SLA / 单位成本最低 / 容量不足失败率 < 0.1%）"}],"a":["D"],"e":"**正确答案：D。** 三目标互斥，靠量化指标找平衡。\n\n**为什么对：** 教材「容量优化同时追三个目标——够用（性能）、不浪费（成本）、有余量（可靠）。三者互斥：追求极致成本必然牺牲余量，追求绝对可靠必然浪费」。量化表达：性能=P99 ≤ SLA（按峰值+缓冲）；成本=单位请求成本最低（提利用率/选对实例/批量）；可靠=容量不足失败率 < 0.1%（留余量+降级路径）。工程含义：三个目标各定一条量化线，在设计里同时满足，而不是追求任一方向的极致。\n\n**其他选项为什么错：**\n- A. 「同时极致」在数学上就不成立（余量与利用率此消彼长）。\n- B. 只压成本会击穿 SLA 与可靠性。\n- C. 成本失控同样是事故。\n\n**关键概念：** 容量设计三线：性能线（P99/SLA）、成本线（单位请求成本）、可靠线（失败率/余量）。三线都量化，才能讨论取舍。","s":"自编·4.2.4"},{"id":"D4-036","d":4,"t":"multiple","q":"按教材，提升「有效容量」的三条路（比加实例更好）是哪些？（选三项）","o":[{"l":"A","t":"削峰：排队 + 异步化，把突发摊平"},{"l":"B","t":"降级：容量不足时切小模型/短回答，保可用性"},{"l":"C","t":"缓存：相同请求复用结果"},{"l":"D","t":"提高单价让用户少用"}],"a":["A","B","C"],"e":"**正确答案：ABC。**\n\n**为什么对：** 教材「提升有效容量的三条路（比加实例更好）」：①**削峰——排队 + 异步化，把突发摊平**；②**降级——容量不足时切小模型/短回答，保可用性**；③**缓存——相同请求复用结果**。三条路的共同点：不增加常驻算力，而是改变「需求到达的形状」与「每个请求消耗的容量」。\n\n**其他选项为什么错：**\n- D. 涨价是商务手段不是容量工程，且伤害业务。\n\n**关键概念：** 「有效容量」= 同样硬件能服务的更多请求。削峰改到达曲线、降级改单请求成本、缓存消灭重复请求；三条路都不翻倍账单，加实例翻倍。","s":"自编·4.2.4"},{"id":"D4-037","d":4,"t":"single","q":"「如何防止成本失控？」按教材，为什么只配 AWS Budgets 预算告警不够？","o":[{"l":"A","t":"预算告警只发通知、不阻止花费——真正的止损要靠 Service Quotas（硬上限）与应用级限流（限制调用速率与总量）"},{"l":"B","t":"Budgets 收费太贵"},{"l":"C","t":"Budgets 只支持年度预算"},{"l":"D","t":"预算告警会自动停机"}],"a":["A"],"e":"**正确答案：A。** 告警是通知，配额与限流才是刹车。\n\n**为什么对：** 教材三层管控机制：预算告警（Budgets，超阈值**通知，不阻断**）、服务配额（Service Quotas，**限制最大资源数，硬上限**）、应用级限流（API Gateway/自建，限制调用速率与总量）；并明确：**「预算告警不防事故」这个区别很关键——真正的止损要靠配额（如限制端点最大实例数）与限流（限制单用户调用量）。考试里出现「如何防止成本失控」，正确答案通常包含配额或限流，而不只是预算告警**。\n\n**其他选项为什么错：**\n- B. 与收费无关，是机制问题。\n- C. Budgets 支持多种周期。\n- D. 说反了：Budgets 恰恰不会自动停机，这是它的局限。\n\n**关键概念：** 三层管控分工：Budgets（看得见）、Quotas（闸得住）、限流（控得住单个调用方）。防失控至少要后两层之一。","s":"自编·4.2.5"},{"id":"D4-038","d":4,"t":"single","q":"一个开发环境误把批量推理作业跑在全量数据上（1.2 亿条），未设实例上限，一夜花掉 3.8 万元。按教材的整改方案，正确组合是什么？","o":[{"l":"A","t":"批评当事人，制度上禁止夜间跑作业"},{"l":"B","t":"按环境设 Service Quotas（dev 环境 GPU 实例最多 2 台）+ 批量作业显式声明最大分片数 + 日预算告警与异常检测 + 非生产环境强制打 env=dev 标签"},{"l":"C","t":"把开发环境的所有配额提高，避免再卡住"},{"l":"D","t":"把数据删掉一部分"}],"a":["B"],"e":"**正确答案：B。** 配额 + 作业约束 + 告警 + 标签四件套。\n\n**为什么对：** 教材教学案例与本题主干一致，整改四条：①**按环境设 Service Quotas（dev 环境 GPU 实例最多 2 台）**——硬上限防复发；②批量作业必须显式声明最大分片数；③日预算告警 + 异常检测；④非生产环境强制打 `env=dev` 标签便于单独核算。核心逻辑：事故的根因是「dev 环境拥有生产级的资源能力」，用配额把环境间的爆炸半径隔开。\n\n**其他选项为什么错：**\n- A. 人的约束不防下一次；机制才防。\n- C. 提高配额是反向操作，放大爆炸半径。\n- D. 删数据损害业务，且不解决「无上限」的机制漏洞。\n\n**关键概念：** 成本管控的爆炸半径思维：按环境分配额、按作业声明上限、按标签归因。预算告警兜底感知，配额真正止血。","s":"自编·4.2.5"},{"id":"D4-039","d":4,"t":"single","q":"成本归因依赖资源标签（环境/业务线/模型/团队）。按教材，标签应该在什么时候打，最可靠的做法是什么？","o":[{"l":"A","t":"月底结算前统一补打"},{"l":"B","t":"标签不重要，靠记忆归因"},{"l":"C","t":"从创建时就打——事后补标签极其困难（资源可能已被删）；在 IaC 里强制标签是最可靠的做法"},{"l":"D","t":"只给昂贵的资源打标签"}],"a":["C"],"e":"**正确答案：C。** 创建时打标，IaC 强制。\n\n**为什么对：** 教材「成本归因的四个维度（标签策略）」：环境（prod/dev）、业务线、模型/应用、团队；并明确**「标签必须从创建时就打，事后补标签极其困难（资源可能已被删）。在 IaC 里强制标签是最可靠的做法」**。IaC 强制的含义：模板里没标签就无法部署，从机制上保证归因维度完整。\n\n**其他选项为什么错：**\n- A. 补打时资源可能已删除，且中间账单已无法归因。\n- B. 记忆不可审计。\n- D. 便宜资源的费用积少成多，且「便宜」会变。\n\n**关键概念：** 标签四维（环境/业务线/模型/团队）+ Cost Explorer 按标签分组 = 「这笔钱是谁花的」的可回答性；与 4.2.5 的配额、异常检测共同构成成本治理。","s":"自编·4.2.5"},{"id":"D4-040","d":4,"t":"single","q":"月底账单复盘会上，财务问有没有办法在「某服务某天突然多花一大笔钱」时第一时间知道。按教材，AWS Cost Anomaly Detection 对哪类成本事故特别有效？","o":[{"l":"A","t":"长期缓慢的折扣变化"},{"l":"B","t":"已经取消的订阅"},{"l":"C","t":"免费额度的使用情况"},{"l":"D","t":"「某服务某天突然多花 X 元」的突发异常——对「训练作业忘了关」这类事故特别有效"}],"a":["D"],"e":"**正确答案：D。** 突发异常检测。\n\n**为什么对：** 教材「异常检测」：**AWS Cost Anomaly Detection 可以发现「某服务某天突然多花 X 元」。它对「训练作业忘了关」这类事故特别有效**。其价值在于按服务/维度建模「正常花费区间」，偏离即告警——抓的是「行为型异常」（忘关作业、配置错误、失控循环），这类事故的特征正是「平时没有、某天突增」。\n\n**其他选项为什么错：**\n- A. 缓慢变化不是它的目标场景（且折扣变化可预测）。\n- B. 取消的订阅不再产生费用。\n- C. 免费额度不产生账单。\n\n**关键概念：** 成本感知三件套：Budgets（阈值告警）+ Anomaly Detection（行为异常）+ Cost Explorer 按标签归因（定位到谁）。三者分别管「超线」「异常」「归谁」。","s":"自编·4.2.5"},{"id":"D4-041","d":4,"t":"single","q":"按教材「四种买法的组合策略（生产标准做法）」，基线负载、峰值负载、容错任务分别应该用什么买法？","o":[{"l":"A","t":"基线→预留/Savings Plans；峰值→按需；溢出/突发→按需+限流保护；容错任务（训练、批处理）→Spot"},{"l":"B","t":"全部用按需，最灵活"},{"l":"C","t":"全部用 Spot，最便宜"},{"l":"D","t":"基线用 Spot，峰值用预留"}],"a":["A"],"e":"**正确答案：A。** 按负载确定性分配买法。\n\n**为什么对：** 教材组合策略原文：**基线负载（全天都在跑的）→ 预留 / Savings Plans；峰值负载（每天高峰几小时）→ 按需；溢出/突发 → 按需 + 限流保护；容错任务（训练、批处理）→ Spot**。并总结：**「打底 + 溢出」是所有成本优化的通用形状——稳定部分买承诺、波动部分按量，无论是实例、FM 容量还是数据库**。\n\n**其他选项为什么错：**\n- B. 全按需单价最高，稳定的基线白白放弃折扣。\n- C. 全 Spot 忽略了实时服务不能被中断的硬约束。\n- D. 方向颠倒：Spot 只给容错任务，基线恰恰最需要承诺折扣。\n\n**关键概念：** 「打底 + 溢出」通用形状：3.1.4 的预置吞吐+按需、3.2.1 的 SP+按需、本条的预留+按需，都是同一形状在不同对象上的实例。","s":"自编·4.2.6"},{"id":"D4-042","d":4,"t":"single","q":"一个试验性新业务想签 3 年的 Savings Plans 拿最深折扣。按教材，判断依据是什么？","o":[{"l":"A","t":"折扣越深越应该签"},{"l":"B","t":"看负载确定性与业务规划期——1/3 年承诺在业务变化时变成沉没成本；新业务、试验性业务不要签长期承诺"},{"l":"C","t":"承诺期与业务无关"},{"l":"D","t":"应该签 5 年更划算"}],"a":["B"],"e":"**正确答案：B。** 承诺期匹配业务确定性。\n\n**为什么对：** 教材「承诺期的风险」：**1 年或 3 年承诺在业务变化时会变成沉没成本。判断依据：这项负载的确定性有多高、业务规划期有多长。新业务、试验性业务不要签长期承诺**。试验性业务的负载可能三个月后翻倍、减半或直接下线——承诺锁死的是「花钱的义务」，业务没了钱照付。\n\n**其他选项为什么错：**\n- A. 折扣深度是回报，沉没成本是风险，只看回报不看风险。\n- C. 承诺期恰恰是这类决策的核心变量。\n- D. 更长的承诺风险更大。\n\n**关键概念：** 承诺购买两问：这项负载确定存在吗？业务规划期覆盖承诺期吗？两问都「是」才签；否则按需起步，稳定后再承诺。","s":"自编·4.2.6"},{"id":"D4-043","d":4,"t":"single","q":"一个 ML 平台的月账单拆解：训练 42%、推理 31%、存储 18%、网络 9%。按教材的优化动作组合，网络与存储侧各能做什么？","o":[{"l":"A","t":"网络没法优化，存储只能加机器"},{"l":"B","t":"把数据全部下载到本地再处理"},{"l":"C","t":"存储：S3 生命周期策略（冷数据转低频/归档）、清理废弃版本；网络：补 S3/DynamoDB 网关端点替代 NAT（按流量计费，量大很贵）、计算放到数据旁边避免跨区"},{"l":"D","t":"取消所有备份"}],"a":["C"],"e":"**正确答案：C。** 存储分层 + 网关端点 + 就近计算。\n\n**为什么对：** 教材「存储与网络也占成本（常被忽略）」表：S3 存储→**生命周期策略（冷数据转低频繁/归档）、清理废弃版本**；向量库→降维、量化、按热度分层；跨区传输→**把计算放到数据旁边（同区域处理）**；NAT 网关→**用 S3/DynamoDB 网关端点替代（按流量计费，量大很贵）**。教学案例：补 S3 网关端点后网络成本降 70%、S3 加生命周期降 40%，总账单 18 万→10.4 万且未削减业务功能。\n\n**其他选项为什么错：**\n- A. 两者都有成熟优化手段。\n- B. 本地下载不可规模化且更贵。\n- D. 取消备份是合规与可靠性灾难。\n\n**关键概念：** 成本优化不只盯算力：训练（Spot）、推理（SP/单位成本）、存储（生命周期）、网络（网关端点/就近）四条线一起抓。","s":"自编·4.2.6"},{"id":"D4-044","d":4,"t":"single","q":"按教材「FM 成本的四个驱动因素（按影响大小排序）」，排在前两位的是什么，各自的主要优化手段是什么？","o":[{"l":"A","t":"模型档位与输出长度；换最便宜的模型即可"},{"l":"B","t":"实例规格与区域选择"},{"l":"C","t":"GPU 型号与驱动版本"},{"l":"D","t":"调用次数（线性）与输入 token 数（线性）；调用次数靠缓存/批处理/路由分层，输入 token 靠精简 prompt、RAG 只喂相关块、压缩对话历史"}],"a":["D"],"e":"**正确答案：D。** 调用次数与输入 token 是前两大杠杆。\n\n**为什么对：** 教材四驱动因素按影响排序：**调用次数（线性：缓存、批处理、路由分层——简单问题不调大模型）、输入 token 数（线性：精简 prompt、RAG 只喂相关块、压缩对话历史）、输出 token 数（线性且单价通常更高：限 max_tokens、要求简洁、结构化输出）、模型档位（数倍到数十倍：分层路由、蒸馏）**。FM 成本由 token 决定，token = 输入长度 × 调用次数 + 输出长度——前两位直接命中公式的两个乘数。\n\n**其他选项为什么错：**\n- A. 模型档位影响大（数倍到数十倍）但排在第四——因为多数业务不能随意降档；且「换最便宜」牺牲质量。\n- B、C. 实例/GPU 是自托管视角，按 token 计费的 FM 调用无此维度。\n\n**关键概念：** FM 成本公式：月成本 ≈ 月调用次数 × [(输入 token × 输入单价) + (输出 token × 输出单价)]。降本先动乘数（次数、输入），再动单价（档位）。","s":"自编·4.2.7"},{"id":"D4-045","d":4,"t":"single","q":"关于 FM 的输入与输出 token 单价，教材给出的经验事实是什么，它对优化优先级意味着什么？","o":[{"l":"A","t":"多数 FM 的输出单价是输入的 2–4 倍——「少说废话」比「少给资料」更省钱，但取舍要看质量要求"},{"l":"B","t":"输入比输出贵，优先压缩输入"},{"l":"C","t":"两者单价完全相同"},{"l":"D","t":"输出免费"}],"a":["A"],"e":"**正确答案：A。** 输出比输入贵 2–4 倍。\n\n**为什么对：** 教材原文：**「输出比输入贵」这一条要记住——多数 FM 的输出单价是输入的 2–4 倍。所以「少说废话」比「少给资料」更省钱——但两者的取舍要看质量要求**。机理：生成是逐 token 串行的（3.1.7），计算成本更高；优化含义是限 max_tokens、要求简洁输出、结构化输出等「压输出」手段的单 token 收益更高。\n\n**其他选项为什么错：**\n- B. 方向反了。\n- C. 「完全相同」不是主流定价。\n- D. 输出恰是更贵的一侧。\n\n**关键概念：** 优先级修正：因输出单价更高，压输出的杠杆率更高；但输出长度常直接关联答案质量（完整度），所以「要看质量要求」——不能为了省钱把答案砍残。","s":"自编·4.2.7"},{"id":"D4-046","d":4,"t":"single","q":"一个 FM 应用的输入成本三个月内悄悄涨了 20 倍，「没人改过计费」。排查发现：系统提示从 200 token 膨胀到 800（规则累积）、检索上下文从 3 块加到 10 块、对话历史从摘要改为全量保留。按教材，这说明了什么，必须配套什么监控？","o":[{"l":"A","t":"计费系统出错，应联系云厂商"},{"l":"B","t":"输入长度的隐性膨胀——渐进的小改动叠加成大成本；必须有「平均输入 token 数」的监控（呼应成本看板）"},{"l":"C","t":"应该立即换最便宜的模型了事"},{"l":"D","t":"用户提问变多了，正常现象"}],"a":["B"],"e":"**正确答案：B。** 输入膨胀是渐进的成本事故。\n\n**为什么对：** 教材「输入长度的隐性膨胀（最常见的成本事故）」给出了与本题完全一致的演进示例：系统提示 200→800（加规则）、检索上下文 3 块→10 块（3000 token）、对话历史 0→2000（全量保留），单次成本 250→5850 token **「→ 单次成本涨 23 倍，而没人改过计费」**；并明确**「这个膨胀过程是渐进的，所以必须有『平均输入 token 数』的监控（呼应 4.2.3）**。\n\n**其他选项为什么错：**\n- A. 计费没错，是每次调用的 token 变了。\n- C. 换模型治标，输入膨胀的病根在 prompt 与上下文策略。\n- D. 题干变化在单次输入结构，不是调用次数。\n\n**关键概念：** 成本看板必配「平均输入 token 数」面板：它是输入膨胀最早、最灵敏的信号，配合「每千次调用成本」当天可发现异常。","s":"自编·4.2.7"},{"id":"D4-047","d":4,"t":"single","q":"要用成本公式对比「RAG vs 微调」「大模型 vs 小模型」两个方案，按教材，答题要答到什么程度？","o":[{"l":"A","t":"必须精确到小数点后两位"},{"l":"B","t":"成本无法估算，只能上线后看账单"},{"l":"C","t":"用「月成本 ≈ 月调用次数 × [(平均输入 token × 输入单价) + (平均输出 token × 输出单价)]」算出量级差与方向即可，不必精确数字"},{"l":"D","t":"只需要比较模型下载速度"}],"a":["C"],"e":"**正确答案：C。** 答结构与方向，不抠精确数字。\n\n**为什么对：** 教材「成本估算的实操公式」给出月成本公式，并明确：**用它做方案对比——RAG vs 微调、大模型 vs 小模型、全量上下文 vs 摘要，都能算出一个量级差。考试里的「成本对比」题，答出这个结构和方向即可，不必精确数字**。公式的价值是把「感觉 A 便宜」变成「A 的调用次数少一半、单次输入短三分之二」的可论证比较。\n\n**其他选项为什么错：**\n- A. token 用量本身有波动，精确到分毫无意义。\n- B. 上线前不估算等于放弃方案选型的依据。\n- D. 与成本无关。\n\n**关键概念：** 成本估算三输入：调用次数（业务侧）、输入/输出 token（方案侧）、单价（价目表）。方案对比＝固定两个输入，算第三个的量级差。","s":"自编·4.2.7"},{"id":"D4-048","d":4,"t":"single","q":"按教材，Agent 成本监控与普通模型调用的根本区别是什么？","o":[{"l":"A","t":"没有区别，都按单次调用看"},{"l":"B","t":"Agent 不产生成本"},{"l":"C","t":"只监控工具调用的费用即可"},{"l":"D","t":"Agent 的成本单位是「任务」而非「调用」——一个任务可能包含 20 次模型调用 + 15 次工具调用，监控单位必须从调用改成任务"}],"a":["D"],"e":"**正确答案：D。** 计量单位从调用升级为任务。\n\n**为什么对：** 教材定义：**Agent 的成本不是「一次调用」，而是「一次任务」——一个任务可能包含 20 次模型调用 + 15 次工具调用。监控单位必须从「调用」改成「任务」**。只看单次调用会严重低估真实成本，也发现不了「步数膨胀」型问题；按任务计量才能看到 P50/P95 单任务成本、成本最高的任务类型、异常任务（成本 > 均值 5 倍）。\n\n**其他选项为什么错：**\n- A. 单位错了，一切分析都会失真。\n- B. Agent 每步都是模型调用，成本通常更高。\n- C. 模型调用（步数 × token）恰是大头，只看工具费是舍本逐末。\n\n**关键概念：** Agent 成本四组成：模型调用（大头）、工具调用、检索、状态存储；看板按任务展示 P50/P95、Top 任务类型、异常任务。","s":"自编·4.2.8"},{"id":"D4-049","d":4,"t":"single","q":"为什么说「历史累积」是 Agent 成本的隐形放大器，「限制步数」为什么同时是成本手段？按教材回答。","o":[{"l":"A","t":"第 10 步的请求包含前 9 步的完整历史，token 消耗随步数超线性增长——所以限制步数同时是在限成本"},{"l":"B","t":"历史会自动被压缩，没有影响"},{"l":"C","t":"步数与成本无关"},{"l":"D","t":"历史越长回答越好，应鼓励累积"}],"a":["A"],"e":"**正确答案：A。** 历史随步数累积，成本超线性增长。\n\n**为什么对：** 教材原话：**「历史累积」是 Agent 成本的隐形放大器：第 10 步的请求包含前 9 步的完整历史，所以 token 消耗随步数超线性增长。这就是「限制步数」同时是成本手段的原因**。第 n 步的输入 token ≈ 前 n−1 步的历史总和，步数翻倍不只是调用次数翻倍，单次调用的 token 也在涨——双重放大。\n\n**其他选项为什么错：**\n- B. 除非显式做摘要/结构化记忆（3.2.9），否则历史不会被自动压缩。\n- C. 步数 ×（历史长度）正是成本公式的主项。\n- D. 无界历史会撑爆上下文窗口且成本失控，与 3.2.9 的管理策略矛盾。\n\n**关键概念：** 步数上限的三重身份：安全护栏（防循环）、成本护栏（限 token）、质量指标（绕路检测）。与 3.2.11「最大步数是必需品」同一件事的成本侧表述。","s":"自编·4.2.8"},{"id":"D4-050","d":4,"t":"multiple","q":"一个内部 Agent 平台准备开放给全公司使用，预算管控被提上日程。按教材，Agent 必设的三个成本护栏是哪些？（选三项）","o":[{"l":"A","t":"最大步数：防循环烧钱"},{"l":"B","t":"单任务 token 预算：超预算强制终止并返回部分结果"},{"l":"C","t":"单用户/单租户配额：防单一用户刷爆"},{"l":"D","t":"把模型温度调到最高以减少步数"}],"a":["A","B","C"],"e":"**正确答案：ABC。**\n\n**为什么对：** 教材「三个必设的成本护栏」表：**最大步数（防循环烧钱）、单任务 token 预算（超预算强制终止并返回部分结果）、单用户/单租户配额（防单一用户刷爆）**。三者的防御对象不同：A 防失控循环、B 防单任务超支（即使不循环，一个复杂任务也可能烧很多）、C 防恶意或异常的单主体集中消耗。\n\n**其他选项为什么错：**\n- D. 温度与步数无因果关系，且高温增加输出随机性，反而可能诱发更多重试。\n\n**关键概念：** 三护栏对应三种威胁模型：逻辑 bug（循环）、复杂任务（合法但贵）、单主体滥用（刷爆）。缺任何一个都有对应的成本事故形态。","s":"自编·4.2.8"},{"id":"D4-051","d":4,"t":"single","q":"一个运维 Agent 月度成本是预期的 4 倍。按任务分析发现 85% 的成本来自 6% 的任务，共同特征是「工具调用超过 15 次」，抽查发现是权限错误导致查询一直返回空、Agent 不断重试。按教材，这个案例的启示是什么？","o":[{"l":"A","t":"成本高是因为模型太贵，换便宜的模型"},{"l":"B","t":"按任务计量的成本分析能定位异常任务——异常任务通常就是逻辑有问题的那些；修复根因（权限）后平均步数从 11.3 降到 3.8"},{"l":"C","t":"应该禁止 Agent 重试"},{"l":"D","t":"把工具调用上限设为 100"}],"a":["B"],"e":"**正确答案：B。** 异常任务＝逻辑问题的放大镜。\n\n**为什么对：** 教材「按任务计量的成本看板」：展示 P50/P95 单任务成本、成本最高的任务类型、异常任务（成本 > 均值 5 倍），并明确**「异常任务通常就是逻辑有问题的那些」**。教学案例与本题主干一致：85% 成本来自 6% 任务 → 共同特征（工具调用 >15 次）→ 根因（权限错误致查询恒空、Agent 反复重试）→ 修复权限后步数 11.3→3.8，成本回到预期 1.2 倍。\n\n**其他选项为什么错：**\n- A. 病根是权限导致的无效重试，换模型不解决且掩盖问题。\n- C. 禁止重试会把偶发失败变成任务失败，正确做法是修根因 + 失败次数规则。\n- D. 上限放宽到 100 合法化烧钱。\n\n**关键概念：** 成本排障链：按任务聚合 → 找异常任务群 → 提共同特征 → 追踪定位根因 → 修根因（权限/校验/提示），而不是降配置。","s":"自编·4.2.8"},{"id":"D4-052","d":4,"t":"single","q":"分层路由（简单请求给小模型、复杂给大模型）有三种判定方式。按教材，哪种最实用，为什么？","o":[{"l":"A","t":"按置信度：最先进"},{"l":"B","t":"按分类器：永远最优"},{"l":"C","t":"按规则（按接口/租户/长度路由）：最简单可靠——多数业务里「哪类请求需要强模型」是清楚的，过度工程化的路由本身就是成本"},{"l":"D","t":"随机分配，负载均衡"}],"a":["C"],"e":"**正确答案：C。** 规则路由最实用。\n\n**为什么对：** 教材「分层路由的判定方式」三种：按规则（按接口/租户/长度，最简单可靠）、按置信度（小模型先答，置信度低再升级，需置信度估计）、按分类器（训练小分类器判断难度）；结论原文：**「规则路由最实用：多数业务里『哪类请求需要强模型』是清楚的，不需要复杂的判定机制。过度工程化的路由本身就是成本**。\n\n**其他选项为什么错：**\n- A. 置信度路由需要可靠的置信度估计，实现成本高且有误判风险。\n- B. 分类器本身要训练维护，只在规则确实划不清时才值得。\n- D. 随机分配没有「简单→小模型」的降本逻辑，等于不路由。\n\n**关键概念：** 路由降本典型 40–70%（教材数据），但路由系统自身要便宜：判定逻辑的成本必须远小于它省下的差价，规则路由正是这个原则的体现。","s":"自编·4.2.9"},{"id":"D4-053","d":4,"t":"single","q":"语义缓存（语义相似度超阈值即返回缓存答案）有什么风险？按教材的正确使用约束是什么？","o":[{"l":"A","t":"没有风险，命中越多越好"},{"l":"B","t":"缓存只能用于图片"},{"l":"C","t":"语义缓存命中率必然 100%"},{"l":"D","t":"相似问题可能需要不同答案（如「北京今天天气」vs「北京明天天气」）——必须设较高的相似度阈值，且对时间敏感类问题禁用缓存"}],"a":["D"],"e":"**正确答案：D。** 语义近似 ≠ 答案相同。\n\n**为什么对：** 教材「缓存的三种粒度」：完全匹配（命中率低）、语义缓存（中高，**需注意误命中风险**）、前缀缓存（高，系统提示固定时）；并明确：**「语义缓存有风险：相似问题可能需要不同答案（『北京今天天气』vs『北京明天天气』）。必须设较高的相似度阈值，且对时间敏感类问题禁用缓存**。\n\n**其他选项为什么错：**\n- A. 「没有风险」正是误命中的根源认知。\n- B. 语义缓存正是文本场景的手段。\n- C. 命中率取决于重复度，不可能必然 100%。\n\n**关键概念：** 缓存三粒度按命中率与风险排序：完全匹配（安全但少）、语义（多但有误命中）、前缀（系统提示固定时最划算且无答案错配风险）。","s":"自编·4.2.9"},{"id":"D4-054","d":4,"t":"single","q":"四种 FM 降本架构手段中，蒸馏的典型降幅与代价是什么？按教材回答。","o":[{"l":"A","t":"典型降幅 60–90%（数量级）；代价是一次性训练成本，且能力上限受限（小模型学不到大模型的全部能力）"},{"l":"B","t":"降幅 10–40%，无代价"},{"l":"C","t":"降幅 0，纯粹是架构美化"},{"l":"D","t":"降幅 100%，且没有任何能力损失"}],"a":["A"],"e":"**正确答案：A。** 蒸馏降幅最大，但能力上限受限。\n\n**为什么对：** 教材「四种降本架构手段（按投入产出排序）」表：分层路由 40–70%（需可靠复杂度判定）、缓存 10–40%（命中率取决于重复度）、批量推理 30–50%（只适用非实时）、**蒸馏 60–90%——一次性训练成本，能力上限受限**。蒸馏的本质是「用一次性投入换长期低单价」，换来的是小模型在本任务上的表现，天花板低于大模型。\n\n**其他选项为什么错：**\n- B. 那是缓存的区间。\n- C. 蒸馏是实打实的数量级降本手段。\n- D. 「无能力损失」违背蒸馏原理，正是教材标注的代价。\n\n**关键概念：** 四手段选型看三点：请求可分层吗（路由）、重复度高吗（缓存）、实时吗（批量）、能力上限可接受吗（蒸馏）。四手段可叠加（教学案例三层改造降 68%）。","s":"自编·4.2.9"},{"id":"D4-055","d":4,"t":"single","q":"一个客服问答日调用 30 万次，分析发现 42% 是 20 个高频问题的重复、31% 可由小模型处理。按教材的三层改造，正确的组合是什么？","o":[{"l":"A","t":"全部升级用最大的模型保证质量"},{"l":"B","t":"高频问题加缓存（命中 38%）+ 简单问题路由到小模型 + 剩余走大模型；月成本降 68%，首答准确率不变"},{"l":"C","t":"只做缓存，不做路由"},{"l":"D","t":"关闭 20 个高频问题的服务"}],"a":["B"],"e":"**正确答案：B。** 缓存 + 路由 + 大模型三层。\n\n**为什么对：** 教材教学案例与本题主干一致：高频重复（42%）→ **加缓存（命中 38%）**；简单请求（31%）→ **路由到小模型**；其余 → 大模型。效果：月成本降 68%、首答准确率不变。这是 4.2.9 三种手段（缓存/路由/大模型兜底）的叠加应用：每层吃掉一类流量，大模型只处理真正需要它的请求。\n\n**其他选项为什么错：**\n- A. 全量大模型成本最高，且对简单问题是浪费。\n- C. 只做缓存放过 31% 的可路由流量，降本少一大截。\n- D. 高频问题恰是用户最常问的，关掉等于拒绝服务。\n\n**关键概念：** 流量分层是 FM 成本优化的总图：先问「这题重复吗」（缓存）、再问「这题难吗」（路由）、最后才到大模型。逐层过滤后大模型调用量可以降到一小部分。","s":"自编·4.2.9"},{"id":"D4-056","d":4,"t":"single","q":"RAG 的成本有三笔互不相同的账。按教材，是哪三笔，为什么必须分开监控？","o":[{"l":"A","t":"只有一笔：模型调用费"},{"l":"B","t":"电费、网费、房租"},{"l":"C","t":"生成 token（按输入/输出 token）、embedding 计算（按 token 建库 + 按查询次数）、向量库（按实例/存储/请求）——计费方式完全不同，混在一起看会找不到异常来源"},{"l":"D","t":"训练、评估、部署"}],"a":["C"],"e":"**正确答案：C。** 三笔账计费方式完全不同。\n\n**为什么对：** 教材定义：**RAG 的成本有三笔互不相同的账——生成 token、embedding 计算、向量库存储与查询。它们的计费方式完全不同，必须分开监控**。生成 token 按输入/输出计费（上下文长、调用多时贵）；embedding 按 token 建库 + 按查询次数（全量重建、频繁查询时贵）；向量库按实例/存储/请求（维度高、条目多、常驻实例时贵）。混看总额无法回答「为什么这个月贵了」。\n\n**其他选项为什么错：**\n- A. 只看生成费会漏掉 embedding 与向量库（教学案例里 embedding 费用甚至超过生成费用）。\n- B. 与 RAG 成本结构无关。\n- D. 那是 MLOps 三阶段，不是 RAG 三笔账。\n\n**关键概念：** 三笔账各自的「什么时候贵」：生成（上下文长/调用多）、embedding（重建/频繁查询）、向量库（维度高/条目多/常驻）。异常先定位到账，再定位到因。","s":"自编·4.2.10"},{"id":"D4-057","d":4,"t":"single","q":"向量库成本的三个驱动因素，按教材是什么？其中「分块越小」会带来什么影响？","o":[{"l":"A","t":"三个驱动是机房、电力、带宽；分块越小越省钱"},{"l":"B","t":"模型大小、训练时长、数据量"},{"l":"C","t":"分块大小与成本无关"},{"l":"D","t":"向量条数、向量维度、常驻 vs 按需；分块越小条目越多（512 token 分块比 1024 多一倍条目），存储与查询成本上升"}],"a":["D"],"e":"**正确答案：D。** 条数、维度、常驻模式。\n\n**为什么对：** 教材「向量库成本的三个驱动」：①**向量条数——分块越小条目越多，512 token 分块比 1024 多一倍条目**；②**向量维度——1024 维 vs 256 维，存储与查询成本差异明显**；③**常驻 vs 按需——托管向量库（如 OpenSearch Serverless）按最小容量计费，低流量时相对贵**。分块策略是检索质量与成本的交叉点：小块利于检索精度（3.1.8）但翻倍条目成本，需要权衡。\n\n**其他选项为什么错：**\n- A. 三驱动弄错，且「分块越小越省钱」方向反了。\n- B. 那是训练侧的成本因素。\n- C. 条目数与分块直接挂钩，教材给出了倍数关系。\n\n**关键概念：** 向量库降本三手段（教材）：降维、量化、按热度分层（热数据高性能索引、冷数据低成本存储）。","s":"自编·4.2.10"},{"id":"D4-058","d":4,"t":"single","q":"一次 RAG 优化试验中，团队换了三次 embedding 模型、改了两次分块策略，每次都全量重建索引，当月 embedding 费用超过生成费用。按教材，正确的纪律是什么？","o":[{"l":"A","t":"继续频繁试验，费用是进步的代价"},{"l":"B","t":"embedding 与分块决策先在 2% 样本上验证、全量重建前先估算 token 成本并报备、用影子索引做 A/B 验证通过才切换"},{"l":"C","t":"永远不要更换 embedding 模型"},{"l":"D","t":"把文档删掉一半减少重建量"}],"a":["B"],"e":"**正确答案：B。** 重建是被低估的成本，决策要前置验证。\n\n**为什么对：** 教材「重建索引是被低估的成本」：每次换 embedding 模型或改分块策略都要全量重新向量化，**10 万份文档 × 平均 5000 token = 5 亿 token 的 embedding 调用，一次就是一笔可观支出**；结论是「embedding 模型与分块策略要在建库前定好，别反复试」。教学案例的纪律与本选项一致：①2% 样本先行验证 ②全量重建前估算成本并报备 ③**影子索引 A/B，验证通过才切换**。\n\n**其他选项为什么错：**\n- A. 无约束的重建正是费用超支的直接原因。\n- C. 「永不更换」过僵——必要时换，但要按 B 的流程控制成本。\n- D. 删数据损害知识完整性。\n\n**关键概念：** embedding 费用的两个触发器：全量重建（建模决策变更）与频繁查询（业务侧）；监控指标「每日 embedding token 数」突增即提示重建或批量导入发生。","s":"自编·4.2.10"},{"id":"D4-059","d":4,"t":"multiple","q":"按教材「把安全检查左移到构建阶段」的三道扫描门，以下哪些属于这三道门？（选三项）","o":[{"l":"A","t":"依赖扫描：第三方库的已知 CVE，构建时扫，高危即阻断"},{"l":"B","t":"镜像扫描：基础镜像与系统包漏洞，推送到 ECR 时扫，高危即阻断"},{"l":"C","t":"代码扫描：硬编码密钥、注入风险、不安全反序列化，提交时扫，发现密钥即阻断"},{"l":"D","t":"上线后每半年人工翻一次代码"}],"a":["A","B","C"],"e":"**正确答案：ABC。**\n\n**为什么对：** 教材「三道扫描门」对照表：**依赖扫描（第三方库 CVE，构建时，高危阻断）、镜像扫描（基础镜像与系统包，推送 ECR 时，高危阻断）、代码扫描（硬编码密钥/注入/不安全反序列化，提交时，发现密钥即阻断）**。三道门的共同设计是「左移」：在镜像进仓库前、代码进仓库前就拦住，而不是上线后被扫出来。\n\n**其他选项为什么错：**\n- D. 半年一次的人工检查既不自动也不在门禁上，发现时漏洞早已进生产。\n\n**关键概念：** 左移三门的阻断条件各有重点：依赖高危 CVE、镜像高危 CVE、代码出现密钥。对应工具：ECR 推送扫描、CodeBuild 构建扫描、Amazon Inspector 持续扫描。","s":"自编·4.3.1"},{"id":"D4-060","d":4,"t":"single","q":"团队成员习惯在 notebook 里把 API key 写死在代码里，然后提交到仓库。按教材，这个问题为什么在 ML 场景高发，正确做法是什么？","o":[{"l":"A","t":"「硬编码密钥」是 ML 场景高发问题（notebook 习惯写死后被提交）；必须用 Secrets Manager 或参数存储，且在 CI 里加密钥扫描（提交前拦截）"},{"l":"B","t":"写死更方便，没有风险"},{"l":"C","t":"把密钥写在 README 里就不算代码"},{"l":"D","t":"换一个更长的密钥"}],"a":["A"],"e":"**正确答案：A。** 密钥进 Secrets Manager，CI 扫描拦截。\n\n**为什么对：** 教材明确：**「硬编码密钥」是 ML 场景的高发问题——notebook 里习惯把 API key 写死在代码里，然后被提交到仓库。必须用 Secrets Manager 或参数存储，且在 CI 里加密钥扫描（提交前拦截）**。notebook 文化（交互式、随手实验、直接贴 key 跑通）正是密钥泄漏的温床；提交后即使删除提交记录，历史里仍可翻到。\n\n**其他选项为什么错：**\n- B. 仓库泄漏等于把钥匙挂在门上。\n- C. README 也是仓库文件，同样会被扫描与泄漏。\n- D. 换长密钥不改变「明文存在仓库里」这个事实。\n\n**关键概念：** 密钥治理三件：存储（Secrets Manager/参数存储）、扫描（提交时阻断）、轮换（可自动化）。4.3.8 的 API Key 纪律与之一体。","s":"自编·4.3.1"},{"id":"D4-061","d":4,"t":"single","q":"一次安全检查发现生产镜像有 340 个高危 CVE。按教材，这些漏洞最可能来自哪里，怎么修？","o":[{"l":"A","t":"来自自己写的业务代码，重写代码"},{"l":"B","t":"主要来自基础镜像里的系统包——换用推理专用精简镜像 + 多阶段构建；教学案例中 CVE 从 340 降到 12 且无高危"},{"l":"C","t":"来自 ECR 服务本身"},{"l":"D","t":"CVE 数量无法减少"}],"a":["B"],"e":"**正确答案：B。** 漏洞主要来自基础镜像。\n\n**为什么对：** 教材原文：**「镜像的漏洞主要来自基础镜像」——python:3.11 这类通用镜像包含大量系统包；用框架官方的精简推理镜像可大幅减少攻击面，「镜像越小，漏洞越少」是个可靠的直觉**。教学案例与本题主干一致：340 个高危 CVE 全部来自基础镜像的系统包，换推理专用精简镜像 + 多阶段构建后降到 12 个且无高危。\n\n**其他选项为什么错：**\n- A. 340 个 CVE 来自系统包的量级，业务代码一般贡献不了这个数量。\n- C. ECR 是仓库不是漏洞来源。\n- D. 换精简基础镜像正是教材给出的减法。\n\n**关键概念：** 镜像安全三连：精简基础镜像（缩攻击面）、多阶段构建（运行层只留产物）、推送扫描（进仓前拦截）。与 3.2.3 的镜像工程要点是同一件事的安全侧。","s":"自编·4.3.1"},{"id":"D4-062","d":4,"t":"single","q":"团队从外部网站下载了一个模型权重文件（pickle 格式）直接加载部署。按教材，这个做法有什么风险，正确做法是什么？","o":[{"l":"A","t":"没有风险，模型文件就是普通数据"},{"l":"B","t":"把文件重命名就能消除风险"},{"l":"C","t":"模型文件也要当「依赖」看待——外部权重可能包含恶意代码（pickle 反序列化执行）；优先用 safetensors 这类纯数据格式，避免 pickle"},{"l":"D","t":"压缩后再加载就安全了"}],"a":["C"],"e":"**正确答案：C。** 模型文件是可执行攻击面。\n\n**为什么对：** 教材明确：**「模型文件也要当『依赖』看待：从外部下载的模型权重可能包含恶意代码（pickle 反序列化执行）。优先用 safetensors 这类纯数据格式，避免 pickle。这个点在 GenAI 场景是新增考点」**。pickle 格式在反序列化时会执行任意代码，「下载一个模型」等同于「运行一个来路不明的程序」。\n\n**其他选项为什么错：**\n- A. pickle 恰恰不是纯数据，是可执行对象图。\n- B. 重命名不改变文件格式与反序列化行为。\n- D. 压缩不影响反序列化的执行语义。\n\n**关键概念：** 供应链安全延伸到模型权重：来源可信（官方/白名单渠道）、格式安全（safetensors 优先）、扫描入库。教学案例中把 pickle 改 safetensors 消除了反序列化执行风险。","s":"自编·4.3.1"},{"id":"D4-063","d":4,"t":"single","q":"按教材「四类角色与应有权限」，端点/推理角色应该有什么权限，不该有什么权限？","o":[{"l":"A","t":"应有全桶读写；不该有的没有"},{"l":"B","t":"应有删除权限，方便清理"},{"l":"C","t":"应有跨账号管理员权限"},{"l":"D","t":"应有模型产物只读、日志写、必要的下游调用；不该有训练数据访问、S3 写"}],"a":["D"],"e":"**正确答案：D。** 端点角色最小集：读模型、写日志、调下游。\n\n**为什么对：** 教材四类角色权限表：数据准备（指定 S3 前缀读写 + Glue Catalog；不该有全桶读写）、训练作业（训练数据只读 + 模型输出路径写；不该有删除权限）、**端点/推理（模型产物只读、日志写、必要的下游调用；不该有训练数据访问、S3 写）**、流水线（创建/更新训练与端点、PassRole；不该直接读写数据）。核心原则：**任何一处给宽了，就是整条链的漏洞**。\n\n**其他选项为什么错：**\n- A. 全桶读写正是教材点名的过宽典型。\n- B. 推理侧没有删除任何东西的正当需求。\n- C. 跨账号管理员权限是灾难级过宽。\n\n**关键概念：** 角色分权四件套：数据准备/训练/推理/流水线各自最小集；训练数据对推理角色不可见，测试集对训练角色不可见（3.3.4 呼应）。","s":"自编·4.3.2"},{"id":"D4-064","d":4,"t":"single","q":"一个流水线角色的 IAM 策略允许 `iam:PassRole` 传任意角色。按教材，这个权限的问题与正确写法是什么？","o":[{"l":"A","t":"「PassRole」是最容易给宽的权限——允许传递任意角色等于允许获得任意权限；必须限定只能传递特定角色（用 iam:PassedToService 条件与资源 ARN 约束）"},{"l":"B","t":"没问题，PassRole 不涉及权限提升"},{"l":"C","t":"应该删除所有角色"},{"l":"D","t":"改成 PassUser 就安全了"}],"a":["A"],"e":"**正确答案：A。** PassRole 无约束＝任意权限提权。\n\n**为什么对：** 教材原文：**「PassRole」是最容易给宽的权限：允许传递任意角色等于允许获得任意权限。必须限定只能传递特定角色（用 iam:PassedToService 条件与资源 ARN 约束）**。机理：持有 PassRole 的主体可以把高权限角色「递」给服务（如 SageMaker），从而以该角色的身份行事——不限定资源 ARN，就等于能递管理员角色。\n\n**其他选项为什么错：**\n- B. PassRole 恰是权限提升的经典通道。\n- C. 删角色破坏系统运作，正确的是收窄传递范围。\n- D. 没有 PassUser 这个机制，杜撰的概念。\n\n**关键概念：** 高危权限三件：PassRole（限定 ARN + PassedToService）、s3:*（限定前缀）、删除类权限（显式 Deny）。","s":"自编·4.3.2"},{"id":"D4-065","d":4,"t":"single","q":"审计发现训练角色的策略是 `s3:*` on `*`——能读写整个账号的所有桶。按教材的整改方向，正确的组合是什么？","o":[{"l":"A","t":"保留现状，方便以后访问"},{"l":"B","t":"改为按前缀的最小集合 + 显式拒绝删除 + 用 KMS 密钥策略限制解密范围；教学案例中整改后一次误删数据的脚本 bug 被权限拦截"},{"l":"C","t":"把所有桶都删掉重建"},{"l":"D","t":"把策略改成 s3:* on 指定桶"}],"a":["B"],"e":"**正确答案：B。** 前缀最小集 + 拒删 + KMS 限解密。\n\n**为什么对：** 教材教学案例与本题主干一致（审计发现 s3:* on *）：整改三步＝**改为按前缀的最小集合 + 显式拒绝删除 + 用 KMS 密钥策略限制解密范围**；整改后一次误操作（脚本 bug 试图删除数据）被权限拦截，避免了事故。这是「最小权限不只是省钱，是拦截误操作的最后防线」的实证。\n\n**其他选项为什么错：**\n- A. 「方便」正是权限蔓延的动机，教材把 ML 权限蔓延列为审计最常见扣分项。\n- C. 推倒重建不解决策略设计问题。\n- D. 缩到桶级仍是全桶读写（含删除、跨前缀），比前缀级宽得多。\n\n**关键概念：** 收窄三件套：前缀级 Allow（只给需要的路径）、删除类显式 Deny（双保险）、KMS 密钥策略（解密范围收敛）。配套工具 IAM Access Analyzer 找过宽权限。","s":"自编·4.3.2"},{"id":"D4-066","d":4,"t":"single","q":"「测试集与训练集物理分离、训练角色无权限访问测试集」在安全侧的落地手段是什么？按教材回答。","o":[{"l":"A","t":"在文档里写清楚约定"},{"l":"B","t":"把测试集文件名改成训练集的样子"},{"l":"C","t":"数据分层：训练数据、测试数据、敏感数据放不同前缀甚至不同桶，用桶策略 + KMS 密钥策略双重隔离"},{"l":"D","t":"测试集放公网网盘"}],"a":["C"],"e":"**正确答案：C。** 前缀/分桶 + 桶策略 + KMS 双重隔离。\n\n**为什么对：** 教材「数据分层的实践」：**把训练数据、测试数据、敏感数据放在不同前缀甚至不同桶，用桶策略 + KMS 密钥策略双重隔离。测试集与敏感数据应做到「训练角色根本无权限」（呼应 3.3.4）**。「根本无权限」的含义是 IAM 层面就无法访问——即使训练代码被改坏也不会读到测试集，这是 3.3.4「机制隔离」在安全侧的实现。\n\n**其他选项为什么错：**\n- A. 文档约定就是 3.3.4 否定的「光靠纪律」。\n- B. 改名不改变权限，且制造混乱。\n- D. 公网网盘直接违反数据安全底线。\n\n**关键概念：** 数据隔离双层：路径分离（前缀/分桶）+ 权限分离（桶策略 + KMS 密钥策略）。KMS 那一层很关键：即使桶策略配错，密钥策略还能拦住解密。","s":"自编·4.3.2"},{"id":"D4-067","d":4,"t":"single","q":"要求数据「只能从公司 VPC 内读取」，管理操作「只允许公司网段发起」。按教材的高频条件键，应分别使用什么？","o":[{"l":"A","t":"都用 aws:SourceIp"},{"l":"B","t":"都用 s3:prefix"},{"l":"C","t":"条件键不能实现这类限制"},{"l":"D","t":"数据访问用 aws:SourceVpce（限制只能通过指定 VPC 端点），管理操作用 aws:SourceIp（限制来源 IP）"}],"a":["D"],"e":"**正确答案：D。** SourceVpce 管网络入口，SourceIp 管来源地址。\n\n**为什么对：** 教材「四个高频使用的条件键」：**aws:SourceVpce（限制只能通过指定 VPC 端点访问——数据只能从 VPC 内读取）、aws:SourceIp（限制来源 IP——管理操作只允许公司网段）、aws:PrincipalTag（按主体标签授权——按团队隔离资源）、s3:prefix / s3:ExistingObjectTag（限制前缀或对象标签——数据分层访问）**。两个需求的语义恰好对应两个键：VPC 端点级限制 vs IP 级限制。\n\n**其他选项为什么错：**\n- A. 对 VPC 内服务间访问，SourceIp 不可靠（NAT 后 IP 会变），SourceVpce 才是稳的。\n- B. s3:prefix 管的是 S3 对象路径，不管网络来源。\n- C. 条件键正是为此设计的。\n\n**关键概念：** 条件键四件套各管一维：网络入口（Vpce）、来源地址（Ip）、主体身份（PrincipalTag）、资源路径（prefix/ObjectTag）。","s":"自编·4.3.3"},{"id":"D4-068","d":4,"t":"single","q":"跨账号数据访问的两种方式中，教材推荐哪种，为什么？","o":[{"l":"A","t":"角色切换（AssumeRole）——可撤销、可审计；资源策略直接授权简单但难管理"},{"l":"B","t":"资源策略直接授权，配置最简单"},{"l":"C","t":"共享长期访问密钥"},{"l":"D","t":"把数据复制一份给对方账号"}],"a":["A"],"e":"**正确答案：A。** AssumeRole 优先。\n\n**为什么对：** 教材「跨账号访问的两种方式」：**角色切换（AssumeRole）——受信账号扮演角色，推荐，可撤销、可审计；资源策略直接授权——桶策略/密钥策略里写对方账号，简单但难管理**。AssumeRole 的优势是「授权的粒度与生命周期都在自己手里」：随时改信任策略收权，每次扮演都有 CloudTrail 记录；直接写进桶策略的授权散落在各资源里，盘点与回收都难。\n\n**其他选项为什么错：**\n- B. 「简单」的代价是难管理——回收要遍历所有资源策略。\n- C. 长期密钥共享是教材明确要淘汰的做法（4.3.3/4.3.8）。\n- D. 数据复制制造第二份需要保护的资产，且失去单一事实源。\n\n**关键概念：** 授权方式的优先序：临时凭证（角色）> 联合身份 > 有轮换的密钥 > 长期共享密钥（淘汰）。","s":"自编·4.3.3"},{"id":"D4-069","d":4,"t":"single","q":"按教材的权限排障五步流程，「权限明明给了却不生效」十有八九是哪一步的原因？","o":[{"l":"A","t":"第一步：看 CloudTrail AccessDenied"},{"l":"B","t":"第五步：资源策略（桶策略、队列策略）里有显式 Deny——即使 IAM 允许也无法访问，这一步最容易漏"},{"l":"C","t":"第二步：Policy Simulator"},{"l":"D","t":"第三步：检查 SCP"}],"a":["B"],"e":"**正确答案：B。** 资源策略的显式 Deny。\n\n**为什么对：** 教材五步流程：①CloudTrail AccessDenied（找到被拒的 action 与 resource）②IAM Policy Simulator 验证 ③SCP 或 VPC 端点策略 ④KMS 密钥策略 ⑤资源策略（桶策略、队列策略）是否显式拒绝；并明确：**「第五步最容易漏：S3 桶策略里有显式 Deny 时，即使 IAM 允许也无法访问。『权限明明给了却不生效』十有八九是资源策略的显式拒绝**。\n\n**其他选项为什么错（对照）：**\n- A、C、D 都是流程中的合理步骤，但「给了却不生效」的经典根因是显式 Deny 的优先级高于 Allow——这发生在第⑤步。\n\n**关键概念：** 显式 Deny > SCP Deny > 资源策略 > IAM Allow 的判定顺序。排障按五步走，顺序错会浪费大量时间。","s":"自编·4.3.3"},{"id":"D4-070","d":4,"t":"single","q":"一个训练作业无法读取 S3 数据，IAM 策略确认无误。查 CloudTrail 发现 AccessDenied 来自 KMS（kms:Decrypt）。按教材，原因与修复是什么？","o":[{"l":"A","t":"S3 服务故障，提工单"},{"l":"B","t":"把数据重新上传一遍"},{"l":"C","t":"数据用 CMK 加密——访问是双重的（S3 权限 + KMS 权限）；训练角色有 S3 权限但没有该密钥的使用权限，在密钥策略中授权后解决"},{"l":"D","t":"给训练角色加管理员权限"}],"a":["C"],"e":"**正确答案：C。** KMS 双重授权。\n\n**为什么对：** 教材权限排障流程第四步与教学案例完全一致：**「检查 KMS 密钥策略（加密数据的访问是双重的：S3 权限 + KMS 权限）」；案例结论：「双重授权的结构是 ML 数据访问最常见的坑」**。CMK 加密的对象读取需要 kms:Decrypt——IAM 里给了 s3:GetObject 只完成一半授权，密钥策略也要放行。\n\n**其他选项为什么错：**\n- A. AccessDenied 来自 KMS 是明确的授权问题，不是服务故障。\n- B. 重新上传不改变加密密钥的授权状态。\n- D. 管理员权限违反最小权限，正确动作是密钥策略精确放行该角色。\n\n**关键概念：** 「给权限没生效」的另一大根因（与 D4-069 的显式 Deny 并列）：加密数据的双重授权。排障时 AccessDenied 的 service 字段（s3 还是 kms）直接指出卡在哪一层。","s":"自编·4.3.3"},{"id":"D4-071","d":4,"t":"single","q":"按教材「四类必须留存的日志」，训练日志的保留期要求与内容是什么？","o":[{"l":"A","t":"保留一周，只记录训练时长"},{"l":"B","t":"永久保留所有 stdout 输出"},{"l":"C","t":"不需要保留训练日志"},{"l":"D","t":"与模型同寿命；内容含超参、数据路径、指标、镜像"}],"a":["D"],"e":"**正确答案：D。** 训练日志与模型同寿命。\n\n**为什么对：** 教材四类日志表：操作审计（CloudTrail，1 年以上）、数据访问（3–12 个月）、推理日志（按业务与合规要求）、**训练日志（超参、数据路径、指标、镜像——与模型同寿命）**。「同寿命」的逻辑：只要这个模型还在服役或还在被审计追溯，就必须能回答「它是怎么训出来的」——这正是 3.3.6 血缘链的日志载体。\n\n**其他选项为什么错：**\n- A. 一周后模型还在、依据没了，审计断链。\n- B. 「所有 stdout 永久保留」成本不可控，且与「该留什么」无关——关键是超参/数据路径/指标/镜像这四样。\n- C. 缺训练日志 = 缺血缘。\n\n**关键概念：** 四类日志各管一问：操作审计（谁动了资源）、数据访问（谁读了数据）、推理日志（当时怎么答的）、训练日志（当时怎么训的）。","s":"自编·4.3.4"},{"id":"D4-072","d":4,"t":"single","q":"推理日志留存便于审计，但可能包含个人信息。按教材，这个合规矛盾的正确解法是什么？","o":[{"l":"A","t":"脱敏后留存（PII 掩码）+ 分权限访问 + 设保留期——「不留」和「全留」都不对"},{"l":"B","t":"不留推理日志，最安全"},{"l":"C","t":"全部明文永久保留，方便审计"},{"l":"D","t":"只保留输出，删除所有输入"}],"a":["A"],"e":"**正确答案：A。** 脱敏 + 分权 + 保留期，三管齐下。\n\n**为什么对：** 教材「推理日志的合规矛盾」：**留存推理输入输出便于审计，但可能包含个人信息。解法：脱敏后留存（PII 掩码）+ 分权限访问 + 设保留期。「不留」和「全留」都不对**。「不留」丢审计能力（无法回答「当时依据什么回答」）；「全留」制造 PII 泄漏面（日志库成为最大敏感数据池）。\n\n**其他选项为什么错：**\n- B. 放弃审计能力，受监管场景不可接受。\n- C. 明文永久保留正是合规事故的配方。\n- D. 只留输出常常无法还原决策依据（输入与检索内容是依据）。\n\n**关键概念：** 日志合规三参数：脱敏（掩码 PII）、访问控制（谁能看日志）、生命周期（保留多久后删/冻）。","s":"自编·4.3.4"},{"id":"D4-073","d":4,"t":"single","q":"审计日志必须防篡改。按教材，正确的做法组合是什么？","o":[{"l":"A","t":"写在业务系统的本地磁盘上"},{"l":"B","t":"写入独立账号的桶 + S3 Object Lock（合规模式）+ 仅追加权限"},{"l":"C","t":"每天把日志发给运维个人邮箱"},{"l":"D","t":"用 MD5 校验就够了"}],"a":["B"],"e":"**正确答案：B。** 独立账号 + Object Lock + 仅追加。\n\n**为什么对：** 教材「日志完整性」：**审计日志必须防篡改。做法：写入独立账号的桶 + S3 Object Lock（合规模式）+ 仅追加权限**。三层设计的逻辑：独立账号（即使业务账号被攻破也删不到日志桶）、Object Lock 合规模式（保留期内任何人包括 root 都无法删除）、仅追加（无覆盖与删除权限）。\n\n**其他选项为什么错：**\n- A. 本地磁盘与业务同生共死，攻击者拿到主机就能改。\n- C. 个人邮箱不可控、不可审计、易泄漏。\n- D. MD5 只能事后发现改动，防不了删除与覆盖。\n\n**关键概念：** 防篡改三要素：隔离（独立账号）、不可变（Object Lock）、最小动作（仅追加）。4.3.4 教学案例的整改即「日志写入独立账号的不可篡改桶」。","s":"自编·4.3.4"},{"id":"D4-074","d":4,"t":"single","q":"受监管场景要求能回答「这笔决策为什么这样」。按教材，推理日志除输入输出外还必须记录什么？","o":[{"l":"A","t":"只记录用户 ID 就够了"},{"l":"B","t":"记录服务器的风扇转速"},{"l":"C","t":"模型版本 + 关键特征值（快照）+ 决策阈值；若使用 RAG 则记录检索到的文档 ID——没有文档 ID，事后无法还原「当时依据什么回答」"},{"l":"D","t":"记录运维人员的值班表"}],"a":["C"],"e":"**正确答案：C。** 版本 + 特征 + 阈值 + 文档 ID。\n\n**为什么对：** 教材「模型决策的可解释性要求」：受监管场景要能回答「这笔决策为什么这样」，所以推理日志除输入输出外还要记录**模型版本 + 关键特征值 + 若使用 RAG 则记录检索到的文档 ID**；并强调**「没有文档 ID，事后无法还原『当时依据什么回答』」**。教学案例（贷款拒绝依据）的整改即：模型版本 + 关键特征快照 + 决策阈值 + 保留 18 个月 + PII 掩码 + 不可篡改桶。\n\n**其他选项为什么错：**\n- A. 用户 ID 定位不了决策逻辑。\n- B、D. 与决策依据无关。\n\n**关键概念：** 可解释性四要素进日志：模型版本（哪个模型）、特征快照（看到了什么）、阈值（怎么判的）、文档 ID（RAG 依据什么）。与 3.3.6 血缘链在「单笔决策」粒度的落地。","s":"自编·4.3.4"},{"id":"D4-075","d":4,"t":"single","q":"一次渗透测试中，测试方从互联网直接调用了模型端点（公有访问没关、鉴权允许匿名）。按教材，「端点被公网访问」在 ML 场景为什么特别危险，必须做哪三件事？","o":[{"l":"A","t":"不危险，多几个用户而已"},{"l":"B","t":"只需提醒测试方别再测了"},{"l":"C","t":"把端点换个名字藏起来"},{"l":"D","t":"可能被大量调用（成本攻击）或用于提取模型行为特征；必须做：私有网络 + 鉴权（IAM/SigV4）+ 限流"}],"a":["D"],"e":"**正确答案：D。** 成本攻击与模型提取，三件事缺一不可。\n\n**为什么对：** 教材原话：**「端点被公网访问」在 ML 场景特别危险——模型端点一旦公开，可能被大量调用（成本攻击）或用于提取行为特征。必须做三件：私有网络 + 鉴权（IAM/SigV4）+ 限流**。教学案例的整改即：关闭端点公有访问、只允许指定 VPC 端点与业务角色的 SigV4 签名请求、API Gateway 限流、开启端点访问日志；并指出「这类问题在『能跑通』之后极容易被遗漏，因为它不影响功能」。\n\n**其他选项为什么错：**\n- A. 公开端点是成本与知识产权的双重风险。\n- B. 隐患还在。\n- C. 改名是安全靠隐匿（security by obscurity），不构成控制。\n\n**关键概念：** 端点防护三件套 + 兜底开关（Block Public Access，4.3.6）；「能跑通」不等于「配置对」，功能测试不覆盖暴露面检查。","s":"自编·4.3.5"},{"id":"D4-076","d":4,"t":"single","q":"攻击者通过反复诱导让模型输出了系统提示，从而了解规则并绕过防护。按教材，这类「Prompt 泄露」的缓解组合是什么？","o":[{"l":"A","t":"系统提示中不放敏感信息（密钥、内部 URL）+ 输出侧过滤 + 对「重复提问系统提示」的行为做检测"},{"l":"B","t":"把系统提示写得再长一点"},{"l":"C","t":"让用户签保密协议"},{"l":"D","t":"把系统提示加密后发给模型"}],"a":["A"],"e":"**正确答案：A。** 不放敏感信息 + 输出过滤 + 行为检测。\n\n**为什么对：** 教材「Prompt 泄露是新增的攻击面」：**攻击者通过诱导让模型输出系统提示，从而了解你的规则并绕过。缓解：系统提示中不放敏感信息（密钥、内部 URL）、输出侧过滤、对「重复提问系统提示」的行为做检测**。设计假设应是「系统提示终会泄露」：所以它里面不能有密钥、内部地址等真正敏感的东西——规则可被知道，资产不能被拿到。\n\n**其他选项为什么错：**\n- B. 更长的提示反而提供更多可泄露内容。\n- C. 协议拦不住自动化诱导。\n- D. 模型无法解密执行——提示必须是明文才能起作用。\n\n**关键概念：** 提示词安全三原则：敏感信息不入提示、输出侧兜底过滤、异常提问模式监控。与 3.3.7 的注入防御（结构分离/来源分级/服务端校验）互补。","s":"自编·4.3.5"},{"id":"D4-077","d":4,"t":"single","q":"按教材，安全排障的取证顺序是什么，为什么顺序错会浪费时间？","o":[{"l":"A","t":"先看应用日志，再猜网络"},{"l":"B","t":"先看 CloudTrail（谁做了什么），再看资源策略（允许吗），再看网络（能到达吗），最后看应用日志（应用自己拒了吗）"},{"l":"C","t":"顺序无所谓，同时全查"},{"l":"D","t":"直接重装环境最快"}],"a":["B"],"e":"**正确答案：B。** CloudTrail → 资源策略 → 网络 → 应用日志。\n\n**为什么对：** 教材「排障的取证顺序」原文：**先看 CloudTrail（谁做了什么），再看资源策略（允许吗），再看网络（能到达吗），最后看应用日志（应用自己拒了吗）。顺序错会浪费大量时间**。逻辑是「从最权威的记录到最外围的表现」：CloudTrail 直接记录了「哪个 action 对哪个 resource 被拒」，一步就能把问题钉住；先看应用日志只能看到症状。\n\n**其他选项为什么错：**\n- A. 应用日志是最后一环——它只能告诉你「应用自己拒了」，说不出「为什么被拒」。\n- C. 全查没有优先级，效率最低。\n- D. 重装破坏现场且大概率复发。\n\n**关键概念：** 四层取证各答一问：CloudTrail（发生了什么）、资源策略（被谁拒）、网络（到得了吗）、应用日志（应用层怎么看）。与 4.3.3 五步流程在实操上衔接。","s":"自编·4.3.5"},{"id":"D4-078","d":4,"t":"single","q":"发现某个 S3 桶被外部账号读取。按教材教学案例的排查与整改，正确流程是什么？","o":[{"l":"A","t":"直接把整个账号注销"},{"l":"B","t":"等待对方自觉停止访问"},{"l":"C","t":"查 CloudTrail 数据事件定位访问来源账号 → 查桶策略（发现 Principal:\"*\" 的 GetObject 允许、历史遗留）→ 删除该策略、开启 Block Public Access、加 Access Analyzer 持续监控、对已有数据做影响评估"},{"l":"D","t":"把桶改个名字"}],"a":["C"],"e":"**正确答案：C。** 定位 → 根因 → 整改四件套。\n\n**为什么对：** 教材教学案例与本题主干一致：**查 CloudTrail 数据事件定位到访问来源账号，查桶策略发现一条 Principal:\"*\" 的 GetObject 允许（历史遗留，为某次共享临时加的），同时该桶未启用「阻止公共访问」**。整改：删除该条策略、开启 Block Public Access、加 Access Analyzer 持续监控、**对已有数据做影响评估**（已泄漏数据的处置）。\n\n**其他选项为什么错：**\n- A. 注销账号是极端动作，业务全停。\n- B. 等待不是处置。\n- D. 改名不收权限，对方拿到新名字照样读。\n\n**关键概念：** 「为某次共享临时加的」是过宽授权的典型来源；临时授权要有回收机制，Access Analyzer 负责「持续」发现这类暴露。","s":"自编·4.3.5"},{"id":"D4-079","d":4,"t":"single","q":"按教材「一个完整的隔离设计（四层）」，从外到内的四层分别是什么？","o":[{"l":"A","t":"只有一层：装个防火墙软件"},{"l":"B","t":"四层都是同一个安全组复制四份"},{"l":"C","t":"四层指的是四个可用区"},{"l":"D","t":"VPC（边界）→ 子网（公有仅放 NAT/负载均衡 + 私有放训练与端点）→ 安全组（只允许必要端口与来源）→ 端点策略（限制可访问的 S3 桶/资源）"}],"a":["D"],"e":"**正确答案：D。** VPC → 子网 → 安全组 → 端点策略。\n\n**为什么对：** 教材四层隔离表：**VPC（独立 VPC 或独立子网段——边界）、子网（公有仅放 NAT/负载均衡，私有放训练与端点——不直接暴露）、安全组（只允许必要端口与来源，用安全组引用而非 IP 段——东西向控制）、端点策略（限制可访问的 S3 桶/资源——即使有网络权限也只能访问指定资源）**。四层各管一个维度：边界、暴露面、端口来源、资源范围。\n\n**其他选项为什么错：**\n- A. 单层防御在 ML 场景必然被绕过（服务间通信走公网时权限再好也没用）。\n- B. 复制同一安全组没有分层意义。\n- C. 可用区是高可用概念，不是隔离层次。\n\n**关键概念：** 网络隔离是 ML 安全的底座——「没有它，权限做得再好也可能被绕过（因为服务间通信走公网）」。","s":"自编·4.3.6"},{"id":"D4-080","d":4,"t":"single","q":"配置安全组时，为什么教材建议「安全组引用安全组」而不是写 IP 段？","o":[{"l":"A","t":"IP 段会变，安全组引用不会——写「允许来自 sg-xxx（应用层安全组）的 443」随拓扑自动跟随，不用手工维护 IP 清单"},{"l":"B","t":"IP 段写起来太长"},{"l":"C","t":"安全组引用速度更快"},{"l":"D","t":"IP 段已经被禁用"}],"a":["A"],"e":"**正确答案：A。** 引用跟随拓扑，IP 会漂移。\n\n**为什么对：** 教材原话：**「安全组引用安全组」这个技巧很实用：不要写 10.0.1.0/24，而是写「允许来自 sg-xxx（应用层安全组）的 443」。IP 段会变，安全组引用不会**。实例扩缩、更换、重建都会换 IP，写死 IP 段的规则很快过期（要么过宽要么失效）；引用安全组则把「谁可以访问」绑定在「角色」（应用层）上，拓扑变化自动生效。\n\n**其他选项为什么错：**\n- B. 长度不是理由，正确性才是。\n- C. 与性能无关。\n- D. IP 段没有禁用，只是不可靠。\n\n**关键概念：** 安全组规则按「身份」写不按「地址」写：安全组引用 = 以角色为白名单。配套原则：只允许必要端口与来源（东西向最小化）。","s":"自编·4.3.6"},{"id":"D4-081","d":4,"t":"single","q":"ML 特有的网络配置中，训练任务有「双向需求」。按教材，是哪两向，只配一半会怎样？","o":[{"l":"A","t":"只有下载，没有上传需求"},{"l":"B","t":"读 S3（需要网关端点）+ 拉镜像（需要 ECR 端点或 NAT）；只配一半会导致「训练能启动但拉不到数据」或「拉不到镜像」"},{"l":"C","t":"双向是 SSH 和 RDP"},{"l":"D","t":"训练任务不需要网络"}],"a":["B"],"e":"**正确答案：B。** S3 网关端点 + ECR 端点/NAT 两个都要。\n\n**为什么对：** 教材「ML 特有的三处网络配置」第一条：**训练任务的双向需求：读 S3（需要网关端点）+ 拉镜像（需要 ECR 端点或 NAT）。只配一半会导致「训练能启动但拉不到数据」或「拉不到镜像」**。另两处：端点被业务系统调用（跨 VPC 用 Peering/Transit Gateway，不走公网）、模型访问外部依赖（NAT 或私有镜像仓库，强合规用网络隔离 + 预构建镜像）。\n\n**其他选项为什么错：**\n- A. 训练既要读数据也要拉镜像，两向都要。\n- C. SSH/RDP 是管理协议，不是训练数据面。\n- D. 训练恰恰是最吃网络的任务（读数据 + 拉镜像 + 写产物）。\n\n**关键概念：** VPC 内训练的网络清单：S3 网关端点（数据）、ECR 端点（镜像）、CloudWatch 端点（日志）——漏一项就有一类失败，且错误信息往往不直观。","s":"自编·4.3.6"},{"id":"D4-082","d":4,"t":"single","q":"新同事把 S3 桶策略改出漏洞后问：反正有策略审计，为什么还要开「阻断公共访问」（Block Public Access）？按教材，这类开关的定位是什么？","o":[{"l":"A","t":"可开可不开的装饰选项"},{"l":"B","t":"只在测试环境开启"},{"l":"C","t":"独立于策略的兜底开关——即使策略写错了也能拦住公共访问；应该是所有账号的默认开启项"},{"l":"D","t":"开启后所有访问都被禁止"}],"a":["C"],"e":"**正确答案：C。** 兜底开关，默认开启。\n\n**为什么对：** 教材原话：**「阻断公共访问」是一条独立开关：S3 的 Block Public Access、端点的公有访问开关。即使策略写错了，这个开关也能兜底。应该是所有账号的默认开启项**。它的价值在 D4-078 的案例里得到印证：泄漏桶正是「策略写错 + 开关没开」的组合结果——策略会被人写错，但默认开启的开关能兜住错误。\n\n**其他选项为什么错：**\n- A. 它是最有效的一层兜底，不是装饰。\n- B. 生产环境更需要。\n- D. 它只禁止「公共（匿名）访问」，授权访问不受影响。\n\n**关键概念：** 安全配置的「防御深度」：精细策略（会错）+ 粗粒度兜底开关（默认开）+ 持续监控（Access Analyzer）。三层叠加才防得住人为失误。","s":"自编·4.3.6"},{"id":"D4-083","d":4,"t":"multiple","q":"按教材「ML 特有的六类风险」，以下哪些属于这六类？（选四项）","o":[{"l":"A","t":"数据投毒：污染训练数据，植入后门"},{"l":"B","t":"模型窃取/提取：大量查询推断模型行为"},{"l":"C","t":"成员推断：判断某条数据是否在训练集里"},{"l":"D","t":"训练数据泄露：模型记忆并复述训练数据"},{"l":"E","t":"机房断电"}],"a":["A","B","C","D"],"e":"**正确答案：ABCD。**\n\n**为什么对：** 教材六类风险：**数据投毒（来源校验/异常样本检测/训练数据审计）、模型窃取/提取（限流/输出置信度粗化/异常查询检测）、对抗样本（对抗训练/输入校验/多模型交叉验证）、成员推断（差分隐私/限制输出细节/正则化）、提示注入（结构分离/输出过滤）、训练数据泄露（去重与脱敏/差分隐私/输出过滤）**。A、B、C、D 各占其一（提示注入在 3.3.7 已重点覆盖）。\n\n**其他选项为什么错：**\n- E. 断电是基础设施可用性问题，不是 ML 特有攻击面。\n\n**关键概念：** 这六类的共同点：传统应用安全不覆盖它们——这正是 4.3.7 的全部价值。每个风险都有专属缓解，不能靠通用 WAF 解决。","s":"自编·4.3.7"},{"id":"D4-084","d":4,"t":"single","q":"「成员推断」风险：如果模型能被用来判断「某人是否在某个名单里」，训练数据的隐私就没有保住。按教材，为什么说它在敏感数据场景是硬合规要求，缓解手段是什么？","o":[{"l":"A","t":"只是理论风险，不用管"},{"l":"B","t":"换更大的模型就不会被推断"},{"l":"C","t":"把训练集公布出来反而安全"},{"l":"D","t":"它直接破坏训练数据隐私（可反推个体是否在训练集中）；缓解：差分隐私训练或限制输出粒度"}],"a":["D"],"e":"**正确答案：D。** 成员推断破坏训练数据隐私，用差分隐私/限制输出粒度缓解。\n\n**为什么对：** 教材原话：**「成员推断」在敏感数据场景是硬合规要求：如果模型能被用来判断「某人是否在某个名单里」，那训练数据的隐私就没有保住。缓解手段是差分隐私训练或限制输出粒度**。攻击形态：通过观察模型对特定输入的置信度/输出差异，反推某条记录是否参与了训练——对医疗、信贷等名单型数据是直接的个人隐私泄露。\n\n**其他选项为什么错：**\n- A. 教材定性为「硬合规要求」，不是理论问题。\n- B. 模型大小与成员泄露无必然关系。\n- C. 公布训练集等于彻底放弃隐私。\n\n**关键概念：** 训练数据隐私三防线：去重与脱敏（源头）、差分隐私（训练时）、限制输出细节/输出过滤（推理时）。","s":"自编·4.3.7"},{"id":"D4-085","d":4,"t":"single","q":"针对「模型窃取/提取」风险（攻击者大量查询以推断模型行为），按教材的缓解组合是什么？","o":[{"l":"A","t":"限流、输出置信度粗化、异常查询检测"},{"l":"B","t":"不设任何限制，欢迎调用"},{"l":"C","t":"把模型参数公开"},{"l":"D","t":"只在深夜开放服务"}],"a":["A"],"e":"**正确答案：A。** 限流 + 置信度粗化 + 异常查询检测。\n\n**为什么对：** 教材六类风险表中「模型窃取/提取」一行的缓解列：**限流、输出置信度粗化、异常查询检测**。三者分别对付提取攻击的三个环节：限流压低「大量查询」的可行速度；置信度粗化（不返回精确概率）让攻击者拿不到构建替代模型最需要的细粒度信号；异常查询检测识别系统性枚举行为。\n\n**其他选项为什么错：**\n- B. 无限流等于把模型白送。\n- C. 主动公开参数是彻底放弃保护。\n- D. 时段限制是可用性自残，且夜间照样能跑提取脚本。\n\n**关键概念：** 提取攻击的前提是「大量 + 细粒度」的查询反馈；4.3.5 的端点三件套（私有网络 + 鉴权 + 限流）是它的前置防线。","s":"自编·4.3.7"},{"id":"D4-086","d":4,"t":"single","q":"一个简历筛选模型的训练数据来自公开渠道，其中混入了刻意构造的「特定关键词即高分」样本，上线后某些候选人评分异常偏高。按教材，这是哪类风险，缓解组合是什么？","o":[{"l":"A","t":"对抗样本；加防火墙"},{"l":"B","t":"数据投毒；训练数据来源白名单与人工抽检 + 特征重要性监控（某单一特征权重异常高即告警）+ 分组公平性检查进流水线"},{"l":"C","t":"提示注入；加强系统提示"},{"l":"D","t":"模型窃取；加限流"}],"a":["B"],"e":"**正确答案：B。** 数据投毒，三道缓解。\n\n**为什么对：** 教材教学案例与本题主干一致：公开渠道数据混入「特定关键词即高分」的构造样本＝**数据投毒（污染训练数据，植入后门）**；缓解三件：①**训练数据来源白名单与人工抽检**②**特征重要性监控（若某单一特征权重异常高即告警）**③**分组公平性检查进流水线**。投毒的特点是「低概率但系统性影响」，所以必须有检测机制而不是只靠预防。\n\n**其他选项为什么错：**\n- A. 对抗样本是推理期输入扰动，本题是训练期数据污染。\n- C. 与提示无关，训练数据在模型内部。\n- D. 限流防提取，防不了后门。\n\n**关键概念：** 风险评估三问（可能性/影响范围/可检测性）：数据投毒是「低概率 × 系统性 × 难检测」的典型，检测机制（特征权重监控）是必需品。","s":"自编·4.3.7"},{"id":"D4-087","d":4,"t":"single","q":"按教材「四种常见凭证与适用」，AWS 内工作负载访问 FM 的首选凭证是什么，三条理由是什么？","o":[{"l":"A","t":"长期访问密钥，因为不会过期"},{"l":"B","t":"API Key，最简单"},{"l":"C","t":"IAM 角色（临时凭证）——临时（自动过期）、可细粒度授权、可审计到具体主体"},{"l":"D","t":"匿名访问"}],"a":["C"],"e":"**正确答案：C。** 首选 IAM 角色临时凭证。\n\n**为什么对：** 教材凭证对照表：IAM 角色（临时凭证）安全等级**最高**，适用「所有 AWS 内的工作负载（首选）」；「首选角色」三条理由原文：**①临时（自动过期）②可细粒度授权 ③可审计到具体主体**。长期密钥（IAM 用户访问密钥）安全等级低，仅限无角色支持的场景且必须轮换。\n\n**其他选项为什么错：**\n- A. 「不会过期」恰是它的最大缺点——泄露窗口无限长。\n- B. API Key 安全等级低，适用第三方工具集成与开发测试，不是 AWS 内负载的首选。\n- D. 匿名访问没有任何审计与控制能力。\n\n**关键概念：** 凭证选型的本质是「泄露后能造成多大损失」：临时短命凭证损失窗口最小。Lambda 里的硬编码 API Key 改用角色正是教学案例的第一条整改。","s":"自编·4.3.8"},{"id":"D4-088","d":4,"t":"single","q":"CI/CD 流水线需要调用 FM。按教材，正确的方式是什么，为什么这是「当前最容易被审计挑出的问题」？","o":[{"l":"A","t":"把长期密钥写在仓库配置文件里"},{"l":"B","t":"CI 不需要凭证，直接调用"},{"l":"C","t":"让每个开发者把自己的密钥配进 CI"},{"l":"D","t":"用 OIDC 联合身份（如 GitHub Actions 通过 OIDC 换取角色），不要往仓库里塞长期密钥"}],"a":["D"],"e":"**正确答案：D。** OIDC 换角色，仓库零密钥。\n\n**为什么对：** 教材「CI/CD 访问 FM 的正确方式」：**用 OIDC 联合身份（如 GitHub Actions 通过 OIDC 换取角色），不要往仓库里塞长期密钥。这是当前最容易被审计挑出的问题**。OIDC 的机制：CI 作业用短生命周期的身份令牌向 AWS 换取临时角色凭证——仓库里没有任何可泄露的静态密钥，且角色权限可精确限定到本次部署所需。\n\n**其他选项为什么错：**\n- A. 仓库配置文件就是「塞长期密钥」本身，教学案例里「CI 密钥可部署生产」被评为最高危。\n- B. 无凭证调用不存在。\n- C. 个人密钥进 CI 造成归因混乱、离职后仍有权限。\n\n**关键概念：** 凭证与场景的配对：AWS 内负载→IAM 角色；CI/外部身份源→OIDC/SAML 联合；第三方工具/开发测试→API Key（按纪律管理）。","s":"自编·4.3.8"},{"id":"D4-089","d":4,"t":"single","q":"第三方工具集成必须使用 API Key 时，按教材的管理纪律是哪四条？","o":[{"l":"A","t":"存 Secrets Manager（不存代码/环境变量文件）、按应用分配（一应用一 key 便于吊销与归因）、定期轮换且轮换可自动化、设配额上限（key 泄露时的损失上限）"},{"l":"B","t":"写在代码里、全员共用一把、永不轮换、不设上限"},{"l":"C","t":"打印在工牌背面随身携带"},{"l":"D","t":"发给所有合作方共享"}],"a":["A"],"e":"**正确答案：A。** 存储隔离 + 一应用一 key + 自动轮换 + 配额上限。\n\n**为什么对：** 教材「API Key 的管理纪律（当不得不用时）」四条原文：**①存 Secrets Manager，不存代码/环境变量文件；②按应用分配（一个应用一个 key，便于吊销与归因）；③定期轮换，且轮换过程可自动化；④设配额上限（key 泄露时的损失上限）**。第④条的思想是爆炸半径控制：配额决定了最坏情况下损失多少钱。\n\n**其他选项为什么错：**\n- B. 四条全反：入代码（可扫描到）、共用（无法归因与定点吊销）、不轮换（泄露窗口无限）、无上限（损失无限）。\n- C. 物理载体更易丢失且无审计。\n- D. 共享后无法吊销单个使用方。\n\n**关键概念：** 「不得不用时」的定位：API Key 是兜底选项而非首选；用，就要把「可吊销、可归因、可轮换、有上限」四性配齐。","s":"自编·4.3.8"},{"id":"D4-090","d":4,"t":"multiple","q":"你在为企业知识助手选安全护栏。按教材，以下哪些是 Amazon Bedrock Guardrails **能做**的事？（选三项）","o":[{"l":"A","t":"内容过滤：按类别（仇恨、暴力、色情等）阻断输入与输出"},{"l":"B","t":"敏感信息过滤：检测并遮蔽 PII（姓名、证件号、电话、卡号）"},{"l":"C","t":"上下文接地检查：检查输出是否有检索依据（防幻觉）"},{"l":"D","t":"按用户隔离知识库文档（不同用户看不同文档）"},{"l":"E","t":"保护训练数据不被读取"}],"a":["A","B","C"],"e":"**正确答案：ABC。**\n\n**为什么对：** 教材「Guardrails 能做什么」六项：内容过滤、敏感信息过滤（PII 遮蔽）、主题拒绝、词表过滤、**上下文接地检查（检查输出是否有检索依据，防幻觉——RAG 场景最有价值的配置，把忠实度从事后评估变成事前约束）**、自动推理检查。A、B、C 各占其一。\n\n**其他选项为什么错（这是本考点更重要的部分）：**\n- D. 按用户隔离文档应由**检索层元数据过滤**（3.1.8）做——「用 Guardrails 实现不同用户看不同文档」是典型错误选项。\n- E. 保护训练数据由 IAM 与网络隔离（4.3.2/4.3.6）管。\n\n**关键概念：** 高频考点判断：**「Guardrails 不是安全边界」——它管「模型能说什么」，不管「谁能访问什么」；它是内容安全的最后一道过滤，不能替代权限控制**。","s":"自编·4.3.9"},{"id":"D4-091","d":4,"t":"single","q":"一个 HR 助手允许查询制度但必须屏蔽员工个人信息。按教材的教学案例，配置了四层：① Guardrails PII 过滤（输入输出双向）② 检索层按部门过滤文档 ③ 系统提示明确「不得输出员工个人数据」 ④ 输出后置检查（正则兜底）。关于这四层的分工，正确的理解是什么？","o":[{"l":"A","t":"四层都是 Guardrails 的功能"},{"l":"B","t":"只有第 ① 层是 Guardrails——第②层是检索层元数据过滤、第③层是提示词约束、第④层是应用层正则，其余三件恰是 Guardrails 做不到、必须由别的层承担的"},{"l":"C","t":"只配第 ① 层就够了"},{"l":"D","t":"四层可以互相替代，留一层即可"}],"a":["B"],"e":"**正确答案：B。** 四层各司其职，只有一层是 Guardrails。\n\n**为什么对：** 教材教学案例的结论原文：**「四层里只有第 ① 层是 Guardrails，其余都是它做不到的——这正是理解这条技能点的关键」**。分工：①内容侧过滤（Guardrails 的 PII 双向遮蔽）；②访问侧隔离（检索层 filter——权限必须在检索层做，3.1.8）；③行为约束（提示词，概率性）；④兜底检查（应用层规则，防模型复述漏网）。\n\n**其他选项为什么错：**\n- A. 把四层混为一谈，正是「把安全责任错误地压在 Guardrails 身上」的误区。\n- C. 只有内容过滤挡不住「无权限文档根本不该被检索到」。\n- D. 四层防的是不同的失败模式（越权检索/提示绕过/复述泄露），不可互替。\n\n**关键概念：** Guardrails 边界表：内容/PII/主题/接地检查它管；文档隔离、限流、数据保护、注入防御、加密传输——各有其主。PII 两层设计：输入侧遮蔽后再送模型（不进日志与上下文），输出侧遮蔽后返回（防复述训练数据中的 PII）。","s":"自编·4.3.9"}];

<script>

/* ================================================================
   ===================== 题库数据（构建注入 QUIZ_META + QUIZ_QUESTIONS） ================
   ================================================================ */
// 模考池隔离（构建注入 QUIZ_MOCK_POOL；无模考池的科目为空集，行为不变）
const MOCK_IDS = (typeof QUIZ_MOCK_POOL !== "undefined" && QUIZ_MOCK_POOL) ? new Set(QUIZ_MOCK_POOL) : new Set();
// 模考池题目（仅全真模考可见；练习模式与统计一律不含）
const MOCK_QUESTIONS = QUIZ_QUESTIONS.filter(q => MOCK_IDS.has(q.id));
// 计分题 id：官方 65 题里 50 题计分、15 题不计分 —— 不计分题只上卷面，不参与判分
const MOCK_SCORED = (typeof QUIZ_MOCK_SCORED !== "undefined" && QUIZ_MOCK_SCORED) ? new Set(QUIZ_MOCK_SCORED) : new Set();
const QUESTIONS = QUIZ_QUESTIONS.filter(q => !MOCK_IDS.has(q.id));
const META = (typeof QUIZ_META !== 'undefined' && QUIZ_META) ? QUIZ_META : {};
const EXAM = META.exam || 'QUIZ';
const LS_PREFIX = META.lsPrefix || EXAM.toLowerCase();

const GLOSSARY = META.glossary || {};

function getGlossaryForQuestion(q) {
  const texts = [q.q];
  if(q.o && Array.isArray(q.o)) q.o.forEach(o => texts.push(o.t));
  if(q.e) texts.push(q.e);
  const fullText = texts.join(' ');
  const found = [];
  const sorted = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
  for(const term of sorted) {
    if(fullText.includes(term)) found.push({term, def: GLOSSARY[term]});
  }
  return found;
}

/* ================================================================
   ===================== 术语高亮 + 弹定义 ================
   ================================================================ */
// 长词优先排序，独立 token 边界匹配，避免 EBS 误标 Amazon EBS 中的 EBS 等
function getGlossarySortedKeys() {
  return Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
}

// 判断术语在文本中是否为独立出现（前后非字母/数字）
function isIndependentToken(text, idx, term) {
  const before = text[idx-1];
  const after = text[idx + term.length];
  const isLetter = c => c && /[A-Za-z0-9]/.test(c);
  return !isLetter(before) && !isLetter(after);
}

// 将解析正文中的术语高亮为可点击 span，返回 HTML
function fmtExp(s){ let t=(s===undefined||s===null)?'':String(s); t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); t=t.replace(/\n/g,'<br>'); t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); return t; }
function highlightGlossaryTerms(text) {
  if(!text) return text;
  const sortedKeys = getGlossarySortedKeys();
  let result = '';
  let i = 0;
  while(i < text.length) {
    let matched = false;
    for(const term of sortedKeys) {
      if(!term) continue;
      const idx = text.indexOf(term, i);
      if(idx === i && isIndependentToken(text, idx, term)) {
        const def = GLOSSARY[term] || '（暂无定义）';
        const termEsc = term.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const defEsc = def.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        result += `<span class="gloss-term" onclick="showGlossTip(event,'${termEsc}','${defEsc}')">${term}</span>`;
        i += term.length;
        matched = true;
        break;
      }
    }
    if(!matched) {
      // 中文等宽字符直接输出，保持原文本
      result += text[i];
      i++;
    }
  }
  return result;
}

// 点击术语弹出定义浮层
function showGlossTip(e, term, def) {
  e.stopPropagation();
  const tip = document.getElementById('glossTip');
  document.getElementById('glossTipTerm').textContent = term;
  document.getElementById('glossTipDef').textContent = def || '（暂无定义）';
  tip.style.display = 'block';
  // 定位：优先在点击位置下方，避免超出视口
  const pad = 12;
  let left = e.clientX + pad;
  let top = e.clientY + pad;
  // 先渲染再量尺寸
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if(left + tw > window.innerWidth - 8) left = e.clientX - tw - pad;
  if(top + th > window.innerHeight - 8) top = e.clientY - th - pad;
  if(left < 8) left = 8;
  if(top < 8) top = 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

function closeGlossTip() {
  document.getElementById('glossTip').style.display = 'none';
}

// 点击页面其它区域关闭浮层
document.addEventListener('click', function(e) {
  const tip = document.getElementById('glossTip');
  if(tip && tip.style.display === 'block' && !tip.contains(e.target)) {
    closeGlossTip();
  }
});

// 按 Esc 关闭浮层
document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') closeGlossTip();
});

/* ================================================================
   ===================== localStorage 操作 =========================
   ================================================================ */
const LS_ANSWERS = LS_PREFIX + '_answers';
const LS_WRONG   = LS_PREFIX + '_wrong';
const LS_PROGRESS = LS_PREFIX + '_progress';

function getAnswers() { return JSON.parse(localStorage.getItem(LS_ANSWERS)||'[]'); }
function setAnswers(a) { localStorage.setItem(LS_ANSWERS,JSON.stringify(a)); }
function getWrong() { return JSON.parse(localStorage.getItem(LS_WRONG)||'[]'); }
function setWrong(w) { localStorage.setItem(LS_WRONG,JSON.stringify(w)); }
function getProgress() { return JSON.parse(localStorage.getItem(LS_PROGRESS)||'{}'); }
function setProgress(p) { localStorage.setItem(LS_PROGRESS,JSON.stringify(p)); }

/* ----------------------------------------------------------------
   作答记录：会话态 / 累计统计态分离（修复）
   旧缺陷：模拟考核误读全局 localStorage 历史 → 进场即显示「已答对/曾答错」、
   题号导航提前染色、成绩单把练习与往场算进本次（实测正确数>题数、未答为负、
   分数超满分、正确率>100%）。
   三态口径：
     · sessionResults()       本场逐题作答（quizState.results）＝「本次」唯一真源
     · sessionScopedAnswers() 视图用作答集：考核=仅本场；练习模式=全局历史（原行为）
     · recordAnswer()         仍写全局 store → 错题集与统计口径不变
   ---------------------------------------------------------------- */
function sessionResults() {
  const r = (quizState && quizState.results) || {};
  return Object.keys(r).map(id => ({id, ua:r[id].ua, ok:r[id].ok, ts:r[id].ts}));
}
function sessionScopedAnswers() {
  return (quizState && quizState.mode === 'exam') ? sessionResults() : getAnswers();
}

function recordAnswer(qId, userAnswer, isCorrect) {
  const answers = getAnswers();
  answers.push({id:qId,ua:userAnswer,ok:isCorrect,ts:Date.now()});
  setAnswers(answers);
  const wrong = getWrong();
  const idx = wrong.findIndex(w=>w.id===qId);
  if(!isCorrect) {
    if(idx>=0) { wrong[idx].count++; wrong[idx].last=Date.now(); }
    else { wrong.push({id:qId,count:1,last:Date.now(),mastered:false}); }
  }
  setWrong(wrong);
}

function markMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=true;
  setWrong(wrong);
}
function unmarkMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=false;
  setWrong(wrong);
}
function removeWrong(qId) {
  setWrong(getWrong().filter(x=>x.id!==qId));
}

/* ================================================================
   ===================== 辅助函数 =================================
   ================================================================ */
const DOMAIN_NAMES = META.domains || {};
const DOMAIN_WEIGHTS = META.weights || {};
const DOMAIN_KEYS = Object.keys(DOMAIN_NAMES).map(Number).sort((a,b)=>a-b);
const EXAM_P = META.examParams || {};
const EXAM_COUNT = EXAM_P.count || 50;
const EXAM_MIN = EXAM_P.minutes || 60;
const EXAM_PASS = EXAM_P.pass || 700;
const TYPE_NAMES = {single:'单选题',multiple:'多选题',hot:'拖拽题'};

// 走全集：模考池题目不在练习池里，但模考错题会进错题集，取题必须能取到
function getQById(id) { return QUIZ_QUESTIONS.find(q=>q.id===id); }
function shuffle(arr) { const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function generateShuffledOptions(questions) {
  const opts = {};
  const newAnswers = {};
  questions.forEach(q => {
    if(q.t==='single'||q.t==='multiple') {
      const shuffled = shuffle([...q.o]);
      const labels = 'ABCDEFGHIJ';
      const relabeled = shuffled.map((item, i) => ({l: labels[i], t: item.t}));
      opts[q.id] = relabeled;
      const contentToNewLabel = {};
      relabeled.forEach(item => { contentToNewLabel[item.t] = item.l; });
      newAnswers[q.id] = q.a.map(oldL => {
        const oldItem = q.o.find(o => o.l === oldL);
        return oldItem ? contentToNewLabel[oldItem.t] : oldL;
      });
    }
  });
  return { opts, newAnswers };
}

function getStats() {
  const answers = getAnswers();
  const wrong = getWrong();
  const totalCorrect = answers.filter(a=>a.ok).length;
  const totalAnswered = answers.length;
  const acc = totalAnswered ? Math.round(totalCorrect/totalAnswered*100) : 0;
  const doneIds = [...new Set(answers.map(a=>a.id))];
  const completion = Math.round(doneIds.length/QUESTIONS.length*100);
  const domainStats = {};
  for(const d of DOMAIN_KEYS) {
    const dQIds = QUESTIONS.filter(q=>q.d===d).map(q=>q.id);
    const dAnswers = answers.filter(a=>dQIds.includes(a.id));
    const dCorrect = dAnswers.filter(a=>a.ok).length;
    const dTotal = dAnswers.length;
    domainStats[d] = {
      total:dQIds.length, answered:dTotal, correct:dCorrect,
      acc: dTotal ? Math.round(dCorrect/dTotal*100) : 0
    };
  }
  const typeStats = {};
  for(const t of ['single','multiple']) {
    const tQIds = QUESTIONS.filter(q=>q.t===t).map(q=>q.id);
    const tAnswers = answers.filter(a=>tQIds.includes(a.id));
    const tCorrect = tAnswers.filter(a=>a.ok).length;
    const tTotal = tAnswers.length;
    typeStats[t] = { answered:tTotal, correct:tCorrect, acc: tTotal ? Math.round(tCorrect/tTotal*100) : 0 };
  }
  const recentWrong = wrong.filter(w=>!w.mastered).sort((a,b)=>b.last-a.last).slice(0,5);
  const recent = answers.slice(-20).reverse();
  let streak = 0;
  for(const a of recent) { if(a.ok) streak++; else break; }
  return {totalCorrect,totalAnswered,acc,completion,domainStats,typeStats,recentWrong,streak,doneIds:doneIds.length};
}

}

function renderDashboard() {

    <button class="btn-primary" onclick="startRealExam()" style="background:#7c3aed;color:#fff">🎯 全真模考（${MOCK_QUESTIONS.length}题 · ${MOCK_SCORED.size}题计分 / ${EXAM_MIN}分钟）</button>` : '') + `
  </div>`;

    s.recentWrong.forEach(w=>{
      const q = getQById(w.id);

function renderQuiz() {
  const el = document.getElementById('page-quiz');
  if(!quizState || !quizState.questions.length) {
    el.innerHTML = `<div class="header"><button class="back-btn" onclick="navigate('dashboard')">←</button><h1>刷题</h1></div>
    <p style="text-align:center;margin-top:60px;color:var(--text2)">暂无题目，请从仪表盘选择模式开始练习</p>`;
    return;
  }
  const q = quizState.questions[quizState.currentIdx];
  const isHot = q.t === 'hot';
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  // 考核=仅本场作答；练习模式=全局历史（含本场）——防练习记录串进考核视图
  const answers = sessionScopedAnswers();
  const prevAnswers = answers.filter(a=>a.id===q.id);
  const everCorrect = prevAnswers.some(a=>a.ok);
  const everWrong = prevAnswers.some(a=>!a.ok);
  const answered = quizState.answered || {};
  let userAns = answered[q.id];
  const finished = quizState.submitted && quizState.submitted[q.id];
  const correct = finished && isAnswerCorrect(q, userAns);

  let modeLabel = quizState.mode==='exam'?'📋 模拟考核':quizState.mode==='wrong'?'❌ 错题重练':quizState.mode==='domain'?'📖 章节练习':quizState.mode==='single'?'📝 单题练习':'📝 顺序练习';

  let html = `<div class="quiz-header">
    <button class="back-btn" onclick="exitQuiz()">←</button>
    <span style="font-weight:600;font-size:15px">${modeLabel}</span>
    ${quizState.mode==='exam'?`<span class="timer" id="quizTimer"></span>`:''}
    <span class="quiz-progress">${quizState.currentIdx+1}/${quizState.questions.length}</span>
  </div>`;
  html += `<div class="quiz-meta">
    <span class="domain-tag">Domain ${q.d}</span>
    <span>${DOMAIN_NAMES[q.d]}</span>
    <span>${TYPE_NAMES[q.t]}</span>
    ${everCorrect?'<span style="background:rgba(6,214,160,.15);color:var(--correct)">已答对</span>':''}
    ${everWrong?'<span style="background:rgba(239,71,111,.15);color:var(--wrong)">曾答错</span>':''}
  </div>`;
  html += `<div class="question-text">${q.q}</div>`;

  const renderOpts = getOptionsHTML(q, userAns, finished, correct, getShuffledAnswer(q));
  html += renderOpts;

  if(isHot) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?'▶ 完成返回':'▶ 下一题'}</button>
    </div>`;
  } else if(!finished) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>✅ 确认</button>
    </div>`;
  } else {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?(quizState.mode==='exam'?'📊 交卷查看成绩':'▶ 完成返回'):'▶ 下一题'}</button>
    </div>`;
  }

  if(finished) {
    const badge = correct ? '✅ 回答正确!' : '❌ 回答错误';
    const cls = correct ? 'correct' : 'wrong';
    const gItems = getGlossaryForQuestion(q);
    let gHtml = '';
    if(gItems.length) {
      gHtml = '<div class="glossary"><div class="glossary-title">词汇附录</div>';
      gItems.forEach(g => {
        gHtml += '<div class="glossary-item"><span class="glossary-term">' + g.term + '</span><span class="glossary-def">\u00a0\u2014\u00a0' + g.def.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span></div>';
      });
      gHtml += '</div>';
    }
    html += `<div class="explanation show">
      <div class="result-badge ${cls}">${badge}</div>
      <div class="exp-text"><strong>正确答案：</strong>${formatAnswer(q)}</div>
      <div class="exp-text" style="margin-top:8px"><strong>解析：</strong>${highlightGlossaryTerms(fmtExp(q.e))}</div>
      ${q.s?`<div class="exp-source">来源：${q.s}</div>`:''}
      ${gHtml}
    </div>`;
  }

  html += `<div class="qnav"><h4>题号导航</h4><div class="qnav-grid">`;
  quizState.questions.forEach((qq, i) => {
    const qAnswers = answers.filter(a=>a.id===qq.id);
    const qCor = qAnswers.some(a=>a.ok);
    const qWro = qAnswers.some(a=>!a.ok);
    let cls = '';
    if(i===quizState.currentIdx) cls='current';
    else if(qCor) cls='done-correct';
    else if(qWro) cls='done-wrong';
    html += `<div class="qnav-item ${cls}" onclick="jumpToQuestion(${i})">${i+1}</div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
  if(!finished) updateSubmitButton();
}

function getOptionsHTML(q, userAns, finished, correct, shuffledAns) {
  let html = '';
  const qtype = q.t;
  if(qtype === 'hot') {
    html += `<div class="options-list" style="background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:16px">
      <div style="font-weight:600;color:var(--primary);margin-bottom:8px">🖱 本题为拖拽/操作题（HOTSPOT）</div>
      <div style="font-size:13px;line-height:1.7;color:var(--text2)">本题无标准 A/B/C/D 选项，答题形式为图形拖拽/区域选择。题目与图形见源 PDF 原图，答案请参照源文件。</div>`;
    if(q.e) {
      html += `<div style="margin-top:10px;font-size:13px;line-height:1.7;color:var(--text2);border-top:1px solid var(--border);padding-top:10px"><strong>解析/提示：</strong><br>${highlightGlossaryTerms(fmtExp(q.e))}</div>`;
    }
    html += `</div>`;
    return html;
  }
  if(qtype === 'single' || qtype === 'multiple') {
    const isMulti = qtype === 'multiple';
    html += `<div class="options-list">`;
    const opts = quizState.shuffledOptions && quizState.shuffledOptions[q.id] ? quizState.shuffledOptions[q.id] : q.o;
    opts.forEach(o => {
      const isSelected = userAns && userAns.includes(o.l);
      let cls = 'option-item';
      if(isMulti) cls += ' multi';
      if(isSelected && !finished) cls += ' selected';
      if(finished) {
        if(shuffledAns.includes(o.l)) cls += ' correct';
        else if(isSelected) cls += ' wrong';
      }
      const onclick = finished ? '' : `toggleOption('${o.l}')`;
      html += `<div class="${cls}" onclick="${onclick}">
        <span class="opt-label">${o.l}</span>
        <span>${o.t}</span>
      </div>`;
    });
    html += `</div>`;
    if(isMulti && !finished) html += `<div style="font-size:13px;color:var(--text2);margin-top:-12px;margin-bottom:16px">多选——请选择所有正确答案后提交（至少选 2 项）</div>`;
  }
  return html;
}

/* ================================================================
   ===================== 交互逻辑 =================================
   ================================================================ */

function toggleOption(label) {
  const q = quizState.questions[quizState.currentIdx];
  if(!quizState.answered) quizState.answered = {};
  if(q.t==='single') {
    quizState.answered[q.id] = [label];
  } else {
    const arr = quizState.answered[q.id] || [];
    const idx = arr.indexOf(label);
    if(idx>=0) arr.splice(idx,1);
    else arr.push(label);
    quizState.answered[q.id] = arr;
  }
  renderQuiz();
}

function updateSubmitButton() {
  const q = quizState.questions[quizState.currentIdx];
  if(q.t === 'hot') return;
  const ans = quizState.answered && quizState.answered[q.id];
  const btn = document.getElementById('submitBtn');
  if(!btn) return;
  if(q.t==='single') btn.disabled = !ans || !ans.length;
  else if(q.t==='multiple') btn.disabled = !ans || ans.length < 2;
}

function getShuffledAnswer(q) {
  if(quizState && quizState.shuffledAnswers && quizState.shuffledAnswers[q.id]) {
    return quizState.shuffledAnswers[q.id];
  }
  return q.a;
}

function isAnswerCorrect(q, userAns) {
  if(!userAns) return false;
  const ca = getShuffledAnswer(q);
  if(q.t==='single') return userAns[0]===ca[0];
  if(q.t==='multiple') { const a=[...userAns].sort(); const b=[...ca].sort(); return JSON.stringify(a)===JSON.stringify(b); }
  return false;
}

function formatAnswer(q) {
  const ca = getShuffledAnswer(q);
  if(q.t==='single'||q.t==='multiple') return ca.join(', ');
  if(q.t==='hot') return '本题为拖拽/操作题，答案为图形区域匹配，见源 PDF 原图';
  return '';
}

function submitAnswer() {
  const q = quizState.questions[quizState.currentIdx];
  let userAns = quizState.answered && quizState.answered[q.id];
  if(!userAns) return;
  if(q.t==='multiple' && userAns.length < 2) {
    alert('多选题至少选择 2 个答案，当前只选了' + userAns.length + '个');
    return;
  }
  const correct = isAnswerCorrect(q, userAns);
  if(!quizState.submitted) quizState.submitted={};
  quizState.submitted[q.id]=true;
  // 本场作答留痕（考核判分唯一依据；不与全局统计混用）
  if(!quizState.results) quizState.results={};
  quizState.results[q.id]={ua:[...userAns], ok:correct, ts:Date.now()};
  recordAnswer(q.id, userAns, correct);
  renderQuiz();
  updateSubmitButton();
}

function prevQuestion() {
  if(quizState.currentIdx > 0) { quizState.currentIdx--; renderQuiz(); }
}
function nextQuestion() {
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  if(isLast) {
    if(quizState.mode==='exam') renderExamResult();
    else navigate('dashboard');
  } else {
    quizState.currentIdx++;
    renderQuiz();
  }
}
function jumpToQuestion(idx) {
  quizState.currentIdx = idx;
  renderQuiz();
}
function exitQuiz() {
  // 考核中途退出必须停表：否则过期计时器归零时会把之后的练习页改写成「考核成绩单」
  if(quizState && quizState.mode==='exam') stopExamTimer();
  if(quizState && quizState.mode!=='exam') {
    setProgress({mode:quizState.mode,domain:quizState.domain||null,idx:quizState.currentIdx,time:Date.now()});
  }
  quizState = null;
  navigate('dashboard');
}

/* ================================================================
   ===================== 刷题模式启动 ==============================
   ================================================================ */
function startDomain(d) {
  const qs = QUESTIONS.filter(q=>q.d===d);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'domain',domain:d,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startContinue() {
  const p = getProgress();
  if(p.mode && p.mode!=='exam') {
    if(p.mode==='domain' && p.domain) {
      const qs = QUESTIONS.filter(q=>q.d===p.domain);
      const _sr=generateShuffledOptions(qs);
      quizState = {mode:'domain',domain:p.domain,questions:qs,currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    } else {
      const _sr=generateShuffledOptions([...QUESTIONS]);
      quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    }
  } else {
    const _sr=generateShuffledOptions([...QUESTIONS]);
    quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  }
  navigate('quiz');
}
function startWrongReview() {
  const wrong = getWrong().filter(w=>!w.mastered);
  if(!wrong.length) { alert('暂无错题需要复习！'); return; }
  const qs = wrong.map(w=>getQById(w.id)).filter(Boolean);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'wrong',domain:null,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startSingle(id) {
  const q = getQById(id);
  if(!q) return;
  const _sr=generateShuffledOptions([q]);
  quizState = {mode:'single',domain:null,questions:[q],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startExam() {
  // 模拟考核：按 meta 权重 × meta 题数分配各域配额（最大余数法，保证总和=EXAM_COUNT）
  // 回退规则（11-19 定案）：练习池不足承诺题数（EXAM_COUNT）时，模拟考核改从模考池出卷。
  // 口径：仍按整卷计分（mode:'exam'，与全真模考的官方计分结构不同）；模考错题入错题集为既有设计。
  // 存量科目练习池均充足或无模考池，此分支不触发，行为零变化（soa-c03 为首门触发科目）。
  const srcPool = (QUESTIONS.length < EXAM_COUNT && MOCK_QUESTIONS.length >= EXAM_COUNT) ? MOCK_QUESTIONS : QUESTIONS;
  const counts = {};
  let sumInt = 0;
  const raw = {}, rem = {};
  DOMAIN_KEYS.forEach(k => {
    const w = parseFloat(String(DOMAIN_WEIGHTS[k]||'0').replace('%',''))/100;
    raw[k] = w * EXAM_COUNT;
    counts[k] = Math.floor(raw[k]);
    rem[k] = raw[k] - counts[k];
    sumInt += counts[k];
  });
  let deficit = EXAM_COUNT - sumInt;
  const order = [...DOMAIN_KEYS].sort((a,b)=>rem[b]-rem[a]);
  let i = 0;
  while(deficit > 0) { counts[order[i % order.length]]++; deficit--; i++; }
  let selected = [];
  DOMAIN_KEYS.forEach(d => {
    const pool = shuffle(srcPool.filter(q=>q.d===d && q.t!=='hot'));
    selected.push(...pool.slice(0, counts[d]));
  });
  // 安全网：个别域可用题数不足以覆盖配额时，从剩余可用题补齐（正常 blueprint 下不触发）
  if (selected.length < EXAM_COUNT) {
    const used = new Set(selected.map(q=>q.id));
    const rest = shuffle(srcPool.filter(q=>q.t!=='hot' && !used.has(q.id)));
    selected.push(...rest.slice(0, EXAM_COUNT - selected.length));
  }
  selected = shuffle(selected);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam',domain:null,questions:selected,currentIdx:0,answered:{},submitted:{},results:{},shuffledOptions:_exam.opts,shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  // 场次标识：计时回调据此判定「本场是否仍在进行」，防过期计时器串场
  quizState.examToken = 'ex-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

function startRealExam() {
  // 全真模考：固定用模考池出卷（题数/计分结构/时长按官方口径），每次只重排题序与选项。
  // 与随机模考的区别：题目固定可复现，分数可跨场对比；题目与练习池隔离，平时练不到。
  const pool = MOCK_QUESTIONS.slice();
  if(!pool.length) { alert('本卷未配置模考池，请用随机模考'); return; }
  const selected = shuffle(pool);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam', fullMock:true, domain:null, questions:selected, currentIdx:0, answered:{}, submitted:{}, shuffledOptions:_exam.opts, shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  quizState.examToken = 'mx-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

let examTimerInterval = null;
function stopExamTimer() {
  if(examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
}
function startExamTimer() {
  let secs = quizState.examDuration;
  const token = quizState.examToken;
  const timerEl = document.getElementById('quizTimer');
  if(!timerEl) return;
  stopExamTimer();
  examTimerInterval = setInterval(() => {
    // 场次校验：已退出或已换场（新 token）立即自毁
    if(!quizState || quizState.mode!=='exam' || quizState.examToken!==token) { stopExamTimer(); return; }
    secs--;
    const m = Math.floor(secs/60), s = secs%60;
    const el = document.getElementById('quizTimer');
    if(el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if(secs<=60 && el) el.classList.add('warning');
    if(secs<=0) { stopExamTimer(); finishExam(token); }
  }, 1000);
}

function finishExam(token) {
  stopExamTimer();
  // 只对「发起本场计时」的考核会话生效
  if(quizState && quizState.mode==='exam' && (token===undefined || quizState.examToken===token)) renderExamResult();
}

function renderExamResult() {
  if(!quizState) return;
  stopExamTimer();
  const qs = quizState.questions;
  const results = quizState.results || {};
  const fullMock = !!quizState.fullMock;
  // 全真模考按官方口径只判计分题（50 题）；随机模考与其它模式仍整卷计分
  const counted = fullMock ? qs.filter(q => MOCK_SCORED.has(q.id)) : qs;
  const total = counted.length;
  // 逐题按本场作答判分；全局历史与往场作答一律不计
  let correct = 0, wrong = 0, unanswered = 0;
  const domStat = {};
  DOMAIN_KEYS.forEach(d => domStat[d] = {n:0, cor:0});
  counted.forEach(q => {
    if(!domStat[q.d]) domStat[q.d] = {n:0, cor:0};
    domStat[q.d].n++;
    const r = results[q.id];
    if(!r) unanswered++;
    else if(r.ok) { correct++; domStat[q.d].cor++; }
    else wrong++;
  });
  // 不变量自校验：正确 + 错误 + 未答 必须等于计分题数
  if(correct + wrong + unanswered !== total) console.warn('[exam] 判分不变量异常', {correct, wrong, unanswered, total});
  const el = document.getElementById('page-quiz');
  const pct = total ? Math.round(correct/total*100) : 0;
  // 1000-point scale, 700 to pass
  const scaledScore = total ? Math.round(correct/total*1000) : 0;
  const passed = scaledScore >= EXAM_PASS;
  // Time used
  const timeUsed = quizState.examStartTime ? Math.round((Date.now()-quizState.examStartTime)/1000) : 0;
  const timeM = Math.floor(timeUsed/60), timeS = timeUsed%60;

  // Domain breakdown
  let domainHtml = '';
  for(const d of DOMAIN_KEYS) {
    const dd = domStat[d] || {n:0, cor:0};
    const dPct = dd.n ? Math.round(dd.cor/dd.n*100) : 0;
    domainHtml += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${dd.n}</td><td>${dd.cor}</td><td style="color:${dPct>=70?'var(--correct)':'var(--wrong)'}">${dPct}%</td></tr>`;
  }

  el.innerHTML = `<div class="header"><button class="back-btn" onclick="exitExam()">←</button><h1>${fullMock ? '🎯 全真模考成绩单' : '📋 考核成绩单'}</h1></div>
  <div style="text-align:center;padding:30px 20px">
    <div style="font-size:48px;font-weight:700;color:${passed?'var(--correct)':'var(--wrong)'}">${scaledScore}</div>
    <div style="font-size:14px;color:var(--text2);margin:4px 0">满分 1000 分 | 及格线 ${EXAM_PASS} 分${fullMock ? " | 计分题 " + total + " 题（卷面 " + qs.length + " 题，不计分 " + (qs.length - total) + " 题）" : ""}</div>
    <div style="font-size:16px;color:var(--text);margin:12px 0;font-weight:600">${passed?'✅ 通过！':'❌ 未通过'}</div>
    <div style="display:flex;justify-content:center;gap:20px;margin:16px 0;flex-wrap:wrap">
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--correct)">${correct}</div><div style="font-size:12px;color:var(--text2)">正确</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--wrong)">${wrong}</div><div style="font-size:12px;color:var(--text2)">错误</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text2)">${unanswered}</div><div style="font-size:12px;color:var(--text2)">未答</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--primary)">${pct}%</div><div style="font-size:12px;color:var(--text2)">正确率</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text)">${timeM}分${timeS.toString().padStart(2,'0')}秒</div><div style="font-size:12px;color:var(--text2)">用时</div></div>
    </div>
  </div>
  <div class="stats-chart">
    <h3>各章节成绩</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>题数</th><th>正确</th><th>正确率</th></tr></thead><tbody>
    ${domainHtml}
    </tbody></table>
  </div>
  <div style="text-align:center;padding:20px">
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn-secondary" onclick="exitExam()" style="width:auto">返回首页</button>
      <button class="btn-primary" onclick="${fullMock ? 'startRealExam()' : 'startExam()'}" style="width:auto;flex:none">再考一次</button>
    </div>
  </div>`;
  quizState = null;
}

function exitExam() {
  quizState = null;
  navigate('dashboard');
}

function drawDomainChart(s) {
  const c = document.getElementById('chartDomain');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = DOMAIN_KEYS.map(k=>'D'+k);
  const colors = ['#4361ee','#4cc9f0','#06d6a0','#f8961e','#9b5de5'];
  const barW = (W-80) / (labels.length*1.5);
  labels.forEach((l,i)=>{
    const val = s.domainStats[i+1].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(l, x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

function drawTypeChart(s) {
  const c = document.getElementById('chartType');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = ['单选','多选'];
  const keys = ['single','multiple'];
  const colors = ['#4361ee','#4cc9f0'];
  const barW = (W-80) / 4;
  keys.forEach((k,i)=>{
    const val = s.typeStats[k].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

/* roundRect polyfill */
if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(r>w/2) r=w/2;
    if(r>h/2) r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    return this;
  };
}

    answers: getAnswers(),
    wrong: getWrong(),
    progress: getProgress(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${LS_PREFIX}-quiz-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.answers) setAnswers(data.answers);
        if(data.wrong) setWrong(data.wrong);
        if(data.progress) setProgress(data.progress);
        alert('数据导入成功！');
        navigate(currentPage);
      } catch(err) { alert('数据格式错误，请检查文件。'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetData() {
  showModal('确认重置', '确定要清除所有答题记录、错题集和进度吗？此操作不可恢复！', () => {
    localStorage.removeItem(LS_ANSWERS);
    localStorage.removeItem(LS_WRONG);
    localStorage.removeItem(LS_PROGRESS);
    navigate('dashboard');
  });
}

/* ================================================================
   ===================== 模态框 ====================================
   ================================================================ */
let modalCallback = null;
function showModal(title, text, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOverlay').classList.add('show');
  modalCallback = onConfirm;
  document.getElementById('modalConfirmBtn').onclick = () => {
    closeModal();
    if(modalCallback) modalCallback();
  };
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

/* ================================================================
   ===================== 主题切换 ==================================
   ================================================================ */
function toggleTheme() {
  document.getElementById('quizView').classList.toggle('dark');
  localStorage.setItem(LS_PREFIX+'_theme', document.getElementById('quizView').classList.contains('dark')?'dark':'light');
  navigate(currentPage);
}

/* ================================================================
   ===================== 初始化 ====================================
   ================================================================ */
function init() {
  if(localStorage.getItem(LS_PREFIX+'_theme')==='dark') document.getElementById('quizView').classList.add('dark');
  const pages = ['dashboard','quiz','wrongbook','stats','settings'];
  const app = document.getElementById('app');
  pages.forEach(p => {
    const div = document.createElement('div');
    div.id = 'page-'+p;
    div.className = 'page' + (p==='dashboard'?' active':'');
    app.appendChild(div);
  });
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => { if(btn.dataset.page==='learn'){ if(window.kbShowLearnHome) window.kbShowLearnHome(); } else navigate(btn.dataset.page); });
  });
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', init);

</script>
