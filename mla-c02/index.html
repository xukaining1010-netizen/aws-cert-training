s":"自编·1.2.8"},{"id":"D1-091","d":1,"t":"single","q":"要把大模型在客服问答上的能力迁移到一个小模型上降低推理成本。蒸馏路径对训练数据的要求是：","o":[{"l":"A","t":"只需原始问题，不需要任何输出"},{"l":"B","t":"必须全部使用人工撰写的高质量答案"},{"l":"C","t":"只需要教师模型的最终答案文本，不要任何解释"},{"l":"D","t":"输入+教师模型的输出，且输出最好包含理由（思维链），并抽检过滤教师的明显错误"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 蒸馏（distillation）的定义就是用教师模型的输出训练学生：数据=输入+教师输出。教材两个要点：①教师的输出要包含理由（思维链），学生学的是推理路径而非表面映射；②教师难免有错，要抽检过滤明显错误的样本，否则把错误也学下来。\n\n**其他选项为什么错：**\n- A. 没有输出无从蒸馏\n- B. 人工答案是普通微调的做法，违背蒸馏「借教师产出」的初衷\n- C. 不要解释会把蒸馏降级为答案模仿，学不到推理过程。\n\n**关键概念：** 三路径数据形态终极对照：微调=人工配对（改行为）、续训=大语料（补知识）、蒸馏=教师输出带理由（搬家）。量级分别为数百到数万/千万 token 起/数千到数十万。","s":"自编·1.2.9"},{"id":"D1-092","d":1,"t":"single","q":"数据质量规则中有一条「分区 T-1 的数据必须在每日 6 点前到达」。这属于六个质量维度中的哪一个？","o":[{"l":"A","t":"及时性"},{"l":"B","t":"完整性"},{"l":"C","t":"一致性"},{"l":"D","t":"有效性"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 「到得够不够快」就是及时性（timeliness）的定义，教材六维度表原话「分区 T-1 在每日 6 点前到达」。六维度各自的标志性规则要能对号：完整性=非空率/必填列；准确性=金额≥0、年龄 0–120；一致性=订单总额=明细之和；唯一性=主键唯一/去重后偏差≤1%；及时性=到达时间承诺；有效性=手机号正则/日期格式/schema 匹配。\n\n**其他选项为什么错：**\n- B. 完整性关心「有没有缺」，不是「什么时候到」\n- C. 一致性管跨表跨字段自洽\n- D. 有效性管格式类型。\n\n**关键概念：** 六维度是 1.3.1 的必背表，考题给规则让你归维度，抓规则里的动词：缺/错/矛盾/重复/迟到/格式错。","s":"自编·1.3.1"},{"id":"D1-093","d":1,"t":"single","q":"标注任务需要规模化处理 10 万条样本，要求内置标注界面并支持管理自有标注员。最合适的 AWS 服务是：","o":[{"l":"A","t":"Amazon Rekognition Custom Labels"},{"l":"B","t":"Amazon SageMaker Ground Truth"},{"l":"C","t":"AWS Glue DataBrew"},{"l":"D","t":"Amazon Textract"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** Ground Truth 是托管标注服务：内置标注界面（图像框选、文本分类等任务模板）、支持自有标注团队与人力供应商管理，还可启用自动标注（auto-labeling）让模型预标、人工只复核——量大自然省成本。\n\n**其他选项为什么错：**\n- A. Rekognition Custom Labels 是图像模型训练服务，不是数据标注平台\n- C. DataBrew 是数据清洗工具，没有标注工作流\n- D. Textract 是文档 OCR，不做人工标注管理。\n\n**关键概念：** 配套记忆：Ground Truth Plus=托管标注 workforce；A2I（Augmented AI）=模型输出的人工复核流程。标注方式四选项（自建/GT 托管/自动标注/弱监督）按「领域门槛+数据能否出内网+量级」对号。","s":"自编·1.3.2"},{"id":"D1-094","d":1,"t":"single","q":"对通用（非时序）分类数据集做训练前处理时，为什么通常要随机打乱（shuffle）样本顺序？","o":[{"l":"A","t":"打乱后数据体积变小，训练更快"},{"l":"B","t":"打乱是所有数据集的必需步骤，包括时序数据"},{"l":"C","t":"消除采集顺序带来的相关性，避免模型学到「位置」而非「内容」的模式"},{"l":"D","t":"打乱可以自动修复错误标签"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 数据常按采集顺序排列（同一时段同类样本扎堆），不打乱会让批内分布偏斜、模型把顺序当信号。shuffle 是考纲偏差缓解手段（splitting/shuffling/augmentation）之一，作用就是「打散顺序、消除采集顺序带来的相关」。\n\n**其他选项为什么错：**\n- A. 打乱不改变数据量\n- B. 教材明确时序数据不能随机打乱——会泄漏未来信息，绝对化错误\n- D. shuffle 与标签质量毫无关系。\n\n**关键概念：** 高频陷阱题式：题干出现「时序/按月/按季度」时，正确答案是「不能 shuffle，按时间切分」；题干是通用分类集时，答案是「要 shuffle」。同一个动作，两个场景相反结论。","s":"自编·1.3.3"},{"id":"D1-095","d":1,"t":"single","q":"多模态数据集要度量文本模态的偏差。以下哪组指标属于文本模态？","o":[{"l":"A","t":"亮度与分辨率分布"},{"l":"B","t":"分位数分布与缺失率差异"},{"l":"C","t":"帧率与码率分布"},{"l":"D","t":"词频分布、各类别文本长度分布、语言占比"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 文本模态的偏差典型表现是「某类表述被系统性标注为负面、语言/方言覆盖不足」，对应度量就是词频分布（表述失衡）、各类别文本长度分布（长短失衡）、语言占比（覆盖失衡）——教材 1.3.4 三模态表的文本行。\n\n**其他选项为什么错：**\n- A. 亮度分辨率是图像模态\n- B. 分位数与缺失率是数值模态\n- C. 帧率码率是视频指标，不在本考点三模态范围内。\n\n**关键概念：** 三模态度量表是必背：数值=分位数/群体均值/缺失率差异；文本=词频/长度分布/语言占比；图像=亮度分辨率/类别占比/场景标签。答题先看题干模态，再对指标家族。","s":"自编·1.3.4"},{"id":"D1-096","d":1,"t":"single","q":"风控模型已上线，误报（误拦正常客户）成本高、漏报（放过欺诈）成本更高。在不重训模型的前提下，最直接的调整手段是：","o":[{"l":"A","t":"调整判定阈值，按业务代价权衡误报与漏报"},{"l":"B","t":"增加训练轮数直到 accuracy 提升"},{"l":"C","t":"更换更强的模型架构重新上线"},{"l":"D","t":"把所有客户都拦下，零漏报"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 阈值调整的定位：不改训练、只改判定线，按业务给出的成本比权衡两类错误——漏报贵就把阈值向「多报警」方向移，代价是误报上升，最终由业务成本比决定平衡点。教材把「需要业务给出成本比」列为该手段的注意点。\n\n**其他选项为什么错：**\n- B. accuracy 在不平衡场景本来就不可靠，且重训周期长\n- C. 换架构是大动作，与「不重训」的前提矛盾\n- D. 全拦把误报推到极致，业务直接停摆。\n\n**关键概念：** 四手段适用条件终记：改训练用类别权重/过采样；不改训练用阈值调整（前提是业务给出成本比）。题干出现「已上线/不重训」就选阈值。","s":"自编·1.3.5"},{"id":"D1-097","d":1,"t":"single","q":"文本分类数据集类别不平衡，少数类样本句式独特。直接复制少数类样本做过采样，潜在的风险是：","o":[{"l":"A","t":"复制样本会导致词表变大"},{"l":"B","t":"模型学到的是少数类的「句式特征」而非语义，泛化能力差"},{"l":"C","t":"复制样本会让训练集超过模型输入上限"},{"l":"D","t":"没有风险，复制是最稳妥的不平衡处理方式"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 教材 1.3.5 特别提示文本与图像的不平衡更麻烦：文本少数类往往句式也独特，复制过采样后模型学到「句式特征」这种捷径而非语义，遇到同语义不同句式的真实样本就失效。改进方向是语义等价改写（增强）而非简单复制——且增强不许改变标签。\n\n**其他选项为什么错：**\n- A. 复制不引入新词，词表不变\n- C. 与输入上限无关，那是单样本长度问题\n- D. 「最稳妥」不成立，复制恰是被点名的问题做法。\n\n**关键概念：** 文本不平衡处理链：先换指标（PR-AUC/F1）→类别权重优先→需要补样本时用语义等价改写（回译/同义替换）并抽检标签不变。","s":"自编·1.3.5"},{"id":"D1-098","d":1,"t":"single","q":"微调数据的 response 字段有一部分在生成时被静默截断（超出上下文上限被切掉尾部）。以下哪个校验项能发现这个问题？","o":[{"l":"A","t":"JSON 格式合法性检查"},{"l":"B","t":"role 标记完整性检查"},{"l":"C","t":"长度合规检查：是否超出上下文上限、是否被静默截断"},{"l":"D","t":"主键唯一性检查"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 静默截断是 1.3.6 配对校验表里「长度合规」项的原文场景：超上限的内容被静默切掉尾部，字段依然非空、JSON 依然合法——只有主动检查长度分布与截断标志（如 finish_reason）才能发现。\n\n**其他选项为什么错：**\n- A. 截断后的 JSON 仍可能合法，查不出\n- B. 角色标记与内容截断无关\n- D. 唯一性查重复，不查截断。\n\n**关键概念：** 配对校验六项的场景化对应再过一遍：空 response→配对完整性；跑题→语义相关性；截断→长度合规；模板错→格式合规；同模板刷量→重复度；该拒不拒→拒答与安全拦截。六项各配一个症状，考试就这么考。","s":"自编·1.3.6"},{"id":"D1-099","d":1,"t":"single","q":"校验微调数据时发现一批样本「用户询问如何处理危险品，模型却给出了详细操作步骤」。这批样本应该归入哪个校验项处理？","o":[{"l":"A","t":"重复度检查"},{"l":"B","t":"格式合规检查"},{"l":"C","t":"配对完整性检查"},{"l":"D","t":"拒答与安全拦截：存在本应拒答却被给了答案的样本，必须剔除"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 「该拒不拒」是配对校验六项里「拒答与安全拦截」的标准场景：安全相关的问题（危险品、违法请求）正确行为是拒答或引导合规渠道，模型却给了实质答案——这种样本进训练集会把「不拒答」学成默认行为。必须剔除，并排查同源数据的生成方式。\n\n**其他选项为什么错：**\n- A. 重复度检查管的是样本是否重复，发现不了行为越界。\n- B. 格式合规检查管模板与结构，与「该不该答」无关。\n- C. 配对完整性检查管 prompt–response 是否成对、字段是否缺失，同样覆盖不到安全问题。\n\n**关键概念：** 与内容安全筛查区分：内容安全扫描的是有害内容本身（PII/毒性/政策禁止），拒答校验扫的是「行为是否正确」——两个视角都要覆盖，训练前一层、推理时 Guardrails 一层。","s":"自编·1.3.6"},{"id":"D1-100","d":1,"t":"single","q":"面对分布未知的长尾数值特征（如用户浏览时长），要检测其中的异常值。最合适的检测方法是：","o":[{"l":"A","t":"分位数截断（如按 1%/99% 分位）"},{"l":"B","t":"3σ 法则"},{"l":"C","t":"假设正态分布后查 Z 表"},{"l":"D","t":"用均值加减固定 100 来划界"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 教材检测方法表的对应关系：分布未知、长尾→分位数截断；近似正态→3σ/IQR；多维非线性→孤立森林/DBSCAN。浏览时长这类长尾数据不满足正态假设，按经验分位（1%/99%）裁剪才是稳健做法。\n\n**其他选项为什么错：**\n- B. 3σ 法则隐含正态假设，长尾分布下均值与标准差被长尾本身拖偏，检测失效。\n- C. 查 Z 表同样以正态分布为前提，分布未知时不可用。\n- D. 均值加减固定 100 是拍脑袋划界，无统计依据，阈值也不随数据尺度自适应。\n\n**关键概念：** 方法选型口诀：知道分布用统计法（3σ/IQR），不知道分布用分位数，多维度复杂关系上模型法（孤立森林/DBSCAN）。检测之后仍要回到「错误值还是真实极端值」的判断，再决定删还是留。","s":"自编·1.3.7"},{"id":"D1-101","d":1,"t":"single","q":"业务人员希望在可视化界面里完成「去重、填充缺失值、批量替换」等清洗操作，并把规则保存为可重复执行的配方（recipe）。最合适的工具是：","o":[{"l":"A","t":"Amazon EMR"},{"l":"B","t":"AWS Glue DataBrew"},{"l":"C","t":"Amazon S3 Select"},{"l":"D","t":"AWS Config"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** DataBrew 的配方（recipe）机制就是为此设计：可视化点选清洗操作（含去重、填充、替换等 250+ 内置转换），保存为可重放、可导出代码的配方，业务人员无需写代码。教材定位「业务探索 DataBrew」。\n\n**其他选项为什么错：**\n- A. EMR 要写 Spark 代码，不是业务人员的可视化工具\n- C. S3 Select 只做对象内简单 SQL 查询，没有清洗与配方概念\n- D. AWS Config 是资源配置合规审计，与数据清洗无关。\n\n**关键概念：** 与 Data Wrangler 再分辨一次：两者都可视化，业务/分析角色清洗探索用 DataBrew，ML 工程师做特征工程接 SageMaker 管道用 Wrangler。角色是答题线索。","s":"自编·1.3.7"},{"id":"D1-102","d":1,"t":"multiple","q":"关于数据治理中的合规要求，以下哪些做法是必要的？（选 2 项）","o":[{"l":"A","t":"含 PII 的数据访问要有细粒度授权与访问审计记录"},{"l":"B","t":"训练数据的使用要能追溯到来源与处理过程（血缘与留痕）"},{"l":"C","t":"数据治理只是合规部门的事，工程团队无需参与"},{"l":"D","t":"只要数据在公司内网，就不需要任何访问控制"},{"l":"E","t":"把生产环境的 PII 数据整体复制一份到开发环境，方便工程师调试"}],"a":["A","B"],"e":"**正确答案：AB。**\n\n**为什么对：** A 是最小权限+可审计双要件：Lake Formation 细粒度授权（表/行/列）+CloudTrail 审计，是 PII 治理的标配形态；B 是可追溯性要求：数据来源、处理过程、筛查留痕构成合规叙事链——「数据从哪来、动过什么、谁能看」三问都要答得上。\n\n**其他选项为什么错：**\n- C. 治理需要工程落地（权限、加密、留痕都是工程动作），甩给合规部门等于没有治理\n- D. 内网不等于无风险，内部横向越权与数据滥用同样是合规事件，访问控制永远需要。\n- E. 复制生产 PII 到开发环境违反最小必要与环境隔离：调试应该用脱敏数据或合成数据，原始 PII 不出生产边界。\n\n**关键概念：** 治理三支柱记忆：权限（谁可以）、追溯（从哪来）、留痕（动过什么）。考题把三者拆成选项，缺哪个补哪个。","s":"自编·1.1.8"},{"id":"D1-103","d":1,"t":"single","q":"训练数据集要求「不同团队只能看到自己业务范围内的行」。例如华东团队只见华东数据。最合适的实现是：","o":[{"l":"A","t":"每个团队复制一份数据到自己的桶，各自维护"},{"l":"B","t":"在查询语句里约定大家都要加 WHERE 条件"},{"l":"C","t":"Lake Formation 的行级过滤（row-level filter），同一张表按标签/条件对不同主体授权不同行集"},{"l":"D","t":"把区域字段加密，团队解密后自行筛选"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 行级过滤是 Lake Formation 的标准能力：为表定义过滤表达式（如 region='华东'），按 LF-tag 或主体绑定，不同团队查询同一张表自动只见授权行集——控制点在存储/目录层，不依赖各端自觉。\n\n**其他选项为什么错：**\n- A. 复制副本会造成口径分叉与同步负担，且违背单一数据源原则\n- B. 靠约定加 WHERE 是纪律不是控制，漏加即越权，审计也无法证明\n- D. 加密字段没法按明文条件过滤，解密后筛选同样失控。\n\n**关键概念：** 权限粒度三级速记：桶/前缀（S3 策略）→表/库（Glue IAM/LF）→行/列（Lake Formation）。题干出现「只见自己范围的行」锁定行级过滤。","s":"自编·1.1.8"},{"id":"D1-104","d":1,"t":"single","q":"数据管道每天产出训练数据。为保证「数据质量规则失败就拦住」，以下哪种架构组合最标准？","o":[{"l":"A","t":"数据先全部写入下游，事后每周人工抽查"},{"l":"B","t":"用 Athena 跑几条 SQL 看看有没有明显异常"},{"l":"C","t":"依赖模型训练时报错来发现问题"},{"l":"D","t":"Glue 作业内嵌 DQDL 规则评估 → 规则失败阻断下游写入 → CloudWatch 告警"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 这是质量门禁的标准链路：Glue Data Quality 的 DQDL 规则与 ETL 同作业执行，失败即阻断（不发布脏数据），结果接 CloudWatch 告警通知值班——「卡住流程+告警」两个动作缺一不可。教材案例：DQDL 规则「行数与上周同日偏差≤30%」当天报出上游 schema 变更。\n\n**其他选项为什么错：**\n- A. 先写后查让脏数据已经进入下游\n- B. 人工 SQL 抽查无阻断能力也无持续性\n- C. 让训练环节兜底是最贵的发现方式，且错误归因困难。\n\n**关键概念：** 门禁三件套：规则（DQDL 六维度）+阻断（失败不发布）+告警（CloudWatch）。只出报告不阻断=没做，教材原话。","s":"自编·1.3.1"},{"id":"D1-105","d":1,"t":"single","q":"标注项目要降低成本，已有初版模型可用于预标注。最经济且可控的标注组合是：","o":[{"l":"A","t":"自动标注（模型预标）+人工只复核，配合黄金集抽检监控质量"},{"l":"B","t":"全部样本由人工从零标注"},{"l":"C","t":"全部用规则自动打标，不做人工复核"},{"l":"D","t":"取消标注，直接用模型输出当标签训练"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 自动标注（auto-labeling）的定位：已有基线模型时，模型预标+人工复核是最省的路径，但必须警惕「继承模型偏差」——预标错的人工可能照单全收，所以黄金集（预埋已知答案样本）持续抽检兜底。教材四方式表中它成本「最省」且注明风险。\n\n**其他选项为什么错：**\n- B. 全人工最贵最慢，放弃了已有模型资产\n- C. 弱监督噪声大，完全无人复核质量失控\n- D. 用模型输出训练同一模型是自证循环（confirmation bias），偏差只会放大。\n\n**关键概念：** 风险意识成对记：自动标注→继承模型偏差；弱监督→噪声大。两者都要有人工复核或黄金集兜底，Ground Truth 的 auto-labeling 工作流内置该机制。","s":"自编·1.3.2"},{"id":"D1-106","d":1,"t":"single","q":"检测到一批异常记录后，业务确认其中一部分是录入错误（年龄 999），另一部分是真实极端值（VIP 大额消费）。正确的处理组合是：","o":[{"l":"A","t":"两类都删除，保持数据干净"},{"l":"B","t":"录入错误修正或置空；真实极端值保留，可单独建模或分箱处理"},{"l":"C","t":"两类都用中位数替换"},{"l":"D","t":"录入错误保留，真实极端值删除"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 处理顺序先分性质再动手，教材原话：错误值（年龄 999）→修正或置空；真实极端值（大额交易）→不能删，删了模型就学不到极端情况，而这往往正是业务最关心的，应保留并考虑单独建模或分箱。B 两条对应精准。\n\n**其他选项为什么错：**\n- A. 把业务最关心的 VIP 行为删掉，检测白做\n- C. 中位数替换对两类都是信息毁灭\n- D. 完全反着做，错误留下、价值删掉。\n\n**关键概念：** 完整决策链记忆：检测（统计/分位/模型法三选）→定性质（错误 or 极端）→分别处置（修/空 vs 留+单独处理）。考题给两类混合的场景，正确答案永远是「分开处理」的那个选项。","s":"自编·1.3.7"},{"id":"D2-001","d":2,"t":"single","q":"客服平台每天要对 8 万条工单做 12 类目分类，要求 2 秒内返回。用高能力 FM 直调准确率 93%，轻量模型 91%，但单价差近 10 倍。在满足时延与成本约束下，最合理的架构是？","o":[{"l":"A","t":"全部流量走高能力 FM，用 Provisioned Throughput 买断吞吐压单价"},{"l":"B","t":"自训一个 BERT 级分类器替换 FM，把准确率做到 95% 以上"},{"l":"C","t":"轻量模型承接全量，低置信度样本二次路由到高能力模型复核"},{"l":"D","t":"把 12 个类目拆成 12 个独立的高能力模型分别调用"}],"a":["C"],"e":"**正确答案：C。** 轻量模型承接全量 + 低置信度样本二次路由到高能力模型。\n\n**为什么对：** 这是「分层路由」标准解法：多数请求被轻量模型吃掉（单价低近 10 倍），只有少量不确定样本才付出高能力模型的钱。教材案例里该组合综合成本降到全用高能力模型的 1/6，准确率回到 92.4%——用极小的成本换回主要精度差距。\n\n**其他选项为什么错：**\n- A. 预置吞吐是买断容量，解决不了「能力过剩」：93% 与 91% 差 2 个点，不值得付 10 倍单价，成本结构没有变。\n- B. 自训是另一条路（2.1.4 的判断），但题干未给标注数据和团队条件，且「做到 95% 以上」是无依据的承诺。\n- D. 拆 12 个模型让调用量与运维翻 12 倍，与成本约束背道而驰。\n\n**关键概念：** 分层路由（简单请求给轻量模型）是推理降本幅度最大的一招，通常 3–6 倍；前提是能定义「低置信度」（如分类概率阈值）。","s":"自编·2.1.1"},{"id":"D2-002","d":2,"t":"multiple","q":"团队为合同审阅场景从 Amazon Bedrock 选基础模型。以下哪些属于教材规定的选型筛选约束？（选 3 项）","o":[{"l":"A","t":"区域可用性与合规：确认模型在指定合规区域可用，跨区域推理时数据是否离开指定区域"},{"l":"B","t":"上下文窗口：200 页合同约十几万 token，窗口不够就只能切块加 RAG"},{"l":"C","t":"用团队的真实样本做小规模评测，而不是看公开榜单排名"},{"l":"D","t":"优先选参数量最大的模型，能力上限越高越好"},{"l":"E","t":"按每千 token 价格从低到高排序，直接选最便宜的模型定案"}],"a":["A","B","C"],"e":"**正确答案：ABC。**\n\n**为什么对：** Bedrock 选模型是在能力、成本、上下文长度、可用区域、合规五条约束下找可行解，且按顺序问：先卡区域与合规（数据能不能出去），再卡上下文（长文档场景的硬门槛），模态、能力评测、成本在后。评测要用真实样本（Bedrock 模型评估支持人工或自动对比），榜单不代表你的任务表现。\n\n**其他选项为什么错：**\n- D. 「参数量最大/最强」是选型大忌：成本档位的正确逻辑是在满足前四条的中选最便宜，而不是选最强的。参数量与任务表现也没有必然对应。\n- E. 顺序反了：成本是五条约束的最后一环，前四条（区域合规、上下文、模态、能力）没过就不该进入比价；先按价格定案再回头换模型等于返工。\n\n**关键概念：** 选型五约束的顺序记忆：区域合规 → 上下文 → 模态 → 能力评测（真实样本）→ 成本。前一条不过就不用看后面；「选最强」永远不是答案，「选够用的最便宜」才是。","s":"自编·2.1.1"},{"id":"D2-003","d":2,"t":"single","q":"一个内容审核平台需要每晚对白天积累的约 10 万条用户评论跑一遍合规复审，非实时、允许数小时内完成、追求最低成本。在 Bedrock 上应选哪种推理方式？","o":[{"l":"A","t":"按需推理（On-Demand），白天流量低时顺便跑"},{"l":"B","t":"预置吞吐（Provisioned Throughput），买断一个模型单元"},{"l":"C","t":"流式响应（Streaming），逐条返回降低感知延迟"},{"l":"D","t":"批量推理（Batch Inference），夜间离线跑大批量"}],"a":["D"],"e":"**正确答案：D。** 批量推理：离线跑大批量、价格更低，专为非实时任务设计。\n\n**为什么对：** 题干三个信号——夜间、非实时、允许数小时——全部指向批量推理。它按作业提交整批请求，价格低于按需，也不占用在线容量。10 万条夜间跑完正好落在它的设计区间。\n\n**其他选项为什么错：**\n- A. 按需是为「流量不稳定、在线服务」设计的计费方式，单价比批量高；「白天顺便跑」还可能与在线流量互相挤占。\n- B. 预置吞吐是按模型单元买断、按时计费，适合稳定高流量且要延迟可预期的在线场景。夜间跑一次批处理会让买断的容量闲置 20 多个小时。\n- C. 流式响应改善的是首字时延的感知，不降单价，与离线批处理场景无关。\n\n**关键概念：** Bedrock 三种推理形态各管一段：按需=流量不稳定在线用；预置吞吐=稳定高流量买断；批量推理=离线大批量省钱。题干出现「夜间/非实时/大批量」就选批量。","s":"自编·2.1.1"},{"id":"D2-004","d":2,"t":"single","q":"企业要做一个产品政策问答助手。政策文档每月更新，回答必须附上依据条文出处，且不同部门只能查询本部门相关的政策。为什么微调不是正确方案？","o":[{"l":"A","t":"微调无法保证事实新鲜度、无法溯源，也做不到按用户的行级权限隔离"},{"l":"B","t":"微调成本太高，政策问答用提示工程就够了"},{"l":"C","t":"微调需要 GPU 集群，企业没有自建算力"},{"l":"D","t":"微调会让模型输出变长，超出上下文窗口"}],"a":["A"],"e":"**正确答案：A。** 三个硬伤全部命中：事实新鲜度、溯源、权限隔离。\n\n**为什么对：** 微调把知识烧进权重，训练结束后模型的知识就定格了——政策每月更新意味着每月都要重训，无法保证新鲜度；权重里的知识给不出「依据哪一条」，无法溯源；更重要的是行级权限：所有人共享同一套权重，做不到「这张合同只有法务能看」。这三条只能靠 RAG：检索时取最新文档、答案带出处、检索层按用户过滤。\n\n**其他选项为什么错：**\n- B. 成本不是本质原因；即便免费，微调也解决不了新鲜度、溯源、权限这三个结构性问题。\n- C. Bedrock 微调是托管能力，不需要自建 GPU 集群，前提就不成立。\n- D. 输出长度与微调无必然关系，干扰项。\n\n**关键概念：** RAG 与微调的分界线几乎每场必考：知识常变/要出处/未标注文档/行级权限 → RAG；格式风格口径问题 → 微调。带权限隔离要求时答案只能是 RAG + 检索时过滤。","s":"自编·2.1.2"},{"id":"D2-005","d":2,"t":"single","q":"法务团队用 800 份历史审阅记录微调模型输出合同风险条款，格式遵循率从 78% 升到 96%。但上线后发现模型开始编造不存在的条款。最对症的修复是？","o":[{"l":"A","t":"加大微调数据量到 5000 份，让模型见得更多"},{"l":"B","t":"训练集加入一定比例的「无风险」样本，并把「不确定就不输出」写进标注规范"},{"l":"C","t":"换用更大的基础模型再微调一次"},{"l":"D","t":"在提示词里加一句「不要编造条款」后直接上线"}],"a":["B"],"e":"**正确答案：B。** 数据分布修偏 + 标注规范固化行为。\n\n**为什么对：** 根因在训练数据：800 份样本全是「有风险」审阅记录，模型学到「总要找出几条」的隐含规则。修复必须回到数据——加入无风险样本让模型见过「答案是零条」的情况，同时用标注规范把「不确定不输出」固化成训练信号。这是微调最典型的副作用与解法。\n\n**其他选项为什么错：**\n- A. 加量不修分布，5000 份全是「有风险」样本只会把偏差学得更牢；且教材明确质量比数量重要。\n- C. 换大模型不改变数据分布问题，编造行为照样出现，成本还更高。\n- D. FM 过拟合很隐蔽：换个问法就崩，一句提示词压不住已学进权重的行为倾向，属于把训练问题交给推理端打补丁。\n\n**关键概念：** 微调数据的分布必须覆盖「正例 + 反例（无风险）」；FM 过拟合要专门准备同义改写测试集来发现。标注不一致（一致率低于 85%）先修规范再训。","s":"自编·2.1.2"},{"id":"D2-006","d":2,"t":"single","q":"一家药企有 200 万字内部研发报告（大量专业术语与行文惯例），没有任何标注，希望模型能更好地理解这个领域的语言。在 Bedrock 上应选哪种定制方式？","o":[{"l":"A","t":"微调（Fine-tuning），用报告当训练对"},{"l":"B","t":"蒸馏（Distillation）"},{"l":"C","t":"持续预训练（Continued Pre-training）"},{"l":"D","t":"提示工程，把术语表写进系统提示词"}],"a":["C"],"e":"**正确答案：C。** 持续预训练：输入无标注领域文本，改变领域语言分布。\n\n**为什么对：** 题干两个信号——大量领域原文、无标注——正好落在持续预训练的适用格：用无标注文本继续训练，吸收术语与行文惯例（改变「领域语言分布」）；之后有带标注任务数据可再叠微调。\n\n**其他选项为什么错：**\n- A. 微调的输入必须是带标注的输入-输出对，200 万字无标注原文没有可用的监督信号，硬凑对子成本极高且质量不可控。\n- B. 蒸馏是用小模型复现大模型表现、目的是降本，不是吸收领域语言。\n- D. 提示工程先试没错，但术语量大、行文惯例深时，几段提示词装不下 200 万字的语言分布，属于该升档不升。\n\n**关键概念：** 三档定制的判据看输入数据：无训练数据→提示工程；带标注对→微调；无标注领域原文→持续预训练；要降本保能力→蒸馏。判断顺序先看「知识会不会变的事实」，再看输入形态。","s":"自编·2.1.2"},{"id":"D2-007","d":2,"t":"single","q":"信贷审批模型必须能向监管机构解释每一笔拒贷的决策依据（特征级归因）。候选方案里包含 XGBoost 与大语言模型两条路线。按可解释性约束应怎么选？","o":[{"l":"A","t":"选 FM，让它在回答里附带解释自己为什么拒贷"},{"l":"B","t":"两个都上，FM 的结果为准，XGBoost 做备份"},{"l":"C","t":"选 FM，用另一个 FM 分析第一个 FM 的输出作为解释"},{"l":"D","t":"选 XGBoost 加 SageMaker Clarify 做特征归因，FM 的输出解释不能作为决策依据"}],"a":["D"],"e":"**正确答案：D。** 可解释性硬约束指向传统 ML + 归因工具。\n\n**为什么对：** 「必须能向监管解释每个决策依据」是本题的决定性约束：XGBoost 这类树模型可以做特征级归因（Clarify 输出 SHAP 值），每个拒贷都能落到「哪些特征贡献了多少」。FM 的解释是对生成文本的事后描述，不是决策依据——它的「理由」和真实决策过程没有可验证的对应关系。\n\n**其他选项为什么错：**\n- A. FM 自己说的理由不可审计，监管场景里等于没有解释；这是金融、医疗、信贷场景的高频考点。\n- B. 「FM 结果为准」意味着最终决策仍不可解释，备份不解决合规问题。\n- C. 用一个黑盒解释另一个黑盒，解释链路更不可信，成本还翻倍。\n\n**关键概念：** 题干出现「向监管解释/可审计/决策依据」→ 答案指向传统 ML（树模型 + Clarify）或规则模型，排除 FM。可解释性是 2.1.3 的三条高频约束之一（另两条是延迟与领域口径）。","s":"自编·2.1.3"},{"id":"D2-008","d":2,"t":"single","q":"线上反欺诈评分服务要求 P99 延迟在 100ms 以内、每秒数千次请求，输入是结构化交易特征。用大语言模型直调能否满足？应该怎么选？","o":[{"l":"A","t":"不能；应选传统 ML 小模型部署在专用推理实例上"},{"l":"B","t":"能，用 Provisioned Throughput 买断吞吐即可压住延迟"},{"l":"C","t":"不能；应选更大算力的 FM 实例并开流式输出"},{"l":"D","t":"能，把 prompt 缩短到 100 token 以内即可"}],"a":["A"],"e":"**正确答案：A。** 硬延迟 + 高 QPS + 结构化输入，指向传统 ML 小模型。\n\n**为什么对：** 三条约束同时卡死 FM 路线：FM 的延迟受输出长度线性影响，长输出场景无法满足硬延迟；数千 QPS 的 token 计费成本也压不住；而反欺诈评分本质是结构化表格上的判别任务，XGBoost 类小模型毫秒级即可完成，天然匹配 P99 100ms。这是 2.1.3 延迟约束的标准结论。\n\n**其他选项为什么错：**\n- B. 预置吞吐买断的是容量、消除排队，但生成时延（逐 token 输出）买不掉，100ms 硬线仍然过不了。\n- C. 流式输出改善的是首字感知，总时长不变；更大算力提高的是吞吐，不是单次生成速度的数量级。\n- D. 缩短 prompt 只优化输入段；评分任务本身无长 prompt 问题，瓶颈在生成段，方向就错了。\n\n**关键概念：** 题干出现「P99 100ms/每秒数千请求」+ 结构化输入 → 传统 ML 小模型 + 专用推理实例。延迟、可解释、领域口径三条约束出现任何一条，都要先考虑非 FM 路线。","s":"自编·2.1.3"},{"id":"D2-009","d":2,"t":"single","q":"费用报销审核系统需要：识别发票金额与日期、判断是否符合报销政策、对异常项生成自然语言说明、全程可审计。以下哪条技术路线是对的？","o":[{"l":"A","t":"把发票图片直接交给一个 FM，让它完成识别、判断与说明的全部工作"},{"l":"B","t":"Textract 抽字段，规则引擎加小模型判断政策符合性，FM 只生成异常说明"},{"l":"C","t":"全流程用 Comprehend，它同时支持实体识别与文本分类"},{"l":"D","t":"Rekognition 识别发票版面，FM 完成其余全部判断"}],"a":["B"],"e":"**正确答案：B。** 把业务问题拆成标准能力，每步做自己最擅长的事。\n\n**为什么对：** 拆解后是三种技术：发票字段抽取是标准 OCR 任务 → Textract，无需自训；政策符合性判断的依据是条文 → 规则引擎 + 小模型，可解释可审计；异常说明是自然语言生成 → FM。三者各归其位，链路每一步都可审计，正是教材的原始案例。\n\n**其他选项为什么错：**\n- A. 「让大模型看图回答一切」是典型外行方案：延迟高、成本高、幻觉不可控、无法审计，也是考试最常见的干扰项。\n- C. Comprehend 处理纯文本，没有 OCR 能力，第一步就走不通；「一个服务包打天下」的思路本身错。\n- D. Rekognition 是图像识别服务（人脸/物体/文字），做发票版面属于用错工具，后面依然把判断全塞给 FM，审计问题没解决。\n\n**关键概念：** 托管 AI 服务的正确用法是「拆问题」而不是「找万能服务」：Textract=文档抽取、Rekognition=图像、Comprehend=文本实体与情感、Transcribe=语音。组合链路题先拆任务再配服务。","s":"自编·2.1.3"},{"id":"D2-010","d":2,"t":"single","q":"一家医疗机构要对临床文本做摘要，但合规要求患者数据不能离开本方 VPC，团队没有能力从零训练模型。四条路径（自建/托管 AI 服务/开源权重自托管/FM 托管调用）中应选哪条？","o":[{"l":"A","t":"托管 AI 服务（Comprehend/Transcribe），托管合规由 AWS 负责"},{"l":"B","t":"直接调用 Bedrock 上的公网 FM 端点"},{"l":"C","t":"开源权重模型自托管在 VPC 内的 SageMaker 上"},{"l":"D","t":"从零自建训练一个医疗领域模型"}],"a":["C"],"e":"**正确答案：C。** 数据不出 VPC → 开源权重自托管。\n\n**为什么对：** 合规约束是四路权衡的第一问，往往直接砍掉一半选项：数据不能出 VPC 时，SaaS 类托管 AI 服务与公网 FM 接口都被排除，转向自托管开源权重模型——部署在 VPC 内 SageMaker 上，权重可改、可私有化，数据全程不出边界，且用预训练权重、无需从零训。这正是教材四路表里「预训练模型自托管」行的必选条件。\n\n**其他选项为什么错：**\n- A. 托管 AI 服务虽然由 AWS 承担合规责任，但数据要发到托管端点处理；在「不能离开本方 VPC」的硬约束下不可选。\n- B. 公网 FM 端点同理，数据出 VPC，直接违反题干硬约束。\n- D. 「从零自建」前期投入最高、迭代最慢，团队也不具备条件；摘要是通用能力不是独家壁垒，自建是纯成本。\n\n**关键概念：** 四路权衡三问的顺序：① 数据和模型能不能出去（合规先砍一半）② 是不是我们的差异化 ③ 单位经济性在什么量级翻转。合规约束永远第一问。","s":"自编·2.1.4"},{"id":"D2-011","d":2,"t":"single","q":"一个文本分类服务日调用量已达 300 万次且非常稳定，初期用 FM 托管调用，月成本随量线性上升，延迟 400ms。按单位经济性分析，成熟的架构演进方向是？","o":[{"l":"A","t":"继续用 FM 并谈判更大折扣，架构不动"},{"l":"B","t":"全部改成自训模型，下线 FM 调用"},{"l":"C","t":"引入消息队列削峰，FM 用量不变"},{"l":"D","t":"自训小型分类模型部署到 SageMaker，同时保留 FM 处理样本不足的新类目"}],"a":["D"],"e":"**正确答案：D。** 高量稳定 → 自训摊薄固定成本，但保留 FM 处理长尾。\n\n**为什么对：** 托管按调用计费、自建按算力计费，存在一个调用量阈值，超过后自建更便宜。日 300 万次且稳定已在阈值后：自训小模型摊薄固定成本，成本大降且延迟 400ms 降到 20ms。但「全部改自建」通常是错的——新类目没有训练样本，FM 少样本能力正好补位，混合架构才是真实答案。\n\n**其他选项为什么错：**\n- A. 折扣谈判不改变成本随量线性上升的结构，量再涨成本继续涨，也没解决延迟。\n- B. 「全部改自建」在长尾类目上无样本可训，等于放弃 FM 的少样本优势；考试里出现「全部改成自建」通常就是错的。\n- C. 削峰解决瞬时压力，300 万次是稳定日均非尖峰，成本结构没变。\n\n**关键概念：** 单位经济性逻辑与「按需 vs 预留实例」同构：低量选托管避固定成本，高量且稳定选自建摊薄固定成本。成熟形态多为混合架构。","s":"自编·2.1.4"},{"id":"D2-012","d":2,"t":"single","q":"公司要给报销系统加发票 OCR 能力。这是行业通用任务，公司没有差异化诉求，也没有 ML 团队。按四路权衡应选哪条路径？","o":[{"l":"A","t":"托管 AI 服务（Amazon Textract），直接调用"},{"l":"B","t":"自建模型，把 OCR 能力沉淀成公司资产"},{"l":"C","t":"开源 OCR 模型自托管，省下调用费"},{"l":"D","t":"用 FM 多模态读发票，顺便理解发票内容"}],"a":["A"],"e":"**正确答案：A。** 标准能力 + 无差异化 + 无团队 → 托管服务。\n\n**为什么对：** 四路权衡第二问「是不是我们的差异化」：发票 OCR 是行业通用能力，自建无法形成壁垒，纯属成本；团队条件（无 ML 团队）也排除了需要维护的自托管路线。Textract 文档文字/表格/表单抽取开箱即用，前期投入低、迭代快。\n\n**其他选项为什么错：**\n- B. 「把 OCR 沉淀成资产」的前提是它构成差异化，通用 OCR 不满足；自建需要数据、算力和团队，三项都不具备。\n- C. 自托管省下调用费，付出部署运维成本，无 ML 团队时维护负担更重。\n- D. FM 读发票单价高、延迟高、字段抽取精度不稳定，用大模型做标准 OCR 属于能力错配；理解发票内容另有 Comprehend 等更合适的工具。\n\n**关键概念：** 判断口诀：标准任务自训是浪费；不是差异化就选托管；数据不能出去才考虑自托管。Textract 能抽文字表格表单签名，但不理解条款含义——能力边界要能说清。","s":"自编·2.1.4"},{"id":"D2-013","d":2,"t":"single","q":"律所要建内部合同问答系统，要求：不同律师只能检索到自己有权查看的合同，答案必须标注出自哪份合同哪一条。以下说法正确的是？","o":[{"l":"A","t":"把合同全部微调进模型，再按用户角色配置不同的系统提示词"},{"l":"B","t":"只能采用 RAG，检索时按用户身份做元数据过滤，答案引用检索命中的文档"},{"l":"C","t":"用 FM 直接读全部合同，靠提示词声明当前用户权限"},{"l":"D","t":"先微调让模型学会「拒答无权内容」，再叠加出处标注微调"}],"a":["B"],"e":"**正确答案：B。** 行级权限 + 出处要求，答案只能是 RAG + 检索时过滤。\n\n**为什么对：** 微调把知识烧进权重，所有人共享同一套知识，提示词改变不了权重内容，「按用户隔离」微调做不到。RAG 的知识在检索层：检索时按用户身份注入元数据过滤条件，无权文档根本不会进入上下文；答案的出处就是检索命中的块，天然可溯源。教材原话：只要有行级权限，答案只能是 RAG + 检索时过滤。\n\n**其他选项为什么错：**\n- A. 系统提示词拦不住模型从权重里「说漏」无权内容，权限隔离是安全要求，不能建立在提示词上。\n- C. 提示词声明的权限没有强制力，FM 直读全部合同也给不出精确到条的可验证出处。\n- D. 「学会拒答」是概率行为不是访问控制，拒不准就是数据泄漏，出处也无法验证到条。\n\n**关键概念：** 权限隔离是必要项不是可选项，且只能做在检索层；出处标注也是 RAG 的天然能力（命中块即出处）。","s":"自编·2.1.5"},{"id":"D2-014","d":2,"t":"multiple","q":"企业知识助手初期采用固定 512 token 分块加纯向量检索，召回率只有 62%——用户问「某流程需要谁审批」时命不中文档里的「分管副总」。教材给出的三件改法是？（选 3 项）","o":[{"l":"A","t":"改用混合检索：BM25 关键词与向量检索结合，权重各半"},{"l":"B","t":"分块改为按文档标题层级切，保留语义边界"},{"l":"C","t":"检索时强制注入部门过滤条件，做权限内检索"},{"l":"D","t":"把所有文档重新微调进模型，让模型记住术语对应关系"},{"l":"E","t":"换一个参数量更大的通用 embedding 模型，靠更强的表示能力补回召回"}],"a":["A","B","C"],"e":"**正确答案：ABC。** 三件套改造后召回率从 62% 到 89%。\n\n**为什么对：** 本例是「词汇不匹配」：查询词「审批人」与文档词「分管副总」向量相似度不够，纯向量检索漏召回。① BM25 抓精确词匹配，与向量互补；② 按标题层级分块让块边界对齐语义，命中的块更完整；③ 部门过滤保证命中的是用户可见的文档（权限是必要项）。教材案例三件齐上召回率到 89%。\n\n**其他选项为什么错：**\n- D. 方向完全错：术语对应关系问题应在检索层解决（同义词表/混合检索），微调既贵又无法保证知识新鲜度，还丢掉溯源能力。\n- E. 换更大的通用 embedding 治不了词汇不匹配：企业内部的称谓对应（审批人 ↔ 分管副总）不在通用语料的共现里，向量再强也对不上，还平白抬高成本。\n\n**关键概念：** 召回率不达标的标准排查顺序：① 词汇不匹配→混合检索 ② 块切断语义→按结构分块 ③ 该配过滤没配→检索时过滤。「微调解决检索问题」永远是干扰项。","s":"自编·2.1.5"},{"id":"D2-015","d":2,"t":"single","q":"业务方要对 RAG 助手提新需求：「查一下华东区上季度销售额前十的客户和它们的未结订单」。知识库团队该怎么做才是对的？","o":[{"l":"A","t":"把销售报表切块进向量库，检索后让模型数数排序"},{"l":"B","t":"用 GraphRAG 建客户关系图谱后查询"},{"l":"C","t":"走结构化数据检索：自然语言转 SQL 查询数据库，结果回填给模型组织答案"},{"l":"D","t":"让 FM 凭训练记忆直接回答，销售额是公开常识"}],"a":["C"],"e":"**正确答案：C。** 问的是数据库里的统计与明细 → 结构化数据检索（NL2SQL）。\n\n**为什么对：** 题干信号词是「销售额、订单、前十、上季度」——这是数据库里的统计与明细问题，要的是精确数值计算与排序，向量库和 FM 都不擅长。正确形态是自然语言转 SQL，数据库执行后结果回填给模型组织答案，数值精确可验证。\n\n**其他选项为什么错：**\n- A. 向量检索靠语义相似，不保证取全取准；让语言模型对几十行数字做排序统计，容易算错，且无法保证可复现。\n- B. GraphRAG 解决的是实体关系多跳推理（「母公司还投了谁」），不是数值统计，构图成本花在不对应的问题上。\n- D. 上季度内部销售数据不在任何模型训练集里，这是编造；「公开常识」的前提就是假的。\n\n**关键概念：** 架构信号词对应：销售额/库存/订单 → 结构化检索；多跳关系 → GraphRAG；快速上线 → 全托管；召回不达标 → 自建混合检索。「问数字就别走向量库」。","s":"自编·2.1.5"},{"id":"D2-016","d":2,"t":"single","q":"训练负责人把 GPU 实例从 8 台加到 64 台，期望训练时间缩短到 1/8，结果只快了 3 倍。按教材的分析框架，正确的第一步是什么？","o":[{"l":"A","t":"接受这个结果，分布式训练的理论加速比本来就只能到 3 倍"},{"l":"B","t":"继续加到 256 台，规模上去了加速自然上去"},{"l":"C","t":"把学习率放大 8 倍，让每卡学得更快"},{"l":"D","t":"先看 GPU 利用率：低是数据供给瓶颈（改输入管道），高但扩展慢是通信瓶颈（改并行策略或增大 batch）"}],"a":["D"],"e":"**正确答案：D。** 先分清瓶颈是数据供给还是通信。\n\n**为什么对：** 分布式收益不是线性的：数据并行的加速比受通信开销与同步频率制约，8 卡通常 6–7 倍，几十卡后曲线明显变平——所以「8→64 期望 8 倍」本身就是错误预期，但 3 倍说明还有可查的瓶颈。判据就是 GPU 利用率：利用率低说明 GPU 在等数据，改输入管道（分片预取）；利用率高但扩展慢说明卡在梯度同步，改并行策略或增大 batch 减少同步次数。\n\n**其他选项为什么错：**\n- A. 「理论只能 3 倍」是编造；8 卡 6–7 倍是正常水位，64 卡 3 倍通常有瓶颈可挖。\n- B. 方向反了：几十卡后曲线变平，继续加卡收益递减，通信开销占比只会更高。\n- C. 学习率与加速无关，放大 8 倍大概率发散；这是把吞吐问题错当收敛问题。\n\n**关键概念：** 看到加速比不达标，第一动作是查 GPU 利用率分清瓶颈类型，而不是加机器或调学习率。","s":"自编·2.1.6"},{"id":"D2-017","d":2,"t":"single","q":"视觉质检模型训练一次 14 小时、约 900 元，业务要求每周重训。团队想在不换模型、不减数据的前提下把成本压下来。性价比最高的组合是？","o":[{"l":"A","t":"早停 + Spot 实例（checkpoint 续训）+ 优化数据管道（分片预取）"},{"l":"B","t":"换更大的模型一次训练到位，减少重训次数"},{"l":"C","t":"随机砍掉一半训练数据，时长自然减半"},{"l":"D","t":"把学习率调小让训练更稳，避免返工"}],"a":["A"],"e":"**正确答案：A。** 早停、Spot 续训、管道优化三招叠加，成本降到 45%。\n\n**为什么对：** 教材案例同款：调 batch 与学习率把 14h 压到 7h；数据管道从逐文件读取改分片预取消除数据等待降到 5h；剩余用 Spot 实例承担（单价低数成，中断后从 checkpoint 续训不丢进度）。三个动作都没换模型、没减数据。早停还同时改善过拟合，是三角里性价比最高的手段。\n\n**其他选项为什么错：**\n- B. 更大模型训练更慢更贵，与降本目标相反；「减少重训次数」也由业务节奏决定，不是模型说了算。\n- C. 砍数据等于砍性能，违反「不减数据」前提；质检模型漏检的代价远高于省下的训练费。\n- D. 调小学习率通常需要更多轮次收敛，时长和成本反而上升，方向就错了。\n\n**关键概念：** 训练成本三项构成：算力时长（最大项）、数据搬运、调参返工。降本顺序：先管道（数据搬运）、再早停（砍无效轮次）、最后 Spot（降单价）。","s":"自编·2.1.6"},{"id":"D2-018","d":2,"t":"single","q":"合同摘要服务总耗时 12 秒，用户调研显示「点了半天没反应」抱怨集中，但实际上用户从看到结果到读完只要几秒。最对症的改动是？","o":[{"l":"A","t":"换更贵的更高能力模型，缩短总时长"},{"l":"B","t":"开流式输出，让用户几秒内看到第一个字"},{"l":"C","t":"把摘要长度上限从 800 token 砍到 200 token"},{"l":"D","t":"在页面上加一个加载动画，缓解用户等待焦虑"}],"a":["B"],"e":"**正确答案：B。** 这是首字时延问题，不是总时延问题。\n\n**为什么对：** 题干信号：用户抱怨「等待」但「实际总时长可接受」——矛盾点在感知而非总量。流式输出不降低总时长，但把首字时延从「等全部生成完」降到「预填充完成」，用户几秒内开始看到内容滚出，感知差别巨大。教材明确：出现这种描述，答案就是流式输出。\n\n**其他选项为什么错：**\n- A. 高能力模型通常更慢不是更快，且成本上升；问题在感知，换模型没抓住矛盾。\n- C. 砍输出长度确实降总时长，但摘要信息量被砍，业务质量受损；而且总时长本来就「可接受」，砍错了对象。\n- D. 加载动画是产品手段，不改变任何时延；考试要的是技术方案。\n\n**关键概念：** 首字时延与总时延分开谈：抱怨「等不到反应」→ 流式；抱怨「转圈太久结果太慢」→ 才去压总时长（缩输入/限输出/换小模型）。","s":"自编·2.1.7"},{"id":"D2-019","d":2,"t":"multiple","q":"合同摘要服务输入 4000 token、输出 800 token，总时延 12 秒，单次成本偏高。以下哪些动作能同时降低时延与成本？（选 3 项）","o":[{"l":"A","t":"先做章节定位，只把相关章节喂给模型，输入降到 1200 token"},{"l":"B","t":"给输出长度设上限并分两段生成"},{"l":"C","t":"对相同或高度相似的合同复用缓存结果（prompt caching 或应用层缓存）"},{"l":"D","t":"改用 Provisioned Throughput 买断吞吐"},{"l":"E","t":"换成上下文窗口更大的模型，一次装下整份合同，省掉章节定位"}],"a":["A","B","C"],"e":"**正确答案：ABC。** 教材案例三项叠加：总时长 12 秒降到 4.2 秒，单次成本降 62%。\n\n**为什么对：** 时延四个来源里，「生成（输出 token 数）」是主导项、「输入处理」次之。① 只喂相关章节直接砍输入 70%，输入处理与计费同步下降；② 限制输出长度压住主导项，生成时间与输出 token 计费一起降；③ 缓存让重复请求不再付费也不再等生成，高频重复场景命中率能到 30% 以上。三项都同时省时间与钱。\n\n**其他选项为什么错：**\n- D. 预置吞吐是按时计费的买断容量，适合流量稳定且高的场景；它不减少 token 消耗，流量波动时闲置照付，本例成本反升。\n- E. 更大窗口只解决「装得下」，不减少 token 数与生成时间：输入变多，输入处理与计费反而上升，与降本降时延相反。\n\n**关键概念：** 成本三杠杆按性价比排序：路由分层（3–6 倍）> 控输入长度 > 缓存。预置吞吐的定位是「买断吞吐」不是「变快开关」，流量波动大时选它是错的。","s":"自编·2.1.7"},{"id":"D2-020","d":2,"t":"multiple","q":"客服质检要从 10 万通通话录音里找出「未按话术致歉」的会话，要求成本可控且判定可解释。以下哪些设计符合教材的正确链路？（选 3 项）","o":[{"l":"A","t":"Transcribe 转写并开说话人分离，自定义词表加入产品名"},{"l":"B","t":"规则匹配致歉话术先筛，仅对疑似违规的约 8% 会话调 FM 复核"},{"l":"C","t":"Comprehend 做情感与关键短语提取，作为规则筛选的辅助信号"},{"l":"D","t":"把 10 万通录音直接交给 FM 逐通听写并判定，一步到位"},{"l":"E","t":"先让 FM 给每通录音生成摘要，再由人工从摘要里挑出违规会话"}],"a":["A","B","C"],"e":"**正确答案：ABC。** 全量调 FM 的成本是这套方案的 20 倍以上，且无法解释判定依据。\n\n**为什么对：** 正确链路是拆到标准能力：① 转写是标准任务 → Transcribe（说话人分离区分坐席与客户，自定义词表保产品名准确）；② Comprehend 出情感与关键短语，增强规则筛信号；③ 规则匹配便宜且完全可解释，先用它把 10 万通缩到 8%，FM 只做小范围语义复核。每步的成本与解释性都可控。\n\n**其他选项为什么错：**\n- D. FM 不直接处理长录音（需先转写），逐通判定成本爆炸且依据不可审计，正是教材点名的干扰形态：没有哪一步该让大模型包打天下。\n- E. 只是给「全量调 FM」换个包装：10 万通仍要逐通过模型，成本不降；摘要是有损压缩，恰恰会抹掉「有没有说致歉」这类短句细节。\n\n**关键概念：** 托管服务组合题的判官问句：这一步是标准能力吗？有没有更便宜可解释的方案先筛？FM 永远放在链路末端做小范围的语义工作，不做全量粗筛。","s":"自编·2.1.8"},{"id":"D2-021","d":2,"t":"single","q":"某零售企业预测 200 家门店的日销售额，有 3 年历史数据（含促销日历）。先用 DeepAR 跑出 baseline，MAPE 12%；追加天气、商圈人流特征后仍不达 8% 的业务要求。最合理的下一步是？","o":[{"l":"A","t":"换成更大规模的深度时序模型重新训练"},{"l":"B","t":"增加训练轮数，让 DeepAR 收敛得更充分"},{"l":"C","t":"改用 XGBoost 配人工特征（滞后 7 天销量、促销标记、节假日距离天数）"},{"l":"D","t":"把预测目标从日销售额改成小时销售额，用更细粒度提精度"}],"a":["C"],"e":"**正确答案：C。** 换 XGBoost 配人工特征。\n\n**为什么对：** 表格型结构化数据上，特征工程对精度的提升常大于换算法。教材案例里 DeepAR 怎么调都在 12% 附近，改用 XGBoost 加滞后销量、促销标记、节假日距离这三类人工特征后 MAPE 降到 7.4%——瓶颈不在模型能力，在于深度时序模型没有显式利用这些业务特征。\n\n**其他选项为什么错：**\n- A. 换更大的深度模型仍是同一条路线，未解决特征利用问题；且训练成本上升，收益无依据。\n- B. 加特征后仍不达标说明不是收敛不足，再堆轮数大概率过拟合。\n- D. 改成小时粒度会引入更多噪声，且不解决特征缺失的根因。\n\n**关键概念：** 表格数据的默认首选是 XGBoost 这类树模型；「特征工程比换算法更能提升表格数据的效果」是本节的核心结论，也解释了为什么内置算法在结构化数据上长期强势。","s":"自编·2.2.1"},{"id":"D2-022","d":2,"t":"single","q":"团队要在 SageMaker AI 上训练一个需要自定义损失函数和非标准网络结构的模型。在 SageMaker 体系内，成本最低的可行方式是？","o":[{"l":"A","t":"用内置算法，通过修改超参逼近目标行为"},{"l":"B","t":"再选一个内置算法，找一个损失函数接近的"},{"l":"C","t":"放弃 SageMaker，回到本地工作站训练"},{"l":"D","t":"用框架容器 + script mode，跑自己的训练脚本"}],"a":["D"],"e":"**正确答案：D。** 框架容器 + script mode。\n\n**为什么对：** script mode 是自定义训练的默认档位：SageMaker 提供预装框架与依赖的容器、分布式环境变量和调度，你只提供一个按约定写的训练脚本。自定义损失函数与网络结构都在脚本里实现，不需要自己维护镜像，成本与运维负担远低于自带容器。\n\n**其他选项为什么错：**\n- A. 内置算法的容器和训练逻辑是封死的，只能调超参，改不了损失函数——这条路根本走不通。\n- B. 「找损失函数接近的算法」是妥协方案，不满足自定义需求本身。\n- C. 本地训练放弃了 SageMaker 的托管能力（弹性算力、实验管理、部署衔接），且题干限定在 SageMaker 体系内。\n\n**关键概念：** 三档自定义程度按依赖复杂度递进：内置算法（只给数据和超参）→ script mode（给脚本）→ BYOC（连容器自己带）。绝大多数自定义模型在 script mode 档就够用。","s":"自编·2.2.2"},{"id":"D2-023","d":2,"t":"single","q":"团队要微调一个开源大语言模型（Transformer 架构），在 SageMaker AI 上应选用哪类训练容器？","o":[{"l":"A","t":"Hugging Face 框架容器"},{"l":"B","t":"Scikit-learn 容器"},{"l":"C","t":"XGBoost 内置算法容器"},{"l":"D","t":"Random Cut Forest 内置算法容器"}],"a":["A"],"e":"**正确答案：A。** Hugging Face 框架容器。\n\n**为什么对：** Hugging Face 容器预装了 Transformers 生态，是 FM（基础模型）微调的主力入口：加载预训练 Transformer、配 LoRA/PEFT 做参数高效微调、处理 tokenizer 与数据集，都是它的标准工作流。MLA 考纲里 FM 微调类题目默认指向这一档。\n\n**其他选项为什么错：**\n- B. Scikit-learn 容器面向传统机器学习与小数据，装不下也不会高效运行大模型训练。\n- C. XGBoost 是表格数据的内置算法，与语言模型无关。\n- D. Random Cut Forest 是异常检测内置算法，和微调 Transformer 完全是两个领域。\n\n**关键概念：** 框架容器的分工：Scikit-learn 给传统 ML 与小数据，PyTorch 给自定义网络，TensorFlow 给既有 TF 资产，Hugging Face 给预训练 Transformer 微调。见到「微调 FM」就找 Hugging Face。","s":"自编·2.2.1"},{"id":"D2-024","d":2,"t":"multiple","q":"以下哪些场景下，选用 SageMaker AI 内置算法是正确决策？（选 3 项）","o":[{"l":"A","t":"结构化表格数据做分类，需要快速建立 baseline 判断数据能不能学出来"},{"l":"B","t":"团队没有深度学习工程经验，希望不写训练循环就完成训练"},{"l":"C","t":"需要自定义损失函数来匹配业务评分规则"},{"l":"D","t":"做门店日销售额预测这类时序任务，先用 DeepAR 快速验证"}],"a":["A","B","D"],"e":"**正确答案：ABD。**\n\n**为什么对：** 内置算法的正确场景有三类：结构化表格上快速出 baseline（XGBoost、DeepAR 都是内置算法，给数据就能跑）；团队缺深度学习经验（不需要写训练循环）；需要快速验证「数据有没有可学性」。三条分别对应 A、B、D。\n\n**其他选项为什么错：**\n- C. 自定义损失函数必须走 script mode 或 BYOC——内置算法容器封装死了训练逻辑，超参改不了损失函数。这正是教材列出的「不该用内置算法」的第一条。\n\n**关键概念：** 内置算法的边界记忆法：只要题目出现「自定义损失」「自定义网络结构」「多模态」「现代 Transformer」，就离开内置算法档位，转框架容器（script mode）或 Hugging Face；反之「表格、快速 baseline、缺经验」都留在内置算法。","s":"自编·2.2.1"},{"id":"D2-025","d":2,"t":"single","q":"一个 script mode 训练任务状态显示成功，但随后部署时报「找不到模型文件」。最可能的原因是？","o":[{"l":"A","t":"entry_point 指定的脚本文件名写错了"},{"l":"B","t":"训练脚本没有把模型写入 SM_MODEL_DIR 指定的路径"},{"l":"C","t":"训练数据没有从 SM_CHANNEL_TRAIN 读取"},{"l":"D","t":"超参没有通过 SM_HP_ 前缀的环境变量传入"}],"a":["B"],"e":"**正确答案：B。** 模型没写到 SM_MODEL_DIR。\n\n**为什么对：** script mode 的四个约定里，模型输出路径是部署环节的命门：训练结束时必须把模型 artifact 写到 SM_MODEL_DIR 指向的目录，SageMaker 才能打包部署。训练本身能「成功」结束（脚本跑完了），但部署阶段在约定位置找不到文件就会报这个错。\n\n**其他选项为什么错：**\n- A. 入口脚本错会导致训练开始就失败退出，到不了「训练成功」这一步。\n- C. 数据通道读错会导致训练时报错或指标异常，而不是部署失败。\n- D. 超参传错影响训练行为，不影响模型文件的位置。\n\n**关键概念：** script mode 失败定位口诀：开头就挂查入口（entry_point 与脚本位置），部署失败查输出（SM_MODEL_DIR），依赖报错查容器（requirements.txt 或换 BYOC）。四个约定：入口位置、SM_HP 超参、SM_MODEL_DIR 输出、SM_CHANNEL 数据。","s":"自编·2.2.2"},{"id":"D2-026","d":2,"t":"single","q":"团队把本地 notebook 搬上 SageMaker script mode，训练任务启动约 30 秒就退出，日志几乎没有输出。最可能的原因是？","o":[{"l":"A","t":"选择的实例类型 GPU 数量不够"},{"l":"B","t":"S3 桶的访问权限没有配置"},{"l":"C","t":"脚本不符合入口约定——直接粘了 notebook 的顺序执行代码，没有按约定的训练函数结构提供入口"},{"l":"D","t":"训练数据量太小，任务提前完成"}],"a":["C"],"e":"**正确答案：C。** 脚本不符合入口约定。\n\n**为什么对：** 教材案例就是这个事故：把 notebook 内容原样粘成脚本，入口是顺序执行代码而非约定的训练函数结构，SageMaker 拉起容器后找不到合法入口或脚本立即异常退出——表现为「启动几十秒就结束、日志无实质输出」。改成标准入口、从 SM_CHANNEL_TRAIN 读数据路径、模型写 SM_MODEL_DIR 后一次通过。\n\n**其他选项为什么错：**\n- A. GPU 不足不会让任务 30 秒退出，只会让训练变慢。\n- B. S3 权限问题会在日志里明确报 Access Denied，且发生在读数据阶段。\n- D. 数据太小会正常跑完并输出模型，不会「无输出即退出」。\n\n**关键概念：** 「训练开始即退出、日志无输出」是 script mode 入口问题的典型症状，排查顺序：entry_point 文件名 → 脚本位置（source_dir）→ 入口函数是否符合约定。这是 script mode 最高频的踩坑点。","s":"自编·2.2.2"},{"id":"D2-027","d":2,"t":"single","q":"在 SageMaker script mode 训练脚本里，训练集与验证集的路径应该怎么获取？","o":[{"l":"A","t":"在脚本里硬编码输入数据的 S3 路径"},{"l":"B","t":"把 S3 路径作为超参传进去，在脚本里解析"},{"l":"C","t":"写死容器内的固定目录，训练前手动复制数据"},{"l":"D","t":"从 SM_CHANNEL_TRAIN、SM_CHANNEL_VALIDATION 等环境变量读取本地挂载路径"}],"a":["D"],"e":"**正确答案：D。** 从 SM_CHANNEL_* 环境变量读取。\n\n**为什么对：** SageMaker 会把每个输入数据通道挂载到容器本地路径，并通过 SM_CHANNEL_TRAIN、SM_CHANNEL_VALIDATION 等环境变量告知脚本。脚本只认环境变量，不关心底层是 S3 还是其他存储——这样同一份脚本可以无痛切换数据源与分布式环境。\n\n**其他选项为什么错：**\n- A. 硬编码 S3 路径是教材点名的反模式：通道挂载点是本地路径，脚本里直接访问 S3 既绕过了 SageMaker 的数据管道，也会在分布式与本地模式下失效。\n- B. 把 S3 URI 塞进超参是同一个错误换了个入口。\n- C. 手动复制数据脱离托管流程，无法利用 SageMaker 的数据分发与分片能力。\n\n**关键概念：** script mode 数据纪律：数据走通道（SM_CHANNEL_*），模型走 SM_MODEL_DIR，超参走 SM_HP_*。三者都有环境变量约定，脚本里不硬编码任何外部路径。","s":"自编·2.2.2"},{"id":"D2-028","d":2,"t":"single","q":"训练代码依赖一个特定版本的 CUDA 工具链和一个私有 C++ 扩展库，script mode 的 requirements.txt 方式装不上这些依赖。正确的做法是？","o":[{"l":"A","t":"改用 BYOC（自带容器）：自己写 Dockerfile 构建镜像推到 ECR"},{"l":"B","t":"换一个显存更大的 GPU 实例再试"},{"l":"C","t":"改用 SageMaker 内置算法绕开依赖问题"},{"l":"D","t":"把依赖库文件放进训练数据通道，运行时解压安装"}],"a":["A"],"e":"**正确答案：A。** 改用 BYOC 自带容器。\n\n**为什么对：** BYOC 的适用条件就是「特殊依赖」：私有库、特定 CUDA 版本、非 Python 运行时。自己写 Dockerfile 把 CUDA 版本和私有 C++ 扩展一起打进镜像，推到 Amazon ECR，SageMaker 负责拉起与调度。这是教材三档对比表里 BYOC 的定义场景。\n\n**其他选项为什么错：**\n- B. 实例规格与依赖安装无关，换卡解决不了容器里没有的库。\n- C. 内置算法连训练代码都换掉了，更无法承载自定义依赖和自定义训练逻辑。\n- D. 依赖打包进数据通道是反模式：数据通道是给训练数据的，运行时解压安装不可复现、易失败，也绕过了镜像的版本管理。\n\n**关键概念：** 自定义程度三档的选择依据是依赖复杂度：标准任务用内置算法，一般自定义用 script mode（requirements.txt 够用），特殊依赖（私有库、特定 CUDA、非 Python 服务）才升级到 BYOC。","s":"自编·2.2.2"},{"id":"D2-029","d":2,"t":"single","q":"script mode 多机分布式训练中，脚本需要拿到所有训练节点的主机名列表来初始化通信。应从哪个环境变量读取？","o":[{"l":"A","t":"SM_NUM_GPUS"},{"l":"B","t":"SM_HOSTS"},{"l":"C","t":"MASTER_PORT"},{"l":"D","t":"SM_CURRENT_HOST"}],"a":["B"],"e":"**正确答案：B。** SM_HOSTS。\n\n**为什么对：** SageMaker 分布式训练约定里，SM_HOSTS 是所有节点主机名的列表（通常是 JSON 数组），脚本用它来组织多机通信拓扑；MASTER_ADDR/MASTER_PORT 指定通信入口地址与端口。\n\n**其他选项为什么错：**\n- A. SM_NUM_GPUS 是当前节点上的 GPU 数量，与节点列表无关。\n- C. MASTER_PORT 只是通信端口号，不包含节点信息。\n- D. SM_CURRENT_HOST 是当前节点自己的主机名——知道「我是谁」不够，分布式初始化还需要「我们都有谁」，后者正是 SM_HOSTS 的职责。\n\n**关键概念：** 四个分布式环境变量分工：SM_HOSTS＝全体节点列表，SM_CURRENT_HOST＝当前节点，SM_NUM_GPUS＝本机 GPU 数，MASTER_ADDR/MASTER_PORT＝通信入口。教材同时提醒：多机训练卡住时优先改用 SageMaker 分布式训练库，而不是手写这些初始化。","s":"自编·2.2.2"},{"id":"D2-030","d":2,"t":"single","q":"团队要为一项微调作业调超参，准备在 SageMaker AI 自动模型调优（AMT）里跑试验。在不做额外配置的情况下，AMT 的默认搜索策略是？","o":[{"l":"A","t":"网格搜索"},{"l":"B","t":"随机搜索"},{"l":"C","t":"贝叶斯优化"},{"l":"D","t":"穷举搜索"}],"a":["C"],"e":"**正确答案：C。** 贝叶斯优化。\n\n**为什么对：** AMT 默认用贝叶斯优化：用已完成试验的历史结果建模「超参组合 → 指标」的代理模型，据此挑下一个最有希望的组合。在预算有限（最大作业数固定）时，它的单位成本收益最高，所以是默认策略。\n\n**其他选项为什么错：**\n- A. 网格搜索穷举所有组合，只适合超参很少且每个取值很少的场景；维度稍高就组合爆炸，AMT 不把它作为默认。\n- B. 随机搜索在高维空间常优于网格，是可选策略，但它不利用历史结果，效率低于贝叶斯。\n- D. 穷举搜索就是网格搜索的另一种说法，同样受组合爆炸限制。\n\n**关键概念：** 三种搜索策略的分工：网格＝超参少且取值少；随机＝维度高时的兜底；贝叶斯＝预算有限时的默认最优。另注意：贝叶斯优化的效率会被高并行度削弱（并行跑的试验无法参考彼此结果）。","s":"自编·2.2.3"},{"id":"D2-031","d":2,"t":"single","q":"团队用 AMT 调优 XGBoost 风控模型：目标指标设为 validation:auc，AUC 从 0.862 提到 0.889，但业务真正关心的召回率只从 0.74 升到 0.755。最核心的错误是？","o":[{"l":"A","t":"最大并行作业数设置过高，削弱了贝叶斯优化效率"},{"l":"B","t":"搜索空间范围设得太窄"},{"l":"C","t":"早停过于激进，误杀了后期才能改善的试验"},{"l":"D","t":"目标指标与业务指标不对齐——优化 AUC 不等于优化召回率"}],"a":["D"],"e":"**正确答案：D。** 目标指标与业务指标不对齐。\n\n**为什么对：** AMT 的四个必设参数里，目标指标排在第一位，且教材明确要求「必须与业务目标一致」。AUC 衡量整体排序能力，召回率关心正类抓了多少——两者相关但不等价。模型会朝着你优化的方向走：优化 AUC 得到的是排序更好的模型，不是召回更高的模型。教材案例里把目标改成 validation:f1 重跑后召回率升到 0.81，验证了这一点。\n\n**其他选项为什么错：**\n- A. 并行度影响搜索效率与成本，但不会造成「AUC 涨而业务指标不涨」这种方向性偏差。\n- B. 搜索空间窄会限制上限，但 AUC 明显提升说明搜索本身是有效的。\n- C. 早停影响的是砍掉哪些试验，同样不解释方向性偏差。\n\n**关键概念：** 类不平衡场景常用 F1 替代 accuracy；目标指标选错，调优越努力偏得越远。先问「业务用什么数字考核」，再把它映射成训练指标。","s":"自编·2.2.3"},{"id":"D2-032","d":2,"t":"single","q":"为一次 AMT 调优设计搜索空间，以下哪种设置符合教材的纪律？","o":[{"l":"A","t":"学习率用对数尺度，范围 1e-5 到 1e-1"},{"l":"B","t":"学习率在 0.0001 到 0.1 之间线性枚举 10 个值"},{"l":"C","t":"把 batch size 也纳入搜索空间，与学习率一起调"},{"l":"D","t":"把 10 个超参全部纳入搜索，一次性找到全局最优"}],"a":["A"],"e":"**正确答案：A。** 学习率用对数尺度。\n\n**为什么对：** 学习率的有效区间横跨几个数量级，且对变化的敏感度是对数的：1e-5 到 1e-4 的差别远大于 0.09 到 0.1 的差别。对数尺度让采样点在每个数量级均匀分布，搜索效率最高。这是教材搜索空间纪律的第一条。\n\n**其他选项为什么错：**\n- B. 线性枚举会把大量采样浪费在高区间（0.05~0.1），而有效学习率往往在低区间，且离散枚举不如连续范围。\n- C. batch size 通常固定、不参与搜索——它与学习率强耦合，一起搜会互相干扰，教材明确点名。\n- D. 超参数量应控制在 5 个以内，超过后搜索空间爆炸、每个组合的样本不足，结果反而变差。\n\n**关键概念：** 搜索空间三纪律：学习率对数尺度、树模型深度用整数范围不枚举、batch size 固定不搜。超参总数 ≤5。","s":"自编·2.2.3"},{"id":"D2-033","d":2,"t":"multiple","q":"关于 AMT 调优中开启早停（early stopping）的作用与风险，以下理解正确的有哪些？（选 2 项）","o":[{"l":"A","t":"训练中途评估，明显劣于当前最优的试验直接终止，可把调优成本降低约 30–60%"},{"l":"B","t":"如果指标在训练后期才改善（如学习率衰减之后），早停可能误杀好试验"},{"l":"C","t":"开启早停后就可以不设最大作业数，成本自然可控"},{"l":"D","t":"早停应监控训练损失，训练损失不再下降即终止试验"}],"a":["A","B"],"e":"**正确答案：AB。**\n\n**为什么对：** A 是早停的价值面：中途评估、砍掉明显落后的试验，省下的就是这些试验本会烧掉的后半程算力，教材给的成本降幅是 30–60%。B 是它的风险面：有些配置前期指标平、后期学习率衰减后才爬升，早停设得过紧会把这类「慢热」的好试验砍掉——所以早停参数要结合指标曲线形态设置。\n\n**其他选项为什么错：**\n- C. 最大作业数是成本上限，直接决定账单，与早停无关——早停省的是单个试验内部的算力，不控制试验总数。\n- D. 训练损失几乎总是在下降，监控它永远不会触发早停；早停必须监控验证集指标。\n\n**关键概念：** 早停双面性：省钱（30–60%）但可能误杀慢热试验；设错监控对象（训练损失）则完全失效。这与 2.2.4 训练中的早停是同一原理在调优场景的应用。","s":"自编·2.2.3"},{"id":"D2-034","d":2,"t":"single","q":"图像分割模型训练一次 22 小时，诊断发现 GPU 利用率只有 45%，每张图在 CPU 上现场做数据增强。最对症的优化是？","o":[{"l":"A","t":"把数据并行改成模型并行，减少通信开销"},{"l":"B","t":"增强移到 GPU 侧或预生成缓存，同时提高 DataLoader worker 数、改用分片格式读取"},{"l":"C","t":"用梯度累积把等效 batch size 扩大 8 倍"},{"l":"D","t":"对模型做剪枝，减少参数量"}],"a":["B"],"e":"**正确答案：B。** 修数据供给管道。\n\n**为什么对：** GPU 利用率低（低于 60%）是数据供给不足的典型信号：GPU 大部分时间在等 CPU 做增强。教材案例的三板斧正对症——增强挪到 GPU 侧（或预生成缓存）、DataLoader worker 从 4 提到 16、改用分片格式读取——利用率升到 88%，时长从 22 小时降到 13 小时，一张卡都没加。\n\n**其他选项为什么错：**\n- A. 模型并行解决的是「单卡装不下模型」，与数据供给瓶颈无关；且本例瓶颈诊断是利用率低而非通信。\n- C. 梯度累积是「装得下」的手段，不是加速手段，对利用率低没有帮助。\n- D. 剪枝减小模型计算量，会让 GPU 更快算完然后更长时间等数据，利用率问题反而加重。\n\n**关键概念：** 瓶颈判断口诀：GPU 利用率低＝数据供给不足，改输入管道；利用率高但多卡扩展差＝通信瓶颈，改并行策略。","s":"自编·2.2.4"},{"id":"D2-035","d":2,"t":"single","q":"一个 70 亿参数模型的微调作业在单卡上显存吃紧，batch size 一提就 OOM。关于梯度累积（gradient accumulation），以下认识正确的是？","o":[{"l":"A","t":"它是一种训练加速手段，能显著缩短总训练时间"},{"l":"B","t":"它可以在多卡之间替代梯度同步通信"},{"l":"C","t":"它是「装得下」的手段：显存不够时累积多个小 batch 的梯度再更新，代价是单步变慢"},{"l":"D","t":"它会减少总显存占用并加快数据加载"}],"a":["C"],"e":"**正确答案：C。** 梯度累积是装得下的手段，不是加速手段。\n\n**为什么对：** 显存放不下大 batch 时，用 N 个小 batch 累积梯度再更新一次，等效于一个大 batch 的更新效果。它的收益是「等效 batch 变大」，代价是每个更新步需要 N 次前向反向，单步时间变长——总训练时间通常不减反增。\n\n**其他选项为什么错：**\n- A. 方向反了：它是用时间换显存的手段，考试里常被误选为加速答案，教材专门点名这条。\n- B. 多卡之间的梯度同步（AllReduce）仍然需要，累积发生在每张卡内部，两者解决的不是同一个问题。\n- D. 它不减少模型与优化器状态的显存占用，也不影响数据加载速度。\n\n**关键概念：** 加速手段分两类：算得更快（分布式、混合精度、编译优化）和早点停（早停）。梯度累积两类都不属于，它的标签是「显存不够时的等效大 batch」。","s":"自编·2.2.4"},{"id":"D2-036","d":2,"t":"single","q":"为训练过程配置早停时，监控指标应选哪一个才能让早停真正生效？","o":[{"l":"A","t":"训练集损失"},{"l":"B","t":"学习率的当前值"},{"l":"C","t":"梯度范数"},{"l":"D","t":"验证集指标（验证损失或业务指标）"}],"a":["D"],"e":"**正确答案：D。** 验证集指标。\n\n**为什么对：** 早停的目的是「在验证集性能开始变差前停下」，所以监控对象必须是验证集上的指标（验证损失或业务指标），并配合 patience（连续无改善的轮数）与最小改善阈值（过滤噪声波动），触发后回滚到最佳轮次的权重。\n\n**其他选项为什么错：**\n- A. 训练损失几乎总是在下降——监控它永远不会触发早停，等于没配。这是教材明确点名的设错方式。\n- B. 学习率是人为设定的调度值，它反映不了模型泛化能力，监控它没有意义。\n- C. 梯度范数反映训练动态稳定性，可用于诊断（如梯度爆炸），但不是泛化性能的度量，不能作为早停依据。\n\n**关键概念：** 早停三要素：监控验证集指标、patience 取 3–10 轮、最小改善阈值 0.001 量级（不设的话噪声波动也算改善，早停失效）。","s":"自编·2.2.4"},{"id":"D2-037","d":2,"t":"single","q":"在支持它的现代 GPU 上启用混合精度训练，数值格式应优先选择哪种？","o":[{"l":"A","t":"BF16"},{"l":"B","t":"FP16"},{"l":"C","t":"INT8"},{"l":"D","t":"FP64"}],"a":["A"],"e":"**正确答案：A。** BF16。\n\n**为什么对：** BF16（bfloat16）与 FP16 同为 16 位格式，但指数位更多、尾数位更少，动态范围接近 FP32，训练中不容易出现上溢/下溢，数值稳定性更好。教材明确：BF16 比 FP16 数值稳定性好，现代 GPU 优先 BF16。混合精度能把显存占用减半、吞吐提升，且通常不掉点，是最省事的一档加速。\n\n**其他选项为什么错：**\n- B. FP16 可用但动态范围窄，需要配合损失缩放等技巧，稳定性不如 BF16。\n- C. INT8 量化主要用于推理侧的压缩加速，不是训练精度的选择。\n- D. FP64 是双精度，显存翻倍、速度更慢，与加速目标相反，深度训练基本不用。\n\n**关键概念：** 混合精度＝「算得更快」类加速手段（另有分布式、编译优化）；现代 GPU 上 BF16 优先于 FP16。","s":"自编·2.2.4"},{"id":"D2-038","d":2,"t":"single","q":"一个分类模型训练集准确率接近 99%，验证集 82%，且随训练继续两者差距不断扩大。最可能的诊断是？","o":[{"l":"A","t":"欠拟合——模型容量不足"},{"l":"B","t":"过拟合——模型把训练集学得太死"},{"l":"C","t":"灾难性遗忘——新任务覆盖了旧任务能力"},{"l":"D","t":"学习率过低导致训练不充分"}],"a":["B"],"e":"**正确答案：B。** 过拟合。\n\n**为什么对：** 过拟合的判别特征就是这组症状：训练集表现很好（接近 100%）、验证集明显差、且差距随训练继续扩大——模型在记忆训练样本的细节与噪声，而不是学习可泛化的规律。根因通常是模型容量相对数据量过大、训练过久或数据分布单一。\n\n**其他选项为什么错：**\n- A. 欠拟合是训练集和验证集都差且接近——模型连训练集都没学好，与本例训练集 99% 矛盾。\n- C. 灾难性遗忘的判别特征是「新任务好、旧任务崩」，需要有旧任务作对照；本例是训练与验证的差距，不是新旧任务的反差。\n- D. 学习率过低会导致欠拟合（训不动），表现是两个集合都差，不是差距扩大。\n\n**关键概念：** 三病判别看两组数：训练好验证差＝过拟合；训练差验证也差且接近＝欠拟合；新任务好旧任务崩＝灾难性遗忘。先分病症再开药。","s":"自编·2.2.5"},{"id":"D2-039","d":2,"t":"single","q":"一个模型训练集准确率 71%、验证集 69%，两者接近但都不理想。诊断与最对症的处理组合是？","o":[{"l":"A","t":"过拟合——加强 L2 正则和 Dropout"},{"l":"B","t":"过拟合——立刻启用早停"},{"l":"C","t":"欠拟合——增加模型容量、补特征，并检查数据管道是否把标签搞错"},{"l":"D","t":"灾难性遗忘——训练集混入通用数据"}],"a":["C"],"e":"**正确答案：C。** 欠拟合，加容量、补特征、查标签。\n\n**为什么对：** 训练集与验证集表现接近，说明不存在泛化差距，模型没有「学得太死」的问题；两个集合都差，说明模型压根没学到规律——这是欠拟合的判别特征。处理方向是提升学习能力：增加容量、补充特征，同时排查学习率是否不当、训练是否不足，以及教材特别强调的：数据管道是否把标签搞错——这条最容易被忽略，也最常见。\n\n**其他选项为什么错：**\n- A. L2/Dropout 是抑制过拟合的手段，用在欠拟合的模型上会进一步削弱拟合能力，雪上加霜。\n- B. 早停治的是「训练过久导致的过拟合」，本例连训练集都没学好，早停只会更差。\n- D. 灾难性遗忘需要「旧任务能力崩掉」作前提，本例没有新旧任务对照。\n\n**关键概念：** 欠拟合四板斧：加容量、补特征、调学习率、查标签。其中查标签最易被忽略——很多「欠拟合」其实是数据错了。","s":"自编·2.2.5"},{"id":"D2-040","d":2,"t":"single","q":"某企业用内部工单数据微调一个基础模型做故障分类，新任务准确率 94%；上线一周后发现它回答通用问题的质量明显下降，还开始把不相关的问题也归入故障类。最可能的诊断是？","o":[{"l":"A","t":"欠拟合——领域数据训练量不够"},{"l":"B","t":"验证集划分不当导致指标虚高"},{"l":"C","t":"推理端 batch size 过大引起输出异常"},{"l":"D","t":"灾难性遗忘——窄分布数据上的继续训练覆盖了原有权重"}],"a":["D"],"e":"**正确答案：D。** 灾难性遗忘。\n\n**为什么对：** 判别特征完全吻合：新任务（故障分类）表现好，旧能力（通用问答）崩了。机制是在窄分布数据上做梯度更新时，权重向新分布偏移，原先编码的通用能力被覆盖——FM 参数承载大量通用能力，这一现象在 FM 微调上尤其明显。教材同款案例：改用 LoRA 微调、混入 30% 通用指令数据、增加「非本领域」负样本类目后，故障分类几乎不掉而通用能力恢复。\n\n**其他选项为什么错：**\n- A. 新任务 94% 说明领域任务学得很好，不存在欠拟合。\n- B. 验证集问题会高估新任务指标，解释不了通用能力的下降。\n- C. 推理超参影响的是单次请求行为，不会造成系统性的能力退化。\n\n**关键概念：** 「微调后旧能力下降」指向两个缓解方向：LoRA/PEFT（冻结原权重）或混入 20–40% 通用数据。这组手段在考题里出现频率很高。","s":"自编·2.2.5"},{"id":"D2-041","d":2,"t":"single","q":"团队计划用领域数据微调一个基础模型，同时希望尽量保留模型原有的通用能力。按教材结论，默认应优先考虑的方案是？","o":[{"l":"A","t":"用 LoRA/PEFT 做参数高效微调，冻结原有权重只训练少量附加参数（或混入 20–40% 通用数据）"},{"l":"B","t":"提高学习率并增加训练轮数，让模型充分吸收领域知识"},{"l":"C","t":"换一个参数量更大的模型从头预训练"},{"l":"D","t":"减小 batch size 并关闭混合精度"}],"a":["A"],"e":"**正确答案：A。** LoRA/PEFT 优先。\n\n**为什么对：** 教材把这条列为必须记住的结论：LoRA 是防遗忘的默认答案。它不改原权重——原有权重冻结，只训练少量附加的低秩参数，通用能力天然保住，同时训练成本低、显存需求小。另一条等效路线是训练集里混入 20–40% 通用数据，让权重偏移被通用分布拉回来。\n\n**其他选项为什么错：**\n- B. 学习率更大、轮次更多会加剧权重偏移，是加速遗忘而不是防遗忘。\n- C. 从头预训练成本极高，且丢掉的正是你想保留的预训练能力，方向完全反了。\n- D. batch size 与混合精度影响训练稳定性与效率，与灾难性遗忘的机制无关。\n\n**关键概念：** 题干出现「微调后通用能力下降、希望保留原能力」，答案锁定 PEFT/LoRA 或混通用数据；全量微调 + 高学习率是遗忘的加速器。","s":"自编·2.2.5"},{"id":"D2-042","d":2,"t":"multiple","q":"针对图像分类模型的过拟合问题，以下哪些是教材推荐的处理手段？（选 3 项）","o":[{"l":"A","t":"加数据或做数据增强（裁剪、翻转、色彩抖动）"},{"l":"B","t":"加正则化：L2 权重衰减、Dropout、标签平滑"},{"l":"C","t":"启用早停，回滚到验证指标最佳的轮次"},{"l":"D","t":"增加模型层数与参数量，提升拟合能力"}],"a":["A","B","C"],"e":"**正确答案：ABC。**\n\n**为什么对：** 教材按性价比给过拟合排序：第一位是加数据/数据增强（图像的裁剪翻转色彩抖动、文本的同义改写回译），因为过拟合的本质是数据不够模型记；第二位是正则化（L2、Dropout、标签平滑），直接约束权重复杂度；第三位是早停，在验证指标开始变差前停下。三者分别从数据、模型、训练时长三个维度下手。\n\n**其他选项为什么错：**\n- D. 增加容量是欠拟合的处理手段，用在过拟合上正好反向——容量越大、记忆能力越强，过拟合越重。教材排序里与之对应的是「简化模型」（减层减参）。\n\n**关键概念：** 过拟合六手段按性价比：加数据/增强 > 正则化 > 早停 > 简化模型 > 交叉验证（是诊断不是治疗）> 集成（最后手段）。方向别记反：过拟合做减法，欠拟合做加法。","s":"自编·2.2.5"},{"id":"D2-043","d":2,"t":"single","q":"信贷违约预测任务中，单 XGBoost 模型 AUC 0.79。团队尝试把 XGBoost 与 LightGBM 的输出做平均，AUC 仅 0.792，几乎无收益。最可能的原因是？","o":[{"l":"A","t":"集成方式选错了，换成 stacking 一定有大幅提升"},{"l":"B","t":"两个模型太相似——同属梯度提升树、训练在同一份数据上，错误高度相关，集成就没有互补性"},{"l":"C","t":"训练数据量太小，不足以支撑两个模型"},{"l":"D","t":"AUC 不是合适的评估指标，应改用准确率"}],"a":["B"],"e":"**正确答案：B。** 模型太相似，集成无互补性。\n\n**为什么对：** 集成收益的第一规律：模型差异越大，集成收益越大。XGBoost 与 LightGBM 同属梯度提升树家族、在同一份特征和数据上训练，犯的错高度重合——一个模型错的，另一个大概率也错，平均起来错误并没有被抵消。教材案例里真正有效的是 XGBoost + 逻辑回归 + 小型 MLP 的 stacking（异质模型，AUC 0.805）。\n\n**其他选项为什么错：**\n- A. 换 stacking 不改变「模型同质」的根本问题；教材里同质组合换任何集成方式收益都有限。\n- C. 数据量与「集成无收益」没有直接因果关系，教材案例没有这条归因。\n- D. 指标选择影响优化方向，但 AUC 用于排序类风控任务是常规且合理的，不是无收益的原因。\n\n**关键概念：** 集成三判断：差异大才有收益；单模型已很准时收益小；延迟敏感时不用集成。同构模型集成 ≈ 白花钱。","s":"自编·2.2.6"},{"id":"D2-044","d":2,"t":"single","q":"一个线上风控接口对推理延迟非常敏感（要求 P99 低于 100 毫秒）。团队想通过模型集成把准确率再提一个点。正确的建议是？","o":[{"l":"A","t":"用 Bagging 训练 5 个模型投票，稳定性最好"},{"l":"B","t":"用三层 stacking 结构，元模型吸收基模型信息"},{"l":"C","t":"不建议集成——集成通常使推理延迟翻倍，延迟敏感场景不用；先看特征与数据还有没有提升空间"},{"l":"D","t":"用串行 Boosting，逐级纠错提精度"}],"a":["C"],"e":"**正确答案：C。** 延迟敏感时不用集成。\n\n**为什么对：** 集成收益规律的第三条：推理延迟敏感时不用集成。Bagging 要并行跑 N 个模型，stacking 要先跑全部基模型再跑元模型，Boosting 本身是串行的——无论哪种，推理路径都变长，延迟几乎必然翻倍。P99 低于 100 毫秒的约束下，这条路线直接出局。而且集成不是免费精度：每加一个模型，成本与运维复杂度线性上升。\n\n**其他选项为什么错：**\n- A. Bagging 的 N 倍推理成本与延迟约束正面冲突。\n- B. stacking 的推理链最长（全部基模型 + 元模型），延迟最差。\n- D. Boosting 串行纠错主要发生在训练阶段，推理仍是单模型——但题目问的是集成提精度，单模型 boosting 不属于集成方案；若理解为多模型 boosting 同样违反延迟约束。\n\n**关键概念：** 集成的三道闸门按序过：模型差异够大吗？单模型还有多少提升空间？延迟与成本付得起吗？第三问不过就一票否决。","s":"自编·2.2.6"},{"id":"D2-045","d":2,"t":"single","q":"在基础模型（FM）的应用场景里，教材指出的最实用「集成」形态是？","o":[{"l":"A","t":"训练多个 FM 同时生成答案，按投票选出多数意见"},{"l":"B","t":"用元模型学习多个 FM 输出的 stacking 结构"},{"l":"C","t":"对同一个 FM 采样多次取平均概率"},{"l":"D","t":"轻量模型先答，置信度低时再由强模型重答的级联（cascade）路由"}],"a":["D"],"e":"**正确答案：D。** 级联路由（cascade）。\n\n**为什么对：** FM 场景的「集成」与传统 ML 的多模型投票是两回事：多数 FM 请求是生成式任务，没有可投票的离散类别。教材给出的实用形态是「多模型路由 + 结果校验」：轻量模型先答，判定置信度低时才把请求升级给强模型重答。它复用了分层路由的成本优势——多数请求被便宜模型吃掉——同时保住难例的质量，成本远低于并行集成。\n\n**其他选项为什么错：**\n- A. 生成式输出没有稳定投票语义，且并行跑多个 FM 的成本是数倍。\n- B. FM 输出是自由文本，元模型难以从文本堆里学出有效组合规则，实现复杂且易过拟合。\n- C. 多次采样取平均适用于有概率语义的离散任务，对开放生成场景不适用，也放大了成本。\n\n**关键概念：** 传统集成的四种方式（Bagging/Boosting/Stacking/路由）中，迁移到 FM 场景最自然的是路由——按输入特征把请求分给最合适的模型，cascade 是它的降本变体。","s":"自编·2.2.6"},{"id":"D2-046","d":2,"t":"single","q":"团队把训练的 batch size 从 32 翻倍到 64（其他设置不变），验证集指标反而下降了。按教材结论，最可能的根因是？","o":[{"l":"A","t":"没有按线性缩放规则同步放大学习率，等效步长相对变小"},{"l":"B","t":"batch size 翻倍导致显存溢出，训练静默丢步骤"},{"l":"C","t":"数据集太小，batch size 不该超过样本数的十分之一"},{"l":"D","t":"batch size 与模型深度强耦合，加深网络才能配合大 batch"}],"a":["A"],"e":"**正确答案：A。** 改 batch 没有同步改学习率。\n\n**为什么对：** 线性缩放规则：batch size 翻倍时，学习率应大致同比例放大。原因是大批量让梯度估计的噪声降低，可以支撑更大的步长；只翻 batch 不动学习率，等效于步长相对变小，训练动力学改变，最终掉点。教材明确把这条列为「改了 batch 但没改学习率导致掉点」的根因，也是必考点。\n\n**其他选项为什么错：**\n- B. 显存溢出会直接报 OOM 错误让任务失败，不会「静默丢步骤」。\n- C. 教材没有这条规则；batch size 的常见起点是「能装下的最大值的 1/2～1/4」，与样本数十分之一无关。\n- D. batch size 与学习率耦合（这是本条规则），与模型深度没有这种必须配合的关系。\n\n**关键概念：** batch size 与学习率的耦合是双刃剑：一起按规则调是提速手段，只调一个就是掉点来源。batch size 通常固定不进搜索空间，也是因为这种耦合会让搜索互相干扰。","s":"自编·2.2.7"},{"id":"D2-047","d":2,"t":"single","q":"团队第一次微调一个基础模型（FM），手边还留着当年从零训练时的超参笔记。微调的超参起点应如何设置？","o":[{"l":"A","t":"学习率 1e-3，训练 5 轮，沿用从零训练的经验"},{"l":"B","t":"学习率 1e-5～2e-5，训练 1–3 轮，预热比例 3–10%"},{"l":"C","t":"学习率 1e-2，训练 20 轮，充分收敛"},{"l":"D","t":"学习率 1e-4，训练 10 轮，配合阶梯衰减"}],"a":["B"],"e":"**正确答案：B。** 小学习率、少轮次、加预热。\n\n**为什么对：** FM 微调的超参与从零训练完全不同：学习率 1e-5～2e-5（比预训练小 1–2 个量级）——太大会毁掉预训练能力，直接触发灾难性遗忘；轮次 1–3——FM 微调极易过拟合，多数场景 2 轮内收敛；预热 3–10% 稳定早期训练。batch size 依显存尽量大一些，因为小 batch 在 FM 上噪声大。\n\n**其他选项为什么错：**\n- A. 教材案例的原型事故：沿用 1e-3 和 5 轮，结果模型输出开始重复同一句话、丢失指令理解能力——权重被彻底改写。\n- C. 1e-2 的学习率对预训练权重是破坏性的，20 轮更是把过拟合和遗忘同时拉满。\n- D. 1e-4 仍偏大 1 个量级，10 轮远超 FM 微调的常规轮次。\n\n**关键概念：** 「没区分从零训练与微调」是高频事故。微调三起点：lr 小 1–2 个量级、轮次 ≤3、必须预热。","s":"自编·2.2.7"},{"id":"D2-048","d":2,"t":"single","q":"训练 Transformer 类模型时，教材推荐的标准学习率调度配置是？","o":[{"l":"A","t":"全程固定学习率不变"},{"l":"B","t":"阶梯衰减，且不使用 warmup"},{"l":"C","t":"余弦退火叠加 warmup：前若干步线性升温，之后按余弦曲线衰减"},{"l":"D","t":"学习率随训练线性增大"}],"a":["C"],"e":"**正确答案：C。** 余弦退火 + warmup。\n\n**为什么对：** 两种手段各管一段：warmup 在训练初期把学习率从很低线性升高，防止大模型/大 batch 场景下的早期发散——初始阶段权重是随机的，一步大更新就能把训练带偏；余弦退火在中后期把学习率从高到低平滑衰减，让模型在收尾阶段做精细调整。「余弦 + warmup」是教材点名的 Transformer 类模型标准配置。\n\n**其他选项为什么错：**\n- A. 固定学习率兼顾不了「早期要小防发散、中期要大提效率、后期要小做精调」的矛盾需求。\n- B. 阶梯衰减是传统 CNN 的做法，且缺 warmup 在大模型上容易早期发散。\n- D. 线性增大与所有调度方向相反，会加剧后期震荡与不收敛。\n\n**关键概念：** 调度表四种：余弦退火（现代默认）、阶梯衰减（传统 CNN）、warmup（大模型/大 batch 必用）、余弦 + warmup（Transformer 标准）。","s":"自编·2.2.7"},{"id":"D2-049","d":2,"t":"single","q":"一个模型表现接近欠拟合（训练集与验证集都差）。教材强调，最容易被忽略、也最常见的一条排查是？","o":[{"l":"A","t":"检查学习率是否设置不当"},{"l":"B","t":"检查模型层数是否太少"},{"l":"C","t":"检查 batch size 是否太大"},{"l":"D","t":"检查数据管道是否把标签搞错了"}],"a":["D"],"e":"**正确答案：D。** 查数据管道的标签。\n\n**为什么对：** 教材在欠拟合的处理清单里专门标注：检查数据管道是否把标签搞错——这条最容易被忽略，也最常见。逻辑上它是「假性欠拟合」：模型和超参都没问题，但喂进去的标签是错的（错位、截断、编码错误），任何模型在这种数据上都学不出规律，症状与欠拟合一模一样。先排除数据问题再调模型，顺序不能反。\n\n**其他选项为什么错：**\n- A. 学习率不当（过高震荡、过低训不动）确实是欠拟合的可能原因之一，但它是常规检查项，不属于「最容易被忽略」的那条。\n- B. 增加容量是欠拟合的标准处理手段，但同样排在查数据之后。\n- C. batch size 影响训练稳定性，与欠拟合的关联较弱，不是本节点名的排查项。\n\n**关键概念：** 训练出问题先问数据：标签错、特征错、数据泄漏都会伪装成模型问题。「先查数据，再调模型」是排障的第一原则。","s":"自编·2.2.7"},{"id":"D2-050","d":2,"t":"single","q":"一个企业知识问答系统，文档库每年更新两版，且答案必须能标注出处。在提示工程之外，应选择哪种定制档位？","o":[{"l":"A","t":"RAG——挂接文档库检索，知识更新只换索引"},{"l":"B","t":"微调——用问答对训练模型记住文档内容"},{"l":"C","t":"持续预训练——用文档原文继续训练"},{"l":"D","t":"蒸馏——把大模型能力压到小模型"}],"a":["A"],"e":"**正确答案：A。** RAG。\n\n**为什么对：** 决策顺序的第一问：缺的是「事实」吗？是，就走 RAG。本题两个信号都指向 RAG：知识会变（每年更新两版）——RAG 更新只换索引，微调和持续预训练的知识固化在权重里，每次更新都要重训；需要溯源——RAG 天然带出处（检索到的文档），微调无法说明答案来自哪份资料。\n\n**其他选项为什么错：**\n- B. 微调无法保证知识新鲜度，也无法溯源，教材明确写了这两条是它的短板。\n- C. 持续预训练解决的是「领域语言理解」（术语、行文），不是事实更新；且同样有新鲜度与溯源问题，成本还更高。\n- D. 蒸馏的目标是降本保能力，与知识更新无关。\n\n**关键概念：** 四问决策链：缺事实→RAG；缺领域语言→持续预训练；缺格式遵循→提示工程再微调；只图便宜→蒸馏。第一问砍掉微调与持续预训练。","s":"自编·2.2.8"},{"id":"D2-051","d":2,"t":"single","q":"某设备维修助手有三个需求：① 看懂设备手册里的专有术语；② 回答严格按「故障现象→可能原因→处置步骤」三段式；③ 手册每年更新两版。教材给出的正确拆法是？","o":[{"l":"A","t":"三个需求全部用一次微调解决，训练数据里同时包含术语、格式和手册内容"},{"l":"B","t":"① 用持续预训练吸收手册术语，② 用提示工程固定三段式模板，③ 用 RAG 应对手册更新"},{"l":"C","t":"① 用 RAG 检索术语解释，② 用微调固化格式，③ 用提示工程提示模型注意更新"},{"l":"D","t":"三个需求全部用 RAG 解决，把手册和格式说明都放进检索库"}],"a":["B"],"e":"**正确答案：B。** 三档各管一件事：持续预训练、提示工程、RAG。\n\n**为什么对：** 这正是教材的教学案例。① 专有术语是「领域语言理解」问题——缺的是术语认知，用手册原文做持续预训练；② 三段式是「输出格式遵循」问题——需求明确且固定，提示工程配模板就能解决，成本最低；③ 手册年更是「知识新鲜度」问题——RAG 换索引即可。三档同时用、各管一件事，才是完整的方案。\n\n**其他选项为什么错：**\n- A. 全打包进一次微调：格式问题本可用免费的提示工程解决，手册更新意味着要反复重训微调模型，成本结构最差。\n- C. 术语是理解层面的问题，检索术语解释治标不治本；手册更新靠「提示模型注意」没有任何机制保证。\n- D. RAG 提供事实，但改不了领域语言理解与稳定的格式遵循——纯 RAG 方案在 ①② 上都缺手段。\n\n**关键概念：** 只答其中一个档位的方案在评分上是残缺的；「按需求拆档位、多档组合」是 MLA 的标准答法。","s":"自编·2.2.8"},{"id":"D2-052","d":2,"t":"single","q":"法律科技团队发现模型读不懂起诉状里的密集法律术语和行文习惯（事实、诉请、保全等），生成的内容外行味明显。按决策顺序，首先应该选择哪一档？","o":[{"l":"A","t":"提示工程——在提示词里附一张术语对照表"},{"l":"B","t":"RAG——检索法律条文附在上下文里"},{"l":"C","t":"持续预训练——用大量无标注法律文本继续训练，之后再叠微调"},{"l":"D","t":"蒸馏——蒸馏出一个法律专用小模型"}],"a":["C"],"e":"**正确答案：C。** 持续预训练，再叠微调。\n\n**为什么对：** 四问决策链的第二问：缺的是「领域语言理解」吗？术语不认识、行文不懂——正是这一问命中的场景。答案是持续预训练：用大量无标注领域文本（法条、判决书、起诉状）继续训练，让模型吸收领域的语言分布；之后再叠微调把任务行为调到位。教材把「领域术语密集（法规、工法、病历）」列为持续预训练的典型场景。\n\n**其他选项为什么错：**\n- A. 术语表能补几个词，补不了行文分布与术语体系的整体理解，量级差太远。\n- B. RAG 补的是「事实与出处」，模型看不懂术语时，检索回来的条文它照样读不懂。\n- D. 蒸馏解决的是降本，与领域语言能力无关。\n\n**关键概念：** 缺事实走 RAG、缺语言走持续预训练、缺格式走提示工程到微调——三问对应三档，别混。","s":"自编·2.2.8"},{"id":"D2-053","d":2,"t":"multiple","q":"关于提示工程的具体实践，以下哪些符合教材的结论？（选 2 项）","o":[{"l":"A","t":"要求 JSON 输出时，光在提示词里写「输出 JSON」通常不够稳定，要配合 schema 校验加重试或用模型的结构化输出能力"},{"l":"B","t":"少样本示例选 3–5 个、覆盖不同边界的，通常优于 20 个同质示例"},{"l":"C","t":"示例数量越多效果越好，20 个同质示例总能胜过 5 个精选示例"},{"l":"D","t":"让模型直接给出结论即可，显式列出推理过程会浪费 token 且降低准确率"}],"a":["A","B"],"e":"**正确答案：AB。**\n\n**为什么对：** A 是教材点名的第一件被低估的事：纯提示词声明的 JSON 成功率通常不到 90%，稳定方案是 schema 校验 + 失败重试，或使用模型原生的结构化输出能力——把「希望它输出对」变成「校验不过就重来」。B 是第二件：示例占上下文且会引入偏差，3–5 个覆盖不同边界的示例在效果与成本上优于大量同质示例。\n\n**其他选项为什么错：**\n- C. 与 B 直接矛盾：同质示例提供不了新信息，只消耗上下文并放大同一种偏差。\n- D. 教材第三件事正好相反：把推理过程显式化（先列依据再给结论）能显著降低「结论对但依据编造」的比例，这是 CoT 的价值。\n\n**关键概念：** 提示工程三件被低估的事：结构化输出要校验重试、示例贵精不贵多、推理过程显式化。","s":"自编·2.2.8"},{"id":"D2-054","d":2,"t":"single","q":"一个产品技术支持助手（RAG 架构），用户反馈答案经常答非所问。评估发现 Recall@10 = 0.94，但 Precision@5 = 0.31。按标准排障顺序，第一反应应该是什么？","o":[{"l":"A","t":"换更强的 embedding 模型并重建整个索引"},{"l":"B","t":"重新设计分块策略，按文档结构重切"},{"l":"C","t":"增大 top-k，把检索结果从 10 条扩到 30 条"},{"l":"D","t":"加重排（rerank）模型：召回已够、排序差，加精排层把 top-5 相关性提上去"}],"a":["D"],"e":"**正确答案：D。** 加 rerank。\n\n**为什么对：** 先读两个数：Recall@10 = 0.94 说明正确文档基本都在前 10 条里，检索没有漏；Precision@5 = 0.31 说明前 5 条里大半是无关内容——问题不是「找不到」而是「排不齐」。教材的诊断路径就是这一步：召回够但排序差，第一反应加重排。不改索引、不动 embedding，只在检索后加一层精排，通常能把 top-5 相关性提升一档；教材案例里 Precision@5 从 0.31 升到 0.72，答案质量明显改善。\n\n**其他选项为什么错：**\n- A. 换 embedding 是「召回差」时的手段，本例召回 0.94 已经够高，换模型还要重建索引，成本大收益无据。\n- B. 分块优化针对边界信息丢失（答案跨段落），不是排序问题。\n- C. 扩大 top-k 会把更多无关内容喂给模型，Precision 进一步被稀释。\n\n**关键概念：** RAG 排障标准顺序：先看召回（Recall@k），再看排序（Precision@k / MRR）。召回低修检索，召回够排序差加 rerank。","s":"自编·2.2.9"},{"id":"D2-055","d":2,"t":"single","q":"企业知识库 RAG 系统中，用户查询「SSL-2024-001」「镀锌层厚度 80μm」这类精确编号和数值时，召回效果明显差；普通语义查询正常。最对症的改造是？","o":[{"l":"A","t":"上混合检索：向量检索 + BM25 关键词检索，结果用 RRF 融合后再重排"},{"l":"B","t":"换成参数量更大的 embedding 模型"},{"l":"C","t":"把文档分块切得更小，让编号更容易命中"},{"l":"D","t":"在提示词里要求模型自己根据上下文猜测编号含义"}],"a":["A"],"e":"**正确答案：A。** 上混合检索。\n\n**为什么对：** 教材把混合检索称为「几乎是必选项」，原因正是本例：纯向量检索对精确匹配不敏感——「SSL-2024-001」这类编号、「80μm」这类数值，语义相近但字面不同的文本在向量空间里可能距离很远，embedding 抓的是语义不是字面。BM25 关键词检索恰好擅长精确匹配。生产级组合是向量 top-k + BM25 top-k → RRF 融合 → 重排 → 取 top-n。\n\n**其他选项为什么错：**\n- B. 更大的 embedding 模型仍然是语义检索，精确匹配的短板不因模型变强而消失。\n- C. 切小块解决的是「答案跨段落」，编号查询的问题是检索方式不是块大小。\n- D. 提示词改变不了「正确文档根本没被检索回来」的事实——召回缺失在检索层，模型层无法补救。\n\n**关键概念：** 判断信号表：语义相近措辞不同的查询召回差→优化 embedding；专有名词、型号、编号查询召回差→上混合检索。","s":"自编·2.2.9"},{"id":"D2-056","d":2,"t":"single","q":"团队决定把 RAG 系统的 embedding 模型换成更适合中文长文本的型号。教材提示，这一步最常被漏掉的操作是？","o":[{"l":"A","t":"把检索的 top-k 从 5 调到 10"},{"l":"B","t":"重建整个向量索引——新旧模型的向量空间不兼容"},{"l":"C","t":"清空对话历史缓存"},{"l":"D","t":"重新划分训练集与验证集"}],"a":["B"],"e":"**正确答案：B。** 重建整个索引。\n\n**为什么对：** 不同 embedding 模型输出的向量处在完全不同的向量空间里——维度可能不同，即使维度相同，各维度的语义含义也不可比。旧索引里的向量是用旧模型算的，与新模型算出的查询向量没有可比性，混用必然导致检索错乱。所以换模型必须全量重算文档向量、重建索引。教材明确说这是换模型的成本，也是常被漏掉的一步——漏掉的后果是换了模型检索反而变差且难以归因。\n\n**其他选项为什么错：**\n- A. top-k 是检索数量参数，与换模型无关。\n- C. 对话历史与向量索引是两个体系，清历史解决不了空间不兼容。\n- D. RAG 系统没有训练集验证集的划分动作，这条属于模型训练语境。\n\n**关键概念：** embedding 优化三层次：换模型（必须重建索引）、降维/量化（省存储但可能掉召回，须在真实查询集上验证）、领域适配（对比学习，需构造正负样本对）。","s":"自编·2.2.9"},{"id":"D2-057","d":2,"t":"single","q":"评估 RAG 检索质量时，哪个指标反映「第一个正确结果出现在第几位」？","o":[{"l":"A","t":"Recall@k"},{"l":"B","t":"Precision@k"},{"l":"C","t":"MRR"},{"l":"D","t":"nDCG"}],"a":["C"],"e":"**正确答案：C。** MRR（平均倒数排名）。\n\n**为什么对：** MRR 的计算是取第一个正确结果排名位置的倒数再平均：正确答案排第 1 位得 1 分，排第 3 位得 1/3 分。它专门衡量「用户想找的第一个正确答案出现得有多早」，反映排序质量——尤其适合「只要第一条对就行」的问答场景。\n\n**其他选项为什么错：**\n- A. Recall@k 衡量前 k 条里有没有正确文档，回答的是「检索是否漏」，不区分正确文档排第几。\n- B. Precision@k 衡量前 k 条里有多少是相关的，回答「检索是否杂」，同样不反映第一条正确结果的位置。\n- D. nDCG 考虑位置权重的综合排序质量，是多条相关文档按相关度分级的综合指标，比 MRR 更综合，但「第一个正确结果的位置」这一问的精确对应是 MRR。\n\n**关键概念：** 四个指标各管一件事：Recall@k 查漏、Precision@k 查杂、MRR 看第一条、nDCG 看综合排序。优化前先选对尺子。","s":"自编·2.2.9"},{"id":"D2-058","d":2,"t":"single","q":"团队多人轮流调参训练同一个推荐模型，现在要回答「哪一次配置效果最好」，但各人的结果记录格式不一、散落在聊天记录里，无法横向对比。最合适的解决方式是？","o":[{"l":"A","t":"让所有人重跑一遍，统一在群里报最新结果"},{"l":"B","t":"建一个共享表格，要求每人手工填报每次训练的参数"},{"l":"C","t":"只保留效果最好那次的模型文件，其余删除"},{"l":"D","t":"接入 SageMaker Experiments，训练时自动记录超参、指标与产物，横向对比多个 Trial"}],"a":["D"],"e":"**正确答案：D。** SageMaker Experiments。\n\n**为什么对：** 教材给的判断信号正是这组症状：「团队多人调参、结果无法对比、不知道哪次最好」→ 答案是 Experiments（追踪与对比），不是重跑。它按 Experiment（项目）→ Trial（一次尝试）→ Trial Component（训练等步骤）三层组织，每次训练自动记录超参、指标、产物路径与镜像，可直接横向对比多个 Trial 的指标曲线，不需要任何人手工填报。\n\n**其他选项为什么错：**\n- A. 重跑一遍既烧算力也解决不了记录问题——没有系统承接，下次照样乱。\n- B. 手工填报不可信也不完整（漏记默认值、口径不一），这正是要被系统替代的做法。\n- C. 只留结果不留过程，无法回答「为什么最好」，也无法在出问题时回滚对比。\n\n**关键概念：** 可复现五要素（代码、数据、超参、环境、指标产物）的承载工具就是 Experiments；题干出现「无法对比/不知道哪次好」直接指向它。","s":"自编·2.3.1"},{"id":"D2-059","d":2,"t":"single","q":"出问题想回滚到上周的模型重训复现，发现训练数据路径指向 s3://bucket/raw/，这个目录每天被上游作业整体覆盖。该问题违反了可复现的哪条实务要点？","o":[{"l":"A","t":"数据没有做快照——训练引用了会变的路径，无法回到当时的输入"},{"l":"B","t":"随机种子没有固定"},{"l":"C","t":"代码版本没有用 Git 管理"},{"l":"D","t":"超参没有记录默认值"}],"a":["A"],"e":"**正确答案：A。** 数据没做快照。\n\n**为什么对：** 教材三要点第一条：数据要做快照，不要指向会变的路径。指向每天被覆盖的目录意味着「上周那次训练的输入」已经不存在了——同一份代码、同一组超参也跑不出上周的结果，因为输入变了。正确做法是用带日期的分区目录或 Feature Store 的数据版本，让每次训练绑定一个不可变的数据快照。\n\n**其他选项为什么错：**\n- B. 种子影响的是随机性来源，题干的故障是输入数据本身没了，两者不同层。\n- C. 代码管理是五要素之一，但题干没有提供代码被改的信号。\n- D. 超参缺失影响复现，但同样不是「数据路径被覆盖」对应的问题。\n\n**关键概念：** 可复现三要点各管一件事：数据快照（防输入消失）、三处种子全固定（Python、NumPy、框架层）、镜像 digest 锁环境（防依赖漂移）。见到「路径每天被覆盖」直接对号入座第一条。","s":"自编·2.3.1"},{"id":"D2-060","d":2,"t":"single","q":"一个训练任务半年前跑通，现在重跑依赖装不上、CUDA 版本不匹配。当时只用 requirements.txt 记录了依赖且未锁版本。按教材建议，环境应该怎么锁定？","o":[{"l":"A","t":"requirements.txt 里把所有依赖都写上就行，问题在别处"},{"l":"B","t":"用 ECR 镜像 digest 固定整个运行环境，而不是依赖 tag 或不锁版本的清单"},{"l":"C","t":"把当时实例的 AMI 编号记下来"},{"l":"D","t":"重跑前把所有依赖升级到最新版本，保持环境先进"}],"a":["B"],"e":"**正确答案：B。** 用镜像 digest 锁环境。\n\n**为什么对：** requirements.txt 不锁版本意味着每次安装都会拉当时的最新兼容版，几个月后重跑必然不同——这正是「我这跑得通」类问题的根源。教材的建议是用 ECR 镜像 digest（内容寻址、不可变）而不是 tag（可被覆盖）来固定整个运行环境：框架版本、CUDA、系统库全部冻结，任何时候拉同一个 digest 都能还原当时环境。\n\n**其他选项为什么错：**\n- A. 未锁版本的清单正是问题本身，「写上了就行」不成立——间接依赖同样会漂移。\n- C. AMI 是实例层面的系统镜像，训练环境的依赖层（Python 包、框架）不在其中，且 SageMaker 场景下环境由容器镜像决定。\n- D. 升级到最新版本与锁定环境相反——恰恰制造下一次的不可复现。\n\n**关键概念：** 环境要素的锁定粒度从弱到强：不锁 < requirements.txt 锁版本 < 镜像 digest。教材明确推荐 digest。","s":"自编·2.3.1"},{"id":"D2-061","d":2,"t":"multiple","q":"关于让训练结果可复现，以下哪些做法符合教材的实务要点？（选 3 项）","o":[{"l":"A","t":"训练数据使用带日期的分区快照或 Feature Store 版本，不引用会被覆盖的路径"},{"l":"B","t":"Python、NumPy、框架层三处随机种子全部固定"},{"l":"C","t":"运行环境用 ECR 镜像 digest 锁定，而不是依赖可变的 tag"},{"l":"D","t":"只固定框架层的随机种子即可，其他随机源影响可以忽略"}],"a":["A","B","C"],"e":"**正确答案：ABC。**\n\n**为什么对：** 这三条就是教材「可复现的三个实务要点」的原文对应：数据快照（带日期分区或 Feature Store 版本，防止输入消失）；随机种子要固定且三处都要设（Python、NumPy、框架层——只设一个是常见错误，任何一处未固定都会引入不可控随机）；环境用镜像 digest 锁定（requirements.txt 不锁版本，几个月后重跑必然不同）。\n\n**其他选项为什么错：**\n- D. 与 B 直接矛盾。数据管道（shuffle）、初始化、dropout 各层可能用到不同库的随机源，漏掉任何一处，重跑结果就会不同——这正是教材点名的常见错误。\n\n**关键概念：** 可复现＝同一代码 + 同一数据 + 同一超参 + 同一环境得到同一结果；三要点分别堵住数据、随机性、环境三个漂移口。它不是为了学术洁癖，是为了出问题时能回答「哪次改动导致的」。","s":"自编·2.3.1"},{"id":"D2-062","d":2,"t":"single","q":"监控发现一个风控模型的输入特征「近 3 个月查询次数」的分布明显上移，但模型输出的内部一致性正常。这种「输入特征的分布变了」属于哪类漂移？","o":[{"l":"A","t":"概念漂移（concept drift）"},{"l":"B","t":"预测漂移（prediction drift）"},{"l":"C","t":"数据漂移（covariate shift）"},{"l":"D","t":"标签泄漏"}],"a":["C"],"e":"**正确答案：C。** 数据漂移。\n\n**为什么对：** 三种漂移按「什么变了」划分：输入特征的分布变了＝数据漂移（covariate shift），用 PSI、KL 散度、KS 检验比较特征分布来检测；本例变的是输入特征（查询次数的分布），模型自洽但预测可能失准，完全吻合数据漂移的定义。\n\n**其他选项为什么错：**\n- A. 概念漂移是「输入到输出的关系变了」——比如同样的查询次数，逾期含义变了；检测它需要新标签对比实际表现，题干没有这个信号。\n- B. 预测漂移是「输出分布变了」，本例变化在输入侧而非输出侧。\n- D. 标签泄漏是训练问题（用了预测时拿不到的特征），与线上分布变化无关。\n\n**关键概念：** 三漂移判别口诀：输入变＝数据漂移，关系变＝概念漂移，输出变＝预测漂移。预测漂移最快能抓到（标签滞后、输出立即可见）但可能无害，须结合数据漂移一起判断。","s":"自编·2.3.2"},{"id":"D2-063","d":2,"t":"single","q":"某电商销量预测模型，特征分布没变，但一次行业政策调整后「同样的促销力度带来的销量」系统性地变了。这属于哪类漂移，检测它需要什么？","o":[{"l":"A","t":"数据漂移——监控特征分布（PSI）即可发现"},{"l":"B","t":"预测漂移——监控预测值分布即可发现"},{"l":"C","t":"模型过拟合——重新离线评估即可确认"},{"l":"D","t":"概念漂移——输入到输出的关系变了，需要新标签回流比较实际表现"}],"a":["D"],"e":"**正确答案：D。** 概念漂移，需要新标签。\n\n**为什么对：** 「同样的输入，应有的输出变了」是概念漂移的定义：输入到输出的映射关系本身变了。检测它没有捷径——特征分布（数据漂移）没动、预测分布（预测漂移）可能也还没动，唯一的办法是等新的真实标签回流，比较模型预测与实际结果的偏差。\n\n**其他选项为什么错：**\n- A. 题干明确「特征分布没变」，数据漂移的检测手段抓不到关系层面的变化。\n- B. 预测分布可能滞后于关系变化，且输出分布偏移也可能是无害的业务波动，不能作为概念漂移的确认手段。\n- C. 离线评估用的是历史标签，历史数据里关系没变，测不出「现在」的关系断裂。\n\n**关键概念：** 概念漂移最隐蔽也最致命（模型逻辑失效），确认成本最高的原因是标签滞后。工程上常用预测漂移做预警、再等标签回流确认概念漂移。","s":"自编·2.3.2"},{"id":"D2-064","d":2,"t":"single","q":"为新上线的模型建立性能基线，正确的基线来源是？","o":[{"l":"A","t":"上线后一段真实流量的实际表现"},{"l":"B","t":"离线评估集上的准确率与 AUC"},{"l":"C","t":"训练集上的最优指标"},{"l":"D","t":"开发环境用历史数据回放的模拟结果"}],"a":["A"],"e":"**正确答案：A。** 上线后一段真实流量的表现。\n\n**为什么对：** 教材明确：基线必须用上线后一段真实流量的表现建立，而不是离线评估结果。原因有二：离线数据与线上流量的分布常有差异；特征可得性也不同（离线用的历史特征，线上可能是实时口径）。拿离线指标当基线，漂移告警的阈值就建立在错误参照上——要么天天误报，要么真漂移了也不响。\n\n**其他选项为什么错：**\n- B. 离线指标与实际表现常有差距，教材专门点名不能拿它当基线。\n- C. 训练集指标只反映拟合能力，与线上表现相距最远。\n- D. 回放仍是历史分布，替代不了真实流量。\n\n**关键概念：** 评估体系的建设顺序：先有基线（上线后真实表现），才有漂移判断；监控指标按层选——特征看 PSI（大于 0.1 关注、大于 0.25 报警）、质量看相对基线降幅、业务结果与业务方共定阈值。","s":"自编·2.3.2"},{"id":"D2-065","d":2,"t":"single","q":"信用评分模型上线 4 个月后通过率从 62% 降到 48%。排查发现「近 3 个月查询次数」均值上移 40%——营销活动带来了大量行为特征不同的新客。教材对这类情况的处理判断是？","o":[{"l":"A","t":"模型坏了，立即用近期数据重训模型"},{"l":"B","t":"漂移检测的价值在于判断「模型问题还是业务变化」——本例客群变了，处理是按客群分层重新校准阈值、对新客群单独建模，而不是盲目重训"},{"l":"C","t":"这是概念漂移，等新标签回流后再处理"},{"l":"D","t":"通过率下降是正常波动，设个更大的告警阈值即可"}],"a":["B"],"e":"**正确答案：B。** 先判断是模型问题还是业务变化，再对症处理。\n\n**为什么对：** 教材案例的原型：模型没坏，是客群变了——营销活动引入的新客让行为特征分布整体变化，模型在陌生分布上给出更保守的评分。正确处理不是重训（训练目标没变、模型逻辑没失效），而是按客群分层重新校准阈值，并考虑对新客群单独建模型。这正是漂移检测的深层价值：不只「发现问题」，更能「定性问题」。\n\n**其他选项为什么错：**\n- A. 重训解决不了客群构成变化的业务事实，新客仍会触发同样的保守评分。\n- C. 本例输入特征分布变化（数据漂移）有明确归因，不是输入输出关系失效（概念漂移）。\n- D. 14 个点的通过率变化不是正常波动，放大阈值是把告警弄哑而不是解决问题。\n\n**关键概念：** 漂移响应三步：定位哪种漂移 → 归因（业务变化 or 模型失效）→ 对症（分层校准/重训/新客群建模）。","s":"自编·2.3.2"},{"id":"D2-066","d":2,"t":"single","q":"关于影子部署（shadow variant），教材强调它有一个决定性局限，这个局限是？","o":[{"l":"A","t":"它只能接收很少一部分流量，长尾场景覆盖不到"},{"l":"B","t":"用户看不到它的输出，因此拿不到用户反馈——只能对比模型输出差异，不能对比业务效果"},{"l":"C","t":"它不能记录输出日志，只能实时比对"},{"l":"D","t":"它必须与生产变体使用相同的实例规格"}],"a":["B"],"e":"**正确答案：B。** 拿不到用户反馈。\n\n**为什么对：** 影子变体接收与生产相同的流量，但输出不返回给用户——用户完全不知道它的存在，也就不会对它的结果做出任何反应。所以影子对比能拿到的是「两个模型在同一输入上的输出差异」（预测一致性、分布偏移、边缘案例表现），拿不到的是「哪个让用户转化更高、投诉更少」这类业务效果。教材把这条列为高频考点。\n\n**其他选项为什么错：**\n- A. 方向说反了：影子部署是 100% 复制流量，恰恰是全覆盖（含长尾异常输入）。\n- C. 影子的标准做法就是用 Data Capture 记录输入输出、离线比对，日志是其核心机制。\n- D. 影子变体的实例规格可以独立选择，没有必须相同的规定。\n\n**关键概念：** 四种上线方式的分工：影子＝零风险验证输出差异（代价双倍推理成本），金丝雀＝风险控制，A/B＝效果判断，蓝绿＝版本切换。要「业务效果对比」时影子出局。","s":"自编·2.3.3"},{"id":"D2-067","d":2,"t":"single","q":"团队想知道新推荐的排序模型是否比现行模型带来更高的点击转化率。应该选择哪种上线对比方式？","o":[{"l":"A","t":"影子部署——零业务风险"},{"l":"B","t":"金丝雀发布——先放 5% 流量观察"},{"l":"C","t":"A/B 测试——分组用户分别使用两个版本，比较转化率差异的统计显著性"},{"l":"D","t":"蓝绿部署——两套环境并存随时切换"}],"a":["C"],"e":"**正确答案：C。** A/B 测试。\n\n**为什么对：** 教材的判断口诀：题干说「要确认新模型是否比旧模型转化率高」→ A/B；「要确认新版本不会导致超时或报错」→ 金丝雀。转化率对比是典型的效果判断：需要用户真实看到并使用两个版本的输出，再比较分组间的转化差异是否统计显著。影子部署拿不到用户反馈，天然做不了这件事。\n\n**其他选项为什么错：**\n- A. 影子的输出用户看不到，没有点击行为可言，无法产生转化率数据。\n- B. 金丝雀是风险控制手段（看会不会崩），不是效果判断手段——它的流量小且目的在稳定性，不足以支撑转化率的显著性结论。\n- D. 蓝绿解决的是版本切换与快速回滚，两组用户切换瞬间全量，没有对照实验设计。\n\n**关键概念：** 金丝雀与 A/B 目的不同、不可互相替代：一个管「崩不崩」，一个管「哪个好」。考试按题干动词判断：验证风险选金丝雀，比较效果选 A/B。","s":"自编·2.3.3"},{"id":"D2-068","d":2,"t":"single","q":"新版本推理服务即将替换线上旧版，团队担心新版本在高并发下会出现超时或报错。验证这个风险最合适的方式是？","o":[{"l":"A","t":"金丝雀发布——放小比例真实流量，监控错误率与延迟，异常即回滚"},{"l":"B","t":"影子部署——复制全部流量对比输出"},{"l":"C","t":"A/B 测试——50/50 分流比较转化率"},{"l":"D","t":"蓝绿部署——直接全量切换，靠回滚兜底"}],"a":["A"],"e":"**正确答案：A。** 金丝雀发布。\n\n**为什么对：** 「要确认新版本不会导致超时或报错」是风险控制问题，教材的对应答案就是金丝雀：放 5%–10% 的真实流量给新版本，指标可观测、可快速回滚。它用最小的用户面暴露换取稳定性信号，出现超时立刻回滚，影响范围可控。\n\n**其他选项为什么错：**\n- B. 影子部署的输出不返回用户，验证不了真实请求链路上的超时表现对用户的影响；且它关心的是输出差异，不是服务稳定性。\n- C. A/B 是效果判断手段，把 50% 用户暴露在未验证稳定性风险上，与题意相反。\n- D. 蓝绿切换瞬间全量，等于放弃小流量验证，直接承担全部风险。\n\n**关键概念：** 四方式按「用户受影响程度」排序：影子（零）< 金丝雀（小比例）< A/B（分组）< 蓝绿（全量切换）。稳定性验证用金丝雀是固定搭配。","s":"自编·2.3.3"},{"id":"D2-069","d":2,"t":"multiple","q":"关于影子部署的特点与代价，以下说法正确的有哪些？（选 3 项）","o":[{"l":"A","t":"用户完全不受影响——输出不返回给用户，只记录"},{"l":"B","t":"能获得真实流量的完整覆盖，包括长尾与异常输入"},{"l":"C","t":"代价是双倍推理成本"},{"l":"D","t":"可以通过影子运行直接对比两个版本的业务转化效果"}],"a":["A","B","C"],"e":"**正确答案：ABC。**\n\n**为什么对：** A 是影子的定义特征：接收与生产相同的流量但输出不返回用户，业务零风险。B 是它的独特价值：100% 流量复制意味着长尾、异常输入都被覆盖，这是小流量金丝雀做不到的。C 是它的代价：同一请求要跑两套模型，推理成本翻倍。三者合起来构成影子的完整画像：零风险、全覆盖、双倍成本、无用户反馈。\n\n**其他选项为什么错：**\n- D. 影子拿不到用户反馈（用户没看到输出），只能对比「模型输出差异」，不能对比「业务效果」——这是教材点名的高频考点，也是影子与 A/B 的本质分界。\n\n**关键概念：** 影子四特征一句记：零风险、全流量、双倍成本、无反馈。适用阶段是上线前最终验证与高风险场景。","s":"自编·2.3.3"},{"id":"D2-070","d":2,"t":"single","q":"金融机构的拒贷模型收到监管质询，要求对「这一笔贷款为什么被拒」给出逐单解释。最合适的解释方法是？","o":[{"l":"A","t":"部分依赖图（PDP）——看目标特征与预测的全局关系"},{"l":"B","t":"置换特征重要性——看打乱特征后指标下降多少"},{"l":"C","t":"SHAP——给出每条预测的可加特征贡献分解，回答「这一单为什么」"},{"l":"D","t":"混淆矩阵——统计各类别的预测分布"}],"a":["C"],"e":"**正确答案：C。** SHAP 局部解释。\n\n**为什么对：** 解释分两层：全局解释（模型整体依赖哪些特征，用于选型与特征筛选）和局部解释（这一条预测为什么是这个结果）。监管质询要的是局部解释——「这笔贷款被拒，主要因为负债率高」这种逐单归因。SHAP 用博弈论把预测值分解成基线值加各特征贡献，恰好给出这个分解，教材明确它是监管场景的默认答案。SageMaker Clarify 内置基于 SHAP 的全局与局部解释，报告可导出 PDF 供审计。\n\n**其他选项为什么错：**\n- A. PDP 是全局视角，回答不了单笔贷款的问题。\n- B. 置换重要性也是全局指标，且只给排序不给单笔分解。\n- D. 混淆矩阵是整体性能统计，与逐单解释无关。\n\n**关键概念：** 局部解释找 SHAP（或等价的逐条归因），全局解释可用置换重要性/PDP；Clarify 同时覆盖偏差检测与归因。","s":"自编·2.3.4"},{"id":"D2-071","d":2,"t":"single","q":"业务方看到 SHAP 显示「负债率」贡献最大，提出「降低客户负债率就能提高通过率」的结论。教材对这个推断的判断是？","o":[{"l":"A","t":"成立——SHAP 贡献大说明因果效应强"},{"l":"B","t":"成立——只要 AUC 足够高，贡献归因就等价于因果效应"},{"l":"C","t":"取决于特征数量——特征少时 SHAP 可以视为因果"},{"l":"D","t":"不成立——SHAP 解释的是模型行为，不是因果关系，不能由此得出因果结论"}],"a":["D"],"e":"**正确答案：D。** SHAP 不是因果。\n\n**为什么对：** 教材专门标注这条易错点：SHAP 解释的是模型行为，不是因果关系。它回答的是「模型在做这个预测时，有多大程度上依赖了负债率这个特征」，而不是「现实中改变负债率会怎样改变结果」。模型可能利用了与结果相关的代理变量，特征贡献大不代表干预它就能改变真实结果。题干问「能否得出因果结论」，标准答案就是不能。\n\n**其他选项为什么错：**\n- A. 贡献大只说明模型依赖它，模型本身可能是错的或有偏的。\n- B. 模型精度再高，相关性与因果性也是两回事——高精度模型同样可能学到伪相关。\n- C. SHAP 的机制（博弈论分配贡献）与特征数量无关，没有「特征少即因果」的免检通道。\n\n**关键概念：** 「解释模型」与「解释世界」的分界。要因果结论需要因果推断方法（对照实验等），解释工具给不了。","s":"自编·2.3.4"},{"id":"D2-072","d":2,"t":"single","q":"某场景法规要求每个信贷决策必须可向客户完整解释，且解释须准确无误。方案设计时教材的建议是？","o":[{"l":"A","t":"可解释性是硬约束时，选简单模型（逻辑回归、单棵浅树）本身就是答案，而不是用复杂模型加事后解释"},{"l":"B","t":"选精度最高的深度模型，再用 SHAP 补一份解释报告"},{"l":"C","t":"用集成学习把多个模型的解释合并"},{"l":"D","t":"在输出层加一段自然语言说明即可满足要求"}],"a":["A"],"e":"**正确答案：A。** 硬约束下直接选简单模型。\n\n**为什么对：** 教材的取舍逻辑：模型越复杂，事后解释越「近似」，可信度越低——SHAP 对复杂模型给出的是近似归因，不是模型内部的真实决策路径。当可解释性是硬约束（监管要求解释准确无误）时，选逻辑回归、单棵浅树这类天然透明的模型，其系数与分裂条件本身就是完整解释，这才是合规的答案。这与 2.1.3 的选型判断呼应：约束决定架构，不是精度最大化再加补丁。\n\n**其他选项为什么错：**\n- B. 事后解释是近似，「准确无误」的监管要求恰恰是它给不了的；为了精度把合规置于风险上方向反了。\n- C. 集成让模型更不透明，解释合并没有意义。\n- D. 自然语言说明如果没有透明的决策机制支撑，只是话术，不满足「解释准确」的实质要求。\n\n**关键概念：** 解释性取舍：硬约束 → 透明模型；软需求 → 复杂模型 + SHAP。别把「补解释」当「可解释」。","s":"自编·2.3.4"},{"id":"D2-073","d":2,"t":"single","q":"训练进行到中段损失突然变成 NaN。按教材的排查表，最可能的原因与处理组合是？","o":[{"l":"A","t":"学习率过小——调大学习率"},{"l":"B","t":"梯度爆炸或数值问题（log(0)、除零、混合精度溢出）——加梯度裁剪、检查数值稳定性、改用 BF16"},{"l":"C","t":"数据未归一化——只做特征归一化即可"},{"l":"D","t":"训练轮数不足——延长训练时间"}],"a":["B"],"e":"**正确答案：B。** NaN＝数值爆炸类问题。\n\n**为什么对：** 损失变 NaN 的病因在教材排查表里对应一行：学习率过大导致梯度爆炸、log(0)、除零、混合精度溢出。处理组合也是固定的：梯度裁剪（把梯度范数限制住）、检查数值稳定性（log 的输入加下界、除法加保护）、混合精度场景改用数值更稳的 BF16。\n\n**其他选项为什么错：**\n- A. 学习率过小的症状是损失平坦不动，不是 NaN；调大反而可能加重爆炸。\n- C. 未归一化通常造成收敛慢或震荡，是 NaN 的间接因素之一，但「只做归一化」覆盖不了中段突变的直接病因，教材的处理组合以裁剪与数值保护为主。\n- D. NaN 出现后训练已实质失败，延长轮数毫无意义。\n\n**关键概念：** 三大症状对应三组药：平坦→查数据与标签再调学习率；震荡→降学习率加 warmup 增 batch；NaN→梯度裁剪查数值改 BF16。先看症状再动手。","s":"自编·2.3.5"},{"id":"D2-074","d":2,"t":"single","q":"训练损失曲线剧烈上下震荡、无法稳定下降。按教材排查表，最可能的原因与处理是？","o":[{"l":"A","t":"标签错位——重新对齐特征与标签"},{"l":"B","t":"梯度消失——加深网络"},{"l":"C","t":"学习率过大或 batch 太小——降学习率、加 warmup、增大 batch"},{"l":"D","t":"数据分片不均——调整分布式采样器"}],"a":["C"],"e":"**正确答案：C。** 学习率过大或 batch 太小。\n\n**为什么对：** 震荡的力学解释很直接：单步更新步子太大（学习率过大）会跨过谷底来回跳；batch 太小则梯度估计噪声大，每步方向抖动剧烈。教材给的药方对应：降学习率、加 warmup（稳定早期）、增大 batch（平滑梯度估计）。\n\n**其他选项为什么错：**\n- A. 标签错位的典型症状是损失降到某个水平就不动（模型只能学到恒定解），不是剧烈震荡。\n- B. 梯度消失的症状是损失平坦（前面层几乎学不到东西），加深网络反而加重消失。\n- D. 数据分片问题是分布式场景的症状（多卡慢或不一致），单机震荡与它无关。\n\n**关键概念：** 震荡与平坦是一对相反的信号：震荡往「小步长、大 batch」调，平坦往「查数据、提学习率」查——方向搞反会越调越糟。","s":"自编·2.3.5"},{"id":"D2-075","d":2,"t":"single","q":"模型训练不收敛，团队准备开始调学习率和换优化器。按教材的方法论，第一步应该做什么？","o":[{"l":"A","t":"直接把学习率减半再试一轮"},{"l":"B","t":"换更先进的优化器"},{"l":"C","t":"加深网络增加模型容量"},{"l":"D","t":"先做小样本过拟合测试（50–100 条样本关正则训到损失接近 0），验证「模型有没有可能学会」；做不到说明是数据或代码问题，不要继续调参"}],"a":["D"],"e":"**正确答案：D。** 先做小样本过拟合测试。\n\n**为什么对：** 教材点名的最高效排查动作：取 50–100 条样本、关闭正则、训练到损失接近 0。这是对「训练管道是否健康」的二分测试——连 100 条都过拟合不了，说明数据或代码有问题（标签错位、标签泄漏、特征尺度、实现 bug），任何超参都救不了；能过拟合，才轮到调超参。教材案例里团队花两天调学习率换优化器全部无效，最后发现是时序拼接错位一行——修正后损失立刻从 0.8 降到 0.12。\n\n**其他选项为什么错：**\n- A. 学习率是最常被误调的参数：数据有问题时任何学习率都不收敛，先调它是在错误的层面使劲。\n- B. 换优化器同理，跳过了「数据先行」的排查顺序。\n- C. 欠拟合才加容量，且同样排在数据检查之后。\n\n**关键概念：** 排查顺序铁律：数据 → 标签 → 特征尺度 → 模型结构 → 超参。小样本过拟合测试是这条顺序的第一道闸。","s":"自编·2.3.5"},{"id":"D2-076","d":2,"t":"single","q":"一个 churn 预测模型离线评估 AUC 高达 0.97，上线后表现平平。排查中发现特征里包含了「用户是否已办理退订」字段。这个问题属于？","o":[{"l":"A","t":"标签泄漏——用了预测时拿不到的特征，指标好得不真实"},{"l":"B","t":"过拟合——验证集太小"},{"l":"C","t":"概念漂移——上线后关系变了"},{"l":"D","t":"欠拟合——特征不足"}],"a":["A"],"e":"**正确答案：A。** 标签泄漏。\n\n**为什么对：** 教材把标签泄漏列为三类常见数据问题中最隐蔽的一个，特征表现就是「指标好得不真实」。「是否已办理退订」在预测时点根本拿不到——它是结果的另一种记录方式，模型等于直接抄了答案。离线 AUC 虚高、上线必然打回原形。教材列的三类数据问题：标签错位（特征与标签没对齐）、标签泄漏（用了预测时拿不到的特征）、归一化用了全量统计（含验证集）。\n\n**其他选项为什么错：**\n- B. 过拟合的信号是训练与验证的差距，本例是离线与线上的落差，病因在特征层。\n- C. 概念漂移发生在上线之后的关系变化，本例是上线前特征设计就错了。\n- D. 欠拟合是「学不到」，与「学得太假」相反。\n\n**关键概念：** 排查第一步永远是看数据。见到「离线极好、上线拉胯」先查有没有预测时点拿不到的特征混进来。","s":"自编·2.3.5"},{"id":"D2-077","d":2,"t":"single","q":"一个计费结算场景要求：同一张账单每次计算结果必须完全一致，金额汇总必须精确到分。选型判断是？","o":[{"l":"A","t":"用能力最强的基础模型，配低温采样保证一致性"},{"l":"B","t":"这类要求命中「GenAI 一定输」的判定：确定性输出与严格数值计算，应回到传统 ML 或规则引擎"},{"l":"C","t":"用多个基础模型投票取多数结果"},{"l":"D","t":"基础模型加事后校验脚本，不一致时重跑"}],"a":["B"],"e":"**正确答案：B。** 回到传统 ML 或规则引擎。\n\n**为什么对：** 教材列了四条「GenAI 一定输」的判定，本题命中两条：要求确定性输出（同一输入必须每次相同——计费、审计打标）和要求严格数值计算（金额汇总、利率计算）。GenAI 同输入可能不同输出（温度、采样），数值计算也不是它的强项，这两条任意成立就该回传统路线，何况两条同时成立。\n\n**其他选项为什么错：**\n- A. 低温采样降低了随机性但给不了「完全一致」的保证，金额精确计算更是模型能力边界之外。\n- C. 投票仍是概率性输出，解决不了确定性与数值精确两个硬要求，成本还翻倍。\n- D. 重跑重试是打补丁：一致性没有机制保证，重跑还引入新的不确定性，结算场景不可接受。\n\n**关键概念：** 四条一票否决：确定性输出、严格数值计算、毫秒级延迟、可完整形式化验证。反向信号（非结构化输入 + 语义理解 + 自然语言输出）则 GenAI 几乎总优。","s":"自编·2.3.6"},{"id":"D2-078","d":2,"t":"single","q":"要把「合同条款抽取」的 GenAI 方案与传统 NER 方案放进同一个选型对比里，教材要求的正确做法是？","o":[{"l":"A","t":"各报一个综合满意度分数，分高者胜"},{"l":"B","t":"用 BLEU 分数比较两个方案的输出质量"},{"l":"C","t":"把 GenAI 的产出降维成可判定项——字段完整率、字段准确率、格式合规率、单位成本——再与 NER 的实体级 F1 和成本同口径比较"},{"l":"D","t":"让业务方各试用一周后凭印象投票"}],"a":["C"],"e":"**正确答案：C。** 先降维成可判定项，再同口径比。\n\n**为什么对：** 两套评估语言不能横向比：传统 ML 有标签可比，GenAI 常无唯一正确答案。教材给的桥接办法就是把 GenAI 产出转成可判定的事实：字段抽取有唯一答案（原文里有没有这个条款），因此可以算完整率与准确率；格式合规率可程序判定；单位成本可直接核算。此时才能跟 NER 的实体级 F1、含标注与训练的成本放在同一张表上比。\n\n**其他选项为什么错：**\n- A. 「综合满意度」把不同维度揉成一个数，且无统一标尺，不具可比性。\n- B. BLEU 是翻译指标的误用：字段抽取有精确答案，应该用精确匹配，而不是与参考文本的 n-gram 相似度。\n- D. 印象投票没有统计设计与口径控制，结论撑不起选型决策。\n\n**关键概念：** 选型比较的正确姿势：各自在「自己的语言」下达标 + 把可比部分降维成同一口径，而不是造一个跨语言的总分。","s":"自编·2.3.6"},{"id":"D2-079","d":2,"t":"single","q":"票据录入对比：方案 A（OCR + 规则模板）2000 张测试集字段准确率 96%，但每新增一种票据格式要改模板约 3 人日；方案 B（多模态模型直读）准确率 92%，新格式零改造。教材给出的评估结论形态是？","o":[{"l":"A","t":"选 A——准确率高的方案胜出"},{"l":"B","t":"选 B——零改造意味着总成本更低"},{"l":"C","t":"混合决策：A 兜底已知格式、B 处理未见过的新格式，金额勾稽关系由规则层校验——评估结论要能支撑这种混合方案，而不是给一个总分"},{"l":"D","t":"再各跑一轮更大的测试集，取总分高者"}],"a":["C"],"e":"**正确答案：C。** 混合决策。\n\n**为什么对：** 教材案例的原型结论：两个方案各有所长——A 在已知格式上精度高但扩展贵，B 扩展免费但精度略低。正确答案不是二选一，而是各取所长：已知格式走 A（成熟、准），新格式走 B（零改造），再用规则层校验金额勾稽这类硬约束。评估的产出物应当是「支撑混合决策的证据」（各自在哪些条件下达标、代价是什么），而不是一个谁高谁低的总分。\n\n**其他选项为什么错：**\n- A. 只看准确率忽略了扩展成本维度——票据种类持续增加时 A 的总成本会反超。\n- B. 只看扩展性忽略了已知格式上的精度差距。\n- D. 更大的测试集不会改变两个方案的优劣势结构，总分思维正是要被纠正的。\n\n**关键概念：** 综合评估的产出是决策依据而非排名：主链路 GenAI + 关键字段规则校验、两套指标挂同一看板分别看达标率。","s":"自编·2.3.6"},{"id":"D2-080","d":2,"t":"single","q":"设计人工评估方案来对比两个模型的摘要质量。按教材结论，一致性与可靠性最高的组织形态是？","o":[{"l":"A","t":"绝对打分——每人按 1–5 分直接评"},{"l":"B","t":"排序——多个输出排成顺序"},{"l":"C","t":"让模型自评后人工确认"},{"l":"D","t":"成对比较（pairwise）——两个输出选更好的一个"}],"a":["D"],"e":"**正确答案：D。** 成对比较。\n\n**为什么对：** 教材把成对比较标为「一致性最高，推荐」。原因是人的绝对标尺不稳定：同一个人今天打的 3 分和明天打的 4 分，界线会漂移；但「这两个哪个好」是相对判断，锚点明确，一致率高得多。这是人评设计的核心实务经验，也是高频考点。\n\n**其他选项为什么错：**\n- A. 绝对打分成本低、适合快速筛，但主观标尺漂移是其固有缺陷。\n- B. 排序对评者的认知负担大、成本高，适合多方案离线选优，不是一致性最优解。\n- C. 模型自评是 LLM 裁判的范畴，且引入自我偏好风险，不是「人工评估」的形态。\n\n**关键概念：** 人评四形态按成本与用途选：绝对打分快速筛、成对比较版本对比（推荐）、排序多方案选优、标注式构建评估集。","s":"自编·2.3.7"},{"id":"D2-081","d":2,"t":"single","q":"两个标注员对同一批输出的独立评审一致率只有 61%（Cohen's Kappa 0.42）。项目压力下想尽快扩大标注量。教材的建议是？","o":[{"l":"A","t":"一致率不达标时先修评估规范，不要继续扩标注量——规范模糊时增加标注只会增加噪声"},{"l":"B","t":"继续扩大标注量，用样本量稀释分歧"},{"l":"C","t":"只保留一致的部分，不一致的样本丢弃"},{"l":"D","t":"把两人结果取平均分，降低单人口味影响"}],"a":["A"],"e":"**正确答案：A。** 先修规范，不扩量。\n\n**为什么对：** 一致率与 Kappa 是人评可信度的前提：一致率应不低于 80%，Kappa 不低于 0.6 可用、0.8 良好。61% 与 0.42 都远不达标，说明两个人对「什么叫好」的理解都不同——这时问题的根源是规范模糊，扩标注只会把模糊复制更多份，噪声随量增长。教材的原话正是：先修评估规范，不要继续扩标注量。\n\n**其他选项为什么错：**\n- B. 样本量稀释不了系统性分歧——分歧是规范层面的，不是抽样误差。\n- C. 丢弃不一致样本会引入选择偏差，且丢掉了最有价值的「规范边界」信息。\n- D. 取平均掩盖分歧而不是解决分歧，产出的是没人真正认可的分数。\n\n**关键概念：** 人评质控顺序：修规范 → 小样本试标 → 测一致率（≥80% 或 Kappa ≥0.6）→ 达标后才扩量。","s":"自编·2.3.7"},{"id":"D2-082","d":2,"t":"multiple","q":"关于 Amazon A2I 实现的低置信度回流（人在回路），以下设计要点正确的有哪些？（选 2 项）","o":[{"l":"A","t":"置信度阈值决定了人工量与准确率的平衡，阈值要按成本测算，不能凭感觉"},{"l":"B","t":"人工修正的结果回流用于重训，HITL 不只是兜底，还在生产训练数据"},{"l":"C","t":"阈值统一设 0.9 是行业最佳实践，无需按场景调整"},{"l":"D","t":"人工审核只承担兜底职能，其结果不应再进入训练数据"}],"a":["A","B"],"e":"**正确答案：AB。**\n\n**为什么对：** A 是 A2I 的关键设计点（教材原话）：置信度阈值决定多少样本转人工——阈值越低漏过风险越多、人工量越少，阈值按成本测算才能找到平衡点。B 是 HITL 的复利效应：低置信样本由人工修正后回灌训练集，模型在下个版本自己变强、人工量随之下降。教材合同抽取案例：阈值 0.85、约 22% 转人工，三个月后低置信区间准确率升到 94%、人工量降到 12%、综合 99.3%。\n\n**其他选项为什么错：**\n- C. 阈值与错误代价、人工成本、置信度分布都相关，不同场景差异巨大，不存在普适的 0.9。\n- D. 与 B 相反——回流重训正是 HITL 区别于单纯人工兜底的核心价值。\n\n**关键概念：** HITL 三接入点：前置审核（高风险动作）、后置抽检（质检）、低置信度回流（A2I 主战场）。","s":"自编·2.3.7"},{"id":"D2-083","d":2,"t":"single","q":"评估一个机器翻译系统的输出质量（有参考译文），教材推荐的对应指标是？","o":[{"l":"A","t":"ROUGE——n-gram 召回率"},{"l":"B","t":"BLEU——n-gram 精确率加简短惩罚"},{"l":"C","t":"BERTScore——上下文语义相似度"},{"l":"D","t":"Perplexity——语言模型困惑度"}],"a":["B"],"e":"**正确答案：B。** BLEU。\n\n**为什么对：** 教材的一句话分工：BLEU 看翻译、ROUGE 看摘要、BERTScore 看语义。BLEU 的机制是 n-gram 精确率（生成中有多少 n-gram 出现在参考译文里）加简短惩罚，天然贴合翻译评估「译文内容应与参考高度对应」的要求；它的短板（对语序变化、意译极敏感）在翻译场景里恰是可接受的严格。\n\n**其他选项为什么错：**\n- A. ROUGE 是召回率视角（参考里有多少被生成覆盖），为摘要场景设计，用于翻译会放过译文里多余的内容。\n- C. BERTScore 擅长语义等价但措辞不同的输出，作为翻译的粗筛可以，但它的定位不是翻译指标，且对事实错误无感。\n- D. Perplexity 衡量语言模型对文本的建模难度，不涉及与参考译文的对应关系，不能评估翻译质量。\n\n**关键概念：** 三指标分工口诀必须条件反射：翻译 BLEU、摘要 ROUGE、语义 BERTScore。","s":"自编·2.3.8"},{"id":"D2-084","d":2,"t":"single","q":"会议纪要生成功能：v3 的 ROUGE-L 比 v2 高 4 个点，据此上线后用户投诉变多——v3 把讨论中的错误观点也照搬进了结论，而 v2 会做归纳。教材对这个现象的诊断是？","o":[{"l":"A","t":"ROUGE 分数太低，应该换 BLEU 重评"},{"l":"B","t":"测试集太小导致指标波动，扩大测试集即可"},{"l":"C","t":"ROUGE 奖励「抄得准」、惩罚「归纳得好」，与业务目标相反——自动指标衡量相似度而非正确性，应改用人评加 LLM 裁判的结论正确性维度"},{"l":"D","t":"v3 其实更好，用户投诉是习惯问题"}],"a":["C"],"e":"**正确答案：C。** ROUGE 奖励抄得准，惩罚归纳得好。\n\n**为什么对：** 教材案例的原型：ROUGE 度量生成与参考文本的 n-gram 重叠，v3 更贴原文所以分高，但业务要的是「把讨论归纳成正确结论」——归纳必然改写原文，ROUGE 反而给低分。这暴露了自动指标的根本缺陷：衡量相似度而非正确性，与业务目标背离时应改用更高档的评估（LLM 裁判看结论正确性、人评做最终验收）。\n\n**其他选项为什么错：**\n- A. BLEU 同样是相似度指标，换一个相似度指标解决不了「正确性」的缺失。\n- B. 这不是波动问题——v3 高 4 个点是稳定重现的，问题是指标本身选错了。\n- D. 投诉增多是业务效果变差的直接证据，「习惯问题」不成立。\n\n**关键概念：** 自动指标只能当筛选档（快速排除明显差的版本、做回归监控），不能当验收依据；验收走 LLM 裁判加人评。","s":"自编·2.3.8"},{"id":"D2-085","d":2,"t":"single","q":"教材指出 BLEU、ROUGE、BERTScore 有一个共同的、决定其只能做筛选不能做验收的缺陷，这个缺陷是？","o":[{"l":"A","t":"计算成本太高，无法规模化"},{"l":"B","t":"只支持英文，中文场景不适用"},{"l":"C","t":"需要海量参考答案才能稳定"},{"l":"D","t":"它们衡量的是与参考答案的相似度而非正确性——对幻觉完全无感，答对但用词不同会得低分，答错但句式与参考一致可能得高分"}],"a":["D"],"e":"**正确答案：D。** 衡量相似度，不衡量正确性。\n\n**为什么对：** 教材对三指标共同缺陷的原话就是这句。它推导出三个后果：模型答对但用词不同会得低分（误杀）；答错但句式与参考一致可能不低分（漏放）；对幻觉完全无感——一段流畅、结构合理、内容全错的话，BLEU/ROUGE 可能拿高分。这就是它们只能做「快速筛掉明显差的版本」这一档、不能做验收依据的原因。\n\n**其他选项为什么错：**\n- A. 恰恰相反，自动指标的优势就是计算便宜、可规模化，这是它们能承担「筛选档」的原因。\n- B. 三者都有中文可用的实现，语言支持不是其根本缺陷。\n- C. 单一参考确实会让指标失真（参考答案本身有主观性），但这是附带问题；决定「不能验收」的是相似度与正确性的错位。\n\n**关键概念：** 三档评估组合：自动指标筛选回归监控 → LLM 裁判判正确性忠实度 → 人评最终验收。","s":"自编·2.3.8"},{"id":"D2-086","d":2,"t":"single","q":"用 LLM 裁判做 A/B 两个模型输出的成对比较时，发现裁判明显偏好排在前面（或排在后面）的答案。这是哪种偏差，标准缓解方式是？","o":[{"l":"A","t":"长度偏置——在标准里明确「简洁优先」"},{"l":"B","t":"位置偏置——交换顺序各评一次，取一致的结果"},{"l":"C","t":"自我偏好——换不同族系的模型当裁判"},{"l":"D","t":"顺从偏置——改用二元判定"}],"a":["B"],"e":"**正确答案：B。** 位置偏置，交换顺序复评。\n\n**为什么对：** 成对比较时裁判对答案出现位置的偏好就是位置偏置的定义（偏好排在前面的那个），教材给的缓解方式是交换顺序各评一次：两次结果一致才采信，不一致则记为无法判定。这与人工评估中控制呈现顺序的道理相同。\n\n**其他选项为什么错：**\n- A. 长度偏置是对「更长回答」的偏好，缓解靠标准里写明简洁优先或长度归一，与位置无关。\n- C. 自我偏好指裁判偏好同族系模型的输出，缓解是换族系，与本例现象不符。\n- D. 顺从偏置是倾向判「通过」，缓解是二元判定加明确失败示例，同样不对症。\n\n**关键概念：** 裁判四偏差对照记：位置→交换复评；长度→标准约束；自我偏好→换族系；顺从→二元判定。见到「排序位置影响判断」直接锁定位置偏置。","s":"自编·2.3.9"},{"id":"D2-087","d":2,"t":"single","q":"团队搭好一个 LLM 裁判准备用于版本验收。按教材要求，上线验收前必须做的一步是什么？","o":[{"l":"A","t":"抽取 100–200 条人工已标注样本让裁判判，一致率低于 80% 的裁判不可用于验收，只能用于粗筛"},{"l":"B","t":"直接投入使用，事后用业务反馈校正"},{"l":"C","t":"把裁判温度调到 0 就等于可信"},{"l":"D","t":"用最大的模型当裁判，能力最强必然最准"}],"a":["A"],"e":"**正确答案：A。** 先用人工标注验准。\n\n**为什么对：** 教材给的「LLM 裁判可信吗」的标准答案就是这个动作：抽 100–200 条人工已标注样本让裁判独立判，算与人工的一致率——一致率不低于 80% 才能用于验收，达不到只能降级为粗筛。裁判本质是又一个模型，它自己也会错，验准是把「裁判的可信度」从假设变成测量。\n\n**其他选项为什么错：**\n- B. 事后校正意味着验收结论先于可信度建立，风险倒挂。\n- C. 温度为 0 只消除采样随机，消不掉裁判的标准理解偏差与各类偏置。\n- D. 「最大模型」不能替代验准——自我偏好、位置偏置等偏差与模型大小无关，且成本更高。\n\n**关键概念：** 裁判上线三件套：具体标准（不是「好不好」而是可判定的失败定义）、先理由后结论的枚举输出、边界正反例；再加验准一致率不低于 80%。","s":"自编·2.3.9"},{"id":"D2-088","d":2,"t":"single","q":"用 LLM 裁判单点打分（1–5 分）评估「是否回答了用户问题」，结果分数集中在 4.1–4.3、完全无区分度。教材指出的改进方向是？","o":[{"l":"A","t":"把评分范围扩到 1–10 分，增加区分粒度"},{"l":"B","t":"改为二元判定（「回答是否包含用户所问的具体信息点」），标准写得极具体，配合先理由后结论与人工标注验准"},{"l":"C","t":"多跑几次取平均分"},{"l":"D","t":"换更大的裁判模型重新打分"}],"a":["B"],"e":"**正确答案：B。** 改二元判定。\n\n**为什么对：** 教材在四种裁判模式表里把二元判定标为「最可靠」：判定「是否符合某条具体标准」（是/否），适合忠实度、格式、安全性。单点打分的通病正是本例——分数标尺不稳、集中在 4 分附近。教材案例的改造路径完整可抄：把「是否回答了问题」改写成可判定的「回答是否包含用户所问的具体信息点」＋先给理由再给结论＋200 条人工标注验准（一致率 86%），v2 通过率 78%、v3 91% 的区分度立刻出来。\n\n**其他选项为什么错：**\n- A. 扩分范围不改变标尺不稳的根源，4.1–4.3 会变成 8.1–8.3。\n- C. 分数集中在 4 分是系统性的标尺问题，取平均不产生区分度。\n- D. 模型大小不解决「标准模糊」——问题出在评分标准不可判定，不在裁判能力。\n\n**关键概念：** 裁判设计三原则：标准具体到可判定、结论限定枚举值（先理由后结论）、边界示例给正反例。","s":"自编·2.3.9"},{"id":"D2-089","d":2,"t":"single","q":"RAG 系统评估中，「输出中的每个论断能否在检索到的文档中找到依据」衡量的指标是？它低意味着什么？","o":[{"l":"A","t":"答案相关性——低意味着答非所问"},{"l":"B","t":"Recall@k——低意味着检索漏了文档"},{"l":"C","t":"忠实度（faithfulness）——低等于幻觉，即使检索完全正确也会失败"},{"l":"D","t":"拒答率——低意味着系统过度拒答"}],"a":["C"],"e":"**正确答案：C。** 忠实度，低＝幻觉。\n\n**为什么对：** 忠实度的定义就是「输出中的每个论断能否在检索到的文档中找到依据」，教材称它为 RAG 最核心的指标，并明确：忠实度低＝幻觉——即使检索层完全正确，生成层自行编造也会失败。评估方式通常由 LLM 裁判逐句核对输出与检索依据的对应关系。\n\n**其他选项为什么错：**\n- A. 答案相关性衡量「是否回答了所问」，与「论断有无依据」是两个维度。\n- B. Recall@k 是检索层指标（该找到的找到了吗），管不到生成层是否忠实。\n- D. 拒答率是行为统计指标，与论断依据无直接对应。\n\n**关键概念：** RAG 两阶段评估各管一层：检索层看 Recall/Precision/MRR/nDCG（改分块、embedding、混合检索、重排），生成层看忠实度、答案相关性、是否拒答（改 prompt、模型档位、上下文组织）。","s":"自编·2.3.10"},{"id":"D2-090","d":2,"t":"single","q":"制度问答助手上线两个月后用户反馈「越来越不准」。监控显示检索命中率从 96% 降到 71%，排查发现知识库每日增量同步时旧版本文档没被删除，top-k 里一半是过期条款。教材的修法组合是？","o":[{"l":"A","t":"换更强的生成模型，让它自己分辨新旧条款"},{"l":"B","t":"把 top-k 从 5 扩到 20，让正确条款更容易被抽中"},{"l":"C","t":"在提示词里加一句「请注意使用最新条款」"},{"l":"D","t":"索引加生效日期元数据、检索时按当前日期过滤、删除旧版本，并配一批「答案已变」的回归测试问题"}],"a":["D"],"e":"**正确答案：D。** 元数据过滤 + 删旧版 + 回归测试。\n\n**为什么对：** 这是教材的原型故障：知识库更新是 RAG 特有的运维问题，文档更新后必须重新索引，否则答旧内容。修法三件事一一对应：元数据带生效日期（effective_date）、检索时按当前日期过滤（新旧并存时给优先级）、配一批「答案已变」的问题做更新后的回归测试。教材案例按此修复后命中率从 71% 回到 94%。关键认知：这个故障纯模型评估完全看不出来——必须监控检索层。\n\n**其他选项为什么错：**\n- A. 生成模型再强，也分不清两份并存条款哪个现行——证据层就是脏的。\n- B. 扩 top-k 把更多过期条款喂进上下文，冲突更严重。\n- C. 提示词约束挡不住「检索层一半是旧文档」的事实。\n\n**关键概念：** RAG 生产监控五项：空结果率、top-k 相似度分布、拒答率、引用缺失率、负反馈率。命中率突降先查索引与同步，别先怀疑模型。","s":"自编·2.3.10"},{"id":"D2-091","d":2,"t":"multiple","q":"RAG 系统上线后的生产监控信号，以下解读正确的有哪些？（选 3 项）","o":[{"l":"A","t":"空结果率（检索未返回结果）突增——索引或过滤条件出了问题"},{"l":"B","t":"拒答率突降——可能在编造（该拒的没拒）"},{"l":"C","t":"引用缺失率（输出没给出处）——忠实度风险的先行指标"},{"l":"D","t":"top-k 相似度分布整体下移——说明生成模型能力退化了"}],"a":["A","B","C"],"e":"**正确答案：ABC。**\n\n**为什么对：** 这三条是教材监控表的标准解读：空结果率突增＝索引或过滤条件出问题（检索层故障的最直接信号）；拒答率双向都有含义——突增是检索质量下降（找不到依据只能拒），突降是可能在编造（该拒的没拒）；引用缺失率是忠实度风险的先行指标——输出连出处都不给了，无依据论断大概率在增加。\n\n**其他选项为什么错：**\n- D. 相似度分布整体下移的解读是「知识库覆盖不足或查询分布变化」——是检索层/语料层的信号，推不出「生成模型能力退化」（生成模型没有被改动，何谈退化）。\n\n**关键概念：** RAG 监控五项全记：空结果率、top-k 相似度分布、拒答率（双向解读）、引用缺失率、用户负反馈率。解读时先问「这个信号在检索层还是生成层」。","s":"自编·2.3.10"},{"id":"D3-001","d":3,"t":"single","q":"业务方需要做一个文档处理服务：用户上传约 300 页的 PDF 后系统做条款抽取，单次处理耗时约 4 分钟，处理结果不需要立刻返回给用户（用户可以稍后在页面查看）。应该选择哪种推理形态？","o":[{"l":"A","t":"异步推理：请求进队列、长时处理、结果存 S3，用户稍后取"},{"l":"B","t":"实时推理端点，因为要保证处理质量"},{"l":"C","t":"Serverless 推理，因为流量不大"},{"l":"D","t":"边缘部署，把模型放到用户浏览器里跑"}],"a":["A"],"e":"**正确答案：A。** 异步推理。\n\n**为什么对：** 教材的决策路径按顺序问：①需要同步返回吗——不需要；②payload 大、单次耗时约 4 分钟——远超实时端点限额（约 6MB/60 秒量级），同步接口必然超时。异步推理正是「队列 + 长时处理 + 结果落 S3」的形态，大 payload 和分钟级耗时都覆盖。教材的教学案例里「300 页 PDF 做条款抽取」的标准答案就是异步推理，且指出「把它做成实时端点是最常见的错误答案」。\n\n**其他选项为什么错：**\n- B. 实时端点有请求超时限制，4 分钟处理会让请求失败；且结果无需立刻返回，常驻实例是浪费。\n- C. Serverless 有内存与超时上限，长耗时大任务装不下，冷启动还会进一步拖长。\n- D. 300 页 PDF 的 LLM 抽取远超设备算力，边缘只适合小模型、断网场景。\n\n**关键概念：** 请求形态决定部署形态——「能等 + 大 + 慢」＝异步推理，「整个数据集离线跑」＝批量转换，「要同步」才考虑实时/Serverless。","s":"自编·3.1.1"},{"id":"D3-002","d":3,"t":"single","q":"团队计划把一个 70B 参数的大语言模型部署成推理服务，有成员提议「用 Serverless 推理最省钱，没流量时不花钱」。这个提议的问题在哪里？","o":[{"l":"A","t":"Serverless 不支持 Python 运行时"},{"l":"B","t":"Serverless 有内存与超时的资源上限，几十 GB 权重的大模型根本装不进去"},{"l":"C","t":"Serverless 只能处理批量的请求"},{"l":"D","t":"Serverless 不支持自动扩缩"}],"a":["B"],"e":"**正确答案：B。** 资源上限装不下大模型。\n\n**为什么对：** 教材明确把「Serverless 的两个硬限制」列为高频考点：一是冷启动（缩到零后首个请求要等容器拉起加模型加载）；二是资源上限——内存与超时都有上限，**「把 70B 模型放 Serverless 端点」是典型错误选项**。70B 量化后权重仍有几十 GB，加上运行时显存需求，远超 Serverless 的内存档位。\n\n**其他选项为什么错：**\n- A. Serverless 推理就是容器承载，运行时没有这种限制。\n- C. Serverless 处理的是单条实时请求，不是批量作业（批量转换才对应数据集级推理）。\n- D. Serverless 本身就是按请求自动拉起/释放的机制，这不是它的问题所在。\n\n**关键概念：** Serverless 推理的适用边界＝「间歇性流量 + 小到中型模型 + 能接受冷启动」。大模型应走实时端点 + 大实例族，或先量化/蒸馏降规模。","s":"自编·3.1.1"},{"id":"D3-003","d":3,"t":"single","q":"一个在线客服意图分类服务：请求必须同步返回、流量持续且高（QPS 约 200）。按教材的选型决策路径，应该怎么部署？","o":[{"l":"A","t":"批量转换，夜间集中处理"},{"l":"B","t":"Serverless 推理，流量高峰时自动拉起"},{"l":"C","t":"实时端点 + 目标追踪自动扩缩"},{"l":"D","t":"异步推理，结果写入 S3 供前端轮询"}],"a":["C"],"e":"**正确答案：C。** 实时端点 + 目标追踪扩缩。\n\n**为什么对：** 决策路径两问即定：①需要同步返回——是，排除批量与异步；②流量持续且高——对应「实时端点 + 自动扩缩」。教材教学案例中「在线客服意图分类 QPS 200」的配置正是实时端点加目标追踪扩缩。常驻实例保证无冷启动、延迟稳定，扩缩应对流量波动。\n\n**其他选项为什么错：**\n- A. 批量转换面向离线数据集、跑完即停，无法提供同步在线接口。\n- B. 持续高流量下 Serverless 反而可能更贵且受资源上限约束；间歇性流量才是它的场景。\n- D. 客服场景必须毫秒到秒级同步返回，异步把结果写 S3 再轮询的延迟不可接受。\n\n**关键概念：** 选型顺序＝先答「是否同步」，再答「流量持续还是间歇」，再查 payload/耗时限额，最后查模型规模。持续高流量加同步要求，唯一落点是实时端点。","s":"自编·3.1.1"},{"id":"D3-004","d":3,"t":"multiple","q":"关于 Serverless 推理的适用边界，以下哪些场景**不适合**使用 Serverless 推理？（选三项）","o":[{"l":"A","t":"部署一个几十 GB 权重的大语言模型"},{"l":"B","t":"开发测试环境的间歇性小模型调用"},{"l":"C","t":"业务对响应延迟有硬性 SLA 要求"},{"l":"D","t":"流量间歇且不可预测的小模型分类接口"},{"l":"E","t":"单次请求需要稳定低延迟的高频在线服务"}],"a":["A","C","E"],"e":"**正确答案：ACE。**\n\n**为什么对：** 教材对照表中 Serverless 的「明确不适用」两栏：大模型（内存/加载时间限制）与硬延迟要求。A 错在资源上限——几十 GB 权重装不进内存档位；C 错在冷启动——缩到零后首个请求要等容器拉起加模型加载，秒级到分钟级不可控；E 错在高频常驻——持续高流量下冷启动反复发生，常驻实时端点更稳。教材对照表中实时端点一行正对应「低延迟在线推理」。\n\n**其他选项为什么错：**\n- B. 恰是 Serverless 的适用场景：间歇流量、开发测试、缩到零省钱。\n- D. 正是教材标注的适用场景——间歇/不可预测流量加小模型。\n\n**关键概念：** Serverless 三适用（间歇流量、开发测试、小模型）对三不适用（大模型、硬延迟、高频常驻）。做题先看模型大小和延迟要求这两个「一票否决」项。","s":"自编·3.1.1"},{"id":"D3-005","d":3,"t":"single","q":"一个 SaaS 服务为 400 个客户各定制了一个小分类模型（每个约 30MB），初期为每个客户开独立端点导致成本极高。迁移到共享端点后，出现「个别客户模型加载把内存打满，其他客户的模型 OOM」。按教材的思路，最终应该采用什么方案？","o":[{"l":"A","t":"全部改回每客户一个独立端点"},{"l":"B","t":"把所有模型合并成一个更大的模型统一服务"},{"l":"C","t":"限制每个客户每天只能调用 100 次"},{"l":"D","t":"按流量分层：前 20 大客户用推理组件（独立扩缩、互不影响），其余 380 个小客户继续用多模型端点共享"}],"a":["D"],"e":"**正确答案：D。** 混合方案：推理组件管大客户，多模型端点管长尾。\n\n**为什么对：** 教材教学案例与本题几乎逐字对应，结论是**「混合方案才是这类题的标准答案」**。多模型端点（MME）共享实例、隔离弱，个别模型加载会挤占内存；推理组件（Inference Components）每个组件有独立实例与独立扩缩策略，隔离强。流量差异大的头部客户单独隔离，长尾小模型继续摊薄成本，两头兼顾。\n\n**其他选项为什么错：**\n- A. 回到 400 个端点，成本问题原样复现。\n- B. 客户各自定制模型无法合并成一个模型，且丧失个性化能力。\n- C. 限流治标不治本——内存互相挤占的故障机制还在，只是降低了触发概率。\n\n**关键概念：** 三种多模型方案的判断链：依赖冲突→多容器端点；流量均匀且都小→MME（最省钱）；流量差异大→推理组件。真实系统常按流量分层混用。","s":"自编·3.1.2"},{"id":"D3-006","d":3,"t":"single","q":"一个端点上要同时服务两个模型：一个基于 PyTorch 2.1，一个基于某旧框架，两者的依赖库版本冲突，无法装进同一个容器。应该选哪种部署组织方式？","o":[{"l":"A","t":"多容器端点（MNC）：一个实例上跑多个独立容器"},{"l":"B","t":"多模型端点（MME）"},{"l":"C","t":"推理组件"},{"l":"D","t":"把两个模型串行放在同一个容器里，启动时切换环境"}],"a":["A"],"e":"**正确答案：A。** 多容器端点。\n\n**为什么对：** 教材的判断规则第一问就是「模型之间依赖冲突（不同框架版本）？是→多容器端点」。MNC 让每个容器保有自己独立的依赖环境（进程级隔离），天然解决「装不到一个容器里」的问题；实例级共享仍能摊薄成本。\n\n**其他选项为什么错：**\n- B. MME 是一个容器内动态加载多个模型，共享同一套依赖环境——依赖冲突的模型根本放不进去。\n- C. 推理组件解决的是「流量差异大需要独立扩缩」，本题主因是依赖冲突而非流量差异；且组件同容器化前提同样受依赖约束。\n- D. 同一容器内切换环境不可靠（库加载冲突在进程内无法根治），属于把问题藏起来。\n\n**关键概念：** 三方案的分工：MME 治「多而小且均匀」、MNC 治「依赖冲突」、推理组件治「流量差异大」。先排除法答第一问（有没有冲突），再看流量分布。","s":"自编·3.1.2"},{"id":"D3-007","d":3,"t":"single","q":"团队在 Amazon Bedrock 上接入了多个基础模型，希望「不同业务任务自动分流到不同模型」。有成员提议「在 Bedrock 上为每个模型配置独立的推理端点，再配置端点级路由」。这个提议错在哪里？","o":[{"l":"A","t":"Bedrock 的模型不能跨区域调用"},{"l":"B","t":"Bedrock 不做多模型同端点，分流应在应用层实现（或用 Agent/Flows 编排），而不是端点配置"},{"l":"C","t":"Bedrock 只支持一个模型，无法接入多个"},{"l":"D","t":"端点级路由必须额外购买预置吞吐才能开启"}],"a":["B"],"e":"**正确答案：B。** Bedrock 的分流在应用层，不在端点层。\n\n**为什么对：** 教材 3.1.2 末段明确：「Bedrock 不做多模型同端点，而是通过应用层路由把请求分给不同模型。所以问『如何在 Bedrock 上实现按任务分流』，答案是应用层（或 Agent/Flows 编排），不是端点配置」。Bedrock 通过统一 API 按 model ID 调用不同模型，「端点」这个 SageMak
