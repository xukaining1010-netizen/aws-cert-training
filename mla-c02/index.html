<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>学习材料</title>
<style>
/* ===== 页面结构：首页目录 + 章级分页 SPA（非单一长页） ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;font-size:17px;line-height:1.7}
.wrap{max-width:1200px;margin:0 auto;padding:24px 28px 60px}
@media(max-width:768px){.wrap{padding:16px 14px 48px}}

/* ===== 首页 ===== */
.hdr{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:12px;padding:30px 32px 26px;margin-bottom:18px}
.hdr-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:3px 12px;border-radius:20px;margin-bottom:10px}
.hdr h1{font-size:24px;font-weight:800;line-height:1.4}
.hdr-sub{font-size:13px;opacity:.9;margin-top:8px}
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.ov-item{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.ov-num{font-size:28px;font-weight:800;color:#4f46e5;line-height:1.2}
.ov-lbl{font-size:12px;color:#64748b;margin-top:4px}
@media(max-width:768px){.ov{grid-template-columns:repeat(2,1fr)}}

.card-s{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.cs-title{font-size:18px;font-weight:700;color:#374151;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}

/* 章节目录卡 */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ch-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 16px;cursor:pointer;transition:.2s;margin-bottom:0}
.ch-card:hover{border-color:#7c3aed;transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,70,229,.12)}
.ch-card.done{border-color:#16a34a}
.cc-num{font-size:11px;font-weight:700;margin-bottom:3px}
.cc-title{font-size:15px;font-weight:700;color:#1e293b;margin-bottom:6px}
.cc-meta{font-size:13px;color:#64748b}
.cc-prog{margin-top:8px}
.pm{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:3px}
.pbar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .4s}

/* 考试速览 */
.exam-quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.eq-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 10px;text-align:center}
.eq-num{font-size:20px;font-weight:800;color:#4f46e5;line-height:1.2}
.eq-sub{font-size:10.5px;color:#64748b;margin-top:2px}
.eq-lbl{font-size:11px;color:#64748b;margin-top:5px}
.exam-two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:10px}
@media(max-width:768px){.exam-two-col{grid-template-columns:1fr}}
.exam-sub-t{font-size:14px;font-weight:700;color:#374151;margin:4px 0 10px}
.exam-domain-tbl{width:100%;border-collapse:collapse;font-size:15px}
.exam-domain-tbl th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;padding:9px 12px;text-align:left;font-weight:700}
.exam-domain-tbl td{padding:9px 12px;border-bottom:1px solid #e9d5ff;vertical-align:middle}
.exam-domain-tbl tr:nth-child(even) td{background:#faf5ff}
.domain-chip{display:inline-block;border-radius:20px;padding:2px 11px;font-size:12px;font-weight:700;background:#ede9fe;color:#5b21b6;cursor:pointer;border:none;transition:.15s}
.domain-chip:hover{background:#ddd6fe}
.exam-info-list{font-size:15px;color:#374151;margin:0 0 12px 18px}
.exam-info-list li{margin-bottom:6px;line-height:1.7}
.exam-steps{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px;font-size:14px}
.step-block{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;padding:9px 12px;font-size:13px;color:#4338ca;flex:1 1 150px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.step-block b{display:block;font-size:13px}
.step-block span{display:block;font-size:11.5px;color:#6d28d9;margin-top:3px}
.step-arrow{color:#a78bfa;font-weight:700;font-size:16px;padding:0 4px;flex:0 0 auto;align-self:center}
details.exam-faq{margin-top:12px;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;background:#f8fafc}
details.exam-faq summary{font-size:14px;font-weight:700;color:#374151;cursor:pointer}
details.exam-faq p{margin:9px 0 0;font-size:14px;color:#475569;line-height:1.75}

/* 14 天计划 */
.ptbl{width:100%;border-collapse:collapse;font-size:15px}
.ptbl th{background:#f8fafc;padding:11px 12px;text-align:left;font-weight:600;color:#374151;border-bottom:2px solid #e2e8f0;font-size:14px}
.ptbl td{padding:10px 12px;border-bottom:1px solid #f8fafc;vertical-align:middle}
.ptbl tr:last-child td{border-bottom:none}
.day{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.chip-p{background:#ede9fe;color:#5b21b6}.chip-p:hover{background:#ddd6fe}
.focus{font-size:12px;color:#64748b}

/* ===== 章面板 ===== */
.ch-topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);padding:8px 18px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px}
.back-btn{background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:13px;font-weight:600;border-radius:8px;padding:5px 14px;cursor:pointer;white-space:nowrap;transition:.15s}
.back-btn:hover{background:#ede9fe}
.tn-title{font-size:15px;font-weight:700;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-hdr{color:#fff;padding:20px 22px 16px;border-radius:12px 12px 0 0;margin-bottom:0}
.ch-badge{font-size:13px;font-weight:700;opacity:.9;margin-bottom:5px;display:block}
.ch-title{font-size:22px;font-weight:800}
.panel{margin-bottom:14px}
.task-list{padding-left:22px;font-size:16px;color:#374151;line-height:2.0}
.task-list li::marker{color:#a78bfa}
.task-list a{color:#374151;text-decoration:none}
.task-list a:hover{color:#4f46e5}
.tl-id{display:inline-block;min-width:38px;font-weight:700;color:#4f46e5;margin-right:6px}
.panel-hr{border:none;border-top:1px solid #e2e8f0;margin:14px 0}

/* ===== 正文排版（规范 B） ===== */
.mdbody .sec-block h2.mh2{font-size:19px;font-weight:700;color:#4f46e5;margin:4px 0 12px;padding:10px 0 8px;border-top:1px solid #e2e8f0}
.mdbody p{font-size:17px;color:#374151;margin-bottom:14px;line-height:1.9}
.mdbody ul,.mdbody ol{font-size:17px;color:#374151;padding-left:24px;margin-bottom:12px}
.mdbody li{margin-bottom:8px;line-height:1.9}
.mdbody blockquote{border-left:3px solid #a78bfa;padding:10px 16px;background:#f5f3ff;font-size:15px;color:#5b21b6;margin:0 0 14px;border-radius:0 6px 6px 0;line-height:1.8}
.mdbody code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.mdbody h4.sec-h{font-size:17px;font-weight:600;color:#374151;margin:24px 0 10px;padding-left:12px;border-left:3px solid #a78bfa;line-height:1.4}
.mdbody .case-card,.mdbody .mem-card{border-radius:10px;padding:13px 16px;margin-bottom:14px}
.mdbody .case-card{background:#fff8e6;border:1px solid #ecd9a0}
.mdbody .mem-card{background:#eef3ff;border:1px solid #b9c9f7}
.mdbody .case-card h4.sec-h,.mdbody .mem-card h4.sec-h{border-left:none;padding-left:0;margin:0 0 8px;font-size:14px;font-weight:700}
.mdbody .case-card h4.sec-h{color:#9a7b1e}
.mdbody .mem-card h4.sec-h{color:#4361ee}
.mdbody .case-card p,.mdbody .mem-card p{font-size:15px}
.mdbody .case-card ul,.mdbody .mem-card ul{margin-bottom:0;font-size:15px}
/* 表格（规范 C） */
.tbl-wrap{overflow-x:auto;margin:0 0 14px;border:1px solid #e9d5ff;border-radius:10px}
.tbl-wrap table{min-width:480px}
table{border-collapse:collapse;width:100%;font-size:16px}
.mdbody th,.mdbody td{padding:11px 16px;text-align:left;border-bottom:1px solid #e9d5ff;vertical-align:top;line-height:1.6}
.mdbody thead th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;font-weight:700;font-size:15px;white-space:nowrap}
.mdbody tbody tr:nth-child(even) td{background:#faf5ff}
.mdbody tbody tr:last-child td{border-bottom:none}
/* 图块（v2.1 图文同流） */
.fig-block{background:#f8f7ff;border:1px solid #ddd6fe;border-radius:12px;padding:14px 16px;margin:0 0 14px}
.fig-placeholder{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fbfafd;border:1.6px dashed #c4b5fd;border-radius:12px;padding:12px 16px;margin:0 0 14px}
.fig-img{background:#f8f7ff;border:1px solid #ddd6fe;border-radius:12px;padding:10px 12px;margin:0 0 14px;text-align:center}
.fig-img img{max-width:100%;height:auto;border-radius:8px}
.fig-img figcaption{font-size:12px;color:#64748b;margin-top:6px;line-height:1.5}
.mdbody .inline-img{max-width:100%;height:auto;vertical-align:middle;border-radius:6px;margin:0 2px}
.mdbody .img-bad{display:inline-block;background:#fef2f2;border:1px dashed #ef4444;color:#b91c1c;font-size:13px;padding:1px 8px;border-radius:6px}
.fig-placeholder .fp-num{background:#7c3aed;color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.fig-placeholder .fp-type{background:#ede9fe;color:#6d28d9;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.fig-placeholder .fp-alt{color:#334155;font-size:14px;flex:1 1 auto;min-width:120px}
.fig-placeholder .fp-note{color:#94a3b8;font-size:12px;white-space:nowrap;border:1px dashed #cbd5e1;border-radius:6px;padding:2px 8px}
.fig-title{font-size:13px;font-weight:700;color:#4f46e5;text-align:center;margin-bottom:10px}
.fig-body{overflow-x:auto}
.fig-body svg{display:block;margin:0 auto;height:auto}
.fig-caption{font-size:12px;color:#6b7280;text-align:center;margin-top:10px;font-style:italic}
/* 手绘图 CSS 类（兼容） */
.compare-tbl{width:100%;border-collapse:collapse;font-size:13px}
.compare-tbl th{padding:9px 12px;font-weight:700;font-size:12px;text-align:center}
.compare-tbl td{padding:8px 12px;border:1px solid #e2e8f0;font-size:13px;vertical-align:top;line-height:1.5}
.compare-tbl tr:nth-child(even) td{background:#faf9ff}
.flow-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.flow-node{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;text-align:center;min-width:80px}
.flow-node.light{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#4338ca}
.flow-node.green{background:linear-gradient(135deg,#06d6a0,#059669);color:#fff}
.flow-arrow{color:#a78bfa;font-size:18px;font-weight:700;flex-shrink:0}
.cycle-wrap{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.cycle-step{display:flex;flex-direction:column;align-items:center;gap:4px}
.cycle-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.cycle-label{font-size:11px;color:#374151;text-align:center;max-width:70px;line-height:1.3}
.cycle-arrow{color:#a78bfa;font-size:16px;align-self:flex-start;margin-top:6px}
.stair-wrap{display:flex;align-items:flex-end;gap:8px;padding:8px 0;justify-content:center;flex-wrap:wrap}
.stair-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.stair-bar{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:6px 6px 0 0;width:80px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;padding:4px}
.stair-label{font-size:11px;color:#374151;text-align:center;max-width:80px;line-height:1.3}

/* 域尾提示卡 */
.tips-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tips-card .tc-title{font-size:15px;font-weight:700;margin-bottom:10px;color:#374151}
.tips-card table{font-size:14px}
.tips-card th{padding:9px 12px;font-size:13px}
.tips-card td{padding:9px 12px;font-size:14px;line-height:1.6}

/* ===== 章末练习 quiz-box（模块 10） ===== */
.quiz-box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:18px 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);scroll-margin-top:78px}
.quiz-hdr{display:flex;align-items:baseline;gap:14px;font-size:18px;font-weight:700;color:#374151;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}
.quiz-score{font-size:14px;font-weight:700;color:#4f46e5;margin-left:auto;white-space:nowrap}
.qi{border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.qi.done{background:#fafafa}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qbadge{background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:700}
.qtype{font-size:11px;border-radius:12px;padding:1px 9px;font-weight:600}
.qtype-s{background:#e0f2fe;color:#0369a1}
.qtype-m{background:#fce7f3;color:#be185d}
.qstem{font-size:16px;color:#1e293b;margin-bottom:10px;line-height:1.8}
.qstem code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{background:#fff;border:1.5px solid #e2e8f0;border-radius:9px;padding:11px 14px;font-size:15.5px;color:#374151;cursor:pointer;transition:.15s;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:#a78bfa}
.opt .ol{font-weight:700;color:#4f46e5;flex-shrink:0}
.opt.sel{border-color:#4f46e5;background:#ede9fe}
.opt.cor{border-color:#16a34a;background:#dcfce7}
.opt.wrg{border-color:#dc2626;background:#fee2e2}
.opt.shc{border-color:#16a34a;background:#f0fdf4}
.qi.done .opt{cursor:default;pointer-events:none}
.qrow{margin-top:10px;display:flex;align-items:center;gap:12px}
.qbtn{background:#4f46e5;color:#fff;font-size:12px;font-weight:600;border:none;border-radius:7px;padding:7px 18px;cursor:pointer;transition:.15s}
.qbtn:hover{background:#4338ca}
.qbtn:disabled{background:#cbd5e1;cursor:default}
.qres{display:none;flex:1;border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.7}
.qres.ok{background:#dcfce7;color:#15803d}
.qres.err{background:#fee2e2;color:#b91c1c}
.qres.na{background:#fef3c7;color:#b45309}
.qres.show{display:block}
/* 长串防溢出：overflow-wrap:anywhere 仅在 token 放不下时词内断行，普通文本断词行为不变；
   根治 SCP JSON/ARN 等不可断长串撑破移动端面板（SAP-C02 实测 sw=448→390） */
.mdbody,.quiz-box,.qi,.qstem,.opts,.opt{overflow-wrap:anywhere}
.qstem code,.opt code{white-space:pre-wrap;word-break:break-all}
.score-box{display:none;text-align:center;background:#f5f3ff;border-radius:10px;padding:22px 16px;margin-top:16px}
.score-box.show{display:block}
.score-num{font-size:32px;font-weight:700;color:#4f46e5;line-height:1.3}
.score-lbl{font-size:13px;color:#6d28d9;margin-top:4px}
.score-box .sb-tip{font-size:12px;color:#64748b;margin-top:8px;line-height:1.7}

.footer{margin-top:26px;padding:18px 10px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:12.5px;text-align:center;line-height:1.9}
.footer a{color:#4f46e5;text-decoration:none}
@media(max-width:768px){.ptbl th,.ptbl td{font-size:13px}.mdbody th,.mdbody td{font-size:13px}}

/* ===== 章面板 v6 布局：左侧常驻目录槽 + 正文列 =====
   三条布局约定：① 正文 #### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点，见下方 .mh3）
   ② 左侧目录两级（节 ▸ 知识点，单开手风琴 + 滚动自动跟读）③ 左右两侧任何分辨率留白，目录常驻不遮正文：
   ≥1200px：.panel 栅格 [236px 目录槽 | 正文列]，目录 sticky 常驻；<1200px：目录槽变左侧抽屉（☰+遮罩）。 */
body.chapView .wrap{max-width:1420px}
.panel{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start;margin-bottom:14px}
.ch-side{position:sticky;top:14px;min-width:0;z-index:30}
.side-close{display:none}
.toc-open-btn{display:none}
.side-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:85;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.side-mask.show{opacity:1;visibility:visible}
.ch-toc{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 6px 24px rgba(15,23,42,.06);overflow:hidden}
.ch-toc .toc-hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;border-bottom:1px solid #f1f5f9}
.ch-toc .th-title{font-size:13px;font-weight:800;color:#4f46e5;white-space:nowrap}
.ch-toc .th-meta{font-size:11px;color:#94a3b8;font-weight:600;white-space:nowrap}
.ch-toc .toc-body{max-height:calc(100vh - 46px);overflow-y:auto;padding:8px}
.toc-list{list-style:none;margin:0;padding:0}
.toc-list a{display:flex;align-items:baseline;gap:6px;padding:5px 6px;border-radius:7px;color:#475569;text-decoration:none;line-height:1.45;font-size:13px;transition:.12s}
.toc-list a:hover{background:#f5f3ff;color:#4f46e5}
.toc-list a.act{background:#ede9fe;color:#3730a3;font-weight:600}
.toc-list .tl-id{font-size:11.5px;font-weight:700;color:#a78bfa;flex-shrink:0;font-variant-numeric:tabular-nums}
.toc-list a.act .tl-id{color:#4f46e5}
.toc-t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toc-sec>a.toc-sec-link{font-weight:600;color:#334155;padding-top:6px;padding-bottom:6px}
.toc-sec>a .toc-ar{margin-left:auto;flex-shrink:0;font-size:9px;color:#94a3b8;transition:transform .18s}
.toc-sec.open>a .toc-ar{transform:rotate(90deg);color:#4f46e5}
.toc-sub{list-style:none;margin:0;padding:0 0 3px;display:none}
.toc-sec.open>.toc-sub{display:block}
.toc-sub a{padding:3px 6px 3px 20px;font-size:12.5px;color:#64748b;line-height:1.4}
.toc-sub a .tl-id{font-size:11px;color:#c4b5fd}
/* 目录尾【本章练习】入口（v6.2 新增）：独立条目，虚线分隔，点击滚到章末练习区 #quiz-dX */
.toc-quiz{margin-top:7px;padding-top:3px;border-top:1px dashed #ddd6fe}
.toc-quiz>a.toc-quiz-link{font-weight:700;color:#6d28d9;padding-top:6px;padding-bottom:6px}

// 题库数据注入区（构建系统自动注入，含考试元信息与题目全集，勿手改）
const QUIZ_META = {"exam":"MLA-C02","title":"AWS Certified Machine Learning Engineer - Associate 题库","lang":"zh","updated":"2026-11-03","domains":{"1":"面向 ML 与 AI 的数据准备","2":"模型与基础模型开发","3":"部署与工作流编排","4":"运维、监控与安全"},"weights":{"1":"28%","2":"24%","3":"24%","4":"24%"},"examParams":{"count":65,"minutes":130,"pass":720},"footerNote":"题库来源：按 AWS MLA-C02 官方考纲自建命题，共 380 题；以 AWS 官方文档与考试指南为准；Domain 按官方考纲划分","version":"v0.19（题库 380 题 · 分批建设中）","practiceNote":"练习模式已剔除 65 题模考池，可练 315 题"};
const QUIZ_QUESTIONS = [{"id":"D1-001","d":1,"t":"single","q":"一支 12 人的 ML 团队要在 8 台 GPU 实例上训练一个 40TB 的图像数据集。每个 epoch 需要 8 个节点并发、顺序地读完所有样本，训练结束后数据集可以从 S3 重新生成。最合适的存储方案是什么？","o":[{"l":"A","t":"创建 Amazon FSx for Lustre 文件系统并关联 S3 桶，训练集群挂载该文件系统"},{"l":"B","t":"把 40TB 数据放在 Amazon EFS 标准存储类，8 个节点同时挂载读取"},{"l":"C","t":"把 40TB 数据分别复制到 8 台实例各自的 Amazon EBS gp3 卷上"},{"l":"D","t":"数据只留在 Amazon S3，训练时对每个样本单独发起 GET 请求"}],"a":["A"],"e":"**正确答案：A。** 用 Amazon FSx for Lustre 挂到训练集群，创建时关联 S3 桶作为持久层。\n\n**为什么对：** 题干三个约束——40TB、多节点并发顺序读、数据可重新生成。Lustre 是并行文件系统，聚合吞吐随节点线性扩展，多 GPU 节点并发读不互相拖慢；关联 S3 后热数据按需拉入，训练完可删文件系统，只留 S3 存储费，不为 40TB 长期付两份钱。\n\n**其他选项为什么错：**\n- B. EFS 通用型吞吐受规格约束，40TB 级训练读带宽通常不够，标准存储类单价远高于 S3。\n- C. EBS 只能挂一台实例，8 台各存一份等于 320TB 冗余，成本与同步都不可行。\n- D. 海量小文件逐个 GET，延迟与请求成本压垮吞吐，且无 POSIX 语义，多数训练框架读不了。\n\n**关键概念：** 训练瓶颈常在存储带宽不在 GPU。判断顺序：数据可再生（→Lustre 缓存 + S3 持久）；并发顺序读（→并行文件系统）；跨实例共享（→排除 EBS）。","s":"自编·1.1.2"},{"id":"D1-002","d":1,"t":"single","q":"公司机房有一台 NFS 服务器，存了 20TB 历史实验数据，需要一次性搬到 S3，之后每周再做一次增量同步。机房出口带宽只有 200Mbps，要求传输过程可校验、保留文件元数据、并能限制占用带宽。应选哪个服务？","o":[{"l":"A","t":"订购 AWS Snowball Edge 设备，把 20TB 拷进设备后寄回 AWS"},{"l":"B","t":"AWS DataSync，配置从 NFS 到 S3 的任务，启用校验、元数据保留和带宽限速"},{"l":"C","t":"部署 Amazon S3 File Gateway，通过文件网关长期挂载写入"},{"l":"D","t":"用 S3 跨区域复制（CRR）把数据同步到目标桶"}],"a":["B"],"e":"**正确答案：B。** 用 AWS DataSync 建一条本地 NFS 到 S3 的任务，开启完整性校验、元数据保留与带宽限速。\n\n**为什么对：** 题干五项要求——全量加每周增量、可校验、保留元数据、限速——正是 DataSync 标准能力：按文件清单做增量比对只搬变更；传输做校验和；保留属主与时间戳；任务可设带宽上限；定时计划触发每周增量，不用另写脚本。\n\n**其他选项为什么错：**\n- A. Snowball 适合带宽完全不够或 PB 级一次性搬迁。20TB 走 200Mbps 约两三天，用设备反而要等寄送与导入周期，且解决不了每周增量。\n- C. 文件网关给「本地应用持续低延迟访问 S3」的混合场景，长期挂载持续产生网关费用，本需求不需要常驻缓存层。\n- D. CRR 是 S3 桶到桶复制，源端不在 S3，用不上。\n\n**关键概念：** 迁移题先问三件事：数据量、可用带宽、搬一次还是持续同步。一次性且带宽够 → DataSync；带宽不够或量极大 → Snowball；本地应用要持续访问云上 → 网关。","s":"自编·1.1.1"},{"id":"D1-003","d":1,"t":"single","q":"一个风控平台每秒收到 5 万条交易事件，需要对每条卡号做 5 分钟滚动窗口的聚合（笔数、金额方差），把结果写入 S3 供后续训练使用，要求端到端延迟在一分钟以内，且团队不想自己运维 Kafka 集群。最合适的组合是？","o":[{"l":"A","t":"Amazon SQS 队列 + AWS Lambda 消费并聚合，结果写 S3"},{"l":"B","t":"自建 Amazon MSK 集群 + 自研消费者程序做聚合，结果写 S3"},{"l":"C","t":"Amazon Kinesis Data Streams + Managed Service for Apache Flink 做窗口聚合，结果写 S3"},{"l":"D","t":"Amazon EventBridge + AWS Step Functions 编排聚合任务"}],"a":["C"],"e":"**正确答案：C。** Kinesis Data Streams 承接高吞吐事件流，Managed Service for Apache Flink 做有状态滚动窗口聚合，再写入 S3。\n\n**为什么对：** 每秒 5 万条、按卡号做 5 分钟窗口，本质是「有状态流处理」：窗口内按 key 维护累计值和方差。Flink 原生支持事件时间窗口、状态存储与检查点恢复；Kinesis Data Streams 按分片扩容，5 万条/秒按官方换算取数十个分片。整套组合全托管，无需运维 Kafka。\n\n**其他选项为什么错：**\n- A. SQS 无序、无窗口语义，Lambda 无状态且执行时长有限，做 5 分钟窗口要外挂状态存储，端到端延迟也压不到一分钟。\n- B. MSK 扛得住这个量，但要自管 broker、分区、扩容升级，与「不想运维 Kafka」直接冲突。\n- D. EventBridge 与 Step Functions 面向事件路由与流程编排，不是高吞吐数据面。\n\n**关键概念：** 见「窗口/按 key 累计/有状态」就排除无状态函数计算；见「不想运维」就排除自建集群。流处理题三问：是否有状态、是否要事件时间、吞吐折多少分片。","s":"自编·1.1.4"},{"id":"D1-004","d":1,"t":"single","q":"数据湖里有 500TB 训练数据，以 CSV 格式按天存放在 S3，字段约 120 列。分析师和训练作业每次只用到其中 8 列，并常按日期范围过滤。查询扫描量极大、成本持续上升。最有效的改造是什么？","o":[{"l":"A","t":"把 CSV 全部 gzip 压缩，保持单文件整体读取"},{"l":"B","t":"改用 Avro 格式，把 schema 内嵌进每个文件"},{"l":"C","t":"把文件切得更小，让每次查询只读一个文件"},{"l":"D","t":"转换为 Parquet 列式格式，并按日期分区存储"}],"a":["D"],"e":"**正确答案：D。** 转成 Parquet 列式存储，并按日期做分区。\n\n**为什么对：** 两个优化各自解决一个浪费。列式格式只读被引用的列——120 列取 8 列，扫描量理论上降到约十五分之一；分区让按日期过滤时直接跳过无关分区，连文件列表都不用扫。两者叠加，扫描量能从 500TB 级别降到几十 GB 量级。Parquet 还带统计信息，支持谓词下推，进一步减少实际读取的页。\n\n**其他选项为什么错：**\n- A. gzip 压缩整文件确实省存储，但 CSV 是行式存储，读 8 列仍要把 120 列全部解压出来，解决不了列裁剪。\n- B. Avro 是行式存储，优势在写入与 schema 演进，不擅长“读少数列”的扫描型分析。\n- C. 文件切小能让并行度更高，但每列仍全读，扫描量不变，文件数变多还会增加元数据压力。\n\n**关键概念：** 数据湖成本题只有三把刀——列裁剪（格式）、分区裁剪（布局）、压缩编码。列式 + 分区是标准答案；行式格式换行式格式不解决问题。","s":"自编·1.1.5"},{"id":"D1-005","d":1,"t":"single","q":"要为商品搜索加语义检索，预计 1 年后约 2000 万条向量。业务要求同时保留关键词（BM25）匹配与向量相似度，并做混合排序；团队已有 OpenSearch 使用经验，但没有专职运维能承担集群调优。最合适的选择是？","o":[{"l":"A","t":"Amazon OpenSearch Serverless 的向量引擎"},{"l":"B","t":"Amazon Aurora PostgreSQL + pgvector 扩展"},{"l":"C","t":"Amazon Neptune Analytics 图数据库"},{"l":"D","t":"Amazon MemoryDB for Redis 存向量并做近邻检索"}],"a":["A"],"e":"**正确答案：A。** 用 Amazon OpenSearch Serverless 的向量引擎承载向量与关键词混合检索。\n\n**为什么对：** 三个硬条件：混合检索（BM25 + 向量同一引擎内打分）、2000 万条量级、不想运维集群。OpenSearch 本身同时支持倒排索引与 k-NN 向量检索，能在一次查询里做混合打分；Serverless 形态按 OCU 自动伸缩，不用管分片、副本和节点规格，正好抵掉“没有专职运维”。\n\n**其他选项为什么错：**\n- B. pgvector 能存向量也能做近邻，但关键词相关性排序要自己用 SQL 拼，混合打分没有现成语义，2000 万条的索引维护也压在一套数据库上。\n- C. Neptune Analytics 面向图关系与路径分析，不是文本相关性检索的载体。\n- D. MemoryDB 做近邻检索要靠内存型索引，成本随向量数线性上升，且不提供 BM25 文本检索。\n\n**关键概念：** 向量库选型四问：要不要混合检索、量级多大、要不要事务一致、有没有运维能力。混合检索优先选同时具备倒排 + 向量的引擎。","s":"自编·1.1.7"},{"id":"D1-006","d":1,"t":"single","q":"一个训练任务向 S3 高并发写入中间结果，近两天频繁出现 503 SlowDown 错误，重试后仍大量失败。对象总量约 300 万，写入集中在少数几个路径前缀下。最先应该做的是什么？","o":[{"l":"A","t":"改用 Amazon EBS 存放中间结果，绕开 S3 限流"},{"l":"B","t":"把写入路径前缀打散，并在客户端启用带抖动的指数退避重试"},{"l":"C","t":"开启 S3 Transfer Acceleration 提升上传速度"},{"l":"D","t":"把并发写线程数从 64 降到 1"}],"a":["B"],"e":"**正确答案：B。** 打散对象键前缀，客户端改用带随机抖动的指数退避。\n\n**为什么对：** 503 SlowDown 是 S3 在说「这个前缀的请求速率过快」。S3 按前缀分区承载请求，写入集中在少数前缀时，总量不大也会撞单分区速率上限。前缀随机化（如加哈希目录层）把流量摊到更多分区；退避重试吸收瞬时突发，加抖动是避免所有线程同一时刻重试形成新尖峰。\n\n**其他选项为什么错：**\n- A. 中间结果放 EBS 失去共享与持久性，多节点任务无法互读；换存储也不解决「限流后不重试」的根本问题。\n- C. Transfer Acceleration 优化跨地域长距离上传的传输速度，不改变单前缀的请求速率限制。\n- D. 并发降到 1 确实不再撞限流，但 300 万对象串行写入时长不可接受，属于用停摆换错误消失。\n\n**关键概念：** S3 限流先看键分布再看重试策略。标准顺序：打散前缀 → 指数退避加抖动 → 仍不够再引入缓冲层（如 Firehose）削峰。","s":"自编·1.1.3"},{"id":"D1-007","d":1,"t":"single","q":"一个缺陷检测项目有 200 万张工业相机图像，每张图带 30 个元数据字段（批次、工位、拍摄参数、人工判定结果）。训练时需要按任意元数据组合筛选出图片子集，并以高吞吐流式读取。最合适的存储设计是？","o":[{"l":"A","t":"图像与元数据一起写入 S3，用对象标签保存元数据字段"},{"l":"B","t":"图像以 BLOB 形式存入 Amazon RDS，元数据做成表字段"},{"l":"C","t":"图像存 S3，元数据入库供筛选，筛选结果生成清单文件驱动训练读取"},{"l":"D","t":"图像与元数据都写进 Amazon DynamoDB，单条记录存二进制图像"}],"a":["C"],"e":"**正确答案：C。** 图像放 S3，元数据进可查询的库（DynamoDB 或 Feature Store），筛选结果落成清单文件（manifest）交给训练作业按清单拉取。\n\n**为什么对：** 这是「双存储分工」的典型场景：像素数据要便宜、大吞吐、不可变，放 S3；元数据要多维组合筛选，放支持索引的库；两者用对象键关联。训练侧不逐条查询，而是一次性把筛选结果落成清单，训练进程按清单流式读 S3，既有高吞吐又不依赖在线查询 QPS。\n\n**其他选项为什么错：**\n- A. S3 对象标签适合生命周期与权限分类，组合筛选与查询能力有限，30 个字段的任意组合筛不动。\n- B. 200 万张图进关系库，备份、扩容、读取吞吐全是瓶颈，成本远高于 S3。\n- D. DynamoDB 单条记录有容量上限，存图像二进制会撞限，吞吐按条目计费。\n\n**关键概念：** 多模态通行做法：大对象进对象存储、小字段进索引、训练靠清单。数据库直接存像素的选项基本可直接排除。","s":"自编·1.1.8"},{"id":"D1-008","d":1,"t":"single","q":"推荐系统要求：训练时用过去 90 天的历史特征值，线上推理时要用毫秒级的最新特征；同时必须保证训练与推理用的是同一套特征定义，避免两边各算一套导致效果漂移。哪个方案最直接地满足这些要求？","o":[{"l":"A","t":"特征计算逻辑各写两份，训练用 Spark 批算，推理用 Lambda 实时算"},{"l":"B","t":"训练与推理都直接查 Amazon RDS 中的原始业务表"},{"l":"C","t":"把 90 天特征导出成 CSV，推理服务加载进内存"},{"l":"D","t":"用 Amazon SageMaker Feature Store 的 Feature Group，一次写入同时提供在线与离线两种读取"}],"a":["D"],"e":"**正确答案：D。** 用 SageMaker Feature Store 的特征组，写一次即同时落到在线存储（低延迟读）与离线存储（历史回溯）。\n\n**为什么对：** 题干点出的是典型的“训练—推理特征不一致”（training-serving skew）。Feature Store 用同一个 Feature Group 作为唯一定义与唯一写入口：在线存储供推理毫秒级取当前值，离线存储以时间戳保存历史，供训练按时间点回溯，天然避免用未来数据训练。定义只有一份，两边算法就不可能漂移。\n\n**其他选项为什么错：**\n- A. 两套代码算同一个特征，正是 skew 的成因；批流两套实现迟早出现口径差异。\n- B. 直接查业务库拿到的是当前状态，没有历史快照，训练无法还原“当时可见”的特征，还会把分析查询压到生产库上。\n- C. 内存里加载 90 天特征无法反映实时变化，也无法按时间点截断，特征会泄漏未来信息。\n\n**关键概念：** 判断特征类题目先问“要不要历史 + 要不要实时”。两者都要，就是 Feature Store；只有历史 → 离线表；只有实时 → 在线 KV。","s":"自编·1.1.9"},{"id":"D1-009","d":1,"t":"single","q":"每天要把 S3 上的用户画像 Parquet（约 2TB）与 Aurora MySQL 里的订单明细合并成一张训练宽表，需要按用户去重、保留每列来源以便追溯，团队没有自建 Hadoop 集群的意愿。最合适的做法是？","o":[{"l":"A","t":"用 AWS Glue 作业（Spark）读取 S3 与 Aurora（JDBC），在作业内关联去重后写回 S3 分区表"},{"l":"B","t":"用 AWS Database Migration Service 把两张表持续同步到同一张宽表"},{"l":"C","t":"自建 Amazon EMR on EC2 集群，手工维护 Hadoop 与 Hive 元数据"},{"l":"D","t":"用 AWS Lambda 逐行处理并写入 S3"}],"a":["A"],"e":"**正确答案：A。** 用 Glue 的 Spark 作业做关联与去重，输出按分区写回 S3。\n\n**为什么对：** 2TB 规模 + 跨源关联 + 去重 + 可追溯，正好落在 Spark 的能力区间。Glue 提供托管的 Spark 运行环境与 Data Catalog，作业里通过 JDBC 读 Aurora、通过 Catalog 读 S3 上的 Parquet，关联结果可按用户分区写回，列来源可以在作业中显式保留为附加列。Glue 的作业书签还能只处理新增数据，第二天起不必全量重算。\n\n**其他选项为什么错：**\n- B. DMS 面向库到库的持续复制，不做跨源关联与去重，也产出不了带来源列的宽表。\n- C. EMR on EC2 能力上够，但要自己维护集群、Hive 元数据和扩缩容，与“不想自建”冲突；若要用 EMR，应选 Serverless 形态。\n- D. Lambda 有执行时长与内存上限，2TB 级关联去重跑不动。\n\n**关键概念：** 数据转换选型按三件事排：数据量（TB 级→分布式）、是否跨源（跨源→需要 JDBC/连接器）、有没有人运维（没有→托管）。DataBrew 做无代码清洗，Wrangler 做特征探索，Processing 做容器化自定义。","s":"自编·1.1.6"},{"id":"D1-010","d":1,"t":"single","q":"业务分析师需要自己清洗一批 CSV 与 Excel 报表：统一日期格式、剔除异常值、统计各列缺失率，然后交给数据团队入库。分析师不会写代码，也不进入 SageMaker Studio。最合适的工具是？","o":[{"l":"A","t":"SageMaker Data Wrangler 的可视化流程"},{"l":"B","t":"AWS Glue DataBrew 的可视化配方"},{"l":"C","t":"SageMaker Processing 里写自定义 Python 脚本"},{"l":"D","t":"Amazon EMR 上的 Spark SQL 作业"}],"a":["B"],"e":"**正确答案：B。** 用 Glue DataBrew 的可视化配方（recipe）做清洗与剖析。\n\n**为什么对：** 题干给了三个限定：不会写代码、不进 SageMaker Studio、以数据剖析和格式清洗为主。DataBrew 面向的正是这类数据分析人员：内置两百多个预构建转换（格式统一、去重、异常值处理、缺失统计），在浏览器里点选即可，配方可保存复用、可挂到 Glue 作业或定时任务上，产物直接进 S3 或 Catalog，随后交给数据团队入库。\n\n**其他选项为什么错：**\n- A. Data Wrangler 也是可视化，但它嵌在 SageMaker Studio 里，定位是 ML 特征探索与导出到训练流程，题干明确不进入 Studio，且本任务不是特征工程。\n- C. Processing 要求写容器或脚本，分析师不具备这个能力。\n- D. EMR 需要写 Spark SQL 并管理集群，同样不满足“不会写代码”。\n\n**关键概念：** 四个数据转换工具的分工要背清楚：DataBrew＝分析师无代码清洗；Data Wrangler＝ML 特征探索；Glue/EMR＝大规模分布式转换；Processing＝自定义容器化逻辑。判断先看“谁来做”，再看“数据多大”。","s":"自编·1.2.1"},{"id":"D1-011","d":1,"t":"single","q":"三个算法团队各自实现了“用户近 30 天活跃度”这个特征，三份代码算出的口径已经不一致，导致多个模型效果对不上。要一次性解决重复建设与口径漂移，最合适的做法是？","o":[{"l":"A","t":"发一份文档，规定统一口径，要求各团队自行修改代码"},{"l":"B","t":"为三个团队各建一套特征表，用调度任务每天对账"},{"l":"C","t":"把特征定义集中到 SageMaker Feature Store 的共享 Feature Group，各团队只读同一份特征"},{"l":"D","t":"把这个特征删掉，改用模型自动学习"}],"a":["C"],"e":"**正确答案：C。** 把特征定义收敛到共享的 Feature Group，各团队从同一份特征读写。\n\n**为什么对：** 口径漂移的根因是「同一语义多份实现」。文档和评审只能约束一时，只要存在第二份代码就一定再次分叉。Feature Store 把特征变成有归属的数据资产：定义、转换逻辑、写入方在一处，消费方只读，改口径必须改特征定义并留版本，下游全部跟着变，不会出现三份不一致的实现。\n\n**其他选项为什么错：**\n- A. 文档不是强制约束，改完仍各自演化，属于把系统问题交给纪律解决。\n- B. 三套表加对账是给漂移打补丁，发现问题时模型已用错数据训练过，三倍存储计算照付。\n- D. 活跃度是强业务信号，删掉让模型自学等于丢掉先验知识，效果通常退化。\n\n**关键概念：** 特征治理的正确姿势永远是「单一写入口 + 多处只读」。见「各团队各自实现」的选项直接排除。","s":"自编·1.2.2"},{"id":"D1-012","d":1,"t":"single","q":"一个信用评分模型的特征“月收入”“账户余额”“历史交易额”都严重右偏（少数极大值），训练使用的是线性回归与浅层神经网络。数据科学家打算先做特征变换。哪一组处理最恰当？","o":[{"l":"A","t":"对所有特征只做 Min-Max 归一化，不做其他处理"},{"l":"B","t":"对所有特征做独热编码"},{"l":"C","t":"删除所有超过三倍标准差的样本，不做变换"},{"l":"D","t":"对所有特征做对数变换，然后标准化"}],"a":["D"],"e":"**正确答案：D。** 对右偏金额类特征先做对数（或 Box-Cox）变换压低长尾，再做标准化。\n\n**为什么对：** 三个特征都是金额型、右偏，模型是线性或神经网络——这两类模型对尺度与分布形状敏感。对数变换把乘性差异变加性，长尾被压缩，极大值不再主导损失；标准化让各特征同一量级，梯度更稳、正则更公平。顺序不能颠倒：先变换改分布形状，再标准化统一尺度。\n\n**其他选项为什么错：**\n- A. Min-Max 只做线性缩放，右偏形状原样保留，极大值仍把其余样本挤进接近 0 的窄区间。\n- B. 独热编码用于类别变量，连续金额做独热会切成上千个稀疏列，信息与维度双输。\n- C. 删极端样本会丢掉真实高收入客户，而这正是要评估的人群；删除也不改变剩余数据偏态。\n\n**关键概念：** 辨析：标准化对树模型几乎无效，对数变换对树模型仍可能有用（它改变分裂点的分布）。线性/神经网络对偏态和尺度都敏感。","s":"自编·1.2.4"},{"id":"D1-013","d":1,"t":"single","q":"语义检索系统上线半年后更换了新版 embedding 模型，只用新模型重算了最近一个月新增文档的向量，历史索引仍保留旧模型向量。上线后检索质量明显下降。根本原因与正确做法是？","o":[{"l":"A","t":"查询向量与文档向量来自不同模型版本，处于不同向量空间，应全量重建索引并锁定模型版本"},{"l":"B","t":"向量维度不匹配导致索引报错，应统一维度后继续增量更新"},{"l":"C","t":"检索阈值设得太高，应下调相似度阈值"},{"l":"D","t":"应改用关键词检索替代向量检索"}],"a":["A"],"e":"**正确答案：A。** 查询用新模型、历史文档用旧模型，两批向量不在同一空间，必须全量重算并锁定版本。\n\n**为什么对：** embedding 输出空间由模型参数决定，版本之间没有可比较的几何关系——同一句话在两版模型里位置差异很大，跨版本余弦相似度是噪声。只更新新增文档，等于索引混着两套坐标系，检索结果自然崩坏。正确做法：把模型版本当索引的一部分，换版本整库重算，版本号写进索引元数据，查询侧与索引侧不一致直接拒答而非给错结果。\n\n**其他选项为什么错：**\n- B. 维度相同不代表空间相同，统一维度只是把错误藏起来。\n- C. 下调阈值让噪声结果更多被召回，问题更严重。\n- D. 换回关键词检索是放弃语义能力，不解决根因。\n\n**关键概念：** 三样东西必须同版本：文档向量、查询向量、索引。这就是「embedding 漂移」，线上要做版本校验与灰度重建（新索引并行建好再切流量）。","s":"自编·1.2.5"},{"id":"D1-014","d":1,"t":"single","q":"要把 200 页的采购合同 PDF 做成 RAG 知识库，合同里有跨页表格和分条款编号，业务要求答案能精确指到“第 X 条”并可点击回原文。最合适的分块与元数据方案是？","o":[{"l":"A","t":"按固定 512 token 无重叠切分，元数据只保留文件名"},{"l":"B","t":"按标题层级与条款结构切分，并保存章节号、条款号与页码作为元数据，相邻块保留适度重叠"},{"l":"C","t":"整篇合同作为一个块直接放进提示词"},{"l":"D","t":"按每页切一块，跨页表格拆分到两页中"}],"a":["B"],"e":"**正确答案：B。** 结构感知分块 + 条款级元数据 + 相邻块重叠。\n\n**为什么对：** 合同的语义单位是「条」和「款」，不是固定长度字串。按标题层级切，块边界与法律语义边界对齐，检出的块本身就是可引用的完整条款；章节号、条款号、页码写进元数据，回答能定位到原页，满足「可点击回原文」；相邻块保留适度重叠，避免定义与例外条款被切断。跨页表格应合并成一块或单独建块，并保留表头。\n\n**其他选项为什么错：**\n- A. 固定长度切分必然切断条款与表格，且只有文件名，无法精确引用到条。\n- C. 200 页整篇塞进提示词会超出上下文预算，成本高且关键信息被稀释，命中率反降。\n- D. 按页切会让跨页表格与跨页条款断裂，答案容易出现「半句话」。\n\n**关键概念：** RAG 分块原则「跟着文档结构走」。块大小、重叠、元数据三者共同决定引用精度。凡「按固定长度切」的选项，在结构化文档场景基本可排除。","s":"自编·1.2.7"},{"id":"D1-015","d":1,"t":"single","q":"用于微调的训练语料中包含大量手机号、身份证号与银行卡号。合规要求：训练环境不得出现可直接识别个人的明文；但数据事故排查时需要能反查到原始记录。最合适的处理方式是？","o":[{"l":"A","t":"用 Amazon Macie 识别出 PII 后，直接删除这些字段"},{"l":"B","t":"用 Amazon Comprehend 检测 PII，然后用 MD5 哈希替换"},{"l":"C","t":"用 Amazon Macie 识别 PII，再用令牌化（tokenization）替换，映射表单独加密保管"},{"l":"D","t":"把语料整体加密后直接用于训练"}],"a":["C"],"e":"**正确答案：C。** 识别与替换分离：Macie 负责发现与分级，令牌化负责替换，映射表单独加密保管。\n\n**为什么对：** 合规要求「训练环境无明文」，业务要求「可反查」，两条同时成立只能靠令牌化——敏感值换成无意义令牌，令牌与真值的映射表加密存放在受控位置，训练环境只拿到令牌。既满足数据最小化，又保留按令牌回查原始记录的能力；Macie 发现 S3 敏感数据并出分级报告，作合规证据。\n\n**其他选项为什么错：**\n- A. 直接删除合规但破坏排查能力，且删除改变数据分布，影响模型对真实输入的适配。\n- B. MD5 不可逆，反查不了；手机号、身份证号空间小，哈希可穷举还原，不构成匿名化。\n- D. 模型无法从密文里学到语言规律，加密后训练不可行。\n\n**关键概念：** 三个词分清：遮蔽（不可逆）、匿名化（不可复原）、伪名化/令牌化（可复原需密钥隔离）。要反查选令牌化；只求合规不求反查才考虑哈希或删除。","s":"自编·1.2.8"},{"id":"D1-016","d":1,"t":"single","q":"为客服场景准备指令微调数据：5 万条多轮对话，每条含用户提问与坐席回答。团队按 8:2 随机切分训练集与验证集，训练后验证集指标很高，上线效果却明显更差。最可能的原因与修法是？","o":[{"l":"A","t":"学习率过高，应降低学习率重训"},{"l":"B","t":"数据量不足，应扩充到 50 万条"},{"l":"C","t":"应把验证集比例调到 5:5"},{"l":"D","t":"同一次会话的多轮样本被随机切到两侧，验证集泄漏；应按会话（或用户）分组切分"}],"a":["D"],"e":"**正确答案：D。** 按会话分组切分，保证同一会话的所有轮次只出现在一侧。\n\n**为什么对：** 多轮对话相邻轮次高度相关，措辞、背景、诉求都共享。按行随机切分会让同一会话第 3 轮进训练集、第 4 轮进验证集，模型等于「见过答案的近亲」，验证指标虚高，线上遇到真正没见过的会话就暴露差距。按会话或用户分组切分能切断相关性，验证集才代表真实泛化能力。\n\n**其他选项为什么错：**\n- A. 学习率影响一条训练曲线，不会造成「验证集高、线上低」的固定偏差模式。\n- B. 数据量能提升上限，但泄漏不修，扩到 50 万条只是把虚高指标算得更稳定。\n- C. 扩大验证集比例不能消除泄漏，只是让被污染部分占比变小。\n\n**关键概念：** 分组泄漏是 NLP 题高频陷阱：样本间存在天然分组（会话、用户、文档）时，必须按组切分，禁按行随机切。","s":"自编·1.2.9"},{"id":"D1-017","d":1,"t":"single","q":"一个已上线的推荐模型效果逐月下滑，怀疑线上输入数据的分布发生了变化。需要在训练数据上建立基线，并对线上请求的输入持续比对。最直接的做法是？","o":[{"l":"A","t":"用 Amazon SageMaker Model Monitor 的数据质量监控，以训练数据生成基线并持续比对"},{"l":"B","t":"用 AWS Glue Data Quality 在 ETL 环节做规则校验"},{"l":"C","t":"每周人工抽样 100 条请求看有没有异常"},{"l":"D","t":"提高模型监控的准确率告警阈值"}],"a":["A"],"e":"**正确答案：A。** 用 SageMaker Model Monitor 数据质量监控：以训练数据统计量生成基线，持续采集线上输入并计算偏离。\n\n**为什么对：** 这是「分布漂移」而非「精度下降」——模型没错，输入变了。Model Monitor 基线来自训练数据，算各特征均值、分位数、缺失率，对线上请求做同样统计，偏离超阈值即告警；也能检测数据质量（类型错误、越界、空值）与模型偏差。它监控数据面，能在精度指标掉下来之前先发信号。\n\n**其他选项为什么错：**\n- B. Glue Data Quality 面向 ETL 管道内的规则校验，不监控线上推理请求，也不与训练基线对比。\n- C. 每周看 100 条，样本量与频率撑不起「逐月下滑」的早期发现，且没有统计判据。\n- D. 准确率告警是结果指标，等它掉下来用户已受影响；调阈值只是让告警更迟钝。\n\n**关键概念：** 监控分三层：数据质量（输入对不对）、模型质量（预测准不准）、偏差与可解释（公不公平）。漂移属第一层，必须在推理链路上采集输入，不能靠离线抽查。","s":"自编·1.3.1"},{"id":"D1-018","d":1,"t":"single","q":"用三年前的简历数据训练筛选模型，评估发现女性候选人通过率显著偏低。数据团队只打算删除“性别”这一列后重训。这个做法的问题是什么？","o":[{"l":"A","t":"没有问题，去掉敏感字段即满足公平性要求"},{"l":"B","t":"代理变量仍会携带性别信息，应先用 SageMaker Clarify 度量偏差，再做前处理（重采样/重加权）并检查代理变量"},{"l":"C","t":"应把女性样本全部加权到与男性相同数量后直接上线"},{"l":"D","t":"偏差来自模型，应换一个更复杂的模型解决"}],"a":["B"],"e":"**正确答案：B。** 先用 Clarify 量化偏差，再处理代理变量与前处理，而非只删敏感列。\n\n**为什么对：** 删除敏感字段叫「看不见」，不叫「不存在」。毕业院校、专业、社团、职业空档期、通勤距离都与性别高度相关，模型可借它们重建性别信息，偏差照旧进入预测。正确路径三步：Clarify 计算 DPDI、CI 等指标定位偏差；检查并处理代理变量；用前处理（重采样、重加权）、训练中约束或后处理（分组阈值）降偏，上线前后持续监控。\n\n**其他选项为什么错：**\n- A. 删列不等于去偏，本题最典型的错误答案。\n- C. 等量重采样不解决代理变量问题，还改变业务真实比例；且不应「直接上线」，必须先验证。\n- D. 更复杂的模型更容易拟合历史偏差，方向相反。\n\n**关键概念：** 偏差三阶段：前处理（改数据分布）、中处理（加约束/正则）、后处理（改判定阈值）。度量工具是 Clarify，指标至少说出两个（DPDI、CI）。","s":"自编·1.3.3"},{"id":"D1-019","d":1,"t":"single","q":"信用卡欺诈检测数据中，欺诈样本仅占 0.3%。模型上线后准确率达到 99.7%，但业务反馈几乎抓不到欺诈。最应该改变的是什么？","o":[{"l":"A","t":"继续优化准确率，把 99.7% 提到 99.9%"},{"l":"B","t":"增加训练轮数让模型收敛更好"},{"l":"C","t":"改用 PR-AUC、召回率与 F1 等指标，并配合类权重或重采样处理不平衡"},{"l":"D","t":"把所有样本都预测为正常，也能获得 99.7% 的准确率，说明指标设置正确，问题在数据采集"}],"a":["C"],"e":"**正确答案：C。** 换掉指标，再改训练策略。\n\n**为什么对：** 0.3% 的正例下，全判为“正常”就能拿 99.7% 的准确率——这正好说明准确率在这个场景里没有信息量。评估要看正例：召回率（抓到多少欺诈）、精确率（报警里有多少是真的）、PR-AUC（不平衡下比 ROC-AUC 更敏感）。指标换了以后，训练侧再配类权重、过采样少数类、欠采样多数类或代价敏感学习，模型才会真正偏向识别少数类。\n\n**其他选项为什么错：**\n- A. 在无信息量的指标上继续优化，等于优化“更会忽略欺诈”。\n- B. 收敛更好只会让模型更坚定地判负，问题更严重。\n- D. 选项自己承认了“全判正常也有 99.7%”，却又说指标设置正确，逻辑自相矛盾；采集不是本轮的瓶颈。\n\n**关键概念：** 不平衡数据的第一原则是“先把指标换掉，再谈算法”。准确率在类别比例悬殊时必然虚高，这是必考判断点。","s":"自编·1.3.5"},{"id":"D1-020","d":1,"t":"single","q":"要给 10 万张工业图像做缺陷分类标注，预算有限，要求标注质量可控、并且不能把图像发到公网众包平台。最合适的方案是？","o":[{"l":"A","t":"用公网众包平台，价格最低且速度快"},{"l":"B","t":"让一名工程师全部手工标注，避免一致性判断分歧"},{"l":"C","t":"先用模型自动标注全部数据，人工不再复核"},{"l":"D","t":"用 Amazon SageMaker Ground Truth 的私有工作组，每条数据多人标注并混入黄金标准题做质检"}],"a":["D"],"e":"**正确答案：D。** Ground Truth + 私有工作组 + 多人标注 + 黄金标准题抽检。\n\n**为什么对：** 三个约束同时满足：数据不出可控范围（私有工作组只邀请内部或签约标注员，图像不进公开众包池）；质量可度量（同一张图多人标注看一致性，混入已知答案的黄金标准题持续测每个标注员准确率，识别敷衍者）；成本可控（自动标注辅助 + 低置信样本才送人工，10 万张大部分用主动学习筛过去）。\n\n**其他选项为什么错：**\n- A. 公网众包直接违反「不能发公网」，且工业缺陷需要领域知识，众包准确率不可接受。\n- B. 单人标注没有一致性检验，10 万张工时不现实，个人疲劳会带来系统性偏差。\n- C. 自动标注不做人工复核，等于把模型现有偏差固化进训练标签，缺陷被「洗白」。\n\n**关键概念：** 标注方案四要素：谁来做（人力来源）、怎么保质量（多人一致性 + 黄金题）、怎么省钱（主动学习/自动标注辅助）、合规边界（数据能否出去）。","s":"自编·1.3.2"},{"id":"D1-021","d":1,"t":"single","q":"某电商平台需要实时统计每个商品近 5 分钟的点击量，并将结果写入 SageMaker Feature Store 供实时推荐使用。数据源是 Kinesis Data Streams。以下哪种服务最适合实现这一窗口聚合？","o":[{"l":"A","t":"Managed Service for Apache Flink，按事件时间做 5 分钟窗口聚合"},{"l":"B","t":"AWS Lambda，逐条处理点击事件并累加计数"},{"l":"C","t":"AWS Glue DataBrew，定时刷新特征表"},{"l":"D","t":"Amazon Textract，抽取点击日志中的关键字段"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 窗口聚合是有状态计算：必须记住「5 分钟内已累计的点击数」，Lambda 无状态、逐条执行，除非借助外部存储否则无法维护窗口状态。Managed Service for Apache Flink 有状态、支持事件时间窗口与精确一次语义，是官方文档中该场景的标准答案。\n\n**其他选项为什么错：**\n- B. 用 Lambda 做窗口聚合是典型错误——无状态是它的硬边界\n- C. DataBrew 是可视化批处理工具，不适合毫秒级流式聚合\n- D. Textract 是文档 OCR 服务，与点击流无关。\n\n**关键概念：** 记忆口诀：逐条无状态选 Lambda，有状态窗口选 Flink 或 Spark Structured Streaming。此外业务窗口应按事件时间算，避免流量起伏导致结果漂移。","s":"自编·1.2.3"},{"id":"D1-022","d":1,"t":"single","q":"流式管道按「事件发生的时间」划分业务窗口，而不是按数据到达管道的时间。这样做的主要原因是：","o":[{"l":"A","t":"事件时间窗口实现更简单，不需要维护任何状态"},{"l":"B","t":"处理时间会因网络延迟与乱序导致窗口归属错误，业务语义失真"},{"l":"C","t":"事件时间窗口不需要处理迟到数据，成本更低"},{"l":"D","t":"处理时间无法与 Kinesis Data Streams 集成"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 用户的点击发生在 11:59:58、到达系统是 12:00:03，它应计入 11:55–12:00 的窗口（事件时间）而不是 12:00–12:05（处理时间）。若按处理时间，高峰期积压的事件会集中涌进同一个窗口，统计结果随流量起伏漂移，业务语义失真。\n\n**其他选项为什么错：**\n- A. 恰好相反：用事件时间必须维护 watermark 等状态机制，实现更复杂\n- C. 错误——事件时间必须处理迟到数据（watermark 机制就是为它设计的）\n- D. 处理时间与集成哪个服务无关，是任何流式框架都支持的时钟语义。\n\n**关键概念：** 事件时间=业务语义，处理时间=系统时钟；选事件时间的代价是必须面对迟到数据。","s":"自编·1.2.3"},{"id":"D1-023","d":1,"t":"single","q":"流式管道采用「至少一次」语义保证，特征写入 Feature Store。为避免故障重放导致特征被重复累加，正确的做法是：","o":[{"l":"A","t":"把管道改为「至多一次」语义，宁可丢数据也不重复"},{"l":"B","t":"在 Lambda 里加一个全局计数器，跳过重复事件"},{"l":"C","t":"按主键幂等覆盖写入，让重放的同一条事件只生效一次"},{"l":"D","t":"不做处理，重放概率极低可以忽略"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 至少一次语义下，故障重放会让同一条事件到达多次。特征写入按主键幂等覆盖（同一主键的新值覆盖旧值，而非追加累加），重放多少次结果都一致，这是工程上的标准解。\n\n**其他选项为什么错：**\n- A. 改为至多一次会丢数据，特征完整性更差\n- B. Lambda 是无状态的，跨条维护全局计数器本身就不可靠（实例并行、生命周期短）\n- D. 重放在流式系统是常态而非异常，忽略它会让特征值随时间持续虚高。\n\n**关键概念：** 语义保证三件套：至少一次→下游幂等；精确一次→实现复杂代价高；特征表的主键覆盖写入是幂等的标准实现。","s":"自编·1.2.3"},{"id":"D1-024","d":1,"t":"multiple","q":"某团队在为一套物联网遥测流（Kinesis Data Streams）设计处理层。以下哪些任务适合交给 AWS Lambda 完成？（选 2 项）","o":[{"l":"A","t":"把摄氏温度字段统一换算为华氏温度"},{"l":"B","t":"计算每台设备过去 10 分钟滑动平均值"},{"l":"C","t":"给每条记录富化上设备的静态档案信息（查一个配置表）"},{"l":"D","t":"对设备会话做流表 join，输出会话级聚合"},{"l":"E","t":"在函数内存里缓存每台设备最近一小时的读数，用于跨记录去重"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** A 字段换算和 C 查表富化都是逐条、无状态、毫秒级完成的转换，正是 Lambda 的能力边界内：启动快、按调用计费、逻辑简单。\n\n**其他选项为什么错：**\n- B. 滑动平均是有状态计算，必须记住每个设备的近期数据窗口，Lambda 做不到（除非借助外部存储，得不偿失）\n- D. 流表 join 同样需要维护状态与窗口语义，应交给 Spark Structured Streaming 或 Managed Service for Apache Flink。\n- E. 把跨记录状态塞进函数内存是经典误用：Lambda 的执行环境用完即弃，并发实例之间内存互不可见，去重状态必须外置（DynamoDB TTL 或 ElastiCache）。\n\n**关键概念：** 判断标准一句话：转换逻辑能不能「看一条、算一条、丢一条」——能则 Lambda，需要记住历史则流式引擎。干扰项的常见伪装是「只是加个平均值」，只要跨条相关就是有状态。","s":"自编·1.2.3"},{"id":"D1-025","d":1,"t":"single","q":"团队要预估一批中文技术文档调用大模型 API 的处理成本。以下哪种估算方式是正确的？","o":[{"l":"A","t":"按文档字数直接乘以每千字单价"},{"l":"B","t":"按文档页数乘以经验系数折算"},{"l":"C","t":"取文档字节数除以 3 作为 token 数"},{"l":"D","t":"先用分词器把文档切成 token，按 token 数估算"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 大模型 API 按 token 计费，而 token 数不等于字数：中文场景下 token 与字的比例随模型词表变化，英文下与词的比例也不同。正确做法是用该模型的分词器（BPE/WordPiece/SentencePiece）实际切分后计数，这是 C02 新增的实务考点。\n\n**其他选项为什么错：**\n- A. 字数≠token 数，中文尤其偏差大\n- B. 页数与内容密度无关，误差不可控\n- C. 「字节÷3」是无依据的经验主义，UTF-8 下汉字占 3 字节但一个 token 可能对应 1~2 个汉字，比例随词表而变。\n\n**关键概念：** 记忆要点：成本必须按 token 算；专业术语被切碎会增加 token 数与语义损失，领域词表正是为此存在。","s":"自编·1.2.6"},{"id":"D1-026","d":1,"t":"single","q":"清洗一批从 PDF 抽取的 HTML 内容用于训练语料。关于去除 HTML/XML 标签，正确的做法是：","o":[{"l":"A","t":"剥离标签时保留段落边界等结构信息，不要把结构一并删掉"},{"l":"B","t":"用正则一键删除所有尖括号内容，越干净越好"},{"l":"C","t":"保留全部标签原样进入模型，让模型自己学会忽略"},{"l":"D","t":"先删除标签，再统一删除所有换行符"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 标签剥离的目标是去掉标记噪声、保留内容结构：段落边界、标题层级是有价值的语义信号，一键去标签会把结构也毁掉，导致句段粘连、语义混乱。\n\n**其他选项为什么错：**\n- B. 正则去标签是典型粗暴做法，表格、嵌套结构会被撕碎\n- C. 保留全部标签让模型「自己学会忽略」会把宝贵的上下文窗口浪费在噪声上\n- D. 删光换行符会毁掉段落边界，与 A 背道而驰。\n\n**关键概念：** 清理顺序有讲究：先统一编码与不可见字符、再剥标签（保结构）、再去页眉页脚与重复行、最后分块。教材案例：300 页手册先清理再分块，token 数少 22%，检索命中率反而提高——噪声少了。","s":"自编·1.2.6"},{"id":"D1-027","d":1,"t":"single","q":"对一个情感分类数据集做数据增强（同义替换、回译）。以下哪条是增强操作必须遵守的红线？","o":[{"l":"A","t":"增强样本数不能超过原始样本数"},{"l":"B","t":"增强后样本的标签必须保持不变"},{"l":"C","t":"增强只能用于文本，不能用于图像"},{"l":"D","t":"增强后必须重新训练整个模型"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 增强的前提是样本语义等价：分类任务里，增强后的样本标签不变这条规则才成立。同义替换、回译都可能悄悄改动语义——尤其是金额、否定词被改动后，样本情感可能翻转，标签却没跟着改，等于给模型喂错误监督信号。\n\n**其他选项为什么错：**\n- A. 增强比例没有这种硬性上限，按需要定\n- C. 增强在图像里同样常用（翻转、裁剪、加噪）\n- D. 增强发生在数据准备阶段，是否重训与增强本身无关。\n\n**关键概念：** 红线记忆：凡增强，必须抽样人工核对；生成任务的改写更要小心，因为改写可能改变正确输出本身。","s":"自编·1.2.6"},{"id":"D1-028","d":1,"t":"single","q":"用「回译」（中译英再译回中文）扩充客服意图分类的训练样本。这种做法的主要风险是：","o":[{"l":"A","t":"回译生成的新样本会带有英文语法错误"},{"l":"B","t":"回译需要调用外部翻译 API，无法在 AWS 内完成"},{"l":"C","t":"回译可能改变句子的关键语义（如金额、否定词），样本标签随之失真"},{"l":"D","t":"回译后的样本长度必然超出模型输入上限"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 回译属于等价性改写，但翻译模型并不保证语义完全保真：「不退货」译回「不用退货」、「满 100 减 20」的金额结构都可能被改写。分类任务里标签不跟着语义变，就产生了带错误标签的样本。教材把「改变语义（金额、否定词被改动）」列为回译的头号风险。\n\n**其他选项为什么错：**\n- A. 语法问题不是主要风险，语义等价性才是\n- B. 翻译可用 Amazon Translate 在 AWS 内完成\n- D. 长度问题可通过截断与分块处理，不是回译特有的风险。\n\n**关键概念：** 三种领域增强的风险对照：同义替换/回译→改语义；模板化改写→学模板不学语义；术语归一→过度归一丢细粒度差异。","s":"自编·1.2.6"},{"id":"D1-029","d":1,"t":"single","q":"多模态数据集（数值+文本+图像）要做偏差度量。针对图像模态，以下哪组指标最合适？","o":[{"l":"A","t":"Cohen's Kappa 一致率与标注一致率"},{"l":"B","t":"词频分布与语言占比"},{"l":"C","t":"分位数分布与群体均值差异"},{"l":"D","t":"亮度与分辨率分布、类别占比、场景标签分布"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 图像模态的偏差典型表现为光照、角度、设备、人群分布不均，以及某类场景样本极少。对应的度量就是亮度与分辨率分布（拍摄条件偏差）、类别占比（类别偏差）、场景标签分布（场景覆盖）。这是 C02 新增技能点 1.3.4 的核心表格。\n\n**其他选项为什么错：**\n- A. 标注一致率是标注质量指标（1.3.2），不是图像分布指标\n- B. 词频与语言占比是文本模态的度量项\n- C. 分位数与群体均值差异是数值模态的度量项。\n\n**关键概念：** 三模态对照记忆：数值看分位数与缺失率、文本看词频与语言覆盖、图像看亮度分辨率与场景占比。先画像再动手，找出长尾在哪个模态。","s":"自编·1.3.4"},{"id":"D1-030","d":1,"t":"single","q":"多模态训练集里图像样本充足，但每个图像对应的文本标注只覆盖了 20% 的样本。团队想先扩图像数量。正确的判断是：","o":[{"l":"A","t":"错误，多模态训练的上限由最稀缺的模态决定，应先补文本标注"},{"l":"B","t":"正确，图像是数据量的主体，先补齐图像"},{"l":"C","t":"错误，应该用生成模型合成带标注的图像样本"},{"l":"D","t":"正确与否取决于模型架构，无法事先判断"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 多模态训练里，配对样本才有用：图像够但对应文本标注少，多出来的图像等于白搭。教材明确「按最弱模态对齐」——最稀缺的那个模态决定上限，补齐短板才是第一优先级。\n\n**其他选项为什么错：**\n- B. 数量主体不等于价值主体，未配对的图像无法参与多模态学习\n- C. 合成数据只能补数量，容易引入生成器自身的偏差，且绕过了「标注缺失」这个真实短板\n- D. 最弱模态决定上限是多模态数据准备的一般原则，不依赖具体架构。\n\n**关键概念：** 补采优先于合成：真实样本分布最可靠；均衡要在「场景×光照」这类交叉维度上做，只按单一维度均衡会制造新偏斜。","s":"自编·1.3.4"},{"id":"D1-031","d":1,"t":"single","q":"某图像分类数据集已做到 10 个类别各 1000 张，类别完全均衡。但训练出的模型在「夜间×雨雪」场景下准确率只有 40%。最可能的原因是：","o":[{"l":"A","t":"模型参数量不够，应换更大的模型"},{"l":"B","t":"类别均衡不等于分布无偏：交叉维度（夜间×雨雪）上的样本严重缺失"},{"l":"C","t":"学习率设置过高，应调低学习率重训"},{"l":"D","t":"准确率 40% 说明标签噪声过大，应全量重标"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 这是 1.3.4 的标志性易错点：把「类别均衡」等同于「分布无偏」。类别维度均衡了，但「夜间」「雨雪」这类拍摄条件维度上样本可能集中在白天晴天，交叉维度（夜间×雨雪）严重缺失，模型没见过这种条件下的目标。正确做法是先画像找出长尾在哪个交叉维度，再做分层补采。\n\n**其他选项为什么错：**\n- A. 换大模型解决不了数据覆盖问题\n- C. 学习率影响的是收敛而非特定场景的能力缺口\n- D. 全场景准确率正常、单一场景差，指向数据分布而非标签质量。\n\n**关键概念：** 记忆：均衡要在关键交叉维度上做，只按单一维度均衡会制造新的偏斜。","s":"自编·1.3.4"},{"id":"D1-032","d":1,"t":"single","q":"校验一批用于微调的 prompt–response 配对数据。以下哪种缺陷是「结构校验」（JSON 合法性、字段非空）查不出来、必须靠语义校验才能发现的？","o":[{"l":"A","t":"response 字段为空字符串"},{"l":"B","t":"缺少 role 标记字段"},{"l":"C","t":"response 内容与 prompt 跑题，答非所问"},{"l":"D","t":"JSON 格式不合法导致解析失败"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 结构校验只能证明「格式成立」：字段在、非空、类型对。而「response 是否在回答 prompt」是语义相关性问题——JSON 完全合法、字段填满，但答案跑题或空洞，结构校验完全无感。语义校验可以用模型打分或相似度评估，再辅以人工抽检。\n\n**其他选项为什么错：**\n- A. 空字符串是结构层缺陷，字段非空检查一眼可查，不需要语义校验。\n- B. 缺 role 标记是结构层缺陷，字段存在性检查即可发现。\n- D. JSON 不合法导致解析失败是结构校验的第一层职责，脚本直接报错。\n\n**关键概念：** 配对校验六项里，配对完整性、格式合规、长度合规属结构侧；语义相关性、重复度、拒答样本属语义与内容侧。只查结构不查语义是 1.3.6 的易错点原文。","s":"自编·1.3.6"},{"id":"D1-033","d":1,"t":"single","q":"关于生成式模型训练数据的内容安全筛查，正确的做法是：","o":[{"l":"A","t":"训练前筛一遍即可，推理侧不需要再拦截"},{"l":"B","t":"只在推理侧用 Guardrails 拦截，训练数据不用筛"},{"l":"C","t":"交给云厂商的安全合规团队统一负责，无需自行筛查"},{"l":"D","t":"训练前筛一遍、推理时再拦一遍，两层都要有"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 教材口径明确：训练前筛一遍（Comprehend 做 PII 与毒性检测）、推理时再拦一遍（Bedrock Guardrails），两层都要有。只靠任何单层都有缺口：训练数据里的有害样本会被模型学成「可接受输出」，推理侧拦截只能挡住一部分，用户换个问法就绕过。\n\n**其他选项为什么错：**\n- A. 推理侧没有拦截，用户诱导或越狱输入时无防线\n- B. 治标不治本，有害内容已进模型权重，事后拦不全\n- C. 数据合规责任在使用方，厂商工具只是手段，责任不能外包。\n\n**关键概念：** 根本解法是「不让它进训练集」；筛查结果要留痕（剔除哪些、原因、比例），否则无法向审计解释数据来源合规性。","s":"自编·1.3.6"},{"id":"D1-034","d":1,"t":"single","q":"为什么训练数据里的有害样本必须在训练前剔除，而不能依赖推理侧的内容过滤补救？最根本的原因是：","o":[{"l":"A","t":"有害样本会进入模型权重，被学成「可接受输出」，事后拦截挡不全"},{"l":"B","t":"推理侧过滤会增加推理延迟，影响用户体验"},{"l":"C","t":"推理侧过滤工具（Guardrails）需要额外付费"},{"l":"D","t":"训练后剔除样本需要重新上传全部数据"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 训练的本质是把数据分布压进模型权重。有害样本一旦进训练集，模型就「学会」这类输出是可接受的；推理侧过滤只是在输出层打补丁，用户换个问法、换个措辞就可能绕过。教材把「不让它进训练集」定义为根本解法。\n\n**其他选项为什么错：**\n- B. 延迟是次要问题，即便过滤零延迟也挡不住模型本身已被污染\n- C. 成本不是根因，免费的自建过滤同样挡不住权重污染\n- D. D 项描述的操作不存在，问题与数据上传无关。\n\n**关键概念：** 一句话记忆：过滤是出口闸门，筛查是入口闸门；入口漏了，出口永远补不齐。筛两类内容：PII 与政策禁止类别，训练前一遍、推理时一遍。","s":"自编·1.3.6"},{"id":"D1-035","d":1,"t":"multiple","q":"对一批微调用的 prompt–response 数据做完整性校验。以下哪些检查项属于「语义与内容侧」（而非纯结构侧）？（选 2 项）","o":[{"l":"A","t":"response 是否真的在回答 prompt（语义相关性）"},{"l":"B","t":"对话模板的 role 标记是否齐全"},{"l":"C","t":"是否存在本应拒答却被给了答案的样本"},{"l":"D","t":"JSON 是否能被正常解析"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** A 语义相关性需要模型打分或人工抽检判断「答案对不对题」；C 拒答与安全拦截判断的是「该不该答」，都属于语义与内容层。这两项正是结构校验的盲区——JSON 合法、字段齐全，但答案是空的、跑题的或本应拒答的，脚本查不出来。\n\n**其他选项为什么错：**\n- B. role 标记齐全与否是格式合规，看字段即可\n- D. JSON 可解析是最基础的结构检查。\n\n**关键概念：** 配对校验六项分层记：结构侧=配对完整性、格式合规、长度合规；语义内容侧=语义相关性、重复度、拒答样本。出题常把两侧混在一组选项里考区分能力。","s":"自编·1.3.6"},{"id":"D1-036","d":1,"t":"single","q":"设备故障预测数据里，「交易金额」类字段出现少量极大值。业务确认这些是真实的大额交易而非录入错误。正确的处理方式是：","o":[{"l":"A","t":"作为离群值删除，避免干扰模型训练"},{"l":"B","t":"保留，并考虑单独建模或分箱处理"},{"l":"C","t":"替换为该字段的均值"},{"l":"D","t":"按 99 分位截断，超出部分统一改为 99 分位值"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 处理离群值的第一步是判断性质：错误值（如年龄 999）修正或置空；真实极端值（如大额交易）不能删——删了模型就学不到极端情况，而这往往正是业务最关心的（欺诈检测、大客户识别）。保留后可单独建模或用分箱让它有独立区间。\n\n**其他选项为什么错：**\n- A. 删除真实极端值等于删掉业务最关心的信号\n- C. 均值替换既扭曲分布又消灭极端信号\n- D. 分位数截断对「错误值」可用，对「真实极端值」同样是抹掉信号。\n\n**关键概念：** 检测方法选型：3σ/IQR 适合近似正态；分位数截断适合分布未知的长尾；孤立森林/DBSCAN 适合多维非线性。检测出异常后先问「错在哪还是真极端」，再动手。","s":"自编·1.3.7"},{"id":"D1-037","d":1,"t":"single","q":"收入调查数据中，高收入人群普遍不愿填写收入字段，缺失率超过 30%。若直接用全体样本的均值填充该字段，最主要的问题是：","o":[{"l":"A","t":"计算均值时样本量太小，均值不稳定"},{"l":"B","t":"均值填充后字段的方差会变大"},{"l":"C","t":"缺失与目标相关（非随机缺失），填充会系统性地扭曲分布"},{"l":"D","t":"均值填充无法通过数据质量门禁的规则检查"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 这是非随机缺失（MNAR）的典型案例：缺失本身携带信息（高收入者不填）。用全体均值填充，等于把缺失人群强行归到平均水平，系统性低估高收入群体的分布，任何依赖该字段的模型都会被带偏。教材强调最重要的一条就是区分随机缺失与非随机缺失。\n\n**其他选项为什么错：**\n- A. 样本量不是根因，30% 缺失下仍有 70% 样本可算\n- B. 均值填充实际会低估方差而非变大\n- D. 质量门禁查的是规则合规，不是统计合理性，这题考的是数据理解。\n\n**关键概念：** 更优做法：保留缺失并加「缺失指示变量」（缺失本身是状态），或按人群分层建模。教学案例：缺失与设备新旧相关，缺失标记+分组中位数填充后偏差收敛。","s":"自编·1.3.7"},{"id":"D1-038","d":1,"t":"single","q":"设备故障数据里「运行时长」字段缺失 12%，且老设备普遍不上报（缺失与设备新旧相关）。以下哪种填充策略最合理？","o":[{"l":"A","t":"全体样本统一用均值填充"},{"l":"B","t":"直接删除所有含缺失的行"},{"l":"C","t":"用 0 填充缺失值，表示没有运行"},{"l":"D","t":"增加「是否缺失」指示变量，并按设备类型分组用中位数填充"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 教材案例的原型解法：缺失与设备新旧相关（非随机缺失），所以①加缺失指示变量让模型自己学「缺失=老设备」这个信号；②按设备类型分组填充，让填充值贴合各组真实分布。两者结合后预测偏差收敛。\n\n**其他选项为什么错：**\n- A. 全体均值把不同设备的分布拉平，正是案例里被推翻的做法\n- B. 删 12% 的行会同时删掉大量老设备样本，加剧偏差\n- C. 填 0 语义完全错误（运行 0 小时≠未上报），会制造一批假「新设备」。\n\n**关键概念：** 判断链：先看缺失是否随机→非随机则缺失本身是信号→指示变量+分组填充；随机缺失且比例极低（<1%）才考虑直接删行。","s":"自编·1.3.7"},{"id":"D1-039","d":1,"t":"single","q":"RAG 知识库检索结果经常出现内容高度雷同的多个片段，挤掉了真正有用的结果。最可能的原因与对策是：","o":[{"l":"A","t":"索引中存在大量近似重复块，应做近似去重（SimHash/MinHash）后再入库"},{"l":"B","t":"embedding 维度太高，应降低维度重建索引"},{"l":"C","t":"检索时应把 Top-K 调大，让结果更丰富"},{"l":"D","t":"应改用关键词检索替代向量检索"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 文档来源里常见同一内容的多版本、模板化段落、页眉页脚重复，切块后形成近似重复块。向量检索会把它们一起召回，占满 Top-K 名额。近似去重（SimHash/MinHash，精确哈希只能去完全重复）应在入库前完成。教材强调去重的必要性常被低估：训练集 5% 重复就显著增加过拟合风险，RAG 重复块则直接毁掉检索多样性。\n\n**其他选项为什么错：**\n- B. 降维不解决内容重复\n- C. K 调大只是引入更多重复，问题更糟\n- D. 关键词检索同样会召回重复文档，方向错了。\n\n**关键概念：** 去重两档：精确去重按主键/哈希，近似去重 SimHash/MinHash/向量相似度，文本近重复必须用后者。","s":"自编·1.3.7"},{"id":"D1-040","d":1,"t":"multiple","q":"关于离群值检测方法与适用场景的对应，以下哪些组合是正确的？（选 2 项）","o":[{"l":"A","t":"3σ / IQR 统计法——适合近似正态分布的连续变量"},{"l":"B","t":"孤立森林——适合单字段、分布已知的场景"},{"l":"C","t":"分位数截断（1%/99%）——适合分布未知的长尾数据"},{"l":"D","t":"DBSCAN——适合只需检测单维度极端值的场景"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** A 3σ 与 IQR 基于均值/标准差或四分位距，前提是分布近似正态才有解释力；C 分位数截断不假设分布形状，按经验分位裁剪，正适合分布未知的长尾。\n\n**其他选项为什么错：**\n- B. 孤立森林与 DBSCAN 是模型法，价值恰在处理多维、非线性关系——单字段已知分布用统计法就够了，用模型法是杀鸡用牛刀\n- D. DBSCAN 基于密度聚类找异常，强项是多维空间中的密度异常，不是单维度极端值。\n\n**关键概念：** 方法三档记忆：统计法（正态连续）、分位数（未知长尾）、模型法（多维非线性）。检测之后的动作比检测更重要：先判断错误值还是真实极端值，错误值修正，真实极端值保留。","s":"自编·1.3.7"},{"id":"D1-041","d":1,"t":"single","q":"某公司有结构化业务库（RDS）、点击流日志（Kinesis）和第三方 CSV 文件三种数据源，要建统一的训练数据底座。以下哪种架构最符合 AWS 推荐的数据湖设计？","o":[{"l":"A","t":"三种数据源各自建独立 S3 桶，训练时分别读取"},{"l":"B","t":"统一落 S3 数据湖，用 AWS Glue Crawlers 抓取 schema 并注册到 Glue Data Catalog"},{"l":"C","t":"全部导入 Redshift 集群，用 SQL 统一处理"},{"l":"D","t":"保留在各源系统，训练作业直连源库实时抽取"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 数据湖的标准形态是 S3 做集中存储 + Glue Data Catalog 做统一元数据层：Crawler 扫描各格式数据自动推断 schema 并注册表，下游 Athena/EMR/Glue/SageMaker 都通过 Catalog 发现数据。三种异构源集中到湖里才谈得上统一治理与复用。\n\n**其他选项为什么错：**\n- A. 三桶分治没有统一元数据，等于三个数据孤岛\n- C. Redshift 是数仓方案，原始异构数据先入仓成本高且灵活性差，现代架构多为「湖仓一体」中湖先行\n- D. 训练直连生产源库有性能与稳定性风险，且没有历史版本管理。\n\n**关键概念：** 记忆主线：S3=湖底、Glue Catalog=户口本、Crawler=登记员；D1 大量选型题的第一问都是「数据统一到哪、元数据在哪」。","s":"自编·1.1.2"},{"id":"D1-042","d":1,"t":"single","q":"数据团队发现不同部门对「活跃用户」的定义各不相同，Join 两张表时经常对不上。从数据管理角度，这个问题首先应该通过什么机制解决？","o":[{"l":"A","t":"AWS Glue Data Catalog，给表加注释说明口径"},{"l":"B","t":"用 Athena 直接查源表，人工对齐口径"},{"l":"C","t":"建立数据字典与指标口径治理流程，再落到目录与管道实现"},{"l":"D","t":"把两张表都复制一份到独立桶，各用各的"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 口径冲突的本质是治理问题而不是工具问题：先在数据字典里明确「活跃用户」的唯一定义与 owner，再落到管道与目录里实现。工具（Catalog/注释/血缘）只是治理结论的载体。这也是 D1「数据治理」考点的核心口径：先定规则，再谈实现。\n\n**其他选项为什么错：**\n- A. 注释谁都可以写、写了不等于被遵守，没有治理流程兜底\n- B. 人工对齐不可持续，且每次查询都要重新对\n- D. 复制副本让口径分歧永久化，是最差解。\n\n**关键概念：** 数据治理三件套记忆：字典定口径、目录管元数据、管道管落地；考题里「定义不一致/口径对不上」类题干，答案几乎都在治理层而不是工具层。","s":"自编·1.1.3"},{"id":"D1-043","d":1,"t":"single","q":"需要每天把上游 MySQL 的增量变更同步到 S3 数据湖，要求延迟在分钟级且对源库压力最小。最合适的方案是：","o":[{"l":"A","t":"每天凌晨用 JDBC 全表导出"},{"l":"B","t":"在应用代码里双写 MySQL 和 S3"},{"l":"C","t":"每小时跑一次 Glue 全量作业"},{"l":"D","t":"AWS DMS 持续复制（CDC）到 S3"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** AWS DMS 支持持续复制（CDC），读取源库的变更日志（binlog），只传增量、分钟级延迟、对源库压力极小——不跑大查询、不锁表。这是「数据库→湖」增量同步的标准答案。\n\n**其他选项为什么错：**\n- A. 全表导出延迟 24 小时且拖垮源库\n- B. 应用双写侵入业务代码，一致性与回溯都难保证，架构上属于反模式\n- C. Glue 全量作业每小时扫全表，源库压力与数据量成正比，完全不符合增量要求。\n\n**关键概念：** 摄取三件套分辨：批量批量导出（低频全量）、DMS CDC（持续增量）、Kinesis/DMS 流式（实时事件流）。题干出现「增量/分钟级/对源库压力小」三个词，基本指向 DMS CDC。","s":"自编·1.1.5"},{"id":"D1-044","d":1,"t":"single","q":"训练数据存放在 S3，多个团队频繁读取同一批热门数据集。为降低读取延迟与重复出口流量，最直接的优化是：","o":[{"l":"A","t":"为热门数据集配置 S3 缓存或使用本地缓存层，减少重复跨网读取"},{"l":"B","t":"给 S3 桶开启版本控制"},{"l":"C","t":"把数据再复制一份到另一个 Region"},{"l":"D","t":"改用 S3 Standard-IA 存储类"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 热数据反复跨网读取的痛点是延迟与流量成本，缓存层（如计算节点本地缓存、S3 Transfer Acceleration 或缓存型网关）让重复读取命中本地副本，两个问题一起解决。这属于 D1「数据摄取与存储优化」的常见考点。\n\n**其他选项为什么错：**\n- B. 版本控制解决的是误删与回溯，与读取性能无关\n- C. 跨 Region 复制是为灾备与地域就近，复制成本高且不解决同 Region 重复读取\n- D. Standard-IA 是按访问频率优化的存储类，取回仍收检索费，热数据用它反而更贵。\n\n**关键概念：** 存储类速记：Standard 常用、IA 低频、Glacier 归档；热数据的问题用缓存解决，不是降存储类。","s":"自编·1.1.7"},{"id":"D1-045","d":1,"t":"single","q":"数据科学家想用可视化界面交互式地探索一份新数据集、生成清洗配方并导出可复用的处理代码。最合适的工具是：","o":[{"l":"A","t":"Amazon EMR 托管 Spark 集群"},{"l":"B","t":"AWS Glue DataBrew"},{"l":"C","t":"AWS Glue ETL 作业"},{"l":"D","t":"Amazon Athena"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** DataBrew 的定位就是「业务/分析人员的数据准备可视化工具」：内置 250+ 转换操作，点选即可探索、清洗、生成配方（recipe），并可导出为代码供管道复用。四工具分工口诀：周期生产 Glue、业务探索 DataBrew、ML 实验 Data Wrangler、超大规模 EMR。题干关键词「可视化+探索+导出配方」直指 DataBrew。\n\n**其他选项为什么错：**\n- A. EMR 要写 Spark 代码、管集群，不是交互式探索工具\n- C. Glue ETL 面向脚本化周期作业，探索体验弱\n- D. Athena 是 SQL 查询引擎，做不了可视化清洗配方。\n\n**关键概念：** 注意与 Data Wrangler 区分：面向 ML 特征工程选 Wrangler，纯数据探索与业务清洗选 DataBrew——两者都是可视化，考点在场景。","s":"自编·1.2.1"},{"id":"D1-046","d":1,"t":"single","q":"TB 级日志数据需要每天凌晨跑固定的清洗与聚合作业，输出到数据湖。最适合的执行引擎是：","o":[{"l":"A","t":"AWS Glue DataBrew，定时刷新清洗配方"},{"l":"B","t":"Amazon SageMaker Data Wrangler，导出流程后每日手动触发"},{"l":"C","t":"AWS Glue（Spark）ETL 作业，按计划调度"},{"l":"D","t":"用 Excel 宏定期处理抽样数据"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 「TB 级+每天定时+固定逻辑」三要素指向 Glue ETL：无服务器 Spark、按 Glue 触发器/EventBridge 调度、自动扩缩，是周期生产作业的标准引擎。口诀「周期生产 Glue」。\n\n**其他选项为什么错：**\n- A. DataBrew 适合探索与中小规模，TB 级周期作业不是它的定位（教材误区表第 1 条原话）\n- B. Data Wrangler 面向 ML 实验流程，且「手动触发」不符合「每天固定跑」\n- D. 抽样处理对全量统计任务不成立。\n\n**关键概念：** 选型题的判断顺序：先看规模（TB 级排除 DataBrew/Wrangler），再看频率（定时排除手动工具），最后看交互形态（生产作业排除可视化探索工具）。","s":"自编·1.2.1"},{"id":"D1-047","d":1,"t":"single","q":"金额字段「transaction_amount」呈严重右偏（长尾），少数大额交易拉高了整体分布。团队准备将其用于线性模型特征。最合适的变换是：","o":[{"l":"A","t":"min-max 归一化到 [0,1]"},{"l":"B","t":"保持原值不动，线性模型会自动适应"},{"l":"C","t":"直接删除大额交易的样本"},{"l":"D","t":"对数变换 log(1+x)，压缩长尾后再标准化"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 右偏长尾是 log 变换的标志性场景：压缩长尾后分布接近对称，再标准化效果最好。教材案例：欺诈检测中金额 99 分位是均值 40 倍，log(1+x)+标准化后召回率从 0.61 提到 0.74。口诀「对数压长尾」。\n\n**其他选项为什么错：**\n- A. min-max 在有极端值时会把大多数样本压到 0 附近（离群值占满量程），正是归一化的适用禁区\n- B. 线性模型对量纲与分布敏感，长尾不处理会主导损失函数\n- C. 大额交易可能是最有价值的样本（欺诈/大客户），不能删。\n\n**关键概念：** 六手法对位记忆：标准正态（线性/SVM/NN）、归一限幅（固定范围、怕离群）、对数压长尾（金额计数时长）、分箱换非线性（抗噪可解释）、拆分提信息（日期拆年月日）。","s":"自编·1.2.4"},{"id":"D1-048","d":1,"t":"single","q":"团队在划分训练/测试集之前，先对全量数据计算了均值和标准差用于标准化。这个做法的问题是：","o":[{"l":"A","t":"把测试集的信息泄漏进了训练过程，评估指标会偏乐观"},{"l":"B","t":"计算成本太高，应该用抽样统计"},{"l":"C","t":"标准化必须手动完成，不能用库函数"},{"l":"D","t":"没有问题，全量统计更精确"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 这是最隐蔽也最常见的数据泄漏：标准化参数若含测试集分布，等于训练时偷看了测试信息，评估分数虚高，上线后真实表现下滑。正确流程是只用训练集算统计量，保存参数并在验证/测试/推理侧复用同一套变换。教材把它列为特征工程三条关键提醒之首。\n\n**其他选项为什么错：**\n- B. 成本不是本问题的本质\n- C. 与库函数无关，任何工具都要遵守先切分后统计\n- D. 「更精确」恰恰是错误所在——精确地泄漏了。\n\n**关键概念：** 关联考点：这也是 Feature Store 存在的理由之一——训练与推理必须同一套变换参数；推理侧各算一遍会造成训练-服务偏斜（training-serving skew）。","s":"自编·1.2.4"},{"id":"D1-049","d":1,"t":"single","q":"用随机森林做表格数据分类，同事建议先对所有数值特征做标准化「提升模型效果」。正确的评价是：","o":[{"l":"A","t":"正确，标准化对所有模型都有显著收益"},{"l":"B","t":"意义不大：树模型基于分裂点，对单调变换不敏感；但对数变换可能因改变分裂点位置而有效"},{"l":"C","t":"错误，树模型绝对不能做任何数值变换"},{"l":"D","t":"正确与否取决于样本量大小"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 树模型的分裂只看特征值的排序与阈值，单调变换（标准化、归一化）不改变排序，对结果几乎无影响——做了无害但无收益。教材特别提醒：对数变换可能因为改变数值间距结构而影响分裂点位置，因此「可能有效」，但标准化这类平移缩放没有意义。这条「常作为哪个手法对树模型无效的选项出现」。\n\n**其他选项为什么错：**\n- A. 混淆了线性模型（需要标准化）与树模型的区别\n- C. 绝对化错误，对数/分箱对树模型可能有效\n- D. 与样本量无关，是模型机制问题。\n\n**关键概念：** 考试速答：题干问「标准化对树模型的效果」，选「不敏感/无显著收益」；问「对数变换」，选「可能有效」。","s":"自编·1.2.4"},{"id":"D1-050","d":1,"t":"single","q":"客服知识库要选 embedding 模型做中文语义检索。第一版用英文优化的模型，Top-5 命中率只有 52%。最可能的原因与对策是：","o":[{"l":"A","t":"维度不够高，换 3072 维的模型重试"},{"l":"B","t":"向量库性能不足，换更快的检索引擎"},{"l":"C","t":"模型中文能力弱，换中文效果更好的模型并先做小样本评估"},{"l":"D","t":"命中率 52% 已属正常，无需处理"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 选型四维度里「语言覆盖」排第一：很多 embedding 模型英文强中文弱，中文查询与中文文档的语义空间没学好，命中率自然低。正确路径是换中文效果好的模型，且换前先拿 200 条真实查询做小样本对比评估——比看榜单可靠。教材案例：换中文模型+512 维后命中率 78%，存储成本还降了一半。\n\n**其他选项为什么错：**\n- A. 维度高不等于中文好，方向就错了\n- B. 检索引擎影响速度，不影响「语义找不找得到」\n- D. 52% 命中意味着近半查询失败，不可接受。\n\n**关键概念：** 附带考点：换 embedding 模型必须全量重建索引（向量空间不可比），不能只对新数据用新模型。","s":"自编·1.2.5"},{"id":"D1-051","d":1,"t":"single","q":"向量检索库的召回率近期莫名下降。排查发现团队最近把相似度计算从余弦相似度换成了欧氏距离，而 embedding 生成时向量做了归一化。问题的本质是：","o":[{"l":"A","t":"欧氏距离计算比余弦慢，超时导致部分结果丢失"},{"l":"B","t":"归一化的向量不能再用于任何相似度计算"},{"l":"C","t":"召回率下降与度量方式无关，是数据量增长所致"},{"l":"D","t":"检索库的距离度量必须与生成 embedding 时的假设一致，混用是最隐蔽的召回率杀手"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 归一化后的向量用余弦相似度；不归一化时点积与欧氏距离的关系才成立。生成与检索两侧的假设必须一致，教材把「混用度量」称为最隐蔽的召回率杀手——不会报错，只会悄悄地把结果排错序。\n\n**其他选项为什么错：**\n- A. 性能问题影响延迟，不会系统性地改变排序质量\n- B. 归一化向量恰恰最适合余弦相似度，说反了\n- C. 排查已定位到度量变更，归因于数据量是回避问题。\n\n**关键概念：** embedding 三铁律之一：距离度量要一致；另两条是换模型必须全量重建、维度可降是省钱第一招。三铁律都是「不报错只变差」的隐蔽型考点。","s":"自编·1.2.5"},{"id":"D1-052","d":1,"t":"single","q":"RAG 系统首版按 512 token 固定长度硬切文档，答案常缺前提条件。以下哪种改进最可能同时提升答案完整率与引用可追溯性？","o":[{"l":"A","t":"按文档结构（标题层级）切块，并采用小块检索、大块生成（small-to-big）"},{"l":"B","t":"把块大小调大到 2048 token，一次给足上下文"},{"l":"C","t":"换成更大的语言模型，让它自己推断缺失的前提"},{"l":"D","t":"关闭引用功能，减少用户质疑"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 固定长度硬切的毛病是「在语义中间切断」：前提与结论被切进两个块。按结构切块保留自然边界，元数据挂标题路径与页码使引用可追溯；small-to-big（小块检索精度高、命中后回溯大块上下文完整）是工程实践里性价比最高的组合拳。教材案例：制度问答改结构切块后完整率 64%→89%。\n\n**其他选项为什么错：**\n- B. 大块稀释相关性且可能超 embedding 输入上限，是方向性错误\n- C. 模型再大也补不回没检索到的上下文\n- D. 不可追溯会让用户不信、无法核查，与改进方向相反。\n\n**关键概念：** 分块优先级：结构>语义>递归分隔符>固定长度；元数据六项里权限标签是合规硬要求。","s":"自编·1.2.7"},{"id":"D1-053","d":1,"t":"single","q":"客服对话数据要用于微调。以下哪种脱敏组合最合理？","o":[{"l":"A","t":"姓名、手机号全部删除，剩余文本直接训练"},{"l":"B","t":"姓名假名化（保指代关系）、手机与订单号替换为类型占位、地址泛化到城市级"},{"l":"C","t":"所有字段统一替换为 ***，格式统一美观"},{"l":"D","t":"不做处理，模型训练会自动遗忘个人信息"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 这是教材案例的原型：脱敏要在隐私与训练价值间平衡——姓名假名化保留指代关系（对话里「他」指谁仍可追踪）；手机/订单号无训练价值，用类型占位保句法结构；地址泛化到城市级降低精度换隐私。抽检确认重识别风险为 0，效果差异 2% 以内。\n\n**其他选项为什么错：**\n- A. 全删会破坏语义连贯（脱敏档位中的「删除」风险）\n- C. 统一掩码保留格式但丢信息，适合展示不适合训练\n- D. 模型不但不会遗忘，还会把 PII 学进去——这是 privacy 考点的红线认知。\n\n**关键概念：** 三档记忆：遮蔽留格式、脱敏删内容、匿名化保关系；防重识别要盯准标识符组合（准标识符问题）。","s":"自编·1.2.8"},{"id":"D1-054","d":1,"t":"single","q":"微调数据准备了 3 万条自动生成的问答对，效果反而不如基线模型。诊断后最可能的原因是：","o":[{"l":"A","t":"3 万条太多，超过模型训练上限"},{"l":"B","t":"应该用更大的模型重新生成数据"},{"l":"C","t":"生成数据里存在答案与问题不匹配、模板句式高度重复，噪声数据损害了效果"},{"l":"D","t":"微调本身不适合这个任务，应改用 RAG"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 微调的铁律是质量远重于数量：教材案例里 3 万条生成数据有 30% 答案不匹配、模板高度重复，模型学到的是噪声与模板而非任务语义；收敛到 800 条人工审核样本后效果反而提升。配对数据要求一一对应——输出必须是该输入的唯一合理答案。\n\n**其他选项为什么错：**\n- A. 数量多不是问题本身，质量差才是\n- B. 换更强的生成模型不解决「没有人工审核」这个根因\n- D. 任务适配性与数据质量是两回事，用坏数据否定技术路线是错误归因。\n\n**关键概念：** 实操顺序：先人工审核 100 条再决定扩量；留 10–20% 验证集监控过拟合（训练损失降、验证损失升）。","s":"自编·1.2.9"},{"id":"D1-055","d":1,"t":"single","q":"持续预训练（continued pre-training）用领域语料继续训练基础模型。以下哪项是这一路径特有的数据准备要求？","o":[{"l":"A","t":"准备高质量的输入-输出配对样本"},{"l":"B","t":"收集教师模型的输出及其思维链"},{"l":"C","t":"所有样本必须严格符合对话模板"},{"l":"D","t":"大规模纯文本语料要去重去噪，并混入通用语料防止灾难性遗忘"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 续训吃的是大规模纯文本（千万 token 起），质量控制的两个特有动作：去重去噪（重复内容会被「记住」而非「学会」）、混入通用语料防灾难性遗忘——只学领域文本会把通用能力练没。\n\n**其他选项为什么错：**\n- A. 配对样本是微调的要求\n- B. 教师输出+思维链是蒸馏的要求\n- C. 对话模板是微调的格式要点，续训是自监督的 next-token 预测，不按对话模板组织。\n\n**关键概念：** 三路径对照记忆：微调改行为（配对数据、数百到数万条）、续训补知识（大语料、去重+混通用）、蒸馏搬家（教师输出带理由、抽检过滤）。数据形态错了训练一定失败，且失败得很隐蔽。","s":"自编·1.2.9"},{"id":"D1-056","d":1,"t":"multiple","q":"关于 AWS 数据准备工具的分工，以下哪些说法是正确的？（选 2 项）","o":[{"l":"A","t":"TB 级周期性清洗作业应优先选择 AWS Glue ETL 而非 DataBrew"},{"l":"B","t":"DataBrew 可视化配方可以直接扩展到任意规模的周期生产作业"},{"l":"C","t":"ML 特征工程的交互式实验优先选 SageMaker Data Wrangler"},{"l":"D","t":"EMR 适合小规模、低频的一次性探索任务"},{"l":"E","t":"Athena 适合承担 TB 级周期性清洗，并把结果回写到生产表"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** A 对应教材误区第 1 条：DataBrew 可视化工具适合探索与中小规模，TB 级周期作业用 Glue/Spark——「周期生产 Glue」；C Wrangler 的定位就是 ML 实验：内置特征变换、可与 SageMaker 管道衔接、导出处理代码。\n\n**其他选项为什么错：**\n- B. 「任意规模」是绝对化错误，可视化工具的成本与交互模式决定了它的规模边界\n- D. EMR 是超大规模引擎，用来做小规模探索是大材小用、成本失控，探索该用 DataBrew/Wrangler/Athena。\n- E. Athena 是按扫描数据量计费的交互式查询服务，定位是探索与联邦查询，不是周期 ETL；生产回写要的是可编排、可重跑的作业（Glue），用 Athena 既难调度又难控成本。\n\n**关键概念：** 四工具口诀必背：周期生产 Glue、业务探索 DataBrew、ML 实验 Data Wrangler、超大规模 EMR。选型题先抓「规模+频率+角色」三要素再对号入座。","s":"自编·1.2.1"},{"id":"D1-057","d":1,"t":"multiple","q":"生产数据管道需要常态化的数据质量校验。以下哪些做法符合「质量门禁要卡住流程」的要求？（选 2 项）","o":[{"l":"A","t":"规则失败时阻断下游写入，不让脏数据进入下一步"},{"l":"B","t":"把校验结果生成为周报，供团队月度回顾"},{"l":"C","t":"用 DQDL 规则检查行数偏差，结果挂到 CloudWatch 告警"},{"l":"D","t":"校验只在上线的第一天跑一次，确认没问题即可"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** A 是门禁的定义：规则必须能阻断流程，不发布脏数据，且阻断记录可查——「只做报表的校验等于没做，没人看」；C 是标准实现：Glue Data Quality 的 DQDL 规则（如「行数与上周同日偏差 ≤30%」）+ CloudWatch 告警，教材案例里这条规则当天就报出了上游字段变更。\n\n**其他选项为什么错：**\n- B. 周报是事后回顾，阻断不了脏数据，正是被教材点名的反模式\n- D. 一次性校验对持续变化的数据毫无防御力，上游 schema 变更随时可能发生。\n\n**关键概念：** 六维度校验内容也要记：完整性、准确性、一致性、唯一性、及时性、有效性——门禁卡的是流程，六维定的是规则内容。","s":"自编·1.3.1"},{"id":"D1-058","d":1,"t":"single","q":"标注团队对「退款咨询」和「售后投诉」的边界理解不一，两人一致率只有 0.55。正确的改进顺序是：","o":[{"l":"A","t":"先在标注手册中补明边界案例规则，再重标分歧样本并复测一致率"},{"l":"B","t":"继续增加标注量，用数据量稀释分歧"},{"l":"C","t":"直接用模型预标注替代人工"},{"l":"D","t":"把两个类别合并成一个类别绕开边界问题"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 一致率低的根因是手册没定义边界（「这句话算不算投诉」无明文规则），不同人打出不同结果。教材案例：补边界规则+重标 3000 条后一致率 0.55→0.88，模型准确率 0.72→0.85。顺序必须是「改手册→重标→复测」——标注错了模型一定学错，且没法靠调参补救。\n\n**其他选项为什么错：**\n- B. 堆量放大分歧不解决分歧\n- C. 模型预标注会继承现有模型的偏差，且此时连可靠模型都没有\n- D. 合并类别改变任务定义，是回避不是解决。\n\n**关键概念：** 标注三道控制：手册定边界、多人标注算一致率（Cohen's Kappa）、黄金集持续抽检。一致率低改手册，不是继续堆量。","s":"自编·1.3.2"},{"id":"D1-059","d":1,"t":"single","q":"标注预算有限，希望用最少的标注量达到相近的模型效果。以下哪种方法最直接有效？","o":[{"l":"A","t":"把所有样本都标一遍，提高覆盖率"},{"l":"B","t":"主动学习：优先标注模型最不确定的样本"},{"l":"C","t":"降低标注要求，允许标注员凭直觉快速打标"},{"l":"D","t":"用随机抽样的方式选取标注样本"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 主动学习的核心是选样策略：不再随机送标，而是优先标「模型最不确定」的样本（按输出概率的熵或置信度边际判断）。实践中通常用 30%–50% 的标注量达到相近效果，是预算受限场景的标准答案。\n\n**其他选项为什么错：**\n- A. 全标与预算目标矛盾\n- C. 降低质量会放大标注噪声，监督学习的上限由标注质量决定\n- D. 随机抽样恰恰是主动学习要替代的对象——大部分随机样本模型已经很确定，标了价值低。\n\n**关键概念：** 记忆钩子：主动学习=把预算花在刀刃上（模型不确定的样本）；配套工具 SageMaker Ground Truth 支持自动标注+人工复核，进一步省量。","s":"自编·1.3.2"},{"id":"D1-060","d":1,"t":"single","q":"信贷审批模型整体 AUC 0.81，但某类客户群体通过率显著低于其他群体。排查发现该群体在训练集中仅占 3%，且历史上多由少数审批人处理。以下哪组缓解动作最对症？","o":[{"l":"A","t":"提高模型学习率并延长训练时间"},{"l":"B","t":"删除该群体样本，使模型在剩余群体上表现更好"},{"l":"C","t":"分层采样补足该群体样本占比，并复核标签来源（历史审批记录可能带标签偏差）"},{"l":"D","t":"直接在输出端上调该群体的通过概率"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 症状指向两类偏差叠加：采样偏差（训练集只占 3%，不代表真实分布）+标签偏差（少数审批人的主观倾向写进了历史标签）。对症下药就是分层采样补样本+复核标签来源——先确认差异来自数据缺陷还是真实分布，前者修数据，后者要在业务上解释。教材案例：分层采样+补样本后群体差距缩小且整体 AUC 未降。\n\n**其他选项为什么错：**\n- A. 学习率与群体公平无关\n- B. 删除样本让「看不到的问题消失」是治理大忌\n- D. 输出端调概率绕过数据问题，且引入新的不公平。\n\n**关键概念：** 工具锚点：SageMaker Clarify 算类别不平衡（CI）与标签质量（DPL）；判断标准不是整体指标好，而是群体间差距可接受。","s":"自编·1.3.3"},{"id":"D1-061","d":1,"t":"single","q":"规划 ML 训练数据底座时，需要识别组织内的可用数据源。以下哪类数据通常最容易被忽视、但对模型价值很高？","o":[{"l":"A","t":"结构化业务库中的交易数据"},{"l":"B","t":"第三方采购的行业报告"},{"l":"C","t":"公开数据集网站上的基准数据"},{"l":"D","t":"客服工单、通话转写、内部文档等非结构化业务文本"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 组织盘点数据源时，结构化库通常已在数仓里，最容易漏的是散落在工单系统、通话记录、内部 wiki 的非结构化文本——体量大、含真实客户语言、且正是 LLM/RAG 类应用的核心燃料。C02 的数据准备域特意覆盖文本与多模态，就是提醒这类资产的价值。\n\n**其他选项为什么错：**\n- A. 交易数据是最先被盘到的\n- B. 外购报告有版权与口径限制，属于补充源\n- C. 公开基准数据不能代表业务分布，价值有限。\n\n**关键概念：** 考纲 1.1.1 的考点是「识别数据源及获取方式」：内部结构化/内部非结构化/第三方/公开四类，答题时注意题干问「易被忽视的高价值源」指向非结构化内部文本。","s":"自编·1.1.1"},{"id":"D1-062","d":1,"t":"single","q":"训练数据要长期存放在 S3，主要供 Spark 作业按列做聚合分析，查询时通常只读其中几列。最优的存储格式是：","o":[{"l":"A","t":"Parquet（列式存储 + 压缩）"},{"l":"B","t":"未压缩的 CSV 文本"},{"l":"C","t":"单个大 JSON 文件"},{"l":"D","t":"把数据拆成每天一个 TXT 文件"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 列式聚合场景的标配是 Parquet：按列组织数据，读取时跳过无关列（列裁剪），配合压缩（Snappy/Zstd）与谓词下推，扫描量与成本大幅低于行式文本。Athena/EMR/Glue 对 Parquet 的支持也最好。\n\n**其他选项为什么错：**\n- B. CSV 行式存储读一列也要扫全行，且无 schema 信息\n- C. JSON 更大更慢，解析开销高\n- D. 换行拆文件只优化了分区，文件内部仍是低效格式。\n\n**关键概念：** 格式选型速记：分析用列式（Parquet/ORC）、交换用行式（CSV/JSON）、嵌套语义保留用 Avro/Parquet；再叠加分区（按日期）与分桶优化。「只读几列+聚合」两个词锁定列式。","s":"自编·1.1.4"},{"id":"D1-063","d":1,"t":"single","q":"团队在规划训练数据底座，讨论数据湖与数据仓库的定位。以下关于两者的对比，正确的是：","o":[{"l":"A","t":"数据湖要求入库前先定义好 schema，否则无法写入"},{"l":"B","t":"数据湖以原始格式存万物，schema 在读取时定义，适合探索与 ML"},{"l":"C","t":"数据仓库比数据湖存储成本更低、灵活性更高"},{"l":"D","t":"ML 训练数据只能来自数据仓库"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 数据湖的核心特征是 schema-on-read：原始格式（文本/图像/日志/表格）直接入湖，用的时候再解释结构，存取灵活、成本低，天然适合 ML 的多样化数据需求。\n\n**其他选项为什么错：**\n- A. 是 schema-on-write，那是数据仓库的特征——仓库要求入库前建模，湖恰恰相反\n- C. 说反了：仓库强在查询性能与一致性，湖强在成本与灵活性\n- D. ML 数据来源广泛，湖正是为 ML 准备数据的主战场，训练管道大多直接读湖。\n\n**关键概念：** 一句话分辨：湖=先存后想（灵活探索），仓=先想后存（高性能分析）。考题常把两者的 schema 时机、成本、用途交叉设错项。","s":"自编·1.1.6"},{"id":"D1-064","d":1,"t":"single","q":"数据湖中存有含个人信息的数据，多个团队按需访问。以下哪项治理措施最能同时满足「合规可审计」与「细粒度权限」两个要求？","o":[{"l":"A","t":"把含 PII 的数据移出数据湖，各团队用邮件传文件"},{"l":"B","t":"所有团队共用一个有完全权限的 IAM 角色，简化管理"},{"l":"C","t":"用 Lake Formation 对表、行、列级授权，访问记录入 CloudTrail 可审计"},{"l":"D","t":"靠团队自律，在 wiki 上写明「不要把数据带出湖」"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** Lake Formation 是 S3 数据湖的权限治理层：细到表/行/列的授权（不同团队只见所需字段），配合 CloudTrail 留下完整访问审计链——两要件「细粒度+可审计」同时满足，这是 PII 治理的标准答案形态。\n\n**其他选项为什么错：**\n- A. 邮件传文件使数据彻底失控，合规灾难\n- B. 共用高权限角色违反最小权限原则，且无法区分是谁在访问\n- D. 自律不是控制，审计与合规都要求技术手段。\n\n**关键概念：** 关联考点：S3 桶策略管到桶/前缀，Lake Formation 才能管到列/行；考题出现「列级/行级权限」字样时首选 Lake Formation。","s":"自编·1.1.9"},{"id":"D1-065","d":1,"t":"single","q":"在线推理服务与离线训练需要使用同一组特征，但两边各自实现特征逻辑，导致训练效果与线上表现不一致。最合适的解决方案是：","o":[{"l":"A","t":"在训练前重新计算一遍特征，保证最新"},{"l":"B","t":"把训练数据导出为 CSV，人工对齐线上逻辑"},{"l":"C","t":"降低模型复杂度，减少对特征的依赖"},{"l":"D","t":"使用 SageMaker Feature Store 统一特征定义与读写，在线离线共用一套口径"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 这是 training-serving skew（训练-服务偏斜）的标准解：Feature Store 一个特征一个定义，在线低延迟存储供推理、离线存储供训练回溯，两边读写同一份定义与数据，口径差从机制上消灭。教材强调「Feature Store 的核心价值是消灭训练与推理的口径差」，不只是特征表。\n\n**其他选项为什么错：**\n- A. 重算一遍恰恰复制了不一致\n- B. 人工对齐不可持续，特征一多必错\n- C. 削足适履，模型能力让位于工程缺陷。\n\n**关键概念：** 三个能力点必记：在线+离线双存储、按 event time 时间旅行（取某时刻的正确版本防标签泄漏）、上线前离线-在线逐条比对。","s":"自编·1.2.2"},{"id":"D1-066","d":1,"t":"single","q":"训练欺诈检测模型时，直接用「标签生成时刻之后的特征快照」可能造成标签泄漏。Feature Store 的哪个能力专治这个问题？","o":[{"l":"A","t":"按 event time 时间旅行：取标签发生时刻之前的最新特征版本"},{"l":"B","t":"在线存储的低延迟查询"},{"l":"C","t":"特征目录的搜索功能"},{"l":"D","t":"自动扩缩容"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 标签泄漏的典型场景：标签是「30 天后是否欺诈」，特征却用了 30 天内的更新值——模型学到的是未来。Feature Store 按 event time 存每个特征值的历史版本，训练时可以「时间旅行」取标签发生时刻之前的最新版本，保证与真实推理时可见的信息一致。\n\n**其他选项为什么错：**\n- B. 低延迟是推理侧的价值，与泄漏无关\n- C. 特征目录帮助发现复用特征，不解决时点正确性\n- D. 与本题无关。\n\n**关键概念：** 时间旅行与「统计量只用训练集算」同属防泄漏家族：前者防时间维度的未来信息，后者防样本维度的测试集信息。教材把「按 event time 时间旅行」列为特征管理三件事之一。","s":"自编·1.2.2"},{"id":"D1-067","d":1,"t":"single","q":"用户画像中「注册月份」字段对目标变量呈非线性影响（特定月份注册的用户转化率明显不同）。不引入复杂模型的前提下，最合适的特征处理是：","o":[{"l":"A","t":"对月份做标准化"},{"l":"B","t":"把月份分箱为业务含义明确的区间（如促销季/淡季）"},{"l":"C","t":"把月份除以 12 归一化"},{"l":"D","t":"删除该字段"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 分箱（binning）的适用场景正是「关系非线性、需要可解释分段」：把连续月份切成「促销季/淡季」这类业务区间，线性模型就能学到分段效应，且业务方可解释。六手法口诀「分箱换非线性」。\n\n**其他选项为什么错：**\n- A. 标准化只改量纲不改形状，非线性关系依旧学不到\n- C. 除以 12 同样是线性变换，无济于事\n- D. 明显有效信号的字段不应删除。\n\n**关键概念：** 分箱的取舍要记全：代价是信息损失、区间边界必须有业务含义——若边界无业务支撑，分箱就是硬造噪声。配套：日期字段更常用的是拆分（年/月/日/星期），两种手法可在同一字段上叠加使用。","s":"自编·1.2.4"},{"id":"D1-068","d":1,"t":"single","q":"RAG 系统要检索产品手册，查询是短问句、文档是长段落。部分 embedding 模型提供「查询侧/文档侧」不同的编码方式。正确用法是：","o":[{"l":"A","t":"查询与文档都用文档侧编码，保持一致"},{"l":"B","t":"两侧编码方式随机选择，效果没有差别"},{"l":"C","t":"按模型文档区分：查询用查询侧编码、文档用文档侧编码，不要混用"},{"l":"D","t":"把长文档压缩成短句后全部用查询侧编码"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 问题的语义形态（短问句）与文档（长段落）不同，部分模型专门训练了非对称编码：查询侧与文档侧各有一套前缀/池化方式。RAG 场景必须按模型文档区分使用，否则召回率明显下降——这是「对称/非对称」考点的核心。\n\n**其他选项为什么错：**\n- A. 全用文档侧会让短查询落进错误的语义空间\n- B. 非对称模型两侧编码不等价，随机选是隐形事故\n- D. 压缩成短句破坏文档信息，方向错误。\n\n**关键概念：** 关联记忆：对称模型（如部分检索模型）两侧同编码；非对称模型两侧分开。换模型时同一条铁律适用——全量重建索引。","s":"自编·1.2.5"},{"id":"D1-069","d":1,"t":"single","q":"RAG 文档更新后，直接把新块追加进向量库而没有删除旧块。这会导致什么问题？正确的机制是什么？","o":[{"l":"A","t":"没有问题，向量库自动去重"},{"l":"B","t":"向量库容量超限，服务中断"},{"l":"C","t":"新块会覆盖旧块，无需处理"},{"l":"D","t":"新旧内容并存，检索命中旧内容；必须有「文档版本→块版本」的联动更新机制"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 追加不删除=新旧并存：检索结果里新旧版本的内容同时出现，用户看到过时答案。教材三大常见错误之一「更新不重建」：必须有文档版本到块版本的联动机制——文档改版时按元数据里的文档 ID+版本定位旧块、删除、再入库新块。\n\n**其他选项为什么错：**\n- A. 向量库不做语义去重，相似但不相同的块都保留\n- B. 容量问题是次要的，语义错误才是主害\n- C. 向量库没有这种覆盖逻辑，追加就是并存。\n\n**关键概念：** 元数据六项里「文档 ID 与版本」的用途就是「更新时能定位替换，不产生孤儿块」——孤儿块（原文已删、块还在）是同一问题的另一种表现。","s":"自编·1.2.7"},{"id":"D1-070","d":1,"t":"single","q":"训练语料里包含「年龄 + 邮编 + 职业」的组合。即使姓名已被删除，仍可能通过组合定位到个人。这个问题的正确名称与对策是：","o":[{"l":"A","t":"准标识符（quasi-identifier）重识别风险；需对组合字段泛化或假名化"},{"l":"B","t":"过拟合问题，应增大数据量"},{"l":"C","t":"数据泄漏问题，应重新划分训练测试集"},{"l":"D","t":"维度灾难，应做特征选择"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 单看每个字段都不标识个人，组合起来却能唯一锁定——这就是准标识符问题，教材易错点原话「以为删掉姓名就匿名了」。对策是对组合维度做泛化（年龄 32→30–40）或假名化，必要时按 k-匿名标准验证。\n\n**其他选项为什么错：**\n- B. 过拟合是模型问题，与隐私无关\n- C. 数据泄漏指评估信息泄漏，概念混用\n- D. 特征选择的目标是模型效果，不是重识别防护。\n\n**关键概念：** 附带考点：生成式场景别忘了提示词里的 PII——用户把身份证号写进 prompt，日志与训练数据都会带上，脱敏必须覆盖输入侧。","s":"自编·1.2.8"},{"id":"D1-071","d":1,"t":"single","q":"微调样本需要按模型的对话模板拼接（system/user/assistant 标记）。以下哪种做法正确？","o":[{"l":"A","t":"按自己理解的格式手写拼接模板，灵活可控"},{"l":"B","t":"使用模型厂商提供的模板函数拼接，不要手写"},{"l":"C","t":"所有模型模板通用，随便选一个"},{"l":"D","t":"去掉角色标记，只保留纯文本，模型更能泛化"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 不同模型的对话模板（角色标记、结束符、特殊 token）各不相同，拼错等于教模型错误的格式——模型学到的是「错误格式下的文本分布」，指令跟随能力受损。教材明确：用厂商提供的模板函数，不要手写。\n\n**其他选项为什么错：**\n- A. 手写模板是教材点名的错误做法，边界符极易写错\n- C. 模板不通用，跨模型套用必错\n- D. 角色标记是模型区分指令与回复的依据，去掉后指令微调基本失效。\n\n**关键概念：** 关联：微调四要点=严格按模板、配对一一对应、质量重于数量、留 10–20% 验证集。四要点常一起出多选或排除型单选。","s":"自编·1.2.9"},{"id":"D1-072","d":1,"t":"single","q":"微调训练中训练损失持续下降，但验证损失开始上升。最合理的判断与动作是：","o":[{"l":"A","t":"模型正在持续进步，继续训练"},{"l":"B","t":"学习率太低，应调大学习率"},{"l":"C","t":"出现过拟合，应停止训练或回退到验证损失最低的检查点"},{"l":"D","t":"验证集太小，应把验证集并入训练集"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 训练损失降、验证损失升是过拟合的教科书信号：模型在记忆训练样本而非学习泛化规律。动作是早停或取验证损失最低的检查点。这也是「留出验证集」存在的意义——同一业务分布留 10–20% 不进训练。\n\n**其他选项为什么错：**\n- A. 把过拟合当进步，方向完全反了\n- B. 调大学习率通常加剧震荡，与过拟合无对治关系\n- D. 把验证集并入训练集后就没有过拟合的观测手段了，是自欺。\n\n**关键概念：** 考纲关联：微调数据四要点之「留出验证集」；诊断信号「训练降验证升」是 C02 数据准备域的常考判断题。","s":"自编·1.2.9"},{"id":"D1-073","d":1,"t":"single","q":"时间序列销售数据要按月切分训练/验证集。以下哪种做法是错误的？","o":[{"l":"A","t":"用前 N 个月训练、后几个月验证，保持时间顺序"},{"l":"B","t":"按时间滚动窗口做多轮验证"},{"l":"C","t":"验证期紧接训练期之后，模拟真实预测场景"},{"l":"D","t":"随机打乱全部样本后再随机划分训练/验证集"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 时序数据随机打乱会让验证集里混入训练期之后的未来信息（模型「见过未来」），评估严重虚高——教材在偏差缓解表里特别标注「时序数据不能随机打乱（会泄漏未来信息）」。本题问的是错误做法，随机打乱正是那个错误。\n\n**其他选项为什么不是答案：**\n- A. 用前 N 个月训练、后几个月验证，保持时间顺序，是时序切分的正确姿势。\n- B. 按时间滚动窗口做多轮验证，是时序交叉验证的标准做法。\n- C. 验证期紧接训练期之后，模拟真实预测场景，同样是正确姿势。\n\n**关键概念：** shuffling 是偏差缓解手段之一，但只适用于非时序数据；「什么时候能 shuffle、什么时候不能」是 1.3.3 的高频陷阱——题干出现时间序列/按月/按季度等词就要警觉。","s":"自编·1.3.3"},{"id":"D1-074","d":1,"t":"single","q":"欺诈检测正负样本比 1:200。第一版模型用 accuracy 评估得到 0.995，上线后漏检率 60%。核心教训是：","o":[{"l":"A","t":"不平衡场景不能用 accuracy：全预测多数类就能拿到 0.995；应改用 PR-AUC/召回率等指标"},{"l":"B","t":"模型训练不充分，应训练更多轮"},{"l":"C","t":"正负样本比例应硬性调成 1:1 才能训练"},{"l":"D","t":"accuracy 0.995 说明模型很好，漏检是业务流程问题"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 1:200 下全预测「非欺诈」的 accuracy 就是 200/201≈0.995——高准确率是多数类红利，模型可能什么都没学到。教材口径：这类题的关键不是选方法而是先换指标（精确率/召回率/F1、不平衡场景用 PR-AUC），教材案例换 PR-AUC+类别权重+按漏检成本调阈值后召回 0.88。\n\n**其他选项为什么错：**\n- B. 问题在评估指标，不在训练轮数\n- C. 1:1 不是硬性要求，过采样/权重/阈值都是更柔和的手段，强行 1:1 可能丢多数类信息\n- D. 把红利当实力，正是教训本身。\n\n**关键概念：** 指标替换表必背：accuracy→P/R/F1；单独 ROC-AUC→PR-AUC；单一阈值→按业务代价选阈值。","s":"自编·1.3.5"},{"id":"D1-075","d":1,"t":"single","q":"处理类别不平衡时，团队在过采样与类别权重之间犹豫。相比过采样（复制少数类样本），类别权重的主要优势是：","o":[{"l":"A","t":"类别权重能增加少数类的真实样本数量"},{"l":"B","t":"类别权重改动最小：在损失函数里给少数类更高权重，不复制样本、不易过拟合少数类"},{"l":"C","t":"类别权重适用于所有算法且无任何风险"},{"l":"D","t":"类别权重可以完全替代数据层面的所有治理"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 过采样复制少数类样本，容易让模型过拟合那几条被反复看到的样本；类别权重只在损失函数里调整各类的代价，数据不动、改动最小，是教材推荐的首选。\n\n**其他选项为什么错：**\n- A. 权重不产生新样本，说的是复制派的事\n- C. 「无任何风险」绝对化——权重过大会导致训练震荡，教材明确列了这个风险\n- D. 数据层面的治理（补真实样本、分层采样）与权重互补，不能互相替代。\n\n**关键概念：** 四手段排序记忆：类别权重（首选，改动最小）→阈值调整（已有模型、成本不对称）→过采样（少数类极少，防过拟合）→欠采样（多数类冗余大，防丢信息）。","s":"自编·1.3.5"},{"id":"D1-076","d":1,"t":"single","q":"图像缺陷检测中，少数类（缺陷图）大多在特定光照下拍摄。只按类别做过采样后，模型可能学到什么错误模式？正确的做法是什么？","o":[{"l":"A","t":"模型会自动忽略光照因素，无需处理"},{"l":"B","t":"应把所有图像统一调成相同亮度再训练"},{"l":"C","t":"模型可能学到「特定光照=缺陷」的伪相关；应做条件均衡，让缺陷样本覆盖多种光照"},{"l":"D","t":"应删除光照异常的缺陷样本"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 教材 1.3.5 特别提示：图像少数类可能同时存在拍摄条件差异，模型学到光照而非缺陷——这是伪相关（shortcut learning）。解法是条件均衡：在「缺陷×光照」的交叉维度上都补样本，让缺陷独立于光照出现。\n\n**其他选项为什么错：**\n- A. 「自动忽略」没有机制依据，卷积网络恰恰擅长抓取低级视觉特征如亮度\n- B. 统一亮度会破坏真实分布，推理时遇到自然光照反而失效\n- D. 删样本让缺陷样本更少，火上浇油。\n\n**关键概念：** 与 1.3.4 交叉记忆：图像分布偏差看「类别占比+场景标签分布」，均衡要在交叉维度（场景×光照）上做，单一维度均衡会制造新偏斜。","s":"自编·1.3.5"},{"id":"D1-077","d":1,"t":"multiple","q":"关于偏差度量与治理，以下哪些说法符合教材口径？（选 2 项）","o":[{"l":"A","t":"SageMaker Clarify 可计算类别不平衡指标（CI）与标签质量指标（DPL）"},{"l":"B","t":"偏差治理的目标是把各群体指标完全调平"},{"l":"C","t":"判断标准是「群体间差距是否可接受」，不是「整体指标好不好」"},{"l":"D","t":"偏差主要来自算法本身，数据层面无法治理"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** A 是工具锚点：Clarify 计算类别不平衡（CI）与标签质量（DPL），并在训练后给出各群体表现差异——考试认准 Clarify；C 是核心口径：整体指标好掩盖群体差距，治理的判断标准始终是「群体间差距可接受」。\n\n**其他选项为什么错：**\n- B. 是教材点名的红线：偏差治理不是把指标调平——若某群体真实通过率确实更低（业务事实），强行调平引入新错误；正确顺序是先确认差异来自数据缺陷还是真实分布\n- D. 说反了：偏差多数来自数据而非算法，数据侧治理正是 1.3.3 的主题（splitting/shuffling/augmentation/再加权）。\n\n**关键概念：** 实务红线单独记：先分辨「缺陷还是事实」，缺陷修数据，事实做业务解释。","s":"自编·1.3.3"},{"id":"D1-078","d":1,"t":"single","q":"内容安全筛查完成后，团队直接删掉了被剔除样本，没有留下任何记录。审计时无法解释数据来源。这个做法违反了哪条要求？","o":[{"l":"A","t":"没有违反任何要求，删除即可"},{"l":"B","t":"只需要记录剔除数量，原因属于敏感信息不能记录"},{"l":"C","t":"应该保留被剔除样本在训练集中，只是标记为不用"},{"l":"D","t":"筛查结果要留痕：剔除哪些、原因、比例都要记录，否则无法向审计或客户解释数据合规性"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 教材易错点原话：只扫一遍不记录——筛查结果要留痕（哪些被剔除、剔除原因、剔除比例），否则无法向审计或客户解释数据来源的合规性。留痕是「筛查可审计」的必要条件，也是合规材料的基本要求。\n\n**其他选项为什么错：**\n- A. 显然不成立，审计追问时无据可查\n- B. 剔除原因恰恰是审计最关心的内容，分类记录不涉及泄露敏感数据\n- C. 被剔除的有害样本留在训练集里（哪怕标记不用）仍有误用与泄漏风险，正确做法是隔离保存或销毁。\n\n**关键概念：** 完整性校验的闭环=筛（两层：训练前+推理时）+记（留痕）+审（可解释）。缺一环，合规叙事就断。","s":"自编·1.3.6"},{"id":"D1-079","d":1,"t":"single","q":"训练集里约 5% 的文本是同一模板改了几个词的近重复样本。这些样本对训练的主要影响是：","o":[{"l":"A","t":"显著增加过拟合风险，模型会记住重复样本而非学会规律；应做近似去重"},{"l":"B","t":"提升模型泛化能力，应保留"},{"l":"C","t":"没有影响，重复样本不参与梯度更新"},{"l":"D","t":"只影响训练速度，不影响效果"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 教材原文：训练集里 5% 的重复样本会显著增加过拟合风险——重复样本被多次学习，权重向这些模式倾斜，模型「记住」它们而非学到分布规律。去重的必要性常被低估。精确哈希去不了改词近重复，需 SimHash/MinHash 或向量相似度。\n\n**其他选项为什么错：**\n- B. 近重复不增加信息量，只会放大部分模式\n- C. 重复样本每次都会参与梯度更新，且因出现多次权重更大，说法错误\n- D. 效果影响恰恰是主要危害。\n\n**关键概念：** 两处场景一起记：训练集重复→过拟合；RAG 索引重复→检索结果雷同、挤掉有用内容。同一类问题（近重复）两种危害，同一类解法（MinHash 族）。","s":"自编·1.3.7"},{"id":"D1-080","d":1,"t":"multiple","q":"数据管道里存在字段缺失的情况，团队在讨论处理策略。以下哪些属于缺失值的合理处理方式？（选 2 项）","o":[{"l":"A","t":"缺失比例极低（<1%）且随机缺失时，直接删除这些行"},{"l":"B","t":"缺失率 >50% 且无业务含义的列，整列删除"},{"l":"C","t":"所有缺失值一律用 0 填充，保持数据完整"},{"l":"D","t":"任何缺失都必须用复杂模型填充，效果最好"}],"a":["A","B"],"e":"**正确答案：AB。**\n\n**为什么对：** A 是删除行的适用条件：缺失比例极低且随机，删行信息损失可忽略；B 是删列的适用条件：过半缺失且无业务含义，保留只会引入噪声。两条件的共同前提是「缺失是随机的、无信息的」。\n\n**其他选项为什么错：**\n- C. 填 0 在多数字段语义错误（0 常有独立含义），且掩盖了「缺失」这个状态\n- D. 「一律用模型填充」绝对化——模型填充引入模型误差且可能放大偏差，教材推荐顺序是先判断缺失机制：随机且量小删行、有信息量用缺失指示变量、有规律才考虑分组统计或模型填充。\n\n**关键概念：** 核心判断链：先问缺失随机吗→与目标相关则缺失本身是信号→指示变量+分组填充。","s":"自编·1.3.7"},{"id":"D1-081","d":1,"t":"single","q":"数据管道要把各类数据源按特性路由到不同摄取通道。以下哪个组合最合理？","o":[{"l":"A","t":"所有数据源统一走 Kinesis 实时流入湖"},{"l":"B","t":"业务库增量走 DMS CDC、点击流走 Kinesis、历史归档批量走 Glue 作业"},{"l":"C","t":"所有数据源统一每天 JDBC 全量导出"},{"l":"D","t":"业务库走 Kinesis、点击流走 DMS"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 摄取通道按数据特性匹配：数据库增量变更用 DMS CDC（读 binlog、低压力、分钟级）；持续产生的事件流（点击流、物联网）用 Kinesis（天然为流设计）；一次性历史归档与批量文件用 Glue/批量作业（吞吐优先）。\n\n**其他选项为什么错：**\n- A. 把数据库变更硬塞进事件流通道需要额外改造，CDC 能力反而被浪费\n- C. 全量导出延迟高、对源库压力大，是不懂数据特性的做法\n- D. 张冠李戴——Kinesis 吃不了 binlog 复制语义，DMS 不适合高吞吐点击流。\n\n**关键概念：** 答题钩子：题干问「组合/路由/按特性」，正确答案就是把三种特性（增量/流/批）各配各的通道的那个选项。","s":"自编·1.1.5"},{"id":"D1-082","d":1,"t":"single","q":"团队想追溯某个训练数据集的来源：它由哪些上游作业产出、经过哪些转换、被哪些模型使用。最应该建设的能力是：","o":[{"l":"A","t":"给数据集起更清晰的名字"},{"l":"B","t":"把所有数据搬到同一个桶里方便查找"},{"l":"C","t":"数据血缘（lineage）跟踪：记录数据从源到消费的完整链路"},{"l":"D","t":"要求每个分析师手工维护 Excel 台账"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 追溯「从哪来、经过什么、到哪去」正是数据血缘的定义。血缘是数据治理的基础设施：排障（上游坏了影响谁）、合规（PII 扩散到了哪）、影响分析（改字段会波及哪些模型）都靠它。AWS 生态里 Glue Data Catalog 的表级血缘与开源方案（OpenLineage 等）都可承载。\n\n**其他选项为什么错：**\n- A. 命名规范有价值但承载不了链路关系\n- B. 物理集中与逻辑追溯是两回事\n- D. 手工台账不可持续、更新必然滞后，是治理的反面教材。\n\n**关键概念：** 血缘与目录的分工记忆：Catalog 管「有什么」（元数据与发现），血缘管「怎么来的」（链路与依赖）。审计与排障类题干指向血缘。","s":"自编·1.1.3"},{"id":"D1-083","d":1,"t":"single","q":"训练数据集需要保留历史版本：模型评审时要求复现三个月前那次训练用的数据。最可靠的机制是：","o":[{"l":"A","t":"让团队成员各自备份一份数据到本地"},{"l":"B","t":"训练脚本里记录数据条数，用条数标识版本"},{"l":"C","t":"依赖上游源系统的日志还原"},{"l":"D","t":"S3 版本控制或按日期分区快照，配合数据集登记（版本号+日期+处理代码版本）"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 可复现性三要素：数据快照（S3 版本控制/分区快照）+登记信息（版本号、生成日期）+处理代码版本——三者对应才能精确复现。这也是数据集登记（data set registration）考点的内容：登记让「这次训练用了哪份数据」有据可查。\n\n**其他选项为什么错：**\n- A. 分散备份无一致性保障、且很快会失联\n- B. 条数相同不代表内容相同（更新一行条数不变），不能当版本标识\n- C. 源系统日志通常不覆盖下游转换逻辑，还原不完整。\n\n**关键概念：** 关联：与 Feature Store 的 event time 时间旅行互补——一个管数据集级复现，一个管特征级时点正确。考试问「复现/回溯/评审要旧数据」就选快照+登记。","s":"自编·1.1.2"},{"id":"D1-084","d":1,"t":"single","q":"对数变换处理「交易金额」字段时，发现部分值为 0、少量为负数（退款冲正）。直接取 log 会报错。正确的处理是：","o":[{"l":"A","t":"先用 log(1+x) 处理 0 值；负数按业务语义拆出或加常数平移（或用 Box-Cox/Yeo-Johnson 类变换）"},{"l":"B","t":"放弃对数变换，改用 min-max 归一化"},{"l":"C","t":"把负数删除，0 当作 1 处理"},{"l":"D","t":"对整个字段取绝对值后再取 log"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** log 的定义域问题有标准解法：0 值用 log(1+x)（教材案例原做法）；负数要先看业务语义——退款冲正是独立业务事件，常拆成单独特征或标志位，若必须保留在原字段则加常数平移，或选支持负值的 Yeo-Johnson 变换。\n\n**其他选项为什么错：**\n- B. 放弃 log 没必要，长尾问题还在，且归一化怕离群值\n- C. 直接删除负样本丢掉退款信号，0 当 1 是数值造假\n- D. 取绝对值把「退款」与「大额收入」混为一谈，制造语义污染。\n\n**关键概念：** 教材原话要点：对数变换「含 0 或负值时需先加常数或用 Box-Cox」。特征变换题先看值域再选手法，值域不满足就先修值域。","s":"自编·1.2.4"},{"id":"D1-085","d":1,"t":"single","q":"特征「城市」有 300 个取值，「收入水平」只有 3 档。给线性模型准备特征时，类别编码的正确选择是：","o":[{"l":"A","t":"两个字段都用整数编码（0,1,2,...）最省空间"},{"l":"B","t":"低基数用独热编码；高基数（如城市）考虑目标编码或嵌入，避免维度爆炸与虚假序关系"},{"l":"C","t":"两个字段都直接用字符串喂给模型"},{"l":"D","t":"城市按拼音排序编码，收入按档位顺序编码"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 类别编码的核心矛盾是基数：收入 3 档用独热（one-hot）干净无偏；城市 300 个取值做独热会造出 300 维稀疏列（维度爆炸），且整数编码会引入虚假的大小/顺序关系。高基数的标准方案是目标编码（target encoding）或学习型嵌入（embedding），并防范目标编码的目标泄漏（只用训练集统计）。\n\n**其他选项为什么错：**\n- A. 整数编码给无序类别强加了伪序，模型会学出「城市 299>城市 1」的荒谬关系\n- C. 多数传统模型不接字符串\n- D. 按拼音排序仍是伪序，与 A 同病。\n\n**关键概念：** 记忆：无序类别禁整数编码；独热适合低基数；高基数用目标编码/嵌入+防泄漏。","s":"自编·1.2.4"},{"id":"D1-086","d":1,"t":"single","q":"用 Managed Service for Apache Flink 与 Spark Structured Streaming 做流式聚合选型。业务要求严格的事件时间语义、复杂事件处理（CEP）与精确一次保证。更合适的是：","o":[{"l":"A","t":"Spark Structured Streaming，生态更成熟"},{"l":"B","t":"两者完全等价，按团队熟悉度选"},{"l":"C","t":"Managed Service for Apache Flink：事件时间语义、CEP 与精确一次是其强项"},{"l":"D","t":"AWS Lambda，事件驱动更轻量"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 教材三行对比表的对应关系：Flink 的差异化能力恰是「有状态、事件时间语义、精确一次」，且原生支持 CEP（复杂事件处理模式匹配）。题干三个关键词（事件时间+CEP+精确一次）逐一命中 Flink。\n\n**其他选项为什么错：**\n- A. Spark Structured Streaming 有状态、支持窗口与 join（微批聚合、流表 join 场景合适），但严格事件时间+CEP 组合不如 Flink 到位\n- B. 两者能力边界不同，等价说法错误\n- D. Lambda 无状态，直接出局。\n\n**关键概念：** 选型对位记忆：微批聚合/流表 join→Spark；严格事件时间/CEP/低延迟聚合/精确一次→Flink；逐条无状态→Lambda。","s":"自编·1.2.3"},{"id":"D1-087","d":1,"t":"single","q":"embedding 模型选型时，团队在 1536 维与 512 维两个模型间犹豫。除效果外，还应主要考虑什么成本因素？","o":[{"l":"A","t":"维度越高检索越准，成本可忽略，直接选 1536"},{"l":"B","t":"维度影响生成速度，不影响存储"},{"l":"C","t":"成本只与文档条数有关，与维度无关"},{"l":"D","t":"存储与检索成本约随维度×条数线性增长，降维是省成本的第一手段（很多模型支持输出维度可配）"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 向量成本公式：存储与检索开销 ∝ 维度 × 条数。1536 维比 512 维多 3 倍存储与索引开销，规模大时差距显著。很多模型支持输出维度可配（如 Titan Text Embeddings V2 可选 1024/512/256），教材把「降维」列为省成本第一手段。\n\n**其他选项为什么错：**\n- A. 「成本可忽略」不符合工程事实，向量库是 RAG 的持续性开销大头\n- B. 维度直接决定存储体积，说反了\n- C. 维度与条数都是成本乘数，缺一不可。\n\n**关键概念：** 实操策略：先用小样本对比 2–3 个模型的召回命中率（200 条真实查询），在效果可接受的前提下选低维；embedding 版本与分块策略一起记录。","s":"自编·1.2.5"},{"id":"D1-088","d":1,"t":"single","q":"要从扫描版 PDF 手册构建 RAG 知识库，需要保留标题层级与表格结构。抽取环节最合适的 AWS 服务是：","o":[{"l":"A","t":"Amazon Textract：带版面信息的文档抽取，能识别表格与布局"},{"l":"B","t":"Amazon Comprehend，抽取实体与关键词"},{"l":"C","t":"Amazon Rekognition，识别文档图片"},{"l":"D","t":"Amazon Polly，把文档读成语音"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** Textract 的定位就是「带结构的文档抽取」：从扫描件识别文本的同时保留表格、标题层级等版面信息（Layout/Tables API），这正是 RAG 分块「按文档结构切」的前提——结构信息在抽取环节保住，切块时才能按标题与表格整块处理。教材在 RAG 文档准备与文本预处理两节都点名 Textract。\n\n**其他选项为什么错：**\n- B. Comprehend 做 NLP 分析（实体/PII/语言），不做版面抽取\n- C. Rekognition 是图像/视频识别\n- D. Polly 是语音合成，完全无关。\n\n**关键概念：** 服务分工记忆：抽取结构用 Textract、文本理解用 Comprehend、批量预处理作业用 SageMaker Processing/Glue。扫描件+表格+层级三关键词锁定 Textract。","s":"自编·1.2.6"},{"id":"D1-089","d":1,"t":"single","q":"RAG 分块时遇到一份含宽表格的文档（表格跨多页）。以下哪种处理最合理？","o":[{"l":"A","t":"按固定 512 token 硬切，表格与其他内容一视同仁"},{"l":"B","t":"表格整块保留，或转成「表头+行」的文本化形式后再入库"},{"l":"C","t":"把表格拆成单行分别切块，检索更细粒度"},{"l":"D","t":"跳过表格内容，只索引正文段落"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 教材常见错误第 2 条点名「表格被按行切断：表头与数据分离后语义全失」——单独一行「0.85 | 34%」没有表头就是天书。解法两条路：整块保留（配结构元数据），或转成「表头+行」文本化（每行携带字段名），两者都让块独立可读。\n\n**其他选项为什么错：**\n- A. 固定硬切正是要避免的做法，表格必被切碎\n- C. 单行切块把表头与数据分家，检索出来的行无法解读\n- D. 丢掉表格等于丢掉文档里信息密度最高的部分。\n\n**关键概念：** 分块优先级第一句「结构>长度」在表格场景的落地就是本条；宽表跨页先在抽取阶段合并（Textract 可跨页识别表格）。","s":"自编·1.2.7"},{"id":"D1-090","d":1,"t":"single","q":"需要在 S3 海量对象中发现含个人敏感信息的文件，并生成发现报告。最合适的 AWS 服务是：","o":[{"l":"A","t":"Amazon EventBridge"},{"l":"B","t":"AWS Step Functions"},{"l":"C","t":"Amazon Macie"},{"l":"D","t":"Amazon QuickSight"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** Macie 是 S3 敏感数据发现服务：用机器学习与模式匹配扫描对象，自动识别 PII（身份证号、银行卡、密钥等）并生成发现报告，支持持续监控与告警。脱敏工作的第一步「找到敏感数据在哪」就是它的职责，教材在脱敏与数据安全节两次点名。\n\n**其他选项为什么错：**\n- A. EventBridge 是事件路由总线，不做内容识别\n- B. Step Functions 是流程编排\n- D. QuickSight 是 BI 可视化。\n\n**关键概念：** 脱敏工具链配套记忆：发现用 Macie、识别文本内 PII 用 Comprehend（PII 实体识别）、作业内转换用 Glue、推理侧拦截用 Bedrock Guardrails——四段各司其职，考题按动作对服务。","
