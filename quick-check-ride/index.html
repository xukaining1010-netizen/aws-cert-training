function renderStats() {
  const s = getStats();
  const el = document.getElementById('page-stats');
  let html = `<div class="header"><h1>📊 统计分析</h1></div>`;
  html += `<div class="stats-chart">
    <h3>总进度</h3>
    <div style="height:30px;background:var(--border);border-radius:15px;overflow:hidden">
      <div style="height:100%;width:${s.completion}%;background:var(--primary);border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600">${s.completion}%</div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--text2)">
      <span>已答 ${s.doneIds}/${QUESTIONS.length} 题</span>
      <span>正确率 ${s.acc}%</span>
    </div>
  </div>`;
  html += `<div class="stats-chart"><h3>各章节正确率</h3><canvas id="chartDomain"></canvas></div>`;
  html += `<div class="stats-chart"><h3>各题型正确率</h3><canvas id="chartType"></canvas></div>`;
  html += `<div class="stats-chart"><h3>详细数据</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>总题</th><th>已答</th><th>正确</th><th>正确率</th></tr></thead><tbody>`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${ds.total}</td><td>${ds.answered}</td><td>${ds.correct}</td><td style="color:${ds.acc>=70?'var(--correct)':'var(--wrong)'};font-weight:600">${ds.acc}%</td></tr>`;
  }
  html += `</tbody></table></div>`;
  el.innerHTML = html;
  setTimeout(() => {
    drawDomainChart(s);
    drawTypeChart(s);
  }, 50);
}

function drawDomainChart(s) {
  const c = document.getElementById('chartDomain');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = DOMAIN_KEYS.map(k=>'D'+k);
  const colors = ['#4361ee','#4cc9f0','#06d6a0','#f8961e','#9b5de5'];
  const barW = (W-80) / (labels.length*1.5);
  labels.forEach((l,i)=>{
    const val = s.domainStats[i+1].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(l, x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

function drawTypeChart(s) {
  const c = document.getElementById('chartType');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = ['单选','多选'];
  const keys = ['single','multiple'];
  const colors = ['#4361ee','#4cc9f0'];
  const barW = (W-80) / 4;
  keys.forEach((k,i)=>{
    const val = s.typeStats[k].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

/* roundRect polyfill */
if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(r>w/2) r=w/2;
    if(r>h/2) r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    return this;
  };
}

/* ================================================================
   ===================== 工具函数 ==================================
   ================================================================ */
function exportData() {
  const data = {
    answers: getAnswers(),
    wrong: getWrong(),
    progress: getProgress(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${LS_PREFIX}-quiz-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.answers) setAnswers(data.answers);
        if(data.wrong) setWrong(data.wrong);
        if(data.progress) setProgress(data.progress);
        alert('数据导入成功！');
        navigate(currentPage);
      } catch(err) { alert('数据格式错误，请检查文件。'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetData() {
  showModal('确认重置', '确定要清除所有答题记录、错题集和进度吗？此操作不可恢复！', () => {
    localStorage.removeItem(LS_ANSWERS);
    localStorage.removeItem(LS_WRONG);
    localStorage.removeItem(LS_PROGRESS);
    navigate('dashboard');
  });
}

/* ================================================================
   ===================== 模态框 ====================================
   ================================================================ */
let modalCallback = null;
function showModal(title, text, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOverlay').classList.add('show');
  modalCallback = onConfirm;
  document.getElementById('modalConfirmBtn').onclick = () => {
    closeModal();
    if(modalCallback) modalCallback();
  };
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

/* ================================================================
   ===================== 主题切换 ==================================
   ================================================================ */
function toggleTheme() {
  document.getElementById('quizView').classList.toggle('dark');
  localStorage.setItem(LS_PREFIX+'_theme', document.getElementById('quizView').classList.contains('dark')?'dark':'light');
  navigate(currentPage);
}

/* ================================================================
   ===================== 初始化 ====================================
   ================================================================ */
function init() {
  if(localStorage.getItem(LS_PREFIX+'_theme')==='dark') document.getElementById('quizView').classList.add('dark');
  const pages = ['dashboard','quiz','wrongbook','stats','settings'];
  const app = document.getElementById('app');
  pages.forEach(p => {
    const div = document.createElement('div');
    div.id = 'page-'+p;
    div.className = 'page' + (p==='dashboard'?' active':'');
    app.appendChild(div);
  });
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => { if(btn.dataset.page==='learn'){ if(window.kbShowLearnHome) window.kbShowLearnHome(); } else navigate(btn.dataset.page); });
  });
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', init);

":[{"l":"A","t":"没问题，随时可以改"},{"l":"B","t":"Authentication Method 一旦选定不可更改，开通前必须谨慎评估"},{"l":"C","t":"付费升级后即可更改"},{"l":"D","t":"每年可以更改一次"}],"a":"B","e":"① 答案：B。② 原厂多处强调：认证方式选定后不可更改（permanent），启用前须调研确认最佳方案。③ 点破：A/C/D 均与该硬限制相悖。④ 溯源：identity-sso 注意事项 + enterprise-handbook Step 0 注意事项。"},{"id":"dep-5","d":1,"t":"多选","q":"Quick Desktop 对 IdP 的 OIDC 硬性要求包括哪些？（多选）","o":[{"l":"A","t":"Public Client（不使用 client_secret）+ PKCE(S256)"},{"l":"B","t":"offline_access（签发 Refresh Token 维持长期会话）"},{"l":"C","t":"标准 OIDC 端点（Discovery/Authorization/Token/JWKS）与 email claim"},{"l":"D","t":"IdP 必须部署在 AWS 中国区"}],"a":"ABC","e":"① 答案：A/B/C。② 若 IdP 无法满足，可部署 Keycloak 作桥接 IdP。③ 点破：D 无此要求——Quick 服务部署在亚马逊云科技国际区域，但 IdP 可在企业本地环境。④ 溯源：identity-sso §1.1 硬性要求清单。"},{"id":"dep-6","d":1,"t":"单选","q":"情境：某集团用芯盾 CAS 作 IdP，不支持 OIDC Public Client + PKCE，Desktop 认证返回 401。按原厂踩坑案例的最终解法是？","o":[{"l":"A","t":"放弃 Desktop，只用网页版"},{"l":"B","t":"部署 Keycloak 作为中间层桥接（把现有 IdP 作为 Keycloak 的身份认证 Provider）"},{"l":"C","t":"把 Desktop 降级到旧版本"},{"l":"D","t":"修改 Quick 服务端配置放宽协议要求"}],"a":"B","e":"① 答案：B。② 案例 1（2 万+ 员工集团）：换 MaxKey 同样不支持，最终部署 Keycloak 解决。③ 点破：A 是回避问题；C 无此版本机制；D 客户端协议要求不可改。④ 溯源：enterprise-handbook Step 4 案例 1 + identity-sso §1.1。"},{"id":"dep-7","d":1,"t":"单选","q":"IAM Identity Center 不直接提供 OIDC。原厂「IDC 用户直登 Desktop」方案的桥接思路是？","o":[{"l":"A","t":"把 IAM Identity Center 配置为 Amazon Cognito 的外部 SAML Provider"},{"l":"B","t":"把 Cognito 配置为 IDC 的外部 Provider"},{"l":"C","t":"在 Desktop 内置一个 OIDC 服务器"},{"l":"D","t":"要求客户改用 Okta"}],"a":"A","e":"① 答案：A。② 效果：一次 IDC 登录两端通用；用户首次登录时 Cognito 自动创建用户（JIT Provisioning），无需 SCIM 同步。③ 点破：B 方向反了；C/D 无依据。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 文档目的与工作原理。"},{"id":"dep-8","d":1,"t":"单选","q":"Cognito 桥接方案中为什么需要 API Gateway + Lambda 代理层？","o":[{"l":"A","t":"为了界面汉化"},{"l":"B","t":"Cognito 不支持 Quick Desktop 请求中的 offline_access 参数，代理层在转发前剥离该参数，对客户端完全无感"},{"l":"C","t":"为了计费统计"},{"l":"D","t":"为了加速网络访问"}],"a":"B","e":"① 答案：B。② Cognito 不识别 offline_access 会报错；剥离后 Refresh Token 续期机制照常工作。③ 点破：A/C/D 均无依据。④ 溯源：iam-idc 方案前提条件 + 方案总结「透明代理层」。"},{"id":"dep-9","d":1,"t":"单选","q":"情境：一位员工已加入 Quick 用户组并激活（成为活跃用户），随后被移出组。关于计费，正确的是？","o":[{"l":"A","t":"立即停止计费"},{"l":"B","t":"移出组后置为非活跃用户，本月费用继续收取，次月第一天自动移除"},{"l":"C","t":"永久保留计费"},{"l":"D","t":"需要管理员手动删除后才停止计费"}],"a":"B","e":"① 答案：B。② 机制：活跃用户订阅类型=所在组（可多组）对应的最大权限订阅；首次激活后即使连续数月不登录仍计费。③ 点破：A/C 与官方口径相反；D 无需手动操作。④ 溯源：iam-idc「Quick 的订阅费用」。"},{"id":"dep-10","d":1,"t":"单选","q":"情境：客户通过 IAM Federation 直连，误将部分用户升为 ADMIN_PRO，想降回 READER_PRO 省费用。按踩坑案例，正确说法是？","o":[{"l":"A","t":"控制台直接降级即可"},{"l":"B","t":"UpdateUser API 设计上不支持角色降级；只能 delete-user → register-user 重建，且该用户 Desktop 个人数据会丢失——有角色调整需求应优先选 IAM Identity Center + Group 管理"},{"l":"C","t":"降级会自动保留全部个人数据"},{"l":"D","t":"在 IdP 里改 Role 即可实现无损降级"}],"a":"B","e":"① 答案：B。② IAM Federation 模式没有 Group 管理机制；误升级 Pro 还可能触发账户级 $250/月基础设施费且无法通过降级取消。③ 点破：A/C/D 均与案例结论相反。④ 溯源：enterprise-handbook Step 4 案例 4 + 最佳实践第 9 条。"},{"id":"dep-11","d":1,"t":"单选","q":"Quick Desktop 的本地应用数据、配置与文件夹权限存储在哪个目录？","o":[{"l":"A","t":"~/.quickwork/（macOS）或 %USERPROFILE%\\.quickwork\\（Windows）"},{"l":"B","t":"~/.quickconfig/"},{"l":"C","t":"~/.aws/quick/"},{"l":"D","t":"C:\\Program Files\\Amazon Quick\\data"}],"a":"A","e":"① 答案：A。② 对话、记忆、知识图谱不存于该目录；安装排障时删除该目录后重装是官方建议步骤。③ 点破：其余为路径杜撰/变形。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 Data storage + quickstart FAQ「安装后打不开怎么办」。"},{"id":"dep-12","d":1,"t":"单选","q":"员工离职时的数据彻底清除需求，Quick 提供的官方机制是？","o":[{"l":"A","t":"无清除机制"},{"l":"B","t":"Settings → Advanced 选项卡的 Clear all data——不可逆地移除全部对话、知识图谱数据、已保存凭据与偏好设置"},{"l":"C","t":"仅管理员可在云端远程抹除"},{"l":"D","t":"删除应用即自动清除云端数据"}],"a":"B","e":"① 答案：B。② 该机制可作为「数据可清除」的合规佐证，但操作不可逆，执行前须明确告知。③ 点破：A 与文档相反；C/D 无依据。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 Clearing all data。"},{"id":"dep-13","d":1,"t":"多选","q":"企业部署 Quick Desktop 时，防火墙/代理需放行的域名类别包括？（多选）","o":[{"l":"A","t":"*.quicksight.aws.amazon.com（Web 控制台与资源发现）"},{"l":"B","t":"*.dp.appintegrations.*.prod.plato.ai.​aws.dev（数据面：推理/流式/搜索）"},{"l":"C","t":"*.cloudfront.net（远程配置与应用更新）"},{"l":"D","t":"*.internal-corp.local（企业内网公告系统）"}],"a":"ABC","e":"① 答案：A/B/C。② 另有 cognito-identity.*.amazonaws.com（遥测）与客户专属 IdP 域名（如 login.microsoftonline.com）。③ 点破：D 与 Quick 无关（杜撰域名）。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 Network access and required domains 表。"},{"id":"dep-14","d":1,"t":"单选","q":"企微远程 MCP 方案（wecom-mcp-on-agentcore）相对直接用企业微信官方 MCP URL 的关键差异是？","o":[{"l":"A","t":"工具数量更多"},{"l":"B","t":"每次调用以「发起者本人」的企微身份执行，审计可追到人、可见范围按人收敛；官方 URL 以共用机器人执行，审计追不到人"},{"l":"C","t":"完全免费"},{"l":"D","t":"不需要任何授权"}],"a":"B","e":"① 答案：B。② 本服务每用户独立凭证、独立 KMS 加密；读取类权限收敛由企微平台强制兜底。③ 点破：A 无比较口径；C/D 无依据（该方案为第三方开源项目，对客户承诺前须先真实环境验证）。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §一/§二对比表。"},{"id":"dep-15","d":1,"t":"多选","q":"按原厂 IdP 满足度实测表，以下哪些 IdP 满足 Quick Desktop 的全部 OIDC 硬性要求？（多选）","o":[{"l":"A","t":"Okta"},{"l":"B","t":"Microsoft Entra ID"},{"l":"C","t":"Keycloak"},{"l":"D","t":"飞书（原生平台）"}],"a":"ABC","e":"① 答案：A/B/C——实测五项（Public Client/PKCE/offline_access/OIDC Discovery/email claim）全满足；另有 PingIdentity、钉钉 IDaaS、派拉、Casdoor 等（Casdoor 实测 Token 格式不兼容不可用）。② 飞书原生平台五项全不满足，需 Keycloak 作桥接 IdP。③ 点破：D 恰是不满足的典型。④ 溯源：identity-sso §1.1 IdP 满足程度统计表。"}],"sections":[{"h":"1.1 Quick 是什么与账号开通","body":"Amazon Quick 是 AWS 推出的 AI 工作助手。你每天的工作分散在邮件、日历、聊天、CRM、文档等几十个工具里。Quick 把它们串在一处。它能学习什么对你最重要，基于你真实的业务数据回答问题。不止于回答：它还能安排日程、制作文档和演示文稿、创建数据仪表盘、自动化重复工作流，甚至代你执行操作。\n\nQuick 提供多种使用方式。个人用户最快的上手路径是 Desktop 客户端。从注册到跑通核心功能只需十分钟。\n\n#### 注册与账号计划\n\n前往 quick.aws.com 即可注册。注册不需要 AWS 账号，不需要信用卡，也不需要 IT 部门介入。支持邮箱注册，也支持 Google、Apple、GitHub、Amazon 四种社交账号登录。\n\n每个新用户注册后自动获得 30 天 Plus 免费试用。试用期内可完整体验 Desktop 所有功能。试用结束后可选择继续订阅 Plus 或降级为 Free 计划。Free 计划本身不包含 Desktop。\n\n举个场景：你是刚入职的产品经理，想试试 Quick 能不能帮你消化上周几十封邮件。只需用公司邮箱注册，三分钟后就能打开 Desktop 开始工作。无需走采购流程。\n\n#### 下载与安装\n\nmacOS 需要 13（Ventura）及以上版本。仅支持 Apple Silicon（M1/M2/M3/M4）。不支持 Intel Mac。Windows 需要 10 64-bit（version 1903）及以上。macOS 下载 .dmg 拖入 Applications 即可。Windows 下载 .exe 按提示完成安装。\n\n如果系统弹出安全提示：macOS 到「系统设置 → 隐私与安全性」点击「仍要打开」；Windows 点击「更多信息 → 仍要运行」。安装后需要联网才能使用。登录、AI 推理和连接外部服务时都需要网络。\n\n#### 常见误区与易错点\n\n- 以为需要 AWS 账号才能用 Quick。个人版完全不需要，邮箱注册即可。\n- 在 Intel Mac 上安装后打不开。Desktop 仅支持 Apple Silicon。\n- 试用结束不付费以为数据会丢失。降级为 Free 后仍可用网页版，但 Desktop 不再可用。\n- 安装时被系统安全提示吓退。macOS 和 Windows 都有标准的放行操作。\n- 以为 30 天试用从首次打开 Desktop 才开始计算。实际注册即开始计时。\n\n#### 记忆要点\n\n- 注册三要素：不需要 AWS 账号、不需要信用卡、不需要 IT 介入。\n- 新用户自动获得 30 天 Plus 免费试用。试用结束自动降级为 Free。\n- macOS 仅支持 Apple Silicon（M1 及以上）。Windows 最低 10 64-bit。\n- Free 计划不包含 Desktop。Desktop 需要 Plus 或以上订阅。\n- 个人版与企业版是两条独立路径。个人版在 quick.aws.com 注册，企业版由管理员在 AWS 控制台开通。"},{"h":"1.2 Desktop 与 Web 双端形态","body":"Amazon Quick 有两种使用形态：Web 端和 Desktop 端。两端面向同一个用户身份，但能力范围不同。\n\n**Web 端**打开浏览器就能用。核心能力包括 Spaces（协作空间）、Chat Agent（自定义对话代理）和 Flows（自动化工作流）。还有数据集与仪表盘、Apps（轻量应用）和 Deep Research（深度研究）。Web 端也是管理员配置 SSO 和管理用户订阅的入口。\n\n**Desktop 端**安装在本地电脑上，除了继承 Web 端能力外，还有三项独占能力。\n\n- **知识图谱（Knowledge Graph）**：从邮件、日历、聊天和本地文件中自动提取实体，如人、项目、团队和文档，构建你的个人工作关系网络。\n- **记忆（Memory）**：让 Quick 记住你的偏好，你纠正它一次，它就记住。\n- **本地文件索引**：让 Quick 可以直接读取你电脑上授权的文件夹。\n\n这三项数据全部存储在本地，不上传到云端。\n\nDesktop 还支持浏览器自动化和 MCP Server 扩展。浏览器自动化可以打开并操控你的 Chrome 代你操作网页。MCP（Model Context Protocol，模型上下文协议）让 Quick 接入第三方工具和服务。\n\n#### 双端数据同步\n\nSpaces、仪表盘和设置在两端之间同步。知识图谱和记忆是 Desktop 独有功能，数据存在本地。对话历史、文件索引也存储在本地，不上传到云端，不用于模型训练。\n\n举个场景：你在 Web 端创建了一个分析仪表盘并分享给同事。回到 Desktop 打开后一样看得到。但你在 Desktop 上让 Quick 记住「我写邮件默认用中文」，这条记忆只存在本地。\n\n所有「写入操作」都需要你明确批准后才会执行。比如发邮件、更新 CRM、发消息，Quick 都会先让你确认。这个机制叫 Human-in-the-Loop。\n\n#### 常见误区与易错点\n\n- 以为 Desktop 只是 Web 的离线壳。实际上知识图谱、记忆、本地文件索引都是 Desktop 独有能力。\n- 以为断网也能完整使用。AI 推理和发送消息等功能需要网络。本地文件搜索和已缓存知识图谱可以离线。\n- 混淆个人版登录与企业版登录。个人版选「Continue with」加登录方式；企业版选「Enterprise login」。\n- 以为两端的订阅是分开购买的。同一个账号，同一份订阅。\n\n#### 记忆要点\n\n- Desktop 独有三件套：知识图谱、记忆、本地文件索引。均存本地不上云。\n- Web 端是管理员配置 SSO 和 Extension 的唯一入口。\n- 写入操作需要用户明确批准后才会执行。\n- Desktop 支持 MCP 协议扩展第三方工具。Web 端通过 Connectors 页面创建团队级连接器。\n- 两端通过 email 识别同一个人。Web 和 Desktop 使用的邮箱必须一致。"},{"h":"1.3 身份体系与 SSO 集成","body":"企业部署 Amazon Quick 时，最核心的一步是身份体系集成。目标是让员工用公司账号统一登录 Web 和 Desktop。Quick Web 走 SAML 协议认证。Quick Desktop 走 OIDC + PKCE 协议认证。两端最终都按 email 解析到账户内的同一个用户。email 是双方身份集成的锚点。\n\n#### 三种 Web SSO 集成方式\n\nQuick Web 支持三种认证接入。\n\n第一种是 IAM Identity Center 桥接方式，也是推荐方式。适用于没有使用过 QuickSight 也没有设置过 IAM Federation 的新客户。IdP 通过 SCIM 将用户同步到 IAM Identity Center。再由 Identity Center 完成组与订阅的映射。认证方式一旦选定不可更改。\n\n第二种是 IAM Federation 直连方式。适合已设置 IAM Federation 并启用过 QuickSight 的客户。省略了 SCIM 同步，但需要在 IdP 中配置组与 IAM Role 的映射关系。用户角色只能升不能降，这是 API 硬限制。\n\n第三种是 AWS Managed AD 变通方式。适合在云上已部署 AWS Managed AD 的重度客户。Quick Web 直接与 AD 集成认证。但 Web 和 Desktop 的登录过程是割裂的，需要登录两次。\n\n#### Desktop 对 IdP 的硬性要求\n\nDesktop 端对身份提供商有五项必须满足的条件。\n\n1. **支持 Public Client**：即无 client_secret。\n2. **支持 PKCE**（S256 方式）。\n3. **支持 offline_access scope**：用于签发 Refresh Token 维持长期会话。\n4. **提供标准 OIDC 端点**：包括 Discovery、Authorization、Token 和 JWKS。\n5. **token 中包含 email claim**。\n\n实测中，Okta、Entra ID、PingIdentity 和 Keycloak 均满足全部五项。派拉和钉钉 IDaaS 也满足。飞书原生平台和集成平台 Anycross 均不满足。遇到不满足的 IdP，可以部署 Keycloak 作为中间层桥接。\n\n#### 决策路径\n\n选型前需考虑三个因素：\n\n1. 客户 IdP 是否满足 Desktop OIDC 要求？\n2. 客户是否已使用 QuickSight？\n3. 客户是否在云上部署了 AWS Managed AD？\n\n如果没有特殊原因，推荐方式一。\n\n举个场景：某大型集团使用芯盾 CAS 作为 IdP。该 IdP 不支持 OIDC Public Client + PKCE，导致 Desktop 认证返回 401。尝试更换 MaxKey 后同样不支持。最终部署 Keycloak 作为中间层解决。教训是部署前务必先确认 IdP 是否满足五项硬性要求。\n\n#### 关键注意事项\n\n认证方式一旦在 AWS 控制台选定后不可更改。Extension Access 的 OIDC 端点字段创建后也不可编辑，填错只能删除重建。Web 和 Desktop 必须使用同一个 email。建议先配 Web SSO 确认成功后，再配 Desktop SSO。先小范围 PoC 验证全链路再全面推广。\n\n#### 常见误区与易错点\n\n- 以为认证方式选错了可以改。Authentication Method 一旦选定永久不可更改。\n- Desktop 连不上就怀疑网络。应先确认 IdP 是否满足五项 OIDC 硬性要求。\n- 以为飞书原生平台可以直接对接 Desktop。飞书不满足 OIDC 要求，需 Keycloak 桥接。\n- IAM Federation 模式下以为用户角色可以降级。API 硬限制只能升不能降。误升级后只能删除用户再重建，用户数据会丢失。\n- Extension Access OIDC 端点填错后想编辑。不可编辑，只能删除重建。\n\n#### 记忆要点\n\n- Web SSO 三种方式。Identity Center 桥接、Federation 直连、Managed AD 变通。\n- Desktop 五项 IdP 硬性要求缺一不可。Public Client、PKCE、offline_access、Discovery、email claim。\n- 认证方式和 Extension Access OIDC 端点一旦选定均不可更改。\n- 不满足 IdP 要求时的保底方案：部署 Keycloak 作为中间层。\n- 三处邮箱必须完全一致：IdP、Identity Center、Quick。"},{"h":"1.4 Identity Center 直登 Desktop 与订阅","body":"很多客户希望 Desktop 能直接用 IAM Identity Center 用户登录。但 Identity Center 本身不暴露 OIDC 端点，Desktop 无法直连。原厂给出的桥接思路：把 Identity Center 配成 Cognito 的外部 SAML Provider。\n\n#### 方案工作原理\n\n用户在 Desktop 发起登录。系统首先完成 Quick Web 的 Identity Center 登录。然后 Desktop 向 Cognito 发起认证请求。Cognito 将请求重定向到 Identity Center。由于用户已在 Web 登录过，直接获得会话 Token。Desktop 完成认证。整个过程中 Cognito 几乎是隐式存在，用户感觉不到。\n\n#### 三阶段部署\n\nPhase I 构建 Identity Center 和 Cognito。在 Organization 账号中启用 IAM Identity Center，创建用户组。通过 CDK 部署 Cognito User Pool 加 API Gateway 加 Lambda 代理层。代理层的作用是剥离 Desktop 请求中的 offline_access 参数。Cognito 本身支持 Token 刷新但不识别该参数，不剥离会报错。\n\nPhase II 启用 Quick 服务。在 AWS 控制台选择 IAM Identity Center 认证方式，完成组与订阅的映射。\n\nPhase III 创建 Desktop Extension。在 Quick Web 管理页面添加 Extension Access，填入 CDK 输出的端点信息。下载安装客户端，选择「Continue with SSO」完成登录。\n\n#### 订阅与计费\n\n用户首次登录时自动产生订阅，成为活跃用户。订阅类型按所在组对应的最大权限设置。用户被激活后即使连续数月不登录，仍为活跃状态并被计费。将用户移出组后变为非活跃用户。非活跃用户持续收取本月费用，次月第一天被自动移除。\n\n前提条件要注意：Identity Center 必须是 Organization 级别实例。Account Level 实例不行。建议 Identity Center 和 Cognito 配置在同一个 AWS 账号中。\n\n#### 常见误区与易错点\n\n- 以为 Identity Center 可以直接对接 Desktop。它不暴露 OIDC 端点，必须经 Cognito 桥接。\n- CDK 部署的代理层觉得可以省略。不做代理层，offline_access 参数会导致 Cognito 报错。\n- 以为用户不登录就不计费。首次激活后即使不再登录仍为活跃状态并计费。\n- Phase 顺序随意调整。必须先搭 Identity Center 加 Cognito。再启用 Quick Web。最后建 Extension。\n\n#### 记忆要点\n\n- 核心架构四级跳。Identity Center → Cognito → Gateway/Lambda → Desktop。\n- Identity Center 必须是 Organization 级别实例。\n- 用户首次登录即产生订阅并开始计费。移出组后次月第一天才停止。\n- Cognito 代理层不可省略。它剥离 Desktop 的 offline_access 参数。"},{"h":"1.5 安全架构与数据边界","body":"客户评估 Amazon Quick 时最常问三个问题：数据放哪？会不会被拿去训练模型？管理员能控到什么程度？官方文档给出了明确回答。\n\n#### 数据处理与存储\n\nAmazon Quick 在云端运行。你的对话、记忆、知识图谱、Agent 产生的文件以及可搜索内容的索引，按用户隔离存储在你的 Quick 账户中。Desktop 应用仅在本地存储运行所需数据：应用配置、授权文件夹设置、本地 MCP 配置和登录凭证。登录凭证保存在操作系统的凭证保险库中。本地数据存放在 macOS 的 ~/.quickwork/ 或 Windows 的对应目录下。\n\n你的数据不会被用于 AI 模型训练。无论是 Free 还是付费计划，AWS 都不会使用你的数据训练模型。这一点在官方文档中明确声明。\n\n#### 权限模型\n\n文件夹权限方面，Quick 使用操作系统级沙箱控制文件访问。只访问你明确授权的文件夹，你随时可以撤销。每个文件夹可独立控制关键词搜索、语义搜索和知识图谱提取。\n\n系统工具权限方面，Quick 对三类能力使用相同的权限模型。这三类是：系统工具、第三方连接器和本地工具。每项支持三级权限：始终允许、每次询问和始终拒绝。还支持细粒度的逐操作控制。Quick 存储你的权限选择，并在代理代你执行操作时一致应用。\n\n#### 连接安全与隐私控制\n\n连接外部服务时使用 OAuth 2.0 认证。Quick 不会看到或存储你的第三方密码。每个服务独立管理。断开或重连任一服务不影响其他服务。Quick 只请求每个服务所需的最小权限。\n\n隐私控制方面，你可以控制 Quick 是否从对话中学习、是否搜索历史、是否从服务中提取实体。你可以查看、编辑和删除单条记忆。如需完全重置，使用 Settings → Advanced → Clear all data。该操作不可逆，会移除所有对话、知识图谱数据、凭证和偏好。\n\n#### 企业网络部署\n\n在受限网络环境中，需要将 Quick 所需域名加入白名单。主要类别包括 Quick 控制台域名、数据平面域名、企业网关域名、远程配置与更新域名和遥测域名。还需要加入客户自己的身份提供商域名。对于无法使用通配符的严格代理环境，首次登录后可获取账户特定的主机名。如果企业做 TLS 流量检查，必须将 Quick 域名排除在检查之外，否则连接会失败。\n\n举个场景：某金融科技公司有 100 多个 Desktop 用户。企业网络下随机出现连接错误，用 5G 直连则正常。排查发现是 IdP 使用 opaque token 而非 JWT。它与 Quick 的 token 刷新机制不兼容。切换到支持 JWT 的 IdP 并补全网络白名单后解决。\n\n#### 常见误区与易错点\n\n- 以为 Quick 会用对话数据训练模型。官方明确声明不会，无论何种计划。\n- 以为「Clear all data」可以撤销。该操作不可逆，会彻底清除所有数据。\n- 以为授权一个文件夹后 Quick 能读取整台电脑。沙箱隔离，只访问授权文件夹。\n- 部署时忘记配网络白名单导致 Desktop 连不上。企业环境须将所有端点加入白名单。\n\n#### 记忆要点\n\n- 数据不用于模型训练。官方文档明确声明，无论何种计划。\n- 对话和知识图谱按用户隔离存储在 Quick 账户中。本地仅存配置和凭证。\n- 三级权限模型：始终允许、每次询问、始终拒绝。适用于系统工具、连接器和本地工具。\n- 连接第三方服务走 OAuth 2.0。不存第三方密码，最小权限原则。\n- Clear all data 不可逆。移除全部对话、知识图谱、凭证与偏好。"}]},{"domain":2,"name":"产品功能 FEATURE","weight":"25%","practiceCount":15,"practice":[{"id":"feat-1","d":2,"t":"多选","q":"在 quick.aws.com 注册 Amazon Quick 个人账号，以下哪些东西是【不需要】的？（多选）","o":[{"l":"A","t":"AWS 账号"},{"l":"B","t":"信用卡"},{"l":"C","t":"IT 部门介入"},{"l":"D","t":"可用的登录方式（邮箱或 Google/Apple/GitHub/Amazon 账号）"}],"a":"ABC","e":"① 答案：A/B/C——原厂明确「不需要 AWS 账号、不需要信用卡、不需要 IT 部门介入」。② 名词：quick.aws.com 是 Quick 个人版注册入口；登录方式支持邮箱、Google、Apple、GitHub、Amazon 五种。③ 点破：D 错——注册必须选择一种登录方式，并非什么都不要。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §1.1 注册方式。"},{"id":"feat-2","d":2,"t":"单选","q":"每个新用户注册 Amazon Quick 后，自动获得多长的 Plus 免费试用？","o":[{"l":"A","t":"7 天"},{"l":"B","t":"14 天"},{"l":"C","t":"30 天"},{"l":"D","t":"90 天"}],"a":"C","e":"① 答案：C，30 天，试用期内可完整体验 Desktop 所有功能。② 名词：Plus=Quick 个人付费计划档位，Desktop 客户端功能包含在内。③ 点破：7/14/90 天均为常见试用时长的数值变形，原厂口径是 30 天。④ 溯源：quickstart §1.2 账号计划。"},{"id":"feat-3","d":2,"t":"单选","q":"情境：同事的 30 天 Plus 试用结束，他决定先不付费。以下关于他账号状态的说法，正确的是？","o":[{"l":"A","t":"Desktop 客户端功能不可用，但仍可继续使用网页版"},{"l":"B","t":"Desktop 与网页版同时停用"},{"l":"C","t":"Desktop 保留全部功能但变为只读"},{"l":"D","t":"可申请延长试用 30 天"}],"a":"A","e":"① 答案：A。② 名词：Free 计划=试用结束后的降级档，本身不包含 Desktop。③ 点破：B 错——Free 仍可用网页版；C 错——Free 不含 Desktop，无只读一说；D 错——无延期试用机制。④ 溯源：quickstart FAQ「试用结束后不付费会怎样」。"},{"id":"feat-4","d":2,"t":"单选","q":"以下哪台电脑【无法】安装 Amazon Quick Desktop？","o":[{"l":"A","t":"MacBook Pro (M3 芯片)"},{"l":"B","t":"MacBook Air (M2 芯片)"},{"l":"C","t":"Mac mini (M4 芯片)"},{"l":"D","t":"2019 款 Intel 处理器 MacBook Pro"}],"a":"D","e":"① 答案：D——Desktop 仅支持 Apple Silicon（M1/M2/M3/M4），不支持 Intel Mac；系统要求 macOS 13 (Ventura) 及以上。② 点破：A/B/C 均为 Apple Silicon 机型，满足要求。③ 溯源：quickstart FAQ「支持哪些 Mac 机型」。"},{"id":"feat-5","d":2,"t":"单选","q":"在 Quick Desktop 中通过 MCP Server 扩展连接更多工具，正确的入口路径是？","o":[{"l":"A","t":"Settings → Customization → Browser"},{"l":"B","t":"Settings → Capabilities → Connections → Advanced Integrations →「+ Add MCP / Skill」"},{"l":"C","t":"Settings → My Context → Memory"},{"l":"D","t":"顶部栏 Agents 图标 → 创建新任务"}],"a":"B","e":"① 答案：B。② 名词：MCP=Model Context Protocol（模型上下文协议），用于扩展连接第三方工具与服务。③ 点破：A 是浏览器自动化设置路径；C 是记忆管理入口；D 是定时任务入口——均为同产品内真实存在的其他路径（主体错置干扰）。④ 溯源：quickstart §3.2.1。"},{"id":"feat-6","d":2,"t":"单选","q":"情境：你希望 Quick 代你打开公司内部系统页面查数据，且不想每次重新登录。应如何设置浏览器自动化？","o":[{"l":"A","t":"让 Quick 每次重新输入账号密码"},{"l":"B","t":"在 Settings → Customization → Browser 选择「Use my Chrome」，用你的 Chrome Profile 保留登录状态"},{"l":"C","t":"先断开所有连接器再操作"},{"l":"D","t":"Quick 无法访问需要登录的网页"}],"a":"B","e":"① 答案：B。② 名词：Chrome Profile=浏览器用户配置文件，包含登录态（Cookies）。③ 点破：A 违背「保留登录态」的产品设计；C 无关；D 错——官方示例场景就是代查内部系统并截图。④ 溯源：quickstart §4.6 浏览器自动化。"},{"id":"feat-7","d":2,"t":"单选","q":"使用 Quick Desktop 的定时任务（Scheduled Agents）时，必须满足什么前提？","o":[{"l":"A","t":"Desktop 应用保持运行状态"},{"l":"B","t":"Chrome 浏览器保持打开"},{"l":"C","t":"连接外接显示器"},{"l":"D","t":"每次到点手动点击触发"}],"a":"A","e":"① 答案：A——原厂注意事项明确「定时任务需要 Desktop 应用保持运行状态」。② 名词：Scheduled Agents=按计划在后台自动执行任务的代理。③ 点破：B 是小红书实验里浏览器自动化的前提，不是定时任务的（主体错置）；C/D 无依据。④ 溯源：quickstart §4.4。"},{"id":"feat-8","d":2,"t":"多选","q":"以下哪些工具属于 Quick Desktop【原生支持】直接连接（无需通过 MCP 扩展）？（多选）","o":[{"l":"A","t":"Slack"},{"l":"B","t":"Microsoft Teams"},{"l":"C","t":"Salesforce"},{"l":"D","t":"飞书"}],"a":"ABC","e":"① 答案：A/B/C。② 原生支持 50+ 集成：Microsoft Outlook、Gmail、Google Calendar、Slack、Microsoft Teams、Salesforce、本地文件等。③ 点破：D 错——Quick 原生没有飞书集成，需通过 MCP 接入（零代码或自建远程 MCP 两条路径）。④ 溯源：quickstart FAQ「能连接哪些工具」+ 《Amazon Quick 伙伴学习材料汇总》内材料 §一。"},{"id":"feat-9","d":2,"t":"单选","q":"关于数据隐私，以下说法符合 Quick 官方口径的是？","o":[{"l":"A","t":"Free 计划的数据会被用于模型训练，付费计划不会"},{"l":"B","t":"无论 Free 还是付费计划，AWS 都不会用你的数据训练模型"},{"l":"C","t":"默认会用于训练，需手动关闭"},{"l":"D","t":"仅对话内容用于训练，文件不会"}],"a":"B","e":"① 答案：B。② 官方安全文档原文：Your data is never used for AI model training（你的数据绝不会被用于 AI 模型训练）。③ 点破：A/C/D 均为「分档/默认开关」式变形，官方口径是无差别不训练。④ 溯源：quickstart FAQ「AWS 会用我的数据训练 AI 模型吗」+ 《Amazon Quick 伙伴学习材料汇总》内材料 原文。"},{"id":"feat-10","d":2,"t":"多选","q":"Quick 的「写入操作」需要用户明确批准后才会执行（Human-in-the-Loop）。以下哪些属于这类操作？（多选）","o":[{"l":"A","t":"发送邮件"},{"l":"B","t":"更新 CRM 记录"},{"l":"C","t":"发送消息"},{"l":"D","t":"搜索本地文件"}],"a":"ABC","e":"① 答案：A/B/C。② 名词：Human-in-the-Loop=人在回路，代理执行写入动作前须获得人的明确批准。③ 点破：D 错——读取/搜索类操作不属于写入，无需批准。④ 溯源：quickstart FAQ「发邮件/发消息等操作需要我确认吗」。"},{"id":"feat-11","d":2,"t":"单选","q":"情境：客户 IT 要求「既能拦截对话中的敏感内容，又能拦截敏感文件外发」。按原厂能力地图，应怎么回答？","o":[{"l":"A","t":"只配 Guardrails 即可两者都管"},{"l":"B","t":"Guardrails 管对话、DLP 管文件，两者互补需分别启用"},{"l":"C","t":"只配 DLP 即可两者都管"},{"l":"D","t":"Quick 目前不支持任何内容拦截"}],"a":"B","e":"① 答案：B。② 名词：Guardrails=对话护栏（按管理员规则拦截对话内容）；DLP=Data Loss Prevention 数据防泄漏（现支持对接 Microsoft Purview）。③ 点破：A/C 混淆了二者分工；D 错——Guardrails 已可用，DLP 在能力地图标注「规划中（拟以文档交付）」，需如实说明状态。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §三 治理与安全。"},{"id":"feat-12","d":2,"t":"单选","q":"企业管控的 Custom permissions（按角色裁剪功能入口）采用什么默认策略？","o":[{"l":"A","t":"新账号默认全部放开"},{"l":"B","t":"新账号默认拒绝，未授权功能一律不开"},{"l":"C","t":"新账号默认只读"},{"l":"D","t":"由员工自行选择开启"}],"a":"B","e":"① 答案：B。② 名词：Custom permissions 可按角色裁剪功能入口（如可建 dashboard 但不可导出）。③ 点破：A/C/D 均与「默认拒绝（default deny）」口径相反。④ 溯源：capability-map §二 权限与用量管控。"},{"id":"feat-13","d":2,"t":"单选","q":"情境：客户说「我们要把 Quick 界面完全换成自己品牌，员工不能看到任何 AWS 痕迹」。按原厂口径应如何回应？","o":[{"l":"A","t":"品牌定制即完全白牌，可直接满足"},{"l":"B","t":"支持品牌定制（logo+配色），但属共同品牌而非完全白牌，完全白牌需走 OEM 商务"},{"l":"C","t":"Quick 不支持任何品牌定制"},{"l":"D","t":"品牌定制是规划中功能，暂不可用"}],"a":"B","e":"① 答案：B。② 名词：Brand customization=管理员统一上传 logo、配置色板，全组织员工看到公司自己的品牌门户。③ 点破：A 错——官方注明「共同品牌非白牌」；C 错；D 错——该功能已可用（官方演示视频 20260907_BRAND），规划中的是 Agent/Email customization。④ 溯源：capability-map §五。"},{"id":"feat-14","d":2,"t":"多选","q":"原厂博客指出，为 Quick 自建远程 MCP 服务（生产环境）需要重点解决哪三大挑战？（多选）","o":[{"l":"A","t":"工具越多上下文越膨胀"},{"l":"B","t":"多步编排的准确性"},{"l":"C","t":"Token 安全"},{"l":"D","t":"客户端界面汉化"}],"a":"ABC","e":"① 答案：A/B/C。② 名词：上下文膨胀=MCP 工具定义占用 context 窗口；编排准确性=多步调用的参数/顺序/前置约束；Token 安全=第三方授权凭证的签发与存储。③ 点破：D 与 MCP 服务端设计无关（凑数项）。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §一路径 B「关键难点」。"},{"id":"feat-15","d":2,"t":"单选","q":"情境：自建飞书 MCP 服务时要接入 200+ 工具。原厂博客为什么【不】把它们全部注册给 AI？","o":[{"l":"A","t":"会被 API 限流"},{"l":"B","t":"每个工具定义占用数百 token，全注册带来数万 token 固定开销且降低调用准确率"},{"l":"C","t":"官方不允许超过 50 个工具"},{"l":"D","t":"会导致客户端安装包变大"}],"a":"B","e":"① 答案：B。② 原厂解法：只注册 32 个（28 个 Tier1 高频工具 + 4 个 Meta Tool），其余 200+ 通过 lark_discover 按需发现、lark_invoke 统一调用（约 15% 直注册、85% 按需加载）。③ 点破：A/C/D 均为无依据的机制虚构。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §四 Meta Tool、§五 分层注册。"}],"sections":[{"h":"2.1 Desktop 核心功能全景","body":"Amazon Quick Desktop 不只是一个聊天窗口。它把散落在邮件、日历、IM、CRM、本地文件里的信息汇聚到一处，再通过七大核心能力把「问答」升级成「替你做事」。下面逐一拆解。\n\n#### Knowledge Graph（知识图谱）\n\nQuick Desktop 会自动从你的邮件、日历、聊天和本地文件中提取实体——人、项目、团队、文档——构建一张属于你个人的知识图谱。使用越久，它对你工作上下文的理解就越深。查看入口在 **Settings → My Context → Knowledge Graph**。所有数据存在本地，不上传云端。\n\n什么时候用？当你想快速了解某个同事最近在忙什么、某个项目涉及哪些人，直接问 Quick 即可。例如你说「帮我梳理最近一个月和哪些人互动最多，列出 top 5」。Quick 会从图谱中检索邮件、会议和消息数据，给出带互动方式和讨论话题的列表。\n\n#### Memory（记忆）\n\n你纠正 Quick 一次，它会记住；你也可以主动告诉它。管理入口在 **Settings → My Context → Memory**。例如你说「记住：我写邮件默认用中文，只有收件人是海外同事时才用英文」，之后让 Quick 起草邮件时，它会自动根据收件人判断语言。再比如告诉它「我的周报格式固定用三段：本周完成 / 下周计划 / 风险与阻碍」，以后说「帮我写周报」就会自动套用。\n\n什么时候用？任何反复需要说明的偏好或规则，告诉 Quick 一次就够了。\n\n#### MCP（Model Context Protocol）\n\nQuick Desktop 原生集成了 50 多个工具连接器（Outlook、Gmail、Slack 等），但国内常用的飞书、钉钉、企业微信并不在其中。MCP 就是补齐这块拼图的标准协议。开发者把第三方系统封装成 MCP Server，Quick 通过 MCP 协议调用，效果和原生连接器一样。添加方式在 **Settings → Capabilities → Connections → Advanced Integrations**。\n\n什么时候用？客户问「能不能接我们的飞书/钉钉/内部系统」时，答案就是走 MCP。\n\n#### Scheduled Tasks（定时任务）\n\n让 Quick 在后台按计划自动执行任务。设置入口在顶部栏 **Agents** 图标。例如设一个「每天早上 9 点扫描今天的日历、未读邮件和 Slack 消息，生成一份今日重点摘要推送给我」。Quick 会创建一个 Scheduled Agent，每天 9:00 自动运行并通过桌面通知推送结果。还可以设会议触发：「每次会议开始前 15 分钟，自动整理参会者信息和相关文档」。\n\n注意：定时任务需要 Desktop 应用保持运行状态。\n\n#### Browser Automation（浏览器自动化）\n\nQuick 可以打开浏览器并代你操作网页，支持使用你的 Chrome Profile 保留登录状态。设置方式在 **Settings → Customization → Browser**，选择 Use my Chrome。例如你说「帮我打开 LinkedIn，搜索 AI Product Manager 在北京的候选人，把前 10 个结果整理成表格」。Quick 会自动打开浏览器、执行搜索、提取信息，最后返回结构化表格。\n\n什么时候用？需要从网页上批量采集信息或操作内部系统时。\n\n#### Deep Research（深度研究）\n\n当你的问题需要多来源、多角度的深度分析时使用。Quick 会自动规划研究路径、从多个来源收集信息、交叉验证后生成带引用的结构化报告。\n\n什么时候用？例如「帮我研究一下竞品 X 的最新产品动态，整理成带来源的分析报告」。\n\n#### Skills（技能沉淀）\n\n个人打磨好的提问方法可以沉淀成 Skill，一键分享给全组织复用。管理员可以在 Quick 控制台统一管理和分发。\n\n什么时候用？当你发现某个工作流程自己反复使用，且同事也需要时，就值得沉淀成 Skill。\n\n举个完整的场景：一位销售经理每天早上打开 Quick Desktop，说「帮我看看今天有什么安排」。Quick 从日历拉取今日会议，扫描邮箱中的紧急邮件，检查 Slack 未读消息，生成一份「今日重点」清单。然后他说「帮我准备下一个会议——整理参会者背景、之前的邮件往来、相关文档，生成一页准备材料」。Quick 查看日历中下一个会议，识别参会者，搜索历史邮件和聊天记录，生成简洁的准备材料。整个过程不超过两分钟。\n\n#### 常见误区与易错点\n\n- Knowledge Graph 只存在 Desktop 端且数据在本地。有人误以为 Web 端也有图谱，实际上 Web 端没有此功能，数据也不同步到云端。\n- Memory 不是无限量的「记事本」。它记录的是偏好、习惯和规则，不适合用来存大段文档内容。\n- 定时任务依赖 Desktop 保持运行。如果应用被关闭或电脑休眠，任务不会执行。\n- 浏览器自动化需要先在 Settings 中配置 Chrome Profile，否则 Quick 打开的是一个全新浏览器，没有你的登录状态。\n\n#### 记忆要点\n\n- Desktop 七大核心能力：Knowledge Graph、Memory、MCP、Scheduled Tasks、Browser Automation、Deep Research、Skills。\n- Knowledge Graph 和 Memory 是 Desktop 独有功能，数据全部存储在本地设备，不上传云端。\n- 所有「写入操作」（发邮件、发消息等）都需要用户明确批准后才会执行，这就是 Human-in-the-Loop 机制。\n- MCP 是连接国内协同工具（飞书、钉钉、企业微信）的标准路径。\n- 定时任务需要 Desktop 应用保持运行状态才能按时执行。"},{"h":"2.2 Web 端能力：Space / Custom Agent / Quick Research","body":"Quick 的 Web 端和 Desktop 端定位不同。Desktop 侧重个人生产力，Web 端侧重团队协作与数据分析。Web 端有三个核心能力需要分清。\n\n#### Space（空间）\n\nSpace 是 Web 端的资产共享容器，也是 Web 端最核心的协作单元。管理员或用户把仪表盘、数据集、分析报告放进 Space，按角色授权给成员。成员进入 Space 就能看到被授权的内容，未授权的直接拒绝访问。\n\nSpace 解决的核心问题是「受控共享」。没有 Space 之前，共享一份报表要么发链接（容易扩散），要么截图（无法交互）。有了 Space，资产放进去后受权限控制，共享须经审批流程（Approval policies）通过后才真正生效。管理员还可以在 Space 内配置多数据集 Topic（语义模型），五个独立数据集经关系文件组成星型语义模型。Publish 后员工在 Chat 中跨表提问，系统自动 join 出图，不必等数仓预先拼大宽表。\n\n#### Custom Agent（自定义代理）\n\nWeb 端允许创建带特定角色指令的 Chat Agent。管理员写好角色身份和行为指令（Persona Instructions），挂上 MCP 连接器，就得到一个面向特定场景的 AI 助手。例如创建一个「飞书日程助手」Agent，指令是「你负责帮用户管理飞书日程，查询和创建会议」，挂上飞书 MCP 连接器。用户只需在对话中说「帮我查一下今天的飞书日程」，Agent 自动调用正确的工具。\n\nCustom Agent 可以分享给团队。管理员在控制台统一管理全组织的 Agent 和 Skill，员工可以直接使用而无需自己配置。Skill 沉淀机制也在 Web 端：个人打磨好的提问方法沉淀成 Skill，一键分享全组织复用。管理员可以查看全组织资产（Connectors、Agents、Skills 等 12 类），员工离职后接管或转移其名下资产。\n\n#### Quick Research\n\n当用户在 Web 端需要基于企业数据做多步骤分析时，Quick Research 提供结构化的研究流程。它自动规划研究路径，从连接的数据源中收集信息，交叉验证后生成带引用的报告。与 Desktop 端的 Deep Research 不同，Web 端的 Research 更侧重团队共享的数据资产，可以直接查询 Space 中的数据集和仪表盘。\n\n三者配合的典型场景分三步。\n\n1. IT 管理员把销售数据集放进 Space 并授权给销售团队。\n2. 创建一个「销售分析助手」Custom Agent。\n3. 销售人员通过 Agent 用自然语言提问，例如「本季度华东区的增长趋势如何」。Agent 自动查询 Space 中的数据集并返回图表。\n\n#### 常见误区与易错点\n\n- Space 的权限是资产级别的，不是 Space 级别的。同一个 Space 内不同资产可以有不同的访问权限。\n- Custom Agent 不等于 Desktop 端的 Memory。Agent 的指令是全局的、对所有使用者一致的；Memory 是个人的、只对你生效的。\n- Desktop 和 Web 端的数据并非完全隔离。Spaces、仪表盘和设置在两端之间同步，但 Knowledge Graph 和 Memory 是 Desktop 独有功能。\n\n#### 记忆要点\n\n- Space = 受控共享容器，资产放进去按角色授权，共享须经审批。\n- Custom Agent = 带角色指令的 AI 助手，可挂 MCP 连接器，面向特定场景。\n- Desktop 独有：Knowledge Graph、Memory。Web 独有：Space、仪表盘的团队共享管理。\n- Spaces 和设置在 Desktop 与 Web 之间同步；Knowledge Graph 和 Memory 只在 Desktop 本地。"},{"h":"2.3 MCP 集成原理与接入路径","body":"MCP 全称 Model Context Protocol（模型上下文协议），由 Anthropic 发起的开放标准。它定义了 AI 客户端与外部工具之间的通信规范——AI 通过 MCP 协议发现工具、理解参数格式、发起调用并获取结果。对 Quick 来说，MCP 是连接一切未内置工具的统一接口。\n\n#### 为什么需要 MCP\n\nQuick 原生支持 50 多个集成（Outlook、Gmail、Slack 等），但飞书、钉钉、企业微信并不在其中。客户问「能不能接我们现有的协同工具或业务系统」时，MCP 就是标准答案。\n\n#### 两种接入形态：本地 MCP 与远程 MCP\n\n| 对比维度 | 本地 MCP（Local） | 远程 MCP（Remote） |\n|---|---|---|\n| 部署方式 | 每人本机安装 CLI 工具 | 管理员部署一次，全员共用 |\n| 通信方式 | Quick Desktop 以子进程方式拉起 MCP Server，走 stdio 通信，不起服务、不开端口、不过公网 | 走标准 HTTPS，MCP Server 托管在 Bedrock AgentCore 上 |\n| IT 集中管控 | 弱——各自建应用 | 强——应用由管理员建，用户只授权 |\n| 适合谁 | 个人快速验证、试点 | 企业级统一推行 |\n\n#### 路径 A：零代码接入（快速验证）\n\n以飞书为例。在飞书开放平台的 MCP 配置页面创建 MCP 服务，选择需要的工具包（消息、日历、文档、多维表格等），完成用户授权后拿到服务器 URL。然后到 Quick 的 Connectors 页面填入这个 URL，选择传输模式为 Streamable HTTP，完成。整个过程不需要写代码，几分钟搞定。\n\n这条路径的限制是：飞书官方 MCP 的 OAuth 用户模式不暴露消息发送工具（已知限制）。如果客户需要「以用户身份发消息」，就要走路径 B 或本地 MCP 包装方案。\n\n#### 路径 B：自建远程 MCP 服务（生产级）\n\n当工具数量大（比如飞书场景下 200 多个工具）、需要 Token 安全与上下文效率时，走路径 B。核心架构：CloudFront（HTTPS 入口）→ API Gateway → MCP Middleware Lambda（Token 验证）→ Bedrock AgentCore（无状态 MCP 容器，自动伸缩）→ Secrets Manager（加密 Token）。\n\n路径 B 有三个关键设计决策：\n\n第一，**按需编排**。200 多个工具全注册会撑爆上下文窗口（每个工具的定义平均占数百 token）。解法是只注册 28 个高频 Tier1 工具加 4 个 Meta Tool。Meta Tool 的职责是：`lark_list_skills` 浏览业务域列表、`lark_get_skill` 按需加载编排指南、`lark_discover` 搜索低频 Tier2 工具、`lark_invoke` 统一执行。AI 先加载编排指南再操作，不是「猜着调」而是「按规矩来」。\n\n第二，**分层注册**。Tier1 直接注册的 28 个工具覆盖日常最高频操作（IM、日历、文档、表格、云盘、任务、联系人、邮件）。Tier2 的 200 多个工具通过 discover 按需发现。这个比例（约 15% 直注册、85% 按需加载）在实际使用中取得了较好平衡。\n\n**第三，Token 安全。** 两道防线：\n\n- **OAuth 2.0 PKCE**：防止授权码截获。\n- **HMAC 域分离签名**：防止跨域伪造。\n\n具体做法：从一个根密钥通过 HKDF 派生 3 个独立签名密钥，分别用于 OAuth state、MCP Token 和增量授权 Token。所有用户 Token 加密存储在 Secrets Manager，通过 TLS + SigV4 传输，不经过公网。\n\n举个实际的调用序列。用户说「约产品评审会」，AI 分 10 步执行。前 4 步：加载日程编排指南、加载联系人指南、搜索参会人、查忙闲。后 6 步：发现推荐时段工具、调用推荐、查会议室、创建日程、加载任务指南、创建待办。其中 Tier1 直接调用 6 次，Meta Tool 调用 4 次。没有一步是猜的，全部按编排指南执行。\n\n#### 成本参考\n\n10 人试用月成本低于 10 美元，100 人低于 50 美元。主要成本项是 Secrets Manager 和 AgentCore Runtime（空闲时容器自动回收）。\n\n#### 常见误区与易错点\n\n- 路径 A 和路径 B 不冲突，可以先用 A 验证效果，再迁移到 B 做生产部署。\n- 本地 MCP 的路径不能包含空格，否则 Quick Desktop 会解析失败导致连接不上。\n- 远程 MCP 的设计方法（分层注册 + Meta Tool + 域分离签名）与目标系统无关，可以平移到钉钉、企业微信、SAP 等任何 MCP 化目标。\n- 飞书官方 MCP 的 OAuth 用户模式有一个已知限制：不暴露消息发送工具。需要发消息能力时要走自建方案。\n\n#### 记忆要点\n\n- MCP = Model Context Protocol，AI 客户端与外部工具之间的标准通信协议。\n- 本地 MCP 走 stdio，适合个人试点；远程 MCP 走 HTTPS + AgentCore，适合企业推行。\n- 路径 A = 零代码，在飞书/Lark MCP 配置平台创建后填 URL 即可；路径 B = 自建远程 MCP，适合 200+ 工具的生产场景。\n- 路径 B 三大设计：按需编排（4 个 Meta Tool）、分层注册（Tier1 直注册 + Tier2 按需发现）、Token 安全（OAuth PKCE + HMAC 域分离签名）。\n- 远程 MCP 的设计方法与目标系统无关，可平移到钉钉、企业微信等任何系统。"},{"h":"2.4 IM 渠道接入实践","body":"国内企业最常用的 IM 是企业微信、飞书和钉钉。Quick 没有内置这三个平台的连接器，但通过 MCP 都能接入。这一节以企业微信为例，讲清楚本地和远程两种方案的落地要点与踩坑。\n\n#### 企业微信本地 MCP 方案\n\n走官方 `WecomTeam/wecom-cli`（企业微信 2026-03-30 开源），在本机安装后通过 Local MCP 让 Quick Desktop 调用。\n\n关键差异需要提前告知客户：**企业微信不开放「以用户身份代发消息」的 API**。飞书和钉钉的类似方案走用户 OAuth，群里看到的发送者是你本人。但企业微信只能走你名下的智能机器人（API 模式），群里看到的发送者是机器人名。\n\n| 平台 | CLI 工具 | 身份模式 | 群内显示发送者 |\n|---|---|---|---|\n| 飞书 | lark-cli | 用户 OAuth | 你本人 |\n| 钉钉 | dws | 用户 OAuth | 你本人 |\n| 企业微信 | wecom-cli | 智能机器人（Bot ID + Secret） | 你创建的机器人 |\n\n配套一键安装脚本（macOS 用 `install.sh`、Windows 用 `install.ps1`）可以 5 分钟搞定。脚本会在隔离目录装一个独立版 Node.js（不动系统 PATH），装好 CLI 和 MCP SDK，生成 `server.mjs`，弹出二维码扫码即可创建机器人并自动拿到 Bot ID 和 Secret。\n\n能力覆盖 10 个工具：会话列表、拉消息、发文本、搜人、成员列表、建待办、待办列表、预约会议、日程列表、建文档。但要注意：**10 人以上企业只开放文档和待办能力**，消息、日程、会议等能力域只有 10 人及以下团队可用。\n\n#### 企业微信远程 MCP 方案\n\n走第三方开源项目 `wecom-mcp-on-agentcore`，部署到 Bedrock AgentCore。管理员 CDK 五步部署（约 45 分钟），之后在 Quick 控制台创建 MCP Connector，员工扫码自助授权即可使用。\n\n远程方案的关键优势是「每次调用都以发起者本人的企业微信身份执行」，不是全员共用一个机器人。审计能追到人，可见范围由企业微信平台按每个人的权限自动收敛。\n\n**扫码授权的关键坑**——这是全流程最容易造成不可逆损失的地方：首次授权名下没有机器人，只能选新建。**之后每次重新授权，必须选「绑定已有机器人」并选中原来那个。** 选新建会永久失去对旧机器人所建文档、表格、日程的编辑权限。正常情况下不需要重新授权——令牌到期客户端会自动续期。\n\n远程方案覆盖 37 个工具、13 个业务域、94 个方法。但有几个边界需要提前说清。需要本地文件路径的方法在远程 MCP 下不可用，因为容器文件系统是隔离的。消息只能发给授权人本人或机器人近期往来的会话，无群发能力。\n\n#### 本地 vs 远程怎么选\n\n要快、要个人先跑通 → 本地 MCP。要企业级统一推行、成员零安装 → 远程 MCP。无论本地还是远程，企业微信都不存在「以你本人身份代发消息」。本地走机器人，远程走 OAuth 扫码（发起者身份）。按「是否需要群内显示本人」来决定方案选型。\n\n#### 常见误区与易错点\n\n- 企业微信的身份限制是平台层面的产品设计，不是方案能绕过的。对客户沟通时要提前说明。\n- 远程方案是第三方开源项目，非 AWS 官方发布。对客户承诺前须先做一次真实环境验证。\n- 扫码授权时选错「新建机器人」会导致旧机器人资产永久丢失编辑权，务必在员工培训中强调。\n- 10 人以上企业使用本地方案时，消息和日程类 CLI 会返回权限错误，这是企业微信的能力开放限制。\n\n#### 记忆要点\n\n- 企业微信不开放「以用户身份代发消息」API，这是与飞书、钉钉的根本差异。\n- 本地方案用 wecom-cli + 智能机器人，5 分钟一键安装；远程方案用 AgentCore 部署，约 45 分钟。\n- 远程方案的扫码授权必须「绑定已有机器人」，选新建会永久丢失旧资产编辑权。\n- 10 人以上企业的本地方案只能用文档和待办能力，消息和日程不可用。"},{"h":"2.5 与同类产品的定位差异","body":"以下内容基于原厂能力地图的事实陈述，不做主观评价。\n\n#### Quick 的产品定位\n\nAmazon Quick 的官方定位是「AI assistant for work」——一个连接你日常工作中几十个工具的 AI 工作助手。它不止于回答问题，还能安排日程、制作文档、创建仪表盘、自动化重复工作流。\n\n#### 差异维度一：数据驻留与隔离\n\nQuick 在订阅时选定数据驻留 Region，数据不出境。企业版支持 IP/VPC 访问限制——只允许公司网络（出口 IP 或 VPC 白名单）访问，公司外一律拒绝。Desktop 端的 Knowledge Graph、Memory 和文件索引全部存储在用户本地设备，不上传云端，也不用于模型训练。\n\n#### 差异维度二：权限粒度\n\n企业版提供 Custom permissions（默认拒绝机制）——按角色裁剪功能入口，新账号默认拒绝、未授权功能一律不开。还有 Limit profiles 按人或组设用量配额，防止失控消耗。这是「默认拒绝」的安全模型，不是「默认允许再限制」。\n\n#### 差异维度三：MCP 扩展性\n\nQuick 原生支持 50 多个集成，同时通过 MCP 协议支持接入任意第三方系统。AWS Agent Registry 让技术团队的 MCP Server 登记一次、审批一次，全组织用户在 Connectors 页直接使用。注册表下架即同步消失。\n\n#### 差异维度四：企业管控能力\n\n原厂能力地图列出五类 28 项企业级管控功能。五类分别是：身份与数据边界 9 项、权限与用量管控 4 项、治理与安全 6 项、AI 工具管理 4 项、企业形象与可观测 5 项。其中标注「规划中」的项以原厂后续发布为准，不代表已可用。\n\n#### 差异维度五：部署形态\n\nQuick 同时提供 Desktop 客户端和 Web 端。Desktop 端提供 Knowledge Graph、Memory 和浏览器自动化；Web 端提供 Space 和 Custom Agent。两端 Spaces 和设置同步，图谱和记忆仅在 Desktop 本地。IT 可以通过 MDM（Intune/Jamf）批量部署 Desktop 到全员设备，并下发策略禁用消费者社交登录，强制企业 SSO。\n\n#### 常见误区与易错点\n\n- 「规划中」功能（原厂标注 To be added）不代表已可用，对客户沟通时须显式说明。\n- 权限模型是「默认拒绝」而非「默认允许」，这与部分同类产品的默认开放策略有本质区别。\n- Quick 不使用用户数据训练模型，无论 Free 还是付费计划均是如此。\n\n#### 记忆要点\n\n- Quick 官方定位：AI assistant for work，连接工具 + 替你做事。\n- 数据驻留选定 Region 不出境；Desktop 数据全部本地存储，不上传云端。\n- 权限模型为默认拒绝，新账号未授权功能一律不开。\n- 原厂能力地图五类 28 项管控功能，「规划中」项以原厂后续发布为准。\n- MCP 是连接一切未内置系统的标准路径，Agent Registry 实现登记一次全组织可用。"}]},{"domain":3,"name":"场景落地 SCENARIO","weight":"28%","practiceCount":17,"practice":[{"id":"scen-1","d":3,"t":"单选","q":"原厂文章《Amazon Quick 让我重新理解办公》认为 Quick 与多数 AI 工具的核心差别是什么？","o":[{"l":"A","t":"底层模型更强，回答更准确"},{"l":"B","t":"不只解决「个体完成产出」，还接住产出之后同步、进流程、被复用的衔接环节"},{"l":"C","t":"文档生成速度更快"},{"l":"D","t":"免费额度更大"}],"a":"B","e":"① 答案：B。② 核心论点：多数 AI 工具解决「写得更快」，Quick 把数据、群聊、知识和 workflow 串成完整交付链路，提升「从开始到落地」的整体效率。③ 点破：A/C 恰是原文批判的「单点提效」视角；D 无依据。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §二。"},{"id":"scen-2","d":3,"t":"单选","q":"Amazon Quick 里预置了多少个专家助理（角色化助理）？","o":[{"l":"A","t":"5 个"},{"l":"B","t":"10 个"},{"l":"C","t":"15 个"},{"l":"D","t":"50 个"}],"a":"C","e":"① 答案：C，15 个。② 名词：角色化助理=预置角色（如「内容策略师」），选择接近任务的角色即可直接开工，无需先写长提示词。③ 点破：50 是「50+ 原生集成」的数字（概念替换干扰）；5/10 为数值变形。④ 溯源：scenario-playbook §二 角色化助理。"},{"id":"scen-3","d":3,"t":"单选","q":"情境：你每周一都要做周会数据汇报——先导数、再分析、再整理成汇报内容，流程固定且重复。最适合用 Quick 的哪个能力把它固定下来？","o":[{"l":"A","t":"Deep Research"},{"l":"B","t":"Flow（工作流）"},{"l":"C","t":"知识图谱"},{"l":"D","t":"浏览器自动化"}],"a":"B","e":"① 答案：B。② 名词：Flow 的价值=把高频、重复、规则相对明确的工作固定下来，下次不用从零开始；原文将 Google Analytics 配成连接器后用自然语言自动生成工作流。③ 点破：A 适合复杂问题的研究判断；C 用于实体关系与历史知识复用；D 用于操作网页——均非固定流程场景。④ 溯源：scenario-playbook §二 Workflow。"},{"id":"scen-4","d":3,"t":"单选","q":"情境：团队积累了大量竞品调研报告，新方案立项时希望「历史资料参与当前决策」。按原文做法应该怎么做？","o":[{"l":"A","t":"把文件统一打印归档备查"},{"l":"B","t":"按需圈定知识范围（如把团队文件夹设为 Agent 可访问），让资料可被搜索、调用、对比和复用"},{"l":"C","t":"每次立项重新做一轮调研"},{"l":"D","t":"导出 Excel 手工汇总对比"}],"a":"B","e":"① 答案：B。② 名词：知识复用=圈定知识范围后，历史资料可参与搜索与归纳；配合知识图谱还能串起资料、会议、人员、项目之间的关系。③ 点破：A/D 仍是「存起来」而非「用起来」；C 违背复用初衷。④ 溯源：scenario-playbook §二 知识复用。"},{"id":"scen-6","d":3,"t":"多选","q":"Quick 文档与可视化创作当前支持哪些输出类型？（多选）","o":[{"l":"A","t":"Word 文档（.docx）"},{"l":"B","t":"Excel 表格（.xlsx）"},{"l":"C","t":"PowerPoint 演示文稿（.pptx）"},{"l":"D","t":"视频文件（.mp4）"}],"a":"ABC","e":"① 答案：A/B/C，另有 PDF（.pdf）与 Business visual（.png），共五种。② 这些是可编辑的原生文件：Excel 保留工作公式与条件格式，PPT 保留版式母版与布局。③ 点破：D 不在支持列表——属格式类杜撰干扰。④ 溯源：scenario-playbook §三 Multiple output types 表。"},{"id":"scen-7","d":3,"t":"单选","q":"情境：客户问「生成的 PPT 能不能长得跟我们公司现有模板一样？」正确答复是？","o":[{"l":"A","t":"不支持，只能用内置主题"},{"l":"B","t":"可以——上传现有品牌 .pptx 作模板，Quick 分析版式、字体、品牌色与结构后克隆生成"},{"l":"C","t":"需购买 OEM 授权才可以"},{"l":"D","t":"仅 PDF 支持套用模板"}],"a":"B","e":"① 答案：B。② 名词：PowerPoint template cloning——上传品牌 .pptx，生成时克隆最匹配的版式，保留背景、装饰元素、logo 与视觉识别。③ 点破：A 与事实相反；C 混淆了「品牌定制/白牌走 OEM」的概念；D 错——Excel 模板克隆同样支持。④ 溯源：scenario-playbook §三 Template cloning。"},{"id":"scen-8","d":3,"t":"多选","q":"Quick 文档生成后支持哪两种编辑方式？（多选）","o":[{"l":"A","t":"会话式编辑（Chat-based editing）——适合文档级的大范围修改"},{"l":"B","t":"行内批注（Inline commenting）——高亮段落评论后仅重生成该段"},{"l":"C","t":"只能导出后用第三方软件修改"},{"l":"D","t":"每次修改都必须重新生成整份文档"}],"a":"AB","e":"① 答案：A/B。② 推荐用法：先会话式编辑确定结构/语气/布局，再用行内批注精修局部——「Start broad, get specific」。③ 点破：C/D 与原文编辑机制相反——修改只重生成需要变化的部分，其余不动。④ 溯源：scenario-playbook §三 Two ways to edit。"},{"id":"scen-9","d":3,"t":"单选","q":"情境：客户财务总监质疑「AI 生成的报表数据是不是编的」。按原厂口径应如何回应？","o":[{"l":"A","t":"承认存在编造风险，建议人工复核全部数字"},{"l":"B","t":"源数据可直接上传（CSV/Excel/JSON）或来自已连接数据源（QuickSight/Redshift/RDS），Quick 按给定数据生成、不编造数据点"},{"l":"C","t":"建议不要用 AI 做数据类文档"},{"l":"D","t":"编造率低于 1%，可以忽略"}],"a":"B","e":"① 答案：B。② 名词：Data-aware generation（数据感知生成）——准确性以你提供的数据为准，机械执行交给 Quick，数字含义的判断留给人。③ 点破：A 把风险说成必然；C/D 均为无依据口径。④ 溯源：scenario-playbook §三 Data-aware generation。"},{"id":"scen-10","d":3,"t":"单选","q":"AWS 财务团队案例中，每周业务复盘（Weekly Business Review）的准备时间从约多少缩短到约多少？","o":[{"l":"A","t":"8 小时 → 1 小时"},{"l":"B","t":"6 小时 → 约 10 分钟"},{"l":"C","t":"3 小时 → 30 分钟"},{"l":"D","t":"数周 → 1 天"}],"a":"B","e":"① 答案：B。② 该团队用区域专属 Chat Agent + Flows 每周一自动运行，洞察在工作日开始前就绪；单客户深度分析同样从 6 小时降到约 10 分钟。③ 点破：其余选项为时间数值变形。④ 溯源：scenario-playbook §四 Use case 2 与 The pattern 对照表。"},{"id":"scen-11","d":3,"t":"单选","q":"情境：客户 FP&A 团队想「每周一早上自动产出收入表现分析，上班前就绪」。参考 AWS 财务团队的做法，应配置什么？","o":[{"l":"A","t":"让分析师每周一手动导出数据后发到群里"},{"l":"B","t":"按区域/业务定制 Chat Agent，并用 Flow 按固定节奏自动运行"},{"l":"C","t":"只建一个 Dashboard 等人随时来看"},{"l":"D","t":"每周外包给咨询公司出报告"}],"a":"B","e":"① 答案：B。② AWS Finance 的做法：区域专属 chat agents 连接企业数据源，Flows 自动按周一节奏运行，并准备可供领导层使用的 talk tracks。③ 点破：A/C/D 都没有解决「数据汇总占满周一上午」的瓶颈。④ 溯源：scenario-playbook §四。"},{"id":"scen-12","d":3,"t":"多选","q":"HR Workshop 模块 00（候选人分析助手）主要用到了哪些 Quick 能力？（多选）","o":[{"l":"A","t":"Spaces"},{"l":"B","t":"Chat Agent"},{"l":"C","t":"Flows"},{"l":"D","t":"Apps"}],"a":"AB","e":"① 答案：A/B——先建「简历」与「岗位 JD」两个 Space，再创建「HR 面试助手」Chat Agent 并把两个 Space 设为知识源。② 模块 01 用 Spaces+Flows，模块 03 用 Spaces+Apps，模块 04 用 Deep Research。③ 点破：C/D 是其他模块使用的能力（主体错置）。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §二 模块总览。"},{"id":"scen-13","d":3,"t":"单选","q":"情境：HR 想让「新收到的简历自动进入统一人才库，并刷新分析面板」。参考 HR Workshop 模块 02 的工程做法，应采用什么组合？","o":[{"l":"A","t":"每周人工整理 Excel 汇总表"},{"l":"B","t":"简历入库 Skill 扫描 PDF/DOCX/MD 提取字段生成 talent_pool.csv，配合 Dataset 与 Dashboard；新增简历后重跑 Skill、替换 Dataset 文件即可刷新"},{"l":"C","t":"把简历全部打印后手工录入系统"},{"l":"D","t":"让 Chat Agent 在对话里逐份口头总结"}],"a":"B","e":"① 答案：B。② 名词：resume-intake-pipeline Skill 支持增量处理和定时运行，结构化字段含姓名/学历/工作年限/技能/期望城市等。③ 点破：A/C/D 均为手工路径，无增量与自动化。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 模块 02 核心流程。"},{"id":"scen-14","d":3,"t":"多选","q":"以下哪些属于 HR Workshop 的官方注意事项？（多选）","o":[{"l":"A","t":"JD 与简历应放入不同 Space，避免工作流检索到错误的数据源"},{"l":"B","t":"模块 02 首次运行时不要上传「补充简历」，这样才能体验增量入库和 Dashboard 刷新"},{"l":"C","t":"所有材料放进同一个 Space 最便于检索"},{"l":"D","t":"AI 输出可以替代必要的人工审核与面试评估"}],"a":"AB","e":"① 答案：A/B。② 模块 03 还有「创建 App 时必须上传 《Amazon Quick 伙伴学习材料汇总》内材料」；Deep Research 需确认研究计划批准后才执行。③ 点破：C 与注意事项相反；D 错——原文明确 AI 输出用于辅助判断，不应替代人工审核与合规检查。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 常见注意事项。"},{"id":"scen-15","d":3,"t":"单选","q":"情境：HR 按模块 03 生成人才成长可视化 App。原厂为什么要求上传 《Amazon Quick 伙伴学习材料汇总》内材料 再建站？","o":[{"l":"A","t":"它规定了图表依赖（Highcharts）、图表错误隔离、UTF-8 BOM 解析、空数据保护等要求，用于减少应用白屏和局部图表崩溃"},{"l":"B","t":"它是公司品牌规范文件"},{"l":"C","t":"它是计费授权文件"},{"l":"D","t":"只是示例文件，可以不上传"}],"a":"A","e":"① 答案：A。② 名词：《Amazon Quick 伙伴学习材料汇总》内材料 是 App 建站技术规范，规定全局背景与图表工程要求。③ 点破：B/C 无依据；D 错——官方注意事项明确「创建 App 时必须上传 《Amazon Quick 伙伴学习材料汇总》内材料」。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 模块 03。"},{"id":"scen-16","d":3,"t":"单选","q":"情境：小红书自动化实验中，让 Quick 抓取小红书数据靠的是什么机制？","o":[{"l":"A","t":"小红书官方数据 API"},{"l":"B","t":"浏览器自动化——用你自己的 Chrome 与登录态操作页面，与手动浏览一致"},{"l":"C","t":"MCP Server 协议"},{"l":"D","t":"Deep Research 联网检索"}],"a":"B","e":"① 答案：B。② 实验前提：开启浏览器自动化并连接 Chrome；小红书不登录无法搜索，Quick 用你的登录态操作、与手动浏览一致、不触发风控。③ 点破：A 不存在——正因为没有 API 才用浏览器；C/D 不是该场景的机制。④ 溯源：scenario-playbook §五 步骤 1.1 + 手册第 3 页。"},{"id":"scen-17","d":3,"t":"多选","q":"小红书「一人内容团队」实验把自动化跑通，靠的「三件套」是？（多选）","o":[{"l":"A","t":"浏览器自动化（抓选题/拆爆款）"},{"l":"B","t":"Skill 封装（一次封装、一句话重复调用）"},{"l":"C","t":"定时任务与排期提醒（发布提醒、周复盘）"},{"l":"D","t":"每天人工爬楼找选题"}],"a":"ABC","e":"① 答案：A/B/C。② 实验七步：热点选题→拆爆款结构→批量生成文案→封面生成器→排期提醒→打包 Skill→周复盘自动化。③ 点破：D 恰是实验要消除的人工动作。④ 溯源：scenario-playbook §五。"},{"id":"scen-18","d":3,"t":"多选","q":"AWS 官方案例集（Amazon 内部团队）中出现过哪些量化效果？（多选）","o":[{"l":"A","t":"邮件营销管理器使 AMS 回复率提升 3 倍"},{"l":"B","t":"客户经理每周节省 30–45 分钟（格式自动更新案例）"},{"l":"C","t":"Security Services 定制 Chat Agent 每月恢复 80–88 小时"},{"l":"D","t":"案例集承诺客户销售额平均提升 50%"}],"a":"ABC","e":"① 答案：A/B/C。② 案例集共 8 个主题 32 个案例，均按「痛点→做法→效果」三段式呈现。③ 点破：D 属杜撰——案例集无此口径；且对外引用必须标注「来源：AWS 官方 Quick 案例材料」，案例主体是 Amazon 内部团队而非我方交付实绩。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 一/三/五节。"}],"sections":[{"h":"3.1 客户需求挖掘与场景识别方法","body":"场景落地的第一步不是演示产品，而是准确判断客户所处阶段与核心痛点。\n\nAmazon Quick 覆盖六大业务问题类型：文档协作、数据整合与 BI、工作流自动化、AI Agent、深度研究和无代码应用构建。每类问题在不同阶段的可触及性不同。\n\n销售必须先完成客户诊断，再匹配场景。\n\n#### 一、客户数字化阶段五级模型\n\nQuick 的适用性与客户的数字化成熟度高度相关，五个阶段依次如下。\n\n- **纸面办公化**：客户以 Excel 和微信群为主，缺乏结构化数据，Quick 几乎无法落地。\n- **数字化早期**：有基础 CRM 或 ERP，但数据分散在各系统中，直接卖 Quick 风险极高。\n- **数字化成熟期**：已建成数据仓库或数据湖，具备标准化数据接口，是 Quick 的主力目标区间。\n- **智能化早期**：部分部门已在用 AI 工具但尚未系统化，Quick 的平台化能力正好补位。\n- **智能化成熟期**：AI 已嵌入核心流程，Quick 可进一步拓展 Research 和 Automate 等高级场景。\n\n#### 二、业务问题六分类与交叉矩阵\n\n判断完客户阶段后，第二步是识别客户要解决的核心业务问题。六大问题类型各有对应的 Quick 能力模块。\n\n- **A 类文档协作**：对应文档与 PPT 生成能力。Quick 可做，但并非核心优势。\n- **B 类数据整合**：对应 Quick Sight，是 Quick 的根基能力。\n- **C 类工作流自动化**：对应 Quick Flows 和 Quick Automate。\n- **D 类 AI Agent**：对应 Quick Agents 和 Chat。\n- **E 类深度研究**：对应 Quick Research，这是 Quick 的独家能力。\n- **F 类无代码应用构建**：对应 Apps in Quick，同样是独家能力。\n\n将客户阶段与问题类型做交叉，即可定位到具体的竞争格局和切入策略。\n\n#### 三、需求挖掘的三步动作\n\n需求挖掘分三步走。\n\n1. **开放式提问了解现状**：用什么工具、数据存在哪里、IT 团队规模如何。\n2. **判断客户处在五级模型的哪个阶段**：这一步决定了后续所有策略的基调。\n3. **聚焦痛点并映射到六大问题类型**：确定 Quick 的切入模块。\n\n#### 示例\n\n某制造业客户反馈：「我们有 SAP 系统，但每次出季报还是要手动从三个系统导数据到 Excel。」\n\n从这段描述可以判断：客户处于数字化成熟期，已有 ERP 等结构化系统；核心痛点属于 B 类数据整合问题。\n\nQuick Sight 可直连 SAP 数据源，自动生成仪表板，手动导数据的环节被彻底消除。\n\n后续可延伸到 C 类自动化：用 Flows 将季报生成流程编排为定时任务，实现全自动输出。\n\n#### 常见误区与易错点\n\n- **误区一：跳过客户阶段诊断，直接展示 Quick 全部功能。** 数字化早期客户看到 BI 仪表板，反而觉得产品复杂。\n- **误区二：把所有竞品都当作对手。** Quick 在不同阶段面对的竞品完全不同：数字化成熟期的对手是 Tableau 和 Power BI，而非通用 AI 助手。\n- **误区三：用单一话术应对所有客户。** 客户说「我用微信就够了」时，说明处于纸面阶段，正确做法是建议先做数据基础建设。\n\n#### 记忆要点\n- 先判断阶段，再识别问题，最后匹配模块——三步法是场景识别的底层逻辑\n- 五级阶段模型：纸面→数字化早期→成熟期→智能化早期→智能化成熟期\n- 六大问题：文档 / 数据 BI / 自动化 / Agent / 研究 / 无代码应用\n- Quick 的主力区间是数字化成熟期及以上，低于此阶段需先配套数据服务"},{"h":"3.2 典型场景库","body":"Quick 官方将目标用户划分为六个功能角色。依次为销售、市场、IT、运营、财务和法务。实际售前中还需覆盖 HR、采购、行政等职能。本节按部门维度梳理典型场景。每个场景含触发条件、能力映射和预期价值。\n\n#### 一、销售场景\n\n场景 1：高管会议简报（Meeting Brief）。触发条件：销售在重要拜访前需快速了解客户近况。Quick 工作流分四步：连接邮件和日历→识别关键账户→汇总上下文→生成一页 Brief。产出物包含客户背景、沟通记录、风险提示和建议行动。价值：将会前准备时间从数小时压缩到十分钟以内。\n\n场景 2：客户洞察与竞品快报。销售团队需要定期追踪客户所在行业的变化。\n传统做法是人工搜索公开信息再汇总，耗时且不全面。Quick Research 联合 S&P Global 等第三方数据源与内部知识库。自动生成带引用的研究报告。这是 Quick 独有能力，竞品无法提供同等深度。\n\n#### 二、HR 场景\n\n场景 3：新员工入职引导。HR 部门可创建入职引导 Agent，定义角色为「入职助手」。新员工可用自然语言提问公司流程和权限申请步骤。Agent 从 Spaces 知识库检索答案，避免 HR 反复应答。\n\n场景 4：薪酬与绩效分析。Quick Sight 连接 HR 系统后，可生成离职率趋势和薪酬分布等仪表板。HR 负责人用自然语言即可查询数据，无需编写 SQL。\n\n#### 三、财务场景\n\n场景 5：季度财报编制。Quick Sight 自动连接多个数据源。实时生成收入、利润和毛利率仪表板。Quick Research 可自动比对合规要求并标注风险点。\n法务团队不再需要逐条人工比对监管条文。多部门会签通过仪表板加报告组合实现异步协作。替代逐部门邮件流转。\n\n#### 四、采购与供应链场景\n\n场景 6：供应商评估与比价。Quick Research 整合行业数据与内部采购记录。生成供应商对比报告。Flows 将评估结果自动推送给审批人，触发采购审批流程。\n\n#### 五、运营场景\n\n场景 7：设备故障应急响应。传感器数据接入 Quick Sight 后，系统实时监控指标。异常时自动触发 Flow。Flow 搜索历史故障记录和维修文档，推送给维修团队。目标是将停机时间从数小时缩短到一至二小时。\n这一场景在制造业客户中最易引起共鸣。\n\n场景 8：周报与经营分析自动化。运营团队可设置定时 Agent，每周自动汇总各部门关键指标。Agent 生成结构化周报并推送到 Slack 或邮件。\n管理层无需等待各部门手动汇报，数据实时可查。\n\n#### 六、行政场景\n\n场景 9：差旅与费用报销审批。Flows 可编排从申请提交到审批完成的全流程。AI 自动提取发票信息并校验合规性。人工只需处理例外和最终审批。\n这一场景见效快，适合作为行政部门的首个 Quick 试点。\n\n#### 七、跨部门协作场景\n\n场景 10：企业知识中枢。通过 Spaces 创建共享知识空间。各部门将文档、仪表板和 Agent 集中管理。新成员加入即可获得沉淀的知识资产。信息孤岛风险大幅降低。\n这是 Quick 从工具升级为平台的关键场景。\n\n#### 示例\n\n某跨境电商客户希望将新品上架流程从一周缩短到一天。拆解后发现流程涉及四个环节：市场调研、合规审核、多语言翻译和渠道分发。\n\nQuick Research 完成市场调研并查询目标国合规要求。Quick 一键生成多语言内容，Flows 自动分发到各平台并回收数据。\n\n四个环节串联后，耗时从五到七天缩短到半天。\n\n#### 常见误区与易错点\n\n- **误区一：试图在一次演示中覆盖所有场景。** Quick 官方建议的落地原则是三步：先从高频低风险开始，保留人工审批，再沉淀为 Space 或 Agent。\n- **误区二：忽视数据就绪度。** 数据源未接入或质量差，Quick 也无法产出有效结果。\n- **误区三：把场景库当固定菜单。** 场景库是起点而非终点，落地时需根据客户业务做裁剪。\n\n#### 记忆要点\n- 六大角色：销售 / 市场 / IT / 运营 / 财务 / 法务，外加 HR / 采购 / 行政\n- 高管简报是最经典的「先跑通一个小场景」切入点\n- Quick Research 的第三方数据源是独家护城河，适合做「药引子」场景\n- 落地三原则：先高频低风险→保留人工审批→沉淀为团队能力"},{"h":"3.3 客户案例与价值叙事","body":"在售前沟通中，客户案例是建立信任的关键武器。Amazon Quick 的公开案例体系以 AWS 官方发布为主。其中最核心的一组案例来自 Amazon 内部团队的实际使用。引用这些案例时，必须明确标注来源属性，避免给客户造成误导。\n\n#### 一、案例引用规范\n\n售前材料中引用的客户故事须标注来源，标注内容为「AWS 官方案例、主体为 Amazon 内部团队」。标注的目的有两个。\n\n1. Amazon 自身是全球最大的 Quick 用户，内部团队的使用场景具有真实性和说服力。\n2. 客户需知道案例主体是产品提供者的内部团队，这样可自行判断参考价值。\n\n#### 二、典型价值叙事结构\n\n好的案例叙事应包含四个要素。背景痛点、解决方案、量化成果和可复制性。\n\n叙事模板：「某团队面临 [痛点]。通过 Quick 的 [能力模块] 实现 [动作]。最终达到 [结果]。可复制到 [类似场景]。」\n\n#### 三、可用案例方向（AWS 官方案例、主体为 Amazon 内部团队）\n\n方向 1：内部知识管理。Amazon 内部团队使用 Quick 构建企业知识中枢。员工通过自然语言检索跨部门文档和历史决策记录。减少了重复沟通和信息搜索时间。\n\n方向 2：会议效率提升。Amazon 内部团队利用 Quick 的会议简报功能。系统自动汇总相关邮件、日历和文档，生成会前准备材料。高管反馈会议效率明显改善。\n\n方向 3：数据驱动决策。Amazon 内部团队通过 Quick Sight 连接多个业务系统。运营团队用自然语言查询关键指标，替代手动报表。决策周期缩短，数据分析覆盖面扩大。\n\n#### 四、价值叙事的三层话术\n\n面向高管：聚焦时间节省和决策质量提升。例如：「把问题变成答案、行动和成果」是 Quick 官方的高管价值主张。\n\n面向 IT 负责人：聚焦安全合规和集成能力。Quick 基于 IAM 权限体系，数据不离开 AWS 环境，满足企业级安全要求。\n\n面向业务用户：聚焦上手速度和日常提效。每天少做信息搬运，多做高质量决策。\n\n#### 示例\n\n在向某金融客户介绍时，销售可以这样叙事：\n「Amazon 内部财务团队在用 Quick Research 做行业分析。（AWS 官方案例、主体为 Amazon 内部团队。）他们整合 S&P Global 外部数据和内部经营数据。三十分钟内生成带引用的研究报告。这与贵司投研需求非常相似，可以用相同路径做 PoC。」\n\n#### 常见误区与易错点\n\n- **误区一：引用案例时不标注来源属性。** 客户事后发现案例主体是 Amazon 自己的团队，会产生信任危机。\n- **误区二：将案例中的具体数字直接套用到客户场景。** 不同企业的数据基础和复杂度不同，量化结果需根据 PoC 实测。\n- **误区三：过度承诺。** 案例展示的是可能性，实际效果取决于数据就绪度和使用深度。\n\n#### 记忆要点\n- 引用 Amazon 内部案例时，必须标注「AWS 官方案例、主体为 Amazon 内部团队」\n- 价值叙事四要素：背景痛点→解决方案→量化成果→可复制性\n- 三层话术：高管看时间与决策、IT 看安全与集成、业务看上手与提效\n- 案例是建立信任的起点，PoC 才是证明价值的终点"},{"h":"3.4 PoC 交付要点","body":"PoC（概念验证）是将场景从纸面推进到客户实感的关键环节。Quick 的 PoC 具有独特优势：平台已预置核心能力，无需从零搭建。理想情况下二十四小时内即可产出结果。\n\n#### 一、PoC 的四步流程\n\n第一步：确认验证目标。与客户明确本次 PoC 要验证的具体场景和验收标准。标准应包含准确率、响应速度和覆盖范围等可量化指标。\n\n第二步：准备数据与环境。接入客户的真实数据源是 PoC 成功的前提。Quick 支持二十多种数据连接器。包括 S3、RDS、Redshift、Salesforce 等。务必使用小规模真实数据，而非合成数据。客户数据暂时无法接入时，可先用预置演示数据集展示流程。\n\n第三步：搭建验证方案。根据场景选择对应的 Quick 能力模块。常见的 PoC 输出类型包括：\n\n1. **知识问答型**：创建 Agent 并连接知识源，验证检索准确率。\n2. **BI 仪表板型**：通过 Quick Sight 连接数据集，生成可交互的仪表板。\n3. **研究报告型**：使用 Quick Research 整合内外部数据，输出带引用的报告。\n4. **工作流型**：用 Quick Flows 编排端到端流程，验证自动化效率。\n5. **应用型**：用 Apps in Quick 根据自然语言描述生成业务应用。\n\n第四步：复盘与扩展规划。PoC 完成后，与客户一起复盘验收指标的达成情况。如果通过验收，制定从 PoC 到生产环境的扩展路径。如果部分指标未达标，分析原因并确定优化方向。\n\n#### 二、Quick 的关键机制\n\n- **多输出类型**：Quick 可直接生成 Word、Excel、PPT 和 PDF。PoC 中可直接展示文档生成能力。\n- **模板克隆**：Agent、Flow 和 App 可一键克隆为模板，方便从 PoC 迁移到生产环境。\n- **数据感知生成**：Quick 的输出基于实际接入的数据，而非通用知识。这是与普通 AI 助手的核心区别。\n- **权限隔离**：Quick 基于 IAM 实现行级和列级安全控制。PoC 阶段即可验证权限体系。\n\n#### 三、落地原则\n\nQuick 官方建议「先跑通一个小场景，再沉淀成团队能力」。推荐的三个切入点为：会议简报、经营分析和知识问答。三个原则：先从高频低风险开始、保留人工审批、沉淀为 Space 或 Agent。高管最关心四个指标：节省时间、决策速度、团队复用率和流程完成率。\n\n#### 示例\n\n为某零售客户做新品营销场景的 PoC。\n\n1. 确认目标——将市场分析时间从三天缩短到半天。\n2. 接入客户的 ERP 库存数据和行业公开数据。\n3. Research 生成竞品分析报告，Sight 生成销售预测仪表板。\n4. 复盘发现分析时间缩短到四小时，客户决定扩展到全品类。\n\n#### 常见误区与易错点\n\n- **误区一：PoC 使用合成数据。** 合成数据无法体现 Quick 的数据感知优势，客户看不到真实业务价值。\n- **误区二：PoC 范围过大。** 试图在一次 PoC 中验证五个场景，结果每个都做不深，正确做法是聚焦一到两个高价值场景。\n- **误区三：PoC 结束后没有扩展计划。** PoC 成功但没有后续路径，客户热情很快消退。\n\n#### 记忆要点\n- PoC 四步法：确认目标→准备数据→搭建方案→复盘扩展\n- 五种 PoC 输出类型：知识问答 / BI 仪表板 / 研究报告 / 工作流 / 应用\n- Quick 独特机制：多输出类型、模板克隆、数据感知生成、权限隔离\n- 落地三切入点：会议简报、经营分析、知识问答——先跑通再沉淀"}]},{"domain":4,"name":"现场交付 FDE/QDE","weight":"22%","practiceCount":13,"practice":[{"id":"dlv-1","d":4,"t":"单选","q":"情境：交付工程师第一次做企业版落地。关于 Web 与 Desktop 的配置顺序，原厂最佳实践是？","o":[{"l":"A","t":"先配 Desktop 再配 Web"},{"l":"B","t":"先配置 Quick Web SSO 并确认成功登录，再配置 Desktop SSO"},{"l":"C","t":"两端同时配置"},{"l":"D","t":"只配 Web，不需要配 Desktop"}],"a":"B","e":"① 答案：B。② 原厂注明：先配 Web SSO、确认成功登录后再配 Desktop，可确保配置过程流畅。③ 点破：A/C 与最佳实践相反；D 忽略了 Desktop 认证依赖 Web 侧配置（Desktop Extension 存放在 Quick 账户里）。④ 溯源：enterprise-handbook Step 0 注意事项 + identity-sso §1.1。"},{"id":"dlv-2","d":4,"t":"单选","q":"交付现场快速验证企业网络到 Quick 的连通性，原厂建议的方法是？","o":[{"l":"A","t":"ping aws.amazon.com"},{"l":"B","t":"用浏览器访问 https://us-east-1.quicksight.aws.amazon.com/，能打开页面即说明网络可达"},{"l":"C","t":"发一封邮件测试连通性"},{"l":"D","t":"对所有 AWS 域名逐一运行 tracert"}],"a":"B","e":"① 答案：B。② 若超时或被拦截，请联系网络管理员按域名清单加入白名单；另须避免手机热点等 IP 频繁变化的不稳定网络。③ 点破：A/C/D 验证不到 Quick 实际依赖的域名面。④ 溯源：enterprise-handbook Step 0 网络连通性。"},{"id":"dlv-3","d":4,"t":"单选","q":"情境：某医药企业 Desktop 连接 Outlook/Teams 报错。按踩坑案例，根因与解法是？","o":[{"l":"A","t":"网络白名单缺失——补齐 *.cloudfront.net 即可"},{"l":"B","t":"O365 集成需 M365 Global Admin 完成 Admin Consent——由 Global Admin 勾选「Consent on behalf of organization」即可解决"},{"l":"C","t":"Desktop 版本过旧——重装即可"},{"l":"D","t":"需要切换为免费计划再集成"}],"a":"B","e":"① 答案：B。② 案例 2：O365 集成必须由全局管理员代表组织授权（Admin Consent）。③ 点破：A 是网络类问题的维度（另一案例）；C/D 无依据。④ 溯源：enterprise-handbook Step 4 案例 2。"},{"id":"dlv-4","d":4,"t":"多选","q":"关于 Quick 常见运维现象，以下说法正确的有？（多选）","o":[{"l":"A","t":"Agent Hours 配额耗尽后功能暂停，约 3 小时自动恢复（周期重置），或升级套餐"},{"l":"B","t":"登录超 18 小时自动登出是正常的 Session 过期机制"},{"l":"C","t":"切换网络后自动退出说明账号被封禁"},{"l":"D","t":"Windows 下 Remote MCP 频繁 crash 是已知 bug，可临时用 Web 版替代"}],"a":"ABD","e":"① 答案：A/B/D。② 切换网络后自动退出的根因是 IP 变化触发 token 失效，重新登录并确保网络白名单正确即可。③ 点破：C 把 token 机制误判为封禁。④ 溯源：enterprise-handbook Step 3 常见运维问题。"},{"id":"dlv-5","d":4,"t":"多选","q":"关于用户日志管理两方案（CloudWatch vs 直投 S3），正确的有？（多选）","o":[{"l":"A","t":"团队较小（50 人以内）且需实时搜索、异常告警——选 CloudWatch 方案，配置简单即开即用"},{"l":"B","t":"大规模部署（100+ 人）以合规归档和事后追溯为主——直投 S3 长期存储成本更低"},{"l":"C","t":"每种日志类型可同时投递到两个目的地"},{"l":"D","t":"两者可按日志类型组合使用（如 CHAT_LOGS 投 S3、AGENT_HOURS 投 CloudWatch）"}],"a":"ABD","e":"① 答案：A/B/D。② 成本大头是 CloudWatch 日志采集费（$0.50/GB），日志量越大与 S3 方案差距越明显。③ 点破：C 错——每种日志类型只能配一个投递目的地，组合使用不会产生重复计费。④ 溯源：enterprise-handbook Step 3 方案对比与选型建议。"},{"id":"dlv-6","d":4,"t":"多选","q":"Amazon Quick 当前支持的日志类型包括？（多选）","o":[{"l":"A","t":"CHAT_LOGS（对话交互）"},{"l":"B","t":"AGENT_HOURS_LOGS（Agent/Research 工时消耗）"},{"l":"C","t":"KB_FILE_SYNC_LOGS（知识库文档同步结果）"},{"l":"D","t":"AUDIT_TRAIL_LOGS（管理员操作审计）"}],"a":"ABC","e":"① 答案：A/B/C——共 5 种，另有 FEEDBACK_LOGS 与 INDEX_USAGE_LOGS。② 每种日志类型须创建独立的 Delivery Source，但可复用同一目的地。③ 点破：D 为杜撰类型。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §3 支持的日志类型。"},{"id":"dlv-7","d":4,"t":"单选","q":"Agent Hours 日志的计量粒度是？","o":[{"l":"A","t":"按任务记录，一次 Deep Research 一条"},{"l":"B","t":"按计算步骤记录（每次 LLM 推理或工具调用一条），且无 conversation_id/task_id 字段、无法直接按任务聚合"},{"l":"C","t":"按天汇总一条"},{"l":"D","t":"按用户月度汇总一条"}],"a":"B","e":"① 答案：B。② 一次 Agent 任务会产生多条记录，每条 usage_hours 值很小（如 0.0006）；只能通过「用户+时间窗口」近似估算单次任务消耗。③ 点破：A/C/D 与官方字段口径不符。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §7b。"},{"id":"dlv-8","d":4,"t":"单选","q":"Chat Logs 中 latency、time_to_first_token 等性能字段为什么可能看不到？","o":[{"l":"A","t":"这些字段只在企业版记录"},{"l":"B","t":"它们默认不会加入日志订阅，需在调用 CreateDelivery API 时显式指定 recordFields 参数"},{"l":"C","t":"需要额外购买付费日志包"},{"l":"D","t":"AWS 尚未实现这些字段"}],"a":"B","e":"① 答案：B。② 如需延迟/首 token 等性能分析，务必在配置时加上这些 recordFields。③ 点破：A/C/D 均无依据。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §7c。"},{"id":"dlv-9","d":4,"t":"单选","q":"情境：合规团队担心 CloudWatch 里的 Chat Logs 含员工敏感对话。按原厂安全建议，最直接的组合措施是？","o":[{"l":"A","t":"直接关闭日志功能"},{"l":"B","t":"对敏感数据使用客户托管 KMS 密钥加密，并实施最低权限 IAM 策略限制日志组访问、按合规要求配置保留期"},{"l":"C","t":"让员工统一签署保密协议即可"},{"l":"D","t":"把日志组设为公开只读便于审计"}],"a":"B","e":"① 答案：B。② Chat Logs 含 user_message 等实际对话内容，可能包含敏感信息或 PII；另有日志屏蔽策略、订阅时筛选敏感字段等手段。③ 点破：A 因噎废食；C 无技术效力；D 与安全方向相反。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §7g 隐私注意。"},{"id":"dlv-10","d":4,"t":"多选","q":"关于企微远程 MCP 的员工扫码授权，以下做法正确的有？（多选）","o":[{"l":"A","t":"首次授权名下没有机器人，只能选新建"},{"l":"B","t":"重新授权时必须选「绑定已有机器人」并选中原来那个——选新建会永久失去旧机器人所建文档/表格/日程的编辑权限"},{"l":"C","t":"每次都重新新建一个机器人更干净"},{"l":"D","t":"令牌到期客户端会自动续期，正常情况下无需重新授权"}],"a":"ABD","e":"① 答案：A/B/D。② 这是全流程最容易造成不可逆损失的环节，交付时务必提前告知员工。③ 点破：C 恰是触发不可逆损失的错误操作。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §六员工侧扫码授权。"},{"id":"dlv-11","d":4,"t":"单选","q":"Check Ride 笔试覆盖四大核心能力。其中「客户需求挖掘、行业场景识别、方案设计与 PoC 交付」属于哪一项？","o":[{"l":"A","t":"DEPLOYMENT 部署接入"},{"l":"B","t":"FEATURE 产品功能"},{"l":"C","t":"SCENARIO 场景落地"},{"l":"D","t":"FDE·QDE 现场交付"}],"a":"C","e":"① 答案：C。② 四大能力：DEPLOYMENT=部署接入/身份集成/数据源接入/权限管理；FEATURE=Desktop 核心（Knowledge Graph/Memory/MCP/Scheduled Tasks/Browser Automation/Deep Research/Skills）与 Web（Space/Custom Agent/Quick Research/竞品比对）；SCENARIO=需求挖掘/场景识别/方案设计/PoC；FDE·QDE=驻场交付流程/客户沟通/问题升级。③ 点破：其余三项与该描述对应错位。④ 溯源：原厂《Partner QDE/FDE Check Ride 认证流程》 §4.3 现场测试题覆盖表。"},{"id":"dlv-12","d":4,"t":"单选","q":"客户 IT 问「能不能完全限制 Quick 只允许公司网络访问」。能力地图中对应的功能是？","o":[{"l":"A","t":"VPC connections（已可用）"},{"l":"B","t":"IP/VPC 访问限制——只允许公司出口 IP/VPC 白名单访问，公司外一律拒绝"},{"l":"C","t":"Brand customization"},{"l":"D","t":"Limit profiles（用量限额）"}],"a":"B","e":"① 答案：B。② 注意区分：VPC connections（Quick 经 VPC 私网直连内网数据库）在原厂地图标注为「规划中」，对外沟通须显式说明状态。③ 点破：A 状态错位（规划中且用途不同）；C 是品牌定制；D 是用量限额。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §一 身份与数据边界。"},{"id":"dlv-13","d":4,"t":"单选","q":"情境：某金融科技公司 100+ Desktop 用户在企业网络下随机出现「something went wrong」，手机 5G 直连正常。按踩坑案例，正确的处置是？","o":[{"l":"A","t":"让全员改用手机热点办公"},{"l":"B","t":"判断 IdP 使用 opaque token（非 JWT）与 Quick 的 token 刷新机制不兼容——切换到支持标准 JWT 的 IdP 并补全网络白名单"},{"l":"C","t":"直接重装全部客户端"},{"l":"D","t":"关闭企业防火墙"}],"a":"B","e":"① 答案：B。② 排查思路：复杂网络环境先用直连排除网络因素；优先选择支持标准 JWT 的 IdP。③ 点破：A 回避问题；C 治标不治本；D 不可接受。④ 溯源：enterprise-handbook Step 4 案例 3。"}],"sections":[{"h":"4.1 Check Ride 认证体系与四大能力","body":"Amazon Quick 的合作伙伴认证叫 Check Ride。核心目标很明确：确保每一位伙伴工程师具备 Quick 的实施能力。认证不考理论背景，只考你能不能把 Quick 交付到客户手上。\n\nCheck Ride 分四个阶段推进，线上与线下结合。每个阶段产出物不同，层层递进。\n\n**PHASE I：线上自学。** 伙伴学员在 AWS Skill Builder 完成 Agentic AI Essentials 课程（简体中文版，约两小时）。同时通读《Amazon Quick 伙伴学习材料汇总》。这个阶段没有考试，但课程必须完成。注册不等于完成，原厂反复强调这一点。\n\n**PHASE II：现场培训与笔试。** 多地域同步举行。学员到场参加半天培训后，现场作答纸质试卷。笔试只在现场进行，不设线上考试。培训可以线上参加，但笔试必须到场。\n\n**PHASE III：Deck 与视频评审。** 学员提交约十页 Deck 和十五分钟演示视频。视频须露出本人头像，逐一讲解五大考核方向。语音说明需清晰覆盖四个维度：技术原理、集成路径、实现方式、运行结果。评审委员会按五个方向各打八分，满分四十分。\n\n**PHASE IV：线上 Office Hour。** 颁发认证证书，针对认证中普遍问题进行答疑。未达标学员会获得补考与再评估指引。\n\n举个例子：某伙伴工程师在笔试中发现自己对 SSO 集成的 OIDC 五项硬性要求记忆模糊。回去后重新精读身份体系选型指南。在 PHASE III 的 Deck 中，他用 Keycloak 中转方案做了完整演示，最终拿到评级 A。四个阶段互相弥补，前面薄弱不代表最终不达标。\n\n认证覆盖四大核心能力，与刷题四域一一对应：\n\n- **DEPLOYMENT 部署接入**：Desktop 与 Web 部署、身份集成、数据源接入、权限管理。\n- **FEATURE 产品功能**：Desktop 核心能力（Knowledge Graph、Memory、MCP 等）；Web 端 Space、Custom Agent、Quick Research 及竞品比对。\n- **SCENARIO 场景落地**：客户需求挖掘、行业场景识别、方案设计与 PoC 交付。\n- **FDE/QDE 现场交付**：驻场交付流程、客户沟通、问题升级。\n\n笔试题目从这四个方向出题。学习材料汇总的范围与笔试范围完全重叠。\n\n认证结果分三类，对四个方向的得分率各有要求：\n\n- **业务类认证**：可主导客户 Workshop。场景和交付须达八成以上，功能须过六成。\n- **技术类认证**：可作为合格技术人员参与 QDE 项目。部署和交付须过八成，功能须过六成。\n- **级别认证**：门槛最高。四项均须高分，最终评估须达 A。\n\n获得认证必须同时满足三个条件。完成线上培训、现场测验合格、Deck 与视频评审合格。缺一不可。\n\n#### 常见误区与易错点\n\n- 误以为 PHASE I 只需注册课程即可。原厂明确要求必须完成，而非只注册。\n- 误以为笔试可以远程参加。笔试只在现场，培训才可线上。\n- 混淆三类认证的得分要求。业务类侧重场景，技术类侧重部署，级别认证四项全高。\n- 忽视视频要求中须露出学员头像。每人各自讲解，不能合并录制。\n\n#### 记忆要点\n\n- 四阶段：自学 → 现场笔试 → Deck 视频 → Office Hour 颁证。\n- 四大能力：部署、功能、场景、交付，与刷题四域一一对应。\n- 三类认证各有侧重。级别认证门槛最高，四项均须达标且最终评估须达 A。\n- 认证三条件缺一不可：线上课程完成、笔试合格、评审合格。"},{"h":"4.2 企业落地端到端交付流程","body":"企业部署 Quick 的端到端流程分为五个阶段，从网络评估到上线运营，每个阶段都有明确的交付物和检查点。\n\n#### Step 0：评估与准备\n\n第一步不是装软件，而是确认网络连通性。Quick Desktop 需要访问 AWS 服务端点，如果企业网络有代理或防火墙，要先确认 HTTPS 出站和 WebSocket 通道畅通。同时确认 Quick 企业版本（Enterprise）已开通，管理员拥有 Admin Console 访问权限。交付物：网络连通性检查清单、企业版本确认。\n\n#### Step 1：认证接入\n\n配置身份认证（SSO）是整个部署流程中最关键的一步。选定认证协议（SAML 或 OIDC），在企业 IdP 侧完成应用注册，再到 Quick Admin Console 完成对接。认证方式一旦选定不可更改，因此务必在 PoC 阶段就确定最终方案。交付物：IdP 应用配置完成、测试账号登录验证通过。\n\n#### Step 2：工具集成\n\n认证打通后，下一步是把企业已有的工具和数据源接入 Quick。常见集成包括：企业微信（WeChat Work）消息渠道、内部知识库文档、CRM 和 ERP 系统的 API 接口。MCP（Model Context Protocol）是主要的集成协议。本地 MCP 适合内网数据源，远程 MCP 适合 SaaS 工具。交付物：至少一个核心业务系统完成集成验证。\n\n#### Step 3：用户管理与日常运维\n\n系统上线后进入运维阶段。管理员通过 Admin Console 管理用户、查看用量、审计行为日志。Quick 支持五种 CloudWatch 日志类型，每种需创建独立的 Delivery Source。\n\n常见运维问题有三类：\n\n- **新用户首次登录失败**：通常是邮箱域名未加白名单。\n- **日志投递延迟**：检查 Delivery Source 状态。\n- **用量突增**：排查是否有异常自动化任务。\n\n交付物：运维手册、日志监控面板、常见问题应对流程。\n\n#### Step 4：踩坑总结与最佳实践\n\n实际部署中最常见的三类坑：\n\n- 认证配置遗漏：OIDC 的五项硬性要求（Public Client、PKCE、offline_access、Discovery、email claim）缺一个都会导致登录失败。\n- 邮箱不一致：IdP 里的邮箱和 Quick 注册邮箱必须完全匹配，大小写也算。\n- 网络白名单不全：除了主域名，还需要放行 WebSocket 端点和 API 网关地址。\n\n最佳实践是在 PoC 阶段就跑通全流程（认证 → 集成 → 日志），不要等正式部署才发现问题。\n\n💡 **场景举例**：某制造企业部署 Quick Enterprise，Step 0 发现代理服务器拦截了 WebSocket 连接。运维团队在防火墙添加白名单规则后，Desktop 端正常连接。Step 1 选择 OIDC 对接 Azure AD，但初次配置漏了 offline_access scope，导致 token 刷新失败。补上后登录流程跑通。整个部署从评估到上线用了两周。\n\n#### 常见误区与易错点\n\n- 跳过 Step 0 直接配认证：网络不通会导致认证回调超时，表现和认证配置错误一样，容易误判。\n- 认为 SAML 和 OIDC 可以后期切换：认证方式选定后不可更改，必须一开始就选对。\n- PoC 阶段只验证功能不验证运维：日志投递、用量监控等运维能力也应在 PoC 阶段验证。\n- 白名单只加主域名：WebSocket 端点和 API 网关地址也需要放行。\n\n#### 记忆要点\n\n- 五步流程：评估准备 → 认证接入 → 工具集成 → 用户运维 → 踩坑总结。\n- Step 0 核心：网络连通性确认（HTTPS + WebSocket）。\n- Step 1 核心：认证方式不可逆，PoC 阶段必须确定。\n- OIDC 五项硬要求：Public Client、PKCE、offline_access、Discovery、email claim。\n- 最佳实践：PoC 阶段跑通全流程，不留到正式部署。"},{"h":"4.3 运维与监控","body":"企业部署 Quick 之后，运维最关心两件事：用量是否可控、行为是否可审计。两件事都靠 CloudWatch 日志体系来支撑。\n\n#### 五种日志类型\n\nAmazon Quick 当前支持五种日志。每种须创建独立的 Delivery Source，但可以复用同一个目的地。\n\n- **CHAT_LOGS**：记录用户与 AI 的对话交互。含会话 ID、用户消息、系统回复等。\n- **FEEDBACK_LOGS**：记录用户对 AI 回复的评价及原因。\n- **AGENT_HOURS_LOGS**：记录工时消耗，用于追踪订阅用量。\n- **INDEX_USAGE_LOGS**：记录索引存储使用情况。\n- **KB_FILE_SYNC_LOGS**：记录知识库同步中每个文档的处理结果。\n\n其中工时日志按计算步骤记录，不按任务记录。一次 Deep Research 会产生多条记录，每条 usage_hours 值很小（如 0.0006）。当前该日志没有 task_id 字段，无法按任务聚合。只能通过用户加时间窗口近似估算。\n\n#### 配置三步走\n\n日志配置遵循三步：传送源 → 传送目的地 → 传送关联。\n\n1. 创建日志组并设保留期，建议九十天。\n2. 用 CLI 命令指定来源（Quick 账户 ARN 加日志类型）。\n3. 指定目的地并将源和目的地关联。\n\n配好后覆盖该账户全部用户。\n\n前置条件有三项。企业版或专业版订阅（免费版不支持）。IAM 中需有对应权限。目标 Region 须与 Quick 部署 Region 一致。\n\n#### 日志管理两方案对比\n\n原厂提供两条投递路径，选型取决于规模和场景。\n\n方案一：日志投递到 CloudWatch Log Group。配置简单、即开即用，支持实时搜索和告警。适合五十人以内的团队。主要成本来自日志采集费。\n\n方案二：通过 Logs V2 直投 S3 Bucket，无需中转 Log Group。长期存储成本远低于方案一。适合百人以上的部署，主要用于合规归档和事后追溯。\n\n两者可按日志类型组合使用。比如对话日志量大，直投 S3。工时日志投 Log Group 以便实时监控。每种类型只能配一个目的地，不会重复计费。\n\n举个例子：某企业有一百五十个用户，月产十 GB 日志。运维将工时日志投 Log Group 并设用量告警。单用户日消耗超标就通知管理员。同时对话日志直投 S3 做归档，月存储成本远低于全走 Log Group。\n\n#### 常用查询\n\n配好之后，用 Logs Insights 可快速分析。常见查询四类：查看特定用户工时消耗、按用户统计每日总量、按服务类型统计分布、查看用户对话记录。\n\n#### 隐私注意\n\n对话日志包含用户实际对话内容，可能含敏感信息。安全建议：敏感数据用 KMS 密钥加密；实施最低权限 IAM 策略；按合规要求设保留期；必要时启用日志屏蔽策略。\n\n#### 常见运维问题速查\n\nAgent Hours 超额后暂停，三小时自动恢复或升级套餐。切换网络后退出，重新登录并核对白名单。十八小时登出是正常 Session 过期。随机异常多与 token 刷新相关，建议用支持 JWT 的 IdP。Remote MCP 在 Windows 崩溃为已知 bug，临时用 Web 版替代。\n\n#### 常见误区与易错点\n\n- 以为工时日志按任务记录。实际按步骤记录，需按用户加时间窗口聚合。\n- 忽视对话日志部分字段默认不出现。延迟、首 token 时间等需配置时显式指定。\n- 混淆两种方案适用场景。小团队用 Log Group，大规模用 S3 直投。\n- 误以为免费版支持日志监控。仅企业版和专业版支持。\n\n#### 记忆要点\n\n- 五种日志：对话、反馈、工时、索引用量、知识库同步。\n- 配置三步：传送源 → 传送目的地 → 传送关联，一次覆盖全账户。\n- 两方案选型：五十人内用 Log Group，百人以上用 S3 直投。\n- 工时日志按步骤记录，无 task_id，只能近似估算。\n- 对话日志含原文，须加密、控权限、设保留期。"},{"h":"4.4 现场工程师沟通与问题升级","body":"现场工程师的工作不只是技术实施。你还要和客户的 IT 管理员、业务负责人、最终用户打交道。沟通质量直接影响交付效率。\n\n#### 客户沟通要点\n\n第一，管理预期。Quick 功能在快速迭代中，部分能力有已知限制。比如 Remote MCP 在 Windows 上的崩溃问题、IAM Federation 下角色无法降级等。遇到此类情况，直接告知现状和替代方案，不要回避。\n\n第二，用对方听得懂的语言。对 IT 管理员讲 OIDC、SAML、PKCE。对业务负责人讲「一键登录、不记额外密码」。同一件事，面对不同角色换不同说法。\n\n第三，先小后大。原厂建议先小范围 PoC（五到十人），验证全链路后再推广。不要未验证就承诺全员上线时间。\n\n举个例子：某金融科技公司部署初期，工程师未验证 IdP 兼容性就承诺两周全员上线。结果 IdP 用 opaque token，Quick 的刷新机制不兼容，反复出现异常。最终多花三周部署 Keycloak。如果一开始先做 PoC，第一天就能发现问题。\n\n#### 问题升级路径\n\n现场遇到问题，按三层逐级处理。\n\n第一层：自查。对照原厂故障诊断文档排查。大多数问题在这一层解决。网络白名单遗漏、Session 过期、权限不足都属常见。\n\n第二层：内部协作。自查无法解决时提交内部技术团队。附完整错误信息、操作步骤、环境配置。\n\n第三层：原厂支持。开 AWS Support Case 提交工单。对于已知限制，原厂可能尝试后台调整。\n\n认证体系也设计了持续支持。PHASE IV 的 Office Hour 针对共性问题集中答疑。沟通群作为持续渠道，共性问题会安排专题讲解。\n\n#### QDE 交付底线\n\n现场培训中有一个重要议题：如何保持交付底线。底线是哪些事必须做到，做不到就不能交付。\n\n核心底线包括四项。IdP 必须满足 Desktop OIDC 五项要求。Authentication Method 选择前须与客户 IT 充分沟通，因为不可更改。邮箱一致性须在首批用户开通前验证。网络白名单须覆盖全部端点。\n\n这些是硬约束，不是建议。跳过任何一项都会导致返工，甚至需要重建账号。\n\n#### 常见误区与易错点\n\n- 遇到已知问题不告知客户，试图自行修复。应直接沟通现状和替代方案。\n- 未做 PoC 就承诺全员上线时间表。应验证全链路后再给时间线。\n- 升级问题时只描述现象。应附上错误信息、步骤和配置详情。\n- 忽视 Authentication Method 不可更改，未确认客户理解就直接操作。\n\n#### 记忆要点\n\n- 沟通三原则：管理预期、用对方语言、先小后大。\n- 升级三层：自查 → 内部协作 → 原厂 Support Case。\n- 交付底线四项：IdP 兼容性、认证方式不可改、邮箱一致、白名单覆盖。\n- Office Hour 和沟通群是认证后的持续支持渠道。"}]}]};
const QUIZ_TOTAL = 60;
</script>
<script>
(function(){
'use strict';
const DATA = (typeof LEARNING_DATA !== 'undefined' && LEARNING_DATA) ? LEARNING_DATA : null;

/* ============ 常量与工具 ============ */
const EXAM = DATA ? (DATA.meta.exam || 'CERT').toLowerCase() : 'cert';   // clf-c02
const STORE_KEY = EXAM + '-v2';                                          // 进度键：clf-c02-v2
const COLORS = ['#4f46e5','#7c3aed','#9333ea','#a855f7'];                // 每章主题色（N 章 N 色，N>4 循环）
const home = document.getElementById('home');
const chapBox = document.getElementById('chapters');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inlineMd(s){
  let t = esc(s);
  t = t.replace(/\n/g,'<br>');
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
  return t;
}
function isTblSep(ln){ const core = ln.replace(/^\s*\|/,'').replace(/\|\s*$/,''); if(!core.includes('-')) return false; return /^[\s:\-|]+$/.test(ln) && /-/.test(ln); }
function loadProg(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveProg(p){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){} }

/* ============ 块级 md 渲染（段落/引用/表格/列表/图占位符） ============ */
function renderBlocks(seg, figs){
  const lines = seg.replace(/\r/g,'').split('\n');
  let html = ''; let i = 0; const n = lines.length;
  while(i < n){
    const ln = lines[i]; const s = ln.trim();
    if(s === ''){ i++; continue; }
    const fm = s.match(/^\[\[fig:([\w-]+)\]\]$/);
    if(fm){ const f = (figs||{})[fm[1]]; if(f) html += figHtml(f); i++; continue; }
    if(s.startsWith('|') && i+1 < n && isTblSep(lines[i+1].trim())){
      let rows = [];
      while(i < n && lines[i].trim().startsWith('|')){ rows.push(lines[i].trim()); i++; }
      const heads = rows[0].replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim()));
      const data = rows.slice(2).map(r => r.replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim())));
      html += '<div class="tbl-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'
        + data.map(r => '<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if(s.startsWith('>')){
      let q = [];
      while(i < n && lines[i].trim().startsWith('>')){ q.push(lines[i].replace(/^\s*>\s?/,'').trim()); i++; }
      html += '<blockquote>'+inlineMd(q.join(' '))+'</blockquote>'; continue;
    }
    if(/^[-*]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^[-*]\s+/.test(t)){ items.push(inlineMd(t.replace(/^[-*]\s+/,''))); i++; } else break; }
      html += '<ul>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; continue;
    }
    if(/^\d+[.、]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^\d+[.、]\s+/.test(t)){ items.push(inlineMd(t.replace(/^\d+[.、]\s+/,''))); i++; } else break; }
      html += '<ol>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ol>'; continue;
    }
    const hm = s.match(/^(#{1,6})\s+(.+)$/);
    if(hm){ html += '<h4 class="sec-h">'+inlineMd(hm[2])+'</h4>'; i++; continue; }
    let para = [];
    while(i < n){
      const t = lines[i].trim();
      if(t === '' || t.startsWith('|') || t.startsWith('>') || /^[-*]\s+/.test(t) || /^\d+[.、]\s+/.test(t) || /^#{1,6}\s/.test(t) || /^\[\[fig:[\w-]+\]\]$/.test(t)) break;
      para.push(t); i++;
    }
    if(para.length) html += '<p>'+inlineMd(para.join(' '))+'</p>';
  }
  return html;
}

/* ===== 节内子块解析与渲染（v6）：#### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点）
   本节定位=弱化引言、案例/记忆要点=卡片、常见误区与易错点=警示小节——均不占编号。
   解析与渲染共用 parseSectionBlocks，保证正文 h3 与左侧目录两级条目 1:1。 ===== */
const SUB_RAW='raw', SUB_LEAD='lead', SUB_KP='kp', SUB_CASE='case', SUB_MIS='mis', SUB_MEM='mem';
function subTypeOf(title){
  if(title === '本节定位') return SUB_LEAD;
  if(title === '案例') return SUB_CASE;
  if(title === '记忆要点') return SUB_MEM;
  if(title === '常见误区与易错点') return SUB_MIS;
  return SUB_KP;
}
function parseSectionBlocks(md){
  const parts = (md||'').replace(/\r/g,'').split(/\n(?=####\s)/);
  const out = [];
  parts.forEach(part=>{
    const m = part.match(/^####\s*(.+?)\s*\n([\s\S]*)$/);
    if(!m){ const t = part.trim(); if(t) out.push({ type:SUB_RAW, title:'', body:t }); return; }
    out.push({ type:subTypeOf(m[1].trim()), title:m[1].trim(), body:(m[2]||'').trim() });
  });
  return out;
}
function countKp(body){ let m=0; parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP) m++; }); return m; }
function kpListOf(body){
  const kps=[]; let m=0;
  parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP){ m++; kps.push({ m:m, title:b.title }); } });
  return kps;
}
function renderSectionBody(md, figs, d, n){
  const blocks = parseSectionBlocks(md);
  let h = ''; let kp = 0;
  for(const b of blocks){
    if(b.type === SUB_RAW){ h += renderBlocks(b.body, figs); continue; }
    if(b.type === SUB_KP){
      kp++;
      h += '<h3 class="mh3" id="sec-'+d+'-'+n+'-'+kp+'"><span class="h3no">'+d+'.'+n+'.'+kp+'</span><span>'+inlineMd(b.title)+'</span></h3>'
         + renderBlocks(b.body, figs);
      continue;
    }
    if(b.type === SUB_CASE){ h += '<div class="case-card"><h4 class="sec-h">案例</h4>'+renderBlocks(b.body, figs)+'</div>'; continue; }
    if(b.type === SUB_MEM){ h += '<div class="mem-card"><h4 class="sec-h">记忆要点</h4>'+renderBlocks(b.body, figs)+'</div>'; continue; }

  }
  return h;
}
