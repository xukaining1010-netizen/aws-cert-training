<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>学习材料</title>
<style>
/* ===== 页面结构：首页目录 + 章级分页 SPA（非单一长页） ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;font-size:17px;line-height:1.7}
.wrap{max-width:1200px;margin:0 auto;padding:24px 28px 60px}
@media(max-width:768px){.wrap{padding:16px 14px 48px}}

/* ===== 首页 ===== */
.hdr{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:12px;padding:30px 32px 26px;margin-bottom:18px}
.hdr-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:3px 12px;border-radius:20px;margin-bottom:10px}
.hdr h1{font-size:24px;font-weight:800;line-height:1.4}
.hdr-sub{font-size:13px;opacity:.9;margin-top:8px}
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.ov-item{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.ov-num{font-size:28px;font-weight:800;color:#4f46e5;line-height:1.2}
.ov-lbl{font-size:12px;color:#64748b;margin-top:4px}
@media(max-width:768px){.ov{grid-template-columns:repeat(2,1fr)}}

.card-s{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.cs-title{font-size:18px;font-weight:700;color:#374151;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}

/* 章节目录卡 */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ch-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 16px;cursor:pointer;transition:.2s;margin-bottom:0}
.ch-card:hover{border-color:#7c3aed;transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,70,229,.12)}
.ch-card.done{border-color:#16a34a}
.cc-num{font-size:11px;font-weight:700;margin-bottom:3px}
.cc-title{font-size:15px;font-weight:700;color:#1e293b;margin-bottom:6px}
.cc-meta{font-size:13px;color:#64748b}
.cc-prog{margin-top:8px}
.pm{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:3px}
.pbar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .4s}

/* 考试速览 */
.exam-quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.eq-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 10px;text-align:center}
.eq-num{font-size:20px;font-weight:800;color:#4f46e5;line-height:1.2}
.eq-sub{font-size:10.5px;color:#64748b;margin-top:2px}
.eq-lbl{font-size:11px;color:#64748b;margin-top:5px}
.exam-two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:10px}
@media(max-width:768px){.exam-two-col{grid-template-columns:1fr}}
.exam-sub-t{font-size:14px;font-weight:700;color:#374151;margin:4px 0 10px}
.exam-domain-tbl{width:100%;border-collapse:collapse;font-size:15px}
.exam-domain-tbl th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;padding:9px 12px;text-align:left;font-weight:700}
.exam-domain-tbl td{padding:9px 12px;border-bottom:1px solid #e9d5ff;vertical-align:middle}
.exam-domain-tbl tr:nth-child(even) td{background:#faf5ff}
.domain-chip{display:inline-block;border-radius:20px;padding:2px 11px;font-size:12px;font-weight:700;background:#ede9fe;color:#5b21b6;cursor:pointer;border:none;transition:.15s}
.domain-chip:hover{background:#ddd6fe}
.exam-info-list{font-size:15px;color:#374151;margin:0 0 12px 18px}
.exam-info-list li{margin-bottom:6px;line-height:1.7}
.exam-steps{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px;font-size:14px}
.step-block{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;padding:9px 12px;font-size:13px;color:#4338ca;flex:1 1 150px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.step-block b{display:block;font-size:13px}
.step-block span{display:block;font-size:11.5px;color:#6d28d9;margin-top:3px}
.step-arrow{color:#a78bfa;font-weight:700;font-size:16px;padding:0 4px;flex:0 0 auto;align-self:center}
details.exam-faq{margin-top:12px;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;background:#f8fafc}
details.exam-faq summary{font-size:14px;font-weight:700;color:#374151;cursor:pointer}
details.exam-faq p{margin:9px 0 0;font-size:14px;color:#475569;line-height:1.75}

/* 14 天计划 */
.ptbl{width:100%;border-collapse:collapse;font-size:15px}
.ptbl th{background:#f8fafc;padding:11px 12px;text-align:left;font-weight:600;color:#374151;border-bottom:2px solid #e2e8f0;font-size:14px}
.ptbl td{padding:10px 12px;border-bottom:1px solid #f8fafc;vertical-align:middle}
.ptbl tr:last-child td{border-bottom:none}
.day{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.chip-p{background:#ede9fe;color:#5b21b6}.chip-p:hover{background:#ddd6fe}
.focus{font-size:12px;color:#64748b}

/* ===== 章面板 ===== */
.ch-topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);padding:8px 18px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px}
.back-btn{background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:13px;font-weight:600;border-radius:8px;padding:5px 14px;cursor:pointer;white-space:nowrap;transition:.15s}
.back-btn:hover{background:#ede9fe}
.tn-title{font-size:15px;font-weight:700;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-hdr{color:#fff;padding:20px 22px 16px;border-radius:12px 12px 0 0;margin-bottom:0}
.ch-badge{font-size:13px;font-weight:700;opacity:.9;margin-bottom:5px;display:block}
.ch-title{font-size:22px;font-weight:800}
.panel{margin-bottom:14px}
.task-list{padding-left:22px;font-size:16px;color:#374151;line-height:2.0}
.task-list li::marker{color:#a78bfa}
.task-list a{color:#374151;text-decoration:none}
.task-list a:hover{color:#4f46e5}
.tl-id{display:inline-block;min-width:38px;font-weight:700;color:#4f46e5;margin-right:6px}
.panel-hr{border:none;border-top:1px solid #e2e8f0;margin:14px 0}

/* ===== 正文排版（规范 B） ===== */
.mdbody .sec-block h2.mh2{font-size:19px;font-weight:700;color:#4f46e5;margin:4px 0 12px;padding:10px 0 8px;border-top:1px solid #e2e8f0}
.mdbody p{font-size:17px;color:#374151;margin-bottom:14px;line-height:1.9}
.mdbody ul,.mdbody ol{font-size:17px;color:#374151;padding-left:24px;margin-bottom:12px}
.mdbody li{margin-bottom:8px;line-height:1.9}
.mdbody blockquote{border-left:3px solid #a78bfa;padding:10px 16px;background:#f5f3ff;font-size:15px;color:#5b21b6;margin:0 0 14px;border-radius:0 6px 6px 0;line-height:1.8}
.mdbody code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.mdbody h4.sec-h{font-size:17px;font-weight:600;color:#374151;margin:24px 0 10px;padding-left:12px;border-left:3px solid #a78bfa;line-height:1.4}
.mdbody .case-card,.mdbody .mem-card{border-radius:10px;padding:13px 16px;margin-bottom:14px}
.mdbody .case-card{background:#fff8e6;border:1px solid #ecd9a0}
.mdbody .mem-card{background:#eef3ff;border:1px solid #b9c9f7}
.mdbody .case-card h4.sec-h,.mdbody .mem-card h4.sec-h{border-left:none;padding-left:0;margin:0 0 8px;font-size:14px;font-weight:700}
.mdbody .case-card h4.sec-h{color:#9a7b1e}
.mdbody .mem-card h4.sec-h{color:#4361ee}
.mdbody .case-card p,.mdbody .mem-card p{font-size:15px}
.mdbody .case-card ul,.mdbody .mem-card ul{margin-bottom:0;font-size:15px}
/* 表格（规范 C） */
.tbl-wrap{overflow-x:auto;margin:0 0 14px;border:1px solid #e9d5ff;border-radius:10px}
.tbl-wrap table{min-width:480px}
table{border-collapse:collapse;width:100%;font-size:16px}
.mdbody th,.mdbody td{padding:11px 16px;text-align:left;border-bottom:1px solid #e9d5ff;vertical-align:top;line-height:1.6}
.mdbody thead th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;font-weight:700;font-size:15px;white-space:nowrap}
.mdbody tbody tr:nth-child(even) td{background:#faf5ff}
.mdbody tbody tr:last-child td{border-bottom:none}
/* 图块（v2.1 图文同流） */
.fig-block{background:#f8f7ff;border:1px solid #ddd6fe;border-radius:12px;padding:14px 16px;margin:0 0 14px}
.fig-title{font-size:13px;font-weight:700;color:#4f46e5;text-align:center;margin-bottom:10px}
.fig-body{overflow-x:auto}
.fig-body svg{display:block;margin:0 auto;height:auto}
.fig-caption{font-size:12px;color:#6b7280;text-align:center;margin-top:10px;font-style:italic}
/* 手绘图 CSS 类（兼容） */
.compare-tbl{width:100%;border-collapse:collapse;font-size:13px}
.compare-tbl th{padding:9px 12px;font-weight:700;font-size:12px;text-align:center}
.compare-tbl td{padding:8px 12px;border:1px solid #e2e8f0;font-size:13px;vertical-align:top;line-height:1.5}
.compare-tbl tr:nth-child(even) td{background:#faf9ff}
.flow-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.flow-node{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;text-align:center;min-width:80px}
.flow-node.light{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#4338ca}
.flow-node.green{background:linear-gradient(135deg,#06d6a0,#059669);color:#fff}
.flow-arrow{color:#a78bfa;font-size:18px;font-weight:700;flex-shrink:0}
.cycle-wrap{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.cycle-step{display:flex;flex-direction:column;align-items:center;gap:4px}
.cycle-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.cycle-label{font-size:11px;color:#374151;text-align:center;max-width:70px;line-height:1.3}
.cycle-arrow{color:#a78bfa;font-size:16px;align-self:flex-start;margin-top:6px}
.stair-wrap{display:flex;align-items:flex-end;gap:8px;padding:8px 0;justify-content:center;flex-wrap:wrap}
.stair-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.stair-bar{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:6px 6px 0 0;width:80px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;padding:4px}
.stair-label{font-size:11px;color:#374151;text-align:center;max-width:80px;line-height:1.3}

/* 域尾提示卡 */
.tips-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tips-card .tc-title{font-size:15px;font-weight:700;margin-bottom:10px;color:#374151}
.tips-card table{font-size:14px}
.tips-card th{padding:9px 12px;font-size:13px}
.tips-card td{padding:9px 12px;font-size:14px;line-height:1.6}

/* ===== 章末练习 quiz-box（模块 10） ===== */
.quiz-box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:18px 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);scroll-margin-top:78px}
.quiz-hdr{display:flex;align-items:baseline;gap:14px;font-size:18px;font-weight:700;color:#374151;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}
.quiz-score{font-size:14px;font-weight:700;color:#4f46e5;margin-left:auto;white-space:nowrap}
.qi{border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.qi.done{background:#fafafa}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qbadge{background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:700}
.qtype{font-size:11px;border-radius:12px;padding:1px 9px;font-weight:600}
.qtype-s{background:#e0f2fe;color:#0369a1}
.qtype-m{background:#fce7f3;color:#be185d}
.qstem{font-size:16px;color:#1e293b;margin-bottom:10px;line-height:1.8}
.qstem code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{background:#fff;border:1.5px solid #e2e8f0;border-radius:9px;padding:11px 14px;font-size:15.5px;color:#374151;cursor:pointer;transition:.15s;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:#a78bfa}
.opt .ol{font-weight:700;color:#4f46e5;flex-shrink:0}
.opt.sel{border-color:#4f46e5;background:#ede9fe}
.opt.cor{border-color:#16a34a;background:#dcfce7}
.opt.wrg{border-color:#dc2626;background:#fee2e2}
.opt.shc{border-color:#16a34a;background:#f0fdf4}
.qi.done .opt{cursor:default;pointer-events:none}
.qrow{margin-top:10px;display:flex;align-items:center;gap:12px}
.qbtn{background:#4f46e5;color:#fff;font-size:12px;font-weight:600;border:none;border-radius:7px;padding:7px 18px;cursor:pointer;transition:.15s}
.qbtn:hover{background:#4338ca}
.qbtn:disabled{background:#cbd5e1;cursor:default}
.qres{display:none;flex:1;border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.7}
.qres.ok{background:#dcfce7;color:#15803d}
.qres.err{background:#fee2e2;color:#b91c1c}
.qres.na{background:#fef3c7;color:#b45309}
.qres.show{display:block}
.score-box{display:none;text-align:center;background:#f5f3ff;border-radius:10px;padding:22px 16px;margin-top:16px}
.score-box.show{display:block}
.score-num{font-size:32px;font-weight:700;color:#4f46e5;line-height:1.3}
.score-lbl{font-size:13px;color:#6d28d9;margin-top:4px}
.score-box .sb-tip{font-size:12px;color:#64748b;margin-top:8px;line-height:1.7}

.footer{margin-top:26px;padding:18px 10px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:12.5px;text-align:center;line-height:1.9}
.footer a{color:#4f46e5;text-decoration:none}
@media(max-width:768px){.ptbl th,.ptbl td{font-size:13px}.mdbody th,.mdbody td{font-size:13px}}

/* ===== 章面板 v6 布局：左侧常驻目录槽 + 正文列 =====
   三条布局约定：① 正文 #### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点，见下方 .mh3）
   ② 左侧目录两级（节 ▸ 知识点，单开手风琴 + 滚动自动跟读）③ 左右两侧任何分辨率留白，目录常驻不遮正文：
   ≥1200px：.panel 栅格 [236px 目录槽 | 正文列]，目录 sticky 常驻；<1200px：目录槽变左侧抽屉（☰+遮罩）。 */
body.chapView .wrap{max-width:1420px}
.panel{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start;margin-bottom:14px}
.ch-side{position:sticky;top:14px;min-width:0;z-index:30}
.side-close{display:none}
.toc-open-btn{display:none}
.side-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:85;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.side-mask.show{opacity:1;visibility:visible}
.ch-toc{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 6px 24px rgba(15,23,42,.06);overflow:hidden}
.ch-toc .toc-hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;border-bottom:1px solid #f1f5f9}
.ch-toc .th-title{font-size:13px;font-weight:800;color:#4f46e5;white-space:nowrap}
.ch-toc .th-meta{font-size:11px;color:#94a3b8;font-weight:600;white-space:nowrap}
.ch-toc .toc-body{max-height:calc(100vh - 46px);overflow-y:auto;padding:8px}
.toc-list{list-style:none;margin:0;padding:0}
.toc-list a{display:flex;align-items:baseline;gap:6px;padding:5px 6px;border-radius:7px;color:#475569;text-decoration:none;line-height:1.45;font-size:13px;transition:.12s}
.toc-list a:hover{background:#f5f3ff;color:#4f46e5}
.toc-list a.act{background:#ede9fe;color:#3730a3;font-weight:600}
.toc-list .tl-id{font-size:11.5px;font-weight:700;color:#a78bfa;flex-shrink:0;font-variant-numeric:tabular-nums}
.toc-list a.act .tl-id{color:#4f46e5}
.toc-t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toc-sec>a.toc-sec-link{font-weight:600;color:#334155;padding-top:6px;padding-bottom:6px}
.toc-sec>a .toc-ar{margin-left:auto;flex-shrink:0;font-size:9px;color:#94a3b8;transition:transform .18s}
.toc-sec.open>a .toc-ar{transform:rotate(90deg);color:#4f46e5}
.toc-sub{list-style:none;margin:0;padding:0 0 3px;display:none}
.toc-sec.open>.toc-sub{display:block}
.toc-sub a{padding:3px 6px 3px 20px;font-size:12.5px;color:#64748b;line-height:1.4}
.toc-sub a .tl-id{font-size:11px;color:#c4b5fd}
/* 目录尾【本章练习】入口（v6.2 新增）：独立条目，虚线分隔，点击滚到章末练习区 #quiz-dX */
.toc-quiz{margin-top:7px;padding-top:3px;border-top:1px dashed #ddd6fe}
.toc-quiz>a.toc-quiz-link{font-weight:700;color:#6d28d9;padding-top:6px;padding-bottom:6px}
.toc-quiz>a .tl-id{color:#a78bfa}
.toc-quiz>a.act .tl-id{color:#6d28d9}
@media(max-width:1199px){
  .panel{display:block}
  .ch-side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:90;background:#fff;border-right:1px solid #e2e8f0;box-shadow:0 0 44px rgba(15,23,42,.18);transform:translateX(-102%);transition:transform .22s ease;padding:10px;overflow-y:auto}
  .ch-side.open{transform:none}
  .ch-side .ch-toc{border:none;box-shadow:none;border-radius:0}
  .ch-toc .toc-body{max-height:none;padding-right:4px}
  .toc-open-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:12.5px;font-weight:600;border-radius:8px;padding:4px 10px;cursor:pointer;transition:.15s;white-space:nowrap}
  .toc-open-btn:hover{background:#ede9fe}
  .side-close{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:none;background:#f1f5f9;color:#64748b;border-radius:7px;font-size:12px;cursor:pointer;font-weight:700;flex-shrink:0}
  .side-close:hover{background:#e2e8f0;color:#1e293b}
}
/* 阅读进度（吸顶条底部细线 + 百分比）：v6 新增
   注意：此处不再声明 position，78 行的 .ch-topnav{position:sticky;top:0} 保持生效——
   早前版本曾误加 position:relative 覆盖导致吸顶丢失（窄屏换章节要滚回顶），v6.1 已修复 */
.ch-topnav{overflow:hidden}

x;color:var(--primary)}#quizView .glossary-item{padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;line-height:1.6}#quizView .glossary-item:last-child{border:none;padding-bottom:0}#quizView .glossary-term{font-weight:600;color:var(--text)}#quizView .glossary-def{color:var(--text2)}#quizView .explanation.show{display:block}#quizView .explanation .result-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-weight:600;font-size:14px;margin-bottom:10px}#quizView .explanation .result-badge.correct{background:rgba(6,214,160,.15);color:var(--correct)}#quizView .explanation .result-badge.wrong{background:rgba(239,71,111,.15);color:var(--wrong)}#quizView .explanation .exp-text{font-size:14px;line-height:1.7;color:var(--text2)}#quizView .explanation .exp-source{font-size:12px;color:var(--text2);margin-top:8px;font-style:italic}#quizView .qnav{background:var(--card);border-radius:12px;padding:12px;border:1px solid var(--border);margin-top:12px}#quizView .qnav h4{font-size:13px;color:var(--text2);margin-bottom:8px}#quizView .qnav-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}#quizView .qnav-item{aspect-ratio:1;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;transition:.2s;background:var(--bg)}#quizView .qnav-item:hover{border-color:var(--primary)}#quizView .qnav-item.done-correct{background:var(--correct);color:#fff;border-color:var(--correct)}#quizView .qnav-item.done-wrong{background:var(--wrong);color:#fff;border-color:var(--wrong)}#quizView .qnav-item.current{border-color:var(--primary);border-width:2px;font-weight:700}#quizView .wrong-stats{display:flex;gap:12px;margin-bottom:16px}#quizView .wrong-stats .stat-card{flex:1}#quizView .wrong-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}#quizView .wrong-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:13px;cursor:pointer}#quizView .wrong-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}#quizView .wrong-item{padding:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px}#quizView .wrong-item .wi-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}#quizView .wrong-item .wi-domain{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--border)}#quizView .wrong-item .wi-actions{display:flex;gap:8px;margin-top:8px}#quizView .wrong-item .wi-actions button{font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--text)}#quizView .wrong-item .wi-actions button:hover{background:var(--border)}#quizView .stats-chart{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}#quizView .stats-chart h3{font-size:14px;margin-bottom:12px}#quizView canvas{width:100%!important;height:200px!important;border-radius:8px}#quizView .stats-table{width:100%;border-collapse:collapse;font-size:13px}#quizView .stats-table th, #quizView .stats-table td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--border)}#quizView .stats-table th{color:var(--text2);font-weight:500}#quizView .settings-section{margin-bottom:20px}#quizView .settings-section h3{font-size:15px;margin-bottom:12px;color:var(--text2)}#quizView .setting-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;cursor:pointer;width:100%;font-size:14px;color:var(--text);margin-bottom:8px;transition:.2s}#quizView .setting-btn:hover{border-color:var(--primary)}#quizView .setting-btn.danger{color:var(--wrong)}#quizView .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:.3s}#quizVi const QUIZ_QUESTIONS = [{"id":"feat-1","d":2,"t":"multiple","q":"在 quick.aws.com 注册 Amazon Quick 个人账号，以下哪些东西是【不需要】的？（多选）","o":[{"l":"A","t":"AWS 账号"},{"l":"B","t":"信用卡"},{"l":"C","t":"IT 部门介入"},{"l":"D","t":"可用的登录方式（邮箱或 Google/Apple/GitHub/Amazon 账号）"}],"a":["A","B","C"],"e":"① 答案：A/B/C——原厂明确「不需要 AWS 账号、不需要信用卡、不需要 IT 部门介入」。② 名词：quick.aws.com 是 Quick 个人版注册入口；登录方式支持邮箱、Google、Apple、GitHub、Amazon 五种。③ 点破：D 错——注册必须选择一种登录方式，并非什么都不要。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §1.1 注册方式。","s":"源#1"},{"id":"feat-2","d":2,"t":"single","q":"每个新用户注册 Amazon Quick 后，自动获得多长的 Plus 免费试用？","o":[{"l":"A","t":"7 天"},{"l":"B","t":"14 天"},{"l":"C","t":"30 天"},{"l":"D","t":"90 天"}],"a":["C"],"e":"① 答案：C，30 天，试用期内可完整体验 Desktop 所有功能。② 名词：Plus=Quick 个人付费计划档位，Desktop 客户端功能包含在内。③ 点破：7/14/90 天均为常见试用时长的数值变形，原厂口径是 30 天。④ 溯源：quickstart §1.2 账号计划。","s":"源#2"},{"id":"feat-3","d":2,"t":"single","q":"情境：同事的 30 天 Plus 试用结束，他决定先不付费。以下关于他账号状态的说法，正确的是？","o":[{"l":"A","t":"Desktop 客户端功能不可用，但仍可继续使用网页版"},{"l":"B","t":"Desktop 与网页版同时停用"},{"l":"C","t":"Desktop 保留全部功能但变为只读"},{"l":"D","t":"可申请延长试用 30 天"}],"a":["A"],"e":"① 答案：A。② 名词：Free 计划=试用结束后的降级档，本身不包含 Desktop。③ 点破：B 错——Free 仍可用网页版；C 错——Free 不含 Desktop，无只读一说；D 错——无延期试用机制。④ 溯源：quickstart FAQ「试用结束后不付费会怎样」。","s":"源#3"},{"id":"feat-4","d":2,"t":"single","q":"以下哪台电脑【无法】安装 Amazon Quick Desktop？","o":[{"l":"A","t":"MacBook Pro (M3 芯片)"},{"l":"B","t":"MacBook Air (M2 芯片)"},{"l":"C","t":"Mac mini (M4 芯片)"},{"l":"D","t":"2019 款 Intel 处理器 MacBook Pro"}],"a":["D"],"e":"① 答案：D——Desktop 仅支持 Apple Silicon（M1/M2/M3/M4），不支持 Intel Mac；系统要求 macOS 13 (Ventura) 及以上。② 点破：A/B/C 均为 Apple Silicon 机型，满足要求。③ 溯源：quickstart FAQ「支持哪些 Mac 机型」。","s":"源#3"},{"id":"feat-5","d":2,"t":"single","q":"在 Quick Desktop 中通过 MCP Server 扩展连接更多工具，正确的入口路径是？","o":[{"l":"A","t":"Settings → Customization → Browser"},{"l":"B","t":"Settings → Capabilities → Connections → Advanced Integrations →「+ Add MCP / Skill」"},{"l":"C","t":"Settings → My Context → Memory"},{"l":"D","t":"顶部栏 Agents 图标 → 创建新任务"}],"a":["B"],"e":"① 答案：B。② 名词：MCP=Model Context Protocol（模型上下文协议），用于扩展连接第三方工具与服务。③ 点破：A 是浏览器自动化设置路径；C 是记忆管理入口；D 是定时任务入口——均为同产品内真实存在的其他路径（主体错置干扰）。④ 溯源：quickstart §3.2.1。","s":"源#4"},{"id":"feat-6","d":2,"t":"single","q":"情境：你希望 Quick 代你打开公司内部系统页面查数据，且不想每次重新登录。应如何设置浏览器自动化？","o":[{"l":"A","t":"让 Quick 每次重新输入账号密码"},{"l":"B","t":"在 Settings → Customization → Browser 选择「Use my Chrome」，用你的 Chrome Profile 保留登录状态"},{"l":"C","t":"先断开所有连接器再操作"},{"l":"D","t":"Quick 无法访问需要登录的网页"}],"a":["B"],"e":"① 答案：B。② 名词：Chrome Profile=浏览器用户配置文件，包含登录态（Cookies）。③ 点破：A 违背「保留登录态」的产品设计；C 无关；D 错——官方示例场景就是代查内部系统并截图。④ 溯源：quickstart §4.6 浏览器自动化。","s":"源#5"},{"id":"feat-7","d":2,"t":"single","q":"使用 Quick Desktop 的定时任务（Scheduled Agents）时，必须满足什么前提？","o":[{"l":"A","t":"Desktop 应用保持运行状态"},{"l":"B","t":"Chrome 浏览器保持打开"},{"l":"C","t":"连接外接显示器"},{"l":"D","t":"每次到点手动点击触发"}],"a":["A"],"e":"① 答案：A——原厂注意事项明确「定时任务需要 Desktop 应用保持运行状态」。② 名词：Scheduled Agents=按计划在后台自动执行任务的代理。③ 点破：B 是小红书实验里浏览器自动化的前提，不是定时任务的（主体错置）；C/D 无依据。④ 溯源：quickstart §4.4。","s":"源#6"},{"id":"feat-8","d":2,"t":"multiple","q":"以下哪些工具属于 Quick Desktop【原生支持】直接连接（无需通过 MCP 扩展）？（多选）","o":[{"l":"A","t":"Slack"},{"l":"B","t":"Microsoft Teams"},{"l":"C","t":"Salesforce"},{"l":"D","t":"飞书"}],"a":["A","B","C"],"e":"① 答案：A/B/C。② 原生支持 50+ 集成：Microsoft Outlook、Gmail、Google Calendar、Slack、Microsoft Teams、Salesforce、本地文件等。③ 点破：D 错——Quick 原生没有飞书集成，需通过 MCP 接入（零代码或自建远程 MCP 两条路径）。④ 溯源：quickstart FAQ「能连接哪些工具」+ 《Amazon Quick 伙伴学习材料汇总》内材料 §一。","s":"源#7"},{"id":"feat-9","d":2,"t":"single","q":"关于数据隐私，以下说法符合 Quick 官方口径的是？","o":[{"l":"A","t":"Free 计划的数据会被用于模型训练，付费计划不会"},{"l":"B","t":"无论 Free 还是付费计划，AWS 都不会用你的数据训练模型"},{"l":"C","t":"默认会用于训练，需手动关闭"},{"l":"D","t":"仅对话内容用于训练，文件不会"}],"a":["B"],"e":"① 答案：B。② 官方安全文档原文：Your data is never used for AI model training（你的数据绝不会被用于 AI 模型训练）。③ 点破：A/C/D 均为「分档/默认开关」式变形，官方口径是无差别不训练。④ 溯源：quickstart FAQ「AWS 会用我的数据训练 AI 模型吗」+ 《Amazon Quick 伙伴学习材料汇总》内材料 原文。","s":"源#8"},{"id":"feat-10","d":2,"t":"multiple","q":"Quick 的「写入操作」需要用户明确批准后才会执行（Human-in-the-Loop）。以下哪些属于这类操作？（多选）","o":[{"l":"A","t":"发送邮件"},{"l":"B","t":"更新 CRM 记录"},{"l":"C","t":"发送消息"},{"l":"D","t":"搜索本地文件"}],"a":["A","B","C"],"e":"① 答案：A/B/C。② 名词：Human-in-the-Loop=人在回路，代理执行写入动作前须获得人的明确批准。③ 点破：D 错——读取/搜索类操作不属于写入，无需批准。④ 溯源：quickstart FAQ「发邮件/发消息等操作需要我确认吗」。","s":"源#3"},{"id":"feat-11","d":2,"t":"single","q":"情境：客户 IT 要求「既能拦截对话中的敏感内容，又能拦截敏感文件外发」。按原厂能力地图，应怎么回答？","o":[{"l":"A","t":"只配 Guardrails 即可两者都管"},{"l":"B","t":"Guardrails 管对话、DLP 管文件，两者互补需分别启用"},{"l":"C","t":"只配 DLP 即可两者都管"},{"l":"D","t":"Quick 目前不支持任何内容拦截"}],"a":["B"],"e":"① 答案：B。② 名词：Guardrails=对话护栏（按管理员规则拦截对话内容）；DLP=Data Loss Prevention 数据防泄漏（现支持对接 Microsoft Purview）。③ 点破：A/C 混淆了二者分工；D 错——Guardrails 已可用，DLP 在能力地图标注「规划中（拟以文档交付）」，需如实说明状态。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §三 治理与安全。","s":"源#9"},{"id":"feat-12","d":2,"t":"single","q":"企业管控的 Custom permissions（按角色裁剪功能入口）采用什么默认策略？","o":[{"l":"A","t":"新账号默认全部放开"},{"l":"B","t":"新账号默认拒绝，未授权功能一律不开"},{"l":"C","t":"新账号默认只读"},{"l":"D","t":"由员工自行选择开启"}],"a":["B"],"e":"① 答案：B。② 名词：Custom permissions 可按角色裁剪功能入口（如可建 dashboard 但不可导出）。③ 点破：A/C/D 均与「默认拒绝（default deny）」口径相反。④ 溯源：capability-map §二 权限与用量管控。","s":"源#10"},{"id":"feat-13","d":2,"t":"single","q":"情境：客户说「我们要把 Quick 界面完全换成自己品牌，员工不能看到任何 AWS 痕迹」。按原厂口径应如何回应？","o":[{"l":"A","t":"品牌定制即完全白牌，可直接满足"},{"l":"B","t":"支持品牌定制（logo+配色），但属共同品牌而非完全白牌，完全白牌需走 OEM 商务"},{"l":"C","t":"Quick 不支持任何品牌定制"},{"l":"D","t":"品牌定制是规划中功能，暂不可用"}],"a":["B"],"e":"① 答案：B。② 名词：Brand customization=管理员统一上传 logo、配置色板，全组织员工看到公司自己的品牌门户。③ 点破：A 错——官方注明「共同品牌非白牌」；C 错；D 错——该功能已可用（官方演示视频 20260907_BRAND），规划中的是 Agent/Email customization。④ 溯源：capability-map §五。","s":"源#11"},{"id":"feat-14","d":2,"t":"multiple","q":"原厂博客指出，为 Quick 自建远程 MCP 服务（生产环境）需要重点解决哪三大挑战？（多选）","o":[{"l":"A","t":"工具越多上下文越膨胀"},{"l":"B","t":"多步编排的准确性"},{"l":"C","t":"Token 安全"},{"l":"D","t":"客户端界面汉化"}],"a":["A","B","C"],"e":"① 答案：A/B/C。② 名词：上下文膨胀=MCP 工具定义占用 context 窗口；编排准确性=多步调用的参数/顺序/前置约束；Token 安全=第三方授权凭证的签发与存储。③ 点破：D 与 MCP 服务端设计无关（凑数项）。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §一路径 B「关键难点」。","s":"源#12"},{"id":"feat-15","d":2,"t":"single","q":"情境：自建飞书 MCP 服务时要接入 200+ 工具。原厂博客为什么【不】把它们全部注册给 AI？","o":[{"l":"A","t":"会被 API 限流"},{"l":"B","t":"每个工具定义占用数百 token，全注册带来数万 token 固定开销且降低调用准确率"},{"l":"C","t":"官方不允许超过 50 个工具"},{"l":"D","t":"会导致客户端安装包变大"}],"a":["B"],"e":"① 答案：B。② 原厂解法：只注册 32 个（28 个 Tier1 高频工具 + 4 个 Meta Tool），其余 200+ 通过 lark_discover 按需发现、lark_invoke 统一调用（约 15% 直注册、85% 按需加载）。③ 点破：A/C/D 均为无依据的机制虚构。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §四 Meta Tool、§五 分层注册。","s":"源#13"},{"id":"scen-1","d":3,"t":"single","q":"原厂文章《Amazon Quick 让我重新理解办公》认为 Quick 与多数 AI 工具的核心差别是什么？","o":[{"l":"A","t":"底层模型更强，回答更准确"},{"l":"B","t":"不只解决「个体完成产出」，还接住产出之后同步、进流程、被复用的衔接环节"},{"l":"C","t":"文档生成速度更快"},{"l":"D","t":"免费额度更大"}],"a":["B"],"e":"① 答案：B。② 核心论点：多数 AI 工具解决「写得更快」，Quick 把数据、群聊、知识和 workflow 串成完整交付链路，提升「从开始到落地」的整体效率。③ 点破：A/C 恰是原文批判的「单点提效」视角；D 无依据。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §二。","s":"源#14"},{"id":"scen-2","d":3,"t":"single","q":"Amazon Quick 里预置了多少个专家助理（角色化助理）？","o":[{"l":"A","t":"5 个"},{"l":"B","t":"10 个"},{"l":"C","t":"15 个"},{"l":"D","t":"50 个"}],"a":["C"],"e":"① 答案：C，15 个。② 名词：角色化助理=预置角色（如「内容策略师」），选择接近任务的角色即可直接开工，无需先写长提示词。③ 点破：50 是「50+ 原生集成」的数字（概念替换干扰）；5/10 为数值变形。④ 溯源：scenario-playbook §二 角色化助理。","s":"源#15"},{"id":"scen-3","d":3,"t":"single","q":"情境：你每周一都要做周会数据汇报——先导数、再分析、再整理成汇报内容，流程固定且重复。最适合用 Quick 的哪个能力把它固定下来？","o":[{"l":"A","t":"Deep Research"},{"l":"B","t":"Flow（工作流）"},{"l":"C","t":"知识图谱"},{"l":"D","t":"浏览器自动化"}],"a":["B"],"e":"① 答案：B。② 名词：Flow 的价值=把高频、重复、规则相对明确的工作固定下来，下次不用从零开始；原文将 Google Analytics 配成连接器后用自然语言自动生成工作流。③ 点破：A 适合复杂问题的研究判断；C 用于实体关系与历史知识复用；D 用于操作网页——均非固定流程场景。④ 溯源：scenario-playbook §二 Workflow。","s":"源#16"},{"id":"scen-4","d":3,"t":"single","q":"情境：团队积累了大量竞品调研报告，新方案立项时希望「历史资料参与当前决策」。按原文做法应该怎么做？","o":[{"l":"A","t":"把文件统一打印归档备查"},{"l":"B","t":"按需圈定知识范围（如把团队文件夹设为 Agent 可访问），让资料可被搜索、调用、对比和复用"},{"l":"C","t":"每次立项重新做一轮调研"},{"l":"D","t":"导出 Excel 手工汇总对比"}],"a":["B"],"e":"① 答案：B。② 名词：知识复用=圈定知识范围后，历史资料可参与搜索与归纳；配合知识图谱还能串起资料、会议、人员、项目之间的关系。③ 点破：A/D 仍是「存起来」而非「用起来」；C 违背复用初衷。④ 溯源：scenario-playbook §二 知识复用。","s":"源#17"},{"id":"scen-6","d":3,"t":"multiple","q":"Quick 文档与可视化创作当前支持哪些输出类型？（多选）","o":[{"l":"A","t":"Word 文档（.docx）"},{"l":"B","t":"Excel 表格（.xlsx）"},{"l":"C","t":"PowerPoint 演示文稿（.pptx）"},{"l":"D","t":"视频文件（.mp4）"}],"a":["A","B","C"],"e":"① 答案：A/B/C，另有 PDF（.pdf）与 Business visual（.png），共五种。② 这些是可编辑的原生文件：Excel 保留工作公式与条件格式，PPT 保留版式母版与布局。③ 点破：D 不在支持列表——属格式类杜撰干扰。④ 溯源：scenario-playbook §三 Multiple output types 表。","s":"源#18"},{"id":"scen-7","d":3,"t":"single","q":"情境：客户问「生成的 PPT 能不能长得跟我们公司现有模板一样？」正确答复是？","o":[{"l":"A","t":"不支持，只能用内置主题"},{"l":"B","t":"可以——上传现有品牌 .pptx 作模板，Quick 分析版式、字体、品牌色与结构后克隆生成"},{"l":"C","t":"需购买 OEM 授权才可以"},{"l":"D","t":"仅 PDF 支持套用模板"}],"a":["B"],"e":"① 答案：B。② 名词：PowerPoint template cloning——上传品牌 .pptx，生成时克隆最匹配的版式，保留背景、装饰元素、logo 与视觉识别。③ 点破：A 与事实相反；C 混淆了「品牌定制/白牌走 OEM」的概念；D 错——Excel 模板克隆同样支持。④ 溯源：scenario-playbook §三 Template cloning。","s":"源#19"},{"id":"scen-8","d":3,"t":"multiple","q":"Quick 文档生成后支持哪两种编辑方式？（多选）","o":[{"l":"A","t":"会话式编辑（Chat-based editing）——适合文档级的大范围修改"},{"l":"B","t":"行内批注（Inline commenting）——高亮段落评论后仅重生成该段"},{"l":"C","t":"只能导出后用第三方软件修改"},{"l":"D","t":"每次修改都必须重新生成整份文档"}],"a":["A","B"],"e":"① 答案：A/B。② 推荐用法：先会话式编辑确定结构/语气/布局，再用行内批注精修局部——「Start broad, get specific」。③ 点破：C/D 与原文编辑机制相反——修改只重生成需要变化的部分，其余不动。④ 溯源：scenario-playbook §三 Two ways to edit。","s":"源#20"},{"id":"scen-9","d":3,"t":"single","q":"情境：客户财务总监质疑「AI 生成的报表数据是不是编的」。按原厂口径应如何回应？","o":[{"l":"A","t":"承认存在编造风险，建议人工复核全部数字"},{"l":"B","t":"源数据可直接上传（CSV/Excel/JSON）或来自已连接数据源（QuickSight/Redshift/RDS），Quick 按给定数据生成、不编造数据点"},{"l":"C","t":"建议不要用 AI 做数据类文档"},{"l":"D","t":"编造率低于 1%，可以忽略"}],"a":["B"],"e":"① 答案：B。② 名词：Data-aware generation（数据感知生成）——准确性以你提供的数据为准，机械执行交给 Quick，数字含义的判断留给人。③ 点破：A 把风险说成必然；C/D 均为无依据口径。④ 溯源：scenario-playbook §三 Data-aware generation。","s":"源#21"},{"id":"scen-10","d":3,"t":"single","q":"AWS 财务团队案例中，每周业务复盘（Weekly Business Review）的准备时间从约多少缩短到约多少？","o":[{"l":"A","t":"8 小时 → 1 小时"},{"l":"B","t":"6 小时 → 约 10 分钟"},{"l":"C","t":"3 小时 → 30 分钟"},{"l":"D","t":"数周 → 1 天"}],"a":["B"],"e":"① 答案：B。② 该团队用区域专属 Chat Agent + Flows 每周一自动运行，洞察在工作日开始前就绪；单客户深度分析同样从 6 小时降到约 10 分钟。③ 点破：其余选项为时间数值变形。④ 溯源：scenario-playbook §四 Use case 2 与 The pattern 对照表。","s":"源#22"},{"id":"scen-11","d":3,"t":"single","q":"情境：客户 FP&A 团队想「每周一早上自动产出收入表现分析，上班前就绪」。参考 AWS 财务团队的做法，应配置什么？","o":[{"l":"A","t":"让分析师每周一手动导出数据后发到群里"},{"l":"B","t":"按区域/业务定制 Chat Agent，并用 Flow 按固定节奏自动运行"},{"l":"C","t":"只建一个 Dashboard 等人随时来看"},{"l":"D","t":"每周外包给咨询公司出报告"}],"a":["B"],"e":"① 答案：B。② AWS Finance 的做法：区域专属 chat agents 连接企业数据源，Flows 自动按周一节奏运行，并准备可供领导层使用的 talk tracks。③ 点破：A/C/D 都没有解决「数据汇总占满周一上午」的瓶颈。④ 溯源：scenario-playbook §四。","s":"源#23"},{"id":"scen-12","d":3,"t":"multiple","q":"HR Workshop 模块 00（候选人分析助手）主要用到了哪些 Quick 能力？（多选）","o":[{"l":"A","t":"Spaces"},{"l":"B","t":"Chat Agent"},{"l":"C","t":"Flows"},{"l":"D","t":"Apps"}],"a":["A","B"],"e":"① 答案：A/B——先建「简历」与「岗位 JD」两个 Space，再创建「HR 面试助手」Chat Agent 并把两个 Space 设为知识源。② 模块 01 用 Spaces+Flows，模块 03 用 Spaces+Apps，模块 04 用 Deep Research。③ 点破：C/D 是其他模块使用的能力（主体错置）。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §二 模块总览。","s":"源#24"},{"id":"scen-13","d":3,"t":"single","q":"情境：HR 想让「新收到的简历自动进入统一人才库，并刷新分析面板」。参考 HR Workshop 模块 02 的工程做法，应采用什么组合？","o":[{"l":"A","t":"每周人工整理 Excel 汇总表"},{"l":"B","t":"简历入库 Skill 扫描 PDF/DOCX/MD 提取字段生成 talent_pool.csv，配合 Dataset 与 Dashboard；新增简历后重跑 Skill、替换 Dataset 文件即可刷新"},{"l":"C","t":"把简历全部打印后手工录入系统"},{"l":"D","t":"让 Chat Agent 在对话里逐份口头总结"}],"a":["B"],"e":"① 答案：B。② 名词：resume-intake-pipeline Skill 支持增量处理和定时运行，结构化字段含姓名/学历/工作年限/技能/期望城市等。③ 点破：A/C/D 均为手工路径，无增量与自动化。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 模块 02 核心流程。","s":"源#25"},{"id":"scen-14","d":3,"t":"multiple","q":"以下哪些属于 HR Workshop 的官方注意事项？（多选）","o":[{"l":"A","t":"JD 与简历应放入不同 Space，避免工作流检索到错误的数据源"},{"l":"B","t":"模块 02 首次运行时不要上传「补充简历」，这样才能体验增量入库和 Dashboard 刷新"},{"l":"C","t":"所有材料放进同一个 Space 最便于检索"},{"l":"D","t":"AI 输出可以替代必要的人工审核与面试评估"}],"a":["A","B"],"e":"① 答案：A/B。② 模块 03 还有「创建 App 时必须上传 《Amazon Quick 伙伴学习材料汇总》内材料」；Deep Research 需确认研究计划批准后才执行。③ 点破：C 与注意事项相反；D 错——原文明确 AI 输出用于辅助判断，不应替代人工审核与合规检查。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 常见注意事项。","s":"源#26"},{"id":"scen-15","d":3,"t":"single","q":"情境：HR 按模块 03 生成人才成长可视化 App。原厂为什么要求上传 《Amazon Quick 伙伴学习材料汇总》内材料 再建站？","o":[{"l":"A","t":"它规定了图表依赖（Highcharts）、图表错误隔离、UTF-8 BOM 解析、空数据保护等要求，用于减少应用白屏和局部图表崩溃"},{"l":"B","t":"它是公司品牌规范文件"},{"l":"C","t":"它是计费授权文件"},{"l":"D","t":"只是示例文件，可以不上传"}],"a":["A"],"e":"① 答案：A。② 名词：《Amazon Quick 伙伴学习材料汇总》内材料 是 App 建站技术规范，规定全局背景与图表工程要求。③ 点破：B/C 无依据；D 错——官方注意事项明确「创建 App 时必须上传 《Amazon Quick 伙伴学习材料汇总》内材料」。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 模块 03。","s":"源#27"},{"id":"scen-16","d":3,"t":"single","q":"情境：小红书自动化实验中，让 Quick 抓取小红书数据靠的是什么机制？","o":[{"l":"A","t":"小红书官方数据 API"},{"l":"B","t":"浏览器自动化——用你自己的 Chrome 与登录态操作页面，与手动浏览一致"},{"l":"C","t":"MCP Server 协议"},{"l":"D","t":"Deep Research 联网检索"}],"a":["B"],"e":"① 答案：B。② 实验前提：开启浏览器自动化并连接 Chrome；小红书不登录无法搜索，Quick 用你的登录态操作、与手动浏览一致、不触发风控。③ 点破：A 不存在——正因为没有 API 才用浏览器；C/D 不是该场景的机制。④ 溯源：scenario-playbook §五 步骤 1.1 + 手册第 3 页。","s":"源#28"},{"id":"scen-17","d":3,"t":"multiple","q":"小红书「一人内容团队」实验把自动化跑通，靠的「三件套」是？（多选）","o":[{"l":"A","t":"浏览器自动化（抓选题/拆爆款）"},{"l":"B","t":"Skill 封装（一次封装、一句话重复调用）"},{"l":"C","t":"定时任务与排期提醒（发布提醒、周复盘）"},{"l":"D","t":"每天人工爬楼找选题"}],"a":["A","B","C"],"e":"① 答案：A/B/C。② 实验七步：热点选题→拆爆款结构→批量生成文案→封面生成器→排期提醒→打包 Skill→周复盘自动化。③ 点破：D 恰是实验要消除的人工动作。④ 溯源：scenario-playbook §五。","s":"源#29"},{"id":"scen-18","d":3,"t":"multiple","q":"AWS 官方案例集（Amazon 内部团队）中出现过哪些量化效果？（多选）","o":[{"l":"A","t":"邮件营销管理器使 AMS 回复率提升 3 倍"},{"l":"B","t":"客户经理每周节省 30–45 分钟（格式自动更新案例）"},{"l":"C","t":"Security Services 定制 Chat Agent 每月恢复 80–88 小时"},{"l":"D","t":"案例集承诺客户销售额平均提升 50%"}],"a":["A","B","C"],"e":"① 答案：A/B/C。② 案例集共 8 个主题 32 个案例，均按「痛点→做法→效果」三段式呈现。③ 点破：D 属杜撰——案例集无此口径；且对外引用必须标注「来源：AWS 官方 Quick 案例材料」，案例主体是 Amazon 内部团队而非我方交付实绩。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 一/三/五节。","s":"源#30"},{"id":"dep-1","d":1,"t":"single","q":"Quick Web 与 Quick Desktop 的 SSO 认证协议分别是什么？","o":[{"l":"A","t":"两者都用 SAML"},{"l":"B","t":"两者都用 OIDC"},{"l":"C","t":"Web 走 SAML（经 IAM Identity Center 或 IAM STS Federation），Desktop 走 OIDC（Authorization Code + PKCE）"},{"l":"D","t":"Web 用 LDAP，Desktop 用 SAML"}],"a":["C"],"e":"① 答案：C。② 名词：SAML=基于断言的企业认证协议；OIDC=OpenID Connect，授权码+PKCE 流程。③ 点破：A/B 忽略了两端协议差异；D 无此组合。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §1.1 + 《Amazon Quick 伙伴学习材料汇总》内材料 Step 0。","s":"源#31"},{"id":"dep-2","d":1,"t":"single","q":"Quick 判定「Web 登录的用户」和「Desktop 登录的用户」是同一个人的依据是？","o":[{"l":"A","t":"用户名相同"},{"l":"B","t":"id_token 中的 email claim——IdP、IAM Identity Center、Quick 三处邮箱必须完全一致（含大小写）"},{"l":"C","t":"同一 IP 地址登录"},{"l":"D","t":"同一设备指纹"}],"a":["B"],"e":"① 答案：B。② 名词：email 是双方身份集成的锚点；id_token=OIDC 签发的身份令牌。③ 点破：A 不充分（需 email 完全一致）；C/D 均无依据。④ 溯源：identity-sso §1.2 + 注意事项「用户匹配机制」。","s":"源#32"},{"id":"dep-3","d":1,"t":"multiple","q":"Quick Web 支持的三种认证方式是？（多选）","o":[{"l":"A","t":"IAM Identity Center（桥接，缺省推荐）"},{"l":"B","t":"IAM Federation（直连，供既有 QuickSight 账户参考）"},{"l":"C","t":"AWS Managed AD（变通，适合 AD 重度用户）"},{"l":"D","t":"LDAP 直连"}],"a":["A","B","C"],"e":"① 答案：A/B/C。② 决策路径：新订阅无特殊原因原则上推荐方式一；已用 QuickSight 且在受支持区域考虑继承现有认证方式；云上已部署 AWS Managed AD 可考虑方式三。③ 点破：D 不在官方三方式列表。④ 溯源：identity-sso §2/§3。","s":"源#33"},{"id":"dep-4","d":1,"t":"single","q":"情境：客户 IT 说「认证方式先随便选一个，以后在控制台改就行」。正确的提醒是？","o":[{"l":"A","t":"没问题，随时可以改"},{"l":"B","t":"Authentication Method 一旦选定不可更改，开通前必须谨慎评估"},{"l":"C","t":"付费升级后即可更改"},{"l":"D","t":"每年可以更改一次"}],"a":["B"],"e":"① 答案：B。② 原厂多处强调：认证方式选定后不可更改（permanent），启用前须调研确认最佳方案。③ 点破：A/C/D 均与该硬限制相悖。④ 溯源：identity-sso 注意事项 + enterprise-handbook Step 0 注意事项。","s":"源#34"},{"id":"dep-5","d":1,"t":"multiple","q":"Quick Desktop 对 IdP 的 OIDC 硬性要求包括哪些？（多选）","o":[{"l":"A","t":"Public Client（不使用 client_secret）+ PKCE(S256)"},{"l":"B","t":"offline_access（签发 Refresh Token 维持长期会话）"},{"l":"C","t":"标准 OIDC 端点（Discovery/Authorization/Token/JWKS）与 email claim"},{"l":"D","t":"IdP 必须部署在 AWS 中国区"}],"a":["A","B","C"],"e":"① 答案：A/B/C。② 若 IdP 无法满足，可部署 Keycloak 作桥接 IdP。③ 点破：D 无此要求——Quick 服务部署在亚马逊云科技国际区域，但 IdP 可在企业本地环境。④ 溯源：identity-sso §1.1 硬性要求清单。","s":"源#35"},{"id":"dep-6","d":1,"t":"single","q":"情境：某集团用芯盾 CAS 作 IdP，不支持 OIDC Public Client + PKCE，Desktop 认证返回 401。按原厂踩坑案例的最终解法是？","o":[{"l":"A","t":"放弃 Desktop，只用网页版"},{"l":"B","t":"部署 Keycloak 作为中间层桥接（把现有 IdP 作为 Keycloak 的身份认证 Provider）"},{"l":"C","t":"把 Desktop 降级到旧版本"},{"l":"D","t":"修改 Quick 服务端配置放宽协议要求"}],"a":["B"],"e":"① 答案：B。② 案例 1（2 万+ 员工集团）：换 MaxKey 同样不支持，最终部署 Keycloak 解决。③ 点破：A 是回避问题；C 无此版本机制；D 客户端协议要求不可改。④ 溯源：enterprise-handbook Step 4 案例 1 + identity-sso §1.1。","s":"源#36"},{"id":"dep-7","d":1,"t":"single","q":"IAM Identity Center 不直接提供 OIDC。原厂「IDC 用户直登 Desktop」方案的桥接思路是？","o":[{"l":"A","t":"把 IAM Identity Center 配置为 Amazon Cognito 的外部 SAML Provider"},{"l":"B","t":"把 Cognito 配置为 IDC 的外部 Provider"},{"l":"C","t":"在 Desktop 内置一个 OIDC 服务器"},{"l":"D","t":"要求客户改用 Okta"}],"a":["A"],"e":"① 答案：A。② 效果：一次 IDC 登录两端通用；用户首次登录时 Cognito 自动创建用户（JIT Provisioning），无需 SCIM 同步。③ 点破：B 方向反了；C/D 无依据。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 文档目的与工作原理。","s":"源#37"},{"id":"dep-8","d":1,"t":"single","q":"Cognito 桥接方案中为什么需要 API Gateway + Lambda 代理层？","o":[{"l":"A","t":"为了界面汉化"},{"l":"B","t":"Cognito 不支持 Quick Desktop 请求中的 offline_access 参数，代理层在转发前剥离该参数，对客户端完全无感"},{"l":"C","t":"为了计费统计"},{"l":"D","t":"为了加速网络访问"}],"a":["B"],"e":"① 答案：B。② Cognito 不识别 offline_access 会报错；剥离后 Refresh Token 续期机制照常工作。③ 点破：A/C/D 均无依据。④ 溯源：iam-idc 方案前提条件 + 方案总结「透明代理层」。","s":"源#38"},{"id":"dep-9","d":1,"t":"single","q":"情境：一位员工已加入 Quick 用户组并激活（成为活跃用户），随后被移出组。关于计费，正确的是？","o":[{"l":"A","t":"立即停止计费"},{"l":"B","t":"移出组后置为非活跃用户，本月费用继续收取，次月第一天自动移除"},{"l":"C","t":"永久保留计费"},{"l":"D","t":"需要管理员手动删除后才停止计费"}],"a":["B"],"e":"① 答案：B。② 机制：活跃用户订阅类型=所在组（可多组）对应的最大权限订阅；首次激活后即使连续数月不登录仍计费。③ 点破：A/C 与官方口径相反；D 无需手动操作。④ 溯源：iam-idc「Quick 的订阅费用」。","s":"源#39"},{"id":"dep-10","d":1,"t":"single","q":"情境：客户通过 IAM Federation 直连，误将部分用户升为 ADMIN_PRO，想降回 READER_PRO 省费用。按踩坑案例，正确说法是？","o":[{"l":"A","t":"控制台直接降级即可"},{"l":"B","t":"UpdateUser API 设计上不支持角色降级；只能 delete-user → register-user 重建，且该用户 Desktop 个人数据会丢失——有角色调整需求应优先选 IAM Identity Center + Group 管理"},{"l":"C","t":"降级会自动保留全部个人数据"},{"l":"D","t":"在 IdP 里改 Role 即可实现无损降级"}],"a":["B"],"e":"① 答案：B。② IAM Federation 模式没有 Group 管理机制；误升级 Pro 还可能触发账户级 $250/月基础设施费且无法通过降级取消。③ 点破：A/C/D 均与案例结论相反。④ 溯源：enterprise-handbook Step 4 案例 4 + 最佳实践第 9 条。","s":"源#40"},{"id":"dep-11","d":1,"t":"single","q":"Quick Desktop 的本地应用数据、配置与文件夹权限存储在哪个目录？","o":[{"l":"A","t":"~/.quickwork/（macOS）或 %USERPROFILE%\\.quickwork\\（Windows）"},{"l":"B","t":"~/.quickconfig/"},{"l":"C","t":"~/.aws/quick/"},{"l":"D","t":"C:\\Program Files\\Amazon Quick\\data"}],"a":["A"],"e":"① 答案：A。② 对话、记忆、知识图谱不存于该目录；安装排障时删除该目录后重装是官方建议步骤。③ 点破：其余为路径杜撰/变形。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 Data storage + quickstart FAQ「安装后打不开怎么办」。","s":"源#41"},{"id":"dep-12","d":1,"t":"single","q":"员工离职时的数据彻底清除需求，Quick 提供的官方机制是？","o":[{"l":"A","t":"无清除机制"},{"l":"B","t":"Settings → Advanced 选项卡的 Clear all data——不可逆地移除全部对话、知识图谱数据、已保存凭据与偏好设置"},{"l":"C","t":"仅管理员可在云端远程抹除"},{"l":"D","t":"删除应用即自动清除云端数据"}],"a":["B"],"e":"① 答案：B。② 该机制可作为「数据可清除」的合规佐证，但操作不可逆，执行前须明确告知。③ 点破：A 与文档相反；C/D 无依据。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 Clearing all data。","s":"源#42"},{"id":"dep-13","d":1,"t":"multiple","q":"企业部署 Quick Desktop 时，防火墙/代理需放行的域名类别包括？（多选）","o":[{"l":"A","t":"*.quicksight.aws.amazon.com（Web 控制台与资源发现）"},{"l":"B","t":"*.dp.appintegrations.*.prod.plato.ai.​aws.dev（数据面：推理/流式/搜索）"},{"l":"C","t":"*.cloudfront.net（远程配置与应用更新）"},{"l":"D","t":"*.internal-corp.local（企业内网公告系统）"}],"a":["A","B","C"],"e":"① 答案：A/B/C。② 另有 cognito-identity.*.amazonaws.com（遥测）与客户专属 IdP 域名（如 login.microsoftonline.com）。③ 点破：D 与 Quick 无关（杜撰域名）。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 Network access and required domains 表。","s":"源#43"},{"id":"dep-14","d":1,"t":"single","q":"企微远程 MCP 方案（wecom-mcp-on-agentcore）相对直接用企业微信官方 MCP URL 的关键差异是？","o":[{"l":"A","t":"工具数量更多"},{"l":"B","t":"每次调用以「发起者本人」的企微身份执行，审计可追到人、可见范围按人收敛；官方 URL 以共用机器人执行，审计追不到人"},{"l":"C","t":"完全免费"},{"l":"D","t":"不需要任何授权"}],"a":["B"],"e":"① 答案：B。② 本服务每用户独立凭证、独立 KMS 加密；读取类权限收敛由企微平台强制兜底。③ 点破：A 无比较口径；C/D 无依据（该方案为第三方开源项目，对客户承诺前须先真实环境验证）。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §一/§二对比表。","s":"源#44"},{"id":"dep-15","d":1,"t":"multiple","q":"按原厂 IdP 满足度实测表，以下哪些 IdP 满足 Quick Desktop 的全部 OIDC 硬性要求？（多选）","o":[{"l":"A","t":"Okta"},{"l":"B","t":"Microsoft Entra ID"},{"l":"C","t":"Keycloak"},{"l":"D","t":"飞书（原生平台）"}],"a":["A","B","C"],"e":"① 答案：A/B/C——实测五项（Public Client/PKCE/offline_access/OIDC Discovery/email claim）全满足；另有 PingIdentity、钉钉 IDaaS、派拉、Casdoor 等（Casdoor 实测 Token 格式不兼容不可用）。② 飞书原生平台五项全不满足，需 Keycloak 作桥接 IdP。③ 点破：D 恰是不满足的典型。④ 溯源：identity-sso §1.1 IdP 满足程度统计表。","s":"源#45"},{"id":"dlv-1","d":4,"t":"single","q":"情境：交付工程师第一次做企业版落地。关于 Web 与 Desktop 的配置顺序，原厂最佳实践是？","o":[{"l":"A","t":"先配 Desktop 再配 Web"},{"l":"B","t":"先配置 Quick Web SSO 并确认成功登录，再配置 Desktop SSO"},{"l":"C","t":"两端同时配置"},{"l":"D","t":"只配 Web，不需要配 Desktop"}],"a":["B"],"e":"① 答案：B。② 原厂注明：先配 Web SSO、确认成功登录后再配 Desktop，可确保配置过程流畅。③ 点破：A/C 与最佳实践相反；D 忽略了 Desktop 认证依赖 Web 侧配置（Desktop Extension 存放在 Quick 账户里）。④ 溯源：enterprise-handbook Step 0 注意事项 + identity-sso §1.1。","s":"源#46"},{"id":"dlv-2","d":4,"t":"single","q":"交付现场快速验证企业网络到 Quick 的连通性，原厂建议的方法是？","o":[{"l":"A","t":"ping aws.amazon.com"},{"l":"B","t":"用浏览器访问 https://us-east-1.quicksight.aws.amazon.com/，能打开页面即说明网络可达"},{"l":"C","t":"发一封邮件测试连通性"},{"l":"D","t":"对所有 AWS 域名逐一运行 tracert"}],"a":["B"],"e":"① 答案：B。② 若超时或被拦截，请联系网络管理员按域名清单加入白名单；另须避免手机热点等 IP 频繁变化的不稳定网络。③ 点破：A/C/D 验证不到 Quick 实际依赖的域名面。④ 溯源：enterprise-handbook Step 0 网络连通性。","s":"源#47"},{"id":"dlv-3","d":4,"t":"single","q":"情境：某医药企业 Desktop 连接 Outlook/Teams 报错。按踩坑案例，根因与解法是？","o":[{"l":"A","t":"网络白名单缺失——补齐 *.cloudfront.net 即可"},{"l":"B","t":"O365 集成需 M365 Global Admin 完成 Admin Consent——由 Global Admin 勾选「Consent on behalf of organization」即可解决"},{"l":"C","t":"Desktop 版本过旧——重装即可"},{"l":"D","t":"需要切换为免费计划再集成"}],"a":["B"],"e":"① 答案：B。② 案例 2：O365 集成必须由全局管理员代表组织授权（Admin Consent）。③ 点破：A 是网络类问题的维度（另一案例）；C/D 无依据。④ 溯源：enterprise-handbook Step 4 案例 2。","s":"源#48"},{"id":"dlv-4","d":4,"t":"multiple","q":"关于 Quick 常见运维现象，以下说法正确的有？（多选）","o":[{"l":"A","t":"Agent Hours 配额耗尽后功能暂停，约 3 小时自动恢复（周期重置），或升级套餐"},{"l":"B","t":"登录超 18 小时自动登出是正常的 Session 过期机制"},{"l":"C","t":"切换网络后自动退出说明账号被封禁"},{"l":"D","t":"Windows 下 Remote MCP 频繁 crash 是已知 bug，可临时用 Web 版替代"}],"a":["A","B","D"],"e":"① 答案：A/B/D。② 切换网络后自动退出的根因是 IP 变化触发 token 失效，重新登录并确保网络白名单正确即可。③ 点破：C 把 token 机制误判为封禁。④ 溯源：enterprise-handbook Step 3 常见运维问题。","s":"源#49"},{"id":"dlv-5","d":4,"t":"multiple","q":"关于用户日志管理两方案（CloudWatch vs 直投 S3），正确的有？（多选）","o":[{"l":"A","t":"团队较小（50 人以内）且需实时搜索、异常告警——选 CloudWatch 方案，配置简单即开即用"},{"l":"B","t":"大规模部署（100+ 人）以合规归档和事后追溯为主——直投 S3 长期存储成本更低"},{"l":"C","t":"每种日志类型可同时投递到两个目的地"},{"l":"D","t":"两者可按日志类型组合使用（如 CHAT_LOGS 投 S3、AGENT_HOURS 投 CloudWatch）"}],"a":["A","B","D"],"e":"① 答案：A/B/D。② 成本大头是 CloudWatch 日志采集费（$0.50/GB），日志量越大与 S3 方案差距越明显。③ 点破：C 错——每种日志类型只能配一个投递目的地，组合使用不会产生重复计费。④ 溯源：enterprise-handbook Step 3 方案对比与选型建议。","s":"源#50"},{"id":"dlv-6","d":4,"t":"multiple","q":"Amazon Quick 当前支持的日志类型包括？（多选）","o":[{"l":"A","t":"CHAT_LOGS（对话交互）"},{"l":"B","t":"AGENT_HOURS_LOGS（Agent/Research 工时消耗）"},{"l":"C","t":"KB_FILE_SYNC_LOGS（知识库文档同步结果）"},{"l":"D","t":"AUDIT_TRAIL_LOGS（管理员操作审计）"}],"a":["A","B","C"],"e":"① 答案：A/B/C——共 5 种，另有 FEEDBACK_LOGS 与 INDEX_USAGE_LOGS。② 每种日志类型须创建独立的 Delivery Source，但可复用同一目的地。③ 点破：D 为杜撰类型。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §3 支持的日志类型。","s":"源#51"},{"id":"dlv-7","d":4,"t":"single","q":"Agent Hours 日志的计量粒度是？","o":[{"l":"A","t":"按任务记录，一次 Deep Research 一条"},{"l":"B","t":"按计算步骤记录（每次 LLM 推理或工具调用一条），且无 conversation_id/task_id 字段、无法直接按任务聚合"},{"l":"C","t":"按天汇总一条"},{"l":"D","t":"按用户月度汇总一条"}],"a":["B"],"e":"① 答案：B。② 一次 Agent 任务会产生多条记录，每条 usage_hours 值很小（如 0.0006）；只能通过「用户+时间窗口」近似估算单次任务消耗。③ 点破：A/C/D 与官方字段口径不符。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §7b。","s":"源#52"},{"id":"dlv-8","d":4,"t":"single","q":"Chat Logs 中 latency、time_to_first_token 等性能字段为什么可能看不到？","o":[{"l":"A","t":"这些字段只在企业版记录"},{"l":"B","t":"它们默认不会加入日志订阅，需在调用 CreateDelivery API 时显式指定 recordFields 参数"},{"l":"C","t":"需要额外购买付费日志包"},{"l":"D","t":"AWS 尚未实现这些字段"}],"a":["B"],"e":"① 答案：B。② 如需延迟/首 token 等性能分析，务必在配置时加上这些 recordFields。③ 点破：A/C/D 均无依据。④ 溯源：《Amazon Quick 伙伴学习材料汇总》内材料 §7c。","s":"源#53"},{"id":"dlv-9","d":4,"t":"s :"B","t":"判断 IdP 使用 opaque token（非 JWT）与 Quick 的 token 刷新机制不兼容——切换到支持标准 JWT 的 IdP 并补全网络白名单"},{"l":"C","t":"直接重装全部客户端"},{"l":"D","t":"关闭企业防火墙"}],"a":["B"],"e":"① 答案：B。② 排查思路：复杂网络环境先用直连排除网络因素；优先选择支持标准 JWT 的 IdP。③ 点破：A 回避问题；C 治标不治本；D 不可接受。④ 溯源：enterprise-handbook Step 4 案例 3。","s":"源#58"}];

<script>

/* ================================================================
   ===================== 题库数据（构建注入 QUIZ_META + QUIZ_QUESTIONS） ================
   ================================================================ */
const QUESTIONS = QUIZ_QUESTIONS;
const META = (typeof QUIZ_META !== 'undefined' && QUIZ_META) ? QUIZ_META : {};
const EXAM = META.exam || 'QUIZ';
const LS_PREFIX = META.lsPrefix || EXAM.toLowerCase();

const GLOSSARY = META.glossary || {};

function getGlossaryForQuestion(q) {
  const texts = [q.q];
  if(q.o && Array.isArray(q.o)) q.o.forEach(o => texts.push(o.t));
  if(q.e) texts.push(q.e);
  const fullText = texts.join(' ');
  const found = [];
  const sorted = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
  for(const term of sorted) {
    if(fullText.includes(term)) found.push({term, def: GLOSSARY[term]});
  }
  return found;
}

/* ================================================================
   ===================== 术语高亮 + 弹定义 ================
   ================================================================ */
// 长词优先排序，独立 token 边界匹配，避免 EBS 误标 Amazon EBS 中的 EBS 等
function getGlossarySortedKeys() {
  return Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
}

// 判断术语在文本中是否为独立出现（前后非字母/数字）
function isIndependentToken(text, idx, term) {
  const before = text[idx-1];
  const after = text[idx + term.length];
  const isLetter = c => c && /[A-Za-z0-9]/.test(c);
  return !isLetter(before) && !isLetter(after);
}

// 将解析正文中的术语高亮为可点击 span，返回 HTML
function fmtExp(s){ let t=(s===undefined||s===null)?'':String(s); t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); t=t.replace(/\n/g,'<br>'); t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); return t; }
function highlightGlossaryTerms(text) {
  if(!text) return text;
  const sortedKeys = getGlossarySortedKeys();
  let result = '';
  let i = 0;
  while(i < text.length) {
    let matched = false;
    for(const term of sortedKeys) {
      if(!term) continue;
      const idx = text.indexOf(term, i);
      if(idx === i && isIndependentToken(text, idx, term)) {
        const def = GLOSSARY[term] || '（暂无定义）';
        const termEsc = term.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const defEsc = def.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        result += `<span class="gloss-term" onclick="showGlossTip(event,'${termEsc}','${defEsc}')">${term}</span>`;
        i += term.length;
        matched = true;
        break;
      }
    }
    if(!matched) {
      // 中文等宽字符直接输出，保持原文本
      result += text[i];
      i++;
    }
  }
  return result;
}

// 点击术语弹出定义浮层
function showGlossTip(e, term, def) {
  e.stopPropagation();
  const tip = document.getElementById('glossTip');
  document.getElementById('glossTipTerm').textContent = term;
  document.getElementById('glossTipDef').textContent = def || '（暂无定义）';
  tip.style.display = 'block';
  // 定位：优先在点击位置下方，避免超出视口
  const pad = 12;
  let left = e.clientX + pad;
  let top = e.clientY + pad;
  // 先渲染再量尺寸
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if(left + tw > window.innerWidth - 8) left = e.clientX - tw - pad;
  if(top + th > window.innerHeight - 8) top = e.clientY - th - pad;
  if(left < 8) left = 8;
  if(top < 8) top = 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

function closeGlossTip() {
  document.getElementById('glossTip').style.display = 'none';
}

// 点击页面其它区域关闭浮层
document.addEventListener('click', function(e) {
  const tip = document.getElementById('glossTip');
  if(tip && tip.style.display === 'block' && !tip.contains(e.target)) {
    closeGlossTip();
  }
});

// 按 Esc 关闭浮层
document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') closeGlossTip();
});

/* ================================================================
   ===================== localStorage 操作 =========================
   ================================================================ */
const LS_ANSWERS = LS_PREFIX + '_answers';
const LS_WRONG   = LS_PREFIX + '_wrong';
const LS_PROGRESS = LS_PREFIX + '_progress';

function getAnswers() { return JSON.parse(localStorage.getItem(LS_ANSWERS)||'[]'); }
function setAnswers(a) { localStorage.setItem(LS_ANSWERS,JSON.stringify(a)); }
function getWrong() { return JSON.parse(localStorage.getItem(LS_WRONG)||'[]'); }
function setWrong(w) { localStorage.setItem(LS_WRONG,JSON.stringify(w)); }
function getProgress() { return JSON.parse(localStorage.getItem(LS_PROGRESS)||'{}'); }
function setProgress(p) { localStorage.setItem(LS_PROGRESS,JSON.stringify(p)); }

/* ----------------------------------------------------------------
   作答记录：会话态 / 累计统计态分离（修复）
   旧缺陷：模拟考核误读全局 localStorage 历史 → 进场即显示「已答对/曾答错」、
   题号导航提前染色、成绩单把练习与往场算进本次（实测正确数>题数、未答为负、
   分数超满分、正确率>100%）。
   三态口径：
     · sessionResults()       本场逐题作答（quizState.results）＝「本次」唯一真源
     · sessionScopedAnswers() 视图用作答集：考核=仅本场；练习模式=全局历史（原行为）
     · recordAnswer()         仍写全局 store → 错题集与统计口径不变
   ---------------------------------------------------------------- */
function sessionResults() {
  const r = (quizState && quizState.results) || {};
  return Object.keys(r).map(id => ({id, ua:r[id].ua, ok:r[id].ok, ts:r[id].ts}));
}
function sessionScopedAnswers() {
  return (quizState && quizState.mode === 'exam') ? sessionResults() : getAnswers();
}

function recordAnswer(qId, userAnswer, isCorrect) {
  const answers = getAnswers();
  answers.push({id:qId,ua:userAnswer,ok:isCorrect,ts:Date.now()});
  setAnswers(answers);
  const wrong = getWrong();
  const idx = wrong.findIndex(w=>w.id===qId);
  if(!isCorrect) {
    if(idx>=0) { wrong[idx].count++; wrong[idx].last=Date.now(); }
    else { wrong.push({id:qId,count:1,last:Date.now(),mastered:false}); }
  }
  setWrong(wrong);
}

function markMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=true;
  setWrong(wrong);
}
function unmarkMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=false;
  setWrong(wrong);
}
function removeWrong(qId) {
  setWrong(getWrong().filter(x=>x.id!==qId));
}

/* ================================================================
   ===================== 辅助函数 =================================
   ================================================================ */
const DOMAIN_NAMES = META.domains || {};
const DOMAIN_WEIGHTS = META.weights || {};
const DOMAIN_KEYS = Object.keys(DOMAIN_NAMES).map(Number).sort((a,b)=>a-b);
const EXAM_P = META.examParams || {};
const EXAM_COUNT = EXAM_P.count || 50;
const EXAM_MIN = EXAM_P.minutes || 60;
const EXAM_PASS = EXAM_P.pass || 700;
const TYPE_NAMES = {single:'单选题',multiple:'多选题',hot:'拖拽题'};

function getQById(id) { return QUESTIONS.find(q=>q.id===id); }
function shuffle(arr) { const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function generateShuffledOptions(questions) {
  const opts = {};
  const newAnswers = {};
  questions.forEach(q => {
    if(q.t==='single'||q.t==='multiple') {
      const shuffled = shuffle([...q.o]);
      const labels = 'ABCDEFGHIJ';
      const relabeled = shuffled.map((item, i) => ({l: labels[i], t: item.t}));
      opts[q.id] = relabeled;
      const contentToNewLabel = {};
      relabeled.forEach(item => { contentToNewLabel[item.t] = item.l; });
      newAnswers[q.id] = q.a.map(oldL => {
        const oldItem = q.o.find(o => o.l === oldL);
        return oldItem ? contentToNewLabel[oldItem.t] : oldL;
      });
    }
  });
  return { opts, newAnswers };
}

function getStats() {
  const answers = getAnswers();
  const wrong = getWrong();
  const totalCorrect = answers.filter(a=>a.ok).length;
  const totalAnswered = answers.length;
  const acc = totalAnswered ? Math.round(totalCorrect/totalAnswered*100) : 0;
  const doneIds = [...new Set(answers.map(a=>a.id))];
  const completion = Math.round(doneIds.length/QUESTIONS.length*100);
  const domainStats = {};
  for(const d of DOMAIN_KEYS) {
    const dQIds = QUESTIONS.filter(q=>q.d===d).map(q=>q.id);
    const dAnswers = answers.filter(a=>dQIds.includes(a.id));
    const dCorrect = dAnswers.filter(a=>a.ok).length;
    const dTotal = dAnswers.length;
    domainStats[d] = {
      total:dQIds.length, answered:dTotal, correct:dCorrect,
      acc: dTotal ? Math.round(dCorrect/dTotal*100) : 0
    };
  }
  const typeStats = {};
  for(const t of ['single','multiple']) {
    const tQIds = QUESTIONS.filter(q=>q.t===t).map(q=>q.id);
    const tAnswers = answers.filter(a=>tQIds.includes(a.id));
    const tCorrect = tAnswers.filter(a=>a.ok).length;
    const tTotal = tAnswers.length;
    typeStats[t] = { answered:tTotal, correct:tCorrect, acc: tTotal ? Math.round(tCorrect/tTotal*100) : 0 };
  }
  const recentWrong = wrong.filter(w=>!w.mastered).sort((a,b)=>b.last-a.last).slice(0,5);
  const recent = answers.slice(-20).reverse();
  let streak = 0;
  for(const a of recent) { if(a.ok) streak++; else break; }
  return {totalCorrect,totalAnswered,acc,completion,domainStats,typeStats,recentWrong,streak,doneIds:doneIds.length};
}

let currentPage = 'dashboard';
let quizState = null;

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el = document.getElementById('page-'+page);
  if(el) el.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  if(page==='dashboard') renderDashboard();
  else if(page==='quiz') renderQuiz();
  else if(page==='wrongbook') renderWrongBook();
  else if(page==='stats') renderStats();
  else if(page==='settings') renderSettings();
}

function renderDashboard() {
  const s = getStats();
  const el = document.getElementById('page-dashboard');
  let html = `<div class="header"><h1>${EXAM} 刷题工具</h1><button class="theme-btn" onclick="toggleTheme()">${document.getElementById('quizView').classList.contains('dark')?'☀️':'🌙'}</button></div>`;
  html += `<div class="stats-grid">
    <div class="stat-card"><div class="stat-num">${s.doneIds}/${QUESTIONS.length}</div><div class="stat-label">已做题量</div></div>
    <div class="stat-card"><div class="stat-num">${s.acc}%</div><div class="stat-label">总正确率</div></div>
    <div class="stat-card"><div class="stat-num">${s.completion}%</div><div class="stat-label">完成度</div></div>
    <div class="stat-card"><div class="stat-num">${s.streak}</div><div class="stat-label">连续正确</div></div>
  </div>`;
  html += `<div class="domain-grid">`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<div class="domain-card" onclick="startDomain(${d})">
      <div class="d-name">Domain ${d}: ${DOMAIN_NAMES[d]}</div>
      <div class="d-weight">权重 ${DOMAIN_WEIGHTS[d]} | 共${ds.total}题</div>
      <div class="d-bar"><div class="d-bar-fill" style="width:${ds.acc}%"></div></div>
      <div class="d-pct">${ds.answered?ds.acc+'%正确率':'未作答'}</div>
    </div>`;
  }
  html += `</div>`;
  html += `<div class="action-btns">
    <button class="btn-primary" onclick="startContinue()">📝 继续练习</button>
    <button class="btn-primary" onclick="startWrongReview()" style="background:var(--wrong)">🔄 错题重练 (${s.recentWrong.length}题待复习)</button>
    <button class="btn-primary" onclick="startExam()" style="background:var(--correct);color:#fff">📋 模拟考核（${EXAM_COUNT}题/${EXAM_MIN}分钟/${EXAM_PASS}分及格）</button>
  </div>`;
  if(s.recentWrong.length) {
    html += `<div class="recent-wrong"><h3>❌ 最近错题</h3><ul>`;
    s.recentWrong.forEach(w=>{
      const q = getQById(w.id);
      if(q) html += `<li onclick="startSingle('${w.id}')">Domain ${q.d} | ${q.q.slice(0,30)}… | 答错${w.count}次</li>`;
    });
    html += `</ul></div>`;
  }
  html += `<div class="footer-note">${META.footerNote || '题库来源：第三方中文整理，以 AWS 官方材料为准'}</div>`;

}

function renderQuiz() {
  const el = document.getElementById('page-quiz');
  if(!quizState || !quizState.questions.length) {
    el.innerHTML = `<div class="header"><button class="back-btn" onclick="navigate('dashboard')">←</button><h1>刷题</h1></div>
    <p style="text-align:center;margin-top:60px;color:var(--text2)">暂无题目，请从仪表盘选择模式开始练习</p>`;
    return;
  }
  const q = quizState.questions[quizState.currentIdx];
  const isHot = q.t === 'hot';
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  // 考核=仅本场作答；练习模式=全局历史（含本场）——防练习记录串进考核视图
  const answers = sessionScopedAnswers();
  const prevAnswers = answers.filter(a=>a.id===q.id);
  const everCorrect = prevAnswers.some(a=>a.ok);
  const everWrong = prevAnswers.some(a=>!a.ok);
  const answered = quizState.answered || {};
  let userAns = answered[q.id];
  const finished = quizState.submitted && quizState.submitted[q.id];
  const correct = finished && isAnswerCorrect(q, userAns);

  let modeLabel = quizState.mode==='exam'?'📋 模拟考核':quizState.mode==='wrong'?'❌ 错题重练':quizState.mode==='domain'?'📖 章节练习':quizState.mode==='single'?'📝 单题练习':'📝 顺序练习';

  let html = `<div class="quiz-header">
    <button class="back-btn" onclick="exitQuiz()">←</button>
    <span style="font-weight:600;font-size:15px">${modeLabel}</span>
    ${quizState.mode==='exam'?`<span class="timer" id="quizTimer"></span>`:''}
    <span class="quiz-progress">${quizState.currentIdx+1}/${quizState.questions.length}</span>
  </div>`;
  html += `<div class="quiz-meta">
    <span class="domain-tag">Domain ${q.d}</span>
    <span>${DOMAIN_NAMES[q.d]}</span>
    <span>${TYPE_NAMES[q.t]}</span>
    ${everCorrect?'<span style="background:rgba(6,214,160,.15);color:var(--correct)">已答对</span>':''}
    ${everWrong?'<span style="background:rgba(239,71,111,.15);color:var(--wrong)">曾答错</span>':''}
  </div>`;
  html += `<div class="question-text">${q.q}</div>`;

  const renderOpts = getOptionsHTML(q, userAns, finished, correct, getShuffledAnswer(q));
  html += renderOpts;

  if(isHot) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?'▶ 完成返回':'▶ 下一题'}</button>
    </div>`;
  } else if(!finished) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>✅ 确认</button>
    </div>`;
  } else {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?(quizState.mode==='exam'?'📊 交卷查看成绩':'▶ 完成返回'):'▶ 下一题'}</button>
    </div>`;
  }

  if(finished) {
    const badge = correct ? '✅ 回答正确!' : '❌ 回答错误';
    const cls = correct ? 'correct' : 'wrong';
    const gItems = getGlossaryForQuestion(q);
    let gHtml = '';
    if(gItems.length) {
      gHtml = '<div class="glossary"><div class="glossary-title">词汇附录</div>';
      gItems.forEach(g => {
        gHtml += '<div class="glossary-item"><span class="glossary-term">' + g.term + '</span><span class="glossary-def">\u00a0\u2014\u00a0' + g.def.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span></div>';
      });
      gHtml += '</div>';
    }
    html += `<div class="explanation show">
      <div class="result-badge ${cls}">${badge}</div>
      <div class="exp-text"><strong>正确答案：</strong>${formatAnswer(q)}</div>
      <div class="exp-text" style="margin-top:8px"><strong>解析：</strong>${highlightGlossaryTerms(fmtExp(q.e))}</div>
      ${q.s?`<div class="exp-source">来源：${q.s}</div>`:''}
      ${gHtml}
    </div>`;
  }

  html += `<div class="qnav"><h4>题号导航</h4><div class="qnav-grid">`;
  quizState.questions.forEach((qq, i) => {
    const qAnswers = answers.filter(a=>a.id===qq.id);
    const qCor = qAnswers.some(a=>a.ok);
    const qWro = qAnswers.some(a=>!a.ok);
    let cls = '';
    if(i===quizState.currentIdx) cls='current';
    else if(qCor) cls='done-correct';
    else if(qWro) cls='done-wrong';
    html += `<div class="qnav-item ${cls}" onclick="jumpToQuestion(${i})">${i+1}</div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
  if(!finished) updateSubmitButton();
}

function getOptionsHTML(q, userAns, finished, correct, shuffledAns) {
  let html = '';
  const qtype = q.t;
  if(qtype === 'hot') {
    html += `<div class="options-list" style="background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:16px">
      <div style="font-weight:600;color:var(--primary);margin-bottom:8px">🖱 本题为拖拽/操作题（HOTSPOT）</div>
      <div style="font-size:13px;line-height:1.7;color:var(--text2)">本题无标准 A/B/C/D 选项，答题形式为图形拖拽/区域选择。题目与图形见源 PDF 原图，答案请参照源文件。</div>`;
    if(q.e) {
      html += `<div style="margin-top:10px;font-size:13px;line-height:1.7;color:var(--text2);border-top:1px solid var(--border);padding-top:10px"><strong>解析/提示：</strong><br>${highlightGlossaryTerms(fmtExp(q.e))}</div>`;
    }
    html += `</div>`;
    return html;
  }
  if(qtype === 'single' || qtype === 'multiple') {
    const isMulti = qtype === 'multiple';
    html += `<div class="options-list">`;
    const opts = quizState.shuffledOptions && quizState.shuffledOptions[q.id] ? quizState.shuffledOptions[q.id] : q.o;
    opts.forEach(o => {
      const isSelected = userAns && userAns.includes(o.l);
      let cls = 'option-item';
      if(isMulti) cls += ' multi';
      if(isSelected && !finished) cls += ' selected';
      if(finished) {
        if(shuffledAns.includes(o.l)) cls += ' correct';
        else if(isSelected) cls += ' wrong';
      }
      const onclick = finished ? '' : `toggleOption('${o.l}')`;
      html += `<div class="${cls}" onclick="${onclick}">
        <span class="opt-label">${o.l}</span>
        <span>${o.t}</span>
      </div>`;
    });
    html += `</div>`;
    if(isMulti && !finished) html += `<div style="font-size:13px;color:var(--text2);margin-top:-12px;margin-bottom:16px">多选——请选择所有正确答案后提交（至少选2项）</div>`;
  }
  return html;
}

/* ================================================================
   ===================== 交互逻辑 =================================
   ================================================================ */

function toggleOption(label) {
  const q = quizState.questions[quizState.currentIdx];
  if(!quizState.answered) quizState.answered = {};
  if(q.t==='single') {
    quizState.answered[q.id] = [label];
  } else {
    const arr = quizState.answered[q.id] || [];
    const idx = arr.indexOf(label);
    if(idx>=0) arr.splice(idx,1);
    else arr.push(label);
    quizState.answered[q.id] = arr;
  }
  renderQuiz();
}

function updateSubmitButton() {
  const q = quizState.questions[quizState.currentIdx];
  if(q.t === 'hot') return;
  const ans = quizState.answered && quizState.answered[q.id];
  const btn = document.getElementById('submitBtn');
  if(!btn) return;
  if(q.t==='single') btn.disabled = !ans || !ans.length;
  else if(q.t==='multiple') btn.disabled = !ans || ans.length < 2;
}

function getShuffledAnswer(q) {
  if(quizState && quizState.shuffledAnswers && quizState.shuffledAnswers[q.id]) {
    return quizState.shuffledAnswers[q.id];
  }
  return q.a;
}

function isAnswerCorrect(q, userAns) {
  if(!userAns) return false;
  const ca = getShuffledAnswer(q);
  if(q.t==='single') return userAns[0]===ca[0];
  if(q.t==='multiple') { const a=[...userAns].sort(); const b=[...ca].sort(); return JSON.stringify(a)===JSON.stringify(b); }
  return false;
}

function formatAnswer(q) {
  const ca = getShuffledAnswer(q);
  if(q.t==='single'||q.t==='multiple') return ca.join(', ');
  if(q.t==='hot') return '本题为拖拽/操作题，答案为图形区域匹配，见源 PDF 原图';
  return '';
}

function submitAnswer() {
  const q = quizState.questions[quizState.currentIdx];
  let userAns = quizState.answered && quizState.answered[q.id];
  if(!userAns) return;
  if(q.t==='multiple' && userAns.length < 2) {
    alert('多选题至少选择2个答案，当前只选了' + userAns.length + '个');
    return;
  }
  const correct = isAnswerCorrect(q, userAns);
  if(!quizState.submitted) quizState.submitted={};
  quizState.submitted[q.id]=true;
  // 本场作答留痕（考核判分唯一依据；不与全局统计混用）
  if(!quizState.results) quizState.results={};
  quizState.results[q.id]={ua:[...userAns], ok:correct, ts:Date.now()};
  recordAnswer(q.id, userAns, correct);
  renderQuiz();
  updateSubmitButton();
}

function prevQuestion() {
  if(quizState.currentIdx > 0) { quizState.currentIdx--; renderQuiz(); }
}
function nextQuestion() {
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  if(isLast) {
    if(quizState.mode==='exam') renderExamResult();
    else navigate('dashboard');
  } else {
    quizState.currentIdx++;
    renderQuiz();
  }
}
function jumpToQuestion(idx) {
  quizState.currentIdx = idx;
  renderQuiz();
}
function exitQuiz() {
  // 考核中途退出必须停表：否则过期计时器归零时会把之后的练习页改写成「考核成绩单」
  if(quizState && quizState.mode==='exam') stopExamTimer();
  if(quizState && quizState.mode!=='exam') {
    setProgress({mode:quizState.mode,domain:quizState.domain||null,idx:quizState.currentIdx,time:Date.now()});
  }
  quizState = null;
  navigate('dashboard');
}

/* ================================================================
   ===================== 刷题模式启动 ==============================
   ================================================================ */
function startDomain(d) {
  const qs = QUESTIONS.filter(q=>q.d===d);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'domain',domain:d,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startContinue() {
  const p = getProgress();
  if(p.mode && p.mode!=='exam') {
    if(p.mode==='domain' && p.domain) {
      const qs = QUESTIONS.filter(q=>q.d===p.domain);
      const _sr=generateShuffledOptions(qs);
      quizState = {mode:'domain',domain:p.domain,questions:qs,currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    } else {
      const _sr=generateShuffledOptions([...QUESTIONS]);
      quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    }
  } else {
    const _sr=generateShuffledOptions([...QUESTIONS]);
    quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  }
  navigate('quiz');
}
function startWrongReview() {
  const wrong = getWrong().filter(w=>!w.mastered);
  if(!wrong.length) { alert('暂无错题需要复习！'); return; }
  const qs = wrong.map(w=>getQById(w.id)).filter(Boolean);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'wrong',domain:null,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startSingle(id) {
  const q = getQById(id);
  if(!q) return;
  const _sr=generateShuffledOptions([q]);
  quizState = {mode:'single',domain:null,questions:[q],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startExam() {
  // 模拟考核：按 meta 权重 × meta 题数分配各域配额（最大余数法，保证总和=EXAM_COUNT）
  const counts = {};
  let sumInt = 0;
  const raw = {}, rem = {};
  DOMAIN_KEYS.forEach(k => {
    const w = parseFloat(String(DOMAIN_WEIGHTS[k]||'0').replace('%',''))/100;
    raw[k] = w * EXAM_COUNT;
    counts[k] = Math.floor(raw[k]);
    rem[k] = raw[k] - counts[k];
    sumInt += counts[k];
  });
  let deficit = EXAM_COUNT - sumInt;
  const order = [...DOMAIN_KEYS].sort((a,b)=>rem[b]-rem[a]);
  let i = 0;
  while(deficit > 0) { counts[order[i % order.length]]++; deficit--; i++; }
  let selected = [];
  DOMAIN_KEYS.forEach(d => {
    const pool = shuffle(QUESTIONS.filter(q=>q.d===d && q.t!=='hot'));
    selected.push(...pool.slice(0, counts[d]));
  });
  selected = shuffle(selected);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam',domain:null,questions:selected,currentIdx:0,answered:{},submitted:{},results:{},shuffledOptions:_exam.opts,shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  // 场次标识：计时回调据此判定「本场是否仍在进行」，防过期计时器串场
  quizState.examToken = 'ex-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

let examTimerInterval = null;
function stopExamTimer() {
  if(examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
}
function startExamTimer() {
  let secs = quizState.examDuration;
  const token = quizState.examToken;
  const timerEl = document.getElementById('quizTimer');
  if(!timerEl) return;
  stopExamTimer();
  examTimerInterval = setInterval(() => {
    // 场次校验：已退出或已换场（新 token）立即自毁
    if(!quizState || quizState.mode!=='exam' || quizState.examToken!==token) { stopExamTimer(); return; }
    secs--;
    const m = Math.floor(secs/60), s = secs%60;
    const el = document.getElementById('quizTimer');
    if(el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if(secs<=60 && el) el.classList.add('warning');
    if(secs<=0) { stopExamTimer(); finishExam(token); }
  }, 1000);
}

function finishExam(token) {
  stopExamTimer();
  // 只对「发起本场计时」的考核会话生效
  if(quizState && quizState.mode==='exam' && (token===undefined || quizState.examToken===token)) renderExamResult();
}

function renderExamResult() {
  if(!quizState) return;
  stopExamTimer();
  const qs = quizState.questions;
  const results = quizState.results || {};
  const total = qs.length;
  // 逐题按本场作答判分；全局历史与往场作答一律不计
  let correct = 0, wrong = 0, unanswered = 0;
  const domStat = {};
  DOMAIN_KEYS.forEach(d => domStat[d] = {n:0, cor:0});
  qs.forEach(q => {
    if(!domStat[q.d]) domStat[q.d] = {n:0, cor:0};
    domStat[q.d].n++;
    const r = results[q.id];
    if(!r) unanswered++;
    else if(r.ok) { correct++; domStat[q.d].cor++; }
    else wrong++;
  });
  // 不变量自校验：正确 + 错误 + 未答 必须等于试卷题数
  if(correct + wrong + unanswered !== total) console.warn('[exam] 判分不变量异常', {correct, wrong, unanswered, total});
  const el = document.getElementById('page-quiz');
  const pct = total ? Math.round(correct/total*100) : 0;
  // 1000-point scale, 700 to pass
  const scaledScore = total ? Math.round(correct/total*1000) : 0;
  const passed = scaledScore >= EXAM_PASS;
  // Time used
  const timeUsed = quizState.examStartTime ? Math.round((Date.now()-quizState.examStartTime)/1000) : 0;
  const timeM = Math.floor(timeUsed/60), timeS = timeUsed%60;

  // Domain breakdown
  let domainHtml = '';
  for(const d of DOMAIN_KEYS) {
    const dd = domStat[d] || {n:0, cor:0};
    const dPct = dd.n ? Math.round(dd.cor/dd.n*100) : 0;
    domainHtml += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${dd.n}</td><td>${dd.cor}</td><td style="color:${dPct>=70?'var(--correct)':'var(--wrong)'}">${dPct}%</td></tr>`;
  }

  el.innerHTML = `<div class="header"><button class="back-btn" onclick="exitExam()">←</button><h1>📋 考核成绩单</h1></div>
  <div style="text-align:center;padding:30px 20px">
    <div style="font-size:48px;font-weight:700;color:${passed?'var(--correct)':'var(--wrong)'}">${scaledScore}</div>

let wrongFilter = 0;

function renderWrongBook() {
  const wrong = getWrong().filter(w=>!w.mastered);
  const mastered = getWrong().filter(w=>w.mastered);
  const el = document.getElementById('page-wrongbook');
  let html = `<div class="header"><h1>❌ 错题集</h1></div>`;
  html += `<div class="wrong-stats">
    <div class="stat-card"><div class="stat-num">${wrong.length}</div><div class="stat-label">待复习</div></div>
    <div class="stat-card"><div class="stat-num">${mastered.length}</div><div class="stat-label">已掌握</div></div>
    <div class="stat-card"><div class="stat-num">${wrong.length+mastered.length}</div><div class="stat-label">共错题</div></div>
  </div>`;
  html += `<div class="wrong-tabs">
    <button class="wrong-tab ${wrongFilter===0?'active':''}" onclick="wrongFilter=0;renderWrongBook()">全部</button>`;
  for(const d of DOMAIN_KEYS) {
    html += `<button class="wrong-tab ${wrongFilter===d?'active':''}" onclick="wrongFilter=${d};renderWrongBook()">${DOMAIN_NAMES[d]}</button>`;
  }
  html += `</div>`;
  let items = wrongFilter ? wrong.filter(w=>{const q=getQById(w.id);return q&&q.d===wrongFilter}) : wrong;
  items.sort((a,b)=>b.count-a.count);
  if(!items.length) {
    html += `<p style="text-align:center;margin-top:40px;color:var(--text2)">🎉 暂无错题！</p>`;
  } else {
    items.forEach(w=>{
      const q = getQById(w.id);
      if(!q) return;
      html += `<div class="wrong-item">
        <div class="wi-header">
          <span><strong>Domain ${q.d}</strong> | ${TYPE_NAMES[q.t]}</span>
          <span style="color:var(--wrong)">答错${w.count}次</span>
        </div>
        <div style="font-size:14px;margin-bottom:6px">${q.q.slice(0,60)}${q.q.length>60?'…':''}</div>
        <div style="font-size:12px;color:var(--text2)">最近答错：${new Date(w.last).toLocaleString()}</div>
        <div class="wi-actions">
          <button onclick="startSingle('${w.id}')">📝 重练本题</button>
          <button onclick="markMastered('${w.id}');renderWrongBook()">✅ 标记已掌握</button>
          <button onclick="removeWrong('${w.id}');renderWrongBook()">🗑️ 移除</button>
        </div>
      </div>`;
    });
  }
  if(mastered.length) {
    html += `<div style="margin-top:20px"><h3 style="font-size:14px;margin-bottom:8px;color:var(--text2)">已掌握 (${mastered.length})</h3>`;
    html += `<button class="btn-secondary" onclick="if(confirm('确定清空所有已掌握的错题吗？')){setWrong(getWrong().filter(w=>!w.mastered));renderWrongBook();}" style="width:auto">清空已掌握</button></div>`;
  }
  el.innerHTML = html;
}
