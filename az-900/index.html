// 题库数据注入区（构建系统自动注入，含考试元信息与题目全集，勿手改）
const QUIZ_META = {"exam":"AZ-900","title":"AZ-900 Azure 基础认证 · 题库","lang":"zh-CN","updated":"2026-11-16","domains":{"1":"描述云概念","2":"描述 Azure 体系结构与服务","3":"描述 Azure 管理与治理"},"weights":{"1":"25–30%","2":"35–40%","3":"30–35%"},"examParams":{"passScore":700,"scoreRange":"1-1000","duration":"45 分钟","questionCount":"官方通用典型区间 40–60 题；单场确切题数开考启动页才显示","skillsMeasuredAsOf":"July 20, 2026","count":45,"minutes":45,"pass":700,"countNote":"本字段是刷题页「模拟考核」从练习池抽题的题数，不是官方考试题数。全量 100 题时模考池按 A 类② 隔离 50 题（14/19/17），练习池剩 50 题、各域余量 14/19/17；若模拟考核也取 50 题，配额与余量恰好相等、零容错，故取 45 题（配额 13/17/15），各域留 1–2 题余量，避免抽不满卷（AZ-104 实证教训）。「全真模考」固定使用 mock-pool.json 的 50 题，不受本字段影响。","certValidity":"Fundamentals 认证不过期，无续期动作"},"footerNote":"AZ-900 中文学习资料 · 题目均自建原创","cnName":"Azure 基础级认证"};
const QUIZ_QUESTIONS = [{"id":"D1-001","d":1,"t":"single","q":"新同事问「云到底是什么」，下列哪句话最准确地给出了云计算的定义","o":[{"l":"A","t":"把公司文件存到网盘，需要时再下载"},{"l":"B","t":"任何能通过互联网远程访问的服务都算云"},{"l":"C","t":"通过网络按需租用计算资源并按实际用量付费的服务方式"},{"l":"D","t":"把自家机房的服务器集中起来统一管理"}],"a":["C"],"e":"**正确答案：C。** 通过网络按需租用计算资源并按实际用量付费的服务方式。\n\n**为什么对：** 云计算的定义落在模式上：资源由云服务商持有并维护，你按需取用、弹性伸缩、按计量付费，这正是它与传统自建机房的分界线。关联考点：官方技能点 1.1.1「定义云计算」，内容领域 1。\n\n**其他选项为什么错：**\n- A：把公司文件存到网盘，需要时再下载。只碰到一小块，网盘是单个存储工具，不是按需租用计算资源的完整模式。\n- B：任何能通过互联网远程访问的服务都算云。把远程访问当成了充分条件，远程可用的服务未必按需取用、弹性伸缩和计量计费。\n- D：把自家机房的服务器集中起来统一管理。讲的是本地资源整合，硬件仍自持自管，与按需租用的模式无关。\n\n**关键概念：** 云计算是按需租用加按量计费的模式，资源归服务商持有。本题对应考纲 1.1.1。","s":"自编·1.1.1"},{"id":"D1-002","d":1,"t":"single","q":"营销团队当天申请十台临时服务器上线活动页，活动结束当天全部释放，只为实际占用的两周付费。这段经历体现了云计算的哪组特征","o":[{"l":"A","t":"这得益于资源由云服务商持有维护"},{"l":"B","t":"按需取用、弹性伸缩与计量计费，用完即释放不留闲置"},{"l":"C","t":"必须提前数月走采购流程备货"},{"l":"D","t":"机器闲置期间也要持续付费"}],"a":["B"],"e":"**正确答案：B。** 按需取用、弹性伸缩与计量计费，用完即释放不留闲置。\n\n**为什么对：** 当天开通对应按需取用，结束即释放对应弹性伸缩，只付两周对应计量计费，三个特征在同一段经历里同时成立。关联考点：官方技能点 1.1.1「定义云计算」，内容领域 1。\n\n**其他选项为什么错：**\n- A：这得益于资源由云服务商持有维护。那是模式成立的前提背景，没有点中即申请即归还这段行为本身。\n- C：必须提前数月走采购流程备货。恰是传统采购的对照面，云端开通是分钟级，与这次经历相反。\n- D：机器闲置期间也要持续付费。与消费型计费相反，释放后停止计费才是这次的关键点。\n\n**关键概念：** 按需取用、弹性伸缩、计量计费是云计算的三个特征。本题对应考纲 1.1.1。","s":"自编·1.1.1"},{"id":"D1-003","d":1,"t":"single","q":"公司误配了软件即服务（SaaS）办公套件的共享范围，内部报表被多看了三个月。复盘追责时，这段数据访问配置的责任归谁","o":[{"l":"A","t":"租户自己，数据与访问控制永远是你这一侧的责任"},{"l":"B","t":"云服务商，软件由它运营维护"},{"l":"C","t":"云服务商，用了 SaaS 安全就整体外包了"},{"l":"D","t":"双方各担一半，无法划清"}],"a":["A"],"e":"**正确答案：A。** 租户自己，数据与访问控制永远是你这一侧的责任。\n\n**为什么对：** 共享责任模型里物理层永远归服务商，数据与访问控制永远归你；服务类型再怎么上移，数据这一段的责任线都不动，误配共享范围正落在你这一侧。关联考点：官方技能点 1.1.2「描述共享责任模型」，内容领域 1。\n\n**其他选项为什么错：**\n- B：云服务商，软件由它运营维护。运营软件不等于接管数据责任，共享范围是租户侧的配置动作。\n- C：云服务商，用了 SaaS 安全就整体外包了。责任跟着控制权走，数据与账户配置从未随服务类型外包出去。\n- D：双方各担一半，无法划清。共享责任模型正是为划清而生，每一段责任都有明确归属。\n\n**关键概念：** 数据与访问控制永远是租户责任，服务类型再高也移不走。本题对应考纲 1.1.2。","s":"自编·1.1.2"},{"id":"D1-004","d":1,"t":"single","q":"同一公司里，甲系统用基础设施即服务（IaaS）虚拟机、乙系统用软件即服务（SaaS）套件。关于操作系统这一层归谁维护，正确的说法是","o":[{"l":"A","t":"两边都归你，租户责任从不变化"},{"l":"B","t":"两边都归服务商，云上机器都不用操心"},{"l":"C","t":"归谁看合同怎么签，模型定不了"},{"l":"D","t":"IaaS 归你维护、SaaS 归服务商，责任线随服务类型移动"}],"a":["D"],"e":"**正确答案：D。** IaaS 归你维护、SaaS 归服务商，责任线随服务类型移动。\n\n**为什么对：** 责任线是一条滑动的线：物理硬件永远在服务商侧，数据永远在你侧；中间的操作系统到运行环境，IaaS 划在虚拟化之上归你，SaaS 几乎划到顶归服务商。关联考点：官方技能点 1.1.2「描述共享责任模型」，内容领域 1。\n\n**其他选项为什么错：**\n- A：两边都归你，租户责任从不变化。数据那一段确实不动，但操作系统这段随服务类型上下滑动。\n- B：两边都归服务商，云上机器都不用操心。IaaS 恰恰从操作系统开始归你，虚机打不上补丁是你的事。\n- C：归谁看合同怎么签，模型定不了。模型先给出默认划分，合同只能在其上再加约定。\n\n**关键概念：** 责任跟着控制权走，你控制到哪一层就负责到哪一层。本题对应考纲 1.1.2。","s":"自编·1.1.2"},{"id":"D1-005","d":1,"t":"multiple","q":"新同事刚学完公有、私有与混合三种云模型，写下六条笔记，其中哪些说法是正确的","o":[{"l":"A","t":"私有云必须建在组织自家机房里"},{"l":"B","t":"混合云要求两边各承担一半负载"},{"l":"C","t":"公有云的多个租户共用同一批物理硬件、逻辑上互相隔离"},{"l":"D","t":"公有云租户彼此能看见对方数据"},{"l":"E","t":"混合云是所有企业的终极形态"},{"l":"F","t":"私有云可以托管在别处，只要环境为一个组织独占"}],"a":["C","F"],"e":"**正确答案：C、F。** 公有云的多个租户共用同一批物理硬件、逻辑上互相隔离；私有云可以托管在别处，只要环境为一个组织独占。\n\n**为什么对：** 多租户共享加逻辑隔离是公有云的定义特征，独占服务一个组织是私有云的判定标准。关联考点：官方技能点 1.1.3「定义云模型：公有、私有与混合」，内容领域 1。\n\n**其他选项为什么错：**\n- A：私有云必须建在组织自家机房里。独占不等于自建，托管在别处但独占的环境也算私有云。\n- B：混合云要求两边各承担一半负载。混合是两边各干擅长的事，不是对半静态拆分。\n- D：公有云租户彼此能看见对方数据。物理共用不等于逻辑可见，多租户之间互不可见。\n- E：混合云是所有企业的终极形态。没有硬约束就不该上混合，多一边就多一套运维要管。\n\n**关键概念：** 公有看共享隔离，私有看独占，混合看互通。本题对应考纲 1.1.3。","s":"自编·1.1.3"},{"id":"D1-006","d":1,"t":"single","q":"一家制造企业把官网放在公有云随流量弹性伸缩，核心账务放在独占的私有环境，季度对账时两边经加密通道同步数据。这一整体部署形态属于哪种云模型","o":[{"l":"A","t":"公有云，因为对外业务占了大部分资源"},{"l":"B","t":"混合云，公有与私有组合使用、两边按需互通"},{"l":"C","t":"私有云，因为有数据没有出门"},{"l":"D","t":"多租户云，因为官网与他人共用硬件"}],"a":["B"],"e":"**正确答案：B。** 混合云，公有与私有组合使用、两边按需互通。\n\n**为什么对：** 混合云的定义就是公有加私有组合使用：独占环境保敏感与稳态，公有云供弹性与创新，中间打通衔接；这套部署逐条对上了这三个特征。关联考点：官方技能点 1.1.3「定义云模型：公有、私有与混合」，内容领域 1。\n\n**其他选项为什么错：**\n- A：公有云，因为对外业务占了大部分资源。模型按整体形态判定，不按资源数量多少投票。\n- C：私有云，因为有数据没有出门。两套环境并存且互通，已不是单一独占环境的形态。\n- D：多租户云，因为官网与他人共用硬件。多租户只描述公有云那一侧的租用方式，盖不住整体形态。\n\n**关键概念：** 公有供弹性、私有保独占、中间打通，三者齐了就是混合云。本题对应考纲 1.1.3。","s":"自编·1.1.3"},{"id":"D1-007","d":1,"t":"single","q":"一家保险公司把整套云环境托管在服务商机房，但该环境只为本公司独占使用，不向任何外部组织开放。这一环境属于哪种云模型","o":[{"l":"A","t":"私有云，判定标准是为单个组织独占服务"},{"l":"B","t":"公有云，因为硬件放在服务商机房里"},{"l":"C","t":"混合云，因为同时涉及两方组织"},{"l":"D","t":"多租户云，因为服务商还服务其他公司"}],"a":["A"],"e":"**正确答案：A。** 私有云，判定标准是为单个组织独占服务。\n\n**为什么对：** 私有云的定义是基础设施只为一个组织服务：可以建在自家机房，也可以托管在别处但独占；这套环境虽不在自家机房，独占这一条已经满足。关联考点：官方技能点 1.1.3「定义云模型：公有、私有与混合」，内容领域 1。\n\n**其他选项为什么错：**\n- B：公有云，因为硬件放在服务商机房里。基础设施在谁家机房不是判定线，公有云的关键是多租户共享。\n- C：混合云，因为同时涉及两方组织。混合要求公有与私有两套环境并存互通，单一独占环境不构成。\n- D：多租户云，因为服务商还服务其他公司。该环境独占不共享，多租户恰恰不成立。\n\n**关键概念：** 私有云看独占不看自建，托管在别处的独占环境也算。本题对应考纲 1.1.3。","s":"自编·1.1.3"},{"id":"D1-008","d":1,"t":"single","q":"医疗影像业务受监管约束，影像库不能离开院内合规环境；影像分析训练的高峰算力又希望按需获取、用完即释放。最合适的云模型是","o":[{"l":"A","t":"公有云，把影像库一并上云简化架构"},{"l":"B","t":"私有云，把训练算力也建在院内"},{"l":"C","t":"维持全本地不做云化"},{"l":"D","t":"混合云，敏感数据留在私有环境、弹性算力溢出到公有云"}],"a":["D"],"e":"**正确答案：D。** 混合云，敏感数据留在私有环境、弹性算力溢出到公有云。\n\n**为什么对：** 选型先问合规再问弹性：影像库必须留在独占环境，训练高峰是典型波动负载适合按需取用，两边经加密通道衔接正是教科书式用法。关联考点：官方技能点 1.1.4「辨认各云模型的适用场景」，内容领域 1。\n\n**其他选项为什么错：**\n- A：公有云，把影像库一并上云简化架构。监管明确要求数据不能出院，全上公有云直接违反这条硬约束。\n- B：私有云，把训练算力也建在院内。高峰算力自建会长期闲置，按需溢出正是公有云擅长的环节。\n- C：维持全本地不做云化。放弃弹性环节的按需优势，高峰要么买断闲置要么扛不住。\n\n**关键概念：** 先问数据能不能出门，再问负载波不波动，两个答案拼出模型。本题对应考纲 1.1.4。","s":"自编·1.1.4"},{"id":"D1-009","d":1,"t":"single","q":"管理会上有人说「我们担心安全，别用公有云了，直接上私有云」。按选型判断线，这句话最主要的问题是","o":[{"l":"A","t":"私有云本身不具备安全能力"},{"l":"B","t":"选型应先问弹性再问合规"},{"l":"C","t":"把安全焦虑当理由选私有，该先厘清共享责任的分界"},{"l":"D","t":"担心安全就不该考虑任何云"}],"a":["C"],"e":"**正确答案：C。** 把安全焦虑当理由选私有，该先厘清共享责任的分界。\n\n**为什么对：** 公有云的安全配置做对了一样可靠；焦虑的正确动作是回到共享责任模型厘清谁管哪层，没有合规硬约束就为它放弃弹性与按量付费并不划算。关联考点：官方技能点 1.1.4「辨认各云模型的适用场景」，内容领域 1。\n\n**其他选项为什么错：**\n- A：私有云本身不具备安全能力。私有云同样要配安全体系，说它不具备安全是事实性错误。\n- B：选型应先问弹性再问合规。判断顺序是先合规后弹性，这里把顺序说反了。\n- D：担心安全就不该考虑任何云。本地部署也有安全工作要做，云与安全并不互斥。\n\n**关键概念：** 安全焦虑先厘清共享责任，别拿它当私有云的选型理由。本题对应考纲 1.1.4。","s":"自编·1.1.4"},{"id":"D1-010","d":1,"t":"single","q":"财务部审两笔支出：一笔预付三年买断四十台服务器入资产账逐年折旧，另一笔按月支付云上虚拟机费用。这两笔分别属于哪类支出","o":[{"l":"A","t":"两笔都是资本支出，因为都买了算力"},{"l":"B","t":"前者是资本支出、后者是运营支出，随用随付不留资产"},{"l":"C","t":"两笔都是运营支出，因为都发生在经营期"},{"l":"D","t":"前者运营支出、后者资本支出"}],"a":["B"],"e":"**正确答案：B。** 前者是资本支出、后者是运营支出，随用随付不留资产。\n\n**为什么对：** 资本支出是一次性购置资产的投入，花大钱、入资产账、逐年折旧；运营支出随用随付、月结不留资产，两笔支出各自对上了其中一组特征。关联考点：官方技能点 1.1.5「描述消费型模型」，内容领域 1。\n\n**其他选项为什么错：**\n- A：两笔都是资本支出，因为都买了算力。按月付的虚拟机费不留资产、不折旧，归运营支出。\n- C：两笔都是运营支出，因为都发生在经营期。买断硬件是一次性购置资产的投入，入账折旧是资本支出的标志。\n- D：前者运营支出、后者资本支出。方向对调了，一次性买断才是资本，随用随付才是运营。\n\n**关键概念：** 一次性买断归资本支出，随用随付归运营支出。本题对应考纲 1.1.5。","s":"自编·1.1.5"},{"id":"D1-011","d":1,"t":"single","q":"运维向新同事解释云的计费方式：「就像家里的水表电表，拧开才计费，关掉就停表」。这句话点中的特征是","o":[{"l":"A","t":"按实际消耗的资源计费，不用不计费、随时增减"},{"l":"B","t":"只要开通了服务，闲着也持续扣费"},{"l":"C","t":"按固定包月一口价计费，用量不影响账单"},{"l":"D","t":"先一次性买断容量再慢慢摊销"}],"a":["A"],"e":"**正确答案：A。** 按实际消耗的资源计费，不用不计费、随时增减。\n\n**为什么对：** 消费型模型按实际消耗计费：拧开才计费对应使用才计费，关掉停表对应不用不计费，随时增减也在比喻里，逐条对得上。关联考点：官方技能点 1.1.5「描述消费型模型」，内容领域 1。\n\n**其他选项为什么错：**\n- B：只要开通了服务，闲着也持续扣费。与水表电表类比相反，关掉停表正是不用不计费。\n- C：按固定包月一口价计费，用量不影响账单。固定包月不是消费型模型，账单不随实际用量走。\n- D：先一次性买断容量再慢慢摊销。那是资本支出的路径，与随用随付的模式相反。\n\n**关键概念：** 消费型模型类比水表电表，用多少付多少、不用不计费。本题对应考纲 1.1.5。","s":"自编·1.1.5"},{"id":"D1-012","d":1,"t":"single","q":"视频转码任务白天排队、晚上批量执行，中途被中断也可以随时重跑，团队希望把计算成本压到最低。应选哪种定价形态","o":[{"l":"A","t":"按需计费，单价稳定且随时可用"},{"l":"B","t":"预留，承诺一年锁定低价"},{"l":"C","t":"按需与预留各买一半来平衡"},{"l":"D","t":"Spot（竞价）容量，借服务商闲置容量拿最大折扣、被回收就重跑"}],"a":["D"],"e":"**正确答案：D。** Spot（竞价）容量，借服务商闲置容量拿最大折扣、被回收就重跑。\n\n**为什么对：** 三种形态按承诺换折扣排列，负载越能容忍中断越能往便宜走；转码能重跑，正好拿容忍被回收换最大折扣，夜间执行也匹配闲置容量的时段。关联考点：官方技能点 1.1.6「比较云定价模型」，内容领域 1。\n\n**其他选项为什么错：**\n- A：按需计费，单价稳定且随时可用。按需单价最高，能容忍中断的任务用它等于白付溢价。\n- B：预留，承诺一年锁定低价。预留适合稳态负载，可中断的批量任务承诺一年反而多付。\n- C：按需与预留各买一半来平衡。负载特征已明确可中断，混搭两边都不最优。\n\n**关键概念：** 可中断、能重跑的任务用 Spot，容忍回收换最大折扣。本题对应考纲 1.1.6。","s":"自编·1.1.6"},{"id":"D1-013","d":1,"t":"single","q":"报表数据库预计三年不变、可以接受长期承诺，团队希望拿到更低的单价。应选哪种定价形态","o":[{"l":"A","t":"按需计费，随开随停最灵活"},{"l":"B","t":"Spot 容量，折扣幅度最大"},{"l":"C","t":"预留，用一年或三年的时长承诺换深度折扣"},{"l":"D","t":"按需加 Spot 混搭兼顾两头"}],"a":["C"],"e":"**正确答案：C。** 预留，用一年或三年的时长承诺换深度折扣。\n\n**为什么对：** 预留的机制就是承诺一段时期换折扣，与三年不变的稳态特征正好匹配；按需零承诺单价最高，Spot 要求可中断，两头都对不上，只有预留合适。关联考点：官方技能点 1.1.6「比较云定价模型」，内容领域 1。\n\n**其他选项为什么错：**\n- A：按需计费，随开随停最灵活。按需弹性最大但单价也最高，稳态负载常年按需会多花不少。\n- B：Spot 容量，折扣幅度最大。Spot 随时可能被回收，数据库这类不能中断的服务扛不住。\n- D：按需加 Spot 混搭兼顾两头。数据库负载连续稳定，被回收即中断，混搭引入风险换不来收益。\n\n**关键概念：** 稳态可预测的负载用预留，拿时长承诺换深度折扣。本题对应考纲 1.1.6。","s":"自编·1.1.6"},{"id":"D1-014","d":1,"t":"single","q":"架构评审会上有人形容无服务器计算：「反正没有服务器，所以也不存在服务器管理」。这一说法错在哪里","o":[{"l":"A","t":"说反了，无服务器确实一台机器都没有"},{"l":"B","t":"「无」掉的是你不用管服务器，机器仍在平台那一侧"},{"l":"C","t":"无服务器指用别人的服务器代管"},{"l":"D","t":"无服务器是虚拟机的另一种叫法"}],"a":["B"],"e":"**正确答案：B。** 「无」掉的是你不用管服务器，机器仍在平台那一侧。\n\n**为什么对：** 无服务器的名字容易误导：服务器调配、扩容、修补全部由平台代管，你只部署代码；机器一直在平台那侧，无掉的是你这一侧的管理负担。关联考点：官方技能点 1.1.7「描述无服务器」，内容领域 1。\n\n**其他选项为什么错：**\n- A：说反了，无服务器确实一台机器都没有。机器一直在，只是看不见、不配置、不打补丁，说没有机器是字面误读。\n- C：无服务器指用别人的服务器代管。代管是结果不是定义，重点在你只部署代码、其余全由平台代管。\n- D：无服务器是虚拟机的另一种叫法。虚拟机要自己装系统打补丁，与全代管形态是两档。\n\n**关键概念：** 无服务器无掉的是你这一侧的管理，机器在平台那侧。本题对应考纲 1.1.7。","s":"自编·1.1.7"},{"id":"D1-015","d":1,"t":"single","q":"商品图缩略图功能部署为无服务器函数：白天随上传量并行执行，夜里没人传图时几乎没有费用产生。这一形态的计费特征是","o":[{"l":"A","t":"按代码实际执行计费，没有执行就不计费"},{"l":"B","t":"按开通时长计费，夜里也在扣钱"},{"l":"C","t":"按固定月费计费，与执行量无关"},{"l":"D","t":"按峰值容量计费，永远按最高点收"}],"a":["A"],"e":"**正确答案：A。** 按代码实际执行计费，没有执行就不计费。\n\n**为什么对：** 无服务器按执行计费：触发一次算一次、运行时长算时长；夜里没人传图就没有执行，计费自然接近零，省的正是常驻方案里闲置那一截。关联考点：官方技能点 1.1.7「描述无服务器」，内容领域 1。\n\n**其他选项为什么错：**\n- B：按开通时长计费，夜里也在扣钱。常驻计费是虚拟机的模式，无服务器夜里没执行就不计费。\n- C：按固定月费计费，与执行量无关。固定月费对应常驻服务，与按执行计费的形态相反。\n- D：按峰值容量计费，永远按最高点收。按执行计费随实际触发走，不为峰值预留付费。\n\n**关键概念：** 无服务器按执行计费，没执行不计费、伸缩全自动。本题对应考纲 1.1.7。","s":"自编·1.1.7"},{"id":"D1-016","d":1,"t":"multiple","q":"电商大促前，团队讨论订单服务怎么扩容。下列哪些做法属于横向扩展","o":[{"l":"A","t":"把数据库单机换到更高配的档位"},{"l":"B","t":"把订单服务从两台实例加到八台实例"},{"l":"C","t":"为应对峰值把实例数永久固定在八台"},{"l":"D","t":"给关键服务配置跨机房冗余副本"},{"l":"E","t":"大促结束后把实例数减回两台"},{"l":"F","t":"与服务商签更高的在线时长承诺"}],"a":["B","E"],"e":"**正确答案：B、E。** 把订单服务从两台实例加到八台实例；大促结束后把实例数减回两台。\n\n**为什么对：** 横向扩展是加减实例台数：活动前加台数扛住峰值，活动后减台数收回成本，一加一减正好体现能加也能减。关联考点：官方技能点 1.2.1「描述云中高可用性与可扩展性的好处」，内容领域 1。\n\n**其他选项为什么错：**\n- A：把数据库单机换到更高配的档位。那是纵向扩展，升档位改的是单台规格，不是加台数。\n- C：为应对峰值把实例数永久固定在八台。可扩展要求能加也能减，只加不减在负载回落时白付钱。\n- D：给关键服务配置跨机房冗余副本。那是高可用靠冗余兜底的手段，不属于容量加减。\n- F：与服务商签更高的在线时长承诺。SLA 承诺的是可用性口径，不改变容量本身。\n\n**关键概念：** 横向扩展加减台数，能加也要能减；升档位是纵向扩展。本题对应考纲 1.2.1。","s":"自编·1.2.1"},{"id":"D1-017","d":1,"t":"single","q":"某服务的等级协议（SLA）承诺每月 99.9% 时间可用。这一承诺对应的云的好处是哪个概念","o":[{"l":"A","t":"可扩展性，容量随需加减"},{"l":"B","t":"可靠性，故障后自动恢复原状"},{"l":"C","t":"高可用性，指服务尽可能长时间在线的能力"},{"l":"D","t":"可预测性，账单可以提前算准"}],"a":["C"],"e":"**正确答案：C。** 高可用性，指服务尽可能长时间在线的能力。\n\n**为什么对：** 高可用性指尽可能长时间在线，SLA 是它的正式承诺载体，背后靠分散部署与冗余兜底；百分比只承诺在线时长这一件事。关联考点：官方技能点 1.2.1「描述云中高可用性与可扩展性的好处」，内容领域 1。\n\n**其他选项为什么错：**\n- A：可扩展性，容量随需加减。SLA 承诺的是在线时长，不是容量大小。\n- B：可靠性，故障后自动恢复原状。可靠讲恢复力，SLA 的口径是在线时长百分比。\n- D：可预测性，账单可以提前算准。那是成本维度的事，与在线承诺无关。\n\n**关键概念：** SLA 是高可用性的承诺口径，认百分比先想在线时长。本题对应考纲 1.2.1。","s":"自编·1.2.1"},{"id":"D1-018","d":1,"t":"single","q":"演练报告显示，机房故障后系统十分钟内切换到冗余副本恢复服务。这一结果直接体现的是","o":[{"l":"A","t":"高可用性，承诺尽可能长的在线时间"},{"l":"B","t":"可靠性，在故障中维持运作并从中恢复的能力"},{"l":"C","t":"可扩展性，容量随负载加减"},{"l":"D","t":"可预测性，表现可提前算准"}],"a":["B"],"e":"**正确答案：B。** 可靠性，在故障中维持运作并从中恢复的能力。\n\n**为什么对：** 可靠性指系统在故障中维持运作并从中恢复的能力，靠分散部署与冗余设计兜底；十分钟切换恢复正是恢复力的直接证据。关联考点：官方技能点 1.2.2「描述云中可靠性与可预测性的好处」，内容领域 1。\n\n**其他选项为什么错：**\n- A：高可用性，承诺尽可能长的在线时间。那是在线时长的口径，这道考的是故障后的恢复力。\n- C：可扩展性，容量随负载加减。容量加减与故障恢复不是一对概念。\n- D：可预测性，表现可提前算准。可预测讲算得准，不是坏了能不能恢复。\n\n**关键概念：** 高可用管在线时长，可靠性管故障后恢复，别混。本题对应考纲 1.2.2。","s":"自编·1.2.2"},{"id":"D1-019","d":1,"t":"single","q":"财务要求新项目的云费用「事先算得出来、超了有告警」。要满足这个要求，正确的做法是","o":[{"l":"A","t":"用定价计算器估算并配预算告警去管理"},{"l":"B","t":"相信云的账单天然可预测"},{"l":"C","t":"把所有负载都买成预留锁定单价"},{"l":"D","t":"等月底账单出来再复盘差异"}],"a":["A"],"e":"**正确答案：A。** 用定价计算器估算并配预算告警去管理。\n\n**为什么对：** 可预测性靠透明加工具：定价计算器把会花多少事前算出来，预算与告警把超支拦在发生前，两件都配上才算真可预测。关联考点：官方技能点 1.2.2「描述云中可靠性与可预测性的好处」，内容领域 1。\n\n**其他选项为什么错：**\n- B：相信云的账单天然可预测。透明不等于可预测，不去管就只是透明。\n- C：把所有负载都买成预留锁定单价。预留锁的是单价，预算管理还是要靠工具做。\n- D：等月底账单出来再复盘差异。那是事后复盘，可预测要的是事前算准与告警。\n\n**关键概念：** 透明不等于可预测，用工具管起来才叫可预测。本题对应考纲 1.2.2。","s":"自编·1.2.2"},{"id":"D1-020","d":1,"t":"single","q":"安全团队要在全公司立两条规矩：资源只许建在两个指定区域、存储一律加密，并要求不合规的新建直接被拦下。最合适的落地方式是","o":[{"l":"A","t":"发全员邮件提醒大家自觉遵守"},{"l":"B","t":"买齐云厂商的合规认证就算完成"},{"l":"C","t":"等季度审计时逐条排查补救"},{"l":"D","t":"用策略服务自动化执行，违规新建直接拦下"}],"a":["D"],"e":"**正确答案：D。** 用策略服务自动化执行，违规新建直接拦下。\n\n**为什么对：** 治理是立规矩并保证被遵守，云上用策略自动化落地：两条规矩写成策略，不合规的新建直接拦下，比邮件提醒与事后审计都可靠。关联考点：官方技能点 1.2.3「描述云中安全与治理的好处」，内容领域 1。\n\n**其他选项为什么错：**\n- A：发全员邮件提醒大家自觉遵守。软约束靠自觉，拦不住不合规的新建资源。\n- B：买齐云厂商的合规认证就算完成。厂商给的是认证与证据，合规动作与数据责任仍归你。\n- C：等季度审计时逐条排查补救。事后排查周期太长，规矩要的是新建即拦截。\n\n**关键概念：** 治理用策略自动化执行规矩，不靠自觉也不靠事后审计。本题对应考纲 1.2.3。","s":"自编·1.2.3"},{"id":"D1-021","d":1,"t":"single","q":"新项目组申请整套环境，原来靠邮件传清单、运维手工点门户。现在希望十分钟自动生成全套环境，且规格与生产分毫不差。应该走哪条路","o":[{"l":"A","t":"继续手工点门户，熟练后也会快"},{"l":"B","t":"加派运维人手并行处理申请"},{"l":"C","t":"基础设施即代码，用模板加参数一次生成"},{"l":"D","t":"只开通门户权限让项目组自助"}],"a":["C"],"e":"**正确答案：C。** 基础设施即代码，用模板加参数一次生成。\n\n**为什么对：** 可管理性的两条路里，模板路线正对这个场景：环境写成代码一次编写处处复用，测试与生产长同一副样子，规模越大收益越大。关联考点：官方技能点 1.2.4「描述可管理性的好处」，内容领域 1。\n\n**其他选项为什么错：**\n- A：继续手工点门户，熟练后也会快。手工操作不可重复，一百次点击难保零差错。\n- B：加派运维人手并行处理申请。人力随申请量线性增长，规模一大就管不过来。\n- D：只开通门户权限让项目组自助。门户是统一操作面，环境一致性仍要靠模板保证。\n\n**关键概念：** 统一操作面管日常，模板管一致性，规模越大越值钱。本题对应考纲 1.2.4。","s":"自编·1.2.4"},{"id":"D1-022","d":1,"t":"single","q":"老 ERP 系统带着一堆定制中间件上云，公司不想动架构，系统、补丁、备份仍由自己的运维管。最合适的方案是","o":[{"l":"A","t":"平台即服务（PaaS）托管，平台代管运行环境"},{"l":"B","t":"基础设施即服务（IaaS）虚拟机原样平移"},{"l":"C","t":"软件即服务（SaaS）套件，开箱即用"},{"l":"D","t":"无服务器函数重写核心逻辑"}],"a":["B"],"e":"**正确答案：B。** 基础设施即服务（IaaS）虚拟机原样平移。\n\n**为什么对：** 原样平移正是 IaaS 的典型用法：租计算、存储、网络原料，操作系统往上归你管，与现有运维分工一致，云只换了机器从哪来这一段。关联考点：官方技能点 1.3.1「描述基础设施即服务（IaaS）」，内容领域 1。\n\n**其他选项为什么错：**\n- A：平台即服务（PaaS）托管，平台代管运行环境。平台环境装不下定制中间件，这类越界需求要降层。\n- C：软件即服务（SaaS）套件，开箱即用。成品软件改不动，深度定制系统套不进去。\n- D：无服务器函数重写核心逻辑。重写违背原样平移的前提，还引入改造风险。\n\n**关键概念：** 原样平移选 IaaS，系统补丁备份仍归你管。本题对应考纲 1.3.1。","s":"自编·1.3.1"},{"id":"D1-023","d":1,"t":"single","q":"团队在 IaaS 虚拟机上跑服务，安全检查发现虚拟机的操作系统补丁长期没有更新。这段责任归谁","o":[{"l":"A","t":"租户自己，IaaS 从操作系统开始归你管"},{"l":"B","t":"云服务商，机器是它提供的"},{"l":"C","t":"云服务商，补丁统一由平台推送"},{"l":"D","t":"双方共同负责，按合同分摊"}],"a":["A"],"e":"**正确答案：A。** 租户自己，IaaS 从操作系统开始归你管。\n\n**为什么对：** IaaS 的责任线划在虚拟化之上：硬件、机房、电力归服务商，操作系统、中间件、应用归你；虚机补丁正是租户侧的事，宿主机故障才归它。关联考点：官方技能点 1.3.1「描述基础设施即服务（IaaS）」，内容领域 1。\n\n**其他选项为什么错：**\n- B：云服务商，机器是它提供的。服务商负责到虚拟化层为止，系统层归租户。\n- C：云服务商，补丁统一由平台推送。平台代管补丁是 PaaS 往上的形态，IaaS 不含。\n- D：双方共同负责，按合同分摊。责任线有默认划分，操作系统明确归租户侧。\n\n**关键概念：** IaaS 你管到操作系统，虚机补丁是你的事。本题对应考纲 1.3.1。","s":"自编·1.3.1"},{"id":"D1-024","d":1,"t":"multiple","q":"开发团队把网站从自管虚拟机迁到平台即服务（PaaS）上。迁移之后，下列哪些工作改由平台负责","o":[{"l":"A","t":"操作系统与运行环境的补丁更新"},{"l":"B","t":"应用代码的编写与发布"},{"l":"C","t":"业务数据的管理与备份"},{"l":"D","t":"团队成员的访问权限配置"},{"l":"E","t":"运行环境随流量的自动扩容"},{"l":"F","t":"应用本身的配置与功能调优"}],"a":["A","E"],"e":"**正确答案：A、E。** 操作系统与运行环境的补丁更新；运行环境随流量的自动扩容。\n\n**为什么对：** PaaS 的责任线划在运行环境之上：机器、系统、运行时、补丁、扩容全由平台代管；补丁与自动扩容落在平台侧，代码数据权限留在你侧。关联考点：官方技能点 1.3.2「描述平台即服务（PaaS）」，内容领域 1。\n\n**其他选项为什么错：**\n- B：应用代码的编写与发布。代码始终是团队的责任，平台代管的是机器到运行时这一段。\n- C：业务数据的管理与备份。数据永远归租户，这段责任线不随服务类型移动。\n- D：团队成员的访问权限配置。账户与访问控制归租户侧，服务档位再高也移不走。\n- F：应用本身的配置与功能调优。应用层始终归你，PaaS 解放的是运维不是开发。\n\n**关键概念：** PaaS 代管机器到运行时，代码、数据、权限仍归你。本题对应考纲 1.3.2。","s":"自编·1.3.2"},{"id":"D1-025","d":1,"t":"single","q":"团队在 PaaS 上跑应用，新需求要安装一个平台运行环境不支持的底层组件。最合适的调整是","o":[{"l":"A","t":"向平台申请开放任意组件安装"},{"l":"B","t":"更换到另一家 PaaS 供应商"},{"l":"C","t":"把这部分降级到容器或虚拟机自行承载"},{"l":"D","t":"把组件改成云函数重新实现"}],"a":["C"],"e":"**正确答案：C。** 把这部分降级到容器或虚拟机自行承载。\n\n**为什么对：** PaaS 的代价是平台环境有边界，装不了任意东西；越界需求的正解是降层，用容器或虚机换系统级自由，代价是运维责任随之回来。关联考点：官方技能点 1.3.2「描述平台即服务（PaaS）」，内容领域 1。\n\n**其他选项为什么错：**\n- A：向平台申请开放任意组件安装。平台环境有边界，装不了任意东西是既定约束。\n- B：更换到另一家 PaaS 供应商。边界是这一类服务的共性，换一家同样受限。\n- D：把组件改成云函数重新实现。改造代价大，且未必能满足底层依赖需求。\n\n**关键概念：** PaaS 换省心，代价是装不了任意东西，越界就降层。本题对应考纲 1.3.2。","s":"自编·1.3.2"},{"id":"D1-026","d":1,"t":"single","q":"全公司用上软件即服务（SaaS）办公套件后，IT 部门发现自己仍必须动手负责的是哪一类事","o":[{"l":"A","t":"给套件打安全补丁"},{"l":"B","t":"管好自己的数据与使用配置这两样"},{"l":"C","t":"扩容应对使用高峰"},{"l":"D","t":"维护套件的运行环境"}],"a":["B"],"e":"**正确答案：B。** 管好自己的数据与使用配置这两样。\n\n**为什么对：** SaaS 的责任线几乎划到顶：机房、硬件、运行环境、应用全归服务商，你只剩数据与使用配置两样；误配共享范围这类事责任在租户侧。关联考点：官方技能点 1.3.3「描述软件即服务（SaaS）」，内容领域 1。\n\n**其他选项为什么错：**\n- A：给套件打安全补丁。从机房到应用的补丁全归服务商，租户不碰。\n- C：扩容应对使用高峰。容量伸缩由服务商运营侧处理，不劳租户动手。\n- D：维护套件的运行环境。运行环境在 SaaS 的责任线里全归服务商。\n\n**关键概念：** SaaS 你只管数据与使用配置，其余全在服务商侧。本题对应考纲 1.3.3。","s":"自编·1.3.3"},{"id":"D1-027","d":1,"t":"single","q":"公司盘点负载：老 ERP 要系统级控制、新报表门户只想写代码、邮件办公用现成成品。按给每个负载选够用的最低层原则，合适的组合是","o":[{"l":"A","t":"ERP 用 IaaS、门户用 PaaS、办公用 SaaS"},{"l":"B","t":"全部上 IaaS 统一自管"},{"l":"C","t":"全部上 SaaS 简化管理"},{"l":"D","t":"全部用 PaaS 折中处理"}],"a":["A"],"e":"**正确答案：A。** ERP 用 IaaS、门户用 PaaS、办公用 SaaS。\n\n**为什么对：** 三层的差别是你租到哪一层，不是优劣；按够用的最低层配：要控系统选 IaaS，只写代码选 PaaS，用成品选 SaaS，组合下来省钱也好管。关联考点：官方技能点 1.3.4「辨认各云服务类型的适用场景」，内容领域 1。\n\n**其他选项为什么错：**\n- B：全部上 IaaS 统一自管。把所有运维都留给自己，门户与办公多付管理成本。\n- C：全部上 SaaS 简化管理。深度定制与系统级控制塞不进成品边界，硬套是倒退。\n- D：全部用 PaaS 折中处理。ERP 的系统级控制与办公的现成需求都配不准。\n\n**关键概念：** 三层并存是常态，每个负载选够用的最低层。本题对应考纲 1.3.4。","s":"自编·1.3.4"},{"id":"D1-028","d":1,"t":"single","q":"评审会上有人说「三层服务类型代表先进程度，应该尽快把所有系统都迁到 SaaS」。这一说法错在哪里","o":[{"l":"A","t":"SaaS 不适合任何企业使用"},{"l":"B","t":"应该全部迁到 IaaS 才稳妥"},{"l":"C","t":"三层迟早会合并成一层"},{"l":"D","t":"三层的差别是你租到哪一层，不是先进程度"}],"a":["D"],"e":"**正确答案：D。** 三层的差别是你租到哪一层，不是先进程度。\n\n**为什么对：** 三层的差别是责任线的位置：IaaS 管得多、SaaS 管得少，各有适用面；为显得现代把可控需求硬塞进 SaaS 是倒退，按需求选层才对。关联考点：官方技能点 1.3.4「辨认各云服务类型的适用场景」，内容领域 1。\n\n**其他选项为什么错：**\n- A：SaaS 不适合任何企业使用。标准化办公场景 SaaS 恰是首选，这个说法过头了。\n- B：应该全部迁到 IaaS 才稳妥。把所有运维留给自己，方向同样不对。\n- C：三层迟早会合并成一层。三层对应不同控制需求，会长期并存。\n\n**关键概念：** 三层无优劣，控制需求决定选层，别为赶时髦硬迁。本题对应考纲 1.3.4。","s":"自编·1.3.4"},{"id":"D2-001","d":2,"t":"single","q":"一家医疗器械公司要求影像数据必须存放在中国境内，并由本地持牌运营商独立运营。这类区域属于哪一类","o":[{"l":"A","t":"区域对，它保证两个区域互为灾备备份"},{"l":"B","t":"可用性区域，它在一个区域内做物理隔离"},{"l":"C","t":"主权区域，例如由世纪互联运营的 Azure 中国区"},{"l":"D","t":"地理区域，它按大洲把区域分堆"}],"a":["C"],"e":"**正确答案：C。** 主权区域，例如由世纪互联运营的 Azure 中国区。\n\n**为什么对：** 主权区域为特殊监管需求单独运营，Azure Government 与世纪互联运营的 Azure 中国区是两个典型例子。关联考点：官方技能点 2.1.1「描述 Azure 区域、区域对和主权区域」，内容领域 2。\n\n**其他选项为什么错：**\n- A：区域对，它保证两个区域互为灾备备份。区域对讲的是灾备搭档关系，不解决数据由谁运营这一监管问题。\n- B：可用性区域，它在一个区域内做物理隔离。可用性区域解决的是机房级故障隔离，与数据主权归属无关。\n- D：地理区域，它按大洲把区域分堆。地理区域只是分组边界，具体落点与运营方仍要看区域本身。\n\n**关键概念：** 主权区域回答谁运营、受哪套监管，区域对和可用性区域回答的是抗故障。本题对应考纲 2.1.1。","s":"自编·2.1.1"},{"id":"D2-002","d":2,"t":"multiple","q":"关于区域对的实际行为，下列说法哪些正确","o":[{"l":"A","t":"配对关系需要你手工在两个区域之间配置"},{"l":"B","t":"同一地理区域内任意两个区域都互为配对"},{"l":"C","t":"配对的两个区域错开时间做计划维护"},{"l":"D","t":"区域对会自动把资源跨区复制一份"},{"l":"E","t":"多数配对区域相距较远，至少三百英里"},{"l":"F","t":"主权区域也按常规规则参与区域对"}],"a":["C","E"],"e":"**正确答案：C、E。** 配对的两个区域错开时间做计划维护；多数配对区域相距较远，至少三百英里。\n\n**为什么对：** 区域对的价值是错峰维护与地理拉开距离，它给的是灾备基础关系，不等于替你复制数据。关联考点：官方技能点 2.1.1「描述 Azure 区域、区域对和主权区域」，内容领域 2。\n\n**其他选项为什么错：**\n- A：配对关系需要你手工在两个区域之间配置。配对由平台预先指定，不需要手工配置。\n- B：同一地理区域内任意两个区域都互为配对。配对是官方指定的成对关系，不是区域内自由组合。\n- D：区域对会自动把资源跨区复制一份。平台只给配对关系与错峰维护，复制靠服务自身冗余。\n- F：主权区域也按常规规则参与区域对。主权区域单独运营、受另一套合规约束。\n\n**关键概念：** 维护错峰、距离够远；复制仍靠服务自身的冗余能力。本题对应考纲 2.1.1。","s":"自编·2.1.1"},{"id":"D2-003","d":2,"t":"single","q":"某区域内的一个数据中心因供电故障整体断电，业务要求同城其余机房继续提供服务。应依靠哪种机制","o":[{"l":"A","t":"把承担同一角色的虚拟机分散到同一区域内的多个可用性区域"},{"l":"B","t":"把副本放到另一个配对的区域去"},{"l":"C","t":"在同一个可用性区域内多开几台虚拟机"},{"l":"D","t":"给这些资源加一条删除锁防误删"}],"a":["A"],"e":"**正确答案：A。** 把承担同一角色的虚拟机分散到同一区域内的多个可用性区域。\n\n**为什么对：** 可用性区域是区域内部物理隔离的数据中心群，各有独立供电与制冷；同一角色分散到不同区，一处故障时其余继续接流量。关联考点：官方技能点 2.1.2「描述可用性区域」，内容领域 2。\n\n**其他选项为什么错：**\n- B：把副本放到另一个配对的区域去。区域对兜的是整个区域级故障，用在机房级故障上属于层次用错。\n- C：在同一个可用性区域内多开几台虚拟机。同一可用性区域内共享供电与制冷，一处故障仍会一起受影响。\n- D：给这些资源加一条删除锁防误删。资源锁防的是误操作，与物理故障时的持续可用无关。\n\n**关键概念：** 机房级故障找可用性区域，区域级故障找区域对，两层各管各的。本题对应考纲 2.1.2。","s":"自编·2.1.2"},{"id":"D2-004","d":2,"t":"single","q":"管理员希望平台自动把数据分散到多个可用性区域，不必逐台指定落在哪个区。这类服务叫什么","o":[{"l":"A","t":"区级服务"},{"l":"B","t":"主权区域服务"},{"l":"C","t":"本地冗余服务"},{"l":"D","t":"区域级冗余服务"}],"a":["D"],"e":"**正确答案：D。** 区域级冗余服务。\n\n**为什么对：** 官方按使用区域的方式把服务分成两类：区级服务由你指定落区，区域级冗余服务由平台自动跨区分散。关联考点：官方技能点 2.1.2「描述可用性区域」，内容领域 2。\n\n**其他选项为什么错：**\n- A：区级服务。区级服务恰恰要你主动指定资源落在哪个可用性区域，方向相反。\n- B：主权区域服务。主权区域讲运营与合规归属，不描述区内的分散方式。\n- C：本地冗余服务。本地冗余在同一设施内复制多份，抗不住整处机房故障。\n\n**关键概念：** 区级等于你指定落点，区域级冗余等于平台自动分散，差别在使用方式。本题对应考纲 2.1.2。","s":"自编·2.1.2"},{"id":"D2-005","d":2,"t":"single","q":"关于数据中心、可用性区域与区域的包含关系，下列说法正确的是","o":[{"l":"A","t":"一个区域就是一个数据中心，只是叫法不同"},{"l":"B","t":"一个可用性区域最多只含一个数据中心"},{"l":"C","t":"一个可用性区域可含多个数据中心，区域由一个或多个可用性区域组成"},{"l":"D","t":"数据中心由多个区域组成，跨区域共用供电"}],"a":["C"],"e":"**正确答案：C。** 一个可用性区域可含多个数据中心，区域由一个或多个可用性区域组成。\n\n**为什么对：** 从物理结构看三层从小到大，数据中心小于可用性区域，可用性区域又小于区域，每层都包含一个或多个下层。关联考点：官方技能点 2.1.3「描述 Azure 数据中心」，内容领域 2。\n\n**其他选项为什么错：**\n- A：一个区域就是一个数据中心，只是叫法不同。区域比数据中心大两级，中间还隔着可用性区域。\n- B：一个可用性区域最多只含一个数据中心。官方口径是一个或多个，把最少说成最多属于收窄。\n- D：数据中心由多个区域组成，跨区域共用供电。包含方向说反了，数据中心是最小的物理单元。\n\n**关键概念：** 记牢从小到大三层，判断题里见到区域等于一个机房直接判错。本题对应考纲 2.1.3。","s":"自编·2.1.3"},{"id":"D2-006","d":2,"t":"single","q":"临时演示环境用完要一次清理干净，且不留继续计费的孤儿资源。最合适的做法是","o":[{"l":"A","t":"给每个资源加删除锁再逐个手工删"},{"l":"B","t":"把演示资源全部放进同一资源组，结束后删除该资源组"},{"l":"C","t":"把资源同时归入两个资源组，两边都能看到"},{"l":"D","t":"停用这些资源所在的订阅"}],"a":["B"],"e":"**正确答案：B。** 把演示资源全部放进同一资源组，结束后删除该资源组。\n\n**为什么对：** 资源组是装资源的逻辑容器，权限、策略与标签可在组上统一生效；删组会连同组内资源一起删除，正好对应一次清干净。关联考点：官方技能点 2.1.4「描述 Azure 资源与资源组」，内容领域 2。\n\n**其他选项为什么错：**\n- A：给每个资源加删除锁再逐个手工删。锁只是防误删的保险，逐个删除既慢又容易漏。\n- C：把资源同时归入两个资源组，两边都能看到。每个资源只能属于一个资源组，多重归属在 Azure 里不成立。\n- D：停用这些资源所在的订阅。停订阅会波及该订阅下所有业务，代价远大于删一个资源组。\n\n**关键概念：** 一起建、一起删、一起管的资源放同一组，跨项目共用的资源单独成组。本题对应考纲 2.1.4。","s":"自编·2.1.4"},{"id":"D2-007","d":2,"t":"single","q":"财务要求市场部与技术部的云费用分开出账，两边的资源也要互不干扰。最直接的做法是","o":[{"l":"A","t":"为两个部门各开一个订阅，资源组挂在各自订阅下"},{"l":"B","t":"在同一订阅里用标签区分部门，月底按标签拆账"},{"l":"C","t":"为每个部门建管理组，把资源直接放在管理组下"},{"l":"D","t":"为每个部门各建一个资源组，靠资源组做隔离"}],"a":["A"],"e":"**正确答案：A。** 为两个部门各开一个订阅，资源组挂在各自订阅下。\n\n**为什么对：** 订阅是计费与管理的基本单元，Azure 按订阅出账单、按订阅划边界；既要独立结算又要互不牵连，开两个订阅最直接。关联考点：官方技能点 2.1.5「描述订阅」，内容领域 2。\n\n**其他选项为什么错：**\n- B：在同一订阅里用标签区分部门，月底按标签拆账。标签能辅助分摊，但账单本身仍是一份，管理边界也没分开。\n- C：为每个部门建管理组，把资源直接放在管理组下。资源不能直接挂在管理组下，管理组装的是订阅。\n- D：为每个部门各建一个资源组，靠资源组做隔离。资源组能做权限隔离，但不产生独立账单，计费边界仍在订阅。\n\n**关键概念：** 订阅切计费与管理边界，本身不产生费用，费用跟着订阅下的资源走。本题对应考纲 2.1.5。","s":"自编·2.1.5"},{"id":"D2-008","d":2,"t":"single","q":"一家只有三个订阅、策略也只有一条的公司，要不要为每层组织结构再拆出更多订阅","o":[{"l":"A","t":"要拆，订阅越多层级越清晰，管理成本越低"},{"l":"B","t":"要拆，订阅数量直接决定可用性等级"},{"l":"C","t":"不拆，因为订阅本身要按月付费"},{"l":"D","t":"不必拆，订阅数量按是否需要独立计费或独立管理边界来定"}],"a":["D"],"e":"**正确答案：D。** 不必拆，订阅数量按是否需要独立计费或独立管理边界来定。\n\n**为什么对：** 订阅的价值在切分计费与管理边界，三五个订阅配一条策略时直接在订阅层配更省事，组织清晰不靠多开订阅体现。关联考点：官方技能点 2.1.5「描述订阅」，内容领域 2。\n\n**其他选项为什么错：**\n- A：要拆，订阅越多层级越清晰，管理成本越低。每多一个订阅就多一套权限与策略要维护，成本是上升的。\n- B：要拆，订阅数量直接决定可用性等级。可用性由区域与可用性区域决定，与订阅数量无关。\n- C：不拆，因为订阅本身要按月付费。订阅本身不产生费用，这个理由不成立；真正的理由是管理成本。\n\n**关键概念：** 用两个问题决定开不开订阅：是否要独立结算，是否要独立管理边界。本题对应考纲 2.1.5。","s":"自编·2.1.5"},{"id":"D2-009","d":2,"t":"single","q":"公司有三十个订阅，安全团队要求所有订阅都禁止在特定区域创建资源，新订阅也要自动受约束。策略应挂在哪一层","o":[{"l":"A","t":"在每个订阅上分别挂同一条策略"},{"l":"B","t":"在每个资源组上挂策略，颗粒度更细更安全"},{"l":"C","t":"挂在覆盖这些订阅的管理组上，新订阅加入后自动继承"},{"l":"D","t":"在管理组树里随便挑一层挂上即可"}],"a":["C"],"e":"**正确答案：C。** 挂在覆盖这些订阅的管理组上，新订阅加入后自动继承。\n\n**为什么对：** 管理组是装订阅的容器，策略与角色在组上一次下发，其下订阅全部继承，新订阅挂进这棵树就自动带上规则。关联考点：官方技能点 2.1.6「描述管理组」，内容领域 2。\n\n**其他选项为什么错：**\n- A：在每个订阅上分别挂同一条策略。三十个订阅逐条维护，新订阅容易漏配，正是管理组要解决的问题。\n- B：在每个资源组上挂策略，颗粒度更细更安全。资源组数量远多于订阅，规则散落一地，维护量反而更大。\n- D：在管理组树里随便挑一层挂上即可。继承只向下生效，挂错分支就覆盖不到其余业务线的订阅。\n\n**关键概念：** 治理收口用管理组，继承方向固定自上而下，下层不能反向改上层。本题对应考纲 2.1.6。","s":"自编·2.1.6"},{"id":"D2-010","d":2,"t":"single","q":"一名员工说自己没申请过权限，却能列出部门订阅里的全部资源。按层级排查应先看哪一层","o":[{"l":"A","t":"先看资源本身是否被单独授予读取角色"},{"l":"B","t":"先看该订阅所在的管理组是否授予了广泛的读取权限"},{"l":"C","t":"先看资源组上是否打了允许访问的标签"},{"l":"D","t":"先看该订阅是否设置了只读锁"}],"a":["B"],"e":"**正确答案：B。** 先看该订阅所在的管理组是否授予了广泛的读取权限。\n\n**为什么对：** 权限沿层级自上而下继承，顺序是管理组、订阅、资源组、资源；多数多出来的权限来自上层继承，所以从上层查最快。关联考点：官方技能点 2.1.7「描述资源组、订阅与管理组的层级」，内容领域 2。\n\n**其他选项为什么错：**\n- A：先看资源本身是否被单独授予读取角色。资源层直授影响面最小，通常不是大面积可见的来源。\n- C：先看资源组上是否打了允许访问的标签。标签用于组织与计费，不参与访问控制判定。\n- D：先看该订阅是否设置了只读锁。资源锁限制写操作，不授予读取权限，也不是权限来源。\n\n**关键概念：** 层级就是排查地图，越通用的规则越往上放，查权限先查上层继承。本题对应考纲 2.1.7。","s":"自编·2.1.7"},{"id":"D2-011","d":2,"t":"single","q":"团队给三个负载选计算形态：老 ERP 整体搬上云、订单服务拆成了八个微服务、上传图片自动生成缩略图。最合适的组合是","o":[{"l":"A","t":"ERP 用虚拟机、微服务用容器、缩略图用函数"},{"l":"B","t":"三个负载全部用虚拟机承载"},{"l":"C","t":"三个负载全部塞进函数运行"},{"l":"D","t":"微服务与缩略图都用虚拟机、ERP 用容器"}],"a":["A"],"e":"**正确答案：A。** ERP 用虚拟机、微服务用容器、缩略图用函数。\n\n**为什么对：** 三形态是一条控制力递减的滑杆：虚机控制力最强适合原样迁移，容器应用级打包适合小服务并行，函数按事件执行适合短小逻辑，三个负载各对上一档。关联考点：官方技能点 2.2.1「比较计算类型：容器、虚拟机和函数」，内容领域 2。\n\n**其他选项为什么错：**\n- B：三个负载全部用虚拟机承载。微服务与缩略图要的是轻量快启动，全用虚机运维负担最重。\n- C：三个负载全部塞进函数运行。长驻的老系统与执行模型不合拍，函数只适合短小逻辑。\n- D：微服务与缩略图都用虚拟机、ERP 用容器。方向说反了，ERP 恰恰最需要虚机的系统级承载。\n\n**关键概念：** 控制力虚机最强、函数最省心，按负载特征沿滑杆选形态。本题对应考纲 2.2.1。","s":"自编·2.2.1"},{"id":"D2-012","d":2,"t":"single","q":"运维新人问「容器和函数到底差在哪」。下列说法最准确的是","o":[{"l":"A","t":"容器也要自己给宿主操作系统打补丁"},{"l":"B","t":"函数按运行时长收固定月费"},{"l":"C","t":"容器只适合跑数据库这类有状态服务"},{"l":"D","t":"容器打包应用与依赖共用宿主系统，函数只写响应事件的代码"}],"a":["D"],"e":"**正确答案：D。** 容器打包应用与依赖共用宿主系统，函数只写响应事件的代码。\n\n**为什么对：** 容器把应用和依赖打包成轻量单元，秒级启动适合微服务；函数更进一步，服务器分配与扩缩全由平台代管，两者差在打包粒度与代管深度。关联考点：官方技能点 2.2.1「比较计算类型：容器、虚拟机和函数」，内容领域 2。\n\n**其他选项为什么错：**\n- A：容器也要自己给宿主操作系统打补丁。宿主系统维护归平台，容器里你只管应用本身。\n- B：函数按运行时长收固定月费。函数按实际执行计费，没执行就不计费。\n- C：容器只适合跑数据库这类有状态服务。容器适合拆成小服务并行跑的场景，不限有状态。\n\n**关键概念：** 容器管打包、函数管事件，代管深度函数更深一层。本题对应考纲 2.2.1。","s":"自编·2.2.1"},{"id":"D2-013","d":2,"t":"single","q":"报表系统工作日凌晨几乎无人访问、月底高峰要撑住十倍负载，团队还担心打补丁时全组实例一起下线。应选哪种虚拟机方案","o":[{"l":"A","t":"只配可用性集，靠错开部署扛高峰"},{"l":"B","t":"只配规模集，规模集自带防同时下线"},{"l":"C","t":"规模集管自动加减台数，配合可用性集错开维护"},{"l":"D","t":"单台大规格虚拟机顶配扛住"}],"a":["C"],"e":"**正确答案：C。** 规模集管自动加减台数，配合可用性集错开维护。\n\n**为什么对：** 规模集解决数量不够，可用性集解决同时挂掉：负载波动交给规模集自动加减，维护错开交给可用性集的更新域与故障域，两个需求各有对应机制。关联考点：官方技能点 2.2.2「描述虚拟机选项：虚拟机、规模集、可用性集与 Azure 虚拟桌面」，内容领域 2。\n\n**其他选项为什么错：**\n- A：只配可用性集，靠错开部署扛高峰。可用性集管的是错开故障与维护，不管台数增减。\n- B：只配规模集，规模集自带防同时下线。规模集解决数量弹性，错开补丁窗口是可用性集的活。\n- D：单台大规格虚拟机顶配扛住。单台扛不住十倍波动，也无从错开维护窗口。\n\n**关键概念：** 规模集管数量、可用性集管错开，两个需求都得上两手。本题对应考纲 2.2.2。","s":"自编·2.2.2"},{"id":"D2-014","d":2,"t":"single","q":"创建一台虚拟机时，除虚拟机本体之外，下列哪组是必须配齐的配套资源","o":[{"l":"A","t":"只需要选一个操作系统映像"},{"l":"B","t":"映像、大小、虚拟网卡、磁盘与虚拟网络"},{"l":"C","t":"公共 IP 与负载均衡器是必备项"},{"l":"D","t":"配套资源都由平台免费自动提供"}],"a":["B"],"e":"**正确答案：B。** 映像、大小、虚拟网卡、磁盘与虚拟网络。\n\n**为什么对：** 一台虚拟机是一撮资源：映像定起点、大小定档位、网卡接网络、磁盘装系统与数据、虚拟网络划网段；每项都是独立资源并单独计费，删机不删盘就会继续扣费。关联考点：官方技能点 2.2.3「描述虚拟机所需的资源」，内容领域 2。\n\n**其他选项为什么错：**\n- A：只需要选一个操作系统映像。网卡接不进网络、没有磁盘装不了系统，光有映像跑不起来。\n- C：公共 IP 与负载均衡器是必备项。公共 IP 按需才配，负载均衡不是单台虚机的必备件。\n- D：配套资源都由平台免费自动提供。磁盘、公共 IP 都单独计费，每项都是独立资源。\n\n**关键概念：** 一台虚机是一撮资源，成本要按整套配套算。本题对应考纲 2.2.3。","s":"自编·2.2.3"},{"id":"D2-015","d":2,"t":"single","q":"官网与查询 API 都用主流框架写成，团队不想雇专人管服务器。最省事又够用的托管方式是","o":[{"l":"A","t":"应用服务的 Web 应用托管平台"},{"l":"B","t":"虚拟机自建，控制力最完整"},{"l":"C","t":"容器平台运行，运行时自定义"},{"l":"D","t":"函数计算逐请求执行"}],"a":["A"],"e":"**正确答案：A。** 应用服务的 Web 应用托管平台。\n\n**为什么对：** 越标准的 Web 应用越往平台上放：代码传上去即可运行，运行时、扩容、补丁全由平台管；只有需要系统级定制时才降级到容器或虚拟机。关联考点：官方技能点 2.2.4「描述应用托管选项：Web 应用、容器与虚拟机」，内容领域 2。\n\n**其他选项为什么错：**\n- B：虚拟机自建，控制力最完整。补丁、扩容、监控一整条运维线全留给自己，与诉求相反。\n- C：容器平台运行，运行时自定义。需要先做容器化改造，比现成托管平台多一道工序。\n- D：函数计算逐请求执行。官网这类常驻 Web 应用不适合逐事件的执行模型。\n\n**关键概念：** 标准应用上托管平台，越界需求才往底层放。本题对应考纲 2.2.4。","s":"自编·2.2.4"},{"id":"D2-016","d":2,"t":"single","q":"两个虚拟网络里的资源要互相访问，要求流量不走公共互联网。应选哪种连通方式","o":[{"l":"A","t":"VPN 网关，加密隧道连两端"},{"l":"B","t":"ExpressRoute 专线直连"},{"l":"C","t":"把两个网络都暴露公共终结点"},{"l":"D","t":"对等互连，连两个虚拟网络的私有通道"}],"a":["D"],"e":"**正确答案：D。** 对等互连，连两个虚拟网络的私有通道。\n\n**为什么对：** 对等互连就是为两个虚拟网络之间的私有互通准备的：连起来后两边资源互访走私有通道，不出公共互联网；专线与隧道管云地连通，各管各的。关联考点：官方技能点 2.2.5「描述虚拟网络」，内容领域 2。\n\n**其他选项为什么错：**\n- A：VPN 网关，加密隧道连两端。VPN 网关连的是本地机房与云上虚拟网络，不是两个云内网络。\n- B：ExpressRoute 专线直连。专线是云与本地的物理线路，云内两网用不着这么重。\n- C：把两个网络都暴露公共终结点。走公网违背私密互访的前提，暴露面也失控。\n\n**关键概念：** 云内两网互通用对等互连，云地连通才用网关或专线。本题对应考纲 2.2.5。","s":"自编·2.2.5"},{"id":"D2-017","d":2,"t":"single","q":"分支机房与云上虚拟网络互访：流量小、开通要快、成本要低。应选哪种连接","o":[{"l":"A","t":"ExpressRoute 专线，带宽更稳"},{"l":"B","t":"对等互连，云内私有通道"},{"l":"C","t":"VPN 网关，走公共互联网的加密隧道"},{"l":"D","t":"公共终结点直连，无需额外组件"}],"a":["C"],"e":"**正确答案：C。** VPN 网关，走公共互联网的加密隧道。\n\n**为什么对：** VPN 网关在公共互联网上架加密隧道：成本低、开通快，正好匹配流量小要得急的场景；专线留给大流量、低延迟、高合规的需求。关联考点：官方技能点 2.2.5「描述虚拟网络」，内容领域 2。\n\n**其他选项为什么错：**\n- A：ExpressRoute 专线，带宽更稳。专线费用高、开通周期长，小流量场景用不上它的优势。\n- B：对等互连，云内私有通道。对等互连连的是两个云上虚拟网络，管不到本地机房。\n- D：公共终结点直连，无需额外组件。裸走公网没有加密与隔离，不满足互访的安全要求。\n\n**关键概念：** 小流量快开通用 VPN 网关，大流量高合规上专线。本题对应考纲 2.2.5。","s":"自编·2.2.5"},{"id":"D2-018","d":2,"t":"single","q":"订单数据库只允许虚拟网络内部的应用访问，要求它在公网上「不存在」。应配哪种终结点","o":[{"l":"A","t":"公共终结点，靠防火墙规则挡外人"},{"l":"B","t":"专用终结点，给服务分配虚拟网络内的私有 IP"},{"l":"C","t":"两种终结点都配上，双保险"},{"l":"D","t":"不配终结点，数据库天然只在网内"}],"a":["B"],"e":"**正确答案：B。** 专用终结点，给服务分配虚拟网络内的私有 IP。\n\n**为什么对：** 专用终结点把服务入口做成虚拟网络内的私有 IP，流量根本不出私有网段，公共入口都可以关掉；数据库这类只对内的敏感服务，暴露面由此收到最小。关联考点：官方技能点 2.2.6「定义公共终结点与专用终结点」，内容领域 2。\n\n**其他选项为什么错：**\n- A：公共终结点，靠防火墙规则挡外人。入口仍在公网可达，攻击面比私有 IP 入口大得多。\n- C：两种终结点都配上，双保险。目标是公网不可达，再留公共入口与目标相悖。\n- D：不配终结点，数据库天然只在网内。不加私有入口，跨资源访问没有正式通路。\n\n**关键概念：** 对内敏感服务配专用终结点，公网上让它不存在。本题对应考纲 2.2.6。","s":"自编·2.2.6"},{"id":"D2-019","d":2,"t":"single","q":"客服系统四类数据上云：通话录音按月归档、工单流转消息排队、客户偏好标签快速读写、旧文件服务器共享目录原样搬。依次应选","o":[{"l":"A","t":"Blob 存储、队列存储、表存储、Azure 文件"},{"l":"B","t":"全部放 Blob 存储，形态通用"},{"l":"C","t":"消息用表存储、标签用队列存储"},{"l":"D","t":"录音放表存储、归档用托管磁盘"}],"a":["A"],"e":"**正确答案：A。** Blob 存储、队列存储、表存储、Azure 文件。\n\n**为什么对：** 按形态选服务：一整个文件归 Blob，组件传话排队归队列，按键快速查的半结构化数据归表，多机共享目录归文件服务，四类数据各对一格。关联考点：官方技能点 2.3.1「比较 Azure 存储服务」，内容领域 2。\n\n**其他选项为什么错：**\n- B：全部放 Blob 存储，形态通用。队列没有排队语义、文件没有共享语义，Blob 装不下这些用法。\n- C：消息用表存储、标签用队列存储。两个正好对调了，排队的是消息、按键查的是标签。\n- D：录音放表存储、归档用托管磁盘。录音是一整个文件形态归 Blob；磁盘是虚机专用。\n\n**关键概念：** 按数据形态选服务：文件、消息、键值、共享各有其主。本题对应考纲 2.3.1。","s":"自编·2.3.1"},{"id":"D2-020","d":2,"t":"single","q":"多台机器要同时挂载同一个共享目录，像用传统文件服务器一样。应选哪个存储服务","o":[{"l":"A","t":"Blob 存储，建容器装目录也能共享"},{"l":"B","t":"队列存储，按需分发到各机器"},{"l":"C","t":"表存储，把目录结构存成键值"},{"l":"D","t":"Azure 文件，走标准文件协议的云共享"}],"a":["D"],"e":"**正确答案：D。** Azure 文件，走标准文件协议的云共享。\n\n**为什么对：** Azure 文件走 SMB 这类标准文件协议，多台机器可同时挂载同一个共享目录，正对应传统文件服务器的用法；Blob 装的是一整个文件形态，没有挂载共享的语义。关联考点：官方技能点 2.3.1「比较 Azure 存储服务」，内容领域 2。\n\n**其他选项为什么错：**\n- A：Blob 存储，建容器装目录也能共享。Blob 没有共享语义，模拟不了多机挂载同一个目录。\n- B：队列存储，按需分发到各机器。队列是消息排队，不是文件共享通道。\n- C：表存储，把目录结构存成键值。键值表查数据可以，挂载成共享目录做不到。\n\n**关键概念：** 多机共享目录用文件服务，Blob 管一整个文件。本题对应考纲 2.3.1。","s":"自编·2.3.1"},{"id":"D2-021","d":2,"t":"single","q":"质检影像每天新增上万张，当月要随时调阅；五年前的老影像只应付审计，几乎无人访问。两类影像分别放哪层","o":[{"l":"A","t":"新影像冷层、老影像存档层"},{"l":"B","t":"新影像热层、老影像低温层"},{"l":"C","t":"新影像热层、老影像存档层"},{"l":"D","t":"全部热层，取阅方便图省事"}],"a":["C"],"e":"**正确答案：C。** 新影像热层、老影像存档层。\n\n**为什么对：** 热层为频繁访问优化，存储单价最高访问最便宜；存档层为极少访问优化，存储最便宜但读取前要先解冻；两类影像的访问频率正好各对一层。关联考点：官方技能点 2.3.2「描述存储层级」，内容领域 2。\n\n**其他选项为什么错：**\n- A：新影像冷层、老影像存档层。当月要随时调阅，冷层访问单价更高不划算。\n- B：新影像热层、老影像低温层。审计影像几乎不访问，存档层存储单价最低更省。\n- D：全部热层，取阅方便图省事。老影像占大头还放最贵的存储层，账单会失控。\n\n**关键概念：** 频繁访问放热层，几乎不碰的归档省存储费。本题对应考纲 2.3.2。","s":"自编·2.3.2"},{"id":"D2-022","d":2,"t":"single","q":"团队把「每月偶尔要恢复一次」的备份数据放进了存档层，结果一次紧急恢复等了很久。问题出在哪","o":[{"l":"A","t":"存档层数据已被自动删除"},{"l":"B","t":"存档层读取前要先解除冻结，最长可到 15 小时"},{"l":"C","t":"存档层不支持读取操作"},{"l":"D","t":"解冻由生命周期策略自动完成"}],"a":["B"],"e":"**正确答案：B。** 存档层读取前要先解除冻结，最长可到 15 小时。\n\n**为什么对：** 存档层是离线层：存储单价最低，但读取前要先解除冻结，最长可到 15 小时，取回费用也最高；偶尔要用的备份进存档业务等不起，应放冷或低温层。关联考点：官方技能点 2.3.2「描述存储层级」，内容领域 2。\n\n**其他选项为什么错：**\n- A：存档层数据已被自动删除。存档层照常保存数据，问题是取回前要先解冻。\n- C：存档层不支持读取操作。支持读，只是要先解冻且取回费用最高。\n- D：解冻由生命周期策略自动完成。官方口径里存档层不能用策略自动解冻，要单独发起。\n\n**关键概念：** 存档层放着便宜动起来贵，偶尔要用的数据别进存档。本题对应考纲 2.3.2。","s":"自编·2.3.2"},{"id":"D2-023","d":2,"t":"multiple","q":"订单库的冗余方案讨论会上，下列说法哪些正确","o":[{"l":"A","t":"GRS 平时就能读写配对区域的副本"},{"l":"B","t":"LRS 能防住整个区域级的灾难"},{"l":"C","t":"ZRS 在主区域的三个以上可用区间同步复制"},{"l":"D","t":"ZRS 的防护等级高于 GRS"},{"l":"E","t":"存档层的 blob 支持全部六种冗余"},{"l":"F","t":"RA 变体平时就可以读次区域那份副本"}],"a":["C","F"],"e":"**正确答案：C、F。** ZRS 在主区域的三个以上可用区间同步复制；RA 变体平时就可以读次区域那份副本。\n\n**为什么对：** ZRS 把副本同步铺到主区域多个可用区，一个区挂了数据照样可读可写；RA 变体在地理复制之上加平时可读的次区域副本，两句分别对上区内高可用与就近读。关联考点：官方技能点 2.3.3「描述冗余选项」，内容领域 2。\n\n**其他选项为什么错：**\n- A：GRS 平时就能读写配对区域的副本。默认次区域那份不可读不可写，要平时读选 RA 变体。\n- B：LRS 能防住整个区域级的灾难。LRS 只在一个物理数据中心内留副本，防的是单机房级故障。\n- D：ZRS 的防护等级高于 GRS。一个防可用区故障、一个防区域灾难，维度不同不能直接比高低。\n- E：存档层的 blob 支持全部六种冗余。官方边界：存档层不支持 ZRS、GZRS、RA-GZRS。\n\n**关键概念：** 防可用区故障选 ZRS，要平时读副本选 RA 变体。本题对应考纲 2.3.3。","s":"自编·2.3.3"},{"id":"D2-024","d":2,"t":"single","q":"门店交易流水丢了可以重传、预算最紧；订单库要求一个可用区停电也不能停服。两者分别选哪档冗余","o":[{"l":"A","t":"流水用 ZRS、订单库用 LRS"},{"l":"B","t":"两者都用 GRS 防区域灾难"},{"l":"C","t":"两者都用 RA-GRS 拿读副本"},{"l":"D","t":"流水用本地冗余存储（LRS）、订单库用区域冗余存储（ZRS）"}],"a":["D"],"e":"**正确答案：D。** 流水用本地冗余存储（LRS）、订单库用区域冗余存储（ZRS）。\n\n**为什么对：** LRS 只在一个物理数据中心内留副本，最便宜，配得上丢了能重传的数据；ZRS 在主区域多个可用区间同步复制，一个区停电数据照样读写，正对订单库要求。关联考点：官方技能点 2.3.3「描述冗余选项」，内容领域 2。\n\n**其他选项为什么错：**\n- A：流水用 ZRS、订单库用 LRS。两个对调了，要防可用区故障的是订单库。\n- B：两者都用 GRS 防区域灾难。需求里没有区域级容灾这一条，GRS 多花钱没对上。\n- C：两者都用 RA-GRS 拿读副本。需求里没有平时读副本这一条，高档位白花钱。\n\n**关键概念：** 丢了能重建用 LRS 省钱，可用区不能停服用 ZRS。本题对应考纲 2.3.3。","s":"自编·2.3.3"},{"id":"D2-025","d":2,"t":"single","q":"新应用要建存储账户：图片资料按冷热分层管成本，视频转码的临时中间文件要吃 SSD 吞吐。最合适的建法是","o":[{"l":"A","t":"全部塞进一个高级账户"},{"l":"B","t":"全部用通用 v2 标准账户"},{"l":"C","t":"一个通用 v2 标准账户放图片、一个高级块 blob 账户放中间文件"},{"l":"D","t":"沿用旧型 BlobStorage 账户省钱"}],"a":["C"],"e":"**正确答案：C。** 一个通用 v2 标准账户放图片、一个高级块 blob 账户放中间文件。\n\n**为什么对：** 两本账各算各的：图片要分层省钱走通用 v2 标准档，中间文件要吞吐走高级块 blob 的 SSD；高级档不玩分层、标准档不吃 SSD，一个账户配不齐两种诉求。关联考点：官方技能点 2.3.4「描述存储账户选项和存储类型」，内容领域 2。\n\n**其他选项为什么错：**\n- A：全部塞进一个高级账户。高级档不支持冷热分层定价，图片的成本管理就没了。\n- B：全部用通用 v2 标准账户。标准档吃不到 SSD 的低延迟高吞吐，转码中间文件会慢。\n- D：沿用旧型 BlobStorage 账户省钱。旧型是遗留类型，官方不建议新用。\n\n**关键概念：** 标准档玩分层、高级档吃 SSD，两种诉求分两个账户。本题对应考纲 2.3.4。","s":"自编·2.3.4"},{"id":"D2-026","d":2,"t":"single","q":"2 TB 设计稿要夜里自动批量灌进存储账户，后续还要写进每周定期任务。应选哪个工具","o":[{"l":"A","t":"存储资源管理器，图形界面点选上传"},{"l":"B","t":"AzCopy，免安装的命令行搬运工具"},{"l":"C","t":"文件同步，本地云端持续同步"},{"l":"D","t":"门户里手动逐个上传"}],"a":["B"],"e":"**正确答案：B。** AzCopy，免安装的命令行搬运工具。\n\n**为什么对：** AzCopy 的官方定位就是命令行搬运：免安装下载即用，大批量、可重复、可编进脚本；夜里的全量灌入加每周定期任务正是它的甜点区。关联考点：官方技能点 2.3.5「识别移动文件的选项」，内容领域 2。\n\n**其他选项为什么错：**\n- A：存储资源管理器，图形界面点选上传。人点鼠标不可复现，干不了定时自动化。\n- C：文件同步，本地云端持续同步。它要长期驻留一个同步服务，不适合批量灌入。\n- D：门户里手动逐个上传。两 TB 逐个点上传既慢又不可复现。\n\n**关键概念：** 脚本化批量搬运用 AzCopy，图形操作留给偶发的人工活。本题对应考纲 2.3.5。","s":"自编·2.3.5"},{"id":"D2-027","d":2,"t":"single","q":"数据中心整体上云：先评估两百台服务器哪些适合迁、上去配什么规格，几十 TB 历史影像又没有专线可走。合适的组合是","o":[{"l":"A","t":"Azure Migrate 做评估、Data Box 运历史数据"},{"l":"B","t":"Migrate 顺便把历史数据也灌进来"},{"l":"C","t":"全部数据走 AzCopy 在线传"},{"l":"D","t":"Data Box 负责评估服务器规格"}],"a":["A"],"e":"**正确答案：A。** Azure Migrate 做评估、Data Box 运历史数据。\n\n**为什么对：** Migrate 出评估报告分出直接迁与先改造两栏；几十 TB 历史数据走 Data Box 物理寄送；割接当晚的增量再用 AzCopy 在线补齐，三件事三个工具各不越界。关联考点：官方技能点 2.3.6「描述迁移选项」，内容领域 2。\n\n**其他选项为什么错：**\n- B：Migrate 顺便把历史数据也灌进来。Migrate 管评估与服务器迁移，不管海量原始数据的灌入。\n- C：全部数据走 AzCopy 在线传。几十 TB 又没有专线，线上传输不现实。\n- D：Data Box 负责评估服务器规格。Data Box 是数据搬运的物理通道，不做评估。\n\n**关键概念：** 评估找 Migrate，海量数据走 Data Box，增量用 AzCopy 补齐。本题对应考纲 2.3.6。","s":"自编·2.3.6"},{"id":"D2-028","d":2,"t":"single","q":"老 ERP 客户端只认 Windows 域账户与组策略，要搬上云，团队又不想自己维护域控制器。应配哪个服务","o":[{"l":"A","t":"Microsoft Entra ID 直接对接"},{"l":"B","t":"给每个员工在云上重建一套域账号"},{"l":"C","t":"用无密码验证替换域验证"},{"l":"D","t":"Microsoft Entra 域服务的托管域"}],"a":["D"],"e":"**正确答案：D。** Microsoft Entra 域服务的托管域。\n\n**为什么对：** 域服务提供经典 Windows 域的零件：域加入、组策略、LDAP、Kerberos，让只认老域的应用照常跑，域控制器由平台托管；Entra ID 管新式登录，两者是分工不是替代。关联考点：官方技能点 2.4.1「描述 Azure 中的目录服务」，内容领域 2。\n\n**其他选项为什么错：**\n- A：Microsoft Entra ID 直接对接。Entra ID 是新式身份中枢，不带域加入与组策略那套老域零件。\n- B：给每个员工在云上重建一套域账号。要自己维护域控制器，与不想自管的诉求相反。\n- C：用无密码验证替换域验证。换登录方式解决不了应用只认域协议的问题。\n\n**关键概念：** 老应用认域用域服务，新式登录走 Entra ID，两个并存分工。本题对应考纲 2.4.1。","s":"自编·2.4.1"},{"id":"D2-029","d":2,"t":"single","q":"安全经理提议「登录时在密码之外再输一道 PIN，就算多要素验证了」。按官方口径这一组合为什么不算","o":[{"l":"A","t":"算的，两个凭证就是两个要素"},{"l":"B","t":"不算，因为 PIN 不能用于登录"},{"l":"C","t":"密码和 PIN 都属于你知道的，仍只是一类要素"},{"l":"D","t":"不算，因为密码将来会被淘汰"}],"a":["C"],"e":"**正确答案：C。** 密码和 PIN 都属于你知道的，仍只是一类要素。\n\n**为什么对：** 官方把要素分三类：你知道的、你拥有的、你本身的；密码和 PIN 都落在你知道的这格，两个同类仍算一类；密码加手机推送才是两类要素的合法组合。关联考点：官方技能点 2.4.2「描述 Azure 中的身份验证方法」，内容领域 2。\n\n**其他选项为什么错：**\n- A：算的，两个凭证就是两个要素。多要素看的是要素类别不同，不是凭证个数多少。\n- B：不算，因为 PIN 不能用于登录。PIN 能不能登录不是判定线，判定线是要素的类别。\n- D：不算，因为密码将来会被淘汰。密码淘汰是趋势判断，与多要素的判定无关。\n\n**关键概念：** 多要素看类别不看个数，密码加推送才是两类。本题对应考纲 2.4.2。","s":"自编·2.4.2"},{"id":"D2-030","d":2,"t":"single","q":"外部审计师要只读查阅三个月的报表，不该为他建内部账号。最合适的机制是","o":[{"l":"A","t":"建内部账号再把密码发给他"},{"l":"B","t":"发 B2B 邀请，对方用自己的工作账号接受"},{"l":"C","t":"把报表导出后邮件发送"},{"l":"D","t":"给他开公共匿名访问链接"}],"a":["B"],"e":"**正确答案：B。** 发 B2B 邀请，对方用自己的工作账号接受。\n\n**为什么对：** B2B 协作让外部人用自己的身份进门：你的目录里出现一个访客对象，加组与授权和内部用户同一套管理；控制权始终在你这侧，合作期满随时移除。关联考点：官方技能点 2.4.3「描述 Azure 中的外部标识」，内容领域 2。\n\n**其他选项为什么错：**\n- A：建内部账号再把密码发给他。到期清不清、密码怎么传、审计谁担，全是坑。\n- C：把报表导出后邮件发送。脱离了权限体系的按需访问，也没有审计轨迹。\n- D：给他开公共匿名访问链接。任何拿到链接的人都能看，暴露面失控。\n\n**关键概念：** 外部人走 B2B 访客，用自己的账号进门，随时可移除。本题对应考纲 2.4.3。","s":"自编·2.4.3"},{"id":"D2-031","d":2,"t":"single","q":"公司定登录规则：位置在公司 IP 段直接放行，其他位置一律要求多要素验证。这套规则该用什么实现","o":[{"l":"A","t":"条件访问，按信号执行判定的策略"},{"l":"B","t":"给全员强制开启多要素验证"},{"l":"C","t":"用 RBAC 角色限制登录来源"},{"l":"D","t":"防火墙封禁外部 IP 段登录"}],"a":["A"],"e":"**正确答案：A。** 条件访问，按信号执行判定的策略。\n\n**为什么对：** 条件访问就是一组信号加判定的规则：位置是信号，放行与要求多要素是判定，这条策略正对内外不同门槛的需求；写策略记得把紧急账号放进排除项。关联考点：官方技能点 2.4.4「描述 Microsoft Entra 条件访问」，内容领域 2。\n\n**其他选项为什么错：**\n- B：给全员强制开启多要素验证。一刀切违背内外区别对待的设计，公司网内也被要求多验。\n- C：用 RBAC 角色限制登录来源。RBAC 管能对资源做什么，管不了登录时刻的放行。\n- D：防火墙封禁外部 IP 段登录。那是网络层手段，出差住酒店这类正常场景也会被挡在外面。\n\n**关键概念：** 条件访问是信号加判定，不同情境配不同门槛。本题对应考纲 2.4.4。","s":"自编·2.4.4"},{"id":"D2-032","d":2,"t":"multiple","q":"关于 Azure 基于角色的访问控制（RBAC），值班运维的授权讨论中哪些说法正确","o":[{"l":"A","t":"Contributor 可以把权限再分配给别人"},{"l":"B","t":"给新人直接上 Owner 最稳妥"},{"l":"C","t":"Contributor 能完全管理资源但不能分配角色"},{"l":"D","t":"权限只在授予的那一层生效，不向下继承"},{"l":"E","t":"在订阅层给某组读取者，其下全部资源都能读"},{"l":"F","t":"作用域必须精确到单个资源才有效"}],"a":["C","E"],"e":"**正确答案：C、E。** Contributor 能完全管理资源但不能分配角色；在订阅层给某组读取者，其下全部资源都能读。\n\n**为什么对：** Contributor 完全管理资源但不含分配角色，这是官方角色描述；权限沿作用域树向下继承，订阅层的读取者让其下全部资源可读。关联考点：官方技能点 2.4.5「描述 Azure 基于角色的访问控制（RBAC）」，内容领域 2。\n\n**其他选项为什么错：**\n- A：Contributor 可以把权限再分配给别人。官方角色描述明确不含分配角色，分权能力在 Owner 手里。\n- B：给新人直接上 Owner 最稳妥。违反最小特权，授权权交出去就说不清谁给过谁什么。\n- D：权限只在授予的那一层生效，不向下继承。继承沿作用域树向下生效，上层给了下层全部带上。\n- F：作用域必须精确到单个资源才有效。四层作用域都可以，从够用的最窄层起，默认资源组层。\n\n**关键概念：** Contributor 不分权，权限沿作用域向下继承，认最小特权。本题对应考纲 2.4.5。","s":"自编·2.4.5"},{"id":"D2-033","d":2,"t":"single","q":"值班运维要能重启虚拟机、调整配置，但明确不许他给别人分权限。应给哪个角色","o":[{"l":"A","t":"Owner，权限最全不会出错"},{"l":"B","t":"Reader，先给只读再观察"},{"l":"C","t":"Contributor，作用域给到够用的最窄层"},{"l":"D","t":"用户访问管理员，专管访问"}],"a":["C"],"e":"**正确答案：C。** Contributor，作用域给到够用的最窄层。\n\n**为什么对：** Contributor 的官方描述是完全管理资源但不能分配角色，正好命中操作要全、分权要禁的组合；作用域从够用的最窄层起给，默认资源组层，确需扩大再上提。关联考点：官方技能点 2.4.5「描述 Azure 基于角色的访问控制（RBAC）」，内容领域 2。\n\n**其他选项为什么错：**\n- A：Owner，权限最全不会出错。Owner 含把权限再分配给别人的能力，与禁分权的约束冲突。\n- B：Reader，先给只读再观察。只读满足不了重启与调整配置的操作需求。\n- D：用户访问管理员，专管访问。这个角色管的是别人的访问授权，不含资源操作本身。\n\n**关键概念：** 操作全但禁分权选 Contributor，作用域从最窄层起。本题对应考纲 2.4.5。","s":"自编·2.4.5"},{"id":"D2-034","d":2,"t":"single","q":"安全架构师宣布放弃「连上公司 VPN 就算可信」的老假设：每次访问都验证、只给刚好够用的权限、设计时假定攻击者已经进来。这套立场对应哪个理念","o":[{"l":"A","t":"纵深防御，多设几道独立的墙"},{"l":"B","t":"零信任，显式验证加最小特权加假定泄露"},{"l":"C","t":"共享责任模型，责任跟控制权走"},{"l":"D","t":"条件访问，按信号放行"}],"a":["B"],"e":"**正确答案：B。** 零信任，显式验证加最小特权加假定泄露。\n\n**为什么对：** 零信任反对进了内网就算自己人，官方三原则正是显式验证、最小特权、假定泄露；条件访问、角色控制、分段隔离分别是三条原则的落地零件。关联考点：官方技能点 2.4.6「描述零信任的概念」，内容领域 2。\n\n**其他选项为什么错：**\n- A：纵深防御，多设几道独立的墙。那是分层结构的设计，不是每次都验证的立场。\n- C：共享责任模型，责任跟控制权走。那是云上责任划分框架，与访问立场不是一回事。\n- D：条件访问，按信号放行。它只是显式验证的一条落地零件，盖不住整套立场。\n\n**关键概念：** 不再默认相信内网，三原则显式验证最小特权假定泄露。本题对应考纲 2.4.6。","s":"自编·2.4.6"},{"id":"D2-035","d":2,"t":"single","q":"新同事写了四条笔记总结零信任，只有一条没写错，是哪条","o":[{"l":"A","t":"零信任是一套设计立场，不是买某个产品就能落地"},{"l":"B","t":"防火墙内就是安全的，信任边界仍有效"},{"l":"C","t":"每个请求都要验证，太麻烦不现实"},{"l":"D","t":"零信任会取代纵深防御，两者只能选一套"}],"a":["A"],"e":"**正确答案：A。** 零信任是一套设计立场，不是买某个产品就能落地。\n\n**为什么对：** 零信任是设计立场不是货架上的商品，落地靠条件访问、角色控制、分段隔离这些零件组合；它与纵深防御不冲突，一个定立场一个定结构。关联考点：官方技能点 2.4.6「描述零信任的概念」，内容领域 2。\n\n**其他选项为什么错：**\n- B：防火墙内就是安全的，信任边界仍有效。这正是零信任反对的假设，边界内一样要验证。\n- C：每个请求都要验证，太麻烦不现实。显式验证正是零信任的要求，麻烦不是否定它的理由。\n- D：零信任会取代纵深防御，两者只能选一套。零信任定立场、纵深防御定结构，两套是配合使用。\n\n**关键概念：** 零信任是立场不是产品，与纵深防御配合不互斥。本题对应考纲 2.4.6。","s":"自编·2.4.6"},{"id":"D2-036","d":2,"t":"single","q":"钓鱼演练复盘：员工密码被钓走后，登录被多要素拦住；手机也被拿走后，高风险会话又被直接阻止；就算真进来了，数据仍加密并带审计告警。这套设计体现的是","o":[{"l":"A","t":"零信任的显式验证原则"},{"l":"B","t":"最小特权，只给够用的权限"},{"l":"C","t":"条件访问的联动策略"},{"l":"D","t":"纵深防御，层层独立设防各自兜底"}],"a":["D"],"e":"**正确答案：D。** 纵深防御，层层独立设防各自兜底。\n\n**为什么对：** 纵深防御是多重独立防线层层叠叠：一层被攻破其余仍在，攻击成本逐层抬升；密码、多要素、条件访问、加密四道墙各拦一类攻击，正是层层兜底的结构。关联考点：官方技能点 2.4.7「描述纵深防御模型的目的」，内容领域 2。\n\n**其他选项为什么错：**\n- A：零信任的显式验证原则。显式验证只是其中一层的机制，盖不住多层兜底的结构。\n- B：最小特权，只给够用的权限。权限收敛是好实践，但这段讲的是防线叠加。\n- C：条件访问的联动策略。它是其中一道墙的实现手段，不是整套设计理念。\n\n**关键概念：** 一层失守不是全线失守，每层独立设防各自兜底。本题对应考纲 2.4.7。","s":"自编·2.4.7"},{"id":"D2-037","d":2,"t":"single","q":"新任安全主管要一份「当前配置离最佳安全实践差多远」的清单加优先级，用来排整改顺序。应使用哪个服务","o":[{"l":"A","t":"Azure Monitor 的运行日志"},{"l":"B","t":"Azure Policy 的合规策略"},{"l":"C","t":"Microsoft Defender for Cloud 的态势评估"},{"l":"D","t":"条件访问的风险报告"}],"a":["C"],"e":"**正确答案：C。** Microsoft Defender for Cloud 的态势评估。\n\n**为什么对：** Defender for Cloud 两件事：给环境做安全态势评估，按最佳实践出建议清单并排优先级；同时做威胁检测告警。体检加清单正对主管需求，整改仍要由负责人确认后执行。关联考点：官方技能点 2.4.8「描述 Microsoft Defender for Cloud 的用途」，内容领域 2。\n\n**其他选项为什么错：**\n- A：Azure Monitor 的运行日志。它管性能指标与运行健康，不管安全姿态的差距。\n- B：Azure Policy 的合规策略。它执行规则约束，不出差距清单与优先级排序。\n- D：条件访问的风险报告。它管登录时刻的放行，与配置体检不在一个层面。\n\n**关键概念：** 安全体检与整改清单找 Defender for Cloud，它不替你改。本题对应考纲 2.4.8。","s":"自编·2.4.8"},{"id":"D2-038","d":2,"t":"single","q":"「若干虚拟机补丁滞后」「存储传输加密没开」这类配置差距被自动扫描并列出建议。这属于该服务的哪类能力","o":[{"l":"A","t":"威胁检测，发现进行中的攻击"},{"l":"B","t":"安全态势评估，给出差距清单与优先级"},{"l":"C","t":"自动整改，发现问题直接修复"},{"l":"D","t":"访问控制，拦截不合规的请求"}],"a":["B"],"e":"**正确答案：B。** 安全态势评估，给出差距清单与优先级。\n\n**为什么对：** 态势指当前配置离最佳实践差多远：它扫描订阅里的资源，按最佳实践出差距清单并排优先级，补丁与加密这类条目正来自这里；威胁检测是另一条线，管发生中的攻击告警。关联考点：官方技能点 2.4.8「描述 Microsoft Defender for Cloud 的用途」，内容领域 2。\n\n**其他选项为什么错：**\n- A：威胁检测，发现进行中的攻击。扫描配置差距是体检，不是抓正在发生的威胁。\n- C：自动整改，发现问题直接修复。它给建议不替你改，改不改由负责人确认。\n- D：访问控制，拦截不合规的请求。配置扫描与登录放行是两套机制。\n\n**关键概念：** 态势是差距清单，防护是威胁告警，两条线分开记。本题对应考纲 2.4.8。","s":"自编·2.4.8"},{"id":"D3-001","d":3,"t":"multiple","q":"月度账单复盘会上，下列关于成本因素的说法哪些正确","o":[{"l":"A","t":"数据进 Azure 的入站流量也按量收费"},{"l":"B","t":"数据出 Azure 才计费，进 Azure 的流量不计费"},{"l":"C","t":"出站流量费率可谈成包月封顶"},{"l":"D","t":"区域不影响单价，只影响延迟"},{"l":"E","t":"闲置资源停机后就不计费了"},{"l":"F","t":"忘关的测试虚机是闲置资源，会持续计费"}],"a":["B","F"],"e":"**正确答案：B、F。** 数据出 Azure 才计费，进 Azure 的流量不计费；忘关的测试虚机是闲置资源，会持续计费。\n\n**为什么对：** 出站计费入站免费是官方口径的经典边界；闲置资源属于你可以直接调整的那堆，删闲置是降本动作里最该先动手的一项。关联考点：官方技能点 3.1.1「描述影响 Azure 中成本的因素」，内容领域 3。\n\n**其他选项为什么错：**\n- A：数据进 Azure 的入站流量也按量收费。官方口径入站不计费，计费的是出方向。\n- C：出站流量费率可谈成包月封顶。费率是平台口径，只能靠架构少跨区搬数据间接省。\n- D：区域不影响单价，只影响延迟。同一服务在不同区域定价可以不同，选区也是成本因素。\n- E：闲置资源停机后就不计费了。忘关的虚机与没人认领的旧磁盘，月月都在计费。\n\n**关键概念：** 出站计费、入站免费；闲置资源月月计费，先删再降本。本题对应考纲 3.1.1。","s":"自编·3.1.1"},{"id":"D3-002","d":3,"t":"single","q":"账单环比涨了三成，复盘发现三类问题：大促后忘关的活动虚机、该转冷没转的营销素材、报表库一直按按需计费。对应的正确降本动作是","o":[{"l":"A","t":"把数据搬进另一个更便宜的区域"},{"l":"B","t":"删闲置、降层级、稳态负载换预留"},{"l":"C","t":"给所有资源统一升一档规格"},{"l":"D","t":"把预算阈值调低，到线自动停机"}],"a":["B"],"e":"**正确答案：B。** 删闲置、降层级、稳态负载换预留。\n\n**为什么对：** 三个问题各对一类因素：闲置资源直接删、营销素材转冷层、报表库这类稳态负载用预留换折扣；降本先从可调的那堆下手，几类动作各就各位。关联考点：官方技能点 3.1.1「描述影响 Azure 中成本的因素」，内容领域 3。\n\n**其他选项为什么错：**\n- A：把数据搬进另一个更便宜的区域。跨区搬运本身产生出站费用，总账未必划算。\n- C：给所有资源统一升一档规格。升档只会更贵，方向反了。\n- D：把预算阈值调低，到线自动停机。预算只通知不停机，停不了任何资源。\n\n**关键概念：** 降本先删闲置、再降层级、稳态负载换预留。本题对应考纲 3.1.1。","s":"自编·3.1.1"},{"id":"D3-003","d":3,"t":"single","q":"关于「哪些成本因素你可以直接调整」，下列归纳正确的是","o":[{"l":"A","t":"档位、区域、定价形态与闲置资源可调，出站费率靠架构间接省"},{"l":"B","t":"所有因素都在平台手里，用户什么都调不了"},{"l":"C","t":"只有出站流量费率可以申请调整"},{"l":"D","t":"区域与档位由平台统一定死，无选择余地"}],"a":["A"],"e":"**正确答案：A。** 档位、区域、定价形态与闲置资源可调，出站费率靠架构间接省。\n\n**为什么对：** 成本因素按归谁管分两堆：档位、区域、形态、闲置是你可以直接调的；出站费率是平台口径，只能通过少跨区搬数据间接省。关联考点：官方技能点 3.1.1「描述影响 Azure 中成本的因素」，内容领域 3。\n\n**其他选项为什么错：**\n- B：所有因素都在平台手里，用户什么都调不了。档位与形态就是你自己选的，闲置资源你自己删。\n- C：只有出站流量费率可以申请调整。费率恰恰是平台口径，能调的是选型那一堆。\n- D：区域与档位由平台统一定死，无选择余地。选区选档本来就是部署时的自选项。\n\n**关键概念：** 能调的先动手：删闲置降档位上预留，费率那堆靠架构省。本题对应考纲 3.1.1。","s":"自编·3.1.1"},{"id":"D3-004","d":3,"t":"single","q":"董事会要新系统的年度云预算，架构师把虚机、存储、监控逐项配上区域与规格，导出估算单附在提案后面。用的是哪个工具","o":[{"l":"A","t":"TCO 计算器，算整体拥有成本"},{"l":"B","t":"成本分析，切账单视图"},{"l":"C","t":"预算加告警，到线提醒"},{"l":"D","t":"定价计算器，估这套 Azure 配置要花多少"}],"a":["D"],"e":"**正确答案：D。** 定价计算器，估这套 Azure 配置要花多少。\n\n**为什么对：** 定价计算器把要用的服务加进估算单，逐项配区域、档位、数量，实时显示预估成本，正对上云前估一套新方案的需求；导出结果拿去做预算或比选。关联考点：官方技能点 3.1.2「探索定价计算器」，内容领域 3。\n\n**其他选项为什么错：**\n- A：TCO 计算器，算整体拥有成本。它估的是本地机房与云方案的整体对比，不是单套配置的价格。\n- B：成本分析，切账单视图。那是资源跑起来之后的复盘工具，事前估算管不着。\n- C：预算加告警，到线提醒。那是事中盯防，出不了事前的估算单。\n\n**关键概念：** 上云前估配置用定价计算器，估算不等于账单。本题对应考纲 3.1.2。","s":"自编·3.1.2"},{"id":"D3-005","d":3,"t":"single","q":"CFO 追问「这套系统不上云、继续自建机房要花多少」。应该用哪个工具回答","o":[{"l":"A","t":"定价计算器，重新配一遍本地硬件"},{"l":"B","t":"成本分析，调出历史账对比"},{"l":"C","t":"TCO 计算器，对比本地与云方案的整体成本"},{"l":"D","t":"Azure Advisor 的成本建议"}],"a":["C"],"e":"**正确答案：C。** TCO 计算器，对比本地与云方案的整体成本。\n\n**为什么对：** TCO 计算器的用途就是本地机房方案与云方案的整体成本对比，帮论证迁云划算与否；它与定价计算器分工：一个答整体对比，一个答单套配置的价格。关联考点：官方技能点 3.1.2「探索定价计算器」，内容领域 3。\n\n**其他选项为什么错：**\n- A：定价计算器，重新配一遍本地硬件。定价计算器只估 Azure 配置，装不下自建机房的账。\n- B：成本分析，调出历史账对比。历史账里没有未发生的自建方案。\n- D：Azure Advisor 的成本建议。它分析现有资源的省钱空间，不管迁移论证。\n\n**关键概念：** 定价计算器估配置、TCO 答迁云与自建的整体对比。本题对应考纲 3.1.2。","s":"自编·3.1.2"},{"id":"D3-006","d":3,"t":"single","q":"生产订阅设了月度预算与阈值告警。某月费用冲过阈值后，资源的状态是","o":[{"l":"A","t":"自动停机保命，等人工恢复"},{"l":"B","t":"不受影响，消费继续，等告警引来的人处理"},{"l":"C","t":"自动降档省费用"},{"l":"D","t":"暂停新资源创建，存量照跑"}],"a":["B"],"e":"**正确答案：B。** 不受影响，消费继续，等告警引来的人处理。\n\n**为什么对：** 官方教程原句：阈值被超过时触发通知，资源不受影响，消费也不会被停止。预算是哨兵不是熔断器，真正停掉那台忘关测试机的是收到告警的人。关联考点：官方技能点 3.1.3「描述 Azure 中的成本管理能力」，内容领域 3。\n\n**其他选项为什么错：**\n- A：自动停机保命，等人工恢复。预算是观察与提醒工具，停不了任何资源。\n- C：自动降档省费用。降档要人动手，预算没有这个能力。\n- D：暂停新资源创建，存量照跑。预算不拦动作，硬性限制要另用策略或配额。\n\n**关键概念：** 预算只通知不停机，停它的是人不是预算。本题对应考纲 3.1.3。","s":"自编·3.1.3"},{"id":"D3-007","d":3,"t":"single","q":"财务问「这个月钱都花在哪些服务上、哪个资源组最贵」。应带他看哪个视图","o":[{"l":"A","t":"成本分析，按订阅、资源组、服务切账单"},{"l":"B","t":"Advisor 的成本类建议"},{"l":"C","t":"Service Health 的事件页"},{"l":"D","t":"定价计算器的估算单"}],"a":["A"],"e":"**正确答案：A。** 成本分析，按订阅、资源组、服务切账单。\n\n**为什么对：** 成本分析按订阅、资源组、服务多个维度切账单视图，看钱花在哪正是它的本职；预算管到线提醒，告警管通知，分析管看分布。关联考点：官方技能点 3.1.3「描述 Azure 中的成本管理能力」，内容领域 3。\n\n**其他选项为什么错：**\n- B：Advisor 的成本类建议。它给降本建议清单，不回答钱花在哪的分布问题。\n- C：Service Health 的事件页。那是平台健康事件，与费用分布无关。\n- D：定价计算器的估算单。估算单是事前的，对不上已发生的账单。\n\n**关键概念：** 钱花在哪看成本分析，到线提醒靠预算，通知靠告警。本题对应考纲 3.1.3。","s":"自编·3.1.3"},{"id":"D3-008","d":3,"t":"single","q":"给生产资源组打了「成本中心」标签，月末成本报表里组内虚拟机却没归进对应科目。原因是","o":[{"l":"A","t":"报表工具出了统计故障"},{"l":"B","t":"资源组标签优先级低于资源标签"},{"l":"C","t":"标签要到下个计费周期才生效"},{"l":"D","t":"资源不会自动继承资源组或订阅的标签"}],"a":["D"],"e":"**正确答案：D。** 资源不会自动继承资源组或订阅的标签。\n\n**为什么对：** 官方口径：资源不自动继承资源组或订阅上的标签；想组内资源都带上，要么逐个显式打，要么用策略自动补齐，标签也打不到管理组上。关联考点：官方技能点 3.1.4「描述标签的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- A：报表工具出了统计故障。数据没错，是标签根本没传到资源那一层。\n- B：资源组标签优先级低于资源标签。不是优先级问题，是继承压根不发生。\n- C：标签要到下个计费周期才生效。标签没有延迟生效的说法，缺就是缺。\n\n**关键概念：** 标签不继承：逐个打或用策略补，管理组上打不了。本题对应考纲 3.1.4。","s":"自编·3.1.4"},{"id":"D3-009","d":3,"t":"single","q":"有人提议给资源打上『机密』标签，带此标签的人才许访问。这个方案的问题是","o":[{"l":"A","t":"可以，标签本来就是权限的载体"},{"l":"B","t":"不行，因为标签不能打在资源上"},{"l":"C","t":"标签是分类维度不是授权判据，权限走角色控制"},{"l":"D","t":"不行，标签只能用英文命名"}],"a":["C"],"e":"**正确答案：C。** 标签是分类维度不是授权判据，权限走角色控制。\n\n**为什么对：** 标签给资源挂上账单系统和资源清单都认得的分类维度：成本归集、资源组织、自动化输入；访问控制走角色分配，两套机制不换岗。关联考点：官方技能点 3.1.4「描述标签的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- A：可以，标签本来就是权限的载体。标签管成本归集与资源筛选，不参与访问判定。\n- B：不行，因为标签不能打在资源上。资源层恰恰是可打标签的层级之一。\n- D：不行，标签只能用英文命名。命名语言不是问题，问题是它根本不判权限。\n\n**关键概念：** 标签管分类、角色管权限，别拿标签当授权。本题对应考纲 3.1.4。","s":"自编·3.1.4"},{"id":"D3-010","d":3,"t":"single","q":"两家团队分别用「Env」和「environment」打环境标签，季度报表汇总时数据对不上。治理上正确的做法是","o":[{"l":"A","t":"汇总时做人工映射转换"},{"l":"B","t":"先定一套统一的标签字典再铺开使用"},{"l":"C","t":"让报表工具兼容所有写法"},{"l":"D","t":"删掉全部标签从头再来"}],"a":["B"],"e":"**正确答案：B。** 先定一套统一的标签字典再铺开使用。\n\n**为什么对：** 标签先有字典再铺开：命名统一一种写法，成本归集与资源筛选才对得上；散着命名早晚乱，统一字典是标签治理的第一步。关联考点：官方技能点 3.1.4「描述标签的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- A：汇总时做人工映射转换。人工映射每次都对不齐，越晚统一代价越大。\n- C：让报表工具兼容所有写法。工具迁就混乱，字典本身还是乱的。\n- D：删掉全部标签从头再来。重打代价大，先定字典才是解。\n\n**关键概念：** 标签先定字典再铺开，报表才对得上。本题对应考纲 3.1.4。","s":"自编·3.1.4"},{"id":"D3-011","d":3,"t":"single","q":"数据散在本地数据库、两家云存储和五个 SaaS 工具里，监管要求盘点全部敏感数据。应使用哪个服务","o":[{"l":"A","t":"Microsoft Purview，扫数据源建统一数据地图"},{"l":"B","t":"Azure Policy，立规矩拦违规"},{"l":"C","t":"资源锁，锁住敏感数据防误删"},{"l":"D","t":"Azure Advisor，出整改建议"}],"a":["A"],"e":"**正确答案：A。** Microsoft Purview，扫数据源建统一数据地图。\n\n**为什么对：** Purview 连上各类数据源自动扫描，把发现的数据登记进统一数据地图并按敏感度分类打标，客户信息、财务数据一目了然，正对盘点需求。关联考点：官方技能点 3.2.1「描述 Microsoft Purview 在 Azure 中的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- B：Azure Policy，立规矩拦违规。Policy 管 Azure 资源的形态合规，管不到数据内容的盘点。\n- C：资源锁，锁住敏感数据防误删。锁拦删除修改动作，不盘点数据在哪是什么。\n- D：Azure Advisor，出整改建议。Advisor 分析资源配置与遥测，不进数据内容那一层。\n\n**关键概念：** 数据盘点用 Purview：先扫再编目，敏感度分类一目了然。本题对应考纲 3.2.1。","s":"自编·3.2.1"},{"id":"D3-012","d":3,"t":"single","q":"Purview 把各数据源扫描登记进数据地图后，合规团队要追溯「这张报表的数据从哪来、经谁加工」。这属于数据地图支撑的哪类能力","o":[{"l":"A","t":"编目分类，按敏感度打标"},{"l":"B","t":"扫描，连数据源摸家底"},{"l":"C","t":"合规拦截，拦住不该的访问"},{"l":"D","t":"血缘，数据的来龙去脉追溯"}],"a":["D"],"e":"**正确答案：D。** 血缘，数据的来龙去脉追溯。\n\n**为什么对：** 数据地图向上支撑搜索、血缘与合规报告：血缘正是数据的来龙去脉，从源头到加工到产出追得清；监管问卷里「数据从哪来」这一栏就靠它回答。关联考点：官方技能点 3.2.1「描述 Microsoft Purview 在 Azure 中的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- A：编目分类，按敏感度打标。打标管分类，不管追溯加工链路。\n- B：扫描，连数据源摸家底。扫描管发现数据，不回答来龙去脉。\n- C：合规拦截，拦住不该的访问。看得见与拦得住是两回事，拦截不是它的机制。\n\n**关键概念：** 数据地图支撑搜索、血缘与合规报告，血缘管来龙去脉。本题对应考纲 3.2.1。","s":"自编·3.2.1"},{"id":"D3-013","d":3,"t":"single","q":"公司新立规矩「生产资源只许建在两个区域」。管理员先按 audit 效果分配跑了一周，之后才切成 deny。这样安排的理由是","o":[{"l":"A","t":"audit 与 deny 效果相同，先后无所谓"},{"l":"B","t":"直接上 deny 最干净，audit 多此一举"},{"l":"C","t":"先摸清存量不合规的影响面，再强制拦截"},{"l":"D","t":"audit 是 deny 的试用版，到期自动切换"}],"a":["C"],"e":"**正确答案：C。** 先摸清存量不合规的影响面，再强制拦截。\n\n**为什么对：** 新规矩先 audit 跑一段是稳妥节奏：摸清存量里多少不合规、影响谁，确认影响面再切 deny；直接强制会让历史脚本集体失败，先看后拦才稳。关联考点：官方技能点 3.2.2「描述 Azure Policy 的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- A：audit 与 deny 效果相同，先后无所谓。一个只记录不合规，一个直接拦下，效果完全不同。\n- B：直接上 deny 最干净，audit 多此一举。一上来就 deny，历史部署脚本会在没人注意时集体失败。\n- D：audit 是 deny 的试用版，到期自动切换。没有自动切换这回事，切换是人评估后做的。\n\n**关键概念：** 新规矩先 audit 摸清存量，再切 deny 强制。本题对应考纲 3.2.2。","s":"自编·3.2.2"},{"id":"D3-014","d":3,"t":"single","q":"一位有很高角色权限的同事，建出来的资源仍被策略拦下了。这说明什么","o":[{"l":"A","t":"策略配置出了故障，需要修复"},{"l":"B","t":"Policy 管资源长什么样，与人的权限无关"},{"l":"C","t":"Policy 优先级高于角色权限，可越权管理"},{"l":"D","t":"该同事的权限其实不够高"}],"a":["B"],"e":"**正确答案：B。** Policy 管资源长什么样，与人的权限无关。\n\n**为什么对：** Policy 对资源强制执行规则与效果，管「做出来的资源长什么样」；角色控制管「谁能做」。权限再高，建出的资源不合规矩一样被拦，两边对象不同不互相顶岗。关联考点：官方技能点 3.2.2「描述 Azure Policy 的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- A：策略配置出了故障，需要修复。这不是故障，是 Policy 与角色控制的正常分工。\n- C：Policy 优先级高于角色权限，可越权管理。两者管的是不同对象，谈不上谁压谁。\n- D：该同事的权限其实不够高。权限再高，资源不合规矩照样被拦。\n\n**关键概念：** Policy 管资源形态、角色管谁发起，分工不换岗。本题对应考纲 3.2.2。","s":"自编·3.2.2"},{"id":"D3-015","d":3,"t":"single","q":"清理运动中，一位有 Owner 权限的同事要删一台挂了锁的旧虚拟机，操作被拦。正确的理解与后续做法是","o":[{"l":"A","t":"锁对所有角色生效，按流程评估后解锁再操作"},{"l":"B","t":"Owner 权限应该能绕过锁，找平台报障"},{"l":"C","t":"锁只拦低权限用户，等权限生效即可"},{"l":"D","t":"直接找管理员强删，锁形同虚设"}],"a":["A"],"e":"**正确答案：A。** 锁对所有角色生效，按流程评估后解锁再操作。\n\n**为什么对：** 锁拦的是动作本身，对所有角色生效，Owner 也不例外；这正是它与角色控制的分工：一个管谁发起，一个管允不允许发生。动被锁资源走评估解锁流程。关联考点：官方技能点 3.2.3「描述资源锁的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- B：Owner 权限应该能绕过锁，找平台报障。锁不认角色，升权绕不过，这是设计而非故障。\n- C：锁只拦低权限用户，等权限生效即可。锁对全体角色生效，Owner 也不例外。\n- D：直接找管理员强删，锁形同虚设。强删同样被拦，锁就是为拦动作而设。\n\n**关键概念：** 锁不认角色，Owner 也拦；要动先解锁走流程。本题对应考纲 3.2.3。","s":"自编·3.2.3"},{"id":"D3-016","d":3,"t":"single","q":"生产数据库要防误删，但日常的配置修改必须照常进行。应挂哪级锁","o":[{"l":"A","t":"ReadOnly，保护最彻底"},{"l":"B","t":"两级都挂，双保险"},{"l":"C","t":"不挂锁，靠权限管控即可"},{"l":"D","t":"CanNotDelete，允许读和改、只拦删除"}],"a":["D"],"e":"**正确答案：D。** CanNotDelete，允许读和改、只拦删除。\n\n**为什么对：** 两级锁各管一段：CanNotDelete 只拦删除、读写照常，正对防误删但运维不停的需求；ReadOnly 连改都拦，留给审计快照这类只该看的环境。关联考点：官方技能点 3.2.3「描述资源锁的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- A：ReadOnly，保护最彻底。连改都拦，日常配置变更全被堵死。\n- B：两级都挂，双保险。挂上 ReadOnly 后修改已被拦，再挂删除锁纯属重复。\n- C：不挂锁，靠权限管控即可。权限管谁发起，防不了有权限的人手滑误删。\n\n**关键概念：** 防误删挂 CanNotDelete，ReadOnly 留给只读环境。本题对应考纲 3.2.3。","s":"自编·3.2.3"},{"id":"D3-017","d":3,"t":"single","q":"给资源组挂了 CanNotDelete 锁。关于锁的生效范围，正确的说法是","o":[{"l":"A","t":"只锁住资源组本身，组内资源不受影响"},{"l":"B","t":"只对挂锁之后创建的资源生效"},{"l":"C","t":"组内全部资源都带上锁，后来加进来的也带"},{"l":"D","t":"需要逐个资源再挂一遍才生效"}],"a":["C"],"e":"**正确答案：C。** 组内全部资源都带上锁，后来加进来的也带。\n\n**为什么对：** 锁从父作用域向下继承：在资源组挂锁，组内所有资源都带上，后来加进来的也带；挂锁层级要挑对，别往管理组根上随手挂，那会波及全部订阅。关联考点：官方技能点 3.2.3「描述资源锁的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- A：只锁住资源组本身，组内资源不受影响。锁从父作用域向下继承，组内资源全带上。\n- B：只对挂锁之后创建的资源生效。继承与创建时间无关，后来加进来的同样带锁。\n- D：需要逐个资源再挂一遍才生效。继承正是省掉这件事的机制。\n\n**关键概念：** 锁沿作用域向下继承，挂之前先挑对层级。本题对应考纲 3.2.3。","s":"自编·3.2.3"},{"id":"D3-018","d":3,"t":"single","q":"新工程师第一天接触云，要看某台虚拟机的实时状态与它关联的磁盘和网卡。最合适的入口是","o":[{"l":"A","t":"命令行写一段查询脚本"},{"l":"B","t":"Azure 门户，浏览器里的图形控制台"},{"l":"C","t":"Cloud Shell 里跑命令查询"},{"l":"D","t":"ARM 模板的导出视图"}],"a":["B"],"e":"**正确答案：B。** Azure 门户，浏览器里的图形控制台。\n\n**为什么对：** 门户的长处是看得见：图形化属性页、资源依赖关系、内嵌监控图表；第一次接触某服务、要看实时状态、做一次性小改动，这些场景它最友好。关联考点：官方技能点 3.3.1「描述 Azure 门户」，内容领域 3。\n\n**其他选项为什么错：**\n- A：命令行写一段查询脚本。查一次状态犯不上写脚本，图形页一眼就能看。\n- C：Cloud Shell 里跑命令查询。能用但不如图形页直观，还得敲命令。\n- D：ARM 模板的导出视图。模板管部署定义，不是看实时状态的入口。\n\n**关键概念：** 要看、要浏览、一次性小改，门户最顺手；要可重复就走命令行。本题对应考纲 3.3.1。","s":"自编·3.3.1"},{"id":"D3-019","d":3,"t":"single","q":"第三天，新工程师要给二十台机器做完全相同的配置变更，他没有继续点门户。理由是","o":[{"l":"A","t":"这个操作要可重复，门户点击不可复现"},{"l":"B","t":"门户一次只能改一台，这是硬限制"},{"l":"C","t":"门户的权限不够改二十台机器"},{"l":"D","t":"门户不支持虚拟机的配置变更"}],"a":["A"],"e":"**正确答案：A。** 这个操作要可重复，门户点击不可复现。\n\n**为什么对：** 判断标准一句话：这操作要不要可重复。要重复二十次的变更走命令行写循环，一键完成且可复现；门户留给一次性浏览与小改动，两边各干各的。关联考点：官方技能点 3.3.1「描述 Azure 门户」，内容领域 3。\n\n**其他选项为什么错：**\n- B：门户一次只能改一台，这是硬限制。门户并非严格单台限制，问题在二十次手工点击难保零差错。\n- C：门户的权限不够改二十台机器。门户与命令行走同一套权限，不是权限问题。\n- D：门户不支持虚拟机的配置变更。门户能改，只是不该用它干这个活。\n\n**关键概念：** 操作要可重复就别在门户里点，命令行一键干完。本题对应考纲 3.3.1。","s":"自编·3.3.1"},{"id":"D3-020","d":3,"t":"single","q":"出差异地，需要在同事电脑上应急查一批云资源，又不能在他机器上装任何工具。最合适的做法是","o":[{"l":"A","t":"让同事先装一套 Azure CLI"},{"l":"B","t":"远程连回自己公司电脑操作"},{"l":"C","t":"用门户逐个点开资源查看"},{"l":"D","t":"浏览器打开 Cloud Shell 直接跑命令"}],"a":["D"],"e":"**正确答案：D。** 浏览器打开 Cloud Shell 直接跑命令。\n\n**为什么对：** Cloud Shell 是浏览器里直接打开的现成命令环境：不用在本机装任何东西，Bash 与 PowerShell 两种都提供，登录身份直接继承门户会话，正对借机器应急的场景。关联考点：官方技能点 3.3.2「描述 Azure Cloud Shell、Azure CLI 和 Azure PowerShell」，内容领域 3。\n\n**其他选项为什么错：**\n- A：让同事先装一套 Azure CLI。不能在他机器装东西是前提，此路不通。\n- B：远程连回自己公司电脑操作。绕一大圈，Cloud Shell 本来就是为随处可用准备的。\n- C：用门户逐个点开资源查看。应急查一批资源，逐个点效率太低。\n\n**关键概念：** Cloud Shell 免安装、浏览器即用，身份继承门户会话。本题对应考纲 3.3.2。","s":"自编·3.3.2"},{"id":"D3-021","d":3,"t":"single","q":"团队争论「Azure CLI 和 Azure PowerShell 该统一用哪一个」。下列说法最准确的是","o":[{"l":"A","t":"必须统一到 CLI，它是官方标准"},{"l":"B","t":"必须统一到 PowerShell，功能更全"},{"l":"C","t":"两套语法各有所长，选哪套看团队习惯与脚本生态"},{"l":"D","t":"两套不能并存，会互相冲突"}],"a":["C"],"e":"**正确答案：C。** 两套语法各有所长，选哪套看团队习惯与脚本生态。\n\n**为什么对：** CLI 是跨平台命令行工具，PowerShell 是 PowerShell 里的 Azure 模块组，两套语法管同一批资源；选哪套看团队习惯与既有脚本积累，不是站队问题。关联考点：官方技能点 3.3.2「描述 Azure Cloud Shell、Azure CLI 和 Azure PowerShell」，内容领域 3。\n\n**其他选项为什么错：**\n- A：必须统一到 CLI，它是官方标准。两件都是官方工具，没有唯一标准一说。\n- B：必须统一到 PowerShell，功能更全。两套功能覆盖相当，谈不上谁更全。\n- D：两套不能并存，会互相冲突。并存是常态，图形、命令、云端 Shell 三件来回切换。\n\n**关键概念：** CLI 与 PowerShell 是两套语法不是两个阵营，按习惯选。本题对应考纲 3.3.2。","s":"自编·3.3.2"},{"id":"D3-022","d":3,"t":"single","q":"三十台本地老服务器一时迁不动，团队想让它们和云上资源用同一套策略、标签与监控来管理。应使用","o":[{"l":"A","t":"Azure Migrate，整体搬迁"},{"l":"B","t":"Azure Arc，把 Azure 之外的资源纳管进统一管理面"},{"l":"C","t":"ExpressRoute，拉专线连起来"},{"l":"D","t":"资源锁，先保护起来"}],"a":["B"],"e":"**正确答案：B。** Azure Arc，把 Azure 之外的资源纳管进统一管理面。\n\n**为什么对：** Arc 的本质是统一管理面而不是搬迁：装了代理的本地服务器出现在门户资源清单里，同一套策略、标签、监控两头生效，服务器还留在原地跑。关联考点：官方技能点 3.3.3「描述 Azure Arc 的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- A：Azure Migrate，整体搬迁。Migrate 做评估与迁移，把服务器搬走不是纳管。\n- C：ExpressRoute，拉专线连起来。专线只解决连通，不解决统一管理面。\n- D：资源锁，先保护起来。锁防误删误改，与管理统一无关。\n\n**关键概念：** Arc 纳管不搬迁：服务器留原地，治理统一到 Azure。本题对应考纲 3.3.3。","s":"自编·3.3.3"},{"id":"D3-023","d":3,"t":"single","q":"关于 Azure Arc 的用途，下列说法正确的是","o":[{"l":"A","t":"把本地和其他云的资源纳入 Azure 的统一管理"},{"l":"B","t":"把本地服务器搬进 Azure 数据中心"},{"l":"C","t":"把 Azure 资源注册到别的云管理面"},{"l":"D","t":"替代订阅做计费分界"}],"a":["A"],"e":"**正确答案：A。** 把本地和其他云的资源纳入 Azure 的统一管理。\n\n**为什么对：** Arc 把 Azure 之外的服务器和资源注册进资源管理器的管理面，像原生资源一样被管：套同一套策略、标签、监控；已经在 Azure 里的资源用不上它，它也不搬工作负载。关联考点：官方技能点 3.3.3「描述 Azure Arc 的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- B：把本地服务器搬进 Azure 数据中心。Arc 只纳管不搬东西，真搬迁走迁移方案。\n- C：把 Azure 资源注册到别的云管理面。方向反了，Arc 是把外面的资源拉进 Azure 管。\n- D：替代订阅做计费分界。计费边界在订阅层，与 Arc 无关。\n\n**关键概念：** 外面的拉进来统一管，里面的用不上，搬迁不归它。本题对应考纲 3.3.3。","s":"自编·3.3.3"},{"id":"D3-024","d":3,"t":"multiple","q":"团队把环境定义改写成代码文件管理后，获得了哪些直接收益","o":[{"l":"A","t":"同一份文件在任何订阅部署出同一副环境"},{"l":"B","t":"手工改完环境不必再同步回模板"},{"l":"C","t":"部署速度一定比手工快十倍"},{"l":"D","t":"模板文件可以防止资源被误删"},{"l":"E","t":"环境变更有提交历史，改了什么谁改的都可查"},{"l":"F","t":"任何环境都该用模板管理，包括随手沙盒"}],"a":["A","E"],"e":"**正确答案：A、E。** 同一份文件在任何订阅部署出同一副环境；环境变更有提交历史，改了什么谁改的都可查。\n\n**为什么对：** 可重复让同一份文件处处长同一副样子，可版本化让环境变更有账可查，两条正是把环境从手艺变成产品的核心收益。关联考点：官方技能点 3.3.4「描述基础设施即代码（IaC）」，内容领域 3。\n\n**其他选项为什么错：**\n- B：手工改完环境不必再同步回模板。手工改动不同步回模板，下次部署就会被抹掉。\n- C：部署速度一定比手工快十倍。核心收益是可重复与可审计，快多少要看环境规模。\n- D：模板文件可以防止资源被误删。防误删是资源锁的活，模板管的是环境定义。\n- F：任何环境都该用模板管理，包括随手沙盒。一次性实验门户点两下更快，写模板反而重。\n\n**关键概念：** IaC 三益：可重复、可版本化、可审计。本题对应考纲 3.3.4。","s":"自编·3.3.4"},{"id":"D3-025","d":3,"t":"single","q":"命令式脚本说「先建 A 再建 B，建完 C」，模板说「最终要有 A、B、C」。这种差别的实际价值是","o":[{"l":"A","t":"模板运行速度天然更快"},{"l":"B","t":"模板可以绕过权限检查"},{"l":"C","t":"工具自己算怎么到达，重复部署不会建坏已有资源"},{"l":"D","t":"命令式脚本已经落伍应禁止使用"}],"a":["C"],"e":"**正确答案：C。** 工具自己算怎么到达，重复部署不会建坏已有资源。\n\n**为什么对：** 模板描述结果不描述步骤：工具按声明收敛环境，已存在的东西不会被重复建坏；这让重复部署变得安全，也是声明式做法的核心价值。关联考点：官方技能点 3.3.4「描述基础设施即代码（IaC）」，内容领域 3。\n\n**其他选项为什么错：**\n- A：模板运行速度天然更快。快慢不是本质差别，描述方式才是。\n- B：模板可以绕过权限检查。部署仍走权限与管理面，没有绕过一说。\n- D：命令式脚本已经落伍应禁止使用。命令式仍是正当工具，各有适用场景。\n\n**关键概念：** 声明式写结果不写步骤，重复部署不出错。本题对应考纲 3.3.4。","s":"自编·3.3.4"},{"id":"D3-026","d":3,"t":"single","q":"「你在门户点的、命令行敲的、模板提交的，最终都汇成同一种请求」。这句话说的是什么","o":[{"l":"A","t":"ARM 模板，声明式的部署文件"},{"l":"B","t":"Azure 资源管理器，一切操作的单通道控制面"},{"l":"C","t":"资源组，装资源的逻辑容器"},{"l":"D","t":"Cloud Shell，统一的命令环境"}],"a":["B"],"e":"**正确答案：B。** Azure 资源管理器，一切操作的单通道控制面。\n\n**为什么对：** ARM 是部署与管理控制面：门户、命令行、模板的请求最终都由它统一创建、更新、删除资源；模板只是提交给它的文件格式，两层要分开认。关联考点：官方技能点 3.3.5「描述 Azure Resource Manager（ARM）与 ARM 模板」，内容领域 3。\n\n**其他选项为什么错：**\n- A：ARM 模板，声明式的部署文件。模板是提交给控制面的文件，不是通道本身。\n- C：资源组，装资源的逻辑容器。容器管归属，不管请求怎么走。\n- D：Cloud Shell，统一的命令环境。它是跑命令的地方，不是请求的汇聚点。\n\n**关键概念：** ARM 是控制面单通道，模板是提交给它的文件。本题对应考纲 3.3.5。","s":"自编·3.3.5"},{"id":"D3-027","d":3,"t":"single","q":"同一份模板，测试环境部署出小规格、生产环境部署出大规格。差异是怎么来的","o":[{"l":"A","t":"差异全在参数文件里，模板本身不用改"},{"l":"B","t":"测试环境是部署后手工改小的"},{"l":"C","t":"模板里写死两套规格按环境切换"},{"l":"D","t":"生产环境用了另一个工具部署"}],"a":["A"],"e":"**正确答案：A。** 差异全在参数文件里，模板本身不用改。\n\n**为什么对：** 模板写「要什么」不写「怎么拿」：同一份模板配两份参数文件，测试档与生产档各自部署；扩容时改的是参数而不是模板，环境变更从此有账可查。关联考点：官方技能点 3.3.5「描述 Azure Resource Manager（ARM）与 ARM 模板」，内容领域 3。\n\n**其他选项为什么错：**\n- B：测试环境是部署后手工改小的。手工改会造成漂移，与模板化部署的初衷相反。\n- C：模板里写死两套规格按环境切换。那就不是同一份模板了，参数化才是正解。\n- D：生产环境用了另一个工具部署。同一个控制面同一份模板，差别只在参数。\n\n**关键概念：** 同一模板配不同参数，环境差异全在参数文件里。本题对应考纲 3.3.5。","s":"自编·3.3.5"},{"id":"D3-028","d":3,"t":"single","q":"运维想主动发现「哪里有闲置可删、哪里档位偏小、哪里缺冗余配置」。应定期看哪个服务","o":[{"l":"A","t":"Monitor 告警，盯已设的阈值喊人"},{"l":"B","t":"Service Health 平台事件页"},{"l":"C","t":"Policy 合规视图，强制资源合规"},{"l":"D","t":"Azure Advisor 的分类建议清单"}],"a":["D"],"e":"**正确答案：D。** Azure Advisor 的分类建议清单。\n\n**为什么对：** Advisor 分析资源配置与遥测，官方口径五类建议：成本、性能、可靠性、安全、卓越运营；闲置虚机、档位偏小、缺冗余正分属成本、性能、可靠性三页。关联考点：官方技能点 3.4.1「描述 Azure Advisor 的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- A：Monitor 告警，盯已设的阈值喊人。告警盯的是你已设的条件，不做主动体检建议。\n- B：Service Health 平台事件页。它报的是平台健康事件，不管你的资源配置问题。\n- C：Policy 合规视图，强制资源合规。它强制资源长什么样，不给优化建议。\n\n**关键概念：** 主动体检看 Advisor 五类建议，整改靠人走完。本题对应考纲 3.4.1。","s":"自编·3.4.1"},{"id":"D3-029","d":3,"t":"single","q":"Advisor 揪出三台闲置虚机之后，这些资源并没有被自动删除。这说明","o":[{"l":"A","t":"建议功能出了故障"},{"l":"B","t":"闲置虚机有删除保护删不掉"},{"l":"C","t":"Advisor 只给建议不自动改动，整改靠人执行"},{"l":"D","t":"需要再配一条策略才会生成建议"}],"a":["C"],"e":"**正确答案：C。** Advisor 只给建议不自动改动，整改靠人执行。\n\n**为什么对：** 官方口径：Advisor 只给建议，不自动改动资源。它是体检报告不是自动治疗机：清单派给负责人，季度末复查清零，最后一公里靠人走完。关联考点：官方技能点 3.4.1「描述 Azure Advisor 的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- A：建议功能出了故障。这不是故障，只建议不执行就是它的设计。\n- B：闲置虚机有删除保护删不掉。能不能删与它无关，它从头就没动手。\n- D：需要再配一条策略才会生成建议。建议由它自己分析生成，不需要策略配合。\n\n**关键概念：** Advisor 是体检报告不是治疗机，改不改归你。本题对应考纲 3.4.1。","s":"自编·3.4.1"},{"id":"D3-030","d":3,"t":"single","q":"某区域存储服务出现降级，运维想立刻知道「影响没影响到我们的订阅」。该看哪里","o":[{"l":"A","t":"全球状态页，像刷新闻一样盯着"},{"l":"B","t":"Service Health，只显示与你订阅相关的平台事件"},{"l":"C","t":"资源健康，看单台资源"},{"l":"D","t":"Monitor 告警，盯你的指标日志"}],"a":["B"],"e":"**正确答案：B。** Service Health，只显示与你订阅相关的平台事件。\n\n**为什么对：** Service Health 是个性化平台健康视图：服务问题只显示与你的订阅相关的，还能配告警让你先于用户知道；全球状态页不知道你是谁，单资源健康又太细。关联考点：官方技能点 3.4.2「描述 Azure Service Health」，内容领域 3。\n\n**其他选项为什么错：**\n- A：全球状态页，像刷新闻一样盯着。状态页是全球级，不知道你是谁，答不了影不影响你。\n- C：资源健康，看单台资源。它管单个资源好不好用，管不到平台级事件。\n- D：Monitor 告警，盯你的指标日志。Monitor 告警盯你的指标与日志，平台事件归 Service Health。\n\n**关键概念：** 平台事件影不影响你，看 Service Health 不看全球状态页。本题对应考纲 3.4.2。","s":"自编·3.4.2"},{"id":"D3-031","d":3,"t":"single","q":"运维要分别回答三个问题：Azure 全球有没有出事、我的订阅受没受影响、这台虚拟机为什么不通。对应的三个视图依次是","o":[{"l":"A","t":"全球状态页、Service Health、资源健康"},{"l":"B","t":"Service Health、资源健康、全球状态页"},{"l":"C","t":"全球状态页、资源健康、Service Health"},{"l":"D","t":"Service Health、全球状态页、Log Analytics"}],"a":["A"],"e":"**正确答案：A。** 全球状态页、Service Health、资源健康。\n\n**为什么对：** 三层健康从全球到个人再到单资源：状态页看全球、Service Health 看你的订阅、资源健康看单个资源；三个问题粒度递减，正好各对一层。关联考点：官方技能点 3.4.2「描述 Azure Service Health」，内容领域 3。\n\n**其他选项为什么错：**\n- B：Service Health、资源健康、全球状态页。顺序错位，全球的事在最外层先看。\n- C：全球状态页、资源健康、Service Health。后两个对调了，订阅层在中间这层。\n- D：Service Health、全球状态页、Log Analytics。全球与订阅两层对调，单机不通也不归日志查询。\n\n**关键概念：** 全球状态页、Service Health、资源健康，三层各管一段。本题对应考纲 3.4.2。","s":"自编·3.4.2"},{"id":"D3-032","d":3,"t":"single","q":"排障需要「查过去二十四小时所有的失败登录」。应使用 Monitor 家族的哪个组件","o":[{"l":"A","t":"Monitor 告警，盯条件喊人"},{"l":"B","t":"Application Insights，看应用表现"},{"l":"C","t":"Service Health，平台事件"},{"l":"D","t":"Log Analytics，日志的集中地与查询工作区"}],"a":["D"],"e":"**正确答案：D。** Log Analytics，日志的集中地与查询工作区。\n\n**为什么对：** 各处发来的日志汇进 Log Analytics 工作区，用查询语言做检索分析；失败登录这类历史事件的答案就在这里，与指标趋势、应用表现各归各的组件。关联考点：官方技能点 3.4.3「描述 Azure Monitor」，内容领域 3。\n\n**其他选项为什么错：**\n- A：Monitor 告警，盯条件喊人。告警管出事时通知，不管事后查证。\n- B：Application Insights，看应用表现。它管请求量与响应时间这类应用侧数据。\n- C：Service Health，平台事件。那是 Azure 自己的健康，不是你的日志。\n\n**关键概念：** 查历史日志用 Log Analytics，出事第一时间喊人用告警。本题对应考纲 3.4.3。","s":"自编·3.4.3"},{"id":"D3-033","d":3,"t":"single","q":"用户反馈「下单慢」，要定位慢在应用内部哪一段：请求量、响应时间、失败率、依赖调用逐层看。应使用哪个组件","o":[{"l":"A","t":"Log Analytics 的日志查询"},{"l":"B","t":"Monitor 告警的规则引擎"},{"l":"C","t":"Application Insights，应用侧的监控"},{"l":"D","t":"Azure Advisor 的性能建议"}],"a":["C"],"e":"**正确答案：C。** Application Insights，应用侧的监控。\n\n**为什么对：** Application Insights 收的是应用内部表现：请求量、响应时间、失败率、依赖调用尽收其中；用户说慢到底慢在哪一段，靠它的依赖链数据说话。关联考点：官方技能点 3.4.3「描述 Azure Monitor」，内容领域 3。\n\n**其他选项为什么错：**\n- A：Log Analytics 的日志查询。日志查得到事件记录，看不到应用内部表现的连续画像。\n- B：Monitor 告警的规则引擎。告警在出事时喊人，不做定位分析。\n- D：Azure Advisor 的性能建议。它给配置优化方向，不追踪一次请求的链路。\n\n**关键概念：** 应用内部表现归 Application Insights，靠依赖链数据定位慢点。本题对应考纲 3.4.3。","s":"自编·3.4.3"},{"id":"D3-034","d":3,"t":"single","q":"监控数据分两类：一类随时间是数值，一类是事件记录。它们的使用分工是","o":[{"l":"A","t":"指标负责存档，日志负责实时告警"},{"l":"B","t":"指标看趋势一眼见形状，日志查细节问到底"},{"l":"C","t":"日志看趋势更直观"},{"l":"D","t":"指标与日志必须二选一"}],"a":["B"],"e":"**正确答案：B。** 指标看趋势一眼见形状，日志查细节问到底。\n\n**为什么对：** 指标如 CPU 百分比随时间画曲线，形状一眼可见；日志是事件记录，能查细节问到底。告警盯两类数据设的阈值，Monitor 把收集、存、查、喊串成一条线。关联考点：官方技能点 3.4.3「描述 Azure Monitor」，内容领域 3。\n\n**其他选项为什么错：**\n- A：指标负责存档，日志负责实时告警。两类数据都能支撑告警，分工不在实时与否。\n- C：日志看趋势更直观。趋势是数值的强项，日志是事件记录。\n- D：指标与日志必须二选一。两类互补并存，Monitor 全都要收。\n\n**关键概念：** 指标见形状、日志问到底，两类互补别二选一。本题对应考纲 3.4.3。","s":"自编·3.4.3"}];
const QUIZ_MOCK_POOL = [];
const QUIZ_MOCK_SCORED = [];
</script>
<script>

/* ================================================================
   ===================== 题库数据（构建注入 QUIZ_META + QUIZ_QUESTIONS） ================
   ================================================================ */
// 模考池隔离（构建注入 QUIZ_MOCK_POOL；无模考池的科目为空集，行为不变）
const MOCK_IDS = (typeof QUIZ_MOCK_POOL !== "undefined" && QUIZ_MOCK_POOL) ? new Set(QUIZ_MOCK_POOL) : new Set();
// 模考池题目（仅全真模考可见；练习模式与统计一律不含）
const MOCK_QUESTIONS = QUIZ_QUESTIONS.filter(q => MOCK_IDS.has(q.id));
// 计分题 id：官方 65 题里 50 题计分、15 题不计分 —— 不计分题只上卷面，不参与判分
const MOCK_SCORED = (typeof QUIZ_MOCK_SCORED !== "undefined" && QUIZ_MOCK_SCORED) ? new Set(QUIZ_MOCK_SCORED) : new Set();
const QUESTIONS = QUIZ_QUESTIONS.filter(q => !MOCK_IDS.has(q.id));
const META = (typeof QUIZ_META !== 'undefined' && QUIZ_META) ? QUIZ_META : {};
const EXAM = META.exam || 'QUIZ';
const LS_PREFIX = META.lsPrefix || EXAM.toLowerCase();

const GLOSSARY = META.glossary || {};

function getGlossaryForQuestion(q) {
  const texts = [q.q];
  if(q.o && Array.isArray(q.o)) q.o.forEach(o => texts.push(o.t));
  if(q.e) texts.push(q.e);
  const fullText = texts.join(' ');
  const found = [];
  const sorted = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
  for(const term of sorted) {
    if(fullText.includes(term)) found.push({term, def: GLOSSARY[term]});
  }
  return found;
}

/* ================================================================
   ===================== 术语高亮 + 弹定义 ================
   ================================================================ */
// 长词优先排序，独立 token 边界匹配，避免 EBS 误标 Amazon EBS 中的 EBS 等
function getGlossarySortedKeys() {
  return Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
}

// 判断术语在文本中是否为独立出现（前后非字母/数字）
function isIndependentToken(text, idx, term) {
  const before = text[idx-1];
  const after = text[idx + term.length];
  const isLetter = c => c && /[A-Za-z0-9]/.test(c);
  return !isLetter(before) && !isLetter(after);
}

// 将解析正文中的术语高亮为可点击 span，返回 HTML
function fmtExp(s){ let t=(s===undefined||s===null)?'':String(s); t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); t=t.replace(/\n/g,'<br>'); t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); return t; }
function highlightGlossaryTerms(text) {
  if(!text) return text;
  const sortedKeys = getGlossarySortedKeys();
  let result = '';
  let i = 0;
  while(i < text.length) {
    let matched = false;
    for(const term of sortedKeys) {
      if(!term) continue;
      const idx = text.indexOf(term, i);
      if(idx === i && isIndependentToken(text, idx, term)) {
        const def = GLOSSARY[term] || '（暂无定义）';
        const termEsc = term.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const defEsc = def.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        result += `<span class="gloss-term" onclick="showGlossTip(event,'${termEsc}','${defEsc}')">${term}</span>`;
        i += term.length;
        matched = true;
        break;
      }
    }
    if(!matched) {
      // 中文等宽字符直接输出，保持原文本
      result += text[i];
      i++;
    }
  }
  return result;
}

// 点击术语弹出定义浮层
function showGlossTip(e, term, def) {
  e.stopPropagation();
  const tip = document.getElementById('glossTip');
  document.getElementById('glossTipTerm').textContent = term;
  document.getElementById('glossTipDef').textContent = def || '（暂无定义）';
  tip.style.display = 'block';
  // 定位：优先在点击位置下方，避免超出视口
  const pad = 12;
  let left = e.clientX + pad;
  let top = e.clientY + pad;
  // 先渲染再量尺寸
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if(left + tw > window.innerWidth - 8) left = e.clientX - tw - pad;
  if(top + th > window.innerHeight - 8) top = e.clientY - th - pad;
  if(left < 8) left = 8;
  if(top < 8) top = 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

function closeGlossTip() {
  document.getElementById('glossTip').style.display = 'none';
}

// 点击页面其它区域关闭浮层
document.addEventListener('click', function(e) {
  const tip = document.getElementById('glossTip');
  if(tip && tip.style.display === 'block' && !tip.contains(e.target)) {
    closeGlossTip();
  }
});

// 按 Esc 关闭浮层
document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') closeGlossTip();
});

/* ================================================================
   ===================== localStorage 操作 =========================
   ================================================================ */
const LS_ANSWERS = LS_PREFIX + '_answers';
const LS_WRONG   = LS_PREFIX + '_wrong';
const LS_PROGRESS = LS_PREFIX + '_progress';

function getAnswers() { return JSON.parse(localStorage.getItem(LS_ANSWERS)||'[]'); }
function setAnswers(a) { localStorage.setItem(LS_ANSWERS,JSON.stringify(a)); }
function getWrong() { return JSON.parse(localStorage.getItem(LS_WRONG)||'[]'); }
function setWrong(w) { localStorage.setItem(LS_WRONG,JSON.stringify(w)); }
function getProgress() { return JSON.parse(localStorage.getItem(LS_PROGRESS)||'{}'); }
function setProgress(p) { localStorage.setItem(LS_PROGRESS,JSON.stringify(p)); }

/* ----------------------------------------------------------------
   作答记录：会话态 / 累计统计态分离（修复）
   旧缺陷：模拟考核误读全局 localStorage 历史 → 进场即显示「已答对/曾答错」、
   题号导航提前染色、成绩单把练习与往场算进本次（实测正确数>题数、未答为负、
   分数超满分、正确率>100%）。
   三态口径：
     · sessionResults()       本场逐题作答（quizState.results）＝「本次」唯一真源
     · sessionScopedAnswers() 视图用作答集：考核=仅本场；练习模式=全局历史（原行为）
     · recordAnswer()         仍写全局 store → 错题集与统计口径不变
   ---------------------------------------------------------------- */
function sessionResults() {
  const r = (quizState && quizState.results) || {};
  return Object.keys(r).map(id => ({id, ua:r[id].ua, ok:r[id].ok, ts:r[id].ts}));
}
function sessionScopedAnswers() {
  return (quizState && quizState.mode === 'exam') ? sessionResults() : getAnswers();
}

function recordAnswer(qId, userAnswer, isCorrect) {
  const answers = getAnswers();
  answers.push({id:qId,ua:userAnswer,ok:isCorrect,ts:Date.now()});
  setAnswers(answers);
  const wrong = getWrong();
  const idx = wrong.findIndex(w=>w.id===qId);
  if(!isCorrect) {
    if(idx>=0) { wrong[idx].count++; wrong[idx].last=Date.now(); }
    else { wrong.push({id:qId,count:1,last:Date.now(),mastered:false}); }
  }
  setWrong(wrong);
}

function markMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=true;
  setWrong(wrong);
}
function unmarkMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=false;
  setWrong(wrong);
}
function removeWrong(qId) {
  setWrong(getWrong().filter(x=>x.id!==qId));
}

/* ================================================================
   ===================== 辅助函数 =================================
   ================================================================ */
const DOMAIN_NAMES = META.domains || {};
const DOMAIN_WEIGHTS = META.weights || {};
const DOMAIN_KEYS = Object.keys(DOMAIN_NAMES).map(Number).sort((a,b)=>a-b);
const EXAM_P = META.examParams || {};
const EXAM_COUNT = EXAM_P.count || 50;
const EXAM_MIN = EXAM_P.minutes || 60;
const EXAM_PASS = EXAM_P.pass || 700;
const TYPE_NAMES = {single:'单选题',multiple:'多选题',hot:'拖拽题'};

// 走全集：模考池题目不在练习池里，但模考错题会进错题集，取题必须能取到
function getQById(id) { return QUIZ_QUESTIONS.find(q=>q.id===id); }
function shuffle(arr) { const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function generateShuffledOptions(questions) {
  const opts = {};
  const newAnswers = {};
  questions.forEach(q => {
    if(q.t==='single'||q.t==='multiple') {
      const shuffled = shuffle([...q.o]);
      const labels = 'ABCDEFGHIJ';
      const relabeled = shuffled.map((item, i) => ({l: labels[i], t: item.t}));
      opts[q.id] = relabeled;
      const contentToNewLabel = {};
      relabeled.forEach(item => { contentToNewLabel[item.t] = item.l; });
      newAnswers[q.id] = q.a.map(oldL => {
        const oldItem = q.o.find(o => o.l === oldL);
        return oldItem ? contentToNewLabel[oldItem.t] : oldL;
      });
    }
  });
  return { opts, newAnswers };
}

function getStats() {
  const answers = getAnswers();
  const wrong = getWrong();
  const totalCorrect = answers.filter(a=>a.ok).length;
  const totalAnswered = answers.length;
  const acc = totalAnswered ? Math.round(totalCorrect/totalAnswered*100) : 0;
  const doneIds = [...new Set(answers.map(a=>a.id))];
  const completion = Math.round(doneIds.length/QUESTIONS.length*100);
  const domainStats = {};
  for(const d of DOMAIN_KEYS) {
    const dQIds = QUESTIONS.filter(q=>q.d===d).map(q=>q.id);
    const dAnswers = answers.filter(a=>dQIds.includes(a.id));
    const dCorrect = dAnswers.filter(a=>a.ok).length;
    const dTotal = dAnswers.length;
    domainStats[d] = {
      total:dQIds.length, answered:dTotal, correct:dCorrect,
      acc: dTotal ? Math.round(dCorrect/dTotal*100) : 0
    };
  }
  const typeStats = {};
  for(const t of ['single','multiple']) {
    const tQIds = QUESTIONS.filter(q=>q.t===t).map(q=>q.id);
    const tAnswers = answers.filter(a=>tQIds.includes(a.id));
    const tCorrect = tAnswers.filter(a=>a.ok).length;
    const tTotal = tAnswers.length;
    typeStats[t] = { answered:tTotal, correct:tCorrect, acc: tTotal ? Math.round(tCorrect/tTotal*100) : 0 };
  }
  const recentWrong = wrong.filter(w=>!w.mastered).sort((a,b)=>b.last-a.last).slice(0,5);
  const recent = answers.slice(-20).reverse();
  let streak = 0;
  for(const a of recent) { if(a.ok) streak++; else break; }
  return {totalCorrect,totalAnswered,acc,completion,domainStats,typeStats,recentWrong,streak,doneIds:doneIds.length};
}

let currentPage = 'dashboard';
let quizState = null;

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el = document.getElementById('page-'+page);
  if(el) el.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  if(page==='dashboard') renderDashboard();
  else if(page==='quiz') renderQuiz();
  else if(page==='wrongbook') renderWrongBook();
  else if(page==='stats') renderStats();
  else if(page==='settings') renderSettings();
}

function renderDashboard() {
  const s = getStats();
  const el = document.getElementById('page-dashboard');
  let html = `<div class="header"><h1>${EXAM} 刷题工具</h1><button class="theme-btn" onclick="toggleTheme()">${document.getElementById('quizView').classList.contains('dark')?'☀️':'🌙'}</button></div>`;
  html += `<div class="stats-grid">
    <div class="stat-card"><div class="stat-num">${s.doneIds}/${QUESTIONS.length}</div><div class="stat-label">已做题量</div></div>
    <div class="stat-card"><div class="stat-num">${s.acc}%</div><div class="stat-label">总正确率</div></div>
    <div class="stat-card"><div class="stat-num">${s.completion}%</div><div class="stat-label">完成度</div></div>
    <div class="stat-card"><div class="stat-num">${s.streak}</div><div class="stat-label">连续正确</div></div>
  </div>`;
  html += `<div class="domain-grid">`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<div class="domain-card" onclick="startDomain(${d})">
      <div class="d-name">Domain ${d}: ${DOMAIN_NAMES[d]}</div>
      <div class="d-weight">权重 ${DOMAIN_WEIGHTS[d]} | 共${ds.total}题</div>
      <div class="d-bar"><div class="d-bar-fill" style="width:${ds.acc}%"></div></div>
      <div class="d-pct">${ds.answered?ds.acc+'%正确率':'未作答'}</div>
    </div>`;
  }
  html += `</div>`;
  html += `<div class="action-btns">
    <button class="btn-primary" onclick="startContinue()">📝 继续练习</button>
    <button class="btn-primary" onclick="startWrongReview()" style="background:var(--wrong)">🔄 错题重练 (${s.recentWrong.length}题待复习)</button>
    <button class="btn-primary" onclick="startExam()" style="background:var(--correct);color:#fff">📋 模拟考核（${EXAM_COUNT}题/${EXAM_MIN}分钟/${EXAM_PASS}分及格）</button>` + (MOCK_QUESTIONS.length ? `
    <button class="btn-primary" onclick="startRealExam()" style="background:#7c3aed;color:#fff">🎯 全真模考（${MOCK_QUESTIONS.length}题 · ${MOCK_SCORED.size}题计分 / ${EXAM_MIN}分钟）</button>` : '') + `
  </div>`;
  if(s.recentWrong.length) {
    html += `<div class="recent-wrong"><h3>❌ 最近错题</h3><ul>`;
    s.recentWrong.forEach(w=>{
      const q = getQById(w.id);
      if(q) html += `<li onclick="startSingle('${w.id}')">Domain ${q.d} | ${q.q.slice(0,30)}… | 答错${w.count}次</li>`;
    });
    html += `</ul></div>`;
  }
  html += `<div class="footer-note">${META.footerNote || '题库来源：第三方中文整理，以 AWS 官方材料为准'}</div>`;
