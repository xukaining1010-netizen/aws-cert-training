}

function renderQuiz() {
  const el = document.getElementById('page-quiz');
  if(!quizState || !quizState.questions.length) {
    el.innerHTML = `<div class="header"><button class="back-btn" onclick="navigate('dashboard')">←</button><h1>刷题</h1></div>
    <p style="text-align:center;margin-top:60px;color:var(--text2)">暂无题目，请从仪表盘选择模式开始练习</p>`;
    return;
  }
  const q = quizState.questions[quizState.currentIdx];
  const isHot = q.t === 'hot';
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  // 考核=仅本场作答；练习模式=全局历史（含本场）——防练习记录串进考核视图
  const answers = sessionScopedAnswers();
  const prevAnswers = answers.filter(a=>a.id===q.id);
  const everCorrect = prevAnswers.some(a=>a.ok);
  const everWrong = prevAnswers.some(a=>!a.ok);
  const answered = quizState.answered || {};
  let userAns = answered[q.id];
  const finished = quizState.submitted && quizState.submitted[q.id];
  const correct = finished && isAnswerCorrect(q, userAns);

  let modeLabel = quizState.mode==='exam'?'📋 模拟考核':quizState.mode==='wrong'?'❌ 错题重练':quizState.mode==='domain'?'📖 章节练习':quizState.mode==='single'?'📝 单题练习':'📝 顺序练习';

  let html = `<div class="quiz-header">
    <button class="back-btn" onclick="exitQuiz()">←</button>
    <span style="font-weight:600;font-size:15px">${modeLabel}</span>
    ${quizState.mode==='exam'?`<span class="timer" id="quizTimer"></span>`:''}
    <span class="quiz-progress">${quizState.currentIdx+1}/${quizState.questions.length}</span>
  </div>`;
  html += `<div class="quiz-meta">
    <span class="domain-tag">Domain ${q.d}</span>
    <span>${DOMAIN_NAMES[q.d]}</span>
    <span>${TYPE_NAMES[q.t]}</span>
    ${everCorrect?'<span style="background:rgba(6,214,160,.15);color:var(--correct)">已答对</span>':''}
    ${everWrong?'<span style="background:rgba(239,71,111,.15);color:var(--wrong)">曾答错</span>':''}
  </div>`;
  html += `<div class="question-text">${q.q}</div>`;

  const renderOpts = getOptionsHTML(q, userAns, finished, correct, getShuffledAnswer(q));
  html += renderOpts;

  if(isHot) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?'▶ 完成返回':'▶ 下一题'}</button>
    </div>`;
  } else if(!finished) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>✅ 确认</button>
    </div>`;
  } else {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?(quizState.mode==='exam'?'📊 交卷查看成绩':'▶ 完成返回'):'▶ 下一题'}</button>
    </div>`;
  }

  if(finished) {
    const badge = correct ? '✅ 回答正确!' : '❌ 回答错误';
    const cls = correct ? 'correct' : 'wrong';
    const gItems = getGlossaryForQuestion(q);
    let gHtml = '';
    if(gItems.length) {
      gHtml = '<div class="glossary"><div class="glossary-title">词汇附录</div>';
      gItems.forEach(g => {
        gHtml += '<div class="glossary-item"><span class="glossary-term">' + g.term + '</span><span class="glossary-def">\u00a0\u2014\u00a0' + g.def.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span></div>';
      });
      gHtml += '</div>';
    }
    html += `<div class="explanation show">
      <div class="result-badge ${cls}">${badge}</div>
      <div class="exp-text"><strong>正确答案：</strong>${formatAnswer(q)}</div>
      <div class="exp-text" style="margin-top:8px"><strong>解析：</strong>${highlightGlossaryTerms(fmtExp(q.e))}</div>
      ${q.s?`<div class="exp-source">来源：${q.s}</div>`:''}
      ${gHtml}
    </div>`;
  }

  html += `<div class="qnav"><h4>题号导航</h4><div class="qnav-grid">`;
  quizState.questions.forEach((qq, i) => {
    const qAnswers = answers.filter(a=>a.id===qq.id);
    const qCor = qAnswers.some(a=>a.ok);
    const qWro = qAnswers.some(a=>!a.ok);
    let cls = '';
    if(i===quizState.currentIdx) cls='current';
    else if(qCor) cls='done-correct';
    else if(qWro) cls='done-wrong';
    html += `<div class="qnav-item ${cls}" onclick="jumpToQuestion(${i})">${i+1}</div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
  if(!finished) updateSubmitButton();
}

function getOptionsHTML(q, userAns, finished, correct, shuffledAns) {
  let html = '';
  const qtype = q.t;
  if(qtype === 'hot') {
    html += `<div class="options-list" style="background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:16px">
      <div style="font-weight:600;color:var(--primary);margin-bottom:8px">🖱 本题为拖拽/操作题（HOTSPOT）</div>
      <div style="font-size:13px;line-height:1.7;color:var(--text2)">本题无标准 A/B/C/D 选项，答题形式为图形拖拽/区域选择。题目与图形见源 PDF 原图，答案请参照源文件。</div>`;
    if(q.e) {
      html += `<div style="margin-top:10px;font-size:13px;line-height:1.7;color:var(--text2);border-top:1px solid var(--border);padding-top:10px"><strong>解析/提示：</strong><br>${highlightGlossaryTerms(fmtExp(q.e))}</div>`;
    }
    html += `</div>`;
    return html;
  }
  if(qtype === 'single' || qtype === 'multiple') {
    const isMulti = qtype === 'multiple';
    html += `<div class="options-list">`;
    const opts = quizState.shuffledOptions && quizState.shuffledOptions[q.id] ? quizState.shuffledOptions[q.id] : q.o;
    opts.forEach(o => {
      const isSelected = userAns && userAns.includes(o.l);
      let cls = 'option-item';
      if(isMulti) cls += ' multi';
      if(isSelected && !finished) cls += ' selected';
      if(finished) {
        if(shuffledAns.includes(o.l)) cls += ' correct';
        else if(isSelected) cls += ' wrong';
      }
      const onclick = finished ? '' : `toggleOption('${o.l}')`;
      html += `<div class="${cls}" onclick="${onclick}">
        <span class="opt-label">${o.l}</span>
        <span>${o.t}</span>
      </div>`;
    });
    html += `</div>`;
    if(isMulti && !finished) html += `<div style="font-size:13px;color:var(--text2);margin-top:-12px;margin-bottom:16px">多选——请选择所有正确答案后提交（至少选 2 项）</div>`;
  }
  return html;
}

/* ================================================================
   ===================== 交互逻辑 =================================
   ================================================================ */

function toggleOption(label) {
  const q = quizState.questions[quizState.currentIdx];
  if(!quizState.answered) quizState.answered = {};
  if(q.t==='single') {
    quizState.answered[q.id] = [label];
  } else {
    const arr = quizState.answered[q.id] || [];
    const idx = arr.indexOf(label);
    if(idx>=0) arr.splice(idx,1);
    else arr.push(label);
    quizState.answered[q.id] = arr;
  }
  renderQuiz();
}

function updateSubmitButton() {
  const q = quizState.questions[quizState.currentIdx];
  if(q.t === 'hot') return;
  const ans = quizState.answered && quizState.answered[q.id];
  const btn = document.getElementById('submitBtn');
  if(!btn) return;
  if(q.t==='single') btn.disabled = !ans || !ans.length;
  else if(q.t==='multiple') btn.disabled = !ans || ans.length < 2;
}

function getShuffledAnswer(q) {
  if(quizState && quizState.shuffledAnswers && quizState.shuffledAnswers[q.id]) {
    return quizState.shuffledAnswers[q.id];
  }
  return q.a;
}

function isAnswerCorrect(q, userAns) {
  if(!userAns) return false;
  const ca = getShuffledAnswer(q);
  if(q.t==='single') return userAns[0]===ca[0];
  if(q.t==='multiple') { const a=[...userAns].sort(); const b=[...ca].sort(); return JSON.stringify(a)===JSON.stringify(b); }
  return false;
}

function formatAnswer(q) {
  const ca = getShuffledAnswer(q);
  if(q.t==='single'||q.t==='multiple') return ca.join(', ');
  if(q.t==='hot') return '本题为拖拽/操作题，答案为图形区域匹配，见源 PDF 原图';
  return '';
}

function submitAnswer() {
  const q = quizState.questions[quizState.currentIdx];
  let userAns = quizState.answered && quizState.answered[q.id];
  if(!userAns) return;
  if(q.t==='multiple' && userAns.length < 2) {
    alert('多选题至少选择 2 个答案，当前只选了' + userAns.length + '个');
    return;
  }
  const correct = isAnswerCorrect(q, userAns);
  if(!quizState.submitted) quizState.submitted={};
  quizState.submitted[q.id]=true;
  // 本场作答留痕（考核判分唯一依据；不与全局统计混用）
  if(!quizState.results) quizState.results={};
  quizState.results[q.id]={ua:[...userAns], ok:correct, ts:Date.now()};
  recordAnswer(q.id, userAns, correct);
  renderQuiz();
  updateSubmitButton();
}

function prevQuestion() {
  if(quizState.currentIdx > 0) { quizState.currentIdx--; renderQuiz(); }
}
function nextQuestion() {
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  if(isLast) {
    if(quizState.mode==='exam') renderExamResult();
    else navigate('dashboard');
  } else {
    quizState.currentIdx++;
    renderQuiz();
  }
}
function jumpToQuestion(idx) {
  quizState.currentIdx = idx;
  renderQuiz();
}
function exitQuiz() {
  // 考核中途退出必须停表：否则过期计时器归零时会把之后的练习页改写成「考核成绩单」
  if(quizState && quizState.mode==='exam') stopExamTimer();
  if(quizState && quizState.mode!=='exam') {
    setProgress({mode:quizState.mode,domain:quizState.domain||null,idx:quizState.currentIdx,time:Date.now()});
  }
  quizState = null;
  navigate('dashboard');
}

/* ================================================================
   ===================== 刷题模式启动 ==============================
   ================================================================ */
function startDomain(d) {
  const qs = QUESTIONS.filter(q=>q.d===d);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'domain',domain:d,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startContinue() {
  const p = getProgress();
  if(p.mode && p.mode!=='exam') {
    if(p.mode==='domain' && p.domain) {
      const qs = QUESTIONS.filter(q=>q.d===p.domain);
      const _sr=generateShuffledOptions(qs);
      quizState = {mode:'domain',domain:p.domain,questions:qs,currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    } else {
      const _sr=generateShuffledOptions([...QUESTIONS]);
      quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    }
  } else {
    const _sr=generateShuffledOptions([...QUESTIONS]);
    quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  }
  navigate('quiz');
}
function startWrongReview() {
  const wrong = getWrong().filter(w=>!w.mastered);
  if(!wrong.length) { alert('暂无错题需要复习！'); return; }
  const qs = wrong.map(w=>getQById(w.id)).filter(Boolean);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'wrong',domain:null,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startSingle(id) {
  const q = getQById(id);
  if(!q) return;
  const _sr=generateShuffledOptions([q]);
  quizState = {mode:'single',domain:null,questions:[q],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startExam() {
  // 模拟考核：按 meta 权重 × meta 题数分配各域配额（最大余数法，保证总和=EXAM_COUNT）
  const counts = {};
  let sumInt = 0;
  const raw = {}, rem = {};
  DOMAIN_KEYS.forEach(k => {
    const w = parseFloat(String(DOMAIN_WEIGHTS[k]||'0').replace('%',''))/100;
    raw[k] = w * EXAM_COUNT;
    counts[k] = Math.floor(raw[k]);
    rem[k] = raw[k] - counts[k];
    sumInt += counts[k];
  });
  let deficit = EXAM_COUNT - sumInt;
  const order = [...DOMAIN_KEYS].sort((a,b)=>rem[b]-rem[a]);
  let i = 0;
  while(deficit > 0) { counts[order[i % order.length]]++; deficit--; i++; }
  let selected = [];
  DOMAIN_KEYS.forEach(d => {
    const pool = shuffle(QUESTIONS.filter(q=>q.d===d && q.t!=='hot'));
    selected.push(...pool.slice(0, counts[d]));
  });
  selected = shuffle(selected);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam',domain:null,questions:selected,currentIdx:0,answered:{},submitted:{},results:{},shuffledOptions:_exam.opts,shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  // 场次标识：计时回调据此判定「本场是否仍在进行」，防过期计时器串场
  quizState.examToken = 'ex-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

function startRealExam() {
  // 全真模考：固定用模考池出卷（题数/计分结构/时长按官方口径），每次只重排题序与选项。
  // 与随机模考的区别：题目固定可复现，分数可跨场对比；题目与练习池隔离，平时练不到。
  const pool = MOCK_QUESTIONS.slice();
  if(!pool.length) { alert('本卷未配置模考池，请用随机模考'); return; }
  const selected = shuffle(pool);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam', fullMock:true, domain:null, questions:selected, currentIdx:0, answered:{}, submitted:{}, shuffledOptions:_exam.opts, shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  quizState.examToken = 'mx-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

let examTimerInterval = null;
function stopExamTimer() {
  if(examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
}
function startExamTimer() {
  let secs = quizState.examDuration;
  const token = quizState.examToken;
  const timerEl = document.getElementById('quizTimer');
  if(!timerEl) return;
  stopExamTimer();
  examTimerInterval = setInterval(() => {
    // 场次校验：已退出或已换场（新 token）立即自毁
    if(!quizState || quizState.mode!=='exam' || quizState.examToken!==token) { stopExamTimer(); return; }
    secs--;
    const m = Math.floor(secs/60), s = secs%60;
    const el = document.getElementById('quizTimer');
    if(el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if(secs<=60 && el) el.classList.add('warning');
    if(secs<=0) { stopExamTimer(); finishExam(token); }
  }, 1000);
}

function finishExam(token) {
  stopExamTimer();
  // 只对「发起本场计时」的考核会话生效
  if(quizState && quizState.mode==='exam' && (token===undefined || quizState.examToken===token)) renderExamResult();
}

function renderExamResult() {
  if(!quizState) return;
  stopExamTimer();
  const qs = quizState.questions;
  const results = quizState.results || {};
  const fullMock = !!quizState.fullMock;
  // 全真模考按官方口径只判计分题（50 题）；随机模考与其它模式仍整卷计分
  const counted = fullMock ? qs.filter(q => MOCK_SCORED.has(q.id)) : qs;
  const total = counted.length;
  // 逐题按本场作答判分；全局历史与往场作答一律不计
  let correct = 0, wrong = 0, unanswered = 0;
  const domStat = {};
  DOMAIN_KEYS.forEach(d => domStat[d] = {n:0, cor:0});
  counted.forEach(q => {
    if(!domStat[q.d]) domStat[q.d] = {n:0, cor:0};
    domStat[q.d].n++;
    const r = results[q.id];
    if(!r) unanswered++;
    else if(r.ok) { correct++; domStat[q.d].cor++; }
    else wrong++;
  });
  // 不变量自校验：正确 + 错误 + 未答 必须等于计分题数
  if(correct + wrong + unanswered !== total) console.warn('[exam] 判分不变量异常', {correct, wrong, unanswered, total});
  const el = document.getElementById('page-quiz');
  const pct = total ? Math.round(correct/total*100) : 0;
  // 1000-point scale, 700 to pass
  const scaledScore = total ? Math.round(correct/total*1000) : 0;
  const passed = scaledScore >= EXAM_PASS;
  // Time used
  const timeUsed = quizState.examStartTime ? Math.round((Date.now()-quizState.examStartTime)/1000) : 0;
  const timeM = Math.floor(timeUsed/60), timeS = timeUsed%60;

  // Domain breakdown
  let domainHtml = '';
  for(const d of DOMAIN_KEYS) {
    const dd = domStat[d] || {n:0, cor:0};
    const dPct = dd.n ? Math.round(dd.cor/dd.n*100) : 0;
    domainHtml += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${dd.n}</td><td>${dd.cor}</td><td style="color:${dPct>=70?'var(--correct)':'var(--wrong)'}">${dPct}%</td></tr>`;
  }

  el.innerHTML = `<div class="header"><button class="back-btn" onclick="exitExam()">←</button><h1>${fullMock ? '🎯 全真模考成绩单' : '📋 考核成绩单'}</h1></div>
  <div style="text-align:center;padding:30px 20px">
    <div style="font-size:48px;font-weight:700;color:${passed?'var(--correct)':'var(--wrong)'}">${scaledScore}</div>
    <div style="font-size:14px;color:var(--text2);margin:4px 0">满分 1000 分 | 及格线 ${EXAM_PASS} 分${fullMock ? " | 计分题 " + total + " 题（卷面 " + qs.length + " 题，不计分 " + (qs.length - total) + " 题）" : ""}</div>
    <div style="font-size:16px;color:var(--text);margin:12px 0;font-weight:600">${passed?'✅ 通过！':'❌ 未通过'}</div>
    <div style="display:flex;justify-content:center;gap:20px;margin:16px 0;flex-wrap:wrap">
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--correct)">${correct}</div><div style="font-size:12px;color:var(--text2)">正确</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--wrong)">${wrong}</div><div style="font-size:12px;color:var(--text2)">错误</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text2)">${unanswered}</div><div style="font-size:12px;color:var(--text2)">未答</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--primary)">${pct}%</div><div style="font-size:12px;color:var(--text2)">正确率</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text)">${timeM}分${timeS.toString().padStart(2,'0')}秒</div><div style="font-size:12px;color:var(--text2)">用时</div></div>
    </div>
  </div>
  <div class="stats-chart">
    <h3>各章节成绩</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>题数</th><th>正确</th><th>正确率</th></tr></thead><tbody>
    ${domainHtml}
    </tbody></table>
  </div>
  <div style="text-align:center;padding:20px">
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn-secondary" onclick="exitExam()" style="width:auto">返回首页</button>
      <button class="btn-primary" onclick="${fullMock ? 'startRealExam()' : 'startExam()'}" style="width:auto;flex:none">再考一次</button>
    </div>
  </div>`;
  quizState = null;
}

function exitExam() {
  quizState = null;
  navigate('dashboard');
}

function drawDomainChart(s) {
  const c = document.getElementById('chartDomain');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = DOMAIN_KEYS.map(k=>'D'+k);
  const colors = ['#4361ee','#4cc9f0','#06d6a0','#f8961e','#9b5de5'];
  const barW = (W-80) / (labels.length*1.5);
  labels.forEach((l,i)=>{
    const val = s.domainStats[i+1].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(l, x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

function drawTypeChart(s) {
  const c = document.getElementById('chartType');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = ['单选','多选'];
  const keys = ['single','multiple'];
  const colors = ['#4361ee','#4cc9f0'];
  const barW = (W-80) / 4;
  keys.forEach((k,i)=>{
    const val = s.typeStats[k].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

/* roundRect polyfill */
if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(r>w/2) r=w/2;
    if(r>h/2) r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    return this;
  };
}

function exportData() {
  const data = {
    answers: getAnswers(),
    wrong: getWrong(),
    progress: getProgress(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${LS_PREFIX}-quiz-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.answers) setAnswers(data.answers);
        if(data.wrong) setWrong(data.wrong);
        if(data.progress) setProgress(data.progress);
        alert('数据导入成功！');
        navigate(currentPage);
      } catch(err) { alert('数据格式错误，请检查文件。'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetData() {
  showModal('确认重置', '确定要清除所有答题记录、错题集和进度吗？此操作不可恢复！', () => {
    localStorage.removeItem(LS_ANSWERS);
    localStorage.removeItem(LS_WRONG);
    localStorage.removeItem(LS_PROGRESS);
    navigate('dashboard');
  });
}

/* ================================================================
   ===================== 模态框 ====================================
   ================================================================ */
let modalCallback = null;
function showModal(title, text, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOverlay').classList.add('show');
  modalCallback = onConfirm;
  document.getElementById('modalConfirmBtn').onclick = () => {
    closeModal();
    if(modalCallback) modalCallback();
  };
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

/* ================================================================
   ===================== 主题切换 ==================================
   ================================================================ */
function toggleTheme() {
  document.getElementById('quizView').classList.toggle('dark');
  localStorage.setItem(LS_PREFIX+'_theme', document.getElementById('quizView').classList.contains('dark')?'dark':'light');
  navigate(currentPage);
}

/* ================================================================
   ===================== 初始化 ====================================
   ================================================================ */
function init() {
  if(localStorage.getItem(LS_PREFIX+'_theme')==='dark') document.getElementById('quizView').classList.add('dark');
  const pages = ['dashboard','quiz','wrongbook','stats','settings'];
  const app = document.getElementById('app');
  pages.forEach(p => {
    const div = document.createElement('div');
    div.id = 'page-'+p;
    div.className = 'page' + (p==='dashboard'?' active':'');
    app.appendChild(div);
  });
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => { if(btn.dataset.page==='learn'){ if(window.kbShowLearnHome) window.kbShowLearnHome(); } else navigate(btn.dataset.page); });
  });
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', init);

</script>

const LEARNING_DATA = {"meta":{"exam":"AZ-900","title":"AZ-900 Azure 基础认证 · 学习材料","lang":"zh-CN","updated":"2026-11-16","level":"Fundamentals","cnName":"Azure 基础级认证","examInfo":{"level":"Fundamentals","duration":"45 分钟","passScore":700,"vendor":"Microsoft","studyGuide":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-900","quickCards":[{"num":"40–60","label":"官方典型题量","sub":"确切题数开考启动页显示"},{"num":"45min","label":"考试时长"},{"num":"700/1000","label":"及格分数"},{"num":"3 域","label":"知识领域","sub":"11 组 · 57 技能点"},{"num":"Fundamentals","label":"认证级别"},{"num":"不过期","label":"证书有效期","sub":"无需续期"}]},"plan":[{"day":1,"topic":"D1 描述云概念 · 描述云计算 / 描述云服务类型","focus":"官方权重 25–30","domain":1},{"day":2,"topic":"D1 描述云概念 · 描述使用云服务的好处","focus":"本章练习 12 题","domain":1},{"day":3,"topic":"D2 描述 Azure 体系结构与服务 · 描述 Azure 的核心体系结构组件 / 描述 Azure 存储服务","focus":"官方权重最高 35–40","domain":2},{"day":4,"topic":"D2 描述 Azure 体系结构与服务 · 描述 Azure 计算与网络服务 / 描述 Azure 标识、访问和安全","focus":"本章练习 12 题","domain":2},{"day":5,"topic":"D3 描述 Azure 管理与治理 · 描述 Azure 中的成本管理 / 描述用于管理和部署 Azure 资源的特性和工具","focus":"官方权重 30–35","domain":3},{"day":6,"topic":"D3 描述 Azure 管理与治理 · 描述用于治理与合规的 Azure 特性和工具 / 描述 Azure 中的监控工具","focus":"本章练习 12 题","domain":3}],"version":"v1.0（题库 100 题全 3 域；学习材料 Domain 1~3）","planAuto":true},"chapters":[{"domain":1,"name":"描述云概念","weight":"25–30%","practice":[{"id":"D1-001","d":1,"t":"single","q":"新同事问「云到底是什么」，下列哪句话最准确地给出了云计算的定义","o":[{"l":"A","t":"把公司文件存到网盘，需要时再下载"},{"l":"B","t":"任何能通过互联网远程访问的服务都算云"},{"l":"C","t":"通过网络按需租用计算资源并按实际用量付费的服务方式"},{"l":"D","t":"把自家机房的服务器集中起来统一管理"}],"a":["C"],"e":"**正确答案：C。** 通过网络按需租用计算资源并按实际用量付费的服务方式。\n\n**为什么对：** 云计算的定义落在模式上：资源由云服务商持有并维护，你按需取用、弹性伸缩、按计量付费，这正是它与传统自建机房的分界线。关联考点：官方技能点 1.1.1「定义云计算」，内容领域 1。\n\n**其他选项为什么错：**\n- A：把公司文件存到网盘，需要时再下载。只碰到一小块，网盘是单个存储工具，不是按需租用计算资源的完整模式。\n- B：任何能通过互联网远程访问的服务都算云。把远程访问当成了充分条件，远程可用的服务未必按需取用、弹性伸缩和计量计费。\n- D：把自家机房的服务器集中起来统一管理。讲的是本地资源整合，硬件仍自持自管，与按需租用的模式无关。\n\n**关键概念：** 云计算是按需租用加按量计费的模式，资源归服务商持有。本题对应考纲 1.1.1。","s":"自编·1.1.1"},{"id":"D1-002","d":1,"t":"single","q":"营销团队当天申请十台临时服务器上线活动页，活动结束当天全部释放，只为实际占用的两周付费。这段经历体现了云计算的哪组特征","o":[{"l":"A","t":"这得益于资源由云服务商持有维护"},{"l":"B","t":"按需取用、弹性伸缩与计量计费，用完即释放不留闲置"},{"l":"C","t":"必须提前数月走采购流程备货"},{"l":"D","t":"机器闲置期间也要持续付费"}],"a":["B"],"e":"**正确答案：B。** 按需取用、弹性伸缩与计量计费，用完即释放不留闲置。\n\n**为什么对：** 当天开通对应按需取用，结束即释放对应弹性伸缩，只付两周对应计量计费，三个特征在同一段经历里同时成立。关联考点：官方技能点 1.1.1「定义云计算」，内容领域 1。\n\n**其他选项为什么错：**\n- A：这得益于资源由云服务商持有维护。那是模式成立的前提背景，没有点中即申请即归还这段行为本身。\n- C：必须提前数月走采购流程备货。恰是传统采购的对照面，云端开通是分钟级，与这次经历相反。\n- D：机器闲置期间也要持续付费。与消费型计费相反，释放后停止计费才是这次的关键点。\n\n**关键概念：** 按需取用、弹性伸缩、计量计费是云计算的三个特征。本题对应考纲 1.1.1。","s":"自编·1.1.1"},{"id":"D1-003","d":1,"t":"single","q":"公司误配了软件即服务（SaaS）办公套件的共享范围，内部报表被多看了三个月。复盘追责时，这段数据访问配置的责任归谁","o":[{"l":"A","t":"租户自己，数据与访问控制永远是你这一侧的责任"},{"l":"B","t":"云服务商，软件由它运营维护"},{"l":"C","t":"云服务商，用了 SaaS 安全就整体外包了"},{"l":"D","t":"双方各担一半，无法划清"}],"a":["A"],"e":"**正确答案：A。** 租户自己，数据与访问控制永远是你这一侧的责任。\n\n**为什么对：** 共享责任模型里物理层永远归服务商，数据与访问控制永远归你；服务类型再怎么上移，数据这一段的责任线都不动，误配共享范围正落在你这一侧。关联考点：官方技能点 1.1.2「描述共享责任模型」，内容领域 1。\n\n**其他选项为什么错：**\n- B：云服务商，软件由它运营维护。运营软件不等于接管数据责任，共享范围是租户侧的配置动作。\n- C：云服务商，用了 SaaS 安全就整体外包了。责任跟着控制权走，数据与账户配置从未随服务类型外包出去。\n- D：双方各担一半，无法划清。共享责任模型正是为划清而生，每一段责任都有明确归属。\n\n**关键概念：** 数据与访问控制永远是租户责任，服务类型再高也移不走。本题对应考纲 1.1.2。","s":"自编·1.1.2"},{"id":"D1-004","d":1,"t":"single","q":"同一公司里，甲系统用基础设施即服务（IaaS）虚拟机、乙系统用软件即服务（SaaS）套件。关于操作系统这一层归谁维护，正确的说法是","o":[{"l":"A","t":"两边都归你，租户责任从不变化"},{"l":"B","t":"两边都归服务商，云上机器都不用操心"},{"l":"C","t":"归谁看合同怎么签，模型定不了"},{"l":"D","t":"IaaS 归你维护、SaaS 归服务商，责任线随服务类型移动"}],"a":["D"],"e":"**正确答案：D。** IaaS 归你维护、SaaS 归服务商，责任线随服务类型移动。\n\n**为什么对：** 责任线是一条滑动的线：物理硬件永远在服务商侧，数据永远在你侧；中间的操作系统到运行环境，IaaS 划在虚拟化之上归你，SaaS 几乎划到顶归服务商。关联考点：官方技能点 1.1.2「描述共享责任模型」，内容领域 1。\n\n**其他选项为什么错：**\n- A：两边都归你，租户责任从不变化。数据那一段确实不动，但操作系统这段随服务类型上下滑动。\n- B：两边都归服务商，云上机器都不用操心。IaaS 恰恰从操作系统开始归你，虚机打不上补丁是你的事。\n- C：归谁看合同怎么签，模型定不了。模型先给出默认划分，合同只能在其上再加约定。\n\n**关键概念：** 责任跟着控制权走，你控制到哪一层就负责到哪一层。本题对应考纲 1.1.2。","s":"自编·1.1.2"},{"id":"D1-005","d":1,"t":"multiple","q":"新同事刚学完公有、私有与混合三种云模型，写下六条笔记，其中哪些说法是正确的","o":[{"l":"A","t":"私有云必须建在组织自家机房里"},{"l":"B","t":"混合云要求两边各承担一半负载"},{"l":"C","t":"公有云的多个租户共用同一批物理硬件、逻辑上互相隔离"},{"l":"D","t":"公有云租户彼此能看见对方数据"},{"l":"E","t":"混合云是所有企业的终极形态"},{"l":"F","t":"私有云可以托管在别处，只要环境为一个组织独占"}],"a":["C","F"],"e":"**正确答案：C、F。** 公有云的多个租户共用同一批物理硬件、逻辑上互相隔离；私有云可以托管在别处，只要环境为一个组织独占。\n\n**为什么对：** 多租户共享加逻辑隔离是公有云的定义特征，独占服务一个组织是私有云的判定标准。关联考点：官方技能点 1.1.3「定义云模型：公有、私有与混合」，内容领域 1。\n\n**其他选项为什么错：**\n- A：私有云必须建在组织自家机房里。独占不等于自建，托管在别处但独占的环境也算私有云。\n- B：混合云要求两边各承担一半负载。混合是两边各干擅长的事，不是对半静态拆分。\n- D：公有云租户彼此能看见对方数据。物理共用不等于逻辑可见，多租户之间互不可见。\n- E：混合云是所有企业的终极形态。没有硬约束就不该上混合，多一边就多一套运维要管。\n\n**关键概念：** 公有看共享隔离，私有看独占，混合看互通。本题对应考纲 1.1.3。","s":"自编·1.1.3"},{"id":"D1-006","d":1,"t":"single","q":"一家制造企业把官网放在公有云随流量弹性伸缩，核心账务放在独占的私有环境，季度对账时两边经加密通道同步数据。这一整体部署形态属于哪种云模型","o":[{"l":"A","t":"公有云，因为对外业务占了大部分资源"},{"l":"B","t":"混合云，公有与私有组合使用、两边按需互通"},{"l":"C","t":"私有云，因为有数据没有出门"},{"l":"D","t":"多租户云，因为官网与他人共用硬件"}],"a":["B"],"e":"**正确答案：B。** 混合云，公有与私有组合使用、两边按需互通。\n\n**为什么对：** 混合云的定义就是公有加私有组合使用：独占环境保敏感与稳态，公有云供弹性与创新，中间打通衔接；这套部署逐条对上了这三个特征。关联考点：官方技能点 1.1.3「定义云模型：公有、私有与混合」，内容领域 1。\n\n**其他选项为什么错：**\n- A：公有云，因为对外业务占了大部分资源。模型按整体形态判定，不按资源数量多少投票。\n- C：私有云，因为有数据没有出门。两套环境并存且互通，已不是单一独占环境的形态。\n- D：多租户云，因为官网与他人共用硬件。多租户只描述公有云那一侧的租用方式，盖不住整体形态。\n\n**关键概念：** 公有供弹性、私有保独占、中间打通，三者齐了就是混合云。本题对应考纲 1.1.3。","s":"自编·1.1.3"},{"id":"D1-007","d":1,"t":"single","q":"一家保险公司把整套云环境托管在服务商机房，但该环境只为本公司独占使用，不向任何外部组织开放。这一环境属于哪种云模型","o":[{"l":"A","t":"私有云，判定标准是为单个组织独占服务"},{"l":"B","t":"公有云，因为硬件放在服务商机房里"},{"l":"C","t":"混合云，因为同时涉及两方组织"},{"l":"D","t":"多租户云，因为服务商还服务其他公司"}],"a":["A"],"e":"**正确答案：A。** 私有云，判定标准是为单个组织独占服务。\n\n**为什么对：** 私有云的定义是基础设施只为一个组织服务：可以建在自家机房，也可以托管在别处但独占；这套环境虽不在自家机房，独占这一条已经满足。关联考点：官方技能点 1.1.3「定义云模型：公有、私有与混合」，内容领域 1。\n\n**其他选项为什么错：**\n- B：公有云，因为硬件放在服务商机房里。基础设施在谁家机房不是判定线，公有云的关键是多租户共享。\n- C：混合云，因为同时涉及两方组织。混合要求公有与私有两套环境并存互通，单一独占环境不构成。\n- D：多租户云，因为服务商还服务其他公司。该环境独占不共享，多租户恰恰不成立。\n\n**关键概念：** 私有云看独占不看自建，托管在别处的独占环境也算。本题对应考纲 1.1.3。","s":"自编·1.1.3"},{"id":"D1-008","d":1,"t":"single","q":"医疗影像业务受监管约束，影像库不能离开院内合规环境；影像分析训练的高峰算力又希望按需获取、用完即释放。最合适的云模型是","o":[{"l":"A","t":"公有云，把影像库一并上云简化架构"},{"l":"B","t":"私有云，把训练算力也建在院内"},{"l":"C","t":"维持全本地不做云化"},{"l":"D","t":"混合云，敏感数据留在私有环境、弹性算力溢出到公有云"}],"a":["D"],"e":"**正确答案：D。** 混合云，敏感数据留在私有环境、弹性算力溢出到公有云。\n\n**为什么对：** 选型先问合规再问弹性：影像库必须留在独占环境，训练高峰是典型波动负载适合按需取用，两边经加密通道衔接正是教科书式用法。关联考点：官方技能点 1.1.4「辨认各云模型的适用场景」，内容领域 1。\n\n**其他选项为什么错：**\n- A：公有云，把影像库一并上云简化架构。监管明确要求数据不能出院，全上公有云直接违反这条硬约束。\n- B：私有云，把训练算力也建在院内。高峰算力自建会长期闲置，按需溢出正是公有云擅长的环节。\n- C：维持全本地不做云化。放弃弹性环节的按需优势，高峰要么买断闲置要么扛不住。\n\n**关键概念：** 先问数据能不能出门，再问负载波不波动，两个答案拼出模型。本题对应考纲 1.1.4。","s":"自编·1.1.4"},{"id":"D1-009","d":1,"t":"single","q":"管理会上有人说「我们担心安全，别用公有云了，直接上私有云」。按选型判断线，这句话最主要的问题是","o":[{"l":"A","t":"私有云本身不具备安全能力"},{"l":"B","t":"选型应先问弹性再问合规"},{"l":"C","t":"把安全焦虑当理由选私有，该先厘清共享责任的分界"},{"l":"D","t":"担心安全就不该考虑任何云"}],"a":["C"],"e":"**正确答案：C。** 把安全焦虑当理由选私有，该先厘清共享责任的分界。\n\n**为什么对：** 公有云的安全配置做对了一样可靠；焦虑的正确动作是回到共享责任模型厘清谁管哪层，没有合规硬约束就为它放弃弹性与按量付费并不划算。关联考点：官方技能点 1.1.4「辨认各云模型的适用场景」，内容领域 1。\n\n**其他选项为什么错：**\n- A：私有云本身不具备安全能力。私有云同样要配安全体系，说它不具备安全是事实性错误。\n- B：选型应先问弹性再问合规。判断顺序是先合规后弹性，这里把顺序说反了。\n- D：担心安全就不该考虑任何云。本地部署也有安全工作要做，云与安全并不互斥。\n\n**关键概念：** 安全焦虑先厘清共享责任，别拿它当私有云的选型理由。本题对应考纲 1.1.4。","s":"自编·1.1.4"},{"id":"D1-010","d":1,"t":"single","q":"财务部审两笔支出：一笔预付三年买断四十台服务器入资产账逐年折旧，另一笔按月支付云上虚拟机费用。这两笔分别属于哪类支出","o":[{"l":"A","t":"两笔都是资本支出，因为都买了算力"},{"l":"B","t":"前者是资本支出、后者是运营支出，随用随付不留资产"},{"l":"C","t":"两笔都是运营支出，因为都发生在经营期"},{"l":"D","t":"前者运营支出、后者资本支出"}],"a":["B"],"e":"**正确答案：B。** 前者是资本支出、后者是运营支出，随用随付不留资产。\n\n**为什么对：** 资本支出是一次性购置资产的投入，花大钱、入资产账、逐年折旧；运营支出随用随付、月结不留资产，两笔支出各自对上了其中一组特征。关联考点：官方技能点 1.1.5「描述消费型模型」，内容领域 1。\n\n**其他选项为什么错：**\n- A：两笔都是资本支出，因为都买了算力。按月付的虚拟机费不留资产、不折旧，归运营支出。\n- C：两笔都是运营支出，因为都发生在经营期。买断硬件是一次性购置资产的投入，入账折旧是资本支出的标志。\n- D：前者运营支出、后者资本支出。方向对调了，一次性买断才是资本，随用随付才是运营。\n\n**关键概念：** 一次性买断归资本支出，随用随付归运营支出。本题对应考纲 1.1.5。","s":"自编·1.1.5"},{"id":"D1-011","d":1,"t":"single","q":"运维向新同事解释云的计费方式：「就像家里的水表电表，拧开才计费，关掉就停表」。这句话点中的特征是","o":[{"l":"A","t":"按实际消耗的资源计费，不用不计费、随时增减"},{"l":"B","t":"只要开通了服务，闲着也持续扣费"},{"l":"C","t":"按固定包月一口价计费，用量不影响账单"},{"l":"D","t":"先一次性买断容量再慢慢摊销"}],"a":["A"],"e":"**正确答案：A。** 按实际消耗的资源计费，不用不计费、随时增减。\n\n**为什么对：** 消费型模型按实际消耗计费：拧开才计费对应使用才计费，关掉停表对应不用不计费，随时增减也在比喻里，逐条对得上。关联考点：官方技能点 1.1.5「描述消费型模型」，内容领域 1。\n\n**其他选项为什么错：**\n- B：只要开通了服务，闲着也持续扣费。与水表电表类比相反，关掉停表正是不用不计费。\n- C：按固定包月一口价计费，用量不影响账单。固定包月不是消费型模型，账单不随实际用量走。\n- D：先一次性买断容量再慢慢摊销。那是资本支出的路径，与随用随付的模式相反。\n\n**关键概念：** 消费型模型类比水表电表，用多少付多少、不用不计费。本题对应考纲 1.1.5。","s":"自编·1.1.5"},{"id":"D1-012","d":1,"t":"single","q":"视频转码任务白天排队、晚上批量执行，中途被中断也可以随时重跑，团队希望把计算成本压到最低。应选哪种定价形态","o":[{"l":"A","t":"按需计费，单价稳定且随时可用"},{"l":"B","t":"预留，承诺一年锁定低价"},{"l":"C","t":"按需与预留各买一半来平衡"},{"l":"D","t":"Spot（竞价）容量，借服务商闲置容量拿最大折扣、被回收就重跑"}],"a":["D"],"e":"**正确答案：D。** Spot（竞价）容量，借服务商闲置容量拿最大折扣、被回收就重跑。\n\n**为什么对：** 三种形态按承诺换折扣排列，负载越能容忍中断越能往便宜走；转码能重跑，正好拿容忍被回收换最大折扣，夜间执行也匹配闲置容量的时段。关联考点：官方技能点 1.1.6「比较云定价模型」，内容领域 1。\n\n**其他选项为什么错：**\n- A：按需计费，单价稳定且随时可用。按需单价最高，能容忍中断的任务用它等于白付溢价。\n- B：预留，承诺一年锁定低价。预留适合稳态负载，可中断的批量任务承诺一年反而多付。\n- C：按需与预留各买一半来平衡。负载特征已明确可中断，混搭两边都不最优。\n\n**关键概念：** 可中断、能重跑的任务用 Spot，容忍回收换最大折扣。本题对应考纲 1.1.6。","s":"自编·1.1.6"}],"sections":[{"h":"描述云计算","body":"### 这一域考什么\n\n这一域不考 Azure 的任何具体产品。它考「云」这个词表：云计算是什么、责任怎么分、公有私有混合怎么选、钱怎么算、好处有哪些、三层服务类型怎么分。\n\n三条线串起全章：\n\n1. **云计算本身**：定义、共享责任模型、三种云模型、选型、消费型模型、定价模型、无服务器，对应任务 1.1。\n2. **云的好处**：高可用与可扩展、可靠与可预测、安全与治理、可管理，对应任务 1.2。\n3. **服务类型分层**：基础设施即服务、平台即服务、软件即服务，对应任务 1.3。\n\n这是全书的地基。域 2 讲 Azure 的骨架和服务，域 3 讲管理与治理，里面每个词都从这里出发。读不懂后面哪一节，先回这里补哪一块。\n\n这门课是入门课，考核动词以 Describe（描述）、Compare（比较）、Define（定义）、Identify（辨认）为主。它不考配置操作，考的是你能不能看着一句描述，说出它指的是哪个概念、适合什么场景。\n\n### 读完这个域要能做什么\n\n这门课写给有 IT 经验、但还没用过云的同事。你懂公司内网、服务器、数据库这些概念，只是没在云上碰过它们。读完本域应能：\n\n- 用一句话给完全不懂的人说清「云计算」和「买服务器自己建」的区别。\n- 给一条责任归属，判断它落在云服务商头上还是你头上。\n- 给一个业务约束（敏感数据不能出门、要快速弹性、要完全控制），选出公有、私有还是混合。\n- 把一个支出归类成资本支出还是运营支出。\n- 看一句收益描述，认出它说的是哪一对云的好处。\n- 给一个需求（要控制操作系统、只想写代码、连代码都不想写），选对服务类型。\n\n### 和其他认证怎么接\n\n这门课不是孤立的。同一件事在别家云、别的级别里换了名字，认出来就不必重学。下面三条对照都按「哪里像、哪里不一样」写，不谈哪套更好。\n\n| 其他认证课 | 对应的那件事 | 这里有什么不同 | 什么时候该想起它 |\n|---|---|---|---|\n| AWS 云从业者（CLF-C02） | 云概念几乎是同一套词表：共享责任、三种部署模型、三层服务 | 两边骨架相同，但收益清单、产品名词各成一套，别把 AWS 的清单背来答 Azure 的题 | 学概念觉得重复时，正好交叉验证理解 |\n| Azure 管理员（AZ-104） | 本域的每个概念都是它的操作对象 | 这门课只要求认得出概念，AZ-104 要求管得住对应服务 | 打算往 AZ-104 进阶时 |\n| Azure 架构师专家（AZ-305） | 用同一套概念做架构决策 | AZ-305 问「为什么这么搭」，本域只问「这是什么」 | 学完想继续走架构方向时 |\n\n对照只用来帮你迁移已有理解。做题时以本域的官方口径为准，别把别家云的默认值带进来。\n\n### 官方口径的三条边界\n\n- 官方 Study Guide 只给技能点，不给题型，也不给题数。\n- 官方考试政策原句写明：考前不公布具体考试形式或题型。\n- 官方权重是 25–30% 这样的区间，不是精确占比。\n\n这三条决定了本域的表格怎么填。凡是官方没说的，表里就写官方未公布，不拿练习题的印象补空。\n\n#### 这一节学什么\n这一节对应考纲任务 1.1「描述云计算」。\n\n> 官方原名：Describe cloud computing\n\n七个技能点就是一部小词典加一张账本：前三条讲「云是什么、责任怎么分、有几种部署形态」，中间一条讲「每种形态什么时候用」，最后三条讲「钱怎么算」。学的时候抓两条主线：谁控制哪一层，钱跟着什么走。\n\n#### 定义云计算\n\n> 官方原名：Define cloud computing\n\n**这条在问什么。** 考题给一段描述，让你认出「这是不是云计算、哪一句定义说中了」。典型错误选项把云计算说成「把文件存在网盘」或「任何远程访问的服务」——都只碰到了一小块。\n\n**定义**：云计算（cloud computing）是通过网络按需租用计算资源的服务方式。服务器、存储、数据库、网络这些资源由云服务商（cloud provider，运营云的公司，如微软）持有和维护。你要多少就取多少，按实际用量付费。\n\n「云」不是天上的云，也不是某个具体产品。它指的是「别人机房里的计算机，你按需租用」这个模式。对照传统的本地部署（on-premises，自己买服务器、自己机房、自己运维）：买机器要等采购到货，装好之后闲着也是折旧；云上开通是分钟级，用完就释放，不付闲置的钱。\n\n**怎么运作**。这个模式站得住，靠三个特征：\n\n- 按需取用：自己动手开通，不用找供应商走采购流程。\n- 弹性伸缩：负载大了加资源、负载小了退回去。\n- 计量计费：用量被计量，账单跟着实际用量走。\n\n**什么时候用，什么时候别用**。负载波动、要快速上线、不想持有硬件 → 云的甜点区。极端敏感、完全断网运行的环境（某些产线隔离系统）→ 本地部署仍是答案；云不是万能替换，是另一种拿资源的方式。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 财季营销活动预计两周内要 10 台临时服务器做活动页。云上方案：当天开通、用完释放、只付两周的钱。自建方案：走采购流程要数月，活动早结束了。\n\n**关联服务**：Azure（微软的云平台）、本地部署（对照项）、消费型模型（1.1.5，计费方式的展开）。\n\n#### 描述共享责任模型\n\n> 官方原名：Describe the shared responsibility model\n\n**这条在问什么。** 考题给一条责任归属——「物理机房安全谁管」「数据备份谁管」——让你判断它落在谁头上。这条是本域最常被拿来出题的辨析点，而且和任务 1.3 联动：服务类型不同，责任线就移位。\n\n**定义**：共享责任模型（shared responsibility model）把责任按「谁控制哪一层」拆给两边：\n\n- 云服务商永远负责物理层：机房、硬件、网络底座。\n- 你永远负责你的数据和访问控制：数据本身、账户、权限。\n- 中间的操作系统、补丁、运行环境，归谁管取决于你用哪种服务类型——IaaS 你管得多，SaaS 你管得少（1.3 展开）。\n\n一句话记牢：责任跟着控制权走，你控制到哪一层，就负责到哪一层。数据是例外——不管用哪层服务，数据永远是你的责任，官方口径反复强调这一点。\n\n**怎么运作**。把责任想成一条滑动的线：物理安全、硬件维护、电力制冷永远在服务商那侧；数据的分类、访问、合规永远在你那侧；中间的操作系统到应用，随服务类型上移下移。\n\n**什么时候用，什么时候别用**。考题判断「用了 SaaS 就把安全外包了」——错，你的数据、你的账户配置仍是你负责。判断「机房着火是服务商的责任」——对，物理层归它。排障时也用同一条线：虚机打不上补丁是你的事，宿主机故障是它的事。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的报表团队在 SaaS 工具里误配了共享链接，数据被多看了三个月。复盘结论：工具是 SaaS 没错，但数据访问配置属于租户侧责任，这一段永远外包不出去。\n\n**关联服务**：云服务商（物理层责任方）、IaaS/PaaS/SaaS（责任线随类型移动，任务 1.3）、租户侧配置（你的责任区）。\n\n#### 定义云模型：公有、私有与混合\n\n> 官方原名：Define cloud models, including public, private, and hybrid\n\n**这条在问什么。** 考题给一段环境描述，让你认出它说的是三种部署模型里的哪一种。判断依据是「基础设施归谁持有、给谁用」。\n\n**定义**：三种云模型（cloud models）按基础设施归属分：\n\n- **公有云（public cloud）**：基础设施由云服务商持有，多个客户共用同一批物理硬件、逻辑上互相隔离（这叫多租户，multi-tenancy，多个客户像同一栋楼里的租户）。Azure 本身就是公有云。你创建的资源跑在服务商的硬件上，跟你「拼房」的其他租户你互不可见。\n- **私有云（private cloud）**：基础设施只为一个组织服务。可以是自家机房的云环境，也可以是托管在别处但独占的。特征：完全控制、隔离彻底；代价：自己担成本和运维。微软家族里也有私有云形态的方案，本考纲不展开，知道存在即可。\n- **混合云（hybrid cloud）**：公有加私有组合使用，两边的数据与应用按需互通。\n\n**怎么运作**。混合不是「一半一半」的静态概念，而是「两边各干各擅长的事」：本地保敏感与稳态，公有供弹性与创新，中间打通。\n\n**什么时候用，什么时候别用**。判断题常这么出：「公有云的资源不在你专属硬件上，所以不安全」——错，隔离是逻辑与安全层的，多租户是公有云常态。「私有云必须建在自己机房」——不必然，独占托管也算。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的三个部门各选各的：官网和营销分析跑公有云，弹性随流量；核心账务因合规要求独占环境跑私有云；两边季度对账时数据经加密通道同步——第三种就是混合云在起作用。\n\n**关联服务**：Azure（公有云）、私有云环境（独占部署）、混合云连通（加密通道类服务）。\n\n#### 辨认各云模型的适用场景\n\n> 官方原名：Identify appropriate use cases for each cloud model\n\n**这条在问什么。** 考题给一组业务约束，让你选模型。这条和「定义云模型」（1.1.3）一体两面：那条认概念，这条做选型。\n\n**定义**：选型判断线就三条：\n\n- **公有云**：启动快、弹性大、按量付费、不用持有硬件。适合新业务、波动负载、快速试错。\n- **私有云**：完全控制、满足严格隔离或监管。适合敏感数据本地化、已有大额硬件投资想消化。\n- **混合云**：两边兼得。适合「大部分数据不能出门，但个别环节要用云的弹性」的过渡态或长期并存态。\n\n**怎么运作**。判断顺序建议：先问合规——数据能不能出自己控制的边界；再问弹性——负载是不是波动大；最后问现状——已有的本地投资值不值得继续用。三个答案拼出模型。\n\n**什么时候用，什么时候别用**。三个常见误配要防：把「对安全焦虑」当理由选私有——安全焦虑该先厘清共享责任（1.1.2），公有云的安全配置做对了一样可靠；把混合当「终极形态」——多一边就多一套运维和连接要管，没有硬约束就别上混合；把公有当「便宜」——按量付费在长期满负荷场景未必比独占摊销低，账要按场景算（1.1.5）。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的医疗影像业务受监管约束，影像库不能离开院内合规环境——这一块跑私有；而影像分析训练的高峰算力按需溢出到公有云跑完即释放——弹性环节用公有。两者经加密通道衔接，这就是教科书级的混合云用法。\n\n**关联服务**：公有/私有/混合（三种模型本身）、合规约束（选型的主要输入）、弹性算力（公有云环节的典型用途）。\n\n#### 描述消费型模型\n\n> 官方原名：Describe the consumption-based model\n\n**这条在问什么。** 考题给一笔支出或一句消费描述，让你认出消费型模型的特征，并把支出归到运营支出。判断题爱考「不用的时候也计费」这类说法。\n\n**定义**：消费型模型（consumption-based model）是云的计费方式：按实际消耗的资源计费，用多少付多少，不用不计费，随时增减。类比水表电表——拧开才计费，关掉就停表。\n\n它带来支出结构的变化：运营支出（OpEx，operational expense，随用随付的经营性支出）替代资本支出（CapEx，capital expense，一次性购置资产的投入）。买服务器是 CapEx——花一大笔、资产入账、逐年折旧；按小时付虚拟机费用是 OpEx——月结随付、不留资产。\n\n**怎么运作**。好处两头：供给侧没有闲置沉没成本，需求侧不用提前拍脑袋估容量。代价是账单随用量波动，预算管理要另想办法——这是域 3 成本管理（D3.1）要展开的话题，此处先挂个钩。\n\n**什么时候用，什么时候别用**。考题归类：「预付三年买断硬件」→ CapEx。「按吞吐量付存储费」→ OpEx。别把「订阅 SaaS 年费」错归 CapEx——它是运营性的服务支出，仍是 OpEx 类。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 财务部对比两种方案：明年买 40 台服务器入资产账（CapEx），或在云上按月付虚拟机费（OpEx）。财务总监选了后者——新业务成不成还没把握，没必要先把钱变成桌子上的铁盒子。\n\n**关联服务**：按量计费（模型的载体）、资本支出与运营支出（归类考点）、成本管理（域 3 铺开）。\n\n#### 比较云定价模型\n\n> 官方原名：Compare cloud pricing models\n\n**这条在问什么。** 考题给一个负载特征（可中断、长期稳态、临时用一次），让你在几种定价形态里选最划算的。考的是形态与匹配，不是具体价格数字。\n\n**定义**：官方公开定价结构里，常见三种形态：\n\n1. **按需计费（pay-as-you-go）**：默认形态，开多少用多少付多少，单价最高，弹性最大。\n2. **预留（reservations）**：承诺用一段时期（如一年或三年）换折扣。给稳态、可预测的负载。\n3. **Spot（竞价/临时容量）**：借服务商的闲置容量，折扣最大，但随时可能被回收。给可中断、能重跑的任务。\n\nAzure 另有复用现有许可证换折扣的机制（Hybrid Benefit 一类），属于 Azure 特有的权益通道。它按官方定价页当期口径执行，本考纲只到「知道存在」。\n\n🔴 具体折扣率、适用条件随地区和时间变动，官方不给考试口径。做题认形态即可，不要背任何具体折扣数字。\n\n**怎么运作**。三种形态按「承诺换折扣」排列：按需是零承诺零折扣；预留是时长承诺换深度折扣；Spot 是「容忍被赶走」换最大折扣。负载越能容忍中断，越能往便宜的方向走。\n\n**什么时候用，什么时候别用**。夜间批量转码、跑挂了能重跑 → Spot。数据库这类三年不变的稳态 → 预留。营销活动页用两周 → 按需，别为临时负载买一年承诺。最贵的老 mistake 是「图省事全按需」，稳态负载一年下来多花不少。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的视频转码任务白天排队晚上跑——转码用 Spot 容量，被回收就重跑；报表数据库三年不动——预留；大促两周的临时活动站——按需。三笔账各自最优，合起来省下两成以上。\n\n**关联服务**：按需计费、预留实例、Spot 容量（三种形态）、成本管理与定价计算器（域 3 展开）。\n\n#### 描述无服务器\n\n> 官方原名：Describe serverless\n\n**这条在问什么。** 考题给一句描述（「部署代码就运行、没执行不收费」），让你认出无服务器。最经典的错误选项是「无服务器就是没有服务器」。\n\n**定义**：无服务器（serverless）是一种计算形态：你只部署代码，服务器调配、扩容、修补全部由平台代管，按代码实际执行来计费——没执行就不计费。\n\n名字里「无」的不是服务器，是「你不用管服务器」。机器在，只是看不见、不配置、不打补丁。在 Azure 上，Azure Functions（2.2.1）就是无服务器的实例。那一条从「三种计算形态滑杆」的角度又讲了一遍，两处互为印证。\n\n**怎么运作**。计费按执行计：触发一次算一次，运行时长算时长。伸缩全自动：事件从零到峰值，平台自动起停对应资源，你全程不配置「几台机器」。\n\n**什么时候用，什么时候别用**。短小、事件驱动、间歇性负载（缩略图、消息处理、定时清理）→ 无服务器甜点区。常驻长时服务、要求独占机器的遗留系统 → 无服务器反而别扭，用托管方式（2.2.4）更合适。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的商品图缩略图：客户上传原图触发函数、生成三张缩略图、存进 Blob。白天流量大函数并行跑，夜里没人传图，计费接近零。同需求若用常驻虚拟机做，夜里机器空转照付钱——两笔账一对比，无服务器省的就是「闲置那一截」。\n\n**关联服务**：Azure Functions（Azure 的函数计算，2.2.1）、事件驱动（触发形态）、Blob 存储（典型输入输出，2.3.1）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「云计算就是把文件存到网盘」 | 只碰到「按需租用计算资源」的一小块 | 云计算是按需租用服务器、存储、数据库、网络并按实际用量付费的模式 |\n| 「用了云，安全和数据就全归服务商」 | 忘了责任跟着控制权走 | 物理层归服务商；你的数据与访问永远归你，中间层随服务类型移动 |\n| 「公有云租户共用硬件，互相能看见」 | 混淆物理共用与逻辑隔离 | 多租户共用同一批物理硬件，但逻辑上互相隔离、互不可见 |\n| 「私有云必须建在自己机房」 | 把「独占」等同于「自建」 | 托管在别处但独占的环境也算私有云 |\n| 「无服务器就是没有服务器」 | 「无」掉的是「你不用管」，不是机器本身 | 机器在平台那侧；你只部署代码，按实际执行计费 |\n| 「按需计费最灵活，所以永远最划算」 | 按需弹性最大、单价也最高 | 稳态负载用预留换折扣；可中断、能重跑的任务用 Spot 换最大折扣 |\n\n#### 记忆要点\n\n1. **模式三征**：按需取用、弹性伸缩、计量计费。\n2. **责任滑动**：物理层永远归服务商，数据与访问永远归你，中间随服务类型上移下移。\n3. **三种模型**：公有租用、私有独占、混合互通；选型先问合规、再问弹性、最后问现状。\n4. **支出两类**：一次性买断是资本支出，随用随付是运营支出；SaaS 年费也归运营支出。\n5. **定价三态**：按需零承诺，预留拿时长承诺换折扣，Spot 拿「容忍被回收」换最大折扣。\n6. **执行计费**：无服务器没执行不计费；名字里「无」的是「你不用管服务器」。\n\n---"},{"h":"描述使用云服务的好处","body":"#### 这一节学什么\n这一节对应考纲任务 1.2「描述使用云服务的好处」。\n\n> 官方原名：Describe the benefits of using cloud services\n\n四个技能点是四对「形容词」。考法高度一致：给一句收益描述，认出它说的是哪一对。这域的题不难在理解，难在「一对里的两个词」互相缠。\n\n#### 描述云中高可用性与可扩展性的好处\n\n> 官方原名：Describe the benefits of high availability and scalability in the cloud\n\n**这条在问什么。** 考题给一句需求——「不能停机」「用户涌进来要顶得住」——让你认出对应的概念。这对词的分界：可用性管「在线时长」，可扩展性管「容量加减」。\n\n**定义**：高可用性（high availability）指服务尽可能长时间在线的能力。云平台用服务等级协议（SLA，service level agreement）给出在线时间的正式承诺，例如「某服务承诺每月 99.9% 时间可用」——具体数字因服务而异，考试不背数字、认结构。它背后的支撑就是你后面会见到的可用性区域（2.1.2）和区域对（2.1.1）：故障分散加冗余兜底。\n\n可扩展性（scalability）指容量随需加减的能力，两个方向：\n\n- **纵向扩展（scale up / down）**：单台机器加配或减配——换更大的档位。\n- **横向扩展（scale out / in）**：加减机器台数——一变三、三变一。\n\n两个方向都要「能加也能减」：只加不减，负载回落时就是白付钱。\n\n**怎么运作**。可用性靠结构（分散与冗余），可扩展性靠调度（加台数或升档位）。虚拟机规模集（2.2.2）就是「横向自动加减」的实例，此处先记住方向词。\n\n**什么时候用，什么时候别用**。判断题把「高可用」说成「永远不会坏」——错，高可用是承诺兜底与恢复，不是永动机。把「可扩展」说成「自动会扩」——错，可扩展是「具备扩的能力」，自动扩要另配规则（2.2.2）。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 大促前两周把订单服务从两台横向扩到八台、数据库纵向升一档；大促结束回落。其间同城一处机房故障，冗余副本把服务接管——可用性与可扩展性在同一次活动里各管各的活。\n\n**关联服务**：SLA（可用性的承诺载体）、可用性区域与区域对（结构基础，2.1.1、2.1.2）、规模集（横向扩展的实装，2.2.2）。\n\n#### 描述云中可靠性与可预测性的好处\n\n> 官方原名：Describe the benefits of reliability and predictability in the cloud\n\n**这条在问什么。** 这对词比上一对更绕：可靠管「坏了能不能恢复」，可预测管「表现和账单能不能提前算准」。考题爱把「可靠」和「高可用」混着考——前者是故障后恢复力，后者是在线时长。\n\n**定义**：可靠性（reliability）指系统在故障中维持运作、以及从故障中恢复的能力。云上的底气来自设计的可分散性：资源可以分散部署在多个区域、多个可用区，一处坏了别处接着干（结构见任务 2.1）。\n\n可预测性（predictability）指表现与成本可以提前算准，两个维度：\n\n- **性能可预测**：给定规格的资源表现一致，配额与档位写明，不掷骰子。\n- **成本可预测**：用量与单价透明，能预算、能告警——工具在域 3 成本管理展开，定价计算器（D3.1）就是为「提前算」准备的。\n\n**怎么运作**。两句话记住分工：可靠靠「设计与冗余」，可预测靠「透明与工具」。可靠性把「会不会坏」变成「坏了也有后手」；可预测性把「会花多少」变成「事先算得出来」。\n\n**什么时候用，什么时候别用**。判断「可靠性就是 SLA 百分比」——不准确，SLA 是可用性的承诺口径；可靠性是更宽的恢复能力。判断「云的成本天然可预测」——半对，可预测的前提是你去用工具管，不管就只是「透明」而不是「可预测」。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 给新系统做季度评审，两页并排：一页列故障演练结果（主库切换多久恢复——可靠性的证据）；另一页列定价计算器估算与上季度实际账单的偏差（成本可预测性的证据）。两页都没出现「凭感觉」三个字。\n\n**关联服务**：冗余与分布式部署（可靠性的结构基础）、定价计算器与成本管理（成本可预测，域 3 展开）、规格与配额（性能可预测的载体）。\n\n#### 描述云中安全与治理的好处\n\n> 官方原名：Describe the benefits of security and governance in the cloud\n\n**这条在问什么。** 考题给一句安全或治理需求，认出云在这两件事上「自带什么」。这条和共享责任（1.1.2）联动最紧——云给工具，你做配置，责任仍分摊。\n\n**定义**：安全方面，云平台自带一批安全能力：身份与访问管理、数据加密、网络隔离。这些是「现成的砖」，砌不砌墙、怎么砌，是你的配置工作——用错配置，好砖也白搭。\n\n治理（governance）指立规矩并保证规矩被遵守的能力。云上可以用策略自动化规矩——比如「资源只能建在指定区域」，对应域 3 的 Azure Policy（D3.2）。治理还覆盖审计与合规（compliance，遵循法规与行业标准）：云厂商提供合规认证与审计证据，但「你是否合规」的最终责任仍在你——这条又绕回共享责任模型。\n\n**怎么运作**。安全与治理在云上的好处，本质是「集中化」：全公司的身份、策略、审计集中在一处配置，一处修正全局生效。比起逐台机器手工管，集中化既少漏又省人力。\n\n**什么时候用，什么时候别用**。判断题「上了云就自动合规」——错，厂商给认证证据，合规动作与数据责任仍归你。「云的安全配置很麻烦所以干脆不管」——错上加错，工具在，责任也在。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 给全公司立两条规矩：资源只许建在两个区域、存储一律加密。两条都落在 Azure Policy 上自动执行——新资源不合规直接拦下，不用靠「发全员邮件提醒」这种软约束。\n\n**关联服务**：Azure Policy（治理的实装，D3.2）、Microsoft Entra ID（身份与访问，2.4.1）、加密与网络隔离（安全能力的载体）。\n\n#### 描述可管理性的好处\n\n> 官方原名：Describe the benefits of manageability in the cloud\n\n**这条在问什么。** 考题问「大批资源怎么管得过来」。可管理性是四对好处里最「工具向」的一条，给域 3 埋了大量伏笔。\n\n**定义**：可管理性（manageability）指对云资源做规模化日常管理的能力：部署、配置、监控、修补。云给的两条主要路：\n\n1. **统一的操作面**：门户、命令行、接口——同一套工具管所有资源。对应域 3 的 Azure 门户、Cloud Shell、CLI、PowerShell（D3.3）。\n2. **基础设施即代码**（IaC，infrastructure as code，把环境写成模板文件、按模板自动部署）：一次写好，处处复用，环境一致。对应域 3 的 ARM 模板（D3.3）。\n\n**怎么运作**。可管理性的核心收益是「一致性」：同一模板在测试环境与生产环境长出来的是同一副样子；同一命令对一台与一百台机器同样有效。规模越大，这个收益越值钱。\n\n**什么时候用，什么时候别用**。判断「云资源多了就管不过来」——错，恰恰相反：云的管理工具随规模摊薄人力。但「可管理」不等于「自动管理」——IaC、策略、监控都要先配置，域 3 全是这些事。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的环境申请流程原来靠邮件传清单、运维手工点门户。改用模板后：新项目组提交一份参数文件，十分钟自动生成全套环境——虚拟网络、存储、监控一次到位，规格与生产环境分毫不差。环境退役时整套删除，也不留孤儿资源。\n\n**关联服务**：Azure 门户、Cloud Shell、CLI、PowerShell（操作面，D3.3）、基础设施即代码与 ARM 模板（模板路线，D3.3）、Azure Monitor（监控路线，D3.4）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「高可用就是永远不会停机」 | 高可用是兜底与恢复的承诺，不是永动机 | 高可用指尽可能长时间在线，由 SLA 给出承诺，背后靠分散与冗余 |\n| 「可扩展就是会自动扩」 | 混淆「具备能力」与「自动发生」 | 可扩展指容量能加减；自动扩要另配规则，不是天然发生 |\n| 「可靠性和高可用是一回事」 | 一个管故障后的恢复力，一个管在线时长 | SLA 百分比是可用性的口径；可靠性是更宽的恢复能力 |\n| 「上了云就自动合规」 | 混淆「厂商给证据」与「你被认定合规」 | 厂商提供合规认证与审计证据，合规动作与数据责任仍归你 |\n| 「云资源一多就管不过来」 | 恰恰相反，管理工具随规模摊薄人力 | 同一命令对一台与一百台机器同样有效；要「可重复」就上命令行或模板 |\n| 「云的成本天然可预测」 | 透明不等于可预测 | 用定价计算器与预算工具去管才叫可预测，不管就只是透明 |\n\n#### 记忆要点\n\n1. **四对好处**：高可用与可扩展、可靠与可预测、安全与治理、可管理，容易混的是一对里的两个词。\n2. **扩展两向**：纵向升档位，横向加减台数；能加也要能减，只加不减就是白付钱。\n3. **分工两诀**：可靠靠设计与冗余，可预测靠透明与工具。\n4. **安全砖论**：云给现成的砖——身份、加密、隔离；墙靠你配置砌，用错配置好砖也白搭。\n5. **治理集中**：身份、策略、审计集中一处配置，一处修正全局生效。\n6. **管理两路**：统一操作面加基础设施即代码，核心收益是一致性。\n\n---"},{"h":"描述云服务类型","body":"#### 这一节学什么\n这一节对应考纲任务 1.3「描述云服务类型」。\n\n> 官方原名：Describe cloud service types\n\n三个技能点讲三层服务类型，第四个讲选型。这四条和共享责任模型（1.1.2）是本域最大联动：服务类型决定你租到哪一层，责任线就移到哪一层。考试在这两块之间来回串。\n\n#### 描述基础设施即服务（IaaS）\n\n> 官方原名：Describe infrastructure as a service (IaaS)\n\n**这条在问什么。** 考题给一个场景——「把老系统原样搬上云、要自己管操作系统」——让你认出 IaaS。辨析点始终是「你租到哪一层」。\n\n**定义**：基础设施即服务（IaaS，infrastructure as a service）租的是「计算、存储、网络」这最底一层。你拿到虚拟机、磁盘、虚拟网络这些原料，操作系统、中间件、应用全部自己装自己管。云服务商负责到底层虚拟化为止。\n\nAzure 里的代表就是虚拟机（2.2.1 讲过它作为计算形态的那一面）。对照传统的「买实体服务器」：IaaS 把「买」变成「租」，把「等采购数月」变成「分钟级开通」，但机器里的事——装系统、打补丁、备份——仍归你。\n\n**怎么运作**。责任线（1.1.2）在 IaaS 这档划在虚拟化层之上：物理硬件、机房、电力是服务商的；操作系统开始往上是你的。\n\n**什么时候用，什么时候别用**。三种典型该用：整体平移已有系统（lift-and-shift，原样搬不动架构）、要操作系统级完全控制、临时测试环境要快开快毁。不该用：只想跑一个网站、连系统都不想碰——那是 PaaS 的活（1.3.2）。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的老 ERP 带着一堆定制中间件上云，不敢动架构。方案：IaaS 虚拟机原样搬——系统、补丁、备份由公司运维照旧管，云只换了「机器从哪来」这一段。\n\n**关联服务**：Azure 虚拟机（IaaS 的代表，2.2.1、2.2.3）、虚拟网络与存储（配套原料，2.2.5、2.3.1）、共享责任模型（责任线联动，1.1.2）。\n\n#### 描述平台即服务（PaaS）\n\n> 官方原名：Describe platform as a service (PaaS)\n\n**这条在问什么。** 考题给「只想带代码来、不想碰服务器」的场景，认出 PaaS。它和 IaaS 的分界是「操作系统归谁管」。\n\n**定义**：平台即服务（PaaS，platform as a service）租的是「运行环境」：你带代码和数据来，操作系统、运行时、补丁、扩容全由平台管。你从「管机器」里解放出来，只管应用本身。\n\nAzure 的代表是应用服务的 Web 应用托管（2.2.4 从「托管选项滑杆」角度讲过它）。无服务器（1.1.7）可以看作 PaaS 的更极致一档——连「部署单元」都缩成了一段函数。\n\n**怎么运作**。责任线在 PaaS 这档划在运行环境之上：机器到运行时全是服务商的；你管应用代码、数据、配置。开发团队从此不当运维——省下的时间换成迭代速度。\n\n**什么时候用，什么时候别用**。开发团队专注交付、要快发布、不想养运维 → PaaS。需要特殊系统级定制（老驱动、非常规组件）→ 降回 IaaS。代价要想清楚：平台环境有边界，装不了任意东西——为换省心放弃部分自由，这笔交换要认。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的新官网用主流框架写成，直接托上 Web 应用平台：代码推上去就跑、流量涨了自动扩、系统补丁从没进过团队视野。对比隔壁部门同规模网站自管三台虚机，团队多花了两个人力在打补丁上——这就是档位选择的账。\n\n**关联服务**：Azure App Service（PaaS 代表，2.2.4）、Azure Functions（PaaS 的极致档，1.1.7）、共享责任模型（责任线上移，1.1.2）。\n\n#### 描述软件即服务（SaaS）\n\n> 官方原名：Describe software as a service (SaaS)\n\n**这条在问什么。** 考题给「连代码都没有、开浏览器就用」的场景，认出 SaaS。它考的另一个点是「你还管什么」——答案是只剩数据和配置。\n\n**定义**：软件即服务（SaaS，software as a service）租的是「整套成品软件」：应用、运行环境、底层设施全部由服务商运营，你通过浏览器使用，按人头或按用量付费。最熟的例子是办公全家桶类服务（如 Microsoft 365）。\n\n**怎么运作**。责任线在 SaaS 这档几乎划到顶：从机房到应用全归服务商；你管两样——你的数据，和你的使用配置。这和共享责任模型（1.1.2）的口径闭环：数据永远是你的责任，用 SaaS 也不例外。\n\n**什么时候用，什么时候别用**。标准化程度高的办公工具（邮件、文档协作、会议）→ SaaS 立刻上线。核心业务的深度定制需求 → SaaS 改不动，回 PaaS 自己开发。判断题把「SaaS 数据丢了算服务商的」——错，配置错共享范围、误删数据这类事，责任在租户侧。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 全公司上邮件与文档协作套件：IT 只配了账号与权限策略，没碰过一台服务器。同月法务要求自建合规归档系统——那套改不动 SaaS 的产品边界，走 PaaS 自研。两件事各归各的档位。\n\n**关联服务**：Microsoft 365（SaaS 代表）、共享责任模型（数据责任的锚点，1.1.2）、租户侧配置（你仅剩的管理面）。\n\n#### 辨认各云服务类型的适用场景\n\n> 官方原名：Identify appropriate use cases for each cloud service type (IaaS, PaaS, and SaaS)\n\n**这条在问什么。** 收口题：给一个需求，三层里选一层。这条几乎必然和责任线（1.1.2）联动出题——选了哪层，责任线就落在哪档。\n\n**定义**：选型就是问三个问题：\n\n1. 要自己控制操作系统吗？要 → IaaS。\n2. 只想写代码、系统谁管无所谓？→ PaaS。\n3. 连代码都不想写，用现成成品？→ SaaS。\n\n责任线跟着答案移动：IaaS 你管得最多，SaaS 你管得最少，「你的数据与访问」这段永远不动。\n\n**怎么运作**。现实里三层并存是常态：一家公司 ERP 用 IaaS 平移、官网用 PaaS 托管、办公套件用 SaaS。给每个负载选「够用的最低层」，比一刀切更省钱也更好管——这也呼应无服务器（1.1.7）：粒度再细一档，按事件跑代码。\n\n**什么时候用，什么时候别用**。判断题把三层说成「先进程度」递进、必须往高层迁——错，三层的差别是「你租到哪一层」，不是优劣；为「显得现代」把可控性需求硬塞进 SaaS 是倒退。反过来「全用 IaaS 最保险」也不成立——那是把所有运维都留给自己。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 盘点一遍：老 ERP 走 IaaS 原样搬；新报表门户走 PaaS 快速迭代；邮件办公走 SaaS 现成用。三个负载三层各就各位，年成本比「全部 IaaS 自建」低三成，比「全部硬套 SaaS」少一串例外流程。\n\n**关联服务**：IaaS/PaaS/SaaS（三层本身）、共享责任模型（责任线联动，1.1.2）、无服务器（第四档细化，1.1.7）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「三层是先进程度，越往上越现代」 | 差别是「你租到哪一层」，不是优劣 | 为「显得现代」把可控性需求硬塞进 SaaS 是倒退；反过来全押 IaaS 也不成立 |\n| 「PaaS 的补丁和扩容还得自己操心」 | 操作系统、运行时、补丁、扩容全由平台管 | 你带代码和数据来，从「管机器」里解放出来，只管应用本身 |\n| 「SaaS 数据丢了算服务商的责任」 | 错配共享范围、误删数据都是租户侧的事 | 你管的还是两样：你的数据，和你的使用配置 |\n| 「PaaS 想怎么定制都行」 | 平台环境有边界，装不了任意东西 | 越界需求降级到容器或虚拟机 |\n| 「老系统上云必须先重构架构」 | 原样平移正是 IaaS 的典型用法 | lift-and-shift 整体搬，云只换「机器从哪来」 |\n| 「IaaS 的虚拟机连操作系统都不用管」 | 恰恰相反，IaaS 你管到操作系统 | IaaS 租的是计算、存储、网络原料；装系统、打补丁、备份都归你 |\n\n#### 记忆要点\n\n1. **三问选层**：要控制操作系统选 IaaS，只想写代码选 PaaS，用现成成品选 SaaS。\n2. **责任线动**：IaaS 管得最多，SaaS 管得最少；「你的数据与访问」这段永远不动。\n3. **IaaS 场景**：原样平移老系统、要操作系统级控制、临时测试环境。\n4. **PaaS 边界**：换掉的是一整条运维线；代价是平台环境装不了任意东西。\n5. **SaaS 只管**：数据与使用配置两样；深度定制需求回 PaaS 自己开发。\n6. **三层并存**：给每个负载选够用的最低层，比一刀切省钱也好管。\n\n---"}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 1.1.1 | 云计算定义与「按需租用+按量计费」特征 | ⭐⭐⭐ | 单选 |\n| 1.1.2 | 共享责任模型的责任归属判断 | ⭐⭐⭐ | 单选/判断 |\n| 1.1.3 | 公有、私有、混合云的辨析 | ⭐⭐⭐ | 情景单选 |\n| 1.1.4 | 三种云模型的选型约束 | ⭐⭐ | 情景单选 |\n| 1.1.5 | 消费型模型与 CapEx/OpEx 归类 | ⭐⭐⭐ | 单选 |\n| 1.1.6 | 按需、预留、Spot 的定价形态匹配 | ⭐⭐ | 情景单选 |\n| 1.1.7 | 无服务器的「按执行计费、全自动伸缩」 | ⭐⭐⭐ | 单选/判断 |\n| 1.2.1 | 高可用性与可扩展性（含两个方向） | ⭐⭐⭐ | 单选 |\n| 1.2.2 | 可靠性与可预测性（两个维度） | ⭐⭐ | 单选/判断 |\n| 1.2.3 | 安全与治理的自带能力与责任边界 | ⭐⭐ | 单选/判断 |\n| 1.2.4 | 可管理性：统一操作面与基础设施即代码 | ⭐⭐ | 单选 |\n| 1.3.1 | IaaS 的租用层级与场景 | ⭐⭐⭐ | 情景单选 |\n| 1.3.2 | PaaS 的租用层级与权衡 | ⭐⭐⭐ | 情景单选 |\n| 1.3.3 | SaaS 的租用层级与「你只管数据与配置」 | ⭐⭐⭐ | 单选 |\n| 1.3.4 | 三层选型与责任线联动 | ⭐⭐⭐ | 情景单选/拖拽 |","services":"| 服务 | 主要用途 | 涉及知识点 |\n|---|---|---|\n| Azure（公有云平台） | 云计算定义的承载与多租户隔离 | 1.1.1、1.1.3 |\n| 共享责任模型 | 责任归属的判断框架 | 1.1.2、1.3.1~1.3.4 |\n| 私有云/混合云环境 | 独占部署与两边互通形态 | 1.1.3、1.1.4 |\n| 按需计费/预留/Spot | 定价形态与负载匹配 | 1.1.6 |\n| Azure Functions | 无服务器的实例 | 1.1.7 |\n| SLA | 高可用的承诺口径 | 1.2.1 |\n| Azure Policy | 治理的自动化实装 | 1.2.3 |\n| Azure 门户/CLI/IaC | 可管理性的两条路线 | 1.2.4 |\n| Azure 虚拟机 | IaaS 的代表服务 | 1.3.1 |\n| Azure App Service | PaaS 的代表服务 | 1.3.2 |\n| Microsoft 365 | SaaS 的代表服务 | 1.3.3 |","furtherReading":"| 页面 | 什么时候去看 | URL |\n|---|---|---|\n| AZ-900 Study Guide | 3 域 / 11 组 / 57 技能点原文与权重区间 | https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-900 |\n| Azure pricing | 三种定价形态的官方口径 | https://azure.microsoft.com/en-us/pricing |\n| Azure SLA overview | 服务等级协议的官方口径 | https://azure.microsoft.com/en-us/support/legal/sla/ |\n| Exam duration and experience | 官方不公布具体题型 | https://learn.microsoft.com/en-us/credentials/support/exam-duration-exam-experience |\n\n这些页面都是微软官方公开文档。中文资料与英文原文说法不一致时，以英文原文为准。\n\n> 编写说明：本文件为睿鸿内部学习资料，非 Microsoft 官方教材。技能点原文取自官方 Study Guide 与 Microsoft Learn 官方文档（2026-11-16 实查），中文表述由我方整理并经人工审校；与官方英文原文不一致时以官方为准。"}},{"domain":2,"name":"描述 Azure 体系结构与服务","weight":"35–40%","practice":[{"id":"D2-001","d":2,"t":"single","q":"一家医疗器械公司要求影像数据必须存放在中国境内，并由本地持牌运营商独立运营。这类区域属于哪一类","o":[{"l":"A","t":"区域对，它保证两个区域互为灾备备份"},{"l":"B","t":"可用性区域，它在一个区域内做物理隔离"},{"l":"C","t":"主权区域，例如由世纪互联运营的 Azure 中国区"},{"l":"D","t":"地理区域，它按大洲把区域分堆"}],"a":["C"],"e":"**正确答案：C。** 主权区域，例如由世纪互联运营的 Azure 中国区。\n\n**为什么对：** 主权区域为特殊监管需求单独运营，Azure Government 与世纪互联运营的 Azure 中国区是两个典型例子。关联考点：官方技能点 2.1.1「描述 Azure 区域、区域对和主权区域」，内容领域 2。\n\n**其他选项为什么错：**\n- A：区域对，它保证两个区域互为灾备备份。区域对讲的是灾备搭档关系，不解决数据由谁运营这一监管问题。\n- B：可用性区域，它在一个区域内做物理隔离。可用性区域解决的是机房级故障隔离，与数据主权归属无关。\n- D：地理区域，它按大洲把区域分堆。地理区域只是分组边界，具体落点与运营方仍要看区域本身。\n\n**关键概念：** 主权区域回答谁运营、受哪套监管，区域对和可用性区域回答的是抗故障。本题对应考纲 2.1.1。","s":"自编·2.1.1"},{"id":"D2-002","d":2,"t":"multiple","q":"关于区域对的实际行为，下列说法哪些正确","o":[{"l":"A","t":"配对关系需要你手工在两个区域之间配置"},{"l":"B","t":"同一地理区域内任意两个区域都互为配对"},{"l":"C","t":"配对的两个区域错开时间做计划维护"},{"l":"D","t":"区域对会自动把资源跨区复制一份"},{"l":"E","t":"多数配对区域相距较远，至少三百英里"},{"l":"F","t":"主权区域也按常规规则参与区域对"}],"a":["C","E"],"e":"**正确答案：C、E。** 配对的两个区域错开时间做计划维护；多数配对区域相距较远，至少三百英里。\n\n**为什么对：** 区域对的价值是错峰维护与地理拉开距离，它给的是灾备基础关系，不等于替你复制数据。关联考点：官方技能点 2.1.1「描述 Azure 区域、区域对和主权区域」，内容领域 2。\n\n**其他选项为什么错：**\n- A：配对关系需要你手工在两个区域之间配置。配对由平台预先指定，不需要手工配置。\n- B：同一地理区域内任意两个区域都互为配对。配对是官方指定的成对关系，不是区域内自由组合。\n- D：区域对会自动把资源跨区复制一份。平台只给配对关系与错峰维护，复制靠服务自身冗余。\n- F：主权区域也按常规规则参与区域对。主权区域单独运营、受另一套合规约束。\n\n**关键概念：** 维护错峰、距离够远；复制仍靠服务自身的冗余能力。本题对应考纲 2.1.1。","s":"自编·2.1.1"},{"id":"D2-003","d":2,"t":"single","q":"某区域内的一个数据中心因供电故障整体断电，业务要求同城其余机房继续提供服务。应依靠哪种机制","o":[{"l":"A","t":"把承担同一角色的虚拟机分散到同一区域内的多个可用性区域"},{"l":"B","t":"把副本放到另一个配对的区域去"},{"l":"C","t":"在同一个可用性区域内多开几台虚拟机"},{"l":"D","t":"给这些资源加一条删除锁防误删"}],"a":["A"],"e":"**正确答案：A。** 把承担同一角色的虚拟机分散到同一区域内的多个可用性区域。\n\n**为什么对：** 可用性区域是区域内部物理隔离的数据中心群，各有独立供电与制冷；同一角色分散到不同区，一处故障时其余继续接流量。关联考点：官方技能点 2.1.2「描述可用性区域」，内容领域 2。\n\n**其他选项为什么错：**\n- B：把副本放到另一个配对的区域去。区域对兜的是整个区域级故障，用在机房级故障上属于层次用错。\n- C：在同一个可用性区域内多开几台虚拟机。同一可用性区域内共享供电与制冷，一处故障仍会一起受影响。\n- D：给这些资源加一条删除锁防误删。资源锁防的是误操作，与物理故障时的持续可用无关。\n\n**关键概念：** 机房级故障找可用性区域，区域级故障找区域对，两层各管各的。本题对应考纲 2.1.2。","s":"自编·2.1.2"},{"id":"D2-004","d":2,"t":"single","q":"管理员希望平台自动把数据分散到多个可用性区域，不必逐台指定落在哪个区。这类服务叫什么","o":[{"l":"A","t":"区级服务"},{"l":"B","t":"主权区域服务"},{"l":"C","t":"本地冗余服务"},{"l":"D","t":"区域级冗余服务"}],"a":["D"],"e":"**正确答案：D。** 区域级冗余服务。\n\n**为什么对：** 官方按使用区域的方式把服务分成两类：区级服务由你指定落区，区域级冗余服务由平台自动跨区分散。关联考点：官方技能点 2.1.2「描述可用性区域」，内容领域 2。\n\n**其他选项为什么错：**\n- A：区级服务。区级服务恰恰要你主动指定资源落在哪个可用性区域，方向相反。\n- B：主权区域服务。主权区域讲运营与合规归属，不描述区内的分散方式。\n- C：本地冗余服务。本地冗余在同一设施内复制多份，抗不住整处机房故障。\n\n**关键概念：** 区级等于你指定落点，区域级冗余等于平台自动分散，差别在使用方式。本题对应考纲 2.1.2。","s":"自编·2.1.2"},{"id":"D2-005","d":2,"t":"single","q":"关于数据中心、可用性区域与区域的包含关系，下列说法正确的是","o":[{"l":"A","t":"一个区域就是一个数据中心，只是叫法不同"},{"l":"B","t":"一个可用性区域最多只含一个数据中心"},{"l":"C","t":"一个可用性区域可含多个数据中心，区域由一个或多个可用性区域组成"},{"l":"D","t":"数据中心由多个区域组成，跨区域共用供电"}],"a":["C"],"e":"**正确答案：C。** 一个可用性区域可含多个数据中心，区域由一个或多个可用性区域组成。\n\n**为什么对：** 从物理结构看三层从小到大，数据中心小于可用性区域，可用性区域又小于区域，每层都包含一个或多个下层。关联考点：官方技能点 2.1.3「描述 Azure 数据中心」，内容领域 2。\n\n**其他选项为什么错：**\n- A：一个区域就是一个数据中心，只是叫法不同。区域比数据中心大两级，中间还隔着可用性区域。\n- B：一个可用性区域最多只含一个数据中心。官方口径是一个或多个，把最少说成最多属于收窄。\n- D：数据中心由多个区域组成，跨区域共用供电。包含方向说反了，数据中心是最小的物理单元。\n\n**关键概念：** 记牢从小到大三层，判断题里见到区域等于一个机房直接判错。本题对应考纲 2.1.3。","s":"自编·2.1.3"},{"id":"D2-006","d":2,"t":"single","q":"临时演示环境用完要一次清理干净，且不留继续计费的孤儿资源。最合适的做法是","o":[{"l":"A","t":"给每个资源加删除锁再逐个手工删"},{"l":"B","t":"把演示资源全部放进同一资源组，结束后删除该资源组"},{"l":"C","t":"把资源同时归入两个资源组，两边都能看到"},{"l":"D","t":"停用这些资源所在的订阅"}],"a":["B"],"e":"**正确答案：B。** 把演示资源全部放进同一资源组，结束后删除该资源组。\n\n**为什么对：** 资源组是装资源的逻辑容器，权限、策略与标签可在组上统一生效；删组会连同组内资源一起删除，正好对应一次清干净。关联考点：官方技能点 2.1.4「描述 Azure 资源与资源组」，内容领域 2。\n\n**其他选项为什么错：**\n- A：给每个资源加删除锁再逐个手工删。锁只是防误删的保险，逐个删除既慢又容易漏。\n- C：把资源同时归入两个资源组，两边都能看到。每个资源只能属于一个资源组，多重归属在 Azure 里不成立。\n- D：停用这些资源所在的订阅。停订阅会波及该订阅下所有业务，代价远大于删一个资源组。\n\n**关键概念：** 一起建、一起删、一起管的资源放同一组，跨项目共用的资源单独成组。本题对应考纲 2.1.4。","s":"自编·2.1.4"},{"id":"D2-007","d":2,"t":"single","q":"财务要求市场部与技术部的云费用分开出账，两边的资源也要互不干扰。最直接的做法是","o":[{"l":"A","t":"为两个部门各开一个订阅，资源组挂在各自订阅下"},{"l":"B","t":"在同一订阅里用标签区分部门，月底按标签拆账"},{"l":"C","t":"为每个部门建管理组，把资源直接放在管理组下"},{"l":"D","t":"为每个部门各建一个资源组，靠资源组做隔离"}],"a":["A"],"e":"**正确答案：A。** 为两个部门各开一个订阅，资源组挂在各自订阅下。\n\n**为什么对：** 订阅是计费与管理的基本单元，Azure 按订阅出账单、按订阅划边界；既要独立结算又要互不牵连，开两个订阅最直接。关联考点：官方技能点 2.1.5「描述订阅」，内容领域 2。\n\n**其他选项为什么错：**\n- B：在同一订阅里用标签区分部门，月底按标签拆账。标签能辅助分摊，但账单本身仍是一份，管理边界也没分开。\n- C：为每个部门建管理组，把资源直接放在管理组下。资源不能直接挂在管理组下，管理组装的是订阅。\n- D：为每个部门各建一个资源组，靠资源组做隔离。资源组能做权限隔离，但不产生独立账单，计费边界仍在订阅。\n\n**关键概念：** 订阅切计费与管理边界，本身不产生费用，费用跟着订阅下的资源走。本题对应考纲 2.1.5。","s":"自编·2.1.5"},{"id":"D2-008","d":2,"t":"single","q":"一家只有三个订阅、策略也只有一条的公司，要不要为每层组织结构再拆出更多订阅","o":[{"l":"A","t":"要拆，订阅越多层级越清晰，管理成本越低"},{"l":"B","t":"要拆，订阅数量直接决定可用性等级"},{"l":"C","t":"不拆，因为订阅本身要按月付费"},{"l":"D","t":"不必拆，订阅数量按是否需要独立计费或独立管理边界来定"}],"a":["D"],"e":"**正确答案：D。** 不必拆，订阅数量按是否需要独立计费或独立管理边界来定。\n\n**为什么对：** 订阅的价值在切分计费与管理边界，三五个订阅配一条策略时直接在订阅层配更省事，组织清晰不靠多开订阅体现。关联考点：官方技能点 2.1.5「描述订阅」，内容领域 2。\n\n**其他选项为什么错：**\n- A：要拆，订阅越多层级越清晰，管理成本越低。每多一个订阅就多一套权限与策略要维护，成本是上升的。\n- B：要拆，订阅数量直接决定可用性等级。可用性由区域与可用性区域决定，与订阅数量无关。\n- C：不拆，因为订阅本身要按月付费。订阅本身不产生费用，这个理由不成立；真正的理由是管理成本。\n\n**关键概念：** 用两个问题决定开不开订阅：是否要独立结算，是否要独立管理边界。本题对应考纲 2.1.5。","s":"自编·2.1.5"},{"id":"D2-009","d":2,"t":"single","q":"公司有三十个订阅，安全团队要求所有订阅都禁止在特定区域创建资源，新订阅也要自动受约束。策略应挂在哪一层","o":[{"l":"A","t":"在每个订阅上分别挂同一条策略"},{"l":"B","t":"在每个资源组上挂策略，颗粒度更细更安全"},{"l":"C","t":"挂在覆盖这些订阅的管理组上，新订阅加入后自动继承"},{"l":"D","t":"在管理组树里随便挑一层挂上即可"}],"a":["C"],"e":"**正确答案：C。** 挂在覆盖这些订阅的管理组上，新订阅加入后自动继承。\n\n**为什么对：** 管理组是装订阅的容器，策略与角色在组上一次下发，其下订阅全部继承，新订阅挂进这棵树就自动带上规则。关联考点：官方技能点 2.1.6「描述管理组」，内容领域 2。\n\n**其他选项为什么错：**\n- A：在每个订阅上分别挂同一条策略。三十个订阅逐条维护，新订阅容易漏配，正是管理组要解决的问题。\n- B：在每个资源组上挂策略，颗粒度更细更安全。资源组数量远多于订阅，规则散落一地，维护量反而更大。\n- D：在管理组树里随便挑一层挂上即可。继承只向下生效，挂错分支就覆盖不到其余业务线的订阅。\n\n**关键概念：** 治理收口用管理组，继承方向固定自上而下，下层不能反向改上层。本题对应考纲 2.1.6。","s":"自编·2.1.6"},{"id":"D2-010","d":2,"t":"single","q":"一名员工说自己没申请过权限，却能列出部门订阅里的全部资源。按层级排查应先看哪一层","o":[{"l":"A","t":"先看资源本身是否被单独授予读取角色"},{"l":"B","t":"先看该订阅所在的管理组是否授予了广泛的读取权限"},{"l":"C","t":"先看资源组上是否打了允许访问的标签"},{"l":"D","t":"先看该订阅是否设置了只读锁"}],"a":["B"],"e":"**正确答案：B。** 先看该订阅所在的管理组是否授予了广泛的读取权限。\n\n**为什么对：** 权限沿层级自上而下继承，顺序是管理组、订阅、资源组、资源；多数多出来的权限来自上层继承，所以从上层查最快。关联考点：官方技能点 2.1.7「描述资源组、订阅与管理组的层级」，内容领域 2。\n\n**其他选项为什么错：**\n- A：先看资源本身是否被单独授予读取角色。资源层直授影响面最小，通常不是大面积可见的来源。\n- C：先看资源组上是否打了允许访问的标签。标签用于组织与计费，不参与访问控制判定。\n- D：先看该订阅是否设置了只读锁。资源锁限制写操作，不授予读取权限，也不是权限来源。\n\n**关键概念：** 层级就是排查地图，越通用的规则越往上放，查权限先查上层继承。本题对应考纲 2.1.7。","s":"自编·2.1.7"},{"id":"D2-011","d":2,"t":"single","q":"团队给三个负载选计算形态：老 ERP 整体搬上云、订单服务拆成了八个微服务、上传图片自动生成缩略图。最合适的组合是","o":[{"l":"A","t":"ERP 用虚拟机、微服务用容器、缩略图用函数"},{"l":"B","t":"三个负载全部用虚拟机承载"},{"l":"C","t":"三个负载全部塞进函数运行"},{"l":"D","t":"微服务与缩略图都用虚拟机、ERP 用容器"}],"a":["A"],"e":"**正确答案：A。** ERP 用虚拟机、微服务用容器、缩略图用函数。\n\n**为什么对：** 三形态是一条控制力递减的滑杆：虚机控制力最强适合原样迁移，容器应用级打包适合小服务并行，函数按事件执行适合短小逻辑，三个负载各对上一档。关联考点：官方技能点 2.2.1「比较计算类型：容器、虚拟机和函数」，内容领域 2。\n\n**其他选项为什么错：**\n- B：三个负载全部用虚拟机承载。微服务与缩略图要的是轻量快启动，全用虚机运维负担最重。\n- C：三个负载全部塞进函数运行。长驻的老系统与执行模型不合拍，函数只适合短小逻辑。\n- D：微服务与缩略图都用虚拟机、ERP 用容器。方向说反了，ERP 恰恰最需要虚机的系统级承载。\n\n**关键概念：** 控制力虚机最强、函数最省心，按负载特征沿滑杆选形态。本题对应考纲 2.2.1。","s":"自编·2.2.1"},{"id":"D2-012","d":2,"t":"single","q":"运维新人问「容器和函数到底差在哪」。下列说法最准确的是","o":[{"l":"A","t":"容器也要自己给宿主操作系统打补丁"},{"l":"B","t":"函数按运行时长收固定月费"},{"l":"C","t":"容器只适合跑数据库这类有状态服务"},{"l":"D","t":"容器打包应用与依赖共用宿主系统，函数只写响应事件的代码"}],"a":["D"],"e":"**正确答案：D。** 容器打包应用与依赖共用宿主系统，函数只写响应事件的代码。\n\n**为什么对：** 容器把应用和依赖打包成轻量单元，秒级启动适合微服务；函数更进一步，服务器分配与扩缩全由平台代管，两者差在打包粒度与代管深度。关联考点：官方技能点 2.2.1「比较计算类型：容器、虚拟机和函数」，内容领域 2。\n\n**其他选项为什么错：**\n- A：容器也要自己给宿主操作系统打补丁。宿主系统维护归平台，容器里你只管应用本身。\n- B：函数按运行时长收固定月费。函数按实际执行计费，没执行就不计费。\n- C：容器只适合跑数据库这类有状态服务。容器适合拆成小服务并行跑的场景，不限有状态。\n\n**关键概念：** 容器管打包、函数管事件，代管深度函数更深一层。本题对应考纲 2.2.1。","s":"自编·2.2.1"}],"sections":[{"h":"描述 Azure 的核心体系结构组件","body":"### 这一域考什么\n\n这一域问的是 Azure 的骨架：你的东西放在哪、归谁管、怎么跑起来、怎么连起来。\n\n四条线串起全章：\n\n1. **体系结构组件**：区域、数据中心这类「物理上放哪」的概念，加上资源组、订阅这类「逻辑上归谁管」的层级，对应任务 2.1。\n2. **计算与网络**：应用用什么形态跑（虚拟机、容器、函数），资源之间怎么连通，对应任务 2.2。\n3. **存储**：文件和数据放哪、怎么分档、怎么迁移，对应任务 2.3。\n4. **身份与安全**：谁能登录、谁能碰哪些资源，对应任务 2.4。\n\n这门课是入门课，考核动词以 Describe（描述）、Compare（比较）、Identify（辨认）为主。它不考你在门户里点哪个按钮，考的是你能不能看着一句描述，说出它指的是哪个概念、适合什么场景。\n\n### 读完这个域要能做什么\n\n这门课写给有 IT 经验、但还没用过云的同事。你懂公司内网、服务器、数据库这些概念，只是没在云上碰过它们。读完本域应能：\n\n- 说出一个 Azure 资源从创建到被管理，要经过哪几层结构。\n- 给一个业务场景，选对计算形态：虚拟机、容器还是函数。\n- 看懂虚拟网络、子网、对等互连、VPN 网关、专线各自解决什么连接问题。\n- 区分一个服务的公共访问入口和内部专用入口分别是什么。\n- 给一份数据（形态、访问频率、容灾要求），选出存储服务、访问层与冗余档位。\n- 给一个访问场景，说出该用哪种验证方式、该在哪个作用域给哪个角色。\n\n### 和其他认证怎么接\n\n这门课不是孤立的。同一件事在别家云、别的级别里换了名字，认出来就不必重学。下面三条对照都按「哪里像、哪里不一样」写，不谈哪套更好。\n\n| 其他认证课 | 对应的那件事 | 这里有什么不同 | 什么时候该想起它 |\n|---|---|---|---|\n| AWS 云从业者（CLF-C02） | 区域、可用区的地理概念 | 两边都是「区域里套隔离单元」的结构，Azure 把灾备配对关系明确叫区域对，概念名不同、骨架相同 | 学地理概念觉得抽象时 |\n| Azure 管理员（AZ-104） | 本域的全部组件就是它的操作对象 | AZ-900 只要求你「认得出」，AZ-104 要求你「管得住」；本域是那门课默认你已经会的部分 | 打算往 AZ-104 进阶时 |\n| Azure 架构师专家（AZ-305） | 用同一套组件做架构设计决策 | AZ-305 会问你「为什么这么搭」，本域只问「这是什么」 | 学完想继续走架构方向时 |\n\n对照只用来帮你迁移已有理解。做题时以本域的官方口径为准，别把别家云的默认值带进来。\n\n### 官方口径的三条边界\n\n- 官方 Study Guide 只给技能点，不给题型，也不给题数。\n- 官方考试政策原句写明：考前不公布具体考试形式或题型。\n- 官方权重是 35–40% 这样的区间，不是精确占比。\n\n这三条决定了本文件的表格怎么填。凡是官方没说的，表里就写官方未公布，不拿练习题的印象补空。\n\n#### 这一节学什么\n这一节对应考纲任务 2.1「描述 Azure 的核心体系结构组件」。\n\n> 官方原名：Describe the core architectural components of Azure\n\n先讲「放在哪」，再讲「归谁管」。前三个技能点（区域、可用性区域、数据中心）是地理概念，从大到小一层套一层；后四个技能点（资源组、订阅、管理组、层级）是管理概念，从下到上一层层收口。七条合起来，就是你在 Azure 世界里的「地图」和「行政树」。\n\n考题最喜欢拿这两套结构出判断题：把「数据中心」和「可用性区域」的大小关系说反，或者把「资源组」和「订阅」的包含方向搞混。学的时候抓住「谁包含谁」这条线。\n\n#### 描述 Azure 区域、区域对和主权区域\n\n> 官方原名：Describe Azure regions, region pairs, and sovereign regions\n\n**这条在问什么。** 考试会给你一句场景描述，让你认出它说的是三个地理概念里的哪一个。典型场景：客户数据必须留在境内、某个区域整体故障时怎么兜底。\n\n**定义**：区域（region）是世界上某个地理位置附近的一组数据中心。你建的每个 Azure 资源都落在某个具体区域里，选哪个区域，决定了数据的物理位置和访问延迟（延迟指数据来回一趟花的时间）。\n\n区域对（region pairs）是官方给每个区域指定好的「灾备搭档」：同一地理区域内的两个区域配成一对，出大事故时另一个接得住。主权区域（sovereign regions）是为特殊监管需求单独运营的区域，例如面向美国政府的 Azure Government，以及由世纪互联在中国独立运营的 Azure 中国区。\n\n**怎么运作**。区域对的关键行为有两条：\n\n- 配对的两个区域错开时间做计划维护，不会同时停机检修。\n- 多数配对区域物理距离较远（官方文档口径：至少相距 300 英里），一个区域发生大范围灾害时，另一个在同一个地理区域内、不受同一批合规限制。\n\n**什么时候用，什么时候别用**。选区域看三件事：用户离哪个区域近、合规要求数据落在哪、各区域定价差异。不是所有服务都在所有区域开放，选定前要查服务可用性。\n\n日常业务里你不需要「手写」区域对——它是平台级的灾备设计。你的考点是认出它的用途，而不是自己配它。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 电商的客户都在国内，且行业监管要求数据留在境内。选区域时先圈出境内可用的区域，再比延迟和定价；灾备方案直接利用平台已有的区域对关系，不必自己再找「备用区域」。\n\n**关联服务**：Azure 区域基础结构页（区域清单与配对关系）、Azure Government 与世纪互联 Azure（两类主权区域实例）。\n\n#### 描述可用性区域\n\n> 官方原名：Describe availability zones\n\n**这条在问什么。** 考题给你「同一个城市里，机房级故障不能拖垮业务」的需求，让你认出答案是可用性区域，并和区域对区分开。两者的分工是：区域对付「整个区域挂了」，可用性区域对付「区域内一处机房挂了」。\n\n**定义**：可用性区域（availability zones）是一个区域内部物理隔离的数据中心群。每个区域由至少一个、通常是三个可用性区域组成，各区域之间有独立的供电、制冷和网络线路。\n\n把你的多台虚拟机分散部署到不同可用性区域，一处机房出故障，其余的照常服务。\n\n**怎么运作**。Azure 把服务按「怎么用区域」分成两类：\n\n- **区级服务（zonal services）**：你主动指定资源落在哪个可用性区域，比如虚拟机。\n- **区域级冗余服务（zone-redundant services）**：平台自动把数据或实例分散到多个可用性区域，你不用逐台指定。\n\n**什么时候用，什么时候别用**。做高可用方案时，区内故障用可用性区域兜，区域级故障用区域对付，两层各管各的。注意不是每个区域都配齐了三个可用性区域，规划前查区域清单。单机、跑一天就删的临时环境，分散部署反而多花心思。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的促销页在大促期间不能停。管理员把承担同一角色的两台虚拟机分别放进两个可用性区域，再配一个自动探测故障的负载均衡入口。一处机房断电，另一个区里的虚拟机继续接流量，用户几乎无感。\n\n**关联服务**：Azure 虚拟机（区级部署的典型对象）、负载均衡类服务（把流量分到多个可用性区域）。\n\n#### 描述 Azure 数据中心\n\n> 官方原名：Describe Azure datacenters\n\n**这条在问什么。** 这条考的是三层嵌套的大小关系：数据中心、可用性区域、区域，谁包含谁。考题常用「以下哪个说法正确」的判断题形式把关系说反。\n\n**定义**：数据中心（datacenter）就是装满服务器、存储和网络设备的物理机房，有独立的供电和制冷系统。可用性区域由一个或多个数据中心组成；区域又由一个或多个可用性区域组成。所以从物理结构上看：数据中心 < 可用性区域 < 区域，三层从小到大。\n\n**怎么运作**。你不会直接「创建一个数据中心」——它是平台底层的物理设施，你在门户里操作的资源最终落在某处数据中心的服务器上。需要你知道的是它在结构里的位置，以及官方不逐区域公布数据中心数量这类口径边界。\n\n**什么时候用，什么时候别用**。判断题里见到「一个区域就是一个数据中心」这类说法，直接判错。一个区域至少有一个可用性区域，而可用性区域本身就能包含多个数据中心。\n\n反过来，「可用性区域之间物理隔离」这类说法是对的，这正是它存在的意义。\n\n💡 **场景举例**（虚构教学示意）：考试给出四个说法，让判断正误：\n\n- 「数据中心是物理设施」。\n- 「一个可用性区域只含一个数据中心」。\n- 「区域由可用性区域组成」。\n- 「可用性区域属于某个区域」。\n\n四句里第一句和第四句对，中间两句要看官方口径里「一个或多个」的措辞。能自己说出判错理由，这条考点就过了。\n\n**关联服务**：无独立可操作服务（数据中心是物理层概念，承载一切 Azure 资源）。\n\n#### 描述 Azure 资源与资源组\n\n> 官方原名：Describe Azure resources and resource groups\n\n**这条在问什么。** 考题给你「临时演示环境用完要一次清干净」「十几个资源要一起下权限」的场景，让你认出资源组是答案。它还顺带考一层理解：资源组和资源是「容器与内容」的关系。\n\n**定义**：资源（resource）是你在 Azure 上创建的每一样东西：一台虚拟机、一个存储账户、一个数据库，都是资源。资源组（resource group）是装资源的逻辑容器。两条铁规矩：每个资源必须属于某个资源组，而且只能属于一个；删除资源组，里面的资源会被一起删掉。\n\n**怎么运作**。资源组的意义在「打包管理」：\n\n- 权限、策略、标签可以打在资源组上，组内资源统一生效。\n- 同一个项目、同一批一起上线下线的资源，放进同一个组，交付和回收都是一次动作。\n\n**什么时候用，什么时候别用**。判断同生命周期：一起建、一起删、一起管的放一组。跨项目共用的东西（比如全公司共用的一个虚拟网络）单独成组，别塞进某个项目组里跟着被删掉。组名要能看出「这是什么环境、归谁管」，半年后回看才不糊涂。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的工程师给客户搭了一套演示环境：一台虚拟机、一个数据库、一个存储账户，全放进名为 demo-1013 的资源组。演示结束，删掉这个组，三样资源一次清空，不留孤儿资源继续计费。\n\n**关联服务**：Azure 资源管理器（ARM，负责组织与部署资源组及资源）、Azure 门户与 Azure CLI（创建与删除的常用入口）。\n\n#### 描述订阅\n\n> 官方原名：Describe subscriptions\n\n**这条在问什么。** 考题给你「两个部门的云费用要分开结算」「给外包团队一个独立的环境」这类需求，让你认出订阅是计费与管理的分界单位。\n\n**定义**：订阅（subscription）是一组资源的计费和管理单元。所有资源组都挂在某个订阅下面，Azure 按订阅出账单、按订阅设管理边界。订阅同时关联到一个身份目录（任务 2.4「描述 Azure 标识、访问和安全」会讲的 Microsoft Entra ID 租户），决定「谁能登录这个订阅里的东西」。\n\n**怎么运作**。一个公司可以有多个订阅，常见切法有两种：\n\n- 按部门或成本中心切：每个订阅一份账单，财务好分摊。\n- 按环境切：生产、测试各一个订阅，出事互不牵连，权限也好隔离。\n\n**什么时候用，什么时候别用**。需要独立计费或独立管理边界时，开订阅最直接。订阅本身不产生费用，费用跟着订阅下的资源走。别为「多一层目录好看」而多开订阅——每多一个订阅，就多一套要管理的权限和策略，管理成本随之上升。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的市场部和技术部都要用云，财务要求分开开票。管理员开两个订阅，两部门的资源组分别挂在各自订阅下，月底两份账单直接对上两个预算科目，不用人肉拆账。\n\n**关联服务**：Microsoft Entra ID（订阅关联的身份目录）、Azure 成本管理（按订阅汇总费用）。\n\n#### 描述管理组\n\n> 官方原名：Describe management groups\n\n**这条在问什么。** 考题给你「公司几十个订阅，安全策略要一次下发、统一生效」的场景，让你认出管理组是订阅之上的治理容器。\n\n**定义**：管理组（management group）是装订阅的容器。订阅归它管，它替你把治理动作一次性应用到一批订阅上。最常见的两类动作：基于角色的访问控制（RBAC，谁能干什么）和 Azure Policy（规则约束，比如「不允许在某些区域建资源」，域 3「描述 Azure 管理和治理」会展开）。\n\n**怎么运作**。管理组可以嵌套，形成一棵树：顶层是根管理组，往下按业务线或部门分，订阅挂在末梢。在树的上层给一条策略，下层全部订阅自动遵守。\n\n订阅在树里的位置可以调整——把某个订阅挂到另一个管理组下，它继承的治理规则就跟着换。\n\n**什么时候用，什么时候别用**。订阅数量多、治理要求统一时，管理组是收口工具。三五个订阅、策略就一条，直接在订阅层配更省事。注意继承方向永远是自上而下：上层管下层，下层不能反过来改上层的规则。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 有 30 个订阅，安全团队要求所有订阅都禁止在特定区域创建资源。做法是在公司级管理组上挂一条 Azure Policy，30 个订阅一次性生效；新订阅挂进这棵树，规则自动带上。\n\n**关联服务**：Azure Policy（经管理组下发规则）、Azure RBAC（经管理组批量授权）。\n\n#### 描述资源组、订阅与管理组的层级\n\n> 官方原名：Describe the hierarchy of resource groups, subscriptions, and management groups\n\n**这条在问什么。** 这是本任务「描述 Azure 的核心体系结构组件」的收口考法。给你四个层级，让你排出从大到小的顺序，或判断某条权限/策略是从哪一层继承下来的。\n\n**定义**：从大到小，四层依次是：管理组 → 订阅 → 资源组 → 资源。资源组是「装资源」的最小容器，它上面是订阅，订阅上面还可以有管理组。继承规则：作用于某一层的权限和策略，对该层以下的所有内容生效。\n\n资源组这一层没有「再往下还有一层」的说法，资源就是最末梢。\n\n**怎么运作**。层级是排查问题的地图。遇到「这个人为什么能看到不该看的资源」，从上往下查：管理组给过宽权限 → 订阅层给了额外角色 → 资源组层直授 → 资源上单独授权。多数「多出来的权限」是从上层继承下来的，先查上层再查下层。\n\n**什么时候用，什么时候别用**。做设计时，把「越通用越往上放」：全公司规则放管理组，部门规则放对应分支，项目细节放资源组。反着来（什么都放资源层）会导致规则散落一地，收不回来。\n\n💡 **场景举例**（虚构教学示意）：新入职的同事反馈「我什么权限都没申请，却能列出部门订阅里的资源」。排查路径：先看订阅挂在哪个管理组、该管理组是否给目录内只读权限——结果权限正是从管理组层继承来的。\n\n层级清楚了，这类问题五分钟定位。\n\n**关联服务**：Azure 资源管理器（ARM，层级结构的组织核心）、Azure Policy 与 Azure RBAC（沿层级继承的两类规则）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「一个区域就是一个数据中心」 | 漏掉中间那层可用性区域 | 三层嵌套：数据中心 < 可用性区域 < 区域；一个可用性区域可含多个数据中心 |\n| 「有了可用性区域，整个区域挂了也不怕」 | 它只管区域内一处机房故障 | 机房级故障靠可用性区域，区域级故障靠区域对 |\n| 「资源同时放进两个资源组，两边都好查」 | 每个资源只能属于一个资源组 | 跨组汇总用标签和查询，别靠多重归属 |\n| 「订阅不开白不开，多切几层更好管」 | 每个订阅多一套权限与策略要维护 | 只为独立计费或独立管理边界开订阅，订阅本身不产生费用 |\n| 「管理组上配的策略，下层订阅能自己改」 | 继承方向固定自上而下 | 上层规则下层必须遵守，要改只能在上层改 |\n| 「资源组删了，里面的东西还能找回」 | 删组即删组内资源 | 要长期保留的资源别放进临时演示组 |\n\n#### 记忆要点\n\n1. **三层物理**：数据中心 < 可用性区域 < 区域，从小到大一层套一层。\n2. **两层灾备**：机房级故障用可用性区域兜，区域级故障用区域对兜。\n3. **四层管理**：管理组 → 订阅 → 资源组 → 资源，权限与策略自上而下继承。\n4. **归属唯一**：一个资源只能属于一个资源组，删组就是删资源。\n5. **订阅作用**：切分计费与管理边界，本身不产生费用，费用跟着订阅下的资源走。\n6. **治理收口**：订阅一多就上管理组，策略与角色一次下发到一批订阅。\n\n---"},{"h":"描述 Azure 计算与网络服务","body":"#### 这一节学什么\n这一节对应考纲任务 2.2「描述 Azure 计算与网络服务」。\n\n> 官方原名：Describe Azure compute and networking services\n\n这一任务解决两个问题：应用「用什么形态跑」，资源之间「怎么连」。计算部分按控制力从高到低讲三种形态（虚拟机、容器、函数），再加虚拟机的几种部署选项。\n\n网络部分从云内组网讲到云和本地机房打通，最后收在两种访问入口上。考题爱出场景匹配题：给你一个负载特征，让你选计算形态；给你一个连通需求，让你选网络服务。\n\n#### 比较计算类型：容器、虚拟机和函数\n\n> 官方原名：Compare compute types, including containers, virtual machines, and functions\n\n**这条在问什么。** 这是本域的高频考点。考题给你一个应用的负载特征。比如：遗留系统要整体迁移，微服务要快速扩缩，一段小逻辑靠事件触发。你要做的，是判断该用哪种计算形态。\n\n**定义**：三种形态代表三种控制力与运维负担的组合：\n\n- **虚拟机（virtual machine，VM）**：在云上模拟出的一台完整电脑，有自己的操作系统，你管到操作系统这一层。\n- **容器（container）**：把应用和它的依赖打包成的轻量运行单元。多个容器共用宿主机的操作系统，启动以秒计。宿主操作系统的维护归平台，官方文档口径里不需要你来管。\n- **函数（functions，指 Azure Functions 这类服务）**：更进一步的「无服务器计算（serverless）」。你只写一段响应事件的代码，服务器分配、扩缩容全部由平台自动完成，按代码实际执行来计费。\n\n**怎么运作**。三者是一条「控制力递减、运维负担也递减」的滑杆：\n\n1. **虚拟机**：控制力最强，能装任何能装进操作系统的东西，代价是补丁、备份、扩容都归你管。\n2. **容器**：应用级打包，启动快、扩缩快，适合拆成小服务并行跑的场景。\n3. **函数**：只管代码本身，事件来了就执行，没事件不花钱，适合短小的、由触发的逻辑。\n\n**什么时候用，什么时候别用**。迁移老系统、需要操作系统级控制，选虚拟机；应用已拆成多个小服务、流量波动大，选容器；逻辑短、由事件触发（上传一张图就处理一次），选函数。把长驻的大型系统塞进函数，会因为执行模型不合拍而别扭。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 手上有三件事：老 ERP 系统要整体搬上云、新订单服务拆成了八个微服务、上传图片要自动生成缩略图。三件事各选各的：ERP 用虚拟机原样迁移；八个微服务用容器编排着跑；缩略图用函数，传图事件一触发就执行，不传不花钱。\n\n这个组合背后的逻辑就是那条滑杆：控制力要求越高，越往虚拟机靠；运维负担想越低，越往函数靠。\n\n**关联服务**：Azure 虚拟机、Azure 容器实例与 Azure Container Apps（容器运行平台）、Azure Functions（函数运行平台）。\n\n#### 描述虚拟机选项：虚拟机、规模集、可用性集与 Azure 虚拟桌面\n\n> 官方原名：Describe virtual machine options, including Azure virtual machines, Azure Virtual Machine Scale Sets, availability sets, and Azure Virtual Desktop\n\n**这条在问什么。** 考题给你四种虚拟机使用场景（一台、一组自动伸缩、一组防同时故障、给员工发桌面），让你对号入座四个选项。\n\n**定义**：这一条要认得四个选项：\n\n- **Azure 虚拟机（Azure Virtual Machines）**：上一条讲的 VM 本体，单台使用。\n- **虚拟机规模集（Azure Virtual Machine Scale Sets）**：把一批配置相同的虚拟机编成组，负载大了自动加台数、负载小了自动减。\n- **可用性集（availability sets）**：把几台同角色的虚拟机在数据中心内部互相错开部署。错开两个维度：更新域（平台打补丁的时间窗）和故障域（共享电源与网络的物理单元）。目的是避免「一次维护全组下线」或「一处断电全组断电」。\n- **Azure 虚拟桌面（Azure Virtual Desktop，AVD）**：把桌面和应用做成本服务，员工从任何设备远程连上来用。\n\n**怎么运作**。四个选项对应四种需求：\n\n- 单个应用、固定负载：一台虚拟机就够。\n- 负载随时间波动（早高峰、大促）：规模集自动伸缩。\n- 要求几台同角色虚拟机别一起出事：可用性集管「错开」，注意它管的是分布，不是自动加台数。\n- 员工要远程用完整桌面环境：虚拟桌面。\n\n**什么时候用，什么时候别用**。规模集和可用性集最容易混：规模集解决「数量不够」，可用性集解决「同时挂掉」。两个需求都有的大规模部署，官方架构里两者可以配合使用。\n\n给三个人用的内部测试桌面，直接单台虚拟机装好共享即可，不必上虚拟桌面。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的报表系统工作日凌晨无人访问、月底生成高峰要撑住十倍负载。方案：虚拟机规模集配自动伸缩规则，闲时收缩到一台省费用；再给这组虚拟机配可用性集，保证升级补丁时始终有实例在服务。\n\n**关联服务**：Azure 虚拟机、Azure Virtual Machine Scale Sets、Azure Virtual Desktop。\n\n#### 描述虚拟机所需的资源\n\n> 官方原名：Describe the resources required for virtual machines\n\n**这条在问什么。** 考题问你「创建一台虚拟机，除了虚拟机本身还要哪些配套资源」，考的是你把一台 VM 看成一撮资源而不是一个孤立的方块。\n\n**定义**：一台虚拟机要配齐这些周边资源才能真正跑起来：\n\n- **映像（image）**：预装好操作系统甚至软件的模板，虚拟机从它「复制」出来。\n- **大小（size）**：CPU 核数与内存的组合档位，决定算力与单价。\n- **虚拟网卡（network interface，NIC）**：虚拟机接进虚拟网络的「网线口」。\n- **虚拟磁盘**：装操作系统的 OS 盘，加上存数据的若干数据盘。\n- **虚拟网络相关**：虚拟网络、子网、按需的公共 IP 地址（下一节展开）。\n\n**怎么运作**。这些配套每一项本身都是 Azure 资源，都落在资源组里。这正好接上资源组的容器关系（2.1.4）：你在门户里建一台虚拟机，实际是同时创建了一小撮资源。删除时也从资源组层面整体处理，避免「虚拟机删了、磁盘还留着继续计费」。\n\n**什么时候用，什么时候别用**。规划成本时，别只算虚拟机那一项：磁盘、公共 IP、出网流量都单独计费。选大小档位时，先按实际负载选，不够再升档——一开始就顶配是最常见的浪费。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 要给一个 Web 应用配一台虚拟机。清单：选一个带 Web 服务器的映像，选中等大小的档位，建一个虚拟网卡接进既有虚拟网络，OS 盘用默认档、另加一块数据盘放上传文件。\n\n这些资源落进同一个资源组，后续连计费和回收都是一组动作。\n\n**关联服务**：Azure 虚拟机（本体）、Azure 虚拟网络与磁盘存储（配套资源）、Azure 门户或 Azure CLI（创建入口）。\n\n#### 描述应用托管选项：Web 应用、容器与虚拟机\n\n> 官方原名：Describe application hosting options, including web apps, containers, and virtual machines\n\n**这条在问什么。** 考题给你一个 Web 类应用（官网、API、内容站）和它的自定义程度，让你在三种托管方式里选最省事又够用的那种。\n\n**定义**：三种托管方式对应三种控制层级：\n\n- **Web 应用（web apps）**：Azure 应用服务（Azure App Service）提供的托管平台。你把代码传上去，运行时环境、扩容、补丁全由平台管，完全不用碰操作系统。\n- **容器托管**：把应用打成容器镜像后交给容器平台运行。运行时环境可以自定义，但不用管底层机器。\n- **虚拟机托管**：控制力最完整的方式，操作系统到应用全部自己装自己管。\n\n三者的分层逻辑正好对应域 1「描述云概念」讲过的平台即服务（PaaS）与基础设施即服务（IaaS），容器介于两者之间。\n\n**怎么运作**。选择逻辑一句话：越标准的 Web 应用越往平台上放，越特殊的越往底层放。\n\n1. 标准 Web 应用或 API、用常见语言框架：App Service，运维负担最小。\n2. 需要特殊运行时或已有容器化的应用：容器平台。\n3. 需要操作系统级定制（特定驱动、老版本组件）：虚拟机。\n\n**什么时候用，什么时候别用**。能上 App Service 就别上虚拟机——同样的应用，托管平台帮你省掉的是补丁、扩容、监控一整条运维线。代价是平台环境有边界，装不了任意东西；越界需求才降级到容器或虚拟机。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 要上线一个企业官网加一个查询 API，都用主流框架写成。选择 App Service：代码推上去即可运行，流量涨了平台自动扩，团队不用雇专人管服务器。同样的需求若放进虚拟机方案，要有人定期打补丁、配扩容，成本结构完全不同。\n\n**关联服务**：Azure App Service（Web 应用托管）、Azure 容器服务（容器托管）、Azure 虚拟机（自管托管）。\n\n#### 描述虚拟网络\n\n> 官方原名：Describe virtual networking, including the purpose of Azure virtual networks, subnets, peering, Azure DNS, Azure VPN Gateway, and ExpressRoute\n\n**这条在问什么。** 这是本任务「描述 Azure 计算与网络服务」里考点最密的一条，一共六个网络概念：虚拟网络、子网、对等互连、Azure DNS、VPN 网关、ExpressRoute。考题给一个连通需求，让你认出对应的服务。\n\n**定义**：虚拟网络（virtual network，VNet）是云里划给你的一片私有网段，你的资源在里面的通信是加密且隔离的，好比公司内网搬进了云。子网（subnet）是虚拟网络里再切出来的小段，用来把「对外服务的一批」「内部数据库的一批」分开管理。\n\n对等互连（peering）是把两个虚拟网络用私有通道连起来，两边资源互访不走公共互联网。\n\n另外三个概念管「名字」和「通到本地」。Azure DNS 是云上的域名解析服务——DNS 指域名系统，负责把域名翻译成机器通信用的 IP 地址。\n\nVPN 网关（Azure VPN Gateway）通过公共互联网上的加密隧道，把你本地机房和云上虚拟网络连起来。ExpressRoute 是专线连接：你的机房和 Azure 之间拉一条不经公共互联网的专用线路。\n\n**怎么运作**。六个概念按「连谁」分两组记：\n\n1. **云内互连**：虚拟网络是底座，子网是内部分区，对等互连是两个底座之间的桥，Azure DNS 管名字翻译。\n2. **云和本地机房互连**：VPN 网关走公共互联网但全程加密，成本低、开通快；ExpressRoute 走物理专线，带宽稳、延迟低、可满足严格合规。\n\n**什么时候用，什么时候别用**。云内组网是起步配置，几乎所有正式部署都要。连本地机房时，先问两个问题：流量大不大、合规严不严。都不高，VPN 网关够了；大流量、低延迟、审计要求高，上 ExpressRoute，代价是专线费用和开通周期。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把新系统放在云上，财务系统仍在本地机房，两边要互访。先用虚拟网络和子网把云内资源分区；财务系统对接走 ExpressRoute，因为对账数据量大且审计要求链路不经公共互联网；另一个小分支机房流量小，用 VPN 网关接进来即可。\n\n**关联服务**：Azure 虚拟网络（底座）、Azure VPN Gateway 与 ExpressRoute（云地互连两条路）、Azure DNS（域名解析）。\n\n#### 定义公共终结点与专用终结点\n\n> 官方原名：Define public and private endpoints\n\n**这条在问什么。** 考题给你「服务要对公网开放」或「这个存储绝不能被公网访问到」两个相反的需求，让你判断该配哪种终结点。\n\n**定义**：终结点（endpoint）是访问一个服务的入口地址。\n\n公共终结点（public endpoint）是服务在公共互联网上可达的入口。配了它，世界上任何能上网的地方都能连过来，靠身份认证和防火墙规则挡住不该来的人。\n\n专用终结点（private endpoint）是在你的虚拟网络内部给服务分配一个私有 IP 作为入口——访问它不出你的私有网段，流量根本不经过公共互联网。\n\n**怎么运作**。两者不是二选一的互斥项，而是暴露面控制的两档：\n\n- **公共终结点**：服务本来就面向公众（官网、公开 API），或团队需要从各处便捷访问。\n- **专用终结点**：服务只该被内部访问（数据库、内部存储），配上后连公网入口都可以关掉，暴露面缩到最小。\n\n**什么时候用，什么时候别用**。判断标准是「谁需要访问」。对外的服务配公共终结点，加认证与访问规则；只对内的敏感服务配专用终结点，让它在网络层就不可从公网到达。\n\n给内部数据库留一个公共终结点「方便调试」是最常见的安全坏味道——调试完忘了关，就是事故入口。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的产品官网走公共终结点，配合 Web 应用防火墙过滤恶意流量；订单数据库只配专用终结点，虚拟网络里的应用可以访问，公网上这个数据库「不存在」。两类服务暴露面完全不同，安全预算花在真正需要的地方。\n\n**关联服务**：Azure 专用链接（Private Link，专用终结点的实现机制）、Azure 存储与 Azure SQL 等数据服务（两种终结点的典型承载对象）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「容器里也要自己打操作系统补丁」 | 多个容器共用一个宿主机的操作系统 | 宿主层维护归平台，你只管容器里的应用 |\n| 「规模集和可用性集是一回事」 | 一个管数量，一个管错开 | 规模集解决数量弹性伸缩，可用性集解决同时故障 |\n| 「函数也能跑长驻的大型系统」 | 函数按事件触发、执行时间短 | 长驻系统用虚拟机或容器，函数适合短小的事件逻辑 |\n| 「专用终结点就是把公共入口关掉」 | 关入口是可选附加动作，不是定义 | 专用终结点是把服务入口做成虚拟网络内的私有 IP |\n| 「ExpressRoute 更稳，能上就上」 | 专线有长期费用与开通周期 | 流量小、合规不严先用 VPN 网关；大流量低延迟再上专线 |\n| 「建一台虚拟机只花虚拟机那份钱」 | 磁盘、公共 IP、出网流量都单独计费 | 成本按整套配套资源算，不按一个方块算 |\n\n#### 记忆要点\n\n1. **控制力滑杆**：虚拟机 > 容器 > 函数，运维负担反向递减。\n2. **四个 VM 选项**：单台虚拟机、规模集（管数量）、可用性集（管错开）、虚拟桌面（管桌面交付）。\n3. **配套五件**：映像、大小、虚拟网卡、磁盘、虚拟网络，每一项都是独立资源。\n4. **托管三档**：App Service 最省事，容器居中，虚拟机最自由；越标准的 Web 应用越往上放。\n5. **网络六概念**：虚拟网络、子网、对等互连、Azure DNS 管云内；VPN 网关、ExpressRoute 管云地。\n6. **终结点两档**：公共终结点面向公网加认证，专用终结点在虚拟网内给私有 IP，暴露面最小。\n\n---"},{"h":"描述 Azure 存储服务","body":"#### 这一节学什么\n这一节对应考纲任务 2.3「描述 Azure 存储服务」。\n\n> 官方原名：Describe Azure storage services\n\n先讲「放什么」，再讲「怎么放」，最后讲「怎么搬」。存储是这一域里条目最密的一节：四个服务各管一种数据形态，四个访问层管成本，六种冗余管容灾，三个工具管搬文件，两个方案管整体迁移。\n\n考题几乎全是场景匹配：给数据形态选服务，给访问频率选层，给容灾要求选冗余，给搬迁条件选工具。抓住「按什么判断」这条线，五个技能点就串起来了。\n\n#### 比较 Azure 存储服务\n\n> 官方原名：Compare Azure Storage services\n\n**这条在问什么。** 考题给你四种数据——一段通话录音、程序之间传的短消息、一张半结构化的成绩表、要给多台机器挂载的共享目录——让你认出各该用哪个服务。判断依据是数据形态，不是数据量。\n\n**定义**：Azure 存储（Azure Storage）是一组数据存储服务，四个主力各管一种形态：\n\n- **Blob 存储（Blob Storage）**：装「非结构化」数据的服务。blob 指 binary large object（二进制大对象），即「一整个文件」的形态。文档、图片、视频、备份、日志都归它装，单个对象可以从几字节到上百 TB。\n- **Azure 文件（Azure Files）**：云上的文件共享服务，走 SMB（Server Message Block，Windows 网上邻居共享用的协议）等标准文件协议，像一台传统文件服务器，多台机器可以同时挂载同一个共享目录。\n- **队列存储（Queue Storage）**：存「消息」的排队服务。应用 A 把任务消息丢进队列就继续干别的，应用 B 有空时取走处理。它解耦的是组件之间的节奏，存的不是永久数据。\n- **表存储（Table Storage）**：NoSQL（不要求固定表结构的数据库）键值型服务，装一组一组的「属性名-值」对。适合不需要 SQL 那种强表结构、又要按键快速查的半结构化数据。\n\n还有第五个常被漏掉的：**Azure 托管磁盘**，虚拟机专用的虚拟硬盘，也在存储体系里。你在讲虚拟机配套资源（2.2.3）那条已经见过它。\n\n**怎么运作**。选服务看形态：\n\n1. 「一整个文件」的存储 → Blob。\n2. 「多机共享同一个目录」→ Azure Files。\n3. 「组件间传话、削峰排队」→ Queue。\n4. 「简单结构化数据、不想上 SQL」→ Table。\n\n这四个服务都通过「存储账户」这个统一入口提供（2.3.4 展开），账户之下再分容器、共享、队列、表这些细分区。\n\n**什么时候用，什么时候别用**。放文档、图片、视频这类自由内容 → Blob。已有依赖 SMB 的旧文件服务器、想原样搬云 → Azure Files。要拆解流量、让生产端和消费端互不等待 → Queue。要一张轻量结构表 → Table。别用 Table 装文档和图片，形态不合；也别用 Blob 模拟「多机共享目录」，它没有共享语义。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的客服系统有三类数据上云：通话录音按月归档 → Blob 存储装；工单流转消息 → Queue 排队，客服端有空才取；客户偏好标签 → Table 快速读写。另有一台旧 Windows 文件服务器，团队用 Azure Files 把共享目录原样搬上去，员工连盘符都不用换。\n\n**关联服务**：Azure Blob 存储、Azure Files、Queue 存储、Table 存储（同一存储账户下的四种服务）、Azure 托管磁盘（虚拟机硬盘）。\n\n#### 描述存储层级\n\n> 官方原名：Describe storage tiers\n\n**这条在问什么。** 同一份数据放不同档位，月账单差好几倍。考题给访问频率——每天读、每季度读一次、一年碰不到——让你选层。判断依据是访问频率和取回容忍度。\n\n**定义**：访问层（access tiers）是 Blob 存储按访问热度分的档位。当期官方口径四档：\n\n1. **热层（Hot）**：在线层，为频繁访问的数据优化。存储单价最高、访问单价最低。\n2. **冷层（Cool）**：在线层，为不常访问的数据优化。官方口径建议数据至少存放 30 天。存储更便宜、访问更贵。\n3. **低温层（Cold）**：在线层，为更少访问、但仍要快取回的数据优化，建议至少存 90 天。存储比冷层还低、访问比冷层还贵。这是官方近年新增的档位——网上大量旧教材只有三档，口径已过时。\n4. **存档层（Archive）**：离线层，为极少访问的数据优化，建议至少存 180 天。存储单价最低，但读取前要先「解除冻结」（rehydrate，把数据从离线态恢复成可读），最长可到 15 小时，取回费用也最高。\n\n成本规律一句话：存储单价从热到存档递减，访问单价递增。档位越冷，放着越便宜，动起来越贵。\n\n**怎么运作**。改层两条路：手动对单个 blob 设置层级；或用生命周期管理策略按规则自动迁移（比如「90 天没被访问就转冷」）。有一条官方边界要记：存档层不能用生命周期策略自动解除冻结回来，解冻要单独发起。\n\n**什么时候用，什么时候别用**。线上业务的实时数据 → 热层。月报、季度报表、日常备份 → 冷层或低温层。合规要求长留、几乎无人访问的归档 → 存档层，省钱是大头。别把「偶尔要用」的备份数据扔进存档：一次紧急恢复要等最长 15 小时，业务等不起。也别全放热层图省事——账单上来才知道贵。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的质检影像库每天新增上万张，当月要随时调阅，五年前的老影像只应付审计。方案：新影像放热层；90 天没被访问的自动转冷；审计要保的老影像转存档层。存储费用降到原来的零头，代价只是调老影像要提前半天发起解冻。\n\n**关联服务**：Blob 访问层（四档）、生命周期管理策略（自动分层）、存储账户默认层级设置。\n\n#### 描述冗余选项\n\n> 官方原名：Describe redundancy options\n\n**这条在问什么。** 考题给容灾要求——一处机房坏了不能丢、整个区域灾难也不能丢、平时还想多一份可读——让你选冗余档位。判断依据是「要防哪一级的故障」加「要不要读副本」。\n\n**定义**：冗余（redundancy）就是同一份数据自动复制几份、分别放在哪。官方六个选项，先看一个维度：主区域内怎么放。\n\n- **本地冗余存储（LRS，locally redundant storage）**：在主区域的一个物理数据中心内保留副本。最便宜的选项。官方口径：对象年耐久性至少 11 个 9（99.999999999%）。\n- **区域冗余存储（ZRS，zone-redundant storage）**：在主区域的三个以上可用区间同步复制。一个可用区出故障，数据照样可读可写。官方口径 12 个 9。\n\n第二个维度：要不要复制到几百英里外的配对区域。加上异地，就是四个选项：\n\n- **地理冗余存储（GRS，geo-redundant storage）**：主区域内 LRS，再异步复制到配对区域。官方口径 16 个 9。平时次区域那份不可读不可写，主区域故障转移之后才接管。\n- **地理区域冗余存储（GZRS，geo-zone-redundant storage）**：主区域内 ZRS，再异步复制到配对区域。区内高可用和区域级容灾都占。\n- **RA-GRS / RA-GZRS（读取访问变体）**：在 GRS 或 GZRS 基础上，平时就可以读次区域那份副本。给「就近读」或「主区域出事时立刻切读」的场景用。\n\n两条官方边界照录：存档层的 blob 不支持 ZRS、GZRS、RA-GZRS；Azure Files 不支持 RA-GRS 和 RA-GZRS。\n\n**怎么运作**。选档逻辑是一棵判断树：\n\n1. 只要防「单个机房级」故障、预算最紧 → LRS。\n2. 要防「一个可用区挂掉」→ ZRS。官方对 Azure Files 也推荐 ZRS。\n3. 要防「整个区域灾难」→ GRS 或 GZRS，差别只在主区域那半是 LRS 还是 ZRS。\n4. 再要「平时可读副本」→ RA-GRS 或 RA-GZRS。\n\n**什么时候用，什么时候别用**。数据丢了能随时重建、合规又要求数据不出这个数据中心 → LRS。订单库这类「一个可用区停电不能停服」→ ZRS。财务归档这类「整个区域灾难也要保住」→ GRS/GZRS。审计组平时就要读副本 → RA 变体。别把 GRS/GZRS 的异步复制当成「绝不丢一个字节」：官方口径是异步，故障瞬间还没传到次区域的部分存在丢失窗口。记不住 9 的个数没关系，记住相对关系：LRS < ZRS < GRS/GZRS。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 三类数据各配各的：门店交易流水（丢了能重传、省钱优先）→ LRS；订单库（一个可用区停电不能停服）→ ZRS；财务归档（区域灾难也要保住、审计组平时要读副本）→ RA-GZRS。\n\n**关联服务**：存储账户冗余配置（建账户时选定）、可用区（ZRS 的分布基础，2.1.2）、区域对（地理复制的目的地，2.1.1）。\n\n#### 描述存储账户选项和存储类型\n\n> 官方原名：Describe storage account options and storage types\n\n**这条在问什么。** 考题问两件事：「用存储先建什么」和「标准账户与高级账户怎么选」。它考的是把存储账户当作存储世界总入口的认知。\n\n**定义**：存储账户（storage account）是使用 Azure 存储的统一入口。名字全球唯一，因为它直接拼进访问地址（形如「你的账户名.blob.core.windows.net」）。Blob、Files、Queue、Table 四个服务都住在账户下；冗余档位（2.3.3）和性能档位在账户上定。\n\n账户类型官方口径：\n\n- **通用 v2（General-purpose v2）**：标准档账户，支持全部四种服务、全部访问层和冗余选项。官方建议：能用通用 v2 就别用旧型账户。\n- **高级账户（Premium）**：SSD 高性能档，分「高级块 blob」和「高级文件」两类，为低延迟高吞吐场景设计，不支持冷热分层定价。\n- **旧型 BlobStorage 账户**：遗留类型，官方不推荐新用。\n\n「存储类型」的另一半是 blob 的三种类型：块 blob（block blob）装大多数文件场景；追加 blob（append blob）只许在尾部追加，日志类专用；页 blob（page blob）支持随机读写，虚拟机磁盘的底层形态。\n\n**怎么运作**。建账户就是定一组组合：性能档（标准/高级）× 冗余档（LRS 到 GZRS）× 用途（全服务或专用）。账户建好后，服务资源都从它的名字下取。标准档配合冷热分层省钱；高级档吃 SSD 速度
