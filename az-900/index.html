但不玩分层。\n\n**什么时候用，什么时候别用**。普通业务数据 → 通用 v2 加标准档。要极低延迟、高吞吐的读多场景 → 高级账户。日志这种只追加的流 → 追加 blob。别指望给高级账户配访问层（不支持）；也别为「快一点」把冷数据全放 SSD，账单会替你做决定。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 新应用建两个存储账户：一个通用 v2 标准档放图片资料，按冷热分层管成本；一个高级块 blob 账户放视频转码的临时中间文件，吃 SSD 吞吐，用完即删。两本账各算各的。\n\n**关联服务**：存储账户（统一入口）、通用 v2（默认推荐）、高级块 blob 与高级文件（SSD 档）、托管磁盘（虚拟机用页 blob，2.2.3）。\n\n#### 识别移动文件的选项\n\n> 官方原名：Identify options for moving files, including AzCopy, Azure Storage Explorer, and Azure File Sync\n\n**这条在问什么。** 考题给一个「把文件弄进 Azure、弄出来或两头同步」的场景，让你从三个工具里选。三个工具的分工是「命令行、图形界面、同步缓存」。\n\n**定义**：三个官方工具，定位句都取自官方文档：\n\n- **AzCopy**：官方定位是「向存储账户、从存储账户、在存储账户之间复制数据的命令行工具」。免安装下载即用，适合大批量、可重复、可编进脚本的搬运。\n- **Azure 存储资源管理器（Azure Storage Explorer）**：独立图形界面工具。连上账户后像操作本地文件一样浏览、上传、下载四类存储里的内容。适合人工偶发操作。\n- **Azure 文件同步（Azure File Sync）**：把 Azure 文件共享和本地 Windows 文件服务器连起来做同步。云端是权威副本，本地保留热缓存。适合「文件服务器不想全拆、数据又想要云的可靠」。\n\n**怎么运作**。选择线看两件事：是一次性搬还是长期同步，以及谁操作。\n\n1. 一次性大批量、要进自动化流程 → AzCopy。\n2. 运维手工挑几个文件处理 → Storage Explorer。\n3. 本地服务器继续用、数据自动上云 → File Sync。\n\n**什么时候用，什么时候别用**。几百 GB 的迁移要写进定期任务 → AzCopy。让不写脚本的同事传一批文件 → Storage Explorer。三个分部的文件服务器要集中到云、本地只留缓存 → File Sync。别用图形工具干自动化，人点鼠标不可复现；也别拿 File Sync 做一次性搬迁，它要长期驻留一个同步服务。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 把 2 TB 设计稿搬上云：先由 AzCopy 夜间脚本全量灌入；后续设计师在本地文件服务器上日常增删，File Sync 自动同步到云端权威副本；安全团队偶尔抽查文件，用 Storage Explorer 连上去浏览下载。三个工具各干一段，谁也不抢谁的活。\n\n**关联服务**：AzCopy（命令行）、Azure Storage Explorer（图形）、Azure File Sync（本地-云同步）、Azure Files（File Sync 的对端）。\n\n#### 描述迁移选项\n\n> 官方原名：Describe migration options, including Azure Migrate and Azure Data Box\n\n**这条在问什么。** 「迁移」这个词在 Azure 里指两件不同的事：搬迁本地服务器和应用，以及搬运海量数据。考题就考这两个的分界——给一个搬迁需求，认出该用 Azure Migrate 还是 Data Box。\n\n**定义**：两个官方方案各管一段：\n\n- **Azure Migrate**：评估加迁移一体的平台。先评估本地服务器、数据库、应用——适合搬去 Azure 的哪种形态、要配什么规格；再按方案实施迁移。它管「计算与应用」这条线。\n- **Azure Data Box**：数据搬运的物理通道。官方定位句照录：「当数据集太大或网络受限、线上传输不现实时」，把本地数据传到 Blob 存储。流程是：申请设备（家族含 Data Box Disk、Data Box、Data Box Heavy 不同容量档），本地把数据拷进设备，快递回 Azure 数据中心，数据灌进你的存储账户。另有 Import/Export 服务，用你自己寄的磁盘走同一流程。\n\n**怎么运作**。两者常配合：Azure Migrate 出评估报告、迁走服务器和应用；几十 TB 的历史数据底座由 Data Box 先运过去；割接当晚只剩增量，用 AzCopy 在线补齐（2.3.5）。\n\n**什么时候用，什么时候别用**。首次全量几十 TB、专线没建 → Data Box。线上带宽富余、就几个 GB → AzCopy 直接传。要判断「哪些服务器适合上云、上去配多大」→ Azure Migrate。别拿 Data Box 搬几百 GB，来回好几天不如网传；也别指望 Migrate 负责海量历史数据的搬运，它管评估和服务器迁移，不管原始数据灌入。\n\n💡 **场景举例**（虚构教学示意）：Contoso 数据中心整体上云：Azure Migrate 先扫全部 200 台服务器，出评估报告分出「直接迁」「先改造」两栏；40 TB 历史影像走 Data Box Heavy 一趟寄走；割接当晚的增量数据用 AzCopy 在线补齐。三件事三个工具，谁也不越界。\n\n**关联服务**：Azure Migrate（评估与迁移）、Data Box 家族（Disk/Box/Heavy）、Import/Export（自带磁盘变体）、AzCopy（增量补齐）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「Blob 可以当多机共享目录用」 | Blob 没有共享语义 | 多台机器挂同一个共享目录走 Azure Files，像传统文件服务器 |\n| 「档位越冷越省钱，备份都扔进存档层」 | 只算了存储单价，漏了取回代价 | 存档层读取前要解冻，最长可到 15 小时；偶尔要用的数据别进存档 |\n| 「GRS 平时就能读次区域那份副本」 | 默认次区域不可读不可写 | 平时要读副本，选 RA-GRS 或 RA-GZRS 变体 |\n| 「高级账户也按冷热分层省钱」 | 高级档吃 SSD 速度，不玩分层 | 分层省钱是标准档的玩法；高级账户不支持冷热分层定价 |\n| 「AzCopy 是图形界面工具」 | 它的定位是命令行工具 | 图形的是 Storage Explorer；AzCopy 免安装下载即用，适合脚本化大批量 |\n| 「Data Box 顺手搬几百 GB 也方便」 | 设备来回要数天，小量不如网传 | 几百 GB 走 AzCopy 在线传；Data Box 留给几十 TB 或网络受限的场景 |\n\n#### 记忆要点\n\n1. **四形态**：一整个文件 Blob，多机共享 Files，组件传话 Queue，轻量结构表 Table。\n2. **层价反向**：存储单价热到存档递减，访问单价递增；最短存放 30、90、180 天。\n3. **冗余判断**：防机房级故障 LRS，防可用区故障 ZRS，防区域灾难 GRS/GZRS，要平时读副本选 RA 变体。\n4. **账户默认**：通用 v2 是官方建议；高级档 SSD 不分层；账户名全球唯一、拼进访问地址。\n5. **搬移三件**：脚本化搬运 AzCopy，图形操作 Storage Explorer，本地-云同步 File Sync。\n6. **迁移分界**：Migrate 管评估与服务器迁移，Data Box 管海量数据物理搬运，增量用 AzCopy 补齐。\n\n---"},{"h":"描述 Azure 标识、访问和安全","body":"#### 这一节学什么\n这一节对应考纲任务 2.4「描述 Azure 标识、访问和安全」。\n\n> 官方原名：Describe Azure identity, access, and security\n\n2.3 管数据放哪，2.4 管「谁能进来、能碰什么」。八个技能点一条线：先认「目录」，管人的账本；再认「验证方式」，管怎么证明是你；然后请外部人进来；再按条件放行；按角色授权；最后是三套安全理念——零信任、纵深防御、Defender for Cloud。\n\n前五条是机制，后三条是「怎么想」。考题对后三条爱考「一句口号对应哪套理念」。\n\n#### 描述 Azure 中的目录服务\n\n> 官方原名：Describe directory services in Azure, including Microsoft Entra ID and Microsoft Entra Domain Services\n\n**这条在问什么。** 考题拿两个「目录」考辨析：管登录的云目录，和兼容老式域功能的托管域。给一个「遗留应用只认 Windows 域」的场景，认出该选哪个。\n\n**定义**：Microsoft Entra ID（微软 Entra 标识服务，旧名 Azure Active Directory、Azure AD）是云端身份与访问管理的目录服务：管「谁是谁」——用户、组——以及「谁能进哪些应用」。订阅天然关联一个 Entra ID 租户（tenant，一个组织独享的目录实例）；你后面要学的单点登录、多要素验证、条件访问都建在它之上。\n\nMicrosoft Entra Domain Services（域服务）是另一个东西。官方文档对它的定位：把遗留应用搬进云上的托管域，同时保留用户账户、组和访问。它提供经典 Windows 域的那套零件——域加入、组策略、LDAP、Kerberos——让离不开老域功能的应用照常跑，但你不用自己维护域控制器（域控制器=替整个域做验证的服务器）。\n\n**怎么运作**。两个不是替代关系，是分工。Entra ID 是新式身份中枢：云应用、SaaS 单点登录都直接对接它。Domain Services 是兼容层：只服务「只认经典域」的老应用。多数公司两个并存。\n\n**什么时候用，什么时候别用**。云原生应用、要给 SaaS 做单点登录 → Entra ID。老 ERP 只认 Kerberos 票据和组策略 → Domain Services 托管域。别为了「感觉像以前」给新应用上 Domain Services——那是绕远路，新应用走它等于放着高速不走开辅路。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 把 ERP 搬上云。ERP 客户端只认 Windows 域账户，团队给它配一个 Entra Domain Services 托管域，账户和组从 Entra ID 同步过来；同一时期新写的手机端应用直接注册进 Entra ID，走单点登录。新老两代应用各用各的门，互不打扰。\n\n**关联服务**：Microsoft Entra ID（云目录）、Microsoft Entra Domain Services（托管域）、订阅（关联的租户，2.1.5）。\n\n#### 描述 Azure 中的身份验证方法\n\n> 官方原名：Describe authentication methods in Azure, including single sign-on (SSO), multifactor authentication (MFA), and passwordless\n\n**这条在问什么。** 考题给三个需求——一处登录处处通行、多一道关卡、干脆不用密码——让你配对三种验证方式。辨析点是性质：单点登录是「记一次」，多要素是「加类别」，无密码是「换要素」。\n\n**定义**：三种方式各解一个问题：\n\n- **单点登录（single sign-on，SSO）**：登录一次，就能访问一组已授权的应用，不用每个应用再输密码。身份由中心目录统一验证，应用信任这个目录的结论。\n- **多要素身份验证（multifactor authentication，MFA）**：要两种以上「不同类别」的凭证才放行。官方口径把要素分三类：你知道的（something you know，如密码）、你拥有的（something you have，如手机或智能卡）、你本身的（something you are，指纹、人脸）。密码加手机推送是两类要素，成立；两个密码还是一类，不算 MFA。\n- **无密码（passwordless）**：把密码这个要素整个去掉，用更强的要素登录。官方口径下 Azure 常见形态有 Windows Hello for Business、Microsoft Authenticator 应用、FIDO2 安全密钥（插在 USB 口上按指纹的实体钥匙）。\n\n**怎么运作**。三者是叠加不是互斥：单点登录定「一次登录能换到多大范围」，多要素给登录加门槛，无密码把最弱的那环换掉。密码的问题在它本身就是攻击面——钓鱼邮件钓的就是它。官方推荐方向是把密码逐步消灭掉。\n\n**什么时候用，什么时候别用**。全公司一排 SaaS 要统一登录 → 单点登录。财务转账这类高价值操作 → 加 MFA。想根除钓鱼密码风险 → 无密码，配条件访问一起用。别拿「密码加 PIN」冒充 MFA——两个都是你知道的，还只是一类。\n\n💡 **场景举例**（虚构教学示意）：Contoso 分三步走：全员工具矩阵接入单点登录，一处登录处处用；财务转账操作加 MFA，密码加手机推送双确认；高管和研发试点无密码，指纹加安全密钥。钓鱼邮件发出去连靶子都没有——账号根本没有密码可钓。\n\n**关联服务**：Microsoft Entra ID（单点登录与验证策略）、Microsoft Authenticator（推送与无密码）、条件访问（2.4.4，把验证方式串成规则）。\n\n#### 描述 Azure 中的外部标识\n\n> 官方原名：Describe external identities in Azure\n\n**这条在问什么。** 合作方要访问你这边一个应用——给他建内部账号，还是请他用他自己的账号进来？考的是外部身份这套「请人进门」的机制。\n\n**定义**：外部标识（external identities）指让组织外的人用「他们自己的身份」访问你的资源。主力机制是 Microsoft Entra B2B 协作：你发邀请，对方用自己的工作账号接受；你的目录里出现一个访客用户对象，用户类型是 guest，用户主体名称里带 `#EXT#` 标识。\n\n**怎么运作**。访客对象进了目录，就和内部用户同一套管理：可以加进组、给应用、给 Azure 资源角色。控制权始终在你这侧——随时移除，对方原组织的账号生命周期与你无关。他也不用在你这里另记一套密码。\n\n**什么时候用，什么时候别用**。外部顾问、供应商，合作期几个月 → B2B 访客最合适。要长期坐班、按内部合规管设备 → 走内部账号。要给公众消费者发账号 → 那是 B2C 产品线的事，超出本考纲，知道有这条线即可。别给外部人开内部账号再传密码：到期清不清、密码怎么传、审计谁担，全是坑。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 请外部审计师只读查三个月报表。管理员发 B2B 邀请到审计师的公司邮箱，对方用本公司账号接受，目录里出现带 `#EXT#` 的访客对象，被加进「报表只读」组。合作期满移除访客。全程没传递过一个密码，也没建过一个内部账号。\n\n**关联服务**：Microsoft Entra External ID（B2B 协作）、Microsoft Entra ID（访客对象与授权）、组与 RBAC（给访客授权的路径，2.4.5）。\n\n#### 描述 Microsoft Entra 条件访问\n\n> 官方原名：Describe Microsoft Entra Conditional Access\n\n**这条在问什么。** 考题给一句话需求，比如「不在公司网络的登录要多验证一步」，让你认出这是条件访问的活。它考的是对 if-then 结构的辨认。\n\n**定义**：条件访问（Conditional Access）官方文档的定位：基于用户、位置、设备等信号，用策略控制对资源的访问。它就是一组 if-then 规则——信号满足什么条件，就执行什么判定。\n\n**怎么运作**。规则分两段记：\n\n1. **信号**：用户或组、登录位置、设备状态、要访问的应用、检测到的风险级别。\n2. **判定**：常见四种——放行、要求多要素验证、要求合规设备、直接阻止。\n\n策略写法是「范围加排除」：适用于全公司，排除紧急访问账号。这个排除项不是可有可无——把自己锁在门外是新手经典事故。\n\n**什么时候用，什么时候别用**。要「不同情境不同门槛」→ 条件访问：公司网内免验证、外部一律多要素。要判断「这个人身份真不真」→ 是多要素验证的活。要控制「他能对资源做什么」→ 是 RBAC 的活（下一条）。别把条件访问当防火墙用——它管登录时刻的放行，不管网络流量。\n\n💡 **场景举例**（虚构教学示意）：Contoso 定一条策略：登录位置在公司 IP 段 → 直接放行；任何其他位置 → 要求多要素验证再放行；会话被判定高风险 → 直接阻止。出差的销售和咖啡厅蹭网的实习生，待遇完全不同，但谁也没被一刀切。\n\n**关联服务**：Microsoft Entra ID（策略载体）、多要素验证（判定手段之一）、单点登录应用（保护对象）。\n\n#### 描述 Azure 基于角色的访问控制（RBAC）\n\n> 官方原名：Describe Azure role-based access control (RBAC)\n\n**这条在问什么。** 考题给岗位和动作——「运维要能重启虚机，但不许他管别人的权限」——问你给哪个内置角色、作用域给哪一层。这门课考到「概念加选型」为止，不考命令行。\n\n**定义**：Azure RBAC（Azure role-based access control，基于角色的访问控制）管「谁能对哪些 Azure 资源做什么」。一次授权拆成三要素：\n\n1. **安全主体**：谁。用户、组、服务主体（给程序用的身份）、托管标识都算。\n2. **角色定义**：能干什么。一组允许动作的集合。\n3. **作用域**：管到哪一层。管理组、订阅、资源组、单个资源四层（2.1.7 讲过这棵树）。\n\n四个最常用的内置角色，官方描述照录：\n\n- **Owner（所有者）**：完全管理所有资源，还能把权限再分配给别人。\n- **Contributor（参与者）**：完全管理所有资源，但不能分配角色。\n- **Reader（读取者）**：只能看，不能改。\n- **User Access Administrator（用户访问管理员）**：专门管别人对 Azure 资源的访问。\n\n**怎么运作**。权限沿作用域树向下继承：在订阅层给某组 Reader，订阅下全部资源组和资源都能读。再叠加一条原则就够用了：最小特权（least privilege）——给够用的最小角色，而不是「先给个大的」。\n\n**什么时候用，什么时候别用**。日常运维 → Contributor；审计、汇报 → Reader；只有专职管授权的人 → Owner 或用户访问管理员。作用域从够用的最窄层起——默认资源组层，确实要跨组再往上提并写明理由。别动辄 Owner：授权权交出去，就没人说得清谁给过谁什么。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 三种人三种给法：值班运维在「生产-华东」资源组拿 Contributor；季度审计顾问全订阅拿 Reader；只有平台组两人在订阅层拿 Owner。有新人反馈「我改不了东西」，先查他是不是只在上层继承了 Reader——不是加一个 Owner 糊过去。\n\n**关联服务**：Azure RBAC（角色、分配、作用域）、Microsoft Entra ID（安全主体的来源）、资源组-订阅-管理组层级（作用域树，2.1.7）。\n\n#### 描述零信任的概念\n\n> 官方原名：Describe the concept of Zero Trust\n\n**这条在问什么。** 考题给一句口号——「不再默认相信内网里的人」——问它对应哪套理念。零信任考的就是三原则的对应关系。\n\n**定义**：零信任（Zero Trust）的立场一句话：不再「进了内网就算自己人」。官方口径三原则：\n\n1. **显式验证（verify explicitly）**：每次访问都验证和授权，身份、设备、位置都是证据。\n2. **最小特权（least privileged access）**：只给刚好够用的权限，按需按时限给，到期收。\n3. **假定泄露（assume breach）**：设计时就当攻击者已经进来了——网络分段、全程加密、持续监控。\n\n**怎么运作**。零信任不是一件产品，是一套设计立场。落到 Azure 的零件你全都学过了：条件访问是显式验证的落地（2.4.4），RBAC 是最小特权的落地（2.4.5），分段隔离与专用终结点是假定泄露的落地（2.2.6）。\n\n**什么时候用，什么时候别用**。判断题拿这三句考你：\n\n- 「防火墙内就是安全的」——错，这正是零信任反对的假设。\n- 「每个请求都要验证」——对，显式验证。\n- 「零信任就是买某个产品」——错，理念不是货架上的 SKU。\n\n💡 **场景举例**（虚构教学示意）：Contoso 放弃「连上公司 VPN 就算可信」的老假设。员工从家里访问报销系统，三原则各就各位：\n\n1. 先验证身份和设备（显式验证）。\n2. 只拿到报销模块的权限（最小特权）。\n3. 后端假设任何会话都可能被劫持，全程加密加异常告警（假定泄露）。\n\n三句话各对应一个已学过的零件。\n\n**关联服务**：条件访问（显式验证）、Azure RBAC（最小特权）、专用终结点与 Azure Monitor（假定泄露的分段与监控，2.2.6 与域 3）。\n\n#### 描述纵深防御模型的目的\n\n> 官方原名：Describe the purpose of the defense-in-depth model\n\n**这条在问什么。** 考理念对应：给「一层失守不是全线失守」的描述，认出纵深防御。它和零信任的区别也常考：零信任是「每次都验证」的立场，纵深防御是「多设几道墙」的结构。\n\n**定义**：纵深防御（defense-in-depth）是多重独立防线层层叠叠的安全设计。每层拦一类攻击；一层被攻破，其余各层仍在。官方 AZ-900 学习材料的层切分从外到内大致是：\n\n- 物理：机房门禁。\n- 身份与访问：登录验证。\n- 外围：DDoS 与防火墙边界。\n- 网络：网段隔离。\n- 计算：系统补丁。\n- 应用：代码层防护。\n- 数据：加密。\n\n层怎么切，不同版本画法有出入，官方也不考层数。要记的是方向：从机房一路收窄到数据，数据在中心，也是最终要保护的对象。\n\n**怎么运作**。攻击者要拿到数据，得连续突破每一层，攻击成本逐层抬升。即使应用层被攻破，数据加密还能兜底。纵深防御反对的正是「单点依赖」——指望一个防火墙或一次加密包打天下。\n\n**什么时候用，什么时候别用**。判断「有了加密就不用管应用层」——错，纵深防御反对只押一层。判断「每层独立设计、各自兜底」——对。它和零信任不冲突：零信任定立场，纵深防御定结构，两套一起用。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 一次钓鱼演练，四道墙层层拦人：\n\n1. 员工密码被钓走（身份层失守）。\n2. 登录被多要素验证拦住（第二层）。\n3. 就算连手机都被拿走，高风险会话又被条件访问直接阻止（第三层）。\n4. 真进来了，数据加密加审计告警还在兜底。\n\n四道墙对应纵深防御的「层层兜底」。\n\n**关联服务**：Microsoft Entra ID（身份层）、条件访问与 MFA（验证层）、网络分段与专用终结点（边界层，2.2.6）、Microsoft Defender for Cloud（整体态势，下一条）。\n\n#### 描述 Microsoft Defender for Cloud 的用途\n\n> 官方原名：Describe the purpose of Microsoft Defender for Cloud\n\n**这条在问什么。** 考题问「持续盯着资源的安全态势、给整改建议的是谁」。这门课考到「用途」级，不考配置和价格。\n\n**定义**：Microsoft Defender for Cloud 是 Azure 的云安全监测服务，两件事：给你的 Azure（以及混合、多云）环境做安全态势评估，给强化建议；同时对工作负载做威胁检测和告警。\n\n两个词拆开记：\n\n- **态势（posture）**：你当前配置离最佳安全实践差多远。它给出的是差距清单加优先级。\n- **防护**：虚拟机、数据库、存储这些工作负载上的威胁，检测到了就告警。\n\n**怎么运作**。接入后它自动扫描订阅里的资源，按最佳实践出一份建议清单——比如「管理员该开多要素验证」「存储传输加密没开」。威胁发生时发告警。它给建议，不替你改：整改还是要由负责人确认后执行。\n\n**什么时候用，什么时候别用**。要「安全体检加整改清单」→ Defender for Cloud。要「性能指标和运行日志」→ 那是 Azure Monitor 的活（域 3 展开），一个管安全姿态，一个管运行健康。别把它当自动整改工具——清单归它，改不改归你。\n\n💡 **场景举例**（虚构教学示意）：Contoso 新任安全主管第一周打开 Defender for Cloud 扫全订阅，收到 12 条建议。他按优先级先修三条高优先级：管理员多要素没强制、存储传输加密没开、若干虚机补丁滞后。这份清单顺手成了他向上汇报的底稿——差距在哪、先修什么、为什么，全在一张表里。\n\n**关联服务**：Microsoft Defender for Cloud（态势与威胁防护）、Azure Policy（建议落地的通道，域 3 展开）、Azure Monitor（运行侧分工，域 3 展开）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「有了 Entra ID 就用不着 Domain Services」 | 两个是分工，不是替代 | Domain Services 专服务只认经典域（域加入、组策略、LDAP、Kerberos）的遗留应用 |\n| 「密码加 PIN，两个凭证算多要素」 | 两个都是「你知道的」，还只是一类 | 多要素要两类以上不同要素：知道的、拥有的、你本身的 |\n| 「请外部顾问先建个内部账号最稳妥」 | 到期难收、密码难传、审计难追 | B2B 访客用对方自己的账号进门，目录里是 guest 对象，随时移除 |\n| 「Contributor 都能完全管理资源，分权限也该行」 | 角色描述里明确不含分配角色 | 把权限再分给别人的能力在 Owner；专管访问的另有用户访问管理员 |\n| 「零信任买对一个产品就落地了」 | 它是设计立场，不是货架上的商品 | 三原则：显式验证、最小特权、假定泄露 |\n| 「有了加密这层，应用层可以少操心」 | 纵深防御反对把宝押在一层 | 每层独立设防、各自兜底；一层失守不等于全线失守 |\n\n#### 记忆要点\n\n1. **目录分工**：Entra ID 是新式身份中枢，Domain Services 是老域兼容层，多数公司两个并存。\n2. **验证三招**：单点登录「记一次」，多要素「加类别」，无密码「换要素」。\n3. **访客进门**：外部人走 B2B，目录里是带 `#EXT#` 的 guest 对象，控制权始终在你这侧。\n4. **条件判定**：信号满足什么条件就执行什么判定；写策略记得把紧急账号放进排除项。\n5. **三要素**：安全主体、角色定义、作用域；从够用的最窄层起给，认最小特权。\n6. **两套理念**：零信任定立场，纵深防御定结构；Defender for Cloud 出体检清单，不替你整改。\n\n---"}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 2.1.1 | 区域对与主权区域的用途辨析 | ⭐⭐⭐ | 情景单选 |\n| 2.1.2 | 可用性区域与区域对的防护层级区分 | ⭐⭐⭐ | 单选/判断 |\n| 2.1.3 | 数据中心 < 可用性区域 < 区域的包含关系 | ⭐⭐ | 判断/单选 |\n| 2.1.4 | 资源组的容器关系与「删除即全删」 | ⭐⭐⭐ | 单选 |\n| 2.1.5 | 订阅的计费与管理分界角色 | ⭐⭐ | 情景单选 |\n| 2.1.6 | 管理组对订阅的治理收口 | ⭐⭐ | 情景单选 |\n| 2.1.7 | 四层结构的排序与继承方向 | ⭐⭐⭐ | 排序/单选 |\n| 2.2.1 | 三种计算形态的场景匹配 | ⭐⭐⭐ | 情景单选 |\n| 2.2.2 | 规模集与可用性集的职能区分 | ⭐⭐⭐ | 单选 |\n| 2.2.3 | 虚拟机配套资源清单 | ⭐⭐ | 单选/多选 |\n| 2.2.4 | 三种托管方式的取舍 | ⭐⭐ | 情景单选 |\n| 2.2.5 | 六个网络概念与连通需求匹配 | ⭐⭐⭐ | 情景单选/拖拽 |\n| 2.2.6 | 公共与专用终结点的暴露面判断 | ⭐⭐ | 单选 |\n| 2.3.1 | 四种存储服务与数据形态匹配 | ⭐⭐⭐ | 情景单选 |\n| 2.3.2 | 访问层成本权衡与归档解冻代价 | ⭐⭐⭐ | 单选 |\n| 2.3.3 | 冗余选项的防故障层级与读副本变体 | ⭐⭐⭐ | 单选/多选 |\n| 2.3.4 | 账户类型档位与 blob 三型 | ⭐⭐ | 单选 |\n| 2.3.5 | 三个移动工具的分工 | ⭐⭐ | 情景单选 |\n| 2.3.6 | Migrate 与 Data Box 的迁移分界 | ⭐⭐ | 情景单选 |\n| 2.4.1 | Entra ID 与 Domain Services 的分工 | ⭐⭐⭐ | 情景单选 |\n| 2.4.2 | 单点登录、多要素、无密码三辨析 | ⭐⭐⭐ | 单选/多选 |\n| 2.4.3 | 外部身份与 B2B 访客机制 | ⭐⭐ | 情景单选 |\n| 2.4.4 | 条件访问的 if-then 结构 | ⭐⭐⭐ | 情景单选 |\n| 2.4.5 | RBAC 三要素与内置角色选型 | ⭐⭐⭐ | 情景单选 |\n| 2.4.6 | 零信任三原则的口号对应 | ⭐⭐ | 单选/判断 |\n| 2.4.7 | 纵深防御的分层逻辑与零信任区分 | ⭐⭐ | 单选/判断 |\n| 2.4.8 | Defender for Cloud 的定位与分工 | ⭐⭐ | 单选 |","services":"| 服务 | 主要用途 | 涉及知识点 |\n|---|---|---|\n| Azure 区域基础结构 | 区域清单、区域对与主权区域口径 | 2.1.1 |\n| Azure 虚拟机 | 单台计算、区级部署对象 | 2.1.2、2.2.2、2.2.3 |\n| Azure 资源管理器（ARM） | 资源组与层级结构的组织核心 | 2.1.4、2.1.7 |\n| Microsoft Entra ID | 订阅关联的身份目录 | 2.1.5 |\n| Azure Policy / Azure RBAC | 经管理组下发的两类治理规则 | 2.1.6、2.1.7 |\n| Azure 容器实例与 Azure Container Apps | 容器运行平台 | 2.2.1、2.2.4 |\n| Azure Functions | 事件驱动的函数运行平台 | 2.2.1 |\n| Azure Virtual Machine Scale Sets | 同规格虚拟机自动伸缩 | 2.2.2 |\n| Azure Virtual Desktop | 桌面与应用虚拟化 | 2.2.2 |\n| Azure App Service | Web 应用托管平台 | 2.2.4 |\n| Azure 虚拟网络 / VPN Gateway / ExpressRoute | 云内组网与云地互连 | 2.2.5 |\n| Azure DNS | 云上域名解析 | 2.2.5 |\n| Azure Private Link | 专用终结点实现机制 | 2.2.6 |\n| Azure Blob 存储 | 非结构化对象数据、访问分层与归档 | 2.3.1、2.3.2 |\n| Azure Files / Queue / Table | 文件共享、消息队列、NoSQL 键值表 | 2.3.1 |\n| 存储账户与冗余选项 | 统一入口、LRS 到 RA-GZRS 六档 | 2.3.3、2.3.4 |\n| AzCopy / Storage Explorer / File Sync | 文件搬移三工具 | 2.3.5 |\n| Azure Migrate / Data Box | 评估迁移与海量数据搬运 | 2.3.6 |\n| Microsoft Entra ID | 目录、单点登录、多要素、条件访问 | 2.4.1~2.4.4 |\n| Entra Domain Services / External ID | 托管域与 B2B 访客 | 2.4.1、2.4.3 |\n| Azure RBAC | 角色授权与作用域继承 | 2.4.5 |\n| Microsoft Defender for Cloud | 安全态势评估与威胁防护 | 2.4.8 |","furtherReading":"| 页面 | 什么时候去看 | URL |\n|---|---|---|\n| AZ-900 Study Guide | 3 域 / 11 组 / 57 技能点原文与权重区间 | https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-900 |\n| Azure Storage account overview | 存储账户类型、命名空间与档位 | https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview |\n| Azure Storage redundancy | LRS 到 RA-GZRS 六档官方定义与耐久性口径 | https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy |\n| Blob access tiers | Hot/Cool/Cold/Archive 四档定义与最短存储期 | https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview |\n| Transfer data with AzCopy | 「向、从、账户间复制」官方定位句 | https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-v10 |\n| What is B2B collaboration | 访客对象与 `#EXT#` 标识 | https://learn.microsoft.com/en-us/entra/external-id/what-is-b2b |\n| Azure RBAC overview | 角色分配三要素与作用域 | https://learn.microsoft.com/en-us/azure/role-based-access-control/overview |\n| Azure built-in roles | Owner / Contributor / Reader 官方描述 | https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles |\n| Exam duration and experience | 官方不公布具体题型 | https://learn.microsoft.com/en-us/credentials/support/exam-duration-exam-experience |\n\n这些页面都是微软官方公开文档。中文资料与英文原文说法不一致时，以英文原文为准。\n\n> 编写说明：本文件为睿鸿内部学习资料，非 Microsoft 官方教材。技能点原文取自官方 Study Guide 与 Microsoft Learn 官方文档（2026-11-16 实查），中文表述由我方整理并经人工审校；与官方英文原文不一致时以官方为准。"}},{"domain":3,"name":"描述 Azure 管理与治理","weight":"30–35%","practice":[{"id":"D3-001","d":3,"t":"multiple","q":"月度账单复盘会上，下列关于成本因素的说法哪些正确","o":[{"l":"A","t":"数据进 Azure 的入站流量也按量收费"},{"l":"B","t":"数据出 Azure 才计费，进 Azure 的流量不计费"},{"l":"C","t":"出站流量费率可谈成包月封顶"},{"l":"D","t":"区域不影响单价，只影响延迟"},{"l":"E","t":"闲置资源停机后就不计费了"},{"l":"F","t":"忘关的测试虚机是闲置资源，会持续计费"}],"a":["B","F"],"e":"**正确答案：B、F。** 数据出 Azure 才计费，进 Azure 的流量不计费；忘关的测试虚机是闲置资源，会持续计费。\n\n**为什么对：** 出站计费入站免费是官方口径的经典边界；闲置资源属于你可以直接调整的那堆，删闲置是降本动作里最该先动手的一项。关联考点：官方技能点 3.1.1「描述影响 Azure 中成本的因素」，内容领域 3。\n\n**其他选项为什么错：**\n- A：数据进 Azure 的入站流量也按量收费。官方口径入站不计费，计费的是出方向。\n- C：出站流量费率可谈成包月封顶。费率是平台口径，只能靠架构少跨区搬数据间接省。\n- D：区域不影响单价，只影响延迟。同一服务在不同区域定价可以不同，选区也是成本因素。\n- E：闲置资源停机后就不计费了。忘关的虚机与没人认领的旧磁盘，月月都在计费。\n\n**关键概念：** 出站计费、入站免费；闲置资源月月计费，先删再降本。本题对应考纲 3.1.1。","s":"自编·3.1.1"},{"id":"D3-002","d":3,"t":"single","q":"账单环比涨了三成，复盘发现三类问题：大促后忘关的活动虚机、该转冷没转的营销素材、报表库一直按按需计费。对应的正确降本动作是","o":[{"l":"A","t":"把数据搬进另一个更便宜的区域"},{"l":"B","t":"删闲置、降层级、稳态负载换预留"},{"l":"C","t":"给所有资源统一升一档规格"},{"l":"D","t":"把预算阈值调低，到线自动停机"}],"a":["B"],"e":"**正确答案：B。** 删闲置、降层级、稳态负载换预留。\n\n**为什么对：** 三个问题各对一类因素：闲置资源直接删、营销素材转冷层、报表库这类稳态负载用预留换折扣；降本先从可调的那堆下手，几类动作各就各位。关联考点：官方技能点 3.1.1「描述影响 Azure 中成本的因素」，内容领域 3。\n\n**其他选项为什么错：**\n- A：把数据搬进另一个更便宜的区域。跨区搬运本身产生出站费用，总账未必划算。\n- C：给所有资源统一升一档规格。升档只会更贵，方向反了。\n- D：把预算阈值调低，到线自动停机。预算只通知不停机，停不了任何资源。\n\n**关键概念：** 降本先删闲置、再降层级、稳态负载换预留。本题对应考纲 3.1.1。","s":"自编·3.1.1"},{"id":"D3-003","d":3,"t":"single","q":"关于「哪些成本因素你可以直接调整」，下列归纳正确的是","o":[{"l":"A","t":"档位、区域、定价形态与闲置资源可调，出站费率靠架构间接省"},{"l":"B","t":"所有因素都在平台手里，用户什么都调不了"},{"l":"C","t":"只有出站流量费率可以申请调整"},{"l":"D","t":"区域与档位由平台统一定死，无选择余地"}],"a":["A"],"e":"**正确答案：A。** 档位、区域、定价形态与闲置资源可调，出站费率靠架构间接省。\n\n**为什么对：** 成本因素按归谁管分两堆：档位、区域、形态、闲置是你可以直接调的；出站费率是平台口径，只能通过少跨区搬数据间接省。关联考点：官方技能点 3.1.1「描述影响 Azure 中成本的因素」，内容领域 3。\n\n**其他选项为什么错：**\n- B：所有因素都在平台手里，用户什么都调不了。档位与形态就是你自己选的，闲置资源你自己删。\n- C：只有出站流量费率可以申请调整。费率恰恰是平台口径，能调的是选型那一堆。\n- D：区域与档位由平台统一定死，无选择余地。选区选档本来就是部署时的自选项。\n\n**关键概念：** 能调的先动手：删闲置降档位上预留，费率那堆靠架构省。本题对应考纲 3.1.1。","s":"自编·3.1.1"},{"id":"D3-004","d":3,"t":"single","q":"董事会要新系统的年度云预算，架构师把虚机、存储、监控逐项配上区域与规格，导出估算单附在提案后面。用的是哪个工具","o":[{"l":"A","t":"TCO 计算器，算整体拥有成本"},{"l":"B","t":"成本分析，切账单视图"},{"l":"C","t":"预算加告警，到线提醒"},{"l":"D","t":"定价计算器，估这套 Azure 配置要花多少"}],"a":["D"],"e":"**正确答案：D。** 定价计算器，估这套 Azure 配置要花多少。\n\n**为什么对：** 定价计算器把要用的服务加进估算单，逐项配区域、档位、数量，实时显示预估成本，正对上云前估一套新方案的需求；导出结果拿去做预算或比选。关联考点：官方技能点 3.1.2「探索定价计算器」，内容领域 3。\n\n**其他选项为什么错：**\n- A：TCO 计算器，算整体拥有成本。它估的是本地机房与云方案的整体对比，不是单套配置的价格。\n- B：成本分析，切账单视图。那是资源跑起来之后的复盘工具，事前估算管不着。\n- C：预算加告警，到线提醒。那是事中盯防，出不了事前的估算单。\n\n**关键概念：** 上云前估配置用定价计算器，估算不等于账单。本题对应考纲 3.1.2。","s":"自编·3.1.2"},{"id":"D3-005","d":3,"t":"single","q":"CFO 追问「这套系统不上云、继续自建机房要花多少」。应该用哪个工具回答","o":[{"l":"A","t":"定价计算器，重新配一遍本地硬件"},{"l":"B","t":"成本分析，调出历史账对比"},{"l":"C","t":"TCO 计算器，对比本地与云方案的整体成本"},{"l":"D","t":"Azure Advisor 的成本建议"}],"a":["C"],"e":"**正确答案：C。** TCO 计算器，对比本地与云方案的整体成本。\n\n**为什么对：** TCO 计算器的用途就是本地机房方案与云方案的整体成本对比，帮论证迁云划算与否；它与定价计算器分工：一个答整体对比，一个答单套配置的价格。关联考点：官方技能点 3.1.2「探索定价计算器」，内容领域 3。\n\n**其他选项为什么错：**\n- A：定价计算器，重新配一遍本地硬件。定价计算器只估 Azure 配置，装不下自建机房的账。\n- B：成本分析，调出历史账对比。历史账里没有未发生的自建方案。\n- D：Azure Advisor 的成本建议。它分析现有资源的省钱空间，不管迁移论证。\n\n**关键概念：** 定价计算器估配置、TCO 答迁云与自建的整体对比。本题对应考纲 3.1.2。","s":"自编·3.1.2"},{"id":"D3-006","d":3,"t":"single","q":"生产订阅设了月度预算与阈值告警。某月费用冲过阈值后，资源的状态是","o":[{"l":"A","t":"自动停机保命，等人工恢复"},{"l":"B","t":"不受影响，消费继续，等告警引来的人处理"},{"l":"C","t":"自动降档省费用"},{"l":"D","t":"暂停新资源创建，存量照跑"}],"a":["B"],"e":"**正确答案：B。** 不受影响，消费继续，等告警引来的人处理。\n\n**为什么对：** 官方教程原句：阈值被超过时触发通知，资源不受影响，消费也不会被停止。预算是哨兵不是熔断器，真正停掉那台忘关测试机的是收到告警的人。关联考点：官方技能点 3.1.3「描述 Azure 中的成本管理能力」，内容领域 3。\n\n**其他选项为什么错：**\n- A：自动停机保命，等人工恢复。预算是观察与提醒工具，停不了任何资源。\n- C：自动降档省费用。降档要人动手，预算没有这个能力。\n- D：暂停新资源创建，存量照跑。预算不拦动作，硬性限制要另用策略或配额。\n\n**关键概念：** 预算只通知不停机，停它的是人不是预算。本题对应考纲 3.1.3。","s":"自编·3.1.3"},{"id":"D3-007","d":3,"t":"single","q":"财务问「这个月钱都花在哪些服务上、哪个资源组最贵」。应带他看哪个视图","o":[{"l":"A","t":"成本分析，按订阅、资源组、服务切账单"},{"l":"B","t":"Advisor 的成本类建议"},{"l":"C","t":"Service Health 的事件页"},{"l":"D","t":"定价计算器的估算单"}],"a":["A"],"e":"**正确答案：A。** 成本分析，按订阅、资源组、服务切账单。\n\n**为什么对：** 成本分析按订阅、资源组、服务多个维度切账单视图，看钱花在哪正是它的本职；预算管到线提醒，告警管通知，分析管看分布。关联考点：官方技能点 3.1.3「描述 Azure 中的成本管理能力」，内容领域 3。\n\n**其他选项为什么错：**\n- B：Advisor 的成本类建议。它给降本建议清单，不回答钱花在哪的分布问题。\n- C：Service Health 的事件页。那是平台健康事件，与费用分布无关。\n- D：定价计算器的估算单。估算单是事前的，对不上已发生的账单。\n\n**关键概念：** 钱花在哪看成本分析，到线提醒靠预算，通知靠告警。本题对应考纲 3.1.3。","s":"自编·3.1.3"},{"id":"D3-008","d":3,"t":"single","q":"给生产资源组打了「成本中心」标签，月末成本报表里组内虚拟机却没归进对应科目。原因是","o":[{"l":"A","t":"报表工具出了统计故障"},{"l":"B","t":"资源组标签优先级低于资源标签"},{"l":"C","t":"标签要到下个计费周期才生效"},{"l":"D","t":"资源不会自动继承资源组或订阅的标签"}],"a":["D"],"e":"**正确答案：D。** 资源不会自动继承资源组或订阅的标签。\n\n**为什么对：** 官方口径：资源不自动继承资源组或订阅上的标签；想组内资源都带上，要么逐个显式打，要么用策略自动补齐，标签也打不到管理组上。关联考点：官方技能点 3.1.4「描述标签的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- A：报表工具出了统计故障。数据没错，是标签根本没传到资源那一层。\n- B：资源组标签优先级低于资源标签。不是优先级问题，是继承压根不发生。\n- C：标签要到下个计费周期才生效。标签没有延迟生效的说法，缺就是缺。\n\n**关键概念：** 标签不继承：逐个打或用策略补，管理组上打不了。本题对应考纲 3.1.4。","s":"自编·3.1.4"},{"id":"D3-009","d":3,"t":"single","q":"有人提议给资源打上『机密』标签，带此标签的人才许访问。这个方案的问题是","o":[{"l":"A","t":"可以，标签本来就是权限的载体"},{"l":"B","t":"不行，因为标签不能打在资源上"},{"l":"C","t":"标签是分类维度不是授权判据，权限走角色控制"},{"l":"D","t":"不行，标签只能用英文命名"}],"a":["C"],"e":"**正确答案：C。** 标签是分类维度不是授权判据，权限走角色控制。\n\n**为什么对：** 标签给资源挂上账单系统和资源清单都认得的分类维度：成本归集、资源组织、自动化输入；访问控制走角色分配，两套机制不换岗。关联考点：官方技能点 3.1.4「描述标签的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- A：可以，标签本来就是权限的载体。标签管成本归集与资源筛选，不参与访问判定。\n- B：不行，因为标签不能打在资源上。资源层恰恰是可打标签的层级之一。\n- D：不行，标签只能用英文命名。命名语言不是问题，问题是它根本不判权限。\n\n**关键概念：** 标签管分类、角色管权限，别拿标签当授权。本题对应考纲 3.1.4。","s":"自编·3.1.4"},{"id":"D3-010","d":3,"t":"single","q":"两家团队分别用「Env」和「environment」打环境标签，季度报表汇总时数据对不上。治理上正确的做法是","o":[{"l":"A","t":"汇总时做人工映射转换"},{"l":"B","t":"先定一套统一的标签字典再铺开使用"},{"l":"C","t":"让报表工具兼容所有写法"},{"l":"D","t":"删掉全部标签从头再来"}],"a":["B"],"e":"**正确答案：B。** 先定一套统一的标签字典再铺开使用。\n\n**为什么对：** 标签先有字典再铺开：命名统一一种写法，成本归集与资源筛选才对得上；散着命名早晚乱，统一字典是标签治理的第一步。关联考点：官方技能点 3.1.4「描述标签的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- A：汇总时做人工映射转换。人工映射每次都对不齐，越晚统一代价越大。\n- C：让报表工具兼容所有写法。工具迁就混乱，字典本身还是乱的。\n- D：删掉全部标签从头再来。重打代价大，先定字典才是解。\n\n**关键概念：** 标签先定字典再铺开，报表才对得上。本题对应考纲 3.1.4。","s":"自编·3.1.4"},{"id":"D3-011","d":3,"t":"single","q":"数据散在本地数据库、两家云存储和五个 SaaS 工具里，监管要求盘点全部敏感数据。应使用哪个服务","o":[{"l":"A","t":"Microsoft Purview，扫数据源建统一数据地图"},{"l":"B","t":"Azure Policy，立规矩拦违规"},{"l":"C","t":"资源锁，锁住敏感数据防误删"},{"l":"D","t":"Azure Advisor，出整改建议"}],"a":["A"],"e":"**正确答案：A。** Microsoft Purview，扫数据源建统一数据地图。\n\n**为什么对：** Purview 连上各类数据源自动扫描，把发现的数据登记进统一数据地图并按敏感度分类打标，客户信息、财务数据一目了然，正对盘点需求。关联考点：官方技能点 3.2.1「描述 Microsoft Purview 在 Azure 中的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- B：Azure Policy，立规矩拦违规。Policy 管 Azure 资源的形态合规，管不到数据内容的盘点。\n- C：资源锁，锁住敏感数据防误删。锁拦删除修改动作，不盘点数据在哪是什么。\n- D：Azure Advisor，出整改建议。Advisor 分析资源配置与遥测，不进数据内容那一层。\n\n**关键概念：** 数据盘点用 Purview：先扫再编目，敏感度分类一目了然。本题对应考纲 3.2.1。","s":"自编·3.2.1"},{"id":"D3-012","d":3,"t":"single","q":"Purview 把各数据源扫描登记进数据地图后，合规团队要追溯「这张报表的数据从哪来、经谁加工」。这属于数据地图支撑的哪类能力","o":[{"l":"A","t":"编目分类，按敏感度打标"},{"l":"B","t":"扫描，连数据源摸家底"},{"l":"C","t":"合规拦截，拦住不该的访问"},{"l":"D","t":"血缘，数据的来龙去脉追溯"}],"a":["D"],"e":"**正确答案：D。** 血缘，数据的来龙去脉追溯。\n\n**为什么对：** 数据地图向上支撑搜索、血缘与合规报告：血缘正是数据的来龙去脉，从源头到加工到产出追得清；监管问卷里「数据从哪来」这一栏就靠它回答。关联考点：官方技能点 3.2.1「描述 Microsoft Purview 在 Azure 中的用途」，内容领域 3。\n\n**其他选项为什么错：**\n- A：编目分类，按敏感度打标。打标管分类，不管追溯加工链路。\n- B：扫描，连数据源摸家底。扫描管发现数据，不回答来龙去脉。\n- C：合规拦截，拦住不该的访问。看得见与拦得住是两回事，拦截不是它的机制。\n\n**关键概念：** 数据地图支撑搜索、血缘与合规报告，血缘管来龙去脉。本题对应考纲 3.2.1。","s":"自编·3.2.1"}],"sections":[{"h":"描述 Azure 中的成本管理","body":"### 这一域考什么\n\n域 2 把系统搭起来之后，这一域回答「用起来之后怎么管」：钱怎么算、规矩怎么立、操作用什么工具、健康怎么盯。四条线对应四个任务：\n\n1. **成本**：什么影响账单、怎么事先算、怎么设预算、标签怎么帮忙归集，对应任务 3.1。\n2. **治理与合规**：数据治理（Purview）、资源规则（Azure Policy）、误删防护（资源锁），对应任务 3.2。\n3. **管理与部署**：门户、命令行、混合管理（Arc）、模板化部署（IaC 与 ARM），对应任务 3.3。\n4. **监控**：建议（Advisor）、服务健康（Service Health）、平台监控（Azure Monitor 家族），对应任务 3.4。\n\n考法以「工具与场景匹配」为主：给一个需求，选一个工具。辨析密度最高的三处——预算会不会自动停资源、锁和角色权限的区别、Monitor 家族四个组件谁管什么。\n\n### 读完这个域要能做什么\n\n这门课写给有 IT 经验、但还没用过云的同事。读完本域应能：\n\n- 给一个方案估出成本构成，并说出哪些项你可以控制、哪些是平台口径。\n- 立规矩时选对工具：资源合规用 Policy、防误删用锁、数据资产治理用 Purview、成本归集用标签。\n- 给一个操作场景选对通道：门户、命令行、Cloud Shell、Arc、模板部署。\n- 盯健康时分清三层：全球状态、你的订阅受不受影响、单个资源好不好。\n- 把监控需求对到 Monitor 家族的正确组件上。\n\n### 和其他认证怎么接\n\n这门课不是孤立的。同一件事在别家云、别的级别里换了名字，认出来就不必重学。下面三条对照都按「哪里像、哪里不一样」写，不谈哪套更好。\n\n| 其他认证课 | 对应的那件事 | 这里有什么不同 | 什么时候该想起它 |\n|---|---|---|---|\n| AWS 云从业者（CLF-C02） | 成本工具、标签、治理服务全套对照 | 预算告警、标签归集两边同构，产品名各一套（Budgets 对 Cost Management 预算），答题认本域口径 | 学成本工具觉得似曾相识时 |\n| Azure 管理员（AZ-104） | 本域每个工具都是它的日常操作对象 | 这门课认「是什么、何时用」，AZ-104 考「怎么配、怎么排障」 | 打算往 AZ-104 进阶时 |\n| Azure 架构师专家（AZ-305） | 治理与成本是架构评审的固定支柱 | AZ-305 把本域工具组合成治理方案设计，本域只要求认得出单件 | 学完想走架构方向时 |\n\n对照只用来帮你迁移已有理解。做题时以本域的官方口径为准，别把别家云的默认值带进来。\n\n### 官方口径的三条边界\n\n- 官方 Study Guide 只给技能点，不给题型，也不给题数。\n- 官方考试政策原句写明：考前不公布具体考试形式或题型。\n- 官方权重是 30–35% 这样的区间，不是精确占比。\n\n这三条决定了本域的表格怎么填。凡是官方没说的，表里就写官方未公布，不拿练习题的印象补空。\n\n#### 这一节学什么\n这一节对应考纲任务 3.1「描述 Azure 中的成本管理」。\n\n> 官方原名：Describe cost management in Azure\n\n四个技能点是花钱的完整闭环：先知道什么在影响账单，再用计算器事先算，跑起来用预算和告警盯着，最后用标签把账分摊到人头。这条线里埋着这门课最经典的陷阱题：预算到线到底停不停资源。\n\n#### 描述影响 Azure 中成本的因素\n\n> 官方原名：Describe factors that can affect costs in Azure\n\n**这条在问什么。** 考题给一个成本项或一句归因（「为什么这个月贵了」），让你认出它属于哪类因素、你能不能控制它。高频陷阱：「入站流量也计费」。\n\n**定义**：影响成本的主要因素，官方口径下这批：\n\n1. **服务与规格选择**：虚拟机选多大的档位、存储选哪个层，单价直接跟着选型走。\n2. **区域差异**：同一个服务在不同区域定价可以不同，选区不仅是延迟和合规的事，也是成本的事。\n3. **入站与出站流量**：数据进 Azure（入站）官方口径不计费；数据出 Azure（出站）计费。这是考频很高的一条。\n4. **层级与冗余档位**：存储的冷热分层（2.3.2）、冗余档位（2.3.3）单价各不相同。\n5. **定价形态**：按需、预留、Spot 的形态选择（1.1.6），稳态负载用按需最贵。\n6. **闲置资源**：忘了关的测试机、没人认领的旧磁盘，月月在计费。\n\n**怎么运作**。把这些因素按「归谁管」分两堆：档位、区域、形态、闲置，是你可以直接调的；出站流量费率这类是平台口径，你只能通过架构（少跨区搬数据）间接省。\n\n**什么时候用，什么时候别用**。降本动作先从「可调的堆」下手：删闲置、降档位、稳态上预留、冷数据降层。别为省出站流量把数据搬来搬去——搬运本身也有成本，按场景算总账。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 月度账单环比涨了三成。复盘清单：三台大促后忘关的活动虚机（闲置）、一批该转冷没转的营销素材（层级）、稳态报表库一直按需计费（形态）、新业务把备份跨区搬了一份（出站）。四个因素四类动作，下月回落。\n\n**关联服务**：定价计算器（事前估算，3.1.2）、成本管理与预算（事中盯防，3.1.3）、标签（事后归集，3.1.4）。\n\n#### 探索定价计算器\n\n> 官方原名：Explore the pricing calculator\n\n**这条在问什么。** 考题给「采购前想知道方案要花多少钱」的场景，让你选对工具。辨析点是定价计算器和 TCO 计算器的分工。\n\n**定义**：定价计算器（pricing calculator）是官方的网页估算工具：把要用的服务与规格加进估算单，逐项配参数（区域、档位、数量），实时显示预估的月度或年度成本。它估的是「这套 Azure 配置要花多少」。\n\n官方培训材料里还有一件配套工具：总拥有成本计算器（TCO calculator，total cost of ownership calculator），用途不同——它估的是「本地机房方案与云方案的整体成本对比」，帮你论证迁云划算不划算。两件工具在 AZ-900 官方培训的同一个单元里教，分工要记牢。\n\n**怎么运作**。使用节奏三步：\n\n1. 把方案里的服务逐项加进单子。\n2. 每项调好区域与规格参数。\n3. 导出估算结果，拿去做预算或比选。\n\n它给的是估算，不是账单——实际费用随实际用量与当期费率走，这个边界要心里有数。\n\n**什么时候用，什么时候别用**。上云前估一套新方案 → 定价计算器。论证「要不要整体迁云」→ TCO 计算器。已经跑起来的账单复盘 → 那是成本分析（3.1.3）的活，计算器管不着。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 要给董事会报新系统的年预算：架构师在定价计算器里搭出虚机加存储加监控的整套配置，导出估算单附在提案后面；CFO 追问「这套不上云、自建机房要多少」——补一份 TCO 计算器对比，五年总账一列，差价一目了然。\n\n**关联服务**：Azure 定价计算器（估算工具）、TCO 计算器（迁移论证工具）、成本管理（实际账单侧，3.1.3）。\n\n#### 描述 Azure 中的成本管理能力\n\n> 官方原名：Describe cost management capabilities in Azure\n\n**这条在问什么。** 资源跑起来之后怎么盯成本。这条埋着本域最经典的判断题：预算到了阈值，资源会不会自动停。\n\n**定义**：成本管理（Cost Management）是 Azure 的费用盯防工具组，三件主力：\n\n1. **成本分析**：按订阅、资源组、服务维度切账单视图，看钱花在哪。\n2. **预算**：给订阅或资源组设金额阈值，到线触发通知。官方教程原句照录：阈值被超过时触发通知，资源不受影响，消费也不会被停止。预算是观察与提醒工具，不是熔断器。\n3. **成本告警**：官方口径三类——预算告警、额度告警、部门支出配额告警，另有可开启的成本异常告警。\n\n**怎么运作**。正确用法是把预算当「哨兵」：阈值设在预算的八成，留出反应时间；告警来了由人（或流程）去处理——查原因、降档位、删闲置。真要硬性限制消费，要另用策略或配额去拦动作，不是靠预算。\n\n**什么时候用，什么时候别用**。给部门设月度上限盯超支 → 预算加告警。找「哪块最贵、哪里能省」→ 成本分析视图。指望「到线自动停机」→ 换思路，预算停不了任何东西，这条判断题年年有人栽。\n\n💡 **场景举例**（虚构教学示意）：Contoso 给生产订阅设了月度预算，八成时触发邮件。某月费用继续上冲，没有任何资源被停——值班同事收到告警后排查，揪出一台忘了关的测试机。停它的是人，不是预算。\n\n**关联服务**：成本分析与预算（本条主体）、成本告警（通知通道）、Azure Policy（真正拦动作的候选，3.2.2）、标签（成本归集的维度，3.1.4）。\n\n#### 描述标签的用途\n\n> 官方原名：Describe the purpose of tags\n\n**这条在问什么。** 考题给「按部门分摊成本」「按环境筛选资源」的需求，认出标签；再考标签的继承边界——资源会不会自动带上资源组的标签。\n\n**定义**：标签（tags）是打在资源上的「名-值对」，比如「部门：市场」「环境：生产」。它给资源挂上账单系统和资源清单都认得的分类维度，主要用途：\n\n- 成本归集：成本分析按标签把账分摊到部门、项目。\n- 资源组织：按标签筛资源、批量操作。\n- 自动化输入：策略和脚本可以按标签定位资源。\n\n**怎么运作**。继承边界有一条官方口径必须记牢：资源不会自动继承资源组或订阅上的标签。想组内资源都带上，要么逐个显式打，要么用策略自动补齐（3.2.2 的 Policy 能干这个活）。标签也打不到管理组上——可打的层级是资源、资源组、订阅。\n\n**什么时候用，什么时候别用**。成本分摊、环境区分、负责人归属 → 标签正合适。当权限判据用 → 不合适，标签是「分类」不是「授权」，权限走 RBAC（2.4.5）。命名散着来 → 早晚会乱：先定一套标签字典（「Env」还是「环境」还是「environment」，统一一种），再铺开打。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 给生产资源组打上「成本中心」标签，月末成本报表里组内虚拟机却没归进去——原因是标签不继承。管理员改用策略给组内资源自动补齐标签，下个月报表才对上。\n\n**关联服务**：资源管理器标签（载体）、Azure Policy（自动补标签，3.2.2）、成本管理（按标签分摊，3.1.3）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「数据进 Azure 的入站流量也计费」 | 官方口径入站不计费 | 数据进 Azure 不计费，数据出 Azure 才计费 |\n| 「定价计算器能算出下月实际账单」 | 它给的是估算，不是账单 | 实际费用随实际用量与当期费率走；跑起来的复盘归成本分析 |\n| 「预算到了阈值会自动停掉资源」 | 官方原句：阈值被超过时触发通知，资源不受影响 | 预算是哨兵不是熔断器；要硬拦动作另用策略或配额 |\n| 「资源组打了标签，组内资源自动都有」 | 标签不会向下继承 | 逐个显式打，或用策略自动补齐；标签也打不到管理组上 |\n| 「标签可以拿来控制谁能访问」 | 标签是「分类」不是「授权」 | 权限判据走 RBAC；标签管成本归集、资源筛选、自动化输入 |\n| 「TCO 计算器就是定价计算器换个名」 | 两件工具答两道题 | 定价计算器估「这套 Azure 配置多少钱」；TCO 估「迁云与自建的整体对比」 |\n\n#### 记忆要点\n\n1. **两件算器**：定价计算器估 Azure 配置，TCO 计算器论证迁云与自建对比。\n2. **预算哨兵**：阈值设在八成留反应时间；只通知、不停机，停它的是人不是预算。\n3. **告警三类**：预算告警、额度告警、部门支出配额告警，另有可开启的异常告警。\n4. **入出分界**：入站不计费、出站计费；跨区搬数据就是在给出站送账单。\n5. **标签边界**：资源不自动带资源组的标签；可打层级是资源、资源组、订阅。\n6. **先定字典**：标签命名先统一一套字典再铺开，报表才对得上。\n\n---"},{"h":"描述用于治理与合规的 Azure 特性和工具","body":"#### 这一节学什么\n这一节对应考纲任务 3.2「描述用于治理与合规的 Azure 特性和工具」。\n\n> 官方原名：Describe features and tools in Azure for governance and compliance\n\n三个技能点是三件不同粒度的规矩：Purview 管数据资产的可见与合规，Azure Policy 管资源长什么样，资源锁管关键资源不许被碰坏。三件各管一段，混着出题。\n\n#### 描述 Microsoft Purview 在 Azure 中的用途\n\n> 官方原名：Describe the purpose of Microsoft Purview in Azure\n\n**这条在问什么。** 考题给「数据散在本地、多家云和 SaaS 里，谁也说不清有哪些数据、敏不敏感」的场景，认出 Purview。辨析点：它管的是数据资产，不是资源合规。\n\n**定义**：Microsoft Purview 是微软的数据治理平台，官方定位覆盖本地、多云、SaaS 的数据资产。它干三件事：\n\n1. **扫**：连上各类数据源（数据库、存储、SaaS 应用）自动扫描，摸清家底。\n2. **编目分类**：把发现的数据登记进统一数据地图（data map），按敏感度分类打标——哪些是客户信息、哪些是财务数据，一目了然。\n3. **供查**：数据地图向上支撑搜索、血缘（数据的来龙去脉）与合规报告。\n\n**怎么运作**。Purview 解决的是「看不见」：数据在哪、是什么、谁在用，先看得见才谈得上管。它和 Azure Policy 的分界记一句话：Purview 管数据资产的内容合规，Policy 管 Azure 资源的形态合规。\n\n**什么时候用，什么时候别用**。监管要求盘点敏感数据、跨本地多云做数据目录 → Purview。拦资源乱建、拦不合规部署 → Policy（下一条）。别把两件工具互相顶岗——对象不同，手段也不同。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 收到行业监管的数据盘点要求：三年间数据散在本地数据库、两家云存储和五个 SaaS 工具里。合规团队用 Purview 扫完全部源头，统一数据地图里按敏感度分了类——回答监管问卷从「两周人肉排查」变成「一张地图导出」。\n\n**关联服务**：Microsoft Purview（数据治理平台）、Azure Policy（资源侧治理，3.2.2）、标签（资源侧分类，3.1.4）。\n\n#### 描述 Azure Policy 的用途\n\n> 官方原名：Describe the purpose of Azure Policy\n\n**这条在问什么。** 考题给一条公司规矩（「只许在指定区域建资源」「存储必须加密」），让你选 Policy，并配对正确的效果。这条和治理好处（1.2.3）、Azure RBAC（2.4.5）都有联动。\n\n**定义**：Azure Policy 用策略定义给资源立规矩，官方口径：策略定义对资源强制执行规则与效果。它管的是「做出来的资源长什么样」，不是「谁能做」——后者是 RBAC 的活（2.4.5）。一个人有再高的角色权限，建出来的资源照样被策略拦下。\n\n常见效果（官方效果清单，照录）：`deny`（拦下不让建）、`audit`（只记录不合规）、`append`（自动补字段）、`modify`（自动改属性，比如补标签）、`deployIfNotExists`（缺了就自动补部署）、`disabled`（暂停启用）。多个定义可打包成一个计划（initiative），一次分配覆盖整套规矩。\n\n**怎么运作**。生效三步：写策略定义 → 按作用域分配（管理组、订阅、资源组，2.1.7 的树）→ 看合规性结果。分配的姿势讲究节奏：新规矩先 `audit` 跑一段，摸清存量里多少不合规、影响谁，再切成 `deny` 强制——一上来就 deny，历史部署脚本会在没人注意时集体失败。\n\n**什么时候用，什么时候别用**。要「资源必须长这样」（区域限制、加密要求、标签补齐）→ Policy。要「这个人能不能做这事」→ RBAC。要「这块资源不许删」→ 那是锁的活（下一条）。别拿 Policy 当权限系统用，两边对象根本不同。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 规定生产资源只许建在两个区域。管理员先按 `audit` 分配，看一周合规报表，摸清存量例外；确认影响面后切成 `deny`。此后新资源从第一天起就合规，历史资源按例外清单逐个整改。\n\n**关联服务**：Azure Policy（定义、计划、分配、合规性视图）、管理组与订阅（分配作用域，2.1.7）、Azure RBAC（分工对照，2.4.5）、Purview（数据侧对照，3.2.1）。\n\n#### 描述资源锁的用途\n\n> 官方原名：Describe the purpose of resource locks\n\n**这条在问什么。** 考题给「权限都没问题，但这台生产库就是不许删」的需求，认出锁；再考锁和角色权限的区别——锁拦的是动作本身，对所有人生效。\n\n**定义**：资源锁（resource locks）是独立于 RBAC 的另一层保护，两级：\n\n- **CanNotDelete（不能删除）**：允许读和改，只拦删除。\n- **ReadOnly（只读）**：连改都拦，只许看。\n\n两条官方口径必须背牢：锁从父作用域向下继承——在资源组挂锁，组内所有资源都带上，后来加进来的也带；锁对所有角色生效——Owner 也不例外。这正是它和 RBAC 的分工边界：RBAC 管「谁能发起操作」，锁管「这个操作允不允许发生」。\n\n**怎么运作**。挂锁层级要挑对：想保护一组资源就挂资源组，想保护单个资源就挂资源；别往管理组根上随手挂——继承下去波及全部订阅。要动被锁资源，按流程评估后解锁再操作，不要靠升权绕——升权绕不过锁，锁不认角色。\n\n**什么时候用，什么时候别用**。防生产库被误删 → `CanNotDelete`，日常运维照常。冻结一个只该看的环境（审计快照、法务保全）→ `ReadOnly`。给「正常要改」的环境挂 `ReadOnly` 会把运维全堵死——用前确认真没人需要改。\n\n💡 **场景举例**（虚构教学示意）：Contoso 给生产资源组挂了 `CanNotDelete`。一次清理运动里，一位有 Owner 权限的同事要删旧虚拟机，操作被拦。他没去怀疑权限，查了锁，按流程评估、临时解锁、完成删除、重新上锁。权限解决不了的事，正是锁存在的理由。\n\n**关联服务**：资源管理锁（载体）、Azure RBAC（分工对照，2.4.5）、资源组与订阅（锁的作用域，2.1.4、2.1.5）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「Purview 和 Policy 管的是同一摊事」 | 一个管数据资产，一个管 Azure 资源 | Purview 管数据资产的内容合规，Policy 管资源的形态合规 |\n| 「Policy 能管住人的权限」 | Policy 管「资源长什么样」，RBAC 才管「谁能做」 | 角色权限再高，建出来的资源不合规矩照样被拦下 |\n| 「新规矩直接上 deny 执行最干净」 | 一上来就 deny，历史部署脚本会在没人注意时集体失败 | 先 audit 摸清存量，确认影响面再切 deny |\n| 「Owner 权限最大，锁也拦不住他」 | 锁对所有角色生效，Owner 也不例外 | 锁拦的是动作本身；动被锁资源按流程解锁，升权绕不过 |\n| 「怕误改就把日常运维的环境挂 ReadOnly」 | ReadOnly 连改都拦，运维全堵死 | 正常要改的环境用 `CanNotDelete`；`ReadOnly` 留给只该看的环境 |\n| 「锁挂到管理组根上一劳永逸」 | 继承下去波及全部订阅 | 挂锁挑层级：保一组挂资源组，保单个挂资源 |\n\n#### 记忆要点\n\n1. **三件规矩**：数据资产归 Purview，资源形态归 Policy，动作本身归锁。\n2. **效果六种**：`deny` 拦下、`audit` 记录、`append` 补字段、`modify` 改属性、`deployIfNotExists` 补部署、`disabled` 暂停。\n3. **上线节奏**：新规矩先 audit 跑一段，摸清存量再切 deny；定义可打包成计划一次分配。\n4. **锁两级别**：`CanNotDelete` 只拦删，`ReadOnly` 连改都拦。\n5. **锁三件事**：从父作用域向下继承、对所有角色生效、与 RBAC 分工——一个管动作允不允许，一个管谁发起。\n6. **数据地图**：Purview 先扫描、再编目分类，向上支撑搜索、血缘与合规报告。\n\n---"},{"h":"描述用于管理和部署 Azure 资源的特性和工具","body":"#### 这一节学什么\n这一节对应考纲任务 3.3「描述用于管理和部署 Azure 资源的特性和工具」。\n\n> 官方原名：Describe features and tools for managing and deploying Azure resources\n\n五个技能点从「手动」讲到「自动」：\n\n1. 门户：图形操作面。\n2. 命令行三件套：可重复操作。\n3. Azure Arc：把混合环境拉进一个管理面。\n4. 基础设施即代码与 ARM 模板：把环境本身变成文件。\n\n考法全是「给操作场景选工具」。\n\n#### 描述 Azure 门户\n\n> 官方原名：Describe the Azure portal\n\n**这条在问什么。** 考题给操作场景选通道，门户是「人工浏览」那一端。它单独成条不是为了考点击，是为了考「什么时候门户最合适、什么时候不合适」。\n\n**定义**：Azure 门户（Azure portal）是浏览器里的图形控制台：创建、配置、查看 Azure 资源的官方 Web 界面。能自定义仪表盘、按资源组浏览、直接跳到某台虚拟机的监控视图。个人账户免费注册也能用（门户本身不是收费项）。\n\n**怎么运作**。门户的长处是「看得见」：图形化属性页、资源依赖关系、内嵌的监控图表。对零云基础的人是最友好的入口——这门课建议你边学边在门户里对照着看。\n\n**什么时候用，什么时候别用**。第一次接触某服务、要看某资源的实时状态、做一次性的小改动 → 门户。要重复一百次的操作、要进版本管理的环境变更、要自动化触发 → 命令行或模板（后面的技能点）。判断标准一句话：这操作要不要「可重复」——要，就别在门户里点。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 新工程师第一天，在门户里按引导建出一台测试虚拟机。顺手看到它关联的磁盘、网卡和监控图——门户把「一台虚拟机是一撮资源」（2.2.3）直接画在了眼前。第三天他要给 20 台机器做同样配置，转用命令行写循环，不再点门户。\n\n**关联服务**：Azure 门户（图形控制台）、Azure CLI 与 PowerShell（命令行通道，3.3.2）、Cloud Shell（免装环境，3.3.2）。\n\n#### 描述 Azure Cloud Shell、Azure CLI 和 Azure PowerShell\n\n> 官方原名：Describe Azure Cloud Shell, Azure CLI, and Azure PowerShell\n\n**这条在问什么。** 三个名词打包在一个技能点里，考的就是「三者的关系与分工」：CLI 和 PowerShell 是两套命令工具，Cloud Shell 是跑它们的现成环境。\n\n**定义**：三件东西各是什么：\n\n1. **Azure CLI（Azure 命令行接口）**：跨平台的命令行工具，`az` 开头的命令（如 `az group create`），Windows、Linux、macOS 都能装，命令风格是命令式——你逐步下指令。\n2. **Azure PowerShell**：PowerShell 里的 Azure 摆一组模块，用 `New-AzResource` 这类「动词-名词」风格的命令管理资源，Windows 生态里最顺手。\n3. **Azure Cloud Shell**：浏览器里直接打开的现成命令环境，不用在本机装任何东西——里面 Bash 和 PowerShell 两种都提供，登录身份直接继承你的门户会话，还带一块暂存盘。\n\n**怎么运作**。三者的组合关系：CLI 与 PowerShell 是「两套语法」，Cloud Shell 是「一台随开随用的机器」。用哪套语法看团队习惯与脚本生态，在 Cloud Shell 里跑还是本机装，看你在不在自己电脑旁边。\n\n**什么时候用，什么时候别用**。可重复的操作、脚本化运维 → CLI 或 PowerShell。临时在任何机器上干活（同事电脑、平板）→ Cloud Shell。一次性浏览查看 → 门户更直观（3.3.1）。别把「三选一」想成排他——真实工作里图形、命令、云端 Shell 三件来回切换。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 运维在公司电脑装了 Azure CLI 写部署脚本；出差异地要应急查资源，打开浏览器登 Cloud Shell 直接跑同款命令；旁边 Windows 老运维用 PowerShell 模块写了十年积累的脚本。三套并存，谁也没逼谁换。\n\n**关联服务**：Azure CLI（az 命令族）、Azure PowerShell（Az 模块族）、Azure Cloud Shell（浏览器内环境）、Azure 门户（图形对照面，3.3.1）。\n\n#### 描述 Azure Arc 的用途\n\n> 官方原名：Describe the purpose of Azure Arc\n\n**这条在问什么。** 考题给「一部分服务器在本地机房、还有几台在别家云，想用同一套 Azure 工具管」的场景，认出 Arc。\n\n**定义**：Azure Arc 把 Azure 之外的服务器和资源（本地机房、其他云）注册进 Azure 资源管理器的管理面，让它们「像 Azure 原生资源一样被管」。装了 Arc 代理的一台本地服务器，在门户里出现在你的资源清单中，能套用同一套策略、标签、监控。\n\n**怎么运作**。Arc 的本质是「统一管理面」而不是「搬迁」：服务器还留在原地跑，只是被纳管进来。这与混合云模型（1.1.3）是配套设计——数据和应用留在本地，治理和工具面统一到 Azure。\n\n**什么时候用，什么时候别用**。混合环境要统一策略、统一监控、统一标签 → Arc。资源已经全在 Azure 里 → 用不上 Arc（原生就在管理面里）。要真把工作负载迁进 Azure → 那是迁移方案的活（2.3.6 的 Azure Migrate），Arc 不搬东西。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 有 30 台本地老服务器一时迁不动。运维给它们装上 Arc 代理，门户里现在能看到全部资产——本地 30 台加云上若干台在同一张清单里，一条「必须装补丁」的策略两头一起生效。迁移逐年推进，管理面从第一天起就是统一的。\n\n**关联服务**：Azure Arc（纳管通道）、Azure Policy 与标签（统一治理规则，3.2.2、3.1.4）、Azure Monitor（统一监控，3.4.3）、混合云模型（部署侧对照，1.1.3）。\n\n#### 描述基础设施即代码（IaC）\n\n> 官方原名：Describe infrastructure as code (IaC)\n\n**这条在问什么。** 考题给「环境要可重复部署、要能回滚、配置要留档」的需求，认出 IaC。它在「可管理性」（1.2.4）埋过伏笔，这里正式展开。\n\n**定义**：基础设施即代码（IaC，infrastructure as code）是把环境定义写成代码文件的做法：虚拟网络、虚拟机、存储及其全部参数，都声明在模板文件里；执行部署时由工具按文件创建出整套环境。\n\n它带来三个直接收益：\n\n1. **可重复**：同一份文件在任何订阅、任何时间部署出同一副环境。\n2. **可版本化**：环境变更走文件的提交历史，改了什么、谁改的、为什么改，全在版本库里。\n3. **可审计**：环境「长什么样」有权威文本，不靠某位同事的记忆。\n\n**怎么运作**。IaC 与命令式脚本的差别在「描述结果」还是「描述步骤」：命令式脚本说「先建 A，再建 B，建完 C」；IaC 模板说「最终要有 A、B、C」——工具自己算怎么到达。这也让重复部署变得安全：已经存在的东西不会被重复建坏。\n\n**什么时候用，什么时候别用**。正式环境、团队协作、要一致性的测试环境 → IaC。一次性实验、随手搭着玩的沙盒 → 门户点两下更快，写模板反而重。别手工改完环境又不同步回模板——下次部署会把你的手工改动「抹掉」，这是 IaC 的纪律成本。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的演示环境原来靠工程师手工搭，每次一小时还总有遗漏。改写成模板后：新销售申请演示环境，流水线按模板十分钟出一套一模一样的；用完整个删除，不留孤儿资源。环境从「手艺」变成了「产品」。\n\n**关联服务**：ARM 模板（Azure 的 IaC 载体，3.3.5）、Azure CLI 与 PowerShell（命令式通道，3.3.2）、可管理性（1.2.4 的伏笔）。\n\n#### 描述 Azure Resource Manager（ARM）与 ARM 模板\n\n> 官方原名：Describe Azure Resource Manager (ARM) and ARM templates\n\n**这条在问什么。** 考题考两个层面：ARM 本体是什么（所有资源的统一管理面），以及 ARM 模板是什么（IaC 在 Azure 的具体格式）。\n\n**定义**：先分两层——\n\n- **Azure 资源管理器（ARM，Azure Resource Manager）**：Azure 的部署与管理控制面。你在门户点的、CLI 敲的、模板提交的，最终都汇成对 ARM 的请求，由它统一创建、更新、删除资源。资源组这个容器前面讲过（2.1.4），这条讲 ARM 的另一面：一切操作的单通道。\n- **ARM 模板（ARM template）**：JSON 格式的声明式文件，定义「这次部署要有哪些资源、什么参数」。提交给 ARM 后，它按模板把资源一次建齐——这就是上一条基础设施即代码在 Azure 的原生形态。\n\n**怎么运作**。模板里写「要什么」，不写「怎么拿」：同一份模板给测试环境部署出小规格、给生产环境部署出大规格——差异全在参数文件里。模板可进版本库、可审批、可复用，环境变更从此有账可查。\n\n**什么时候用，什么时候别用**。正式的环境定义、要可重复的部署 → ARM 模板。临时小改、查个属性 → 门户或 CLI 顺手就干。别一边用模板一边手工改环境——两边会漂移，以谁为准说不清（上一条的纪律问题在这里具体化）。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的环境定义收敛成一份模板加两份参数（测试档、生产档）。季度扩容时改的是参数文件：测试环境先部署验证，通过后生产环境同一条流水线发版。环境变更从此走评审，不再走「谁在线谁点得快」。\n\n**关联服务**：Azure Resource Manager（控制面本体）、ARM 模板（声明式部署文件）、资源组（部署的落点容器，2.1.4）、基础设施即代码（方法论层，3.3.4）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「门户是万能操作台，什么都用它点」 | 要「可重复」的操作别在门户里点 | 一次性浏览、临时小改用门户；重复一百次、要进版本管理走命令行或模板 |\n| 「Cloud Shell 得先在本机装环境」 | 它是浏览器里直接打开的现成环境 | Bash 和 PowerShell 两种都提供，登录身份直接继承门户会话 |\n| 「CLI 和 PowerShell 必须二选一」 | 两套语法不是对立阵营 | 选哪套看团队习惯与脚本生态；图形、命令、云端 Shell 三件来回切换 |\n| 「Arc 是把本地服务器搬进 Azure」 | 只纳管，不搬迁 | 服务器留在原地跑，套同一套策略、标签、监控；真搬迁走 Azure Migrate |\n| 「ARM 和 ARM 模板是一回事」 | 一个是控制面，一个是文件格式 | ARM 是门户、CLI、模板请求汇成的单通道；ARM 模板是 JSON 声明式部署文件 |\n| 「一边用模板部署、一边手工改环境，两不耽误」 | 两边会漂移，以谁为准说不清 | 手工改动要同步回模板，否则下次部署会被抹掉 |\n\n#### 记忆要点\n\n1. **选面判据**：这操作要不要「可重复」——要，就别在门户里点。\n2. **三件套**：CLI 与 PowerShell 是两套语法，Cloud Shell 是跑它们的现成机器。\n3. **Arc 纳管**：统一管理面、不搬东西；资源已经全在 Azure 里的用不上它。\n4. **IaC 三益**：可重复、可版本化、可审计。\n5. **描述结果**：模板写「要什么」不写「怎么拿」；环境差异全在参数文件里。\n6. **模板纪律**：手工改动同步回模板；不同步，下次部署被抹掉。\n\n---"},{"h":"描述 Azure 中的监控工具","body":"#### 这一节学什么\n这一节对应考纲任务 3.4「描述 Azure 中的监控工具」。\n\n> 官方原名：Describe monitoring tools in Azure\n\n三个技能点按「粒度」排：Advisor 给建议（主动体检），Service Health 报平台事件（平台对你说），Azure Monitor 收数据与告警（你盯资源与应用）。考法是「给需求选组件」。\n\n#### 描述 Azure Advisor 的用途\n\n> 官方原名：Describe the purpose of Azure Advisor\n\n**这条在问什么。** 考题给「有没有工具主动告诉我哪里可以省钱、哪里有隐患」的需求，认出 Advisor。辨析点：Advisor 只建议，不执行。\n\n**定义**：Azure Advisor 分析资源配置与遥测数据，给出主动、可操作的建议，官方口径覆盖五类：成本（找闲置、省费用）、性能、可靠性、安全、卓越运营。\n\n**怎么运作**。它在门户里按类别给建议清单，每条带影响说明和整改指引。要点是那句官方口径：Advisor 只给建议，不自动改动资源。整改是人（或流程）照着清单去做——它是「体检报告」，不是「自动治疗机」。\n\n**什么时候用，什么时候别用**。想主动发现降本与隐患机会 → 定期看 Advisor。想强制资源必须合规 → Policy（3.2.2）。想收到「正在出事」的通知 → 那是告警的活（3.4.3）。别把 Advisor 的建议当强制——它说了不算，你做了才算。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 运维季度例行打开 Advisor：成本页揪出三台闲置虚机、性能页指出某个数据库档位偏小、可靠页提醒某资源组没有冗余配置。清单派给三个负责人，季度末复查清零——建议到整改的「最后一公里」靠人走完。\n\n**关联服务**：Azure Advisor（建议引擎）、Azure Policy（强制对照，3.2.2）、Azure Monitor（监控对照，3.4.3）。\n\n#### 描述 Azure Service Health\n\n> 官方原名：Describe Azure Service Health\n\n**这条在问什么。** 考「出了平台事件，从哪知道你的订阅受不受影响」。辨析三层视图：全球状态页、你的 Service Health、单个资源的健康。\n\n**定义**：Azure Service Health 是「个性化的平台健康视图」，官方口径覆盖三类内容：\n\n1. **服务问题（Service issues）**：正在发生的、可能影响你的 Azure 服务故障——只显示与你的订阅相关的。\n2. **计划维护（Planned maintenance）**：将来会做的维护，提前告诉你哪些服务在哪些时段受影响。\n3. **健康公告（Health advisories）**：需要你留意或行动的通知，如配置变更、功能弃用。\n\n它和两层「邻居」的分界要记牢：往上是 Azure 状态页（Azure Status，全球级、不针对你）；往下是资源健康（Resource Health，单个资源好不好用）。三层口径从全球到个人再到单资源，官方各有专门页面。\n\n**怎么运作**。Service Health 还能配告警：订阅相关的事件发生时给你发通知——不等用户报障你先知道。这是它和 Monitor 告警的分工：Service Health 管「平台的事」，Monitor 告警管「你的资源与你的指标」（3.4.3）。\n\n**什么时候用，什么时候别用**。想知道「这次 Azure 出事影响没影响到我」→ Service Health，不是全球状态页（那页不知道你是谁）。想知道「我这台虚拟机现在为什么不通」→ 资源健康视图。想监控自己的应用性能 → Monitor（下一条）。\n\n💡 **场景举例**（虚构教学示意）：某天清晨 Fabrikam 的运维群弹出一条 Service Health 告警：某区域存储服务出现降级，受影响清单里有公司两个存储账户。运维赶在客户上班前通知了业务侧——上游还没炸完，下游已经知情。同一时刻刷新闻看全球状态页的同行，还在对照「这故障跟自己有没有关系」。\n\n**关联服务**：Azure Service Health（个性化平台事件）、Azure 状态页（全球对照）、资源健康（单资源视图）、Azure Monitor（资源与应用侧，3.4.3）。\n\n#### 描述 Azure Monitor\n\n> 官方原名：Describe Azure Monitor, including Log Analytics, Azure Monitor alerts, and Azure Monitor Application Insights\n\n**这条在问什么。** 这是本域最长的一条技能点，一个主件带三个组件。考题给一个监控需求（查日志、出事通知、看应用表现），让你选组件。四件的名字都像，考的就是分界。\n\n**定义**：Azure Monitor 是平台级监控服务，从资源、应用两处收集数据并支撑分析与告警。三个主力组件各管一段：\n\n1. **Log Analytics**：日志的集中地与查询工作区。各处发来的日志汇进工作区，用查询语言检索分析——「查过去 24 小时所有失败登录」这类问题的答案在这里。\n2. **Azure Monitor 告警（alerts）**：规则引擎。设条件（某指标越线、某日志出现特定事件），条件满足就通知你——监控从「事后翻」变成「出事喊你」。\n3. **Application Insights（应用洞察）**：应用侧的监控。你的应用接入后，请求量、响应时间、失败率、依赖调用——应用的内部表现尽收。\n\n**怎么运作**。数据分两类流入：指标（metrics，随时间的数值，如 CPU 百分比）与日志（logs，事件记录）。指标看趋势一眼见形状，日志查细节问到底。Alerts 盯着两类数据设的阈值，Monitor 把「收集、存、查、喊」串成一条线。\n\n**什么时候用，什么时候别用**。查历史事件、排障取证 → Log Analytics。要「出问题第一时间知道」→ 告警。要「用户说慢，到底慢在哪一段」→ Application Insights。平台事件影没影响你 → Service Health（3.4.2）。要不要整改建议 → Advisor（3.4.1）。Monitor 家族管「数据与通知」，建议管「体检」，平台健康管「Azure 自己的事」——三件分工背清楚。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的订单应用深夜出了问题：告警规则先在 CPU 持续超线时叫醒了值班工程师；工程师在 Log Analytics 里查日志锁定到一批失败请求；再进 Application Insights 看这批请求的依赖链——响应慢全卡在支付网关的调用上。三个组件一夜连用：喊人、定位、深挖，一条链各司其职。\n\n**关联服务**：Azure Monitor（主体）、Log Analytics（日志工作区）、Monitor 告警（通知引擎）、Application Insights（应用监控）、Service Health 与 Advisor（分工邻居，3.4.1、3.4.2）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「Advisor 会自动把建议整改掉」 | Advisor 只给建议，不自动改动资源 | 清单归它，改不改归你；它是「体检报告」，不是「自动治疗机」 |\n| 「想知道这次 Azure 出事影响没影响我，刷新全球状态页」 | 全球状态页不知道你是谁 | Service Health 才是个性化视图，只显示与你的订阅相关的平台事件 |\n| 「Service Health 顺便也能盯应用性能」 | 它管「平台的事」，不管你的资源与指标 | 应用表现归 Monitor 家族；Service Health 报服务问题、计划维护、健康公告 |\n| 「告警和日志查询是一回事」 | 告警是盯阈值的规则引擎，日志是事后查证 | 出事第一时间知道用告警；查历史、排障取证用 Log Analytics |\n| 「Application Insights 是看虚拟机 CPU 的」 | 它看应用侧的内部表现 | 请求量、响应时间、失败率、依赖调用；「用户说慢、慢在哪一段」归它 |\n| 「资源健康就是 Service Health 的别称」 | 粒度不同：一个看单个资源，一个看你的订阅 | 资源健康看单台资源好不好用；Service Health 报与你相关的平台事件 |\n\n#### 记忆要点\n\n1. **三层健康**：全球状态页、Service Health（你的订阅）、资源健康（单个资源）。\n2. **建议五类**：成本、性能、可靠性、安全、卓越运营；只建议、不执行。\n3. **平台三报**：服务问题、计划维护、健康公告；只显示与你订阅相关的，还能配告警先知道。\n4. **监控三件**：Log Analytics 查日志，告警盯阈值喊人，Application Insights 看应用内部。\n5. **数据两类**：指标看趋势见形状，日志查细节问到底。\n6. **分工口诀**：建议管体检，平台健康管 Azure 自己的事，Monitor 管你的资源与应用。\n\n---"}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 3.1.1 | 成本因素清单与「出站计费、入站免费」 | ⭐⭐⭐ | 单选/多选 |\n| 3.1.2 | 定价计算器与 TCO 计算器的分工 | ⭐⭐ | 情景单选 |\n| 3.1.3 | 预算「只通知不停机」与成本告警三类 | ⭐⭐⭐ | 单选/判断 |\n| 3.1.4 | 标签用途与「资源不继承标签」边界 | ⭐⭐⭐ | 判断/单选 |\n| 3.2.1 | Purview 管数据资产与 Policy 管资源的分界 | ⭐⭐ | 单选 |\n| 3.2.2 | Policy 效果选择与「先 audit 后 deny」 | ⭐⭐⭐ | 情景单选 |\n| 3.2.3 | 锁的两级、锁继承、对 Owner 也生效 | ⭐⭐⭐ | 单选/判断 |\n| 3.3.1 | 门户的适用场景与局限 | ⭐⭐ | 单选 |\n| 3.3.2 | CLI、PowerShell、Cloud Shell 三者关系 | ⭐⭐⭐ | 单选/判断 |\n| 3.3.3 | Arc 纳管混合环境、不搬迁 | ⭐⭐ | 情景单选 |\n| 3.3.4 | IaC 的可重复、可版本化、可审计 | ⭐⭐ | 单选 |\n| 3.3.5 | ARM 控制面与模板声明式部署 | ⭐⭐ | 单选/判断 |\n| 3.4.1 | Advisor 五类建议与「只建议不执行」 | ⭐⭐ | 单选/判断 |\n| 3.4.2 | 三层健康视图的分工 | ⭐⭐⭐ | 情景单选 |\n| 3.4.3 | Monitor 四组件与需求匹配 | ⭐⭐⭐ | 情景单选/多选 |","services":"| 服务 | 主要用途 | 涉及知识点 |\n|---|---|---|\n| 定价计算器 / TCO 计算器 | 事前估算与迁移论证 | 3.1.2 |\n| Cost Management（成本分析/预算/告警） | 事中盯防与归集 | 3.1.1、3.1.3 |\n| 资源管理器标签 | 分类与成本分摊维度 | 3.1.4 |\n| Microsoft Purview | 数据资产治理与目录 | 3.2.1 |\n| Azure Policy | 资源合规规则与效果 | 3.2.2 |\n| 资源锁 | 误删误改防护（对全体角色生效） | 3.2.3 |\n| Azure 门户 / Cloud Shell / CLI / PowerShell | 图形与命令行操作通道 | 3.3.1、3.3.2 |\n| Azure Arc | 混合环境统一纳管 | 3.3.3 |\n| ARM 与 ARM 模板 | 控制面与声明式部署 | 3.3.4、3.3.5 |\n| Azure Advisor | 五类主动建议 | 3.4.1 |\n| Azure Service Health / 状态页 / 资源健康 | 三层健康视图 | 3.4.2 |\n| Azure Monitor 家族 | 指标、日志、告警、应用监控 | 3.4.3 |","furtherReading":"| 页面 | 什么时候去看 | URL |\n|---|---|---|\n| AZ-900 Study Guide | 3 域 / 11 组 / 57 技能点原文与权重区间 | https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-900 |\n| Create and manage budgets | 预算阈值只触发通知、不停资源 | https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets |\n| Cost alerts | 三类成本告警与异常告警 | https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/cost-mgt-alerts-monitor-usage-spending |\n| Tag resources | 标记不继承、可打层级 | https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources |\n| Azure Policy effects | deny / audit / modify 等效果清单 | https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effects |\n| Lock your Azure resources | CanNotDelete / ReadOnly、锁继承 | https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources |\n| Azure Advisor overview | 五类建议与「只建议不执行」 | https://learn.microsoft.com/en-us/azure/advisor/advisor-overview |\n| Exam duration and experience | 官方不公布具体题型 | https://learn.microsoft.com/en-us/credentials/support/exam-duration-exam-experience |\n\n这些页面都是微软官方公开文档。中文资料与英文原文说法不一致时，以英文原文为准。\n\n> 编写说明：本文件为睿鸿内部学习资料，非 Microsoft 官方教材。技能点原文取自官方 Study Guide 与 Microsoft Learn 官方文档（2026-11-16 实查），中文表述由我方整理并经人工审校；与官方英文原文不一致时以官方为准。"}}]};

<script>
(function(){
'use strict';
const DATA = (typeof LEARNING_DATA !== 'undefined' && LEARNING_DATA) ? LEARNING_DATA : null;

// R5: meta.footerNote overrides default footer (AWS default kept when absent)
if (DATA && DATA.meta && DATA.meta.footerNote) {
  var fn = document.getElementById('footNote');
  if (fn) { fn.textContent = DATA.meta.footerNote; }
}

/* ============ 常量与工具 ============ */
const EXAM = DATA ? (DATA.meta.exam || 'CERT').toLowerCase() : 'cert';   // clf-c02
const STORE_KEY = EXAM + '-v2';                                          // 进度键：clf-c02-v2
const COLORS = ['#4f46e5','#7c3aed','#9333ea','#a855f7'];                // 每章主题色（N 章 N 色，N>4 循环）
const home = document.getElementById('home');
const chapBox = document.getElementById('chapters');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function imgSrcOk(src){ return /^(?:[\w.-]+\/)*[\w.-]+\.(?:png|jpe?g|webp|gif|svg)$/i.test(src); }
function inlineMd(s){
  let t = esc(s);
  t = t.replace(/\n/g,'<br>');
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t = t.replace(/!\[([^\]]*)\]\(([^()\s]+)\)/g, function(m0, alt, src){
    if(!imgSrcOk(src)) return '<span class="img-bad" title="非法图源">🖼 非法图源：'+src+'</span>';
    return '<img class="inline-img" loading="lazy" alt="'+alt.replace(/"/g,'&quot;')+'" src="'+src+'">';
  });
  return t;
}
function isTblSep(ln){ const core = ln.replace(/^\s*\|/,'').replace(/\|\s*$/,''); if(!core.includes('-')) return false; return /^[\s:\-|]+$/.test(ln) && /-/.test(ln); }
function loadProg(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveProg(p){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){} }

/* ============ 块级 md 渲染（段落/引用/表格/列表/图占位符） ============ */
function renderBlocks(seg, figs, fctr){
  fctr = fctr || {n:0};
  const lines = seg.replace(/\r/g,'').split('\n');
  let html = ''; let i = 0; const n = lines.length;
  while(i < n){
    const ln = lines[i]; const s = ln.trim();
    if(s === ''){ i++; continue; }
    const fm = s.match(/^\[\[fig:([\w-]+)\]\]$/);
    if(fm){ const f = (figs||{})[fm[1]]; if(f){ if(fctr) fctr.n++; html += figHtml(f); } i++; continue; }
    const fp = s.match(/^【图：(.+?)｜(概念图|截图)】$/);
    if(fp){ fctr.n++; html += '<div class="fig-placeholder" data-figtype="'+fp[2]+'"><span class="fp-num">图 '+fctr.n+'</span><span class="fp-type">'+fp[2]+'</span><span class="fp-alt">'+esc(fp[1])+'</span><span class="fp-note">真图待补</span></div>'; i++; continue; }
    const ib = s.match(/^!\[([^\]]*)\]\(([^()\s]+)\)$/);
    if(ib){
      const ialt = ib[1], isrc = ib[2];
      if(imgSrcOk(isrc)){ html += '<figure class="fig-img"><img loading="lazy" alt="'+ialt.replace(/"/g,'&quot;')+'" src="'+isrc+'"><figcaption>'+esc(ialt)+'</figcaption></figure>'; }
      else { html += '<div class="fig-placeholder"><span class="fp-type">非法图源</span><span class="fp-alt">'+esc(ialt)+' ← '+esc(isrc)+'</span><span class="fp-note">检查路径与扩展名</span></div>'; }
      i++; continue;
    }
    if(s.startsWith('|') && i+1 < n && isTblSep(lines[i+1].trim())){
      let rows = [];
      while(i < n && lines[i].trim().startsWith('|')){ rows.push(lines[i].trim()); i++; }
      const heads = rows[0].replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim()));
      const data = rows.slice(2).map(r => r.replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim())));
      html += '<div class="tbl-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'
        + data.map(r => '<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if(s.startsWith('>')){
      let q = [];
      while(i < n && lines[i].trim().startsWith('>')){ q.push(lines[i].replace(/^\s*>\s?/,'').trim()); i++; }
      html += '<blockquote>'+inlineMd(q.join(' '))+'</blockquote>'; continue;
    }
    if(/^[-*]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^[-*]\s+/.test(t)){ items.push(inlineMd(t.replace(/^[-*]\s+/,''))); i++; } else break; }
      html += '<ul>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; continue;
    }
    if(/^\d+[.、]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^\d+[.、]\s+/.test(t)){ items.push(inlineMd(t.replace(/^\d+[.、]\s+/,''))); i++; } else break; }
      html += '<ol>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ol>'; continue;
    }
    const hm = s.match(/^(#{1,6})\s+(.+)$/);
    if(hm){ html += '<h4 class="sec-h">'+inlineMd(hm[2])+'</h4>'; i++; continue; }
    let para = [];
    while(i < n){
      const t = lines[i].trim();
      if(t === '' || t.startsWith('|') || t.startsWith('>') || /^[-*]\s+/.test(t) || /^\d+[.、]\s+/.test(t) || /^#{1,6}\s/.test(t) || /^\[\[fig:[\w-]+\]\]$/.test(t) || /^【图：[^｜]*｜(?:概念图|截图)】$/.test(t) || /^!\[[^\]]*\]\([^()\s]+\)$/.test(t)) break;
      para.push(t); i++;
    }
    if(para.length) html += '<p>'+inlineMd(para.join(' '))+'</p>';
  }
  return html;
}

/* ===== 节内子块解析与渲染（v6）：#### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点）
   这一节学什么（旧值「本节定位」仍兼容）=弱化引言、案例/记忆要点=卡片、常见误区与易错点=警示小节——均不占编号。
   解析与渲染共用 parseSectionBlocks，保证正文 h3 与左侧目录两级条目 1:1。 ===== */
const SUB_RAW='raw', SUB_LEAD='lead', SUB_KP='kp', SUB_CASE='case', SUB_MIS='mis', SUB_MEM='mem';
function subTypeOf(title){
  if(title === '这一节学什么' || title === '本节定位') return SUB_LEAD;
  if(title === '案例') return SUB_CASE;
  if(title === '记忆要点') return SUB_MEM;
  if(title === '常见误区与易错点') return SUB_MIS;
  return SUB_KP;
}
function parseSectionBlocks(md){
  const parts = (md||'').replace(/\r/g,'').split(/\n(?=####\s)/);
  const out = [];
  parts.forEach(part=>{
    const m = part.match(/^####\s*(.+?)\s*\n([\s\S]*)$/);
    if(!m){ const t = part.trim(); if(t) out.push({ type:SUB_RAW, title:'', body:t }); return; }
    out.push({ type:subTypeOf(m[1].trim()), title:m[1].trim(), body:(m[2]||'').trim() });
  });
  return out;
}
function countKp(body){ let m=0; parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP) m++; }); return m; }
function kpListOf(body){
  const kps=[]; let m=0;
  parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP){ m++; kps.push({ m:m, title:b.title }); } });
  return kps;
}
function renderSectionBody(md, figs, d, n, fctr){
  fctr = fctr || {n:0};
  const blocks = parseSectionBlocks(md);
  let h = ''; let kp = 0;
  for(const b of blocks){
    if(b.type === SUB_RAW){ h += renderBlocks(b.body, figs, fctr); continue; }
    if(b.type === SUB_KP){
      kp++;
      h += '<h3 class="mh3" id="sec-'+d+'-'+n+'-'+kp+'"><span class="h3no">'+d+'.'+n+'.'+kp+'</span><span>'+inlineMd(b.title)+'</span></h3>'
         + renderBlocks(b.body, figs, fctr);
      continue;
    }
    if(b.type === SUB_CASE){ h += '<div class="case-card"><h4 class="sec-h">案例</h4>'+renderBlocks(b.body, figs, fctr)+'</div>'; continue; }
    if(b.type === SUB_MEM){ h += '<div class="mem-card"><h4 class="sec-h">记忆要点</h4>'+renderBlocks(b.body, figs, fctr)+'</div>'; continue; }
    h += '<h4 class="sec-h'+(b.type===SUB_LEAD?' sec-lead-h':'')+'">'+inlineMd(b.title)+'</h4>'+renderBlocks(b.body, figs, fctr);
  }
  return h;
}
function figsById(fs){ const m={}; (fs||[]).forEach(f=>{ m[f.id]=f; }); return m; }
function figHtml(f){
  return '<div class="fig-block"><div class="fig-title">'+esc(f.title)+'</div>'
    + '<div class="fig-body">'+(f.html||'')+'</div>'
    + (f.caption ? '<div class="fig-caption">'+esc(f.caption)+'</div>' : '') + '</div>';
}

      tm.textContent = (ch.sections||[]).length + ' 节 · ' + kp + ' 点';

  /* 面板内事件委托：返回/抽屉/遮罩/目录跳转 */

      if(tl.classList.contains('toc-sec-link')){

        if(li && !wasOpen) li.classList.add('open');

      if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
      if(window.matchMedia('(max-width:1199px)').matches) closeSide();
    }
  });

  chapters.forEach((ch,di)=>{
    const d = di+1;
    renderQuiz(d, ch.practice || []);
  });
}

function openSide(d){
  const side = document.getElementById('side-d'+d); if(!side) return;
  side.classList.add('open');
  const btn = document.querySelector('#panel-d'+d+' .toc-open-btn');
  if(btn) btn.setAttribute('aria-expanded','true');
  const mask = document.querySelector('#panel-d'+d+' .side-mask');
  if(mask) mask.classList.add('show');
}
function closeSide(){
  document.querySelectorAll('.ch-side.open').forEach(s=>s.classList.remove('open'));
  document.querySelectorAll('.side-mask.show').forEach(m=>m.classList.remove('show'));
  document.querySelectorAll('.toc-open-btn[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));
}

/* ============ 章内滚动（v6）：几何法 scrollspy + 阅读进度 ============
   同一 rAF 节流的 scroll 监听做两件事：① 顶部细进度条（#rdFill-d / #readPct-d）
   ② 高亮"最新越过吸顶线(READ_LINE)的锚点"（.sec-block 节 / .mh3 知识点），并自动单开其节组。 */
let spyD = 0, spyEls = [], spyTick = null, spyOn = false;
const READ_LINE = 86;      // 吸顶条下方阅读线
const ACT_WIN = 160;       // 节/知识点标题进入线下方窗口即视为"当前"（点击跳转后立即生效）
function setAct(id){
  if(!id) return;
  /* 锚点两类：正文节/知识点 sec-域-序号[-序号]，章末练习 quiz-d域 */
  const mk = id.match(/^(?:sec-|quiz-d)(\d+)/); if(!mk) return;
  const d = +mk[1];
  const toc = document.getElementById('toc-d'+d); if(!toc) return;
  toc.querySelectorAll('.toc-link.act').forEach(a=>a.classList.remove('act'));
  const link = toc.querySelector('a[href="#'+id+'"]');
  if(link){
    link.classList.add('act');
    const li = link.closest('.toc-sec');
    if(li && !li.classList.contains('open')){
      toc.querySelectorAll('.toc-sec.open').forEach(x=>x.classList.remove('open'));
      li.classList.add('open');
    } else if(!li){
      /* 独立条目（练习入口等）：高亮时收起所有展开节组，聚焦本条 */
      toc.querySelectorAll('.toc-sec.open').forEach(x=>x.classList.remove('open'));
    }
  }
}
function computeSpy(){
  const host = document.getElementById('panel-d'+spyD); if(!host) return;
  /* ① 阅读进度：以当前面板总高扣视口高的滚动行程计百分比（+页脚尾距近似） */
  const total = host.offsetHeight - window.innerHeight + 110;
  const p = total > 0 ? Math.max(0, Math.min(100, Math.round(window.scrollY / total * 100))) : 0;
  const fill = document.getElementById('rdFill-'+spyD); if(fill) fill.style.width = p + '%';
  const pct = document.getElementById('readPct-'+spyD); if(pct) pct.textContent = p + '%';
  /* ② 当前锚（三层）：
     视口内(含阅读线下方窗口)：选最靠上者 → 点击跳转/节首即生效；
     视口内无锚(读至章末练习/底部)：取最近滚出视口的锚，保持高亮最后小节；
     首屏未滚：回退最先可见锚 */
  const hi = READ_LINE + ACT_WIN;
  let best = null;
  for(const el of spyEls){
    const r = el.getBoundingClientRect();
    if(r.top <= hi && r.bottom >= 0){ if(!best || r.top > best.r.top) best = { el:el, r:r }; }
  }
  if(!best){
    for(const el of spyEls){
      const r = el.getBoundingClientRect();
      if(r.bottom < 0){ if(!best || r.bottom > best.r.bottom) best = { el:el, r:r }; }
    }
  }
  if(!best){
    for(const el of spyEls){
      const r = el.getBoundingClientRect();
      if(r.top >= 0 && r.top < window.innerHeight * 0.7){ if(!best || r.top < best.r.top) best = { el:el, r:r }; }
    }
    if(!best && spyEls.length) best = { el:spyEls[0], r:null };
  }
  if(best && best.el.id) setAct(best.el.id);
}
function onSpyScroll(){
  if(spyTick) return;
  spyTick = requestAnimationFrame(()=>{ spyTick = null; computeSpy(); });
}
function initSpy(d){
  detachSpy(false);
  spyD = d;
  const host = document.getElementById('panel-d'+d); if(!host) return;
  spyEls = Array.from(host.querySelectorAll('.sec-block, .mh3, .quiz-box'));
  if(!spyOn){ spyOn = true; window.addEventListener('scroll', onSpyScroll, { passive:true }); }
  document.body.classList.add('chapView');
  computeSpy();
}
function detachSpy(resetAct){
  if(spyOn){ window.removeEventListener('scroll', onSpyScroll); spyOn = false; }
  if(spyTick){ cancelAnimationFrame(spyTick); spyTick = null; }
  document.body.classList.remove('chapView');
  spyEls = []; spyD = 0;
  if(resetAct !== false){
    document.querySelectorAll('.toc-link.act').forEach(a=>a.classList.remove('act'));
    document.querySelectorAll('.toc-sec.open').forEach(li=>li.classList.remove('open'));
  }
}

/* ============ 章末练习 ============ */
/* 答案/题型归一化（修复：双科数据格式不一致导致章末练习失效）
   数据真源存在两种历史格式：
     CLF  a = ["C"] / ["B","E"]   t = 'single' / 'multiple'
     AIF  a = "B"   / "AE"        t = '单选' / '多选'
   原实现把 q.a 经 JSON.stringify+esc 写进 data-ans 属性，esc 不转义双引号 →
   属性被 HTML 截断（CLF 抛 JSON 解析错→提交无反应；AIF 读出空→恒判错）。
   现改为：答案只从数据真源按 qid 反查，渲染层统一归一化，不再进 HTML 属性。 */
function normAns(v){
  if(v === null || v === undefined) return [];
  if(Array.isArray(v)) return v.map(x=>String(x).trim().toUpperCase()).filter(x=>/^[A-Z]$/.test(x));
  const raw = String(v).trim();
  /* 严格形态：整串只允许字母与分隔符。防从说明文字里误提字母
     （历史案例：某题答案字段为「⚠️待核（…见源PDF）」→ 误提出 P/D/F） */
  if(!/^[A-Za-z][A-Za-z,，、;；\s]*$/.test(raw)) return [];
  return raw.toUpperCase().replace(/[^A-Z]/g, '').split('').filter(Boolean);
}
/* 可作答判定：答案可解析 + 至少一个选项。不可作答题不渲染交互（防误判） */
function isAnswerable(q){ return !!(q && normAns(q.a).length && (q.o || []).length); }
/* 可答题数（进度分母用，不可作答题不计入） */
function answerableCount(d){
  const ch = (DATA && DATA.chapters) ? DATA.chapters[d-1] : null;
  return ((ch && ch.practice) || []).filter(isAnswerable).length;
}
function isMultiQ(q){
  if(!q) return false;
  if(q.t === 'multiple' || q.t === 'multi' || q.t === '多选') return true;
  return normAns(q.a).length > 1;   // 兜底：答案多字母必为多选
}
function findQ(d, qid){
  const ch = (DATA && DATA.chapters) ? DATA.chapters[d-1] : null;
  const qs = (ch && ch.practice) || [];
  for(let i=0;i<qs.length;i++){ if(String(qs[i].id) === String(qid)) return qs[i]; }
  return null;
}
function renderQuiz(d, qs){
  const host = document.getElementById('quiz-d'+d);
  if(!qs.length){ host.innerHTML = '<div class="quiz-hdr">✅ 本章练习</div><p style="font-size:14px;color:#94a3b8">本章暂无配套练习，可到刷题工具练习。</p>'; return; }
  const nAns = qs.filter(isAnswerable).length;
  const naTip = (nAns < qs.length) ? '（另有 '+(qs.length-nAns)+' 题特殊题型待补充）' : '';
  let h = '<div class="quiz-hdr"><span>✅ 本章练习（'+nAns+' 题）'+naTip+'</span><span class="quiz-score" id="qscore-'+d+'">正确 0/'+nAns+'</span></div>';
  qs.forEach((q,qi)=>{
    const multi = isMultiQ(q);
    /* 不可作答防御：答案或选项缺失时不渲染答题交互，
       避免学员点击后被误判（历史案例：配对题占位形态） */
    if(!isAnswerable(q)){
      h += '<div class="qi qi-na" data-d="'+d+'" data-qid="'+esc(q.id||(d+'-'+qi))+'" data-qi="'+qi+'" data-na="1">'
        + '<div class="qmeta"><span class="qbadge">第 '+(qi+1)+' 题</span><span class="qtype">特殊题型</span></div>'
        + '<div class="qstem">'+inlineMd(q.q||'')+'</div>'
        + '<div class="qrow"><div class="qres show na">⚠️ 本题为配对/特殊题型，暂不支持在线作答（内容待补充）</div></div></div>';
      return;
    }
    h += '<div class="qi" data-d="'+d+'" data-qid="'+esc(q.id||(d+'-'+qi))+'" data-qi="'+qi
      + '" data-multi="'+(multi?'1':'0')+'">'
      + '<div class="qmeta"><span class="qbadge">第 '+(qi+1)+' 题</span><span class="qtype '+(multi?'qtype-m':'qtype-s')+'">'+(multi?'多选':'单选')+'</span></div>'
      + '<div class="qstem">'+inlineMd(q.q||'')+'</div><div class="opts">';
    (q.o||[]).forEach(op=>{
      h += '<div class="opt" data-l="'+esc(op.l)+'"><span class="ol">'+esc(op.l)+'.</span><span>'+inlineMd(op.t||'')+'</span></div>';
    });
    h += '</div><div class="qexp" style="display:none">'+esc(q.e||'')+'</div>'
      + '<div class="qrow"><button class="qbtn">确认答案</button><div class="qres"></div></div></div>';
  });
  h += '<div class="score-box" id="scorebox-'+d+'"><div class="score-num" id="scorenum-'+d+'"></div><div class="score-lbl"></div>'
    + '<div class="sb-tip">完整题库与限时模拟考核见首页「题库刷题」入口；未作答的题目在返回目录再进入后仍可继续作答。</div></div>';
  host.innerHTML = h;
  /* 恢复已作答状态 */
  const prog = loadProg();
  const rec = (prog['quiz_d'+d] && prog['quiz_d'+d].answered) || {};
  host.querySelectorAll('.qi').forEach(qi=>{
    const qid = qi.dataset.qid;
    if(rec[qid] !== undefined){
      applyResult(qi, rec[qid].right === 1, rec[qid].sel || [], normAns((findQ(d, qid) || {}).a), true);
    }
  });
  host.querySelectorAll('.qi').forEach(qi=>{
    const qid = qi.dataset.qid; const prog2 = loadProg();
    const rec2 = (prog2['quiz_d'+d] && prog2['quiz_d'+d].answered) || {};
    if(rec2[qid] !== undefined) return;   // 已答锁题
    const optsBox = qi.querySelector('.opts'), btn = qi.querySelector('.qbtn');
    if(!optsBox || !btn) return;          // 不可作答题（特殊题型占位卡）无交互
    const multi = qi.dataset.multi === '1';
    const opts = qi.querySelectorAll('.opt');
    optsBox.addEventListener('click', e=>{
      const o = e.target.closest('.opt'); if(!o) return;
      if(multi){ o.classList.toggle('sel'); }
      else{ opts.forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); }
    });
    btn.addEventListener('click', ()=>{ judge(qi); });
  });
  updateScore(d);
  checkScoreBox(d);
}

function judge(qi){
  const d = qi.dataset.d;
  const ans = normAns((findQ(d, qi.dataset.qid) || {}).a);
  const sel = Array.from(qi.querySelectorAll('.opt.sel')).map(o=>o.dataset.l);
  /* 防复发：答案数据异常时大声报错，不得静默判错 */
  if(!ans.length){
    const r = qi.querySelector('.qres');
    r.className = 'qres show err';
    r.textContent = '⚠️ 本题答案数据异常，无法判定，请反馈管理员';
    return;
  }
  const right = sel.length === ans.length && ans.every(a=>sel.includes(a));
  applyResult(qi, right, sel, ans, false);
  /* 持久化 */
  const prog = loadProg();
  const key = 'quiz_d'+d;
  if(!prog[key]) prog[key] = { answered:{} };
  prog[key].answered[qi.dataset.qid] = { right: right?1:0, sel: sel };
  saveProg(prog);
  updateScore(d);
  refreshProgress();
  checkScoreBox(d);
}

function applyResult(qi, right, sel, ans, restored){
  qi.classList.add('done');
  const opts = Array.from(qi.querySelectorAll('.opt'));
  opts.forEach(o=>{
    const l = o.dataset.l;
    if(ans.includes(l)) o.classList.add(sel.includes(l) ? 'cor' : 'shc');
    else if(sel.includes(l)) o.classList.add('wrg');
  });
  const qres = qi.querySelector('.qres');
  qres.className = 'qres show ' + (right ? 'ok' : 'err');
  const exp = qi.querySelector('.qexp');
  qres.innerHTML = (right ? '✅ 回答正确' : '❌ 回答错误') + '　<span style="font-weight:400">' + inlineMd(exp ? exp.textContent : '') + '</span>';
  qi.querySelector('.qbtn').disabled = true;
  qi.querySelector('.qbtn').textContent = restored ? '已作答' : '已确认';
}

function updateScore(d){
  const prog = loadProg();
  const key = 'quiz_d'+d;
  const rec = (prog[key] && prog[key].answered) || {};
  let right = 0;
  Object.values(rec).forEach(v=>{ if(v.right === 1) right++; });
  const total = answerableCount(d);   // 分母=可答题数（特殊题型占位卡不计入）
  const sc = document.getElementById('qscore-'+d);
  if(sc) sc.textContent = '正确 ' + right + '/' + total;
}

function checkScoreBox(d){
  const prog = loadProg();
  const key = 'quiz_d'+d;
  const rec = (prog[key] && prog[key].answered) || {};
  const total = answerableCount(d);
  if(Object.keys(rec).length >= total && total > 0){
    let right = 0; Object.values(rec).forEach(v=>{ if(v.right === 1) right++; });
    const box = document.getElementById('scorebox-'+d);
    document.getElementById('scorenum-'+d).textContent = right + ' / ' + total;
    box.querySelector('.score-lbl').textContent = right === total ? '🎉 全对，本章掌握扎实！' : (right >= total*0.7 ? '👍 达到及格线（70%），可进入下一章' : '📖 建议回到正文复习错题对应的知识点');
    box.classList.add('show');
  }
}

/* ============ 视图切换与进度 ============ */
function go(d){
  const chapters = DATA.chapters;
  closeSide();
  home.style.display = 'none';
  chapBox.style.display = '';
  chapBox.querySelectorAll('.panel').forEach(p=>{ p.style.display = (p.id === 'panel-d'+d) ? '' : 'none'; });
  const prog = loadProg();
  prog['read_d'+d] = 1;                 // 已读标记
  saveProg(prog);
  window.scrollTo(0,0);
  document.title = baseTitle() + ' · 第 ' + d + ' 章';
  initSpy(d);                            // 常驻目录/进度条/scrollspy 跟随当前章
}

function backHome(){
  detachSpy();
  closeSide();
  chapBox.style.display = 'none';
  home.style.display = '';
  window.scrollTo(0,0);
  document.title = baseTitle();
  refreshProgress();
}

/* 刷新首页进度看板：统计已完成数 + 章卡状态/进度条 */
function refreshProgress(){
  const prog = loadProg();
  const chapters = DATA.chapters;
  let doneCnt = 0;
  chapters.forEach((ch,di)=>{
    const d = di+1;
    const total = (ch.practice||[]).length;
    const rec = (prog['quiz_d'+d] && prog['quiz_d'+d].answered) || {};
    const nDone = Object.keys(rec).length;
    const right = Object.values(rec).filter(v=>v.right===1).length;
    const read = prog['read_d'+d] === 1;
    const pm = document.getElementById('pm-'+d);
    const pmn = document.getElementById('pmn-'+d);
    const pf = document.getElementById('pf-'+d);
    const card = pm ? pm.closest('.ch-card') : null;
    if(!pm) return;
    let state = '未开始', pct = 0;
    if(nDone >= total && total > 0){ state = '已完成'; doneCnt++; card.classList.add('done'); }
    else if(read || nDone > 0){ state = nDone > 0 ? '学习中 ' + nDone + '/' + total : '学习中'; }
    pm.textContent = state;
    if(card) card.classList.toggle('done', nDone >= total && total > 0);
    pct = total ? Math.round(nDone/total*100) : 0;
    if(pf) pf.style.width = pct + '%';
    if(pmn) pmn.textContent = total ? ('答对 ' + right + '/' + total) : '';
  });
  const od = document.getElementById('ovDone');
  if(od) od.textContent = doneCnt;
}

/* ============ 启动 ============ */
if(!DATA){
  document.body.innerHTML = '<div style="padding:60px 24px;text-align:center;font-size:14px;color:#64748b">学习数据未注入：此模板需经构建脚本注入数据后方可使用。</div>';
} else {
  buildHome();
  buildPanels();
  refreshProgress();
}

/* ============ 合体视图切换：学习区 ↔ 题库刷题区 ============
   quiz-embed 内的「← 返回学习目录」按钮与底部导航「📚 学习」都调用 window.kbShowLearnHome */
function kbShowQuiz(){
  detachSpy();
  closeSide();
  home.style.display = 'none';
  chapBox.style.display = 'none';
  const f = document.querySelector('.footer'); if(f) f.style.display = 'none';
  // 修复：.wrap 外壳仅藏子元素会残留 padding（24+60px），把题库顶栏顶离顶部 84px
  // → 外壳自身一并隐藏，保证进入题库视图即贴顶
  const w = document.querySelector('.wrap'); if(w) w.style.display = 'none';
  const qv = document.getElementById('quizView');
  if(qv){
    qv.style.display = 'block';
    const tt = document.getElementById('qzTopTitle');
    if(tt) tt.textContent = (DATA.meta.cnName ? DATA.meta.exam + ' · ' + DATA.meta.cnName : DATA.meta.exam) + ' 题库刷题';
  }
  window.scrollTo(0,0);
  document.title = baseTitle() + ' · 题库刷题';
}
function kbShowLearnHome(){
  detachSpy();
  closeSide();
  const qv = document.getElementById('quizView');
  if(qv) qv.style.display = 'none';
  const f = document.querySelector('.footer'); if(f) f.style.display = '';
  home.style.display = '';
  const w = document.querySelector('.wrap'); if(w) w.style.display = '';
  window.scrollTo(0,0);
  document.title = baseTitle();
  refreshProgress();
}
window.kbShowQuiz = kbShowQuiz;
window.kbShowLearnHome = kbShowLearnHome;
})();
</script>
<script>
/* 图灯箱（移动适配 P1=A）：正文图当前渲染等效字号 <9.5px 时点击可放大到原始 viewBox 尺寸
   等效字号 = 图内最小 text 字号 × (当前渲染宽 ÷ viewBox 宽)；桌面可读图不触发，不打断阅读 */
(function(){
  'use strict';
  var box = null, stage = null;
  function minFontPx(svg){
    var t = svg.querySelectorAll('text'), mn = Infinity;
    for (var i = 0; i < t.length; i++){
      var v = parseFloat(t[i].getAttribute('font-size'));
      if (isNaN(v)){ var cs = getComputedStyle(t[i]); v = parseFloat(cs.fontSize); }
      if (!isNaN(v) && v < mn) mn = v;
    }
    return isFinite(mn) ? mn : 12;
  }
  function effFont(svg){
    var vb = svg.viewBox && svg.viewBox.baseVal;
    if (!vb || !vb.width) return 99;                 // 无 viewBox：不介入
    var w = svg.getBoundingClientRect().width || vb.width;
    return minFontPx(svg) * (w / vb.width);
  }
  function close(){
    if (box) box.classList.remove('show');
    document.documentElement.style.overflow = '';
  }
  function open(svg){
    if (!box){
      box = document.createElement('div');
      box.className = 'fig-lightbox';
      box.innerHTML = '<button class="lb-close" aria-label="关闭放大图">✕</button><div class="lb-stage"></div>';
      document.body.appendChild(box);
      stage = box.querySelector('.lb-stage');
      box.querySelector('.lb-close').addEventListener('click', close);
      box.addEventListener('click', function(e){ if (e.target === box) close(); });
    }
    var vb = svg.viewBox.baseVal;
    var clone = svg.cloneNode(true);
    clone.style.width = vb.width + 'px';             // 原始 viewBox 尺寸 1:1
    clone.style.maxWidth = 'none';
    clone.style.height = 'auto';
    stage.innerHTML = '';
    stage.appendChild(clone);
    box.classList.add('show');
    document.documentElement.style.overflow = 'hidden';
    stage.scrollTop = 0; stage.scrollLeft = 0;
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
  document.addEventListener('click', function(e){
    var svg = e.target.closest ? e.target.closest('.fig-body svg') : null;
    if (!svg) return;
    if (effFont(svg) >= 9.5) return;                 // 当前渲染下可读 → 不打断
    e.preventDefault();
    open(svg);
  });
})();
</script>
