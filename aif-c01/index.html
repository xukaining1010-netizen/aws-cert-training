<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>学习材料</title>
<style>
/* ===== 页面结构：首页目录 + 章级分页 SPA（非单一长页） ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;font-size:17px;line-height:1.7}
.wrap{max-width:1200px;margin:0 auto;padding:24px 28px 60px}
@media(max-width:768px){.wrap{padding:16px 14px 48px}}

/* ===== 首页 ===== */
.hdr{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:12px;padding:30px 32px 26px;margin-bottom:18px}
.hdr-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:3px 12px;border-radius:20px;margin-bottom:10px}
.hdr h1{font-size:24px;font-weight:800;line-height:1.4}
.hdr-sub{font-size:13px;opacity:.9;margin-top:8px}
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.ov-item{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.ov-num{font-size:28px;font-weight:800;color:#4f46e5;line-height:1.2}
.ov-lbl{font-size:12px;color:#64748b;margin-top:4px}
@media(max-width:768px){.ov{grid-template-columns:repeat(2,1fr)}}

.card-s{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.cs-title{font-size:18px;font-weight:700;color:#374151;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}

/* 章节目录卡 */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ch-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 16px;cursor:pointer;transition:.2s;margin-bottom:0}
.ch-card:hover{border-color:#7c3aed;transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,70,229,.12)}
.ch-card.done{border-color:#16a34a}
.cc-num{font-size:11px;font-weight:700;margin-bottom:3px}
.cc-title{font-size:15px;font-weight:700;color:#1e293b;margin-bottom:6px}
.cc-meta{font-size:13px;color:#64748b}
.cc-prog{margin-top:8px}
.pm{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:3px}
.pbar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .4s}

/* 考试速览 */
.exam-quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.eq-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 10px;text-align:center}
.eq-num{font-size:20px;font-weight:800;color:#4f46e5;line-height:1.2}
.eq-sub{font-size:10.5px;color:#64748b;margin-top:2px}
.eq-lbl{font-size:11px;color:#64748b;margin-top:5px}
.exam-two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:10px}
@media(max-width:768px){.exam-two-col{grid-template-columns:1fr}}
.exam-sub-t{font-size:14px;font-weight:700;color:#374151;margin:4px 0 10px}
.exam-domain-tbl{width:100%;border-collapse:collapse;font-size:15px}
.exam-domain-tbl th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;padding:9px 12px;text-align:left;font-weight:700}
.exam-domain-tbl td{padding:9px 12px;border-bottom:1px solid #e9d5ff;vertical-align:middle}
.exam-domain-tbl tr:nth-child(even) td{background:#faf5ff}
.domain-chip{display:inline-block;border-radius:20px;padding:2px 11px;font-size:12px;font-weight:700;background:#ede9fe;color:#5b21b6;cursor:pointer;border:none;transition:.15s}
.domain-chip:hover{background:#ddd6fe}
.exam-info-list{font-size:15px;color:#374151;margin:0 0 12px 18px}
.exam-info-list li{margin-bottom:6px;line-height:1.7}
.exam-steps{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px;font-size:14px}
.step-block{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;padding:9px 12px;font-size:13px;color:#4338ca;flex:1 1 150px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.step-block b{display:block;font-size:13px}
.step-block span{display:block;font-size:11.5px;color:#6d28d9;margin-top:3px}
.step-arrow{color:#a78bfa;font-weight:700;font-size:16px;padding:0 4px;flex:0 0 auto;align-self:center}
details.exam-faq{margin-top:12px;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;background:#f8fafc}
details.exam-faq summary{font-size:14px;font-weight:700;color:#374151;cursor:pointer}
details.exam-faq p{margin:9px 0 0;font-size:14px;color:#475569;line-height:1.75}

/* 14 天计划 */
.ptbl{width:100%;border-collapse:collapse;font-size:15px}
.ptbl th{background:#f8fafc;padding:11px 12px;text-align:left;font-weight:600;color:#374151;border-bottom:2px solid #e2e8f0;font-size:14px}
.ptbl td{padding:10px 12px;border-bottom:1px solid #f8fafc;vertical-align:middle}
.ptbl tr:last-child td{border-bottom:none}
.day{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.chip-p{background:#ede9fe;color:#5b21b6}.chip-p:hover{background:#ddd6fe}
.focus{font-size:12px;color:#64748b}

/* ===== 章面板 ===== */
.ch-topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);padding:8px 18px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px}
.back-btn{background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:13px;font-weight:600;border-radius:8px;padding:5px 14px;cursor:pointer;white-space:nowrap;transition:.15s}
.back-btn:hover{background:#ede9fe}
.tn-title{font-size:15px;font-weight:700;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-hdr{color:#fff;padding:20px 22px 16px;border-radius:12px 12px 0 0;margin-bottom:0}
.ch-badge{font-size:13px;font-weight:700;opacity:.9;margin-bottom:5px;display:block}
.ch-title{font-size:22px;font-weight:800}
.panel{margin-bottom:14px}
.task-list{padding-left:22px;font-size:16px;color:#374151;line-height:2.0}
.task-list li::marker{color:#a78bfa}
.task-list a{color:#374151;text-decoration:none}
.task-list a:hover{color:#4f46e5}
.tl-id{display:inline-block;min-width:38px;font-weight:700;color:#4f46e5;margin-right:6px}
.panel-hr{border:none;border-top:1px solid #e2e8f0;margin:14px 0}

/* ===== 正文排版（规范 B） ===== */
.mdbody .sec-block h2.mh2{font-size:19px;font-weight:700;color:#4f46e5;margin:4px 0 12px;padding:10px 0 8px;border-top:1px solid #e2e8f0}
.mdbody p{font-size:17px;color:#374151;margin-bottom:14px;line-height:1.9}
.mdbody ul,.mdbody ol{font-size:17px;color:#374151;padding-left:24px;margin-bottom:12px}
.mdbody li{margin-bottom:8px;line-height:1.9}
.mdbody blockquote{border-left:3px solid #a78bfa;padding:10px 16px;background:#f5f3ff;font-size:15px;color:#5b21b6;margin:0 0 14px;border-radius:0 6px 6px 0;line-height:1.8}
.mdbody code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.mdbody h4.sec-h{font-size:17px;font-weight:600;color:#374151;margin:24px 0 10px;padding-left:12px;border-left:3px solid #a78bfa;line-height:1.4}
.mdbody .case-card,.mdbody .mem-card{border-radius:10px;padding:13px 16px;margin-bottom:14px}
.mdbody .case-card{background:#fff8e6;border:1px solid #ecd9a0}
.mdbody .mem-card{background:#eef3ff;border:1px solid #b9c9f7}
.mdbody .case-card h4.sec-h,.mdbody .mem-card h4.sec-h{border-left:none;padding-left:0;margin:0 0 8px;font-size:14px;font-weight:700}
.mdbody .case-card h4.sec-h{color:#9a7b1e}
.mdbody .mem-card h4.sec-h{color:#4361ee}
.mdbody .case-card p,.mdbody .mem-card p{font-size:15px}
.mdbody .case-card ul,.mdbody .mem-card ul{margin-bottom:0;font-size:15px}
/* 表格（规范 C） */
.tbl-wrap{overflow-x:auto;margin:0 0 14px;border:1px solid #e9d5ff;border-radius:10px}
.tbl-wrap table{min-width:480px}
table{border-collapse:collapse;width:100%;font-size:16px}
.mdbody th,.mdbody td{padding:11px 16px;text-align:left;border-bottom:1px solid #e9d5ff;vertical-align:top;line-height:1.6}
.mdbody thead th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;font-weight:700;font-size:15px;white-space:nowrap}
.mdbody tbody tr:nth-child(even) td{background:#faf5ff}
.mdbody tbody tr:last-child td{border-bottom:none}
/* 图块（v2.1 图文同流） */
.fig-block{background:#f8f7ff;border:1px solid #ddd6fe;border-radius:12px;padding:14px 16px;margin:0 0 14px}
.fig-title{font-size:13px;font-weight:700;color:#4f46e5;text-align:center;margin-bottom:10px}
.fig-body{overflow-x:auto}
.fig-body svg{display:block;margin:0 auto;height:auto}
.fig-caption{font-size:12px;color:#6b7280;text-align:center;margin-top:10px;font-style:italic}
/* 手绘图 CSS 类（兼容） */
.compare-tbl{width:100%;border-collapse:collapse;font-size:13px}
.compare-tbl th{padding:9px 12px;font-weight:700;font-size:12px;text-align:center}
.compare-tbl td{padding:8px 12px;border:1px solid #e2e8f0;font-size:13px;vertical-align:top;line-height:1.5}
.compare-tbl tr:nth-child(even) td{background:#faf9ff}
.flow-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.flow-node{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;text-align:center;min-width:80px}
.flow-node.light{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#4338ca}
.flow-node.green{background:linear-gradient(135deg,#06d6a0,#059669);color:#fff}
.flow-arrow{color:#a78bfa;font-size:18px;font-weight:700;flex-shrink:0}
.cycle-wrap{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.cycle-step{display:flex;flex-direction:column;align-items:center;gap:4px}
.cycle-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.cycle-label{font-size:11px;color:#374151;text-align:center;max-width:70px;line-height:1.3}
.cycle-arrow{color:#a78bfa;font-size:16px;align-self:flex-start;margin-top:6px}
.stair-wrap{display:flex;align-items:flex-end;gap:8px;padding:8px 0;justify-content:center;flex-wrap:wrap}
.stair-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.stair-bar{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:6px 6px 0 0;width:80px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;padding:4px}
.stair-label{font-size:11px;color:#374151;text-align:center;max-width:80px;line-height:1.3}

/* 域尾提示卡 */
.tips-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tips-card .tc-title{font-size:15px;font-weight:700;margin-bottom:10px;color:#374151}
.tips-card table{font-size:14px}
.tips-card th{padding:9px 12px;font-size:13px}
.tips-card td{padding:9px 12px;font-size:14px;line-height:1.6}

/* ===== 章末练习 quiz-box（模块 10） ===== */
.quiz-box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:18px 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);scroll-margin-top:78px}
.quiz-hdr{display:flex;align-items:baseline;gap:14px;font-size:18px;font-weight:700;color:#374151;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}
.quiz-score{font-size:14px;font-weight:700;color:#4f46e5;margin-left:auto;white-space:nowrap}
.qi{border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.qi.done{background:#fafafa}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qbadge{background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:700}
.qtype{font-size:11px;border-radius:12px;padding:1px 9px;font-weight:600}
.qtype-s{background:#e0f2fe;color:#0369a1}
.qtype-m{background:#fce7f3;color:#be185d}
.qstem{font-size:16px;color:#1e293b;margin-bottom:10px;line-height:1.8}
.qstem code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{background:#fff;border:1.5px solid #e2e8f0;border-radius:9px;padding:11px 14px;font-size:15.5px;color:#374151;cursor:pointer;transition:.15s;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:#a78bfa}
.opt .ol{font-weight:700;color:#4f46e5;flex-shrink:0}
.opt.sel{border-color:#4f46e5;background:#ede9fe}
.opt.cor{border-color:#16a34a;background:#dcfce7}
.opt.wrg{border-color:#dc2626;background:#fee2e2}
.opt.shc{border-color:#16a34a;background:#f0fdf4}
.qi.done .opt{cursor:default;pointer-events:none}
.qrow{margin-top:10px;display:flex;align-items:center;gap:12px}
.qbtn{background:#4f46e5;color:#fff;font-size:12px;font-weight:600;border:none;border-radius:7px;padding:7px 18px;cursor:pointer;transition:.15s}
.qbtn:hover{background:#4338ca}
.qbtn:disabled{background:#cbd5e1;cursor:default}
.qres{display:none;flex:1;border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.7}
.qres.ok{background:#dcfce7;color:#15803d}
.qres.err{background:#fee2e2;color:#b91c1c}
.qres.na{background:#fef3c7;color:#b45309}
.qres.show{display:block}
.score-box{display:none;text-align:center;background:#f5f3ff;border-radius:10px;padding:22px 16px;margin-top:16px}
.score-box.show{display:block}
.score-num{font-size:32px;font-weight:700;color:#4f46e5;line-height:1.3}
.score-lbl{font-size:13px;color:#6d28d9;margin-top:4px}
.score-box .sb-tip{font-size:12px;color:#64748b;margin-top:8px;line-height:1.7}

.footer{margin-top:26px;padding:18px 10px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:12.5px;text-align:center;line-height:1.9}
.footer a{color:#4f46e5;text-decoration:none}
@media(max-width:768px){.ptbl th,.ptbl td{font-size:13px}.mdbody th,.mdbody td{font-size:13px}}

/* ===== 章面板 v6 布局：左侧常驻目录槽 + 正文列 =====
   三条布局约定：① 正文 #### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点，见下方 .mh3）
   ② 左侧目录两级（节 ▸ 知识点，单开手风琴 + 滚动自动跟读）③ 左右两侧任何分辨率留白，目录常驻不遮正文：
   ≥1200px：.panel 栅格 [236px 目录槽 | 正文列]，目录 sticky 常驻；<1200px：目录槽变左侧抽屉（☰+遮罩）。 */
body.chapView .wrap{max-width:1420px}
.panel{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start;margin-bottom:14px}
.ch-side{position:sticky;top:14px;min-width:0;z-index:30}
.side-close{display:none}
.toc-open-btn{display:none}
.side-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:85;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.side-mask.show{opacity:1;visibility:visible}
.ch-toc{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 6px 24px rgba(15,23,42,.06);overflow:hidden}
.ch-toc .toc-hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;border-bottom:1px solid #f1f5f9}
.ch-toc .th-title{font-size:13px;font-weight:800;color:#4f46e5;white-space:nowrap}
.ch-toc .th-meta{font-size:11px;color:#94a3b8;font-weight:600;white-space:nowrap}
.ch-toc .toc-body{max-height:calc(100vh - 46px);overflow-y:auto;padding:8px}
.toc-list{list-style:none;margin:0;padding:0}
.toc-list a{display:flex;align-items:baseline;gap:6px;padding:5px 6px;border-radius:7px;color:#475569;text-decoration:none;line-height:1.45;font-size:13px;transition:.12s}
.toc-list a:hover{background:#f5f3ff;color:#4f46e5}
.toc-list a.act{background:#ede9fe;color:#3730a3;font-weight:600}
.toc-list .tl-id{font-size:11.5px;font-weight:700;color:#a78bfa;flex-shrink:0;font-variant-numeric:tabular-nums}
.toc-list a.act .tl-id{color:#4f46e5}
.toc-t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toc-sec>a.toc-sec-link{font-weight:600;color:#334155;padding-top:6px;padding-bottom:6px}
.toc-sec>a .toc-ar{margin-left:auto;flex-shrink:0;font-size:9px;color:#94a3b8;transition:transform .18s}
.toc-sec.open>a .toc-ar{transform:rotate(90deg);color:#4f46e5}
.toc-sub{list-style:none;margin:0;padding:0 0 3px;display:none}
.toc-sec.open>.toc-sub{display:block}
.toc-sub a{padding:3px 6px 3px 20px;font-size:12.5px;color:#64748b;line-height:1.4}
.toc-sub a .tl-id{font-size:11px;color:#c4b5fd}
/* 目录尾【本章练习】入口（v6.2 新增）：独立条目，虚线分隔，点击滚到章末练习区 #quiz-dX */
.toc-quiz{margin-top:7px;padding-top:3px;border-top:1px dashed #ddd6fe}
.toc-quiz>a.toc-quiz-link{font-weight:700;color:#6d28d9;padding-top:6px;padding-bottom:6px}
.toc-quiz>a .tl-id{color:#a78bfa}
.toc-quiz>a.act .tl-id{color:#6d28d9}
@media(max-width:1199px){
  .panel{display:block}
  .ch-side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:90;background:#fff;border-right:1px solid #e2e8f0;box-shadow:0 0 44px rgba(15,23,42,.18);transform:translateX(-102%);transition:transform .22s ease;padding:10px;overflow-y:auto}
  .ch-side.open{transform:none}
  .ch-side .ch-toc{border:none;box-shadow:none;border-radius:0}
  .ch-toc .toc-body{max-height:none;padding-right:4px}
  .toc-open-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:12.5px;font-weight:600;border-radius:8px;padding:4px 10px;cursor:pointer;transition:.15s;white-space:nowrap}
  .toc-open-btn:hover{background:#ede9fe}
  .side-close{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:none;background:#f1f5f9;color:#64748b;border-radius:7px;font-size:12px;cursor:pointer;font-weight:700;flex-shrink:0}
  .side-close:hover{background:#e2e8f0;color:#1e293b}
}
/* 阅读进度（吸顶条底部细线 + 百分比）：v6 新增
   注意：此处不再声明 position，78 行的 .ch-topnav{position:sticky;top:0} 保持生效——
   早前版本曾误加 position:relative 覆盖导致吸顶丢失（窄屏换章节要滚回顶），v6.1 已修复 */
.ch-topnav{overflow:hidden}

x;color:var(--primary)}#quizView .glossary-item{padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;line-height:1.6}#quizView .glossary-item:last-child{border:none;padding-bottom:0}#quizView .glossary-term{font-weight:600;color:var(--text)}#quizView .glossary-def{color:var(--text2)}#quizView .explanation.show{display:block}#quizView .explanation .result-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-weight:600;font-size:14px;margin-bottom:10px}#quizView .explanation .result-badge.correct{background:rgba(6,214,160,.15);color:var(--correct)}#quizView .explanation .result-badge.wrong{background:rgba(239,71,111,.15);color:var(--wrong)}#quizView .explanation .exp-text{font-size:14px;line-height:1.7;color:var(--text2)}#quizView .explanation .exp-source{font-size:12px;color:var(--text2);margin-top:8px;font-style:italic}#quizView .qnav{background:var(--card);border-radius:12px;padding:12px;border:1px solid var(--border);margin-top:12px}#quizView .qnav h4{font-size:13px;color:var(--text2);margin-bottom:8px}#quizView .qnav-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}#quizView .qnav-item{aspect-ratio:1;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;transition:.2s;background:var(--bg)}#quizView .qnav-item:hover{border-color:var(--primary)}#quizView .qnav-item.done-correct{background:var(--correct);color:#fff;border-color:var(--correct)}#quizView .qnav-item.done-wrong{background:var(--wrong);color:#fff;border-color:var(--wrong)}#quizView .qnav-item.current{border-color:var(--primary);border-width:2px;font-weight:700}#quizView .wrong-stats{display:flex;gap:12px;margin-bottom:16px}#quizView .wrong-stats .stat-card{flex:1}#quizView .wrong-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}#quizView .wrong-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:13px;cursor:pointer}#quizView .wrong-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}#quizView .wrong-item{padding:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px}#quizView .wrong-item .wi-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}#quizView .wrong-item .wi-domain{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--border)}#quizView .wrong-item .wi-actions{display:flex;gap:8px;margin-top:8px}#quizView .wrong-item .wi-actions button{font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--text)}#quizView .wrong-item .wi-actions button:hover{background:var(--border)}#quizView .stats-chart{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}#quizView .stats-chart h3{font-size:14px;margin-bottom:12px}#quizView canvas{width:100%!important;height:200px!important;border-radius:8px}#quizView .stats-table{width:100%;border-collapse:collapse;font-size:13px}#quizView .stats-table th, #quizView .stats-table td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--border)}#quizView .stats-table th{color:var(--text2);font-weight:500}#quizView .settings-section{margin-bottom:20px}#quizView .settings-section h3{font-size:15px;margin-bottom:12px;color:var(--text2)}#quizView .setting-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;cursor:pointer;width:100%;font-size:14px;color:var(--text);margin-bottom:8px;transition:.2s}#quizView .setting-btn:hover{border-color:var(--primary)}#quizView .setting-btn.danger{color:var(--wrong)}#quizView .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:.3s}#quizVi const QUIZ_META = {"exam":"AIF-C01","title":"AWS Certified AI Practitioner 题库","lang":"zh","updated":"2026-09-06","domains":{"1":"AI 和 ML 基础知识","2":"生成式 AI 基础","3":"应用和实现","4":"负责任的 AI 实践","5":"安全、合规和治理"},"weights":{"1":"20%","2":"24%","3":"28%","4":"14%","5":"14%"},"examParams":{"count":50,"minutes":60,"pass":700},"footerNote":"题库来源：第三方中文翻译整理（415题，中文题），以 AWS 官方学习材料为准；Domain 为关键词粗分，以官方考纲为准","glossary":{"生成式 AI":"Generative AI - 生成式人工智能。能够根据训练数据生成新内容（文本/图像/音频/代码等）的 AI 技术。","基础模型":"Foundation Model (FM) - 基础模型。在海量数据上预训练的大规模模型，可针对多种下游任务微调或直接使用。","Foundation Model":"Foundation Model (FM) - 基础模型。在海量数据上预训练的大规模模型，可针对多种下游任务微调或直接使用。","FM":"Foundation Model (FM) - 基础模型。在海量数据上预训练的大规模模型，可针对多种下游任务微调或直接使用。","大语言模型":"Large Language Model (LLM) - 大语言模型。基于 Transformer 架构，在海量文本上预训练，擅长文本生成/理解/翻译等任务。","LLM":"Large Language Model (LLM) - 大语言模型。基于 Transformer 架构，在海量文本上预训练，擅长文本生成/理解/翻译等任务。","提示词":"Prompt - 提示词。用户输入给模型以引导其生成特定输出的文本指令。","提示工程":"Prompt Engineering - 提示工程。通过设计有效提示（角色/上下文/示例/约束）引导模型输出的技术。","微调":"Fine-tuning - 微调。在预训练模型基础上用特定数据集继续训练，以适配特定任务。","检索增强生成":"Retrieval Augmented Generation (RAG) - 检索增强生成。在生成前从外部知识库检索相关信息，减少幻觉、提升准确性与时效性。","RAG":"Retrieval Augmented Generation - 检索增强生成。在生成前从外部知识库检索相关信息，减少幻觉、提升准确性与时效性。","向量嵌入":"Vector Embedding - 向量嵌入。将文本/图像等转换为高维数值向量，语义相近的内容在向量空间中距离更近。","向量数据库":"Vector Database - 向量数据库。用于存储和检索向量嵌入，支撑语义搜索与 RAG。","Agent":"Agent - 智能体。能够感知环境、自主规划并使用工具（如代码解释器/浏览器）完成任务目标的 AI 系统。","机器学习":"Machine Learning (ML) - 机器学习。让计算机从数据中学习规律并进行预测/决策的技术分支。","深度学习":"Deep Learning - 深度学习。机器学习的分支，使用多层神经网络处理复杂数据（图像/语音/文本）。","监督学习":"Supervised Learning - 监督学习。使用带标签数据进行训练，学习输入到输出的映射（如分类、回归）。","无监督学习":"Unsupervised Learning - 无监督学习。使用无标签数据训练，发现数据内在结构或模式（如聚类、降维）。","强化学习":"Reinforcement Learning - 强化学习。智能体通过与环境的交互、依据奖励信号学习最优策略。","分类":"Classification - 分类。监督学习任务，将输入归入预定义类别（如垃圾邮件识别）。","回归":"Regression - 回归。监督学习任务，预测连续数值（如房价、销量预测）。","聚类":"Clustering - 聚类。无监督学习，将相似数据点自动分组（如客户分群）。","时间序列":"Time Series - 时间序列数据。按时间顺序记录的数据点，用于预测未来趋势（如股票价格、日销量）。","计算机视觉":"Computer Vision (CV) - 计算机视觉。让计算机识别和理解图像/视频的技术（如图像分类、目标检测）。","自然语言处理":"Natural Language Processing (NLP) - 自然语言处理。让计算机理解、生成、处理人类语言的 AI 分支。","NLP":"Natural Language Processing - 自然语言处理。让计算机理解、生成、处理人类语言的 AI 分支。","负责任的人工智能":"Responsible AI - 负责任的人工智能。在 AI 全生命周期中确保公平、透明、可解释、安全、隐私等原则的实践。","Responsible AI":"Responsible AI - 负责任的人工智能。在 AI 全生命周期中确保公平、透明、可解释、安全、隐私等原则的实践。","偏见":"Bias - 偏见/偏差。模型因训练数据不均衡等原因产生的不公平或错误倾向。","幻觉":"Hallucination - 幻觉。模型生成看似合理但与事实不符的输出的现象，RAG 等检索技术可缓解。","透明":"Transparency - 透明度。负责任 AI 原则之一，要求 AI 系统的决策过程可理解、可解释。","可解释性":"Explainability - 可解释性。能够解释模型为何做出特定预测的能力。","模型漂移":"Model Drift - 模型漂移。模型部署后因环境/数据分布变化导致性能下降，需持续监控。","模型治理":"Model Governance - 模型治理。对 AI 模型从开发到部署进行策略、监督、监控与审计的管理机制。","Amazon Bedrock":"Amazon Bedrock - AWS 托管的基础模型服务。通过统一 API 调用多家厂商 FM（Claude/Llama/Stable Diffusion 等），可结合知识库、护栏、Agent 构建生成式 AI 应用。","Amazon SageMaker":"Amazon SageMaker - AWS ML 全生命周期平台。数据准备、模型训练、调优、部署一体化，含 Clarify（偏差检测）、Ground Truth（数据标注）等工具。","SageMaker Clarify":"SageMaker Clarify - 用于检测数据集和模型中的偏见/不平衡，帮助实施负责任的 AI。","Clarify":"SageMaker Clarify - 用于检测数据集和模型中的偏见/不平衡，帮助实施负责任的 AI。","Ground Truth":"SageMaker Ground Truth - 人机协作的数据标注服务，用于训练数据的制作与改进。","扩散模型":"Diffusion Model - 扩散模型。图像生成领域的主流模型，通过逐步去噪生成高质量图像（如 Stable Diffusion）。","Stable Diffusion":"Stable Diffusion - 开源扩散模型，用于从文本提示生成高质量图像。","Transformer":"Transformer - 注意力机制架构。现代大语言模型/基础模型的底层架构，擅长处理序列与上下文。","Claude":"Claude - Anthropic 推出的大语言模型，注重安全性与帮助能力。","Anthropic":"Anthropic - 人工智能安全公司，推出 Claude 系列模型。","语义搜索":"Semantic Search - 语义搜索。基于向量嵌入理解查询与文档的语义相似度进行检索，优于关键词匹配。","温度":"Temperature - 采样参数。控制模型输出的随机性/创造性：低温更确定、高温更多样。","护栏":"Guardrails - 护栏。Amazon Bedrock 防护机制，过滤有害输入/输出，保证模型响应符合负责任的 AI 要求。","模型蒸馏":"Model Distillation - 模型蒸馏。将大型模型的知识迁移到较小模型，在保持性能的同时降低资源开销。","零样本学习":"Zero-shot Learning - 零样本学习。模型不依赖示例，直接基于对任务的理解完成新任务。","少样本学习":"Few-shot Learning - 少样本学习。通过少量示例引导模型完成新任务。","思维链":"Chain-of-Thought (CoT) - 思维链。提示模型逐步推导最终答案，提升复杂推理表现。","业务指标":"Business Metrics - 业务指标。衡量 AI 解决方案业务效果的量化指标（如点击率 CTR、平均订单价值 AOV、用户留存率）。","模型评估":"Model Evaluation - 模型评估。在部署前对模型准确性、相关性、安全性等指标进行测试验证的过程。","Amazon Titan":"Amazon Titan - AWS 自研基础模型族，提供文本生成、文本嵌入等能力。","Amazon Nova":"Amazon Nova - AWS 推出的新一代基础模型（文本/多模态），用于生成式 AI 应用。","AgentCore":"Amazon Bedrock AgentCore - 用于构建、部署、大规模实施 Agent 的运行时能力，含可观测性、代码解析器、浏览器工具等。","提示模板":"Prompt Template - 提示模板。预定义的提示结构，含角色、指令、上下文、格式要求等组件。","编码器解码器":"Encoder-Decoder - 编码器-解码器架构。常用于机器翻译、摘要等序列到序列任务。"}};
const QUIZ_QUESTIONS = [{"id":"D1-001","d":1,"t":"single","q":"一家公司每季度进行预测，以决定如何优化运营来满足预期需求。该公司使用 ML 模型进行这些预测。一位人工智能从业者正在撰写一份关于训练后的 ML 模型的报告，以向公司利益相关者提供透明度和可解释性。AI 从业者应该在报告中包括什么来满足透明性和可解释性的要求？","o":[{"l":"A","t":"模型训练代码"},{"l":"B","t":"部分相关图(PDP)"},{"l":"C","t":"用于培训的示例数据"},{"l":"D","t":"模型收敛表"}],"a":["B"],"e":"**✅ 为什么 B.部分相关图(PDP) 对**：部分依赖图（Partial Dependence Plot）是模型可解释性工具，能直观展示单个特征如何影响模型预测结果，帮助利益相关者理解模型决策逻辑，直接满足透明度和可解释性要求。\n\n**❌ 为什么其他选项错**：\n- A.模型训练代码：代码是技术实现细节，非技术利益相关者无法从中获得可解释性洞察\n- C.用于培训的示例数据：展示数据样本不能解释模型如何做出决策\n- D.模型收敛表：收敛表展示训练过程是否稳定，属于训练质量指标，不提供预测可解释性\n\n**📌 关键概念**：ML 可解释性工具包括 PDP、SHAP 值、特征重要性图等。PDP 适合向非技术受众解释模型行为。AWS 中 SageMaker Clarify 提供类似功能。","s":"源#1"},{"id":"D1-002","d":1,"t":"single","q":"一家公司想根据基因特征将人类基因分为 20 类。该公司需要一个 ML 算法来记录模型的内部机制如何影响输出。哪种 ML 算法符合这些要求？","o":[{"l":"A","t":"决策树"},{"l":"B","t":"线性回归"},{"l":"C","t":"逻辑回归"},{"l":"D","t":"神经网络"}],"a":["A"],"e":"**✅ 为什么 A.决策树 对**：决策树按特征逐步分支，天然具备可解释性，能清晰展示内部机制如何影响输出，同时支持将数据分成 20 类的多分类任务，两者都满足题干要求。\n\n**❌ 为什么其他选项错**：\n- B.线性回归：线性回归输出连续数值，用于回归预测，不能做离散的多分类（20 类）任务\n- C.逻辑回归：逻辑回归本质是二分类模型，输出样本属于某个类别的概率，无法直接划分 20 类\n- D.神经网络：神经网络通过隐藏层做特征变换，内部机制不透明，难以记录每个输出受什么因素影响\n\n**📌 关键概念**：可解释性（Interpretability）指能理解模型内部如何影响输出，决策树、线性模型比神经网络更容易解释。本题对应监督学习中的多分类问题，SageMaker 内置 XGBoost 等算法可直接使用。","s":"源#3"},{"id":"D1-003","d":1,"t":"single","q":"一家公司建立了一个图像分类模型，从植物叶片的照片中预测植物疾病。该公司希望评估模型正确分类了多少图像。公司应该使用哪个评估指标来衡量模型的性能？","o":[{"l":"A","t":"r 平方得分"},{"l":"B","t":"准确度最高"},{"l":"C","t":"均方根误差(RMSE)"},{"l":"D","t":"学习率"}],"a":["B"],"e":"**✅ 为什么 B.准确度最高对**：题干要求衡量\"模型正确分类了多少图像\"，这正是准确率（Accuracy）的定义——正确分类的样本数占总样本数的比例。对于图像分类任务，准确率是最直观的整体性能指标。\n\n**❌ 为什么其他选项错**：\n- A.r 平方得分：R² 用于回归任务，衡量模型对连续值的拟合程度，不适用于分类\n- C.均方根误差(RMSE)：RMSE 也是回归指标，计算预测值与实际值的偏差\n- D.学习率：学习率是超参数，控制模型训练步长，不是评估指标\n\n**📌 关键概念**：分类任务用准确率/精确率/召回率/F1；回归任务用 RMSE/MAE/R²。图像分类属于分类任务。","s":"源#4"},{"id":"D1-004","d":1,"t":"single","q":"一家公司正在使用特定领域的模型。该公司希望从一开始就避免创造新的模式。相反，该公司希望调整预先训练的模型，为新的相关任务创建模型。哪种 ML 策略符合这些要求？","o":[{"l":"A","t":"增加纪元的数量。"},{"l":"B","t":"使用迁移学习。"},{"l":"C","t":"减少纪元的数量。"},{"l":"D","t":"使用无监督学习。"}],"a":["B"],"e":"**✅ 为什么 B.使用迁移学习对**：迁移学习（Transfer Learning）的核心思想就是利用预训练模型已学到的知识，将其应用于新的相关任务，无需从零开始训练。这与题干\"调整预先训练的模型，为新的相关任务创建模型\"完全吻合。\n\n**❌ 为什么其他选项错**：\n- A.增加纪元的数量：增加训练轮次只是延长训练时间，不涉及利用预训练模型\n- C.减少纪元的数量：减少训练轮次也不涉及预训练模型的复用\n- D.使用无监督学习：无监督学习是一种学习方法，不是复用预训练模型的策略\n\n**📌 关键概念**：迁移学习是利用已训练模型的知识迁移到新任务的技术，常用于数据不足或计算资源有限的场景。微调（Fine-tuning）是迁移学习的典型实现方式。","s":"源#7"},{"id":"D1-005","d":1,"t":"single","q":"一家公司希望使用语言模型在边缘设备上创建一个用于推理的应用程序。推断必须具有尽可能低的延迟。哪种解决方案能够满足这些要求？","o":[{"l":"A","t":"在边缘设备上部署优化的小型语言模型(SLM)。"},{"l":"B","t":"在边缘设备上部署优化的大型语言模型(LLM)。"},{"l":"C","t":"整合集中式小型语言模型(SLM) API，用于与边缘设备进行异步通信。"},{"l":"D","t":"整合集中式大型语言模型(LLM) API，用于与边缘设备进行异步通信。"}],"a":["A"],"e":"**✅ 为什么 A.在边缘设备上部署优化的小型语言模型(SLM) 对**：题干有两个关键要求：①边缘设备上推理 ②尽可能低的延迟。SLM 体积小、计算需求低，可以直接在边缘设备本地运行，避免网络往返延迟，满足低延迟需求。\n\n**❌ 为什么其他选项错**：\n- B.在边缘设备上部署优化的大型语言模型(LLM)：LLM 参数量大，边缘设备通常计算资源有限，无法高效运行\n- C.集成集中式小型语言模型(SLM) API：通过 API 调用集中式服务需要网络通信，增加延迟\n- D.集成集中式大型语言模型(LLM) API：同样需要网络通信且 LLM 本身推理也慢\n\n**📌 关键概念**：边缘推理要求模型小且本地运行。SLM（小型语言模型）是边缘部署的最佳选择，可通过量化、蒸馏等技术优化。","s":"源#10"},{"id":"D1-006","d":1,"t":"single","q":"一家公司想通过使用Amazon SageMaker 建立一个 ML 模型。公司需要在多个团队之间共享和管理模型开发的变量。哪个 SageMaker 特性符合这些要求？","o":[{"l":"A","t":"Amazon SageMaker Feature Store"},{"l":"B","t":"Amazon SageMaker Data Wrangler"},{"l":"C","t":"Amazon SageMaker Clarify"},{"l":"D","t":"Amazon SageMaker 模型卡"}],"a":["A"],"e":"**✅ 为什么 A.Amazon SageMaker Feature Store对**：SageMaker Feature Store 是一个专门用于存储、共享和管理 ML 特征（变量）的集中式存储库。它支持多团队协作，确保特征的一致性和可重用性，直接满足\"在多个团队之间共享和管理模型开发的变量\"。\n\n**❌ 为什么其他选项错**：\n- B.Amazon SageMaker Data Wrangler：Data Wrangler 用于数据准备和转换，不是共享变量的工具\n- C.Amazon SageMaker Clarify：Clarify 用于偏差检测和模型可解释性\n- D.Amazon SageMaker 模型卡：Model Cards 用于记录模型信息（目的、性能、局限性），不管理特征变量\n\n**📌 关键概念**：SageMaker Feature Store 提供在线和离线存储，支持特征的跨团队共享、版本管理和实时查询。","s":"源#11"},{"id":"D1-007","d":1,"t":"single","q":"一家公司希望使用生成式人工智能来提高开发人员的生产力和软件开发。公司想使用Amazon Q Developer。Amazon Q Developer 可以做些什么来帮助公司满足这些要求？","o":[{"l":"A","t":"创建软件片段、参考跟踪和开源许可证跟踪。"},{"l":"B","t":"无需配置或管理服务器即可运行应用程序。"},{"l":"C","t":"启用用于编码和提供自然语言搜索的语音命令。"},{"l":"D","t":"使用 ML 模型将音频文件转换为文本文档。"}],"a":["A"],"e":"**✅ 为什么 A.创建软件片段、参考跟踪和开源许可证跟踪对**：Amazon Q Developer 是 AWS 的 AI 编码助手，核心功能包括：代码生成（创建软件片段）、代码引用跟踪（显示代码来源参考）、开源许可证检测（确保合规），直接提升开发效率。\n\n**❌ 为什么其他选项错**：\n- B.无需配置或管理服务器即可运行应用程序：这是 AWS Lambda 的功能，不是 Q Developer\n- C.启用用于编码和提供自然语言搜索的语音命令：Q Developer 不提供语音命令功能\n- D.使用 ML 模型将音频文件转换为文本文档：这是 Amazon Transcribe 的功能\n\n**📌 关键概念**：Amazon Q Developer 提供代码生成、代码解释、安全扫描、代码转换等功能，并跟踪生成代码的开源许可证信息。","s":"源#12"},{"id":"D1-008","d":1,"t":"single","q":"一家公司想开发一个教育游戏，让用户回答如下问题:“一个罐子里有六个红色、四个绿色和三个黄色的弹珠。从罐子里选一颗绿色弹珠的概率有多大？”哪种解决方案能以最少的运营开销满足这些要求？","o":[{"l":"A","t":"使用监督学习来创建预测概率的回归模型。"},{"l":"B","t":"使用强化学习来训练模型以返回概率。"},{"l":"C","t":"使用通过简单的规则和计算来计算概率的代码。"},{"l":"D","t":"使用无监督学习创建一个模型来估计概率密度。"}],"a":["C"],"e":"**✅ 为什么 C.使用通过简单的规则和计算来计算概率的代码对**：这是一个确定性的数学计算问题（4/13），不需要 ML 模型。简单规则代码（概率=有利结果数/总结果数）即可精确计算，运营开销最低，无需训练、部署和维护模型。\n\n**❌ 为什么其他选项错**：\n- A.使用监督学习来创建预测概率的回归模型：大材小用，用 ML 解决简单算术问题增加不必要的复杂性和成本\n- B.使用强化学习来训练模型以返回概率：强化学习适合决策优化，不适合简单计算\n- D.使用无监督学习创建一个模型来估计概率密度：概率密度估计适用于复杂分布，这里是精确计算\n\n**📌 关键概念**：不是所有问题都需要 AI/ML。当规则明确、计算确定时，传统编程更高效。AI 适用于模式复杂、规则难以明确定义的场景。","s":"源#14"},{"id":"D1-009","d":1,"t":"single","q":"哪个指标衡量运行 AI 模型的运行时效率？","o":[{"l":"A","t":"客户满意度得分(CSAT)"},{"l":"B","t":"每个历元的训练时间"},{"l":"C","t":"平均响应时间"},{"l":"D","t":"培训实例的数量"}],"a":["C"],"e":"**✅ 为什么 C.平均响应时间对**：平均响应时间（Average Response Time）直接衡量 AI 模型处理请求的速度，即从接收输入到产生输出的时间，是运行时效率的核心指标。\n\n**❌ 为什么其他选项错**：\n- A.客户满意度得分(CSAT)：CSAT 是业务指标，衡量用户满意程度，不是模型运行效率\n- B.每个历元的训练时间：训练时间属于开发阶段指标，不是运行时（推理阶段）效率\n- D.培训实例的数量：这是数据量指标，与运行时性能无关\n\n**📌 关键概念**：运行时效率关注推理阶段的性能指标，包括延迟（响应时间）、吞吐量（每秒处理请求数）、资源利用率等。","s":"源#15"},{"id":"D1-010","d":1,"t":"single","q":"一家公司正在构建一个联络中心应用程序，并希望从客户对话中获得洞察力。该公司希望从客户电话的音频中分析和提取关键信息。哪种解决方案符合这些要求？","o":[{"l":"A","t":"使用 Amazon Lex 创建一个对话聊天机器人。"},{"l":"B","t":"使用Amazon Transcribe电话录音。"},{"l":"C","t":"使用 Amazon SageMaker Model Monitor 从通话记录中提取信息。"},{"l":"D","t":"使用Amazon Comprehend创建分类标签。"}],"a":["B"],"e":"**✅ 为什么 B.使用Amazon Transcribe电话录音对**：Amazon Transcribe 是 AWS 的自动语音识别（ASR）服务，能将音频转为文本，支持通话分析功能（Call Analytics），可从客户电话录音中提取关键信息、情感、通话摘要等洞察。\n\n**❌ 为什么其他选项错**：\n- A.使用 Amazon Lex 创建一个对话聊天机器人：Lex 用于构建对话机器人，不是分析已有录音\n- C.使用 Amazon SageMaker Model Monitor 从通话记录中提取信息：Model Monitor 用于监控模型质量漂移，不做音频分析\n- D.使用Amazon Comprehend创建分类标签：Comprehend 分析文本而非音频，且需先将音频转为文本\n\n**📌 关键概念**：音频→文本用 Transcribe；文本分析（情感/实体）用 Comprehend。联络中心分析通常是 Transcribe + Comprehend 的组合。","s":"源#16"},{"id":"D1-011","d":1,"t":"single","q":"一家公司有数 Pb 的未标记客户数据用于广告活动。该公司希望将其客户分为不同的等级，以宣传和推广该公司的产品。公司应该使用哪种方法来满足这些要求？","o":[{"l":"A","t":"监督学习"},{"l":"B","t":"无监督学习"},{"l":"C","t":"强化学习"},{"l":"D","t":"人类反馈强化学习(RLHF)"}],"a":["B"],"e":"**✅ 为什么 B.无监督学习对**：题干明确指出数据是\"未标记\"的，且目标是\"将客户分为不同等级\"（分群）。无监督学习专门处理未标记数据，聚类算法（如 K-Means）可自动发现客户群体的自然分组。\n\n**❌ 为什么其他选项错**：\n- A.监督学习：监督学习需要标记数据（已知的正确输出），题干明确说数据未标记\n- C.强化学习：强化学习通过试错和奖惩学习最优策略，不适合客户分群任务\n- D.人类反馈强化学习(RLHF)：RLHF 用于根据人类偏好微调 LLM，与客户分群无关\n\n**📌 关键概念**：无监督学习的聚类算法适合：数据未标记 + 需要发现自然分组的场景。K-Means 是最常用的聚类算法。","s":"源#17"},{"id":"D1-012","d":1,"t":"single","q":"一家公司开发了一种用于图像分类的 ML 模型。该公司希望将该模型部署到产品中，以便 web 应用程序可以使用该模型。该公司需要实施一个解决方案来托管模型和提供预测，而无需管理任何底层基础架构。哪种解决方案能够满足这些要求？","o":[{"l":"A","t":"使用 Amazon SageMaker Serverless Inference来部署模型。"},{"l":"B","t":"使用 Amazon CloudFront 部署模型。"},{"l":"C","t":"使用 Amazon API Gateway 托管模型并提供预测服务。"},{"l":"D","t":"使用 AWS Batch 托管模型并提供预测。"}],"a":["A"],"e":"**✅ 为什么 A.使用 Amazon SageMaker Serverless Inference来部署模型对**：SageMaker Serverless Inference 无需管理底层基础设施，自动扩缩容，按调用计费。完美满足\"托管模型和提供预测，无需管理基础架构\"的需求。\n\n**❌ 为什么其他选项错**：\n- B.使用 Amazon CloudFront 部署模型：CloudFront 是 CDN 服务，分发静态内容，不能托管 ML 模型推理\n- C.使用 Amazon API Gateway 托管模型并提供预测服务：API Gateway 是 API 管理服务，本身不执行模型推理\n- D.使用 AWS Batch 托管模型并提供预测：AWS Batch 用于批量计算作业，不适合实时预测 API\n\n**📌 关键概念**：SageMaker 提供多种推理方式：实时推理（始终在线）、无服务器推理（自动扩缩、零运维）、批量转换（离线大批量）、异步推理（长时间处理）。","s":"源#27"},{"id":"D1-013","d":1,"t":"single","q":"一个人工智能从业者有一个动物照片的数据库。人工智能从业者希望在没有人工努力的情况下自动识别和分类照片中的动物。哪种策略符合这些要求？","o":[{"l":"A","t":"对象检测"},{"l":"B","t":"异常检测"},{"l":"C","t":"命名实体识别"},{"l":"D","t":"修补"}],"a":["A"],"e":"**✅ 为什么 A.对象检测对**：对象检测（Object Detection）能自动识别图像中的物体并进行分类，同时确定物体位置。对于\"识别和分类照片中的动物\"这一需求，对象检测是最直接的计算机视觉技术。\n\n**❌ 为什么其他选项错**：\n- B.异常检测：异常检测用于发现偏离正常模式的数据点，不用于动物分类\n- C.命名实体识别：NER 是 NLP 技术，从文本中识别命名实体（人名、地名等），不处理图像\n- D.修补：修补（Inpainting）用于图像修复/填充缺失区域，不做分类\n\n**📌 关键概念**：计算机视觉任务层级——图像分类（整体类别）→ 对象检测（定位+分类）→ 实例分割（像素级）。Amazon Rekognition 提供现成的对象检测 API。","s":"源#31"},{"id":"D1-014","d":1,"t":"single","q":"哪种 AWS 服务或功能可以帮助人工智能开发团队快速部署和使用基础模型(FM)球队的 VPC？","o":[{"l":"A","t":"Amazon Personalize"},{"l":"B","t":"Amazon SageMaker JumpStart"},{"l":"C","t":"Amazon Bedrock Playground PartyRock"},{"l":"D","t":"Amazon SageMaker Endpoint"}],"a":["B"],"e":"**✅ 为什么 B.Amazon SageMaker JumpStart 对**：SageMaker JumpStart 提供预训练基础模型的一键部署功能，团队可以快速浏览、选择并部署各种 FM（包括 LLM、计算机视觉模型等），无需从零开始配置。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Personalize：Amazon Personalize 用于构建推荐系统，不提供通用 FM 部署\n- C.Amazon Bedrock Playground PartyRock：PartyRock 是面向公众的无代码 GenAI 应用构建平台，不是企业级 FM 部署工具\n- D.Amazon SageMaker Endpoint：端点是部署的目标，但不是\"快速部署和使用 FM\"的完整解决方案\n\n**📌 关键概念**：SageMaker JumpStart 是 FM 的\"应用商店\"，提供预训练模型的快速部署、微调和评估能力，支持在 VPC 内安全部署。","s":"源#33"},{"id":"D1-015","d":1,"t":"single","q":"一家公司的数据库中有万亿字节的数据，该公司可以使用这些数据进行业务分析。该公司希望构建一个基于人工智能的应用程序，该应用程序可以从员工提供的输入文本中构建 SQL 查询。员工对技术的经验很少。哪种解决方案符合这些要求？","o":[{"l":"A","t":"预训变形金刚(GPT)"},{"l":"B","t":"残差神经网络"},{"l":"C","t":"支持向量机"},{"l":"D","t":"WaveNet"}],"a":["A"],"e":"**✅ 为什么 A.预训变形金刚(GPT) 对**：GPT（生成式预训练 Transformer）是大语言模型，具备自然语言理解和代码生成能力，可以将自然语言描述转换为 SQL 查询（Text-to-SQL），非常适合让非技术人员通过自然语言与数据库交互。\n\n**❌ 为什么其他选项错**：\n- B.残差神经网络：ResNet 是图像识别模型（CNN 架构），不适合文本到 SQL 转换\n- C.支持向量机：SVM 是传统分类算法，不具备文本生成能力\n- D.WaveNet：WaveNet 是音频/语音生成模型，不处理文本到 SQL 任务\n\n**📌 关键概念**：Text-to-SQL 是 LLM/GPT 的典型应用场景。AWS 中 Amazon Q in QuickSight 提供类似的自然语言查询功能。","s":"源#35"},{"id":"D1-016","d":1,"t":"single","q":"一家公司建立了一个用于对象检测的深度学习模型，并将该模型部署到生产中。当模型分析新图像以识别物体时，哪个人工智能过程发生？","o":[{"l":"A","t":"培养"},{"l":"B","t":"推理"},{"l":"C","t":"模型部署"},{"l":"D","t":"偏差校正"}],"a":["B"],"e":"**✅ 为什么 B.推理对**：推理（Inference）是已训练好的模型对新数据做出预测的过程。模型已部署到生产中，对新图像进行识别，这正是推理阶段——模型利用学到的知识处理从未见过的数据。\n\n**❌ 为什么其他选项错**：\n- A.培养：训练（Training）是模型从数据中学习参数的过程，发生在部署之前\n- C.模型部署：部署是将模型放到生产环境的过程，是一次性动作，不是每次处理图像时发生的\n- D.偏差校正：偏差校正是消除模型偏见的过程，不是日常预测操作\n\n**📌 关键概念**：ML 生命周期：数据准备 → 训练 → 评估 → 部署 → 推理（持续）。推理是模型交付价值的阶段。","s":"源#36"},{"id":"D1-017","d":1,"t":"single","q":"一名人工智能从业者正在建立一个模型，以生成各种职业的人类图像。人工智能从业者发现输入数据是有偏差的，特定的属性会影响图像生成并在模型中产生偏差。哪种技术可以解决这个问题？","o":[{"l":"A","t":"不平衡类的数据扩充"},{"l":"B","t":"类别分布的模型监控"},{"l":"C","t":"检索扩充生成"},{"l":"D","t":"图像水印检测"}],"a":["A"],"e":"**✅ 为什么 A.不平衡类的数据扩充对**：数据扩充（Data Augmentation）通过增加代表性不足类别的样本来平衡数据集。当训练数据存在特定属性偏差时，对不平衡类别进行数据扩充可以减少模型学到的偏差。\n\n**❌ 为什么其他选项错**：\n- B.类别分布的模型监控：监控只能检测偏差，不能解决偏差问题\n- C.检索扩充生成：RAG 用于增强 LLM 回答的准确性，不解决训练数据偏差\n- D.图像水印检测：水印检测与数据偏差无关\n\n**📌 关键概念**：解决训练数据偏差的方法包括：数据扩充、重采样、合成数据生成等。SageMaker Clarify 可检测数据偏差。","s":"源#37"},{"id":"D1-018","d":1,"t":"single","q":"Amazon SageMaker Clarify 提供了哪些功能？","o":[{"l":"A","t":"集成了检索增强生成(RAG)工作流"},{"l":"B","t":"监控生产中 ML 模型的质量"},{"l":"C","t":"记录关于 ML 模型的关键细节"},{"l":"D","t":"确定数据准备期间的潜在偏差"}],"a":["D"],"e":"**✅ 为什么 D.确定数据准备期间的潜在偏差对**：SageMaker Clarify 的核心功能是检测 ML 模型中的偏差和提供可解释性。它能在数据准备阶段识别训练数据中的潜在偏差（如特定群体的代表性不足），帮助开发者在模型训练前就发现问题。\n\n**❌ 为什么其他选项错**：\n- A.集成了检索增强生成(RAG)工作流：RAG 是 Amazon Bedrock Knowledge Bases的功能，不是 Clarify\n- B.监控生产中 ML 模型的质量：这是 SageMaker Model Monitor 的功能\n- C.记录关于 ML 模型的关键细节：这是 SageMaker Model Cards 的功能\n\n**📌 关键概念**：SageMaker Clarify 三大功能——①训练前偏差检测 ②训练后偏差检测 ③模型可解释性（SHAP 值）。","s":"源#42"},{"id":"D1-019","d":1,"t":"single","q":"一家公司正在开发一种新模型来预测特定商品的价格。该模型在训练中表现良好数据集。当该公司将该模型部署到生产中时，该模型的性能显著下降。公司应该做些什么来缓解这个 1.？","o":[{"l":"A","t":"减少培训中使用的数据量。"},{"l":"B","t":"向模型中添加超参数。"},{"l":"C","t":"增加培训中使用的数据量。"},{"l":"D","t":"增加模型训练时间。"}],"a":["C"],"e":"**✅ 为什么 C.增加培训中使用的数据量对**：模型在训练集表现好但生产中性能下降，典型的过拟合（Overfitting）问题。增加训练数据量是解决过拟合最直接的方法之一——更多数据帮助模型学到更泛化的模式，而非记住特定样本。\n\n**❌ 为什么其他选项错**：\n- A.减少培训中使用的数据量：减少数据会加剧过拟合\n- B.向模型中添加超参数：超参数不是随意\"添加\"的，且不直接解决数据不足问题\n- D.增加模型训练时间：更长训练时间可能加剧过拟合\n\n**📌 关键概念**：过拟合的解决方法——增加数据量、正则化、Dropout、早停、数据增强、减少模型复杂度。","s":"源#43"},{"id":"D1-020","d":1,"t":"single","q":"一家社交媒体公司希望使用大型语言模型(LLM)进行内容审核。该公司希望评估 LLM 的输出，以发现对特定群体或个人的偏见和潜在歧视。公司应该使用哪种数据源以最少的管理工作来评估 LLM 输出？","o":[{"l":"A","t":"用户生成的内容"},{"l":"B","t":"审核日志"},{"l":"C","t":"内容审核指南"},{"l":"D","t":"基准数据集"}],"a":["D"],"e":"**✅ 为什么 D.基准数据集对**：基准数据集（Benchmark Dataset）是预先设计好的标准化评估数据集，包含已知的测试用例和期望结果。使用基准数据集评估 LLM 的偏见和歧视可以系统化地检测问题，且管理工作最少（无需自己创建和维护数据）。\n\n**❌ 为什么其他选项错**：\n- A.用户生成的内容：需要大量收集、清洗和标注工作，管理开销大\n- B.审核日志：审核日志记录操作行为，不适合评估模型偏见\n- C.内容审核指南：指南是规则文档，不是评估数据源\n\n**📌 关键概念**：Amazon Bedrock 模型评估支持使用内置基准数据集和自定义数据集来评估模型的毒性、偏见等维度。","s":"源#45"},{"id":"D1-021","d":1,"t":"single","q":"一家公司需要从Amazon Bedrock中选择一个模型在内部使用。公司必须确定一种模式，以公司员工喜欢的方式产生回应。公司应该怎么做才能满足这些要求？","o":[{"l":"A","t":"使用内置提示数据集评估模型。"},{"l":"B","t":"通过使用人力和自定义提示数据集来评估模型。"},{"l":"C","t":"使用公共模型排行榜来识别模型。"},{"l":"D","t":"试用模型时，使用 Amazon CloudWatch 中的模型 InvocationLatency 运行时指标。"}],"a":["B"],"e":"**✅ 为什么 B.通过使用人力和自定义提示数据集来评估模型对**：题干要求找到\"员工喜欢的方式\"，这是主观偏好评估。使用人工评估（Human Evaluation）配合自定义提示数据集，可以让员工直接对不同模型的输出进行打分和比较，确保选出符合公司偏好的模型。\n\n**❌ 为什么其他选项错**：\n- A.使用内置提示数据集评估模型：内置数据集是通用的，不能反映公司特定的员工偏好\n- C.使用公共模型排行榜来识别模型：公共排行榜基于通用基准，不反映特定公司需求\n- D.使用 CloudWatch 中的 InvocationLatency 运行时指标：延迟是技术指标，不衡量输出质量偏好\n\n**📌 关键概念**：Amazon Bedrock 模型评估支持人工评估和自动评估。人工评估适合主观质量判断；自动评估适合客观指标（如准确率、毒性）。","s":"源#48"},{"id":"D1-022","d":1,"t":"single","q":"一家公司正在构建一个应用程序，该应用程序需要生成基于现有数据的合成数据。公司可以使用哪种型号来满足这一要求？","o":[{"l":"A","t":"生成性对抗性网络(GAN)"},{"l":"B","t":"XGBoost"},{"l":"C","t":"残差神经网络"},{"l":"D","t":"WaveNet"}],"a":["A"],"e":"**✅ 为什么 A.生成性对抗性网络(GAN) 对**：GAN（生成对抗网络）由生成器和判别器组成，专门用于生成与真实数据分布相似的合成数据。这是\"基于现有数据生成合成数据\"的经典模型。\n\n**❌ 为什么其他选项错**：\n- B.XGBoost：XGBoost 是梯度提升决策树，用于分类和回归，不能生成合成数据\n- C.残差神经网络：ResNet 用于图像分类，不是生成模型\n- D.WaveNet：WaveNet 是特定的音频生成模型，不是通用合成数据生成方案\n\n**📌 关键概念**：GAN 的核心是生成器（造假）vs 判别器（辨真假）的对抗训练。适用于生成图像、表格数据、时间序列等合成数据。","s":"源#52"},{"id":"D1-023","d":1,"t":"single","q":"一家数字设备公司希望预测客户对内存硬件的需求。该公司没有编码经验或 ML 算法知识，需要开发一个数据驱动的预测模型。公司需要对内部数据和外部数据进行分析。哪种解决方案能够满足这些要求？","o":[{"l":"A","t":"将数据存储在Amazon S3。使用Amazon SageMaker 内置算法创建 ML 模型和需求预测，该算法使用来自Amazon S3 的数据。"},{"l":"B","t":"将数据导入 Amazon SageMaker Data Wrangler。使用 SageMaker 内置算法创建 ML 模型和需求预测。"},{"l":"C","t":"将数据导入 Amazon SageMaker Data Wrangler。使用Amazon Personalize趋势预测方法建立 ML 模型和需求预测。"},{"l":"D","t":"将数据导入 Amazon SageMaker Canvas。通过从 SageMaker Canvas 中选择数据值，构建 ML 模型和需求预测。"}],"a":["D"],"e":"**✅ 为什么 D.将数据导入 Amazon SageMaker Canvas。通过从 SageMaker Canvas 中选择数据值，构建 ML 模型和需求预测对**：SageMaker Canvas 是无代码 ML 工具，非技术用户通过可视化界面即可构建 ML 模型。满足\"没有编码经验或 ML 算法知识\"的要求，支持导入内部和外部数据。\n\n**❌ 为什么其他选项错**：\n- A.将数据存储在 S3，使用 SageMaker 内置算法：SageMaker 内置算法需要编码经验\n- B.将数据导入 Data Wrangler，使用 SageMaker 内置算法：仍需编程能力\n- C.使用Amazon Personalize趋势预测：Personalize 用于推荐系统，不是需求预测工具\n\n**📌 关键概念**：SageMaker Canvas = 无代码 ML。适合业务用户自助建模，支持时间序列预测、分类、回归等任务。","s":"源#53"},{"id":"D1-024","d":1,"t":"single","q":"一家公司安装了一个安全摄像头。该公司使用 ML 模型来评估安全摄像机镜头潜在的盗窃。该公司发现，该模型不成比例地标记了属于特定族裔群体的人。哪种类型的偏差会影响模型输出？","o":[{"l":"A","t":"测量偏差"},{"l":"B","t":"抽样偏差"},{"l":"C","t":"观察者偏差"},{"l":"D","t":"确认偏差"}],"a":["B"],"e":"**✅ 为什么 B.抽样偏差对**：抽样偏差（Sampling Bias）指训练数据的收集方式导致某些群体过度或不足代表。模型不成比例地标记特定族裔群体，说明训练数据中该群体的样本分布不均衡（可能被标记为\"可疑\"的比例过高），导致模型学到了有偏的模式。\n\n**❌ 为什么其他选项错**：\n- A.测量偏差：测量偏差指数据收集工具的系统性误差，不是群体代表性问题\n- C.观察者偏差：观察者偏差指标注人员的主观判断影响，不是数据抽样问题\n- D.确认偏差：确认偏差是人类认知偏差（倾向于寻找支持已有观点的证据），不是数据偏差类型\n\n**📌 关键概念**：训练数据偏差类型——抽样偏差（样本不代表）、标注偏差（标注不公正）、排除偏差（遗漏某些群体）。SageMaker Clarify 可检测这些偏差。","s":"源#54"},{"id":"D1-025","d":1,"t":"single","q":"一家公司正在开发一款客服聊天机器人。该公司希望聊天机器人通过学习过去的互动和在线资源来改善其反应。哪种 AI 学习策略提供了这种自我提升能力？","o":[{"l":"A","t":"使用由好的和坏的响应组成的手动精选数据集进行监督学习"},{"l":"B","t":"强化学习，奖励积极的客户反馈"},{"l":"C","t":"无监督学习以发现相似客户查询的聚类"},{"l":"D","t":"通过不断更新的常见问题数据库进行监督学习"}],"a":["B"],"e":"**✅ 为什么 B.强化学习，奖励积极的客户反馈对**：强化学习通过奖惩信号（积极客户反馈=奖励）持续优化策略。聊天机器人\"通过学习过去的互动来改善反应\"正是 RL 的核心——智能体在环境中行动，根据反馈调整行为，实现持续自我提升。\n\n**❌ 为什么其他选项错**：\n- A.使用手动精选数据集进行监督学习：监督学习需要持续的人工标注，不是\"自我提升\"\n- C.无监督学习以发现相似客户查询的聚类：聚类不能改善回答质量\n- D.通过不断更新的常见问题数据库进行监督学习：依赖人工更新FAQ，不是自动学习改善\n\n**📌 关键概念**：强化学习的\"自我提升\"特性：智能体→行动→获得反馈→调整策略→更好的行动。RLHF（人类反馈强化学习）正是用这种方式改善 LLM 输出。","s":"源#55"},{"id":"D1-026","d":1,"t":"single","q":"一家公司建造了一个聊天机器人,可以用图像回答自然语言问题。该公司希望确保聊天机器人不会返回不合适或不想要的图像。哪种解决方案能够满足这些要求?","o":[{"l":"A","t":"实现审核 API。"},{"l":"B","t":"使用通用公共数据集重新训练模型。"},{"l":"C","t":"执行模型验证。"},{"l":"D","t":"自动整合用户反馈。"}],"a":["A"],"e":"**✅ 为什么 A.实现审核 API 对**：内容审核 API（如 Amazon Rekognition 的内容审核功能）可以在图像输出前检测不当内容（暴力、成人内容等），自动过滤不合适的图像，是确保输出安全的标准方案。\n\n**❌ 为什么其他选项错**：\n- B.使用通用公共数据集重新训练模型：通用数据集不能保证不含不当内容，且不提供实时过滤\n- C.执行模型验证：模型验证评估整体性能，不是实时内容过滤机制\n- D.自动整合用户反馈：用户反馈是事后改进方式，不能实时阻止不当图像输出\n\n**📌 关键概念**：内容安全防护——输入过滤 + 输出审核。Amazon Bedrock Guardrails 和 Rekognition Content Moderation 提供此能力。","s":"源#56"},{"id":"D1-027","d":1,"t":"single","q":"一家公司正在构建一个 ML 模型来分析归档数据。该公司必须在几千兆字节大小的大型数据集上执行推理。该公司不需要立即访问模型预测。哪个Amazon SageMaker 推理选项会满足这些要求?","o":[{"l":"A","t":"批量转换"},{"l":"B","t":"实时推理"},{"l":"C","t":"无服务器推理"},{"l":"D","t":"异步推理"}],"a":["A"],"e":"**✅ 为什么 A.批量转换对**：SageMaker Batch Transform一次性处理大量数据的推理，不需要实时响应。非常适合\"大型数据集 + 不需要立即访问结果\"的场景，成本也低于保持端点在线。\n\n**❌ 为什么其他选项错**：\n- B.实时推理：实时推理需要始终在线的端点，适用于需要即时响应的场景，成本高\n- C.无服务器推理：适合间歇性、小规模请求，不适合 TB 级批量处理\n- D.异步推理：适合单个大请求的长时间处理，不是批量处理大数据集的最佳方案\n\n**📌 关键概念**：批量转换 = 大数据集 + 无需实时响应 + 一次性处理。典型场景：离线评分、日终报表、历史数据回溯分析。","s":"源#58"},{"id":"D1-028","d":1,"t":"single","q":"一位 AI 从业者建立了一个深度学习模型，对图像中的材料类型进行分类。人工智能从业者现在想要测量模型性能。哪个指标将帮助人工智能从业者评估模型的性能？","o":[{"l":"A","t":"混淆矩阵"},{"l":"B","t":"相关矩阵"},{"l":"C","t":"R2 分数"},{"l":"D","t":"均方误差"}],"a":["A"],"e":"**✅ 为什么 A.混淆矩阵对**：混淆矩阵（Confusion Matrix）展示分类模型的完整预测结果——正确分类和错误分类的详细分布。对于多类别图像分类任务，混淆矩阵能直观显示每类的分类准确情况和混淆模式。\n\n**❌ 为什么其他选项错**：\n- B.相关矩阵：相关矩阵衡量特征间的线性关系，是数据探索工具，不是模型评估指标\n- C.R2 分数：R² 是回归指标，衡量回归模型的拟合优度，不适用于分类\n- D.均方误差：MSE 也是回归指标，不适用于分类任务\n\n**📌 关键概念**：分类模型评估——混淆矩阵 → 从中计算精确率、召回率、F1、准确率。回归模型评估——RMSE、MAE、R²。","s":"源#62"},{"id":"D1-029","d":1,"t":"single","q":"一家医疗公司在Amazon Bedrock上部署了一个疾病检测模型。为了遵守隐私政策，该公司希望阻止模型在其响应中包含个人患者信息。该公司还希望在违反政策时收到通知。哪种解决方案符合这些要求？","o":[{"l":"A","t":"使用 Amazon Macie 扫描模型输出中的敏感数据，并为潜在的违规行为设置警报。"},{"l":"B","t":"配置 AWS CloudTrail 来监控模型的响应，并为任何检测到的个人信息创建警报。"},{"l":"C","t":"使用Amazon Bedrock护栏过滤内容。设置 Amazon CloudWatch 警报，通知违反策略的情况。"},{"l":"D","t":"实现 Amazon SageMaker 模型监视器，以检测数据漂移，并在模型质量下降时接收警报。"}],"a":["C"],"e":"**✅ 为什么 C.使用Amazon Bedrock护栏过滤内容。设置 Amazon CloudWatch 警报，通知违反策略的情况对**：Amazon Bedrock Guardrails 可以配置内容过滤策略，包括阻止个人身份信息（PII）出现在模型响应中。结合 CloudWatch 警报，可以在违规时自动通知相关人员。\n\n**❌ 为什么其他选项错**：\n- A.使用 Amazon Macie 扫描模型输出中的敏感数据：Macie 用于扫描 S3 存储中的数据，不实时过滤模型输出\n- B.配置 AWS CloudTrail 来监控模型的响应：CloudTrail 记录 API 调用，不分析输出内容\n- D.实现 SageMaker 模型监视器：Model Monitor 检测数据漂移和模型质量，不做内容过滤\n\n**📌 关键概念**：Bedrock Guardrails 提供——敏感信息过滤（PII）、有害内容过滤、话题限制、上下文约束。配合 CloudWatch 实现实时监控告警。","s":"源#64"},{"id":"D1-030","d":1,"t":"single","q":"一家公司手动审核所有提交的 PDF 格式简历。随着公司的发展，公司预计简历的数量会超过公司的审查能力。该公司需要一个自动化系统将 PDF 格式的简历转换为纯文本格式，以便进行进一步处理。哪个 AWS 服务符合这一要求？","o":[{"l":"A","t":"Amazon Textract"},{"l":"B","t":"Amazon Personalize"},{"l":"C","t":"Amazon Lex"},{"l":"D","t":"Amazon Transcribe"}],"a":["A"],"e":"**✅ 为什么 A.Amazon Textract 对**：Amazon Textract 专门从文档（PDF、图片）中自动提取文本、表格和表单数据。将 PDF 简历转换为纯文本正是 Textract 的核心功能。\n\n**❌ 为什么其他选项错**：\n- B.Amazon Personalize：Personalize 用于推荐系统，不处理文档\n- C.Amazon Lex：Lex 用于构建对话机器人，不做文档文本提取\n- D.Amazon Transcribe：Transcribe 将音频转文本，不处理 PDF 文档\n\n**📌 关键概念**：文档处理服务——Textract（PDF/图片→文本/表格）、Comprehend（文本→实体/情感）、Translate（文本→翻译）。","s":"源#65"},{"id":"D1-031","d":1,"t":"single","q":"哪种策略可评估影像分类任务中使用的基础模型(FM)的准确性？","o":[{"l":"A","t":"计算模型使用的资源的总成本。"},{"l":"B","t":"根据预定义的基准数据集衡量模型的准确性。"},{"l":"C","t":"计算神经网络的层数。"},{"l":"D","t":"评估模型处理的图像的颜色准确性。"}],"a":["B"],"e":"**✅ 为什么 B.根据预定义的基准数据集衡量模型的准确性对**：使用标准基准数据集评估是衡量 FM 分类准确性的标准方法——将模型预测与已知正确标签比较，计算准确率等指标。\n\n**❌ 为什么其他选项错**：\n- A.计算模型使用的资源的总成本：成本是经济指标，不衡量准确性\n- C.计算神经网络的层数：层数是架构特征，不等于准确性\n- D.评估模型处理的图像的颜色准确性：颜色准确性不是分类性能指标\n\n**📌 关键概念**：模型评估的标准流程——准备基准数据集（含已知标签）→ 运行模型推理 → 对比预测与真实标签 → 计算评估指标。","s":"源#67"},{"id":"D1-032","d":1,"t":"single","q":"主题 1 一家公司正在建立一个 ML 模型。该公司收集了新数据，并通过创建关联矩阵、计算统计数据和可视化数据来分析这些数据。公司目前处于 ML 管道的哪个阶段？","o":[{"l":"A","t":"数据预处理"},{"l":"B","t":"特征工程"},{"l":"C","t":"探索性数据分析"},{"l":"D","t":"超参数调谐"}],"a":["C"],"e":"**✅ 为什么 C.探索性数据分析对**：探索性数据分析（EDA）的典型活动就是：计算统计数据、创建相关矩阵、数据可视化。EDA 的目的是理解数据特征、发现模式和异常。\n\n**❌ 为什么其他选项错**：\n- A.数据预处理：预处理是清洗、转换数据（缺失值处理、标准化等），不是分析和可视化\n- B.特征工程：特征工程是创建新特征或转换现有特征，发生在 EDA 之后\n- D.超参数调谐：超参数调优是模型训练阶段的优化过程\n\n**📌 关键概念**：ML 管道顺序——数据收集 → EDA（探索性分析）→ 数据预处理 → 特征工程 → 模型训练 → 评估 → 部署。","s":"源#68"},{"id":"D1-033","d":1,"t":"single","q":"由于数据库错误，一家公司的文档丢失了一些单词。该公司希望建立一个 ML 模型，可以建议潜在的单词来填充缺失的文本。哪种型号符合这一要求？","o":[{"l":"A","t":"主题建模"},{"l":"B","t":"聚类模型"},{"l":"C","t":"规范的 ML 模型"},{"l":"D","t":"基于 BERT 的模型"}],"a":["D"],"e":"**✅ 为什么 D.基于 BERT 的模型对**：BERT（Bidirectional Encoder Representations from Transformers）的预训练任务之一就是\"遮蔽语言模型\"（Masked Language Model）——预测被遮蔽的词。这与\"建议潜在的单词来填充缺失文本\"完全对应。\n\n**❌ 为什么其他选项错**：\n- A.主题建模：主题建模发现文档集合的主题分布，不填充缺失单词\n- B.聚类模型：聚类将相似数据分组，不具备文本填充能力\n- C.规范的 ML 模型：传统 ML 模型（如决策树、SVM）不擅长上下文文本理解和填充\n\n**📌 关键概念**：BERT 的 MLM（Masked Language Model）预训练——随机遮蔽 15% 的 token，模型学习预测被遮蔽的词。这使 BERT 天然适合文本填充/完形填空任务。","s":"源#69"},{"id":"D1-034","d":1,"t":"single","q":"一家公司希望显示过去 12 个月中各零售点的最畅销产品的总销售额。公司应该使用哪种 AWS 解决方案来自动生成图表？","o":[{"l":"A","t":"Amazon EC2 中的Amazon Q"},{"l":"B","t":"Amazon Q Developer"},{"l":"C","t":"Amazon QuickSight 中的 Amazon Q"},{"l":"D","t":"AWS 聊天机器人中的Amazon Q"}],"a":["C"],"e":"**✅ 为什么 C.Amazon QuickSight 中的 Amazon Q 对**：Amazon Q in QuickSight 允许用户使用自然语言描述想要的图表，自动生成数据可视化。非常适合\"自动生成图表\"显示销售数据的需求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon EC2 中的Amazon Q：EC2 中不内置图表生成功能\n- B.Amazon Q Developer：Q Developer 用于代码开发辅助，不是数据可视化工具\n- D.AWS 聊天机器人中的Amazon Q：AWS Chatbot 用于 DevOps 通知，不做图表生成\n\n**📌 关键概念**：Amazon Q in QuickSight = 自然语言驱动的 BI 工具，可自动生成图表、回答数据问题、创建仪表板。","s":"源#70"},{"id":"D1-035","d":1,"t":"single","q":"一名人工智能从业者通过使用包含机密数据的训练数据集，在Amazon Bedrock上训练了一个自定义模型。这 AI 从业者希望确保定制模型不会基于机密数据生成推理响应。人工智能从业者应该如何防止基于机密数据的响应？","o":[{"l":"A","t":"删除自定义模型。从训练数据集中移除机密数据。重新训练自定义模型。"},{"l":"B","t":"通过使用动态数据屏蔽来屏蔽推理响应中的机密数据。"},{"l":"C","t":"使用 Amazon SageMaker 加密推理响应中的机密数据。"},{"l":"D","t":"使用 AWS KMS)加密自定义模型中的机密数据。"}],"a":["A"],"e":"**✅ 为什么 A.删除自定义模型。从训练数据集中移除机密数据。重新训练自定义模型对**：如果模型已经在含机密数据的数据集上训练完成，模型权重中已\"记住\"了这些信息。唯一彻底的解决方案是删除旧模型、清理训练数据、重新训练。事后屏蔽无法保证完全防止信息泄露。\n\n**❌ 为什么其他选项错**：\n- B.通过使用动态数据屏蔽来屏蔽推理响应中的机密数据：屏蔽只处理表面输出，模型内部仍可能在其他上下文中泄露信息\n- C.使用 Amazon SageMaker 加密推理响应中的机密数据：加密不阻止模型生成机密内容\n- D.使用 AWS KMS 加密自定义模型中的机密数据：KMS 加密静态数据，不影响模型推理行为\n\n**📌 关键概念**：模型训练数据的安全原则——\"进入模型的数据可能出现在输出中\"。根本解决方案是在训练前清理敏感数据，而非事后补救。","s":"源#74"},{"id":"D1-036","d":1,"t":"single","q":"一家公司正在使用Amazon SageMaker Studio 笔记本来构建和训练 ML 模型。该公司将数据存储在Amazon S3 桶中。该公司需要管理从Amazon S3 到 SageMaker Studio 笔记本电脑的数据流。哪种解决方案能满足这一要求？","o":[{"l":"A","t":"使用 Amazon Inspector 监控 SageMaker Studio。"},{"l":"B","t":"使用 Amazon Macie 监控 SageMaker Studio。"},{"l":"C","t":"将 SageMaker 配置为使用带有 S3 端点的 VPC。"},{"l":"D","t":"配置 SageMaker 使用 S3 冰川深度档案。"}],"a":["C"],"e":"**✅ 为什么 C.将 SageMaker 配置为使用带有 S3 端点的 VPC 对**：通过 VPC 端点（VPC Endpoint），SageMaker 可以在不经过公共互联网的情况下安全访问 S3 数据。这是管理 SageMaker 到 S3 数据流的安全网络方案。\n\n**❌ 为什么其他选项错**：\n- A.使用 Amazon Inspector 监控 SageMaker Studio：Inspector 用于安全漏洞扫描，不管理数据流\n- B.使用 Amazon Macie 监控 SageMaker Studio：Macie 用于发现 S3 中的敏感数据，不管理网络数据流\n- D.配置 SageMaker 使用 S3 冰川深度档案：Glacier 是低成本归档存储，不适合 ML 训练数据的实时访问\n\n**📌 关键概念**：VPC + S3 端点 = 私有网络内安全访问 S3 数据，不经过公共互联网。这是 AWS 安全最佳实践。","s":"源#80"},{"id":"D1-037","d":1,"t":"single","q":"一家公司有一个基础模型(FM ),它是通过使用 Amazon Bedrock来回答客户关于产品的查询而定制的。该公司希望验证模型对新型查询的响应。该公司需要上传一个新的数据集，Amazon Bedrock可以用来验证。哪种 AWS 服务符合这些要求？","o":[{"l":"A","t":"Amazon S3"},{"l":"B","t":"Amazon EBS"},{"l":"C","t":"Amazon EFS"},{"l":"D","t":"AWS 雪锥"}],"a":["A"],"e":"**✅ 为什么 A.Amazon S3 对**：Amazon Bedrock 的模型评估功能需要从 S3 读取评估数据集。上传验证数据集到 S3 是标准做法，Bedrock 可以直接从 S3 加载数据进行模型验证。\n\n**❌ 为什么其他选项错**：\n- B.Amazon EBS：EBS 是 EC2 实例的块存储，Bedrock 不直接从 EBS 读取评估数据\n- C.Amazon EFS：EFS 是文件系统，不是 Bedrock 评估数据的标准来源\n- D.AWS 雪锥：Snowcone 是边缘计算/数据传输设备，不用于模型验证\n\n**📌 关键概念**：S3 是 AWS AI/ML 服务的标准数据存储层。Bedrock 评估、SageMaker 训练等都从 S3 读取数据。","s":"源#81"},{"id":"D1-038","d":1,"t":"single","q":"一家社交媒体公司希望使用大型语言模型(LLM)来总结消息。该公司选择了Amazon SageMaker JumpStart 上的几款 LLM。该公司希望比较这些模型产生的输出毒性。哪种策略使公司能够以最少的操作开销评估 LLM？","o":[{"l":"A","t":"众包评估"},{"l":"B","t":"投票最多的自动模型评估"},{"l":"C","t":"有人工参与的模型评估"},{"l":"D","t":"人类反馈强化学习(RLHF)"}],"a":["B"],"e":"**✅ 为什么 B.投票最多的自动模型评估对**：自动模型评估（Automatic Model Evaluation）可以使用预定义的毒性检测指标批量评估多个模型，无需人工逐一审核，操作开销最小。\n\n**❌ 为什么其他选项错**：\n- A.众包评估：众包需要招募大量人工评估者，操作开销大\n- C.有人工参与的模型评估：人工评估准确但耗时耗力，操作开销高\n- D.人类反馈强化学习(RLHF)：RLHF 用于模型训练优化，不是评估工具\n\n**📌 关键概念**：模型评估方式——自动评估（低成本、快速、适合客观指标如毒性）vs 人工评估（高成本、适合主观质量判断）。","s":"源#84"},{"id":"D1-039","d":1,"t":"single","q":"主题 1 某公司需要使用Amazon SageMaker 进行模型训练和推理。该公司必须遵守法规要求,在没有互联网接入的隔离环境中运行 SageMaker 作业。哪种解决方案能够满足这些要求?","o":[{"l":"A","t":"使用 SageMaker Experiments运行 SageMaker 训练和推理。"},{"l":"B","t":"使用网络隔离运行 SageMaker 训练和推理。"},{"l":"C","t":"通过使用 SageMaker 地理空间功能加密来加密静态数据。"},{"l":"D","t":"将适当的 AWS 身份和访问管理(IAM)角色与 SageMaker 作业相关联。"}],"a":["B"],"e":"**✅ 为什么 B.使用网络隔离运行 SageMaker 训练和推理对**：SageMaker 支持网络隔离模式（Network Isolation），训练和推理容器完全无法访问外部网络。满足\"没有互联网接入的隔离环境\"的法规要求。\n\n**❌ 为什么其他选项错**：\n- A.使用 SageMaker Experiments运行训练和推理：Experiments 用于实验管理和跟踪，不提供网络隔离\n- C.通过 SageMaker 地理空间功能加密来加密静态数据：地理空间功能处理地理数据，与网络隔离无关\n- D.将适当的 IAM 角色与 SageMaker 作业相关联：IAM 控制权限，不提供网络层面的隔离\n\n**📌 关键概念**：SageMaker 网络隔离 = 容器无法发出/接收任何网络调用。适用于合规要求严格的行业（金融、医疗、政府）。","s":"源#86"},{"id":"D1-040","d":1,"t":"single","q":"一个 ML 研究团队开发定制的 ML 模型。模型工件与其他团队共享,以便集成到产品和服务中。ML 团队保留模型训练代码和数据。 ML 团队想要建立一种机制,ML 团队可以用它来审计模型。 ML 团队在发布定制 ML 模型时应该使用哪种解决方案?","o":[{"l":"A","t":"用相关信息创建文档。将文档存储在Amazon S3。"},{"l":"B","t":"使用 AWS AI 服务卡来提高透明度和理解模型。"},{"l":"C","t":"创建 Amazon SageMaker 模型卡,包括预期用途、培训和推理细节。"},{"l":"D","t":"创建模型培训脚本。将模型训练脚本提交给 Git 存储库。"}],"a":["C"],"e":"**✅ 为什么 C.创建 Amazon SageMaker 模型卡,包括预期用途、培训和推理细节。 对**：SageMaker 模型卡以标准化方式记录模型的预期用途、训练数据、评估指标与推理细节，便于跨团队共享时审计模型，符合题干对审计机制的要求。\n\n**❌ 为什么其他选项错**：\n- A.用相关信息创建文档。将文档存储在Amazon S3。：S3 只存储文件，不提供结构化的模型元数据与审计框架，缺乏统一规范\n- B.使用 AWS AI 服务卡来提高透明度和理解模型。：AWS AI 服务卡描述的是 AWS 自身服务的透明度信息，不是为团队自研模型提供审计机制\n- D.创建模型培训脚本。将模型训练脚本提交给 Git 存储库。：Git 管的是代码版本，审计模型需要模型工件与元数据，单存训练脚本不足以支持审计\n\n**📌 关键概念**：模型卡（Model Card）是模型治理与文档化的标准载体，记录模型生命周期关键信息。SageMaker 支持模型卡与 Model Registry 配套实现版本管理与审计。","s":"源#87"},{"id":"D1-041","d":1,"t":"single","q":"一家软件公司为客户开发工具。该公司希望利用人工智能来提高软件开发效率。哪种解决方案能够满足这些要求?","o":[{"l":"A","t":"使用二进制分类模型来生成代码评审。"},{"l":"B","t":"在公司的开发者工具中安装代码推荐软件。"},{"l":"C","t":"安装代码预测工具来预测潜在的代码问题。"},{"l":"D","t":"使用自然语言处理(NLP)工具来生成代码。"}],"a":["D"],"e":"**✅ 为什么 D.使用自然语言处理(NLP)工具来生成代码。 对**：NLP 工具（如代码生成模型）能够理解自然语言需求并生成代码，直接提高软件开发效率，符合题干用 AI 提升开发效率的目标。\n\n**❌ 为什么其他选项错**：\n- A.使用二进制分类模型来生成代码评审。：分类模型输出类别标签，只能判断代码类别，不能生成代码\n- B.在公司的开发者工具中安装代码推荐软件。：代码推荐工具属于辅助输入建议，核心是提升效率方向，但该选项表述宽泛，不如 NLP 生成代码直切要求\n- C.安装代码预测工具来预测潜在的代码问题。：预测代码问题属于质量检测，与题干「提高开发效率」的目标不完全对应\n\n**📌 关键概念**：自然语言处理（NLP）包括文本理解与生成，代码生成是生成式 AI 的典型应用。AWS 上 Amazon Q Developer 提供代码补全与生成能力，属于 NLP 工具。","s":"源#88"},{"id":"D1-042","d":1,"t":"single","q":"一家零售店希望通过使用 Amazon SageMaker DeepAR 预测算法来预测未来几周特定产品的需求。哪种类型的数据符合这一要求?","o":[{"l":"A","t":"文本数据"},{"l":"B","t":"图像数据"},{"l":"C","t":"时间序列数据"},{"l":"D","t":"二进制数据"}],"a":["C"],"e":"**✅ 为什么 C.时间序列数据对**：DeepAR 是 SageMaker 的时间序列预测算法，专门处理按时间排列的数据点。\"预测未来几周的需求\"是典型的时间序列预测任务，需要历史时间序列数据作为输入。\n\n**❌ 为什么其他选项错**：\n- A.文本数据：DeepAR 不处理文本，它是数值时间序列预测算法\n- B.图像数据：图像数据用于计算机视觉，与时间序列预测无关\n- D.二进制数据：二进制数据不是 DeepAR 的输入格式\n\n**📌 关键概念**：DeepAR = 基于 RNN 的时间序列预测算法。输入：历史时间序列数据；输出：未来值的概率预测。适用于需求预测、库存规划等。","s":"源#89"},{"id":"D1-043","d":1,"t":"single","q":"一家大型零售银行希望开发一个 ML 系统来帮助风险管理团队针对不同的人口统计数据决定贷款分配。为了开发一个无偏的 ML 模型,银行必须做些什么?","o":[{"l":"A","t":"减少训练数据集的大小。"},{"l":"B","t":"确保 ML 模型预测与历史结果一致。"},{"l":"C","t":"为每个人口统计组创建不同的 ML 模型。"},{"l":"D","t":"测量训练数据集中的类别不平衡。相应地调整培训流程。"}],"a":["D"],"e":"**✅ 为什么 D.测量训练数据集中的类别不平衡。相应地调整培训流程对**：要开发无偏模型，首先需要检测训练数据中是否存在各人口统计组的不平衡（如某群体被拒贷比例过高）。发现不平衡后调整训练流程（重采样、样本权重等）来消除偏差。\n\n**❌ 为什么其他选项错**：\n- A.减少训练数据集的大小：减少数据可能加剧偏差\n- B.确保 ML 模型预测与历史结果一致：如果历史结果本身有偏，复制历史就是复制偏差\n- C.为每个人口统计组创建不同的 ML 模型：分别建模不解决偏差，还可能导致歧视性区别对待\n\n**📌 关键概念**：消除 ML 偏差的步骤——①检测数据不平衡 ②重采样/权重调整 ③使用 SageMaker Clarify 监控偏差指标。","s":"源#90"},{"id":"D1-044","d":1,"t":"single","q":"一家公司正在开发一款移动 ML 应用程序,使用手机摄像头来诊断和治疗昆虫叮咬。该公司希望通过使用来自世界各地不同性别、种族和地理位置的昆虫叮咬照片的多样化数据集来训练图像分类模型。在这个场景中,公司展示了负责任的人工智能的哪个原则?","o":[{"l":"A","t":"公平"},{"l":"B","t":"可解释性"},{"l":"C","t":"管理"},{"l":"D","t":"透明度"}],"a":["A"],"e":"**✅ 为什么 A.公平对**：使用来自不同性别、种族和地理位置的多样化数据集训练模型，确保模型对所有人群同等有效，不因人口统计特征而产生差异化表现。这正是\"公平性\"（Fairness）原则的体现。\n\n**❌ 为什么其他选项错**：\n- B.可解释性：可解释性关注模型决策过程是否可以被人理解，不涉及数据多样性\n- C.管理：治理关注AI的组织管理框架和流程\n- D.透明度：透明度关注模型工作方式是否公开可见\n\n**📌 关键概念**：负责任 AI 的公平性原则——确保 AI 系统对不同群体同等公正，避免因训练数据偏差导致歧视。多样化数据集是实现公平的基础。","s":"源#96"},{"id":"D1-045","d":1,"t":"single","q":"一家公司正在开发一个 ML 模型来进行贷款审批。公司必须实现一个解决方案来检测模型中的偏差。该公司还必须能够解释模型的预测。哪种解决方案能够满足这些要求?","o":[{"l":"A","t":"Amazon SageMaker Clarify"},{"l":"B","t":"Amazon SageMaker Data Wrangler"},{"l":"C","t":"Amazon SageMaker 模型卡"},{"l":"D","t":"AWS 人工智能服务卡"}],"a":["A"],"e":"**✅ 为什么 A.Amazon SageMaker Clarify 对**：SageMaker Clarify 同时提供两大功能：①偏差检测（训练前和训练后）②模型可解释性（使用 SHAP 值解释预测）。一个服务同时满足\"检测偏差\"和\"解释预测\"两个需求。\n\n**❌ 为什么其他选项错**：\n- B.Amazon SageMaker Data Wrangler：Data Wrangler 用于数据准备和转换\n- C.Amazon SageMaker 模型卡：Model Cards 记录模型信息，不主动检测偏差或提供可解释性分析\n- D.AWS 人工智能服务卡：AI Service Cards 是文档性质的，描述服务的公平性和限制\n\n**📌 关键概念**：SageMaker Clarify = 偏差检测 + 可解释性。使用 SHAP 值量化每个特征对预测的贡献度。","s":"源#97"},{"id":"D1-046","d":1,"t":"single","q":"一家公司通过使用 Amazon Bedrock开发了一个生成式文本摘要模型。该公司将使用Amazon Bedrock自动模型评估功能。公司应该使用哪个指标来评估模型的准确性?","o":[{"l":"A","t":"ROC 曲线下面积(AUC)得分"},{"l":"B","t":"F1 分数"},{"l":"C","t":"BERTScore"},{"l":"D","t":"真实世界知识(RWK)得分"}],"a":["C"],"e":"**✅ 为什么 C.BERTScore 对**：BERTScore 使用预训练语言模型计算生成文本与参考文本的语义相似度，适合评估文本摘要任务的质量。它能捕捉同义词和语义等价，比简单的词汇匹配更准确。\n\n**❌ 为什么其他选项错**：\n- A.ROC 曲线下面积(AUC)得分：AUC 用于二分类任务评估，不适合文本摘要\n- B.F1 分数：虽然也可用于文本任务，但 BERTScore 更适合生成式摘要的语义评估\n- D.真实世界知识(RWK)得分：RWK 评估模型的知识准确性，不是摘要质量指标\n\n**📌 关键概念**：文本生成评估指标——ROUGE（召回导向的摘要评估）、BLEU（翻译质量）、BERTScore（语义相似度）。Bedrock 自动评估支持这些指标。","s":"源#98"},{"id":"D1-047","d":1,"t":"single","q":"一个人工智能实践者想要基于花瓣长度、花瓣宽度、萼片长度和萼片宽度来预测花的分类。哪种算法符合这些要求?","o":[{"l":"A","t":"k-最近邻(k-NN)"},{"l":"B","t":"k 均值"},{"l":"C","t":"自回归综合移动平均(ARIMA)"},{"l":"D","t":"线性回归"}],"a":["A"],"e":"**✅ 为什么 A.k-最近邻(k-NN) 对**：k-NN 是一种简单有效的分类算法，基于特征空间中最近的 k 个邻居的类别进行投票决定新样本的分类。对于鸢尾花分类这种经典的多特征分类问题非常适合。\n\n**❌ 为什么其他选项错**：\n- B.k 均值：K-Means 是无监督聚类算法，不是分类算法（没有标签指导）\n- C.自回归综合移动平均(ARIMA)：ARIMA 用于时间序列预测，不做分类\n- D.线性回归：线性回归预测连续值，不适合离散类别预测\n\n**📌 关键概念**：k-NN = 分类（有标签的监督学习）；K-Means = 聚类（无标签的无监督学习）。两者容易混淆但本质不同。","s":"源#99"},{"id":"D1-048","d":1,"t":"single","q":"一家公司正在开发一个 ML 模型来预测客户流失。该模型在训练数据集上表现良好,但不能准确预测新数据的流失。哪个解决方案可以解决这个问题?","o":[{"l":"A","t":"减小正则化参数以增加模型复杂性。"},{"l":"B","t":"增加正则化参数以降低模型复杂性。"},{"l":"C","t":"向输入数据添加更多要素。"},{"l":"D","t":"为更多的纪元训练模型。"}],"a":["B"],"e":"**✅ 为什么 B.增加正则化参数以降低模型复杂性对**：训练数据表现好但新数据差 = 过拟合。增加正则化（L1/L2 正则化）会惩罚过大的模型权重，降低模型复杂度，减少过拟合，提升泛化能力。\n\n**❌ 为什么其他选项错**：\n- A.减小正则化参数以增加模型复杂性：减小正则化会增加过拟合，问题更严重\n- C.向输入数据添加更多要素：添加更多特征可能增加过拟合风险\n- D.为更多的纪元训练模型：更多训练轮次可能加剧过拟合\n\n**📌 关键概念**：过拟合→增加正则化/减少模型复杂度/增加数据量；欠拟合→减少正则化/增加模型复杂度/增加特征。","s":"源#105"},{"id":"D1-049","d":1,"t":"single","q":"一家金融机构正在构建一个人工智能解决方案,通过使用基础模型(FM)来做出贷款审批决策。出于安全和审计的目的,公司需要人工智能解决方案的决策是可解释的。哪个因素与人工智能解决方案决策的可解释性有关?","o":[{"l":"A","t":"模型复杂性"},{"l":"B","t":"训练时间"},{"l":"C","t":"超参数数量"},{"l":"D","t":"部署时间"}],"a":["A"],"e":"**✅ 为什么 A.模型复杂性对**：模型复杂性直接影响可解释性——越简单的模型（如线性回归、决策树）越容易解释；越复杂的模型（如深度神经网络、大型 FM）越难解释其决策过程。金融审计需要可解释性，因此模型复杂性是关键考量因素。\n\n**❌ 为什么其他选项错**：\n- B.训练时间：训练时间是效率指标，不影响模型决策的可解释性\n- C.超参数数量：超参数数量影响训练配置，不直接决定模型输出的可解释性\n- D.部署时间：部署时间是运维指标，与可解释性无关\n\n**📌 关键概念**：可解释性与模型复杂性反相关。金融/医疗/法律等受监管领域优先选择可解释模型，或使用 SHAP/LIME 等工具解释复杂模型。","s":"源#107"},{"id":"D1-050","d":1,"t":"single","q":"一家制药公司希望分析用户对新药的评论,并提供每种药物的简要概述。哪种解决方案符合这些要求?","o":[{"l":"A","t":"使用 Amazon Personalize 创建一个时间序列预测模型来分析药物评论。"},{"l":"B","t":"使用 Amazon Bedrock大型语言模型(LLM)创建药物审查摘要。"},{"l":"C","t":"使用 Amazon SageMaker 创建一个分类模型,将药物分为不同的组。"},{"l":"D","t":"使用 Amazon Rekognition 创建药物审查摘要。"}],"a":["B"],"e":"**✅ 为什么 B.使用 Amazon Bedrock大型语言模型(LLM)创建药物审查摘要对**：LLM 的核心能力包括文本摘要——可以分析大量评论文本并生成简洁概述。Amazon Bedrock 提供现成的 LLM 来完成此任务。\n\n**❌ 为什么其他选项错**：\n- A.使用 Amazon Personalize 创建时间序列预测模型来分析药物评论：Personalize 做推荐，不做文本摘要\n- C.使用 Amazon SageMaker 创建分类模型将药物分为不同的组：分类模型分组但不生成摘要\n- D.使用 Amazon Rekognition 创建药物审查摘要：Rekognition 处理图像/视频，不处理文本\n\n**📌 关键概念**：文本摘要 = LLM 的核心能力。Amazon Bedrock 提供多种 LLM 可直接用于摘要生成任务。","s":"源#108"},{"id":"D1-051","d":1,"t":"single","q":"一家公司希望为其员工构建一个线索优先级应用程序来联系潜在客户。该应用程序必须让员工能够根据领域知识和专业技能查看和调整分配给模型中不同变量的权重。哪种 ML 型号符合这些要求？","o":[{"l":"A","t":"逻辑回归模型"},{"l":"B","t":"基于主成分的深度学习模型"},{"l":"C","t":"k-最近邻模型"},{"l":"D","t":"神经网络"}],"a":["A"],"e":"**✅ 为什么 A.逻辑回归模型对**：逻辑回归模型的权重直接对应每个变量的重要性，透明且可调整。员工可以查看和理解每个特征的权重，并根据领域知识手动调整，实现\"人在回路\"的决策。\n\n**❌ 为什么其他选项错**：\n- B.基于主成分的深度学习模型：深度学习模型权重不可直接解释和手动调整\n- C.k-最近邻模型：k-NN 没有显式的特征权重可供调整\n- D.神经网络：神经网络权重复杂且不可直观解释\n\n**📌 关键概念**：逻辑回归 = 高可解释性 + 可调整权重。适合需要人工审查和干预的业务场景。","s":"源#109"},{"id":"D1-052","d":1,"t":"single","q":"哪种策略将决定基础模型(FM)是否有效地满足业务目标？","o":[{"l":"A","t":"在基准数据集上评估模型的性能。"},{"l":"B","t":"分析模型的架构和超参数。"},{"l":"C","t":"评估模型与特定用例的一致性。"},{"l":"D","t":"测量模型部署所需的计算资源。"}],"a":["C"],"e":"**✅ 为什么 C.评估模型与特定用例的一致性对**：判断 FM 是否满足业务目标的关键是评估模型输出是否与具体业务用例的需求一致——即模型能否解决实际业务问题。\n\n**❌ 为什么其他选项错**：\n- A.在基准数据集上评估模型的性能：基准性能不等于业务适配性\n- B.分析模型的架构和超参数：技术分析不直接反映业务价值\n- D.测量模型部署所需的计算资源：资源需求是成本考量，不是业务目标达成度\n\n**📌 关键概念**：FM 选型的业务导向——先确定用例需求，再评估模型是否满足。技术指标（性能、成本）服务于业务目标。","s":"源#110"},{"id":"D1-053","d":1,"t":"single","q":"一家公司需要训练一个 ML 模型来对不同类型动物的图像进行分类。该公司有一个大数据集的标签图像，不会标签更多的数据。公司应该用哪种类型的学习来训练模型？","o":[{"l":"A","t":"监督学习"},{"l":"B","t":"无监督学习"},{"l":"C","t":"强化学习"},{"l":"D","t":"主动学习"}],"a":["A"],"e":"**✅ 为什么 A.监督学习对**：公司有\"大数据集的标签图像\"——标记数据是监督学习的前提。图像分类是典型的监督学习分类任务：用标记的图像-类别对训练模型学习输入到输出的映射。\n\n**❌ 为什么其他选项错**：\n- B.无监督学习：无监督学习用于无标签数据，但题目明确说有标签数据\n- C.强化学习：强化学习通过奖惩学习策略，不适合图像分类\n- D.主动学习：主动学习是在标签不足时选择性标注的策略，题目说已有充足标签\n\n**📌 关键概念**：有标签数据 + 分类/回归任务 = 监督学习。监督学习需要的是（输入, 标签）对。","s":"源#111"},{"id":"D1-054","d":1,"t":"single","q":"ML 生命周期的哪个阶段决定了合规性和法规要求？","o":[{"l":"A","t":"特征工程"},{"l":"B","t":"模特培训"},{"l":"C","t":"数据收集"},{"l":"D","t":"业务目标识别"}],"a":["D"],"e":"**✅ 为什么 D.业务目标识别对**：合规性和法规要求在项目最初的业务目标识别阶段就应确定。这一阶段定义了 ML 系统必须遵守的法律法规约束，影响后续所有设计决策。\n\n**❌ 为什么其他选项错**：\n- A.特征工程：特征工程是技术实现阶段，合规要求应更早确定\n- B.模特培训：训练阶段不是确定合规要求的时机\n- C.数据收集：数据收集受合规约束，但合规要求本身在更早阶段确定\n\n**📌 关键概念**：ML 项目始于业务目标定义，包括明确法规合规要求（GDPR、HIPAA等）、公平性要求、可解释性要求等。这些约束贯穿整个生命周期。","s":"源#112"},{"id":"D1-055","d":1,"t":"single","q":"一家食品服务公司希望开发一种 ML 模型，以帮助减少日常食物浪费并增加销售收入。该公司需要不断提高模型的准确性。哪种解决方案符合这些要求？","o":[{"l":"A","t":"使用 Amazon SageMaker，用更新的数据迭代。"},{"l":"B","t":"使用Amazon Personalize和迭代历史数据。"},{"l":"C","t":"使用Amazon CloudWatch 分析客户订单。"},{"l":"D","t":"使用 Amazon Rekognition 优化模型。"}],"a":["A"],"e":"**✅ 为什么 A.使用 Amazon SageMaker，用更新的数据迭代对**：持续改进模型准确性需要用最新数据不断重新训练（迭代）。SageMaker 提供完整的 ML 训练管道，支持持续用新数据迭代训练模型。\n\n**❌ 为什么其他选项错**：\n- B.使用Amazon Personalize和迭代历史数据：Personalize 用于推荐系统，不是通用预测模型工具\n- C.使用Amazon CloudWatch 分析客户订单：CloudWatch 是监控工具，不做 ML 训练\n- D.使用 Amazon Rekognition 优化模型：Rekognition 是图像分析服务，不适用于食品需求预测\n\n**📌 关键概念**：持续改进 ML 模型 = 用新数据定期重新训练。SageMaker Pipelines 支持自动化的 ML 迭代流程。","s":"源#113"},{"id":"D1-056","d":1,"t":"single","q":"一家公司开发了一个 ML 模型来预测房地产销售价格。该公司希望部署该模型来进行预测，而无需管理服务器或基础设施。哪种解决方案符合这些要求？","o":[{"l":"A","t":"在 Amazon EC2 实例上部署模型。"},{"l":"B","t":"在 Amazon EKS集群上部署该模型。"},{"l":"C","t":"通过使用 Amazon CloudFront 和 Amazon S3 集成来部署模型。"},{"l":"D","t":"使用 Amazon SageMaker Endpoint部署模型。"}],"a":["D"],"e":"**✅ 为什么 D.使用 Amazon SageMaker Endpoint部署模型对**：SageMaker Endpoint是托管式推理服务，AWS 负责管理底层服务器和基础设施。用户只需部署模型即可获得预测 API，无需管理计算资源。\n\n**❌ 为什么其他选项错**：\n- A.在 Amazon EC2 实例上部署模型：EC2 需要用户自行管理服务器\n- B.在 Amazon EKS 集群上部署：EKS 需要管理 Kubernetes 集群基础设施\n- C.通过 CloudFront 和 S3 集成来部署模型：这是静态内容分发方案，不能执行 ML 推理\n\n**📌 关键概念**：SageMaker Endpoint = 无需管理基础设施的托管推理。AWS 自动处理实例预置、扩缩容、健康检查等运维工作。","s":"源#114"},{"id":"D1-057","d":1,"t":"single","q":"一家公司希望开发一个人工智能应用程序，以帮助其员工检查开放的客户索赔，确定特定索赔的细节，并访问索赔的文档。哪种解决方案符合这些要求？","o":[{"l":"A","t":"使用带有 Amazon Fraud Detector 的 Amazon Bedrock Agents来构建应用程序。"},{"l":"B","t":"使用 Amazon Bedrock Agents和 Amazon Bedrock Knowledge Bases来构建应用程序。"},{"l":"C","t":"使用 Amazon Personalize 和 Amazon Bedrock Knowledge Bases来构建应用程序。"},{"l":"D","t":"使用 Amazon SageMaker 通过训练新的 ML 模型来构建应用程序。"}],"a":["B"],"e":"**✅ 为什么 B.使用 Amazon Bedrock Agents和 Amazon Bedrock Knowledge Bases来构建应用程序。 对**：Bedrock Agents 负责规划任务与调用工具，Knowledge Bases 提供基于客户索赔文档的检索增强生成（RAG），使应用能查阅文档、确定细节，直接满足检查索赔与访问文档的要求。\n\n**❌ 为什么其他选项错**：\n- A.使用带有 Amazon Fraud Detector 的 Amazon Bedrock Agents来构建应用程序。：Fraud Detector 是欺诈检测服务，与检查索赔、访问文档的场景不符\n- C.使用 Amazon Personalize 和 Amazon Bedrock Knowledge Bases来构建应用程序。：Personalize 提供个性化推荐，不承担文档检索与智能问答的角色\n- D.使用 Amazon SageMaker 通过训练新的 ML 模型来构建应用程序。：从零训练模型成本高、周期长，现有 Bedrock 知识库与 Agent 即可满足，不是最优方案\n\n**📌 关键概念**：RAG（检索增强生成）让大模型基于企业私有文档回答，Bedrock Knowledge Bases 提供知识库存储与检索，Agents 负责编排多步任务。","s":"源#115"},{"id":"D1-058","d":1,"t":"single","q":"一家制造公司使用人工智能来检查产品，并找出任何损坏或缺陷。公司正在使用哪种类型的 AI 应用程序？","o":[{"l":"A","t":"推荐系统"},{"l":"B","t":"自然语言处理"},{"l":"C","t":"计算机视觉投票最多"},{"l":"D","t":"图像处理"}],"a":["C"],"e":"**✅ 为什么 C.计算机视觉投票最多对**：使用 AI 检查产品的损坏和缺陷是典型的计算机视觉应用——通过分析产品图像自动识别缺陷。这属于视觉缺陷检测/质量检测领域。\n\n**❌ 为什么其他选项错**：\n- A.推荐系统：推荐系统基于用户行为推荐内容/商品，与缺陷检测无关\n- B.自然语言处理：NLP 处理文本数据，不处理产品图像\n- D.图像处理：图像处理是底层技术（如滤波、增强），不是 AI 应用类型的准确描述\n\n**📌 关键概念**：计算机视觉在制造业的应用——质量检测、缺陷识别、尺寸测量。AWS 服务如 Amazon Lookout for Vision 专门用于此场景。","s":"源#116"},{"id":"D1-059","d":1,"t":"single","q":"一家公司想要创建一个 ML 模型来预测客户满意度。该公司需要完全自动化的模型调整。哪种 AWS 服务符合这些要求？","o":[{"l":"A","t":"Amazon Personalize"},{"l":"B","t":"Amazon SageMaker"},{"l":"C","t":"Amazon Athena"},{"l":"D","t":"Amazon Comprehend"}],"a":["B"],"e":"**✅ 为什么 B.Amazon SageMaker 对**：SageMaker 提供自动超参数调优（Automatic Model Tuning），可以自动搜索最佳超参数组合来优化模型性能，实现\"完全自动化的模型调整\"。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Personalize：Personalize 是推荐系统服务，不提供通用模型调优\n- C.Amazon Athena：Athena 是 SQL 查询服务，不是 ML 工具\n- D.Amazon Comprehend：Comprehend 是 NLP 文本分析服务，不做模型调优\n\n**📌 关键概念**：SageMaker Automatic Model Tuning = 超参数优化（HPO），使用贝叶斯优化等方法自动找到最佳超参数。","s":"源#117"},{"id":"D1-060","d":1,"t":"single","q":"在后处理 ML 生命周期中，公司可以使用哪种技术来降低生成式人工智能应用中的偏差和毒性？","o":[{"l":"A","t":"循环中的人类"},{"l":"B","t":"数据扩充"},{"l":"C","t":"特征工程"},{"l":"D","t":"对抗训练"}],"a":["A"],"e":"**✅ 为什么 A.循环中的人类对**：人在回路（Human-in-the-Loop）是在 ML 后处理阶段降低偏差和毒性的有效技术——人工审核模型输出，标记不当内容，反馈用于改进模型。这是 RLHF 的基础。\n\n**❌ 为什么其他选项错**：\n- B.数据扩充：数据扩充在训练数据准备阶段使用，不是后处理技术\n- C.特征工程：特征工程在模型训练前进行，不是后处理\n- D.对抗训练：对抗训练在模型训练阶段使用，不是后处理环节\n\n**📌 关键概念**：后处理阶段的偏差缓解——人在回路审核、内容过滤器（Guardrails）、输出重排序。Human-in-the-Loop 确保人类对 AI 输出进行质量把关。","s":"源#118"},{"id":"D1-061","d":1,"t":"single","q":"一家电子商务公司希望通过为每个用户定制结果来改善搜索引擎推荐，提升公司电子商务平台的搜索体验。哪个 AWS 服务满足这些要求？","o":[{"l":"A","t":"Amazon Personalize"},{"l":"B","t":"Amazon Kendra"},{"l":"C","t":"Amazon Rekognition"},{"l":"D","t":"Amazon Transcribe"}],"a":["A"],"e":"**✅ 为什么 A.Amazon Personalize 对**：Amazon Personalize 专门用于构建个性化推荐系统，可以根据用户行为和偏好为每个用户定制搜索结果和产品推荐。\n\n**❌ 为什么其他选项错**：\n- B.Amazon Kendra：Kendra 是企业搜索服务，侧重文档搜索而非电商个性化推荐\n- C.Amazon Rekognition：Rekognition 是图像/视频分析服务，不做推荐\n- D.Amazon Transcribe：Transcribe 是语音转文字服务，不做推荐\n\n**📌 关键概念**：Amazon Personalize = 个性化推荐引擎。支持实时推荐、个性化排序、相关商品推荐等电商核心场景。","s":"源#121"},{"id":"D1-062","d":1,"t":"single","q":"一家公司正在为有视觉障碍的用户构建移动应用。该应用程序必须能够听到用户所说的话并提供语音响应。哪个解决方案能满足这些要求？","o":[{"l":"A","t":"使用深度学习神经网络进行语音识别。"},{"l":"B","t":"构建机器学习模型以搜索数字数据中的模式。"},{"l":"C","t":"使用生成式人工智能摘要生成类人文本。"},{"l":"D","t":"构建自定义模型进行图像分类和识别。"}],"a":["A"],"e":"**✅ 为什么 A.使用深度学习神经网络进行语音识别对**：应用需要\"听到用户说话\"（语音识别）并\"提供语音响应\"（语音合成）。深度学习神经网络是现代语音识别的核心技术，如 ASR（自动语音识别）系统。\n\n**❌ 为什么其他选项错**：\n- B.构建机器学习模型以搜索数字数据中的模式：数据模式搜索不涉及语音交互\n- C.使用生成式人工智能摘要生成类人文本：文本摘要不是语音交互功能\n- D.构建自定义模型进行图像分类和识别：图像处理不满足语音交互需求\n\n**📌 关键概念**：语音交互 = 语音识别（ASR，如 Transcribe）+ 自然语言理解 + 语音合成（TTS，如 Polly）。深度学习驱动现代 ASR 系统。","s":"源#126"},{"id":"D1-063","d":1,"t":"single","q":"一家公司希望通过使用最新数据来保持其基础模型（FM）的相关性。该公司希望实施一种模型训练策略，包括对 FM 的定期更新哪个解决方案满足这些要求？","o":[{"l":"A","t":"批量学习"},{"l":"B","t":"持续预训练"},{"l":"C","t":"静态训练"},{"l":"D","t":"潜在训练"}],"a":["B"],"e":"**✅ 为什么 B.持续预训练对**：持续预训练（Continued Pre-training）是定期用新数据对 FM 进行额外预训练的策略，使模型知识保持最新。这与\"使用最新数据定期更新FM\"的需求完全匹配。\n\n**❌ 为什么其他选项错**：\n- A.批量学习：批量学习是一次性训练方式，不强调持续更新\n- C.静态训练：静态训练意味着训练一次后不再更新，与需求相反\n- D.潜在训练：不是标准ML术语\n\n**📌 关键概念**：持续预训练 vs 微调——持续预训练用大量新数据更新模型通用知识；微调用小量特定数据适配特定任务。两者可结合使用。","s":"源#128"},{"id":"D1-064","d":1,"t":"single","q":"一家公司希望根据客户的人口统计和购买模式为其客户 nd 组。公司应该使用哪个算法来满足这一要求？","o":[{"l":"A","t":"K-近邻（k-NN）"},{"l":"B","t":"K-均值"},{"l":"C","t":"决策树"},{"l":"D","t":"支持向量机"}],"a":["B"],"e":"**✅ 为什么 B.K-均值对**：K-Means 是经典的聚类算法，将数据点根据相似性分成 K 个组。\"根据人口统计和购买模式将客户分组\"是典型的客户细分任务，属于无监督聚类。\n\n**❌ 为什么其他选项错**：\n- A.K-近邻（k-NN）：k-NN 是分类算法（监督学习），需要标签，不是聚类\n- C.决策树：决策树是分类/回归算法（监督学习），不做无标签分群\n- D.支持向量机：SVM 是分类算法（监督学习），不做聚类\n\n**📌 关键概念**：客户分群/分组 = 聚类 = K-Means（无监督）。客户分类（已知类别标签）= k-NN/决策树/SVM（监督）。","s":"源#131"},{"id":"D1-065","d":1,"t":"single","q":"当客户打电话给客户服务中心时，公司的员工向客户提供产品说明和推荐。这些建议基于客户所在的位置。该公司希望使用基础模型(FMs)来自动化这一过程。哪种 AWS 服务符合这些要求？","o":[{"l":"A","t":"Amazon Macie"},{"l":"B","t":"Amazon Transcribe"},{"l":"C","t":"Amazon Bedrock"},{"l":"D","t":"Amazon Textract"}],"a":["C"],"e":"**✅ 为什么 C.Amazon Bedrock 对**：Amazon Bedrock 提供基础模型平台，支持构建基于 FM 的应用程序。结合知识库和提示工程，可以根据客户位置信息自动提供产品说明和推荐。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Macie：Macie 用于 S3 数据的敏感信息发现，不提供 FM 功能\n- B.Amazon Transcribe：Transcribe 做语音转文字，不是 FM 平台\n- D.Amazon Textract：Textract 从文档提取文本，不是 FM 应用平台\n\n**📌 关键概念**：Amazon Bedrock = FM 平台，用于构建各种生成式 AI 应用（聊天、推荐、摘要等）。支持 RAG、知识库集成。","s":"源#134"},{"id":"D1-066","d":1,"t":"single","q":"一家公司希望将客户服务电子邮件消息上传到Amazon S3，以开发业务分析应用程序。这些消息有时包含敏感数据。该公司希望在每次发现敏感信息时收到警报。哪种解决方案能够以最少的开发工作自动化敏感信息检测过程？","o":[{"l":"A","t":"配置Amazon Macie 以检测上传到Amazon S3 的文档中的敏感信息。"},{"l":"B","t":"使用Amazon SageMaker Endpoint部署大型语言模型（LLM）以编辑敏感数据。"},{"l":"C","t":"开发多个正则表达式模式以检测敏感数据。在Amazon SageMaker 笔记本上公开正则表达式模式。"},{"l":"D","t":"要求客户避免在电子邮件消息中分享敏感信息。"}],"a":["A"],"e":"**✅ 为什么 A.配置Amazon Macie 以检测上传到Amazon S3 的文档中的敏感信息对**：Amazon Macie 使用 ML 自动发现和保护 S3 中的敏感数据（PII、财务信息等）。配置简单，自动扫描新上传文件，发现敏感信息时自动告警。开发工作量最少。\n\n**❌ 为什么其他选项错**：\n- B.使用 SageMaker Endpoint部署 LLM 以编辑敏感数据：需要自行部署和管理模型，开发工作量大\n- C.开发多个正则表达式模式来检测敏感数据：需要手动编写和维护规则，工作量大且覆盖不全\n- D.要求客户避免在电子邮件消息中分享敏感信息：不是技术方案，无法强制执行\n\n**📌 关键概念**：Amazon Macie = S3 数据的自动敏感信息发现。零代码配置，ML 驱动，自动检测 PII、金融数据等。","s":"源#135"},{"id":"D1-067","d":1,"t":"single","q":"使用 Amazon SageMaker Model Cards 记录 AI 模型有哪些好处？","o":[{"l":"A","t":"提供一个视觉上吸引人的模型功能总结。"},{"l":"B","t":"标准化关于模型目的、性能和局限性的信息。"},{"l":"C","t":"降低模型的整体计算需求。"},{"l":"D","t":"物理存储模型用于档案目的。"}],"a":["B"],"e":"**✅ 为什么 B.标准化关于模型目的、性能和局限性的信息对**：SageMaker Model Cards 提供标准化模板，记录模型的预期用途、性能指标、限制条件等关键信息，确保模型文档的一致性和完整性。\n\n**❌ 为什么其他选项错**：\n- A.提供一个视觉上吸引人的模型功能总结：Model Cards 注重信息完整性而非视觉吸引力\n- C.降低模型的整体计算需求：文档记录不影响计算需求\n- D.物理存储模型用于档案目的：Model Cards 是信息记录，不是物理存储模型文件\n\n**📌 关键概念**：SageMaker Model Cards = 模型文档化工具。记录：模型用途、训练细节、评估结果、偏差信息、使用限制等。支持模型治理和合规审计。","s":"源#136"},{"id":"D1-068","d":1,"t":"single","q":"一家公司部署了一个 AI/ML 解决方案，帮助客户服务代理回答常见的。这些可能会随着时间的推移而变化。该公司希望赋予客户服务代理提问和自动生成常见客户答案的能力。哪种策略能最经济高效地满足这些需求？","o":[{"l":"A","t":"定期微调模型。"},{"l":"B","t":"使用上下文数据训练模型。"},{"l":"C","t":"使用上下文数据对模型进行预训练和基准测试。"},{"l":"D","t":"使用检索增强生成 (RAG) 和快速工程技术。"}],"a":["D"],"e":"**✅ 为什么 D.使用检索增强生成 (RAG) 和快速工程技术对**：RAG 从外部知识库实时检索最新信息作为上下文，结合提示工程生成答案。当信息\"随时间变化\"时，只需更新知识库内容，无需重新训练模型，最经济高效。\n\n**❌ 为什么其他选项错**：\n- A.定期微调模型：微调需要准备训练数据和计算资源，成本高且更新慢\n- B.使用上下文数据训练模型：从零训练成本更高\n- C.使用上下文数据对模型进行预训练和基准测试：预训练成本极高\n\n**📌 关键概念**：RAG = 实时知识更新的最佳方案。优势：无需重新训练模型，只需更新知识库；成本低；信息始终最新。","s":"源#138"},{"id":"D1-069","d":1,"t":"single","q":"一家公司希望使用机器学习模型来识别社交媒体帖子评论部分中的有害语言。该公司不会使用带标签的数据来训练模型。公司应该使用哪种策略来识别有害语言？","o":[{"l":"A","t":"使用 Amazon Rekognition 审核。"},{"l":"B","t":"使用 Amazon Comprehend 毒性检测。"},{"l":"C","t":"使用 Amazon SageMaker 内置算法来训练模型。"},{"l":"D","t":"使用 Amazon Polly 监控评论。"}],"a":["B"],"e":"**✅ 为什么 B.使用 Amazon Comprehend 毒性检测对**：Amazon Comprehend 提供开箱即用的毒性检测功能，无需自行训练模型或准备标注数据。直接调用 API 即可检测文本中的有害内容。\n\n**❌ 为什么其他选项错**：\n- A.使用 Amazon Rekognition 审核：Rekognition 处理图像/视频内容审核，不处理文本\n- C.使用 Amazon SageMaker 内置算法来训练模型：内置算法需要训练数据，但题目说不用标签数据\n- D.使用 Amazon Polly 监控评论：Polly 是文本转语音服务，不做内容审核\n\n**📌 关键概念**：Amazon Comprehend 的毒性检测 = 预训练 API，无需自己准备标注数据或训练模型。检测仇恨、威胁、侮辱等有害内容。","s":"源#141"},{"id":"D1-070","d":1,"t":"single","q":"一家媒体公司想要分析观众行为和人口统计学，以推荐个性化内容。该公司想要在其生产环境中部署一个定制的机器学习模型。该公司还想观察模型质量是否随时间推移而发生变化。哪些 AWS 服务或功能满足这些要求？","o":[{"l":"A","t":"Amazon Rekognition"},{"l":"B","t":"Amazon SageMaker Clarify"},{"l":"C","t":"Amazon Comprehend"},{"l":"D","t":"Amazon SageMaker Model Monitor"}],"a":["D"],"e":"**✅ 为什么 D.Amazon SageMaker Model Monitor对**：SageMaker Model Monitor 持续监控生产中模型的质量变化，检测数据漂移和模型性能退化。满足\"观察模型质量是否随时间推移而变化\"的需求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Rekognition：图像分析服务，不做模型质量监控\n- B.Amazon SageMaker Clarify：Clarify 做偏差检测和可解释性，不是持续质量监控\n- C.Amazon Comprehend：NLP 文本分析服务，不监控模型质量\n\n**📌 关键概念**：SageMaker Model Monitor = 生产模型的持续监控。检测：数据漂移、模型质量退化、偏差变化。自动触发告警。","s":"源#142"},{"id":"D1-071","d":1,"t":"single","q":"一家公司正在使用 AWS 服务部署 AI/ML 模型。该公司希望提高模型决策过程的透明度，并为模型输出提供解释。哪些 AWS 服务或功能满足这些要求？","o":[{"l":"A","t":"Amazon SageMaker 模型卡"},{"l":"B","t":"Amazon Rekognition"},{"l":"C","t":"Amazon Comprehend"},{"l":"D","t":"Amazon Lex"}],"a":["A"],"e":"**✅ 为什么 A.Amazon SageMaker 模型卡对**：SageMaker Model Cards 记录模型的决策流程、性能指标、使用限制等信息，提升透明度。配合 Clarify 的可解释性报告，为模型输出提供解释依据。\n\n**❌ 为什么其他选项错**：\n- B.Amazon Rekognition：图像分析服务，不提供模型透明度工具\n- C.Amazon Comprehend：NLP 服务，不提供通用模型解释功能\n- D.Amazon Lex：对话机器人服务，不提供模型透明度\n\n**📌 关键概念**：模型透明度 = Model Cards（文档化决策流程）+ Clarify（SHAP可解释性）。两者配合实现完整的透明度和可解释性。","s":"源#143"},{"id":"D1-072","d":1,"t":"single","q":"一家制造公司想要用多种语言创建产品描述。哪种 AWS 服务可以自动执行此任务？","o":[{"l":"A","t":"Amazon Translate"},{"l":"B","t":"Amazon Transcribe"},{"l":"C","t":"Amazon Kendra"},{"l":"D","t":"Amazon Polly"}],"a":["A"],"e":"**✅ 为什么 A.Amazon Translate 对**：Amazon Translate 是 AWS 的机器翻译服务，能将文本自动翻译成多种语言，产品描述这类文本化内容的自动翻译任务由它完成。\n\n**❌ 为什么其他选项错**：\n- B.Amazon Transcribe：Transcribe 是语音转文字服务，将音频转为文本，与文本翻译无关\n- C.Amazon Kendra：Kendra 是企业搜索服务，提供语义搜索与问答，不具备文本翻译能力\n- D.Amazon Polly：Polly 是文字转语音服务，将文本朗读为音频，方向与翻译相反\n\n**📌 关键概念**：Amazon Translate 为自动翻译服务，支持批量与实时翻译，属于 AI 服务的自然语言处理范畴，常与 Polly（语音合成）配套使用。","s":"源#144"},{"id":"D1-073","d":1,"t":"single","q":"哪个 AWS 特性记录了用于治理和报告的 ML 实例数据的详细信息？","o":[{"l":"A","t":"Amazon SageMaker 模型卡"},{"l":"B","t":"Amazon SageMaker Debugger"},{"l":"C","t":"Amazon SageMaker 模型监视器"},{"l":"D","t":"Amazon SageMaker JumpStart"}],"a":["A"],"e":"**✅ 为什么 A.Amazon SageMaker 模型卡 对**：SageMaker 模型卡记录模型预期用途、训练数据、评估指标等关键元数据，为治理与报告提供结构化依据，满足题干记录模型详细信息的要求。\n\n**❌ 为什么其他选项错**：\n- B.Amazon SageMaker Debugger：Debugger 用于监控训练过程并捕获训练指标与系统资源使用情况，不是记录模型元数据的治理工具\n- C.Amazon SageMaker 模型监视器：模型监视器监控生产环境中数据漂移与预测质量，属于运行监测，不承担文档记录\n- D.Amazon SageMaker JumpStart：JumpStart 提供预训练模型与部署方案，用于快速上手，不记录模型治理信息\n\n**📌 关键概念**：模型卡（Model Card）是模型治理与报告的标准形式，SageMaker Model Cards 记录模型全生命周期信息，配合 Model Registry 实现版本与治理管理。","s":"源#145"},{"id":"D1-074","d":1,"t":"single","q":"一家金融公司正在使用 ML 来帮助完成公司的一些任务。哪个选项使用了生成式人工智能模型？","o":[{"l":"A","t":"总结客户投诉"},{"l":"B","t":"根据产品用途对客户进行分类"},{"l":"C","t":"根据投资类型对客户进行细分"},{"l":"D","t":"预测某些产品的收入"}],"a":["A"],"e":"**✅ 为什么 A.总结客户投诉 对**：生成式 AI 模型擅长生成新内容，总结客户投诉是把长文本压缩为简明摘要，属于典型的文本生成任务，符合生成式人工智能模型的能力范围。\n\n**❌ 为什么其他选项错**：\n- B.根据产品用途对客户进行分类：分类是判别式任务，输出类别标签，不属于生成新内容\n- C.根据投资类型对客户进行细分：细分基于规则或聚类，输出的是分组结果而非生成内容\n- D.预测某些产品的收入：收入预测是回归任务，输出数值，不属于生成式任务\n\n**📌 关键概念**：生成式 AI（Generative AI）生成文本、图像、音频等新内容，判别式任务则输出标签或数值；摘要、翻译、代码生成属于生成式典型场景。","s":"源#146"},{"id":"D1-075","d":1,"t":"single","q":"一家医疗公司希望开发一种可以访问结构化患者记录、提取相关信息并生成简明摘要的 AI 应用程序。哪种解决方案能够满足这些要求？","o":[{"l":"A","t":"使用 Amazon understand Medical 提取相关的医疗实体和关系。将基于规则的逻辑应用于摘要的结构和格式。"},{"l":"B","t":"使用 Amazon Personalize 分析患者参与模式。将输出与通用文本摘要工具集成。"},{"l":"C","t":"使用 Amazon Textract 将扫描文档转换为数字文本。设计一个关键词提取系统来生成摘要。"},{"l":"D","t":"实现 Amazon Kendra，为医疗记录提供可搜索的索引。使用基于模板的系统来格式化摘要。"}],"a":["A"],"e":"**✅ 为什么 A.使用 Amazon understand Medical 提取相关的医疗实体和关系。将基于规则的逻辑应用于摘要的结构和格式。 对**：题干原文「Amazon understand Medical」应为 Amazon Comprehend Medical，该服务从非结构化文本提取医疗实体与关系，配合基于规则的逻辑组织摘要结构，满足提取与摘要需求。\n\n**❌ 为什么其他选项错**：\n- B.使用 Amazon Personalize 分析患者参与模式。将输出与通用文本摘要工具集成。：Personalize 是推荐服务，不能提取医疗实体或组织摘要\n- C.使用 Amazon Textract 将扫描文档转换为数字文本。设计一个关键词提取系统来生成摘要。：Textract 只能做 OCR 提取文本，关键词提取生成的摘要质量不可靠\n- D.实现 Amazon Kendra，为医疗记录提供可搜索的索引。使用基于模板的系统来格式化摘要。：Kendra 只提供搜索索引，模板系统无法提取实体生成语义摘要\n\n**📌 关键概念**：Amazon Comprehend Medical 专用于医疗文本处理，提取医疗实体与关系，适合医疗摘要场景；本题选项原文存在服务名误译，应以正确服务理解。","s":"源#147"},{"id":"D1-076","d":1,"t":"single","q":"哪个选项描述了人工智能环境中的嵌入？","o":[{"l":"A","t":"一种压缩大数据集的方法"},{"l":"B","t":"一种保护敏感数据的加密方法"},{"l":"C","t":"一种可视化高维数据的方法"},{"l":"D","t":"降维空间中数据表示的数值方法"}],"a":["D"],"e":"**✅ 为什么 D.降维空间中数据表示的数值方法对**：嵌入（Embedding）将高维数据（如文本、图像）映射到低维数值向量空间中，是一种降维数据表示方法。嵌入向量捕捉数据的语义关系。\n\n**❌ 为什么其他选项错**：\n- A.一种压缩大数据集的方法：嵌入不是数据压缩工具\n- B.一种保护敏感数据的加密方法：嵌入不是加密技术\n- C.一种可视化高维数据的方法：嵌入是数据表示，不专门用于可视化（虽然可辅助可视化）\n\n**📌 关键概念**：嵌入 = 将非结构化数据转换为固定维度的数值向量。语义相似的内容在向量空间中距离更近。是 RAG 和语义搜索的基础。","s":"源#148"},{"id":"D1-077","d":1,"t":"single","q":"标记化在自然语言处理(NLP)中有什么用？","o":[{"l":"A","t":"加密文本数据"},{"l":"B","t":"压缩文本文件"},{"l":"C","t":"将文本分成更小的单元进行处理"},{"l":"D","t":"在不同语言之间翻译文本"}],"a":["C"],"e":"**✅ 为什么 C.将文本分成更小的单元进行处理 对**：标记化（Tokenization）把文本拆分为词、子词或字符等更小单元，NLP 模型基于这些单元进行编码与处理，是文本预处理的基础步骤。\n\n**❌ 为什么其他选项错**：\n- A.加密文本数据：加密是安全操作，与 NLP 分词无关联\n- B.压缩文本文件：压缩是减小文件体积的技术，与分词无关\n- D.在不同语言之间翻译文本：翻译是文本翻译服务，分词只是预处理步骤，不涉及语言转换\n\n**📌 关键概念**：Tokenization 是 NLP 的基础步骤，把文本转成模型可处理的 Token 序列；分词粒度影响模型容量与性能，大语言模型常使用子词切分（如 BPE）。","s":"源#151"},{"id":"D1-078","d":1,"t":"single","q":"一家公司希望与几家研究机构合作开发一种人工智能模型。公司需要模型版本跟踪的标准化文档和模型开发的记录。哪种解决方案符合这些要求？","o":[{"l":"A","t":"使用 Git 跟踪模型变更。"},{"l":"B","t":"使用Amazon Fraud Detector跟踪模型变化。"},{"l":"C","t":"使用 Amazon SageMaker 型号卡跟踪型号变化。"},{"l":"D","t":"使用 Amazon understand 跟踪模型变化。"}],"a":["C"],"e":"**✅ 为什么 C.使用 Amazon SageMaker 型号卡跟踪型号变化 对**：题干要求模型版本跟踪与标准化文档，SageMaker 模型卡（Model Card）按模型迭代版本捕获训练数据、性能指标与预期用途等元数据，提供标准化文档，满足跨机构协作下的版本跟踪与记录需求。\n\n**❌ 为什么其他选项错**：\n- A.使用 Git 跟踪模型变更：Git 是代码版本管理工具，不适合记录模型元数据与版本迭代\n- B.使用Amazon Fraud Detector跟踪模型变化：Fraud Detector 用于欺诈检测，不提供模型版本跟踪能力\n- D.使用 Amazon understand 跟踪模型变化：题干原文「Amazon understand」应为 Amazon Comprehend，该服务是 NLP 文本分析，不用于模型版本管理\n\n**📌 关键概念**：模型卡（Model Card）记录模型版本元数据，SageMaker Model Registry 提供模型版本管理与审批发布；Git 只适合代码，模型版本需要专用机制。","s":"源#157"},{"id":"D1-079","d":1,"t":"single","q":"一个使用多个 ML 模型的公司想要识别原始模型质量的变化，以便公司可以解决任何。哪个 AWS 服务或功能符合这些要求？","o":[{"l":"A","t":"Amazon SageMaker JumpStart"},{"l":"B","t":"Amazon SageMaker 超级脚垫"},{"l":"C","t":"Amazon SageMaker Data Wrangler"},{"l":"D","t":"Amazon SageMaker 模型监视器"}],"a":["D"],"e":"**✅ 为什么 D.Amazon SageMaker 模型监视器 对**：SageMaker Model Monitor 持续监控生产环境中的数据与预测质量，检测数据漂移、模型漂移等质量变化并告警，使公司能及时识别原始模型质量的变化并采取措施。\n\n**❌ 为什么其他选项错**：\n- A.Amazon SageMaker JumpStart：JumpStart 提供预训练模型与快速部署方案，用于快速搭建，不具备质量监控能力\n- B.Amazon SageMaker 超级脚垫：题干「超级脚垫」疑似为机器翻译错误的产品名，无对应真实服务能力，无法监控模型质量\n- C.Amazon SageMaker Data Wrangler：Data Wrangler 用于数据准备与清洗，负责训练前数据整理，不负责生产监控\n\n**📌 关键概念**：Model Monitor 持续监控推理质量，检测数据漂移、模型漂移并告警；Data Wrangler 侧重数据准备，JumpStart 侧重预训练模型部署。","s":"源#158"},{"id":"D1-080","d":1,"t":"single","q":"一家公司正在开发使用生成式人工智能的编辑助手应用程序。在试验阶段，使用率很低，应用程序性能不是。该公司无法预测应用程序完全部署后的使用情况，并希望最大限度地降低应用程序成本。哪种解决方案能够满足这些要求？","o":[{"l":"A","t":"使用 GPU 支持的 Amazon EC2 实例。"},{"l":"B","t":"使用具有调配吞吐量的 Amazon Bedrock。"},{"l":"C","t":"使用按需吞吐量的 Amazon Bedrock。"},{"l":"D","t":"使用Amazon SageMaker JumpStart。"}],"a":["C"],"e":"**✅ 为什么 C.使用按需吞吐量的 Amazon Bedrock 对**：按需吞吐量（On-Demand）模式按实际推理调用量付费，无需预购容量，适合使用率低且无法预测的未来负载，最大限度控制成本，满足试验阶段要求。\n\n**❌ 为什么其他选项错**：\n- A.使用 GPU 支持的 Amazon EC2 实例。：EC2 实例需按小时预付费且自建推理，承担 GPU 闲置成本，无法降低不确定负载下的成本\n- B.使用具有调配吞吐量的 Amazon Bedrock。：调配吞吐量需预先购买模型容量，有固定费用，使用率低时会造成浪费\n- D.使用Amazon SageMaker JumpStart。：JumpStart 部署模型仍需自管推理基础设施，成本与运维负担明显高于按需调用\n\n**📌 关键概念**：Amazon Bedrock 支持按需（On-demand）与调配吞吐量（Provisioned Throughput）两种模式；按需按 token 计费，适合流量不确定场景。","s":"源#160"},{"id":"D1-081","d":1,"t":"single","q":"一家金融公司正在开发一种欺诈检测系统，该系统可以标记信用卡交易中的潜在欺诈案例。员工将评估标记的欺诈案例。该公司希望最大限度地减少员工花在审查实际上并非欺诈的已标记欺诈案例上的时间。哪个评估指标符合这些要求？","o":[{"l":"A","t":"回忆"},{"l":"B","t":"准确性"},{"l":"C","t":"精确"},{"l":"D","t":"电梯图表"}],"a":["C"],"e":"**✅ 为什么 C.精确 对**：精确率（Precision）表示被模型标记为欺诈的样本中真正是欺诈的比例（TP/TP+FP），精确率越高，被误标记为欺诈的案件越少，员工浪费在审查非欺诈标记的时间越少，符合题意。\n\n**❌ 为什么其他选项错**：\n- A.回忆：召回率衡量所有真实欺诈中成功召回的比例，关注漏报，不能减少对非欺诈案例的误报审查\n- B.准确性：准确率对类别不平衡数据不敏感，欺诈案例占比低时高准确率不代表误报少，无法满足重点优化误报的需求\n- D.电梯图表：Lift 图用于评估排序与营销策略的收益提升，不直接衡量分类误报，不适用\n\n**📌 关键概念**：Precision 强调预测为正的样本中真正的比例，适合误报成本高的场景；Recall 关注漏报；欺诈检测中误报审查成本高时应优先优化 Precision。","s":"源#162"},{"id":"D1-082","d
