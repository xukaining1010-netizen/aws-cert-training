":1,"t":"single","q":"一家公司设计了一个人工智能代理，根据产品手册回答客户的询问。哪种策略可以提高客户对人工智能代理响应的信心水平？","o":[{"l":"A","t":"在回答中写下置信度"},{"l":"B","t":"在回复中包含引用的产品手册链接"},{"l":"C","t":"设计一个看起来像电脑的代理化身"},{"l":"D","t":"培训代理以公司的语言风格做出回应"}],"a":["B"],"e":"**✅ 为什么 B.在回复中包含引用的产品手册链接 对**：在回答中给出产品手册的具体链接，客户可直接点击核对信息来源，增强对 AI 代理回复内容的信任与信心。\n\n**❌ 为什么其他选项错**：\n- A.在回答中写下置信度：仅输出置信度数值不能让客户核实内容，来源引用对信任更有效\n- C.设计一个看起来像电脑的代理化身：外观设计对信息可信度没有实质作用，不能提升内容本身的置信\n- D.培训代理以公司的语言风格做出回应：语言风格影响表达观感，但不提供可核实的依据，无法直接提升客户对内容本身的信任\n\n**📌 关键概念**：让 AI 回复可溯源（引用来源）是提升用户信任的关键手段，RAG 场景下带来源引用是核心可溯源设计。","s":"源#163"},{"id":"D1-083","d":1,"t":"single","q":"哪种技术涉及在标记数据集上训练 AI 模型，以使模型适应特定的行业术语和要求？","o":[{"l":"A","t":"数据扩充"},{"l":"B","t":"微调"},{"l":"C","t":"模型量化"},{"l":"D","t":"连续预培训"}],"a":["B"],"e":"**✅ 为什么 B.微调 对**：微调（Fine-tuning）在预训练模型基础上继续用有标注的领域数据训练，使模型适应特定行业术语与需求，符合题干描述。\n\n**❌ 为什么其他选项错**：\n- A.数据扩充：数据扩充是对训练样本做旋转、加噪等变换增加数据量，不改变模型对行业的适应能力\n- C.模型量化：量化通过降低参数精度（如 FP32 到 INT8）压缩模型、加速推理，不进行领域适应\n- D.连续预培训：连续预训练（继续预训练）在无标注文本上进行，不针对标签任务做监督适应，与题干标注训练不符\n\n**📌 关键概念**：微调（Fine-tuning）是在预训练模型基础上用有标签数据训练以适应特定任务；数据增强与模型量化是另类手段；续预训练属无监督的域内继续学习。","s":"源#167"},{"id":"D1-084","d":1,"t":"single","q":"一家公司正在使用 Amazon Bedrock Agents为其应用程序创建一个代理。代理表现不错，但是公司想通过提供一些具体的例子来提高代理的准确率。哪种解决方案符合这些要求？","o":[{"l":"A","t":"修改代理的高级提示以包括示例。"},{"l":"B","t":"为代理创建一个包含示例的护栏。"},{"l":"C","t":"使用Amazon SageMaker Ground Truth 来标记示例。"},{"l":"D","t":"在 AWS Lambda 中运行一个脚本，将示例添加到训练数据集中。"}],"a":["A"],"e":"**✅ 为什么 A.修改代理的高级提示以包括示例 对**：在高级提示中加入输入输出示例（少样本提示 few-shot）能够引导模型学习任务模式，无需重新训练即可提升代理准确率，符合提高准确率的要求。\n\n**❌ 为什么其他选项错**：\n- B.为代理创建一个包含示例的护栏：护栏（Guardrails）用于限制模型输出内容范围，防止有害或违规内容，不用于提高准确率\n- C.使用Amazon SageMaker Ground Truth 来标记示例：Ground Truth 是数据标注服务，标注的是训练数据，代理提示调整不涉及模型重训\n- D.在 AWS Lambda 中运行一个脚本，将示例添加到训练数据集中：若代理不重训，加入训练集对准确率无作用，且该方案没有说明如何基于示例提高推理准确率\n\n**📌 关键概念**：少样本提示（Few-shot prompting）通过在提示中包含示例提高模型准确率；护栏用于安全，Ground Truth 用于标注，Lambda 不直接提升模型准确率。","s":"源#168"},{"id":"D1-085","d":1,"t":"single","q":"在机器学习操作(MLOps)中使用基础设施作为代码(IaC)的好处是什么？","o":[{"l":"A","t":"IaC 消除了超参数调谐的需要。"},{"l":"B","t":"IaC 总是提供强大的计算实例，有助于训练更精确的模型。"},{"l":"C","t":"IaC 简化了云环境中可扩展且一致的 ML 工作负载的部署。"},{"l":"D","t":"IaC 通过只部署低成本的实例来最小化总开支。"}],"a":["C"],"e":"**✅ 为什么 C.IaC 简化了云环境中可扩展且一致的 ML 工作负载的部署 对**：基础设施即代码（IaC）将基础设施定义为代码，可版本化、自动化且可重复部署，确保 ML 环境一致性与可扩展性，是 MLOps 的核心理念。\n\n**❌ 为什么其他选项错**：\n- A.IaC 消除了超参数调谐的需要：IaC 管理基础设施，不涉及模型超参数调优，两者属于不同层面\n- B.IaC 总是提供强大的计算实例，有助于训练更精确的模型：实例规格由配置决定，与模型精度无关，且「总是」过于绝对\n- D.IaC 通过只部署低成本的实例来最小化总开支：IaC 可配置成本优化，但核心价值在于一致性、可重复性，并非仅追求低成本\n\n**📌 关键概念**：IaC（如 CloudFormation、Terraform）把基础设施定义为代码，实现版本管理、自动部署与一致环境，是 MLOps 中保障训练推理环境复现性的基石。","s":"源#169"},{"id":"D1-086","d":1,"t":"single","q":"在 AWS 上训练 AI 模型时，哪种 ML 技术可以确保数据合规性和隐私性？","o":[{"l":"A","t":"强化学习"},{"l":"B","t":"迁移学习"},{"l":"C","t":"联合学习"},{"l":"D","t":"无监督学习"}],"a":["C"],"e":"**✅ 为什么 C.联合学习 对**：联邦学习（Federated Learning）让各方在本地数据上训练模型，只共享模型权重更新而不转移原始数据，从而在训练 AI 模型时满足数据隐私与合规要求。\n\n**❌ 为什么其他选项错**：\n- A.强化学习：强化学习通过奖励反馈训练策略，与数据隐私保护没有直接关联\n- B.迁移学习：迁移学习是把一个任务学到的知识迁移到另一任务，重点在知识复用，不涉及隐私保护\n- D.无监督学习：无监督学习在无标签数据中挖掘模式，不提供跨组织原始数据不共享的机制保障\n\n**📌 关键概念**：联邦学习核心是「数据不动，模型动」，多参与方本地训练、共享模型更新，兼顾模型性能与数据隐私合规；适用于敏感数据场景。","s":"源#171"},{"id":"D1-087","d":1,"t":"single","q":"一家金融公司希望根据交易数据将所有信用卡活动标记为可能欺诈或非欺诈。哪种类型的 ML 模型符合这些要求？","o":[{"l":"A","t":"回归"},{"l":"B","t":"传播"},{"l":"C","t":"二元分类"},{"l":"D","t":"多类分类"}],"a":["C"],"e":"**✅ 为什么 C.二元分类 对**：题干要求把信用卡交易标记为「可能欺诈」或「非欺诈」两个类别，二元分类（Binary Classification）输出仅两个类别标签，正好满足该类场景要求。\n\n**❌ 为什么其他选项错**：\n- A.回归：回归预测连续数值，不输出类别标签\n- B.传播：题干「传播」并非标准 ML 模型类型，无法对应二分类任务\n- D.多类分类：多类分类输出三个及以上类别，而本任务只有欺诈、非欺诈两类，范围过大\n\n**📌 关键概念**：二分类问题两类标签，如欺诈检测、垃圾邮件识别；回归是连续数值预测，多分类是多个离散类别；选项「传播」属原题术语不规范问题。","s":"源#173"},{"id":"D1-088","d":1,"t":"single","q":"哪种类型的人工智能模型进行数值预测？","o":[{"l":"A","t":"传播"},{"l":"B","t":"回归"},{"l":"C","t":"变压器"},{"l":"D","t":"多模态"}],"a":["B"],"e":"**✅ 为什么 B.回归 对**：回归（Regression）模型用于预测连续数值型输出，如销售额、房价等数值预测场景，正是题干要求的数值预测类型。\n\n**❌ 为什么其他选项错**：\n- A.传播：「传播」并非标准模型类型术语，回归与分类之外没有该模型类别\n- C.变压器：Transformer 是深度学习架构，用于序列建模（NLP 等），并非按输出类型定义的模型类别\n- D.多模态：多模态指模型可处理文本、图像等多种输入，与数值预测无关\n\n**📌 关键概念**：回归（Regression）输出连续数值，分类输出离散类别；回归模型包括线性回归、岭回归、XGBoost 回归等；「Transformer」是网络架构而非预测类型。","s":"源#175"},{"id":"D1-089","d":1,"t":"single","q":"一家零售公司希望建立一个 ML 模型来向客户推荐产品。该公司希望在负责任的实践基础上建立模型。公司在收集数据时应采用哪种做法来减少模型偏差？","o":[{"l":"A","t":"仅使用与公司整体客户群的人口统计数据相匹配的客户的数据。"},{"l":"B","t":"从有购买历史的客户那里收集数据。"},{"l":"C","t":"确保数据是平衡的，并且是从不同的群体中收集的。"},{"l":"D","t":"确保数据来自公开可用的数据集。"}],"a":["C"],"e":"**✅ 为什么 C.确保数据是平衡的，并且是从不同的群体中收集的对**：确保数据平衡且来源多样化是减少模型偏差的核心做法。多样化数据集代表所有客户群体，防止模型偏向特定人群。\n\n**❌ 为什么其他选项错**：\n- A.仅使用与公司整体客户群的人口统计数据相匹配的客户的数据：这可能排除少数群体\n- B.从有购买历史的客户那里收集数据：排除新客户，造成选择偏差\n- D.确保数据来自公开可用的数据集：公开数据集不一定代表公司的特定客户群\n\n**📌 关键概念**：减少偏差的数据收集原则——多样性（覆盖各群体）、平衡性（各群体比例合理）、代表性（反映真实分布）。","s":"源#190"},{"id":"D1-090","d":1,"t":"single","q":"一家公司正在开发一个 ML 模型来预测客户流失。哪种评估指标将评估模型在二元分类任务(如预测客户流失)中的性能？","o":[{"l":"A","t":"F1 分数"},{"l":"B","t":"均方误差"},{"l":"C","t":"r 平方"},{"l":"D","t":"用于训练模型的时间"}],"a":["A"],"e":"**✅ 为什么 A.F1 分数对**：F1 分数是精确率和召回率的调和平均值，是二分类任务（如流失/不流失）的综合评估指标。特别适合类别不平衡的场景（流失客户通常是少数）。\n\n**❌ 为什么其他选项错**：\n- B.均方误差：MSE 是回归指标，不用于分类\n- C.r 平方：R² 是回归指标\n- D.用于训练模型的时间：训练时间是效率指标，不衡量分类性能\n\n**📌 关键概念**：二分类评估——F1=2×(精确率×召回率)/(精确率+召回率)。当正负样本不平衡时，F1 比准确率更有参考价值。","s":"源#191"},{"id":"D1-091","d":1,"t":"single","q":"一名人工智能从业者正在评估Amazon SageMaker 模型的性能。人工智能从业者必须选择一个性能指标。该指标必须显示正确分类项目数与正确和错误分类项目总数的比率。哪个指标符合这些要求？","o":[{"l":"A","t":"准确性"},{"l":"B","t":"精确"},{"l":"C","t":"F1 分数"},{"l":"D","t":"回忆"}],"a":["A"],"e":"**✅ 为什么 A.准确性对**：准确率（Accuracy）= 正确分类数 / 总样本数。这完全符合题目描述：\"正确分类项目数与正确和错误分类项目总数的比率\"。\n\n**❌ 为什么其他选项错**：\n- B.精确：精确率 = 真正例 / (真正例+假正例)，只关注预测为正的准确性\n- C.F1 分数：F1 是精确率和召回率的调和平均，不是简单比率\n- D.回忆：召回率 = 真正例 / (真正例+假负例)，只关注实际正例的覆盖率\n\n**📌 关键概念**：Accuracy = (TP+TN) / (TP+TN+FP+FN)。是最直观的\"总体正确率\"指标。","s":"源#192"},{"id":"D1-092","d":1,"t":"single","q":"一家电子商务公司每天接收数千兆字节的客户数据。该公司使用这些数据训练一个 ML 模型来预测未来的产品需求。该公司需要一个每天执行一次推理的解决方案。哪种推理类型符合这些要求？","o":[{"l":"A","t":"批量推断"},{"l":"B","t":"异步推理"},{"l":"C","t":"实时推理"},{"l":"D","t":"无服务器推理"}],"a":["A"],"e":"**✅ 为什么 A.批量推断对**：批量推理（Batch Inference）一次性处理大量数据，适合\"每天执行一次\"的定时离线处理场景。每天积累数千 GB 数据后统一处理，成本效率最高。\n\n**❌ 为什么其他选项错**：\n- B.异步推理：适合单个大请求的长时处理，不是日批量处理的最佳方案\n- C.实时推理：实时推理需要端点始终在线，对每天一次的场景成本浪费\n- D.无服务器推理：适合间歇性小规模请求，不适合 TB 级日批量处理\n\n**📌 关键概念**：批量推理的典型特征——大数据量 + 定时运行 + 不需即时结果。SageMaker Batch Transform 是标准工具。","s":"源#193"},{"id":"D1-093","d":1,"t":"single","q":"一家公司开发了一个客户细分的生成式人工智能模型。该模型已经在公司的生产环境中部署了很长时间。该公司最近注意到模型的反应有些不一致。该公司希望评估模型偏差和漂移。哪个 AWS 服务或功能符合这些要求？","o":[{"l":"A","t":"Amazon SageMaker 模型监视器"},{"l":"B","t":"Amazon SageMaker Clarify"},{"l":"C","t":"Amazon SageMaker 模型卡"},{"l":"D","t":"Amazon SageMaker 特色店"}],"a":["A"],"e":"**✅ 为什么 A.Amazon SageMaker 模型监视器对**：SageMaker Model Monitor 持续监控生产中的模型，可以检测数据漂移（输入数据分布变化）和模型质量漂移（输出不一致），正是评估\"偏差和漂移\"的工具。\n\n**❌ 为什么其他选项错**：\n- B.Amazon SageMaker Clarify：Clarify 侧重偏差检测和可解释性，但 Model Monitor 更适合持续生产监控\n- C.Amazon SageMaker 模型卡：Model Cards 是文档记录工具，不做主动监控\n- D.Amazon SageMaker 特色店：Feature Store 存储和管理特征，不监控模型性能\n\n**📌 关键概念**：模型漂移 = 模型性能随时间下降。原因：数据分布变化（Data Drift）或概念变化（Concept Drift）。Model Monitor 自动检测并告警。","s":"源#194"},{"id":"D1-094","d":1,"t":"single","q":"哪种 ML 技术使用标有正确输出值的训练数据？","o":[{"l":"A","t":"监督学习"},{"l":"B","t":"无监督学习"},{"l":"C","t":"强化学习"},{"l":"D","t":"迁移学习"}],"a":["A"],"e":"**✅ 为什么 A.监督学习对**：监督学习的定义就是使用标记数据（每个样本有对应的正确输出/标签）来训练模型，学习输入到输出的映射关系。\n\n**❌ 为什么其他选项错**：\n- B.无监督学习：使用未标记数据，发现隐藏模式\n- C.强化学习：通过与环境交互获得奖惩信号学习，没有\"标记的正确输出\"\n- D.迁移学习：利用预训练模型的知识，是一种策略而非学习方法分类\n\n**📌 关键概念**：三大学习方法——监督学习（有标签）、无监督学习（无标签）、强化学习（奖惩信号）。","s":"源#196"},{"id":"D1-095","d":1,"t":"single","q":"一家动画公司希望为其内容提供字幕。哪个 AWS 服务符合这一要求？","o":[{"l":"A","t":"Amazon Comprehend"},{"l":"B","t":"Amazon Polly"},{"l":"C","t":"Amazon Transcribe"},{"l":"D","t":"Amazon Translate"}],"a":["C"],"e":"**✅ 为什么 C.Amazon Transcribe 对**：Amazon Transcribe 将音频/视频中的语音转换为文字（字幕），是生成字幕的标准 AWS 服务。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Comprehend：Comprehend 分析文本内容，不做语音转文字\n- B.Amazon Polly：Polly 将文字转语音（TTS），是反向功能\n- D.Amazon Translate：Translate 做文本翻译，不做语音识别\n\n**📌 关键概念**：字幕生成 = 语音→文字 = Amazon Transcribe（ASR）。如需多语言字幕：Transcribe + Translate。","s":"源#203"},{"id":"D1-096","d":1,"t":"single","q":"一家电子商务公司希望根据客户的购买历史和偏好对客户进行分组，以个性化公司应用程序的用户体验。公司应该使用哪种 ML 技术？","o":[{"l":"A","t":"分类"},{"l":"B","t":"使聚集"},{"l":"C","t":"回归"},{"l":"D","t":"内容生成"}],"a":["B"],"e":"**✅ 为什么 B.使聚集对**：根据购买历史和偏好将客户\"分组\"是聚类（Clustering）任务——在无预定义标签的情况下，基于数据相似性自动发现客户群体。\n\n**❌ 为什么其他选项错**：\n- A.分类：分类需要预定义的类别标签，题目没有提到已有客户分组标签\n- C.回归：回归预测连续数值，不是分组\n- D.内容生成：内容生成创建新内容，不做客户分群\n\n**📌 关键概念**：客户分群/细分 = 聚类（无监督学习）。根据行为模式自动发现群体，用于个性化营销和产品推荐。","s":"源#204"},{"id":"D1-097","d":1,"t":"single","q":"一家公司希望控制员工对公开基础模型(FMs)的访问。哪种解决方案符合这些要求？","o":[{"l":"A","t":"在 AWS 成本浏览器中分析成本和使用情况报告。"},{"l":"B","t":"从 AWS Artifact 下载 AWS 安全性和合规性文档。"},{"l":"C","t":"配置 Amazon SageMaker JumpStart 以限制可发现的 FMs。"},{"l":"D","t":"使用 Amazon OpenSearch 服务构建混合搜索解决方案。"}],"a":["C"],"e":"**✅ 为什么 C.配置 Amazon SageMaker JumpStart 以限制可发现的 FMs 对**：SageMaker JumpStart 支持通过服务目录策略控制哪些 FM 对员工可见和可用，实现对 FM 访问的管控。\n\n**❌ 为什么其他选项错**：\n- A.在 AWS 成本浏览器中分析成本和使用情况报告：成本分析不控制访问\n- B.从 AWS Artifact 下载 AWS 安全性和合规性文档：Artifact 提供合规报告，不控制 FM 访问\n- D.使用 Amazon OpenSearch 服务构建混合搜索解决方案：OpenSearch 是搜索服务，不管理 FM 访问\n\n**📌 关键概念**：SageMaker JumpStart 的访问控制——通过 Service Catalog 和 IAM 策略限制可用模型，实现 FM 治理。","s":"源#205"},{"id":"D1-098","d":1,"t":"single","q":"一家公司建立了一个翻译工具来帮助其客户服务团队处理来自世界各地客户的。该公司希望评估翻译工具的性能。该公司建立了一个并行的数据流程，将工具的反应与真实人类的反应进行比较。两组响应都是在同一组文档上生成的。公司应该使用哪种策略来评估翻译工具？","o":[{"l":"A","t":"使用双语评估替角(BLEU)分数来评估两种方法的绝对翻译质量。"},{"l":"B","t":"使用双语评估替角(BLEU)分数来估计两种方法的相对翻译质量。"},{"l":"C","t":"使用 BERTScore 评估两种方法的绝对翻译质量。"},{"l":"D","t":"使用 BERTScore 评估两种方法的相对翻译质量。"}],"a":["B"],"e":"**✅ 为什么 B.使用双语评价替角(BLEU)分数来估计两种方法的相对翻译质量对**：BLEU 分数通过将机器翻译与人工翻译参考进行比较来评估翻译质量。题目说\"将工具反应与人类反应比较\"，BLEU 正好衡量机器输出与人工参考的相对匹配程度。\n\n**❌ 为什么其他选项错**：\n- A.使用 BLEU 分数评估绝对翻译质量：BLEU 是相对指标（相对于参考译文），不是绝对质量度量\n- C.使用 BERTScore 评估绝对翻译质量：BERTScore 也是相对于参考的指标\n- D.使用 BERTScore 评估相对翻译质量：BERTScore 可用但 BLEU 是翻译评估的标准指标\n\n**📌 关键概念**：BLEU = 翻译任务的标准评估指标，衡量机器翻译与人工参考的 n-gram 重叠度。分数越高，翻译越接近人工。","s":"源#206"},{"id":"D1-099","d":1,"t":"single","q":"一家公司开发了定制的计算机视觉模型。该公司需要一个用户友好的数据标注界面，以最大限度地减少新的现实世界数据中的模型错误。哪个 AWS 服务、功能或工具符合这些要求？","o":[{"l":"A","t":"Amazon SageMaker Ground Truth"},{"l":"B","t":"Amazon SageMaker Canvas"},{"l":"C","t":"Amazon Bedrock Playground"},{"l":"D","t":"Amazon Bedrock Agents"}],"a":["A"],"e":"**✅ 为什么 A.Amazon SageMaker Ground Truth对**：SageMaker Ground Truth 提供用户友好的数据标注界面，支持图像标注（边界框、语义分割等）。通过人工标注新数据来改进模型，减少现实世界中的错误。\n\n**❌ 为什么其他选项错**：\n- B.Amazon SageMaker Canvas：Canvas 是无代码 ML 建模工具，不是数据标注工具\n- C.Amazon Bedrock Playground：Bedrock Playground 用于测试 FM，不做数据标注\n- D.Amazon Bedrock Agents：Bedrock Agents 用于构建 AI 代理，不做标注\n\n**📌 关键概念**：SageMaker Ground Truth = 数据标注平台。支持文本、图像、视频标注，可整合人工和自动标注。","s":"源#208"},{"id":"D1-100","d":1,"t":"single","q":"一家金融公司部署了一个 ML 模型来预测客户流失。该模型已经在生产中运行了 1 周。该公司希望评估该模型预测客户流失与实际客户行为相比的准确性。哪个指标符合这些要求？","o":[{"l":"A","t":"均方根误差（RMSE）"},{"l":"B","t":"投资回报率（ROI）"},{"l":"C","t":"F1 分数"},{"l":"D","t":"双语评估替角（BLEU）评分"}],"a":["C"],"e":"**✅ 为什么 C.F1 分数对**：预测客户流失是二分类任务（流失/不流失）。F1 分数综合评估精确率和召回率，适合衡量模型预测与实际客户行为的一致性，尤其在流失客户是少数类时更有价值。\n\n**❌ 为什么其他选项错**：\n- A.均方根误差（RMSE）：RMSE 是回归指标，不用于分类任务\n- B.投资回报率（ROI）：ROI 是商业指标，不是模型性能指标\n- D.双语评估替角（BLEU）评分：BLEU 用于翻译/文本生成评估，不用于分类\n\n**📌 关键概念**：流失预测 = 二分类 → F1 是标准指标。F1 平衡了\"找到所有会流失的客户\"和\"标记的客户确实会流失\"。","s":"源#209"},{"id":"D1-101","d":1,"t":"single","q":"一家食品服务公司希望收集一个数据集来预测客户的食品偏好。该公司希望确保所有人口统计的食物偏好都包含在数据中。这种情况呈现了哪种数据集特征？","o":[{"l":"A","t":"准确性"},{"l":"B","t":"多样性"},{"l":"C","t":"新近偏差"},{"l":"D","t":"可靠性"}],"a":["B"],"e":"**✅ 为什么 B.多样性对**：确保\"所有人口统计的食物偏好都包含在数据中\"体现的是数据集的多样性（Diversity）——数据覆盖各种不同的群体和情况。\n\n**❌ 为什么其他选项错**：\n- A.准确性：准确性指数据值是否正确，不是覆盖范围问题\n- C.新近偏差：新近偏差是指过度依赖最近数据的倾向\n- D.可靠性：可靠性指数据质量是否稳定一致\n\n**📌 关键概念**：数据集质量维度——准确性（数据正确）、多样性（覆盖全面）、完整性（无缺失）、时效性（数据新鲜）。多样性确保模型对所有群体公平。","s":"源#211"},{"id":"D1-102","d":1,"t":"single","q":"一个客户服务团队正在开发一个应用程序来分析客户反馈，并自动将反馈分为不同的类别。这些类别包括产品质量、客户服务和交付体验。该场景提出了哪一个 A1 概念？","o":[{"l":"A","t":"计算机视觉"},{"l":"B","t":"自然语言处理"},{"l":"C","t":"推荐系统"},{"l":"D","t":"欺诈检测"}],"a":["B"],"e":"**✅ 为什么 B.自然语言处理对**：将文本反馈自动分类到预定义类别（产品质量/客户服务/交付体验）是典型的 NLP 文本分类任务——理解文本含义并归类。\n\n**❌ 为什么其他选项错**：\n- A.计算机视觉：计算机视觉处理图像/视频，不处理文本反馈\n- C.推荐系统：推荐系统推荐内容/商品，不做文本分类\n- D.欺诈检测：欺诈检测识别异常交易，与文本分类不同\n\n**📌 关键概念**：NLP 核心任务——文本分类、情感分析、命名实体识别、文本摘要。Amazon Comprehend 提供这些功能。","s":"源#214"},{"id":"D1-103","d":1,"t":"multiple","q":"一家电子商务公司希望构建一个解决方案，根据客户对产品的书面评论来确定客户情绪。哪些 AWS 服务符合这些要求？（选择两个。）","o":[{"l":"A","t":"Amazon Lex"},{"l":"B","t":"Amazon Comprehend"},{"l":"C","t":"Amazon Polly"},{"l":"D","t":"Amazon Bedrock"},{"l":"E","t":"Amazon Cognito"}],"a":["B","D"],"e":"**✅ 为什么 B.Amazon Comprehend 和 D.Amazon Bedrock 对**：Amazon Comprehend 内置情感分析功能，可直接分析文本情绪（正面/负面/中性/混合）。Amazon Bedrock 的 LLM 也能理解文本情感并进行分类。两者都能从书面评论中确定客户情绪。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Lex：Lex 构建对话机器人，不是情感分析工具\n- C.Amazon Polly：Polly 是文本转语音服务\n- E.Amazon Cognito：不是标准 AWS AI 服务名称\n\n**📌 关键概念**：情感分析方案——①Comprehend（开箱即用API）②Bedrock LLM（灵活自定义）。Comprehend 更简单直接；Bedrock 更灵活但成本稍高。","s":"源#216"},{"id":"D1-104","d":1,"t":"hot","q":"一家公司希望将 Amazon SageMaker 特性用于各种用例。从以下列表中为每个使用案例选择正确的 SageMaker 功能。每个 SageMaker 特性都应该选择一次，否则就不要选择。","o":[],"a":[],"e":"**✅ 正确配对说明**：本题将 SageMaker 各功能与用例配对。原则：先看用例要解决的是数据准备、训练、调优、部署还是监控，再选对应功能。SageMaker Ground Truth 用于数据标注，Data Wrangler 用于数据准备，Clarify 用于分析训练数据偏差与模型可解释性，Autopilot 自动构建候选模型，Model Monitor 监控生产数据漂移，Model Registry 管理模型版本。应逐一按功能名称对应用途。\n\n**❌ 常见配对错误**：\n- 数据准备类用例选 Model Monitor：数据准备在训练前，Model Monitor 在生产后监控，阶段错位\n- 模型可解释性用例选 Autopilot：Clarify 专门做可解释性与偏差分析，Autopilot 是自动调参训练\n- 模型版本管理用例选 Model Registry 与 Model Monitor 混淆：Registry 管理版本与审批，Monitor 只管线上质量\n\n**📌 关键概念**：SageMaker 生态按 ML 生命周期划分：标注（Ground Truth）、数据准备（Wrangler）、训练（Autopilot）、解释（Clarify）、监控（Model Monitor）、治理（Model Registry）；对应 AIF 域1 需掌握各服务用途。","s":"源#226"},{"id":"D1-105","d":1,"t":"hot","q":"一家公司正在使用Amazon SageMaker 开发人工智能模型。从以下列表中为 AI 模型生命周期工作流程中的每个步骤选择正确的 SageMaker 功能或资源。每个 SageMaker 特性或资源应该只选择一次，或者根本不选择。","o":[],"a":[],"e":"**✅ 正确配对说明**：本题将 AI 模型生命周期工作流各步骤与 SageMaker 功能/资源配对。完整生命周期含数据准备、训练、部署与监控：数据标注用 Ground Truth，数据处理与特征工程用 Data Wrangler 或 Feature Store，模型训练用训练作业，部署用推理端点，监控用 Model Monitor，版本管理用 Model Registry。按流程先准备数据、再训练、再部署、再监控的顺序对号入座。\n\n**❌ 常见配对错误**：\n- 将训练用资源与数据准备工具混淆：训练作业（Training Job）用于模型训练，Wrangler 不承担训练\n- 把 Model Monitor 用于训练阶段：Monitor 监控生产推理质量，训练阶段用 Debugger 观察训练指标\n- 把 Model Registry 与部署端点混淆：Registry 负责版本治理，Endpoint 才是对外提供推理的部署资源\n\n**📌 关键概念**：ML 生命周期包括数据准备、训练、验证、部署、监控与治理，SageMaker 各服务按阶段分工；端到端 MLOps 流程是 AIF 域1 高频考点。","s":"源#227"},{"id":"D1-106","d":1,"t":"hot","q":"一家公司想要构建一个 ML 应用程序。从以下列表中选择并排序正确的步骤，以开发一个架构良好的 ML 工作负载。每个步骤应选择一次。","o":[],"a":[],"e":"**✅ 正确配对说明**：本题要求将构建架构良好 ML 工作负载的正确步骤排序。典型顺序为：先明确业务问题并收集数据，然后做数据准备与特征工程，接着训练与调优模型、评估模型效果，最后部署到生产并持续监控。步骤遵循「数据先行、训练随后、部署收尾」的流程。\n\n**❌ 常见配对错误**：\n- 把部署放在训练之前：模型未经训练调优无法部署，顺序错误\n- 把监控放在部署之前：监控针对生产运行的模型，部署后才可监控\n- 把数据准备放在训练之后：训练依赖已整理好的数据，数据准备必须在训练前完成\n\n**📌 关键概念**：Well-Architected ML 工作负载遵循数据准备→训练→评估→部署→监控的生命周期，评估反馈用于迭代改进。","s":"源#228"},{"id":"D1-107","d":1,"t":"hot","q":"一家公司希望开发机器学习应用程序以改善业务运营和效率。从以下列表中为每个用例选择正确的机器学习范式。每个机器学习范式应选择一次或多次。","o":[],"a":[],"e":"**✅ 正确配对说明**：本题将机器学习范式与业务用例配对。业务运营与效率提升场景中：分类用例（如欺诈识别、垃圾邮件过滤）用监督学习；分组与细分用聚类（无监督学习）；根据历史数据预测数值用回归；自动决策与优化策略用强化学习；文本生成/翻译等用生成式 AI。按数据标签与任务类型选择范式。\n\n**❌ 常见配对错误**：\n- 把监督学习当无监督：监督学习需要标签，无监督找隐藏结构，两者任务不同\n- 把回归归入分类：回归输出连续数值，分类输出离散类别\n- 强化学习误配给静态数据任务：强化学习需要环境交互与反馈，静态数据预测不适合\n\n**📌 关键概念**：ML 范式包括监督学习、无监督学习、强化学习与生成式 AI；按是否有标签、输出类型与交互需求选择范式。","s":"源#230"},{"id":"D1-108","d":1,"t":"single","q":"一家公司已创建了多个机器学习模型。该公司需要一个解决方案来存储、管理和对这些模型进行版本控制。哪个 AWS 服务或功能符合这些要求？","o":[{"l":"A","t":"AWS Audit Manager"},{"l":"B","t":"Amazon SageMaker Model Monitor"},{"l":"C","t":"Amazon SageMaker Model Registry"},{"l":"D","t":"Amazon SageMaker Canvas"}],"a":["C"],"e":"**✅ 为什么 C.Amazon SageMaker Model Registry 对**：Model Registry 提供模型版本管理、集中存储模型及部署状态跟踪，满足公司存储、管理和版本控制多个 ML 模型的需求，为 MLOps 治理提供依据。\n\n**❌ 为什么其他选项错**：\n- A.AWS Audit Manager：Audit Manager 自动收集证据辅助审计合规，不是模型存储管理\n- B.Amazon SageMaker Model Monitor：Model Monitor 监控推理质量与漂移，不提供存储与版本管理\n- D.Amazon SageMaker Canvas：Canvas 是无代码构建模型的可视化界面，不具备模型版本管理能力\n\n**📌 关键概念**：Model Registry 为每个模型跟踪版本、部署状态与审批，配套 Model Cards 治理，SageMaker MLOps 中版本管理核心组件。","s":"源#234"},{"id":"D1-109","d":1,"t":"single","q":"一位人工智能从业者正在构建一个机器学习模型。该从业者希望向利益相关者提供模型的透明度和可解析性。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"展示模型的夏普利值。"},{"l":"B","t":"提供模型的准确度衡量指标。"},{"l":"C","t":"提供模型混淆矩阵。"},{"l":"D","t":"提供一个安全的模型推理端点。"}],"a":["A"],"e":"**✅ 为什么 A.展示模型的夏普利值 对**：SHAP 值量化每个特征对模型预测的贡献，将黑盒预测拆解为可解释的贡献，向利益相关者提供模型预测的透明性与可解释性。\n\n**❌ 为什么其他选项错**：\n- B.提供模型的准确度衡量指标：准确率只给出整体表现数值，不解释单个预测如何决策\n- C.提供模型混淆矩阵：混淆矩阵展示分类性能统计，不提供逐预测的解释\n- D.提供一个安全的模型推理端点：安全部署不影响模型决策的可解释性\n\n**📌 关键概念**：SHAP（Shapley Additive exPlanation）基于博弈论，量化特征贡献，是模型可解释性的主要方法，SageMaker Clarify 原生支持 SHAP。","s":"源#235"},{"id":"D1-110","d":1,"t":"single","q":"一家公司正在开发一个机器学习应用程序。该应用程序必须根据客户和产品的特征自动将相似的客户和产品进行分组。为了满足这些要求，该公司应采用哪种机器学习策略？","o":[{"l":"A","t":"无监督学习"},{"l":"B","t":"监督学习"},{"l":"C","t":"强化学习"},{"l":"D","t":"半监督学习"}],"a":["A"],"e":"**✅ 为什么 A.无监督学习 对**：无监督学习不依赖标签，自动发现数据中的模式，把相似客户与相似产品聚类分组，正是题干「自动将相似的客户和产品进行分组」所要求的策略。\n\n**❌ 为什么其他选项错**：\n- B.监督学习：监督学习需要标签输出，用于分类回归，无法自动发现分组\n- C.强化学习：强化学习通过环境交互与奖励优化决策，与自动分组无关\n- D.半监督学习：半监督学习综合利用少量标签与大量无标签数据，仍需标签，不适用于纯自动分组\n\n**📌 关键概念**：无监督学习用于聚类（如 K-Means）与降维，客户细分/产品分组是典型聚类用例，输入特征无需标签。","s":"源#236"},{"id":"D1-111","d":1,"t":"single","q":"一家新闻机构用英语发布文章。该机构希望将文章提供给其他语言的读者。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"在公司的网站上添加Amazon Transcribe。"},{"l":"B","t":"使用Amazon Translate的实时翻译功能。"},{"l":"C","t":"将Amazon Personalize添加到公司的网站上。"},{"l":"D","t":"使用 Amazon Textract 的实时文档处理功能。"}],"a":["B"],"e":"**✅ 为什么 B.使用Amazon Translate的实时翻译功能 对**：Amazon Translate 提供实时文本翻译能力，可将英文文章直接翻译为多语言，满足新闻机构为其他语言读者提供文章的需求。\n\n**❌ 为什么其他选项错**：\n- A.在公司的网站上添加Amazon Transcribe：Transcribe 是语音转文字，文章是文本，不匹配\n- C.将Amazon Personalize添加到公司的网站上：Personalize 是个性化推荐服务，不提供翻译能力\n- D.使用 Amazon Textract 的实时文档处理功能：Textract 是 OCR 文本抽取，非翻译服务\n\n**📌 关键概念**：Amazon Translate 支持实时与批量翻译，适合多语言内容发布；注意区分 Transcribe（语音转文字）、Textract（OCR）、Translate（文本翻译）。","s":"源#237"},{"id":"D1-112","d":1,"t":"single","q":"一家公司正在使用监督学习，在一个针对特定任务的小型标注数据集上训练一个人工智能模型。这描述的是基础模型（FM）生命周期中的哪一步？","o":[{"l":"A","t":"微调"},{"l":"B","t":"数据选择"},{"l":"C","t":"预训练"},{"l":"D","t":"评估"}],"a":["A"],"e":"**✅ 为什么 A.微调 对**：在小型标注数据集上对基础模型继续训练，使其适配特定任务，正是微调（Fine-tuning）的定义，是基础模型生命周期的关键步骤。\n\n**❌ 为什么其他选项错**：\n- B.数据选择：数据选择指从语料中筛选数据用于训练，不是用标签数据训练模型\n- C.预训练：预训练在无标签的大规模文本上学习通用表示，不使用小型标注数据集\n- D.评估：评估用于衡量模型性能，不是训练步骤\n\n**📌 关键概念**：FM 生命周期：预训练（大规模无监督）→ 微调（有标签小数据集）→ 评估 → 部署；微调用标签数据适配特定任务。","s":"源#241"},{"id":"D1-113","d":1,"t":"single","q":"一家金融公司希望构建用于人工审核机器学习预测的工作流程。该公司希望为其应用场景定义置信度阈值，并随着时间推移对这些阈值进行调整。哪种 AWS 服务能满足这些要求？","o":[{"l":"A","t":"Amazon Personalize"},{"l":"B","t":"Amazon Augmented AI（Amazon A2I）"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"AWS Audit Manager"}],"a":["B"],"e":"**✅ 为什么 B.Amazon Augmented AI（Amazon A2I） 对**：Amazon A2I 支持构建人机协作工作流，对 ML 预测设置置信度阈值，低于阈值的预测交给人工审核，并可随时间调整阈值，正符合题干要求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Personalize：Personalize 是推荐系统服务，用于个性化推荐，无人工审核工作流\n- C.Amazon Inspector：Inspector 是安全合规扫描服务，用于评估工作负载安全漏洞，与人工审核无关\n- D.AWS Audit Manager：Audit Manager 用于持续审计与合规证据收集，不提供模型预测人工审核阈值\n\n**📌 关键概念**：Amazon A2I（Augmented AI）支持人工审核与 ML 预测，配置置信度阈值触发人工介入，适用于金融风控、医疗影像等高要求场景。","s":"源#244"},{"id":"D1-114","d":1,"t":"single","q":"一家公司希望在 AWS 上构建和部署机器学习模型，且无需编写任何代码。哪个 AWS 服务或功能符合这些要求？","o":[{"l":"A","t":"Amazon SageMaker Canvas"},{"l":"B","t":"Amazon Rekognition"},{"l":"C","t":"AWS DeepRacer"},{"l":"D","t":"Amazon Comprehend"}],"a":["A"],"e":"**✅ 为什么 A.Amazon SageMaker Canvas 对**：SageMaker Canvas 是无代码机器学习界面，通过可视化操作构建、训练与部署模型，满足用户无需编写代码的需求。\n\n**❌ 为什么其他选项错**：\n- B.Amazon Rekognition：Rekognition 是图像视频分析 API，提供识别能力，不属于模型训练构建平台\n- C.AWS DeepRacer：DeepRacer 是强化学习赛车的教育工具，不能用于构建通用 ML 模型\n- D.Amazon Comprehend：Comprehend 是自然语言处理 API，直接调用服务，不是构建训练模型的平台\n\n**📌 关键概念**：SageMaker Canvas 面向低代码/无代码用户；区分「调用 AI 服务 API」与「构建模型」两类能力。","s":"源#246"},{"id":"D1-115","d":1,"t":"single","q":"一家公司希望在实验环境中了解生成式人工智能的应用。哪种解决方案能以最经济高效的方式满足这一要求？","o":[{"l":"A","t":"Amazon Q Developer"},{"l":"B","t":"Amazon SageMaker JumpStart"},{"l":"C","t":"Amazon Bedrock Playground"},{"l":"D","t":"Amazon Q Business"}],"a":["C"],"e":"**✅ 为什么 C.Amazon Bedrock Playground 对**：Amazon Bedrock Playground 提供多种基础模型的在线试用环境，可直接在控制台测试模型效果，无需搭建资源即可了解生成式 AI 应用，成本最低。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Q Developer：Q Developer 是代码开发助手，定位为辅助开发，不是了解 GenAI 应用的实验环境\n- B.Amazon SageMaker JumpStart：JumpStart 虽可快速部署模型，但需创建实例资源并承担费用，成本高于控制台试用\n- D.Amazon Q Business：Q Business 面向企业内知识问答应用，用于集成业务环境，并非实验了解环境\n\n**📌 关键概念**：Bedrock Playground（控制台试验场）让用户在模型应用前免费试用、对比模型效果，与 Q Developer 等具体应用场景区分。","s":"源#250"},{"id":"D1-116","d":1,"t":"single","q":"一家公司需要收集大量数据集来训练一个特定内容领域的 AI 助手。哪个数据集能满足这一要求？","o":[{"l":"A","t":"使用相关术语的多样化对话"},{"l":"B","t":"通用历史销售的时间序列数据"},{"l":"C","t":"新闻文章的情感分析"},{"l":"D","t":"独特的产品 ID 及其对应的用户 ID"}],"a":["A"],"e":"**✅ 为什么 A.使用相关术语的多样化对话 对**：训练领域 AI 助手需要大量多样化对话，并覆盖相关领域术语与语境，才能让模型学会该内容领域的专业表达，满足题干「特定内容领域」的数据要求。\n\n**❌ 为什么其他选项错**：\n- B.通用历史销售的时间序列数据：销售时序数据用于预测，且不含对话内容，不适用 AI 助手训练\n- C.新闻文章的情感分析：情感分析标注数据与对话生成无关，领域不匹配\n- D.独特的产品 ID 及其对应的用户 ID：仅产品 ID 与用户 ID 不含语言对话，无法用于助手训练\n\n**📌 关键概念**：训练领域 AI 助手需要包含领域术语的高质量对话数据（语料），数据质量与领域对齐是模型效果关键。","s":"源#251"},{"id":"D1-117","d":1,"t":"single","q":"一位对机器学习知之甚少的人工智能从业者想要预测员工流失情况，但又不想编写代码。哪个 Amazon SageMaker 功能满足此要求？","o":[{"l":"A","t":"SageMaker Canvas（Amazon SageMaker Canvas）"},{"l":"B","t":"SageMaker Clarify"},{"l":"C","t":"SageMaker Model Monitor"},{"l":"D","t":"SageMaker 数据抓取器"}],"a":["A"],"e":"**✅ 为什么 A.SageMaker Canvas（Amazon SageMaker Canvas） 对**：SageMaker Canvas 提供无代码可视化界面，用户无需编写代码即可构建、训练与部署模型，适合对 ML 知之甚少的从业者进行员工流失预测。\n\n**❌ 为什么其他选项错**：\n- B.SageMaker Clarify：Clarify 用于模型可解释性与数据偏差检测，不具备无代码建模功能\n- C.SageMaker Model Monitor：Model Monitor 监控生产模型质量，不用于构建模型\n- D.SageMaker 数据抓取器：题干「数据抓取器」应为 Data Wrangler 的误译，Data Wrangler 只处理数据准备，不提供建模与预测\n\n**📌 关键概念**：SageMaker Canvas 主打无代码构建模型，面向业务分析场景；Clarify 负责可解释性、Model Monitor 负责监控、Data Wrangler 负责数据准备，功能定位分明。","s":"源#253"},{"id":"D1-118","d":1,"t":"single","q":"一家公司拥有一个机器学习模型。该公司想知道该模型是如何进行预测的。哪个术语指的是理解模型预测？","o":[{"l":"A","t":"模型可解析性"},{"l":"B","t":"模型训练"},{"l":"C","t":"模型互操作性"},{"l":"D","t":"模型性能"}],"a":["A"],"e":"**✅ 为什么 A.模型可解析性 对**：模型可解析性（Explainability）指理解模型如何做出预测、能解释预测背后的依据，正是题干询问的概念。\n\n**❌ 为什么其他选项错**：\n- B.模型训练：训练是模型构建学习过程，不是理解预测的概念\n- C.模型互操作性：互操作性指模型与其他系统或组件协同工作的能力，与预测理解无关\n- D.模型性能：性能指准确度、召回率等指标表现，不涉及预测过程解释\n\n**📌 关键概念**：可解析性（Explainability/Interpretability）是理解模型预测原因的能力，SHAP 值、特征重要性等工具与 SageMaker Clarify 提供支持。","s":"源#255"},{"id":"D1-119","d":1,"t":"single","q":"一家公司希望根据客户的个人特征和购买模式来确定客户群体。公司应该使用哪种算法来满足这一要求？","o":[{"l":"A","t":"K 近邻（K-NN）"},{"l":"B","t":"K 均值算法"},{"l":"C","t":"决策树"},{"l":"D","t":"支持向量机"}],"a":["B"],"e":"**✅ 为什么 B.K 均值算法 对**：K 均值（K-Means）是无监督聚类算法，把相似对象按特征自动分为 K 个簇，用于客户细分（根据个人特征与购买模式识别客户群体）正合适。\n\n**❌ 为什么其他选项错**：\n- A.K 近邻（K-NN）：K-NN 是监督学习分类/回归算法，需要标签数据，不用于自动聚类\n- C.决策树：决策树是监督学习分类算法，需要标签数据，不能自动发现客户群体\n- D.支持向量机：SVM 是监督学习分类算法，用于有标签的分类，无法用于无标签的细分\n\n**📌 关键概念**：K-Means 是无监督聚类算法，适用客户画像细分等无标签场景；K-NN 是监督算法，两者仅名字相似、本质不同。","s":"源#256"},{"id":"D1-120","d":1,"t":"single","q":"一家公司希望利用人工反馈来微调基础模型（FM），从而对训练数据集进行标注，但该公司不想开发标注应用程序或管理标注人员团队。哪个 AWS 服务或功能符合这些要求？","o":[{"l":"A","t":"Amazon SageMaker 数据转换器"},{"l":"B","t":"Amazon SageMaker Ground Truth Plus"},{"l":"C","t":"Amazon Transcribe"},{"l":"D","t":"Amazon Macie"}],"a":["B"],"e":"**✅ 为什么 B.Amazon SageMaker Ground Truth Plus 对**：SageMaker Ground Truth Plus 是托管的标注服务，提供标注人员与标注平台，无需自建标注应用或管理团队，正符合题干「不想开发标注应用程序或管理标注人员团队」的要求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon SageMaker 数据转换器：SageMaker 无「数据转换器」服务名，可能为 Data Wrangler 误译，该服务是数据预处理，不提供人工标注\n- C.Amazon Transcribe：Transcribe 将语音转文字，不用于数据标注\n- D.Amazon Macie：Macie 用于数据安全与敏感信息发现，不提供人工标注\n\n**📌 关键概念**：SageMaker Ground Truth 支持自建标注应用与管理团队，而 Ground Truth Plus 提供全托管人工标注服务，免去平台搭建与团队管理成本。","s":"源#259"},{"id":"D1-121","d":1,"t":"single","q":"一家公司正在开发一款生成式人工智能工具。该公司将利用内部文件来定制基础模型（FM）。哪种方法能满足这一要求？","o":[{"l":"A","t":"分类"},{"l":"B","t":"持续预训练"},{"l":"C","t":"蒸馏"},{"l":"D","t":"回归分析"}],"a":["B"],"e":"**✅ 为什么 B.持续预训练 对**：持续预训练（继续预训练）在基础模型上使用公司内部文档继续训练，使模型内化公司上下文与业务知识，实现模型的定制与领域适配。\n\n**❌ 为什么其他选项错**：\n- A.分类：分类是模型的应用任务类型，不是定制基础模型的方法\n- C.蒸馏：模型蒸馏（Distillation）是将大模型知识迁移到小模型的技术，与内部文档定制无直接关联\n- D.回归分析：回归分析用于数值预测建模，不是生成模型定制方法\n\n**📌 关键概念**：继续预训练（Continued Pre-training）用领域文档让基础模型学习新知识，与微调（Supervised Fine-tuning）的标注数据不同；均属 FM 定制手段。","s":"源#261"},{"id":"D1-122","d":1,"t":"single","q":"一家公司正在使用Amazon SageMaker Model Monitor来监控一个预测模型。该公司注意到数据漂移已超出设定的阈值。该公司希望减轻对预测模型可能产生的不利影响。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"重启 SageMaker AI 端点。"},{"l":"B","t":"调整监测灵敏度。"},{"l":"C","t":"使用新数据重新训练模型。"},{"l":"D","t":"建立实验跟踪机制。"}],"a":["C"],"e":"**✅ 为什么 C.使用新数据重新训练模型 对**：模型 Monitor 检测到数据漂移超标，说明生产数据分布已偏离训练数据，此时应用新数据重新训练模型（或微调），使模型适应当前数据分布，消除漂移对预测的不利影响。\n\n**❌ 为什么其他选项错**：\n- A.重启 SageMaker AI 端点：重启端点不改变模型权重，无法修复数据漂移问题\n- B.调整监测灵敏度：调灵敏度只改变告警触发，不修复漂移对模型的影响\n- D.建立实验跟踪机制：实验跟踪记录实验过程，不处理漂移本身\n\n**📌 关键概念**：数据漂移（Data Drift）意味着分布变化，需重新训练或微调模型；Model Monitor 用于检测，重新训练用于修复，监控与重训形成闭环。","s":"源#262"},{"id":"D1-123","d":1,"t":"single","q":"一家金融公司使用生成式人工智能模型为新客户分配信用额度。该公司希望让其客户更清楚地了解该模型的决策过程。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"使用基于规则的系统，而非机器学习模型。"},{"l":"B","t":"应用可解析的人工智能技术，向客户展示哪些因素影响了模型的决策。"},{"l":"C","t":"为客户开发一个交互式用户界面，并提供关于系统的清晰技术说明。"},{"l":"D","t":"提高模型的准确性以降低对透明度的需求。"}],"a":["B"],"e":"**✅ 为什么 B.应用可解析的人工智能技术，向客户展示哪些因素影响了模型的决策 对**：可解释性 AI 技术揭示影响模型决策的关键因素，使客户理解信用额度如何分配，提高决策透明度，符合题干「让客户更清楚了解决策过程」的要求。\n\n**❌ 为什么其他选项错**：\n- A.使用基于规则的系统，而非机器学习模型：改用规则系统可能牺牲灵活性，并非题干要求方向，也未提升现有模型透明度\n- C.为客户开发一个交互式用户界面，并提供关于系统的清晰技术说明：界面与技术说明是展示形式，不真正解释决策原因\n- D.提高模型的准确性以降低对透明度的需求：准确性不解决透明度问题，反而可能更复杂难以解释\n\n**📌 关键概念**：可解释性（XAI）工具 SHAP 值等让黑盒模型决策可理解，适合信用、风控等监管合规场景；SageMaker Clarify 提供 XAI 能力。","s":"源#263"},{"id":"D1-124","d":1,"t":"single","q":"一家公司将其模型部署到生产环境中。四个月后，模型的推理质量下降了。该公司希望在模型推理质量下降时收到通知，并且希望确保此类不再发生。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"重新训练模型。使用 Amazon SageMaker Clarify 监控模型漂移。"},{"l":"B","t":"重新训练模型。使用 Amazon SageMaker Model Monitor监控模型漂移。"},{"l":"C","t":"构建新模型。使用 Amazon SageMaker 特征存储监控模型漂移。"},{"l":"D","t":"构建新模型。使用 Amazon SageMaker JumpStart 监控模型漂移。"}],"a":["B"],"e":"**✅ 为什么 B.重新训练模型。使用 Amazon SageMaker Model Monitor监控模型漂移。 对**：Model Monitor 持续监控生产模型的推理质量与数据/模型漂移，检测到质量下降时报警，配合重新训练使模型适应新分布，正好满足题干「质量下降时收到通知并确保不再发生」的要求。\n\n**❌ 为什么其他选项错**：\n- A.重新训练模型。使用 Amazon SageMaker Clarify 监控模型漂移。：Clarify 做模型可解释性、偏差分析与数据检测，不承担生产监控告警\n- C.构建新模型。使用 Amazon SageMaker 特征存储监控模型漂移。：特征存储用于共享特征数据，不是监控工具，且「构建新模型」无法修复漂移\n- D.构建新模型。使用 Amazon SageMaker JumpStart 监控模型漂移。：JumpStart 提供预训练模型部署，不是监控服务，且重新构建效率低于重新训练\n\n**📌 关键概念**：SageMaker Model Monitor 是生产模型监控与漂移检测工具；Clarify 是解释工具，Feature Store 是特征库，JumpStart 是模板库，四者职责不同。","s":"源#264"},{"id":"D1-125","d":1,"t":"single","q":"以下哪个选项是无监督学习的例子？","o":[{"l":"A","t":"一种根据客户购买历史对其进行分组的模型"},{"l":"B","t":"一种将图像分类为狗或猫的模型"},{"l":"C","t":"一种基于多种特征来预测房屋价格的模型"},{"l":"D","t":"一种通过反复试验来学习下棋的模型"}],"a":["A"],"e":"**✅ 为什么 A.一种根据客户购买历史对其进行分组的模型对**：根据购买历史\"分组\"客户是聚类任务——无预定义标签，模型自动发现相似客户群。这是无监督学习的典型应用。\n\n**❌ 为什么其他选项错**：\n- B.一种将图像分类为狗或猫的模型：分类到已知类别（狗/猫）= 监督学习\n- C.一种基于多种特征来预测房屋价格的模型：价格预测 = 回归 = 监督学习\n- D.一种通过反复试验来学习下棋的模型：试错学习 = 强化学习\n\n**📌 关键概念**：无监督学习标志——无预定义标签、发现隐藏模式/分组。监督学习标志——有标签、预测已知类别/数值。","s":"源#265"},{"id":"D1-126","d":1,"t":"single","q":"一位人工智能从业者想要评估机器学习模型。该从业者希望向客户和利益相关者提供模型预测的解析。哪种 AWS 服务或功能能满足这些要求？","o":[{"l":"A","t":"Amazon QuickSight"},{"l":"B","t":"Amazon Comprehend"},{"l":"C","t":"AWS Trusted Advisor（可信顾问）"},{"l":"D","t":"Amazon SageMaker Clarify"}],"a":["D"],"e":"**✅ 为什么 D.Amazon SageMaker Clarify 对**：SageMaker Clarify 提供模型预测的解释能力，生成可解释性报告（特征贡献、SHAP 值），向客户与利益相关者分享模型预测的解释，满足透明性与可解释性要求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon QuickSight：QuickSight 是 BI 可视化与商业分析工具，不提供模型解释\n- B.Amazon Comprehend：Comprehend 是 NLP 文本分析服务，不用于解释 ML 模型\n- C.AWS Trusted Advisor（可信顾问）：Trusted Advisor 提供账号合规与成本建议，与模型解释无关\n\n**📌 关键概念**：Clarify 提供特征归因（SHAP）与偏置检测，是 SageMaker 可解释性核心工具；QuickSight 用于数据可视化，两者能力不同。","s":"源#268"},{"id":"D1-127","d":1,"t":"single","q":"情感分析属于人工智能中哪个更广泛的领域？","o":[{"l":"A","t":"计算机视觉"},{"l":"B","t":"机器人技术"},{"l":"C","t":"自然语言处理（NLP）"},{"l":"D","t":"时间序列预测"}],"a":["C"],"e":"**✅ 为什么 C.自然语言处理（NLP） 对**：情感分析处理的是文本语言数据，通过 NLP 技术识别文本中的情绪倾向（积极/消极/中性），情感分析是 NLP 的典型应用，属于自然语言处理领域。\n\n**❌ 为什么其他选项错**：\n- A.计算机视觉：计算机视觉处理图像视频，与文本情感无关\n- B.机器人技术：机器人技术偏重硬件与自动控制，不是情感分析归属\n- D.时间序列预测：时间序列预测关注按时间排列的数据，情感分析针对文本语义，不匹配\n\n**📌 关键概念**：情感分析（Sentiment Analysis）是自然语言处理（NLP）与文本分类的典型任务，Amazon Comprehend 提供情感分析服务。","s":"源#269"},{"id":"D1-128","d":1,"t":"single","q":"一家公司收到了大量以文本形式呈现的非结构化用户反馈。该公司希望对这些用户反馈的情感倾向进行分析。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"使用大型语言模型（LLM）执行自然语言处理（NLP）以进行情感分析。"},{"l":"B","t":"使用回归算法根据预定义的类别对反馈进行分类。然后，分析用户情绪。"},{"l":"C","t":"使用推荐引擎算法来检测用户情绪。"},{"l":"D","t":"使用时间序列算法根据过往反馈预测用户情绪。"}],"a":["A"],"e":"**✅ 为什么 A.使用大型语言模型（LLM）执行自然语言处理（NLP）以进行情感分析 对**：LLM 可基于 NLP 技术理解非结构化文本语义并输出情感倾向（积极/消极/中性），适合大规模用户反馈情感分析，满足需求。\n\n**❌ 为什么其他选项错**：\n- B.使用回归算法根据预定义的类别对反馈进行分类：回归是数值预测算法，分类用分类模型，且「预定义类别」描述不准确\n- C.使用推荐引擎算法来检测用户情绪：推荐引擎用于推荐物品，非情感分析\n- D.使用时间序列算法根据过往反馈预测用户情绪：时间序列算法适合趋势预测，不用于非结构化文本情感识别\n\n**📌 关键概念**：情感分析是 NLP 分类任务；LLM/LLM 可做情感分类，Comprehend 原生支持情感检测，推荐引擎、回归、时序算法均不适用。","s":"源#271"},{"id":"D1-129","d":1,"t":"single","q":"一家公司希望使用机器学习模型来分析社交媒体上的客户评论。该模型必须判断每条评论是中性、积极还是消极的。哪种模型评估策略能满足这些要求？","o":[{"l":"A","t":"开放式生成"},{"l":"B","t":"文本摘要"},{"l":"C","t":"机器翻译"},{"l":"D","t":"分类"}],"a":["D"],"e":"**✅ 为什么 D.分类 对**：题干要求把每条评论判定为中性、积极或消极之一，即把输入分配到多个预定义类别，这是典型的分类（多分类）任务。\n\n**❌ 为什么其他选项错**：\n- A.开放式生成：开放式生成生成任意文本，不是评估策略，用于文本生成\n- B.文本摘要：文本摘要输出压缩的文本内容，非类别标签判定\n- C.机器翻译：机器翻译把文本从一种语言转换到另一种语言，与情绪判定无关\n\n**📌 关键概念**：分类（Classification）是把样本映射到预定义类别，多分类（中性/积极/消极）是常见场景；注意题干「模型评估策略」表述与考点分类模型不匹配属原题表达问题。","s":"源#273"},{"id":"D1-130","d":1,"t":"single","q":"以下哪个选项是无监督学习的例子？","o":[{"l":"A","t":"根据数据点的相似性将其聚类分组"},{"l":"B","t":"训练一个模型来识别动物图像"},{"l":"C","t":"根据房屋的特征预测房屋的价格"},{"l":"D","t":"根据给定提示生成类似人类的文本"}],"a":["A"],"e":"**✅ 为什么 A.根据数据点的相似性将其聚类分组 对**：聚类是无监督学习的典型任务，聚类算法不需要标签，仅依据数据特征相似性将数据分组，符合「无监督学习」的定义。\n\n**❌ 为什么其他选项错**：\n- B.训练一个模型来识别动物图像：识别图像需要标签数据，属于监督学习分类\n- C.根据房屋的特征预测房屋的价格：价格预测是回归任务，需要标签（房价）属于监督学习\n- D.根据给定提示生成类似人类的文本：文本生成依赖预训练与输入提示，属于生成式 AI，不是无监督学习典型例\n\n**📌 关键概念**：无监督学习在没有标签的数据中发现结构与模式（聚类）；监督学习依赖标注，聚类与分类是两者的典型代表。","s":"源#274"},{"id":"D1-131","d":1,"t":"single","q":"一家拥有大量教育资料的在线学习公司想要使用企业搜索服务。哪种 AWS 服务能满足这些要求？","o":[{"l":"A","t":"Amazon Comprehend 服务"},{"l":"B","t":"Amazon Textract"},{"l":"C","t":"Amazon Kendra"},{"l":"D","t":"Amazon Personalize"}],"a":["C"],"e":"**✅ 为什么 C.Amazon Kendra 对**：Amazon Kendra 是 AWS 的企业搜索服务，面向大量非结构化文档与教育资料建立智能语义搜索索引，提供企业级搜索能力，符合题干企业搜索需求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Comprehend 服务：Comprehend 是 NLP 文本分析，用于情感、实体抽取等，不提供搜索能力\n- B.Amazon Textract：Textract 是 OCR 文本抽取服务，抽取后仍需搜索索引，不直接提供搜索\n- D.Amazon Personalize：Personalize 用于个性化推荐，不具备企业搜索能力\n\n**📌 关键概念**：Kendra 是智能搜索服务，基于机器学习的语义搜索，适合企业知识库、文档检索场景，与 Textract、Comprehend 用途区分。","s":"源#275"},{"id":"D1-132","d":1,"t":"single","q":"一家公司正在使用数据集训练机器学习模型。这些数据集中某些类别的示例数量多于其他类别。该公司希望衡量模型在检测和标注各类别方面的平衡程度。公司应该采用哪个指标？","o":[{"l":"A","t":"准确性"},{"l":"B","t":"召回"},{"l":"C","t":"精度"},{"l":"D","t":"F1 值"}],"a":["D"],"e":"**✅ 为什么 D.F1 值 对**：F1 分数是精确率与召回率的调和平均值，在类别不平衡数据集中能同时兼顾各类别的检出（召回）与正确标注（精确），直接衡量模型在各类别上的平衡程度，符合题干要求。\n\n**❌ 为什么其他选项错**：\n- A.准确性：准确率对类别不平衡数据不敏感，多数类占比较高时准确率会虚高，无法反映少数类的检出平衡\n- B.召回：召回只关注真实正例中被检出的比例，不反映标注的精确性，单看召回无法衡量整体平衡\n- C.精度：精确率只关注被标记为正例中的正确比例，忽略漏检情况，单一指标不能体现平衡\n\n**📌 关键概念**：F1 值是精确率与召回率的调和平均，是类别不平衡场景下衡量模型均衡性能的标准指标，比单看准确率更可靠。","s":"源#277"},{"id":"D1-133","d":1,"t":"single","q":"一家公司正在分析财务交易记录。该公司将这些记录分为个人和商务两类，并将类别信息插入到交易记录中。这描述的是哪个数据准备步骤？","o":[{"l":"A","t":"数据编码"},{"l":"B","t":"数据标注"},{"l":"C","t":"数据规范化"},{"l":"D","t":"数据平衡"}],"a":["B"],"e":"**✅ 为什么 B.数据标注 对**：将财务交易记录划分为个人与商务类别并插入标签，是给数据点附加类别信息的过程，即数据标注，为后续机器学习任务提供监督信号。\n\n**❌ 为什么其他选项错**：\n- A. 数据编码：数据编码是把类别文本转换为数值（如独热编码），题干是打标签而非转码\n- C. 数据规范化：规范化是对数值特征做缩放，使数据落入统一范围，与打标签无关\n- D. 数据平衡：数据平衡是通过过采样或欠采样调整类别分布，不属于插入类别标签的操作\n\n**📌 关键概念**：数据标注（Labeling）是为数据添加标签的过程，是监督学习数据准备的关键步骤。","s":"源#278"},{"id":"D1-134","d":1,"t":"single","q":"一家公司希望从大量的政策文件中提取关键信息，以提高员工的工作效率。哪种生成式人工智能策略能满足这一要求？","o":[{"l":"A","t":"回归分析"},{"l":"B","t":"聚类"},{"l":"C","t":"摘要"},{"l":"D","t":"分类"}],"a":["C"],"e":"**✅ 为什么 C.摘要 对**：摘要生成能从政策文件等大型文档中提取并浓缩关键要点，让员工快速理解并依据重要信息行动，直接满足题干「从大量政策文件中提取关键信息以提升工作效率」的要求。\n\n**❌ 为什么其他选项错**：\n- A.回归分析：回归分析预测连续数值，不处理文档内容提取\n- B.聚类：聚类按相似性把数据分组，是无监督方法，不生成文本摘要\n- D.分类：分类输出预定义类别标签，不提炼文档关键信息\n\n**📌 关键概念**：摘要（Summarization）是生成式 AI 的文本生成任务，NLP 典型应用；回归、聚类、分类是传统 ML 任务，与内容提取无关。","s":"源#279"},{"id":"D1-135","d":1,"t":"single","q":"一家公司正在使用Amazon SageMaker 部署一个模型，用于识别社交媒体帖子中是否包含某些主题。该公司需要展示不同的输入特征如何影响模型的行为。哪个 SageMaker 功能符合这些要求？","o":[{"l":"A","t":"SageMaker 帆布"},{"l":"B","t":"SageMaker Clarify（注：此名称为专有名词，通常不翻译）"},{"l":"C","t":"SageMaker 特征存储库"},{"l":"D","t":"SageMaker Ground Truth"}],"a":["B"],"e":"**✅ 为什么 B.SageMaker Clarify（注：此名称为专有名词，通常不翻译） 对**：SageMaker Clarify 提供模型可解释性工具，能展示不同输入特征如何影响模型行为与预测结果，正符合题干展示特征影响的需求。\n\n**❌ 为什么其他选项错**：\n- A.SageMaker 帆布：SageMaker Canvas 是无代码建模工具，不具备模型解释与特征归因能力\n- C.SageMaker 特征存储库：特征存储库只管理特征数据存取，不解释模型行为\n- D.SageMaker Ground Truth：Ground Truth 负责数据标注，与模型可解释性无关\n\n**📌 关键概念**：SageMaker Clarify 用于检测偏差、特征归因与模型可解释性，配合 Model Cards 实现透明治理。","s":"源#280"},{"id":"D1-136","d":1,"t":"single","q":"一家公司想要评估世界偏远地区的互联网质量。该公司需要收集互联网速度数据，并将数据存储在Amazon RDS 中。该公司将分析每天互联网速度的变化情况。该公司希望创建一个人工智能模型来预测潜在的互联网中断情况。公司应为这项任务收集哪种类型的数据？","o":[{"l":"A","t":"表格数据"},{"l":"B","t":"文本数据"},{"l":"C","t":"时间序列数据"},{"l":"D","t":"音频数据"}],"a":["C"],"e":"**✅ 为什么 C.时间序列数据 对**：互联网速度数据按时间连续采集，公司要分析每天速度变化并预测中断，这类按时间顺序记录的数据正是时间序列数据，可支撑趋势分析与预测建模。\n\n**❌ 为什么其他选项错**：\n- A.表格数据：表格数据是结构化的行列记录，未体现时间顺序这一关键特征\n- B.文本数据：文本数据是非结构化文字，与网速测量无关\n- D.音频数据：音频数据是声音信号，不用于网速监测\n\n**📌 关键概念**：时间序列数据（Time Series）按时间顺序采集，用于趋势分析与预测；网速、股价、传感器读数均为典型时间序列。","s":"源#281"},{"id":"D1-137","d":1,"t":"single","q":"一家公司想要构建一个机器学习模型来检测传感器数据中的异常模式。该公司没有可用于训练的带标签数据。哪种机器学习方法能满足这些要求？","o":[{"l":"A","t":"线性回归"},{"l":"B","t":"分类"},{"l":"C","t":"决策树"},{"l":"D","t":"自编码器"}],"a":["D"],"e":"**✅ 为什么 D.自编码器 对**：自编码器是无监督学习神经网络，无需标签数据即可学习重建正常模式，重建误差大的样本即为异常，正好满足无标签数据下检测异常的需求。\n\n**❌ 为什么其他选项错**：\n- A.线性回归：线性回归是监督回归，需标签且预测连续数值，不做异常检测\n- B.分类：分类需要带标签的训练数据，题干明确无标签\n- C.决策树：决策树是监督学习，需要标签数据训练\n\n**📌 关键概念**：自编码器通过重建误差识别异常；无标签数据场景应选无监督方法（自编码器、聚类等）。","s":"源#282"},{"id":"D1-138","d":1,"t":"single","q":"哪种场景代表了生成式人工智能的实际应用案例？","o":[{"l":"A","t":"利用机器学习模型预测产品需求"},{"l":"B","t":"利用聊天机器人实时为客户提供类似人类的回应来解答客户咨询"},{"l":"C","t":"使用分析仪表板来跟踪网站流量和用户行为"},{"l":"D","t":"实施基于规则的推荐引擎，向客户推荐产品"}],"a":["B"],"e":"**✅ 为什么 B.利用聊天机器人实时为客户提供类似人类的回应来解答客户咨询 对**：聊天机器人基于生成式 AI 动态生成类似人类的自然语言回复，属于生成新内容（文本）的实际应用案例。\n\n**❌ 为什么其他选项错**：\n- A.利用机器学习模型预测产品需求：需求预测输出数值，属于监督回归任务，不生成新内容\n- C.使用分析仪表板跟踪网站流量和用户行为：仪表板是数据分析可视化，不生成内容\n- D.实施基于规则的推荐引擎：基于规则系统按预设逻辑输出，不生成新内容\n\n**📌 关键概念**：生成式 AI 生成文本、图像、音频等新内容；对话机器人、文本生成是典型生成式应用，判别式与规则系统不属此类。","s":"源#285"},{"id":"D1-139","d":1,"t":"single","q":"一家媒体流媒体平台希望根据用户的账户历史记录为用户提供电影推荐。哪种 AWS 服务能满足这些要求？","o":[{"l":"A","t":"Amazon Polly"},{"l":"B","t":"Amazon Comprehend"},{"l":"C","t":"Amazon Transcribe"},{"l":"D","t":"Amazon Personalize"}],"a":["D"],"e":"**✅ 为什么 D.Amazon Personalize 对**：Amazon Personalize 是 AWS 的机器学习推荐服务，能根据用户的账户历史、观看行为与偏好生成个性化电影推荐，媒体流媒体平台利用它可显著提升用户观看体验与留存，正符合题干「根据用户账户历史推荐电影」的需求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Polly：Polly 是文字转语音服务，将文本合成为语音，不提供内容推荐能力\n- B.Amazon Comprehend：Comprehend 做文本分析与实体抽取，用于 NLP 任务，与电影推荐无关\n- C.Amazon Transcribe：Transcribe 是语音转文本服务，负责转录音频，不具备推荐功能\n\n**📌 关键概念**：Personalize 是 AWS 个性化推荐服务，基于用户行为数据训练推荐模型；Polly、Transcribe、Comprehend 分别为 TTS、ASR 与 NLP 分析，用途需区分。","s":"源#287"},{"id":"D1-140","d":1,"t":"single","q":"一家公司开发了一个机器学习模型来批准或拒绝贷款申请。该模型的决策过程必须透明且可解析，以符合监管要求。公司必须记录决策过程以备审计之用。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"Amazon Textract"},{"l":"B","t":"Amazon SageMaker 模型卡"},{"l":"C","t":"AWS CloudFormation"},{"l":"D","t":"Amazon Comprehend"}],"a":["B"],"e":"**✅ 为什么 B.Amazon SageMaker 模型卡 对**：SageMaker 模型卡以结构化方式记录模型目的、训练数据、评估指标、决策过程与局限性，为监管审计提供完整记录，正符合题干透明可解释与审计的要求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Textract：Textract 是 OCR 文档文本提取服务，不记录模型决策\n- C.AWS CloudFormation：CloudFormation 是基础设施编排工具，与模型审计无关\n- D.Amazon Comprehend：Comprehend 是 NLP 分析服务，不提供模型决策文档\n\n**📌 关键概念**：模型卡（Model Card）是模型治理、透明与审计的载体，SageMaker Model Cards 支持记录评估与监管信息。","s":"源#288"},{"id":"D1-141","d":1,"t":"single","q":"一家公司正在开发一种机器学习模型来预测患心脏病的风险。该模型使用患者数据，例如年龄、胆固醇水平、血压、吸烟状况和运动习惯。数据集包含一个目标值，用于表明患者是否患有心脏病。哪种机器学习技术能满足这些要求？","o":[{"l":"A","t":"无监督学习"},{"l":"B","t":"监督学习"},{"l":"C","t":"强化学习"},{"l":"D","t":"半监督学习"}],"a":["B"],"e":"**✅ 为什么 B.监督学习 对**：数据集既包含患者特征（年龄、胆固醇等），又包含目标值（是否患病），用带标签样本学习输入到目标的映射，正是监督学习的定义。\n\n**❌ 为什么其他选项错**：\n- A.无监督学习：无监督学习无标签，从数据中找结构，题干数据带目标标签\n- C.强化学习：强化学习通过试错与环境交互学习策略，不适用静态带标签数据\n- D.半监督学习：半监督用少量标签+大量无标签，题干数据全部有标签\n\n**📌 关键概念**：监督学习基于有标签数据学习映射；分类（患病与否）是典型监督任务，无标签时用无监督。","s":"源#298"},{"id":"D1-142","d":1,"t":"single","q":"一位人工智能从业者在一个训练数据集上训练了一个模型。该模型在训练数据上表现良好。然而，该模型在评估数据上的表现不佳。这个最有可能的原因是什么？","o":[{"l":"A","t":"该模型拟合不足。"},{"l":"B","t":"该模型需要即时的工程设计。"},{"l":"C","t":"该模型存在偏差。"},{"l":"D","t":"该模型过拟合了。"}],"a":["D"],"e":"**✅ 为什么 D.该模型过拟合了。 对**：模型在训练数据上表现良好、在评估数据上表现不佳，是过拟合的典型特征：模型过度学习了训练数据，包括噪声，无法泛化到未见数据。\n\n**❌ 为什么其他选项错**：\n- A.该模型拟合不足。：欠拟合是训练与评估都差，与题干「训练表现良好」矛盾\n- B.该模型需要即时的工程设计。：特征工程无法解释训练集与评估集性能差距\n- C.该模型存在偏差。：偏差通常导致系统性欠拟合，而非仅评估集表现差\n\n**📌 关键概念**：过拟合（Overfitting）指模型学习过多训练数据噪声、泛化能力差；欠拟合则训练与测试均差，两者特征需区分。","s":"源#303"},{"id":"D1-143","d":1,"t":"multiple","q":"一位纪录片导演希望吸引更多观众。该导演希望为其影片自动添加多种语言的字幕和旁白。哪两种步骤组合能满足这些要求？（选择两项。）","o":[{"l":"A","t":"使用Amazon Transcribe和Amazon Translate生成其他语言的字幕。"},{"l":"B","t":"使用Amazon Textract 和Amazon Translate 生成其他语言的字幕。"},{"l":"C","t":"使用Amazon Polly 生成其他语言的旁白。"},{"l":"D","t":"使用Amazon Translate生成其他语言的旁白。"},{"l":"E","t":"使用Amazon Textract 生成其他语言的旁白。"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A.使用Amazon Transcribe和Amazon Translate生成其他语言的字幕。：Transcribe 将语音转为文本字幕，Translate 将字幕翻译成多种语言，两步配合生成多语言字幕\n- C.使用Amazon Polly 生成其他语言的旁白。：Polly 将翻译后的文本合成为逼真语音，用于生成多语言旁白\n\n**❌ 为什么其他选项错**：\n- B.使用Amazon Textract 和Amazon Translate 生成其他语言的字幕。：Textract 从扫描文档提取文本，不处理视频语音\n- D.使用Amazon Translate生成其他语言的旁白。：Translate 只翻译文本，不能生成语音旁白\n- E.使用Amazon Textract 生成其他语言的旁白。：Textract 是文档文本提取，无语音合成能力\n\n**📌 关键概念**：字幕流水线＝Transcribe（语音转文本）→ Translate（文本翻译）；旁白流水线＝Polly（文本转语音）。Textract 用于文档 OCR，不涉语音。","s":"源#305"},{"id":"D1-144","d":1,"t":"hot","q":"从以下列表中为每个用例选择正确的 AWS 服务或工具。每个 AWS 服务或工具只能选择一次或根本不选。","o":[],"a":[],"e":"**✅ 正确配对说明**：本题将 AI 治理场景与 AWS 服务/工具配对。三条配对要点：一、在整个 ML 生命周期中应用人工反馈以提高准确性与相关性，对应 SageMaker Ground Truth（人机协作数据标注与模型改进）；二、落实与负责任 AI 政策一致的保障措施，对应 Amazon Bedrock 安全护栏（Guardrails，负责任 AI 保障）；三、在数据准备与模型训练期间检测潜在偏差，对应 SageMaker Clarify（偏差检测与减轻）。\n\n**❌ 常见配对错误**：\n- 人工反馈误配 Clarify：Clarify 检测偏差并做可解释性，不负责在生命周期中引入人工反馈标注\n- 保障措施误配 Ground Truth：Ground Truth 是做标注，不实施负责任 AI 政策类护栏\n- 偏差检测误配 Bedrock 护栏：Bedrock 护栏约束内容与策略合规，不分析训练数据偏差\n\n**📌 关键概念**：Ground Truth＝人工标注与反馈；Bedrock Guardrails＝负责任 AI 内容护栏；Clarify＝偏差检测与可解释性。三者分工明确，按场景关键词配对。","s":"源#308"},{"id":"D1-145","d":1,"t":"hot","q":"一家公司运用机器学习技术来开发应用程序。从以下列表中为每个任务选择正确的机器学习技术。每个机器学习技术只能选择一次。","o":[],"a":[],"e":"**✅ 正确配对说明**：本题将预测任务与 ML 技术配对。判断依据：判断答案是否正确是二分类（二元是/否决策）；预测物种数量是回归（输出连续数值）；识别汽车型号是多类别分类（从多个类别中选择）。先看输出类型，再匹配技术。\n\n**❌ 常见配对错误**：\n- 二分类误选多类分类：二分类只有两个类别，题干「正确/错误」是二元判断\n- 回归误选分类：回归输出连续数值（物种数量），分类输出离散类别\n- 多类分类与二分类混淆：汽车型号含多个候选类别，是多分类而非二分类\n\n**📌 关键概念**：二分类（Binary）、回归（Regression）、多类别分类（Multiclass）是 ML 三大任务类型，按输出是类别还是数值区分。","s":"源#309"},{"id":"D1-146","d":1,"t":"hot","q":"一家公司正在利用Amazon SageMaker AI 构建人工智能解决方案。该公司希望借助 SageMaker AI 的功能来促进应用程序的开发。从以下列表中为每个用例选择正确的 SageMaker AI 功能。每个功能只能选择一次。","o":[],"a":[],"e":"**✅ 正确配对说明**：本题将业务用例与 SageMaker AI 功能配对。三点：选择最恰当模型用模型卡（Model Cards 总结模型特征供选择）；低代码/无代码准备数据用数据整理器（Data Wrangler）；查明数据偏差或不平衡用 Clarify（偏差检测）。\n\n**❌ 常见配对错误**：\n- 模型选择误用 Clarify：Clarify 做偏差与解释，不总结模型特征\n- 数据准备误用模型卡：模型卡是文档，不提供数据准备界面\n- 偏差检测与模型卡混淆：偏差检测需 Clarify，模型卡只记录说明\n\n**📌 关键概念**：SageMaker AI 生态：Model Cards（文档化）、Data Wrangler（数据准备）、Clarify（偏差/可解释性），按功能关键词配对。","s":"源#310"},{"id":"D1-147","d":1,"t":"hot","q":"从以下列表中为每个陈述选择正确的 AI 术语。每个 AI 术语只能选择一次。","o":[],"a":[],"e":"**✅ 正确配对说明**：本题将 AI 术语与定义配对。模拟人类解决能力对应人工智能（AI，最宽泛概念，涵盖推理与解决）；应用数据驱动学习技术做预测对应机器学习（ML，从数据中学习）；通过复杂神经网络处理数据对应深度学习（DL，多层神经网络）。\n\n**❌ 常见配对错误**：\n- 机器学习与人工智能混淆：AI 是宽泛总称，ML 是其子集，注意涵盖范围差异\n- 深度学习与机器学习混淆：DL 是 ML 的子分支，专指神经网络\n- 将神经网络误配 AI 总称：神经网络是 DL 的实现手段，不覆盖 ML 全部\n\n**📌 关键概念**：层级关系 AI ⊃ ML ⊃ DL；AI 最宽泛，ML 从数据学习，DL 用多层神经网络处理复杂数据。","s":"源#313"},{"id":"D1-148","d":1,"t":"hot","q":"一位人工智能从业者正在确定各种用例的合适数据类型。从以下列表中为每个用例选择正确的数据类型。每个数据类型只能选择一次。","o":[],"a":[],"e":"**✅ 正确配对说明**：本题将用例与数据类型配对。情感分析处理社交媒体帖子文本→文本数据；交通标志识别处理图像→图像数据；广告优化用客户人口统计与购买历史等结构化记录→表格数据；股价预测用历史价格时间序列→时间序列数据。先看数据形态再配对。\n\n**❌ 常见配对错误**：\n- 情感分析误配表格数据：帖子内容是文本，结构化表格不适用\n- 交通标志误配图像以外类型：标志识别本质是计算机视觉，需图像数据\n- 股票价格预测与表格混淆：价格按时间顺序采集是时间序列，非普通表格\n\n**📌 关键概念**：文本/图像/表格/时间序列是四种基本数据类型，按数据形态与任务场景选择。","s":"源#314"},{"id":"D1-149","d":1,"t":"hot","q":"从以下列表中选择并按顺序排列步骤，以正确描述新自定义模型的机器学习生命周期。每个步骤只能选择一次。","o":[],"a":[],"e":"**✅ 正确配对说明**：本题要求按顺序排列自定义模型的机器学习生命周期步骤。标准生命周期顺序：定义业务问题并明确成功标准 → 收集与准备数据（清洗、标注）→ 特征工程 → 选择模型并训练 → 评估模型性能 → 部署到生产 → 监控与持续改进。每个步骤只能选一次，按「先数据、再训练、后部署」的主线排序。\n\n**❌ 常见配对错误**：\n- 数据准备与特征工程顺序颠倒：先清洗标注原始数据，再做特征提取与选择\n- 模型评估与训练混淆：训练在前、评估验证性能在后，评估是训练后检查\n- 部署与监控阶段错位：先部署上线，再持续监控，监控是部署后的运维环节\n\n**📌 关键概念**：ML 生命周期（数据准备→训练→评估→部署→监控）是考纲域 1 核心流程；SageMaker 提供全流程工具链支撑。","s":"源#316"},{"id":"D1-150","d":1,"t":"single","q":"一家公司希望开发一种可解析的机器学习模型来评估贷款申请的风险。哪种类型的机器学习模型或算法能满足这些要求？","o":[{"l":"A","t":"深度学习模型"},{"l":"B","t":"逻辑回归模型"},{"l":"C","t":"K 均值算法"},{"l":"D","t":"随机切割森林算法"}],"a":["B"],"e":"**✅ 为什么 B.逻辑回归模型 对**：逻辑回归系数直接表示各特征对风险结果的影响方向与强度，模型透明且易于解释，适合贷款风险评估这类对可解释性要求高的场景。\n\n**❌ 为什么其他选项错**：\n- A.深度学习模型：深度学习多层非线性变换，内部机制黑盒，可解释性差\n- C.K 均值算法：K 均值是无监督聚类，输出簇标签，不输出风险概率\n- D.随机切割森林算法：RCF 用于异常检测，输出异常分数，且整体解释性弱于逻辑回归\n\n**📌 关键概念**：逻辑回归（Logistic Regression）是线性可解释模型，输出分类概率；金融风控常用可解释模型满足监管透明度要求。","s":"源#319"},{"id":"D1-151","d":1,"t":"single","q":"一家公司存储客户的个人身份信息（PII）数据。该公司必须将 PII 数据存储在其所在的 AWS 区域内。这描述的是治理的哪个方面？","o":[{"l":"A","t":"数据挖掘"},{"l":"B","t":"数据驻留"},{"l":"C","t":"预训练偏差"},{"l":"D","t":"地理位置路由"}],"a":["B"],"e":"**✅ 为什么 B.数据驻留 对**：数据驻留（Data Residency）指数据必须保留在特定地理位置或区域，公司将 PII 数据存储在所在 AWS 区域内正是数据驻留的治理要求。\n\n**❌ 为什么其他选项错**：\n- A.数据挖掘：数据挖掘是从数据中提取模式，与数据存储位置无关\n- C.预训练偏差：预训练偏差指模型训练数据的偏差，与数据存放区域无关\n- D.地理位置路由：地理位置路由是网络请求调度，不描述数据存储约束\n\n**📌 关键概念**：数据驻留（Data Residency）与数据主权相关，要求数据留在指定区域；PII 存储合规是治理重点。","s":"源#320"},{"id":"D1-152","d":1,"t":"single","q":"一家公司希望实施生成式人工智能解决方案以改进其营销业务。该公司希望在接下来的 6 个月内增加收入。哪种方法能满足这些要求？","o":[{"l":"A","t":"立即利用公司现有的数据开始训练一个定制的 FM 模型。"},{"l":"B","t":"进行利益相关者访谈，以完善用例并设定可衡量的目标。"},{"l":"C","t":"实施一个预先构建好的人工智能助手解决方案，并衡量其对客户满意度的影响。"},{"l":"D","t":"分析行业内的 AI 应用实例，并复制其中最成功的特性。"}],"a":["C"],"e":"**✅ 为什么 C.实施一个预先构建好的人工智能助手解决方案，并衡量其对客户满意度的影响。 对**：预构建 AI 助手可快速部署生成式 AI，无需花时间成本训练定制模型，6 个月内即可产生可衡量的业务影响，满足加快收入增长的目标。\n\n**❌ 为什么其他选项错**：\n- A.立即利用公司现有的数据开始训练一个定制的 FM 模型。：从零训练定制 FM 周期长、成本高，6 个月难以见效\n- B.进行利益相关者访谈，以完善用例并设定可衡量的目标。：访谈只完善目标，不直接带来收入增长\n- D.分析行业内的 AI 应用实例，并复制其中最成功的特性。：复制特性缺乏针对性，未必能转化为本司收入提升\n\n**📌 关键概念**：预构建 AI 助手（Pre-built Assistant）是快速落地生成式 AI 的路径；定制训练耗时长，追求快速 ROI 时优先采用现成方案。","s":"源#321"},{"id":"D1-153","d":1,"t":"single","q":"一家医疗保健公司希望创建一个模型，通过分析患者的声音来改进疾病诊断。为此，该公司已录制了数百名患者的声音。该公司目前正在根据时长和语言对语音记录进行筛选。机器学习生命周期的哪个阶段描述了当前项目所处的阶段？","o":[{"l":"A","t":"数据收集"},{"l":"B","t":"数据预处理"},{"l":"C","t":"特征工程"},{"l":"D","t":"模型训练"}],"a":["B"],"e":"**✅ 为什么 B.数据预处理 对**：按时长和语言筛选语音记录是对原始数据进行清理与准备，保证数据质量与一致性，属于数据预处理阶段。\n\n**❌ 为什么其他选项错**：\n- A.数据收集：数据收集指获取原始数据，筛选已在录制完成后的处理阶段\n- C.特征工程：特征工程是构造或选择特征，筛选记录不是特征构建\n- D.模型训练：模型训练用处理好的数据训练模型，尚未到该阶段\n\n**📌 关键概念**：数据预处理（Preprocessing）在数据收集后、特征工程与训练前，含清洗、筛选、格式统一等操作。","s":"源#322"},{"id":"D1-154","d":1,"t":"single","q":"一家公司希望根据从数据集中提取的自定义特征对不同物体的图像进行分类。哪种解决方案能以最少的开发工作量满足这一要求？","o":[{"l":"A","t":"使用从数据集中提取的自定义特征的传统机器学习算法。"},{"l":"B","t":"使用预训练的深度学习模型。在数据集上对模型进行微调。"},{"l":"C","t":"使用生成对抗网络（GAN）模型对图像进行分类。"},{"l":"D","t":"使用具有手动设计特征的支持向量机（SVM）进行分类。"}],"a":["B"],"e":"**✅ 为什么 B.使用预训练的深度学习模型。在数据集上对模型进行微调。 对**：预训练模型已学习通用图像特征，微调只需少量定制数据调整，开发工作量最少，正是题干「以最少的开发工作量」的关键。\n\n**❌ 为什么其他选项错**：\n- A.使用从数据集中提取的自定义特征的传统机器学习算法。：传统算法需手动设计特征提取流程，开发量大\n- C.使用生成对抗网络（GAN）模型对图像进行分类。：GAN 用于生成图像，不用于图像分类\n- D.使用具有手动设计特征的支持向量机（SVM）进行分类。：手动设计特征工作量大，成本高\n\n**📌 关键概念**：迁移学习（Transfer Learning）通过微调预训练模型降低开发成本，是少数据、少工作量场景的首选方案。","s":"源#326"},{"id":"D1-155","d":1,"t":"single","q":"一位人工智能从业者必须对一个开源的大语言模型（LLM）进行微调，以用于文本分类。数据集已经准备好了。哪种解决方案能以最少的操作努力满足这些要求？","o":[{"l":"A","t":"在Amazon Bedrock 的 PartyRock 中创建自定义模型训练任务。"},{"l":"B","t":"使用 Amazon SageMaker JumpStart 创建训练任务。"},{"l":"C","t":"使用自定义脚本运行 Amazon SageMaker AI 模型训练任务。"},{"l":"D","t":"在Amazon EC2 实例上创建一个 Jupyter 笔记本。使用该笔记本训练模型。"}],"a":["B"],"e":"**✅ 为什么 B.使用 Amazon SageMaker JumpStart 创建训练任务。 对**：SageMaker JumpStart 提供开箱即用的开源模型微调工作流，无需编写大量自定义代码，运营工作量最小。\n\n**❌ 为什么其他选项错**：\n- A.在Amazon Bedrock 的 PartyRock 中创建自定义模型训练任务。：PartyRock 是 Bedrock 的生成式 AI 实验应用，不提供 LLM 训练任务\n- C.使用自定义脚本运行 Amazon SageMaker AI 模型训练任务。：自定义脚本需自行维护训练环境与流程，运营成本高\n- D.在Amazon EC2 实例上创建一个 Jupyter 笔记本。使用该笔记本训练模型。：EC2 上自建环境需手动配置 GPU 等资源，运维负担大\n\n**📌 关键概念**：JumpStart 是 SageMaker 的预训练模型与解决方案中心，支持一键微调部署；对比自建脚本与 EC2，运营成本最低。","s":"源#332"},{"id":"D1-156","d":1,"t":"single","q":"一家公司正在利用生成式人工智能模型开发一款产品推荐应用程序。该公司必须将该应用程序对环境的影响降到最低。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"优化已部署的模型架构，以在模型推理过程中优先考虑计算效率。"},{"l":"B","t":"采用分布式推理方法，在多个可用区使用多个较小的模型。"},{"l":"C","t":"采用混合策略，在本地部署模型，并将数据存储在 AWS 上。"},{"l":"D","t":"部署多个模型，并使用一种动态模型选择机制，该机制随机查询不同的模型。"}],"a":["A"],"e":"**✅ 为什么 A.优化已部署的模型架构，以在模型推理过程中优先考虑计算效率。 对**：优化模型架构提升推理计算效率，直接减少推理所需算力与能源，是降低生成式 AI 应用环境影响的关键。\n\n**❌ 为什么其他选项错**：\n- B.采用分布式推理方法，在多个可用区使用多个较小的模型。：多实例部署增加资源消耗，反而可能提高碳足迹\n- C.采用混合策略，在本地部署模型，并将数据存储在 AWS 上。：混合部署不解决推理算力效率问题\n- D.部署多个模型，并使用一种动态模型选择机制，该机制随机查询不同的模型。：随机查询多模型增加调用量与能耗，不降环境影响\n\n**📌 关键概念**：绿色 AI 关注推理效率，通过架构优化、量化剪枝等减少算力与能耗，多部署并非环保方案。","s":"源#338"},{"id":"D1-157","d":1,"t":"single","q":"一家公司使用Amazon SageMaker 人工智能生成多语言的文章摘要。该公司需要一个指标来评估多语言摘要翻译的质量。哪种评估指标能满足这些要求？","o":[{"l":"A","t":"基于召回率的摘要评估工具（ROUGE）"},{"l":"B","t":"双语评估参考译文（BLEU）"},{"l":"C","t":"受试者工作特征曲线下的面积（AUC）"},{"l":"D","t":"精度"}],"a":["B"],"e":"**✅ 为什么 B.双语评估参考译文（BLEU） 对**：BLEU 衡量机器翻译输出与参考译文的接近程度，是评估翻译质量的经典指标，正适合评估多语言摘要翻译质量。\n\n**❌ 为什么其他选项错**：\n- A.基于召回率的摘要评估工具（ROUGE）：ROUGE 评估摘要与参考摘要的重叠，侧重召回，不直接评估翻译质量\n- C.受试者工作特征曲线下的面积（AUC）：AUC 评估二分类模型区分度，与翻译质量无关\n- D.精度：精度是分类或检索指标，不衡量翻译与参考译文的相似度\n\n**📌 关键概念**：BLEU 是翻译质量指标（n-gram 匹配），ROUGE 是摘要指标，两者用途不可混淆；AUC 用于分类。","s":"源#339"},{"id":"D1-158","d":1,"t":"single","q":"一家研究公司正在培养微生物。该公司在没有任何关于培养区域的先验标注数据的情况下拍摄了培养物的图像。该公司需要识别图像中显示培养物生长的区域。哪种机器学习技术能满足这些要求？","o":[{"l":"A","t":"逻辑回归"},{"l":"B","t":"决策树"},{"l":"C","t":"聚类"},{"l":"D","t":"维度约简"}],"a":["C"],"e":"**✅ 为什么 C.聚类 对**：聚类无需标注数据，可将相似像素或区域自动分组，从而在培养图像中识别出生长区域的视觉特征，符合无标注数据下识别区域的需求。\n\n**❌ 为什么其他选项错**：\n- A.逻辑回归：逻辑回归是监督分类，需带标签数据，题干无标注\n- B.决策树：决策树是监督方法，需要带标签数据训练\n- D.维度约简：维度约简降低特征维度，不直接识别区域\n\n**📌 关键概念**：聚类是无监督学习，适合无标签场景下的模式发现；监督方法需标注数据，不可用于无标注任务。","s":"源#340"},{"id":"D1-159","d":1,"t":"multiple","q":"一家公司希望其人工智能模型具有透明度和可解析性。哪种 Amazon SageMaker AI 功能的组合能满足这些要求？（选择两项。）","o":[{"l":"A","t":"SageMaker Model Cards"},{"l":"B","t":"SageMaker Pipelines"},{"l":"C","t":"SageMaker Clarify"},{"l":"D","t":"SageMaker Model Monitor"},{"l":"E","t":"SageMaker Debugger"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A.SageMaker Model Cards：模型卡结构化记录模型的预期用途、训练数据、性能与局限，提高透明度\n- C.SageMaker Clarify：Clarify 检测偏差并提供特征归因，使模型决策可解析、可理解\n\n**❌ 为什么其他选项错**：\n- B.SageMaker Pipelines：Pipelines 编排 ML 工作流，不直接提供模型文档或解释\n- D.SageMaker Model Monitor：Model Monitor 监控生产数据漂移，不解决透明度与可解析性\n- E.SageMaker Debugger：Debugger 监控训练过程指标，不提供模型解释与文档化\n\n**📌 关键概念**：透明与可解析性的核心工具是 Model Cards（文档）与 Clarify（特征归因）；Pipelines、Monitor、Debugger 属工程与运维工具。","s":"源#351"},{"id":"D1-160","d":1,"t":"hot","q":"一家公司希望利用机器学习来提高客户参与度和销售额。该公司已收集了一个庞大的数据集，其中包括客户的人口统计信息、购买历史、浏览模式和产品评价。从以下列表中为每个用例选择正确的机器学习方法。每个机器学习方法只能选择一次。","o":[],"a":[],"e":"**✅ 正确配对说明**：本题将客户分析用例与机器学习方法配对。客户终身价值是连续数值预测，属回归；客户停止服务的可能性是二元结果预测，属二分类；根据相似行为偏好分组需识别自然模式且无预设标签，属聚类。按「数值→回归、二分类→分类、无标签分组→聚类」配对。\n\n**❌ 常见配对错误**：\n- 回归与分类混淆：回归输出连续数值（客户终身价值），分类输出类别（是否流失）\n- 二分类误用聚类：二分类是监督学习需标签，聚类无标签\n- 聚类误配回归：聚类找分组，回归预测数值，输出形态不同\n\n**📌 关键概念**：回归（数值）、二分类（类别）、聚类（无监督分组）三种方法按输出与标签类型区分，是域 1 基础考点。","s":"源#352"},{"id":"D1-161","d":1,"t":"hot","q":"一家公司想要构建一个新的机器学习解决方案。该公司已经拥有数据。在构建解决方案之前，该公司需要了解机器学习的生命周期。从以下列表中选择并按顺序排列步骤，以正确描述机器学习的生命周期。每个步骤只能选择一次。","o":[],"a":[],"e":"**✅ 正确配对说明**：本题要求按顺序排列 ML 生命周期步骤。标准顺序：准备并清理可用数据 → 训练模型 → 评估模型性能 → 部署到生产用于实际应用。每步只能选一次，按「数据先行、训练随后、评估验证、部署收尾」主线排序。\n\n**❌ 常见配对错误**：\n- 评估与部署顺序颠倒：先评估验证性能，合格后才部署\n- 训练与数据准备颠倒：先准备数据，再训练\n- 部署放训练前：部署在生产环境应用，只能在模型评估之后\n\n**📌 关键概念**：ML 生命周期（准备数据→训练→评估→部署）是域 1 核心流程，顺序不可颠倒。","s":"源#353"},{"id":"D1-162","d":1,"t":"single","q":"哪项任务描述了智能文档处理（IDP）的一个用例？","o":[{"l":"A","t":"预测欺诈交易"},{"l":"B","t":"个性化产品供应"},{"l":"C","t":"分析用户反馈并进行情感分析"},{"l":"D","t":"从扫描文件中自动提取并格式化数据"}],"a":["D"],"e":"**✅ 为什么 D.从扫描文件中自动提取并格式化数据 对**：IDP（智能文档处理）利用 OCR 与 AI 从扫描件、PDF 中自动提取、分类并结构化数据，正符合题干「自动提取并格式化数据」的定义。\n\n**❌ 为什么其他选项错**：\n- A.预测欺诈交易：欺诈预测是异常检测任务，不涉及文档提取\n- B.个性化产品供应：个性化推荐属推荐系统，与文档处理无关\n- C.分析用户反馈并进行情感分析：情感分析是 NLP 分类任务，不涉及文档结构化提取\n\n**📌 关键概念**：智能文档处理（IDP）＝OCR+AI 从非结构化文档提取结构化数据；服务包括 Textract 等。","s":"源#354"},{"id":"D1-163","d":1,"t":"single","q":"一家电子商务公司正在开发一款人工智能应用程序，用于对产品图片进行分类并提取规格信息。该应用程序将使用高质量的标注数据集来定制基础模型（FM），以生成准确的响应。使用Amazon Bedrock，哪种机器学习技术能满足这些要求？","o":[{"l":"A","t":"继续进行预训练"},{"l":"B","t":"创建一个代理"},{"l":"C","t":"进行微调"},{"l":"D","t":"发展即时工程"}],"a":["C"],"e":"**✅ 为什么 C.进行微调 对**：微调利用高质量带标签数据集对基础模型定制，使模型学习特定领域模式，正适合电商产品图片分类与规格提取的需求。\n\n**❌ 为什么其他选项错**：\n- A.继续进行预训练：预训练用无标签数据提升领域知识，不做带标签图像分类适配\n- B.创建一个代理：代理负责编排工具调用，不直接定制模型能力\n- D.发展即时工程：提示工程优化输入提示，不改变模型权重，精度有限\n\n**📌 关键概念**：微调（Fine-tuning）用带标签数据适配特定任务；持续预训练用无标签数据增广知识，两者用途不同。","s":"源#356"},{"id":"D1-164","d":1,"t":"single","q":"一家公司正在使用Amazon SageMaker 人工智能来开发人工智能/机器学习解决方案。该公司必须仅使用经批准的数据进行模型训练。这些人工智能/机器学习解决方案必须符合公司政策和道德准则。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"Amazon SageMaker 目录"},{"l":"B","t":"Amazon SageMaker Clarify"},{"l":"C","t":"Amazon SageMaker Model Registry"},{"l":"D","t":"Amazon SageMaker Model Cards"}],"a":["A"],"e":"**✅ 为什么 A.Amazon SageMaker 目录 对**：Amazon SageMaker 目录（Catalog）用于集中管理、审批和控制可用于模型训练的数据集与资产，确保组织只使用经批准的数据，同时满足公司政策与道德准则要求，正是题干「仅用经批准数据且符合政策」的治理方案。\n\n**❌ 为什么其他选项错**：\n- B.Amazon SageMaker Clarify：Clarify 检测数据与模型偏差、提供可解释性，不负责数据资产审批\n- C.Amazon SageMaker Model Registry：Model Registry 管理模型版本与审批，不控制训练数据准入\n- D.Amazon SageMaker Model Cards：Model Cards 记录模型文档与评估信息，不实施数据治理\n\n**📌 关键概念**：SageMaker 目录提供数据资产治理、审批与访问控制，是负责任 AI 与合规的关键组件；与 Model Registry（模型治理）、Clarify（偏差分析）分工不同。","s":"源#359"},{"id":"D1-165","d":1,"t":"single","q":"一家公司使用一个开源的预训练模型来分析新发布产品用户的感受。根据 MLOps 最佳实践，公司必须执行哪项操作？","o":[{"l":"A","t":"利用深度学习进行超参数调优。"},{"l":"B","t":"收集用户评论，并将每条评论标注为正面或负面。"},{"l":"C","t":"持续监控生产过程中的输出结果。"},{"l":"D","t":"对输入数据集进行特征工程处理。"}],"a":["C"],"e":"**✅ 为什么 C.持续监控生产过程中的输出结果。 对**：MLOps 最佳实践要求对生产环境模型输出持续监控，以检测性能漂移、偏差与退化，确保部署后情感分析模型保持可靠与合规。\n\n**❌ 为什么其他选项错**：\n- A.利用深度学习进行超参数调优。：超参数调优属训练阶段，非生产运维\n- B.收集用户评论，并将每条评论标注为正面或负面。：标注评论是数据准备，未涉及生产监控\n- D.对输入数据集进行特征工程处理。：特征工程在训练前，与生产监控无关\n\n**📌 关键概念**：MLOps 强调生产监控（Model Monitor、漂移检测）；训练、数据准备等阶段工作不构成生产监控。","s":"源#361"},{"id":"D1-166","d":1,"t":"single","q":"一家公司希望利用基础模型（FMs）来开发和部署一个人工智能模型。哪种 AWS 服务或资源能以最少的开发工作量满足这些要求？","o":[{"l":"A","t":"Amazon Bedrock"},{"l":"B","t":"Amazon SageMaker 人工智能"},{"l":"C","t":"Amazon Bedrock Playground"},{"l":"D","t":"Amazon Q Developer"}],"a":["A"],"e":"Amazon Bedrock 是一项完全托管的服务，提供多种领先的基础模型（FMs），开发者无需管理底层基础设施即可通过 API 直接调用预训练模型（如 Claude、 Jurassic 等），显著减少开发工作量。相比之下，SageMaker 需要更多模型训练和部署的配置步骤。选项 C 和 D 为干扰项，分别涉及错误表述和开发者工具，不符合题目要求","s":"源#367"},{"id":"D1-167","d":1,"t":"single","q":"一家金融公司把欺诈行为的模式存储在一个数据库中。该公司利用这些数据进行调查。该公司希望利用基于图的机器学习解决方案来开发一种人工智能工具，以协助进行这些调查。哪种 AWS 服务能满足这些要求？","o":[{"l":"A","t":"Amazon OpenSearch Service 服务"},{"l":"B","t":"Amazon Aurora"},{"l":"C","t":"Amazon Neptune"},{"l":"D","t":"Amazon MemoryDB"}],"a":["C"],"e":"**✅ 为什么 C.Amazon Neptune 对**：Amazon Neptune 是完全托管的图数据库服务，专为基于图的数据模型与图分析设计，适合存储欺诈模式之间的关系网络，配合图机器学习算法可协助调查人员发现关联与可疑行为，正符合题干基于图的欺诈调查需求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon OpenSearch Service：OpenSearch 是全文搜索与日志分析服务，不提供图存储与图遍历\n- B.Amazon Aurora：Aurora 是关系型数据库，用表存储数据，不擅长关系网络分析\n- D.Amazon MemoryDB：MemoryDB 是内存数据库，主打低延迟缓存，不具备图分析能力\n\n**📌 关键概念**：图数据库（Graph Database）适用于实体关系网络的分析，Amazon Neptune 支持属性图与图遍历；欺诈检测、社交网络是典型场景，与关系库、搜索库、缓存库用途不同。","s":"源#368"},{"id":"D1-168","d":1,"t":"single","q":"一家公司正在利用人工智能打造一个玩具推荐网站，该网站会根据顾客的兴趣和年龄来推荐玩具。该公司发现，其人工智能系统倾向于推荐带有性别刻板印象的玩具。该公司应使用哪种 AWS 服务或功能来调查这种偏见？","o":[{"l":"A","t":"Amazon Rekognition"},{"l":"B","t":"Amazon Q Developer"},{"l":"C","t":"Amazon Comprehend"},{"l":"D","t":"Amazon SageMaker Clarify"}],"a":["D"],"e":"**✅ 为什么 D.Amazon SageMaker Clarify 对**：Amazon SageMaker Clarify 专用于检测、衡量与分析数据集和机器学习模型中的偏差，还能提供特征归因与可解释性，公司用它调查推荐系统输出的性别刻板印象偏见，正符合题干「调查这种偏见」的需求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Rekognition：Rekognition 用于图像与视频分析，不具备模型偏差检测能力\n- B.Amazon Q Developer：Q Developer 是面向开发者的代码辅助工具，不提供偏差分析\n- C.Amazon Comprehend：Comprehend 做 NLP 文本分析，不检测机器学习模型的偏差\n\n**📌 关键概念**：Clarify 是 AWS 的偏差检测与可解释性工具，支持预训练与训练后偏差指标，是负责任 AI 治理的核心组件；Rekognition、Comprehend、Q Developer 均与偏差分析无关。","s":"源#371"},{"id":"D1-169","d":1,"t":"single","q":"哪种机器学习技术的可解析性最强？","o":[{"l":"A","t":"线性回归"},{"l":"B","t":"支持向量机"},{"l":"C","t":"随机切割森林（RCF）"},{"l":"D","t":"神经网络"}],"a":["A"],"e":"**✅ 为什么 A.线性回归 对**：线性回归参数直接表示每个特征对输出的影响，结构透明，可解释性最强，是题干要求的答案。\n\n**❌ 为什么其他选项错**：\n- B.支持向量机：SVM 依赖核函数映射高维空间，决策边界不易直接解释\n- C.随机切割森林（RCF）：RCF 集成多树，解释难度高于线性模型\n- D.神经网络：神经网络多层黑盒，可解释性最弱\n\n**📌 关键概念**：线性模型可解释性最强，树模型与神经网络可解释性递减；可解释性需求高的场景优先线性模型。","s":"源#375"},{"id":"D1-170","d":1,"t":"single","q":"一家公司在 AWS 上部署了一个用于生产的 AI 应用程序。随着时间的推移，该应用程序的响应准确性逐渐降低。该公司需要一个解决方案，在应用程序性能出现偏差时发送警报。哪项 AWS 服务或功能能满足这一要求？","o":[{"l":"A","t":"Amazon Augmented AI（Amazon A2I）"},{"l":"B","t":"Amazon SageMaker Model Monitor"},{"l":"C","t":"Amazon Rekognition"},{"l":"D","t":"AWS Trusted Advisor（可信顾问）"}],"a":["B"],"e":"**✅ 为什么 B.Amazon SageMaker Model Monitor 对**：SageMaker Model Monitor 持续监控生产环境中的模型，检测数据漂移与模型性能下降，并在准确率或数据质量偏离预期基线时自动触发警报，正符合题干「性能出现偏差时发送警报」的要求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Augmented AI（Amazon A2I）：A2I 构建人机审核工作流，不监控模型漂移\n- C.Amazon Rekognition：Rekognition 是图像视频识别服务，不监控模型性能\n- D.AWS Trusted Advisor：Trusted Advisor 提供成本优化与安全检查建议，不监控模型性能\n\n**📌 关键概念**：Model Monitor 负责生产推理质量与漂移告警，是 MLOps 生产运维关键组件；A2I 人工审核、Rekognition 视觉识别、Trusted Advisor 架构建议用途不同。","s":"源#379"},{"id":"D1-171","d":1,"t":"single","q":"一家公司将其人工智能数据集存储在Amazon S3 存储桶中。该公司希望与业务伙伴共享这些 S3 存储桶，但需要避免意外共享敏感数据。该公司应使用哪种 AWS 服务来发现数据集中的敏感数据？","o":[{"l":"A","t":"Amazon Kendra"},{"l":"B","t":"Amazon Macie"},{"l":"C","t":"Amazon Textract"},{"l":"D","t":"AWS 数据交换"}],"a":["B"],"e":"**✅ 为什么 B.Amazon Macie 对**：Amazon Macie 利用机器学习和模式匹配自动发现、分类并保护 Amazon S3 中的敏感数据（如 PII），能在与业务伙伴共享数据集之前识别出敏感信息，防止意外泄露，正符合题干「避免意外共享敏感数据」的需求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Kendra：Kendra 是企业搜索服务，用于语义搜索与问答，不识别敏感数据\n- C.Amazon Textract：Textract 从文档中提取文本与数据，不具备敏感数据识别能力\n- D.AWS 数据交换：AWS 数据交换是数据交易与共享市场，不提供敏感数据发现\n\n**📌 关键概念**：Macie 是 AWS 数据安全服务，基于 ML 发现 S3 中的 PII 与敏感数据，支持告警与治理；Kendra、Textract、数据交换定位不同。","s":"源#380"},{"id":"D1-172","d":1,"t":"single","q":"什么是持续预训练？","o":[{"l":"A","t":"在特定任务上利用有标签的数据对预训练语言模型进行微调的过程"},{"l":"B","t":"向预训练的语言模型提供未标注的数据以提升模型在特定领域的知识的过程"},{"l":"C","t":"从头开始在特定数据集上训练语言模型的过程"},{"l":"D","t":"在测试集上评估预训练语言模型性能的过程"}],"a":["B"],"e":"**✅ 为什么 B.向预训练的语言模型提供未标注的数据以提升模型在特定领域的知识的过程 对**：持续预训练在领域无标注数据上继续训练预训练模型，提升领域知识，正符合定义。\n\n**❌ 为什么其他选项错**：\n- A.在特定任务上利用有标签的数据对预训练语言模型进行微调：这描述微调，不是持续预训练\n- C.从头开始在特定数据集上训练语言模型：从头训练是预训练，领域持续预训练不同\n- D.在测试集上评估预训练语言模型性能：评估不是训练过程\n\n**📌 关键概念**：持续预训练（Continue Pretraining）用无标签领域数据继续训练；微调用带标签任务数据，两者是不同定制方式。","s":"源#381"},{"id":"D1-173","d":1,"t":"single","q":"一家房地产公司正在开发一个机器学习模型，通过使用销售和营销数据来预测房价。该公司希望利用特征工程构建一个能够做出准确预测的模型。哪种方法能满足这些要求？","o":[{"l":"A","t":"通过提供数据可视化来理解模式。"},{"l":"B","t":"调整模型的超参数。"},{"l":"C","t":"创建或选择用于模型训练的相关特征。"},{"l":"D","t":"从多个来源收集数据。"}],"a":["C"],"e":"**✅ 为什么 C.创建或选择用于模型训练的相关特征 对**：特征工程的核心是创建、转换和选择与模型训练最相关的输入变量，直接提升模型准确预测的能力，符合题干要求。\n\n**❌ 为什么其他选项错**：\n- A.通过提供数据可视化来理解模式：可视化辅助理解数据，不构成特征工程\n- B.调整模型的超参数：超参调优是训练环节，非特征工程\n- D.从多个来源收集数据：数据收集是获取原始数据，未涉及特征构建\n\n**📌 关键概念**：特征工程（Feature Engineering）包括特征创建、转换、选择，是提升模型性能的关键步骤。","s":"源#382"},{"id":"D1-174","d":1,"t":"single","q":"一家软件开发公司希望加快产品上市速度，需要一种能够帮助开发者实时生成代码和单元测试的解决方案。哪个 AWS 服务满足这些要求？","o":[{"l":"A","t":"Amazon Personalize"},{"l":"B","t":"Amazon Q Developer"},{"l":"C","t":"Amazon Comprehend"},{"l":"D","t":"Amazon Kendra"}],"a":["B"],"e":"**✅ 为什么 B.Amazon Q Developer 对**：Amazon Q Developer 是 AWS 的生成式 AI 开发助手，能帮助开发者实时生成代码、创建单元测试、解析代码并修复缺陷，显著提升开发效率，加速产品上市，正符合题干「实时生成代码和单元测试」的需求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Personalize：Personalize 是推荐服务，为用户生成个性化推荐，不生成代码\n- C.Amazon Comprehend：Comprehend 做 NLP 文本分析，不提供代码生成能力\n- D.Amazon Kendra：Kendra 是企业搜索服务，提供文档检索与问答，与代码生成无关\n\n**📌 关键概念**：Amazon Q Developer 是面向开发者的生成式 AI 助手，覆盖代码补全、单测生成与缺陷修复；Comprehend、Kendra、Personalize 的服务定位需区分。","s":"源#427"},{"id":"D1-175","d":1,"t":"single","q":"一家公司计划使用数据集来训练一个新的 AI 模型。在训练模型之前，该公司需要确定数据集中是否存在针对特定用户群体的偏见。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"使用 Amazon SageMaker Clarify 计算预训练偏见指标。"},{"l":"B","t":"使用 Amazon SageMaker Model Cards来计算预训练偏见指标。"},{"l":"C","t":"使用 Amazon SageMaker Clarify 计算训练后的偏差指标。"},{"l":"D","t":"使用 Amazon SageMaker Model Cards来计算训练后的偏差指标。"}],"a":["A"],"e":"**✅ 为什么 A.使用 Amazon SageMaker Clarify 计算预训练偏见指标 对**：Clarify 可在训练前分析数据集并计算预训练偏见指标，帮助在构建模型前识别针对特定群体的数据偏差，满足题干要求。\n\n**❌ 为什么其他选项错**：\n- B.使用 Amazon SageMaker Model Cards 来计算预训练偏见指标：模型卡是文档，不计算偏见指标\n- C.使用 Amazon SageMaker Clarify 计算训练后的偏差指标：题干在训练前，应计算预训练指标\n- D.使用 Amazon SageMaker Model Cards 来计算训练后的偏差指标：Model Cards 不计算偏差指标\n\n**📌 关键概念**：Clarify 支持预训练（pre-training）与训练后（post-training）偏差指标；训练前需求选预训练偏见指标。","s":"源#428"},{"id":"D1-176","d":1,"t":"single","q":"一家公司希望开发一种人工智能解决方案，用于从扫描的 PDF 文档和表单中自动提取结构化和非结构化数据。哪个 AWS 服务能满足这些要求？","o":[{"l":"A","t":"Amazon Polly"},{"l":"B","t":"Amazon Lex"},{"l":"C","t":"Amazon Personalize"},{"l":"D","t":"Amazon Textract"}],"a":["D"],"e":"**✅ 为什么 D.Amazon Textract 对**：Amazon Textract 是 AWS 的文档智能处理服务，可自动从扫描的 PDF、表单和表格中提取文本、手写内容与结构化数据，同时处理结构化和非结构化文档，正符合题干「从扫描 PDF 和表单中自动提取数据」的需求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Polly：Polly 是文字转语音服务，将文本合成为语音，不提取文档数据\n- B.Amazon Lex：Lex 构建对话机器人与语音交互，不具备文档提取能力\n- C.Amazon Personalize：Personalize 是推荐服务，与文档数据处理无关\n\n**📌 关键概念**：Textract 是 OCR 与文档数据提取服务，支持表格、表单、手写体识别，常与 IDP 流程配合；Polly、Lex、Personalize 分别属 TTS、对话、推荐，用途各异。","s":"源#431"},{"id":"D1-177","d":1,"t":"single","q":"企业需要记录机器学习模型的目的、所有者和局限性。哪个 AWS 服务或功能提供了此功能？","o":[{"l":"A","t":"Amazon Bedrock"},{"l":"B","t":"AWS AI 服务卡片"},{"l":"C","t":"AWS 规范性指导"},{"l":"D","t":"Amazon SageMaker Model Cards"}],"a":["D"],"e":"**✅ 为什么 D.Amazon SageMaker Model Cards 对**：Amazon SageMaker Model Cards 以结构化文档记录模型的目的、所有者、预期用途、训练数据、局限性、风险评估与评估细节，为模型治理与审计提供标准化载体，正符合题干记录模型目的、所有者与局限性的需求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Bedrock：Bedrock 是基础模型托管服务，提供模型调用能力，不提供模型文档记录\n- B.AWS AI 服务卡片：AWS AI 服务卡描述 AWS 自身服务的透明度，不记录用户自建模型信息\n- C.AWS 规范性指导：规范性指导提供架构与最佳实践建议，不承载模型文档\n\n**📌 关键概念**：Model Cards 是负责任 AI 与模型治理的核心文档化工具，记录模型全生命周期关键信息；Bedrock、AI 服务卡、规范性指导均不提供模型元数据记录。","s":"源#437"},{"id":"D1-178","d":1,"t":"single","q":"一家社交媒体公司采用基于人工智能的“添加为好友”推荐系统。该公司希望确保其 AI 模型具有透明性和可解析性。哪种解决方案将以最高效的操作方式满足这些要求？","o":[{"l":"A","t":"使用 Amazon Rekognition 分析用户头像，以改进模型推荐。"},{"l":"B","t":"使用 Amazon SageMaker Clarify 提升模型推荐的可解析性。"},{"l":"C","t":"将 AI 模型迁移至 Amazon Personalize，以提升模型的推荐效果。"},{"l":"D","t":"使用 Amazon SageMaker Ground Truth 手动检测模型偏差。"}],"a":["B"],"e":"**✅ 为什么 B.使用 Amazon SageMaker Clarify 提升模型推荐的可解析性 对**：Clarify 展示输入特征如何影响模型预测，提升透明性与可解析性，高效满足「添加为好友」推荐的可解释需求。\n\n**❌ 为什么其他选项错**：\n- A.使用 Amazon Rekognition 分析用户头像：Rekognition 图像分析，不提供模型可解释\n- C.将 AI 模型迁移至 Amazon Personalize：Personalize 是推荐服务，不提供可解释性分析\n- D.使用 Amazon SageMaker Ground Truth 手动检测模型偏差：Ground Truth 标注数据，不用于线上可解释\n\n**📌 关键概念**：Clarify 用于可解释性与偏差检测；推荐系统可解释性需展示特征影响，Rekognition、Personalize 均不提供。","s":"源#444"},{"id":"D2-001","d":2,"t":"single","q":"一家律师事务所希望通过使用大型语言模型(LLM)构建一个人工智能应用程序。该应用程序将读取法律文件并从文档中提取关键点。哪种解决方案符合这些要求？","o":[{"l":"A","t":"建立一个自动命名实体识别系统。"},{"l":"B","t":"创建推荐引擎。"},{"l":"C","t":"开发一个总结聊天机器人。"},{"l":"D","t":"开发多语言翻译系统。"}],"a":["C"],"e":"**✅ 为什么 C. 开发一个总结聊天机器人对**：题干核心需求是\"读取法律文件并提取关键点\"，这是典型的文本摘要（Summarization）任务。总结聊天机器人（Summarization Chatbot）利用 LLM 的文本理解和摘要能力，将法律文件中的关键条款和论点抽取并整理成要点，直接满足信息提取需求。\n**❌ 为什么其他选项错**：\n- A. 建立一个自动命名实体识别系统——NER 用于识别文本中的实体（人名/地点/日期），而非提取关键论点或进行文档摘要\n- B. 创建推荐引擎——推荐引擎基于用户行为预测偏好（如 Amazon Personalize），不具备文档理解和摘要能力\n- D. 开发多语言翻译系统——翻译系统（如 Amazon Translate）转换语言，不做内容摘要或关键点抽取\n**📌 关键概念**：LLM 的核心能力之一是文本摘要。题干出现\"读取文档并提取关键点\"→想到 Summarization。GenAI 应用场景中，摘要、问答、翻译、代码生成是最常见的四类。","s":"源#2"},{"id":"D2-002","d":2,"t":"single","q":"一家公司正在使用一个预先训练好的大型语言模型(LLM)来构建一个用于产品推荐的聊天机器人。该公司需要 LLM 输出简短，并且用特定的语言编写。哪种解决方案将使 LLM 响应质量符合公司的期望？","o":[{"l":"A","t":"调整提示。大多数投票"},{"l":"B","t":"选择不同尺寸的 LLM。"},{"l":"C","t":"提高温度。"},{"l":"D","t":"增加顶部 K 值。"}],"a":["A"],"e":"**✅ 为什么 A. 调整提示对**：题干要求\"输出简短\"且\"用特定语言编写\"，这是典型的输出格式和风格控制需求。通过提示工程（Prompt Engineering）在提示中明确指定\"请用XX语言、控制在XX字以内回答\"，即可引导 LLM 按要求输出，无需修改模型本身，是最直接高效的方案。\n**❌ 为什么其他选项错**：\n- B. 选择不同尺寸的 LLM——更换模型大小影响的是模型能力上限，不能精确控制输出语言和长度\n- C. 提高温度——提高温度（Temperature）会增加输出的随机性和多样性，反而让输出更不可控\n- D. 增加顶部 K 值——增大 Top-K 会扩大候选 Token 范围，增加多样性，与\"简短、特定语言\"的精确控制目标矛盾\n**📌 关键概念**：提示工程是不修改模型权重、成本最低的输出优化方式。题干出现\"控制输出格式/语言/长度\"→想到 Prompt Engineering。温度和 Top-K 控制随机性，不控制内容风格。","s":"源#5"},{"id":"D2-003","d":2,"t":"single","q":"一家公司希望通过使用Amazon Bedrock上的基础模型(FM)来创建一个聊天机器人。FM 需要访问存储在Amazon S3 桶中的加密数据。数据用Amazon S3 管理密钥(SSE-S3)加密。FM 在试图访问 S3 桶数据时遇到故障。哪种解决方案能够满足这些要求？","o":[{"l":"A","t":"确保 Amazon Bedrock承担的角色拥有使用正确的加密密钥解密数据的权限。"},{"l":"B","t":"设置 S3 存储桶的访问权限，以允许公共访问，从而实现通过 internet 的访问。"},{"l":"C","t":"使用提示工程技术告诉模型在Amazon S3 中查找信息。"},{"l":"D","t":"确保 S3 数据不包含敏感信息。"}],"a":["A"],"e":"**✅ 为什么 A. 确保 Amazon Bedrock承担的角色拥有使用正确的加密密钥解密数据的权限对**：题干明确指出数据用 SSE-S3 加密，FM 访问时遇到故障。根据 AWS 责任共担模型，客户需确保 Bedrock 服务使用的 IAM 角色拥有对 S3 对象的读取权限以及对加密密钥的解密权限（kms:Decrypt）。权限不足是最常见的访问失败原因。\n**❌ 为什么其他选项错**：\n- B. 设置 S3 存储桶的访问权限以允许公共访问——公开 S3 数据严重违反安全最佳实践，绝不应为解决权限问题而开放公共访问\n- C. 使用提示工程技术告诉模型在Amazon S3 中查找信息——提示工程控制模型的文本生成行为，无法解决底层的 IAM 权限和加密访问问题\n- D. 确保 S3 数据不包含敏感信息——数据内容与访问权限故障无关，问题在于权限配置而非数据本身\n**📌 关键概念**：Bedrock 访问 S3 数据需要正确的 IAM 角色权限（s3:GetObject + kms:Decrypt）。题干出现\"加密数据 + 访问故障\"→想到 IAM 权限和加密密钥权限。AWS 安全第一原则：永远不要用公开访问解决权限问题。","s":"源#9"},{"id":"D2-004","d":2,"t":"single","q":"一个 AI 从业者想用一个基础模型(FM)来设计一个搜索应用。搜索应用程序必须处理包含文本和图像的查询。人工智能从业者应该使用哪种类型的 FM 来驱动搜索应用？","o":[{"l":"A","t":"多模态嵌入模型"},{"l":"B","t":"文本嵌入模型"},{"l":"C","t":"多模态生成模型"},{"l":"D","t":"图像生成模型"}],"a":["A"],"e":"**✅ 为什么 A. 多模态嵌入模型对**：题干要求搜索应用\"处理包含文本和图像的查询\"，即需要将文本和图像统一映射到同一个向量空间进行相似度匹配。多模态嵌入模型（Multimodal Embedding Model）能同时处理文本和图像输入，生成统一的嵌入向量，支持跨模态搜索（如用文字搜图片或用图片搜文字）。\n**❌ 为什么其他选项错**：\n- B. 文本嵌入模型——只能处理文本输入，无法理解图像查询\n- C. 多模态生成模型——生成模型用于创建新内容（如根据文字生成图像），不适合搜索匹配任务\n- D. 图像生成模型——如 Stable Diffusion，用于生成图像，不具备搜索和检索能力\n**📌 关键概念**：搜索应用的核心是嵌入（Embedding）+ 相似度匹配。多模态搜索需要多模态嵌入模型。题干出现\"搜索 + 文本和图像查询\"→想到多模态嵌入模型（如 Amazon Titan Multimodal Embeddings）。","s":"源#18"},{"id":"D2-005","d":2,"t":"single","q":"一家公司使用Amazon Bedrock的基础模型(FM)作为人工智能搜索工具。该公司希望通过使用公司的数据来微调模型，使其更加准确。哪种策略可以成功地微调模型？","o":[{"l":"A","t":"提供带有提示字段和完成字段的标签数据。"},{"l":"B","t":"通过创建一个包含多行的. txt 文件来准备定型数据集。csv 格式。"},{"l":"C","t":"购买Amazon Bedrock的供应吞吐量。"},{"l":"D","t":"在杂志和教科书上训练模型。"}],"a":["A"],"e":"**✅ 为什么 A. 提供带有提示字段和完成字段的标签数据对**：Bedrock 微调要求训练数据以\"prompt-completion\"配对格式提供——每条数据包含输入提示（prompt）和期望的输出（completion）。这是监督式微调的标准数据格式，通常以 JSONL 格式存储，让模型学习从特定输入产生特定输出。\n**❌ 为什么其他选项错**：\n- B. 通过创建一个包含多行的 .txt 文件来准备定型数据集，.csv 格式——Bedrock 微调不使用 CSV/TXT 格式，需要带 prompt-completion 结构的 JSONL 格式\n- C. 购买Amazon Bedrock的供应吞吐量——预置吞吐量（Provisioned Throughput）用于保证推理性能，与微调数据准备无关\n- D. 在杂志和教科书上训练模型——通用公开数据适用于预训练而非微调；微调需要公司特定的领域标注数据\n**📌 关键概念**：Bedrock 微调数据格式是 JSONL，每行包含 prompt 和 completion 字段。题干出现\"微调 + 数据准备\"→想到标注数据（labeled data）的 prompt-completion 格式。","s":"源#19"},{"id":"D2-006","d":2,"t":"single","q":"一家公司想要使用 Amazon Bedrock构建一个生成式人工智能应用程序，需要选择一个基础模型(FM)。该公司想知道一个提示能容纳多少信息。哪种考虑会影响公司的决策？","o":[{"l":"A","t":"温度"},{"l":"B","t":"投票最多的上下文窗口"},{"l":"C","t":"批量"},{"l":"D","t":"模型尺寸"}],"a":["B"],"e":"**✅ 为什么 B. 投票最多的上下文窗口对**：题干问的是\"一个提示能容纳多少信息\"，这直接对应上下文窗口（Context Window）的概念。上下文窗口定义了 FM 单次能处理的最大 Token 数量（包括输入和输出），决定了提示中能放入多少内容。窗口越大，可容纳的背景信息越多。\n**❌ 为什么其他选项错**：\n- A. 温度——温度控制输出的随机性/创造性，不影响输入容量\n- C. 批量——批量（Batch）指并行处理的请求数量，与单个提示容量无关\n- D. 模型尺寸——模型参数量影响模型能力，但不直接决定提示容量（上下文窗口才是）\n**📌 关键概念**：上下文窗口（Context Window）= 模型一次能处理的最大 Token 数。题干出现\"提示能容纳多少信息\"→想到上下文窗口大小。不同模型的上下文窗口差异很大（4K~200K+ Tokens）。","s":"源#23"},{"id":"D2-007","d":2,"t":"single","q":"一家公司想制造一个聊天机器人来帮助客户。聊天机器人将在没有人类干预的情况下帮助解决技术该公司为聊天机器人选择了一个基础模型(FM)。聊天机器人需要做出符合公司风格的回应。哪种解决方案符合这些要求？","o":[{"l":"A","t":"设置 FM 可以产生的令牌数量的下限。"},{"l":"B","t":"使用批处理推理来处理详细的响应。"},{"l":"C","t":"试验并改进提示，直到 FM 产生所需的响应。"},{"l":"D","t":"为温度参数定义一个较大的数值。"}],"a":["C"],"e":"**✅ 为什么 C.试验并改进提示，直到 FM 产生所需的响应。 对**：题干要求聊天机器人做出符合公司风格的回应，通过迭代试验与改进提示词，可以调整模型的语气、措辞与格式，使其输出贴合公司风格，且无需重新训练模型，是最直接满足需求的方案。\n\n**❌ 为什么其他选项错**：\n- A.设置 FM 可以产生的令牌数量的下限。：令牌下限只控制输出长度，不决定回应风格\n- B.使用批处理推理来处理详细的响应。：批处理推理用于离线批量处理任务，不涉及风格调整\n- D.为温度参数定义一个较大的数值。：温度只影响输出的随机性与多样性，不直接塑造公司风格\n\n**📌 关键概念**：提示工程（Prompt Engineering）通过迭代优化提示词调整模型输出风格与内容，是 FM 应用定制的重要手段；令牌数、温度、推理模式是模型参数与部署选项。","s":"源#24"},{"id":"D2-008","d":2,"t":"single","q":"一家公司希望在 Amazon Bedrock上使用大型语言模型(LLM)进行情感分析。该公司希望将文本段落的情绪分为积极或消极。哪种快速工程策略符合这些要求？","o":[{"l":"A","t":"在提示中提供带有相应肯定或否定标签的文本段落的示例，随后是要分类的新文本段落。"},{"l":"B","t":"在提示中提供情感分析和 LLM 如何工作的详细解释。"},{"l":"C","t":"提供新的文本段落进行分类，没有任何额外的背景或例子。"},{"l":"D","t":"为新课文提供几个不相关的任务的例子，如文本摘要或 1 回答。"}],"a":["A"],"e":"**✅ 为什么 A.在提示中提供带有相应肯定或否定标签的文本段落的示例，随后是要分类的新文本段落。 对**：在提示中给出带标签的示例，再让模型对新文本分类，属于少样本提示（Few-shot），能让 LLM 学会情感二分类的格式与判定标准，正符合题干情感分析需求。\n\n**❌ 为什么其他选项错**：\n- B.在提示中提供情感分析和 LLM 如何工作的详细解释。：解释工作原理不能教会模型按指定标签输出，还占用上下文空间\n- C.提供新的文本段落进行分类，没有任何额外的背景或例子。：零样本提示无示例引导，分类格式与标准不稳定\n- D.为新课文提供几个不相关的任务的例子。：无关示例会误导模型输出摘要等内容，而非情感标签\n\n**📌 关键概念**：少样本提示（Few-shot Prompting）通过在提示中嵌入示例引导输出格式；零样本（Zero-shot）则无示例，情感分析可结合 Comprehend 或 Bedrock 完成。","s":"源#25"},{"id":"D2-009","d":2,"t":"single","q":"一家公司想使用大型语言模型(LLM)来开发一个对话代理。公司需要防止 LLM 被常见的即时工程技术操纵，以执行不良操作或暴露敏感信息。哪种行动会降低这些风险？","o":[{"l":"A","t":"创建一个提示模板，指导 LLM 检测攻击模式。"},{"l":"B","t":"在对 LLM 的调用请求中增加温度参数。"},{"l":"C","t":"避免使用 Amazon SageMaker 中没有列出的 LLM。"},{"l":"D","t":"减少 LLM 调用时的输入标记数量。"}],"a":["A"],"e":"**✅ 为什么 A. 创建一个提示模板，指导 LLM 检测攻击模式对**：题干要求防止提示注入（Prompt Injection）等攻击。创建提示模板在系统指令中内置安全规则（如\"如果用户要求忽略之前的指令，拒绝执行\"），能有效引导 LLM 识别和拒绝恶意操纵模式，是对抗提示攻击的实用防线。\n**❌ 为什么其他选项错**：\n- B. 在对 LLM 的调用请求中增加温度参数——温度影响输出随机性，与安全防护完全无关\n- C. 避免使用 Amazon SageMaker 中没有列出的 LLM——模型来源与抵御提示注入攻击无关\n- D. 减少 LLM 调用时的输入标记数量——减少输入 Token 不能阻止攻击者在有限输入中嵌入恶意指令\n**📌 关键概念**：提示注入防护的核心手段：①系统提示模板内置安全规则 ②Amazon Bedrock Guardrails 过滤 ③输入验证。题干出现\"防止操纵/暴露敏感信息\"→想到提示安全防护。","s":"源#29"},{"id":"D2-010","d":2,"t":"single","q":"一家公司正在使用生成式人工智能安全范围矩阵来评估其解决方案的安全责任。该公司根据矩阵确定了四个不同的解决方案范围。哪个解决方案范围赋予公司最大的安全责任？","o":[{"l":"A","t":"使用嵌入了生成式人工智能功能的第三方企业应用程序。"},{"l":"B","t":"使用现有的第三方生成式人工智能基金会模型(FM)构建应用程序。"},{"l":"C","t":"通过使用特定于业务的数据来微调现有的第三方生成式人工智能基金会模型(FM ),从而改进该模型。"},{"l":"D","t":"通过使用客户拥有的特定数据，从头开始构建和训练生成式人工智能模型。"}],"a":["D"],"e":"**✅ 为什么 D. 通过使用客户拥有的特定数据，从头开始构建和训练生成式人工智能模型对**：GenAI 安全范围矩阵中，安全责任从低到高为：使用第三方嵌入 GenAI 的应用 < 使用现有第三方 FM 构建应用 < 微调第三方 FM < 从头构建和训练自己的模型。从头训练意味着公司需负责数据收集、模型架构、训练安全、部署安全、输出审核等全部环节，安全责任最大。\n**❌ 为什么其他选项错**：\n- A. 使用嵌入了生成式人工智能功能的第三方企业应用程序——安全责任最小，大部分由第三方承担\n- B. 使用现有的第三方生成式人工智能基金会模型(FM)构建应用程序——比 A 责任大但仍依赖第三方 FM 的安全性\n- C. 微调现有的第三方 FM——增加了数据准备和微调安全的责任，但模型基础层仍由第三方负责\n**📌 关键概念**：GenAI 安全范围矩阵——定制程度越高，安全责任越大。从头预训练 > 微调 > 直接使用 FM > 使用第三方应用。题干出现\"安全范围矩阵 + 最大安全责任\"→想到从头构建。","s":"源#30"},{"id":"D2-011","d":2,"t":"single","q":"一家公司正在使用 Amazon Bedrock实现 Amazon Titan（基础模型，FM）。公司需要通过使用来自公司私有数据源的相关数据来补充模型。哪种解决方案能满足这一要求？","o":[{"l":"A","t":"使用不同的调频。"},{"l":"B","t":"选择较低的温度值。"},{"l":"C","t":"创建一个Amazon Bedrock Knowledge Bases。"},{"l":"D","t":"启用模型调用日志记录。"}],"a":["C"],"e":"**✅ 为什么 C. 创建一个Amazon Bedrock Knowledge Bases 对**：题干要求\"用公司私有数据补充模型\"，这是典型的 RAG（检索增强生成）场景。Amazon Bedrock Knowledge Bases（Knowledge Base）将公司文档上传到 S3，自动分块、生成嵌入并存储到向量数据库，查询时检索相关文档作为上下文提供给 FM，无需修改模型权重。\n**❌ 为什么其他选项错**：\n- A. 使用不同的调频——更换 FM 不解决私有数据整合问题，新模型同样没有公司数据\n- B. 选择较低的温度值——温度控制输出随机性，不能让模型访问公司私有数据\n- D. 启用模型调用日志记录——日志记录用于审计和监控，不涉及数据补充\n**📌 关键概念**：Amazon Bedrock Knowledge Bases = 一站式 RAG 解决方案（文档→分块→嵌入→向量数据库→检索增强）。题干出现\"用私有数据补充模型\"→想到 RAG / Amazon Bedrock Knowledge Bases。这是不修改模型、成本较低的数据整合方式。","s":"源#38"},{"id":"D2-012","d":2,"t":"single","q":"一家公司正在培训基础模型（FM）。公司希望提高模型的准确性达到特定的接受水平。哪种解决方案能够满足这些要求？","o":[{"l":"A","t":"减少批量"},{"l":"B","t":"增加纪元。"},{"l":"C","t":"减少纪元。"},{"l":"D","t":"增加温度参数。"}],"a":["B"],"e":"**✅ 为什么 B. 增加纪元对**：增加训练纪元（Epoch）意味着让模型在训练数据上多迭代几轮，使模型有更多机会学习数据中的模式，从而提高准确性。在训练尚未收敛时，增加 Epoch 是提升模型性能的直接手段。\n**❌ 为什么其他选项错**：\n- A. 减少批量——减少批量大小（Batch Size）会影响梯度更新的稳定性，但不是提高准确性的主要手段\n- C. 减少纪元——减少训练轮数会让模型学习不充分，准确性下降而非提高\n- D. 增加温度参数——温度是推理参数，影响输出随机性，与训练阶段的模型准确性无关\n**📌 关键概念**：Epoch = 模型在完整训练数据上的一次完整遍历。增加 Epoch 让模型学得更充分。题干出现\"训练模型 + 提高准确性\"→想到增加 Epoch。但注意 Epoch 过多可能导致过拟合。","s":"源#40"},{"id":"D2-013","d":2,"t":"single","q":"一家公司正在建立一个大型语言模型(LLM)问答聊天机器人。该公司希望减少呼叫中心员工在回答客户 1.时需要采取的行动数量。公司应该使用哪个业务目标来评估 LLM 聊天机器人的效果？","o":[{"l":"A","t":"网站参与度"},{"l":"B","t":"平均通话持续时间"},{"l":"C","t":"企业社会责任"},{"l":"D","t":"法规遵循"}],"a":["B"],"e":"**✅ 为什么 B. 平均通话持续时间对**：题干目标是\"减少员工回答客户时采取的行动数量\"，即提升客服效率。平均通话持续时间（Average Handle Time, AHT）直接衡量每次客户交互的时长，如果聊天机器人有效分流了简单问题，员工处理的通话时间会缩短，AHT 下降直接反映聊天机器人的效果。\n**❌ 为什么其他选项错**：\n- A. 网站参与度——网站参与度衡量用户与网站的互动频率，与呼叫中心员工工作量无关\n- C. 企业社会责任——CSR 是公司的社会责任活动，与聊天机器人运营效果无关\n- D. 法规遵循——合规性是法律要求，不衡量运营效率\n**📌 关键概念**：评估 AI 对业务的影响需选对指标。呼叫中心效率→AHT（平均处理时间）；电商→转化率；SaaS→ARPU。题干出现\"减少员工行动数量\"→想到 AHT。","s":"源#41"},{"id":"D2-014","d":2,"t":"single","q":"一家公司希望使用大型语言模型(LLM)和 Amazon Bedrock来开发该公司产品手册的聊天界面。手册存储为 PDF 文件。哪种解决方案最经济高效地满足了这些要求？","o":[{"l":"A","t":"使用 prompt engineering 向用户提示添加一个 PDF 文件作为上下文。"},{"l":"B","t":"使用 prompt engineering 将所有 PDF 文件作为上下文添加到用户提示中，当提示被提交到 Amazon Bedrock时。"},{"l":"C","t":"使用所有的 PDF 文档，通过 Amazon Bedrock对模型进行微调。使用微调模型处理用户提示。"},{"l":"D","t":"将 PDF 文档上传到Amazon Bedrock Knowledge Bases。当用户向 Amazon Bedrock提交提示时，使用知识库提供上下文。"}],"a":["D"],"e":"**✅ 为什么 D. 将 PDF 文档上传到Amazon Bedrock Knowledge Bases。当用户向 Amazon Bedrock提交提示时，使用知识库提供上下文对**：题干要求基于大量 PDF 手册构建问答系统，且强调\"最经济高效\"。Amazon Bedrock Knowledge Bases实现 RAG：将 PDF 自动分块、嵌入、存入向量数据库，查询时检索相关片段作为上下文。这比微调便宜得多，且能随时更新文档。\n**❌ 为什么其他选项错**：\n- A. 使用 prompt engineering 向用户提示添加一个 PDF 文件作为上下文——单个 PDF 可能超出上下文窗口限制，且无法覆盖所有手册\n- B. 将所有 PDF 文件作为上下文添加到用户提示中——所有 PDF 的 Token 量远超任何模型的上下文窗口，技术上不可行\n- C. 使用所有的 PDF 文档微调模型——微调成本高于 RAG，且每次手册更新都需重新微调，不经济\n**📌 关键概念**：PDF 文档问答→RAG（Amazon Bedrock Knowledge Bases）是最经济高效的方案。成本排序：提示工程 < RAG < 微调 < 预训练。题干出现\"大量文档 + 经济高效\"→想到 RAG / Amazon Bedrock Knowledge Bases。","s":"源#44"},{"id":"D2-015","d":2,"t":"single","q":"一家公司希望使用预先训练的生成式人工智能模型来为其营销活动生成内容。公司需要确保生成的内容符合公司的品牌声音和信息要求。哪种解决方案符合这些要求？","o":[{"l":"A","t":"优化模型的架构和超参数，以提高模型的整体性能。"},{"l":"B","t":"通过向模型的架构中添加更多的层来增加模型的复杂性。"},{"l":"C","t":"创建有效的提示，提供清晰的说明和上下文来指导模型的生成。"},{"l":"D","t":"选择一个大型、多样化的数据集来预训练新的创成式模型。"}],"a":["C"],"e":"**✅ 为什么 C. 创建有效的提示，提供清晰的说明和上下文来指导模型的生成对**：题干要求模型输出符合\"品牌声音和信息要求\"，且使用的是预训练模型。通过提示工程在提示中明确品牌风格、语气、禁忌词等指导信息，即可引导模型生成符合品牌调性的内容，成本最低、实施最快。\n**❌ 为什么其他选项错**：\n- A. 优化模型的架构和超参数——修改模型架构需要深度 ML 专业知识，且不直接解决品牌风格对齐问题\n- B. 增加模型的层数来增加复杂性——增加层数是模型架构变更，成本极高，且不保证品牌对齐\n- D. 选择一个大型、多样化的数据集来预训练新的创成式模型——从头预训练成本极高，用提示工程即可解决品牌风格需求\n**📌 关键概念**：品牌风格对齐 = 提示工程（成本最低）或微调（效果更深）。题干出现\"预训练模型 + 品牌声音\"且无特殊复杂需求→优先用提示工程。","s":"源#46"},{"id":"D2-016","d":2,"t":"single","q":"一所大学的学生正在抄袭生成式人工智能的内容来写论文。这种情况代表了负责任的生成式人工智能所面临的挑战是什么？","o":[{"l":"A","t":"毒性"},{"l":"B","t":"幻觉"},{"l":"C","t":"抄袭投票最多"},{"l":"D","t":"隐私"}],"a":["C"],"e":"**✅ 为什么 C. 抄袭对**：题干描述的场景是学生直接复制 GenAI 生成的内容冒充自己的作品，这正是抄袭（Plagiarism）的定义——将他人（或 AI）生成的内容据为己有。这是负责任 AI 中知识产权和学术诚信方面的重要挑战。\n**❌ 为什么其他选项错**：\n- A. 毒性——毒性（Toxicity）指模型产生仇恨、攻击性内容，与学生抄袭行为无关\n- B. 幻觉——幻觉指模型生成看似合理但事实错误的内容，题干问题不在于内容正确性而在于使用行为\n- D. 隐私——隐私问题涉及个人信息泄露，与抄袭 AI 生成内容无关\n**📌 关键概念**：GenAI 负责任使用的挑战包括：抄袭（版权/学术诚信）、幻觉（事实准确性）、毒性（有害内容）、隐私（数据泄露）。题干出现\"学生复制 AI 内容写论文\"→想到抄袭（Plagiarism）。","s":"源#49"},{"id":"D2-017","d":2,"t":"single","q":"一个公司需要仅仅基于公司的私有数据来构建自己的大型语言模型(LLM)。该公司担心培训过程对环境的影响。在训练 LLM 时，哪种 Amazon EC2 实例类型的环境影响最小？","o":[{"l":"A","t":"Amazon EC2 C 系列"},{"l":"B","t":"Amazon EC2 G 系列"},{"l":"C","t":"Amazon EC2 P 系列"},{"l":"D","t":"Amazon EC2 Trn 系列"}],"a":["D"],"e":"**✅ 为什么 D. Amazon EC2 Trn 系列对**：EC2 Trn 系列（如 Trn1）搭载 AWS 自研的 Trainium 芯片，专为 ML 训练优化，具有更高的能效比（性能/瓦特）。相比通用 GPU 实例，Trainium 芯片完成同等训练任务消耗更少能源，碳足迹更低，因此环境影响最小。\n**❌ 为什么其他选项错**：\n- A. Amazon EC2 C 系列——C 系列是计算优化实例（CPU），不适合大规模 LLM 训练，且 CPU 训练效率极低、耗时更久、总能耗更大\n- B. Amazon EC2 G 系列——G 系列搭载 NVIDIA T4 GPU，适合图形处理和轻量推理，非大规模训练最优选择\n- C. Amazon EC2 P 系列——P 系列搭载 NVIDIA A100/V100 GPU，训练能力强但能效不如 Trainium 专用芯片\n**📌 关键概念**：AWS Trainium（Trn 系列）是专为 ML 训练设计的自研芯片，能效比优于通用 GPU。题干出现\"训练 LLM + 环境影响/碳足迹\"→想到 Trn 系列（Trainium）。负责任 AI 包含环境可持续性考量。","s":"源#50"},{"id":"D2-018","d":2,"t":"single","q":"哪个术语描述了人工智能和自然语言处理(NLP)模型用来提高对文本信息的理解的真实世界对象和概念的数字表示?","o":[{"l":"A","t":"嵌入"},{"l":"B","t":"代币"},{"l":"C","t":"模型"},{"l":"D","t":"双星"}],"a":["A"],"e":"**✅ 为什么 A. 嵌入对**：嵌入（Embedding）是将真实世界的对象和概念（文本、图像等）转换为固定长度的数值向量的技术，使语义相似的内容在向量空间中彼此接近。这正是题干描述的\"用来提高文本理解的数字表示\"。\n**❌ 为什么其他选项错**：\n- B. 代币——Token 是模型处理的最小文本单位（单词/子词/字符），是输入输出的基本单元，不是语义的数字表示\n- C. 模型——模型是完成特定任务的算法系统，不是\"数字表示\"\n- D. 双星——与嵌入概念无关\n**📌 关键概念**：嵌入（Embedding）= 将非结构化数据转为数值向量，捕捉语义关系。题干出现\"真实世界对象的数字表示 + 提高文本理解\"→想到 Embedding。嵌入是 RAG 和语义搜索的基础。","s":"源#59"},{"id":"D2-019","d":2,"t":"single","q":"一家研究公司通过使用Amazon Bedrock的基础模型(FM)实现了一个聊天机器人。聊天机器人搜索来自大型研究论文数据库的问题答案。经过多次及时的工程尝试,该公司注意到,由于研究论文中复杂的科学术语,FM 表现不佳。该公司如何提高聊天机器人的性能?","o":[{"l":"A","t":"使用少量提示来定义 FM 如何回答问题。"},{"l":"B","t":"使用领域适应微调使 FM 适应复杂的科学术语。"},{"l":"C","t":"更改 FM 推断参数。"},{"l":"D","t":"清理研究论文数据,删除复杂的科学术语。"}],"a":["B"],"e":"**✅ 为什么 B. 使用领域适应微调使 FM 适应复杂的科学术语对**：题干指出即使经过多次提示工程尝试，FM 仍因\"复杂的科学术语\"表现不佳。这说明提示工程已到达瓶颈，需要通过领域适应微调（Domain Adaptation Fine-tuning）让模型在科学文献数据上进一步训练，使其内化领域术语和表达方式。\n**❌ 为什么其他选项错**：\n- A. 使用少量提示来定义 FM 如何回答问题——题干已说明多次提示工程尝试无效，少量提示属于提示工程范畴\n- C. 更改 FM 推断参数——调整温度/Top-K 等参数无法解决模型不理解领域术语的根本问题\n- D. 清理研究论文数据,删除复杂的科学术语——删除术语会丢失关键信息，破坏文档完整性\n**📌 关键概念**：提示工程无效时→升级到微调。领域适应微调专门解决模型不理解特定行业术语的问题。题干出现\"提示工程已尝试 + 领域术语理解不足\"→想到领域适应微调（Domain Adaptation）。","s":"源#60"},{"id":"D2-020","d":2,"t":"single","q":"一家公司希望在 Amazon Bedrock上使用大型语言模型(LLM)进行情感分析。公司需要 LLM 对相同的输入提示产生更加一致的响应。为了满足这些要求,公司应该对推断参数做哪些调整?","o":[{"l":"A","t":"降低温度值。"},{"l":"B","t":"增加温度值。"},{"l":"C","t":"减少输出令牌的长度。"},{"l":"D","t":"增加最大生成长度。"}],"a":["A"],"e":"**✅ 为什么 A. 降低温度值对**：题干要求\"对相同输入产生更一致的响应\"，即需要确定性输出。降低温度（Temperature）值使模型倾向于选择概率最高的 Token，减少输出的随机性。温度=0 时，相同输入每次得到完全相同的输出，最大化一致性。\n**❌ 为什么其他选项错**：\n- B. 增加温度值——高温度增加随机性，导致每次输出不同，与一致性目标矛盾\n- C. 减少输出令牌的长度——控制输出长度不影响输出的一致性\n- D. 增加最大生成长度——增加输出长度也不影响响应的确定性\n**📌 关键概念**：温度↓ = 更确定/更一致；温度↑ = 更随机/更多样。题干出现\"一致的响应\"→想到降低温度。情感分析需要确定性输出（每次同样输入得到同样的情感标签）。","s":"源#61"},{"id":"D2-021","d":2,"t":"single","q":"一家公司想通过使用 Amazon Bedrock和客户数据开发一个大型语言模型(LLM)应用程序上传到Amazon S3。公司的安全策略规定，每个团队只能访问本团队自己的客户的数据。哪种解决方案能够满足这些要求？","o":[{"l":"A","t":"为每个团队创建一个 Amazon 基础定制服务角色，该角色只能访问团队的客户数据。"},{"l":"B","t":"创建拥有Amazon S3 访问权限的自定义服务角色。要求团队在每个 Amazon Bedrock请求上指定客户名称。"},{"l":"C","t":"在Amazon S3 编辑个人数据。更新 S3 存储桶策略，以允许团队访问客户数据。"},{"l":"D","t":"创建一个拥有完全Amazon S3 访问权限的Amazon Bedrock 角色。为每个团队创建 IAM 角色，这些角色只能访问每个团队的客户文件夹。"}],"a":["A"],"e":"**✅ 为什么 A. 为每个团队创建一个 Amazon 基础定制服务角色，该角色只能访问团队的客户数据对**：题干要求\"每个团队只能访问自己客户的数据\"，这是经典的最小权限访问控制。为每个团队创建专属的 Bedrock 服务角色（IAM Role），在角色策略中限制只能访问该团队对应的 S3 前缀/文件夹，实现了团队级别的数据隔离。\n**❌ 为什么其他选项错**：\n- B. 创建拥有 S3 访问权限的自定义服务角色，要求团队在每个 Bedrock 请求上指定客户名称——依赖团队自觉指定客户名称无法强制执行权限隔离，存在数据越权风险\n- C. 在 S3 编辑个人数据，更新 S3 存储桶策略以允许团队访问客户数据——措辞模糊且不涉及 Bedrock 角色的权限控制\n- D. 创建一个拥有完全 S3 访问权限的 Bedrock 角色，再为每个团队创建 IAM 角色——Bedrock 角色拥有完全 S3 访问权限违反最小权限原则\n**📌 关键概念**：IAM 角色 + 最小权限原则是 AWS 安全基石。Bedrock 通过 IAM 服务角色访问 S3 数据，每个团队使用独立角色实现数据隔离。题干出现\"团队级数据隔离\"→想到 IAM 角色 + S3 权限策略。","s":"源#63"},{"id":"D2-022","d":2,"t":"single","q":"一家教育提供商正在构建一个问答应用程序，它使用生成式人工智能模型来解释复杂的概念。教育提供者希望根据提问者来自动改变模型响应的风格。教育提供者将向模型给出提出问题的用户的年龄范围。哪种解决方案能以最少的实施工作满足这些要求？","o":[{"l":"A","t":"通过使用代表应用程序将支持的各种年龄范围的附加培训数据来微调模型。"},{"l":"B","t":"将角色描述添加到提示上下文中，以指示响应应该针对的年龄范围的模型。"},{"l":"C","t":"使用思维链推理来推断出适合该用户的正确的响应风格和复杂性。"},{"l":"D","t":"根据用户的年龄汇总回复文本，以便年轻用户收到更短的回复。"}],"a":["B"],"e":"**✅ 为什么 B. 将角色描述添加到提示上下文中，以指示响应应该针对的年龄范围的模型对**：题干要求根据用户年龄动态调整回答风格，且强调\"最少实施工作\"。在提示中添加角色描述（如\"请用适合10岁儿童的语言回答\"）是最简单的实现方式——只需修改提示模板，无需训练或微调模型。\n**❌ 为什么其他选项错**：\n- A. 使用代表各种年龄范围的附加培训数据来微调模型——微调成本高、实施工作量大，不符合\"最少工作\"\n- C. 使用思维链推理来推断出适合该用户的正确的响应风格和复杂性——CoT 用于提升推理准确性，不是控制回答风格的最直接方式\n- D. 根据用户的年龄汇总回复文本，以便年轻用户收到更短的回复——仅缩短长度不等于调整风格和复杂度\n**📌 关键概念**：提示工程中的角色扮演（Role Playing）技术——在 System Prompt 中定义\"你是面向X岁用户的教育助手\"即可控制回答风格。题干出现\"动态调整风格 + 最少工作\"→想到提示模板中加角色描述。","s":"源#66"},{"id":"D2-023","d":2,"t":"single","q":"一家公司正在开发聊天机器人，以改善用户体验。该公司正在使用Amazon Bedrock的大型语言模型(LLM)进行意图检测。该公司希望使用少数镜头学习来提高意图检测的准确性。公司需要哪些额外数据来满足这些要求？","o":[{"l":"A","t":"成对的聊天机器人响应和正确的用户意图"},{"l":"B","t":"成对的用户消息和正确的聊天机器人响应"},{"l":"C","t":"成对的用户信息和正确的用户意图"},{"l":"D","t":"成对的用户意图和正确的聊天机器人响应"}],"a":["C"],"e":"**✅ 为什么 C. 成对的用户信息和正确的用户意图对**：少量样本学习（Few-shot Learning）需要在提示中提供几个输入-输出示例。对于意图检测任务，示例应该是\"用户消息→正确意图标签\"的配对，让模型从中学习消息与意图的映射关系，然后对新消息进行分类。\n**❌ 为什么其他选项错**：\n- A. 成对的聊天机器人响应和正确的用户意图——意图检测的输入是用户消息而非机器人响应，配对方向错误\n- B. 成对的用户消息和正确的聊天机器人响应——这是对话生成的训练数据格式，不是意图检测\n- D. 成对的用户意图和正确的聊天机器人响应——这是响应生成的配对，不适用于意图分类\n**📌 关键概念**：Few-shot 学习的示例必须匹配任务类型。意图检测 = 分类任务，需要\"输入（用户消息）→ 标签（意图）\"配对。题干出现\"少量样本 + 意图检测\"→想到用户消息-意图配对。","s":"源#71"},{"id":"D2-024","d":2,"t":"single","q":"一家公司在Amazon Bedrock上的一个基本模型上使用了少镜头提示。该模型目前在提示中使用了 10 个示例。该模型每天调用一次，运行良好。公司想降低每月成本。哪种解决方案能够满足这些要求？","o":[{"l":"A","t":"通过使用微调来自定义模型。"},{"l":"B","t":"减少提示中的令牌数量。"},{"l":"C","t":"增加提示中的令牌数量。"},{"l":"D","t":"使用预置吞吐量。"}],"a":["B"],"e":"**✅ 为什么 B.减少提示中的令牌数量。 对**：少样本提示中示例越多，Token 消耗越大、每次调用成本越高；在保持效果的前提下减少提示中的令牌数量可降低成本，正符合题干「降低每月成本」的目标。\n\n**❌ 为什么其他选项错**：\n- A.通过使用微调来自定义模型。：微调有前期训练成本与固定费用，未必降低日常调用成本\n- C.增加提示中的令牌数量。：增加令牌会提高每次调用的费用，成本反而上升\n- D.使用预置吞吐量。：预置吞吐量针对稳定高并发场景，该模型每天仅调用一次，不划算\n\n**📌 关键概念**：Bedrock 按 Token 计费，提示词长度直接影响成本；少样本示例越多成本越高，降低成本可减示例或启用提示缓存。","s":"源#72"},{"id":"D2-025","d":2,"t":"single","q":"一位人工智能从业者正在使用大型语言模型(LLM)来创建营销活动的内容。生成的内容听起来似乎是真实的，但却是不正确的。 LLM 有什么问题？","o":[{"l":"A","t":"数据泄露"},{"l":"B","t":"幻想"},{"l":"C","t":"过度拟合"},{"l":"D","t":"欠拟合"}],"a":["B"],"e":"**✅ 为什么 B. 幻想对**：题干描述\"听起来真实但不正确\"，这正是 LLM 幻觉（Hallucination）的经典定义——模型生成的内容在语法和逻辑上看似合理，但包含事实错误或虚构信息。幻觉是 LLM 最突出的缺陷之一。\n**❌ 为什么其他选项错**：\n- A. 数据泄露——数据泄露指模型输出中包含训练数据中的敏感信息，而非生成错误内容\n- C. 过度拟合——过拟合指模型在训练数据上表现好但泛化能力差，是训练问题，不描述输出的\"听起来真实但不正确\"\n- D. 欠拟合——欠拟合指模型没有学到数据中的模式，输出质量普遍低，不会\"听起来真实\"\n**📌 关键概念**：幻觉 = 看似正确但实际错误的生成内容。是 GenAI 最大的可靠性挑战。缓解方法：RAG（提供事实依据）、降低温度、输出验证、Guardrails。题干出现\"听起来真实但不正确\"→必定是幻觉。","s":"源#73"},{"id":"D2-026","d":2,"t":"single","q":"一家公司通过使用生成式人工智能构建了一个解决方案。该解决方案使用大型语言模型(LLM)来翻译训练从英语到其他语言的手册。该公司希望通过检查为手册生成的文本来评估解决方案的准确性。哪种模型评估策略符合这些要求？","o":[{"l":"A","t":"双语评价替角(BLEU)"},{"l":"B","t":"均方根误差(RMSE)"},{"l":"C","t":"《吉斯丁评估》中面向回忆的替角"},{"l":"D","t":"F1 分数"}],"a":["A"],"e":"**✅ 为什么 A. 双语评价替角(BLEU) 对**：题干明确是翻译任务的质量评估。BLEU（Bilingual Evaluation Understudy）是机器翻译领域的标准评估指标，通过比较机器翻译结果与参考译文的 n-gram 精确率来衡量翻译质量。\n**❌ 为什么其他选项错**：\n- B. 均方根误差(RMSE)——RMSE 是回归任务的评估指标，衡量预测值与实际值的偏差，不适用于文本翻译\n- C. 面向回忆的替角(ROUGE)——ROUGE 主要用于文本摘要任务评估，以召回率为核心，翻译评估首选 BLEU\n- D. F1 分数——F1 用于分类任务（如问答系统准确性），不是翻译质量的标准指标\n**📌 关键概念**：BLEU = 翻译评估；ROUGE = 摘要评估；F1 = 分类/问答评估；RMSE = 回归评估。题干出现\"翻译 + 评估准确性\"→想到 BLEU。","s":"源#75"},{"id":"D2-027","d":2,"t":"single","q":"一家大型零售商每天都会收到成千上万条关于产品的客户支持查询。客户支持询问需要快速处理和响应。该公司希望为Amazon Bedrock 实现代理。使用Amazon Bedrock Agents可以帮助这家零售商的主要好处是什么？","o":[{"l":"A","t":"生成定制基础模型(FMs)以预测客户需求"},{"l":"B","t":"重复任务的自动化和复杂工作流程的编排"},{"l":"C","t":"自动调用多个基础模型(FMs)并整合结果"},{"l":"D","t":"基于预定义的标准和指标选择基础模型(FM)"}],"a":["B"],"e":"**✅ 为什么 B. 重复任务的自动化和复杂工作流程的编排对**：Bedrock Agent（智能体）的核心价值是自动化执行多步骤任务——它能自主理解客户请求、调用后端 API（查库存、处理退款、更新订单）、编排复杂工作流程，将重复性客服工作自动化处理。\n**❌ 为什么其他选项错**：\n- A. 生成定制基础模型(FMs)以预测客户需求——Agent 不生成 FM，它使用 FM 来执行任务\n- C. 自动调用多个基础模型(FMs)并整合结果——Agent 的核心能力是工具调用和任务编排，不是多模型整合\n- D. 基于预定义的标准和指标选择基础模型(FM)——模型选择是人工决策，不是 Agent 的功能\n**📌 关键概念**：Bedrock Agent = 任务自动化 + 工具调用 + 工作流编排。题干出现\"大量重复查询 + 快速处理\"→想到 Agent 的自动化编排能力。Agent 区别于普通 FM 的关键：能调用外部工具执行操作。","s":"源#76"},{"id":"D2-028","d":2,"t":"single","q":"在微调基础模型(FM)时，哪个选项是持续预培训的好处？","o":[{"l":"A","t":"有助于降低模型的复杂性"},{"l":"B","t":"随着时间的推移提高模型性能"},{"l":"C","t":"减少培训时间要求"},{"l":"D","t":"优化模型推理时间"}],"a":["B"],"e":"**✅ 为什么 B. 随着时间的推移提高模型性能对**：持续预训练（Continued Pre-training）是在已有预训练模型基础上，使用领域特定的新数据继续训练。随着不断注入新的领域数据，模型会逐步学习新术语、新知识和新模式，性能随时间推移持续提升。\n**❌ 为什么其他选项错**：\n- A. 有助于降低模型的复杂性——持续预训练是补充知识，不改变模型复杂性\n- C. 减少培训时间要求——持续预训练需要额外训练时间，不会减少\n- D. 优化模型推理时间——持续预训练影响模型知识，不直接优化推理速度\n**📌 关键概念**：持续预训练 vs 微调：持续预训练用未标注的领域文本扩展模型知识面；微调用标注的任务数据优化任务性能。题干出现\"持续预训练的好处\"→想到知识持续更新、性能随时间提升。","s":"源#77"},{"id":"D2-029","d":2,"t":"single","q":"在生成式人工智能模型中，什么是表征？","o":[{"l":"A","t":"记号是生成式人工智能模型操作的输入和输出的基本单位，代表单词、子单词或其他语言单位。"},{"l":"B","t":"记号是生成式人工智能模型中使用的单词或概念的数学表示。"},{"l":"C","t":"令牌是针对特定任务进行微调的生成式人工智能模型的预训练权重。"},{"l":"D","t":"令牌是给予生成式人工智能模型以生成输出的特定提示或指令。"}],"a":["A"],"e":"**✅ 为什么 A. 记号是生成式人工智能模型操作的输入和输出的基本单位，代表单词、子单词或其他语言单位对**：Token（表征/记号）是 LLM 处理文本的最小单位。文本在输入模型前会被 Tokenizer 分割成 Token 序列（可以是完整单词、子词或单个字符），模型以 Token 为单位进行处理和生成。\n**❌ 为什么其他选项错**：\n- B. 记号是模型中使用的单词或概念的数学表示——这描述的是嵌入（Embedding），不是 Token\n- C. 令牌是针对特定任务进行微调的预训练权重——这描述的是模型权重，与 Token 无关\n- D. 令牌是给予模型以生成输出的特定提示或指令——这描述的是提示（Prompt），不是 Token\n**📌 关键概念**：Token = 文本处理的最小单位（单词/子词/字符）；Embedding = 语义的数值向量表示；Prompt = 给模型的指令输入。三者是不同概念。题干出现\"输入和输出的基本单位\"→想到 Token。","s":"源#78"},{"id":"D2
