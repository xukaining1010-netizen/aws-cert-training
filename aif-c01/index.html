function renderQuiz() {
  const el = document.getElementById('page-quiz');
  if(!quizState || !quizState.questions.length) {
    el.innerHTML = `<div class="header"><button class="back-btn" onclick="navigate('dashboard')">←</button><h1>刷题</h1></div>
    <p style="text-align:center;margin-top:60px;color:var(--text2)">暂无题目，请从仪表盘选择模式开始练习</p>`;
    return;
  }
  const q = quizState.questions[quizState.currentIdx];
  const isHot = q.t === 'hot';
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  // 考核=仅本场作答；练习模式=全局历史（含本场）——防练习记录串进考核视图
  const answers = sessionScopedAnswers();
  const prevAnswers = answers.filter(a=>a.id===q.id);
  const everCorrect = prevAnswers.some(a=>a.ok);
  const everWrong = prevAnswers.some(a=>!a.ok);
  const answered = quizState.answered || {};
  let userAns = answered[q.id];
  const finished = quizState.submitted && quizState.submitted[q.id];
  const correct = finished && isAnswerCorrect(q, userAns);

  let modeLabel = quizState.mode==='exam'?'📋 模拟考核':quizState.mode==='wrong'?'❌ 错题重练':quizState.mode==='domain'?'📖 章节练习':quizState.mode==='single'?'📝 单题练习':'📝 顺序练习';

  let html = `<div class="quiz-header">
    <button class="back-btn" onclick="exitQuiz()">←</button>
    <span style="font-weight:600;font-size:15px">${modeLabel}</span>
    ${quizState.mode==='exam'?`<span class="timer" id="quizTimer"></span>`:''}
    <span class="quiz-progress">${quizState.currentIdx+1}/${quizState.questions.length}</span>
  </div>`;
  html += `<div class="quiz-meta">
    <span class="domain-tag">Domain ${q.d}</span>
    <span>${DOMAIN_NAMES[q.d]}</span>
    <span>${TYPE_NAMES[q.t]}</span>
    ${everCorrect?'<span style="background:rgba(6,214,160,.15);color:var(--correct)">已答对</span>':''}
    ${everWrong?'<span style="background:rgba(239,71,111,.15);color:var(--wrong)">曾答错</span>':''}
  </div>`;
  html += `<div class="question-text">${q.q}</div>`;

  const renderOpts = getOptionsHTML(q, userAns, finished, correct, getShuffledAnswer(q));
  html += renderOpts;

  if(isHot) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?'▶ 完成返回':'▶ 下一题'}</button>
    </div>`;
  } else if(!finished) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>✅ 确认</button>
    </div>`;
  } else {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?(quizState.mode==='exam'?'📊 交卷查看成绩':'▶ 完成返回'):'▶ 下一题'}</button>
    </div>`;
  }

  if(finished) {
    const badge = correct ? '✅ 回答正确!' : '❌ 回答错误';
    const cls = correct ? 'correct' : 'wrong';
    const gItems = getGlossaryForQuestion(q);
    let gHtml = '';
    if(gItems.length) {
      gHtml = '<div class="glossary"><div class="glossary-title">词汇附录</div>';
      gItems.forEach(g => {
        gHtml += '<div class="glossary-item"><span class="glossary-term">' + g.term + '</span><span class="glossary-def">\u00a0\u2014\u00a0' + g.def.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span></div>';
      });
      gHtml += '</div>';
    }
    html += `<div class="explanation show">
      <div class="result-badge ${cls}">${badge}</div>
      <div class="exp-text"><strong>正确答案：</strong>${formatAnswer(q)}</div>
      <div class="exp-text" style="margin-top:8px"><strong>解析：</strong>${highlightGlossaryTerms(fmtExp(q.e))}</div>
      ${q.s?`<div class="exp-source">来源：${q.s}</div>`:''}
      ${gHtml}
    </div>`;
  }

  html += `<div class="qnav"><h4>题号导航</h4><div class="qnav-grid">`;
  quizState.questions.forEach((qq, i) => {
    const qAnswers = answers.filter(a=>a.id===qq.id);
    const qCor = qAnswers.some(a=>a.ok);
    const qWro = qAnswers.some(a=>!a.ok);
    let cls = '';
    if(i===quizState.currentIdx) cls='current';
    else if(qCor) cls='done-correct';
    else if(qWro) cls='done-wrong';
    html += `<div class="qnav-item ${cls}" onclick="jumpToQuestion(${i})">${i+1}</div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
  if(!finished) updateSubmitButton();
}

function getOptionsHTML(q, userAns, finished, correct, shuffledAns) {
  let html = '';
  const qtype = q.t;
  if(qtype === 'hot') {
    html += `<div class="options-list" style="background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:16px">
      <div style="font-weight:600;color:var(--primary);margin-bottom:8px">🖱 本题为拖拽/操作题（HOTSPOT）</div>
      <div style="font-size:13px;line-height:1.7;color:var(--text2)">本题无标准 A/B/C/D 选项，答题形式为图形拖拽/区域选择。题目与图形见源 PDF 原图，答案请参照源文件。</div>`;
    if(q.e) {
      html += `<div style="margin-top:10px;font-size:13px;line-height:1.7;color:var(--text2);border-top:1px solid var(--border);padding-top:10px"><strong>解析/提示：</strong><br>${highlightGlossaryTerms(fmtExp(q.e))}</div>`;
    }
    html += `</div>`;
    return html;
  }
  if(qtype === 'single' || qtype === 'multiple') {
    const isMulti = qtype === 'multiple';
    html += `<div class="options-list">`;
    const opts = quizState.shuffledOptions && quizState.shuffledOptions[q.id] ? quizState.shuffledOptions[q.id] : q.o;
    opts.forEach(o => {
      const isSelected = userAns && userAns.includes(o.l);
      let cls = 'option-item';
      if(isMulti) cls += ' multi';
      if(isSelected && !finished) cls += ' selected';
      if(finished) {
        if(shuffledAns.includes(o.l)) cls += ' correct';
        else if(isSelected) cls += ' wrong';
      }
      const onclick = finished ? '' : `toggleOption('${o.l}')`;
      html += `<div class="${cls}" onclick="${onclick}">
        <span class="opt-label">${o.l}</span>
        <span>${o.t}</span>
      </div>`;
    });
    html += `</div>`;
    if(isMulti && !finished) html += `<div style="font-size:13px;color:var(--text2);margin-top:-12px;margin-bottom:16px">多选——请选择所有正确答案后提交（至少选2项）</div>`;
  }
  return html;
}

/* ================================================================
   ===================== 交互逻辑 =================================
   ================================================================ */

function toggleOption(label) {
  const q = quizState.questions[quizState.currentIdx];
  if(!quizState.answered) quizState.answered = {};
  if(q.t==='single') {
    quizState.answered[q.id] = [label];
  } else {
    const arr = quizState.answered[q.id] || [];
    const idx = arr.indexOf(label);
    if(idx>=0) arr.splice(idx,1);
    else arr.push(label);
    quizState.answered[q.id] = arr;
  }
  renderQuiz();
}

function updateSubmitButton() {
  const q = quizState.questions[quizState.currentIdx];
  if(q.t === 'hot') return;
  const ans = quizState.answered && quizState.answered[q.id];
  const btn = document.getElementById('submitBtn');
  if(!btn) return;
  if(q.t==='single') btn.disabled = !ans || !ans.length;
  else if(q.t==='multiple') btn.disabled = !ans || ans.length < 2;
}

function getShuffledAnswer(q) {
  if(quizState && quizState.shuffledAnswers && quizState.shuffledAnswers[q.id]) {
    return quizState.shuffledAnswers[q.id];
  }
  return q.a;
}

function isAnswerCorrect(q, userAns) {
  if(!userAns) return false;
  const ca = getShuffledAnswer(q);
  if(q.t==='single') return userAns[0]===ca[0];
  if(q.t==='multiple') { const a=[...userAns].sort(); const b=[...ca].sort(); return JSON.stringify(a)===JSON.stringify(b); }
  return false;
}

function formatAnswer(q) {
  const ca = getShuffledAnswer(q);
  if(q.t==='single'||q.t==='multiple') return ca.join(', ');
  if(q.t==='hot') return '本题为拖拽/操作题，答案为图形区域匹配，见源 PDF 原图';
  return '';
}

function submitAnswer() {
  const q = quizState.questions[quizState.currentIdx];
  let userAns = quizState.answered && quizState.answered[q.id];
  if(!userAns) return;
  if(q.t==='multiple' && userAns.length < 2) {
    alert('多选题至少选择2个答案，当前只选了' + userAns.length + '个');
    return;
  }
  const correct = isAnswerCorrect(q, userAns);
  if(!quizState.submitted) quizState.submitted={};
  quizState.submitted[q.id]=true;
  // 本场作答留痕（考核判分唯一依据；不与全局统计混用）
  if(!quizState.results) quizState.results={};
  quizState.results[q.id]={ua:[...userAns], ok:correct, ts:Date.now()};
  recordAnswer(q.id, userAns, correct);
  renderQuiz();
  updateSubmitButton();
}

function prevQuestion() {
  if(quizState.currentIdx > 0) { quizState.currentIdx--; renderQuiz(); }
}
function nextQuestion() {
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  if(isLast) {
    if(quizState.mode==='exam') renderExamResult();
    else navigate('dashboard');
  } else {
    quizState.currentIdx++;
    renderQuiz();
  }
}
function jumpToQuestion(idx) {
  quizState.currentIdx = idx;
  renderQuiz();
}
function exitQuiz() {
  // 考核中途退出必须停表：否则过期计时器归零时会把之后的练习页改写成「考核成绩单」
  if(quizState && quizState.mode==='exam') stopExamTimer();
  if(quizState && quizState.mode!=='exam') {
    setProgress({mode:quizState.mode,domain:quizState.domain||null,idx:quizState.currentIdx,time:Date.now()});
  }
  quizState = null;
  navigate('dashboard');
}

/* ================================================================
   ===================== 刷题模式启动 ==============================
   ================================================================ */
function startDomain(d) {
  const qs = QUESTIONS.filter(q=>q.d===d);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'domain',domain:d,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startContinue() {
  const p = getProgress();
  if(p.mode && p.mode!=='exam') {
    if(p.mode==='domain' && p.domain) {
      const qs = QUESTIONS.filter(q=>q.d===p.domain);
      const _sr=generateShuffledOptions(qs);
      quizState = {mode:'domain',domain:p.domain,questions:qs,currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    } else {
      const _sr=generateShuffledOptions([...QUESTIONS]);
      quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    }
  } else {
    const _sr=generateShuffledOptions([...QUESTIONS]);
    quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  }
  navigate('quiz');
}
function startWrongReview() {
  const wrong = getWrong().filter(w=>!w.mastered);
  if(!wrong.length) { alert('暂无错题需要复习！'); return; }
  const qs = wrong.map(w=>getQById(w.id)).filter(Boolean);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'wrong',domain:null,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startSingle(id) {
  const q = getQById(id);
  if(!q) return;
  const _sr=generateShuffledOptions([q]);
  quizState = {mode:'single',domain:null,questions:[q],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startExam() {
  // 模拟考核：按 meta 权重 × meta 题数分配各域配额（最大余数法，保证总和=EXAM_COUNT）
  const counts = {};
  let sumInt = 0;
  const raw = {}, rem = {};
  DOMAIN_KEYS.forEach(k => {
    const w = parseFloat(String(DOMAIN_WEIGHTS[k]||'0').replace('%',''))/100;
    raw[k] = w * EXAM_COUNT;
    counts[k] = Math.floor(raw[k]);
    rem[k] = raw[k] - counts[k];
    sumInt += counts[k];
  });
  let deficit = EXAM_COUNT - sumInt;
  const order = [...DOMAIN_KEYS].sort((a,b)=>rem[b]-rem[a]);
  let i = 0;
  while(deficit > 0) { counts[order[i % order.length]]++; deficit--; i++; }
  let selected = [];
  DOMAIN_KEYS.forEach(d => {
    const pool = shuffle(QUESTIONS.filter(q=>q.d===d && q.t!=='hot'));
    selected.push(...pool.slice(0, counts[d]));
  });
  selected = shuffle(selected);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam',domain:null,questions:selected,currentIdx:0,answered:{},submitted:{},results:{},shuffledOptions:_exam.opts,shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  // 场次标识：计时回调据此判定「本场是否仍在进行」，防过期计时器串场
  quizState.examToken = 'ex-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

let examTimerInterval = null;
function stopExamTimer() {
  if(examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
}
function startExamTimer() {
  let secs = quizState.examDuration;
  const token = quizState.examToken;
  const timerEl = document.getElementById('quizTimer');
  if(!timerEl) return;
  stopExamTimer();
  examTimerInterval = setInterval(() => {
    // 场次校验：已退出或已换场（新 token）立即自毁
    if(!quizState || quizState.mode!=='exam' || quizState.examToken!==token) { stopExamTimer(); return; }
    secs--;
    const m = Math.floor(secs/60), s = secs%60;
    const el = document.getElementById('quizTimer');
    if(el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if(secs<=60 && el) el.classList.add('warning');
    if(secs<=0) { stopExamTimer(); finishExam(token); }
  }, 1000);
}

function finishExam(token) {
  stopExamTimer();
  // 只对「发起本场计时」的考核会话生效
  if(quizState && quizState.mode==='exam' && (token===undefined || quizState.examToken===token)) renderExamResult();
}

function renderExamResult() {
  if(!quizState) return;
  stopExamTimer();
  const qs = quizState.questions;
  const results = quizState.results || {};
  const total = qs.length;
  // 逐题按本场作答判分；全局历史与往场作答一律不计
  let correct = 0, wrong = 0, unanswered = 0;
  const domStat = {};
  DOMAIN_KEYS.forEach(d => domStat[d] = {n:0, cor:0});
  qs.forEach(q => {
    if(!domStat[q.d]) domStat[q.d] = {n:0, cor:0};
    domStat[q.d].n++;
    const r = results[q.id];
    if(!r) unanswered++;
    else if(r.ok) { correct++; domStat[q.d].cor++; }
    else wrong++;
  });
  // 不变量自校验：正确 + 错误 + 未答 必须等于试卷题数
  if(correct + wrong + unanswered !== total) console.warn('[exam] 判分不变量异常', {correct, wrong, unanswered, total});
  const el = document.getElementById('page-quiz');
  const pct = total ? Math.round(correct/total*100) : 0;
  // 1000-point scale, 700 to pass
  const scaledScore = total ? Math.round(correct/total*1000) : 0;
  const passed = scaledScore >= EXAM_PASS;
  // Time used
  const timeUsed = quizState.examStartTime ? Math.round((Date.now()-quizState.examStartTime)/1000) : 0;
  const timeM = Math.floor(timeUsed/60), timeS = timeUsed%60;

  // Domain breakdown
  let domainHtml = '';
  for(const d of DOMAIN_KEYS) {
    const dd = domStat[d] || {n:0, cor:0};
    const dPct = dd.n ? Math.round(dd.cor/dd.n*100) : 0;
    domainHtml += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${dd.n}</td><td>${dd.cor}</td><td style="color:${dPct>=70?'var(--correct)':'var(--wrong)'}">${dPct}%</td></tr>`;
  }

  el.innerHTML = `<div class="header"><button class="back-btn" onclick="exitExam()">←</button><h1>📋 考核成绩单</h1></div>
  <div style="text-align:center;padding:30px 20px">
    <div style="font-size:48px;font-weight:700;color:${passed?'var(--correct)':'var(--wrong)'}">${scaledScore}</div>
    <div style="font-size:14px;color:var(--text2);margin:4px 0">满分 1000 分 | 及格线 ${EXAM_PASS} 分</div>
    <div style="font-size:16px;color:var(--text);margin:12px 0;font-weight:600">${passed?'✅ 通过！':'❌ 未通过'}</div>
    <div style="display:flex;justify-content:center;gap:20px;margin:16px 0;flex-wrap:wrap">
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--correct)">${correct}</div><div style="font-size:12px;color:var(--text2)">正确</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--wrong)">${wrong}</div><div style="font-size:12px;color:var(--text2)">错误</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text2)">${unanswered}</div><div style="font-size:12px;color:var(--text2)">未答</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--primary)">${pct}%</div><div style="font-size:12px;color:var(--text2)">正确率</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text)">${timeM}分${timeS.toString().padStart(2,'0')}秒</div><div style="font-size:12px;color:var(--text2)">用时</div></div>
    </div>
  </div>
  <div class="stats-chart">
    <h3>各章节成绩</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>题数</th><th>正确</th><th>正确率</th></tr></thead><tbody>
    ${domainHtml}
    </tbody></table>
  </div>
  <div style="text-align:center;padding:20px">
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn-secondary" onclick="exitExam()" style="width:auto">返回首页</button>
      <button class="btn-primary" onclick="startExam()" style="width:auto;flex:none">再考一次</button>
    </div>
  </div>`;
  quizState = null;
}

function exitExam() {
  quizState = null;
  navigate('dashboard');
}

function renderStats() {
  const s = getStats();
  const el = document.getElementById('page-stats');
  let html = `<div class="header"><h1>📊 统计分析</h1></div>`;
  html += `<div class="stats-chart">
    <h3>总进度</h3>

      <div style="height:100%;width:${s.completion}%;background:var(--primary);border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600">${s.completion}%</div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--text2)">
      <span>已答 ${s.doneIds}/${QUESTIONS.length} 题</span>
      <span>正确率 ${s.acc}%</span>
    </div>
  </div>`;
  html += `<div class="stats-chart"><h3>各章节正确率</h3><canvas id="chartDomain"></canvas></div>`;
  html += `<div class="stats-chart"><h3>各题型正确率</h3><canvas id="chartType"></canvas></div>`;
  html += `<div class="stats-chart"><h3>详细数据</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>总题</th><th>已答</th><th>正确</th><th>正确率</th></tr></thead><tbody>`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${ds.total}</td><td>${ds.answered}</td><td>${ds.correct}</td><td style="color:${ds.acc>=70?'var(--correct)':'var(--wrong)'};font-weight:600">${ds.acc}%</td></tr>`;
  }
  html += `</tbody></table></div>`;
  el.innerHTML = html;
  setTimeout(() => {
    drawDomainChart(s);
    drawTypeChart(s);
  }, 50);
}

function drawDomainChart(s) {
  const c = document.getElementById('chartDomain');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = DOMAIN_KEYS.map(k=>'D'+k);
  const colors = ['#4361ee','#4cc9f0','#06d6a0','#f8961e','#9b5de5'];
  const barW = (W-80) / (labels.length*1.5);
  labels.forEach((l,i)=>{
    const val = s.domainStats[i+1].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(l, x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

function drawTypeChart(s) {
  const c = document.getElementById('chartType');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = ['单选','多选'];
  const keys = ['single','multiple'];
  const colors = ['#4361ee','#4cc9f0'];
  const barW = (W-80) / 4;
  keys.forEach((k,i)=>{
    const val = s.typeStats[k].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

/* roundRect polyfill */
if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(r>w/2) r=w/2;
    if(r>h/2) r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    return this;
  };
}

function exportData() {
  const data = {
    answers: getAnswers(),
    wrong: getWrong(),
    progress: getProgress(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${LS_PREFIX}-quiz-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.answers) setAnswers(data.answers);
        if(data.wrong) setWrong(data.wrong);
        if(data.progress) setProgress(data.progress);
        alert('数据导入成功！');
        navigate(currentPage);
      } catch(err) { alert('数据格式错误，请检查文件。'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetData() {
  showModal('确认重置', '确定要清除所有答题记录、错题集和进度吗？此操作不可恢复！', () => {
    localStorage.removeItem(LS_ANSWERS);
    localStorage.removeItem(LS_WRONG);
    localStorage.removeItem(LS_PROGRESS);
    navigate('dashboard');
  });
}

let modalCallback = null;
function showModal(title, text, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOverlay').classList.add('show');

function closeModal() {

  document.getElementById('quizView').classList.toggle('dark');

function init() {
  if(localStorage.getItem(LS_PREFIX+'_theme')==='dark') document.getElementById('quizView').classList.add('dark');
  const pages = ['dashboard','quiz','wrongbook','stats','settings'];
  const app = document.getElementById('app');

    const div = document.createElement('div');
    div.id = 'page-'+p;
    div.className = 'page' + (p==='dashboard'?' active':'');
    app.appendChild(div);

  document.querySelectorAll('.nav-item').forEach(btn => {

  });
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', init);

码问题。"},{"l":"D","t":"使用自然语言处理(NLP)工具来生成代码。"}],"a":"D","e":"解析为学习材料补充（依据 syllabus 1.2 & services.md Amazon Q Developer）：题干描述软件公司用 AI 提高软件开发效率。Amazon Q Developer 是集成 IDE 的 AI 编程助手（代码补全/生成/审查），直接提升开发效率。答案 D 对应 Amazon Q Developer。","src":88},{"id":"D1-159","d":1,"t":"多选","q":"一家公司希望其人工智能模型具有透明度和可解析性。哪种 Amazon SageMaker AI 功能的组合能满足这些要求？（选择两项。）","o":[{"l":"A","t":"SageMaker Model Cards"},{"l":"B","t":"SageMaker Pipelines"},{"l":"C","t":"SageMaker Clarify"},{"l":"D","t":"SageMaker Model Monitor"},{"l":"E","t":"SageMaker Debugger"}],"a":"AC","e":"SageMaker Model Cards提供了标准化的文档，描述了模型的预期用途、训练数据、性能和局限性，有助于提高透明度。 SageMaker Clarity 通过检测偏差并提供特征归因来帮助解析模型行为，使模型决策更具可解析性和可理解性。简答题（总共 2 题） [简答题]","src":351},{"id":"D1-109","d":1,"t":"单选","q":"一位人工智能从业者正在构建一个机器学习模型。该从业者希望向利益相关者提供模型的透明度和可解析性。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"展示模型的夏普利值。"},{"l":"B","t":"提供模型的准确度衡量指标。"},{"l":"C","t":"提供模型混淆矩阵。"},{"l":"D","t":"提供一个安全的模型推理端点。"}],"a":"A","e":"展示模型的夏普利值能够提供透明度和可解析性，通过展示每个特征对单个预测的贡献，帮助利益相关者理解模型输出背后的逻辑。","src":235},{"id":"D1-088","d":1,"t":"单选","q":"哪种类型的人工智能模型进行数值预测？","o":[{"l":"A","t":"传播"},{"l":"B","t":"回归"},{"l":"C","t":"变压器"},{"l":"D","t":"多模态"}],"a":"B","e":"回归模型旨在预测连续数值(例如，预测销售额或估计房价)，使其成为数值预测的合适选择。","src":175},{"id":"D1-040","d":1,"t":"单选","q":"一个 ML 研究团队开发定制的 ML 模型。模型工件与其他团队共享,以便集成到产品和服务中。ML 团队保留模型训练代码和数据。 ML 团队想要建立一种机制,ML 团队可以用它来审计模型。 ML 团队在发布定制 ML 模型时应该使用哪种解决方案?","o":[{"l":"A","t":"用相关信息创建文档。将文档存储在Amazon S3。"},{"l":"B","t":"使用 AWS AI 服务卡来提高透明度和理解模型。"},{"l":"C","t":"创建 Amazon SageMaker 模型卡,包括预期用途、培训和推理细节。"},{"l":"D","t":"创建模型培训脚本。将模型训练脚本提交给 Git 存储库。"}],"a":"C","e":"解析为学习材料补充（依据 syllabus 1.3/MLOps & services.md SageMaker）：题干描述 ML 团队开发定制模型、工件与其他团队共享、团队保留模型（版本/文档管理）。SageMaker Model Registry + Model Cards 支持模型版本管理、标准化文档化、跨团队共享。答案 C 对应 SageMaker 模型注册/卡片方案。","src":87}],"sections":[{"h":"解释基本 AI 概念和术语","body":"\n\n#### 本节定位\n\n本节对应考纲任务声明 1.1「解释基本 AI 概念和术语」。这是整个 AIF-C01 考试的起点——如果把考试比作一栋楼，这一节就是地基。学完之后你应该能清晰回答：AI、ML、深度学习和神经网络这四个概念之间到底是什么层级关系？GenAI 跟传统 ML 的核心区别在哪？智能体 AI 是什么新物种？模型部署时\"实时推理\"和\"批量推理\"有什么区别、分别适合什么场景？监督学习、无监督学习和强化学习三种方法各自解决什么类型的问题？\n\n#### AI、ML、深度学习、神经网络——四层嵌套关系\n\n很多人分不清 AI 和 ML 的关系，或者把深度学习和 AI 画等号。其实这四个概念是严格的嵌套包含关系，从大到小依次是：AI → ML → 深度学习 → 神经网络。\n\n**AI（人工智能）** 是最外层，也是最广义的概念。它指的是让机器模拟人类智能行为的整个学科领域——包括推理、学习、感知、决策等能力。早期的 AI 系统靠人工编写规则来实现（比如国际象棋程序用的是搜索树算法），不涉及任何\"学习\"过程。所以 AI 的范畴远比 ML 大，它包含了规则引擎、专家系统、机器人学、计算机视觉、自然语言处理等众多子领域。\n\n**ML（机器学习）** 是 AI 的一个子集。ML 的核心思想是：不靠人工编写规则，而是让系统从数据中自动学习模式。你给模型喂一堆历史数据（比如过去三年的信用卡交易记录），它自己从中学到\"哪些交易特征预示着欺诈\"，然后就能对新交易做出预测。这种\"从数据中学\"的能力是 ML 区别于传统编程的根本特征。\n\n**深度学习（Deep Learning）** 是 ML 的子集，使用多层（\"深度\"）神经网络自动从原始数据中学习层次化的特征表示。传统 ML 需要人工设计特征（比如告诉模型\"看这笔交易的金额、时间和商户类别\"），而深度学习能自己从原始像素、音频波形或文本序列中提取特征——数据量越大，效果越好。这就是为什么深度学习在图像识别（Amazon Rekognition）、语音识别（Amazon Transcribe）和自然语言处理（Amazon Comprehend）这些处理非结构化数据的领域表现最突出。\n\n**神经网络（Neural Network）** 是深度学习的基础计算结构。它由相互连接的\"神经元\"层组成——输入层接收数据，隐藏层逐层提取特征，输出层给出结果。每层对输入做数学变换，权重和偏置通过训练过程不断调整。现代几乎所有深度学习系统都建立在神经网络之上。\n\n> 考点记忆：画一个同心圆——最外圈 AI，第二圈 ML，第三圈深度学习，最内圈神经网络。考试问\"哪个是哪个的子集\"时，直接看这个圆。\n\n值得特别说明的是，神经网络中有一种特殊结构叫 **Transformer**，它是 2017 年 Google 提出的架构，核心创新是**注意力机制（Attention Mechanism）**——让模型在处理每个词的时候能关注到整段文字中所有其他词的相关性，而不只是看相邻的词。这个架构打破了传统序列模型的效率瓶颈，现在几乎所有主流大语言模型（包括 GPT、Claude、Llama）都是基于 Transformer 构建的。考试中偶尔会考到 Transformer 和注意力机制的基本定义，只需要记住 Transformer 是现代 LLM 的基础架构即可，不需要理解数学细节。另外，Transformer 产生了两大家族：**编码器家族**（如 BERT，擅长理解和分类文本）和**解码器家族**（如 GPT，擅长生成文本）。考试中区分这两类时，记住\"需要理解文本选 BERT 类，需要生成文本选 GPT 类\"。\n[[fig:f01]]\n\n#### GenAI 与传统 ML——\"创作\"与\"判断\"的分水岭\n\n**生成式 AI（GenAI）** 是深度学习中最受关注的分支，也是 AIF-C01 考试的绝对重点。它和传统 ML 的核心区别可以用一句话概括：传统 ML 输出\"判断\"（这张图是猫还是狗），GenAI 输出\"创作\"（画一只猫）。\n\n传统 ML 模型做的是分类、回归、聚类这类任务——给定输入，预测一个标签或数值。而 GenAI 模型能够**生成全新的内容**：文本（写一封商务邮件）、图像（根据文字描述画一幅画）、音频（将文字转为语音）、视频甚至代码。这种创造性输出是传统 ML 做不到的。\n\nGenAI 的典型模型类型包括：**大语言模型（LLM）** 如 Claude、GPT、Llama——处理文本；**扩散模型（Diffusion Model）** 如 Stable Diffusion——生成图像；**多模态模型**——同时处理文本+图像+视频（如 Amazon Nova）。在 AWS 上，调用 GenAI 的核心入口是 **Amazon Bedrock（来源：services.md ML-01）**——通过统一 API 访问多家厂商的基础模型（FM），无需管理 GPU 集群。\n\n#### 智能体 AI——能自主执行多步骤任务的新物种\n\n**智能体 AI（Agentic AI）** 是 AIF-C01 考试的新增重点。传统 AI（包括 LLM）是\"单轮问答\"模式：你问一个问题，它给一个回答，结束。智能体 AI 则是一个能**自主执行多步骤任务**的系统——它能感知环境、制定计划、调用外部工具、记住工作状态，独立完成复杂的工作流。\n\n举个例子：你对智能体说\"帮我分析上季度的销售数据并生成 PPT 报告\"。它会自动拆解为：查询数据库获取销售数据，用 Python 做数据分析，生成图表，创建 PPT 报告。每个步骤它都能调用不同的工具完成，而不需要你手动操作每一步。\n\n智能体 AI 的关键概念包括：**工具使用（Tool Use）**——调用 API、数据库、文件系统等外部系统；**模型上下文协议（MCP）**——标准化的智能体与外部系统连接协议；**多智能体协作**——多个智能体分工协作完成复杂任务。AWS 上的对应服务是 **Amazon Bedrock AgentCore（来源：services.md ML-01）** 和 **Strands Agents**。\n\n> 考点记忆：题干出现\"自主执行多步骤任务\"\"调用工具\"\"编排工作流\"→ 想到智能体 AI。\n\n#### 四种推理类型（来源：syllabus domain1 1.1.3）——模型训练好了怎么上线干活\n\n模型训练完成后，对新数据做预测的过程叫做**推理（Inference）**。根据场景需求不同，AWS 提供四种推理部署方式：\n\n| 推理类型 | 特点 | 适用场景 | AWS 对应 |\n|----------|------|---------|---------|\n| **实时推理** | 始终在线的端点，毫秒级响应 | 在线客服、实时翻译、搜索推荐 | SageMaker Endpoint（实时） |\n| **批量推理** | 一次性处理大批数据 | 月末批量信用评分、夜间百万图片分类 | SageMaker Batch Transform |\n| **异步推理** | 接受请求后排队处理 | 大型文档翻译、长视频分析 | SageMaker Async Inference |\n| **无服务器推理** | 无请求时缩为零，有请求时自动扩展 | 流量不可预测的 API、刚上线的新模型 | SageMaker Serverless Inference |\n\n> 考点记忆：实时=在线服务；批量=离线大批量；异步=长时间处理排队；无服务器=流量不可预测、按需扩缩。\n\n#### 数据的分类方式——AI 模型吃什么粮食\n\nAI 模型的能力上限取决于喂给它的数据质量。数据有多种分类维度：\n\n**按标签分**：**标记数据（Labeled Data）** 每条数据都带\"正确答案\"（如一张猫图标注了\"猫\"），用于监督学习。**未标记数据（Unlabeled Data）** 没有标注，只有原始数据，用于无监督学习或自监督预训练。标记数据成本高（需要人工标注），未标记数据量大但质量参差。\n\n**按结构分**：**结构化数据** 有固定的行列格式（数据库表、Excel），每个字段含义明确。**非结构化数据** 没有固定格式（图片、音频、视频、自由文本、社交媒体帖子）。非结构化数据占企业数据总量的百分之八十以上，深度学习和 GenAI 的核心优势就是处理非结构化数据。**半结构化数据** 介于两者之间（JSON、XML、日志文件）。\n\n**按特征分**：表格数据（传统 ML 最擅长）、时间序列数据（预测股价、流量、温度）、图像数据（计算机视觉）、文本数据（NLP 和 LLM）。\n\n> 考点记忆：有标签→监督学习；无标签→无监督学习。结构化→传统 ML；非结构化→深度学习和 GenAI。\n\n#### 三种核心学习方法\n\n**监督学习（Supervised Learning）** 用标记数据训练——每条输入都有对应的正确输出。模型学会输入到输出的映射关系。典型任务是**分类**（垃圾邮件或正常邮件、肿瘤良性或恶性）和**回归**（预测房价、销售额）。适用条件是有足够的标记数据、任务有明确\"正确答案\"。电商平台的商品推荐、银行的信用评分、医院的疾病预测——绝大多数企业 AI 应用都是监督学习。\n\n**无监督学习（Unsupervised Learning）** 用未标记数据训练——模型自行发现数据中的隐藏模式。典型任务是**聚类**（把客户分成高价值、中等、低活跃等群组）和**降维**（把高维数据压缩为更少的维度以便可视化）。适用条件是数据量大但没有标注、需要探索性分析。客户分群是最常见的应用，AWS 中可用 Amazon SageMaker（来源：services.md ML-02） 的 K-Means 算法实现。\n\n**强化学习（Reinforcement Learning）** 通过奖惩反馈学习最优策略——智能体在环境中试错，做出好决策获得奖励，坏决策受到惩罚。不需要标记数据，而是靠\"尝试、反馈、改进\"的循环。典型应用是游戏 AI（AlphaGo）、机器人控制、自动驾驶。在 GenAI 领域，**RLHF（人类反馈强化学习）** 是用人类评审员对 LLM 回答打分，高分回答被强化、低分被抑制——这就是 ChatGPT 和 Claude 能\"像人一样回答问题\"的核心训练技术。\n[[fig:f02]]\n\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n某连锁酒店集团「云舍」想用 AI 改善运营。前台部门希望客人入住时自动识别身份证——这是图像识别任务，属于深度学习范畴，底层是卷积神经网络（CNN），可直接调用 Amazon Rekognition。客服部门希望自动回复客人在 OTA 平台上的评价——这是文本生成任务，属于生成式 AI，适合用 Amazon Bedrock 调用大语言模型。收益管理部门希望根据历史入住率预测下个月的房价——这是回归预测任务，属于传统监督学习，适合用 Amazon SageMaker 训练 XGBoost 模型。三个部门的需求分别落在 AI 技术栈的不同层级：深度学习（图像）、GenAI（文本生成）、传统 ML（回归预测），对应不同的 AWS 服务入口。这就是 AI/ML/DL/GenAI 分层在实际业务中的典型体现。\n\n#### 常见误区与易错点\n\n**误区 1：把深度学习和 AI 画等号**\n\n考试常设陷阱：给出一个简单的\"用历史数据预测销售额\"场景，选项里有\"深度学习\"和\"监督学习\"——很多人条件反射选深度学习，但正确答案是监督学习（回归）。深度学习只是 ML 的子集，适合处理非结构化数据（图像/语音/文本）；结构化数据的预测任务用传统 ML 算法（XGBoost、线性回归）往往更高效、更可解释。记住：**不是所有 AI 问题都需要深度学习**。\n\n**误区 2：混淆推理类型——\"实时\"和\"无服务器\"不是一回事**\n\n实时推理（Real-time Inference）是指模型部署为始终在线的 API 端点，请求来了立即响应；无服务器推理（Serverless Inference）也是按需响应，但没有常驻实例，冷启动后再处理请求。两者的关键区别在于：实时推理适合持续高流量（端点一直开着），无服务器推理适合间歇性低流量（省钱但有冷启动延迟）。考试题如果说\"流量不稳定、需要节省成本\"→ 选无服务器推理；\"毫秒级响应、流量持续\"→ 选实时推理。\n\n#### 记忆要点\n\n- AI > ML > 深度学习 > 神经网络——四层嵌套，从大到小\n- GenAI 输出\"创作\"（文本/图像），传统 ML 输出\"判断\"（分类/数值）\n- 智能体 AI = 能自主调用工具执行多步任务的 AI 系统（Bedrock AgentCore / Strands Agents）\n- 四种推理类型：批量（大数据离线）、实时（在线 API）、异步（长任务）、无服务器（省钱间歇）\n- 监督学习 = 有标签（分类/回归）；无监督 = 无标签（聚类/降维）；强化 = 奖惩反馈（RLHF）\n- 结构化数据（表格）→ 传统 ML；非结构化数据（图像/文本/音频）→ 深度学习/GenAI\n\n> 本节考点小结：\n> - AI 大于 ML 大于深度学习 大于神经网络（嵌套包含）\n> - GenAI = 生成新内容；传统 ML = 做判断和预测\n> - 智能体 AI = 自主执行多步骤任务 + 调用工具\n> - 有标签→监督学习（分类和回归）；无标签→无监督学习（聚类和降维）；试错+奖惩→强化学习\n> - RLHF = 用人类反馈微调 LLM 的核心技术\n\n\n---\n","figures":[{"id":"f01","title":"AI 技术层级包含关系","caption":"概念越靠内→范围越窄、技术越具体；AI 是最广泛的学科，神经网络是深度学习的基础结构","html":"<svg viewBox=\"0 0 360 240\" style=\"width:100%;max-width:360px;display:block;margin:0 auto\">\n  <!-- AI 最外圈 -->\n  <ellipse cx=\"180\" cy=\"120\" rx=\"170\" ry=\"110\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"2\"/>\n  <text x=\"30\" y=\"40\" font-size=\"14\" fill=\"#4338ca\" font-weight=\"700\">AI（人工智能）<\/text>\n  <!-- ML 中圈 -->\n  <ellipse cx=\"195\" cy=\"130\" rx=\"125\" ry=\"78\" fill=\"#ddd6fe\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"70\" font-size=\"13\" fill=\"#3730a3\" font-weight=\"700\">ML（机器学习）<\/text>\n  <!-- DL 内圈 -->\n  <ellipse cx=\"205\" cy=\"138\" rx=\"82\" ry=\"52\" fill=\"#c7d2fe\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <text x=\"140\" y=\"104\" font-size=\"12\" fill=\"#1e40af\" font-weight=\"700\">深度学习<\/text>\n  <!-- 神经网络 最内 -->\n  <ellipse cx=\"210\" cy=\"145\" rx=\"48\" ry=\"30\" fill=\"#818cf8\" stroke=\"#3730a3\" stroke-width=\"2\"/>\n  <text x=\"178\" y=\"150\" font-size=\"11\" fill=\"#fff\" font-weight=\"700\" text-anchor=\"middle\">神经网络<\/text>\n  <!-- GenAI 标注（DL 子集） -->\n  <rect x=\"22\" y=\"155\" width=\"100\" height=\"28\" rx=\"6\" fill=\"#7c3aed\" opacity=\"0.85\"/>\n  <text x=\"72\" y=\"173\" font-size=\"11\" fill=\"#fff\" font-weight=\"700\" text-anchor=\"middle\">GenAI（ML子集）<\/text>\n  <line x1=\"122\" y1=\"169\" x2=\"155\" y2=\"148\" stroke=\"#7c3aed\" stroke-width=\"1.5\" stroke-dasharray=\"4\"/>\n<\/svg>"},{"id":"f02","title":"三种 ML 学习方法核心对比","caption":"考点记忆：有标签→监督；无标签→无监督；试错+奖惩→强化学习","html":"<table class=\"compare-tbl\">\n<thead>\n<tr>\n  <th style=\"background:#4f46e5;color:#fff;width:20%\">维度<\/th>\n  <th style=\"background:#7c3aed;color:#fff;width:26%\">监督学习<\/th>\n  <th style=\"background:#9333ea;color:#fff;width:26%\">无监督学习<\/th>\n  <th style=\"background:#c026d3;color:#fff;width:28%\">强化学习<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>数据标签<\/strong><\/td><td>✅ 有标签（输入+正确输出）<\/td><td>❌ 无标签（只有输入）<\/td><td>无需标签（奖惩反馈）<\/td><\/tr>\n<tr><td><strong>学习目标<\/strong><\/td><td>学习输入→输出的映射<\/td><td>发现数据中的隐藏模式<\/td><td>最大化累积奖励<\/td><\/tr>\n<tr><td><strong>典型任务<\/strong><\/td><td>分类、回归<\/td><td>聚类、降维<\/td><td>游戏 AI、机器人控制<\/td><\/tr>\n<tr><td><strong>AWS 服务<\/strong><\/td><td>SageMaker（内置算法）<\/td><td>SageMaker（K-Means）<\/td><td>SageMaker RL<\/td><\/tr>\n<tr><td><strong>适用场景<\/strong><\/td><td>有历史标注数据、需精确预测<\/td><td>数据未标注、探索性分析<\/td><td>需要序列决策优化<\/td><\/tr>\n<\/tbody>\n<\/table>"}]},{"h":"确定 AI 的实际使用案例","body":"\n#### 本节定位\n\n本节对应考纲任务声明 1.2「确定 AI 的实际使用案例」。考试不只考你\"AI 是什么\"，更考你\"什么时候该用 AI、什么时候不该用、用哪种 AI\"。学完之后你应该能判断：给定一个业务场景，该用传统 ML 还是 GenAI 还是根本不需要 AI？回归、分类、聚类三种技术类型分别对应什么场景？AWS 有哪些\"开箱即用\"的 AI 服务可以直接调用？\n\n#### 什么时候该用 AI 和 ML\n\nAI 和 ML 不是万能药，它有明确的适用边界。判断一个场景是否适合用 AI，核心看三个条件：\n\n**第一，问题足够复杂，规则难以穷举。** 如果一个问题可以用 if-else 规则明确描述（比如\"订单金额超过 500 元打九折\"），就不需要 AI——传统编程更简单、更可靠、成本更低。但如果规则太多太复杂（比如\"判断一封邮件是否是垃圾邮件\"需要综合考虑发件人、标题、正文、链接、附件、发送频率等上百个特征），传统编程写不过来，ML 就有了用武之地。\n\n**第二，有大量历史数据可供学习。** ML 模型的能力来源于数据。只有几十条记录训练出来的模型不会比人工规则更好。一般来说，监督学习至少需要数千条标记数据，深度学习需要数万到数百万条。数据量不够时，优先考虑传统规则或借助 GenAI 的少样本能力（Few-shot Learning）。\n\n**第三，问题有可衡量的优化目标。** ML 模型需要一个明确的\"什么算好\"的标准——比如分类准确率、预测误差、推荐点击率。如果目标模糊（\"让系统更智能\"），就无法训练和评估模型。\n\n#### 什么时候不该用 AI 和 ML\n\n有三类场景**不建议**使用 AI 和 ML：\n\n**规则明确、逻辑确定的问题**：税率计算、折扣规则、流程审批——用 if-else 或查找表即可，引入 ML 只会增加不必要的复杂性和不确定性。考试中遇到\"一个罐子里有六个红球和四个绿球，求抽到绿球的概率\"这类问题，正确答案是用代码直接算（4/10=0.4），而不是训练一个 ML 模型。\n\n**数据量极少或无数据**：只有十几条历史记录，模型无法有效学习。此时应先积累数据，或用规则系统先顶一段时间。\n\n**需要百分之百确定性的决策**：ML 模型的输出是概率性的，永远有误判的可能。如果场景完全不允许出错（比如确定性的数学计算），用传统编程更准确更高效。\n\n> 考点记忆：题干出现\"已有明确规则或公式\"→ 不需要 AI；出现\"规则难穷举加上大量数据\"→ 选 ML；出现\"生成新内容或理解自然语言\"→ 选 GenAI。\n\n#### 三种核心技术类型——回归、分类、聚类\n\n给定一个 ML 适用的场景，下一步是选择具体的技术类型：\n\n**回归（Regression）** 预测一个连续数值。输入一组特征（房屋面积、楼层、地段），输出一个数字（预测房价 285 万）。场景举例：销售额预测、气温预测、库存需求预测。回归是监督学习的一种。\n\n**分类（Classification）** 将输入分到离散类别中。输入一封邮件的特征，输出\"垃圾\"或\"正常\"。场景举例：垃圾邮件过滤、病情诊断（患病或未患病）、图像识别（猫、狗、车）、欺诈检测（正常交易或可疑交易）。分类也是监督学习。\n\n**聚类（Clustering）** 将相似的数据点分到同一组——但事先没有标签。模型自动发现数据中的\"天然分组\"。场景举例：客户分群（高价值、中等、低活跃客户）、文档主题聚类、异常检测（离群点通常是单独的小簇）。聚类是无监督学习。\n\n> 考点记忆：预测数字→回归；分到类别→分类；无标签找分组→聚类。回归和分类是监督学习；聚类是无监督学习。\n\n#### 真实世界的 AI 应用案例\n\n以下是考试常见的 AI 应用场景和对应的 AWS 服务：\n\n| 应用场景 | AI 类型 | AWS 服务 |\n|----------|--------|---------|\n| 智能客服（对话机器人） | NLP 和 GenAI | Amazon Lex（对话引擎）加 Amazon Bedrock（GenAI 回答） |\n| 欺诈检测 | ML 分类 | Amazon Fraud Detector |\n| 商品和内容推荐 | ML 协同过滤 | Amazon Personalize |\n| 图像和视频分析 | 计算机视觉 | Amazon Rekognition |\n| 语音转文字 | 自动语音识别 | Amazon Transcribe |\n| 多语言翻译 | NLP | Amazon Translate |\n| 文档信息提取 | OCR 加 NLP | Amazon Textract |\n| 情感分析和实体识别 | NLP | Amazon Comprehend |\n| 企业知识库问答 | RAG 加 GenAI | Amazon Bedrock Knowledge Bases 加 Amazon Kendra |\n| 代码辅助和开发效率 | GenAI | Amazon Q Developer |\n\n这些服务的共同特点是**托管式 AI 服务**——你不需要自己训练模型、管理 GPU，直接通过 API 调用就能使用 AI 能力。这是 AWS 相比自建 AI 系统的核心价值。\n\n我们通过几个具体场景来理解这些服务是如何解决实际业务问题的。\n\n**场景一：电商平台的智能客服**。用户在网站上咨询快递进度，传统做法是关键词匹配常见问题库，匹配不到就转人工。用 AI 改造后：Amazon Lex 作为对话引擎理解用户意图（自然语言理解），调用后端物流系统查询状态，用 Amazon Bedrock 生成自然语言回复。如果用户问的是开放式问题（退货政策等），Bedrock Knowledge Bases 会从企业文档中检索相关条款再生成准确回答，这就是 RAG（检索增强生成）在客服场景的典型应用。\n\n**场景二：银行的欺诈交易检测**。每天数百万笔信用卡交易，其中极少数是欺诈。传统规则引擎误报率高、漏报也多。用 ML 分类模型——输入交易金额、商户类别、交易时间、地理位置、持卡人历史行为等几十个特征，输出正常或可疑的概率。Amazon Fraud Detector 就是针对这个场景的托管服务，内置了多种欺诈检测模型，你只需要上传历史交易数据，它自动训练并部署。\n\n**场景三：医疗影像辅助诊断**。医生看一张肺部 CT 需要十几分钟，AI 模型几秒钟就能标出疑似病灶区域。Amazon Rekognition 可以做通用图像分析，但医疗影像通常需要用 Amazon SageMaker 训练专门的深度学习模型——因为医疗图像的特征和日常照片完全不同，通用模型精度不够。\n\n**场景四：企业内部知识搜索**。员工想找差旅报销标准，但信息散落在各个 PDF、Wiki 和邮件里。用 Amazon Kendra 建立企业搜索引擎——它能理解自然语言查询，从多种数据源中找到最相关的文档段落，比传统关键词搜索精准得多。如果进一步结合 Amazon Bedrock，还能直接生成摘要式回答，而不只是返回文档链接。\n\n#### AWS AI 和 ML 服务全景——两大平台加专项服务矩阵\n\nAWS 的 AI 服务体系可以分为三层：\n\n**第一层：底层 ML 平台——Amazon SageMaker AI**。这是 AWS 的全栈 ML 开发平台，覆盖从数据准备、模型训练、评估到部署监控的完整生命周期。如果你需要用自己的数据训练自定义模型，SageMaker 是首选。它包含 Studio（Web IDE）、Training（托管训练）、JumpStart（预训练模型一键部署）、Feature Store（特征存储）、Model Registry（模型注册表）、Model Monitor（模型监控）、Clarify（偏差检测加可解释性）等众多子组件。\n\n**第二层：GenAI 平台——Amazon Bedrock**。这是 AWS 的托管基础模型平台，通过统一 API 调用 Anthropic Claude、Meta Llama、Amazon Nova 等多家厂商的 FM，无需管理基础设施。它是构建 GenAI 应用的首选入口，内置知识库（RAG）、Guardrails（内容安全）、Agent（智能体）、Prompt Management 等企业级功能。\n\n**第三层：专项 AI 服务**——针对具体场景的\"开箱即用\"服务，上面表格中列出的 Rekognition、Transcribe、Translate、Comprehend、Textract、Lex、Personalize、Fraud Detector 等都属于这一层。它们不需要 ML 知识，直接调 API 传入数据即可获得结果。\n\n#### ML 模型 vs 基础模型——什么时候用哪个\n\n\n| 维度 | 传统 ML 模型 | 基础模型（FM） |\n|------|-------------|--------------|\n| **适用数据** | 结构化表格数据为主（CSV/数据库） | 非结构化数据（文本/图像/音频/视频） |\n| **任务类型** | 预测/分类/回归/聚类（单一任务） | 生成/摘要/翻译/对话/代码（多任务通用） |\n| **上线速度** | 需从头训练/调参，周~月级 | 调 API 即可用，小时~天级 |\n| **精度** | 特定任务上可非常高（数据足够时） | 通用能力强，特定任务可能不如专训 ML |\n| **AWS 入口** | Amazon SageMaker（训练+部署） | Amazon Bedrock（调用 FM API） |\n| **考试区分点** | 题干说\"从历史数据预测数值/类别\" → ML | 题干说\"生成文本/理解语言/对话\" → FM |\n\n这是考试常考的选型判断题。核心区别：\n\n**传统 ML 模型**（SageMaker 训练的自定义模型）适用于：有大量结构化标记数据、任务边界清晰、需要高精度的场景。比如电商推荐系统、信用风险评估、工业缺陷检测——这些场景数据量大、标签清晰、用专门训练的模型效果比通用模型好。\n\n**基础模型（FM）** 适用于：任务涉及自然语言理解或生成、不想从头训练、需要快速上线的场景。比如客服问答、内容生成、文档摘要、翻译——这些场景用 Bedrock 调用现成的 LLM 比自己训练模型快得多，而且效果已经足够好。\n\n选型口诀：**有大量标注数据加精度要求极高→SageMaker 自训练；需要语言理解或生成加快速上线→Bedrock FM；两者兼有→先用 FM 原型验证，再看是否需要微调或自训练。**\n\n实际工作中，一个常见的决策流程是：先在 Amazon Bedrock 上用少量样本测试 FM 能否满足需求（这叫\"概念验证\"阶段，成本极低），如果 FM 效果接近但不够精确，尝试用你的领域数据微调 FM（Bedrock 支持托管微调）。只有当微调后效果仍不满意、或你的任务完全不涉及自然语言（比如纯数值预测），才需要在 SageMaker 上从头训练自定义模型。这个\"FM 优先、按需升级\"的策略，是 AWS 官方推荐的最佳实践，也是考试常考的选型逻辑。另外要注意，不是所有场景都需要选一个——很多实际系统是 FM 和传统 ML 混合使用的。比如电商平台的推荐系统用传统 ML（协同过滤），但推荐理由的文字生成用 FM，两者配合才是完整方案。\n\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n某物流公司「快达」每天处理 50 万个包裹，面临三个 AI 选型决策。第一，预测每个配送站明天的包裹量——历史数据充足、输出是数值，典型的回归任务，用 Amazon SageMaker 训练时间序列模型。第二，自动识别破损包裹照片并分类处理——图像分类任务，直接调用 Amazon Rekognition 自定义标签功能，不需要自己训练模型。第三，客服部门每天收到 3000 条客户投诉，需要自动摘要并分类转派——这是文本理解+生成任务，适合用 Amazon Bedrock 调用 FM。而对于\"计算每个包裹的运费\"这种有明确公式的任务，根本不需要 AI——写一段规则代码就够了。判断框架：有数据+规则难穷举 → ML/AI；规则明确 → 传统程序；需要理解语言/图像 → GenAI/DL。\n\n#### 常见误区与易错点\n\n**误区 1：把 Amazon Bedrock 和 Amazon SageMaker 搞混**\n\nBedrock = 调用现成 FM 的平台（不需要训练，按 Token 付费）；SageMaker = 自己训练/部署 ML 模型的全栈平台（需要数据、算力、ML 知识）。考试题如果说\"无需管理基础设施、通过 API 使用基础模型\"→ Bedrock；\"从头训练自定义模型、需要标注数据\"→ SageMaker。\n\n**误区 2：认为 AI 可以解决一切问题**\n\n考试会设置这样的陷阱：给出一个\"数据量极少（只有 10 条）\"或\"规则完全明确（if-else 就能解决）\"的场景，然后问用什么 AI 方案。正确答案往往是\"不需要 AI\"。记住三个不适合 AI 的信号：① 数据极少 ② 规则已知且明确 ③ 需要 100% 确定性（如药品剂量计算）。\n\n**误区 3：混淆\"托管 AI 服务\"和\"自建模型\"**\n\nComprehend/Rekognition/Transcribe/Translate 这些是**预训练好的托管 AI 服务**——你不需要准备数据、不需要训练、直接调 API 用。而 SageMaker 是用来**自己训练和部署模型**的平台。题干说\"不需要 ML 专业知识、直接用\"→ 托管服务；\"需要用自己的数据训练定制模型\"→ SageMaker。\n\n#### 记忆要点\n\n- 用 AI 的三大前提：① 有足够数据 ② 规则难以穷举 ③ 允许概率性输出\n- 不用 AI 的三个信号：① 数据极少 ② 规则明确（if-else 够了）③ 需要 100% 确定性\n- 回归 = 预测数值（房价/销售额）；分类 = 预测类别（是/否、猫/狗）；聚类 = 发现分组（客户分群）\n- AWS AI 两大入口：Bedrock（调用 FM，不训练）vs SageMaker（自己训练模型）\n- 托管 AI 服务速记：Comprehend=文本、Rekognition=图像、Transcribe=语音转文字、Translate=翻译、Lex=对话机器人、Personalize=推荐\n- ML 模型 = 特定任务高精度；FM = 通用多任务灵活\n\n> 本节考点小结：\n> - 用 AI：规则难穷举 加上 有大量数据 加上 有可衡量目标\n> - 不用 AI：规则明确 或 数据极少 或 需百分之百确定性\n> - 预测数字等于回归，分到类别等于分类，找自然分组等于聚类\n> - AWS AI 三层：SageMaker（自训练）、Bedrock（GenAI 和 FM）、专项服务（Rekognition 和 Transcribe 等）\n> - 选型：大量标注加高精度→SageMaker；语言和生成加快上线→Bedrock\n\n\n---\n"},{"h":"描述 AI/ML 开发生命周期","body":"\n#### 本节定位\n\n本节对应考纲任务声明 1.3「描述 AI/ML 开发生命周期」。考试会考 ML 项目从数据到上线的完整流程，以及每个阶段用到的 AWS 服务。学完之后你应该能回答：ML 管道有哪几步、顺序是什么？模型训练好了之后有哪些部署方式？MLOps 是什么概念？衡量模型好不好的指标有哪些？\n\n#### ML 管道八步走——从数据到上线的完整旅程\n\n一个 ML 项目的标准流程（ML Pipeline）包含八个阶段，考试经常以排序题形式考查顺序：\n\n**第一步：数据收集（Data Collection）**——从数据库、日志、传感器、Amazon S3 等数据源获取原始数据。数据是 ML 的燃料，没有数据就没有模型。\n\n**第二步：数据准备（Data Preparation）**——清洗数据：处理缺失值、去除异常值和重复数据、统一格式。这一步花费的时间通常占整个 ML 项目的百分之六十到八十——数据质量决定模型上限。AWS 中，SageMaker Data Wrangler 和 AWS Glue DataBrew 是常用的数据准备工具。\n\n**第三步：特征工程（Feature Engineering）**——从原始数据中提取对预测有用的\"特征\"。比如原始数据有客户的出生日期，特征工程会把它转换为\"年龄\"和\"是否六十岁以上\"这种对模型更有意义的信息。SageMaker Feature Store 是 AWS 的特征存储和共享服务。\n\n**第四步：模型训练（Model Training）**——用准备好的数据训练模型。选择算法、设置超参数、喂入训练数据让模型学习。SageMaker Training 提供托管训练作业，支持分布式训练和自动超参数调优（Hyperparameter Tuning）。\n\n**第五步：模型评估（Model Evaluation）**——用测试数据（模型训练时没见过的数据）检验模型性能。常用指标：分类任务看准确率、精确率、召回率和 F1；回归任务看 RMSE 和 MAE。如果评估结果不满意，回到前面调整数据或算法。SageMaker Clarify 可用于偏差检测和模型可解释性分析。\n\n**第六步：模型部署（Model Deployment）**——将模型部署到生产环境供应用调用。SageMaker 提供四种端点类型（实时、批量、异步、无服务器），或者用 Amazon Bedrock 直接调用 FM。\n\n**第七步：推理服务（Inference）**——模型上线后持续对新数据做预测。这是模型交付业务价值的阶段。\n\n**第八步：监控与迭代（Monitoring）**——持续跟踪模型在生产中的表现。如果发现准确率下降（常见原因是数据漂移——新数据的分布与训练数据不同了），就需要回到第二步重新准备数据、重训练模型。SageMaker Model Monitor（来源：services.md ML-02 监控功能） 自动检测数据漂移和模型退化。\n\n> 考点记忆：收集→准备→特征→训练→评估→部署→推理→监控。第八步监控发现问题后回到第二步重新迭代——形成持续循环。\n[[fig:f03]]\n\n#### FM 的来源——在哪里找到可用的基础模型\n\n训练一个大型基础模型（FM）需要数十亿参数、TB 级数据和数百万美元算力成本，绝大多数企业不会从头训练。那么 FM 从哪里获取？AWS 提供了四个主要来源：\n\n**Amazon Bedrock**：最推荐的方式。通过统一 API 调用 Anthropic Claude、Meta Llama、Amazon Nova、Stability AI 等多家厂商的 FM，按 Token 计费，无需管理基础设施。适合绝大多数 GenAI 应用场景。\n\n**SageMaker JumpStart（来源：services.md ML-03）**：SageMaker 内置的\"模型应用商店\"，提供数百个预训练模型的一键部署。适合需要在自己的 VPC 内运行模型的场景（更强的数据隔离）。\n\n**AWS Marketplace**：第三方模型和算法的商店，可以直接购买、部署到 SageMaker 或 Bedrock。适合寻找特定垂直领域模型的场景。\n\n**开源社区（Hugging Face）**：Meta Llama、Mistral 等开源模型可以从 Hugging Face Hub 下载，在 SageMaker 上自托管。适合需要完全控制模型权重和部署方式的场景。\n\n#### 模型部署方式——托管 API vs 自托管\n\n模型训练或获取完成后，需要部署到生产环境对外提供服务。主要有两种方式：\n\n**托管式 API 服务**：使用 AWS 的托管平台部署。Bedrock 和 SageMaker 端点都属于托管式——AWS 负责基础设施管理、自动扩缩容、安全补丁。你只需要调 API 传入数据，拿回预测结果。这是最推荐的方式——省运维、快上线。\n\n**自托管 API**：在 Amazon EC2 或 Amazon ECS 或 Amazon EKS 容器上自己部署模型服务。好处是完全可控（可以优化推理延迟、选择特定 GPU），坏处是需要自己管理扩缩容、安全、监控。只有对延迟或隐私有极端要求的场景才需要自托管。\n\n#### 各阶段 AWS 服务映射\n\n| 阶段 | AWS 服务 |\n|------|---------|\n| 数据收集和存储 | Amazon S3（数据湖核心）、AWS Glue（数据整合） |\n| 数据准备 | SageMaker Data Wrangler、AWS Glue DataBrew |\n| 特征工程 | SageMaker Feature Store |\n| 模型训练 | SageMaker Training、Bedrock Fine-tuning |\n| 模型评估 | SageMaker Clarify、Bedrock 模型评估 |\n| 模型部署 | SageMaker Endpoint、Bedrock API、SageMaker JumpStart |\n| 推理 | SageMaker Endpoint（四种类型）、Bedrock InvokeModel |\n| 监控 | SageMaker Model Monitor、Amazon CloudWatch |\n| 版本管理 | SageMaker Model Registry |\n| 管道自动化 | SageMaker Pipelines（来源：services.md ML-02）、AWS Step Functions |\n\n#### MLOps——把手工炼丹变成自动化流水线\n\nMLOps（Machine Learning Operations）是把软件工程的 DevOps 实践应用到 ML 开发中的方法论。核心思想是**自动化 ML 的构建、测试和部署流程**，实现可重复、可审计、可持续迭代的 ML 系统。\n\n在 AWS 上，MLOps 的三个核心组件是：\n\n**SageMaker Pipelines**：定义 ML 工作流的 DAG（有向无环图），从数据准备到模型训练到部署的每一步都可以自动化执行，每次运行有完整日志记录。类似于软件开发中的 CI/CD 管道，但专门为 ML 设计。\n\n**SageMaker Model Registry**：模型的\"版本管理仓库\"。每个训练出来的模型都注册在这里，记录版本号、训练数据、性能指标、审批状态。类似于代码的 Git，但管理的是模型文件和元数据。\n\n**SageMaker Model Monitor**：部署后的模型\"健康检查系统\"。自动检测三类问题：数据漂移（新数据分布变了）、模型退化（准确率下降了）、偏差（某个群体的预测质量比其他群体差）。一旦检测到问题，触发告警并可以自动启动重训练流程。\n\n补充两个降低 ML 门槛的工具。**SageMaker Canvas** 是无代码 ML 建模工具——非技术人员通过拖拽界面上传数据、选择预测目标，Canvas 自动尝试多种算法、训练多个模型、选出最优结果。适合业务分析师做需求预测、客户流失预测等场景，完全不需要写一行代码。**SageMaker Autopilot** 是自动化 ML 工具——你提供数据集和预测目标列，Autopilot 自动执行特征工程、算法选择、超参数调优、训练多个候选模型，最后给出最佳模型和完整的可解释性报告。Canvas 面向零代码用户，Autopilot 面向有一定技术基础但想省时间的开发者。考试中经常出现没有 ML 经验或需要最少运营开销的表述——这类题干通常指向 Canvas（完全不需要 ML 知识）或 Autopilot（自动化减少手动工作）。\n\n> 考点记忆：MLOps 等于 CI/CD for ML。Pipelines 等于自动化管道；Registry 等于模型版本库；Monitor 等于上线后健康检查。\n\n#### 模型性能指标——怎么判断模型好不好\n\n不同类型的任务用不同的指标衡量模型性能：\n\n**分类任务指标**：准确率（Accuracy）（来源：syllabus domain1 1.3.6）等于正确预测数除以总预测数，是整体性能最基本衡量。精确率（Precision）回答\"模型说是的里面有多少真的是\"——高精确率意味着误报少。召回率（Recall）回答\"真实是的里面模型抓住了多少\"——高召回率意味着漏报少。F1 分数是精确率和召回率的调和平均，平衡两者的综合指标。\n\n**回归任务指标**：RMSE（均方根误差）是预测值与真实值偏差的平方均值再开根号，越小越好。MAE（平均绝对误差）是偏差绝对值的均值，比 RMSE 对异常值不那么敏感。R 平方（决定系数）表示模型解释了多少数据变异——1 等于完美拟合，0 等于和随机猜一样差。\n\n**GenAI 和 NLP 任务指标**：ROUGE（来源：syllabus domain1 1.3.6 评估指标） 用于摘要评估，衡量生成摘要与参考摘要的重叠度，以召回率为核心。BLEU 用于翻译评估，衡量译文与参考译文的精确率。BERTScore 用 BERT 嵌入计算语义相似度，比 ROUGE 和 BLEU 更懂\"意思对不对\"。LLM-as-Judge 是用另一个 LLM 对输出质量进行评分，可设定自定义评估标准——Amazon Bedrock 模型评估就支持这种方式。\n\n> 考点记忆：分类→准确率、精确率、召回率和 F1；回归→RMSE 和 MAE 和 R 平方；摘要→ROUGE；翻译→BLEU；通用语义→BERTScore。考试常问\"哪个指标用于什么任务\"。\n\n#### 偏差与方差——过拟合和欠拟合的根源\n\n最后补充两个 ML 中最基础的概念。**偏差（Bias）** 是模型预测值与真实值之间的系统性偏离——高偏差意味着模型太简单，无法抓住数据模式，这就是**欠拟合（Underfitting）**。**方差（Variance）** 是模型对不同训练数据集的预测波动——高方差意味着模型太复杂，记住了训练数据中的噪声，这就是**过拟合（Overfitting）**。\n\n偏差和方差之间存在权衡：提高模型复杂度→降低偏差但增加方差；降低模型复杂度→降低方差但增加偏差。目标是找到一个平衡点，使总误差最小。解决过拟合的常见方法包括：增加训练数据量、正则化（Regularization）、Dropout、早停（Early Stopping）和数据增强。 面对欠拟合（高偏差），解决思路相反：增加模型复杂度、添加更多特征、减少正则化强度、延长训练时间。考试中遇到\"模型在训练集和测试集上表现都差\"→ 欠拟合；\"训练集表现好但测试集差\"→ 过拟合——这是最常见的判断题型。\n\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n某电商公司「闪购」决定上线一个 AI 推荐引擎。ML 工程师小王按照标准管道走了一遍：先从数据湖（Amazon S3）拉取半年的用户点击和购买数据（数据收集），用 SageMaker Data Wrangler 清洗缺失值和异常值（数据准备），用 SageMaker Feature Store 构建用户特征和商品特征（特征工程），选择 XGBoost 算法在 SageMaker Training 上训练模型（模型训练），用测试集评估 AUC 和 F1 分数达到 0.85 以上（模型评估），通过 SageMaker 实时推理端点部署上线（模型部署），每秒处理 2000 个推荐请求（推理），SageMaker Model Monitor 每周检查数据漂移和模型性能退化（监控）。两个月后 Model Monitor 报警说用户行为模式变了（大促期间），团队启动再训练——这就是 ML 管道从头到尾的完整闭环。\n\n#### 常见误区与易错点\n\n**误区 1：搞混 MLOps 和 DevOps**\n\nDevOps 管代码的 CI/CD；MLOps 管的是 **数据+代码+模型** 三者的 CI/CD。MLOps 多了数据版本管理（数据变了模型要重训）和模型监控（模型上线后会退化）两个 DevOps 没有的环节。考试问\"以下哪项是 MLOps 独有的\"→ 选\"数据漂移检测\"或\"模型再训练自动化\"，不选\"代码部署自动化\"（那是 DevOps 也有的）。\n\n**误区 2：混淆评估指标的适用场景**\n\n准确率/精确率/召回率/F1 → 分类任务；RMSE/MAE → 回归任务；ROUGE → 摘要任务；BLEU → 翻译任务。考试最常出的陷阱是：给一个分类场景然后选项里混入 RMSE，或者给一个摘要场景选项里混入 F1。记住：**指标和任务类型必须匹配**。\n\n#### 记忆要点\n\n- ML 管道八步口诀：**收、准、特、训、评、部、推、监**（收集→准备→特征→训练→评估→部署→推理→监控）\n- FM 四大来源：Bedrock（托管API）、SageMaker JumpStart（一键部署）、Hugging Face Hub（开源）、AWS Marketplace（第三方）\n- 部署选型：托管 API（Bedrock/SageMaker 端点）→ 省心；自托管（EC2/EKS）→ 控制力\n- MLOps 三件套：SageMaker Pipelines（管道编排）+ Model Registry（模型版本管理）+ Model Monitor（上线监控）\n- 分类指标 = 准确率/精确率/召回率/F1；回归指标 = RMSE/MAE；摘要 = ROUGE；翻译 = BLEU；通用文本 = BERTScore\n- 偏差高 = 欠拟合（模型太简单）；方差高 = 过拟合（模型太复杂）→ 目标是找平衡点\n\n> 本节考点小结：\n> - ML 管道 8 步：收集→准备→特征→训练→评估→部署→推理→监控（循环迭代）\n> - FM 来源：Bedrock（推荐）、JumpStart、Marketplace、开源\n> - 部署：托管 API（推荐）vs 自托管（特殊需求）\n> - MLOps：Pipelines（管道自动化）加 Registry（版本管理）加 Monitor（健康检查）\n> - 指标：分类用 Accuracy 和 Precision 和 Recall 和 F1；回归用 RMSE；NLP 用 ROUGE 和 BLEU 和 BERTScore\n> - 过拟合等于高方差（模型太复杂）；欠拟合等于高偏差（模型太简单）\n\n\n---\n","figures":[{"id":"f03","title":"AI/ML 开发生命周期（8步流程）","caption":"考点：排序题常考此顺序；⑧监控发现问题后回到②重新准备数据，形成持续迭代","html":"<div class=\"flow-row\">\n  <div class=\"flow-node light\">① 数据<br>收集<\/div>\n  <div class=\"flow-arrow\">→<\/div>\n  <div class=\"flow-node light\">② 数据<br>准备<\/div>\n  <div class=\"flow-arrow\">→<\/div>\n  <div class=\"flow-node light\">③ 特征<br>工程<\/div>\n  <div class=\"flow-arrow\">→<\/div>\n  <div class=\"flow-node\">④ 模型<br>训练<\/div>\n  <div class=\"flow-arrow\">→<\/div>\n  <div class=\"flow-node\">⑤ 模型<br>评估<\/div>\n  <div class=\"flow-arrow\">→<\/div>\n  <div class=\"flow-node\">⑥ 模型<br>部署<\/div>\n  <div class=\"flow-arrow\">→<\/div>\n  <div class=\"flow-node\">⑦ 推理<br>服务<\/div>\n  <div class=\"flow-arrow\">→<\/div>\n  <div class=\"flow-node green\">⑧ 监控<br>↺ 迭代<\/div>\n<\/div>"}]}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 1.1.1 | 概念层级辨析：AI→ML→DL→GenAI 的关系 | ⭐⭐⭐ 高 | 选择题、配对题 |\n| 1.1.3 | 推理类型区分（批量/实时/异步/无服务器） | ⭐⭐ 中 | 场景题 |\n| 1.1.5 | 监督/无监督/强化学习的区别与场景 | ⭐⭐⭐ 高 | 场景题 |\n| 1.2.2 | 不宜用 AI 的场景判断 | ⭐⭐ 中 | 判断题 |\n| 1.2.3 | 回归/分类/聚类的区分与场景 | ⭐⭐⭐ 高 | 场景题 |\n| 1.2.5 | AWS AI 服务功能匹配（Transcribe/Translate/Comprehend 等） | ⭐⭐⭐ 高 | 配对题 |\n| 1.2.6 | ML 模型 vs FM 的选型判断 | ⭐⭐ 中 | 决策题 |\n| 1.3.1 | ML 管道阶段排序 | ⭐⭐⭐ 高 | 排序题 |\n| 1.3.5 | MLOps 概念理解 | ⭐⭐ 中 | 选择题 |\n| 1.3.6 | 精确率/召回率/F1 的应用场景 | ⭐⭐⭐ 高 | 场景题 |","services":"| 服务 | 主要用途 | 涉及 Task |\n|---|---|---|\n| Amazon SageMaker AI | 全流程 ML 平台（训练/部署/监控/MLOps） | 1.1, 1.2, 1.3 |\n| Amazon Bedrock | FM/GenAI 平台（核心 FM 服务） | 1.1, 1.2, 1.3 |\n| Amazon Comprehend | NLP 文本分析（情感/实体/关键词） | 1.1, 1.2 |\n| Amazon Transcribe | 语音转文字（ASR） | 1.1, 1.2 |\n| Amazon Translate | 机器翻译 | 1.1, 1.2 |\n| Amazon Lex | 对话式 AI（聊天机器人） | 1.1, 1.2 |\n| Amazon Polly | 文本转语音（TTS） | 1.1, 1.2 |\n| Amazon Rekognition | 图像/视频分析（CV） | 1.2 |\n| Amazon Personalize | 个性化推荐 | 1.2 |\n| Amazon SageMaker Clarify | 模型偏差检测 | 1.1 |"}},{"domain":2,"name":"生成式 AI 基础","weight":"24%","practiceCount":12,"practice":[{"id":"D2-008","d":2,"t":"单选","q":"一家公司希望在 Amazon Bedrock上使用大型语言模型(LLM)进行情感分析。该公司希望将文本段落的情绪分为积极或消极。哪种快速工程策略符合这些要求？","o":[{"l":"A","t":"在提示中提供带有相应肯定或否定标签的文本段落的示例，随后是要分类的新文本段落。"},{"l":"B","t":"在提示中提供情感分析和 LLM 如何工作的详细解释。"},{"l":"C","t":"提供新的文本段落进行分类，没有任何额外的背景或例子。"},{"l":"D","t":"为新课文提供几个不相关的任务的例子，如文本摘要或 1 回答。"}],"a":"A","e":"解析为学习材料补充（依据 syllabus 2.1 & services.md Bedrock）：题干描述用 LLM 做情感分析（积极/消极分类）。在 Bedrock 上可用 FM 通过提示词完成情感分类；也可用 Amazon Comprehend（自带情感分析 API）实现。答案 A 对应使用 Comprehend 情感分析或 Bedrock 提示分类的托管方案。","src":25},{"id":"D2-024","d":2,"t":"单选","q":"一家公司在Amazon Bedrock上的一个基本模型上使用了少镜头提示。该模型目前在提示中使用了 10 个示例。该模型每天调用一次，运行良好。公司想降低每月成本。哪种解决方案能够满足这些要求？","o":[{"l":"A","t":"通过使用微调来自定义模型。"},{"l":"B","t":"减少提示中的令牌数量。"},{"l":"C","t":"增加提示中的令牌数量。"},{"l":"D","t":"使用预置吞吐量。"}],"a":"B","e":"解析为学习材料补充（依据 syllabus 3.2 提示工程 & services.md）：题干描述少样本提示（few-shot）使用 10 个示例、每天高调用量。少样本提示的示例数量越多，Token 消耗越大、成本越高；减少示例数或用提示缓存（Prompt Cache）可降低成本。答案 B 对应通过减少示例/优化提示降低成本的选项。","src":72},{"id":"D2-056","d":2,"t":"单选","q":"在检索增强生成(RAG)中，组块的目的是什么？","o":[{"l":"A","t":"通过存储部分或大块文本来避免大型文本文档的数据库存储限制"},{"l":"B","t":"通过避免将大文本转换成矢量嵌入来提高效率"},{"l":"C","t":"为了提高从向量索引中检索的结果的上下文相关性"},{"l":"D","t":"通过存储部分或大块文本来降低存储成本"}],"a":"C","e":"通过将大文档分割成更小的、语义一致的块，检索系统可以针对给定查询仅匹配并返回最上下文相关的片段，从而提高生成的响应的精确度和准确性。","src":159},{"id":"D2-060","d":2,"t":"单选","q":"一家公司希望对基础模型(FM)进行微调，以回答特定领域的。该公司希望使用基于指令的微调。公司应该如何准备培训资料？","o":[{"l":"A","t":"收集公司内部文件和特定行业的材料。将文件和材料合并成一个文件。"},{"l":"B","t":"从各种在线来源收集外部公司评论。手动将每个评论标记为正面或负面。"},{"l":"C","t":"创建专门针对与公司行业领域相关的主题的问答。"},{"l":"D","t":"创建少量提示，指示模型只回答领域知识。"}],"a":"C","e":"基于指令的微调需要一组指令响应示例。通过管理关注公司领域的问答对，您可以准确地教会模型如何解析特定领域的查询，并在推理过程中生成正确的响应。","src":170},{"id":"D2-130","d":2,"t":"单选","q":"一家从事媒体流传输的公司正在选择Amazon Nova 基础模型（FM）来处理文档和图像。该公司正在比较 Nova Micro 和 Nova Lite。该公司希望将成本降至最低。公司应考虑哪些模型特性才能满足这些要求？","o":[{"l":"A","t":"Nova Micro 采用基于转换器的架构。Nova Lite 不采用基于转换器的架构。"},{"l":"B","t":"Nova Micro 仅支持文本数据。Nova Lite 则针对数值数据进行了优化。"},{"l":"C","t":"Nova Micro 仅支持文本。Nova Lite 支持图片、视频和文本。"},{"l":"D","t":"Nova Micro 仅能在 CPU 上运行。Nova Lite 仅能在 GPU 上运行。"}],"a":"C","e":"Nova Micro 仅支持文本处理，而 Nova Lite 则支持包括图像、视频和文本在内的多模态输入。选择具有更广泛多模态支持的模型，使公司能够选择既满足文档和图像处理需求又最具成本效益的选项。","src":341},{"id":"D2-134","d":2,"t":"单选","q":"哪项陈述准确描述了检索增强生成（RAG）？","o":[{"l":"A","t":"一种利用大量新数据来训练大型语言模型（LLM）以提升其性能的过程"},{"l":"B","t":"一种大型语言模型（LLM）引用外部权威知识库以增强其响应的相关性和准确性而不重新训练的过程"},{"l":"C","t":"一种仅将大型语言模型（LLM）限制在其原始训练数据范围内以提高商业应用响应速度的过程，无需重新训练。"},{"l":"D","t":"一个专注于为在多个国家开展业务的企业提供语言翻译服务的流程"}],"a":"B","e":"检索增强生成通过在推理时从外部权威数据源检索相关信息，并利用这些信息生成更准确且上下文相关的响应，从而增强模型输出，而无需重新训练模型。","src":345},{"id":"D2-007","d":2,"t":"单选","q":"一家公司想制造一个聊天机器人来帮助客户。聊天机器人将在没有人类干预的情况下帮助解决技术该公司为聊天机器人选择了一个基础模型(FM)。聊天机器人需要做出符合公司风格的回应。哪种解决方案符合这些要求？","o":[{"l":"A","t":"设置 FM 可以产生的令牌数量的下限。"},{"l":"B","t":"使用批处理推理来处理详细的响应。"},{"l":"C","t":"试验并改进提示，直到 FM 产生所需的响应。"},{"l":"D","t":"为温度参数定义一个较大的数值。"}],"a":"C","e":"解析为学习材料补充（依据 syllabus 2.1/3.1 智能体 & services.md Bedrock AgentCore）：题干描述无人工干预的客服聊天机器人。Amazon Bedrock AgentCore 支持创建能自主执行多步骤任务、调用工具/API 的 AI 智能体，适合构建自动化客服。答案 C 对应使用 Bedrock AgentCore 构建智能体方案。","src":24},{"id":"D2-144","d":2,"t":"单选","q":"在生产系统中使用生成式人工智能模型的哪个选项是其劣势？","o":[{"l":"A","t":"可能具有高精度和高可靠性"},{"l":"B","t":"确定性和一致性行为"},{"l":"C","t":"计算资源需求极低"},{"l":"D","t":"幻觉与不准确之处"}],"a":"D","e":"生成式人工智能模型可能会产生幻觉和不准确的输出，这在将其部署到生产系统时会带来可靠性和信任方面的风险。","src":366},{"id":"D2-051","d":2,"t":"单选","q":"一家航空公司希望开发一种对话式人工智能助手，来回答客户关于航班时刻表、预订和支付的。该公司希望使用大型语言模型 (LLM)和知识库来创建基于文本的聊天机器人界面。哪种解决方案能够以最少的开发工作量满足这些要求？","o":[{"l":"A","t":"Amazon SageMaker Autopilot上的火车模型。"},{"l":"B","t":"使用 Amazon Bedrock开发一个检索增强生成(RAG)代理。"},{"l":"C","t":"使用 Amazon Q Developer 创建一个 Python 应用程序。"},{"l":"D","t":"微调 Amazon SageMaker Jumpstart 上的模型。"}],"a":"B","e":"Amazon Bedrock允许使用 RAG 架构将大型语言模型与知识库快速集成，从而实现基于最新信息的准确和动态响应。这种方法需要最少的开发工作，同时利用强大的生成功能。","src":150},{"id":"D2-184","d":2,"t":"多选","q":"一家全球物流公司在 Amazon Bedrock 上使用生成式人工智能（GenAI）模型来自动化文书工作和货运文件处理。该公司希望建立清晰的人工智能治理流程，以确保模型得到负责任地使用，并符合公司政策。哪些解决方案能够满足这些要求？（选择两项。）","o":[{"l":"A","t":"建立定期审查流程，以确保模型结果的准确性、公平性，并符合公司政策。"},{"l":"B","t":"为所有使用人工智能工具的员工提供培训，使其了解公司规定、数据处理方法以及负责任地使用人工智能。"},{"l":"C","t":"让云服务提供商负责管理所有 AI 安全检查和审核，以节省内部工作量。"},{"l":"D","t":"仅让开发人员参与治理审查，因为开发人员负责构建和部署人工智能系统。"},{"l":"E","t":"仅在用户报告系统出现或错误时，才审查模型。"}],"a":"AB","e":"定期的审查流程有助于确保生成式人工智能的输出结果保持准确、公正，并符合公司政策。员工培训可确保使用 AI 工具的人员了解负责任的 AI 实践、数据处理规范以及治理要求。 [简答题]","src":450},{"id":"D2-146","d":2,"t":"单选","q":"一家公司正在基于基础模型（FM）开发一款生成式人工智能应用程序。该应用程序需要自动生成营销邮件。公司希望应用程序生成的文本富有创意且篇幅简短。哪种推理参数配置能满足这些要求？","o":[{"l":"A","t":"降低温度和响应长度。"},{"l":"B","t":"提高温度和响应长度。"},{"l":"C","t":"提高温度并缩短响应时间。"},{"l":"D","t":"降低温度并增加响应长度。"}],"a":"C","e":"提高温度会促进生成更具创意和多样性的文本，而缩短响应长度则会限制输出内容的篇幅，这符合创意且简洁的营销邮件的要求。","src":370},{"id":"D2-180","d":2,"t":"单选","q":"一家公司正在使用生成式人工智能（GenAI）系统从患者病历中生成医疗摘要。该系统有时会产生看似可信但实际不准确的信息。哪种策略可以缓解该？","o":[{"l":"A","t":"实施严格的输入验证和输出格式化规则。"},{"l":"B","t":"实施检索增强生成（RAG）以确保回答的准确性。"},{"l":"C","t":"在医疗应用中使用更小、更透明的模型。"},{"l":"D","t":"增加计算资源和模型规模。"}],"a":"B","e":"检索增强生成技术通过将生成的医疗摘要基于可信的患者记录或经批准的医学来源，有助于减少虽可信但不准确的输出，使模型在生成回复时能够利用相关的事实背景。","src":441}],"sections":[{"h":"解释生成式人工智能（GenAI）的基本概念","body":"\n\n#### 本节定位\n\n本节对应考纲任务声明 2.1「解释生成式人工智能（GenAI）的基本概念」。在域1里我们已经搞清楚了 AI、ML、深度学习的层级关系，现在要把焦点收窄到 GenAI 这个最热门的分支。学完之后你应该能回答：Token 到底是什么、为什么大模型按 Token 收费？基础模型和大语言模型有什么区别？RAG 是怎么让模型\"开卷考试\"的？智能体 AI 和普通聊天机器人差在哪里？这些概念是你理解 AWS Bedrock、Nova 等服务的技术基础——域2到域5几乎所有 GenAI 场景题都会用到这些术语。\n\n#### GenAI 的核心技术术语\n\n下面这些术语是 GenAI 的\"基础零件\"，考试经常以概念辨析的形式出现（来源：syllabus domain2 2.1.1）。\n\n**Token（分词单位）** 是大语言模型处理文本的最小单位。你可以把它想象成模型\"读字\"的方式——但它不是按完整的词来读，而是按照分词器（Tokenizer）的规则切分。一个英文单词大约等于 1-2 个 Token；一个中文字大约等于 2-3 个 Token。为什么要关心 Token？两个原因：第一，模型有最大 Token 限制（也叫**上下文窗口 Context Window**，比如 4096、32k、128k Tokens），超过这个长度的内容模型就看不到了；第二，AWS Bedrock 按 Token 数量计费，输入 Token 和输出 Token 分别算钱（来源：aws-bedrock-pricing-models.md）。\n\n**嵌入（Embedding）** 是把非结构化数据（文字、图片等）转换成一串固定长度的数字向量的技术。打个比方：你没办法直接比较\"猫\"和\"狗\"这两个字谁离谁更近，但如果把它们变成坐标点，就可以用数学方法算距离了。语义相近的内容在向量空间中会靠在一起，语义不同的会离得远。嵌入是语义搜索和 RAG 的基础。AWS 上提供嵌入模型的服务是 Amazon Bedrock，存储和检索嵌入向量的数据库包括 Amazon OpenSearch Service、Aurora（pgvector 扩展）等（来源：services.md ML-01）。\n\n**向量（Vector）** 就是嵌入的输出结果——一个由浮点数组成的数组。**向量数据库（Vector Database）** 是专门存储和检索这些向量的系统，当你查询时，它会找出和你的查询向量最相似的那些文档向量。\n\n**分块（Chunking）** 是把一份长文档拆成更小片段的过程。为什么要拆？因为嵌入模型有长度限制，而且把整本手册变成一个向量太粗糙了，不如拆成段落级别，每段独立生成向量，检索时才能精准找到最相关的那一段。Amazon Bedrock 知识库内置了多种分块策略，不需要你手动切文件（来源：services.md ML-01）。\n\n**提示工程（Prompt Engineering）** 是设计和优化输入提示（Prompt）来引导模型产出期望结果的技术。它的核心思路是\"不改模型本身，只改你怎么问\"。常见手法包括：给出清晰指令、提供几个示例（Few-shot）、限定输出格式等。AWS 上的对应功能是 Bedrock Prompt Management，支持提示词版本控制和 A/B 测试（来源：syllabus domain2 2.1.5）。\n\n**上下文工程（Context Engineering）** 和提示工程容易混淆。提示工程关注的是\"Prompt 本身怎么写\"；上下文工程关注的是\"在上下文里放什么信息、怎么组织\"。RAG 就是上下文工程的典型实现——从知识库检索相关文档片段，把它们塞进上下文窗口，让模型在回答时参考这些资料。\n\n#### 关键模型类型\n\n**Transformer** 是现代大语言模型的基础神经网络架构，由 Google 在 2017 年的论文 \"Attention Is All You Need\" 中提出。它的核心创新是**注意力机制（Attention Mechanism）**——让模型在处理每个 Token 时，能关注到输入序列中所有其他 Token 的相关性，而不仅仅看相邻的词。你可以把它理解为\"读书时不只看前后句，而是能快速跳回前面找到相关段落\"（来源：syllabus domain2 2.1.1）。\n\n**大语言模型（LLM, Large Language Model）** 是在海量文本数据上训练的 Transformer 模型，能够理解和生成类人文本。GPT 系列、Claude、Llama 都属于 LLM。它们能做文本生成、问答、翻译、摘要、代码编写等多种任务。\n\n**基础模型（FM, Foundation Model）** 是比 LLM 更广的概念——在大规模多样化数据上预训练的通用模型，可以适应多种下游任务。LLM 是 FM 的一种（处理文本的那种），但 FM 还包括**扩散模型（Diffusion Model）**（生成图像的，比如 Stable Diffusion）和**多模态模型**（同时处理文字、图片、视频的）。Amazon Nova 就是 AWS 自研的多模态 FM 家族，包含 Nova Micro（纯文本、最低成本）、Nova Lite（文本+图片输入）、Nova Pro（高性能多模态）、Nova Premier（最强能力）、Nova Canvas（图像生成）和 Nova Reel（视频生成）（来源：services.md ML-03）。\n\n**扩散模型（Diffusion Model）** 的工作原理类似\"去噪修复\"：先向图像逐步添加噪声直到变成纯噪声，再学习如何一步步去除噪声还原出清晰图像。训练完成后，它就能从随机噪声中生成全新的图像。\n\n#### FM 生命周期——从数据到反馈的完整流程\n\n考纲要求你能描述 FM 的生命周期（来源：syllabus domain2 2.1.3），考试可能出排序题或配对题：\n\n1. **数据选择**——选择高质量、多样化、有代表性的训练数据，考虑来源、版权、质量和偏差\n2. **模型选择**——决定自研、用开源还是直接用已有 FM（比如通过 Bedrock）\n3. **预训练（Pre-training）**——在大规模通用数据上训练模型，学习语言/视觉的通用模式\n4. **微调（Fine-tuning）**——用特定领域数据调整预训练模型，使其在特定任务上表现更好\n5. **评估（Evaluation）**——用基准数据集和人工评估检验模型性能\n6. **部署（Deployment）**——将模型上线供用户使用（托管 API 或自托管）\n7. **反馈（Feedback）**——收集用户使用数据，用于模型优化和下一步迭代\n\n> 排序记忆口诀：**选数→选模→预训→微调→评估→上线→反馈**，七步循环。\n[[fig:f04]]\n\n#### Token 定价——大模型的\"水表\"\n\nAWS Bedrock 的 On-Demand 模式按消耗的 Token 数量计费，输入 Token（你发送的 Prompt）和输出 Token（模型的响应）分别计费，通常输出 Token 单价高于输入 Token（来源：aws-bedrock-pricing-models.md）。影响推理成本的因素包括：\n\n| 因素 | 影响 | 优化方向 |\n|------|------|----------|\n| **上下文长度** | 长上下文消耗更多输入 Token | 精简 Prompt、只放必要的上下文 |\n| **模型规模** | 大模型单价更高 | 简单任务用小模型（如 Nova Micro） |\n| **输出长度** | 长输出消耗更多 Token | 限制输出长度（max_tokens 参数） |\n| **Prompt 缓存** | 缓存重复的 Prompt 前缀可减少重复计费 | 对频繁调用的场景启用 Prompt 缓存 |\n\n除了 On-Demand，Bedrock 还提供 Provisioned Throughput（预置吞吐量）——按预购的模型单元（Model Unit）按小时收费，适合高吞吐稳定负载；以及四种服务层级（Reserved/Priority/Standard/Flex），在可用性和成本之间取舍（来源：aws-bedrock-pricing-models.md）。\n\n#### 智能体 AI——从\"一问一答\"到\"自主干活\"\n\n**智能体 AI（Agentic AI）** 是考试新增重点（来源：syllabus domain2 2.1.6）。传统 LLM 是\"单轮问答\"模式：你问一个问题，它给一个回答。智能体 AI 则是一个能**自主感知环境、制定计划、调用工具、记住工作状态**的系统——它能独立完成多步骤任务。\n\n核心概念包括：\n\n- **AI 智能体（AI Agent）**——能自主执行多步骤任务的 AI 系统。你对它说\"帮我查上个月的销售数据并生成周报\"，它自己拆解为查询数据库→分析数据→生成报告，每一步可以调用不同工具\n- **工具使用（Tool Use）**——模型调用外部预定义函数/API 来完成特定操作（比如查数据库、发邮件、算数学公式）。弥补了模型自身不支持实时数据查询、不能执行精确计算等局限\n- **模型上下文协议（MCP, Model Context Protocol）**——标准化协议，用于连接 AI 智能体和外部系统（数据库、API、文件系统等），让智能体能标准化地\"读写\"外部资源\n- **多智能体系统**——多个 AI 智能体协作完成复杂任务，各司其职（一个写代码、一个审代码、一个测试），类似流水线\n- **工作流编排**——将多个 AI 任务组织为自动化工作流，按顺序或条件执行\n- **内存管理**——智能体维护对话历史、工作状态和任务进度信息，使其能\"记住\"之前做了什么\n\nAWS 上的对应服务是 **Amazon Bedrock AgentCore**（创建和管理智能体）和 **Strands Agents**（多智能体工作流编排）（来源：services.md ML-04, DEV-03）。\n\n#### GenAI 模型的使用案例\n\n考纲要求考生能\"确定 GenAI 模型的潜在使用案例\"（来源：syllabus domain2 2.1.2）：\n\n- **图像、视频和音频生成**——根据文字描述生成视觉/听觉内容（营销素材、影视制作）\n- **摘要（Summarization）**——将长文档/会议记录浓缩为简短摘要\n- **AI 助手**——对话式 AI，提供问答、建议和任务执行（如 Amazon Q）\n- **翻译**——跨语言翻译，包括实时对话翻译\n- **代码生成**——根据自然语言描述生成代码（如 Amazon Q Developer、Kiro）\n- **客服代理**——智能客服处理用户咨询和工单\n- **语义搜索**——基于语义理解而非关键词的智能搜索（如 Bedrock 知识库）\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n某在线教育平台「学海」拥有 5000+ 门课程的视频和讲义。学生经常在客服系统提问\"Python 协程那节课在第几章\"之类的问题，人工客服每天要处理 800+ 条类似咨询。技术团队决定用 GenAI 改造这套系统。\n\n第一步，他们把所有课程讲义上传到 Amazon S3，用 Bedrock 知识库自动分块和生成嵌入向量，存到 OpenSearch Service 的向量数据库中。这就是 RAG 架构——当学生提问时，系统先把问题转为嵌入向量，在向量数据库中检索最相关的讲义片段，再把这些片段作为上下文传给 LLM，LLM 基于这些真实讲义内容生成回答。这样模型就不会\"编造\"不存在的课程内容——因为答案来源于实际讲义。\n\n第二步，他们给智能体配置了工具使用能力：当学生问\"我上次学到哪了\"，智能体自动调用学习记录 API 查询进度，再结合课程数据给出个性化推荐。整个流程无需人工介入，客服工单量下降了 65%。\n\n这个案例中用到了本节的多个核心概念：Token（计费单位）、分块（讲义切片）、嵌入（向量化）、向量数据库（存储检索）、RAG（开卷考试式回答）、智能体（自主调用 API）、工具使用（查询学习记录）。\n\n#### 常见误区与易错点\n\n**误区 1：基础模型（FM）和大语言模型（LLM）是同一回事**\n\n考试中 FM 和 LLM 有时互换使用，但严格来说 FM 的范围更广——FM 包含 LLM（文本模型）、扩散模型（图像模型）、多模态模型等多种类型。记住：**所有 LLM 都是 FM，但不是所有 FM 都是 LLM**。题目如果强调\"能同时处理文字和图片\"，那说的是多模态 FM，不是 LLM。\n\n**误区 2：上下文工程和提示工程是同一件事**\n\n两者密切相关但侧重点不同。提示工程关注 Prompt 本身的措辞和结构（比如\"请用列表格式回答\"）；上下文工程关注在上下文里提供什么信息、怎么组织（比如 RAG 从知识库检索文档片段塞进上下文）。考试题目如果提到\"从外部数据源补充信息给模型\"，选上下文工程或 RAG；如果提到\"优化 Prompt 的写法\"，选提示工程。\n\n**误区 3：Token 数量和字符数量成正比**\n\n不同语言的 Token 化效率差异很大。英文中 1 个单词约 1-2 个 Token，但中文 1 个字约 2-3 个 Token，所以同样内容中文消耗的 Token 更多、费用更高。估算成本时别简单拿字符数除以4。\n\n#### 记忆要点\n\n- Token ≈ 分词单位，是 LLM 计费和处理的最小粒度；中文 1 字 ≈ 2-3 Token\n- Embedding ≈ 把词义变成坐标，让语义相近的内容在向量空间中靠近\n- RAG ≈ 开卷考试带参考资料——从知识库检索相关文档塞进上下文\n- FM > LLM：FM 包含文本模型、图像模型、多模态模型\n- FM 生命周期七步：选数→选模→预训→微调→评估→上线→反馈\n- Bedrock 按 Input/Output Token 分别计费，输出 Token 单价更高\n- 智能体 AI = 能自主调用工具执行多步骤任务的 AI 系统\n- 上下文工程 ≠ 提示工程：前者管\"放什么信息\"，后者管\"怎么写 Prompt\"\n\n\n---\n","figures":[{"id":"f04","title":"FM 生命周期（7步·含反馈循环）","caption":"考点：排序题常考；反馈→迭代是 FM 与传统 ML 流程的关键区别","html":"<div class=\"cycle-wrap\">\n  <div class=\"cycle-step\"><div class=\"cycle-num\">1<\/div><div class=\"cycle-label\">数据选择<\/div><\/div>\n  <div class=\"cycle-arrow\">→<\/div>\n  <div class=\"cycle-step\"><div class=\"cycle-num\">2<\/div><div class=\"cycle-label\">模型选择<\/div><\/div>\n  <div class=\"cycle-arrow\">→<\/div>\n  <div class=\"cycle-step\"><div class=\"cycle-num\">3<\/div><div class=\"cycle-label\">预训练<\/div><\/div>\n  <div class=\"cycle-arrow\">→<\/div>\n  <div class=\"cycle-step\"><div class=\"cycle-num\">4<\/div><div class=\"cycle-label\">微调<\/div><\/div>\n  <div class=\"cycle-arrow\">→<\/div>\n  <div class=\"cycle-step\"><div class=\"cycle-num\">5<\/div><div class=\"cycle-label\">评估<\/div><\/div>\n  <div class=\"cycle-arrow\">→<\/div>\n  <div class=\"cycle-step\"><div class=\"cycle-num\">6<\/div><div class=\"cycle-label\">部署<\/div><\/div>\n  <div class=\"cycle-arrow\">→<\/div>\n  <div class=\"cycle-step\"><div class=\"cycle-num\" style=\"background:linear-gradient(135deg,#06d6a0,#059669)\">7<\/div><div class=\"cycle-label\">用户反馈<\/div><\/div>\n<\/div>\n<div style=\"text-align:center;margin-top:6px;font-size:12px;color:#7c3aed\">⟳ 步骤7的反馈驱动下一轮从步骤1/4重新迭代<\/div>"}]},{"h":"了解 GenAI 解决业务问题的能力和局限性","body":"\n\n#### 本节定位\n\n本节对应考纲任务声明 2.2「了解 GenAI 解决业务问题的能力和局限性」。上一节讲的是 GenAI 的技术概念，这一节讲的是更务实的问题——GenAI 在商业环境中\"能做什么\"和\"不能做什么\"。考试中经常出场景题：给你一个业务需求，让你判断 GenAI 是否适合、该选什么模型。学完之后你应该能回答：GenAI 的核心优势有哪些？幻觉问题是什么、会带来什么风险？选模型时要看哪些维度？怎么用业务指标衡量 GenAI 投资是否值得？\n\n#### GenAI 的四大优势\n\nGenAI 相比传统软件方案有几个独特优势（来源：syllabus domain2 2.2.1）：\n\n**适应性强**——同一个基础模型无需重新训练就能应对多种任务类型。你不需要为翻译训练一个模型、为摘要再训练一个模型、为问答再训练第三个——一个 Claude 或 Nova Pro 就能做翻译、摘要、问答、代码生成。这种\"一模多用\"的能力大幅降低了 AI 落地的门槛。\n\n**内容生成能力**——GenAI 能创造全新的文本、图像、代码内容，传统 ML 只能做\"判断\"（分类/预测），没法\"创作\"。营销团队可以用它批量生成广告文案变体，设计团队可以用 Nova Canvas 根据文字描述快速生成概念图，开发团队可以用 Amazon Q Developer 根据注释自动写代码。\n\n**对话能力**——GenAI 模型能保持上下文连贯的多轮对话，理解对话历史并基于之前的内容进行推理。这让它天然适合客服助手、销售咨询、技术支持等需要\"来回聊\"的场景。\n\n**响应速度**——现代 LLM 能在秒级甚至毫秒级内生成自然语言响应，配合流式输出（Streaming），用户体验接近即时。这使得 7x24 的智能客服和实时助手成为可能。\n\n#### GenAI 的缺陷与风险——别把它当万能药\n\nGenAI 不是什么问题都能解决，了解它的缺陷比了解优势更重要（来源：syllabus domain2 2.2.2）：\n\n**幻觉（Hallucination）** 是最高频考点之一。幻觉是指模型生成看似合理但实际上错误的内容——它可能自信满满地告诉你一本不存在的书、一条捏造的法律条文。原因在于 LLM 本质上是概率模型——它根据\"什么词最可能出现在下一个位置\"来生成文本，而不是在\"查询事实数据库\"。缓解幻觉的主要手段是 RAG（让模型基于检索到的真实文档回答）和 Guardrails（设置内容过滤和事实校验）。\n\n**可解释性差**——深度学习模型是\"黑盒\"，你很难追溯模型\"为什么\"给出某个答案。这在需要解释权的场景（金融审批、医疗诊断、法律判断）中是个严重问题，因为法规可能要求你说明决策依据。\n\n**不确定性**——模型本质上是概率性的，同一个问题在不同上下文下可能得到不同答案。每次调用的输出可能有细微差异（除非把温度 Temperature 设为 0）。对于需要精确一致输出的任务（财务计算、合同条款），单独依赖 GenAI 是有风险的。\n\n**不准确**——这和幻觉有关但不完全一样。模型可能在某些领域知识不足，给出过时或片面的信息。它的训练数据有截止日期，对最新事件一无所知（除非通过 RAG 或工具使用补充实时数据）。\n\n> 考点记忆：幻觉 = 编造事实；不确定性 = 同一问题给不同答案；不准确 = 信息过时或片面；可解释性差 = 说不清\"为什么\"。\n\n#### 选择 GenAI 模型的七个考量维度\n\n考试场景题的核心逻辑是：给定业务需求，选最合适的模型。你需要从以下维度综合决策（来源：syllabus domain2 2.2.3）：\n\n| 维度 | 关键问题 | 决策方向 |\n|------|----------|----------|\n| **模型类型** | 需要纯文本、多模态还是代码能力？ | 匹配任务需求选模型类型 |\n| **性能要求** | 需要多快的响应速度？ | 实时应用→低延迟模型；批量处理→可接受更高延迟 |\n| **上下文限制** | 需要处理多长的文档？ | 长文档分析→大上下文模型（如 128k Token） |\n| **合规性** | 数据必须存储在哪里？需要什么认证？ | 合规要求→选支持对应区域和认证的模型 |\n| **成本** | Token 单价和推理总成本能接受多少？ | 高频调用→性价比优先（如 Nova Micro） |\n| **延迟** | 用户能接受多长的等待时间？ | 交互式应用 < 1秒；后台处理可更久 |\n| **模型复杂性** | 问题有多复杂？ | 简单任务用小模型（更快更便宜） |\n\n一个实用的选型思路是：先看任务复杂度决定模型大小，再看延迟和成本要求筛选具体模型。比如简单的分类和提取任务用 Nova Micro 就够了；需要复杂推理和多模态输入的用 Nova Pro 或 Claude Sonnet；预算充裕且追求最强能力的用 Nova Premier。\n\n#### GenAI 业务价值衡量——怎么向老板证明\"花得值\"\n\n光说\"AI 很厉害\"不够，企业需要用数字说话。考纲列出了五个业务指标来衡量 GenAI 投资效果（来源：syllabus domain2 2.2.4）：\n\n| 指标 | 全称 | 定义 | 适用场景 |\n|------|------|------|----------|\n| **ROI** | 投资回报率 | (收益 - 成本) / 成本 | 评估 GenAI 项目的总体商业价值 |\n| **效率** | Efficiency | 完成任务的速度和资源消耗比 | 衡量自动化提升（如客服响应时间缩短） |\n| **转化率** | Conversion Rate | 完成目标动作的用户比例 | 衡量 AI 驱动的推荐/营销效果 |\n| **ARPU** | 每用户平均收入 | 总收入 / 活跃用户数 | 衡量 AI 功能对收入的拉动 |\n| **CLV** | 客户终身价值 | 客户整个生命周期的总价值贡献 | 衡量 AI 对客户留存和复购的影响 |\n\n考试中这类题通常是配对题——给出一个场景描述，让你选对应的指标。记忆技巧：**ROI 看总账**（值不值得投）；**效率看速度**（快了多少）；**转化率看动作**（有多少人买了/点了）；**ARPU 看人均收入**（每个用户贡献多少钱）；**CLV 看长期**（客户一辈子贡献多少）。\n\n#### 什么时候不该用 GenAI\n\n这个反面知识和优势同样重要。以下场景应谨慎使用或避免 GenAI：\n\n- **需要精确计算的任务**——LLM 不擅长数学运算，3287 × 4156 它可能算错。这种任务应该用传统代码或计算器，或者让智能体通过工具使用调用计算函数\n- **需要实时最新数据的任务**——模型的训练数据有截止日期。要查今天的股价，必须通过 RAG 或工具使用接入实时数据源\n- **高风险、零容错的决策场景**——医疗诊断、法律裁决、金融审批等场景中，GenAI 只适合作为辅助工具，不适合做最终决策者。必须有人工审核环节（Human-in-the-loop），AWS 上对应的服务是 Amazon A2I\n- **训练数据敏感的场景**——如果业务数据包含大量 PII（个人身份信息）或 PHI（受保护健康信息），需要特别关注数据隐私合规（来源：syllabus domain2 2.2.3）\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n某跨境电商平台「海蓝购」年销售额约 8 亿元，客服团队 120 人。他们考虑引入 GenAI 客服助手，需要做选型决策。\n\n**需求分析**：客户咨询以退换货查询、物流追踪、商品咨询为主，平均每个对话 4-6 轮。高峰期（大促）每小时 3000+ 条咨询，平时 500 条。客户遍布 12 个国家，需要支持中英日三语。\n\n**选型考虑**：任务不需要图像处理→纯文本模型即可；需要多轮对话→选对话能力强的 LLM；多语言→选中英日表现好的模型；高峰期流量大→需要考虑 Token 成本和吞吐量。最终选择 Amazon Bedrock 上的 Claude Sonnet 作为主模型（性价比高、多语言强），配合 RAG 对接退换货政策和商品数据库。\n\n**ROI 测算**：上线后 AI 自动处理了 72% 的常见咨询，人工客服只需介入复杂案例。客服团队从 120 人精简到 45 人（其余转岗），每月节省人力成本约 150 万元。Bedrock 月账单约 12 万元（按 Token 计费）。三个月 ROI = (450万 - 36万) / 36万 = 1150%。客服响应时间从平均 8 分钟缩短到 15 秒（效率指标）。客户满意度从 3.6 分提升到 4.2 分，复购率提高了 11%（CLV 指标）。\n\n**但也遇到了幻觉问题**：初期模型偶尔编造\"7天无理由退货\"的承诺，但实际部分商品不支持。团队随后配置了 Bedrock Guardrails 拒绝退换货政策之外的承诺，并启用 RAG 确保回答基于最新的退换货政策文档。这个案例说明了两件事：第一，GenAI 的商业价值是可量化的；第二，幻觉风险必须通过 Guardrails 和 RAG 来管控。\n\n#### 常见误区与易错点\n\n**误区 1：GenAI 总比传统 ML 好**\n\n考试可能给出一个\"预测下个月销售额\"的场景，选项里有 GenAI 和传统 ML。正确答案是传统 ML（回归模型）。GenAI 擅长生成内容和对话，但对结构化数据的数值预测，传统 ML 算法（XGBoost、线性回归）更高效、更精确、更便宜。记住：**GenAI 不是万能替代品，选最合适的工具，不是最新的工具**。\n\n**误区 2：幻觉可以完全消除**\n\n幻觉是 LLM 架构固有的特性（概率生成机制导致），不能完全消除，只能**缓解**。缓解手段包括：RAG（让模型参考真实文档）、Guardrails（内容过滤和事实校验）、温度调低（降低随机性）、Human-in-the-loop（人工审核）。考试选项里如果有\"通过 XX 方法消除幻觉\"——这类选项通常是错的，正确的说法是\"缓解\"或\"降低\"。\n\n**误区 3：模型越大越好**\n\n大模型能力更强但也更贵、更慢。简单的意图分类或关键词提取任务用 Nova Micro 就够了，用 Nova Premier 是浪费。考试场景题强调\"成本敏感\"或\"低延迟\"时，优先选小模型（来源：syllabus domain2 2.2.3）。\n\n#### 记忆要点\n\n- GenAI 四大优势：适应性、内容生成、对话能力、响应速度\n- GenAI 四大缺陷：幻觉（编造事实）、可解释性差、不确定性、不准确\n- 选型七维度：模型类型、性能、上下文限制、合规、成本、延迟、复杂性\n- 业务指标：ROI（总账）、效率（速度）、转化率（动作）、ARPU（人均收入）、CLV（长期价值）\n- 幻觉只能缓解不能消除——RAG + Guardrails + 低温度 + 人工审核\n- 不是所有问题都该用 GenAI：数值预测→传统 ML，精确计算→工具调用，高风险决策→Human-in-the-loop\n\n\n---\n"},{"h":"描述用于构建 GenAI 应用程序的 AWS 基础设施和技术","body":"\n\n#### 本节定位\n\n本节对应考纲任务声明 2.3「描述用于构建 GenAI 应用程序的 AWS 基础设施和技术」。前两节讲了 GenAI 的概念和能力局限，这一节回答最实际的问题——在 AWS 上到底用哪些服务来构建 GenAI 应用？每个服务的定位是什么？它们之间是什么关系？考试中这是出题大户，经常以\"给定一个场景选服务\"或\"区分两个服务的定位\"的形式出题。学完之后你应该能清晰回答：Bedrock 和 SageMaker 到底有什么区别？Amazon Q 是做什么的？什么时候该用 JumpStart？为什么选 AWS 而不是自建？\n\n#### AWS GenAI 核心服务全景——八大服务一次搞清\n\nAWS 的 GenAI 服务可以分为三层来理解：**底层平台**（构建和训练模型）、**应用平台**（使用模型构建应用）、**上层应用**（直接面向终端用户）。下面逐一说明（来源：syllabus domain2 2.3.1）：\n\n**Amazon Bedrock——GenAI 的\"一站式入口\"**\n\nBedrock 是 AWS 的**托管 FM 平台**——通过统一的 API 调用各类基础模型（来自 Anthropic、Meta、Mistral、Cohere、Stability AI 以及 AWS 自研的 Amazon Nova），无需管理底层 GPU 基础设施（来源：services.md ML-01）。你可以把 Bedrock 理解为\"FM 的自助餐厅\"——各家厂商的模型都摆在台面上，你按需取用，按 Token 付费。\n\nBedrock 的核心功能包括：FM 推理 API（文本/图像/嵌入）、FM 微调（Fine-tuning）、知识库（RAG）、Guardrails（防护机制）、Prompt Management（提示管理）、模型评估（Model Evaluation）、Prompt 缓存、AgentCore（智能体）。几乎 Domain 2-5 的所有 GenAI 场景都可能涉及 Bedrock，它是考试中出镜率最高的服务。\n\n**Amazon SageMaker AI——ML 的\"全功能工厂\"**\n\nSageMaker AI 是 AWS 的**全栈 ML 平台**——覆盖从数据准备、模型训练、模型评估到部署监控的 ML 全生命周期（来源：services.md ML-02, aws-sagemaker-overview.md）。2024 年 12 月，原 Amazon SageMaker 更名为 Amazon SageMaker AI，同时升级为统一数据+分析+AI 平台。\n\nSageMaker AI 的核心组件包括：SageMaker Studio（统一 Web IDE）、Training（托管训练作业）、Endpoints（托管推理端点）、Pipelines（ML 管道的 CI/CD）、Clarify（偏差检测和可解释性）、Model Monitor（生产模型监控）、Model Cards（模型文档化）、JumpStart（预训练模型市场）。SageMaker AI 实例用量支持 Savings Plans 优化成本（来源：aws-sagemaker-overview.md）。\n\n> **Bedrock vs SageMaker 的核心区分**（高频考点）：**SageMaker = 建模型**（自定义 ML 模型的训练和部署）；**Bedrock = 用模型**（使用已有 FM 开发 GenAI 应用）。如果场景是\"需要用自有数据训练一个全新的图像分类模型\"→SageMaker；如果场景是\"需要用 LLM 做智能客服\"→Bedrock。简单说，SageMaker 面向 ML 工程师，Bedrock 面向应用开发者（来源：syllabus domain2 2.3.1）。\n\n**SageMaker JumpStart——开源模型的\"快车道\"**\n\nJumpStart 是 SageMaker 内的**预训练模型市场**，提供数百种开源预训练模型（Llama、Mistral、Falcon 等）的一键部署。选好模型后，JumpStart 自动创建 SageMaker Endpoint，无需手动配置（来源：services.md ML-05）。它的定位是\"从开源模型到托管服务的桥梁\"——当你想用开源 FM 而不是 Bedrock 上的商业模型时，JumpStart 是首选路径。\n\n**Amazon Q——企业级 AI 助手**\n\nAmazon Q 是 AWS 的**企业级 AI 助手**，有两个主要形态（来源：services.md DEV-01）：\n\n- **Amazon Q Business**——连接企业数据源（S3、SharePoint、Confluence、Salesforce 等 40+ 种），用户通过自然语言提问，Q 返回基于企业数据的答案。搜索结果自动根据用户权限过滤——你只能看到有权访问的信息\n- **Amazon Q Developer**——集成到 IDE 中的 AI 编程助手，提供代码补全、代码生成、代码审查、调试建议\n\n**Amazon QuickSight——数据分析 AI**\n\nQuickSight 是 AWS 上的数据分析 AI 服务——用户用自然语言查询数据（比如\"上个季度华东区销售额是多少\"），QuickSight 自动写查询语句并生成可视化图表。面向非技术用户的自助数据分析（来源：services.md ANA-02）。\n\n**Kiro——AI 开发工具**\n\nKiro 是 AWS 的 AI 开发工具，提供代码生成、代码审查、AI 辅助开发和自动化编程功能。和 Amazon Q Developer 类似但定位不同——Kiro 更侧重端到端的 AI 辅助开发体验（来源：services.md DEV-02）。\n\n**Strands Agents——多智能体编排**\n\nStrands Agents 是 AWS 的**多智能体编排服务**——设计和编排多个 AI 智能体的协作工作流（来源：services.md DEV-03）。当你需要多个智能体分工协作（一个分析数据、一个生成报告、一个发送邮件）时，用 Strands Agents 来组织它们的工作流程。\n\n**Amazon Bedrock AgentCore——智能体的创建与管理**\n\nAgentCore 是 Bedrock 内置的 AI 智能体创建功能（来源：services.md ML-04）。一个智能体包含一个 FM、一组工具定义和系统指令。AgentCore 支持多步骤推理（智能体自主分解复杂任务）和通过 IAM 角色进行身份与权限控制。\n\n#### 服务定位速查表\n\n| 服务 | 一句话定位 | 面向人群 |\n|------|-----------|----------|\n| **Bedrock** | 托管 FM 平台，调 API 用模型 | 应用开发者 |\n| **SageMaker AI** | 全栈 ML 平台，建模型训模型 | ML 工程师/数据科学家 |\n| **JumpStart** | SageMaker 里的开源模型市场 | 想用开源 FM 的开发者 |\n| **Amazon Q Business** | 企业数据源的 AI 问答助手 | 企业员工（非技术） |\n| **Amazon Q Developer** | IDE 里的 AI 编程助手 | 软件开发者 |\n| **QuickSight** | 自然语言数据分析和可视化 | 业务分析师（非技术） |\n| **Kiro** | AI 辅助开发工具 | 软件开发者 |\n| **Strands Agents** | 多智能体工作流编排 | AI 应用架构师 |\n| **Bedrock AgentCore** | 智能体创建与管理 | 应用开发者 |\n\n#### 为什么选 AWS 构建 GenAI 应用\n\n考纲要求理解使用 AWS GenAI 服务的优势（来源：syllabus domain2 2.3.2）：\n\n| 优势 | 说明 |\n|------|------|\n| **可访问性（Accessibility）** | 通过 API 即可使用最先进的 FM，无需 ML 专业知识 |\n| **低准入门槛** | 无需 GPU 基础设施、无需管理训练资源 |\n| **成本效益** | 按使用付费（On-Demand），无需前期大量投入 |\n| **上市速度** | 几小时/几天可构建 GenAI 应用原型，而非数月 |\n| **安全性** | 物理安全、网络安全、应用安全多层防护 |\n| **合规性** | 覆盖全球主流合规认证框架（SOC、ISO、HIPAA 等） |\n| **可靠性** | 多 AZ 部署、自动故障恢复、99.99%+ 可用性 |\n\n#### AWS GenAI 服务的成本权衡\n\n企业在使用 AWS 构建 GenAI 应用时，经常面临多个维度的成本权衡（来源：syllabus domain2 2.3.4）：\n\n| 权衡维度 | 说明 | 决策策略 |\n|----------|------|----------|\n| **响应速度 vs 成本** | 低延迟需要更高吞吐→更高基础设施成本 | 非交互场景可接受更高延迟换取低成本的异步/批量处理 |\n| **可用性 vs 成本** | 多 AZ 部署提高可用性→多份资源开销 | 非关键应用可降低可用性级别 |\n| **性能 vs 成本** | 大模型更强但更贵 | 简单任务用小模型，复杂任务用大模型 |\n| **区域覆盖 vs 成本** | 全球多区域部署→跨区域数据传输费 | 优先选择有足够能力且成本低的区域 |\n| **自定义模型 vs 托管 FM** | 微调/训练自定义模型前期投入大 | 通用任务用托管 FM，特殊领域考虑微调 |\n\nBedrock 的四种服务层级也是成本优化手段：Flex 层级成本最低但可用性较低，适合非关键的批量处理；Reserved 层级可用性最高但需要预付费（来源：aws-bedrock-pricing-models.md）。另外，Cross-Region Inference（跨区域推理）通过将请求路由到多个区域来应对单区域容量不足，但会产生跨区域数据传输费。\n\n#### 案例\n\n（虚构示例场景，数字仅为教学示意，非真实客户数据）\n\n某中型法律事务所「明理律所」有 80 名律师，每天需要查阅大量法规文件和判例。他们想用 AI 辅助法律研究。\n\n技术团队的选型过程如下：首先排除了 SageMaker——律所不需要训练自定义模型，需要的是用现有 FM 做文档问答。然后对比了三个方案：\n\n- **方案 A：Bedrock + RAG**——把法规文件上传到 S3，用 Bedrock 知识库做 RAG，律师用自然语言提问，系统返回基于法规原文的回答并标注来源。成本：按 Token 计费，月均 8 万元\n- **方案 B：Amazon Q Business**——连接律所的 SharePoint 和 Confluence，律师直接在 Q 界面提问。成本：按用户数订阅，80 律师月均 5 万元。但 Q Business 的回答不如 Bedrock + RAG 可定制，无法精细控制 Guardrails\n- **方案 C：SageMaker JumpStart 部署开源模型**——部署 Llama 到自己的 SageMaker Endpoint。成本：实例费月均 15 万元，但拥有完全控制权，不存在数据出境合规顾虑\n\n最终选择了方案 A，因为法律场景需要精细的 Guardrails（比如禁止模型给出\"法律建议\"措辞，只能说\"根据法规第 X 条\"）、RAG 可以确保回答基于法规原文（减少幻觉）、按 Token 付费成本最优。这个案例体现了服务选型的三个维度：功能匹配度、合规要求、成本效益。\n\n#### 常见误区与易错点\n\n**误区 1：Bedrock 和 SageMaker 功能完全不重叠**\n\n实际上两者在 FM 微调领域有一定重叠——Bedrock 也支持微调，SageMaker JumpStart 也能部署 FM。但考试中的选型逻辑是：需要**使用已有 FM 快速构建 GenAI 应用**→Bedrock；需要**从零训练自定义 ML 模型或深度定制 FM**→SageMaker。当题目出现\"无需管理基础设施\"\"API 调用即可\"\"快速原型\"→Bedrock；出现\"自定义训练\"\"全生命周期管理\"\"偏差检测和模型监控\"→SageMaker（来源：services.md ML-01, ML-02）。\n\n**误区 2：Amazon Q 和 Bedrock 知识库是同一个东西**\n\nAmazon Q Business 和 Bedrock 知识库都能做企业数据的 AI 问答，但定位不同。Q Business 是面向终端用户的**现成应用**——开箱即用，连接数据源后直接提供问答界面，适合\"让员工直接用\"的场景。Bedrock 知识库是面向开发者的**构建模块**——需要你自己开发应用，但可以深度定制检索策略、Prompt 模板、Guardrails 等，适合\"嵌入到自有应用中\"的场景。\n\n**误区 3：开源模型一定比商业模型便宜**\n\n通过 JumpStart 部署开源模型虽然不需要模型许可费，但你需要为 SageMaker Endpoint 的计算实例持续付费——即使没有请求也在收费（除非用无服务器推理）。而 Bedrock 的 On-Demand 模式只有调用时才付费。所以对于调用量不大的场景，Bedrock 的商业模型反而可能比自部署开源模型更便宜。成本分析时要看总拥有成本（TCO），不能只看模型许可费。\n\n#### 记忆要点\n\n- **Bedrock = 用模型**（API 调用 FM）；**SageMaker = 建模型**（全栈 ML 平台）——这是最高频的区分考点\n- Bedrock 八大功能：推理 API、微调、知识库(RAG)、Guardrails、Prompt 管理、模型评估、Prompt 缓存、AgentCore\n- SageMaker AI 2024 年底更名并升级为统一数据+分析+AI 平台\n- JumpStart = SageMaker 里的开源模型市场，一键部署 Llama/Mistral 等\n- Amazon Q Business = 企业数据 AI 问答（面向终端用户）；Bedrock 知识库 = 可定制的 RAG 构建模块（面向开发者）\n- AWS GenAI 五大优势：可访问性、低门槛、成本效益、上市速度、安全合规\n- 成本权衡核心逻辑：简单任务小模型、复杂任务大模型；通用需求用托管 FM、特殊领域考虑微调\n- Bedrock 四种服务层级：Reserved（最高可用性）→Priority→Standard（默认）→Flex（最低成本）\n"}],"tips":{"points":"| 考点编号 | 考点内容 | 频率 | 常见题型 |\n|---|---|---|---|\n| 2.1.1 | Token / Embedding / Vector 概念辨析 | ⭐⭐⭐ | 选择题 |\n| 2.1.3 | FM 生命周期各阶段排序 | ⭐⭐ | 排序题 |\n| 2.1.4 | Token 定价模型（输入 vs 输出成本） | ⭐⭐⭐ | 场景计算题 |\n| 2.2.2 | 幻觉的定义和影响 | ⭐⭐⭐ | 概念题 |\n| 2.2.3 | 模型选择因素（综合决策） | ⭐⭐⭐ | 场景题 |\n| 2.3.1 | Bedrock vs SageMaker vs Amazon Q 定位区分 | ⭐⭐⭐ | 配对题/选择题 |\n| 2.1.6 | 智能体 AI 概念（MCP、Tool Use、多智能体） | ⭐⭐ | 选择题 |\n| 2.2.4 | 业务指标（ROI/ARPU/CLV）概念匹配 | ⭐⭐ | 配对题 |\n| 2.3.4 | 成本权衡（性能 vs 成本、区域 vs 成本） | ⭐⭐ | 决策题 |","services":"| 服务 | 主要用途 | 涉及 Task |\n|---|---|---|\n| Amazon Bedrock | FM/GenAI 核心平台 | 2.1, 2.2, 2.3 |\n| Amazon Bedrock AgentCore | AI 智能体创建与管理 | 2.1, 2.3 |\n| Amazon SageMaker AI | ML/FM 训练和微调 | 2.3 |\n| SageMaker JumpStart | 预训练模型一键部署 | 2.3 |\n| Amazon Q | 企业 AI 助手 | 2.3 |\n| Amazon Quick | 数据分析 AI | 2.3 |\n| Kiro | AI 开发工具 | 2.3 |\n| Strands Agents | 多智能体工作流编排 | 2.3 |\n| Amazon Nova | AWS 自研 FM 家族 | 2.1, 2.3 |"}},{"domain":3,"name":"基础模型应用","weight":"28%","practiceCount":12,"practice":[{"id":"D3-004","d":3,"t":"单选","q":"一家公司想通过使用 Amazon Bedrock创建一个应用程序。该公司预算有限，更喜欢没有长期承诺的灵活性。哪种Amazon Bedrock 定价模式符合这些要求？","o":[{"l":"A","t":"按需"},{"l":"B","t":"模型定制"},{"l":"C","t":"预置吞吐量"},{"l":"D","t":"Spot 实例"}],"a":"A","e":"解析为学习材料补充（依据 syllabus 3.1/syllabus 3.2 & services.md）：题干问预算有限、无长期承诺、灵活性的 Bedrock 计费方式。Amazon Bedrock 提供按需（On-demand）和预置吞吐量（Provisioned Throughput）两种模式：按需模式按 Token 用量计费、无长期承诺、适合预算有限和可变负载的场景；预置吞吐量模式需要承诺特定吞吐量时段，适合稳定高负载。因此选择按需模式（答案 A）。","src":32},{"id":"D3-001","d":3,"t":"单选","q":"一家公司在生产环境中使用 Amazon SageMaker 作为其 ML 管道。该公司有大量的输入数据高达 1 GB，处理时间长达 1 小时。该公司需要近乎实时的延迟。哪个 SageMaker 推理选项符合这些要求？","o":[{"l":"A","t":"实时推理"},{"l":"B","t":"无服务器推理"},{"l":"C","t":"异步推理"},{"l":"D","t":"批量转换"}],"a":"C","e":"解析为学习材料补充（依据 syllabus 1.3/3.1 & services.md SageMaker）：题干描述生产环境 ML 管道、大量输入数据、需存储/管理/版本控制模型。Amazon SageMaker 的模型注册表（Model Registry）/模型工件存储（S3）用于集中存储、管理和版本控制模型；SageMaker Pipelines 负责管道自动化。答案 C 对应 SageMaker 的模型管理能力。","src":6},{"id":"D3-012","d":3,"t":"单选","q":"一家公司计划使用生成式人工智能模型为用户提供实时服务报价。公司应采用哪些标准来为这个用例选择合适的模型？","o":[{"l":"A","t":"模型尺寸"},{"l":"B","t":"训练数据质量"},{"l":"C","t":"通用用途及高性能 GPU 的可用性"},{"l":"D","t":"模型延迟与优化后的推理速度"}],"a":"D","e":"对于实时服务报价而言，关键要求是响应时间短。具有优化推理速度和低延迟的模型能够确保快速高效的用户交互，因此这是正确的选择标准。","src":331},{"id":"D3-005","d":3,"t":"单选","q":"一家公司正在使用 Amazon Bedrock基础模型来总结内部用例的文档。公司培训了一名自定义模型以提高摘要质量。公司必须采取什么行动才能通过 Amazon Bedrock使用定制模型？","o":[{"l":"A","t":"为定制型号购买预置吞吐量。"},{"l":"B","t":"在 Amazon SageMaker Endpoint中部署定制模型以进行实时推理。"},{"l":"C","t":"在 Amazon SageMaker Model Registry注册模型。"},{"l":"D","t":"授予对 Amazon Bedrock中自定义模型的访问权限。"}],"a":"A","e":"解析为学习材料补充（依据 syllabus 3.3 微调 & services.md Bedrock 微调）：题干描述用 Bedrock 基础模型做文档摘要，训练了自定义模型提高质量。Bedrock 微调（Fine-tuning）用客户数据调整 FM 权重，使模型在特定任务（如内部文档摘要）上表现更好；对比提示工程（不改变权重）、RAG（检索外部信息但不改模型）。答案 A 对应微调。","src":47},{"id":"D3-016","d":3,"t":"单选","q":"一家公司希望将基础模型（FMs）用于多种应用场景，包括内容摘要、代码生成以及客户服务 AI 助手。哪种方案能以最具成本效益的方式实施 FMs？","o":[{"l":"A","t":"为每个特定使用场景选择满足性能要求的最小模型。"},{"l":"B","t":"对所有任务使用当前最大且功能最强的模型，以确保质量。"},{"l":"C","t":"为每个具体使用场景构建并训练一个定制的 FM。"},{"l":"D","t":"对所有推理请求使用批量处理，以降低每次请求的成本和延迟。"}],"a":"A","e":"选择满足性能要求的最小基础模型，有助于在控制推理成本的同时，为每个应用场景实现所需的输出质量。不同任务具有不同的复杂程度，因此将模型大小与任务相匹配是最具成本效益的方法。","src":435},{"id":"D3-014","d":3,"t":"单选","q":"一家公司使用Amazon Bedrock 基础模型（FM）为其内部用例总结文档。该公司在Amazon Bedrock 中训练了一个自定义模型以提高模型总结的质量。该公司需要一个解决方案来在Amazon Bedrock 上使用自定义模型。哪种解决方案能满足这一要求？","o":[{"l":"A","t":"为自定义模型购买预配置的吞吐量。"},{"l":"B","t":"在 Amazon SageMaker AI 端点中部署自定义模型以进行实时推理。"},{"l":"C","t":"将模型注册到 Amazon SageMaker Model Registry。"},{"l":"D","t":"将模型版本的审批状态更新为“已批准”。"}],"a":"A","e":"在Amazon Bedrock 中，自定义基础模型需要购买预留吞吐量，以便部署和用于推理，从而使应用程序能够访问并运行自定义摘要模型。","src":362},{"id":"D3-003","d":3,"t":"单选","q":"Amazon OpenSearch Service 服务的哪一项功能赋予了公司构建矢量数据库应用的能力？","o":[{"l":"A","t":"与Amazon S3 的对象存储集成"},{"l":"B","t":"支持地理空间索引和查询"},{"l":"C","t":"可扩展的索引管理和最近邻搜索功能"},{"l":"D","t":"能够对流数据执行实时分析"}],"a":"C","e":"解析为学习材料补充（依据 syllabus 3.1 RAG/向量数据库 & services.md OpenSearch）：题干问 OpenSearch Service 哪项功能支持构建向量数据库应用。Amazon OpenSearch Service 的向量索引（k-NN 向量检索）能力支持存储和查询向量嵌入，是构建 RAG 应用和语义搜索的向量数据库选择之一。答案 C 对应向量数据库/向量检索能力。","src":21},{"id":"D3-002","d":3,"t":"单选","q":"一家公司正在构建一个解决方案来为防护眼镜生成图像。该解决方案必须具有高准确性，并且必须最小化不正确注释的风险。哪种解决方案能够满足这些要求？","o":[{"l":"A","t":"通过使用 Amazon SageMaker Ground Truth Plus Most Voted 进行人在回路中的验证"},{"l":"B","t":"使用Amazon Bedrock Knowledge Bases进行数据扩充"},{"l":"C","t":"使用 Amazon Rekognition 进行图像识别"},{"l":"D","t":"使用 Amazon QuickSight Q 进行数据汇总"}],"a":"A","e":"解析为学习材料补充（依据 syllabus 3.1 FM 选择 & services.md）：题干描述为防护眼镜生成图像、要求高准确性和最小化错误标注风险。图像生成需用多模态/图像生成模型（如 Nova Canvas 或 Stable Diffusion 类 FM）；BLEU 等指标用于评估生成文本与参考的相似度。答案 A 对应选择图像生成 FM 的方案。","src":8},{"id":"D3-009","d":3,"t":"单选","q":"在人工智能的语境中，“推理”指的是什么？","o":[{"l":"A","t":"创建新的人工智能算法的过程"},{"l":"B","t":"利用训练好的模型对未见过的数据进行预测或决策"},{"l":"C","t":"将多个 AI 模型组合成一个模型的过程"},{"l":"D","t":"用于人工智能系统的训练数据收集方法"}],"a":"B","e":"在人工智能中，推理是指将训练好的模型应用于新的、未见过的数据，以生成预测或决策，利用在训练过程中学到的模式。","src":292},{"id":"D3-013","d":3,"t":"单选","q":"一家公司希望在检测到车辆碰撞后的 30 秒内集成一个 AI 解决方案来联系紧急服务部门。该公司希望使用一个无需额外训练的预训练模型。公司在选择满足这些要求的模型时，应优先考虑哪个因素？","o":[{"l":"A","t":"模型定制"},{"l":"B","t":"模型尺寸"},{"l":"C","t":"模型成本"},{"l":"D","t":"模型温度"}],"a":"B","e":"模型大小直接影响推理速度和延迟，这对于满足严格的实时响应要求至关重要，例如在 30 秒内使用预训练模型联系紧急服务。","src":349},{"id":"D3-011","d":3,"t":"单选","q":"一家公司使用Amazon Comprehend 来分析客户反馈。该公司有多个独特的训练模型。公司使用 Comprehend 为每个模型分配一个端点。该公司希望自动生成一份关于每个超过 15 天未使用的端点的报告。哪种服务能满足这些要求？","o":[{"l":"A","t":"AWS Trusted Advisor（可信顾问）"},{"l":"B","t":"Amazon CloudWatch"},{"l":"C","t":"AWS CloudTrail 服务"},{"l":"D","t":"AWS Config"}],"a":"B","e":"Amazon CloudWatch 可以监控Amazon Comprehend 端点指标，例如调用次数。通过跟踪使用情况并设置警报或自动检查，它可以为过去 15 天内未使用的端点生成报告。","src":330},{"id":"D3-007","d":3,"t":"多选","q":"一家公司希望部署一个对话聊天机器人来回答客户的问题。聊天机器人是基于一个微调的 Amazon SageMaker JumpStart 模型。应用程序必须符合多个监管框架。公司可以展示哪些能力的合规性？（选择两个。）","o":[{"l":"A","t":"自动缩放推理端点"},{"l":"B","t":"威胁检测"},{"l":"C","t":"数据保护"},{"l":"D","t":"成本优化"},{"l":"E","t":"松散耦合的微服务"}],"a":"BC","e":"**✅ 为什么 B. 威胁检测和 C. 数据保护对**：\n- B（威胁检测）：AWS 提供 GuardDuty、CloudTrail 等威胁检测服务，可以监控对 SageMaker Endpoint的异常访问模式，检测恶意活动，展示安全监控合规能力。\n- C（数据保护）：AWS 提供 KMS 加密、IAM 权限控制、VPC 网络隔离、Macie 敏感数据检测等数据保护能力，确保训练数据和模型输出的安全性，满足 GDPR/HIPAA 等法规的数据保护要求。\n**❌ 为什么其他选项错**：\n- A. 自动缩放推理端点——自动扩缩是性能/可用性功能，不是监管合规能力\n- D. 成本优化——成本优化是财务管理，不是合规性要求\n- E. 松散耦合的微服务——微服务架构是设计模式，与监管合规无关","src":215}],"sections":[{"h":"描述设计使用基础模型（FM）的应用程序时有哪些注意事项","body":"\n\n#### 本节定位\n\n本节对应考纲任务声明 3.1「描述设计使用基础模型（FM）的应用程序时有哪些注意事项」。这是整场考试中权重最高的领域（28%）中的第一个任务——如果说整场考试是一场马拉松，那么 Domain 3 就是赛程中最长的上坡路段，而 3.1 就是坡道的起点。学完之后你应该能清晰回答：面对一个具体业务场景，怎么从十几个候选 FM 里挑出最合适的那个？推理参数（温度、Top P、Max Tokens）这些\"旋钮\"各调什么？RAG 到底怎么工作、为什么能减少幻觉？哪些 AWS 服务可以做向量数据库？从零成本的上下文学习到百万美元级的预训练，五种 FM 定制方法各有什么成本权衡？AI 智能体（Agent）在企业里能做什么？\n\n#### FM 选择标准——给业务需求\"选座驾\"\n\n选择基础模型就像买
