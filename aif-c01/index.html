服务，提供对多种高性能生成式 AI 基础模型（含 Amazon Nova、Anthropic Claude 等）的统一 API 访问，无需自建基础设施即可按需选用，是 AWS 上获取广泛 FM 的核心平台，正符合题干对广泛高性能模型的要求。\n\n**❌ 为什么其他选项错**：\n- B.Amazon Rekognition：Rekognition 是图像/视频分析服务，不提供 FM\n- C.Amazon Lex：Lex 用于构建对话式机器人（语音/文本界面），不是 FM 平台\n- D.Amazon Kendra：Kendra 是企业智能搜索服务，不提供生成式 FM\n\n**📌 关键概念**：AWS 生成式 AI 服务分层：Bedrock（FM 平台）为核心；Rekognition（视觉分析）、Lex（对话界面）、Kendra（智能搜索）是专项能力服务。","s":"源#425"},{"id":"D2-156","d":2,"t":"single","q":"企业通过持续使用预训练来微调基础模型（FM）能获得什么好处？","o":[{"l":"A","t":"模型复杂度降低"},{"l":"B","t":"模型性能随时间的提升"},{"l":"C","t":"减少模型训练所需的时间"},{"l":"D","t":"降低模型训练成本"}],"a":["B"],"e":"**✅ 为什么 B.模型性能随时间的提升 对**：持续预训练让 FM 在更多相关数据上持续学习，使其在目标领域的知识与性能随时间不断提升，这正是该方法的核心收益。\n\n**❌ 为什么其他选项错**：\n- A.模型复杂度降低：持续预训练不减少模型参数与复杂度，复杂度由架构决定\n- C.减少模型训练所需的时间：持续预训练是追加训练，反而增加总体训练时间投入\n- D.降低模型训练成本：大规模领域数据训练带来额外算力成本，成本通常上升\n\n**📌 关键概念**：持续预训练（Continued pre-training）的价值 = 领域知识持续积累、性能随时间提升；其代价是训练时间与算力成本增加，两者是对价关系。","s":"源#426"},{"id":"D2-157","d":2,"t":"single","q":"一位人工智能从业者希望采用检索增强生成（RAG）架构，但公司管理层认为 RAG 会使架构过于复杂。哪种回应将支持 AI 从业者使用 RAG 的建议？","o":[{"l":"A","t":"RAG 可以提升大语言模型（LLM）的推理速度。"},{"l":"B","t":"RAG 提高了模型的训练速度。"},{"l":"C","t":"RAG 减少了幻觉。"},{"l":"D","t":"RAG 减少了开发管控。"}],"a":["C"],"e":"**✅ 为什么 C.RAG 减少了幻觉。 对**：RAG 将回答锚定在外部权威数据上，能显著减少幻觉、提高事实准确性，这是应对管理层质疑最有力的技术论据，正符合「支持使用 RAG 的建议」。\n\n**❌ 为什么其他选项错**：\n- A.RAG 可以提升大语言模型（LLM）的推理速度。：RAG 增加检索环节，通常不提升推理速度，该说法不成立\n- B.RAG 提高了模型的训练速度。：RAG 不涉及模型训练，更谈不上提高训练速度\n- D.RAG 减少了开发管控。：RAG 反而增加架构组件（知识库/检索），不减少管控要求\n\n**📌 关键概念**：为 RAG 辩护的正确论据 = 减少幻觉+提升事实准确性+知识可随时更新；速度类论据（推理/训练）与管控类论据均站不住脚。","s":"源#429"},{"id":"D2-158","d":2,"t":"single","q":"一家公司使用 Amazon Bedrock Agents 构建了一个基于检索增强生成（RAG）的 AI 助手。但有时该 AI 助手会给出不完整或不准确的回答。该公司希望改进并评估该 AI 助手的性能。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"使用自动评估指标，如双语评价助手（BLEU）分数，来衡量回答与参考"},{"l":"B","t":"监控响应延迟和令牌生成速度以优化性能。"},{"l":"C","t":"仅根据真实"},{"l":"D","t":"确认所获取的文档相关性以及最终"}],"a":["D"],"e":"**✅ 为什么 D.确认所获取的文档相关性以及最终 对**：RAG 助手的质量取决于检索与生成两端，逐一确认「检索文档是否相关」与「最终答案是否准确」，才能定位不完整/不准确回答的根源，是改进与评估的正确切入点。（注：C/D 选项文字有截断，语义按「确认检索文档相关性与最终答案准确性」理解。）\n\n**❌ 为什么其他选项错**：\n- A.使用自动评估指标，如双语评价助手（BLEU）分数，来衡量回答与参考：BLEU 衡量词面重叠，无法定位检索或生成环节的问题\n- B.监控响应延迟和令牌生成速度以优化性能。：延迟与速度是性能指标，不解决回答质量问题\n- C.仅根据真实：选项文字截断，且单一维度评估无法覆盖检索+生成两端\n\n**📌 关键概念**：RAG 评估须覆盖两端：检索质量（文档相关性）+ 生成质量（答案准确性/忠实度）；仅看端到端指标会漏掉环节归因。","s":"源#430"},{"id":"D2-159","d":2,"t":"single","q":"一位人工智能从业者希望快速部署并微调用于生成式人工智能（GenAI）任务的基础模型（FMs）。该从业者需要获取预训练模型、解决方案模板以及示例笔记本，以加快开发进程。哪个 AWS 功能或资源符合这些要求？","o":[{"l":"A","t":"Amazon SageMaker Studio"},{"l":"B","t":"Amazon SageMaker JumpStart"},{"l":"C","t":"Amazon Bedrock 模型目录"},{"l":"D","t":"Amazon SageMaker Canvas"}],"a":["B"],"e":"**✅ 为什么 B.Amazon SageMaker JumpStart 对**：JumpStart 提供模型中心（预训练 FM）、解决方案模板与示例笔记本，支持快速部署与微调，正符合「预训练模型+模板+示例笔记本」的三重要求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon SageMaker Studio：Studio 是 IDE 式开发环境，本身不内置模型模板与示例笔记本 bundle\n- C.Amazon Bedrock 模型目录：模型目录提供 FM 列表与访问，但不提供解决方案模板与示例笔记本\n- D.Amazon SageMaker Canvas：Canvas 是面向业务用户的可视化建模工具，不面向 FM 微调开发流程\n\n**📌 关键概念**：快速启动 FM 开发选 JumpStart（模型+模板+笔记本三件套）；Studio 是开发环境、Bedrock 目录是模型入口、Canvas 是无代码建模工具。","s":"源#436"},{"id":"D2-160","d":2,"t":"single","q":"一家公司正在使用基础模型（FM）来生成产品描述，但该模型有时会提供错误的信息。这描述的是生成式人工智能的哪种潜在风险？","o":[{"l":"A","t":"毒性"},{"l":"B","t":"幻觉"},{"l":"C","t":"可解析性"},{"l":"D","t":"确定性输出"}],"a":["B"],"e":"**✅ 为什么 B.幻觉 对**：FM 生成的产品描述「有时提供错误的信息」，即把虚构内容当作事实输出，这正是幻觉（Hallucination）风险的典型表现。\n\n**❌ 为什么其他选项错**：\n- A.毒性：毒性指输出有害、攻击性或不当内容，本题是信息错误而非有害\n- C.可解析性：可解析性指输出可解释程度或格式可解析性，与信息错误无关\n- D.确定性输出：确定性输出是中性特征（同样输入同样输出），不属于风险类别\n\n**📌 关键概念**：幻觉 = 生成与事实不符的内容；毒性（有害内容）与幻觉（错误内容）是两类不同风险，产品描述出错属于幻觉范畴。","s":"源#440"},{"id":"D2-161","d":2,"t":"single","q":"一家公司正在使用生成式人工智能（GenAI）系统从患者病历中生成医疗摘要。该系统有时会产生看似可信但实际不准确的信息。哪种策略可以缓解该？","o":[{"l":"A","t":"实施严格的输入验证和输出格式化规则。"},{"l":"B","t":"实施检索增强生成（RAG）以确保回答的准确性。"},{"l":"C","t":"在医疗应用中使用更小、更透明的模型。"},{"l":"D","t":"增加计算资源和模型规模。"}],"a":["B"],"e":"**✅ 为什么 B.实施检索增强生成（RAG）以确保回答的准确性。 对**：RAG 让医疗摘要基于可信的患者记录或经批准的医学来源生成，为输出提供事实锚点，直接缓解「看似可信但实际不准确」的问题，是医疗场景最对症的策略。\n\n**❌ 为什么其他选项错**：\n- A.实施严格的输入验证和输出格式化规则。：输入验证与格式化不校验内容事实性，无法阻止「格式正确但内容错误」的输出\n- C.在医疗应用中使用更小、更透明的模型。：小模型能力更弱、透明≠准确，反而可能加剧不准确\n- D.增加计算资源和模型规模。：更大的模型不等于事实更准确，幻觉问题依旧存在\n\n**📌 关键概念**：医疗等高风险场景的事实性保障首选 RAG（权威数据源锚定）；输入校验、模型规模、透明度均不直接解决事实准确性。","s":"源#441"},{"id":"D2-162","d":2,"t":"single","q":"一家公司希望调用单个 Amazon Bedrock 端点，并要求 Amazon Bedrock 为每个请求选择最合适的基底模型（FM）。该公司不希望硬编码指定某个模型。哪个 Amazon Bedrock 功能或资源能满足这些要求？","o":[{"l":"A","t":"Amazon Bedrock Guardrails"},{"l":"B","t":"Amazon Bedrock Knowledge Bases"},{"l":"C","t":"Amazon Bedrock 提示路由器"},{"l":"D","t":"Amazon Bedrock Agents内存"}],"a":["C"],"e":"**✅ 为什么 C.Amazon Bedrock 提示路由器 对**：提示路由器（Prompt Router）允许应用调用单一端点，由 Bedrock 根据每个请求的特征自动选择最合适的 FM，无需硬编码指定模型，正符合题干全部要求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Bedrock Guardrails：Guardrails 提供安全过滤与护栏，不做模型选择\n- B.Amazon Bedrock Knowledge Bases：知识库提供 RAG 检索能力，不涉及模型路由\n- D.Amazon Bedrock Agents内存：Agents 内存管理对话上下文状态，不选择模型\n\n**📌 关键概念**：提示路由 = 单端点+按请求智能选模型（按复杂度/成本动态路由）；与 Guardrails（安全）、Knowledge Bases（检索）、Agents 内存（上下文）职责不同。","s":"源#442"},{"id":"D2-163","d":2,"t":"single","q":"一家公司正在其生成式人工智能（GenAI）应用中使用检索增强生成（RAG）。这个公司希望利用 Amazon Bedrock Knowledge Bases的评估功能，来衡量回复在基于检索文本时避免幻觉的效果如何。哪个指标符合这些要求？","o":[{"l":"A","t":"拒绝"},{"l":"B","t":"有害性"},{"l":"C","t":"刻板印象"},{"l":"D","t":"忠诚"}],"a":["D"],"e":"**✅ 为什么 D.忠诚 对**：忠实度（Faithfulness，选项译作「忠诚」）衡量生成回答是否基于并得到所检索文本的支持，即回答与源上下文的一致性，直接反映 RAG 应用避免幻觉的效果，正符合题干要求。\n\n**❌ 为什么其他选项错**：\n- A.拒绝：拒绝（Refusals）统计模型拒绝回答的频率，与幻觉无关\n- B.有害性：有害性（Harmfulness）衡量输出有害内容程度，不是事实一致性维度\n- C.刻板印象：刻板印象（Stereotyping）衡量输出偏见程度，与忠实度无关\n\n**📌 关键概念**：RAG 专属评估指标 = 忠实度（回答是否忠于检索到的上下文）；拒绝、有害性、偏见是通用安全类指标，均不度量「基于检索文本避免幻觉」。","s":"源#443"},{"id":"D2-164","d":2,"t":"multiple","q":"公司需要将人工智能生成的摘要与参考文本进行比对评估，必须衡量语义相似度以及关键信息的覆盖情况。哪些指标符合这些要求？（选择两项。）","o":[{"l":"A","t":"F1 分数"},{"l":"B","t":"BERTScore"},{"l":"C","t":"双语评估下级（BLEU）分数"},{"l":"D","t":"准确性"},{"l":"E","t":"用于摘要评估的召回导向型副手（ROUGE）"}],"a":["B","E"],"e":"**✅ 为什么 B、E 对**：\n- B.BERTScore：基于上下文嵌入计算生成文本与参考文本的语义相似度，能衡量语义层面的匹配程度\n- E.用于摘要评估的召回导向型副手（ROUGE）：统计生成摘要对参考摘要关键信息（n-gram）的召回覆盖，衡量关键信息覆盖情况\n\n**❌ 为什么其他选项错**：\n- A.F1 分数：F1 是分类任务的精确率/召回率调和指标，不做摘要语义或覆盖评估\n- C.双语评估下级（BLEU）分数：BLEU 以精确率为主衡量词面重叠，既非语义相似度也不侧重关键信息召回\n- D.准确性：准确性是泛化的正确率概念，不是与参考文本比对的摘要评估指标\n\n**📌 关键概念**：摘要双向评估组合 = 语义相似度（BERTScore，基于嵌入）+ 关键信息覆盖（ROUGE，基于召回）；BLEU/F1/准确性均不同时满足这两个维度。","s":"源#448"},{"id":"D2-165","d":2,"t":"multiple","q":"一家全球物流公司在 Amazon Bedrock 上使用生成式人工智能（GenAI）模型来自动化文书工作和货运文件处理。该公司希望建立清晰的人工智能治理流程，以确保模型得到负责任地使用，并符合公司政策。哪些解决方案能够满足这些要求？（选择两项。）","o":[{"l":"A","t":"建立定期审查流程，以确保模型结果的准确性、公平性，并符合公司政策。"},{"l":"B","t":"为所有使用人工智能工具的员工提供培训，使其了解公司规定、数据处理方法以及负责任地使用人工智能。"},{"l":"C","t":"让云服务提供商负责管理所有 AI 安全检查和审核，以节省内部工作量。"},{"l":"D","t":"仅让开发人员参与治理审查，因为开发人员负责构建和部署人工智能系统。"},{"l":"E","t":"仅在用户报告系统出现或错误时，才审查模型。"}],"a":["A","B"],"e":"**✅ 为什么 A、B 对**：\n- A.建立定期审查流程，以确保模型结果的准确性、公平性，并符合公司政策。：定期审查是 AI 治理的核心机制，保障输出准确、公平且合规\n- B.为所有使用人工智能工具的员工提供培训，使其了解公司规定、数据处理方法以及负责任地使用人工智能。：全员培训确保使用者理解政策与数据规范\n\n**❌ 为什么其他选项错**：\n- C.让云服务提供商负责管理所有 AI 安全检查和审核，以节省内部工作量。：AI 治理仍是客户自身责任，不能外包\n- D.仅让开发人员参与治理审查，因为开发人员负责构建和部署人工智能系统。：治理需多方参与，仅开发人员覆盖不足\n- E.仅在用户报告系统出现或错误时，才审查模型。：被动响应缺乏主动审查，不符合治理要求\n\n**📌 关键概念**：AI 治理双支柱 = 定期主动审查（准确性/公平性/合规）+ 全员培训（政策/数据规范）；责任不可外包，也不能只靠单一角色。","s":"源#450"},{"id":"D2-166","d":2,"t":"hot","q":"【图片题·见源PDF第89页】一家公司希望使用 Amazon Bedrock 从现有文档中创建知识库。这些文档包含文本、表格和图像。请从以下列表中选择并按正确顺序排列步骤，以准确描述如何通过 Amazon Bedrock 中的摄取流程将文档中的数据转换为知识库。每个步骤只能选择一次或不选。","o":[],"a":[],"e":"**✅ 正确配对说明**：本题考查 Bedrock Knowledge Bases 摄取（Ingestion）流程的步骤排序：1. 解析文档（支持文本、表格、图像等内容类型）；2. 将数据分割成若干块（Chunking）；3. 将文本块转换为向量嵌入（Embeddings）；4. 将向量嵌入写入向量存储（Vector Store）。按「解析→分块→嵌入→入库」的顺序排列。\n\n**❌ 常见配对错误**：\n- 分块与解析顺序颠倒：必须先解析出文档内容，才能进行分块\n- 嵌入排在分块之前：嵌入的对象是分块后的文本块，先分块后嵌入\n- 向量存储写入排在嵌入之前：没有嵌入结果就没有向量可写入存储\n\n**📌 关键概念**：知识库摄取四步曲：解析（Parse）→ 分块（Chunk）→ 嵌入（Embed）→ 写入向量存储（Index）；完成后即可支撑 RAG 检索生成。","s":"源#452"},{"id":"D3-001","d":3,"t":"single","q":"一家公司在生产环境中使用 Amazon SageMaker 作为其 ML 管道。该公司有大量的输入数据高达 1 GB，处理时间长达 1 小时。该公司需要近乎实时的延迟。哪个 SageMaker 推理选项符合这些要求？","o":[{"l":"A","t":"实时推理"},{"l":"B","t":"无服务器推理"},{"l":"C","t":"异步推理"},{"l":"D","t":"批量转换"}],"a":["C"],"e":"**✅ 为什么 C.异步推理 对**：异步推理（Asynchronous Inference）专为「大输入（高达 1 GB）+长处理时间（约 1 小时）+近乎实时返回」的负载设计：请求排队处理、完成后可低延迟取回结果，正符合题干三项条件。\n\n**❌ 为什么其他选项错**：\n- A.实时推理：实时端点面向毫秒级小请求，1 GB 输入与 1 小时处理超出其设计负载\n- B.无服务器推理：Serverless 适合间歇性小流量小负载，不支持 1 GB 大输入与小时级处理\n- D.批量转换：批转换是离线批量作业，不提供「近乎实时」的取回体验\n\n**📌 关键概念**：SageMaker 四种推理模式按负载选：实时（低延迟小请求）、无服务器（间歇流量）、异步（大输入/长处理+近实时）、批量转换（离线批处理）。","s":"源#6"},{"id":"D3-002","d":3,"t":"single","q":"一家公司正在构建一个解决方案来为防护眼镜生成图像。该解决方案必须具有高准确性，并且必须最小化不正确注释的风险。哪种解决方案能够满足这些要求？","o":[{"l":"A","t":"通过使用 Amazon SageMaker Ground Truth Plus Most Voted 进行人在回路中的验证"},{"l":"B","t":"使用Amazon Bedrock Knowledge Bases进行数据扩充"},{"l":"C","t":"使用 Amazon Rekognition 进行图像识别"},{"l":"D","t":"使用 Amazon QuickSight Q 进行数据汇总"}],"a":["A"],"e":"**✅ 为什么 A.通过使用 Amazon SageMaker Ground Truth Plus Most Voted 进行人在回路中的验证 对**：Ground Truth Plus 提供专业标注团队，Most Voted（多数投票）机制让多人独立标注后取共识结果，人在回路验证能最大限度降低标注错误风险，正符合「高准确性+最小化错误注释」的双重要求。\n\n**❌ 为什么其他选项错**：\n- B.使用Amazon Bedrock Knowledge Bases进行数据扩充：知识库用于 RAG 检索，不做图像标注验证\n- C.使用 Amazon Rekognition 进行图像识别：Rekognition 做现成的图像分析，不产生高质量训练标注\n- D.使用 Amazon QuickSight Q 进行数据汇总：QuickSight Q 是 BI 问答工具，与图像标注无关\n\n**📌 关键概念**：高质量标注 = Ground Truth（Plus）+ 人在回路（Human-in-the-loop）+ 多数投票（Most Voted）共识机制；标注质量直接决定监督学习模型上限。","s":"源#8"},{"id":"D3-003","d":3,"t":"single","q":"Amazon OpenSearch Service 服务的哪一项功能赋予了公司构建矢量数据库应用的能力？","o":[{"l":"A","t":"与Amazon S3 的对象存储集成"},{"l":"B","t":"支持地理空间索引和查询"},{"l":"C","t":"可扩展的索引管理和最近邻搜索功能"},{"l":"D","t":"能够对流数据执行实时分析"}],"a":["C"],"e":"**✅ 为什么 C.可扩展的索引管理和最近邻搜索功能 对**：OpenSearch Service 的 k-NN（k 最近邻）向量检索与可扩展索引管理能力，使其能存储嵌入向量并执行相似性搜索，这正是构建向量数据库应用的核心能力。\n\n**❌ 为什么其他选项错**：\n- A.与Amazon S3 的对象存储集成：S3 集成用于数据导入导出，不提供向量检索能力\n- B.支持地理空间索引和查询：地理空间索引面向位置数据，不是向量数据库的支撑功能\n- D.能够对流数据执行实时分析：流分析是日志/事件场景能力，与向量相似性检索无关\n\n**📌 关键概念**：向量数据库两大核心能力 = 向量索引管理 + 最近邻（k-NN）搜索；OpenSearch 以此支撑 RAG 场景中的相似度检索环节。","s":"源#21"},{"id":"D3-004","d":3,"t":"single","q":"一家公司想通过使用 Amazon Bedrock创建一个应用程序。该公司预算有限，更喜欢没有长期承诺的灵活性。哪种Amazon Bedrock 定价模式符合这些要求？","o":[{"l":"A","t":"按需"},{"l":"B","t":"模型定制"},{"l":"C","t":"预置吞吐量"},{"l":"D","t":"Spot 实例"}],"a":["A"],"e":"**✅ 为什么 A.按需 对**：按需（On-demand）模式按实际 Token 用量计费，无预付承诺、随时可用，预算有限且需要灵活性时是首选，正符合题干「预算有限+不喜欢长期承诺」。\n\n**❌ 为什么其他选项错**：\n- B.模型定制：模型定制是功能维度（微调），不是定价模式\n- C.预置吞吐量：预置吞吐量需按预留容量承诺付费（1/3/6 个月），与「无长期承诺」矛盾\n- D.Spot 实例：Spot 是 EC2 竞价实例概念，不是 Bedrock 定价模式\n\n**📌 关键概念**：Bedrock 两种计费：按需（用多少付多少，无承诺）vs 预置吞吐量（预留折扣但需承诺期限）；预算灵活选按需，稳定大流量选预置。","s":"源#32"},{"id":"D3-005","d":3,"t":"single","q":"一家公司正在使用 Amazon Bedrock基础模型来总结内部用例的文档。公司培训了一名自定义模型以提高摘要质量。公司必须采取什么行动才能通过 Amazon Bedrock使用定制模型？","o":[{"l":"A","t":"为定制型号购买预置吞吐量。"},{"l":"B","t":"在 Amazon SageMaker Endpoint中部署定制模型以进行实时推理。"},{"l":"C","t":"在 Amazon SageMaker Model Registry注册模型。"},{"l":"D","t":"授予对 Amazon Bedrock中自定义模型的访问权限。"}],"a":["A"],"e":"**✅ 为什么 A.为定制型号购买预置吞吐量。 对**：Bedrock 中的自定义/微调模型必须购买预置吞吐量（Provisioned Throughput）才能部署使用，这是使用定制模型的必要条件，正符合题干要求。\n\n**❌ 为什么其他选项错**：\n- B.在 Amazon SageMaker Endpoint中部署定制模型以进行实时推理。：部署到 SageMaker 就脱离了「通过 Bedrock 使用」的前提\n- C.在 Amazon SageMaker Model Registry注册模型。：注册表只管理模型版本元数据，不提供推理服务\n- D.授予对 Amazon Bedrock中自定义模型的访问权限。：访问权限是 IAM 层面动作，不能让未购买吞吐量的定制模型可用\n\n**📌 关键概念**：Bedrock 自定义模型使用链路 = 微调（生成定制模型）→ 购买预置吞吐量（部署前提）→ 调用推理；按需计费仅适用于基础（未定制）模型。","s":"源#47"},{"id":"D3-006","d":3,"t":"single","q":"一家公司想通过使用 AWS Glue 创建一个新的解决方案。该公司对 AWS Glue 的编程经验很少。哪种 AWS 服务可以帮助公司使用 AWS Glue?","o":[{"l":"A","t":"Amazon Q Developer"},{"l":"B","t":"AWS Config"},{"l":"C","t":"Amazon Personalize"},{"l":"D","t":"Amazon Comprehend"}],"a":["A"],"e":"**✅ 为什么 A. Amazon Q Developer对**：Amazon Q Developer 是 AWS 的 AI 编程助手，能理解用户的自然语言描述并生成代码。对于 Glue 编程经验不足的公司，Q Developer 可以辅助编写 Glue ETL 脚本、解释代码逻辑、提供调试建议，大幅降低学习门槛。\n**❌ 为什么其他选项错**：\n- B. AWS Config——AWS Config 是配置审计服务，检查资源配置合规性，不提供编程辅助\n- C. Amazon Personalize——Personalize 是推荐系统服务，与 Glue 编程无关\n- D. Amazon Comprehend——Comprehend 是 NLP 文本分析服务，不提供代码辅助\n**📌 关键概念**：Amazon Q Developer = AI 编程助手（代码生成、代码解释、调试辅助）。题干出现\"编程经验不足 + 需要帮助使用 AWS 服务\"→想到 Q Developer。","s":"源#95"},{"id":"D3-007","d":3,"t":"multiple","q":"一家公司希望部署一个对话聊天机器人来回答客户的问题。聊天机器人是基于一个微调的 Amazon SageMaker JumpStart 模型。应用程序必须符合多个监管框架。公司可以展示哪些能力的合规性？（选择两个。）","o":[{"l":"A","t":"自动缩放推理端点"},{"l":"B","t":"威胁检测"},{"l":"C","t":"数据保护"},{"l":"D","t":"成本优化"},{"l":"E","t":"松散耦合的微服务"}],"a":["B","C"],"e":"**✅ 为什么 B. 威胁检测和 C. 数据保护对**：\n- B（威胁检测）：AWS 提供 GuardDuty、CloudTrail 等威胁检测服务，可以监控对 SageMaker Endpoint的异常访问模式，检测恶意活动，展示安全监控合规能力。\n- C（数据保护）：AWS 提供 KMS 加密、IAM 权限控制、VPC 网络隔离、Macie 敏感数据检测等数据保护能力，确保训练数据和模型输出的安全性，满足 GDPR/HIPAA 等法规的数据保护要求。\n**❌ 为什么其他选项错**：\n- A. 自动缩放推理端点——自动扩缩是性能/可用性功能，不是监管合规能力\n- D. 成本优化——成本优化是财务管理，不是合规性要求\n- E. 松散耦合的微服务——微服务架构是设计模式，与监管合规无关\n**📌 关键概念**：监管合规的核心能力：数据保护（加密/权限/隐私）、威胁检测（审计/监控）、可解释性、数据血统追踪。题干出现\"监管框架 + 合规性\"→想到数据保护和威胁检测。","s":"源#215"},{"id":"D3-008","d":3,"t":"single","q":"一家医疗保健公司正在开发一种人工智能解决方案，用于预测患者出院后 30 天内的再入院情况。该公司利用包括病史、人口统计信息和治疗详情在内的历史患者数据训练了一个模型，以实时提供再入院预测。在这个场景中，哪项任务描述了人工智能模型的推理过程？","o":[{"l":"A","t":"收集患者历史再入院数据。"},{"l":"B","t":"使用适当的指标并评估模型性能。"},{"l":"C","t":"利用数据识别患者模式和关联。"},{"l":"D","t":"使用训练好的模型来预测患者的再次入院情况。"}],"a":["D"],"e":"**✅ 为什么 D.使用训练好的模型来预测患者的再次入院情况。 对**：推理（Inference）的定义就是把训练好的模型应用于新数据产出预测，用模型对「出院后 30 天内是否再入院」做实时预测正是推理过程。\n\n**❌ 为什么其他选项错**：\n- A.收集患者历史再入院数据。：数据收集属于训练前的数据准备阶段\n- B.使用适当的指标并评估模型性能。：模型评估属于训练后验证，不是推理\n- C.利用数据识别患者模式和关联。：识别模式与关联是训练阶段模型学习的内容\n\n**📌 关键概念**：AI 工作流分工：数据收集→训练（学模式）→评估→推理（对新数据预测）；推理 = 训练成果的生产应用。","s":"源#243"},{"id":"D3-009","d":3,"t":"single","q":"在人工智能的语境中，“推理”指的是什么？","o":[{"l":"A","t":"创建新的人工智能算法的过程"},{"l":"B","t":"利用训练好的模型对未见过的数据进行预测或决策"},{"l":"C","t":"将多个 AI 模型组合成一个模型的过程"},{"l":"D","t":"用于人工智能系统的训练数据收集方法"}],"a":["B"],"e":"**✅ 为什么 B.利用训练好的模型对未见过的数据进行预测或决策 对**：推理的标准定义就是「将训练好的模型应用于新的、未见过的数据，生成预测或决策」，正符合题干对推理的界定。\n\n**❌ 为什么其他选项错**：\n- A.创建新的人工智能算法的过程：算法研发是研究工作，不是推理\n- C.将多个 AI 模型组合成一个模型的过程：模型组合属于集成技术，不是推理\n- D.用于人工智能系统的训练数据收集方法：数据收集是训练前置环节\n\n**📌 关键概念**：推理（Inference）= 训练好的模型 + 新数据 → 预测/决策；区别于训练（从数据学参数）与评估（验证性能）。","s":"源#292"},{"id":"D3-010","d":3,"t":"single","q":"一家医疗保健公司想要分析患者数据。这些数据是在过去一年中收集的，旨在发现疾病爆发的模式。该公司需要为每个月制作一份趋势分析报告，提交给公共卫生官员。公司还必须提供本年度最近一个月的患者数据的分析见解。哪种推理方法能以最经济有效的方式满足这些要求？","o":[{"l":"A","t":"实时推理"},{"l":"B","t":"批量转换"},{"l":"C","t":"无服务器推理"},{"l":"D","t":"异步推理"}],"a":["B"],"e":"**✅ 为什么 B.批量转换 对**：批量转换（Batch Transform）离线批量处理历史数据、按批生成月度趋势报告，单位成本最低，正符合「每月报告+年度数据+成本最优」的要求。\n\n**❌ 为什么其他选项错**：\n- A.实时推理：实时端点持续付费待命，处理月度批报告场景成本过高\n- C.无服务器推理：Serverless 适合间歇性小请求，不适合大批量历史数据分析\n- D.异步推理：异步推理面向「需近实时返回的大任务」，月度报告无需近实时，成本高于批转换\n\n**📌 关键概念**：离线定期报告选批量转换（按批计费、最经济）；需要近实时反馈才用异步/实时；本题为成本导向题眼。","s":"源#296"},{"id":"D3-011","d":3,"t":"single","q":"一家公司使用Amazon Comprehend 来分析客户反馈。该公司有多个独特的训练模型。公司使用 Comprehend 为每个模型分配一个端点。该公司希望自动生成一份关于每个超过 15 天未使用的端点的报告。哪种服务能满足这些要求？","o":[{"l":"A","t":"AWS Trusted Advisor（可信顾问）"},{"l":"B","t":"Amazon CloudWatch"},{"l":"C","t":"AWS CloudTrail 服务"},{"l":"D","t":"AWS Config"}],"a":["B"],"e":"**✅ 为什么 B.Amazon CloudWatch 对**：CloudWatch 可监控 Comprehend 自定义实体识别端点的调用指标（如 Invocations），据此可自动检测「超过 15 天无调用」的闲置端点并生成告警报告，正符合题干对闲置端点自动出报告的要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS Trusted Advisor（可信顾问）：Trusted Advisor 给出成本/性能/安全优化建议，不做端点级使用监控报告\n- C.AWS CloudTrail 服务：CloudTrail 记录 API 调用审计日志，不适合做闲置端点监控告警\n- D.AWS Config：Config 跟踪资源配置合规状态，不做使用率监控\n\n**📌 关键概念**：资源使用率监控选 CloudWatch（指标+告警+自动通知）；CloudTrail（API 审计）、Config（配置合规）、Trusted Advisor（优化建议）各有分工。","s":"源#330"},{"id":"D3-012","d":3,"t":"single","q":"一家公司计划使用生成式人工智能模型为用户提供实时服务报价。公司应采用哪些标准来为这个用例选择合适的模型？","o":[{"l":"A","t":"模型尺寸"},{"l":"B","t":"训练数据质量"},{"l":"C","t":"通用用途及高性能 GPU 的可用性"},{"l":"D","t":"模型延迟与优化后的推理速度"}],"a":["D"],"e":"**✅ 为什么 D.模型延迟与优化后的推理速度 对**：实时服务报价的核心要求是响应快，选模型时应优先评估推理延迟与推理速度优化能力，保证用户交互体验，正符合题干要求。\n\n**❌ 为什么其他选项错**：\n- A.模型尺寸：模型大小是容量维度，只有当它影响延迟时才相关，不是直接选型标准\n- B.训练数据质量：影响模型准确性，但实时报价场景的首要约束是速度\n- C.通用用途及高性能 GPU 的可用性：GPU 可用性是部署资源考量，不是模型选型标准\n\n**📌 关键概念**：模型选型标准与场景匹配：实时交互场景看延迟与推理速度；批量离线场景看吞吐与成本；准确性要求高时才优先看训练数据质量。","s":"源#331"},{"id":"D3-013","d":3,"t":"single","q":"一家公司希望在检测到车辆碰撞后的 30 秒内集成一个 AI 解决方案来联系紧急服务部门。该公司希望使用一个无需额外训练的预训练模型。公司在选择满足这些要求的模型时，应优先考虑哪个因素？","o":[{"l":"A","t":"模型定制"},{"l":"B","t":"模型尺寸"},{"l":"C","t":"模型成本"},{"l":"D","t":"模型温度"}],"a":["B"],"e":"**✅ 为什么 B.模型尺寸 对**：30 秒内联系紧急服务是严格实时约束，模型尺寸直接决定推理速度与延迟（越小越快），且用预训练模型无需定制，选型时应优先考虑模型大小。\n\n**❌ 为什么其他选项错**：\n- A.模型定制：题干明确「无需额外训练的预训练模型」，定制不在考虑范围\n- C.模型成本：成本不是本场景的关键约束，响应速度才是\n- D.模型温度：温度是生成多样性的采样参数，与响应速度无关\n\n**📌 关键概念**：硬实时场景（安全应急类）模型选型看物理规模：小模型=低延迟；模型尺寸是影响推理时延的首要物理因素。","s":"源#349"},{"id":"D3-014","d":3,"t":"single","q":"一家公司使用Amazon Bedrock 基础模型（FM）为其内部用例总结文档。该公司在Amazon Bedrock 中训练了一个自定义模型以提高模型总结的质量。该公司需要一个解决方案来在Amazon Bedrock 上使用自定义模型。哪种解决方案能满足这一要求？","o":[{"l":"A","t":"为自定义模型购买预配置的吞吐量。"},{"l":"B","t":"在 Amazon SageMaker AI 端点中部署自定义模型以进行实时推理。"},{"l":"C","t":"将模型注册到 Amazon SageMaker Model Registry。"},{"l":"D","t":"将模型版本的审批状态更新为“已批准”。"}],"a":["A"],"e":"**✅ 为什么 A.为自定义模型购买预配置的吞吐量。 对**：Bedrock 中训练的自定义模型必须购买预置吞吐量才能部署和用于推理，这是官方规定的使用路径，正符合「在 Bedrock 上使用自定义模型」的要求。\n\n**❌ 为什么其他选项错**：\n- B.在 Amazon SageMaker AI 端点中部署自定义模型以进行实时推理。：转移到 SageMaker 就不是「在 Bedrock 上使用」\n- C.将模型注册到 Amazon SageMaker Model Registry。：注册表管理模型元数据，不提供推理能力\n- D.将模型版本的审批状态更新为“已批准”。：审批状态是注册表流程管理概念，与模型可用性无关\n\n**📌 关键概念**：Bedrock 微调模型使用规则：微调产出 → 必须购买预置吞吐量 → 才能对外提供推理；按需计费不适用于自定义模型。","s":"源#362"},{"id":"D3-015","d":3,"t":"single","q":"一家公司希望将基础模型（FMs）用于多种应用场景，包括内容摘要、代码生成以及客户服务 AI 助手。哪种方案能以最具成本效益的方式实施 FMs？","o":[{"l":"A","t":"为每个特定使用场景选择满足性能要求的最小模型。"},{"l":"B","t":"对所有任务使用当前最大且功能最强的模型，以确保质量。"},{"l":"C","t":"为每个具体使用场景构建并训练一个定制的 FM。"},{"l":"D","t":"对所有推理请求使用批量处理，以降低每次请求的成本和延迟。"}],"a":["A"],"e":"**✅ 为什么 A.为每个特定使用场景选择满足性能要求的最小模型。 对**：按场景选「够用的最小模型」，在保证输出质量的同时把推理成本压到最低，是成本效益导向的最佳实践。\n\n**❌ 为什么其他选项错**：\n- B.对所有任务使用当前最大且功能最强的模型，以确保质量。：大模型对简单任务是过度配置，成本大幅浪费\n- C.为每个具体使用场景构建并训练一个定制的 FM。：自建定制 FM 训练成本极高，远非「成本效益」之选\n- D.对所有推理请求使用批量处理，以降低每次请求的成本和延迟。：批量处理降低单位成本但引入延迟，不适用于摘要/客服等交互场景\n\n**📌 关键概念**：FM 成本优化选型原则 = 场景匹配最小可用模型（right-size）；摘要/代码/助手三类场景复杂度不同，分别选适配档位的模型。","s":"源#435"},{"id":"D4-001","d":4,"t":"single","q":"一家医疗公司正在定制用于诊断目的的基础模型(FM)。该公司需要模型透明且可解释，以满足监管要求。哪种解决方案能够满足这些要求？","o":[{"l":"A","t":"使用 Amazon Inspector 配置安全性和合规性。"},{"l":"B","t":"使用 Amazon SageMaker Clarify 生成简单的指标、报告和示例。"},{"l":"C","t":"使用 Amazon Macie 加密和保护培训数据。"},{"l":"D","t":"收集更多数据。使用 Amazon Rekognition 向数据添加自定义标签。"}],"a":["B"],"e":"**✅ 为什么 B. 使用 Amazon SageMaker Clarify 生成简单的指标、报告和示例对**：题干要求模型\"透明且可解释\"以满足医疗监管要求。SageMaker Clarify 专门用于模型可解释性分析——它能生成特征重要性报告（SHAP 值）、偏差分析报告和可视化示例，帮助医疗团队理解模型为何做出特定诊断决策。\n**❌ 为什么其他选项错**：\n- A. 使用 Amazon Inspector 配置安全性和合规性——Inspector 扫描基础设施漏洞（EC2/容器），不涉及模型可解释性\n- C. 使用 Amazon Macie 加密和保护培训数据——Macie 发现敏感数据，不提供模型解释功能\n- D. 收集更多数据。使用 Amazon Rekognition 向数据添加自定义标签——Rekognition 是图像分析服务，不解决模型透明性问题\n**📌 关键概念**：模型可解释性/透明度 = SageMaker Clarify（SHAP 特征重要性 + 偏差检测）。题干出现\"透明 + 可解释 + 监管要求\"→想到 Clarify。医疗/金融行业对可解释性要求最高。","s":"源#39"},{"id":"D4-002","d":4,"t":"single","q":"一家公司希望为儿童开发一款基于经典故事的互动应用程序。该公司希望使用Amazon Bedrock，并需要确保结果和主题适合儿童。哪个 AWS 服务或功能将满足这些要求？","o":[{"l":"A","t":"Amazon Cognito"},{"l":"B","t":"Amazon Bedrock Playground"},{"l":"C","t":"Amazon Bedrock的护栏"},{"l":"D","t":"Amazon Bedrock Agents"}],"a":["C"],"e":"**✅ 为什么 C.Amazon Bedrock的护栏 对**：Bedrock Guardrails 可配置内容过滤（仇恨、暴力、性等内容类别），确保面向儿童的互动应用中结果与主题适龄，正符合「结果和主题适合儿童」的防护要求，也是内容安全场景的首选。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Cognito：Cognito 做用户注册/登录/身份管理，不审核内容适龄性\n- B.Amazon Bedrock Playground：Playground 是模型试验界面，不提供生产级内容防护\n- D.Amazon Bedrock Agents：Agents 负责任务编排与 API 调用，不做内容过滤\n\n**📌 关键概念**：内容适龄与安全过滤是 Guardrails 的职责；Cognito（身份）、Playground（试验）、Agents（编排）与内容治理无关。","s":"源#51"},{"id":"D4-003","d":4,"t":"single","q":"一家医疗公司正在定制用于诊断目的的基础模型(FM)。该公司需要模型透明且可解释，以满足监管要求。哪种解决方案能够满足这些要求？","o":[{"l":"A","t":"使用 Amazon Inspector 配置安全性和合规性。"},{"l":"B","t":"使用 Amazon SageMaker Clarify 生成简单的指标、报告和示例。"},{"l":"C","t":"使用 Amazon Macie 加密和保护培训数据。"},{"l":"D","t":"收集更多数据。使用 Amazon Rekognition 向数据添加自定义标签。"}],"a":["B"],"e":"**✅ 为什么 B.使用 Amazon SageMaker Clarify 生成简单的指标、报告和示例。 对**：Clarify 提供偏差指标、可解释性报告（如 SHAP 特征重要性）等能力，让定制模型的决策透明可解释，正符合「透明+可解释+满足监管」的要求。\n\n**❌ 为什么其他选项错**：\n- A.使用 Amazon Inspector 配置安全性和合规性。：Inspector 做 EC2/容器漏洞扫描，不涉及模型可解释性\n- C.使用 Amazon Macie 加密和保护培训数据。：Macie 发现和保护 S3 敏感数据，不做模型透明化\n- D.收集更多数据。使用 Amazon Rekognition 向数据添加自定义标签。：更多数据与标签提升的是覆盖面，不解决监管要求的可解释性\n\n**📌 关键概念**：模型透明与可解释选 SageMaker Clarify（偏差检测+SHAP 解释报告）；Inspector（漏洞）、Macie（敏感数据发现）是安全类服务，不产出解释性。","s":"源#119"},{"id":"D4-004","d":4,"t":"single","q":"一家医院正在开发一个 AI 系统，以帮助医生根据病人记录和医学图像诊断疾病。为了遵守法规，敏感的病人数据必须不离开数据所在的国家。哪种数据治理策略将确保合规并保护病人隐私？","o":[{"l":"A","t":"数据驻留"},{"l":"B","t":"数据质量"},{"l":"C","t":"数据可发现性"},{"l":"D","t":"数据增强"}],"a":["A"],"e":"**✅ 为什么 A.数据驻留 对**：数据驻留（Data Residency）要求数据存储与处理限定在特定国家/地区境内，正符合「敏感病人数据不离开所在国家」的合规要求。\n\n**❌ 为什么其他选项错**：\n- B.数据质量：数据质量关注准确性/一致性，不约束数据地理位置\n- C.数据可发现性：可发现性指数据能否被有效检索编目，与地域限制无关\n- D.数据增强：数据增强是扩充训练样本的技术，不是治理策略\n\n**📌 关键概念**：数据治理策略家族：数据驻留（地域限定）、数据保留（存储时长）、数据质量、数据脱敏；跨境合规场景（医疗/金融）首查驻留要求。","s":"源#122"},{"id":"D4-005","d":4,"t":"single","q":"哪个选项是构建信任和部署以人为本的人工智能技术的 AI 治理框架的特征？","o":[{"l":"A","t":"在业务单位之间扩展倡议以创造长期商业价值"},{"l":"B","t":"确保与商业标准、收入目标和利益相关者期望的一致性"},{"l":"C","t":"克服挑战以推动业务转型和增长"},{"l":"D","t":"制定数据、透明度、负责任的人工智能和合规性的政策和指南"}],"a":["D"],"e":"**✅ 为什么 D. 制定数据、透明度、负责任的人工智能和合规性的政策和指南对**：AI 治理框架的核心特征是制定全面的政策体系——涵盖数据治理（如何收集、存储、使用数据）、透明度（如何向用户解释 AI 决策）、负责任 AI（如何确保公平和无害）、合规性（如何满足法规要求）。这是构建信任的制度基础。\n**❌ 为什么其他选项错**：\n- A. 在业务单位之间扩展倡议以创造长期商业价值——这是业务战略目标，不是治理框架的特征\n- B. 确保与商业标准、收入目标和利益相关者期望的一致性——这是商业目标对齐，不是 AI 治理的定义\n- C. 克服挑战以推动业务转型和增长——这是变革管理目标，不是治理框架\n**📌 关键概念**：AI 治理框架 = 政策 + 指南 + 流程 + 标准。核心维度：数据治理、透明度、负责任 AI、合规性。题干出现\"AI 治理框架 + 以人为本\"→想到政策和指南制定。","s":"源#129"},{"id":"D4-006","d":4,"t":"single","q":"一家公司建立了一个人工智能驱动的简历筛选系统。该公司使用大型数据集来训练模型。该数据集包含的简历并不代表所有人口统计学特征。这个场景呈现了负责任人工智能的哪个核心维度？","o":[{"l":"A","t":"公平"},{"l":"B","t":"可解释性"},{"l":"C","t":"隐私与安全"},{"l":"D","t":"透明"}],"a":["A"],"e":"**✅ 为什么 A. 公平对**：题干指出训练数据\"并不代表所有人口统计学特征\"——即数据中某些群体（如女性、少数族裔）的样本不足。这直接导致模型对这些群体的筛选不公平，是公平性（Fairness）问题的典型表现——模型可能系统性地偏向数据中占主导的群体。\n**❌ 为什么其他选项错**：\n- B. 可解释性——可解释性关注的是\"能否理解模型决策原因\"，题干问题在于数据不均衡\n- C. 隐私与安全——隐私关注数据保护和信息泄露，与数据代表性无关\n- D. 透明——透明关注的是向用户公开 AI 系统的能力和限制，不直接涉及数据均衡性\n**📌 关键概念**：数据不均衡/不代表所有群体 = 公平性（Fairness）问题。公平性 vs 包容性：公平性强调一视同仁；包容性强调覆盖所有人。题干出现\"简历筛选 + 数据不代表所有群体\"→想到公平性。","s":"源#139"},{"id":"D4-007","d":4,"t":"single","q":"一家金融公司正在使用人工智能系统获取客户信用评分，作为贷款申请流程的一部分。该公司希望在不同的地理区域拓展新市场。该公司必须确保能够在该地理区域内运营。公司应该审查哪些合规法律？","o":[{"l":"A","t":"当地健康数据保护法"},{"l":"B","t":"当地支付卡数据保护法"},{"l":"C","t":"当地教育隐私法"},{"l":"D","t":"局部算法责任法"}],"a":["D"],"e":"**✅ 为什么 D.局部算法责任法 对**：信用评分属自动化决策，直接影响个人获得贷款的权利，进入新地理区域运营必须审查当地算法问责法规，确保决策公平、透明并可申诉。\n\n**❌ 为什么其他选项错**：\n- A.当地健康数据保护法：健康数据法规针对医疗信息，与信用评分场景不匹配\n- B.当地支付卡数据保护法：支付卡法规（PCI 类）针对卡交易数据安全，不监管信用决策\n- C.当地教育隐私法：教育隐私法规针对学生数据，与信贷场景无关\n\n**📌 关键概念**：算法问责法规范 AI 自动化决策（公平性/透明度/可申诉）；进新市场先做法域尽调：信贷→算法问责法、医疗→健康数据法、支付→卡数据法。","s":"源#153"},{"id":"D4-008","d":4,"t":"single","q":"一家金融公司使用 AWS 托管其生成式人工智能模型。公司必须生成报告，以表明遵守了处理敏感客户数据的国际法规。哪种 AWS 服务符合这些要求？","o":[{"l":"A","t":"Amazon Macie"},{"l":"B","t":"AWS Artifact"},{"l":"C","t":"AWS 机密管理器"},{"l":"D","t":"AWS Config"}],"a":["B"],"e":"**✅ 为什么 B.AWS Artifact 对**：AWS Artifact 提供按需下载的 AWS 合规报告与认证（ISO、SOC、GDPR 等），是证明「遵守处理敏感数据的国际法规」的官方凭证来源，可直接供金融公司向监管与审计方出示。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Macie：Macie 发现并分类 S3 中的敏感数据，不出具合规报告\n- C.AWS 机密管理器：Secrets Manager 托管密钥凭据，不做合规证明\n- D.AWS Config：Config 记录资源配置与合规规则状态，不提供第三方审计报告\n\n**📌 关键概念**：向监管/客户证明 AWS 侧合规 → AWS Artifact（合规报告中心）；Macie（敏感数据发现）、Config（配置合规）解决的是自查问题。","s":"源#177"},{"id":"D4-009","d":4,"t":"single","q":"一家医疗公司希望实现其现场信息处理应用程序的现代化。该公司希望利用生成式人工智能来回答患者的医疗。公司应该使用哪种 AWS 服务来确保对应用负责任的 AI？","o":[{"l":"A","t":"Amazon Bedrock的护栏"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"Amazon Cognito"},{"l":"D","t":"AWS Trusted Advisor（可信顾问）"}],"a":["A"],"e":"**✅ 为什么 A.Amazon Bedrock的护栏 对**：Bedrock Guardrails 为生成式 AI 应用提供内容过滤、拒绝主题等防护，确保面向患者的医疗问答应用负责任地运行，正符合「确保应用负责任的 AI」的要求。\n\n**❌ 为什么其他选项错**：\n- B.Amazon Inspector：Inspector 扫描基础设施漏洞，不治理 AI 输出内容\n- C.Amazon Cognito：Cognito 管理用户身份认证，不涉及内容责任\n- D.AWS Trusted Advisor（可信顾问）：Trusted Advisor 提供成本/性能优化建议，不做 AI 内容治理\n\n**📌 关键概念**：生成式 AI 应用的负责任运行 = Guardrails（内容过滤+主题拒绝）；基础设施安全（Inspector）与身份（Cognito）是不同层面的防护。","s":"源#178"},{"id":"D4-010","d":4,"t":"single","q":"一家社交媒体公司希望阻止用户在该公司的应用程序上发布歧视性内容。该公司希望使用Amazon Bedrock作为解决方案的一部分。该公司如何使用Amazon Bedrock来满足这些要求？","o":[{"l":"A","t":"给予用户基于用户偏好的交互能力。"},{"l":"B","t":"阻止与预定义主题相关的交互。"},{"l":"C","t":"将用户对话限制在预定义的主题。"},{"l":"D","t":"为用户参与提供多种回答供选择。"}],"a":["B"],"e":"**✅ 为什么 B. 阻止与预定义主题相关的交互对**：Bedrock Guardrails 的\"拒绝主题\"（Denied Topics）功能允许定义模型禁止讨论的话题。公司可以预定义歧视性内容相关的主题，Guardrails 会自动阻止包含这些主题的输入和输出，防止歧视性内容的生成和传播。\n**❌ 为什么其他选项错**：\n- A. 给予用户基于用户偏好的交互能力——这增加个性化而非限制有害内容\n- C. 将用户对话限制在预定义的主题——这过于严格，限制所有对话到特定主题会降低用户体验\n- D. 为用户参与提供多种回答供选择——提供选项不能阻止歧视性内容的产生\n**📌 关键概念**：Bedrock Guardrails 的拒绝主题（Denied Topics）= 定义模型禁止讨论的话题。内容过滤 = 检测有害内容；拒绝主题 = 屏蔽特定话题。题干出现\"阻止歧视性内容\"→想到 Guardrails 拒绝主题。","s":"源#183"},{"id":"D4-011","d":4,"t":"single","q":"一家公司使用Amazon Bedrock上的第三方模型来分析机密文件。该公司担心数据隐私。哪项陈述描述了Amazon Bedrock如何保护数据隐私？","o":[{"l":"A","t":"用户输入和模型输出被匿名化，并与第三方模型提供商共享。"},{"l":"B","t":"用户输入和模型输出不与任何第三方模型提供者共享。"},{"l":"C","t":"用户输入是保密的，但是模型输出与第三方模型提供商共享。"},{"l":"D","t":"用户输入和模型输出在与第三方模型提供者共享之前被编辑。"}],"a":["B"],"e":"**✅ 为什么 B.用户输入和模型输出不与任何第三方模型提供者共享。 对**：Bedrock 的数据隐私承诺正是「客户输入与模型输出均不用于训练、不与第三方模型提供商共享」，正符合机密文件分析的隐私要求。\n\n**❌ 为什么其他选项错**：\n- A.用户输入和模型输出被匿名化，并与第三方模型提供商共享。：与事实相反，Bedrock 不向模型厂商共享客户数据\n- C.用户输入是保密的，但是模型输出与第三方模型提供商共享。：输入输出同等保护，不存在只共享输出的策略\n- D.用户输入和模型输出在与第三方模型提供者共享之前被编辑。：Bedrock 不做「编辑后共享」，数据不出境是基本承诺\n\n**📌 关键概念**：Bedrock 隐私模型：客户数据（输入/输出）不共享给第三方模型厂商、不用于训练其模型；这是企业采用第三方 FM 的信任基础。","s":"源#202"},{"id":"D4-012","d":4,"t":"multiple","q":"一家贷款公司正在构建一个基于生成式人工智能的解决方案，根据特定的业务标准为新申请人提供折扣。该公司希望负责任地建立和使用人工智能模型，以最大限度地减少可能对一些客户产生负面影响的偏见。公司应该采取哪些措施来满足这些要求？（选择两个。）","o":[{"l":"A","t":"检测数据中的不平衡或差异。"},{"l":"B","t":"确保模型经常运行。"},{"l":"C","t":"评估模型的行为，以便公司可以向利益相关者提供透明度。"},{"l":"D","t":"使用面向回忆的替角 Gisting 评估(ROUGE)技术来确保模型 100%准确。"},{"l":"E","t":"确保模型的推理时间在可接受的范围内。"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A.检测数据中的不平衡或差异。：数据层面的偏见检测是源头治理，发现分布不均可在训练前纠偏\n- C.评估模型的行为，以便公司可以向利益相关者提供透明度。：模型行为评估支撑透明度披露，让折扣决策可审查、可问责\n\n**❌ 为什么其他选项错**：\n- B.确保模型经常运行。：运行频率与偏见无关，高频运行不会让模型更公平\n- D.使用面向回忆的替角 Gisting 评估(ROUGE)技术来确保模型 100%准确。：ROUGE 是摘要文本指标，与公平性无关且「100%准确」表述不成立\n- E.确保模型的推理时间在可接受的范围内。：推理时间是性能维度，不解决偏见问题\n\n**📌 关键概念**：负责任 AI 降偏见组合 = 数据侧（检测不平衡）+ 模型侧（行为评估与透明度）；性能指标（速度/频率）与文本指标（ROUGE）均不度量公平性。","s":"源#217"},{"id":"D4-013","d":4,"t":"multiple","q":"一家公司将 Amazon Bedrock用于其生成式人工智能应用程序。该公司希望使用Amazon Bedrock护栏来检测和过滤有害的用户输入和模型生成的输出。护栏可以过滤哪些内容类别？（选择两个。）","o":[{"l":"A","t":"讨厌"},{"l":"B","t":"政治"},{"l":"C","t":"暴力"},{"l":"D","t":"投机"},{"l":"E","t":"宗教"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A.讨厌：Hate（仇恨言论）是 Bedrock Guardrails 内容过滤的标准类别之一，可检测拦截\n- C.暴力：Violence（暴力内容）同为标准过滤类别，覆盖输入与输出双向过滤\n\n**❌ 为什么其他选项错**：\n- B.政治：政治类内容不在 Guardrails 内置过滤类别中（可通过拒绝主题自定义间接限制）\n- D.投机：投机不是 Guardrails 的内容类别\n- E.宗教：宗教不在内置类别中，同样只能靠自定义拒绝主题\n\n**📌 关键概念**：Bedrock Guardrails 内置内容类别：Hate（仇恨）、Insults（侮辱）、Sexual（性）、Violence（暴力）、Misconduct（不当行为）+ 提示攻击防护；政治/宗教等需用自定义拒绝主题实现。","s":"源#220"},{"id":"D4-014","d":4,"t":"multiple","q":"一家公司正在将人工智能集成到其员工招聘和雇用解决方案中。该公司希望减轻偏见风险，并确保负责任的人工智能实践，同时优先考虑公平的招聘决定。公司应该考虑责任 AI 的哪些核心维度？（选择两个。）","o":[{"l":"A","t":"公平"},{"l":"B","t":"容忍"},{"l":"C","t":"灵活性"},{"l":"D","t":"开放源码"},{"l":"E","t":"透明度"}],"a":["A","E"],"e":"**✅ 为什么 A. 公平和 E. 透明度对**：\n- A（公平）：招聘 AI 必须确保对所有候选人一视同仁，不因性别、种族、年龄等因素产生系统性偏差。公平性是防止招聘歧视的核心维度。\n- E（透明度）：招聘决策必须可解释——候选人有权知道被拒绝的原因，监管机构需要审查决策逻辑。透明度确保决策过程可追溯和可审计。\n**❌ 为什么其他选项错**：\n- B. 容忍——\"容忍\"不是负责任 AI 的标准核心维度\n- C. 灵活性——灵活性是系统设计特征，不是负责任 AI 维度\n- D. 开放源码——开源是代码许可模式，与负责任 AI 实践不直接相关\n**📌 关键概念**：招聘 AI 的核心负责任 AI 维度：公平（防偏见）+ 透明（可解释决策）。七大维度中与招聘最相关的就是这两个。","s":"源#223"},{"id":"D4-015","d":4,"t":"single","q":"一家电子商务公司正在部署一个聊天机器人。该聊天机器人将使用户能够就公司的产品提问，并获取其订单详情。公司必须为聊天机器人设置防护措施，以过滤掉输入提示和聊天机器人回复中的有害内容。哪个 AWS 功能或资源符合这些要求？","o":[{"l":"A","t":"Amazon Bedrock 安全护栏"},{"l":"B","t":"Amazon Bedrock Agents"},{"l":"C","t":"Amazon Bedrock 推理 API"},{"l":"D","t":"Amazon Bedrock 自定义模型"}],"a":["A"],"e":"**✅ 为什么 A.Amazon Bedrock 安全护栏 对**：Bedrock Guardrails 专用于过滤用户输入提示与模型回复中的有害内容（双向过滤），正符合聊天机器人「输入+输出双向防护」的要求。\n\n**❌ 为什么其他选项错**：\n- B.Amazon Bedrock Agents：Agents 做任务编排与工具调用，不做内容过滤\n- C.Amazon Bedrock 推理 API：推理 API 是模型调用接口，无内容治理能力\n- D.Amazon Bedrock 自定义模型：自定义模型是微调产物，本身不提供护栏功能\n\n**📌 关键概念**：有害内容双向过滤（输入提示+模型输出）是 Guardrails 独有职责；Agents（编排）、推理 API（调用接口）、自定义模型（微调产物）均不做内容安全。","s":"源#249"},{"id":"D4-016","d":4,"t":"single","q":"一家金融公司正在开发一款用于贷款审批决策的生成式人工智能应用程序。该公司要求该应用程序的输出结果要负责任且公平。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"审查训练数据以检查是否存在偏差。在训练数据中纳入来自所有人口群体的数据。"},{"l":"B","t":"使用具有许多隐藏层的深度学习模型。"},{"l":"C","t":"对模型的决策过程保密，以保护专有算法。"},{"l":"D","t":"持续监控模型在静态测试数据集上的表现"}],"a":["A"],"e":"**✅ 为什么 A.审查训练数据以检查是否存在偏差。在训练数据中纳入来自所有人口群体的数据。 对**：公平输出的根源在训练数据：审查数据偏见并覆盖全部人口群体，才能让贷款审批决策对不同群体公平，正符合「输出负责任且公平」的要求。\n\n**❌ 为什么其他选项错**：\n- B.使用具有许多隐藏层的深度学习模型。：模型深度提升表达能力，不消除数据带来的偏见\n- C.对模型的决策过程保密，以保护专有算法。：保密决策过程违背透明原则，恰与负责任 AI 相悖\n- D.持续监控模型在静态测试数据集上的表现：静态测试集不能反映真实群体分布变化，监控对象也不对\n\n**📌 关键概念**：公平性治理主线 = 数据侧审查偏见 + 群体覆盖；模型架构（深浅）与保密策略不解决公平问题，静态监控是失效的治理手段。","s":"源#252"},{"id":"D4-017","d":4,"t":"single","q":"一家公司正在利用人工智能来改进其服务。该公司需要确保人工智能系统公平且具有可解析性。该公司希望对人工智能系统开发团队的成员进行培训。哪种培训能满足这些要求？","o":[{"l":"A","t":"高级编程技能培训"},{"l":"B","t":"数据隐私和加密协议方面的培训"},{"l":"C","t":"关于偏见意识和负责任的人工智能的培训"},{"l":"D","t":"高级机器学习算法培训"}],"a":["C"],"e":"**✅ 为什么 C.关于偏见意识和负责任的人工智能的培训 对**：偏见意识+负责任 AI 培训直接提升团队在公平性与可解析性方面的认知与实操能力，正符合「确保系统公平且可解析」的培训目标。\n\n**❌ 为什么其他选项错**：\n- A.高级编程技能培训：编程技能是工程基础，与公平性/可解释性治理无关\n- B.数据隐私和加密协议方面的培训：隐私与加密是安全维度，不覆盖公平与解释\n- D.高级机器学习算法培训：算法能力提升模型效果，不等于负责任 AI 实践能力\n\n**📌 关键概念**：负责任 AI 能力建设 = 偏见意识 + 公平性/可解释性方法论培训；技术技能（编程/算法）与安全技能（加密）是不同维度。","s":"源#254"},{"id":"D4-018","d":4,"t":"single","q":"一家公司获得了国际标准化组织（ISO）的认证，以管理人工智能风险并负责任地使用人工智能。这项认证反映了该公司怎样的情况？","o":[{"l":"A","t":"公司所有成员均通过了 ISO 认证。"},{"l":"B","t":"该公司使用的所有人工智能系统均通过了 ISO 认证。"},{"l":"C","t":"所有人工智能应用团队成员均通过了 ISO 认证。"},{"l":"D","t":"该公司的开发框架已通过 ISO 认证。"}],"a":["D"],"e":"**✅ 为什么 D.该公司的开发框架已通过 ISO 认证。 对**：ISO 认证针对的是公司的流程、控制措施与开发框架体系，表明其 AI 风险管理框架符合标准，而非对个人或单个系统的认证。\n\n**❌ 为什么其他选项错**：\n- A.公司所有成员均通过了 ISO 认证。：ISO 认证对象是组织体系框架，不认证个人\n- B.该公司使用的所有人工智能系统均通过了 ISO 认证。：认证覆盖的是管理体系，不是逐个系统发证\n- C.所有人工智能应用团队成员均通过了 ISO 认证。：同样是个人维度，与认证对象不符\n\n**📌 关键概念**：管理体系类认证（ISO/IEC 42001 等）认证的是「组织的开发与治理框架」；个人资质证书与系统级认证是不同概念。","s":"源#297"},{"id":"D4-019","d":4,"t":"multiple","q":"一家公司正在将其员工招聘和录用解决方案与人工智能相结合。该公司希望降低偏见风险，确保负责任的人工智能实践，同时优先考虑公平的招聘决策。公司应考虑负责任的人工智能的哪些核心维度？（选择两个。）","o":[{"l":"A","t":"公平性"},{"l":"B","t":"容忍度"},{"l":"C","t":"灵活性"},{"l":"D","t":"开源"},{"l":"E","t":"透明度"}],"a":["A","E"],"e":"**✅ 为什么 A、E 对**：\n- A.公平性：公平性确保不同人口群体获得公平结果，直接降低招聘决策中的偏见风险\n- E.透明度：透明度让 AI 决策逻辑可被审视与解释，支撑公平招聘的审查与问责\n\n**❌ 为什么其他选项错**：\n- B.容忍度：容忍度不是负责任 AI 的核心维度\n- C.灵活性：灵活性是工程适应性维度，与公平招聘无关\n- D.开源：开源是软件许可模式，不是负责任 AI 维度\n\n**📌 关键概念**：负责任 AI 核心维度：公平性（反偏见）、透明度（可解释可审查）、可问责、安全、隐私；招聘类高影响场景优先公平+透明。","s":"源#304"},{"id":"D4-020","d":4,"t":"hot","q":"一家公司正在开发一款人工智能应用程序，以帮助公司批准或拒绝个人贷款。该应用程序必须遵循负责任的人工智能原则。从以下列表中为每个行动选择正确的负责任的人工智能原则。每个负责任的人工智能原则只能选择一次或根本不选。","o":[],"a":[],"e":"**✅ 正确配对说明**：本题将具体行动与负责任 AI 原则配对。贷款审批场景典型映射：确保不同群体获批率一致→公平性；向被拒申请人说明拒绝理由→透明度；让审计人员理解模型决策逻辑→可解释性；保护申请人个人信息→安全与隐私。按行动语义对应原则：群体公平→公平、理由告知→透明、逻辑可审→可解释、信息保护→安全。\n\n**❌ 常见配对错误**：\n- 拒绝理由告知误配可解释性：面向用户的理由说明属透明度，可解释性面向审计/技术侧\n- 群体获批率一致误配透明度：群体间公平结果是公平性的范畴\n- 个人信息保护误配公平性：数据保护属于安全与隐私维度\n\n**📌 关键概念**：负责任 AI 原则场景映射：公平（群体结果一致）、透明（用户知情）、可解释（决策逻辑可审）、安全（数据保护）；金融场景四大原则需能按行动语义归类。","s":"源#307"},{"id":"D4-021","d":4,"t":"single","q":"一家公司正在基于职位发布数据和求职者用户资料构建一个职位推荐系统。该系统在为条件相当的用户推荐职位时，存在基于性别的偏见。根据 AWS 负责任的人工智能最佳实践，公司应遵循哪项原则来解决此？","o":[{"l":"A","t":"治理"},{"l":"B","t":"可解析性"},{"l":"C","t":"可控性"},{"l":"D","t":"公平性"}],"a":["D"],"e":"**✅ 为什么 D.公平性 对**：职位推荐存在「条件相当的用户因性别获得不同推荐」，本质是群体间结果不公，AWS 负责任 AI 实践中公平性原则专门识别并减轻此类偏见。\n\n**❌ 为什么其他选项错**：\n- A.治理：治理是组织流程与责任框架，不是消除模型偏见的原则\n- B.可解析性：可解析性解释模型如何决策，本题问题是结果偏见而非解释不足\n- C.可控性：可控性强调人对系统的控制能力，不针对群体公平问题\n\n**📌 关键概念**：偏见类问题（性别/种族/年龄歧视）一律归公平性原则；可解析性（解释）、治理（流程）、可控性（人工控制）各有不同的问题域。","s":"源#337"},{"id":"D4-022","d":4,"t":"single","q":"一家公司必须遵守监管标准，才能开发和使用值得信赖的人工智能管理解决方案。哪种方法能满足这一要求？","o":[{"l":"A","t":"通过使用高性能 GPU 来加快处理速度，从而优化模型推理时间。"},{"l":"B","t":"确保每个 AI 解决方案仅由技术专家开发。不要让其他利益相关者参与。"},{"l":"C","t":"限制每个模型决策过程的透明度和用户访问权限。"},{"l":"D","t":"确保每个 AI 解决方案在其整个生命周期内都做到公平、透明、负责和安全。"}],"a":["D"],"e":"**✅ 为什么 D.确保每个 AI 解决方案在其整个生命周期内都做到公平、透明、负责和安全。 对**：可信 AI 的监管标准要求把公平、透明、可问责、安全贯穿解决方案全生命周期（设计→开发→部署→运行），是合规路径的正解。\n\n**❌ 为什么其他选项错**：\n- A.通过使用高性能 GPU 来加快处理速度，从而优化模型推理时间。：性能优化不等于合规，速度不是监管核心要求\n- B.确保每个 AI 解决方案仅由技术专家开发。不要让其他利益相关者参与。：可信 AI 恰恰要求多方利益相关者参与，排除法与监管精神相反\n- C.限制每个模型决策过程的透明度和用户访问权限。：降低透明度违背可信 AI 基本要求\n\n**📌 关键概念**：可信 AI 监管四支柱 = 公平+透明+可问责+安全，且须全生命周期落实；技术优化、封闭开发、降低透明均偏离监管要求。","s":"源#346"},{"id":"D4-023","d":4,"t":"single","q":"一家公司正在使用Amazon Q Business 来创建一个 AI 助手。该公司需要限制用户与 AI 助手的互动仅限于公司批准的主题。哪个功能能满足这些要求？","o":[{"l":"A","t":"Amazon Q Business 企业索引"},{"l":"B","t":"Amazon Q Business 入门索引"},{"l":"C","t":"Amazon Q Business应用的使用限制"},{"l":"D","t":"Amazon Q 索引跨账户访问"}],"a":["C"],"e":"**✅ 为什么 C.Amazon Q Business应用的使用限制 对**：Q Business 的应用使用限制（应用主题控制/防护栏功能）可限制 AI 助手仅响应公司批准的主题，正符合「互动仅限批准主题」的要求。\n\n**❌ 为什么其他选项错**：\n- A.Amazon Q Business 企业索引：企业索引用于数据源连接与检索，不限制话题范围\n- B.Amazon Q Business 入门索引：入门索引是数据源类型，与主题限制无关\n- D.Amazon Q 索引跨账户访问：跨账户访问是权限共享机制，不是内容范围控制\n\n**📌 关键概念**：Q Business 治理分工：应用使用限制（话题边界/防护）+ IAM（谁能用）+ 索引（能查什么数据）；控制「讨论什么」用使用限制功能。","s":"源#350"},{"id":"D4-024","d":4,"t":"single","q":"一家公司正在开发一种人工智能解决方案，以协助做出招聘决策。哪种策略符合 AWS 关于负责任的人工智能的指导原则？","o":[{"l":"A","t":"使用人工智能解决方案做出最终聘用决定，无需人工审核。"},{"l":"B","t":"仅使用以往成功招聘的数据来训练人工智能解决方案。"},{"l":"C","t":"测试人工智能解决方案，确保其不对任何受保护群体进行歧视。"},{"l":"D","t":"为保持竞争优势，应将人工智能的决策过程保密。"}],"a":["C"],"e":"**✅ 为什么 C.测试人工智能解决方案，确保其不对任何受保护群体进行歧视。 对**：AWS 负责任 AI 指南要求对高影响场景（招聘）做公平性测试，验证不歧视受保护群体，这是招聘决策合规的核心动作。\n\n**❌ 为什么其他选项错**：\n- A.使用人工智能解决方案做出最终聘用决定，无需人工审核。：高影响决策必须保留人工审核，全自动决策违背负责任原则\n- B.仅使用以往成功招聘的数据来训练人工智能解决方案。：只用正样本训练会引入幸存者偏差，加剧偏见\n- D.为保持竞争优势，应将人工智能的决策过程保密。：保密决策过程违背透明度原则\n\n**📌 关键概念**：招聘类高影响 AI 应用 = 公平性测试（受保护群体无歧视）+ 人在回路（人工审核）；幸存者偏差数据与黑箱决策都是典型反例。","s":"源#432"},{"id":"D4-025","d":4,"t":"multiple","q":"一家公司正在准备数据以微调大型语言模型（LLM），该公司必须遵循负责任的人工智能原则。哪些操作可以满足此要求？（选择两项。）","o":[{"l":"A","t":"包含具有人口统计多样性的数据源，以提高模型的公平性。"},{"l":"B","t":"在训练数据集中统一应用标注标准。"},{"l":"C","t":"仅专注于大量数据，而不考虑其质量。"},{"l":"D","t":"仅使用合成数据来训练模型。"},{"l":"E","t":"使用更少的标签，以在模型训练期间减少数据的歧义。"}],"a":["A","B"],"e":"**✅ 为什么 A、B 对**：\n- A.包含具有人口统计多样性的数据源，以提高模型的公平性。：多样化数据覆盖不同群体，从源头减少模型偏见\n- B.在训练数据集中统一应用标注标准。：统一标注标准保证数据一致性，支撑微调质量与可复现性\n\n**❌ 为什么其他选项错**：\n- C.仅专注于大量数据，而不考虑其质量。：数量不能替代质量，低质数据训练出低质模型\n- D.仅使用合成数据来训练模型。：纯合成数据存在分布偏移风险，不能代表真实人群\n- E.使用更少的标签，以在模型训练期间减少数据的歧义。：减少标签只会丢失监督信号，不能降低歧义\n\n**📌 关键概念**：负责任的数据准备 = 多样性（群体覆盖）+ 一致性（统一标注标准）；「重数量轻质量」「纯合成」「少标签」均为反面做法。","s":"源#446"},{"id":"D4-026","d":4,"t":"multiple","q":"一家人力资源公司正在开发一种人工智能/机器学习解决方案，用于筛选简历并为不同职位挑选合适的申请人。哪些人工智能方法论有助于确保对所有人口群体进行公正对待？（选择两项。）","o":[{"l":"A","t":"模块化"},{"l":"B","t":"公平性"},{"l":"C","t":"可解析性"},{"l":"D","t":"保密"},{"l":"E","t":"欠拟合"}],"a":["B","C"],"e":"**✅ 为什么 B、C 对**：\n- B.公平性：公平性确保简历筛选对不同人口群体一视同仁，避免偏见性淘汰\n- C.可解析性：可解析性让筛选决策可被理解与申诉，支撑对候选人和监管的解释义务\n\n**❌ 为什么其他选项错**：\n- A.模块化：模块化是工程架构方法，与公正对待无关\n- D.保密：保密恰与可解释、可申诉的治理方向相反\n- E.欠拟合：欠拟合是模型训练缺陷，不是治理方法论\n\n**📌 关键概念**：HR 类 AI 治理双支柱 = 公平性（群体公正）+ 可解析性（决策可解释可申诉）；工程概念（模块化）与训练缺陷（欠拟合）不属于治理方法论。","s":"源#447"},{"id":"D5-001","d":5,"t":"single","q":"一家金融机构正在使用Amazon Bedrock开发一个人工智能应用程序。该应用程序托管在 VPC 中。为了满足法规遵从性标准，不允许 VPC 访问任何互联网流量。哪个 AWS 服务或功能将满足这些要求？","o":[{"l":"A","t":"AWS PrivateLink"},{"l":"B","t":"Amazon Macie"},{"l":"C","t":"Amazon CloudFront"},{"l":"D","t":"互联网网关"}],"a":["A"],"e":"**✅ 为什么 A. AWS PrivateLink 对**：题干要求 VPC 内的应用访问 Bedrock 服务但\"不允许互联网流量\"。AWS PrivateLink 在 VPC 内创建私有终端节点（VPC Endpoint），使应用通过 AWS 内部网络直接连接 Bedrock API，数据流量完全不经过公共互联网，满足金融合规的网络隔离要求。\n**❌ 为什么其他选项错**：\n- B. Amazon Macie——Macie 是敏感数据发现服务，不提供网络隔离功能\n- C. Amazon CloudFront——CloudFront 是 CDN 内容分发网络，通过公共互联网加速内容传输，与\"不允许互联网流量\"矛盾\n- D. 互联网网关——Internet Gateway 正是连接 VPC 到互联网的组件，添加它恰恰违反了限制\n**📌 关键概念**：VPC 内私密访问 AWS 服务 = AWS PrivateLink（VPC Endpoint）。题干出现\"VPC + 禁止互联网流量 + 访问 AWS 服务\"→想到 PrivateLink。金融/医疗行业常见的网络合规要求。","s":"源#13"},{"id":"D5-002","d":5,"t":"single","q":"一家公司希望使用人工智能来保护其应用程序免受威胁。人工智能解决方案需要检查 IP 地址是否来自可疑来源。哪种解决方案符合这些要求？","o":[{"l":"A","t":"建立一个语音识别系统。"},{"l":"B","t":"创建一个自然语言处理(NLP)命名实体识别系统。"},{"l":"C","t":"开发一个异常检测系统。"},{"l":"D","t":"创建欺诈预测系统。"}],"a":["C"],"e":"**✅ 为什么 C. 开发一个异常检测系统对**：题干要求\"检查 IP 地址是否来自可疑来源\"，这是网络安全中的异常检测任务——通过分析 IP 地址的行为模式（访问频率、地理位置、已知恶意 IP 列表）来识别可疑来源。异常检测系统使用 ML 学习正常流量模式，标记偏离正常模式的可疑 IP。\n**❌ 为什么其他选项错**：\n- A. 建立一个语音识别系统——语音识别处理音频信号，与 IP 地址检测无关\n- B. 创建一个自然语言处理(NLP)命名实体识别系统——NER 从文本中识别实体，不处理网络流量分析\n- D. 创建欺诈预测系统——欺诈预测通常针对交易行为（如信用卡欺诈），不是 IP 可疑来源检测的最佳匹配\n**📌 关键概念**：IP 可疑来源检测 = 异常检测（Anomaly Detection）。AWS 中 Amazon GuardDuty 使用 ML 进行威胁检测，检查可疑 IP、异常 API 调用等。题干出现\"检查 IP + 可疑来源\"→想到异常检测。","s":"源#20"},{"id":"D5-003","d":5,"t":"single","q":"哪个选项是生成式人工智能模型的用例？","o":[{"l":"A","t":"使用入侵检测系统提高网络安全性"},{"l":"B","t":"为数字营销从文本描述中创建逼真的图像"},{"l":"C","t":"通过使用优化索引提高数据库性能"},{"l":"D","t":"分析金融数据以预测股票市场趋势"}],"a":["B"],"e":"**✅ 为什么 B.为数字营销从文本描述中创建逼真的图像 对**：从文本描述生成逼真图像是典型的生成式 AI 用例（文生图），正符合「生成式 AI 模型用例」的题眼。\n\n**❌ 为什么其他选项错**：\n- A.使用入侵检测系统提高网络安全性：入侵检测是规则/检测类传统安全系统，不生成内容\n- C.通过使用优化索引提高数据库性能：索引优化是数据库管理技术，非生成任务\n- D.分析金融数据以预测股票市场趋势：趋势预测是判别/预测式 AI，不是内容生成\n\n**📌 关键概念**：生成式 AI = 创造新内容（文本/图像/音频/视频）；判别式 AI = 分类/预测。文生图是生成式，检测、优化、预测都是判别式或传统 IT。","s":"源#22"},{"id":"D5-004","d":5,"t":"single","q":"一家安全公司正在使用 Amazon Bedrock来运行基础模型(FMs)。该公司希望确保只有授权用户才能调用这些模型。公司需要识别任何未经授权的访问企图，以便为 FMs 的未来版本设置适当的 AWS 身份和访问管理(IAM)策略和角色。公司应该使用哪种 AWS 服务来识别试图访问 Amazon Bedrock的未授权用户？","o":[{"l":"A","t":"AWS Audit Manager"},{"l":"B","t":"AWS CloudTrail"},{"l":"C","t":"Amazon Fraud Detector"},{"l":"D","t":"AWS Trusted Advisor（可信顾问）"}],"a":["B"],"e":"**✅ 为什么 B.AWS CloudTrail 对**：CloudTrail 记录全部 API 调用（含被拒绝的未授权访问尝试），可据此识别试图访问 Bedrock 的未授权用户，为后续制定 IAM 策略提供证据，正符合要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS Audit Manager：Audit Manager 做合规证据收集与框架映射，不记录逐条 API 调用者身份\n- C.Amazon Fraud Detector：Fraud Detector 检测线上欺诈交易，不审计 API 访问\n- D.AWS Trusted Advisor（可信顾问）：Trusted Advisor 给优化建议，不记录访问日志\n\n**📌 关键概念**：识别未授权访问尝试 = CloudTrail（API 审计日志）；配合 IAM 策略形成「发现→收紧」闭环；Audit Manager 面向合规映射，粒度不同。","s":"源#26"},{"id":"D5-005","d":5,"t":"single","q":"一家安全公司正在使用 Amazon Bedrock 运行基础模型 (FMs)。该公司希望确保只有授权用户才能调用模型。公司需要识别任何未经授权的尝试设置适当的 AWS Identity and Access Management (IAM)) 策略和角色 FMs 的未来迭代。公司应使用哪项 AWS 服务来识别试图访问的未经授权用户？","o":[{"l":"A","t":"AWS Audit Manager"},{"l":"B","t":"AWS CloudTrail"},{"l":"C","t":"Amazon Fraud Detector"},{"l":"D","t":"AWS Trusted Advisor（可信顾问）"}],"a":["B"],"e":"**✅ 为什么 B. AWS CloudTrail 对**：CloudTrail 记录 AWS 账户中的所有 API 调用日志——谁在什么时间从什么 IP 调用了什么 API。通过分析 CloudTrail 日志，公司可以识别未经授权的 Bedrock API 调用尝试（被 IAM 拒绝的请求），发现潜在的未授权访问。\n**❌ 为什么其他选项错**：\n- A. AWS Audit Manager——Audit Manager 自动化收集合规证据和生成审计报告，不直接识别未授权访问\n- C. Amazon Fraud Detector——Fraud Detector 用于在线欺诈检测（如支付欺诈），不监控 AWS API 访问\n- D. AWS Trusted Advisor（可信顾问）——Trusted Advisor 提供最佳实践建议（成本/性能/安全），不记录和分析 API 调用日志\n**📌 关键概念**：识别未授权访问 = 审查 API 调用日志 = CloudTrail。CloudTrail 是 AWS 安全审计的基础数据源。题干出现\"识别未授权访问尝试\"→想到 CloudTrail。","s":"源#28"},{"id":"D5-006","d":5,"t":"single","q":"公司如何在 Amazon Bedrock上安全地使用大型语言模型(LLM)？","o":[{"l":"A","t":"设计清晰具体的提示。使用最低权限访问配置 AWS 身份和访问管理(IAM)角色和策略。"},{"l":"B","t":"为自动模型评估作业启用 AWS Audit Manager。"},{"l":"C","t":"启用 Amazon Bedrock自动模型评估作业。"},{"l":"D","t":"使用 Amazon CloudWatch 日志使模型变得可解释，并监控偏差。"}],"a":["A"],"e":"**✅ 为什么 A. 设计清晰具体的提示。使用最低权限访问配置 AWS 身份和访问管理(IAM)角色和策略对**：安全使用 Bedrock 的两个关键：①提示设计层面——清晰具体的提示减少模型误解和不当输出；②权限层面——IAM 最小权限原则确保只有需要的用户/服务能调用特定模型，防止越权访问。两者结合覆盖了应用安全和基础设施安全。\n**❌ 为什么其他选项错**：\n- B. 为自动模型评估作业启用 AWS Audit Manager——Audit Manager 不直接提供 Bedrock 模型评估功能\n- C. 启用 Amazon Bedrock自动模型评估作业——模型评估检查性能，不是安全防护措施\n- D. 使用 Amazon CloudWatch 日志使模型变得可解释，并监控偏差——CloudWatch 监控指标和日志，但不使模型\"可解释\"\n**📌 关键概念**：安全使用 Bedrock = 清晰提示（减少风险输出）+ IAM 最小权限（控制访问）+ Guardrails（内容过滤）+ PrivateLink（网络隔离）。题干出现\"安全使用 LLM\"→想到 IAM 最小权限 + 提示安全设计。","s":"源#34"},{"id":"D5-007","d":5,"t":"single","q":"一名人工智能从业者正在使用Amazon Bedrock 模型来总结客户服务部门的会话聊天。AI 从业者希望存储调用日志来监控模型输入和输出数据。人工智能从业者应该使用哪种策略?","o":[{"l":"A","t":"将 AWS CloudTrail 配置为模型的日志目的地。"},{"l":"B","t":"在 Amazon Bedrock中启用调用日志记录。"},{"l":"C","t":"将 AWS Audit Manager 配置为模型的日志目标。"},{"l":"D","t":"在 Amazon EventBridge 中配置模型调用日志记录。"}],"a":["B"],"e":"**✅ 为什么 B.在 Amazon Bedrock中启用调用日志记录。 对**：Bedrock 原生支持模型调用日志（Model Invocation Logging），可记录输入与输出数据到 S3/CloudWatch，是监控模型输入输出的官方机制。\n\n**❌ 为什么其他选项错**：\n- A.将 AWS CloudTrail 配置为模型的日志目的地。：CloudTrail 记录控制面 API 调用（谁调了什么接口），不记录模型输入输出内容\n- C.将 AWS Audit Manager 配置为模型的日志目标。：Audit Manager 做合规取证，不是模型 IO 日志目的地\n- D.在 Amazon EventBridge 中配置模型调用日志记录。：EventBridge 是事件路由总线，不承担模型调用日志存储\n\n**📌 关键概念**：Bedrock 模型 IO 监控用原生调用日志（可落 S3/CloudWatch Logs）；CloudTrail 只见「调用了 API」，不见「输入输出内容」。","s":"源#57"},{"id":"D5-008","d":5,"t":"single","q":"一家公司想用Amazon Bedrock。该公司需要审查公司在使用Amazon Bedrock时负责哪些安全方面。公司将负责哪个安全方面？","o":[{"l":"A","t":"修补和更新Amazon Bedrock的版本"},{"l":"B","t":"保护托管 Amazon Bedrock的基础设施"},{"l":"C","t":"保护公司传输中的数据和静态数据"},{"l":"D","t":"在公司网络中提供 Amazon 基础"}],"a":["C"],"e":"**✅ 为什么 C. 保护公司传输中的数据和静态数据对**：根据 AWS 责任共担模型，客户负责\"云中的安全\"——包括数据加密（静态和传输中）、访问权限、应用配置。客户需确保传输到 Bedrock 的数据使用 TLS 加密（传输中），存储在 S3 中的训练数据使用 KMS 加密（静态）。\n**❌ 为什么其他选项错**：\n- A. 修补和更新Amazon Bedrock的版本——Bedrock 是托管服务，AWS 负责服务本身的补丁和更新\n- B. 保护托管 Amazon Bedrock的基础设施——基础设施安全是 AWS 的责任（\"云的安全\"）\n- D. 在公司网络中提供 Amazon 基础——网络基础设施由 AWS 提供和维护\n**📌 关键概念**：AWS 责任共担模型：AWS 负责\"云的安全\"（物理设施、网络、托管服务基础设施）；客户负责\"云中的安全\"（数据加密、权限配置、应用安全）。题干出现\"公司负责的安全方面\"→想到数据保护。","s":"源#83"},{"id":"D5-009","d":5,"t":"single","q":"一家公司正在测试一个基础模型(FM)的安全性。在测试期间，该公司希望绕过安全功能，制作有害内容。这是哪种安全技术的例子？","o":[{"l":"A","t":"模糊训练数据以发现漏洞"},{"l":"B","t":"拒绝服务"},{"l":"C","t":"授权渗透测试"},{"l":"D","t":"越狱"}],"a":["D"],"e":"**✅ 为什么 D. 越狱对**：题干描述\"绕过安全功能、制作有害内容\"，这正是越狱（Jailbreaking）的定义——通过精心设计的提示绕过模型的内置安全限制和内容审核机制，诱导模型产生原本被禁止的有害内容。在安全测试（红队测试）中，越狱测试是评估模型安全边界的重要手段。\n**❌ 为什么其他选项错**：\n- A. 模糊训练数据以发现漏洞——模糊测试（Fuzzing）是向系统发送随机/畸形输入以发现崩溃，不是绕过安全功能\n- B. 拒绝服务——DoS 攻击使系统不可用，不涉及生成有害内容\n- C. 授权渗透测试——渗透测试是检查系统基础设施安全漏洞，不专门针对 AI 模型的安全限制\n**📌 关键概念**：越狱（Jailbreaking）= 绕过 AI 安全限制生成有害内容。与之相关：提示注入（覆盖指令）、提示提取（暴露系统配置）。题干出现\"绕过安全功能 + 制作有害内容\"→想到越狱。","s":"源#85"},{"id":"D5-010","d":5,"t":"single","q":"一家公司正在为一个生成式人工智能应用程序使用 Amazon Bedrock中的定制模型。该公司希望使用公司管理的加密密钥来加密模型定制作业创建的模型工件。哪种 AWS 服务符合这些要求?","o":[{"l":"A","t":"AWS KMS"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"Amazon Macie"},{"l":"D","t":"AWS 机密管理器"}],"a":["A"],"e":"**✅ 为什么 A.AWS KMS 对**：KMS 提供客户管理的加密密钥（CMK），可对 Bedrock 模型定制作业产生的模型工件（如训练输出与权重）进行静态加密，正符合「用公司管理的密钥加密」要求。\n\n**❌ 为什么其他选项错**：\n- B.Amazon Inspector：Inspector 做漏洞扫描，不提供加密密钥服务\n- C.Amazon Macie：Macie 发现敏感数据并分类，不做加密\n- D.AWS 机密管理器：Secrets Manager 托管的是密钥凭据（密码/API key），不是数据加密密钥\n\n**📌 关键概念**：数据加密密钥用 KMS（CMK 可由客户管理）；Secrets Manager 管理的是「凭据」而非「加密密钥」；Macie/Inspector 是发现与扫描类服务。","s":"源#100"},{"id":"D5-011","d":5,"t":"single","q":"一家公司需要通过使用高度可扩展的 AWS 服务来监控其机器学习系统的性能。哪个 AWS 服务满足这些要求？","o":[{"l":"A","t":"Amazon CloudWatch"},{"l":"B","t":"AWS CloudTrail"},{"l":"C","t":"AWS Trusted Advisor"},{"l":"D","t":"AWS Config"}],"a":["A"],"e":"**✅ 为什么 A. Amazon CloudWatch 对**：Amazon CloudWatch 是 AWS 的统一监控服务，具有高度可扩展性。它能收集和跟踪 ML 系统的关键指标（如推理延迟、错误率、CPU/GPU 利用率）、设置告警、可视化仪表板，是监控 ML 系统性能的标准 AWS 服务。\n**❌ 为什么其他选项错**：\n- B. AWS CloudTrail——CloudTrail 记录 API 调用日志（谁做了什么），不监控系统性能指标\n- C. AWS Trusted Advisor——Trusted Advisor 提供最佳实践建议，不是性能监控工具\n- D. AWS Config——Config 追踪资源配置变更和合规状态，不监控运行时性能\n**📌 关键概念**：性能监控 = CloudWatch（指标/日志/告警/仪表板）。API 审计 = CloudTrail。配置合规 = Config。最佳实践 = Trusted Advisor。题干出现\"监控性能 + 可扩展\"→想到 CloudWatch。","s":"源#123"},{"id":"D5-012","d":5,"t":"single","q":"一家医院开发了一个人工智能系统，为患者提供个性化的治疗建议。人工智能系统必须提供建议背后的基本原理，并使医生和患者能够获得这些见解。这个场景体现了哪种以人为中心的设计原则？","o":[{"l":"A","t":"可解析性"},{"l":"B","t":"隐私和安全"},{"l":"C","t":"公平"},{"l":"D","t":"数据治理"}],"a":["A"],"e":"**✅ 为什么 A.可解析性 对**：系统需要提供建议背后的基本原理，并让医生和患者都能访问这些见解，这正是以人为中心的「可解析性/可解释性」设计原则。\n\n**❌ 为什么其他选项错**：\n- B.隐私和安全：隐私安全关注数据保护，不涉及解释建议理由\n- C.公平：公平关注不同群体结果一致，与解释基本原理无关\n- D.数据治理：数据治理面向数据管理策略，不是交互层面的解释原则\n\n**📌 关键概念**：以人为中心的设计原则中，「让用户理解 AI 为什么这样建议」= 可解析性；医疗场景中它支撑知情同意与医患信任。","s":"源#164"},{"id":"D5-013","d":5,"t":"single","q":"一家公司已经签署了Amazon Bedrock访问来构建应用程序。该公司希望限制员工访问Amazon Bedrock上的特定型号。哪种解决方案符合这些要求？","o":[{"l":"A","t":"使用 AWS 身份和访问管理(IAM)策略来限制模型访问。"},{"l":"B","t":"使用 AWS 安全令牌服务(AWS STS)生成供模型使用的临时凭据。"},{"l":"C","t":"使用 AWS 身份和访问管理(IAM)服务角色来限制模型订阅。"},{"l":"D","t":"使用 Amazon Inspector 监控模型访问。"}],"a":["A"],"e":"**✅ 为什么 A.使用 AWS 身份和访问管理(IAM)策略来限制模型访问。 对**：IAM 策略可精确控制「哪些主体能访问哪些 Bedrock 模型」，实现按员工限制特定模型访问，正符合要求。\n\n**❌ 为什么其他选项错**：\n- B.使用 AWS 安全令牌服务(AWS STS)生成供模型使用的临时凭据。：STS 发临时凭据解决的是授权传递，不做模型级访问控制\n- C.使用 AWS 身份和访问管理(IAM)服务角色来限制模型订阅。：服务角色是服务间代入身份，不是按员工限制模型访问的机制\n- D.使用 Amazon Inspector 监控模型访问。：Inspector 做漏洞扫描，不做访问控制\n\n**📌 关键概念**：按人/按资源精细化授权 = IAM 策略（允许/拒绝特定 Bedrock 模型 ARN）；STS（临时凭据）、服务角色（服务代入）解决的是别的身份问题。","s":"源#195"},{"id":"D5-014","d":5,"t":"multiple","q":"一家全球金融公司开发了一款机器学习应用程序，用于分析股市数据并提供股市趋势。该公司希望持续监控应用程序的开发阶段，并确保遵守公司政策和行业法规。哪些 AWS 服务将帮助公司评估合规性要求？（选择其中两项。）","o":[{"l":"A","t":"AWS Audit Manager"},{"l":"B","t":"AWS Config"},{"l":"C","t":"Amazon Inspector"},{"l":"D","t":"Amazon CloudWatch"},{"l":"E","t":"AWS CloudTrail"}],"a":["A","B"],"e":"**✅ 为什么 A. AWS Audit Manager和 B. AWS Config 对**：\n- A（AWS Audit Manager）：自动化收集合规证据——自动收集 ML 应用的 IAM 权限变更、数据访问记录、模型训练日志等，生成符合金融行业监管框架（如 SOX、PCI DSS）的审计报告。\n- B（AWS Config）：持续评估资源配置合规性——自动检查 S3 训练数据桶是否加密、IAM 策略是否符合最小权限、SageMaker Endpoint是否在 VPC 内等，确保持续符合公司安全策略。\n**❌ 为什么其他选项错**：\n- C. Amazon Inspector——Inspector 扫描基础设施漏洞（如 EC2 未打补丁），不直接评估合规性\n- D. Amazon CloudWatch——CloudWatch 监控性能指标和日志，不评估合规性\n- E. AWS CloudTrail——CloudTrail 记录 API 日志（是审计数据源），但本身不评估合规性；Audit Manager 消费 CloudTrail 数据生成合规报告\n**📌 关键概念**：评估合规性 = Audit Manager（证据收集+报告）+ Config（配置合规检查）。CloudTrail 提供数据但不评估。题干出现\"评估合规性要求\"→想到 Audit Manager + Config。","s":"源#219"},{"id":"D5-015","d":5,"t":"multiple","q":"一家公司希望通过使用 AWS 服务来微调基础模型(FM)。该公司需要确保其数据在存储数据的源 AWS 区域保持私密、安全和可靠。哪种步骤组合将最经济高效地满足这些要求？（选择两个。）","o":[{"l":"A","t":"通过使用 AWS 前哨站在本地托管模型。"},{"l":"B","t":"使用 Amazon Bedrock API。"},{"l":"C","t":"使用 AWS PrivateLink 和 VPC。"},{"l":"D","t":"在本地托管 Amazon Bedrock API。"},{"l":"E","t":"使用 Amazon CloudWatch 日志和指标。"}],"a":["B","C"],"e":"**✅ 为什么 B、C 对**：\n- B.使用 Amazon Bedrock API。：Bedrock 微调通过区域内的托管 API 完成，数据保持在源区域处理，无需自建基础设施\n- C.使用 AWS PrivateLink 和 VPC。：PrivateLink+VPC 保证流量走私有网络、不出公网，数据私密且安全\n\n**❌ 为什么其他选项错**：\n- A.通过使用 AWS 前哨站在本地托管模型。：Outposts 把 AWS 基础设施延伸到本地，成本高且与「源区域私密」目标不直接对应\n- D.在本地托管 Amazon Bedrock API。：Bedrock 是区域托管服务，无法本地部署 API\n- E.使用 Amazon CloudWatch 日志和指标。：CloudWatch 是监控工具，不参与微调数据的私密性保障\n\n**📌 关键概念**：Bedrock 微调数据私密组合 = 区域内 API（Bedrock 托管）+ PrivateLink/VPC（私有网络通道）；监控（CloudWatch）与本地化（Outposts）不是本题答案。","s":"源#222"},{"id":"D5-016","d":5,"t":"single","q":"一家公司希望对托管在Amazon Bedrock 上的机器学习模型进行微调。该公司希望使用存储在 VPC 中私有数据库里的自身敏感数据。这些数据必须留在公司的私有网络内。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"使用 AWS 身份和访问管理（IAM）服务角色来限制对 Amazon Bedrock 的访问。"},{"l":"B","t":"使用 AWS 身份和访问管理（IAM）资源策略限制对 Amazon Bedrock 的访问。"},{"l":"C","t":"使用 AWS PrivateLink 将 VPC 与 Amazon Bedrock 连接起来。"},{"l":"D","t":"使用 AWS KMS密钥对数据进行加密。"}],"a":["C"],"e":"**✅ 为什么 C.使用 AWS PrivateLink 将 VPC 与 Amazon Bedrock 连接起来。 对**：PrivateLink 在 VPC 与 Bedrock 之间建立私有连接，敏感数据全程留在私有网络内，正符合「数据留在公司私有网络」的要求。\n\n**❌ 为什么其他选项错**：\n- A.使用 AWS 身份和访问管理（IAM）服务角色来限制对 Amazon Bedrock 的访问。：IAM 控制谁能访问，不控制数据传输路径\n- B.使用 AWS 身份和访问管理（IAM）资源策略限制对 Amazon Bedrock 的访问。：资源策略同为权限维度，与网络路径无关\n- D.使用 AWS KMS密钥对数据进行加密。：KMS 加密静态数据与传输加密，但不改变流量仍走公网的事实\n\n**📌 关键概念**：数据不出私有网络 = PrivateLink（VPC 端点直连服务）；IAM（权限）与 KMS（加密）解决授权与静态安全，不解决传输路径私有性。","s":"源#239"},{"id":"D5-017","d":5,"t":"single","q":"一家金融公司在全球多个国家设有办事处。该公司要求，生成式人工智能应用程序与基础模型（FM）之间的所有 API 调用均不得通过公共互联网传输。该公司应该使用哪种 AWS 服务？","o":[{"l":"A","t":"AWS 私有链接"},{"l":"B","t":"Amazon Q"},{"l":"C","t":"Amazon CloudFront"},{"l":"D","t":"AWS CloudTrail 服务"}],"a":["A"],"e":"**✅ 为什么 A.AWS 私有链接 对**：PrivateLink 让 VPC 与 AWS 服务间（含 Bedrock 基础模型）的 API 调用全程走 AWS 私有网络、不经公共互联网传输，正符合跨国金融公司「API 调用不得走公网」的合规要求。\n\n**❌ 为什么其他选项错**：\n- B.Amazon Q：Q 是 AI 助手产品，不提供网络层私有通道能力\n- C.Amazon CloudFront：CloudFront 是 CDN 公网分发服务，与「避免公网」目标相反\n- D.AWS CloudTrail 服务：CloudTrail 做审计日志，不承载 API 流量\n\n**📌 关键概念**：API 调用不走公网 → PrivateLink（VPC 接口端点直连服务）；CDN（CloudFront）是公网加速，审计（CloudTrail）是事后记录，均不改变流量传输路径。","s":"源#248"},{"id":"D5-018","d":5,"t":"single","q":"一家公司希望从其 AWS 账户设置对Amazon Bedrock API 的私有访问。该公司还希望保护其数据不被互联网曝光。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"使用Amazon CloudFront 来限制对公司私有内容的访问。"},{"l":"B","t":"使用 AWS Glue 在公司的数据目录中设置数据加密。"},{"l":"C","t":"使用 AWS Lake Formation 来管理集中式数据治理和跨账户数据共享。"},{"l":"D","t":"使用 AWS PrivateLink 在公司的虚拟私有云（VPC）与 Amazon Bedrock 之间配置私有连接。"}],"a":["D"],"e":"**✅ 为什么 D.使用 AWS PrivateLink 在公司的虚拟私有云（VPC）与 Amazon Bedrock 之间配置私有连接。 对**：PrivateLink 在 VPC 与 Bedrock API 间建立私有连接，实现「私有访问+数据不暴露公网」双重目标，正符合要求。\n\n**❌ 为什么其他选项错**：\n- A.使用Amazon CloudFront 来限制对公司私有内容的访问。：CDN 面向公网内容分发加速，不能提供 API 私有连接\n- B.使用 AWS Glue 在公司的数据目录中设置数据加密。：Glue 是 ETL/目录服务，不涉及 API 网络路径\n- C.使用 AWS Lake Formation 来管理集中式数据治理和跨账户数据共享。：Lake Formation 管理湖仓权限，不提供网络私有连接\n\n**📌 关键概念**：Bedrock API 私有访问唯一正解 = PrivateLink 接口端点；CDN/ETL/湖仓治理都是其他层面的能力。","s":"源#270"},{"id":"D5-019","d":5,"t":"single","q":"一家公司有数据存储和删除的指导方针。这描述的是哪种数据治理策略？","o":[{"l":"A","t":"数据去标识化"},{"l":"B","t":"数据质量标准"},{"l":"C","t":"数据保留"},{"l":"D","t":"日志存储"}],"a":["C"],"e":"**✅ 为什么 C.数据保留 对**：数据保留（Data Retention）策略定义数据存储时长与删除时机，「存储和删除的指导方针」正是其标准定义。\n\n**❌ 为什么其他选项错**：\n- A.数据去标识化：去标识化是脱敏技术（去 PII），不是存留周期管理\n- B.数据质量标准：质量标准约束准确性/一致性，不定义保留期限\n- D.日志存储：日志存储是技术存储形式，不是治理策略\n\n**📌 关键概念**：数据治理策略辨析：保留（存多久/何时删）、去标识化（脱敏）、质量（准确性）；「存储+删除方针」是保留策略的教科书定义。","s":"源#299"},{"id":"D5-020","d":5,"t":"multiple","q":"一家公司希望使用Amazon Q Business来处理其数据。该公司需要确保数据的安全性和隐私性。哪两种步骤组合能满足这些要求？（选择两项。）","o":[{"l":"A","t":"为 Amazon Q Business企业索引启用 AWS KMS密钥。"},{"l":"B","t":"设置跨账户访问 Amazon Q 索引。"},{"l":"C","t":"配置 Amazon Inspector 以进行身份验证。"},{"l":"D","t":"允许公众访问 Amazon Q 索引。"},{"l":"E","t":"配置 AWS 身份和访问管理（IAM）以进行身份验证。"}],"a":["A","E"],"e":"**✅ 为什么 A、E 对**：\n- A.为 Amazon Q Business企业索引启用 AWS KMS密钥。：KMS 密钥加密静态数据，保障企业索引中数据的安全与隐私\n- E.配置 AWS 身份和访问管理（IAM）以进行身份验证。：IAM 控制谁能访问 Q Business，是访问侧安全的基础\n\n**❌ 为什么其他选项错**：\n- B.设置跨账户访问 Amazon Q 索引。：跨账户访问扩大暴露面，与数据安全目标相反\n- C.配置 Amazon Inspector 以进行身份验证。：Inspector 是漏洞扫描服务，不承担身份验证\n- D.允许公众访问 Amazon Q 索引。：公开访问直接违背安全与隐私要求\n\n**📌 关键概念**：Q Business 数据安全组合 = KMS（静态加密）+ IAM（访问控制）；扩大暴露（跨账户/公开访问）与错配工具（Inspector 做认证）都是反例。","s":"源#333"},{"id":"D5-021","d":5,"t":"single","q":"一家公司拥有一支人工智能从业者团队，他们在 AWS 账户中构建和维护人工智能应用程序。出于审计目的，该公司必须记录每个 AI 从业者在 AWS 账户中所采取的操作。哪种 AWS 服务能满足这些要求？","o":[{"l":"A","t":"AWS CloudTrail 服务"},{"l":"B","t":"AWS Config"},{"l":"C","t":"AWS Audit Manager"},{"l":"D","t":"AWS Trusted Advisor（可信顾问）"}],"a":["A"],"e":"**✅ 为什么 A.AWS CloudTrail 服务 对**：CloudTrail 记录账户中所有 API 调用与用户操作，可追溯每个从业者做了什么，是审计目的的操作记录服务，正符合要求。\n\n**❌ 为什么其他选项错**：\n- B.AWS Config：Config 记录资源配置变更与合规评估，不记录「谁执行了什么操作」\n- C.AWS Audit Manager：Audit Manager 收集合规证据映射框架，不是逐人操作日志\n- D.AWS Trusted Advisor（可信顾问）：Trusted Advisor 提供优化建议，无操作审计能力\n\n**📌 关键概念**：审计「谁在账户里做了什么」→ CloudTrail（API 调用历史）；Config（配置状态）、Audit Manager（合规取证）面向不同审计维度。","s":"源#372"},{"id":"D5-022","d":5,"t":"single","q":"一家公司在Amazon SageMaker AI 上训练图像和文本生成模型。该公司通过使用Amazon Bedrock 发布这些模型。该公司必须保留来自 SageMaker AI、Amazon Bedrock 以及 AWS 身份和访问管理（IAM）的每一个 API 调用的防篡改且可查询的记录。哪种 AWS 服务能满足这些要求？","o":[{"l":"A","t":"AWS Trusted Advisor（可信顾问）"},{"l":"B","t":"Amazon Macie"},{"l":"C","t":"AWS CloudTrail Lake"},{"l":"D","t":"Amazon Inspector"}],"a":["C"],"e":"**✅ 为什么 C.AWS CloudTrail Lake 对**：CloudTrail Lake 提供防篡改、不可变、可 SQL 查询的事件数据存储库，可集中记录 SageMaker AI、Bedrock、IAM 三类服务的全部 API 调用历史，正符合「防篡改+可查询」的双重审计要求。\n\n**❌ 为什么其他选项错**：\n- A.AWS Trusted Advisor（可信顾问）：优化建议服务，无审计日志能力\n- B.Amazon Macie：Macie 发现 S3 敏感数据并分类，不记录 API 调用\n- D.Amazon Inspector：Inspector 扫描基础设施漏洞，不做调用记录\n\n**📌 关键概念**：CloudTrail 进阶形态 = CloudTrail Lake（不可变事件库+SQL 查询），满足金融级防篡改审计要求；普通审计日志无防篡改与查询能力。","s":"源#374"},{"id":"D5-023","d":5,"t":"single","q":"一家公司正在Amazon SageMaker Studio 中构建一个定制的人工智能解决方案，用于实时分析金融交易中的欺诈行为。该公司需要确保从 SageMaker Studio 到Amazon Bedrock 的连接通过公司的虚拟私有云（VPC）进行。哪种解决方案符合这些要求？","o":[{"l":"A","t":"为 SageMaker Studio 配置 AWS 身份和访问管理（IAM）角色和策略，以访问 Amazon Bedrock。"},{"l":"B","t":"配置 Amazon Macie 以代理 SageMaker Studio 发往 Amazon Bedrock 的请求。"},{"l":"C","t":"为 SageMaker Studio 所连接的 VPC 中的 Amazon Bedrock API 端点配置 AWS PrivateLink 端点。"},{"l":"D","t":"为 Amazon Bedrock 使用配置一个新的 VPC。将 VPC 注册为对等网络。"}],"a":["C"],"e":"**✅ 为什么 C.为 SageMaker Studio 所连接的 VPC 中的 Amazon Bedrock API 端点配置 AWS PrivateLink 端点。 对**：在 Studio 所在 VPC 内为 Bedrock API 配置 PrivateLink 接口端点，流量全程走 VPC 私有通道，正符合「连接经公司 VPC」的要求。\n\n**❌ 为什么其他选项错**：\n- A.为 SageMaker Studio 配置 AWS 身份和访问管理（IAM）角色和策略，以访问 Amazon Bedrock。：IAM 解决授权，不改变网络路径\n- B.配置 Amazon Macie 以代理 SageMaker Studio 发往 Amazon Bedrock 的请求。：Macie 不做网络代理\n- D.为 Amazon Bedrock 使用配置一个新的 VPC。将 VPC 注册为对等网络。：新建 VPC+对等连接无法保证流量限定在「公司的 VPC」内\n\n**📌 关键概念**：VPC 内私有访问 AWS 服务 API = PrivateLink 接口端点；IAM（授权）、Macie（数据发现）、对等连接（网间互通）均不能实现该目标。","s":"源#376"},{"id":"D5-024","d":5,"t":"single","q":"一位人工智能从业者正在开发一个推荐系统。该从业者希望记录业务、数据假设、训练注意事项以及使用风险。公司必须遵循透明度和治理方面的指导方针。哪个 Amazon SageMaker AI 功能能满足这些要求？","o":[{"l":"A","t":"Amazon SageMaker Model Registry"},{"l":"B","t":"模型卡片"},{"l":"C","t":"模型监控"},{"l":"D","t":"模型仪表盘"}],"a":["B"],"e":"**✅ 为什么 B.模型卡片 对**：SageMaker Model Cards（模型卡）用于记录模型的业务用途、数据假设、训练细节、评估结果与使用风险，正符合「业务+假设+训练注意事项+风险」的记录要求与透明治理目标。\n\n**❌ 为什么其他选项错**：\n- A.Amazon SageMaker Model Registry：注册表管理模型版本与审批流程，不承载业务背景与风险文档\n- C.模型监控：Model Monitor 监控生产数据漂移与质量，不做文档记录\n- D.模型仪表盘：仪表盘展示运行指标，不记录假设与风险\n\n**📌 关键概念**：模型文档与透明治理 = Model Cards（用途/假设/训练/风险一卡通）；Registry（版本管理）、Monitor（漂移监控）、Dashboard（指标展示）各司其职。","s":"源#433"},{"id":"D5-025","d":5,"t":"single","q":"在 Amazon Bedrock 上运行 AI 工作负载的公司需要评估并记录对监管标准的合规性。哪个 AWS 服务或功能满足这些要求？","o":[{"l":"A","t":"AWS Audit Manager"},{"l":"B","t":"Amazon SageMaker Model Cards"},{"l":"C","t":"Amazon SageMaker 模型监控"},{"l":"D","t":"AWS 服务文档"}],"a":["A"],"e":"**✅ 为什么 A.AWS Audit Manager 对**：Audit Manager 持续收集 AWS 资源证据并映射到合规框架，评估并记录对监管标准的符合情况，正符合「评估并记录合规性」的要求。\n\n**❌ 为什么其他选项错**：\n- B.Amazon SageMaker Model Cards：模型卡记录单模型信息，不做监管框架映射\n- C.Amazon SageMaker 模型监控：模型监控盯数据漂移质量，不产出合规报告\n- D.AWS 服务文档：服务文档是产品说明，不是合规评估工具\n\n**📌 关键概念**：合规评估与举证 = Audit Manager（证据收集+框架映射）；模型层工具（Cards/Monitor）只覆盖单模型维度，不面向监管标准。","s":"源#434"},{"id":"D5-026","d":5,"t":"single","q":"一家公司正在训练一个基础模型（FM）。该公司希望在数据生命周期的各个阶段，对 FM 的训练数据进行妥善管理、确保安全并符合合规要求。数据必须遵循治理规范。哪个选项是 AWS 数据治理策略，用于管理数据的整个生命周期？","o":[{"l":"A","t":"允许所有员工无限制地访问所有数据。"},{"l":"B","t":"无限期存储数据，无需分类或保留策略。"},{"l":"C","t":"仅依赖人工审核来确保数据质量和合规性。"},{"l":"D","t":"制定数据生命周期策略、访问控制、日志记录和监控措施。"}],"a":["D"],"e":"**✅ 为什么 D.制定数据生命周期策略、访问控制、日志记录和监控措施。 对**：完整的治理组合 = 生命周期策略（存/用/销全流程）+ 访问控制（谁能用）+ 日志监控（可追溯），覆盖 FM 训练数据各阶段的管理、安全与合规。\n\n**❌ 为什么其他选项错**：\n- A.允许所有员工无限制地访问所有数据。：无限制访问违背最小权限原则，是治理反面\n- B.无限期存储数据，无需分类或保留策略。：无限期存储无策略是最典型治理缺失\n- C.仅依赖人工审核来确保数据质量和合规性。：纯人工审核不可扩展不可持续，治理须制度化工具化\n\n**📌 关键概念**：数据治理三大件 = 生命周期策略 + 访问控制 + 日志监控；「无限制访问、无限期存储、纯人工审核」是三大经典反模式。","s":"源#438"},{"id":"D5-027","d":5,"t":"single","q":"一家公司希望为其人工智能系统建立一个数据治理框架。该框架必须使公司能够监控数据的生成、更新以及计划删除的时间。哪个数据治理组件满足这些要求？","o":[{"l":"A","t":"数据驻留"},{"l":"B","t":"数据生命周期管理"},{"l":"C","t":"数据可观测性"},{"l":"D","t":"数据记录"}],"a":["B"],"e":"**✅ 为什么 B.数据生命周期管理 对**：数据生命周期管理定义并监控数据的创建、更新、保留、归档与删除全程，「监控生成、更新与计划删除时间」正是其职责，正符合要求。\n\n**❌ 为什么其他选项错**：\n- A.数据驻留：驻留管数据存哪（地域），不管生灭时点\n- C.数据可观测性：可观测性关注数据处理管道的运行监控，不是生命周期编排\n- D.数据记录：数据记录是静态文档概念，不含过程监控\n\n**📌 关键概念**：数据「从生到死」的时点管理 = 生命周期管理；驻留（在哪）、可观测性（管道运行）是不同维度的治理组件。","s":"源#439"},{"id":"D5-028","d":5,"t":"single","q":"一家公司已部署了机器学习模型，希望借助客户自身的应用程序，为外部客户提供安全的模型访问服务。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"在客户的应用程序中使用自定义脚本进行身份验证。"},{"l":"B","t":"存储模型凭证并直接与客户共享以进行身份验证。"},{"l":"C","t":"创建一个安全的 API 端点，供客户使用。"},{"l":"D","t":"将模型直接嵌入客户的应用程序中。"}],"a":["C"],"e":"**✅ 为什么 C.创建一个安全的 API 端点，供客户使用。 对**：安全 API 端点为外部客户提供受控的模型访问通道（认证、授权、监控），正符合「客户经自身应用安全访问模型」的要求。\n\n**❌ 为什么其他选项错**：\n- A.在客户的应用程序中使用自定义脚本进行身份验证。：自写认证脚本安全性差且难维护，不是标准方案\n- B.存储模型凭证并直接与客户共享以进行身份验证。：共享凭证是重大安全隐患，违背最小权限原则\n- D.将模型直接嵌入客户的应用程序中。：嵌入客户应用失去模型控制权，也无法统一治理\n\n**📌 关键概念**：对外暴露模型能力 = 安全 API 端点（认证+授权+限流+监控）；自写脚本、共享凭证、模型外发都是错误的安全姿势。","s":"源#445"},{"id":"D5-029","d":5,"t":"multiple","q":"一家公司正在使用 Amazon Q Developer CLI 配合 Model Context Protocol（MCP）服务器构建一个代理式 AI 应用程序。该公司希望遵循 MCP 安全实践。哪些解决方案可以满足这些要求？（选择两项。）","o":[{"l":"A","t":"保持 MCP 服务器和 Amazon Q Developer CLI 的更新。"},{"l":"B","t":"监控 MCP 日志，查看正常成功的操作记录。"},{"l":"C","t":"使用纯文本文件存储敏感配置。"},{"l":"D","t":"自动批准所有由 MCP 服务器提供的工具。"},{"l":"E","t":"仅从可信来源安装服务器。"}],"a":["A","E"],"e":"**✅ 为什么 A、E 对**：\n- A.保持 MCP 服务器和 Amazon Q Developer CLI 的更新。：及时更新补丁已知漏洞，降低供应链安全风险\n- E.仅从可信来源安装服务器。：可信来源校验防止恶意 MCP 服务器植入，是 MCP 安全实践的核心要求\n\n**❌ 为什么其他选项错**：\n- B.监控 MCP 日志，查看正常成功的操作记录。：只看成功记录无法发现异常，应关注失败与可疑操作\n- C.使用纯文本文件存储敏感配置。：明文存储敏感配置是典型安全隐患，应使用 Secrets Manager\n- D.自动批准所有由 MCP 服务器提供的工具。：自动批准全部工具等于放弃最小权限管控，风险极大\n\n**📌 关键概念**：MCP 安全实践 = 及时更新 + 可信来源 + 最小权限（工具审批）+ 密钥托管（非明文）；「全量自动批准、明文配置」是两大反例。","s":"源#449"},{"id":"D5-030","d":5,"t":"hot","q":"一家公司正在使用 Amazon Bedrock AgentCore 来构建、部署和大规模实施代理。该公司需要确定应使用哪些资源。从以下列表中为每个描述选择正确的 AgentCore 资源。每个资源只能选择一次或不选。","o":[],"a":[],"e":"**✅ 正确配对说明**：本题将描述与 Bedrock AgentCore 资源配对。可观测性（Observability）通过仪表板与运行时遥测监控代理行为；代码解析器（Code Interpreter）让代理安全执行支持语言的代码；浏览器工具（Browser Tool）提供快速安全的无服务器浏览器运行环境，供代理与网站和网络应用交互。按「监控遥测→可观测性、安全执行代码→代码解析器、无服务器网页交互→浏览器工具」配对。\n\n**❌ 常见配对错误**：\n- 监控遥测误配代码解析器：代码解析器管代码执行，不采集运行遥测\n- 执行代码误配浏览器工具：浏览器工具面向网页交互，不执行代码\n- 网页交互误配可观测性：可观测性是监控面，不提供浏览器运行环境\n\n**📌 关键概念**：AgentCore 三大资源定位：可观测性（监控/遥测/仪表板）、代码解析器（安全代码执行）、浏览器工具（无服务器网页交互）；按能力域一一对应。","s":"源#451"}];

<script>

/* ================================================================
   ===================== 题库数据（构建注入 QUIZ_META + QUIZ_QUESTIONS） ================
   ================================================================ */
const QUESTIONS = QUIZ_QUESTIONS;
const META = (typeof QUIZ_META !== 'undefined' && QUIZ_META) ? QUIZ_META : {};
const EXAM = META.exam || 'QUIZ';
const LS_PREFIX = META.lsPrefix || EXAM.toLowerCase();

const GLOSSARY = META.glossary || {};

function getGlossaryForQuestion(q) {
  const texts = [q.q];
  if(q.o && Array.isArray(q.o)) q.o.forEach(o => texts.push(o.t));
  if(q.e) texts.push(q.e);
  const fullText = texts.join(' ');
  const found = [];
  const sorted = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
  for(const term of sorted) {
    if(fullText.includes(term)) found.push({term, def: GLOSSARY[term]});
  }
  return found;
}

/* ================================================================
   ===================== 术语高亮 + 弹定义 ================
   ================================================================ */
// 长词优先排序，独立 token 边界匹配，避免 EBS 误标 Amazon EBS 中的 EBS 等
function getGlossarySortedKeys() {
  return Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
}

// 判断术语在文本中是否为独立出现（前后非字母/数字）
function isIndependentToken(text, idx, term) {
  const before = text[idx-1];
  const after = text[idx + term.length];
  const isLetter = c => c && /[A-Za-z0-9]/.test(c);
  return !isLetter(before) && !isLetter(after);
}

// 将解析正文中的术语高亮为可点击 span，返回 HTML
function fmtExp(s){ let t=(s===undefined||s===null)?'':String(s); t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); t=t.replace(/\n/g,'<br>'); t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); return t; }
function highlightGlossaryTerms(text) {
  if(!text) return text;
  const sortedKeys = getGlossarySortedKeys();
  let result = '';
  let i = 0;
  while(i < text.length) {
    let matched = false;
    for(const term of sortedKeys) {
      if(!term) continue;
      const idx = text.indexOf(term, i);
      if(idx === i && isIndependentToken(text, idx, term)) {
        const def = GLOSSARY[term] || '（暂无定义）';
        const termEsc = term.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const defEsc = def.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        result += `<span class="gloss-term" onclick="showGlossTip(event,'${termEsc}','${defEsc}')">${term}</span>`;
        i += term.length;
        matched = true;
        break;
      }
    }
    if(!matched) {
      // 中文等宽字符直接输出，保持原文本
      result += text[i];
      i++;
    }
  }
  return result;
}

// 点击术语弹出定义浮层
function showGlossTip(e, term, def) {
  e.stopPropagation();
  const tip = document.getElementById('glossTip');
  document.getElementById('glossTipTerm').textContent = term;
  document.getElementById('glossTipDef').textContent = def || '（暂无定义）';
  tip.style.display = 'block';
  // 定位：优先在点击位置下方，避免超出视口
  const pad = 12;
  let left = e.clientX + pad;
  let top = e.clientY + pad;
  // 先渲染再量尺寸
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if(left + tw > window.innerWidth - 8) left = e.clientX - tw - pad;
  if(top + th > window.innerHeight - 8) top = e.clientY - th - pad;
  if(left < 8) left = 8;
  if(top < 8) top = 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

function closeGlossTip() {
  document.getElementById('glossTip').style.display = 'none';
}

// 点击页面其它区域关闭浮层
document.addEventListener('click', function(e) {
  const tip = document.getElementById('glossTip');
  if(tip && tip.style.display === 'block' && !tip.contains(e.target)) {
    closeGlossTip();
  }
});

// 按 Esc 关闭浮层
document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') closeGlossTip();
});

/* ================================================================
   ===================== localStorage 操作 =========================
   ================================================================ */
const LS_ANSWERS = LS_PREFIX + '_answers';
const LS_WRONG   = LS_PREFIX + '_wrong';
const LS_PROGRESS = LS_PREFIX + '_progress';

function getAnswers() { return JSON.parse(localStorage.getItem(LS_ANSWERS)||'[]'); }
function setAnswers(a) { localStorage.setItem(LS_ANSWERS,JSON.stringify(a)); }
function getWrong() { return JSON.parse(localStorage.getItem(LS_WRONG)||'[]'); }
function setWrong(w) { localStorage.setItem(LS_WRONG,JSON.stringify(w)); }
function getProgress() { return JSON.parse(localStorage.getItem(LS_PROGRESS)||'{}'); }
function setProgress(p) { localStorage.setItem(LS_PROGRESS,JSON.stringify(p)); }

/* ----------------------------------------------------------------
   作答记录：会话态 / 累计统计态分离（修复）
   旧缺陷：模拟考核误读全局 localStorage 历史 → 进场即显示「已答对/曾答错」、
   题号导航提前染色、成绩单把练习与往场算进本次（实测正确数>题数、未答为负、
   分数超满分、正确率>100%）。
   三态口径：
     · sessionResults()       本场逐题作答（quizState.results）＝「本次」唯一真源
     · sessionScopedAnswers() 视图用作答集：考核=仅本场；练习模式=全局历史（原行为）
     · recordAnswer()         仍写全局 store → 错题集与统计口径不变
   ---------------------------------------------------------------- */
function sessionResults() {
  const r = (quizState && quizState.results) || {};
  return Object.keys(r).map(id => ({id, ua:r[id].ua, ok:r[id].ok, ts:r[id].ts}));
}
function sessionScopedAnswers() {
  return (quizState && quizState.mode === 'exam') ? sessionResults() : getAnswers();
}

function recordAnswer(qId, userAnswer, isCorrect) {
  const answers = getAnswers();
  answers.push({id:qId,ua:userAnswer,ok:isCorrect,ts:Date.now()});
  setAnswers(answers);
  const wrong = getWrong();
  const idx = wrong.findIndex(w=>w.id===qId);
  if(!isCorrect) {
    if(idx>=0) { wrong[idx].count++; wrong[idx].last=Date.now(); }
    else { wrong.push({id:qId,count:1,last:Date.now(),mastered:false}); }
  }
  setWrong(wrong);
}

function markMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=true;
  setWrong(wrong);
}
function unmarkMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=false;
  setWrong(wrong);
}
function removeWrong(qId) {
  setWrong(getWrong().filter(x=>x.id!==qId));
}

/* ================================================================
   ===================== 辅助函数 =================================
   ================================================================ */
const DOMAIN_NAMES = META.domains || {};
const DOMAIN_WEIGHTS = META.weights || {};
const DOMAIN_KEYS = Object.keys(DOMAIN_NAMES).map(Number).sort((a,b)=>a-b);
const EXAM_P = META.examParams || {};
const EXAM_COUNT = EXAM_P.count || 50;
const EXAM_MIN = EXAM_P.minutes || 60;
const EXAM_PASS = EXAM_P.pass || 700;
const TYPE_NAMES = {single:'单选题',multiple:'多选题',hot:'拖拽题'};

function getQById(id) { return QUESTIONS.find(q=>q.id===id); }
function shuffle(arr) { const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function generateShuffledOptions(questions) {
  const opts = {};
  const newAnswers = {};
  questions.forEach(q => {
    if(q.t==='single'||q.t==='multiple') {
      const shuffled = shuffle([...q.o]);
      const labels = 'ABCDEFGHIJ';
      const relabeled = shuffled.map((item, i) => ({l: labels[i], t: item.t}));
      opts[q.id] = relabeled;
      const contentToNewLabel = {};
      relabeled.forEach(item => { contentToNewLabel[item.t] = item.l; });
      newAnswers[q.id] = q.a.map(oldL => {
        const oldItem = q.o.find(o => o.l === oldL);
        return oldItem ? contentToNewLabel[oldItem.t] : oldL;
      });
    }
  });
  return { opts, newAnswers };
}

function getStats() {
  const answers = getAnswers();
  const wrong = getWrong();
  const totalCorrect = answers.filter(a=>a.ok).length;
  const totalAnswered = answers.length;
  const acc = totalAnswered ? Math.round(totalCorrect/totalAnswered*100) : 0;
  const doneIds = [...new Set(answers.map(a=>a.id))];
  const completion = Math.round(doneIds.length/QUESTIONS.length*100);
  const domainStats = {};
  for(const d of DOMAIN_KEYS) {
    const dQIds = QUESTIONS.filter(q=>q.d===d).map(q=>q.id);
    const dAnswers = answers.filter(a=>dQIds.includes(a.id));
    const dCorrect = dAnswers.filter(a=>a.ok).length;
    const dTotal = dAnswers.length;
    domainStats[d] = {
      total:dQIds.length, answered:dTotal, correct:dCorrect,
      acc: dTotal ? Math.round(dCorrect/dTotal*100) : 0
    };
  }
  const typeStats = {};
  for(const t of ['single','multiple']) {
    const tQIds = QUESTIONS.filter(q=>q.t===t).map(q=>q.id);
    const tAnswers = answers.filter(a=>tQIds.includes(a.id));
    const tCorrect = tAnswers.filter(a=>a.ok).length;
    const tTotal = tAnswers.length;
    typeStats[t] = { answered:tTotal, correct:tCorrect, acc: tTotal ? Math.round(tCorrect/tTotal*100) : 0 };
  }
  const recentWrong = wrong.filter(w=>!w.mastered).sort((a,b)=>b.last-a.last).slice(0,5);
  const recent = answers.slice(-20).reverse();
  let streak = 0;
  for(const a of recent) { if(a.ok) streak++; else break; }
  return {totalCorrect,totalAnswered,acc,completion,domainStats,typeStats,recentWrong,streak,doneIds:doneIds.length};
}
