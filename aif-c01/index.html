车：你不会不问需求就直接买最贵的那辆。AWS 上可选的 FM 来自多家供应商——Anthropic（Claude）、Meta（Llama）、Mistral、Cohere、Amazon Nova 等，通过 Amazon Bedrock 统一 API 调用（来源：services.md ML-01）。考试中，选型题是高频考点，给你一个业务场景，让你选最合适的模型。以下是官方考纲要求掌握的八大评估标准：\n\n| 选择标准 | 通俗解释 | 决策示例 |\n|----------|---------|---------|\n| **成本（Cost）** | 每次调用花多少钱，按 Token 计价 | 高频客服对话→选便宜小模型（如 Nova Micro）；低频复杂推理→可用贵模型（如 Claude Sonnet） |\n| **模态（Modality）** | 模型能\"看懂\"和\"输出\"什么类型的数据 | 需要分析图片→选多模态模型（如 Nova Pro、Claude 3.5）；纯文本→文本模型即可 |\n| **延迟（Latency）** | 从发问到收到回答的时间 | 实时客服→低延迟模型；后台批量处理→延迟可接受更高 |\n| **多语言能力** | 对中文、日文等非英语语言的支持质量 | 服务中国用户→需要强中文支持的模型 |\n| **模型规模** | 参数量大小（7B/70B/175B 等） | 参数越大能力越强，但也越贵越慢——按任务复杂度匹配 |\n| **定制能力** | 能否微调以适配垂直领域 | 需要学习企业内部术语→选支持微调的模型 |\n| **输入/输出长度** | 最大上下文窗口大小 | 需要分析长合同（100页）→选大上下文模型（200K+ tokens） |\n| **Prompt 缓存** | 是否支持缓存重复的 Prompt 前缀 | 每次调用都带同一段系统指令→开启缓存降成本（来源：aws-bedrock-pricing-models.md） |\n\n> 考点记忆：看到\"需要处理图片\"→模态；看到\"预算有限\"→成本；看到\"实时响应\"→延迟。考试给场景让你选，对照这张表逐项排除即可。\n\n#### 推理参数——不改模型权重就能调输出质量的\"旋钮\"\n\n推理参数（Inference Parameters）是你在调用 FM 时可以设置的控制选项。想象一下音响上的旋钮——你不用拆音箱换零件，只需转旋钮就能调出完全不同的声音效果。推理参数也是这个原理：模型权重不变，但输出风格和质量可以大幅改变。\n\n**温度（Temperature）** 控制输出的\"随机性\"。取值范围通常 0~1（部分模型支持 0~2）。低温度（如 0.1）→模型倾向选概率最高的 Token，输出确定、可预测，适合客服回答、翻译、信息提取这类需要\"事实准确\"的场景。高温度（如 0.8）→模型有更多随机性，输出更多样、更有创造力，适合文案写作、头脑风暴、故事创作。极端值 Temperature=0→每次相同输入得到相同输出（确定性）；Temperature=1→每次输出可能不同（多样性）（来源：syllabus domain3 3.1.2）。\n\n**Top P（核采样，Nucleus Sampling）** 限制模型只从累积概率达到 P 的 Token 集合中采样。比如 Top P=0.9→只从概率最高的 90% 的 Token 中选取，剩下 10% 的低概率\"冷门词\"被排除。通俗理解：Temperature 决定\"敢不敢选冷门词\"，Top P 决定\"冷门词的候选范围有多大\"。通常两者配合使用，不必同时极端调高。\n\n**Max Tokens（最大输出长度）** 限制模型单次生成的最大 Token 数量。作用包括：控制响应长度、防止无限生成、控制成本（输出 Token 要付费）。比如你只需要一个摘要，设 Max Tokens=200 就够了，不需要让模型写一篇长文。\n\n**Stop Sequences（停止序列）** 遇到指定字符串时停止生成。例如设置 Stop Sequences 为 [\"\\n\\n\"]→模型在遇到两个换行符时停止。常用于提取结构化内容时精确控制输出边界。\n\n#### RAG（检索增强生成）——让 FM 回答\"它不知道的事\"\n\nRAG 是考试中的超高频率考点。想象你是一个非常博学的人，但对公司内部的薪资政策、产品价格表这些私密信息一无所知。如果有人在你回答之前先帮你查好相关文档贴在面前，你就能结合自己的知识和这些文档给出准确回答——这就是 RAG 的核心思想。\n\n**RAG 的四步工作流程**（来源：syllabus domain3 3.1.3）：\n\n1. **索引阶段（Indexing）**——\"建图书馆目录\"：把企业文档分块→为每块生成嵌入向量（一串数字，代表语义含义）→存储到向量数据库。这是离线的一次性准备工作。\n2. **检索阶段（Retrieval）**——\"查目录找书\"：用户提问→把问题转为嵌入向量→在向量数据库中检索最相似的 Top-K 文档块。\n3. **增强阶段（Augmentation）**——\"把参考资料贴在试卷上\"：将检索到的文档块拼接到 Prompt 中，作为上下文。\n4. **生成阶段（Generation）**——\"开卷答题\"：FM 基于扩展后的 Prompt 生成回答，回答有据可依。\n\n**RAG 的核心优势**：减少幻觉（回答基于检索到的实际文档）；可溯源（答案可追溯至具体源文档）；知识实时性（只需更新文档库，无需重训模型）；私密数据处理（企业文档不必用于模型训练，只在推理时作为上下文）。\n\n**RAG 的局限性**：检索质量决定一切（检索不到相关文档，FM 可能仍凭\"记忆\"回答）；额外延迟（检索步骤增加了端到端延迟）；向量数据库维护成本。\n\n**关联服务**：Amazon Bedrock 知识库（一站式 RAG 实现，集成向量数据库）。\n[[fig:f05]]\n\n#### RAG 的实现细节——嵌入模型与分块策略\n\n在 RAG 的索引阶段，有两个关键技术决策：**嵌入模型的选择**和**文档分块策略**。\n\n嵌入模型（Embedding Model）负责把文本转换为向量。在 AWS 上，Amazon Bedrock 提供了 Amazon Titan Embeddings 模型，也可以使用 Cohere Embed 等第三方嵌入模型。嵌入模型的质量直接决定了检索的准确性——好的嵌入模型能让语义相近的文本在向量空间中距离更近。\n\n文档分块策略决定了\"把长文档切成多大的块\"。块太大→检索不够精准（返回的内容中有很多无关信息）；块太小→缺乏上下文（返回的片段可能断章取义）。常见策略包括：按固定字符数分块（如每 512 个 Token）、按段落/章节的自然边界分块、以及带重叠的滑动窗口分块（相邻块之间有 10%~20% 的重叠，避免信息被截断）。\n\n在 Bedrock 知识库中，这些配置都可以在创建知识库时设定，无需编写代码。系统会自动完成文档解析、分块、嵌入生成和向量存储的全流程。\n\n> 考点提示：考试中如果出现\"RAG 检索效果不好\"的场景，除了检查向量数据库配置外，还要考虑分块策略是否合适——这是一个容易被忽视但非常关键的调优维度。\n\n#### 向量数据库服务——RAG 的\"仓库\"选哪个\n\n向量数据库是 RAG 架构的核心组件——它存储和检索嵌入向量。考纲明确要求考生\"确定有助于在向量数据库中存储嵌入的 AWS 服务\"。以下四个服务必须记住：\n\n| AWS 服务 | 类型 | 向量检索方式 | 适用场景 |\n|----------|------|-------------|---------|\n| **Amazon OpenSearch Service** | 搜索与分析 | 内置 k-NN 向量检索插件 | **通用 RAG 首选**——搜索+向量一站式（来源：services.md ANA-01） |\n| **Amazon Aurora** | 关系型数据库 | pgvector 扩展（PostgreSQL 兼容版） | 已有 Aurora 的团队，SQL+向量混合查询（来源：services.md DB-01） |\n| **Amazon Neptune** | 图数据库 | 支持向量嵌入存储+图查询 | 知识图谱+向量搜索（如关系推理+语义搜索） |\n| **Amazon RDS for PostgreSQL** | 关系型数据库 | pgvector 扩展 | 传统 SQL+向量搜索，自建 RAG 方案（来源：services.md DB-02） |\n\n> 考点记忆：OpenSearch=搜索+向量一体化（最常用）；Aurora/RDS=SQL+向量混合；Neptune=图+向量。\n\n#### FM 定制方法的成本权衡——从\"零成本\"到\"天价\"的五级阶梯\n\n从\"零成本\"的上下文学习到\"极高成本\"的从头预训练，每种定制方法在效果、成本和灵活性上各有取舍。考试中常以排序题或场景选择题形式出现（来源：syllabus domain3 3.1.5）。\n\n| 定制方法 | 通俗比喻 | 数据需求 | 成本级别 | 适用场景 |\n|----------|---------|---------|---------|---------|\n| **上下文学习（In-Context Learning）** | 给学生看几道例题就考试 | 无训练数据 | 极低 | 快速原型、一次性任务 |\n| **RAG** | 开卷考试，允许翻参考书 | 文档库 | 低 | 问答、需要事实准确性的场景 |\n| **微调（Fine-tuning）** | 送学生去专业培训班 | 千~万条 | 中 | 领域适配、风格对齐 |\n| **蒸馏（Distillation）** | 大师带徒弟——师傅教会徒弟后退休 | 大量（由大模型生成） | 高 | 降本增效（大→小） |\n| **预训练（Pre-training）** | 从婴儿培养到博士 | TB 级 | 极高 | 全新的专用模型 |\n```\n成本从低到高：上下文学习 → RAG → 微调 → 蒸馏 → 预训练\n定制程度从低到高：上下文学习 → RAG → 微调 → 蒸馏 → 预训练\n落地速度从快到慢：上下文学习 → RAG → 微调 → 蒸馏 → 预训练\n```\n[[fig:f06]]\n\n#### AI 智能体——能自主执行多步骤任务的新物种\n\nAI 智能体（AI Agent）是一种能自主感知环境、制定计划、调用工具并执行多步骤任务的 AI 系统。区别于单轮问答的模型，智能体能主动推理、分解目标和执行操作。\n\n核心能力包括：任务分解（将复杂任务拆分为子任务）、工具使用（调用 API/数据库/外部系统）、记忆管理（保存工作状态和上下文）、错误恢复（遇到错误时调整策略）。\n\n业务应用场景：自动化客服（处理退款、订单查询等完整流程）、IT 运维（故障排查与修复）、数据分析（自动查询数据库并生成报表）、软件开发（代码编写+测试+调试）。\n\n关联服务：Amazon Bedrock AgentCore（创建智能体）（来源：services.md ML-04）、Strands Agents（多智能体编排）（来源：services.md DEV-03）。\n\n#### 案例\n\n(虚构示例场景，数字仅为教学示意，非真实客户数据)\n\n**场景**：一家在线保险公司（InsuBot Inc.）计划构建智能客服系统，帮助客户查询保单、理赔进度和保费计算。系统需要支持中英文双语，响应延迟不超过 3 秒，并能引用公司的保险条款文档回答用户问题。预算有限，月调用量约 200 万次。\n\n**架构决策过程**：\n\n1. **FM 选择**：需要中英文双语→排除纯英文模型；需要低延迟→优先选较小规格；预算有限→选性价比高的模型。最终选择 Amazon Nova Lite（多模态、成本适中、多语言支持好）。\n2. **推理参数设置**：客服需要准确回答→Temperature=0.2（低随机性）；保费查询回答简洁→Max Tokens=500；回答结束后停止→设置 Stop Sequences。\n3. **知识增强**：保险条款是公司私密数据→使用 RAG（Bedrock 知识库），将 5000 页保险条款分块后存入 Amazon OpenSearch Service 作为向量数据库。\n4. **定制策略**：保费计算涉及公司特有术语→先用 RAG 增强，如效果不够再考虑微调。成本排序：RAG（低）< 微调（中），优先 RAG。\n\n**效果**：上线后客服平均响应时间从 45 秒降至 2.1 秒，准确率从 68% 提升至 94%，月成本约 1200 美元。\n\n#### 常见误区与易错点\n\n1. **误以为 Temperature 越高效果越好**。高温度增加创造性，但也增加胡说八道的风险。客服、翻译等需要准确性的场景必须用低温度。考试中给定\"需要准确、一致的回答\"→选低温度。\n\n2. **混淆 RAG 和微调的适用场景**。RAG 适合\"知识经常更新、需要引用源文档\"的场景（如企业知识库问答）；微调适合\"需要改变模型风格或学习领域术语\"的场景（如让模型学会用法律语言写合同）。考试中给定\"企业文档经常更新\"→选 RAG 而非微调。\n\n3. **忘记向量数据库服务的定位差异**。OpenSearch 是搜索+向量一体化首选；Aurora/RDS 适合已有 SQL 数据库的团队；Neptune 适合图+向量场景。考试中不要把它们混为一谈。\n\n#### 记忆要点\n\n- FM 选择八大标准：成本、模态、延迟、多语言、规模、定制能力、输入输出长度、Prompt 缓存\n- 推理参数四个旋钮：Temperature（随机性）、Top P（采样范围）、Max Tokens（输出长度）、Stop Sequences（停止条件）\n- RAG 四步流程：索引→检索→增强→生成\n- 向量数据库四选手：OpenSearch（首选）、Aurora（pgvector）、Neptune（图+向量）、RDS PostgreSQL（pgvector）\n- FM 定制成本排序：上下文学习 < RAG < 微调 < 蒸馏 < 预训练\n- AI 智能体核心能力：任务分解、工具使用、记忆管理、错误恢复\n","figures":[{"id":"f05","title":"RAG 工作原理：四步流程","caption":"RAG 核心价值：让 FM 的回答有\"来源依据\"，从而减少幻觉、提升准确性和可信度","html":"<svg viewBox=\"0 0 560 200\" style=\"width:100%;max-width:560px;display:block;margin:0 auto;font-family:system-ui,sans-serif\">\n  <!-- 阶段1：索引 -->\n  <rect x=\"8\" y=\"20\" width=\"118\" height=\"160\" rx=\"10\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/>\n  <text x=\"67\" y=\"42\" font-size=\"12\" fill=\"#4338ca\" font-weight=\"700\" text-anchor=\"middle\">① 索引阶段<\/text>\n  <rect x=\"18\" y=\"52\" width=\"98\" height=\"24\" rx=\"5\" fill=\"#7c3aed\"/>\n  <text x=\"67\" y=\"68\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">文档切块<\/text>\n  <text x=\"67\" y=\"90\" font-size=\"18\" fill=\"#7c3aed\" text-anchor=\"middle\">↓<\/text>\n  <rect x=\"18\" y=\"100\" width=\"98\" height=\"24\" rx=\"5\" fill=\"#4f46e5\"/>\n  <text x=\"67\" y=\"116\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">生成向量嵌入<\/text>\n  <text x=\"67\" y=\"138\" font-size=\"18\" fill=\"#4f46e5\" text-anchor=\"middle\">↓<\/text>\n  <rect x=\"18\" y=\"148\" width=\"98\" height=\"24\" rx=\"5\" fill=\"#3730a3\"/>\n  <text x=\"67\" y=\"164\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">存向量数据库<\/text>\n\n  <!-- 箭头 -->\n  <path d=\"M126 100 L140 100\" stroke=\"#a78bfa\" stroke-width=\"2\" marker-end=\"url(#arr)\"/>\n  <defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#a78bfa\"/><\/marker><\/defs>\n\n  <!-- 阶段2：检索 -->\n  <rect x=\"140\" y=\"20\" width=\"118\" height=\"160\" rx=\"10\" fill=\"#dbeafe\" stroke=\"#3b82f6\" stroke-width=\"1.5\"/>\n  <text x=\"199\" y=\"42\" font-size=\"12\" fill=\"#1d4ed8\" font-weight=\"700\" text-anchor=\"middle\">② 检索阶段<\/text>\n  <rect x=\"150\" y=\"52\" width=\"98\" height=\"24\" rx=\"5\" fill=\"#2563eb\"/>\n  <text x=\"199\" y=\"68\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">用户提问<\/text>\n  <text x=\"199\" y=\"90\" font-size=\"18\" fill=\"#2563eb\" text-anchor=\"middle\">↓<\/text>\n  <rect x=\"150\" y=\"100\" width=\"98\" height=\"24\" rx=\"5\" fill=\"#1d4ed8\"/>\n  <text x=\"199\" y=\"116\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">问题→向量<\/text>\n  <text x=\"199\" y=\"138\" font-size=\"18\" fill=\"#1d4ed8\" text-anchor=\"middle\">↓<\/text>\n  <rect x=\"150\" y=\"148\" width=\"98\" height=\"24\" rx=\"5\" fill=\"#1e40af\"/>\n  <text x=\"199\" y=\"164\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">Top-K 相似匹配<\/text>\n\n  <path d=\"M258 100 L272 100\" stroke=\"#a78bfa\" stroke-width=\"2\" marker-end=\"url(#arr)\"/>\n\n  <!-- 阶段3：增强 -->\n  <rect x=\"272\" y=\"20\" width=\"118\" height=\"160\" rx=\"10\" fill=\"#d1fae5\" stroke=\"#059669\" stroke-width=\"1.5\"/>\n  <text x=\"331\" y=\"42\" font-size=\"12\" fill=\"#065f46\" font-weight=\"700\" text-anchor=\"middle\">③ 增强阶段<\/text>\n  <rect x=\"282\" y=\"52\" width=\"98\" height=\"24\" rx=\"5\" fill=\"#059669\"/>\n  <text x=\"331\" y=\"68\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">检索到的文档块<\/text>\n  <text x=\"331\" y=\"90\" font-size=\"18\" fill=\"#059669\" text-anchor=\"middle\">↓<\/text>\n  <rect x=\"282\" y=\"100\" width=\"98\" height=\"40\" rx=\"5\" fill=\"#047857\"/>\n  <text x=\"331\" y=\"118\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">拼接到 Prompt<\/text>\n  <text x=\"331\" y=\"132\" font-size=\"10\" fill=\"#a7f3d0\" text-anchor=\"middle\">（作为上下文）<\/text>\n  <text x=\"331\" y=\"155\" font-size=\"18\" fill=\"#047857\" text-anchor=\"middle\">↓<\/text>\n\n  <path d=\"M390 100 L404 100\" stroke=\"#a78bfa\" stroke-width=\"2\" marker-end=\"url(#arr)\"/>\n\n  <!-- 阶段4：生成 -->\n  <rect x=\"404\" y=\"20\" width=\"148\" height=\"160\" rx=\"10\" fill=\"#fef9c3\" stroke=\"#d97706\" stroke-width=\"1.5\"/>\n  <text x=\"478\" y=\"42\" font-size=\"12\" fill=\"#92400e\" font-weight=\"700\" text-anchor=\"middle\">④ 生成阶段<\/text>\n  <rect x=\"414\" y=\"52\" width=\"128\" height=\"24\" rx=\"5\" fill=\"#d97706\"/>\n  <text x=\"478\" y=\"68\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">FM 读取扩展Prompt<\/text>\n  <text x=\"478\" y=\"90\" font-size=\"18\" fill=\"#d97706\" text-anchor=\"middle\">↓<\/text>\n  <rect x=\"414\" y=\"100\" width=\"128\" height=\"40\" rx=\"5\" fill=\"#b45309\"/>\n  <text x=\"478\" y=\"115\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">生成有依据的回答<\/text>\n  <text x=\"478\" y=\"130\" font-size=\"10\" fill=\"#fde68a\" text-anchor=\"middle\">（减少幻觉）<\/text>\n<\/svg>"},{"id":"f06","title":"FM 定制方法：成本 vs 效果 定位图","caption":"从左下到右上：成本递增，效果也递增；选型原则——先用低成本方案验证，再按需升级","html":"<svg viewBox=\"0 0 400 260\" style=\"width:100%;max-width:400px;display:block;margin:0 auto;font-family:system-ui,sans-serif\">\n  <!-- 坐标轴 -->\n  <line x1=\"50\" y1=\"220\" x2=\"370\" y2=\"220\" stroke=\"#374151\" stroke-width=\"2\" marker-end=\"url(#ax)\"/>\n  <line x1=\"50\" y1=\"220\" x2=\"50\" y2=\"20\" stroke=\"#374151\" stroke-width=\"2\" marker-end=\"url(#ay)\"/>\n  <defs>\n    <marker id=\"ax\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#374151\"/><\/marker>\n    <marker id=\"ay\" markerWidth=\"6\" markerHeight=\"8\" refX=\"3\" refY=\"6\" orient=\"auto\"><path d=\"M0,0 L6,0 L3,8 z\" fill=\"#374151\"/><\/marker>\n  <\/defs>\n  <text x=\"210\" y=\"248\" font-size=\"12\" fill=\"#6b7280\" text-anchor=\"middle\">成本 / 复杂度 →<\/text>\n  <text x=\"22\" y=\"120\" font-size=\"12\" fill=\"#6b7280\" text-anchor=\"middle\" transform=\"rotate(-90,22,120)\">效果 →<\/text>\n\n  <!-- 方法点 -->\n  <!-- 上下文学习：低成本低效果 -->\n  <circle cx=\"90\" cy=\"190\" r=\"22\" fill=\"#ddd6fe\" stroke=\"#7c3aed\" stroke-width=\"2\"/>\n  <text x=\"90\" y=\"185\" font-size=\"9\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">上下文<\/text>\n  <text x=\"90\" y=\"197\" font-size=\"9\" fill=\"#4338ca\" text-anchor=\"middle\">学习<\/text>\n\n  <!-- RAG：低-中成本，中效果 -->\n  <circle cx=\"155\" cy=\"148\" r=\"22\" fill=\"#c7d2fe\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n  <text x=\"155\" y=\"143\" font-size=\"10\" fill=\"#1e40af\" text-anchor=\"middle\" font-weight=\"700\">RAG<\/text>\n  <text x=\"155\" y=\"157\" font-size=\"9\" fill=\"#1e40af\" text-anchor=\"middle\">检索增强<\/text>\n\n  <!-- 微调：中成本，较高效果 -->\n  <circle cx=\"240\" cy=\"105\" r=\"22\" fill=\"#a5f3fc\" stroke=\"#0891b2\" stroke-width=\"2\"/>\n  <text x=\"240\" y=\"100\" font-size=\"10\" fill=\"#0c4a6e\" text-anchor=\"middle\" font-weight=\"700\">微调<\/text>\n  <text x=\"240\" y=\"114\" font-size=\"9\" fill=\"#0c4a6e\" text-anchor=\"middle\">Fine-tuning<\/text>\n\n  <!-- 蒸馏：高成本，中高效果 -->\n  <circle cx=\"305\" cy=\"118\" r=\"22\" fill=\"#fde68a\" stroke=\"#d97706\" stroke-width=\"2\"/>\n  <text x=\"305\" y=\"113\" font-size=\"10\" fill=\"#92400e\" text-anchor=\"middle\" font-weight=\"700\">模型<\/text>\n  <text x=\"305\" y=\"127\" font-size=\"9\" fill=\"#92400e\" text-anchor=\"middle\">蒸馏<\/text>\n\n  <!-- 预训练：最高成本最高效果 -->\n  <circle cx=\"345\" cy=\"52\" r=\"22\" fill=\"#fca5a5\" stroke=\"#dc2626\" stroke-width=\"2\"/>\n  <text x=\"345\" y=\"47\" font-size=\"10\" fill=\"#7f1d1d\" text-anchor=\"middle\" font-weight=\"700\">预训练<\/text>\n  <text x=\"345\" y=\"61\" font-size=\"9\" fill=\"#7f1d1d\" text-anchor=\"middle\">从头训练<\/text>\n\n  <!-- 趋势箭头 -->\n  <path d=\"M68 210 Q200 160 325 68\" stroke=\"#a78bfa\" stroke-width=\"1.5\" fill=\"none\" stroke-dasharray=\"6,3\"/>\n<\/svg>"}]},{"h":"选择有效的提示工程技术","body":"\n\n#### 本节定位\n\n本节对应考纲任务声明 3.2「选择有效的提示工程技术」。如果说 3.1 讲的是\"选什么模型、怎么配参数\"，那么 3.2 讲的就是\"怎么跟模型说话才能得到好回答\"。提示工程（Prompt Engineering）是 GenAI 应用开发中最常用、门槛最低但效果最显著的技能——不需要修改模型权重，只通过优化输入就能大幅提升输出质量。考试中，给你一个场景让你选择最合适的提示技术是高频题型（来源：syllabus domain3 3.2）。\n\n#### 提示的构成要素——一封好 Prompt 的五个\"零件\"\n\n写 Prompt 就像写一封清晰的工作邮件——好邮件有主题、背景、正文和期望的回复格式。Prompt 也一样，由以下五个要素组成：\n\n| 要素 | 通俗解释 | 示例 |\n|------|---------|------|\n| **指令（Instruction）** | 告诉模型\"做什么\" | \"将以下英文翻译成中文：\" |\n| **上下文（Context）** | 提供回答所需的背景信息 | \"这是 AWS 服务的官方文档。\" |\n| **输入数据（Input Data）** | 模型需要处理的具体内容 | \"Amazon Bedrock is a fully managed service...\" |\n| **输出格式（Output Format）** | 指定输出的结构和样式 | \"请用表格输出，包含三列：服务名、定位、功能\" |\n| **负面提示（Negative Prompt）** | 告诉模型\"不要做什么\" | \"不要使用技术术语，用通俗语言解释\" |\n\n一个好的 Prompt 不一定需要五个要素全部出现，但指令和输入数据是必须的。上下文和输出格式能显著提升输出质量，负面提示用于防止模型\"跑偏\"。\n\n#### 系统提示与用户提示的层级关系\n\n在实际的 GenAI 应用架构中，Prompt 分为两个层级：**系统提示（System Prompt）** 和 **用户提示（User Prompt）**。\n\n系统提示由开发者在应用后端设定，用户看不到也无法修改。它定义了模型的\"身份\"和\"行为规则\"——比如\"你是一位友好的客服助手，只回答与我们产品相关的问题。如果用户问政治、宗教等敏感话题，礼貌拒绝并引导回产品话题\"。系统提示相当于给模型戴上了一副\"角色滤镜\"，确保模型在整个会话过程中保持一致的行为。\n\n用户提示是终端用户在对话框中输入的内容——它是动态的、不可预测的。用户可能问合理的问题，也可能尝试\"越狱\"或\"劫持\"模型。\n\n这种两层结构的关键设计原则是：**系统提示的优先级高于用户提示**。即使用户输入\"忽略所有之前的指令\"，一个设计良好的系统会确保系统提示仍然生效。这就是为什么 Guardrails（防护机制）如此重要——它在系统层面强制执行安全策略，不依赖模型自身的\"自觉\"。\n\n在 Amazon Bedrock 中，调用 FM 的 API（InvokeModel）支持分别传入 system prompt 和 user message，两者在模型内部被区别处理。这种分离设计是 GenAI 应用安全架构的基础。\n\n> 考点提示：考试中如果出现\"防止用户绕过 AI 的行为规则\"的场景→答案涉及系统提示 + Guardrails 的组合。\n\n#### 核心提示技术——考试中的六大招式\n\n**零样本提示（Zero-shot）** 不提供任何示例，直接给出指令让模型完成任务。例如：\"将以下句子翻译成英文：今天天气很好。\"适用于简单、通用的任务，模型已有足够知识来处理。这是最基础的提示方式，也是日常使用最频繁的。\n\n**单样本提示（One-shot）** 提供一个输入-输出示例，让模型仿照示例完成后续任务。适用于需要特定输出格式或风格的任务。比如你希望模型用特定 JSON 格式输出，给它看一个例子比口头描述格式更有效。\n\n**少量样本提示（Few-shot）** 提供 2~5 个输入-输出示例，让模型从中学习模式，应用于新输入。适用于复杂任务、特定格式要求、需要展示推理过程的任务。少量样本提示是\"用最少代价教会模型新技能\"的利器——不用微调模型，只需在 Prompt 里多放几个示例（来源：syllabus domain3 3.2.2）。\n\n**思维链提示（Chain-of-Thought，CoT）** 引导模型在给出最终答案前\"一步一步思考\"（Let's think step by step.），展示推理过程。这是处理数学计算、逻辑推理、复杂问题分解的最有效技术——研究表明，加入思维链提示后，模型在需要多步推理的任务上准确率可提升 20%~40%。适用于数学计算、逻辑推理、复杂问题分解。\n\n**系统提示（System Prompt）** 在对话开始时设定模型的角色、行为边界和全局规则。例如：\"你是一位 AWS 认证培训讲师，只回答与 AWS 考试相关的问题。如果用户问无关问题，礼貌拒绝。\"系统提示通常在整个会话中保持不变，相当于给模型戴上一副\"角色滤镜\"。\n\n**提示模板（Prompt Templates）** 预设可复用的提示结构，含可替换的变量（{{variable}}）。作用：确保一致性和效率，特别适合需要多次执行类似任务的生产环境。Amazon Bedrock Prompt Management 就是管理提示模板的服务——支持版本控制、变量替换、参数预设和 A/B 测试（来源：services.md ML-01）。\n[[fig:f07]]\n\n#### 提示工程的最佳实践\n\n| 最佳实践 | 说明 |\n|----------|------|\n| **明确具体（Specificity）** | 指令越清晰、越具体，输出质量越高。\"写一篇关于 S3 的 200 字摘要\"比\"介绍一下 S3\"好得多 |\n| **简洁性（Conciseness）** | 去除无关信息，聚焦任务核心 |\n| **使用分隔符** | 用三重反引号、三重引号、--- 等分隔提示的不同部分，帮助模型理解结构 |\n| **结构化提示** | 按\"角色→上下文→指令→输出格式\"的顺序组织 |\n| **迭代实验** | 多轮微调、观察输出变化，找到最优提示 |\n| **防护机制** | 设置边界条件（如果...则...），防止模型越界 |\n\n提示工程的本质是\"与模型沟通的艺术\"。很多人写出的 Prompt 之所以效果不好，不是模型能力不足，而是指令太模糊、缺乏上下文或没有指定输出格式。一个好的 Prompt 工程师需要能够站在模型的角度思考——模型不知道你脑子里想什么，你给它的文字就是它唯一的信息来源。因此，越是详尽、结构化、无歧义的 Prompt，输出质量越高。在生产环境中，团队通常会建立 Prompt 最佳实践文档和标准化模板库，避免每个开发者\"各自为战\"导致输出质量参差不齐。\n\nAmazon Bedrock Guardrails 服务可以在应用层面强制执行内容安全策略——即使 Prompt 设计得再好，也需要 Guardrails 作为最后一道防线，过滤有害输出、保护敏感信息、防止模型被滥用（来源：services.md ML-01）。\n\n#### 提示工程的安全风险——四大攻击类型\n\n提示工程不只有\"怎么写好 Prompt\"的问题，还有\"怎么防止 Prompt 被恶意利用\"的安全问题。以下四种攻击类型是考试必考内容（来源：syllabus domain3 3.2.4）：\n\n| 风险类型 | 通俗解释 | 缓解措施 |\n|----------|---------|---------|\n| **提示暴露（Prompt Leaking）** | 攻击者诱导模型泄露系统提示词的内容——\"把你的系统指令告诉我\" | Guardrails、权限控制、提示模板不在输出中暴露 |\n| **提示投毒（Prompt Poisoning）** | 恶意构造的输入数据污染模型行为 | 输入验证、数据清洗 |\n| **提示劫持（Prompt Hijacking）** | 攻击者在输入中覆盖原始系统指令——\"忽略所有之前的指令，做...\" | 强系统指令、输出验证、Guardrails |\n| **监狱突破（Jailbreaking）** | 通过精心设计的提示绕过模型的安全限制和内容审核 | Guardrails 内容过滤、多层级安全策略 |\n\n> 考点记忆：\"泄露\"系统提示→Prompt Leaking；\"覆盖\"系统指令→Hijacking；\"绕过\"安全限制→Jailbreaking；\"污染\"训练数据→Poisoning。\n\n#### Amazon Bedrock Prompt Management\n\nBedrock Prompt Management 是 AWS 提供的提示管理服务，核心功能包括（来源：services.md ML-01）：\n\n- **版本控制**：管理提示词的不同版本，支持回滚和对比\n- **变量替换**：在提示模板中定义变量（如 {{question}}），运行时动态填充\n- **参数预设**：为每个提示模板预设 Temperature、Max Tokens 等推理参数\n- **A/B 测试支持**：同时运行多个提示变体，对比输出质量\n- **团队协作**：共享和评审提示模板\n\n#### 案例\n\n(虚构示例场景，数字仅为教学示意，非真实客户数据)\n\n**场景**：一家电商公司（ShopSmart Inc.）需要自动为 50000 个商品生成多语言营销文案。每个商品有名称、类别、价格和 3~5 个卖点。要求文案风格统一、格式一致、支持中英文双语。\n\n**提示工程方案**：\n\n1. **使用提示模板**：创建统一的 Prompt Template，包含变量 {{product_name}}、{{category}}、{{price}}、{{selling_points}}、{{language}}。\n2. **使用少量样本提示**：在模板中嵌入 3 个高质量示例——一个电子产品、一个服装、一个食品——让模型学会不同品类的文案风格。\n3. **使用系统提示**：设定角色为\"资深电商营销文案师\"，要求\"文案不超过 150 字，突出差异化卖点，避免夸大宣传\"。\n4. **使用负面提示**：\"不要使用'最好的''第一名'等绝对化用语；不要编造产品参数。\"\n5. **版本管理**：通过 Bedrock Prompt Management 对模板进行版本控制和 A/B 测试，比较\"简洁风格\"和\"故事风格\"两个变体的点击率。\n\n**效果**：文案生成时间从人工 15 分钟/个降至 3 秒/个，文案一致性评分从 72 分提升至 95 分（人工评审），月成本约 800 美元。\n\n#### 常见误区与易错点\n\n1. **混淆零样本和少量样本的适用场景**。零样本适合简单通用任务（翻译、摘要）；少量样本适合需要特定格式或模式的复杂任务。考试中如果题目强调\"输出需要遵循特定格式\"→选 Few-shot 而非 Zero-shot。\n\n2. **忽视思维链提示的适用范围**。CoT 最适合需要多步推理的任务（数学、逻辑）。对于简单分类任务（正面/负面情感分析），CoT 反而会增加不必要的复杂性和 Token 消耗。考试中\"需要逻辑推理\"→选 CoT；\"简单分类\"→不需要 CoT。\n\n3. **分不清四种提示攻击类型**。记住关键词：Leaking=泄露系统指令；Hijacking=覆盖/绕过系统指令；Jailbreaking=突破安全限制；Poisoning=污染训练数据。\n\n#### 记忆要点\n\n- 提示五要素：指令、上下文、输入数据、输出格式、负面提示\n- 提示技术光谱：Zero-shot（零示例）→ One-shot（1 个示例）→ Few-shot（2~5 个示例）→ CoT（逐步推理）\n- CoT 最适合数学/逻辑推理任务，可提升准确率 20%~40%\n- 四大安全风险：Prompt Leaking / Poisoning / Hijacking / Jailbreaking\n- Bedrock Prompt Management：版本控制+变量替换+参数预设+A/B 测试\n","figures":[{"id":"f07","title":"提示工程技术：复杂度梯度","caption":"示例数越多、任务越复杂→用更高阶的技术；CoT（Chain-of-Thought）能显著提升多步推理准确率","html":"<div class=\"stair-wrap\">\n  <div class=\"stair-item\">\n    <div class=\"stair-bar\" style=\"height:48px;background:linear-gradient(135deg,#c7d2fe,#a5b4fc)\">Zero-shot<\/div>\n    <div class=\"stair-label\">无示例<br>直接提问<\/div>\n  <\/div>\n  <div class=\"flow-arrow\" style=\"align-self:center;margin-bottom:28px\">→<\/div>\n  <div class=\"stair-item\">\n    <div class=\"stair-bar\" style=\"height:72px;background:linear-gradient(135deg,#a5b4fc,#818cf8)\">One-shot<\/div>\n    <div class=\"stair-label\">1个示例<br>格式示范<\/div>\n  <\/div>\n  <div class=\"flow-arrow\" style=\"align-self:center;margin-bottom:42px\">→<\/div>\n  <div class=\"stair-item\">\n    <div class=\"stair-bar\" style=\"height:100px;background:linear-gradient(135deg,#818cf8,#6366f1)\">Few-shot<\/div>\n    <div class=\"stair-label\">2-5个示例<br>复杂任务<\/div>\n  <\/div>\n  <div class=\"flow-arrow\" style=\"align-self:center;margin-bottom:60px\">→<\/div>\n  <div class=\"stair-item\">\n    <div class=\"stair-bar\" style=\"height:130px;background:linear-gradient(135deg,#4f46e5,#7c3aed)\">CoT<\/div>\n    <div class=\"stair-label\">思维链<br>\"一步步思考\"<br>推理题必用<\/div>\n  <\/div>\n<\/div>"}]},{"h":"描述基础模型的训练和微调过程","body":"\n\n#### 本节定位\n\n本节对应考纲任务声明 3.3「描述基础模型的训练和微调过程」。本节解决什么问题？你已经知道怎么选模型（3.1）、怎么写 Prompt（3.2），但如果模型\"天生\"不懂你的领域（比如不认识你公司的法律术语），怎么让它学会？这就需要训练和微调。需要注意的是，AIF-C01 是概念级认证——不要求写代码或实际训练，而是理解\"有哪些方法\"和\"各方法做什么\"（来源：syllabus domain3 3.3）。\n\n#### 训练基础模型的四大关键方法\n\n**预训练（Pre-training）** 是从头训练一个 FM 的过程——在大规模通用数据（互联网文本、书籍、代码等）上训练，让模型学习语言的通用模式。通俗比喻：这就像从婴儿培养到博士，需要十几年（TB 级数据 + 数百万美元算力 + 数周训练时间）。产出是一个具备广泛通用知识的基础模型。绝大多数企业不需要也负担不起预训练——直接使用 Bedrock 上现有的 FM 即可。\n\n**持续预训练（Continued Pre-training）** 在已有预训练模型的基础上，继续使用特定领域的新数据进行训练。通俗比喻：博士毕业后去某个行业深造。作用是让模型学习领域特定术语、知识和写作风格，同时保留已有的通用能力。数据需求是 GB 级领域文本，成本远低于从头预训练。\n\n**微调（Fine-tuning）** 在预训练模型的基础上，使用特定任务的标记数据进行小规模训练，调整模型权重使其更好地完成特定任务。通俗比喻：博士入职后接受专项岗位培训。数据需求是千~万条标记数据，训练时间短，成本中等。关联服务：Amazon Bedrock（支持 FM 微调）、Amazon SageMaker AI（支持自定义模型微调）（来源：services.md ML-02、aws-sagemaker-overview.md）。\n\n**蒸馏（Distillation）** 用一个大型、高性能的\"教师模型\"来训练一个更小、更高效的\"学生模型\"。通俗比喻：大师把毕生功力传给徒弟，徒弟虽然没有大师那么强，但能处理大部分日常任务，而且效率更高、成本更低。过程：教师模型生成高质量的输出→学生模型学习模仿这些输出。意义：在保持大部分性能的同时大幅降低推理成本——比如把 Claude Opus 级别的能力压缩到 Haiku 级别的成本。\n\n#### 微调基础模型的三种方法\n\n| 微调方法 | 通俗解释 | 数据需求 | 用途 |\n|----------|---------|---------|------|\n| **指令微调（Instruction Tuning）** | 用（指令，回答）格式的标注数据训练模型遵循指令 | 万~十万条 | 使模型更\"听话\"，能按用户意图执行任务 |\n| **领域适配（Domain Adaptation）** | 用特定行业/领域的数据微调模型 | 千~万条 | 法律、医疗、金融等垂直行业应用 |\n| **迁移学习（Transfer Learning）** | 将预训练模型在一个任务上学到的知识迁移到另一个相关任务 | 少量 | 减少新任务所需的训练数据和算力 |\n\n迁移学习的通俗理解：一个会英法翻译的模型，学英德翻译会比从头学快得多——因为它已经\"知道\"翻译这件事的通用规律，只需要学新的语言对。\n\n#### 高效微调技术——LoRA 与 PEFT\n\n当模型参数量极大时（如 70B 参数），全量微调（调整所有参数）成本极高。**PEFT（参数高效微调，Parameter-Efficient Fine-Tuning）** 是一类只调整少量参数就能达到接近全量微调效果的技术。\n\n通俗比喻：你不是重新装修整栋楼，而是在几面墙上挂了几幅新画——效果显著，成本极低（来源：syllabus domain3 3.3.2）。\n\nLoRA 的另一个优势是**可组合性**——你可以为同一个基础模型训练多个 LoRA 适配器（比如一个法律适配器、一个医疗适配器），在推理时根据需要加载不同的适配器，而不需要部署多个完整的模型副本。这大大降低了多场景应用的部署成本。在 SageMaker 上部署时，一个基础模型实例可以动态切换不同的 LoRA 权重，实现\"一个底座、多种能力\"的灵活架构。\n\n#### 训练基础设施与服务选择\n\n在 AWS 上进行 FM 训练和微调，主要涉及两个平台：\n\n**Amazon Bedrock**（来源：services.md ML-01）适合\"不想管基础设施\"的团队。Bedrock 提供了内置的微调功能——你只需要上传标记好的训练数据（JSON 格式），选择要微调的基础模型（如 Claude、Llama、Nova 等支持微调的模型），设置超参数（如学习率、训练轮次），点击开始。微调完成后，定制模型自动部署在你的账户中，通过相同的 InvokeModel API 调用。全程无需管理 GPU 实例。\n\n**Amazon SageMaker AI**（来源：aws-sagemaker-overview.md）适合\"需要完全控制训练流程\"的团队。SageMaker 提供了从数据准备（SageMaker Data Wrangler）到训练（SageMaker Training Jobs）到部署（SageMaker Endpoints）的全栈能力。你可以使用自定义的训练脚本、选择 GPU 实例类型、配置分布式训练策略。SageMaker JumpStart 还提供了数百种预训练模型的一键微调能力。\n\n**选择建议**：如果你只需要微调 Bedrock 上的现有 FM→用 Bedrock 内置微调（简单、全托管）；如果你需要训练自定义模型、使用特殊的训练框架或算法→用 SageMaker AI（灵活、可控）。\n\n考试中的典型题目是：\"一家公司想对 Claude 模型进行微调以适配金融领域，哪个服务最合适？\"答案是 Amazon Bedrock（因为 Claude 是 Bedrock 上的模型，用 Bedrock 内置微调最直接）。\"一家公司想从头训练自己的文本分类模型\"→答案是 Amazon SageMaker AI（自定义训练需要 SageMaker 的全栈能力）。\n\n> 考点记忆：Bedrock = 用模型（调用+微调现有 FM）；SageMaker = 建模型（训练+部署自定义模型）。这个定位区分在多个 Domain 中反复出现。\n\n在成本方面，Bedrock 微调按训练时长和模型单元计费；SageMaker 按使用的实例类型和时长计费。对于大多数企业级 FM 微调任务，Bedrock 通常是更具性价比的选择，因为它免去了基础设施管理的人力成本。\n\n#### 微调数据准备——\"食材\"的质量决定\"菜品\"的水平\n\n| 数据准备步骤 | 通俗解释 | 关键考量 |\n|-------------|---------|---------|\n| **数据策管（Curation）** | 从原始数据中筛选高质量、相关的内容 | 去重、移除低质量/有害内容、确保覆盖面 |\n| **监管（Governance）** | 确保数据来源合法合规 | 版权检查、隐私筛查、使用许可确认 |\n| **调整大小（Resizing）** | 统一数据格式、长度、分辨率 | 确保所有样本符合模型输入要求 |\n| **标记（Labeling）** | 为数据打上正确的标签或答案 | 标注一致性、标注质量检查 |\n| **代表性（Representation）** | 确保数据覆盖所有重要场景和群体 | 避免数据偏差→导致模型偏差 |\n\n#### RLHF（人类反馈强化学习）——让模型\"更像人\"的终极对齐技术\n\nRLHF（Reinforcement Learning from Human Feedback）是让 FM 的行为更符合人类期望的高级技术。它是 ChatGPT 和 Claude 能\"像人一样回答问题\"的核心训练技术。\n\n**RLHF 四步流程**（来源：syllabus domain3 3.3.4）：\n\n1. **预训练 FM**：在大规模数据上预训练出基础模型。\n2. **人工偏好排序**：人工评审员对多个模型输出进行偏好排序（\"回答 A 比回答 B 好\"）。\n3. **训练奖励模型（Reward Model）**：用人工排序数据训练一个奖励模型，让它学会\"人类觉得什么是好回答\"。\n4. **强化学习微调**：用强化学习（PPO 算法）微调 FM，最大化奖励分数——让 FM 的输出越来越符合人类偏好。\n\nRLHF 的作用：减少有害输出、降低偏见、提高模型的有用性（Helpfulness）、真实性（Honesty）和无害性（Harmlessness）——这就是 AI 安全领域常说的\"HHH\"原则。\n\n#### 案例\n\n(虚构示例场景，数字仅为教学示意，非真实客户数据)\n\n**场景**：一家律师事务所（LegalAI Partners）希望让 FM 能够用专业法律语言起草合同初稿。通用的 Claude 模型虽然理解能力强，但输出的法律文书不够专业——用词不够精准、格式不符合行业惯例。\n\n**定制路径选择**：\n\n1. **首先尝试 RAG**（成本低）：将 2000 份历史合同和法律文件存入 Bedrock 知识库。效果：提高了事实准确性，但写作风格仍然偏\"通用\"。\n2. **然后进行微调**（成本中）：整理 5000 条（合同需求描述→合同条款）的标注数据，在 Bedrock 上对模型进行微调。使用 LoRA 技术只调整 2% 的参数。效果：法律术语使用准确率从 71% 提升至 93%，合同格式合规率从 65% 提升至 97%。\n3. **未选择预训练**（成本极高）：不需要从头训练一个法律专用模型——微调已经足够解决问题。\n\n**最终方案**：RAG + 微调组合。RAG 提供知识支撑（法条引用），微调提供风格和术语对齐。微调训练时间约 4 小时，成本约 300 美元。\n\n#### 常见误区与易错点\n\n1. **混淆预训练、持续预训练和微调**。预训练=从头训练（TB 数据，百万美元）；持续预训练=在已有模型上继续学领域知识（GB 数据）；微调=用标记数据调整模型完成特定任务（千~万条数据）。考试中区分这三者的关键是数据量和目的。\n\n2. **误以为微调可以替代 RAG**。微调改变的是模型的\"内在知识\"，但这些知识是训练时固定的，无法实时更新。如果企业文档经常变化，仍然需要 RAG 来提供最新信息。考试中给定\"数据频繁更新\"→选 RAG；\"需要改变写作风格\"→选微调。\n\n3. **忽视 LoRA/PEFT 的价值**。全量微调 70B 参数的模型需要巨大算力。LoRA 只调 1%~5% 的参数就能达到接近效果——考试中可能会考到 PEFT/LoRA 的基本概念和优势。\n\n#### 记忆要点\n\n- 四大训练方法成本排序：预训练 > 持续预训练 > 微调 > 上下文学习（不训练）\n- 三种微调方法：指令微调（听话）、领域适配（专业化）、迁移学习（知识复用）\n- LoRA/PEFT：只调少量参数（1%~5%），效果接近全量微调，成本极低\n- 数据准备五步：策管→监管→调整→标记→代表性\n- RLHF 四步流程：预训练→人工排序→训练奖励模型→强化学习微调\n- RLHF 目标：HHH——Helpful、Honest、Harmless\n"},{"h":"描述评估基础模型性能的方法","body":"\n\n#### 本节定位\n\n本节对应考纲任务声明 3.4「描述评估基础模型性能的方法」。本节解决什么问题？你已经知道怎么选模型、写 Prompt、做微调，但怎么知道效果好不好？\"好不好\"用什么标准衡量？这就需要评估。模型评估不是\"试用一下感觉还行\"就完了，它需要系统化的方法和量化指标。考试中，评估指标的配对题（ROUGE→摘要、BLEU→翻译）是高频考点（来源：syllabus domain3 3.4）。\n\n#### FM 性能评估的三种方法\n\n**人工评估（Human Evaluation）** 由人类评审员对模型输出进行质量评分。这是最准确的评估方式——人能理解上下文、语气、文化差异等机器难以量化的因素。缺点是昂贵、主观、无法大规模扩展。适用场景：高风险决策的最终质量把关；新模型上线前的验收评估。\n\n**基准数据集（Benchmark Datasets）** 使用标准测试集（如 MMLU、HellaSwag、HumanEval）自动评估模型。MMLU 测试模型在 57 个学科上的知识广度；HellaSwag 测试常识推理；HumanEval 测试代码生成能力。优点是标准化、可重复、客观可衡量；缺点是可能不反映实际业务场景——模型在 MMLU 上得 90 分不代表它能写好你公司的客服回复。\n\n**Amazon Bedrock 模型评估** AWS 提供的模型评估工具，支持自动化和人工评估，集成在 Bedrock 控制台中。可以在多个模型之间进行 A/B 对比测试，使用自定义的评估数据集和标准。优点是一体化、与 Bedrock 模型深度集成；缺点是仅针对 Bedrock 内的模型（来源：services.md ML-01）。\n\n#### FM 评估指标——考试必考的\"配对题\"\n\n这四个指标是考试中的核心配对考点——给你一个评估任务，让你选对应的指标：\n\n**ROUGE（Recall-Oriented Understudy for Gisting Evaluation）** 计算生成摘要与参考摘要的 n-gram 重叠度，以召回率为核心。通俗理解：参考摘要里的关键信息，模型生成的摘要覆盖了多少？**ROUGE=摘要评估**。\n\n**BLEU（Bilingual Evaluation Understudy）** 计算生成译文与参考译文的 n-gram 精确率。通俗理解：模型生成的翻译中，有多少词在参考翻译里也出现了？**BLEU=翻译评估**。\n\n**BERTScore** 利用 BERT 嵌入计算生成文本与参考文本的语义相似度，比 ROUGE/BLEU 更准确。通俗理解：ROUGE/BLEU 看的是\"词有没有重复\"，BERTScore 看的是\"意思像不像\"。即使用了完全不同的词表达相同意思，BERTScore 也能给高分。**BERTScore=语义相似度评估**。\n\n**LLM 评审员（LLM-as-Judge）** 用另一个 LLM 对输出质量进行评分，可设定自定义评估标准。通俗理解：请另一位 AI \"老师\"来批改作业。适合大规模自动化评估，成本远低于人工评估。\n\n> 考点记忆法：ROUGE 的 R = Recall = 召回率 = 摘要（看覆盖了多少）；BLEU 的 B = Bilingual = 双语 = 翻译。BERTScore 里有 BERT = 语义 = 更聪明的评估。LLM-as-Judge = AI 批改作业。\n\n#### 自动评估 vs 人工评估——何时用哪个\n\n在实际项目中，自动评估和人工评估不是二选一的关系，而是互补的。一个完整的评估流程通常是：\n\n**第一步：自动评估做大规模筛选**。用 BLEU/ROUGE/BERTScore 等自动指标对候选模型做快速排名。自动评估的优势是速度快、成本低、可重复——你可以在几分钟内对 10 个模型的 10000 个样本进行评估。这一步的目的是排除明显不合格的候选，缩小范围。\n\n**第二步：人工评估做最终决策**。对自动评估排名前 2~3 的模型进行人工评审。人工评估能捕捉自动指标无法衡量的维度：回答的语气是否合适？是否有文化敏感性问题？是否会误导用户？人工评估通常需要 3~5 位评审员对 100~500 个样本进行评分，以确保评估结果的统计显著性。\n\n**第三步：业务指标做上线验证**。模型上线后，持续监控任务完成率、用户满意度、人工介入率等业务指标。如果业务指标下降，可能需要回到第一步重新评估。\n\nAmazon Bedrock 模型评估工具同时支持自动化评估和人工评估工作流。在自动化模式下，你可以上传自定义测试数据集，选择评估指标，系统自动计算分数。在人工模式下，系统会将模型输出分发给人工评审员，收集评分并汇总统计结果。\n\n#### 模型评估中的常见指标维度\n\n除了 ROUGE/BLEU/BERTScore 这些文本生成质量指标外，评估 FM 还需要关注以下维度：\n\n**准确性（Accuracy）**：模型输出的事实正确性。对于问答任务，答案是否与事实一致；对于分类任务，分类结果是否正确。\n\n**鲁棒性（Robustness）**：模型对输入变化的敏感度。同一个问题换一种问法，模型是否给出一致的答案？轻微的拼写错误是否导致完全不同的输出？鲁棒性差的模型在生产环境中会导致用户体验不一致。\n\n**安全性（Safety）**：模型是否会生成有害、偏见或不当的内容。这一维度通常通过对抗性测试（Adversarial Testing）来评估——故意输入敏感或边界性的问题，检查模型是否正确拒绝或安全处理。Amazon Bedrock Guardrails 提供了自动化的安全评估能力。\n\n**延迟与吞吐量（Latency & Throughput）**：模型的响应速度和并发处理能力。对于实时应用（如客服聊天），端到端延迟需要控制在 2~3 秒以内；对于批量处理应用，吞吐量（每秒处理的请求数）更重要。这些性能指标需要在接近生产环境的条件下测试（来源：aws-bedrock-pricing-models.md）。\n\n#### RAG 应用的评估——不只是看模型，还要看\"检索\"\n\nRAG 应用的评估比纯 FM 评估多了一个维度——检索质量。一个 RAG 系统的表现取决于两个环节：检索到的文档是否相关（Retrieval Quality）+ FM 基于检索结果生成的回答是否准确（Generation Quality）。\n\n| 评估维度 | 关键指标 | 说明 |\n|----------|---------|------|\n| **检索质量** | 检索召回率（Retrieval Recall） | Top-K 结果中包含正确答案来源的比例 |\n| **检索质量** | 检索精确率（Retrieval Precision） | Top-K 结果中与问题真正相关的比例 |\n| **生成质量** | 答案准确率 | 生成的回答是否事实正确 |\n| **生成质量** | 引用正确率 | 生成的回答是否正确引用了源文档 |\n| **端到端** | 忠实度（Faithfulness） | 回答是否忠于检索到的文档，没有\"编造\"信息 |\n\n#### AI 智能体和工作流的评估\n\n| 应用类型 | 评估重点 | 关键指标 |\n|----------|---------|---------|\n| **AI 智能体（Agent）** | 任务完成率+工具调用正确性 | 任务完成率、步骤正确执行率、工具调用成功率 |\n| **工作流（Workflow）** | 端到端流程执行质量 | 全流程完成率、平均执行时间、中间步骤错误率 |\n\n#### 业务目标一致性评估——不只是\"模型好不好\"，更是\"对业务有没有用\"\n\n技术指标再好，如果对业务没有正向影响也是白搭。以下是评估 AI 应用是否达成业务目标的关键指标：\n\n| 指标 | 定义 | 衡量什么 |\n|------|------|---------|\n| **任务完成率** | AI 成功完成指定任务的百分比 | AI 的功能有效性 |\n| **用户满意度** | 用户对 AI 输出的评分或反馈 | 用户体验质量 |\n| **每次交互成本** | 每次 AI 交互的平均 Token/基础设施成本 | 经济可持续性（来源：aws-bedrock-pricing-models.md） |\n| **人工介入率** | 需要人工干预的比例 | AI 的自主程度 |\n| **生产力提升** | AI 带来的工作效率提升幅度 | 业务价值 |\n\n#### A/B 测试——用数据说话而非靠感觉\n\nA/B 测试是评估 FM 和提示效果的黄金标准方法。核心思路：将用户随机分为两组，一组使用方案 A（如 Claude Sonnet + 提示模板 v1），另一组使用方案 B（如 Nova Pro + 提示模板 v2），比较两组在关键指标上的差异。\n\nA/B 测试可以用于比较不同模型、不同提示模板、不同推理参数设置、不同 RAG 配置（如不同的 Top-K 值）。Amazon Bedrock Prompt Management 内置了 A/B 测试支持，可以方便地创建和管理测试变体（来源：services.md ML-01）。\n\n#### 案例\n\n(虚构示例场景，数字仅为教学示意，非真实客户数据)\n\n**场景**：一家跨国翻译公司（TransGlobal Inc.）使用 FM 辅助翻译，需要评估三个候选模型（Nova Pro、Claude Sonnet、Llama 3）在翻译任务上的表现，以决定生产环境使用哪个。\n\n**评估方案**：\n\n1. **自动指标评估**：准备 1000 个中英翻译测试样本（含参考译文），分别用三个模型翻译，计算 BLEU 分数。结果：Claude Sonnet=0.78、Nova Pro=0.74、Llama 3=0.69。\n2. **BERTScore 评估**：BLEU 可能低估了表达不同但意思正确的翻译。补充 BERTScore 评估：Claude Sonnet=0.91、Nova Pro=0.89、Llama 3=0.83。\n3. **人工评估**：随机抽取 200 个样本，由 5 位专业翻译师从准确性、流畅性、术语一致性三个维度打分。结果：Claude Sonnet=4.2/5、Nova Pro=4.0/5、Llama 3=3.5/5。\n4. **成本评估**：按月翻译量 100 万段计算，Nova Pro 月成本约 2000 美元，Claude Sonnet 约 4500 美元，Llama 3 约 1800 美元。\n5. **最终决策**：选择 Nova Pro——质量接近 Claude Sonnet（差距仅 4%），但成本低 55%。对于少数高价值文档（法律合同），使用 Claude Sonnet 作为备选。\n\n#### 常见误区与易错点\n\n1. **混淆 ROUGE 和 BLEU 的适用场景**。ROUGE 以召回率为核心→适合摘要评估（\"参考摘要的内容覆盖了多少\"）；BLEU 以精确率为核心→适合翻译评估（\"翻译中有多少词是正确的\"）。考试中这是高频配对题，记住\"ROUGE=摘要，BLEU=翻译\"就够了。\n\n2. **只看自动指标不看业务指标**。模型在 MMLU 上得 95 分不代表它适合你的业务场景。考试中可能给你一个\"模型在基准测试中表现最好但用户满意度低\"的场景——正确答案是需要结合业务目标评估，而不是只看基准分数。\n\n3. **忽视 RAG 评估中的检索质量维度**。RAG 应用的表现不佳可能不是 FM 的问题，而是检索环节的问题——检索不到相关文档，再好的 FM 也无法给出正确答案。评估 RAG 时必须同时评估检索和生成两个环节。\n\n#### 记忆要点\n\n- 评估三大方法：人工评估（最准确）、基准数据集（标准化）、Bedrock 模型评估（一体化）\n- 指标配对必记：ROUGE=摘要（Recall）、BLEU=翻译（Bilingual）、BERTScore=语义相似度、LLM-as-Judge=AI 评审\n- RAG 评估多一维度：检索质量（Recall/Precision）+ 生成质量 + 忠实度\n- 业务指标：任务完成率、用户满意度、交互成本、人工介入率\n- A/B 测试是评估的黄金标准——用数据说话，Bedrock Prompt Management 支持 A/B 测试\n"}],"tips":{"points":"| 考点编号 | 考点内容 | 频率 | 常见题型 |\n|---|---|---|---|\n| 3.1.3 | RAG 原理与流程（检索→增强→生成） | ⭐⭐⭐ | 流程图题 / 场景题 |\n| 3.1.1 | FM 选择标准（给定需求选模型） | ⭐⭐⭐ | 场景选择题 |\n| 3.1.2 | Temperature / Top P / Max Tokens 的作用 | ⭐⭐⭐ | 参数匹配题 |\n| 3.1.5 | FM 定制方法成本排序（ICL < RAG < 微调 < 蒸馏 < 预训练） | ⭐⭐⭐ | 排序题 |\n| 3.1.4 | 向量数据库服务定位（OpenSearch vs Aurora vs Neptune vs RDS） | ⭐⭐ | 配对题 |\n| 3.2.2 | 提示工程技巧区分（Zero-shot / Few-shot / CoT） | ⭐⭐⭐ | 场景题 |\n| 3.2.4 | 提示工程风险（暴露/投毒/劫持/监狱突破） | ⭐⭐ | 概念匹配题 |\n| 3.3.2 | 微调方法区分（指令微调 vs 领域适配 vs 迁移学习） | ⭐⭐ | 选择题 |\n| 3.3.4 | RLHF 流程 | ⭐⭐ | 排序题 |\n| 3.4.2 | 评估指标匹配（ROUGE→摘要 / BLEU→翻译 / BERTScore→语义） | ⭐⭐⭐ | 配对题 |","services":"| 服务 | 主要用途 | 涉及 Task |\n|---|---|---|\n| Amazon Bedrock | FM 平台（选择、推理、微调、Prompt Management、模型评估） | 3.1, 3.2, 3.3, 3.4 |\n| Amazon Bedrock Knowledge Bases | RAG 实现 | 3.1 |\n| Amazon Bedrock AgentCore | AI 智能体创建 | 3.1 |\n| Amazon Bedrock Prompt Management | 提示版本控制和管理 | 3.2 |\n| Amazon OpenSearch Service | 向量数据库（RAG 检索） | 3.1 |\n| Amazon Aurora | 向量数据库（pgvector） | 3.1 |\n| Amazon Neptune | 图数据库 + 向量搜索 | 3.1 |\n| Amazon RDS for PostgreSQL | 向量数据库（pgvector） | 3.1 |\n| Amazon SageMaker AI | 模型训练、微调、蒸馏 | 3.3 |\n| Strands Agents | 智能体编排与工作流 | 3.1 |"}},{"domain":4,"name":"负责任 AI","weight":"14%","practiceCount":12,"practice":[{"id":"D4-007","d":4,"t":"单选","q":"一家金融公司正在使用人工智能系统获取客户信用评分，作为贷款申请流程的一部分。该公司希望在不同的地理区域拓展新市场。该公司必须确保能够在该地理区域内运营。公司应该审查哪些合规法律？","o":[{"l":"A","t":"当地健康数据保护法"},{"l":"B","t":"当地支付卡数据保护法"},{"l":"C","t":"当地教育隐私法"},{"l":"D","t":"局部算法责任法"}],"a":"D","e":"在部署影响个人的人工智能系统(如信用评分)时，公司必须遵守当地的算法问责法律。这些法律规范了自动化决策的公平性、透明度和影响，确保人工智能在新地理区域的道德使用。","src":153},{"id":"D4-025","d":4,"t":"多选","q":"一家公司正在准备数据以微调大型语言模型（LLM），该公司必须遵循负责任的人工智能原则。哪些操作可以满足此要求？（选择两项。）","o":[{"l":"A","t":"包含具有人口统计多样性的数据源，以提高模型的公平性。"},{"l":"B","t":"在训练数据集中统一应用标注标准。"},{"l":"C","t":"仅专注于大量数据，而不考虑其质量。"},{"l":"D","t":"仅使用合成数据来训练模型。"},{"l":"E","t":"使用更少的标签，以在模型训练期间减少数据的歧义。"}],"a":"AB","e":"使用具有人口多样性的数据有助于减少偏见，支持不同用户群体之间的公平性。采用一致的标注标准可提高微调过程中的数据质量、可靠性和透明度，从而促进负责任的人工智能实践。","src":446},{"id":"D4-011","d":4,"t":"单选","q":"一家公司使用Amazon Bedrock上的第三方模型来分析机密文件。该公司担心数据隐私。哪项陈述描述了Amazon Bedrock如何保护数据隐私？","o":[{"l":"A","t":"用户输入和模型输出被匿名化，并与第三方模型提供商共享。"},{"l":"B","t":"用户输入和模型输出不与任何第三方模型提供者共享。"},{"l":"C","t":"用户输入是保密的，但是模型输出与第三方模型提供商共享。"},{"l":"D","t":"用户输入和模型输出在与第三方模型提供者共享之前被编辑。"}],"a":"B","e":"解析为学习材料补充（依据 syllabus 5.1 数据隐私 & services.md Bedrock 安全）：题干描述用 Bedrock 第三方模型分析机密文件、担心数据隐私。Amazon Bedrock 默认不使用客户输入/输出来训练底层模型，且通过 AWS PrivateLink 可在 VPC 内私有调用，数据不离开客户 VPC。答案 B 对应 Bedrock 数据保护机制。","src":202},{"id":"D4-004","d":4,"t":"单选","q":"一家医院正在开发一个 AI 系统，以帮助医生根据病人记录和医学图像诊断疾病。为了遵守法规，敏感的病人数据必须不离开数据所在的国家。哪种数据治理策略将确保合规并保护病人隐私？","o":[{"l":"A","t":"数据驻留"},{"l":"B","t":"数据质量"},{"l":"C","t":"数据可发现性"},{"l":"D","t":"数据增强"}],"a":"A","e":"解析为学习材料补充（依据 syllabus 4.1 负责任 AI/数据隐私 & services.md）：题干描述医院 AI 系统、敏感病人数据必须（合规）。敏感数据保护需：加密（KMS）、访问控制（IAM）、脱敏、合规存储（HIPAA 相关）。答案 A 对应加密+访问控制的合规方案。","src":122},{"id":"D4-003","d":4,"t":"单选","q":"一家医疗公司正在定制用于诊断目的的基础模型(FM)。该公司需要模型透明且可解释，以满足监管要求。哪种解决方案能够满足这些要求？","o":[{"l":"A","t":"使用 Amazon Inspector 配置安全性和合规性。"},{"l":"B","t":"使用 Amazon SageMaker Clarify 生成简单的指标、报告和示例。"},{"l":"C","t":"使用 Amazon Macie 加密和保护培训数据。"},{"l":"D","t":"收集更多数据。使用 Amazon Rekognition 向数据添加自定义标签。"}],"a":"B","e":"解析为学习材料补充（依据 syllabus 4.2 可解释性 & services.md SageMaker Clarify/Model Cards）：题干描述医疗 FM 定制、需模型透明可解释满足监管。SageMaker Model Cards 标准化文档化模型信息；Clarify 提供可解释性分析；开源模型可审查代码提升透明度。答案 B 对应使用 Clarify/Model Cards 或开源可审查模型的方案。","src":119},{"id":"D4-013","d":4,"t":"多选","q":"一家公司将 Amazon Bedrock用于其生成式人工智能应用程序。该公司希望使用Amazon Bedrock护栏来检测和过滤有害的用户输入和模型生成的输出。护栏可以过滤哪些内容类别？（选择两个。）","o":[{"l":"A","t":"讨厌"},{"l":"B","t":"政治"},{"l":"C","t":"暴力"},{"l":"D","t":"投机"},{"l":"E","t":"宗教"}],"a":"AC","e":"Amazon Bedrock护栏提供可配置的内容过滤器，以检测和阻止生成式人工智能应用程序中的有害内容。具体来说，它们包括针对仇恨和暴力等类别的过滤器。这些过滤器可以应用于用户输入和模型生成的输出，以确保 AI 应用程序遵守负责任的 AI 实践和组织策略。","src":220},{"id":"D4-023","d":4,"t":"单选","q":"一家公司正在使用Amazon Q Business 来创建一个 AI 助手。该公司需要限制用户与 AI 助手的互动仅限于公司批准的主题。哪个功能能满足这些要求？","o":[{"l":"A","t":"Amazon Q Business 企业索引"},{"l":"B","t":"Amazon Q Business 入门索引"},{"l":"C","t":"Amazon Q Business应用的使用限制"},{"l":"D","t":"Amazon Q 索引跨账户访问"}],"a":"C","e":"Amazon Q Business 中的应用程序防护栏使组织能够控制和限制 AI 助手可以响应的主题和交互类型，确保对话始终在公司批准的范围内进行。 [多选题]","src":350},{"id":"D4-012","d":4,"t":"多选","q":"一家贷款公司正在构建一个基于生成式人工智能的解决方案，根据特定的业务标准为新申请人提供折扣。该公司希望负责任地建立和使用人工智能模型，以最大限度地减少可能对一些客户产生负面影响的偏见。公司应该采取哪些措施来满足这些要求？（选择两个。）","o":[{"l":"A","t":"检测数据中的不平衡或差异。"},{"l":"B","t":"确保模型经常运行。"},{"l":"C","t":"评估模型的行为，以便公司可以向利益相关者提供透明度。"},{"l":"D","t":"使用面向回忆的替角 Gisting 评估(ROUGE)技术来确保模型 100%准确。"},{"l":"E","t":"确保模型的推理时间在可接受的范围内。"}],"a":"AC","e":"解析为学习材料补充（依据 syllabus 4.1 负责任 AI/公平性 & services.md Guardrails）：题干描述贷款公司 GenAI 方案、需负责任（公平性/无偏见）。需用 Guardrails 过滤不当内容、Clarify 检测偏差、确保公平性（AC 对应两项负责任实践）。答案 A、C。","src":217},{"id":"D4-019","d":4,"t":"多选","q":"一家公司正在将其员工招聘和录用解决方案与人工智能相结合。该公司希望降低偏见风险，确保负责任的人工智能实践，同时优先考虑公平的招聘决策。公司应考虑负责任的人工智能的哪些核心维度？（选择两个。）","o":[{"l":"A","t":"公平性"},{"l":"B","t":"容忍度"},{"l":"C","t":"灵活性"},{"l":"D","t":"开源"},{"l":"E","t":"透明度"}],"a":"AE","e":"公平性——确保所有人口群体都能获得公平的结果有助于降低招聘决策中的偏见风险。透明度——清晰解析人工智能如何做出决策有助于建立信任，并允许对偏见进行审计。","src":304},{"id":"D4-009","d":4,"t":"单选","q":"一家医疗公司希望实现其现场信息处理应用程序的现代化。该公司希望利用生成式人工智能来回答患者的医疗。公司应该使用哪种 AWS 服务来确保对应用负责任的 AI？","o":[{"l":"A","t":"Amazon Bedrock的护栏"},{"l":"B","t":"Amazon Inspector"},{"l":"C","t":"Amazon Cognito"},{"l":"D","t":"AWS Trusted Advisor（可信顾问）"}],"a":"A","e":"解析为学习材料补充（依据 syllabus 4.1 & services.md Amazon Bedrock Knowledge Bases）：题干描述医疗公司现代化现场信息处理、用 GenAI 回答患者医疗问题。需 RAG（Amazon Bedrock Knowledge Bases）基于可信医疗文档回答+Guardrails 确保内容安全。答案 A 对应知识库+防护方案。","src":178},{"id":"D4-002","d":4,"t":"单选","q":"一家公司希望为儿童开发一款基于经典故事的互动应用程序。该公司希望使用Amazon Bedrock，并需要确保结果和主题适合儿童。哪个 AWS 服务或功能将满足这些要求？","o":[{"l":"A","t":"Amazon Cognito"},{"l":"B","t":"Amazon Bedrock Playground"},{"l":"C","t":"Amazon Bedrock的护栏"},{"l":"D","t":"Amazon Bedrock Agents"}],"a":"C","e":"解析为学习材料补充（依据 syllabus 4.1 Guardrails/儿童内容安全 & services.md）：题干描述儿童互动应用、需确保结果和主题适合儿童。Amazon Bedrock Guardrails 支持内容过滤、拒绝主题（如不适当主题）、敏感信息过滤，确保输出适合儿童。答案 C 对应 Guardrails。","src":51},{"id":"D4-018","d":4,"t":"单选","q":"一家公司获得了国际标准化组织（ISO）的认证，以管理人工智能风险并负责任地使用人工智能。这项认证反映了该公司怎样的情况？","o":[{"l":"A","t":"公司所有成员均通过了 ISO 认证。"},{"l":"B","t":"该公司使用的所有人工智能系统均通过了 ISO 认证。"},{"l":"C","t":"所有人工智能应用团队成员均通过了 ISO 认证。"},{"l":"D","t":"该公司的开发框架已通过 ISO 认证。"}],"a":"D","e":"获得管理人工智能风险的 ISO 认证意味着公司的开发流程、控制措施和框架符合 ISO 标准。这并非是对单个员工或人工智能系统的认证，而是对组织架构和实践的认可。","src":297}],"sections":[{"h":"解释负责任 AI 系统的开发","body":"\n\n#### 本节定位\n\n本节对应考纲任务声明 4.1「解释负责任 AI 系统的开发」。虽然这个领域只占考试权重的 14%，但它覆盖的知识面非常广——从抽象的伦理准则到具体的 AWS 工具，从数据集质量到模型统计概念，几乎每个考题都需要你在\"原则\"和\"工具\"之间快速配对。学完本节后，你应该能做到：说出负责任 AI 的七大特征并给出各自的一句话定义；给定一个场景，选出正确的 AWS 工具（Guardrails、Clarify、Model Monitor、A2I）；识别 GenAI 可能带来的法律风险；理解数据集四大特征如何影响模型公平性；以及区分偏差和方差这两个基础概念。\n\n#### 负责任 AI 的七大特征——给 AI 套上\"行为准则\"\n\n想象你新招了一个能力超强的实习生，但你不能把它丢到工位上就不管了——你需要给它一套行为规范。负责任 AI 就是给 AI 系统制定的行为准则（来源：AWS 官方考纲 Domain 4 任务 4.1）。AWS 和整个行业把这套准则总结为七个核心特征，考试中经常出配对题和选择题，需要你精确区分每一个。\n\n**偏见（Bias）**：模型对特定群体产生系统性的、不公平的偏差。举个直觉例子：一个招聘 AI 因为历史数据中男性工程师比例远高于女性，学会了\"男性更适合工程岗位\"这个错误模式——这就是偏见。偏见的来源通常是训练数据本身不均衡，所以它和后面要讲的数据集特征密切相关。\n\n**公平性（Fairness）**：模型对所有用户群体一视同仁，不因性别、种族、年龄等人口统计特征而给出差异化待遇。公平性和偏见是一体两面——消除偏见的结果就是实现公平性。在金融信贷审批场景中，公平性尤其重要，因为很多国家和地区有反歧视法规要求。\n\n**包容性（Inclusiveness）**：模型能有效服务所有用户群体，不排除任何人。和公平性不同，包容性更强调\"覆盖范围\"——你的语音助手能不能识别带口音的英语？你的人脸识别能不能正确识别深肤色人群？如果模型只在某些群体上表现好，对其他群体表现差，那就缺乏包容性。\n\n**稳健性（Robustness）**：模型在面对噪声输入、异常数据甚至恶意攻击时仍能稳定运行。现实世界的数据不像实验室那么干净——用户可能输入乱码、上传模糊照片、甚至故意构造能\"骗过\"模型的输入（对抗攻击）。稳健的模型不会因为一个奇怪的输入就彻底崩溃或给出荒谬结果。\n\n**安全性（Safety）**：模型不产生有害、危险或不道德的输出。这在 GenAI 场景中格外重要——你不希望你的聊天机器人教用户如何制造危险物品，也不希望它输出仇恨言论。安全性是 Bedrock Guardrails 的核心守护目标（来源：services.md ML-01 Guardrails 功能描述）。\n\n**真实性（Truthfulness）**：模型输出的信息准确、可靠、可验证。GenAI 模型有一个臭名昭著的问题——**幻觉（Hallucination）**，即模型生成看起来合理但实际完全错误的内容。比如你问 AI 一个法律问题，它可能编造一个根本不存在的法条并且说得头头是道。真实性就是要求模型的输出能经得起事实核查。\n\n**可解释性（Explainability）**：能够理解模型做出特定决策的原因和逻辑。为什么贷款申请被拒？为什么这张图片被标记为违规？如果模型无法解释自己的决策，用户和监管者就无法信任它。可解释性是任务 4.2 的核心主题，这里先建立概念。\n\n> 记忆技巧：七个特征可以用\"偏公包稳安真解\"的缩略词来记——偏见、公平、包容、稳健、安全、真实、可解释。考试中任何提到\"负责任 AI 特征\"的题目，都在考这七个。\n[[fig:f08]]\n\n#### AWS 工具——把准则落地为技术手段\n\n知道了七大准则，接下来的问题是：在 AWS 上，用什么工具来落实这些准则？考试中最常考的是四个工具的功能配对（来源：AWS 官方考纲 Domain 4 工具识别要求）。\n\n**Amazon Bedrock Guardrails（防护机制）** 是应用层的\"安检门\"。它部署在 Bedrock FM 的输入和输出端，实时拦截有问题的内容。核心功能有四项：**内容过滤**——自动检测和过滤有害内容（仇恨言论、暴力、色情、辱骂等），你可以设置过滤的严格程度；**拒绝主题**——定义模型禁止讨论的话题（比如竞品定价策略、医疗建议），模型遇到相关问题会直接拒绝回答；**敏感信息过滤**——防止模型输出 PII（身份证号、电话、邮箱等个人身份信息）；**词库过滤**——自定义敏感词的黑名单或白名单。Guardrails 的定位是\"运行时防护\"，它不改变模型本身，只在输入输出阶段做过滤。\n\n**Amazon SageMaker Clarify** 是训练和评估阶段的\"公平性审计师\"。它的核心能力是检测训练数据中的偏差、分析模型预测中的偏差、以及提供特征重要性（SHAP 值）来解释模型决策。Clarify 和 Guardrails 的区别是考试高频考点：Guardrails 拦截运行时内容，Clarify 在训练和评估阶段分析偏差。两者工作阶段完全不同。\n\n**Amazon SageMaker Model Monitor** 是生产环境中的\"健康仪表盘\"。模型上线后，输入数据的分布可能随时间变化（数据漂移），或者输入和输出之间的关系可能发生变化（概念漂移）——这些都会导致模型性能退化。Model Monitor 持续监控这些变化并发出告警。它的定位是\"部署后持续监控\"，关注的是生产环境的模型表现。\n\n**Amazon Augmented AI（A2I）** 是\"人工兜底\"机制，实现 Human-in-the-loop（人在回路中）。当模型预测的置信度低于设定阈值时，A2I 自动将该样本转交给人类审核员做最终判断。比如一个文档审核系统，AI 对某份合同的关键条款识别置信度只有 60%，A2I 就会把这份合同发给人类审核员确认。它确保在高风险决策场景中，始终有人类做最终把关。\n\n> 工具配对速记：Guardrails = 运行时内容安检 → Clarify = 训练阶段偏差审计 → Model Monitor = 部署后性能监控 → A2I = 低置信度人工兜底。\n\n#### 选择模型的负责任做法——环境与可持续性\n\n负责任 AI 不仅关注模型的输出质量，还关注模型本身对环境的影响（来源：AWS 官方考纲 Domain 4 环境可持续性要求）。训练一个大型语言模型消耗的电力可以相当于几十户家庭一年的用电量——这是实实在在的碳排放。负责任的做法包括：在满足性能需求的前提下优先选择更小的模型（不要杀鸡用牛刀）；使用模型蒸馏技术将大模型的知识\"压缩\"到小模型中降低推理成本；使用 Spot 实例优化训练成本和资源利用率。AWS 也在自身基础设施层面做出承诺，致力于实现水资源正效益和可再生能源目标。\n\n#### GenAI 涉及的法律风险\n\nGenAI 的强大能力也带来了全新的法律风险，考试中会以场景题形式考查你的识别能力。\n\n**知识产权侵权**：模型输出可能包含受版权保护的内容。如果你用 GenAI 生成的营销文案恰好和某位作家的作品高度相似，你可能面临版权诉讼。缓解措施是审核数据来源、对输出做版权校验。\n\n**模型输出偏差**：模型产生歧视性、冒犯性或不公平的内容。一个客服机器人如果对某个种族的用户使用不同的语气或给出更低质量的回答，就构成了输出偏差。缓解措施是使用 Guardrails 过滤、Clarify 检测偏差、以及训练时使用多样性数据。\n\n**客户信任流失**：模型持续犯错或输出不准确内容，导致用户不再信任你的产品。这是一种间接但影响深远的风险——一旦失去信任，很难挽回。缓解措施是归因和溯源机制、人工审核兜底（A2I）。\n\n**幻觉（Hallucination）**：模型生成看似合理但实际错误的内容。这是 GenAI 最独特的风险——传统 ML 模型可能预测不准，但不会\"编故事\"。幻觉在高风险场景（法律咨询、医疗建议）中尤其危险。缓解措施是 RAG（检索增强生成）+ 事实校验、置信度评分。\n\n#### 数据集的四大关键特征\n\n\"垃圾进、垃圾出\"——这是 ML 领域最古老的真理之一。如果训练数据本身有问题，模型再强也救不了。考试要求你掌握数据集的四个关键特征（来源：AWS 官方考纲 Domain 4 数据集特征要求）：\n\n**包容性（Inclusiveness）**：数据集覆盖所有相关用户群体和身份维度。如果你训练一个人脸识别模型，数据集里 95% 是浅肤色面孔、只有 5% 是深肤色面孔，那模型对深肤色群体的识别准确率一定会很差——这就是缺乏包容性导致的偏差。\n\n**多样性（Diversity）**：数据包含足够丰富的场景、语言、来源。一个翻译模型如果只用新闻语料训练，就无法处理口语化表达或专业术语。多样性确保模型不会只在\"见过的世界\"里表现好。\n\n**数据来源经策管（Curation）**：数据的来源经过系统化筛选和质量审核。不是所有数据都适合拿来训练——网上爬取的数据可能包含版权内容、不实信息、偏见性表述。策管确保数据的质量、合法性和准确性。\n\n**数据集平衡（Balance）**：各类别、各群体的数据量保持合理比例。如果你训练一个欺诈检测模型，正常交易有 100 万条而欺诈交易只有 100 条，模型会倾向于把所有交易都预测为\"正常\"——因为这样准确率就有 99.99%。平衡的数据集能防止模型对多数类别过拟合而忽略少数类别。\n\n#### 偏差（Bias）与方差（Variance）——ML 中最基本的权衡\n\n这两个概念虽然在域 1 也有涉及，但考纲在域 4 特别强调了它们对人口统计群体的影响，所以需要在负责任 AI 的语境下重新理解。\n\n**偏差（Bias）** 指模型预测值与真实值之间的系统性偏离。高偏差意味着模型太简单，无法捕捉数据中的复杂模式——这叫**欠拟合（Underfitting）**。打个比方：你用一条直线去拟合一个弯曲的数据分布，直线怎么画都无法完美贴合，训练误差和测试误差都会很高。\n\n**方差（Variance）** 指模型对不同训练数据集的预测波动程度。高方差意味着模型太复杂，\"记住了\"训练数据中的噪声而不是真正的模式——这叫**过拟合（Overfitting）**。打个比方：你让模型画出一条穿过每一个数据点的复杂曲线，它在训练集上完美匹配，但换一批新数据就完全不准了。\n\n**偏差-方差权衡**是 ML 中最经典的难题：提高模型复杂度 → 降低偏差但增加方差；降低模型复杂度 → 降低方差但增加偏差。目标是找到平衡点，让总误差最小。\n\n在负责任 AI 语境中，这个权衡有特殊意义：如果训练数据中某群体样本量不足，模型对该群体的偏差会更大——这就是\"数据偏差导致模型偏差\"的典型表现。所以数据集的包容性和平衡性直接决定了模型对不同群体的公平性。\n[[fig:f09]]\n\n#### 案例\n\n> 以下为虚构场景，仅用于辅助理解考试知识点。\n\n**场景：某零售银行部署了一个 AI 信贷审批系统。** 上线三个月后，银行合规部门发现一个问题：该系统对农村地区申请者的拒绝率（35%）远高于城市地区申请者（12%），即使两组申请者的信用评分分布相近。经分析，问题出在训练数据——历史数据中 85% 的样本来自城市地区，农村地区严重不足（数据集缺乏平衡性和包容性）。银行采取了以下措施：用 SageMaker Clarify 做偏差检测，量化了模型对农村群体的不公平程度；补充农村地区样本后重新训练模型；部署后用 Model Monitor 持续监控两组的通过率差异；对置信度低于 70% 的审批决策启用 A2I 人工审核。这个案例串联了本节的大部分知识点：数据集特征 → 偏见/公平性 → AWS 工具链。\n\n#### 常见误区与易错点\n\n**误区一：把 Guardrails 和 Clarify 的功能搞混。** Guardrails 是运行时内容过滤，像一个\"门卫\"在模型输入/输出端拦截有害内容；Clarify 是训练和评估阶段的偏差分析工具，像一个\"审计师\"在模型上线前检查公平性。两者工作阶段和目标完全不同。考试中给你一个\"需要检测训练数据偏差\"的场景，答案是 Clarify 而不是 Guardrails。\n\n**误区二：把偏差（Bias）和方差（Variance）的含义搞反。** 高偏差 = 欠拟合 = 模型太简单；高方差 = 过拟合 = 模型太复杂。常见错误是以为\"高偏差\"意味着模型过于复杂——恰恰相反。记住：偏差高是因为模型\"能力不够\"，方差高是因为模型\"学过了头\"。\n\n**误区三：以为 Model Monitor 能主动修复问题。** Model Monitor 只是监控和告警工具，它能检测到数据漂移或模型退化，但不能自动修复。发现问题后，需要人来决定是重新训练模型还是调整数据管道。\n\n#### 记忆要点\n\n- 负责任 AI 七大特征：**偏见、公平性、包容性、稳健性、安全性、真实性、可解释性**——缩略词\"偏公包稳安真解\"\n- AWS 工具四件套的定位：**Guardrails = 运行时内容安检** | **Clarify = 训练阶段偏差审计** | **Model Monitor = 部署后性能监控** | **A2I = 低置信度人工兜底**\n- GenAI 四大法律风险：**知识产权侵权、模型输出偏差、客户信任流失、幻觉**\n- 数据集四大特征：**包容性、多样性、策管、平衡**——直接决定模型公平性\n- 偏差 vs 方差：**高偏差 = 欠拟合 = 太简单** | **高方差 = 过拟合 = 太复杂**——对少数群体数据不足会放大偏差\n","figures":[{"id":"f08","title":"负责任 AI 七大特征","caption":"七个特征共同构成\"负责任 AI\"框架；偏见(Bias)需降低，其余六项需提升","html":"<svg viewBox=\"0 0 340 290\" style=\"width:100%;max-width:340px;display:block;margin:0 auto;font-family:system-ui,sans-serif\">\n  <!-- 中心 -->\n  <circle cx=\"170\" cy=\"145\" r=\"42\" fill=\"linear-gradient(135deg,#4f46e5,#7c3aed)\" />\n  <circle cx=\"170\" cy=\"145\" r=\"42\" fill=\"#4f46e5\"/>\n  <text x=\"170\" y=\"139\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\">负责任<\/text>\n  <text x=\"170\" y=\"155\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\" font-weight=\"700\">AI<\/text>\n\n  <!-- 7个特征气泡（围绕中心） -->\n  <!-- 上 -->\n  <circle cx=\"170\" cy=\"32\" r=\"30\" fill=\"#ede9fe\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/>\n  <text x=\"170\" y=\"27\" font-size=\"10\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">公平性<\/text>\n  <text x=\"170\" y=\"40\" font-size=\"9\" fill=\"#6b7280\" text-anchor=\"middle\">Fairness<\/text>\n  <line x1=\"170\" y1=\"62\" x2=\"170\" y2=\"103\" stroke=\"#a78bfa\" stroke-width=\"1\" stroke-dasharray=\"4\"/>\n\n  <!-- 右上 -->\n  <circle cx=\"292\" cy=\"78\" r=\"30\" fill=\"#dbeafe\" stroke=\"#3b82f6\" stroke-width=\"1.5\"/>\n  <text x=\"292\" y=\"73\" font-size=\"10\" fill=\"#1d4ed8\" text-anchor=\"middle\" font-weight=\"700\">包容性<\/text>\n  <text x=\"292\" y=\"86\" font-size=\"9\" fill=\"#6b7280\" text-anchor=\"middle\">Inclusive<\/text>\n  <line x1=\"264\" y1=\"95\" x2=\"210\" y2=\"118\" stroke=\"#a78bfa\" stroke-width=\"1\" stroke-dasharray=\"4\"/>\n\n  <!-- 右下 -->\n  <circle cx=\"292\" cy=\"212\" r=\"30\" fill=\"#d1fae5\" stroke=\"#059669\" stroke-width=\"1.5\"/>\n  <text x=\"292\" y=\"207\" font-size=\"10\" fill=\"#065f46\" text-anchor=\"middle\" font-weight=\"700\">稳健性<\/text>\n  <text x=\"292\" y=\"220\" font-size=\"9\" fill=\"#6b7280\" text-anchor=\"middle\">Robust<\/text>\n  <line x1=\"264\" y1=\"196\" x2=\"210\" y2=\"172\" stroke=\"#a78bfa\" stroke-width=\"1\" stroke-dasharray=\"4\"/>\n\n  <!-- 下 -->\n  <circle cx=\"170\" cy=\"258\" r=\"30\" fill=\"#fef9c3\" stroke=\"#d97706\" stroke-width=\"1.5\"/>\n  <text x=\"170\" y=\"253\" font-size=\"10\" fill=\"#92400e\" text-anchor=\"middle\" font-weight=\"700\">安全性<\/text>\n  <text x=\"170\" y=\"266\" font-size=\"9\" fill=\"#6b7280\" text-anchor=\"middle\">Safety<\/text>\n  <line x1=\"170\" y1=\"228\" x2=\"170\" y2=\"187\" stroke=\"#a78bfa\" stroke-width=\"1\" stroke-dasharray=\"4\"/>\n\n  <!-- 左下 -->\n  <circle cx=\"48\" cy=\"212\" r=\"30\" fill=\"#fce7f3\" stroke=\"#db2777\" stroke-width=\"1.5\"/>\n  <text x=\"48\" y=\"207\" font-size=\"10\" fill=\"#9d174d\" text-anchor=\"middle\" font-weight=\"700\">真实性<\/text>\n  <text x=\"48\" y=\"220\" font-size=\"9\" fill=\"#6b7280\" text-anchor=\"middle\">Truthful<\/text>\n  <line x1=\"76\" y1=\"196\" x2=\"130\" y2=\"172\" stroke=\"#a78bfa\" stroke-width=\"1\" stroke-dasharray=\"4\"/>\n\n  <!-- 左上 -->\n  <circle cx=\"48\" cy=\"78\" r=\"30\" fill=\"#fee2e2\" stroke=\"#dc2626\" stroke-width=\"1.5\"/>\n  <text x=\"48\" y=\"73\" font-size=\"10\" fill=\"#7f1d1d\" text-anchor=\"middle\" font-weight=\"700\">偏见<\/text>\n  <text x=\"48\" y=\"86\" font-size=\"9\" fill=\"#6b7280\" text-anchor=\"middle\">Bias↓<\/text>\n  <line x1=\"76\" y1=\"95\" x2=\"130\" y2=\"118\" stroke=\"#a78bfa\" stroke-width=\"1\" stroke-dasharray=\"4\"/>\n\n  <!-- 正左（可解释性，第7个） -->\n  <circle cx=\"10\" cy=\"145\" r=\"30\" fill=\"#f3e8ff\" stroke=\"#9333ea\" stroke-width=\"1.5\"/>\n  <text x=\"10\" y=\"140\" font-size=\"9\" fill=\"#6b21a8\" text-anchor=\"middle\" font-weight=\"700\">可解释<\/text>\n  <text x=\"10\" y=\"152\" font-size=\"9\" fill=\"#6b7280\" text-anchor=\"middle\">Explain<\/text>\n  <line x1=\"40\" y1=\"145\" x2=\"128\" y2=\"145\" stroke=\"#a78bfa\" stroke-width=\"1\" stroke-dasharray=\"4\"/>\n<\/svg>"},{"id":"f09","title":"偏差-方差权衡（Bias-Variance Tradeoff）","caption":"目标：找到偏差和方差的平衡点（绿色虚线）；简单模型→高偏差；复杂模型→高方差","html":"<svg viewBox=\"0 0 400 240\" style=\"width:100%;max-width:400px;display:block;margin:0 auto;font-family:system-ui,sans-serif\">\n  <!-- 坐标轴 -->\n  <line x1=\"50\" y1=\"180\" x2=\"370\" y2=\"180\" stroke=\"#374151\" stroke-width=\"2\"/>\n  <line x1=\"50\" y1=\"180\" x2=\"50\" y2=\"20\" stroke=\"#374151\" stroke-width=\"2\"/>\n  <text x=\"210\" y=\"235\" font-size=\"11\" fill=\"#6b7280\" text-anchor=\"middle\">模型复杂度（左=简单/右=复杂）<\/text>\n  <text x=\"20\" y=\"100\" font-size=\"11\" fill=\"#6b7280\" text-anchor=\"middle\" transform=\"rotate(-90,20,100)\">误差 →<\/text>\n\n  <!-- 偏差曲线（递减） -->\n  <path d=\"M60 160 Q120 120 200 80 Q280 50 350 38\" stroke=\"#dc2626\" stroke-width=\"2.5\" fill=\"none\"/>\n  <text x=\"355\" y=\"35\" font-size=\"10\" fill=\"#dc2626\" font-weight=\"700\">偏差误差<\/text>\n  <text x=\"355\" y=\"46\" font-size=\"10\" fill=\"#dc2626\">（欠拟合↓）<\/text>\n\n  <!-- 方差曲线（递增） -->\n  <path d=\"M60 35 Q140 50 220 90 Q290 130 350 162\" stroke=\"#2563eb\" stroke-width=\"2.5\" fill=\"none\"/>\n  <text x=\"355\" y=\"158\" font-size=\"10\" fill=\"#2563eb\" font-weight=\"700\">方差误差<\/text>\n  <text x=\"355\" y=\"169\" font-size=\"10\" fill=\"#2563eb\">（过拟合↑）<\/text>\n\n  <!-- 总误差曲线（U形） -->\n  <path d=\"M60 155 Q130 100 200 78 Q265 72 310 90 Q335 105 350 130\" stroke=\"#7c3aed\" stroke-width=\"2.5\" fill=\"none\" stroke-dasharray=\"6,3\"/>\n  <text x=\"310\" y=\"68\" font-size=\"10\" fill=\"#7c3aed\" font-weight=\"700\">总误差<\/text>\n\n  <!-- 最优点 -->\n  <circle cx=\"200\" cy=\"78\" r=\"6\" fill=\"#06d6a0\" stroke=\"#059669\" stroke-width=\"2\"/>\n  <line x1=\"200\" y1=\"78\" x2=\"200\" y2=\"180\" stroke=\"#06d6a0\" stroke-width=\"1.5\" stroke-dasharray=\"4\"/>\n  <text x=\"200\" y=\"175\" font-size=\"10\" fill=\"#059669\" text-anchor=\"middle\" font-weight=\"700\">最优复杂度<\/text>\n\n  <!-- 区域标注 -->\n  <rect x=\"52\" y=\"22\" width=\"80\" height=\"20\" rx=\"4\" fill=\"#fee2e2\" opacity=\"0.7\"/>\n  <text x=\"92\" y=\"35\" font-size=\"9\" fill=\"#7f1d1d\" text-anchor=\"middle\">高偏差=欠拟合<\/text>\n  <rect x=\"255\" y=\"22\" width=\"80\" height=\"20\" rx=\"4\" fill=\"#dbeafe\" opacity=\"0.7\"/>\n  <text x=\"295\" y=\"35\" font-size=\"9\" fill=\"#1e3a8a\" text-anchor=\"middle\">高方差=过拟合<\/text>\n<\/svg>"}]},{"h":"了解模型透明且可解释的重要性","body":"\n\n#### 本节定位\n\n本节对应考纲任务声明 4.2「了解模型透明且可解释的重要性」。如果说任务 4.1 讲的是负责任 AI 的\"全景图\"，那 4.2 就是把\"可解释性\"这个特征单独拿出来深入展开。你需要理解的核心问题是：为什么有些模型能解释自己的决策而有些不能？用什么方法可以让不可解释的模型变得相对可解释？AWS 提供了哪些工具来提升透明度？以及在\"模型性能\"和\"可解释性\"之间如何做取舍？\n\n#### 透明模型 vs 不透明模型——为什么 AI 的\"黑箱\"让人不安\n\n想象两个医生：一个告诉你\"你需要做手术，原因是 X 指标异常、Y 检查结果阳性、Z 症状持续三周\"；另一个只说\"你需要做手术\"。你会信任哪个？这就是透明模型和不透明模型的区别（来源：AWS 官方考纲 Domain 4 任务 4.2 透明/可解释模型定义）。\n\n**透明/可解释模型** 的决策逻辑可以追溯到具体输入特征——你能知道\"哪些因素导致了这个决策\"。典型代表是线性回归、决策树、逻辑回归、KNN。这些模型结构简单、每一步运算都有明确含义。比如决策树，你可以从根节点沿着分支一路追踪到叶子节点，清楚看到模型在每个节点做了什么判断。\n\n**不透明/不可解释模型** 的内部运作像一个黑箱——数据进去、结果出来，但中间发生了什么难以理解。典型代表是深度神经网络和大型基础模型（LLM 等）。一个有数十亿参数的 LLM 为什么给出某个特定回答？即使是模型的创建者也很难给出精确解释。\n\n两类模型的核心取舍在于：透明模型可审计、可解释，但通常性能上限不如深度模型；不透明模型在复杂任务上表现更好，但难以审计和解释。这个取舍在不同行业场景中会导向不同的选择——金融信贷审批需要向申请者解释拒贷原因（法规要求），所以倾向于使用可解释模型或为不可解释模型添加解释层；而内容推荐系统对可解释性要求较低，可以充分利用深度模型的高性能。\n\n#### 可解释性方法——让黑箱模型\"开口说话\"\n\n即使使用了不透明模型，也不代表完全放弃可解释性。ML 领域发展出了一系列\"事后解释\"方法，让黑箱模型能在一定程度上解释自己的决策（来源：AWS 官方文档 SageMaker Clarify 可解释性功能）。\n\n**SHAP（SHapley Additive exPlanations）** 是目前最主流的可解释性方法，也是 AWS SageMaker Clarify 的核心技术。它借用了博弈论中的 Shapley 值概念——想象一个团队完成了一个项目，每个成员的贡献不同，Shapley 值就是公平分配功劳的数学方法。类比到 ML 模型中，每个输入特征就像一个\"团队成员\"，SHAP 计算每个特征对最终预测结果的贡献度。比如在贷款审批中，SHAP 可以告诉你：\"收入贡献了 +40 分、信用历史贡献了 +30 分、负债比率贡献了 -25 分\"——让你清楚看到每个因素如何影响了最终决策。SHAP 的优点是数学基础严谨、结果可加性好（各特征贡献之和等于最终预测）；缺点是计算成本高，对大模型可能很慢。\n\n**LIME（Local Interpretable Model-agnostic Explanations）** 是另一种常用方法，核心思想是\"局部近似\"——对于你想解释的那一个具体预测，在它周围构造一些相似的样本，用一个简单的可解释模型（如线性模型）来近似黑箱模型在这个局部区域的行为。LIME 的优点是计算速度快、与模型无关（任何模型都能用）；缺点是局部解释可能不反映全局行为，不同次运行的结果可能略有差异。\n\n**特征重要性（Feature Importance）** 是最直观的方法——直接告诉你每个输入特征对模型预测的影响程度排名。随机森林等集成模型有内置的特征重要性度量。在 Clarify 中，特征重要性通常通过 SHAP 值来计算。\n\n> 考试中的常见考法：题目描述一个需要\"解释模型决策\"的场景 → 答案选 SageMaker Clarify（使用 SHAP 值）。如果题目问\"哪种方法能逐一解释每个特征对预测结果的贡献\" → 答案是 SHAP。\n\n#### Model Cards——模型的\"身份证\"\n\n**SageMaker Model Cards** 是一种标准化的模型文档（来源：services.md ML-02 SageMaker Model Cards 描述）。打个比方：每一个药品上市前都要附带详细的说明书（适用症、禁忌症、副作用、用法用量），Model Card 就是 AI 模型的\"说明书\"。它记录了模型的目的（为什么建这个模型）、训练数据的描述（用了什么数据训练）、评估指标和结果（模型在不同维度上的表现）、预期用途和不适用场景（应该用在哪里、不应该用在哪里）、已知限制和风险。\n\nModel Card 的价值在于提升透明度——任何人（开发者、审计人员、业务方、监管者）都可以通过阅读 Model Card 来理解这个模型是怎么来的、表现如何、有什么局限。它不改变模型本身的可解释性，但提供了模型层面的元信息透明度。\n\n#### 开源模型在透明度方面的优势\n\n考纲中特别提到了开源模型的透明度优势。闭源模型（如商业 API）通常不公开训练数据、模型架构和训练方法——你只能看到输入和输出。开源模型则完全不同：代码、训练数据来源、训练方法和许可协议全部公开可审查。这意味着你可以自己验证模型是否存在偏见、审查训练数据的质量、甚至修改模型来满足特定合规要求。在 AWS 上，通过 **SageMaker JumpStart**（来源：services.md ML-05 JumpStart 描述）可以一键部署各种开源模型（如 Llama、Mistral 等），兼顾透明度和易用性。\n\n#### 监管\"解释权\"与合规要求\n\n在很多国家和地区，消费者对 AI 决策拥有**\"解释权\"（Right to Explanation）**——当 AI 做出影响消费者权益的决策时（拒绝贷款、拒绝保险理赔、拒绝入职），消费者有权要求了解原因。欧盟的 GDPR 和 AI Act 是最典型的例子，但全球越来越多的法规也在跟进。\n\n这对 AI 系统设计提出了硬性要求：如果你的模型要在受监管行业（金融、医疗、保险、招聘）中使用，就必须具备一定程度的可解释性。这并不意味着必须放弃深度模型——你可以用 SHAP/LIME 等事后解释方法给黑箱模型加上\"解释层\"，或者用 Model Cards 提供模型层面的透明度。但如果完全无法提供任何解释，在受监管场景中可能面临法律风险。\n\n#### 模型安全性与透明度之间的权衡\n\n透明度和安全性之间存在一个微妙的矛盾（来源：AWS 官方考纲 Domain 4 任务 4.2 安全性与透明度权衡）：模型越透明，越容易被攻击者理解和利用。\n\n举个例子：一个完全透明的决策树，攻击者可以清楚看到每个分支的判断条件，然后构造刚好能\"绕过\"安全检查的输入。但如果模型完全是黑箱，攻击者就很难找到可利用的弱点——代价是审计人员也同样无法审查模型。\n\n平衡策略取决于业务场景：金融服务 → 优先可解释性（法规要求）；内容创作 → 可接受较低可解释性但需要较高输出质量；安全检测 → 可能需要降低透明度以防止攻击者利用。在实际操作中，可以对内部审计人员提供详细的模型解释信息，但对外部用户只提供必要的决策因素摘要——做到\"内部高透明、外部适度透明\"。\n\n#### 可解释 AI 的以人为本设计原则\n\n考纲最后强调了可解释 AI 应当遵循以人为本的设计原则：\n\n**用户反馈机制**：用户可以评价、纠错或反馈 AI 的输出。点赞/踩、标注错误、提交反馈表单——这些机制让用户成为模型改进的参与者而非被动接受者。\n\n**AI 决策透明度**：向用户解释 AI 做出特定决策的原因。显示决策关键因素、引用数据来源——让用户知道\"AI 为什么这么说\"。Bedrock 中的 RAG 应用可以引用知识库中的原始文档作为回答的来源依据，这就是决策透明度的具体实现。\n\n**可控性**：用户可以干预或覆盖 AI 决策。人工审核面板（A2I）、版本回退——确保人类始终拥有最终决定权。\n\n**预期管理**：清晰告知 AI 系统的能力和限制。准确率提示、免责声明、置信度显示——避免用户对 AI 产生过高或不切实际的期望。\n\n#### 案例\n\n> 以下为虚构场景，仅用于辅助理解考试知识点。\n\n**场景：某保险公司使用 AI 自动审核理赔申请。** 一位客户提交了车辆事故理赔，AI 系统判定\"拒绝理赔\"。客户要求解释原因，客服人员打开系统后台，看到 SageMaker Clarify 生成的 SHAP 解释报告：事故发生时间（深夜 2 点）贡献了 -15 分、报案延迟时间（72 小时）贡献了 -20 分、损伤照片与描述不一致性评分贡献了 -18 分。客服将这三个关键因素转达给客户，客户提供了额外的延迟报案证明（因住院无法及时报案），系统重新评估后通过了理赔。同时，保险公司在模型发布时创建了 Model Card，记录了模型的适用范围（仅限车辆财产损失理赔，不适用于人身伤害理赔）和已知限制（对夜间事故存在约 5% 的误判率偏高），供内部审计和监管审查使用。这个案例串联了 SHAP 可解释性、Model Cards 文档化、解释权、以人为本设计原则中的多个要素。\n\n#### 常见误区与易错点\n\n**误区一：以为可解释性只有\"全透明\"和\"完全黑箱\"两种状态。** 实际上可解释性是一个连续光谱。决策树是天然透明的；深度模型加上 SHAP/LIME 后变得\"部分可解释\"；完全没有任何解释手段的模型才是\"完全黑箱\"。考试中给你一个\"需要提升黑箱模型可解释性\"的场景，正确答案通常是 Clarify + SHAP，而不是\"换成决策树\"（因为可能牺牲太多性能）。\n\n**误区二：把 Model Cards 和 Clarify 的作用搞混。** Model Cards 是静态文档，记录模型的元信息（目的、数据、指标、限制）；Clarify 是动态分析工具，对具体预测给出特征级别的解释。Model Cards 回答\"这个模型是什么、能干什么\"；Clarify 回答\"这个具体预测为什么是这个结果\"。\n\n**误区三：以为\"解释权\"只和可解释性工具有关。** 满足监管的\"解释权\"要求是一个系统工程——需要可解释性方法（Clarify/SHAP）提供技术解释、Model Cards 提供文档级透明度、以人为本的 UI 设计让最终用户能理解解释内容。单靠一个工具无法完全满足。\n\n#### 记忆要点\n\n- 透明模型 vs 不透明模型的典型代表：**线性回归/决策树/逻辑回归 = 透明** | **深度神经网络/LLM = 不透明（黑箱）**\n- 三种事后解释方法：**SHAP（特征贡献度，Clarify 核心技术）** | **LIME（局部近似解释）** | **特征重要性（影响排名）**\n- AWS 透明度工具链：**Clarify = 偏差检测 + SHAP 解释** | **Model Cards = 模型\"身份证\"** | **Bedrock 模型评估 = FM 性能比较**\n- 安全性 vs 透明度：**越透明越容易被攻击 ↔ 越黑箱越难审计**——按行业场景取舍\n- 以人为本四原则：**用户反馈、决策透明度、可控性、预期管理**\n"}],"tips":{"points":"| 考点编号 | 考点内容 | 频率 | 常见题型 |\n|---|---|---|---|\n| 4.1.1 | 负责任 AI 七大特征区分（偏见/公平/包容/稳健/安全/真实/可解释） | ⭐⭐⭐ | 配对题/选择题 |\n| 4.1.2.1 | Guardrails 功能（内容过滤/拒绝主题/敏感信息过滤） | ⭐⭐⭐ | 场景题 |\n| 4.1.4 | GenAI 法律风险识别 | ⭐⭐ | 选择题 |\n| 4.1.6 | 偏差 vs 方差、过拟合 vs 欠拟合概念 | ⭐⭐ | 选择题 |\n| 4.2.2 | Clarify vs Model Cards vs Model Monitor vs A2I 功能区分 | ⭐⭐⭐ | 配对题 |\n| 4.2.1 | 透明 vs 不透明模型选型 | ⭐⭐ | 场景题 |\n| 4.2.4 | 人本设计原则 | ⭐ | 选择题 |","services":"| 服务 | 主要用途 | 涉及 Task |\n|---|---|---|\n| Amazon Bedrock Guardrails | AI 内容安全过滤 | 4.1 |\n| Amazon SageMaker Clarify | 模型偏差检测、特征重要性 | 4.1, 4.2 |\n| Amazon SageMaker Model Cards | 模型文档化 | 4.2 |\n| Amazon SageMaker Model Monitor | 生产环境模型监控 | 4.1 |\n| Amazon Augmented AI (A2I) | 人工审核工作流 | 4.1 |"}},{"domain":5,"name":"安全合规治理","weight":"14%","practiceCount":12,"practice":[{"id":"D5-030","d":5,"t":"单选","q":"热点一家公司正在使用 Amazon Bedrock AgentCore 来构建、部署和大规模实施代理。该公司需要确定应使用哪些资源。从以下列表中为每个描述选择正确的 AgentCore 资源。每个资源只能选择一次或不选。热门区域：答案：解析：可观测性代码解析器浏览器工具 Amazon Bedrock AgentCore 可观测性功能通过仪表板和运行时遥测数据来监控代理行为。AgentCore 代码解析器使代理能够安全地执行支持的语言代码。AgentCore 浏览器工具提供了一种快速、安全的无服务器浏览器运行环境，代理可利用其与网站和网络应用程序进行交互。","o":[],"a":"⚠️待核（特殊题型，答案见源PDF）","e":"可观测性代码解析器浏览器工具 Amazon Bedrock AgentCore 可观测性功能通过仪表板和运行时遥测数据来监控代理行为。AgentCore 代码解析器使代理能够安全地执行支持的语言代码。AgentCore 浏览器工具提供了一种快速、安全的无服务器浏览器运行环境，代理可利用其与网站和网络应用程序进行交互。","src":451},{"id":"D5-018","d":5,"t":"单选","q":"一家公司希望从其 AWS 账户设置对Amazon Bedrock API 的私有访问。该公司还希望保护其数据不被互联网曝光。哪种解决方案能满足这些要求？","o":[{"l":"A","t":"使用Amazon CloudFront 来限制对公司私有内容的访问。"},{"l":"B","t":"使用 AWS Glue 在公司的数据目录中设置数据加密。"},{"l":"C","t":"使用 AWS Lake Formation 来管理集中式数据治理和跨账户数据共享。"},{"l":"D","t":"使用 AWS PrivateLink 在公司的虚拟私有云（VPC）与 Amazon Bedrock 之间配置私有连接。"}],"a":"D","e":"AWS PrivateLink 可在您的虚拟私有云（VPC）与 Amazon Bedrock API 之间建立私有连接，无需将数据暴露到公共互联网，从而确保所有 API 调用和数据传输都在您的 AWS 账户内保持安全和私密。","src":270},{"id":"D5-004","d":5,"t":"单选","q":"一家安全公司正在使用 Amazon Bedrock来运行基础模型(FMs)。该公司希望确保只有授权用户才能调用这些模型。公司需要识别任何未经授权的访问企图，以便为 FMs 的未来版本设置适当的 AWS 身份和访问管理(IAM)策略和角色。公司应该使用哪种 AWS 服务来识别试图访问 Amazon Bedrock的未授权用户？","o":[{"l":"A","t":"AWS Audit Manager"},{"l":"B","t":"AWS CloudTrail"}
