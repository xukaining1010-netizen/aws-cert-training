<script>

/* ================================================================
   ===================== 题库数据（构建注入 QUIZ_META + QUIZ_QUESTIONS） ================
   ================================================================ */
// 模考池隔离（构建注入 QUIZ_MOCK_POOL；无模考池的科目为空集，行为不变）
const MOCK_IDS = (typeof QUIZ_MOCK_POOL !== "undefined" && QUIZ_MOCK_POOL) ? new Set(QUIZ_MOCK_POOL) : new Set();
// 模考池题目（仅全真模考可见；练习模式与统计一律不含）
const MOCK_QUESTIONS = QUIZ_QUESTIONS.filter(q => MOCK_IDS.has(q.id));
// 计分题 id：官方 65 题里 50 题计分、15 题不计分 —— 不计分题只上卷面，不参与判分
const MOCK_SCORED = (typeof QUIZ_MOCK_SCORED !== "undefined" && QUIZ_MOCK_SCORED) ? new Set(QUIZ_MOCK_SCORED) : new Set();
const QUESTIONS = QUIZ_QUESTIONS.filter(q => !MOCK_IDS.has(q.id));
const META = (typeof QUIZ_META !== 'undefined' && QUIZ_META) ? QUIZ_META : {};
const EXAM = META.exam || 'QUIZ';
const LS_PREFIX = META.lsPrefix || EXAM.toLowerCase();

const GLOSSARY = META.glossary || {};

function getGlossaryForQuestion(q) {
  const texts = [q.q];
  if(q.o && Array.isArray(q.o)) q.o.forEach(o => texts.push(o.t));
  if(q.e) texts.push(q.e);
  const fullText = texts.join(' ');
  const found = [];
  const sorted = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
  for(const term of sorted) {
    if(fullText.includes(term)) found.push({term, def: GLOSSARY[term]});
  }
  return found;
}

/* ================================================================
   ===================== 术语高亮 + 弹定义 ================
   ================================================================ */
// 长词优先排序，独立 token 边界匹配，避免 EBS 误标 Amazon EBS 中的 EBS 等
function getGlossarySortedKeys() {
  return Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
}

// 判断术语在文本中是否为独立出现（前后非字母/数字）
function isIndependentToken(text, idx, term) {
  const before = text[idx-1];
  const after = text[idx + term.length];
  const isLetter = c => c && /[A-Za-z0-9]/.test(c);
  return !isLetter(before) && !isLetter(after);
}

// 将解析正文中的术语高亮为可点击 span，返回 HTML
function fmtExp(s){ let t=(s===undefined||s===null)?'':String(s); t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); t=t.replace(/\n/g,'<br>'); t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); return t; }
function highlightGlossaryTerms(text) {
  if(!text) return text;
  const sortedKeys = getGlossarySortedKeys();
  let result = '';
  let i = 0;
  while(i < text.length) {
    let matched = false;
    for(const term of sortedKeys) {
      if(!term) continue;
      const idx = text.indexOf(term, i);
      if(idx === i && isIndependentToken(text, idx, term)) {
        const def = GLOSSARY[term] || '（暂无定义）';
        const termEsc = term.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const defEsc = def.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        result += `<span class="gloss-term" onclick="showGlossTip(event,'${termEsc}','${defEsc}')">${term}</span>`;
        i += term.length;
        matched = true;
        break;
      }
    }
    if(!matched) {
      // 中文等宽字符直接输出，保持原文本
      result += text[i];
      i++;
    }
  }
  return result;
}

// 点击术语弹出定义浮层
function showGlossTip(e, term, def) {
  e.stopPropagation();
  const tip = document.getElementById('glossTip');
  document.getElementById('glossTipTerm').textContent = term;
  document.getElementById('glossTipDef').textContent = def || '（暂无定义）';
  tip.style.display = 'block';
  // 定位：优先在点击位置下方，避免超出视口
  const pad = 12;
  let left = e.clientX + pad;
  let top = e.clientY + pad;
  // 先渲染再量尺寸
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if(left + tw > window.innerWidth - 8) left = e.clientX - tw - pad;
  if(top + th > window.innerHeight - 8) top = e.clientY - th - pad;
  if(left < 8) left = 8;
  if(top < 8) top = 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

function closeGlossTip() {
  document.getElementById('glossTip').style.display = 'none';
}

// 点击页面其它区域关闭浮层
document.addEventListener('click', function(e) {
  const tip = document.getElementById('glossTip');
  if(tip && tip.style.display === 'block' && !tip.contains(e.target)) {
    closeGlossTip();
  }
});

// 按 Esc 关闭浮层
document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') closeGlossTip();
});

/* ================================================================
   ===================== localStorage 操作 =========================
   ================================================================ */
const LS_ANSWERS = LS_PREFIX + '_answers';
const LS_WRONG   = LS_PREFIX + '_wrong';
const LS_PROGRESS = LS_PREFIX + '_progress';

function getAnswers() { return JSON.parse(localStorage.getItem(LS_ANSWERS)||'[]'); }
function setAnswers(a) { localStorage.setItem(LS_ANSWERS,JSON.stringify(a)); }
function getWrong() { return JSON.parse(localStorage.getItem(LS_WRONG)||'[]'); }
function setWrong(w) { localStorage.setItem(LS_WRONG,JSON.stringify(w)); }
function getProgress() { return JSON.parse(localStorage.getItem(LS_PROGRESS)||'{}'); }
function setProgress(p) { localStorage.setItem(LS_PROGRESS,JSON.stringify(p)); }

/* ----------------------------------------------------------------
   作答记录：会话态 / 累计统计态分离（修复）
   旧缺陷：模拟考核误读全局 localStorage 历史 → 进场即显示「已答对/曾答错」、
   题号导航提前染色、成绩单把练习与往场算进本次（实测正确数>题数、未答为负、
   分数超满分、正确率>100%）。
   三态口径：
     · sessionResults()       本场逐题作答（quizState.results）＝「本次」唯一真源
     · sessionScopedAnswers() 视图用作答集：考核=仅本场；练习模式=全局历史（原行为）
     · recordAnswer()         仍写全局 store → 错题集与统计口径不变
   ---------------------------------------------------------------- */
function sessionResults() {
  const r = (quizState && quizState.results) || {};
  return Object.keys(r).map(id => ({id, ua:r[id].ua, ok:r[id].ok, ts:r[id].ts}));
}
function sessionScopedAnswers() {
  return (quizState && quizState.mode === 'exam') ? sessionResults() : getAnswers();
}

function recordAnswer(qId, userAnswer, isCorrect) {
  const answers = getAnswers();
  answers.push({id:qId,ua:userAnswer,ok:isCorrect,ts:Date.now()});
  setAnswers(answers);
  const wrong = getWrong();
  const idx = wrong.findIndex(w=>w.id===qId);
  if(!isCorrect) {
    if(idx>=0) { wrong[idx].count++; wrong[idx].last=Date.now(); }
    else { wrong.push({id:qId,count:1,last:Date.now(),mastered:false}); }
  }
  setWrong(wrong);
}

function markMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=true;
  setWrong(wrong);
}
function unmarkMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=false;
  setWrong(wrong);
}
function removeWrong(qId) {
  setWrong(getWrong().filter(x=>x.id!==qId));
}

/* ================================================================
   ===================== 辅助函数 =================================
   ================================================================ */
const DOMAIN_NAMES = META.domains || {};
const DOMAIN_WEIGHTS = META.weights || {};
const DOMAIN_KEYS = Object.keys(DOMAIN_NAMES).map(Number).sort((a,b)=>a-b);
const EXAM_P = META.examParams || {};
const EXAM_COUNT = EXAM_P.count || 50;
const EXAM_MIN = EXAM_P.minutes || 60;
const EXAM_PASS = EXAM_P.pass || 700;
const TYPE_NAMES = {single:'单选题',multiple:'多选题',hot:'拖拽题'};

// 走全集：模考池题目不在练习池里，但模考错题会进错题集，取题必须能取到
function getQById(id) { return QUIZ_QUESTIONS.find(q=>q.id===id); }
function shuffle(arr) { const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function generateShuffledOptions(questions) {
  const opts = {};
  const newAnswers = {};
  questions.forEach(q => {
    if(q.t==='single'||q.t==='multiple') {
      const shuffled = shuffle([...q.o]);
      const labels = 'ABCDEFGHIJ';
      const relabeled = shuffled.map((item, i) => ({l: labels[i], t: item.t}));
      opts[q.id] = relabeled;
      const contentToNewLabel = {};
      relabeled.forEach(item => { contentToNewLabel[item.t] = item.l; });
      newAnswers[q.id] = q.a.map(oldL => {
        const oldItem = q.o.find(o => o.l === oldL);
        return oldItem ? contentToNewLabel[oldItem.t] : oldL;
      });
    }
  });
  return { opts, newAnswers };
}

function getStats() {
  const answers = getAnswers();
  const wrong = getWrong();
  const totalCorrect = answers.filter(a=>a.ok).length;
  const totalAnswered = answers.length;
  const acc = totalAnswered ? Math.round(totalCorrect/totalAnswered*100) : 0;
  const doneIds = [...new Set(answers.map(a=>a.id))];
  const completion = Math.round(doneIds.length/QUESTIONS.length*100);
  const domainStats = {};
  for(const d of DOMAIN_KEYS) {
    const dQIds = QUESTIONS.filter(q=>q.d===d).map(q=>q.id);
    const dAnswers = answers.filter(a=>dQIds.includes(a.id));
    const dCorrect = dAnswers.filter(a=>a.ok).length;
    const dTotal = dAnswers.length;
    domainStats[d] = {
      total:dQIds.length, answered:dTotal, correct:dCorrect,
      acc: dTotal ? Math.round(dCorrect/dTotal*100) : 0
    };
  }
  const typeStats = {};
  for(const t of ['single','multiple']) {
    const tQIds = QUESTIONS.filter(q=>q.t===t).map(q=>q.id);
    const tAnswers = answers.filter(a=>tQIds.includes(a.id));
    const tCorrect = tAnswers.filter(a=>a.ok).length;
    const tTotal = tAnswers.length;
    typeStats[t] = { answered:tTotal, correct:tCorrect, acc: tTotal ? Math.round(tCorrect/tTotal*100) : 0 };
  }
  const recentWrong = wrong.filter(w=>!w.mastered).sort((a,b)=>b.last-a.last).slice(0,5);
  const recent = answers.slice(-20).reverse();
  let streak = 0;
  for(const a of recent) { if(a.ok) streak++; else break; }
  return {totalCorrect,totalAnswered,acc,completion,domainStats,typeStats,recentWrong,streak,doneIds:doneIds.length};
}

/* ================================================================
   ===================== 页面渲染 =================================
   ================================================================ */
let currentPage = 'dashboard';
let quizState = null;

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el = document.getElementById('page-'+page);
  if(el) el.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  if(page==='dashboard') renderDashboard();
  else if(page==='quiz') renderQuiz();
  else if(page==='wrongbook') renderWrongBook();
  else if(page==='stats') renderStats();
  else if(page==='settings') renderSettings();
}

function renderDashboard() {
  const s = getStats();
  const el = document.getElementById('page-dashboard');
  let html = `<div class="header"><h1>${EXAM} 刷题工具</h1><button class="theme-btn" onclick="toggleTheme()">${document.getElementById('quizView').classList.contains('dark')?'☀️':'🌙'}</button></div>`;
  html += `<div class="stats-grid">
    <div class="stat-card"><div class="stat-num">${s.doneIds}/${QUESTIONS.length}</div><div class="stat-label">已做题量</div></div>
    <div class="stat-card"><div class="stat-num">${s.acc}%</div><div class="stat-label">总正确率</div></div>
    <div class="stat-card"><div class="stat-num">${s.completion}%</div><div class="stat-label">完成度</div></div>
    <div class="stat-card"><div class="stat-num">${s.streak}</div><div class="stat-label">连续正确</div></div>
  </div>`;
  html += `<div class="domain-grid">`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<div class="domain-card" onclick="startDomain(${d})">
      <div class="d-name">Domain ${d}: ${DOMAIN_NAMES[d]}</div>
      <div class="d-weight">权重 ${DOMAIN_WEIGHTS[d]} | 共${ds.total}题</div>
      <div class="d-bar"><div class="d-bar-fill" style="width:${ds.acc}%"></div></div>
      <div class="d-pct">${ds.answered?ds.acc+'%正确率':'未作答'}</div>
    </div>`;
  }
  html += `</div>`;
  html += `<div class="action-btns">
    <button class="btn-primary" onclick="startContinue()">📝 继续练习</button>
    <button class="btn-primary" onclick="startWrongReview()" style="background:var(--wrong)">🔄 错题重练 (${s.recentWrong.length}题待复习)</button>
    <button class="btn-primary" onclick="startExam()" style="background:var(--correct);color:#fff">📋 模拟考核（${EXAM_COUNT}题/${EXAM_MIN}分钟/${EXAM_PASS}分及格）</button>` + (MOCK_QUESTIONS.length ? `
    <button class="btn-primary" onclick="startRealExam()" style="background:#7c3aed;color:#fff">🎯 全真模考（${MOCK_QUESTIONS.length}题 · ${MOCK_SCORED.size}题计分 / ${EXAM_MIN}分钟）</button>` : '') + `
  </div>`;
  if(s.recentWrong.length) {
    html += `<div class="recent-wrong"><h3>❌ 最近错题</h3><ul>`;
    s.recentWrong.forEach(w=>{
      const q = getQById(w.id);
      if(q) html += `<li onclick="startSingle('${w.id}')">Domain ${q.d} | ${q.q.slice(0,30)}… | 答错${w.count}次</li>`;
    });
    html += `</ul></div>`;
  }
  html += `<div class="footer-note">${META.footerNote || '题库来源：第三方中文整理，以 AWS 官方材料为准'}</div>`;
  el.innerHTML = html;
}

function renderQuiz() {
  const el = document.getElementById('page-quiz');
  if(!quizState || !quizState.questions.length) {
    el.innerHTML = `<div class="header"><button class="back-btn" onclick="navigate('dashboard')">←</button><h1>刷题</h1></div>
    <p style="text-align:center;margin-top:60px;color:var(--text2)">暂无题目，请从仪表盘选择模式开始练习</p>`;
    return;
  }
  const q = quizState.questions[quizState.currentIdx];
  const isHot = q.t === 'hot';
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  // 考核=仅本场作答；练习模式=全局历史（含本场）——防练习记录串进考核视图
  const answers = sessionScopedAnswers();
  const prevAnswers = answers.filter(a=>a.id===q.id);
  const everCorrect = prevAnswers.some(a=>a.ok);
  const everWrong = prevAnswers.some(a=>!a.ok);
  const answered = quizState.answered || {};
  let userAns = answered[q.id];
  const finished = quizState.submitted && quizState.submitted[q.id];
  const correct = finished && isAnswerCorrect(q, userAns);

  let modeLabel = quizState.mode==='exam'?'📋 模拟考核':quizState.mode==='wrong'?'❌ 错题重练':quizState.mode==='domain'?'📖 章节练习':quizState.mode==='single'?'📝 单题练习':'📝 顺序练习';

  let html = `<div class="quiz-header">
    <button class="back-btn" onclick="exitQuiz()">←</button>
    <span style="font-weight:600;font-size:15px">${modeLabel}</span>
    ${quizState.mode==='exam'?`<span class="timer" id="quizTimer"></span>`:''}
    <span class="quiz-progress">${quizState.currentIdx+1}/${quizState.questions.length}</span>
  </div>`;
  html += `<div class="quiz-meta">
    <span class="domain-tag">Domain ${q.d}</span>
    <span>${DOMAIN_NAMES[q.d]}</span>
    <span>${TYPE_NAMES[q.t]}</span>
    ${everCorrect?'<span style="background:rgba(6,214,160,.15);color:var(--correct)">已答对</span>':''}
    ${everWrong?'<span style="background:rgba(239,71,111,.15);color:var(--wrong)">曾答错</span>':''}
  </div>`;
  html += `<div class="question-text">${q.q}</div>`;

  const renderOpts = getOptionsHTML(q, userAns, finished, correct, getShuffledAnswer(q));
  html += renderOpts;

  if(isHot) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?'▶ 完成返回':'▶ 下一题'}</button>
    </div>`;
  } else if(!finished) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>✅ 确认</button>
    </div>`;
  } else {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?(quizState.mode==='exam'?'📊 交卷查看成绩':'▶ 完成返回'):'▶ 下一题'}</button>
    </div>`;
  }

  if(finished) {
    const badge = correct ? '✅ 回答正确!' : '❌ 回答错误';
    const cls = correct ? 'correct' : 'wrong';
    const gItems = getGlossaryForQuestion(q);
    let gHtml = '';
    if(gItems.length) {
      gHtml = '<div class="glossary"><div class="glossary-title">词汇附录</div>';
      gItems.forEach(g => {
        gHtml += '<div class="glossary-item"><span class="glossary-term">' + g.term + '</span><span class="glossary-def">\u00a0\u2014\u00a0' + g.def.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span></div>';
      });
      gHtml += '</div>';
    }
    html += `<div class="explanation show">
      <div class="result-badge ${cls}">${badge}</div>
      <div class="exp-text"><strong>正确答案：</strong>${formatAnswer(q)}</div>
      <div class="exp-text" style="margin-top:8px"><strong>解析：</strong>${highlightGlossaryTerms(fmtExp(q.e))}</div>
      ${q.s?`<div class="exp-source">来源：${q.s}</div>`:''}
      ${gHtml}
    </div>`;
  }

  html += `<div class="qnav"><h4>题号导航</h4><div class="qnav-grid">`;
  quizState.questions.forEach((qq, i) => {
    const qAnswers = answers.filter(a=>a.id===qq.id);
    const qCor = qAnswers.some(a=>a.ok);
    const qWro = qAnswers.some(a=>!a.ok);
    let cls = '';
    if(i===quizState.currentIdx) cls='current';
    else if(qCor) cls='done-correct';
    else if(qWro) cls='done-wrong';
    html += `<div class="qnav-item ${cls}" onclick="jumpToQuestion(${i})">${i+1}</div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
  if(!finished) updateSubmitButton();
}

function getOptionsHTML(q, userAns, finished, correct, shuffledAns) {
  let html = '';
  const qtype = q.t;
  if(qtype === 'hot') {
    html += `<div class="options-list" style="background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:16px">
      <div style="font-weight:600;color:var(--primary);margin-bottom:8px">🖱 本题为拖拽/操作题（HOTSPOT）</div>
      <div style="font-size:13px;line-height:1.7;color:var(--text2)">本题无标准 A/B/C/D 选项，答题形式为图形拖拽/区域选择。题目与图形见源 PDF 原图，答案请参照源文件。</div>`;
    if(q.e) {
      html += `<div style="margin-top:10px;font-size:13px;line-height:1.7;color:var(--text2);border-top:1px solid var(--border);padding-top:10px"><strong>解析/提示：</strong><br>${highlightGlossaryTerms(fmtExp(q.e))}</div>`;
    }
    html += `</div>`;
    return html;
  }
  if(qtype === 'single' || qtype === 'multiple') {
    const isMulti = qtype === 'multiple';
    html += `<div class="options-list">`;
    const opts = quizState.shuffledOptions && quizState.shuffledOptions[q.id] ? quizState.shuffledOptions[q.id] : q.o;
    opts.forEach(o => {
      const isSelected = userAns && userAns.includes(o.l);
      let cls = 'option-item';
      if(isMulti) cls += ' multi';
      if(isSelected && !finished) cls += ' selected';
      if(finished) {
        if(shuffledAns.includes(o.l)) cls += ' correct';
        else if(isSelected) cls += ' wrong';
      }
      const onclick = finished ? '' : `toggleOption('${o.l}')`;
      html += `<div class="${cls}" onclick="${onclick}">
        <span class="opt-label">${o.l}</span>
        <span>${o.t}</span>
      </div>`;
    });
    html += `</div>`;
    if(isMulti && !finished) html += `<div style="font-size:13px;color:var(--text2);margin-top:-12px;margin-bottom:16px">多选——请选择所有正确答案后提交（至少选 2 项）</div>`;
  }
  return html;
}

/* ================================================================
   ===================== 交互逻辑 =================================
   ================================================================ */

function toggleOption(label) {
  const q = quizState.questions[quizState.currentIdx];
  if(!quizState.answered) quizState.answered = {};
  if(q.t==='single') {
    quizState.answered[q.id] = [label];
  } else {
    const arr = quizState.answered[q.id] || [];
    const idx = arr.indexOf(label);
    if(idx>=0) arr.splice(idx,1);
    else arr.push(label);
    quizState.answered[q.id] = arr;
  }
  renderQuiz();
}

function updateSubmitButton() {
  const q = quizState.questions[quizState.currentIdx];
  if(q.t === 'hot') return;
  const ans = quizState.answered && quizState.answered[q.id];
  const btn = document.getElementById('submitBtn');
  if(!btn) return;
  if(q.t==='single') btn.disabled = !ans || !ans.length;
  else if(q.t==='multiple') btn.disabled = !ans || ans.length < 2;
}

function getShuffledAnswer(q) {
  if(quizState && quizState.shuffledAnswers && quizState.shuffledAnswers[q.id]) {
    return quizState.shuffledAnswers[q.id];
  }
  return q.a;
}

function isAnswerCorrect(q, userAns) {
  if(!userAns) return false;
  const ca = getShuffledAnswer(q);
  if(q.t==='single') return userAns[0]===ca[0];
  if(q.t==='multiple') { const a=[...userAns].sort(); const b=[...ca].sort(); return JSON.stringify(a)===JSON.stringify(b); }
  return false;
}

function formatAnswer(q) {
  const ca = getShuffledAnswer(q);
  if(q.t==='single'||q.t==='multiple') return ca.join(', ');
  if(q.t==='hot') return '本题为拖拽/操作题，答案为图形区域匹配，见源 PDF 原图';
  return '';
}

function submitAnswer() {
  const q = quizState.questions[quizState.currentIdx];
  let userAns = quizState.answered && quizState.answered[q.id];
  if(!userAns) return;
  if(q.t==='multiple' && userAns.length < 2) {
    alert('多选题至少选择 2 个答案，当前只选了' + userAns.length + '个');
    return;
  }
  const correct = isAnswerCorrect(q, userAns);
  if(!quizState.submitted) quizState.submitted={};
  quizState.submitted[q.id]=true;
  // 本场作答留痕（考核判分唯一依据；不与全局统计混用）
  if(!quizState.results) quizState.results={};
  quizState.results[q.id]={ua:[...userAns], ok:correct, ts:Date.now()};
  recordAnswer(q.id, userAns, correct);
  renderQuiz();
  updateSubmitButton();
}

function prevQuestion() {
  if(quizState.currentIdx > 0) { quizState.currentIdx--; renderQuiz(); }
}
function nextQuestion() {
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  if(isLast) {
    if(quizState.mode==='exam') renderExamResult();
    else navigate('dashboard');
  } else {
    quizState.currentIdx++;
    renderQuiz();
  }
}
function jumpToQuestion(idx) {
  quizState.currentIdx = idx;
  renderQuiz();
}
function exitQuiz() {
  // 考核中途退出必须停表：否则过期计时器归零时会把之后的练习页改写成「考核成绩单」
  if(quizState && quizState.mode==='exam') stopExamTimer();
  if(quizState && quizState.mode!=='exam') {
    setProgress({mode:quizState.mode,domain:quizState.domain||null,idx:quizState.currentIdx,time:Date.now()});
  }
  quizState = null;
  navigate('dashboard');
}

/* ================================================================
   ===================== 刷题模式启动 ==============================
   ================================================================ */
function startDomain(d) {
  const qs = QUESTIONS.filter(q=>q.d===d);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'domain',domain:d,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startContinue() {
  const p = getProgress();
  if(p.mode && p.mode!=='exam') {
    if(p.mode==='domain' && p.domain) {
      const qs = QUESTIONS.filter(q=>q.d===p.domain);
      const _sr=generateShuffledOptions(qs);
      quizState = {mode:'domain',domain:p.domain,questions:qs,currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    } else {
      const _sr=generateShuffledOptions([...QUESTIONS]);
      quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    }
  } else {
    const _sr=generateShuffledOptions([...QUESTIONS]);
    quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  }
  navigate('quiz');
}
function startWrongReview() {
  const wrong = getWrong().filter(w=>!w.mastered);
  if(!wrong.length) { alert('暂无错题需要复习！'); return; }
  const qs = wrong.map(w=>getQById(w.id)).filter(Boolean);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'wrong',domain:null,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startSingle(id) {
  const q = getQById(id);
  if(!q) return;
  const _sr=generateShuffledOptions([q]);
  quizState = {mode:'single',domain:null,questions:[q],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startExam() {
  // 模拟考核：按 meta 权重 × meta 题数分配各域配额（最大余数法，保证总和=EXAM_COUNT）
  const counts = {};
  let sumInt = 0;
  const raw = {}, rem = {};
  DOMAIN_KEYS.forEach(k => {
    const w = parseFloat(String(DOMAIN_WEIGHTS[k]||'0').replace('%',''))/100;
    raw[k] = w * EXAM_COUNT;
    counts[k] = Math.floor(raw[k]);
    rem[k] = raw[k] - counts[k];
    sumInt += counts[k];
  });
  let deficit = EXAM_COUNT - sumInt;
  const order = [...DOMAIN_KEYS].sort((a,b)=>rem[b]-rem[a]);
  let i = 0;
  while(deficit > 0) { counts[order[i % order.length]]++; deficit--; i++; }
  let selected = [];
  DOMAIN_KEYS.forEach(d => {
    const pool = shuffle(QUESTIONS.filter(q=>q.d===d && q.t!=='hot'));
    selected.push(...pool.slice(0, counts[d]));
  });
  selected = shuffle(selected);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam',domain:null,questions:selected,currentIdx:0,answered:{},submitted:{},results:{},shuffledOptions:_exam.opts,shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  // 场次标识：计时回调据此判定「本场是否仍在进行」，防过期计时器串场
  quizState.examToken = 'ex-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

function startRealExam() {
  // 全真模考：固定用模考池出卷（题数/计分结构/时长按官方口径），每次只重排题序与选项。
  // 与随机模考的区别：题目固定可复现，分数可跨场对比；题目与练习池隔离，平时练不到。
  const pool = MOCK_QUESTIONS.slice();
  if(!pool.length) { alert('本卷未配置模考池，请用随机模考'); return; }
  const selected = shuffle(pool);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam', fullMock:true, domain:null, questions:selected, currentIdx:0, answered:{}, submitted:{}, shuffledOptions:_exam.opts, shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  quizState.examToken = 'mx-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

let examTimerInterval = null;
function stopExamTimer() {
  if(examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
}
function startExamTimer() {
  let secs = quizState.examDuration;
  const token = quizState.examToken;
  const timerEl = document.getElementById('quizTimer');
  if(!timerEl) return;
  stopExamTimer();
  examTimerInterval = setInterval(() => {
    // 场次校验：已退出或已换场（新 token）立即自毁
    if(!quizState || quizState.mode!=='exam' || quizState.examToken!==token) { stopExamTimer(); return; }
    secs--;
    const m = Math.floor(secs/60), s = secs%60;
    const el = document.getElementById('quizTimer');
    if(el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if(secs<=60 && el) el.classList.add('warning');
    if(secs<=0) { stopExamTimer(); finishExam(token); }
  }, 1000);
}

function finishExam(token) {
  stopExamTimer();
  // 只对「发起本场计时」的考核会话生效
  if(quizState && quizState.mode==='exam' && (token===undefined || quizState.examToken===token)) renderExamResult();
}

function renderExamResult() {
  if(!quizState) return;
  stopExamTimer();
  const qs = quizState.questions;
  const results = quizState.results || {};
  const fullMock = !!quizState.fullMock;
  // 全真模考按官方口径只判计分题（50 题）；随机模考与其它模式仍整卷计分
  const counted = fullMock ? qs.filter(q => MOCK_SCORED.has(q.id)) : qs;
  const total = counted.length;
  // 逐题按本场作答判分；全局历史与往场作答一律不计
  let correct = 0, wrong = 0, unanswered = 0;
  const domStat = {};
  DOMAIN_KEYS.forEach(d => domStat[d] = {n:0, cor:0});
  counted.forEach(q => {
    if(!domStat[q.d]) domStat[q.d] = {n:0, cor:0};
    domStat[q.d].n++;
    const r = results[q.id];
    if(!r) unanswered++;
    else if(r.ok) { correct++; domStat[q.d].cor++; }
    else wrong++;
  });
  // 不变量自校验：正确 + 错误 + 未答 必须等于计分题数
  if(correct + wrong + unanswered !== total) console.warn('[exam] 判分不变量异常', {correct, wrong, unanswered, total});
  const el = document.getElementById('page-quiz');
  const pct = total ? Math.round(correct/total*100) : 0;
  // 1000-point scale, 700 to pass
  const scaledScore = total ? Math.round(correct/total*1000) : 0;
  const passed = scaledScore >= EXAM_PASS;
  // Time used
  const timeUsed = quizState.examStartTime ? Math.round((Date.now()-quizState.examStartTime)/1000) : 0;
  const timeM = Math.floor(timeUsed/60), timeS = timeUsed%60;

  // Domain breakdown
  let domainHtml = '';
  for(const d of DOMAIN_KEYS) {
    const dd = domStat[d] || {n:0, cor:0};
    const dPct = dd.n ? Math.round(dd.cor/dd.n*100) : 0;
    domainHtml += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${dd.n}</td><td>${dd.cor}</td><td style="color:${dPct>=70?'var(--correct)':'var(--wrong)'}">${dPct}%</td></tr>`;
  }

  el.innerHTML = `<div class="header"><button class="back-btn" onclick="exitExam()">←</button><h1>${fullMock ? '🎯 全真模考成绩单' : '📋 考核成绩单'}</h1></div>
  <div style="text-align:center;padding:30px 20px">
    <div style="font-size:48px;font-weight:700;color:${passed?'var(--correct)':'var(--wrong)'}">${scaledScore}</div>
    <div style="font-size:14px;color:var(--text2);margin:4px 0">满分 1000 分 | 及格线 ${EXAM_PASS} 分${fullMock ? " | 计分题 " + total + " 题（卷面 " + qs.length + " 题，不计分 " + (qs.length - total) + " 题）" : ""}</div>
    <div style="font-size:16px;color:var(--text);margin:12px 0;font-weight:600">${passed?'✅ 通过！':'❌ 未通过'}</div>
    <div style="display:flex;justify-content:center;gap:20px;margin:16px 0;flex-wrap:wrap">
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--correct)">${correct}</div><div style="font-size:12px;color:var(--text2)">正确</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--wrong)">${wrong}</div><div style="font-size:12px;color:var(--text2)">错误</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text2)">${unanswered}</div><div style="font-size:12px;color:var(--text2)">未答</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--primary)">${pct}%</div><div style="font-size:12px;color:var(--text2)">正确率</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text)">${timeM}分${timeS.toString().padStart(2,'0')}秒</div><div style="font-size:12px;color:var(--text2)">用时</div></div>
    </div>
  </div>
  <div class="stats-chart">
    <h3>各章节成绩</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>题数</th><th>正确</th><th>正确率</th></tr></thead><tbody>
    ${domainHtml}
    </tbody></table>
  </div>
  <div style="text-align:center;padding:20px">
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn-secondary" onclick="exitExam()" style="width:auto">返回首页</button>
      <button class="btn-primary" onclick="${fullMock ? 'startRealExam()' : 'startExam()'}" style="width:auto;flex:none">再考一次</button>
    </div>
  </div>`;
  quizState = null;
}

function exitExam() {
  quizState = null;
  navigate('dashboard');
}

/* ================================================================
   ===================== 错题集页面 ================================
   ================================================================ */
let wrongFilter = 0;

function renderWrongBook() {
  const wrong = getWrong().filter(w=>!w.mastered);
  const mastered = getWrong().filter(w=>w.mastered);
  const el = document.getElementById('page-wrongbook');
  let html = `<div class="header"><h1>❌ 错题集</h1></div>`;
  html += `<div class="wrong-stats">
    <div class="stat-card"><div class="stat-num">${wrong.length}</div><div class="stat-label">待复习</div></div>
    <div class="stat-card"><div class="stat-num">${mastered.length}</div><div class="stat-label">已掌握</div></div>
    <div class="stat-card"><div class="stat-num">${wrong.length+mastered.length}</div><div class="stat-label">共错题</div></div>
  </div>`;
  html += `<div class="wrong-tabs">
    <button class="wrong-tab ${wrongFilter===0?'active':''}" onclick="wrongFilter=0;renderWrongBook()">全部</button>`;
  for(const d of DOMAIN_KEYS) {
    html += `<button class="wrong-tab ${wrongFilter===d?'active':''}" onclick="wrongFilter=${d};renderWrongBook()">${DOMAIN_NAMES[d]}</button>`;
  }
  html += `</div>`;
  let items = wrongFilter ? wrong.filter(w=>{const q=getQById(w.id);return q&&q.d===wrongFilter}) : wrong;
  items.sort((a,b)=>b.count-a.count);
  if(!items.length) {
    html += `<p style="text-align:center;margin-top:40px;color:var(--text2)">🎉 暂无错题！</p>`;
  } else {
    items.forEach(w=>{
      const q = getQById(w.id);
      if(!q) return;
      html += `<div class="wrong-item">
        <div class="wi-header">
          <span><strong>Domain ${q.d}</strong> | ${TYPE_NAMES[q.t]}</span>
          <span style="color:var(--wrong)">答错${w.count}次</span>
        </div>
        <div style="font-size:14px;margin-bottom:6px">${q.q.slice(0,60)}${q.q.length>60?'…':''}</div>
        <div style="font-size:12px;color:var(--text2)">最近答错：${new Date(w.last).toLocaleString()}</div>
        <div class="wi-actions">
          <button onclick="startSingle('${w.id}')">📝 重练本题</button>
          <button onclick="markMastered('${w.id}');renderWrongBook()">✅ 标记已掌握</button>
          <button onclick="removeWrong('${w.id}');renderWrongBook()">🗑️ 移除</button>
        </div>
      </div>`;
    });
  }
  if(mastered.length) {
    html += `<div style="margin-top:20px"><h3 style="font-size:14px;margin-bottom:8px;color:var(--text2)">已掌握 (${mastered.length})</h3>`;
    html += `<button class="btn-secondary" onclick="if(confirm('确定清空所有已掌握的错题吗？')){setWrong(getWrong().filter(w=>!w.mastered));renderWrongBook();}" style="width:auto">清空已掌握</button></div>`;
  }
  el.innerHTML = html;
}

/* ================================================================
   ===================== 统计页面 ==================================
   ================================================================ */
function renderStats() {
  const s = getStats();
  const el = document.getElementById('page-stats');
  let html = `<div class="header"><h1>📊 统计分析</h1></div>`;
  html += `<div class="stats-chart">
    <h3>总进度</h3>
    <div style="height:30px;background:var(--border);border-radius:15px;overflow:hidden">
      <div style="height:100%;width:${s.completion}%;background:var(--primary);border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600">${s.completion}%</div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--text2)">
      <span>已答 ${s.doneIds}/${QUESTIONS.length} 题</span>
      <span>正确率 ${s.acc}%</span>
    </div>
  </div>`;
  html += `<div class="stats-chart"><h3>各章节正确率</h3><canvas id="chartDomain"></canvas></div>`;
  html += `<div class="stats-chart"><h3>各题型正确率</h3><canvas id="chartType"></canvas></div>`;
  html += `<div class="stats-chart"><h3>详细数据</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>总题</th><th>已答</th><th>正确</th><th>正确率</th></tr></thead><tbody>`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${ds.total}</td><td>${ds.answered}</td><td>${ds.correct}</td><td style="color:${ds.acc>=70?'var(--correct)':'var(--wrong)'};font-weight:600">${ds.acc}%</td></tr>`;
  }
  html += `</tbody></table></div>`;
  el.innerHTML = html;
  setTimeout(() => {
    drawDomainChart(s);
    drawTypeChart(s);
  }, 50);
}

function drawDomainChart(s) {
  const c = document.getElementById('chartDomain');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = DOMAIN_KEYS.map(k=>'D'+k);
  const colors = ['#4361ee','#4cc9f0','#06d6a0','#f8961e','#9b5de5'];
  const barW = (W-80) / (labels.length*1.5);
  labels.forEach((l,i)=>{
    const val = s.domainStats[i+1].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(l, x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

function drawTypeChart(s) {
  const c = document.getElementById('chartType');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = ['单选','多选'];
  const keys = ['single','multiple'];
  const colors = ['#4361ee','#4cc9f0'];
  const barW = (W-80) / 4;
  keys.forEach((k,i)=>{
    const val = s.typeStats[k].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

/* roundRect polyfill */
if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(r>w/2) r=w/2;
    if(r>h/2) r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    return this;
  };
}

   ===================== 设置页面 ==================================

function renderSettings() {
  const el = document.getElementById('page-settings');
  el.innerHTML = `<div class="header"><h1>⚙ 设置</h1></div>
    <div class="settings-section">
      <h3>📁 数据管理</h3>
      <button class="setting-btn" onclick="exportData()">📥 导出数据 (JSON)</button>

    <div class="settings-section">
      <h3>🎨 外观</h3>
      <button class="setting-btn" onclick="toggleTheme()">${document.getElementById('quizView').classList.contains('dark')?'☀️ 切换亮色模式':'🌙 切换暗色模式'}</button>

    <div class="settings-section">

        <p style="font-weight:600">${EXAM} 刷题小工具 v1.0</p>

      </div>
    </div>`;
}

/* ================================================================
   ===================== 工具函数 ==================================
   ================================================================ */
function exportData() {
  const data = {
    answers: getAnswers(),
    wrong: getWrong(),
    progress: getProgress(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${LS_PREFIX}-quiz-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.answers) setAnswers(data.answers);
        if(data.wrong) setWrong(data.wrong);
        if(data.progress) setProgress(data.progress);
        alert('数据导入成功！');
        navigate(currentPage);
      } catch(err) { alert('数据格式错误，请检查文件。'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetData() {
  showModal('确认重置', '确定要清除所有答题记录、错题集和进度吗？此操作不可恢复！', () => {
    localStorage.removeItem(LS_ANSWERS);
    localStorage.removeItem(LS_WRONG);
    localStorage.removeItem(LS_PROGRESS);
    navigate('dashboard');
  });
}

/* ================================================================
   ===================== 模态框 ====================================
   ================================================================ */
let modalCallback = null;
function showModal(title, text, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOverlay').classList.add('show');
  modalCallback = onConfirm;
  document.getElementById('modalConfirmBtn').onclick = () => {
    closeModal();
    if(modalCallback) modalCallback();
  };
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

/* ================================================================
   ===================== 主题切换 ==================================
   ================================================================ */
function toggleTheme() {
  document.getElementById('quizView').classList.toggle('dark');
  localStorage.setItem(LS_PREFIX+'_theme', document.getElementById('quizView').classList.contains('dark')?'dark':'light');
  navigate(currentPage);
}

/* ================================================================
   ===================== 初始化 ====================================
   ================================================================ */
function init() {
  if(localStorage.getItem(LS_PREFIX+'_theme')==='dark') document.getElementById('quizView').classList.add('dark');
  const pages = ['dashboard','quiz','wrongbook','stats','settings'];
  const app = document.getElementById('app');
  pages.forEach(p => {
    const div = document.createElement('div');
    div.id = 'page-'+p;
    div.className = 'page' + (p==='dashboard'?' active':'');
    app.appendChild(div);
  });
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => { if(btn.dataset.page==='learn'){ if(window.kbShowLearnHome) window.kbShowLearnHome(); } else navigate(btn.dataset.page); });
  });
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', init);

</script>

成员集自动重算，正好覆盖入职与调岗；该能力需要 P1 及以上许可。关联考点：官方技能点 1.1.1「创建用户和组」，内容领域 1。\n\n**其他选项为什么错：**\n- A：建已分配组后逐人添加成员。已分配组靠人工维护，属性变化不会触发成员重算。\n- B：用管理组按部门组织订阅。管理组管订阅与策略作用域，不是目录里的用户组成员。\n- D：给每个部门新建独立订阅。订阅是计费与资源边界，不能替代用户组成员资格。\n\n**关键概念：** 动态成员资格组由属性规则驱动，与手动的已分配组是两种模型。本题对应考纲 1.1.1。","s":"自编·1.1.1"},{"id":"D1-002","d":1,"t":"single","q":"要把一批用户的使用位置统一改为 CN 并保留变更留痕，最合适的做法是","o":[{"l":"A","t":"在门户逐个打开用户资料手工修改"},{"l":"B","t":"用"},{"l":"C","t":"重建这些用户账户再重新分配许可"},{"l":"D","t":"修改订阅的计费地址"}],"a":["B"],"e":"**正确答案：B。** 用 Microsoft Graph 或 PowerShell 批量更新 user 属性并留存执行日志。\n\n**为什么对：** 用户属性属于目录对象本身，批量改属性走 Graph 或 PowerShell，执行日志就是审计留痕的来源。关联考点：官方技能点 1.1.2「管理用户和组属性」，内容领域 1。\n\n**其他选项为什么错：**\n- A：在门户逐个打开用户资料手工修改。逐人操作既无批量能力，也没有统一的变更留痕。\n- C：重建这些用户账户再重新分配许可。重建会丢对象 ID、组成员与既有授权，代价远超改属性。\n- D：修改订阅的计费地址。订阅计费地址与用户对象的国家地区属性不是同一个字段。\n\n**关键概念：** usageLocation 影响许可与服务可用性，但改属性不等于改许可。本题对应考纲 1.1.2。","s":"自编·1.1.2"},{"id":"D1-003","d":1,"t":"single","q":"给 800 名员工统一分配 E3，且入职自动获得、离职自动回收，最稳的做法是","o":[{"l":"A","t":"用"},{"l":"B","t":"给每个用户在门户单独点选许可"},{"l":"C","t":"把许可绑定到订阅级别"},{"l":"D","t":"用 Azure Policy 强制分配许可"}],"a":["A"],"e":"**正确答案：A。** 用基于组的许可，把许可分配给动态安全组。\n\n**为什么对：** 组许可让成员资格变化自动触发许可增删，配合动态组即可覆盖入职与离职全流程。关联考点：官方技能点 1.1.3「在 Microsoft Entra ID 中管理许可」，内容领域 1。\n\n**其他选项为什么错：**\n- B：给每个用户在门户单独点选许可。逐人分配无法随入离职自动增删，容易漏配或留下付费许可。\n- C：把许可绑定到订阅级别。许可按用户对象分配，订阅本身不接受用户许可分配。\n- D：用 Azure Policy 强制分配许可。Policy 作用于 Azure 资源合规性，不管理目录用户许可。\n\n**关键概念：** 基于组的许可由成员资格驱动授权，是批量许可的官方推荐形态。本题对应考纲 1.1.3。","s":"自编·1.1.3"},{"id":"D1-004","d":1,"t":"single","q":"某用户已通过组获得 E3，管理员又在其用户对象上直接分配同一 E3，会发生什么","o":[{"l":"A","t":"系统会收取两份许可费"},{"l":"B","t":"直接分配会覆盖组继承并报错"},{"l":"C","t":"组许可自动失效只保留直接分配"},{"l":"D","t":"同"}],"a":["D"],"e":"**正确答案：D。** 同一 SKU 只计一份许可，不产生双重计费。\n\n**为什么对：** 组许可与直接许可共存时按去重处理，但移除组成员后直接分配仍在，容易留下回收死角。关联考点：官方技能点 1.1.3「在 Microsoft Entra ID 中管理许可」，内容领域 1。\n\n**其他选项为什么错：**\n- A：系统会收取两份许可费。同一用户的直接与组继承许可会去重，不重复计费。\n- B：直接分配会覆盖组继承并报错。两条路径可以并存，不会互相覆盖报错。\n- C：组许可自动失效只保留直接分配。组继承仍然有效，直到组成员资格被移除。\n\n**关键概念：** 排查许可占用必须同时看直接分配与组继承两条路径。本题对应考纲 1.1.3。","s":"自编·1.1.3"},{"id":"D1-005","d":1,"t":"single","q":"合作方顾问要访问本租户的 SharePoint 站点与 Teams，但不打算为其建内部账号，应采用","o":[{"l":"A","t":"在内部目录建普通成员账号借给对方"},{"l":"B","t":"把站点设成匿名公开链接"},{"l":"C","t":"通"},{"l":"D","t":"给对方订阅级 Owner 角色"}],"a":["C"],"e":"**正确答案：C。** 通过 Entra B2B 邀请外部用户并授予所需访问权限。\n\n**为什么对：** B2B 把外部身份以来宾对象引入本租户，可按对象授权、可随时撤销，不占内部成员身份。关联考点：官方技能点 1.1.4「管理外部用户」，内容领域 1。\n\n**其他选项为什么错：**\n- A：在内部目录建普通成员账号借给对方。等于把外部人员当内部成员管理，身份与审计边界都不清。\n- B：把站点设成匿名公开链接。匿名链接绕开身份管控，无法按人撤销与审计。\n- D：给对方订阅级 Owner 角色。订阅角色管 Azure 资源，且权限范围远超一个站点。\n\n**关键概念：** B2B 来宾是目录中独立对象，权限靠本租户角色与组成员资格授予。本题对应考纲 1.1.4。","s":"自编·1.1.4"},{"id":"D1-006","d":1,"t":"single","q":"启用自助式密码重置后用户仍提示未注册而无法自助重置，最可能的原因是","o":[{"l":"A","t":"SSPR 只在用户加入管理员角色后生效"},{"l":"B","t":"用"},{"l":"C","t":"重置必须接入公司内网"},{"l":"D","t":"每次重置都要全局管理员批准"}],"a":["B"],"e":"**正确答案：B。** 用户尚未完成身份验证方法注册，或注册要求未满足。\n\n**为什么对：** SSPR 依赖用户预先登记验证方式，管理员启用策略与用户完成注册是两件事。关联考点：官方技能点 1.1.5「配置自助式密码重置」，内容领域 1。\n\n**其他选项为什么错：**\n- A：SSPR 只在用户加入管理员角色后生效。SSPR 面向普通用户，与管理员角色无关。\n- C：重置必须接入公司内网。SSPR 是云端自助流程，不依赖内网接入。\n- D：每次重置都要全局管理员批准。自助的定义就是不需要管理员逐次介入。\n\n**关键概念：** 启用策略不等于用户可用，注册覆盖率是 SSPR 落地的关键指标。本题对应考纲 1.1.5。","s":"自编·1.1.5"},{"id":"D1-007","d":1,"t":"single","q":"要让运维能重启虚拟机、查看资源，但不能改他人权限，应选哪个内置角色","o":[{"l":"A","t":"虚"},{"l":"B","t":"参与者 Contributor"},{"l":"C","t":"所有者 Owner"},{"l":"D","t":"读取者 Reader"}],"a":["A"],"e":"**正确答案：A。** 虚拟机参与者 Virtual Machine Contributor。\n\n**为什么对：** 内置角色按操作集合划分，VM Contributor 只覆盖虚拟机相关管理操作，不含授权管理。关联考点：官方技能点 1.2.1「管理内置 Azure 角色」，内容领域 1。\n\n**其他选项为什么错：**\n- B：参与者 Contributor。该角色覆盖订阅内几乎所有资源类型，范围比虚拟机管理宽得多。\n- C：所有者 Owner。Owner 含分配角色的权限，超出不能改他人权限的约束。\n- D：读取者 Reader。Reader 只读，无法执行重启这类写操作。\n\n**关键概念：** 最小权限优先选窄范围的内置角色，避免直接给订阅级宽角色。本题对应考纲 1.2.1。","s":"自编·1.2.1"},{"id":"D1-008","d":1,"t":"single","q":"公司要求用户重置密码时必须提供两种验证方式，且禁止只靠安全问题，应配置","o":[{"l":"A","t":"在条件访问里新建一条阻止密码重置的策略"},{"l":"B","t":"把用户全部提升为全局管理员"},{"l":"C","t":"关闭 SSPR 改用管理员手工重置"},{"l":"D","t":"在"}],"a":["D"],"e":"**正确答案：D。** 在 SSPR 策略里把重置所需验证方法数设为 2 并停用安全问题。\n\n**为什么对：** SSPR 的验证方法数量与可用方法类型在密码重置策略里设置，安全问题因强度低应停用。关联考点：官方技能点 1.1.5「配置自助式密码重置」，内容领域 1。\n\n**其他选项为什么错：**\n- A：在条件访问里新建一条阻止密码重置的策略。条件访问管的是登录时的访问决策，不控制 SSPR 的验证方法组合。\n- B：把用户全部提升为全局管理员。管理员角色不改变 SSPR 的验证强度要求。\n- C：关闭 SSPR 改用管理员手工重置。这与自助目标相反，也没有解决验证强度配置。\n\n**关键概念：** SSPR 策略决定怎么验，条件访问决定何时放行登录，两者不是一层。本题对应考纲 1.1.5。","s":"自编·1.1.5"},{"id":"D1-009","d":1,"t":"single","q":"管理员在门户看不到某用户的经理字段值，但该字段在目录里确实有值，最合理的解释是","o":[{"l":"A","t":"该用户没有分配许可"},{"l":"B","t":"目录对象已损坏"},{"l":"C","t":"门"},{"l":"D","t":"必须切换到根管理组才能查看"}],"a":["C"],"e":"**正确答案：C。** 门户只展示部分属性，完整属性需通过 Graph 查询。\n\n**为什么对：** 门户属性页是可读子集，批量或完整属性读取应走 Graph 或 PowerShell。关联考点：官方技能点 1.1.2「管理用户和组属性」，内容领域 1。\n\n**其他选项为什么错：**\n- A：该用户没有分配许可。属性可见性与许可分配无关，许可只影响服务可用性。\n- B：目录对象已损坏。字段有值说明对象正常，只是展示层未列出。\n- D：必须切换到根管理组才能查看。管理组作用域只影响 Azure 资源治理，与目录属性展示无关。\n\n**关键概念：** 展示层看得见什么，不等于目录对象里存了什么。本题对应考纲 1.1.2。","s":"自编·1.1.2"},{"id":"D1-010","d":1,"t":"single","q":"公司在订阅上给 A 组授了 Reader，又在生产资源组上给同组授了 Contributor，该组在资源组内的权限是","o":[{"l":"A","t":"Reader，因为订阅级分配先写入"},{"l":"B","t":"C"},{"l":"C","t":"两者冲突导致拒绝访问"},{"l":"D","t":"必须先删除订阅级 Reader 才生效"}],"a":["B"],"e":"**正确答案：B。** Contributor，因为较窄作用域的分配在该范围内同样生效。\n\n**为什么对：** Azure RBAC 按管理组、订阅、资源组、资源逐层继承，同作用域内多个分配取操作并集。关联考点：官方技能点 1.2.2「在不同作用域分配角色」，内容领域 1。\n\n**其他选项为什么错：**\n- A：Reader，因为订阅级分配先写入。角色分配没有先写先赢，按作用域继承与叠加计算。\n- C：两者冲突导致拒绝访问。多个分配是叠加生效，不是冲突报错。\n- D：必须先删除订阅级 Reader 才生效。无需删除，作用域内已有更宽的分配即可。\n\n**关键概念：** 权限判定等于所有适用分配的操作并集，Deny 分配除外。本题对应考纲 1.2.2。","s":"自编·1.2.2"},{"id":"D1-011","d":1,"t":"multiple","q":"要让用户仅能管理生产资源组内的资源且不能把权限转授他人，下列做法哪些正确","o":[{"l":"A","t":"在订阅作用域分配 Contributor"},{"l":"B","t":"在资源组作用域分配 Owner"},{"l":"C","t":"在"},{"l":"D","t":"用管理组作用域分配 Reader"},{"l":"E","t":"对订阅启用只读锁"},{"l":"F","t":"不"}],"a":["C","F"],"e":"**正确答案：C、F。** 在资源组作用域分配 Contributor；不分配 Owner 或用户访问管理员角色。\n\n**为什么对：** 角色分配的作用域决定影响范围，Contributor 能管资源但不含授权管理，两者叠加正好满足约束。关联考点：官方技能点 1.2.2「在不同作用域分配角色」，内容领域 1。\n\n**其他选项为什么错：**\n- A：在订阅作用域分配 Contributor。作用域过宽，会波及订阅下所有资源组。\n- B：在资源组作用域分配 Owner。Owner 含角色分配权，违反不能转授的约束。\n- D：用管理组作用域分配 Reader。作用域在资源组之上且只读，既越界又不满足管理需求。\n- E：对订阅启用只读锁。资源锁限制资源操作，不改变 RBAC 分配的作用域。\n\n**关键概念：** 作用域选窄与角色选窄是 RBAC 设计的两条独立维度。本题对应考纲 1.2.2。","s":"自编·1.2.2"},{"id":"D1-012","d":1,"t":"single","q":"排查某用户为何能删除某资源，除了查看直接角色分配，还必须检查","o":[{"l":"A","t":"仅资源本身的资源锁状态"},{"l":"B","t":"用户的登录地点与时间"},{"l":"C","t":"订阅的预算告警配置"},{"l":"D","t":"组"}],"a":["D"],"e":"**正确答案：D。** 组继承的分配、上级作用域分配与 Deny 分配。\n\n**为什么对：** 有效权限来自直接分配、组成员资格继承、上级作用域继承，并受 Deny 分配压制。关联考点：官方技能点 1.2.3「解释访问分配」，内容领域 1。\n\n**其他选项为什么错：**\n- A：仅资源本身的资源锁状态。资源锁只限制操作，无法解释角色从何而来。\n- B：用户的登录地点与时间。登录上下文不改变 RBAC 的静态权限判定。\n- C：订阅的预算告警配置。预算与成本告警不参与任何权限计算。\n\n**关键概念：** 解释访问分配要重建完整继承链，只看一处必漏。本题对应考纲 1.2.3。","s":"自编·1.2.3"},{"id":"CASE-D1-01","d":1,"t":"single","q":"【案例背景】Contoso 有销售、研发、财务三个部门，近期扩张到 800 人，入职与调岗频繁。总部要求身份与许可随部门属性自动变化，外包团队只能管理指定生产资源组，且一条合规基线要覆盖现有与将来新建的所有订阅。\n\n入职员工需自动进入对应部门组，调岗后成员自动重算，选最省维护的方案","o":[{"l":"A","t":"建已分配组后由 HR 每月提交名单"},{"l":"B","t":"给每个部门建独立订阅"},{"l":"C","t":"建"},{"l":"D","t":"建管理组并按部门挂载订阅"}],"a":["C"],"e":"**正确答案：C。** 建动态成员资格组并用 department 写成员资格规则。\n\n**为什么对：** 动态组用属性表达式计算成员，属性变化即重算，能同时覆盖入职与调岗。关联考点：官方技能点 1.1.1「创建用户和组」，内容领域 1。\n\n**其他选项为什么错：**\n- A：建已分配组后由 HR 每月提交名单。人工名单无法随调岗实时重算，维护量随人数增长。\n- B：给每个部门建独立订阅。订阅是资源与计费边界，不承载目录组成员。\n- D：建管理组并按部门挂载订阅。管理组管订阅治理层级，与用户组成员无关。\n\n**关键概念：** 成员边界是否由属性决定，是选动态组还是已分配组的判据。本题对应考纲 1.1.1。","s":"案例组#Contoso 多部门身份治理·1.1.1"},{"id":"CASE-D1-02","d":1,"t":"single","q":"【案例背景】Contoso 有销售、研发、财务三个部门，近期扩张到 800 人，入职与调岗频繁。总部要求身份与许可随部门属性自动变化，外包团队只能管理指定生产资源组，且一条合规基线要覆盖现有与将来新建的所有订阅。\n\n财务发现离职账号仍占用 E3 许可，要从源头避免，应选","o":[{"l":"A","t":"每月导出许可清单人工比对"},{"l":"B","t":"把"},{"l":"C","t":"把许可绑到订阅上"},{"l":"D","t":"用 Azure Policy 强制回收"}],"a":["B"],"e":"**正确答案：B。** 把许可分配给动态安全组并随成员资格回收。\n\n**为什么对：** 组许可把许可绑定到成员资格，离职后成员移除即触发许可回收。关联考点：官方技能点 1.1.3「在 Microsoft Entra ID 中管理许可」，内容领域 1。\n\n**其他选项为什么错：**\n- A：每月导出许可清单人工比对。人工比对滞后且易漏，不是源头治理。\n- C：把许可绑到订阅上。许可按用户对象分配，订阅不接受用户许可绑定。\n- D：用 Azure Policy 强制回收。Policy 管资源合规，不管理目录许可。\n\n**关键概念：** 许可回收的着力点是分配路径，不是事后盘点。本题对应考纲 1.1.3。","s":"案例组#Contoso 多部门身份治理·1.1.3"},{"id":"CASE-D1-03","d":1,"t":"single","q":"【案例背景】Contoso 有销售、研发、财务三个部门，近期扩张到 800 人，入职与调岗频繁。总部要求身份与许可随部门属性自动变化，外包团队只能管理指定生产资源组，且一条合规基线要覆盖现有与将来新建的所有订阅。\n\n外包团队只能管理生产资源组且不得转授权限，正确的分配组合是","o":[{"l":"A","t":"在"},{"l":"B","t":"在订阅作用域分配 Contributor"},{"l":"C","t":"在资源组作用域分配 Owner"},{"l":"D","t":"在管理组作用域分配 Reader"}],"a":["A"],"e":"**正确答案：A。** 在资源组作用域分配 Contributor 且不分配 Owner。\n\n**为什么对：** 作用域与角色两条维度同时收窄，才能既够用又不越权。关联考点：官方技能点 1.2.2「在不同作用域分配角色」，内容领域 1。\n\n**其他选项为什么错：**\n- B：在订阅作用域分配 Contributor。作用域过宽，会覆盖订阅内其他业务资源。\n- C：在资源组作用域分配 Owner。Owner 含角色分配能力，违反不得转授。\n- D：在管理组作用域分配 Reader。既越出资源组边界又只读，不满足管理需求。\n\n**关键概念：** 最小权限是作用域与角色共同作用的结果。本题对应考纲 1.2.2。","s":"案例组#Contoso 多部门身份治理·1.2.2"},{"id":"CASE-D1-04","d":1,"t":"single","q":"【案例背景】Contoso 有销售、研发、财务三个部门，近期扩张到 800 人，入职与调岗频繁。总部要求身份与许可随部门属性自动变化，外包团队只能管理指定生产资源组，且一条合规基线要覆盖现有与将来新建的所有订阅。\n\n总部合规基线要自动覆盖现有及将来新建的所有订阅，应分配在","o":[{"l":"A","t":"逐个订阅各分配一次"},{"l":"B","t":"某个生产资源组"},{"l":"C","t":"单台虚拟机"},{"l":"D","t":"覆"}],"a":["D"],"e":"**正确答案：D。** 覆盖全部订阅的上层管理组。\n\n**为什么对：** 管理组层级让策略向下继承，新订阅落入层级即自动受控。关联考点：官方技能点 1.3.7「配置管理组」，内容领域 1。\n\n**其他选项为什么错：**\n- A：逐个订阅各分配一次。新建订阅不会自动继承，基线必然出现空档。\n- B：某个生产资源组。作用域最小，只能影响该组内资源。\n- C：单台虚拟机。资源级分配只影响一个对象，谈不上基线。\n\n**关键概念：** 治理基线靠层级继承，不靠逐点复制。本题对应考纲 1.3.7。","s":"案例组#Contoso 多部门身份治理·1.3.7"}],"sections":[{"h":"管理 Microsoft Entra 用户和组","body":"### 这一域考什么\n\n这一域不问你会不会点按钮。它问你能不能让对的人，在对的资源上，做对的事，并且事后讲得清为什么。\n\n三条线串起全章：\n\n1. **身份**：人从哪来，账号归谁管，对应任务 1.1。\n2. **授权**：这个人能碰哪些资源、能做什么，对应任务 1.2。\n3. **治理**：订阅、资源组、策略、标记、成本怎么收口，对应任务 1.3。\n\n域 3 建虚拟机、域 4 配网络，最后都要回到本域发权限。所以本域的题常带一个具体场景：谁、要干什么、该在哪一层给。\n\n### 读完这个域要能做什么\n\n这门课写给微软线做 Azure 交付与售前的同事。基线是懂云基础、能读懂 ARM 或 Bicep 模板，但没系统管过 Entra 租户。读完应能：\n\n- 说清「目录里的用户」和「资源上的角色分配」是两件事。\n- 拿到一个访问请求，判断该在哪个作用域给哪个内置角色。\n- 遇到「我明明有权限却改不了」，按有效权限逐层查，而不是再给一次 Owner。\n- 能写出一条带作用域的角色分配命令，说清每个参数从哪来。\n\n### 和其他认证怎么接\n\n这门课不是孤立的。同一件事在别家云、别的级别里换了名字，认出来就不必重学。下面四条对照都按「哪里像、哪里不一样」写，不谈哪套更好。\n\n| 其他认证课 | 对应的那件事 | 这里有什么不同 | 什么时候该想起它 |\n|---|---|---|---|\n| AWS SysOps Administrator（SOA-C03） | 用资源标签配合监控指标定位性能问题 | 两边都拿标签做归集，但 Azure 官方明确：资源不会继承资源组或订阅上的标记 | 做成本分摊、按环境筛选时 |\n| AWS DevOps Professional（DOP-C02） | 用多账号加跨账号 IAM 角色隔开爆炸半径 | Azure 是管理组到订阅再到资源组的一棵树，官方说每个订阅只有一个父级 | 划环境边界、决定权限挂哪一层时 |\n| AWS AI Practitioner（AIP-C01） | 检索层要继承原有权限，否则成了越权入口 | 同一句「继承」在 Azure 落在作用域树上，是结构保证，不靠应用自己记得做 | 判断某条权限为什么自己冒出来时 |\n| Azure Solutions Architect Expert（AZ-305） | 架构设计时要用的身份与治理底座 | 微软把 AZ-104 列为 AZ-305 的前置，本域是那门课默认你已经会的部分 | 打算往上考一门时 |\n\n对照只用来帮你迁移已有理解。做题时以本域的官方口径为准，别把别家云的默认值带进来。\n\n### 官方口径的三条边界\n\n- 官方 Study Guide 只给技能点，不给题型，也不给题数。\n- 官方考试政策原句写明：考前不公布具体考试形式或题型。\n- 官方权重是 20–25% 这样的区间，不是精确占比。\n\n这三条决定了本域的表格怎么填。凡是官方没说的，表里就写官方未公布，不拿练习题的印象补空。\n\n#### 这一节学什么\n这一节对应考纲任务 1.1「管理 Microsoft Entra 用户和组」。\n\n> 官方原名：Manage Microsoft Entra users and groups\n\n先讲身份底座。Microsoft Entra ID（微软 Entra 标识，旧名 Azure Active Directory）是目录服务，管的是「谁是谁」。用户和组都是目录里的对象。Azure 资源上的权限不直接写在用户身上，而是引到这些对象上。\n\n五个技能点按一条入职动线排：建账号 → 改属性 → 给许可 → 请外部人进来 → 让他能自助解锁。这条动线也是排障顺序。有人登不进应用，通常就沿这五步往回查。\n\n#### 创建用户和组\n\n> 官方原名：Create users and groups\n\n**这条在问什么。** 考试不会问你新建用户点哪个菜单。它给一个组织变动场景，问你账号该建在哪、用组还是逐个人、批量怎么来。\n\n**定义**：用户对象代表一个可以登录的人。组对象是用户的集合，用来一次性给一批人授权。两者都存在 Microsoft Entra ID 这个目录里，不属于任何一个 Azure 订阅。这点最容易混：删掉一个订阅，目录里的用户还在。\n\n**怎么运作**。建用户有四条常见路径：\n\n- 门户里单个新建，适合零星入职。\n- 命令行或 PowerShell 批量建，适合一次进几十人。\n- 从本地目录同步，适合已有 AD 的公司。\n- 邀请外部账号，属于另一个技能点，别和这里混讲。\n\n**什么时候用，什么时候别用**。一个项目组十个人要读同一批资源，逐人加十次角色分配，离职时还得逐个收。用组，只需一次分配，人员变动改组成员就行。代价是组名要起得让人看得懂，否则半年后没人知道这个组管什么。只有一个人、且只租两周的场景，建组反而多一层要清理的东西。\n\n💡 **场景举例**（虚构教学示意）：Contoso 制造公司新招 12 名产线工程师。管理员在目录里建一个组，把 12 人加进去，后续只给这个组配权限。有人转岗，改组成员即可，订阅侧一条分配都不用动。\n\n**关联服务**：Microsoft Entra ID（用户与组对象）、Azure 门户与 Microsoft Graph PowerShell（创建入口）。\n\n#### 管理用户和组属性\n\n> 官方原名：Manage user and group properties\n\n**这条在问什么。** 属性是账号身上那堆字段。考题爱问改了哪个字段会影响什么，或者几百人的部门信息要改、怎么改不出错。\n\n**定义**：常见属性有显示名、用户主体名称（UPN，登录用的账号串）、职务、部门、经理、使用位置。组的属性里还有成员资格类型：手动加人，或按属性规则自动收人。\n\n**怎么运作**。属性不只是通讯录。按规则收人的动态组，靠的就是部门或职务这类字段。字段填错，人就自动进错组，权限跟着错。所以批量改属性前，先确认有没有动态组在读这个字段。属性表不是通讯录，它连着授权，改之前先看清谁在读它。改完抽查几个账号，比全量核对省时间，前提是规则读准了。\n\n**什么时候用，什么时候别用**。改一个人的显示名，门户点两下最省事。改三百人的部门，写脚本批量改更快，但要先在测试租户跑一遍。别为求快直接在生产租户全量覆盖，字段写反了比不改更麻烦。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把「华东交付」并入「东区交付」。管理员先查动态组的成员规则，确认规则里写了部门字段，再批量改这三百人的部门值。改完抽查五个账号，确认他们自动落进新组、旧组里已退出。\n\n**关联服务**：Microsoft Entra ID（用户与组属性）、动态成员资格组（按属性自动收人）。\n\n#### 在 Microsoft Entra ID 中管理许可\n\n> 官方原名：Manage licenses in Microsoft Entra ID\n\n**这条在问什么。** 许可决定这个人能用哪些微软服务。题目常给「新员工登不进某个应用」或「许可快不够了」，问你从哪查、怎么分。\n\n**定义**：许可按用户发放。一个用户有了某项许可，相应服务才对他可用；没有许可，账号存在也用不了。Entra ID 里可以直接给单个用户分，也可以按组分，组成员自动获得许可。\n\n**怎么运作**。按组分是长期更省事的做法：人进组就有许可，出组就收回，不靠管理员记。代价是组一多，许可消耗会跟着组员数悄悄涨，要定期看用量。\n\n**什么时候用，什么时候别用**。临时给一个外部顾问开一周权限，直接按人分更快，别为此建一个长期组。长期岗位用按组分，把「谁该有什么许可」固化进组的命名和归属里。许可不够用时，先查按组分的那几个组员数，通常比逐个人查快。\n\n🔴 官方许可清单与定价随租户、地区、协议变动，这里不列具体档位和价格。给公司算钱时，以官方页面当期口径为准。\n\n💡 **场景举例**（虚构教学示意）：Contoso 给财务岗建一个长期组，按组分许可。新财务入职只加组，应用当天可用。同一周请来的审计顾问，按人单独分一份，项目结束直接收回，不进任何长期组。\n\n**关联服务**：Microsoft Entra ID（许可分配）、Microsoft 365 管理中心（许可购买与用量视图）。\n\n#### 管理外部用户\n\n> 官方原名：Manage external users\n\n**这条在问什么。** 公司外的人要访问你的应用或资源，是给他建一个内部账号，还是请他进来做访客。这一点的分寸几乎每套 AZ-104 练习都会碰。\n\n**定义**：Microsoft Entra B2B 协作让外部伙伴用自己组织的账号登录你的租户。官方说明写得很直白：访客接受邀请后，在你的目录里表示为一个用户对象，用户类型通常是 guest，用户主体名称里带 `#EXT#` 标识。\n\n**怎么运作**。你发邀请，对方用自己的账号接受，目录里出现一个访客对象。之后给这个对象分应用、分组、给资源角色，和内部用户是同一套动作。企业数据仍留在你这侧，控制权没有转出去。邀请不要求对方在你这里另记一套密码，这点常被忽略。\n\n**什么时候用，什么时候别用**。外部顾问只合作三个月，用访客最合适：到期收回权限、停用对象即可，不用管他在原单位的账号生命周期。要长期坐班、按内部流程管设备和合规，就走内部账号，别让访客对象混进内部组里。\n\n💡 **场景举例**（虚构教学示意）：Contoso 请一家设备厂商调产线，厂商工程师需要只读看某资源组的监控。管理员发 B2B 邀请，对方用本公司账号接受，目录里生成带 `#EXT#` 的访客对象。管理员把它加进只读组，项目结束就移除，全程不新建内部账号。\n\n**关联服务**：Microsoft Entra External ID（B2B 协作）、Microsoft Entra ID（访客用户对象）。\n\n#### 配置自助式密码重置\n\n> 官方原名：Configure self-service password reset (SSPR)\n\n**这条在问什么。** 用户忘记密码或被锁，能不能自己解开，不用找服务台。配置题问的是启用范围、先决条件和验证方式。\n\n**定义**：自助式密码重置（SSPR）让用户自己改密码或重置密码。官方原句是：不需要管理员或服务台介入。账户被锁定或忘记密码时，用户按提示操作就能回到工作状态。\n\n**怎么运作**。官方讲了一条硬前提：用户必须先注册自己要用的身份验证方法。没注册，流程走不起来。管理员侧要定三件事：\n\n- 哪些人启用，是全租户还是先放一个试点组。\n- 重置时要验几种方法、允许用哪几种。\n- 用户注册信息要不要强制定期复核。\n\n**什么时候用，什么时候别用**。全租户一次开，看着利落，但没注册验证方法的用户会卡在门口，服务台电话反而变多。先对一组人试点，把注册率拉起来再扩，是更稳的走法。只有十几个人的小租户，直接全开也行，省掉分批的账。\n\n🔴 这条在常见练习里见得少，复习时容易被跳过。官方 Study Guide 明列了它，别因为眼生就不看。\n\n💡 **场景举例**（虚构教学示意）：Contoso 先对 IT 组 20 人启用 SSPR，要求每人注册两种验证方法。两周后注册率到 95%，服务台没接到解锁类工单，再分批推给全公司。若一上来全租户开，另外八百人没注册，等来的会是集中报障。\n\n**关联服务**：Microsoft Entra ID（SSPR 策略与身份验证方法注册）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「用户建在订阅里，删订阅就没了」 | 目录对象与订阅是两套层级 | 用户和组在 Microsoft Entra ID，订阅只是作用域之一 |\n| 「权限直接写在用户身上最好查」 | 逐人分配会随人员变动腐化 | 用组做一次分配，人员变动改组成员 |\n| 「外部伙伴先建个内部账号最省事」 | 到期难收、身份归属也不清 | 短期协作用 B2B 访客对象，权限随用随收 |\n| 「SSPR 打开就能用」 | 漏了验证方法注册这个前提 | 用户先注册，管理员再定启用范围与验证强度 |\n\n#### 记忆要点\n\n1. **身份底座**：用户和组住在 Microsoft Entra ID，不住在订阅里。\n2. **授权习惯**：给组分配，不逐人分配；动态组靠属性值收人。\n3. **许可两路**：临时按人，长期按组；留意组员数带涨的消耗。\n4. **外部人**：短期用 B2B 访客，目录里是带 `#EXT#` 的 guest 对象。\n5. **SSPR 前提**：先注册身份验证方法，再谈启用范围。\n\n---"},{"h":"管理对 Azure 资源的访问","body":"#### 这一节学什么\n这一节对应考纲任务 1.2「管理对 Azure 资源的访问」。\n\n> 官方原名：Manage access to Azure resources\n\n任务 1.1 解决「谁是谁」，这里解决「能做什么」。Azure 用基于角色的访问控制（Azure RBAC）把权限落到资源上。三个技能点是一条判题链：认角色 → 挑作用域 → 解释有效权限。\n\n#### 管理内置 Azure 角色\n\n> 官方原名：Manage built-in Azure roles\n\n**这条在问什么。** 考题给一个岗位和一串动作，问你给哪个现成角色就够，别自己造轮子。\n\n**定义**：角色定义是一组允许的动作。官方把一次角色分配拆成三要素：安全主体、角色定义、作用域。安全主体可以是用户、组、服务主体或托管标识。三者齐了，权限才算落地。安全主体这个词看着抽象，其实问的就是「谁」。人、组、应用、托管标识都算。所以给自动化脚本授权，和给同事授权，走的是同一套动作。\n\n**四个最常用的内置角色**（取自官方内置角色表）：\n\n- **Owner（所有者）**：完全管理所有资源，还能在 Azure RBAC 里分配角色。\n- **Contributor（参与者）**：完全管理所有资源，但不能分配角色。\n- **Reader（读取者）**：只能看，不能改。\n- **User Access Administrator（用户访问管理员）**：管别人对 Azure 资源的访问。\n\n**什么时候用，什么时候别用**。内置角色覆盖得了就别建自定义角色。自定义角色要自己维护动作清单，服务一加新动作就得跟，长期是笔隐性账。真要建，先写清内置角色多给了哪一条、为什么必须收掉。官方也说明内置角色不满足时才可以自建。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的运维同事要重启虚拟机、改配置，但不该决定谁能进这个订阅。给 Contributor 正好；给 Owner 就把授权权也交出去了，属于多给。\n\n**关联服务**：Azure RBAC（角色定义与分配）、Microsoft Entra ID（安全主体的来源）。\n\n#### 在不同作用域分配角色\n\n> 官方原名：Assign roles at different scopes\n\n**这条在问什么。** 同一个角色，挂在不同层级，效果差很远。题目常问只让某人管这一个资源组，该在哪一层给。\n\n**定义**：官方把作用域定义成「访问所适用的资源集合」。Azure 有四层作用域：\n\n- 管理组\n- 订阅\n- 资源组\n- 单个资源\n\n四层是父子关系，越往下越具体。你可以在任意一层分配角色，选哪一层就决定了这套权限覆盖多大范围。\n\n**怎么运作**。在订阅层给 Reader，适用的资源集合包含订阅下所有资源组和资源。在单个资源组层给，就只覆盖这一组。官方管理组文档另有一句要记住：治理条件会按继承向下传递到关联的所有订阅。所以往高层挂一条分配，影响面比新手想的大。\n\n动手看一眼。官方《CLI》文档给的顺序是先查到对象和资源组，再把三要素写进一条命令：\n\n```bash\naz ad user show --id \"{principalName}\" --query \"id\" --output tsv\naz group list --query \"[].{name:name}\" --output tsv\naz role assignment create --assignee \"{assignee}\" \\\n  --role \"{roleNameOrId}\" \\\n  --scope \"/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}\"\n```\n\n把 `--scope` 换成 `/subscriptions/{subscriptionId}` 就是订阅层，换成单个资源则要一直写到资源类型与名称。作用域写在哪一层，权限就落到哪一层。这是四层结构在命令行里的原形。\n\n**什么时候用，什么时候别用**。想省事，往订阅层一挂最省点击。但一个订阅里常混着生产与测试，挂高了等于把测试环境的权限也送出去。默认从资源组这一层起给，确实需要跨组再往上提，并且写清理由。\n\n💡 **场景举例**（虚构教学示意）：产线监控只读，只需覆盖一个生产资源组。管理员在这个资源组上给只读组分配 Reader，而不是在订阅层给。后来新建一个测试资源组，那批人自动没有它的权限，符合最小授权。\n\n**关联服务**：Azure RBAC（作用域）、管理组与资源组（层级容器）。\n\n#### 解释访问分配\n\n> 官方原名：Interpret access assignments\n\n**这条在问什么。** 这点是全节最容易丢分的：用户说「我有 Contributor，为什么删不掉」。你要能按判定顺序把有效权限讲清楚，而不是再加一个 Owner 糊过去。\n\n**怎么运作**。官方 RBAC 概览写了判定过程：用户对某资源发起操作，Azure 资源管理器先取回适用于这个资源的全部角色分配与拒绝分配。有拒绝分配适用，就直接拦下；没有，才把适用于该用户或其所属组的角色分配缩出来继续判断。\n\n**看有效权限的三条习惯**：\n\n- 先数叠加：同一个用户可能在多个作用域、经多个组拿到多条分配。\n- 再看拒绝：拒绝分配优先于允许，别只盯着允许列表。\n- 最后分层：资源锁是另一层保护，不是角色。父级挂的删除锁会让所有角色都删不掉，这和 RBAC 判定不是一回事。\n\n**什么时候用，什么时候别用**。遇事加 Owner 是最快也最坏的解法。它把「这一次为什么被拦」变成「以后什么都不会被拦」。先把有效权限逐层查清，再决定是改分配、改作用域，还是解一道锁。\n\n💡 **场景举例**（虚构教学示意）：Contoso 一位工程师有 Contributor，却删不掉某台虚拟机。管理员查有效权限，发现角色分配正常，真正的拦路是订阅层继承下来的 CanNotDelete 锁。官方说明父作用域的锁会向下继承，且继承链里最严的那道优先。处置是评估后调整锁，不是给他升 Owner。\n\n**关联服务**：Azure RBAC（有效权限与拒绝分配）、资源管理锁（跨角色的另一层限制）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「Contributor 和 Owner 差不多」 | 差在能不能把权限再分给别人 | Owner 含分配角色的能力，Contributor 明确不含 |\n| 「在订阅给权限最方便，就都挂订阅」 | 影响面覆盖订阅下全部资源组 | 默认从资源组给，需要跨组才上提，并写清理由 |\n| 「有 Contributor 就该能删一切」 | 漏看拒绝分配与资源锁两层 | 拒绝分配优先；锁对所有角色生效，属另一层 |\n| 「查不到就再给一个 Owner」 | 用放大权限掩盖真实拦路原因 | 逐层查有效权限，再决定改分配还是解锁 |\n\n#### 记忆要点\n\n1. **三要素**：一次角色分配 = 安全主体 + 角色定义 + 作用域，缺一不落地。\n2. **四内置角色**：Owner 多一项「分配角色」，Contributor 没有，Reader 只读，用户访问管理员专管授权。\n3. **四层作用域**：管理组 → 订阅 → 资源组 → 资源，越往下越具体。\n4. **判定顺序**：先看拒绝分配，再看适用的允许分配。\n5. **锁不是角色**：CanNotDelete 会从父作用域继承，对所有角色生效。\n\n---\n\n#### 案例\n\n**💡 综合案例：Contoso 的产线只读交接**\n\n> 这一节先讲清共同背景。后面的几道题都从这里出发，每道只考一个技能点。做完可以展开解析，看它对应官方考纲哪一条。\n\n虚构教学场景：Contoso 有一条产线，生产资源组里放着监控与配置资源。设备厂商派两名工程师来调机，合作期三个月。他们需要读监控数据，但不应改动任何配置。同期公司新招三名产线工程师，需要能重启采集服务。公司内部还有一位工程师反馈：自己有 Contributor，却删不掉一台旧虚拟机。\n\n这份背景把本域十五个技能点串成一条线。外部工程师用访客对象进来，权限通过组落到单个资源组。新人入职走组和许可两条路。删不掉的那台机器，要往有效权限与锁上去查。每道题只考其中一个技能点，共享同一份背景。\n\n治理侧也在这条线上：标记打在资源组却没打到资源，预算告警没能拦住费用继续涨，管理组的策略为什么落到了新订阅上。这些属于任务 1.3，和前面的身份、授权是同一套组织场景。\n\n案例题只在课程里出现，不进刷题工具，也不计入模拟考。真实考场的案例卡有左栏资料菜单，界面手感请到官方 Exam Sandbox 体验。\n\n---"},{"h":"管理 Azure 订阅和治理","body":"#### 这一节学什么\n这一节对应考纲任务 1.3「管理 Azure 订阅和治理」。\n\n> 官方原名：Manage Azure subscriptions and governance\n\n前两个任务管的是「谁」和「能做什么」。这个任务管的是「这些东西收在哪个边界里，规矩怎么一次套下去」。七个技能点看着散，其实分两类：前五点定容器和边界，后两点定跨边界的治理与成本。\n\n#### 实现和管理 Azure Policy\n\n> 官方原名：Implement and manage Azure Policy\n\n**这条在问什么。** 题目给一条公司规定，比如「存储账号只能建在指定区域」，问你用什么让这条规定对所有资源生效，而不是靠每个人记得配。\n\n**定义**：Azure Policy 用策略定义给资源定规则。官方的说法是：策略定义对资源强制执行规则与效果。它和 RBAC 管的不是一件事。RBAC 决定谁做什么，Policy 决定做出来的资源得长什么样。一个人有 Contributor，照样能被策略拦下不合规的建法。\n\n**怎么运作**。一次生效走三步：写策略定义、按作用域分配、看合规性结果。效果决定违规时发生什么，官方列出的效果包括 `deny`（拦下）、`audit`（只记录）、`append`（补字段）、`modify`（改属性）、`deployIfNotExists`（补部署）、`disabled`（先停用）。多个定义能打包成一个计划，一次分配覆盖整套规矩。官方也提示，同一条定义可能适用多个效果，把效果值做成参数更便于按环境切。\n\n**什么时候用，什么时候别用**。要拦住不合规的创建动作，用 `deny`。刚上线、想先摸清存量有多少违规，先用 `audit`。直接上 deny，历史部署脚本会在无人知晓时集体失败。Policy 也不替代 RBAC，别拿它管人。\n\n💡 **场景举例**（虚构教学示意）：Contoso 规定生产订阅的资源只能建在两个指定区域。管理员先按 `audit` 分配策略，看一周合规报表，摸清存量里有多少例外；确认影响面后再把效果切成 `deny`。同期新建的资源从第一天起就合规。\n\n**关联服务**：Azure Policy（定义、计划、分配、合规性）、管理组与订阅（分配作用域）。\n\n#### 配置资源锁\n\n> 官方原名：Configure resource locks\n\n**这条在问什么。** 题目常写「谁能删都行，但这台机器就是不许删」。答案不是给谁降权，是加一道锁。\n\n**定义**：官方给两种锁级别。`CanNotDelete` 允许授权用户读和改，但不能删。`ReadOnly` 只允许读，连改都不行。命令行里就叫这两个名字，门户里显示为「删除」和「只读」。\n\n**怎么运作**。官方讲清了继承：在父作用域加锁，该作用域内所有资源都继承同一道锁，后来加进来的资源也继承。锁对所有角色生效，Owner 也不例外。这正是它和 RBAC 的分工边界：RBAC 管谁能发起操作，锁管这个操作本身允不允许发生。下面几行逐字取自官方文档。\n\n```powershell\nNew-AzResourceLock -LockName LockGroup -LockLevel CanNotDelete -ResourceGroupName exampleresourcegroup\nGet-AzResourceLock\n```\n\n```bash\naz lock create --name LockGroup --lock-type CanNotDelete --resource-group exampleGroup\naz lock list --resource-group exampleGroup\n```\n\n**什么时候用，什么时候别用**。怕误删就挂 `CanNotDelete`，日常运维还能改配置。`ReadOnly` 更严，会让在线调整也做不了，用前先确认没人需要改。别在管理组根上随手挂锁，继承下去会波及全部订阅。要解锁就删锁，别用升权绕过。\n\n💡 **场景举例**（虚构教学示意）：Contoso 给生产资源组挂 `CanNotDelete`。后来一位 Owner 想清理旧虚拟机，删除被拦。查过锁之后按流程评估、临时移除锁再删，而不是怀疑自己的角色没生效。\n\n**关联服务**：资源管理锁、Azure RBAC（分工）、资源组与订阅（锁作用域）。\n\n#### 在资源上应用和管理标记\n\n> 官方原名：Apply and manage tags on resources\n\n**这条在问什么。** 成本要按部门分摊、资源要按环境筛选，题目问标记打在哪一层、会不会自动往下传。后半句是最容易被考的反直觉点。\n\n**定义**：标记是资源上的名值对。官方说可以打在资源、资源组、订阅上，但不能打在管理组上。标记名在执行操作时大小写不敏感，不过资源提供程序可能各自保留原本的大小写写法。\n\n**怎么运作**。关键一句官方原话：资源不会继承你打在资源组或订阅上的标记。想让组内资源都带上同一组值，得显式给每个资源也打一遍，或者用策略自动补齐。所以光给资源组打标记，成本报表里那些资源仍是空的。\n\n**什么时候用，什么时候别用**。标记适合做成本归集、环境筛选、负责人归属。它不适合当权限判据，别指望用标记控制谁能看什么。命名要先定一套字典再铺开，否则 `Env`、`env`、`Environment` 三种写法会让报表对不上。\n\n💡 **场景举例**（虚构教学示意）：Contoso 给生产资源组打上成本中心标记，月末报表里组内虚拟机却都没归进去。原因是标记不向下继承。管理员改用策略给组内资源补齐标记，下个月报表才对上。\n\n**关联服务**：资源管理器标记、Azure Policy（自动补标记）、Cost Management（按标记分摊）。\n\n#### 管理资源组\n\n> 官方原名：Manage resource groups\n\n**这条在问什么。** 题目问一批资源该不该放同一个组、删组会连带发生什么、模板部署该挂在哪一层。\n\n**定义**：资源组是资源的生命周期容器。同一组里的资源通常一起创建、一起授权、一起删除。删掉资源组，组内资源一并删除，Azure 资源管理器会按依赖顺序处理删除。\n\n**怎么运作**。官方《CLI》文档把这一组动作列得很直白，下面逐字取自该页：\n\n```bash\naz group create --name demoResourceGroup --location westus\naz group list\naz group show --name exampleGroup\naz group delete --name exampleGroup\n```\n\n模板部署也以资源组为落点：\n\n```bash\naz deployment group create --resource-group exampleGroup --template-file storage.bicep\n```\n\n**什么时候用，什么时候别用**。按生命周期和授权边界分组，比按技术类型分组更经得起变动。把生产和测试塞进同一个组，一次删组就是两个环境一起没，权限也没法分开给。反过来，一个组只放一个资源，组就白建了。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把某条产线的采集服务、监控和它专用的存储放一个资源组，整条线退役时一次删除干净。测试线单独建组，两边权限互不牵连。\n\n**关联服务**：资源组、Azure 资源管理器、Bicep 与 ARM 模板部署。\n\n#### 管理订阅\n\n> 官方原名：Manage subscriptions\n\n**这条在问什么。** 题目给「公司要把两条业务线分开计费和管控」，问边界划在哪一层。订阅既是计费单位，也是 RBAC 的作用域之一。\n\n**定义**：订阅把资源、配额和账单收在一个边界里。管理组在它之上，资源组在它之下。一个目录可以有多个订阅，每个订阅只挂一个管理组父级。\n\n**怎么运作**。命令行操作前先确认当前落在哪个订阅，否则命令会打到另一条业务线上。下面三行逐字取自官方 CLI 与预算教程：\n\n```bash\naz login\naz account set --subscription \"Your Subscription\"\naz account list --query \"[].{name:name, id:id}\" --output tsv\n```\n\n取订阅 ID、取管理组名与 ID，官方文档也都给了对应命令。把 `--scope` 写成订阅层时，用的就是这里查出来的 ID。\n\n**什么时候用，什么时候别用**。业务线之间要分开账单、分开配额、分开授权，才值得拆订阅。只想隔离两个应用，用资源组更轻，拆订阅会多出一套要维护的策略和权限。反过来，把几年里所有业务塞进一个订阅，成本归集和治理都会缠在一起。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把制造业务和对外平台拆成两个订阅，成本和配额各自清楚。产线下的采集与监控仍放同一个资源组，没有多拆一层。\n\n**关联服务**：订阅、Azure 资源管理器（作用域）、Cost Management（计费边界）。\n\n#### 用警报、预算和 Azure Advisor 建议管理成本\n\n> 官方原名：Manage costs by using alerts, budgets, and Azure Advisor recommendations\n\n**这条在问什么。** 题目问怎么在花超之前收到通知，以及预算到线会不会自动停机。后半句是个高频陷阱。\n\n**定义**：官方把成本告警分成三类：预算告警、额度告警、部门支出配额告警，另外还能开成本异常告警。预算按实际或预测成本设阈值触发通知。\n\n**怎么运作**。官方预算教程有句要记牢：阈值被超过时触发通知，资源不受影响，消费也不会被停止。预算是观察和提醒工具，不是熔断器。真要限制消费，得用策略或配额。下面这行逐字取自官方教程：\n\n```powershell\nNew-AzConsumptionBudget -Amount 100 -Name TestPSBudget -Category Cost -StartDate 2020-02-01 -TimeGrain Monthly -EndDate 2022-12-31 -ContactEmail test@test.com -NotificationKey Key1 -NotificationThreshold 0.8 -NotificationEnabled -ContactGroup $ActionGroupId\n```\n\nAzure Advisor 是另一路。官方说它分析配置与遥测后给出主动的、可执行的建议，覆盖成本、性能、可靠性、安全与卓越运营。它只给建议，不自动改动资源。\n\n**什么时候用，什么时候别用**。想早知道、早有人处理，用预算加告警，阈值设在实际成本的八成留反应时间。想找闲置资源降本，看 Advisor 的成本建议。别把预算当成「到线就停」的保险，也别指望 Advisor 替你执行整改。\n\n💡 **场景举例**（虚构教学示意）：Contoso 给生产订阅设了月度预算，八成时发通知。某月费用继续涨到超额，系统没有停任何资源，是值班同事收到邮件后去查，发现一台忘了关的测试机。\n\n**关联服务**：Cost Management（预算与成本告警）、Azure Advisor（建议）、Azure Policy（真正限制动作）。\n\n#### 配置管理组\n\n> 官方原名：Configure management groups\n\n**这条在问什么。** 题目问几十个订阅怎么一次套上同一套治理条件，而不是逐订阅配一遍。\n\n**定义**：管理组是订阅之上的层级容器。官方给的硬数字是：单个目录最多支持 10,000 个管理组，树最多六层深，根级和订阅级不计入这六层，每个管理组和订阅只能有一个父级。\n\n**怎么运作**。把订阅放进管理组后，施加的治理条件会按继承逐级传到所有关联订阅。策略分配、RBAC 分配都可以挂在这一层。层级要一次想清楚，因为父级唯一，改挂靠会连带改动继承来的全部条件。下面这行逐字取自官方《CLI》文档：\n\n```bash\naz account management-group list --query \"[].{name:name, id:id}\" --output tsv\n```\n\n**什么时候用，什么时候别用**。订阅多到需要按业务线或环境统一套规则时，用管理组。只有一两个订阅、规则也很简单，直接在订阅层配更省心，多一层树就多一层排障要看的地方。别把管理组当成文件夹来分项目，它是治理条件的传播路径。\n\n💡 **场景举例**（虚构教学示意）：Contoso 按生产和沙箱建两个管理组，把对应订阅挂进去。一条「只允许指定区域」的策略分配在生产管理组上，之后新加的生产订阅自动继承，不用再配一次。\n\n**关联服务**：管理组、Azure Policy（层级分配）、Azure RBAC（层级分配）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「资源组打了标记，组内资源就都有了」 | 官方明确标记不向下继承 | 要给资源显式补打，或用策略自动补 |\n| 「Owner 权限最大，锁也拦不住」 | 锁对所有角色生效 | 锁管操作本身，RBAC 管谁发起 |\n| 「预算到线就会停用资源」 | 官方说资源不受影响、消费不停止 | 预算只触发通知，限制要另用策略或配额 |\n| 「Policy 和 RBAC 是一回事」 | 一个管资源合不合规，一个管人能不能做 | 有 Contributor 也会被 deny 拦下 |\n| 「管理组就是给订阅分组的文件夹」 | 它是治理条件的传播路径 | 父作用域的规则按继承传到全部下级订阅 |\n\n#### 记忆要点\n\n1. **两个不继承要分清**：锁从父作用域向下继承，标记不会从资源组向资源继承。\n2. **Policy 管合规，RBAC 管授权**：`audit` 先看存量，`deny` 再拦新建。\n3. **预算只通知不停机**：要真限制，另找策略或配额。\n4. **容器顺序**：管理组 → 订阅 → 资源组 → 资源，每个下级只有一个父级。\n5. **管理组硬数字**：单目录 10,000 个、树深六层，根级与订阅级不计入。\n\n---"}],"tips":{"points":"| 考点 | 内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 创建用户和组（1.1.1） | 目录对象与订阅分层，组授权优于逐人 | 官方未公布 | 官方未公布 |\n| 用户和组属性（1.1.2） | 属性驱动动态组，批量改前先查规则 | 官方未公布 | 官方未公布 |\n| 许可管理（1.1.3） | 按人 / 按组两条分配路径 | 官方未公布 | 官方未公布 |\n| 外部用户（1.1.4） | B2B 访客对象与 `#EXT#` 标识 | 官方未公布 | 官方未公布 |\n| 自助式密码重置（1.1.5） | 验证方法注册是硬前提，先试点再铺开 | 官方未公布 | 官方未公布 |\n| 内置角色（1.2.1） | Owner 与 Contributor 的分界在授权权 | 官方未公布 | 官方未公布 |\n| 作用域分配（1.2.2） | 四层父子作用域，默认从资源组给 | 官方未公布 | 官方未公布 |\n| 解释访问分配（1.2.3） | 拒绝分配优先，锁是另一层 | 官方未公布 | 官方未公布 |\n| Azure Policy（1.3.1） | 合规规则与效果，先 audit 后 deny | 官方未公布 | 官方未公布 |\n| 资源锁（1.3.2） | 锁继承且对所有角色生效，与 RBAC 分工 | 官方未公布 | 官方未公布 |\n| 资源标记（1.3.3） | 不向资源继承，不能打在管理组 | 官方未公布 | 官方未公布 |\n| 资源组（1.3.4） | 生命周期容器，删组连带删资源 | 官方未公布 | 官方未公布 |\n| 订阅（1.3.5） | 计费与作用域边界，命令行须先确认落点 | 官方未公布 | 官方未公布 |\n| 成本与 Advisor（1.3.6） | 预算只通知不停机，Advisor 只建议不执行 | 官方未公布 | 官方未公布 |\n| 管理组（1.3.7） | 治理条件按继承下传，父级唯一 | 官方未公布 | 官方未公布 |","services":"| 服务 | 主要用途 | 涉及任务 |\n|---|---|---|\n| Microsoft Entra ID | 用户、组、属性、许可、SSPR 策略 | 1.1 |\n| Microsoft Entra External ID | B2B 协作与外部访客对象 | 1.1 |\n| Azure RBAC | 角色定义、作用域分配、有效权限判定 | 1.2 |\n| 管理组 / 订阅 / 资源组 | 四层作用域容器 | 1.2、1.3 |\n| 资源管理锁 | 跨角色的删除与只读保护 | 1.2、1.3 |\n| Azure Policy | 资源规则与合规性约束 | 1.3 |\n| Cost Management / 预算 | 成本告警、预算阈值、按标记分摊 | 1.3 |\n| Azure Advisor | 成本、可靠性、安全与卓越运营建议 | 1.3 |\n| Azure CLI / PowerShell | 角色分配、锁、资源组与预算命令，逐字取自官方文档 | 1.2、1.3 |","furtherReading":"| 页面 | 什么时候去看 | URL |\n|---|---|---|\n| AZ-104 Study Guide | 5 域 / 15 组 / 81 技能点原文与权重区间 | https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104 |\n| Azure RBAC overview | 角色分配三要素、拒绝分配判定顺序 | https://learn.microsoft.com/en-us/azure/role-based-access-control/overview |\n| Understand scope | 四层作用域定义与父子关系 | https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview |\n| Azure built-in roles | Owner / Contributor / Reader / 用户访问管理员官方描述 | https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles |\n| SSPR how it works | 无需服务台、须先注册验证方法 | https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-howitworks |\n| What is B2B collaboration | 访客用户对象与 `#EXT#` 标识 | https://learn.microsoft.com/en-us/entra/external-id/what-is-b2b |\n| Management groups overview | 治理条件按继承向下传递 | https://learn.microsoft.com/en-us/azure/governance/management-groups/overview |\n| Lock your Azure resources | CanNotDelete / ReadOnly、锁继承、与 RBAC 的分工 | https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources |\n| Exam duration and experience | 官方不公布具体题型 | https://learn.microsoft.com/en-us/credentials/support/exam-duration-exam-experience |\n| Assign Azure roles using Azure CLI | 角色分配三要素与四层 `--scope` 写法 | https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-cli |\n| Tag resources | 标记不继承、大小写口径、可打层级 | https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources |\n| Manage resource groups (CLI) | 资源组增删查与模板部署命令 | https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/manage-resource-groups-cli |\n| Azure Policy effects | deny / audit / modify 等效果清单 | https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effects |\n| Create and manage budgets | 预算阈值只触发通知、不停资源 | https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets |\n| Cost alerts | 三类成本告警与异常告警 | https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/cost-mgt-alerts-monitor-usage-spending |\n| Azure Advisor overview | 五类建议与「只建议不执行」 | https://learn.microsoft.com/en-us/azure/advisor/advisor-overview |\n\n这些页面都是微软官方公开的免费文档。遇到中文资料与英文原文说法不一致时，以英文原文为准。"}},{"domain":2,"name":"实现和管理存储","weight":"15–20%","practice":[{"id":"D2-001","d":2,"t":"single","q":"只允许公司虚拟网络内子网访问存储账户，同时保留通过门户管理该账户的能力，应配置","o":[{"l":"A","t":"禁用存储账户的公共网络访问但不开专用终结点"},{"l":"B","t":"只配置共享访问签名 SAS"},{"l":"C","t":"存"},{"l":"D","t":"把访问密钥轮换一次"}],"a":["C"],"e":"**正确答案：C。** 存储账户防火墙只放行所选虚拟网络与子网，并按需加可信 IP 例外。\n\n**为什么对：** 存储防火墙按来源网络控制访问，配合选定子网与受信 IP 可在限制来源的同时保留管理通道。关联考点：官方技能点 2.1.1「配置存储防火墙与虚拟网络」，内容领域 2。\n\n**其他选项为什么错：**\n- A：禁用存储账户的公共网络访问但不开专用终结点。完全禁用后需专用终结点才能连，单靠关闭无法按子网放行。\n- B：只配置共享访问签名 SAS。SAS 管的是授权凭证，不是网络层来源限制。\n- D：把访问密钥轮换一次。轮换密钥只换凭证，不改变网络可达性。\n\n**关键概念：** 网络边界与授权凭证是两层，防火墙管从哪来，SAS 与密钥管凭什么访问。本题对应考纲 2.1.1。","s":"自编·2.1.1"},{"id":"D2-002","d":2,"t":"single","q":"要给外部合作方临时读取某个 Blob，且需限定有效期与只读权限，最合适的是","o":[{"l":"A","t":"把存储账户访问密钥发给对方"},{"l":"B","t":"生"},{"l":"C","t":"把容器改成公共读取"},{"l":"D","t":"给对方订阅级 Reader"}],"a":["B"],"e":"**正确答案：B。** 生成带到期时间与只读权限的服务 SAS 或用户委托 SAS。\n\n**为什么对：** SAS 把权限、资源范围与有效期写进凭证本身，适合短期受控外发。关联考点：官方技能点 2.1.2「创建并使用共享访问签名」，内容领域 2。\n\n**其他选项为什么错：**\n- A：把存储账户访问密钥发给对方。密钥等于账户全权，泄露后影响整个账户且难以按对象收回。\n- C：把容器改成公共读取。公共读取对所有人开放，无法限定时间与单个对象。\n- D：给对方订阅级 Reader。订阅角色不授予 Blob 数据平面的读取权限。\n\n**关键概念：** 数据平面访问可用 SAS 精确限权，账户密钥应始终留在受控侧。本题对应考纲 2.1.2。","s":"自编·2.1.2"},{"id":"D2-003","d":2,"t":"single","q":"公司要求能随时撤销已发出的 SAS，且不必轮换存储账户密钥，应采用","o":[{"l":"A","t":"把"},{"l":"B","t":"把 SAS 到期时间设得很长再口头要求对方别用"},{"l":"C","t":"每次撤销都轮换访问密钥"},{"l":"D","t":"把容器设为私有后重新公开"}],"a":["A"],"e":"**正确答案：A。** 把 SAS 关联到存储访问策略，通过删除或修改策略撤销。\n\n**为什么对：** 存储访问策略把服务端可控的开始时间、到期与权限抽出来，改策略即可让关联 SAS 失效。关联考点：官方技能点 2.1.3「配置存储访问策略」，内容领域 2。\n\n**其他选项为什么错：**\n- B：把 SAS 到期时间设得很长再口头要求对方别用。到期时间一旦签发无法单方面缩短。\n- C：每次撤销都轮换访问密钥。轮换可行但会打断所有依赖该密钥的调用，代价过大。\n- D：把容器设为私有后重新公开。容器公开级别不控制已签发的 SAS 凭证。\n\n**关键概念：** 策略化 SAS 的价值在于可撤销，裸 SAS 只能等它自己过期。本题对应考纲 2.1.3。","s":"自编·2.1.3"},{"id":"D2-004","d":2,"t":"single","q":"怀疑存储账户访问密钥已泄露，正确的处置顺序是","o":[{"l":"A","t":"先删除存储账户"},{"l":"B","t":"只把容器改成私有"},{"l":"C","t":"等待密钥自然过期"},{"l":"D","t":"先"}],"a":["D"],"e":"**正确答案：D。** 先轮换密钥并更新所有依赖方，再排查使用日志。\n\n**为什么对：** 密钥泄露的核心动作是轮换，且因有两个密钥应先切依赖到备用密钥再轮换主密钥。关联考点：官方技能点 2.1.4「管理访问密钥」，内容领域 2。\n\n**其他选项为什么错：**\n- A：先删除存储账户。删账户会丢数据，且不是处置凭证泄露的第一步。\n- B：只把容器改成私有。容器级别不影响账户密钥的有效性。\n- C：等待密钥自然过期。存储账户访问密钥不会自动过期，必须显式轮换。\n\n**关键概念：** 双密钥设计的目的就是支持不停机轮换。本题对应考纲 2.1.4。","s":"自编·2.1.4"},{"id":"D2-005","d":2,"t":"single","q":"要让虚拟机通过本地 AD 身份访问 Azure 文件共享，必须满足的前置条件是","o":[{"l":"A","t":"只要启用 HTTPS 传输即可"},{"l":"B","t":"给共享生成 SAS 并在虚拟机里写死"},{"l":"C","t":"把"},{"l":"D","t":"把共享设为匿名访问"}],"a":["C"],"e":"**正确答案：C。** 把存储账户加入域并配置基于标识的访问权限与 RBAC 角色。\n\n**为什么对：** 基于标识的访问依赖存储账户与目录的集成，再由目录主体通过 RBAC 获得文件共享权限。关联考点：官方技能点 2.1.5「为 Azure 文件配置基于标识的访问」，内容领域 2。\n\n**其他选项为什么错：**\n- A：只要启用 HTTPS 传输即可。HTTPS 只加密传输，不提供任何身份映射。\n- B：给共享生成 SAS 并在虚拟机里写死。SAS 是凭证不是域身份，无法按 AD 用户授权。\n- D：把共享设为匿名访问。匿名访问不区分用户，且与域身份要求相反。\n\n**关键概念：** 身份集成与共享级权限两件都配齐，域用户才能按人访问。本题对应考纲 2.1.5。","s":"自编·2.1.5"},{"id":"D2-006","d":2,"t":"single","q":"创建存储账户时要求支持 Blob 的热冷归档层级与生命周期管理，应选择","o":[{"l":"A","t":"旧版通用 v1 账户"},{"l":"B","t":"S"},{"l":"C","t":"仅 BlobStorage 专用账户"},{"l":"D","t":"文件共享专用高级账户"}],"a":["B"],"e":"**正确答案：B。** StorageV2 通用 v2 账户。\n\n**为什么对：** 通用 v2 覆盖 Blob、文件、队列、表并支持层级与生命周期策略，是新账户的默认选型。关联考点：官方技能点 2.2.1「创建并配置存储账户」，内容领域 2。\n\n**其他选项为什么错：**\n- A：旧版通用 v1 账户。v1 不支持完整的层级与生命周期能力，属于应迁移的历史形态。\n- C：仅 BlobStorage 专用账户。该形态能力受限，新建场景已不推荐。\n- D：文件共享专用高级账户。高级文件账户面向文件共享性能，不提供 Blob 层级。\n\n**关键概念：** 账户类型决定可用能力集，选型错了后面功能补不回来。本题对应考纲 2.2.1。","s":"自编·2.2.1"},{"id":"D2-007","d":2,"t":"single","q":"某业务要求单区域遭遇故障时数据仍可写，且接受跨区域异步复制带来的少量延迟，应选","o":[{"l":"A","t":"异"},{"l":"B","t":"本地冗余 LRS"},{"l":"C","t":"区域冗余 ZRS"},{"l":"D","t":"只读异地冗余 RA-GRS 的只读端点"}],"a":["A"],"e":"**正确答案：A。** 异地冗余存储 GRS 或异地区域冗余 GRS 的配对区域模型。\n\n**为什么对：** GRS 把数据异步复制到配对区域，故障转移后可恢复写入，代价是复制延迟与切换流程。关联考点：官方技能点 2.2.2「配置存储冗余」，内容领域 2。\n\n**其他选项为什么错：**\n- B：本地冗余 LRS。LRS 只在单数据中心内多副本，区域内故障时无法保证可用。\n- C：区域冗余 ZRS。ZRS 跨同区域可用区，能扛机房故障但不扛整个区域故障。\n- D：只读异地冗余 RA-GRS 的只读端点。只读端点不允许写入，不满足仍可写的要求。\n\n**关键概念：** 冗余选项的差别在于故障域范围与是否可读可写，先定业务能扛哪种故障。本题对应考纲 2.2.2。","s":"自编·2.2.2"},{"id":"D2-008","d":2,"t":"multiple","q":"关于存储冗余，下列说法哪些正确","o":[{"l":"A","t":"GRS 在配对区域提供同步写入副本"},{"l":"B","t":"RA-GRS 允许客户端直接向配对区域写入"},{"l":"C","t":"Z"},{"l":"D","t":"启用 GRS 后可随时手动切换且保证零数据丢失"},{"l":"E","t":"L"},{"l":"F","t":"ZRS 等于跨区域容灾"}],"a":["C","E"],"e":"**正确答案：C、E。** ZRS 在同一区域的多个可用区同步保存副本；LRS 的副本范围最小、成本也最低。\n\n**为什么对：** 冗余级别按副本所在的故障域划分，跨区复制必然面对异步与 RPO 取舍。关联考点：官方技能点 2.2.2「配置存储冗余」，内容领域 2。\n\n**其他选项为什么错：**\n- A：GRS 在配对区域提供同步写入副本。跨区域复制是异步的，同步说法不成立。\n- B：RA-GRS 允许客户端直接向配对区域写入。它只额外提供只读端点，写入仍走主区域。\n- D：启用 GRS 后可随时手动切换且保证零数据丢失。故障转移涉及账户级流程，异步复制下可能有数据损失。\n- F：ZRS 等于跨区域容灾。可用区在同一区域内，区域级灾难不在其覆盖范围。\n\n**关键概念：** 把副本位置、复制方式、可读可写三件事分开看，选型才不会混淆。本题对应考纲 2.2.2。","s":"自编·2.2.2"},{"id":"D2-009","d":2,"t":"single","q":"要求把源账户容器里的新增 Blob 自动复制到另一区域的账户，应配置","o":[{"l":"A","t":"启用存储账户的异地冗余"},{"l":"B","t":"配置 Blob 生命周期策略"},{"l":"C","t":"对"},{"l":"D","t":"给目标容器生成 SAS"}],"a":["C"],"e":"**正确答案：C。** 对象复制规则并指定源与目标容器及复制范围。\n\n**为什么对：** 对象复制按容器对与规则异步复制 Blob 内容，且要求两个账户都开启版本控制等前置条件。关联考点：官方技能点 2.2.3「配置对象复制」，内容领域 2。\n\n**其他选项为什么错：**\n- A：启用存储账户的异地冗余。异地冗余是同一账户的底层副本，不是跨账户按容器复制。\n- B：配置 Blob 生命周期策略。生命周期管过期与层级转换，不负责跨账户复制。\n- D：给目标容器生成 SAS。SAS 只是访问凭证，不会触发任何数据搬运。\n\n**关键概念：** 对象复制是账户间数据流动，冗余是账户内副本，两者层级不同。本题对应考纲 2.2.3。","s":"自编·2.2.3"},{"id":"D2-010","d":2,"t":"single","q":"公司要求用自己的密钥加密存储账户，且密钥要放在受控密钥库中，应配置","o":[{"l":"A","t":"平台管理的密钥"},{"l":"B","t":"客"},{"l":"C","t":"仅在传输层启用 TLS"},{"l":"D","t":"给容器加只读锁"}],"a":["B"],"e":"**正确答案：B。** 客户管理的密钥并关联到密钥保管库。\n\n**为什么对：** 客户管理密钥把密钥保管、轮换与撤销交给客户，需密钥库与身份授权配合。关联考点：官方技能点 2.2.4「配置存储账户加密」，内容领域 2。\n\n**其他选项为什么错：**\n- A：平台管理的密钥。平台托管密钥由服务侧管理，客户无法控制密钥生命周期。\n- C：仅在传输层启用 TLS。TLS 只保护传输过程，不改变静态加密的密钥归属。\n- D：给容器加只读锁。资源锁不影响加密体系。\n\n**关键概念：** 静态加密默认就开，选的是密钥由谁管而不是要不要加密。本题对应考纲 2.2.4。","s":"自编·2.2.4"},{"id":"D2-011","d":2,"t":"single","q":"要把本地大批量文件可靠复制到 Blob 容器并支持断点续传，首选工具是","o":[{"l":"A","t":"A"},{"l":"B","t":"存储资源管理器手动拖拽"},{"l":"C","t":"浏览器里逐个上传"},{"l":"D","t":"用 SAS 生成下载链接"}],"a":["A"],"e":"**正确答案：A。** AzCopy。\n\n**为什么对：** AzCopy 面向批量与脚本化传输，支持续传、并行与大规模数据搬移。关联考点：官方技能点 2.2.5「用存储资源管理器与 AzCopy 管理数据」，内容领域 2。\n\n**其他选项为什么错：**\n- B：存储资源管理器手动拖拽。适合少量交互式操作，缺少脚本化与可靠续传能力。\n- C：浏览器里逐个上传。无批量与续传能力，且受会话稳定性影响。\n- D：用 SAS 生成下载链接。SAS 是授权凭证，不执行复制。\n\n**关键概念：** 工具选型看批量、可重入与可脚本化三项。本题对应考纲 2.2.5。","s":"自编·2.2.5"},{"id":"D2-012","d":2,"t":"single","q":"要创建可供多台 Windows 虚拟机通过 SMB 同时挂载的共享目录，应使用","o":[{"l":"A","t":"Blob 容器"},{"l":"B","t":"托管磁盘"},{"l":"C","t":"队列存储"},{"l":"D","t":"A"}],"a":["D"],"e":"**正确答案：D。** Azure 文件共享。\n\n**为什么对：** Azure 文件提供标准 SMB 共享，可被多台机器同时挂载并按身份授权。关联考点：官方技能点 2.3.1「创建并配置文件共享」，内容领域 2。\n\n**其他选项为什么错：**\n- A：Blob 容器。Blob 是对象存储，不提供 SMB 文件协议挂载。\n- B：托管磁盘。托管磁盘只能挂到单台虚拟机，不是共享文件系统。\n- C：队列存储。队列是消息服务，与文件共享无关。\n\n**关键概念：** 协议决定用法，SMB 共享与对象存储不能互换。本题对应考纲 2.3.1。","s":"自编·2.3.1"},{"id":"CASE-D2-01","d":2,"t":"single","q":"【案例背景】Fabrikam 每月生成财务报表并存放在存储账户中，审计方需临时读取指定报表。公司要求内部访问只从公司虚拟网络内子网发起、外发凭证可限时限对象，历史报表被误删后必须能自行找回，且冗余预算有限。\n\n报表账户只允许公司虚拟网络内子网访问，管理员仍要从公网门户管理，应配置","o":[{"l":"A","t":"完全关闭公共网络访问且不建专用终结点"},{"l":"B","t":"只生成 SAS 给内部应用"},{"l":"C","t":"存"},{"l":"D","t":"轮换一次访问密钥"}],"a":["C"],"e":"**正确答案：C。** 存储防火墙放行指定子网并按需加可信 IP 例外。\n\n**为什么对：** 网络边界由防火墙与终结点决定，管理通道可用受信 IP 单独保留。关联考点：官方技能点 2.1.1「配置存储防火墙与虚拟网络」，内容领域 2。\n\n**其他选项为什么错：**\n- A：完全关闭公共网络访问且不建专用终结点。关闭后需专用终结点才能连，无法按子网放行。\n- B：只生成 SAS 给内部应用。SAS 管授权凭证，不控制网络来源。\n- D：轮换一次访问密钥。轮换只换凭证，不改变可达来源。\n\n**关键概念：** 从哪连与凭什么访问是两层，别用凭证替代网络控制。本题对应考纲 2.1.1。","s":"案例组#Fabrikam 报表外发与存储治理·2.1.1"},{"id":"CASE-D2-02","d":2,"t":"single","q":"【案例背景】Fabrikam 每月生成财务报表并存放在存储账户中，审计方需临时读取指定报表。公司要求内部访问只从公司虚拟网络内子网发起、外发凭证可限时限对象，历史报表被误删后必须能自行找回，且冗余预算有限。\n\n需给审计方临时只读某个报表 Blob 且限定一周，最合适的是","o":[{"l":"A","t
