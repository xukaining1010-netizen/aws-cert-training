":"把存储账户访问密钥交给审计方"},{"l":"B","t":"签"},{"l":"C","t":"把容器设为 Blob 级公共读取"},{"l":"D","t":"给审计方订阅级 Reader"}],"a":["B"],"e":"**正确答案：B。** 签发带到期时间与只读权限的 SAS。\n\n**为什么对：** SAS 把范围、权限与有效期写进凭证，是短期外发的标准手段。关联考点：官方技能点 2.1.2「创建并使用共享访问签名」，内容领域 2。\n\n**其他选项为什么错：**\n- A：把存储账户访问密钥交给审计方。密钥等于账户全权，无法限定对象与时间。\n- C：把容器设为 Blob 级公共读取。公共读取对所有人开放，不能按周回收。\n- D：给审计方订阅级 Reader。订阅角色不授予 Blob 数据平面的读取权限。\n\n**关键概念：** 凭证的粒度决定暴露面，账户密钥不应外发。本题对应考纲 2.1.2。","s":"案例组#Fabrikam 报表外发与存储治理·2.1.2"},{"id":"CASE-D2-03","d":2,"t":"single","q":"【案例背景】Fabrikam 每月生成财务报表并存放在存储账户中，审计方需临时读取指定报表。公司要求内部访问只从公司虚拟网络内子网发起、外发凭证可限时限对象，历史报表被误删后必须能自行找回，且冗余预算有限。\n\n报表数据要求区域内可用区故障时不丢，同时预算有限，选","o":[{"l":"A","t":"区"},{"l":"B","t":"本地冗余 LRS"},{"l":"C","t":"异地冗余 GRS"},{"l":"D","t":"只读异地冗余 RA-GRS"}],"a":["A"],"e":"**正确答案：A。** 区域冗余 ZRS。\n\n**为什么对：** 冗余级别按故障域逐级付费，需求到可用区就不必买区域级容灾。关联考点：官方技能点 2.2.2「配置存储冗余」，内容领域 2。\n\n**其他选项为什么错：**\n- B：本地冗余 LRS。LRS 只在单设施内保留副本，不覆盖可用区故障。\n- C：异地冗余 GRS。跨区域复制成本更高，超出可用区级需求。\n- D：只读异地冗余 RA-GRS。多出只读端点与跨区域复制，均非需求。\n\n**关键概念：** 先明确要扛哪一级故障，再决定为哪一层副本付费。本题对应考纲 2.2.2。","s":"案例组#Fabrikam 报表外发与存储治理·2.2.2"},{"id":"CASE-D2-04","d":2,"t":"single","q":"【案例背景】Fabrikam 每月生成财务报表并存放在存储账户中，审计方需临时读取指定报表。公司要求内部访问只从公司虚拟网络内子网发起、外发凭证可限时限对象，历史报表被误删后必须能自行找回，且冗余预算有限。\n\n历史报表被误删后要求不靠人工备份即可找回，应启用","o":[{"l":"A","t":"只启用生命周期策略的过期删除"},{"l":"B","t":"给容器加 CanNotDelete 锁"},{"l":"C","t":"启用对象复制"},{"l":"D","t":"B"}],"a":["D"],"e":"**正确答案：D。** Blob 软删除并设置覆盖审计周期的保留期。\n\n**为什么对：** 软删除在保留期内保留被删对象，可在期限内恢复，是数据面防误删能力。关联考点：官方技能点 2.3.5「配置 Blob 生命周期管理」，内容领域 2。\n\n**其他选项为什么错：**\n- A：只启用生命周期策略的过期删除。生命周期加速删除，不提供恢复能力。\n- B：给容器加 CanNotDelete 锁。资源锁作用在容器资源，挡不住容器内对象删除。\n- C：启用对象复制。跨账户搬运不是本地误删恢复机制。\n\n**关键概念：** 资源锁防资源被删，软删除防数据被删，作用层不同。本题对应考纲 2.3.5。","s":"案例组#Fabrikam 报表外发与存储治理·2.3.5"}],"sections":[{"h":"配置存储访问","body":"### 这一域考什么\n\n这一域问的是数据放在哪、谁能拿、坏了怎么回来。官方把十六个技能点分成三件事：先给存储账户划访问边界，再定账户本身的冗余与加密，最后管文件共享与 Blob 的生命周期。它考的是操作判断，不是背服务清单。\n\n### 读完这个域要能做什么\n\n读完要能独立完成三件事。给出访问场景，能选出该用密钥、共享访问签名还是目录标识。给出可用性与成本要求，能说清冗余选项的取舍。给出一堆冷热数据，能配出会自动降层、过期清理且误删可恢复的规则。\n\n### 和其他认证怎么接\n\n| 对照课程 | 怎么接 |\n|---|---|\n| AWS MLA-C02 | 机器学习课里的数据集读放，也要先定访问层与冷热层；把这里的存储分层思路搬过去，不必重学一遍概念。 |\n| AWS SCS-C03 | 安全线把加密与最小权限讲得更深；这里只要求会配，想知道密钥轮换背后的威胁模型可以回看那一科。 |\n| AWS DOP-C02 | 运维课里的自动化生命周期，与本域的生命周期规则是同一套思路，只是执行位置从平台策略换成了脚本。 |\n| Azure AZ-305 | 同厂牌的架构设计课会从方案层追问为什么选这个冗余级别；本域先把怎么配练熟，再去看设计取舍。 |\n\n### 官方口径的三条边界\n\n三条边界先说清。第一，官方现行技能清单标注为 2023 年 10 月 26 日版本，认证页上的更新日期只是页面元数据。第二，官方不公布题型，也不公布各考点的出题频率，下表两列照实留白。第三，本域权重是 15–20% 的区间，不是精确题量，不能拿它算该做几道题。\n\n#### 这一节学什么\n这一节对应考纲任务 2.1「配置存储访问」。\n\n> 官方原名：Configure access to storage\n\n五个技能点都在回答同一个问题：把数据交出去的时候，边界画在哪。密钥、共享访问签名、存储访问策略、目录标识，四把钥匙的权限范围与回收方式都不一样，考试爱把它们放在同一道题里让你挑。\n\n#### 配置存储防火墙与虚拟网络\n\n> 官方原名：Configure Azure Storage firewalls and virtual networks\n\n**这条在问什么。** 题目给一个「只允许公司内网读这个账户」的要求，问你配什么。很多人第一反应去改角色分配，其实先该动网络规则。\n\n**定义**：存储账户自带一层网络边界。默认允许所有网络访问，可以改成只允许指定虚拟网络、子网或公网地址段进来。它管的是请求从哪来，不是请求者是谁。\n\n**怎么运作**。在账户的网络设置里选允许的访问来源，再添加虚拟网络规则或地址范围。规则生效后，不在清单里的来源连账户都连不上。这一层挡在身份验证之前，所以和角色分配是两条独立的线。\n\n**什么时候用，什么时候别用**。内部系统固定从某几个子网访问，用这一层最省事，权限规则不用为每个调用方重写。但办公地点经常变、或要临时给外部合作方开一次口子，纯靠地址白名单会天天改，不如换共享访问签名。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的报表服务部署在一个专用子网里。管理员只允许这个子网访问报表账户，其他子网一律拒绝。后来有人从办公网直接连存储读数据，被挡在网络层，根本走不到权限判定。\n\n**关联服务**：Azure 存储账户、虚拟网络与服务终结点、存储防火墙规则。\n\n#### 创建并使用共享访问签名\n\n> 官方原名：Create and use shared access signature (SAS) tokens\n\n**这条在问什么。** 场景是让外部单位上传一批文件，只给三天，只准写某个容器。题目问你怎么发凭证，而不是怎么建账号。\n\n**定义**：共享访问签名是一串带签名的地址参数。官方把它叫做对存储资源的安全委派访问，拿到它的人不需要目录账号，也能在约定范围内操作。\n\n**怎么运作**。签发时定四件事：能读还是能写、作用到容器还是单个对象、从什么时候到什么时候、允许哪些来源地址。这些条件写进签名一起签，改任何一项都会让签名失效。所以撤销一个已发出的签名，得换密钥或让它过期。\n\n**什么时候用，什么时候别用**。短期、对外、范围很窄的协作适合用它，因为不必为对方建目录对象。反过来，长期内部系统调用别发长期签名，签名一旦外流，捡到的人就拥有同样权限，且很难按人追溯。\n\n💡 **场景举例**（虚构教学示意）：Contoso 让物流供应商上传三天的签收单。管理员签发一个只写、只指向签收单容器、七十二小时过期的签名。供应商不用建账号，到期链接自动作废。\n\n**关联服务**：Azure 存储账户、共享访问签名、容器与 Blob。\n\n#### 配置存储访问策略\n\n> 官方原名：Configure stored access policies\n\n**这条在问什么。** 题目问「已经发出去的签名怎么统一收回或延长」，这时考的不是再签一张，而是有没有把权限挂到服务端策略上。\n\n**定义**：存储访问策略是存在服务端的一组规则，容器级别可以挂若干条。共享访问签名可以引用其中一条，把开始时间、到期时间和权限交给策略管。\n\n**怎么运作**。先建策略，再让签名引用它。之后改策略里的到期时间，引用它的签名跟着变；删掉策略，这一批签名一起失效。注意策略只作用于它所在的容器，且不适用于某些特定签名类型。\n\n**什么时候用，什么时候别用**。一批签名要长期维护、且将来可能整批调整，用策略省很多事，回收也干净。只发一次、几小时就过期的临时链接，专门建一条策略反而多一个要清理的对象。\n\n💡 **场景举例**（虚构教学示意）：Contoso 给三家审计单位各发了一个上传签名，都引用同一条容器策略。审计期延长时改一次策略即可；项目结束后删掉策略，三条链接同时失效。\n\n**关联服务**：Azure Blob 容器、存储访问策略、共享访问签名。\n\n#### 管理访问密钥\n\n> 官方原名：Manage access keys\n\n**这条在问什么。** 题目常见问法是「怀疑密钥泄露了怎么办」，或者「怎么在不中断业务的前提下轮换」。答题关键在轮换顺序，不在怎么找到密钥。\n\n**定义**：创建存储账户时，平台会生成两把账户访问密钥。官方对它们的说明是可以查看、管理与轮换。拿到任一把，等于拿到这个账户的完整数据权限。\n\n**怎么运作**。两把密钥的设计就是为轮换留的。先把应用切到第二把，确认没有请求再用第一把，然后重建第一把，最后把应用切回来。重建会让旧值立刻失效，所以顺序反了就会造成中断。\n\n**动手看一眼**（命令逐字取自官方《管理账户访问密钥》文档）：\n\n```bash\naz storage account keys list \\\naz storage account keys renew \\\n```\n\n**什么时候用，什么时候别用**。老系统或第三方工具只认密钥时，只能用它，但要定期轮换并放进密钥保管服务。新写的内部应用优先用目录标识授权，密钥就不必落到配置文件里。别把密钥写进代码库或发给外部合作方。\n\n💡 **场景举例**（虚构教学示意）：Contoso 发现一个旧脚本里硬编码了密钥。管理员先确认还有哪些服务在读它，把流量切到另一把，再重建被泄露的那把，全程报表服务没有断过。\n\n**关联服务**：Azure 存储账户、访问密钥、密钥保管服务、Azure CLI。\n\n#### 为 Azure 文件配置基于标识的访问\n\n> 官方原名：Configure identity-based access for Azure Files\n\n**这条在问什么。** 题目给一批员工和几个共享目录，问怎么做到按人授权、离职即失效。这时候用一把共享密钥显然不对。\n\n**定义**：Azure 文件提供完全托管的文件共享，走标准的 SMB 或 NFS 协议，云端和本地客户端都能并发挂载。基于标识的访问让挂载凭证落在目录标识上，而不是账户密钥。\n\n**怎么运作**。先把文件共享接到目录源，再给目录用户或组分配共享级角色，最后用文件或目录级权限细分到子目录。验的是两层权限的交集，缺一层都会出现能连上却打不开的情况。\n\n**什么时候用，什么时候别用**。员工要按部门读写不同目录，且人员流动频繁，用这套最合适，账号一停用权限自然收。只是给一台老设备临时挂个盘、又没有目录源，接入成本就超过收益。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把财务与研发各建一个文件共享。财务组只能进财务共享，研发组进不了。有人离职时停掉目录账号，两个共享都进不去了，共享密钥一次都没发出去。\n\n**关联服务**：Azure 文件、Microsoft Entra ID 或本地目录源、SMB 与 NFS、文件共享权限。\n\n#### 常见误区与易错点\n\n| 误区 | 为什么错 / 怎么改 |\n|---|---|\n| 把网络规则和角色分配当成一回事 | 前者挡来源，后者定身份；只改一边，另一边仍会放行或误挡。 |\n| 共享访问签名发了永久权限 | 签名等于凭证，长期有效又无来源限制，外流后无法按人追溯。 |\n| 先重建密钥再切应用 | 重建会让旧值立刻失效，仍在用它的服务会当场中断。 |\n| 只配共享级角色就以为能读写子目录 | 还要有目录级权限，两层取交集才生效。 |\n\n#### 记忆要点\n\n1. 先判边界类型：从哪来用网络规则，是谁用身份，给外部临时用共享访问签名。\n2. 共享访问签名要限时限权限范围；需要整批回收，就挂存储访问策略。\n3. 两把密钥的存在意义是轮换，顺序是切流量、重建、再切回。\n4. 文件共享按人授权时，共享级角色与目录级权限都要配。\n\n---"},{"h":"配置和管理存储账户","body":"#### 这一节学什么\n这一节对应考纲任务 2.2「配置和管理存储账户」。\n\n> 官方原名：Configure and manage storage accounts\n\n这一组从账户这个容器本身下手。官方说存储账户里装着 Blob、文件、队列和表，并提供一个全局唯一的命名空间。建账户时定下的几项设置，后面很难无痛改，所以考试特别爱问「该在一开始选什么」。\n\n#### 创建并配置存储账户\n\n> 官方原名：Create and configure storage accounts\n\n**这条在问什么。** 题目给一组业务要求，问建账户时该选哪个区域、哪种类型、开哪些开关。它考的是前置判断，不是点菜单的顺序。\n\n**定义**：存储账户是所有存储数据对象的容器，官方说它提供一个可通过 HTTP 或 HTTPS 从全球访问的唯一命名空间。账户名因此全局唯一，也决定了后续所有对象的访问地址。\n\n**怎么运作**。建账户时定名称、区域、性能类型和冗余级别。名称与区域建后不能原地改，冗余与部分功能可以后期调整，但会牵动成本与数据迁移。所以顺序是先定数据要在哪、谁能就近访问，再定性能与副本。\n\n**动手看一眼**（命令逐字取自官方《创建存储账户》文档）：\n\n```bash\naz login\nNew-AzResourceGroup -Name $resourceGroup -Location $location\n```\n\n**什么时候用，什么时候别用**。一个业务系统一套账户，边界清楚，出问题时账单和权限都好拆。但别给每个小功能都建一个账户，账户多了，命名、监控与策略都要重复配。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把生产报表与临时上传分到两个账户。上传账户放在合作方所在区域，报表账户跟着计算资源走，两边互不干扰，成本也分开看。\n\n**关联服务**：Azure 存储账户、资源组、区域、Azure CLI 与 Az PowerShell。\n\n#### 配置存储冗余\n\n> 官方原名：Configure Azure Storage redundancy\n\n**这条在问什么。** 题目给一句「区域整体故障也不能丢数据」，问选哪种冗余。答之前要先分清是怕硬件坏、怕机房坏，还是怕整个区域停。\n\n**定义**：冗余是给同一份数据留多份副本。官方的说法是，冗余让存储账户在故障期间仍满足可用性与持久性目标，故障包括临时硬件失效、断电或更大范围的灾害。\n\n**怎么运作**。本地冗余在一个数据中心内留副本，区域冗余把副本铺到同一区域的多个可用区，跨区域冗余再复制到另一区域。副本越分散，扛的故障范围越大，写入成本与跨区费用也跟着涨。\n\n**什么时候用，什么时候别用**。内部临时数据、丢了能重算，本地冗余就够。核心账本既怕区域故障又要合规异地留存，才值得上跨区域。别只看可用性数字，还要看读取能否从次区域进行，以及故障切换要不要人工触发。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的日志文件每晚重新生成，选本地冗余。客户合同扫描件不能丢，改选跨区域冗余，并接受每月多一笔复制与存储费用。\n\n**关联服务**：Azure 存储冗余选项、区域与可用区、存储账户。\n\n#### 配置对象复制\n\n> 官方原名：Configure object replication\n\n**这条在问什么。** 题目常给两个不同区域的账户，要求源账户的写入自动出现在目标账户。它问的是持续同步，不是一次性搬数据。\n\n**定义**：官方对对象复制的定义是，在两个存储账户之间异步复制块 Blob，一个作源，一个作目标。复制由服务端负责，不靠客户端脚本反复上传。\n\n**怎么运作**。先在源和目标账户打开必要的版本与更改跟踪能力，再建复制规则，指定源容器与目标容器，还可以按前缀或标签过滤。规则建好以后，新写入会异步跟上；规则建立之前已有的对象不会自动补。两个账户都得先存在，命令行里能看清这一步。\n\n**动手看一眼**（命令逐字取自官方《导入导出与账户准备》文档）：\n\n```bash\naz group create --name myierg --location \"West US\"\naz storage account create --resource-group myierg --name myssdocsstorage --https-only\n```\n\n**什么时候用，什么时候别用**。要把生产数据持续汇到另一个区域做分析或留存，用对象复制比定时脚本稳，且不用自己记账。只是想搬一次历史文件，用命令行工具更直接，建一套长期规则反而留下要维护的尾巴。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把华东账户的订单附件持续复制到华南的分析账户。规则只配一次，此后新增附件自动到位，分析侧不必再向生产侧要数据。\n\n**关联服务**：Azure Blob 存储、对象复制规则、源与目标存储账户。\n\n#### 配置存储账户加密\n\n> 官方原名：Configure storage account encryption\n\n**这条在问什么。** 题目问「合规要求自己保管密钥该怎么配」，或者「开启加密会不会影响读写」。它考的是密钥归属，不是加密开关在哪。\n\n**定义**：存储账户里的静态数据会被加密，读写时由服务透明完成，应用不需要改代码。选择在于加密密钥由平台托管，还是用自己保管在密钥保管服务里的客户管理密钥。\n\n**怎么运作**。用平台托管密钥时，轮换、备份都由平台处理，管理员几乎不用管。切到客户管理密钥后，密钥的可用性与权限直接决定数据能不能读，密钥被禁用或过期，账户就会访问失败。\n\n**什么时候用，什么时候别用**。多数业务用平台托管密钥就够，运维负担最小。只有合规条款明确要求自管密钥、或要能随时撤销平台访问权，才值得引入客户管理密钥，并同时把密钥的备份与轮换流程建起来。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的合同库按合规要求改用客户管理密钥。运维因此新增一项检查：密钥保管服务里的密钥不能随人员调整被误删，否则第二天全库读不出来。\n\n**关联服务**：Azure 存储服务加密、密钥保管服务、客户管理密钥。\n\n#### 用存储资源管理器与 AzCopy 管理数据\n\n> 官方原名：Manage data by using Azure Storage Explorer and AzCopy\n\n**这条在问什么。** 题目给「几个 TB 要搬到另一个账户」，或「把本地目录同步上去」，问用哪个工具。它考的是图形界面与命令行各自适合什么量级。\n\n**定义**：官方把 AzCopy 定义为命令行工具，用来把数据复制到、复制出或在存储账户之间搬动。存储资源管理器则是图形界面，用来浏览账户、容器和文件。\n\n**怎么运作**。命令行方式把来源、目标、是否递归、是否断点续传写成参数，能放进脚本重复跑，也能看传输日志。图形工具适合先看清目录结构，确认没选错容器，再决定要不要交给批量命令。\n\n**动手看一眼**（命令逐字取自官方《AzCopy 数据传输》文档）：\n\n```bash\nazcopy copy \"C:\\local\\path\" \"https://account.blob.core.windows.net/mycontainer1/?sv=2018-03-28&ss=bjqt&srt=sco&sp=rwddgcup&se=2019-05-01T05:01:17Z&st=2019-04-30T21:01:17Z&spr=https&sig=MGCXiyEzbtttkr3ewJIh2AR8KrghSy1DGM9ovN734bQF4%3D\" --recursive=true\nazcopy bench\n```\n\n**什么时候用，什么时候别用**。几十个文件的临时检查用图形工具更快。成批、跨账户、要重跑或要写进自动化流程的传输，用命令行更可靠。注意命令行凭证别写进脚本文件，交给登录会话或受管标识。\n\n💡 **场景举例**（虚构教学示意）：Contoso 先在图形工具里确认目标容器拼写无误，再用一条命令行把本地归档目录整体推上去。中途网络断了，重跑同一条命令即可接着传。\n\n**关联服务**：Azure 存储资源管理器、AzCopy、Azure CLI 登录会话。\n\n#### 常见误区与易错点\n\n| 误区 | 为什么错 / 怎么改 |\n|---|---|\n| 账户建完才发现区域选错 | 区域与名称不能原地改，只能新建账户并迁移数据。 |\n| 把跨区域冗余当成备份 | 冗余抗故障，不抗误删；误删会同步复制到各副本。 |\n| 以为对象复制会补历史数据 | 规则只作用于建立之后的写入，历史对象要另行迁移。 |\n| 脚本里写死传输凭证 | 脚本常进代码库与日志，凭证会跟着外流，应交给登录会话。 |\n\n#### 记忆要点\n\n1. 建账户前先定名称与区域，这两项建后不能原地改。\n2. 冗余级别按故障范围选：硬件、可用区、还是整个区域。\n3. 对象复制是服务端异步规则，历史数据不在复制范围内。\n4. 静态加密默认开启，自管密钥会把密钥可用性变成业务风险。\n5. 图形工具用于确认结构，命令行用于批量与可重复传输。\n\n#### 案例\n\n**💡 综合案例：Contoso 的报表数据上云交接**\n\n> 这一节先讲清共同背景。后面的几道题都从这里出发，每道只考一个技能点。做完可以展开解析，看它对应官方考纲哪一条。\n\n虚构教学场景：Contoso 有一套每晚生成的报表，生产账户放在华东。外部审计单位要读其中三个月的附件，但只能读指定容器，三十天后收回。同时公司要求报表原始文件在华南留一份，且不能被误删后一起消失。运维还发现一个旧脚本里写着账户密钥，需要换成不留长期凭证的做法。\n\n这份背景把本域十六个技能点串成一条线。外部读数据走共享访问签名，并挂服务端策略。内部服务改按目录标识授权，账户侧先定区域与冗余。历史文件用命令行搬一次，之后的持续同步交给对象复制规则。误删保护落在软删除与版本控制，冷热分层交给生命周期规则，密钥按轮换流程处理。\n\n案例题只在课程里出现，不进刷题工具，也不计入模拟考。真实考场的案例卡有左栏资料菜单，界面手感请到官方 Exam Sandbox 体验。\n\n---"},{"h":"配置 Azure 文件与 Blob 存储","body":"#### 这一节学什么\n这一节对应考纲任务 2.3「配置 Azure 文件与 Blob 存储」。\n\n> 官方原名：Configure Azure Files and Azure Blob Storage\n\n最后一组落到具体对象。文件共享与容器是两种访问习惯，一个按目录挂载，一个按对象地址取。六个技能点围着一个核心判断：这份数据会被怎么改、多久以后没人再看、改错了靠什么回来。\n\n#### 创建并配置文件共享\n\n> 官方原名：Create and configure a file share in Azure Storage\n\n**这条在问什么。** 题目给一个「老应用要把本地盘换成云上共享」的场景，问共享怎么建。它考的是协议与挂载方式，不是存储空间怎么算。\n\n**定义**：Azure 文件提供完全托管的文件共享，走行业标准协议，Windows、Linux 与 macOS 都能从云端或本地并发挂载，不需要额外装软件。\n\n**怎么运作**。先定共享名称与配额，再选协议与传输加密要求，最后配身份与目录权限。共享是挂载的单位，应用看到的是一个盘符或挂载点，所以路径层级、权限继承这些老习惯都会跟着过来。\n\n**什么时候用，什么时候别用**。多个虚拟机要读写同一份目录结构、或现有应用只会用文件路径，选文件共享最省改造。新式应用直接按对象地址存取，硬套文件共享反而多一层协议开销。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把三台应用服务器共用的配置目录换成文件共享。应用代码一行没改，只是把原来的本地路径指向挂载点。\n\n**关联服务**：Azure 文件、SMB 与 NFS、文件共享配额、目录标识。\n\n#### 创建并配置容器\n\n> 官方原名：Create and configure a container in Blob Storage\n\n**这条在问什么。** 题目问「一批图片要让网站公开读，但后台上传不能公开」，考的是容器的访问级别怎么设，以及它和账户密钥的区别。\n\n**定义**：容器是 Blob 的逻辑分组，也是访问级别、访问策略与生命周期规则的作用边界。每个 Blob 的地址里都带容器名。\n\n**怎么运作**。建容器时定公共访问级别，默认不允许匿名读取。之后可以在容器上挂共享访问签名策略、生命周期规则和对象复制规则。容器级设置会向下影响其中的对象，所以分容器本身就是一种权限设计。\n\n**什么时候用，什么时候别用**。公开素材与内部数据务必分容器，权限一分开，后面加规则不会误伤。反过来，把不同保密级别的对象塞进同一容器，只能逐对象发签名，维护量会迅速失控。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把官网图片放进允许匿名读的容器，把原始合同扫描件放进私有容器。两个容器同属一个账户，但外部只能看到前者。\n\n**关联服务**：Azure Blob 容器、公共访问级别、共享访问签名策略。\n\n#### 配置存储层级\n\n> 官方原名：Configure storage tiers\n\n**这条在问什么。** 题目给「九十天后几乎不再访问，但要保留七年」，问该放哪一层。它考的是访问频率与取回代价的权衡。\n\n**定义**：存储层级是按数据被访问的频率与保留要求划分的档位。热层读写频繁、单价高；冷层存放时间长、读取要付费；归档层最便宜，但取回要先解冻。\n\n**怎么运作**。层级可以设在对象上，也可以由生命周期规则按最后访问或修改时间自动迁移。往冷层或归档层移动不是免费的，会产生写入操作费，过早移动还会产生提前删除或提前取回的费用。\n\n**什么时候用，什么时候别用**。日志、合规留存、历史备份适合往下沉，因为几乎不读。当天报表、正在被应用反复读的图片别急着降层，省下的存储费可能抵不过读取费与解冻等待。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把三十天内的报表放热层，三十一天后自动转冷，一年后转归档。审计真要调两年前的文件时，先提交解冻请求，等数据可取再下载。\n\n**关联服务**：Azure Blob 访问层级、生命周期管理、存储账户。\n\n#### 配置文件共享快照与软删除\n\n> 官方原名：Configure snapshots and soft delete for Azure Files\n\n**这条在问什么。** 题目问「有人误删了一个共享里的目录，怎么最快找回」，或者「改版前想留个能回退的点」。两件事分别对应软删除与快照。\n\n**定义**：共享快照是某一时刻文件共享的只读副本，可以从中取回单个文件。软删除则让被删的共享在保留期内仍可恢复，避免一次误操作就永久丢失。\n\n**怎么运作**。软删除先设保留天数，删除动作在期内只是标记，到期才真正清除。快照按时间点保存，恢复时可以只挑被改坏的文件，不必把整个共享回滚。两者都不替代异地冗余，账户级故障仍要靠冗余与备份。\n\n**什么时候用，什么时候别用**。共享被多人挂载、误删风险高，软删除基本该常开，代价只是保留期内那部分容量仍计费。要在批量改版前留一个明确回退点，再额外打一次快照。\n\n💡 **场景举例**（虚构教学示意）：Contoso 管理员误删了财务共享里一个目录。因为软删除保留期没过，直接在门户里恢复，业务半天内照常结账。\n\n**关联服务**：Azure 文件、共享快照、软删除、恢复操作。\n\n#### 配置 Blob 生命周期管理\n\n> 官方原名：Configure blob lifecycle management\n\n**这条在问什么。** 题目给一套留存制度，问怎么让它自动执行，而不是每月派人清理。它考的是规则条件怎么写、作用范围怎么圈。\n\n**定义**：生命周期管理用一组规则，按对象的前缀、类型与最后修改或访问时间，自动把数据移到更冷的层级，或在到期后删除。官方把它定位为随数据量增长与使用方式变化而管理数据的能力。\n\n**怎么运作**。一条规则包含筛选条件与动作，作用在某个账户下符合前缀的容器或对象。规则按天评估，不是实时触发，所以刚上传就满足条件的对象也可能隔天才动。多条规则同时命中时，要先理清优先级，别让删除规则盖过降层规则。\n\n**什么时候用，什么时候别用**。数据有明确生命周期、且量大到人工清不动，用规则最合适。但第一次上线一定先用窄前缀试跑几天，看实际动作是不是预期；直接对全账户开删除规则，写错一个前缀就是不可逆的数据损失。\n\n💡 **场景举例**（虚构教学示意）：Contoso 先只对日志容器下的临时前缀开规则，观察一周确认删的都是过期文件，再把规则扩到整个日志容器。\n\n**关联服务**：Azure Blob 生命周期管理、容器前缀、访问层级。\n\n#### 配置 Blob 版本控制\n\n> 官方原名：Configure blob versioning\n\n**这条在问什么。** 题目问「同名文件被新版本覆盖了，怎么找回上一版」。这跟误删不是同一件事，答题要点在版本而不是回收站。\n\n**定义**：开启版本控制后，对象每次被覆盖或删除，平台会保留此前的版本。需要时可以列出历史版本，取回其中任意一个。\n\n**怎么运作**。版本是对象级的，开启在账户或容器配置上。每次写入生成新版本，旧版本留着占容量，因此它和生命周期规则常一起用，由后者清理超过保留期的旧版本。注意它和软删除解决的问题不同，一个管覆盖，一个管删除。\n\n**什么时候用，什么时候别用**。会被程序反复覆盖的配置、报表或文档，适合开版本控制并配旧版本清理。一次写入永不修改的归档对象，开版本控制只会白占容量。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的报表程序每天覆盖同名文件。某天脚本写错，管理员从历史版本里取回前一天的报表，重跑后恢复，旧版本由生命周期规则在九十天后自动清掉。\n\n**关联服务**：Azure Blob 版本控制、软删除、生命周期管理。\n\n#### 常见误区与易错点\n\n| 误区 | 为什么错 / 怎么改 |\n|---|---|\n| 把容器公共访问全开当省事 | 一旦允许匿名读，容器里所有对象都对外可见，后续再收紧很被动。 |\n| 所有数据都往归档层放 | 取回要解冻且按量计费，频繁读取反而更贵、更慢。 |\n| 生命周期删除规则一次覆盖全账户 | 前缀写错就不可逆，应先用窄范围试跑再扩。 |\n| 把软删除与版本控制混为一谈 | 前者救误删，后者救覆盖，两个开关解决两件事。 |\n\n#### 记忆要点\n\n1. 文件共享走目录挂载，Blob 容器走对象地址，先按应用习惯选。\n2. 容器是访问级别与策略的作用边界，不同保密级别要分容器。\n3. 层级按访问频率选，降层有操作费，归档取回要解冻。\n4. 软删除救误删，快照留回退点，版本控制救覆盖。\n5. 生命周期规则要窄前缀试跑，删除动作不可逆。\n\n---"}],"tips":{"points":"| 考点 | 内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 配置存储防火墙与虚拟网络（2.1.1） | 网络边界先于身份边界，按来源 IP 与子网放行 | 官方未公布 | 官方未公布 |\n| 创建并使用共享访问签名（2.1.2） | 限时、限权、限资源的委派访问，泄露即等于授权 | 官方未公布 | 官方未公布 |\n| 配置存储访问策略（2.1.3） | 服务端的策略容器，可回收、可批量改，不写在签名里 | 官方未公布 | 官方未公布 |\n| 管理访问密钥（2.1.4） | 两把密钥轮换成常态，轮换前先查谁在用 | 官方未公布 | 官方未公布 |\n| 为 Azure 文件配置基于标识的访问（2.1.5） | 用目录标识与 SMB 权限替代共享密钥，映射文件共享 | 官方未公布 | 官方未公布 |\n| 创建并配置存储账户（2.2.1） | 账户是命名空间与计费边界，区域和类型建后难改 | 官方未公布 | 官方未公布 |\n| 配置存储冗余（2.2.2） | 副本放在同机房、同区域多区还是跨区域，取舍是可用性与成本 | 官方未公布 | 官方未公布 |\n| 配置对象复制（2.2.3） | 服务端异步复制块 Blob，需先开版本控制与更改源 | 官方未公布 | 官方未公布 |\n| 配置存储账户加密（2.2.4） | 静态加密默认开启，密钥由平台管还是自己管才是考点 | 官方未公布 | 官方未公布 |\n| 用存储资源管理器与 AzCopy 管理数据（2.2.5） | 图形工具看结构，命令行做批量与可重复传输 | 官方未公布 | 官方未公布 |\n| 创建并配置文件共享（2.3.1） | SMB 或 NFS 共享，配额、协议与权限在建时一并定 | 官方未公布 | 官方未公布 |\n| 创建并配置容器（2.3.2） | 容器是 Blob 的权限与策略边界，匿名访问默认关闭 | 官方未公布 | 官方未公布 |\n| 配置存储层级（2.3.3） | 热、冷与归档按访问频率分层，取回有延迟与费用 | 官方未公布 | 官方未公布 |\n| 配置文件共享快照与软删除（2.3.4） | 快照是某一刻的只读副本，软删除给误删留恢复窗口 | 官方未公布 | 官方未公布 |\n| 配置 Blob 生命周期管理（2.3.5） | 规则按条件自动降层或删除，先小范围试跑再铺开 | 官方未公布 | 官方未公布 |\n| 配置 Blob 版本控制（2.3.6） | 覆盖与删除留下历史版本，与软删除配合可回退 | 官方未公布 | 官方未公布 |","services":"| 服务 | 主要用途 | 涉及任务 |\n|---|---|---|\n| Azure 存储账户 | 命名空间、计费、冗余与加密的作用边界 | 2.1、2.2、2.3 |\n| Azure Blob 存储 | 对象、容器、访问层级、生命周期与版本控制 | 2.2、2.3 |\n| Azure 文件 | 托管文件共享、SMB 与 NFS、快照与软删除 | 2.1、2.3 |\n| 共享访问签名与存储访问策略 | 限时委派访问与服务端可回收规则 | 2.1 |\n| Microsoft Entra ID 与密钥保管服务 | 按标识授权、密钥轮换与客户管理密钥 | 2.1、2.2 |\n| 虚拟网络与服务终结点 | 存储账户的网络访问边界 | 2.1 |\n| AzCopy 与存储资源管理器 | 批量传输与图形化结构确认 | 2.2 |\n| Azure CLI 与 Az PowerShell | 账户、密钥与传输的命令行证据 | 2.1、2.2 |","furtherReading":"| 页面 | 什么时候去看 | URL |\n|---|---|---|\n| AZ-104 Study Guide | 五域权重区间与技能点原文 | https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104 |\n| 存储账户概述 | 账户包含哪些数据对象、命名空间怎么来 | https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview |\n| 数据冗余 | 各冗余级别抗哪一级故障 | https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy |\n| 共享访问签名 | 委派访问的权限、时限与撤销方式 | https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview |\n| 管理账户访问密钥 | 两把密钥的查看与轮换流程 | https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage |\n| 存储网络安全 | 防火墙与虚拟网络规则怎么生效 | https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security |\n| Azure 文件简介 | 托管共享与 SMB / NFS 协议 | https://learn.microsoft.com/en-us/azure/storage/files/storage-files-introduction |\n| 访问层级概述 | 热、冷、归档的取舍 | https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview |\n| Blob 生命周期管理 | 规则条件与自动动作 | https://learn.microsoft.com/en-us/azure/storage/blobs/storage-lifecycle-management-concepts |\n| Blob 版本控制 | 覆盖后的历史版本怎么留 | https://learn.microsoft.com/en-us/azure/storage/blobs/versioning-overview |\n| AzCopy v10 | 批量复制与断点续传 | https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-v10 |"}},{"domain":3,"name":"部署和管理 Azure 计算资源","weight":"20–25%","practice":[{"id":"D3-001","d":3,"t":"single","q":"拿到一份 Bicep 文件，管理员要确认它会创建哪些资源与依赖顺序，最直接的判断依据是","o":[{"l":"A","t":"看文件名长度"},{"l":"B","t":"查看订阅的预算告警"},{"l":"C","t":"读"},{"l":"D","t":"检查目标资源组是否有资源锁"}],"a":["C"],"e":"**正确答案：C。** 读取 resource 声明、参数与 dependsOn 或隐式引用关系。\n\n**为什么对：** Bicep 里 resource 声明定义资源类型与属性，依赖关系由显式 dependsOn 或属性引用推导。关联考点：官方技能点 3.1.1「解读 ARM 模板或 Bicep 文件」，内容领域 3。\n\n**其他选项为什么错：**\n- A：看文件名长度。文件名不承载任何部署语义。\n- B：查看订阅的预算告警。预算与模板内容解析无关。\n- D：检查目标资源组是否有资源锁。资源锁影响部署能否执行，不说明模板要建什么。\n\n**关键概念：** 读模板先读声明与引用，再判断部署图。本题对应考纲 3.1.1。","s":"自编·3.1.1"},{"id":"D3-002","d":3,"t":"single","q":"要在现有 ARM 模板里把硬编码的虚拟机规格改为部署时传入，应修改","o":[{"l":"A","t":"variables 段"},{"l":"B","t":"p"},{"l":"C","t":"outputs 段"},{"l":"D","t":"模板的 apiVersion"}],"a":["B"],"e":"**正确答案：B。** parameters 段并在资源属性里引用该参数。\n\n**为什么对：** 参数负责外部输入，变量负责内部复用，输出负责回传结果，三者职责固定。关联考点：官方技能点 3.1.2「修改现有 ARM 模板」，内容领域 3。\n\n**其他选项为什么错：**\n- A：variables 段。变量在模板内计算，部署时不能从外部传入。\n- C：outputs 段。输出段只回传部署结果，不接收输入。\n- D：模板的 apiVersion。版本号声明资源提供程序接口，与参数化无关。\n\n**关键概念：** 把可变值提成参数是模板复用的第一步。本题对应考纲 3.1.2。","s":"自编·3.1.2"},{"id":"D3-003","d":3,"t":"single","q":"把一段现有 ARM JSON 迁移成 Bicep，最快且可验证的起点是","o":[{"l":"A","t":"用"},{"l":"B","t":"手工逐行重写全部 resource 声明"},{"l":"C","t":"直接把 json 文件改后缀为 bicep"},{"l":"D","t":"删除模板改用门户点击"}],"a":["A"],"e":"**正确答案：A。** 用 az bicep decompile 反向生成再人工校订。\n\n**为什么对：** 反编译工具给出等价骨架，复杂表达式与条件仍需人工复核。关联考点：官方技能点 3.1.3「修改现有 Bicep 文件」，内容领域 3。\n\n**其他选项为什么错：**\n- B：手工逐行重写全部 resource 声明。可行但慢，且容易漏掉条件与依赖。\n- C：直接把 json 文件改后缀为 bicep。两者语法不同，改后缀不会转换内容。\n- D：删除模板改用门户点击。放弃了基础设施即代码的可重复性与留痕。\n\n**关键概念：** 工具负责骨架，人负责语义，迁移不等于自动完成。本题对应考纲 3.1.3。","s":"自编·3.1.3"},{"id":"D3-004","d":3,"t":"single","q":"要把一份 Bicep 文件部署到指定资源组并先预览变更，应使用","o":[{"l":"A","t":"直接 az deployment group create 并靠回滚处理"},{"l":"B","t":"把文件上传到存储账户"},{"l":"C","t":"在门户逐个创建同名资源"},{"l":"D","t":"a"}],"a":["D"],"e":"**正确答案：D。** az deployment group what-if 后再执行 create。\n\n**为什么对：** what-if 在不改动资源的前提下报告将发生的增删改，是部署前的标准检查。关联考点：官方技能点 3.1.4「用模板或 Bicep 部署资源」，内容领域 3。\n\n**其他选项为什么错：**\n- A：直接 az deployment group create 并靠回滚处理。直接创建没有预览，问题只能在部署后暴露。\n- B：把文件上传到存储账户。上传只是存放，不触发任何部署。\n- C：在门户逐个创建同名资源。手工创建不受模板管控，还会造成配置漂移。\n\n**关键概念：** 先预览再落盘，是 IaC 的基本安全动作。本题对应考纲 3.1.4。","s":"自编·3.1.4"},{"id":"D3-005","d":3,"t":"single","q":"管理员要把一次成功部署导出成可复用模板，应优先使用","o":[{"l":"A","t":"从活动日志里复制请求正文"},{"l":"B","t":"在门户里重新点一遍并录屏"},{"l":"C","t":"导"},{"l":"D","t":"直接复制现有资源的属性页"}],"a":["C"],"e":"**正确答案：C。** 导出部署所用模板并按需转成 Bicep。\n\n**为什么对：** 导出模板拿到的就是当时提交的部署定义，再反编译成 Bicep 便于后续维护。关联考点：官方技能点 3.1.5「导出部署或把模板转成 Bicep」，内容领域 3。\n\n**其他选项为什么错：**\n- A：从活动日志里复制请求正文。活动日志记操作与状态，不含完整可复用模板定义。\n- B：在门户里重新点一遍并录屏。录屏无法还原属性与依赖，且不可重放。\n- D：直接复制现有资源的属性页。属性页只展示当前状态，不等于部署定义。\n\n**关键概念：** 从部署记录回抽定义，比从运行时状态反推更可靠。本题对应考纲 3.1.5。","s":"自编·3.1.5"},{"id":"D3-006","d":3,"t":"single","q":"创建虚拟机时要求磁盘具备高可用且托管生命周期由平台负责，应选择","o":[{"l":"A","t":"把 VHD 放在存储账户里做非托管磁盘"},{"l":"B","t":"托"},{"l":"C","t":"使用临时 OS 磁盘存放数据库文件"},{"l":"D","t":"只配置可用性集不配磁盘"}],"a":["B"],"e":"**正确答案：B。** 托管磁盘。\n\n**为什么对：** 托管磁盘由平台处理存储账户、副本与扩展，是新建虚拟机的默认选择。关联考点：官方技能点 3.2.1「创建虚拟机」，内容领域 3。\n\n**其他选项为什么错：**\n- A：把 VHD 放在存储账户里做非托管磁盘。非托管磁盘要自己管存储账户与页 Blob，已不推荐。\n- C：使用临时 OS 磁盘存放数据库文件。临时盘不持久，不适合有状态数据。\n- D：只配置可用性集不配磁盘。可用性集管的是虚拟机分布，不改变磁盘形态。\n\n**关键概念：** 磁盘形态决定运维责任，可用性集决定实例分布，两件事分开配。本题对应考纲 3.2.1。","s":"自编·3.2.1"},{"id":"D3-007","d":3,"t":"single","q":"要求虚拟机 OS 与数据盘静态加密且密钥由公司控制，应配置","o":[{"l":"A","t":"A"},{"l":"B","t":"只启用传输层 TLS"},{"l":"C","t":"给虚拟机加只读资源锁"},{"l":"D","t":"把磁盘设为只读访问模式"}],"a":["A"],"e":"**正确答案：A。** Azure 磁盘加密或带客户管理密钥的加密集。\n\n**为什么对：** 磁盘加密可结合密钥保管库使用客户管理密钥，密钥轮换与撤销由客户掌握。关联考点：官方技能点 3.2.2「配置 Azure 磁盘加密」，内容领域 3。\n\n**其他选项为什么错：**\n- B：只启用传输层 TLS。TLS 保护网络传输，不涉及磁盘静态加密。\n- C：给虚拟机加只读资源锁。资源锁限制管理操作，不提供加密能力。\n- D：把磁盘设为只读访问模式。主机缓存模式影响性能，与加密无关。\n\n**关键概念：** 加密默认开，客户管理密钥才是把控制权拿回来的那一步。本题对应考纲 3.2.2。","s":"自编·3.2.2"},{"id":"D3-008","d":3,"t":"single","q":"要把虚拟机从订阅 A 迁到订阅 B，迁移前必须确认","o":[{"l":"A","t":"两台虚拟机规格完全一致"},{"l":"B","t":"目标订阅名称不能含中文"},{"l":"C","t":"先删除虚拟机所有数据磁盘"},{"l":"D","t":"资"}],"a":["D"],"e":"**正确答案：D。** 资源移动支持该类型且目标订阅内依赖资源可一并处理。\n\n**为什么对：** 跨订阅移动要核对资源提供程序、依赖项、区域与权限，部分资源还需专门迁移工具。关联考点：官方技能点 3.2.3「把虚拟机搬到别的资源组、订阅或区域」，内容领域 3。\n\n**其他选项为什么错：**\n- A：两台虚拟机规格完全一致。规格与目标订阅迁移可行性无关。\n- B：目标订阅名称不能含中文。命名习惯不影响平台迁移规则。\n- C：先删除虚拟机所有数据磁盘。删盘会丢数据，且不是迁移前置条件。\n\n**关键概念：** 移动不是搬文件，是把资源注册与依赖一起换到新边界。本题对应考纲 3.2.3。","s":"自编·3.2.3"},{"id":"D3-009","d":3,"t":"single","q":"业务高峰时虚拟机 CPU 持续饱和，需要提升处理能力，正确做法是","o":[{"l":"A","t":"直接增加托管磁盘容量"},{"l":"B","t":"给虚拟机加第二个网卡"},{"l":"C","t":"调"},{"l":"D","t":"把虚拟机移到另一个资源组"}],"a":["C"],"e":"**正确答案：C。** 调整虚拟机规格并按需重启使新规格生效。\n\n**为什么对：** 规格变更调整的是计算资源配额，通常需要停机重启才能生效。关联考点：官方技能点 3.2.4「管理虚拟机规格」，内容领域 3。\n\n**其他选项为什么错：**\n- A：直接增加托管磁盘容量。磁盘容量只影响存储，不增加计算能力。\n- B：给虚拟机加第二个网卡。网卡扩展的是网络吞吐，不改变 CPU 与内存。\n- D：把虚拟机移到另一个资源组。换资源组只改逻辑归属，不改规格。\n\n**关键概念：** 纵向扩容改规格，横向扩容加实例，别把两者混为一谈。本题对应考纲 3.2.4。","s":"自编·3.2.4"},{"id":"D3-010","d":3,"t":"single","q":"要给现有虚拟机新增一块数据盘并让系统识别，完整动作是","o":[{"l":"A","t":"只把磁盘附加到虚拟机"},{"l":"B","t":"附"},{"l":"C","t":"在存储账户里新建一个 Blob 容器"},{"l":"D","t":"修改虚拟机的可用性集"}],"a":["B"],"e":"**正确答案：B。** 附加托管磁盘后在操作系统内初始化并挂载。\n\n**为什么对：** 平台侧附加与来宾系统内初始化是两个独立步骤，缺一步盘就不可用。关联考点：官方技能点 3.2.5「管理虚拟机磁盘」，内容领域 3。\n\n**其他选项为什么错：**\n- A：只把磁盘附加到虚拟机。附加只是把盘挂到实例，操作系统内仍需分区与格式化。\n- C：在存储账户里新建一个 Blob 容器。容器属于对象存储，不是虚拟机磁盘。\n- D：修改虚拟机的可用性集。可用性集与磁盘挂载无关。\n\n**关键概念：** 挂载与可用是两件事，验证要看操作系统里能不能读写。本题对应考纲 3.2.5。","s":"自编·3.2.5"},{"id":"D3-011","d":3,"t":"multiple","q":"关于可用区与可用性集，下列说法哪些正确","o":[{"l":"A","t":"可用性集可抵御整个区域断电"},{"l":"B","t":"可用区部署仍必须同时配置可用性集"},{"l":"C","t":"可"},{"l":"D","t":"把两台虚拟机放在同一容错域即可获得最高可用性"},{"l":"E","t":"规模集只能用于无状态应用且不能配可用区"},{"l":"F","t":"可"}],"a":["C","F"],"e":"**正确答案：C、F。** 可用区把实例分散到同区域独立物理位置；可用性集把实例分散到不同容错域与更新域。\n\n**为什么对：** 可用区按区域内物理位置隔离，可用性集按机架与维护域隔离。关联考点：官方技能点 3.2.6「把虚拟机部署到可用区和可用性集」，内容领域 3。\n\n**其他选项为什么错：**\n- A：可用性集可抵御整个区域断电。可用性集的作用域在单个数据中心内，不覆盖区域级故障。\n- B：可用区部署仍必须同时配置可用性集。可用区方案本身已提供物理隔离，无需叠加可用性集。\n- D：把两台虚拟机放在同一容错域即可获得最高可用性。同一容错域共享故障边界，反而失去分散意义。\n- E：规模集只能用于无状态应用且不能配可用区。规模集支持跨可用区部署，也不限定应用是否有状态。\n\n**关键概念：** 先分清故障域是区域级还是设施级，再选分布机制。本题对应考纲 3.2.6。","s":"自编·3.2.6"},{"id":"D3-012","d":3,"t":"single","q":"要按 CPU 阈值自动增减虚拟机实例数，且实例配置完全一致，应采用","o":[{"l":"A","t":"给单台虚拟机配置更大的规格"},{"l":"B","t":"手工在高峰前复制虚拟机"},{"l":"C","t":"用负载均衡器的健康检查"},{"l":"D","t":"虚"}],"a":["D"],"e":"**正确答案：D。** 虚拟机规模集配合自动缩放规则。\n\n**为什么对：** 规模集管理一组同构实例，自动缩放按指标触发实例数变化。关联考点：官方技能点 3.2.7「部署并配置虚拟机规模集」，内容领域 3。\n\n**其他选项为什么错：**\n- A：给单台虚拟机配置更大的规格。这是纵向扩容，实例数始终是一台。\n- B：手工在高峰前复制虚拟机。人工操作无法按指标实时伸缩且易漂移。\n- C：用负载均衡器的健康检查。健康检查只判定后端可用性，不创建实例。\n\n**关键概念：** 自动缩放的前提是实例同构，规模集正好提供这个前提。本题对应考纲 3.2.7。","s":"自编·3.2.7"},{"id":"CASE-D3-01","d":3,"t":"single","q":"【案例背景】Litware 的电商应用部署在应用服务上，促销期并发波动大。上线窗口不允许停机，新版本需先小流量验证；应用要访问虚拟网络内数据库，同时只允许办公网发起入站访问。\n\n上线前要在不改资源的前提下确认模板会改哪些配置，应使用","o":[{"l":"A","t":"直接 create 并依赖回滚"},{"l":"B","t":"把模板上传到 Blob 容器"},{"l":"C","t":"a"},{"l":"D","t":"在门户手工点一遍同名资源"}],"a":["C"],"e":"**正确答案：C。** az deployment group what-if 预览后再 create。\n\n**为什么对：** what-if 只报告将发生的增删改，不改动现有资源，是 IaC 上线前标准检查。关联考点：官方技能点 3.1.4「用模板或 Bicep 部署资源」，内容领域 3。\n\n**其他选项为什么错：**\n- A：直接 create 并依赖回滚。没有预览，问题只能在部署后暴露。\n- B：把模板上传到 Blob 容器。上传只是存放，不触发部署或差异比对。\n- D：在门户手工点一遍同名资源。手工操作脱离模板管控，还会造成配置漂移。\n\n**关键概念：** 先预览再落盘，把风险拦在变更发生之前。本题对应考纲 3.1.4。","s":"案例组#Litware 应用上线与弹性·3.1.4"},{"id":"CASE-D3-02","d":3,"t":"single","q":"【案例背景】Litware 的电商应用部署在应用服务上，促销期并发波动大。上线窗口不允许停机，新版本需先小流量验证；应用要访问虚拟网络内数据库，同时只允许办公网发起入站访问。\n\n促销期并发波动大，要求实例数按 CPU 指标自动增减，应采用","o":[{"l":"A","t":"把单台虚拟机规格调大"},{"l":"B","t":"虚"},{"l":"C","t":"高峰前人工复制虚拟机"},{"l":"D","t":"只配置负载均衡器健康检查"}],"a":["B"],"e":"**正确答案：B。** 虚拟机规模集配合自动缩放规则。\n\n**为什么对：** 规模集提供同构实例组，自动缩放按指标与实例上下限调整数量。关联考点：官方技能点 3.2.7「部署并配置虚拟机规模集」，内容领域 3。\n\n**其他选项为什么错：**\n- A：把单台虚拟机规格调大。这是纵向扩容，实例数始终为一台。\n- C：高峰前人工复制虚拟机。人工伸缩无法按指标实时响应且易产生配置漂移。\n- D：只配置负载均衡器健康检查。健康检查判定后端可用性，不创建实例。\n\n**关键概念：** 自动缩放的前提是实例同构，规模集正好提供这个前提。本题对应考纲 3.2.7。","s":"案例组#Litware 应用上线与弹性·3.2.7"},{"id":"CASE-D3-03","d":3,"t":"single","q":"【案例背景】Litware 的电商应用部署在应用服务上，促销期并发波动大。上线窗口不允许停机，新版本需先小流量验证；应用要访问虚拟网络内数据库，同时只允许办公网发起入站访问。\n\n新版本要零停机验证并支持小流量灰度，应使用","o":[{"l":"A","t":"部"},{"l":"B","t":"直接覆盖生产站点文件"},{"l":"C","t":"另建一个订阅部署新版本"},{"l":"D","t":"选停机维护窗口发布"}],"a":["A"],"e":"**正确答案：A。** 部署槽配合交换与流量路由。\n\n**为什么对：** 部署槽让新版本在独立槽预热，再交换或按比例分流，可快速换回。关联考点：官方技能点 3.4.8「配置部署槽」，内容领域 3。\n\n**其他选项为什么错：**\n- B：直接覆盖生产站点文件。覆盖即生效，出问题只能回滚文件，无法灰度。\n- C：另建一个订阅部署新版本。拆订阅不提供同应用内的版本切换与流量比例。\n- D：选停机维护窗口发布。明确产生停机，不符合零停机要求。\n\n**关键概念：** 槽的价值在预热与可回退，交换比重新部署快得多。本题对应考纲 3.4.8。","s":"案例组#Litware 应用上线与弹性·3.4.8"},{"id":"CASE-D3-04","d":3,"t":"single","q":"【案例背景】Litware 的电商应用部署在应用服务上，促销期并发波动大。上线窗口不允许停机，新版本需先小流量验证；应用要访问虚拟网络内数据库，同时只允许办公网发起入站访问。\n\n应用要访问虚拟网络内数据库，同时只允许办公网入站，应配置","o":[{"l":"A","t":"只设访问限制即可打通数据库"},{"l":"B","t":"把应用改为公共访问即视为完成集成"},{"l":"C","t":"给应用服务计划加资源锁"},{"l":"D","t":"虚"}],"a":["D"],"e":"**正确答案：D。** 虚拟网络集成负责出站并另设访问限制管入站。\n\n**为什么对：** 入站与出站是两条独立链路，集成、访问限制与专用终结点各管一段。关联考点：官方技能点 3.4.7「配置应用服务的网络设置」，内容领域 3。\n\n**其他选项为什么错：**\n- A：只设访问限制即可打通数据库。入站规则不负责出站连通性。\n- B：把应用改为公共访问即视为完成集成。公共访问是默认入口状态，与集成无关。\n- C：给应用服务计划加资源锁。资源锁不参与任何网络访问控制。\n\n**关键概念：** 排查连接问题先定位方向，再找对应配置。本题对应考纲 3.4.7。","s":"案例组#Litware 应用上线与弹性·3.4.7"}],"sections":[{"h":"用 ARM 模板或 Bicep 自动部署资源","body":"### 这一域考什么\n\n这一域占官方权重的 20–25%，和身份治理并列最重。二十四个技能点分四块：用模板把部署写下来、建好并维护虚拟机、在门户里把容器跑起来、把应用服务配到能上线。共同点是要能重复、能回退、能说清改了什么。\n\n### 读完这个域要能做什么\n\n读完要能看着一段模板说出它会建什么，也能按负载挑虚拟机规格与磁盘。要能区分注册表、容器实例与应用服务各自的边界。还要把证书、域名、槽位与备份配成一套可发布的应用。每一步都要能回答「为什么不用另一种」。\n\n### 和其他认证怎么接\n\n| 对照课程 | 怎么接 |\n|---|---|\n| AWS DOP-C02 | 运维课里的自动化部署与不可变基础设施，和这里的模板部署是同一套思路，只是声明格式不同。 |\n| AWS SOA-C03 | 架构课会追问什么时候该上容器、什么时候该留虚拟机；本域先把几种形态怎么配练熟。 |\n| AWS MLA-C02 | 模型服务常部署在容器或应用服务上，学完本域可以直接看懂那一科的运行环境章节。 |\n| Azure AZ-305 | 同厂牌设计课把可用区、规模集与灾难恢复放在方案层讨论；本域负责把决策落到具体配置。 |\n\n### 官方口径的三条边界\n\n三条边界先说清。第一，官方现行技能清单标注为 2023 年 10 月 26 日版本，认证页更新日期只是页面元数据。第二，官方不公布题型，也不公布出题频率，域尾两列照实留白。第三，部分能力官方已挂出退役或变更时间，遇到时按官方页面当期口径判断，不照旧笔记硬套。\n\n#### 这一节学什么\n这一节对应考纲任务 3.1「用 ARM 模板或 Bicep 自动部署资源」。\n\n> 官方原名：Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files\n\n五个技能点是一条链：先读懂、再改、最后部署与导出。模板把「要建什么」写成文件，人不再靠记忆点菜单，这是后面所有自动化运维的地基。\n\n#### 解读 ARM 模板或 Bicep 文件\n\n> 官方原名：Interpret an Azure Resource Manager template or a Bicep file\n\n**这条在问什么。** 题目贴一段模板，问它会创建几个资源、依赖谁、参数从哪来。它考的是读结构，不是背语法。\n\n**定义**：模板用声明的方式描述一组资源及其配置，部署时由平台把当前状态收敛到文件写的目标状态。Bicep 是更简洁的写法，最终仍会转成同一种部署描述。\n\n**怎么运作**。读模板先找三处：资源清单与类型、参数与变量的默认值、资源之间的显式依赖。没有写依赖的两个资源可能并行创建，顺序不确定，这正是很多部署偶发失败的原因。再看出参，确认谁会把连接串或地址交给下一步。\n\n**什么时候用，什么时候别用**。接手别人的环境、或排查一次部署为什么少建了东西，先读模板最快。只是临时开一台测试机，写模板反而慢。\n\n💡 **场景举例**（虚构教学示意）：Contoso 接手一套交接来的环境。管理员从模板里看出 Web 应用依赖一个存储账户，且两者没写依赖，于是明白偶发失败来自创建顺序。\n\n**关联服务**：Azure 资源管理器、ARM 模板、Bicep、资源组。\n\n#### 修改现有 ARM 模板\n\n> 官方原名：Modify an existing Azure Resource Manager template\n\n**这条在问什么。** 题目给一段旧模板和一句新要求，问改哪一处。考的是能不能定位到最小改动，而不是整段重写。\n\n**定义**：模板是可版本化的文本文件，修改意味着改声明，不是进门户手点。改完再部署一次，平台按差异调整资源。\n\n**怎么运作**。先把写死的取值提成参数，再改资源属性，最后检查依赖与命名是否仍一致。名称往往全局唯一，随意改一个名字，部署会变成新建一份而不是原地更新。\n\n**什么时候用，什么时候别用**。同一套环境要复制到多个区域或多套环境，值得把差异都提成参数。只改一次、以后不再复用，直接改值更快，但要把改动记进变更记录。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把模板里的区域与规格提成参数。此后测试和生产用同一份文件，只换参数文件，两套环境不再出现手工配歪。\n\n**关联服务**：Azure 资源管理器、模板参数文件、资源组部署。\n\n#### 修改现有 Bicep 文件\n\n> 官方原名：Modify an existing Bicep file\n\n**这条在问什么。** 题目给一段 Bicep，问加一个资源或改一个属性该动哪里。它考的是语法可读性，不是新概念。\n\n**定义**：Bicep 是面向 Azure 资源的声明式语言，比等价的 JSON 模板短很多，也更容易做类型检查。部署前会编译成相同形态的模板。\n\n**怎么运作**。改 Bicep 时先看参数声明与资源块，再用已有资源名做引用，别把依赖写成字符串猜测。改完先做一次预演，看平台算出来的变更列表，再决定是否提交。\n\n**什么时候用，什么时候别用**。新写的部署脚本优先用它，可读性更好，评审也容易。维护大量历史 JSON 模板且团队已熟悉，就不必为了统一而整体迁移。\n\n💡 **场景举例**（虚构教学示意）：Contoso 新人接手部署脚本，用 Bicep 重写了最常改的那一段。评审时能一眼看出新加的是一台虚拟机还是一条网络规则。\n\n**关联服务**：Bicep、Azure CLI、资源组部署、变更预演。\n\n#### 用模板或 Bicep 部署资源\n\n> 官方原名：Deploy resources by using an Azure Resource Manager template or a Bicep file\n\n**这条在问什么。** 题目问「怎么把这套环境一次性建到新订阅」，或者「部署失败后能不能直接重跑」。考的是作用域与重跑行为。\n\n**定义**：部署是把声明文件交给资源管理器执行的一次操作，可以作用在资源组、订阅等作用域。同一份文件重复提交，结果应收敛到同一目标状态。\n\n**怎么运作**。提交前确认三件事：作用到哪个订阅与资源组、参数文件是不是这一套环境的、用的是增量还是完整模式。完整模式会把声明里没写的资源一并处理掉，选错就是删资源。预演能列出将要发生的变更。\n\n**什么时候用，什么时候别用**。批量建环境、灾备重建、多区域复制，用部署最稳。临时排查一个配置项，进门户改更快，但改完要回填模板，否则下次部署会把手工改动覆盖掉。\n\n💡 **场景举例**（虚构教学示意）：Contoso 在华南重建一套灾备环境。管理员先跑预演确认变更列表，再用同一份 Bicep 加新参数文件提交，半小时后环境齐备。\n\n**关联服务**：Azure 资源管理器、部署作用域、增量与完整模式、变更预演。\n\n#### 导出部署或把模板转成 Bicep\n\n> 官方原名：Export a deployment as an Azure Resource Manager template or convert an Azure Resource Manager template to a Bicep file\n\n**这条在问什么。** 题目给一套手工建好的环境，问怎么把它变成可重复的部署文件。答案是导出，不是照着屏幕重敲一遍。\n\n**定义**：平台可以把现有资源组或某次部署导成模板，也可以把 JSON 模板反向转成 Bicep。导出物是起点，不是可直接投产的成品。\n\n**怎么运作**。先看导出的资源清单是否完整，再把写死的名称、区域、规格提成参数，补上导出时带不出来的机密与依赖。整理完试部署到空资源组，能重现才算通过。\n\n**动手看一眼**（命令逐字取自官方《导出资源组模板》文档）：\n\n```bash\naz group export --name demoGroup\naz group export --resource-group demoGroup --resource-ids $storageAccountID\n```\n\n**什么时候用，什么时候别用**。要把历史环境纳入版本管理，导出最省起步成本。但导出的文件常带运行时状态与冗余属性，别直接当标准模板发给全团队。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把一套跑了两年的人工环境导出成模板。管理员删掉运行时字段、把区域提成参数，再在空资源组里试部署，确认能重现后才收进代码库。\n\n**关联服务**：Azure CLI、资源组导出、Bicep 反向转换、资源组部署。\n\n#### 常见误区与易错点\n\n| 误区 | 为什么错 / 怎么改 |\n|---|---|\n| 把部署当成一次性脚本 | 声明写的是目标状态，手工改动会在下次部署被覆盖，改完要回填文件。 |\n| 完整模式随手就选 | 声明里没写的资源会被处理掉，选错作用域等于批量删资源。 |\n| 导出模板直接投产 | 导出物常含运行时状态和冗余字段，要先参数化并试部署。 |\n| 依赖全靠命名猜 | 没写依赖的资源可能并行创建，偶发失败最难查。 |\n\n#### 记忆要点\n\n1. 读模板先看资源清单、参数默认值、依赖与出参。\n2. 改声明不改名，名称一变往往变成新建资源。\n3. 部署前确认作用域、参数文件与增量或完整模式。\n4. 导出物是起点，参数化并空组试部署后才算可复用。\n\n---"},{"h":"创建和配置虚拟机","body":"#### 这一节学什么\n这一节对应考纲任务 3.2「创建和配置虚拟机」。\n\n> 官方原名：Create and configure virtual machines\n\n七个技能点围着一台机器从生到养：建出来、加密、搬家、换规格、管磁盘、放到可用区、再变成一组可伸缩的实例。题目爱把「改了会不会停机」藏在选项里。\n\n#### 创建虚拟机\n\n> 官方原名：Create a virtual machine\n\n**这条在问什么。** 题目给一套应用要求，问建机时先定什么。它考的是建之前必须先定下来的几项，不是点下一步的顺序。\n\n**定义**：官方把虚拟机列为 Azure 提供的按需、可伸缩计算资源之一。建一台机器，等于把镜像、规格、磁盘、网络与管理入口组合成一个资源集合。\n\n**怎么运作**。先选区域与镜像，再定规格与磁盘类型，接着落到虚拟网络和子网，最后定登录方式。这几项分布在多个资源上，所以一台机器从来不是一个孤立对象。改用模板建，可以把它们一次写清。\n\n**动手看一眼**（命令逐字取自官方《用命令行创建 Linux 虚拟机》文档）：\n\n```bash\naz group create --name $MY_RESOURCE_GROUP_NAME --location $REGION\naz vm create \\\n```\n\n**什么时候用，什么时候别用**。要完全控制操作系统、装特定内核模块或跑传统应用，用虚拟机最直接。只是跑一个标准 Web 应用，应用服务或容器省掉大量补丁与运维工作。\n\n💡 **场景举例**（虚构教学示意）：Contoso 有一套只认特定系统库的工业软件。管理员用命令行建好虚拟机、指定子网与登录方式，安装过程照旧，网络侧无需改代码。\n\n**关联服务**：Azure 虚拟机、镜像、虚拟网络、Azure CLI。\n\n#### 配置 Azure 磁盘加密\n\n> 官方原名：Configure Azure Disk Encryption\n\n**这条在问什么。** 题目问「合规要求虚拟机磁盘加密，密钥还要自己管」。答题要同时讲清密钥放哪、以及这项能力的现行状态。\n\n**定义**：磁盘加密保护虚拟机操作系统盘与数据盘上的静态数据，密钥通常交由密钥保管服务统一管理。官方页面明确标注，这项能力计划于 2028 年 9 月 15 日退役。\n\n**怎么运作**。启用时把加密密钥与密钥保管服务关联，平台在磁盘层完成加解密。密钥不可用时，机器可能无法正常启动，所以密钥的备份与权限和加密开关本身同等重要。\n\n**什么时候用，什么时候别用**。存量环境确有合规条款要求，就按官方当期流程配好并登记退役时间，提前规划替代方案。新项目不要把它当默认选型，先查官方文档当前推荐的做法。\n\n💡 **场景举例**（虚构教学示意）：Contoso 一台存量虚机按旧合规要求开了磁盘加密。管理员把密钥权限与备份写进交接单，同时记下官方退役日期，避免两年后临时救火。\n\n**关联服务**：Azure 磁盘加密、密钥保管服务、虚拟机磁盘。\n\n#### 把虚拟机搬到别的资源组、订阅或区域\n\n> 官方原名：Move a virtual machine to another resource group, subscription, or region\n\n**这条在问什么。** 题目给「换个订阅」和「换个区域」两种说法，问是不是同一个操作。这是最常见的一道分界题。\n\n**定义**：换资源组或订阅属于资源移动，资源本身不变，只是换挂载位置。换区域属于迁移，通常要在目标区域重建一份，再把数据与服务切过去。\n\n**怎么运作**。移动前先查依赖：磁盘、网卡、公网地址、密钥保管库与策略分配是否都支持一起移。迁移则要先在目标区域准备网络与存储，复制数据，再切流量，最后清理旧资源。\n\n**什么时候用，什么时候别用**。只是账务归属或管理边界变了，用移动，代价小。为降低延迟或满足数据驻留要求，只能做迁移，要预留停机窗口与回退方案。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把一批虚机从测试订阅移到生产订阅，资源 ID 与配置都保留。后来要迁到华南，则在新区域重建并同步数据，按窗口切流量。\n\n**关联服务**：Azure 资源移动、资源组、订阅、区域迁移。\n\n#### 管理虚拟机规格\n\n> 官方原名：Manage virtual machine sizes\n\n**这条在问什么。** 题目给监控图，问该不该升配、升了会怎样。它考的是读负载与知道代价。\n\n**定义**：官方说明虚拟机规格提供多种组合，按 CPU、内存、存储与网络带宽等需求选择。规格不是单一数字，不同系列偏重不同资源。\n\n**怎么运作**。先看一段时间内的真实用量，再选同系列或跨系列的规格。调整规格通常要重启机器，且目标区域未必提供所有规格，所以要先查该区域可用的清单。\n\n**动手看一眼**（命令逐字取自官方《查询区域可用规格》文档）：\n\n```bash\naz vm list-skus --location <region> --output table\n```\n\n**什么时候用，什么时候别用**。持续高负载且已排查过应用问题，才值得升配。负载是短时尖峰，用规模集或自动伸缩比换一台更大的机器更划算。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的报表机每周一早上 CPU 打满，其余时间很闲。管理员没有直接升配，而是先查区域规格清单，再决定改成按计划伸缩。\n\n**关联服务**：Azure 虚拟机规格、区域可用性、Azure CLI。\n\n#### 管理虚拟机磁盘\n\n> 官方原名：Manage virtual machine disks\n\n**这条在问什么。** 题目问「空间不够了」或「改配置前想留个回退点」，分别对应扩容与快照，别混成一个答案。\n\n**定义**：官方说明 Azure 提供多种托管磁盘类型，各自面向不同场景。磁盘是独立于虚拟机的资源，可以单独附加、扩容或做快照。\n\n**怎么运作**。扩容先在磁盘资源上改大小，再到操作系统里扩展分区或文件系统，两步缺一都看不到新空间。快照是某一时刻的只读副本，用来回退或另建一块盘，和备份的恢复粒度不同。\n\n**动手看一眼**（命令逐字取自官方《附加与移除数据磁盘》文档）：\n\n```bash\nGet-AzDisk `\nRemove-AzVMDataDisk `\n```\n\n**什么时候用，什么时候别用**。数据增长可预期，扩容最直接；要频繁做变更后回退，快照更合适。别把快照当长期备份，它仍在同一区域，也仍占容量费用。\n\n💡 **场景举例**（虚构教学示意）：Contoso 给数据库机加了一块数据盘。管理员先查磁盘状态，确认挂载无误，再在系统中扩展卷；大版本变更前另打一次快照留退路。\n\n**关联服务**：Azure 托管磁盘、磁盘快照、虚拟机、Az PowerShell。\n\n#### 把虚拟机部署到可用区和可用性集\n\n> 官方原名：Deploy virtual machines to availability zones and availability sets\n\n**这条在问什么。** 题目给「一台机器挂了业务不能停」，问该把两台机器放哪。答题关键是分清故障域的粒度。\n\n**定义**：可用区是同一区域内的独立物理位置，可用性集则把机器分散到同一数据中心内不同的故障域与更新域。两者都是为了避免单点，但扛的故障范围不同。\n\n**怎么运作**。把多台机器分到不同可用区，机房级故障仍有存活实例；分到可用性集的不同更新域，平台做计划维护时不会一次重启全部实例。选了哪种，会影响可用的规格与磁盘类型。\n\n**动手看一眼**（命令逐字取自官方《查询可用性集规格》文档）：\n\n```bash\naz vm list-skus --resource-type availabilitySets --query '[?name==`Aligned`].{Location:locationInfo[0].location, MaximumFaultDomainCount:capabilities[0].value}' -o Table\n```\n\n**什么时候用，什么时候别用**。关键业务要跨机房冗余，优先可用区，但要确认该区域和规格都支持。老应用只能在单一数据中心内跑，用可用性集依旧比全放一起强。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把两台订单服务分别放进两个可用区。一次机房供电故障只影响其中一台，另一台继续接单，前端负载均衡自动收拢流量。\n\n**关联服务**：Azure 可用区、可用性集、虚拟机、负载均衡器。\n\n#### 部署并配置虚拟机规模集\n\n> 官方原名：Deploy and configure an Azure Virtual Machine Scale Sets\n\n**这条在问什么。** 题目给流量忽高忽低，问怎么让实例数自己变。它考的是「一组机器」而不是「一台更大的机器」。\n\n**定义**：官方对规模集的定义是，创建并管理一组负载均衡的虚拟机实例。实例由同一份配置生成，可以按需增减数量。\n\n**怎么运作**。先定一份实例模板与网络，再设实例数或自动伸缩规则。伸缩发生时，平台按同一份配置新建或回收实例，所以应用不该把状态只存在本地盘。\n\n**什么时候用，什么时候别用**。无状态、负载波动大的服务适合规模集，扩容快且成本随用量走。有状态且强依赖本地磁盘的旧系统，先改造状态存放方式再谈伸缩。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的查询服务白天二十台、夜里三台。管理员用规模集配好伸缩规则，会话改存到共享缓存后，回收实例不再影响登录用户。\n\n**关联服务**：Azure 虚拟机规模集、负载均衡器、自动伸缩规则。\n\n#### 常见误区与易错点\n\n| 误区 | 为什么错 / 怎么改 |\n|---|---|\n| 把跨区域迁移说成换资源组 | 前者要重建并切流量，后者只是换挂载位置，工作量差一个量级。 |\n| 磁盘扩容只改门户里的大小 | 操作系统内还要扩展分区，否则应用看到的可用空间不变。 |\n| 把快照当异地备份 | 快照仍在同一区域，抗不了区域级故障。 |\n| 有状态应用直接上规模集 | 实例会被回收，本地状态随之消失。 |\n\n#### 记忆要点\n\n1. 建机前定镜像、规格、网络、登录方式，这几项分布在多个资源上。\n2. 磁盘加密密钥放密钥保管服务，官方已标注退役时间，别当默认选型。\n3. 换规格要重启，先按真实负载判断是不是该伸缩而不是升配。\n4. 可用区抗机房故障，可用性集抗同机房维护与硬件故障。\n\n#### 案例\n\n**💡 综合案例：Contoso 的订单服务扩容交接**\n\n> 这一节先讲清共同背景。后面的几道题都从这里出发，每道只考一个技能点。做完可以展开解析，看它对应官方考纲哪一条。\n\n虚构教学场景：Contoso 的订单服务跑在一台手工建好的虚拟机上。周一促销流量翻倍，运维想把机器换成更大的规格；同时合规要求磁盘静态数据加密，财务要求这套环境能从测试订阅挪到生产订阅。架构组还提出，下季度要能在机房故障时继续接单。\n\n这份背景把本域二十四个技能点串成一条线。先看监控再决定升配还是伸缩，规格清单要按区域查；磁盘加密与密钥保管一起配，并登记官方退役时间；换订阅属于资源移动，换区域才是迁移；抗机房故障要靠可用区或规模集，而前提是应用状态不能只存在本地盘。整套环境最后应收回模板，避免手工改动在下次部署被覆盖。\n\n案例题只在课程里出现，不进刷题工具，也不计入模拟考。真实考场的案例卡有左栏资料菜单，界面手感请到官方 Exam Sandbox 体验。\n\n---"},{"h":"在 Azure 门户预配和管理容器","body":"#### 这一节学什么\n这一节对应考纲任务 3.3「在 Azure 门户预配和管理容器」。\n\n> 官方原名：Provision and manage containers in the Azure portal\n\n这一组专门说容器。官方把容器实例定位为不必管理虚拟机就能跑起来的最快方式，把 AKS 定位为把 Kubernetes 运维复杂度交给平台的托管服务。四个技能点要辨清的是「谁来管集群」。\n\n#### 创建和管理容器注册表\n\n> 官方原名：Create and manage an Azure container registry\n\n**这条在问什么。** 题目问「自己构建的镜像放哪，部署时怎么取」。它考的是镜像存放与认证，不是容器怎么启动。\n\n**定义**：容器注册表是托管私有镜像仓库，用来存放和分发自己构建的容器镜像。官方提供了在门户创建注册表的快速入门。\n\n**怎么运作**。先建注册表，再用命令行登录，接着给本地镜像打上符合注册表地址的标签并推送。部署侧则用自己的身份去拉镜像，登录凭证不写进应用配置。\n\n**动手看一眼**（命令逐字取自官方《创建容器注册表》文档）：\n\n```bash\naz acr login --name <registry-name>\n```\n\n**什么时候用，什么时候别用**。团队有多个自建镜像、且要控制谁能拉，注册表基本是必配。只用公共镜像且不改，直接引用公共地址更轻，但也失去版本与权限控制。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把订单服务镜像推到自己的注册表。部署脚本先登录再拉取，不再依赖某位工程师本机上的镜像缓存。\n\n**关联服务**：Azure 容器注册表、容器镜像、Azure CLI。\n\n#### 用容器实例预配容器\n\n> 官方原名：Provision a container by using Azure Container Instances\n\n**这条在问什么。** 题目给一个跑几小时就结束的批处理任务，问用什么最省事。答案不是搭一套集群。\n\n**定义**：官方把容器实例描述为在 Azure 中运行容器最快、最简单的方式，不需要管理虚拟机，也不必采用更高层的服务。\n\n**怎么运作**。在门户里指定镜像、资源规格、端口与重启策略，平台直接把容器跑起来。它按容器实例计费，没有集群控制面要维护，也没有节点要打补丁。\n\n**什么时候用，什么时候别用**。短任务、一次性作业、简易演示或事件驱动的小工具，用它启动快、收尾干净。要长期运行、服务发现、滚动升级与多实例编排，就得换编排平台。\n\n💡 **场景举例**（虚构教学示意）：Contoso 每晚跑一次数据清洗，脚本打成镜像后用容器实例启动，跑完自动停止，第二天再起一个新的，没有常驻集群。\n\n**关联服务**：Azure 容器实例、容器注册表、重启策略。\n\n#### 用容器应用预配容器\n\n> 官方原名：Provision a container by using Azure Container Apps\n\n**这条在问什么。** 题目问「一个要长期对外服务、还要按请求量伸缩的容器应用怎么放」。它介于单个容器实例和完整集群之间。\n\n**定义**：容器应用是托管式容器运行环境，面向长期运行的微服务与接口，把底层编排细节收进平台，同时提供按流量伸缩与版本修订能力。\n\n**怎么运作**。把镜像与环境变量交给环境，平台负责起实例、接流量、按规则增减实例数。新版本以修订形式上线，可以分配流量比例，验证后再把全部流量切过去。\n\n**什么时候用，什么时候别用**。多个微服务要长期运行，又不想自己维护控制面，用它比容器实例合适。需要自定义调度器、特殊网络插件或完全控制 Kubernetes 原生对象，才考虑托管集群。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把两个接口服务放进同一个容器应用环境。促销期间实例数自动涨上去，活动结束回落到最小值，运维没有登过任何节点。\n\n**关联服务**：Azure 容器应用、容器注册表、修订与流量分配。\n\n#### 管理容器的规模与缩放\n\n> 官方原名：Manage sizing and scaling for containers, including Azure Container Instances and Azure Container Apps\n\n**这条在问什么。** 题目给「响应变慢」，问该加 CPU 还是加实例数。它考的是纵向与横向两条路的取舍。\n\n**定义**：规模指单个容器实例的 CPU 与内存配额，缩放指实例的数量。官方把容器的规模与缩放作为一项技能点单列，正是因为它常被混为一谈。\n\n**怎么运作**。先判断瓶颈位置：单实例内部计算吃满，调规格；并发请求排队但单实例还很闲，加实例数。实例要能被随时回收，会话与临时状态必须放到外部存储。\n\n**什么时候用，什么时候别用**。无状态服务优先横向缩放，弹性更好、故障面更小。单个任务本身很重且无法拆分，才提高单实例规格，代价是扩容粒度变粗。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的报表生成是重计算但并发不高，于是提高单实例规格；对外接口并发高、单请求很轻，于是按请求数横向加实例。\n\n**关联服务**：Azure 容器实例、容器应用、缩放规则、外部状态存储。\n\n#### 常见误区与易错点\n\n| 误区 | 为什么错 / 怎么改 |\n|---|---|\n| 把登录凭证写进部署脚本 | 凭证会随脚本进代码库，应交给身份或登录会话。 |\n| 短任务也搭一套集群 | 控制面本身要维护，成本与复杂度都超过任务本身。 |\n| 把规格和实例数当同一个旋钮 | 一个改单实例能力，一个改并发容量，判断依据不同。 |\n| 有状态服务直接横向缩放 | 实例回收会带走本地状态，先外置会话与文件。 |\n\n#### 记忆要点\n\n1. 注册表管镜像，容器实例管单任务，容器应用管长期服务。\n2. 托管集群把运维复杂度交给平台，但也带来更多概念与成本。\n3. 规格是纵向，实例数是横向，先按瓶颈位置选。\n4. 可缩放的前提是实例无状态。\n\n---"},{"h":"创建和配置 Azure 应用服务","body":"#### 这一节学什么\n这一节对应考纲任务 3.4「创建和配置 Azure 应用服务」。\n\n> 官方原名：Create and configure Azure App Service\n\n八个技能点是一套上线流程。官方说应用服务让 Web 应用、移动后端与接口不必操心底层基础设施；应用服务计划则定义一组供 Web 应用运行的计算资源。计划、应用、证书、域名、备份、网络、槽位，顺序就是发布顺序。\n\n#### 预配应用服务计划\n\n> 官方原名：Provision an App Service plan\n\n**这条在问什么。** 题目问「两个应用能不能共用一套资源」，或「为什么换了层级功能就多了」。答案都落在计划上。\n\n**定义**：官方定义是，应用服务计划为 Web 应用定义一组计算资源，且每个应用都运行在某个计划里。计划决定区域、规格与可用的功能档次。\n\n**怎么运作**。同一计划里的多个应用共享那组计算资源，因此一个应用吃满，邻居也会受影响。证书、自定义域、槽位等能力是否可用，取决于计划所在的层级。\n\n**动手看一眼**（命令逐字取自官方《查询计划可用位置》文档）：\n\n```bash\naz appservice list-locations --managed-instance-enabled --sku <sku>\n```\n\n**什么时候用，什么时候别用**。几个低流量内部应用共用一个计划，成本最省。生产与预发布、或负载差异很大的应用，建议分开计划，避免互相抢资源，也便于单独升级。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把三个内部小工具放在同一计划里。上线对外商城时另建一个计划，促销流量再大也不会拖慢内部工具。\n\n**关联服务**：Azure 应用服务计划、区域、定价层级。\n\n#### 为计划配置缩放\n\n> 官方原名：Configure scaling for an App Service plan\n\n**这条在问什么。** 题目给流量曲线，问怎么让容量自己跟着变，以及哪些条件要先查。它考的是规则条件，不是手动加一台。\n\n**定义**：缩放是改变计划背后的实例数量。可以按固定数量手动扩，也可以按指标或计划时间自动扩。\n\n**怎么运作**。先定最小与最大实例数，再选触发指标与观察窗口，最后设冷却时间。窗口太短会被瞬时毛刺反复触发，冷却太短则刚扩完又缩回去，两边都会抖。\n\n**什么时候用，什么时候别用**。流量有明显周期或可预期活动，按规则自动扩最省人力。负载平稳、只有一两个实例的小站，手动定死实例数更容易算清账单。\n\n💡 **场景举例**（虚构教学示意）：Contoso 给商城计划设了按 CPU 与请求数的自动缩放入口，并留足冷却时间。促销结束后实例慢慢回落，没有出现反复抖动。\n\n**关联服务**：Azure 应用服务计划、自动伸缩规则、Azure Monitor 指标。\n\n#### 创建应用服务\n\n> 官方原名：Create an App Service\n\n**这条在问什么。** 题目给一套代码与技术栈，问建应用时该选什么。它考的是运行时与计划的组合，不是怎么上传压缩包。\n\n**定义**：官方说应用服务是一个无需管理底层基础设施就能运行 Web 应用、移动后端与接口的平台，支持多种运行时栈，也支持 Windows 与 Linux。\n\n**怎么运作**。建应用时选运行时栈、操作系统、区域与所属计划。建好后得到默认主机地址，代码可以通过压缩包、持续集成或仓库推上来。配置以应用设置的形式作为环境变量传给代码。\n\n**动手看一眼**（命令逐字取自官方《部署应用包》文档）：\n\n```bash\naz webapp deploy --resource-group <group-name> --name <app-name> --src-path <zip-package-path>\n```\n\n**什么时候用，什么时候别用**。标准 Web 应用、接口服务直接上应用服务，补丁与运行时由平台管。需要自定义内核、装系统级服务，还是得回到虚拟机。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把一个接口服务建成应用，代码用压缩包推送。运维不再负责给操作系统打补丁，只管应用配置与发布。\n\n**关联服务**：Azure 应用服务、应用设置、部署包、Azure CLI。\n\n#### 配置证书与 TLS\n\n> 官方原名：Configure certificates and Transport Layer Security (TLS) for an App Service\n\n**这条在问什么。** 题目问「站点要支持加密访问怎么做」，或「证书快过期了谁负责续」。考点在证书来源与绑定关系。\n\n**定义**：应用服务可以导入自有证书或使用平台托管证书，再把证书绑定到自定义域名上，为站点启用加密访问。官方页面标注，托管证书的颁发与续订方式自 2025 年 7 月 28 日起有变化。\n\n**怎么运作**。先让证书可用，再完成域名所有权验证，最后做绑定并开启仅加密访问。自有证书要自己盯到期时间与续订，托管证书由平台处理，但有适用条件。\n\n**什么时候用，什么时候别用**。对外站点基本都应开启加密访问。内部测试站点用默认域名时，可以先不配证书，省掉一轮域名验证。\n\n💡 **场景举例**（虚构教学示意）：Contoso 商城上线前导入证书、绑定域名并开启仅加密访问。交接单里写明证书来源与到期检查人，避免明年续订没人负责。\n\n**关联服务**：Azure 应用服务、TLS 证书、密钥保管服务、自定义域。\n\n#### 把现有自定义 DNS 名称映射到应用服务\n\n> 官方原名：Map an existing custom DNS name to an App Service\n\n**这条在问什么。** 题目给一个已在别处使用的域名，问怎么切过来且尽量不中断。它考的是验证与解析的先后。\n\n**定义**：自定义域名映射是把自己的域名指向应用服务。平台要先确认申请者确实拥有这个域名，才允许绑定。\n\n**怎么运作**。先在域名注册商处加一条验证记录，平台确认后再绑定主机名，最后把业务解析记录改到应用服务。顺序反了，访问会先落到还没有绑定的地址上。\n\n**动手看一眼**（命令逐字取自官方《绑定自定义域名》文档）：\n\n```bash\naz webapp config hostname add \\\n```\n\n**什么时候用，什么时候别用**。对外品牌域名必配。内部临时预览用平台给的默认地址就够，改解析反而拖慢验证。\n\n💡 **场景举例**（虚构教学示意）：Contoso 先用验证记录完成所有权确认，再挑低峰时段把解析切到商城应用，全程没有出现域名指向空地址。\n\n**关联服务**：Azure 应用服务、Azure DNS 或外部注册商、自定义域绑定。\n\n#### 为应用服务配置备份\n\n> 官方原名：Configure backup for an App Service\n\n**这条在问什么。** 题目问「发布前想留一份能整体回退的快照」，或「数据库是不是一起备」。它考的是备份范围。\n\n**定义**：应用服务支持自定义备份，可把应用文件与配置按计划保存下来。官方页面标注，自 2028 年 3 月 31 日起，自定义备份将不再支持备份链接的数据库。\n\n**怎么运作**。先定存储位置与备份计划，再核对备份范围是否包含代码、配置与链接资源。恢复可以是整体还原，也可以只取回某个时间点的快照，恢复前要确认目标应用。\n\n**动手看一眼**（命令逐字取自官方《应用快照与还原》文档）：\n\n```bash\naz webapp config snapshot list --name <app-name> --resource-group <group-name>\naz webapp config snapshot restore --name <app-name> --resource-group <group-name> --time <snapshot-timestamp>\n```\n\n**什么时候用，什么时候别用**。版本发布、批量改配置之前做一次，回退最快。数据库与文件的一致性要求高，应交给数据库自身的备份能力，别指望应用备份一次打包。\n\n💡 **场景举例**（虚构教学示意）：Contoso 在改一轮应用配置前列出可用快照并确认时间点。改坏之后按时间点还原，数据库则由自己的备份链路单独恢复。\n\n**关联服务**：Azure 应用服务自定义备份、快照、存储账户。\n\n#### 配置应用服务的网络设置\n\n> 官方原名：Configure networking settings for an App Service\n\n**这条在问什么。** 题目给「只允许公司网段访问后台」，或「应用要连到虚拟网络里的数据库」。两个要求方向相反，答题时要分清。\n\n**定义**：应用服务的网络设置包含入站访问限制与出站连接能力。官方把应用部署方式分为多种，网络形态随所选方式而变。\n\n**怎么运作**。入站侧用访问限制按来源地址放行或拒绝；出站侧要让应用能进入虚拟网络，才能用私有地址访问内部资源。私有终结点还能让外部访问只走私有通道。\n\n**动手看一眼**（命令逐字取自官方《配置与查看应用设置》文档）：\n\n```bash\naz webapp config appsettings set --resource-group <group-name> --name <app-name> --settings <setting-name>=\"<value>\"\naz webapp config appsettings list --resource-group <group-name> --name <app-name>\n```\n\n**什么时候用，什么时候别用**。后台管理端加访问限制收益很大。面向公众的商城前端别照抄同一套白名单，否则用户会被挡在门外。\n\n💡 **场景举例**（虚构教学示意）：Contoso 给后台管理端设了入站白名单，又让应用服务通过虚拟网络集成去连内网数据库。前台商城保持公开，两边规则互不干扰。\n\n**关联服务**：Azure 应用服务、虚拟网络集成、访问限制、专用终结点。\n\n#### 配置部署槽\n\n> 官方原名：Configure deployment slots for an App Service\n\n**这条在问什么。** 题目问「怎么做到上线不中断、出问题立刻回退」。答案是先在另一个槽位验证，再交换，而不是直接覆盖生产。\n\n**定义**：官方说明，部署时可以使用独立槽位，而不必直接部署到默认的生产槽。槽位本身也是一套可运行的应用实例。\n\n**怎么运作**。建一个预发布槽，把新版本部署进去验证，再把两个槽交换。交换的是流量指向，回滚只要再交换一次。部分配置可标记为跟随槽位，不跟随的设置会随交换一起走，上线前要逐项确认。\n\n**动手看一眼**（命令逐字取自官方《创建与交换部署槽》文档）：\n\n```bash\naz webapp deployment slot create --name <app-name> --resource-group <group-name> --slot <slot-name>\naz webapp deployment slot swap --resource-group <group-name> --name <app-name> --slot <source-slot-name> --target-slot production\n```\n\n**什么时候用，什么时候别用**。生产发布几乎都该用槽位，回退代价最小。探测性的小改动或内部工具，多一个槽位反而多一份要维护的实例与配置。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把新版本放进预发布槽跑了一天，确认连接串与证书无误后交换。上线十分钟发现一个问题，再交换一次即回到旧版。\n\n**关联服务**：Azure 应用服务部署槽、槽位交换、应用配置。\n\n#### 常见误区与易错点\n\n| 误区 | 为什么错 / 怎么改 |\n|---|---|\n| 所有应用挤在一个计划里 | 共享计算资源，一个应用吃满会拖慢同计划的其他应用。 |\n| 自动伸缩窗口设得太短 | 瞬时毛刺会反复触发扩缩，冷却不足会来回抖动。 |\n| 先改解析再验证域名 | 访问会先落到尚未绑定的地址，造成不必要中断。 |\n| 交换槽位前没看槽位绑定设置 | 不跟随槽位的配置会一起换过去，预发布可能连到生产库。 |\n\n#### 记忆要点\n\n1. 计划是资源池，应用挂在计划上，层级决定可用能力。\n2. 缩放改实例数，规格改单实例能力，两者判断依据不同。\n3. 证书绑定、域名验证、仅加密访问三者要配齐。\n4. 槽位先验证再交换，回滚只需再交换一次。\n\n---"}],"tips":{"points":"| 考点 | 内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 解读 ARM 模板或 Bicep 文件（3.1.1） | 声明式文件描述目标状态，先看资源、参数与依赖 | 官方未公布 | 官方未公布 |\n| 修改现有 ARM 模板（3.1.2） | 改参数与资源定义，保留幂等与依赖关系 | 官方未公布 | 官方未公布 |\n| 修改现有 Bicep 文件（3.1.3） | Bicep 用更短语法表达同一套资源声明 | 官方未公布 | 官方未公布 |\n| 用模板或 Bicep 部署资源（3.1.4） | 部署是提交一次声明，作用范围与模式先确认 | 官方未公布 | 官方未公布 |\n| 导出部署或把模板转成 Bicep（3.1.5） | 从现役资源反推声明，导出物需人工整理再复用 | 官方未公布 | 官方未公布 |\n| 创建虚拟机（3.2.1） | 镜像、规格、网络与登录方式是建机四件事 | 官方未公布 | 官方未公布 |\n| 配置 Azure 磁盘加密（3.2.2） | 静态数据加密依赖密钥保管，官方已挂出退役时间 | 官方未公布 | 官方未公布 |\n| 把虚拟机搬到别的资源组、订阅或区域（3.2.3） | 前两者是移动，跨区域是迁移，依赖资源要一起处理 | 官方未公布 | 官方未公布 |\n| 管理虚拟机规格（3.2.4） | 换规格要重启，先按 CPU 内存磁盘网络实测再定 | 官方未公布 | 官方未公布 |\n| 管理虚拟机磁盘（3.2.5） | 托管磁盘分类型，扩容与快照是两种不同动作 | 官方未公布 | 官方未公布 |\n| 把虚拟机部署到可用区和可用性集（3.2.6） | 可用区抗机房级故障，可用性集抗同机房内的维护与硬件故障 | 官方未公布 | 官方未公布 |\n| 部署并配置虚拟机规模集（3.2.7） | 一组同构且负载均衡的实例，实例数随规则变化 | 官方未公布 | 官方未公布 |\n| 创建和管理容器注册表（3.3.1） | 私有镜像仓库，推送与拉取都要先登录 | 官方未公布 | 官方未公布 |\n| 用容器实例预配容器（3.3.2） | 单个或少量容器直接跑，不建集群、不管理虚机 | 官方未公布 | 官方未公布 |\n| 用容器应用预配容器（3.3.3） | 面向长期服务的托管运行环境，内置伸缩与修订 | 官方未公布 | 官方未公布 |\n| 管理容器的规模与缩放（3.3.4） | 规格定单实例上限，缩放定实例数量，两者别混 | 官方未公布 | 官方未公布 |\n| 预配应用服务计划（3.4.1） | 计划定义计算资源池，决定定价层级与区域 | 官方未公布 | 官方未公布 |\n| 为计划配置缩放（3.4.2） | 自动伸缩按指标加实例，先确认层级支持 | 官方未公布 | 官方未公布 |\n| 创建应用服务（3.4.3） | 应用挂在计划上，运行时栈与区域在建时确定 | 官方未公布 | 官方未公布 |\n| 配置证书与 TLS（3.4.4） | 证书绑定与域名验证配套，托管证书规则官方有变更 | 官方未公布 | 官方未公布 |\n| 把现有自定义 DNS 名称映射到应用服务（3.4.5） | 先验证域名所有权，再改解析记录 | 官方未公布 | 官方未公布 |\n| 为应用服务配置备份（3.4.6） | 自定义备份含应用文件与配置，官方标出后续变更 | 官方未公布 | 官方未公布 |\n| 配置应用服务的网络设置（3.4.7） | 入站限制与出站集成是两个方向，别只配一边 | 官方未公布 | 官方未公布 |\n| 配置部署槽（3.4.8） | 预发布槽先验证再交换，配置槽位绑定要单独确认 | 官方未公布 | 官方未公布 |","services":"| 服务 | 主要用途 | 涉及任务 |\n|---|---|---|\n| Azure 资源管理器与 Bicep | 声明式部署、导出与变更预演 | 3.1 |\n| Azure 虚拟机与托管磁盘 | 镜像、规格、磁盘、快照与扩容 | 3.2 |\n| 可用区与可用性集 | 抗机房故障与计划维护的分散放置 | 3.2 |\n| 虚拟机规模集 | 同构实例组与自动伸缩 | 3.2 |\n| 容器注册表与容器实例 | 私有镜像存放与免虚机运行 | 3.3 |\n| 容器应用与托管集群 | 长期微服务与编排能力 | 3.3 |\n| Azure 应用服务与计划 | Web 应用运行环境与计算资源池 | 3.4 |\n| 部署槽、证书与自定义域 | 不中断发布、加密访问与品牌域名 | 3.4 |\n| Azure CLI 与 Az PowerShell | 本域全部动手证据的命令来源 | 3.1–3.4 |","furtherReading":"| 页面 | 什么时候去看 | URL |\n|---|---|---|\n| AZ-104 Study Guide | 五域权重区间与技能点原文 | https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104 |\n| ARM 模板概述 | 声明式部署的结构与依赖 | https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/overview |\n| Bicep 概述 | 更简洁的声明式写法 | https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/overview |\n| 导出模板命令行 | 从现役资源反推声明 | https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/export-template-cli |\n| 虚拟机规格概述 | 按 CPU 内存与带宽选规格 | https://learn.microsoft.com/en-us/azure/virtual-machines/sizes |\n| 托管磁盘类型 | 五种磁盘类型各自面向的场景 | https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types |\n| 磁盘加密概述 | 能力与官方退役时间 | https://learn.microsoft.com/en-us/azure/virtual-machines/linux/disk-encryption-overview |\n| 应用服务计划 | 计划与应用的资源关系 | https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans |\n| 部署槽 | 预发布验证与交换回退 | https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots |\n| 自定义备份 | 备份范围与官方后续变更 | https://learn.microsoft.com/en-us/azure/app-service/manage-backup |\n| 容器实例与 AKS | 免虚机运行与托管编排的分界 | https://learn.microsoft.com/en-us/azure/container-instances/container-instances-overview |"}},{"domain":4,"name":"实现和管理虚拟网络","weight":"15–20%","practice":[{"id":"D4-001","d":4,"t":"single","q":"要在虚拟网络内划分 Web 层与数据层并分别施加不同安全规则，应创建","o":[{"l":"A","t":"为每层各建一个虚拟网络"},{"l":"B","t":"只建一个子网用标签区分"},{"l":"C","t":"两"},{"l":"D","t":"用资源组分层"}],"a":["C"],"e":"**正确答案：C。** 两个子网并分别关联网络安全组。\n\n**为什么对：** 子网是虚拟网络内的地址分段单位，NSG 可按子网关联实现分层管控。关联考点：官方技能点 4.1.1「创建并配置虚拟网络与子网」，内容领域 4。\n\n**其他选项为什么错：**\n- A：为每层各建一个虚拟网络。可以但不必要，跨虚拟网络还需额外对等与路由设计。\n- B：只建一个子网用标签区分。标签是元数据，不形成广播与规则边界。\n- D：用资源组分层。资源组是管理边界，不提供网络分段。\n\n**关键概念：** 先分段再定规则，段边界决定规则能落在哪一层。本题对应考纲 4.1.1。","s":"自编·4.1.1"},{"id":"D4-002","d":4,"t":"single","q":"两个虚拟网络里的资源要用私有地址互通且不经公网，应配置","o":[{"l":"A","t":"给两边都配公共 IP 并走 Internet"},{"l":"B","t":"虚"},{"l":"C","t":"把两个虚拟网络合并为一个"},{"l":"D","t":"只在一边建用户定义路由"}],"a":["B"],"e":"**正确答案：B。** 虚拟网络对等并确保地址空间不重叠。\n\n**为什么对：** 对等把两个虚拟网络在骨干网上直连，地址空间重叠是常见的配置失败原因。关联考点：官方技能点 4.1.2「创建并配置虚拟网络对等」，内容领域 4。\n\n**其他选项为什么错：**\n- A：给两边都配公共 IP 并走 Internet。流量经公网，违背私有互通与不经公网的要求。\n- C：把两个虚拟网络合并为一个。合并要改地址规划与资源，成本高且不是互通方案。\n- D：只在一边建用户定义路由。单向路由不建立双向可达，还缺少对端回程。\n\n**关键概念：** 对等解决连通，地址规划决定能不能对得上。本题对应考纲 4.1.2。","s":"自编·4.1.2"},{"id":"D4-003","d":4,"t":"single","q":"要让虚拟机拥有一个固定公网入口地址且重启后不变，应使用","o":[{"l":"A","t":"标"},{"l":"B","t":"动态公共 IP"},{"l":"C","t":"把私有 IP 手工写成公网地址"},{"l":"D","t":"用负载均衡器的前端名称代替"}],"a":["A"],"e":"**正确答案：A。** 标准 SKU 的静态公共 IP。\n\n**为什么对：** 静态分配保证地址与资源解绑前保持不变，标准 SKU 还支持区域冗余与安全默认。关联考点：官方技能点 4.1.3「配置公共 IP 地址」，内容领域 4。\n\n**其他选项为什么错：**\n- B：动态公共 IP。动态地址在资源停止释放后可能改变，不满足固定要求。\n- C：把私有 IP 手工写成公网地址。私有地址段不可在公网路由。\n- D：用负载均衡器的前端名称代替。名称用于解析，不等于给实例单独固定公网地址。\n\n**关键概念：** 静态与动态说的是分配方式，基本与标准说的是 SKU 能力。本题对应考纲 4.1.3。","s":"自编·4.1.3"},{"id":"D4-004","d":4,"t":"single","q":"要求子网访问 Internet 的流量先经过网络虚拟设备做检查，应配置","o":[{"l":"A","t":"只在子网加一条允许出站的 NSG 规则"},{"l":"B","t":"把设备放在另一个订阅"},{"l":"C","t":"给虚拟机绑定公共 IP"},{"l":"D","t":"用"}],"a":["D"],"e":"**正确答案：D。** 用户定义路由把下一跳指向该设备并启用 IP 转发。\n\n**为什么对：** UDR 通过自定义路由覆盖系统默认路由，配合设备上的 IP 转发才能实现引流。关联考点：官方技能点 4.1.4「配置用户定义的网络路由」，内容领域 4。\n\n**其他选项为什么错：**\n- A：只在子网加一条允许出站的 NSG 规则。NSG 只放行或拒绝，不能改变流量路径。\n- B：把设备放在另一个订阅。订阅边界与流量路径无关，放远处不产生引导效果。\n- C：给虚拟机绑定公共 IP。绑定公网地址会让流量绕开检查设备。\n\n**关键概念：** NSG 管能不能过，UDR 管往哪走，两者常一起用。本题对应考纲 4.1.4。","s":"自编·4.1.4"},{"id":"D4-005","d":4,"t":"single","q":"两台同子网虚拟机之间某端口不通，应优先按什么顺序排查","o":[{"l":"A","t":"直接重建虚拟网络"},{"l":"B","t":"立刻更换公共 IP"},{"l":"C","t":"先"},{"l":"D","t":"先调整订阅预算"}],"a":["C"],"e":"**正确答案：C。** 先查有效 NSG 规则与来宾防火墙，再看路由与对等状态。\n\n**为什么对：** Azure 提供有效安全规则视图，先确认规则是否放行，再逐层排除主机防火墙与路由。关联考点：官方技能点 4.1.5「排查网络连接问题」，内容领域 4。\n\n**其他选项为什么错：**\n- A：直接重建虚拟网络。重建破坏性大，且未定位原因前不一定解决问题。\n- B：立刻更换公共 IP。同子网互访走私有地址，与公网 IP 无关。\n- D：先调整订阅预算。预算与网络连通性没有任何关系。\n\n**关键概念：** 排障从最靠近流量的判定点开始，而不是从重建开始。本题对应考纲 4.1.5。","s":"自编·4.1.5"},{"id":"D4-006","d":4,"t":"single","q":"新增子网时提示地址空间不足，最合理的处理是","o":[{"l":"A","t":"把子网掩码写成更小前缀即可"},{"l":"B","t":"重"},{"l":"C","t":"给虚拟机加第二块网卡"},{"l":"D","t":"删除虚拟网络对等"}],"a":["B"],"e":"**正确答案：B。** 重新规划虚拟网络地址空间并调整子网划分。\n\n**为什么对：** 地址空间在创建时划定，扩展需评估已分配子网与对等网络是否冲突。关联考点：官方技能点 4.1.1「创建并配置虚拟网络与子网」，内容领域 4。\n\n**其他选项为什么错：**\n- A：把子网掩码写成更小前缀即可。地址空间总量没变，改掩码不能凭空增加可用地址。\n- C：给虚拟机加第二块网卡。增加网卡不扩展虚拟网络的地址池。\n- D：删除虚拟网络对等。对等与地址空间容量无关。\n\n**关键概念：** 地址规划是前期决策，后期扩容要检查冲突而不只是改数字。本题对应考纲 4.1.1。","s":"自编·4.1.1"},{"id":"D4-007","d":4,"t":"single","q":"要把一组同角色虚拟机作为整体写进安全规则，避免逐条维护 IP，应使用","o":[{"l":"A","t":"应"},{"l":"B","t":"把 IP 逐条写进 NSG 规则"},{"l":"C","t":"用资源标记代替安全组"},{"l":"D","t":"给每台虚拟机建独立 NSG"}],"a":["A"],"e":"**正确答案：A。** 应用程序安全组 ASG 并在 NSG 规则里引用它。\n\n**为什么对：** ASG 把工作负载按角色分组，NSG 规则引用组名即可随成员变化自动适用。关联考点：官方技能点 4.2.1「创建并配置网络安全组与应用程序安全组」，内容领域 4。\n\n**其他选项为什么错：**\n- B：把 IP 逐条写进 NSG 规则。可行但规模变化时要反复改规则，维护成本高。\n- C：用资源标记代替安全组。标记不参与 NSG 规则匹配。\n- D：给每台虚拟机建独立 NSG。规则分散且更难保持一致。\n\n**关键概念：** 按角色写规则比按地址写规则更贴近业务语义。本题对应考纲 4.2.1。","s":"自编·4.2.1"},{"id":"D4-008","d":4,"t":"single","q":"某端口同时存在子网 NSG 与网卡 NSG 的规则，判断能否通行应依据","o":[{"l":"A","t":"只看子网 NSG"},{"l":"B","t":"以最后创建的那条规则为准"},{"l":"C","t":"以优先级数字最大的规则为准"},{"l":"D","t":"两"}],"a":["D"],"e":"**正确答案：D。** 两层规则的合并结果，入站与出站分别按优先级求值。\n\n**为什么对：** 子网与网卡两层 NSG 独立存在，同一方向需都放行才通，优先级在各自表内生效。关联考点：官方技能点 4.2.2「评估 NSG 中的有效安全规则」，内容领域 4。\n\n**其他选项为什么错：**\n- A：只看子网 NSG。网卡级规则同样生效，忽略会误判。\n- B：以最后创建的那条规则为准。规则按优先级与方向求值，不按创建时间。\n- C：以优先级数字最大的规则为准。数字越小优先级越高，说反了会得出相反结论。\n\n**关键概念：** 有效规则视图能把多层规则合并展示，是排查的权威依据。本题对应考纲 4.2.2。","s":"自编·4.2.2"},{"id":"D4-009","d":4,"t":"multiple","q":"关于网络安全组规则求值，下列说法哪些正确","o":[{"l":"A","t":"同"},{"l":"B","t":"数字越大的规则越先生效"},{"l":"C","t":"入站放行即代表回程出站一定放行"},{"l":"D","t":"优"},{"l":"E","t":"子网 NSG 放行后网卡 NSG 会被忽略"},{"l":"F","t":"应用程序安全组可替代所有 IP 规则且不需要虚拟网络"}],"a":["A","D"],"e":"**正确答案：A、D。** 同一方向内按优先级数字从小到大匹配；优先级相同的冲突由系统规则与应用顺序决定时需要查有效规则。\n\n**为什么对：** 优先级、方向、作用层三者共同决定结果，任何单一维度都不足以判定。关联考点：官方技能点 4.2.2「评估 NSG 中的有效安全规则」，内容领域 4。\n\n**其他选项为什么错：**\n- B：数字越大的规则越先生效。优先级数字越小越先匹配，方向说反会导致放行误判。\n- C：入站放行即代表回程出站一定放行。NSG 有状态但入站与出站规则仍分别配置，不能一概而论。\n- E：子网 NSG 放行后网卡 NSG 会被忽略。两层规则都要评估，任一拒绝即不通。\n- F：应用程序安全组可替代所有 IP 规则且不需要虚拟网络。ASG 仍在虚拟网络内工作，且只是规则中的对象分组。\n\n**关键概念：** 判断连通性先固定方向与层级，再逐条对优先级。本题对应考纲 4.2.2。","s":"自编·4.2.2"},{"id":"D4-010","d":4,"t":"single","q":"要让管理员通过浏览器安全登录虚拟机而不暴露 RDP 与 SSH 端口到公网，应部署","o":[{"l":"A","t":"给虚拟机绑定公共 IP 并只放行管理员 IP"},{"l":"B","t":"A"},{"l":"C","t":"在 NSG 里放行全部来源的 3389 端口"},{"l":"D","t":"用对等虚拟网络跳过公网"}],"a":["B"],"e":"**正确答案：B。** Azure Bastion。\n\n**为什么对：** Bastion 在虚拟网络内提供托管的浏览器会话，虚拟机无需公共 IP 即可远程管理。关联考点：官方技能点 4.2.3「实施 Azure Bastion」，内容领域 4。\n\n**其他选项为什么错：**\n- A：给虚拟机绑定公共 IP 并只放行管理员 IP。仍把管理端口暴露到公网，攻击面没有消除。\n- C：在 NSG 里放行全部来源的 3389 端口。等于完全开放远程管理端口，风险更高。\n- D：用对等虚拟网络跳过公网。对等解决网络互通，不提供跳板与会话审计。\n\n**关键概念：** 管理通道托管化，既收窄暴露面又集中留痕。本题对应考纲 4.2.3。","s":"自编·4.2.3"},{"id":"D4-011","d":4,"t":"single","q":"要求存储账户与虚拟网络内子网之间的流量走 Azure 骨干网而非公网，应配置","o":[{"l":"A","t":"存"},{"l":"B","t":"只启用专用终结点"},{"l":"C","t":"给存储账户生成 SAS"},{"l":"D","t":"把账户设为公共读取"}],"a":["A"],"e":"**正确答案：A。** 存储服务终结点并在存储账户防火墙放行该子网。\n\n**为什么对：** 服务终结点把子网到服务的流量留在 Azure 骨干网，并需在服务端放行对应子网。关联考点：官方技能点 4.2.4「为平台服务配置服务终结点」，内容领域 4。\n\n**其他选项为什么错：**\n- B：只启用专用终结点。专用终结点是另一条路径，题干问的是服务终结点这类配置。\n- C：给存储账户生成 SAS。SAS 管授权，不改变网络路径。\n- D：把账户设为公共读取。公开级别只影响匿名访问，与流量路径无关。\n\n**关键概念：** 服务终结点按子网扩展服务身份，专用终结点则在子网内注入私有 IP。本题对应考纲 4.2.4。","s":"自编·4.2.4"},{"id":"D4-012","d":4,"t":"single","q":"要求存储账户在虚拟网络中拥有私有 IP 且可通过私有 DNS 解析，应配置","o":[{"l":"A","t":"仅启用服务终结点"},{"l":"B","t":"在 NSG 里放行 443 出站"},{"l":"C","t":"把存储账户移到另一资源组"},{"l":"D","t":"专"}],"a":["D"],"e":"**正确答案：D。** 专用终结点配合专用 DNS 区域。\n\n**为什么对：** 专用终结点把服务映射进子网私有地址空间，需私有 DNS 把名称解析到该地址。关联考点：官方技能点 4.2.5「为平台服务配置专用终结点」，内容领域 4。\n\n**其他选项为什么错：**\n- A：仅启用服务终结点。服务终结点不给服务分配子网内私有 IP。\n- B：在 NSG 里放行 443 出站。放行流量不产生私有端点与名称解析。\n- C：把存储账户移到另一资源组。资源组归属不改变网络访问形态。\n\n**关键概念：** 名称解析配不对，端点建好了客户端仍会走公网地址。本题对应考纲 4.2.5。","s":"自编·4.2.5"},{"id":"CASE-D4-01","d":4,"t":"single","q":"【案例背景】Adventure Works 把 Web 层与数据层放在同一虚拟网络内，要求两层分别施加安全规则；子网到存储账户的流量必须走 Azure 骨干网；对外 HTTP 入口要分发到多台后端并自动剔除故障节点。\n\nWeb 层与数据层要施加不同的安全规则，应创建","o":[{"l":"A","t":"为每层各建一个虚拟网络"},{"l":"B","t":"只建一个子网用标签区分"},{"l":"C","t":"两"},{"l":"D","t":"用两个资源组分层"}],"a":["C"],"e":"**正确答案：C。** 两个子网并分别关联网络安全组。\n\n**为什么对：** 子网是虚拟网络内的地址分段单位，NSG 可按子网关联实现分层管控。关联考点：官方技能点 4.1.1「创建并配置虚拟网络与子网」，内容领域 4。\n\n**其他选项为什么错：**\n- A：为每层各建一个虚拟网络。跨网络还需对等与路由设计，成本高于分段。\n- B：只建一个子网用标签区分。标签是元数据，不形成规则边界。\n- D：用两个资源组分层。资源组是管理边界，不提供网络分段能力。\n\n**关键概念：** 先分段再定规则，段边界决定规则能落在哪一层。本题对应考纲 4.1.1。","s":"案例组#Adventure Works 网络分段·4.1.1"},{"id":"CASE-D4-02","d":4,"t":"single","q":"【案例背景】Adventure Works 把 Web 层与数据层放在同一虚拟网络内，要求两层分别施加安全规则；子网到存储账户的流量必须走 Azure 骨干网；对外 HTTP 入口要分发到多台后端并自动剔除故障节点。\n\n某端口在子网 NSG 放行但网卡 NSG 存在拒绝，最终结果是","o":[{"l":"A","t":"放行，因为子网规则先生效"},{"l":"B","t":"拒"},{"l":"C","t":"取决于规则创建时间"},{"l":"D","t":"取决于优先级数字最大的那条"}],"a":["B"],"e":"**正确答案：B。** 拒绝，因为两个作用层都要放行才通。\n\n**为什么对：** 有效安全规则视图会合并展示两层结果，是排查这类冲突的权威依据。关联考点：官方技能点 4.2.2「评估 NSG 中的有效安全规则」，内容领域 4。\n\n**其他选项为什么错：**\n- A：放行，因为子网规则先生效。两层独立求值，任一拒绝即不通。\n- C：取决于规则创建时间。规则按优先级与方向求值，不按创建时间。\n- D：取决于优先级数字最大的那条。数字越小优先级越高，说法相反。\n\n**关键概念：** 判断连通性先固定方向与层级，再逐条对优先级。本题对应考纲 4.2.2。","s":"案例组#Adventure Works 网络分段·4.2.2"},{"id":"CASE-D4-03","d":4,"t":"single","q":"【案例背景】Adventure Works 把 Web 层与数据层放在同一虚拟网络内，要求两层分别施加安全规则；子网到存储账户的流量必须走 Azure 骨干网；对外 HTTP 入口要分发到多台后端并自动剔除故障节点。\n\n要求子网到存储账户的流量走 Azure 骨干网，应配置","o":[{"l":"A","t":"服"},{"l":"B","t":"只启用专用终结点"},{"l":"C","t":"给存储账户签发 SAS"},{"l":"D","t":"把账户公共访问级别改为私有"}],"a":["A"],"e":"**正确答案：A。** 服务终结点并在存储防火墙放行该子网。\n\n**为什么对：** 服务终结点把子网到服务流量留在骨干网，还需服务端放行对应子网。关联考点：官方技能点 4.2.4「为平台服务配置服务终结点」，内容领域 4。\n\n**其他选项为什么错：**\n- B：只启用专用终结点。那是另一条路径，题干问的是服务终结点这类配置。\n- C：给存储账户签发 SAS。SAS 管授权，不改变网络路径。\n- D：把账户公共访问级别改为私有。公开级别影响匿名读取，不决定流量路径。\n\n**关键概念：** 服务端与子网两侧都配，边界才真正生效。本题对应考纲 4.2.4。","s":"案例组#Adventure Works 网络分段·4.2.4"},{"id":"CASE-D4-04","d":4,"t":"single","q":"【案例背景】Adventure Works 把 Web 层与数据层放在同一虚拟网络内，要求两层分别施加安全规则；子网到存储账户的流量必须走 Azure 骨干网；对外 HTTP 入口要分发到多台后端并自动剔除故障节点。\n\n要把入站 HTTP 分发到多台后端并剔除故障节点，应使用","o":[{"l":"A","t":"给每台虚拟机各绑公共 IP"},{"l":"B","t":"配用户定义路由指向第一台"},{"l":"C","t":"用 DNS 轮询返回多个 A 记录"},{"l":"D","t":"负"}],"a":["D"],"e":"**正确答案：D。** 负载均衡器或应用程序网关并配置健康探测。\n\n**为什么对：** 分发与健康探测要同时具备，只做轮询不算负载均衡。关联考点：官方技能点 4.3.2「配置内部或公共负载均衡器」，内容领域 4。\n\n**其他选项为什么错：**\n- A：给每台虚拟机各绑公共 IP。客户端直连单台，没有分发与故障剔除。\n- B：配用户定义路由指向第一台。路由不改变分发行为，还形成单点。\n- C：用 DNS 轮询返回多个 A 记录。DNS 轮询不做健康检查，故障节点仍被返回。\n\n**关键概念：** 健康探测决定后端是否被选中，是分发可用性的关键。本题对应考纲 4.3.2。","s":"案例组#Adventure Works 网络分段·4.3.2"}],"sections":[{"h":"配置和管理虚拟网络","body":"### 这一域考什么\n\n这一域考的是「谁能连到谁」。十三个技能点分三块。第一块把虚拟网络、子网、对等与路由搭起来。第二块用安全组、堡垒机、服务终结点和专用终结点收紧访问。第三块把域名解析与负载均衡配到能对外服务。多数题目给的是连不通，要你判断断在哪一层。\n\n### 读完这个域要能做什么\n\n读完要能画出一条访问路径，并逐层说出它会经过什么：地址与子网、路由、安全规则、名称解析、负载均衡。给一个连不上的现象，能按这个顺序定位，而不是一上来就改安全组。\n\n### 和其他认证怎么接\n\n| 对照课程 | 怎么接 |\n|---|---|\n| AWS SCS-C03 | 安全课把网络分段与最小权限讲得更深；本域负责把规则落到子网、安全组与终结点上。 |\n| AWS SOA-C03 | 架构课讨论跨区域互联与混合连接的取舍；这里先把对等、专有连接与名称解析配通。 |\n| AWS DOP-C02 | 运维课里的连通性排障方法论与本域通用，按层排查而不是逐个开关试错。 |\n| Azure AZ-305 | 同厂牌设计课从方案层决定要不要跨区域、要不要专有连接；本域负责实现与验证。 |\n\n### 官方口径的三条边界\n\n三条边界先说清。第一，官方现行技能清单标注为 2023 年 10 月 26 日版本，认证页更新日期只是页面元数据。第二，官方不公布题型，也不公布出题频率，域尾两列照实留白。第三，本域有能力的官方页面已标出退役时间，例如基础版负载均衡器与 NSG 流日志，遇到时按当期官方口径判断。\n\n#### 这一节学什么\n这一节对应考纲任务 4.1「配置和管理虚拟网络」。\n\n> 官方原名：Configure and manage virtual networks in Azure\n\n五个技能点从建网到排障。官方把虚拟网络作为资源之间互通的地基，子网、地址、对等与路由都挂在它上面。这一组最容易错的是把「地址不通」和「规则拦了」混成一处。\n\n#### 创建并配置虚拟网络与子网\n\n> 官方原名：Create and configure virtual networks and subnets\n\n**这条在问什么。** 题目给几套系统要互通，问地址段怎么划。它考的是规划，不是把默认值一路点下去。\n\n**定义**：虚拟网络是一段私有地址空间，子网是其中的划分。资源放进子网后，才获得私有地址与互通能力。\n\n**怎么运作**。先定地址空间，再按用途切子网，接着看哪些服务要占子网、哪些要保留给专用终结点或网关。地址空间一旦和本地网络或对等网络重叠，后面就很难互联，所以规划要早于建资源。\n\n**动手看一眼**（命令逐字取自官方《创建虚拟网络》文档）：\n\n```bash\nNew-AzVirtualNetwork -ResourceGroupName myResourceGroup -Name myVNet -Location eastus -AddressPrefix 10.0.0.0/16\naz network vnet create --resource-group myResourceGroup --name myVNet\n```\n\n**什么时候用，什么时候别用**。一开始就按业务域与未来互联需求划子网，后面加服务最省事。只为跑一台临时测试机而随手用默认地址段，等要打通本地网络时会撞上重叠网段。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把应用、数据与网关各划一个子网。半年后要接专线，发现地址段和本地网络不重叠，网关子网直接可用。\n\n**关联服务**：Azure 虚拟网络、子网、地址空间、Azure CLI。\n\n#### 创建并配置虚拟网络对等\n\n> 官方原名：Create and configure virtual network peering\n\n**这条在问什么。** 题目给两个不同订阅里的虚拟网络，问怎么让它们互访且不必走公网。答案是对等，不是各开一条公网口。\n\n**定义**：虚拟网络对等把两个虚拟网络连接起来，让双方资源通过私有地址互相访问，流量走平台骨干网。\n\n**怎么运作**。两端都要建立对等关系，状态才会变成已连接。地址空间不能重叠，否则对等建不起来。还要留意对等默认不传递来自第三方的路由，想通过其中一个网络转发到别处，需要额外的网关或路由设置。\n\n**什么时候用，什么时候别用**。同区域或跨区域的几套系统要低延迟互访，用对等最直接。需要集中出公网、或所有分支都要经过一个防火墙时，改用中心辐射结构并配路由，别靠一对一对等拼出全网。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把生产与分析两个虚拟网络做对等。分析侧直接读生产库的私有地址，两端都没有新增公网地址。\n\n**关联服务**：Azure 虚拟网络对等、地址空间、网关转发。\n\n#### 配置公共 IP 地址\n\n> 官方原名：Configure public IP addresses\n\n**这条在问什么。** 题目问「为什么重启后地址变了」，或「怎么让对外入口保持不变」。考点在静态与动态的差别。\n\n**定义**：公共 IP 是可以绑定到虚拟机、负载均衡器或网关的独立资源。分配方式分静态与动态，另有不同层级决定可用区与防护能力。\n\n**怎么运作**。建好地址资源再绑定到具体资源上。静态分配让地址在资源生命周期内保持不变，动态分配可能随重启变化。官方页面还标注，基础版负载均衡器已于 2025 年 9 月 30 日退役，选层级时要按当期口径。\n\n**动手看一眼**（命令逐字取自官方《创建资源组与公共 IP》文档）：\n\n```bash\nNew-AzResourceGroup @rg\nNew-AzPublicIpAddress @ip\n```\n\n**什么时候用，什么时候别用**。对外服务入口用静态地址，配合域名解析最稳。临时测试机用动态地址可以省一点管理，但别把这种地址写进任何长期配置。\n\n💡 **场景举例**（虚构教学示意）：Contoso 给对外接口绑定静态公共 IP，再把域名指过去。一次维护重启后入口地址没变，合作方白名单无需改动。\n\n**关联服务**：Azure 公共 IP 地址、负载均衡器、Az PowerShell。\n\n#### 配置用户定义的网络路由\n\n> 官方原名：Configure user-defined network routes\n\n**这条在问什么。** 题目给「所有出公网流量都要经过防火墙」，问怎么改。它考的是下一跳，不是加一条安全规则。\n\n**定义**：用户定义路由用路由表覆盖平台的默认转发行为，把指定目标网段的下一跳指向虚拟设备、网关或互联网。\n\n**怎么运作**。先建路由表并写路由条目，再把路由表关联到子网。条目里目标网段与下一跳类型要一起对，写宽了会把本该走内网的流量也拽去防火墙。平台已有系统路由，自定义项按最长前缀匹配优先。\n\n**动手看一眼**（命令逐字取自官方《配置路由表条目》文档）：\n\n```bash\nNew-AzRouteConfig @param\naz network route-table route create \\\n```\n\n**什么时候用，什么时候别用**。要强制流量经过安全设备、或给特定网段开专用通道，用自定义路由。普通三层互通靠系统路由就够，多写一条反而制造难查的绕行。\n\n💡 **场景举例**（虚构教学示意）：Contoso 要求所有外发流量经过防火墙。管理员把默认路由的下一跳改到防火墙私有地址，并只关联到应用子网，数据子网不受影响。\n\n**关联服务**：Azure 路由表、用户定义路由、网络虚拟设备。\n\n#### 排查网络连接问题\n\n> 官方原名：Troubleshoot network connectivity\n\n**这条在问什么。** 题目给「能连 IP 但连不上域名」或「同子网也连不通」，问下一步查什么。它考的是分层定位。\n\n**定义**：连通性排障是按层缩小范围的过程：先看地址与子网，再看路由，再看安全规则，最后看名称解析与监听端口。\n\n**怎么运作**。平台提供连接监视与流日志一类的观测手段，用来确认包到底走到哪一层被丢。官方页面标注，NSG 流日志将于 2027 年 9 月 30 日退役，选工具时要按当期官方口径。判断顺序错了，很容易把 DNS 问题误判成安全组拦截。\n\n**动手看一眼**（命令逐字取自官方《启用 NSG 流日志》文档）：\n\n```bash\naz provider register --namespace 'Microsoft.Insights'\nSet-AzNetworkWatcherFlowLog -Enabled $true -Name 'myFlowLog' -Location 'eastus' -TargetResourceId $nsg.Id -StorageId $sa.Id -EnableTrafficAnalytics -TrafficAnalyticsWorkspaceId $workspace.ResourceId -FormatVersion 2\n```\n\n**什么时候用，什么时候别用**。偶发、跨子网、牵涉多个团队的问题，先取观测证据再改配置。明确是刚改过一条规则导致的，直接回退更快，不必先铺一整套监控。\n\n💡 **场景举例**（虚构教学示意）：Contoso 一台应用连不上数据库。管理员先看地址与路由，再查有效安全规则，最后才确认是监听端口没开，全程没有乱改规则。\n\n**关联服务**：Azure Network Watcher、NSG 流日志、有效安全规则、连接监视。\n\n#### 常见误区与易错点\n\n| 误区 | 为什么错 / 怎么改 |\n|---|---|\n| 地址空间随手用默认值 | 与本地网络或对等网络重叠时无法互联，返工要重建子网。 |\n| 以为对等会传递第三方路由 | 默认不传递，跨网络转发要另配网关或路由。 |\n| 把路由问题当安全组问题 | 包在路由层就被改了下一跳，安全规则根本没参与判定。 |\n| 排障先改规则再取证 | 改完现象变了，反而失去判断依据。 |\n\n#### 记忆要点\n\n1. 先规划地址空间，再划子网，最后放资源。\n2. 对等两端都要建，地址空间不能重叠，默认不传递路由。\n3. 静态公共 IP 用于长期入口，动态地址别写进配置。\n4. 连不通按地址、路由、规则、解析四层顺序查。\n\n---"},{"h":"配置虚拟网络的安全访问","body":"#### 这一节学什么\n这一节对应考纲任务 4.2「配置虚拟网络的安全访问」。\n\n> 官方原名：Configure secure access to virtual networks\n\n五个技能点都是收紧入口。安全组管到子网与网卡，堡垒机管管理连接，服务终结点与专用终结点管平台服务怎么被访问。分界要清楚：一个改流量允许与否，一个改流量走公网还是私网。\n\n#### 创建并配置网络安全组与应用程序安全组\n\n> 官方原名：Create and configure network security groups (NSGs) and application security groups\n\n**这条在问什么。** 题目给一组端口与来源，问规则怎么写才不放太宽。它考的是规则结构与作用位置。\n\n**定义**：网络安全组是一组允许或拒绝的规则，可关联到子网或网卡。应用程序安全组把一批网卡打成逻辑组，让规则写角色名而不是一串地址。\n\n**怎么运作**。规则带优先级、方向、协议、端口与来源目标。平台按优先级从低到高匹配，命中即停。子网级与网卡级同时存在时，两层规则都要放行才算通。\n\n**什么时候用，什么时候别用**。应用分层清楚、机器数量会变，用应用程序安全组写规则最省维护，扩容时不必回头改地址。只有两三台固定机器且长期不变，直接写地址更直观。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把前端、应用、数据各打一个应用程序安全组标签。新加一台应用服务器只要挂上标签，规则自动生效，不用改一条安全组。\n\n**关联服务**：Azure 网络安全组、应用程序安全组、子网与网卡。\n\n#### 评估 NSG 中的有效安全规则\n\n> 官方原名：Evaluate effective security rules in NSGs\n\n**这条在问什么。** 题目问「明明放行了端口，为什么还是连不上」。答案常是另一层或另一个方向有拒绝。\n\n**定义**：有效安全规则是把子网级与网卡级的规则合并后，平台实际用于判定的结果视图。\n\n**怎么运作**。先看方向：入站与出站各自独立评估。再把两层规则叠起来，任一层的拒绝都会阻断。平台提供查看有效规则的入口，不用靠逐条心算优先级。\n\n**什么时候用，什么时候别用**。多团队各自维护规则、或接手一套老环境，先看有效规则再动手。只有单层规则且变更刚发生，直接看变更记录更快。\n\n💡 **场景举例**（虚构教学示意）：Contoso 应用在子网层放行了端口，却始终连不上。管理员打开有效规则视图，发现网卡层还有一条更早的拒绝，改完即通。\n\n**关联服务**：Azure 网络安全组、有效安全规则、Network Watcher。\n\n#### 实施 Azure Bastion\n\n> 官方原名：Implement Azure Bastion\n\n**这条在问什么。** 题目给「要远程管理虚机，但不给虚机公网地址」。答案是托管堡垒服务，不是每台机器开管理端口。\n\n**定义**：官方把 Bastion 定义为完全托管的平台服务，从门户经加密连接提供远程桌面与安全外壳连接。它部署在虚拟网络内，用私有地址覆盖网内虚拟机。\n\n**怎么运作**。在虚拟网络里部署 Bastion 子网与主机，之后从门户发起连接，会话在平台侧建立。虚拟机不需要公共 IP、代理或专用客户端软件，管理端口也就不必对公网开放。\n\n**什么时候用，什么时候别用**。运维要管理一批无公网地址的虚机，用它能明显缩小暴露面。只是临时给一台开发机连一次，且已有安全的专线路径，另建堡垒服务的成本未必划算。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把生产虚机的公共 IP 全部摘掉，运维改从门户经 Bastion 连接。外部扫描再也看不到远程管理端口。\n\n**关联服务**：Azure Bastion、虚拟网络、远程桌面与安全外壳。\n\n#### 为平台服务配置服务终结点\n\n> 官方原名：Configure service endpoints for Azure platform as a service (PaaS)\n\n**这条在问什么。** 题目问「存储账户只允许某个虚拟网络访问，怎么配」。服务终结点是常见答案，但要说清它和专用终结点的区别。\n\n**定义**：服务终结点把虚拟网络的身份延伸到受支持的平台服务，让服务侧规则可以只放行来自这些子网的请求。\n\n**怎么运作**。在子网开启对应服务的终结点，再到服务侧把该子网加进允许清单。开启后访问仍使用服务的公共地址，只是服务侧多了一层来源限制，并没有给资源分配虚拟网络里的私有地址。\n\n**什么时候用，什么时候别用**。要快速给存储或数据库加一层来源限制，且接受仍走服务公共端点，用服务终结点够轻。合规要求彻底不走公网、或要能从本地网络按私有地址访问，得用专用终结点。\n\n💡 **场景举例**（虚构教学示意）：Contoso 给数据子网开了存储服务终结点，并在存储账户侧只放行该子网。其他子网即使有密钥，也连不到这个账户。\n\n**关联服务**：Azure 虚拟网络服务终结点、子网、存储账户与平台服务防火墙。\n\n#### 为平台服务配置专用终结点\n\n> 官方原名：Configure private endpoints for Azure PaaS\n\n**这条在问什么。** 题目给「数据不能出公网」或「本地网络要用私有地址访问平台服务」。答案落在专用终结点与名称解析上。\n\n**定义**：官方定义是，专用终结点是使用虚拟网络中私有地址的网络接口，把服务带进你的虚拟网络。服务因此获得一个网内地址。\n\n**怎么运作**。先在子网建专用终结点并关联到目标服务，再处理专用 DNS 区域的解析，让服务域名解析到这个私有地址。少了 DNS 这一步，客户端仍会解析到公共地址，配置看起来建好了却没生效。\n\n**动手看一眼**（命令逐字取自官方《创建专用终结点前置资源》文档）：\n\n```bash\naz group create \\\naz network vnet create \\\n```\n\n**什么时候用，什么时候别用**。合规明确禁止公网传输、或混合网络要按私有地址访问，用专用终结点。只是想加一层来源限制，服务终结点更简单，不必额外处理名称解析。\n\n💡 **场景举例**（虚构教学示意）：Contoso 给合同库账户建了专用终结点，并配好专用 DNS 区域。应用代码里的域名没改，解析却已落到虚拟网络内的私有地址。\n\n**关联服务**：Azure 专用终结点、专用 DNS 区域、虚拟网络。\n\n#### 常见误区与易错点\n\n| 误区 | 为什么错 / 怎么改 |\n|---|---|\n| 安全组规则写死一堆地址 | 扩容就要回头改规则，用应用程序安全组按角色写更稳。 |\n| 只看子网层规则 | 网卡层与方向的拒绝同样生效，要看有效规则视图。 |\n| 把服务终结点当私网方案 | 它仍走服务公共端点，只是加了来源限制。 |\n| 建了专用终结点却没配专用 DNS | 域名仍解析到公共地址，配置等于没生效。 |\n\n#### 记忆要点\n\n1. 安全组按优先级命中即停，子网与网卡两层都要放行。\n2. Bastion 让管理连接不经公网，虚机不必挂公共 IP。\n3. 服务终结点限来源，专用终结点给私有地址，后者要配专用 DNS。\n4. 连不通先看有效规则，再决定改哪一层。\n\n#### 案例\n\n**💡 综合案例：Contoso 的商城对外开放交接**\n\n> 这一节先讲清共同背景。后面的几道题都从这里出发，每道只考一个技能点。做完可以展开解析，看它对应官方考纲哪一条。\n\n虚构教学场景：Contoso 的商城前端要对外服务，应用与数据库都不允许有公网地址。合作方要求从一个固定地址访问接口，运维要能远程管理虚机但不能暴露管理端口。安全组还提出，存储账户只能被数据子网访问，且合同库数据不允许经公网传输。\n\n这份背景把本域十三个技能点串成一条线。前端入口靠静态公共 IP 与负载均衡，子网划分与路由决定流量路径；安全组与应用程序安全组收紧端口，Bastion 接管管理连接；存储侧先用服务终结点限来源，合同库再上专用终结点并配好专用 DNS。对外域名解析单独验证，出现连不通时按地址、路由、规则、解析四层定位。\n\n案例题只在课程里出现，不进刷题工具，也不计入模拟考。真实考场的案例卡有左栏资料菜单，界面手感请到官方 Exam Sandbox 体验。\n\n---"},{"h":"配置名称解析与负载均衡","body":"#### 这一节学什么\n这一节对应考纲任务 4.3「配置名称解析与负载均衡」。\n\n> 官方原名：Configure name resolution and load balancing\n\n最后三个技能点决定用户怎么找到服务、流量怎么分到多台机器上。官方说 Azure DNS 提供域名承载、解析与负载均衡能力，也支持公网域与专用区域；应用网关则按请求属性做路由，和普通负载均衡器不是一层。\n\n#### 配置 Azure DNS\n\n> 官方原名：Configure Azure DNS\n\n**这条在问什么。** 题目给「域名要指到新建的服务」，或「虚拟网络内部要能解析私有名称」。两种情况用的不是同一套区域。\n\n**定义**：官方说明 Azure DNS 用平台基础设施提供 DNS 承载、解析与负载均衡，同时支持面向互联网的域名和专用 DNS 区域。\n\n**怎么运作**。公网域要先建区域，再把注册商处的名称服务器改到平台给的值，然后加记录。专用区域则关联到虚拟网络，让网内资源解析到私有地址。改记录前先确认权威名称服务器在哪，否则写在本地也不会生效。\n\n**动手看一眼**（命令逐字取自官方《创建 DNS 区域与记录》文档）：\n\n```bash\naz network dns zone create -g MyResourceGroup -n contoso.xyz\naz network dns record-set a add-record -g MyResourceGroup -z contoso.xyz -n www -a 10.10.10.10\n```\n\n**什么时候用，什么时候别用**。对外服务用公网区域，配静态地址更稳。虚拟网络内部名称、尤其配合专用终结点时，必须用专用区域，否则解析会绕回公网地址。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把商城域名迁到 Azure DNS 公网区域，同时给合同库配专用区域。公网用户解析到入口地址，内网应用解析到私有地址，两边互不干扰。\n\n**关联服务**：Azure DNS、专用 DNS 区域、域名注册商、Azure CLI。\n\n#### 配置内部或公共负载均衡器\n\n> 官方原名：Configure an internal or public load balancer\n\n**这条在问什么。** 题目问「两台应用怎么共同对外服务」，或「内部服务怎么分摊请求」。考点在负载均衡器的类型与健康探测。\n\n**定义**：负载均衡器把入站连接按规则分发到后端池。公共型有公共前端地址，内部型只有虚拟网络里的私有前端地址。\n\n**怎么运作**。先建前端地址与后端池，再配健康探测和负载均衡规则。探测失败的实例会被摘出后端池，所以探测路径写错，看起来就像所有实例都挂了。官方页面标注基础版已于 2025 年 9 月 30 日退役，选型按当期口径。\n\n**动手看一眼**（命令逐字取自官方《创建公共负载均衡器前置资源》文档）：\n\n```bash\naz group create \\\naz network public-ip create \\\n```\n\n**什么时候用，什么时候别用**。多台无状态实例分摊流量，用负载均衡器最直接。要按 URL 路径、主机名或请求头做分发，那属于应用层网关的能力，别硬套四层规则。\n\n💡 **场景举例**（虚构教学示意）：Contoso 给三台应用服务器配公共负载均衡器。健康探测指向一个轻量检查接口，其中一台应用假死后被自动摘除，用户无感知。\n\n**关联服务**：Azure 负载均衡器、后端池、健康探测、公共 IP。\n\n#### 排查负载均衡问题\n\n> 官方原名：Troubleshoot load balancing\n\n**这条在问什么。** 题目给「部分请求成功部分失败」或「全部超时」，问从哪里查起。它考的是排查顺序。\n\n**定义**：负载均衡相关的故障通常落在四处：后端实例是否健康、探测是否通过、规则端口是否对应、名称解析是否指对前端地址。\n\n**怎么运作**。先看后端池里各实例的健康状态，再核对探测端口与协议，接着检查负载均衡规则与网络安全组是否放行，最后确认域名解析。应用网关一类的七层入口还要额外看后端设置与证书。\n\n**动手看一眼**（命令逐字取自官方《创建七层入口前置资源》文档）：\n\n```bash\naz group create --name myResourceGroupAG --location eastus\naz network public-ip create \\\n```\n\n**什么时候用，什么时候别用**。间歇性失败先怀疑健康探测和实例状态，因为实例会被动态摘除。全量失败更可能是规则、端口或解析这类一次性配置错误。\n\n💡 **场景举例**（虚构教学示意）：Contoso 商城偶发五百错误。管理员先看后端池，发现一台实例探测失败被摘除，剩下两台压力过高；修好那台后错误率立刻回落。\n\n**关联服务**：Azure 负载均衡器、应用程序网关、健康探测、Azure Monitor。\n\n#### 常见误区与易错点\n\n| 误区 | 为什么错 / 怎么改 |\n|---|---|\n| 改了记录却没改名称服务器 | 权威仍在原注册商，本地怎么改都不生效。 |\n| 健康探测指向业务重接口 | 接口一慢就被判定不健康，实例被误摘出后端池。 |\n| 把路径路由需求交给四层负载均衡器 | 按 URL 或主机名分发属于七层入口能力。 |\n| 间歇失败先怀疑网络断了 | 更常见是部分实例探测失败被摘除。 |\n\n#### 记忆要点\n\n1. 公网区域对外，专用区域对内，改记录前先确认权威来源。\n2. 健康探测决定后端池成员，探测写错常被误判成全站故障。\n3. 四层按连接分发，七层按请求属性分发。\n4. 间歇失败看实例健康，全量失败看规则与解析。\n\n---"}],"tips":{"points":"| 考点 | 内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 创建并配置虚拟网络与子网（4.1.1） | 地址空间先规划，子网划分决定后面能放什么 | 官方未公布 | 官方未公布 |\n| 创建并配置虚拟网络对等（4.1.2） | 对等让两个虚拟网络用私有地址互通，不传递默认路由 | 官方未公布 | 官方未公布 |\n| 配置公共 IP 地址（4.1.3） | 公网地址是独立资源，SKU 与分配方式影响可用性与计费 | 官方未公布 | 官方未公布 |\n| 配置用户定义的网络路由（4.1.4） | 自定义路由覆盖系统默认下一跳，先画清流量去向 | 官方未公布 | 官方未公布 |\n| 排查网络连接问题（4.1.5） | 按地址、路由、安全规则、名称解析逐层定位，别只盯一处 | 官方未公布 | 官方未公布 |\n| 创建并配置网络安全组与应用程序安全组（4.2.1） | 按优先级评估规则，应用程序安全组把应用角色当标签用 | 官方未公布 | 官方未公布 |\n| 评估 NSG 中的有效安全规则（4.2.2） | 入站出站分别算，子网与网卡两层取交集 | 官方未公布 | 官方未公布 |\n| 实施 Azure Bastion（4.2.3） | 托管跳板从门户经 TLS 连管理端口，虚机不必挂公网 IP | 官方未公布 | 官方未公布 |\n| 为平台服务配置服务终结点（4.2.4） | 把平台服务的访问限定到指定虚拟网络，流量仍走服务公网地址 | 官方未公布 | 官方未公布 |\n| 为平台服务配置专用终结点（4.2.5） | 把服务映射成虚拟网络里的私有地址，访问不再走公网 | 官方未公布 | 官方未公布 |\n| 配置 Azure DNS（4.3.1） | 公网域与专用区域分工，记录改动要先确认权威来源 | 官方未公布 | 官方未公布 |\n| 配置内部或公共负载均衡器（4.3.2） | 内部分发私网流量，公共分发入站流量，健康探测决定后端是否接流量 | 官方未公布 | 官方未公布 |\n| 排查负载均衡问题（4.3.3） | 先看健康探测与后端池，再看规则与端口映射 | 官方未公布 | 官方未公布 |","services":"| 服务 | 主要用途 | 涉及任务 |\n|---|---|---|\n| Azure 虚拟网络与子网 | 地址空间与分段，其他网络能力的地基 | 4.1 |\n| 虚拟网络对等 | 两个虚拟网络之间用私有地址互通 | 4.1 |\n| 公共 IP 与路由表 | 对外入口与自定义下一跳 | 4.1 |\n| 网络安全组与应用程序安全组 | 按优先级与角色控制放行 | 4.2 |\n| Azure Bastion | 无公网地址的管理连接 | 4.2 |\n| 服务终结点与专用终结点 | 限定来源与私有地址访问平台服务 | 4.2 |\n| Azure DNS 与专用 DNS 区域 | 公网与私网名称解析 | 4.3 |\n| 负载均衡器与应用程序网关 | 四层分发与七层按请求路由 | 4.3 |\n| Network Watcher 与流日志 | 连通性观测与逐层定位 | 4.1、4.3 |","furtherReading":"| 页面 | 什么时候去看 | URL |\n|---|---|---|\n| AZ-104 Study Guide | 五域权重区间与技能点原文 | https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104 |\n| 虚拟网络概述 | 地址空间与子网的关系 | https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview |\n| 网络安全组工作原理 | 规则优先级、方向与有效规则 | https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works |\n| 用户定义路由 | 系统路由与自定义下一跳 | https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview |\n| Azure Bastion 概述 | 托管跳板与私有地址连接 | https://learn.microsoft.com/en-us/azure/bastion/bastion-overview |\n| 专用终结点概述 | 把服务带进虚拟网络 | https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview |\n| 服务终结点 | 把平台服务访问限定到子网 | https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview |\n| Azure DNS 概述 | 公网域与专用区域 | https://learn.microsoft.com/en-us/azure/dns/dns-overview |\n| 负载均衡器概述 | 类型、后端池与官方退役说明 | https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-overview |\n| 应用程序网关概述 | 基于请求属性的七层路由 | https://learn.microsoft.com/en-us/azure/application-gateway/overview |\n| NSG 流日志 | 观测能力与官方退役时间 | https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-nsg-flow-logging-cli |"}},{"domain":5,"name":"监视和维护 Azure 资源","weight":"10–15%","practice":[{"id":"D5-001","d":5,"t":"single","q":"要判断某虚拟机过去一小时的 CPU 趋势，应使用","o":[{"l":"A","t":"在活动日志里查 CPU 数值"},{"l":"B","t":"查看存储账户诊断日志"},{"l":"C","t":"A"},{"l":"D","t":"读取预算告警记录"}],"a":["C"],"e":"**正确答案：C。** Azure Monitor 指标并按时间范围查看聚合曲线。\n\n**为什么对：** 指标是近实时的数值时间序列，适合趋势与阈值判断；日志适合事件与明细追溯。关联考点：官方技能点 5.1.1「解读 Azure Monitor 中的指标」，内容领域 5。\n\n**其他选项为什么错：**\n- A：在活动日志里查 CPU 数值。活动日志记录控制面操作，不承载性能指标时间序列。\n- B：查看存储账户诊断日志。那是存储服务的日志类别，不是虚拟机 CPU 指标。\n- D：读取预算告警记录。预算反映消费金额，与计算性能无关。\n\n**关键概念：** 指标回答高不高，日志回答发生了什么。本题对应考纲 5.1.1。","s":"自编·5.1.1"},{"id":"D5-002","d":5,"t":"single","q":"要把虚拟机来宾系统日志与平台诊断数据集中留存并可查询，应配置","o":[{"l":"A","t":"只启用资源锁"},{"l":"B","t":"诊"},{"l":"C","t":"给订阅加预算"},{"l":"D","t":"把指标固定到仪表板"}],"a":["B"],"e":"**正确答案：B。** 诊断设置把日志送到 Log Analytics 工作区或存储账户。\n\n**为什么对：** 诊断设置决定哪些类别的数据流向哪个目标，工作区提供查询与告警联动。关联考点：官方技能点 5.1.2「在 Azure Monitor 中配置日志设置」，内容领域 5。\n\n**其他选项为什么错：**\n- A：只启用资源锁。资源锁防误删，不采集任何日志。\n- C：给订阅加预算。预算与日志采集链路无关。\n- D：把指标固定到仪表板。仪表板只是展示，不产生长期留存与查询能力。\n\n**关键概念：** 采集、留存、查询是三段，配了展示不等于配了采集。本题对应考纲 5.1.2。","s":"自编·5.1.2"},{"id":"D5-003","d":5,"t":"single","q":"要在集中日志里查出某资源近 24 小时的错误记录，应使用","o":[{"l":"A","t":"K"},{"l":"B","t":"下载活动日志 CSV 后按文件大小排序"},{"l":"C","t":"查看指标图表的最大值"},{"l":"D","t":"翻阅资源组标签"}],"a":["A"],"e":"**正确答案：A。** Kusto 查询语言在 Log Analytics 工作区检索与筛选。\n\n**为什么对：** KQL 面向表格化日志做时间过滤、条件筛选与聚合，是日志分析的标准入口。关联考点：官方技能点 5.1.3「在 Azure Monitor 中查询与分析日志」，内容领域 5。\n\n**其他选项为什么错：**\n- B：下载活动日志 CSV 后按文件大小排序。文件大小不表达错误类型或时间范围。\n- C：查看指标图表的最大值。指标是聚合数值，不含逐条事件明细。\n- D：翻阅资源组标签。标签是静态元数据，与运行日志无关。\n\n**关键概念：** 明细检索用查询语言，趋势判断用指标图表。本题对应考纲 5.1.3。","s":"自编·5.1.3"},{"id":"D5-004","d":5,"t":"single","q":"要求磁盘空间低于阈值时通知值班组并自动创建工单，应配置","o":[{"l":"A","t":"只把指标固定到仪表板"},{"l":"B","t":"仅在活动日志里标记该事件"},{"l":"C","t":"提高预算阈值"},{"l":"D","t":"告"}],"a":["D"],"e":"**正确答案：D。** 告警规则绑定操作组并在动作里接工单或自动化。\n\n**为什么对：** 告警规则定义条件与严重度，操作组定义通知对象与动作，二者组合才形成闭环。关联考点：官方技能点 5.1.4「设置告警规则、操作组与告警处理规则」，内容领域 5。\n\n**其他选项为什么错：**\n- A：只把指标固定到仪表板。仪表板需要人主动看，不触发通知与动作。\n- B：仅在活动日志里标记该事件。活动日志不产生通知链路。\n- C：提高预算阈值。预算与磁盘空间告警属于不同信号源。\n\n**关键概念：** 规则管什么时候响，操作组管响了以后找谁做什么。本题对应考纲 5.1.4。","s":"自编·5.1.4"},{"id":"D5-005","d":5,"t":"multiple","q":"关于告警规则与操作组，下列说法哪些正确","o":[{"l":"A","t":"操作组负责定义触发条件与阈值"},{"l":"B","t":"告警触发后必须由管理员手工执行全部动作"},{"l":"C","t":"一"},{"l":"D","t":"操作组只能包含邮件收件人"},{"l":"E","t":"告警处理规则可以替代操作组完成通知"},{"l":"F","t":"操"}],"a":["C","F"],"e":"**正确答案：C、F。** 一条告警规则可关联多个操作组；操作组可同时包含邮件通知与 Webhook 动作。\n\n**为什么对：** 规则、操作组、处理规则三层分别管判定、通知与抑制，职责不重叠。关联考点：官方技能点 5.1.4「设置告警规则、操作组与告警处理规则」，内容领域 5。\n\n**其他选项为什么错：**\n- A：操作组负责定义触发条件与阈值。条件与阈值属于告警规则，操作组只定义通知与动作。\n- B：告警触发后必须由管理员手工执行全部动作。可配置自动化、Webhook 与工单集成自动执行。\n- D：操作组只能包含邮件收件人。还支持短信、推送、Webhook、逻辑应用与自动化等多种动作。\n- E：告警处理规则可以替代操作组完成通知。处理规则用于抑制或修改告警，不负责通知对象。\n\n**关键概念：** 分层清楚后，告警失灵时能快速定位是哪一层没配。本题对应考纲 5.1.4。","s":"自编·5.1.4"},{"id":"D5-006","d":5,"t":"single","q":"要洞察应用各依赖组件之间的调用与失败率，应启用","o":[{"l":"A","t":"只查看订阅的活动日志"},{"l":"B","t":"A"},{"l":"C","t":"提高诊断设置的保留天数"},{"l":"D","t":"给资源加更多标记"}],"a":["B"],"e":"**正确答案：B。** Application Insights 或 Azure Monitor 洞察类能力。\n\n**为什么对：** 洞察类能力基于遥测构建应用地图与依赖关系，能定位到具体失败组件。关联考点：官方技能点 5.1.5「用 Azure Monitor 洞察配置并解读监视」，内容领域 5。\n\n**其他选项为什么错：**\n- A：只查看订阅的活动日志。活动日志不含应用内部依赖调用链路。\n- C：提高诊断设置的保留天数。保留天数只决定存多久，不产生依赖拓扑。\n- D：给资源加更多标记。标记是元数据，不生成调用关系。\n\n**关键概念：** 看依赖要看遥测链路，不能靠资源清单元数据推断。本题对应考纲 5.1.5。","s":"自编·5.1.5"},{"id":"D5-007","d":5,"t":"single","q":"要持续验证两台虚拟机之间网络连通性并观察延迟变化，应使用","o":[{"l":"A","t":"N"},{"l":"B","t":"只做一次即时连通性检测"},{"l":"C","t":"查看 NSG 有效规则"},{"l":"D","t":"给虚拟机换更大规格"}],"a":["A"],"e":"**正确答案：A。** Network Watcher 的连接监视。\n\n**为什么对：** 连接监视按周期探测并输出可达性与延迟趋势，适合持续观测。关联考点：官方技能点 5.1.6「使用 Azure Network Watcher 与连接监视」，内容领域 5。\n\n**其他选项为什么错：**\n- B：只做一次即时连通性检测。单次结果无法反映随时间变化的延迟与抖动。\n- C：查看 NSG 有效规则。规则说明是否允许，不提供实测时延。\n- D：给虚拟机换更大规格。规格影响计算能力，不测量网络路径。\n\n**关键概念：** 一次性检查与持续监视是两种能力，排障与观测别混用。本题对应考纲 5.1.6。","s":"自编·5.1.6"},{"id":"D5-008","d":5,"t":"single","q":"要为虚拟机配置备份并集中管理恢复点，第一步是","o":[{"l":"A","t":"直接删除旧快照腾空间"},{"l":"B","t":"先把虚拟机移到另一订阅"},{"l":"C","t":"给存储账户启用版本控制"},{"l":"D","t":"创"}],"a":["D"],"e":"**正确答案：D。** 创建恢复服务保管库并配置备份策略。\n\n**为什么对：** 恢复服务保管库承载备份项与恢复点，策略定义频率与保留期。关联考点：官方技能点 5.2.1「创建恢复服务保管库」，内容领域 5。\n\n**其他选项为什么错：**\n- A：直接删除旧快照腾空间。删快照既不是备份起点，也会损失可恢复点。\n- B：先把虚拟机移到另一订阅。跨订阅移动不是建立备份的前置条件。\n- C：给存储账户启用版本控制。版本控制作用于 Blob 数据，不备份虚拟机磁盘。\n\n**关键概念：** 先有保管库与策略，再把虚拟机纳入保护。本题对应考纲 5.2.1。","s":"自编·5.2.1"},{"id":"D5-009","d":5,"t":"single","q":"要备份 Azure 文件共享或新版工作负载，且希望使用专门的备份保管库形态，应采用","o":[{"l":"A","t":"恢复服务保管库对部分新工作负载不支持"},{"l":"B","t":"仅靠共享快照"},{"l":"C","t":"A"},{"l":"D","t":"把文件复制到另一存储账户"}],"a":["C"],"e":"**正确答案：C。** Azure Backup 保管库。\n\n**为什么对：** Backup 保管库面向较新的工作负载类型，两者的支持矩阵不同，选错会无法注册备份项。关联考点：官方技能点 5.2.2「创建 Azure Backup 保管库」，内容领域 5。\n\n**其他选项为什么错：**\n- A：恢复服务保管库对部分新工作负载不支持。题干指向新形态保管库，恢复服务保管库覆盖面不同。\n- B：仅靠共享快照。快照是时间点副本，缺少集中策略、长期保留与集中监控。\n- D：把文件复制到另一存储账户。手工复制没有策略与恢复点管理。\n\n**关键概念：** 保管库类型决定能保护什么，先查支持矩阵再建。本题对应考纲 5.2.2。","s":"自编·5.2.2"},{"id":"D5-010","d":5,"t":"single","q":"公司要求每日备份并保留 90 天，应在哪里定义","o":[{"l":"A","t":"在资源组的标记里写保留天数"},{"l":"B","t":"备"},{"l":"C","t":"在恢复服务保管库名称里注明"},{"l":"D","t":"在虚拟机的规格里选择"}],"a":["B"],"e":"**正确答案：B。** 备份策略里的计划频率与保留期。\n\n**为什么对：** 备份策略把备份频率与各类恢复点的保留规则集中定义，供多个备份项复用。关联考点：官方技能点 5.2.3「创建并配置备份策略」，内容领域 5。\n\n**其他选项为什么错：**\n- A：在资源组的标记里写保留天数。标记是元数据，不驱动备份行为。\n- C：在恢复服务保管库名称里注明。名称只是标识，不影响保留逻辑。\n- D：在虚拟机的规格里选择。规格决定算力，与备份保留无关。\n\n**关键概念：** 策略是备份行为的唯一定义处，改策略才改变保留。本题对应考纲 5.2.3。","s":"自编·5.2.3"},{"id":"D5-011","d":5,"t":"single","q":"虚拟机文件被误删后要恢复到指定时间点，应使用","o":[{"l":"A","t":"从"},{"l":"B","t":"从资源锁里找回文件"},{"l":"C","t":"重新部署一份 ARM 模板"},{"l":"D","t":"查看活动日志里的删除记录"}],"a":["A"],"e":"**正确答案：A。** 从备份恢复点执行文件级或磁盘级还原。\n\n**为什么对：** Azure Backup 的恢复点支持整盘还原与文件级恢复，按时间点选择即可。关联考点：官方技能点 5.2.4「用 Azure Backup 执行备份与还原操作」，内容领域 5。\n\n**其他选项为什么错：**\n- B：从资源锁里找回文件。资源锁防删除，不保存文件内容。\n- C：重新部署一份 ARM 模板。模板重建资源，不恢复来宾系统里的文件。\n- D：查看活动日志里的删除记录。日志只能说明谁删了，不含数据副本。\n\n**关键概念：** 有恢复点才有还原能力，日志不能当备份用。本题对应考纲 5.2.4。","s":"自编·5.2.4"},{"id":"D5-012","d":5,"t":"single","q":"要为虚拟机配置跨区域灾难恢复，应使用","o":[{"l":"A","t":"只把备份保留期改长"},{"l":"B","t":"给虚拟机加可用性集"},{"l":"C","t":"启用 Blob 软删除"},{"l":"D","t":"A"}],"a":["D"],"e":"**正确答案：D。** Azure Site Recovery 并指定目标区域。\n\n**为什么对：** 站点恢复负责复制、故障转移与恢复计划，是跨区域容灾的专用能力。关联考点：官方技能点 5.2.5「为 Azure 资源配置站点恢复」，内容领域 5。\n\n**其他选项为什么错：**\n- A：只把备份保留期改长。备份解决数据恢复，不提供业务连续性与故障转移编排。\n- B：给虚拟机加可用性集。可用性集只覆盖单区域内的实例分布。\n- C：启用 Blob 软删除。软删除保护对象数据，不复制整台虚拟机。\n\n**关键概念：** 备份管能不能找回，容灾管能不能继续跑。本题对应考纲 5.2.5。","s":"自编·5.2.5"},{"id":"CASE-D5-01","d":5,"t":"single","q":"【案例背景】Northwind 要求基础设施告警能自动通知值班组并建单，日志可集中检索；备份需每日执行并保留 90 天，且整台虚拟机在区域故障时能切换到次要区域继续运行。\n\n磁盘空间低于阈值要通知值班组并自动建单，应配置","o":[{"l":"A","t":"只把指标固定到仪表板"},{"l":"B","t":"在活动日志里手工标记该事件"},{"l":"C","t":"告"},{"l":"D","t":"调高预算阈值"}],"a":["C"],"e":"**正确答案：C。** 告警规则绑定操作组并在动作里接工单或自动化。\n\n**为什么对：** 告警规则定义条件，操作组定义通知与动作，二者组合才形成闭环。关联考点：官方技能点 5.1.4「设置告警规则、操作组与告警处理规则」，内容领域 5。\n\n**其他选项为什么错：**\n- A：只把指标固定到仪表板。仪表板需要人主动查看，不触发通知与动作。\n- B：在活动日志里手工标记该事件。活动日志不产生通知链路。\n- D：调高预算阈值。预算与磁盘空间属于不同信号源。\n\n**关键概念：** 规则管什么时候响，操作组管响了以后找谁做什么。本题对应考纲 5.1.4。","s":"案例组#Northwind 监控与灾备·5.1.4"},{"id":"CASE-D5-02","d":5,"t":"single","q":"【案例背景】Northwind 要求基础设施告警能自动通知值班组并建单，日志可集中检索；备份需每日执行并保留 90 天，且整台虚拟机在区域故障时能切换到次要区域继续运行。\n\n要在集中日志里检索近一天某资源的错误明细，应使用","o":[{"l":"A","t":"下载活动日志按文件大小排序"},{"l":"B","t":"K"},{"l":"C","t":"查看指标图表最大值"},{"l":"D","t":"翻阅资源组标签"}],"a":["B"],"e":"**正确答案：B。** Kusto 查询语言在 Log Analytics 工作区筛选。\n\n**为什么对：** KQL 面向表格化日志做时间过滤与条件筛选，是日志明细检索的标准入口。关联考点：官方技能点 5.1.3「在 Azure Monitor 中查询与分析日志」，内容领域 5。\n\n**其他选项为什么错：**\n- A：下载活动日志按文件大小排序。文件大小不表达错误类型或时间范围。\n- C：查看指标图表最大值。指标是聚合数值，不含逐条事件明细。\n- D：翻阅资源组标签。标签是静态元数据，与运行日志无关。\n\n**关键概念：** 明细检索用查询语言，趋势判断用指标图表。本题对应考纲 5.1.3。","s":"案例组#Northwind 监控与灾备·5.1.3"},{"id":"CASE-D5-03","d":5,"t":"single","q":"【案例背景】Northwind 要求基础设施告警能自动通知值班组并建单，日志可集中检索；备份需每日执行并保留 90 天，且整台虚拟机在区域故障时能切换到次要区域继续运行。\n\n要求每日备份且保留 90 天，定义位置是","o":[{"l":"A","t":"备"},{"l":"B","t":"在资源组标记里写保留天数"},{"l":"C","t":"在保管库名称中注明"},{"l":"D","t":"在虚拟机规格里选择"}],"a":["A"],"e":"**正确答案：A。** 备份策略里的计划频率与保留期。\n\n**为什么对：** 备份策略集中定义频率与各类恢复点保留规则，供多个备份项复用。关联考点：官方技能点 5.2.3「创建并配置备份策略」，内容领域 5。\n\n**其他选项为什么错：**\n- B：在资源组标记里写保留天数。标记是元数据，不驱动备份行为。\n- C：在保管库名称中注明。名称只是标识，不影响保留逻辑。\n- D：在虚拟机规格里选择。规格决定算力，与备份保留无关。\n\n**关键概念：** 策略是备份行为的唯一定义处，改策略才改变保留。本题对应考纲 5.2.3。","s":"案例组#Northwind 监控与灾备·5.2.3"},{"id":"CASE-D5-04","d":5,"t":"single","q":"【案例背景】Northwind 要求基础设施告警能自动通知值班组并建单，日志可集中检索；备份需每日执行并保留 90 天，且整台虚拟机在区域故障时能切换到次要区域继续运行。\n\n要求整台虚拟机在区域故障时能切到次要区域继续运行，应使用","o":[{"l":"A","t":"只把备份保留期改长"},{"l":"B","t":"给虚拟机加可用性集"},{"l":"C","t":"启用 Blob 软删除"},{"l":"D","t":"A"}],"a":["D"],"e":"**正确答案：D。** Azure Site Recovery 并指定目标区域。\n\n**为什么对：** 站点恢复负责复制、故障转移与恢复计划，是跨区域容灾的专用能力。关联考点：官方技能点 5.2.5「为 Azure 资源配置站点恢复」，内容领域 5。\n\n**其他选项为什么错：**\n- A：只把备份保留期改长。备份解决数据恢复，不提供故障转移编排。\n- B：给虚拟机加可用性集。可用性集只覆盖单区域内的实例分布。\n- C：启用 Blob 软删除。软删除保护对象数据，不复制整台虚拟机。\n\n**关键概念：** 备份管能不能找回，容灾管能不能继续跑。本题对应考纲 5.2.5。","s":"案例组#Northwind 监控与灾备·5.2.5"}],"sections":[{"h":"监视 Azure 资源","body":"### 这一域考什么\n\n这一域官方权重 10–15%，十三个技能点分两块。第一块把指标、日志、告警与洞察配成能发现问题的观测链路。第二块把备份、恢复与容灾配成能兜住问题的动作。前一块回答「怎么知道出事了」，后一块回答「出事后怎么回来」。\n\n### 读完这个域要能做什么\n\n读完要能对着一条告警倒推它从哪类数据来、由谁采集、发给谁；也要能说清一次备份的保护范围与恢复粒度，以及备份和异地容灾各自解决什么。常见的坑是把「备份过」等同于「能恢复」。\n\n### 和其他认证怎么接\n\n| 对照课程 | 怎么接 |\n|---|---|\n| AWS DOP-C02 | 运维课里的可观测性与告警分级方法论和本域通用，只是数据源名称不同。 |\n| AWS SCS-C03 | 安全课把活动日志与审计留痕讲得更深；本域只要求会采集、会查、会告警。 |\n| AWS SOA-C03 | 架构课讨论容灾目标与跨区域方案取舍；本域负责把故障转移流程配通并验证。 |\n| Azure AZ-305 | 同厂牌设计课从方案层决定备份与容灾的组合；本域负责落地与读懂报告。 |\n\n### 官方口径的三条边界\n\n三条边界先说清。第一，官方现行技能清单标注为 2023 年 10 月 26 日版本，认证页更新日期只是页面元数据。第二，官方不公布题型，也不公布出题频率，域尾两列照实留白。第三，个别官方页面已标出功能弃用或变更，例如经典版连接监视，遇到时按当期官方口径判断。\n\n#### 这一节学什么\n这一节对应考纲任务 5.1「监视 Azure 资源」。\n\n> 官方原名：Monitor resources in Azure\n\n六个技能点是一条数据链。平台自动产生指标与日志，代理补齐操作系统内部的数据。工作区把日志收在一起，查询把数据变成结论。告警把结论送给人，洞察与网络监视把常用视图做出来。断在哪一环，问题就看不见。\n\n#### 解读 Azure Monitor 中的指标\n\n> 官方原名：Interpret metrics in Azure Monitor\n\n**这条在问什么。** 题目给一张 CPU 曲线，问该不该扩容。它考的是读图口径，不是认得指标名。\n\n**定义**：官方把 Azure Monitor 定义为汇集指标、日志与跟踪的统一可观测性服务，用来理解应用与资源的健康、性能与可靠性。指标是平台自动采集的时序数值。\n\n**怎么运作**。读指标先确认三件事：观察的时间范围、采样粒度、用的是平均值还是峰值。同一段数据换成最大值，结论可能完全相反。官方另有页面列出当前可用的平台指标清单，不认识的指标先去查含义。\n\n**什么时候用，什么时候别用**。判断趋势、设告警阈值，指标最直观，数据量也小。要查「谁在什么时候改了配置」，指标帮不上忙，得去活动日志。\n\n💡 **场景举例**（虚构教学示意）：Contoso 看到一台虚机 CPU 平均只有三成，以为很闲。换成五分钟粒度看峰值才发现每分钟都有短时打满，于是改查伸缩规则。\n\n**关联服务**：Azure Monitor 指标、指标清单、时间粒度与聚合。\n\n#### 在 Azure Monitor 中配置日志设置\n\n> 官方原名：Configure log settings in Azure Monitor\n\n**这条在问什么。** 题目问「为什么查不到某台机器上的日志」，或「日志该存到哪」。答案常在采集侧，不在查询语句。\n\n**定义**：官方定义 Log Analytics 工作区是收集各类日志数据的数据存储，可汇聚来自 Azure 与非 Azure 资源和应用的日志。诊断设置决定哪些类别的数据被送进去。\n\n**怎么运作**。先建工作区，再按资源开诊断设置，选要收集的日志类别与目标工作区，需要操作系统内部数据时再装代理。官方建议除非有明确业务需求，否则把日志集中到一个工作区，跨工作区查询会让排障变复杂。\n\n**动手看一眼**（命令逐字取自官方《创建 Log Analytics 工作区》文档）：\n\n```bash\naz monitor log-analytics workspace create --resource-group myGroup --workspace-name myWorkspace\naz monitor log-analytics workspace show --resource-group myGroup --workspace-name myWorkspace\n```\n\n**什么时候用，什么时候别用**。要长期留存、跨资源关联查询，把日志送进工作区最合适。只是临时看一台机器今天发生了什么，直接看资源自带的活动日志更轻。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把三套应用的日志统一送
