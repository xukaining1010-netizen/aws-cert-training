<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>学习材料</title>
<style>
/* ===== 页面结构：首页目录 + 章级分页 SPA（非单一长页） ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;font-size:17px;line-height:1.7}
.wrap{max-width:1200px;margin:0 auto;padding:24px 28px 60px}
@media(max-width:768px){.wrap{padding:16px 14px 48px}}

/* ===== 首页 ===== */
.hdr{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:12px;padding:30px 32px 26px;margin-bottom:18px}
.hdr-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:3px 12px;border-radius:20px;margin-bottom:10px}
.hdr h1{font-size:24px;font-weight:800;line-height:1.4}
.hdr-sub{font-size:13px;opacity:.9;margin-top:8px}
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.ov-item{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.ov-num{font-size:28px;font-weight:800;color:#4f46e5;line-height:1.2}
.ov-lbl{font-size:12px;color:#64748b;margin-top:4px}
@media(max-width:768px){.ov{grid-template-columns:repeat(2,1fr)}}

.card-s{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.cs-title{font-size:18px;font-weight:700;color:#374151;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}

/* 章节目录卡 */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ch-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 16px;cursor:pointer;transition:.2s;margin-bottom:0}
.ch-card:hover{border-color:#7c3aed;transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,70,229,.12)}
.ch-card.done{border-color:#16a34a}
.cc-num{font-size:11px;font-weight:700;margin-bottom:3px}
.cc-title{font-size:15px;font-weight:700;color:#1e293b;margin-bottom:6px}
.cc-meta{font-size:13px;color:#64748b}
.cc-prog{margin-top:8px}
.pm{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:3px}
.pbar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .4s}

/* 考试速览 */
.exam-quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.eq-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 10px;text-align:center}
.eq-num{font-size:20px;font-weight:800;color:#4f46e5;line-height:1.2}
.eq-sub{font-size:10.5px;color:#64748b;margin-top:2px}
.eq-lbl{font-size:11px;color:#64748b;margin-top:5px}
.exam-two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:10px}
@media(max-width:768px){.exam-two-col{grid-template-columns:1fr}}
.exam-sub-t{font-size:14px;font-weight:700;color:#374151;margin:4px 0 10px}
.exam-domain-tbl{width:100%;border-collapse:collapse;font-size:15px}
.exam-domain-tbl th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;padding:9px 12px;text-align:left;font-weight:700}
.exam-domain-tbl td{padding:9px 12px;border-bottom:1px solid #e9d5ff;vertical-align:middle}
.exam-domain-tbl tr:nth-child(even) td{background:#faf5ff}
.domain-chip{display:inline-block;border-radius:20px;padding:2px 11px;font-size:12px;font-weight:700;background:#ede9fe;color:#5b21b6;cursor:pointer;border:none;transition:.15s}
.domain-chip:hover{background:#ddd6fe}
.exam-info-list{font-size:15px;color:#374151;margin:0 0 12px 18px}
.exam-info-list li{margin-bottom:6px;line-height:1.7}
.exam-steps{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px;font-size:14px}
.step-block{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;padding:9px 12px;font-size:13px;color:#4338ca;flex:1 1 150px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.step-block b{display:block;font-size:13px}
.step-block span{display:block;font-size:11.5px;color:#6d28d9;margin-top:3px}
.step-arrow{color:#a78bfa;font-weight:700;font-size:16px;padding:0 4px;flex:0 0 auto;align-self:center}
details.exam-faq{margin-top:12px;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;background:#f8fafc}
details.exam-faq summary{font-size:14px;font-weight:700;color:#374151;cursor:pointer}
details.exam-faq p{margin:9px 0 0;font-size:14px;color:#475569;line-height:1.75}

/* 14 天计划 */
.ptbl{width:100%;border-collapse:collapse;font-size:15px}
.ptbl th{background:#f8fafc;padding:11px 12px;text-align:left;font-weight:600;color:#374151;border-bottom:2px solid #e2e8f0;font-size:14px}
.ptbl td{padding:10px 12px;border-bottom:1px solid #f8fafc;vertical-align:middle}
.ptbl tr:last-child td{border-bottom:none}
.day{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.chip-p{background:#ede9fe;color:#5b21b6}.chip-p:hover{background:#ddd6fe}
.focus{font-size:12px;color:#64748b}

/* ===== 章面板 ===== */
.ch-topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);padding:8px 18px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px}
.back-btn{background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:13px;font-weight:600;border-radius:8px;padding:5px 14px;cursor:pointer;white-space:nowrap;transition:.15s}
.back-btn:hover{background:#ede9fe}
.tn-title{font-size:15px;font-weight:700;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-hdr{color:#fff;padding:20px 22px 16px;border-radius:12px 12px 0 0;margin-bottom:0}
.ch-badge{font-size:13px;font-weight:700;opacity:.9;margin-bottom:5px;display:block}
.ch-title{font-size:22px;font-weight:800}
.panel{margin-bottom:14px}
.task-list{padding-left:22px;font-size:16px;color:#374151;line-height:2.0}
.task-list li::marker{color:#a78bfa}
.task-list a{color:#374151;text-decoration:none}
.task-list a:hover{color:#4f46e5}
.tl-id{display:inline-block;min-width:38px;font-weight:700;color:#4f46e5;margin-right:6px}
.panel-hr{border:none;border-top:1px solid #e2e8f0;margin:14px 0}

/* ===== 正文排版（规范 B） ===== */
.mdbody .sec-block h2.mh2{font-size:19px;font-weight:700;color:#4f46e5;margin:4px 0 12px;padding:10px 0 8px;border-top:1px solid #e2e8f0}
.mdbody p{font-size:17px;color:#374151;margin-bottom:14px;line-height:1.9}
.mdbody ul,.mdbody ol{font-size:17px;color:#374151;padding-left:24px;margin-bottom:12px}
.mdbody li{margin-bottom:8px;line-height:1.9}
.mdbody blockquote{border-left:3px solid #a78bfa;padding:10px 16px;background:#f5f3ff;font-size:15px;color:#5b21b6;margin:0 0 14px;border-radius:0 6px 6px 0;line-height:1.8}
.mdbody code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.mdbody h4.sec-h{font-size:17px;font-weight:600;color:#374151;margin:24px 0 10px;padding-left:12px;border-left:3px solid #a78bfa;line-height:1.4}
.mdbody .case-card,.mdbody .mem-card{border-radius:10px;padding:13px 16px;margin-bottom:14px}
.mdbody .case-card{background:#fff8e6;border:1px solid #ecd9a0}
.mdbody .mem-card{background:#eef3ff;border:1px solid #b9c9f7}
.mdbody .case-card h4.sec-h,.mdbody .mem-card h4.sec-h{border-left:none;padding-left:0;margin:0 0 8px;font-size:14px;font-weight:700}
.mdbody .case-card h4.sec-h{color:#9a7b1e}
.mdbody .mem-card h4.sec-h{color:#4361ee}
.mdbody .case-card p,.mdbody .mem-card p{font-size:15px}
.mdbody .case-card ul,.mdbody .mem-card ul{margin-bottom:0;font-size:15px}
/* 表格（规范 C） */
.tbl-wrap{overflow-x:auto;margin:0 0 14px;border:1px solid #e9d5ff;border-radius:10px}
.tbl-wrap table{min-width:480px}
table{border-collapse:collapse;width:100%;font-size:16px}
.mdbody th,.mdbody td{padding:11px 16px;text-align:left;border-bottom:1px solid #e9d5ff;vertical-align:top;line-height:1.6}
.mdbody thead th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;font-weight:700;font-size:15px;white-space:nowrap}
.mdbody tbody tr:nth-child(even) td{background:#faf5ff}
.mdbody tbody tr:last-child td{border-bottom:none}
/* 图块（v2.1 图文同流） */
.fig-block{background:#f8f7ff;border:1px solid #ddd6fe;border-radius:12px;padding:14px 16px;margin:0 0 14px}
.fig-placeholder{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fbfafd;border:1.6px dashed #c4b5fd;border-radius:12px;padding:12px 16px;margin:0 0 14px}
.fig-img{background:#f8f7ff;border:1px solid #ddd6fe;border-radius:12px;padding:10px 12px;margin:0 0 14px;text-align:center}
.fig-img img{max-width:100%;height:auto;border-radius:8px}
.fig-img figcaption{font-size:12px;color:#64748b;margin-top:6px;line-height:1.5}
.mdbody .inline-img{max-width:100%;height:auto;vertical-align:middle;border-radius:6px;margin:0 2px}
.mdbody .img-bad{display:inline-block;background:#fef2f2;border:1px dashed #ef4444;color:#b91c1c;font-size:13px;padding:1px 8px;border-radius:6px}
.fig-placeholder .fp-num{background:#7c3aed;color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.fig-placeholder .fp-type{background:#ede9fe;color:#6d28d9;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.fig-placeholder .fp-alt{color:#334155;font-size:14px;flex:1 1 auto;min-width:120px}
.fig-placeholder .fp-note{color:#94a3b8;font-size:12px;white-space:nowrap;border:1px dashed #cbd5e1;border-radius:6px;padding:2px 8px}
.fig-title{font-size:13px;font-weight:700;color:#4f46e5;text-align:center;margin-bottom:10px}
.fig-body{overflow-x:auto}
.fig-body svg{display:block;margin:0 auto;height:auto}
.fig-caption{font-size:12px;color:#6b7280;text-align:center;margin-top:10px;font-style:italic}
/* 手绘图 CSS 类（兼容） */
.compare-tbl{width:100%;border-collapse:collapse;font-size:13px}
.compare-tbl th{padding:9px 12px;font-weight:700;font-size:12px;text-align:center}
.compare-tbl td{padding:8px 12px;border:1px solid #e2e8f0;font-size:13px;vertical-align:top;line-height:1.5}
.compare-tbl tr:nth-child(even) td{background:#faf9ff}
.flow-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.flow-node{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;text-align:center;min-width:80px}
.flow-node.light{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#4338ca}
.flow-node.green{background:linear-gradient(135deg,#06d6a0,#059669);color:#fff}
.flow-arrow{color:#a78bfa;font-size:18px;font-weight:700;flex-shrink:0}
.cycle-wrap{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.cycle-step{display:flex;flex-direction:column;align-items:center;gap:4px}
.cycle-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.cycle-label{font-size:11px;color:#374151;text-align:center;max-width:70px;line-height:1.3}
.cycle-arrow{color:#a78bfa;font-size:16px;align-self:flex-start;margin-top:6px}
.stair-wrap{display:flex;align-items:flex-end;gap:8px;padding:8px 0;justify-content:center;flex-wrap:wrap}
.stair-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.stair-bar{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:6px 6px 0 0;width:80px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;padding:4px}
.stair-label{font-size:11px;color:#374151;text-align:center;max-width:80px;line-height:1.3}

/* 域尾提示卡 */
.tips-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tips-card .tc-title{font-size:15px;font-weight:700;margin-bottom:10px;color:#374151}
.tips-card table{font-size:14px}
.tips-card th{padding:9px 12px;font-size:13px}
.tips-card td{padding:9px 12px;font-size:14px;line-height:1.6}

/* ===== 章末练习 quiz-box（模块 10） ===== */
.quiz-box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:18px 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);scroll-margin-top:78px}
.quiz-hdr{display:flex;align-items:baseline;gap:14px;font-size:18px;font-weight:700;color:#374151;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}
.quiz-score{font-size:14px;font-weight:700;color:#4f46e5;margin-left:auto;white-space:nowrap}
.qi{border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.qi.done{background:#fafafa}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qbadge{background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:700}
.qtype{font-size:11px;border-radius:12px;padding:1px 9px;font-weight:600}
.qtype-s{background:#e0f2fe;color:#0369a1}
.qtype-m{background:#fce7f3;color:#be185d}
.qstem{font-size:16px;color:#1e293b;margin-bottom:10px;line-height:1.8}
.qstem code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{background:#fff;border:1.5px solid #e2e8f0;border-radius:9px;padding:11px 14px;font-size:15.5px;color:#374151;cursor:pointer;transition:.15s;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:#a78bfa}
.opt .ol{font-weight:700;color:#4f46e5;flex-shrink:0}
.opt.sel{border-color:#4f46e5;background:#ede9fe}
.opt.cor{border-color:#16a34a;background:#dcfce7}
.opt.wrg{border-color:#dc2626;background:#fee2e2}
.opt.shc{border-color:#16a34a;background:#f0fdf4}
.qi.done .opt{cursor:default;pointer-events:none}
.qrow{margin-top:10px;display:flex;align-items:center;gap:12px}
.qbtn{background:#4f46e5;color:#fff;font-size:12px;font-weight:600;border:none;border-radius:7px;padding:7px 18px;cursor:pointer;transition:.15s}
.qbtn:hover{background:#4338ca}
.qbtn:disabled{background:#cbd5e1;cursor:default}
.qres{display:none;flex:1;border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.7}
.qres.ok{background:#dcfce7;color:#15803d}
.qres.err{background:#fee2e2;color:#b91c1c}
.qres.na{background:#fef3c7;color:#b45309}
.qres.show{display:block}
/* 长串防溢出：overflow-wrap:anywhere 仅在 token 放不下时词内断行，普通文本断词行为不变；
   根治 SCP JSON/ARN 等不可断长串撑破移动端面板（SAP-C02 实测 sw=448→390） */
.mdbody,.quiz-box,.qi,.qstem,.opts,.opt{overflow-wrap:anywhere}
.qstem code,.opt code{white-space:pre-wrap;word-break:break-all}
.score-box{display:none;text-align:center;background:#f5f3ff;border-radius:10px;padding:22px 16px;margin-top:16px}
.score-box.show{display:block}
.score-num{font-size:32px;font-weight:700;color:#4f46e5;line-height:1.3}
.score-lbl{font-size:13px;color:#6d28d9;margin-top:4px}
.score-box .sb-tip{font-size:12px;color:#64748b;margin-top:8px;line-height:1.7}

.footer{margin-top:26px;padding:18px 10px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:12.5px;text-align:center;line-height:1.9}
.footer a{color:#4f46e5;text-decoration:none}
@media(max-width:768px){.ptbl th,.ptbl td{font-size:13px}.mdbody th,.mdbody td{font-size:13px}}

/* ===== 章面板 v6 布局：左侧常驻目录槽 + 正文列 =====
   三条布局约定：① 正文 #### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点，见下方 .mh3）
   ② 左侧目录两级（节 ▸ 知识点，单开手风琴 + 滚动自动跟读）③ 左右两侧任何分辨率留白，目录常驻不遮正文：
   ≥1200px：.panel 栅格 [236px 目录槽 | 正文列]，目录 sticky 常驻；<1200px：目录槽变左侧抽屉（☰+遮罩）。 */
body.chapView .wrap{max-width:1420px}
.panel{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start;margin-bottom:14px}
.ch-side{position:sticky;top:14px;min-width:0;z-index:30}
.side-close{display:none}
.toc-open-btn{display:none}
.side-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:85;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.side-mask.show{opacity:1;visibility:visible}
.ch-toc{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 6px 24px rgba(15,23,42,.06);overflow:hidden}
.ch-toc .toc-hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;border-bottom:1px solid #f1f5f9}
.ch-toc .th-title{font-size:13px;font-weight:800;color:#4f46e5;white-space:nowrap}
.ch-toc .th-meta{font-size:11px;color:#94a3b8;font-weight:600;white-space:nowrap}
.ch-toc .toc-body{max-height:calc(100vh - 46px);overflow-y:auto;padding:8px}
.toc-list{list-style:none;margin:0;padding:0}
.toc-list a{display:flex;align-items:baseline;gap:6px;padding:5px 6px;border-radius:7px;color:#475569;text-decoration:none;line-height:1.45;font-size:13px;transition:.12s}
.toc-list a:hover{background:#f5f3ff;color:#4f46e5}
.toc-list a.act{background:#ede9fe;color:#3730a3;font-weight:600}
.toc-list .tl-id{font-size:11.5px;font-weight:700;color:#a78bfa;flex-shrink:0;font-variant-numeric:tabular-nums}
.toc-list a.act .tl-id{color:#4f46e5}
.toc-t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toc-sec>a.toc-sec-link{font-weight:600;color:#334155;padding-top:6px;padding-bottom:6px}
.toc-sec>a .toc-ar{margin-left:auto;flex-shrink:0;font-size:9px;color:#94a3b8;transition:transform .18s}
.toc-sec.open>a .toc-ar{transform:rotate(90deg);color:#4f46e5}
.toc-sub{list-style:none;margin:0;padding:0 0 3px;display:none}
.toc-sec.open>.toc-sub{display:block}
.toc-sub a{padding:3px 6px 3px 20px;font-size:12.5px;color:#64748b;line-height:1.4}
.toc-sub a .tl-id{font-size:11px;color:#c4b5fd}
/* 目录尾【本章练习】入口（v6.2 新增）：独立条目，虚线分隔，点击滚到章末练习区 #quiz-dX */
.toc-quiz{margin-top:7px;padding-top:3px;border-top:1px dashed #ddd6fe}
.toc-quiz>a.toc-quiz-link{font-weight:700;color:#6d28d9;padding-top:6px;padding-bottom:6px}

// 题库数据注入区（构建系统自动注入，含考试元信息与题目全集，勿手改）
const QUIZ_META = {"exam":"AZ-104","title":"AZ-104 Azure 管理员认证 · 题库","lang":"zh-CN","updated":"2026-11-13","domains":{"1":"管理 Azure 标识与治理","2":"实现和管理存储","3":"部署和管理计算资源","4":"实现和管理虚拟网络","5":"监视和维护资源"},"weights":{"1":"20–25%","2":"15–20%","3":"20–25%","4":"15–20%","5":"10–15%"},"examParams":{"passScore":700,"scoreRange":"1-1000","duration":"100 分钟","questionCount":"官方典型区间 40–60 题；单场确切题数开考启动页才显示","skillsMeasuredAsOf":"October 26, 2023","count":48,"minutes":100,"pass":700,"countNote":"本字段是刷题页「模拟考核」从练习池抽题的题数，不是官方考试题数。模考池按 A 类② 隔离 50 题后练习池剩 51 题，各域余量 12/9/14/9/7；按官方权重区间下限折算的 50 题配额为 12/10/12/9/7，D2 超配 1 题会抽不满卷。取 48 题时配额 12/9/11/9/7 全部落在余量内，卷面题数与成绩单自洽。「全真模考」固定使用 mock-pool.json 的 50 题，不受本字段影响。"},"footerNote":"AZ-104 中文学习资料 · 练习池 51 题 / 全真模考 50 题（题目均自建原创）","cnName":"Azure 管理员助理级认证","practiceNote":"练习模式已剔除 50 题模考池，可练 51 题"};
const QUIZ_QUESTIONS = [{"id":"D1-001","d":1,"t":"single","q":"新员工要按部门属性自动加入对应组，调岗后成员资格自动重算，管理员不想逐人维护，怎么做最省事","o":[{"l":"A","t":"建已分配组后逐人添加成员"},{"l":"B","t":"用管理组按部门组织订阅"},{"l":"C","t":"建"},{"l":"D","t":"给每个部门新建独立订阅"}],"a":["C"],"e":"**正确答案：C。** 建动态成员资格组，用 department 属性写成员资格规则。\n\n**为什么对：** 动态组按用户属性表达式计算成员，属性一变成员集自动重算，正好覆盖入职与调岗；该能力需要 P1 及以上许可。关联考点：官方技能点 1.1.1「创建用户和组」，内容领域 1。\n\n**其他选项为什么错：**\n- A：建已分配组后逐人添加成员。已分配组靠人工维护，属性变化不会触发成员重算。\n- B：用管理组按部门组织订阅。管理组管订阅与策略作用域，不是目录里的用户组成员。\n- D：给每个部门新建独立订阅。订阅是计费与资源边界，不能替代用户组成员资格。\n\n**关键概念：** 动态成员资格组由属性规则驱动，与手动的已分配组是两种模型。本题对应考纲 1.1.1。","s":"自编·1.1.1"},{"id":"D1-002","d":1,"t":"single","q":"要把一批用户的使用位置统一改为 CN 并保留变更留痕，最合适的做法是","o":[{"l":"A","t":"在门户逐个打开用户资料手工修改"},{"l":"B","t":"用"},{"l":"C","t":"重建这些用户账户再重新分配许可"},{"l":"D","t":"修改订阅的计费地址"}],"a":["B"],"e":"**正确答案：B。** 用 Microsoft Graph 或 PowerShell 批量更新 user 属性并留存执行日志。\n\n**为什么对：** 用户属性属于目录对象本身，批量改属性走 Graph 或 PowerShell，执行日志就是审计留痕的来源。关联考点：官方技能点 1.1.2「管理用户和组属性」，内容领域 1。\n\n**其他选项为什么错：**\n- A：在门户逐个打开用户资料手工修改。逐人操作既无批量能力，也没有统一的变更留痕。\n- C：重建这些用户账户再重新分配许可。重建会丢对象 ID、组成员与既有授权，代价远超改属性。\n- D：修改订阅的计费地址。订阅计费地址与用户对象的国家地区属性不是同一个字段。\n\n**关键概念：** usageLocation 影响许可与服务可用性，但改属性不等于改许可。本题对应考纲 1.1.2。","s":"自编·1.1.2"},{"id":"D1-003","d":1,"t":"single","q":"给 800 名员工统一分配 E3，且入职自动获得、离职自动回收，最稳的做法是","o":[{"l":"A","t":"用"},{"l":"B","t":"给每个用户在门户单独点选许可"},{"l":"C","t":"把许可绑定到订阅级别"},{"l":"D","t":"用 Azure Policy 强制分配许可"}],"a":["A"],"e":"**正确答案：A。** 用基于组的许可，把许可分配给动态安全组。\n\n**为什么对：** 组许可让成员资格变化自动触发许可增删，配合动态组即可覆盖入职与离职全流程。关联考点：官方技能点 1.1.3「在 Microsoft Entra ID 中管理许可」，内容领域 1。\n\n**其他选项为什么错：**\n- B：给每个用户在门户单独点选许可。逐人分配无法随入离职自动增删，容易漏配或留下付费许可。\n- C：把许可绑定到订阅级别。许可按用户对象分配，订阅本身不接受用户许可分配。\n- D：用 Azure Policy 强制分配许可。Policy 作用于 Azure 资源合规性，不管理目录用户许可。\n\n**关键概念：** 基于组的许可由成员资格驱动授权，是批量许可的官方推荐形态。本题对应考纲 1.1.3。","s":"自编·1.1.3"},{"id":"D1-004","d":1,"t":"single","q":"某用户已通过组获得 E3，管理员又在其用户对象上直接分配同一 E3，会发生什么","o":[{"l":"A","t":"系统会收取两份许可费"},{"l":"B","t":"直接分配会覆盖组继承并报错"},{"l":"C","t":"组许可自动失效只保留直接分配"},{"l":"D","t":"同"}],"a":["D"],"e":"**正确答案：D。** 同一 SKU 只计一份许可，不产生双重计费。\n\n**为什么对：** 组许可与直接许可共存时按去重处理，但移除组成员后直接分配仍在，容易留下回收死角。关联考点：官方技能点 1.1.3「在 Microsoft Entra ID 中管理许可」，内容领域 1。\n\n**其他选项为什么错：**\n- A：系统会收取两份许可费。同一用户的直接与组继承许可会去重，不重复计费。\n- B：直接分配会覆盖组继承并报错。两条路径可以并存，不会互相覆盖报错。\n- C：组许可自动失效只保留直接分配。组继承仍然有效，直到组成员资格被移除。\n\n**关键概念：** 排查许可占用必须同时看直接分配与组继承两条路径。本题对应考纲 1.1.3。","s":"自编·1.1.3"},{"id":"D1-005","d":1,"t":"single","q":"合作方顾问要访问本租户的 SharePoint 站点与 Teams，但不打算为其建内部账号，应采用","o":[{"l":"A","t":"在内部目录建普通成员账号借给对方"},{"l":"B","t":"把站点设成匿名公开链接"},{"l":"C","t":"通"},{"l":"D","t":"给对方订阅级 Owner 角色"}],"a":["C"],"e":"**正确答案：C。** 通过 Entra B2B 邀请外部用户并授予所需访问权限。\n\n**为什么对：** B2B 把外部身份以来宾对象引入本租户，可按对象授权、可随时撤销，不占内部成员身份。关联考点：官方技能点 1.1.4「管理外部用户」，内容领域 1。\n\n**其他选项为什么错：**\n- A：在内部目录建普通成员账号借给对方。等于把外部人员当内部成员管理，身份与审计边界都不清。\n- B：把站点设成匿名公开链接。匿名链接绕开身份管控，无法按人撤销与审计。\n- D：给对方订阅级 Owner 角色。订阅角色管 Azure 资源，且权限范围远超一个站点。\n\n**关键概念：** B2B 来宾是目录中独立对象，权限靠本租户角色与组成员资格授予。本题对应考纲 1.1.4。","s":"自编·1.1.4"},{"id":"D1-006","d":1,"t":"single","q":"启用自助式密码重置后用户仍提示未注册而无法自助重置，最可能的原因是","o":[{"l":"A","t":"SSPR 只在用户加入管理员角色后生效"},{"l":"B","t":"用"},{"l":"C","t":"重置必须接入公司内网"},{"l":"D","t":"每次重置都要全局管理员批准"}],"a":["B"],"e":"**正确答案：B。** 用户尚未完成身份验证方法注册，或注册要求未满足。\n\n**为什么对：** SSPR 依赖用户预先登记验证方式，管理员启用策略与用户完成注册是两件事。关联考点：官方技能点 1.1.5「配置自助式密码重置」，内容领域 1。\n\n**其他选项为什么错：**\n- A：SSPR 只在用户加入管理员角色后生效。SSPR 面向普通用户，与管理员角色无关。\n- C：重置必须接入公司内网。SSPR 是云端自助流程，不依赖内网接入。\n- D：每次重置都要全局管理员批准。自助的定义就是不需要管理员逐次介入。\n\n**关键概念：** 启用策略不等于用户可用，注册覆盖率是 SSPR 落地的关键指标。本题对应考纲 1.1.5。","s":"自编·1.1.5"},{"id":"D1-007","d":1,"t":"single","q":"要让运维能重启虚拟机、查看资源，但不能改他人权限，应选哪个内置角色","o":[{"l":"A","t":"虚"},{"l":"B","t":"参与者 Contributor"},{"l":"C","t":"所有者 Owner"},{"l":"D","t":"读取者 Reader"}],"a":["A"],"e":"**正确答案：A。** 虚拟机参与者 Virtual Machine Contributor。\n\n**为什么对：** 内置角色按操作集合划分，VM Contributor 只覆盖虚拟机相关管理操作，不含授权管理。关联考点：官方技能点 1.2.1「管理内置 Azure 角色」，内容领域 1。\n\n**其他选项为什么错：**\n- B：参与者 Contributor。该角色覆盖订阅内几乎所有资源类型，范围比虚拟机管理宽得多。\n- C：所有者 Owner。Owner 含分配角色的权限，超出不能改他人权限的约束。\n- D：读取者 Reader。Reader 只读，无法执行重启这类写操作。\n\n**关键概念：** 最小权限优先选窄范围的内置角色，避免直接给订阅级宽角色。本题对应考纲 1.2.1。","s":"自编·1.2.1"},{"id":"D1-008","d":1,"t":"single","q":"公司要求用户重置密码时必须提供两种验证方式，且禁止只靠安全问题，应配置","o":[{"l":"A","t":"在条件访问里新建一条阻止密码重置的策略"},{"l":"B","t":"把用户全部提升为全局管理员"},{"l":"C","t":"关闭 SSPR 改用管理员手工重置"},{"l":"D","t":"在"}],"a":["D"],"e":"**正确答案：D。** 在 SSPR 策略里把重置所需验证方法数设为 2 并停用安全问题。\n\n**为什么对：** SSPR 的验证方法数量与可用方法类型在密码重置策略里设置，安全问题因强度低应停用。关联考点：官方技能点 1.1.5「配置自助式密码重置」，内容领域 1。\n\n**其他选项为什么错：**\n- A：在条件访问里新建一条阻止密码重置的策略。条件访问管的是登录时的访问决策，不控制 SSPR 的验证方法组合。\n- B：把用户全部提升为全局管理员。管理员角色不改变 SSPR 的验证强度要求。\n- C：关闭 SSPR 改用管理员手工重置。这与自助目标相反，也没有解决验证强度配置。\n\n**关键概念：** SSPR 策略决定怎么验，条件访问决定何时放行登录，两者不是一层。本题对应考纲 1.1.5。","s":"自编·1.1.5"},{"id":"D1-009","d":1,"t":"single","q":"管理员在门户看不到某用户的经理字段值，但该字段在目录里确实有值，最合理的解释是","o":[{"l":"A","t":"该用户没有分配许可"},{"l":"B","t":"目录对象已损坏"},{"l":"C","t":"门"},{"l":"D","t":"必须切换到根管理组才能查看"}],"a":["C"],"e":"**正确答案：C。** 门户只展示部分属性，完整属性需通过 Graph 查询。\n\n**为什么对：** 门户属性页是可读子集，批量或完整属性读取应走 Graph 或 PowerShell。关联考点：官方技能点 1.1.2「管理用户和组属性」，内容领域 1。\n\n**其他选项为什么错：**\n- A：该用户没有分配许可。属性可见性与许可分配无关，许可只影响服务可用性。\n- B：目录对象已损坏。字段有值说明对象正常，只是展示层未列出。\n- D：必须切换到根管理组才能查看。管理组作用域只影响 Azure 资源治理，与目录属性展示无关。\n\n**关键概念：** 展示层看得见什么，不等于目录对象里存了什么。本题对应考纲 1.1.2。","s":"自编·1.1.2"},{"id":"D1-010","d":1,"t":"single","q":"公司在订阅上给 A 组授了 Reader，又在生产资源组上给同组授了 Contributor，该组在资源组内的权限是","o":[{"l":"A","t":"Reader，因为订阅级分配先写入"},{"l":"B","t":"C"},{"l":"C","t":"两者冲突导致拒绝访问"},{"l":"D","t":"必须先删除订阅级 Reader 才生效"}],"a":["B"],"e":"**正确答案：B。** Contributor，因为较窄作用域的分配在该范围内同样生效。\n\n**为什么对：** Azure RBAC 按管理组、订阅、资源组、资源逐层继承，同作用域内多个分配取操作并集。关联考点：官方技能点 1.2.2「在不同作用域分配角色」，内容领域 1。\n\n**其他选项为什么错：**\n- A：Reader，因为订阅级分配先写入。角色分配没有先写先赢，按作用域继承与叠加计算。\n- C：两者冲突导致拒绝访问。多个分配是叠加生效，不是冲突报错。\n- D：必须先删除订阅级 Reader 才生效。无需删除，作用域内已有更宽的分配即可。\n\n**关键概念：** 权限判定等于所有适用分配的操作并集，Deny 分配除外。本题对应考纲 1.2.2。","s":"自编·1.2.2"},{"id":"D1-011","d":1,"t":"multiple","q":"要让用户仅能管理生产资源组内的资源且不能把权限转授他人，下列做法哪些正确","o":[{"l":"A","t":"在订阅作用域分配 Contributor"},{"l":"B","t":"在资源组作用域分配 Owner"},{"l":"C","t":"在"},{"l":"D","t":"用管理组作用域分配 Reader"},{"l":"E","t":"对订阅启用只读锁"},{"l":"F","t":"不"}],"a":["C","F"],"e":"**正确答案：C、F。** 在资源组作用域分配 Contributor；不分配 Owner 或用户访问管理员角色。\n\n**为什么对：** 角色分配的作用域决定影响范围，Contributor 能管资源但不含授权管理，两者叠加正好满足约束。关联考点：官方技能点 1.2.2「在不同作用域分配角色」，内容领域 1。\n\n**其他选项为什么错：**\n- A：在订阅作用域分配 Contributor。作用域过宽，会波及订阅下所有资源组。\n- B：在资源组作用域分配 Owner。Owner 含角色分配权，违反不能转授的约束。\n- D：用管理组作用域分配 Reader。作用域在资源组之上且只读，既越界又不满足管理需求。\n- E：对订阅启用只读锁。资源锁限制资源操作，不改变 RBAC 分配的作用域。\n\n**关键概念：** 作用域选窄与角色选窄是 RBAC 设计的两条独立维度。本题对应考纲 1.2.2。","s":"自编·1.2.2"},{"id":"D1-012","d":1,"t":"single","q":"排查某用户为何能删除某资源，除了查看直接角色分配，还必须检查","o":[{"l":"A","t":"仅资源本身的资源锁状态"},{"l":"B","t":"用户的登录地点与时间"},{"l":"C","t":"订阅的预算告警配置"},{"l":"D","t":"组"}],"a":["D"],"e":"**正确答案：D。** 组继承的分配、上级作用域分配与 Deny 分配。\n\n**为什么对：** 有效权限来自直接分配、组成员资格继承、上级作用域继承，并受 Deny 分配压制。关联考点：官方技能点 1.2.3「解释访问分配」，内容领域 1。\n\n**其他选项为什么错：**\n- A：仅资源本身的资源锁状态。资源锁只限制操作，无法解释角色从何而来。\n- B：用户的登录地点与时间。登录上下文不改变 RBAC 的静态权限判定。\n- C：订阅的预算告警配置。预算与成本告警不参与任何权限计算。\n\n**关键概念：** 解释访问分配要重建完整继承链，只看一处必漏。本题对应考纲 1.2.3。","s":"自编·1.2.3"},{"id":"D1-013","d":1,"t":"single","q":"要求所有新建存储账户必须启用 HTTPS 传输，且违规资源在合规视图中可见，应选哪种 Policy 效果","o":[{"l":"A","t":"DeployIfNotExists"},{"l":"B","t":"Append"},{"l":"C","t":"D"},{"l":"D","t":"Disabled"}],"a":["C"],"e":"**正确答案：C。** Deny 配合合规扫描，或直接 Audit 记录不合规资源。\n\n**为什么对：** Deny 在创建阶段直接拦下不合规请求，Audit 则把不合规资源标出供整改，两者常配合分层使用。关联考点：官方技能点 1.3.1「实现和管理 Azure Policy」，内容领域 1。\n\n**其他选项为什么错：**\n- A：DeployIfNotExists。该效果用于补部署关联配置，不是阻断创建时属性校验的首选。\n- B：Append。Append 只追加字段，无法阻止不符合要求的请求。\n- D：Disabled。禁用等于整条策略不生效，既无阻断也无记录。\n\n**关键概念：** Policy 效果决定是拦、是记、还是补，先定目标再选效果。本题对应考纲 1.3.1。","s":"自编·1.3.1"},{"id":"D1-014","d":1,"t":"single","q":"生产资源组里的数据库不允许任何人删除，但要允许日常读写与配置变更，应加","o":[{"l":"A","t":"ReadOnly 锁"},{"l":"B","t":"C"},{"l":"C","t":"在资源上分配 Reader 角色"},{"l":"D","t":"删除并重建资源"}],"a":["B"],"e":"**正确答案：B。** CanNotDelete 锁。\n\n**为什么对：** CanNotDelete 允许常规读写与更新，只禁止删除，正好匹配防误删目标。关联考点：官方技能点 1.3.2「配置资源锁」，内容领域 1。\n\n**其他选项为什么错：**\n- A：ReadOnly 锁。ReadOnly 会连写入与配置变更一起挡住，超出题干允许的范围。\n- C：在资源上分配 Reader 角色。Reader 会挡住所有管理操作，且改的是权限不是防误删。\n- D：删除并重建资源。重建既丢数据也不解决后续再次被删的风险。\n\n**关键概念：** 资源锁两种模式里 CanNotDelete 保业务可用，ReadOnly 近乎冻结。本题对应考纲 1.3.2。","s":"自编·1.3.2"},{"id":"D1-015","d":1,"t":"single","q":"财务要求按成本中心归集账单，但发现资源组上的标记没有自动出现在组内资源上，应如何处理","o":[{"l":"A","t":"用"},{"l":"B","t":"把标记改写到订阅名称里"},{"l":"C","t":"等待系统自动继承"},{"l":"D","t":"给每个资源组再建一个订阅"}],"a":["A"],"e":"**正确答案：A。** 用 Azure Policy 或脚本把标记下发到子资源。\n\n**为什么对：** 标记默认不继承，需靠策略的 Modify 效果或自动化脚本把父级标记传播到子资源。关联考点：官方技能点 1.3.3「在资源上应用和管理标记」，内容领域 1。\n\n**其他选项为什么错：**\n- B：把标记改写到订阅名称里。订阅名称不是可计费维度，无法按成本中心分摊。\n- C：等待系统自动继承。资源组标记默认不向子资源继承，等待不会产生数据。\n- D：给每个资源组再建一个订阅。拆订阅会改变治理边界，仍不解决标记下发。\n\n**关键概念：** 标记是资源级元数据，继承要靠显式机制而非默认行为。本题对应考纲 1.3.3。","s":"自编·1.3.3"},{"id":"D1-016","d":1,"t":"single","q":"要把一批虚拟机从资源组 A 移到资源组 B，迁移前必须先确认","o":[{"l":"A","t":"两台虚拟机名称是否相同"},{"l":"B","t":"是否已删除全部资源锁"},{"l":"C","t":"资源组是否为空目标"},{"l":"D","t":"目"}],"a":["D"],"e":"**正确答案：D。** 目标资源组与源在同一订阅且资源类型支持移动。\n\n**为什么对：** 移动资源要核对同订阅、同区域约束、资源类型支持与依赖项，跨订阅移动规则更严格。关联考点：官方技能点 1.3.4「管理资源组」，内容领域 1。\n\n**其他选项为什么错：**\n- A：两台虚拟机名称是否相同。名称与移动可行性无关，同订阅内也不会因重名冲突。\n- B：是否已删除全部资源锁。锁需要先移除或调整，但这只是前置条件之一，不是最完整的确认项。\n- C：资源组是否为空目标。目标可以已有资源，不要求为空。\n\n**关键概念：** 资源组是逻辑容器，移动的是资源引用而非数据本身。本题对应考纲 1.3.4。","s":"自编·1.3.4"},{"id":"D1-017","d":1,"t":"single","q":"公司新增一条业务线需要独立计费与独立权限边界，最合适的边界是","o":[{"l":"A","t":"新建资源组"},{"l":"B","t":"新建管理组"},{"l":"C","t":"新"},{"l":"D","t":"给现有订阅加标签"}],"a":["C"],"e":"**正确答案：C。** 新建订阅并在订阅作用域分配管理权限。\n\n**为什么对：** 订阅同时是计费边界、配额边界与角色分配作用域，独立业务线通常从这里切分。关联考点：官方技能点 1.3.5「管理订阅」，内容领域 1。\n\n**其他选项为什么错：**\n- A：新建资源组。资源组便于分组管理，但账单与订阅级权限边界仍在原订阅内。\n- B：新建管理组。管理组用于策略与层级治理，本身不产生独立账单。\n- D：给现有订阅加标签。标签能做成本归集，不能形成独立的权限与配额边界。\n\n**关键概念：** 资源组管分组，订阅管账单与配额，管理组管治理层级。本题对应考纲 1.3.5。","s":"自编·1.3.5"},{"id":"D1-018","d":1,"t":"single","q":"预算告警触发后消费仍在继续，管理员希望超支时自动停用非关键资源，应如何做","o":[{"l":"A","t":"把预算阈值调低"},{"l":"B","t":"用"},{"l":"C","t":"改用 Azure Advisor 成本建议"},{"l":"D","t":"给订阅加 CanNotDelete 锁"}],"a":["B"],"e":"**正确答案：B。** 用预算关联的自动化操作调用 runbook 或逻辑应用执行停用。\n\n**为什么对：** 预算本身只发告警，要真正止损必须接动作组或自动化把告警转成操作。关联考点：官方技能点 1.3.6「用警报、预算和 Azure Advisor 建议管理成本」，内容领域 1。\n\n**其他选项为什么错：**\n- A：把预算阈值调低。阈值只影响何时告警，不产生任何阻断能力。\n- C：改用 Azure Advisor 成本建议。Advisor 给优化建议，不执行动作也不设预算。\n- D：给订阅加 CanNotDelete 锁。资源锁防删除，与消费额度完全无关。\n\n**关键概念：** 预算是监测，自动化是执行，两者接通才形成闭环。本题对应考纲 1.3.6。","s":"自编·1.3.6"},{"id":"D1-019","d":1,"t":"multiple","q":"关于 Azure Policy 与基于角色的访问控制，下列说法哪些正确","o":[{"l":"A","t":"Policy 可用来给用户授予读取权限"},{"l":"B","t":"P"},{"l":"C","t":"RBAC 可强制新建资源必须带指定标记"},{"l":"D","t":"禁用一条 Policy 会让订阅停用"},{"l":"E","t":"把策略分配给管理组后子订阅无法覆盖"},{"l":"F","t":"R"}],"a":["B","F"],"e":"**正确答案：B、F。** Policy 决定资源允许长成什么样；RBAC 决定谁能对资源做什么操作。\n\n**为什么对：** Policy 管资源状态合规，RBAC 管主体操作权限，两套机制独立生效。关联考点：官方技能点 1.3.1「实现和管理 Azure Policy」，内容领域 1。\n\n**其他选项为什么错：**\n- A：Policy 可用来给用户授予读取权限。授权是 RBAC 的职责，Policy 不做用户授权。\n- C：RBAC 可强制新建资源必须带指定标记。属性合规是 Policy 的职责，RBAC 不校验资源属性。\n- D：禁用一条 Policy 会让订阅停用。策略禁用只影响合规评估，不影响订阅状态。\n- E：把策略分配给管理组后子订阅无法覆盖。子级可有自己的分配，治理是继承加本地叠加。\n\n**关键概念：** 把「谁可以做」与「做成什么样」分开，是 Azure 治理的基本切分。本题对应考纲 1.3.1。","s":"自编·1.3.1"},{"id":"D1-020","d":1,"t":"single","q":"公司希望合规基线一次定义、自动覆盖现有与将来所有订阅，应把 Policy 分配在","o":[{"l":"A","t":"每个订阅单独分配一次"},{"l":"B","t":"某个资源组"},{"l":"C","t":"资源本身"},{"l":"D","t":"根"}],"a":["D"],"e":"**正确答案：D。** 根管理组或覆盖全部订阅的上层管理组。\n\n**为什么对：** 管理组层级让策略与治理设置向下继承，新建订阅落入该层级后自动继承。关联考点：官方技能点 1.3.7「配置管理组」，内容领域 1。\n\n**其他选项为什么错：**\n- A：每个订阅单独分配一次。逐订阅分配无法自动覆盖将来新建的订阅。\n- B：某个资源组。资源组作用域最小，覆盖不到其他资源组与订阅。\n- C：资源本身。资源级分配只影响单个对象，完全谈不上基线。\n\n**关键概念：** 管理组是订阅的容器，用于把治理基线从逐点配置改成层级继承。本题对应考纲 1.3.7。","s":"自编·1.3.7"},{"id":"D1-021","d":1,"t":"single","q":"Azure Advisor 给出一条「调整虚拟机规格」的建议，管理员应理解为","o":[{"l":"A","t":"系统已自动完成规格调整"},{"l":"B","t":"该虚拟机已被判定故障"},{"l":"C","t":"基"},{"l":"D","t":"必须立即删除该虚拟机"}],"a":["C"],"e":"**正确答案：C。** 基于使用情况的成本优化提示，需人工评估后执行。\n\n**为什么对：** Advisor 按成本、安全、可靠性、性能等维度分析遥测给出建议，执行权始终在管理员。关联考点：官方技能点 1.3.6「用警报、预算和 Azure Advisor 建议管理成本」，内容领域 1。\n\n**其他选项为什么错：**\n- A：系统已自动完成规格调整。Advisor 只出建议，不自动变更资源。\n- B：该虚拟机已被判定故障。规格建议属成本类，不等于可用性或故障告警。\n- D：必须立即删除该虚拟机。建议内容是调整规格，且所有建议都需评估影响。\n\n**关键概念：** 建议不等于动作，评估业务影响后再变更是必要步骤。本题对应考纲 1.3.6。","s":"自编·1.3.6"},{"id":"D1-022","d":1,"t":"single","q":"需要让某人能管理订阅内全部资源并可为他人分配角色，最小够用的内置角色是","o":[{"l":"A","t":"参与者 Contributor"},{"l":"B","t":"所"},{"l":"C","t":"用户访问管理员"},{"l":"D","t":"读取者 Reader"}],"a":["B"],"e":"**正确答案：B。** 所有者 Owner。\n\n**为什么对：** Owner 在角色上等于 Contributor 加上授权管理能力，是唯一同时满足两项的内置角色。关联考点：官方技能点 1.2.1「管理内置 Azure 角色」，内容领域 1。\n\n**其他选项为什么错：**\n- A：参与者 Contributor。Contributor 能管资源但不能分配角色，缺了授权能力。\n- C：用户访问管理员。该角色主要管角色分配，不能全面管理资源。\n- D：读取者 Reader。只读角色完全不满足管理与授权要求。\n\n**关键概念：** Owner 与 Contributor 的关键差别就在能不能授角色。本题对应考纲 1.2.1。","s":"自编·1.2.1"},{"id":"D1-023","d":1,"t":"single","q":"删除某资源组后账单里仍出现相关资源费用，最合理的解释是","o":[{"l":"A","t":"有"},{"l":"B","t":"资源组删除有 30 天计费延迟"},{"l":"C","t":"订阅仍在就一定会继续扣费"},{"l":"D","t":"标记未清理导致继续计费"}],"a":["A"],"e":"**正确答案：A。** 有资源未随组删除，或存在按量计费的残留数据与管理资源。\n\n**为什么对：** 删资源组会删组内资源，但软删除数据、未纳入该组的资源或独立计费项可能继续产生费用。关联考点：官方技能点 1.3.4「管理资源组」，内容领域 1。\n\n**其他选项为什么错：**\n- B：资源组删除有 30 天计费延迟。删除后资源不再产生新用量，延迟不是资源组特性。\n- C：订阅仍在就一定会继续扣费。订阅本身不计费，费用来自仍在运行的资源。\n- D：标记未清理导致继续计费。标记是元数据，不产生任何费用。\n\n**关键概念：** 核对账单要回到资源清单，不能只看资源组是否存在。本题对应考纲 1.3.4。","s":"自编·1.3.4"},{"id":"D1-024","d":1,"t":"single","q":"管理员要为一组外包人员建可复用的邮件分发集合，但不需要动态规则，应创建","o":[{"l":"A","t":"动态成员资格组"},{"l":"B","t":"管理组"},{"l":"C","t":"订阅"},{"l":"D","t":"已"}],"a":["D"],"e":"**正确答案：D。** 已分配的 Microsoft 365 组或分发组。\n\n**为什么对：** 静态集合适合成员边界由人工确定的场景，动态组适合属性驱动且频繁变化的场景。关联考点：官方技能点 1.1.1「创建用户和组」，内容领域 1。\n\n**其他选项为什么错：**\n- A：动态成员资格组。动态组依赖属性规则，外包人员未必有统一可用属性。\n- B：管理组。管理组是订阅治理层级，与邮件分发无关。\n- C：订阅。订阅是资源与计费边界，不能作为邮件收件人集合。\n\n**关键概念：** 先判断成员边界是否由属性决定，再决定用动态组还是已分配组。本题对应考纲 1.1.1。","s":"自编·1.1.1"},{"id":"D2-001","d":2,"t":"single","q":"只允许公司虚拟网络内子网访问存储账户，同时保留通过门户管理该账户的能力，应配置","o":[{"l":"A","t":"禁用存储账户的公共网络访问但不开专用终结点"},{"l":"B","t":"只配置共享访问签名 SAS"},{"l":"C","t":"存"},{"l":"D","t":"把访问密钥轮换一次"}],"a":["C"],"e":"**正确答案：C。** 存储账户防火墙只放行所选虚拟网络与子网，并按需加可信 IP 例外。\n\n**为什么对：** 存储防火墙按来源网络控制访问，配合选定子网与受信 IP 可在限制来源的同时保留管理通道。关联考点：官方技能点 2.1.1「配置存储防火墙与虚拟网络」，内容领域 2。\n\n**其他选项为什么错：**\n- A：禁用存储账户的公共网络访问但不开专用终结点。完全禁用后需专用终结点才能连，单靠关闭无法按子网放行。\n- B：只配置共享访问签名 SAS。SAS 管的是授权凭证，不是网络层来源限制。\n- D：把访问密钥轮换一次。轮换密钥只换凭证，不改变网络可达性。\n\n**关键概念：** 网络边界与授权凭证是两层，防火墙管从哪来，SAS 与密钥管凭什么访问。本题对应考纲 2.1.1。","s":"自编·2.1.1"},{"id":"D2-002","d":2,"t":"single","q":"要给外部合作方临时读取某个 Blob，且需限定有效期与只读权限，最合适的是","o":[{"l":"A","t":"把存储账户访问密钥发给对方"},{"l":"B","t":"生"},{"l":"C","t":"把容器改成公共读取"},{"l":"D","t":"给对方订阅级 Reader"}],"a":["B"],"e":"**正确答案：B。** 生成带到期时间与只读权限的服务 SAS 或用户委托 SAS。\n\n**为什么对：** SAS 把权限、资源范围与有效期写进凭证本身，适合短期受控外发。关联考点：官方技能点 2.1.2「创建并使用共享访问签名」，内容领域 2。\n\n**其他选项为什么错：**\n- A：把存储账户访问密钥发给对方。密钥等于账户全权，泄露后影响整个账户且难以按对象收回。\n- C：把容器改成公共读取。公共读取对所有人开放，无法限定时间与单个对象。\n- D：给对方订阅级 Reader。订阅角色不授予 Blob 数据平面的读取权限。\n\n**关键概念：** 数据平面访问可用 SAS 精确限权，账户密钥应始终留在受控侧。本题对应考纲 2.1.2。","s":"自编·2.1.2"},{"id":"D2-003","d":2,"t":"single","q":"公司要求能随时撤销已发出的 SAS，且不必轮换存储账户密钥，应采用","o":[{"l":"A","t":"把"},{"l":"B","t":"把 SAS 到期时间设得很长再口头要求对方别用"},{"l":"C","t":"每次撤销都轮换访问密钥"},{"l":"D","t":"把容器设为私有后重新公开"}],"a":["A"],"e":"**正确答案：A。** 把 SAS 关联到存储访问策略，通过删除或修改策略撤销。\n\n**为什么对：** 存储访问策略把服务端可控的开始时间、到期与权限抽出来，改策略即可让关联 SAS 失效。关联考点：官方技能点 2.1.3「配置存储访问策略」，内容领域 2。\n\n**其他选项为什么错：**\n- B：把 SAS 到期时间设得很长再口头要求对方别用。到期时间一旦签发无法单方面缩短。\n- C：每次撤销都轮换访问密钥。轮换可行但会打断所有依赖该密钥的调用，代价过大。\n- D：把容器设为私有后重新公开。容器公开级别不控制已签发的 SAS 凭证。\n\n**关键概念：** 策略化 SAS 的价值在于可撤销，裸 SAS 只能等它自己过期。本题对应考纲 2.1.3。","s":"自编·2.1.3"},{"id":"D2-004","d":2,"t":"single","q":"怀疑存储账户访问密钥已泄露，正确的处置顺序是","o":[{"l":"A","t":"先删除存储账户"},{"l":"B","t":"只把容器改成私有"},{"l":"C","t":"等待密钥自然过期"},{"l":"D","t":"先"}],"a":["D"],"e":"**正确答案：D。** 先轮换密钥并更新所有依赖方，再排查使用日志。\n\n**为什么对：** 密钥泄露的核心动作是轮换，且因有两个密钥应先切依赖到备用密钥再轮换主密钥。关联考点：官方技能点 2.1.4「管理访问密钥」，内容领域 2。\n\n**其他选项为什么错：**\n- A：先删除存储账户。删账户会丢数据，且不是处置凭证泄露的第一步。\n- B：只把容器改成私有。容器级别不影响账户密钥的有效性。\n- C：等待密钥自然过期。存储账户访问密钥不会自动过期，必须显式轮换。\n\n**关键概念：** 双密钥设计的目的就是支持不停机轮换。本题对应考纲 2.1.4。","s":"自编·2.1.4"},{"id":"D2-005","d":2,"t":"single","q":"要让虚拟机通过本地 AD 身份访问 Azure 文件共享，必须满足的前置条件是","o":[{"l":"A","t":"只要启用 HTTPS 传输即可"},{"l":"B","t":"给共享生成 SAS 并在虚拟机里写死"},{"l":"C","t":"把"},{"l":"D","t":"把共享设为匿名访问"}],"a":["C"],"e":"**正确答案：C。** 把存储账户加入域并配置基于标识的访问权限与 RBAC 角色。\n\n**为什么对：** 基于标识的访问依赖存储账户与目录的集成，再由目录主体通过 RBAC 获得文件共享权限。关联考点：官方技能点 2.1.5「为 Azure 文件配置基于标识的访问」，内容领域 2。\n\n**其他选项为什么错：**\n- A：只要启用 HTTPS 传输即可。HTTPS 只加密传输，不提供任何身份映射。\n- B：给共享生成 SAS 并在虚拟机里写死。SAS 是凭证不是域身份，无法按 AD 用户授权。\n- D：把共享设为匿名访问。匿名访问不区分用户，且与域身份要求相反。\n\n**关键概念：** 身份集成与共享级权限两件都配齐，域用户才能按人访问。本题对应考纲 2.1.5。","s":"自编·2.1.5"},{"id":"D2-006","d":2,"t":"single","q":"创建存储账户时要求支持 Blob 的热冷归档层级与生命周期管理，应选择","o":[{"l":"A","t":"旧版通用 v1 账户"},{"l":"B","t":"S"},{"l":"C","t":"仅 BlobStorage 专用账户"},{"l":"D","t":"文件共享专用高级账户"}],"a":["B"],"e":"**正确答案：B。** StorageV2 通用 v2 账户。\n\n**为什么对：** 通用 v2 覆盖 Blob、文件、队列、表并支持层级与生命周期策略，是新账户的默认选型。关联考点：官方技能点 2.2.1「创建并配置存储账户」，内容领域 2。\n\n**其他选项为什么错：**\n- A：旧版通用 v1 账户。v1 不支持完整的层级与生命周期能力，属于应迁移的历史形态。\n- C：仅 BlobStorage 专用账户。该形态能力受限，新建场景已不推荐。\n- D：文件共享专用高级账户。高级文件账户面向文件共享性能，不提供 Blob 层级。\n\n**关键概念：** 账户类型决定可用能力集，选型错了后面功能补不回来。本题对应考纲 2.2.1。","s":"自编·2.2.1"},{"id":"D2-007","d":2,"t":"single","q":"某业务要求单区域遭遇故障时数据仍可写，且接受跨区域异步复制带来的少量延迟，应选","o":[{"l":"A","t":"异"},{"l":"B","t":"本地冗余 LRS"},{"l":"C","t":"区域冗余 ZRS"},{"l":"D","t":"只读异地冗余 RA-GRS 的只读端点"}],"a":["A"],"e":"**正确答案：A。** 异地冗余存储 GRS 或异地区域冗余 GRS 的配对区域模型。\n\n**为什么对：** GRS 把数据异步复制到配对区域，故障转移后可恢复写入，代价是复制延迟与切换流程。关联考点：官方技能点 2.2.2「配置存储冗余」，内容领域 2。\n\n**其他选项为什么错：**\n- B：本地冗余 LRS。LRS 只在单数据中心内多副本，区域内故障时无法保证可用。\n- C：区域冗余 ZRS。ZRS 跨同区域可用区，能扛机房故障但不扛整个区域故障。\n- D：只读异地冗余 RA-GRS 的只读端点。只读端点不允许写入，不满足仍可写的要求。\n\n**关键概念：** 冗余选项的差别在于故障域范围与是否可读可写，先定业务能扛哪种故障。本题对应考纲 2.2.2。","s":"自编·2.2.2"},{"id":"D2-008","d":2,"t":"multiple","q":"关于存储冗余，下列说法哪些正确","o":[{"l":"A","t":"GRS 在配对区域提供同步写入副本"},{"l":"B","t":"RA-GRS 允许客户端直接向配对区域写入"},{"l":"C","t":"Z"},{"l":"D","t":"启用 GRS 后可随时手动切换且保证零数据丢失"},{"l":"E","t":"L"},{"l":"F","t":"ZRS 等于跨区域容灾"}],"a":["C","E"],"e":"**正确答案：C、E。** ZRS 在同一区域的多个可用区同步保存副本；LRS 的副本范围最小、成本也最低。\n\n**为什么对：** 冗余级别按副本所在的故障域划分，跨区复制必然面对异步与 RPO 取舍。关联考点：官方技能点 2.2.2「配置存储冗余」，内容领域 2。\n\n**其他选项为什么错：**\n- A：GRS 在配对区域提供同步写入副本。跨区域复制是异步的，同步说法不成立。\n- B：RA-GRS 允许客户端直接向配对区域写入。它只额外提供只读端点，写入仍走主区域。\n- D：启用 GRS 后可随时手动切换且保证零数据丢失。故障转移涉及账户级流程，异步复制下可能有数据损失。\n- F：ZRS 等于跨区域容灾。可用区在同一区域内，区域级灾难不在其覆盖范围。\n\n**关键概念：** 把副本位置、复制方式、可读可写三件事分开看，选型才不会混淆。本题对应考纲 2.2.2。","s":"自编·2.2.2"},{"id":"D2-009","d":2,"t":"single","q":"要求把源账户容器里的新增 Blob 自动复制到另一区域的账户，应配置","o":[{"l":"A","t":"启用存储账户的异地冗余"},{"l":"B","t":"配置 Blob 生命周期策略"},{"l":"C","t":"对"},{"l":"D","t":"给目标容器生成 SAS"}],"a":["C"],"e":"**正确答案：C。** 对象复制规则并指定源与目标容器及复制范围。\n\n**为什么对：** 对象复制按容器对与规则异步复制 Blob 内容，且要求两个账户都开启版本控制等前置条件。关联考点：官方技能点 2.2.3「配置对象复制」，内容领域 2。\n\n**其他选项为什么错：**\n- A：启用存储账户的异地冗余。异地冗余是同一账户的底层副本，不是跨账户按容器复制。\n- B：配置 Blob 生命周期策略。生命周期管过期与层级转换，不负责跨账户复制。\n- D：给目标容器生成 SAS。SAS 只是访问凭证，不会触发任何数据搬运。\n\n**关键概念：** 对象复制是账户间数据流动，冗余是账户内副本，两者层级不同。本题对应考纲 2.2.3。","s":"自编·2.2.3"},{"id":"D2-010","d":2,"t":"single","q":"公司要求用自己的密钥加密存储账户，且密钥要放在受控密钥库中，应配置","o":[{"l":"A","t":"平台管理的密钥"},{"l":"B","t":"客"},{"l":"C","t":"仅在传输层启用 TLS"},{"l":"D","t":"给容器加只读锁"}],"a":["B"],"e":"**正确答案：B。** 客户管理的密钥并关联到密钥保管库。\n\n**为什么对：** 客户管理密钥把密钥保管、轮换与撤销交给客户，需密钥库与身份授权配合。关联考点：官方技能点 2.2.4「配置存储账户加密」，内容领域 2。\n\n**其他选项为什么错：**\n- A：平台管理的密钥。平台托管密钥由服务侧管理，客户无法控制密钥生命周期。\n- C：仅在传输层启用 TLS。TLS 只保护传输过程，不改变静态加密的密钥归属。\n- D：给容器加只读锁。资源锁不影响加密体系。\n\n**关键概念：** 静态加密默认就开，选的是密钥由谁管而不是要不要加密。本题对应考纲 2.2.4。","s":"自编·2.2.4"},{"id":"D2-011","d":2,"t":"single","q":"要把本地大批量文件可靠复制到 Blob 容器并支持断点续传，首选工具是","o":[{"l":"A","t":"A"},{"l":"B","t":"存储资源管理器手动拖拽"},{"l":"C","t":"浏览器里逐个上传"},{"l":"D","t":"用 SAS 生成下载链接"}],"a":["A"],"e":"**正确答案：A。** AzCopy。\n\n**为什么对：** AzCopy 面向批量与脚本化传输，支持续传、并行与大规模数据搬移。关联考点：官方技能点 2.2.5「用存储资源管理器与 AzCopy 管理数据」，内容领域 2。\n\n**其他选项为什么错：**\n- B：存储资源管理器手动拖拽。适合少量交互式操作，缺少脚本化与可靠续传能力。\n- C：浏览器里逐个上传。无批量与续传能力，且受会话稳定性影响。\n- D：用 SAS 生成下载链接。SAS 是授权凭证，不执行复制。\n\n**关键概念：** 工具选型看批量、可重入与可脚本化三项。本题对应考纲 2.2.5。","s":"自编·2.2.5"},{"id":"D2-012","d":2,"t":"single","q":"要创建可供多台 Windows 虚拟机通过 SMB 同时挂载的共享目录，应使用","o":[{"l":"A","t":"Blob 容器"},{"l":"B","t":"托管磁盘"},{"l":"C","t":"队列存储"},{"l":"D","t":"A"}],"a":["D"],"e":"**正确答案：D。** Azure 文件共享。\n\n**为什么对：** Azure 文件提供标准 SMB 共享，可被多台机器同时挂载并按身份授权。关联考点：官方技能点 2.3.1「创建并配置文件共享」，内容领域 2。\n\n**其他选项为什么错：**\n- A：Blob 容器。Blob 是对象存储，不提供 SMB 文件协议挂载。\n- B：托管磁盘。托管磁盘只能挂到单台虚拟机，不是共享文件系统。\n- C：队列存储。队列是消息服务，与文件共享无关。\n\n**关键概念：** 协议决定用法，SMB 共享与对象存储不能互换。本题对应考纲 2.3.1。","s":"自编·2.3.1"},{"id":"D2-013","d":2,"t":"single","q":"应用要求上传的报表通过 HTTPS 匿名直读，但不允许列出容器内全部文件，应配置","o":[{"l":"A","t":"容器级匿名读取"},{"l":"B","t":"保持私有并给每个用户发 SAS"},{"l":"C","t":"容"},{"l":"D","t":"启用存储账户防火墙放行全部公网"}],"a":["C"],"e":"**正确答案：C。** 容器公共访问级别设为 Blob 级只放行对象匿名读取。\n\n**为什么对：** 匿名访问级别分私有、Blob 级与容器级，Blob 级只开放已知 URL 的对象读取。关联考点：官方技能点 2.3.2「创建并配置容器」，内容领域 2。\n\n**其他选项为什么错：**\n- A：容器级匿名读取。容器级会额外允许枚举容器内容，超出不允许列出的要求。\n- B：保持私有并给每个用户发 SAS。能满足安全但不符合匿名直读的题干目标。\n- D：启用存储账户防火墙放行全部公网。防火墙放行不等于授予匿名数据面权限。\n\n**关键概念：** 公开粒度决定暴露面，能只开对象就不要开容器。本题对应考纲 2.3.2。","s":"自编·2.3.2"},{"id":"D2-014","d":2,"t":"single","q":"访问频率逐月下降的日志 Blob 要自动降本，且超过一年自动删除，应配置","o":[{"l":"A","t":"手动每月把 Blob 下载后重新上传"},{"l":"B","t":"B"},{"l":"C","t":"启用 Blob 版本控制"},{"l":"D","t":"把账户冗余换成 LRS"}],"a":["B"],"e":"**正确答案：B。** Blob 生命周期管理策略按最后修改时间转冷层并在到期后删除。\n\n**为什么对：** 生命周期策略按条件自动做层级转换与删除，是访问频度衰减场景的标准手段。关联考点：官方技能点 2.3.3「配置存储层级」，内容领域 2。\n\n**其他选项为什么错：**\n- A：手动每月把 Blob 下载后重新上传。手工操作不可持续，也不会自动删除。\n- C：启用 Blob 版本控制。版本控制保留历史版本，反而会增加存储量。\n- D：把账户冗余换成 LRS。冗余级别影响副本数与可用性，不改变访问层级。\n\n**关键概念：** 层级与过期都由策略驱动，不需要改应用代码。本题对应考纲 2.3.3。","s":"自编·2.3.3"},{"id":"D2-015","d":2,"t":"single","q":"公司希望误删的 Blob 能在保留期内找回，且不依赖手动备份，应启用","o":[{"l":"A","t":"B"},{"l":"B","t":"只启用 Blob 版本控制"},{"l":"C","t":"给容器加 CanNotDelete 锁"},{"l":"D","t":"启用对象复制"}],"a":["A"],"e":"**正确答案：A。** Blob 软删除并设置足够保留期。\n\n**为什么对：** 软删除在保留期内保留已删除对象与快照，可在期限内恢复，是数据面防误删能力。关联考点：官方技能点 2.3.5「配置 Blob 生命周期管理」，内容领域 2。\n\n**其他选项为什么错：**\n- B：只启用 Blob 版本控制。版本控制保留覆盖产生的新版本，对删除场景需配合软删除。\n- C：给容器加 CanNotDelete 锁。资源锁作用在容器资源上，不保护容器内单个对象的删除。\n- D：启用对象复制。复制用于跨账户搬运，不是本地误删恢复机制。\n\n**关键概念：** 资源锁防资源被删，软删除防容器内数据被删，作用层不同。本题对应考纲 2.3.5。","s":"自编·2.3.5"},{"id":"D2-016","d":2,"t":"single","q":"应用要求覆盖写入后仍能取回任意历史版本，应启用","o":[{"l":"A","t":"Blob 软删除"},{"l":"B","t":"文件共享快照"},{"l":"C","t":"生命周期策略的层级转换"},{"l":"D","t":"B"}],"a":["D"],"e":"**正确答案：D。** Blob 版本控制。\n\n**为什么对：** 版本控制在每次写入时自动保留先前版本，可显式列举与读取指定版本。关联考点：官方技能点 2.3.6「配置 Blob 版本控制」，内容领域 2。\n\n**其他选项为什么错：**\n- A：Blob 软删除。软删除主要覆盖删除与覆盖场景的恢复窗口，但不提供按版本显式列举与读取。\n- B：文件共享快照。快照面向 Azure 文件共享，不是 Blob 容器。\n- C：生命周期策略的层级转换。层级转换只改存储层，不保留历史内容。\n\n**关键概念：** 软删除讲能恢复，版本控制讲能按版本访问，两者可叠加。本题对应考纲 2.3.6。","s":"自编·2.3.6"},{"id":"D2-017","d":2,"t":"single","q":"管理员发现共享里的文件被误改，希望回滚到昨天状态，应先检查","o":[{"l":"A","t":"Blob 版本控制设置"},{"l":"B","t":"存储账户访问密钥是否轮换"},{"l":"C","t":"是"},{"l":"D","t":"订阅的预算告警"}],"a":["C"],"e":"**正确答案：C。** 是否已创建文件共享快照并从快照恢复。\n\n**为什么对：** 文件共享快照是共享级的时间点副本，可按共享恢复文件内容。关联考点：官方技能点 2.3.4「配置文件共享快照与软删除」，内容领域 2。\n\n**其他选项为什么错：**\n- A：Blob 版本控制设置。该能力作用于 Blob 容器，不是 Azure 文件共享。\n- B：存储账户访问密钥是否轮换。密钥轮换与文件内容历史无关。\n- D：订阅的预算告警。预算与文件版本历史没有任何关系。\n\n**关键概念：** 不同存储服务各有自己的时间点恢复机制，先看清用的是哪一种。本题对应考纲 2.3.4。","s":"自编·2.3.4"},{"id":"D2-018","d":2,"t":"multiple","q":"要让存储账户只接受来自指定子网的流量，需要同时做对哪些事","o":[{"l":"A","t":"在"},{"l":"B","t":"把访问密钥轮换一次"},{"l":"C","t":"把容器公共访问级别改为私有"},{"l":"D","t":"给订阅加资源锁"},{"l":"E","t":"在"},{"l":"F","t":"仅启用 Blob 软删除"}],"a":["A","E"],"e":"**正确答案：A、E。** 在子网启用存储服务终结点或使用专用终结点；在存储账户防火墙放行该子网。\n\n**为什么对：** 网络可达性由终结点与防火墙共同决定，凭证与数据保护是另外两层。关联考点：官方技能点 2.1.1「配置存储防火墙与虚拟网络」，内容领域 2。\n\n**其他选项为什么错：**\n- B：把访问密钥轮换一次。轮换密钥改变凭证，不影响网络来源判定。\n- C：把容器公共访问级别改为私有。公开级别影响匿名读取，不能替代网络边界控制。\n- D：给订阅加资源锁。资源锁防误删，不参与网络访问控制。\n- F：仅启用 Blob 软删除。软删除是数据保护能力，与网络边界无关。\n\n**关键概念：** 先定从哪连，再定凭什么访问，最后才考虑数据怎么保。本题对应考纲 2.1.1。","s":"自编·2.1.1"},{"id":"D2-019","d":2,"t":"single","q":"某应用要求同区域内可用区故障时不丢数据且成本尽量低，在满足可用区级冗余的前提下应选","o":[{"l":"A","t":"区"},{"l":"B","t":"异地冗余 GRS"},{"l":"C","t":"本地冗余 LRS"},{"l":"D","t":"只读异地冗余 RA-GRS"}],"a":["A"],"e":"**正确答案：A。** 区域冗余 ZRS。\n\n**为什么对：** ZRS 在同区域多个可用区同步放副本，覆盖可用区级故障且比跨区域方案省。关联考点：官方技能点 2.2.2「配置存储冗余」，内容领域 2。\n\n**其他选项为什么错：**\n- B：异地冗余 GRS。跨区域复制成本更高，题干只要求扛可用区故障。\n- C：本地冗余 LRS。LRS 只在单设施内保留副本，不覆盖可用区故障。\n- D：只读异地冗余 RA-GRS。多出的只读端点与跨区域复制都超出需求。\n\n**关键概念：** 按故障域逐级付费，需求只到可用区就不必买区域级容灾。本题对应考纲 2.2.2。","s":"自编·2.2.2"},{"id":"D3-001","d":3,"t":"single","q":"拿到一份 Bicep 文件，管理员要确认它会创建哪些资源与依赖顺序，最直接的判断依据是","o":[{"l":"A","t":"看文件名长度"},{"l":"B","t":"查看订阅的预算告警"},{"l":"C","t":"读"},{"l":"D","t":"检查目标资源组是否有资源锁"}],"a":["C"],"e":"**正确答案：C。** 读取 resource 声明、参数与 dependsOn 或隐式引用关系。\n\n**为什么对：** Bicep 里 resource 声明定义资源类型与属性，依赖关系由显式 dependsOn 或属性引用推导。关联考点：官方技能点 3.1.1「解读 ARM 模板或 Bicep 文件」，内容领域 3。\n\n**其他选项为什么错：**\n- A：看文件名长度。文件名不承载任何部署语义。\n- B：查看订阅的预算告警。预算与模板内容解析无关。\n- D：检查目标资源组是否有资源锁。资源锁影响部署能否执行，不说明模板要建什么。\n\n**关键概念：** 读模板先读声明与引用，再判断部署图。本题对应考纲 3.1.1。","s":"自编·3.1.1"},{"id":"D3-002","d":3,"t":"single","q":"要在现有 ARM 模板里把硬编码的虚拟机规格改为部署时传入，应修改","o":[{"l":"A","t":"variables 段"},{"l":"B","t":"p"},{"l":"C","t":"outputs 段"},{"l":"D","t":"模板的 apiVersion"}],"a":["B"],"e":"**正确答案：B。** parameters 段并在资源属性里引用该参数。\n\n**为什么对：** 参数负责外部输入，变量负责内部复用，输出负责回传结果，三者职责固定。关联考点：官方技能点 3.1.2「修改现有 ARM 模板」，内容领域 3。\n\n**其他选项为什么错：**\n- A：variables 段。变量在模板内计算，部署时不能从外部传入。\n- C：outputs 段。输出段只回传部署结果，不接收输入。\n- D：模板的 apiVersion。版本号声明资源提供程序接口，与参数化无关。\n\n**关键概念：** 把可变值提成参数是模板复用的第一步。本题对应考纲 3.1.2。","s":"自编·3.1.2"},{"id":"D3-003","d":3,"t":"single","q":"把一段现有 ARM JSON 迁移成 Bicep，最快且可验证的起点是","o":[{"l":"A","t":"用"},{"l":"B","t":"手工逐行重写全部 resource 声明"},{"l":"C","t":"直接把 json 文件改后缀为 bicep"},{"l":"D","t":"删除模板改用门户点击"}],"a":["A"],"e":"**正确答案：A。** 用 az bicep decompile 反向生成再人工校订。\n\n**为什么对：** 反编译工具给出等价骨架，复杂表达式与条件仍需人工复核。关联考点：官方技能点 3.1.3「修改现有 Bicep 文件」，内容领域 3。\n\n**其他选项为什么错：**\n- B：手工逐行重写全部 resource 声明。可行但慢，且容易漏掉条件与依赖。\n- C：直接把 json 文件改后缀为 bicep。两者语法不同，改后缀不会转换内容。\n- D：删除模板改用门户点击。放弃了基础设施即代码的可重复性与留痕。\n\n**关键概念：** 工具负责骨架，人负责语义，迁移不等于自动完成。本题对应考纲 3.1.3。","s":"自编·3.1.3"},{"id":"D3-004","d":3,"t":"single","q":"要把一份 Bicep 文件部署到指定资源组并先预览变更，应使用","o":[{"l":"A","t":"直接 az deployment group create 并靠回滚处理"},{"l":"B","t":"把文件上传到存储账户"},{"l":"C","t":"在门户逐个创建同名资源"},{"l":"D","t":"a"}],"a":["D"],"e":"**正确答案：D。** az deployment group what-if 后再执行 create。\n\n**为什么对：** what-if 在不改动资源的前提下报告将发生的增删改，是部署前的标准检查。关联考点：官方技能点 3.1.4「用模板或 Bicep 部署资源」，内容领域 3。\n\n**其他选项为什么错：**\n- A：直接 az deployment group create 并靠回滚处理。直接创建没有预览，问题只能在部署后暴露。\n- B：把文件上传到存储账户。上传只是存放，不触发任何部署。\n- C：在门户逐个创建同名资源。手工创建不受模板管控，还会造成配置漂移。\n\n**关键概念：** 先预览再落盘，是 IaC 的基本安全动作。本题对应考纲 3.1.4。","s":"自编·3.1.4"},{"id":"D3-005","d":3,"t":"single","q":"管理员要把一次成功部署导出成可复用模板，应优先使用","o":[{"l":"A","t":"从活动日志里复制请求正文"},{"l":"B","t":"在门户里重新点一遍并录屏"},{"l":"C","t":"导"},{"l":"D","t":"直接复制现有资源的属性页"}],"a":["C"],"e":"**正确答案：C。** 导出部署所用模板并按需转成 Bicep。\n\n**为什么对：** 导出模板拿到的就是当时提交的部署定义，再反编译成 Bicep 便于后续维护。关联考点：官方技能点 3.1.5「导出部署或把模板转成 Bicep」，内容领域 3。\n\n**其他选项为什么错：**\n- A：从活动日志里复制请求正文。活动日志记操作与状态，不含完整可复用模板定义。\n- B：在门户里重新点一遍并录屏。录屏无法还原属性与依赖，且不可重放。\n- D：直接复制现有资源的属性页。属性页只展示当前状态，不等于部署定义。\n\n**关键概念：** 从部署记录回抽定义，比从运行时状态反推更可靠。本题对应考纲 3.1.5。","s":"自编·3.1.5"},{"id":"D3-006","d":3,"t":"single","q":"创建虚拟机时要求磁盘具备高可用且托管生命周期由平台负责，应选择","o":[{"l":"A","t":"把 VHD 放在存储账户里做非托管磁盘"},{"l":"B","t":"托"},{"l":"C","t":"使用临时 OS 磁盘存放数据库文件"},{"l":"D","t":"只配置可用性集不配磁盘"}],"a":["B"],"e":"**正确答案：B。** 托管磁盘。\n\n**为什么对：** 托管磁盘由平台处理存储账户、副本与扩展，是新建虚拟机的默认选择。关联考点：官方技能点 3.2.1「创建虚拟机」，内容领域 3。\n\n**其他选项为什么错：**\n- A：把 VHD 放在存储账户里做非托管磁盘。非托管磁盘要自己管存储账户与页 Blob，已不推荐。\n- C：使用临时 OS 磁盘存放数据库文件。临时盘不持久，不适合有状态数据。\n- D：只配置可用性集不配磁盘。可用性集管的是虚拟机分布，不改变磁盘形态。\n\n**关键概念：** 磁盘形态决定运维责任，可用性集决定实例分布，两件事分开配。本题对应考纲 3.2.1。","s":"自编·3.2.1"},{"id":"D3-007","d":3,"t":"single","q":"要求虚拟机 OS 与数据盘静态加密且密钥由公司控制，应配置","o":[{"l":"A","t":"A"},{"l":"B","t":"只启用传输层 TLS"},{"l":"C","t":"给虚拟机加只读资源锁"},{"l":"D","t":"把磁盘设为只读访问模式"}],"a":["A"],"e":"**正确答案：A。** Azure 磁盘加密或带客户管理密钥的加密集。\n\n**为什么对：** 磁盘加密可结合密钥保管库使用客户管理密钥，密钥轮换与撤销由客户掌握。关联考点：官方技能点 3.2.2「配置 Azure 磁盘加密」，内容领域 3。\n\n**其他选项为什么错：**\n- B：只启用传输层 TLS。TLS 保护网络传输，不涉及磁盘静态加密。\n- C：给虚拟机加只读资源锁。资源锁限制管理操作，不提供加密能力。\n- D：把磁盘设为只读访问模式。主机缓存模式影响性能，与加密无关。\n\n**关键概念：** 加密默认开，客户管理密钥才是把控制权拿回来的那一步。本题对应考纲 3.2.2。","s":"自编·3.2.2"},{"id":"D3-008","d":3,"t":"single","q":"要把虚拟机从订阅 A 迁到订阅 B，迁移前必须确认","o":[{"l":"A","t":"两台虚拟机规格完全一致"},{"l":"B","t":"目标订阅名称不能含中文"},{"l":"C","t":"先删除虚拟机所有数据磁盘"},{"l":"D","t":"资"}],"a":["D"],"e":"**正确答案：D。** 资源移动支持该类型且目标订阅内依赖资源可一并处理。\n\n**为什么对：** 跨订阅移动要核对资源提供程序、依赖项、区域与权限，部分资源还需专门迁移工具。关联考点：官方技能点 3.2.3「把虚拟机搬到别的资源组、订阅或区域」，内容领域 3。\n\n**其他选项为什么错：**\n- A：两台虚拟机规格完全一致。规格与目标订阅迁移可行性无关。\n- B：目标订阅名称不能含中文。命名习惯不影响平台迁移规则。\n- C：先删除虚拟机所有数据磁盘。删盘会丢数据，且不是迁移前置条件。\n\n**关键概念：** 移动不是搬文件，是把资源注册与依赖一起换到新边界。本题对应考纲 3.2.3。","s":"自编·3.2.3"},{"id":"D3-009","d":3,"t":"single","q":"业务高峰时虚拟机 CPU 持续饱和，需要提升处理能力，正确做法是","o":[{"l":"A","t":"直接增加托管磁盘容量"},{"l":"B","t":"给虚拟机加第二个网卡"},{"l":"C","t":"调"},{"l":"D","t":"把虚拟机移到另一个资源组"}],"a":["C"],"e":"**正确答案：C。** 调整虚拟机规格并按需重启使新规格生效。\n\n**为什么对：** 规格变更调整的是计算资源配额，通常需要停机重启才能生效。关联考点：官方技能点 3.2.4「管理虚拟机规格」，内容领域 3。\n\n**其他选项为什么错：**\n- A：直接增加托管磁盘容量。磁盘容量只影响存储，不增加计算能力。\n- B：给虚拟机加第二个网卡。网卡扩展的是网络吞吐，不改变 CPU 与内存。\n- D：把虚拟机移到另一个资源组。换资源组只改逻辑归属，不改规格。\n\n**关键概念：** 纵向扩容改规格，横向扩容加实例，别把两者混为一谈。本题对应考纲 3.2.4。","s":"自编·3.2.4"},{"id":"D3-010","d":3,"t":"single","q":"要给现有虚拟机新增一块数据盘并让系统识别，完整动作是","o":[{"l":"A","t":"只把磁盘附加到虚拟机"},{"l":"B","t":"附"},{"l":"C","t":"在存储账户里新建一个 Blob 容器"},{"l":"D","t":"修改虚拟机的可用性集"}],"a":["B"],"e":"**正确答案：B。** 附加托管磁盘后在操作系统内初始化并挂载。\n\n**为什么对：** 平台侧附加与来宾系统内初始化是两个独立步骤，缺一步盘就不可用。关联考点：官方技能点 3.2.5「管理虚拟机磁盘」，内容领域 3。\n\n**其他选项为什么错：**\n- A：只把磁盘附加到虚拟机。附加只是把盘挂到实例，操作系统内仍需分区与格式化。\n- C：在存储账户里新建一个 Blob 容器。容器属于对象存储，不是虚拟机磁盘。\n- D：修改虚拟机的可用性集。可用性集与磁盘挂载无关。\n\n**关键概念：** 挂载与可用是两件事，验证要看操作系统里能不能读写。本题对应考纲 3.2.5。","s":"自编·3.2.5"},{"id":"D3-011","d":3,"t":"multiple","q":"关于可用区与可用性集，下列说法哪些正确","o":[{"l":"A","t":"可用性集可抵御整个区域断电"},{"l":"B","t":"可用区部署仍必须同时配置可用性集"},{"l":"C","t":"可"},{"l":"D","t":"把两台虚拟机放在同一容错域即可获得最高可用性"},{"l":"E","t":"规模集只能用于无状态应用且不能配可用区"},{"l":"F","t":"可"}],"a":["C","F"],"e":"**正确答案：C、F。** 可用区把实例分散到同区域独立物理位置；可用性集把实例分散到不同容错域与更新域。\n\n**为什么对：** 可用区按区域内物理位置隔离，可用性集按机架与维护域隔离。关联考点：官方技能点 3.2.6「把虚拟机部署到可用区和可用性集」，内容领域 3。\n\n**其他选项为什么错：**\n- A：可用性集可抵御整个区域断电。可用性集的作用域在单个数据中心内，不覆盖区域级故障。\n- B：可用区部署仍必须同时配置可用性集。可用区方案本身已提供物理隔离，无需叠加可用性集。\n- D：把两台虚拟机放在同一容错域即可获得最高可用性。同一容错域共享故障边界，反而失去分散意义。\n- E：规模集只能用于无状态应用且不能配可用区。规模集支持跨可用区部署，也不限定应用是否有状态。\n\n**关键概念：** 先分清故障域是区域级还是设施级，再选分布机制。本题对应考纲 3.2.6。","s":"自编·3.2.6"},{"id":"D3-012","d":3,"t":"single","q":"要按 CPU 阈值自动增减虚拟机实例数，且实例配置完全一致，应采用","o":[{"l":"A","t":"给单台虚拟机配置更大的规格"},{"l":"B","t":"手工在高峰前复制虚拟机"},{"l":"C","t":"用负载均衡器的健康检查"},{"l":"D","t":"虚"}],"a":["D"],"e":"**正确答案：D。** 虚拟机规模集配合自动缩放规则。\n\n**为什么对：** 规模集管理一组同构实例，自动缩放按指标触发实例数变化。关联考点：官方技能点 3.2.7「部署并配置虚拟机规模集」，内容领域 3。\n\n**其他选项为什么错：**\n- A：给单台虚拟机配置更大的规格。这是纵向扩容，实例数始终是一台。\n- B：手工在高峰前复制虚拟机。人工操作无法按指标实时伸缩且易漂移。\n- C：用负载均衡器的健康检查。健康检查只判定后端可用性，不创建实例。\n\n**关键概念：** 自动缩放的前提是实例同构，规模集正好提供这个前提。本题对应考纲 3.2.7。","s":"自编·3.2.7"},{"id":"D3-013","d":3,"t":"single","q":"公司要托管自有容器镜像并对推送拉取做身份鉴权，应使用","o":[{"l":"A","t":"Blob 容器存放镜像 tar 包"},{"l":"B","t":"容器实例直接挂载本地目录"},{"l":"C","t":"A"},{"l":"D","t":"存储账户的静态网站托管"}],"a":["C"],"e":"**正确答案：C。** Azure 容器注册表 ACR。\n\n**为什么对：** ACR 提供镜像仓库、版本标签、扫描与基于身份的推拉权限。关联考点：官方技能点 3.3.1「创建和管理容器注册表」，内容领域 3。\n\n**其他选项为什么错：**\n- A：Blob 容器存放镜像 tar 包。可以放文件但没有镜像层管理、清单与镜像级鉴权。\n- B：容器实例直接挂载本地目录。容器实例是运行态，不提供镜像仓库能力。\n- D：存储账户的静态网站托管。静态网站服务 HTTP 内容，不是镜像注册表。\n\n**关键概念：** 注册表管镜像资产，运行时管容器实例，两者职责不同。本题对应考纲 3.3.1。","s":"自编·3.3.1"},{"id":"D3-014","d":3,"t":"single","q":"要快速跑一个短时批处理容器且不想管理虚拟机或编排平台，应选","o":[{"l":"A","t":"新建虚拟机再手工装容器运行时"},{"l":"B","t":"A"},{"l":"C","t":"部署完整 Kubernetes 集群"},{"l":"D","t":"用应用服务的自定义容器"}],"a":["B"],"e":"**正确答案：B。** Azure 容器实例 ACI。\n\n**为什么对：** ACI 直接按容器启动计费，无需管理底层主机与编排控制面。关联考点：官方技能点 3.3.2「用容器实例预配容器」，内容领域 3。\n\n**其他选项为什么错：**\n- A：新建虚拟机再手工装容器运行时。要自己管操作系统与运行时，违背免运维目标。\n- C：部署完整 Kubernetes 集群。集群能力远超单个短任务，运维成本更高。\n- D：用应用服务的自定义容器。应用服务面向常驻 Web 应用，不是一次性任务的首选。\n\n**关键概念：** 按任务时长与运维意愿选运行时，越短越轻越适合 ACI。本题对应考纲 3.3.2。","s":"自编·3.3.2"},{"id":"D3-015","d":3,"t":"single","q":"要运行带 HTTP 自动伸缩、流量切分与修订版本管理的容器化 Web 服务，应选","o":[{"l":"A","t":"A"},{"l":"B","t":"容器实例 ACI"},{"l":"C","t":"虚拟机上手工跑 Docker"},{"l":"D","t":"Blob 静态网站"}],"a":["A"],"e":"**正确答案：A。** Azure 容器应用。\n\n**为什么对：** 容器应用把无服务器弹性、修订与入口流量管理打包给容器化服务。关联考点：官方技能点 3.3.3「用容器应用预配容器」，内容领域 3。\n\n**其他选项为什么错：**\n- B：容器实例 ACI。ACI 不提供内建的修订、流量切分与基于请求的弹性。\n- C：虚拟机上手工跑 Docker。缺少平台级扩缩与版本治理能力。\n- D：Blob 静态网站。静态网站只能托管静态文件，无法运行容器。\n\n**关键概念：** 有请求驱动与版本治理需求时，就从容器实例升级到容器应用。本题对应考纲 3.3.3。","s":"自编·3.3.3"},{"id":"D3-016","d":3,"t":"single","q":"容器应用实例的副本数需要随 HTTP 并发量自动变化，应配置","o":[{"l":"A","t":"仅设置固定最小副本数"},{"l":"B","t":"调整容器镜像大小"},{"l":"C","t":"给注册表加只读锁"},{"l":"D","t":"基"}],"a":["D"],"e":"**正确答案：D。** 基于 HTTP 并发或请求数的缩放规则。\n\n**为什么对：** 缩放规则定义触发指标与副本上下限，平台据此增删实例。关联考点：官方技能点 3.3.4「管理容器的规模与缩放」，内容领域 3。\n\n**其他选项为什么错：**\n- A：仅设置固定最小副本数。固定副本无法随并发变化。\n- B：调整容器镜像大小。镜像体积影响拉取时间，不决定扩缩行为。\n- C：给注册表加只读锁。资源锁与运行时弹性无关。\n\n**关键概念：** 扩缩看指标与边界，不看镜像或仓库配置。本题对应考纲 3.3.4。","s":"自编·3.3.4"},{"id":"D3-017","d":3,"t":"single","q":"多个 Web 应用要共享同一组计算资源并按应用隔离配置，应先规划","o":[{"l":"A","t":"把每个应用放进独立订阅"},{"l":"B","t":"为每个应用建独立虚拟网络"},{"l":"C","t":"应"},{"l":"D","t":"给应用服务启用 Blob 静态网站"}],"a":["C"],"e":"**正确答案：C。** 应用服务计划及其定价层。\n\n**为什么对：** 应用服务计划定义底层计算规格与层级，同一计划内的应用共享这组资源。关联考点：官方技能点 3.4.1「预配应用服务计划」，内容领域 3。\n\n**其他选项为什么错：**\n- A：把每个应用放进独立订阅。拆订阅能隔离账单，但不解决同组计算资源共享。\n- B：为每个应用建独立虚拟网络。网络隔离与计算资源池不是一层概念。\n- D：给应用服务启用 Blob 静态网站。静态网站是另一种托管形态，不提供应用计算。\n\n**关键概念：** 计划决定算力和可用能力，应用只是跑在计划里的单元。本题对应考纲 3.4.1。","s":"自编·3.4.1"},{"id":"D3-018","d":3,"t":"single","q":"业务希望工作日高峰自动增加实例、夜间缩减，应配置","o":[{"l":"A","t":"手工在高峰前改定价层"},{"l":"B","t":"基"},{"l":"C","t":"启用部署槽"},{"l":"D","t":"增加应用服务的自定义域名"}],"a":["B"],"e":"**正确答案：B。** 基于指标的自动缩放规则并设实例上下限。\n\n**为什么对：** 自动缩放按指标与实例边界增删实例，定价层决定可用规格与能力上限。关联考点：官方技能点 3.4.2「为计划配置缩放」，内容领域 3。\n\n**其他选项为什么错：**\n- A：手工在高峰前改定价层。改层是纵向调整且需人工介入，不能按时间自动往返。\n- C：启用部署槽。部署槽用于版本切换，不产生按指标的实例伸缩。\n- D：增加应用服务的自定义域名。域名只影响访问入口，与实例数无关。\n\n**关键概念：** 自动伸缩改实例数，纵向升级改规格，是两条不同路径。本题对应考纲 3.4.2。","s":"自编·3.4.2"},{"id":"D3-019","d":3,"t":"single","q":"要在应用服务上发布一个 Node.js Web 应用并保留部署历史，最合适的起点是","o":[{"l":"A","t":"创"},{"l":"B","t":"只建一个空资源组"},{"l":"C","t":"在虚拟机里手工启动 node 进程"},{"l":"D","t":"创建存储账户并上传源码"}],"a":["A"],"e":"**正确答案：A。** 创建应用服务并配置部署源与运行时堆栈。\n\n**为什么对：** 应用服务提供运行时堆栈、部署集成与站点配置，创建后接好部署源即可发布。关联考点：官方技能点 3.4.3「创建应用服务」，内容领域 3。\n\n**其他选项为什么错：**\n- B：只建一个空资源组。资源组只是容器，不含应用运行所需的计算与配置。\n- C：在虚拟机里手工启动 node 进程。绕开平台能力，还需自管补丁与进程守护。\n- D：创建存储账户并上传源码。上传源码不会编译、不会启动，也不形成可访问站点。\n\n**关键概念：** 平台服务把运行时与部署链路一起托管，不用自己拼主机。本题对应考纲 3.4.3。","s":"自编·3.4.3"},{"id":"D3-020","d":3,"t":"single","q":"要给应用服务绑定自定义域名并启用 HTTPS，正确顺序是","o":[{"l":"A","t":"先删掉默认域名再绑定"},{"l":"B","t":"只把 DNS 记录指向应用服务不改证书"},{"l":"C","t":"把证书上传到 Blob 容器即可"},{"l":"D","t":"绑"}],"a":["D"],"e":"**正确答案：D。** 绑定域名后配置证书与 TLS 绑定。\n\n**为什么对：** 域名验证、证书导入与 TLS 绑定三步齐全，浏览器才会信任该站点。关联考点：官方技能点 3.4.4「配置证书与 TLS」，内容领域 3。\n\n**其他选项为什么错：**\n- A：先删掉默认域名再绑定。默认域名不影响自定义域名绑定，删除既无必要也不可行。\n- B：只把 DNS 记录指向应用服务不改证书。缺少匹配证书会在 HTTPS 握手时报证书不匹配。\n- C：把证书上传到 Blob 容器即可。证书需要绑定到应用服务并配置 TLS 设置，放在 Blob 不会生效。\n\n**关键概念：** DNS 解决指向谁，证书解决信任谁，缺一不可。本题对应考纲 3.4.4。","s":"自编·3.4.4"},{"id":"D3-021","d":3,"t":"single","q":"把 www.example.com 指向应用服务且希望避免 IP 变更带来的失效，应使用","o":[{"l":"A","t":"把 A 记录写死某个固定 IP"},{"l":"B","t":"只加一条 TXT 记录用于域名验证"},{"l":"C","t":"C"},{"l":"D","t":"把 NS 记录改到 Azure DNS 即可"}],"a":["C"],"e":"**正确答案：C。** CNAME 记录指向应用服务默认域名。\n\n**为什么对：** CNAME 指向平台默认域名，由平台负责其后的地址解析，避免依赖具体 IP。关联考点：官方技能点 3.4.5「把现有自定义 DNS 名称映射到应用服务」，内容领域 3。\n\n**其他选项为什么错：**\n- A：把 A 记录写死某个固定 IP。共享入口 IP 可能变化，写死易失效。\n- B：只加一条 TXT 记录用于域名验证。TXT 只完成验证，不承担流量解析。\n- D：把 NS 记录改到 Azure DNS 即可。改 NS 是托管整个区域，不等于完成主机名映射。\n\n**关键概念：** 域名验证记录与流量解析记录是两类记录，别混用。本题对应考纲 3.4.5。","s":"自编·3.4.5"},{"id":"D3-022","d":3,"t":"single","q":"要为应用服务定期保留可恢复的应用内容与配置副本，应配置","o":[{"l":"A","t":"只启用 Blob 版本控制"},{"l":"B","t":"应"},{"l":"C","t":"给应用服务计划加只读锁"},{"l":"D","t":"把源码压缩包手工存到文件共享"}],"a":["B"],"e":"**正确答案：B。** 应用服务备份并指定存储账户与计划。\n\n**为什么对：** 应用服务备份把站点文件、配置与关联数据库按计划写入存储账户，可按需还原。关联考点：官方技能点 3.4.6「为应用服务配置备份」，内容领域 3。\n\n**其他选项为什么错：**\n- A：只启用 Blob 版本控制。那作用于 Blob 容器，与应用服务备份体系不同。\n- C：给应用服务计划加只读锁。资源锁防误删，不产生定时备份。\n- D：把源码压缩包手工存到文件共享。手工副本不含平台配置与可恢复的备份元数据。\n\n**关键概念：** 备份要覆盖内容与配置，并验证过还原才叫可用。本题对应考纲 3.4.6。","s":"自编·3.4.6"},{"id":"D3-023","d":3,"t":"single","q":"应用服务要只接受来自某虚拟网络子网的入站流量，应配置","o":[{"l":"A","t":"访"},{"l":"B","t":"只改自定义域名"},{"l":"C","t":"把证书换成通配证书"},{"l":"D","t":"给应用服务计划加资源锁"}],"a":["A"],"e":"**正确答案：A。** 访问限制与虚拟网络集成配合子网或服务终结点。\n\n**为什么对：** 入站限制与网络集成分别管谁能访问和如何出站到虚拟网络，需配合设计。关联考点：官方技能点 3.4.7「配置应用服务的网络设置」，内容领域 3。\n\n**其他选项为什么错：**\n- B：只改自定义域名。域名解析不改变入站来源控制。\n- C：把证书换成通配证书。证书解决加密与信任，不限制来源网络。\n- D：给应用服务计划加资源锁。资源锁不参与网络访问控制。\n\n**关键概念：** 入站白名单与出站集成是两个方向，配置时别只做一半。本题对应考纲 3.4.7。","s":"自编·3.4.7"},{"id":"D3-024","d":3,"t":"single","q":"要在不发生产生停机的前提下验证新版本并小流量灰度，应使用","o":[{"l":"A","t":"直接覆盖生产站点文件"},{"l":"B","t":"新建另一个订阅部署新版本"},{"l":"C","t":"停机维护窗口内发布"},{"l":"D","t":"部"}],"a":["D"],"e":"**正确答案：D。** 部署槽配合交换与流量路由。\n\n**为什么对：** 部署槽让新版本先在独立槽预热，再交换或按比例分流，出问题可快速换回。关联考点：官方技能点 3.4.8「配置部署槽」，内容领域 3。\n\n**其他选项为什么错：**\n- A：直接覆盖生产站点文件。覆盖即生效，出问题只能回滚文件，无法灰度。\n- B：新建另一个订阅部署新版本。拆订阅不提供同应用内的版本切换与流量比例。\n- C：停机维护窗口内发布。明确产生停机，不符合题干要求。\n\n**关键概念：** 槽的价值在预热与可回退，交换比重新部署快得多。本题对应考纲 3.4.8。","s":"自编·3.4.8"},{"id":"D3-025","d":3,"t":"multiple","q":"关于应用服务的网络配置，下列说法哪些正确","o":[{"l":"A","t":"启用访问限制会自动打通到虚拟网络内数据库的连接"},{"l":"B","t":"虚"},{"l":"C","t":"把应用设为公共访问就等于完成虚拟网络集成"},{"l":"D","t":"删除应用服务计划会自动保留全部网络配置"},{"l":"E","t":"专用终结点会让应用自动拒绝所有公网入站"},{"l":"F","t":"访"}],"a":["B","F"],"e":"**正确答案：B、F。** 虚拟网络集成主要用于应用出站访问虚拟网络内资源；访问限制用于控制入站来源。\n\n**为什么对：** 入站与出站是两条独立链路，集成、访问限制、专用终结点各管一段。关联考点：官方技能点 3.4.7「配置应用服务的网络设置」，内容领域 3。\n\n**其他选项为什么错：**\n- A：启用访问限制会自动打通到虚拟网络内数据库的连接。出站连通性由集成或专用终结点解决，入站规则不负责出站。\n- C：把应用设为公共访问就等于完成虚拟网络集成。公共访问是默认入口状态，与集成是两回事。\n- D：删除应用服务计划会自动保留全部网络配置。计划承载计算与网络配置，删除后配置随之消失。\n- E：专用终结点会让应用自动拒绝所有公网入站。是否拒绝公网取决于访问限制配置，不能想当然。\n\n**关键概念：** 排查连接问题先定位方向，再找对应配置。本题对应考纲 3.4.7。","s":"自编·3.4.7"},{"id":"D3-026","d":3,"t":"single","q":"同一份 Bicep 要分别部署测试与生产两套参数，最规范的做法是","o":[{"l":"A","t":"为每个环境复制一份 Bicep 并改硬编码值"},{"l":"B","t":"用"},{"l":"C","t":"部署时靠人工在门户里改值"},{"l":"D","t":"把参数写进 outputs 段"}],"a":["B"],"e":"**正确答案：B。** 用参数文件区分环境，模板保持一份。\n\n**为什么对：** 模板描述结构，参数文件描述环境差异，一份模板配多份参数是标准形态。关联考点：官方技能点 3.1.4「用模板或 Bicep 部署资源」，内容领域 3。\n\n**其他选项为什么错：**\n- A：为每个环境复制一份 Bicep 并改硬编码值。复制会产生分叉，改一处要同步多份。\n- C：部署时靠人工在门户里改值。手工改值不可复现，也失去 IaC 的留痕优势。\n- D：把参数写进 outputs 段。输出段只回传结果，不接收外部输入。\n\n**关键概念：** 把差异收敛到参数，才能避免环境间配置漂移。本题对应考纲 3.1.4。","s":"自编·3.1.4"},{"id":"D4-001","d":4,"t":"single","q":"要在虚拟网络内划分 Web 层与数据层并分别施加不同安全规则，应创建","o":[{"l":"A","t":"为每层各建一个虚拟网络"},{"l":"B","t":"只建一个子网用标签区分"},{"l":"C","t":"两"},{"l":"D","t":"用资源组分层"}],"a":["C"],"e":"**正确答案：C。** 两个子网并分别关联网络安全组。\n\n**为什么对：** 子网是虚拟网络内的地址分段单位，NSG 可按子网关联实现分层管控。关联考点：官方技能点 4.1.1「创建并配置虚拟网络与子网」，内容领域 4。\n\n**其他选项为什么错：**\n- A：为每层各建一个虚拟网络。可以但不必要，跨虚拟网络还需额外对等与路由设计。\n- B：只建一个子网用标签区分。标签是元数据，不形成广播与规则边界。\n- D：用资源组分层。资源组是管理边界，不提供网络分段。\n\n**关键概念：** 先分段再定规则，段边界决定规则能落在哪一层。本题对应考纲 4.1.1。","s":"自编·4.1.1"},{"id":"D4-002","d":4,"t":"single","q":"两个虚拟网络里的资源要用私有地址互通且不经公网，应配置","o":[{"l":"A","t":"给两边都配公共 IP 并走 Internet"},{"l":"B","t":"虚"},{"l":"C","t":"把两个虚拟网络合并为一个"},{"l":"D","t":"只在一边建用户定义路由"}],"a":["B"],"e":"**正确答案：B。** 虚拟网络对等并确保地址空间不重叠。\n\n**为什么对：** 对等把两个虚拟网络在骨干网上直连，地址空间重叠是常见的配置失败原因。关联考点：官方技能点 4.1.2「创建并配置虚拟网络对等」，内容领域 4。\n\n**其他选项为什么错：**\n- A：给两边都配公共 IP 并走 Internet。流量经公网，违背私有互通与不经公网的要求。\n- C：把两个虚拟网络合并为一个。合并要改地址规划与资源，成本高且不是互通方案。\n- D：只在一边建用户定义路由。单向路由不建立双向可达，还缺少对端回程。\n\n**关键概念：** 对等解决连通，地址规划决定能不能对得上。本题对应考纲 4.1.2。","s":"自编·4.1.2"},{"id":"D4-003","d":4,"t":"single","q":"要让虚拟机拥有一个固定公网入口地址且重启后不变，应使用","o":[{"l":"A","t":"标"},{"l":"B","t":"动态公共 IP"},{"l":"C","t":"把私有 IP 手工写成公网地址"},{"l":"D","t":"用负载均衡器的前端名称代替"}],"a":["A"],"e":"**正确答案：A。** 标准 SKU 的静态公共 IP。\n\n**为什么对：** 静态分配保证地址与资源解绑前保持不变，标准 SKU 还支持区域冗余与安全默认。关联考点：官方技能点 4.1.3「配置公共 IP 地址」，内容领域 4。\n\n**其他选项为什么错：**\n- B：动态公共 IP。动态地址在资源停止释放后可能改变，不满足固定要求。\n- C：把私有 IP 手工写成公网地址。私有地址段不可在公网路由。\n- D：用负载均衡器的前端名称代替。名称用于解析，不等于给实例单独固定公网地址。\n\n**关键概念：** 静态与动态说的是分配方式，基本与标准说的是 SKU 能力。本题对应考纲 4.1.3。","s":"自编·4.1.3"},{"id":"D4-004","d":4,"t":"single","q":"要求子网访问 Internet 的流量先经过网络虚拟设备做检查，应配置","o":[{"l":"A","t":"只在子网加一条允许出站的 NSG 规则"},{"l":"B","t":"把设备放在另一个订阅"},{"l":"C","t":"给虚拟机绑定公共 IP"},{"l":"D","t":"用"}],"a":["D"],"e":"**正确答案：D。** 用户定义路由把下一跳指向该设备并启用 IP 转发。\n\n**为什么对：** UDR 通过自定义路由覆盖系统默认路由，配合设备上的 IP 转发才能实现引流。关联考点：官方技能点 4.1.4「配置用户定义的网络路由」，内容领域 4。\n\n**其他选项为什么错：**\n- A：只在子网加一条允许出站的 NSG 规则。NSG 只放行或拒绝，不能改变流量路径。\n- B：把设备放在另一个订阅。订阅边界与流量路径无关，放远处不产生引导效果。\n- C：给虚拟机绑定公共 IP。绑定公网地址会让流量绕开检查设备。\n\n**关键概念：** NSG 管能不能过，UDR 管往哪走，两者常一起用。本题对应考纲 4.1.4。","s":"自编·4.1.4"},{"id":"D4-005","d":4,"t":"single","q":"两台同子网虚拟机之间某端口不通，应优先按什么顺序排查","o":[{"l":"A","t":"直接重建虚拟网络"},{"l":"B","t":"立刻更换公共 IP"},{"l":"C","t":"先"},{"l":"D","t":"先调整订阅预算"}],"a":["C"],"e":"**正确答案：C。** 先查有效 NSG 规则与来宾防火墙，再看路由与对等状态。\n\n**为什么对：** Azure 提供有效安全规则视图，先确认规则是否放行，再逐层排除主机防火墙与路由。关联考点：官方技能点 4.1.5「排查网络连接问题」，内容领域 4。\n\n**其他选项为什么错：**\n- A：直接重建虚拟网络。重建破坏性大，且未定位原因前不一定解决问题。\n- B：立刻更换公共 IP。同子网互访走私有地址，与公网 IP 无关。\n- D：先调整订阅预算。预算与网络连通性没有任何关系。\n\n**关键概念：** 排障从最靠近流量的判定点开始，而不是从重建开始。本题对应考纲 4.1.5。","s":"自编·4.1.5"},{"id":"D4-006","d":4,"t":"single","q":"新增子网时提示地址空间不足，最合理的处理是","o":[{"l":"A","t":"把子网掩码写成更小前缀即可"},{"l":"B","t":"重"},{"l":"C","t":"给虚拟机加第二块网卡"},{"l":"D","t":"删除虚拟网络对等"}],"a":["B"],"e":"**正确答案：B。** 重新规划虚拟网络地址空间并调整子网划分。\n\n**为什么对：** 地址空间在创建时划定，扩展需评估已分配子网与对等网络是否冲突。关联考点：官方技能点 4.1.1「创建并配置虚拟网络与子网」，内容领域 4。\n\n**其他选项为什么错：**\n- A：把子网掩码写成更小前缀即可。地址空间总量没变，改掩码不能凭空增加可用地址。\n- C：给虚拟机加第二块网卡。增加网卡不扩展虚拟网络的地址池。\n- D：删除虚拟网络对等。对等与地址空间容量无关。\n\n**关键概念：** 地址规划是前期决策，后期扩容要检查冲突而不只是改数字。本题对应考纲 4.1.1。","s":"自编·4.1.1"},{"id":"D4-007","d":4,"t":"single","q":"要把一组同角色虚拟机作为整体写进安全规则，避免逐条维护 IP，应使用","o":[{"l":"A","t":"应"},{"l":"B","t":"把 IP 逐条写进 NSG 规则"},{"l":"C","t":"用资源标记代替安全组"},{"l":"D","t":"给每台虚拟机建独立 NSG"}],"a":["A"],"e":"**正确答案：A。** 应用程序安全组 ASG 并在 NSG 规则里引用它。\n\n**为什么对：** ASG 把工作负载按角色分组，NSG 规则引用组名即可随成员变化自动适用。关联考点：官方技能点 4.2.1「创建并配置网络安全组与应用程序安全组」，内容领域 4。\n\n**其他选项为什么错：**\n- B：把 IP 逐条写进 NSG 规则。可行但规模变化时要反复改规则，维护成本高。\n- C：用资源标记代替安全组。标记不参与 NSG 规则匹配。\n- D：给每台虚拟机建独立 NSG。规则分散且更难保持一致。\n\n**关键概念：** 按角色写规则比按地址写规则更贴近业务语义。本题对应考纲 4.2.1。","s":"自编·4.2.1"},{"id":"D4-008","d":4,"t":"single","q":"某端口同时存在子网 NSG 与网卡 NSG 的规则，判断能否通行应依据","o":[{"l":"A","t":"只看子网 NSG"},{"l":"B","t":"以最后创建的那条规则为准"},{"l":"C","t":"以优先级数字最大的规则为准"},{"l":"D","t":"两"}],"a":["D"],"e":"**正确答案：D。** 两层规则的合并结果，入站与出站分别按优先级求值。\n\n**为什么对：** 子网与网卡两层 NSG 独立存在，同一方向需都放行才通，优先级在各自表内生效。关联考点：官方技能点 4.2.2「评估 NSG 中的有效安全规则」，内容领域 4。\n\n**其他选项为什么错：**\n- A：只看子网 NSG。网卡级规则同样生效，忽略会误判。\n- B：以最后创建的那条规则为准。规则按优先级与方向求值，不按创建时间。\n- C：以优先级数字最大的规则为准。数字越小优先级越高，说反了会得出相反结论。\n\n**关键概念：** 有效规则视图能把多层规则合并展示，是排查的权威依据。本题对应考纲 4.2.2。","s":"自编·4.2.2"},{"id":"D4-009","d":4,"t":"multiple","q":"关于网络安全组规则求值，下列说法哪些正确","o":[{"l":"A","t":"同"},{"l":"B","t":"数字越大的规则越先生效"},{"l":"C","t":"入站放行即代表回程出站一定放行"},{"l":"D","t":"优"},{"l":"E","t":"子网 NSG 放行后网卡 NSG 会被忽略"},{"l":"F","t":"应用程序安全组可替代所有 IP 规则且不需要虚拟网络"}],"a":["A","D"],"e":"**正确答案：A、D。** 同一方向内按优先级数字从小到大匹配；优先级相同的冲突由系统规则与应用顺序决定时需要查有效规则。\n\n**为什么对：** 优先级、方向、作用层三者共同决定结果，任何单一维度都不足以判定。关联考点：官方技能点 4.2.2「评估 NSG 中的有效安全规则」，内容领域 4。\n\n**其他选项为什么错：**\n- B：数字越大的规则越先生效。优先级数字越小越先匹配，方向说反会导致放行误判。\n- C：入站放行即代表回程出站一定放行。NSG 有状态但入站与出站规则仍分别配置，不能一概而论。\n- E：子网 NSG 放行后网卡 NSG 会被忽略。两层规则都要评估，任一拒绝即不通。\n- F：应用程序安全组可替代所有 IP 规则且不需要虚拟网络。ASG 仍在虚拟网络内工作，且只是规则中的对象分组。\n\n**关键概念：** 判断连通性先固定方向与层级，再逐条对优先级。本题对应考纲 4.2.2。","s":"自编·4.2.2"},{"id":"D4-010","d":4,"t":"single","q":"要让管理员通过浏览器安全登录虚拟机而不暴露 RDP 与 SSH 端口到公网，应部署","o":[{"l":"A","t":"给虚拟机绑定公共 IP 并只放行管理员 IP"},{"l":"B","t":"A"},{"l":"C","t":"在 NSG 里放行全部来源的 3389 端口"},{"l":"D","t":"用对等虚拟网络跳过公网"}],"a":["B"],"e":"**正确答案：B。** Azure Bastion。\n\n**为什么对：** Bastion 在虚拟网络内提供托管的浏览器会话，虚拟机无需公共 IP 即可远程管理。关联考点：官方技能点 4.2.3「实施 Azure Bastion」，内容领域 4。\n\n**其他选项为什么错：**\n- A：给虚拟机绑定公共 IP 并只放行管理员 IP。仍把管理端口暴露到公网，攻击面没有消除。\n- C：在 NSG 里放行全部来源的 3389 端口。等于完全开放远程管理端口，风险更高。\n- D：用对等虚拟网络跳过公网。对等解决网络互通，不提供跳板与会话审计。\n\n**关键概念：** 管理通道托管化，既收窄暴露面又集中留痕。本题对应考纲 4.2.3。","s":"自编·4.2.3"},{"id":"D4-011","d":4,"t":"single","q":"要求存储账户与虚拟网络内子网之间的流量走 Azure 骨干网而非公网，应配置","o":[{"l":"A","t":"存"},{"l":"B","t":"只启用专用终结点"},{"l":"C","t":"给存储账户生成 SAS"},{"l":"D","t":"把账户设为公共读取"}],"a":["A"],"e":"**正确答案：A。** 存储服务终结点并在存储账户防火墙放行该子网。\n\n**为什么对：** 服务终结点把子网到服务的流量留在 Azure 骨干网，并需在服务端放行对应子网。关联考点：官方技能点 4.2.4「为平台服务配置服务终结点」，内容领域 4。\n\n**其他选项为什么错：**\n- B：只启用专用终结点。专用终结点是另一条路径，题干问的是服务终结点这类配置。\n- C：给存储账户生成 SAS。SAS 管授权，不改变网络路径。\n- D：把账户设为公共读取。公开级别只影响匿名访问，与流量路径无关。\n\n**关键概念：** 服务终结点按子网扩展服务身份，专用终结点则在子网内注入私有 IP。本题对应考纲 4.2.4。","s":"自编·4.2.4"},{"id":"D4-012","d":4,"t":"single","q":"要求存储账户在虚拟网络中拥有私有 IP 且可通过私有 DNS 解析，应配置","o":[{"l":"A","t":"仅启用服务终结点"},{"l":"B","t":"在 NSG 里放行 443 出站"},{"l":"C","t":"把存储账户移到另一资源组"},{"l":"D","t":"专"}],"a":["D"],"e":"**正确答案：D。** 专用终结点配合专用 DNS 区域。\n\n**为什么对：** 专用终结点把服务映射进子网私有地址空间，需私有 DNS 把名称解析到该地址。关联考点：官方技能点 4.2.5「为平台服务配置专用终结点」，内容领域 4。\n\n**其他选项为什么错：**\n- A：仅启用服务终结点。服务终结点不给服务分配子网内私有 IP。\n- B：在 NSG 里放行 443 出站。放行流量不产生私有端点与名称解析。\n- C：把存储账户移到另一资源组。资源组归属不改变网络访问形态。\n\n**关键概念：** 名称解析配不对，端点建好了客户端仍会走公网地址。本题对应考纲 4.2.5。","s":"自编·4.2.5"},{"id":"D4-013","d":4,"t":"single","q":"公司要用 Azure 托管内部域名并让虚拟网络自动解析，应配置","o":[{"l":"A","t":"用公共 DNS 区域承载内部记录"},{"l":"B","t":"在每台主机写 hosts 文件"},{"l":"C","t":"A"},{"l":"D","t":"只配置公共 IP 的 DNS 名称"}],"a":["C"],"e":"**正确答案：C。** Azure DNS 专用区域并链接到虚拟网络。\n\n**为什么对：** 专用 DNS 区域与虚拟网络链接后，该网络内资源可自动解析区域内记录。关联考点：官方技能点 4.3.1「配置 Azure DNS」，内容领域 4。\n\n**其他选项为什么错：**\n- A：用公共 DNS 区域承载内部记录。公共区域面向 Internet 解析，不适合内部名称。\n- B：在每台主机写 hosts 文件。手工维护不可扩展，且与自动解析目标相反。\n- D：只配置公共 IP 的 DNS 名称。那是单个资源的名称标签，不是区域托管。\n\n**关键概念：** 区域是托管域名的单位，链接决定哪些网络能用它。本题对应考纲 4.3.1。","s":"自编·4.3.1"},{"id":"D4-014","d":4,"t":"single","q":"要把入站 HTTP 流量分发到多台后端虚拟机并做健康探测，应使用","o":[{"l":"A","t":"只给每台虚拟机绑公共 IP"},{"l":"B","t":"A"},{"l":"C","t":"配置用户定义路由指向第一台虚拟机"},{"l":"D","t":"用 Azure DNS 轮询返回多个 A 记录"}],"a":["B"],"e":"**正确答案：B。** Azure 负载均衡器或应用程序网关并配置健康探测。\n\n**为什么对：** 负载均衡按规则分发并靠健康探测剔除不健康后端，网关还能按七层内容路由。关联考点：官方技能点 4.3.2「配置内部或公共负载均衡器」，内容领域 4。\n\n**其他选项为什么错：**\n- A：只给每台虚拟机绑公共 IP。客户端直连单台，既无分发也无故障剔除。\n- C：配置用户定义路由指向第一台虚拟机。路由不改变分发行为，还会形成单点。\n- D：用 Azure DNS 轮询返回多个 A 记录。DNS 轮询不做健康检查，故障节点仍会被返回。\n\n**关键概念：** 分发与健康检查要同时具备，只做轮询不算负载均衡。本题对应考纲 4.3.2。","s":"自编·4.3.2"},{"id":"D4-015","d":4,"t":"single","q":"负载均衡器后端某台虚拟机始终收不到流量，最应优先检查","o":[{"l":"A","t":"健"},{"l":"B","t":"先更换负载均衡器的公共 IP"},{"l":"C","t":"调整虚拟网络的地址空间"},{"l":"D","t":"给订阅添加预算告警"}],"a":["A"],"e":"**正确答案：A。** 健康探测状态与后端池及 NSG 规则。\n\n**为什么对：** 探测失败会让后端被判为不健康而停止接流，NSG 挡住探测源也会造成同类现象。关联考点：官方技能点 4.3.3「排查负载均衡问题」，内容领域 4。\n\n**其他选项为什么错：**\n- B：先更换负载均衡器的公共 IP。前端地址更换不解决后端不健康的问题。\n- C：调整虚拟网络的地址空间。地址空间与单台后端是否被选中无关。\n- D：给订阅添加预算告警。预算与流量分发无关。\n\n**关键概念：** 后端不接流先看探测，再看规则，最后才怀疑平台。本题对应考纲 4.3.3。","s":"自编·4.3.3"},{"id":"D4-016","d":4,"t":"single","q":"用户定义路由配好后流量仍走系统默认路径，最常见的原因是","o":[{"l":"A","t":"UDR 前缀写得比系统路由更短"},{"l":"B","t":"子网里没有公共 IP"},{"l":"C","t":"虚拟网络未启用对等"},{"l":"D","t":"路"}],"a":["D"],"e":"**正确答案：D。** 路由表未关联到子网或下一跳配置不适用于该流量。\n\n**为什么对：** UDR 只有在关联到相应子网且匹配更长前缀时才覆盖系统路由。关联考点：官方技能点 4.1.4「配置用户定义的网络路由」，内容领域 4。\n\n**其他选项为什么错：**\n- A：UDR 前缀写得比系统路由更短。更短前缀仍可能生效，问题多出在关联与下一跳。\n- B：子网里没有公共 IP。公网出口不依赖每台主机持有公共 IP。\n- C：虚拟网络未启用对等。对等与是否覆盖系统默认路由无关。\n\n**关键概念：** 配置存在不等于生效，先确认关联与匹配优先级。本题对应考纲 4.1.4。","s":"自编·4.1.4"},{"id":"D4-017","d":4,"t":"single","q":"规则要求仅允许应用子网访问数据子网的 1433 端口，最佳写法是","o":[{"l":"A","t":"源写 Any 目标写 Any 再由主机防火墙兜底"},{"l":"B","t":"写一条拒绝所有入站的规则放在最低优先级"},{"l":"C","t":"N"},{"l":"D","t":"把两台虚拟机放进同一应用程序安全组"}],"a":["C"],"e":"**正确答案：C。** NSG 规则源用应用程序安全组或子网地址前缀，目标端口限定 1433。\n\n**为什么对：** 源范围、目标范围、端口与协议四项收敛齐，才是可用的最小权限规则。关联考点：官方技能点 4.2.1「创建并配置网络安全组与应用程序安全组」，内容领域 4。\n\n**其他选项为什么错：**\n- A：源写 Any 目标写 Any 再由主机防火墙兜底。边界过宽，失去网络层最小权限。\n- B：写一条拒绝所有入站的规则放在最低优先级。低优先级拒绝会先被其他规则绕过，且没限定端口。\n- D：把两台虚拟机放进同一应用程序安全组。同组用于标识角色，不能表达源到目标的访问关系。\n\n**关键概念：** 规则四要素缺一项，边界就会悄悄放大。本题对应考纲 4.2.1。","s":"自编·4.2.1"},{"id":"D4-018","d":4,"t":"single","q":"区分内部负载均衡器与公共负载均衡器，最关键的一点是","o":[{"l":"A","t":"前者不能配置健康探测"},{"l":"B","t":"前"},{"l":"C","t":"后者不能分发到虚拟机"},{"l":"D","t":"内部负载均衡器必须绑定专用终结点"}],"a":["B"],"e":"**正确答案：B。** 前者前端使用虚拟网络内私有 IP，后者前端使用公共 IP。\n\n**为什么对：** 前端地址类型决定流量入口来自公网还是虚拟网络内部。关联考点：官方技能点 4.3.2「配置内部或公共负载均衡器」，内容领域 4。\n\n**其他选项为什么错：**\n- A：前者不能配置健康探测。两种形态都支持健康探测。\n- C：后者不能分发到虚拟机。公共负载均衡器同样面向后端虚拟机分发。\n- D：内部负载均衡器必须绑定专用终结点。两者是不同服务，没有这种绑定关系。\n\n**关键概念：** 先看入口方向，再选形态。本题对应考纲 4.3.2。","s":"自编·4.3.2"},{"id":"D5-001","d":5,"t":"single","q":"要判断某虚拟机过去一小时的 CPU 趋势，应使用","o":[{"l":"A","t":"在活动日志里查 CPU 数值"},{"l":"B","t":"查看存储账户诊断日志"},{"l":"C","t":"A"},{"l":"D","t":"读取预算告警记录"}],"a":["C"],"e":"**正确答案：C。** Azure Monitor 指标并按时间范围查看聚合曲线。\n\n**为什么对：** 指标是近实时的数值时间序列，适合趋势与阈值判断；日志适合事件与明细追溯。关联考点：官方技能点 5.1.1「解读 Azure Monitor 中的指标」，内容领域 5。\n\n**其他选项为什么错：**\n- A：在活动日志里查 CPU 数值。活动日志记录控制面操作，不承载性能指标时间序列。\n- B：查看存储账户诊断日志。那是存储服务的日志类别，不是虚拟机 CPU 指标。\n- D：读取预算告警记录。预算反映消费金额，与计算性能无关。\n\n**关键概念：** 指标回答高不高，日志回答发生了什么。本题对应考纲 5.1.1。","s":"自编·5.1.1"},{"id":"D5-002","d":5,"t":"single","q":"要把虚拟机来宾系统日志与平台诊断数据集中留存并可查询，应配置","o":[{"l":"A","t":"只启用资源锁"},{"l":"B","t":"诊"},{"l":"C","t":"给订阅加预算"},{"l":"D","t":"把指标固定到仪表板"}],"a":["B"],"e":"**正确答案：B。** 诊断设置把日志送到 Log Analytics 工作区或存储账户。\n\n**为什么对：** 诊断设置决定哪些类别的数据流向哪个目标，工作区提供查询与告警联动。关联考点：官方技能点 5.1.2「在 Azure Monitor 中配置日志设置」，内容领域 5。\n\n**其他选项为什么错：**\n- A：只启用资源锁。资源锁防误删，不采集任何日志。\n- C：给订阅加预算。预算与日志采集链路无关。\n- D：把指标固定到仪表板。仪表板只是展示，不产生长期留存与查询能力。\n\n**关键概念：** 采集、留存、查询是三段，配了展示不等于配了采集。本题对应考纲 5.1.2。","s":"自编·5.1.2"},{"id":"D5-003","d":5,"t":"single","q":"要在集中日志里查出某资源近 24 小时的错误记录，应使用","o":[{"l":"A","t":"K"},{"l":"B","t":"下载活动日志 CSV 后按文件大小排序"},{"l":"C","t":"查看指标图表的最大值"},{"l":"D","t":"翻阅资源组标签"}],"a":["A"],"e":"**正确答案：A。** Kusto 查询语言在 Log Analytics 工作区检索与筛选。\n\n**为什么对：** KQL 面向表格化日志做时间过滤、条件筛选与聚合，是日志分析的标准入口。关联考点：官方技能点 5.1.3「在 Azure Monitor 中查询与分析日志」，内容领域 5。\n\n**其他选项为什么错：**\n- B：下载活动日志 CSV 后按文件大小排序。文件大小不表达错误类型或时间范围。\n- C：查看指标图表的最大值。指标是聚合数值，不含逐条事件明细。\n- D：翻阅资源组标签。标签是静态元数据，与运行日志无关。\n\n**关键概念：** 明细检索用查询语言，趋势判断用指标图表。本题对应考纲 5.1.3。","s":"自编·5.1.3"},{"id":"D5-004","d":5,"t":"single","q":"要求磁盘空间低于阈值时通知值班组并自动创建工单，应配置","o":[{"l":"A","t":"只把指标固定到仪表板"},{"l":"B","t":"仅在活动日志里标记该事件"},{"l":"C","t":"提高预算阈值"},{"l":"D","t":"告"}],"a":["D"],"e":"**正确答案：D。** 告警规则绑定操作组并在动作里接工单或自动化。\n\n**为什么对：** 告警规则定义条件与严重度，操作组定义通知对象与动作，二者组合才形成闭环。关联考点：官方技能点 5.1.4「设置告警规则、操作组与告警处理规则」，内容领域 5。\n\n**其他选项为什么错：**\n- A：只把指标固定到仪表板。仪表板需要人主动看，不触发通知与动作。\n- B：仅在活动日志里标记该事件。活动日志不产生通知链路。\n- C：提高预算阈值。预算与磁盘空间告警属于不同信号源。\n\n**关键概念：** 规则管什么时候响，操作组管响了以后找谁做什么。本题对应考纲 5.1.4。","s":"自编·5.1.4"},{"id":"D5-005","d":5,"t":"multiple","q":"关于告警规则与操作组，下列说法哪些正确","o":[{"l":"A","t":"操作组负责定义触发条件与阈值"},{"l":"B","t":"告警触发后必须由管理员手工执行全部动作"},{"l":"C","t":"一"},{"l":"D","t":"操作组只能包含邮件收件人"},{"l":"E","t":"告警处理规则可以替代操作组完成通知"},{"l":"F","t":"操"}],"a":["C","F"],"e":"**正确答案：C、F。** 一条告警规则可关联多个操作组；操作组可同时包含邮件通知与 Webhook 动作。\n\n**为什么对：** 规则、操作组、处理规则三层分别管判定、通知与抑制，职责不重叠。关联考点：官方技能点 5.1.4「设置告警规则、操作组与告警处理规则」，内容领域 5。\n\n**其他选项为什么错：**\n- A：操作组负责定义触发条件与阈值。条件与阈值属于告警规则，操作组只定义通知与动作。\n- B：告警触发后必须由管理员手工执行全部动作。可配置自动化、Webhook 与工单集成自动执行。\n- D：操作组只能包含邮件收件人。还支持短信、推送、Webhook、逻辑应用与自动化等多种动作。\n- E：告警处理规则可以替代操作组完成通知。处理规则用于抑制或修改告警，不负责通知对象。\n\n**关键概念：** 分层清楚后，告警失灵时能快速定位是哪一层没配。本题对应考纲 5.1.4。","s":"自编·5.1.4"},{"id":"D5-006","d":5,"t":"single","q":"要洞察应用各依赖组件之间的调用与失败率，应启用","o":[{"l":"A","t":"只查看订阅的活动日志"},{"l":"B","t":"A"},{"l":"C","t":"提高诊断设置的保留天数"},{"l":"D","t":"给资源加更多标记"}],"a":["B"],"e":"**正确答案：B。** Application Insights 或 Azure Monitor 洞察类能力。\n\n**为什么对：** 洞察类能力基于遥测构建应用地图与依赖关系，能定位到具体失败组件。关联考点：官方技能点 5.1.5「用 Azure Monitor 洞察配置并解读监视」，内容领域 5。\n\n**其他选项为什么错：**\n- A：只查看订阅的活动日志。活动日志不含应用内部依赖调用链路。\n- C：提高诊断设置的保留天数。保留天数只决定存多久，不产生依赖拓扑。\n- D：给资源加更多标记。标记是元数据，不生成调用关系。\n\n**关键概念：** 看依赖要看遥测链路，不能靠资源清单元数据推断。本题对应考纲 5.1.5。","s":"自编·5.1.5"},{"id":"D5-007","d":5,"t":"single","q":"要持续验证两台虚拟机之间网络连通性并观察延迟变化，应使用","o":[{"l":"A","t":"N"},{"l":"B","t":"只做一次即时连通性检测"},{"l":"C","t":"查看 NSG 有效规则"},{"l":"D","t":"给虚拟机换更大规格"}],"a":["A"],"e":"**正确答案：A。** Network Watcher 的连接监视。\n\n**为什么对：** 连接监视按周期探测并输出可达性与延迟趋势，适合持续观测。关联考点：官方技能点 5.1.6「使用 Azure Network Watcher 与连接监视」，内容领域 5。\n\n**其他选项为什么错：**\n- B：只做一次即时连通性检测。单次结果无法反映随时间变化的延迟与抖动。\n- C：查看 NSG 有效规则。规则说明是否允许，不提供实测时延。\n- D：给虚拟机换更大规格。规格影响计算能力，不测量网络路径。\n\n**关键概念：** 一次性检查与持续监视是两种能力，排障与观测别混用。本题对应考纲 5.1.6。","s":"自编·5.1.6"},{"id":"D5-008","d":5,"t":"single","q":"要为虚拟机配置备份并集中管理恢复点，第一步是","o":[{"l":"A","t":"直接删除旧快照腾空间"},{"l":"B","t":"先把虚拟机移到另一订阅"},{"l":"C","t":"给存储账户启用版本控制"},{"l":"D","t":"创"}],"a":["D"],"e":"**正确答案：D。** 创建恢复服务保管库并配置备份策略。\n\n**为什么对：** 恢复服务保管库承载备份项与恢复点，策略定义频率与保留期。关联考点：官方技能点 5.2.1「创建恢复服务保管库」，内容领域 5。\n\n**其他选项为什么错：**\n- A：直接删除旧快照腾空间。删快照既不是备份起点，也会损失可恢复点。\n- B：先把虚拟机移到另一订阅。跨订阅移动不是建立备份的前置条件。\n- C：给存储账户启用版本控制。版本控制作用于 Blob 数据，不备份虚拟机磁盘。\n\n**关键概念：** 先有保管库与策略，再把虚拟机纳入保护。本题对应考纲 5.2.1。","s":"自编·5.2.1"},{"id":"D5-009","d":5,"t":"single","q":"要备份 Azure 文件共享或新版工作负载，且希望使用专门的备份保管库形态，应采用","o":[{"l":"A","t":"恢复服务保管库对部分新工作负载不支持"},{"l":"B","t":"仅靠共享快照"},{"l":"C","t":"A"},{"l":"D","t":"把文件复制到另一存储账户"}],"a":["C"],"e":"**正确答案：C。** Azure Backup 保管库。\n\n**为什么对：** Backup 保管库面向较新的工作负载类型，两者的支持矩阵不同，选错会无法注册备份项。关联考点：官方技能点 5.2.2「创建 Azure Backup 保管库」，内容领域 5。\n\n**其他选项为什么错：**\n- A：恢复服务保管库对部分新工作负载不支持。题干指向新形态保管库，恢复服务保管库覆盖面不同。\n- B：仅靠共享快照。快照是时间点副本，缺少集中策略、长期保留与集中监控。\n- D：把文件复制到另一存储账户。手工复制没有策略与恢复点管理。\n\n**关键概念：** 保管库类型决定能保护什么，先查支持矩阵再建。本题对应考纲 5.2.2。","s":"自编·5.2.2"},{"id":"D5-010","d":5,"t":"single","q":"公司要求每日备份并保留 90 天，应在哪里定义","o":[{"l":"A","t":"在资源组的标记里写保留天数"},{"l":"B","t":"备"},{"l":"C","t":"在恢复服务保管库名称里注明"},{"l":"D","t":"在虚拟机的规格里选择"}],"a":["B"],"e":"**正确答案：B。** 备份策略里的计划频率与保留期。\n\n**为什么对：** 备份策略把备份频率与各类恢复点的保留规则集中定义，供多个备份项复用。关联考点：官方技能点 5.2.3「创建并配置备份策略」，内容领域 5。\n\n**其他选项为什么错：**\n- A：在资源组的标记里写保留天数。标记是元数据，不驱动备份行为。\n- C：在恢复服务保管库名称里注明。名称只是标识，不影响保留逻辑。\n- D：在虚拟机的规格里选择。规格决定算力，与备份保留无关。\n\n**关键概念：** 策略是备份行为的唯一定义处，改策略才改变保留。本题对应考纲 5.2.3。","s":"自编·5.2.3"},{"id":"D5-011","d":5,"t":"single","q":"虚拟机文件被误删后要恢复到指定时间点，应使用","o":[{"l":"A","t":"从"},{"l":"B","t":"从资源锁里找回文件"},{"l":"C","t":"重新部署一份 ARM 模板"},{"l":"D","t":"查看活动日志里的删除记录"}],"a":["A"],"e":"**正确答案：A。** 从备份恢复点执行文件级或磁盘级还原。\n\n**为什么对：** Azure Backup 的恢复点支持整盘还原与文件级恢复，按时间点选择即可。关联考点：官方技能点 5.2.4「用 Azure Backup 执行备份与还原操作」，内容领域 5。\n\n**其他选项为什么错：**\n- B：从资源锁里找回文件。资源锁防删除，不保存文件内容。\n- C：重新部署一份 ARM 模板。模板重建资源，不恢复来宾系统里的文件。\n- D：查看活动日志里的删除记录。日志只能说明谁删了，不含数据副本。\n\n**关键概念：** 有恢复点才有还原能力，日志不能当备份用。本题对应考纲 5.2.4。","s":"自编·5.2.4"},{"id":"D5-012","d":5,"t":"single","q":"要为虚拟机配置跨区域灾难恢复，应使用","o":[{"l":"A","t":"只把备份保留期改长"},{"l":"B","t":"给虚拟机加可用性集"},{"l":"C","t":"启用 Blob 软删除"},{"l":"D","t":"A"}],"a":["D"],"e":"**正确答案：D。** Azure Site Recovery 并指定目标区域。\n\n**为什么对：** 站点恢复负责复制、故障转移与恢复计划，是跨区域容灾的专用能力。关联考点：官方技能点 5.2.5「为 Azure 资源配置站点恢复」，内容领域 5。\n\n**其他选项为什么错：**\n- A：只把备份保留期改长。备份解决数据恢复，不提供业务连续性与故障转移编排。\n- B：给虚拟机加可用性集。可用性集只覆盖单区域内的实例分布。\n- C：启用 Blob 软删除。软删除保护对象数据，不复制整台虚拟机。\n\n**关键概念：** 备份管能不能找回，容灾管能不能继续跑。本题对应考纲 5.2.5。","s":"自编·5.2.5"},{"id":"D5-013","d":5,"t":"single","q":"灾备演练要求把业务切到次要区域并可在事后切回，应使用","o":[{"l":"A","t":"直接删除主区域虚拟机"},{"l":"B","t":"只把 DNS 记录改到次要区域"},{"l":"C","t":"执"},{"l":"D","t":"从备份恢复点还原一台新虚拟机"}],"a":["C"],"e":"**正确答案：C。** 执行计划内故障转移并在验证后做故障回复。\n\n**为什么对：** 站点恢复的故障转移与故障回复成对存在，演练后必须回到可再次保护的状态。关联考点：官方技能点 5.2.6「用站点恢复到次要区域执行故障转移」，内容领域 5。\n\n**其他选项为什么错：**\n- A：直接删除主区域虚拟机。删除会破坏复制关系且无法回切。\n- B：只把 DNS 记录改到次要区域。改解析不等于完成实例复制与故障转移编排。\n- D：从备份恢复点还原一台新虚拟机。还原耗时长且不含复制与回切流程。\n\n**关键概念：** 演练的终点是恢复保护，不是切过去就结束。本题对应考纲 5.2.6。","s":"自编·5.2.6"},{"id":"D5-014","d":5,"t":"single","q":"管理层要定期看到备份成功率与失败项清单，应使用","o":[{"l":"A","t":"逐台虚拟机打开磁盘属性页查看"},{"l":"B","t":"备"},{"l":"C","t":"只依赖活动日志全文搜索"},{"l":"D","t":"给保管库加资源锁"}],"a":["B"],"e":"**正确答案：B。** 备份报告与备份告警并配置通知。\n\n**为什么对：** 备份报告基于作业数据汇总成功率与失败项，配合告警可主动推送。关联考点：官方技能点 5.2.7「配置并解读备份报告与告警」，内容领域 5。\n\n**其他选项为什么错：**\n- A：逐台虚拟机打开磁盘属性页查看。手工抽查无法覆盖全量且不可定期送达。\n- C：只依赖活动日志全文搜索。活动日志不汇总备份作业成功率。\n- D：给保管库加资源锁。资源锁防误删，不产生报告。\n\n**关键概念：** 监控要的是聚合视图与主动通知，不是逐台翻页。本题对应考纲 5.2.7。","s":"自编·5.2.7"}];
const QUIZ_MOCK_POOL = ["D1-001","D1-002","D1-003","D1-005","D1-006","D1-007","D1-011","D1-012","D1-019","D1-014","D1-015","D1-016","D2-018","D2-002","D2-003","D2-004","D2-005","D2-006","D2-008","D2-009","D2-010","D2-011","D3-001","D3-002","D3-003","D3-004","D3-005","D3-006","D3-007","D3-008","D3-009","D3-010","D3-011","D3-012","D4-001","D4-002","D4-003","D4-004","D4-005","D4-007","D4-008","D4-010","D4-011","D5-001","D5-002","D5-003","D5-004","D5-006","D5-007","D5-008"];
const QUIZ_MOCK_SCORED = ["D1-001","D1-002","D1-003","D1-005","D1-006","D1-007","D1-011","D1-012","D1-019","D1-014","D1-015","D1-016","D2-018","D2-002","D2-003","D2-004","D2-005","D2-006","D2-008","D2-009","D2-010","D2-011","D3-001","D3-002","D3-003","D3-004","D3-005","D3-006","D3-007","D3-008","D3-009","D3-010","D3-011","D3-012","D4-001","D4-002","D4-003","D4-004","D4-005","D4-007","D4-008","D4-010","D4-011","D5-001","D5-002","D5-003","D5-004","D5-006","D5-007","D5-008"];
