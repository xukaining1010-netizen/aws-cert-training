const QUIZ_META = {"exam":"SOA-C03","title":"AWS Certified CloudOps Engineer - Associate 题库","lang":"zh","updated":"2026-11-19","domains":{"1":"Monitoring, Logging, Analysis, Remediation, and Performance Optimization","2":"Reliability and Business Continuity","3":"Deployment, Provisioning, and Automation","4":"Security and Compliance","5":"Networking and Content Delivery"},"weights":{"1":"22","2":"22","3":"22","4":"16","5":"18"},"examParams":{"count":65,"scored":50,"minutes":130,"pass":720},"footerNote":"题库来源：按 AWS SOA-C03 官方 Exam Guide v1.2（5 域 / 13 任务 / 53 技能点）自建命题，共 100 题、53 技能点全覆盖；域配比 22/22/22/16/18 与官方权重一致；以 AWS 官方文档为准。官方考试 65 题（50 计分 + 15 不计分）、130 分钟、及格 720。","version":"v0.1（题库 100 题 · 样题 10 + 铺量 90）","practiceNote":"练习模式已剔除 65 题模考池，可练 35 题"};
const QUIZ_QUESTIONS = [{"id":"D1-001","d":1,"t":"single","q":"Northwind 的一批 EC2 队列机上线后，运维在 CloudWatch 控制台能查到 CPU 使用率曲线，却找不到内存与磁盘使用率的任何数据点。要补齐这两类系统级指标，正确做法是什么","o":[{"l":"A","t":"无需处理，AWS 服务的全部指标都会自动上报到 CloudWatch，等一等就会出现"},{"l":"B","t":"为队列机更换更大规格的实例，内存与磁盘指标会随新规格自动出现"},{"l":"C","t":"在队列机上安装 CloudWatch 代理，并确保实例角色带有写入 CloudWatch 的 IAM 权限"},{"l":"D","t":"将队列机整体迁入 EKS 集群，改用 Container Insights 采集系统级指标"}],"a":["C"],"e":"✅ 正确项：C。CPU 这类基础指标由平台自动上报，内存与磁盘使用率属于系统级指标，默认不在自动上报范围内，要靠装在主机上的 CloudWatch 代理采集；代理还要求实例角色带写入 CloudWatch 的 IAM 权限，权限缺失正是「配了没数据」的头号原因。关联考点：域 1.1.2「配置与管理 CloudWatch 代理采集指标与日志」。\n\n❌ A：AWS 默认只自动上报一部分指标，内存与磁盘这类系统级指标不在其中，等下去数据不会凭空出现。\n❌ B：换大规格只改变容量与性能，指标的上报范围不随规格变化，系统级指标照样缺位。\n❌ D：Container Insights 面向 ECS 与 EKS 容器集群，按集群聚合指标与日志；为补两个系统指标把自建队列机迁容器平台，属于场景错配、动作过重。\n\n📌 关键概念：平台指标自动有，系统级指标靠代理补；代理三件事——装上、配好命名空间、给足 IAM 权限。","s":"自编·1.1.2"},{"id":"D1-002","d":1,"t":"multiple","q":"Northwind 订单链路的十几条 CloudWatch 告警频繁在夜间单指标抖动时误报，值班被吵得疲惫。团队要做告警治理并接上自动化处置，哪些做法符合 CloudWatch 告警的机制（选所有适用项）","o":[{"l":"A","t":"把「队列深度高、错误率高、延迟高」三条告警组成一条复合告警，三条同时越线才算真故障再呼叫值班"},{"l":"B","t":"复合告警本质是多条子告警的打包转发，配置后每条子告警越线仍会各自发出通知"},{"l":"C","t":"告警越线的动作可以直接指向 SNS 主题，由主题把通知扇出给值班邮件组与值班系统"},{"l":"D","t":"告警状态变化本身是一个事件，可以通过 EventBridge 规则路由到 Lambda 执行自定义修复动作"},{"l":"E","t":"给账户里所有能采集到的指标全部配上告警，覆盖越全越安全"}],"a":["A","C","D"],"e":"✅ 正确项：A、C、D。复合告警用一个表达式把多条告警组合，多个征兆同时出现才触发，正是治误报噪音的手段；告警动作可直接指向 SNS 主题扇出通知；状态变化也可以作为事件经 EventBridge 路由到 Lambda，做通知之外的自定义动作。关联考点：域 1.1.3「配置、识别与排障 CloudWatch 告警」。\n\n❌ B：复合告警是表达式组合逻辑，用途是降噪，不是子告警的打包转发器，说越线后各自照发通知与机制正好相反。\n❌ E：告警没有后续动作就是噪音，全量配告警只会放大噪音，「越全越安全」把方向说反了。\n\n📌 关键概念：复合告警用表达式组合降噪；告警动作两条路——直接触发内置动作，或经 EventBridge 走自定义链路。","s":"自编·1.1.3"},{"id":"D2-001","d":2,"t":"single","q":"Northwind 的订单入口由 ALB 监听，一次版本发布后，目标组里的实例全部被摘除流量，用户访问报错；应用日志显示各实例进程都在正常运行。值班运维应最先从哪里入手定位","o":[{"l":"A","t":"直接终止全部被摘除的实例，让 Auto Scaling 按健康检查重新拉起一批新实例"},{"l":"B","t":"先核对目标组健康检查的协议、端口与路径，确认新版本应用是否真正监听了检查端点"},{"l":"C","t":"把不健康阈值调大，让摘除动作晚一点发生，为排查争取时间"},{"l":"D","t":"将 ALB 换成 NLB，绕开七层健康检查的判定逻辑"}],"a":["B"],"e":"✅ 正确项：B。实例进程活着却被全员摘除，头号嫌疑是探活判定失效：发布场景常忘注册/healthz 这类检查路由，探活收到 404、到不健康阈值就全员摘流量。先核协议、端口与路径，检查端点返回 200 才算健康，这是最快锁定根因的一步。关联考点：域 2.2.1「配置与排障 Elastic Load Balancing 与 Route 53 健康检查」。\n\n❌ A：实例活着只是被摘了流量，杀机器是过度动作；替换与否由 Auto Scaling 按健康检查判定，不该人为扩大动作。\n❌ C：调大阈值只让误摘来得慢一些，检查路径错多久就错多久，不触根因。\n❌ D：摘除判据在目标组健康检查，换负载均衡器形态既不解决检查路由缺失，还要重配入口引入新变量，动作过重。\n\n📌 关键概念：摘流量不等于杀机器；「健康却被摘」按序查三样——检查路径与端口、安全组放行、阈值与间隔是否匹配启动速度。","s":"自编·2.2.1"},{"id":"D2-002","d":2,"t":"multiple","q":"Northwind 在为各业务条线选定灾难恢复等级，预算与业务等级各不相同。对照灾备四等级（备份与恢复、pilot light、温备、双活），下列说法哪些是对的（选所有适用项）","o":[{"l":"A","t":"pilot light 要求把整套应用服务器常驻在备用区域，随时接住切换过来的流量"},{"l":"B","t":"备份与恢复等级只备数据、灾后从零重建，成本最低而 RTO 最长"},{"l":"C","t":"温备在备用区域常驻一套精简版全栈，灾时扩容接管，RTO 可到分钟级"},{"l":"D","t":"双活让两个区域同时服务流量，RTO 最短，但要处理双写与一致性冲突，成本也最高"},{"l":"E","t":"预算有限时，多数业务的最优解是直接上双活，其余等级只配给不重要的系统"}],"a":["B","C","D"],"e":"✅ 正确项：B、C、D。四等级按成本从低到高排：备份与恢复只备数据、灾后从零重建；温备常驻精简栈、灾时扩容接管、RTO 分钟级；双活两区同时服务、RTO 最短但要处理双写与一致性冲突。三条说法与各等级定位一致。关联考点：域 2.3.4「遵循灾备流程与最佳实践」。\n\n❌ A：pilot light 是「数据在、机器不在」，只把数据复制到备用区域并留最小组件，灾时才拉起全栈，说它常驻整套应用服务器正好把定位说反。\n❌ E：双活的复杂度与成本陡增，多数业务的合理组合是温备加关键数据跨区复制加定期演练，不是无脑上双活。\n\n📌 关键概念：灾备四等级成本与 RTO 反向；等级选型看业务等级与预算，没演练过的预案等于没有预案。","s":"自编·2.3.4"},{"id":"D3-001","d":3,"t":"single","q":"Northwind 用 CloudFormation 部署新环境，栈在第十个资源上卡住不再前进，界面上栈状态停在进行中。要最快定位失败根因，第一步应该看什么","o":[{"l":"A","t":"直接对栈再发起一次同样的部署，重试本身可能让资源创建成功"},{"l":"B","t":"删除整个栈后重新部署，失败状态会被自然清理"},{"l":"C","t":"登录已建出的每台实例，逐台翻应用日志找出有问题的那台"},{"l":"D","t":"栈事件流里最后一条失败事件，它会指出出错的资源与错误码"}],"a":["D"],"e":"✅ 正确项：D。栈事件流按时间线列出每步成败，最后一条失败事件直接指向出错资源与错误码——子网可用地址耗尽、模板语法错、执行主体权限不足，都能从错误码对号入座。关联考点：域 3.1.3「识别与修复部署问题」。\n\n❌ A：模板没改，重试结果一样，同样的错误再来一遍；修完根因再跑才是正路。\n❌ B：删栈会连已建资源一起删除，数据库栈没开终止保护时这是灾难级动作；卡住另有排障路径。\n❌ C：栈卡住是编排层故障，与已建实例内部的应用状态无关，逐台登机排查方向就偏了。\n\n📌 关键概念：部署排障第一现场是栈事件流最后一条；常见根因分三类——容量、编排、权限，对号入座再动手。","s":"自编·3.1.3"},{"id":"D3-002","d":3,"t":"single","q":"Northwind 的承运商每天不定时上传运单 CSV 到 S3 桶，业务要求文件落地后自动解析入库，解析不了的异常行留档等待人工处理。哪套事件驱动链路最贴合这个需求","o":[{"l":"A","t":"用 EventBridge 定时计划每小时扫描一遍桶，发现新文件再触发处理"},{"l":"B","t":"在桶上配置 S3 事件通知，对象创建时触发 Lambda 解析入库，处理不了的行投递到死信队列"},{"l":"C","t":"让报表服务按天轮询桶清单，夜间批处理统一解析当天文件"},{"l":"D","t":"把 CSV 改传到 EFS 共享目录，再写 Cron 脚本定时扫描文件系统里的新文件"}],"a":["B"],"e":"✅ 正确项：B。S3 事件通知在对象创建时由桶直接触发目标，Lambda 即到即处理；失败与异常落死信队列留现场待重放，正是「数据到位即处理」的标准事件驱动链路。关联考点：域 3.2.2「用 AWS 服务与功能实施事件驱动自动化」。\n\n❌ A：定时扫描把「落地即处理」做成小时级延迟，轮询空转还费调用；定时计划适合日程任务，不适合文件到达即响应。\n❌ C：按天轮询同样牺牲时效，夜间批处理正是这套链路要取代的旧模式。\n❌ D：改文件系统加 Cron 自扫，等于绕开云原生事件源重造轮子，扫描与失败兜底全要自己维护。\n\n📌 关键概念：事件驱动＝触发器加处理器；S3 事件通知管「文件一到」，死信队列管「处理不了留现场」，处理器要幂等防重复生效。","s":"自编·3.2.2"},{"id":"D4-001","d":4,"t":"single","q":"Northwind 的合作方反馈：用跨账户角色来拉运单数据，扮演角色成功，随后的 S3 读取请求却被拒绝。要排查这类「策略看着对、访问还是被拒」的问题，哪条路径最有效","o":[{"l":"A","t":"先在 CloudTrail 里查被拒事件的主体、动作与资源，再用 IAM 策略模拟器复现同一请求，看评估走到哪条语句"},{"l":"B","t":"用 IAM Access Analyzer 扫描资源策略，它会直接给出每次被拒请求的具体原因"},{"l":"C","t":"给合作方的角色挂上 AdministratorAccess，先恢复业务再慢慢排查"},{"l":"D","t":"检查合作方本地网络到 AWS 的连通性，访问被拒多半是网络层故障"}],"a":["A"],"e":"✅ 正确项：A。CloudTrail 记录已发生的调用，被拒事件里主体、动作、资源与错误码俱全，先把事实定下来；再用策略模拟器对同一动作与资源做不发真实请求的推演，看评估落在哪条语句。跨账户访问还要看两端：资源策略给了对方，身份侧也要放行。关联考点：域 4.1.2「用 AWS 工具排障与审计访问问题」。\n\n❌ B：Access Analyzer 管的是暴露面盘点，列出对外部主体暴露的资源与权限，不负责解释「为什么被拒」，工具用错了段。\n❌ C：用最宽权限换恢复时间违背最小权限原则，正确做法是补一条精确放行语句，扩权只会放大后续风险。\n❌ D：扮演角色已成功，说明身份链路与网络都通；授权层的拒绝与网络连通无关，方向偏了。\n\n📌 关键概念：排障三件套各管一段——CloudTrail 查事实、模拟器做推演、Access Analyzer 扫暴露面；跨账户访问两边都要放行。","s":"自编·4.1.2"},{"id":"D4-002","d":4,"t":"single","q":"Northwind 把运单桶升级为 SSE-KMS 加密后，报表服务读取桶内对象开始报访问拒绝。桶策略已放行报表服务角色，报表服务的 IAM 策略里也有 S3 读取权限。下一步最该查什么","o":[{"l":"A","t":"确认 KMS 密钥策略有没有放行报表服务角色使用这把密钥"},{"l":"B","t":"把桶改回 SSE-S3 服务托管加密，绕开 KMS 这一层权限"},{"l":"C","t":"给报表服务申请根用户凭证，用账户最高权限直接读桶"},{"l":"D","t":"在桶上再加一条对所有人开放的读取策略，扩大授权面兜底"}],"a":["A"],"e":"✅ 正确项：A。SSE-KMS 下读对象要过两道授权：桶策略放行对象读取之外，调用方还得被 KMS 密钥策略放行才能完成解密。「桶策略开了、钥匙没给」正是这类故障的经典形态，在密钥策略里补上报表服务角色即可恢复。关联考点：域 4.2.2「实施、配置与排障静态加密」。\n\n❌ B：退回 SSE-S3 等于放弃密钥级控制与审计能力，为排障回退加密方案是方向性错误。\n❌ C：把根用户凭证交给应用使用违反最小权限与凭证纪律，属于严重反模式。\n❌ D：桶策略向所有人开放既解不开 KMS 这道锁，还把对象暴露面敞开，风险进一步放大。\n\n📌 关键概念：SSE-KMS 的权限链两道门——桶策略管对象读取，密钥策略管解密；跨账户用钥匙两边都要授权。","s":"自编·4.2.2"},{"id":"D5-001","d":5,"t":"single","q":"Northwind 的队列机突然连不上同 VPC 另一子网的报表库。两侧安全组的出站与入站规则核对无误，子网路由表里也有对方网段的路由；半小时前网络 ACL 刚加过规则，此外没有其他配置变更。最可能的根因是什么","o":[{"l":"A","t":"安全组是有状态防火墙，规则变更后会静默丢弃回包，需要重建安全组恢复"},{"l":"B","t":"网络 ACL 是无状态过滤，新加的拒绝规则挡住了回包方向，回包不被「记住」，需要单独放行"},{"l":"C","t":"同 VPC 子网间的流量要显式配置 NAT 网关才能跨子网通信"},{"l":"D","t":"子网缺少互联网网关路由，导致子网间通信中断"}],"a":["B"],"e":"✅ 正确项：B。网络 ACL 无状态、进出独立计数，回包方向要单独放行，这与安全组「有状态、回包自动放行」正好相反；ACL 刚变更过，新拒绝规则挡了回包方向是头号嫌疑，补一条回包放行两分钟就能恢复。关联考点：域 5.3.1「排障 VPC 配置」。\n\n❌ A：把无状态的 ACL 特性安到有状态的安全组头上是概念错配；安全组恰恰会自动放行回包，无需重建。\n❌ C：同 VPC 内子网间流量走本地隐含路由，NAT 网关只服务私有子网出互联网，与跨子网无关。\n❌ D：互联网网关只承载进出互联网的流量，子网间通信不依赖它，这条与故障无关。\n\n📌 关键概念：VPC 排障五道关卡——安全组、路由、ACL、网关、解析；ACL 无状态，回包方向要单独放行，是「IP 通业务不通」的第一现场。","s":"自编·5.3.1"},{"id":"D5-002","d":5,"t":"single","q":"Northwind 海外司机端 App 有两类流量：地图瓦片等静态内容希望在全球边缘就近缓存返回；调度服务的 TCP 长连接希望用固定入口 IP，方便各地园区防火墙做白名单。分发方案应怎么选","o":[{"l":"A","t":"两类流量都交给 CloudFront，CDN 同样能承载并缓存 TCP 长连接"},{"l":"B","t":"两类流量都交给 Global Accelerator，任播入口对内容也自带边缘缓存"},{"l":"C","t":"地图瓦片走 CloudFront 边缘缓存，调度服务走 Global Accelerator 的静态 IP 入口"},{"l":"D","t":"两类流量都直接打到源站 ALB，靠扩容与跨区部署扛住全球请求"}],"a":["C"],"e":"✅ 正确项：C。CloudFront 是内容分发网络，把 HTTP 内容缓在全球边缘节点就近返回，瓦片这类静态内容正对它的定位；Global Accelerator 是网络加速器，给两个静态 IP 做任播入口，流量从最近边缘进入 AWS 骨干直达端点，固定 IP 与 TCP 加速正是它管的事。关联考点：域 5.2.3「配置内容与服务分发」。\n\n❌ A：CloudFront 面向 HTTP 内容的缓存与分发，不承载 TCP 长连接这类非 HTTP 流量，两类都塞给它属于场景错配。\n❌ B：Global Accelerator 没有缓存能力，做的是纯路径优化，说任播入口自带边缘缓存是把两个服务的定位弄反了。\n❌ D：全球用户直压源站 ALB，延迟与源站压力都最差，还放弃了就近接入的全部收益。\n\n📌 关键概念：选型一句话——HTTP 内容与缓存找 CloudFront，非 HTTP 的 TCP 与 UDP 加速、静态入口 IP 找 Global Accelerator。","s":"自编·5.2.3"},{"id":"D1-003","d":1,"t":"single","q":"Northwind 的运维要查清上周是谁在什么时候修改了队列机的安全组规则，导致收不到货柜数据。去哪里查最直接","o":[{"l":"A","t":"翻队列机上的应用日志，按时间线找异常记录"},{"l":"B","t":"看 Amazon Managed Service for Prometheus 的指标曲线，找异常点"},{"l":"C","t":"查 AWS CloudTrail 的 API 调用记录，定位那次安全组变更的主体与时间"},{"l":"D","t":"在 Amazon SNS 的通知历史里搜安全组关键字"}],"a":["C"],"e":"✅ 正确项：C。审计事件回答「谁动了它」：CloudTrail 记录账户里的 API 调用，安全组被改这类管理操作逐条留痕，主体、时间与请求参数都可查，是这类问题的正解入口。关联考点：域 1.1.1「使用 AWS 服务为工作负载配置监控与日志」。\n\n❌ A：应用日志记录的是业务与程序自身的事件，安全组属于账户层管理操作，不在应用日志里。\n❌ B：Prometheus 管的是云原生时间序列指标，回答「系统现在怎么样」，不回答「谁改了配置」。\n❌ D：SNS 是通知扇出通道，只有配了通知的事件才会出现，安全组变更默认不经过它。\n\n📌 关键概念：三类数据三个入口——指标与日志进 CloudWatch、API 审计进 CloudTrail、云原生指标走 Prometheus；查「谁改的」认准 CloudTrail。","s":"自编·1.1.1"},{"id":"D1-004","d":1,"t":"single","q":"Northwind 在美东跑订单、在新加坡跑车队网关，分属两个账号两个区域。运维主管要在一张图上每天巡检两地核心指标，该怎么做","o":[{"l":"A","t":"每天分别登录两个账号的控制台，截图后拼到本地文档里"},{"l":"B","t":"把两个账号的指标数据全部导出到同一个 S3 桶，再自建报表"},{"l":"C","t":"给两个账号各复制一份内容相同的仪表盘，各自维护"},{"l":"D","t":"用 CloudWatch 仪表盘的跨账号可观测性，部件指定来源账号与来源区域，一张图混排两地指标"}],"a":["D"],"e":"✅ 正确项：D。仪表盘的每个部件都可以指定来源区域与来源账号，跨账号展示靠监控账户与源账号之间的授权关系建立，一张仪表盘混排多地指标，多账号多区域的日常巡检正走这条路。关联考点：域 1.1.4「创建与管理跨账号跨区域的可共享仪表盘」。\n\n❌ A：逐账号登控制台截图是纯手工巡检，慢且不可持续，多账号组织的日常巡检正要摆脱这种方式。\n❌ B：全量导出再自建报表把监控做成了数据工程，链路重、时效差，仪表盘原生就支持跨账号展示。\n❌ C：复制仪表盘没有跨账号数据能力，两地数据仍各在各的控制台里，还得逐个登录看。\n\n📌 关键概念：跨账号一张图靠两点——部件指定来源账号与区域、监控账户与源账号建立授权；授权撤销立即失效。","s":"自编·1.1.4"},{"id":"D1-005","d":1,"t":"single","q":"Northwind 的审计人员要在验收当天查看一套 CloudWatch 仪表盘，对方没有 AWS 账号。哪种共享方式最稳妥","o":[{"l":"A","t":"导出仪表盘快照发给对方查看，不开放公开共享"},{"l":"B","t":"开启仪表盘的公开共享链接，任何拿到链接的人都能看"},{"l":"C","t":"把根用户凭证借给审计人员登录控制台查看"},{"l":"D","t":"让审计人员先加入公司的 AWS Organizations 再登录查看"}],"a":["A"],"e":"✅ 正确项：A。仪表盘可以导出为快照分享给团队外的人，快照是一次性交付，不开放持续访问面；公开共享则有数据暴露面，指定账号共享或发快照是更稳妥的口径。关联考点：域 1.1.4「创建与管理跨账号跨区域的可共享仪表盘」。\n\n❌ B：公开共享等于把监控数据暴露给任何拿到链接的人，暴露面不可控。\n❌ C：共享根用户凭证违反最小权限与可追溯原则，是严重安全反模式。\n❌ D：看一份仪表盘快照不需要组织成员身份，为此拉人入组织属动作过重。\n\n📌 关键概念：仪表盘共享三形态——公开共享有暴露面、指定账号共享受控、快照一次性交付；给外部看一次性资料首选快照。","s":"自编·1.1.4"},{"id":"D1-006","d":1,"t":"single","q":"Northwind 的值班邮件组订阅了告警通知的 SNS 主题，告警已触发且状态是 ALARM，但邮件一封都没收到。最该先查什么","o":[{"l":"A","t":"告警的阈值是不是设得太高没到线"},{"l":"B","t":"邮件订阅有没有完成订阅确认，未确认的订阅收不到任何消息"},{"l":"C","t":"SNS 主题是否支持邮件协议"},{"l":"D","t":"给主题开启服务端加密再重试"}],"a":["B"],"e":"✅ 正确项：B。SNS 的邮件与 HTTP 订阅需要订阅确认，没点确认链接的订阅处于未确认状态，任何消息都收不到——这是「配了没收到」的头号原因；告警已进 ALARM 说明触发侧正常，通知链路的订阅状态是第一现场。关联考点：域 1.1.5「配置 AWS 服务发送通知到 Amazon SNS」。\n\n❌ A：题干已说明告警触发进入 ALARM，阈值与判定环节已被排除，方向偏了。\n❌ C：SNS 订阅端支持邮件、短信、Lambda、HTTP 端点等多种协议，邮件是原生支持的。\n❌ D：服务端加密针对敏感内容落盘，与订阅未确认导致收不到通知是两件事。\n\n📌 关键概念：SNS 广播链路「主题是出口、订阅要确认」；邮件与 HTTP 订阅没确认等于没订，先查确认状态再查别的。","s":"自编·1.1.5"},{"id":"D1-007","d":1,"t":"single","q":"Northwind 的队列机每周三晚例行积压，值班人员每周爬起来人工重启队列服务。要把这个故障做成全自动闭环，哪条链路最贴合","o":[{"l":"A","t":"排一张值班轮换表，把周三晚的响应责任落实到人"},{"l":"B","t":"只配一条队列深度告警发 SNS 通知，让人收到后继续手工处理"},{"l":"C","t":"队列深度告警经 EventBridge 路由到 Systems Manager，自动执行重启队列服务的 runbook，完成事件回发通知"},{"l":"D","t":"把队列机换成更高规格实例，避免再积压"}],"a":["C"],"e":"✅ 正确项：C。自动修复闭环是检测、判断、执行三段：告警盯指标是检测，事件路由到修复目标是链路，runbook 执行重启是修复动作，执行记录与完成通知让人从事后查看——把例行故障从值班事项变成执行记录的标准链路。关联考点：域 1.2.1「分析性能指标并自动化修复策略」。\n\n❌ A：轮换表只是把人工响应组织得更好，故障本身还是人来处理，没有自动化。\n❌ B：只配告警发通知缺执行段，告警响了你还得爬起来手工重启，闭环没闭上。\n❌ D：换规格是对症程度最低的动作，例行积压的根因在队列服务，指标先定位瓶颈再谈换配。\n\n📌 关键概念：自动修复三段闭环——检测靠告警、判断靠指标加审计、执行靠 Lambda 或 runbook；缺执行段就还是人工。","s":"自编·1.2.1"},{"id":"D1-008","d":1,"t":"single","q":"Northwind 要把一组自动修复动作推上线，运维负责人要求先防住「自动修复把故障放大」。哪组护栏是对的","o":[{"l":"A","t":"修复动作先全量启用，出了问题再逐个关停"},{"l":"B","t":"自动修复执行的是预置动作，天然安全不需要额外护栏"},{"l":"C","t":"护栏会拖慢修复速度，能省的先省掉"},{"l":"D","t":"动作执行前留记录、失败后能通知，并配上审批步骤、超时控制与速率控制"}],"a":["D"],"e":"✅ 正确项：D。自动化修复的护栏：动作前留执行记录可回溯，失败后通知到人能兜底，runbook 侧再配审批步骤、超时控制与速率控制，把「批量做错」的风险圈住——先小范围试点再全量是上线前的标准动作。关联考点：域 1.2.1「分析性能指标并自动化修复策略」。\n\n❌ A：先全量再回退等于拿生产环境做试验，自动化的错误是批量的，代价被放大。\n❌ B：预置动作只是内容标准化，护栏与动作内容无关，没有护栏的自动化照样能放大故障。\n❌ C：护栏的少量延迟换来的是故障可控，省护栏省掉的是兜底能力。\n\n📌 关键概念：自动化修复的护栏四件——执行记录、失败通知、审批与超时、速率控制；把「漏做一次」变成「批量做错一次」之前先试点。","s":"自编·1.2.1"},{"id":"D1-009","d":1,"t":"single","q":"Northwind 的队列积压修复规则上线后「没动静」：事件明明发生了，目标 Lambda 没有被调用。第一步排查哪里","o":[{"l":"A","t":"查死信队列里有没有积压的事件，再核事件模式与事件体的字段大小写是否一致"},{"l":"B","t":"联系 AWS 支持重启 EventBridge 服务"},{"l":"C","t":"给目标 Lambda 加 AdministratorAccess 权限再说"},{"l":"D","t":"把规则删掉改成 SNS 主题广播"}],"a":["A"],"e":"✅ 正确项：A。规则不触发的排查顺序：先看事件模式与事件体的字段、大小写是否一致——模式匹配区分大小写；再核规则启用状态、目标资源策略、目标侧限流与死信队列。死信队列里反复投递失败的事件是第一手现场，比翻应用日志快。关联考点：域 1.2.2「使用 EventBridge 路由、富化与投递事件并排障」。\n\n❌ B：EventBridge 是托管服务，不存在用户侧的重启操作，方向就错了。\n❌ C：盲扩权限不解决模式不匹配的问题，还引入越权风险。\n❌ D：换广播通道不改变模式匹配失败的事实，工具换了病因还在。\n\n📌 关键概念：EventBridge 排障四站——模式字段与大小写、规则启用状态、目标资源策略、死信队列兜底；查死信队列拿第一现场。","s":"自编·1.2.2"},{"id":"D1-010","d":1,"t":"single","q":"Northwind 要把「队列机磁盘清理」固化成标准动作：固定步骤、留执行记录、可被事件自动触发、要支持审批与超时控制。用哪个载体最合适","o":[{"l":"A","t":"写成 CloudFormation 模板，变更走栈更新"},{"l":"B","t":"写成 Systems Manager Automation runbook，配好执行角色与触发方式"},{"l":"C","t":"写成 Word 操作手册，放在值班知识库里"},{"l":"D","t":"写成一个常驻 EC2 上的 Cron 脚本，每天定时跑一遍"}],"a":["B"],"e":"✅ 正确项：B。runbook 是运维动作的脚本化手册：一组按序执行的步骤、统一 IAM 执行角色，控制台 CLI SDK 都可触发，也能被 EventBridge 事件自动触发，还支持审批步骤、超时控制与速率控制——固定步骤加留痕加自动触发正对题意。关联考点：域 1.2.3「创建与运行 Systems Manager Automation runbook」。\n\n❌ A：CloudFormation 定义基础设施，runbook 执行运维动作序列，两个东西管的不是一类事。\n❌ C：手册是人看的文档，没有执行、留痕与触发能力。\n❌ D：常驻 Cron 脚本只有定时一种触发方式，审批、超时、执行记录与权限治理都要自己造。\n\n📌 关键概念：runbook 三步走——选或写、配执行角色、选触发方式；预置库里 AWS-开头的现成货先找一遍，没有再自定义。","s":"自编·1.2.3"},{"id":"D1-011","d":1,"t":"multiple","q":"Northwind 新上一套工作负载：AI 训练集群、Lambda 订单服务、容器化推理服务与日常配置变更审计。哪些监控选型是对的（选所有适用项）","o":[{"l":"A","t":"训练集群的 GPU 利用率靠 CloudWatch 代理采集进 CloudWatch"},{"l":"B","t":"Lambda 函数的调用次数与错误率开箱即有，不需要装代理"},{"l":"C","t":"查「谁改了配置」去翻应用日志就能找到答案"},{"l":"D","t":"容器化推理服务的时间序列指标走 Amazon Managed Service for Prometheus 口径更顺"},{"l":"E","t":"CloudTrail 负责采集实例的内存与磁盘这类系统级指标"}],"a":["A","B","D"],"e":"✅ 正确项：A、B、D。AI 训练任务的 GPU 利用率靠代理采集进 CloudWatch；无服务器负载的指标与日志自动进 CloudWatch、不用装代理；容器与云原生场景的时间序列指标走托管 Prometheus 口径更顺。三个选型都按负载形态对号。关联考点：域 1.1.1「使用 AWS 服务为工作负载配置监控与日志」。\n\n❌ C：「谁改了配置」是审计问题，正解入口是 CloudTrail 的 API 调用记录，应用日志里没有账户层管理操作。\n❌ E：内存与磁盘这类系统级指标靠 CloudWatch 代理采集，CloudTrail 管的是 API 审计，职责错配。\n\n📌 关键概念：按负载形态选工具——无服务器自动有、传统计算装代理、AI 靠代理收 GPU、云原生走 Prometheus、审计认 CloudTrail。","s":"自编·1.1.1"},{"id":"D1-012","d":1,"t":"multiple","q":"Northwind 要把告警通知与安全发现类事件广播出去：值班邮件组、值班短信网关、工单系统的 HTTP 端点都要同时收到。下列做法哪些符合 SNS 机制（选所有适用项）","o":[{"l":"A","t":"一个主题同时挂邮件、短信、HTTP 等多种协议的订阅"},{"l":"B","t":"邮件订阅配置完成后立即生效，不需要任何确认动作"},{"l":"C","t":"只通知一个 Lambda 做处理时，SNS 比 EventBridge 更直接"},{"l":"D","t":"主题承载敏感内容时配置服务端加密"},{"l":"E","t":"一个 SNS 主题只能挂一种协议的订阅"}],"a":["A","D"],"e":"✅ 正确项：A、D。SNS 是发布订阅式通知，一个主题可以同时挂邮件、短信、Lambda、HTTP 端点等多种协议的订阅，发布一次全部订阅方同时收到；敏感内容走主题要配服务端加密。关联考点：域 1.1.5「配置 AWS 服务发送通知到 Amazon SNS」。\n\n❌ B：邮件与 HTTP 订阅需要订阅确认，未确认的订阅收不到任何消息，这是通知链路「配了没收到」的头号原因。\n❌ C：只投递给一个 Lambda 做处理，直接用 EventBridge 更合适，SNS 反而多一跳。\n❌ E：一个主题多协议并存正是主题扇出的设计，不是单协议。\n\n📌 关键概念：主题是通知的统一出口，订阅方换人不动发布方；广播用主题扇出，单点处理用 EventBridge 直连。","s":"自编·1.1.5"},{"id":"D1-013","d":1,"t":"single","q":"Northwind 一组报表实例的 CPU 利用率长期在 5%上下，账单却按大规格付。优化动作哪条对","o":[{"l":"A","t":"用 Compute Optimizer 按利用率指标拿规格建议，结合资源标签确认业务归属后调低规格"},{"l":"B","t":"直接把规格翻倍，为业务增长留足余量"},{"l":"C","t":"全部换成 Spot 实例压成本"},{"l":"D","t":"先给这组实例加一层缓存再说"}],"a":["A"],"e":"✅ 正确项：A。长期低利用率是纠正规格（right-sizing）的典型信号：先用指标定瓶颈类型与利用水平，用标签圈准业务归属避免优化错对象，再用 Compute Optimizer 的规格建议换档，负载稳定时这条路径收益最快。关联考点：域 1.3.1「优化计算资源并修复性能问题」。\n\n❌ B：低利用率的负载再翻倍规格，成本更高利用率更低，方向反了。\n❌ C：Spot 是采购模式的选择，与规格错配无关，且报表负载是否可中断是另一个问题。\n❌ D：缓存治的是读压力与后端负载，不解决实例规格过大的账单问题。\n\n📌 关键概念：计算优化先分层——指标定瓶颈、标签圈归属、Compute Optimizer 给建议；负载忽高忽低时配 Auto Scaling 比换规格有效。","s":"自编·1.3.1"},{"id":"D1-014","d":1,"t":"single","q":"Northwind 的报表库每晚跑批时 EBS 卷 I/O 延迟飙升，白天一切正常。检查发现 gp2 卷的突发余额被跑批烧光。下一步怎么修","o":[{"l":"A","t":"立即把卷升级为 io2，一步到位"},{"l":"B","t":"换成 gp3 并把 IOPS 配置到跑批所需水平"},{"l":"C","t":"把卷卸载后挂到另一个可用区的实例上"},{"l":"D","t":"每晚跑批前手动扩容卷容量"}],"a":["B"],"e":"✅ 正确项：B。突发余额烧光是突增型卷掉速的经典根因：gp3 的 IOPS 与吞吐可以独立于容量单独配置，把 IOPS 配到跑批所需水平后延迟平稳，且 gp3 通常比 gp2 更省费用。关联考点：域 1.3.2「分析 EBS 性能指标、排障并优化卷类型」。\n\n❌ A：io2 留给真需要极致 IOPS 的关键负载，不推荐无脑升 io2，先确认瓶颈在卷上再谈档位。\n❌ C：卷跨不了可用区，实例与卷本来就在同一可用区，移动挂载不解决余额问题。\n❌ D：每晚手工扩容是治标动作，跑批模式的根因是突发余额机制，换卷型才治本。\n\n📌 关键概念：EBS 排障顺序——先看读写指标与延迟，再看突发余额，最后确认实例与卷同可用区；gp3 可独立调 IOPS 是降费首选。","s":"自编·1.3.2"},{"id":"D1-015","d":1,"t":"single","q":"Northwind 的大数据作业以顺序读写为主、吞吐量大，要为它选一块块存储卷。哪种卷型对路","o":[{"l":"A","t":"gp3 通用型，按默认基线配置即可"},{"l":"B","t":"io2，取最高性能与持久性档"},{"l":"C","t":"st1 吞吐优化型，面向顺序读写的大数据作业"},{"l":"D","t":"gp2，沿用现有配置不调整"}],"a":["C"],"e":"✅ 正确项：C。三种卷型各对一类场景：st1 是吞吐优化型，专为顺序读写的大数据作业设计；gp3 通用可调；io2 给数据库等关键负载的极致 IOPS。吞吐型负载选 st1 正对号。关联考点：域 1.3.2「分析 EBS 性能指标、排障并优化卷类型」。\n\n❌ A：gp3 是通用型，吞吐上限与计费模型面向通用负载，吞吐密集型作业选吞吐优化型更合算。\n❌ B：io2 卖的是极致 IOPS 与持久性，大数据顺序读写要的是吞吐，花高价买错指标。\n❌ D：gp2 沿用旧配置既不省也不优，突发余额机制还可能掉速。\n\n📌 关键概念：EBS 卷型三对号——gp3 通用可调、io2 极致 IOPS、st1 顺序吞吐；按负载的 IOPS 与吞吐画像选卷。","s":"自编·1.3.2"},{"id":"D1-016","d":1,"t":"single","q":"Northwind 的分店在海外，每天向美东的 S3 桶上传几十 GB 的运单扫描件，上传速度慢。哪条传输路径优化对路","o":[{"l":"A","t":"开启 S3 Transfer Acceleration，客户端经 AWS 边缘节点走优化线路上传"},{"l":"B","t":"把文件切成小块用 multipart upload 并行传，就能解决跨洲线路质量问题"},{"l":"C","t":"在分店本地自建一台代理服务器中转上传"},{"l":"D","t":"改用 AWS DataSync 做这次批量搬迁"}],"a":["A"],"e":"✅ 正确项：A。Transfer Acceleration 让客户端到 AWS 边缘走优化线路再进骨干网，跨洲远距离上传收益最明显，正对分店上传慢的场景。关联考点：域 1.3.3「实施与优化 S3 性能策略」。\n\n❌ B：multipart 把大文件切块并行上传，提高的是吞吐与失败重传效率，不改善跨洲线路本身的路径质量，两个手段管两件事。\n❌ C：自建代理引入运维负担，且不享有 AWS 边缘网络的优化路径。\n❌ D：DataSync 面向本地到 S3、S3 到 S3 的批量数据搬迁并带校验，不是日常上传提速工具。\n\n📌 关键概念：S3 传输族分工——Transfer Acceleration 管远距离路径、multipart 管大文件切块并行、DataSync 管批量搬迁；区域内上传用加速反而多绕一跳。","s":"自编·1.3.3"},{"id":"D1-017","d":1,"t":"single","q":"Northwind 的运单日志写入 S3 后前 30 天常被查询，之后几乎不再访问但仍要保留数年备审计。存储成本怎么压","o":[{"l":"A","t":"给上传开启 Transfer Acceleration 降低存储费"},{"l":"B","t":"用 S3 生命周期策略，30 天后自动转入低频访问档，长期不动的再转归档档"},{"l":"C","t":"开启桶版本控制防止旧对象被覆盖"},{"l":"D","t":"把 30 天内还会热读的数据也直接转进归档档"}],"a":["B"],"e":"✅ 正确项：B。生命周期策略按对象年龄自动转档：热数据留标准档，30 天不访问转低频档，长期不动的转归档档，访问模式清晰的日志类数据这样分层最省。关联考点：域 1.3.3「实施与优化 S3 性能策略」。\n\n❌ A：Transfer Acceleration 是传输路径优化工具，与存储档位费用无关。\n❌ C：版本控制防的是误覆盖误删，不改变存储档位与费用。\n❌ D：还会热读的数据转归档档，取回费用与延迟反而拖垮使用，「省费用变成拖性能」。\n\n📌 关键概念：存储族策略管「省」——生命周期按访问模式自动分层；先看访问模式再定规则，别把热数据冷存。","s":"自编·1.3.3"},{"id":"D1-018","d":1,"t":"single","q":"Northwind 的路线规划服务跑在十台 Linux EC2 上，要共享同一份地图数据，容量随业务增长自动伸缩。共享存储选哪个","o":[{"l":"A","t":"每台各自挂 EBS 卷，用脚本定期双向同步"},{"l":"B","t":"把地图数据放 S3，每台启动时全量下载到本地盘"},{"l":"C","t":"FSx for Windows File Server，用 SMB 协议共享"},{"l":"D","t":"Amazon EFS，NFS 协议弹性文件系统，容量自动伸缩"}],"a":["D"],"e":"✅ 正确项：D。共享存储三候选按协议与形态对号：EFS 是 NFS 协议的弹性文件系统，Linux 多实例共享读写、容量自动伸缩，正对十台 EC2 挂同一份地图数据的需求。关联考点：域 1.3.4「评估与选择共享存储方案并优化」。\n\n❌ A：脚本双向同步既慢又容易不一致，十台机器的同步拓扑复杂度随数量上升。\n❌ B：每台全量下载占用本地盘与启动时间，数据更新后各台版本漂移。\n❌ C：FSx for Windows File Server 面向 Windows 与 SMB 场景，Linux 共享首选 NFS。\n\n📌 关键概念：共享存储对号——EFS 管 Linux 弹性、FSx 按协议细分（Lustre 高性能、Windows SMB）、S3 Files 做文件接口桥；按应用接口选型。","s":"自编·1.3.4"},{"id":"D1-019","d":1,"t":"single","q":"Northwind 的 RDS 报表库 CPU 长期在 80%上下。要定位到根因层再动手，第一步看什么","o":[{"l":"A","t":"直接升级实例规格，先压下来再说"},{"l":"B","t":"重启数据库实例释放资源"},{"l":"C","t":"进 Performance Insights 看 Top SQL 与等待事件，确认瓶颈在哪个查询、哪种排队"},{"l":"D","t":"加一台只读副本分走流量"}],"a":["C"],"e":"✅ 正确项：C。Performance Insights 把数据库时间逐条拆开：每条 SQL 占多少、卡在哪种等待事件上——等 CPU 才是计算瓶颈，等 I/O 或等锁另有解法。先看等待事件定根因，慢查询加索引或改写，连接风暴才上 RDS Proxy，升配是最后一步。关联考点：域 1.3.5「监控 Amazon RDS 指标并调整配置提升性能」。\n\n❌ A：CPU 高不等于要升配，瓶颈常在查询、I/O 或锁上，升配是最后一步不是第一步。\n❌ B：重启释放的是瞬时资源占用，查询画像没变，起来还是老样子。\n❌ D：只读副本分的是读流量，瓶颈在哪还没定位就加副本，可能花了钱没治到病。\n\n📌 关键概念：数据库调优从等待事件下手——Top SQL 加等待事件定根因；连接风暴的解法是 RDS Proxy，不是升配。","s":"自编·1.3.5"},{"id":"D1-020","d":1,"t":"single","q":"Northwind 的分布式协调服务只有三个节点，曾出现一个节点故障后另外两个接连出事的情况。要降低同物理机连环故障的风险，置放群组怎么选","o":[{"l":"A","t":"cluster 置放群组，把三个节点塞进同一物理机就近互连"},{"l":"B","t":"partition 置放群组，按分区感知故障域"},{"l":"C","t":"不配置放群组，用默认分布就行"},{"l":"D","t":"spread 置放群组，三个节点摊到不同物理机"}],"a":["D"],"e":"✅ 正确项：D。spread 把少量关键实例摊到不同物理机，每个组内每台物理机最多放一个实例（每组上限七实例），单物理机故障不再连环带走多个节点，正对三节点协调服务的防连环诉求。关联考点：域 1.3.6「实施、监控与优化 EC2 实例及其存储与网络能力」。\n\n❌ A：cluster 求近换低延迟高带宽，代价是物理风险集中，与防连环故障的目标相反。\n❌ B：partition 面向 Hadoop、EMR 这类按分区感知故障域的大数据系统，三节点小集群用不上分区拓扑。\n❌ C：默认分布不保证节点落在不同物理机，连环故障风险没有被显式管理。\n\n📌 关键概念：置放群组三策略方向相反——cluster 求近、spread 求散、partition 求拓扑；少量关键实例防连环选 spread。","s":"自编·1.3.6"},{"id":"D1-021","d":1,"t":"single","q":"Northwind 一条自定义命名空间指标的告警创建后一直处于 INSUFFICIENT_DATA 状态，没进过 ALARM。按排障判据，第一步查什么","o":[{"l":"A","t":"把告警删掉重建一遍，多半是创建时出了毛病"},{"l":"B","t":"把阈值调低让它尽快触发"},{"l":"C","t":"把单条告警改造成复合告警"},{"l":"D","t":"先查指标本身是否还在上报、代理是否存活、评估周期内有没有数据点，再核统计口径"}],"a":["D"],"e":"✅ 正确项：D。数据不足最常见的三个原因：指标根本没在报（代理挂了）、评估周期内没有数据点（周期设得比产出频率短）、统计口径选错。先查指标本身再查告警配置，是这个状态的排障顺序。关联考点：域 1.1.3「配置、识别与排障 CloudWatch 告警」。\n\n❌ A：删掉重建不查指标侧，同样的数据不足状态会再出现一遍。\n❌ B：阈值高低影响的是触发判定，数据点都不够时调阈值没有意义。\n❌ C：复合告警是组合多条告警降噪用的，治不了单条告警的数据不足。\n\n📌 关键概念：告警三状态 OK、ALARM、INSUFFICIENT_DATA；数据不足先查「数据在不在」，再查周期与口径。","s":"自编·1.1.3"},{"id":"D1-022","d":1,"t":"multiple","q":"Northwind 在设计「队列积压自动修复」闭环并准备上线。下列哪些环节的设计是对的（选所有适用项）","o":[{"l":"A","t":"检测环节靠值班人员盯屏幕，人工发现异常后打电话启动流程"},{"l":"B","t":"执行环节由 Lambda 做轻量动作，重活交给 Systems Manager"},{"l":"C","t":"判断环节事后用 CloudTrail 回查「谁在什么时候改了什么」，确认根因"},{"l":"D","t":"Kiro 与 AWS DevOps Agent 担任修复动作的执行主体，Lambda 与 Systems Manager 退场"},{"l":"E","t":"修复动作上线即对全部实例生效，先不设审批与速率控制"}],"a":["B","C"],"e":"✅ 正确项：B、C。闭环三段里：执行段 Lambda 做轻量动作（重启进程、清缓存）、重活交给 Systems Manager；判断段事后用 CloudTrail 回查变更记录确认根因。两段设计都符合机制。关联考点：域 1.2.1「分析性能指标并自动化修复策略」。\n\n❌ A：检测靠人盯屏幕就没有自动化可言，检测段的正解是 CloudWatch 告警盯指标。\n❌ D：Kiro 与 AWS DevOps Agent 定位是辅助分析与根因建议，执行主体仍是 Lambda 与 Systems Manager，说它们取代执行层与官方口径相反。\n❌ E：上线即全量且无审批与速率控制，等于把「漏做一次」直接升级成「批量做错一次」，先试点再全量。\n\n📌 关键概念：三段闭环各就各位——检测靠告警、执行靠 Lambda 加 runbook、判断靠指标加 CloudTrail；新助手只辅助分析不执行。","s":"自编·1.2.1"},{"id":"D2-003","d":2,"t":"single","q":"Northwind 大促当晚订单量涨十倍，要让队列机组自动跟上涨幅、大促结束自动缩回。伸缩策略选哪种","o":[{"l":"A","t":"目标追踪策略盯 ASGAverageCPUUtilization，目标值设 60%，加减台数系统自己算"},{"l":"B","t":"手动伸缩，当晚运维在控制台逐台加机器"},{"l":"C","t":"步进伸缩按越线幅度分档，为大促场景手工设好几档动作"},{"l":"D","t":"预测伸缩按历史曲线提前扩容应对突发"}],"a":["A"],"e":"✅ 正确项：A。目标追踪是最常用的动态伸缩策略：盯一个指标、给一个目标值，该加几台减几台系统自己算。大促这种「流量涨十倍、过去后要缩回」的场景，盯 CPU 均值给目标值正合适，账单只多付高峰那几个小时。关联考点：域 2.1.1「在计算环境中配置与管理伸缩机制」。\n\n❌ B：手动伸缩靠人盯，大促当晚的反应速度与准确度都不可控，谈不上弹性。\n❌ C：步进按越线幅度分档动作，适合要分档快慢的场景，大促盯指标定目标用目标追踪更直接，分档参数反而难调。\n❌ D：预测伸缩按历史流量曲线提前扩，对规律峰锦上添花，对突发流量来不及。\n\n📌 关键概念：伸缩四策略各配各的节奏——手动一次性、计划可预期、动态盯指标、预测看历史；目标追踪给目标值，加减台数系统算。","s":"自编·2.1.1"},{"id":"D2-004","d":2,"t":"single","q":"Northwind 的在线业务每天早晚高峰高度可预期，峰值时段固定。要在高峰前把容量提前扩到位，选哪种伸缩方式","o":[{"l":"A","t":"动态伸缩，让指标越线后再自动加机器"},{"l":"B","t":"计划伸缩，按日历定时在高峰前扩容"},{"l":"C","t":"手动伸缩，每天早高峰前运维手动加台数"},{"l":"D","t":"目标追踪策略，把 CPU 目标值设得更高"}],"a":["B"],"e":"✅ 正确项：B。计划伸缩（scheduled scaling）按日历定时扩容：早晚高峰这种时间点可预期的负载，在峰前定时把容量扩到位，不用等指标越线再反应。关联考点：域 2.1.1「在计算环境中配置与管理伸缩机制」。\n\n❌ A：动态伸缩等指标越线才动作，扩容有滞后期，可预期的高峰没必要事后反应。\n❌ C：每天手工加减不可持续，人忘了就漏，正是伸缩自动化要消灭的动作。\n❌ D：把目标值调高只会让系统容忍更高的利用率，不是提前扩容的机制。\n\n📌 关键概念：伸缩按触发方式分四档；时间可预期的峰用计划伸缩提前扩，指标驱动的波动用动态伸缩跟着走。","s":"自编·2.1.1"},{"id":"D2-005","d":2,"t":"single","q":"Northwind 的队列机组夜里流量回落，Auto Scaling 将缩容实例。团队担心缩容环节出问题，哪条认识是对的","o":[{"l":"A","t":"缩容是自动的就不会有风险，放心让它缩"},{"l":"B","t":"把最小实例数设为 0，夜里完全缩空最省钱"},{"l":"C","t":"缩容瞬间会断开在途连接，最少台数别设零，要留缓冲"},{"l":"D","t":"干脆禁用缩容，只扩不缩最稳"}],"a":["C"],"e":"✅ 正确项：C。缩容跟扩容一样有风险：缩容瞬间断开连接，正在处理的请求会受影响，所以最少台数别设零，连接断开要有缓冲；按业务基线定最小值，缩容的节奏也要留余地。关联考点：域 2.1.1「在计算环境中配置与管理伸缩机制」。\n\n❌ A：「缩容没有风险」是经典误区，断连与容量触底都是真实风险。\n❌ B：最小台数设零等于夜里把机组清空，冷启动慢的应用回不来，业务一上来直接裸奔。\n❌ D：禁用缩容就放弃了弹性的一半，夜里白白付费，与弹性目标相反。\n\n📌 关键概念：缩容留余地——最少台数保命、断连留缓冲；扩得快也要缩得稳。","s":"自编·2.1.1"},{"id":"D2-006","d":2,"t":"single","q":"Northwind 的货物轨迹查询页每秒上千次请求，数据库 CPU 打满；查询结果读多写少、容忍短暂陈旧。先上哪层缓存卸载","o":[{"l":"A","t":"给数据库加只读副本分担读流量"},{"l":"B","t":"给 DynamoDB 表挂 DAX 缓存"},{"l":"C","t":"直接升级数据库实例规格"},{"l":"D","t":"查询结果放进 ElastiCache for Redis，走缓存旁路模式"}],"a":["D"],"e":"✅ 正确项：D。应用层缓存用 ElastiCache（托管 Redis 或 Memcached）：应用先查缓存、未命中才查数据库并回填，这套叫缓存旁路模式（cache-aside），过期靠 TTL 控制。读多写少、容忍短暂陈旧的数据正适合，命中率高时后端压力成比例下降。关联考点：域 2.1.2「用 AWS 服务实施缓存以增强动态伸缩」。\n\n❌ A：只读副本能分读，但每加一份都是常驻成本；缓存先把重复读卸掉，命中率达标后高峰期连副本都可能不用加，顺序上先缓存更省。\n❌ B：DAX 是 DynamoDB 的内存缓存，本场景数据库不是 DynamoDB，服务对象错配。\n❌ C：升配治标，命中率不解决，流量再涨还得再升，缓存层卸载的是请求本身。\n\n📌 关键概念：缓存两层各挡一段——CloudFront 挡边缘静态、ElastiCache 挡应用旁路；命中率是缓存层的命根，掉下来后端照样被打爆。","s":"自编·2.1.2"},{"id":"D2-007","d":2,"t":"single","q":"Northwind 的静态地图瓦片被全球司机端 App 高频拉取，源站跨区流量费与压力都高。用哪个服务把内容送到用户跟前","o":[{"l":"A","t":"CloudFront 把瓦片缓存在全球边缘节点，用户就近取"},{"l":"B","t":"ElastiCache 给源站加一层应用缓存"},{"l":"C","t":"给源站实例升级带宽与规格"},{"l":"D","t":"在每个大区各建一套全量瓦片副本站"}],"a":["A"],"e":"✅ 正确项：A。边缘缓存层：CloudFront 把静态内容按缓存键与 TTL 缓在全球边缘节点，用户就近取，回源次数与跨区流量都降，源站压力卸载——静态瓦片正是边缘缓存的教科书场景。关联考点：域 2.1.2「用 AWS 服务实施缓存以增强动态伸缩」。\n\n❌ B：ElastiCache 是应用旁路缓存，服务的是应用查库，不在用户与源站之间的边缘路径上。\n❌ C：升带宽与规格是硬扛，回源流量没降、跨区费用没降，治标且贵。\n❌ D：各大区自建全量副本，存储翻倍、一致性同步与治理负担全要自己背。\n\n📌 关键概念：两层缓存分工——CloudFront 挡边缘（静态内容、TTL、就近返回）、ElastiCache 挡应用旁路（查库回填）；静态内容全球分发认 CloudFront。","s":"自编·2.1.2"},{"id":"D2-008","d":2,"t":"single","q":"Northwind 的 Aurora 报表库白天跑批、晚上空闲，账单常年按峰值容量付。要按需升降、只付用到的部分，怎么改","o":[{"l":"A","t":"固定预置容量不变，夜里手动停库省钱"},{"l":"B","t":"迁到 Aurora Serverless v2，按容量单位自动升降，夜里自动缩到最小容量"},{"l":"C","t":"换引擎迁到 DynamoDB 按需模式"},{"l":"D","t":"加只读副本夜里顶班"}],"a":["B"],"e":"✅ 正确项：B。Aurora Serverless v2 按容量单位自动升降，波动负载只付用到的部分：白天跑批自动升，夜里空闲自动缩到最小容量，正对「白天重夜里空」的报表库画像。关联考点：域 2.1.3「配置与管理 AWS 托管数据库的伸缩」。\n\n❌ A：夜里手动停库牺牲可用性，启停操作与预热都是管理负担，不是按需伸缩机制。\n❌ C：换引擎意味着应用重写与数据迁移，为容量计费模式做引擎迁移属动作过重。\n❌ D：只读副本是分读的手段，不改变主库的容量与计费模式，夜里也不「顶班」。\n\n📌 关键概念：托管数据库伸缩三路——纵向换规格、横向加只读副本、无服务器化按需升降；波动负载的无服务器化只付用到的部分。","s":"自编·2.1.3"},{"id":"D2-009","d":2,"t":"single","q":"Northwind 的 DynamoDB 订单表流量忽高忽低：平时平稳、大促当晚峰值跳十倍，容量规划反复踩坑。容量模式怎么选","o":[{"l":"A","t":"预置容量按平时流量配，大促当晚手动改表"},{"l":"B","t":"预置容量直接按十倍峰值拉满，一步到位"},{"l":"C","t":"按需容量模式，按请求计费，免容量规划"},{"l":"D","t":"全局表做多区域副本分摊流量"}],"a":["C"],"e":"✅ 正确项：C。DynamoDB 按需模式（on-demand）按请求计费、免容量规划，流量忽高忽低的负载最省心；代价是单价更高。平时平稳选预置更省，忽高忽低选按需求省心——两条路的适用条件正好相反。关联考点：域 2.1.3「配置与管理 AWS 托管数据库的伸缩」。\n\n❌ A：当晚手动改表赶上零点峰值就是事故窗口，题干已说容量规划反复踩坑，这条路走不通。\n❌ B：按十倍峰值拉满预置，平时九成的容量白付，成本结构最差。\n❌ D：全局表做的是多区域副本，与单区域的容量模式选择是两个维度。\n\n📌 关键概念：DynamoDB 两模式——稳定流量选预置（可再挂 Auto Scaling）、波动流量选按需求省心；单价与省心互为代价。","s":"自编·2.1.3"},{"id":"D2-010","d":2,"t":"single","q":"Northwind 给生产数据库开了 RDS Multi-AZ 部署。上线后有人问：备用实例算不算多了一台读性能。哪条回答是对的","o":[{"l":"A","t":"备用实例平时自动分担读流量，读写都扩了"},{"l":"B","t":"Multi-AZ 直接提升数据库的查询性能"},{"l":"C","t":"主实例故障后要人工执行切换命令"},{"l":"D","t":"备用实例只做同步复制不接流量，要读写分离得另配只读副本"}],"a":["D"],"e":"✅ 正确项：D。Multi-AZ 买的是高可用不是性能：主实例同步复制到备用区，主挂了自动故障转移、连接地址不变；备用平时不接流量。要分读另配只读副本——那是另一份成本与复制延迟的账。关联考点：域 2.2.2「配置容错系统」。\n\n❌ A：备用只做同步复制，说它分读是把「只读副本」的职责安到了 Multi-AZ 备用头上。\n❌ B：同步复制还引入少量同步延迟，性能不升反有一点点代价，说提升性能方向反了。\n❌ C：故障转移是自动的，应用连接串不用改，人工切换不是它的机制。\n\n📌 关键概念：Multi-AZ 管「挂得住」、只读副本管「读得多」，两件事两套配置；高可用与性能是两条独立账目。","s":"自编·2.2.2"},{"id":"D2-011","d":2,"t":"multiple","q":"Northwind 要给查询结果上应用层缓存。下列哪些做法符合缓存机制（选所有适用项）","o":[{"l":"A","t":"写频繁且要强一致的数据优先上缓存"},{"l":"B","t":"缓存层失效后端自然顶得住，不需要设计降级"},{"l":"C","t":"应用先查缓存、未命中才查数据库并回填，这套叫缓存旁路模式"},{"l":"D","t":"缓存命中率是缓存层的关键指标，可在 CloudWatch 里看命中指标"},{"l":"E","t":"缓存一挂全站挂，这是正常代价没法设计"}],"a":["C","D"],"e":"✅ 正确项：C、D。缓存旁路是标准使用模式：先查缓存、未命中回源并回填，过期靠 TTL 控制；命中率是缓存层的命根，命中率高后端压力成比例下降，CloudWatch 里可看命中指标并配告警。关联考点：域 2.1.2「用 AWS 服务实施缓存以增强动态伸缩」。\n\n❌ A：写频繁或要强一致的数据，失效逻辑会拖垮开发节奏，不适合缓存。\n❌ B：缓存层要设计成可降级：缓存失效后端还能顶一阵，不是自然顶得住。\n❌ E：「一挂全站挂」恰是没做降级设计的后果，把它当正常代价把反模式说成了常态。\n\n📌 关键概念：缓存旁路三件套——先查后回填、TTL 管过期、命中率配告警；缓存是卸载不是保险，降级设计要先行。","s":"自编·2.1.2"},{"id":"D2-012","d":2,"t":"multiple","q":"Northwind 要用 AWS Backup 统一管 EC2、EBS、RDS 与 DynamoDB 的备份。哪些做法符合备份治理（选所有适用项）","o":[{"l":"A","t":"用 team=nw-prod 标签圈资源挂进备份计划，新资源带标签自动被覆盖"},{"l":"B","t":"备份计划里配跨区域复制，防区域级故障时主数据和备份一起没了"},{"l":"C","t":"备份统一放在主数据同区域最方便管理"},{"l":"D","t":"备份计划建好即高枕无忧，恢复不需要演练"},{"l":"E","t":"所有场景一律套 AWS Backup 统一计划，包括只有一个库的单 RDS 实例"}],"a":["A","B"],"e":"✅ 正确项：A、B。用标签圈资源挂计划，新资源上线自动被覆盖；计划里配跨区域复制，防区域级故障时主备一起没——备份要跨区是灾备纪律。关联考点：域 2.3.1「用 AWS 服务自动化快照与备份」。\n\n❌ C：备份放同区域，区域故障时与主数据一起没，跨区复制正是为这个风险准备的。\n❌ D：恢复没演练过的备份等于没有备份，按需触发与恢复演练是备份有效性的证明方式。\n❌ E：单一 RDS 库用自带自动快照就够，不必再套一层，「一律套」把适用条件说反了。\n\n📌 关键概念：AWS Backup 四步铺——建计划、标签圈资源、保管库分域、按需触发加演练；跨区复制与保管库锁是两条硬纪律。","s":"自编·2.3.1"},{"id":"D2-013","d":2,"t":"single","q":"Northwind 的应用层要跨可用区容错：一个机房故障业务不断。Auto Scaling 组与 ALB 怎么配","o":[{"l":"A","t":"子网全放单可用区，省下跨区流量费"},{"l":"B","t":"Auto Scaling 组把子网铺到多个可用区，实例自动分散；ALB 跨可用区监听，一个区挂了流量自动走另一个区"},{"l":"C","t":"在每个可用区手工各开一台实例，各自绑弹性 IP 对外"},{"l":"D","t":"关闭 Auto Scaling 的实例健康检查，避免误替换"}],"a":["B"],"e":"✅ 正确项：B。应用层的多可用区自己拼：Auto Scaling 组把子网铺到多个可用区，实例自动分散；ALB 跨可用区监听，单区故障流量自动走另一个区。可用区是同区域内电力与网络相互独立的机房组，这样配单区故障不伤业务。关联考点：域 2.2.2「配置容错系统」。\n\n❌ A：单可用区正是单机房单点，跨区流量费的节省换来的是可用性归零。\n❌ C：手工各开一台既没有弹性也没有自动摘除，可用区故障还得人扑上去。\n❌ D：健康检查关闭后坏实例不会被替换，容错能力反而被拆掉。\n\n📌 关键概念：可用区防机房故障、区域防区域故障，两个等级两套方案；应用层跨区靠多子网加跨区均衡。","s":"自编·2.2.2"},{"id":"D2-014","d":2,"t":"single","q":"Northwind 盘点数据层：哪些托管服务的数据分布开箱即得跨多个可用区，不需要自己另配多可用区部署","o":[{"l":"A","t":"自建在 EC2 单机上的 MySQL"},{"l":"B","t":"挂给实例的单块 EBS 卷"},{"l":"C","t":"DynamoDB 表与 S3 桶里的对象"},{"l":"D","t":"单可用区部署的 RDS 实例"}],"a":["C"],"e":"✅ 正确项：C。托管服务自带容错：DynamoDB 与 S3 的数据自动跨多个可用区存放，开箱即得；Aurora 数据天然分布在三个可用区。自己要另配 Multi-AZ 的是 RDS 这类部署形态可选的服务。关联考点：域 2.2.2「配置容错系统」。\n\n❌ A：单机 MySQL 没有任何自动副本，机器坏数据就不可用，属于自己拼容错的对象。\n❌ B：EBS 卷挂在一个可用区内，卷跨不了可用区，单卷没有跨区能力。\n❌ D：RDS 单可用区部署正是没有容错的形态，要跨区得显式开 Multi-AZ。\n\n📌 关键概念：容错两条路——托管服务自带的（S3、DynamoDB、Aurora）开箱即得；可选拓扑的（RDS Multi-AZ）要显式配置。","s":"自编·2.2.2"},{"id":"D2-015","d":2,"t":"single","q":"Northwind 担心勒索软件加密并删除备份。备份侧要配什么","o":[{"l":"A","t":"备份交给各实例自行保存，分散即安全"},{"l":"B","t":"只保留一份最新备份，勒索拿不到多版本"},{"l":"C","t":"把保管库权限开放给运维全员，出事好抢救"},{"l":"D","t":"给备份保管库配置合规锁（vault lock），锁定期内备份不能被篡改删除"}],"a":["D"],"e":"✅ 正确项：D。保管库锁（backup vault lock）提供合规锁，锁定期内的备份不能被篡改删除，是防勒索、防误删的最后防线；配合跨区复制，区域故障与人为破坏两个风险同时盖住。关联考点：域 2.3.1「用 AWS 服务自动化快照与备份」。\n\n❌ A：分散在各实例的备份与实例同生共死，实例被加密备份一起完。\n❌ B：只留一份最新备份，勒索加密的就是你仅有的那份，连回退点都没有。\n❌ C：权限开放给全员恰恰放大了被篡改删除的面，方向反了。\n\n📌 关键概念：备份防篡改三件套——保管库锁合规锁、跨区复制、权限收紧；锁住的是「删不掉改不了」的时间窗。","s":"自编·2.3.1"},{"id":"D2-016","d":2,"t":"single","q":"Northwind 的备份计划跑了几个月，怎么证明这些备份真顶用","o":[{"l":"A","t":"定期从备份副本做恢复演练，验证数据可完整拉回"},{"l":"B","t":"每天看备份任务状态灯是绿的即可"},{"l":"C","t":"统计备份数量与总大小，越多越安全"},{"l":"D","t":"把保留期设置到最长档位"}],"a":["A"],"e":"✅ 正确项：A。备份有效性的证明是恢复：定期从副本拉数据做恢复演练（比如月度从复制区域拉回一台），任选时间手动触发按需备份验证可恢复性——演练过的备份才算数。关联考点：域 2.3.1「用 AWS 服务自动化快照与备份」。\n\n❌ B：任务成功只说明快照生成了，不等于数据能恢复、应用能起来，状态灯不是有效性证明。\n❌ C：数量与大小和可用性没有因果关系，堆一堆没演练过的备份还是等于没有备份。\n❌ D：保留期拉长增加成本，与「能不能恢复」是两件事。\n\n📌 关键概念：没演练过恢复的备份等于没有备份；按需触发与恢复演练是备份体系的两条腿。","s":"自编·2.3.1"},{"id":"D2-017","d":2,"t":"single","q":"Northwind 的一套内部系统对恢复点要求宽松：丢几个小时数据可接受，成本敏感。恢复方法选哪档","o":[{"l":"A","t":"同步跨区副本，RPO 秒级"},{"l":"B","t":"快照恢复：RPO 等于快照间隔，成本低"},{"l":"C","t":"时间点恢复把日志重放到指定时刻"},{"l":"D","t":"副本提升，主库故障时把跨区副本提为主"}],"a":["B"],"e":"✅ 正确项：B。按 RTO、RPO 反推方法档位：RPO 秒级用同步跨区副本（代价是钱）；RPO 分钟级用时间点恢复；RPO 小时级快照够用、成本最低。丢几小时可接受且成本敏感，快照恢复正对号。关联考点：域 2.3.2「用多种方法恢复数据库」。\n\n❌ A：同步跨区副本是 RPO 秒级的档位，为几小时容忍度付秒级方案的钱，档位错配。\n❌ C：时间点恢复面向分钟级 RPO，日志重放时长随库与时间差增长，几小时容忍度用不上这档精度与成本。\n❌ D：副本提升的卖点是 RTO 最短，平时要付副本的钱，与成本敏感的前提冲突。\n\n📌 关键概念：RTO 管多久能恢复、RPO 管能丢多少；两把尺先定数，再按档位选方法——快照最省、时间点恢复精细、副本提升最快。","s":"自编·2.3.2"},{"id":"D2-018","d":2,"t":"single","q":"Northwind 值班误执行了删除语句，要求最多丢一分钟数据、一刻钟内恢复业务。恢复方法用哪个","o":[{"l":"A","t":"从昨晚的自动快照新建实例恢复"},{"l":"B","t":"把跨区副本提升为新主库"},{"l":"C","t":"时间点恢复（PITR），把日志重放到误删前一分钟的新实例"},{"l":"D","t":"直接在生产库上执行反向语句补数据"}],"a":["C"],"e":"✅ 正确项：C。时间点恢复把日志重放到指定时刻，能回到几分钟前，RPO 小——正对「最多丢一分钟」的要求；恢复成新实例、校验后再切流量，一刻钟内完成正是这套方法的画像。关联考点：域 2.3.2「用多种方法恢复数据库」。\n\n❌ A：昨晚快照的 RPO 是快照间隔，从昨晚到现在几个小时的数据都丢了，超出一分钟红线。\n❌ B：副本提升面向主库故障的接管，误删操作已同步复制到副本，提升出来还是被误删后的状态。\n❌ D：对生产库再动手补数据风险极高，且反向语句无法保证一致性，恢复流程的正解是新实例校验后切换。\n\n📌 关键概念：误删恢复三步——PITR 到新实例、校验数据完整、再切连接串；别直接对生产库动刀。","s":"自编·2.3.2"},{"id":"D2-019","d":2,"t":"single","q":"Northwind 用时间点恢复把被误删的库恢复出来了。接下来按什么流程走","o":[{"l":"A","t":"恢复完成后立即把生产库删掉，把流量指到恢复库"},{"l":"B","t":"先在生产库上跑校验脚本，通过后原地覆盖"},{"l":"C","t":"全员停机等 DBA 逐条人工核对差异"},{"l":"D","t":"在恢复出的新实例上校验数据完整性，确认无误后再把应用连接串切过去"}],"a":["D"],"e":"✅ 正确项：D。误删场景的标准流程是先恢复到新实例，校验数据完整（行数、关键表、业务抽检），确认无误后切连接串——生产库全程不被二次动手，风险隔离在恢复实例上。关联考点：域 2.3.2「用多种方法恢复数据库」。\n\n❌ A：先删生产再切换，中间任何问题都没有退路，顺序颠倒的灾难剧本。\n❌ B：校验应在恢复实例上做，「通过后原地覆盖」又回到对生产库直接动手的老路。\n❌ C：人工逐条核对既慢又不可靠，校验脚本与业务抽检才是可执行路径。\n\n📌 关键概念：恢复流程铁律——新实例隔离校验、切换放最后；别对生产库做二次手术。","s":"自编·2.3.2"},{"id":"D2-020","d":2,"t":"single","q":"Northwind 的运单桶开了 S3 版本控制。一位同事用脚本误覆盖了三天的运单文件，现在要找回旧版本。机制上是怎么回事","o":[{"l":"A","t":"覆盖只是生成了新版本，旧版本仍在桶里，按版本 ID 可取回"},{"l":"B","t":"覆盖后旧版本已被物理删除，只能从备份恢复"},{"l":"C","t":"版本控制挡得住覆盖，挡不住删除"},{"l":"D","t":"对象一旦有版本就不能删除了"}],"a":["A"],"e":"✅ 正确项：A。S3 开启版本控制后，同名的每次写入生成新版本，旧版本不丢：覆盖是新增版本，删除也只是打删除标记（delete marker），旧版本仍在桶里。找回旧版就是列版本、按版本 ID 取回。关联考点：域 2.3.3「为存储服务实施版本控制」。\n\n❌ B：版本控制的要点就是旧版本不丢，说物理删除把机制说反了。\n❌ C：删除同样不破坏旧版本，只是加删除标记，去掉标记就恢复可见。\n❌ D：版本化对象可以被删除（打标记或指定版本删除），「不能删」不成立。\n\n📌 关键概念：版本控制把破坏性操作变成可逆操作——覆盖是加版本、删除是打标记；恢复路径＝列版本、找 ID、取回。","s":"自编·2.3.3"},{"id":"D2-021","d":2,"t":"single","q":"Northwind 开了版本控制后存储费用翻着涨。旧版本怎么治理","o":[{"l":"A","t":"关掉版本控制，费用立刻回落"},{"l":"B","t":"每周安排人工清理旧版本对象"},{"l":"C","t":"把桶清空重建一遍"},{"l":"D","t":"与生命周期联动：旧版本到期自动清理或转低频档"}],"a":["D"],"e":"✅ 正确项：D。版本堆积不清理存储费会翻倍，治法是与生命周期联动：旧版本到期清理，或先转低频档再到期清理，规则化自动执行。版本控制防误覆盖误删与生命周期管费用两件事配合用。关联考点：域 2.3.3「为存储服务实施版本控制」。\n\n❌ A：关掉版本控制丢掉的是误覆盖误删的防护，为省钱拆防护方向反了。\n❌ B：人工每周清旧版本不可持续，量大时清不动，生命周期规则天生就是干这个的。\n❌ C：清空重建丢数据，动作极端。\n\n📌 关键概念：版本控制配生命周期才完整——防护靠版本、费用靠到期规则；旧版本转低频档再清理是标准两段式。","s":"自编·2.3.3"},{"id":"D2-022","d":2,"t":"multiple","q":"Northwind 的 RDS 读压力与连接数最近双双上涨。关于托管数据库伸缩的说法，哪些是对的（选所有适用项）","o":[{"l":"A","t":"只读副本横向分读，但副本有复制延迟，写完马上读的场景要小心陈旧数据"},{"l":"B","t":"连接数暴涨第一时间升实例规格"},{"l":"C","t":"Aurora Serverless v2 按容量单位自动升降，波动负载只付用到的部分"},{"l":"D","t":"DynamoDB 流量稳定时选按需模式更省"},{"l":"E","t":"全局表的用途是单区域内的读写分离"}],"a":["A","C"],"e":"✅ 正确项：A、C。只读副本分读但要记复制延迟的账，写完马上读的场景要小心陈旧数据；Aurora Serverless v2 按容量单位自动升降，波动负载只付用到的部分。两条都与托管数据库伸缩路径一致。关联考点：域 2.1.3「配置与管理 AWS 托管数据库的伸缩」。\n\n❌ B：连接数暴涨先想 RDS Proxy 治理连接（托管连接池），而不是先升配——升配治的是吞吐不是连接风暴。\n❌ D：DynamoDB 流量稳定选预置更省、忽高忽低选按需求省心，这一条把适用条件说反了。\n❌ E：全局表做的是多区域副本，不是单区域读写分离。\n\n📌 关键概念：数据库伸缩三路对号——读压力用副本（记延迟）、连接风暴用 Proxy、波动容量用 Serverless；先定瓶颈类型再选路。","s":"自编·2.1.3"},{"id":"D3-003","d":3,"t":"single","q":"Northwind 的队列机族有五十台机器，每台手工装同一套中间件，装一轮一周，版本越装越乱。要流水线化产出标准镜像，选哪条路","o":[{"l":"A","t":"EC2 Image Builder：组件写成安装脚本，构建后自动测试，再分发到多区域，定时重建"},{"l":"B","t":"手工配好一台做黄金镜像，再手动复制到各区域"},{"l":"C","t":"每台机器开机时用启动脚本现场装依赖，保持一致"},{"l":"D","t":"把整机依赖全部改成容器镜像分发"}],"a":["A"],"e":"✅ 正确项：A。EC2 Image Builder 把黄金镜像流水线化：组件写成脚本、构建后自动测试（起不来的镜像不分发）、分发覆盖在用区域、定时重建让漂移每周收敛一次。长期批量复制同构机器，这条路径收益最大。关联考点：域 3.1.1「创建与管理 AMI 与容器镜像」。\n\n❌ B：手工黄金镜像快但漂移会慢慢吃掉一致性，正是要被流水线取代的传统做法。\n❌ C：开机脚本现场装慢且每台装出差异，五十台批量复制场景下不可取。\n❌ D：整机环境依赖选 AMI，容器面向应用交付；「全部改容器」为流水线目标引入引擎迁移成本，属场景错配。\n\n📌 关键概念：镜像流水线四步——组件脚本化、构建即测试、分发覆盖在用区域、定时重建收敛漂移。","s":"自编·3.1.1"},{"id":"D3-004","d":3,"t":"single","q":"Northwind 的队列机族用手工黄金镜像运行两年，「手工配的机器用久了配置各不相同」。这种现象与治法对应哪组","o":[{"l":"A","t":"这种现象叫漂移，属正常损耗不用治理"},{"l":"B","t":"现象叫快照，治法是提高快照频率"},{"l":"C","t":"现象叫漂移（drift），治法是定时重建黄金镜像排进业务低谷，漂移定期自动收敛"},{"l":"D","t":"现象叫版本控制，治法是给镜像打标签"}],"a":["C"],"e":"✅ 正确项：C。手工配置随时间各自变化的现象就是漂移（drift）；受控的标准模板（黄金镜像）靠定时重建让漂移定期收敛，重建排进业务低谷时段，占资源也占时间。关联考点：域 3.1.1「创建与管理 AMI 与容器镜像」。\n\n❌ A：漂移不是「正常损耗」，放任下去配置各异的机器就是故障温床，恰是要治理的对象。\n❌ B：快照频率治理的是备份时效，与机器间配置不一致没有对应关系。\n❌ D：镜像打标签管的是版本识别与追溯，不改变机器配置漂移的事实。\n\n📌 关键概念：漂移＝配置随时间各自走散；治理＝标准模板加定时重建，让一致性周期性收敛。","s":"自编·3.1.1"},{"id":"D3-005","d":3,"t":"single","q":"Northwind 的应用改成了容器交付，构建出的镜像要有个仓库分发，旧版本与漏洞要有治理。怎么配","o":[{"l":"A","t":"镜像存到 S3 桶，手动管理版本目录"},{"l":"B","t":"镜像留在构建机上，各集群来拉取"},{"l":"C","t":"镜像推到 ECR 后永远保留，保齐全版本"},{"l":"D","t":"镜像推到 ECR，开启漏洞扫描与生命周期策略清理旧版"}],"a":["D"],"e":"✅ 正确项：D。ECR 是托管容器镜像仓库：镜像推上来供 ECS、EKS、容器化的 Lambda 拉取分发；仓库侧带漏洞扫描与生命周期策略清旧版——分发与治理一站式。关联考点：域 3.1.1「创建与管理 AMI 与容器镜像」。\n\n❌ A：S3 手动管版本目录没有镜像层的拉取认证、漏洞扫描与清理机制，全要自建。\n❌ B：镜像留构建机分发既无高可用也无治理，构建机一挂分发就断。\n❌ C：永不清理的仓库版本堆积，存储与检索负担随时间恶化，生命周期策略就是治这个的。\n\n📌 关键概念：容器镜像路径＝构建文件定义内容、推 ECR 分发、漏洞扫描加生命周期策略治理；镜像版本太少是漂移、太多对不上账。","s":"自编·3.1.1"},{"id":"D3-006","d":3,"t":"single","q":"Northwind 要更新生产环境的 CloudFormation 栈，团队想先看清「这次更新会动哪些资源」再执行。用哪个功能","o":[{"l":"A","t":"创建变更集（change set）预览本次会动哪些资源，确认后再执行"},{"l":"B","t":"直接执行更新，出错了靠自动回滚兜底"},{"l":"C","t":"先删除栈再重建，等价于预览"},{"l":"D","t":"在控制台逐个资源截图对比，人工核对差异"}],"a":["A"],"e":"✅ 正确项：A。变更集先预览本次更新会动哪些资源，确认后执行——生产变更的标准动作：先看清单再动手，删改哪些资源一目了然。关联考点：域 3.1.2「用 CloudFormation 与 AWS CDK 创建与管理资源」。\n\n❌ B：直接执行把预览环节整个跳过，回滚是失败后的补救不是预览手段，生产环境不该赌。\n❌ C：删栈会连资源一起删，「等价于预览」完全说反。\n❌ D：人工截图比对既慢又不可持续，变更集就是为这个需求原生提供的。\n\n📌 关键概念：CloudFormation 生命周期三步——模板定义、变更集预览、执行与失败自动回滚；生产更新先看变更集。","s":"自编·3.1.2"},{"id":"D3-007","d":3,"t":"single","q":"Northwind 的团队有编程底子，想在基础设施即代码里做抽象复用与逻辑表达。关于 CDK 的说法哪个对","o":[{"l":"A","t":"CDK 绕开 CloudFormation 直接创建资源，排障不看栈"},{"l":"B","t":"CDK 用编程语言写构造，合成（synth）后仍是 CloudFormation 模板，部署走的还是栈"},{"l":"C","t":"CDK 只支持 TypeScript 一种语言"},{"l":"D","t":"CDK 是命令式脚本执行器，每次运行即时创建资源不留模板"}],"a":["B"],"e":"✅ 正确项：B。CDK（AWS Cloud Development Kit）用 TypeScript、Python 这类编程语言写构造，编译（合成）成 CloudFormation 模板再部署——部署走的还是栈，栈层的治理与排障逻辑通用。关联考点：域 3.1.2「用 CloudFormation 与 AWS CDK 创建与管理资源」。\n\n❌ A：CDK 合成的仍是模板，说绕开 CloudFormation 与机制相反，排障照样看栈。\n❌ C：CDK 支持 TypeScript、Python 等多种语言，不是单语言工具。\n❌ D：CDK 产出声明式模板，不是每次即时执行的命令式脚本。\n\n📌 关键概念：CDK 的增量是「用编程语言写、编译回模板」；构造分三层——L1 直接映射、L2 带默认最佳实践、L3 整场景模式。","s":"自编·3.1.2"},{"id":"D3-008","d":3,"t":"single","q":"Northwind 的工程师上周绕过流程，在控制台上手工改了某资源的安全组。这周模板更新部署前，应先做什么","o":[{"l":"A","t":"什么都不用做，CloudFormation 会自动吸收手工改动"},{"l":"B","t":"把手工改过的资源删掉，让模板重建一份"},{"l":"C","t":"先跑漂移检测对齐模板与实际资源，再决定收敛方式"},{"l":"D","t":"收回全员控制台权限，禁止再登录"}],"a":["C"],"e":"✅ 正确项：C。控制台手工改过的资源再进模板会漂移，部署前先用漂移检测对齐模板与实际配置，再决定是改模板还是改资源——治理动作放在部署前，不在部署后爆雷。关联考点：域 3.1.2「用 CloudFormation 与 AWS CDK 创建与管理资源」。\n\n❌ A：CloudFormation 不会自动吸收模板外的手工改动，漂移一直存在，下次更新可能被覆盖或报错。\n❌ B：删资源重建动作粗暴，先漂移检测看清差异再选收敛路径更稳。\n❌ D：一刀切收回控制台权限不现实，漂移检测才是这个场景的原生工具。\n\n📌 关键概念：漂移检测管「模板外改动」——部署前对齐模板与实际，治理先行；拆小栈是纪律，模板越大越难排错。","s":"自编·3.1.2"},{"id":"D3-009","d":3,"t":"single","q":"Northwind 要把同一套运维底座模板铺到五个账户三个区域。哪个工具干这个活","o":[{"l":"A","t":"逐账户登录控制台手工部署五遍"},{"l":"B","t":"用 AWS RAM 把模板资源共享给各账户"},{"l":"C","t":"把模板文件复制给各账户，各自自行部署"},{"l":"D","t":"CloudFormation StackSets：管理员账户持模板，选目标账户与区域清单，一次铺出一片栈实例"}],"a":["D"],"e":"✅ 正确项：D。StackSets 铺量：一份模板铺到多个账户与区域，一次操作建一片栈，目标账户里跑的栈副本叫栈实例——同构环境批量铺的正解。铺前核对账户与区域清单、沙箱先验证，铺完抽查栈实例状态。关联考点：域 3.1.4「跨多区域与多账户预置与共享资源」。\n\n❌ A：逐账户手工部署没有统一治理，五遍手工就是五份漂移风险。\n❌ B：RAM 共享的是已有资源（子网、托管区这类），不铺模板不建栈，工具用错了段。\n❌ C：复制模板各自部署，版本与节奏失控，「一份模板铺一片」的统一治理不存在。\n\n📌 关键概念：铺量与共享分两手——StackSets 铺一片栈实例，RAM 共享一份资源；铺前核清单，铺后抽查状态。","s":"自编·3.1.4"},{"id":"D3-010","d":3,"t":"single","q":"Northwind 的网络中心账户有三个共享子网，要给开发与测试账户直接挂资源用。哪个做法对","o":[{"l":"A","t":"开发与测试账户各建一套相同网段的子网"},{"l":"B","t":"用 AWS RAM 建资源共享，把三个子网共享给目标账户，资源还是一份不用复制"},{"l":"C","t":"把整个 VPC 迁移给开发账户"},{"l":"D","t":"用 VPC 对等连接把子网共享出去"}],"a":["B"],"e":"✅ 正确项：B。AWS RAM（Resource Access Manager）把已有资源共享给其他账户：勾资源与共享对象，被共享账户接受后直接使用。共享的是使用权不是所有权，子网、Route 53 托管区、中转网关都能这样共享——比逐账户复制省钱省事。关联考点：域 3.1.4「跨多区域与多账户预置与共享资源」。\n\n❌ A：各建一套相同网段造成地址重复与治理分裂，「共享」的题意是资源还是一份。\n❌ C：VPC 整包迁移是极端动作，网络中心的存在意义就是资源留在中心共享出去。\n❌ D：对等连接连的是两个 VPC 的网络互通，不能把子网「共享」给对方账户挂资源。\n\n📌 关键概念：RAM 共享使用权不转移所有权；网络类资源跨账户共用，共享比复制省。","s":"自编·3.1.4"},{"id":"D3-011","d":3,"t":"single","q":"Northwind 千台实例要打补丁，原先两个人做一周。要自动化并管住覆盖率，用哪套","o":[{"l":"A","t":"逐台 Session Manager 登录手工执行升级命令"},{"l":"B","t":"用 Run Command 对全部实例一次下发升级命令"},{"l":"C","t":"Patch Manager：补丁基线定批准范围，维护窗口定批处理时段，标签圈目标分组错峰，覆盖率报表每周自动生成"},{"l":"D","t":"State Manager 定义补丁安装的期望状态"}],"a":["C"],"e":"✅ 正确项：C。Patch Manager 三件套：补丁基线定「批准哪些补丁」、维护窗口定「何时批处理」、标签圈「打到哪批实例」；分组错峰批处理，覆盖率报表每周自动生成，人力从一周降到半天。关联考点：域 3.2.1「用 AWS 服务自动化运维流程」。\n\n❌ A：逐台手工是自动化要消灭的对象，千台规模不可行。\n❌ B：Run Command 能批量下命令，但补丁治理要基线、窗口、分组与覆盖率报表这套体系，裸命令没有治理面。\n❌ D：State Manager 管期望状态持续对齐，是另一种运维自动化，补丁批处理的正解是 Patch Manager。\n\n📌 关键概念：Systems Manager 三构件分工——Run Command 批量下命令、State Manager 状态对齐、Patch Manager 基线加窗口；维护窗口定时段、标签圈目标。","s":"自编·3.2.1"},{"id":"D3-012","d":3,"t":"multiple","q":"Northwind 的订单服务要改版上线，团队在选部署策略。哪些说法是对的（选所有适用项）","o":[{"l":"A","t":"要秒级回退选金丝雀发布，流量切回就是回退"},{"l":"B","t":"要秒级回退选蓝绿部署：新环境整套建好、流量一刀切过去，回退就是把路由切回来"},{"l":"C","t":"金丝雀把全部流量一次性切给新版本，观察够了再决定"},{"l":"D","t":"金丝雀先放小部分流量给新版本，看指标再全量放量"},{"l":"E","t":"蓝绿的绿环境平时满载运行，不存在闲置成本"}],"a":["B","D"],"e":"✅ 正确项：B、D。蓝绿部署把新环境整套建好，流量一刀切过去，旧环境还在，回退就是切回来——要秒级回退选蓝绿；金丝雀先放小部分流量给新版本，看指标再全量。两条机制描述都对。关联考点：域 3.1.5「实施部署策略与服务」。\n\n❌ A：秒级回退的档位是蓝绿，金丝雀是逐步放量观察，回退语义不同。\n❌ C：金丝雀的要点就是小流量先行，「全部一次性切」把策略定义说反了。\n❌ E：蓝绿的绿环境平时闲置，成本接近双份，这是它的代价句。\n\n📌 关键概念：四策略按回退速度与成本排——全量最简单、滚动分批、蓝绿秒级回退双份成本、金丝雀小流量观察拉长周期。","s":"自编·3.1.5"},{"id":"D3-013","d":3,"t":"single","q":"Northwind 收编了一支用 Terraform 的团队。state 文件应放在哪里","o":[{"l":"A","t":"各自本地机器上，操作最顺手"},{"l":"B","t":"S3 桶做远端存储，配 DynamoDB 锁表"},{"l":"C","t":"提交进 Git 仓库与代码一起管"},{"l":"D","t":"每人各存一份，互为备份"}],"a":["B"],"e":"✅ 正确项：B。state 记录已建资源的映射，放 S3 远端存储配 DynamoDB 锁表：state 丢等于失忆、state 泄露等于整套基础设施图谱外泄，存储加密与访问权限按最高档配；锁表挡住并发，团队协作只允许一个变更在跑。关联考点：域 3.1.6「使用与管理第三方工具自动化资源部署」。\n\n❌ A：本地存储把「失忆」与「泄露」两个风险都留在个人机器上，换台电脑就断档。\n❌ C：Git 仓库的访问面比 S3 宽，state 里的敏感信息随仓库外泄面放大。\n❌ D：各存一份没有单一事实源，并发更新互相覆盖，恰是锁表要防的事故。\n\n📌 关键概念：state 是「真相之源」——远端 S3 存储、DynamoDB 锁防并发、加密与权限顶格配。","s":"自编·3.1.6"},{"id":"D3-014","d":3,"t":"single","q":"Northwind 的 Terraform 团队两名工程师同时发起 apply，之前发生过互相覆盖。防并发用哪个机制","o":[{"l":"A","t":"排一张值班表，同一时段只许一人操作"},{"l":"B","t":"每次 apply 前在群里发通知打招呼"},{"l":"C","t":"state 锁：S3 远端 state 配 DynamoDB 锁表，锁挡住并发，只允许一个变更在跑"},{"l":"D","t":"把 state 拆成多个小文件，各自独立操作"}],"a":["C"],"e":"✅ 正确项：C。state 锁挡住并发的同时只允许一个变更在跑：第二个 apply 会等锁释放，谁先拿到谁先执行——机制化防并发，不靠人的自觉。「实习生本地误 apply 被锁挡住」正是这套机制的价值。关联考点：域 3.1.6「使用与管理第三方工具自动化资源部署」。\n\n❌ A：值班表靠纪律不靠机制，紧急变更绕开排班照样撞车。\n❌ B：群通知没有强制性，漏看、时区、忘发都会并发。\n❌ D：拆 state 减少碰撞面，但没有锁机制，同域并发照样互相覆盖。\n\n📌 关键概念：Terraform 协作三要素——state 远端、锁表防并发、分支评审后才 apply；机制优先于约定。","s":"自编·3.1.6"},{"id":"D3-015","d":3,"t":"single","q":"Northwind 的 CI 通道要跑 Terraform apply，凭证怎么给","o":[{"l":"A","t":"长期访问密钥写进仓库的环境变量文件"},{"l":"B","t":"用根用户凭证配在 CI 上，权限最大最省事"},{"l":"C","t":"全团队共享一套管理员密钥"},{"l":"D","t":"CI 通道挂 IAM 角色，用短期凭证执行"}],"a":["D"],"e":"✅ 正确项：D。第三方工具接 AWS 的凭证走角色链：CI 通道挂 IAM 角色拿短期凭证，长期密钥写进仓库等于埋雷——泄漏面随仓库复制扩散。关联考点：域 3.1.6「使用与管理第三方工具自动化资源部署」。\n\n❌ A：环境变量文件随仓库版本化与克隆扩散，密钥随每一次克隆扩散到仓库的所有读者手里，这正是这种做法埋下的雷。\n❌ B：根用户凭证是账户最高权限，挂在 CI 上是最大的越权面。\n❌ C：共享密钥无法区分操作主体，审计与追责全部失效。\n\n📌 关键概念：凭证链正解——人走联合身份、CI 走 IAM 角色短期凭证；长期密钥只留给无法改造的遗留系统。","s":"自编·3.1.6"},{"id":"D3-016","d":3,"t":"single","q":"Northwind 要求「服务器的基准配置持续对齐，偏离自动拉回」。Systems Manager 里哪个构件管这个","o":[{"l":"A","t":"Run Command，每次手动下发命令纠正"},{"l":"B","t":"State Manager：关联声明期望状态，调度器定期对齐，偏离自动纠正"},{"l":"C","t":"Patch Manager，按补丁基线对齐补丁版本"},{"l":"D","t":"维护窗口，给任务定执行时段"}],"a":["B"],"e":"✅ 正确项：B。State Manager 管状态对齐：期望状态定义成关联（association），调度器定期核对，偏离自动拉回——「持续对齐」是它与一次性命令的分界。关联考点：域 3.2.1「用 AWS 服务自动化运维流程」。\n\n❌ A：Run Command 是批量命令执行，一次下发一次生效，「持续」对齐要人工反复触发。\n❌ C：Patch Manager 对齐的是补丁版本，不是服务器基准配置。\n❌ D：维护窗口给动作定执行时段，本身不定义期望状态。\n\n📌 关键概念：三构件按持续性分——Run Command 一次性、State Manager 持续对齐、Patch Manager 按基线批处理；维护窗口是时段容器。","s":"自编·3.2.1"},{"id":"D3-017","d":3,"t":"single","q":"Northwind 要对标签圈定的一批实例并行下发一条磁盘水位检查命令，输出集中回收、失败逐台可见。用哪个","o":[{"l":"A","t":"逐台 Session Manager 登录执行"},{"l":"B","t":"写一个脚本分发到各台再远程执行"},{"l":"C","t":"Run Command 按标签圈定目标并行下发，输出集中回收，失败逐台可见"},{"l":"D","t":"写个 Lambda 函数逐台调用"}],"a":["C"],"e":"✅ 正确项：C。Run Command（命令执行）一条命令打到一批实例：标签圈目标、并行下发、输出集中回收、失败逐台可见——批量命令的四个诉求一次满足，不用逐台登录。关联考点：域 3.2.1「用 AWS 服务自动化运维流程」。\n\n❌ A：逐台登录是批量下发的反面，千台规模不可行。\n❌ B：自建脚本分发要管传输、权限、回收与汇总，Run Command 原生全有。\n❌ D：Lambda 逐台调用绕了一圈计算服务，且输出汇总与失败清单都要自建。\n\n📌 关键概念：Run Command 四件套——标签圈目标、并行下发、集中回收、逐台可见；维护窗口与它配合定时段。","s":"自编·3.2.1"},{"id":"D3-018","d":3,"t":"single","q":"Northwind 的事件驱动链路里，通知服务的投递语义是「至少送达一次」。处理器侧怎么设计才稳","o":[{"l":"A","t":"按「只送达一次」假设设计，收到即生效"},{"l":"B","t":"每次收到事件先全量覆盖数据库，覆盖即幂等"},{"l":"C","t":"收到疑似重复的事件直接丢弃不处理"},{"l":"D","t":"处理器做成幂等：同一事件重跑不重复生效"}],"a":["D"],"e":"✅ 正确项：D。通知至少送达一次意味着同一事件可能收到多遍，处理器要做成幂等——同一事件重跑不重复生效（比如按事件 ID 判重），重投不会造成重复扣减或重复入库。幂等是事件驱动链路的前提设计。关联考点：域 3.2.2「用 AWS 服务与功能实施事件驱动自动化」。\n\n❌ A：按只送达一次假设设计，重投事件会被重复执行，账算两遍。\n❌ B：全量覆盖对增量类动作不是通用解，覆盖粒度与业务语义对不上时照样错。\n❌ C：「疑似重复就丢弃」会把真事件一起丢掉，判重逻辑才是正解。\n\n📌 关键概念：至少一次送达加处理器幂等，是事件链路的标配组合；上线前放样例事件端到端验证。","s":"自编·3.2.2"},{"id":"D3-019","d":3,"t":"single","q":"Northwind 要做「配置一变就联动」的自动化。哪些来源的事件能当触发器","o":[{"l":"A","t":"S3 事件通知、EventBridge 总线上的服务事件、AWS Config 的配置项变化、CloudTrail 记录的操作事件"},{"l":"B","t":"只有 SQS 队列轮询一种触发方式"},{"l":"C","t":"只有 S3 事件通知一种"},{"l":"D","t":"只有 CloudWatch 告警一种"}],"a":["A"],"e":"✅ 正确项：A。事件驱动的触发源按源头分三条路：S3 事件通知（对象创建删除）、EventBridge 总线（AWS 服务事件加定时计划）、配置变化类（Config 配置项与 CloudTrail 操作事件）——都能成为触发源，路由到 Lambda 或 Step Functions 执行。关联考点：域 3.2.2「用 AWS 服务与功能实施事件驱动自动化」。\n\n❌ B：SQS 是消息队列不是触发源的限定项，队列常作为 EventBridge 目标做兜底。\n❌ C：单说 S3 通知把另外两条触发路都丢了。\n❌ D：告警状态变化是 EventBridge 上的一类事件，说「只有」把触发源收窄了。\n\n📌 关键概念：事件三触发——S3 通知管文件、EventBridge 管服务事件与定时、Config 与 CloudTrail 管配置变化；处理器幂等加死信队列兜底。","s":"自编·3.2.2"},{"id":"D3-020","d":3,"t":"single","q":"Northwind 的数据库栈要用 CloudFormation 管理，团队担心哪天误执行了删除栈。怎么防","o":[{"l":"A","t":"删栈只是删掉部署记录，资源不受影响"},{"l":"B","t":"把模板备份好，删了再恢复"},{"l":"C","t":"给数据库栈开启终止保护（termination protection）"},{"l":"D","t":"删栈后资源会自动转存到默认 VPC"}],"a":["C"],"e":"✅ 正确项：C。删栈会连栈内资源一起删除——数据库栈先开终止保护（termination protection）再谈部署，误删动作被拦在保护位上。这是「血泪教训都从这里来」的那条纪律。关联考点：域 3.1.2「用 CloudFormation 与 AWS CDK 创建与管理资源」。\n\n❌ A：「只是删记录」与删栈行为完全相反，栈删除会删资源。\n❌ B：模板备份救不了已删的数据资源，数据没了模板重建也是空栈。\n❌ D：资源不会自动转存，删了就是删了。\n\n📌 关键概念：删栈＝删资源；数据库栈先开终止保护；栈烂在回滚失败态走续回滚或删栈重建。","s":"自编·3.1.2"},{"id":"D3-021","d":3,"t":"single","q":"Northwind 准备用 StackSets 把一套新底座模板铺到全网账户。铺开前怎么控风险","o":[{"l":"A","t":"先在沙箱账户铺一片验证模板，通过后再推全网"},{"l":"B","t":"直接全网铺出问题再逐账户回滚"},{"l":"C","t":"铺之前给各账户负责人发邮件通知"},{"l":"D","t":"只铺一半账户，观察一年再铺另一半"}],"a":["A"],"e":"✅ 正确项：A。StackSets 铺得快也改得快，模板有错就是批量事故——先在沙箱账户铺一片验证，通过后再推全网；铺完抽查两个账户的栈实例状态再收工。这是 StackSets 的风险纪律。关联考点：域 3.1.4「跨多区域与多账户预置与共享资源」。\n\n❌ B：先全网再回滚是把事故面放到最大，批量错误的回滚也是批量的。\n❌ C：发通知不改变模板质量，风险在模板不在知情。\n❌ D：观察一年属过度保守，沙箱验证加抽查已是标准控险路径。\n\n📌 关键概念：StackSets 铺量纪律——沙箱先行、清单核对、铺后抽查；模板有错就是批量事故。","s":"自编·3.1.4"},{"id":"D3-022","d":3,"t":"multiple","q":"Northwind 收编的 Terraform 团队要正式接入 AWS 与 Git 流程。哪些做法是对的（选所有适用项）","o":[{"l":"A","t":"凭证走 IAM 角色，长期密钥不进仓库"},{"l":"B","t":"state 落 S3 加 DynamoDB 锁表，团队协作防并发"},{"l":"C","t":"本地与主管道都可以随意 apply，灵活优先"},{"l":"D","t":"Git 分支评审合入后才触发部署，apply 只在主管道执行"},{"l":"E","t":"再用 CloudFormation 管同一组资源，双保险更稳"}],"a":["A","B","D"],"e":"✅ 正确项：A、B、D。集成三要素：凭证走角色拿短期凭证、state 落 S3 远端加锁表防并发、流程上 Git 分支评审合入后才触发部署且 apply 只在主管道执行、本地只许 plan。三条都是接进 AWS 的标准纪律。关联考点：域 3.1.6「使用与管理第三方工具自动化资源部署」。\n\n❌ C：「随意 apply」破坏单一变更通道，本地 apply 撞上主管道正是锁表要防的事故源。\n❌ E：两套基础设施即代码工具管同一组资源会互相打架，边界要划清，「双保险」是误读。\n\n📌 关键概念：第三方工具接入三要素——凭证角色化、state 远端加锁、apply 单一通道；plan 人人可跑，apply 只走主管道。","s":"自编·3.1.6"},{"id":"D4-003","d":4,"t":"single","q":"Northwind 跑在 EC2 上的报表应用要读写 S3，凭证怎么给","o":[{"l":"A","t":"给实例挂 IAM 角色，应用用角色提供的临时凭证访问"},{"l":"B","t":"把访问密钥写进应用配置文件"},{"l":"C","t":"为每台机器各建一个 IAM 用户发长期密钥"},{"l":"D","t":"全组共享一套根用户凭证"}],"a":["A"],"e":"✅ 正确项：A。程序访问 AWS 一律用角色：实例挂上 IAM 角色，应用拿到的是自动轮换的临时凭证，无密钥可泄漏、无密钥可轮换。关联考点：域 4.1.1「实施 IAM 功能」。\n\n❌ B：配置文件里的长期密钥随代码仓库与镜像扩散，泄漏面最大。\n❌ C：每台一个 IAM 用户制造一堆长期凭证，「密钥超过一年没动」正是治理要清理的对象。\n❌ D：根用户凭证共享是最高权限裸奔，严重反模式。\n\n📌 关键概念：人走联合身份换角色、程序走实例角色，长期凭证清零；角色最小权限起步，按报错逐步放。","s":"自编·4.1.1"},{"id":"D4-004","d":4,"t":"single","q":"Northwind 要把一组管理权限收紧到「只在公司办公网段可用」。IAM 侧用哪个机制","o":[{"l":"A","t":"给账户全员升管理员权限，再靠内部制度约束"},{"l":"B","t":"策略条件（policy condition）限定来源 IP 网段，动作满足条件才生效"},{"l":"C","t":"只靠更强的密码策略来收紧"},{"l":"D","t":"每周强制轮换一次访问密钥"}],"a":["B"],"e":"✅ 正确项：B。策略条件是策略里的条件子句：动作满足条件才生效，限定来源 IP、要求多因素认证都是它的用法——「只在办公网段可用」正对策略条件的定位。关联考点：域 4.1.1「实施 IAM 功能」。\n\n❌ A：先给全员管理员再靠制度约束，把技术边界换成口头纪律，方向反了。\n❌ C：密码策略管的是密码强度与有效期，不约束权限使用的网络位置。\n❌ D：轮换密钥治的是凭证时效，与「在哪里能用」无关。\n\n📌 关键概念：权限收紧三工具——策略条件限场景、最小权限起步、权限边界封顶；条件子句把权限绑到使用场景上。","s":"自编·4.1.1"},{"id":"D4-005","d":4,"t":"single","q":"Northwind 在生产账户层级挂了一条 SCP 放行某服务。成员账户里的工程师却仍然无法使用该服务。哪条解释对","o":[{"l":"A","t":"SCP 挂上后账户自动获得对应权限，应该是 SCP 写错了"},{"l":"B","t":"SCP 本身就是授权语句的集合，放行即授予"},{"l":"C","t":"SCP 只封顶不授权：它划定成员账户最多能干什么，账户内还要 IAM 身份策略放行"},{"l":"D","t":"SCP 的生效要等 24 小时同步"}],"a":["C"],"e":"✅ 正确项：C。SCP 是挂在组织层级上的权限上限：它不授予权限，只划定成员账户最多能干什么——SCP 放行不等于账户能做，账户内还要 IAM 授权。策略评估里显式拒绝压倒一切、SCP 在评估链上层。关联考点：域 4.1.3「安全地实施多账户策略」。\n\n❌ A：SCP 不是授权机制，「自动获得权限」的预期本身错了。\n❌ B：把 SCP 说成授权语句集合，与「封顶不授权」的定位相反。\n❌ D：SCP 即时作用于新请求评估，不存在 24 小时同步窗口的说法。\n\n📌 关键概念：SCP 是封顶不是授权——组织层级定上限、账户内 IAM 放行、Identity Center 定入口；三层各管各的。","s":"自编·4.1.3"},{"id":"D4-006","d":4,"t":"single","q":"Northwind 账户数到了两位数，人员要在各账户间切换工作，密码管理混乱。怎么收敛登录入口","o":[{"l":"A","t":"每个账户各设一套密码策略，各自维护"},{"l":"B","t":"共享根用户给运维组使用"},{"l":"C","t":"用 SCP 当统一登录入口"},{"l":"D","t":"IAM Identity Center：人员一处登录，用户组映射到各账户的角色，按组换权限"}],"a":["D"],"e":"✅ 正确项：D。Identity Center 是人员统一登录入口：登录后换取各账户的角色，用户组映射到角色、权限随组走，人员动账单不动——再没人需要「第十套密码」。账户起步还可加 Control Tower 预置新账户与基线护栏。关联考点：域 4.1.3「安全地实施多账户策略」。\n\n❌ A：各账户各自维护密码正是混乱之源，收敛入口是题意反义词。\n❌ B：共享根用户违反最小权限与可追溯原则。\n❌ C：SCP 是策略上限不是身份入口，登录入口与它无关。\n\n📌 关键概念：多账户三件——Organizations 管层级、SCP 管封顶、Identity Center 管入口；账户按环境隔离，爆炸半径天然受限。","s":"自编·4.1.3"},{"id":"D4-007","d":4,"t":"single","q":"Northwind 季度体检里 Trusted Advisor 安全检查亮红灯：「安全组规则过宽，管理端口对全网开放」。对应修法是哪个","o":[{"l":"A","t":"把安全组的管理端口规则换成限定源地址，或直接删掉该规则"},{"l":"B","t":"把实例停机，等安全组自动重置"},{"l":"C","t":"给实例升配更大的网络带宽"},{"l":"D","t":"把管理端口从 22 换到 2222"}],"a":["A"],"e":"✅ 正确项：A。Trusted Advisor 安全类检查的红灯与修法对号：管理端口全网开放的修法就是收紧安全组规则——限定源地址或删除规则。同类经典项还有桶公开可读（收紧桶策略与阻断公开访问）、根账户 MFA 未开、密钥闲置（轮换或停用）。关联考点：域 4.1.4「根据 AWS Trusted Advisor 安全检查结果实施修复」。\n\n❌ B：停机不改变安全组规则，重启后端口还是开着。\n❌ C：带宽与端口暴露面无关，升配反而扩大资产面。\n❌ D：换端口号是轻度混淆，暴露面本质没变。\n\n📌 关键概念：检查是快照不是监控——红灯修完把同类问题交给 Config 规则持续盯；定点清零加规则化盯防是组合拳。","s":"自编·4.1.4"},{"id":"D4-008","d":4,"t":"single","q":"Northwind 的合规基线有二十条配置规则（卷全加密、管理端口不开等），要铺到全部账户并出一份聚合报告。用哪个","o":[{"l":"A","t":"每账户控制台手工逐条建规则"},{"l":"B","t":"AWS Config 一致性包（conformance pack）：一组规则打包部署到多账户，审计报告一份聚合出"},{"l":"C","t":"用 Trusted Advisor 周报代替持续监控"},{"l":"D","t":"每季度人工自查一遍并留截图"}],"a":["B"],"e":"✅ 正确项：B。一致性包把一组配置规则打包部署：规则统一版本管理、铺到多账户、审计报告聚合出——「二十条规则铺全网加一份报告」正对它的定位。规则触发修复动作或工单跟进，合规闭环成型。关联考点：域 4.1.5「实施合规要求与持续监控」。\n\n❌ A：逐账户手工建规则没有统一版本管理，规则漂移后各账户不一致。\n❌ C：Trusted Advisor 是账户体检快照，持续盯防归 Config 规则，「检查是快照不是监控」。\n❌ D：季度人工自查覆盖不了持续合规，审计季拿不出实时证据。\n\n📌 关键概念：能机器判定的约束交给 SCP 与 Config 规则；一致性包统一版本、多账户铺设、聚合报告三件一体。","s":"自编·4.1.5"},{"id":"D4-009","d":4,"t":"single","q":"Northwind 的合规要求数据只落地在三个区域之内。哪条边界机制对路","o":[{"l":"A","t":"把 IAM 账户密码策略调到最长有效期"},{"l":"B","t":"把不需要的区域控制台入口从导航栏隐藏"},{"l":"C","t":"用 SCP 拒绝允许清单之外的区域操作，把数据落地范围封住"},{"l":"D","t":"把工作负载分散到更多区域降低集中风险"}],"a":["C"],"e":"✅ 正确项：C。区域边界是合规「边界」类约束：SCP 拒绝允许清单之外的区域操作，数据落地范围从权限层封死——能机器判定的区域约束交给 SCP 是标准路径。服务边界同理，出范围服务用 SCP 或 IAM 策略拒绝。关联考点：域 4.1.5「实施合规要求与持续监控」。\n\n❌ A：密码策略与数据落地区域无关，工具错段。\n❌ B：隐藏控制台入口不拦截 API 调用，边界不封口子就还开着。\n❌ D：分散到更多区域与「只落地三个区域」的要求正好相反。\n\n📌 关键概念：合规两类约束——区域与服务边界用 SCP 封、资源配置用 Config 规则盯；边界管范围、规则管状态。","s":"自编·4.1.5"},{"id":"D4-010","d":4,"t":"single","q":"Northwind 要落地数据分类方案。起步怎么设计才执行得动","o":[{"l":"A","t":"一刀切：全部数据按最高档加密与管控，最安全"},{"l":"B","t":"上来就分十级，越精细越专业"},{"l":"C","t":"分类表挂在墙上供全员查阅即可"},{"l":"D","t":"起步分三档（公开、内部、机密），等级落到资源标签机器可读，未打标资源按最高档处理倒逼执行"}],"a":["D"],"e":"✅ 正确项：D。分类方案起步三档就够用：定级（按泄露后果定档）、打标（等级落资源标签或对象元数据，机器可读）、执行（等级驱动策略，机密档强制加密与全审计）——未打标按最高档处理，倒逼打标。敏感对象存储可再用 Macie 自动扫个人身份信息查漏标。关联考点：域 4.2.1「实施与执行数据分类方案」。\n\n❌ A：一刀切加密要么太贵要么漏防，「没有等级就没有差异化策略」正是分类存在的原因。\n❌ B：一上来十级分类没人执行得动，起步三档是可落地的颗粒度。\n❌ C：挂在墙上的分类表没人执行等于没有，打标要进自动化检查。\n\n📌 关键概念：分类先于管控——先分级打标、再差异化策略；无标按最高档处理是执行倒逼机制。","s":"自编·4.2.1"},{"id":"D4-011","d":4,"t":"single","q":"Northwind 客户门户三年前导入了一张外部签发的证书，凌晨全站告警「证书过期」。治理动作哪条治本","o":[{"l":"A","t":"换 ACM 签发的证书：域名验证记录在、证书仍被使用即自动续期"},{"l":"B","t":"再导入一张新的外部证书，把有效期买得更长"},{"l":"C","t":"证书挂上 ACM 之后就永不过期，无需处理"},{"l":"D","t":"安排专人每天核对证书到期日历"}],"a":["A"],"e":"✅ 正确项：A。ACM 签发的证书自动续期，前提是验证记录还在、证书仍被使用；导入的外部证书不自动续期，是证书过期故障的头号来源——换 ACM 签发治本，此后没人再为到期日值班。关联考点：域 4.2.3「实施、配置与排障传输加密」。\n\n❌ B：外部证书买再长也有到期日，导入的手动续这个坑还在。\n❌ C：自动续期只覆盖 ACM 签发的证书，导入的证书不在续期范围。\n❌ D：人工盯日历是人肉兜底，续期自动化才是治本。\n\n📌 关键概念：证书续期分两家——ACM 签发的自动续、导入的手动续；TLS 故障排查先看过期，再核域名匹配与验证记录。","s":"自编·4.2.3"},{"id":"D4-012","d":4,"t":"multiple","q":"Northwind 排查 HTTPS 链路故障。下列哪些说法是对的（选所有适用项）","o":[{"l":"A","t":"ACM 自动续期覆盖所有挂在它上面的证书，包括导入的外部证书"},{"l":"B","t":"TLS 终止在负载均衡器时，负载均衡器到实例那段也是密文"},{"l":"C","t":"证书覆盖的域名要与访问使用的域名一致，不一致握手会出问题"},{"l":"D","t":"合规要求端到端加密时，给监听器配后端加密，负载均衡器到实例那段也走 TLS"},{"l":"E","t":"域名验证记录失效不影响证书签发与续期"}],"a":["C","D"],"e":"✅ 正确项：C、D。证书域名匹配是 TLS 排障的基本判据：覆盖域名与访问域名不一致，握手与信任链会出问题；TLS 终止在负载均衡器时「最后一公里」是明文，合规要端到端就配后端加密监听器。关联考点：域 4.2.3「实施、配置与排障传输加密」。\n\n❌ A：自动续期只管 ACM 签发的证书，导入的外部证书要手动续，说全覆盖把边界抹掉了。\n❌ B：终止在负载均衡器时，到实例那段是明文，这是后端加密存在的理由。\n❌ E：域名验证记录失效，签发与续期都会卡住，这是证书故障排查的第二判据。\n\n📌 关键概念：TLS 排障四判据——先看过期没有、再核域名匹配、查验证记录、确认 TLS 终止在哪层；端到端要后端加密。","s":"自编·4.2.3"},{"id":"D4-013","d":4,"t":"single","q":"Northwind 的应用里散落着数据库密码与第三方 API 密钥，要统一入库并让数据库凭证每月自动轮换。选哪个服务","o":[{"l":"A","t":"写进环境变量，随容器配置分发"},{"l":"B","t":"AWS Secrets Manager：存、轮换、检索一条龙，数据库凭证托管自动轮换"},{"l":"C","t":"Systems Manager Parameter Store 标准参数，免费够用"},{"l":"D","t":"硬编码进代码仓库，走仓库权限保护"}],"a":["B"],"e":"✅ 正确项：B。秘密仓库两家分工：要自动轮换、跨库联动选 Secrets Manager（数据库凭证托管自动轮换，轮换函数可配失败告警与回退预案）；一般配置与低频轮换的密钥选 Parameter Store（SecureString 走 KMS 加密），成本更低。「每月自动轮换」正对 Secrets Manager 的定位。关联考点：域 4.2.4「用 AWS 服务安全存储秘密」。\n\n❌ A：环境变量随转储与日志外泄，仓库化动态取用才是纪律。\n❌ C：Parameter Store 标准参数是明文，且不提供数据库凭证的托管轮换。\n❌ D：硬编码进仓库等于把凭证与代码同分发，红队拖库即全泄。\n\n📌 关键概念：秘密两家仓——轮换托管选 Secrets Manager、一般配置选 Parameter Store；动态取用不落盘不进日志。","s":"自编·4.2.4"},{"id":"D4-014","d":4,"t":"single","q":"Northwind 开了 GuardDuty、Inspector、Config 等一串安全服务，各控制台各报各的发现。要汇成一份带合规分的统一报告，用哪个","o":[{"l":"A","t":"安全工程师每周逐服务控制台翻一遍，手写周报"},{"l":"B","t":"GuardDuty 负责汇总合规报告与安全分"},{"l":"C","t":"AWS Security Hub：聚合各源发现成统一格式，对照安全基准出合规分与报告"},{"l":"D","t":"Amazon Inspector 负责漏洞以外的聚合报告"}],"a":["C"],"e":"✅ 正确项：C。Security Hub 是安全发现的聚合中枢：把各源发现汇成统一格式、按严重度排序、对照安全基准出合规分与趋势报表——管理层的月度安全汇报从这里出，「五源一枢纽」的枢纽就是它。关联考点：域 4.2.5「配置报告与处置 AWS 服务的安全发现」。\n\n❌ A：逐控制台手抄周报时效与完整性都不可持续，聚合中枢就是为取代这个而设。\n❌ B：GuardDuty 是威胁检测源（审计事件、DNS 查询、流量日志找异常），不做聚合报告。\n❌ D：Inspector 是漏洞与暴露面扫描源，同样不是聚合层。\n\n📌 关键概念：五源一枢纽——GuardDuty 威胁、Inspector 漏洞、Config 合规、Security Agent 渗透测试，Security Hub 聚合出报告。","s":"自编·4.2.5"},{"id":"D4-015","d":4,"t":"single","q":"Northwind 的安全发现队列越积越多，没人认领处置。哪条认识是对的","o":[{"l":"A","t":"发现数量多说明检测做得好，攒着就是安全资产"},{"l":"B","t":"只处理高严重度，中低的先放着"},{"l":"C","t":"疑似误报的留着不标记，避免误判责任"},{"l":"D","t":"发现要挂处置流程与责任人：分派自动修复、工单跟进、误报标记，处置记录回写闭环"}],"a":["D"],"e":"✅ 正确项：D。发现链路的后半段是处置：发现分派（自动修复走 Config 修复动作、复杂的人工走工单）、疑似误报打标（清噪音是纪律）、处置记录回写闭环——开了不处置等于装了报警器没人接警。关联考点：域 4.2.5「配置报告与处置 AWS 服务的安全发现」。\n\n❌ A：发现堆积不处置恰是风险敞口，「攒着」不是资产是欠账。\n❌ B：中低严重度里混着趋势信号，只盯高危会漏掉缓慢演进的威胁。\n❌ C：误报不标记会淹没真警报，定期清噪音是安全运营纪律。\n\n📌 关键概念：发现链路四步——各源开检测、汇聚 Security Hub、分派处置、报告留痕；误报定期清，处置要闭环。","s":"自编·4.2.5"},{"id":"D4-016","d":4,"t":"multiple","q":"Northwind 安全治理长期凭证与根用户。哪些做法是对的（选所有适用项）","o":[{"l":"A","t":"人员访问走联合身份换角色，程序访问用实例角色"},{"l":"B","t":"根用户日常登录操作最方便，保持常态使用"},{"l":"C","t":"IAM 用户配好长期密钥就算安全达标"},{"l":"D","t":"根用户开启 MFA，日常封存不用"},{"l":"E","t":"权限一次给全，再逐步收窄省得反复申请"}],"a":["A","D"],"e":"✅ 正确项：A、D。治理两条正解：人员走联合登录换角色、程序用实例角色，长期凭证清零；根用户开启 MFA、日常封存——「账号被撞库」场景里这两条是第一道闸。密钥可再配最后使用时间监控，闲置即告警。关联考点：域 4.1.1「实施 IAM 功能」。\n\n❌ B：根用户日常使用是最高权限裸奔，日常封存是纪律。\n❌ C：长期凭证本身就是泄漏面，配好不等于安全，治理方向是清零。\n❌ E：最小权限起步按报错逐步放，「先给全再收窄」的返工代价是灾难级的。\n\n📌 关键概念：身份治理三板斧——人走角色、程序走实例角色、根用户封存加 MFA；权限给宽了再收回是灾难级返工。","s":"自编·4.1.1"},{"id":"D5-003","d":5,"t":"single","q":"Northwind 私有子网里的业务实例要出互联网打补丁，但不能被外部主动连入。出网通道怎么配","o":[{"l":"A","t":"私有子网的路由直接指向互联网网关，实现只出不进"},{"l":"B","t":"给实例绑定弹性 IP，用网络 ACL 挡住入站"},{"l":"C","t":"把实例挪到公有子网，用安全组限制来源"},{"l":"D","t":"私有子网路由指向 NAT 网关：出去换成公网源地址，回来再翻译回去，只出不进"}],"a":["D"],"e":"✅ 正确项：D。NAT 网关是私有子网「只出不进」的翻译器：实例的出站流量到 NAT 换成公网源地址发出去，回包再翻译回实例——既能打补丁下载更新，又不暴露可被主动连入的地址。关联考点：域 5.1.1「配置 VPC」。\n\n❌ A：互联网网关（IGW）是双向大门，路由指向它的子网是公有子网，实例可被主动连入，「只出不进」不成立。\n❌ B：绑弹性 IP 即成公网实例，ACL 挡入站既难维护也违背「不暴露地址」的意图。\n❌ C：挪公有子网改变了安全边界设计，与「私有子网承载业务」的三层结构相反。\n\n📌 关键概念：VPC 出网两通道——IGW 双向进出（公有子网）、NAT 只出不进（私有子网）；IPv6 场景的只出不进用 egress-only 网关。","s":"自编·5.1.1"},{"id":"D5-004","d":5,"t":"single","q":"Northwind 新业务按经典三层结构搭 VPC：入口、业务、出网各就各位。哪个布局是对的","o":[{"l":"A","t":"公有子网放 ALB 与 NAT 网关这类入口与通道组件，业务实例放私有子网，出网走 NAT"},{"l":"B","t":"全部实例放公有子网，省去路由配置"},{"l":"C","t":"业务实例放公有子网各绑弹性 IP，直接对外服务"},{"l":"D","t":"私有子网的路由表指向互联网网关"}],"a":["A"],"e":"✅ 正确项：A。经典三层：VPC 定网段切公有私有子网（跨多个可用区）；公有子网路由指向 IGW，放负载均衡器这类入口，NAT 网关也部署在公有子网；私有子网业务实例出网路由指向 NAT——入口在公有、业务在私有、出网走 NAT，边界清晰。关联考点：域 5.1.1「配置 VPC」。\n\n❌ B：全公有等于没有私网边界，安全分层设计归零。\n❌ C：业务实例直接暴露公网，攻击面最大化。\n❌ D：私有子网路由指向 IGW 就变成了公有子网语义，私有边界失效。\n\n📌 关键概念：三层结构口诀——公有子网放入口（IGW 路由）、私有子网放业务（NAT 路由出网）、安全组按角色最小放行。","s":"自编·5.1.1"},{"id":"D5-005","d":5,"t":"single","q":"Northwind 的报表库每天从 S3 拉几十 GB 数据，原来绕 NAT 网关出公网再折回 S3，NAT 数据费扎眼。怎么把这段流量挪进内网","o":[{"l":"A","t":"建接口型 VPC 端点访问 S3，按小时计费但省流量"},{"l":"B","t":"给 VPC 配 S3 网关型端点，路由表指一下，流量全程走内网"},{"l":"C","t":"升级 NAT 网关到更大规格"},{"l":"D","t":"把数据搬到本地机房再拉回来"}],"a":["B"],"e":"✅ 正确项：B。S3 与 DynamoDB 的访问走网关型端点：路由表加一条指向端点，流量全程走 AWS 内网——不走公网、不花 NAT 数据费，只留基准配置费。报表库拉数据的场景正对号。关联考点：域 5.1.2「配置私有网络连接」。\n\n❌ A：接口型端点面向 S3、DynamoDB 以外的其他 AWS 服务（走弹性网卡按小时计费）；S3 流量大用网关型是省钱首选。\n❌ C：升规格提高的是吞吐上限，每 GB 数据费照收，费用结构没变。\n❌ D：数据搬本地再拉回，方向荒谬且引入迁移成本。\n\n📌 关键概念：端点两型——网关型走路由表（S3、DynamoDB，免 NAT 数据费）、接口型走弹性网卡（其他服务，按小时计费）。","s":"自编·5.1.2"},{"id":"D5-006","d":5,"t":"single","q":"Northwind 有 VPC-A、VPC-B、VPC-C 三张网：A 与 B 建了对等连接，B 与 C 也建了。工程师发现 A 里的实例访问不了 C。根因是哪个","o":[{"l":"A","t":"对等连接生效有延迟，再等一会儿 A 就能到 C"},{"l":"B","t":"在 A 的路由表里加一条指向 C 网段的路由即可"},{"l":"C","t":"对等连接不能传递：A 连 B、B 连 C，A 到不了 C；三个以上 VPC 用中转网关组星型"},{"l":"D","t":"把三个 VPC 合并成一个大 VPC"}],"a":["C"],"e":"✅ 正确项：C。VPC 对等连接是点对点私网直连，不能传递——A 连 B、B 连 C，A 到不了 C，这是对等连接的机制边界。三个以上 VPC 互联别画网状，上中转网关（Transit Gateway）组星型，中心枢纽路由。关联考点：域 5.1.2「配置私有网络连接」。\n\n❌ A：不是生效延迟，「不可传递」是设计属性，等多久都到不了。\n❌ B：路由表加路由的前提是底层有通路，A 与 C 之间没有对等连接，加了路由也不通。\n❌ D：合并大 VPC 治标且丢失隔离边界，多 VPC 架构的治理价值会一起丢掉。\n\n📌 关键概念：对等三点——点对点、不可传递、两侧路由都要配；三个以上 VPC 上 TGW 组星型。","s":"自编·5.1.2"},{"id":"D5-007","d":5,"t":"single","q":"Northwind 月账单里数据传输费占了大头，分析发现大量流量是同区域内跨可用区的双向计费。第一步优化动作选哪个","o":[{"l":"A","t":"把资源分散到尽量多的可用区，摊薄单区压力"},{"l":"B","t":"关闭跨可用区的流量监控，减少统计项"},{"l":"C","t":"把跨区流量改走公网绕行"},{"l":"D","t":"把强互访的数据库与计算组挪进同一可用区，同可用区流量免费"}],"a":["D"],"e":"✅ 正确项：D。数据传输费三块大头里，同区域内跨可用区双向计费、同可用区免费——强互访的组件做同区亲和（数据库与计算同 AZ），跨区流量归零是第一优化动作。之后再上端点绕 NAT、边缘分发两招。关联考点：域 5.1.4「优化网络架构成本」。\n\n❌ A：分散到更多可用区让跨区互访更频繁，费用方向反了。\n❌ B：关闭监控不改变计费，只丢了对故障的可见性。\n❌ C：走公网的数据传输费更高，绕行纯属加价。\n\n📌 关键概念：网费三招——同区亲和（免费）、端点绕 NAT（免 NAT 数据费）、边缘分发（降回源与跨区）；优化前后用压测对比，防「省钱换延迟」。","s":"自编·5.1.4"},{"id":"D5-008","d":5,"t":"single","q":"Northwind 的 VPC 实例要访问本地机房的内部仓库系统，域名是 corp.northwind.internal，默认 Resolver 解析不了。怎么配","o":[{"l":"A","t":"建 Route 53 Resolver 出站端点，配转发规则把该后缀的查询转发给本地 DNS"},{"l":"B","t":"什么都不用配，默认 Resolver 等一会儿就能解析内部域名"},{"l":"C","t":"建入站端点，让 VPC 实例查本地域名"},{"l":"D","t":"把内部系统域名改成公网域名注册"}],"a":["A"],"e":"✅ 正确项：A。VPC 内置的 Route 53 Resolver 默认只答公网与 AWS 内部域名，公司内部域名它不认识。混合场景配出站端点加转发规则：该后缀的查询转发给本地 DNS，云端实例直接用内部域名访问。反向需求（本地查进 AWS 私有域）另建入站端点。关联考点：域 5.2.1「配置 DNS」。\n\n❌ B：默认 Resolver 不答私有域，「等一会儿」不会改变它的解析范围。\n❌ C：入站端点解决的是「本地 DNS 把查询转进 VPC」的方向，与「VPC 查本地域名」正好相反。\n❌ D：改公网域名等于把内部系统暴露到公网，安全边界不要了。\n\n📌 关键概念：Resolver 两副面孔——公有托管区管公网权威解析；混合场景出站端点加转发规则把私有域查回本地，入站端点反向。","s":"自编·5.2.1"},{"id":"D5-009","d":5,"t":"single","q":"Northwind 的架构师评审一套纯云方案：VPC 里的实例要解析公网域名与本 VPC 的私有域名。DNS 侧要做什么","o":[{"l":"A","t":"为每个 VPC 单独建 Resolver 出站端点才能解析公网域名"},{"l":"B","t":"默认 Resolver 即可：纯云环境它答公网与本 VPC 私有域名，混合场景才需要端点与转发规则"},{"l":"C","t":"私有域名要注册到公网托管区才能解析"},{"l":"D","t":"两个 VPC 互查私有域名，先各自建出站端点"}],"a":["B"],"e":"✅ 正确项：B。纯云环境用默认 Resolver 就够：公网域名与本 VPC 私有域名它都答，不需要端点——出站端点与转发规则是混合场景（云里要解析本地私有域）的工具。两个 VPC 互查私有域，对等连接加 DNS 解析选项就够，不必建端点。关联考点：域 5.2.1「配置 DNS」。\n\n❌ A：公网解析是默认能力，为此建端点是白花钱（端点按可用区网卡小时计费）。\n❌ C：VPC 私有域名走私有托管区，与公网托管区是两套体系。\n❌ D：VPC 互查用对等加 DNS 解析选项，端点是给「查到本地机房」的。\n\n📌 关键概念：Resolver 端点两判据——要不要端点看「是不是混合场景」；端点每可用区一张网卡按小时计费，转发后缀别写宽。","s":"自编·5.2.1"},{"id":"D5-010","d":5,"t":"single","q":"Northwind 的门户域名要做主备容灾：主端点在美东，备端点在温备区域，主端点故障时解析自动切到备端点。Route 53 路由策略选哪个","o":[{"l":"A","t":"简单路由：一个名字一个地址"},{"l":"B","t":"加权路由：按权重分配答案"},{"l":"C","t":"故障转移路由：主记录挂健康检查，主端点检查失败自动切备记录"},{"l":"D","t":"多值应答路由：返回多个地址客户端自选"}],"a":["C"],"e":"✅ 正确项：C。故障转移路由（failover routing）主备两个答案：主记录挂健康检查，主端点检查失败，应答自动切到备用端点——配合短 TTL 几分钟内完成迁移，正是主备容灾的 DNS 层实现。关联考点：域 5.2.2「实施 Route 53 路由策略、配置与查询日志」。\n\n❌ A：简单路由单答案无切换语义。\n❌ B：加权按比例分配答案，面向灰度与压测，不是主备切换。\n❌ D：多值应答返回多个健康地址由客户端自选，是「多个都可用」不是「主备切换」。\n\n📌 关键概念：策略六式各配各的场——容灾切换故障转移、灰度加权、合规分地域地理、性能分延迟；切换速度受 TTL 与客户端缓存影响。","s":"自编·5.2.2"},{"id":"D5-011","d":5,"t":"single","q":"Northwind 要留下「谁在什么时间查了什么域名、应答是什么」的记录，用于解析排障与审计。配哪个","o":[{"l":"A","t":"VPC 流日志，网卡级流记录"},{"l":"B","t":"CloudTrail，API 调用审计"},{"l":"C","t":"ELB 访问日志，请求级记录"},{"l":"D","t":"Route 53 查询日志：托管区关联 CloudWatch Logs 日志组，解析记录可审计"}],"a":["D"],"e":"✅ 正确项：D。Route 53 查询日志（query logging）把「谁查了什么、结果是什么」落到 CloudWatch Logs：托管区关联日志组即可开启，排障与审计两用——切换前后的应答变化逐条可查，审计季是第一手证据。关联考点：域 5.2.2「实施 Route 53 路由策略、配置与查询日志」。\n\n❌ A：流日志记网卡层的包流（源目的端口与 ACCEPT 或 REJECT），不含 DNS 查询内容。\n❌ B：CloudTrail 记的是 AWS API 调用，终端用户的 DNS 查询不经过它。\n❌ C：ELB 访问日志是 HTTP 请求记录，与 DNS 解析是两层。\n\n📌 关键概念：DNS 排障两件套——查询日志看应答事实、健康检查看端点状态；审计与排障共用一份日志。","s":"自编·5.2.2"},{"id":"D5-012","d":5,"t":"multiple","q":"Northwind 做单账户网络防护审计，核对四个防护服务的站位。哪些对号是对的（选所有适用项）","o":[{"l":"A","t":"Route 53 Resolver DNS Firewall 管域名解析这一跳：出站 DNS 查询按域名列表放行或拦截"},{"l":"B","t":"AWS WAF 管 HTTP 入口：应用层规则过滤注入特征、IP 名单、速率限制"},{"l":"C","t":"AWS Shield 管洪泛攻击：Standard 对全部客户免费自动防护"},{"l":"D","t":"AWS Network Firewall 与 WAF 功能重叠，配了 WAF 就不用网络防火墙"},{"l":"E","t":"四个防护服务都挂载在同一个负载均衡器上"}],"a":["A","B","C"],"e":"✅ 正确项：A、B、C。四个防护服务按流量路径站位、一跳一岗：DNS 防火墙管解析（规则组关联到 VPC）、WAF 管应用层（Web ACL 挂 CloudFront 或负载均衡器）、Shield 管洪泛（Standard 免费自动、Advanced 付费增值）、网络防火墙管 VPC 边界（网络层与传输层有状态检测）。三条站位都对。关联考点：域 5.1.3「在单账户内审计 AWS 网络防护服务」。\n\n❌ D：网络防火墙管 VPC 边界的网络层与传输层，WAF 管应用层，各管一跳互不替代，「重叠」是误读。\n❌ E：挂载点各不相同——WAF 挂 CloudFront 或 ALB、DNS 防火墙关联 VPC、网络防火墙在 VPC 路径上，不存在同一负载均衡器挂四件。\n\n📌 关键概念：防护四站位——解析、应用、洪泛、边界各一岗；审计先对站位、再查挂载点与规则健康度。","s":"自编·5.1.3"},{"id":"D5-013","d":5,"t":"single","q":"Northwind 排障「实例连不上目标」，要看「包在 VPC 这一跳有没有被拒、端口与地址对上哪条规则位」。读哪份日志","o":[{"l":"A","t":"VPC 流日志：网卡级流记录，看 REJECT 行的端口与地址，对上安全组或网络 ACL 的规则位"},{"l":"B","t":"ELB 访问日志：请求级记录，看响应码与延迟"},{"l":"C","t":"CloudFront 日志：边缘请求记录，看缓存命中与回源"},{"l":"D","t":"容器日志：容器网络的连接与路由记录"}],"a":["A"],"e":"✅ 正确项：A。VPC 流日志是网卡级的流记录：源与目的、协议端口、字节数、ACCEPT 或 REJECT。REJECT 行直接指路——端口与地址对上安全组或 ACL 的规则位，「包被谁拒的」从这行起步（规则位要自己对，流日志不报规则名）。关联考点：域 5.3.2「收集与解读网络日志排障」。\n\n❌ B：ELB 访问日志是负载均衡这一跳的请求记录（客户端、目标、响应码与延迟），管入口段。\n❌ C：CloudFront 日志管边缘这一跳（缓存命中、回源、边缘位置）。\n❌ D：容器日志管容器这一跳的连接与路由。\n\n📌 关键概念：网络日志按跳站位——流日志管 VPC、ELB 日志管入口、WAF 日志管应用过滤、CloudFront 日志管边缘；日志先开再排障，瞬时故障没日志就没现场。","s":"自编·5.3.2"},{"id":"D5-014","d":5,"t":"single","q":"Northwind 排查「客户端偶发超时」：CloudFront 日志已排除边缘段，要定位「负载均衡这一跳」的表现。接下来读哪份日志","o":[{"l":"A","t":"VPC 流日志的 REJECT 计数"},{"l":"B","t":"WAF web ACL 日志的拦截行"},{"l":"C","t":"容器日志的连接记录"},{"l":"D","t":"ELB 访问日志：看目标响应时间波动，4xx 看客户端侧、5xx 看目标侧健康与超时"}],"a":["D"],"e":"✅ 正确项：D。读日志的路径法：客户端→边缘→负载均衡→目标按段分包，每段读对应日志。边缘段排除后看 ELB 访问日志：目标响应时间波动指向目标侧，4xx 看客户端侧、5xx 看目标侧的健康与超时——入口段的判读归它。关联考点：域 5.3.2「收集与解读网络日志排障」。\n\n❌ A：流日志管 VPC 内网卡跳的包流，5xx 与响应延迟这类请求层信号不在它的字段里。\n❌ B：WAF 日志记的是被检请求的判定（哪条规则、放行拦截），面向应用层过滤。\n❌ C：容器日志管容器这一跳，与负载均衡段无关。\n\n📌 关键概念：日志路径法——先定断在哪段再挑对应日志；一份日志管一跳，拼起来才是完整时间线。","s":"自编·5.3.2"},{"id":"D5-015","d":5,"t":"single","q":"Northwind 上线新活动页后回源量暴涨、源站压力大增；查日志发现同一份内容被拆成了上千个缓存条目。最可能的根因与治法","o":[{"l":"A","t":"TTL 设得过长，把 TTL 调短即可恢复命中"},{"l":"B","t":"缓存键里带了不该带的动态值（查询串、Cookie、头部全量转发），收紧缓存键只保留必要字段"},{"l":"C","t":"对全站发起一次失效请求，清完自然恢复"},{"l":"D","t":"直接关闭缓存层，全部回源最简单"}],"a":["B"],"e":"✅ 正确项：B。命中率掉的典型根因是缓存键污染：键里带了查询串、Cookie、头部这类动态值，同一内容被拆成上千个缓存条目，命中自然掉。治法是收紧缓存键，只把影响内容的字段纳入键。关联考点：域 5.3.3「识别与修复 CloudFront 缓存问题」。\n\n❌ A：TTL 过长治的是「旧内容下不去」（该失效没失效），与命中率掉的病因相反。\n❌ C：全站失效是应急清旧动作且按路径计费，清完键还是污染的，命中照样低。\n❌ D：关缓存等于放弃边缘卸载，源站压力更大。\n\n📌 关键概念：缓存两形态对因——该命中没命中查缓存键（动态值污染）、旧内容下不去查 TTL 与失效；治本靠版本化地址。","s":"自编·5.3.3"},{"id":"D5-016","d":5,"t":"single","q":"Northwind 与本地机房的 Site-to-Site VPN 夜里断流。分段排查：隧道状态绿、BGP 会话正常，云端路由表学到了本地网段——断点最可能在哪段","o":[{"l":"A","t":"云端段：虚拟私有网关的路由传播没开"},{"l":"B","t":"隧道段：两条隧道有一条断了导致失联"},{"l":"C","t":"本地段：本地网关的路由宣告没有覆盖目的网段"},{"l":"D","t":"安全段：云端安全组没放行隧道流量"}],"a":["C"],"e":"✅ 正确项：C。混合链路分四段排障：本地段（会话与路由宣告）、隧道段（双隧道状态）、云端段（路由传播）、安全段（两端放行）。隧道绿、会话正常、云端学到了网段，剩本地段的宣告没覆盖目的网段——本地工程师补上宣告，流量恢复，云端一行不改。关联考点：域 5.3.4「识别与排障混合连接与私有连接问题」。\n\n❌ A：题干已给云端路由表学到本地网段，云端段正常。\n❌ B：双隧道设计下单条隧道断业务无感，两条都断才失联；隧道状态绿说明不是这段。\n❌ D：安全组没放行会表现为持续性拒绝，与本例「三段正常唯独断流」的画像不符。\n\n📌 关键概念：混合链路四段——本地宣告、隧道状态、云端传播、两端放行；状态红的那段就是断点。","s":"自编·5.3.4"},{"id":"D5-017","d":5,"t":"single","q":"Northwind 的实例访问一个接口型 VPC 端点：端点 IP 能 ping 通，调用却返回访问被拒。下一步查哪里","o":[{"l":"A","t":"按网络不通处理，把子网路由表重配一遍"},{"l":"B","t":"放弃端点改走公网访问该服务"},{"l":"C","t":"删掉端点重建一个新子网里"},{"l":"D","t":"先分清「网络通而权限被拒」：查端点安全组有没有放行调用方、端点策略有没有限定资源范围"}],"a":["D"],"e":"✅ 正确项：D。私有连接排障第一步是先测端点地址，分清「网络不通」还是「权限被拒」——IP 通而调用被拒，问题在授权层：端点安全组没放行调用方、端点策略限了资源范围都会拒。补安全组规则或放开策略范围即恢复。关联考点：域 5.3.4「识别与排障混合连接与私有连接问题」。\n\n❌ A：IP 已通说明网络层正常，重配路由表方向偏了。\n❌ B：改走公网放弃私道，费用与暴露面双输。\n❌ C：删端点重建引入变更与等待，且病因在授权层不在端点本身。\n\n📌 关键概念：私有连接三段——端点段（安全组与端点策略）、对等段（两侧路由）、解析段（服务名解析）；先分「不通」与「被拒」再动手。","s":"自编·5.3.4"},{"id":"D5-018","d":5,"t":"multiple","q":"Northwind 要给网络配持续监控。关于 CloudWatch 网络监控的说法，哪些是对的（选所有适用项）","o":[{"l":"A","t":"指标是明细数据，能定位到具体是哪条连接出的问题"},{"l":"B","t":"流日志投 CloudWatch Logs 后，用指标筛选器把 REJECT 计数变成指标"},{"l":"C","t":"发现问题靠指标、定位到谁靠日志，两者配合用"},{"l":"D","t":"全量流日志全字段实时投递的费用可以忽略，不用权衡"},{"l":"E","t":"NAT 吞吐突降与 NAT 网关指标无关"}],"a":["B","C"],"e":"✅ 正确项：B、C。流日志指标化：流日志投 CloudWatch Logs，指标筛选器（metric filter）把 REJECT 计数变成指标，告警阈值越线进 SNS 通知值班。指标与日志分工：指标是聚合值、用来发现问题，日志定位个体——两者配合用。关联考点：域 5.3.5「配置与分析 CloudWatch 网络监控」。\n\n❌ A：指标是聚合值，定位到具体连接要靠日志，「指标定位个体」把分工说反。\n❌ D：全量流日志全字段实时投递费用可观，投递目标与字段按量权衡，S3 批量投递比实时便宜。\n❌ E：吞吐突降先看 NAT 指标——端口分配错误或丢弃计数突增就是瓶颈位。\n\n📌 关键概念：网络监控三层——流日志指标化、组件指标（NAT 吞吐、目标延迟）、告警联动；指标发现问题、日志定位个体。","s":"自编·5.3.5"}];

const QUIZ_MOCK_SCORED = ["D1-011","D1-001","D1-002","D1-004","D1-012","D1-022","D1-009","D1-010","D1-013","D1-014","D1-016","D2-003","D2-011","D2-022","D2-001","D2-010","D2-012","D2-017","D2-020","D2-002","D2-004","D2-006","D3-003","D3-006","D3-001","D3-009","D3-012","D3-013","D3-011","D3-002","D3-004","D3-007","D3-010","D4-003","D4-001","D4-005","D4-007","D4-008","D4-010","D4-002","D4-011","D5-003","D5-005","D5-012","D5-007","D5-008","D5-010","D5-002","D5-001","D5-013"];

<script>

/* ================================================================
   ===================== 题库数据（构建注入 QUIZ_META + QUIZ_QUESTIONS） ================
   ================================================================ */
// 模考池隔离（构建注入 QUIZ_MOCK_POOL；无模考池的科目为空集，行为不变）
const MOCK_IDS = (typeof QUIZ_MOCK_POOL !== "undefined" && QUIZ_MOCK_POOL) ? new Set(QUIZ_MOCK_POOL) : new Set();
// 模考池题目（仅全真模考可见；练习模式与统计一律不含）
const MOCK_QUESTIONS = QUIZ_QUESTIONS.filter(q => MOCK_IDS.has(q.id));
// 计分题 id：官方 65 题里 50 题计分、15 题不计分 —— 不计分题只上卷面，不参与判分
const MOCK_SCORED = (typeof QUIZ_MOCK_SCORED !== "undefined" && QUIZ_MOCK_SCORED) ? new Set(QUIZ_MOCK_SCORED) : new Set();
const QUESTIONS = QUIZ_QUESTIONS.filter(q => !MOCK_IDS.has(q.id));
const META = (typeof QUIZ_META !== 'undefined' && QUIZ_META) ? QUIZ_META : {};
const EXAM = META.exam || 'QUIZ';
const LS_PREFIX = META.lsPrefix || EXAM.toLowerCase();

const GLOSSARY = META.glossary || {};

function getGlossaryForQuestion(q) {
  const texts = [q.q];
  if(q.o && Array.isArray(q.o)) q.o.forEach(o => texts.push(o.t));
  if(q.e) texts.push(q.e);
  const fullText = texts.join(' ');
  const found = [];
  const sorted = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
  for(const term of sorted) {
    if(fullText.includes(term)) found.push({term, def: GLOSSARY[term]});
  }
  return found;
}

/* ================================================================
   ===================== 术语高亮 + 弹定义 ================
   ================================================================ */
// 长词优先排序，独立 token 边界匹配，避免 EBS 误标 Amazon EBS 中的 EBS 等
function getGlossarySortedKeys() {
  return Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
}

// 判断术语在文本中是否为独立出现（前后非字母/数字）
function isIndependentToken(text, idx, term) {
  const before = text[idx-1];
  const after = text[idx + term.length];
  const isLetter = c => c && /[A-Za-z0-9]/.test(c);
  return !isLetter(before) && !isLetter(after);
}

// 将解析正文中的术语高亮为可点击 span，返回 HTML
function fmtExp(s){ let t=(s===undefined||s===null)?'':String(s); t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); t=t.replace(/\n/g,'<br>'); t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); return t; }
function highlightGlossaryTerms(text) {
  if(!text) return text;
  const sortedKeys = getGlossarySortedKeys();
  let result = '';
  let i = 0;
  while(i < text.length) {
    let matched = false;
    for(const term of sortedKeys) {
      if(!term) continue;
      const idx = text.indexOf(term, i);
      if(idx === i && isIndependentToken(text, idx, term)) {
        const def = GLOSSARY[term] || '（暂无定义）';
        const termEsc = term.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const defEsc = def.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        result += `<span class="gloss-term" onclick="showGlossTip(event,'${termEsc}','${defEsc}')">${term}</span>`;
        i += term.length;
        matched = true;
        break;
      }
    }
    if(!matched) {
      // 中文等宽字符直接输出，保持原文本
      result += text[i];
      i++;
    }
  }
  return result;
}

// 点击术语弹出定义浮层
function showGlossTip(e, term, def) {
  e.stopPropagation();
  const tip = document.getElementById('glossTip');
  document.getElementById('glossTipTerm').textContent = term;
  document.getElementById('glossTipDef').textContent = def || '（暂无定义）';
  tip.style.display = 'block';
  // 定位：优先在点击位置下方，避免超出视口
  const pad = 12;
  let left = e.clientX + pad;
  let top = e.clientY + pad;
  // 先渲染再量尺寸
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if(left + tw > window.innerWidth - 8) left = e.clientX - tw - pad;
  if(top + th > window.innerHeight - 8) top = e.clientY - th - pad;
  if(left < 8) left = 8;
  if(top < 8) top = 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

function closeGlossTip() {
  document.getElementById('glossTip').style.display = 'none';
}

// 点击页面其它区域关闭浮层
document.addEventListener('click', function(e) {
  const tip = document.getElementById('glossTip');
  if(tip && tip.style.display === 'block' && !tip.contains(e.target)) {
    closeGlossTip();
  }
});

// 按 Esc 关闭浮层
document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') closeGlossTip();
});

/* ================================================================
   ===================== localStorage 操作 =========================
   ================================================================ */
const LS_ANSWERS = LS_PREFIX + '_answers';
const LS_WRONG   = LS_PREFIX + '_wrong';
const LS_PROGRESS = LS_PREFIX + '_progress';

function getAnswers() { return JSON.parse(localStorage.getItem(LS_ANSWERS)||'[]'); }
function setAnswers(a) { localStorage.setItem(LS_ANSWERS,JSON.stringify(a)); }
function getWrong() { return JSON.parse(localStorage.getItem(LS_WRONG)||'[]'); }
function setWrong(w) { localStorage.setItem(LS_WRONG,JSON.stringify(w)); }
function getProgress() { return JSON.parse(localStorage.getItem(LS_PROGRESS)||'{}'); }
function setProgress(p) { localStorage.setItem(LS_PROGRESS,JSON.stringify(p)); }

/* ----------------------------------------------------------------
   作答记录：会话态 / 累计统计态分离（修复）
   旧缺陷：模拟考核误读全局 localStorage 历史 → 进场即显示「已答对/曾答错」、
   题号导航提前染色、成绩单把练习与往场算进本次（实测正确数>题数、未答为负、
   分数超满分、正确率>100%）。
   三态口径：
     · sessionResults()       本场逐题作答（quizState.results）＝「本次」唯一真源
     · sessionScopedAnswers() 视图用作答集：考核=仅本场；练习模式=全局历史（原行为）
     · recordAnswer()         仍写全局 store → 错题集与统计口径不变
   ---------------------------------------------------------------- */
function sessionResults() {
  const r = (quizState && quizState.results) || {};
  return Object.keys(r).map(id => ({id, ua:r[id].ua, ok:r[id].ok, ts:r[id].ts}));
}
function sessionScopedAnswers() {
  return (quizState && quizState.mode === 'exam') ? sessionResults() : getAnswers();
}

function recordAnswer(qId, userAnswer, isCorrect) {
  const answers = getAnswers();
  answers.push({id:qId,ua:userAnswer,ok:isCorrect,ts:Date.now()});
  setAnswers(answers);
  const wrong = getWrong();
  const idx = wrong.findIndex(w=>w.id===qId);
  if(!isCorrect) {
    if(idx>=0) { wrong[idx].count++; wrong[idx].last=Date.now(); }
    else { wrong.push({id:qId,count:1,last:Date.now(),mastered:false}); }
  }
  setWrong(wrong);
}

function markMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=true;
  setWrong(wrong);
}
function unmarkMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=false;
  setWrong(wrong);
}
function removeWrong(qId) {
  setWrong(getWrong().filter(x=>x.id!==qId));
}

/* ================================================================
   ===================== 辅助函数 =================================
   ================================================================ */
const DOMAIN_NAMES = META.domains || {};
const DOMAIN_WEIGHTS = META.weights || {};
const DOMAIN_KEYS = Object.keys(DOMAIN_NAMES).map(Number).sort((a,b)=>a-b);
const EXAM_P = META.examParams || {};
const EXAM_COUNT = EXAM_P.count || 50;
const EXAM_MIN = EXAM_P.minutes || 60;
const EXAM_PASS = EXAM_P.pass || 700;
const TYPE_NAMES = {single:'单选题',multiple:'多选题',hot:'拖拽题'};

// 走全集：模考池题目不在练习池里，但模考错题会进错题集，取题必须能取到
function getQById(id) { return QUIZ_QUESTIONS.find(q=>q.id===id); }
function shuffle(arr) { const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function generateShuffledOptions(questions) {
  const opts = {};
  const newAnswers = {};
  questions.forEach(q => {
    if(q.t==='single'||q.t==='multiple') {
      const shuffled = shuffle([...q.o]);
      const labels = 'ABCDEFGHIJ';
      const relabeled = shuffled.map((item, i) => ({l: labels[i], t: item.t}));
      opts[q.id] = relabeled;
      const contentToNewLabel = {};
      relabeled.forEach(item => { contentToNewLabel[item.t] = item.l; });
      newAnswers[q.id] = q.a.map(oldL => {
        const oldItem = q.o.find(o => o.l === oldL);
        return oldItem ? contentToNewLabel[oldItem.t] : oldL;
      });
    }
  });
  return { opts, newAnswers };
}

function getStats() {
  const answers = getAnswers();
  const wrong = getWrong();
  const totalCorrect = answers.filter(a=>a.ok).length;
  const totalAnswered = answers.length;
  const acc = totalAnswered ? Math.round(totalCorrect/totalAnswered*100) : 0;
  const doneIds = [...new Set(answers.map(a=>a.id))];
  const completion = Math.round(doneIds.length/QUESTIONS.length*100);
  const domainStats = {};
  for(const d of DOMAIN_KEYS) {
    const dQIds = QUESTIONS.filter(q=>q.d===d).map(q=>q.id);
    const dAnswers = answers.filter(a=>dQIds.includes(a.id));
    const dCorrect = dAnswers.filter(a=>a.ok).length;
    const dTotal = dAnswers.length;
    domainStats[d] = {
      total:dQIds.length, answered:dTotal, correct:dCorrect,
      acc: dTotal ? Math.round(dCorrect/dTotal*100) : 0
    };
  }
  const typeStats = {};
  for(const t of ['single','multiple']) {
    const tQIds = QUESTIONS.filter(q=>q.t===t).map(q=>q.id);
    const tAnswers = answers.filter(a=>tQIds.includes(a.id));
    const tCorrect = tAnswers.filter(a=>a.ok).length;
    const tTotal = tAnswers.length;
    typeStats[t] = { answered:tTotal, correct:tCorrect, acc: tTotal ? Math.round(tCorrect/tTotal*100) : 0 };
  }
  const recentWrong = wrong.filter(w=>!w.mastered).sort((a,b)=>b.last-a.last).slice(0,5);
  const recent = answers.slice(-20).reverse();
  let streak = 0;
  for(const a of recent) { if(a.ok) streak++; else break; }
  return {totalCorrect,totalAnswered,acc,completion,domainStats,typeStats,recentWrong,streak,doneIds:doneIds.length};
}
