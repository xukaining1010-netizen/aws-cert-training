let currentPage = 'dashboard';
let quizState = null;

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el = document.getElementById('page-'+page);
  if(el) el.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  if(page==='dashboard') renderDashboard();
  else if(page==='quiz') renderQuiz();
  else if(page==='wrongbook') renderWrongBook();
  else if(page==='stats') renderStats();
  else if(page==='settings') renderSettings();
}

function renderDashboard() {
  const s = getStats();
  const el = document.getElementById('page-dashboard');
  let html = `<div class="header"><h1>${EXAM} 刷题工具</h1><button class="theme-btn" onclick="toggleTheme()">${document.getElementById('quizView').classList.contains('dark')?'☀️':'🌙'}</button></div>`;
  html += `<div class="stats-grid">
    <div class="stat-card"><div class="stat-num">${s.doneIds}/${QUESTIONS.length}</div><div class="stat-label">已做题量</div></div>
    <div class="stat-card"><div class="stat-num">${s.acc}%</div><div class="stat-label">总正确率</div></div>
    <div class="stat-card"><div class="stat-num">${s.completion}%</div><div class="stat-label">完成度</div></div>
    <div class="stat-card"><div class="stat-num">${s.streak}</div><div class="stat-label">连续正确</div></div>
  </div>`;
  html += `<div class="domain-grid">`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<div class="domain-card" onclick="startDomain(${d})">
      <div class="d-name">Domain ${d}: ${DOMAIN_NAMES[d]}</div>
      <div class="d-weight">权重 ${DOMAIN_WEIGHTS[d]} | 共${ds.total}题</div>
      <div class="d-bar"><div class="d-bar-fill" style="width:${ds.acc}%"></div></div>
      <div class="d-pct">${ds.answered?ds.acc+'%正确率':'未作答'}</div>
    </div>`;
  }
  html += `</div>`;
  html += `<div class="action-btns">
    <button class="btn-primary" onclick="startContinue()">📝 继续练习</button>
    <button class="btn-primary" onclick="startWrongReview()" style="background:var(--wrong)">🔄 错题重练 (${s.recentWrong.length}题待复习)</button>
    <button class="btn-primary" onclick="startExam()" style="background:var(--correct);color:#fff">📋 模拟考核（${EXAM_COUNT}题/${EXAM_MIN}分钟/${EXAM_PASS}分及格）</button>` + (MOCK_QUESTIONS.length ? `
    <button class="btn-primary" onclick="startRealExam()" style="background:#7c3aed;color:#fff">🎯 全真模考（${MOCK_QUESTIONS.length}题 · ${MOCK_SCORED.size}题计分 / ${EXAM_MIN}分钟）</button>` : '') + `
  </div>`;
  if(s.recentWrong.length) {
    html += `<div class="recent-wrong"><h3>❌ 最近错题</h3><ul>`;
    s.recentWrong.forEach(w=>{
      const q = getQById(w.id);
      if(q) html += `<li onclick="startSingle('${w.id}')">Domain ${q.d} | ${q.q.slice(0,30)}… | 答错${w.count}次</li>`;
    });
    html += `</ul></div>`;
  }
  html += `<div class="footer-note">${META.footerNote || '题库来源：第三方中文整理，以 AWS 官方材料为准'}</div>`;
  el.innerHTML = html;
}

function renderQuiz() {
  const el = document.getElementById('page-quiz');
  if(!quizState || !quizState.questions.length) {
    el.innerHTML = `<div class="header"><button class="back-btn" onclick="navigate('dashboard')">←</button><h1>刷题</h1></div>
    <p style="text-align:center;margin-top:60px;color:var(--text2)">暂无题目，请从仪表盘选择模式开始练习</p>`;
    return;
  }
  const q = quizState.questions[quizState.currentIdx];
  const isHot = q.t === 'hot';
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  // 考核=仅本场作答；练习模式=全局历史（含本场）——防练习记录串进考核视图
  const answers = sessionScopedAnswers();
  const prevAnswers = answers.filter(a=>a.id===q.id);
  const everCorrect = prevAnswers.some(a=>a.ok);
  const everWrong = prevAnswers.some(a=>!a.ok);
  const answered = quizState.answered || {};
  let userAns = answered[q.id];
  const finished = quizState.submitted && quizState.submitted[q.id];
  const correct = finished && isAnswerCorrect(q, userAns);

  let modeLabel = quizState.mode==='exam'?'📋 模拟考核':quizState.mode==='wrong'?'❌ 错题重练':quizState.mode==='domain'?'📖 章节练习':quizState.mode==='single'?'📝 单题练习':'📝 顺序练习';

  let html = `<div class="quiz-header">
    <button class="back-btn" onclick="exitQuiz()">←</button>
    <span style="font-weight:600;font-size:15px">${modeLabel}</span>
    ${quizState.mode==='exam'?`<span class="timer" id="quizTimer"></span>`:''}
    <span class="quiz-progress">${quizState.currentIdx+1}/${quizState.questions.length}</span>
  </div>`;
  html += `<div class="quiz-meta">
    <span class="domain-tag">Domain ${q.d}</span>
    <span>${DOMAIN_NAMES[q.d]}</span>
    <span>${TYPE_NAMES[q.t]}</span>
    ${everCorrect?'<span style="background:rgba(6,214,160,.15);color:var(--correct)">已答对</span>':''}
    ${everWrong?'<span style="background:rgba(239,71,111,.15);color:var(--wrong)">曾答错</span>':''}
  </div>`;
  html += `<div class="question-text">${q.q}</div>`;

  const renderOpts = getOptionsHTML(q, userAns, finished, correct, getShuffledAnswer(q));
  html += renderOpts;

  if(isHot) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?'▶ 完成返回':'▶ 下一题'}</button>
    </div>`;
  } else if(!finished) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>✅ 确认</button>
    </div>`;
  } else {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?(quizState.mode==='exam'?'📊 交卷查看成绩':'▶ 完成返回'):'▶ 下一题'}</button>
    </div>`;
  }

  if(finished) {
    const badge = correct ? '✅ 回答正确!' : '❌ 回答错误';
    const cls = correct ? 'correct' : 'wrong';
    const gItems = getGlossaryForQuestion(q);
    let gHtml = '';
    if(gItems.length) {
      gHtml = '<div class="glossary"><div class="glossary-title">词汇附录</div>';
      gItems.forEach(g => {
        gHtml += '<div class="glossary-item"><span class="glossary-term">' + g.term + '</span><span class="glossary-def">\u00a0\u2014\u00a0' + g.def.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span></div>';
      });
      gHtml += '</div>';
    }
    html += `<div class="explanation show">
      <div class="result-badge ${cls}">${badge}</div>
      <div class="exp-text"><strong>正确答案：</strong>${formatAnswer(q)}</div>
      <div class="exp-text" style="margin-top:8px"><strong>解析：</strong>${highlightGlossaryTerms(fmtExp(q.e))}</div>
      ${q.s?`<div class="exp-source">来源：${q.s}</div>`:''}
      ${gHtml}
    </div>`;
  }

  html += `<div class="qnav"><h4>题号导航</h4><div class="qnav-grid">`;
  quizState.questions.forEach((qq, i) => {
    const qAnswers = answers.filter(a=>a.id===qq.id);
    const qCor = qAnswers.some(a=>a.ok);
    const qWro = qAnswers.some(a=>!a.ok);
    let cls = '';
    if(i===quizState.currentIdx) cls='current';
    else if(qCor) cls='done-correct';
    else if(qWro) cls='done-wrong';
    html += `<div class="qnav-item ${cls}" onclick="jumpToQuestion(${i})">${i+1}</div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
  if(!finished) updateSubmitButton();
}

function getOptionsHTML(q, userAns, finished, correct, shuffledAns) {
  let html = '';
  const qtype = q.t;
  if(qtype === 'hot') {
    html += `<div class="options-list" style="background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:16px">
      <div style="font-weight:600;color:var(--primary);margin-bottom:8px">🖱 本题为拖拽/操作题（HOTSPOT）</div>
      <div style="font-size:13px;line-height:1.7;color:var(--text2)">本题无标准 A/B/C/D 选项，答题形式为图形拖拽/区域选择。题目与图形见源 PDF 原图，答案请参照源文件。</div>`;
    if(q.e) {
      html += `<div style="margin-top:10px;font-size:13px;line-height:1.7;color:var(--text2);border-top:1px solid var(--border);padding-top:10px"><strong>解析/提示：</strong><br>${highlightGlossaryTerms(fmtExp(q.e))}</div>`;
    }
    html += `</div>`;
    return html;
  }
  if(qtype === 'single' || qtype === 'multiple') {
    const isMulti = qtype === 'multiple';
    html += `<div class="options-list">`;
    const opts = quizState.shuffledOptions && quizState.shuffledOptions[q.id] ? quizState.shuffledOptions[q.id] : q.o;
    opts.forEach(o => {
      const isSelected = userAns && userAns.includes(o.l);
      let cls = 'option-item';
      if(isMulti) cls += ' multi';
      if(isSelected && !finished) cls += ' selected';
      if(finished) {
        if(shuffledAns.includes(o.l)) cls += ' correct';
        else if(isSelected) cls += ' wrong';
      }
      const onclick = finished ? '' : `toggleOption('${o.l}')`;
      html += `<div class="${cls}" onclick="${onclick}">
        <span class="opt-label">${o.l}</span>
        <span>${o.t}</span>
      </div>`;
    });
    html += `</div>`;
    if(isMulti && !finished) html += `<div style="font-size:13px;color:var(--text2);margin-top:-12px;margin-bottom:16px">多选——请选择所有正确答案后提交（至少选 2 项）</div>`;
  }
  return html;
}

/* ================================================================
   ===================== 交互逻辑 =================================
   ================================================================ */

function toggleOption(label) {
  const q = quizState.questions[quizState.currentIdx];
  if(!quizState.answered) quizState.answered = {};
  if(q.t==='single') {
    quizState.answered[q.id] = [label];
  } else {
    const arr = quizState.answered[q.id] || [];
    const idx = arr.indexOf(label);
    if(idx>=0) arr.splice(idx,1);
    else arr.push(label);
    quizState.answered[q.id] = arr;
  }
  renderQuiz();
}

function updateSubmitButton() {
  const q = quizState.questions[quizState.currentIdx];
  if(q.t === 'hot') return;
  const ans = quizState.answered && quizState.answered[q.id];
  const btn = document.getElementById('submitBtn');
  if(!btn) return;
  if(q.t==='single') btn.disabled = !ans || !ans.length;
  else if(q.t==='multiple') btn.disabled = !ans || ans.length < 2;
}

function getShuffledAnswer(q) {
  if(quizState && quizState.shuffledAnswers && quizState.shuffledAnswers[q.id]) {
    return quizState.shuffledAnswers[q.id];
  }
  return q.a;
}

function isAnswerCorrect(q, userAns) {
  if(!userAns) return false;
  const ca = getShuffledAnswer(q);
  if(q.t==='single') return userAns[0]===ca[0];
  if(q.t==='multiple') { const a=[...userAns].sort(); const b=[...ca].sort(); return JSON.stringify(a)===JSON.stringify(b); }
  return false;
}

function formatAnswer(q) {
  const ca = getShuffledAnswer(q);
  if(q.t==='single'||q.t==='multiple') return ca.join(', ');
  if(q.t==='hot') return '本题为拖拽/操作题，答案为图形区域匹配，见源 PDF 原图';
  return '';
}

function submitAnswer() {
  const q = quizState.questions[quizState.currentIdx];
  let userAns = quizState.answered && quizState.answered[q.id];
  if(!userAns) return;
  if(q.t==='multiple' && userAns.length < 2) {
    alert('多选题至少选择 2 个答案，当前只选了' + userAns.length + '个');
    return;
  }
  const correct = isAnswerCorrect(q, userAns);
  if(!quizState.submitted) quizState.submitted={};
  quizState.submitted[q.id]=true;
  // 本场作答留痕（考核判分唯一依据；不与全局统计混用）
  if(!quizState.results) quizState.results={};
  quizState.results[q.id]={ua:[...userAns], ok:correct, ts:Date.now()};
  recordAnswer(q.id, userAns, correct);
  renderQuiz();
  updateSubmitButton();
}

function prevQuestion() {
  if(quizState.currentIdx > 0) { quizState.currentIdx--; renderQuiz(); }
}
function nextQuestion() {
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  if(isLast) {
    if(quizState.mode==='exam') renderExamResult();
    else navigate('dashboard');
  } else {
    quizState.currentIdx++;
    renderQuiz();
  }
}
function jumpToQuestion(idx) {
  quizState.currentIdx = idx;
  renderQuiz();
}
function exitQuiz() {
  // 考核中途退出必须停表：否则过期计时器归零时会把之后的练习页改写成「考核成绩单」
  if(quizState && quizState.mode==='exam') stopExamTimer();
  if(quizState && quizState.mode!=='exam') {
    setProgress({mode:quizState.mode,domain:quizState.domain||null,idx:quizState.currentIdx,time:Date.now()});
  }
  quizState = null;
  navigate('dashboard');
}

/* ================================================================
   ===================== 刷题模式启动 ==============================
   ================================================================ */
function startDomain(d) {
  const qs = QUESTIONS.filter(q=>q.d===d);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'domain',domain:d,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startContinue() {
  const p = getProgress();
  if(p.mode && p.mode!=='exam') {
    if(p.mode==='domain' && p.domain) {
      const qs = QUESTIONS.filter(q=>q.d===p.domain);
      const _sr=generateShuffledOptions(qs);
      quizState = {mode:'domain',domain:p.domain,questions:qs,currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    } else {
      const _sr=generateShuffledOptions([...QUESTIONS]);
      quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    }
  } else {
    const _sr=generateShuffledOptions([...QUESTIONS]);
    quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  }
  navigate('quiz');
}
function startWrongReview() {
  const wrong = getWrong().filter(w=>!w.mastered);
  if(!wrong.length) { alert('暂无错题需要复习！'); return; }
  const qs = wrong.map(w=>getQById(w.id)).filter(Boolean);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'wrong',domain:null,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startSingle(id) {
  const q = getQById(id);
  if(!q) return;
  const _sr=generateShuffledOptions([q]);
  quizState = {mode:'single',domain:null,questions:[q],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startExam() {
  // 模拟考核：按 meta 权重 × meta 题数分配各域配额（最大余数法，保证总和=EXAM_COUNT）
  // 回退规则（11-19 定案）：练习池不足承诺题数（EXAM_COUNT）时，模拟考核改从模考池出卷。
  // 口径：仍按整卷计分（mode:'exam'，与全真模考的官方计分结构不同）；模考错题入错题集为既有设计。
  // 存量科目练习池均充足或无模考池，此分支不触发，行为零变化（soa-c03 为首门触发科目）。
  const srcPool = (QUESTIONS.length < EXAM_COUNT && MOCK_QUESTIONS.length >= EXAM_COUNT) ? MOCK_QUESTIONS : QUESTIONS;
  const counts = {};
  let sumInt = 0;
  const raw = {}, rem = {};
  DOMAIN_KEYS.forEach(k => {
    const w = parseFloat(String(DOMAIN_WEIGHTS[k]||'0').replace('%',''))/100;
    raw[k] = w * EXAM_COUNT;
    counts[k] = Math.floor(raw[k]);
    rem[k] = raw[k] - counts[k];
    sumInt += counts[k];
  });
  let deficit = EXAM_COUNT - sumInt;
  const order = [...DOMAIN_KEYS].sort((a,b)=>rem[b]-rem[a]);
  let i = 0;
  while(deficit > 0) { counts[order[i % order.length]]++; deficit--; i++; }
  let selected = [];
  DOMAIN_KEYS.forEach(d => {
    const pool = shuffle(srcPool.filter(q=>q.d===d && q.t!=='hot'));
    selected.push(...pool.slice(0, counts[d]));
  });
  // 安全网：个别域可用题数不足以覆盖配额时，从剩余可用题补齐（正常 blueprint 下不触发）
  if (selected.length < EXAM_COUNT) {
    const used = new Set(selected.map(q=>q.id));
    const rest = shuffle(srcPool.filter(q=>q.t!=='hot' && !used.has(q.id)));
    selected.push(...rest.slice(0, EXAM_COUNT - selected.length));
  }
  selected = shuffle(selected);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam',domain:null,questions:selected,currentIdx:0,answered:{},submitted:{},results:{},shuffledOptions:_exam.opts,shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  // 场次标识：计时回调据此判定「本场是否仍在进行」，防过期计时器串场
  quizState.examToken = 'ex-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

function startRealExam() {
  // 全真模考：固定用模考池出卷（题数/计分结构/时长按官方口径），每次只重排题序与选项。
  // 与随机模考的区别：题目固定可复现，分数可跨场对比；题目与练习池隔离，平时练不到。
  const pool = MOCK_QUESTIONS.slice();
  if(!pool.length) { alert('本卷未配置模考池，请用随机模考'); return; }
  const selected = shuffle(pool);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam', fullMock:true, domain:null, questions:selected, currentIdx:0, answered:{}, submitted:{}, shuffledOptions:_exam.opts, shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  quizState.examToken = 'mx-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

let examTimerInterval = null;
function stopExamTimer() {
  if(examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
}
function startExamTimer() {
  let secs = quizState.examDuration;
  const token = quizState.examToken;
  const timerEl = document.getElementById('quizTimer');
  if(!timerEl) return;
  stopExamTimer();
  examTimerInterval = setInterval(() => {
    // 场次校验：已退出或已换场（新 token）立即自毁
    if(!quizState || quizState.mode!=='exam' || quizState.examToken!==token) { stopExamTimer(); return; }
    secs--;
    const m = Math.floor(secs/60), s = secs%60;
    const el = document.getElementById('quizTimer');
    if(el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if(secs<=60 && el) el.classList.add('warning');
    if(secs<=0) { stopExamTimer(); finishExam(token); }
  }, 1000);
}

function finishExam(token) {
  stopExamTimer();
  // 只对「发起本场计时」的考核会话生效
  if(quizState && quizState.mode==='exam' && (token===undefined || quizState.examToken===token)) renderExamResult();
}

function renderExamResult() {
  if(!quizState) return;
  stopExamTimer();
  const qs = quizState.questions;
  const results = quizState.results || {};
  const fullMock = !!quizState.fullMock;
  // 全真模考按官方口径只判计分题（50 题）；随机模考与其它模式仍整卷计分
  const counted = fullMock ? qs.filter(q => MOCK_SCORED.has(q.id)) : qs;
  const total = counted.length;
  // 逐题按本场作答判分；全局历史与往场作答一律不计
  let correct = 0, wrong = 0, unanswered = 0;
  const domStat = {};
  DOMAIN_KEYS.forEach(d => domStat[d] = {n:0, cor:0});
  counted.forEach(q => {
    if(!domStat[q.d]) domStat[q.d] = {n:0, cor:0};
    domStat[q.d].n++;
    const r = results[q.id];
    if(!r) unanswered++;
    else if(r.ok) { correct++; domStat[q.d].cor++; }
    else wrong++;
  });
  // 不变量自校验：正确 + 错误 + 未答 必须等于计分题数
  if(correct + wrong + unanswered !== total) console.warn('[exam] 判分不变量异常', {correct, wrong, unanswered, total});
  const el = document.getElementById('page-quiz');
  const pct = total ? Math.round(correct/total*100) : 0;
  // 1000-point scale, 700 to pass
  const scaledScore = total ? Math.round(correct/total*1000) : 0;
  const passed = scaledScore >= EXAM_PASS;
  // Time used
  const timeUsed = quizState.examStartTime ? Math.round((Date.now()-quizState.examStartTime)/1000) : 0;
  const timeM = Math.floor(timeUsed/60), timeS = timeUsed%60;

  // Domain breakdown
  let domainHtml = '';
  for(const d of DOMAIN_KEYS) {
    const dd = domStat[d] || {n:0, cor:0};
    const dPct = dd.n ? Math.round(dd.cor/dd.n*100) : 0;
    domainHtml += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${dd.n}</td><td>${dd.cor}</td><td style="color:${dPct>=70?'var(--correct)':'var(--wrong)'}">${dPct}%</td></tr>`;
  }

  el.innerHTML = `<div class="header"><button class="back-btn" onclick="exitExam()">←</button><h1>${fullMock ? '🎯 全真模考成绩单' : '📋 考核成绩单'}</h1></div>
  <div style="text-align:center;padding:30px 20px">
    <div style="font-size:48px;font-weight:700;color:${passed?'var(--correct)':'var(--wrong)'}">${scaledScore}</div>
    <div style="font-size:14px;color:var(--text2);margin:4px 0">满分 1000 分 | 及格线 ${EXAM_PASS} 分${fullMock ? " | 计分题 " + total + " 题（卷面 " + qs.length + " 题，不计分 " + (qs.length - total) + " 题）" : ""}</div>
    <div style="font-size:16px;color:var(--text);margin:12px 0;font-weight:600">${passed?'✅ 通过！':'❌ 未通过'}</div>
    <div style="display:flex;justify-content:center;gap:20px;margin:16px 0;flex-wrap:wrap">
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--correct)">${correct}</div><div style="font-size:12px;color:var(--text2)">正确</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--wrong)">${wrong}</div><div style="font-size:12px;color:var(--text2)">错误</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text2)">${unanswered}</div><div style="font-size:12px;color:var(--text2)">未答</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--primary)">${pct}%</div><div style="font-size:12px;color:var(--text2)">正确率</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text)">${timeM}分${timeS.toString().padStart(2,'0')}秒</div><div style="font-size:12px;color:var(--text2)">用时</div></div>
    </div>
  </div>
  <div class="stats-chart">
    <h3>各章节成绩</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>题数</th><th>正确</th><th>正确率</th></tr></thead><tbody>
    ${domainHtml}
    </tbody></table>
  </div>
  <div style="text-align:center;padding:20px">
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn-secondary" onclick="exitExam()" style="width:auto">返回首页</button>
      <button class="btn-primary" onclick="${fullMock ? 'startRealExam()' : 'startExam()'}" style="width:auto;flex:none">再考一次</button>
    </div>
  </div>`;
  quizState = null;
}

function exitExam() {
  quizState = null;
  navigate('dashboard');
}

let wrongFilter = 0;

function renderWrongBook() {
  const wrong = getWrong().filter(w=>!w.mastered);
  const mastered = getWrong().filter(w=>w.mastered);
  const el = document.getElementById('page-wrongbook');
  let html = `<div class="header"><h1>❌ 错题集</h1></div>`;
  html += `<div class="wrong-stats">
    <div class="stat-card"><div class="stat-num">${wrong.length}</div><div class="stat-label">待复习</div></div>
    <div class="stat-card"><div class="stat-num">${mastered.length}</div><div class="stat-label">已掌握</div></div>
    <div class="stat-card"><div class="stat-num">${wrong.length+mastered.length}</div><div class="stat-label">共错题</div></div>
  </div>`;
  html += `<div class="wrong-tabs">
    <button class="wrong-tab ${wrongFilter===0?'active':''}" onclick="wrongFilter=0;renderWrongBook()">全部</button>`;
  for(const d of DOMAIN_KEYS) {
    html += `<button class="wrong-tab ${wrongFilter===d?'active':''}" onclick="wrongFilter=${d};renderWrongBook()">${DOMAIN_NAMES[d]}</button>`;
  }
  html += `</div>`;
  let items = wrongFilter ? wrong.filter(w=>{const q=getQById(w.id);return q&&q.d===wrongFilter}) : wrong;
  items.sort((a,b)=>b.count-a.count);
  if(!items.length) {
    html += `<p style="text-align:center;margin-top:40px;color:var(--text2)">🎉 暂无错题！</p>`;
  } else {
    items.forEach(w=>{
      const q = getQById(w.id);
      if(!q) return;
      html += `<div class="wrong-item">
        <div class="wi-header">
          <span><strong>Domain ${q.d}</strong> | ${TYPE_NAMES[q.t]}</span>
          <span style="color:var(--wrong)">答错${w.count}次</span>
        </div>
        <div style="font-size:14px;margin-bottom:6px">${q.q.slice(0,60)}${q.q.length>60?'…':''}</div>
        <div style="font-size:12px;color:var(--text2)">最近答错：${new Date(w.last).toLocaleString()}</div>
        <div class="wi-actions">
          <button onclick="startSingle('${w.id}')">📝 重练本题</button>
          <button onclick="markMastered('${w.id}');renderWrongBook()">✅ 标记已掌握</button>
          <button onclick="removeWrong('${w.id}');renderWrongBook()">🗑️ 移除</button>
        </div>
      </div>`;
    });
  }
  if(mastered.length) {
    html += `<div style="margin-top:20px"><h3 style="font-size:14px;margin-bottom:8px;color:var(--text2)">已掌握 (${mastered.length})</h3>`;
    html += `<button class="btn-secondary" onclick="if(confirm('确定清空所有已掌握的错题吗？')){setWrong(getWrong().filter(w=>!w.mastered));renderWrongBook();}" style="width:auto">清空已掌握</button></div>`;
  }
  el.innerHTML = html;
}

function renderStats() {
  const s = getStats();
  const el = document.getElementById('page-stats');
  let html = `<div class="header"><h1>📊 统计分析</h1></div>`;
  html += `<div class="stats-chart">
    <h3>总进度</h3>
    <div style="height:30px;background:var(--border);border-radius:15px;overflow:hidden">
      <div style="height:100%;width:${s.completion}%;background:var(--primary);border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600">${s.completion}%</div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--text2)">
      <span>已答 ${s.doneIds}/${QUESTIONS.length} 题</span>
      <span>正确率 ${s.acc}%</span>
    </div>
  </div>`;
  html += `<div class="stats-chart"><h3>各章节正确率</h3><canvas id="chartDomain"></canvas></div>`;
  html += `<div class="stats-chart"><h3>各题型正确率</h3><canvas id="chartType"></canvas></div>`;
  html += `<div class="stats-chart"><h3>详细数据</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>总题</th><th>已答</th><th>正确</th><th>正确率</th></tr></thead><tbody>`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${ds.total}</td><td>${ds.answered}</td><td>${ds.correct}</td><td style="color:${ds.acc>=70?'var(--correct)':'var(--wrong)'};font-weight:600">${ds.acc}%</td></tr>`;
  }
  html += `</tbody></table></div>`;
  el.innerHTML = html;
  setTimeout(() => {
    drawDomainChart(s);
    drawTypeChart(s);
  }, 50);
}

function drawDomainChart(s) {
  const c = document.getElementById('chartDomain');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = DOMAIN_KEYS.map(k=>'D'+k);
  const colors = ['#4361ee','#4cc9f0','#06d6a0','#f8961e','#9b5de5'];
  const barW = (W-80) / (labels.length*1.5);
  labels.forEach((l,i)=>{
    const val = s.domainStats[i+1].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(l, x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

function drawTypeChart(s) {
  const c = document.getElementById('chartType');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = ['单选','多选'];
  const keys = ['single','multiple'];
  const colors = ['#4361ee','#4cc9f0'];
  const barW = (W-80) / 4;
  keys.forEach((k,i)=>{
    const val = s.typeStats[k].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

/* roundRect polyfill */
if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(r>w/2) r=w/2;
    if(r>h/2) r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    return this;
  };
}

/* ================================================================
   ===================== 工具函数 ==================================
   ================================================================ */
function exportData() {
  const data = {
    answers: getAnswers(),
    wrong: getWrong(),
    progress: getProgress(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${LS_PREFIX}-quiz-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.answers) setAnswers(data.answers);
        if(data.wrong) setWrong(data.wrong);
        if(data.progress) setProgress(data.progress);
        alert('数据导入成功！');
        navigate(currentPage);
      } catch(err) { alert('数据格式错误，请检查文件。'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetData() {
  showModal('确认重置', '确定要清除所有答题记录、错题集和进度吗？此操作不可恢复！', () => {
    localStorage.removeItem(LS_ANSWERS);
    localStorage.removeItem(LS_WRONG);
    localStorage.removeItem(LS_PROGRESS);
    navigate('dashboard');
  });
}

   ===================== 模态框 ====================================
   ================================================================ */
let modalCallback = null;
function showModal(title, text, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOverlay').classList.add('show');
  modalCallback = onConfirm;
  document.getElementById('modalConfirmBtn').onclick = () => {
    closeModal();
    if(modalCallback) modalCallback();
  };
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

/* ================================================================
   ===================== 主题切换 ==================================
   ================================================================ */
function toggleTheme() {
  document.getElementById('quizView').classList.toggle('dark');
  localStorage.setItem(LS_PREFIX+'_theme', document.getElementById('quizView').classList.contains('dark')?'dark':'light');
  navigate(currentPage);
}

/* ================================================================
   ===================== 初始化 ====================================
   ================================================================ */
function init() {
  if(localStorage.getItem(LS_PREFIX+'_theme')==='dark') document.getElementById('quizView').classList.add('dark');
  const pages = ['dashboard','quiz','wrongbook','stats','settings'];
  const app = document.getElementById('app');
  pages.forEach(p => {
    const div = document.createElement('div');
    div.id = 'page-'+p;
    div.className = 'page' + (p==='dashboard'?' active':'');
    app.appendChild(div);
  });
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => { if(btn.dataset.page==='learn'){ if(window.kbShowLearnHome) window.kbShowLearnHome(); } else navigate(btn.dataset.page); });
  });
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', init);

const LEARNING_DATA = {"meta":{"exam":"SOA-C03","title":"AWS Certified CloudOps Engineer - Associate 学习与刷题","lang":"zh","updated":"2026-11-19","level":"Associate","cnName":"云运维工程师助理级认证","version":"v0.1（题库 100 题全 5 域；学习材料 Domain 1~5）","examInfo":{"level":"Associate","vendor":"AWS","duration":"130 分钟","passScore":"720/1000","studyGuide":"https://docs.aws.amazon.com/aws-certification/latest/cloudops-engineer-associate-03/exam-guide.html","where":["Pearson VUE 考点 / 在线监考（online proctored）","语言：英语、日语、韩语（简中与韩语卷 2026-11-19 后退役，此后仅英/日/韩）","题型：单选 4 选 1、多选（2 项及以上）；65 题中 50 计分 + 15 不计分（不计分题不标示）","计分：补偿式——各域加权合并为总分，不要求每域单独达线；未答计 0、猜错不扣分"],"quickCards":[{"num":"65","label":"考试题数","sub":"50 计分 + 15 不计分"},{"num":"130min","label":"考试时长"},{"num":"720/1000","label":"及格分数"},{"num":"$150","label":"考试费用","sub":"约 ¥1,057 CNY（Associate 档）"},{"num":"5 域","label":"知识领域","sub":"13 任务 · 53 技能点"},{"num":"3 年","label":"证书有效期","sub":"每 3 年须重认证"}],"domains":[{"code":"D1","name":"Monitoring, Logging, Analysis, Remediation, and Performance Optimization","weight":"22%"},{"code":"D2","name":"Reliability and Business Continuity","weight":"22%"},{"code":"D3","name":"Deployment, Provisioning, and Automation","weight":"22%"},{"code":"D4","name":"Security and Compliance","weight":"16%"},{"code":"D5","name":"Networking and Content Delivery","weight":"18%"}]},"plan":[{"day":1,"topic":"D1 监控、日志、分析、修复与性能优化 · 使用 AWS 监控与日志服务实施指标、告警与筛选 / 为计算、存储与数据库资源实施性能优化策略","focus":"官方权重最高 22","domain":1},{"day":2,"topic":"D1 监控、日志、分析、修复与性能优化 · 利用监控与可用性指标识别并修复问题","focus":"本章练习 8 题","domain":1},{"day":3,"topic":"D2 可靠性与业务连续性 · 实施伸缩性与弹性 / 实施备份与恢复策略","focus":"官方权重最高 22","domain":2},{"day":4,"topic":"D2 可靠性与业务连续性 · 实施高可用与韧性环境","focus":"本章练习 8 题","domain":2},{"day":5,"topic":"D3 部署、预置与自动化 · 预置与维护云资源","focus":"官方权重最高 22","domain":3},{"day":6,"topic":"D3 部署、预置与自动化 · 自动化已有资源的管理","focus":"本章练习 8 题","domain":3},{"day":7,"topic":"D4 安全与合规 · 实施与管理安全与合规工具及策略","focus":"官方权重 16","domain":4},{"day":8,"topic":"D4 安全与合规 · 实施保护数据与基础设施的策略","focus":"本章练习 5 题","domain":4},{"day":9,"topic":"D5 网络与内容分发 · 实施与优化网络功能与连接 / 排障网络连接问题","focus":"官方权重 18","domain":5},{"day":10,"topic":"D5 网络与内容分发 · 配置域名、DNS 服务与内容分发","focus":"本章练习 6 题","domain":5}],"planAuto":true},"chapters":[{"domain":1,"name":"监控、日志、分析、修复与性能优化","weight":"22%","practice":[{"id":"D1-003","d":1,"t":"single","q":"Northwind 的运维要查清上周是谁在什么时候修改了队列机的安全组规则，导致收不到货柜数据。去哪里查最直接","o":[{"l":"A","t":"翻队列机上的应用日志，按时间线找异常记录"},{"l":"B","t":"看 Amazon Managed Service for Prometheus 的指标曲线，找异常点"},{"l":"C","t":"查 AWS CloudTrail 的 API 调用记录，定位那次安全组变更的主体与时间"},{"l":"D","t":"在 Amazon SNS 的通知历史里搜安全组关键字"}],"a":["C"],"e":"✅ 正确项：C。审计事件回答「谁动了它」：CloudTrail 记录账户里的 API 调用，安全组被改这类管理操作逐条留痕，主体、时间与请求参数都可查，是这类问题的正解入口。关联考点：域 1.1.1「使用 AWS 服务为工作负载配置监控与日志」。\n\n❌ A：应用日志记录的是业务与程序自身的事件，安全组属于账户层管理操作，不在应用日志里。\n❌ B：Prometheus 管的是云原生时间序列指标，回答「系统现在怎么样」，不回答「谁改了配置」。\n❌ D：SNS 是通知扇出通道，只有配了通知的事件才会出现，安全组变更默认不经过它。\n\n📌 关键概念：三类数据三个入口——指标与日志进 CloudWatch、API 审计进 CloudTrail、云原生指标走 Prometheus；查「谁改的」认准 CloudTrail。","s":"自编·1.1.1"},{"id":"D1-005","d":1,"t":"single","q":"Northwind 的审计人员要在验收当天查看一套 CloudWatch 仪表盘，对方没有 AWS 账号。哪种共享方式最稳妥","o":[{"l":"A","t":"导出仪表盘快照发给对方查看，不开放公开共享"},{"l":"B","t":"开启仪表盘的公开共享链接，任何拿到链接的人都能看"},{"l":"C","t":"把根用户凭证借给审计人员登录控制台查看"},{"l":"D","t":"让审计人员先加入公司的 AWS Organizations 再登录查看"}],"a":["A"],"e":"✅ 正确项：A。仪表盘可以导出为快照分享给团队外的人，快照是一次性交付，不开放持续访问面；公开共享则有数据暴露面，指定账号共享或发快照是更稳妥的口径。关联考点：域 1.1.4「创建与管理跨账号跨区域的可共享仪表盘」。\n\n❌ B：公开共享等于把监控数据暴露给任何拿到链接的人，暴露面不可控。\n❌ C：共享根用户凭证违反最小权限与可追溯原则，是严重安全反模式。\n❌ D：看一份仪表盘快照不需要组织成员身份，为此拉人入组织属动作过重。\n\n📌 关键概念：仪表盘共享三形态——公开共享有暴露面、指定账号共享受控、快照一次性交付；给外部看一次性资料首选快照。","s":"自编·1.1.4"},{"id":"D1-006","d":1,"t":"single","q":"Northwind 的值班邮件组订阅了告警通知的 SNS 主题，告警已触发且状态是 ALARM，但邮件一封都没收到。最该先查什么","o":[{"l":"A","t":"告警的阈值是不是设得太高没到线"},{"l":"B","t":"邮件订阅有没有完成订阅确认，未确认的订阅收不到任何消息"},{"l":"C","t":"SNS 主题是否支持邮件协议"},{"l":"D","t":"给主题开启服务端加密再重试"}],"a":["B"],"e":"✅ 正确项：B。SNS 的邮件与 HTTP 订阅需要订阅确认，没点确认链接的订阅处于未确认状态，任何消息都收不到——这是「配了没收到」的头号原因；告警已进 ALARM 说明触发侧正常，通知链路的订阅状态是第一现场。关联考点：域 1.1.5「配置 AWS 服务发送通知到 Amazon SNS」。\n\n❌ A：题干已说明告警触发进入 ALARM，阈值与判定环节已被排除，方向偏了。\n❌ C：SNS 订阅端支持邮件、短信、Lambda、HTTP 端点等多种协议，邮件是原生支持的。\n❌ D：服务端加密针对敏感内容落盘，与订阅未确认导致收不到通知是两件事。\n\n📌 关键概念：SNS 广播链路「主题是出口、订阅要确认」；邮件与 HTTP 订阅没确认等于没订，先查确认状态再查别的。","s":"自编·1.1.5"},{"id":"D1-007","d":1,"t":"single","q":"Northwind 的队列机每周三晚例行积压，值班人员每周爬起来人工重启队列服务。要把这个故障做成全自动闭环，哪条链路最贴合","o":[{"l":"A","t":"排一张值班轮换表，把周三晚的响应责任落实到人"},{"l":"B","t":"只配一条队列深度告警发 SNS 通知，让人收到后继续手工处理"},{"l":"C","t":"队列深度告警经 EventBridge 路由到 Systems Manager，自动执行重启队列服务的 runbook，完成事件回发通知"},{"l":"D","t":"把队列机换成更高规格实例，避免再积压"}],"a":["C"],"e":"✅ 正确项：C。自动修复闭环是检测、判断、执行三段：告警盯指标是检测，事件路由到修复目标是链路，runbook 执行重启是修复动作，执行记录与完成通知让人从事后查看——把例行故障从值班事项变成执行记录的标准链路。关联考点：域 1.2.1「分析性能指标并自动化修复策略」。\n\n❌ A：轮换表只是把人工响应组织得更好，故障本身还是人来处理，没有自动化。\n❌ B：只配告警发通知缺执行段，告警响了你还得爬起来手工重启，闭环没闭上。\n❌ D：换规格是对症程度最低的动作，例行积压的根因在队列服务，指标先定位瓶颈再谈换配。\n\n📌 关键概念：自动修复三段闭环——检测靠告警、判断靠指标加审计、执行靠 Lambda 或 runbook；缺执行段就还是人工。","s":"自编·1.2.1"},{"id":"D1-008","d":1,"t":"single","q":"Northwind 要把一组自动修复动作推上线，运维负责人要求先防住「自动修复把故障放大」。哪组护栏是对的","o":[{"l":"A","t":"修复动作先全量启用，出了问题再逐个关停"},{"l":"B","t":"自动修复执行的是预置动作，天然安全不需要额外护栏"},{"l":"C","t":"护栏会拖慢修复速度，能省的先省掉"},{"l":"D","t":"动作执行前留记录、失败后能通知，并配上审批步骤、超时控制与速率控制"}],"a":["D"],"e":"✅ 正确项：D。自动化修复的护栏：动作前留执行记录可回溯，失败后通知到人能兜底，runbook 侧再配审批步骤、超时控制与速率控制，把「批量做错」的风险圈住——先小范围试点再全量是上线前的标准动作。关联考点：域 1.2.1「分析性能指标并自动化修复策略」。\n\n❌ A：先全量再回退等于拿生产环境做试验，自动化的错误是批量的，代价被放大。\n❌ B：预置动作只是内容标准化，护栏与动作内容无关，没有护栏的自动化照样能放大故障。\n❌ C：护栏的少量延迟换来的是故障可控，省护栏省掉的是兜底能力。\n\n📌 关键概念：自动化修复的护栏四件——执行记录、失败通知、审批与超时、速率控制；把「漏做一次」变成「批量做错一次」之前先试点。","s":"自编·1.2.1"},{"id":"D1-015","d":1,"t":"single","q":"Northwind 的大数据作业以顺序读写为主、吞吐量大，要为它选一块块存储卷。哪种卷型对路","o":[{"l":"A","t":"gp3 通用型，按默认基线配置即可"},{"l":"B","t":"io2，取最高性能与持久性档"},{"l":"C","t":"st1 吞吐优化型，面向顺序读写的大数据作业"},{"l":"D","t":"gp2，沿用现有配置不调整"}],"a":["C"],"e":"✅ 正确项：C。三种卷型各对一类场景：st1 是吞吐优化型，专为顺序读写的大数据作业设计；gp3 通用可调；io2 给数据库等关键负载的极致 IOPS。吞吐型负载选 st1 正对号。关联考点：域 1.3.2「分析 EBS 性能指标、排障并优化卷类型」。\n\n❌ A：gp3 是通用型，吞吐上限与计费模型面向通用负载，吞吐密集型作业选吞吐优化型更合算。\n❌ B：io2 卖的是极致 IOPS 与持久性，大数据顺序读写要的是吞吐，花高价买错指标。\n❌ D：gp2 沿用旧配置既不省也不优，突发余额机制还可能掉速。\n\n📌 关键概念：EBS 卷型三对号——gp3 通用可调、io2 极致 IOPS、st1 顺序吞吐；按负载的 IOPS 与吞吐画像选卷。","s":"自编·1.3.2"},{"id":"D1-017","d":1,"t":"single","q":"Northwind 的运单日志写入 S3 后前 30 天常被查询，之后几乎不再访问但仍要保留数年备审计。存储成本怎么压","o":[{"l":"A","t":"给上传开启 Transfer Acceleration 降低存储费"},{"l":"B","t":"用 S3 生命周期策略，30 天后自动转入低频访问档，长期不动的再转归档档"},{"l":"C","t":"开启桶版本控制防止旧对象被覆盖"},{"l":"D","t":"把 30 天内还会热读的数据也直接转进归档档"}],"a":["B"],"e":"✅ 正确项：B。生命周期策略按对象年龄自动转档：热数据留标准档，30 天不访问转低频档，长期不动的转归档档，访问模式清晰的日志类数据这样分层最省。关联考点：域 1.3.3「实施与优化 S3 性能策略」。\n\n❌ A：Transfer Acceleration 是传输路径优化工具，与存储档位费用无关。\n❌ C：版本控制防的是误覆盖误删，不改变存储档位与费用。\n❌ D：还会热读的数据转归档档，取回费用与延迟反而拖垮使用，「省费用变成拖性能」。\n\n📌 关键概念：存储族策略管「省」——生命周期按访问模式自动分层；先看访问模式再定规则，别把热数据冷存。","s":"自编·1.3.3"},{"id":"D1-021","d":1,"t":"single","q":"Northwind 一条自定义命名空间指标的告警创建后一直处于 INSUFFICIENT_DATA 状态，没进过 ALARM。按排障判据，第一步查什么","o":[{"l":"A","t":"把告警删掉重建一遍，多半是创建时出了毛病"},{"l":"B","t":"把阈值调低让它尽快触发"},{"l":"C","t":"把单条告警改造成复合告警"},{"l":"D","t":"先查指标本身是否还在上报、代理是否存活、评估周期内有没有数据点，再核统计口径"}],"a":["D"],"e":"✅ 正确项：D。数据不足最常见的三个原因：指标根本没在报（代理挂了）、评估周期内没有数据点（周期设得比产出频率短）、统计口径选错。先查指标本身再查告警配置，是这个状态的排障顺序。关联考点：域 1.1.3「配置、识别与排障 CloudWatch 告警」。\n\n❌ A：删掉重建不查指标侧，同样的数据不足状态会再出现一遍。\n❌ B：阈值高低影响的是触发判定，数据点都不够时调阈值没有意义。\n❌ C：复合告警是组合多条告警降噪用的，治不了单条告警的数据不足。\n\n📌 关键概念：告警三状态 OK、ALARM、INSUFFICIENT_DATA；数据不足先查「数据在不在」，再查周期与口径。","s":"自编·1.1.3"}],"sections":[{"h":"使用 AWS 监控与日志服务实施指标、告警与筛选","body":"### 这一域考什么\n\n这一域问的是：一套跑在 AWS 上的系统，你怎么**看住它、修好它、让它跑得更快**。这是整个 CloudOps 考试的底盘，也是运维岗每天真实在干的事。\n\n三条线串起全章：\n\n1. **看得见**：指标、日志、审计事件怎么收、存哪、怎么看，对应任务 1.1。\n2. **修得快**：告警响了谁来接、人不动手怎么自动修，对应任务 1.2。\n3. **跑得快**：计算、存储、数据库三层怎么定位瓶颈、怎么调优，对应任务 1.3。\n\n这门课是助理级运维课，考核动词以 Use（使用）、Configure（配置）、Implement（实施）、Troubleshoot（排障）为主。它考的不是「知不知道有这个服务」，而是给你一个故障或性能场景，你能不能配出正确的监控、选对修复动作、定位到真正的瓶颈。\n\n### 读完这个域要能做什么\n\n这门课写给有一年左右 AWS 运维经验的工程师。读完本域应能：\n\n- 给一台 EC2、一个容器集群、一个无服务器应用配齐指标与日志，并说清各自用什么工具收。\n- 写出一条会自动修复故障的告警链路：指标越线 → 告警 → 自动执行修复动作。\n- 用 EventBridge 把事件路由到该处理它的人和服务，并排得清「规则为什么不触发」这类问题。\n- 对存储和数据库的慢、贵、丢三类问题，给出定位路径和调优动作。\n\n### 和其他认证怎么接\n\n| 其他认证/能力 | 对应的那件事 | 这里有什么不同 | 什么时候该想起它 |\n|---|---|---|---|\n| CLF-C02（云从业者） | 都认识 CloudWatch、CloudTrail 这些名字 | 从业者级只要求「认得」；本课要求你配得出来、排得清故障 | 背过服务名但动手就卡时 |\n| SAP-C03（架构师专业级） | 都讲监控与性能 | 架构级考「怎么设计监控体系」；本课考「怎么把它落地并修好」 | 要定方案而不是执行时 |\n| DOP-C02（DevOps 专业级） | 都讲自动化修复与运维流程 | 专业级加码到多账户治理与 CI/CD 流水线；本课收敛在单账户日常运维 | 要管几十个账户时 |\n\n对照只用来迁移已有理解。做题以本域官方口径为准。\n\n### 官方口径的三条边界\n\n- 官方 Exam Guide 给出技能点编号与原文，不给逐考点的出现频率。\n- 官方认证页写明题型含单选与多选，多选必须全选对才得分。\n- 及格线 720 分（100–1000 补偿式计分），不要求每域单独达线。\n\n#### 这一节学什么\n这一节对应考纲任务 1.1「使用 AWS 监控与日志服务实施指标、告警与筛选」。\n\n> 官方原名：Implement metrics, alarms, and filters by using AWS monitoring and logging services.\n\n这一任务是全域的地基：后面两个任务的一切修复与优化，前提都是「指标先收上来、告警先响起来」。五个技能点从服务选型讲到代理安装，再到告警、仪表盘与通知。主线是：选工具收数 → 装代理补数 → 配告警 → 拼仪表盘 → 通知到人。\n\n#### 使用 AWS 服务为工作负载配置监控与日志\n\n> 官方原名：Use AWS services (for example, Amazon CloudWatch, AWS CloudTrail, Amazon Managed Service for Prometheus) to configure monitoring and logging for workloads (for example, serverless, compute, AI).\n\n**这条在问什么。** 考题给你一类工作负载（无服务器、计算、AI），问你该用哪个服务收哪类数据。\n\n**定义**：可观测性（Observability）靠三类数据回答三个问题：\n\n- 指标（metrics）回答「系统现在怎么样」——数值随时间的变化。\n- 日志（logs）回答「刚才发生了什么」——事件的文字记录。\n- 审计事件回答「谁动了它」——记录 API 调用。\n\n**怎么运作**。三个服务各收一类：\n\n- Amazon CloudWatch：收指标与日志的默认中枢。AWS 服务自动上报指标，应用日志可推送进来。\n- AWS CloudTrail：记录账户里的 API 调用。谁在什么时候改了安全组，查它。\n- Amazon Managed Service for Prometheus：托管版 Prometheus，收容器与云原生场景的时间序列指标。\n\n**什么时候用，什么时候别用**。按负载形态分四类：\n\n- 无服务器工作负载（Lambda）不用装代理，指标与日志自动进 CloudWatch。\n- 传统计算实例要补装代理，才有内存、磁盘这类系统级指标。\n- AI 训练任务的 GPU 利用率同样靠代理采集进 CloudWatch，容器化推理服务走 Prometheus 口径更顺。\n- 查「谁改了配置」这类问题，CloudTrail 是正解入口，别翻应用日志。\n\n💡 **场景举例**（虚构教学示意）：Northwind 物流的订单系统由 Lambda 函数和 EC2 队列机组成。Lambda 的调用次数与错误率开箱即有；EC2 队列机补装 CloudWatch 代理后才有内存与磁盘指标；上线后有人改了队列机的安全组导致收不到货柜数据，最后在 CloudTrail 里查到那次 API 调用。\n\n**关联服务**：Amazon CloudWatch、AWS CloudTrail、Amazon Managed Service for Prometheus。\n\n#### 配置与管理 CloudWatch 代理采集指标与日志\n\n> 官方原名：Configure and manage the CloudWatch agent to collect metrics and logs from EC2 instances, Amazon ECS clusters, or Amazon EKS clusters.\n\n**这条在问什么。** 考题给你「实例的 CPU 有指标，但内存和磁盘没有」这类现象，考你 CloudWatch 代理（CloudWatch agent）的安装与配置。\n\n**定义**：CloudWatch agent 是装在主机上的采集程序。AWS 默认只上报一部分指标；内存使用率、磁盘使用率这类系统级指标，必须靠代理才能收上来。\n\n**怎么运作**。代理的配置是一份 JSON 文件，声明收哪些指标、哪些日志、多久收一次：\n\n```json\n{\n  \"metrics\": {\n    \"namespace\": \"NW/Order\",\n    \"metrics_collected\": {\n      \"mem\": { \"measurement\": [\"mem_used_percent\"] },\n      \"disk\": { \"measurement\": [\"used_percent\"] }\n    }\n  }\n}\n```\n\n要点有三条：\n\n1. 代理采集的指标带自定义命名空间（namespace），不和 AWS 默认指标混在一起。\n2. 代理需要 IAM 权限才能写入 CloudWatch，权限缺失是最常见的「配了没数据」原因。\n3. 容器场景（ECS、EKS）用 Container Insights（CloudWatch 的容器监控组件，按集群聚合指标与日志），底层同样是代理加日志采集器的组合。\n\n**什么时候用，什么时候别用**。长跑的 EC2、自建中间件要装；Lambda 这类无服务器负载不装；ECS、EKS 用 Container Insights 而不是逐台手装。代理挂了不等于业务挂了，但监控会「静默失明」，所以代理自身的心跳指标也要盯。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的队列机装完代理，内存指标还是空缺——查下来是实例角色少了写 CloudWatch 的 IAM 权限，补上后指标到齐。\n\n**关联服务**：Amazon CloudWatch（代理、Container Insights）、Amazon EC2、Amazon ECS、Amazon EKS、IAM。\n\n#### 配置、识别与排障 CloudWatch 告警\n\n> 官方原名：Configure, identify, and troubleshoot CloudWatch alarms that can invoke AWS services directly or through Amazon EventBridge (for example, by creating composite alarms and identifying their invokable actions).\n\n**这条在问什么。** 考题给你「告警响了没人管」或「告警一直显示数据不足」这类现象，考你告警的配置与排障。\n\n**定义**：告警（alarm）盯一个指标，越线就切状态。告警有三个状态：正常（OK）、触发（ALARM）、数据不足（INSUFFICIENT_DATA）。复合告警（composite alarm）把多条告警用一个表达式组合，比如「三条里至少两条响了才算真故障」，专治告警风暴。\n\n**怎么运作**。告警越线后可以走的路有两条：\n\n1. 直接触发内置动作：扩缩容、自动恢复 EC2、停机、发通知到 SNS。\n2. 进入 EventBridge：告警状态变化本身是个事件，用规则路由到 Lambda 做任意自定义动作。\n\n一条最小可用告警的配置长这样：\n\n```bash\naws cloudwatch put-metric-alarm \\\n  --alarm-name nw-queue-depth \\\n  --namespace NW/Order --metric-name QueueDepth \\\n  --statistic Average --period 300 --evaluation-periods 2 \\\n  --threshold 1000 --comparison-operator GreaterThanThreshold \\\n  --alarm-actions arn:aws:sns:us-east-1:123456789012:ops-team\n```\n\n**排障判据**。数据不足（INSUFFICIENT_DATA）最常见的三个原因：指标根本没在报（代理挂了）、评估周期内没有数据点（周期设得比产出频率短）、统计口径选错。告警不触发动作，先查 IAM 权限，再查动作目标是否有效。\n\n**什么时候用，什么时候别用**。复合告警适合「多个征兆同时出现才算故障」的场景；单指标硬故障（磁盘满）直接单条告警就够了。把所有指标都配上告警不等于安全，告警没有后续动作就是噪音。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的队列机半夜磁盘写满，单条告警直接触发 SNS 通知；同时「队列深度高、错误率高、延迟高」三条告警组成复合告警，三条同时越线才呼叫值班，半夜误报少了一大半。\n\n**关联服务**：Amazon CloudWatch（告警、复合告警）、Amazon EventBridge、Amazon SNS、AWS Lambda。\n\n#### 创建与管理跨账号跨区域的可共享仪表盘\n\n> 官方原名：Create, implement, and manage customizable and shareable CloudWatch dashboards that display metrics and alarms for AWS resources across multiple accounts and AWS Regions.\n\n**这条在问什么。** 考题给你「团队分散在多个账号和多个区域，想在一张图上看全」这类需求，考你仪表盘的跨账号跨区域能力。\n\n**定义**：仪表盘（dashboard）把指标、告警、日志查询拼成一张可定制的图。CloudWatch 的跨账号可观测性让 A 账号的仪表盘能展示 B 账号、其他区域的监控数据，不用来回切换控制台。\n\n**怎么运作**。三条关键机制：\n\n1. 每个部件（widget）都可以指定来源区域与来源账号，一张仪表盘混排多个区域的指标。\n2. 跨账号展示靠监控账户与源账号之间的授权关系建立，授权撤销立即失效。\n3. 仪表盘可以共享给团队外的人看，也能导出为快照；公开共享有数据暴露面，指定账号共享或发快照更稳妥。\n\n**什么时候用，什么时候别用**。跨区域业务、多账号组织的日常巡检，一张全局仪表盘比逐个控制台点开快得多。仪表盘是「看」不是「告警」，别指望它替代告警链路；历史数据深度分析要落到日志查询或导出，仪表盘只留核心曲线。\n\n💡 **场景举例**（虚构教学示意）：Northwind 在美东跑订单、在新加坡跑车队网关。运维主管把两地核心指标拼进一张仪表盘，顶部放三条关键告警的状态灯，每天早上扫一眼就知道全局健康度。\n\n**关联服务**：Amazon CloudWatch（仪表盘、跨账号可观测性）、AWS Organizations。\n\n#### 配置 AWS 服务发送通知到 Amazon SNS\n\n> 官方原名：Configure AWS services to send notifications to Amazon SNS and to invoke alarms that send notifications to Amazon SNS.\n\n**这条在问什么。** 考题给你「重要事件要第一时间通知值班群和邮件组」这类需求，考你 SNS 通知链路的配置。\n\n**定义**：Amazon SNS 是发布订阅式通知服务。发布方（各类 AWS 服务、告警、应用）把消息发到一个主题（topic），所有订阅方同时收到。主题是通知的唯一出口，订阅方换人不用改发布方。\n\n**怎么运作**。两条常见链路：\n\n1. 告警链：CloudWatch 告警的 action 指向 SNS 主题，越线即发通知。\n2. 服务直发链：其他服务直接把消息发到主题，例如安全发现、作业完成、状态变更类事件。\n\n订阅端支持邮件、短信、Lambda、HTTP 端点等多种协议，一个主题可以同时挂多种。邮件与 HTTP 订阅需要订阅确认，没确认就是收不到，这是「配了没收到」的头号原因。\n\n**什么时候用，什么时候别用**。要「广播给多个人和系统」就用主题扇出；只通知一个 Lambda 做处理，直接用 EventBridge 更合适，SNS 反而多一跳。敏感内容走主题要配服务端加密。\n\n**关联服务**：Amazon SNS、Amazon CloudWatch（告警动作）、AWS Lambda。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「AWS 服务什么指标都自动有」 | 内存、磁盘这类系统级指标必须装 CloudWatch 代理 |\n| 2 | 「告警响了就会有人处理」 | 告警必须挂动作（通知或自动化），否则只是个数字 |\n| 3 | 「INSUFFICIENT_DATA 是配置错了」 | 也可能是代理停报或评估周期没数据，先查指标本身 |\n| 4 | 「复合告警是多条告警的打包」 | 是表达式组合逻辑，用来降噪，不是转发 |\n| 5 | 「SNS 订阅加上就生效」 | 邮件和 HTTP 订阅要确认；未确认收不到任何消息 |\n| 6 | 「仪表盘能当监控用」 | 仪表盘只负责看，告警链路仍要单独配 |\n\n#### 记忆要点\n\n1. **三份数据三个服务**：指标与日志进 CloudWatch，API 审计进 CloudTrail，云原生指标可选 Prometheus。\n2. **代理管系统级**：内存、磁盘指标靠 agent；无服务器负载不需要。\n3. **告警三状态两出口**：OK、ALARM、INSUFFICIENT_DATA；动作要么直接触发，要么经 EventBridge。\n4. **复合告警降噪**：多征兆组合判真故障，单指标硬故障用单条。\n5. **跨账号一张图**：仪表盘部件可指定来源账号与区域，授权即通、撤权即断。\n6. **SNS 是广播出口**：一个主题多协议订阅，未确认等于没订。\n\n---"},{"h":"利用监控与可用性指标识别并修复问题","body":"#### 这一节学什么\n这一节对应考纲任务 1.2「利用监控与可用性指标识别并修复问题」。\n\n> 官方原名：Identify and remediate issues by using monitoring and availability metrics.\n\n任务 1.1 解决「看见」，这一任务解决「处置」。三个技能点构成一条自动化修复链：分析指标定根因，EventBridge 把事件路由到位，Systems Manager 的 runbook（运维动作的脚本化手册，1.2.3 展开）执行修复动作。主线是：定位 → 路由 → 执行。\n\n#### 分析性能指标并自动化修复策略\n\n> 官方原名：Analyze performance metrics and automate remediation strategies by using AWS services and functionality (for example, CloudWatch, Lambda, AWS Systems Manager, CloudTrail, Kiro, AWS DevOps Agent).\n\n**这条在问什么。** 考题给你「高峰期队列积压，人工修复太慢」这类场景，考你从指标异常到自动处置的闭环设计。\n\n**定义**：自动化修复（automated remediation）= 检测（指标越线）+ 判断（定位根因）+ 执行（修复动作）三段闭环。检测靠 CloudWatch 告警；判断靠指标关联与审计溯源；执行靠 Lambda 或 Systems Manager。\n\n**怎么运作**。一条典型的自动修复链：\n\n1. 指标越线，告警触发。\n2. 事件进 EventBridge，规则路由到修复目标。\n3. Lambda 做轻量动作（重启进程、清缓存），重活交给 Systems Manager。\n4. 事后用 CloudTrail 回查「谁在什么时候改了什么」，确认根因。\n\n官方在考纲里点名了两个新助手：Kiro 是 AWS 的 AI 编程助手（agentic IDE），AWS DevOps Agent 是运维根因分析代理。两者定位是辅助分析与建议，自动修复的执行主体仍是 Lambda 与 Systems Manager。\n\n**什么时候用，什么时候别用**。高频、已知、动作明确的故障（磁盘清理、进程重启）适合自动化；一次性、动作不明朗的故障先人工。自动化修复必须带护栏：动作前留记录，失败后能通知，杜绝「自动修复把故障放大」。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的队列机每周三晚例行积压。修复链是：队列深度告警 → EventBridge → Systems Manager 执行重启队列服务的 runbook → 完成事件回发通知。值班人员从每周三爬起来处理，变成第二天看执行记录。\n\n**关联服务**：Amazon CloudWatch、AWS Lambda、AWS Systems Manager、AWS CloudTrail、EventBridge、Kiro、AWS DevOps Agent。\n\n#### 使用 EventBridge 路由、富化与投递事件并排障\n\n> 官方原名：Use EventBridge to route, enrich, and deliver events, and troubleshoot any issues with event bus rules.\n\n**这条在问什么。** 考题给你「规则配了但事件没到达目标」这类排障场景，考你 EventBridge 事件总线的机制与排障。\n\n**定义**：EventBridge 是事件总线（event bus）。AWS 服务的事件、自定义应用事件都进总线，规则（rule）按事件模式（event pattern）或定时计划把匹配的事件投递给目标。富化指投递前用输入转换器（input transformer）改写事件内容，只把目标需要的字段送出去。\n\n**怎么运作**。事件的旅程分四站：\n\n1. 事件到达总线：AWS 服务事件默认进总线，自定义事件要指明总线再发送。\n2. 规则匹配：按事件模式匹配字段，或按 cron 计划定时触发。\n3. 转换与投递：输入转换器改写事件体，投递给目标（Lambda、SQS、SNS 等）。\n4. 失败兜底：投递失败进死信队列（DLQ）——专门收留反复投递失败事件的队列，保留现场待重放。\n\n**排障判据**。规则不触发的排查顺序：事件模式与事件体的字段、大小写是否一致（模式匹配区分大小写）；规则是否启用；目标资源策略是否允许总线调用；目标侧限流与死信队列里有没有积压。查死信队列是第一手现场，比翻应用日志快。\n\n**什么时候用，什么时候别用**。多目标扇出、跨服务解耦、定时任务，EventBridge 都是首选。只投递给一个目标且要求严格排序的场景，直接用 SQS 队列更简单。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的队列积压修复规则上线后「没动静」。排查发现规则匹配正常，是目标队列的资源策略没放行总线调用，事件全堆在死信队列里。补上权限后，积压的事件按序投递到位。\n\n**关联服务**：Amazon EventBridge（总线、规则、输入转换器、DLQ）、AWS Lambda、Amazon SQS。\n\n#### 创建与运行 Systems Manager Automation runbook\n\n> 官方原名：Create or run custom and predefined Systems Manager Automation runbooks (for example, by using AWS SDKs or custom scripts) to automate tasks and streamline processes on AWS.\n\n**这条在问什么。** 考题给你「重启实例、清理磁盘这类固定操作要标准化」这类需求，考你自动化手册（runbook）的编写与运行。\n\n**定义**：Systems Manager Automation 的 runbook 是运维动作的脚本化手册。每个 runbook 是一组按序执行的步骤；官方预置了大量 AWS- 开头的现成 runbook，也可以用 SDK 或脚本写自定义版。它执行的是「运维动作序列」，不是基础设施定义，这点和 CloudFormation 不是一个东西。\n\n**怎么运作**。用起来分三步：\n\n1. 选或写 runbook：预置库先找一遍（如重启实例、修改 AMI），没有再自定义。\n2. 指定执行角色：Automation 用一个 IAM 角色执行全部步骤，权限按最小化配。\n3. 触发执行：控制台、CLI、SDK 都行，也能被 EventBridge 事件自动触发。\n\n一条触发命令的样子：\n\n```bash\naws ssm start-automation-execution \\\n  --document-name AWS-RestartEC2Instance \\\n  --parameters \"InstanceId=i-0abc123,AutomationAssumeRole=arn:aws:iam::123456789012:role/nw-automation\"\n```\n\n**什么时候用，什么时候别用**。固定步骤、要留执行记录、可能被自动触发的运维动作，runbook 是正解。一次性手工操作直接做就好；复杂的资源编排归 CloudFormation。runbook 支持审批步骤、超时控制与速率控制，正式上线前先把这些护栏配上。\n\n💡 **场景举例**（虚构教学示意）：Northwind 把「队列机磁盘清理」固化成自定义 runbook：检查磁盘 → 轮转日志 → 清理临时文件 → 复查水位 → 回发结果。连同「队列深度越线自动触发」的规则一起上线后，这个故障从值班事项变成了一条执行记录。\n\n**关联服务**：AWS Systems Manager（Automation、runbook）、IAM、EventBridge、AWS Lambda。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「告警触发就算修复闭环」 | 检测、判断、执行三段都要有人负责，缺执行段就还是人工 |\n| 2 | 「EventBridge 规则不触发就是坏了」 | 先查事件模式大小写与规则启用状态，再查目标权限与死信队列 |\n| 3 | 「输入转换器只是格式化」 | 它决定目标收到什么内容，漏字段会直接让下游拿空数据 |\n| 4 | 「runbook 和 CloudFormation 差不多」 | runbook 执行运维动作序列；CloudFormation 定义基础设施 |\n| 5 | 「自动化修复不需要护栏」 | 没有审批、超时与速率控制的修复动作可能放大故障 |\n| 6 | 「自动修复失败就回滚人工」 | 先看死信队列与执行记录，很多失败只是权限或参数问题 |\n\n#### 记忆要点\n\n1. **修复三段闭环**：检测（告警）、判断（指标加审计）、执行（Lambda 或 runbook）。\n2. **EventBridge 四站**：进总线、规则匹配、转换投递、死信兜底；排障从死信队列入手。\n3. **模式匹配区分大小写**：事件模式与事件体字段不一致是头号排障点。\n4. **runbook 三步走**：选或写、配执行角色、选触发方式；预置库先找一遍。\n5. **新助手定位**：Kiro 与 AWS DevOps Agent 辅助分析，执行主体仍是 Lambda 与 Systems Manager。\n\n---"},{"h":"为计算、存储与数据库资源实施性能优化策略","body":"#### 这一节学什么\n这一节对应考纲任务 1.3「为计算、存储与数据库资源实施性能优化策略」。\n\n> 官方原名：Implement performance optimization strategies for compute, storage, and database resources.\n\n前两个任务让系统「看得见、修得快」，这一任务让它「跑得快」。六个技能点从计算讲到块存储、对象存储、共享存储，再到数据库与实例级网络。主线是：先定位瓶颈，再按存储形态分路调优。\n\n#### 优化计算资源并修复性能问题\n\n> 官方原名：Optimize compute resources and remediate performance problems by using performance metrics, resource tags, and AWS tools.\n\n**这条在问什么。** 考题给你「实例长期 CPU 90% 或长期 5%」这类现象，考你怎么定位并调优计算资源。\n\n**定义**：计算优化两条路：纠正规格（right-sizing，把实例规格调到贴合真实负载）与调整架构（加缓存、拆读写、异步化）。依据是性能指标加上资源标签（tags）标出的业务归属。\n\n**怎么运作**。定位路径按序走：\n\n1. 看指标定瓶颈类型：CPU 满、内存满、网络满、磁盘 I/O 满，各有不同后续动作。\n2. 用标签与分组圈出同一业务的资源，避免优化错对象。\n3. 用 Compute Optimizer 拿规格建议，按建议换实例族。\n4. 规格已合理仍慢，转架构手段：加缓存、上负载均衡、异步拆分。\n\n**什么时候用，什么时候别用**。负载规律稳定，直接 right-sizing 收益最快；负载忽高忽低，配 Auto Scaling 比换规格有效。优化前先确认瓶颈真的在计算层——数据库慢拖垮前台这类事，换再大的实例也没用。\n\n**关联服务**：Amazon CloudWatch、AWS Compute Optimizer、资源标签。\n\n#### 分析 EBS 性能指标、排障并优化卷类型\n\n> 官方原名：Analyze Amazon EBS performance metrics, troubleshoot issues, and optimize volume types to improve performance and reduce cost.\n\n**这条在问什么。** 考题给你「数据库磁盘 I/O 打满」或「块存储费用超标」这类现象，考你 EBS 指标分析与卷型优化。\n\n**定义**：EBS 是挂给实例的块存储。性能看两个核心数：IOPS（每秒读写次数）与吞吐（每秒字节数）。卷类型决定了这两项的上限与计费方式。\n\n**怎么运作**。卷型按场景选：\n\n- gp3：通用型，IOPS 与吞吐可以独立于容量单独配置，默认基线即够大多数负载，也是降费首选。\n- io2：最高性能与持久性，给数据库等关键负载。\n- st1：吞吐优化型，给顺序读写的大数据作业。\n\n**排障判据**。I/O 变慢的排查顺序：先看卷的读写指标与延迟；再看突发余额（burst balance）——突增型卷把余额烧光就会掉速；最后确认实例与卷在同一可用区，卷跨不了可用区。瓶颈确认在卷上，再决定换卷型还是调 gp3 参数，不推荐无脑升 io2。\n\n**什么时候用，什么时候别用**。从 gp2 迁 gp3 通常直接省钱且性能不减；io2 只给真需要极致 IOPS 的负载。卷性能再高也补不了数据库慢查询，先分层定位再动手。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的报表库每晚跑批时 I/O 延迟飙升。排查发现 gp2 卷的突发余额被跑批烧光。换 gp3 并把 IOPS 配到跑批所需水平后，延迟平稳，月账单反而降了。\n\n**关联服务**：Amazon EBS（gp3、io2、st1）、Amazon CloudWatch。\n\n#### 实施与优化 S3 性能策略\n\n> 官方原名：Implement and optimize S3 performance strategies (for example, AWS DataSync, S3 Transfer Acceleration, multipart uploads, S3 Lifecycle policies) to enhance data transfer, storage efficiency, and access patterns.\n\n**这条在问什么。** 考题给你「大文件上传慢」「存储费用失控」这类现象，考你 S3 的传输加速与存储分层。\n\n**定义**：S3 性能策略分两族：传输族解决「快」，多部分上传（multipart upload）把大文件切块并行传；S3 Transfer Acceleration 借边缘节点加速远距离上传；DataSync 管批量迁移。存储族解决「省」，生命周期策略（lifecycle）按对象年龄自动转低频档或归档档。\n\n**怎么运作**。四个工具各管一段：\n\n1. multipart upload：大文件切块并行上传，任一块失败只重传该块。\n2. Transfer Acceleration：客户端到 AWS 边缘走优化线路，跨洲上传收益最明显。\n3. DataSync：本地到 S3、S3 到 S3 的批量数据搬迁，带校验。\n4. lifecycle：热数据放标准档，按访问间隔设定（比如 30 天，具体天数在规则里自配）不访问自动转低频档，长期不动的转归档。\n\n**什么时候用，什么时候别用**：\n\n- Transfer Acceleration 只对远距离上传有意义，区域内上传用了反而多绕一跳。\n- multipart 对小文件没必要。\n- lifecycle 规则要先看访问模式再定：把还会热读的数据转低频档，会把「省费用」变成「拖性能」。\n\n**关联服务**：Amazon S3（multipart、Transfer Acceleration、lifecycle）、AWS DataSync。\n\n#### 评估与选择共享存储方案并优化\n\n> 官方原名：Evaluate and select shared storage solutions (for example, Amazon EFS, Amazon FSx, Amazon S3 Files), and optimize the solutions (for example, EFS lifecycle policies) for specific use cases and requirements.\n\n**这条在问什么。** 考题给你「多台机器要挂同一个盘」「Windows 共享要上云」这类需求，考你共享存储的选型。\n\n**定义**：共享存储让多个计算实例同时读写同一份数据。三个候选各对一类场景：\n\n- EFS：NFS 协议的弹性文件系统。\n- FSx：一组按协议分的托管文件系统。\n- Amazon S3 Files：给对象存储套上文件协议接口，让应用用文件方式读写 S3 数据。\n\n**怎么运作**。选型对号入座：\n\n- Amazon EFS：Linux、NFS、容量自动伸缩，普通负载首选；生命周期策略把不常访问的数据转低频档省钱。\n- Amazon FSx for Lustre：高性能并行文件系统，给机器学习与高性能计算。\n- Amazon FSx for Windows File Server：Windows 与 SMB 场景。\n- Amazon S3 Files：要「文件方式读写 S3 数据」的中间形态。\n\n**什么时候用，什么时候别用**。文件接口是硬需求（应用按目录和文件语义读写）才上文件系统；能改造成对象接口的场景直接用 S3 更省。EFS 的生命周期策略是「访问频率驱动的自动分层」，热数据别指望它省钱，冷数据别漏配它。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的路线规划服务跑在十台 EC2 上，共享同一份地图数据。选 EFS 挂载给全组实例，配生命周期策略把半年前的历史版本转入低频档；规划模型的训练集群另配 FSx for Lustre 扛并行读。\n\n**关联服务**：Amazon EFS、Amazon FSx（Lustre、Windows File Server）、Amazon S3 Files。\n\n#### 监控 Amazon RDS 指标并调整配置提升性能\n\n> 官方原名：Monitor Amazon RDS metrics (for example, Amazon RDS Performance Insights, CloudWatch alarms) and modify configurations to increase performance efficiency (for example, Performance Insights proactive recommendations, RDS Proxy).\n\n**这条在问什么。** 考题给你「数据库 CPU 高」这类现象，考你怎么定位到 SQL 层面并给出调优动作。\n\n**定义**：Performance Insights 是 RDS 的负载分析工具，把数据库时间花在哪逐条拆给你看：每条 SQL 占了多少、卡在哪种等待事件（wait event）上。等待事件是数据库性能语言里的「排队原因」，比如等锁、等 I/O、等 CPU。\n\n**怎么运作**。定位与调优按序走：\n\n1. CloudWatch 告警发现 CPU 或连接数越线。\n2. 进 Performance Insights 看 Top SQL 与等待事件，确认瓶颈在哪个查询、哪种排队。\n3. 按瓶颈选动作：慢查询加索引或改写；连接风暴上 RDS Proxy。\n4. 参考 Performance Insights 的主动建议（proactive recommendations）做预防性调整。\n\nRDS Proxy 是托管连接池（connection pool），在应用与数据库之间复用连接。连接风暴（大量短连接反复开关）打垮数据库的场景，加 Proxy 比升配有效。\n\n**排障判据**。CPU 高不等于要升配：先看等待事件，等 CPU 才是计算瓶颈，等 I/O 或等锁另有解法。升配是最后一步，不是第一步。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的报表库 CPU 长期在 80% 上下，Performance Insights 显示等待事件集中在两条报表 SQL 的 I/O 等待——补索引后 CPU 回落，升配一分钱没花。\n\n**关联服务**：Amazon RDS（Performance Insights、RDS Proxy）、Amazon CloudWatch。\n\n#### 实施、监控与优化 EC2 实例及其存储与网络能力\n\n> 官方原名：Implement, monitor, and optimize EC2 instances and their associated storage and networking capabilities (for example, EC2 placement groups).\n\n**这条在问什么。** 考题给你「一组实例之间网络延迟高」「关键实例不想同天同区挂」这类现象，考你实例级布局（placement groups）与网络存储优化。\n\n**定义**：置放群组（placement groups）控制实例在物理机上的分布策略，分三种：集群（cluster）把实例塞得越近越好，换低延迟高带宽；分散（spread）把实例摊开到不同物理机，防一损俱损；分区（partition）按分区隔离，给大数据与分布式系统看拓扑用。\n\n**怎么运作**。三种策略对号入座：\n\n1. cluster：高性能计算、低延迟互通信场景，代价是物理风险集中。\n2. spread：少量关键实例（如仲裁节点——集群里投决定性一票的那一台），每个组内摊到不同硬件，上限七实例每组。\n3. partition：Hadoop、EMR 这类按分区感知故障域的大数据系统，按分区隔离故障域。\n\n**什么时候用，什么时候别用**。延迟敏感的互连场景才值得 cluster 的物理集中风险；普通 Web 层用置放群组没有收益。网络能力还要看实例族本身：有的族带增强网络与 EBS 优化，选实例时一起看。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的分布式协调服务只有三个节点，节点同天接连挂过两次。改成 spread 置放群组后，三个节点固定摊在不同物理机上，单机故障不再连环。车队大数据集群则用 partition，让作业调度能感知分区拓扑。\n\n**关联服务**：Amazon EC2（placement groups、EBS 优化、增强网络）、Amazon EBS。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「CPU 高就升配」 | 先看等待事件与指标分层，瓶颈常在查询、I/O 或锁上 |\n| 2 | 「gp3 只是便宜版 gp2」 | gp3 的 IOPS 与吞吐可独立配置，性能与省钱可以兼得 |\n| 3 | 「Transfer Acceleration 万能提速」 | 它只加速远距离上传，区域内使用反而多绕一跳 |\n| 4 | 「共享存储选一个大的就行」 | EFS、FSx、S3 Files 对应不同协议与性能带，按应用接口选 |\n| 5 | 「RDS Proxy 能加速 SQL」 | 它是连接池，治连接风暴，不治慢查询 |\n| 6 | 「置放群组随便选个默认」 | cluster、spread、partition 的风险与收益方向相反，按业务定 |\n\n#### 记忆要点\n\n1. **计算优化先分层**：指标定瓶颈类型，标签圈业务归属，规格与架构两路调优。\n2. **EBS 三卷型**：gp3 通用可调、io2 极致性能、st1 顺序吞吐；突发余额烧光会掉速。\n3. **S3 双族策略**：传输族（multipart、TA、DataSync）管快，lifecycle 管省。\n4. **共享存储三候选**：EFS 管 Linux 弹性、FSx 按协议细分、S3 Files 做文件接口桥。\n5. **数据库调优从等待事件下手**：Performance Insights 看 Top SQL，连接风暴才用 Proxy。\n6. **置放群组三策略**：cluster 求近、spread 求散、partition 求拓扑。\n\n---"}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 1.1.1 | 监控三支柱与三个采集服务对号 | ⭐⭐ | 情景单选 |\n| 1.1.2 | CloudWatch agent 与 Container Insights | ⭐⭐⭐ | 情景单选 |\n| 1.1.3 | 告警状态机、复合告警与动作出口 | ⭐⭐⭐ | 情景单选/排障题 |\n| 1.1.4 | 跨账号跨区域仪表盘与授权 | ⭐⭐ | 情景单选 |\n| 1.1.5 | SNS 主题扇出与订阅确认 | ⭐⭐ | 情景单选 |\n| 1.2.1 | 自动修复三段闭环与护栏 | ⭐⭐⭐ | 情景单选/多选 |\n| 1.2.2 | EventBridge 规则匹配与死信队列排障 | ⭐⭐⭐ | 排障情景题 |\n| 1.2.3 | runbook 选型、执行角色与触发方式 | ⭐⭐ | 情景单选 |\n| 1.3.1 | 计算瓶颈分层与 right-sizing | ⭐⭐ | 情景单选 |\n| 1.3.2 | EBS 卷型选型与突发余额排障 | ⭐⭐⭐ | 情景单选/排障题 |\n| 1.3.3 | S3 传输族与 lifecycle 分层 | ⭐⭐⭐ | 情景单选/多选 |\n| 1.3.4 | 共享存储三候选对号入座 | ⭐⭐⭐ | 情景单选 |\n| 1.3.5 | Performance Insights 等待事件与 Proxy | ⭐⭐⭐ | 情景单选/排障题 |\n| 1.3.6 | 置放群组三策略与实例网络能力 | ⭐⭐ | 情景单选 |","services":"| 服务 | 主要用途 | 涉及知识点 |\n|---|---|---|\n| Amazon CloudWatch（指标、日志、告警、仪表盘、代理） | 监控中枢与告警 | 1.1.1~1.1.5、1.2.1、1.3.1、1.3.2、1.3.5 |\n| AWS CloudTrail | API 审计与变更溯源 | 1.1.1、1.2.1 |\n| Amazon Managed Service for Prometheus | 云原生指标 | 1.1.1 |\n| Amazon SNS | 通知扇出 | 1.1.3、1.1.5 |\n| Amazon EventBridge | 事件路由与定时触发 | 1.1.3、1.2.1、1.2.2 |\n| AWS Lambda | 轻量自动修复执行 | 1.2.1、1.2.2 |\n| AWS Systems Manager（Automation runbook） | 运维动作标准化 | 1.2.1、1.2.3 |\n| Kiro / AWS DevOps Agent | 分析与根因辅助 | 1.2.1 |\n| AWS Compute Optimizer | 规格建议 | 1.3.1 |\n| Amazon EBS（gp3、io2、st1） | 块存储选型与调优 | 1.3.2、1.3.6 |\n| Amazon S3（multipart、TA、lifecycle） | 对象存储性能与分层 | 1.3.3 |\n| AWS DataSync | 批量数据搬迁 | 1.3.3 |\n| Amazon EFS / FSx / S3 Files | 共享存储三候选 | 1.3.4 |\n| Amazon RDS（Performance Insights、RDS Proxy） | 数据库定位与连接治理 | 1.3.5 |\n| Amazon EC2（placement groups、增强网络） | 实例布局与网络能力 | 1.3.6 |"}},{"domain":2,"name":"可靠性与业务连续性","weight":"22%","practice":[{"id":"D2-005","d":2,"t":"single","q":"Northwind 的队列机组夜里流量回落，Auto Scaling 将缩容实例。团队担心缩容环节出问题，哪条认识是对的","o":[{"l":"A","t":"缩容是自动的就不会有风险，放心让它缩"},{"l":"B","t":"把最小实例数设为 0，夜里完全缩空最省钱"},{"l":"C","t":"缩容瞬间会断开在途连接，最少台数别设零，要留缓冲"},{"l":"D","t":"干脆禁用缩容，只扩不缩最稳"}],"a":["C"],"e":"✅ 正确项：C。缩容跟扩容一样有风险：缩容瞬间断开连接，正在处理的请求会受影响，所以最少台数别设零，连接断开要有缓冲；按业务基线定最小值，缩容的节奏也要留余地。关联考点：域 2.1.1「在计算环境中配置与管理伸缩机制」。\n\n❌ A：「缩容没有风险」是经典误区，断连与容量触底都是真实风险。\n❌ B：最小台数设零等于夜里把机组清空，冷启动慢的应用回不来，业务一上来直接裸奔。\n❌ D：禁用缩容就放弃了弹性的一半，夜里白白付费，与弹性目标相反。\n\n📌 关键概念：缩容留余地——最少台数保命、断连留缓冲；扩得快也要缩得稳。","s":"自编·2.1.1"},{"id":"D2-007","d":2,"t":"single","q":"Northwind 的静态地图瓦片被全球司机端 App 高频拉取，源站跨区流量费与压力都高。用哪个服务把内容送到用户跟前","o":[{"l":"A","t":"CloudFront 把瓦片缓存在全球边缘节点，用户就近取"},{"l":"B","t":"ElastiCache 给源站加一层应用缓存"},{"l":"C","t":"给源站实例升级带宽与规格"},{"l":"D","t":"在每个大区各建一套全量瓦片副本站"}],"a":["A"],"e":"✅ 正确项：A。边缘缓存层：CloudFront 把静态内容按缓存键与 TTL 缓在全球边缘节点，用户就近取，回源次数与跨区流量都降，源站压力卸载——静态瓦片正是边缘缓存的教科书场景。关联考点：域 2.1.2「用 AWS 服务实施缓存以增强动态伸缩」。\n\n❌ B：ElastiCache 是应用旁路缓存，服务的是应用查库，不在用户与源站之间的边缘路径上。\n❌ C：升带宽与规格是硬扛，回源流量没降、跨区费用没降，治标且贵。\n❌ D：各大区自建全量副本，存储翻倍、一致性同步与治理负担全要自己背。\n\n📌 关键概念：两层缓存分工——CloudFront 挡边缘（静态内容、TTL、就近返回）、ElastiCache 挡应用旁路（查库回填）；静态内容全球分发认 CloudFront。","s":"自编·2.1.2"},{"id":"D2-009","d":2,"t":"single","q":"Northwind 的 DynamoDB 订单表流量忽高忽低：平时平稳、大促当晚峰值跳十倍，容量规划反复踩坑。容量模式怎么选","o":[{"l":"A","t":"预置容量按平时流量配，大促当晚手动改表"},{"l":"B","t":"预置容量直接按十倍峰值拉满，一步到位"},{"l":"C","t":"按需容量模式，按请求计费，免容量规划"},{"l":"D","t":"全局表做多区域副本分摊流量"}],"a":["C"],"e":"✅ 正确项：C。DynamoDB 按需模式（on-demand）按请求计费、免容量规划，流量忽高忽低的负载最省心；代价是单价更高。平时平稳选预置更省，忽高忽低选按需求省心——两条路的适用条件正好相反。关联考点：域 2.1.3「配置与管理 AWS 托管数据库的伸缩」。\n\n❌ A：当晚手动改表赶上零点峰值就是事故窗口，题干已说容量规划反复踩坑，这条路走不通。\n❌ B：按十倍峰值拉满预置，平时九成的容量白付，成本结构最差。\n❌ D：全局表做的是多区域副本，与单区域的容量模式选择是两个维度。\n\n📌 关键概念：DynamoDB 两模式——稳定流量选预置（可再挂 Auto Scaling）、波动流量选按需求省心；单价与省心互为代价。","s":"自编·2.1.3"},{"id":"D2-014","d":2,"t":"single","q":"Northwind 盘点数据层：哪些托管服务的数据分布开箱即得跨多个可用区，不需要自己另配多可用区部署","o":[{"l":"A","t":"自建在 EC2 单机上的 MySQL"},{"l":"B","t":"挂给实例的单块 EBS 卷"},{"l":"C","t":"DynamoDB 表与 S3 桶里的对象"},{"l":"D","t":"单可用区部署的 RDS 实例"}],"a":["C"],"e":"✅ 正确项：C。托管服务自带容错：DynamoDB 与 S3 的数据自动跨多个可用区存放，开箱即得；Aurora 数据天然分布在三个可用区。自己要另配 Multi-AZ 的是 RDS 这类部署形态可选的服务。关联考点：域 2.2.2「配置容错系统」。\n\n❌ A：单机 MySQL 没有任何自动副本，机器坏数据就不可用，属于自己拼容错的对象。\n❌ B：EBS 卷挂在一个可用区内，卷跨不了可用区，单卷没有跨区能力。\n❌ D：RDS 单可用区部署正是没有容错的形态，要跨区得显式开 Multi-AZ。\n\n📌 关键概念：容错两条路——托管服务自带的（S3、DynamoDB、Aurora）开箱即得；可选拓扑的（RDS Multi-AZ）要显式配置。","s":"自编·2.2.2"},{"id":"D2-016","d":2,"t":"single","q":"Northwind 的备份计划跑了几个月，怎么证明这些备份真顶用","o":[{"l":"A","t":"定期从备份副本做恢复演练，验证数据可完整拉回"},{"l":"B","t":"每天看备份任务状态灯是绿的即可"},{"l":"C","t":"统计备份数量与总大小，越多越安全"},{"l":"D","t":"把保留期设置到最长档位"}],"a":["A"],"e":"✅ 正确项：A。备份有效性的证明是恢复：定期从副本拉数据做恢复演练（比如月度从复制区域拉回一台），任选时间手动触发按需备份验证可恢复性——演练过的备份才算数。关联考点：域 2.3.1「用 AWS 服务自动化快照与备份」。\n\n❌ B：任务成功只说明快照生成了，不等于数据能恢复、应用能起来，状态灯不是有效性证明。\n❌ C：数量与大小和可用性没有因果关系，堆一堆没演练过的备份还是等于没有备份。\n❌ D：保留期拉长增加成本，与「能不能恢复」是两件事。\n\n📌 关键概念：没演练过恢复的备份等于没有备份；按需触发与恢复演练是备份体系的两条腿。","s":"自编·2.3.1"},{"id":"D2-018","d":2,"t":"single","q":"Northwind 值班误执行了删除语句，要求最多丢一分钟数据、一刻钟内恢复业务。恢复方法用哪个","o":[{"l":"A","t":"从昨晚的自动快照新建实例恢复"},{"l":"B","t":"把跨区副本提升为新主库"},{"l":"C","t":"时间点恢复（PITR），把日志重放到误删前一分钟的新实例"},{"l":"D","t":"直接在生产库上执行反向语句补数据"}],"a":["C"],"e":"✅ 正确项：C。时间点恢复把日志重放到指定时刻，能回到几分钟前，RPO 小——正对「最多丢一分钟」的要求；恢复成新实例、校验后再切流量，一刻钟内完成正是这套方法的画像。关联考点：域 2.3.2「用多种方法恢复数据库」。\n\n❌ A：昨晚快照的 RPO 是快照间隔，从昨晚到现在几个小时的数据都丢了，超出一分钟红线。\n❌ B：副本提升面向主库故障的接管，误删操作已同步复制到副本，提升出来还是被误删后的状态。\n❌ D：对生产库再动手补数据风险极高，且反向语句无法保证一致性，恢复流程的正解是新实例校验后切换。\n\n📌 关键概念：误删恢复三步——PITR 到新实例、校验数据完整、再切连接串；别直接对生产库动刀。","s":"自编·2.3.2"},{"id":"D2-019","d":2,"t":"single","q":"Northwind 用时间点恢复把被误删的库恢复出来了。接下来按什么流程走","o":[{"l":"A","t":"恢复完成后立即把生产库删掉，把流量指到恢复库"},{"l":"B","t":"先在生产库上跑校验脚本，通过后原地覆盖"},{"l":"C","t":"全员停机等 DBA 逐条人工核对差异"},{"l":"D","t":"在恢复出的新实例上校验数据完整性，确认无误后再把应用连接串切过去"}],"a":["D"],"e":"✅ 正确项：D。误删场景的标准流程是先恢复到新实例，校验数据完整（行数、关键表、业务抽检），确认无误后切连接串——生产库全程不被二次动手，风险隔离在恢复实例上。关联考点：域 2.3.2「用多种方法恢复数据库」。\n\n❌ A：先删生产再切换，中间任何问题都没有退路，顺序颠倒的灾难剧本。\n❌ B：校验应在恢复实例上做，「通过后原地覆盖」又回到对生产库直接动手的老路。\n❌ C：人工逐条核对既慢又不可靠，校验脚本与业务抽检才是可执行路径。\n\n📌 关键概念：恢复流程铁律——新实例隔离校验、切换放最后；别对生产库做二次手术。","s":"自编·2.3.2"},{"id":"D2-021","d":2,"t":"single","q":"Northwind 开了版本控制后存储费用翻着涨。旧版本怎么治理","o":[{"l":"A","t":"关掉版本控制，费用立刻回落"},{"l":"B","t":"每周安排人工清理旧版本对象"},{"l":"C","t":"把桶清空重建一遍"},{"l":"D","t":"与生命周期联动：旧版本到期自动清理或转低频档"}],"a":["D"],"e":"✅ 正确项：D。版本堆积不清理存储费会翻倍，治法是与生命周期联动：旧版本到期清理，或先转低频档再到期清理，规则化自动执行。版本控制防误覆盖误删与生命周期管费用两件事配合用。关联考点：域 2.3.3「为存储服务实施版本控制」。\n\n❌ A：关掉版本控制丢掉的是误覆盖误删的防护，为省钱拆防护方向反了。\n❌ B：人工每周清旧版本不可持续，量大时清不动，生命周期规则天生就是干这个的。\n❌ C：清空重建丢数据，动作极端。\n\n📌 关键概念：版本控制配生命周期才完整——防护靠版本、费用靠到期规则；旧版本转低频档再清理是标准两段式。","s":"自编·2.3.3"}],"sections":[{"h":"实施伸缩性与弹性","body":"### 这一域考什么\n\n这一域问的是：系统遇到压力和故障时还扛不扛得住。拆成三问：\n\n1. **涨得快**：流量涨十倍，机器能不能自动跟上，过去了能不能缩回来，对应任务 2.1。\n2. **挂得住**：一台机器、一个机房、一条线路出事，业务还断不断，对应任务 2.2。\n3. **丢不了**：数据误删、区域故障，多快能恢复到哪一步，对应任务 2.3。\n\n这门课是运维课。伸缩策略配不配得对、健康检查排不排得清、备份方案选不选得省，都考动手。它和监控域的关系是一看一扛：监控域把异常看出来，这一域让系统自己消化掉一部分。\n\n### 读完这个域要能做什么\n\n- 给计算层配一套跟着负载走的伸缩策略，说清四种策略各适合什么节奏。\n- 用边缘缓存与应用缓存把读压力卸掉，给数据库层选对伸缩路径。\n- 配置负载均衡健康检查与多可用区部署，排掉「实例健康却被摘除」这类故障。\n- 按恢复时间目标与恢复点目标选备份方案和灾备等级，把恢复演练跑通一遍。\n\n### 和其他认证怎么接\n\n| 其他认证/能力 | 对应的那件事 | 这里有什么不同 | 什么时候该想起它 |\n|---|---|---|---|\n| SAP-C03（架构师专业级） | 都讲高可用与灾备 | 架构级考怎么设计；本课考配得出来、修得好 | 要定容灾等级而不是执行时 |\n| CLF-C02（云从业者） | 都知道弹性是云的特性 | 从业者级停在概念；本课要配伸缩策略、排健康检查故障 | 只能说出「云有弹性」时 |\n\n对照只用来迁移已有理解。做题以本域官方口径为准。\n\n### 官方口径的三条边界\n\n- 官方 Exam Guide 给出技能点编号与原文，不给逐考点的出现频率。\n- 官方认证页写明题型含单选与多选，多选全选对才得分。\n- 及格线 720 分（100–1000 补偿式计分），不要求每域单独达线。\n\n#### 这一节学什么\n这一节对应考纲任务 2.1「实施伸缩性与弹性」。\n\n> 官方原名：Implement scalability and elasticity.\n\n伸缩是可靠性的第一道墙：扛不住压力，后面都白搭。三个技能点从计算层的伸缩机制讲到缓存卸载，再到托管数据库的容量管理。主线是：机器加得起 → 读请求卸得掉 → 数据库扩得上。\n\n#### 在计算环境中配置与管理伸缩机制\n\n> 官方原名：Configure and manage scaling mechanisms in compute environments.\n\n**这条在问什么。** 考题给你「大促流量涨十倍、平时掉回零头」这类场景，考你 Auto Scaling 的策略怎么配、出问题怎么排。\n\n**定义**：伸缩（scaling）指容量跟着负载增减。纵向扩容（scale up）把单台机器换大，横向伸缩（scale out）加减机器数量。弹性（elasticity）特指横向伸缩能自动跟着负载走，不用人盯。Auto Scaling 组管一组同构实例，声明最少、最多与期望台数。实例不健康时自动替换，组里数量不变。\n\n**怎么运作**。伸缩策略按触发方式分四档：\n\n1. 手动伸缩：控制台加减实例，一次性活动用。\n2. 计划伸缩（scheduled scaling）：按日历定时扩，早晚高峰可预期时用。\n3. 动态伸缩（dynamic scaling）：按指标自动加减，最常用。\n4. 预测伸缩（predictive scaling）：按历史流量曲线提前扩，规律性业务用。\n\n动态伸缩里最常用的是目标追踪（target tracking）：盯一个指标、给一个目标值，该加几台减几台系统自己算。比如把 CPU 均值盯在 60%，低了减、高了加。步进伸缩（step scaling）按越线幅度分档动作，适合要分档快慢的场景。\n\n一条目标追踪策略的配置长这样：\n\n```bash\naws autoscaling put-scaling-policy \\\n  --auto-scaling-group-name nw-order-asg \\\n  --policy-type TargetTrackingScaling --policy-name nw-cpu-60 \\\n  --target-tracking-configuration '{\n    \"TargetValue\": 60,\n    \"PredefinedMetricSpecification\": {\n      \"PredefinedMetricType\": \"ASGAverageCPUUtilization\"\n    }\n  }'\n```\n\n实例不健康时的替换也归 Auto Scaling 管。它用 EC2 或 ELB 的健康检查结果判断，坏一台补一台。ELB 健康检查的细节在任务 2.2 展开。\n\n**什么时候用，什么时候别用**。负载有波动就值得动态伸缩，负载常年恒定就固定台数。预测伸缩对规律峰锦上添花，对突发流量来不及。冷启动慢的应用要留预热时间，目标值别压太狠。代价句：缩容跟扩容一样有风险——缩容瞬间断开连接，最少台数别设零。\n\n💡 **场景举例**（虚构教学示意）：Northwind 大促当晚订单量涨十倍。队列机组的目标追踪策略把 CPU 盯在 60%，一小时内自动加了八台。大促结束自动缩回原样，账单只多付高峰那几个小时。\n\n**关联服务**：AWS Auto Scaling（Auto Scaling 组、目标追踪、步进、预测伸缩）、Amazon EC2、Amazon CloudWatch。\n\n#### 用 AWS 服务实施缓存以增强动态伸缩\n\n> 官方原名：Implement caching by using AWS services to enhance dynamic scalability (for example, Amazon CloudFront, Amazon ElastiCache).\n\n**这条在问什么。** 考题给你「数据库被打爆、流量其实都是重复读」这类现象，考你缓存放在哪一层、怎么配。\n\n**定义**：缓存（caching）把算过或取过的结果放在离使用者更近的地方，下次直接取，不打后端。云上常用两层：\n\n- 边缘缓存：CloudFront 把内容放全球边缘节点，用户就近取。\n- 应用缓存：ElastiCache 是托管 Redis 或 Memcached，应用先问缓存再回源。\n\n**怎么运作**。两层各挡一段流量：\n\n1. CloudFront：静态内容按缓存键与生存时间（TTL）缓在边缘，动态请求可设为透传不缓存。回源次数降下来，源站压力与跨区流量都省。\n2. ElastiCache：应用先查缓存，未命中才查数据库并回填，这套叫缓存旁路模式（cache-aside）。过期靠 TTL 控制，更新靠主动失效。\n3. DAX（DynamoDB Accelerator，DynamoDB 的内存缓存）：给 DynamoDB 表加一层微秒级读缓存，热点读不用改应用代码。\n\n缓存层的关键指标是命中率：命中率高，后端压力成比例下降。CloudWatch 里能看 CloudFront 与 ElastiCache 的命中指标。\n\n**什么时候用，什么时候别用**。读多写少、容忍短暂陈旧的数据适合缓存；写频繁或要强一致的数据，失效逻辑会拖垮开发节奏。代价句：缓存是卸载不是保险——命中率掉下来，后端照样被打爆，所以命中率要配告警。ElastiCache 按节点小时收费，小流量场景整夜挂着未必划算。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的货物轨迹查询页每秒上千次请求，数据库 CPU 打满。查询结果放进 ElastiCache for Redis，静态地图瓦片走 CloudFront，数据库 CPU 掉回两成，高峰期不用加只读副本了。\n\n**关联服务**：Amazon CloudFront、Amazon ElastiCache（Redis、Memcached）、Amazon DynamoDB（DAX）、Amazon CloudWatch。\n\n#### 配置与管理 AWS 托管数据库的伸缩\n\n> 官方原名：Configure and manage scaling in AWS managed databases (for example, Amazon RDS, DynamoDB).\n\n**这条在问什么。** 考题给你「数据库撑不住读流量」或「表容量规划反复踩坑」这类场景，考你托管数据库的伸缩路径选型。\n\n**定义**：托管数据库的伸缩分三路。纵向是换实例规格，横向是加只读副本分担读，无服务器化是按需自动升降。DynamoDB 走另一条路：容量模式分预置与按需，不靠实例规格。\n\n**怎么运作**。三个引擎对号入座：\n\n- RDS：实例规格纵向换档。只读副本（read replica）横向分读，写入仍走主实例。存储可开自动伸缩，按阈值扩卷。\n- Aurora：Aurora Serverless v2 按容量单位自动升降，波动负载只付用到的部分。\n- DynamoDB：预置模式（provisioned capacity）按读写容量单位配额，可再挂 Auto Scaling。按需模式（on-demand capacity）按请求计费，免容量规划。全局表（global table）做多区域副本。\n\n**什么时候用，什么时候别用**。读压力用只读副本，但副本有复制延迟，写完马上读的场景要小心陈旧数据。规格换档多数有中断窗口，生产变更要排期。DynamoDB 流量稳定选预置更省，忽高忽低选按需求省心，代价是单价更高。连接数暴涨先想 RDS Proxy 治理，而不是先升配——那是监控域讲数据库调优提过的路数。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的报表库白天跑批、晚上空闲，换成 Aurora Serverless v2 后夜里自动缩到最小容量，账单降了四成。订单表在 DynamoDB 上用预置容量加 Auto Scaling，大促前把上限预先抬高，零点峰值没掉一次请求。\n\n**关联服务**：Amazon RDS（只读副本、存储自动伸缩）、Amazon Aurora（Aurora Serverless v2）、Amazon DynamoDB（预置与按需容量、自动伸缩、全局表）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「加了伸缩就不用容量设计」 | 上限、预热时间、启动配置还是要先算清楚 |\n| 2 | 「目标追踪和步进差不多」 | 目标追踪盯指标定目标；步进按越线幅度分档 |\n| 3 | 「缓存一挂全站挂」 | 缓存层要设计成可降级：缓存失效后端还能顶一阵 |\n| 4 | 「只读副本等于读写都扩了」 | 副本只分读；写入仍走主实例 |\n| 5 | 「DynamoDB 按需永远更贵」 | 流量忽高忽低时按需求省心，稳定时预置更省 |\n| 6 | 「缩容没有风险」 | 缩容瞬间断开连接，最少台数别设零 |\n\n#### 记忆要点\n\n1. **伸缩四策略**：手动、计划、动态、预测，各配各的节奏。\n2. **目标追踪盯指标**：给一个目标值，加减台数系统自己算。\n3. **缓存两层**：CloudFront 挡边缘、ElastiCache 挡应用旁，命中率是命根。\n4. **数据库三路**：纵向换档、只读分读、无服务器化按需。\n5. **DynamoDB 两模式**：稳定流量预置，波动流量按需。\n6. **缩容留余地**：最少台数保命，连接断开要有缓冲。\n\n---"},{"h":"实施高可用与韧性环境","body":"#### 这一节学什么\n这一节对应考纲任务 2.2「实施高可用与韧性环境」。\n\n> 官方原名：Implement highly available and resilient environments.\n\n伸缩解决「扛得住量」，高可用解决「扛得住坏」。两个技能点一个管入口、一个管底座：入口用负载均衡加健康检查把坏实例摘出去，底座用多可用区部署让单点故障不伤业务。主线是：入口会摘除 → 底座有副本。\n\n#### 配置与排障 Elastic Load Balancing 与 Route 53 健康检查\n\n> 官方原名：Configure and troubleshoot Elastic Load Balancing (ELB) and Amazon Route 53 health checks.\n\n**这条在问什么。** 考题给你「实例明明健康却被摘除流量」或「健康检查一直失败」这类排障场景，考你两套健康检查的机制与排查路径。\n\n**定义**：Elastic Load Balancing（ELB，弹性负载均衡）是托管负载均衡器，把入口流量分给后端多台实例。三种形态：\n\n- ALB（Application Load Balancer，七层）：按 HTTP 路径与头部路由，应用与容器入口首选。\n- NLB（Network Load Balancer，四层）：按连接与端口转发，超低延迟与超高吞吐。\n- GWLB（Gateway Load Balancer）：把流量分给防火墙这类安全设备。\n\n健康检查是摘除的判据：ALB、NLB 主动探活目标组（target group）里的每个目标，探活失败到阈值就摘流量。Route 53 健康检查是另一层：它监控端点或告警，给 DNS 故障转移做判据。\n\n**怎么运作**。两层各管一层：\n\n1. ELB 目标组健康检查：声明协议、端口、路径、间隔与阈值。失败次数到不健康阈值，目标被摘流量。恢复次数到健康阈值，再挂回来。\n2. Route 53 健康检查：监控公网端点，或关联 CloudWatch 告警。配故障转移策略（failover routing）时，主端点检查失败，流量自动切到备用端点。\n\n一条目标组健康检查的配置长这样：\n\n```bash\naws elbv2 modify-target-group \\\n  --target-group-arn arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/nw-tg/abc123 \\\n  --health-check-protocol HTTP --health-check-path /healthz \\\n  --health-check-interval-seconds 30 \\\n  --healthy-threshold-count 2 --unhealthy-threshold-count 3\n```\n\n**排障判据**。实例健康却被摘除，按序排查：\n\n1. 检查路径与端口对不对：路径返回 200 才算健康，应用忘了注册 /healthz 路由就是全军被摘。\n2. 安全组放不放负载均衡器网段：实例入站规则要放行目标端口，网络不通就一直不健康。\n3. 阈值与间隔匹不匹配启动速度：应用预热要 40 秒，间隔 10 秒配 3 次失败就是误杀。\n4. Route 53 侧再看健康检查关联的告警状态与端点可达性。\n\n**什么时候用，什么时候别用**。ALB 按请求路由带路径语义，是应用入口默认选择；纯 TCP 高吞吐用 NLB。健康检查端点要用轻量、真实代表应用健康的路径——探数据库连通的重检查反而会把实例判死。代价句：检查太敏感会把正常滚动发布摘成全站不可用，阈值要留出启动与预热时间。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的订单入口用 ALB，一次发布后实例全被摘除。排查发现新版本忘了注册 /healthz 路由，健康检查全 404。先回退恢复流量，再把检查路径挪到独立存活探针上，发布流程从此先验路由再切流量。\n\n**关联服务**：Elastic Load Balancing（ALB、NLB、GWLB、目标组）、Amazon Route 53（健康检查、故障转移路由）、Amazon EC2、Amazon CloudWatch。\n\n#### 配置容错系统（多可用区部署）\n\n> 官方原名：Configure fault-tolerant systems (for example, Multi-AZ deployments).\n\n**这条在问什么。** 考题给你「一个机房断电、业务不能停」这类要求，考你多可用区部署怎么配、哪些服务自带。\n\n**定义**：可用区（Availability Zone，AZ）是同一区域内电力与网络相互独立的机房组。容错（fault tolerance）指单个组件故障时系统自己顶住，业务不断。多可用区部署把同份工作负载复制到至少两个可用区，单区故障不伤业务。\n\n**怎么运作**。两层做法：\n\n1. 应用层自己拼：\n   - Auto Scaling 组把子网铺到多个可用区，实例自动分散。\n   - ALB 跨可用区监听，一个区挂了流量自动走另一个区。\n2. 托管服务自带，不用拼：\n\n   - RDS 多可用区部署（Multi-AZ）：主实例同步复制到备用区，主挂了自动故障转移，连接地址不变。\n   - DynamoDB 与 S3：数据自动跨多个可用区存放，开箱即得。\n   - Aurora：数据天然分布在三个可用区，不用另配多可用区部署。\n\n**什么时候用，什么时候别用**。生产数据库开 Multi-AZ 是默认答案：单点风险换少量同步延迟。代价句：Multi-AZ 买的是高可用不是性能——备用实例平时不接流量，要读写分离另配只读副本。跨区域容灾比跨可用区贵一个量级，等级怎么取舍放任务 2.3 细讲。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的报表库开着 RDS Multi-AZ。一次可用区维护窗口里主实例自动故障转移，应用连接串没改，业务只抖了约一分钟。值班运维是事后看事件通知才知道发生过切换。\n\n**关联服务**：Amazon RDS（Multi-AZ 部署）、Amazon EC2（Auto Scaling、多子网部署）、Elastic Load Balancing（ALB 跨可用区）、Amazon Aurora、Amazon DynamoDB、Amazon S3。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「健康检查失败就是实例坏了」 | 也可能是路径、端口、安全组或阈值配错，按序排查 |\n| 2 | 「ALB 摘除实例后实例会被杀」 | 摘流量不等于杀机器；替换由 Auto Scaling 判定 |\n| 3 | 「RDS Multi-AZ 备用也能读」 | 备用只做同步复制；要分读另配只读副本 |\n| 4 | 「多可用区等于跨区域容灾」 | 可用区在同一区域内；区域级故障要跨区域方案 |\n| 5 | 「健康检查端点越重越准」 | 重检查会误杀实例，把依赖抖动放大成全站摘除 |\n| 6 | 「Route 53 健康检查和 ELB 一回事」 | 一个管 DNS 故障转移，一个管目标组摘除，层次不同 |\n\n#### 记忆要点\n\n1. **两类健康检查**：ELB 管目标组摘流量，Route 53 管 DNS 故障转移。\n2. **摘流量不杀机器**：摘除是入口动作，替换归 Auto Scaling。\n3. **摘除排障四步**：路径端口 → 安全组 → 阈值间隔 → Route 53 侧告警。\n4. **多可用区是默认底座**：托管服务多数自带，应用层靠多子网加跨区均衡。\n5. **Multi-AZ 买高可用**：备用不接流量；分读用只读副本。\n6. **区与区域两个等级**：跨可用区防机房故障，跨区域防区域故障。\n\n---"},{"h":"实施备份与恢复策略","body":"#### 这一节学什么\n这一节对应考纲任务 2.3「实施备份与恢复策略」。\n\n> 官方原名：Implement backup and restore strategies.\n\n前两个任务让系统「坏不了、挂得住」，这个任务兜底：真丢了能不能找回来。四个技能点从日常备份自动化讲到数据库恢复方法，再到存储版本化与灾备等级。主线是：备得上 → 恢得了 → 版本可回退 → 大灾有预案。\n\n#### 用 AWS 服务自动化快照与备份\n\n> 官方原名：Automate snapshots and backups for AWS resources (for example, EC2 instances, RDS DB instances, EBS volumes, S3 buckets, DynamoDB tables) by using AWS services (for example, AWS Backup).\n\n**这条在问什么。** 考题给你「备份全靠人点控制台、漏一次就出事」这类痛点，考你把备份自动化、跨服务统一管。\n\n**定义**：AWS Backup 是统一备份服务，一个备份计划（backup plan）定义备份哪些资源、多久一次、保留多久、复制到哪。它替你调度各服务的原生快照能力：\n\n- EC2 实例与 EBS 卷：快照（snapshot）是存储某时刻的只读副本，增量存到 S3。\n- RDS 数据库实例：自动快照与时间点恢复。\n- S3 桶、DynamoDB 表、EFS、FSx：各有原生备份或快照路径，统一挂进计划。\n\n**怎么运作**。铺一套自动化备份分四步：\n\n1. 建备份计划：cron 式计划、保留天数、复制到另一个区域（防区域级故障）。\n2. 圈资源：按标签或资源 ID 挂进计划。用标签圈资源，新资源上线自动被覆盖。\n3. 备份保管库（backup vault）分域存放：库配访问策略与加密，权限好管。\n4. 按需触发与恢复演练：任选时间手动备份，演练从副本拉数据。\n\n一条备份计划的配置长这样：\n\n```bash\naws backup create-backup-plan --backup-plan '{\n  \"BackupPlanName\": \"nw-daily-35d\",\n  \"BackupRules\": [{\n    \"RuleName\": \"daily\",\n    \"TargetBackupVaultName\": \"nw-vault\",\n    \"Schedule\": \"cron(0 3 * * ? *)\",\n    \"Lifecycle\": {\"DeleteAfterDays\": 35}\n  }]\n}'\n```\n\n**什么时候用，什么时候别用**。多服务备份统一管、合规要留档的，AWS Backup 是首选。单一 RDS 库用自带自动快照就够，不必再套一层。代价句：计划建好不等于备份有效——恢复没演练过的备份等于没有备份，备份跟主数据放同区域会一起没。所以要配跨区复制与保管库锁（backup vault lock，防篡改删除）。\n\n💡 **场景举例**（虚构教学示意）：Northwind 用「team=nw-prod」标签圈资源，一个备份计划覆盖 EC2、EBS、RDS 与 DynamoDB，每天凌晨三点自动跑，副本同时复制到另一区域。新上线的报表库带着标签自动进计划，月度恢复演练直接从副本区域拉回一台。\n\n**关联服务**：AWS Backup（备份计划、保管库、跨区复制、保管库锁）、Amazon EBS、Amazon RDS、Amazon S3、Amazon DynamoDB、Amazon EFS、Amazon FSx。\n\n#### 用多种方法恢复数据库\n\n> 官方原名：Use various methods to restore databases (for example, point-in-time restore) to meet recovery time objective (RTO), recovery point objective (RPO), and cost requirements.\n\n**这条在问什么。** 考题给你「误删表要恢复，最多丢一分钟数据、一刻钟内恢复」这类场景，考你按恢复目标选方法。\n\n**定义**：恢复的两个硬指标。RTO（recovery time objective，恢复时间目标）指从故障到恢复业务允许的最长时间。RPO（recovery point objective，恢复点目标）指允许丢多少数据的时间窗。RTO 越短、RPO 越小，方案越贵——选型就是在这两个数与成本之间找平衡。\n\n**怎么运作**。恢复方法按 RTO 从长到短排：\n\n1. 快照恢复：从某次快照新建实例。RPO 等于快照间隔，成本低。\n2. PITR（point-in-time restore，时间点恢复）：把日志重放到指定时刻，能回到几分钟前。RPO 小，恢复时长随日志量增长。\n3. 副本提升（promote）：主库故障时把跨区副本或只读副本提为主，RTO 最短，平时要付副本的钱。\n\nDynamoDB 表同样支持时间点恢复，能回到恢复窗口内的任一时刻、恢复成一张新表；窗口最长 35 天（默认 35 天，可在 1~35 配置）。\n\n**什么时候用，什么时候别用**。按 RTO、RPO 反推：\n\n- RPO 秒级：同步跨区副本，代价是钱。\n- RPO 分钟级：时间点恢复。\n- RPO 小时级：快照够用。\n\n误删场景先恢复到新实例，校验数据后再切流量，别直接动生产库。代价句：超大库的时间点恢复可能比快照恢复还慢——日志重放时间随库与时间差增长，赶时间的场景要先有预案。\n\n💡 **场景举例**（虚构教学示意）：Northwind 报表库被误执行了删除语句。值班按手册把库恢复到一分钟前的新实例，校验完整后切连接串，全程十几分钟。RPO 一分钟、RTO 一刻钟，正好在公司红线内。\n\n**关联服务**：Amazon RDS（快照恢复、时间点恢复、只读副本提升、跨区副本）、Amazon DynamoDB（按需备份、时间点恢复）、AWS Backup。\n\n#### 为存储服务实施版本控制\n\n> 官方原名：Implement versioning for storage services (for example, Amazon S3, Amazon FSx).\n\n**这条在问什么。** 考题给你「对象被误覆盖误删要拿回旧版」这类需求，考你版本控制怎么配、怎么回退。\n\n**定义**：版本控制（versioning）给数据保存历史版本，同名的每次写入生成新版本，旧版不丢。S3 桶开启版本控制后，覆盖与删除都不再是破坏性操作：覆盖是新增版本，删除是打删除标记（delete marker），旧版本仍在桶里。FSx for Windows File Server 的卷影副本（shadow copies）给共享文件提供同类的历史版本能力。\n\n**怎么运作**。S3 上的机制：\n\n1. 开启后每次上传生成新版本 ID，读取默认拿最新，带版本 ID 可取任意旧版。\n2. 删除只是加删除标记，去掉标记就恢复可见。\n3. 误删恢复路径：列出桶内版本 → 找到删除前的版本 ID → 取回该版本。\n4. 与生命周期联动：旧版本转低频档或到期清理，费用才不会翻着涨。\n\n一条开启版本控制的命令：\n\n```bash\naws s3api put-bucket-versioning --bucket nw-shipment-records \\\n  --versioning-configuration Status=Enabled\n```\n\n**什么时候用，什么时候别用**。生产桶、法规留痕的桶默认开，临时中转桶开了白花钱。代价句：版本控制防误覆盖误删，防不了桶级配置被改坏——桶策略与权限收紧要另做。版本堆积不清理，存储费会翻倍。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的运单桶开了版本控制。一位分析同事用脚本误覆盖了三天的运单文件，运维按版本 ID 找回旧版，十分钟恢复。随后给旧版本配了到期清理规则，费用回落。\n\n**关联服务**：Amazon S3（版本控制、删除标记、生命周期）、Amazon FSx for Windows File Server（卷影副本）、AWS Backup。\n\n#### 遵循灾备流程与最佳实践\n\n> 官方原名：Follow disaster recovery procedures and best practices (for example, backup and restore, pilot light, warm standby, active/active).\n\n**这条在问什么。** 考题给你「区域级大灾要有预案，预算有限选什么等级」这类问题，考你灾备四等级的取舍。\n\n**定义**：灾备（disaster recovery）等级按成本从低到高排：\n\n1. 备份与恢复（backup and restore）：只备数据，灾后从零重建。RTO 最长、成本最低。\n2. pilot light：数据复制到备用区域常驻，最小组件留底，灾时拉起全栈。数据在、机器不在。\n3. 温备（warm standby）：精简版全栈在备用区域常跑，灾时扩容接管。RTO 分钟级。\n4. 双活（active/active）：两区域同时服务流量，一个挂了另一个继续。RTO 最短、成本最高。\n\n**怎么运作**。等级选型看业务等级与预算：\n\n- 能容忍几小时到几天中断的内部系统，选备份与恢复。\n- 核心业务但预算有限，选 pilot light 或温备。\n- 停机即巨额损失的下单入口，选双活。\n- 关键组件分头配：数据层跨区复制（RDS 跨区副本、DynamoDB 全局表、S3 跨区复制）；流量层 Route 53 健康检查加故障转移路由（任务 2.2 已讲）。切换步骤与预热动作写成手册，进运维知识库统一管。\n\n**什么时候用，什么时候别用**。等级不是越高越好——双活要处理双写与一致性冲突，复杂度陡增；多数业务的合理组合是温备加关键数据跨区加定期演练。代价句：没演练过的预案等于没有预案——切换步骤、权限、网络路径都会在演练里暴露问题。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的下单链路定为温备：备用区域常驻一套精简栈，数据库跨区副本同步。区域级演练时把 Route 53 切到备用区域，十分钟内接管下单。内部报表系统走备份与恢复等级，省下的预算投给下单链路。\n\n**关联服务**：Amazon Route 53（故障转移路由、Application Recovery Controller）、Amazon RDS（跨区只读副本）、Amazon DynamoDB（全局表）、Amazon S3（跨区复制）、AWS Backup（跨区复制）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「备份计划建好就高枕无忧」 | 没演练过恢复的备份等于没有备份 |\n| 2 | 「备份放同区域一样安全」 | 区域故障时主数据和备份一起没了 |\n| 3 | 「时间点恢复一定最快」 | 大库日志重放可能比快照恢复还慢 |\n| 4 | 「版本控制能防整桶被删」 | 它防误覆盖误删；桶级防护与权限要另配 |\n| 5 | 「双活是最优解」 | 一致性冲突与成本陡增，多数业务温备加演练更划算 |\n| 6 | 「误删直接在生产库上恢复」 | 恢复到新实例校验后再切，别对生产再动手 |\n\n#### 记忆要点\n\n1. **RTO RPO 两把尺**：恢复多快、丢多少，先定数再选方案。\n2. **恢复方法三档**：快照最省、时间点恢复精细、副本提升最快。\n3. **删除只是打标记**：S3 开版本控制后旧版都在，去掉标记即恢复。\n4. **灾备四等级**：备份恢复、pilot light、温备、双活，成本与 RTO 反向。\n5. **备份要跨区**：同区域备份在区域故障时一起没。\n6. **演练是灾备的一半**：没演练过的预案在真灾时当没有。\n\n---"}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 2.1.1 | 伸缩策略四档与目标追踪 | ⭐⭐⭐ | 情景单选 |\n| 2.1.2 | 缓存两层与命中率 | ⭐⭐⭐ | 情景单选/多选 |\n| 2.1.3 | 托管数据库伸缩路径 | ⭐⭐⭐ | 情景单选 |\n| 2.2.1 | ELB 与 Route 53 健康检查与排障 | ⭐⭐⭐ | 排障情景题 |\n| 2.2.2 | 多可用区部署与 Multi-AZ | ⭐⭐⭐ | 情景单选 |\n| 2.3.1 | AWS Backup 计划与自动化 | ⭐⭐ | 情景单选 |\n| 2.3.2 | RTO/RPO 与恢复方法选型 | ⭐⭐⭐ | 情景单选 |\n| 2.3.3 | S3 版本控制与删除标记 | ⭐⭐ | 情景单选/排障题 |\n| 2.3.4 | 灾备四等级取舍 | ⭐⭐⭐ | 情景单选/多选 |","services":"| 服务 | 主要用途 | 涉及知识点 |\n|---|---|---|\n| AWS Auto Scaling（Auto Scaling 组、目标追踪、步进、预测伸缩） | 计算层弹性 | 2.1.1 |\n| Amazon EC2 | 伸缩对象与多可用区部署 | 2.1.1、2.2.2 |\n| Amazon CloudFront | 边缘缓存 | 2.1.2 |\n| Amazon ElastiCache（Redis、Memcached） | 应用层缓存 | 2.1.2 |\n| Amazon DynamoDB（DAX、容量模式、全局表、备份恢复） | 数据库伸缩与灾备 | 2.1.2、2.1.3、2.3.1、2.3.2、2.3.4 |\n| Amazon RDS（只读副本、Multi-AZ、存储自动伸缩、跨区副本、时间点恢复） | 数据库伸缩、高可用与恢复 | 2.1.3、2.2.2、2.3.1、2.3.2、2.3.4 |\n| Amazon Aurora（Aurora Serverless v2） | 数据库无服务器化伸缩 | 2.1.3 |\n| Elastic Load Balancing（ALB、NLB、GWLB、目标组） | 流量入口与健康检查 | 2.2.1、2.2.
