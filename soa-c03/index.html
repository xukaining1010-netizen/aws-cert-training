2 |\n| Amazon Route 53（健康检查、故障转移路由、Application Recovery Controller） | DNS 层故障转移 | 2.2.1、2.3.4 |\n| Amazon S3（版本控制、生命周期、跨区复制） | 对象存储版本与灾备 | 2.1.2、2.3.1、2.3.3、2.3.4 |\n| AWS Backup（备份计划、保管库、跨区复制、保管库锁） | 统一备份自动化 | 2.3.1 |\n| Amazon FSx for Windows File Server（卷影副本） | 文件版本历史 | 2.3.3 |\n| Amazon EFS | 备份覆盖范围 | 2.3.1 |\n| Amazon CloudWatch | 伸缩指标与命中率监控 | 2.1.1、2.1.2、2.2.1 |","furtherReading":"- 本域官方页（权威口径）：https://docs.aws.amazon.com/aws-certification/latest/sysops-administrator-associate-03/sysops-administrator-associate-03-domain2.html\n- Exam Guide 主页：https://docs.aws.amazon.com/aws-certification/latest/sysops-administrator-associate-03/sysops-administrator-associate-03.html\n- 考试范围内服务清单：https://docs.aws.amazon.com/aws-certification/latest/sysops-administrator-associate-03/soa-03-in-scope-services.html"}},{"domain":3,"name":"部署、预置与自动化","weight":"22%","practice":[{"id":"D3-005","d":3,"t":"single","q":"Northwind 的应用改成了容器交付，构建出的镜像要有个仓库分发，旧版本与漏洞要有治理。怎么配","o":[{"l":"A","t":"镜像存到 S3 桶，手动管理版本目录"},{"l":"B","t":"镜像留在构建机上，各集群来拉取"},{"l":"C","t":"镜像推到 ECR 后永远保留，保齐全版本"},{"l":"D","t":"镜像推到 ECR，开启漏洞扫描与生命周期策略清理旧版"}],"a":["D"],"e":"✅ 正确项：D。ECR 是托管容器镜像仓库：镜像推上来供 ECS、EKS、容器化的 Lambda 拉取分发；仓库侧带漏洞扫描与生命周期策略清旧版——分发与治理一站式。关联考点：域 3.1.1「创建与管理 AMI 与容器镜像」。\n\n❌ A：S3 手动管版本目录没有镜像层的拉取认证、漏洞扫描与清理机制，全要自建。\n❌ B：镜像留构建机分发既无高可用也无治理，构建机一挂分发就断。\n❌ C：永不清理的仓库版本堆积，存储与检索负担随时间恶化，生命周期策略就是治这个的。\n\n📌 关键概念：容器镜像路径＝构建文件定义内容、推 ECR 分发、漏洞扫描加生命周期策略治理；镜像版本太少是漂移、太多对不上账。","s":"自编·3.1.1"},{"id":"D3-008","d":3,"t":"single","q":"Northwind 的工程师上周绕过流程，在控制台上手工改了某资源的安全组。这周模板更新部署前，应先做什么","o":[{"l":"A","t":"什么都不用做，CloudFormation 会自动吸收手工改动"},{"l":"B","t":"把手工改过的资源删掉，让模板重建一份"},{"l":"C","t":"先跑漂移检测对齐模板与实际资源，再决定收敛方式"},{"l":"D","t":"收回全员控制台权限，禁止再登录"}],"a":["C"],"e":"✅ 正确项：C。控制台手工改过的资源再进模板会漂移，部署前先用漂移检测对齐模板与实际配置，再决定是改模板还是改资源——治理动作放在部署前，不在部署后爆雷。关联考点：域 3.1.2「用 CloudFormation 与 AWS CDK 创建与管理资源」。\n\n❌ A：CloudFormation 不会自动吸收模板外的手工改动，漂移一直存在，下次更新可能被覆盖或报错。\n❌ B：删资源重建动作粗暴，先漂移检测看清差异再选收敛路径更稳。\n❌ D：一刀切收回控制台权限不现实，漂移检测才是这个场景的原生工具。\n\n📌 关键概念：漂移检测管「模板外改动」——部署前对齐模板与实际，治理先行；拆小栈是纪律，模板越大越难排错。","s":"自编·3.1.2"},{"id":"D3-015","d":3,"t":"single","q":"Northwind 的 CI 通道要跑 Terraform apply，凭证怎么给","o":[{"l":"A","t":"长期访问密钥写进仓库的环境变量文件"},{"l":"B","t":"用根用户凭证配在 CI 上，权限最大最省事"},{"l":"C","t":"全团队共享一套管理员密钥"},{"l":"D","t":"CI 通道挂 IAM 角色，用短期凭证执行"}],"a":["D"],"e":"✅ 正确项：D。第三方工具接 AWS 的凭证走角色链：CI 通道挂 IAM 角色拿短期凭证，长期密钥写进仓库等于埋雷——泄漏面随仓库复制扩散。关联考点：域 3.1.6「使用与管理第三方工具自动化资源部署」。\n\n❌ A：环境变量文件随仓库版本化与克隆扩散，密钥随每一次克隆扩散到仓库的所有读者手里，这正是这种做法埋下的雷。\n❌ B：根用户凭证是账户最高权限，挂在 CI 上是最大的越权面。\n❌ C：共享密钥无法区分操作主体，审计与追责全部失效。\n\n📌 关键概念：凭证链正解——人走联合身份、CI 走 IAM 角色短期凭证；长期密钥只留给无法改造的遗留系统。","s":"自编·3.1.6"},{"id":"D3-017","d":3,"t":"single","q":"Northwind 要对标签圈定的一批实例并行下发一条磁盘水位检查命令，输出集中回收、失败逐台可见。用哪个","o":[{"l":"A","t":"逐台 Session Manager 登录执行"},{"l":"B","t":"写一个脚本分发到各台再远程执行"},{"l":"C","t":"Run Command 按标签圈定目标并行下发，输出集中回收，失败逐台可见"},{"l":"D","t":"写个 Lambda 函数逐台调用"}],"a":["C"],"e":"✅ 正确项：C。Run Command（命令执行）一条命令打到一批实例：标签圈目标、并行下发、输出集中回收、失败逐台可见——批量命令的四个诉求一次满足，不用逐台登录。关联考点：域 3.2.1「用 AWS 服务自动化运维流程」。\n\n❌ A：逐台登录是批量下发的反面，千台规模不可行。\n❌ B：自建脚本分发要管传输、权限、回收与汇总，Run Command 原生全有。\n❌ D：Lambda 逐台调用绕了一圈计算服务，且输出汇总与失败清单都要自建。\n\n📌 关键概念：Run Command 四件套——标签圈目标、并行下发、集中回收、逐台可见；维护窗口与它配合定时段。","s":"自编·3.2.1"},{"id":"D3-019","d":3,"t":"single","q":"Northwind 要做「配置一变就联动」的自动化。哪些来源的事件能当触发器","o":[{"l":"A","t":"S3 事件通知、EventBridge 总线上的服务事件、AWS Config 的配置项变化、CloudTrail 记录的操作事件"},{"l":"B","t":"只有 SQS 队列轮询一种触发方式"},{"l":"C","t":"只有 S3 事件通知一种"},{"l":"D","t":"只有 CloudWatch 告警一种"}],"a":["A"],"e":"✅ 正确项：A。事件驱动的触发源按源头分三条路：S3 事件通知（对象创建删除）、EventBridge 总线（AWS 服务事件加定时计划）、配置变化类（Config 配置项与 CloudTrail 操作事件）——都能成为触发源，路由到 Lambda 或 Step Functions 执行。关联考点：域 3.2.2「用 AWS 服务与功能实施事件驱动自动化」。\n\n❌ B：SQS 是消息队列不是触发源的限定项，队列常作为 EventBridge 目标做兜底。\n❌ C：单说 S3 通知把另外两条触发路都丢了。\n❌ D：告警状态变化是 EventBridge 上的一类事件，说「只有」把触发源收窄了。\n\n📌 关键概念：事件三触发——S3 通知管文件、EventBridge 管服务事件与定时、Config 与 CloudTrail 管配置变化；处理器幂等加死信队列兜底。","s":"自编·3.2.2"},{"id":"D3-020","d":3,"t":"single","q":"Northwind 的数据库栈要用 CloudFormation 管理，团队担心哪天误执行了删除栈。怎么防","o":[{"l":"A","t":"删栈只是删掉部署记录，资源不受影响"},{"l":"B","t":"把模板备份好，删了再恢复"},{"l":"C","t":"给数据库栈开启终止保护（termination protection）"},{"l":"D","t":"删栈后资源会自动转存到默认 VPC"}],"a":["C"],"e":"✅ 正确项：C。删栈会连栈内资源一起删除——数据库栈先开终止保护（termination protection）再谈部署，误删动作被拦在保护位上。这是「血泪教训都从这里来」的那条纪律。关联考点：域 3.1.2「用 CloudFormation 与 AWS CDK 创建与管理资源」。\n\n❌ A：「只是删记录」与删栈行为完全相反，栈删除会删资源。\n❌ B：模板备份救不了已删的数据资源，数据没了模板重建也是空栈。\n❌ D：资源不会自动转存，删了就是删了。\n\n📌 关键概念：删栈＝删资源；数据库栈先开终止保护；栈烂在回滚失败态走续回滚或删栈重建。","s":"自编·3.1.2"},{"id":"D3-021","d":3,"t":"single","q":"Northwind 准备用 StackSets 把一套新底座模板铺到全网账户。铺开前怎么控风险","o":[{"l":"A","t":"先在沙箱账户铺一片验证模板，通过后再推全网"},{"l":"B","t":"直接全网铺出问题再逐账户回滚"},{"l":"C","t":"铺之前给各账户负责人发邮件通知"},{"l":"D","t":"只铺一半账户，观察一年再铺另一半"}],"a":["A"],"e":"✅ 正确项：A。StackSets 铺得快也改得快，模板有错就是批量事故——先在沙箱账户铺一片验证，通过后再推全网；铺完抽查两个账户的栈实例状态再收工。这是 StackSets 的风险纪律。关联考点：域 3.1.4「跨多区域与多账户预置与共享资源」。\n\n❌ B：先全网再回滚是把事故面放到最大，批量错误的回滚也是批量的。\n❌ C：发通知不改变模板质量，风险在模板不在知情。\n❌ D：观察一年属过度保守，沙箱验证加抽查已是标准控险路径。\n\n📌 关键概念：StackSets 铺量纪律——沙箱先行、清单核对、铺后抽查；模板有错就是批量事故。","s":"自编·3.1.4"},{"id":"D3-022","d":3,"t":"multiple","q":"Northwind 收编的 Terraform 团队要正式接入 AWS 与 Git 流程。哪些做法是对的（选所有适用项）","o":[{"l":"A","t":"凭证走 IAM 角色，长期密钥不进仓库"},{"l":"B","t":"state 落 S3 加 DynamoDB 锁表，团队协作防并发"},{"l":"C","t":"本地与主管道都可以随意 apply，灵活优先"},{"l":"D","t":"Git 分支评审合入后才触发部署，apply 只在主管道执行"},{"l":"E","t":"再用 CloudFormation 管同一组资源，双保险更稳"}],"a":["A","B","D"],"e":"✅ 正确项：A、B、D。集成三要素：凭证走角色拿短期凭证、state 落 S3 远端加锁表防并发、流程上 Git 分支评审合入后才触发部署且 apply 只在主管道执行、本地只许 plan。三条都是接进 AWS 的标准纪律。关联考点：域 3.1.6「使用与管理第三方工具自动化资源部署」。\n\n❌ C：「随意 apply」破坏单一变更通道，本地 apply 撞上主管道正是锁表要防的事故源。\n❌ E：两套基础设施即代码工具管同一组资源会互相打架，边界要划清，「双保险」是误读。\n\n📌 关键概念：第三方工具接入三要素——凭证角色化、state 远端加锁、apply 单一通道；plan 人人可跑，apply 只走主管道。","s":"自编·3.1.6"}],"sections":[{"h":"预置与维护云资源","body":"### 这一域考什么\n\n这一域问的是：资源怎么按代码长出来、按流程变下去。拆成两问：\n\n1. **长得出**：一台实例、一整套环境，怎么用可重复的方式建出来，对应任务 3.1。\n2. **管得住**：已经在跑的资源，日常变更怎么自动化，对应任务 3.2。\n\n这一域是运维的第二只手：监控域管看与修，可靠性域管扛得住，这一域管建得快、改得省。手工点击变成模板与流水线，人肉响应变成事件驱动。六个技能点从做镜像、写模板，一路铺到多账户多区域与第三方工具，最后两个点把「已在跑的资源」交给自动化接管。\n\n### 读完这个域要能做什么\n\n- 用 AMI 与容器镜像把「机器里装什么」固化成可分发版本，说清 EC2 Image Builder 的流水线。\n- 用 CloudFormation 与 CDK 把环境写成代码，模板出问题能定位到根因层。\n- 排掉子网地址耗尽、CloudFormation 失败、权限不足这几类部署故障。\n- 用 StackSets 与资源共享铺开多账户多区域，配出事件驱动的日常自动化。\n\n### 和其他认证怎么接\n\n| 其他认证/能力 | 对应的那件事 | 这里有什么不同 | 什么时候该想起它 |\n|---|---|---|---|\n| SAP-C03（架构师专业级） | 都讲基础设施即代码与多账户 | 架构级考组织模型怎么设计；本课考模板写得对、排障排得清 | 要定组织级规范而不是执行时 |\n| DOP-C02（DevOps 专业级） | 都讲自动化 | 专业级加码 CI/CD 流水线与大规模治理；本课收敛在资源预置与事件自动化 | 要做完整发布流水线时 |\n\n对照只用来迁移已有理解。做题以本域官方口径为准。\n\n### 官方口径的三条边界\n\n- 官方 Exam Guide 给出技能点编号与原文，不给逐考点的出现频率。\n- 官方认证页写明题型含单选与多选，多选全选对才得分。\n- 及格线 720 分（100–1000 补偿式计分），不要求每域单独达线。\n\n#### 这一节学什么\n这一节对应考纲任务 3.1「预置与维护云资源」。\n\n> 官方原名：Provision and maintain cloud resources.\n\n六个技能点从做镜像讲到写模板，再到跨账户跨区域铺资源与部署策略。主线是：镜像管内容 → 模板管拓扑 → 铺量与共享管规模 → 策略与工具管发布。\n\n#### 创建与管理 AMI 与容器镜像\n\n> 官方原名：Create and manage AMIs and container images (for example, EC2 Image Builder).\n\n**这条在问什么。** 考题给你「五十台机器要装同一套中间件、手工装一轮一周」这类痛点，考你镜像化思路与 EC2 Image Builder 的用法。\n\n**定义**：AMI（Amazon Machine Image，亚马逊机器镜像）是 EC2 实例的出厂设置：操作系统、应用与配置打包成一份可启动的模板。容器镜像是容器运行时的打包格式，应用与依赖封成只读层，推到 ECR（Amazon Elastic Container Registry，托管容器镜像仓库）分发。手工配的机器用久了配置各不相同，这叫漂移（drift）；受控的标准模板镜像俗称黄金镜像（golden image）。\n\n**怎么运作**。两条镜像化路径：\n\n1. AMI 路径：手工配好一台实例做成黄金镜像再复制，是传统做法，快但漂移会慢慢吃掉一致性。EC2 Image Builder 把它流水线化：源镜像选好，组件写成安装脚本，构建后自动测试，再分发到多区域，定时重建让漂移每周收敛一次。\n2. 容器镜像路径：构建文件定义内容，镜像推 ECR，ECS、EKS、容器化的 Lambda 都能跑。ECR 侧带漏洞扫描与生命周期策略清旧版。\n\n镜像流水线的上线自查清单：\n\n1. 组件把补丁与应用安装写全，黄金镜像里的手工步骤清零。\n2. 构建后接测试步骤，起不来的镜像不分发。\n3. 分发配置覆盖所有在用区域。\n4. 定时重建排进业务低谷，漂移定期自动收敛。\n\n**什么时候用，什么时候别用**。长期批量复制同构机器的，镜像化收益最大。一次性机器用启动时脚本装就行，做镜像反而慢。整机环境依赖选 AMI，应用能容器化就走容器——容器更轻、构建更快。代价句：镜像版本太少是漂移，版本太多对不上账；镜像重建要挑低谷时段，占资源也占时间。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的队列机族原先每台手工装中间件，版本越装越乱。改用 EC2 Image Builder 每周日凌晨自动重建带补丁的黄金镜像，新机器全部从最新镜像起，配置漂移一周收敛一次，中招漏洞的旧镜像自然退场。\n\n**关联服务**：Amazon EC2（AMI、EC2 Image Builder）、Amazon ECR（漏洞扫描、生命周期策略）、Amazon ECS、Amazon EKS、AWS Lambda。\n\n#### 用 CloudFormation 与 AWS CDK 创建与管理资源\n\n> 官方原名：Create and manage AWS resources by using CloudFormation and the AWS CDK.\n\n**这条在问什么。** 考题给你「环境建了十次、每次都不一样」这类痛点，考你基础设施即代码两大工具的机制与分工。\n\n**定义**：基础设施即代码（IaC）把资源定义写成代码，引擎照代码建资源，改环境等于改代码。CloudFormation 是声明式模板引擎：写模板，它负责创建与编排。CDK（AWS Cloud Development Kit）用 TypeScript、Python 这类编程语言写构造，编译成 CloudFormation 模板再部署。\n\n**怎么运作**。CloudFormation 的生命周期三步：\n\n1. 模板定义资源与依赖，栈（stack）是部署单位，一个栈管一组资源。\n2. 变更集（change set）先预览本次会动哪些资源，确认后执行。\n3. 删除栈会删资源，依赖顺序自动编排；执行失败自动回滚。\n\nCDK 的增量是「用编程语言写、编译回模板」：合成（synth）把代码编译成模板，部署走的还是 CloudFormation 栈。构造分三层——L1 直接映射资源属性，L2 是带默认最佳实践的惯用组件，L3 是整场景的模式级组件。\n\n一个最小模板片段：\n\n```yaml\nResources:\n  NWQueueSG:\n    Type: AWS::EC2::SecurityGroup\n    Properties:\n      GroupDescription: queue machine baseline\n      VpcId: !Ref NWVpc\n```\n\n**什么时候用，什么时候别用**。团队偏声明式、要「模板即文档」的，直接写 CloudFormation。团队有编程底子、要抽象复用的，CDK 效率高。代价句：控制台手工改过的资源再进模板会漂移，部署前先用漂移检测对齐。模板越大越难排错，拆小栈是纪律。CDK 要理解合成产物才能排障。\n\n💡 **场景举例**（虚构教学示意）：Northwind 把三个环境的网络底座写成一份 CloudFormation 模板，环境差异走参数。扩到新区域只改参数文件部署一次，三套网络配置一致；季度审计直接读模板，控制台反查成了备选。\n\n**关联服务**：AWS CloudFormation（栈、变更集、漂移检测）、AWS CDK（L1/L2/L3 构造、合成）。\n\n#### 识别与修复部署问题\n\n> 官方原名：Identify and remediate deployment issues (for example, subnet sizing issues, CloudFormation errors, permissions issues).\n\n**这条在问什么。** 考题给你「栈部署到一半卡住」「实例起不来」这类排障场景，考你按症状定位到根因层。\n\n**定义**：部署问题的第一现场是栈事件流（stack events）：CloudFormation 把每步成败按时间线列出来，最后一条失败事件直接指向出错的资源与错误码。\n\n**怎么运作**。常见根因分三类，对号入座：\n\n- 容量类：子网可用地址耗尽、弹性 IP 或实例配额到顶。\n- 编排类：模板语法错、依赖声明漏、参数引用了不存在的值。\n- 权限类：执行主体缺某项创建或修改权限，栈就卡在那个资源上。\n\n**排障判据**。按序排查：\n\n1. 先看栈事件流最后一条：定位失败资源与错误码。\n2. 权限不足类，补执行角色权限再重跑。\n3. 子网地址耗尽类，扩网段、清占用或换子网。\n4. 等待信号超时类，查实例侧启动脚本有没有发回完成信号。\n5. 修完再跑，别盲目重试——模板没改，重试结果一样。\n\n**什么时候用，什么时候别用**。模板小错修完直接更新重跑；栈烂在回滚失败状态，走续回滚或删栈重建。代价句：删栈重建会连数据资源一起删——数据库栈先开终止保护（termination protection）再谈部署，血泪教训都从这里来。\n\n💡 **场景举例**（虚构教学示意）：Northwind 部署新环境时栈卡在第十个资源，栈事件显示子网可用地址为零——网段当年划小了。扩网段重跑，十分钟过。事后把「网段容量预检查」加进部署清单，同类问题没再发生过。\n\n**关联服务**：AWS CloudFormation（栈事件、续回滚、终止保护）、Amazon VPC（子网、CIDR 规划）、IAM。\n\n#### 跨多区域与多账户预置与共享资源\n\n> 官方原名：Provision and share resources across multiple Regions and accounts (for example, AWS Resource Access Manager [AWS RAM], CloudFormation StackSets).\n\n**这条在问什么。** 考题给你「同一套底座要铺到五个账户三个区域」「一个资源要共享给兄弟账户」这类需求，考你铺量与共享的工具选型。\n\n**定义**：多账户组织里两类需求两个工具。铺资源用 CloudFormation StackSets：一份模板铺到多个账户与区域，一次操作建一片栈，目标账户里跑的那份栈副本叫栈实例（stack instance）。共享资源用 AWS RAM（Resource Access Manager，资源访问管理器）：把一个已有资源共享给其他账户，资源还是一份，不用复制。\n\n**怎么运作**。两个工具各管一段：\n\n1. StackSets：管理员账户持有模板，选目标账户与区域清单铺出一片栈实例。更新分两种模式——自助模式各账户自己重部署，服务托管模式由管理员统一推进。\n2. AWS RAM：建资源共享，勾资源与共享对象，被共享账户接受后直接在控制台使用。共享的是使用权不是所有权，子网、Route 53 托管区、中转网关都能共享。\n\n铺量前的判定清单：\n\n1. 目标账户与区域清单核对无误，铺错账户是灾难级返工。\n2. 管理员对目标账户的部署权限已就位。\n3. 模板里没有账户专属的硬编码 ID。\n4. 铺完抽查两个账户的栈实例状态再收工。\n\n**什么时候用，什么时候别用**。同构环境批量铺，StackSets 是正解。一次性小环境直接单栈部署更省事。网络类资源要跨账户共用，RAM 共享比逐账户复制省钱省事。代价句：StackSets 铺得快也改得快，模板有错就是批量事故，先在沙箱账户铺一片验证再推全网。RAM 共享让权限模型跨账户，审计清单要跟着共享关系走。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的网络中心账户用 RAM 把三个共享子网共享给开发与测试账户，两边直接挂资源不再各建一套。运维底座用 StackSets 一夜铺到五个账户，早上抽检栈实例全绿。\n\n**关联服务**：AWS CloudFormation StackSets、AWS RAM（资源共享）、AWS Organizations、Amazon VPC（子网共享）、Amazon Route 53（托管区共享）、AWS Transit Gateway。\n\n#### 实施部署策略与服务\n\n> 官方原名：Implement deployment strategies and services.\n\n**这条在问什么。** 考题给你「新版本要上线，不能停机、要能秒回退」这类需求，考你部署策略的选型与承载方式。\n\n**定义**：部署策略是「新版本怎么替换旧版本」的节奏方案，四条主流路线：\n\n- 全量直推：一波换完，最简单，停机窗口最长。\n- 滚动更新：分批替换实例，逐步换血。\n- 蓝绿部署：新环境整套建好，流量一刀切过去，回退就是切回来。\n- 金丝雀发布：先放小部分流量给新版本，看指标再全量。\n\n**怎么运作**。策略与承载方式对号：\n\n1. 金丝雀：Lambda 别名流量按百分比切，不用写脚本。\n2. 滚动：ECS 按最小健康百分比与最大百分比控制替换节奏。\n3. 蓝绿：两份目标组挂同一监听器，权重一切换完成。\n4. 蓝绿的基建侧：CloudFormation 或 CDK 两套栈并行，路由一改即切换。\n\n**什么时候用，什么时候别用**。要秒级回退选蓝绿——旧环境还在，切回就是改路由。要看真实流量再放量选金丝雀。机器少、能接受分钟级窗口，滚动就够。代价句：蓝绿的绿环境平时闲置，成本接近双份。金丝雀拉长发布周期，两版指标都要盯，监控工作量翻倍。\n\n💡 **场景举例**（虚构教学示意）：Northwind 订单服务改版走蓝绿：绿组整套建在新目标组，健康检查全绿后把 ALB 权重从零切到一百。上线两小时后发现新版本计价缺陷，切回蓝组只用三十秒，用户全程无感。\n\n**关联服务**：AWS Lambda（别名加权）、Amazon ECS（滚动更新参数）、Elastic Load Balancing（加权目标组）、AWS CloudFormation（蓝绿栈）、AWS CDK。\n\n#### 使用与管理第三方工具自动化资源部署\n\n> 官方原名：Use and manage third-party tools to automate resource deployment (for example, Terraform, Git).\n\n**这条在问什么。** 考题给你「团队已经在用 Terraform 与 Git」这类现实场景，考你怎么把这些工具稳妥接进 AWS、出问题排哪里。\n\n**定义**：Terraform 是第三方基础设施即代码工具，用 HCL 声明资源，state 文件记录已建资源，plan 先算差异、apply 才落地。Git 管模板与代码的版本历史。第三方工具接进 AWS，核心是凭证与状态两件事。\n\n**怎么运作**。接进 AWS 的三要素：\n\n1. 凭证：走 AWS 凭证链，CI 通道用 IAM 角色短期凭证。长期密钥写进仓库等于埋雷。\n2. 状态：state 文件记录资源映射，放 S3 配 DynamoDB 锁表，团队协作不互相踩——锁挡住并发的同时只允许一个变更在跑。\n3. 流程：Git 分支评审合入后才触发部署，apply 只在主管道执行，本地只许 plan。\n\n**什么时候用，什么时候别用**。已深耕 Terraform 的团队继续用，比强迁原生工具划算。新起项目选 CloudFormation 或 CDK，与 AWS 的集成更深。代价句：state 是「真相之源」——state 丢等于失忆，state 泄露等于整套基础设施图谱外泄，存储加密与访问权限都按最高档配。两套基础设施即代码工具管同一组资源会互相打架，边界要划清。\n\n💡 **场景举例**（虚构教学示意）：Northwind 收编了一支用 Terraform 的团队。state 落 S3 加锁表，凭证走角色，Git 分支过评审才触发 apply。一次实习生本地误 apply，被锁表挡住——另一个变更正在跑，等锁释放时评审已发现问题叫停了变更。\n\n**关联服务**：Amazon S3（state 存储）、Amazon DynamoDB（state 锁表）、IAM（角色与凭证链）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「镜像化后就不用管配置」 | 镜像管出厂状态，运行期漂移仍要治理 |\n| 2 | 「CDK 不是 CloudFormation」 | CDK 合成的仍是模板，栈层排障逻辑通用 |\n| 3 | 「栈失败重试就会过」 | 不修根因重试，同样的错再来一遍 |\n| 4 | 「删栈只是删记录」 | 删栈会删资源，数据库栈先开终止保护 |\n| 5 | 「StackSets 铺完就完事」 | 模板有错是批量事故，先沙箱后全网 |\n| 6 | 「Terraform state 放本地最顺手」 | state 要进 S3 加锁；本地丢与泄露两风险 |\n\n#### 记忆要点\n\n1. **镜像管内容**：AMI 管整机、容器镜像管应用，Image Builder 让黄金镜像不漂移。\n2. **IaC 两引擎**：CloudFormation 声明式模板，CDK 编译成模板，栈与变更集通用。\n3. **部署排障三根因**：容量、编排、权限，先看栈事件最后一条。\n4. **铺量与共享分两手**：StackSets 铺一片，RAM 共享一份。\n5. **部署策略四档**：全量、滚动、蓝绿、金丝雀，回退速度与成本反向。\n6. **第三方管两件事**：凭证走角色、state 加锁，Git 评审后才 apply。\n\n---"},{"h":"自动化已有资源的管理","body":"#### 这一节学什么\n这一节对应考纲任务 3.2「自动化已有资源的管理」。\n\n> 官方原名：Automate the management of existing resources.\n\n任务 3.1 解决「资源怎么建」，这一任务解决「建完之后怎么管」。两个技能点一个管「按日程跑的例行事」，一个管「事件来了的响应事」：Systems Manager 把运维流程排进日程，事件驱动让资源变化自动触发动作。主线是：计划内走日程 → 计划外走事件。\n\n#### 用 AWS 服务自动化运维流程\n\n> 官方原名：Use AWS services to automate operational processes (for example, Systems Manager).\n\n**这条在问什么。** 考题给你「每周打补丁、每天巡检清单全靠人手」这类痛点，考你把例行运维排进自动化日程。\n\n**定义**：Systems Manager 是运维执行中枢，三个核心构件分工明确：\n\n- Run Command（命令执行）：一条命令打到一批实例，不用逐台登录。\n- State Manager（状态管理）：期望状态定义好后持续对齐，偏离自动拉回。\n- Patch Manager（补丁管理）：补丁基线加批处理窗口，按圈定目标批量打。\n\n维护窗口（maintenance window）给这些动作定执行时段，目标实例用标签圈定。\n\n**怎么运作**。三类例行流程的自动化路径：\n\n1. 补丁流程：补丁基线定「批准哪些补丁」，维护窗口定「何时批处理」，标签圈「打到哪批实例」。\n2. 状态对齐：关联（association）声明目标状态，调度器定期对齐，偏离自动纠正。\n3. 批量命令：Run Command 对标签圈定的一批实例并行下发，输出集中回收，失败逐台可见。\n\n一条批量下发的命令长这样：\n\n```bash\naws ssm send-command \\\n  --document-name AWS-RunShellScript \\\n  --targets \"Key=tag:team,Values=nw-prod\" \\\n  --parameters '{\"commands\":[\"df -h /data | tail -1\"]}' \\\n  --comment \"disk check on prod fleet\"\n```\n\n**什么时候用，什么时候别用**。周期性、可脚本化的巡检与修补，用 Systems Manager 排程。一次性紧急变更走 Run Command 直接打，不必先建流程。要人判断的复杂变更别全自动化——排程任务没有审批护栏会放大事故。代价句：自动化巡检把人从键盘上解放，但把「漏做一次」变成「批量做错一次」，先小范围试点再全量排程，执行记录留档可回看。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的千台实例补丁原先要两个人做一周。改用 Patch Manager 配基线与维护窗口，按 team 标签分组错峰批处理，覆盖率报表每周自动生成，人力降到半天，只抽查异常实例。\n\n**关联服务**：AWS Systems Manager（Run Command、State Manager、Patch Manager、维护窗口、Session Manager）、IAM（执行角色）、Amazon CloudWatch。\n\n#### 用 AWS 服务与功能实施事件驱动自动化\n\n> 官方原名：Implement event-driven automation by using AWS services and features (for example, Lambda, S3 Event Notifications, EventBridge, AWS DevOps Agent).\n\n**这条在问什么。** 考题给你「新文件一到就要处理、资源一变就要联动」这类需求，考你事件驱动链路怎么配、怎么兜底。\n\n**定义**：事件驱动自动化 = 触发器加处理器。资源或数据变化产生事件，规则把事件路由给处理器执行动作。它和 3.2.1 的分工是：日程驱动按时间表主动跑，事件驱动有变化才被动触发。\n\n**怎么运作**。触发器按源头分三条路：\n\n1. S3 事件通知（S3 Event Notifications）：对象创建或删除时，桶直接通知目标。\n2. EventBridge：托管事件总线，AWS 服务事件进总线，规则按事件模式匹配路由，定时计划也走它。\n3. 配置变化类：AWS Config 的配置项变化、CloudTrail 记录的操作事件，都能成为触发源。\n\n处理器侧：Lambda 是无服务器计算，按事件执行代码；多步流程用 Step Functions 编排，每步失败与重试独立控制。官方点名的 AWS DevOps Agent 定位是运维分析助手，参与根因分析与修复建议，执行动作的仍是计算与编排服务。\n\n事件驱动链路的落地清单：\n\n1. 触发源的事件名与字段先核对，模式匹配错了链路就全静默。\n2. 处理器做成幂等——通知至少送达一次，重跑不能重复生效。\n3. 失败兜底配死信队列，处理不了的事件留现场待重放。\n4. 上线前放一个样例事件，端到端验证全链路。\n\n**什么时候用，什么时候别用**。数据到位即处理、状态变化即联动的场景，事件驱动是首选。强顺序要求的批处理别硬凑事件链——乱序到达会破坏依赖，走队列或编排更稳。代价句：事件链路最难排的是「静默丢失」——事件已发、处理没到，全靠日志与死信队列兜回来；链路越长，越要把每一跳的日志配全。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的承运商每天上传运单 CSV 到 S3。桶配对象创建通知，Lambda 解析入库，异常行落死信队列待人工。上传后三十秒数据就出现在报表里，原先按小时批处理的轮岗岗位取消了。\n\n**关联服务**：Amazon S3（事件通知）、Amazon EventBridge、AWS Lambda、AWS Step Functions、Amazon SQS（死信队列兜底）、AWS Config（配置变化触发）、AWS CloudTrail、AWS DevOps Agent（分析辅助）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「自动化运维等于无人值守」 | 护栏、审批与执行记录一个都不能少 |\n| 2 | 「补丁排程了就算打了」 | 要看覆盖率报表与失败清单，逐台清尾巴 |\n| 3 | 「S3 通知送达且只送一次」 | 至少一次语义，处理器要幂等 |\n| 4 | 「事件链路配了就稳了」 | 静默丢失要靠死信队列与日志兜底 |\n| 5 | 「日程驱动与事件驱动二选一」 | 例行走日程、变化走事件，各干各的 |\n| 6 | 「DevOps Agent 能直接改资源」 | 它是分析建议助手，执行还是计算与编排服务 |\n\n#### 记忆要点\n\n1. **两驱动分工**：例行走日程、变化走事件，互不替代。\n2. **State Manager 管对齐**：期望状态持续收敛，偏离自动拉回。\n3. **事件三触发**：S3 通知、EventBridge 总线、配置变化各上各的链。\n4. **幂等是前提**：至少一次送达，重跑不能重复生效。\n5. **死信队列兜底**：处理不了的事件留现场待重放。\n6. **护栏先于排程**：自动化把单点错变成批量错，先试点再全量。\n\n---"}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 3.1.1 | AMI 与容器镜像、Image Builder 流水线 | ⭐⭐ | 情景单选 |\n| 3.1.2 | CloudFormation 与 CDK 机制分工 | ⭐⭐⭐ | 情景单选/排障题 |\n| 3.1.3 | 部署故障三类根因与栈事件排障 | ⭐⭐⭐ | 排障情景题 |\n| 3.1.4 | StackSets 铺量与 RAM 共享 | ⭐⭐ | 情景单选/多选 |\n| 3.1.5 | 部署策略四档选型 | ⭐⭐⭐ | 情景单选 |\n| 3.1.6 | Terraform 与 Git 集成、state 管理 | ⭐⭐ | 情景单选 |\n| 3.2.1 | Systems Manager 三大能力与排程 | ⭐⭐⭐ | 情景单选 |\n| 3.2.2 | 事件驱动链路与幂等兜底 | ⭐⭐⭐ | 情景单选/排障题 |","services":"| 服务 | 主要用途 | 涉及知识点 |\n|---|---|---|\n| Amazon EC2（AMI、EC2 Image Builder） | 机器镜像流水线 | 3.1.1 |\n| Amazon ECR、Amazon ECS、Amazon EKS | 容器镜像分发与运行 | 3.1.1 |\n| AWS CloudFormation（栈、变更集、漂移检测、StackSets） | 基础设施即代码与铺量 | 3.1.2、3.1.3、3.1.4、3.1.5 |\n| AWS CDK（L1/L2/L3 构造、合成） | 编程式基础设施即代码 | 3.1.2、3.1.5 |\n| AWS RAM（资源共享） | 跨账户共享资源 | 3.1.4 |\n| AWS Organizations | 多账户部署委托 | 3.1.4 |\n| Amazon VPC（子网、CIDR、子网共享） | 部署排障与网络共享 | 3.1.3、3.1.4 |\n| Amazon Route 53（托管区共享） | 共享资源 | 3.1.4 |\n| AWS Transit Gateway | 共享网络枢纽 | 3.1.4 |\n| AWS Lambda（别名加权） | 部署策略与事件处理器 | 3.1.5、3.2.2 |\n| Elastic Load Balancing（加权目标组） | 蓝绿切换 | 3.1.5 |\n| IAM（角色、凭证链、执行角色） | 权限与凭证 | 3.1.3、3.1.6、3.2.1 |\n| Amazon S3（state 存储、事件通知） | Terraform 状态与事件触发 | 3.1.6、3.2.2 |\n| Amazon DynamoDB（state 锁表） | Terraform 状态锁 | 3.1.6 |\n| AWS Systems Manager（Run Command、State Manager、Patch Manager、维护窗口、Session Manager） | 运维流程自动化 | 3.2.1 |\n| Amazon EventBridge | 事件路由 | 3.2.2 |\n| AWS Step Functions | 多步流程编排 | 3.2.2 |\n| Amazon SQS（死信队列） | 事件兜底 | 3.2.2 |\n| AWS Config（配置变化） | 触发源 | 3.2.2 |\n| AWS CloudTrail | 操作事件触发源 | 3.2.2 |\n| AWS DevOps Agent | 分析辅助 | 3.2.2 |\n| Amazon CloudWatch | 执行结果监控 | 3.2.1 |","furtherReading":"- 本域官方页（权威口径）：https://docs.aws.amazon.com/aws-certification/latest/sysops-administrator-associate-03/sysops-administrator-associate-03-domain3.html\n- Exam Guide 主页：https://docs.aws.amazon.com/aws-certification/latest/sysops-administrator-associate-03/sysops-administrator-associate-03.html\n- 考试范围内服务清单：https://docs.aws.amazon.com/aws-certification/latest/sysops-administrator-associate-03/soa-03-in-scope-services.html"}},{"domain":4,"name":"安全与合规","weight":"16%","practice":[{"id":"D4-006","d":4,"t":"single","q":"Northwind 账户数到了两位数，人员要在各账户间切换工作，密码管理混乱。怎么收敛登录入口","o":[{"l":"A","t":"每个账户各设一套密码策略，各自维护"},{"l":"B","t":"共享根用户给运维组使用"},{"l":"C","t":"用 SCP 当统一登录入口"},{"l":"D","t":"IAM Identity Center：人员一处登录，用户组映射到各账户的角色，按组换权限"}],"a":["D"],"e":"✅ 正确项：D。Identity Center 是人员统一登录入口：登录后换取各账户的角色，用户组映射到角色、权限随组走，人员动账单不动——再没人需要「第十套密码」。账户起步还可加 Control Tower 预置新账户与基线护栏。关联考点：域 4.1.3「安全地实施多账户策略」。\n\n❌ A：各账户各自维护密码正是混乱之源，收敛入口是题意反义词。\n❌ B：共享根用户违反最小权限与可追溯原则。\n❌ C：SCP 是策略上限不是身份入口，登录入口与它无关。\n\n📌 关键概念：多账户三件——Organizations 管层级、SCP 管封顶、Identity Center 管入口；账户按环境隔离，爆炸半径天然受限。","s":"自编·4.1.3"},{"id":"D4-009","d":4,"t":"single","q":"Northwind 的合规要求数据只落地在三个区域之内。哪条边界机制对路","o":[{"l":"A","t":"把 IAM 账户密码策略调到最长有效期"},{"l":"B","t":"把不需要的区域控制台入口从导航栏隐藏"},{"l":"C","t":"用 SCP 拒绝允许清单之外的区域操作，把数据落地范围封住"},{"l":"D","t":"把工作负载分散到更多区域降低集中风险"}],"a":["C"],"e":"✅ 正确项：C。区域边界是合规「边界」类约束：SCP 拒绝允许清单之外的区域操作，数据落地范围从权限层封死——能机器判定的区域约束交给 SCP 是标准路径。服务边界同理，出范围服务用 SCP 或 IAM 策略拒绝。关联考点：域 4.1.5「实施合规要求与持续监控」。\n\n❌ A：密码策略与数据落地区域无关，工具错段。\n❌ B：隐藏控制台入口不拦截 API 调用，边界不封口子就还开着。\n❌ D：分散到更多区域与「只落地三个区域」的要求正好相反。\n\n📌 关键概念：合规两类约束——区域与服务边界用 SCP 封、资源配置用 Config 规则盯；边界管范围、规则管状态。","s":"自编·4.1.5"},{"id":"D4-012","d":4,"t":"multiple","q":"Northwind 排查 HTTPS 链路故障。下列哪些说法是对的（选所有适用项）","o":[{"l":"A","t":"ACM 自动续期覆盖所有挂在它上面的证书，包括导入的外部证书"},{"l":"B","t":"TLS 终止在负载均衡器时，负载均衡器到实例那段也是密文"},{"l":"C","t":"证书覆盖的域名要与访问使用的域名一致，不一致握手会出问题"},{"l":"D","t":"合规要求端到端加密时，给监听器配后端加密，负载均衡器到实例那段也走 TLS"},{"l":"E","t":"域名验证记录失效不影响证书签发与续期"}],"a":["C","D"],"e":"✅ 正确项：C、D。证书域名匹配是 TLS 排障的基本判据：覆盖域名与访问域名不一致，握手与信任链会出问题；TLS 终止在负载均衡器时「最后一公里」是明文，合规要端到端就配后端加密监听器。关联考点：域 4.2.3「实施、配置与排障传输加密」。\n\n❌ A：自动续期只管 ACM 签发的证书，导入的外部证书要手动续，说全覆盖把边界抹掉了。\n❌ B：终止在负载均衡器时，到实例那段是明文，这是后端加密存在的理由。\n❌ E：域名验证记录失效，签发与续期都会卡住，这是证书故障排查的第二判据。\n\n📌 关键概念：TLS 排障四判据——先看过期没有、再核域名匹配、查验证记录、确认 TLS 终止在哪层；端到端要后端加密。","s":"自编·4.2.3"},{"id":"D4-015","d":4,"t":"single","q":"Northwind 的安全发现队列越积越多，没人认领处置。哪条认识是对的","o":[{"l":"A","t":"发现数量多说明检测做得好，攒着就是安全资产"},{"l":"B","t":"只处理高严重度，中低的先放着"},{"l":"C","t":"疑似误报的留着不标记，避免误判责任"},{"l":"D","t":"发现要挂处置流程与责任人：分派自动修复、工单跟进、误报标记，处置记录回写闭环"}],"a":["D"],"e":"✅ 正确项：D。发现链路的后半段是处置：发现分派（自动修复走 Config 修复动作、复杂的人工走工单）、疑似误报打标（清噪音是纪律）、处置记录回写闭环——开了不处置等于装了报警器没人接警。关联考点：域 4.2.5「配置报告与处置 AWS 服务的安全发现」。\n\n❌ A：发现堆积不处置恰是风险敞口，「攒着」不是资产是欠账。\n❌ B：中低严重度里混着趋势信号，只盯高危会漏掉缓慢演进的威胁。\n❌ C：误报不标记会淹没真警报，定期清噪音是安全运营纪律。\n\n📌 关键概念：发现链路四步——各源开检测、汇聚 Security Hub、分派处置、报告留痕；误报定期清，处置要闭环。","s":"自编·4.2.5"},{"id":"D4-016","d":4,"t":"multiple","q":"Northwind 安全治理长期凭证与根用户。哪些做法是对的（选所有适用项）","o":[{"l":"A","t":"人员访问走联合身份换角色，程序访问用实例角色"},{"l":"B","t":"根用户日常登录操作最方便，保持常态使用"},{"l":"C","t":"IAM 用户配好长期密钥就算安全达标"},{"l":"D","t":"根用户开启 MFA，日常封存不用"},{"l":"E","t":"权限一次给全，再逐步收窄省得反复申请"}],"a":["A","D"],"e":"✅ 正确项：A、D。治理两条正解：人员走联合登录换角色、程序用实例角色，长期凭证清零；根用户开启 MFA、日常封存——「账号被撞库」场景里这两条是第一道闸。密钥可再配最后使用时间监控，闲置即告警。关联考点：域 4.1.1「实施 IAM 功能」。\n\n❌ B：根用户日常使用是最高权限裸奔，日常封存是纪律。\n❌ C：长期凭证本身就是泄漏面，配好不等于安全，治理方向是清零。\n❌ E：最小权限起步按报错逐步放，「先给全再收窄」的返工代价是灾难级的。\n\n📌 关键概念：身份治理三板斧——人走角色、程序走实例角色、根用户封存加 MFA；权限给宽了再收回是灾难级返工。","s":"自编·4.1.1"}],"sections":[{"h":"实施与管理安全与合规工具及策略","body":"### 这一域考什么\n\n这一域问的是：谁能进来、能干什么、干过什么怎么证明。两个任务各管一半：\n\n1. **人与权限的治理**：身份门禁、访问排障、多账户组织、体检修复、持续合规，对应任务 4.1。\n2. **数据与基础设施的防护**：分类分级、静态与传输加密、秘密保管、安全发现处置，对应任务 4.2。\n\n这一域的考法和前几个域一样是运维视角：不是设计安全体系，而是把策略配对、把故障排清、把发现处置完。身份、加密、合规这三块恰恰是运维每天要动手的地方。\n\n### 读完这个域要能做什么\n\n- 配 IAM 的密码策略、多因素认证、角色与联合身份，资源策略与策略条件用得明白。\n- 排掉「策略看着对、访问还是拒」这类故障，用 CloudTrail 与策略模拟器定位到语句。\n- 用 Organizations 加服务控制策略管住多账户，用一致性包做持续合规。\n- 给数据做分类分级，配静态与传输加密，管好秘密，处置安全发现。\n\n### 和其他认证怎么接\n\n| 其他认证/能力 | 对应的那件事 | 这里有什么不同 | 什么时候该想起它 |\n|---|---|---|---|\n| 安全专业级认证 | 都讲 IAM、KMS 与安全服务 | 专业级考纵深设计与攻防；本课考配得对、排得清 | 要设计安全体系而不是执行时 |\n| CLF-C02（云从业者） | 都认识 IAM 这个名字 | 从业者级停在认知；本课要求配出策略、排掉权限故障 | 说得出名字却没配过时 |\n\n对照只用来迁移已有理解。做题以本域官方口径为准。\n\n### 官方口径的三条边界\n\n- 官方 Exam Guide 给出技能点编号与原文，不给逐考点的出现频率。\n- 官方认证页写明题型含单选与多选，多选全选对才得分。\n- 及格线 720 分（100–1000 补偿式计分），不要求每域单独达线。\n\n#### 这一节学什么\n这一节对应考纲任务 4.1「实施与管理安全与合规工具及策略」。\n\n> 官方原名：Implement and manage security and compliance tools and policies.\n\n五个技能点从身份层讲到审计层，再到治理层与合规层。主线是：身份管入口 → 审计管追责 → 组织管规模 → 合规管持续。\n\n#### 实施 IAM 功能\n\n> 官方原名：Implement IAM features (for example, password policies, multi-factor authentication [MFA], roles, federated identity, resource policies, policy conditions).\n\n**这条在问什么。** 考题给你「账号被撞库」「临时帮同事开权限」这类场景，考你 IAM 各功能的用法与取舍。\n\n**定义**：IAM（Identity and Access Management，身份与访问管理）管「谁能干什么」。几组概念先分清：\n\n- IAM 用户是长期身份。角色（role）是可被扮演的临时身份，跨账户访问、给应用授权都走角色。\n- 身份策略跟着主体走，声明它能干什么。资源策略跟着资源走，声明谁能用它。\n- 联合身份（federated identity）：外部身份提供商的用户换角色进来，企业单点登录场景。\n- 策略条件（policy condition）：策略里的条件子句，动作满足条件才生效，比如限定来源 IP、要求多因素认证。\n- 密码策略（password policy）：账户密码的长度、复杂度与有效期基线。MFA（multi-factor authentication，多因素认证）是密码之外的第二道因子。\n\n策略评估三句话：显式拒绝压倒一切。同账户里身份策略或资源策略任一允许即可。跨账户访问要两边都允许。\n\n**怎么运作**。落地清单：\n\n1. 根用户开启 MFA，日常封存不用。\n2. 密码策略按公司基线设最小长度与复杂度。\n3. 人员访问走联合身份换角色，IAM 用户只留给只能用长期凭证的遗留系统。\n4. 角色最小权限起步，用策略条件收紧使用场景。\n5. 跨账户共享走资源策略加角色，不发长期密钥。\n\n一条账户密码策略的配置：\n\n```bash\naws iam update-account-password-policy \\\n  --minimum-password-length 14 \\\n  --require-symbols --require-numbers \\\n  --password-reuse-prevention 24\n```\n\n**什么时候用，什么时候别用**。程序访问 AWS 一律用角色，长期密钥只留给无法改造的遗留系统。策略条件能把权限收紧到场景，比如只在办公网段可用。代价句：权限给宽了再收回是灾难级返工，最小权限起步按报错逐步放，比一次给全再排查泄漏快得多。\n\n💡 **场景举例**（虚构教学示意）：Northwind 安全演练发现两个 IAM 用户密钥超过一年没动过。治理后人员全部走联合登录换角色，程序访问换成实例角色。账户里只剩两把只能用长期凭证的遗留密钥。密钥还配了最后使用时间监控，闲置即告警。\n\n**关联服务**：IAM（用户、角色、身份与资源策略、密码策略、MFA、联合身份、策略条件）。\n\n#### 用 AWS 工具排障与审计访问问题\n\n> 官方原名：Troubleshoot and audit access issues by using AWS tools (for example, CloudTrail, IAM Access Analyzer, IAM policy simulator).\n\n**这条在问什么。** 考题给你「策略看着写对了、访问还是被拒」这类排障场景，考你三件工具各管什么、怎么串起来用。\n\n**定义**：访问排障三件套：\n\n- CloudTrail：记录 API 调用历史，被拒绝的请求也有事件。查「谁在什么时候对什么被拒了」。\n- IAM Access Analyzer（访问分析器）：扫描资源策略，列出对外部主体暴露的资源与权限，管「暴露面」。\n- IAM policy simulator（策略模拟器）：输入主体、动作与资源，模拟策略评估结果，不真发请求。\n\n**怎么运作**。三件工具各管一段：\n\n1. CloudTrail 管事实：已经发生的调用与拒绝，逐条可查。\n2. 模拟器管推演：改策略前先模拟，评估哪条语句起效。\n3. Access Analyzer 管暴露面：对外共享了什么，主动扫出来列清单。\n\n**排障判据**。「访问被拒」按序排查：\n\n1. 先查 CloudTrail 的被拒事件：主体、动作、资源与错误码定下来。\n2. 用模拟器复现同一动作与资源，看评估走到哪条语句。\n3. 跨账户访问再看两端：资源策略给了对方，身份侧也要放行。\n4. 条件子句逐项核：MFA 满足吗、IP 在网段吗、时间窗对吗。\n5. 上层策略别忘了：SCP 与权限边界（permission boundary）都会把请求压死。\n\n**什么时候用，什么时候别用**。事后审计查 CloudTrail，事前验证用模拟器，暴露面盘点用 Access Analyzer——三者各管一段，别拿暴露面工具查「为什么被拒」。代价句：CloudTrail 只记录已发生的调用，「还没发生的访问」要靠模拟器推演。事件量大的账户，审计日志先落 S3 再按需检索，别在控制台翻页翻到手软。\n\n💡 **场景举例**（虚构教学示意）：Northwind 合作方反馈跨账户拉数据被拒。CloudTrail 显示对方扮演角色成功、后续动作被拒。模拟器复现发现角色信任放行了账户，角色的身份策略却漏了目标动作，补一条即通。\n\n**关联服务**：AWS CloudTrail、AWS IAM Access Analyzer、IAM（策略模拟器、权限边界）、Amazon S3（审计日志落地）。\n\n#### 安全地实施多账户策略\n\n> 官方原名：Implement multi-account strategies securely (for example, AWS Organizations, service control policies, IAM Identity Center).\n\n**这条在问什么。** 考题给你「账户越开越多、权限越管越乱」这类场景，考你多账户治理三件工具的分工。\n\n**定义**：多账户治理三层结构：\n\n1. AWS Organizations：把账户组织成层级，统一记账与治理。\n2. 服务控制策略（SCP，service control policy）：挂在组织层级上的权限上限。它不授予权限，只划定成员账户最多能干什么。\n3. IAM Identity Center：人员统一登录入口，登录后换取各账户的角色，人不必每账户一套密码。\n\n**怎么运作**。治理分工：\n\n- SCP 定上限：生产层级挂上禁用危险服务的策略，通用护栏套在更高层级。\n- Identity Center 定入口：用户组映射到角色，权限随组走，人员动账单不动。\n- 账户按环境隔离：登录、日志、工作负载分账户，爆炸半径天然受限。\n\n账户多起来还可以用 AWS Control Tower 预置新账户与基线护栏，多账户起步的一站式做法。\n\n**什么时候用，什么时候别用**。账户数上两位数就该上组织加 SCP。三五账户的小团队，直接跨账户角色也就够。代价句：SCP 是封顶不是授权——SCP 放行不等于账户能做，账户内还要 IAM 授权。SCP 白名单写太死会挡住合法变更，每次新服务上线都要走评估。Identity Center 落地要动登录习惯，分批迁移留缓冲。\n\n💡 **场景举例**（虚构教学示意）：Northwind 按环境拆账户后，用 Organizations 把账户挂进沙箱与生产两个层级。生产层级的 SCP 禁掉高危服务，人员从 Identity Center 一处登录按组换角色。一处管人、一处管护栏，再没人申请「帮我开第十套密码」。\n\n**关联服务**：AWS Organizations（层级、SCP）、AWS IAM Identity Center、AWS Control Tower、IAM（角色）。\n\n#### 根据 AWS Trusted Advisor 安全检查结果实施修复\n\n> 官方原名：Implement remediation based on the results of AWS Trusted Advisor security checks.\n\n**这条在问什么。** 考题给你「Trusted Advisor 安全检查列出一排红灯」这类场景，考你红灯与修法的对应关系。\n\n**定义**：Trusted Advisor（受信任顾问）是账户体检工具，按类别给出检查项与红黄绿状态。安全类检查的经典项：\n\n- S3 桶权限开放：桶策略或 ACL 把内容放给了不该看的人。\n- 安全组规则过宽：管理端口对全网开放。\n- 根账户 MFA 未开：账户最高权限裸奔。\n- IAM 密钥闲置：长期凭证放着不用没人管。\n\n**怎么运作**。红灯与修法对号：\n\n1. 桶公开可读：收紧桶策略与 ACL，开桶级阻断公开访问开关。\n2. 管理端口全网开放：安全组规则换成限定源，或直接删规则。\n3. 根账户无 MFA：开虚拟或硬件 MFA，日常封存根凭证。\n4. 密钥闲置：轮换或停用，参照最后使用时间清账。\n\n**什么时候用，什么时候别用**。账户级体检与基线巡检用 Trusted Advisor，逐资源的深度检查交给配置规则与安全发现链路（任务 4.2 的发现处置细讲）。代价句：检查是快照不是监控——红灯修完还要把同类问题交给规则持续盯，光靠人定期点开看迟早漏。\n\n💡 **场景举例**（虚构教学示意）：Northwind 季度体检出七个红灯：三个桶公开可读、两台机器 22 端口全网开放、根账户没 MFA、还有一把闲置密钥。逐项修复清零后，把这几类检查交给配置规则持续盯，同样的红灯没有第二次出现的机会。\n\n**关联服务**：AWS Trusted Advisor（安全检查）、Amazon S3（阻断公开访问）、Amazon EC2（安全组）、IAM（根账户、密钥轮换）、AWS Config（规则化盯防）。\n\n#### 实施合规要求与持续监控\n\n> 官方原名：Enforce compliance requirements and continuous monitoring (for example, Region and service selections, AWS Config conformance packs).\n\n**这条在问什么。** 考题给你「合规要求限制区域与服务、还要持续证明」这类场景，考你合规边界与持续监控怎么落地。\n\n**定义**：合规约束两类。区域与服务选择是「边界」：数据落地范围与可服务范围。持续监控是「盯防」：AWS Config 一致性包（conformance pack）把一组配置规则打包部署，评估资源是否符合基线。\n\n**怎么运作**。落地路径：\n\n1. 区域边界：SCP 拒绝允许清单之外的区域操作，数据落地范围封住。\n2. 服务边界：出范围服务用 SCP 或 IAM 策略拒绝。\n3. 持续盯防：Config 规则盯资源配置——卷未加密、管理端口开放这类，不合规资源标记出来。\n4. 一致性包：规则打包铺到多账户，审计报告一份聚合出。\n5. 修复闭环：规则触发自动修复或工单跟进。\n\n一条配置规则的定义：\n\n```bash\naws configservice put-config-rule \\\n  --config-rule '{\n    \"ConfigRuleName\": \"nw-encrypted-volumes\",\n    \"Source\": {\"Owner\": \"AWS\", \"SourceIdentifier\": \"ENCRYPTED_VOLUMES\"},\n    \"Scope\": {\"ComplianceResourceTypes\": [\"AWS::EC2::Volume\"]}\n  }'\n```\n\n**什么时候用，什么时候别用**。能机器判定的约束（区域、加密、端口）交给 SCP 与 Config 规则；依赖人判断的流程合规写流程留审计证据。代价句：规则集越多维护越贵——一致性包统一版本管理，规则随业务变更同步，过期规则会误伤合法配置、放过新风险。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的合规基线要求数据不出三个区域、卷全加密。SCP 把区域封住，一致性包带着二十条规则铺到全部账户。审计季一份聚合报告证明全绿，原先两周的人工自查缩到两小时。\n\n**关联服务**：AWS Config（规则、一致性包、修复）、AWS Organizations（SCP 边界）、IAM（策略边界）、AWS CloudTrail（审计留痕）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「SCP 授予权限」 | SCP 只封顶不授权，账户内仍要 IAM 放行 |\n| 2 | 「IAM 用户配好就安全」 | 长期凭证是泄漏面，人走角色、程序走实例角色 |\n| 3 | 「资源策略给了就能访问」 | 跨账户访问身份侧也要放行，两边都评估 |\n| 4 | 「Access Analyzer 用来查被拒」 | 它扫暴露面；查被拒看 CloudTrail 加模拟器 |\n| 5 | 「红灯修完就完事」 | 检查是快照，持续合规要规则盯防 |\n| 6 | 「规则越多越安全」 | 过期规则误伤合法配置，规则要随业务同步 |\n\n#### 记忆要点\n\n1. **身份走角色**：人员联合登录换角色，程序用实例角色，长期凭证清零。\n2. **策略评估三句**：显式拒绝压倒一切。同账户任一允许即可，跨账户两边都要允许。\n3. **排障三件套**：CloudTrail 查事实、模拟器复现评估、Access Analyzer 扫暴露面。\n4. **多账户三件**：Organizations 管层级、SCP 管封顶、Identity Center 管入口。\n5. **体检修完上规则**：Trusted Advisor 定点清零，Config 规则持续盯。\n6. **合规两边界**：区域与服务用 SCP 封，资源配置用一致性包盯。\n\n---"},{"h":"实施保护数据与基础设施的策略","body":"#### 这一节学什么\n这一节对应考纲任务 4.2「实施保护数据与基础设施的策略」。\n\n> 官方原名：Implement strategies to protect data and infrastructure.\n\n前一个任务管人，这个任务管物。五个技能点从数据的户口本（分类）讲到两道锁（静态加密、传输加密），再到保险柜（秘密存储），最后是告警台（安全发现的报告与处置）。主线是：先分级 → 再上锁 → 秘密进柜 → 发现闭环。\n\n#### 实施与执行数据分类方案\n\n> 官方原名：Implement and enforce a data classification scheme.\n\n**这条在问什么。** 考题给你「哪些数据能放云上、哪些要加密、哪些不能动」这类制度落地场景，考你分类方案怎么设计、怎么执行。\n\n**定义**：数据分类方案（data classification scheme）是给数据定敏感等级的规则表：每份数据贴一个等级标签，等级决定存储、加密、访问与留存要求。经典分档：\n\n- 公开：泄了也不伤业务。\n- 内部：只在公司内流转。\n- 机密：泄露造成实质损失。\n- 受监管：个人身份信息、金融数据这类法定敏感。\n\n**怎么运作**。落地三件事：\n\n1. 定级：列数据资产清单，按「泄露后果」定档。后果越重管控越严。\n2. 打标：等级落到资源标签或对象元数据上，机器可读。\n3. 执行：等级驱动策略——机密档强制加密、禁跨区复制、访问全审计。敏感数据还可以用 Amazon Macie 自动扫描对象存储里的个人身份信息，查漏标。\n\n**什么时候用，什么时候别用**。分类是一切数据管控的前置：没有等级就没有差异化策略，一刀切加密要么太贵要么漏防。起步只分三档（公开、内部、机密）就够用，一上来十级分类没人执行得动。代价句：分类表挂在墙上没人执行等于没有——标签要进自动化检查，未打标资源按最高档处理，倒逼打标。\n\n💡 **场景举例**（虚构教学示意）：Northwind 把数据分三档：路线与运价公开、运营数据内部、客户与司机身份信息机密。机密档对象全部加密、访问全审计，未打标的新桶按机密档处理——两周后没人再「先建桶再说」。\n\n**关联服务**：Amazon S3（对象标签、桶策略）、Amazon Macie（敏感数据发现）、AWS Config（无标资源检查）。\n\n#### 实施、配置与排障静态加密\n\n> 官方原名：Implement, configure, and troubleshoot encryption at rest (for example, AWS KMS).\n\n**这条在问什么。** 考题给你「卷要加密」「桶怎么落密文」或「加密之后反而访问不了」这类场景，考你静态加密的配置与排障。\n\n**定义**：静态加密（encryption at rest）指数据落在存储介质上时是密文。AWS KMS（Key Management Service，密钥管理服务）管密钥的创建、轮换与授权：服务集成 KMS 后，加解密对应用透明，谁能用钥匙由密钥策略把关。\n\n**怎么运作**。KMS 的三层结构：\n\n1. KMS 密钥（KMS key）：密钥主体，带密钥策略定「谁能用这把钥匙」。默认策略给账户根完全控制，跨账户另加授权。\n2. 服务集成：S3 有 SSE-S3（服务托管密钥，透明）与 SSE-KMS（指定 KMS 密钥，可控可审计）两条路。EBS 卷与 RDS 存储创建时选加密。\n3. 权限链：调用方的 IAM 策略加密钥策略都要放行，跨账户用钥匙两边都要授权。\n\n**排障判据**。「加密资源访问不了」按序排查：\n\n1. 密钥策略里有没有调用方——桶策略开了、钥匙没给，照样被拒。\n2. 密钥启用状态——被禁用的密钥，新数据写不进，已加密数据也读不出。\n3. 调用方有没有 KMS 动作权限——IAM 策略漏了密钥动作，同样拒。\n4. 换密钥场景——S3 对象要换加密密钥，得复制对象自身而不是改桶设置。\n\n**什么时候用，什么时候别用**。默认全加密：EBS 卷、S3 默认加密、RDS 存储加密都是起步姿势。要审计与密钥级控制选 SSE-KMS，只要落盘密文用默认 SSE-S3 也够。代价句：KMS 调用有速率配额，高频小对象读写要评估限流影响；跨账户共享密钥的授权关系复杂，共享越少越好管。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的运单桶升级为 SSE-KMS 后报表服务突然报错。排查发现报表服务角色在密钥策略里没被放行——桶策略开了、钥匙没给。密钥策略补上报表服务角色，报错清零。\n\n**关联服务**：AWS KMS（KMS 密钥、密钥策略）、Amazon S3（SSE-S3、SSE-KMS）、Amazon EBS（加密卷）、Amazon RDS（存储加密）、IAM（KMS 动作权限）。\n\n#### 实施、配置与排障传输加密\n\n> 官方原名：Implement, configure, and troubleshoot encryption in transit (for example, AWS Certificate Manager [ACM]).\n\n**这条在问什么。** 考题给你「HTTPS 证书怎么挂」「证书快过期」或「TLS 配了但握手失败」这类场景，考你传输加密的配置与排障。\n\n**定义**：传输加密（encryption in transit）指数据在网络流动时加密，主力是 TLS（Transport Layer Security，传输层安全协议）。ACM（AWS Certificate Manager，证书管理服务）负责证书的申请、部署与自动续期。\n\n**怎么运作**。证书的旅程四步：\n\n1. 申请：公有证书走域名验证签发，私有证书走内部 CA。\n2. 部署：证书挂到集成服务——负载均衡器监听器、CloudFront 分配。\n3. 续期：ACM 签发的证书自动续期，前提是验证记录还在、证书仍被使用。\n4. 多域名：服务器名称指示让一个监听器挂多张证书，按请求域名选择。\n\n**排障判据**。「TLS 相关故障」按序排查：\n\n1. 先看证书过期没有——ACM 自动续期只管自己签发的证书，导入的证书要手动续。\n2. 域名匹配吗——证书覆盖的域名要与访问用的域名一致。\n3. 验证记录还在吗——域名验证记录失效，签发与续期都会卡住。\n4. TLS 终止在哪层——客户端到负载均衡器加密，负载均衡器到实例那段是否也加密，是另一个配置项。\n\n**什么时候用，什么时候别用**。对外入口一律 TLS，没有商量。内部服务间看威胁模型：跨网络边界的流量加密，同集群内部按需。代价句：TLS 终止在负载均衡器时，到实例的「最后一公里」是明文——合规要端到端就配后端加密监听器，证书管理面随之翻倍。导入的外部证书不自动续期，是证书过期故障的头号来源。\n\n💡 **场景举例**（虚构教学示意）：Northwind 客户门户的证书是三年前导入的外部证书。某天凌晨全站告警，浏览器报证书过期——团队一直以为「挂上就管」。换 ACM 签发证书后自动续期，此后没人再为到期日值班。\n\n**关联服务**：AWS Certificate Manager（公有与私有证书、自动续期）、Elastic Load Balancing（HTTPS 监听器、后端加密）、Amazon CloudFront（证书绑定）、Amazon Route 53（域名验证记录）。\n\n#### 用 AWS 服务安全存储秘密\n\n> 官方原名：Securely store secrets by using AWS services.\n\n**这条在问什么。** 考题给你「数据库密码放哪、第三方密钥别写进代码」这类场景，考你秘密管理的服务选型与用法。\n\n**定义**：秘密（secret）指不该出现在代码、配置文件或日志里的凭证：数据库密码、API 密钥、连接串。AWS 的秘密仓库两家：\n\n- AWS Secrets Manager：专门的秘密管理服务，存、轮换、检索一条龙，数据库凭证可托管自动轮换。\n- SSM Parameter Store（参数仓库）：Systems Manager 的参数存储，标准参数免费，安全字符串（SecureString）走 KMS 加密。\n\n**怎么运作**。两条使用纪律：\n\n1. 动态取用：应用运行时用角色授权去取，取完不落盘、不进日志、不进环境变量。\n2. 轮换托管：能自动轮的交给服务轮——数据库凭证用托管轮换，应用每次启动取最新值。\n\n**什么时候用，什么时候别用**。要自动轮换、要跨库联动选 Secrets Manager。一般配置与低频轮换的密钥选 Parameter Store，成本更低。代价句：轮换自动化是双刃剑——轮换失败而应用还在用旧密码，访问会被拒；轮换函数要配失败告警与回退预案，不然轮换变成故障源。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的应用配置里散落着几十个硬编码密钥。迁移到 Secrets Manager 后：数据库凭证每月自动轮换，第三方密钥按季度手动轮换留审计记录。一次红队演习证明：代码仓库被拖走，里面没有任何可用凭证。\n\n**关联服务**：AWS Secrets Manager（存储与轮换）、AWS Systems Manager（Parameter Store、SecureString）、AWS KMS（加密）、IAM（取用授权）、AWS Lambda（轮换函数）。\n\n#### 配置报告与处置 AWS 服务的安全发现\n\n> 官方原名：Configure reports and remediate findings from AWS services (for example, AWS Security Hub, Amazon GuardDuty, AWS Config, Amazon Inspector, AWS Security Agent).\n\n**这条在问什么。** 考题给你「安全服务各报各的发现，怎么汇成一份报告、怎么处置闭环」这类场景，考你安全发现链路的配置。\n\n**定义**：五个发现源各管一段：\n\n- AWS Security Hub：安全发现的聚合中枢，把各源发现汇成统一格式，对照安全基准出合规分与报告。\n- Amazon GuardDuty：威胁检测，从审计事件、DNS 查询、网络流量日志里找异常行为。\n- AWS Config：配置合规发现，规则评估的结果。\n- Amazon Inspector：漏洞与暴露面扫描，扫实例、容器镜像的软件漏洞和网络暴露。\n- AWS Security Agent：AWS 的 agentic 渗透测试代理（现已并入 AWS Continuum），按需对应用做渗透测试、生成威胁模型，产出带复现步骤的已验证漏洞。\n\n**怎么运作**。发现链路四步：\n\n1. 各源开检测：威胁检测开 GuardDuty，漏洞扫描开 Inspector，合规规则进 Config，代理装上采集遥测。\n2. 汇聚：Security Hub 聚合各源发现，按严重度排序。\n3. 处置：发现分派——自动修复（Config 修复动作）、工单跟进、误报标记。\n4. 报告：Security Hub 出合规分与趋势报表，管理层的月度安全汇报从这里出。\n\n**什么时候用，什么时候别用**。聚合与合规报告用 Security Hub，不必自己拼各服务控制台。威胁检测开 GuardDuty 是低摩擦的默认项。代价句：开了不处置等于装了报警器没人接警——发现要挂处置流程与责任人。误报不标记会淹没真警报，定期清噪音是纪律。\n\n💡 **场景举例**（虚构教学示意）：Northwind 开了五源发现链路。GuardDuty 发现一台实例有对外的异常加密流量，Inspector 报镜像存在高危漏洞，两条发现都汇到 Security Hub 的高严重度队列。值班按处置手册先隔离实例再升级镜像，处置记录回写闭环。安全例会只看趋势报表。\n\n**关联服务**：AWS Security Hub（聚合、报告）、Amazon GuardDuty（威胁检测）、AWS Config（合规发现、修复）、Amazon Inspector（漏洞与暴露面）、AWS Security Agent（按需渗透测试）、Amazon CloudWatch（处置告警联动）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「加密了就没人看得见」 | 授权主体仍能解密；加密防泄漏不防越权访问 |\n| 2 | 「SSE-S3 和 SSE-KMS 一样」 | SSE-KMS 可控密钥与审计，SSE-S3 托管透明 |\n| 3 | 「挂上 ACM 就永不过期」 | 自动续期只管 ACM 签发的证书，导入的要手动续 |\n| 4 | 「秘密放环境变量就安全」 | 环境变量随转储与日志外泄，仓库化动态取用更稳 |\n| 5 | 「TLS 终止在负载均衡器就全链加密」 | 到实例那段是明文，端到端要后端加密监听器 |\n| 6 | 「安全服务开了就安全」 | 开了不处置等于报警没人接；聚合加闭环才是链路 |\n\n#### 记忆要点\n\n1. **分类先于管控**：先分级打标，无标按最高档处理倒逼执行。\n2. **钥匙看密钥策略**：桶策略开了钥匙没给，照样被拒。\n3. **证书续期分两家**：ACM 签发的自动续，导入的手动续。\n4. **秘密两家仓**：要轮换选 Secrets Manager，一般配置选 Parameter Store。\n5. **五源一枢纽**：GuardDuty、Inspector、Config 等各出发现，Security Hub 聚合出报告。\n6. **发现挂处置**：责任人加动作闭环，误报定期清噪音。\n\n---"}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 4.1.1 | IAM 功能与策略评估 | ⭐⭐⭐ | 情景单选/多选 |\n| 4.1.2 | 访问排障三件套 | ⭐⭐⭐ | 排障情景题 |\n| 4.1.3 | Organizations、SCP 与 Identity Center | ⭐⭐⭐ | 情景单选/多选 |\n| 4.1.4 | Trusted Advisor 安全检查与修复 | ⭐ | 情景单选 |\n| 4.1.5 | 区域服务边界与一致性包 | ⭐⭐ | 情景单选 |\n| 4.2.1 | 数据分类方案落地 | ⭐⭐ | 情景单选 |\n| 4.2.2 | KMS 静态加密与排障 | ⭐⭐⭐ | 情景单选/排障题 |\n| 4.2.3 | ACM 证书与 TLS 排障 | ⭐⭐ | 情景单选/排障题 |\n| 4.2.4 | 秘密存储选型 | ⭐⭐ | 情景单选 |\n| 4.2.5 | 安全发现聚合与处置 | ⭐⭐⭐ | 情景单选/多选 |","services":"| 服务 | 主要用途 | 涉及知识点 |\n|---|---|---|\n| IAM（用户、角色、策略、密码策略、MFA、联合身份、权限边界） | 身份与权限治理 | 4.1.1、4.1.2、4.2.2 |\n| AWS CloudTrail | 访问审计与威胁检测源 | 4.1.2、4.2.5 |\n| AWS IAM Access Analyzer | 暴露面分析 | 4.1.2 |\n| AWS Organizations（SCP） | 多账户治理与区域服务边界 | 4.1.3、4.1.5 |\n| AWS IAM Identity Center | 人员统一登录 | 4.1.3 |\n| AWS Control Tower | 多账户基线 | 4.1.3 |\n| AWS Trusted Advisor | 账户安全体检 | 4.1.4 |\n| AWS Config（规则、一致性包、修复） | 持续合规 | 4.1.4、4.1.5、4.2.5 |\n| Amazon Macie | 敏感数据发现 | 4.2.1 |\n| AWS KMS | 静态加密密钥 | 4.2.2、4.2.4 |\n| Amazon S3（SSE、对象标签） | 对象存储加密与打标 | 4.2.1、4.2.2 |\n| Amazon EBS、Amazon RDS | 存储加密对象 | 4.2.2 |\n| AWS Certificate Manager | 证书与自动续期 | 4.2.3 |\n| Elastic Load Balancing（HTTPS 监听器、后端加密） | TLS 终止与端到端 | 4.2.3 |\n| Amazon CloudFront（证书绑定） | 边缘 TLS | 4.2.3 |\n| Amazon Route 53（域名验证） | 证书域名验证 | 4.2.3 |\n| AWS Secrets Manager | 秘密存储与轮换 | 4.2.4 |\n| AWS Systems Manager（Parameter Store） | 参数与秘密 | 4.2.4 |\n| AWS Lambda（轮换函数） | 自动轮换执行 | 4.2.4 |\n| AWS Security Hub | 发现聚合与报告 | 4.2.5 |\n| Amazon GuardDuty | 威胁检测 | 4.2.5 |\n| Amazon Inspector | 漏洞与暴露面扫描 | 4.2.5 |\n| AWS Security Agent | 按需渗透测试 | 4.2.5 |\n| Amazon CloudWatch | 处置告警联动 | 4.2.5 |","furtherReading":"- 本域官方页（权威口径）：https://docs.aws.amazon.com/aws-certification/latest/sysops-administrator-associate-03/sysops-administrator-associate-03-domain4.html\n- Exam Guide 主页：https://docs.aws.amazon.com/aws-certification/latest/sysops-administrator-associate-03/sysops-administrator-associate-03.html\n- 考试范围内服务清单：https://docs.aws.amazon.com/aws-certification/latest/sysops-administrator-associate-03/soa-03-in-scope-services.html"}},{"domain":5,"name":"网络与内容分发","weight":"18%","practice":[{"id":"D5-004","d":5,"t":"single","q":"Northwind 新业务按经典三层结构搭 VPC：入口、业务、出网各就各位。哪个布局是对的","o":[{"l":"A","t":"公有子网放 ALB 与 NAT 网关这类入口与通道组件，业务实例放私有子网，出网走 NAT"},{"l":"B","t":"全部实例放公有子网，省去路由配置"},{"l":"C","t":"业务实例放公有子网各绑弹性 IP，直接对外服务"},{"l":"D","t":"私有子网的路由表指向互联网网关"}],"a":["A"],"e":"✅ 正确项：A。经典三层：VPC 定网段切公有私有子网（跨多个可用区）；公有子网路由指向 IGW，放负载均衡器这类入口，NAT 网关也部署在公有子网；私有子网业务实例出网路由指向 NAT——入口在公有、业务在私有、出网走 NAT，边界清晰。关联考点：域 5.1.1「配置 VPC」。\n\n❌ B：全公有等于没有私网边界，安全分层设计归零。\n❌ C：业务实例直接暴露公网，攻击面最大化。\n❌ D：私有子网路由指向 IGW 就变成了公有子网语义，私有边界失效。\n\n📌 关键概念：三层结构口诀——公有子网放入口（IGW 路由）、私有子网放业务（NAT 路由出网）、安全组按角色最小放行。","s":"自编·5.1.1"},{"id":"D5-006","d":5,"t":"single","q":"Northwind 有 VPC-A、VPC-B、VPC-C 三张网：A 与 B 建了对等连接，B 与 C 也建了。工程师发现 A 里的实例访问不了 C。根因是哪个","o":[{"l":"A","t":"对等连接生效有延迟，再等一会儿 A 就能到 C"},{"l":"B","t":"在 A 的路由表里加一条指向 C 网段的路由即可"},{"l":"C","t":"对等连接不能传递：A 连 B、B 连 C，A 到不了 C；三个以上 VPC 用中转网关组星型"},{"l":"D","t":"把三个 VPC 合并成一个大 VPC"}],"a":["C"],"e":"✅ 正确项：C。VPC 对等连接是点对点私网直连，不能传递——A 连 B、B 连 C，A 到不了 C，这是对等连接的机制边界。三个以上 VPC 互联别画网状，上中转网关（Transit Gateway）组星型，中心枢纽路由。关联考点：域 5.1.2「配置私有网络连接」。\n\n❌ A：不是生效延迟，「不可传递」是设计属性，等多久都到不了。\n❌ B：路由表加路由的前提是底层有通路，A 与 C 之间没有对等连接，加了路由也不通。\n❌ D：合并大 VPC 治标且丢失隔离边界，多 VPC 架构的治理价值会一起丢掉。\n\n📌 关键概念：对等三点——点对点、不可传递、两侧路由都要配；三个以上 VPC 上 TGW 组星型。","s":"自编·5.1.2"},{"id":"D5-009","d":5,"t":"single","q":"Northwind 的架构师评审一套纯云方案：VPC 里的实例要解析公网域名与本 VPC 的私有域名。DNS 侧要做什么","o":[{"l":"A","t":"为每个 VPC 单独建 Resolver 出站端点才能解析公网域名"},{"l":"B","t":"默认 Resolver 即可：纯云环境它答公网与本 VPC 私有域名，混合场景才需要端点与转发规则"},{"l":"C","t":"私有域名要注册到公网托管区才能解析"},{"l":"D","t":"两个 VPC 互查私有域名，先各自建出站端点"}],"a":["B"],"e":"✅ 正确项：B。纯云环境用默认 Resolver 就够：公网域名与本 VPC 私有域名它都答，不需要端点——出站端点与转发规则是混合场景（云里要解析本地私有域）的工具。两个 VPC 互查私有域，对等连接加 DNS 解析选项就够，不必建端点。关联考点：域 5.2.1「配置 DNS」。\n\n❌ A：公网解析是默认能力，为此建端点是白花钱（端点按可用区网卡小时计费）。\n❌ C：VPC 私有域名走私有托管区，与公网托管区是两套体系。\n❌ D：VPC 互查用对等加 DNS 解析选项，端点是给「查到本地机房」的。\n\n📌 关键概念：Resolver 端点两判据——要不要端点看「是不是混合场景」；端点每可用区一张网卡按小时计费，转发后缀别写宽。","s":"自编·5.2.1"},{"id":"D5-011","d":5,"t":"single","q":"Northwind 要留下「谁在什么时间查了什么域名、应答是什么」的记录，用于解析排障与审计。配哪个","o":[{"l":"A","t":"VPC 流日志，网卡级流记录"},{"l":"B","t":"CloudTrail，API 调用审计"},{"l":"C","t":"ELB 访问日志，请求级记录"},{"l":"D","t":"Route 53 查询日志：托管区关联 CloudWatch Logs 日志组，解析记录可审计"}],"a":["D"],"e":"✅ 正确项：D。Route 53 查询日志（query logging）把「谁查了什么、结果是什么」落到 CloudWatch Logs：托管区关联日志组即可开启，排障与审计两用——切换前后的应答变化逐条可查，审计季是第一手证据。关联考点：域 5.2.2「实施 Route 53 路由策略、配置与查询日志」。\n\n❌ A：流日志记网卡层的包流（源目的端口与 ACCEPT 或 REJECT），不含 DNS 查询内容。\n❌ B：CloudTrail 记的是 AWS API 调用，终端用户的 DNS 查询不经过它。\n❌ C：ELB 访问日志是 HTTP 请求记录，与 DNS 解析是两层。\n\n📌 关键概念：DNS 排障两件套——查询日志看应答事实、健康检查看端点状态；审计与排障共用一份日志。","s":"自编·5.2.2"},{"id":"D5-014","d":5,"t":"single","q":"Northwind 排查「客户端偶发超时」：CloudFront 日志已排除边缘段，要定位「负载均衡这一跳」的表现。接下来读哪份日志","o":[{"l":"A","t":"VPC 流日志的 REJECT 计数"},{"l":"B","t":"WAF web ACL 日志的拦截行"},{"l":"C","t":"容器日志的连接记录"},{"l":"D","t":"ELB 访问日志：看目标响应时间波动，4xx 看客户端侧、5xx 看目标侧健康与超时"}],"a":["D"],"e":"✅ 正确项：D。读日志的路径法：客户端→边缘→负载均衡→目标按段分包，每段读对应日志。边缘段排除后看 ELB 访问日志：目标响应时间波动指向目标侧，4xx 看客户端侧、5xx 看目标侧的健康与超时——入口段的判读归它。关联考点：域 5.3.2「收集与解读网络日志排障」。\n\n❌ A：流日志管 VPC 内网卡跳的包流，5xx 与响应延迟这类请求层信号不在它的字段里。\n❌ B：WAF 日志记的是被检请求的判定（哪条规则、放行拦截），面向应用层过滤。\n❌ C：容器日志管容器这一跳，与负载均衡段无关。\n\n📌 关键概念：日志路径法——先定断在哪段再挑对应日志；一份日志管一跳，拼起来才是完整时间线。","s":"自编·5.3.2"},{"id":"D5-017","d":5,"t":"single","q":"Northwind 的实例访问一个接口型 VPC 端点：端点 IP 能 ping 通，调用却返回访问被拒。下一步查哪里","o":[{"l":"A","t":"按网络不通处理，把子网路由表重配一遍"},{"l":"B","t":"放弃端点改走公网访问该服务"},{"l":"C","t":"删掉端点重建一个新子网里"},{"l":"D","t":"先分清「网络通而权限被拒」：查端点安全组有没有放行调用方、端点策略有没有限定资源范围"}],"a":["D"],"e":"✅ 正确项：D。私有连接排障第一步是先测端点地址，分清「网络不通」还是「权限被拒」——IP 通而调用被拒，问题在授权层：端点安全组没放行调用方、端点策略限了资源范围都会拒。补安全组规则或放开策略范围即恢复。关联考点：域 5.3.4「识别与排障混合连接与私有连接问题」。\n\n❌ A：IP 已通说明网络层正常，重配路由表方向偏了。\n❌ B：改走公网放弃私道，费用与暴露面双输。\n❌ C：删端点重建引入变更与等待，且病因在授权层不在端点本身。\n\n📌 关键概念：私有连接三段——端点段（安全组与端点策略）、对等段（两侧路由）、解析段（服务名解析）；先分「不通」与「被拒」再动手。","s":"自编·5.3.4"}],"sections":[{"h":"实施与优化网络功能与连接","body":"### 这一域考什么\n\n这一域问的是：流量从用户到服务怎么走、怎么走得又稳又快又省。三个任务分三段：\n\n1. **搭底座**：VPC 与子网、路由、公私连接、防护与成本，对应任务 5.1。\n2. **管流量入口**：域名、DNS 与内容分发怎么配，对应任务 5.2。\n3. **排不通**：连不通查哪里、看什么日志，对应任务 5.3。\n\n网络是运维考试的硬通货：VPC 配错，一切白搭。这一域一半讲「把网配对」，一半讲「网不通了怎么查」，后者靠日志与逐层定位，是拿分的分水岭。\n\n### 读完这个域要能做什么\n\n- 从零配一个 VPC：子网、路由表、安全组、网络 ACL、出网通道各就各位。\n- 给不该走公网的流量配私有通道：VPC 端点、PrivateLink、VPC 对等按场景选。\n- 用 Route 53 的路由策略把流量导对方向，用 CloudFront 与 Global Accelerator 把内容送得又快又稳。\n- 排掉「连不通」类故障：路由、安全组、网络 ACL、日志逐层定位到根因。\n\n### 和其他认证怎么接\n\n| 其他认证/能力 | 对应的那件事 | 这里有什么不同 | 什么时候该想起它 |\n|---|---|---|---|\n| SAP-C03（架构师专业级） | 都讲 VPC 与内容分发 | 架构级考混合组网设计；本课考配得出、排得通 | 要设计复杂混合网络时 |\n| CLF-C02（云从业者） | 都听过 VPC 这个词 | 从业者级停在名词；本课要求逐条配出组件并排障 | 听得懂名词但没建过子网时 |\n\n对照只用来迁移已有理解。做题以本域官方口径为准。\n\n### 官方口径的三条边界\n\n- 官方 Exam Guide 给出技能点编号与原文，不给逐考点的出现频率。\n- 官方认证页写明题型含单选与多选，多选全选对才得分。\n- 及格线 720 分（100–1000 补偿式计分），不要求每域单独达线。\n\n#### 这一节学什么\n这一节对应考纲任务 5.1「实施与优化网络功能与连接」。\n\n> 官方原名：Implement and optimize networking features and connectivity.\n\n四个技能点从搭骨架讲到开私道，再到上护栏与省网费。主线是：骨架 → 私道 → 护栏 → 省钱。\n\n#### 配置 VPC\n\n> 官方原名：Configure a VPC (for example, subnets, route tables, network ACLs, security groups, NAT gateways, internet gateway, egress-only internet gateway).\n\n**这条在问什么。** 考题给你「新业务要一个网络」「实例要出网但不能被进网」这类需求，考你 VPC 组件逐个怎么配。\n\n**定义**：VPC（Virtual Private Cloud，虚拟私有云）是账户里的私有网段。核心组件一次记全：\n\n- 子网（subnet）：VPC 网段的切分，公有子网带出网路由，私有子网不带。\n- 路由表（route table）：子网级流量去哪的规则表。\n- 互联网网关（internet gateway，IGW）：VPC 出入互联网的大门。\n- NAT 网关（NAT gateway）：私有子网「只出不进」的翻译器——出去换成公网源地址，回来再翻译回去。\n- 仅出站互联网网关（egress-only internet gateway）：IPv6 场景的只出不进通道。\n- 安全组（security group）：实例级有状态防火墙，只能加放行规则。\n- 网络 ACL（network ACL）：子网级无状态过滤，进出分开计数，支持拒绝规则。\n\n**怎么运作**。经典三层结构搭法：\n\n1. VPC 定网段，切公有子网与私有子网，跨多个可用区。\n2. 公有子网路由指向 IGW，放负载均衡器这类入口。\n3. 私有子网路由指向 NAT 网关，业务实例能出不能进。\n4. 安全组按角色最小放行，网络 ACL 显式拒绝已知恶意地址段。\n\n一条私有子网的默认路由：\n\n```bash\naws ec2 create-route \\\n  --route-table-id rtb-nwprivate \\\n  --destination-cidr-block 0.0.0.0/0 \\\n  --nat-gateway-id nat-nw01\n```\n\n**什么时候用，什么时候别用**。要对外服务，公有子网加 IGW。要安全出网，私有子网加 NAT。日常边界安全组足够，网络 ACL 用来显式拒绝特定地址段做兜底。代价句：NAT 网关按小时加按流量计费，一个常驻 NAT 就是稳定支出——多可用区 NAT 是双倍支出，按业务等级取舍，不是每套环境都值得高可用。\n\n💡 **场景举例**（虚构教学示意）：Northwind 新业务上线一套三层 VPC：公有子网放 ALB，私有子网放订单机与队列机，出网走 NAT 打补丁。安全组按角色开最小端口，网络 ACL 显式拒绝已知扫描源段。上线当周完成两次补丁，没有一次暴露入网。\n\n**关联服务**：Amazon VPC（子网、路由表、IGW、NAT 网关、仅出站网关、安全组、网络 ACL）。\n\n#### 配置私有网络连接\n\n> 官方原名：Configure private networking connectivity (for example, VPC endpoints, AWS PrivateLink, VPC peering).\n\n**这条在问什么。** 考题给你「实例访问 S3 想走内网」「两个 VPC 要互通」「第三方服务不想走公网」这类需求，考你私有连接三条路怎么选。\n\n**定义**：三条私有通道各有定位：\n\n- VPC 对等连接（VPC peering）：两个 VPC 的点对点私网直连，不能传递——A 连 B、B 连 C，A 到不了 C。\n- VPC 端点（VPC endpoint）：VPC 内访问 AWS 服务的私网出口。接口型走弹性网卡，网关型走路由表。\n- AWS PrivateLink：把服务暴露成私网地址的托管能力，消费方与提供方各在 VPC 内，流量全程走 AWS 骨干。\n\n**怎么运作**。按场景对号入座：\n\n1. VPC 访问 S3 或 DynamoDB：网关型端点，路由表指一下就走内网，不花 NAT 数据费。\n2. VPC 访问其他 AWS 服务：接口型端点，按小时计费。\n3. 第三方服务要走内网：问对方有没有 PrivateLink。\n4. 多 VPC 互联：点对点小规模用对等连接；三个以上别画网状，上中转网关（Transit Gateway，中心枢纽路由）。\n\n**什么时候用，什么时候别用**。S3 流量大，网关型端点是省钱首选。接口型端点按小时计费，低流量 VPC 比 NAT 省、高流量更划算，按总账算。对等连接不可传递，拓扑要提前规划。代价句：私有通道省钱省心，但每条通道都是一处新增配置——端点策略、路由、安全组三样都要核，配漏一处流量照样绕公网。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的报表库每天从 S3 拉几十 GB 数据，原来绕 NAT 出公网再回 S3，网费扎眼。配网关型端点后流量全走内网，NAT 数据费清零，只留基准配置费。\n\n**关联服务**：Amazon VPC（对等连接、VPC 端点、Transit Gateway）、AWS PrivateLink、Amazon S3（网关端点）、Amazon DynamoDB（网关端点）。\n\n#### 在单账户内审计 AWS 网络防护服务\n\n> 官方原名：Audit AWS network protection services (for example, Route 53 Resolver DNS Firewall, AWS WAF, AWS Shield, AWS Network Firewall) in a single account.\n\n**这条在问什么。** 考题给你「四个网络防护服务各管什么、配置怎么核查」这类场景，考你防护体系的位置感与审计路径。\n\n**定义**：四个防护服务按流量路径站位：\n\n- Route 53 Resolver DNS Firewall（DNS 防火墙）：管「域名解析」这一跳——出站 DNS 查询按域名列表放行或拦截。\n- AWS WAF：管 HTTP 入口——应用层规则过滤（注入特征、IP 名单、速率限制）。\n- AWS Shield：管洪泛攻击——Standard 全客户免费自动防护，Advanced 是付费增值。\n- AWS Network Firewall：管 VPC 边界——网络层与传输层的托管防火墙，规则组做有状态检测。\n\n**怎么运作**。单账户的审计路径：\n\n1. 先对站位：DNS 防火墙管解析、WAF 管应用、Shield 管洪泛、网络防火墙管边界，一跳一岗。\n2. 查挂载点：WAF 规则挂到 CloudFront 或负载均衡器上了吗，DNS 防火墙规则组关联到 VPC 了吗。\n3. 查规则健康度：规则组版本、拦截统计、误报线索逐条过。\n4. 单账户跑通后，多账户治理再谈组织化铺开。\n\n**什么时候用，什么时候别用**。暴露公网的应用，WAF 加 Shield Standard 是起步线，关键业务再加 Advanced。DNS 外泄风险高的环境配 DNS 防火墙。纯内网无公网入口的应用，别为内网流量买边界防护。代价句：防护是分层不是叠罗汉——每层管一跳，重复管同一跳只加延迟不加安全；规则要看拦截统计，零命中规则先查失效再留着。\n\n💡 **场景举例**（虚构教学示意）：Northwind 季度网络审计发现：WAF 挂在两个 CloudFront 分配上，但 SQL 注入特征规则全年零命中。查下来是规则被改版绕过，更新规则集当周拦截恢复。DNS 防火墙拦掉一条可疑隧道域名。Shield Standard 覆盖账单确认免费。\n\n**关联服务**：Route 53 Resolver DNS Firewall、AWS WAF（Web ACL、规则组）、AWS Shield（Standard 与 Advanced）、AWS Network Firewall（规则组）、Amazon CloudFront（WAF 挂载）、Elastic Load Balancing（WAF 挂载）。\n\n#### 优化网络架构成本\n\n> 官方原名：Optimize the cost of network architectures.\n\n**这条在问什么。** 考题给你「数据传输费、NAT 处理费占账单大头」这类场景，考你网络费用的优化路径。\n\n**定义**：网络成本的三块大头：\n\n1. 数据传输费：同区域内跨可用区双向计费，跨区域更贵，出互联网最贵，同可用区免费。\n2. NAT 网关费：每小时处理费加每 GB 数据费。\n3. 入口服务流量成本：分发与回源的费用，边缘分发省的是源站压力与跨区流量。\n\n**怎么运作**。优化路径对号入座：\n\n1. 同区亲和：数据库与计算放同可用区，跨区流量归零。\n2. 端点替代 NAT：S3 与 DynamoDB 流量改网关型端点，绕开 NAT 的数据费。\n3. 边缘分发：跨区域用户走 CloudFront 就近取，回源与跨区流量都降。\n4. NAT 按等级配：小业务单 NAT 起步，高可用再上多 NAT。\n5. 盯账单流向：用 Cost Explorer 按服务维度看数据传输费去了哪。\n\n**什么时候用，什么时候别用**。高可用架构天然吃跨区流量费，别为省钱拆高可用——按业务等级划线，该花的花。多区域多活架构的流量费是结构性的，微优化解决不了，要么收需求要么认成本。代价句：省流量的动作要防「把成本转嫁成延迟」——拆开跨区链路省钱，响应慢了业务更糟；优化前后用压测对比说话。\n\n💡 **场景举例**（虚构教学示意）：Northwind 网络费用占账单 15%。三招下去：S3 流量走网关端点、报表库与计算组挪进同可用区、海外用户改 CloudFront 分发。两月后网络费用降到 6%，延迟指标持平。\n\n**关联服务**：Amazon VPC（NAT 网关、网关端点、可用区布局）、Amazon CloudFront（边缘分发）、AWS Cost Explorer（费用流向）、Amazon S3。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「安全组和网络 ACL 一样」 | 一个有状态实例级只能放行，一个无状态子网级可拒绝 |\n| 2 | 「NAT 网关能让实例被访问」 | NAT 只出不进；入网走 IGW 与公有子网 |\n| 3 | 「对等连接能传递」 | A 连 B、B 连 C，A 到不了 C；多 VPC 上中转网关 |\n| 4 | 「S3 访问要走公网」 | 网关型端点走内网，还省 NAT 数据费 |\n| 5 | 「四个防护服务功能重叠」 | 各管一跳：DNS、应用、洪泛、边界互不替代 |\n| 6 | 「跨区流量费省不了」 | 同区免费、端点绕 NAT、边缘分发三招先上 |\n\n#### 记忆要点\n\n1. **公有私有分工**：公有子网放入口、私有子网放业务，出网走 NAT 只出不进。\n2. **两层防火墙**：安全组有状态实例级，网络 ACL 无状态子网级。\n3. **私连三条路**：端点连服务、对等连 VPC、PrivateLink 连第三方。\n4. **对等不可传递**：三个以上 VPC 用中转网关组星型。\n5. **防护四站位**：DNS 防火墙管解析、WAF 管应用、Shield 管洪泛、网络防火墙管边界。\n6. **省网费三招**：同区亲和、端点绕 NAT、边缘分发。\n\n---"},{"h":"配置域名、DNS 服务与内容分发","body":"#### 这一节学什么\n这一节对应考纲任务 5.2「配置域名、DNS 服务与内容分发」。\n\n> 官方原名：Configure domains, DNS services, and content delivery.\n\n三个技能点一个管「域名怎么解析」（混合环境的 Resolver）、一个管「解析到哪个地址」（路由策略与查询日志）、一个管「内容怎么送到用户跟前」（分发网络）。主线是：解析对 → 策略准 → 分发快。\n\n#### 配置 DNS（Route 53 Resolver）\n\n> 官方原名：Configure DNS (for example, Route 53 Resolver).\n\n**这条在问什么。** 考题给你「VPC 里的实例要解析公司内部域名」「本地机房域名要在云里也能用」这类场景，考你 Route 53 Resolver 的混合解析配置。\n\n**定义**：Route 53 有两副面孔。公有托管区（public hosted zone）管公网域名的权威解析。Route 53 Resolver 是 VPC 内置的递归解析器，默认只答公网与 AWS 内部的问题——公司内部域名它不认识。混合场景靠 Resolver 的两个方向组件：\n\n- 入站端点（inbound endpoint）：让本地机房的 DNS 把查询转进 VPC，解析 AWS 侧的私有记录。\n- 出站端点（outbound endpoint）加转发规则（forwarding rule）：把 VPC 里对「公司内部域名」的查询转发给本地 DNS。\n\n**怎么运作**。混合解析的配置路径：\n\n1. 建出站端点：绑定两个可用区的弹性网卡。\n2. 建转发规则：域名后缀（如 corp.northwind.internal.）指向本地 DNS 的 IP。\n3. 规则关联到 VPC，实例查该后缀就走这条转发。\n4. 反向需求建入站端点，让本地 DNS 能查进 AWS 私有域。\n\n**什么时候用，什么时候别用**。纯云环境用默认 Resolver 就够，公网与 VPC 私有域名它都答。混合环境（云里要解析本地私有域）才需要端点与转发规则。两个 VPC 互查私有域，对等连接加 DNS 解析选项就够，不必建端点。代价句：端点每可用区一张网卡按小时计费；转发规则的后缀写宽了，不该转发的查询也被送出去，解析变慢甚至失败。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的 VPC 实例要访问本地机房的内部仓库系统（域名 corp.northwind.internal）。出站端点加转发规则把该后缀的查询送回本地 DNS，云端实例直接用内部域名访问，一行代码没改。\n\n**关联服务**：Amazon Route 53（公有托管区、Resolver 入站与出站端点、转发规则）、Amazon VPC（对等连接 DNS 解析）、AWS Site-to-Site VPN（混合链路）。\n\n#### 实施 Route 53 路由策略、配置与查询日志\n\n> 官方原名：Implement Route 53 routing policies, configurations, and query logging.\n\n**这条在问什么。** 考题给你「域名要按健康状态切、按地域分、按延迟选」这类需求，考你路由策略选型与查询日志配置。\n\n**定义**：路由策略（routing policy）是「一个名字多个答案怎么给」的规则：\n\n- 简单：一个名字一个地址，最常用。\n- 故障转移：主备两个答案，主的健康检查失败切备。\n- 地理位置：按用户所在地返回不同答案。\n- 延迟：按延迟最优的区域返回答案。\n- 加权：按权重分配答案，灰度与压测用。\n- 多值应答：返回多个健康地址，客户端自选。\n\n查询日志（query logging）把「谁查了什么、结果是什么」落到 CloudWatch Logs，排障与审计两用。\n\n**怎么运作**。选型对号入座：\n\n1. 主备容灾选故障转移，主记录挂健康检查。\n2. 全球多区域选延迟或地理位置——地理按「人在哪」分（合规与本地化），延迟按「哪边快」分（性能）。\n3. 新旧版本灰度选加权。\n4. 托管区关联日志组，解析记录可审计。\n\n一条查询日志的配置：\n\n```bash\naws route53 create-query-logging-config \\\n  --hosted-zone-id ZNW123 \\\n  --cloud-watch-logs-log-group-arn arn:aws:logs:us-east-1:123456789012:log-group:/route53/nw-prod\n```\n\n**什么时候用，什么时候别用**。容灾切换用故障转移策略。A/B 灰度用加权——但加权是 DNS 层的慢速灰度，客户端有缓存。要秒级切走流量，交给负载均衡器或加速器，别指望 DNS。代价句：DNS 切换速度受客户端缓存影响——TTL 设短切得快，但解析压力随之升高。健康检查配严了会误切，配松了切不动，阈值要按业务基线定。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的门户域名配故障转移：主记录指向美东应用栈并挂健康检查，备记录指向温备区域。一次区域级故障时健康检查转红，应答自动切到备端点，配合短 TTL 几分钟内完成迁移。查询日志留下一页审计证据：切换前后的应答变化逐条可查。\n\n**关联服务**：Amazon Route 53（路由策略、健康检查、查询日志）、Amazon CloudWatch Logs。\n\n#### 配置内容与服务分发\n\n> 官方原名：Configure content and service distribution (for example, CloudFront, AWS Global Accelerator).\n\n**这条在问什么。** 考题给你「用户分布全球、源站被打爆」「TCP 服务要就近接入、入口要固定 IP」这类需求，考你两个分发服务的选型与配置。\n\n**定义**：两个分发服务定位不同：\n\n- Amazon CloudFront：内容分发网络（CDN），把 HTTP 内容缓存在全球边缘节点就近返回。静态缓存、动态透传、源站卸载都归它。\n- AWS Global Accelerator：网络加速器。任播指同一个 IP 挂在多地边缘，用户自动接入最近处——流量从最近的边缘进入 AWS 全球骨干，直达区域内的端点。没有缓存，纯路径优化。\n\n**怎么运作**。配置要点：\n\n1. CloudFront 的分配（distribution）定义源站，缓存行为（cache behavior）定义 TTL 与缓存键，回源协议是调优核心。\n2. Global Accelerator 的加速器给两个静态 IP 当入口，端点组（endpoint group）挂区域内目标，流量拨转（traffic dial）按比例切换。\n3. 选型一句话：HTTP 内容与缓存选 CloudFront，非 HTTP 的 TCP 与 UDP 加速选 Global Accelerator。\n\n**什么时候用，什么时候别用**。要缓存内容与边缘 TLS，CloudFront。要静态入口 IP、跨区域 TCP 加速、健康检查秒切，Global Accelerator。单区域用户、源站没压力的应用直接负载均衡器就够。代价句：CDN 的缓存是把双刃剑——命中率高省源站，失效策略没配好就是「改了内容用户看到的还是旧的」。发布流程要与缓存失效联动，缓存排障那条技能点细讲。加速器转发全流量计费，固定 IP 的便利按 GB 结账。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的海外司机端 App 拉地图瓦片与订单页。地图瓦片走 CloudFront 边缘缓存，App 的 TCP 长连接服务走 Global Accelerator 的固定 IP 入口——防火墙白名单好配。上线后海外端响应时间降六成，源站负载降一半。\n\n**关联服务**：Amazon CloudFront（分配、缓存行为）、AWS Global Accelerator（任播入口、端点组、流量拨转）、Elastic Load Balancing（源站与端点）、Amazon S3（源站）、Amazon Route 53（域名接入）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「Resolver 默认能解析公司内网域名」 | 默认只答公网与 AWS 内部，私有域要靠转发规则 |\n| 2 | 「地理位置和延迟策略一样」 | 地理按「人在哪」，延迟按「哪边快」 |\n| 3 | 「DNS 切换瞬间生效」 | 受客户端缓存影响，TTL 决定切换速度 |\n| 4 | 「CloudFront 和 GA 互相替代」 | 一个管内容缓存，一个管路径加速 |\n| 5 | 「缓存命中越高越好」 | 失效策略没配好，「改了看不到」就是事故 |\n| 6 | 「查询日志只是排障用」 | 审计与合规留痕同样靠它 |\n\n#### 记忆要点\n\n1. **Resolver 双端点**：出站转发私有域进本地，入站让本地查进来。\n2. **策略六式**：简单、故障转移、地理、延迟、加权、多值，各配各的场。\n3. **切换速度看 TTL**：秒级切换交给加速器或负载均衡，别指望 DNS。\n4. **查询日志落 CloudWatch**：解析排障与审计的第一手。\n5. **HTTP 缓存找 CloudFront**：TCP 加速找 Global Accelerator。\n6. **缓存与发布联动**：失效策略没配好，新内容出不去。\n\n---"},{"h":"排障网络连接问题","body":"#### 这一节学什么\n这一节对应考纲任务 5.3「排障网络连接问题」。\n\n> 官方原名：Troubleshoot network connectivity issues.\n\n五个技能点全是排障：VPC 配置逐层查、网络日志逐份读、缓存问题对症状、混合连接分段测、监控指标配齐看。主线是：分层查 → 看日志 → 分段测 → 监控兜底。\n\n#### 排障 VPC 配置\n\n> 官方原名：Troubleshoot VPC configurations (for example, subnets, route tables, network ACLs, security groups, transit gateways, NAT gateways).\n\n**这条在问什么。** 考题给你「实例互相 ping 不通」「上不了外网」「过中转网关就断」这类故障，考你 VPC 逐层排障。\n\n**定义**：VPC 排障的心法是「沿着包的路径查」。一个包从源到目的地要过五道关卡：源安全组出站、目标安全组入站、子网路由表、两端网络 ACL、网关。断在哪关查哪关。\n\n**怎么运作**。五道关卡的排查要点：\n\n1. 安全组：源侧出站与目标侧入站都要放行，有状态回包自动记着。\n2. 路由表：子网关联的路由表要有到目标网段的路。本地 VPC 流量走隐含路由，跨 VPC 看对等或中转路由两边都配了没有。\n3. 网络 ACL：无状态、进出独立计数——回包方向也要单独放行，这是与安全组最大的差别。\n4. 网关：出网查 NAT 三件套（NAT 在公有子网、绑了弹性 IP、路由表指向它）；跨 VPC 查对等连接或中转网关附件。\n5. 解析：IP 通而域名不通，是解析问题不是路由问题，转 DNS 解析路径排查（任务 5.2 的 Resolver 部分）。\n\n**排障判据**。「实例连不上」按序排查：\n\n1. 先测目标 IP：超时多半路由或安全组问题，收到拒绝多半 ACL 或目标没监听。\n2. 查两侧安全组的出站与入站规则。\n3. 查子网路由表的目标网段路由。\n4. 查两端 ACL 的进出规则，回包方向别漏。\n5. 跨网关场景逐跳查：NAT 三件套、中转网关两侧路由表都指向 TGW。\n6. 不想发真实流量验证，用 Reachability Analyzer（连通性分析器）做静态路径分析，哪一跳被拒逐条列出。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的队列机突然连不上报表库。分层查：两侧安全组都放行了端口，路由表也有对等网段路由——最后卡在网络 ACL：新加的拒绝规则挡了回包方向，无状态、回包不算「记住」。补一条回包放行，两分钟恢复。\n\n**什么时候用，什么时候别用**。配置类故障（连不通、被拒）用五关卡分层法，快而准。静态验证多规则组合，用 Reachability Analyzer 不发真实流量就出结论。瞬时抖动类故障配置没坏、链路在抖，分层法查不出东西——转指标与日志看时间线。代价句：分层法看的是当前配置，改过又改回的故障现场会消失，历史要靠 CloudTrail 变更记录回看。\n\n**关联服务**：Amazon VPC（安全组、网络 ACL、路由表、Reachability Analyzer、流日志）、Elastic IP、AWS Transit Gateway。\n\n#### 收集与解读网络日志排障\n\n> 官方原名：Collect and interpret networking logs to troubleshoot issues (for example, VPC flow logs, ELB access logs, AWS WAF web ACL logs, CloudFront logs, container logs).\n\n**这条在问什么。** 考题给你「日志都有但看不出哪断了」这类场景，考你每份日志管哪一段路径、字段怎么读。\n\n**定义**：网络日志按「流量路径」站位，一份管一跳：\n\n- VPC 流日志（VPC Flow Logs）：网卡级的流记录——源与目的、协议端口、字节数、ACCEPT 或 REJECT。管「VPC 这一跳」。\n- ELB 访问日志：每个请求一条——客户端、目标、响应码与延迟。管「负载均衡这一跳」。\n- WAF 日志（web ACL logs）：每个被检请求的判定——哪条规则、放行还是拦截。管「应用层过滤这一跳」。\n- CloudFront 日志：边缘请求记录——缓存命中、回源、边缘位置。管「边缘这一跳」。\n- 容器日志：容器网络的连接与路由记录。管「容器这一跳」。\n\n**怎么运作**。读日志的路径法：\n\n1. 先定位断在哪一段：客户端 → 边缘 → 负载均衡 → 目标，按段分包。\n2. 每段读对应日志：边缘看 CloudFront 的命中与回源，入口看 ELB 的响应码，VPC 内看流日志的 ACCEPT 与 REJECT。\n3. 日志先开再排障：故障是瞬时的，事后没日志就没现场。\n\n**排障判据**。「日志怎么读」按序排查：\n\n1. 流日志的 REJECT 行——端口与地址直接对上安全组或 ACL 的规则位。\n2. ELB 日志的 4xx 看客户端侧，5xx 看目标侧的健康与超时。\n3. WAF 日志的拦截行——规则名直接给出拦截原因。\n4. CloudFront 日志的缓存字段——区分「边缘命中」与「回源」，慢在哪一段。\n\n**什么时候用，什么时候别用**。日志要开在日常，不是出事才开。高频流日志全量实时写，费用可观——投递目标与字段按量权衡，S3 批量投递比实时便宜。代价句：流日志告诉你「包被拒」，不告诉你「哪条规则拒的」——规则位要自己对。日志量大的账户先聚合再查，逐条翻页等于没有日志。\n\n💡 **场景举例**（虚构教学示意）：Northwind 一次「客户端偶发超时」。三份日志拼出真相：ELB 日志显示目标响应时间波动，流日志显示同一目标偶发 REJECT，CloudFront 日志排除边缘段。CloudTrail 溯源发现是安全组规则被变更后没同步——恢复规则，超时消失。\n\n**关联服务**：VPC Flow Logs、Elastic Load Balancing（访问日志）、AWS WAF（web ACL 日志）、Amazon CloudFront（标准日志）、Amazon ECS 与 Amazon EKS（容器日志）、Amazon S3 与 Amazon CloudWatch Logs（日志落地）、AWS CloudTrail（变更溯源）。\n\n#### 识别与修复 CloudFront 缓存问题\n\n> 官方原名：Identify and remediate CloudFront caching issues.\n\n**这条在问什么。** 考题给你「改了内容用户看到的还是旧的」「该缓存的不缓存、回源打爆源站」这类故障，考你缓存问题的定位与修复。\n\n**定义**：缓存问题两种形态：**该命中没命中**——回源暴涨、源站压力大；**该失效没失效**——用户看到旧内容。两者的根因都指向缓存键与 TTL 的配置。\n\n**怎么运作**。两种形态的定位路径：\n\n1. 命中率掉：看日志的命中字段与缓存键配置。键里带了不该带的动态值（查询串、Cookie、头部全量转发），同一内容被拆成上千个缓存条目，命中自然掉。\n2. 旧内容下不去：看 TTL 与源站缓存头。TTL 没到期，边缘不回源；源站返回的 Cache-Control 头与分配设置的优先关系要分清。\n3. 修复动作：失效请求（invalidation）应急清旧；治本靠版本化地址或正确的 Cache-Control 头。\n\n**排障判据**。「内容更新不生效」按序排查：\n\n1. 先确认边缘拿到新内容没有：日志看回源时间与命中状态。\n2. 命中了但内容是旧：TTL 没到，对目标路径发一次失效请求。\n3. 没命中还慢：查回源路径与源站健康（回源协议、源站响应时间）。\n4. 反复出现旧内容：发布流程与缓存没联动，上版本化地址治本。\n\n**什么时候用，什么时候别用**。应急清缓存用失效请求——它按路径数计费，只对必要路径用。全站失效像大锤：频繁全量失效等于没有缓存层。治本用版本化：内容变了地址就变，缓存层永远不用清。代价句：失效是「清旧等新」，清掉的那阵子回源压力全压回源站；版本化要改发布系统，一劳永逸但先要动流程。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的活动页面上线后用户看到的还是旧价格。排查：页面 TTL 一天、发布没做失效。应急对活动页路径发一次失效，五分钟生效。治本改为页面地址带版本号——发布即新地址，缓存层从此不用管更新。\n\n**关联服务**：Amazon CloudFront（失效请求、缓存键、TTL、日志）、Amazon S3（源站、Cache-Control 头）。\n\n#### 识别与排障混合连接与私有连接问题\n\n> 官方原名：Identify and troubleshoot hybrid connectivity issues and private connectivity issues.\n\n**这条在问什么。** 考题给你「VPN 时通时断」「端点访问被拒」这类故障，考你混合链路与私有连接的分段排障。\n\n**定义**：混合连接指本地机房到 AWS 的链路（Site-to-Site VPN 这类，专线链路同理分段）。私有连接指 VPC 内的私有通道（端点、PrivateLink、对等连接）。排障心法一致：分段测，断在哪段修哪段。\n\n**怎么运作**。混合链路分四段：\n\n1. 本地段：本地网关到运营商的会话状态，路由宣告有没有发出去。\n2. 隧道段：Site-to-Site VPN 的双隧道状态——单条隧道断业务无感，两条都断才失联。\n3. 云端段：虚拟私有网关或中转网关上的路由传播，本地网段有没有学进来。\n4. 安全段：两端的安全组与网络设备对隧道流量的放行。\n\n私有连接分三段：\n\n1. 端点段：接口端点的安全组与端点策略——安全组没放行调用方、策略限了资源范围，都会拒。\n2. 对等段：两侧路由表都配了对方网段没有，安全组有没有引用对端。\n3. 解析段：PrivateLink 场景的服务名解析到的是不是端点地址。\n\n**排障判据**。「混合链路断」按序排查：\n\n1. 先看隧道与会话状态——状态红的那条就是断点。\n2. 本地路由宣告覆盖目的地网段没有。\n3. 云端路由表学到本地网段没有。\n4. 两端防火墙规则对隧道流量放行没有。\n\n「私有连接拒」按序排查：\n\n1. 先测端点地址，分清「网络不通」还是「权限被拒」。\n2. 网络通而被拒：查端点安全组与端点策略。\n3. 私有域解析错位：查私有托管区的解析记录。\n\n💡 **场景举例**（虚构教学示意）：Northwind 的仓库同步夜里断流。分段查：隧道状态绿、会话正常，本地路由宣告里没有新仓库网段——本地工程师补上宣告，十分钟后流量恢复，云端一行没改。\n\n**什么时候用，什么时候别用**。链路级断流（整段不通）用分段测逐段定位。偶发丢包与时延抖动这类软故障，分段测查不到断点，看指标与日志的时间线。代价句：分段测要本地与云端两头配合，跨团队排障先约好人，不然「我这边正常」来回踢皮球。\n\n**关联服务**：AWS Site-to-Site VPN（双隧道、BGP 会话）、AWS Transit Gateway（路由传播）、Amazon VPC（对等、端点、PrivateLink）、Amazon Route 53（私有托管区解析）。\n\n#### 配置与分析 CloudWatch 网络监控\n\n> 官方原名：Configure and analyze CloudWatch network monitoring services.\n\n**这条在问什么。** 考题给你「网络要有持续监控、故障要有指标证据」这类需求，考你 CloudWatch 侧网络监控的配置与读数。\n\n**定义**：CloudWatch 网络监控一族三块：\n\n1. 流日志指标化：流日志投 CloudWatch Logs，指标筛选器（metric filter）把 REJECT 计数变成指标。\n2. 网络组件指标：NAT 网关的吞吐与连接数、负载均衡的目标延迟、中转网关的附件流量。\n3. 告警联动：阈值越线进 SNS 通知值班。\n\n**怎么运作**。配置路径：\n\n1. 流日志开启并选定投递目标，指标筛选器把拒绝数与字节数变成指标。\n2. 网络组件挑关键指标：NAT 的端口分配错误与丢弃计数、负载均衡的目标延迟、中转网关的附件流量。\n3. 告警挂上：REJECT 突增、吞吐接近基线、隧道状态变化都进 SNS。\n4. 仪表盘拼三层：入口、内部、出口流量一屏看全。\n\n**排障判据**。「用指标排障」按序读数：\n\n1. 吞吐突降先看 NAT 指标——端口分配错误或丢弃计数突增就是瓶颈位。\n2. 目标延迟升看负载均衡的目标侧指标——健康状态与连接拒绝。\n3. REJECT 指标突增，对流日志找具体规则位。\n4. 隧道状态指标变红，转混合链路的分段排查。\n\n**什么时候用，什么时候别用**。持续观测用指标与告警，一次性深挖用日志。指标是聚合值——「发现问题」靠指标，「定位到谁」靠日志，两者配合用。代价句：全量流日志全字段实时投递费用可观，字段与投递目标按需取舍；告警阈值按业务基线调，拿默认值上线会被噪音淹没。\n\n💡 **场景举例**（虚构教学示意）：Northwind 给网络拼了三层监控：入口看负载均衡延迟、内部看流日志拒绝指标、出口看 NAT 吞吐。一次凌晨告警：拒绝指标五倍突增，流日志定位到新 ACL 规则挡了定时任务的回包。指标比用户反馈早到两个小时，修完用户还没察觉。\n\n**关联服务**：Amazon CloudWatch（指标、告警、指标筛选器）、VPC Flow Logs、Elastic Load Balancing（指标）、AWS Transit Gateway（指标）、Amazon SNS（告警通知）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「ping 不通就是 ACL 拦了」 | 逐层查：路由、安全组、ACL、网关各有各的拒法 |\n| 2 | 「网络 ACL 会记住回包」 | 无状态，回包方向要单独放行 |\n| 3 | 「流日志会告诉你哪条规则拒的」 | 它只记「被拒」，规则位要自己对 |\n| 4 | 「全站失效是常规操作」 | 失效按路径计费，治本靠版本化地址 |\n| 5 | 「单条隧道断业务就断」 | 双隧道设计下单条断无感，看监控确认 |\n| 6 | 「指标能定位到具体连接」 | 指标聚合发现问题，日志定位个体 |\n\n#### 记忆要点\n\n1. **五道关卡**：安全组、路由、ACL、网关、解析，断哪关查哪关。\n2. **超时与拒绝**：超时查路由与安全组，拒绝查 ACL 与目标监听。\n3. **日志按跳站位**：流日志、ELB、WAF、CloudFront 各管一段路径。\n4. **REJECT 直接指路**：流日志的拒绝行是 VPC 排障第一手。\n5. **缓存两形态**：该命中没命中查缓存键，旧内容查 TTL 与失效。\n6. **混合分段测**：本地段、隧道段、云端段、安全段，状态红的就是断点。\n\n---"}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 5.1.1 | VPC 组件与三层结构 | ⭐⭐⭐ | 情景单选/多选 |\n| 5.1.2 | 私有连接三条路选型 | ⭐⭐⭐ | 情景单选 |\n| 5.1.3 | 网络防护服务四站位 | ⭐⭐ | 情景单选/多选 |\n| 5.1.4 | 网络成本优化路径 | ⭐⭐ | 情景单选 |\n| 5.2.1 | Resolver 混合解析 | ⭐⭐ | 情景单选 |\n| 5.2.2 | 路由策略六式与查询日志 | ⭐⭐⭐ | 情景单选 |\n| 5.2.3 | CloudFront 与 Global Accelerator 选型 | ⭐⭐⭐ | 情景单选 |\n| 5.3.1 | VPC 分层排障 | ⭐⭐⭐ | 排障情景题 |\n| 5.3.2 | 网络日志逐跳解读 | ⭐⭐⭐ | 排障情景题 |\n| 5.3.3 | CloudFront 缓存排障 | ⭐⭐ | 排障情景题 |\n| 5.3.4 | 混合与私有连接分段排障 | ⭐⭐⭐ | 排障情景题 |\n| 5.3.5 | CloudWatch 网络监控 | ⭐⭐ | 情景单选 |","services":"| 服务 | 主要用途 | 涉及知识点 |\n|---|---|---|\n| Amazon VPC（子网、路由表、安全组、网络 ACL、IGW、NAT 网关、仅出站网关、对等连接、VPC 端点、Transit Gateway、流日志、Reachability Analyzer） | 网络底座与排障 | 5.1.1、5.1.2、5.1.4、5.3.1、5.3.2、5.3.4 |\n| AWS PrivateLink | 私有服务暴露 | 5.1.2、5.3.4 |\n| Route 53 Resolver DNS Firewall | DNS 层防护 | 5.1.3 |\n| AWS WAF（Web ACL、规则组） | 应用层过滤 | 5.1.3、5.3.2 |\n| AWS Shield（Standard、Advanced） | DDoS 防护 | 5.1.3 |\n| AWS Network Firewall（规则组） | VPC 边界防护 | 5.1.3 |\n| AWS Cost Explorer | 网络费用分析 | 5.1.4 |\n| Amazon Route 53（托管区、Resolver 端点与转发规则、路由策略、健康检查、查询日志、私有托管区） | DNS、故障转移与混合解析 | 5.1.3、5.2.1、5.2.2、5.3.4 |\n| Amazon CloudFront（分配、缓存行为、失效请求、日志） | 内容分发与缓存排障 | 5.1.3、5.1.4、5.2.3、5.3.3 |\n| AWS Global Accelerator（任播入口、端点组、流量拨转） | TCP 加速与固定入口 | 5.2.3 |\n| Elastic Load Balancing（访问日志、健康检查、指标） | 入口与日志 | 5.1.1、5.2.3、5.3.2、5.3.5 |\n| Amazon CloudWatch（指标、告警、指标筛选器） | 网络监控 | 5.3.2、5.3.5 |\n| Amazon CloudWatch Logs | 查询日志与流日志落地 | 5.2.2、5.3.2 |\n| AWS Site-to-Site VPN（双隧道、BGP 会话） | 混合连接 | 5.3.4 |\n| Amazon S3（源站、日志投递、网关端点） | 存储与日志落地 | 5.1.2、5.1.4、5.2.3、5.3.2 |\n| Amazon SNS | 告警通知 | 5.3.5 |\n| Amazon ECS、Amazon EKS | 容器网络日志 | 5.3.2 |\n| AWS CloudTrail | 变更溯源 | 5.3.2 |\n| Amazon DynamoDB | 网关端点对象 | 5.1.2 |","furtherReading":"- 本域官方页（权威口径）：https://docs.aws.amazon.com/aws-certification/latest/sysops-administrator-associate-03/sysops-administrator-associate-03-domain5.html\n- Exam Guide 主页：https://docs.aws.amazon.com/aws-certification/latest/sysops-administrator-associate-03/sysops-administrator-associate-03.html\n- 考试范围内服务清单：https://docs.aws.amazon.com/aws-certification/latest/sysops-administrator-associate-03/soa-03-in-scope-services.html"}}]};
const QUIZ_TOTAL = 100;

<script>
(function(){
'use strict';
const DATA = (typeof LEARNING_DATA !== 'undefined' && LEARNING_DATA) ? LEARNING_DATA : null;

// R5: meta.footerNote overrides default footer (AWS default kept when absent)
if (DATA && DATA.meta && DATA.meta.footerNote) {
  var fn = document.getElementById('footNote');
  if (fn) { fn.textContent = DATA.meta.footerNote; }
}

/* ============ 常量与工具 ============ */
const EXAM = DATA ? (DATA.meta.exam || 'CERT').toLowerCase() : 'cert';   // clf-c02
const STORE_KEY = EXAM + '-v2';                                          // 进度键：clf-c02-v2
const COLORS = ['#4f46e5','#7c3aed','#9333ea','#a855f7'];                // 每章主题色（N 章 N 色，N>4 循环）
const home = document.getElementById('home');
const chapBox = document.getElementById('chapters');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function imgSrcOk(src){ return /^(?:[\w.-]+\/)*[\w.-]+\.(?:png|jpe?g|webp|gif|svg)$/i.test(src); }
function inlineMd(s){
  let t = esc(s);
  t = t.replace(/\n/g,'<br>');
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t = t.replace(/!\[([^\]]*)\]\(([^()\s]+)\)/g, function(m0, alt, src){
    if(!imgSrcOk(src)) return '<span class="img-bad" title="非法图源">🖼 非法图源：'+src+'</span>';
    return '<img class="inline-img" loading="lazy" alt="'+alt.replace(/"/g,'&quot;')+'" src="'+src+'">';
  });
  return t;
}
function isTblSep(ln){ const core = ln.replace(/^\s*\|/,'').replace(/\|\s*$/,''); if(!core.includes('-')) return false; return /^[\s:\-|]+$/.test(ln) && /-/.test(ln); }
function loadProg(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveProg(p){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){} }

/* ============ 块级 md 渲染（段落/引用/表格/列表/图占位符） ============ */
function renderBlocks(seg, figs, fctr){
  fctr = fctr || {n:0};
  const lines = seg.replace(/\r/g,'').split('\n');
  let html = ''; let i = 0; const n = lines.length;
  while(i < n){
    const ln = lines[i]; const s = ln.trim();
    if(s === ''){ i++; continue; }
    const fm = s.match(/^\[\[fig:([\w-]+)\]\]$/);
    if(fm){ const f = (figs||{})[fm[1]]; if(f){ if(fctr) fctr.n++; html += figHtml(f); } i++; continue; }
    const fp = s.match(/^【图：(.+?)｜(概念图|截图)】$/);
    if(fp){ fctr.n++; html += '<div class="fig-placeholder" data-figtype="'+fp[2]+'"><span class="fp-num">图 '+fctr.n+'</span><span class="fp-type">'+fp[2]+'</span><span class="fp-alt">'+esc(fp[1])+'</span><span class="fp-note">真图待补</span></div>'; i++; continue; }
    const ib = s.match(/^!\[([^\]]*)\]\(([^()\s]+)\)$/);
    if(ib){
      const ialt = ib[1], isrc = ib[2];
      if(imgSrcOk(isrc)){ html += '<figure class="fig-img"><img loading="lazy" alt="'+ialt.replace(/"/g,'&quot;')+'" src="'+isrc+'"><figcaption>'+esc(ialt)+'</figcaption></figure>'; }
      else { html += '<div class="fig-placeholder"><span class="fp-type">非法图源</span><span class="fp-alt">'+esc(ialt)+' ← '+esc(isrc)+'</span><span class="fp-note">检查路径与扩展名</span></div>'; }
      i++; continue;
    }
    if(s.startsWith('|') && i+1 < n && isTblSep(lines[i+1].trim())){
      let rows = [];
      while(i < n && lines[i].trim().startsWith('|')){ rows.push(lines[i].trim()); i++; }
      const heads = rows[0].replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim()));
      const data = rows.slice(2).map(r => r.replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim())));
      html += '<div class="tbl-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'
        + data.map(r => '<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if(s.startsWith('>')){
      let q = [];
      while(i < n && lines[i].trim().startsWith('>')){ q.push(lines[i].replace(/^\s*>\s?/,'').trim()); i++; }
      html += '<blockquote>'+inlineMd(q.join(' '))+'</blockquote>'; continue;
    }
    if(/^[-*]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^[-*]\s+/.test(t)){ items.push(inlineMd(t.replace(/^[-*]\s+/,''))); i++; } else break; }
      html += '<ul>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; continue;
    }
    if(/^\d+[.、]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^\d+[.、]\s+/.test(t)){ items.push(inlineMd(t.replace(/^\d+[.、]\s+/,''))); i++; } else break; }
      html += '<ol>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ol>'; continue;
    }
    const hm = s.match(/^(#{1,6})\s+(.+)$/);
    if(hm){ html += '<h4 class="sec-h">'+inlineMd(hm[2])+'</h4>'; i++; continue; }
    let para = [];
    while(i < n){
      const t = lines[i].trim();
      if(t === '' || t.startsWith('|') || t.startsWith('>') || /^[-*]\s+/.test(t) || /^\d+[.、]\s+/.test(t) || /^#{1,6}\s/.test(t) || /^\[\[fig:[\w-]+\]\]$/.test(t) || /^【图：[^｜]*｜(?:概念图|截图)】$/.test(t) || /^!\[[^\]]*\]\([^()\s]+\)$/.test(t)) break;
      para.push(t); i++;
    }
    if(para.length) html += '<p>'+inlineMd(para.join(' '))+'</p>';
  }
  return html;
}

/* ===== 节内子块解析与渲染（v6）：#### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点）
   这一节学什么（旧值「本节定位」仍兼容）=弱化引言、案例/记忆要点=卡片、常见误区与易错点=警示小节——均不占编号。
   解析与渲染共用 parseSectionBlocks，保证正文 h3 与左侧目录两级条目 1:1。 ===== */
const SUB_RAW='raw', SUB_LEAD='lead', SUB_KP='kp', SUB_CASE='case', SUB_MIS='mis', SUB_MEM='mem';
function subTypeOf(title){
  if(title === '这一节学什么' || title === '本节定位') return SUB_LEAD;
  if(title === '案例') return SUB_CASE;
  if(title === '记忆要点') return SUB_MEM;
  if(title === '常见误区与易错点') return SUB_MIS;
  return SUB_KP;
}
function parseSectionBlocks(md){
  const parts = (md||'').replace(/\r/g,'').split(/\n(?=####\s)/);
  const out = [];
  parts.forEach(part=>{
    const m = part.match(/^####\s*(.+?)\s*\n([\s\S]*)$/);
    if(!m){ const t = part.trim(); if(t) out.push({ type:SUB_RAW, title:'', body:t }); return; }
    out.push({ type:subTypeOf(m[1].trim()), title:m[1].trim(), body:(m[2]||'').trim() });
  });
  return out;
}
function countKp(body){ let m=0; parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP) m++; }); return m; }
function kpListOf(body){
  const kps=[]; let m=0;
  parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP){ m++; kps.push({ m:m, title:b.title }); } });
  return kps;
}
function renderSectionBody(md, figs, d, n, fctr){
  fctr = fctr || {n:0};
  const blocks = parseSectionBlocks(md);
  let h = ''; let kp = 0;
  for(const b of blocks){
    if(b.type === SUB_RAW){ h += renderBlocks(b.body, figs, fctr); continue; }
    if(b.type === SUB_KP){
      kp++;
      h += '<h3 class="mh3" id="sec-'+d+'-'+n+'-'+kp+'"><span class="h3no">'+d+'.'+n+'.'+kp+'</span><span>'+inlineMd(b.title)+'</span></h3>'
         + renderBlocks(b.body, figs, fctr);
      continue;
    }
    if(b.type === SUB_CASE){ h += '<div class="case-card"><h4 class="sec-h">案例</h4>'+renderBlocks(b.body, figs, fctr)+'</div>'; continue; }
    if(b.type === SUB_MEM){ h += '<div class="mem-card"><h4 class="sec-h">记忆要点</h4>'+renderBlocks(b.body, figs, fctr)+'</div>'; continue; }
    h += '<h4 class="sec-h'+(b.type===SUB_LEAD?' sec-lead-h':'')+'">'+inlineMd(b.title)+'</h4>'+renderBlocks(b.body, figs, fctr);
  }
  return h;
}
function figsById(fs){ const m={}; (fs||[]).forEach(f=>{ m[f.id]=f; }); return m; }
function figHtml(f){
  return '<div class="fig-block"><div class="fig-title">'+esc(f.title)+'</div>'
    + '<div class="fig-body">'+(f.html||'')+'</div>'
    + (f.caption ? '<div class="fig-caption">'+esc(f.caption)+'</div>' : '') + '</div>';
}
