线**：StackSets 或账号工厂蓝图（blueprint）向新账号铺网络与安全基线；Control Tower 自动铺它的护栏。\n\n**考试判断**：题干「新账号开通时自动应用安全基线」→ Control Tower 账号工厂，或「Organizations 创建 + StackSets 铺基线」组合。错误项常是「手工在控制台创建并逐项配置」——规模化场景考的是自动化。\n\n#### 案例\n\n一个团队每月开 3~5 个新账号，全靠手工：建账号、配 VPC、开 CloudTrail、设密码策略——漏一次就是一条审计发现。改造成 Control Tower：账号工厂一键出号，护栏自动铺，网络走蓝图。新账号从申请到可用半天，合规项出生即满。开通流程的标准化程度，决定组织的安全下限。\n\n**为什么不能用 IAM 裸账号代替**：老做法是给每人开一个 IAM 用户再发长期密钥——密钥泄漏难发现、难轮换，账号一多就无人能管。自动化开通的隐含前提是「人用角色进账号，账号里不留长期用户」，这一条也是角色代入节（2.2.4）集中管理的前置。\n\n**关联服务**：AWS Control Tower（Account Factory）、AWS Organizations、AWS CloudFormation StackSets、AWS Service Catalog。\n\n#### 创建、整合并集中管理账号（Organizations / Control Tower）\n\n**这条在问什么**：两个服务怎么分工、怎么选。Organizations 是底座，Control Tower 是站在底座上的治理层。\n\n**定义**：\n\n- **AWS Organizations**：把多个账号收进一个组织，按 OU 归组，统一计费、统一挂 SCP、支持服务管理 StackSets 与可信访问。只给结构，不管内容。\n- **AWS Control Tower**：基于 Organizations 的托管治理服务——开箱给组织结构（预置日志与安全账号）、持续护栏（guardrail）、账号工厂。\n\n**机制**：Control Tower 的护栏两类要分清：\n\n- **预防式护栏**：本质是预置 SCP——直接禁止动作，如「关掉加密就不让建桶」。\n- **检测式护栏**：本质是预置 Config 规则——事后发现违规并告警。\n\n**组织动作的一个细节**：把账号从一个 OU 挪到另一个 OU，会即时改变它吃到的 SCP 与护栏——移动前先核对目标 OU 的策略，比事后救火省事。\n\n**取舍口吻**：只有几个账号、治理靠自觉 → Organizations 够用；几十个账号、要开箱护栏与账号工厂 → Control Tower。一个高发误区：已有 Organizations 的组织接入 Control Tower，护栏只覆盖注册进来的 OU——存量 OU 要逐个注册，不是接入即全量生效。考试给「既有组织要统一护栏」的场景，正解要含「注册 OU」这一步。\n\n#### 案例\n\n一个公司用 Organizations 管了 40 个账号，治理全靠文档约定，审计年年提意见。上 Control Tower：搭好落地环境（landing zone），把存量 OU 逐个注册——注册完成的 OU 立刻吃上护栏；漏注册的 OU 依然有裸奔账号。注册清单核对完整，才敢在审计报告里写「全覆盖」。工具上得再好，覆盖不全是白上。\n\n**关联服务**：AWS Organizations、AWS Control Tower、AWS Config、AWS CloudTrail。\n\n#### 多账号与复杂组织下的 IAM 方案（SCP、角色代入）\n\n**这条在问什么**：跨账号访问怎么做、组织级权限上限怎么划。SCP 与角色代入（assume role）是两条必须分清的线。\n\n**定义**：\n\n- **SCP（Service Control Policy）**：组织级权限护栏——声明「这个 OU 或账号里谁都不能做什么」。它不授予权限，只划上限；账号内 IAM 给得再全，SCP 没放行照样被拒。\n- **角色代入（assume role）**：跨账号访问的标准路径——A 账号的角色信任 B 账号的身份，B 的主体临时拿到 A 的角色权限。\n\n**机制**：两者关系一句话：SCP 定边界，代入给通路。常见组合：\n\n- **集中管理**：管理员在安全账号代入各目标账号的管理角色，目标账号不存任何长期 IAM 用户。\n- **SCP 划底线**：根 OU 挂基线 SCP（如禁止信任组织外的角色、强制区域白名单），各 OU 再叠加更严的。\n- **权限链排查**：代入链路上每一跳都要两侧 IAM 与沿途 SCP 同时放行——「SCP 放行了但目标角色不信任你」「角色信任了但 SCP 拦了」都是高频故障。\n\n**考试判断**：「禁止所有账号用某服务」→ SCP 挂根 OU；「运维从工具账号访问生产账号」→ 角色代入；「IAM 策略给了还是被拒」→ 先查沿途 SCP。\n\n#### 案例\n\n一个组织的运维从安全账号代入生产账号角色做变更，某天突然被拒。IAM 谁都没改——最后查到是新挂的 OU 级 SCP 禁了一个依赖服务。排查顺序固定：目标角色信任对不对 → 调用方 IAM 有没有 sts:AssumeRole → 沿途 SCP 有没有拦。三层各查一次，比乱猜快。\n\n**关联服务**：AWS IAM、AWS Organizations（SCP）、AWS STS。\n\n#### 规模化落地治理与安全控制\n\n**这条在问什么**：几十个账号的安全与合规怎么集中管。给一个威胁或合规场景，选对治理服务组合。\n\n**定义**：四个常混的服务各管一段：\n\n- **AWS Security Hub**：聚合——把各账号的安全发现（findings）汇成一个面板，统一评分与合规对照。\n- **Amazon GuardDuty**：威胁检测——分析 CloudTrail、VPC 流量与 DNS 日志，发现异常行为（异常 API 调用、疑似挖矿）。\n- **Amazon Detective**：深入调查——GuardDuty 报警后，用图分析回溯「谁、从哪、动了什么」。\n- **AWS Config**：资源合规——配置快照与规则评估，答「资源配置符不符合规矩」。\n\n**机制**：治理分层设计：预防层（SCP、Control Tower 预防护栏）挡住大部分违规；检测层（GuardDuty、Config 规则、检测式护栏）抓漏网的；聚合层（Security Hub）把发现统一进面板；调查层（Detective）接手复杂事件。\n\n**考试判断**：「集中看所有账号的安全状态」→ Security Hub；「发现账号出现异常行为」→ GuardDuty；「报警之后要还原攻击路径」→ Detective。\n\n#### 案例\n\n一个组织 50 个账号，GuardDuty 在某开发账号报「异常的 EC2 实例启动」（疑似挖矿）。处理链：Control Tower 检测式护栏已先报「实例类型越界」；Security Hub 聚合两边发现；安全团队进 Detective 还原访问来源——一个失陷的访问密钥。收尾把密钥轮换要求写进 SCP。检测、聚合、调查三层各干各的活，混用名字就选错答案。\n\n**关联服务**：AWS Security Hub、Amazon GuardDuty、Amazon Detective、AWS Config、AWS Control Tower。\n\n---"},{"h":"为复杂任务与大规模环境设计自动化方案（Design and build automated solutions for complex tasks and large-scale environments.）","body":"#### 这一节学什么\n这一节对应考纲任务 2.3「为复杂任务与大规模环境设计自动化方案（Design and build automated solutions for complex tasks and large-scale environments.）」。\n\n> 官方原名：Design and build automated solutions for complex tasks and large-scale environments.\n> 本任务 6 条（Knowledge 2 / Skill 4）。两条 Knowledge 按域骨架规则并入：自动化服务与方案并入用 Lambda 开发复杂场景自动化节（2.3.4）；与软件定义基础设施交互的方法并入自动化清单配置与补丁节（2.3.3）。\n\n**任务综述**：这个任务考「环境长出来之后怎么持续管」——清单、补丁、配置状态、软件合规，全是运维日常。漂移的发现（Config）与配置拉回（State Manager）是本任务的核心题眼。学员最容易卡的是「期望状态配置」这个概念——先声明要什么状态，系统自己把现实拉回去。这是声明式思路在运维层的落地，也是本域反复出现的设计哲学。\n\n#### 自动化系统清单、配置与补丁管理（SSM / Config）\n\n**这条在问什么**：几百台实例，谁装了什么、配置对不对、补丁缺不缺——人工不可能盘。怎么自动化这三件事。\n\n**定义**：自动化操作的前提是元数据——实例要能按属性被找到，操作才能批量施加（Knowledge 2.3.2 的原理铺垫）。SSM 的托管实例能力三件套：\n\n- **清单（inventory）**：自动收集实例的软件、配置与文件信息，集中可查。\n- **State Manager**：声明期望状态（要装什么、要什么配置），代理自动把实例拉回状态，偏离即纠正。\n- **Patch Manager**：补丁基线（patch baseline）定义「打哪些补丁、什么窗口打」，维护窗口（maintenance window）定时执行。\n\n**机制**：Config 补两件事：记录资源配置历史、按规则评估合规。与 SSM 的分工——SSM 管实例内部状态，Config 管资源外部配置。漂移处理的正确顺序：Config 发现资源级漂移 → 判断是手工救急还是误操作 → 救急改动写回模板，误操作回滚资源。一个边界要记住：不是所有漂移都能自动修——期望状态没定义的（如某张特殊白名单），只能先告警人工判断；盲目自动修会把救急改动抹掉。\n\n**考试判断**：「实例要按标签批量打补丁」→ SSM Patch Manager 加维护窗口；「配置变更要留痕并评估合规」→ Config；「实例配置漂了要自动拉回」→ State Manager。\n\n#### 案例\n\n一个团队 300 台 EC2 的补丁全靠季度手工刷，每次漏十几台。改造：SSM 清单确认纳管率 100%，补丁基线分两档——生产只打安全补丁且限定维护窗口，开发全量随时打；State Manager 同步固化监控代理配置；Config 规则盯「实例是否绑定补丁合规」标签。下个季度零手工——补丁窗口夜里跑，早上看报告。大规模运维的答案不是加人，是定义期望状态。\n\n**关联服务**：AWS Systems Manager（Inventory / State Manager / Patch Manager）、AWS Config。\n\n#### 用 Lambda 开发复杂场景自动化（SDK / Step Functions）\n\n**这条在问什么**：现成服务管不了的自动化，怎么用 Lambda 加编排做出来。考设计：什么场景上 Lambda、复杂流程怎么编排。\n\n**定义**：自动化方案的分层（Knowledge 2.3.1 的原理铺垫）——先看现成服务：清单补丁归 SSM、资源合规归 Config、事件路由归 EventBridge。现成服务不够用时，Lambda 是自定义逻辑的执行单元；流程超过单函数的复杂度，Step Functions（工作流编排服务）串起来。\n\n**机制**：\n\n- **Lambda 单元设计**：一个函数一个动作，且要幂等（重复执行结果不变）——自动化会被事件重复触发，不幂等就重复扣费、重复开资源。\n- **Step Functions 状态机**：把多步流程定义成状态图——分支、并行、重试、错误捕获全在定义里，不散落在函数代码中。\n- **触发方式**：EventBridge 规则（按事件或计划触发）、S3 事件、手动调用。定时资源清理用计划触发，资源变更后的修复用事件触发。\n\n**取舍口吻**：单步逻辑用 Lambda 直连，别为简单事上状态机；多步、要重试、要人工审批的流程必须 Step Functions——把重试逻辑写进每个函数里是维护灾难。\n\n#### 案例\n\n一个团队做「下班自动关停非生产实例」的省钱自动化。EventBridge 计划触发 Step Functions 状态机：列出带 auto-off 标签的实例，逐台检查是否有人在用（在用则跳过并通知），关停后写记录。某次状态机中途失败，重试从断点续跑——如果重试写在 Lambda 里，同一台实例就会被处理两次。幂等加编排，是自定义自动化的两条腿。\n\n**关联服务**：AWS Lambda、AWS Step Functions、Amazon EventBridge、AWS SDK。\n\n#### 把应用配置自动化到期望状态（OpsWorks / SSM State Manager）\n\n**这条在问什么**：应用层配置（监控代理、日志配置、软件包版本）怎么保证始终是要的状态——不是部署一次就完，是持续保持。\n\n**定义**：期望状态配置（desired state configuration）= 声明「应该是什么样」，系统持续把现实拉回声明。SSM State Manager 是 AWS 原生载体：关联（association）把「文档 + 目标实例 + 计划」绑定，代理周期性执行并自纠偏离。\n\n**机制**：\n\n- **关联三要素**：SSM 文档（定义动作）、目标（标签或实例 ID，打上新标签的实例自动纳入）、调度（定时或变更触发）。\n- **OpsWorks 的位置**：Chef/Puppet 托管已停止向新客户开放（以官方公告为准），新设计正解倾向 State Manager——托管、无代理维护负担、与清单补丁同平台。\n- **与 IaC 的分工**：基础设施靠 CloudFormation 建出来，实例内部状态靠 State Manager 保持住——两层各管一段，谁也不替代谁。\n\n**取舍口吻**：配置漂了自动拉回是 State Manager 的强项，但拉回有前提——期望状态定义必须先于自动修复存在。定义不存在的状态，自动拉回就是在制造事故。\n\n#### 案例\n\n一个团队的监控代理经常被人「排障时顺手卸载」，监控就瞎了。用 State Manager 建关联：目标＝带监控标签的全部实例，动作＝安装并启动代理，每 30 分钟检查。有人卸了，下个周期自动装回——排障要临时摘除监控的团队改用打标签退出，而不是删代理。期望状态不是和人为敌，是把「约定」变成「自动执行」。\n\n**关联服务**：AWS Systems Manager（State Manager）、AWS OpsWorks。\n\n#### 维持软件合规（SSM）\n\n**这条在问什么**：合规不是「装的时候对」，是「一直对」——软件版本、禁装清单怎么持续保证。\n\n**定义**：软件合规 = 实例上的软件清单持续符合组织策略：允许列表（只许装什么）、禁止列表（发现即处理）、版本基线（不能低于哪个版本）。载体还是 SSM 三件套：清单收集现状、State Manager 保持状态、补丁基线管版本。\n\n**机制**：\n\n- **清单比对**：SSM Inventory 收集全部实例的软件清单，与策略比对——超期版本、禁用软件立刻现形。\n- **State Manager 固化**：允许的软件用关联保证在装且版本正确；禁用软件用关联保证「发现即卸」。\n- **合规输出**：SSM 合规面板按实例与关联聚合达标率，可接入 Security Hub 统一呈现。\n\n**考试判断**：「确保所有实例都装了指定版本的监控代理」→ State Manager 关联；「发现哪个实例装了未授权软件」→ Inventory 加合规面板；「补丁版本不能低于某基线」→ Patch Manager 基线。题眼是「持续」二字——一次性脚本全是错误项。\n\n#### 案例\n\n一个团队审计发现 12 台实例装了过期版本的消息代理。整改不是手工升级这 12 台：先定义版本基线关联（低于 3.2 自动升级），再让清单确认全量达标，合规面板显示 100%。三个月后新扩的实例自动进入关联范围——合规从「一次整改」变成「持续状态」。审计问「怎么保证不再犯」，答案就是这套期望状态。\n\n**关联服务**：AWS Systems Manager（Inventory / State Manager / Patch Manager / 合规）、AWS Security Hub。\n\n---"}],"tips":{"points":"| 考点 | 内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| IaC 工具选型（2.1.1 / 2.1.4） | CloudFormation / CDK / SAM 分工、变更集 | ⭐⭐⭐ | 场景选择题 |\n| StackSets 权限模型（2.1.5） | 自助管理与服务管理的边界 | ⭐⭐⭐ | 场景选择题 |\n| 配置管理服务选型（2.1.6） | SSM / Config / AppConfig 分工 | ⭐⭐⭐ | 场景选择题 |\n| Control Tower 定位（2.2.3） | 与 Organizations 分工、护栏两类、OU 注册覆盖 | ⭐⭐⭐ | 场景选择题 |\n| SCP 与角色代入（2.2.4） | 上限与通路的区分、被拒排查 | ⭐⭐⭐ | 场景选择题 |\n| 治理服务分工（2.2.5） | Security Hub / GuardDuty / Detective / Config | ⭐⭐ | 场景选择题 |\n| 漂移与期望状态（2.3.3 / 2.3.5） | 漂移发现与自动修复边界 | ⭐⭐⭐ | 排障题 |\n| Lambda 自动化设计（2.3.4） | 幂等与 Step Functions 编排 | ⭐⭐ | 场景选择题 |","services":"| 服务 | 主要用途 | 涉及任务 |\n|---|---|---|\n| AWS CloudFormation / StackSets | IaC 底座与多账号部署 | 2.1、2.2 |\n| AWS CDK / AWS SAM | IaC 上层工具 | 2.1 |\n| AWS Systems Manager | 清单、状态、补丁、合规 | 2.1、2.3 |\n| AWS Config | 资源合规与漂移 | 2.1、2.2、2.3 |\n| AWS AppConfig | 应用配置灰度下发 | 2.1 |\n| AWS Service Catalog / CloudFormation modules | 治理内嵌与复用 | 2.1、2.2 |\n| AWS Organizations / AWS Control Tower | 账号结构与治理 | 2.1、2.2 |\n| SCP / AWS IAM / AWS STS | 组织级权限与跨账号访问 | 2.2 |\n| AWS Security Hub / Amazon GuardDuty / Amazon Detective | 安全发现、威胁检测、调查 | 2.2 |\n| AWS Lambda / AWS Step Functions / Amazon EventBridge | 自定义自动化 | 2.3 |"}},{"domain":3,"name":"弹性云方案（Resilient Cloud Solutions）","weight":"15%","practice":[{"id":"D3-001","d":3,"t":"multiple","q":"一个 DevOps 团队的应用程序在现有 Amazon S3 存储桶中存储公司关键资产，当前只使用单个 AWS 区域。新的公司策略要求把应用程序部署到多个区域，资产必须始终可用，且用户必须使用相同的终端节点访问资产。\n\n团队应该采取哪一组步骤，才能以最具运营效率的方式达到这些要求？（请选择三项）","o":[{"l":"A","t":"使用 AWS CloudFormation StackSets 在每个所需区域创建启用了版本控制的新 S3 存储桶，把资产从现有存储桶复制到新存储桶，并创建 AWS Lambda 函数把主区域新存储桶的新增文件复制到其他区域。"},{"l":"B","t":"使用 AWS CloudFormation StackSets 在每个所需区域创建启用了版本控制的新 S3 存储桶，在主区域的新存储桶上创建多条 S3 复制规则把全部内容复制到其他区域，并把资产从现有存储桶复制到主区域的新存储桶。"},{"l":"C","t":"创建 Amazon CloudFront 分配，为每个 S3 存储桶配置新的来源，创建包含全部新建来源的来源组，并把分配的默认行为更新为使用该来源组。"},{"l":"D","t":"创建 Amazon CloudFront 分配，为每个 S3 存储桶配置新的来源，创建一个 Lambda@Edge 函数验证来源可用性，并把查看器请求路由到附近的可用来源。"},{"l":"E","t":"创建 Amazon Route 53 别名记录，配置故障转移路由策略，使用新建的 S3 存储桶作为目标。"},{"l":"F","t":"创建 Amazon Route 53 别名记录，配置简单路由策略，把 Amazon CloudFront 分配作为目标。"}],"a":["B","C","F"],"e":"**正确答案：B、C、F。**\n\n**为什么对：** 这题分三段：多区域部署、单终端节点、DNS 处理。B 用 StackSets 高效地建多区域存储桶，S3 复制规则把主区域的新对象和现有对象复制到其他区域，不需要自写代码；C 用 CloudFront 来源组做源故障转移，让单个终端节点解析到多个来源；F 因为故障转移已由 CloudFront 源配置承担，Route 53 只需简单路由指向分配，提供用户友好域名。\n\n**其他选项为什么错：**\n- A：用 Lambda 自写复制逻辑，运营效率低于原生 S3 复制。\n- D：Lambda@Edge 自定义代码可行但运营效率低，源配置内已有原生故障转移处理。\n- E：只有一条记录可用时，故障转移路由没有意义。\n\n**关键概念：** 多区域＝StackSets + S3 复制；单终端节点＝CloudFront 来源组；DNS＝简单路由。","s":"官方样题#2"},{"id":"D3-002","d":3,"t":"single","q":"一个开发团队正在设计一个客户群分布在三个 AWS 区域的应用程序。为提供低延迟数据访问，应用程序要使用的 Amazon DynamoDB 表必须在三个区域都可用；当一个区域的表被更新时，变更必须无缝传播到其他区域。\n\nDevOps 工程师应该如何配置表，以最低的运营开销达到这些要求？","o":[{"l":"A","t":"在三个区域各创建一个 DynamoDB 表，给每个表取相同的名字。"},{"l":"B","t":"在三个区域分别创建三个 DynamoDB 表，使用 AWS SDK 编写同步逻辑在各表之间同步数据变更。"},{"l":"C","t":"配置一个覆盖三个区域的多区域多活动（multi-Region, multi-active）DynamoDB 全局表。"},{"l":"D","t":"使用 DynamoDB 全局表，在一个区域配置主表，在其他每个区域配置只读副本。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** DynamoDB 全局表从单区域表起步，可直接升级为多区域多活动表：每个区域都可读写，变更自动双向复制，各区域客户就近低延迟访问，全程无需配置或维护任何复制方案——运营开销最低。\n\n**其他选项为什么错：**\n- A：同名表之间没有任何复制关系，数据互不相通。\n- B：自写跨表同步流程是不必要的运营开销，还要自己处理冲突。\n- D：全局表是多区域多活动表，不存在「只读副本」形态，每个区域都是对等的读写端。\n\n**关键概念：** 全局表＝多区域多活动复制，AWS 托管、无主从之分。","s":"官方样题#8"},{"id":"D3-003","d":3,"t":"single","q":"一家公司刚完成系统的高可用改造评审。架构师在方案里写了「本系统按 Multi-AZ 部署」，管理层追问这套方案到底能防住什么级别的故障，是不是就等于拥有了区域级容灾能力。团队要按 Multi-AZ 与 Multi-Region 的分层定义向管理层讲清楚边界。\n\n关于 Multi-AZ 方案的能力边界，正确的说法是？","o":[{"l":"A","t":"Multi-AZ 能防住区域级故障，一个区域整体不可用时系统照常运行，无需任何额外动作。"},{"l":"B","t":"Multi-AZ 能防住任何级别的故障，包括区域级——只要实例分布在多个数据中心就自动获得跨区域容灾。"},{"l":"C","t":"Multi-AZ 防的是可用区级故障——实例分布在区域内多个物理隔离的数据中心，防不了整个区域的故障。"},{"l":"D","t":"Multi-AZ 与 Multi-Region 防的故障类型完全相同，只是部署成本不同，选哪个只看预算。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文的分层定义很明确：Multi-AZ 是区域内多个物理隔离的数据中心，防的是可用区级故障；区域级故障（整个区域不可用）超出它的防护半径。\n\n**其他选项为什么错：**\n- A：区域级故障要靠 Multi-Region，Multi-AZ 的所有实例都在同一个区域内。\n- B：多数据中心不等于多区域——AZ 再多也在一个区域内，没有跨区域容灾能力。\n- D：两者防的故障类型不同：AZ 级与区域级是两个量级，成本与复杂度也差一个量级，不是只看预算。\n\n**关键概念：** 高可用按故障半径分层：Multi-AZ 防 AZ 级故障（分钟内自动切换），Multi-Region 防区域级故障（成本与复杂度高一个量级）。先想防什么故障，再选档位。","s":"自编·3.1.1"},{"id":"D3-004","d":3,"t":"single","q":"一个团队在评审灾备方案时发生了争论。一位成员认为：数据层既然在 Multi-AZ 里是同步复制的，那么扩展到跨区域部署后副本也应该与主库保持零延迟同步，切换时不会丢任何数据。架构师指出这是把两个层级的复制语义混为一谈了。\n\n架构师的依据是？","o":[{"l":"A","t":"跨区域的数据复制多为异步——存在复制延迟，切换时可能丢失最近写入；同步复制是 Multi-AZ 内的语义，不能套用到 Multi-Region。"},{"l":"B","t":"跨区域复制也是同步的，只是距离更远导致延迟略增，不会丢数据，那位成员的理解只差在延迟数字上。"},{"l":"C","t":"Multi-AZ 的数据层其实也是异步复制，两个层级没有本质区别，争论没有意义。"},{"l":"D","t":"复制是同步还是异步取决于实例规格，与部署在 AZ 内还是跨区域无关。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文写明：Multi-AZ 数据层同步复制；Multi-Region 数据层复制多为异步。异步意味着复制延迟存在，切换时最近一段写入可能还没复制过去——这正是 RPO 概念的来源。\n\n**其他选项为什么错：**\n- B：跨区域同步复制在延迟与成本上不现实，主流跨区域方案（Aurora Global、S3 CRR）都是异步。\n- C：Multi-AZ 是同步复制，这正是它切换快、RPO 趋近零的原因，两个层级有本质区别。\n- D：同步与否取决于部署层级与产品机制，不是实例规格决定的。\n\n**关键概念：** 同步复制（Multi-AZ 内）≈ 不丢数据；异步复制（跨区域）有复制延迟，RPO 大于零。灾备方案必须把「丢多少数据」算清楚。","s":"自编·3.1.1"},{"id":"D3-005","d":3,"t":"single","q":"一家成本敏感的内部系统，业务方给的停机预算是「全年累计不超过 8 小时」。架构评审时有成员提议：直接上 Multi-Region 把所有故障都防住，一步到位最保险。架构师要按「先定档位再选方案」的顺序给出意见。\n\n最合理的意见是？","o":[{"l":"A","t":"同意直接上 Multi-Region——防的故障越多越好，成本在可接受范围内就值得投入。"},{"l":"B","t":"建议连 Multi-AZ 都不要做，单 AZ 部署加上手工重启脚本就能满足 8 小时的停机预算。"},{"l":"C","t":"建议跳过分层判断，先把所有数据层都换成全局表，再回头看预算够不够。"},{"l":"D","t":"先按停机预算选档：全年 8.8 小时的预算用 Multi-AZ 就够，Multi-Region 成本与复杂度高一个量级，不是这个预算该上的档。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文的方法论是「先想防什么故障，再选手段——顺序反了就会过度设计」。99.9% 对应全年约 8.8 小时停机预算，这个档位用 Multi-AZ 就能满足；Multi-Region 是为区域级故障与分钟级停机预算准备的，成本高一个量级。\n\n**其他选项为什么错：**\n- A：直接上最高档是典型的过度设计，8 小时预算根本用不到区域级容灾。\n- B：单 AZ 连 AZ 级故障都防不住，8 小时的预算也不该这么省。\n- C：跳过档位判断直接换全局表，是把数据层方案当成了起点，方法论完全反了。\n\n**关键概念：** 停机预算决定架构档位：单 AZ → Multi-AZ → Multi-Region，每上一档成本翻着涨。预算与档位匹配，才不过度设计。","s":"自编·3.1.1"},{"id":"D3-006","d":3,"t":"single","q":"一家公司用 Aurora Global Database 做跨区域容灾：主区域在新加坡，东京是只读副本。某次新加坡区域故障，按预案把东京副本提升为主库继续写入。一周后新加坡恢复，运维计划让系统「自动切回」原来的主区域运行。架构师指出这个计划有个关键假设不成立。\n\n不成立的假设是？","o":[{"l":"A","t":"新加坡区域恢复后 Aurora 会自动把主写角色切回新加坡，无需人工干预——这个自动化并不存在。"},{"l":"B","t":"Aurora Global Database 的提升是不可回退的：切完之后原主区域不会自动变回副本，恢复主写关系要手工重建。"},{"l":"C","t":"新加坡恢复后数据会自动从东京回流同步，主库角色会随数据回流动态漂移。"},{"l":"D","t":"Aurora Global Database 支持主区域之间任意互切且可随时撤销，回切只是改一个配置项。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文的机制描述：Aurora Global Database 是「主写 + 提升切换」，故障切换是提升副本为主库，切完之后原主区域不能自动变回副本，恢复要手工再加。所以「自动切回」的假设不成立。\n\n**其他选项为什么错：**\n- A：把不存在的自动化当成了默认行为，方向说反了——Aurora 的提升是单向的。\n- C：数据回流动态漂移不是 Aurora Global 的机制，提升动作是显式的。\n- D：「任意互切、随时撤销」不符合提升后不可回退的语义。\n\n**关键概念：** Aurora Global Database：主写 + 提升切换，切换约 1 分钟、复制延迟约 1 秒；提升不可回退，回切需手工重建副本关系。灾备预案要把这一步写进去。","s":"自编·3.1.2"},{"id":"D3-007","d":3,"t":"single","q":"一个多地区协作系统用 DynamoDB Global Table 实现两个区域同时写入。业务评审时有人担心：两个区域同时改同一条记录怎么办？数据会不会互相覆盖出乱子？架构师要向业务方解释清楚 Global Table 的冲突处理语义，并说明采用前提。\n\n正确的解释是？","o":[{"l":"A","t":"两个区域不会同时改同一条记录——Global Table 会自动加锁，同一时刻只允许一个区域写入。"},{"l":"B","t":"冲突发生时系统会暂停一个区域的写入并人工介入裁决，业务方无需提前做任何假设。"},{"l":"C","t":"冲突靠最后写入胜出（last-writer-wins）解决——业务上必须能接受这种合并语义，才适合用 Global Table。"},{"l":"D","t":"Global Table 两个区域是主备关系，备区域只读，不存在双写冲突的问题。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文写明：DynamoDB Global Table 是多区域主动-主动、双向复制，任意区域可写，冲突靠最后写入胜出解决——业务上要能接受这种合并语义才适合用。\n\n**其他选项为什么错：**\n- A：Global Table 没有跨区域加锁机制，主动-主动正是它的卖点。\n- B：没有人工裁决环节，冲突是自动按时间戳合并的，业务方恰恰需要提前确认能接受这个语义。\n- D：主备只读是 Aurora Global 的形态，与 Global Table 的主动-主动相反。\n\n**关键概念：** 两条复制路线对号入座：Aurora Global＝主写 + 提升切换；DynamoDB Global Table＝多写 + last-writer-wins。「两个区域都要写」选 Global Table，「平时主写、灾时切」选 Aurora Global。","s":"自编·3.1.2"},{"id":"D3-008","d":3,"t":"multiple","q":"一个团队的订单系统要在两个区域部署，业务方明确要求两个区域的用户都能直接写入订单数据，不允许「平时只写一个区域、灾时才切换」的主写模式。架构师在选型会上介绍 DynamoDB Global Table 的机制时讲了四点，但其中混进了别的服务的特性。下列说法正确的有哪些？（选两项）","o":[{"l":"A","t":"Global Table 是主动-主动架构，双向复制，任意区域都可以直接写入。"},{"l":"B","t":"两个区域同时写同一条记录时，冲突靠最后写入胜出（last-writer-wins）自动合并。"},{"l":"C","t":"故障切换的动作是把副本提升为主库，提升后原主区域不能再写。"},{"l":"D","t":"存储层复制延迟约 1 秒，区域切换约 1 分钟完成。"},{"l":"E","t":"切换完成后原主区域会自动变回副本角色，无需人工重建复制关系。"}],"a":["A","B"],"e":"**正确答案：A、B。**\n\n**为什么对：** A 与 B 正是 Global Table 的两个核心机制：主动-主动双向复制、last-writer-wins 冲突合并。题干要求两个区域都能直接写，正是选它的理由。\n\n**其他选项为什么错：**\n- C：提升副本为主库是 Aurora Global 的切换方式，Global Table 没有主库概念。\n- D：约 1 秒复制延迟、约 1 分钟切换是 Aurora Global Database 的指标。\n- E：自动回退副本角色是 Aurora 的错误说法，Global Table 更谈不上。\n\n考题常把两者的指标互换当干扰项。\n\n**关键概念：** 两套机制别串门：Aurora Global＝主写 + 提升 + 不可回退；Global Table＝多写 + last-writer-wins。题干「两个区域都直接写」正是选 Global Table 的决定性信号。","s":"自编·3.1.2"},{"id":"D3-009","d":3,"t":"single","q":"一个面向消费者的系统已经完成了 Multi-AZ 改造：计算层跨 AZ 部署、健康检查启用、负载均衡分流、应用无状态化四件事都做完了。管理层在季度评审会上问：离真正的「区域级容灾」还差什么？架构师按正文的技术手段清单回答了升级路径。\n\n正确的回答是？","o":[{"l":"A","t":"只差把实例数量翻倍——更多的实例自然能扛住区域级故障。"},{"l":"B","t":"什么都不缺，Multi-AZ 做完就等于具备了区域级容灾能力。"},{"l":"C","t":"只差把负载均衡器换成 NLB，四层负载均衡天然具备跨区域分流能力。"},{"l":"D","t":"还差数据层跨区域复制与 DNS 切换——加上这两块才凑齐 Multi-Region。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文的技术手段清单：冗余部署、健康检查、自动故障切换、负载均衡分流、应用无状态化五个手段组合成 Multi-AZ；再加数据复制与 DNS 切换，才凑齐 Multi-Region。\n\n**其他选项为什么错：**\n- A：实例再多也都在一个区域内，区域级故障时全军覆没。\n- B：Multi-AZ 防不了区域级故障，两个档位不能划等号。\n- C：NLB 是四层负载均衡器，跨区域分流靠 DNS 与多区域部署，不是换个均衡器就有。\n\n**关键概念：** Multi-AZ 五手段 → Multi-Region ＝ 五手段 + 数据复制 + DNS 切换。缺的两块分别在数据层与入口层，不在计算层堆数量。","s":"自编·3.1.3"},{"id":"D3-010","d":3,"t":"single","q":"一个初创团队听完高可用分享后热血上头，决定给公司所有系统（包括一个只有十几人用的内部工具）全部上 Multi-Region。架构师按「先想防什么故障，再选手段」的顺序叫停了这个提议，并解释了理由。\n\n架构师的理由是？","o":[{"l":"A","t":"Multi-Region 技术上还不成熟，AWS 的跨区域服务都处于预览阶段，等成熟后再上。"},{"l":"B","t":"顺序反了就会过度设计——不先判断要防什么故障、停机预算是多少，直接选最高档手段，成本会白白翻几倍。"},{"l":"C","t":"内部工具不配做高可用，任何形式的冗余部署都不应该考虑。"},{"l":"D","t":"先上 Multi-Region 没问题，但要同时把所有系统都改造成主动-主动多写架构，否则白做。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文原话：先想防什么故障，再选手段——顺序反了就会过度设计。内部工具的停机预算根本不需要区域级容灾，直接上 Multi-Region 是把成本花在用不着的档位上。\n\n**其他选项为什么错：**\n- A：跨区域服务（S3 CRR、DynamoDB Global Table、Aurora Global 等）都是成熟服务，不是预览态，这个理由站不住。\n- C：说法太绝对，内部工具也可以按低档位做基本冗余，问题是档位不是做不做。\n- D：这是在错误方向上加码，与架构师的立场正好相反。\n\n**关键概念：** 韧性设计的正确顺序：先问停机预算与要防的故障类型，再按档位选手段。手段永远服务于故障半径，不是越贵越好。","s":"自编·3.1.3"},{"id":"D3-011","d":3,"t":"single","q":"一个系统的 Multi-AZ 改造进行到一半：负载均衡与跨 AZ 部署都铺好了，但切换演练时发现，某些实例被替换后用户会莫名掉登录状态，另一部分实例则正常。架构师一眼指出这是应用层不符合高可用手段清单里的某一条。\n\n不符合的是哪一条？修法是什么？","o":[{"l":"A","t":"不符合「应用无状态化」——实例本地存了会话，要把会话外置到 ElastiCache 等共享存储，让任何实例都能被替换。"},{"l":"B","t":"不符合「健康检查」——健康检查没配好导致部分实例被误杀，把检查间隔调长就能解决掉登录问题。"},{"l":"C","t":"不符合「冗余部署」——实例数量不够导致流量集中，加机器就能消除掉登录现象。"},{"l":"D","t":"不符合「自动故障切换」——切换动作本身会把用户会话清空，关掉自动切换改为手工切换就没有这个问题。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文的手段清单里明确包含应用无状态化。掉登录＝会话存在实例本地，流量切到别的实例时本地没有那份会话——正是无状态化缺失的典型症状，修法是把会话外置。\n\n**其他选项为什么错：**\n- B：健康检查调长只是掩盖症状，会话本地化的问题还在，切换后照样掉。\n- C：加机器不解决会话粘在单个实例上的问题，流量怎么分，掉登录的几率都一样。\n- D：手工切换反而放大停机，而且掉登录的根因是会话存储位置，不是切换动作。\n\n**关键概念：** 高可用五手段中，「应用无状态化」是唯一在应用层的一条——基础设施冗余铺得再好，实例本地存状态就会在切换时丢用户上下文。","s":"自编·3.1.3"},{"id":"D3-012","d":3,"t":"single","q":"业务方给一个支付系统提出要求：「系统的可用性要达到 99.99%」。架构师要把这个百分比换算成可执行的停机预算，向团队说明这一年到底允许停多久，以及这个数字对架构档位意味着什么。\n\n99.99% 对应的全年停机预算大约是？","o":[{"l":"A","t":"全年约 8.8 小时——这是 99.9% 档位的预算，用 Multi-AZ 档位通常就能满足。"},{"l":"B","t":"全年约 8.8 分钟——99.99% 已经严格到接近零停机，几乎不允许任何中断。"},{"l":"C","t":"全年约 53 分钟——这个预算下通常必须考虑跨区域方案，Multi-AZ 未必兜得住。"},{"l":"D","t":"全年约 5.3 小时——介于两档之间，按团队资源灵活选择即可。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文给出的换算：99.9%＝全年约 8.8 小时；99.99%＝全年约 53 分钟。53 分钟的停机预算决定架构档位——必须考虑跨区域，Multi-AZ 的分钟级切换与恢复时间未必兜得住。\n\n**其他选项为什么错：**\n- A：8.8 小时是 99.9% 的预算，差了一个数量级。\n- B：8.8 分钟连 99.999% 的量级都不到，数字凭空捏造。\n- D：5.3 小时不在任何标准档位上，是把两个换算混着算出来的错数。\n\n**关键概念：** 可用性百分比 → 停机预算是韧性翻译的第一步：99.9%＝8.8h/年，99.99%＝53min/年。档位判断从这道换算开始。","s":"自编·3.1.4"}],"sections":[{"h":"实施满足韧性与业务需求的高可用方案（Implement highly available solutions to meet resilience and business requirements.）","body":"### 这一域考什么\n\nD3 占 15%，核心是把「业务要 99.9%」翻译成技术动作。考试不给抽象概念题——题干直接给业务约束（停机容忍 5 分钟、数据最多丢 10 分钟、全球用户访问），让你选架构、配复制、定切换方式。\n\n三个任务是一条链：\n\n1. **不中断**（任务 3.1）：高可用——单点排查、Multi-AZ 与 Multi-Region 的分层、负载均衡与健康检查。\n2. **扛得住量**（任务 3.2）：可伸缩——扩缩指标、松耦合、容器与无服务器。\n3. **坏了能回来**（任务 3.3）：灾备——RTO/RPO 定档、备份恢复策略、故障演练。\n\n### 与 Associate 级的差别\n\nSOA-C03 考「按现成方案配 Multi-AZ」，DOP 考「你自己判断哪里是单点、该用哪种复制与切换方式」。同一条 Multi-AZ 题目，Associate 问「选项里哪个开」，DOP 问「这个架构哪里还不够、补哪一层要花多少成本」——每道题都要带取舍。\n\n### 常见失分点\n\n1. **RTO/RPO 与成本的三角取舍**。恢复越快、数据丢得越少，成本越高。不是所有系统都值得上主动-主动——按业务给档位，别按技术兴趣给档位。\n2. **有状态服务的跨区域复制方案差异**。Aurora Global Database 与 DynamoDB Global Table 的复制方向、切换动作、写入模式完全不同，混着答必错。\n3. **温备与主动-主动的成本量级差**。温备跑着一套缩水的环境，主动-主动跑两套全量环境——量级差不是百分比，是倍数。\n\n#### 这一节学什么\n这一节对应考纲任务 3.1「实施满足韧性与业务需求的高可用方案（Implement highly available solutions to meet resilience and business requirements.）」。\n\n> 官方原名：Implement highly available solutions to meet resilience and business requirements.\n> 本任务 8 条（Knowledge 3 / Skill 5）。三条 Knowledge 按域骨架规则并入：多可用区与多区域部署、实现高可用的技术手段合并作任务级原理铺垫；有状态服务的复制与故障切换并入跨区域方案节（3.1.6）。\n\n**任务综述**：这个任务考「怎么让系统不因单点而停」。五个技能点的逻辑：先定韧性档位（3.1.4），再排查现有架构的单点（3.1.5），然后用跨区域能力（3.1.6）、负载均衡（3.1.7）和应用改造（3.1.8）逐个消除。学员最容易卡的是分层——Multi-AZ 和 Multi-Region 是两个不同量级的方案，防的故障类型不同，成本结构也不同，混为一谈就会选错档。\n\n**原理铺垫：Multi-AZ 与 Multi-Region 的分层（Knowledge 3.1.1、3.1.3）**。高可用手段按故障半径分层：\n\n- **Multi-AZ（多可用区）**：区域内多个物理隔离的数据中心。计算层实例分 AZ 部署，数据层同步复制。防可用区级故障，切换通常在分钟内自动完成，几乎不加延迟成本（跨 AZ 流量费除外）。\n- **Multi-Region（多区域）**：跨地理区域部署。数据层复制多为异步，切换要动 DNS 或全局服务。防区域级故障，成本与复杂度高一个量级。\n\n**技术手段清单（Knowledge 3.1.3 的展开）**：冗余部署、健康检查、自动故障切换、负载均衡分流、应用无状态化。五个手段组合成 Multi-AZ；再加数据复制与 DNS 切换，才凑齐 Multi-Region。先想防什么故障，再选手段——顺序反了就会过度设计。\n\n#### 把业务需求翻译成技术韧性要求\n\n**这条在问什么**：业务方说的是「服务不能断」，工程师要把它变成可执行的架构档位。翻译能力是本域的分水岭。\n\n**定义**：两个关键换算：\n\n- **可用性百分比 → 停机预算**：99.9% = 全年约 8.8 小时；99.99% = 全年约 53 分钟。停机预算决定架构档位——8.8 小时的系统用 Multi-AZ 就够，53 分钟的系统必须考虑跨区域。\n- **停机容忍 → 恢复目标**：能容忍多久恢复（RTO）、最多丢多少数据（RPO）。这两个指标在灾备任务 3.3 展开，但档位判断在这里就要做。\n\n**机制**：翻译三步：\n\n1. **问业务要百分比**：不给数就按「停机一小时损失多少」倒推。\n2. **对照档位**：单 AZ → Multi-AZ → Multi-Region，每上一档成本翻着涨。\n3. **写进验收**：韧性要求写进架构文档与演练计划，不写就等于没定。\n\n**考试判断**：题干给「年停机不得超过 X 分钟」——先把 X 换算成可用性档位，再对方案。给「成本敏感、允许分钟级中断」——不要选主动-主动，选 Multi-AZ 或温备。\n\n**常见的换算错误**：把 99.9% 读成「每月 99.9%」——SLA 有按月也有按年给的，口径不同预算差几倍。拿到数字先问统计周期，再谈档位。\n\n#### 案例\n\n一个内部报表系统，业务方拍「必须 99.99%」。追问停机损失：报表晚一小时出，没人挨骂。实际档位 99.5% 就够——省下的成本够把核心交易系统从 99.9% 升到 99.99%。韧性要求向业务要数字，别替业务拍脑袋；拍高了是浪费，拍低了是事故。\n\n**关联服务**：Amazon Route 53（健康检查与故障转移）、Amazon CloudWatch（可用性度量）、AWS Well-Architected 工具（韧性评审）。\n\n#### 识别并消除现有工作负载的单点故障\n\n**这条在问什么**：给你一个存量架构，找出哪里会一坏全停，怎么补。考试给架构图或描述，让你选「下一个要修的单点」。\n\n**定义**：单点故障（single point of failure）＝一个组件失效就导致服务整体不可用的环节。排查方法是从用户流量入口顺藤摸瓜：\n\n- **DNS 与入口**：解析是否唯一、健康检查是否启用。\n- **负载均衡层**：是否多 AZ 部署、目标组健康检查是否配了。\n- **计算层**：Auto Scaling 组是否跨 AZ、最小容量是否 ≥2、实例是否本地盘存状态。\n- **数据层**：数据库是否单实例、缓存失效会不会雪崩、队列有没有单点。\n\n**机制**：逐层修复的对应动作：\n\n- 单实例数据库 → RDS Multi-AZ 或 Aurora 多副本。\n- 单 AZ 的 Auto Scaling 组 → 补 AZ 配置并设容量下限。\n- 本地会话 → 会话外置到 ElastiCache。\n- 单 NAT 网关 → 每 AZ 一个。\n- 手工切换的备机 → 自动健康检查加自动切换。\n\n**考试判断**：题干问「当前架构最脆弱的一环」——找「没有冗余且有状态」的组件，数据层单点优先于计算层单点。计算层挂了还能快速起新的，数据层挂了可能真丢数据。\n\n#### 案例\n\n一个团队做完单点排查，清单排了 7 项：单实例 RDS、单 AZ 扩缩组、本地会话、单 NAT 网关、手工 DNS 切换等。修复顺序按「数据层优先」：先上 RDS Multi-AZ，再补 Auto Scaling 组跨 AZ 与会话外置，剩下的排进季度计划。半年后可用性从 99.5% 到 99.95%——没有大重构，只是把单点逐个拆掉。\n\n**关联服务**：Amazon RDS（Multi-AZ）、Auto Scaling、Amazon ElastiCache、AWS Trusted Advisor（冗余检查）。\n\n#### 启用可用的跨区域方案（DynamoDB / RDS / Route 53 / S3 / CloudFront）\n\n**这条在问什么**：跨区域不是拉一套新环境就完——每个服务的复制与切换机制不同。给一个数据层场景，选对复制方案。\n\n**定义**：五个点名的服务，跨区域能力各不相同：\n\n| 服务 | 跨区域机制 | 切换方式 |\n|---|---|---|\n| Amazon S3 | 跨区域复制（CRR） | 双桶读写或按区域切换 |\n| Amazon DynamoDB | Global Table（全局表） | 主动-主动，多区域同时可写 |\n| Amazon RDS | 跨区域只读副本 | 提升副本为主库（提升后不可回退） |\n| Amazon Aurora | Global Database | 副本提升，切换约 1 分钟 |\n| Amazon Route 53 | 多区域端点 + 健康检查 | 故障转移路由自动切 DNS |\n\n**有状态服务的复制与切换（Knowledge 3.1.2 的原理铺垫）**：两个常混的方案对号入座。\n\n- **Aurora Global Database**：一个主区域写，其他区域只读副本，存储层复制延迟约 1 秒。故障切换是「提升副本为主」——切完之后原主区域不能自动变回副本，恢复要手工再加。适合主写场景。\n- **DynamoDB Global Table**：多区域主动-主动，双向复制，任意区域可写。冲突靠最后写入胜出（last-writer-wins）解决——业务上要能接受这种合并语义。适合多地区写入场景。\n\n这就是本域点名的失分点：Aurora 是「主写 + 提升切换」，DynamoDB 是「多写 + 冲突合并」。题干说「两个区域都要写订单」→ Global Table；说「平时主区域写、灾时切」→ Aurora Global。\n\n**机制**：Route 53 是切换的总开关：健康检查盯各区域端点，故障转移路由把流量切到健康区域。切换快不快，看健康检查间隔与 DNS TTL——TTL 设太长，DNS 缓存会让切换延迟放大。\n\n#### 案例\n\n一个电商订单库，日常全部写入在新加坡区域。用 Aurora Global Database：东京与美国是只读副本，本地查询不走跨区域网络。某次新加坡故障，Route 53 健康检查 30 秒内发现，Aurora 提升东京副本为主库——RPO 约 1 秒，RTO 约 1 分钟。切换后团队按预案在东京继续写入；原区域恢复后手工重建副本关系。选型对了，切换就是照脚本走。\n\n**关联服务**：Amazon Aurora（Global Database）、Amazon DynamoDB（Global Table）、Amazon Route 53、Amazon S3（CRR）、Amazon CloudFront。\n\n#### 配置负载均衡以支撑跨可用区服务\n\n**这条在问什么**：负载均衡是 Multi-AZ 的枢纽——目标组怎么跨 AZ、健康检查怎么配、流量怎么匀。细节配置是本条考点。\n\n**定义**：跨 AZ 服务靠负载均衡把流量分到多个 AZ 的目标上。两种主流负载均衡器分工：\n\n- **Application Load Balancer（ALB）**：七层（HTTP/HTTPS），按路径与主机头路由，适合 Web 应用。\n- **Network Load Balancer（NLB）**：四层，超低延迟、静态 IP，适合 TCP 与高性能场景。\n\n**机制**：三个关键配置：\n\n- **跨区均衡（cross-zone load balancing）**：开启后每个目标不分 AZ 平均分流量。ALB 默认开，NLB 默认关——NLB 不开跨区均衡，各 AZ 流量按弹性网络接口分配，实例数不均时负载不均。考试爱考这个默认值差异。\n- **目标组健康检查**：检查路径、间隔、健康阈值。健康检查失败的目标被摘除——摘除动作就是后端故障自愈的开端（灾备任务 3.3.6 会再遇到它）。\n- **AZ 均衡容量**：每个 AZ 都要有健康目标。一个 AZ 全挂，ALB 会把流量压到其余 AZ——前提是其余 AZ 有容量余量，Auto Scaling 组要能兜住。\n\n**取舍口吻**：跨区均衡开启后产生跨 AZ 流量费——流量大时这笔钱不小，NLB 场景有时故意不开，改按 AZ 均衡业务。考试给「成本敏感的大流量 TCP 场景」要想到这一点。\n\n#### 案例\n\n一个 NLB 后面挂两个 AZ 的服务，AZ-A 4 台实例、AZ-B 1 台。默认（跨区均衡关闭）下 AZ-A 之间流量只走本 AZ——4 台分一半流量，1 台扛另一半，那台 CPU 打满。开启跨区均衡后 5 台均分，负载瞬间正常。NLB 的默认值不是建议值——实例不均匀的部署必须手动打开。\n\n**关联服务**：Elastic Load Balancing（ALB / NLB）、Amazon EC2 Auto Scaling、Amazon Route 53。\n\n#### 配置应用与服务支持多可用区多区域并最小化停机\n\n**这条在问什么**：基础设施铺好了，应用自己要配得上——无状态化、会话外置、优雅处理健康检查。应用层不配合，架构层白铺。\n\n**定义**：应用支持 Multi-AZ / Multi-Region 的四个前提：\n\n- **无状态**：实例不存本地会话与本地文件——状态外置到 ElastiCache、DynamoDB 或 S3，任何实例都能被替换。\n- **配置与代码分离**：区域相关配置（数据库地址、区域名）从环境注入，同一份镜像多区域通用。\n- **健康检查真实**：健康检查端点要真的检查依赖（数据库连通），不是永远返回 200——假健康会让流量打进一个「活着但坏掉」的实例。\n- **优雅启停**：启动时先预热再接流量（注册目标组前完成初始化），停机时处理完在途请求再退出。\n\n**机制**：最小化停机的组合拳：Auto Scaling 健康替换走滚动、部署走蓝绿或金丝雀（选定部署策略一节 1.1.7 与使用不同部署方式一节 1.4.8 的机制直接复用）、跨区域切换靠 Route 53。考试给「Multi-AZ 下仍偶发分钟级中断」的场景——常见根因是实例启动慢（冷启动接流量）或健康检查是假的，不是 AZ 不够。\n\n#### 案例\n\n一个应用 Multi-AZ 部署后仍偶发报错。排查发现实例重启后 30 秒内健康检查就通过——但应用初始化（连数据库、加载缓存）要 45 秒，前 15 秒接到的流量全失败。修法：健康检查端点加「初始化完成」标记，初始化没完成返回 503。停机报错归零。基础设施的冗余救不了「假健康」的应用。\n\n**关联服务**：Amazon EC2 Auto Scaling、Elastic Load Balancing、Amazon ElastiCache、Amazon Route 53。\n\n---"},{"h":"实施满足业务需求的可伸缩方案（Implement solutions that are scalable to meet business requirements.）","body":"#### 这一节学什么\n这一节对应考纲任务 3.2「实施满足业务需求的可伸缩方案（Implement solutions that are scalable to meet business requirements.）」。\n\n> 官方原名：Implement solutions that are scalable to meet business requirements.\n> 本任务 9 条（Knowledge 4 / Skill 5）。四条 Knowledge 按域骨架规则并入：松耦合与分布式架构作任务级原理铺垫；扩缩指标并入选定并落地自动扩缩节（3.2.6）；容器平台并入部署容器化应用节（3.2.7）；无服务器架构并入配置无服务器应用节（3.2.9）。\n\n**任务综述**：高可用方案（任务 3.1）让系统「不因单点而停」，这个任务让系统「不因流量而停」。五个技能点一条链：找出扩不动的原因（3.2.5）→ 配自动扩缩与缓存（3.2.6）→ 选运行时形态——容器（3.2.7）或无服务器（3.2.9）→ 需要全球覆盖就多区域部署（3.2.8）。学员最容易卡的是扩缩指标——CPU 利用率是默认项但不是万能项，选错指标扩缩就不及时或乱伸缩。\n\n**原理铺垫：松耦合与分布式架构（Knowledge 3.2.2）**。系统扩不动，多数时候不是算力不够，是组件绑太死。松耦合的判断：一个组件挂了或变慢，其余组件还能不能正常工作？做不到就是耦合过紧。AWS 的松耦合三板斧：\n\n- **队列削峰**：Amazon SQS 把同步调用改成异步——高峰期请求排队，消费端按自己的节奏处理，不会被打垮。\n- **事件解耦**：Amazon EventBridge / SNS 发布订阅——生产者不关心谁消费，加消费者不用改生产者。\n- **服务边界**：按业务拆服务，每个服务独立伸缩——单体里一个模块的流量高峰拖着全应用扩容。\n\n考试里「扩缩容不及、突发流量压垮下游」的题，正解几乎都含队列或事件解耦。\n\n#### 识别并解决扩缩容问题\n\n**这条在问什么**：系统在高负载下响应变慢甚至雪崩——找出扩不动的那一环，修掉它。考试给故障现象，让你选根因。\n\n**定义**：扩缩容问题四类典型：\n\n- **扩缩不及时**：指标告警到实例就绪要几分钟，突发流量等不了——需要预扩容或更快的形态。\n- **扩错对象**：流量瓶颈在数据库，应用实例加多少都没用——先找真瓶颈。\n- **上下文丢失**：实例横向加了，会话粘在旧实例上——粘性会话与本地缓存阻碍横向扩展。\n- **下游短板**：应用扩了，连接池、数据库连接数、下游 API 配额没跟着扩——连接耗尽新实例照样失败。\n\n**机制**：排查顺序：看指标定位瓶颈层（CloudWatch）→ 分清「应用层瓶颈」与「数据层瓶颈」→ 应用层查扩缩策略，数据层查读写分离、缓存与分片。\n\n**考试判断**：「实例加了很多但 P95 还是高」→ 多半不是计算瓶颈，查数据库连接与慢查询；「突发流量把系统打垮」→ 队列削峰加预扩容；「新实例起来就挂」→ 查依赖（数据库连接数上限、配置中心可达性）。\n\n#### 案例\n\n一个大促演练，应用从 20 台扩到 200 台，P95 反而恶化。查数据库连接：每台实例连接池 50，200 台要 1 万连接——数据库上限 5000，半数实例拿不到连接，反复重试把数据库也拖垮。解法是三层一起动：连接池下调加代理复用，读流量切只读副本，热点查询加缓存。扩容之前先算下游容量——算力是乘法，不是加法。\n\n**关联服务**：Amazon CloudWatch、Amazon RDS（读写分离）、Amazon ElastiCache、Amazon SQS。\n\n#### 选定并落地自动扩缩、负载均衡与缓存方案\n\n**这条在问什么**：扩缩的策略怎么定——盯什么指标、扩多快、上下限多少；缓存怎么挡住读流量。选型与参数是考点。\n\n**定义**：适合扩缩容的指标选择（Knowledge 3.2.1 的原理铺垫）——指标决定扩缩的灵敏度：\n\n- **CPU 利用率**：默认项，适合通用计算。缺点：I/O 密集型应用 CPU 不高但已经堵死。\n- **请求量 / 每目标连接数**：ALB 目标组指标，直接反映负载，扩缩最及时。\n- **队列深度 / 队列年龄**：SQS 消费场景专用——积压越多扩越多，消费完自动缩回。\n- **自定义业务指标**：如每秒订单数。最能反映真实负载，走 CloudWatch 告警或目标跟踪。\n\n**机制**：扩缩策略三形态：\n\n- **目标跟踪（target tracking）**：盯一个指标维持目标值，如 CPU 50%——最常用，配置简单。\n- **步进（step scaling）**：按告警幅度分档加减——响应可控但配置繁琐。\n- **定时（scheduled）**：可预测的高峰（大促、上班时段）提前扩。\n\n**缓存挡读**：ElastiCache 挡数据库读、CloudFront 挡静态与边缘流量、API Gateway 缓存挡重复请求。缓存命中率上去，后面的扩缩压力直接变小——先缓存后扩容，是成本最优顺序。\n\n**考试判断**：「突发流量要分钟级响应」→ 目标跟踪加更快扩缩冷却时间，或预扩容；「队列积压消费不过来」→ 按队列深度扩消费端；「数据库 CPU 高但应用 CPU 低」→ 加缓存与读写分离，别盲目加应用实例。\n\n#### 案例\n\n一个图片处理服务按 CPU 50% 目标跟踪扩缩，大促时 CPU 才 30% 但队列积压 5 万——I/O 等待撑住了 CPU。换指标：目标跟踪改盯 SQS 队列深度（每实例积压 100 条），积压即扩、消费完即缩。扩缩从「滞后半小时」变成「实时跟着积压走」。指标选对，策略才生效。\n\n**关联服务**：Amazon EC2 Auto Scaling、Elastic Load Balancing、Amazon ElastiCache、Amazon CloudFront、Amazon SQS。\n\n#### 部署容器化应用（ECS / EKS）\n\n**这条在问什么**：容器跑在 AWS 上有两种托管路径——ECS 与 EKS。给团队现状与场景，选平台并配好扩缩。\n\n**定义**：容器平台的全景（Knowledge 3.2.4 的原理铺垫）：\n\n- **Amazon ECS**：AWS 自家编排，控制面托管免费。概念简单（任务定义、服务、集群），与 IAM、ALB、Auto Scaling 集成开箱即用。\n- **Amazon EKS**：托管 Kubernetes 控制面。生态最全（K8s 插件、GitOps 工具链），团队要会 K8s——运维复杂度与人才要求高。\n- **AWS Fargate**：两种平台都可用的无服务器运行时——不管实例，按任务付费。配合 ECS/EKS 用，不是第三个编排平台。\n\n**机制**：选型两条主线：\n\n- **团队技能**：已有 K8s 运维能力或要跨云一致 → EKS；主要在 AWS 且团队小 → ECS。\n- **成本结构**：ECS 控制面免费，EKS 每集群收控制面费；Fargate 省运维但单价高于 EC2 模式——稳定大负载用 EC2 模式，波动与突发用 Fargate，可以混用（容量提供策略）。\n\n**扩缩双层**：容器扩缩分两层——集群层（EC2 容量够不够）与服务层（任务数够不够）。Fargate 模式只有服务层，没有集群层烦恼。ECS 服务自动扩缩与 ALB 请求量、SQS 队列深度目标跟踪集成。\n\n**考试判断**：「团队没有 K8s 经验、要快速上线」→ ECS；「已有 K8s 工具链与多云需求」→ EKS；「流量波动大、不想管实例」→ Fargate。\n\n#### 案例\n\n一个 8 人团队要从虚拟机迁容器。两个候选：EKS（K8s 生态全）与 ECS。团队没人写过 Kubernetes，最终选 ECS：任务定义描述容器，服务配 ALB 与目标跟踪，两周上线。半年后流量稳定增长，再把稳定部分的基线负载迁到 EC2 模式、突发部分留在 Fargate——成本降了三成。选平台先看人，再看生态。\n\n**关联服务**：Amazon ECS、Amazon EKS、AWS Fargate、Elastic Load Balancing。\n\n#### 多区域部署实现全球可扩展\n\n**这条在问什么**：用户在全球、单区域撑不住或延迟高——多区域部署怎么做。与跨区域方案节（3.1.6）的分工：那边讲灾备切换，这边讲「主动服务多区域用户」。\n\n**定义**：多区域部署 = 多个区域同时活跃服务，流量按地理位置分发。触发条件两个：延迟（用户离区域太远）或容量（单区域到顶）。\n\n**机制**：三件套：\n\n- **流量入口**：Route 53 延迟路由（latency routing）把用户导向最快区域；地理位置路由按国家分配；CloudFront 在边缘终结静态与缓存流量。\n- **数据层**：主动-主动写用 DynamoDB Global Table；主写读多区域用 Aurora Global Database（跨区域方案节 3.1.6 已展开）。\n- **部署自动化**：同一套 IaC 模板铺多区域，CodePipeline 分区域执行——部署配置与区域解耦（多 AZ 多区域应用节 3.1.8 的前提在这继续生效）。\n\n**取舍口吻**：多区域活跃的成本不是「两倍」，是「两倍加复杂度」：数据冲突、配置同步、逐区域发布都要管。先确认单区域加 CloudFront 解决不了延迟问题，再上多区域——很多「全球访问」场景，边缘缓存就能把 P95 压到位。\n\n**考试判断**：「全球用户延迟高」→ 先 CloudFront 边缘缓存，不够再多区域；「多区域同时可写」→ Global Table；「按用户所在地合规隔离数据」→ 地理路由加按区域的数据存储。\n\n#### 案例\n\n一个 SaaS 产品用户主要在欧美，单区域（美东）部署，欧洲用户 P95 高达 400 毫秒。第一轮优化只上 CloudFront：静态资源与 API 缓存命中后，欧洲 P95 降到 180 毫秒——够用，多区域停做。第二轮因欧盟数据合规要求，才加欧洲区域：DynamoDB Global Table 双向复制，Route 53 地理路由把欧洲用户固定在欧洲区域。需求驱动的多区域，每一步都有明确理由。\n\n**关联服务**：Amazon Route 53、Amazon CloudFront、Amazon DynamoDB（Global Table）、AWS Global Accelerator。\n\n#### 配置无服务器应用（API Gateway / Lambda / Fargate）\n\n**这条在问什么**：无服务器三件怎么组队、参数怎么配。考的是运行时的边界认知——超时、并发、冷启动这些限制决定架构形态。\n\n**定义**：无服务器架构（Knowledge 3.2.3 的原理铺垫）= 不管理服务器、按请求计费、自动伸缩的形态。三件分工：\n\n- **Amazon API Gateway**：入口——鉴权、限流、缓存、请求校验，HTTP 与 REST API 两类。\n- **AWS Lambda**：计算——事件驱动执行，单次有 15 分钟超时与内存上限，并发数决定同时处理的请求量。\n- **AWS Fargate**：长任务或重依赖的容器化无服务器——Lambda 装不下的（大依赖、长处理、需要常驻连接）交给它。\n\n**机制**：关键参数三处：\n\n- **API Gateway 限流（throttling）**：默认每账号每区域有速率与突发上限——保护下游，也是故障时「自断流量」的开关。\n- **Lambda 并发与预留**：并发默认有账户级上限；预留并发（reserved concurrency）给关键函数保底、给下游不可扛的函数限顶。\n- **冷启动**：首次调用要初始化执行环境。缓解：预置并发（provisioned concurrency）保热、减少包体积、初始化移出主逻辑。\n\n**考试判断**：「请求突发猛、单次处理短」→ API Gateway 加 Lambda；「单次处理 20 分钟的视频转码」→ Lambda 超时不够，Fargate 或 Step Functions 拆步；「下游数据库只能扛 100 并发」→ Lambda 预留并发限到 100，别把下游冲垮。\n\n#### 案例\n\n一个 API 后端用 Lambda，下游是自建 MySQL，只能扛 100 连接。促销夜并发冲到 3000，Lambda 全开——连接池耗尽，所有请求超时。修复：给这个函数设预留并发 80（留余量给运维函数），超出的请求排队等待；同时把 MySQL 换成 Aurora Serverless。无服务器的「无限伸缩」是计算层的，下游的容量边界必须靠限流配平。\n\n**关联服务**：Amazon API Gateway、AWS Lambda、AWS Fargate、Amazon SQS（排队缓冲）。\n\n---"},{"h":"实施满足 RTO/RPO 的自动恢复流程（Implement automated recovery processes to meet RTO and RPO requirements.）","body":"#### 这一节学什么\n这一节对应考纲任务 3.3「实施满足 RTO/RPO 的自动恢复流程（Implement automated recovery processes to meet RTO and RPO requirements.）」。\n\n> 官方原名：Implement automated recovery processes to meet RTO and RPO requirements.\n> 本任务 6 条（Knowledge 3 / Skill 3）。三条 Knowledge 按域骨架规则并入：灾备概念（RTO/RPO）与恢复策略合并作任务级原理铺垫；恢复流程并入演练故障切换节（3.3.4）。\n\n**任务综述**：高可用方案（任务 3.1）让系统少坏，这个任务回答「坏了之后多快回来、丢多少数据」。三个技能点一条链：先演练（3.3.4，没演练过的灾备等于没有）→ 配跨区域备份恢复（3.3.5）→ 负载均衡层的后端故障自愈（3.3.6）。学员最容易卡的是「策略档位与 RTO/RPO 的对应」——四种灾备档位各值多少钱、各接多快，对号入座是必考题。\n\n**原理铺垫一：RTO 与 RPO（Knowledge 3.3.1）**。两个指标一把尺子：\n\n- **RTO（Recovery Time Objective）**：恢复时间目标——从故障发生到服务恢复，最多容忍多久。\n- **RPO（Recovery Point Objective）**：恢复点目标——最多容忍丢多久的数据，RPO 15 分钟意味着恢复后最近 15 分钟的写入可以没有。\n\n两者是花钱的方向盘：RTO 越短，切换越要自动化；RPO 越接近 0，复制越要同步。每收紧一档，成本都上一个台阶。\n\n**原理铺垫二：四种灾备档位（Knowledge 3.3.2）**。按成本与恢复速度排：\n\n- **备份与恢复（backup & restore）**：只备数据，灾时重建环境。RTO 数小时到天，RPO 取决于备份频率。成本最低。\n- **最小化启用（pilot light）**：数据层常驻复制，计算层只留最小核心（镜像与配置就绪），灾时拉起全量。RTO 十分钟到小时。\n- **温备（warm standby）**：缩水版完整环境常驻另一区域持续跑，灾时扩容接管。RTO 分钟级。\n- **主动-主动（active-active）**：多区域同时全量服务。RTO 接近 0，成本最高（本域综述失分点：与温备的差是倍数不是百分比）。\n\n#### 演练多可用区与多区域故障切换（RDS / Aurora / Route 53 / CloudFront）\n\n**这条在问什么**：灾备方案写在纸上不算数——演练一遍才知道切换脚本能不能跑通。考的是怎么演练、演练什么。\n\n**定义**：恢复流程（Knowledge 3.3.3 的原理铺垫）是一条固定链路：故障检测（健康检查/告警）→ 判定切换 → 执行切换（DNS 或副本提升）→ 验证（核心链路回归）→ 回切或固化新主。演练就是把这条链路在真实环境里走一遍。\n\n**机制**：各层演练手段：\n\n- **数据库层**：RDS Multi-AZ 用故障切换 API（RebootWithFailover）主动触发切换；Aurora Global 用副本提升演练。观察实际 RTO 与 RPO 是否达承诺。\n- **DNS 层**：Route 53 把健康检查端点改坏（模拟区域故障），观察故障转移路由是否按时切换——同时观察 TTL 实际生效时长。\n- **应用层**：逐台摘除实例（Auto Scaling 会补齐），验证无状态化是否彻底。\n- **CloudFront**：验证源站故障时缓存回源行为与错误页。\n\n**考试判断**：「验证灾备预案有效性」→ 做故障注入演练，不是「读文档」；「切换后 DNS 仍指向旧区域」→ TTL 太长或健康检查间隔太松——演练发现的就是这类纸面方案发现不了的坑。\n\n#### 案例\n\n一个团队按文档演练 Aurora Global 切换。预期是把主库从新加坡提升到东京；演练时发现东京副本的 IAM 授权没配——应用角色信任的数据库用户只建在新加坡。纸上方案演练一次就暴露了。修复后把演练做成季度例行，并把「演练发现的坑」回写进切换脚本。没演练过的灾备预案，只是愿望。\n\n**关联服务**：Amazon RDS / Amazon Aurora（故障切换）、Amazon Route 53（健康检查）、Amazon CloudWatch（演练度量）。\n\n#### 选定并落地跨区域备份与恢复策略（AWS Backup / S3 / SSM）\n\n**这条在问什么**：备份不是「打个快照」——跨区域怎么备、怎么按档位选策略、恢复演练怎么做。AWS Backup 是本条主角。\n\n**定义**：AWS Backup 是集中备份编排服务：备份计划（backup plan）定义频率、保留期与生命周期，备份 vault 存储备份并支持跨区域复制，覆盖 RDS、EBS、DynamoDB、EFS、S3 等资源。核心价值是「策略集中、执行自动、审计统一」。\n\n**机制**：\n\n- **备份计划**：按资源重要程度分档——核心数据每日备份加跨区域复制，边缘数据每周本地备份。\n- **跨区域复制**：vault 级配置，备份自动复制到目标区域——灾时在目标区域直接恢复，不用从原区域搬数据（原区域可能就是灾区）。\n- **恢复测试**：AWS Backup 支持定期恢复测试任务，把「备份能不能还原」变成可度量的指标。\n- **SSM 的角色**：恢复流程里的实例配置与补丁由 SSM 接手——恢复出来的实例自动进 State Manager 关联（期望状态节 2.3.5 的机制直接复用）。\n\n**取舍口吻**：备份保留与跨区域复制都直接花钱——保留期越长、区域越多，存储费越高。按合规要求定保留期（如审计要求一年），按 RPO 定频率，别一刀切全量长期跨区备份。\n\n**考试判断**：「集中管理多资源备份并跨区域复制」→ AWS Backup；「对象存储的灾备」→ S3 CRR 或跨区域复制桶策略；「恢复后的实例自动完成配置」→ SSM 关联。错误项常是「写脚本定期手动备份」——考点是托管自动化加可验证。\n\n#### 案例\n\n一个团队 30 类资源的备份散在各服务控制台里，谁也说不清「哪些资源根本没备份」。上 AWS Backup：按重要性分两档备份计划，核心档启用跨区域 vault 复制；两个季度后跑恢复测试，发现三类资源的备份恢复后起不来——依赖的密钥没在备份范围。集中编排的价值不只是省事，是让「没备份」和「备了不能用」都现形。\n\n**关联服务**：AWS Backup、Amazon S3（CRR）、AWS Systems Manager、AWS KMS（备份加密）。\n\n#### 配置负载均衡从后端故障中恢复\n\n**这条在问什么**：后端实例挂了，负载均衡怎么把它摘掉、把流量分给别人。考健康检查与摘除行为的参数细节。\n\n**定义**：负载均衡的后端故障自愈由三件事构成：健康检查发现故障、摘除故障目标、流量再分配。恢复则反过来：实例修好、健康检查通过、自动重新接流量——全程不需要人工动负载均衡。\n\n**机制**：参数决定自愈速度与误杀率：\n\n- **健康检查间隔与阈值**：间隔短、阈值小 → 发现快，但网络抖动易误杀；间隔长 → 摘除慢。常用折中：间隔 10~30 秒，连续 2~3 次失败判定下线。\n- **健康检查端点设计**：检查真实依赖（数据库连通），且与多 AZ 多区域应用节（3.1.8）的「假健康」问题呼应——检查过浅漏判故障，过深又拖慢检查本身。\n- **取消注册延迟（deregistration delay）**：实例下线时给在途请求的收尾时间——设太短，在途请求被掐断；太长，摘除变慢。\n- **与其他层联动**：Auto Scaling 组按 ELB 健康检查替换实例（不只按 EC2 状态），坏实例才会被真替换掉。\n\n**考试判断**：「后端故障后流量仍打到坏实例」→ 健康检查没配或没配对端点；「实例下线时用户请求报错」→ 取消注册延迟太短；「Auto Scaling 没替换坏实例」→ 健康检查类型用的 EC2 而不是 ELB。\n\n#### 案例\n\n一个服务偶发「整台实例挂了但流量还在打」。排查：Auto Scaling 健康检查类型是 EC2（只看实例状态），实例进程僵死但机器还活着——ELB 靠目标组健康检查摘了流量，Auto Scaling 却认为实例健康不替换。改成按 ELB 健康检查替换后：进程僵死 → 摘流量 → 替换实例 → 新实例上线，全程 3 分钟无人工。自愈链路要每一层都接上，断一层就漏。\n\n**关联服务**：Elastic Load Balancing、Amazon EC2 Auto Scaling、Amazon Route 53。\n\n---"}],"tips":{"points":"| 考点 | 内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 韧性档位翻译（3.1.4） | 可用性百分比换算、档位与成本 | ⭐⭐⭐ | 场景选择题 |\n| 单点排查（3.1.5） | 顺藤摸瓜法、数据层优先 | ⭐⭐⭐ | 场景选择题 |\n| 有状态服务复制（3.1.6） | Aurora Global 与 DynamoDB Global Table 分工 | ⭐⭐⭐ | 场景选择题 |\n| 跨区均衡默认值（3.1.7） | ALB 默认开、NLB 默认关 | ⭐⭐ | 场景选择题 |\n| 扩缩指标（3.2.1 / 3.2.6） | CPU 不是万能、队列深度扩消费端 | ⭐⭐⭐ | 场景选择题 |\n| 容器平台选型（3.2.7） | ECS / EKS / Fargate 分工 | ⭐⭐⭐ | 场景选择题 |\n| 无服务器边界（3.2.9） | 超时、并发、预留并发保护下游 | ⭐⭐⭐ | 场景选择题 |\n| 灾备档位（3.3.1 / 3.3.2） | 四档与 RTO/RPO 对应、成本量级 | ⭐⭐⭐ | 场景选择题 |\n| 故障演练（3.3.4） | 演练手段与恢复链路 | ⭐⭐ | 场景选择题 |","services":"| 服务 | 主要用途 | 涉及任务 |\n|---|---|---|\n| Elastic Load Balancing（ALB / NLB） | 跨 AZ 分流与后端自愈 | 3.1、3.3 |\n| Amazon EC2 Auto Scaling | 扩缩与实例替换 | 3.1、3.2 |\n| Amazon Aurora / Amazon RDS | Multi-AZ 与跨区域复制 | 3.1、3.3 |\n| Amazon DynamoDB（Global Table） | 多区域主动-主动 | 3.1、3.2 |\n| Amazon Route 53 | 故障转移与地理路由 | 3.1、3.2、3.3 |\n| Amazon CloudFront | 边缘缓存与全球分发 | 3.1、3.2 |\n| Amazon ECS / Amazon EKS / AWS Fargate | 容器运行时 | 3.2 |\n| Amazon API Gateway / AWS Lambda | 无服务器入口与计算 | 3.2 |\n| Amazon ElastiCache / Amazon SQS / Amazon EventBridge | 缓存与松耦合 | 3.2 |\n| AWS Backup | 集中备份编排与跨区域复制 | 3.3 |\n| AWS Systems Manager | 恢复后配置保持 | 3.3 |"}},{"domain":4,"name":"监控与日志（Monitoring and Logging）","weight":"15%","practice":[{"id":"D4-001","d":4,"t":"single","q":"一家公司在所有 AWS 账户上使用 AWS CloudTrail，并把所有跟踪记录发送到一个集中式 Amazon S3 存储桶。公司通过 S3 事件通知和 AWS Lambda 函数把指定事件发送到第三方日志工具。\n\n公司聘请了安全服务商搭建安全运营中心，服务商希望通过 Amazon SQS 队列接收 CloudTrail 日志。公司必须继续使用 S3 事件通知和 Lambda 函数向第三方工具发送事件。\n\n符合这些要求的最具运营效率的方式是什么？","o":[{"l":"A","t":"在 S3 存储桶中为所有对象创建事件再添加一条额外的通知，把所有对象发送到 SQS 队列。"},{"l":"B","t":"把现有 S3 事件通知目的地替换为 Amazon SNS 主题，将 Lambda 函数和 SQS 队列都订阅到该主题。"},{"l":"C","t":"把现有 S3 事件通知目的地替换为 Amazon Kinesis 数据流，为 Lambda 函数和 SQS 队列分别创建消费者。"},{"l":"D","t":"配置跟踪记录把日志发送到 Amazon CloudWatch Logs，把 SQS 队列订阅到 CloudWatch Logs 日志组。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** S3 事件通知对同一种事件只能配一个目的地，要向多个消费者扇出，标准做法是把通知目的地换成 SNS 主题：Lambda 函数和 SQS 队列分别订阅主题。原有 Lambda 链路照常工作，SQS 消费端即插即用，全程不需要改 Lambda 代码，运营效率最高。\n\n**其他选项为什么错：**\n- A：同一事件的前缀与后缀重叠，S3 会判为「配置定义不明确」而拒绝。\n- C：Kinesis 数据流不是 S3 事件通知的合法目的地。\n- D：SQS 队列不能直接订阅 CloudWatch Logs 日志组，方案不成立。\n\n**关键概念：** S3 通知单目的地限制 → SNS 扇出是接入多消费者的标准解法。","s":"官方样题#6"},{"id":"D4-002","d":4,"t":"multiple","q":"一位 DevOps 工程师在 AWS 上管理一个旧式单体 Windows 应用程序，它运行在单个 Amazon EC2 实例上。应用程序的源代码不可用，无法修改应用。应用存在内存泄漏，当实例内存利用率超过 90% 时就会故障。工程师已在实例上配置统一的 Amazon CloudWatch 代理，收集操作系统的内存利用率指标。\n\n工程师需要实施一个方案防止应用程序故障。哪一组步骤能以最高的运营效率达到要求？（请选择两项）","o":[{"l":"A","t":"创建 Amazon EventBridge 规则，在内存利用率超过 80% 时把事件发布到 Amazon SNS 主题。"},{"l":"B","t":"在 Amazon CloudWatch Logs 中为内存利用率日志创建指标过滤器，在过滤器上创建 CloudWatch 告警，配置告警在内存利用率超过 80% 时发布到 SNS 主题。"},{"l":"C","t":"在内存利用率指标上创建 CloudWatch 告警，配置告警在内存利用率超过 80% 时发布到 SNS 主题。"},{"l":"D","t":"配置 AWS Lambda 函数，通过 AWS Systems Manager Run Command 重启应用程序；把该 Lambda 函数订阅到 SNS 主题。"},{"l":"E","t":"配置 EC2 实例运行重启应用程序的脚本，并把 EC2 实例订阅到 SNS 主题。"}],"a":["C","D"],"e":"**正确答案：C、D。**\n\n**为什么对：** 统一 CloudWatch 代理已把系统级指标发布为 CloudWatch 指标，可直接在指标上建告警，不需要再从日志里造指标；SNS 主题接到告警后，订阅它的 Lambda 函数可通过 Systems Manager Run Command 向实例下发重启命令——源代码不可改也能自动恢复。\n\n**其他选项为什么错：**\n- A：CloudWatch 告警可以直接通知 SNS，多套一层 EventBridge 规则是多余环节，运营效率更低。\n- B：系统级指标已由代理发布，基于日志的指标过滤器属于重复建设。\n- E：EC2 实例不是 SNS 的合法订阅端点，实例无法「订阅」主题。\n\n**关键概念：** 代理指标直接建告警；SNS → Lambda → Run Command 是免改应用的标准自愈链路。","s":"官方样题#10"},{"id":"D4-003","d":4,"t":"single","q":"一个运维团队在为微服务应用设计监控方案。团队里出现了两种意见：一种主张把所有东西都做成指标告警，另一种主张把所有排障都靠翻日志。架构师要求先说清监控的两层数据形态分别适合什么场景，再定方案边界。\n\n关于指标与日志的分工，正确的说法是？","o":[{"l":"A","t":"指标是数字时间序列，体积小、适合告警与画图；日志是事件文本，信息全、适合排障——判断场景先问「要的是数字还是细节」。"},{"l":"B","t":"指标是事件文本，信息全、体积大，适合排障；日志是数字时间序列，适合告警与画图——两者的形态与用途刚好说反。"},{"l":"C","t":"指标与日志形态相同，区别只在采集工具不同，方案里两者可以随意互换，不必分层设计。"},{"l":"D","t":"日志只能按天批量导出后分析，无法支撑实时排障，所以所有排障场景都应该改用指标解决。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文给的两层分野正是这句话：指标是数字时间序列，体积小、适合告警与画图；日志是事件文本，体积大、信息全、适合排障。判断一个场景该用哪层，先问「要的是数字还是细节」——告警看数字、排障看细节。\n\n**其他选项为什么错：**\n- B：把两种形态说反了，按这个方案做，告警链路和排障链路都会建错。\n- C：形态不同决定了工具链不同，随意互换会导致告警没有数据点、排障没有现场文本。\n- D：CloudWatch Logs 本身就是实时接收通道，实时排障正是日志的强项，这条前提就不成立。\n\n**关键概念：** 指标管「多少」（数字序列、告警画图），日志管「发生了什么」（事件文本、排障取证）。","s":"自编·4.1.1"},{"id":"D4-004","d":4,"t":"single","q":"一个交易系统的运维团队在排查线上问题：业务方反馈交易偶尔出现几秒内的短促毛刺，但团队用默认 1 分钟粒度的监控图怎么也看不到异常点。团队要调整指标采集配置，把这种短促毛刺抓住。\n\n最贴合的调整是？","o":[{"l":"A","t":"给指标增加更多维度，把实例、区域都拆开看——维度管的是拆分视角，不改变数据点的时间粒度。"},{"l":"B","t":"把指标的数据点间隔从标准 1 分钟调到高分辨率 1 秒——毛刺只有更细的分辨率才抓得住，代价是存储与查询成本上升。"},{"l":"C","t":"新建一个命名空间存放该指标——命名空间只是容器，与数据点间隔无关，毛刺依旧看不到。"},{"l":"D","t":"把监控图的时间范围拉长到一周再回看——粒度不变，短促毛刺在更长的图上只会被平均得更看不出来。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 短促毛刺抓不住的根因是数据点间隔太粗：标准分辨率 1 分钟，1 秒内出现又消失的尖峰会被一分钟的平均值抹平。把指标采集调到高分辨率 1 秒间隔，毛刺才有独立数据点。代价要讲清：高分辨率存得贵，只对需要抓短促异常的指标开。\n\n**其他选项为什么错：**\n- A：维度是名值对标签，管的是同一指标按实例、按区域拆开看，与时间粒度无关。\n- C：命名空间是容器，只负责归类，解决不了分辨率问题。\n- D：时间范围只是回看窗口，粒度不变毛刺照样被平均掉。\n\n**关键概念：** 分辨率＝数据点间隔：标准 1 分钟、高分辨率 1 秒；抓短促毛刺靠提高分辨率，不靠加维度或换命名空间。","s":"自编·4.1.2"},{"id":"D4-005","d":4,"t":"single","q":"一家公司的应用日志分散在各 EC2 实例本地磁盘上，出事后经常发现日志随实例终止一起丢了。平台团队要求把日志改为持续推送到集中式日志服务，做到接近实时的接收，不再依赖实例存活。\n\n最贴合的采集方式是？","o":[{"l":"A","t":"每天用定时任务把日志文件打包上传到 S3，第二天人工下载排查——批量搬运做不到接近实时，实例终止当天日志就丢。"},{"l":"B","t":"把日志写入实例的临时存储并加大磁盘容量——只是延缓丢失，实例终止时日志照样消失，也没有集中化。"},{"l":"C","t":"在实例上安装 CloudWatch agent，把日志文件持续推送到 CloudWatch Logs——日志服务本身是实时接收通道，实例终止后日志已集中留存。"},{"l":"D","t":"关闭应用日志改为只依赖系统指标告警——指标给不了排障需要的现场细节，等于放弃了日志层。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 题干两个关键词「持续推送、接近实时」正对 CloudWatch agent 加 CloudWatch Logs 的组合：agent 装在实例上把日志推上来，CloudWatch Logs 本身就是实时接收的通道。日志离开实例集中留存后，实例终止不再带走日志。\n\n**其他选项为什么错：**\n- A：定时批量上传既不实时，当天实例终止时未上传的日志仍然丢失。\n- B：临时存储上的日志随实例走，加盘只是延后问题，集中化更无从谈起。\n- D：指标与日志是两层分工，指标告警替代不了排障要的现场文本。\n\n**关键概念：** 实时日志摄取＝agent 推送 + CloudWatch Logs 实时接收；日志先离开实例，才能不被实例生命周期带走。","s":"自编·4.1.3"},{"id":"D4-006","d":4,"t":"multiple","q":"一家金融公司的安全团队在审查日志采集链路的加密方案。日志从各实例经网络送到 CloudWatch Logs，部分归档再落到 S3。合规要求写明：传输过程与静态存储都要有加密措施，静态部分使用可管控的密钥。\n\n以下哪些措施符合要求？（选两项）","o":[{"l":"A","t":"传输段引入自研加密代理做二次封装——TLS 已覆盖传输加密，自研代理徒增维护成本，不是标准做法。"},{"l":"B","t":"采集链路保持 TLS 传输——传输中的加密由 TLS 天然覆盖，这是传输段的正确措施。"},{"l":"C","t":"静态加密等到日志导出到 S3 时再统一处理——日志进入日志组时就应落盘加密，延迟加密会留下明文窗口。"},{"l":"D","t":"日志组与 S3 归档桶分别关联 KMS 密钥（客户托管）——静态加密落在存储侧，客户托管密钥满足「可管控」要求。"},{"l":"E","t":"在应用侧用自研加密库先把日志加密再发送——脱离 KMS 的密钥管理与审计体系，合规角度是倒退。"}],"a":["B","D"],"e":"**正确答案：BD。**\n\n**为什么对：** 正文把加密分两截：传输中靠 TLS 天然覆盖（B）；静态靠 KMS——日志组可关联客户托管密钥，S3 桶支持 SSE-KMS（D）。两段各配各的措施，合规要求「传输与静态都要有、静态可管控」正好被 BD 覆盖。\n\n**其他选项为什么错：**\n- A：TLS 已覆盖传输加密，自研二次封装不解决新问题，还引入单点与维护负担。\n- C：加密发生在日志到达时——数据进日志组即落盘加密，拖到导出阶段意味着日志组里长期明文。\n- E：自研加密脱离 KMS 的审计与轮换体系，密钥管不住比不加密更糟。\n\n**关键概念：** 加密两段式：传输靠 TLS，静态靠 KMS（日志组客户托管密钥 + S3 SSE-KMS）；静态加密在落盘时生效，不是导出时。","s":"自编·4.1.4"},{"id":"D4-007","d":4,"t":"single","q":"一个平台的运维团队给几百台 EC2 统一安装 CloudWatch agent 收集日志，部署后部分实例的日志迟迟没有出现在日志组里。团队检查实例上的报错，发现是采集动作被 IAM 拒绝。要按最小权限原则补齐采集所需的权限。\n\n正确的权限配置是？","o":[{"l":"A","t":"给实例角色附加 AdministratorAccess，先保证日志能收上来再谈收敛——一步到位但爆炸半径失控，违反最小权限原则。"},{"l":"B","t":"只授予 logs:GetLogEvent 读取权限——方向反了，采集是写入动作，读权限帮不了日志推上来。"},{"l":"C","t":"在 S3 桶策略里放行实例角色写日志——日志目标是 CloudWatch Logs 不是 S3，授权对象选错了位置。"},{"l":"D","t":"给实例角色授予日志写入这套最小权限：logs:CreateLogGroup、logs:CreateLogStream、logs:PutLogEvents——采集只需要这几个动作。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 采集日志所需的 IAM 权限就是写入这一套最小集：logs:CreateLogGroup 建组、logs:CreateLogStream 建流、logs:PutLogEvents 写事件。按角色授予这三个动作，agent 即可完成采集，权限面最小。排查思路也顺：被拒先看缺哪个动作，再补哪个动作。\n\n**其他选项为什么错：**\n- A：AdministratorAccess 让实例拿到全账号控制权，日志被拒就这样开权限，以后每个服务都会照此办理。\n- B：读取权限与采集方向相反，写入动作一个都没给。\n- C：S3 桶策略管的是 S3 写入，日志采集目标是 CloudWatch Logs，授权位置错。\n\n**关键概念：** agent 采集最小权限＝logs:CreateLogGroup / CreateLogStream / PutLogEvents；缺哪个动作补哪个，不上通配更不上管理员。","s":"自编·4.1.5"},{"id":"D4-008","d":4,"t":"single","q":"一家公司的审计要求：应用日志集中存储、统一加密、按团队隔离访问——财务团队的日志只有财务角色可读，电商团队日志只有电商角色可读。有人建议给所有运维人员开通 logs 全局通配权限省事，安全团队否决了这一做法。\n\n符合审计要求的配置是？","o":[{"l":"A","t":"IAM 策略按日志组 ARN 收紧读写范围，日志组分别关联 KMS 密钥做静态加密——日志组是权限与保留的独立单元，正好支撑按团队隔离。"},{"l":"B","t":"给所有运维人员开通 logs:* 通配权限，靠事后的 CloudTrail 审计追责——权限先放开再追责，隔离要求已经落空。"},{"l":"C","t":"把两个团队的日志写进同一个日志组，用日志流前缀区分团队——日志组才是权限单元，同组内无法按团队隔离访问。"},{"l":"D","t":"只配加密不配访问控制，理由是「加密了就安全」——加密防的是窃取，防不了内部越权读取，隔离要求没有着落。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 日志组是权限与保留的独立单元——IAM 策略按日志组 ARN 收紧，就能做到按团队隔离；静态加密给日志组关联 KMS 密钥。三个要求（集中存储、统一加密、按团队隔离）逐条落地，且没有用通配放水。\n\n**其他选项为什么错：**\n- B：logs:* 通配把所有日志组的读写都放开，隔离要求直接落空，事后追责替代不了事前控制。\n- C：日志流是组内的时间序列，不是权限边界；同组内隔离做不到。\n- D：加密与访问控制是两件事，只加密解决不了「谁可读」。\n\n**关键概念：** 日志组＝权限与保留的独立单元；隔离靠按组 ARN 收紧 IAM 策略，加密靠组级 KMS，两者配套而非互替。","s":"自编·4.1.6"},{"id":"D4-009","d":4,"t":"single","q":"一家公司的 Lambda 函数与 Route 53 查询日志直写 CloudWatch Logs。审计团队提出：这类服务直写的日志组没有实例角色可以配权限，要确认这类日志的授权方式，避免出现「服务写不进来」或「权限开太大」两个极端。\n\n正确的授权方式是？","o":[{"l":"A","t":"在每个服务控制台里单独给函数挂满权限——分散配置难以审计，且函数角色权限面远超写日志所需。"},{"l":"B","t":"在日志组上配置日志组级资源策略，授权来源服务（如 Lambda、Route 53）直写该组——服务型日志用资源策略授权，不必逐处配角色。"},{"l":"C","t":"把日志组的访问全开成公开可写，让服务都能写进来——写入不设防，任何来源都能污染日志，审计链路失真。"},{"l":"D","t":"禁止服务直写，一律改为人工定期上传日志文件——放弃自动化采集，实时性与完整性都无法保证。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 服务型日志（Lambda、Route 53 查询日志等）直写日志组时，用日志组级资源策略授权来源服务——不需要、也没处给「实例角色」。资源策略精确写明哪个服务的哪个动作可以写哪个组，权限面最小且集中可审计。\n\n**其他选项为什么错：**\n- A：函数角色是业务执行身份，为了写日志把权限挂满，违反最小权限。\n- C：公开可写等于放弃来源控制，日志完整性没有保障。\n- D：人工上传放弃了自动化采集，实时性与完整性双输。\n\n**关键概念：** 服务直写的日志组用日志组级资源策略授权来源服务；实例采集才走 IAM 角色，两条授权路径别混。","s":"自编·4.1.6"},{"id":"D4-010","d":4,"t":"multiple","q":"一个监控平台团队同时要做两件事：从应用访问日志里统计成功率并配告警（日志里没有现成指标）；把 CloudWatch 里已有的全量指标近实时送进第三方监控平台。团队要给两个场景选对工具并理解其机制。\n\n以下哪些说法正确？（选两项）","o":[{"l":"A","t":"从日志统计成功率用指标过滤器——过滤器挂在日志组上，命中模式就把数值发布成自定义指标，可挂告警。"},{"l":"B","t":"指标过滤器会回扫历史日志补发指标——机制上只对新进来的日志生效，历史不补算。"},{"l":"C","t":"把已有指标送第三方用指标流——流把指标近实时持续推送到 Firehose 再转第三方端点，推模式无遗漏、低延迟。"},{"l":"D","t":"指标流会把历史指标一并回补到第三方平台——流只送建立之后的新数据点，不回补历史。"},{"l":"E","t":"两个场景随便用哪个工具都行——一个是从日志造新指标，一个是导出现成指标，方向相反不能互换。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** 正文把这个辨析点名为骨架失分点：指标过滤器**从日志造新指标**——日志里没有现成数字时用它（A）；指标流**导出现成指标**——CloudWatch 已有、要送出去时用它，推模式近实时、无遗漏（C）。一句话判据：造指标用过滤器，送指标用指标流。\n\n**其他选项为什么错：**\n- B：过滤器只对新日志生效，历史日志不会补算——这是高频陷阱。\n- D：指标流不回补历史，历史缺口要用拉取 API 分批取。\n- E：两个工具方向相反，互换会让告警链路与输送链路都建不起来。\n\n**关键概念：** 过滤器＝日志→新指标（造）；指标流＝CloudWatch→外部（送）。题干说「把指标发到 S3/第三方」选指标流，说「从日志提取错误率」选过滤器。","s":"自编·4.1.7"},{"id":"D4-011","d":4,"t":"single","q":"一个团队用指标过滤器统计应用日志里的 ERROR 次数并配了告警。某天 review 配置时发现：上周五修复前的历史日志里有大量 ERROR，但过滤器发布的那几天指标却完全没体现这些历史错误。团队要先弄清过滤器的生效范围再评估统计口径。\n\n正确的理解是？","o":[{"l":"A","t":"过滤器会自动回扫历史日志并补发指标——没有回扫机制，这个理解会让人误判上周错误已被统计。"},{"l":"B","t":"历史日志没被统计是因为过滤器模式写错——模式对不对与历史日志无关，新日志能正常计数就说明模式没坏。"},{"l":"C","t":"指标过滤器只对新进来的日志生效，历史日志不会补算——统计口径从过滤器创建时刻起算，历史错误要另行分析。"},{"l":"D","t":"把过滤器删除重建一次就能补算历史数据——重建同样只对新日志生效，动作本身改变不了生效范围。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 指标过滤器只对**新进来的**日志生效，历史日志不会补算——这是正文点名的高频陷阱。团队看到的现象完全符合机制：过滤器创建之后进来的日志才被计数，上周五之前的 ERROR 不会出现在指标里。统计口径要从创建时刻起算，历史问题用别的工具（如 Insights 查历史段）分析。\n\n**其他选项为什么错：**\n- A：机制上没有回扫，这个理解会直接导致统计口径错误。\n- B：新日志计数正常说明模式有效，问题出在生效范围不在模式。\n- D：删除重建不改变「只对新日志生效」的机制，白折腾一次。\n\n**关键概念：** 指标过滤器生效范围＝创建之后的新日志；历史不补算，历史分析走查询工具。","s":"自编·4.1.7"},{"id":"D4-012","d":4,"t":"single","q":"一个团队给错误日志建了指标过滤器配告警。上线后发现问题：周末没有错误发生，指标图上数据点断线，告警引擎因为「缺数据」无法做出正确判断，值班群里的误报讨论不断。团队要调整过滤器配置让告警判断连续。\n\n正确的调整是？","o":[{"l":"A","t":"给过滤器发布的指标设置默认值（如 0）——无日志时段也有数据点，告警判断保持连续。"},{"l":"B","t":"把告警的评估周期拉长——评估窗口变长不解决「没有数据点」的问题，缺数据的判断照样不连续。"},{"l":"C","t":"让应用每小时输出一行占位日志——在应用侧打补丁绕开配置问题，逻辑分散且依赖应用自觉。"},{"l":"D","t":"把指标过滤器删掉改用 Logs Insights 定时查询——回到人工查询路径，自动告警链路就断了。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文点名的细节：发布指标时要指定默认值——默认值不设，无日志的时段就没有数据点，画图断线、告警判断不连续；设了 0，「错误为零」也是一个明确的数据点，告警引擎可以正常判断。这正是「错误为零也有数据点」考过的场景。\n\n**其他选项为什么错：**\n- B：评估周期是告警侧参数，数据点本身缺失，窗口再长也补不出来。\n- C：占位日志是应用侧补丁，把监控问题转嫁给应用，且占位日志还会污染日志内容。\n- D：Insights 是查询不是持续指标流，替代不了过滤器。\n\n**关键概念：** 指标过滤器要配默认值：无日志时段有数据点，告警判断才连续；这是考过的细节。","s":"自编·4.1.7"}],"sections":[{"h":"配置日志与指标的采集、汇聚与存储","body":"这个域是全考纲条目最多的一块：三个任务 34 个考点，权重却只有 15%。这个反差本身就是最重要的备考信息——它考的是**覆盖面，不是深度**。单域平均下来每个考点不到半道题。命题人把现象撒得很开，看你对每样工具「知不知道它在哪、干什么用」，而不是让你推演深水区的设计题。所以这一域的学习策略和 D2、D3 不一样：不求吃透，求每个名词都能对号入座。\n\n结构是天然的三段流水线：先采集，把散在各处的日志和指标收上来存好；再分析，从存好的数据里看出问题；最后自动化，让系统对发现的问题自己动手反应。三个任务按这个顺序讲，考试题也基本按这个逻辑出——题干往往描述一个采集或存储需求，答案落在服务选型上。\n\n骨架点名的三个失分点都落在细节辨析上。指标过滤器与指标流的用途差别——一个从日志里抠数字，一个把现成指标整流导出。日志组保留期与 S3 生命周期的成本取舍——谁管热数据、谁管冷归档。告警触发 EC2 自动恢复的适用条件——只救硬件级故障，不救应用层故障。这三个点在采集（4.1）与自动化监控（4.3）两节会各讲一次，重复出现是因为考试确实爱考。\n\n#### 这一节学什么\n这一节对应考纲任务 4.1「配置日志与指标的采集、汇聚与存储」。\n\n**这条任务在问什么**：监控的地基是「有数据可看」。云上的日志和指标散落在实例、容器、负载均衡器、数据库里，形态和去向各不相同。这个任务考的是把它们收上来、存下去的完整链路：用什么工具收、存到哪、存多久、加密怎么做。它是整个域的地基，后面分析（4.2）与自动化（4.3）都建立在采集做得对的前提上。\n\n**原理铺垫（本任务 Knowledge 条目并入此处）**：\n\n监控应用与基础设施（4.1.1）的常识底座是两层分野——**指标**是数字时间序列，体积小、适合告警与画图；**日志**是事件文本，体积大、信息全、适合排障。应用层看延迟与错误率，基础设施层看 CPU、内存、磁盘与网络。考试里判断一个场景该用哪层，先问「要的是数字还是细节」。\n\nCloudWatch 指标模型（4.1.2）四个词必须分清。**命名空间**是容器，如 AWS/EC2，自定义指标自己起名。**指标**是某一项的可监控变量。**维度**是名值对标签，同一指标可按实例、按区域拆开看。**分辨率**是数据点间隔——标准 1 分钟、高分辨率 1 秒。高分辨率存得贵、查得快，短促毛刺只有它抓得住。\n\n实时日志摄取（4.1.3）的关键词是「接近实时」：CloudWatch Logs 本身就是实时接收的通道，代理装在实例上把日志推上来。加密（4.1.4）分两截——传输中靠 TLS 天然覆盖，静态靠 KMS：日志组可关联客户托管密钥，S3 桶也支持 SSE-KMS。采集权限（4.1.5）靠 IAM 角色给：CloudWatch agent 要有 logs:CreateLogGroup、CreateLogStream、PutLogEvents 这套最小权限，跨账号收集还要目标侧信任。\n\n#### 安全地存储与管理日志\n\n**这条在问什么**：日志收上来往哪放、怎么放得安全且管得住。考的不是单一动作，是「选存储位置 + 配权限 + 配加密」的组合判断。\n\n**核心机制**：CloudWatch Logs 是第一站——日志组按来源分（如按应用、按环境），日志流是组内的时间序列。要长期留存或做大数据分析，用订阅或导出把它送到 S3。安全三件事：访问控制靠 IAM 策略收紧到具体日志组；静态加密给日志组关联 KMS 密钥；S3 侧用桶策略限定只有日志投递角色能写。\n\n#### 案例\n\n审计要求「应用日志保留三年、只有审计组可读」。做法：日志组保留期设 3 年或定期导出到 S3 归档桶，桶策略只放行审计角色的只读与日志投递角色的写入，两侧都挂客户托管 KMS 密钥。\n\n**考试判断**：题干出现「集中存储、统一加密、按团队隔离访问」——正解是日志组级 KMS + IAM 策略按日志组 ARN 收紧，不是给所有人开 logs:* 通配。\n\n**落地细节**：日志组是权限与保留的独立单元，策略按日志组 ARN 收紧就能做到按团队隔离。服务型日志（如 Lambda、Route 53 查询日志）直写日志组时，可用日志组级资源策略授权来源服务，不用每处配角色。跨账号共享日志时，目标账号的角色要被来源账号信任，两边策略都要对。权限最小化是主旋律：能按组收窄就不放开通配。\n\n**关联服务**：Amazon CloudWatch Logs、AWS KMS、Amazon S3、AWS Identity and Access Management。\n\n#### 用指标过滤器从日志事件生成 CloudWatch 指标\n\n**这条在问什么**：日志里有一些数字（如响应时间、ERROR 出现次数），但日志本身不能触发告警——怎么把文本变成可告警的指标。这是骨架点名的第一个失分点的前半。\n\n**核心机制**：指标过滤器（metric filter）挂在日志组上，定义一个模式（如 ERROR、或带数值的字段），命中后按规则把数值或计数发布成自定义指标。它只对**新进来的**日志生效，历史日志不会补算——这是高频陷阱。\n\n#### 案例\n\n应用日志每行带 `latency=xxx` 字段。建一个指标过滤器提取这个数值，发布成自定义指标 Latency，之后就能在它上面配告警和画图，不需要改应用代码埋点。\n\n**考试判断**：题干要「不改代码、从日志统计某事件的次数并告警」——正解是指标过滤器。选项里若出现「先导出到 S3 再用 Athena 统计」，那是分析不是告警链路，不合题意。\n\n**落地细节**：一个日志组可挂多个过滤器，各发各的指标互不干扰。发布指标时要指定默认值与单位——默认值不设，无日志的时段就没有数据点，画图会断线；设了 0，告警判断才连续。这条细节考过：要「错误为零也有数据点」，就得给默认值。过滤语法支持正则与转义，生僻写法回官方文档核对。\n\n**关联服务**：Amazon CloudWatch Logs（指标过滤器）、Amazon CloudWatch（自定义指标与告警）。\n\n#### 创建 CloudWatch 指标流（S3 或 Firehose）\n\n**这条在问什么**：指标本身存在 CloudWatch 里，第三方监控工具或数据平台要拿走它，怎么持续送出去。这是同一个失分点的后半。\n\n**核心机制**：指标流（metric stream）把账户里（可按命名空间过滤）的指标**近实时**持续推送到目标——Firehose 再转 S3 或第三方端点，或直接经 Firehose 进 OpenSearch。与「用 API GetMetricData 定期拉」的区别：流是推、无遗漏、低延迟；拉是批、要自己管调度和漏抓。\n\n#### 案例\n\n公司用第三方监控平台，要求 AWS 指标 2 分钟内出现在那边。方案是建指标流到 Firehose，Firehose 转 HTTP 端点送第三方；落 S3 的用途则是把指标留给自家数据湖做长期分析。\n\n**考试判断**：与指标过滤器一节（4.1.7）的辨析就考在这里——指标过滤器**从日志造新指标**（日志里没有现成数字时用）；指标流**导出现成指标**（CloudWatch 已有、要送出去时用）。题干说「把指标发到 S3/第三方」，答案是指标流；说「从日志提取错误率」，答案是指标过滤器。\n\n**落地细节**：指标流按收到的指标数据量计费，账户里指标多时是笔持续开销，可用命名空间过滤只导出需要的部分。流建立后持续推送，接收侧靠 Firehose 缓冲落 S3 或转发。与按天拉取 API 相比，延迟与完整性都占优。注意指标流只送建立之后的新数据点，不回补历史。要历史数据，用拉取 API 分批取。Firehose 侧配好缓冲与错误处理，投递失败自动进 S3 备份桶。\n\n**关联服务**：Amazon CloudWatch（指标流）、Amazon Kinesis Data Firehose、Amazon S3、Amazon OpenSearch Service。\n\n#### 采集自定义指标（CloudWatch agent）\n\n**这条在问什么**：实例层面的内存使用、磁盘水位、应用内部计数器，CloudWatch 默认不给或给不全——怎么补上。\n\n**核心机制**：CloudWatch agent 装在 EC2 或本地服务器上，读一份 JSON 配置（agent 配置段管代理行为、metrics 段管收集哪些指标），把操作系统级与应用级自定义指标推到 CloudWatch。内存、磁盘这些默认缺失的指标全靠它。配置可存 SSM Parameter Store，配合 Run Command 或 State Manager 批量下发。\n\n#### 案例\n\n某应用频繁卡死但 EC2 监控页 CPU 很平——CPU 不是瓶颈，是内存耗尽。装 agent 收 MemoryUsed，很快看到内存爬升到顶的曲线，配告警提前介入。\n\n**考试判断**：题干问「如何监控实例内存/磁盘」——正解是装 CloudWatch agent。默认指标里没有这两样，凡是答案里说「直接在控制台看内存」的都是错误项。\n\n**落地细节**：agent 有两份配置——agent 段管代理本身（日志文件路径、是否附加系统日志），metrics 段管收集哪些指标与间隔。配置文件放 SSM Parameter Store，新实例开机即拉取，几百台机器的采集口径就能保持一致。\n\n另一类「无代理」做法是只看 EC2 自带指标，覆盖面窄——题干点名内存、磁盘、进程，答案都要落在装 agent 上。采集间隔可配到 1 秒，但数据点越多费用越高，1 分钟是常用折中。agent 还能顺带收日志，指标与日志一套组件搞定。本地数据中心的服务器也能装 agent，混合场景一个口径收上来。\n\n**关联服务**：Amazon CloudWatch（agent、自定义指标）、AWS Systems Manager（Parameter Store、Run Command）。\n\n#### 管理日志存储生命周期（S3 生命周期、日志组保留期）\n\n**这条在问什么**：日志只进不出，账单就会滚起来。怎么给不同温度的数据配不同寿命——这是骨架点名的第二个失分点。\n\n**核心机制**：两处开关管两个层面。CloudWatch 日志组**保留期**：默认永不过期，可按组设 1 天到 10 年，到期即删——管的是「热区在哪截止」。S3 **生命周期规则**：对导出到 S3 的日志做分层——30 天转低频、90 天转归档、几年后删除——管的是「冷区逐级降成本」。\n\n#### 案例\n\n合规要日志留 1 年但几乎不回查。组合：日志组保留 30 天（近期排障用），订阅导出到 S3，桶上配生命周期 90 天转 Glacier、365 天删除。热数据贵在日志组，冷数据逐级降档，两头都不浪费。\n\n**考试判断**：成本敏感类题目看两问——数据还要不要常查？要，动日志组保留期之外还得看查询走哪（Insights 查日志组、Athena 查 S3）；不要，就让 S3 生命周期把它送进归档。选项里「把日志组保留期设 10 年」这种一刀切，几乎都是贵而错的答案。\n\n**落地细节**：不同日志组可设不同保留期——排障日志 30 天、审计日志按合规要求设长，不必一刀切。另有一个易混点：订阅是持续的实时流，导出任务是一次性的批量搬运，把已存日志搬到 S3——用途不同，别混选。调短保留期即时生效，过期日志立刻删除，动手前先确认没有依赖。S3 生命周期规则可按前缀分开配，不同目录不同待遇。\n\n**关联服务**：Amazon CloudWatch Logs（保留策略）、Amazon S3（生命周期规则）、Amazon S3 Glacier。\n\n#### 用日志订阅处理日志数据（Kinesis / Lambda / OpenSearch）\n\n**这条在问什么**：日志进了 CloudWatch 之后要「边进边处理」——实时转发、实时分析、实时检索，怎么接出去。\n\n**核心机制**：订阅过滤器（subscription filter）挂在日志组或日志流上，把匹配模式的日志实时推给三种目标：Kinesis Data Streams（再分发、多消费者）、Lambda（逐条触发处理函数）、OpenSearch（全文检索与仪表板）。跨账号订阅要走目标侧的共享策略。\n\n#### 案例\n\n安全团队要求「所有含 root 登录的日志出现后 1 分钟内通知」。建订阅过滤器匹配该模式指向 Lambda，Lambda 解析后发 SNS 通知——比定时导出再扫快得多。\n\n**考试判断**：三个目标的分工：要**多下游分发**选 Kinesis，要**轻量触发一段逻辑**选 Lambda，要**全文检索与可视化**选 OpenSearch。题干给「近实时检索分析日志」，别选 Firehose——它是投递管道不是检索工具，这个位置常与订阅流混淆。\n\n**落地细节**：订阅过滤器的模式写法与指标过滤器同源，都是日志模式语法——学一个够两处用。跨账号推送要在目标侧配目的地策略放行来源账号。再记一个辨析：订阅是「边进边推」，导出是「事后批量搬」——题干带「近实时」就选订阅，带「定期归档」就选导出或生命周期。Lambda 目标适合轻量处理：每条日志触发一次，函数里解析、过滤、转发一气呵成。\n\nKinesis 目标可挂多个消费者，各取各的互不抢数据。OpenSearch 目标建索引有延迟，秒级检索需求要先评估容量。\n\n**关联服务**：Amazon CloudWatch Logs（订阅过滤器）、Amazon Kinesis Data Streams、AWS Lambda、Amazon OpenSearch Service。\n\n#### 用过滤与模式语法或 Logs Insights 检索日志\n\n**这条在问什么**：日志海量，怎么快速查到要的那几行。两种工具对应两种习惯。\n\n**核心机制**：控制台的**过滤与模式语法**是即时查——选日志组、选时间段、给一个模式串，逐行匹配，适合临时排障。**Logs Insights** 是查询语言——用类似 SQL 的查询（fields、filter、stats、sort）对日志组做统计聚合，结果可存图表加到仪表板，适合规律性分析与报表。\n\n#### 案例\n\nALB 后端某服务偶发 502。临时排查用模式串直接搜 `502` 拿到原始行；要「过去一周每天 502 的趋势」就写 Insights 查询做 stats count by day——一个是找现场，一个是看趋势。\n\n**考试判断**：题干出现「交互式查询、聚合统计、结果生成图表」——选 Logs Insights；出现「S3 里的日志做 SQL 分析」——那换 Athena（属 4.2 的条目，这里先记下分工）。\n\n**落地细节**：Insights 查询常用四个子句——fields 选字段、filter 加条件、stats 做聚合、sort 排序，练两三个模板够应对考试与日常。查询按扫描的日志量计费，收窄时间段就是省钱。结果可保存为图表放进仪表板，让「查一次」变成「常看一眼」。\n\n两个工具的分工一句话：模式语法按行找现场，Insights 统计看趋势。日常排障先用模式串捞异常行，再看频率分布。Insights 对 JSON 格式日志尤其顺手，字段直接点出来用。查完把查询语句存下来，下次复用不用重写。存下来的语句团队共享，口径统一。\n\n**关联服务**：Amazon CloudWatch Logs（Logs Insights、模式过滤）。\n\n#### 配置日志数据加密（KMS）\n\n**这条在问什么**：合规场景给日志上锁的具体动作，与前述加密铺垫呼应，考的是配置层面的判断。\n\n**核心机制**：日志组创建或更新时关联 **KMS 密钥**——可用 AWS 托管密钥（aws/logs）省事，合规要求管控就上客户托管密钥，并保证调用方（如代理角色）有 encrypt/decrypt 授权。S3 导出侧同理配 SSE-KMS。注意：关联密钥后不可撤销关联，密钥禁用则日志组不可读写——这是考过的边角。\n\n#### 案例\n\n金融客户要求日志静态加密用自家管控的密钥且可审计使用记录。给日志组配客户托管密钥，密钥策略里只授权采集角色与审计角色，CloudTrail 里能看到每次加密调用。\n\n**考试判断**：题干强调「密钥自管、可审计、可轮换」——客户托管 KMS；只说「需要加密」不提管控——托管密钥也行，选最简单够用的。\n\n**落地细节**：加密发生在日志到达时——数据进日志组即落盘加密，不是导出时才加。密钥授权是两层：密钥策略放行使用者，IAM 侧再授加解密权限，缺一边就写不进或读不出。前面提过的边角再强调一遍：日志组关联密钥后不能改回无加密状态，密钥一旦禁用整组日志都读不了——考试考过这个后果判断。客户托管密钥要配轮换计划，密钥管不住比不加密更糟。\n\n**关联服务**：Amazon CloudWatch Logs、AWS Key Management Service、Amazon S3。\n\n---"},{"h":"审计、监控并分析日志与指标以发现问题","body":"#### 这一节学什么\n这一节对应考纲任务 4.2「审计、监控并分析日志与指标以发现问题」。\n\n**这条任务在问什么**：数据收上来之后要看出问题。这个任务考两类动作——「看」的工具有哪些（仪表板、告警、链路追踪、日志查询），以及「审计」走哪条通道（谁在什么时候改了什么配置）。与采集任务的关系是上下游：采集做得全，分析才有的放矢。\n\n**你需要知道的判断依据（本任务 Knowledge 条目汇于此处）**：\n\n异常检测告警（4.2.1）不设固定阈值。CloudWatch 对指标建机器学习模型，按历史形态判断当下是否异常。适合周期性强、阈值难定的指标——流量每天有高峰低谷，静态阈值要么误报要么漏报。\n\n常用指标（4.2.2）要建立「指标—含义」的条件反射：EC2 看 CPU 利用率，RDS 看队列长度（DatabaseConnections、ReadIOPS 与 WriteIOPS 等），ALB 看 5xx 错误数与目标响应时间。考试常给一组指标让你判断瓶颈在哪层——数据库队列涨是库端瓶颈，ALB 5xx 涨是后端应用问题。\n\nInspector（4.2.3）做漏洞与暴露面评估：对 EC2 扫操作系统漏洞与网络可达性，对 ECR 扫镜像漏洞，评估模板管扫什么、多久扫一次。Config 规则（4.2.4）管配置合规——安全组是否放开 22 端口、EBS 是否加密，规则评估资源配置，偏离即标不合规。CloudTrail（4.2.5）记录 API 调用——谁在何时从哪个地址调了什么接口，管理事件默认记录，数据事件要单独开启。三个工具的分工一句话：Config 看配置对不对，Inspector 看漏洞有没有，CloudTrail 看动作谁干的。\n\n#### 建 CloudWatch 仪表板与 QuickSight 可视化\n\n**这条在问什么**：指标和查询结果散在控制台各处。怎么把关键视图拼到一面墙上给团队看？\n\n**核心机制**：CloudWatch 仪表板支持多种组件——折线图、数字卡、日志查询表格、告警状态，可加到告警通知里共享。QuickSight 是 BI 层，连数据源（直接连 CloudWatch 数据源或经 S3/Athena）做深度分析与报表，面向业务侧受众。分工：运维盯仪表板，管理层与业务看 QuickSight。\n\n#### 案例\n\n一支团队每天早会过服务状态。他们建一块仪表板：上半屏 ALB 5xx 与延迟曲线，下半屏各环境部署频率与告警状态。链接投屏，早会十分钟过完，不用轮流登控制台翻。\n\n**考试判断**：题干要「运维团队实时盯服务健康」——CloudWatch 仪表板；要「给管理层出业务报表、跨数据源分析」——QuickSight。别把 BI 工具塞给值班场景。\n\n**落地细节**：仪表板支持跨账号聚合视图，能把多个账号的关键指标拼进一块板——大组织统一盯盘靠它。组件刷新间隔可设，投屏场景开着自动刷新。QuickSight 侧常用做法是数据经 Athena 出结果集再进报表，刷新频率与成本要一起权衡。仪表板可复制成模板，新环境建板不用从零拼。图表数据有几分钟延迟，盯盘要心里有数。数字卡组件盯单一数值最直观。跨区域指标要分别选区域，别漏。\n\n**关联服务**：Amazon CloudWatch（仪表板）、Amazon QuickSight、Amazon Athena。\n\n#### 把告警关联到标准与自定义指标\n\n**这条在问什么**：有了指标还要会配告警——告警挂在哪个指标、什么条件触发、触发后干什么，这是把监控变成行动的接口。\n\n**核心机制**：告警三要素——监控对象（任意标准或自定义指标）、触发条件（阈值或异常检测，跨周期数判连续违例）、触发动作（SNS 通知、Auto Scaling 策略、EC2 恢复或停止等）。状态机三个态：OK、ALARM、INSUFFICIENT_DATA——数据不足也是状态，采集中断时告警不会误触发，但也不报警，排障时别忽略它。\n\n#### 案例\n\n一个队列消费应用，积压深度涨过 1000 持续三个周期就要扩容。在自定义指标上配告警，触发动作绑 Auto Scaling 扩容策略——告警不只发通知，直接驱动动作。\n\n**考试判断**：复合场景拆两问：先选对指标（可能要先用指标过滤器造自定义指标），再选对动作。题干强调「自动处理而不只是通知」，答案是告警联动 Auto Scaling 或 Lambda，单选 SNS 是不完整的。\n\n**落地细节**：告警要挂对维度——同一指标按实例、按环境各有维度组合，维度配错告警就盯错了对象。复合告警能把多个子告警归组管理，一个出事整组报警，是告警风暴减噪的常用手段。缺失数据处理策略可配：数据不足按缺数据处理还是按 OK 处理，直接影响误报。阈值类型选静态还是异常检测，看指标有没有周期形态。\n\n**关联服务**：Amazon CloudWatch（告警）、Amazon SNS、AWS Auto Scaling、AWS Lambda。\n\n#### 为不同服务配置 X-Ray（容器 / API Gateway / Lambda）\n\n**这条在问什么**：微服务一多，一个请求跨七八个服务，出了问题不知道慢在哪段——链路追踪就是给请求发「通行证」，一路盖章记录，谁慢一目了然。\n\n**核心机制**：X-Ray 从 SDK 或代理收集分段（segment），串成追踪（trace），服务地图自动画出调用拓扑。接入方式按计算形态分：EC2 上装 X-Ray 代理并给 SDK 授权；Lambda 开启主动追踪（环境变量配置）；API Gateway 开追踪阶段（生产/暂存）；EKS 与 ECS 用 X-Ray 侧车容器或 DaemonSet 采样。IAM 权限走 XRay write 相关策略。\n\n#### 案例\n\n用户反馈下单接口偶发超时，单服务日志都看不出问题。开 X-Ray 追踪后服务地图显示 98 分位延迟集中在下游支付服务的一段数据库调用——瓶颈锁死，不用逐个服务翻日志。\n\n**考试判断**：题干给「跨服务定位延迟」「分布式追踪」——X-Ray 没有替代品。选项里 CloudWatch Logs Insights 与 Service Health Dashboard 都是干扰项：前者查单点日志，后者是服务健康页，都做不了全链路。配置层面记住各形态的接入开关即可，题目爱考 Lambda 与 API Gateway 的开启动作。\n\n**落地细节**：采样率决定开销——全量采样贵，从 1% 或 5% 起步按需调。追踪数据默认保留 30 天，关键请求可加注解便于事后检索。容器形态记得给任务角色授 X-Ray 写权限，权限漏配是最常见的接入失败原因。排查接入失败先看权限，再看采样。服务地图支持按分组过滤，大拓扑收着看。\n\n**关联服务**：AWS X-Ray、AWS Lambda、Amazon API Gateway、Amazon ECS 与 Amazon EKS。\n\n#### 分析实时日志流（Kinesis Data Streams）\n\n**这条在问什么**：日志量大到单函数处理不过来，或者多个系统都要吃同一份日志流——流式管道怎么搭。\n\n**核心机制**：日志经订阅过滤器进 Kinesis Data Streams，流按分片（shard）保序吞吐，多个消费者可以各自拉取——同步拉（拉取者管游标）或经增强型扇出让每个消费者拿到专属管道。下游接 Lambda、Kinesis Data Analytics 或自研消费者。容量按分片数扩展，热分片要拆分。\n\n#### 案例\n\n一个平台每秒上万条访问日志，安全组与推荐系统都要消费。日志订阅进流，安全组走增强型扇出低延迟读取，推荐组用常规拉取按批消费——一条流喂两边，互不影响。\n\n**考试判断**：与订阅直推 Lambda 的区别在吞吐与多消费者：量小、单一处理逻辑，订阅直推 Lambda 更简单；量大、多个下游，走 Kinesis 流。题干出现「多消费者」「每秒数万条」，答案是流式管道。\n\n**落地细节**：分片是容量单位——每分片写入 1 MB/s、读出 2 MB/s 为基准，不够就拆分或加片。下游消费不动导致积压时，先查检查点游标是否落后，再谈扩容。保留期默认 1 天，可延到 7 天，给下游故障留处理缓冲。增强型扇出走专属管道，每消费者配额独立，高并发场景必选。流内数据按写入顺序保序，乱序需求要在消费端重排。日常要监控流的积压深度。\n\n**关联服务**：Amazon Kinesis Data Streams、AWS Lambda、Amazon Kinesis Data Analytics、Amazon CloudWatch Logs。\n\n#### 用 AWS 服务分析日志（Athena / Logs Insights）\n\n**这条在问什么**：批量日志要出统计结论——历史趋势、错误分布、审计报表，用哪个查询引擎、怎么搭。\n\n**核心机制**：两条路线按日志存放位置分。日志在 CloudWatch 里，用 Logs Insights（前一任务讲过语法，此处补一句：适合快速交互式分析）。日志在 S3 里（长期归档或导出件），用 Athena 直接做 SQL 查询——S3 上的对象建 Glue 数据目录表，Athena 无服务器跑标准 SQL，按扫描量计费，列式压缩（如 Parquet）能大幅降本提速。\n\n#### 案例\n\n审计部门要「过去一年所有 root 用户操作清单」。日志早已按生命周期归档到 S3，用 Glue 建表指向日志目录，Athena 一条 SQL 过滤出 root 相关事件导出——不动原始数据，查询完付扫描费。\n\n**考试判断**：选址口诀——日志在 CloudWatch，用 Insights；日志在 S3 且要 SQL，用 Athena。题干出现「长期归档日志的 SQL 分析」「S3 上的历史日志」，别选 Insights——它查不了 S3。反过来「控制台内交互式查询」别选 Athena——多绕一层。\n\n**落地细节**：Athena 按扫描量计费——表设计成列式压缩格式（如 Parquet）能显著降本提速，大表分区（按日期切目录）是标准动作。Glue 数据目录是 Athena 认表的前提，目录错了查询直接报找不到表。查询超时多是大范围全表扫，先收窄分区再跑。成本大头是全表扫描，建好分区就是省钱。结果集可存进查询结果桶，供下游复用。分区列要和目录结构对齐。\n\n**关联服务**：Amazon Athena、AWS Glue（数据目录）、Amazon CloudWatch Logs（Logs Insights）、Amazon S3。\n\n---"},{"h":"自动化复杂环境的监控与事件管理","body":"#### 这一节学什么\n这一节对应考纲任务 4.3「自动化复杂环境的监控与事件管理」。\n\n**这条任务在问什么**：人盯不过来的时候，让系统自己反应——告警触发动作、配置自动修复、容量自动伸缩。这个任务是整个域的落脚点：采集（4.1）和分析（4.2）都是手段，自动化响应才是考分集中处。四个 Knowledge 条目分别并入对应技能点讲。\n\n#### 配置自动扩缩方案（DynamoDB / ASG / RDS 存储 / ECS capacity provider）\n\n**这条在问什么**：不同类型的资源，扩缩的玩法完全不同。算力靠实例组加机器，数据库靠存储自动加盘，表靠容量模式调整，容器靠集群加节点。这条考的就是把四类扩缩对号入座。\n\n**核心机制**：EC2 Auto Scaling 组按告警或目标追踪策略调整实例数。扩缩策略里目标追踪最常考，如 CPU 保持在 50%——配一个目标值，策略自动算扩缩节奏。RDS 存储自动扩缩给库设存储上限阈值，快满时自动加盘，不打断业务。DynamoDB 有两种容量模式。按需模式请求量随意波动不用管，预置模式配自动扩缩调读写容量。高波动选按需，稳定负载选预置更省。\n\nECS 的 capacity provider 管集群从哪拿算力（Fargate 还是 EC2 组），扩容时按 provider 权重分配任务。\n\n**原理铺垫（条目 4.3.2 并入）**：各类服务的扩缩边界要记牢。ASG 扩的是实例数量，RDS 存储自动扩缩只加盘不改实例规格。DynamoDB 扩的是读写容量，EKS 靠 Cluster Autoscaler 加节点、HPA 调 Pod 副本。考试给「数据库快满了怎么办」，答存储自动扩缩；给「表流量暴涨」，答 DynamoDB 容量模式——扩缩对象选错是常见陷阱。\n\n#### 案例\n\n一个电商应用白天流量是夜间十倍。方案组合：前端 ASG 用目标追踪扩缩实例，DynamoDB 会话表开按需模式扛波动，RDS 主库开存储自动扩缩防大促写爆。三层各自伸缩，互不拖累。\n\n**考试判断**：题干给「按需自动加实例」「保持 CPU 恒定」——目标追踪策略。给「RDS 磁盘快满自动扩」——存储自动扩缩，别选成改实例类型（那是停机操作）。DynamoDB 的题干里出现「不可预测的流量」，按需模式是答案。\n\n**关联服务**：Amazon EC2 Auto Scaling、Amazon RDS、Amazon DynamoDB、Amazon ECS。\n\n#### 建 CloudWatch 自定义指标、指标过滤器、告警与通知（SNS / Lambda）\n\n**这条在问什么**：把采集（4.1）与监控分析（4.2）的能力串成自动化闭环——造指标、配告警、接通知与动作，链路每一段都是考点。\n\n**核心机制**：自定义指标两条路。应用直接 PutMetricData 上报，或指标过滤器从日志里抠——前一域讲过，过滤器造的指标可直接挂告警。告警触发动作按用途选：SNS 发通知给人，Lambda 触发自动处理，Auto Scaling 调容量。\n\n**原理铺垫（条目 4.3.3 并入，骨架失分点三）**：告警的动作清单里有个易错项——EC2 自动恢复。它只适用于 EC2 实例级故障：硬件故障、宿主机失联这类「实例本身挂了」的场景，靠云平台把实例搬到健康宿主机重启。应用层故障（进程崩、返回 5xx）不在它的管辖内——那种要靠 ASG 换实例或健康检查摘流。考试爱用「应用无响应」当题干，这时自动恢复是错误项，正确答案是 ASG 或 ALB 健康检查。\n\n#### 案例\n\n一个支付服务要求「队列积压超阈值自动扩容并通知值班」。指标过滤器从日志统计积压深度，告警触发两个动作——Auto Scaling 策略扩实例、SNS 通知值班群，一条链路全自动。\n\n**考试判断**：题干给「监控应用层错误率并自动处理」，链路是指标过滤器造指标 → 告警 → Lambda/ASG 动作。出现「实例硬件故障自动恢复」才选 EC2 recover 动作——两个场景别接错线。\n\n**关联服务**：Amazon CloudWatch（指标、告警）、Amazon SNS、AWS Lambda、Amazon EC2 Auto Scaling。\n\n#### 配置 S3 事件处理日志文件并投递到其他目标（Lambda / OpenSearch / CloudWatch Logs）\n\n**这条在问什么**：日志先落在 S3（比如别的系统导出的、或生命周期归档的），要「一落桶就处理」——事件驱动的日志管道怎么搭。\n\n**核心机制**：S3 事件通知监听桶内动作（对象创建 s3:ObjectCreated:* 等），触发 Lambda 或发到 SNS/SQS/EventBridge。Lambda 拿到事件后解析日志文件、按需处理或转发。投递目标按用途定：进 OpenSearch 建索引供检索，进 CloudWatch Logs 进监控体系，或转存其他桶。\n\n#### 案例\n\n第三方系统每天把交易日志导出到 S3。桶上配事件通知，对象创建即触发 Lambda。函数解压、解析、按日分区转存进 OpenSearch——审计团队当天就能在检索页查到。不用等批处理。\n\n**考试判断**：题干给「文件到达即处理」——S3 事件通知，没有替代品。给「批量定期处理」——那是定时任务（EventBridge 计划或 Step Functions），别选事件通知。目标端「要检索」进 OpenSearch，「要告警分析」进 CloudWatch。\n\n**落地细节**：事件通知不保证交付——Lambda 失败可配重试与死信队列，关键管道要留失败记录。大文件处理超时是常坑，函数内存与超时要按文件量级给足。同一前缀的事件通知只能配一个目标，要多目标走 EventBridge 中转。还要防递归：处理函数往同一桶写文件会再次触发自己。日志大就先压缩再传，省查询费。事件版本选 2.0，带桶元信息更全。失败要可观测。\n\n**关联服务**：Amazon S3（事件通知）、AWS Lambda、Amazon OpenSearch Service、Amazon CloudWatch Logs。\n\n#### 配置 EventBridge 按事件模式发通知\n\n**这条在问什么**：AWS 环境里会发生各种事件：实例状态变了、安全组改了、自定义业务事件来了。要按模式匹配后自动通知或触发处理，EventBridge 是这套事件路由的中枢。\n\n**核心机制**：EventBridge 有三类事件源——AWS 服务事件（自动进总线）、自定义事件（应用 PutEvents 上报）、第三方 SaaS 事件。规则里写事件模式（JSON 匹配，如指定 source 与 detail-type、detail 里的字段值），匹配即路由到目标：SNS、Lambda、Step Functions、SQS 等。模式支持前缀匹配与数字匹配，精确字段过滤是考点。\n\n**原理铺垫（条目 4.3.1 并入）**：这背后的设计思想是事件驱动异步架构——生产方只管发事件，不关心谁消费；消费方订阅自己关心的模式，彼此解耦。S3 事件通知、EventBridge 到 SNS 或 Lambda 都是这个模式的具体形态。好处是松耦合、易扩展，代价是要处理投递失败与重试——考试问「解耦的事件通知架构」，指名的就是这一套。\n\n#### 案例\n\n合规要求「任何人改动安全组规则要立刻通知安全团队」。EventBridge 规则匹配 CloudTrail 的 AuthorizeSecurityGroupIngress 等事件，目标挂 SNS 主题推给安全群——分钟级到达，比事后翻 CloudTrail 快。\n\n**考试判断**：与 S3 事件通知的分工：只关心某个桶的文件到达，S3 通知够用；要跨服务按复杂模式路由（如「某账号某区域的某类 API 调用」），EventBridge。题干出现「按事件模式匹配」「事件总线」，答案是 EventBridge。\n\n**落地细节**：规则未命中不收费，命中按事件计费——过滤模式写得越准越省钱。归档设置可把匹配事件存进 S3 留证，审计场景常用。\n\n**关联服务**：Amazon EventBridge、Amazon SNS、AWS Lambda、AWS Step Functions。\n\n#### 在 EC2 上安装配置代理（SSM Agent / CloudWatch agent）\n\n**这条在问什么**：实例要被纳管（远程执行、补丁、采集指标日志），代理装没装、配没配好是前提——这条考规模化安装配置的手法。\n\n**核心机制**：SSM Agent 预装在主流 AMI 上，实例挂上带 SSM 权限的实例角色即可被 Session Manager、Run Command、State Manager 纳管——不用开 SSH 端口，审计还全。CloudWatch agent 装上后收内存、磁盘等自定义指标与日志，配置文件集中放 SSM Parameter Store，State Manager 关联保证每台实例配置不漂移。批量安装用 Run Command 一条命令扫全组。\n\n#### 案例\n\n两百台实例要统一加装 CloudWatch agent。做法：agent 配置存 Parameter Store，Run Command 批量执行安装命令，再建 State Manager 关联——新实例自动套用，配置漂移自动纠正，人工只处理失败清单。\n\n**考试判断**：题干给「不开 SSH 远程运维实例」——SSM（Session Manager）；给「统一批量配置管理」——State Manager 关联；给「实例内存监控缺失」——CloudWatch agent。三个代理各管一摊，题干关键词对号。\n\n**落地细节**：Session Manager 会话日志可存 S3 或 CloudWatch，操作留痕审计全满足。实例失联常是两处问题——实例角色没挂对、VPC 没通 SSM 端点，优先查这两处。\n\nRun Command 一次可扫上千实例，分批跑更稳，失败清单人工补齐。补丁基线也是 SSM 的活，Patch Manager 按基线打补丁，维护窗口错峰执行。agent 配置漂移靠 State Manager 兜底，人手改乱了也会被拉回。会话权限走 IAM 策略控制，按用户收紧到具体实例。Port Forwarding 还能穿透到内网端口调试。会话超时一律按安全基线设短，超时即断。\n\n**关联服务**：AWS Systems Manager（Agent、Run Command、State Manager、Parameter Store）、Amazon CloudWatch（agent）。\n\n#### 配置 Config 规则自动修复问题\n\n**这条在问什么**：配置合规不能只标红不处理——发现不合规后自动改回来，这条考的是规则加修复的闭环配置。\n\n**核心机制**：Config 规则评估资源——托管规则覆盖常见场景，自定义规则用 Lambda 写判断逻辑。不合规资源可挂自动修复动作，动作本体是 SSM Automation 文档，按参数对资源执行纠正。例子：把公开桶改回私有、给未加密盘换加密卷。修复可自动触发或人工确认后执行，重试次数可配。\n\n#### 案例\n\n安全基线要求所有 S3 桶禁止公开读写。配托管规则 s3-bucket-public-read-prohibited，挂自动修复动作指向对应 SSM Automation——谁开了公开读，几分钟内自动关掉并留下记录。\n\n**考试判断**：题干给「检测到不合规配置自动纠正」——Config 规则 + 自动修复（SSM Automation）。只要求「检测并通知」用 Config + EventBridge 通知即可，不必上修复。Inspector 扫漏洞、GuardDuty 找威胁，都不做配置修复——选型别串。\n\n**落地细节**：修复动作的资源类型要和规则评估的对象一致，挂错了修复不生效。有风险的动作（如重启数据库）先走人工确认模式，跑顺再开全自动。修复历史留在修复尝试记录里，审计可查。规则按评估条数计费，评估范围写窄一点就省钱。修复动作要幂等，重跑不产生副作用。托管规则优先用，省去自研维护。\n\n**关联服务**：AWS Config（规则、自动修复）、AWS Systems Manager（Automation）、AWS Lambda（自定义规则）。\n\n#### 配置健康检查（Route 53 / ALB）\n\n**这条在问什么**：故障要靠健康检查发现并摘除。负载均衡层的检查管实例摘除，DNS 层的检查管区域级切换。两层检查各管各的，考试爱混着问。\n\n**核心机制**：ALB 目标组健康检查按协议与路径探活。失败连续超阈值即摘除目标，流量转给健康目标——这是实例级自愈的开关。Route 53 健康检查从全球探针发起，检查端点或监控 CloudWatch 告警。配合 DNS 故障转移记录后，主端点挂了自动切备端点。这是区域级容灾的开关。\n\n**原理铺垫（条目 4.3.4 并入）**：两层检查的分工要分清——ALB 检查的是「这个实例能不能服务」，摘除粒度是单个目标；Route 53 检查的是「这个区域整体可不可用」，切换粒度是整个站点。ALB 目标组检查路径要指向真实业务端点（如 /health），探活路径配错会出现「活着但被摘」或「死了还在接流量」两种怪相。\n\n#### 案例\n\n一个双区域部署的应用要求主区域故障时自动切到备区域。Route 53 配主备故障转移记录，各挂对应区域的健康检查。主区域探活失败，DNS 自动解析到备区域。分钟级完成切换，不用人动手。\n\n**考试判断**：题干给「实例挂了自动摘流」——ALB 目标组健康检查；给「主站点挂了 DNS 自动切换」——Route 53 故障转移。多区域容灾题里两层要配合用：区域切换靠 Route 53，区域内实例摘除靠 ALB——只答一层通常不完整。\n\n**关联服务：**Elastic Load Balancing（ALB 目标组）、Amazon Route 53（健康检查、故障转移路由）。\n\n---"}],"tips":{"points":"| 考点 | 一句话记忆 | 出现频率 |\n|---|---|---|\n| 指标过滤器 vs 指标流 | 过滤器从日志造新指标；指标流把现成指标导出 | ⭐⭐⭐ |\n| 日志保留成本取舍 | 热数据动日志组保留期，冷数据走 S3 生命周期降档 | ⭐⭐⭐ |\n| EC2 自动恢复适用条件 | 只救实例级硬件故障；应用层故障走 ASG 或健康检查 | ⭐⭐⭐ |\n| 内存/磁盘监控 | CloudWatch agent，默认指标里没有 | ⭐⭐⭐ |\n| 订阅过滤器三个去向 | 多下游走 Kinesis，轻处理走 Lambda，检索走 OpenSearch | ⭐⭐ |\n| X-Ray 接入 | 分布式追踪无替代品；Lambda 开主动追踪、API Gateway 开阶段追踪 | ⭐⭐ |\n| Athena vs Insights | 日志在 CloudWatch 用 Insights；在 S3 做 SQL 用 Athena | ⭐⭐ |\n| 目标追踪扩缩 | 「保持某指标恒定」＝目标追踪策略 | ⭐⭐ |\n| Config 自动修复 | 检测用规则，修复用 SSM Automation | ⭐⭐ |\n| 两层健康检查 | 实例摘除靠 ALB，区域切换靠 Route 53 | ⭐⭐ |\n| 事件驱动解耦 | 按模式跨服务路由用 EventBridge；单桶文件到达用 S3 事件通知 | ⭐ |\n| 异常检测告警 | 无固定阈值、周期形态指标用它 | ⭐ |","services":"| 服务 | 在本域的角色 |\n|---|---|\n| Amazon CloudWatch | 指标、日志、告警、仪表板、指标流——本域中枢 |\n| Amazon CloudWatch Logs | 日志组、指标过滤器、订阅过滤器、Logs Insights |\n| AWS KMS | 日志与指标静态加密（客户托管/托管密钥） |\n| Amazon S3 | 日志归档、生命周期、Athena 查询源、事件通知 |\n| Amazon Athena + AWS Glue | S3 日志的 SQL 分析与数据目录 |\n| AWS X-Ray | 分布式链路追踪与服务地图 |\n| Amazon Kinesis Data Streams / Data Firehose | 日志与指标的实时流管道与投递 |\n| AWS Lambda | 日志处理、事件响应、自定义指标上报的万能粘合剂 |\n| Amazon EventBridge | 事件总线：按模式路由 AWS/自定义/SaaS 事件 |\n| AWS Systems Manager | 代理纳管、批量命令、状态管理、自动化修复 |\n| AWS Config | 配置合规评估与自动修复 |\n| Amazon EC2 Auto Scaling / RDS / DynamoDB / ECS | 各自形态的自动扩缩能力 |\n| Elastic Load Balancing / Amazon Route 53 | 实例级与区域级健康检查 |\n| Amazon Inspector | 漏洞与暴露面评估 |\n| Amazon SNS | 告警通知与事件推送 |"}},{"domain":5,"name":"事件与事件响应（Incident and Event Response）","weight":"14%","practice":[{"id":"D5-001","d":5,"t":"single","q":"运维值班流程要补一条自动预案：当 AWS 平台侧的维护或服务异常影响到本账户的生产资源时（例如实例所在宿主机即将维护、某服务在区域内异常），系统要能自动收到通告并触发预案处理，不能靠人盯控制台。\n\n该用哪类事件源承担「账户级健康通告」的获取？","o":[{"l":"A","t":"AWS CloudTrail——它记录的是「谁调用了什么 API」的操作历史，平台侧维护通告不在这条流里。"},{"l":"B","t":"AWS Health——它推送账户级健康通告，宿主机维护、区域服务异常这类「平台侧将要发生、影响我账户」的事件由它告知，可经 EventBridge 联动响应。"},{"l":"C","t":"AWS Config——它评估资源配置是否合规、记录配置状态变化，不产生平台健康通告。"},{"l":"D","t":"Amazon CloudWatch Logs——它收集应用与系统日志，日志要自行埋点写入，不天然携带平台侧通告。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** AWS Health 的定位就是账户级健康通告源——宿主机维护、区域服务降级这类平台侧事件，只有它知道，且只推送给受影响的账户；把它的 Health 事件源接进 EventBridge 规则，就能自动触发预案，把平台通告变成自动响应。\n\n**其他选项为什么错：**\n- A：CloudTrail 记录 API 调用，回答的是「谁做了什么操作」，平台侧维护通告不在这条流里。\n- C：Config 管的是配置合规与状态变化，健康通告不是它的产物。\n- D：CloudWatch Logs 是日志归集，需要应用自行写入，平台通告不等于日志。\n\n**关键概念：** 「影响我账户的平台侧通告」找 AWS Health，「API 操作记录」找 CloudTrail——两类事件源在题干里的关键词不同，别混。","s":"自编·5.1.1"},{"id":"D5-002","d":5,"t":"single","q":"安全复盘会上提出一条硬要求：安全组规则被删除这类控制面操作，要能变成事件流接进自动化链路——事件里要能回答「谁在什么时间调用了哪个 API」，事后审计与实时响应都要靠这条流撑起来。\n\n实现这条要求应依赖哪个事件源？","o":[{"l":"A","t":"AWS Health——它只推送平台侧健康通告，不记录用户发起的 API 操作行为。"},{"l":"B","t":"VPC Flow Logs——它记录网络流量的五元组信息，覆盖不到控制面的 API 调用行为。"},{"l":"C","t":"AWS CloudTrail——API 调用被它记录成事件，经 EventBridge 的 CloudTrail 事件源即可被规则匹配，触发相应自动化。"},{"l":"D","t":"AWS Config——它能发现「规则被改了」这一配置状态变化，但事件里回答不了「谁在何时调用了哪个 API」。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 把管理动作变成事件流的正是 CloudTrail——删除安全组规则这类 API 调用都会被记录成事件，管理事件默认可经 EventBridge 被规则匹配，题干要的「谁、何时、哪个 API」字段它都带，接上规则就能驱动自动化。\n\n**其他选项为什么错：**\n- A：Health 只报平台侧健康通告，与 API 审计无关。\n- B：Flow Logs 记录的是网络层流量，不含控制面操作。\n- D：Config 能告诉你配置变成了什么样，但溯源「谁调用的」要靠 CloudTrail。\n\n**关键概念：** 「谁做了什么 API 操作触发自动化」——CloudTrail 事件经 EventBridge；这与「平台侧通告找 Health」是两条不同的接入线。","s":"自编·5.1.1"},{"id":"D5-003","d":5,"t":"single","q":"一个集成平台的架构评审里，团队要给「统一事件入口」选型：AWS 服务自身产生的事件、应用自定义的业务事件、第三方 SaaS 的事件，三类都要汇到一处，再按事件内容匹配规则路由给不同目标。\n\n哪种服务承担这个角色？","o":[{"l":"A","t":"Amazon EventBridge——作为统一事件总线接收 AWS 服务事件、PutEvents 上报的自定义事件与 SaaS 事件，按模式匹配后路由目标。"},{"l":"B","t":"AWS CloudTrail——它只采集 API 调用记录，自定义业务事件与第三方 SaaS 事件不在其范围内。"},{"l":"C","t":"Amazon SNS——它按订阅关系推送通知，不提供按事件内容做模式匹配的路由能力。"},{"l":"D","t":"Amazon Kinesis——它面向连续数据流的有序采集与消费，不适合作为离散事件的模式匹配总线。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** EventBridge 的定位就是事件总线——AWS 服务事件、自定义事件（应用调 PutEvents 上报）、第三方 SaaS 事件三路汇入，规则按 source 与 detail-type 等字段匹配后路由给目标。题干「三类汇入＋按内容匹配路由」就是它的完整画像。\n\n**其他选项为什么错：**\n- B：CloudTrail 只管 API 审计事件，覆盖不了自定义与 SaaS 事件。\n- C：SNS 能做订阅分发，但没有按事件内容匹配规则再路由的引擎。\n- D：Kinesis 处理的是连续流数据，事件总线按离散事件匹配分发的活它不承担。\n\n**关键概念：** 事件总线＝三源汇入＋规则匹配＋目标路由，EventBridge 的一句话定位就是这三个词。","s":"自编·5.1.1"},{"id":"D5-004","d":5,"t":"single","q":"支付平台里「支付成功」这一事件要同时分发给库存、积分、通知三个下游，三者各自独立处理、互不等待，任何一家故障都不影响其余两家收到事件。\n\n这属于事件驱动架构的哪种形态？对应做法是什么？","o":[{"l":"A","t":"队列形态——三个下游从同一条 SQS 队列取消息，谁先取到谁处理，天然实现分发。"},{"l":"B","t":"事件流形态——事件写入 Kinesis 数据流，三个下游按分片顺序依次消费同一份数据。"},{"l":"C","t":"同步调用形态——由调度方依次调用三个下游的接口并等待返回，全部成功才算完成。"},{"l":"D","t":"扇出形态——EventBridge 规则挂多个目标或 SNS 主题挂多个订阅，一个事件同时发给多个下游。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 一个事件同时发多个下游、彼此独立处理，就是扇出；EventBridge 规则挂多目标、SNS 主题挂多订阅都是标准实现。三个下游互不等待，恰好符合扇出「分发」的定位。\n\n**其他选项为什么错：**\n- A：单条队列里的消息被一个消费者取走后就没了，三个下游各自独立拿到同一事件做不到。\n- B：事件流解决的是保序与吞吐，不是多下游独立分发，且「依次消费」与「互不等待」方向相反。\n- C：同步串行一处失败阻塞全链，正是事件驱动要消除的强耦合形态。\n\n**关键概念：** 分发用扇出（SNS/EventBridge 多目标）、保序吞吐用流、削峰用队列——三形态各答一类题。","s":"自编·5.1.2"},{"id":"D5-005","d":5,"t":"single","q":"大促零点秒杀开始，订单事件瞬时洪峰是平时的几十倍，下游风控服务处理能力有限，上一轮大促就因为洪峰直接打进下游被打崩过一次，业务方要求这次必须从架构上解决。\n\n这次要选一种组件，把瞬时洪峰缓冲成下游能平稳消化的速率，最合适的是？","o":[{"l":"A","t":"SQS 队列——事件先入队缓冲，下游消费者按自身节奏拉取消化，洪峰被摊平。"},{"l":"B","t":"SNS 主题——把事件推送给下游订阅，推送节奏跟随上游生产速率同步起伏。"},{"l":"C","t":"Kinesis 数据流——按分片保序分发数据，下游仍要按流入速率处理。"},{"l":"D","t":"EventBridge 规则——按模式匹配把事件路由到目标，路由动作本身不做持久缓冲与排队。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 队列形态解决的就是削峰填谷——SQS 把瞬时高峰先存下来，消费者按自己的处理能力拉取，生产与消费速率解耦，下游不再被洪峰直接冲击。\n\n**其他选项为什么错：**\n- B：SNS 是推送模型，上游来多少推多少，洪峰原样到达下游，起不到缓冲。\n- C：Kinesis 能扛高吞吐，但它的定位是保序流处理；下游按流入速率消费，缓冲削峰不是它答的题。\n- D：EventBridge 负责按规则路由分发，路由动作本身不做持久化排队。\n\n**关键概念：** 削峰找 SQS、分发找 SNS/EventBridge、保序吞吐找 Kinesis——「缓冲成平稳消费速率」这几个字指向队列。","s":"自编·5.1.2"},{"id":"D5-006","d":5,"t":"single","q":"交易对账系统有一条硬要求：交易事件必须严格按发生顺序处理；且每次对账规则升级后，新上线的分析作业要从两天前的事件重新回放一遍来验证正确性。\n\n哪种组件同时满足「保序」与「可回放」两个条件？","o":[{"l":"A","t":"SQS 标准队列——消息按近似顺序传递，消费者处理完消息即出队删除。"},{"l":"B","t":"SNS 主题——消息推送给订阅方，推送顺序与到达顺序都不做保证。"},{"l":"C","t":"Kinesis 数据流——分片内严格保序，数据按保留期保存，新消费者可从保留期内回放历史数据。"},{"l":"D","t":"SQS FIFO 队列——按消息组保序，但消息消费确认后即删除，无法回到两天前重放。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** Kinesis 两个条件都占：分片内数据严格按写入顺序被消费，满足保序；数据按保留期（可延长）保存，新的消费者可以从保留窗口内的任意位置开始重新读取，满足回放。多个消费者互不干扰地读同一份数据也是它的天然能力。\n\n**其他选项为什么错：**\n- A：标准队列不保证严格顺序，第一条就不过关。\n- B：SNS 既不保序也不存储回放，两个条件都不满足。\n- D：FIFO 保序成立，但消息一旦消费确认就删除，没有「回到两天前重放」的能力，第二个条件落空。\n\n**关键概念：** 「保序＋回放＋多消费者」三词齐出，指向 Kinesis；SQS FIFO 只有保序没有回放。","s":"自编·5.1.2"},{"id":"D5-007","d":5,"t":"single","q":"团队在 EventBridge 建了规则想接 AWS Health 的 EC2 维护事件，目标挂了一个 Lambda 函数，上线一周规则从未命中过一次，Lambda 侧也查不到任何调用记录，函数本身单独测试运行正常。\n\n按教材给的排查思路，最可能的原因与第一步动作是什么？","o":[{"l":"A","t":"Lambda 函数超时设置太短——把函数超时上限调大之后继续观察一周。"},{"l":"B","t":"目标执行角色权限不足——给角色补齐权限后再继续观察是否触发。"},{"l":"C","t":"规则目标挂错了服务——把目标从 Lambda 换成 SNS 通知再观察是否触发。"},{"l":"D","t":"事件模式里 source 或 detail-type 写错——模式与实际事件字段不符时规则永不命中，应先用测试事件验证匹配再挂生产目标。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 骨架点名的失分点就是模式匹配语法——EventBridge 按 source 与 detail-type 精确匹配，例如 Health 事件的 source 前缀拼错一个字母，规则就永远不命中，而且不报任何错误，表现就是「从未触发」。教材给的纪律是：规则建好后先用测试事件验证命中，确认匹配正确再挂生产目标。\n\n**其他选项为什么错：**\n- A：函数从未被调用，谈不到超时问题。\n- B：权限不足会发生在「调用目标」这一步，指标与错误日志可见，不是零命中。\n- C：换目标不解决匹配本身的问题，换完照样不命中。\n\n**关键概念：** 模式写错＝静默不命中；排查第一步永远是测试事件验证匹配，而不是换目标或加资源。","s":"自编·5.1.3"},{"id":"D5-008","d":5,"t":"single","q":"应用要把「支付成功」这条业务事件上报到 EventBridge，让下游规则能按事件内容路由。开发同事写完上报代码联调时发现：事件发出去了，规则却始终匹配不到。\n\n按自定义事件的接入要求，上报时最关键的一步是什么？","o":[{"l":"A","t":"把事件体加密后再上报——EventBridge 不要求事件体加密，加密与否不影响规则匹配。"},{"l":"B","t":"调 PutEvents 上报时，entry 里的 source 与 detail-type 要与规则模式中写的值完全一致，写不齐或不一致规则就匹配不到。"},{"l":"C","t":"把事件同时写入 CloudWatch Logs——日志条目不会进入事件总线，规则匹配不到日志。"},{"l":"D","t":"把事件写入 DynamoDB 并配置规则轮询表——EventBridge 不轮询数据库表，这个链路不成立。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 自定义事件的接入口是 EventBridge 的 PutEvents，规则匹配靠的就是 entry 里的 source 与 detail-type 两个字段——它们必须与规则模式中写的值完全一致，少写、拼错、大小写不一致都会导致匹配不到，这正是「模式语法失分点」在自定义事件侧的形态。\n\n**其他选项为什么错：**\n- A：加密是传输安全话题，与模式匹配无关。\n- C：CloudWatch Logs 是日志存储，不进事件总线，规则看不到日志内容。\n- D：事件总线不提供轮询数据库的能力，这条链路本身不成立。\n\n**关键概念：** 自定义事件三要素——PutEvents 上报、source 与 detail-type 写明、与规则模式一致；规则匹配不到先查这两个字段。","s":"自编·5.1.3"},{"id":"D5-009","d":5,"t":"single","q":"一条事件驱动的自动化链路里，「CreateVolume 这类控制面 API 调用」能被 EventBridge 规则正常匹配并触发后续动作，运行一直稳定。团队想在此基础上加一条「S3 对象级读写（GetObject/PutObject）」的匹配规则来监控数据面操作，却发现始终收不到这类事件。\n\n原因是什么？","o":[{"l":"A","t":"规则模式里的事件名要全部改成大写——事件字段有固定格式，改大小写解决不了问题。"},{"l":"B","t":"S3 对象级操作的事件有较长延迟，多等一段时间即可——这不是延迟问题，事件根本没有进入总线。"},{"l":"C","t":"S3 对象级读写属于数据事件，与默认可收的管理事件不同，默认不进入 EventBridge，需要另行开启数据事件记录后再接入。"},{"l":"D","t":"该区域不支持 S3 数据事件——数据事件能力与区域无关，换区域同样收不到。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** CloudTrail 事件分两类：管理事件（控制面 API 调用）默认可经 EventBridge 被规则匹配；数据事件（S3 对象级读写、Lambda 调用等）默认不进入 EventBridge，需要另行开启数据事件记录（如通过 Trail 配置）之后再接入处理管道。题干里管理事件能匹配、对象级操作收不到，正是两类事件的默认行为差异。\n\n**其他选项为什么错：**\n- A：字段大小写与事件是否送达无关。\n- B：事件压根没进总线，等待多久都不会来。\n- D：这是事件类别问题，不是区域支持问题。\n\n**关键概念：** 管理事件默认可收、数据事件默认不收——两者分界是 S5 事件源接入的高频考点。","s":"自编·5.1.3"},{"id":"D5-010","d":5,"t":"single","q":"多账号环境里，账号 A 事件总线上的事件要路由给账号 B 的 Lambda 处理。试投阶段事件始终没有到达账号 B 的函数，A 侧规则状态显示正常，模式本身也用测试事件确认过命中。\n\n按跨账号事件接入的要求，下列哪项是正确做法？","o":[{"l":"A","t":"源账号规则指向目标侧事件总线，目标账号在总线策略上授权源账号投递，同时函数侧资源策略允许该调用——两侧权限缺一不可。"},{"l":"B","t":"只在源账号规则里填上目标函数的完整 ARN 即可——跨账号投递只取决于源侧配置，目标侧默认放行。"},{"l":"C","t":"把 Lambda 函数设为公开可调用——资源策略应针对事件投递来源精确授权，开放公开调用既不安全也不是解决路径。"},{"l":"D","t":"在两个账号里复用同一个 IAM 角色——跨账号投递的授权靠总线策略与资源策略，不靠共用角色。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 教材在跨账号接入处点名「两边策略缺一不可」：源账号的规则要指向目标侧的总线，目标账号的总线策略要授权源账号投递事件，目标动作（函数）的资源策略还要允许事件投递来源调用——任何一侧缺授权，投递都会被拒，表现为事件到不了函数。\n\n**其他选项为什么错：**\n- B：只配源侧、不配目标侧策略，投递会被目标拒绝。\n- C：公开调用偏离了精确授权的要求，且解决不了总线策略缺失。\n- D：复用角色不是跨账号事件授权的机制。\n\n**关键概念：** 跨账号事件链路＝源侧规则＋目标侧总线策略＋目标资源策略，三件配齐才通。","s":"自编·5.1.3"},{"id":"D5-011","d":5,"t":"single","q":"退款流程要五步：收退款事件、查订单、调支付网关、更新库存、发通知；其中调支付网关要配指数退避重试，查订单失败要走补偿分支，大额退款还要插一个人工审批节点，流程上线后要长期无人值守运行。\n\n这套流程用什么搭最合适？","o":[{"l":"A","t":"五个 Lambda 互相调用串联——调用关系与错误处理都写进函数代码自行维护。"},{"l":"B","t":"单个 Lambda 内写完全部五步——一次调用跑完整个流程，逻辑集中在一处。"},{"l":"C","t":"用 SQS 把五步串成消息链——每步消费完把结果作为消息发给下一段。"},{"l":"D","t":"Step Functions 状态机——重试策略、错误分支、审批等待都声明式写进定义，状态由平台保管。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 选型分水岭就是「流程要不要状态」：多步骤、有分支重试、要人工审批，三个特征全占，正是 Step Functions 的地盘——指数退避重试、失败补偿分支、审批挂起等待都能声明式写进状态机定义，步骤顺序与中间状态由平台保管，流程一目了然。\n\n**其他选项为什么错：**\n- A：函数间传上下文、出错重试的幂等保护全要自己写，步骤一多这套代码就是事故源。\n- B：五步长流程塞进单函数，超时与失败重跑粒度太粗，一步失败全部重来。\n- C：队列只传递消息不编排流程，重试、分支、审批仍要自己实现。\n\n**关键概念：** 「多步骤＋重试分支＋审批」＝Step Functions；单步转换才轮到 Lambda 直挂。","s":"自编·5.1.4"},{"id":"D5-012","d":5,"t":"single","q":"对象存储里新上传的对账文件要做一次字段格式转换，然后转发给下游报表系统，流程就此结束——单步转换、无分支、无重试策略要求，也没有需要跨步骤保留的状态，团队希望链路尽量短、运维面尽量小。\n\n最合适的实现是？","o":[{"l":"A","t":"上传事件直接触发单个 Lambda 完成转换与转发，一条直挂链路完事。"},{"l":"B","t":"用 Step Functions 状态机编排转换与转发两个动作——为无状态的简单转换引入状态机是过度设计。"},{"l":"C","t":"先入 SQS 队列再由消费者调 Lambda——为单步转换额外引入队列与消费者，徒增运维面。"},{"l":"D","t":"EventBridge 规则先路由到中转函数、再由中转函数启动 Step Functions——双层中转比直挂多两跳，没有收益。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 两步以内、无状态需求、无分支重试的转换，教材给的口径就是直接 Lambda——单步处理件一次调用完成，链路最短、运维面最小。事件直接触发函数即可，不需要中间编排层。\n\n**其他选项为什么错：**\n- B：Step Functions 的价值在状态管理与编排，这里没有状态要管，引入状态机徒增成本。\n- C：没有洪峰要缓冲、没有解耦需求，队列在这里是多余的组件。\n- D：双层中转把一条直挂链路人为拉长，每一跳都是新的失败点。\n\n**关键概念：** 与 D5-011 对照记忆——多步有状态上 Step Functions，单步转换 Lambda 直挂；反过来就是过度设计。","s":"自编·5.1.4"}],"sections":[{"h":"管理事件源，按事件处理、通知并响应","body":"这个域只有 14 个条目，权重 14%，条均密度全考纲最高。每个考点被单独考到的概率不小，不能用 D4「广撒网」的策略对付。要按「每个条目都能当一道完整题」来准备。它考两件事：事件来了系统怎么自己动，失败之后人怎么找到根因。\n\n与 D4 的关系是上下游延伸：前一域讲告警能触发什么动作，本域讲事件怎么组织成完整工作流（5.1）、事件怎么反过来改配置（5.2）、以及失败之后怎么查（5.3）。三个任务连起来就是一条真实故障链——从事件产生到自动响应再到事后排障，骨架也建议用「扩缩容失败」这类真实场景串讲。\n\n骨架点名的三个失分点都在辨析上。EventBridge 事件模式匹配语法——匹配规则写错就路由不到。Step Functions 与 Lambda 的编排选型——多步骤状态管理谁来做。部署失败与运行时失败的排查路径——两条路起点不同，考试爱混着出。\n\n#### 这一节学什么\n这一节对应考纲任务 5.1「管理事件源，按事件处理、通知并响应」。\n\n**这条任务在问什么**：AWS 环境里每天产生海量事件——实例状态变化、配置变更、健康通告、应用自定义事件。这个任务考的是认得清事件从哪来，以及把事件接成「处理—通知—响应」工作流的手法。它是后面两个任务的地基：事件源接对了，才有后续的自动改配置和排障。\n\n**原理铺垫（本任务 Knowledge 条目并入此处）**：\n\n事件源地图（5.1.1）要建立三源分类的直觉。**AWS Health** 推送账户级健康通告——你的某个实例所在宿主机要维护了、某服务在你的区域出问题了，这类「平台侧将要发生的事」只有它知道。**CloudTrail** 记录 API 调用，把管理动作变成事件——配了组织级 Trail 的账户，谁删了安全组规则都会变成一条事件流。**EventBridge** 是总线：AWS 服务事件、自定义事件、第三方 SaaS 事件都汇到这里，规则匹配后路由给目标。\n\n事件驱动架构（5.1.2）三种形态要能对号。**扇出**（fan out）是一个事件同时发多个下游——EventBridge 规则挂多目标或 SNS 多订阅。**事件流**是连续数据按顺序流经消费者——Kinesis 系。**队列**是削峰填谷——SQS 把瞬时高峰缓冲成平稳消费速率。三种形态解决三种问题：分发、保序吞吐、缓冲。\n\n#### 集成 AWS 事件源（Health / EventBridge / CloudTrail）\n\n**这条在问什么**：把三类事件源真正接到自己的自动化里——不是「知道有这个服务」，而是「事件怎么进我的规则、我的函数」。\n\n**核心机制**：三源的接入方式各有差异，这是考点所在。AWS Health 的事件经 EventBridge 的 AWS Health 事件源接收——要在 EventBridge 规则里指定 Health 的 source 前缀，就能把「你的账户受影响」的事件筛出来联动响应。CloudTrail 侧：管理事件默认可经 EventBridge 收（走 CloudTrail 事件源），数据事件要开组织级 Trail 落 S3 后再接管道。自定义事件由应用调 EventBridge PutEvents 上报，写明 source 与 detail-type 供规则匹配。\n\n#### 案例\n\n一个团队要求「平台侧维护影响生产实例时自动处理」。他们在 EventBridge 建规则匹配 AWS Health 事件源里 EC2 维护类事件，目标挂 Lambda——函数判断实例所属环境，生产实例提前换组、非生产忽略。平台通告变成了自动预案。\n\n**考试判断**：题干给「AWS 通知你账户受某事件影响并自动响应」——AWS Health 经 EventBridge。给「谁做了什么 API 操作触发自动化」——CloudTrail 事件经 EventBridge。两类事件源在题干里的关键词是「影响我账户」与「API 操作」。\n\n**落地细节**：EventBridge 规则匹配 Health 事件要写对 source 与 detail-type，写错规则永远不命中——这正是骨架点名的模式语法失分点。规则建好后先用测试事件验证命中，再挂生产目标。跨账号事件接入要在目标侧配权限，两边策略缺一不可。规则命名规范先定，排障时好找。\n\n**关联服务**：AWS Health、Amazon EventBridge、AWS CloudTrail、AWS Lambda。\n\n#### 搭建事件处理工作流（SQS / Kinesis / SNS / Lambda / Step Functions）\n\n**这条在问什么**：事件接进来之后，处理流程怎么组织——单步就完事的和要分多步协调的，选什么件来搭。这是骨架失分点「Step Functions 与 Lambda 编排选型」的落点。\n\n**核心机制**：组件按角色分。**SNS** 是通知与扇出的发布订阅中枢，推给邮件、短信、队列、函数。**SQS** 是缓冲队列，消费者按自己的节奏拉取，标准队列保吞吐不保序、FIFO 队列保序去重。**Kinesis** 是有序流，适合多消费者回放场景。\n\n**Lambda** 是单步处理件。**Step Functions** 是状态机编排件——把多步骤流程写成可视化状态机，管理步骤顺序、重试、分支、并行，状态由它保管。选型的分水岭就是「流程要不要状态」：两步以内的转换直接 Lambda；超过三步、有分支重试、要人工审批节点，就上 Step Functions。\n\n**原理补充**：Lambda 编排的坑是自己管状态——函数间传上下文要么塞进事件要么存外部存储，出错重试要自己写幂等保护。步骤一多，这套代码就是事故源。Step Functions 把重试策略、错误分支声明式写进状态机定义，流程一目了然。\n\n#### 案例\n\n一个订单退款流程要五步：收退款事件、查订单、调支付网关、更新库存、发通知。用 Step Functions 串成状态机：支付网关那步配指数退避重试，查订单失败走补偿分支，人工审批节点卡在大额退款。事件进来流程自动跑，失败自动走分支。\n\n**考试判断**：题干给「多步骤、有分支、要重试策略、要审批」——Step Functions。给「单函数转个格式发个通知」——Lambda 直挂。给「削峰」——SQS，给「多下游同时收」——SNS 扇出。五个组件各答一类题，别混。\n\n**关联服务**：Amazon SNS、Amazon SQS、Amazon Kinesis、AWS Lambda、AWS Step Functions。\n\n---"},{"h":"按事件实施配置变更","body":"#### 这一节学什么\n这一节对应考纲任务 5.2「按事件实施配置变更」。\n\n**这条任务在问什么**：事件不只是用来通知的——收到事件之后自动改配置、改基础设施、把系统拉回期望状态，这是「自动修复」的核心链路。这个任务考的是从「事件发生」到「变更落地」的完整执行手法，以及变更失败后怎么补救。它与 D2 的配置管理、D4 的 Config 修复是一脉：那边讲工具，这边讲事件驱动的自动化闭环。\n\n**原理铺垫（本任务 Knowledge 条目并入此处）**：\n\n机群管理服务（5.2.1）两件套——**Systems Manager** 管「对实例做什么」（Run Command 批量执行、State Manager 保持状态、Automation 跑复杂运维流程），**Auto Scaling** 管「实例数量与放哪儿」。前者是动作执行器，后者是容量调节器。\n\n配置管理服务（5.2.2）以 Config 为核心——规则评估资源配置是否合规，评估结果可以挂自动修复（SSM Automation 做动作）。这条链在 D4 已铺过，本任务从「事件驱动」角度重新组装它。配置漂移本身就是一个事件，修复是被事件触发的响应。\n\n#### 向系统应用配置变更\n\n**这条在问什么**：把配置变更可靠地铺到一批系统上——不是改一台，是改一个机群，还要改得可追踪、可回滚。\n\n**核心机制**：SSM 是主执行器。Run Command 一次性下发命令，目标按标签、按资源组圈定，输出可回查。State Manager 用关联（association）声明「这台实例应该是什么状态」，定时评估，漂移即纠正——它是「保持」而不是「变更一次」。Automation 文档把多步骤运维动作（如滚动重启、证书轮换）写成可参数化的剧本，带审批节点与失败分支。变更的模板化靠参数与文档版本，回滚靠版本切换。\n\n#### 案例\n\n安全组要求全机群统一某条内核参数。做法：参数与脚本存版本库，Automation 文档封装「下载脚本、改配置、验证、失败回滚」四步，Run Command 按标签批量执行——变更留痕、失败自动回滚，操作员只看报告。\n\n**考试判断**：题干给「一次性变更一个机群」——Run Command；给「持续保持某状态」——State Manager 关联；给「多步骤、带审批与回滚的变更」——Automation 文档。三个执行件粒度不同，按「变一次、一直保持、流程化」对号。\n\n**落地细节**：变更窗口要可控——Run Command 支持维护窗口调度，Automation 支持审批节点。变更前先在灰度标签的少量实例上试跑，通过再铺全量。执行输出按实例逐台留档，事后抽查方便。变更清单先评审，动作才上机。\n\n**关联服务**：AWS Systems Manager（Run Command、State Manager、Automation）、AWS CloudFormation（模板变更）。\n\n#### 按事件修改基础设施配置\n\n**这条在问什么**：把「事件发生」和「基础设施变更」连起来——事件触发后自动调整资源配置，形成无人值守的响应链。\n\n**核心机制**：链路是「事件 → EventBridge 规则 → 目标动作」。目标动作按变更对象选：改实例配置走 SSM Run Command 或 Automation；改资源属性走 Lambda 调 API；改模板化资源走 CloudFormation 变更集。Auto Sc
