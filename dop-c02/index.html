function renderQuiz() {
  const el = document.getElementById('page-quiz');
  if(!quizState || !quizState.questions.length) {
    el.innerHTML = `<div class="header"><button class="back-btn" onclick="navigate('dashboard')">←</button><h1>刷题</h1></div>
    <p style="text-align:center;margin-top:60px;color:var(--text2)">暂无题目，请从仪表盘选择模式开始练习</p>`;
    return;
  }
  const q = quizState.questions[quizState.currentIdx];
  const isHot = q.t === 'hot';
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  // 考核=仅本场作答；练习模式=全局历史（含本场）——防练习记录串进考核视图
  const answers = sessionScopedAnswers();
  const prevAnswers = answers.filter(a=>a.id===q.id);
  const everCorrect = prevAnswers.some(a=>a.ok);
  const everWrong = prevAnswers.some(a=>!a.ok);
  const answered = quizState.answered || {};
  let userAns = answered[q.id];
  const finished = quizState.submitted && quizState.submitted[q.id];
  const correct = finished && isAnswerCorrect(q, userAns);

  let modeLabel = quizState.mode==='exam'?'📋 模拟考核':quizState.mode==='wrong'?'❌ 错题重练':quizState.mode==='domain'?'📖 章节练习':quizState.mode==='single'?'📝 单题练习':'📝 顺序练习';

  let html = `<div class="quiz-header">
    <button class="back-btn" onclick="exitQuiz()">←</button>
    <span style="font-weight:600;font-size:15px">${modeLabel}</span>
    ${quizState.mode==='exam'?`<span class="timer" id="quizTimer"></span>`:''}
    <span class="quiz-progress">${quizState.currentIdx+1}/${quizState.questions.length}</span>
  </div>`;
  html += `<div class="quiz-meta">
    <span class="domain-tag">Domain ${q.d}</span>
    <span>${DOMAIN_NAMES[q.d]}</span>
    <span>${TYPE_NAMES[q.t]}</span>
    ${everCorrect?'<span style="background:rgba(6,214,160,.15);color:var(--correct)">已答对</span>':''}
    ${everWrong?'<span style="background:rgba(239,71,111,.15);color:var(--wrong)">曾答错</span>':''}
  </div>`;
  html += `<div class="question-text">${q.q}</div>`;

  const renderOpts = getOptionsHTML(q, userAns, finished, correct, getShuffledAnswer(q));
  html += renderOpts;

  if(isHot) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?'▶ 完成返回':'▶ 下一题'}</button>
    </div>`;
  } else if(!finished) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>✅ 确认</button>
    </div>`;
  } else {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?(quizState.mode==='exam'?'📊 交卷查看成绩':'▶ 完成返回'):'▶ 下一题'}</button>
    </div>`;
  }

  if(finished) {
    const badge = correct ? '✅ 回答正确!' : '❌ 回答错误';
    const cls = correct ? 'correct' : 'wrong';
    const gItems = getGlossaryForQuestion(q);
    let gHtml = '';
    if(gItems.length) {
      gHtml = '<div class="glossary"><div class="glossary-title">词汇附录</div>';
      gItems.forEach(g => {
        gHtml += '<div class="glossary-item"><span class="glossary-term">' + g.term + '</span><span class="glossary-def">\u00a0\u2014\u00a0' + g.def.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span></div>';
      });
      gHtml += '</div>';
    }
    html += `<div class="explanation show">
      <div class="result-badge ${cls}">${badge}</div>
      <div class="exp-text"><strong>正确答案：</strong>${formatAnswer(q)}</div>
      <div class="exp-text" style="margin-top:8px"><strong>解析：</strong>${highlightGlossaryTerms(fmtExp(q.e))}</div>
      ${q.s?`<div class="exp-source">来源：${q.s}</div>`:''}
      ${gHtml}
    </div>`;
  }

  html += `<div class="qnav"><h4>题号导航</h4><div class="qnav-grid">`;
  quizState.questions.forEach((qq, i) => {
    const qAnswers = answers.filter(a=>a.id===qq.id);
    const qCor = qAnswers.some(a=>a.ok);
    const qWro = qAnswers.some(a=>!a.ok);
    let cls = '';
    if(i===quizState.currentIdx) cls='current';
    else if(qCor) cls='done-correct';
    else if(qWro) cls='done-wrong';
    html += `<div class="qnav-item ${cls}" onclick="jumpToQuestion(${i})">${i+1}</div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
  if(!finished) updateSubmitButton();
}

function getOptionsHTML(q, userAns, finished, correct, shuffledAns) {
  let html = '';
  const qtype = q.t;
  if(qtype === 'hot') {
    html += `<div class="options-list" style="background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:16px">
      <div style="font-weight:600;color:var(--primary);margin-bottom:8px">🖱 本题为拖拽/操作题（HOTSPOT）</div>
      <div style="font-size:13px;line-height:1.7;color:var(--text2)">本题无标准 A/B/C/D 选项，答题形式为图形拖拽/区域选择。题目与图形见源 PDF 原图，答案请参照源文件。</div>`;
    if(q.e) {
      html += `<div style="margin-top:10px;font-size:13px;line-height:1.7;color:var(--text2);border-top:1px solid var(--border);padding-top:10px"><strong>解析/提示：</strong><br>${highlightGlossaryTerms(fmtExp(q.e))}</div>`;
    }
    html += `</div>`;
    return html;
  }
  if(qtype === 'single' || qtype === 'multiple') {
    const isMulti = qtype === 'multiple';
    html += `<div class="options-list">`;
    const opts = quizState.shuffledOptions && quizState.shuffledOptions[q.id] ? quizState.shuffledOptions[q.id] : q.o;
    opts.forEach(o => {
      const isSelected = userAns && userAns.includes(o.l);
      let cls = 'option-item';
      if(isMulti) cls += ' multi';
      if(isSelected && !finished) cls += ' selected';
      if(finished) {
        if(shuffledAns.includes(o.l)) cls += ' correct';
        else if(isSelected) cls += ' wrong';
      }
      const onclick = finished ? '' : `toggleOption('${o.l}')`;
      html += `<div class="${cls}" onclick="${onclick}">
        <span class="opt-label">${o.l}</span>
        <span>${o.t}</span>
      </div>`;
    });
    html += `</div>`;
    if(isMulti && !finished) html += `<div style="font-size:13px;color:var(--text2);margin-top:-12px;margin-bottom:16px">多选——请选择所有正确答案后提交（至少选 2 项）</div>`;
  }
  return html;
}

/* ================================================================
   ===================== 交互逻辑 =================================
   ================================================================ */

function toggleOption(label) {
  const q = quizState.questions[quizState.currentIdx];
  if(!quizState.answered) quizState.answered = {};
  if(q.t==='single') {
    quizState.answered[q.id] = [label];
  } else {
    const arr = quizState.answered[q.id] || [];
    const idx = arr.indexOf(label);
    if(idx>=0) arr.splice(idx,1);
    else arr.push(label);
    quizState.answered[q.id] = arr;
  }
  renderQuiz();
}

function updateSubmitButton() {
  const q = quizState.questions[quizState.currentIdx];
  if(q.t === 'hot') return;
  const ans = quizState.answered && quizState.answered[q.id];
  const btn = document.getElementById('submitBtn');
  if(!btn) return;
  if(q.t==='single') btn.disabled = !ans || !ans.length;
  else if(q.t==='multiple') btn.disabled = !ans || ans.length < 2;
}

function getShuffledAnswer(q) {
  if(quizState && quizState.shuffledAnswers && quizState.shuffledAnswers[q.id]) {
    return quizState.shuffledAnswers[q.id];
  }
  return q.a;
}

function isAnswerCorrect(q, userAns) {
  if(!userAns) return false;
  const ca = getShuffledAnswer(q);
  if(q.t==='single') return userAns[0]===ca[0];
  if(q.t==='multiple') { const a=[...userAns].sort(); const b=[...ca].sort(); return JSON.stringify(a)===JSON.stringify(b); }
  return false;
}

function formatAnswer(q) {
  const ca = getShuffledAnswer(q);
  if(q.t==='single'||q.t==='multiple') return ca.join(', ');
  if(q.t==='hot') return '本题为拖拽/操作题，答案为图形区域匹配，见源 PDF 原图';
  return '';
}

function submitAnswer() {
  const q = quizState.questions[quizState.currentIdx];
  let userAns = quizState.answered && quizState.answered[q.id];
  if(!userAns) return;
  if(q.t==='multiple' && userAns.length < 2) {
    alert('多选题至少选择 2 个答案，当前只选了' + userAns.length + '个');
    return;
  }
  const correct = isAnswerCorrect(q, userAns);
  if(!quizState.submitted) quizState.submitted={};
  quizState.submitted[q.id]=true;
  // 本场作答留痕（考核判分唯一依据；不与全局统计混用）
  if(!quizState.results) quizState.results={};
  quizState.results[q.id]={ua:[...userAns], ok:correct, ts:Date.now()};
  recordAnswer(q.id, userAns, correct);
  renderQuiz();
  updateSubmitButton();
}

function prevQuestion() {
  if(quizState.currentIdx > 0) { quizState.currentIdx--; renderQuiz(); }
}
function nextQuestion() {
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  if(isLast) {
    if(quizState.mode==='exam') renderExamResult();
    else navigate('dashboard');
  } else {
    quizState.currentIdx++;
    renderQuiz();
  }
}
function jumpToQuestion(idx) {
  quizState.currentIdx = idx;
  renderQuiz();
}
function exitQuiz() {
  // 考核中途退出必须停表：否则过期计时器归零时会把之后的练习页改写成「考核成绩单」
  if(quizState && quizState.mode==='exam') stopExamTimer();
  if(quizState && quizState.mode!=='exam') {
    setProgress({mode:quizState.mode,domain:quizState.domain||null,idx:quizState.currentIdx,time:Date.now()});
  }
  quizState = null;
  navigate('dashboard');
}

/* ================================================================
   ===================== 刷题模式启动 ==============================
   ================================================================ */
function startDomain(d) {
  const qs = QUESTIONS.filter(q=>q.d===d);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'domain',domain:d,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startContinue() {
  const p = getProgress();
  if(p.mode && p.mode!=='exam') {
    if(p.mode==='domain' && p.domain) {
      const qs = QUESTIONS.filter(q=>q.d===p.domain);
      const _sr=generateShuffledOptions(qs);
      quizState = {mode:'domain',domain:p.domain,questions:qs,currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    } else {
      const _sr=generateShuffledOptions([...QUESTIONS]);
      quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    }
  } else {
    const _sr=generateShuffledOptions([...QUESTIONS]);
    quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  }
  navigate('quiz');
}
function startWrongReview() {
  const wrong = getWrong().filter(w=>!w.mastered);
  if(!wrong.length) { alert('暂无错题需要复习！'); return; }
  const qs = wrong.map(w=>getQById(w.id)).filter(Boolean);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'wrong',domain:null,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startSingle(id) {
  const q = getQById(id);
  if(!q) return;
  const _sr=generateShuffledOptions([q]);
  quizState = {mode:'single',domain:null,questions:[q],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startExam() {
  // 模拟考核：按 meta 权重 × meta 题数分配各域配额（最大余数法，保证总和=EXAM_COUNT）
  const counts = {};
  let sumInt = 0;
  const raw = {}, rem = {};
  DOMAIN_KEYS.forEach(k => {
    const w = parseFloat(String(DOMAIN_WEIGHTS[k]||'0').replace('%',''))/100;
    raw[k] = w * EXAM_COUNT;
    counts[k] = Math.floor(raw[k]);
    rem[k] = raw[k] - counts[k];
    sumInt += counts[k];
  });
  let deficit = EXAM_COUNT - sumInt;
  const order = [...DOMAIN_KEYS].sort((a,b)=>rem[b]-rem[a]);
  let i = 0;
  while(deficit > 0) { counts[order[i % order.length]]++; deficit--; i++; }
  let selected = [];
  DOMAIN_KEYS.forEach(d => {
    const pool = shuffle(QUESTIONS.filter(q=>q.d===d && q.t!=='hot'));
    selected.push(...pool.slice(0, counts[d]));
  });
  selected = shuffle(selected);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam',domain:null,questions:selected,currentIdx:0,answered:{},submitted:{},results:{},shuffledOptions:_exam.opts,shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  // 场次标识：计时回调据此判定「本场是否仍在进行」，防过期计时器串场
  quizState.examToken = 'ex-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

function startRealExam() {
  // 全真模考：固定用模考池出卷（题数/计分结构/时长按官方口径），每次只重排题序与选项。
  // 与随机模考的区别：题目固定可复现，分数可跨场对比；题目与练习池隔离，平时练不到。
  const pool = MOCK_QUESTIONS.slice();
  if(!pool.length) { alert('本卷未配置模考池，请用随机模考'); return; }
  const selected = shuffle(pool);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam', fullMock:true, domain:null, questions:selected, currentIdx:0, answered:{}, submitted:{}, shuffledOptions:_exam.opts, shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  quizState.examToken = 'mx-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

let examTimerInterval = null;
function stopExamTimer() {
  if(examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
}
function startExamTimer() {
  let secs = quizState.examDuration;
  const token = quizState.examToken;
  const timerEl = document.getElementById('quizTimer');
  if(!timerEl) return;
  stopExamTimer();
  examTimerInterval = setInterval(() => {
    // 场次校验：已退出或已换场（新 token）立即自毁
    if(!quizState || quizState.mode!=='exam' || quizState.examToken!==token) { stopExamTimer(); return; }
    secs--;
    const m = Math.floor(secs/60), s = secs%60;
    const el = document.getElementById('quizTimer');
    if(el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if(secs<=60 && el) el.classList.add('warning');
    if(secs<=0) { stopExamTimer(); finishExam(token); }
  }, 1000);
}

function finishExam(token) {
  stopExamTimer();
  // 只对「发起本场计时」的考核会话生效
  if(quizState && quizState.mode==='exam' && (token===undefined || quizState.examToken===token)) renderExamResult();
}

function renderExamResult() {
  if(!quizState) return;
  stopExamTimer();
  const qs = quizState.questions;
  const results = quizState.results || {};
  const fullMock = !!quizState.fullMock;
  // 全真模考按官方口径只判计分题（50 题）；随机模考与其它模式仍整卷计分
  const counted = fullMock ? qs.filter(q => MOCK_SCORED.has(q.id)) : qs;
  const total = counted.length;
  // 逐题按本场作答判分；全局历史与往场作答一律不计
  let correct = 0, wrong = 0, unanswered = 0;
  const domStat = {};
  DOMAIN_KEYS.forEach(d => domStat[d] = {n:0, cor:0});
  counted.forEach(q => {
    if(!domStat[q.d]) domStat[q.d] = {n:0, cor:0};
    domStat[q.d].n++;
    const r = results[q.id];
    if(!r) unanswered++;
    else if(r.ok) { correct++; domStat[q.d].cor++; }
    else wrong++;
  });
  // 不变量自校验：正确 + 错误 + 未答 必须等于计分题数
  if(correct + wrong + unanswered !== total) console.warn('[exam] 判分不变量异常', {correct, wrong, unanswered, total});
  const el = document.getElementById('page-quiz');
  const pct = total ? Math.round(correct/total*100) : 0;
  // 1000-point scale, 700 to pass
  const scaledScore = total ? Math.round(correct/total*1000) : 0;
  const passed = scaledScore >= EXAM_PASS;
  // Time used
  const timeUsed = quizState.examStartTime ? Math.round((Date.now()-quizState.examStartTime)/1000) : 0;
  const timeM = Math.floor(timeUsed/60), timeS = timeUsed%60;

  // Domain breakdown
  let domainHtml = '';
  for(const d of DOMAIN_KEYS) {
    const dd = domStat[d] || {n:0, cor:0};
    const dPct = dd.n ? Math.round(dd.cor/dd.n*100) : 0;
    domainHtml += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${dd.n}</td><td>${dd.cor}</td><td style="color:${dPct>=70?'var(--correct)':'var(--wrong)'}">${dPct}%</td></tr>`;
  }

  el.innerHTML = `<div class="header"><button class="back-btn" onclick="exitExam()">←</button><h1>${fullMock ? '🎯 全真模考成绩单' : '📋 考核成绩单'}</h1></div>
  <div style="text-align:center;padding:30px 20px">
    <div style="font-size:48px;font-weight:700;color:${passed?'var(--correct)':'var(--wrong)'}">${scaledScore}</div>
    <div style="font-size:14px;color:var(--text2);margin:4px 0">满分 1000 分 | 及格线 ${EXAM_PASS} 分${fullMock ? " | 计分题 " + total + " 题（卷面 " + qs.length + " 题，不计分 " + (qs.length - total) + " 题）" : ""}</div>
    <div style="font-size:16px;color:var(--text);margin:12px 0;font-weight:600">${passed?'✅ 通过！':'❌ 未通过'}</div>
    <div style="display:flex;justify-content:center;gap:20px;margin:16px 0;flex-wrap:wrap">
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--correct)">${correct}</div><div style="font-size:12px;color:var(--text2)">正确</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--wrong)">${wrong}</div><div style="font-size:12px;color:var(--text2)">错误</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text2)">${unanswered}</div><div style="font-size:12px;color:var(--text2)">未答</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--primary)">${pct}%</div><div style="font-size:12px;color:var(--text2)">正确率</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text)">${timeM}分${timeS.toString().padStart(2,'0')}秒</div><div style="font-size:12px;color:var(--text2)">用时</div></div>
    </div>
  </div>
  <div class="stats-chart">
    <h3>各章节成绩</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>题数</th><th>正确</th><th>正确率</th></tr></thead><tbody>
    ${domainHtml}
    </tbody></table>
  </div>
  <div style="text-align:center;padding:20px">
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn-secondary" onclick="exitExam()" style="width:auto">返回首页</button>
      <button class="btn-primary" onclick="${fullMock ? 'startRealExam()' : 'startExam()'}" style="width:auto;flex:none">再考一次</button>
    </div>
  </div>`;
  quizState = null;
}

function exitExam() {
  quizState = null;
  navigate('dashboard');
}

let wrongFilter = 0;

function renderWrongBook() {

  const el = document.getElementById('page-wrongbook');

  html += `<div class="wrong-stats">
    <div class="stat-card"><div class="stat-num">${wrong.length}</div><div class="stat-label">待复习</div></div>
    <div class="stat-card"><div class="stat-num">${mastered.length}</div><div class="stat-label">已掌握</div></div>
    <div class="stat-card"><div class="stat-num">${wrong.length+mastered.length}</div><div class="stat-label">共错题</div></div>
  </div>`;
  html += `<div class="wrong-tabs">
    <button class="wrong-tab ${wrongFilter===0?'active':''}" onclick="wrongFilter=0;renderWrongBook()">全部</button>`;
  for(const d of DOMAIN_KEYS) {
    html += `<button class="wrong-tab ${wrongFilter===d?'active':''}" onclick="wrongFilter=${d};renderWrongBook()">${DOMAIN_NAMES[d]}</button>`;
  }
  html += `</div>`;
  let items = wrongFilter ? wrong.filter(w=>{const q=getQById(w.id);return q&&q.d===wrongFilter}) : wrong;
  items.sort((a,b)=>b.count-a.count);
  if(!items.length) {
    html += `<p style="text-align:center;margin-top:40px;color:var(--text2)">🎉 暂无错题！</p>`;
  } else {
    items.forEach(w=>{
      const q = getQById(w.id);
      if(!q) return;
      html += `<div class="wrong-item">
        <div class="wi-header">
          <span><strong>Domain ${q.d}</strong> | ${TYPE_NAMES[q.t]}</span>
          <span style="color:var(--wrong)">答错${w.count}次</span>
        </div>
        <div style="font-size:14px;margin-bottom:6px">${q.q.slice(0,60)}${q.q.length>60?'…':''}</div>
        <div style="font-size:12px;color:var(--text2)">最近答错：${new Date(w.last).toLocaleString()}</div>
        <div class="wi-actions">
          <button onclick="startSingle('${w.id}')">📝 重练本题</button>
          <button onclick="markMastered('${w.id}');renderWrongBook()">✅ 标记已掌握</button>
          <button onclick="removeWrong('${w.id}');renderWrongBook()">🗑️ 移除</button>

    html += `<div style="margin-top:20px"><h3 style="font-size:14px;margin-bottom:8px;color:var(--text2)">已掌握 (${mastered.length})</h3>`;
    html += `<button class="btn-secondary" onclick="if(confirm('确定清空所有已掌握的错题吗？')){setWrong(getWrong().filter(w=>!w.mastered));renderWrongBook();}" style="width:auto">清空已掌握</button></div>`;
  }
  el.innerHTML = html;
}

function renderStats() {
  const s = getStats();
  const el = document.getElementById('page-stats');
  let html = `<div class="header"><h1>📊 统计分析</h1></div>`;
  html += `<div class="stats-chart">
    <h3>总进度</h3>
    <div style="height:30px;background:var(--border);border-radius:15px;overflow:hidden">
      <div style="height:100%;width:${s.completion}%;background:var(--primary);border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600">${s.completion}%</div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--text2)">
      <span>已答 ${s.doneIds}/${QUESTIONS.length} 题</span>
      <span>正确率 ${s.acc}%</span>
    </div>
  </div>`;
  html += `<div class="stats-chart"><h3>各章节正确率</h3><canvas id="chartDomain"></canvas></div>`;
  html += `<div class="stats-chart"><h3>各题型正确率</h3><canvas id="chartType"></canvas></div>`;
  html += `<div class="stats-chart"><h3>详细数据</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>总题</th><th>已答</th><th>正确</th><th>正确率</th></tr></thead><tbody>`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${ds.total}</td><td>${ds.answered}</td><td>${ds.correct}</td><td style="color:${ds.acc>=70?'var(--correct)':'var(--wrong)'};font-weight:600">${ds.acc}%</td></tr>`;
  }
  html += `</tbody></table></div>`;
  el.innerHTML = html;
  setTimeout(() => {
    drawDomainChart(s);
    drawTypeChart(s);
  }, 50);
}

function drawDomainChart(s) {
  const c = document.getElementById('chartDomain');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = DOMAIN_KEYS.map(k=>'D'+k);
  const colors = ['#4361ee','#4cc9f0','#06d6a0','#f8961e','#9b5de5'];
  const barW = (W-80) / (labels.length*1.5);
  labels.forEach((l,i)=>{
    const val = s.domainStats[i+1].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(l, x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

function drawTypeChart(s) {
  const c = document.getElementById('chartType');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = ['单选','多选'];
  const keys = ['single','multiple'];
  const colors = ['#4361ee','#4cc9f0'];
  const barW = (W-80) / 4;
  keys.forEach((k,i)=>{
    const val = s.typeStats[k].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

/* roundRect polyfill */
if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(r>w/2) r=w/2;
    if(r>h/2) r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    return this;
  };
}

/* ================================================================
   ===================== 工具函数 ==================================
   ================================================================ */
function exportData() {
  const data = {
    answers: getAnswers(),
    wrong: getWrong(),
    progress: getProgress(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${LS_PREFIX}-quiz-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.answers) setAnswers(data.answers);
        if(data.wrong) setWrong(data.wrong);
        if(data.progress) setProgress(data.progress);
        alert('数据导入成功！');
        navigate(currentPage);
      } catch(err) { alert('数据格式错误，请检查文件。'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetData() {
  showModal('确认重置', '确定要清除所有答题记录、错题集和进度吗？此操作不可恢复！', () => {
    localStorage.removeItem(LS_ANSWERS);
    localStorage.removeItem(LS_WRONG);
    localStorage.removeItem(LS_PROGRESS);
    navigate('dashboard');
  });
}

let modalCallback = null;
function showModal(title, text, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOverlay').classList.add('show');
  modalCallback = onConfirm;
  document.getElementById('modalConfirmBtn').onclick = () => {
    closeModal();
    if(modalCallback) modalCallback();
  };
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

/* ================================================================
   ===================== 主题切换 ==================================
   ================================================================ */
function toggleTheme() {
  document.getElementById('quizView').classList.toggle('dark');
  localStorage.setItem(LS_PREFIX+'_theme', document.getElementById('quizView').classList.contains('dark')?'dark':'light');
  navigate(currentPage);
}

/* ================================================================
   ===================== 初始化 ====================================
   ================================================================ */
function init() {
  if(localStorage.getItem(LS_PREFIX+'_theme')==='dark') document.getElementById('quizView').classList.add('dark');
  const pages = ['dashboard','quiz','wrongbook','stats','settings'];
  const app = document.getElementById('app');
  pages.forEach(p => {
    const div = document.createElement('div');
    div.id = 'page-'+p;
    div.className = 'page' + (p==='dashboard'?' active':'');
    app.appendChild(div);
  });
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => { if(btn.dataset.page==='learn'){ if(window.kbShowLearnHome) window.kbShowLearnHome(); } else navigate(btn.dataset.page); });
  });
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', init);

 · 定义云基础设施与可复用组件，覆盖系统全生命周期 / 为复杂任务与大规模环境设计自动化方案","focus":"官方权重 17%","domain":2},{"day":4,"topic":"D2 配置管理与基础设施即代码（Configuration Management and IaC） · 在多账号或多区域环境中自动化创建、纳管与加固账号","focus":"本章练习 12 题","domain":2},{"day":5,"topic":"D3 弹性云方案（Resilient Cloud Solutions） · 实施满足韧性与业务需求的高可用方案 / 实施满足 RTO/RPO 的自动恢复流程","focus":"官方权重 15%","domain":3},{"day":6,"topic":"D3 弹性云方案（Resilient Cloud Solutions） · 实施满足业务需求的可伸缩方案","focus":"本章练习 12 题","domain":3},{"day":7,"topic":"D4 监控与日志（Monitoring and Logging） · 配置日志与指标的采集、汇聚与存储 / 自动化复杂环境的监控与事件管理","focus":"官方权重 15%","domain":4},{"day":8,"topic":"D4 监控与日志（Monitoring and Logging） · 审计、监控并分析日志与指标以发现问题","focus":"本章练习 12 题","domain":4},{"day":9,"topic":"D5 事件与事件响应（Incident and Event Response） · 管理事件源，按事件处理、通知并响应 / 排障系统与应用故障","focus":"官方权重 14%","domain":5},{"day":10,"topic":"D5 事件与事件响应（Incident and Event Response） · 按事件实施配置变更","focus":"本章练习 12 题","domain":5},{"day":11,"topic":"D6 安全与合规（Security and Compliance） · 实施规模化的身份与访问管理技术 / 实施安全监控与审计方案","focus":"官方权重 17%","domain":6},{"day":12,"topic":"D6 安全与合规（Security and Compliance） · 为安全控制与数据保护应用自动化","focus":"本章练习 12 题","domain":6}],"planAuto":true},"chapters":[{"domain":1,"name":"SDLC 自动化（SDLC Automation）","weight":"22%","practice":[{"id":"D1-001","d":1,"t":"single","q":"一家公司在 AWS CodeCommit 中管理应用程序的源代码，并通过 AWS CodePipeline 为应用程序创建 CI/CD 流水线。当 CodeCommit 存储库的主分支发生变化时，流水线必须自动启动。每天都会频繁发生变更，流水线必须尽可能地快速响应。\n\nDevOps 工程师应采取什么措施来达到这些要求？","o":[{"l":"A","t":"配置流水线定期检查存储库的主分支是否存在变更，在检测到变更时启动流水线。"},{"l":"B","t":"配置 Amazon EventBridge（Amazon CloudWatch Events）规则以检测存储库主分支的变更，配置流水线响应变更而启动。"},{"l":"C","t":"配置存储库定期运行 AWS Lambda 函数，由该函数检查存储库的主分支并在检测到变更时启动流水线。"},{"l":"D","t":"配置存储库在主分支发生变更时向 Amazon SNS 主题发布通知，并为流水线订阅该 SNS 主题。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** CodeCommit 的仓库事件会直接发布到 Amazon EventBridge，事件规则匹配主分支变更后，可把 CodePipeline 直接设为目标触发启动。变更产生事件、事件直启流水线，中间没有轮询间隔，是给定选项中响应最快的方式，也是官方推荐方案。\n\n**其他选项为什么错：**\n- A：定期检查能用，但不是事件驱动——变更要等下一次轮询才被发现，频繁变更下延迟不可控。\n- C：CodeCommit 不支持由存储库定期运行 Lambda 函数，该功能不存在。\n- D：SNS 通知不是启动流水线的有效途径，CodePipeline 不通过订阅 SNS 主题来启动。\n\n**关键概念：** 仓库变更 → EventBridge 规则 → 流水线启动，是 CI/CD 事件驱动触发的主流模式。","s":"官方样题#1"},{"id":"D1-002","d":1,"t":"single","q":"一家公司正在使用 AWS CodeBuild 构建应用程序。公司策略要求对所有构建工件进行静态加密，并且必须限制工件的访问权限——仅允许操作 IAM 组中有权承担操作 IAM 角色的 IAM 用户访问工件。\n\n哪一种解决方案符合这些要求？","o":[{"l":"A","t":"在 CodeBuild 构建规范中添加构建后命令，将构建工件推送到 Amazon S3 存储桶；设置存储桶策略，防止不含 x-amz-server-side-encryption 标头的请求上传到存储桶；为所有引用操作 IAM 组的 NotPrincipal 元素的操作添加 Deny 语句。"},{"l":"B","t":"在 CodeBuild 构建规范中添加构建后命令，将构建工件推送到 Amazon S3 存储桶；配置 S3 事件通知调用 AWS Lambda 函数，由该函数获取对象、加密后放回存储桶并打上加密标签；设置带 Deny 语句的存储桶策略，NotPrincipal 引用操作 IAM 组，并在条件元素中引用加密标签。"},{"l":"C","t":"在 CodeBuild 构建规范中增加构建后命令，将构建工件推送到启用了 S3 默认加密的 Amazon S3 存储桶；设置存储桶策略，对所有引用操作 IAM 角色的 NotPrincipal 元素的操作包含 Deny 语句。"},{"l":"D","t":"在 CodeBuild 构建规范中添加构建后命令，调用 AWS KMS Encrypt API 操作，将工件用指定的 KMS 密钥加密后推送到 Amazon S3 存储桶；将操作 IAM 组设置为该 KMS 密钥的唯一用户。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** S3 默认加密保证所有上传的对象静态加密，不需要额外的构建逻辑；存储桶策略用 NotPrincipal 指向操作 IAM 角色——只有能承担该角色的请求才被允许访问，其余全部拒绝。权限边界一次配置长期生效，正好对上「通过角色授权访问」的要求。\n\n**其他选项为什么错：**\n- A、B：存储桶策略引用的是 IAM 组而不是角色，与题干「IAM 组中能承担角色的用户访问」的授权模型不符。\n- A：AWS 建议使用默认加密，而不是用存储桶策略强制加密标头。\n- B：事件通知触发加密之间存在时间窗口，工件会短暂以未加密状态落盘。\n- D：KMS Encrypt API 适合加密明文值（如密码），不适合加密构建工件文件、归档或对象。\n\n**关键概念：** S3 默认加密 + 基于 IAM 角色的 NotPrincipal Deny，是制品仓库加密与访问控制的官方推荐组合。","s":"官方样题#3"},{"id":"D1-003","d":1,"t":"multiple","q":"一个 DevOps 工程师需要为 AWS 上的应用程序实施蓝/绿部署流程，必须逐步转移两个环境之间的流量。\n\n该应用程序运行在 Application Load Balancer（ALB）后面的 Amazon EC2 实例上，实例位于 Amazon EC2 Auto Scaling 组中。应用程序将数据存储在 Amazon RDS 多可用区数据库实例中，Amazon Route 53 提供外部 DNS。\n\nDevOps 工程师应采取哪一组步骤以符合这些要求？（请选择三项）","o":[{"l":"A","t":"在同一个 ALB 后面创建第二个 Auto Scaling 组。"},{"l":"B","t":"在第二个 ALB 后面创建第二个 Auto Scaling 组。"},{"l":"C","t":"在 Route 53 中创建指向新环境的第二个别名记录，使用故障转移路由策略在两条记录之间选择。"},{"l":"D","t":"在 Route 53 中创建指向新环境的第二个别名记录，使用加权路由策略在两条记录之间选择。"},{"l":"E","t":"配置新的 EC2 实例以使用主 RDS 数据库实例。"},{"l":"F","t":"配置新的 EC2 实例以使用备用 RDS 数据库实例。"}],"a":["B","D","E"],"e":"**正确答案：B、D、E。**\n\n**为什么对：** 蓝/绿部署由两个独立环境组成：蓝环境承载现网版本，绿环境承载新版本，各自挂在独立 ALB 后面。Route 53 用加权路由策略在两条别名记录之间逐步调整权重，即可把流量从蓝慢慢切到绿；两套环境都指向同一个主 RDS 数据库，保证割接期间数据一致。\n\n**其他选项为什么错：**\n- A：两个环境共用一个 ALB，就没有两个可被 Route 53 选择的终端节点，无法逐步转移。\n- C：故障转移路由只在健康检查失败时整体切换，做不到按权重渐进放量。\n- F：RDS 多可用区实例的备用库是热备，不接受读写。\n\n**关键概念：** 蓝/绿 = 双环境 + 加权 DNS 渐进切流 + 共享主库；备用实例不承载读写。","s":"官方样题#4"},{"id":"D1-004","d":1,"t":"single","q":"一家公司在公用 Application Load Balancer（ALB）后面的一组 Amazon EC2 实例上运行旧式 API。ALB 启用了访问日志并将日志存储在 Amazon S3 中。该 API 通过主机名 api.example.com 访问，Amazon Route 53 管理该主机名。\n\n开发人员用 AWS Lambda 函数重建了五个 API 终端节点。一位 DevOps 工程师想用有限的随机客户流量测试新 Lambda 函数的功能。为了确保与现有日志处理服务兼容，此次测试不能影响 ALB 访问日志。\n\nDevOps 工程师应如何执行此次测试以达到这些要求？","o":[{"l":"A","t":"将五个 Lambda 函数作为目标添加到 EC2 实例所在的现有目标组中，将每个 Lambda 目标在目标组中的权重设为低于 EC2 实例目标，并修改 ALB 的默认规则以启用目标组级粘性。"},{"l":"B","t":"创建单个目标组，包含全部 Lambda 函数作为目标。在 ALB 上创建带主机标头条件的侦听器规则匹配 API 终端节点的主机名，将目标组加入规则并设置比默认规则目标组更低的权重。"},{"l":"C","t":"为每个 Lambda 函数创建新的 ALB 和新目标组，创建带主机标头条件的侦听器规则转发流量；新建 Route 53 别名记录权重设为 10，把 api.example.com 的现有记录权重设为 90。"},{"l":"D","t":"为每个 Lambda 函数创建一个新的目标组。在 ALB 上创建带路径条件的侦听器规则匹配各终端节点，并在规则内对 Lambda 函数目标组与基于实例的目标组进行加权转发。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 加权分流只能在同一条侦听器规则内的多个目标组之间进行，这正对应金丝雀式小流量测试；五个终端节点各有自己的路径，用路径条件逐一区分。整个方案复用现有 ALB，访问日志仍由同一个 ALB 产生，与现有日志处理服务保持兼容。\n\n**其他选项为什么错：**\n- A、B：一个目标组只能注册一个 Lambda 函数，无法把五个函数放进同一个目标组。\n- A：目标组级粘性会抵消加权分流的小流量测试效果。\n- C：新建 ALB 会因新的负载均衡器 ID 产生不同的访问日志，破坏与现有日志处理的兼容；主机标头条件也做不了 URI 级别的分流。\n\n**关键概念：** ALB 侦听器规则内的加权目标组＝金丝雀测试；一个目标组只能注册一个 Lambda 函数。","s":"官方样题#9"},{"id":"D1-005","d":1,"t":"single","q":"一家公司的 DevOps 团队要为软件交付流程引入自动化：开发人员每次提交代码后，系统自动执行单元测试与代码扫描，全部通过后自动构建容器镜像并推送镜像仓库。\n\n这套自动化主要覆盖 SDLC 的哪两个阶段？","o":[{"l":"A","t":"编码与发布"},{"l":"B","t":"构建与测试"},{"l":"C","t":"测试与运维"},{"l":"D","t":"计划与编码"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 提交后自动跑单元测试与代码扫描属于测试阶段；全部通过后构建镜像并推送镜像仓库属于构建阶段。这两个动作都发生在代码提交与发布之间，对应的自动化工具正是 CodeBuild 与流水线的测试、构建阶段。\n\n**其他选项为什么错：**\n- A：发布指把版本部署到生产环境，题干动作还没有走到发布。\n- C：运维阶段是系统上线后的监控与维护，与提交后的动作无关。\n- D：编码是开发人员写代码本身，计划是需求与方案阶段，都不在提交之后发生。\n\n**关键概念：** SDLC 判断法——先判断动作属于哪个阶段，再选自动化工具，方向就不会错。","s":"自编·1.1.1"},{"id":"D1-006","d":1,"t":"single","q":"一家公司采用多账号布局：开发、测试、生产各一个账号，CI/CD 流水线集中在工具账号。\n\n关于这种布局，下列说法正确的是？","o":[{"l":"A","t":"每个环境账号都应各自搭建流水线，让构建凭据分散在各账号，更安全。"},{"l":"B","t":"流水线应随环境复制三条，每条只部署自己的环境，才能实现权限隔离。"},{"l":"C","t":"一条流水线串多个阶段，各阶段使用对应目标账号的角色执行部署；生产账号不持有源码与构建凭据，爆炸半径更小。"},{"l":"D","t":"工具账号的流水线可以直接使用生产账号 IAM 用户的长期访问密钥完成部署。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 多账号布局的要点是流水线本身不随环境复制——一条流水线的每个阶段用对应目标账号的 IAM 角色执行部署。源码与构建凭据留在工具账号，生产账号只暴露必要的部署角色，权限边界小、爆炸半径小。\n\n**其他选项为什么错：**\n- A：凭据分散恰恰扩大了泄露面，与「收敛凭据」的目标相反。\n- B：复制三条流水线要维护三份配置，也没有解决凭据收敛问题。\n- D：长期访问密钥是 IAM 安全红线，跨账号部署应该用 IAM 角色而不是密钥。\n\n**关键概念：** 流水线集中 + 跨账号角色，是多账号 CI/CD 的主流形态。","s":"自编·1.1.2"},{"id":"D1-007","d":1,"t":"single","q":"一家公司的容器回滚频繁出问题：回滚后运行的镜像不是预期版本。排查发现，同名镜像标签每次构建都会被新镜像覆盖，回滚依据的标签内容已经变了。\n\n为从根本上消除这个隐患，最直接的措施是？","o":[{"l":"A","t":"在 Amazon ECR 开启不可变标签（image tag immutability），并配置生命周期策略自动清理过期镜像。"},{"l":"B","t":"要求每次发布前人工核对镜像摘要（digest）。"},{"l":"C","t":"关闭 ECR 仓库的跨账号访问权限。"},{"l":"D","t":"把镜像改存到 Amazon S3，用对象版本控制替代镜像仓库。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 不可变标签让同名标签一旦推送就不可覆盖——任何重复推送直接失败，标签永远指向同一个镜像内容，回滚依据从此可靠。生命周期策略配合清理过期层与旧镜像，把存储成本一并管住。\n\n**其他选项为什么错：**\n- B：人工核对治标不治本，靠自觉的流程迟早会漏。\n- C：跨账号访问与标签覆盖无关，关掉不解决问题还破坏部署链路。\n- D：镜像仓库的职责 ECR 已原生承担，搬到 S3 失去镜像管理能力。\n\n**关键概念：** 不可变标签是镜像仓库的生产必备配置；生命周期策略管成本。","s":"自编·1.1.3"},{"id":"D1-008","d":1,"t":"single","q":"一支团队用环境分支模式发布：改动先合到 test 分支部署测试环境，发布时再手工把提交摘樱桃（cherry-pick）到 main。团队计划一天多次发布，自动化测试已经成熟，且分支合并冲突越来越频繁。\n\n最匹配的分支策略调整是？","o":[{"l":"A","t":"继续环境分支模式，但提高每个分支的合并频率。"},{"l":"B","t":"改用 Gitflow 长期分支，为每个功能建立长期分支。"},{"l":"C","t":"改为主干开发（trunk-based）：小步提交主干，发布时拉 release 分支或打标签，配合特性开关（feature flag）控制功能露出。"},{"l":"D","t":"取消分支，所有提交直接推到生产环境。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 一天多次发布加测试自动化成熟，正是主干开发的适用条件：合并冲突少、发布依据唯一（标签），环境不一致从源头消失；功能露出控制交给特性开关，发布节奏与功能完整性解耦。\n\n**其他选项为什么错：**\n- A：环境分支的冲突与摘樱桃问题不会因提高频率而缓解，只会更频繁地暴露。\n- B：长期分支让冲突更多、分支更容易腐化，方向正好相反。\n- D：没有任何闸门直接上生产，审查与回滚能力全无。\n\n**关键概念：** 发布节奏与测试成熟度决定分支模式——考试给的约束决定选项。","s":"自编·1.1.4"},{"id":"D1-009","d":1,"t":"single","q":"一家公司要求：只有合并到 main 分支的变更才触发生产流水线，feature 分支的推送一律不触发。Webhook 推送对任何分支变更都会触发，无法按这种条件过滤。\n\n应采用哪种方式落地这个要求？","o":[{"l":"A","t":"保留 Webhook，由流水线第一步人工判断分支后取消执行。"},{"l":"B","t":"改用定时轮询存储库，每小时检查一次 main 分支。"},{"l":"C","t":"在构建脚本内部轮询判断分支名。"},{"l":"D","t":"用 Amazon EventBridge 规则监听仓库事件，按事件内容中的分支名过滤后再触发流水线。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** EventBridge 规则支持按事件内容过滤——事件模式里可以指定分支与事件类型，只有匹配条件的仓库事件才会触发流水线。按事件类型过滤正是它与 Webhook 的分工点：默认低延迟选 Webhook，需要按条件过滤选 EventBridge。\n\n**其他选项为什么错：**\n- A：人工判断违背自动化初衷，触发后取消还要白跑一轮。\n- B：轮询延迟以小时计，频繁变更下响应太慢。\n- C：构建脚本里的判断发生在触发之后，不触发的目标根本没跑起来，逻辑不成立。\n\n**关键概念：** Webhook 管低延迟推送，EventBridge 规则管按事件类型过滤。","s":"自编·1.1.4"},{"id":"D1-010","d":1,"t":"single","q":"一条 CodeBuild 流水线总时长 12 分钟，其中 9 分钟花在安装依赖上，一天要跑几十次。\n\n在不增加人工维护负担的前提下，见效最快的优化是？","o":[{"l":"A","t":"把计算规格调大一档，缩短整体构建时长。"},{"l":"B","t":"把依赖目录（如 node_modules）配置进 buildspec 的 cache 段，让缓存跨构建复用。"},{"l":"C","t":"全部改用 Spot 容量运行构建。"},{"l":"D","t":"迁移到自维护的 Jenkins 集群。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 依赖安装占了 9/12 分钟，cache 段把依赖目录放进 S3 或构建机本地缓存后，命中即跳过安装——实测场景能把 12 分钟压到 4 分钟左右，改一行配置就生效，没有额外维护负担。\n\n**其他选项为什么错：**\n- A：加大规格只加速安装过程本身，重复工作还在；总成本＝单价×时长，盲目加大反而更贵。\n- C：Spot 降的是单价不是时长，还有被中断的风险，要配重试。\n- D：Jenkins 带来的是更大的运维负担，方向相反。\n\n**关键概念：** 构建优化的顺序永远是：先砍重复工作，再谈加资源。","s":"自编·1.1.5"},{"id":"D1-011","d":1,"t":"multiple","q":"关于 AWS CodeBuild 的 buildspec 文件结构，下列哪两项分别决定「密钥注入方式」与「产物输出位置」？（请选择两项）","o":[{"l":"A","t":"env 段——声明环境变量，支持从 Secrets Manager 与 Parameter Store 注入密钥。"},{"l":"B","t":"phases 段——install、pre_build、build、post_build 四个阶段的命令。"},{"l":"C","t":"artifacts 段——定义产物输出位置与文件模式。"},{"l":"D","t":"cache 段——配置缓存路径供构建机之间复用。"},{"l":"E","t":"reports 段——配置测试报告的输出。"}],"a":["A","C"],"e":"**正确答案：A、C。**\n\n**为什么对：** env 段的 secrets-manager 与 parameter-store 子段把密钥直接注入构建环境变量，不经过日志，是密钥进入构建环境的正规入口；artifacts 段定义构建产物输出到哪里、按什么文件模式收口——一个管输入的密钥、一个管输出的产物，正好对应题干两个要求。\n\n**其他选项为什么错：**\n- B：phases 管命令执行顺序，与注入和输出无关。\n- D：cache 管构建提速，不是密钥或产物职责。\n- E：reports 管测试报告呈现，同样不对应题干要求。\n\n**关键概念：** buildspec 四段分工——env 注入、phases 执行、artifacts 输出、cache 提速。","s":"自编·1.1.5"},{"id":"D1-012","d":1,"t":"single","q":"一家公司的流水线要使用一套数据库凭据。安全团队要求：凭据必须每 90 天自动轮换，且读写要有集中审计。\n\n选择哪个托管服务最贴合要求？","o":[{"l":"A","t":"AWS Secrets Manager——原生支持轮换（内置 Lambda 轮换模板），默认加密，审计集中。"},{"l":"B","t":"AWS Systems Manager Parameter Store 标准参数——免费存储，直接够用。"},{"l":"C","t":"把凭据写进 buildspec 的明文环境变量。"},{"l":"D","t":"把凭据存在 Amazon S3，用存储桶策略限制访问。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 「要轮换、要集中审计」正是 Secrets Manager 的适用条件：内置 Lambda 轮换模板支持数据库凭据按计划自动轮换，默认加密、读写审计集中，两个要求都是原生能力，不用自己写代码。\n\n**其他选项为什么错：**\n- B：Parameter Store 无原生轮换，90 天自动轮换要自行实现，不满足要求。\n- C：明文环境变量踩「密钥不进明文」红线，出现即排除。\n- D：S3 不是密钥管理服务，无轮换、无密钥级审计。\n\n**关键概念：** 要轮换选 Secrets Manager；只是配置项、数量大、预算敏感选 Parameter Store。两者不互斥。","s":"自编·1.1.6"}],"sections":[{"h":"实施 CI/CD 流水线（Implement CI/CD pipelines.）","body":"### 这一域考什么\n\nD1 占 22%，六个域里最重。考试默认你已经是设计流水线的人，不是第一次用流水线的人。题干直接给真实场景：流水线失败了让你定位环节、多账号下让你选流水线的位置、部署出事故让你选回滚方式。\n\n三条主线贯穿全域：\n\n1. **把流水线建起来**（任务 1.1）：仓库、构建、密钥、部署策略四个骨架件。\n2. **加入质量关卡**（任务 1.2）：测试怎么分层、提交与合并时卡什么、应用健康怎么量化。\n3. **管住制品与部署**（任务 1.3、1.4）：制品的可追溯性、可变与不可变部署、蓝绿与金丝雀的取舍。\n\n### 与 Associate 级的问法差别\n\n同一条流水线，Associate 级（如 DVA-C02）问「这个功能怎么用」，DOP-C02 问「这条流水线你怎么设计、坏了怎么兜底」。答 DOP 的题必须带取舍：给出选择的同时说清代价。比如部署方式选蓝绿，要知道它要双倍资源、有状态应用还得先解决数据迁移——只答「蓝绿不停机」在专业级拿不到分。\n\n### 学习主线\n\n官方四个任务（1.1 → 1.4）按顺序学即可。唯一提醒：制品管理（任务 1.3）容易被轻视。它是可追溯性的根——「重新打标签」的坑就藏在这里，而这类坑在考试里以事故排障题的形式出现。\n\n### 常见失分点\n\n1. **蓝绿与金丝雀的适用条件混淆**。蓝绿切换快、回滚快，但要双倍资源；金丝雀影响面小、成本低，但回滚要等流量比例走完。有状态应用两条都麻烦——先解决数据迁移，再谈部署方式。\n2. **制品重新打标签破坏不可变性**。同一标签指向不同内容，回滚就滚回一个未知状态。正确做法是版本号递增、标签不可变。\n3. **多账号下流水线位置选错**。跨账号部署时，流水线通常放在集中工具账号，用跨账号角色部署到目标账号。放错账号会让凭据管理与审计失控。\n\n#### 这一节学什么\n这一节对应考纲任务 1.1「实施 CI/CD 流水线（Implement CI/CD pipelines.）」。\n\n> 官方原名：Implement CI/CD pipelines.\n> 本任务 7 条（Knowledge 2 / Skill 5）。两条 Knowledge 按域骨架规则并入：SDLC 概念作任务级原理铺垫；单/多账号模式的原理铺垫并入仓库配置节（1.1.3）。\n\n| 编号 | 官方条目（英文原文） | 中文速记 |\n|---|---|---|\n| 1.1.1 | Software development lifecycle (SDLC) concepts, phases, and models | SDLC 概念、阶段与模型（K，并入任务综述） |\n| 1.1.2 | Pipeline deployment patterns for single- and multi-account environments | 单账号与多账号流水线模式（K，并入 1.1.3） |\n| 1.1.3 | Configuring code, image, and artifact repositories | 配置代码、镜像与制品仓库 |\n| 1.1.4 | Using version control to integrate pipelines with application environments | 用版本控制打通流水线与应用环境 |\n| 1.1.5 | Setting up build processes (for example, AWS CodeBuild) | 搭建构建流程（CodeBuild） |\n| 1.1.6 | Managing build and deployment secrets (for example, AWS Secrets Manager, AWS Systems Manager Parameter Store) | 管理构建与部署密钥 |\n| 1.1.7 | Determining appropriate deployment strategies (for example, AWS CodeDeploy) | 选定部署策略（CodeDeploy） |\n\n**任务综述**：这个任务把流水线的四个骨架件一次考全——仓库、构建、密钥、部署。真实项目里这四件事分属不同角色，考试里串成一条线问：题干常给一个故障现象（构建成功但部署失败、密钥读取超时），让你补上缺失的一环。最容易卡的是密钥——构建环境拿不到密钥是最常见的流水线故障，而两个密钥服务的取舍正是官方点名的考点。\n\n**原理铺垫：SDLC 概念（Knowledge 1.1.1）**。软件交付生命周期（SDLC，Software Development Lifecycle）把交付划成计划、编码、构建、测试、发布、运维几个阶段。考试不背阶段名，考的是「一个动作发生在哪个阶段、该用什么工具自动化」。比如「每次提交自动跑测试」位于构建与测试之间，工具就是 CodeBuild 加事件触发；「发布后自动预热缓存」属于发布与运维之间。拿到题先判断动作属于哪个阶段，再选工具，方向就不会错。\n\n#### 配置代码、镜像与制品仓库\n\n**这条在问什么**：给一个团队场景，选对仓库类型并配好关键项。代码、镜像、制品三类仓库对应三种服务，考试常混着问——比如「构建产物放哪」「镜像标签被覆盖怎么防」。\n\n**定义**：仓库是流水线的输入与输出。代码仓库存源码与流水线定义；镜像仓库存容器镜像；制品仓库存构建产物（依赖包、二进制文件）。\n\n**三类仓库对照**：\n\n| 类型 | 服务 | 存什么 | 关键配置项 |\n|---|---|---|---|\n| 代码 | AWS CodeCommit；GitHub/GitLab 经 AWS CodeConnections | 源码、buildspec、流水线定义 | 分支保护、Webhook 触发 |\n| 镜像 | Amazon ECR | 容器镜像 | 不可变标签、生命周期策略、跨账号拉取权限 |\n| 制品 | AWS CodeArtifact；Amazon S3 | 依赖包、构建产物 | 上游仓库代理、域与仓库层级 |\n\n**CodeCommit 的时效提醒**：AWS 已于 2024 年 7 月起停止向新客户开放 CodeCommit。存量用户不受影响，新项目的主流做法是 GitHub/GitLab 配 AWS CodeConnections 打通身份认证与事件触发。仓库选型题遇到「新建代码仓库」，CodeCommit 通常不是答案。（以官方公告为准）\n\n**三个必配项**：\n\n1. **不可变标签（image tag immutability）**：ECR 的镜像标签默认可覆盖——同名标签指向新镜像后，回滚就滚到一个未知内容。生产仓库应开启不可变标签。\n2. **生命周期策略**：镜像与制品越积越多，存储费随之上涨。按规则自动清理过期层与旧镜像。\n3. **跨账号访问**：多账号布局下，部署账号要能拉取工具账号 ECR 的镜像。做法是镜像仓库资源策略放行目标账号角色，而不是复制一份镜像。\n\n**多账号流水线布局（Knowledge 1.1.2 的原理铺垫）**：单账号一切在一个账号里，简单但权限边界模糊。企业主流是多账号：每个环境（开发、测试、生产）一个账号，流水线放在集中的工具账号，通过跨账号 IAM 角色把制品部署过去。这样生产账号不持有源码与构建凭据，爆炸半径小。流水线本身不随环境复制——一条流水线串多个阶段，每个阶段用对应目标账号的角色。\n\n#### 案例\n\n一家公司在工具账号建流水线，构建出的镜像推到工具账号的 ECR。生产账号的 ECS 任务定义引用该镜像，拉取时用生产账号的执行角色——ECR 的资源策略已放行这个角色。某次有人直接在生产账号重建了一套流水线，结果构建凭据散落在生产账号，审计直接不合格。布局错一次，安全整改就是一个月。\n\n**关联服务**：Amazon ECR、AWS CodeConnections、AWS CodeArtifact、Amazon S3、AWS IAM。\n\n#### 用版本控制打通流水线与应用环境\n\n**这条在问什么**：代码从提交到各环境，路径怎么设计。考分支策略与环境映射——「怎么让合并到某分支的动作自动部署到对应环境」。\n\n**定义**：环境与应用环境（开发、测试、生产）与分支的映射关系，决定一次提交如何流向生产。这条考的是设计，不是某个服务的功能。\n\n**三种主流模式**：\n\n- **环境分支**：develop、test、main 各对应一个环境，合并即部署。直观，但分支间合并冲突多、长期分支容易腐化。\n- **主干开发（trunk-based）**：所有人往主干小步提交，发布时拉 release 分支或打标签。配合特性开关（feature flag）控制功能露出。合并冲突少，但要求测试自动化程度高。\n- **PR 流程**：feature 分支 → 提 PR → 自动测试与人工审查 → 合并触发流水线。前两种模式的「入口闸门」，考试里「合并前必须跑测试」问的就是这一步。\n\n**触发方式**：源阶段变更触发流水线有两种路径——CodeConnections 的 Webhook 推送，或 EventBridge 监听仓库事件。默认选 Webhook，延迟低；需要按事件类型过滤时用 EventBridge 规则。\n\n**取舍口吻**：环境分支适合发布节奏慢、环境差异大的团队；主干开发适合一天多次发布、自动化测试成熟的团队。没有标准答案，考试给的约束（发布频率、团队规模）决定选项。\n\n#### 案例\n\n一支团队用环境分支，测试环境合到 test 分支部署通过后，要把改动「摘樱桃」（cherry-pick）到 main——每次发布都是一次手工搬运，漏一次就是环境不一致。改成主干开发加 release 标签后，发布的唯一依据是标签，环境不一致从源头消失。\n\n**关联服务**：AWS CodeConnections、AWS CodePipeline、Amazon EventBridge。\n\n#### 搭建构建流程（CodeBuild）\n\n**这条在问什么**：构建怎么定义、怎么跑得快、怎么跑得省。CodeBuild 是本条的主角，考 buildspec 结构与性能取舍。\n\n**定义**：AWS CodeBuild 是托管构建服务。构建步骤写在 buildspec（YAML 文件）里，CodeBuild 按文件执行，按构建时长计费——不用的机器不存在，这是它与自维护 Jenkins 最大的差别。\n\n**buildspec 的四段**：\n\n- `env`：环境变量与密钥注入（支持从 Secrets Manager 与 Parameter Store 取值，见下一节）。\n- `phases`：install、pre_build、build、post_build 四个阶段，命令按顺序执行。\n- `artifacts`：产物输出位置与文件模式。\n- `cache`：缓存路径，构建机之间复用。\n\n**跑得快的三个手段**：\n\n1. **依赖缓存**：把依赖目录（如 npm 的 node_modules）配进 cache 段，缓存放 S3 或构建机本地。实测场景里，依赖安装常占构建时长的一半以上。\n2. **预装依赖的自定义镜像**：把编译工具链打进自定义构建镜像，省掉每次 install。\n3. **并行构建**：batch 段把无依赖的构建任务并行跑。\n\n**跑得省的一个权衡**：计算规格越大单价越高但构建越快。总成本 = 单价 × 时长，盲目选小规格反而更贵。短期频繁构建选大规格，夜间长任务选小规格。Spot 容量可进一步降本，代价是可能被中断，要配重试。\n\n#### 案例\n\n一条流水线构建 12 分钟，其中 9 分钟在装依赖。把依赖目录加进 cache 段后，构建降到 4 分钟——没换规格、没换镜像，改了一行配置。团队随后把编译工具打进自定义镜像，再省 1 分钟。优化顺序永远是：先砍重复工作，再谈加资源。\n\n**关联服务**：AWS CodeBuild、Amazon S3（缓存与产物）、Amazon ECR（自定义构建镜像）。\n\n#### 管理构建与部署密钥\n\n**这条在问什么**：流水线要用密钥——数据库密码、API 令牌、镜像仓库凭据。怎么安全地送进构建与部署环境。官方点名考点，也是真实流水线最高频的故障源。\n\n**定义**：密钥管理就是把「密钥存哪、谁能读、怎么轮换」三件事制度化。AWS 给两个托管选项，考试考取舍。\n\n**两个服务的对照**：\n\n| | AWS Secrets Manager | AWS Systems Manager Parameter Store |\n|---|---|---|\n| 定位 | 专管密钥，自带轮换 | 通用配置存储（明文与密文均可） |\n| 费用 | 每密钥月费加 API 调用费 | 标准参数免费，高级参数收费 |\n| 轮换 | 原生支持（内置 Lambda 轮换模板） | 无原生轮换，自行实现 |\n| 加密 | 默认加密，可用自有 KMS 密钥 | SecureString 类型指定 KMS 密钥 |\n| 典型场景 | 数据库凭据、第三方 API 密钥 | 应用配置项、许可证码、非敏感参数 |\n\n**考试判断**：要轮换、要集中审计 → Secrets Manager；只是配置项、数量大、预算敏感 → Parameter Store。两者不互斥——生产里常见「配置走 Parameter Store、凭据走 Secrets Manager」的组合。\n\n**怎么送进构建环境**：buildspec 的 env 段直接声明：\n\n```yaml\nenv:\n  secrets-manager:\n    DB_PASSWORD: myapp/prod:password\n```\n\n比在命令里手动调 API 取密钥更安全——密钥直接注入环境变量，不经过日志。\n\n**权限链**：CodeBuild 项目角色要能读密钥（secretsmanager:GetSecretValue），密钥用自有 KMS 密钥时还要 kms:Decrypt。跨账号部署时，密钥策略要放行目标账号的部署角色。\n\n**三条红线**：密钥不进代码仓库；不进明文环境变量；不进构建日志。考试选项里出现「把密钥写进 buildspec 明文」「密钥打印到 CloudWatch 日志排查」——直接排除。\n\n#### 案例\n\n一条流水线部署失败，报错是数据库连接被拒。排查发现 buildspec 里环境变量名写错——Secrets Manager 里叫 `password` 的字段被写成 `passwd`，注入的是空值。名字对不上不报错，只注入空，这类静默失败比权限拒绝更难查：权限拒绝有明确报错，空值要等到应用运行时才炸。\n\n**关联服务**：AWS Secrets Manager、AWS Systems Manager Parameter Store、AWS KMS、AWS IAM。\n\n#### 选定部署策略（CodeDeploy）\n\n**这条在问什么**：给一个应用形态（EC2、ECS、Lambda）与业务约束（停机容忍、成本、回滚速度），选部署方式。这是任务 1.1（实施 CI/CD 流水线）的收口，也是 D1 的高频出题点。\n\n**定义**：部署策略决定新版本怎么替换旧版本——一次性换、分批换，还是新旧并存切流量。AWS CodeDeploy 对三种计算平台提供不同策略。\n\n**三种平台的策略**：\n\n- **EC2/本地**：就地更新（in-place）与蓝绿（blue/green）。\n- **ECS**：蓝绿——新 TaskSet 起来后由生产流量监听器切流。\n- **Lambda**：线性（Linear）与金丝雀（Canary），如 Canary10Percent5Minutes——10% 流量走 5 分钟再逐步放量。\n\n**方式对照**：\n\n| 方式 | 停机 | 资源代价 | 回滚速度 | 适用 |\n|---|---|---|---|---|\n| 就地更新 | 有 | 无额外 | 慢（要重新部署旧版） | 测试环境、非关键应用 |\n| 蓝绿 | 无 | 双倍（新环境全量） | 快（切回旧组） | 生产、可整体复制的环境 |\n| 金丝雀 | 无 | 少量增量 | 中（按比例回退） | 生产、想小范围验证改动 |\n\n**选型判断顺序**：\n\n1. **有没有状态**：有状态应用（本地会话、本地数据库）做蓝绿前先解决数据同步——切过去是空会话。无状态应用才有「随便切」的资格。\n2. **停机容忍度**：不可接受停机 → 蓝绿或金丝雀；测试环境就地更新就够。\n3. **回滚速度要求**：要求秒级回滚 → 蓝绿（流量切回旧组）；容忍分钟级 → 金丝雀按比例回退也够。\n\n**与自动回滚的配合**：CodeDeploy 部署钩子（如 ApplicationStop、ValidateService）失败可触发自动回滚。考试常考「部署后健康检查失败怎么办」——答案里应包含回滚钩子或 CloudWatch 告警联动，而不是人工盯日志。\n\n#### 案例\n\n一个电商生产 EC2 集群，停机不可接受，应用无状态。选蓝绿：CodeDeploy 起新 Auto Scaling 组，健康检查通过后把负载均衡器流量切过去，旧组保留观察 30 分钟再销毁。某次新版本内存泄漏，切流后 10 分钟告警触发——流量切回旧组，用户几乎无感。回滚快，靠的是旧组还活着。\n\n**关联服务**：AWS CodeDeploy、Amazon EC2、Amazon ECS、AWS Lambda、Elastic Load Balancing。\n\n---"},{"h":"把自动化测试集成进 CI/CD 流水线（Integrate automated testing into CI/CD pipelines.）","body":"#### 这一节学什么\n这一节对应考纲任务 1.2「把自动化测试集成进 CI/CD 流水线（Integrate automated testing into CI/CD pipelines.）」。\n\n> 官方原名：Integrate automated testing into CI/CD pipelines.\n> 本任务 7 条（Knowledge 2 / Skill 5）。两条 Knowledge 按域骨架规则并入：测试类型与各阶段用法合并作任务级原理铺垫。\n\n**任务综述**：实施 CI/CD 流水线（任务 1.1）已经把基座建起来了，这个任务往里装质量关卡。考试从三个方向出题：给一个测试场景问放在流水线哪一环、给一个改造需求问触发方式、给一个「测试全绿但线上出事」的现象问缺了哪类测试。学员最容易卡的是分层——单元、集成、端到端各管一层，跑的时机和成本完全不同。混着放不是「更保险」，是流水线变慢还漏报。\n\n**原理铺垫：测试类型与分层（Knowledge 1.2.1、1.2.2）**。考试点名的测试类型有五类：\n\n- **单元测试（unit test）**：验证单个函数或类的行为，不依赖外部服务。跑得最快，成本最低。\n- **集成测试（integration test）**：验证多个组件连起来的行为，需要真实的数据库或依赖服务，比单元测试慢一个量级。\n- **验收测试（acceptance test）**：验证整个功能是否符合业务预期，站在用户视角描述。\n- **UI 测试（user interface test）**：驱动浏览器或客户端界面操作，验证页面流程。脆、慢、维护贵。\n- **安全扫描（security scan）**：扫依赖漏洞与代码缺陷，如静态应用安全测试（SAST）与动态应用安全测试（DAST）。\n\n分层原则一句话：越便宜的测试越早跑、跑得越频繁。单元测试挂在每次提交，几十秒出结果；集成测试挂在合并之后；UI 与验收测试挂在部署前环境；安全扫描两头都放——提交时扫代码（SAST），部署前扫运行中的应用（DAST）。把贵的测试放在便宜的测试后面，流水线失败时才能最快定位到问题层。这就是「这个测试该放哪一环」这类题的判断依据。\n\n#### 提 PR 或合并时触发构建与测试\n\n**这条在问什么**：代码还没合并，测试先跑起来——怎么让 PR 一打开就自动构建测试，以及合并动作触发哪些后续环节。\n\n**定义**：PR 触发是把质量关卡前移到合并之前：每个 PR 自动跑构建与测试，结果直接显示在 PR 上，不合格就挡在门外。合并触发则接管合并后的动作：跑更重的测试、打镜像、推进到下一环境。\n\n**机制**：CodeConnections 连接 GitHub/GitLab 后，事件分两条路走：\n\n- **PR 事件**（opened、synchronize）：通常配 CodeBuild 报告状态到 PR——跑单元测试与 lint，结果标在 PR 的检查项里。\n- **合并事件**（merge / push to main）：触发 CodePipeline 源阶段，推进流水线后续环节。\n\n**考试判断**：「合并前必须跑测试」→ PR 触发的检查项机制；「合并后自动部署到测试环境」→ 合并触发流水线。两者常同时出现——PR 挡质量，合并管流动。一个易混点：PR 阶段一般不跑重量级集成测试，几十分钟的测试会把评审拖死，重量级放合并后。\n\n#### 案例\n\n一个团队要求「PR 必须全绿才能合并」。落地后 PR 打开即触发 CodeBuild 跑单元测试与安全扫描，8 分钟出结果；合并进 main 后流水线才跑集成测试并部署测试环境。有人嫌 PR 测试慢想砍掉，一周后集成测试失败率暴涨——问题在合并时才暴露，修复成本翻了几倍。关卡前移省的是返工时间。\n\n**落地细节**：PR 状态回写依赖构建项目的报告配置——CodeBuild 的构建结果经 CodeConnections 自动标到 PR 检查项里；评审人看 PR 页面就能判断能不能合并，不需要去控制台翻构建历史。状态没回写时，PR 页面永远「等待中」，合并闸门形同虚设——这也是常考的故障现象。\n\n**关联服务**：AWS CodeBuild、AWS CodeConnections、AWS CodePipeline、GitHub/GitLab。\n\n#### 压测、性能基线与大规模应用测试\n\n**这条在问什么**：功能对了还不够——系统能扛住多大流量、响应是否达标。怎么把压测与性能验证做进交付流程。\n\n**定义**：负载测试（load test）验证预期流量下的表现；压力测试（stress test）持续加压找崩溃点；性能基线（performance benchmark）是可对比的指标快照——本次发布比上次快了还是慢了，靠基线说话。\n\n**机制**：压测在 AWS 上是分布式负载生成：在多个可用区起一批压测实例（常见框架如 JMeter、k6，仅作对照），模拟真实流量打向目标环境。考试重点不在工具，在三点：\n\n- **对什么环境压**：对与生产同构的预生产环境压。压生产要么影响真实用户，要么数据失真。\n- **怎么算达标**：定性能基线——P95 延迟、错误率、吞吐量阈值。没有基线，压测结果只是「跑了一下」。\n- **结果怎么用**：基线对比放进发布关卡，性能回退超阈值就挡住发布。\n\n**取舍口吻**：压测环境本身要花钱（起一批实例），且不能常驻——用完即毁。考试里「定期压测但控制成本」的答案通常是按计划触发压测流水线、压完自动销毁资源，而不是长期挂一套压测环境。\n\n#### 案例\n\n一个促销系统上线前做压测：用 CloudFormation 拉起 20 台压测机模拟 1 万并发，目标是 P95 延迟 300 毫秒。第一轮打到 6000 并发时数据库连接池耗尽，错误率跳到 5%。团队调大连接池并加缓存，第二轮达标。这个坑在测试环境踩，总比促销夜在生产踩便宜。\n\n**关联服务**：Amazon EC2（压测负载生成）、Amazon CloudWatch（指标采集）、AWS CloudFormation（环境编排）。\n\n#### 用应用退出码衡量健康状态\n\n**这条在问什么**：程序「跑完了」不等于「跑成了」。流水线怎么用退出码判断应用健康，而不只是看命令有没有执行。\n\n**定义**：退出码（exit code）是进程结束时返回给调用方的数字：0 表示成功，非 0 表示失败。这是流水线判断「应用是否正常」最直接的信号——构建脚本、部署钩子、健康检查命令全靠它。\n\n**机制**：三个常见用法：\n\n- **构建失败判定**：CodeBuild 按 buildspec 中命令的退出码决定阶段成败，非 0 即失败。命令被 `|| true` 包住会吞掉失败——流水线全绿，但构建实际没做。\n- **部署钩子校验**：CodeDeploy 的生命周期钩子（如 ValidateService）跑健康检查脚本，退出码非 0 触发回滚（见选定部署策略节 1.1.7 的自动回滚）。\n- **容器健康检查**：容器探针命令的退出码决定实例是否被替换。\n\n**考试判断**：题干给「部署后脚本跑完但应用没起来」「流水线显示成功但产物缺失」——先查退出码有没有被吞。选项里「脚本末尾加 exit 0 保证成功」是经典错误项，它把失败伪装成成功。\n\n#### 案例\n\n一条部署流水线长期全绿，线上服务却偶发 502。排查发现 ValidateService 钩子里的健康检查命令加了 `|| true`——服务没起来时脚本照样返回成功。去掉吞码、让非 0 退出码触发 CodeDeploy 自动回滚后，坏版本部署 3 分钟内自动切回旧版。一个符号，骗了流水线三个月。\n\n**关联服务**：AWS CodeBuild、AWS CodeDeploy、Amazon ECS / Amazon EKS（健康探针）。\n\n#### 单元测试与覆盖率自动化\n\n**这条在问什么**：单元测试人人会写，考试考的是自动化——测试怎么随构建跑、覆盖率怎么变成可执行的门槛。\n\n**定义**：代码覆盖率（code coverage）衡量自动化测试执行了多少比例的代码，常见口径有行覆盖与分支覆盖。覆盖率本身不证明质量，但趋势下滑一定说明测试没跟上代码变化。\n\n**机制**：落地是三步：\n\n- **构建内跑测试**：buildspec 的 build 或 post_build 阶段执行测试命令与覆盖率工具（如 JaCoCo、coverage.py，仅作对照），失败即中断构建。\n- **覆盖率报告入库**：报告推到 S3 或 CodeBuild 报告组，历史可查。\n- **门槛卡关**：覆盖率低于阈值时构建失败，防止测试越写越少。\n\n**取舍口吻**：覆盖率阈值别追 100%——为凑数字会写大量无断言的空测试，质量反而更差。合理做法是对核心模块定高门槛、边缘代码放宽，把预算花在业务逻辑上。考试里「把覆盖率提到 100% 作为发布条件」通常是错误项，正解是「关键模块设阈值并盯趋势」。\n\n#### 案例\n\n一个团队把覆盖率门槛定为 80%。半年后团队达标 79%——大家开始写没有断言的测试凑数。改为「核心支付模块 90%、其余 60%」并要求新增代码必须带测试后，无效测试消失，真实缺陷拦截率反而上升。指标定错，行为就变形。\n\n**关联服务**：AWS CodeBuild（构建内执行与报告）、Amazon S3（报告存储）。\n\n#### 在流水线中调用 AWS 服务做测试\n\n**这条在问什么**：测试不只发生在构建机里——验证一个 API、发一条消息、查一次数据库状态，都要在流水线里调 AWS 服务。考的是怎么做，以及测试资源怎么收拾干净。\n\n**定义**：流水线测试阶段调用 AWS 服务，指在 CodeBuild 或 Lambda 里用 SDK/CLI 操作真实或临时的 AWS 资源，验证集成行为。\n\n**机制**：两种主流形态：\n\n- **打真实测试环境**：部署到测试账号后，流水线跑验收脚本调它的 API。真实，但数据要隔离。\n- **临时资源**：流水线里现起资源（如临时 SQS 队列、临时数据库），测试完自动删。干净，但清理必须写进脚本。\n\n**权限链**：构建角色的 IAM 策略决定它能调哪些服务——只授予测试所需的最小权限，且测试账号与生产账号隔离。这与制品仓库权限配置（1.4.5）同一条原则：权限给大了，测试脚本一个 bug 就能删生产表。\n\n**考试判断**：题干出现「流水线测试阶段需要验证 S3 上传与 SQS 收发」——正解通常含「测试专用角色 + 临时资源 + 自动清理」。错误项常是「直接用管理员权限调生产环境验证」。\n\n#### 案例\n\n一条流水线发布消息服务：部署到测试环境后，脚本先建一个临时 SQS 队列，发测试消息、消费校验内容与顺序，最后删队列。清理写在 buildspec 的 post_build 段，无论成败都执行——不然每次失败都漏一个队列，测试账号半年攒了四千个。临时资源必须自带清理，这是纪律不是建议。\n\n**关联服务**：AWS CodeBuild、AWS Lambda、Amazon SQS、Amazon S3、AWS IAM。\n\n---"},{"h":"构建并管理制品（Build and manage artifacts.）","body":"#### 这一节学什么\n这一节对应考纲任务 1.3「构建并管理制品（Build and manage artifacts.）」。\n\n> 官方原名：Build and manage artifacts.\n> 本任务 6 条（Knowledge 3 / Skill 3）。三条 Knowledge 按域骨架规则并入：使用场景与安全管理、生成方式、生命周期合并作任务级原理铺垫。\n\n**任务综述**：仓库怎么配的细节（配置代码、镜像与制品仓库，1.1.3）前面讲过，这个任务聚焦仓库里的「货」——制品本身。三个 Knowledge 条合起来是一句话：制品是流水线各阶段传递的标准化交付物，从生成、存储到销毁要全程可追溯。\n\n考试里这块最阴的题在生命周期：镜像标签被覆盖、旧版本被清理策略误删、回滚时找不到当时的制品——都以「回滚失败」的事故形态出现。学员容易把制品管理当存储问题，它其实是可追溯性问题。\n\n**原理铺垫：制品的生成与生命周期（Knowledge 1.3.1、1.3.2、1.3.3）**\n\n**制品是什么、怎么生成**：制品（artifact）是构建过程的产物——编译出的二进制、依赖包、容器镜像、IaC 模板包。生成方式跟着构建走：CodeBuild 按 buildspec 的 artifacts 段输出文件产物；容器构建产出镜像推 ECR；Lambda 打包为部署包（zip 或镜像）。\n\n**使用场景与安全管理**：制品在流水线里被三个环节消费。部署阶段取它装到环境，审计时用它追溯「这次发布到底是哪份代码」，回滚时靠历史版本恢复。安全管理两条：制品仓库权限最小化，推权只给流水线角色；传输与存储全程加密（KMS）。\n\n**生命周期考量**：制品不是越存越好，三条现实约束：\n\n- **版本不可变**：同一版本号永远指向同一内容，重打标签等于篡改历史。\n- **保留与清理**：按策略保留最近 N 个版本或 N 天，过期自动清——存储费与合规保留期（如审计要求留一年）要平衡。\n- **可追溯**：制品要能反查到源码提交、构建日志、部署记录。断了一环，事故复盘就断在那。\n\n#### 创建并配置制品仓库（CodeArtifact / S3 / ECR）\n\n**这条在问什么**：三类制品仓库怎么选、怎么配。与仓库配置节（1.1.3）的分工：那边讲仓库在流水线里的位置，这边讲仓库本身的配置细节。\n\n**定义**：三个服务各管一类货：\n\n- **AWS CodeArtifact**：依赖包仓库（npm、pip、Maven 等）。核心能力是上游仓库（upstream repository）——把内部私有包与公共源（如 npmjs）代理成统一端点，开发者只配一个源。\n- **Amazon S3**：通用文件制品（构建产物 zip、IaC 包）。配版本控制（S3 Versioning）才有回滚能力。\n- **Amazon ECR**：容器镜像仓库。核心配置是不可变标签与生命周期策略。\n\n**机制**：CodeArtifact 的域（domain）与仓库层级是考点。域是跨账号共享的顶层容器，仓库挂域下。上游链决定「内部包优先、外部兜底」的取包顺序——这也是供应链安全的关键配置：公共源被投毒时，内部包不会被动覆盖。\n\n**考试判断**：「团队依赖包混乱、公共源抖动导致构建随机失败」→ CodeArtifact 上游仓库统一代理；「制品要可回滚」→ S3 开版本控制或 ECR 开不可变标签；「第三方包安全」→ 上游链加仓库策略。\n\n#### 案例\n\n一个团队的构建每天随机失败，原因是公共 npm 源抖动。改用 CodeArtifact：建域与仓库，把 npmjs 配为上游，开发与构建统一指向 CodeArtifact 端点。构建先取内部包、再走上游缓存的外部包——公共源抖一次，缓存挡一次。构建失败率从每天几次降到零。统一入口不只是整洁，是稳定性。\n\n**关联服务**：AWS CodeArtifact、Amazon S3、Amazon ECR、AWS KMS。\n\n#### 配置构建工具产出制品（CodeBuild / Lambda）\n\n**这条在问什么**：怎么让构建产物规格正确、可追溯、能被部署环节直接消费。CodeBuild 与 Lambda 是两个出题主角。\n\n**定义**：产出制品的构建配置包括：产物格式与版本号、产物元数据（对应哪个提交）、输出位置。Lambda 的部署包（deployment package）是本条的特色考点——zip 包或容器镜像，有大小上限与打包方式讲究。\n\n**机制**：\n\n- **版本号策略**：构建号递增（build-123），或语义化版本加构建元数据（1.4.2+build.123）。关键是唯一且单调，禁止覆盖。\n- **元数据写入**：把源码提交 ID、构建时间写进制品（版本文件或镜像标签），可追溯的根在这里。\n- **Lambda 打包**：zip 包注意依赖体积——解压后 250 MB 上限，公共依赖可抽到层（Lambda layers）；镜像形态上限宽松但冷启动更慢。\n\n**输出与消费的衔接**：文件制品按 buildspec 的 artifacts 段输出到 S3，流水线下一阶段直接引用；镜像与部署包推送后，部署环节按标签或 ARN 引用。产物「在哪、叫什么」要在构建与部署两侧约定一致——名字对不上，部署阶段就找不到制品，这类故障报错往往只说「产物不存在」，不说是哪边没对齐。\n\n**取舍口吻**：zip 快、冷启动快、体积受限；镜像统一运行时、依赖随便装、冷启动慢。高频改动的小函数选 zip 加分层，重依赖的数据处理类函数选镜像。\n\n#### 案例\n\n一个 Lambda 函数带 80 MB 的 PDF 处理依赖，每次改一行业务代码都要重传 80 MB 包。改用 Lambda layers：公共依赖放进层（版本化、可复用），函数部署包只剩 2 MB——发布快了，回滚也快（层不常变，回滚只需换函数代码）。制品分层不是炫技，是把「常变的」和「不常变的」拆开。\n\n**关联服务**：AWS CodeBuild、AWS Lambda、Amazon S3。\n\n#### 自动化 EC2 与容器镜像构建（EC2 Image Builder）\n\n**这条在问什么**：镜像不是构建完就完了——打补丁、安全加固、定期重建都要自动化。EC2 Image Builder 是本条的主角。\n\n**定义**：AWS EC2 Image Builder 是托管镜像流水线服务：定时构建 AMI（Amazon Machine Image，EC2 的系统镜像）与容器镜像，自动装系统组件、跑安全加固与测试、分发到多账号多区域。\n\n**机制**：四个组件串成流水线：\n\n- **组件（component）**：构建步骤文档——装什么包、改什么配置、跑什么验证。\n- **配方（recipe）**：基础镜像加组件清单。\n- **分发配置（distribution）**：构建完自动复制到指定区域与账号。\n- **计划（schedule）**：定时触发——打补丁场景的核心，如每月补丁日自动重建全量镜像。\n\n**为什么不用手工打镜像**：手工镜像三个月不重建，漏洞越积越多；重建一次要人肉半天，没人愿意做。Image Builder 把重建变成定时任务——镜像永远新鲜，审计有据。容器镜像同理：基础镜像更新后自动重建应用镜像，不然基础镜像的漏洞修复永远到不了你手上。\n\n**考试判断**：「定期为 AMI 打安全补丁」「镜像构建分发到多账号」——看到这两个关键词想 Image Builder。错误项常用「写脚本定期手工运行」——考试要的是托管自动化加验证，不是计划任务加人肉。\n\n#### 案例\n\n一家公司 200 台 EC2 的基础 AMI 一年没更新，安全扫描报了 40 个 CVE。用 Image Builder 建流水线：配方基于最新 Amazon Linux 加内部加固组件，每月 1 号定时构建，构建完自动跑测试组件验证服务能起，再分发到三个区域。第二个月起，新镜像由 Auto Scaling 组滚动替换上线——补丁这件事从此不再依赖有人记得它。\n\n**关联服务**：AWS EC2 Image Builder、Amazon EC2（AMI）、Amazon ECR（容器镜像）、AWS IAM（分发授权）。\n\n---"},{"h":"为实例、容器与无服务器环境实施部署策略（Implement deployment strategies for instance, container, and serverless environments.）","body":"#### 这一节学什么\n这一节对应考纲任务 1.4「为实例、容器与无服务器环境实施部署策略（Implement deployment strategies for instance, container, and serverless environments.）」。\n\n> 官方原名：Implement deployment strategies for instance, container, and serverless environments.\n> 本任务 8 条（Knowledge 4 / Skill 4）。四条 Knowledge 按域骨架规则并入：平台部署方法并入任务综述与部署方式节（1.4.8）；存储模式与可变/不可变对比作任务级原理铺垫；代码分发工具并入部署代理节（1.4.6）。\n\n**任务综述**：选定部署策略节（1.1.7）讲了「选哪种部署方式」，这个任务讲「在三类平台上把部署真正落地，出事怎么排」。平台差异是主线：EC2 靠部署组与代理、ECS 靠任务定义与服务更新、Lambda 靠版本与别名切流量。四条 Knowledge 里最重的是可变与不可变部署的对比——它是本任务的选型底层逻辑，直接决定蓝绿在某个平台能不能做。\n\n学员最容易卡的是排障（任务 1.4.7）：部署失败的现象五花八门，但根因集中在权限、代理、资源三类，考试给的现象要在三类里对号。\n\n**原理铺垫一：可变部署与不可变部署（Knowledge 1.4.3）**\n\n- **可变部署（mutable deployment）**：在现有服务器上原地升级——登进去装新版本、改配置。快、省资源，但服务器越养越脏：配置漂移（configuration drift）、残留旧依赖、环境不可复现。排障时两台「同配置」机器行为不同，多半是漂移。\n- **不可变部署（immutable deployment）**：不打现有机器——从干净基础镜像构建新镜像，起新机器替换旧的。每台机器都是镜像的复制品，环境绝对一致，回滚就是切回旧镜像。代价是每次发布要重建镜像、起机器，慢且费资源。\n\n考试怎么考：题干出现「配置漂移」「两台同配置实例行为不一致」「保证环境可复现」→ 不可变部署；「发布要快、资源紧张、改动很小」→ 可变部署也有它的位置。蓝绿与金丝雀天然偏不可变——新版本先以干净镜像起一批，验证后切流。\n\n**原理铺垫二：应用存储模式如何约束部署（Knowledge 1.4.2）**。部署方式的选择受「数据在哪」限制：\n\n- **Amazon EBS**：块存储，绑在单台实例上。实例换掉，卷可以保留重挂——但要求新实例恰好接得上旧卷，不可变部署用 EBS 常被数据迁移卡住。\n- **Amazon EFS**：共享文件系统，多实例同时挂载。会话、文件等有状态数据放 EFS，新旧实例共享同一份数据——蓝绿与金丝雀的阻力大幅下降。\n- **Amazon S3**：对象存储，与应用完全解耦。静态资源、上传文件放 S3，应用本身就可以无状态随意替换。\n\n一句话：有状态数据越靠外（S3 优先于 EFS 优先于 EBS 优先于实例本地盘），部署方式越自由。考试题「有状态应用做蓝绿前必须先做什么」——正解常是先把有状态数据外移，而不是直接选部署方式。\n\n#### 配置访问制品仓库的安全权限（IAM / CodeArtifact）\n\n**这条在问什么**：部署环节拉不到制品，十有八九是权限。怎么给拉取、推送、跨账号三类访问配对权限，是本条的核心。\n\n**定义**：制品仓库的权限链三层：谁能推（只给流水线构建角色）、谁能拉（部署角色、运行时角色）、跨账号怎么放行（资源策略或 IAM 策略，按仓库类型）。\n\n**机制**：\n\n- **CodeArtifact**：权限挂在域与仓库两级。跨账号消费用域的资源策略放行目标账号角色；构建角色只需要授权令牌与读包权限，推包权限只给发布流水线。\n- **ECR**：仓库资源策略（repository policy）放行其他账号的拉取角色；拉取方 IAM 还要配 `ecr:GetAuthorizationToken`——两边缺一边都是 AccessDeniedException，这是 ECR 最经典的排障题。\n- **S3**：桶策略或 IAM 策略。制品按前缀分目录时，做到前缀级最小化。\n\n**考试判断**：题干给「部署账号拉不到工具账号的镜像」「跨账号制品访问被拒」。正解是「源仓库资源策略放行目标角色 + 目标角色有对应 IAM 权限」，两者都要。只答一边都是错误项。\n\n#### 案例\n\n工具账号的 ECR 存着应用镜像，生产账号部署时报 AccessDeniedException。检查发现只配了生产账号执行角色的 IAM 拉取权限，ECR 仓库策略没放行这个角色——两边齐了才通。补上仓库策略后拉取成功。跨账号访问记两条腿：资源策略放行来者，IAM 策略允许去取。\n\n**关联服务**：AWS IAM、AWS CodeArtifact、Amazon ECR、Amazon S3。\n\n#### 配置部署代理（CodeDeploy agent）\n\n**这条在问什么**：EC2 上的就地与蓝绿部署靠 CodeDeploy agent 干活。代理没装、没权限、没日志，部署就瘫——考的是代理的生命周期管理。\n\n**定义**：AWS CodeDeploy agent 是装在目标 EC2 实例上的软件，负责从 CodeDeploy 拉部署指令、执行 appspec 钩子、回报状态。ECS 与 Lambda 部署不需要它——平台原生集成，这是常考的分辨点。\n\n**机制**：\n\n- **安装方式**：AMI 预装（配合镜像自动构建节 1.3.6）或启动时用户数据脚本安装。生产推荐预装进基础镜像——agent 版本统一，新实例即开即用。\n- **权限前提**：实例的实例档案角色（instance profile）要带 `s3:Get*`——agent 从 S3 拉 appspec 与制品。这是「部署卡在下载」的第一排查位。\n- **状态排查**：agent 不在线时实例在 CodeDeploy 里显示状态异常。查三点：agent 进程在不在、实例档案角色对不对、agent 日志报什么。\n- **appspec 结构**：EC2/本地平台的 appspec 定义文件复制与钩子顺序（ApplicationStop → BeforeInstall → AfterInstall → ValidateService 等），钩子脚本失败即部署失败。\n\n**代码分发工具（Knowledge 1.4.4 的原理铺垫）**：把代码送到目标环境的工具链——EC2 用 CodeDeploy（agent 拉制品），Lambda 直接更新版本与别名，容器镜像用 ECR 加任务定义更新，AMI 分发用 Image Builder。选哪个跟着平台走。考试不考工具背诵，考「这个平台这条链路缺了哪一环」。\n\n#### 案例\n\nAuto Scaling 组新起的实例部署总是超时，老实例正常。查 agent 日志：新实例的 agent 拉 S3 制品时被拒——基础 AMI 更新时实例档案角色被改小了权限。把 `s3:Get*` 补回角色，部署恢复。新实例出问题、老实例没事，先查基础镜像与角色的「代际差异」。\n\n**关联服务**：AWS CodeDeploy、Amazon EC2、AWS EC2 Image Builder、AWS IAM。\n\n#### 排障部署问题\n\n**这条在问什么**：部署失败的现象千姿百态，考试给现象让你选第一排查动作。本条把高频故障归成三类，现象对号入座。\n\n**定义**：部署故障三大类：\n\n- **权限类**：跨账号访问被拒、实例角色缺权限、KMS 解密失败。报错关键词是 AccessDenied、UnauthorizedOperation。\n- **代理/集成类**：agent 不在线、appspec 格式错、钩子脚本失败、CodePipeline 阶段卡住。现象是部署没开始就停，或卡在某钩子。\n- **资源类**：端口占用、内存不够、安全组没放开、部署组容量不足。现象是部署完成但服务起不来。\n\n**排查套路**：先看日志定类。CodeDeploy 部署事件日志显示失败在哪个钩子；agent 日志显示制品拉取细节；CloudWatch 应用日志显示服务起没起来。类别定了再深入：权限类查 IAM 与资源策略，集成类查 agent 与 appspec，资源类查实例与网络。\n\n**高频现象对照**：\n\n- 部署卡在 BeforeInstall → 钩子脚本问题或制品下载失败，查 agent 日志。\n- 蓝绿切流后 5xx 飙升 → 新版本问题或数据没迁移（有状态应用），先回滚再查。\n- ECS 部署后新任务起不来 → 任务定义引用的镜像标签不存在，或服务配额不够。\n- Lambda 更新后别名流量还在旧版本 → 别名没指向新版本，或流量路由配置没生效。\n\n**取舍口吻**：排障题的正确答案通常是「先看日志定位失败环节」，而不是「直接重跑部署」——重跑只是祈祷。带着这个直觉做题，三个错误项里至少两个是「绕过定位直接操作」。\n\n#### 案例\n\n一次蓝绿部署切流后错误率跳到 30%。值班同学第一动作是把流量切回旧组——回滚先于排查，止血优先。随后查日志：新组的应用连不上数据库，生产账号的密钥版本没同步到新组用的 Secrets Manager 路径。回滚争取了时间，日志给出了根因。顺序永远是：止血、定位、修复、复盘。\n\n**关联服务**：AWS CodeDeploy、Amazon CloudWatch、AWS CloudTrail、AWS IAM。\n\n#### 使用不同部署方式（蓝绿、金丝雀）\n\n**这条在问什么**：选定部署策略节（1.1.7）讲了选型判断，这条讲三类平台的「怎么做」与细节差异——考试在平台与方式的交叉处出题。\n\n**定义**：各平台部署方法（Knowledge 1.4.1 的原理铺垫）：EC2 的部署单位是实例（AMI 加部署组）；ECS 是任务定义（镜像加资源配额），服务滚动更新；EKS 用 Kubernetes 原生机制（滚动更新，GitOps 工具不在服务清单内仅作对照）；Lambda 是版本（version）与别名（alias）——版本不可变，别名是可移动的流量指针。Lambda 的「部署即切流」设计是三个平台里最接近金丝雀原生的。\n\n**方式与平台的组合**：\n\n- **EC2**：CodeDeploy 蓝绿——起新 Auto Scaling 组，负载均衡器切流；就地更新——部署组内逐台替换。\n- **ECS**：蓝绿——CodeDeploy 管两个 TaskSet，生产监听器与测试监听器分别切流，可在生产流量未动时先验证测试流量。\n- **Lambda**：别名加路由配置——Canary10Percent5Minutes、Linear10PercentEvery1Minute 等预置策略，按比例逐步放量。\n\n**三类平台的关键差异**：\n\n| 维度 | EC2 蓝绿 | ECS 蓝绿 | Lambda 金丝雀 |\n|---|---|---|---|\n| 回滚 | 切回旧组 | 部署上一个 TaskSet | 别名指回旧版本（秒级） |\n| 验证位置 | 切流后才开始 | 测试监听器先行 | 真实流量按比例 |\n| 流量粒度 | 按实例批量 | 监听器整体切换（更细需加权目标组） | 1% 起步按比例 |\n\n**取舍口吻**：题干给「改动风险高、要小步放量、秒级回滚」→ Lambda 金丝雀；「容器应用、要在生产流量前验证」→ ECS 蓝绿加测试监听器；「经典三层应用、整体切换」→ EC2 蓝绿。平台定下后，方式跟着平台的原子能力走——Lambda 有版本指针，天然适合按比例放量。\n\n#### 案例\n\n一个 Lambda API 改动了计费逻辑，风险高。选 Canary10Percent10Minutes：10% 真实流量跑 10 分钟，CloudWatch 告警监控错误率——第 8 分钟计费异常告警触发，CodeDeploy 自动把别名指回旧版本，影响面 10%、持续 8 分钟。换成整体切换，同样的错误影响 100% 用户。放量粒度就是风险敞口。\n\n**关联服务**：AWS CodeDeploy、AWS Lambda、Amazon ECS、Amazon EC2、Elastic Load Balancing。\n\n---"}],"tips":{"points":"| 考点 | 内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 仓库配置（1.1.3） | 仓库类型选择、不可变标签与生命周期策略 | ⭐⭐⭐ | 场景选择题 |\n| 密钥管理（1.1.6） | Secrets Manager 与 Parameter Store 取舍、密钥注入 | ⭐⭐⭐ | 场景选择题 |\n| 部署方式选型（1.1.7 / 1.4.8） | 蓝绿/金丝雀/就地更新、三类平台差异 | ⭐⭐⭐ | 场景选择题 |\n| 测试分层（1.2.1 / 1.2.2） | 测试类型与流水线位置 | ⭐⭐ | 场景选择题 |\n| 制品仓库（1.3.4） | CodeArtifact 上游代理与供应链安全 | ⭐⭐ | 场景选择题 |\n| 镜像自动化（1.3.6） | Image Builder 定时补丁与多账号分发 | ⭐⭐ | 场景选择题 |\n| 可变与不可变（1.4.3） | 部署模式取舍与配置漂移 | ⭐⭐ | 场景选择题 |\n| 部署排障（1.4.7） | 故障三分类与第一排查动作 | ⭐⭐⭐ | 排障题 |","services":"| 服务 | 主要用途 | 涉及任务 |\n|---|---|---|\n| AWS CodePipeline | 流水线编排 | 1.1、1.2、1.4 |\n| AWS CodeBuild | 构建与测试执行 | 1.1、1.2、1.3 |\n| AWS CodeDeploy | 部署编排与回滚 | 1.1、1.4 |\n| AWS CodeConnections | 第三方仓库接入 | 1.1、1.2 |\n| Amazon ECR / AWS CodeArtifact / Amazon S3 | 制品与镜像仓库 | 1.1、1.3、1.4 |\n| AWS Secrets Manager / AWS Systems Manager Parameter Store | 密钥管理 | 1.1 |\n| AWS EC2 Image Builder | 镜像自动构建与分发 | 1.3、1.4 |\n| AWS Lambda / Amazon ECS / Amazon EC2 | 三类部署平台 | 1.1、1.4 |\n| Elastic Load Balancing | 流量切换 | 1.1、1.4 |\n| AWS IAM | 权限链 | 1.1、1.3、1.4 |"}},{"domain":2,"name":"配置管理与基础设施即代码（Configuration Management and IaC）","weight":"17%","practice":[{"id":"D2-001","d":2,"t":"single","q":"一家公司在 Amazon EC2 实例上运行应用程序，实例使用最新版的 Amazon Linux 2 AMI。当服务器管理员应用新的安全补丁时，需手动将受影响的实例从服务中移除、打上补丁，再重新投入服务。\n\n新的安全政策要求公司在补丁发布后 7 天内应用安全补丁，安全团队必须能验证所有 EC2 实例是否符合补丁政策，修补必须在对用户影响最小的时间内完成。\n\n哪一种解决方案符合这些要求？","o":[{"l":"A","t":"配置一个 AWS CodeBuild 项目，通过 SSH 下载补丁并应用到所有实例；在维护窗口期间使用 Amazon EventBridge 计划规则运行该项目。"},{"l":"B","t":"使用 AWS Systems Manager 补丁管理器创建补丁基准；在 EC2 实例上创建脚本，用 AWS CLI 从补丁管理器拉取最新补丁，并创建 cron 任务安排脚本在维护窗口期间运行。"},{"l":"C","t":"创建脚本应用所有可用的安全补丁，用 cron 任务安排在维护窗口期间运行；把脚本和 cron 任务装进应用程序 AMI，重新部署应用。"},{"l":"D","t":"把所有 EC2 实例列入 AWS Systems Manager 补丁管理器的补丁组，使用补丁管理器创建补丁基准，配置维护窗口来应用补丁基准。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 补丁管理器是 Systems Manager 的功能：按补丁基准定义的批准列表，在维护窗口期间自动给补丁组内实例打补丁。安全团队可在控制台查看实例的补丁合规性，或用 CLI 拉取摘要——验证合规的要求直接满足。实例预先注册进补丁组，全程无需人工逐台操作，用户影响被限制在维护窗口内。\n\n**其他选项为什么错：**\n- A：CodeBuild 的职责是把源代码构建成工件，不是给实例部署补丁。\n- B：Amazon Linux 2 预装的 SSM Agent 本身就能接收补丁指令，不需要自建脚本加 cron 去拉补丁。\n- C：没有给安全团队提供验证补丁合规性的手段，且 cron 任务是单点故障。\n\n**关键概念：** 补丁基准 + 补丁组 + 维护窗口＝Systems Manager 补丁自动化三件套，合规性可直接出报告。","s":"官方样题#5"},{"id":"D2-002","d":2,"t":"single","q":"一家创业公司的产品是一个纯无服务器应用：几个 Lambda 函数加一个 API 网关加事件源触发。团队只有两名工程师，都不想写基础设施代码，希望用最精简的语法把这套东西描述出来并快速部署。团队正在选 IaC 工具，硬性要求是「无服务器场景下起步最快」。\n\n最贴合的工具是？","o":[{"l":"A","t":"AWS CDK——用编程语言定义基础设施，抽象与复用能力最强，适合长期工程化演进。"},{"l":"B","t":"AWS SAM——CloudFormation 的无服务器扩展，精简语法描述 Lambda、API 网关与事件源，部署时转成完整模板。"},{"l":"C","t":"AWS CloudFormation——直接手写完整 YAML 模板，资源定义最全面、表达最精细。"},{"l":"D","t":"Terraform——社区生态成熟，多云管理能力强，团队上手快。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 选型判断三问的第一问就是「是不是纯无服务器」——Lambda 加 API 网关加事件源正是 SAM 的目标形态。SAM 的精简语法让这类应用用最少的模板行完成定义，部署时自动转成完整 CloudFormation，起步最快。\n\n**其他选项为什么错：**\n- A：CDK 要求团队会写编程语言，抽象能力强但不是「起步最快」，对一个两人文侣的无服务器小应用过重。\n- C：手写完整 CloudFormation YAML 资源定义繁琐，与「精简语法、快速部署」相悖。\n- D：Terraform 不是 AWS 原生工具，考试问 AWS 原生方案时不会是它。\n\n**关键概念：** 纯无服务器选 SAM；团队会写代码要强抽象选 CDK；运维为主、重可读性选 CloudFormation 直写。","s":"自编·2.1.1"},{"id":"D2-003","d":2,"t":"single","q":"一个平台团队要给全公司沉淀基础设施代码库：几十个模块要参数化复用，还要用循环批量生成资源、用函数封装校验逻辑。成员都是熟悉 TypeScript 的工程师，希望在编码时获得 IDE 提示与类型检查。\n\n最贴合的工具是？","o":[{"l":"A","t":"AWS SAM——精简语法专注无服务器形态，提供不了通用编程语言的表达能力。"},{"l":"B","t":"AWS CloudFormation——手写 YAML 模板，模板间靠复制粘贴维持一致。"},{"l":"C","t":"AWS CDK——用 TypeScript 等编程语言写基础设施，循环、函数、抽象做复用，合成为 CloudFormation 模板再部署。"},{"l":"D","t":"AWS Service Catalog——把核准模板做成产品目录供申请，是分发机制不是编写工具。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 题干三个信号——参数化复用、循环与函数抽象、工程师写代码——全部指向 CDK。CDK 用通用编程语言写基础设施，能用代码的循环批量生成资源、用函数封装校验，还能享受 IDE 提示与类型检查，合成为 CloudFormation 模板再部署。\n\n**其他选项为什么错：**\n- A：SAM 是 CloudFormation 的无服务器扩展，语法再精简也不支持通用编程语言的表达能力。\n- B：YAML 做不了循环与函数抽象，几十个模块靠复制粘贴维持一致正是要消灭的模式。\n- D：Service Catalog 是「分发核准模板」的目录机制，不解决「怎么写」的问题。\n\n**关键概念：** 会写代码、要抽象复用选 CDK；CDK 的产物仍是 CloudFormation 模板。","s":"自编·2.1.1"},{"id":"D2-004","d":2,"t":"single","q":"一家公司的架构评审会上，两位工程师分别主张用 AWS CDK 和 AWS SAM 管理各自团队的基础设施。CTO 问了一个问题：不管选哪个工具，最终真正执行资源创建与更新的引擎是哪一个——这决定了审计与排障时该看哪一层的产物。\n\n正确回答是？","o":[{"l":"A","t":"AWS CDK 的合成器——它负责把代码转成模板，是部署流程的中间一步，不是终点。"},{"l":"B","t":"AWS SAM CLI——本地调试与打包用它，线上部署不由它执行，仍要落到 CloudFormation。"},{"l":"C","t":"AWS CloudFormation——CDK 合成、SAM 转换，最终都落到 CloudFormation 模板，由它执行部署，变更历史与栈事件都在这一层。"},{"l":"D","t":"AWS Systems Manager——负责实例层面的配置管理，不承担模板部署，与模板执行无关。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文的原话是「部署都经 CloudFormation 引擎」——CDK 合成出 CloudFormation 模板，SAM 转换成完整 CloudFormation 模板，两者只是「写模板的方式」不同，执行引擎是同一个。所以审计看变更历史、排障看栈事件，都落在 CloudFormation 这一层。\n\n**其他选项为什么错：**\n- A：合成器只负责代码转模板，转完之后部署是 CloudFormation 的事，它不是终点。\n- B：SAM CLI 管本地调试与打包，线上部署走 CloudFormation。\n- D：Systems Manager 管实例配置（补丁、状态、远程执行），与模板部署无关。\n\n**关键概念：** CloudFormation 是 AWS 原生 IaC 的底座，其余工具最终都落到它。","s":"自编·2.1.1"},{"id":"D2-005","d":2,"t":"single","q":"一家金融机构的合规团队提出硬要求：所有基础设施定义必须可以直接逐行审查，审查人员要能读到每个资源的完整定义，不能经过任何代码生成环节。团队工程师偏好 CDK，合规团队坚持可读性优先，双方要找一条都接受的路线。\n\n最贴合的选择是？","o":[{"l":"A","t":"继续用 CDK 部署，把合成的模板存档给合规团队备查即可。"},{"l":"B","t":"改用 SAM 编写，精简语法模板更短，审查起来也更轻松。"},{"l":"C","t":"用控制台手工搭建资源，控制台里每项配置都看得见摸得着。"},{"l":"D","t":"直接用 CloudFormation YAML 编写——声明式模板逐行可读，没有代码生成环节。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 合规要求「逐行可读 + 无代码生成环节」，这两条只有直写 CloudFormation YAML 同时满足。声明式模板描述「要什么」，每个资源的定义直接躺在模板里，审查人员不需要理解任何生成逻辑。\n\n**其他选项为什么错：**\n- A：正文明确提示「CDK 合成的模板可读性差，重审计的场景要权衡」——事后存档不改变产物是生成出来的这一事实。\n- B：SAM 语法精简但仍是转换链路，且只覆盖无服务器形态。\n- C：控制台手工搭建没有版本化的定义文件，恰恰是 IaC 要消灭的做法，也谈不上可审查的「定义」。\n\n**关键概念：** 选型三问之一是「要不要最终可读性」——重审计场景直写 CloudFormation，放弃 CDK 的抽象便利。","s":"自编·2.1.1"},{"id":"D2-006","d":2,"t":"single","q":"一家公司刚把生产基础设施纳入 IaC 管理，团队约定模板统一进 Git，改动必须走 PR 评审，合并后由流水线执行部署。有成员提出：线上有一个小改动很急，本地直接执行部署最快，何必走完整流程。\n\n按 IaC 变更管理原则，正确的处置是？","o":[{"l":"A","t":"同意本地执行——改动小、风险低，事后有空再补 PR 即可。"},{"l":"B","t":"在控制台手工改线上资源——控制台改动实时生效，不用等流水线跑完。"},{"l":"C","t":"拒绝绕行——改动走 PR 评审、合并触发流水线，生产部署前过变更审批；手工绕行就是漂移的源头。"},{"l":"D","t":"让另一名工程师在控制台改，由他个人对这次变更承担责任。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文给的标准链路是「模板进 Git、改动走 PR、合并触发流水线执行部署，生产栈的部署要过变更审批」。急不急不改变流程——本地直接执行或控制台手改都会造成线上状态脱离模板管理，这正是漂移的源头。\n\n**其他选项为什么错：**\n- A：「事后补 PR」意味着线上先出现了未经模板的变更，流程已经破了口子。\n- B：控制台手改是漂移最典型的来源，与 IaC 管理目标直接冲突。\n- D：换个人手改不改变「绕过模板」的性质，责任归属也不是流程问题。\n\n**关键概念：** IaC 的变更管理与代码同轨；禁止本地手工改线上资源。","s":"自编·2.1.2"},{"id":"D2-007","d":2,"t":"single","q":"排查一次生产事故时发现：有人上周为救急在控制台把安全组的入站端口改宽了，但这个改动没有写回模板，线上状态与模板定义已经不一致。团队要按 IaC 的变更管理原则处置这份手工改动。\n\n正确的处置是？","o":[{"l":"A","t":"保留手工改动，把模板里的安全组规则标注为「与线上一致」了事。"},{"l":"B","t":"手工改动先留着不动，等下一次大版本更新时再一并处理。"},{"l":"C","t":"把安全组从模板里移除，改成完全手工管理，避免两边对不上。"},{"l":"D","t":"把改动写回模板，走 PR 评审与流水线重新部署，让线上回到模板管理之下。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 漂移的正道处置就是把改动写回模板——写回之后线上状态重新受模板管理，后续部署不会再因状态不一致出意外。走 PR 与流水线也保证这次改动经过评审，而不是把「救急的手工改动」原样固化。\n\n**其他选项为什么错：**\n- A：只改标注不改定义，模板与真实状态的差异依然存在，下次更新照样踩。\n- B：拖着不处理，漂移期间任何一次按模板的更新都可能触发意外替换。\n- C：把资源移出模板管理是倒退——安全组恰恰是最需要留痕与评审的对象。\n\n**关键概念：** 漂移修复两条路：把改动写回模板（正道），或删掉手工改动恢复模板定义。","s":"自编·2.1.2"},{"id":"D2-008","d":2,"t":"single","q":"一个团队听闻 CloudFormation 提供漂移检测功能，运维主管在周会上提出三个期待：发现手工改动、自动恢复配置、从此不用做变更审批。团队需要先弄清漂移检测的真实能力边界，再决定怎么把它写进流程。\n\n对漂移检测能力边界的准确描述是？","o":[{"l":"A","t":"能发现「当前状态与模板状态」的差异，但发现不等于修复——修复要么写回模板，要么删掉手工改动。"},{"l":"B","t":"会定期自动把线上资源恢复成模板定义，全程无需人工介入。"},{"l":"C","t":"启用之后，控制台上的手工改动会被引擎直接拒绝执行。"},{"l":"D","t":"可以替代变更审批环节，检测无差异的部署自动放行。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 漂移检测回答的是「线上状态与模板定义哪里不一样」，它是一个检测工具。正文明确说「发现不等于修复」——修复要么把改动写回模板（正道），要么删掉手工改动恢复模板定义，两件事都要人来做。\n\n**其他选项为什么错：**\n- B：漂移检测不做自动恢复，把「发现」当成「修复」是题干三个期待里最危险的误解。\n- C：它不拦截控制台操作——手工改动照样发生，只是事后能被查出来。\n- D：变更审批是流程控制，漂移检测是状态比对，两者管的事不同，不能互相替代。\n\n**关键概念：** 漂移检测＝发现差异；修复＝写回模板或删除手工改动，均需人工决策。","s":"自编·2.1.2"},{"id":"D2-009","d":2,"t":"single","q":"一个团队要更新生产环境的 CloudFormation 栈，这次改动同时涉及网络与计算两类资源。团队担心更新过程中某些资源被替换导致数据丢失，希望在真正执行之前先看清楚这次更新到底会改什么、删什么。\n\n最贴合的动作是？","o":[{"l":"A","t":"先创建变更集，预览这次更新会修改、替换或删除哪些资源，确认无害再执行。"},{"l":"B","t":"先跑一次漂移检测，对比线上状态与模板定义的差异再更新。"},{"l":"C","t":"给整个栈开启删除保护后直接更新，让引擎自行判断资源去留。"},{"l":"D","t":"把当前栈导出成模板快照，更新完成后人工对比两份模板。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 变更集（change set）就是为这个场景设计的：部署前预览「这次会改什么、删什么」，正文强调「生产栈必用」。团队担心的「替换导致数据丢失」恰恰能在变更集里提前看到——看到「替换」字样就停手核查。\n\n**其他选项为什么错：**\n- B：漂移检测比的是「线上现状与旧模板」的差异，回答不了「这次更新会带来什么」。\n- C：删除保护防的是整个栈被删，拦不住更新过程中的资源替换。\n- D：更新完再对比是事后诸葛亮，资源已经按引擎的决定动过了。\n\n**关键概念：** 变更集很便宜，救的是整库——生产栈更新前先出变更集。","s":"自编·2.1.2"},{"id":"D2-010","d":2,"t":"single","q":"一家公司的安全审计发现：两百多台 EC2 实例的补丁水平参差不齐，有的半年没打过补丁。安全团队要求把补丁工作制度化：每周固定窗口批量打补丁、打完出合规报告，全程不能依赖工程师手动登录实例操作。\n\n最贴合的服务是？","o":[{"l":"A","t":"AWS Config——记录资源配置历史并按规则评估合规，但只评估不动手。"},{"l":"B","t":"AWS AppConfig——灰度下发应用参数与功能开关，管不到操作系统补丁。"},{"l":"C","t":"AWS OpsWorks——Chef/Puppet 托管形态，可以安排补丁作业与报告。"},{"l":"D","t":"AWS Systems Manager Patch Manager——按补丁基线与维护窗口批量打补丁，并输出合规结果。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 题干的三个要素——固定窗口、批量执行、出合规报告——正好是 Patch Manager 的能力组合：先定义补丁基线，再绑维护窗口，到点自动对实例队列打补丁，合规结果直接可查。全程不需要登录任何一台实例。\n\n**其他选项为什么错：**\n- A：Config 是审计主力，能告诉你「哪些实例补丁不合规」，但它只评估、不执行打补丁。\n- B：AppConfig 管应用层参数下发，操作系统补丁不在它的对象范围里。\n- C：OpsWorks 已停止向新客户开放，考试出现时正解倾向 SSM 替代。\n\n**关键概念：** 「实例要统一打补丁」对应 SSM Patch Manager；先问「管什么对象」，再对服务。","s":"自编·2.1.3"},{"id":"D2-011","d":2,"t":"single","q":"一家公司的合规部门提出两个要求：一是生产账号里每个安全组、每个存储桶的配置变更都要留下历史记录，随时可回溯「谁在什么时候改成了什么」；二是要按内部基线自动评估违规并触发告警。\n\n最贴合的服务是？","o":[{"l":"A","t":"AWS Systems Manager State Manager——把实例配置拉到期望状态，不做全量配置历史记录。"},{"l":"B","t":"AWS AppConfig——面向应用参数的校验与灰度下发，与资源合规无关。"},{"l":"C","t":"AWS Config——记录资源配置历史，按规则评估合规并触发告警，是审计主力。"},{"l":"D","t":"AWS CloudFormation——管理资源的创建与更新，不负责持续的合规评估。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 两个要求正好对应 Config 的两大能力：资源配置历史（记录每个资源的配置变化，可回溯）与规则评估（按基线规则自动判定违规并告警）。正文对 Config 的定位就是「管资源合规、审计主力」。\n\n**其他选项为什么错：**\n- A：State Manager 的对象是实例配置的期望状态，不记录安全组、存储桶这类资源的历史。\n- B：AppConfig 管应用层参数，题干问的是云资源。\n- D：CloudFormation 管部署，部署完之后持续评估合规不是它的事。\n\n**关键概念：** 「资源要留配置历史并告警」对应 Config 规则；四个带「配置」的服务先问管什么对象。","s":"自编·2.1.3"},{"id":"D2-012","d":2,"t":"single","q":"一个产品团队在推新功能：想按 5%、20%、100% 三档逐步放量，配置值在下发前要先过一轮语法与取值校验，避免一个错误参数打挂全部用户。还有一个硬要求：改配置不能触发重新部署。团队想用托管服务把发布流程标准化，而不是靠人手工盯放量节奏。\n\n最贴合的服务是？","o":[{"l":"A","t":"AWS AppConfig——带校验与灰度发布地下发功能开关与参数，应用层配置变更无需重新部署。"},{"l":"B","t":"AWS Systems Manager Parameter Store——存取参数没问题，但没有原生灰度放量与发布校验。"},{"l":"C","t":"AWS Config——评估资源配置合规，与应用参数的下发节奏无关。"},{"l":"D","t":"重新打包部署 Lambda——每次改配置就发一版，直接违反「改配置不发版」的硬要求。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 题干四个要素——分档放量、下发前校验、防止错误参数、不发版——正是 AppConfig 的标准画像：配置下发带校验器，灰度策略按比例放行，应用读取新配置即生效，全程不动部署。\n\n**其他选项为什么错：**\n- B：Parameter Store 解决「参数存在哪、怎么取」，灰度放量与发布校验不是它的职责。\n- C：Config 的对象是云资源配置合规，跟应用参数没关系。\n- D：把配置变更绑到部署上，既是题干明令禁止的，也把风险放大到每次发版。\n\n**关键概念：** 「应用参数要灰度下发」对应 AppConfig；应用层配置变更不用重新部署。","s":"自编·2.1.3"}],"sections":[{"h":"定义云基础设施与可复用组件，覆盖系统全生命周期（Define cloud infrastructure and reusable components to provision and manage systems throughout their lifecycle.）","body":"### 这一域考什么\n\nD2 占 17%，核心问题一句话：同一套模板，能不能在 N 个账号里安全地长出一样的环境。考试默认你管理的是多账号组织，不是单账号孤岛——题干常给「五个账号、两个区域、要统一开一个新服务」的场景，问用什么工具、权限模型怎么配。\n\n三条主线贯穿全域：\n\n1. **模板怎么写**（任务 2.1）：CloudFormation / CDK / SAM 三套 IaC 工具的取舍，模板怎么复用、治理怎么内嵌。\n2. **账号怎么开**（任务 2.2）：Organizations 与 Control Tower 的分工、SCP 与角色代入、规模化治理。\n3. **长出来的东西怎么持续管**（任务 2.3）：漂移检测、补丁、配置状态、软件合规——运维的日常。\n\n### 学习主线\n\n按任务顺序（2.1 → 2.2 → 2.3）学。提醒两点：账号供给（任务 2.2）放在 IaC 域内，官方视角是「账号本身也是代码」；大规模环境自动化（任务 2.3）是运维日常，漂移与补丁考得比模板细节更频繁——别把精力全押在写模板上。\n\n### 常见失分点\n\n1. **StackSets 两种权限模型混淆**。自助管理（self-managed）要在每个目标账号预建 IAM 角色；服务管理（service-managed）由 Organizations 代授，只能用于组织内账号。分不清就选错权限方案。\n2. **Control Tower 与既有组织的融合代价**。已有 Organizations 的组织接入 Control Tower，护栏只覆盖注册进来的 OU——不是接入即全量生效。\n3. **漂移与自动修复的边界**。Config 能发现漂移、SSM State Manager 能把配置拉回期望状态，但「什么都能自动修」是错误直觉——期望状态没定义清楚的地方只能先告警。\n\n#### 这一节学什么\n这一节对应考纲任务 2.1「定义云基础设施与可复用组件，覆盖系统全生命周期（Define cloud infrastructure and reusable components to provision and manage systems throughout their lifecycle.）」。\n\n> 官方原名：Define cloud infrastructure and reusable components to provision and manage systems throughout their lifecycle.\n> 本任务 7 条（Knowledge 3 / Skill 4）。三条 Knowledge 按域骨架规则并入：IaC 选项与工具作任务级原理铺垫；变更管理流程并入编写部署 IaC 模板节（2.1.4）；配置管理服务与策略并入选定配置管理服务节（2.1.6）。\n\n**任务综述**：这个任务考「基础设施怎么用代码表达」。四个技能点是一条链：写模板（2.1.4）→ 大规模铺开（2.1.5）→ 铺开之后谁管配置（2.1.6）→ 模板怎么沉淀成组织资产（2.1.7）。学员最容易卡在工具选型——CloudFormation、CDK、SAM 名字都带 AWS，分工完全不同，考试爱在这三个名字上设混淆项。\n\n**原理铺垫：IaC 选项与工具（Knowledge 2.1.1）**。三套官方工具各管一层：\n\n- **AWS CloudFormation**：声明式模板（YAML/JSON），描述「要什么」，引擎算出「怎么建」。AWS 原生 IaC 的底座，其余工具最终都落到它。\n- **AWS CDK**：用编程语言（TypeScript、Python 等）写基础设施，合成为 CloudFormation 模板再部署。适合有工程能力的团队——能用循环、函数、抽象做复用。\n- **AWS SAM**：CloudFormation 的无服务器扩展——精简语法写 Lambda、API 网关与事件源，部署时转成完整 CloudFormation。\n\n第三方工具（Terraform 等）不在服务清单内，作对照物：考试问「AWS 原生方案」时答案不会是它。\n\n**变更管理怎么走（Knowledge 2.1.2 的原理铺垫）**：IaC 的变更管理与代码同轨——模板进 Git、改动走 PR、合并触发流水线执行部署。生产栈的部署要过变更审批（CodePipeline 的审批阶段），禁止本地手工改线上资源——手工改就是漂移的源头。\n\n#### 编写并部署 IaC 模板（SAM / CloudFormation / CDK）\n\n**这条在问什么**：给一个场景（无服务器应用、传统三层架构、需要强抽象的多人团队），选对工具并说清部署要点。\n\n**定义**：选型判断三问：\n\n- **是不是纯无服务器**：Lambda 加 API 网关加事件源 → SAM 最省。\n- **团队会不会写代码**：会 → CDK，抽象与复用能力最强；主要靠运维 → CloudFormation YAML 直给。\n- **要不要最终可读性**：CDK 合成的模板可读性差，重审计的场景要权衡。\n\n**机制**：部署都经 CloudFormation 引擎，共享同一套核心概念——栈（stack）是部署单元，变更集（change set）先算差异再执行：\n\n- **变更集**：部署前预览「这次会改什么、删什么」，生产栈必用。直接更新的风险是引擎自动替换资源——替换等于删除重建，数据就没了。\n- **栈策略（stack policy）**：保护关键资源（如数据库）不被意外更新。\n- **删除保护（termination protection）**：防误删整栈。\n\n**漂移检测**：模板外手工改资源（控制台点出来的），CloudFormation 的漂移检测（drift detection）能发现「当前状态 vs 模板状态」的差异。发现不等于修复——修复要么把改动写回模板（正道），要么删掉手工改动恢复模板定义。\n\n#### 案例\n\n一个团队用 CloudFormation 管生产库，有人为救急在控制台把安全组改宽了端口。两周后另一个人照模板更新栈，变更集显示「替换数据库实例」——手工改动让引擎误判需要重建。靠变更集提前拦下，靠漂移检测定位到那份手工改动，写回模板闭环。变更集很便宜，救的是整库。\n\n**关联服务**：AWS CloudFormation、AWS CDK、AWS SAM、AWS CodePipeline。\n\n#### 跨账号跨区域应用 CloudFormation StackSets\n\n**这条在问什么**：一个模板要铺到五个账号、两个区域——怎么部署、权限怎么给。StackSets 是本题唯一主角，权限模型是考点核心。\n\n**定义**：AWS CloudFormation StackSets 把一个模板一次性部署到多账号多区域，每个「账号×区域」组合生成一个栈实例（stack instance）。管理一个模板，处处一致。\n\n**两种权限模型**：\n\n| | 自助管理（self-managed） | 服务管理（service-managed） |\n|---|---|---|\n| 权限来源 | 手工在管理账号与目标账号预建 IAM 角色 | Organizations 代授，无需预建角色 |\n| 适用范围 | 任意账号（含组织外） | 仅组织内账号 |\n| 前置成本 | 每账号都要建角色，账号多则繁琐 | 管理账号启用可信访问即可 |\n\n**考试判断**：题干说「组织内全部账号统一部署」→ 服务管理（省角色）；「要部署到合作方账号（组织外）」→ 只能自助管理。题干出现「组织外」三个字，服务管理直接排除。\n\n**部署选项**：按容错容量（failure tolerance）与最大并发（max concurrent）控制铺开节奏；某实例部署失败不影响已成功的栈实例，可针对失败实例单独重试。\n\n#### 案例\n\n一个组织 12 个账号要统一开启 CloudTrail 多区域追踪。用服务管理 StackSets：管理账号启用 Organizations 可信访问，一次部署覆盖 12 个账号 × 2 个区域。后来要给一家刚并进来的子公司（还是独立组织）也开追踪——服务管理够不着，改走自助管理：在子公司账号预建两个 IAM 角色，再用同一个模板部署。两种模型各用一次，边界就记住了。\n\n**关联服务**：AWS CloudFormation（StackSets）、AWS Organizations、AWS IAM。\n\n#### 选定合适的配置管理服务（OpsWorks / SSM / Config / AppConfig）\n\n**这条在问什么**：四个名字都带「配置」，分工完全不同。给一个需求场景，选对服务——这是本任务最容易失分的选型题。\n\n**定义**：配置管理服务与策略的分工（Knowledge 2.1.3 的原理铺垫）：\n\n- **AWS Systems Manager（SSM）**：管实例——清单、打补丁、远程执行、把实例配置拉到期望状态。运维主力。\n- **AWS Config**：管资源合规——记录资源配置历史、按规则评估合规、发现漂移。审计主力。\n- **AWS AppConfig**：管应用配置——功能开关与参数下发，带校验与灰度发布。应用层配置变更不用重新部署。\n- **AWS OpsWorks**：Chef/Puppet 托管形态，已停止向新客户开放（以官方公告为准）——考试出现时正解倾向 SSM 替代。\n\n**考试判断**：「实例要统一打补丁」→ SSM Patch Manager；「资源要留配置历史并告警」→ Config 规则；「应用参数要灰度下发」→ AppConfig；「实例配置漂了要拉回」→ SSM State Manager。四个服务答的是四件不同的事——先问「管什么对象」，再对服务。\n\n#### 案例\n\n一个团队要解决三件事：实例补丁不齐、生产安全组被手工改、应用参数改一次要发一次版。选型落地：SSM Patch Manager 定补丁窗口，Config 规则盯安全组变更并告警，AppConfig 管功能开关带灰度——三件事三个服务，各管一层。把三个名字混成「都行」是最常见的错法。\n\n**组合用法**：四个服务不互斥。常见组合是 Config 定合规基线、SSM 把实例拉到基线、AppConfig 管应用层参数。考试给复合场景（如「既要发现违规又要自动纠正」）时，答案常是两个服务连线，而不是单选一个。\n\n**关联服务**：AWS Systems Manager、AWS Config、AWS AppConfig、AWS OpsWorks。\n\n#### 把治理控制写进可复用模板（Service Catalog / CFN modules / CDK）\n\n**这条在问什么**：模板怎么从「一个项目的脚本」变成「全组织的产品」。治理不是靠人提醒，是写进模板和目录里。\n\n**定义**：三层复用机制：\n\n- **CloudFormation 模块（module）**：把一组资源打包成可复用单元——模块内固化安全组规则与加密配置，使用者只填业务参数。\n- **AWS CDK construct**：代码级抽象，效果同模块，抽象能力更强。\n- **AWS Service Catalog**：把核准的模板做成产品目录——开发者像点菜一样申请基础设施，能拿到什么、参数范围多大，目录说了算。\n\n**机制**：治理控制内嵌的常见做法：\n\n- 模板里硬编码安全基线：加密默认开启、禁用公网访问、强制打标签。\n- Service Catalog 设约束（constraint）：限制实例类型、强制启动通知、绑定特定角色。\n- 交付物带版本：目录产品更新走版本号，旧版本仍可用，新申请走新版。\n\n**取舍口吻**：约束多，开发者自由度小、合规强；约束少，速度快、风险散。考试问「既要给开发者自助能力又要守住安全基线」→ Service Catalog 加约束，而不是「给开发者管理员权限」或「全部手工审批」。\n\n#### 案例\n\n一个组织 30 个团队各自建 S3 桶，半年出了 4 次公开暴露事故。治理改法：把「加密 + 阻止公开访问 + 生命周期规则」固化成 CloudFormation 模块，上架 Service Catalog，产品约束限定只读角色。团队自助申请，10 分钟拿到合规的桶；想绕过目录自己开桶，Config 规则直接标违规。自助与合规不打架，靠的是把基线做进产品。\n\n**关联服务**：AWS Service Catalog、AWS CloudFormation（modules）、AWS CDK、AWS Config。\n\n---"},{"h":"在多账号或多区域环境中自动化创建、纳管与加固账号（Deploy automation to create, onboard, and secure AWS accounts in a multi-account or multi-Region environment.）","body":"#### 这一节学什么\n这一节对应考纲任务 2.2「在多账号或多区域环境中自动化创建、纳管与加固账号（Deploy automation to create, onboard, and secure AWS accounts in a multi-account or multi-Region environment.）」。\n\n> 官方原名：Deploy automation to create, onboard, and secure AWS accounts in a multi-account or multi-Region environment.\n> 本任务 5 条（Knowledge 1 / Skill 4）。Knowledge 条（账号结构最佳实践）按域骨架规则作任务级原理铺垫。\n\n**任务综述**：这个任务把「开账号」当成工程问题：批量开、按结构归组、进门就配好护栏。考试场景集中在三个：新业务要开一批账号怎么自动化、Control Tower 和 Organizations 怎么分工、SCP 怎么设计才不把人锁死。学员最容易卡的是 Control Tower 的定位——它是「管组织的控制台」，不是又一个 IAM 服务。\n\n**原理铺垫：账号结构与最佳实践（Knowledge 2.2.1）**。多账号结构的核心是按职责分层：\n\n- **管理账号**：只管组织与计费，不跑业务负载——它权限最大，被攻陷等于整个组织失守。\n- **日志/审计账号**：集中收 CloudTrail 与 Config 聚合数据，只读。\n- **工作负载账号**：按环境（生产/非生产）或业务线分账号——爆炸半径（一次事故波及的范围）隔离的基本盘。\n\n最佳实践一条主线：账号是隔离边界，策略是隔离手段。安全组、IAM 策略管得住一台资源，管不住「有人拿了生产账号的钥匙」——账号级隔离才是硬边界。\n\n#### 标准化并自动化账号开通与配置\n\n**这条在问什么**：开一个新账号，不能是登控制台点几下。怎么让新账号出生即合规——护栏、网络、日志、基线全配齐。\n\n**定义**：账号开通自动化 = 一个流程串起「创建账号 → 归入 OU → 配基线」。手工开的账号十有八九缺护栏，这是审计高频缺陷。\n\n**机制**：\n\n- **创建**：Organizations API（CreateAccount）或 Control Tower 的账号工厂（Account Factory）批量创建。\n- **归组**：新账号按用途放进对应 OU——OU 是治理策略（SCP、护栏）的挂载点，放错 OU 就吃不到策略。\n- **配基
