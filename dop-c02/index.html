以后补——运行一段时间就知道该定义什么。"},{"l":"D","t":"期望状态定义必须先于自动修复存在——定义不存在的状态，自动拉回就是在制造事故。"},{"l":"E","t":"OpsWorks（Chef/Puppet 托管）是新建环境的首选期望状态方案。"}],"a":["B","D"],"e":"**正确答案：BD。**\n\n**为什么对：** B 是工具分工的原话——两层各管一段，谁也不替代谁；D 是取舍口吻的原话——「拉回有前提：期望状态定义必须先于自动修复存在。定义不存在的状态，自动拉回就是在制造事故」。两条合起来就是期望状态设计的完整边界。\n\n**其他选项为什么错：**\n- A：State Manager 管实例内部状态，资源生命周期是 CloudFormation 的领地，越界必然残缺。\n- C：顺序反了——先有定义才有拉回，后补定义期间系统会把不知道的东西「修」掉。\n- E：OpsWorks 已停止向新客户开放，新建环境不选它。\n\n**关键概念：** 定义先于修复；IaC 建资源、State Manager 保状态，两层不互替。","s":"自编·2.3.5"},{"id":"D2-080","d":2,"t":"single","q":"一个组织的安全基线要求：所有实例必须安装指定版本的监控代理，且新扩容的实例要自动满足这条要求，不允许出现「装了但版本不对」或「新实例漏装」的窗口期。安全团队要求机制上线后不再依赖任何人的自觉。\n\n最贴合的机制是？","o":[{"l":"A","t":"每季度发布一次安装清单，各团队按清单自查补装，季度末汇总核对。"},{"l":"B","t":"用一次性脚本全网跑一遍安装命令，跑完即认为达标，下季度再跑一遍。"},{"l":"C","t":"State Manager 关联：文档定义「安装并启动指定版本代理」，目标按标签圈定，新标签实例自动纳入，偏离自动纠正。"},{"l":"D","t":"Config 规则评估代理安装状态，发现缺失的实例自动生成告警工单。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文考试判断原话：「确保所有实例都装了指定版本的监控代理 → State Manager 关联」。关联的标签目标让新扩容实例打上标签即自动纳入，代理周期检查把「装了但版本不对」自动纠正——「持续」二字由期望状态机制保证，窗口期不存在。\n\n**其他选项为什么错：**\n- A：季度自查是「一次性思维」，窗口期长达一个季度。\n- B：一次性脚本正是正文点名的错误项——题眼是「持续」，脚本跑完新漏装无人管。\n- D：Config 只发现不纠正，告警工单还是落到人头上，保证不了自动达标。\n\n**关键概念：** 期望状态机制＝文档定义动作＋标签圈目标＋周期自纠偏离；新实例打标签即纳入。","s":"自编·2.3.6"},{"id":"D2-081","d":2,"t":"single","q":"安全审计要求一家公司回答：全部实例里有没有装未授权软件的？分别在哪几台、什么版本？公司此前没有持续盘点机制，只能临时安排工程师逐台登录查看，两天才盘完，且无法保证盘完之后不新增。\n\n最贴合的机制是？","o":[{"l":"A","t":"把逐台登录的动作写成标准检查脚本，分发给各团队按周执行并回执。"},{"l":"B","t":"用 Patch Manager 的合规报告——它能列出每台实例安装的第三方软件清单。"},{"l":"C","t":"用 Service Catalog 约束软件安装——目录产品没上架的软件一律装不了。"},{"l":"D","t":"SSM Inventory 收集全部实例的软件清单，与禁止列表比对——超期版本、禁用软件立刻现形，合规面板持续输出达标率。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文考试判断原话：「发现哪个实例装了未授权软件 → Inventory 加合规面板」。清单能力自动收集全部实例的软件信息，与策略比对后禁用软件立刻现形，且是持续收集——盘完之后新增的软件也会被下一轮清单抓出来。\n\n**其他选项为什么错：**\n- A：按周人工执行仍是分布式手工，覆盖与时效都无法保证，审计要的是持续机制。\n- B：Patch Manager 管补丁，第三方软件清单盘点是 Inventory 的职责。\n- C：Service Catalog 约束的是基础设施申请，不是实例内的软件安装行为。\n\n**关键概念：** 清单比对现状、State Manager 固化状态、合规面板输出达标率——软件合规三步。","s":"自编·2.3.6"},{"id":"D2-082","d":2,"t":"single","q":"一个组织的软件合规策略要求：消息代理的版本不能低于 3.2，低于基线的实例要自动升级；三个月前整改过的 12 台实例不能复发，新扩容实例也要自动达标。审计问「怎么保证不再犯」。\n\n最贴合的落地方式是？","o":[{"l":"A","t":"定义版本基线关联（低于 3.2 自动升级），让清单确认全量达标，合规面板显示达标率——三个月后新扩实例自动进入关联范围，合规从「一次整改」变成「持续状态」。"},{"l":"B","t":"把 12 台过期实例手工升级到 3.2 以上，留档整改记录备审计查验。"},{"l":"C","t":"在入职培训里加入版本基线要求，让各团队自行保证新实例的版本。"},{"l":"D","t":"用 Security Hub 每月扫描一次全组织实例的软件版本，输出月度合规报告。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文场景举例的原型就是这道题：「先定义版本基线关联（低于 3.2 自动升级），再让清单确认全量达标，合规面板显示 100%。三个月后新扩的实例自动进入关联范围——合规从『一次整改』变成『持续状态』。审计问『怎么保证不再犯』，答案就是这套期望状态」。\n\n**其他选项为什么错：**\n- B：手工升级 12 台只解决存量，复发与新扩实例漏装都没有机制保证。\n- C：培训靠自觉，与「不能依赖任何人的自觉」的整改目标相反。\n- D：Security Hub 是聚合面板，不做版本基线的定义与自动升级动作。\n\n**关键概念：** 版本基线＝关联定义「低于 3.2 自动升级」＋清单确认达标＋面板持续输出。","s":"自编·2.3.6"},{"id":"D2-083","d":2,"t":"multiple","q":"一个组织要落地软件合规体系：允许列表（只许装什么）、禁止列表（发现即处理）、版本基线（不能低于哪个版本）三样都要有机制承载。平台团队列出了候选做法，评审时要挑出正确的三条。\n\n关于软件合规的机制承载，正确的三项是？（请选择三项）","o":[{"l":"A","t":"允许的软件用 State Manager 关联保证在装且版本正确。"},{"l":"B","t":"用一次性整改脚本全网跑一遍，跑完即认定合规达成。"},{"l":"C","t":"靠工程师手工季度盘点发现未授权软件，盘点结果邮件汇总。"},{"l":"D","t":"禁用的软件用关联保证「发现即卸」，卸载动作自动执行。"},{"l":"E","t":"SSM 合规面板按实例与关联聚合达标率，可接入 Security Hub 统一呈现。"}],"a":["A","D","E"],"e":"**正确答案：ADE。**\n\n**为什么对：** 三条正好是正文给的机制链：允许的软件用关联固化（A）、禁用的软件用关联保证「发现即卸」（D）、合规面板聚合达标率并可接入 Security Hub（E）。载体始终是 SSM 三件套——清单看现状、关联保状态、面板出结果。\n\n**其他选项为什么错：**\n- B：题眼是「持续」二字——一次性脚本全是错误项，跑完的瞬间就开始过期。\n- C：手工盘点没有持续性与覆盖率保证，正是这道体系要替代的对象。\n\n**关键概念：** 允许列表固化、禁止列表即卸、版本基线自动升级——全部走期望状态机制。","s":"自编·2.3.6"},{"id":"D3-003","d":3,"t":"single","s":"自编·3.1.1","q":"一家公司刚完成系统的高可用改造评审。架构师在方案里写了「本系统按 Multi-AZ 部署」，管理层追问这套方案到底能防住什么级别的故障，是不是就等于拥有了区域级容灾能力。团队要按 Multi-AZ 与 Multi-Region 的分层定义向管理层讲清楚边界。\n\n关于 Multi-AZ 方案的能力边界，正确的说法是？","o":[{"l":"A","t":"Multi-AZ 能防住区域级故障，一个区域整体不可用时系统照常运行，无需任何额外动作。"},{"l":"B","t":"Multi-AZ 能防住任何级别的故障，包括区域级——只要实例分布在多个数据中心就自动获得跨区域容灾。"},{"l":"C","t":"Multi-AZ 防的是可用区级故障——实例分布在区域内多个物理隔离的数据中心，防不了整个区域的故障。"},{"l":"D","t":"Multi-AZ 与 Multi-Region 防的故障类型完全相同，只是部署成本不同，选哪个只看预算。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文的分层定义很明确：Multi-AZ 是区域内多个物理隔离的数据中心，防的是可用区级故障；区域级故障（整个区域不可用）超出它的防护半径。\n\n**其他选项为什么错：**\n- A：区域级故障要靠 Multi-Region，Multi-AZ 的所有实例都在同一个区域内。\n- B：多数据中心不等于多区域——AZ 再多也在一个区域内，没有跨区域容灾能力。\n- D：两者防的故障类型不同：AZ 级与区域级是两个量级，成本与复杂度也差一个量级，不是只看预算。\n\n**关键概念：** 高可用按故障半径分层：Multi-AZ 防 AZ 级故障（分钟内自动切换），Multi-Region 防区域级故障（成本与复杂度高一个量级）。先想防什么故障，再选档位。"},{"id":"D3-004","d":3,"t":"single","s":"自编·3.1.1","q":"一个团队在评审灾备方案时发生了争论。一位成员认为：数据层既然在 Multi-AZ 里是同步复制的，那么扩展到跨区域部署后副本也应该与主库保持零延迟同步，切换时不会丢任何数据。架构师指出这是把两个层级的复制语义混为一谈了。\n\n架构师的依据是？","o":[{"l":"A","t":"跨区域的数据复制多为异步——存在复制延迟，切换时可能丢失最近写入；同步复制是 Multi-AZ 内的语义，不能套用到 Multi-Region。"},{"l":"B","t":"跨区域复制也是同步的，只是距离更远导致延迟略增，不会丢数据，那位成员的理解只差在延迟数字上。"},{"l":"C","t":"Multi-AZ 的数据层其实也是异步复制，两个层级没有本质区别，争论没有意义。"},{"l":"D","t":"复制是同步还是异步取决于实例规格，与部署在 AZ 内还是跨区域无关。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文写明：Multi-AZ 数据层同步复制；Multi-Region 数据层复制多为异步。异步意味着复制延迟存在，切换时最近一段写入可能还没复制过去——这正是 RPO 概念的来源。\n\n**其他选项为什么错：**\n- B：跨区域同步复制在延迟与成本上不现实，主流跨区域方案（Aurora Global、S3 CRR）都是异步。\n- C：Multi-AZ 是同步复制，这正是它切换快、RPO 趋近零的原因，两个层级有本质区别。\n- D：同步与否取决于部署层级与产品机制，不是实例规格决定的。\n\n**关键概念：** 同步复制（Multi-AZ 内）≈ 不丢数据；异步复制（跨区域）有复制延迟，RPO 大于零。灾备方案必须把「丢多少数据」算清楚。"},{"id":"D3-005","d":3,"t":"single","s":"自编·3.1.1","q":"一家成本敏感的内部系统，业务方给的停机预算是「全年累计不超过 8 小时」。架构评审时有成员提议：直接上 Multi-Region 把所有故障都防住，一步到位最保险。架构师要按「先定档位再选方案」的顺序给出意见。\n\n最合理的意见是？","o":[{"l":"A","t":"同意直接上 Multi-Region——防的故障越多越好，成本在可接受范围内就值得投入。"},{"l":"B","t":"建议连 Multi-AZ 都不要做，单 AZ 部署加上手工重启脚本就能满足 8 小时的停机预算。"},{"l":"C","t":"建议跳过分层判断，先把所有数据层都换成全局表，再回头看预算够不够。"},{"l":"D","t":"先按停机预算选档：全年 8.8 小时的预算用 Multi-AZ 就够，Multi-Region 成本与复杂度高一个量级，不是这个预算该上的档。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文的方法论是「先想防什么故障，再选手段——顺序反了就会过度设计」。99.9% 对应全年约 8.8 小时停机预算，这个档位用 Multi-AZ 就能满足；Multi-Region 是为区域级故障与分钟级停机预算准备的，成本高一个量级。\n\n**其他选项为什么错：**\n- A：直接上最高档是典型的过度设计，8 小时预算根本用不到区域级容灾。\n- B：单 AZ 连 AZ 级故障都防不住，8 小时的预算也不该这么省。\n- C：跳过档位判断直接换全局表，是把数据层方案当成了起点，方法论完全反了。\n\n**关键概念：** 停机预算决定架构档位：单 AZ → Multi-AZ → Multi-Region，每上一档成本翻着涨。预算与档位匹配，才不过度设计。"},{"id":"D3-006","d":3,"t":"single","s":"自编·3.1.2","q":"一家公司用 Aurora Global Database 做跨区域容灾：主区域在新加坡，东京是只读副本。某次新加坡区域故障，按预案把东京副本提升为主库继续写入。一周后新加坡恢复，运维计划让系统「自动切回」原来的主区域运行。架构师指出这个计划有个关键假设不成立。\n\n不成立的假设是？","o":[{"l":"A","t":"新加坡区域恢复后 Aurora 会自动把主写角色切回新加坡，无需人工干预——这个自动化并不存在。"},{"l":"B","t":"Aurora Global Database 的提升是不可回退的：切完之后原主区域不会自动变回副本，恢复主写关系要手工重建。"},{"l":"C","t":"新加坡恢复后数据会自动从东京回流同步，主库角色会随数据回流动态漂移。"},{"l":"D","t":"Aurora Global Database 支持主区域之间任意互切且可随时撤销，回切只是改一个配置项。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文的机制描述：Aurora Global Database 是「主写 + 提升切换」，故障切换是提升副本为主库，切完之后原主区域不能自动变回副本，恢复要手工再加。所以「自动切回」的假设不成立。\n\n**其他选项为什么错：**\n- A：把不存在的自动化当成了默认行为，方向说反了——Aurora 的提升是单向的。\n- C：数据回流动态漂移不是 Aurora Global 的机制，提升动作是显式的。\n- D：「任意互切、随时撤销」不符合提升后不可回退的语义。\n\n**关键概念：** Aurora Global Database：主写 + 提升切换，切换约 1 分钟、复制延迟约 1 秒；提升不可回退，回切需手工重建副本关系。灾备预案要把这一步写进去。"},{"id":"D3-007","d":3,"t":"single","s":"自编·3.1.2","q":"一个多地区协作系统用 DynamoDB Global Table 实现两个区域同时写入。业务评审时有人担心：两个区域同时改同一条记录怎么办？数据会不会互相覆盖出乱子？架构师要向业务方解释清楚 Global Table 的冲突处理语义，并说明采用前提。\n\n正确的解释是？","o":[{"l":"A","t":"两个区域不会同时改同一条记录——Global Table 会自动加锁，同一时刻只允许一个区域写入。"},{"l":"B","t":"冲突发生时系统会暂停一个区域的写入并人工介入裁决，业务方无需提前做任何假设。"},{"l":"C","t":"冲突靠最后写入胜出（last-writer-wins）解决——业务上必须能接受这种合并语义，才适合用 Global Table。"},{"l":"D","t":"Global Table 两个区域是主备关系，备区域只读，不存在双写冲突的问题。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文写明：DynamoDB Global Table 是多区域主动-主动、双向复制，任意区域可写，冲突靠最后写入胜出解决——业务上要能接受这种合并语义才适合用。\n\n**其他选项为什么错：**\n- A：Global Table 没有跨区域加锁机制，主动-主动正是它的卖点。\n- B：没有人工裁决环节，冲突是自动按时间戳合并的，业务方恰恰需要提前确认能接受这个语义。\n- D：主备只读是 Aurora Global 的形态，与 Global Table 的主动-主动相反。\n\n**关键概念：** 两条复制路线对号入座：Aurora Global＝主写 + 提升切换；DynamoDB Global Table＝多写 + last-writer-wins。「两个区域都要写」选 Global Table，「平时主写、灾时切」选 Aurora Global。"},{"id":"D3-008","d":3,"t":"multiple","s":"自编·3.1.2","q":"一个团队的订单系统要在两个区域部署，业务方明确要求两个区域的用户都能直接写入订单数据，不允许「平时只写一个区域、灾时才切换」的主写模式。架构师在选型会上介绍 DynamoDB Global Table 的机制时讲了四点，但其中混进了别的服务的特性。下列说法正确的有哪些？（选两项）","o":[{"l":"A","t":"Global Table 是主动-主动架构，双向复制，任意区域都可以直接写入。"},{"l":"B","t":"两个区域同时写同一条记录时，冲突靠最后写入胜出（last-writer-wins）自动合并。"},{"l":"C","t":"故障切换的动作是把副本提升为主库，提升后原主区域不能再写。"},{"l":"D","t":"存储层复制延迟约 1 秒，区域切换约 1 分钟完成。"},{"l":"E","t":"切换完成后原主区域会自动变回副本角色，无需人工重建复制关系。"}],"a":["A","B"],"e":"**正确答案：AB。**\n\n**为什么对：** A 与 B 正是 Global Table 的两个核心机制：主动-主动双向复制、last-writer-wins 冲突合并。题干要求两个区域都能直接写，正是选它的理由。\n\n**其他选项为什么错：**\n- C：提升副本为主库是 Aurora Global 的切换方式，Global Table 没有主库概念。\n- D：约 1 秒复制延迟、约 1 分钟切换是 Aurora Global Database 的指标。\n- E：自动回退副本角色是 Aurora 的错误说法，Global Table 更谈不上。\n\n考题常把两者的指标互换当干扰项。\n\n**关键概念：** 两套机制别串门：Aurora Global＝主写 + 提升 + 不可回退；Global Table＝多写 + last-writer-wins。题干「两个区域都直接写」正是选 Global Table 的决定性信号。"},{"id":"D3-009","d":3,"t":"single","s":"自编·3.1.3","q":"一个面向消费者的系统已经完成了 Multi-AZ 改造：计算层跨 AZ 部署、健康检查启用、负载均衡分流、应用无状态化四件事都做完了。管理层在季度评审会上问：离真正的「区域级容灾」还差什么？架构师按正文的技术手段清单回答了升级路径。\n\n正确的回答是？","o":[{"l":"A","t":"只差把实例数量翻倍——更多的实例自然能扛住区域级故障。"},{"l":"B","t":"什么都不缺，Multi-AZ 做完就等于具备了区域级容灾能力。"},{"l":"C","t":"只差把负载均衡器换成 NLB，四层负载均衡天然具备跨区域分流能力。"},{"l":"D","t":"还差数据层跨区域复制与 DNS 切换——加上这两块才凑齐 Multi-Region。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文的技术手段清单：冗余部署、健康检查、自动故障切换、负载均衡分流、应用无状态化五个手段组合成 Multi-AZ；再加数据复制与 DNS 切换，才凑齐 Multi-Region。\n\n**其他选项为什么错：**\n- A：实例再多也都在一个区域内，区域级故障时全军覆没。\n- B：Multi-AZ 防不了区域级故障，两个档位不能划等号。\n- C：NLB 是四层负载均衡器，跨区域分流靠 DNS 与多区域部署，不是换个均衡器就有。\n\n**关键概念：** Multi-AZ 五手段 → Multi-Region ＝ 五手段 + 数据复制 + DNS 切换。缺的两块分别在数据层与入口层，不在计算层堆数量。"},{"id":"D3-010","d":3,"t":"single","s":"自编·3.1.3","q":"一个初创团队听完高可用分享后热血上头，决定给公司所有系统（包括一个只有十几人用的内部工具）全部上 Multi-Region。架构师按「先想防什么故障，再选手段」的顺序叫停了这个提议，并解释了理由。\n\n架构师的理由是？","o":[{"l":"A","t":"Multi-Region 技术上还不成熟，AWS 的跨区域服务都处于预览阶段，等成熟后再上。"},{"l":"B","t":"顺序反了就会过度设计——不先判断要防什么故障、停机预算是多少，直接选最高档手段，成本会白白翻几倍。"},{"l":"C","t":"内部工具不配做高可用，任何形式的冗余部署都不应该考虑。"},{"l":"D","t":"先上 Multi-Region 没问题，但要同时把所有系统都改造成主动-主动多写架构，否则白做。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文原话：先想防什么故障，再选手段——顺序反了就会过度设计。内部工具的停机预算根本不需要区域级容灾，直接上 Multi-Region 是把成本花在用不着的档位上。\n\n**其他选项为什么错：**\n- A：跨区域服务（S3 CRR、DynamoDB Global Table、Aurora Global 等）都是成熟服务，不是预览态，这个理由站不住。\n- C：说法太绝对，内部工具也可以按低档位做基本冗余，问题是档位不是做不做。\n- D：这是在错误方向上加码，与架构师的立场正好相反。\n\n**关键概念：** 韧性设计的正确顺序：先问停机预算与要防的故障类型，再按档位选手段。手段永远服务于故障半径，不是越贵越好。"},{"id":"D3-011","d":3,"t":"single","s":"自编·3.1.3","q":"一个系统的 Multi-AZ 改造进行到一半：负载均衡与跨 AZ 部署都铺好了，但切换演练时发现，某些实例被替换后用户会莫名掉登录状态，另一部分实例则正常。架构师一眼指出这是应用层不符合高可用手段清单里的某一条。\n\n不符合的是哪一条？修法是什么？","o":[{"l":"A","t":"不符合「应用无状态化」——实例本地存了会话，要把会话外置到 ElastiCache 等共享存储，让任何实例都能被替换。"},{"l":"B","t":"不符合「健康检查」——健康检查没配好导致部分实例被误杀，把检查间隔调长就能解决掉登录问题。"},{"l":"C","t":"不符合「冗余部署」——实例数量不够导致流量集中，加机器就能消除掉登录现象。"},{"l":"D","t":"不符合「自动故障切换」——切换动作本身会把用户会话清空，关掉自动切换改为手工切换就没有这个问题。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文的手段清单里明确包含应用无状态化。掉登录＝会话存在实例本地，流量切到别的实例时本地没有那份会话——正是无状态化缺失的典型症状，修法是把会话外置。\n\n**其他选项为什么错：**\n- B：健康检查调长只是掩盖症状，会话本地化的问题还在，切换后照样掉。\n- C：加机器不解决会话粘在单个实例上的问题，流量怎么分，掉登录的几率都一样。\n- D：手工切换反而放大停机，而且掉登录的根因是会话存储位置，不是切换动作。\n\n**关键概念：** 高可用五手段中，「应用无状态化」是唯一在应用层的一条——基础设施冗余铺得再好，实例本地存状态就会在切换时丢用户上下文。"},{"id":"D3-012","d":3,"t":"single","s":"自编·3.1.4","q":"业务方给一个支付系统提出要求：「系统的可用性要达到 99.99%」。架构师要把这个百分比换算成可执行的停机预算，向团队说明这一年到底允许停多久，以及这个数字对架构档位意味着什么。\n\n99.99% 对应的全年停机预算大约是？","o":[{"l":"A","t":"全年约 8.8 小时——这是 99.9% 档位的预算，用 Multi-AZ 档位通常就能满足。"},{"l":"B","t":"全年约 8.8 分钟——99.99% 已经严格到接近零停机，几乎不允许任何中断。"},{"l":"C","t":"全年约 53 分钟——这个预算下通常必须考虑跨区域方案，Multi-AZ 未必兜得住。"},{"l":"D","t":"全年约 5.3 小时——介于两档之间，按团队资源灵活选择即可。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文给出的换算：99.9%＝全年约 8.8 小时；99.99%＝全年约 53 分钟。53 分钟的停机预算决定架构档位——必须考虑跨区域，Multi-AZ 的分钟级切换与恢复时间未必兜得住。\n\n**其他选项为什么错：**\n- A：8.8 小时是 99.9% 的预算，差了一个数量级。\n- B：8.8 分钟连 99.999% 的量级都不到，数字凭空捏造。\n- D：5.3 小时不在任何标准档位上，是把两个换算混着算出来的错数。\n\n**关键概念：** 可用性百分比 → 停机预算是韧性翻译的第一步：99.9%＝8.8h/年，99.99%＝53min/年。档位判断从这道换算开始。"},{"id":"D3-013","d":3,"t":"single","s":"自编·3.1.4","q":"一份新签的服务合同里写了「服务可用性 99.9%」，但没有写统计周期是按年还是按月。架构团队内部对停机预算吵了起来：一半人按全年口径算出 8.8 小时，另一半人按每月口径算出每月约 43 分钟——两个数字相差近十倍，直接影响架构档位的选择。架构师给出的第一处理动作是什么？","o":[{"l":"A","t":"先问清统计周期再谈档位——SLA 有按月也有按年给的，口径不同预算差几倍，拿到数字先确认口径。"},{"l":"B","t":"按更宽松的全年口径做架构，反正合同没写死，出了争议再说。"},{"l":"C","t":"按更严格的每月口径做架构，宁可过度设计也不能违反合同。"},{"l":"D","t":"统计周期不影响停机预算的换算，两种算法只是表达方式不同，结果等价。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文明确指出这个常见的换算错误：把 99.9% 读成「每月 99.9%」——SLA 有按月也有按年给的，口径不同预算差几倍。拿到数字先问统计周期，再谈档位。\n\n**其他选项为什么错：**\n- B：赌合同不严是侥幸心理，且按宽松口径做架构一旦违约代价更大。\n- C：无依据地按最严口径做，成本可能白白翻倍——过度设计的方向。\n- D：明显错误，按年 8.8 小时与按月 43 分钟×12 是十倍级别的差距。\n\n**关键概念：** SLA 的统计周期（按年/按月）直接决定停机预算的量级，是「把业务需求翻译成技术韧性要求」时必须先钉死的口径。"},{"id":"D3-014","d":3,"t":"single","s":"自编·3.1.4","q":"一个订单管理系统，业务方给出的要求是「全年累计停机不得超过 9 小时，成本敏感，允许分钟级的中断」。这个预算约合 99.9% 的可用性档位。架构师按停机预算反推档位，再选对应的方案档，避免过度设计。\n\n最贴合的方案档是？","o":[{"l":"A","t":"单 AZ 部署——9 小时的预算很宽裕，没必要为可用区级故障花钱。"},{"l":"B","t":"主动-主动 Multi-Region——虽然成本高，但一次到位，后续不用再改造。"},{"l":"C","t":"温备（Warm Standby）跨区域方案——这是 9 小时预算下唯一合规的选择。"},{"l":"D","t":"Multi-AZ——9 小时约对应 99.9% 档位，允许分钟级中断的成本敏感场景，Multi-AZ 就够。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文的换算与档位判断：全年 8.8 小时≈99.9%，这个预算用 Multi-AZ 就够；题干「允许分钟级中断、成本敏感」与 Multi-AZ 的特征（分钟内自动切换、成本增加有限）完全匹配。\n\n**其他选项为什么错：**\n- A：单 AZ 连 AZ 级故障都防不住，分钟级中断的要求也满足不了。\n- B：主动-主动 Multi-Region 是为 99.99% 与区域级故障准备的，9 小时预算用不上，纯属过度设计。\n- C：「唯一合规」不成立——温备是跨区域灾备形态，对应的是更严的 RTO/RPO 要求，不是这个预算档位。\n\n**关键概念：** 停机预算 → 档位：8.8h/年≈Multi-AZ；53min/年≈考虑跨区域。题干出现「成本敏感 + 允许分钟级中断」就是 Multi-AZ 档的信号。"},{"id":"D3-015","d":3,"t":"single","s":"自编·3.1.4","q":"一个内部报表系统，业务负责人在需求会上开口就拍「必须做到 99.99%」。架构师没有直接按这个档位出方案，而是先追问了一个问题；追问之后把档位落在了 99.5%，把省下来的预算投给了核心交易系统的升级。架构师先追问的是什么？","o":[{"l":"A","t":"报表系统用了哪些 AWS 服务——确定技术栈后才能算冗余成本。"},{"l":"B","t":"停机一小时的实际损失——报表晚一小时出没人挨骂，实际档位远低于嘴上拍的 99.99%，按真实损失倒推档位。"},{"l":"C","t":"业务方有没有经历过重大故障——有经历过才能理解高可用的重要性。"},{"l":"D","t":"竞品的可用性 SLA 是多少——对标行业水平定档位最保险。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文的场景举例就是这条路径：问业务要百分比，不给数就按「停机一小时损失多少」倒推。报表晚一小时出没人挨骂＝真实停机容忍远高于 99.99%，按真实损失定档位才是对的。\n\n**其他选项为什么错：**\n- A：技术栈影响成本核算，但定档位的依据是业务损失，不是服务清单。\n- C：业务方有没有故障经历是沟通技巧问题，不是定档依据。\n- D：对标竞品与自身业务容忍度无关，是错误的对标方式。\n\n**关键概念：** 韧性要求向业务要数字，别替业务拍脑袋；拍高了是浪费，拍低了是事故。「停机一小时损失多少」是把模糊要求变成数字的最有效追问。"},{"id":"D3-016","d":3,"t":"single","s":"自编·3.1.5","q":"一个存量系统做完单点故障排查，待修清单上有两项：单实例 RDS 数据库、单 AZ 的 Auto Scaling 组。本周修复时间只够先做一项，架构师按「数据层单点优先于计算层单点」的原则排定了顺序，并向团队解释了这么排的理由。\n\n架构师的理由是？","o":[{"l":"A","t":"Auto Scaling 组挂了可以快速起新实例，实例是可再生的；数据库单实例挂了可能真丢数据，数据层单点的后果不可逆。"},{"l":"B","t":"Auto Scaling 组的配置更复杂，先修复杂的能积累经验，再修数据库就轻松了。"},{"l":"C","t":"RDS 改 Multi-AZ 要停机窗口，Auto Scaling 改配置不停机，应该先做不停机的操作热热身。"},{"l":"D","t":"两项优先级相同，因为都是单点——按清单字母顺序修就行。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文的考试判断：找「没有冗余且有状态」的组件，数据层单点优先于计算层单点——计算层挂了还能快速起新的，数据层挂了可能真丢数据。后果的不可逆性决定优先级。\n\n**其他选项为什么错：**\n- B：修复顺序看后果严重性，不看配置复杂度，这是本末倒置。\n- C：是否停机是实施约束，不是排优先级的依据；风险后果才是。\n- D：同样是单点，有状态与无状态的后果完全不同，不能等权处理。\n\n**关键概念：** 单点修复的排序原则：数据层优先于计算层，有状态优先于无状态——因为数据丢了补不回来，实例没了可以再起。"},{"id":"D3-017","d":3,"t":"single","s":"自编·3.1.5","q":"一个 Web 应用做单点排查时发现：用户的登录会话存在实例本地内存里。负载均衡把流量分到不同实例时，一部分用户频繁掉登录；实例被替换时，所有落在该实例上的用户全部掉线。按单点修复的对应动作，正确的修法是？","o":[{"l":"A","t":"在负载均衡上开启会话粘性，让每个用户的请求始终落在同一台实例上，掉线问题自然消失。"},{"l":"B","t":"给每台实例配置更大的内存，保证本地会话存得更多更久，减少掉线概率。"},{"l":"C","t":"把会话外置到 ElastiCache 等共享存储，让任何实例都能读取会话——实例可随意替换，掉线根因消除。"},{"l":"D","t":"缩短会话有效期，让用户更频繁地重新登录，减少单次掉线的影响范围。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文的逐层修复清单里明确对应动作：本地会话 → 会话外置到 ElastiCache。会话外置后实例无状态，切换与替换都不再影响用户登录态，根因消除。\n\n**其他选项为什么错：**\n- A：会话粘性只是绕过问题——实例被替换时用户照样掉线，而且破坏了负载均衡的均匀性。\n- B：内存再大也改变不了「会话绑死单实例」的结构，替换实例时照样全掉。\n- D：缩短有效期是惩罚用户，不是修复单点。\n\n**关键概念：** 本地会话是典型的「有状态单点」，修法只有一个方向：状态外置到共享存储，让实例可随意替换。粘性会话是绕行不是修复。"},{"id":"D3-018","d":3,"t":"single","s":"自编·3.1.5","q":"一个系统的 Auto Scaling 组只配置了一个可用区，所有实例都在同一个 AZ 里。上月该 AZ 的一次网络事件导致整个服务中断了两小时，业务方要求给出整改方案，确保同类事件不再造成全停。\n\n针对这类单点，正确的修法是？","o":[{"l":"A","t":"把 Auto Scaling 组的最大容量调大一倍，单 AZ 内更多的实例可以分摊故障时的压力。"},{"l":"B","t":"把 Auto Scaling 组改为跨多个 AZ 配置，并把最小容量设为 ≥2，让任何一个 AZ 都有健康实例兜底。"},{"l":"C","t":"给 Auto Scaling 组配置更激进的扩容策略，故障发生时快速扩容补位即可，无需跨 AZ。"},{"l":"D","t":"给实例配置更频繁的健康检查，让故障实例尽快被发现并替换，单 AZ 也能达到同等可用性。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文的修复对应动作：单 AZ 的 Auto Scaling 组 → 补 AZ 配置并设容量下限。跨 AZ + 最小容量 ≥2，任何一个 AZ 出问题时其余 AZ 的健康实例继续接流量。\n\n**其他选项为什么错：**\n- A：最大容量再大也都在一个 AZ 里，AZ 级故障时全部实例一起挂，数量救不了层级。\n- C：扩容策略解决的是流量压力，解决不了 AZ 整体不可用。\n- D：健康检查替换的是坏实例，防不了 AZ 整体故障——这是层级错位的修复。\n\n**关键概念：** 单 AZ 是部署层单点，修复动作是跨 AZ 配置 + 容量下限；扩容与健康检查属于不同层，防的是流量压力与坏实例。"},{"id":"D3-019","d":3,"t":"multiple","s":"自编·3.1.5","q":"一个团队在给存量系统做单点故障排查，组长让每人先整理自己的排查方法，再汇总成团队规范。小张交上来的方法清单里有下列几条说法，其中有对有错。按照正文给出的排查方法与修复原则，正确的有哪些？（选两项）","o":[{"l":"A","t":"排查从用户流量入口顺藤摸瓜：DNS、负载均衡、计算层、数据层逐层检查。"},{"l":"B","t":"计算层单点的修复优先级高于数据层单点，因为实例数量多、影响面大。"},{"l":"C","t":"优先修「没有冗余且有状态」的组件，数据层单点挂了可能真丢数据。"},{"l":"D","t":"手工切换的备机比自动健康检查更可靠，应该保留手工切换作为最终方案。"},{"l":"E","t":"单 NAT 网关不算单点，因为 NAT 网关本身是托管服务不会故障。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** A 正是正文的排查路径：从用户流量入口顺藤摸瓜，DNS 与入口、负载均衡层、计算层、数据层逐层过。C 正是修复原则：找「没有冗余且有状态」的组件，数据层单点优先。\n\n**其他选项为什么错：**\n- B：优先级反了——计算层挂了能快速起新实例，数据层挂了可能真丢数据。\n- D：正文的修复动作恰恰是「手工切换的备机 → 自动健康检查加自动切换」，手工切换反应慢且依赖人在场。\n- E：托管服务也会故障或成为瓶颈，正文修复清单里就有「单 NAT 网关 → 每 AZ 一个」。\n\n**关键概念：** SPOF 排查两句话：路径上从入口到数据层逐层过；排序上有状态优先、数据层优先。托管服务≠不故障。"},{"id":"D3-020","d":3,"t":"single","s":"自编·3.1.6","q":"一家公司用 RDS 跨区域只读副本做灾备：主库在弗吉尼亚，俄勒冈有一个跨区域只读副本。某次弗吉尼亚故障，团队把俄勒冈副本提升为主库并切换了应用连接。事后有人提议「等弗吉尼亚恢复后，把主库再切回去就恢复原状了」。这个提议忽略了什么？","o":[{"l":"A","t":"忽略了切换期间的流量费用——切回原区域会产生双向跨区域流量成本，得不偿失。"},{"l":"B","t":"忽略了提升操作的性能影响——提升后的副本需要冷却 24 小时才能再次参与复制。"},{"l":"C","t":"忽略了副本提升的授权流程——跨区域提升需要提前向 AWS 申请审批，不能自主执行。"},{"l":"D","t":"忽略了提升的不可回退性——提升为主库后不可自动回退，恢复原状要重新建立跨区域复制关系。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文表格里写明：RDS 跨区域只读副本的切换方式是「提升副本为主库」，且提升后不可回退。要恢复原来的主从布局，只能重新建复制关系，不是切回去那么简单。\n\n**其他选项为什么错：**\n- A：流量费用是成本因素，但不是这个提议忽略的关键机制。\n- B：不存在 24 小时冷却机制，属于编造的技术细节。\n- C：副本提升是自主操作，不需要 AWS 审批。\n\n**关键概念：** RDS 跨区域灾备的两个关键属性：复制是异步的（有 RPO），提升是不可回退的（回切要重建复制）。灾备预案必须包含「提升之后怎么恢复原状」这一步。"},{"id":"D3-021","d":3,"t":"single","s":"自编·3.1.6","q":"一家公司用 Route 53 做跨区域故障转移：健康检查盯着两个区域的端点，主区域故障时自动把流量切到备区域。一次真实故障演练中发现：健康检查 30 秒就发现了故障并触发了切换，但用户侧流量真正落到备区域却慢了好几分钟。团队排查这个延迟的来源。\n\n最可能的原因是什么？","o":[{"l":"A","t":"备区域的实例数量不足，切换后流量压垮了备区域，服务响应慢被误判为切换慢。"},{"l":"B","t":"健康检查的间隔配置得太短，频繁的检查请求占用了端点带宽，拖慢了正常的切换流程。"},{"l":"C","t":"Route 53 的故障转移路由只能按天切换，分钟级的切换速度超出了它的设计能力。"},{"l":"D","t":"DNS 记录的 TTL 设得太长——解析结果缓存在各地递归 DNS 里，TTL 不到期旧地址就不会更新，切换被缓存延迟放大。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文写明：切换快不快，看健康检查间隔与 DNS TTL——TTL 设太长，DNS 缓存会让切换延迟放大。健康检查 30 秒发现故障，但已发出的解析结果还在客户端与递归 DNS 的缓存里。\n\n**其他选项为什么错：**\n- A：备区域容量不足是切换后的性能问题，与「切换生效慢几分钟」是两回事。\n- B：检查间隔短不拖慢切换，反而让发现故障更快。\n- C：故障转移路由就是为分钟级自动切换设计的，说法与机制相反。\n\n**关键概念：** Route 53 是跨区域切换的总开关：健康检查决定「发现多快」，TTL 决定「生效多快」。TTL 是切换延迟里最常被忽略的一项。"},{"id":"D3-022","d":3,"t":"single","s":"自编·3.1.6","q":"一家公司把静态资源（图片、前端包等）放在 S3 桶里供全球用户访问，希望主区域故障时另一区域的用户仍能正常访问这些资源。团队在评估 S3 的跨区域方案时，有人提议不用配置任何东西，有人提议手工同步。要给出正确方案。\n\n正确的方案是什么？","o":[{"l":"A","t":"配置 S3 跨区域复制（CRR）把对象复制到另一区域的桶，双桶可读写或按区域切换访问。"},{"l":"B","t":"在另一个区域再建一个桶并手工上传同一批文件，故障时手工把流量指到新桶。"},{"l":"C","t":"S3 本身就是全球单一命名空间，同一个桶天然在所有区域可访问，无需任何配置。"},{"l":"D","t":"把桶的数据改成 S3 跨区域同步的多活模式——S3 原生支持双区域同时写入同一桶。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文表格：S3 的跨区域机制是跨区域复制（CRR），切换方式是双桶读写或按区域切换。CRR 是托管复制，配好后对象自动同步到目标区域桶。\n\n**其他选项为什么错：**\n- B：手工上传不可持续，S3 CRR 就是替代手工同步的托管机制。\n- C：S3 桶属于创建它的区域——桶名全球唯一，但数据存储与访问端点在区域内，区域故障影响该桶访问，C 正是把两者混为一谈的常见误区。\n- D：S3 没有「同一桶双区域多活写入」的原生模式，双向同步要用 CRR 配两条规则且存在冲突风险。\n\n**关键概念：** S3 跨区域三板斧：CRR 复制数据、CloudFront 就近加速、故障时按区域切换访问。桶不跨区域自动容灾，要显式配置。"},{"id":"D3-023","d":3,"t":"multiple","s":"自编·3.1.6","q":"一个团队的灾备评审会上，正在讨论 Aurora Global Database 与 RDS 跨区域只读副本这两种数据层跨区域方案的差异。会上有人把两个方案的复制方式、切换动作和可否回退混在一起说了，评审记录里几条结论互相打架，需要逐条纠偏。下列说法正确的有哪些？（选两项）","o":[{"l":"A","t":"两者的跨区域复制都是同步的，切换时不会丢失任何已提交的写入。"},{"l":"B","t":"RDS 跨区域只读副本提升为主库后不可回退，恢复原状要重建复制关系。"},{"l":"C","t":"Aurora Global Database 的副本提升为主库后，可以随时一键切回原主区域。"},{"l":"D","t":"Aurora Global Database 的区域切换约 1 分钟，存储层复制延迟约 1 秒。"},{"l":"E","t":"跨区域只读副本提升操作需要提前数小时停止主库写入，业务要停摆。"}],"a":["B","D"],"e":"**正确答案：BD。**\n\n**为什么对：** B 正是正文表格的关键注记：提升副本为主库，提升后不可回退。D 正是 Aurora Global 的指标：切换约 1 分钟，存储层复制延迟约 1 秒。\n\n**其他选项为什么错：**\n- A：跨区域复制是异步的，这是 RPO 大于零的来源，同步说法错误。\n- C：与 B 矛盾——提升不可回退，回切要手工重建，不存在一键切回。\n- E：提升是在线操作，不需要长时间停止主库写入，属于编造的约束。\n\n**关键概念：** 数据层跨区域方案的关键属性三件套：复制方式（异步）、切换动作（提升）、可否回退（不可）。每换一个服务都要重新核对这三条。"},{"id":"D3-024","d":3,"t":"single","s":"自编·3.1.7","q":"一个 NLB 后面挂着两个 AZ 的服务：AZ-A 有 4 台实例，AZ-B 只有 1 台。上线后 AZ-B 的那台实例 CPU 长期打满，AZ-A 的 4 台却很空闲——总流量明明没有超过总容量，负载却严重失衡。团队检查了 NLB 配置与目标组分布，最终找到了负载失衡的根因，并给出了对应的修复动作。\n\n根因与修法是什么？","o":[{"l":"A","t":"NLB 的健康检查配置过严，AZ-B 的实例大部分时间被判不健康，流量都压在 AZ-A——把健康阈值调宽松即可。"},{"l":"B","t":"两个 AZ 的实例规格不同，AZ-B 的实例性能弱——把 AZ-B 的实例升级到与 AZ-A 同规格就能均匀。"},{"l":"C","t":"NLB 的跨区均衡（cross-zone load balancing）默认关闭——流量按各 AZ 的弹性网络接口分配，实例数不均时负载不均；开启跨区均衡让所有目标均分流量。"},{"l":"D","t":"NLB 是四层负载均衡器，天生不支持流量均匀分配，应该换成 ALB 才能解决不均问题。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文的考点正是这个默认值差异：NLB 跨区均衡默认关闭，不开时各 AZ 流量按弹性网络接口分配，实例数不均时负载不均——4 台分一半、1 台扛另一半正是这个症状。修法是开启跨区均衡。\n\n**其他选项为什么错：**\n- A：健康检查影响目标是否接流量，不改变 AZ 之间的分配比例。\n- B：规格差异会放大不均，但根因是分配机制，规格相同照样不均。\n- D：NLB 支持跨区均衡（手动开启），换 ALB 不是必要动作。\n\n**关键概念：** 跨区均衡默认值：ALB 默认开，NLB 默认关。NLB 场景实例不均匀部署必须手动打开——这是正文点名的高频考点。"},{"id":"D3-025","d":3,"t":"multiple","s":"自编·3.1.7","q":"一个平台团队在制定负载均衡配置规范，其中一节专门讨论跨区均衡（cross-zone load balancing）的使用原则：默认值怎么写、成本怎么算、不开会怎样。讨论中出现了几种说法，有对有错——其中一条还是从别的负载均衡器的默认值上错误类比过来的。下列说法正确的有哪些？（选三项）","o":[{"l":"A","t":"ALB 默认开启跨区均衡，NLB 默认关闭，规范里要按产品分别写明。"},{"l":"B","t":"ALB 的跨区均衡默认也是关闭的，所有负载均衡器都要手动开启。"},{"l":"C","t":"跨区均衡开启后产生跨 AZ 流量费，大流量成本敏感的场景要权衡这笔开销。"},{"l":"D","t":"跨区均衡本质上是一种健康检查机制，用于探测其他 AZ 目标的健康状态。"},{"l":"E","t":"NLB 不开跨区均衡时，流量按各 AZ 的弹性网络接口分配，实例数不均会导致负载不均。"}],"a":["A","C","E"],"e":"**正确答案：ACE。**\n\n**为什么对：** A 是正文点名的默认值差异；C 是正文的取舍口吻——跨 AZ 流量费在大流量场景不可忽视，NLB 有时故意不开；E 正是 NLB 关闭时的分配机制，也是负载不均的根因。\n\n**其他选项为什么错：**\n- B：与 A 矛盾，ALB 默认开启，不需要手动打开。\n- D：跨区均衡是流量分配机制，与健康检查是两回事。\n\n**关键概念：** 跨区均衡三句话：默认值 ALB 开 NLB 关；开了均分流量但有跨 AZ 流量费；不开则按 AZ 的 ENI 分配，实例不均负载不均。"},{"id":"D3-026","d":3,"t":"single","s":"自编·3.1.8","q":"一个应用完成 Multi-AZ 部署后仍偶发报错。排查发现：实例重启后 30 秒健康检查就通过并接入了流量，但应用完成初始化（连接数据库、加载缓存）实际需要 45 秒——前 15 秒接入的请求全部失败。按正文的应用层前提，正确的修法是什么？","o":[{"l":"A","t":"把负载均衡的健康检查间隔从 30 秒缩短到 10 秒，更频繁的检查能避开初始化窗口。"},{"l":"B","t":"让健康检查端点真实反映就绪状态——初始化未完成时返回 503，完成后再返回 200，流量只在真正可服务时接入。"},{"l":"C","t":"给每个 AZ 多部署几台实例，故障或重启时由其他实例顶上，掩盖单实例初始化慢的问题。"},{"l":"D","t":"把应用初始化改成异步后台执行，实例一启动就立刻返回 200，让流量尽早接入。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文点名「健康检查真实」：健康检查端点要真的检查依赖，不是永远返回 200——假健康会让流量打进「活着但坏掉」的实例。场景里的修法正是正文给的方案：初始化完成前返回 503。\n\n**其他选项为什么错：**\n- A：检查间隔再短，端点照样在初始化期间返回 200，假健康的问题不变。\n- C：加实例掩盖不了「新实例接入即报错」，每次扩容或替换都会复现。\n- D：方向反了——立刻返回 200 是把假健康做得更彻底，报错只会更多。\n\n**关键概念：** 假健康是 Multi-AZ 下偶发报错的高频根因：基础设施冗余救不了「活着但坏掉」的实例。健康检查必须反映真实就绪状态。"},{"id":"D3-027","d":3,"t":"multiple","s":"自编·3.1.8","q":"一个团队在制定「应用层如何配得上 Multi-AZ / Multi-Region 基础设施」的改造清单。架构师强调：基础设施的冗余铺得再好，应用层不配合就是白铺，并把正文列出的应用层前提逐条拆成了改造项。下列哪些属于正确的改造项？（选三项）","o":[{"l":"A","t":"应用无状态化：会话与本地文件状态外置到 ElastiCache、DynamoDB 或 S3，任何实例都能被替换。"},{"l":"B","t":"健康检查端点固定返回 200，保证实例在任何状态下都不会被负载均衡摘除。"},{"l":"C","t":"配置与代码分离：数据库地址、区域名等区域相关配置从环境注入，同一份镜像多区域通用。"},{"l":"D","t":"优雅启停：启动时先完成预热再注册目标组接流量，停机时处理完在途请求再退出。"},{"l":"E","t":"把用户会话保存到实例本地磁盘以提高读取速度，替换实例前手工迁移会话数据。"}],"a":["A","C","D"],"e":"**正确答案：ACD。**\n\n**为什么对：** A、C、D 正是正文列出的四个前提中的三个：无状态、配置与代码分离、优雅启停。三条分别解决「实例可替换」「镜像可跨区」「切换不丢请求」。\n\n**其他选项为什么错：**\n- B：永远返回 200 是正文点名的假健康反模式——流量会打进「活着但坏掉」的实例。\n- E：本地会话正是无状态化的反面，手工迁移既慢又不可靠，替换实例时必然掉会话。\n\n**关键概念：** 应用层四前提：无状态、配置与代码分离、健康检查真实、优雅启停。基础设施铺得再好，应用层不配合就是白铺。"},{"id":"D3-028","d":3,"t":"single","s":"自编·3.2.1","q":"一个图片压缩服务按 CPU 利用率 50% 做目标跟踪扩缩，平时运行正常。大促压测时发现了异常现象：CPU 只有 30%，但 SQS 队列积压了 5 万条消息，处理速度远跟不上生产速度——图片处理大部分时间在等磁盘与网络 I/O，CPU 根本读不出真实负载。团队确认这是「扩缩指标选错」的典型场景。\n\n最贴合的修复是什么？","o":[{"l":"A","t":"把目标值从 50% 调到 80%，让 CPU 更容易被触顶，从而触发更早的扩容动作。"},{"l":"B","t":"给实例升级更大的规格，更强的算力能让处理速度追上队列积压，无需改扩缩策略。"},{"l":"C","t":"把扩缩指标从 CPU 换成 SQS 队列深度（如每实例积压 100 条）——I/O 等待撑不起 CPU 读数，队列积压才是真实负载信号。"},{"l":"D","t":"把目标跟踪换成步进扩缩，按 CPU 告警幅度分档扩容，档位更细就能跟上积压。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 这正是正文的场景举例：图片处理是 I/O 密集型，CPU 不高但已经堵死——CPU 是默认项不是万能项。队列积压直接反映真实负载，按队列深度扩缩「积压即扩、消费完即缩」。\n\n**其他选项为什么错：**\n- A：调目标值改变的是触发阈值，指标本身仍然是 CPU，I/O 密集场景下读数依旧失真。\n- B：算力升级不改变「CPU 读数不反映负载」的根本问题，积压照样滞后扩容。\n- D：步进只是换了一种策略形态，盯的还是 CPU，病根没动。\n\n**关键概念：** 指标决定扩缩灵敏度：CPU 适合通用计算；I/O 密集型要看队列深度或请求量；队列积压是 SQS 消费场景最直接的负载信号。"},{"id":"D3-029","d":3,"t":"single","s":"自编·3.2.1","q":"一个订单异步处理系统：订单消息进 SQS 队列，一批 EC2 实例作为消费者拉取处理。大促期间消息生产速度远超消费速度，队列积压持续增长，而消费者实例的 CPU 只有 40%——处理大部分时间在等待外部接口响应。团队的消费者扩缩应该盯什么指标？","o":[{"l":"A","t":"消费者的内存使用率——处理等待外部接口时内存波动最能反映真实压力。"},{"l":"B","t":"消费者实例的 CPU 利用率——这是自动扩缩的默认指标，通用性最强，直接沿用即可。"},{"l":"C","t":"SQS 队列里消息的总字节数——积压的体量越大说明负载越重，按字节扩容最精确。"},{"l":"D","t":"SQS 队列深度（ApproximateNumberOfMessagesVisible）——积压越多扩越多，消费完自动缩回，直接跟着真实待处理量走。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文指标清单里写明：队列深度/队列年龄是 SQS 消费场景专用——积压越多扩越多，消费完自动缩回。题干 CPU 仅 40% 但积压增长，正是「CPU 读不出真实负载」的案例。\n\n**其他选项为什么错：**\n- A：CPU 是默认项但本题场景失真——等待外部接口时 CPU 空转，扩缩会严重滞后。\n- B：消息字节数与处理压力没有稳定的对应关系，一条大消息和十条小消息的耗时可能一样。\n- C：内存同样不能反映「待处理积压量」，是选错对象。\n\n**关键概念：** 扩缩指标要选「直接反映真实负载」的那个：SQS 消费场景盯队列深度，ALB 场景盯请求量/每目标连接数，业务场景可自定义指标。"},{"id":"D3-030","d":3,"t":"single","s":"自编·3.2.1","q":"一个电商下单系统，负载高峰的特征很特殊：下单请求的计算量随活动类型剧烈变化——秒杀活动的单个请求要做的校验是平时的五倍。团队发现无论用 CPU 还是请求量做扩缩指标，都无法准确反映真实负载，扩缩总是不合时宜。\n\n最适合这类场景的指标方案是什么？","o":[{"l":"A","t":"坚持用 CPU 指标，把目标值调低到 30%，让系统更激进地扩容来覆盖负载波动。"},{"l":"B","t":"改用每目标连接数指标——连接数多说明负载重，扩缩会跟着连接数走。"},{"l":"C","t":"把扩缩策略换成定时扩缩，按历史高峰时段提前扩容，绕开指标不准的问题。"},{"l":"D","t":"上报自定义业务指标（如每秒有效下单数或加权请求量）并按它做目标跟踪——最能反映真实负载，兼顾请求量与单请求复杂度的变化。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文指标清单的最后一条：自定义业务指标（如每秒订单数）最能反映真实负载，走 CloudWatch 告警或目标跟踪。单请求复杂度会变的场景，只有业务口径的指标才能把「请求量×复杂度」合成一个真实负载信号。\n\n**其他选项为什么错：**\n- A：调低目标值是拍脑袋补偿，负载形态一变就失效，治标不治本。\n- B：连接数同样区分不了「一个简单请求」与「一个五倍复杂度请求」。\n- C：定时扩缩适合可预测的高峰，秒杀活动的负载形态 unpredictable，定时治不了复杂度波动。\n\n**关键概念：** 通用指标失真时，出路是自定义业务指标——把业务语义加权进指标里，扩缩跟着真实负载走，而不是跟着代理读数走。"},{"id":"D3-031","d":3,"t":"single","s":"自编·3.2.2","q":"一个订单系统的下单接口是同步调用：API 收到请求后直接调用库存服务、积分服务、通知服务，全部处理完才返回。大促时三个下游任何一个变慢，整个下单接口的响应就被拖住，高峰期大量请求超时。按松耦合的思路，正确的改造方向是什么？","o":[{"l":"A","t":"给三个下游服务各加一台更强的实例，让它们处理更快，同步调用自然就不超时了。"},{"l":"B","t":"把非关键路径（积分、通知）改成经 SQS 异步化——主流程入队即返回，消费端按自己的节奏处理，高峰期队列削峰，下游不会被同步调用拖垮。"},{"l":"C","t":"把三个下游合并成一个大的服务再拆成线程池处理，减少跨服务调用的网络开销。"},{"l":"D","t":"给下单接口设置更长的超时时间，容忍高峰期的慢响应，等流量过去自然恢复。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文的松耦合三板斧第一斧：SQS 把同步调用改成异步——高峰期请求排队，消费端按自己的节奏处理，不会被打垮。非关键路径异步化是标准的削峰改造。\n\n**其他选项为什么错：**\n- A：加算力不改变同步绑定的结构——下游再快，高峰期量一大照样拖住主流程。\n- C：合并服务是把耦合做得更紧，方向完全反了。\n- D：放宽超时只是容忍慢，请求堆积不解决，故障半径反而更大。\n\n**关键概念：** 松耦合三板斧：队列削峰（SQS）、事件解耦（EventBridge/SNS）、服务边界（按业务拆分）。「突发流量压垮下游」的题，正解几乎都含队列或事件解耦。"},{"id":"D3-032","d":3,"t":"multiple","s":"自编·3.2.2","q":"一个团队在内部架构评审会上讨论松耦合与分布式架构的设计原则。主讲人先给出判断标准——一个组件挂了或变慢，其余组件还能不能正常工作——然后列出了几条正反两面的说法让团队辨析，作为后续架构规范的素材。按照正文给出的松耦合三板斧，正确的有哪些？（选两项）","o":[{"l":"A","t":"SQS 把同步调用改成异步，高峰期请求排队，消费端按自己的节奏处理。"},{"l":"B","t":"EventBridge/SNS 发布订阅让生产者不关心谁在消费，加消费者不用改生产者。"},{"l":"C","t":"服务边界应该按技术分层拆分——前端服务、中间件服务、数据库服务各自独立伸缩。"},{"l":"D","t":"松耦合主要指代码风格统一、命名规范一致，属于代码质量问题。"},{"l":"E","t":"加队列是为了让高峰期的请求更快地打到下游，缩短排队等待时间。"}],"a":["A","B"],"e":"**正确答案：AB。**\n\n**为什么对：** A 与 B 正是松耦合三板斧的前两斧：队列削峰与事件解耦。B 的价值在解耦生产者与消费者——加订阅方不需要动生产者的代码。\n\n**其他选项为什么错：**\n- C：服务边界按业务拆，不是按技术层拆——按技术拆的「服务」内部照样所有业务绑在一起。\n- D：松耦合是架构概念（一个组件挂了或变慢，其余组件还能不能正常工作），不是代码规范问题。\n- E：说反了——队列是让下游按自己的节奏消费，削峰填谷，不是加速直打。\n\n**关键概念：** 松耦合的判断标准：一个组件挂了或变慢，其余组件还能不能正常工作。三板斧：SQS 削峰、EventBridge/SNS 解耦、按业务拆服务。"},{"id":"D3-033","d":3,"t":"single","s":"自编·3.2.2","q":"一个单体应用里，报表模块每月一号出现流量高峰，把整个应用拖慢——虽然其他业务模块的流量没有任何变化，但全应用的实例数只能按报表高峰整体扩容。运维成本居高不下，团队想从架构上解决这个问题。\n\n正确的方向是什么？","o":[{"l":"A","t":"给报表模块单独分配更多 CPU 配额，让它在高峰期占用更多单机资源，不影响其他模块。"},{"l":"B","t":"把报表按业务边界拆成独立服务，让它独立伸缩——高峰只扩报表服务，其他业务不受拖累。"},{"l":"C","t":"把报表高峰的任务安排到流量最低的凌晨执行，避开与其他模块的资源竞争。"},{"l":"D","t":"给整个应用配置更激进的自动扩缩策略，高峰来时整体快速扩容，快速缩回。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文的服务边界一条：按业务拆服务，每个服务独立伸缩——单体里一个模块的流量高峰拖着全应用扩容。拆出来后报表高峰只影响报表服务自己的实例数。\n\n**其他选项为什么错：**\n- A：单机资源配额解决不了跨机器的扩容绑架，报表高峰照样拖着全应用加机器。\n- C：错峰执行是运营手段，报表需求如果必须在白天出，这条路就不通；而且单体结构的问题还在。\n- D：整体扩容正是成本居高不下的原因，更激进的策略只是花更多的钱。\n\n**关键概念：** 「一个模块的高峰拖着全应用扩容」是耦合过紧的典型症状，修法是按业务边界拆服务、独立伸缩。判断依据永远是业务边界，不是技术层次。"},{"id":"D3-034","d":3,"t":"single","s":"自编·3.2.3","q":"一个新团队第一次接触 AWS，架构师向他们介绍「无服务器架构」这个形态时，有人理解为「没有服务器，代码跑在真空中」，有人理解为「服务器藏在某个数据中心，只是团队不用管」。架构师要纠正这两种理解偏差。\n\n对无服务器架构正确的描述是？","o":[{"l":"A","t":"不管理服务器、按请求计费、自动伸缩的形态——服务器仍然存在，只是容量管理、打补丁、扩容这些运维工作由平台承担，团队只管代码。"},{"l":"B","t":"服务器确实不存在了——代码直接运行在浏览器或客户端设备上，云端只负责存储数据。"},{"l":"C","t":"无服务器就是把虚拟机换成容器，运维工作没有变化，只是计费方式变了。"},{"l":"D","t":"无服务器要求团队预购容量并自己监控利用率——与虚拟机的区别只在计费粒度更细。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文的定义：无服务器架构＝不管理服务器、按请求计费、自动伸缩。B 选项的表述正是对它的准确展开——服务器存在但运维责任转移给了平台。\n\n**其他选项为什么错：**\n- B：代码不可能跑在真空中，无服务器的计算仍然在云端数据中心执行。\n- C：无服务器与容器的运维责任完全不同——容器仍要管集群与实例（EC2 模式），无服务器不用。\n- D：预购容量与监控利用率恰好是无服务器要消除的工作，方向说反了。\n\n**关键概念：** 无服务器三特征：不管理服务器（运维责任归平台）、按请求计费（不用预购容量）、自动伸缩（并发来了自动扩）。三特征缺一不可。"},{"id":"D3-035","d":3,"t":"single","s":"自编·3.2.9","q":"一个团队想把每天一次的视频转码任务搬上 Lambda：单次处理时长约 20 分钟，输入输出都是视频文件，计算量集中在编解码环节。上线前评审时，架构师指出这个任务形态与 Lambda 的运行时边界冲突，建议改用其他形态承接。\n\n架构师的依据与建议是什么？","o":[{"l":"A","t":"依据是 Lambda 的并发上限——转码任务太多会撞账户级并发墙；建议是把并发上限调大即可继续用 Lambda。"},{"l":"B","t":"依据是 Lambda 的内存上限——转码占用内存大；建议是选最大内存档的 Lambda 配置。"},{"l":"C","t":"依据是 Lambda 单次执行有 15 分钟超时上限——20 分钟的任务跑不完；建议改用 Fargate 承接长任务，或用 Step Functions 拆步执行。"},{"l":"D","t":"依据是 Lambda 不支持视频编解码指令集——建议改用 EC2 GPU 实例集群自建转码平台。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文写明：Lambda 事件驱动执行，单次有 15 分钟超时与内存上限。20 分钟的任务超出超时边界，两条出路正是正文给的：Fargate 承接长任务，或 Step Functions 拆步。\n\n**其他选项为什么错：**\n- A：并发上限影响的是同时处理的数量，不是单次执行时长——调大并发救不了 20 分钟的单次任务。\n- B：内存上限与 20 分钟时长无关，选大内存档同样会超时。\n- D：Lambda 上跑视频转码是常见做法（短任务），问题出在时长边界，不是指令集。\n\n**关键概念：** Lambda 的两条硬边界：单次 15 分钟超时、内存上限。长任务、大依赖、常驻连接交给 Fargate——这是「Lambda 装不下的」的标准去向。"},{"id":"D3-036","d":3,"t":"single","s":"自编·3.2.7","q":"一个 8 人团队要把虚拟机上的应用迁移到容器平台，目标两个月内上线。团队里没有人写过 Kubernetes，也没有多云或跨集群管理的需求，主要工作负载都在 AWS 上，后续要与 IAM、ALB、自动扩缩做集成。按正文的选型主线，应该选哪个平台？","o":[{"l":"A","t":"Amazon EKS——K8s 生态最全，先把生态能力都拿到手，团队边用边学 Kubernetes。"},{"l":"B","t":"Amazon ECS——概念简单、与 IAM/ALB/Auto Scaling 开箱集成，控制面免费；团队没有 K8s 经验且主在 AWS，选它最快。"},{"l":"C","t":"自建 Kubernetes 集群——完全不依赖托管服务，所有控制权都留在自己手里。"},{"l":"D","t":"AWS Fargate 单独使用——Fargate 是独立的编排平台，直接用它就不需要在 ECS 与 EKS 之间做选择。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文的选型主线：主要在 AWS 且团队小 → ECS；ECS 概念简单（任务定义、服务、集群），与 IAM、ALB、Auto Scaling 集成开箱即用，控制面托管免费。正文场景举例就是这个配置——两周上线。\n\n**其他选项为什么错：**\n- A：EKS 要求团队会 K8s，运维复杂度与人才要求高——没人写过 K8s 的 8 人团队学不过来。\n- C：自建集群运维成本最高，与「两个月上线」的目标背道而驰。\n- D：Fargate 不是第三个编排平台——它配合 ECS/EKS 使用，是运行时不是控制面。\n\n**关键概念：** 容器平台选型先看人再看生态：有 K8s 能力或要跨云 → EKS；主在 AWS 且团队小 → ECS；Fargate 是两者共用的无服务器运行时。"},{"id":"D3-037","d":3,"t":"single","s":"自编·3.2.7","q":"一个平台团队在讨论容器运行时的成本与运维结构。一位成员提议：「我们把所有工作负载都迁到 Fargate 上，这样就没有实例要管了，成本肯定也最低。」架构师指出这个提议混淆了两件事，需要纠正成本结构与适用场景。\n\n架构师的正确纠正是？","o":[{"l":"A","t":"Fargate 省运维但单价高于 EC2 模式——稳定的大负载用 EC2 模式更省，波动与突发部分用 Fargate，两者可以通过容量提供策略混用。"},{"l":"B","t":"Fargate 的单价其实低于 EC2 模式，提议的方向是对的，只需要补上编排平台的选择即可。"},{"l":"C","t":"Fargate 要求团队管理底层实例的补丁与扩容，运维负担比 EC2 模式更重，提议不成立。"},{"l":"D","t":"Fargate 只能搭配 EKS 使用，团队如果选 ECS 就没有 Fargate 可用，提议的前提就错了。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文的成本结构写得很清楚：Fargate 省运维但单价高于 EC2 模式——稳定大负载用 EC2 模式，波动与突发用 Fargate，可以混用（容量提供策略）。「全迁 Fargate 最省」是典型的混淆。\n\n**其他选项为什么错：**\n- B：单价方向说反了，Fargate 的便利是有溢价的。\n- C：Fargate 的卖点恰恰是不管实例——补丁、扩容都不用管，说反了。\n- D：Fargate 两种平台都可用，ECS 同样能跑 Fargate 任务。\n\n**关键概念：** Fargate 的定位：两种平台共用的无服务器运行时，按任务付费；省运维但单价高。稳定基线走 EC2 模式、突发走 Fargate，容量提供策略负责混用。"},{"id":"D3-038","d":3,"t":"single","s":"自编·3.2.5","q":"一个大促演练中，应用实例从 20 台扩到 200 台，但 P95 响应时间不降反升。排查发现：每台实例的数据库连接池设为 50，200 台实例共需 1 万个连接，而数据库的连接上限只有 5000——半数实例拿不到连接，反复重试把数据库也拖垮了。这属于正文归纳的哪类扩缩容问题？","o":[{"l":"A","t":"扩缩不及时——实例就绪要几分钟，突发流量等不了，应该配预扩容。"},{"l":"B","t":"扩错对象——瓶颈不在应用层，加多少应用实例都没用，应该直接扩数据库实例规格。"},{"l":"C","t":"下游短板——应用扩了，但数据库连接数这个下游容量没跟着扩，连接耗尽后新实例照样失败。"},{"l":"D","t":"上下文丢失——实例横向加了但状态粘在旧实例上，应该把会话外置到共享缓存。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文的四类典型之一：下游短板——应用扩了，连接池、数据库连接数、下游 API 配额没跟着扩，连接耗尽新实例照样失败。正文的场景举例与题干完全同型：连接池 50×200 台＝1 万 > 数据库上限 5000。\n\n**其他选项为什么错：**\n- A：扩缩速度不是问题——200 台都扩上去了，问题是起来也拿不到连接。\n- B：方向沾边但手段错——瓶颈确实是数据层，但解法是连接池下调、读写分离、缓存三层一起动，不是单纯扩规格。\n- D：题干没有任何会话粘滞的现象，这是错位的分类。\n\n**关键概念：** 扩容之前先算下游容量——算力是乘法不是加法：实例数×每实例连接数必须小于下游上限。修法三板斧：连接池下调、读写分离、热点缓存。"},{"id":"D3-039","d":3,"t":"single","s":"自编·3.2.5","q":"一个秒杀活动开抢瞬间流量在 30 秒内涨了 20 倍。系统按 CPU 目标跟踪扩缩，但指标采集、告警触发到新实例就绪需要几分钟——等实例扩出来，第一波用户请求已经超时失败了。活动结束后回看监控，扩缩机制本身工作正常。这属于哪类扩缩容问题？对应的修法是什么？","o":[{"l":"A","t":"扩缩不及时——指标告警到实例就绪的分钟级延迟赶不上秒级突发；修法是定时预扩容（活动开始前提前扩）或换更快的形态承接突发。"},{"l":"B","t":"扩错对象——瓶颈不在应用实例，应该把预算花在数据库扩容上而不是扩应用。"},{"l":"C","t":"下游短板——下游 API 配额没跟着扩，应该先给下游提额再谈扩缩。"},{"l":"D","t":"上下文丢失——新实例没有老实例的缓存数据，应该把缓存预热纳入实例启动流程。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文的四类典型第一条：扩缩不及时——指标告警到实例就绪要几分钟，突发流量等不了，需要预扩容或更快的形态。题干「扩缩机制正常但第一波已经超时」正是速度型问题，不是对象型问题。\n\n**其他选项为什么错：**\n- B：题干没有证据表明瓶颈在数据库——扩缩机制正常工作，问题纯粹是时间差。\n- C：题干没有下游失败的现象，属于无中生有的分类。\n- D：缓存预热影响的是新实例的命中率，不是「第一波请求超时」的主因。\n\n**关键概念：** 四类扩缩问题对号入座：不及时（速度）、扩错对象（真瓶颈）、上下文丢失（粘滞状态）、下游短板（连接/配额）。可预测的突发用定时预扩容兜住。"},{"id":"D3-040","d":3,"t":"single","s":"自编·3.2.5","q":"一个内容管理系统高峰期响应变慢。运维按惯性把应用实例从 10 台扩到 30 台，P95 几乎没有变化。进一步看监控发现：应用实例 CPU 只有 35%，而数据库实例 CPU 长期 90% 以上，慢查询日志里同一类聚合查询反复出现。按正文的排查方法，正确的下一步是什么？","o":[{"l":"A","t":"继续扩大应用实例规模到 60 台，扩容总是安全的，量大必然带来改善。"},{"l":"B","t":"分清瓶颈层——这是数据层瓶颈：给热点聚合查询加缓存（ElastiCache）并对读流量做读写分离，而不是继续加应用实例。"},{"l":"C","t":"把应用实例全部换成更大规格，更强的 CPU 能更快地处理数据库返回的结果。"},{"l":"D","t":"把数据库的慢查询日志级别调低，减少日志开销对数据库 CPU 的占用。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文的排查顺序：看指标定位瓶颈层 → 分清「应用层瓶颈」与「数据层瓶颈」→ 应用层查扩缩策略，数据层查读写分离、缓存与分片。应用 CPU 35%、数据库 90% 已明确指向数据层。\n\n**其他选项为什么错：**\n- A：这就是「扩错对象」——从 10 到 30 台已经证明无效，扩到 60 台同样无效。\n- C：应用 CPU 只有 35%，更强的应用算力改变不了数据库的瓶颈。\n- D：调低日志级别与慢查询的根因无关，数据库 CPU 高是因为查询本身重。\n\n**关键概念：** 「实例加了很多但 P95 还是高」→ 多半不是计算瓶颈，查数据库连接与慢查询。先定瓶颈层再动手，数据层的解法是缓存与读写分离。"},{"id":"D3-041","d":3,"t":"single","s":"自编·3.2.5","q":"一个 Web 应用做了横向扩容改造，但效果不对劲：负载均衡配置了会话粘性，用户的请求始终落在同一台实例上；每台实例还带一块本地缓存。结果扩容后负载分布不均——老实例因为有本地缓存响应快、承接的请求多，新实例冷启动响应慢。这个现象对应正文归纳的哪类扩缩容问题？","o":[{"l":"A","t":"扩缩不及时——新实例冷启动慢导致流量分配延迟，应该配置预扩容解决。"},{"l":"B","t":"扩错对象——瓶颈在负载均衡的分配算法，应该更换负载均衡器类型。"},{"l":"C","t":"下游短板——本地缓存占用了下游存储的连接配额，应该清理缓存配置。"},{"l":"D","t":"上下文丢失——会话粘性与本地缓存把上下文锁在旧实例上，阻碍了横向扩展；修法是会话外置共享存储、缓存集中化。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文的四类典型第三条：上下文丢失——实例横向加了，会话粘在旧实例上，粘性会话与本地缓存阻碍横向扩展。题干的「老实例快、新实例慢、负载不均」正是上下文不外置的典型症状。\n\n**其他选项为什么错：**\n- A：冷启动只是表象，根因是上下文绑定——不外置会话与缓存，新实例永远「冷」。\n- B：负载均衡的分配没问题，是目标本身的响应速度不同导致分布倾斜。\n- C：本地缓存与下游连接配额无关，属于错位归因。\n\n**关键概念：** 粘性会话与本地缓存是横向扩展的两大阻力：它们让「实例」不再是等价节点。修法方向：状态外置（ElastiCache/DynamoDB），让任何实例都能随时顶上。"},{"id":"D3-042","d":3,"t":"multiple","s":"自编·3.2.5","q":"一个团队的自动扩缩出现怪象：流量高峰触发扩容后，新实例起来就挂——健康检查反复失败被摘除，老实例却一直正常。团队开会梳理这类「新实例起来就挂」的排查思路，下列做法正确的有哪些？（选两项）","o":[{"l":"A","t":"第一反应是再放大扩容上限，多起一些实例总有一台能活下来。"},{"l":"B","t":"查数据库连接数上限——新实例启动时建立连接，如果下游连接池已满，新实例会因连不上而启动失败。"},{"l":"C","t":"直接重装新实例上的应用依赖，重装能解决一切环境问题。"},{"l":"D","t":"查配置中心等依赖的可达性——新实例启动时要拉取配置，配置服务不可达会导致启动失败。"},{"l":"E","t":"认定是 AMI 镜像损坏，立刻全部换用最新镜像重建，不做其他排查。"}],"a":["B","D"],"e":"**正确答案：BD。**\n\n**为什么对：** 正文考试判断原文：「新实例起来就挂」→ 查依赖（数据库连接数上限、配置中心可达性）。B 与 D 正是这两个排查位——新实例启动时要建立连接、拉配置，任何一项不可达都会启动失败。\n\n**其他选项为什么错：**\n- A：老实例正常、新实例必挂，说明是环境或依赖问题，加数量只是浪费。\n- C：「重装解决一切」是无依据的惯性动作，先查依赖定位才是正路。\n- E：老实例用的很可能是同一镜像——如果是镜像问题老实例也该挂，跳过排查直接换镜像是瞎猜。\n\n**关键概念：** 新旧实例行为差异是关键线索：老实例正常＝镜像与代码大概率没问题，问题在「新实例启动时才发生的事」——连接、配置、依赖。"},{"id":"D3-043","d":3,"t":"single","s":"自编·3.2.6","q":"一个通用 Web 服务（CPU 密集型计算为主）要配置自动扩缩策略。团队希望配置尽量简单，系统能自动把 CPU 利用率维持在目标水平附近，不需要人工分档干预，也不需要按时间表管理。按正文的三种扩缩策略形态，最合适的是？","o":[{"l":"A","t":"步进扩缩（step scaling）——按告警幅度分档加减容量，每档的调整量都可以精细控制。"},{"l":"B","t":"定时扩缩（scheduled scaling）——按工作日时段表提前扩容，早高峰前加机器、深夜缩回。"},{"l":"C","t":"手工扩缩——运维每天盯监控面板，流量高了手工加实例，低了手工减，控制最精确。"},{"l":"D","t":"目标跟踪（target tracking）——盯一个指标维持目标值（如 CPU 50%），配置简单，系统自动增减容量；最常用的默认选择。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文策略三形态：目标跟踪——盯一个指标维持目标值（如 CPU 50%），最常用、配置简单。题干「配置简单 + 自动维持目标水平」正是目标跟踪的定义。\n\n**其他选项为什么错：**\n- A：步进扩缩响应可控但配置繁琐——与「配置简单」的要求相反。\n- B：定时扩缩适合可预测的高峰，通用 Web 服务的流量波动不可精确预测。\n- C：手工扩缩与「自动」的要求相反，也不可持续。\n\n**关键概念：** 三形态对号入座：目标跟踪＝通用默认；步进＝需要精细分档控制；定时＝可预测高峰（大促、上班时段）。"},{"id":"D3-044","d":3,"t":"single","s":"自编·3.2.6","q":"一个企业内部 OA 系统，负载形态非常规律：每天早九点上班时段流量陡增，午休回落，晚六点后趋近于零。团队已经用过目标跟踪扩缩，但每次早高峰的陡增还是会让前几分钟的用户感到卡顿——指标反应总是慢半拍。\n\n针对这种可预测的规律性高峰，最合适的补强方案是什么？","o":[{"l":"A","t":"叠加定时扩缩（scheduled scaling）——按上班时段表在早九点前提前扩容，让容量先于流量到位，目标跟踪继续负责兜底波动。"},{"l":"B","t":"把目标跟踪的目标值从 50% 改成 20%，让系统随时保持大量空闲容量，高峰来了自然接得住。"},{"l":"C","t":"关闭自动扩缩，按全天最高峰的流量常驻实例，宁可浪费也不能让用户卡顿。"},{"l":"D","t":"把告警阈值调得更敏感，让目标跟踪对流量上升的反应速度提高一个数量级。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文策略三形态里的定时扩缩正是为这种场景准备的：可预测的高峰（大促、上班时段）提前扩。容量先于流量到位，指标反应的「慢半拍」就不再是问题。\n\n**其他选项为什么错：**\n- B：目标值 20% 等于全天养着一倍以上的冗余容量，比定时扩缩贵得多且同样有极限。\n- C：全天按峰值常驻是最贵的方案，与自动扩缩的意义背道而驰。\n- D：阈值再敏感，指标采集到实例就绪的分钟级延迟物理上存在，快不起来。\n\n**关键概念：** 定时扩缩解决「可预测」的问题，目标跟踪解决「不可预测」的兜底——两者叠加是规律性高峰场景的标准组合。"},{"id":"D3-045","d":3,"t":"single","s":"自编·3.2.6","q":"一个内容资讯网站访问量快速增长，数据库读压力随之攀升，自动扩缩的实例数也水涨船高，成本上升明显。团队在评估下一步的优化顺序：是继续加大扩缩容量，还是先做点什么降低到达数据库的流量。按正文的成本最优顺序，应该怎么做？","o":[{"l":"A","t":"继续扩大自动扩缩的容量上限，扩容是最直接的保障，成本问题靠缩容策略解决。"},{"l":"B","t":"先上缓存挡读——ElastiCache 挡数据库读、CloudFront 挡静态与边缘流量；缓存命中率上去，后面的扩缩压力直接变小。先缓存后扩容是成本最优顺序。"},{"l":"C","t":"把数据库换成更大规格的实例，让单机能扛住更多读流量，应用层不用动。"},{"l":"D","t":"给网站加上访问限流，高峰期直接拒绝一部分用户请求，保住数据库不被压垮。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文原话：缓存命中率上去，后面的扩缩压力直接变小——先缓存后扩容，是成本最优顺序。挡在数据库前面的流量不消耗应用实例与数据库容量，是三件里最省钱的一层。\n\n**其他选项为什么错：**\n- A：扩容治标不治本，读流量还在源源不断地到达数据库，成本持续上涨。\n- C：数据库升规格同样贵，且没有减少到达流量，只是把瓶颈推后。\n- D：限流是保护手段不是优化手段，拒绝用户等于拒绝业务。\n\n**关键概念：** 缓存挡读三件：ElastiCache 挡数据库读、CloudFront 挡静态与边缘、API Gateway 缓存挡重复请求。顺序永远是先缓存后扩容。"},{"id":"D3-046","d":3,"t":"single","s":"自编·3.2.6","q":"一个金融对账系统对扩缩动作要求很严格：每次加减容量都必须与预设的档位对应，超出档位的调整一律不允许，审计要求能追溯每一次调整的依据。团队在目标跟踪与步进扩缩之间做选择。\n\n按两种策略的特性，正确的选择与理由是？","o":[{"l":"A","t":"选目标跟踪——它对指标的响应最快，金融场景最看重速度。"},{"l":"B","t":"选定时扩缩——对账负载按时间表运行，定时最可预测。"},{"l":"C","t":"两种都不能用于金融场景，金融系统按合规要求必须使用固定容量。"},{"l":"D","t":"选步进扩缩——按告警幅度分档加减，响应可控、配置繁琐但每档调整都有据可查，符合审计要求。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文对步进扩缩的定义：按告警幅度分档加减——响应可控但配置繁琐。题干的「每次调整必须对应预设档位、可追溯」正是步进扩缩的强项：档位即审计依据。\n\n**其他选项为什么错：**\n- A：目标跟踪胜在配置简单，但调整动作由系统自动决定，分档可追溯性不如步进。\n- B：定时扩缩解决的是可预测高峰，与审计追溯要求无关。\n- C：没有这条合规规则，金融场景照样可以自动扩缩，说法凭空。\n\n**关键概念：** 目标跟踪＝简单常用；步进＝分档可控、可审计但配置繁琐；定时＝可预测高峰。控制精度与配置成本是一对取舍。"},{"id":"D3-047","d":3,"t":"multiple","s":"自编·3.2.1","q":"一个平台团队在编写《扩缩指标选型指南》内部规范，指导各业务线给自己的自动扩缩选指标。起草人汇总了团队讨论中的几条候选条款，其中有对有错，需要在评审时逐条定夺。按照正文给出的指标选择原则，正确的有哪些？（选三项）","o":[{"l":"A","t":"CPU 利用率是默认项，适合通用计算；但 I/O 密集型应用 CPU 不高却已堵死，不能只盯 CPU。"},{"l":"B","t":"CPU 利用率是万能指标，任何类型的应用都应该优先使用 CPU 做扩缩依据。"},{"l":"C","t":"队列深度/队列年龄是 SQS 消费场景专用指标——积压越多扩越多，消费完自动缩回。"},{"l":"D","t":"请求量/每目标连接数指标扩缩最滞后，只适合作为备用指标。"},{"l":"E","t":"自定义业务指标（如每秒订单数）最能反映真实负载，走 CloudWatch 告警或目标跟踪。"}],"a":["A","C","E"],"e":"**正确答案：ACE。**\n\n**为什么对：** 三条分别是正文指标清单的三条原文：A 点出 CPU 的适用边界；C 是队列场景专用指标的完整表述；E 是自定义业务指标的定位——最能反映真实负载。\n\n**其他选项为什么错：**\n- B：与 A 直接矛盾——CPU 不是万能指标，I/O 密集场景会严重失真。\n- D：说反了——正文写明请求量/每目标连接数「直接反映负载，扩缩最及时」，是最不该滞后的指标。\n\n**关键概念：** 指标四件套：CPU（通用默认）、请求量/连接数（最及时）、队列深度（SQS 专用）、自定义业务指标（最真实）。选错指标，策略再好也白搭。"},{"id":"D3-048","d":3,"t":"single","s":"自编·3.2.7","q":"一个团队在 ECS 上跑订单处理服务：订单消息进 SQS，ECS 服务里的任务作为消费者拉取处理。团队要给这个 ECS 服务配自动扩缩，希望任务数跟着待处理消息量走——积压多就多起任务，消费完自动缩回。\n\n正确的配置方式是什么？","o":[{"l":"A","t":"给 ECS 集群的 EC2 实例层配 CPU 目标跟踪，实例多了任务自然处理得快。"},{"l":"B","t":"按固定时间表扩缩任务数——早上扩到最大值，深夜缩到最小值，覆盖大部分流量形态。"},{"l":"C","t":"给 ECS 服务自动扩缩配 SQS 队列深度目标跟踪——ECS 服务扩缩与队列深度指标原生集成，积压即扩、消费完即缩。"},{"l":"D","t":"手工监控队列积压，超过阈值时用脚本调用 ECS API 手动调整任务数，可控性最强。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文写明：ECS 服务自动扩缩与 ALB 请求量、SQS 队列深度目标跟踪集成。队列消费场景配队列深度目标跟踪，正是「跟着待处理量走」的原生路径。\n\n**其他选项为什么错：**\n- A：实例层 CPU 与队列积压没有对应关系，扩了实例不代表扩了任务数。\n- B：固定时间表覆盖不了不可预测的积压波动，积压低谷时段浪费容量。\n- D：手工脚本是把自动化的活退回人工，既慢又容易漏。\n\n**关键概念：** ECS 服务层扩缩的原生指标集成：ALB 请求量、SQS 队列深度。队列消费场景的服务扩缩盯队列深度，不要盯实例 CPU。"},{"id":"D3-049","d":3,"t":"single","s":"自编·3.2.7","q":"一个团队的容器工作负载分两类：一类是 7×24 稳定运行的核心 API（流量曲线平缓），另一类是每天定时批量跑的数据处理任务（跑完即释放）。团队在规划这两类负载的运行时成本结构。\n\n按正文的成本结构建议，正确的规划是什么？","o":[{"l":"A","t":"两类都用 Fargate——不用管实例，运维成本最低，总成本也最低。"},{"l":"B","t":"稳定的核心 API 用 EC2 模式跑基线（单价低），批量任务用 Fargate（跑完即释放）；通过容量提供策略混用两种容量。"},{"l":"C","t":"两类都用 EC2 模式并常驻最大容量的实例，批量任务复用空闲的 API 实例资源。"},{"l":"D","t":"核心 API 用 Fargate，批量任务用 EC2 模式常驻实例——反过来才是对的。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文的成本结构：Fargate 省运维但单价高于 EC2 模式——稳定大负载用 EC2 模式，波动与突发用 Fargate，可以混用（容量提供策略）。核心 API 是稳定基线，批量任务是短时波动，正好各得其所。\n\n**其他选项为什么错：**\n- A：全 Fargate 的单价溢价对 7×24 基线负载最不划算，省下的运维钱抵不过多付的计算钱。\n- C：常驻最大容量是最贵的方案，批量任务复用空闲资源的设计也很脆弱。\n- D：方向完全反了——把溢价付给最稳定的负载、把低单价留给最不需要常驻的负载。\n\n**关键概念：** 运行时成本匹配负载形态：稳定基线 → EC2 模式；波动/突发/短时 → Fargate；容量提供策略负责两者混用。"},{"id":"D3-050","d":3,"t":"multiple","s":"自编·3.2.7","q":"一个团队在容器平台上评审扩缩架构设计，重点讨论「容器扩缩分两层」的问题：任务数与集群容量分别怎么扩、Fargate 与 EC2 模式在这两层的差异是什么。会上有几种说法，有对有错。按照正文给出的容器扩缩双层结构，正确的有哪些？（选两项）","o":[{"l":"A","t":"服务层扩缩决定任务数够不够——ECS 服务自动扩缩可以按 ALB 请求量或 SQS 队列深度做目标跟踪。"},{"l":"B","t":"Fargate 模式同样需要管理集群层的 EC2 容量，只是平台代管了部分工作。"},{"l":"C","t":"EC2 模式有集群层（EC2 容量够不够）与服务层两层要管；Fargate 只有服务层，没有集群层烦恼。"},{"l":"D","t":"EKS 的 Kubernetes 控制面由 AWS 托管且不收费，与 ECS 的控制面成本结构相同。"},{"l":"E","t":"容器扩缩只有服务层一层，集群层是虚构的概念，不用关心。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** A 正是服务层扩缩的能力描述（与 ALB 请求量、SQS 队列深度目标跟踪集成）；C 正是正文的双层结构原文——EC2 模式两层都要管，Fargate 只有服务层。\n\n**其他选项为什么错：**\n- B：Fargate 模式恰恰没有集群层——不跑在 EC2 实例上，容量管理整体消失。\n- D：EKS 每集群收控制面费，ECS 控制面免费——成本结构不同，说法错误。\n- E：EC2 模式的集群层真实存在：任务再多，EC2 容量不够也跑不起来。\n\n**关键概念：** 容器扩缩两层：集群层（EC2 容量）与服务层（任务数）。Fargate 消掉集群层；EKS 控制面收费、ECS 免费。"},{"id":"D3-051","d":3,"t":"single","s":"自编·3.2.8","q":"一个 SaaS 产品用户主要在欧美，系统部署在美东单区域。欧洲用户反馈 P95 延迟高达 400 毫秒，产品负责人提出「直接再建一个欧洲区域，把系统铺过去」。架构师按多区域部署的决策顺序给出了不同意见。\n\n架构师的意见是什么？","o":[{"l":"A","t":"先上 CloudFront 边缘缓存试一轮：静态资源与可缓存 API 从欧洲边缘节点就近返回，P95 往往就能压到位——很多「全球访问」场景边缘缓存就够了，不够再上多区域。"},{"l":"B","t":"同意直接上欧洲区域——用户反馈延迟问题就该用多区域解决，这是最彻底的方案。"},{"l":"C","t":"建议把美东区域的数据全部搬到欧洲区域，让欧洲用户就近访问，美东用户反忍受延迟。"},{"l":"D","t":"建议给欧洲用户单独发一个客户端版本，在客户端内置缓存，绕过网络延迟问题。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文的考试判断与取舍口吻：「全球用户延迟高」→ 先 CloudFront 边缘缓存，不够再多区域；「很多『全球访问』场景，边缘缓存就能把 P95 压到位」。正文的场景举例：上 CloudFront 后 P95 从 400 降到 180 毫秒，多区域停做。\n\n**其他选项为什么错：**\n- B：多区域是「两倍加复杂度」的投入，跳过边缘缓存直接上，大概率是为不需要的问题付大成本。\n- C：数据搬家不解决延迟，只是把延迟问题换了一批受害者。\n- D：客户端缓存解决不了服务端 API 的往返延迟，方向错位。\n\n**关键概念：** 多区域部署的触发条件是延迟或容量，但顺序是先边缘缓存再多区域——需求驱动的多区域，每一步都要有明确理由。"},{"id":"D3-052","d":3,"t":"multiple","s":"自编·3.2.8","q":"一个 SaaS 产品因欧盟数据合规要求要加欧洲区域，与美东区域同时活跃服务，欧洲用户的数据必须留在欧洲。团队整理多区域部署的设计要点，涵盖流量入口、数据层与持续运维成本三个方向。下列说法正确的有哪些？（选三项）","o":[{"l":"A","t":"多区域活跃的总成本就是两个区域各部署一套的硬件成本之和，没有额外开销。"},{"l":"B","t":"Route 53 延迟路由（latency routing）把用户导向对他最快的区域，地理位置路由可按国家分配流量。"},{"l":"C","t":"多区域要管数据冲突、配置同步、逐区域发布——成本不是「两倍」，是「两倍加复杂度」。"},{"l":"D","t":"按用户所在地合规隔离数据时，用地理位置路由把欧洲用户固定在欧洲区域，数据按区域存储。"},{"l":"E","t":"两个区域同时可写的数据层可以用 DynamoDB Global Table（主动-主动双向复制）。"}],"a":["B","C","D","E"],"e":"**正确答案：BCDE。**\n\n**为什么对：** B、D 是 Route 53 两种路由形态的正确用法；C 是正文的取舍口吻原话；E 是数据层主动-主动的标准选型——正文场景举例正是 Global Table 双向复制加地理路由的组合。\n\n**其他选项为什么错：**\n- A：错在忽略复杂度成本——数据冲突、配置同步、逐区域发布都是持续性开销，「两倍」只是起点。\n\n合规隔离正是地理路由的典型用途——欧洲用户的数据留在欧洲区域存储。\n\n**关键概念：** 多区域三件套：Route 53（延迟/地理路由）+ 数据层（Global Table 或 Aurora Global）+ 部署自动化（同一套 IaC 铺多区域）。成本＝两倍加复杂度。"},{"id":"D3-053","d":3,"t":"single","s":"自编·3.2.9","q":"一个 API 平台用 API Gateway 做统一入口，后端是多个 Lambda 函数与内部服务。最近一次下游数据库故障时，API Gateway 前面的请求堆积如山，全部穿透到了已经瘫痪的数据库，把恢复过程也拖慢了。团队要在入口层加一个「故障时自断流量」的机制。\n\n最贴合的机制是什么？","o":[{"l":"A","t":"给每个 Lambda 函数加大内存配置，让它们处理得更快，减少堆积。"},{"l":"B","t":"在 API Gateway 前面加一层 CloudFront，用 CDN 缓存挡住所有 API 请求，故障时用户拿到缓存数据。"},{"l":"C","t":"把所有 API 都改成异步队列模式，请求全部先进 SQS 排队，故障恢复后再消费。"},{"l":"D","t":"配置 API Gateway 限流（throttling）——设置速率与突发上限，正常时保护下游，故障时把流量挡在入口，避免穿透拖垮恢复过程。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文写明：API Gateway 限流的默认上限既保护下游，也是故障时「自断流量」的开关。题干的「请求穿透到瘫痪数据库拖慢恢复」正是缺限流的典型后果。\n\n**其他选项为什么错：**\n- A：加大内存改变不了下游已瘫痪的事实，堆积请求照样穿透。\n- B：CDN 只能缓存可缓存的 GET 响应，写请求与个性化请求照样穿透。\n- C：全异步化是大改造，且队列模式改变接口语义，不是「入口自断」的最贴合机制。\n\n**关键概念：** API Gateway 限流的双重身份：常态是保护下游的节流阀，故障时是自断流量的开关。入口层限流是「别把故障放大」的第一道闸。"},{"id":"D3-054","d":3,"t":"single","s":"自编·3.2.9","q":"一个 API 后端用 Lambda 承接请求，下游是自建 MySQL，最多只能扛 100 个并发连接。促销夜并发冲到 3000，Lambda 全量展开——数据库连接池瞬间耗尽，所有请求超时，连平时正常的请求也一起失败，故障持续到流量回落后才自愈。按正文的机制，正确的修复是什么？","o":[{"l":"A","t":"把 MySQL 的最大连接数调到 5000，让数据库扛住 Lambda 的全量并发，不再耗尽连接池。"},{"l":"B","t":"给每个 Lambda 调用加重试逻辑，连接失败就重试，最终总能抢到连接执行成功。"},{"l":"C","t":"给这个函数设预留并发（reserved concurrency）限顶（如 80，留余量给运维函数）——超出的请求排队等待，下游容量边界靠限流配平。"},{"l":"D","t":"把函数超时时间缩短，让抢不到连接的请求快速失败返回，减少堆积时间。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文写明：预留并发给关键函数保底、给下游不可扛的函数限顶；正文的场景举例与题干完全同型——设预留并发限顶后，超出的请求排队，下游不再被打穿。无服务器的「无限伸缩」是计算层的，下游容量边界必须靠限流配平。\n\n**其他选项为什么错：**\n- A：自建 MySQL 扛 5000 连接既不现实也不解决根本——连接数只是容量边界的表象。\n- B：重试风暴会让连接竞争更激烈，失败面反而扩大。\n- D：快速失败减少的是等待时间，不是失败本身，用户体验照样崩。\n\n**关键概念：** 预留并发的两个用途：给关键函数保底、给下游扛不住的函数限顶。计算层无限伸缩撞上有限下游时，限流配平是标准解。"},{"id":"D3-055","d":3,"t":"multiple","s":"自编·3.2.9","q":"一个团队的 API 后端用 Lambda 承接，用户抱怨每天早高峰的首批请求偶发要等 1~2 秒才返回，其余时间正常。团队确认这是冷启动现象——夜间低流量后执行环境被回收，早高峰首批请求要等环境初始化。开会讨论缓解措施。按照正文给出的冷启动缓解手段，正确的有哪些？（选三项）","o":[{"l":"A","t":"对延迟敏感的函数配置预置并发（provisioned concurrency），让一批执行环境常热，请求到达即可用。"},{"l":"B","t":"冷启动是平台固有行为无法缓解，只能接受并在产品层面告知用户首请求较慢。"},{"l":"C","t":"精简部署包体积——依赖越少，初始化执行环境要拉取和加载的东西越少，冷启动越短。"},{"l":"D","t":"把初始化逻辑（建连接、加载配置）移出请求处理主路径，避免每次初始化都重复耗时。"},{"l":"E","t":"把函数内存配置拉到最大档，内存越大初始化必然越快，冷启动自然消失。"}],"a":["A","C","D"],"e":"**正确答案：ACD。**\n\n**为什么对：** 三条正是正文的冷启动缓解清单：预置并发保热、减少包体积、初始化移出主逻辑。三条分别从「预热」「变轻」「少做重复功」三个方向压缩冷启动。\n\n**其他选项为什么错：**\n- B：「无法缓解」与正文的缓解清单直接矛盾。\n- E：内存与初始化速度没有必然的正比关系，拉满内存只会增加成本，冷启动不会消失。\n\n**关键概念：** 冷启动缓解三板斧：预置并发保热、减少包体积、初始化移出主逻辑。延迟敏感场景用预置并发，其余场景从包体积与初始化路径下手。"},{"id":"D3-056","d":3,"t":"single","s":"自编·3.3.1","q":"一个订单系统在灾备评审会上，业务方提了两个要求：「故障后 30 分钟内必须恢复服务」和「最多允许丢 5 分钟的订单数据」。架构师要把这两句话翻译成灾备指标，向团队说明它们分别对应什么、约束的是什么。\n\n正确的对应关系是什么？","o":[{"l":"A","t":"30 分钟恢复对应 RPO，丢 5 分钟数据对应 RTO——两个指标都是恢复速度的度量。"},{"l":"B","t":"30 分钟恢复对应 RTO（恢复时间目标），丢 5 分钟数据对应 RPO（恢复点目标）——前者约束「多久恢复」，后者约束「丢多少数据」。"},{"l":"C","t":"两个要求都对应 RTO——恢复时间与数据丢失都是时间维度的概念，统一用一个指标管理。"},{"l":"D","t":"两个要求都对应 RPO——只要数据不丢，恢复快慢是工程细节，不算灾备指标。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文定义：RTO 是恢复时间目标——从故障发生到服务恢复最多容忍多久；RPO 是恢复点目标——最多容忍丢多久的数据。30 分钟恢复＝RTO，丢 5 分钟＝RPO，一一对应。\n\n**其他选项为什么错：**\n- A：两个指标对调了，RPO 管数据丢失、RTO 管恢复时长，不能混。\n- B：把两个指标合并是常见误区——「恢复快」不等于「不丢数据」，两把尺子要分别量。\n- D：恢复速度恰恰是 RTO 的本职，不能把工程细节与灾备指标割裂。\n\n**关键概念：** RTO＝多久恢复，RPO＝丢多少数据。两者是灾备花钱的方向盘：RTO 越短切换越要自动化，RPO 越接近 0 复制越要同步。"},{"id":"D3-057","d":3,"t":"single","s":"自编·3.3.1","q":"一个团队给核心交易库定的灾备指标是 RPO 15 分钟。评审时有成员认为这个要求很低、随便备份一下就能满足。架构师按 RPO 的定义纠正了这个理解，并说明了它对备份频率的直接约束。\n\n架构师的说明是什么？","o":[{"l":"A","t":"RPO 15 分钟意味着恢复后最近 15 分钟的写入可以没有——备份（或复制）频率必须把丢失窗口压在 15 分钟以内，频率不够指标就是空话。"},{"l":"B","t":"RPO 15 分钟意味着每天备份一次就够——15 分钟指恢复动作本身的时长，与备份频率无关。"},{"l":"C","t":"RPO 15 分钟意味着系统每 15 分钟自动重启一次，确保数据定期落盘。"},{"l":"D","t":"RPO 15 分钟意味着恢复后的数据必须是 15 分钟前的那份完整快照，期间的所有写入都要人工补录。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文定义：RPO 15 分钟意味着恢复后最近 15 分钟的写入可以没有。反过来推：备份/复制动作的间隔必须短于 15 分钟，丢失窗口才兜得住指标——「随便备份」满足不了。\n\n**其他选项为什么错：**\n- B：把 RPO 与恢复动作时长（那是 RTO 的事）混了，备份频率直接决定 RPO。\n- C：RPO 与重启无关，是数据丢失容忍度指标。\n- D：「必须人工补录」不是 RPO 的定义，RPO 只规定容忍上限，怎么补是预案细节。\n\n**关键概念：** RPO 由备份/复制频率决定，RTO 由切换自动化程度决定。指标定了，频率与自动化就要跟着定，否则指标是空话。"},{"id":"D3-058","d":3,"t":"multiple","s":"自编·3.3.1","q":"一个架构团队在内部培训里讲解 RTO 与 RPO 两个灾备指标。主讲人先讲完定义，接着列出了几条「指标与实现方式、成本」关系的说法让学员判断，作为培训的互动环节。按照正文给出的定义与成本规律，正确的有哪些？（选两项）","o":[{"l":"A","t":"RTO 越短，切换越要自动化——分钟级的 RTO 靠人工操作基本做不到。"},{"l":"B","t":"RPO 越接近 0，复制越可以放松为异步——反正指标要求低，异步复制足够。"},{"l":"C","t":"RPO 越接近 0，复制越要同步——每收紧一档指标，成本都上一个台阶。"},{"l":"D","t":"RTO 与 RPO 只需要定一个，另一个可以由灾备方案自动推算出来。"},{"l":"E","t":"RTO 与 RPO 都是恢复速度的指标，量的是同一件事，可以互相替代。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** A 正是正文的成本规律：RTO 越短，切换越要自动化。C 也是正文原话：RPO 越接近 0，复制越要同步——每收紧一档，成本都上一个台阶。\n\n**其他选项为什么错：**\n- B：方向反了——RPO 接近 0 要求的是同步复制（如 Multi-AZ），异步复制必有丢失窗口。\n- D：两个指标量的是不同的东西（时间与数据），相互推不出来，必须分别向业务确认。\n\n- E：说反了——RTO 量恢复时间、RPO 量数据丢失，是两把不同的尺子，量的是不同的东西。\n\n**关键概念：** 两把尺子一条规律：RTO 管时间靠自动化，RPO 管数据靠复制方式；指标每紧一档，钱就多一档。"},{"id":"D3-059","d":3,"t":"single","s":"自编·3.3.2","q":"一个内部管理系统按「备份与恢复」档位做灾备：只备数据，计算环境不常驻灾区，故障时从头重建。某次区域故障后恢复花了 9 个小时，管理层质疑灾备方案失效。架构师按四档灾备的能力边界解释了这个结果。\n\n正确的解释是什么？","o":[{"l":"A","t":"备份与恢复档位的 RTO 本来就是数小时到天——只备数据、灾时重建环境是这个档位的设计形态，9 小时在预期内；要缩短 RTO 就要升档到最小化启用或温备。"},{"l":"B","t":"9 小时说明备份执行失败，数据没有完整恢复——应该检查备份任务的日志并重跑。"},{"l":"C","t":"备份与恢复档位的 RTO 应该是分钟级——9 小时远超承诺，是执行团队操作不熟练造成的。"},{"l":"D","t":"备份与恢复档位只适用于测试环境，任何生产系统都不允许使用这个档位。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文四档定义：备份与恢复——只备数据，灾时重建环境，RTO 数小时到天，成本最低。9 小时正是这个档位的正常表现，管理层的不满其实是「档位买低了」，出路是升档。\n\n**其他选项为什么错：**\n- B：题干没有备份失败的信息，恢复成功只是慢，归因错误。\n- C：分钟级 RTO 是温备的能力，把这个承诺安到备份与恢复档位上属于张冠李戴。\n- D：太绝对——低关键性系统用最低成本档位是合理选择，关键是档位与 RTO/RPO 要求匹配。\n\n**关键概念：** 四档灾备按成本与速度排：备份恢复（小时到天）→ 最小化启用（十分钟到小时）→ 温备（分钟级）→ 主动-主动（接近 0）。RTO 不达标先查档位再查执行。"},{"id":"D3-060","d":3,"t":"single","s":"自编·3.3.2","q":"一个团队在设计跨区域灾备：预算有限，无法接受第二个区域常驻完整环境，但要求灾时 RTO 控制在半小时到一小时之间，不能等数小时的从头重建。数据层要求持续复制到灾区。按四档灾备的定义，最贴合的档位是什么？","o":[{"l":"A","t":"主动-主动——多区域同时全量服务，RTO 接近 0，一步到位最保险。"},{"l":"B","t":"温备——缩水版完整环境常驻另一区域持续跑，灾时扩容接管，RTO 分钟级。"},{"l":"C","t":"备份与恢复——只备数据灾时重建，成本最低，先落地方案再逐步优化。"},{"l":"D","t":"最小化启用（pilot light）——数据层常驻复制，计算层只留最小核心（镜像与配置就绪），灾时拉起全量，RTO 十分钟到小时，成本介于两档之间。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文的四档定义逐条对：最小化启用＝数据层常驻复制 + 计算层只留最小核心，RTO 十分钟到小时——正好落在「半小时到一小时」的要求区间；成本上不算常驻完整环境，符合预算约束。\n\n**其他选项为什么错：**\n- A：主动-主动成本最高，与「预算有限」矛盾，且 RTO 接近 0 远超需求——过度设计。\n- B：温备常驻的是「缩水版完整环境」，持续运行的成本比最小化启用高一档，30 分钟级 RTO 用不着。\n- C：备份恢复的 RTO 是数小时到天，不满足「不能等数小时重建」的硬要求。\n\n**关键概念：** 档位选择是 RTO/RPO 与成本的匹配题：预算紧 + RTO 小时级 → 最小化启用；RTO 分钟级 → 温备；接近 0 → 主动-主动。"},{"id":"D3-061","d":3,"t":"single","s":"自编·3.3.2","q":"一个 SaaS 平台的灾备方案里，温备区域的月成本是主区域的 45%。财务在评审时质疑：「温备不就是再建一套环境吗？成本应该接近翻倍才对，45% 是不是算错了？」架构师按温备的定义解释了成本结构。\n\n架构师的解释是什么？","o":[{"l":"A","t":"温备是「缩水版完整环境」常驻另一区域——容量缩水、只保留核心链路，灾时才扩容接管；缩水常驻的成本低于全量翻倍，45% 是合理区间。"},{"l":"B","t":"财务算得对——温备就是全量副本，成本必然接近翻倍，45% 说明预算漏算了资源项。"},{"l":"C","t":"温备环境平时不运行任何资源，只在灾时才创建，所以成本应该接近零，45% 反而算多了。"},{"l":"D","t":"温备的成本高低只取决于数据复制量，计算层不产生任何费用。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文定义：温备＝缩水版完整环境常驻另一区域持续跑，灾时扩容接管。「缩水」正是成本低于翻倍的原因——容量与组件都按灾时扩容前的最小可用规格保留。\n\n**其他选项为什么错：**\n- B：把温备与主动-主动（多区域全量服务）的成本结构混了。\n- C：温备的环境是「常驻持续跑」的，不是灾时才创建——灾时才拉起的是最小化启用。\n- D：温备的计算层持续产生费用，这正是它与最小化启用的成本差异来源。\n\n**关键概念：** 三档成本结构：最小化启用只留数据层与镜像配置；温备常驻缩水环境；主动-主动全量双跑。温备的「温」字就是缩水常驻的意思。"},{"id":"D3-062","d":3,"t":"single","s":"自编·3.3.3","q":"一个团队第一次做跨区域切换演练。切换脚本执行完「把 Aurora 东京副本提升为主库、Route 53 指向东京端点」两个动作后就宣布演练成功。架构师复盘时指出流程漏了关键一步，宣布成功为时过早。\n\n漏掉的是什么？","o":[{"l":"A","t":"漏了「数据校对」环节——要把两个区域的数据库逐表逐行比对一致后才算切换成功。"},{"l":"B","t":"漏了「通知管理层」环节——重大切换动作必须先向管理层报备才能算完成。"},{"l":"C","t":"漏了「验证」环节——切换后要跑核心链路回归（登录、下单、查询）确认服务真的可用，切完不验证等于没切。"},{"l":"D","t":"漏了「回切」环节——演练必须马上切回原区域，不回切就不能算演练成功。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文恢复流程五步：故障检测 → 判定切换 → 执行切换 → 验证（核心链路回归）→ 回切或固化新主。执行切换只是第三步，跳过验证就宣布成功，正是演练最容易漏的环节。\n\n**其他选项为什么错：**\n- A：逐表逐行比对不现实也不必要——验证的对象是核心链路能不能跑通，不是全量数据一致。\n- B：报备是管理流程，不是恢复链路的技术环节。\n- D：流程最后一步是「回切或固化新主」——灾备演练可以固化新主观察，不是必须立即回切。\n\n**关键概念：** 恢复五步链路：检测 → 判定 → 切换 → 验证 → 回切或固化。「切完就宣布成功」是跳步，验证环节缺位的切换是盲切。"},{"id":"D3-063","d":3,"t":"multiple","s":"自编·3.3.3","q":"一个团队在把恢复流程写成切换手册，让值班工程师照着执行。架构师先把恢复链路的构成要素列出来，要求大家拿这份要素清单核对手册是否覆盖完整，缺了哪一环都要补上。按照正文给出的恢复流程链路，下列哪些属于链路上的环节？（选三项）","o":[{"l":"A","t":"故障检测——通过健康检查与告警发现故障。"},{"l":"B","t":"判定切换——确认故障级别与影响面，决定是否触发切换。"},{"l":"C","t":"全员大会表决——切换决策提交全员讨论通过后执行。"},{"l":"D","t":"执行切换——通过 DNS 切换或副本提升把流量与写入切到灾区。"},{"l":"E","t":"删除主区域资源——切换完成后立即删除原主区域的全部资源以节省成本。"}],"a":["A","B","D"],"e":"**正确答案：ABD。**\n\n**为什么对：** 正文的恢复链路：故障检测（健康检查/告警）→ 判定切换 → 执行切换（DNS 或副本提升）→ 验证 → 回切或固化新主。A、B、D 分别是链路的前三个环节。\n\n**其他选项为什么错：**\n- C：切换判定按预案与指标执行，不是全员表决——突发故障等不了会议。\n- E：切换后原区域资源要保留用于回切或重建副本关系，立即删除是危险动作。\n\n**关键概念：** 五步链路背下来：检测 → 判定 → 切换 → 验证 → 回切或固化。手册对照这五步查覆盖，缺一步就是断链。"},{"id":"D3-064","d":3,"t":"single","s":"自编·3.3.3","q":"一次真实的区域故障中，团队按手册把流量切到了灾备区域，服务恢复了。三天后主区域恢复，团队内部对下一步产生分歧：一部分人主张立即切回主区域恢复原状，另一部分人主张继续在灾备区域运行。按恢复流程的最后一步，正确的做法是什么？","o":[{"l":"A","t":"立即切回主区域——灾备区域只是临时容身之所，切回才能恢复原有的容量与成本结构。"},{"l":"B","t":"按预案在「回切」与「固化新主」之间做选择：评估灾备区域的运行状况、回切风险与窗口，验证通过后择机回切，或固化新主继续运行——两个选项都是流程内的合法终态。"},{"l":"C","t":"维持双主同时写入，等两个区域的数据完全同步后再决定去向，避免任何丢失。"},{"l":"D","t":"回切动作已经超出了恢复流程的范围，应该重新走一遍完整的立项评审再定。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文恢复流程的最后一步是「回切或固化新主」——两个都是合法终态。回切不是默认动作：要评估灾区的承载、原区域的恢复质量与回切窗口，验证后再动。\n\n**其他选项为什么错：**\n- A：立即切回跳过了评估与验证，回切本身就是一次切换，盲目执行风险不小。\n- C：双主同时写入引入数据冲突，除非业务本来就设计为主动-主动，否则是无中生有的方案。\n- D：回切或固化正是流程内的最后一步，不需要重新立项。\n\n**关键概念：** 恢复流程终点有两条路：回切（恢复原布局）或固化新主（灾备区域转正）。选择依据是风险与窗口，不是惯性。"},{"id":"D3-065","d":3,"t":"single","s":"自编·3.3.4","q":"一个团队按文档演练 Aurora Global Database 的跨区域切换：预案写的是把主库从新加坡提升到东京副本。演练执行时切换动作顺利完成，但应用连上东京主库后全部读写报错——权限被拒，服务并没有真正恢复。\n\n排查发现的根因是什么？","o":[{"l":"A","t":"东京副本的数据与新加坡主库不同步，提升后的数据是旧版本，应用因数据不一致而报错。"},{"l":"B","t":"应用角色信任的数据库 IAM 授权与用户只建在新加坡——东京区域缺对应的授权配置，纸上方案演练一次就暴露了纸面与现实的差距。"},{"l":"C","t":"Aurora Global 的提升动作不完整，需要额外的命令才能让副本真正接受写入。"},{"l":"D","t":"应用连接串写死了新加坡的端口，东京区域的端口不同，改成东京端口即可。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 这正是正文的场景举例：演练时发现东京副本的 IAM 授权没配——应用角色信任的数据库用户只建在新加坡。切行动作成功、应用却用不了，暴露的正是纸面方案发现不了的配置差距。\n\n**其他选项为什么错：**\n- A：题干报错是权限被拒，不是数据不一致——归因错位。\n- C：提升动作是完整的，副本提升后即可写，不存在「额外命令」。\n- D：题干没有端口错误的证据，报错是权限层面。\n\n**关键概念：** 演练的价值就是暴露纸面方案的缺口：IAM 授权、区域专属配置这些「切过去才有」的坑，不演练永远发现不了。演练发现的坑要回写进切换脚本。"},{"id":"D3-066","d":3,"t":"single","s":"自编·3.3.4","q":"一个团队要验证 Route 53 故障转移路由是否真的会在主区域故障时自动切换，同时想量一量切换在用户侧实际生效要多久——预案里写的是「分钟级生效」，没人验证过这个数字从哪来。按正文的演练手段，正确的做法是什么？","o":[{"l":"A","t":"直接把主区域的应用全部停掉制造真实故障，观察切换全过程——最真实的演练方式。"},{"l":"B","t":"读一遍 Route 53 的路由策略文档，确认故障转移路由的配置说明与预案一致即可判定可用。"},{"l":"C","t":"把健康检查的端点改坏（模拟区域故障），观察故障转移路由是否按时切换，同时观察 DNS TTL 的实际生效时长——演练量出来的才是真实的用户侧切换时间。"},{"l":"D","t":"在备区域发起大量测试请求，验证备区域的容量与性能是否达标，切换机制不用单独验证。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文演练手段：DNS 层——把健康检查端点改坏（模拟区域故障），观察故障转移路由是否按时切换，同时观察 TTL 实际生效时长。「切换后 DNS 仍指向旧区域」这类坑，演练量 TTL 才能发现。\n\n**其他选项为什么错：**\n- A：全停主区域是真故障不是演练，风险与代价不可控，演练要可控地注入故障。\n- B：正文考试判断原文：「验证灾备预案有效性」→ 做故障注入演练，不是「读文档」。\n- D：备区域容量与切换机制是两回事，流量切换不生效，容量再够也没用。\n\n**关键概念：** 演练三板斧：改坏健康检查端点验 DNS 切换、观察 TTL 实际生效、度量真实切换时间。纸面一致性≠实际可用性。"},{"id":"D3-067","d":3,"t":"multiple","s":"自编·3.3.4","q":"一个团队制定季度灾备演练计划，覆盖数据库层、DNS 层与应用层的切换演练，CloudFront 的回源行为也在验证范围里。有人提议演练发现的问题不必回写脚本。按照正文给出的各层演练手段与闭环要求，下列哪些属于正确的演练动作？（选三项）","o":[{"l":"A","t":"RDS Multi-AZ 用故障切换 API（RebootWithFailover）主动触发切换，观察实际 RTO。"},{"l":"B","t":"应用层逐台摘除实例，Auto Scaling 补齐后验证无状态化是否彻底。"},{"l":"C","t":"演练发现的所有问题先内部消化，不回写切换脚本，避免脚本频繁变更。"},{"l":"D","t":"Aurora Global 用副本提升演练切换，观察实际 RTO 与 RPO 是否达承诺。"},{"l":"E","t":"CloudFront 层验证源站故障时缓存回源行为与错误页展示是否符合预期。"}],"a":["A","B","D","E"],"e":"**正确答案：ABDE。**\n\n**为什么对：** 四条分别是正文的演练手段清单：数据库层的故障切换 API 与副本提升、应用层的逐台摘除、CloudFront 层的回源行为验证。各自度量对应层的切换能力。\n\n**其他选项为什么错：**\n- C：正文的场景举例明确要求「把演练发现的坑回写进切换脚本」——不回写，同样的坑下次还会踩。\n\n**关键概念：** 演练覆盖三层：数据库（切换 API/副本提升）、DNS（改坏端点看 TTL）、应用（摘实例验无状态），外加 CloudFront 回源。演练结果必须闭环回写脚本。"},{"id":"D3-068","d":3,"t":"single","s":"自编·3.3.4","q":"一个团队的灾备预案写了 40 页，切换步骤、联系人、回切窗口一应俱全，但过去两年从未演练过。审计提出了整改要求。团队内部有人说「文档这么全，演练只是走形式」。架构师用一句话反驳了这个说法。\n\n最贴切的反驳是什么？","o":[{"l":"A","t":"演练应该外包给云厂商支持团队，公司内部只需审阅他们的演练报告即可。"},{"l":"B","t":"演练确实只是形式——关键是文档质量，文档足够细就可以跳过演练直接依赖预案。"},{"l":"C","t":"没演练过的灾备预案只是愿望——IAM 授权、区域配置这些切换时才暴露的坑，只有真实走一遍才能发现，40 页文档替代不了 30 分钟演练。"},{"l":"D","t":"预案两年没用过恰恰说明系统很稳定，演练的优先级可以放到最低。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文场景举例的原话就是这句：没演练过的灾备预案，只是愿望。切换链路上「纸面与现实」的差距（授权、配置、脚本可执行性）只能靠演练暴露。\n\n**其他选项为什么错：**\n- A：演练的对象是自己系统的切换链路，外包替代不了内部对预案的验证与回写。\n- B：正文考试判断：「验证灾备预案有效性」→ 故障注入演练，读文档不解决问题。\n- D：「没用过」说明的是运气不是稳定性，恰恰是未验证状态，风险更高。\n\n**关键概念：** 灾备的有效性判据是「演练通过」，不是「文档完整」。演练暴露的坑回写脚本，形成「演练—修正—再演练」闭环。"},{"id":"D3-069","d":3,"t":"single","s":"自编·3.3.5","q":"一家公司有 30 类资源的备份散落在各服务自己的控制台里，RDS 用自己的快照、EBS 用自己的快照、DynamoDB 用按需备份，谁也说不清哪些资源根本没备份、保留期是多少。管理层要求把备份变成可审计的统一体系。\n\n最贴合的服务是什么？","o":[{"l":"A","t":"AWS CloudFormation——把各资源的备份配置写进模板统一管理，模板即备份策略。"},{"l":"B","t":"AWS Systems Manager——用 State Manager 给每类资源建备份关联，按期望状态定期执行备份脚本。"},{"l":"C","t":"Amazon S3——把所有资源的备份统一导出到一个 S3 桶里集中存放，用桶策略管理访问。"},{"l":"D","t":"AWS Backup——集中备份编排：备份计划统一定义频率、保留期与生命周期，vault 存储备份并支持跨区域复制，覆盖 RDS、EBS、DynamoDB、EFS、S3 等资源。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文定义：AWS Backup 是集中备份编排服务——备份计划定义频率、保留期与生命周期，vault 存储备份并支持跨区域复制，覆盖多类资源。核心价值「策略集中、执行自动、审计统一」正对题干的三个痛点。\n\n**其他选项为什么错：**\n- A：CloudFormation 管资源创建，不是备份执行与保留策略的载体。\n- B：SSM 管的是实例配置与补丁（恢复后配置保持），不是多资源备份编排。\n- C：S3 是存储目的地，做不了编排——各服务的备份怎么进桶、频率多少、保留多久，S3 管不了。\n\n**关键概念：** 「散装备份变统一」的正解是 AWS Backup：计划统一、执行自动、vault 跨区复制、恢复测试可度量。"},{"id":"D3-070","d":3,"t":"single","s":"自编·3.3.5","q":"一个团队用 AWS Backup 做跨区域灾备：备份 vault 配置了到灾备区域的自动复制，核心数据的备份每天自动同步过去。团队内部讨论这样配置的灾备意义，有人说是为了省钱，有人说是为了提速。下列哪个说法正确抓住了 vault 跨区域复制的关键价值？","o":[{"l":"A","t":"跨区域复制能降低备份存储的单价，两个区域的存储费用分摊下来更便宜。"},{"l":"B","t":"灾时可以在目标区域直接恢复，不用从原区域搬数据——原区域可能就是灾区，数据根本拿不出来。"},{"l":"C","t":"跨区域复制能让备份绕过原区域的网络拥堵，恢复速度提升十倍以上。"},{"l":"D","t":"跨区域复制会自动验证备份的完整性，保证恢复后一定能启动成功，无需恢复测试。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文写明：vault 级配置，备份自动复制到目标区域——灾时在目标区域直接恢复，不用从原区域搬数据（原区域可能就是灾区）。这句括号正是关键价值：数据出不来时，复制就是唯一出路。\n\n**其他选项为什么错：**\n- A：跨区域复制是加一份存储，成本是上升不是下降，说反了。\n- C：没有「十倍提速」的机制，恢复速度取决于目标区域的恢复能力。\n- D：复制不等于可恢复——正文场景举例里恢复测试发现了「备份恢复后起不来」的资源，恢复测试不能省。\n\n**关键概念：** vault 跨区域复制的价值＝灾区数据可用性，不是省钱也不是提速。配套动作是定期恢复测试，验证「备了真的能用」。"},{"id":"D3-071","d":3,"t":"single","s":"自编·3.3.5","q":"一个团队在制定 AWS Backup 的备份计划时争论两个参数怎么定：备份频率与保留期。有人主张所有资源一律「每小时备份、保留三年」，最安全。架构师按正文的分档原则与成本约束给出设计方法。\n\n正确的设计方法是什么？","o":[{"l":"A","t":"频率按 RTO 定、保留期按 RPO 定——两个指标各自决定一个参数，一一对应。"},{"l":"B","t":"按架构师的意见执行「每小时备份、保留三年」——安全没有上限，成本可以在别的项目里省出来。"},{"l":"C","t":"频率与保留期都让 AWS Backup 自动决定，服务会根据资源类型选择最优参数，无需人工定档。"},{"l":"D","t":"按资源重要程度分档：核心数据按 RPO 定频率、启用跨区域复制；边缘数据降低频率本地备份。保留期按合规要求定（如审计要求一年），别一刀切全量长期跨区备份。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文两处原话：备份计划按资源重要程度分档——核心数据每日备份加跨区域复制，边缘数据每周本地备份；取舍口吻——保留期按合规要求定，按 RPO 定频率，别一刀切全量长期跨区备份。\n\n**其他选项为什么错：**\n- A：对应关系说反了——频率决定 RPO（丢多少），保留期与 RTO 无关（RTO 由恢复与切换速度决定）。\n- B：正文的取舍口吻明确反对一刀切——保留期越长、区域越多，存储费越高，「最安全」的代价是不必要的成本。\n- C：备份参数没有「自动最优」机制，分档设计是架构师的责任。\n\n**关键概念：** 备份计划三句话：频率按 RPO、保留期按合规、分档不搞一刀切。备份的每一档都直接连着存储账单。"},{"id":"D3-072","d":3,"t":"multiple","s":"自编·3.3.6","q":"一个平台团队在编写负载均衡健康检查的配置规范，目标是让后端故障自愈既快又稳：发现要快、误杀要少、下线要优雅。规范里收录了几条候选条款，有对有错。按照正文给出的参数细节与设计原则，下列哪些属于正确的规范条款？（选三项）","o":[{"l":"A","t":"健康检查间隔与阈值取折中值：间隔 10~30 秒、连续 2~3 次失败判定下线——发现快与防误杀之间平衡。"},{"l":"B","t":"健康检查端点永远返回 200，保证实例不会被误摘，流量稳定性最高。"},{"l":"C","t":"健康检查端点要检查真实依赖（如数据库连通性），但注意检查过深会拖慢检查本身。"},{"l":"D","t":"取消注册延迟（deregistration delay）给在途请求留收尾时间——设太短在途请求被掐断，设太长摘除变慢。"},{"l":"E","t":"实例下线时立即切断所有连接，让用户尽快感知到实例变更，避免请求打到旧实例。"}],"a":["A","C","D"],"e":"**正确答案：ACD。**\n\n**为什么对：** 三条都是正文的参数细节：间隔/阈值的折中值、端点检查真实依赖（并点出过深拖慢检查）、取消注册延迟的两头风险——太短掐断在途请求、太长摘除变慢。\n\n**其他选项为什么错：**\n- B：永远返回 200 是「假健康」反模式——活着但坏掉的实例不会被摘除，故障被掩盖。\n- E：立即断连正是「下线时用户请求报错」的根因，与取消注册延迟的设计目的相反。\n\n**关键概念：** 健康检查四件事：间隔与阈值折中、端点查真实依赖、取消注册延迟留收尾、Auto Scaling 按 ELB 健康检查替换。参数决定自愈速度与误杀率。"},{"id":"D3-073","d":3,"t":"single","s":"自编·3.3.6","q":"一个服务偶发「整台实例进程僵死但流量还在打到它」的现象：负载均衡的目标组健康检查正常摘除了该实例的流量，但 Auto Scaling 组始终不替换这台坏实例，进程僵死持续了半小时才被人工发现并处理。最可能的根因是什么？","o":[{"l":"A","t":"Auto Scaling 组的健康检查类型配置为 EC2（只看实例状态）——进程僵死但机器还活着，EC2 层面看实例是健康的，所以不触发替换；应改为按 ELB 健康检查替换。"},{"l":"B","t":"负载均衡的目标组健康检查间隔太长，导致摘除动作延迟了半小时，流量才从坏实例上移走。"},{"l":"C","t":"Auto Scaling 组的最小容量设置为 0，没有可用容量替换坏实例，只能等人工处理。"},{"l":"D","t":"实例的进程僵死触发了操作系统的资源保护，禁止 Auto Scaling 对该实例执行任何操作。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 这正是正文的场景举例：Auto Scaling 健康检查类型是 EC2（只看实例状态），实例进程僵死但机器活着——ELB 摘了流量，Auto Scaling 却认为健康不替换。改成按 ELB 健康检查替换后，自愈链路才接通。\n\n**其他选项为什么错：**\n- B：题干明确 ELB 已经摘除了流量（负载均衡层工作正常），坏的是「不替换」这一环。\n- C：最小容量 0 不阻止替换——替换是等量换新，不依赖容量上限；且这个配置与现象无对应关系。\n- D：不存在这种操作系统保护机制，属于编造。\n\n**关键概念：** 自愈链路要每一层都接上：ELB 摘流量 + Auto Scaling 按 ELB 健康检查替换 + 新实例上线。健康检查类型用 EC2 是断链的常见根因。"},{"id":"D3-074","d":3,"t":"single","s":"自编·3.3.6","q":"一个服务在做滚动发布：旧实例陆续下线时，部分用户的请求突然报错，报错集中在「请求发到正在下线的实例上被掐断」。负载均衡的摘除行为本身正常，摘除时机也没有问题。\n\n最可能的根因与修法是什么？","o":[{"l":"A","t":"根因是负载均衡的跨区均衡没开启，导致下线实例的流量集中压到了同 AZ 的其他实例上。"},{"l":"B","t":"根因是健康检查太敏感，把健康的实例提前摘除了；放宽健康阈值就能解决报错。"},{"l":"C","t":"根因是滚动发布的顺序不对，应该改成停机发布，一次性切换就没有掐断问题了。"},{"l":"D","t":"根因是取消注册延迟（deregistration delay）设得太短——在途请求还没处理完实例就被摘除；把延迟调长给在途请求留够收尾时间。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文考试判断原文：「实例下线时用户请求报错」→ 取消注册延迟太短。deregistration delay 的作用正是给在途请求留收尾时间，设太短就会被掐断。\n\n**其他选项为什么错：**\n- A：跨区均衡影响流量分配均匀性，与「下线时在途请求被掐断」无关。\n- B：健康检查管的是坏实例摘除，题干的实例是正常下线，不是被误摘。\n- C：退回停机发布是用更大的停机换小问题，方向倒退。\n\n**关键概念：** 取消注册延迟＝下线实例的在途请求收尾窗口：太短掐断请求（报错），太长摘除变慢。滚动发布前先核这个参数。"},{"id":"D4-003","d":4,"t":"single","q":"一个运维团队在为微服务应用设计监控方案。团队里出现了两种意见：一种主张把所有东西都做成指标告警，另一种主张把所有排障都靠翻日志。架构师要求先说清监控的两层数据形态分别适合什么场景，再定方案边界。\n\n关于指标与日志的分工，正确的说法是？","o":[{"l":"A","t":"指标是数字时间序列，体积小、适合告警与画图；日志是事件文本，信息全、适合排障——判断场景先问「要的是数字还是细节」。"},{"l":"B","t":"指标是事件文本，信息全、体积大，适合排障；日志是数字时间序列，适合告警与画图——两者的形态与用途刚好说反。"},{"l":"C","t":"指标与日志形态相同，区别只在采集工具不同，方案里两者可以随意互换，不必分层设计。"},{"l":"D","t":"日志只能按天批量导出后分析，无法支撑实时排障，所以所有排障场景都应该改用指标解决。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文给的两层分野正是这句话：指标是数字时间序列，体积小、适合告警与画图；日志是事件文本，体积大、信息全、适合排障。判断一个场景该用哪层，先问「要的是数字还是细节」——告警看数字、排障看细节。\n\n**其他选项为什么错：**\n- B：把两种形态说反了，按这个方案做，告警链路和排障链路都会建错。\n- C：形态不同决定了工具链不同，随意互换会导致告警没有数据点、排障没有现场文本。\n- D：CloudWatch Logs 本身就是实时接收通道，实时排障正是日志的强项，这条前提就不成立。\n\n**关键概念：** 指标管「多少」（数字序列、告警画图），日志管「发生了什么」（事件文本、排障取证）。","s":"自编·4.1.1"},{"id":"D4-004","d":4,"t":"single","q":"一个交易系统的运维团队在排查线上问题：业务方反馈交易偶尔出现几秒内的短促毛刺，但团队用默认 1 分钟粒度的监控图怎么也看不到异常点。团队要调整指标采集配置，把这种短促毛刺抓住。\n\n最贴合的调整是？","o":[{"l":"A","t":"给指标增加更多维度，把实例、区域都拆开看——维度管的是拆分视角，不改变数据点的时间粒度。"},{"l":"B","t":"把指标的数据点间隔从标准 1 分钟调到高分辨率 1 秒——毛刺只有更细的分辨率才抓得住，代价是存储与查询成本上升。"},{"l":"C","t":"新建一个命名空间存放该指标——命名空间只是容器，与数据点间隔无关，毛刺依旧看不到。"},{"l":"D","t":"把监控图的时间范围拉长到一周再回看——粒度不变，短促毛刺在更长的图上只会被平均得更看不出来。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 短促毛刺抓不住的根因是数据点间隔太粗：标准分辨率 1 分钟，1 秒内出现又消失的尖峰会被一分钟的平均值抹平。把指标采集调到高分辨率 1 秒间隔，毛刺才有独立数据点。代价要讲清：高分辨率存得贵，只对需要抓短促异常的指标开。\n\n**其他选项为什么错：**\n- A：维度是名值对标签，管的是同一指标按实例、按区域拆开看，与时间粒度无关。\n- C：命名空间是容器，只负责归类，解决不了分辨率问题。\n- D：时间范围只是回看窗口，粒度不变毛刺照样被平均掉。\n\n**关键概念：** 分辨率＝数据点间隔：标准 1 分钟、高分辨率 1 秒；抓短促毛刺靠提高分辨率，不靠加维度或换命名空间。","s":"自编·4.1.2"},{"id":"D4-005","d":4,"t":"single","q":"一家公司的应用日志分散在各 EC2 实例本地磁盘上，出事后经常发现日志随实例终止一起丢了。平台团队要求把日志改为持续推送到集中式日志服务，做到接近实时的接收，不再依赖实例存活。\n\n最贴合的采集方式是？","o":[{"l":"A","t":"每天用定时任务把日志文件打包上传到 S3，第二天人工下载排查——批量搬运做不到接近实时，实例终止当天日志就丢。"},{"l":"B","t":"把日志写入实例的临时存储并加大磁盘容量——只是延缓丢失，实例终止时日志照样消失，也没有集中化。"},{"l":"C","t":"在实例上安装 CloudWatch agent，把日志文件持续推送到 CloudWatch Logs——日志服务本身是实时接收通道，实例终止后日志已集中留存。"},{"l":"D","t":"关闭应用日志改为只依赖系统指标告警——指标给不了排障需要的现场细节，等于放弃了日志层。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 题干两个关键词「持续推送、接近实时」正对 CloudWatch agent 加 CloudWatch Logs 的组合：agent 装在实例上把日志推上来，CloudWatch Logs 本身就是实时接收的通道。日志离开实例集中留存后，实例终止不再带走日志。\n\n**其他选项为什么错：**\n- A：定时批量上传既不实时，当天实例终止时未上传的日志仍然丢失。\n- B：临时存储上的日志随实例走，加盘只是延后问题，集中化更无从谈起。\n- D：指标与日志是两层分工，指标告警替代不了排障要的现场文本。\n\n**关键概念：** 实时日志摄取＝agent 推送 + CloudWatch Logs 实时接收；日志先离开实例，才能不被实例生命周期带走。","s":"自编·4.1.3"},{"id":"D4-006","d":4,"t":"multiple","q":"一家金融公司的安全团队在审查日志采集链路的加密方案。日志从各实例经网络送到 CloudWatch Logs，部分归档再落到 S3。合规要求写明：传输过程与静态存储都要有加密措施，静态部分使用可管控的密钥。\n\n以下哪些措施符合要求？（选两项）","o":[{"l":"A","t":"传输段引入自研加密代理做二次封装——TLS 已覆盖传输加密，自研代理徒增维护成本，不是标准做法。"},{"l":"B","t":"采集链路保持 TLS 传输——传输中的加密由 TLS 天然覆盖，这是传输段的正确措施。"},{"l":"C","t":"静态加密等到日志导出到 S3 时再统一处理——日志进入日志组时就应落盘加密，延迟加密会留下明文窗口。"},{"l":"D","t":"日志组与 S3 归档桶分别关联 KMS 密钥（客户托管）——静态加密落在存储侧，客户托管密钥满足「可管控」要求。"},{"l":"E","t":"在应用侧用自研加密库先把日志加密再发送——脱离 KMS 的密钥管理与审计体系，合规角度是倒退。"}],"a":["B","D"],"e":"**正确答案：BD。**\n\n**为什么对：** 正文把加密分两截：传输中靠 TLS 天然覆盖（B）；静态靠 KMS——日志组可关联客户托管密钥，S3 桶支持 SSE-KMS（D）。两段各配各的措施，合规要求「传输与静态都要有、静态可管控」正好被 BD 覆盖。\n\n**其他选项为什么错：**\n- A：TLS 已覆盖传输加密，自研二次封装不解决新问题，还引入单点与维护负担。\n- C：加密发生在日志到达时——数据进日志组即落盘加密，拖到导出阶段意味着日志组里长期明文。\n- E：自研加密脱离 KMS 的审计与轮换体系，密钥管不住比不加密更糟。\n\n**关键概念：** 加密两段式：传输靠 TLS，静态靠 KMS（日志组客户托管密钥 + S3 SSE-KMS）；静态加密在落盘时生效，不是导出时。","s":"自编·4.1.4"},{"id":"D4-007","d":4,"t":"single","q":"一个平台的运维团队给几百台 EC2 统一安装 CloudWatch agent 收集日志，部署后部分实例的日志迟迟没有出现在日志组里。团队检查实例上的报错，发现是采集动作被 IAM 拒绝。要按最小权限原则补齐采集所需的权限。\n\n正确的权限配置是？","o":[{"l":"A","t":"给实例角色附加 AdministratorAccess，先保证日志能收上来再谈收敛——一步到位但爆炸半径失控，违反最小权限原则。"},{"l":"B","t":"只授予 logs:GetLogEvent 读取权限——方向反了，采集是写入动作，读权限帮不了日志推上来。"},{"l":"C","t":"在 S3 桶策略里放行实例角色写日志——日志目标是 CloudWatch Logs 不是 S3，授权对象选错了位置。"},{"l":"D","t":"给实例角色授予日志写入这套最小权限：logs:CreateLogGroup、logs:CreateLogStream、logs:PutLogEvents——采集只需要这几个动作。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 采集日志所需的 IAM 权限就是写入这一套最小集：logs:CreateLogGroup 建组、logs:CreateLogStream 建流、logs:PutLogEvents 写事件。按角色授予这三个动作，agent 即可完成采集，权限面最小。排查思路也顺：被拒先看缺哪个动作，再补哪个动作。\n\n**其他选项为什么错：**\n- A：AdministratorAccess 让实例拿到全账号控制权，日志被拒就这样开权限，以后每个服务都会照此办理。\n- B：读取权限与采集方向相反，写入动作一个都没给。\n- C：S3 桶策略管的是 S3 写入，日志采集目标是 CloudWatch Logs，授权位置错。\n\n**关键概念：** agent 采集最小权限＝logs:CreateLogGroup / CreateLogStream / PutLogEvents；缺哪个动作补哪个，不上通配更不上管理员。","s":"自编·4.1.5"},{"id":"D4-008","d":4,"t":"single","q":"一家公司的审计要求：应用日志集中存储、统一加密、按团队隔离访问——财务团队的日志只有财务角色可读，电商团队日志只有电商角色可读。有人建议给所有运维人员开通 logs 全局通配权限省事，安全团队否决了这一做法。\n\n符合审计要求的配置是？","o":[{"l":"A","t":"IAM 策略按日志组 ARN 收紧读写范围，日志组分别关联 KMS 密钥做静态加密——日志组是权限与保留的独立单元，正好支撑按团队隔离。"},{"l":"B","t":"给所有运维人员开通 logs:* 通配权限，靠事后的 CloudTrail 审计追责——权限先放开再追责，隔离要求已经落空。"},{"l":"C","t":"把两个团队的日志写进同一个日志组，用日志流前缀区分团队——日志组才是权限单元，同组内无法按团队隔离访问。"},{"l":"D","t":"只配加密不配访问控制，理由是「加密了就安全」——加密防的是窃取，防不了内部越权读取，隔离要求没有着落。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 日志组是权限与保留的独立单元——IAM 策略按日志组 ARN 收紧，就能做到按团队隔离；静态加密给日志组关联 KMS 密钥。三个要求（集中存储、统一加密、按团队隔离）逐条落地，且没有用通配放水。\n\n**其他选项为什么错：**\n- B：logs:* 通配把所有日志组的读写都放开，隔离要求直接落空，事后追责替代不了事前控制。\n- C：日志流是组内的时间序列，不是权限边界；同组内隔离做不到。\n- D：加密与访问控制是两件事，只加密解决不了「谁可读」。\n\n**关键概念：** 日志组＝权限与保留的独立单元；隔离靠按组 ARN 收紧 IAM 策略，加密靠组级 KMS，两者配套而非互替。","s":"自编·4.1.6"},{"id":"D4-009","d":4,"t":"single","q":"一家公司的 Lambda 函数与 Route 53 查询日志直写 CloudWatch Logs。审计团队提出：这类服务直写的日志组没有实例角色可以配权限，要确认这类日志的授权方式，避免出现「服务写不进来」或「权限开太大」两个极端。\n\n正确的授权方式是？","o":[{"l":"A","t":"在每个服务控制台里单独给函数挂满权限——分散配置难以审计，且函数角色权限面远超写日志所需。"},{"l":"B","t":"在日志组上配置日志组级资源策略，授权来源服务（如 Lambda、Route 53）直写该组——服务型日志用资源策略授权，不必逐处配角色。"},{"l":"C","t":"把日志组的访问全开成公开可写，让服务都能写进来——写入不设防，任何来源都能污染日志，审计链路失真。"},{"l":"D","t":"禁止服务直写，一律改为人工定期上传日志文件——放弃自动化采集，实时性与完整性都无法保证。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 服务型日志（Lambda、Route 53 查询日志等）直写日志组时，用日志组级资源策略授权来源服务——不需要、也没处给「实例角色」。资源策略精确写明哪个服务的哪个动作可以写哪个组，权限面最小且集中可审计。\n\n**其他选项为什么错：**\n- A：函数角色是业务执行身份，为了写日志把权限挂满，违反最小权限。\n- C：公开可写等于放弃来源控制，日志完整性没有保障。\n- D：人工上传放弃了自动化采集，实时性与完整性双输。\n\n**关键概念：** 服务直写的日志组用日志组级资源策略授权来源服务；实例采集才走 IAM 角色，两条授权路径别混。","s":"自编·4.1.6"},{"id":"D4-010","d":4,"t":"multiple","q":"一个监控平台团队同时要做两件事：从应用访问日志里统计成功率并配告警（日志里没有现成指标）；把 CloudWatch 里已有的全量指标近实时送进第三方监控平台。团队要给两个场景选对工具并理解其机制。\n\n以下哪些说法正确？（选两项）","o":[{"l":"A","t":"从日志统计成功率用指标过滤器——过滤器挂在日志组上，命中模式就把数值发布成自定义指标，可挂告警。"},{"l":"B","t":"指标过滤器会回扫历史日志补发指标——机制上只对新进来的日志生效，历史不补算。"},{"l":"C","t":"把已有指标送第三方用指标流——流把指标近实时持续推送到 Firehose 再转第三方端点，推模式无遗漏、低延迟。"},{"l":"D","t":"指标流会把历史指标一并回补到第三方平台——流只送建立之后的新数据点，不回补历史。"},{"l":"E","t":"两个场景随便用哪个工具都行——一个是从日志造新指标，一个是导出现成指标，方向相反不能互换。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** 正文把这个辨析点名为骨架失分点：指标过滤器**从日志造新指标**——日志里没有现成数字时用它（A）；指标流**导出现成指标**——CloudWatch 已有、要送出去时用它，推模式近实时、无遗漏（C）。一句话判据：造指标用过滤器，送指标用指标流。\n\n**其他选项为什么错：**\n- B：过滤器只对新日志生效，历史日志不会补算——这是高频陷阱。\n- D：指标流不回补历史，历史缺口要用拉取 API 分批取。\n- E：两个工具方向相反，互换会让告警链路与输送链路都建不起来。\n\n**关键概念：** 过滤器＝日志→新指标（造）；指标流＝CloudWatch→外部（送）。题干说「把指标发到 S3/第三方」选指标流，说「从日志提取错误率」选过滤器。","s":"自编·4.1.7"},{"id":"D4-011","d":4,"t":"single","q":"一个团队用指标过滤器统计应用日志里的 ERROR 次数并配了告警。某天 review 配置时发现：上周五修复前的历史日志里有大量 ERROR，但过滤器发布的那几天指标却完全没体现这些历史错误。团队要先弄清过滤器的生效范围再评估统计口径。\n\n正确的理解是？","o":[{"l":"A","t":"过滤器会自动回扫历史日志并补发指标——没有回扫机制，这个理解会让人误判上周错误已被统计。"},{"l":"B","t":"历史日志没被统计是因为过滤器模式写错——模式对不对与历史日志无关，新日志能正常计数就说明模式没坏。"},{"l":"C","t":"指标过滤器只对新进来的日志生效，历史日志不会补算——统计口径从过滤器创建时刻起算，历史错误要另行分析。"},{"l":"D","t":"把过滤器删除重建一次就能补算历史数据——重建同样只对新日志生效，动作本身改变不了生效范围。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 指标过滤器只对**新进来的**日志生效，历史日志不会补算——这是正文点名的高频陷阱。团队看到的现象完全符合机制：过滤器创建之后进来的日志才被计数，上周五之前的 ERROR 不会出现在指标里。统计口径要从创建时刻起算，历史问题用别的工具（如 Insights 查历史段）分析。\n\n**其他选项为什么错：**\n- A：机制上没有回扫，这个理解会直接导致统计口径错误。\n- B：新日志计数正常说明模式有效，问题出在生效范围不在模式。\n- D：删除重建不改变「只对新日志生效」的机制，白折腾一次。\n\n**关键概念：** 指标过滤器生效范围＝创建之后的新日志；历史不补算，历史分析走查询工具。","s":"自编·4.1.7"},{"id":"D4-012","d":4,"t":"single","q":"一个团队给错误日志建了指标过滤器配告警。上线后发现问题：周末没有错误发生，指标图上数据点断线，告警引擎因为「缺数据」无法做出正确判断，值班群里的误报讨论不断。团队要调整过滤器配置让告警判断连续。\n\n正确的调整是？","o":[{"l":"A","t":"给过滤器发布的指标设置默认值（如 0）——无日志时段也有数据点，告警判断保持连续。"},{"l":"B","t":"把告警的评估周期拉长——评估窗口变长不解决「没有数据点」的问题，缺数据的判断照样不连续。"},{"l":"C","t":"让应用每小时输出一行占位日志——在应用侧打补丁绕开配置问题，逻辑分散且依赖应用自觉。"},{"l":"D","t":"把指标过滤器删掉改用 Logs Insights 定时查询——回到人工查询路径，自动告警链路就断了。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文点名的细节：发布指标时要指定默认值——默认值不设，无日志的时段就没有数据点，画图断线、告警判断不连续；设了 0，「错误为零」也是一个明确的数据点，告警引擎可以正常判断。这正是「错误为零也有数据点」考过的场景。\n\n**其他选项为什么错：**\n- B：评估周期是告警侧参数，数据点本身缺失，窗口再长也补不出来。\n- C：占位日志是应用侧补丁，把监控问题转嫁给应用，且占位日志还会污染日志内容。\n- D：Insights 是查询不是持续指标流，替代不了过滤器。\n\n**关键概念：** 指标过滤器要配默认值：无日志时段有数据点，告警判断才连续；这是考过的细节。","s":"自编·4.1.7"},{"id":"D4-013","d":4,"t":"multiple","q":"一家公司的监控团队在梳理 CloudWatch 指标数据的对外输送方案：第三方监控平台要求 AWS 指标在 2 分钟内出现在其端点；同时数据团队要把全量指标留到 S3 数据湖做长期分析。团队要选对输送工具并配好目标。\n\n以下哪些说法正确？（选两项）","o":[{"l":"A","t":"建指标流（metric stream）把指标近实时持续推送到 Firehose，由 Firehose 转发到第三方 HTTP 端点与 S3——推模式无遗漏、低延迟，正好满足 2 分钟要求。"},{"l":"B","t":"用 GetMetricData API 定时批量拉取指标——拉模式要自己管调度，漏抓与延迟都难控，满足不了 2 分钟要求。"},{"l":"C","t":"指标流建立后会自动把历史指标一并补齐到第三方平台——机制上没有回补，这个预期会落空。"},{"l":"D","t":"指标流只送建立之后的新数据点，历史指标要用拉取 API 分批补取——流不回补历史，历史缺口要另想办法。"},{"l":"E","t":"指标流与拉取 API 完全等价，随便选一个——推与批是两种机制，延迟与完整性差距明显。"}],"a":["A","D"],"e":"**正确答案：AD。**\n\n**为什么对：** 指标流把账户里的指标**近实时**持续推送到目标——Firehose 再转 S3 或第三方端点，与定期拉 API 相比，流是推、无遗漏、低延迟（A）；但指标流只送建立之后的新数据点，不回补历史，历史数据要用拉取 API 分批取（D）。两个说法合起来才是完整正确的用法。\n\n**其他选项为什么错：**\n- B：拉模式是批处理，调度与漏抓都要自己管，2 分钟 SLA 靠它撑不住。\n- C：机制上不存在回补，这个预期会让第三方平台缺历史数据还没人发现。\n- E：推与批延迟、完整性差距明显，等价说法不成立。\n\n**关键概念：** 指标流＝推模式近实时导出现成指标；只送新数据点，历史缺口用拉取 API 补。","s":"自编·4.1.8"},{"id":"D4-014","d":4,"t":"single","q":"一个团队同时在做两件事：日志里没有现成的成功率数字，要从访问日志里统计出来并告警；另一边 CloudWatch 里已有全量指标，要送进第三方监控平台。团队新来的工程师把两个方案的工具用反了，评审要求把两个工具的分工说清。\n\n正确的分工是？","o":[{"l":"A","t":"两个场景都用指标流——指标流虽然名字带「指标」，但它造不出新指标，日志统计场景它帮不上。"},{"l":"B","t":"从日志统计成功率用指标过滤器（日志里造新指标），把已有指标送第三方用指标流（导出现成指标）——两者方向相反，各管一头。"},{"l":"C","t":"两个场景都用指标过滤器——过滤器挂在日志组上，导出 CloudWatch 已有指标根本不是它的职责。"},{"l":"D","t":"从日志统计用拉取 API，导出指标用指标过滤器——两个都选反了，统计要的是造指标，导出要的是送数据。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文把这个辨析点名为骨架失分点：指标过滤器**从日志造新指标**——日志里没有现成数字时用它（成功率统计场景）；指标流**导出现成指标**——CloudWatch 已有、要送出去时用它（第三方对接场景）。一句话判据：造指标用过滤器，送指标用指标流。\n\n**其他选项为什么错：**\n- A：指标流造不出新指标，日志统计场景它无能为力。\n- C：过滤器不承担导出职责，已有指标送第三方它管不了。\n- D：拉取 API 是取数接口不参与造指标，过滤器也不是导出工具，两个都错。\n\n**关键概念：** 过滤器＝日志→新指标（造）；指标流＝CloudWatch→外部（送）。题干说「把指标发到 S3/第三方」选指标流，说「从日志提取错误率」选过滤器。","s":"自编·4.1.8"},{"id":"D4-015","d":4,"t":"single","q":"一个团队在配置指标输送时被费用问题找上门：账户里的指标量很大，指标流建立后输送费用持续走高，财务要求把这笔持续开销压下来。团队要在不中断第三方对接、不牺牲 2 分钟时效的前提下调整配置。\n\n最合理的调整是？","o":[{"l":"A","t":"直接删除指标流，改回第三方定时来拉——延迟与完整性指标都倒退，对接 SLA 可能直接破掉。"},{"l":"B","t":"把输送频率从实时改成每天一次批量——费用降了但「近实时输送」这个建流的初衷没了。"},{"l":"C","t":"让第三方压缩接收数据的存储成本——优化错了对象，费用发生在 AWS 侧的输送量，不在第三方的存储。"},{"l":"D","t":"指标流按命名空间过滤，只导出第三方真正需要的部分——输送量降下来，费用随之下降，对接不中断。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文点明：指标流按收到的指标数据量计费，账户里指标多时是笔持续开销，可用命名空间过滤只导出需要的部分。输送量是费用的直接驱动，收窄范围是最对症的减负动作，且不改变近实时输送的性质。\n\n**其他选项为什么错：**\n- A：建流就是为了低延迟与完整性，删流改拉等于方案倒退。\n- B：改成每天一批，第三方 2 分钟内看到指标的要求直接破掉。\n- C：费用发生在 AWS 侧的输送量环节，优化第三方的存储是南辕北辙。\n\n**关键概念：** 指标流按输送数据量计费；控制成本靠命名空间过滤收窄范围，不靠牺牲实时性。","s":"自编·4.1.8"},{"id":"D4-016","d":4,"t":"single","q":"一个应用频繁卡死，业务方投诉不断，但 EC2 监控页上的 CPU 曲线一直很平稳，运维团队反复扩容也没解决问题。团队复盘时意识到监控视角有盲区，要补齐采集手段找到真正的瓶颈资源。\n\n最贴合的做法是？","o":[{"l":"A","t":"继续加机器扩容，同时把 CPU 告警阈值调得更敏感——方向错了，CPU 不是瓶颈，调它的灵敏度看不到内存问题。"},{"l":"B","t":"在控制台里直接查看实例内存使用图表——默认指标里没有内存，控制台无中生有不了这个图。"},{"l":"C","t":"安装 CloudWatch agent 采集内存使用指标——默认指标里没有内存，agent 补上这个盲区后瓶颈曲线立刻可见。"},{"l":"D","t":"把应用日志改成每分钟输出一次内存估算值——估算不可靠，且等于绕开现成的采集工具自己造轮子。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文点名的判断：题干问「如何监控实例内存/磁盘」，正解是装 CloudWatch agent——默认指标里没有这两样，凡是答案里说「直接在控制台看内存」的都是错误项。agent 收 MemoryUsed 后，内存爬升到顶的曲线立刻可见，配告警提前介入。\n\n**其他选项为什么错：**\n- A：CPU 平稳说明瓶颈不在 CPU，扩容与调阈值都在错误的资源上使劲。\n- B：正是正文点名的典型错误项——控制台默认没有内存指标可看。\n- D：估算值不可靠，绕开现成工具自己造轮子，采集口径也难维护。\n\n**关键概念：** EC2 默认指标没有内存与磁盘；监控它们＝装 CloudWatch agent，别信「控制台直接看」。","s":"自编·4.1.9"},{"id":"D4-017","d":4,"t":"multiple","q":"一个团队要为几百台 EC2 统一配置 CloudWatch agent 的采集口径，要求所有实例收集相同的指标集合与采集间隔，新实例开机自动生效。团队要选对配置管理与下发方式，避免逐台手工维护。\n\n以下哪些做法正确？（选两项）","o":[{"l":"A","t":"把配置文件逐台拷贝到每台实例——一次性能做完，但新实例上线就漏，口径很快漂移。"},{"l":"B","t":"把 agent 配置文件存到 SSM Parameter Store，配合 Run Command 或 State Manager 批量下发——几百台机器口径一致，新实例开机即拉取。"},{"l":"C","t":"不装 agent，用 EC2 默认指标凑合——内存、磁盘这些关键指标默认缺失，采集口径根本不完整。"},{"l":"D","t":"agent 只能装在 EC2 上，本地数据中心服务器无法接入——agent 同样支持本地服务器，混合场景一个口径收上来。"},{"l":"E","t":"agent 配置分两段：agent 段管代理行为，metrics 段管收集哪些指标与间隔——两段各司其职，集中管理才有一致口径。"}],"a":["B","E"],"e":"**正确答案：BE。**\n\n**为什么对：** agent 读一份 JSON 配置：agent 段管代理行为、metrics 段管收集哪些指标与间隔（E）；配置文件放 SSM Parameter Store，配合 Run Command 或 State Manager 批量下发——新实例开机即拉取，几百台机器的采集口径保持一致（B）。这正是正文给的标准组合。\n\n**其他选项为什么错：**\n- A：逐台拷贝没有集中管理，新增实例必漏，配置版本也难追溯。\n- C：默认指标覆盖面窄，内存磁盘缺失，统一口径无从谈起。\n- D：agent 装在 EC2 或本地服务器上都行，混合场景正是它的价值之一。\n\n**关键概念：** agent 配置集中化＝Parameter Store 存配置 + SSM 批量下发；agent 段管代理行为、metrics 段管采集内容。","s":"自编·4.1.9"},{"id":"D4-018","d":4,"t":"single","q":"一个混合云环境里，公司数据中心的一批物理服务器也要纳入统一监控，运维团队希望指标口径与云上 EC2 完全一致，都能看到操作系统层的内存与磁盘水位，报表也出自同一个平台。\n\n正确的做法是？","o":[{"l":"A","t":"本地服务器无法接入 CloudWatch，只能本地自建监控再人工汇总报表——agent 支持本地服务器，这个前提不成立。"},{"l":"B","t":"本地服务器装 CloudWatch agent，与 EC2 用同一份配置口径推送指标——agent 不挑运行环境，混合场景一个口径收上来。"},{"l":"C","t":"本地服务器每天导出系统日志人工核对——人工核对既不实时也不一致，与统一口径目标相反。"},{"l":"D","t":"本地服务器只监控网络连通性，内存磁盘不纳入——监控面缺了一半，操作系统层的关键水位看不到。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** CloudWatch agent 装在 EC2 或本地服务器上——本地数据中心的服务器也能装 agent，混合场景一个口径收上来，云上云下指标同构可比。这正是 agent 相比「只看 EC2 自带指标」的核心价值之一。\n\n**其他选项为什么错：**\n- A：agent 明确支持本地服务器，「无法接入」的前提不成立。\n- C：日志人工核对是排障手段不是指标采集，实时性与一致性都不达标。\n- D：监控面残缺，等于放弃了操作系统层观测。\n\n**关键概念：** agent 跨环境：EC2 与本地服务器都能装；混合监控用同一份配置口径，指标天然可比。","s":"自编·4.1.9"},{"id":"D4-019","d":4,"t":"single","q":"一家公司的日志治理方案在评审会上被问住：应用日志要保留三年但几乎不回查，有人提议把日志组保留期直接设 10 年省心，财务当场指出费用算不平。架构师要给出热区与冷区分开治理的方案。\n\n最合理的组合是？","o":[{"l":"A","t":"日志组保留期设 30 天（近期排障用），订阅导出到 S3，桶上配生命周期 90 天转 Glacier、365 天删除——热区在日志组，冷区逐级降档。"},{"l":"B","t":"日志组保留期设 10 年一刀切——三年里几乎不回查的日志全按热区价格存，费用必然算不平。"},{"l":"C","t":"日志组保留期设 1 天，之后全部删除——合规要求三年留存，1 天方案直接违规。"},{"l":"D","t":"所有日志长期放日志组不导出，靠缩短查询频率控制成本——查询频率不影响存储费用，成本问题没被触碰。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文给的标准组合：日志组保留 30 天管热区（近期排障），订阅导出到 S3 管留存，S3 生命周期 90 天转 Glacier、365 天删除管冷区逐级降档。热数据贵在日志组、冷数据逐级降成本，两头都不浪费——三年留存与费用约束同时满足。\n\n**其他选项为什么错：**\n- B：保留期 10 年一刀切几乎都是贵而错的答案，几乎不回查的日志全按热区价格存。\n- C：合规三年直接被违反，方案不成立。\n- D：日志组按存储量计费，查询频率动了也省不出存储钱。\n\n**关键概念：** 生命周期两开关：日志组保留期管热区截止，S3 生命周期管冷区分层；按访问温度分层，不按保留年限一刀切。","s":"自编·4.1.10"},{"id":"D4-020","d":4,"t":"multiple","q":"一个平台团队在制定日志归档规范，会上出现两种操作被混为一谈：一种是通过订阅把日志持续送出去，另一种是发起导出任务把已存日志搬到 S3。团队要给两种机制划清边界，写进规范。\n\n以下哪些说法正确？（选两项）","o":[{"l":"A","t":"订阅可以定期回扫历史日志并批量搬运——订阅没有回扫历史的能力，这个说法会误导规范。"},{"l":"B","t":"订阅是持续的实时流，日志边进边推给目标——适合近实时转发与处理场景。"},{"l":"C","t":"导出任务也会持续监听新日志并实时推送——导出是事后批量动作，不存在持续监听。"},{"l":"D","t":"导出任务是一次性的批量搬运，把已存日志搬到 S3——适合定期归档场景。"},{"l":"E","t":"两种机制完全等价，规范里选一个统一用——实时转发与定期归档是两种需求，混用会两头落空。"}],"a":["B","D"],"e":"**正确答案：BD。**\n\n**为什么对：** 正文原话：订阅是「边进边推」，导出是「事后批量搬」——订阅是持续的实时流（B），适合近实时转发；导出任务是一次性的批量搬运，把已存日志搬到 S3（D），适合归档。规范里按「实时 vs 归档」分工，不混用。\n\n**其他选项为什么错：**\n- A：订阅过滤器对新进日志生效，没有回扫历史再搬运的机制。\n- C：导出没有持续监听能力，把它当实时通道用会漏掉所有任务窗口之外的数据。\n- E：两种需求机制不同，统一成一个必然有一头落空。\n\n**关键概念：** 订阅＝持续实时流（边进边推）；导出＝一次性批量搬（已存日志）。带「近实时」选订阅，带「定期归档」选导出或生命周期。","s":"自编·4.1.10"},{"id":"D4-021","d":4,"t":"single","q":"一个安全团队的要求写进了 SLA：所有含 root 登录的日志出现后 1 分钟内完成通知。目前的做法是每天凌晨导出日志到 S3，再用脚本扫描一遍——通知总是迟到十几个小时，安全负责人明确要求按近实时路径改造。\n\n最贴合的方案是？","o":[{"l":"A","t":"把导出频率从每天一次提高到每小时一次——还是批量搬运，最坏也要等一个周期，1 分钟达不了。"},{"l":"B","t":"用 Logs Insights 每分钟手动查一次——靠人跑查询撑不起分钟级 SLA，值守成本也扛不住。"},{"l":"C","t":"建订阅过滤器匹配 root 登录模式指向 Lambda，Lambda 解析后发 SNS 通知——日志边进边推，秒级触发，1 分钟要求可达。"},{"l":"D","t":"给 S3 归档桶配事件通知——事件发生在归档时刻，链路前面还是批量导出，延迟源头没变。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 订阅过滤器挂在日志组上，把匹配模式的日志实时推给 Lambda——日志到达即触发，Lambda 解析后发 SNS，整条链路秒级。正文点名的场景正是这个：比定时导出再扫快得多，「近实时」三个字就选订阅路径。\n\n**其他选项为什么错：**\n- A：批量搬运的周期性延迟是机制性的，提高频率改变不了本质。\n- B：靠人跑查询撑不起分钟级 SLA，这不是自动化链路。\n- D：S3 事件通知在归档之后，整条链路的延迟大头（导出周期）依旧在。\n\n**关键概念：** 近实时通知＝订阅过滤器→Lambda→SNS；批量导出再扫描是事后链路，撑不起分钟级 SLA。","s":"自编·4.1.11"},{"id":"D4-022","d":4,"t":"single","q":"一个团队要把 CloudWatch 日志接给三个下游：安全分析平台要多消费者各自取数；另一个系统只要对特定模式的日志触发一段轻量处理逻辑；还有个团队要全文检索与仪表板。有人主张三个下游全走 Firehose，架构师指出选型错了。\n\n三个场景的正确选型是？","o":[{"l":"A","t":"全文检索场景选 Firehose——Firehose 是投递管道不是检索工具，这个位置常与订阅流混淆。"},{"l":"B","t":"多下游分发选 Lambda——Lambda 是逐条触发的处理函数，做不了多消费者分发。"},{"l":"C","t":"轻量触发选 OpenSearch——检索平台承担触发逻辑是本末倒置，轻量逻辑就该在函数里。"},{"l":"D","t":"多下游分发选 Kinesis Data Streams，轻量触发选 Lambda，全文检索与可视化选 OpenSearch——三个目标各按用途对号入座。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文给的三目标分工：要**多下游分发**选 Kinesis Data Streams（多个消费者各取各的）；要**轻量触发一段逻辑**选 Lambda（逐条触发，解析过滤转发一气呵成）；要**全文检索与可视化**选 OpenSearch。三条正解连起来就是这个选项。\n\n**其他选项为什么错：**\n- A：Firehose 是投递管道不是检索工具——正文点名这个位置常与订阅流混淆，选它检索需求落空。\n- B：Lambda 逐条触发做处理，不承担多消费者分发。\n- C：检索平台承担触发逻辑是本末倒置，轻量逻辑就该在函数里。\n\n**关键概念：** 订阅三目标：Kinesis 分发、Lambda 轻处理、OpenSearch 检索；Firehose 是投递管道，别放检索位。","s":"自编·4.1.11"},{"id":"D4-023","d":4,"t":"single","q":"一个排障现场：ALB 后端某服务偶发 502，工程师要用控制台工具在日志里找出现场；同时团队周会要汇报「过去一周每天 502 的趋势」。两种需求交给两位工程师处理，他们要选对各自的工具。\n\n正确的工具选择是？","o":[{"l":"A","t":"找现场用 Logs Insights 写聚合查询，看趋势用模式语法逐行翻——两个工具用反了，效率与结果都不对。"},{"l":"B","t":"两个需求都用模式语法——趋势统计要的是聚合结果，逐行翻日志凑不出可靠的按天趋势。"},{"l":"C","t":"两个需求都用 Logs Insights——找现场要的是原始日志行，聚合查询给不了现场上下文。"},{"l":"D","t":"找现场用模式语法即时搜 502 拿原始行，看趋势用 Logs Insights 写 stats count 按天聚合——一个找行，一个看统计。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文原话：模式语法按行找现场，Insights 统计看趋势——临时排障用模式串直接搜 502 拿原始行；「每天 502 趋势」就写 Insights 查询做 stats count by day。一个是找现场，一个是看趋势，两个工具各就各位。\n\n**其他选项为什么错：**\n- A：两个场景恰好互换，找现场的效率与看趋势的准确性都受损。\n- B：模式语法不做聚合，趋势统计不是它的职责。\n- C：Insights 的聚合输出不带原始行上下文，排障现场要看原始日志。\n\n**关键概念：** 模式语法找现场（按行搜），Logs Insights 看趋势（fields/filter/stats/sort 聚合）；查询按扫描量计费，收窄时间段就是省钱。","s":"自编·4.1.12"},{"id":"D4-024","d":4,"t":"single","q":"一个团队首次使用 Logs Insights 写查询：要统计过去 24 小时 502 的总数并按小时排序展示。团队里有成员建议把时间段放宽到 30 天「一次查个够」，被熟悉计费的老工程师拦下，要求先弄清 Insights 的计费方式再定查询范围。\n\n正确的理解是？","o":[{"l":"A","t":"Insights 按查询次数计费，扫描多少日志无所谓——计费单位搞错了，放宽时间段正是多花钱的做法。"},{"l":"B","t":"Insights 查询按扫描的日志量计费，收窄时间段就是省钱——24 小时的需求就查 24 小时，别放宽白烧钱。"},{"l":"C","t":"Insights 查询免费，放心放大范围——不是免费工具，这个理解会让账单失控。"},{"l":"D","t":"把查询语句存下来可以免除后续扫描费用——存查询只是复用语句，每次执行照样按扫描量计费。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文点名的计费事实：查询按扫描的日志量计费，收窄时间段就是省钱。需求是过去 24 小时，就查 24 小时；放宽到 30 天意味着扫描量放大三十倍，费用跟着放大。这个习惯对高频查询的团队尤其重要。\n\n**其他选项为什么错：**\n- A：计费单位是扫描量不是次数，理解反了。\n- C：Insights 不是免费工具，放大范围的账单代价真实存在。\n- D：保存查询只是复用语句，不免计费。\n\n**关键概念：** Insights 按扫描日志量计费；省钱＝收窄时间段。查询可保存复用与共享，但保存不免计费。","s":"自编·4.1.12"},{"id":"D4-025","d":4,"t":"single","q":"一家金融公司的日志组已关联客户托管 KMS 密钥做静态加密。某天密钥管理员按内部流程临时禁用了这把密钥做审计复核，之后多个依赖该日志组的监控与排障动作全部失败。团队要弄清禁用密钥的连锁后果，并评估是否要调整加密方案。\n\n正确的理解是？","o":[{"l":"A","t":"日志组关联密钥后不能改回无加密状态，密钥一旦禁用整组日志都读不了——禁用动作的直接后果就是日志组不可读写。"},{"l":"B","t":"密钥禁用后日志组自动降级为无加密状态继续工作——加密状态不会自动降级，数据还在密钥之下锁着。"},{"l":"C","t":"可以随时把日志组的密钥关联撤销，改回无加密——关联不可撤销，这条出路不存在。"},{"l":"D","t":"密钥禁用只影响新写入的日志，历史日志不受影响——加解密是整组一体的，禁用期间读写都受影响。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文强调的边角：日志组关联密钥后不可撤销关联，密钥禁用则日志组不可读写——这是考过的后果判断。禁用密钥等于把整组日志锁死，监控排障全部依赖日志的动作跟着失败。密钥管理流程要避开「直接禁用在用密钥」，复核用其他手段。\n\n**其他选项为什么错：**\n- B：不存在自动降级，密钥状态与日志组可用性直接绑定。\n- C：关联不可撤销是机制约束，「改回无加密」这条路没有。\n- D：禁用影响的是整组的加解密能力，不分新旧日志。\n\n**关键概念：** 日志组 KMS：关联不可撤销；密钥禁用＝整组日志不可读写。密钥生命周期管理要与日志组可用性一起规划。","s":"自编·4.1.13"},{"id":"D4-026","d":4,"t":"single","q":"一个团队给日志组配置 KMS 加密后，发现 agent 推送日志持续报授权失败，采集链路处于中断状态。管理员确认密钥策略里已经放行了相关使用者，但日志仍然写不进去。团队要按 KMS 授权的两层结构定位缺口。\n\n正确的排查方向是？","o":[{"l":"A","t":"把密钥策略改成对全账号开放——授权面开得过大，违反最小权限，而且未必能解决 IAM 层缺权的问题。"},{"l":"B","t":"给日志组重新关联一把新密钥——问题在授权不在密钥本身，换钥匙解决不了「没给钥匙持有人授权」。"},{"l":"C","t":"检查 IAM 侧是否给采集角色授予了对应的加解密权限——密钥策略放行使用者只是第一层，IAM 侧再授一层，缺一边就写不进。"},{"l":"D","t":"先撤销日志组的密钥关联排查问题——关联不可撤销，这条路径在机制上就走不通。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文点名的两层授权：密钥策略放行使用者是第一层，IAM 侧再授加解密权限是第二层——缺一边就写不进或读不出。密钥策略已放行而仍然失败，缺口大概率在 IAM 侧：采集角色没有被授予对应的加解密权限。按两层逐层核对即可定位。\n\n**其他选项为什么错：**\n- A：全账号开放是放大爆炸半径的错误修法，还可能掩盖真正的缺口。\n- B：换密钥不改变授权结构，同样两层缺一层照样失败。\n- D：日志组密钥关联不可撤销，排查要沿授权层走而不是拆配置。\n\n**关键概念：** KMS 授权两层：密钥策略 + IAM 权限，两边都要有；日志组密钥关联不可撤销。","s":"自编·4.1.13"},{"id":"D4-027","d":4,"t":"multiple","q":"一个团队在给合规日志定加密方案，合规条款要求：静态加密使用可自管、可审计使用记录的密钥；且方案要经得起密钥生命周期变化的考验。团队要选对密钥类型并理解机制约束。\n\n以下哪些说法正确？（选两项）","o":[{"l":"A","t":"用客户托管 KMS 密钥——密钥策略自己写、只授权采集与审计角色，CloudTrail 里可审计每次加密调用，自管与可审计都满足。"},{"l":"B","t":"用 AWS 托管密钥（aws/logs）就能满足自管要求——托管密钥不自管、策略不可细控，合规条款满足不了。"},{"l":"C","t":"日志组关联密钥后不可撤销，密钥禁用则整组日志不可读写——机制约束要在方案里提前规划。"},{"l":"D","t":"关联后随时可以撤销密钥改回无加密状态——关联不可撤销，这条出路不存在。"},{"l":"E","t":"加密发生在导出时，日志组内可以暂时明文——加密在日志到达落盘时即生效，不存在明文窗口。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** 正文给的判断准则：题干强调「密钥自管、可审计」——客户托管 KMS：策略自己写、授权只给采集与审计角色、调用走 CloudTrail 可查（A）；机制约束上，日志组关联密钥后不可撤销，密钥禁用则整组日志不可读写（C），方案要提前规划密钥生命周期。\n\n**其他选项为什么错：**\n- B：托管密钥不是自管，策略细控与使用审计都不满足条款。\n- D：关联不可撤销是机制约束，「改回无加密」这条路没有。\n- E：加密在日志到达时落盘生效，不存在「组内暂时明文」的阶段。\n\n**关键概念：** 合规要管控→客户托管 KMS；关联不可撤销、禁用即锁死——密钥生命周期要与日志组可用性一起规划。","s":"自编·4.1.13"},{"id":"D4-028","d":4,"t":"single","q":"一个团队的排障习惯是：先在控制台用模式串搜异常行，找到线索后如果要向管理层汇报趋势，再写 Insights 查询出图。新入职的工程师问这两套查询的语法关系，老工程师用一个类比回答了他。\n\n正确的说法是？","o":[{"l":"A","t":"模式语法与 Insights 语法完全相同，学一个即可通吃所有场景——两种语法体系不同，这个说法会让学习路径走偏。"},{"l":"B","t":"Insig
