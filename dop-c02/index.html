KS 使用 Kubernetes 原生机制做滚动更新。"},{"l":"B","t":"Lambda 的版本不可变，别名是可移动的流量指针，「部署即切流」让它最接近金丝雀原生的形态。"},{"l":"C","t":"Lambda 的版本发布后可以原地修改代码，改完别名自动生效。"},{"l":"D","t":"ECS 的部署单位是 AMI 加部署组，与 EC2 完全相同。"},{"l":"E","t":"三类平台的部署机制完全一样，学会一个等于学会三个。"}],"a":["A","B"],"e":"**正确答案：AB。**\n\n**为什么对：** EKS 走 Kubernetes 原生的滚动更新机制（GitOps 工具只是对照，不在服务清单内）；Lambda 版本不可变、别名可移动，「部署即切流」是三平台里最接近金丝雀原生的设计——两条都是正文原话级考点。\n\n**其他选项为什么错：**\n- C：版本不可变是 Lambda 的设计根基，原地改码不成立。\n- D：AMI 加部署组是 EC2 的部署单位，ECS 用的是任务定义。\n- E：平台差异正是本任务的主线，混学必乱。\n\n**关键概念：** EKS 原生滚动更新；Lambda 版本不可变、别名切流。","s":"自编·1.4.1"},{"id":"D1-077","d":1,"t":"single","q":"一家公司的应用把用户会话与上传文件直接存在实例本地磁盘上，团队尝试做蓝绿部署时发现：切到新组后用户会话全部丢失、上传的文件在新组里找不到。团队要在做蓝绿前先解决数据问题。\n\n最优先的动作是？","o":[{"l":"A","t":"先把有状态数据外移——会话与文件放到 EFS 或 S3，让新旧实例共享同一份数据，再做蓝绿切流。"},{"l":"B","t":"把旧组实例的本地磁盘直接挂载给新组实例，共享磁盘数据。"},{"l":"C","t":"要求用户在切流期间暂停操作，避开数据丢失的时间窗口。"},{"l":"D","t":"放弃蓝绿，改为停机发布，停机期间完成数据复制。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 有状态数据越靠外，部署方式越自由——S3 优先于 EFS 优先于 EBS 优先于实例本地盘。「有状态应用做蓝绿前必须先做什么」的正解就是先把有状态数据外移，而不是直接选部署方式。\n\n**其他选项为什么错：**\n- B：本地磁盘不能跨实例挂载，这条路在架构上就不通。\n- C：要求用户暂停操作是业务上不可接受的。\n- D：停机发布牺牲可用性，是为了回避数据问题的倒退。\n\n**关键概念：** 有状态数据外移（S3/EFS）是蓝绿的前置条件，不是可选项。","s":"自编·1.4.2"},{"id":"D1-078","d":1,"t":"single","q":"一个应用把登录会话状态存在实例本地，做金丝雀发布时出现诡异现象：同一用户一会儿登录成功一会儿被踢出——请求落到新实例时找不到会话。团队要选一个存储方案让新旧实例共享会话。\n\n最贴合的存储服务是？","o":[{"l":"A","t":"Amazon EBS——把会话写进块存储卷，随实例迁移。"},{"l":"B","t":"Amazon S3——把会话对象存进对象存储桶，按用户名分前缀。"},{"l":"C","t":"Amazon EFS——共享文件系统，多实例同时挂载，新旧实例读写同一份会话数据。"},{"l":"D","t":"实例本地盘加定时同步脚本，几台机器之间互相复制会话文件。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 会话、文件等有状态数据放 EFS（共享文件系统），多实例同时挂载，新旧实例共享同一份数据——金丝雀与蓝绿的阻力大幅下降，用户无论落到哪台实例都能读到会话。\n\n**其他选项为什么错：**\n- A：EBS 绑单台实例，起不到跨实例共享作用。\n- B：S3 也能存对象，但会话这种高频小读写更适合共享文件系统；考试语境下 EFS 是共享文件的标准答案。\n- D：同步脚本有延迟窗口，正是「一会儿好一会儿坏」的放大器。\n\n**关键概念：** 多实例共享有状态数据＝EFS；S3 适合解耦的静态资源与上传文件。","s":"自编·1.4.2"},{"id":"D1-079","d":1,"t":"single","q":"一家公司的应用把数据库缓存放 local EBS 卷上，数据与实例绑定。团队计划实施不可变部署（从干净镜像起新实例替换旧实例），评估时发现推进阻力很大，需要先识别阻力的真实来源再定方案。\n\n阻力来源最可能是？","o":[{"l":"A","t":"EBS 卷不能加密，不符合安全要求。"},{"l":"B","t":"EBS 绑在单台实例上——实例换掉后卷虽可保留重挂，但新实例要恰好接上旧卷，数据迁移常把不可变部署卡住。"},{"l":"C","t":"EBS 的容量太小，装不下缓存数据。"},{"l":"D","t":"EBS 不支持快照，旧数据无法备份迁移。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** EBS 是块存储、绑在单台实例上：实例换掉时卷可以保留重挂，但前提是新实例恰好接得上旧卷——不可变部署每次都起全新机器，数据迁移正是它被卡住的高频原因。\n\n**其他选项为什么错：**\n- A：EBS 支持加密，这不是事实错误也不是本题阻力。\n- C：容量与部署方式的冲突无关，扩容即可。\n- D：EBS 支持快照，前提不成立。\n\n**关键概念：** EBS 绑单实例——不可变部署的阻力源；数据外移到 EFS/S3 才能解放部署。","s":"自编·1.4.2"},{"id":"D1-080","d":1,"t":"multiple","q":"一个团队在制定「存储与部署」的设计规范，核心是理解数据位置如何约束部署方式。以下几条候选条款需要评审，架构师要求先把正确的定下来。\n\n关于应用存储模式与部署的关系，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"Amazon EFS 是共享文件系统，多实例同时挂载，适合放会话等需要新旧实例共享的数据。"},{"l":"B","t":"EBS 是共享文件系统，天然适合多实例同时读写。"},{"l":"C","t":"有状态数据越靠外（S3 优先于 EFS 优先于 EBS 优先于实例本地盘），部署方式越自由。"},{"l":"D","t":"把数据尽量放进实例本地盘，部署与替换最自由。"},{"l":"E","t":"Amazon EBS 支持多实例同时挂载，会话数据放 EBS 最合适。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** EFS 的共享属性让新旧实例读同一份数据，蓝绿与金丝雀阻力大幅下降；「越靠外越自由」是存储模式约束部署的一句话总结——两条合起来就是设计规范的骨架。\n\n**其他选项为什么错：**\n- B：EBS 是绑单实例的块存储，不是共享文件系统。\n- D：方向完全反了——本地盘是「最不自由」的一端。\n\n- E：EBS 是绑单实例的块存储，不支持多实例同时挂载，恰恰会卡住蓝绿。\n\n**关键概念：** EFS 管共享、S3 管解耦、EBS 绑单机；外移才自由。判断题先问「数据在哪」，再问「部署要动谁」——顺序反了就会先选部署方式再被数据卡住。","s":"自编·1.4.2"},{"id":"D1-081","d":1,"t":"single","q":"一家公司的运维团队遇到怪事：两台 supposedly「同配置」的 EC2 实例，跑同一个应用版本，行为却不一样——一台正常一台报错。逐项比对配置文件才发现，其中一台半年前被人临时改过一个参数后忘了还原。团队要根治这类问题。\n\n根治的方向是？","o":[{"l":"A","t":"接受现状——给两台机器分别建档案，记录各自的差异项。"},{"l":"B","t":"改为不可变部署——从干净基础镜像构建新镜像起新机器替换，每台机器都是镜像的复制品，环境绝对一致。"},{"l":"C","t":"要求工程师修改配置前必须双人复核，杜绝临时改动。"},{"l":"D","t":"写一个每日巡检脚本比对配置差异，发现漂移时发告警。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 「两台同配置机器行为不同」是配置漂移的典型症状，可变部署的宿命就是服务器越养越脏；不可变部署从干净镜像起机器——每台都是复制品，漂移从机制上不存在。\n\n**其他选项为什么错：**\n- A：建档案是承认漂移合法，问题只是被记录下来。\n- C：双人复核降低概率，但半年前的那次改动证明流程迟早被绕过。\n- D：巡检只能「发现」漂移，不能「消灭」漂移，且告警后还是要人处理。\n\n**关键概念：** 配置漂移→不可变部署；镜像复制品保证环境绝对一致。","s":"自编·1.4.3"},{"id":"D1-082","d":1,"t":"single","q":"一家公司受合规审计要求：任何生产环境都必须能证明「当前环境与审批通过的配置完全一致、且可随时复现」。现有环境靠人工维护配置，审计时无法给出可复现的证据。团队要改造部署模式满足审计要求。\n\n最贴合的改造方向是？","o":[{"l":"A","t":"把人工维护的配置整理成文档存档，审计时提交文档作为证据。"},{"l":"B","t":"给生产环境加装操作录屏软件，记录所有人的操作过程。"},{"l":"C","t":"改为不可变部署——从干净基础镜像构建新镜像起新机器替换，环境是镜像的复制品，可复现性由镜像天然保证。"},{"l":"D","t":"要求审计方在环境变更前提前到场目击，现场确认配置。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 题干关键词「保证环境可复现」直指不可变部署：环境是镜像的复制品——镜像通过审批，每台机器就与审批内容完全一致，复现等于用同一个镜像再起一批，证据链天然成立。\n\n**其他选项为什么错：**\n- A：文档描述与实际环境是否一致无法证明，审计要的是机制不是承诺。\n- B：录屏记录的是操作过程，证明不了环境状态一致。\n- D：目击是一次性的，环境后续还会变。\n\n**关键概念：** 「可复现」「配置漂移」「行为不一致」→ 不可变部署。","s":"自编·1.4.3"},{"id":"D1-083","d":1,"t":"single","q":"一个团队的内部工具服务资源紧张：EC2 实例是多年前的低配机型，每次发布只改几行配置。团队讨论要不要全面推行不可变部署——每次发布重建镜像、起新机器，有人算过账，成本翻倍。\n\n对这个场景，正确的判断是？","o":[{"l":"A","t":"不可变部署是唯一正确姿势，成本翻倍也要硬上。"},{"l":"B","t":"把服务整体下线重建，一次性解决所有部署问题。"},{"l":"C","t":"可变部署也有它的位置——发布要快、资源紧张、改动很小，原地升级更快更省，配合配置管理工具控制漂移即可。"},{"l":"D","t":"发布频率降到每年一次，让成本问题自然消失。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 不可变部署的代价是每次发布重建镜像、起机器——慢且费资源；「发布快、资源紧张、改动很小」的场景正是可变部署的位置，配合配置管理控制漂移，不必教条地全盘不可变。\n\n**其他选项为什么错：**\n- A：教条主义，考试语境下可变部署在特定场景有明确价值。\n- B：下线重建与发布方式无关，且中断服务。\n- D：降低频率逃避问题，交付节奏被牺牲。\n\n**关键概念：** 可变快而省但会漂移，不可变一致但贵——按约束选，不搞一刀切。","s":"自编·1.4.3"},{"id":"D1-084","d":1,"t":"single","q":"一个团队刚完成从可变部署到不可变部署的切换，第一次遇到新版本有问题的发布。值班工程师问：现在回滚怎么做？以前可变部署时代是登服务器把旧版本文件复制回来。\n\n不可变部署模式下，正确的回滚动作是？","o":[{"l":"A","t":"登录新实例手动卸载新版本、重装旧版本文件。"},{"l":"B","t":"切回旧镜像——把流量指回旧版本所在的机器或镜像起的新一批实例，回滚即镜像切换。"},{"l":"C","t":"在现有实例上运行一段「撤销脚本」，把配置改回旧状态。"},{"l":"D","t":"等待下一次发布窗口，把修复内容打包进下一个版本。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 不可变部署下每台机器都是镜像的复制品，回滚就是切回旧镜像——流量指回旧版本所在的机器（蓝绿切旧组、Lambda 别名指回旧版本都是这个形态），不碰任何现有实例。\n\n**其他选项为什么错：**\n- A：登机器改文件是可变部署的动作，恰恰是刚被淘汰的模式。\n- C：撤销脚本在漂移过的环境上未必还原干净。\n- D：等待下一次发布意味着错误版本继续在线上跑。\n\n**关键概念：** 不可变部署的回滚＝切回旧镜像，秒级、干净、无需登机器。","s":"自编·1.4.3"},{"id":"D1-085","d":1,"t":"multiple","q":"一个团队刚结束可变与不可变部署的培训，成员把学习笔记整理后要放进团队知识库，供后续项目引用。笔记里有几处表述，架构师要求先把正确的挑出来，防止错误认知扩散。\n\n关于可变与不可变部署，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"可变部署快、省资源，但服务器越养越脏——配置漂移、残留旧依赖、环境不可复现。"},{"l":"B","t":"蓝绿与金丝雀天然偏不可变——新版本先以干净镜像起一批，验证后切流。"},{"l":"C","t":"不可变部署每次发布在现有实例上原地打补丁，速度最快。"},{"l":"D","t":"配置漂移是可变部署可以彻底避免的问题，只要规范够严。"},{"l":"E","t":"不可变部署的回滚要在新实例上手动恢复旧版本文件。"}],"a":["A","B"],"e":"**正确答案：AB。**\n\n**为什么对：** A 是可变部署的标准画像（快、省、但漂移）；B 是两种部署方式与蓝绿金丝雀的关系——新版本以干净镜像起一批再验证切流，天然偏不可变。两条都是正文原话级结论。\n\n**其他选项为什么错：**\n- C：原地打补丁是可变部署的定义，不可变恰恰是不打现有机器。\n- D：漂移是可变部署的机制性产物，规范只能延缓不能根除。\n\n- E：不可变部署的回滚就是切回旧镜像，不存在手动恢复文件的动作。\n\n**关键概念：** 可变=原地升级会漂移；不可变=干净镜像起机器；蓝绿金丝雀偏不可变。","s":"自编·1.4.3"},{"id":"D1-086","d":1,"t":"single","q":"一个平台团队负责三类应用的交付：EC2 传统服务、容器化应用、Lambda 函数。新人问「代码怎么送到目标环境」，架构师回答：代码分发工具跟着平台走，三类平台的链路各不相同。\n\n三类平台各自的代码分发链路是？","o":[{"l":"A","t":"三类平台都由工程师通过 SSH 手工上传代码包，路径最短最直接。"},{"l":"B","t":"EC2 用 CodeDeploy（agent 拉制品）、容器镜像用 ECR 加任务定义更新、Lambda 直接更新版本与别名。"},{"l":"C","t":"EC2 用任务定义更新、容器用 CodeDeploy agent、Lambda 用 EC2 Image Builder 分发。"},{"l":"D","t":"三类平台统一用 EC2 Image Builder 分发，一套工具管所有平台。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 代码分发跟着平台走：EC2 用 CodeDeploy、agent 从 S3 拉制品执行 appspec；容器镜像走 ECR 存储、更新任务定义发布；Lambda 直接更新版本与别名切流——三条链路各成体系。\n\n**其他选项为什么错：**\n- A：SSH 手工上传是可变部署的手工作坊，不在任何托管链路里。\n- C：三个工具与平台的对应关系全部错位。\n- D：Image Builder 只管 AMI 与容器镜像构建分发，不是全平台分发工具。\n\n**关键概念：** 分发工具跟着平台走——EC2 走 CodeDeploy、容器走 ECR+任务定义、Lambda 走版本别名。","s":"自编·1.4.4"},{"id":"D1-087","d":1,"t":"single","q":"一家公司要把每月重建的 AMI 分发到三个区域的镜像列表，供各区域的 Auto Scaling 组引用；目前靠工程师手工复制镜像，经常漏区域。团队在梳理「代码分发工具」清单，要为「AMI 构建与分发」这一环选定工具。\n\n应该选哪个工具？","o":[{"l":"A","t":"AWS CodeDeploy——部署编排服务，负责把 AMI 装到实例上。"},{"l":"B","t":"AWS CodeArtifact——依赖包仓库服务，用仓库缓存 AMI 文件供各区域下载使用。"},{"l":"C","t":"Amazon S3——把 AMI 文件上传到各区域的存储桶，手工登记引用。"},{"l":"D","t":"AWS EC2 Image Builder——构建 AMI 并通过分发配置自动复制到多区域多账号。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** AMI 的构建与分发对应的就是 EC2 Image Builder：定时构建、自动加固测试、分发配置自动复制到指定区域与账号——构建与分发一体，分发配置的自动复制不依赖任何人工同步步骤——这正是它在代码分发工具链里的位置。\n\n**其他选项为什么错：**\n- A：CodeDeploy 管实例上的应用部署，不管镜像构建分发。\n- B：CodeArtifact 管依赖包，与镜像无关。\n- C：手工上传登记没有自动化与验证，正是要被替代的方式。\n\n**关键概念：** AMI 分发＝Image Builder；EC2 应用部署＝CodeDeploy；两条链路别混。","s":"自编·1.4.4"},{"id":"D1-088","d":1,"t":"single","q":"一家公司的部署链路评审会上，架构师要求按「平台—链路—缺哪一环」逐条过：其中一条是「EC2 应用通过 CodeDeploy 部署，制品已上传 S3，appspec 已配置，但部署始终没有开始」。团队要定位这条链路缺了哪一环。\n\n最可能缺的一环是？","o":[{"l":"A","t":"EC2 实例上没有安装或没有启动 CodeDeploy agent——没有代理拉取指令与制品，部署链路从源头就是断的。"},{"l":"B","t":"S3 存储桶没有开启版本控制，导致制品下载失败。"},{"l":"C","t":"appspec 文件缺少注释，CodeDeploy 无法解析格式。"},{"l":"D","t":"部署区域没有启用 CloudWatch，部署事件无处展示。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** EC2 的就地与蓝绿部署靠 CodeDeploy agent 干活——从 CodeDeploy 拉部署指令、执行 appspec 钩子、回报状态；「部署始终没有开始」说明指令没人接，第一嫌疑就是 agent 不在线；链路四要素——CodeDeploy、agent、实例档案角色、appspec——逐个点验，缺哪环补哪环。\n\n**其他选项为什么错：**\n- B：版本控制与下载无关，缺版本控制影响的是回滚不是执行。\n- C：注释不影响 appspec 解析，格式错误才是问题。\n- D：CloudWatch 是观测工具，不参与部署执行。\n\n**关键概念：** EC2 部署链路＝CodeDeploy + agent + 实例档案角色；agent 不在线则部署不开始。","s":"自编·1.4.4"},{"id":"D1-089","d":1,"t":"single","q":"一家公司工具账号的 ECR 存着应用镜像，生产账号部署时拉取镜像报 AccessDeniedException。排查发现：生产账号执行角色的 IAM 拉取权限已经配置，ECR 仓库策略没有放行该角色。团队要理解跨账号访问为什么两边都要配。\n\n正确的理解是？","o":[{"l":"A","t":"跨账号访问要「两条腿」：源仓库的资源策略放行来者的角色，来者的 IAM 策略允许去取（含 ecr:GetAuthorizationToken）——缺一边都是 AccessDeniedException。"},{"l":"B","t":"只要配置了 IAM 拉取权限就足够，仓库策略是可选的高级配置。"},{"l":"C","t":"只要仓库策略放行了就够了，IAM 权限会自动继承。"},{"l":"D","t":"跨账号访问报错时，把两边都改成完全开放的管理员权限最快。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 跨账号制品访问记两条腿：资源策略放行来者、IAM 策略允许去取——ECR 场景里拉取方还要有 ecr:GetAuthorizationToken。两边缺一边都是 AccessDeniedException，这是 ECR 最经典的排障题。\n\n**其他选项为什么错：**\n- B：仓库策略不是可选项，缺它就是题干里的事故现场。\n- C：IAM 权限不跨账号自动继承，信任关系必须显式建立。\n- D：完全开放让爆炸半径失控，违背最小权限，是排查题里的经典错误项。\n\n**关键概念：** 跨账号两条腿——资源策略放行来者 + IAM 策略允许去取，缺一必拒。","s":"自编·1.4.5"},{"id":"D1-090","d":1,"t":"single","q":"一个团队的部署账号要从工具账号的 ECR 拉取镜像，首次尝试报访问被拒。团队先配置了 ECR 仓库策略放行部署角色，再次拉取仍被拒；仓库策略内容反复核对无误，团队继续排查权限链的另一条腿。\n\n接下来应该检查什么？","o":[{"l":"A","t":"ECR 仓库的镜像扫描结果——是否检出高危漏洞导致拉取被拒。"},{"l":"B","t":"部署账号的根用户是否开启了多因素认证。"},{"l":"C","t":"ECR 仓库的生命周期策略是否误删了目标镜像标签。"},{"l":"D","t":"部署账号执行角色的 IAM 权限——是否包含 ecr:GetAuthorizationToken 与对应仓库的拉取动作。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 仓库策略这条腿已经确认通了，另一条腿就是部署角色的 IAM 权限：要有 ecr:GetAuthorizationToken（登录令牌）与对应仓库的拉取动作——两条腿各自独立生效，配通一边不等于另一边自动就绪，缺一边都是 AccessDeniedException。\n\n**其他选项为什么错：**\n- A：镜像扫描是安全检测，不拦截拉取动作。\n- B：根用户 MFA 与角色的服务级授权无关。\n- C：生命周期策略误删会导致「镜像不存在」，报错与「访问被拒」不同。\n\n**关键概念：** 排障口诀——资源策略放行来者，IAM 策略允许去取，两条腿逐条验证。","s":"自编·1.4.5"},{"id":"D1-091","d":1,"t":"single","q":"一家公司的 CodeArtifact 域建在工具账号，另一个业务账号的构建任务要跨账号消费这个域里的依赖包，此前靠导出清单手工同步，两边经常对不上。平台团队要按 CodeArtifact 的权限模型完成配置，既打通跨账号消费，又不放松推送权限。\n\n正确的配置方式是？","o":[{"l":"A","t":"把工具账号的域管理员凭证长期共享给业务账号使用，省去跨账号配置。"},{"l":"B","t":"把域整体复制一份到业务账号，两个账号各自维护，互不关联。"},{"l":"C","t":"用域的资源策略放行业务账号的目标角色；业务账号构建角色只需授权令牌与读包权限——推包权限仍只留给发布流水线。"},{"l":"D","t":"给业务账号构建角色授予域的完全控制权限，读写推送一步到位。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** CodeArtifact 权限挂在域与仓库两级：跨账号消费用域的资源策略放行目标账号角色；消费方角色只需要授权令牌与读包权限——推包权限只给发布流水线，权限边界清晰。\n\n**其他选项为什么错：**\n- A：长期共享凭证是 IAM 红线，跨账号应该用策略与角色。\n- B：复制域会造成两份包源漂移，失去统一管控的意义。\n- D：完全控制让消费方具备了推包能力，爆炸半径失控。\n\n**关键概念：** CodeArtifact 跨账号＝域资源策略放行 + 消费方只读最小权限。","s":"自编·1.4.5"},{"id":"D1-092","d":1,"t":"single","q":"一家公司的依赖包仓库（CodeArtifact）权限审计发现：开发、测试、构建三类角色的推包权限全部开放，任何人都能往仓库发布新版本依赖包，上周刚发生一次误发布。安全团队要求按权限链模型立即整改。\n\n正确的整改方向是？","o":[{"l":"A","t":"推包权限只授予发布流水线的构建角色，开发与测试角色只保留读包权限——谁能推、谁能拉分层管理。"},{"l":"B","t":"保留全员推包权限，但要求每次推送后在工作群同步说明。"},{"l":"C","t":"把推包权限授予团队资历最深的两位工程师，由他们代为推送。"},{"l":"D","t":"关闭整个仓库的写权限，所有依赖包改为本地手工管理。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 权限链三层：谁能推（只给流水线构建角色）、谁能拉（部署与运行时角色）、跨账号怎么放行——推包权收敛到流水线后，人工直推的供应链风险随之消失。\n\n**其他选项为什么错：**\n- B：群同步是知会不是管控，推包风险原样存在。\n- C：把「人人可推」缩成「两人可推」，人工推送通道的风险还在。\n- D：因噎废食，仓库本来就是统一管控的正解。\n\n**关键概念：** 推权只给流水线构建角色；拉取方按需最小化。","s":"自编·1.4.5"},{"id":"D1-093","d":1,"t":"multiple","q":"一个团队在整理跨账号制品访问的排障手册——上个月刚处理过两起 AccessDeniedException 事故，排障耗时都超过半天。以下几条候选条款要写进手册，架构师要求先把正确的定下来。\n\n关于跨账号制品访问的权限配置，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"资源策略配好后，IAM 侧可以完全不用管，权限自动打通。"},{"l":"B","t":"跨账号访问要两边齐：源仓库资源策略放行目标角色，目标角色 IAM 策略允许对应动作。"},{"l":"C","t":"排障时直接给两边配置管理员权限，先跑通再收权。"},{"l":"D","t":"ECR 拉取方的 IAM 还要包含 ecr:GetAuthorizationToken，缺了它同样报访问被拒。"},{"l":"E","t":"跨账号访问只需要在目标账号创建同名的 IAM 角色，即可自动获得权限。"}],"a":["B","D"],"e":"**正确答案：BD。**\n\n**为什么对：** 两条腿缺一必拒：资源策略放行来者、IAM 策略允许去取；ECR 的特殊性在于拉取方还要有 ecr:GetAuthorizationToken——三条一起构成完整的跨账号拉取链。把两条腿背下来，跨账号排障就有固定动线，不用每次从零试错。\n\n**其他选项为什么错：**\n- A：两边缺一边都是 AccessDeniedException，不存在自动打通。\n- C：先开放再收紧的「跑通优先」会让爆炸半径临时失控，且往往忘了收。\n\n- E：同名角色不会自动获得权限，信任与授权必须通过两条腿显式建立。\n\n**关键概念：** 跨账号排障先数两条腿，再查 ECR 特有的令牌权限。","s":"自编·1.4.5"},{"id":"D1-094","d":1,"t":"single","q":"一个团队的部署矩阵覆盖三类平台：EC2 实例、ECS 服务、Lambda 函数，三类平台共一百多个部署目标。运维主管要求给所有部署目标统一安装 CodeDeploy agent，平台工程师指出其中两类平台不需要，主管要求给出理由。\n\n哪两类平台不需要 CodeDeploy agent？原因是什么？","o":[{"l":"A","t":"EC2 与 ECS——两者都由容器运行时自动接管部署编排，无需实例级代理。"},{"l":"B","t":"EC2 与 Lambda——Lambda 的函数代码走对象存储分发。"},{"l":"C","t":"ECS 与 Lambda——平台原生集成部署能力，不需要实例级代理。"},{"l":"D","t":"三类平台都需要——没有 agent 就没有任何部署能力。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** CodeDeploy agent 只装在目标 EC2 实例上，负责拉指令、执行 appspec 钩子、回报状态；ECS 与 Lambda 部署不需要它——平台原生集成，这是常考的分辨点；判断标准就一条——平台是否原生集成部署编排：是则免装，否则要装。\n\n**其他选项为什么错：**\n- A：EC2 恰恰是最需要 agent 的平台，说反了。\n- B：EC2 需要 agent，Lambda 不需要的理由是原生集成而不是存储方式。\n- D：「全部安装」把 agent 当成了万能组件，恰恰考的是分辨。\n\n**关键概念：** agent 只属于 EC2/本地平台；ECS 与 Lambda 原生集成不需要它。","s":"自编·1.4.6"},{"id":"D1-095","d":1,"t":"single","q":"一家公司的 EC2 部署总是卡在「下载制品」阶段超时失败：CodeDeploy 部署事件显示部署未进入任何钩子就中断，agent 日志显示从 S3 拉取 appspec 与制品时被拒绝；老实例部署正常，只有新起的实例出问题。团队按标准排查位顺序定位根因。\n\n第一排查位是？","o":[{"l":"A","t":"S3 存储桶的跨区域复制配置——是否影响下载速度导致超时。"},{"l":"B","t":"EC2 实例的 CPU 型号——是否性能不足拖慢下载。"},{"l":"C","t":"CodeDeploy 服务的计费账单——是否欠费导致服务暂停。"},{"l":"D","t":"实例的实例档案角色（instance profile）——是否带有 s3:Get* 权限，agent 从 S3 拉 appspec 与制品全靠它。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** agent 从 S3 拉 appspec 与制品，靠的是实例档案角色的 s3:Get* 权限——这是「部署卡在下载」的第一排查位；拉取被拒的根因十有八九是角色权限被收窄或缺失；注意权限被拒与下载慢是两类故障，先分清再动手。\n\n**其他选项为什么错：**\n- A：跨区域复制与拉取权限无关，超时是「被拒」不是「慢」。\n- B：性能问题表现为慢，不是访问被拒。\n- C：欠费会影响整个服务而非单点下载，且不是第一排查位。\n\n**关键概念：** 部署卡在下载→先查实例档案角色的 s3:Get*。","s":"自编·1.4.6"},{"id":"D1-096","d":1,"t":"single","q":"一个 Auto Scaling 组里，新起的实例部署总是失败，而组里的老实例部署一切正常。团队对比发现新老实例用的是同一份 appspec、同一个部署组，唯一差异是老实例上线更早。团队按「代际差异」思路定位根因。\n\n最可能的根因是？","o":[{"l":"A","t":"基础镜像或实例档案角色的代际差异——比如基础 AMI 更新时实例档案角色被改小了权限，新实例的 agent 拉不到制品。"},{"l":"B","t":"新老实例的运气差异——重试几次新实例就会恢复正常。"},{"l":"C","t":"CodeDeploy 对新实例有额外的预热期，等待即可。"},{"l":"D","t":"老实例该退役了——把它们全部终止，只留新实例问题自然消失。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文场景原题：新实例出问题、老实例没事，先查基础镜像与角色的「代际差异」——基础 AMI 更新时实例档案角色被改小权限，新实例的 agent 拉制品被拒，补回 s3:Get* 即恢复。\n\n**其他选项为什么错：**\n- B：把机制性故障当归随机故障，重试掩盖不了权限缺失。\n- C：CodeDeploy 没有预热机制，这是臆造概念。\n- D：终止老实例只会让全部实例都部署失败。\n\n**关键概念：** 新实例失败老实例正常→查基础镜像与角色的代际差异。","s":"自编·1.4.6"},{"id":"D1-097","d":1,"t":"multiple","q":"一个团队在制定 CodeDeploy agent 的管理规范，覆盖安装方式、权限前提、状态排查三块——此前 agent 版本混乱和排查无门各吃过一次亏。以下候选条款需要评审，架构师要求先把正确的定下来。\n\n关于 CodeDeploy agent 的管理，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"生产环境推荐把 agent 预装进基础 AMI——版本统一，新实例即开即用。"},{"l":"B","t":"agent 应该由每位工程师登实例手动安装，保证版本随时最新。"},{"l":"C","t":"agent 不在线时实例在 CodeDeploy 里显示状态异常，排查三点：agent 进程、实例档案角色、agent 日志。"},{"l":"D","t":"agent 日志没有排查价值，出问题直接重启实例最快。"},{"l":"E","t":"agent 应该在每次部署失败后重装一次，避免状态残留。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** 安装方式上，生产推荐预装进基础镜像——agent 版本统一、新实例即开即用（也可启动时用户数据脚本安装）；状态排查的三点——进程在不在、实例档案角色对不对、agent 日志报什么——是正文给的标准排查清单。\n\n**其他选项为什么错：**\n- B：手动安装版本不一、覆盖不全，恰恰是规范要消灭的方式。\n- D：agent 日志是拉取细节的第一现场，绕过日志重启等于盲修。\n\n- E：失败后盲目重装掩盖了日志里的第一现场，排查应先看 agent 日志。\n\n**关键概念：** agent 管理三件套——预装进镜像、角色带 s3:Get*、日志先看。","s":"自编·1.4.6"},{"id":"D1-098","d":1,"t":"single","q":"一次 CodeDeploy 部署长时间卡在 BeforeInstall 钩子没有进展，部署事件里没有报出具体错误，值班工程师面对几十行日志一时无从下手，群里已经有人提议直接重跑部署碰运气。团队要在「先看日志定位」的套路下选择第一排查动作。\n\n第一排查动作是？","o":[{"l":"A","t":"直接重新发起一次部署，赌它这次能跑过去。"},{"l":"B","t":"把 BeforeInstall 钩子从 appspec 里删掉，跳过这一步继续部署。"},{"l":"C","t":"重启 CodeDeploy 服务，让部署队列重新排队。"},{"l":"D","t":"查 agent 日志——BeforeInstall 卡住通常是钩子脚本问题或制品下载失败，agent 日志显示制品拉取细节。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 排障套路是先看日志定类：部署事件日志显示失败在哪个钩子，agent 日志显示制品拉取细节——BeforeInstall 卡住对照高频现象就是钩子脚本问题或制品下载失败，日志给出答案。\n\n**其他选项为什么错：**\n- A：重跑只是祈祷，正确答案几乎从不选它。\n- B：删钩子是绕过质量关卡，卡住的原因还在。\n- C：重启服务不解决任何根因。\n\n**关键概念：** 正确答案通常是「先看日志定位失败环节」，不是「直接重跑部署」。","s":"自编·1.4.7"},{"id":"D1-099","d":1,"t":"single","q":"一次蓝绿部署切流后，错误率从 0.1% 跳到 30%，用户投诉开始进群。值班工程师面临两个动作的顺序选择：先查根因再决定切不切流量，还是先把流量切回旧组。团队要固化这个场景的响应顺序。\n\n正确的响应顺序是？","o":[{"l":"A","t":"先把流量切回旧组止血，再查日志定位根因——顺序永远是止血、定位、修复、复盘。"},{"l":"B","t":"先保持切流状态查根因——查清楚再动作，避免盲目回滚掩盖问题。"},{"l":"C","t":"立即终止整个应用的所有实例，彻底阻断错误流量。"},{"l":"D","t":"等 30 分钟观察错误率是否自然回落，再做决定。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 蓝绿切流后 5xx 飙升的处理顺序在正文写得很明确：先回滚再查——回滚争取时间（止血），日志给出根因（定位），然后才是修复与复盘。30% 错误率下每一分钟都在放大影响面。\n\n**其他选项为什么错：**\n- B：带着 30% 错误率查根因，用户的代价在持续放大。\n- C：全量终止比回滚破坏性更大，止血手段要用最小代价的那个。\n- D：错误率飙升不是会自愈的抖动，等待是失职。\n\n**关键概念：** 止血、定位、修复、复盘——顺序不能乱；回滚先于排查。","s":"自编·1.4.7"},{"id":"D1-100","d":1,"t":"single","q":"一个 ECS 服务的部署流程执行完毕，但新版本任务反复启动失败、旧版本任务还在支撑流量。部署日志显示任务定义更新成功、服务调度正常。团队按故障三分类定位根因。\n\n最可能的根因类别与具体原因是？","o":[{"l":"A","t":"权限类——服务角色缺少拉取镜像的 IAM 权限。"},{"l":"B","t":"代理类——容器实例上的 CodeDeploy agent 掉线。"},{"l":"C","t":"资源类——任务定义引用的镜像标签不存在，或服务配额不够，新任务起不来。"},{"l":"D","t":"网络类——负载均衡器的健康检查端口与容器端口不一致导致全部替换失败。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 「ECS 部署后新任务起不来」对照高频现象：任务定义引用的镜像标签不存在，或服务配额不够——部署完成但服务起不来正是资源类的典型形态。\n\n**其他选项为什么错：**\n- A：镜像拉取权限被拒会在事件里明确报 AccessDenied，题干没给。\n- B：ECS 部署不需要 CodeDeploy agent，类别本身就不成立。\n- D：健康检查不一致的报错形态是任务反复被摘除，与「启动失败」不同。\n\n**关键概念：** 故障三分类——权限、代理/集成、资源；「部署完成但服务起不来」先查资源类。","s":"自编·1.4.7"},{"id":"D1-101","d":1,"t":"single","q":"一个团队更新了 Lambda 函数并发布新版本，部署流水线所有步骤执行成功，但切流后发现：别名承载的全部流量仍然执行旧版本逻辑，新版本一次都没被调用。团队按高频现象对号入座。\n\n最可能的原因是？","o":[{"l":"A","t":"新版本发布失败被自动回滚，旧版本接管了全部流量。"},{"l":"B","t":"Lambda 函数的并发配额不足，新版本无法承接流量。"},{"l":"C","t":"函数代码里残留了旧版本的调试开关，导致逻辑回退。"},{"l":"D","t":"别名没有指向新版本，或流量路由配置没有生效——Lambda 的流量由别名指针决定。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 「Lambda 更新后别名流量还在旧版本」对照高频现象：别名没指向新版本，或流量路由配置没生效——Lambda 的流量由别名指针决定，流水线「步骤成功」不代表指针真的移过去了。\n\n**其他选项为什么错：**\n- A：被回滚会在部署事件里有明确记录，与「步骤全部成功」矛盾。\n- B：并发不足表现为节流与错误，不是「流量全在旧版本」。\n- C：代码内容问题会让新版本行为异常，但题干现象是新版本根本没被调用。\n\n**关键概念：** Lambda 切流的本质是移动别名指针——流量不对先查指针与路由配置。","s":"自编·1.4.7"},{"id":"D1-102","d":1,"t":"multiple","q":"一个团队在编写部署排障速查表，把高频故障按三大类归纳，让值班工程师拿到现象就能对号入座。以下几条归纳要进速查表，架构师要求先把正确的定下来。\n\n关于部署故障三分类，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"权限类的报错关键词是 AccessDenied、UnauthorizedOperation——跨账号被拒、实例角色缺权限、KMS 解密失败都算。"},{"l":"B","t":"资源类的现象是部署完成但服务起不来——端口占用、内存不够、安全组没放开、部署组容量不足都算。"},{"l":"C","t":"代理/集成类的现象是部署完成且服务已启动，只是性能不达标。"},{"l":"D","t":"三类故障必须由三个不同的团队分别处理，不能合并排查。"},{"l":"E","t":"集成类的典型现象是部署完成后服务响应缓慢，属于性能问题。"}],"a":["A","B"],"e":"**正确答案：AB。**\n\n**为什么对：** 三大类的标准画像：权限类看 AccessDenied 系关键词；代理/集成类是「部署没开始就停或卡在某钩子」；资源类是「部署完成但服务起不来」——A、B 正是权限类与资源类的准确归纳。\n\n**其他选项为什么错：**\n- C：性能不达标不是代理类的现象，代理类是「没跑起来或卡住」。\n- D：三分类的目的就是让同一批人按类对号入座，不是分而治之。\n\n- E：响应缓慢是性能问题，不属于三大类；集成类的现象是没开始就停或卡在某钩子。\n\n**关键概念：** 权限（AccessDenied）/ 集成（卡住不开始）/ 资源（完成但起不来）——现象对号入座。","s":"自编·1.4.7"},{"id":"D1-103","d":1,"t":"single","q":"一个团队的 Lambda API 要发布一次计费逻辑改动，风险评估为高：计费错误直接影响收入，且客户对账敏感。业务方要求小步放量观察真实流量、出问题自动回滚，影响面可控在最小比例。\n\n最贴合的部署配置是？","o":[{"l":"A","t":"AllAtOnce 一次性切换，发布后靠人工盯告警处理异常。"},{"l":"B","t":"Canary10Percent10Minutes——先让 10% 真实流量跑 10 分钟，异常触发时 CodeDeploy 自动把别名指回旧版本，影响面 10%。"},{"l":"C","t":"改用 EC2 蓝绿部署，在负载均衡器上一次性整体切换。"},{"l":"D","t":"Linear10PercentEvery1Minute 均匀爬坡到 100%，全程不停留观察。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 高风险改动要「小步放量 + 自动回滚 + 最小影响面」：Canary 先让 10% 真实流量集中观察，异常时 CodeDeploy 自动把别名指回旧版本——放量粒度就是风险敞口，10% 意味着最坏情况只影响 10% 用户。\n\n**其他选项为什么错：**\n- A：AllAtOnce 影响面 100%，人工盯守不满足「自动回滚」。\n- C：EC2 蓝绿与 Lambda 平台不匹配，且整体切换没有小流量窗口。\n- D：Linear 是均匀爬坡，没有「先小流量集中观察」的语义。\n\n**关键概念：** 放量粒度＝风险敞口；高风险改动选 Canary 起步。","s":"自编·1.4.8"},{"id":"D1-104","d":1,"t":"single","q":"一个容器应用运行在 ECS 上，业务方对发布的平稳性要求很高：希望新版本先在独立通道上验证，确认无误后生产流量才切过去——生产流量在验证期间完全不受影响。团队要选择部署方案。\n\n最贴合的方案是？","o":[{"l":"A","t":"ECS 服务默认滚动更新——新任务逐个替换旧任务，验证与切流同时发生。"},{"l":"B","t":"Lambda 金丝雀部署——按比例放量真实流量验证新版本。"},{"l":"C","t":"ECS 蓝绿部署（CodeDeploy 管两个 TaskSet）——用测试监听器先行验证新 TaskSet，确认后生产监听器再切流，生产流量验证期间不受影响。"},{"l":"D","t":"EC2 蓝绿部署——起一套 EC2 新组承接验证流量。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** ECS 蓝绿的核心优势正是「生产流量未动时先验证」：CodeDeploy 管两个 TaskSet，生产监听器与测试监听器分开——测试监听器先行验证新 TaskSet，确认后生产监听器才切流。\n\n**其他选项为什么错：**\n- A：滚动更新的验证对象就是生产流量，没有独立验证通道。\n- B：Lambda 金丝雀放的就是真实生产流量，与「生产流量不受影响」矛盾。\n- D：平台错配——容器应用在 ECS，绕道 EC2 蓝绿毫无必要。\n\n**关键概念：** 「生产流量前验证」→ ECS 蓝绿加测试监听器先行。","s":"自编·1.4.8"},{"id":"D1-105","d":1,"t":"single","q":"一家公司的经典三层应用跑在 EC2 上，业务方要求发布时整体切换：新旧两套环境都完整可用，切换在负载均衡器上一次完成，出问题切回旧组，全程不逐台替换。团队按平台原子能力选部署方式。\n\n最贴合的方式是？","o":[{"l":"A","t":"EC2 蓝绿部署（CodeDeploy）——起新 Auto Scaling 组，负载均衡器整体切流，异常时切回旧组。"},{"l":"B","t":"EC2 就地更新——部署组内逐台替换应用版本，逐步完成切换。"},{"l":"C","t":"Lambda 别名路由——按百分比逐步把流量导到新版本。"},{"l":"D","t":"ECS 蓝绿部署——用两个 TaskSet 承接新旧版本。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** EC2 蓝绿的形态就是「起新 Auto Scaling 组 + 负载均衡器切流」——新旧两套环境并存、整体一次切换、异常切回旧组，与业务方「整体切换」的要求逐条对应；「整体切换」的关键词一出现，蓝绿就是默认候选，就地更新直接出局。\n\n**其他选项为什么错：**\n- B：就地更新是逐台替换，不是整体切换，且回滚不如切组干脆。\n- C：Lambda 别名路由属于 Lambda 平台，三层应用在 EC2 上。\n- D：ECS TaskSet 面向容器工作负载，与 EC2 应用不匹配。\n\n**关键概念：** EC2 蓝绿＝新组 + 负载均衡切流；就地更新＝逐台替换。","s":"自编·1.4.8"},{"id":"D1-106","d":1,"t":"multiple","q":"一个团队在整理三类平台部署方式的对比表（EC2 蓝绿、ECS 蓝绿、Lambda 金丝雀），结论要写进交付手册供全员引用。以下几条对比结论，架构师要求先核对正误再收录。\n\n关于三类平台部署方式的差异，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"三者的回滚速度完全相同，都是分钟级人工操作。"},{"l":"B","t":"回滚形态不同：EC2 切回旧组、ECS 部署上一个 TaskSet、Lambda 把别名指回旧版本（秒级）。"},{"l":"C","t":"Lambda 金丝雀的验证流量不是真实流量，只是模拟请求。"},{"l":"D","t":"验证位置不同：EC2 切流后才开始验证、ECS 可用测试监听器先行、Lambda 用真实流量按比例验证。"},{"l":"E","t":"三类平台的切流粒度完全相同，都是按实例批量切换。"}],"a":["B","D"],"e":"**正确答案：BD。**\n\n**为什么对：** 对比表的两个核心维度就是回滚与验证位置：回滚分别是切旧组、回退 TaskSet、别名指回旧版本（秒级）；验证位置分别是切流后、测试监听器先行、真实流量按比例——A、B 正是表格里的原文。\n\n**其他选项为什么错：**\n- A：回滚速度差异明显——Lambda 别名指回是秒级，不存在「完全相同」。\n- C：Lambda 金丝雀放的就是真实生产流量按比例，这正是它的价值。\n\n- E：切流粒度差异明显——EC2 按实例批量、ECS 监听器整体切、Lambda 1% 起步按比例。\n\n**关键概念：** 三平台对比抓两维——回滚形态与验证位置；Lambda 回滚秒级、验证用真实流量。","s":"自编·1.4.8"},{"id":"D2-002","d":2,"t":"single","q":"一家创业公司的产品是一个纯无服务器应用：几个 Lambda 函数加一个 API 网关加事件源触发。团队只有两名工程师，都不想写基础设施代码，希望用最精简的语法把这套东西描述出来并快速部署。团队正在选 IaC 工具，硬性要求是「无服务器场景下起步最快」。\n\n最贴合的工具是？","o":[{"l":"A","t":"AWS CDK——用编程语言定义基础设施，抽象与复用能力最强，适合长期工程化演进。"},{"l":"B","t":"AWS SAM——CloudFormation 的无服务器扩展，精简语法描述 Lambda、API 网关与事件源，部署时转成完整模板。"},{"l":"C","t":"AWS CloudFormation——直接手写完整 YAML 模板，资源定义最全面、表达最精细。"},{"l":"D","t":"Terraform——社区生态成熟，多云管理能力强，团队上手快。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 选型判断三问的第一问就是「是不是纯无服务器」——Lambda 加 API 网关加事件源正是 SAM 的目标形态。SAM 的精简语法让这类应用用最少的模板行完成定义，部署时自动转成完整 CloudFormation，起步最快。\n\n**其他选项为什么错：**\n- A：CDK 要求团队会写编程语言，抽象能力强但不是「起步最快」，对一个两人文侣的无服务器小应用过重。\n- C：手写完整 CloudFormation YAML 资源定义繁琐，与「精简语法、快速部署」相悖。\n- D：Terraform 不是 AWS 原生工具，考试问 AWS 原生方案时不会是它。\n\n**关键概念：** 纯无服务器选 SAM；团队会写代码要强抽象选 CDK；运维为主、重可读性选 CloudFormation 直写。","s":"自编·2.1.1"},{"id":"D2-003","d":2,"t":"single","q":"一个平台团队要给全公司沉淀基础设施代码库：几十个模块要参数化复用，还要用循环批量生成资源、用函数封装校验逻辑。成员都是熟悉 TypeScript 的工程师，希望在编码时获得 IDE 提示与类型检查。\n\n最贴合的工具是？","o":[{"l":"A","t":"AWS SAM——精简语法专注无服务器形态，提供不了通用编程语言的表达能力。"},{"l":"B","t":"AWS CloudFormation——手写 YAML 模板，模板间靠复制粘贴维持一致。"},{"l":"C","t":"AWS CDK——用 TypeScript 等编程语言写基础设施，循环、函数、抽象做复用，合成为 CloudFormation 模板再部署。"},{"l":"D","t":"AWS Service Catalog——把核准模板做成产品目录供申请，是分发机制不是编写工具。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 题干三个信号——参数化复用、循环与函数抽象、工程师写代码——全部指向 CDK。CDK 用通用编程语言写基础设施，能用代码的循环批量生成资源、用函数封装校验，还能享受 IDE 提示与类型检查，合成为 CloudFormation 模板再部署。\n\n**其他选项为什么错：**\n- A：SAM 是 CloudFormation 的无服务器扩展，语法再精简也不支持通用编程语言的表达能力。\n- B：YAML 做不了循环与函数抽象，几十个模块靠复制粘贴维持一致正是要消灭的模式。\n- D：Service Catalog 是「分发核准模板」的目录机制，不解决「怎么写」的问题。\n\n**关键概念：** 会写代码、要抽象复用选 CDK；CDK 的产物仍是 CloudFormation 模板。","s":"自编·2.1.1"},{"id":"D2-004","d":2,"t":"single","q":"一家公司的架构评审会上，两位工程师分别主张用 AWS CDK 和 AWS SAM 管理各自团队的基础设施。CTO 问了一个问题：不管选哪个工具，最终真正执行资源创建与更新的引擎是哪一个——这决定了审计与排障时该看哪一层的产物。\n\n正确回答是？","o":[{"l":"A","t":"AWS CDK 的合成器——它负责把代码转成模板，是部署流程的中间一步，不是终点。"},{"l":"B","t":"AWS SAM CLI——本地调试与打包用它，线上部署不由它执行，仍要落到 CloudFormation。"},{"l":"C","t":"AWS CloudFormation——CDK 合成、SAM 转换，最终都落到 CloudFormation 模板，由它执行部署，变更历史与栈事件都在这一层。"},{"l":"D","t":"AWS Systems Manager——负责实例层面的配置管理，不承担模板部署，与模板执行无关。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文的原话是「部署都经 CloudFormation 引擎」——CDK 合成出 CloudFormation 模板，SAM 转换成完整 CloudFormation 模板，两者只是「写模板的方式」不同，执行引擎是同一个。所以审计看变更历史、排障看栈事件，都落在 CloudFormation 这一层。\n\n**其他选项为什么错：**\n- A：合成器只负责代码转模板，转完之后部署是 CloudFormation 的事，它不是终点。\n- B：SAM CLI 管本地调试与打包，线上部署走 CloudFormation。\n- D：Systems Manager 管实例配置（补丁、状态、远程执行），与模板部署无关。\n\n**关键概念：** CloudFormation 是 AWS 原生 IaC 的底座，其余工具最终都落到它。","s":"自编·2.1.1"},{"id":"D2-005","d":2,"t":"single","q":"一家金融机构的合规团队提出硬要求：所有基础设施定义必须可以直接逐行审查，审查人员要能读到每个资源的完整定义，不能经过任何代码生成环节。团队工程师偏好 CDK，合规团队坚持可读性优先，双方要找一条都接受的路线。\n\n最贴合的选择是？","o":[{"l":"A","t":"继续用 CDK 部署，把合成的模板存档给合规团队备查即可。"},{"l":"B","t":"改用 SAM 编写，精简语法模板更短，审查起来也更轻松。"},{"l":"C","t":"用控制台手工搭建资源，控制台里每项配置都看得见摸得着。"},{"l":"D","t":"直接用 CloudFormation YAML 编写——声明式模板逐行可读，没有代码生成环节。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 合规要求「逐行可读 + 无代码生成环节」，这两条只有直写 CloudFormation YAML 同时满足。声明式模板描述「要什么」，每个资源的定义直接躺在模板里，审查人员不需要理解任何生成逻辑。\n\n**其他选项为什么错：**\n- A：正文明确提示「CDK 合成的模板可读性差，重审计的场景要权衡」——事后存档不改变产物是生成出来的这一事实。\n- B：SAM 语法精简但仍是转换链路，且只覆盖无服务器形态。\n- C：控制台手工搭建没有版本化的定义文件，恰恰是 IaC 要消灭的做法，也谈不上可审查的「定义」。\n\n**关键概念：** 选型三问之一是「要不要最终可读性」——重审计场景直写 CloudFormation，放弃 CDK 的抽象便利。","s":"自编·2.1.1"},{"id":"D2-006","d":2,"t":"single","q":"一家公司刚把生产基础设施纳入 IaC 管理，团队约定模板统一进 Git，改动必须走 PR 评审，合并后由流水线执行部署。有成员提出：线上有一个小改动很急，本地直接执行部署最快，何必走完整流程。\n\n按 IaC 变更管理原则，正确的处置是？","o":[{"l":"A","t":"同意本地执行——改动小、风险低，事后有空再补 PR 即可。"},{"l":"B","t":"在控制台手工改线上资源——控制台改动实时生效，不用等流水线跑完。"},{"l":"C","t":"拒绝绕行——改动走 PR 评审、合并触发流水线，生产部署前过变更审批；手工绕行就是漂移的源头。"},{"l":"D","t":"让另一名工程师在控制台改，由他个人对这次变更承担责任。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文给的标准链路是「模板进 Git、改动走 PR、合并触发流水线执行部署，生产栈的部署要过变更审批」。急不急不改变流程——本地直接执行或控制台手改都会造成线上状态脱离模板管理，这正是漂移的源头。\n\n**其他选项为什么错：**\n- A：「事后补 PR」意味着线上先出现了未经模板的变更，流程已经破了口子。\n- B：控制台手改是漂移最典型的来源，与 IaC 管理目标直接冲突。\n- D：换个人手改不改变「绕过模板」的性质，责任归属也不是流程问题。\n\n**关键概念：** IaC 的变更管理与代码同轨；禁止本地手工改线上资源。","s":"自编·2.1.2"},{"id":"D2-007","d":2,"t":"single","q":"排查一次生产事故时发现：有人上周为救急在控制台把安全组的入站端口改宽了，但这个改动没有写回模板，线上状态与模板定义已经不一致。团队要按 IaC 的变更管理原则处置这份手工改动。\n\n正确的处置是？","o":[{"l":"A","t":"保留手工改动，把模板里的安全组规则标注为「与线上一致」了事。"},{"l":"B","t":"手工改动先留着不动，等下一次大版本更新时再一并处理。"},{"l":"C","t":"把安全组从模板里移除，改成完全手工管理，避免两边对不上。"},{"l":"D","t":"把改动写回模板，走 PR 评审与流水线重新部署，让线上回到模板管理之下。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 漂移的正道处置就是把改动写回模板——写回之后线上状态重新受模板管理，后续部署不会再因状态不一致出意外。走 PR 与流水线也保证这次改动经过评审，而不是把「救急的手工改动」原样固化。\n\n**其他选项为什么错：**\n- A：只改标注不改定义，模板与真实状态的差异依然存在，下次更新照样踩。\n- B：拖着不处理，漂移期间任何一次按模板的更新都可能触发意外替换。\n- C：把资源移出模板管理是倒退——安全组恰恰是最需要留痕与评审的对象。\n\n**关键概念：** 漂移修复两条路：把改动写回模板（正道），或删掉手工改动恢复模板定义。","s":"自编·2.1.2"},{"id":"D2-008","d":2,"t":"single","q":"一个团队听闻 CloudFormation 提供漂移检测功能，运维主管在周会上提出三个期待：发现手工改动、自动恢复配置、从此不用做变更审批。团队需要先弄清漂移检测的真实能力边界，再决定怎么把它写进流程。\n\n对漂移检测能力边界的准确描述是？","o":[{"l":"A","t":"能发现「当前状态与模板状态」的差异，但发现不等于修复——修复要么写回模板，要么删掉手工改动。"},{"l":"B","t":"会定期自动把线上资源恢复成模板定义，全程无需人工介入。"},{"l":"C","t":"启用之后，控制台上的手工改动会被引擎直接拒绝执行。"},{"l":"D","t":"可以替代变更审批环节，检测无差异的部署自动放行。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 漂移检测回答的是「线上状态与模板定义哪里不一样」，它是一个检测工具。正文明确说「发现不等于修复」——修复要么把改动写回模板（正道），要么删掉手工改动恢复模板定义，两件事都要人来做。\n\n**其他选项为什么错：**\n- B：漂移检测不做自动恢复，把「发现」当成「修复」是题干三个期待里最危险的误解。\n- C：它不拦截控制台操作——手工改动照样发生，只是事后能被查出来。\n- D：变更审批是流程控制，漂移检测是状态比对，两者管的事不同，不能互相替代。\n\n**关键概念：** 漂移检测＝发现差异；修复＝写回模板或删除手工改动，均需人工决策。","s":"自编·2.1.2"},{"id":"D2-009","d":2,"t":"single","q":"一个团队要更新生产环境的 CloudFormation 栈，这次改动同时涉及网络与计算两类资源。团队担心更新过程中某些资源被替换导致数据丢失，希望在真正执行之前先看清楚这次更新到底会改什么、删什么。\n\n最贴合的动作是？","o":[{"l":"A","t":"先创建变更集，预览这次更新会修改、替换或删除哪些资源，确认无害再执行。"},{"l":"B","t":"先跑一次漂移检测，对比线上状态与模板定义的差异再更新。"},{"l":"C","t":"给整个栈开启删除保护后直接更新，让引擎自行判断资源去留。"},{"l":"D","t":"把当前栈导出成模板快照，更新完成后人工对比两份模板。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 变更集（change set）就是为这个场景设计的：部署前预览「这次会改什么、删什么」，正文强调「生产栈必用」。团队担心的「替换导致数据丢失」恰恰能在变更集里提前看到——看到「替换」字样就停手核查。\n\n**其他选项为什么错：**\n- B：漂移检测比的是「线上现状与旧模板」的差异，回答不了「这次更新会带来什么」。\n- C：删除保护防的是整个栈被删，拦不住更新过程中的资源替换。\n- D：更新完再对比是事后诸葛亮，资源已经按引擎的决定动过了。\n\n**关键概念：** 变更集很便宜，救的是整库——生产栈更新前先出变更集。","s":"自编·2.1.2"},{"id":"D2-010","d":2,"t":"single","q":"一家公司的安全审计发现：两百多台 EC2 实例的补丁水平参差不齐，有的半年没打过补丁。安全团队要求把补丁工作制度化：每周固定窗口批量打补丁、打完出合规报告，全程不能依赖工程师手动登录实例操作。\n\n最贴合的服务是？","o":[{"l":"A","t":"AWS Config——记录资源配置历史并按规则评估合规，但只评估不动手。"},{"l":"B","t":"AWS AppConfig——灰度下发应用参数与功能开关，管不到操作系统补丁。"},{"l":"C","t":"AWS OpsWorks——Chef/Puppet 托管形态，可以安排补丁作业与报告。"},{"l":"D","t":"AWS Systems Manager Patch Manager——按补丁基线与维护窗口批量打补丁，并输出合规结果。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 题干的三个要素——固定窗口、批量执行、出合规报告——正好是 Patch Manager 的能力组合：先定义补丁基线，再绑维护窗口，到点自动对实例队列打补丁，合规结果直接可查。全程不需要登录任何一台实例。\n\n**其他选项为什么错：**\n- A：Config 是审计主力，能告诉你「哪些实例补丁不合规」，但它只评估、不执行打补丁。\n- B：AppConfig 管应用层参数下发，操作系统补丁不在它的对象范围里。\n- C：OpsWorks 已停止向新客户开放，考试出现时正解倾向 SSM 替代。\n\n**关键概念：** 「实例要统一打补丁」对应 SSM Patch Manager；先问「管什么对象」，再对服务。","s":"自编·2.1.3"},{"id":"D2-011","d":2,"t":"single","q":"一家公司的合规部门提出两个要求：一是生产账号里每个安全组、每个存储桶的配置变更都要留下历史记录，随时可回溯「谁在什么时候改成了什么」；二是要按内部基线自动评估违规并触发告警。\n\n最贴合的服务是？","o":[{"l":"A","t":"AWS Systems Manager State Manager——把实例配置拉到期望状态，不做全量配置历史记录。"},{"l":"B","t":"AWS AppConfig——面向应用参数的校验与灰度下发，与资源合规无关。"},{"l":"C","t":"AWS Config——记录资源配置历史，按规则评估合规并触发告警，是审计主力。"},{"l":"D","t":"AWS CloudFormation——管理资源的创建与更新，不负责持续的合规评估。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 两个要求正好对应 Config 的两大能力：资源配置历史（记录每个资源的配置变化，可回溯）与规则评估（按基线规则自动判定违规并告警）。正文对 Config 的定位就是「管资源合规、审计主力」。\n\n**其他选项为什么错：**\n- A：State Manager 的对象是实例配置的期望状态，不记录安全组、存储桶这类资源的历史。\n- B：AppConfig 管应用层参数，题干问的是云资源。\n- D：CloudFormation 管部署，部署完之后持续评估合规不是它的事。\n\n**关键概念：** 「资源要留配置历史并告警」对应 Config 规则；四个带「配置」的服务先问管什么对象。","s":"自编·2.1.3"},{"id":"D2-012","d":2,"t":"single","q":"一个产品团队在推新功能：想按 5%、20%、100% 三档逐步放量，配置值在下发前要先过一轮语法与取值校验，避免一个错误参数打挂全部用户。还有一个硬要求：改配置不能触发重新部署。团队想用托管服务把发布流程标准化，而不是靠人手工盯放量节奏。\n\n最贴合的服务是？","o":[{"l":"A","t":"AWS AppConfig——带校验与灰度发布地下发功能开关与参数，应用层配置变更无需重新部署。"},{"l":"B","t":"AWS Systems Manager Parameter Store——存取参数没问题，但没有原生灰度放量与发布校验。"},{"l":"C","t":"AWS Config——评估资源配置合规，与应用参数的下发节奏无关。"},{"l":"D","t":"重新打包部署 Lambda——每次改配置就发一版，直接违反「改配置不发版」的硬要求。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 题干四个要素——分档放量、下发前校验、防止错误参数、不发版——正是 AppConfig 的标准画像：配置下发带校验器，灰度策略按比例放行，应用读取新配置即生效，全程不动部署。\n\n**其他选项为什么错：**\n- B：Parameter Store 解决「参数存在哪、怎么取」，灰度放量与发布校验不是它的职责。\n- C：Config 的对象是云资源配置合规，跟应用参数没关系。\n- D：把配置变更绑到部署上，既是题干明令禁止的，也把风险放大到每次发版。\n\n**关键概念：** 「应用参数要灰度下发」对应 AppConfig；应用层配置变更不用重新部署。","s":"自编·2.1.3"},{"id":"D2-013","d":2,"t":"multiple","q":"一个团队列出了三个待解问题：实例补丁不齐、生产安全组被手工改过却没人发现、应用参数每次改动都要重新发版。会上有人主张「选一个服务全包」，架构师要求按各服务的分工拆解方案，先把「管什么对象」分清楚。\n\n关于三个问题的服务选型，正确的两项是？（请选择两项）","o":[{"l":"A","t":"三个问题用 OpsWorks 一个服务统一解决，它是专门的配置管理平台。"},{"l":"B","t":"三个问题都靠更新 CloudFormation 模板解决，模板管住一切配置，不需要其他服务参与。"},{"l":"C","t":"实例补丁按基线在统一窗口批量执行并输出合规报告，交给 Systems Manager Patch Manager。"},{"l":"D","t":"安全组变更留痕并按基线规则评估告警，交给 Config 规则，违规可回溯。"},{"l":"E","t":"应用参数带校验灰度下发并按比例放量，交给 Systems Manager State Manager 执行。"}],"a":["C","D"],"e":"**正确答案：CD。**\n\n**为什么对：** 三件事三个服务、各管一层是正文给的选型落地：补丁对实例（SSM Patch Manager）、资源合规对 Config、应用参数对 AppConfig（本题主线是拆「谁管什么」，前两问在选项里给出正确归属）。\n\n**其他选项为什么错：**\n- A：OpsWorks 已停止向新客户开放，且一个服务包不了三类不同对象的配置管理。\n- B：CloudFormation 管资源部署，应用参数灰度与补丁执行不在它的能力内。\n- E：State Manager 管实例配置的期望状态，应用参数灰度下发是 AppConfig 的活，服务对错了象。\n\n**关键概念：** 四个服务答的是四件不同的事——先问「管什么对象」，再对服务；复合场景常是多个服务连线。","s":"自编·2.1.3"},{"id":"D2-014","d":2,"t":"single","q":"一个团队更新生产库所在的 CloudFormation 栈时，变更集显示其中一项改动会「替换数据库实例」。有人主张变更集都生成好了，直接执行最快；但库里是订单主库，停机与数据风险都没有评估过。有人在群里催直接执行，值班负责人要先弄清风险再作决定。\n\n正确的处置是？","o":[{"l":"A","t":"直接执行——变更集已经预览过，引擎算出的执行计划不会有错。"},{"l":"B","t":"给整个栈开启删除保护后执行——删除保护会自动拦下资源替换。"},{"l":"C","t":"先弄清为什么触发替换——替换等于删除重建、数据会丢；必要时给关键资源加栈策略阻止替换，再定执行方式。"},{"l":"D","t":"跳过变更集直接更新——变更集只是给审计留档，不影响实际执行结果。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文原话：「替换等于删除重建，数据就没了」。变更集的价值就是让团队在执行前看到「替换」两个字并停手——查清触发替换的属性改动，能改成就地更新就改；改不了就给数据库资源加栈策略，禁止更新与替换，再另想迁移方案。\n\n**其他选项为什么错：**\n- A：变更集预览的意义就是发现问题后不执行，看到替换还硬上等于白看。\n- B：删除保护防的是整个栈被删除，拦不住更新过程中的资源替换。\n- D：跳过变更集连「会替换」都不会知道，方向完全反了。\n\n**关键概念：** 变更集提前拦下替换；栈策略保护关键资源不被意外更新。","s":"自编·2.1.4"},{"id":"D2-015","d":2,"t":"single","q":"一次例行清理中，一名新同事误把生产环境的 CloudFormation 栈当成废弃测试栈发起了删除，幸好值班工程师手快点了取消。团队要给生产栈加一层「防误删整栈」的保护，要求这层保护由平台统一配置、不依赖人的注意力。\n\n最贴合的机制是？","o":[{"l":"A","t":"给生产栈开启删除保护（termination protection），删除请求会被直接拒绝。"},{"l":"B","t":"给生产栈配置栈策略（stack policy），声明数据库资源禁止更新与替换。"},{"l":"C","t":"每次更新前强制创建变更集，看清差异后再决定是否执行。"},{"l":"D","t":"把栈模板定期备份到 S3，误删发生后按模板重建整栈。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 删除保护（termination protection）就是「防误删整栈」的专用开关：开启后任何删除栈的请求直接被拒绝，不需要谁在现场盯梢，完全符合「平台统一配置、不依赖人的注意力」的要求。\n\n**其他选项为什么错：**\n- B：栈策略管的是「更新时哪些资源不许动」，防更新不防删栈，管错了对象。\n- C：变更集防的是「改坏」，防不了「删掉」，两者的风险面不同。\n- D：备份加重建是事后补救，重建期间服务中断、数据回补都要人扛，不是预防机制。\n\n**关键概念：** 删除保护防误删整栈；栈策略防关键资源被意外更新——两个保护各管一头。","s":"自编·2.1.4"},{"id":"D2-016","d":2,"t":"single","q":"一个运维团队接管了一套传统三层架构（负载均衡、EC2、数据库）的基础设施管理。团队成员以运维为主，习惯 YAML 语法，不会编程语言；架构上也没有无服务器组件。团队要选一套编写模板的方案。\n\n最贴合的选择是？","o":[{"l":"A","t":"AWS CDK——抽象能力最强，团队可以先学 TypeScript 再上手编写。"},{"l":"B","t":"AWS SAM——无服务器扩展，正好覆盖三层架构的全部组件。"},{"l":"C","t":"Terraform——社区资料丰富，语法也是声明式，适合运维团队学习。"},{"l":"D","t":"AWS CloudFormation YAML 直接编写——运维写 YAML 顺手，架构无无服务器组件，声明式模板直给最匹配。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 按选型判断三问逐条对：不是纯无服务器（排除 SAM）；团队主要靠运维、不会编程语言（排除 CDK）；要 AWS 原生方案（排除 Terraform）。剩下的就是 CloudFormation YAML 直给——运维团队写声明式模板最顺手。\n\n**其他选项为什么错：**\n- A：CDK 的抽象优势要以编程能力为前提，为用 CDK 让运维先学 TypeScript 是本末倒置。\n- B：SAM 只覆盖 Lambda、API 网关等无服务器形态，三层架构的 EC2 与数据库不在它的精简语法里。\n- C：Terraform 不是 AWS 原生工具，考试问「AWS 原生方案」时答案不会是它。\n\n**关键概念：** 选型三问：是不是纯无服务器、团队会不会写代码、要不要最终可读性。","s":"自编·2.1.4"},{"id":"D2-017","d":2,"t":"single","q":"一个团队的 CloudFormation 栈里混着无状态资源（安全组、负载均衡）和有状态资源（RDS 数据库实例）。此前发生过一次险情：一次普通的参数调整差点让引擎替换了数据库实例。团队要专门保护数据库资源不被意外更新，同时不影响其他资源的正常迭代。\n\n最贴合的机制是？","o":[{"l":"A","t":"给数据库资源配置栈策略（stack policy），声明该资源禁止更新与替换，其余资源不受影响。"},{"l":"B","t":"给整个栈开启删除保护（termination protection），从源头杜绝风险。"},{"l":"C","t":"把数据库资源移出栈，改由控制台手工管理，彻底避开引擎的更新。"},{"l":"D","t":"每次更新前跑漂移检测，发现差异就中止这次更新操作。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 栈策略可以按资源粒度声明保护：只对数据库资源禁止更新与替换，安全组、负载均衡照常迭代——正好满足「保住有状态的、不拖累无状态的」。题干里那次险情正是引擎自动替换资源，栈策略在引擎层面直接否决。\n\n**其他选项为什么错：**\n- B：删除保护防的是删栈，防不了更新过程中的资源替换，保护错了一层。\n- C：移出模板管理等于放弃 IaC，数据库反而变成漂移与审计的盲区。\n- D：漂移检测看的是「线上与模板的差异」，回答不了「这次更新会不会替换数据库」。\n\n**关键概念：** 栈策略保护关键资源不被意外更新，保护粒度是资源级。","s":"自编·2.1.4"},{"id":"D2-018","d":2,"t":"multiple","q":"一家公司要为 IaC 平台定变更管理规范，架构师列出了候选做法，团队评审时要区分「符合 IaC 变更管理原则」与「看着省事但埋雷」两类。评审的目标是把规范一次写对，避免上线后反复打补丁。\n\n下列做法中正确的两项是？（请选择两项）","o":[{"l":"A","t":"救急时允许直接在控制台改线上资源，事后有时间再把改动补进模板。"},{"l":"B","t":"生产栈的更新先创建变更集预览差异，确认无害后再执行。"},{"l":"C","t":"模板改动可以不经评审，由发起人直接合并部署，缩短交付时间。"},{"l":"D","t":"模板改动统一走 Git 与 PR 评审，合并触发流水线部署，生产部署前过审批阶段。"},{"l":"E","t":"漂移检测发现手工改动后无需处理，把差异记录留着备查就行。"}],"a":["B","D"],"e":"**正确答案：BD。**\n\n**为什么对：** 两条都是正文给的标准实践：变更集让生产栈「先看后动」，Git 加 PR 加流水线加审批让变更与代码同轨、每一步留痕。这两条合起来就是 IaC 变更管理的骨架。\n\n**其他选项为什么错：**\n- A：控制台手改正是漂移的源头，「事后补」往往不会发生，规范里开这个口子等于没有规范。\n- C：变更不评审，错误改动直达生产，省下的评审时间会用事故加倍还回来。\n- E：发现漂移不处理，线上状态与模板的偏差会一直存在，下次更新就可能触发意外替换。\n\n**关键概念：** 变更管理三件套：PR 评审、变更集预览、生产审批——环环留痕，不开手工口子。","s":"自编·2.1.2"},{"id":"D2-019","d":2,"t":"single","q":"一个团队第一次用 AWS SAM 部署无服务器应用。运维在发布单上提了一个问题：SAM 模板精简了这么多语法，线上资源到底按什么定义创建？审计要看的完整资源清单从哪里来？运维要给审计一个准确答复，避免发布单上把产物来源写错。\n\n准确的回答是？","o":[{"l":"A","t":"SAM 模板就是最终定义，云上按 SAM 语法直接创建资源，无额外转换。"},{"l":"B","t":"SAM 部署时把精简语法转换成完整的 CloudFormation 模板再执行，审计看转换后的完整模板。"},{"l":"C","t":"SAM 通过 API 网关的内部机制创建资源，不经过任何模板引擎。"},{"l":"D","t":"SAM 调用 Lambda 控制台逐个创建函数，完整资源清单要在控制台单独导出。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文的原话是「部署时转成完整 CloudFormation」——SAM 的精简语法是写给作者看的，部署前会展开成包含全部资源定义的标准模板，然后交给 CloudFormation 引擎执行。所以审计要的完整清单就在转换后的模板里，与普通 CloudFormation 栈同格式。\n\n**其他选项为什么错：**\n- A：SAM 语法里没有展开的默认值、事件映射等细节，它不是云上资源的完整定义。\n- C：API 网关是 SAM 模板里定义的资源之一，不是创建资源的机制。\n- D：逐个手工创建正是 SAM 要消灭的方式，资源清单也不会因此完整。\n\n**关键概念：** SAM 是 CloudFormation 的无服务器扩展——写的是精简语法，跑的是完整模板。","s":"自编·2.1.4"},{"id":"D2-020","d":2,"t":"single","q":"一家公司有 12 个 AWS 账号，全部在同一个 Organizations 组织内。安全团队要求统一开启 CloudTrail 多区域追踪，覆盖全部账号与两个区域，并且明确不想到每个账号里手工预建 IAM 角色。平台团队还要预估这次部署会生成多少个栈实例，用于部署后核对。平台团队要选 StackSets 的权限模型。\n\n最贴合的选择是？","o":[{"l":"A","t":"自助管理 StackSets——在管理账号与各目标账号预建 IAM 角色后再部署。"},{"l":"B","t":"服务管理 StackSets——管理账号启用 Organizations 可信访问，由组织代授权限，一次部署覆盖组织内账号。"},{"l":"C","t":"在每个账号手工创建追踪——最直观，12 个账号逐个操作一遍。"},{"l":"D","t":"用 EventBridge 跨账号转发事件——先在各账号建好追踪，再聚合事件流。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 题干两个关键条件——「全部在同一个组织内」与「不想手工预建角色」——正好卡在服务管理模型的能力上：Organizations 代授权限，管理账号启用可信访问即可部署，一个模板覆盖 12 个账号 × 2 个区域。\n\n**其他选项为什么错：**\n- A：自助管理要在每个账号预建角色，账号越多越繁琐，恰恰是题干明确排除的做法。\n- C：手工逐账号操作没有一致性保证，12 个账号迟早出现配置漂移。\n- D：EventBridge 解决的是事件聚合，不是「把一份模板铺到多账号」的部署问题。\n\n**关键概念：** 题干出现「组织内全部账号」选服务管理；出现「组织外」三个字，服务管理直接排除。","s":"自编·2.1.5"},{"id":"D2-021","d":2,"t":"single","q":"一家公司刚并购了一家子公司，子公司有独立的 AWS 组织。母公司要求把统一的安全基线模板部署到子公司的三个账号里。平台团队先按 StackSets 的权限模型做可行性判断，再定部署路径，评审会上要一次性说清可行性与前置条件。\n\n正确的判断是？","o":[{"l":"A","t":"服务管理 StackSets——只要母公司组织启用可信访问，就能覆盖子公司账号。"},{"l":"B","t":"服务管理与自助管理都能直接覆盖，选操作上更简单的那个即可。"},{"l":"C","t":"StackSets 不支持跨组织部署，只能逐账号手工搭建全部资源。"},{"l":"D","t":"自助管理 StackSets——子公司账号在组织外，须在子公司账号预建 IAM 角色后再部署。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 服务管理的权限来自 Organizations 代授，前提是目标账号在同一个组织内；子公司是独立组织，服务管理够不着。自助管理不依赖组织关系，只要在目标账号预建好 IAM 角色就能部署——这正是正文场景举例里「刚并进来的子公司」的标准走法。\n\n**其他选项为什么错：**\n- A：组织关系不存在，可信访问授权不到子公司账号，服务管理直接排除。\n- B：「都能覆盖」不成立——服务管理在组织外没有权限来源，无从选起。\n- C：StackSets 明确支持跨组织部署（走自助管理），手工搭建放弃了模板化管理。\n\n**关键概念：** 部署到组织外账号只能自助管理：每账号预建两个 IAM 角色，再用同一模板部署。","s":"自编·2.1.5"},{"id":"D2-022","d":2,"t":"single","q":"一次 StackSets 部署覆盖 20 个账号 × 2 个区域，其中两个栈实例因目标账号权限不足部署失败，其余 38 个实例已成功。团队要处理这两个失败实例，同时不能扰动已成功的部署，也不能放弃任何一个账号的合规覆盖。\n\n正确的处理方式是？","o":[{"l":"A","t":"全部回滚重来——任何实例失败都必须撤销整批部署再重新发起。"},{"l":"B","t":"对失败的栈实例单独重试，修复权限后重新部署这两个实例，已成功的实例不受影响。"},{"l":"C","t":"把失败的两个账号从部署目标里移除，剩余账号视为部署完成。"},{"l":"D","t":"提高最大并发数重新发起整批部署，让全部账号再跑一遍。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文明确：「某实例部署失败不影响已成功的栈实例，可针对失败实例单独重试」。失败原因是权限不足，先在目标账号补齐权限，再只对这两个失败实例重试——38 个成功实例原地不动，正是「不扰动已成功部署」的要求。\n\n**其他选项为什么错：**\n- A：整批回滚把 38 个好端端的实例也推翻重来，成本与风险都白白放大。\n- C：移除账号等于放弃这两个账号的合规覆盖，问题只是被藏起来了。\n- D：重发整批既浪费已成功的成果，也不解决权限不足这个根因。\n\n**关键概念：** StackSets 按容错容量与最大并发控制铺开节奏；失败实例可单独重试。","s":"自编·2.1.5"},{"id":"D2-023","d":2,"t":"multiple","q":"一个平台团队在设计多账号部署规范，需要把 StackSets 两种权限模型的边界写清楚。评审会上出现了几种说法，团队要挑出正确的那两条写进规范，避免后续部署时选错模型。\n\n关于 StackSets 权限模型，正确的两项是？（请选择两项）","o":[{"l":"A","t":"服务管理由 Organizations 代授权限，无需在各目标账号预建 IAM 角色。"},{"l":"B","t":"服务管理经组织授权后也能覆盖任意组织外账号，边界由部署参数控制。"},{"l":"C","t":"服务管理只能覆盖组织内账号，组织外账号必须走自助管理。"},{"l":"D","t":"自助管理不需要预建任何角色，直接指定目标账号即可部署。"},{"l":"E","t":"两种模型的部署产物不同：服务管理产出栈，自助管理产出栈实例。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** 两条合起来正是服务管理的完整画像：权限由 Organizations 代授、免去逐账号预建角色（A），代价是适用范围限定在组织内账号（C）——组织外账号只能走自助管理、预建角色。\n\n**其他选项为什么错：**\n- B：正文的原话是「题干出现『组织外』三个字，服务管理直接排除」，代授权限出不了组织边界。\n- D：自助管理的定义恰恰相反——手工在管理账号与目标账号预建 IAM 角色，这正是它的前置成本。\n- E：两种模型部署的都是栈实例（每个「账号×区域」一个），产物形态没有区别。\n\n**关键概念：** 服务管理省角色、限组织内；自助管理全账号可达、每账号预建角色。","s":"自编·2.1.5"},{"id":"D2-024","d":2,"t":"multiple","q":"一个团队第一次用 StackSets 把一份模板部署到 5 个账号 × 3 个区域。运维主管在部署评审会上问：部署产物怎么算、失败怎么处理、模板要不要按账号拆分。团队按 StackSets 的工作机制逐条作答。\n\n下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"部署中任何一处实例失败，都会触发全部实例自动回滚重来。"},{"l":"B","t":"每个「账号 × 区域」组合生成一个栈实例，15 个实例由一份模板统一管理。"},{"l":"C","t":"每个账号要各自维护一份模板，StackSets 只负责发起部署。"},{"l":"D","t":"StackSets 一次部署只能覆盖一个区域，多区域要多轮操作。"},{"l":"E","t":"某个实例部署失败不影响已成功的实例，可针对失败实例单独重试。"}],"a":["B","E"],"e":"**正确答案：BE。**\n\n**为什么对：** B 是 StackSets 的产物定义——一份模板铺到多账号多区域，每个「账号×区域」组合生成一个栈实例；E 是失败处理机制——实例之间互不影响，失败实例可单独重试。两条合起来回答了主管的全部问题：产物按实例算，失败不用整批重来。\n\n**其他选项为什么错：**\n- A：失败不触发全局回滚，这正是 StackSets 与整批部署工具的核心差别。\n- C：管理一份模板、处处一致正是 StackSets 的价值，按账号拆模板是倒退。\n- D：一次部署可以覆盖多个区域，5 账号 × 3 区域本来就要一轮完成。\n\n**关键概念：** 一份模板、多账号多区域、每组合一个栈实例；失败实例单独重试。","s":"自编·2.1.5"},{"id":"D2-025","d":2,"t":"single","q":"一家公司的安全扫描发现：一批 EC2 实例上的日志代理配置被手工改动过，与公司基线不一致，而且改动来源不明。运维要把这批实例的配置自动拉回期望状态，并保证之后长期保持一致。\n\n最贴合的服务是？","o":[{"l":"A","t":"AWS Config——发现并记录配置漂移，生成违规报告供审计使用，纠正动作要另接服务。"},{"l":"B","t":"AWS Systems Manager State Manager——把实例配置持续拉到期望状态并保持，偏离即自动收敛。"},{"l":"C","t":"AWS AppConfig——下发应用层参数与功能开关，管不到实例上的代理配置。"},{"l":"D","t":"AWS OpsWorks——Chef/Puppet 托管形态，可以写脚本收敛配置，但已停止向新客户开放。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 题干的动作是「拉回期望状态并长期保持」，这正是 State Manager 的定义：给实例绑定期望状态关联，偏离就自动拉回，持续保证一致。正文口诀「实例配置漂了要拉回」对应的就是它。\n\n**其他选项为什么错：**\n- A：Config 能发现漂移并留痕，但它只评估不纠正——发现违规和修复违规是两件事。\n- C：AppConfig 的对象是应用参数与功能开关，实例上的日志代理配置不在范围。\n- D：OpsWorks 已停止向新客户开放，新方案不应再引入。\n\n**关键概念：** 「实例配置漂了要拉回」对应 SSM State Manager；Config 发现、SSM 纠正是常见连线。","s":"自编·2.1.6"},{"id":"D2-026","d":2,"t":"single","q":"一个新项目的技术方案里写了「用 AWS OpsWorks 做 Chef 托管配置管理」。评审时架构师指出这个选型需要复核——项目是新客户的新建环境，不是存量系统迁移，方案要按当前的服务形态来定，评审结论要写清替代方案与理由，作为修订依据。\n\n正确的复核结论是？","o":[{"l":"A","t":"OpsWorks 仍是官方主推的配置管理方案，按原方案直接立项。"},{"l":"B","t":"OpsWorks 已停止向新客户开放，新项目应改用 Systems Manager 等服务实现配置管理。"},{"l":"C","t":"OpsWorks 停止开放只是收费政策调整，功能与可用性不受影响。"},{"l":"D","t":"用 Lambda 封装 Chef 脚本替代 OpsWorks，绕开开放限制继续沿用现有 Chef 工具链。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文给的事实是「OpsWorks 已停止向新客户开放（以官方公告为准）」，并直接给出考试导向——「考试出现时正解倾向 SSM 替代」。新建环境引入一个不再接纳新客户的服务，方案评审必然打回。\n\n**其他选项为什么错：**\n- A：与停止开放的事实相反，主推的是 SSM、Config、AppConfig 这一套。\n- C：停止开放是准入问题——新客户进不去，不是收费高低的问题。\n- D：绕开放限制等于自建一套无托管的 Chef 运维负担，官方路径就是用 SSM 承接。\n\n**关键概念：** 四个配置管理服务里 OpsWorks 是特例：考试出现时正解倾向 SSM 替代。","s":"自编·2.1.6"},{"id":"D2-027","d":2,"t":"single","q":"一家公司的安全团队提出一个复合需求：生产账号里任何不符合基线的资源配置（比如公开的存储桶）要被发现，发现之后还要自动纠正回安全状态。团队内部在争论「Config 和 Systems Manager 选一个就够」还是「两个连线」。\n\n正确的方案是？","o":[{"l":"A","t":"只用 Config——规则评估能发现违规，也应该能顺手把资源改回安全状态。"},{"l":"B","t":"只用 SSM——State Manager 能纠正实例配置，自然也能管所有资源类型。"},{"l":"C","t":"Config 与 SSM 连线——Config 规则负责发现违规并触发，SSM 自动化负责执行纠正，两个服务各管一段。"},{"l":"D","t":"两个服务都不能满足需求，改回人工巡检加工单的人工流程。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文明确说：「考试给复合场景（如『既要发现违规又要自动纠正』）时，答案常是两个服务连线，而不是单选一个」。Config 的强项是发现——按规则评估、触发告警；SSM 的强项是执行——自动化文档跑纠正动作。发现加执行正好拼成完整闭环。\n\n**其他选项为什么错：**\n- A：Config 只评估不纠正，「顺手改掉」不是它的能力。\n- B：State Manager 的对象是实例，存储桶这类资源类型不在它的管理范围。\n- D：自动纠正是明确需求，退回人工流程等于放弃需求。\n\n**关键概念：** 复合场景先拆动作：发现归 Config、执行归 SSM，服务连线而非单选。","s":"自编·2.1.6"},{"id":"D2-028","d":2,"t":"multiple","q":"一个团队给新人培训「配置管理服务分工」，把几条判断题放进入职测验。培训目标是让新人先问「管什么对象」、再对服务，而不是把四个名字里都带「配置」或「管理」的服务混为一谈。\n\n下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"AWS Systems Manager 的主力职责是管理应用功能开关的下发节奏。"},{"l":"B","t":"AWS OpsWorks 是当前配置管理的主力服务，新项目应优先选它。"},{"l":"C","t":"AWS Config 记录资源配置历史、按规则评估合规，管的是资源合规。"},{"l":"D","t":"AWS Config 的主要职责是给实例统一打操作系统补丁。"},{"l":"E","t":"AWS AppConfig 下发应用参数与功能开关，带校验与灰度发布，管的是应用配置。"}],"a":["C","E"],"e":"**正确答案：CE。**\n\n**为什么对：** 两条都是「先问管什么对象」的标准答案：Config 的对象是云资源——记录配置历史、按规则评估合规；AppConfig 的对象是应用配置——参数与功能开关带校验、带灰度下发。对象与能力一一对应。\n\n**其他选项为什么错：**\n- A：功能开关下发是 AppConfig 的职责，SSM 管的是实例——清单、补丁、远程执行、期望状态。\n- B：OpsWorks 已停止向新客户开放，正解倾向 SSM 替代，说它「是主力」方向反了。\n- D：给实例打补丁是 SSM Patch Manager 的活，Config 只评估合规、不动手。\n\n**关键概念：** 四个服务答四件事：SSM 管实例、Config 管资源合规、AppConfig 管应用配置、OpsWorks 已不接新客。","s":"自编·2.1.6"},{"id":"D2-029","d":2,"t":"multiple","q":"一个团队要落地「合规基线」体系：先有基线定义与违规评估，再让实例长期符合基线要求，同时应用层的参数也要纳入同一套节奏管理。架构师给出了三个服务的分工方案，团队评审时要确认分工没有张冠李戴。\n\n下列说法正确的三项是？（请选择三项）","o":[{"l":"A","t":"用 Config 按规则定义并评估合规基线，违规由规则自动评估并告警。"},{"l":"B","t":"用 Systems Manager 把实例配置持续拉到基线要求的期望状态，并长期保持一致。"},{"l":"C","t":"用 AppConfig 管理应用层参数，带校验与灰度节奏下发，不需要重新部署。"},{"l":"D","t":"三个服务互斥，只能选一个作为唯一的配置管理入口。"},{"l":"E","t":"用 OpsWorks 统一承担上面三件事，减少服务数量与运维负担。"}],"a":["A","B","C"],"e":"**正确答案：ABC。**\n\n**为什么对：** 这正是正文给的常见组合：Config 定合规基线、SSM 把实例拉到基线、AppConfig 管应用层参数——三层对象（资源、实例、应用）各归其位。正文同时强调「四个服务不互斥」，复合场景就是靠组合落地。\n\n**其他选项为什么错：**\n- D：「互斥」与事实相反——三件事三个服务、各管一层才是正解，强行合一必然张冠李戴。\n- E：OpsWorks 已停止向新客户开放，也包不了这三类对象的完整闭环。\n\n**关键概念：** 常见组合＝Config 定基线 + SSM 拉实例 + AppConfig 管应用参数；服务组合而非互斥。","s":"自编·2.1.6"},{"id":"D2-030","d":2,"t":"single","q":"一家公司 30 个团队各自创建 S3 桶，半年出了 4 次公开暴露事故。治理目标：开发者仍能自助拿到合规的存储桶，但加密、公开访问、生命周期规则必须按公司基线执行，不能依赖每个团队的自觉。\n\n最贴合的方案是？","o":[{"l":"A","t":"给每个团队开通管理员权限，让他们自己按基线配置存储桶。"},{"l":"B","t":"把基线固化成模板上架 Service Catalog，开发者像点菜一样申请，产品约束限定角色与参数范围；绕过目录自建的桶由 Config 规则标违规。"},{"l":"C","t":"所有存储桶的创建改走人工工单，由平台团队逐个核对基线后处理。"},{"l":"D","t":"每季度发一次违规通报，提醒各团队对照基线自查整改。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文的原话场景就是这个：「自助与合规不打架，靠的是把基线做进产品」。Service Catalog 把核准模板做成产品目录——能拿到什么、参数范围多大，目录说了算；绕过目录的自建由 Config 兜底标违规。自助申请几分钟拿到合规的桶，基线不需要任何人自觉。\n\n**其他选项为什么错：**\n- A：放开管理员权限正是 4 次事故的成因，方向完全相反。\n- C：人工工单把 30 个团队的自助需求全压到平台团队，慢且不可扩展。\n- D：季度通报是事后追认，暴露事故不会等你一个季度。\n\n**关键概念：** 既要自助又要守基线＝Service Catalog 加约束，而不是放权限或全人工审批。","s":"自编·2.1.7"},{"id":"D2-031","d":2,"t":"single","q":"一个平台团队要沉淀「标准应用安全组」模式：入站规则、出站规则、加密相关配置在几十个项目里要求完全一致，各项目只允许改端口等少量业务参数。团队要选一个复用机制把这个模式固化下来，防止各项目复制粘贴时改走样。\n\n最贴合的机制是？","o":[{"l":"A","t":"把模板文件复制到各项目仓库，各项目按需自行修改维护。"},{"l":"B","t":"建一个共享 Wiki 页面，把配置要求写成文档供各项目参考执行。"},{"l":"C","t":"用 CloudFormation 模块把安全组与加密配置打包成可复用单元，使用者只填业务参数。"},{"l":"D","t":"用 Config 规则事后检查各项目的安全组配置，违规再通知整改。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** CloudFormation 模块（module）的定义正是「把一组资源打包成可复用单元——模块内固化安全组规则与加密配置，使用者只填业务参数」。规则与加密封在模块内部，项目碰不到，改走样的问题从机制上消失。\n\n**其他选项为什么错：**\n- A：复制粘贴正是「改走样」的来源，几十个副本的漂移无法收敛。\n- B：文档靠人执行，与「不能依赖自觉」的目标相悖，没有任何机制约束。\n- D：Config 是事后发现违规，模式本身没有被固化，违规会持续产生再持续整改。\n\n**关键概念：** 模式固化用 CloudFormation 模块；治理内嵌在交付物里，不靠事后检查。","s":"自编·2.1.7"},{"id":"D2-032","d":2,"t":"single","q":"一个组织的 Service Catalog 产品（标准应用栈）要升级：新版模板补上了强制标签策略。平台团队担心升级影响存量使用者，需要按目录产品的版本机制安排这次发布，既让新申请享受新基线，又不逼存量团队立刻迁移。\n\n正确的安排是？","o":[{"l":"A","t":"直接覆盖旧模板——目录里只保留一份最新定义，所有使用者同步升级。"},{"l":"B","t":"以新版本号发布更新——旧版本仍可被存量使用者使用，新申请走新版。"},{"l":"C","t":"把产品下线一周，等存量团队全部迁移完成后再重新上架。"},{"l":"D","t":"要求存量团队限期手动重建各自环境，切换到新配置。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文给的版本机制就是「交付物带版本：目录产品更新走版本号，旧版本仍可用，新申请走新版」。新版本号发布后，新申请自动拿新版基线，存量使用者按自己的节奏迁移——正好满足「不逼存量立刻迁移」。\n\n**其他选项为什么错：**\n- A：覆盖旧模板剥夺了存量使用者的稳定版本，正在运行的环境可能与目录定义脱节。\n- C：下线一周等于让所有新申请停摆，代价远大于收益。\n- D：限期手动重建违反自助原则，也把迁移风险集中到一个时间窗里。\n\n**关键概念：** 目录产品走版本号发布：旧版本可用、新申请走新版，迁移节奏由使用者定。","s":"自编·2.1.7"},{"id":"D2-033","d":2,"t":"multiple","q":"一家公司要把治理控制写进基础设施交付流程，目标是不再依赖事后检查与口头提醒。团队列出了候选做法，评审时要挑出「把治理内嵌进交付」的那两条写进规范，其余按「依赖人的环节」归档不做。\n\n下列做法中正确的两项是？（请选择两项）","o":[{"l":"A","t":"给开发者发放管理员权限，信任每个人按公司基线自觉完成配置。"},{"l":"B","t":"在可复用模板里固化安全基线：加密默认开启、禁用公网访问、强制打标签。"},{"l":"C","t":"所有基础设施申请改走人工审批邮件，逐件核对基线后再放行。"},{"l":"D","t":"用 Service Catalog 约束限制实例类型、绑定特定角色，开发者只能按约束申请。"},{"l":"E","t":"治理约束只在内部文档里写明，交付工具与模板不做任何限制。"}],"a":["B","D"],"e":"**正确答案：BD。**\n\n**为什么对：** 两条都是「治理写进交付物」的标准做法：模板内硬编码安全基线（加密默认开启、禁公网、强制标签）让违规配置根本生不出来；Service Catalog 约束把实例类型与角色限定在核准范围内，开发者自助申请的同时基线自动成立。两者都不依赖任何人的自觉。\n\n**其他选项为什么错：**\n- A：管理员权限正是要收走的对象，靠自觉与治理目标背道而驰。\n- C：人工审批邮件是流程外挂，不是内嵌控制，且不可扩展。\n- E：只在文档写约束等于没有约束，正是本次治理要推翻的现状。\n\n**关键概念：** 治理内嵌的两条腿：模板固化基线 + 目录约束收权；约束多则自由度小、合规强。","s":"自编·2.1.7"},{"id":"D2-034","d":2,"t":"single","q":"一家公司在设计多账号结构。平台团队发现有人提议：把一个面向外部的 Web 应用直接部署到组织的管理账号里，理由是「管理账号权限最大，部署最方便，不用再开新账号」。架构师要求按账号角色定位给出否决理由。\n\n正确的否决理由是？","o":[{"l":"A","t":"管理账号的配额更低，跑业务负载会遇到资源上限，影响应用可用性。"},{"l":"B","t":"管理账号只管组织与计费、不跑业务负载——它权限最大，被攻陷等于整个组织失守，业务负载会放大爆炸半径。"},{"l":"C","t":"管理账号不支持 CloudFormation，业务应用无法用模板部署，只能手工维护。"},{"l":"D","t":"管理账号的网络环境是内网隔离的，外部用户无法访问部署在里面的 Web 应用。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文给的管理账号定位是「只管组织与计费，不跑业务负载」，理由直指风险——它权限最大，被攻陷等于整个组织失守。往里塞业务负载，等于把组织最高权限与外部可达的应用绑在一个爆炸半径里，一损俱损。\n\n**其他选项为什么错：**\n- A：配额不是反对的理由，风险模型才是。\n- C：管理账号同样支持 CloudFormation 与模板部署，这条理由不成立。\n- D：管理账号并没有内网隔离属性，Web 应用能不能被访问跟账号角色无关。\n\n**关键概念：** 多账号按职责分层：管理账号只管组织与计费，业务负载放工作负载账号。","s":"自编·2.2.1"},{"id":"D2-035","d":2,"t":"single","q":"一个组织目前把生产与非生产环境跑在同一个账号里。一次测试环境的误操作直接打挂了生产数据库，复盘会上架构师提出按环境拆分账号，有人质疑「拆了账号要多管一堆账单，意义在哪」。\n\n拆分账号的核心意义是？","o":[{"l":"A","t":"工作负载按环境或业务线分账号，把爆炸半径隔离在账号边界内——一次事故不再波及全部环境。"},{"l":"B","t":"拆分账号后每个账号都能获得独立的折扣额度，整体账单会比合并时更低。"},{"l":"C","t":"拆分账号可以绕开 SCP 的限制，让各环境团队自由选择想用的服务。"},{"l":"D","t":"拆分账号主要是为了让 CloudTrail 日志按环境分开存放，便于检索历史事件。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文的原话：「工作负载账号按环境或业务线分账号——爆炸半径隔离的基本盘」。账号是隔离边界，测试环境的误操作封在测试账号里，碰不到生产的钥匙——这正是这次事故复盘要解决的问题。\n\n**其他选项为什么错：**\n- B：拆账号不是省钱手段，账单分开只是计费视角的副产品。\n- C：SCP 挂在组织与 OU 上，拆账号不会「绕开」限制，治理反而更严。\n- D：日志分开存放是便利性收益，不是核心意义，且日志可集中聚合。\n\n**关键概念：** 账号是隔离边界，策略是隔离手段；爆炸半径隔离靠账号级拆分。","s":"自编·2.2.1"},{"id":"D2-036","d":2,"t":"single","q":"一个组织要为审计团队建一个专属账号：集中存放全部账号的 CloudTrail 与 Config 聚合数据，供合规审查与事件回溯使用。安全团队要求这个账号的日常权限形态也要按最佳实践设计，不能随意放开。\n\n最贴合的设计是？","o":[{"l":"A","t":"给审计团队的每个成员在账号里建长期 IAM 用户，方便随时登录查看数据。"},{"l":"B","t":"把审计账号同时用作管理账号，兼任组织管理与日志归集，少维护一个账号。"},{"l":"C","t":"日志与审计账号集中收 CloudTrail 与 Config 聚合数据，日常保持只读，审计人员用角色代入进入。"},{"l":"D","t":"允许审计账号对全部账号的管理角色开放完全控制，方便审计时现场修复问题。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文给的日志/审计账号定位就是「集中收 CloudTrail 与 Config 聚合数据，只读」。日常只读把误操作与越权风险压到最低；审计人员用角色代入临时进入，动作可追溯，符合「人用角色进账号」的集中管理前提。\n\n**其他选项为什么错：**\n- A：长期 IAM 用户与长期密钥正是要消灭的形态，泄漏难发现、难轮换。\n- B：审计账号兼任管理账号违背职责分层——管理账号被攻陷等于整个组织失守，不该再叠加日志职能。\n- D：完全控制违背只读定位，审计账号一旦失陷就成了全组织的后门。\n\n**关键概念：** 日志/审计账号：集中聚合、只读、角色代入进入。","s":"自编·2.2.1"},{"id":"D2-037","d":2,"t":"single","q":"一家公司的安全团队做了多年的资源级管控：安全组收得很紧、IAM 策略逐条评审，但仍然发生了一次事故——一名员工的生产账号访问密钥被钓鱼邮件骗走，攻击者用密钥直接进了生产环境。管理层问：资源级管控已经很严，为什么还拦不住？\n\n按多账号最佳实践，准确的回答是？","o":[{"l":"A","t":"安全组规则不够细，应该继续收紧入站端口，把可疑来源全部封掉。"},{"l":"B","t":"IAM 策略评审的颗粒度不够，要把每条策略拆到更细的动作级别再重新评审。"},{"l":"C","t":"缺少加密措施，密钥应该用 KMS 加密存储，避免明文泄漏。"},{"l":"D","t":"账号是隔离边界，策略是隔离手段——安全组与 IAM 策略管得住一台资源，管不住有人拿了生产账号的钥匙，账号级隔离才是硬边界。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文的原话就是这个问题的答案：「安全组、IAM 策略管得住一台资源，管不住『有人拿了生产账号的钥匙』——账号级隔离才是硬边界」。密钥被骗走意味着资源级防线整体失效，只有把生产压进独立账号、配合严格的账号级访问路径，损失才能封顶。\n\n**其他选项为什么错：**\n- A：收紧安全组只缩小单台资源的暴露面，密钥持有者照样能走合法路径操作。\n- B：策略再细也是资源级防线，防不住「钥匙外泄」这个层级的问题。\n- C：加密存储解决的是「存」的环节，骗走的是能用的密钥本身。\n\n**关键概念：** 资源级策略管点、账号隔离管面；密钥泄漏类事故要靠账号边界止损。","s":"自编·2.2.1"},{"id":"D2-038","d":2,"t":"single","q":"一个团队每月要开 3~5 个新账号：建账号、配 VPC、开 CloudTrail、设密码策略，全靠手工操作，漏一次就是一条审计发现。团队要按「开通即合规」的标准重造流程，不再依赖任何人的记性与责任心。团队要把开通流程改造成「新账号出生即合规」的自动化形态。\n\n最贴合的方案是？","o":[{"l":"A","t":"把手工开通步骤写成图文操作手册，每个操作人按手册逐项执行并拍照留档。"},{"l":"B","t":"用 Control Tower 账号工厂一键出号并自动铺护栏与网络蓝图，或用 Organizations 创建加 StackSets 铺基线的组合，开通即合规。"},{"l":"C","t":"开完账号后安排专人每周巡检一遍全部账号，发现缺失项再补配。"},{"l":"D","t":"复制一个配置齐全的现有账号作为模板，后续新账号都照着它手工配置。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文给的考试判断原话：「新账号开通时自动应用安全基线 → Control Tower 账号工厂，或『Organizations 创建 + StackSets 铺基线』组合」。两条路都是流程化交付：创建、归组、铺基线一气呵成，不依赖任何人的记性。\n\n**其他选项为什么错：**\n- A：手册还是手工，漏配的概率不会降，只是漏了能查到。\n- C：事后巡检是发现缺陷不是消灭缺陷，开通即合规要求的是出生时配齐。\n- D：「照着抄」是手工的另一种写法，规模化下必然漂移。\n\n**关键概念：** 账号开通自动化＝创建账号 → 归入 OU → 配基线，一条流程串起。","s":"自编·2.2.2"},{"id":"D2-039","d":2,"t":"single","q":"一个组织的 SCP 挂载在「生产」OU 上。新开通的一个账号因疏忽被放进了「沙箱」OU，上线两周后安全团队发现：这个账号里能执行不少生产 OU 明令禁止的操作。平台团队要按 OU 与 SCP 的挂载机制定位原因，先核对账号所在的组织位置。\n\n最可能的原因是？","o":[{"l":"A","t":"新账号有 30 天的 SCP 豁免期，到期前不受组织级策略约束。"},{"l":"B","t":"沙箱 OU 的 SCP 覆盖范围小，说明 SCP 配置文件在同步时丢失了部分规则。"},{"l":"C","t":"该账号的 IAM 策略优先级高于 SCP，把组织级限制覆盖掉了。"},{"l":"D","t":"OU 是治理策略的挂载点——账号放错 OU，就吃不到挂载在目标 OU 上的 SCP 与护栏。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文的原话：「OU 是治理策略（SCP、护栏）的挂载点，放错 OU 就吃不到策略」。账号能做什么的组织级上限由它所在的 OU 决定——放进沙箱 OU，吃到的就是沙箱的策略集，生产 OU 的禁令对它完全不存在。\n\n**其他选项为什么错：**\n- B：SCP 是挂载关系不是文件同步，不存在「同步丢失」。\n- C：方向反了——SCP 是上限，IAM 策略再大也越不过 SCP，优先级说法本身错误。\n- A：没有 SCP 豁免期这种机制，属于编造概念。\n\n**关键概念：** 开通三步里「归入 OU」决定账号吃到哪套策略；放错 OU＝策略落空。","s":"自编·2.2.2"},{"id":"D2-040","d":2,"t":"single","q":"一家公司在年度安全审计里被指出：抽查的 10 个手工开通的账号中，有 8 个缺少 CloudTrail 聚合、密码策略缺项或 VPC 基线不全。审计报告把这类问题列为高频缺陷，要求整改到「新账号开通不再依赖手工」。\n\n最贴合的整改方向是？","o":[{"l":"A","t":"给每个手工开通的账号安排双人复核，开通后互相检查配置清单。"},{"l":"B","t":"把审计发现的缺陷项整理成清单，发给各团队负责人自查认领。"},{"l":"C","t":"把开通流程标准化并自动化：账号工厂或 Organizations 创建、归入 OU、用蓝图与 StackSets 铺基线，出生即配齐。"},{"l":"D","t":"收紧 IAM 权限，禁止普通员工创建账号，所有账号申请都由管理员手工代开。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文的原话：「手工开的账号十有八九缺护栏，这是审计高频缺陷」，开出的药方就是开通自动化——一个流程串起创建、归 OU、铺基线。抽查 8/10 缺护栏正是手工模式的必然结果，整改方向是让流程保证配置，不是让人更仔细。\n\n**其他选项为什么错：**\n- A：双人复核能降低单人遗漏的概率，但流程仍是手工，规模化下照样缺。\n- B：自查认领解决存量，管不住下一个手工开出来的账号。\n- D：收权只改变「谁来手工开」，手工本身才是缺陷来源。\n\n**关键概念：** 开通流程的标准化程度，决定组织的安全下限。","s":"自编·2.2.2"},{"id":"D2-041","d":2,"t":"single","q":"一个团队的老做法是给每位需要进账号的员工开一个 IAM 用户并发放长期访问密钥。账号数涨到三十多个后，安全团队盘点出四百多把长期密钥，其中十几把超过一年没有轮换，还有两把出现在公开代码库里。\n\n按账号开通的最佳实践，正确的整改方向是？","o":[{"l":"A","t":"把四百多把密钥全部换成新密钥并登记台账，要求每人每季度手工轮换一次。"},{"l":"B","t":"保留长期密钥但全部加密存储，泄漏风险自然消除。"},{"l":"C","t":"取消长期 IAM 用户与密钥，人用角色代入进入账号——账号里不留长期用户，这也是集中管理的前置。"},{"l":"D","t":"在账号里给每人建只读 IAM 用户，写权限统一收归管理员，降低密钥泄漏的影响面。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文的原话：「老做法是给每人开一个 IAM 用户再发长期密钥——密钥泄漏难发现、难轮换，账号一多就无人能管」，开出的方向是「人用角色进账号，账号里不留长期用户」。角色代入是临时凭证，到期即失效，泄漏影响有天然上限，而且是集中管理（2.2.4）的前置条件。\n\n**其他选项为什么错：**\n- A：轮换台账管理四百多把密钥，管理成本随账号数线性增长，治标不治本。\n- B：加密存储只保护静态副本，密钥使用与泄漏环节的风险仍在。\n- D：只读用户仍是长期用户，密钥问题原样存在，只是缩了权限面。\n\n**关键概念：** 自动化开通的隐含前提：人用角色进账号，不留长期 IAM 用户。","s":"自编·2.2.2"},{"id":"D2-042","d":2,"t":"multiple","q":"一个组织要把账号开通流程从手工改造成自动化，平台团队列出了候选实践，安全团队评审时要挑出「符合标准化开通原则」的那两条写进开通规范，其余做法按历史遗留处理逐步淘汰。\n\n下列做法中正确的两项是？（请选择两项）","o":[{"l":"A","t":"新账号开通后统一放在根 OU 下，先自由使用，等用途明确再挪 OU。"},{"l":"B","t":"为每位需要进账号的员工创建 IAM 用户并发放长期访问密钥。"},{"l":"C","t":"用 Control Tower 账号工厂批量创建账号，护栏与网络蓝图自动铺设。"},{"l":"D","t":"新账号按用途归入对应 OU，确保吃上挂载在该 OU 上的 SCP 与护栏。"},{"l":"E","t":"开通完成后由操作人手工逐项检查安全基线，缺项当场补配。"}],"a":["C","D"],"e":"**正确答案：CD。**\n\n**为什么对：** 两条正好是开通自动化的「创建」与「归组」两步：账号工厂批量创建并自动铺护栏（C），按用途归入对应 OU 让账号吃到该挂载的策略集（D）——出生即合规靠的就是这两步加上自动铺基线。\n\n**其他选项为什么错：**\n- A：放根 OU 等于吃不到任何 OU 级策略，「先自由使用」正是护栏缺位的来源。\n- B：长期 IAM 用户与密钥是最佳实践明确淘汰的形态。\n- E：人工逐项检查是手工模式的补丁，标准化的目标是让检查自动化发生。\n\n**关键概念：** 开通三步：创建（账号工厂）→ 归入 OU → 铺基线（蓝图/StackSets）。","s":"自编·2.2.2"},{"id":"D2-043","d":2,"t":"single","q":"一个组织现在只有 6 个账号，治理靠文档约定，团队在讨论要不要上 Control Tower。同时另一个部门管着四十多个账号，审计年年提意见，正在评估接入 Control Tower。两个团队要按账号规模与治理需求分别选型。\n\n正确的选型判断是？","o":[{"l":"A","t":"两个团队都应该直接上 Control Tower——它是账号管理的唯一正解。"},{"l":"B","t":"小团队用 Control Tower、大组织用 Organizations——按账号数量反向选型。"},{"l":"C","t":"两个团队都只用 Organizations 就够——Control Tower 只是 IAM 的替代品。"},{"l":"D","t":"只有几个账号、治理靠自觉 → Organizations 够用；几十个账号、要开箱护栏与账号工厂 → Control Tower。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文给的取舍口吻原话照应：「只有几个账号、治理靠自觉 → Organizations 够用；几十个账号、要开箱护栏与账号工厂 → Control Tower」。分工关系是：Organizations 是底座，只给结构；Control Tower 是站在底座上的治理层，给护栏与账号工厂。\n\n**其他选项为什么错：**\n- A：小规模上 Control Tower 增加管理面，收益有限，选型不看规模就是一刀切。\n- C：「Control Tower 只是 IAM 的替代品」是任务综述里点名的高发误区——它是管组织的治理层，不是 IAM 服务。\n- B：反向选型没有依据，规模越大越需要开箱护栏，方向恰好说反。\n\n**关键概念：** Organizations 给结构，Control Tower 给治理；按账号规模与治理需求选。","s":"自编·2.2.3"},{"id":"D2-044","d":2,"t":"single","q":"一个团队在学 Control Tower 的护栏机制。有人把两类护栏混为一谈：一类是「关掉加密就不让建桶」的直接禁止，一类是「建了未加密的桶但事后发现并告警」。团队要分清两类护栏的实现本质。分不清这两类，护栏选型与违规处置就会走错方向。\n\n准确的说法是？","o":[{"l":"A","t":"预防式护栏本质是预置 SCP——直接禁止动作；检测式护栏本质是预置 Config 规则——事后发现违规并告警。"},{"l":"B","t":"预防式护栏本质是 IAM 用户权限配置，检测式护栏本质是安全组的入站规则。"},{"l":"C","t":"两类护栏本质相同，都是 Config 规则，区别只在告警的严重级别。"},{"l":"D","t":"预防式护栏由 GuardDuty 实现拦截，检测式护栏由 Detective 实现调查。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文的原话：「预防式护栏：本质是预置 SCP——直接禁止动作」「检测式护栏：本质是预置 Config 规则——事后发现违规并告警」。题干里「不让建桶」是动作被拦下（SCP），「事后发现告警」是违规被查出来（Config 规则），两条对号入座。\n\n**其他选项为什么错：**\n- B：护栏是组织级机制，挂在 OU 与账号上，不是账号内的用户权限或安全组规则。\n- C：一类禁止、一类告警，机制与效果都不同，不存在「本质相同」。\n- D：GuardDuty 是威胁检测、Detective 是调查，都不承担护栏的拦截或合规评估。\n\n**关键概念：** 预防式护栏＝SCP、检测式护栏＝Config 规则——一个挡住、一个抓出。","s":"自编·2.2.3"},{"id":"D2-045","d":2,"t":"single","q":"一家公司用 Organizations 管了 40 个账号，治理全靠文档约定。上了 Control Tower 并搭好落地环境后，平台团队在审计报告里写了「护栏已全组织覆盖」。安全团队抽查却发现：部分老 OU 里的账号仍能做出护栏明确禁止的操作。\n\n最可能的原因是？","o":[{"l":"A","t":"护栏规则之间互相冲突，冲突的规则会自动失效，需要手工排重。"},{"l":"B","t":"已有 Organizations 的组织接入 Control Tower，护栏只覆盖注册进来的 OU——存量 OU 要逐个注册，漏注册的 OU 不吃护栏。"},{"l":"C","t":"护栏只在账号创建时生效一次，老账号是接入前创建的，不追溯生效。"},{"l":"D","t":"Control Tower 的护栏有 30 天灰度期，灰度期内只记录不拦截。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文点名的高发误区正是这个：「已有 Organizations 的组织接入 Control Tower，护栏只覆盖注册进来的 OU——存量 OU 要逐个注册，不是接入即全量生效」。审计报告写「全覆盖」之前必须核对注册清单，漏注册的 OU 里账号照样裸奔。\n\n**其他选项为什么错：**\n- A：护栏冲突不是失效机制，报告里的问题模式是「整片 OU 无护栏」，与冲突无关。\n- C：护栏对注册 OU 里的账号持续生效，不存在只管新建账号的说法。\n- D：没有护栏灰度期机制，属于编造概念。\n\n**关键概念：** 接入 Control Tower ≠ 全量生效；注册清单核对完整，才敢写「全覆盖」。","s":"自编·2.2.3"},{"id":"D2-046","d":2,"t":"single","q":"一个平台团队要把一个账号从「沙箱」OU 挪到「生产」OU，让这个账号上线正式业务。有成员建议直接挪，理由是「只是换个分组，不影响账号里的任何资源」。架构师要求先弄清 OU 与策略的关系，再决定怎么处理这个申请。\n\n正确的处置是？","o":[{"l":"A","t":"直接挪——OU 归组只影响计费归属，与账号的权限和策略无关。"},{"l":"B","t":"挪完之后再检查新 OU 的策略，发现不合适再挪回来即可。"},{"l":"C","t":"为这个账号单独建一个新 OU，把现有策略原样复制过去，避免任何策略变化。"},{"l":"D","t":"把目标 OU 的 SCP 与护栏先核对一遍，确认挪入后吃到的策略集符合预期，再执行移动。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文的原话：「把账号从一个 OU 挪到另一个 OU，会即时改变它吃到的 SCP 与护栏——移动前先核对目标 OU 的策略，比事后救火省事」。OU 是策略挂载点，移动即换策略集，先核对是唯一稳妥路径。\n\n**其他选项为什么错：**\n- A：OU 归组直接决定吃到的策略集，「与策略无关」是事实性错误。\n- B：「事后救火」正是正文点名要避免的——挪入后如果吃到意外禁令，业务当场中断。\n- C：为单账号复制策略集制造了策略孤岛，后续护栏升级时它不会跟着走。\n\n**关键概念：** 移动 OU＝即时换策略集；移动前核对，不事后救火。","s":"自编·2.2.3"},{"id":"D2-047","d":2,"t":"multiple","q":"一个平台团队给新人出「Organizations 与 Control Tower 分工」的测验题，目标是让新人分清底座与治理层，不再把两个服务的名字和职责混为一谈。测验结果将记入新人上岗评审，题目说法要与正文口径逐字对齐。\n\n下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"Organizations 把多个账号收进一个组织，按 OU 归组，统一挂 SCP、统一计费。"},{"l":"B","t":"Control Tower 是又一个 IAM 服务，可以替代账号里的用户与权限管理体系。"},{"l":"C","t":"Organizations 开箱自带预防式与检测式护栏，接入后不需要任何额外配置动作。"},{"l":"D","t":"Organizations 支持服务管理 StackSets 与可信访问，是 Control Tower 的底座。"},{"l":"E","t":"Control Tower 接入后护栏自动覆盖组织内全部存量 OU，无需注册动作。"}],"a":["A","D"],"e":"**正确答案：AD。**\n\n**为什么对：** 两条都是 Organizations 的能力定义：按 OU 归组、统一计费、统一挂 SCP（A），以及支持服务管理 StackSets 与可信访问——这些结构能力正是 Control Tower 站在其上的底座（D）。\n\n**其他选项为什么错：**\n- B：这是任务综述点名的高发误区——Control Tower 是基于 Organizations 的托管治理服务，不是 IAM。\n- C：开箱护栏是 Control Tower 的能力，Organizations 只给结构、不管内容。\n- E：存量 OU 要逐个注册才吃护栏，「接入即全量生效」正是正文点名的高发误区。\n\n**关键概念：** Organizations 给结构（OU/SCP/StackSets），Control Tower 给治理（护栏/账号工厂）——一个只搭骨架、一个管住内容，分工不可互换。","s":"自编·2.2.3"},{"id":"D2-048","d":2,"t":"single","q":"一个团队的管理员给某开发账号的 IAM 角色配了完整的 S3 权限，但该角色在实际调用中仍被拒绝访问存储桶。管理员反复核对 IAM 策略确认无误，转而向平台团队求助。平台工程师按「先查上限、再查通路」的顺序定位问题来源。\n\n最可能的原因是？","o":[{"l":"A","t":"S3 服务正在区域扩容，该区域暂时拒绝新的授权请求，稍后重试即可。"},{"l":"B","t":"SCP 没放行——它只划上限、不授予权限，账号内 IAM 给得再全，沿途 SCP 没放行照样被拒。"},{"l":"C","t":"IAM 策略需要 24 小时传播才生效，等待一天后权限会自动恢复。"},{"l":"D","t":"角色名与策略名不一致导致绑定失败，重新创建同名角色即可恢复。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文的原话：「SCP 不授予权限，只划上限；账号内 IAM 给得再全，SCP 没放行照样被拒」。题干场景里 IAM 已确认无误，被拒的来源自然指向组织级上限——沿途某个 SCP 没放行 S3 相关动作。考试判断里「IAM 策略给了还是被拒 → 先查沿途 SCP」正是此题。\n\n**其他选项为什么错：**\n- A：服务扩容不拒绝授权请求，这类说法是编造的托辞。\n- C：IAM 策略变更生效是秒级到分钟级，没有 24 小时传播机制。\n- D：角色与策略按 ARN 绑定，与名字一致性无关。\n\n**关键概念：** SCP 定边界、代入给通路；「给了还被拒」先查沿途 SCP。","s":"自编·2.2.4"},{"id":"D2-049","d":2,"t":"single","q":"一家组织的运维团队日常从安全账号（工具账号）对十几个生产账号做变更操作。安全团队要求按集中管理标准改造访问方式：运维人员不在任何目标账号里留长期身份，操作全程可追溯。\n\n最贴合的访问方案是？","o":[{"l":"A","t":"角色代入——安全账号的角色信任各目标账号的管理角色，运维代入后临时拿到目标账号权限，目标账号不存长期用户。"},{"l":"B","t":"在每个生产账号给运维成员创建 IAM 用户，发放长期密钥并要求定期轮换。"},{"l":"C","t":"把安全账号的管理员权限直接授权给全部生产账号共享，免去逐账号配置。"},{"l":"D","t":"运维用同一个根用户邮箱登录各生产账号执行变更，操作记录统一存在安全账号。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文给的集中管理形态正是这个：「管理员在安全账号代入各目标账号的管理角色，目标账号不存任何长期 IAM 用户」。角色代入是跨账号访问的标准路径——信任关系明确、临时凭证到期失效、每次代入都有记录可追溯，三条要求全部满足。\n\n**其他选项为什么错：**\n- B：长期用户与密钥正是要消灭的形态，题干的「不留长期身份」直接排除。\n- C：把一个账号的管理权共享出去等于合并账号，爆炸半径反而扩大。\n- D：根用户是账号最高权限主体，日常使用根用户是重大违规操作。\n\n**关键概念：** 「运维从工具账号访问生产账号」→ 角色代入；SCP 定边界，代入给通路。","s":"自编·2.2.4"},{"id":"D2-050","d":2,"t":"single","q":"一个组织的运维从安全账号代入生产账号角色做变更，某天突然被拒。团队确认 IAM 策略近期没有任何改动，值班工程师面对「信任策略、调用方权限、组织策略」三层配置不知从哪查起。\n\n按权限链排查的标准顺序，第一排查动作是？","o":[{"l":"A","t":"先在生产账号里重建同名角色，排除角色配置损坏的可能。"},{"l":"B","t":"先重试几次代入操作，偶发拒绝通常是服务端瞬时故障。"},{"l":"C","t":"按固定三层排查：目标角色信任对不对 → 调用方 IAM 有没有 sts:AssumeRole → 沿途 SCP 有没有拦；逐层各查一次。"},{"l":"D","t":"先给调用方挂一份全服务的 AdministratorAccess 策略，先恢复业务再排查原因。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文给的排查顺序就是固定三层：「目标角色信任对不对 → 调用方 IAM 有没有 sts:AssumeRole → 沿途 SCP 有没有拦」。代入链路上每一跳都要两侧 IAM 与沿途 SCP 同时放行，三层各查一次比乱猜快——场景举例里的根因正是新挂的 OU 级 SCP 禁了依赖服务。\n\n**其他选项为什么错：**\n- A：重建角色破坏现场，且「角色损坏」不在高频故障清单里。\n- B：重试掩盖不了系统性拒绝，浪费排查窗口。\n- D：先挂管理员权限再排查是事故处理的反面教材，爆炸半径失控。\n\n**关键概念：** 权限链三层：角色信任 → 调用方 sts:AssumeRole → 沿途 SCP，固定顺序排查。","s":"自编·2.2.4"},{"id":"D2-051","d":2,"t":"single","q":"一家公司的安全团队发现：个别账号里的角色信任策略允许组织外账号代入，存在被外部主体利用的风险。安全团队要一刀切地杜绝这类风险，并顺手把账号可用区域也收进白名单，防止资源开到不受监管的区域。\n\n最贴合的组织级落地方式是？","o":[{"l":"A","t":"在根 OU 挂基线 SCP：禁止信任组织外的角色、强制区域白名单，各 OU 在此之上叠加更严的限制。"},{"l":"B","t":"给每个账号的 IAM 策略里逐条加入限制语句，靠策略评审保证一致。"},{"l":"C","t":"在安全组层面封掉跨区域的网络访问，让外部调用自然失败。"},{"l":"D","t":"发一份安全通知要求各团队自查角色信任策略，季度末汇总整改结果。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文给的常见组合原话：「SCP 划底线：根 OU 挂基线 SCP（如禁止信任组织外的角色、强制区域白名单），各 OU 再叠加更严的」。根 OU 挂载意味着全组织继承，一刀切的禁止正是 SCP 的本职——划上限、挡在动作发生之前。\n\n**其他选项为什么错：**\n- B：逐账号写策略是资源级防线，几十个账号靠评审保持一致必然漂移。\n- C：安全组管网络路径，管不了「谁能代入角色」这类身份信任问题。\n- D：通知加自查没有强制力，季度周期内风险照常存在。\n\n**关键概念：** 基线 SCP 挂根 OU 全组织继承；「禁止所有账号做某事」→ SCP 挂根 OU。","s":"自编·2.2.4"},{"id":"D2-052","d":2,"t":"multiple","q":"一个团队给新人培训「SCP 与角色代入」，把几条判断题放进考核。培训目标是让新人分清「定边界」与「给通路」这两条线，避免把组织级护栏与账号内权限混为一谈。考核通过线是全部答对，新人要把两条线的定义背到能复述。\n\n下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"SCP 会授予权限——把动作写进 SCP，账号内身份就自动获得该权限。"},{"l":"B","t":"SCP 只划上限、不授予权限——账号内 IAM 给得再全，SCP 没放行照样被拒。"},{"l":"C","t":"角色代入需要为每个跨账号访问发放并维护长期访问密钥。"},{"l":"D","t":"SCP 是账号内 IAM 策略的一种，写法与生效位置都在账号内部。"},{"l":"E","t":"代入链路上每一跳都要两侧 IAM 与沿途 SCP 同时放行，任何一层拦截都会被拒。"}],"a":["B","E"],"e":"**正确答案：BE。**\n\n**为什么对：** B 是 SCP 的定义原话——「不授予权限，只划上限」，它回答的是「谁都不能做什么」；E 是权限链的机制原话——「每一跳都要两侧 IAM 与沿途 SCP 同时放行」，两条合起来就是「SCP 定边界，代入给通路」。\n\n**其他选项为什么错：**\n- A：方向反了——SCP 只能收窄不能授权，授权永远来自账号内 IAM。\n- C：角色代入用的是 STS 临时凭证，恰恰是为了消灭长期密钥。\n- D：SCP 挂在组织与 OU 层级，不是账号内的 IAM 策略，生效位置完全不同。\n\n**关键概念：** SCP 定边界（组织级上限），角色代入给通路（跨账号临时凭证）。","s":"自编·2.2.4"},{"id":"D2-053","d":2,"t":"single","q":"一家公司管着五十多个账号，安全负责人每周汇报时都要登录七八个账号分别截图汇总安全状态，耗时且常漏。管理层要求换成一个集中的安全状态视图，能统一看到全部账号的安全发现与合规评分。\n\n最贴合的服务是？","o":[{"l":"A","t":"Amazon Detective——用图分析还原安全事件的来龙去脉，输出调查报告。"},{"l":"B","t":"AWS Security Hub——把各账号的安全发现汇成一个面板，统一评分与合规对照。"},{"l":"C","t":"Amazon GuardDuty——分析日志流量发现异常行为，产生威胁告警。"},{"l":"D","t":"AWS Config——记录资源配置历史并按规则评估，输出资源合规快照。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 题干要的是「集中看所有账号的安全状态」——正文给的考试判断原话就是这个场景对应 Security Hub：它做聚合——把各账号的安全发现（findings）汇成一个面板，统一评分与合规对照。多个工具的发现汇到一处，正是「换掉手工截图」的答案。\n\n**其他选项为什么错：**\n- A：Detective 是报警之后的深入调查工具，不负责日常聚合展示。\n- C：GuardDuty 产生发现，不负责把别的工具的发现汇总。\n- D：Config 管资源配置合规，聚合面板不是它的定位。\n\n**关键概念：** 「集中看安全状态」→ Security Hub 聚合层；发现可以来自多个工具。","s":"自编·2.2.5"},{"id":"D2-054","d":2,"t":"single","q":"一个组织的安全团队收到通知：某个开发账号在深夜出现高频的异常 API 调用，并启动了一批与业务无关的实例，行为特征疑似加密货币挖矿。团队需要一个能持续分析日志与流量、自动发现这类异常行为的服务。\n\n最贴合的服务是？","o":[{"l":"A","t":"Amazon GuardDuty——分析 CloudTrail、VPC 流量与 DNS 日志，发现异常 API 调用、疑似挖矿等异常行为。"},{"l":"B","t":"AWS Security Hub——聚合各来源的安全发现并统一评分，本身不做威胁行为分析。"},{"l":"C","t":"AWS Config——按规则评估资源配置是否合规，不分析行为日志。"},{"l":"D","t":"AWS Control Tower——提供预防式与检测式护栏，管理账号与 OU 的治理。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 题干的场景要素——异常 API 调用、疑似挖矿——正是正文给 GuardDuty 的定位词：「威胁检测——分析 CloudTrail、VPC 流量与 DNS 日志，发现异常行为」。考试判断原话：「发现账号出现异常行为 → GuardDuty」。\n\n**其他选项为什么错：**\n- B：Security Hub 是聚合层，GuardDuty 的发现可以汇进去，但聚合器自己不做行为分析。\n- C：Config 评的是资源配置形状，深夜异常调用是行为问题，对象不同。\n- D：Control Tower 是治理层（护栏、账号工厂），不做威胁检测。\n\n**关键概念：** 「发现异常行为」→ GuardDuty；检测、聚合、调查三层各干各的活。","s":"自编·2.2.5"},{"id":"D2-055","d":2,"t":"single","q":"GuardDuty 在一个开发账号报出疑似挖矿告警后，安全团队要回答三个问题：攻击者是谁、从哪个来源接入、进来之后具体动了什么资源。团队需要一个能基于告警深入回溯、还原完整攻击路径的工具。\n\n最贴合的服务是？","o":[{"l":"A","t":"AWS Security Hub——把告警与其他发现汇总到统一面板，提供合规评分对照。"},{"l":"B","t":"AWS Config——按规则评估资源配置，输出违规项清单供整改。"},{"l":"C","t":"Amazon Detective——GuardDuty 报警后用图分析回溯「谁、从哪、动了什么」，还原攻击路径。"},{"l":"D","t":"AWS Control Tower——用检测式护栏告警违规操作，输出治理报表。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 题干三个问题——谁、从哪、动了什么——正是正文给 Detective 的定位词：「深入调查——GuardDuty 报警后，用图分析回溯『谁、从哪、动了什么』」。考试判断原话：「报警之后要还原攻击路径 → Detective」。场景举例里还原出的「一个失陷的访问密钥」就是它的产出。\n\n**其他选项为什么错：**\n- A：Security Hub 把发现汇成面板，回答「有什么问题」，不回答「怎么发生的」。\n- B：Config 输出的是资源配置合规结果，与攻击路径无关。\n- D：Control Tower 的护栏是治理告警，不做事件级取证调查。\n\n**关键概念：** Detective 接手复杂事件的调查层；报警靠 GuardDuty，回溯靠 Detective。","s":"自编·2.2.5"},{"id":"D2-056","d":2,"t":"multiple","q":"一个组织要为五十多个账号设计治理分层方案，安全架构师给出了「预防、检测、聚合、调查」四层的设计草案，团队评审时要确认各层的职责没有串层。串层的设计会在真实事件里暴露：该挡的没挡住，该查的查不深。\n\n下列说法正确的三项是？（请选择三项）","o":[{"l":"A","t":"预防层用 SCP 与 Control Tower 预防护栏，在动作发生前挡住大部分违规。"},{"l":"B","t":"检测层的职责是挡住大部分违规，违规自然就不会发生。"},{"l":"C","t":"检测层用 GuardDuty、Config 规则与检测式护栏，抓漏网的违规。"},{"l":"D","t":"聚合层用 Security Hub 把各来源发现统一进面板，便于集中处置。"},{"l":"E","t":"调查层由 Detective 在告警发生之前介入，主动扫描潜在攻击。"}],"a":["A","C","D"],"e":"**正确答案：ACD。**\n\n**为什么对：** 三条正好是正文治理分层的前三层：「预防层（SCP、Control Tower 预防护栏）挡住大部分违规；检测层（GuardDuty、Config 规则、检测式护栏）抓漏网的；聚合层（Security Hub）把发现统一进面板」。层与层职责分明，串层就是设计漏洞。\n\n**其他选项为什么错：**\n- B：把检测层的职责说成「挡住违规」是串层——挡在前面的是预防层，检测层抓的是漏网的。\n- E：Detective 在报警之后介入做调查，「报警之前主动扫描」不是它的机制。\n\n**关键概念：** 治理四层：预防挡、检测抓、聚合汇、调查回溯——各层不串位。","s":"自编·2.2.5"},{"id":"D2-057","d":2,"t":"multiple","q":"一个团队给新人出「治理与安全服务分工」的测验题。题面给了一个真实处理链：某账号被报异常行为，发现汇入统一面板，安全团队再回溯攻击路径。团队要按这条链核对各服务的职责描述。\n\n下列说法正确的三项是？（请选择三项）","o":[{"l":"A","t":"Security Hub 做聚合——把各账号的安全发现汇成一个面板，统一评分与合规对照。"},{"l":"B","t":"GuardDuty 做威胁检测——分析 CloudTrail、VPC 流量与 DNS 日志，发现异常行为。"},{"l":"C","t":"GuardDuty 负责聚合各账号的全部安全发现，是统一面板的提供者。"},{"l":"D","t":"Detective 做深入调查——告警之后用图分析回溯攻击路径与影响范围。"},{"l":"E","t":"Detective 取代 GuardDuty 做第一道威胁告警，是检测层的入口。"}],"a":["A","B","D"],"e":"**正确答案：ABD。**\n\n**为什么对：** 三条正好按处理链排位：GuardDuty 发现异常行为（B）→ 发现汇入 Security Hub 面板（A）→ 安全团队进 Detective 回溯路径（D）。正文场景举例的处理链就是这个顺序，三个名字各占一层。\n\n**其他选项为什么错：**\n- C：聚合是 Security Hub 的职责，把「发现者」说成「聚合者」是最常见的混名。\n- E：方向反了——Detective 在告警之后接手，第一道告警正是 GuardDuty 发出的。\n\n**关键概念：** GuardDuty 报警、Security Hub 聚合、Detective 调查——混用名字就选错答案。三者顺序不可颠倒：先有发现，才有聚合，最后才是调查。","s":"自编·2.2.5"},{"id":"D2-058","d":2,"t":"single","q":"一个平台团队在设计自动化方案：一部分需求是现成服务直接覆盖的（如补丁、清单），另一部分是定制逻辑（如按业务规则判断实例能不能关）。有成员主张所有自动化都上 Step Functions 状态机，理由是「编排能力强一步到位」。\n\n按自动化方案的分层取舍，正确的判断是？","o":[{"l":"A","t":"全部上状态机——状态机的重试与错误捕获对所有场景都有益，先建好再说。"},{"l":"B","t":"分层取舍：现成服务优先，单步定制逻辑用 Lambda 直连，多步、要重试、要人工审批的流程才用 Step Functions。"},{"l":"C","t":"全部手写脚本——状态机与 Lambda 都是托管服务，脚本的可控性更强。"},{"l":"D","t":"定制逻辑一律用状态机，现成服务一律弃用，保持技术栈统一。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文给的分层路径是「先看现成服务：清单补丁归 SSM、资源合规归 Config、事件路由归 EventBridge；不够用时 Lambda 是自定义逻辑的执行单元；流程超过单函数复杂度，Step Functions 串起来」。取舍口吻也明确：单步逻辑用 Lambda 直连，别为简单事上状态机。\n\n**其他选项为什么错：**\n- A：为简单事上状态机是正文点名的反模式，编排能力用不上就纯增维护面。\n- C：手写脚本放弃了托管服务的重试、监控与审计能力，自动化规模一大必然失控。\n- D：「保持统一」不是设计目标，能力匹配才是。\n\n**关键概念：** 现成服务 → Lambda 单步 → Step Functions 多步，按复杂度逐级上升。","s":"自编·2.3.1"},{"id":"D2-059","d":2,"t":"single","q":"一个团队要做「每个工作日晚上八点自动关停非生产实例」的省钱自动化。这个动作与任何资源事件无关，纯粹按时间表执行；团队在选触发方式，要求漏触发与多触发的风险都可控。\n\n最贴合的触发方式是？","o":[{"l":"A","t":"EventBridge 计划触发——按计划时间表定时触发流程，与资源事件无关的定时任务正对这类场景。"},{"l":"B","t":"S3 事件触发——有对象写入时启动流程，用对象写入频率模拟时间表。"},{"l":"C","t":"人工手动调用——每天由值班工程师手动执行一次，保证时间点准确。"},{"l":"D","t":"Lambda 内部循环等待——函数启动后自行计时到八点再执行关停逻辑。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文给的触发方式分工：「定时资源清理用计划触发，资源变更后的修复用事件触发」。按时间表执行的关停任务与资源事件无关，EventBridge 计划触发（cron/rate 表达式）是正解，触发时机由服务保证，不依赖人也不依赖资源活动。\n\n**其他选项为什么错：**\n- B：S3 事件由对象写入驱动，与时间表无关，用写入模拟时间表不可靠。\n- C：人工触发正是要自动化的对象，漏一次就白设了自动化。\n- D：函数循环等待既费时长计时费，函数超时中断后任务直接丢失。\n\n**关键概念：** 定时任务用计划触发；事件响应才用事件触发。","s":"自编·2.3.1"},{"id":"D2-060","d":2,"t":"multiple","q":"一个团队在设计大规模环境的自动化底座，架构师要求先把现成服务的分工定下来，再考虑自定义逻辑。评审会上出现了几种「谁管什么」的说法，团队要挑出正确的三条写进设计文档。\n\n关于现成自动化服务的分工，正确的三项是？（请选择三项）","o":[{"l":"A","t":"实例清单收集与补丁管理交给 Systems Manager 的清单与 Patch Manager 能力。"},{"l":"B","t":"资源配置合规评估交给 Lambda——用自定义函数逐条比对资源形状。"},{"l":"C","t":"资源配置合规评估交给 Config——记录配置历史并按规则评估。"},{"l":"D","t":"事件路由交给 Step Functions——状态机直接订阅全部账号事件。"},{"l":"E","t":"事件路由交给 EventBridge——按事件或计划把事件路由给目标。"}],"a":["A","C","E"],"e":"**正确答案：ACE。**\n\n**为什么对：** 三条正是正文给的现成服务分工：「清单补丁归 SSM、资源合规归 Config、事件路由归 EventBridge」。先把现成能力用足，自定义逻辑只做现成服务覆盖不了的部分。\n\n**其他选项为什么错：**\n- B：合规评估是 Config 的规则能力，用 Lambda 逐条比对资源形状是重复造轮子，还没有规则引擎的持续评估。\n- D：事件路由是 EventBridge 的职责，Step Functions 是流程编排，不是事件入口。\n\n**关键概念：** 先现成后定制：SSM 管实例、Config 管合规、EventBridge 管路由；分工定准了，自定义代码只写现成服务覆盖不了的那一段。","s":"自编·2.3.1"},{"id":"D2-061","d":2,"t":"single","q":"一个团队要做一个「资源变更后按业务规则打标签」的自动化：每次只有一条规则要执行，逻辑就是查资源、算标签、写回去，十秒内完成，没有分支也没有重试需求。有成员提议为此建一个 Step Functions 状态机。\n\n按分层取舍原则，正确的建议是？","o":[{"l":"A","t":"建状态机——单步流程放进状态机，未来加步骤不用改架构。"},{"l":"B","t":"建状态机加 Lambda 双层——状态机管调度，Lambda 管逻辑，职责分离更清晰。"},{"l":"C","t":"Lambda 直连——单步逻辑直接由事件触发 Lambda 执行，别为简单事上状态机。"},{"l":"D","t":"写成定时脚本在跳板机运行，每天轮询一次资源变更记录。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文取舍口吻原话：「单步逻辑用 Lambda 直连，别为简单事上状态机」。题干场景——一条规则、无分支、无重试——正是单步逻辑的标准画像，事件触发 Lambda 直接完成，架构最短、维护面最小。\n\n**其他选项为什么错：**\n- A：「未来可能加步骤」不是现在上编排的理由，状态机的定义、监控、成本都是当下就要付的。\n- B：双层架构对单步任务是纯开销，职责分离的收益被维护成本吃掉。\n- D：定时轮询引入最长一天的延迟，事件驱动本来可以秒级完成。\n\n**关键概念：** 复杂度决定形态：单步直连，多步、要重试、要审批才上状态机。","s":"自编·2.3.1"},{"id":"D2-062","d":2,"t":"single","q":"一个团队要把一批实例纳入补丁自动化：按标签筛出目标实例后批量执行。有成员问：为什么自动化操作前一定要先把标签、清单这些元数据管好？平台团队按自动化操作的前提给出解释。\n\n准确的解释是？","o":[{"l":"A","t":"元数据决定计费归属，标签不全的实例账单会算错，自动化就失去了成本意义。"},{"l":"B","t":"元数据是安全的隔离手段，没有标签的实例默认禁止一切网络访问。"},{"l":"C","t":"元数据决定实例的可用区位置，跨可用区操作需要标签参与调度。"},{"l":"D","t":"自动化操作的前提是元数据——实例要能按属性被找到，操作才能批量施加；找不到目标就没有批量可言。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文的原话：「自动化操作的前提是元数据——实例要能按属性被找到，操作才能批量施加」。标签与清单就是自动化的「寻址系统」：补丁按标签选目标、关联按标签自动纳入，元数据不全，自动化要么漏对象要么错对象。\n\n**其他选项为什么错：**\n- A：计费归集是标签的用途之一，但不是自动化操作的前提逻辑。\n- B：标签不控制网络访问，安全隔离靠安全组与网络 ACL。\n- C：可用区是实例属性，不是标签调度的结果。\n\n**关键概念：** 元数据先行：清单确认纳管率，标签确认目标集，批量操作才有意义。","s":"自编·2.3.2"},{"id":"D2-063","d":2,"t":"single","q":"一个运维团队接管了两百多台 EC2 的日常运维。老做法是工程师逐台 SSH 登录执行命令，一台两分钟，一轮巡检要一整天，还常漏掉几台没开机或网络不通的实例。团队要把批量操作改造到规模化形态。\n\n最贴合的改造方案是？","o":[{"l":"A","t":"给每台实例装一套统一的运维脚本，工程师逐台远程触发脚本，缩短单台耗时。"},{"l":"B","t":"把两百台实例合并到一个安全组，开放统一的 SSH 入口，方便工程师批量连接。"},{"l":"C","t":"外包给运维服务商，按月付费由服务商安排人力逐台巡检。"},{"l":"D","t":"用 Systems Manager 按标签选定目标实例批量执行命令——代理托管执行，无需逐台 SSH，漏网实例由清单核对。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 大规模运维的答案不是加人或缩短单台耗时，是把「按属性找目标、批量施加操作」变成托管能力。Systems Manager 按标签选定目标、代理在实例内执行命令，一轮操作分钟级完成；清单能力还能核对纳管率，漏网实例无所遁形。\n\n**其他选项为什么错：**\n- A：脚本统一了，执行方式仍是逐台人工触发，规模问题原样保留。\n- B：合并安全组扩大暴露面，SSH 批量连接仍依赖人在场，方向反了。\n- C：外包人力是「加人」路线，正文口诀「大规模运维的答案不是加人，是定义期望状态」。\n\n**关键概念：** 与软件定义基础设施交互：按元数据选目标、托管代理执行，替代逐台人工。","s":"自编·2.3.2"},{"id":"D2-064","d":2,"t":"single","q":"一个团队要做一个修复类自动化：每当实例的状态变成「已停止且带修复标签」时就自动重启并记录。这个动作不是按时间表执行的，完全由资源状态变化驱动，且要求从状态变化到修复开始不超过一分钟。\n\n最贴合的触发方式是？","o":[{"l":"A","t":"EventBridge 计划触发——每五分钟轮询一次实例状态表，发现目标状态就执行修复。"},{"l":"B","t":"Lambda 内部长轮询——函数持续订阅状态接口，发现变更后原地执行修复。"},{"l":"C","t":"人工值守——安排值班工程师盯着状态面板，发现目标状态手工执行。"},{"l":"D","t":"EventBridge 事件触发——用规则匹配实例状态变更事件，命中即启动修复流程。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文给的分工：「资源变更后的修复用事件触发」。实例状态变化本身就是事件，EventBridge 规则按事件模式匹配、命中即触发，延迟秒级，天然满足「一分钟内开始修复」的要求。\n\n**其他选项为什么错：**\n- A：计划轮询引入最长五分钟延迟，还可能漏掉轮询间隙内又变化的状态。\n- C：人工值守就是这次要消灭的对象。\n- B：函数长轮询占用执行时长、超时即断，事件机制本来就是为此设计的。\n\n**关键概念：** 事件驱动修复：状态变化即触发，无需轮询；定时任务才走计划触发。","s":"自编·2.3.2"},{"id":"D2-065","d":2,"t":"single","q":"一个团队在梳理「与 AWS 软件定义基础设施交互」的方法分工：基础设施的创建与更新是一类，实例内部状态（代理、补丁、配置）的保持是另一类。有成员主张用一套工具覆盖两类，减少学习成本。\n\n按正文分工，正确的做法是？","o":[{"l":"A","t":"全部用 CloudFormation——实例内部的代理与补丁也写成模板资源，随栈一起部署。"},{"l":"B","t":"全部用 SSH 脚本——基础设施用脚本创建，实例内部用脚本配置，工具最统一。"},{"l":"C","t":"两层各管一段：基础设施靠 CloudFormation（或 CDK/SAM）建出来，实例内部状态靠 SSM 代理能力保持住，谁也不替代谁。"},{"l":"D","t":"全部用 State Manager——实例状态与底层资源的创建更新都由关联管理。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文的原话：「基础设施靠 CloudFormation 建出来，实例内部状态靠 State Manager 保持住——两层各管一段，谁也不替代谁」。这两层的对象不同：一个是云资源的生命周期，一个是实例内部软件状态，能力边界本来就不重叠。\n\n**其他选项为什么错：**\n- A：CloudFormation 部署完就退出运行时，实例内部的持续偏离它管不到。\n- B：脚本创建基础设施放弃了声明式模板的漂移检测与变更集能力。\n- D：State Manager 管不了资源创建与栈生命周期，越界使用必然残缺。\n\n**关键概念：** IaC 建资源、SSM 保持状态——交互方法按对象分层，不追求一套通吃。","s":"自编·2.3.2"},{"id":"D2-066","d":2,"t":"single","q":"一个团队有 300 台 EC2，补丁全靠季度手工刷，每次漏十几台。平台团队要改造：生产实例只打安全补丁且限定在夜间维护窗口，开发实例全量随时打，打完出合规报告，下个季度实现零手工。\n\n最贴合的方案是？","o":[{"l":"A","t":"用 SSM Patch Manager：补丁基线分两档定义「打哪些补丁」，维护窗口定时执行，清单确认纳管率，合规报告自动产出。"},{"l":"B","t":"维护窗口定在夜间，工程师在窗口内手工逐台执行补丁脚本，打完汇总报告。"},{"l":"C","t":"用 Config 规则评估每台实例的补丁状态，发现缺补丁的实例生成工单，人工认领处理。"},{"l":"D","t":"把季度手工刷改为月度手工刷，缩短暴露窗口，人力需求保持不变。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文场景举例的原型就是这个改造：「补丁基线分两档——生产只打安全补丁且限定维护窗口，开发全量随时打」，配清单确认纳管率与合规报告，实现「补丁窗口夜里跑，早上看报告」的零手工。基线管「打哪些」，维护窗口管「什么时候打」。\n\n**其他选项为什么错：**\n- B：窗口内的手工执行仍是手工，「漏十几台」的根因没有消除。\n- C：Config 只评估不出手——它能发现缺补丁，工单还是落到人头上。\n- D：把季度改成月度只是加密手工频率，规模化问题原样存在。\n\n**关键概念：** 补丁基线（打哪些）＋维护窗口（何时打）＋清单（纳管率）＝Patch Manager 组合拳。","s":"自编·2.3.3"},{"id":"D2-067","d":2,"t":"single","q":"一个团队在划分 Config 与 Systems Manager 的职责边界。有成员认为两者高度重叠：「都是管配置的，选一个深耕就行」。平台团队要按两者的分工把边界讲清楚。边界讲不清，补丁、合规、拉回三件事就会选错服务，组合方案也搭不起来。\n\n准确的分工描述是？","o":[{"l":"A","t":"SSM 管实例内部状态（代理、补丁、期望配置），Config 管资源外部配置（配置历史、规则评估、漂移发现）——对象不同，互补不重叠。"},{"l":"B","t":"SSM 与 Config 都管实例内部状态，区别只是 SSM 面向工程师、Config 面向审计。"},{"l":"C","t":"Config 管实例内部状态，SSM 管资源外部配置，两者的分工与常规认知相反。"},{"l":"D","t":"两者完全重叠，Config 是 SSM 的图形界面版本，选哪个只影响使用习惯。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文的原话：「SSM 管实例内部状态，Config 管资源外部配置」。SSM 的代理能力作用于操作系统内部（补丁、代理配置、期望状态），Config 的对象是云资源的配置形状（历史、规则、漂移），两者各管一段，组合使用才是完整闭环。\n\n**其他选项为什么错：**\n- B：对象都写错了——Config 不进操作系统内部，受众差异也不是分工本质。\n- C：分工方向说反了，按这个设计落地会两头落空。\n- D：「完全重叠」是最大的误判，正文口诀「三件事三个服务，各管一层」。\n\n**关键概念：** SSM 管内部、Config 管外部；漂移发现（Config）与拉回（State Manager）是核心题眼。","s":"自编·2.3.3"},{"id":"D2-068","d":2,"t":"single","q":"Config 规则发现一个生产安全组与模板定义不一致：入站端口被改宽了。团队核对后发现这是一周前的救急改动（当时在止血一次故障），并非误操作。团队要按漂移处理的正确顺序处置这份漂移。\n\n正确的处置顺序是？","o":[{"l":"A","t":"立即回滚资源到模板定义——漂移一律视为风险，先恢复原状再讨论。"},{"l":"B","t":"保留漂移不动，在 Config 里把该规则静音，避免持续告警。"},{"l":"C","t":"先判断漂移性质：救急改动写回模板走评审部署，误操作回滚资源——本例是救急，把端口改动写回模板。"},{"l":"D","t":"把安全组从模板中移除，改为手工管理，从根本上消除漂移告警。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文给的漂移处理顺序：「Config 发现资源级漂移 → 判断是手工救急还是误操作 → 救急改动写回模板，误操作回滚资源」。本例判定为救急，处置就是把改动写回模板、走评审与流水线部署，让线上状态重新受模板管理。\n\n**其他选项为什么错：**\n- A：救急改动承载着故障止血的意图，直接回滚可能把故障放回来——先判性质再动手。\n- B：静音告警只是不看，漂移依然存在，下次按模板更新还会踩。\n- D：移出模板管理是放弃 IaC，安全组恰恰是最需要留痕的对象。\n\n**关键概念：** 漂移处理三步：发现 → 判性质 → 写回模板或回滚资源。","s":"自编·2.3.3"},{"id":"D2-069","d":2,"t":"single","q":"一个团队想把漂移处理全自动：Config 发现任何偏离模板的配置就自动回滚到模板定义。平台工程师提醒这个方案有边界——有些漂移不能盲目自动修，否则会出事故。团队要先把「什么时候不能自动修」写成红线，再开放自动修复能力。\n\n准确的边界描述是？","o":[{"l":"A","t":"自动修复只对生产资源开放，非生产资源的漂移一律手工处理。"},{"l":"B","t":"不是所有漂移都能自动修——期望状态没定义的（如某张特殊白名单），只能先告警人工判断；盲目自动修会把救急改动抹掉。"},{"l":"C","t":"自动修复的前提是漂移发生时间超过 24 小时，新漂移先观察再处理。"},{"l":"D","t":"自动修复只适用于 IAM 与网络资源，存储类资源的漂移必须手工修。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文的原话：「不是所有漂移都能自动修——期望状态没定义的（如某张特殊白名单），只能先告警人工判断；盲目自动修会把救急改动抹掉」。自动修复的前提是「期望状态先存在」，模板没定义的东西谈不上「拉回」。\n\n**其他选项为什么错：**\n- A：按生产与非生产划分没有依据，能不能自动修取决于期望状态是否已定义。\n- C：观察期不是修复边界，拖 24 小时反而扩大漂移暴露窗口。\n- D：按资源类型划分是拍脑袋，同一类资源有定义就可修、没定义就不可修。\n\n**关键概念：** 自动修复的前提：期望状态定义先于修复存在；没有定义的漂移先告警人工判断。","s":"自编·2.3.3"},{"id":"D2-070","d":2,"t":"multiple","q":"一个团队给新人出「SSM 托管实例三件套」的测验题，要求把清单、状态、补丁三个能力的职责说清楚，避免把 Config 的能力错安到 SSM 头上。新人考核以全对为通过线，职责错位视同未掌握。\n\n下列说法正确的三项是？（请选择三项）","o":[{"l":"A","t":"清单（Inventory）自动收集实例的软件、配置与文件信息，集中可查。"},{"l":"B","t":"Patch Manager 用补丁基线定义「打哪些补丁」，用维护窗口定义「什么窗口打」。"},{"l":"C","t":"Config 负责把实例内部状态拉回期望值，偏离即自动纠正。"},{"l":"D","t":"State Manager 声明期望状态，代理自动把实例拉回状态，偏离即纠正。"},{"l":"E","t":"维护窗口是 Config 提供的定时评估能力，用于按窗口执行规则。"}],"a":["A","B","D"],"e":"**正确答案：ABD。**\n\n**为什么对：** 三条正是 SSM 三件套的定义：清单收集现状（A）、State Manager 拉回期望状态（D）、Patch Manager 用基线加窗口管补丁（B）。三者对象都是实例内部，能力互不重叠。\n\n**其他选项为什么错：**\n- C：拉回期望状态是 State Manager 的能力，Config 只记录与评估、不出手纠正——把两者混同是最常见的错法。\n- E：维护窗口是 SSM Patch Manager 的执行机制，不是 Config 的能力。\n\n**关键概念：** Inventory 看现状、State Manager 保状态、Patch Manager 管补丁；Config 管资源外部——三者都在实例内部发力，Config 的评估与告警是另一条线，能力清单不能互相借用。","s":"自编·2.3.3"},{"id":"D2-071","d":2,"t":"single","q":"一个团队的 Lambda 自动化负责「按工单开通资源」，某天同一个工单触发了两次函数执行，结果开通了两套相同的环境，多花了一笔钱。团队复盘时要给 Lambda 单元设计定一条硬规则，防止此类事故重现。\n\n这条硬规则是？","o":[{"l":"A","t":"给函数设置更长的超时时间，让第一次执行充分完成，第二次触发自然跳过。"},{"l":"B","t":"函数必须幂等——重复执行结果不变；自动化会被事件重复触发，不幂等就重复扣费、重复开资源。"},{"l":"C","t":"在函数入口加随机延迟，错开两次触发的时间窗口，降低撞车概率。"},{"l":"D","t":"把开通动作改成人工审批，每张工单由人确认后再执行，杜绝重复。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文的原话：「一个函数一个动作，且要幂等（重复执行结果不变）——自动化会被事件重复触发，不幂等就重复扣费、重复开资源」。事件系统的重复投递是常态不是异常，函数必须靠幂等设计（如按工单号判重）把重复触发变成无害操作。\n\n**其他选项为什么错：**\n- A：加长超时不解决重复触发，两次执行照样各自完整跑一遍。\n- C：随机延迟只是赌两次触发不撞车，撞上照样双开。\n- D：全部改人工审批等于放弃自动化，方向倒退。\n\n**关键概念：** 幂等加编排，是自定义自动化的两条腿；重复触发靠幂等消化。","s":"自编·2.3.4"},{"id":"D2-072","d":2,"t":"single","q":"一个团队要做资源回收自动化：先按标签筛选实例，再逐台检查是否有人在用（在用则跳过并通知），关停后写记录，其中「检查是否在用」需要人工确认环节。整个流程有分支、有重试、有审批。\n\n最贴合的方案形态是？","o":[{"l":"A","t":"把流程定义成 Step Functions 状态机——分支、并行、重试、错误捕获全在定义里，审批环节作为状态显式声明。"},{"l":"B","t":"写在一个 Lambda 函数里——用代码 if-else 处理分支，循环加重试，审批用邮件轮询。"},{"l":"C","t":"拆成多个独立 Lambda，靠约定俗成的调用顺序串联，出错时人工重跑。"},{"l":"D","t":"用定时脚本整批执行——每天凌晨一次性跑完筛选、检查与关停，失败项第二天重试。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文取舍口吻原话：「多步、要重试、要人工审批的流程必须 Step Functions——把重试逻辑写进每个函数里是维护灾难」。状态机把分支、并行、重试、错误捕获全放在定义里，审批是显式状态，流程走到哪一目了然。\n\n**其他选项为什么错：**\n- B：分支重试散落在函数代码里，正是正文点名的维护灾难；邮件轮询的审批也不可靠。\n- C：靠约定串联的调用链没有编排层，断在哪一步都查不清。\n- D：整批脚本没有断点续跑与分支能力，失败重试粒度是「一整天」。\n\n**关键概念：** 状态机管编排：分支、并行、重试、错误捕获、人工审批全在定义里。","s":"自编·2.3.4"},{"id":"D2-073","d":2,"t":"single","q":"一个团队的关停自动化状态机在某次执行中途失败（第 37 台实例检查超时）。运维重试后流程从断点继续，前 36 台的处理记录完好无损，没有任何实例被处理两次。有成员问：为什么不能把重试逻辑写进每个 Lambda 里，效果不是一样吗？\n\n按正文口径，准确的回答是？","o":[{"l":"A","t":"效果一样，写在函数里还省去状态机费用，是更经济的做法。"},{"l":"B","t":"重试写在函数里每次都从头执行，同一台实例会被处理两次——正文场景里正是靠编排的断点续跑避免了重复处理。"},{"l":"C","t":"函数内重试只在网络错误时有效，业务错误要靠人工介入，两者不能比较。"},{"l":"D","t":"重试次数上限不同——函数内重试最多三次，状态机可以无限重试。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文场景举例的原话：「某次状态机中途失败，重试从断点续跑——如果重试写在 Lambda 里，同一台实例就会被处理两次」。函数内重试是「整个函数重跑」，前面已完成的动作会重复执行；编排层重试是「从失败状态继续」，已完成的状态不回退。这正是幂等之外编排存在的核心价值。\n\n**其他选项为什么错：**\n- A：「效果一样」忽略了重复执行问题，对资源操作类自动化是事故级差异。\n- C：两者的差别不在错误类型，在重试粒度——函数粒度还是状态粒度。\n- D：重试次数上限是配置项，不是两者本质差异，答非所问。\n\n**关键概念：** 编排重试从断点续跑，函数内重试整段重跑——重复处理风险在这里分岔。","s":"自编·2.3.4"},{"id":"D2-074","d":2,"t":"multiple","q":"一个团队在定 Lambda 自动化的单元设计规范，评审会上出现了几种说法。团队要挑出符合正文设计原则的两条写进规范，其余按「待讨论」挂起。规范的目标是让单元设计有底线，不再依赖个人经验。\n\n关于 Lambda 单元设计，正确的两项是？（请选择两项）","o":[{"l":"A","t":"把重试逻辑写进每个函数内部，让每个函数都具备自我恢复能力。"},{"l":"B","t":"一个函数一个动作，保持单元职责单一，便于组合与复用。"},{"l":"C","t":"把全部自动化逻辑打包进一个大函数，减少函数数量便于管理。"},{"l":"D","t":"每个函数都要幂等——重复执行结果不变，以消化事件的重复触发。"},{"l":"E","t":"单步任务也要上状态机编排，让所有自动化都有统一的执行入口。"}],"a":["B","D"],"e":"**正确答案：BD。**\n\n**为什么对：** 正文的原话：「一个函数一个动作，且要幂等（重复执行结果不变）」。职责单一让函数可组合、可测试；幂等让重复触发无害——自动化被事件系统重复投递是常态，这两条是单元设计的底线。\n\n**其他选项为什么错：**\n- A：把重试写进每个函数是正文点名的维护灾难——重试属于编排层，不该散落在函数里。\n- C：大函数一错全断、无法按动作粒度重试，与单元设计背道而驰。\n- E：单步任务 Lambda 直连即可，为简单事上状态机是反模式。\n\n**关键概念：** 单一动作＋幂等＝Lambda 单元设计两条底线；重试归编排层管。","s":"自编·2.3.4"},{"id":"D2-075","d":2,"t":"multiple","q":"一个团队在定自动化触发方式的选用规范，把几种场景列出来让团队对号入座：定时清理、资源变更修复、人工审批环节等。规范要求每个场景的触发方式有明确依据，不留「都行」的空间。\n\n关于触发方式，正确的两项是？（请选择两项）","o":[{"l":"A","t":"定时资源清理用计划触发——按时间表执行，与资源事件无关。"},{"l":"B","t":"所有自动化统一用计划轮询触发，每五分钟查一次状态最稳妥。"},{"l":"C","t":"资源变更后的修复用事件触发——状态变化即命中规则，秒级启动。"},{"l":"D","t":"人工审批环节用计划触发——到点自动批准，保证流程不卡住。"},{"l":"E","t":"触发方式只影响启动时机，与流程设计完全无关，可以随意选择。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** 两条正是正文给的触发分工：「定时资源清理用计划触发，资源变更后的修复用事件触发」。时间驱动的任务走时间表，事件驱动的任务走事件规则——按驱动力选触发，不留随意空间。\n\n**其他选项为什么错：**\n- B：全靠轮询引入固定延迟，还可能漏掉轮询间隙的变化，事件机制本来为此而生。\n- D：审批是「等人决定」，自动到点批准等于取消审批，含义完全变了。\n- E：触发方式决定流程的驱动模型（时间驱动还是事件驱动），是设计的一部分。\n\n**关键概念：** 计划触发管定时、事件触发管响应；审批环节是人驱动的状态，不是定时任务。","s":"自编·2.3.4"},{"id":"D2-076","d":2,"t":"single","q":"一个团队的监控代理经常被人「排障时顺手卸载」，监控就瞎了，事后没人记得装回去。团队要一个机制：代理被卸后自动装回，同时给排障团队留一条合规的临时摘除通道。机制上线后，卸了又忘装回的情况要彻底消失。\n\n最贴合的方案是？","o":[{"l":"A","t":"发布制度通知，禁止在排障时卸载监控代理，违规者通报批评。"},{"l":"B","t":"用 State Manager 建关联：目标＝带监控标签的全部实例，动作＝安装并启动代理，周期检查偏离即装回；临时摘除改用打标签退出关联范围。"},{"l":"C","t":"把代理安装脚本放进启动镜像，要求每次发现代理缺失就重启实例恢复。"},{"l":"D","t":"用 Config 规则发现代理缺失并生成告警，值班工程师收到告警后手工重装。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文场景举例的原型就是这个：「用 State Manager 建关联：目标＝带监控标签的全部实例，动作＝安装并启动代理，每 30 分钟检查。有人卸了，下个周期自动装回——排障要临时摘除的团队改用打标签退出」。期望状态不是和人为敌，是把约定变成自动执行。\n\n**其他选项为什么错：**\n- A：制度靠自觉，正文的目标正是把「约定」变成「自动执行」。\n- C：重启实例恢复代理代价大、粒度粗，还可能打断业务。\n- D：Config 只发现不纠正，手工重装还是回到「事后没人记得」的老路。\n\n**关键概念：** 期望状态＝声明应该是什么样＋持续拉回；合规退出通道用标签管理。","s":"自编·2.3.5"},{"id":"D2-077","d":2,"t":"single","q":"一个团队用 SSM State Manager 管理监控代理的期望状态。平台团队要向新人解释「关联（association）」的构成：它把哪些东西绑在一起、新实例怎么自动进入管理范围、检查按什么节奏跑。解释要按关联的定义展开，三要素一个都不能少。\n\n对关联三要素的准确描述是？","o":[{"l":"A","t":"关联绑定账号、区域与配额——三者决定关联的生效范围与执行上限。"},{"l":"B","t":"关联绑定镜像、密钥与网络——三者决定代理安装的环境依赖。"},{"l":"C","t":"关联绑定三要素：SSM 文档（定义动作）、目标（标签或实例 ID，打上新标签的实例自动纳入）、调度（定时或变更触发）。"},{"l":"D","t":"关联绑定 IAM 用户、密钥与审计日志——三者决定关联的权限与追溯。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文的原话：「关联（association）把『文档 + 目标实例 + 计划』绑定，代理周期性执行并自纠偏离」，机制节展开为三要素：SSM 文档、目标（标签或实例 ID）、调度。标签目标让新实例打上标签即自动纳入，调度决定检查节奏——三个问题各有归属。\n\n**其他选项为什么错：**\n- A：账号、区域、配额是部署环境参数，不是关联的构成。\n- B：镜像、密钥、网络是实例环境要素，与关联机制无关。\n- D：关联的执行身份由托管服务承担，不走用户密钥，审计日志是产出不是要素。\n\n**关键概念：** 关联三要素：文档（做什么）、目标（对谁做）、调度（何时做）。","s":"自编·2.3.5"},{"id":"D2-078","d":2,"t":"single","q":"一个新项目的技术方案里写了「用 AWS OpsWorks（Chef 托管）管理实例上的应用配置，保证持续符合期望状态」。评审时架构师要求复核这个选型——项目是新客户的新建环境，没有历史包袱。复核结论要写清替代方案与理由，供方案修订直接引用。\n\n正确的复核结论是？","o":[{"l":"A","t":"维持原选型——OpsWorks 的 Chef 托管是最成熟的期望状态方案。"},{"l":"B","t":"改用 Service Catalog 承担期望状态——目录产品可以约束实例内部配置。"},{"l":"C","t":"改用 Config 承担期望状态——Config 规则可以把实例配置持续拉回。"},{"l":"D","t":"OpsWorks（Chef/Puppet 托管）已停止向新客户开放，新设计正解倾向 State Manager——托管、无代理维护负担、与清单补丁同平台。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文给的位置判断原话：「OpsWorks 的 Chef/Puppet 托管已停止向新客户开放，新设计正解倾向 State Manager——托管、无代理维护负担、与清单补丁同平台」。新建环境引入一个不接纳新客户的服务，评审必然打回；State Manager 与清单、补丁同在 SSM 平台，运维面统一。\n\n**其他选项为什么错：**\n- A：与停止开放的事实冲突，成熟与否改变不了准入问题。\n- C：Config 只发现与评估，拉回状态不是它的能力。\n- B：Service Catalog 约束的是基础设施申请，管不到实例内部配置。\n\n**关键概念：** 应用配置到期望状态：State Manager 是 AWS 原生载体，OpsWorks 是历史选项。","s":"自编·2.3.5"},{"id":"D2-079","d":2,"t":"multiple","q":"一个团队在学「期望状态配置」的设计原则，评审会上出现了几种说法。团队要挑出正确的两条写进设计规范，防止把「自动拉回」用成「自动制造事故」。\n\n关于期望状态与工具分工，正确的两项是？（请选择两项）","o":[{"l":"A","t":"State Manager 可以替代 CloudFormation 管理基础设施的创建与更新。"},{"l":"B","t":"基础设施靠 CloudFormation 建出来，实例内部状态靠 State Manager 保持住——两层各管一段，谁也不替代谁。"},{"l":"C","t":"先开启自动修复，期望状态定义可
