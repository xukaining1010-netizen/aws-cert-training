hts 语法与指标过滤器的模式完全一致——Insights 是 fields/filter/stats/sort 的查询语言，与模式串不是一套东西。"},{"l":"C","t":"三种语法各自独立、毫无关联，要分别完整学习三套——模式语法两处同源可以合并学，这个说法夸大了学习成本。"},{"l":"D","t":"订阅过滤器的模式写法与指标过滤器同源，都是日志模式语法——学一个够两处用；Insights 则是独立的查询语言，字段聚合另学。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文原话：订阅过滤器的模式写法与指标过滤器同源，都是日志模式语法——学一个够两处用；Insights 用类似 SQL 的查询（fields、filter、stats、sort）做统计聚合，是另一套语法体系。学习路径因此清晰：模式串一学管两处，Insights 单独学管聚合。\n\n**其他选项为什么错：**\n- A：两套体系不同，混为一谈会写出两边都不认的查询。\n- B：Insights 是聚合查询语言，与模式串不是一个体系。\n- C：模式语法两处同源，学习成本没有「三套独立」那么大。\n\n**关键概念：** 模式语法＝过滤器与订阅共用（学一管二）；Insights＝独立查询语言（fields/filter/stats/sort）管聚合与出图。","s":"自编·4.1.12"},{"id":"D4-029","d":4,"t":"single","q":"一个电商平台的应用流量每天有明显的早晚高峰与深夜低谷，运维团队用固定阈值配 CPU 告警：阈值调低深夜天天误报，调高高峰期又漏报。团队要换一种告警机制匹配这种周期形态。\n\n最贴合的机制是？","o":[{"l":"A","t":"用 CloudWatch 异常检测告警——它对指标建机器学习模型，按历史形态判断当下是否异常，周期性强、阈值难定的指标正适合。"},{"l":"B","t":"把固定阈值拆成早晚各一条静态告警——时段切分是人工近似，节假日与促销形态一变又得重调。"},{"l":"C","t":"把告警评估周期拉长到一小时——拉长窗口只会钝化响应，误报漏报的结构性矛盾没解决。"},{"l":"D","t":"改用指标过滤器从日志统计 CPU——CPU 本来就是现成指标，不需要从日志造，方向就错了。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文给的判断依据：异常检测告警不设固定阈值，CloudWatch 对指标建机器学习模型，按历史形态判断当下是否异常；适合周期性强、阈值难定的指标——流量每天有高峰低谷，静态阈值要么误报要么漏报。题干的形态正是它的适用场景。\n\n**其他选项为什么错：**\n- B：按时段拆静态告警是人工近似，形态一变就要重调，维护成本高且不完整。\n- C：拉长评估周期钝化响应，解决不了阈值与形态的错配。\n- D：CPU 是现成的标准指标，与从日志造指标无关。\n\n**关键概念：** 异常检测告警＝机器学习模型按历史形态判异常；周期性强、阈值难定就用它，别再跟静态阈值较劲。","s":"自编·4.2.1"},{"id":"D4-030","d":4,"t":"single","q":"一个团队第一次给关键业务指标配异常检测告警，架构师向新成员解释它与静态阈值告警的机制差异与职责边界。会后有成员整理了几条说法发在群里，其中一条理解错了，架构师要求指出来。\n\n哪条是错误的理解？","o":[{"l":"A","t":"异常检测不设固定阈值，按指标的历史形态动态判断——这是它的基本机制。"},{"l":"B","t":"它由 CloudWatch 用机器学习模型学习指标历史形态——模型建好后按形态判异常。"},{"l":"C","t":"它适合周期性强、人工阈值难定的指标——早晚高峰这类形态正是适用场景。"},{"l":"D","t":"它能预知未来流量并自动扩容——告警只负责判断异常与触发动作，预知未来与自动扩容都超出了它的职责。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 异常检测告警的职责边界要分清：它对指标建机器学习模型、按历史形态判断当下是否异常，触发后执行配置的动作（通知、扩容等）——「预知未来」不是它的能力，「自动扩容」是触发动作的事，不是检测机制本身。把两者混为一谈就是这条错误理解。\n\n**其他选项为什么错：**\n- A：这是正文原话的机制描述，理解正确。\n- B：机器学习模型学历史形态正是它的实现方式，理解正确。\n- C：周期性强、阈值难定正是正文点名的适用场景，理解正确。\n\n**关键概念：** 异常检测＝按历史形态判当下异常；它不预知未来、不自动扩容——扩容是触发动作链路的事。","s":"自编·4.2.1"},{"id":"D4-031","d":4,"t":"single","q":"一个系统的监控图上出现异常：RDS 的队列长度指标持续攀升，应用侧请求延迟同步上涨，EC2 的 CPU 却一直平稳，ALB 层也没有 5xx 异常。团队要按「指标—含义」的对应关系判断瓶颈在哪一层，再决定去哪排查。\n\n正确的判断是？","o":[{"l":"A","t":"瓶颈在 EC2 计算层，继续扩容应用服务器——CPU 平稳说明计算层不是瓶颈，扩容无效。"},{"l":"B","t":"瓶颈在 ALB 层，检查负载均衡器的 5xx 指标——5xx 涨是后端应用问题的信号，与数据库队列攀升对不上。"},{"l":"C","t":"瓶颈在数据库层——RDS 队列长度持续攀升正是库端瓶颈的信号，应用延迟上涨是它的下游后果。"},{"l":"D","t":"指标之间没有关联，要逐一排查所有层——「指标—含义」的条件反射就是用来快速定位的，不必全扫。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文给的「指标—含义」条件反射：数据库队列涨是库端瓶颈，ALB 5xx 涨是后端应用问题。题干 RDS 队列长度持续攀升加应用延迟上涨、CPU 平稳——瓶颈指向数据库层，计算层与应用层都不是根因。\n\n**其他选项为什么错：**\n- A：CPU 平稳恰恰排除了计算层，扩容是在非瓶颈层烧钱。\n- B：ALB 5xx 在题干里没有异常，这个方向与数据不符。\n- D：指标条件反射的意义就是快速定位，全扫是放弃了这套方法。\n\n**关键概念：** EC2 看 CPU、RDS 看队列长度、ALB 看 5xx 与目标响应时间——指标涨在哪层，瓶颈就在哪层。","s":"自编·4.2.2"},{"id":"D4-032","d":4,"t":"single","q":"一个 Web 服务的用户反馈频繁收到错误页面。运维团队查监控：ALB 的 5xx 错误数明显上涨，目标响应时间同步变长，而 RDS 的队列长度没有变化，EC2 的 CPU 也平稳。团队要判断问题出在哪一层并采取下一步动作。\n\n正确的判断是？","o":[{"l":"A","t":"问题在数据库层，先给 RDS 升配——队列长度没有异常，数据库不是这次问题的指向。"},{"l":"B","t":"问题在后端应用层——ALB 5xx 上涨加目标响应时间变长是后端应用出问题的典型信号，下一步去查应用服务本身。"},{"l":"C","t":"问题在 ALB 本身，重启负载均衡器——ALB 是信号源不是故障源，5xx 涨反映的是它后面的目标出问题。"},{"l":"D","t":"问题在用户侧网络，无法从服务端监控判断——5xx 与响应时间都来自服务端监控，判断依据就在眼前。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文给的对应关系：ALB 看 5xx 错误数与目标响应时间——5xx 涨是后端应用问题。题干两个 ALB 指标同步异常而 RDS 队列平稳，指向后端应用层；下一步动作自然是排查应用服务本身（日志、部署变更等）。\n\n**其他选项为什么错：**\n- A：RDS 队列长度没有变化，数据库不是这次的信号源。\n- C：重启 ALB 解决不了后端应用的问题，方向搞反了。\n- D：5xx 与目标响应时间都是服务端指标，判断依据充分。\n\n**关键概念：** ALB 5xx 上涨＝后端应用问题；目标响应时间同步变长更是佐证。指标条件反射先定位层，再进层排查。","s":"自编·4.2.2"},{"id":"D4-033","d":4,"t":"multiple","q":"一个安全团队在规划 Inspector 的评估范围：平台上有 EC2 实例、ECR 镜像仓库和 Lambda 函数三类资产，团队要弄清 Inspector 的各评估模板分别扫什么、评估的是哪类风险暴露，并与 Config、CloudTrail 的职责边界划清，避免下次排障找错工具。\n\n以下哪些说法正确？（选两项）","o":[{"l":"A","t":"对 EC2 扫操作系统漏洞与网络可达性——实例层面的两类评估内容正是这两项。"},{"l":"B","t":"对 EC2 只扫 CPU 与内存的运行水位——那是监控指标的事，Inspector 做的是漏洞与暴露面评估。"},{"l":"C","t":"评估模板只管触发方式，与扫描内容无关——模板管扫什么、多久扫一次，内容与频率都在里面。"},{"l":"D","t":"对 ECR 扫镜像漏洞——容器镜像的漏洞扫描由 Inspector 对 ECR 完成，推拉镜像时触发评估。"},{"l":"E","t":"Inspector 主要做配置合规检查——那是 AWS Config 的职责，两者的分工别混。"}],"a":["A","D"],"e":"**正确答案：AD。**\n\n**为什么对：** 正文给的分工：Inspector 做漏洞与暴露面评估——对 EC2 扫操作系统漏洞与网络可达性（A），对 ECR 扫镜像漏洞（D），评估模板管扫什么、多久扫一次。\n\n**其他选项为什么错：**\n- B：运行水位是监控指标范畴，Inspector 不做这个。\n- C：评估模板恰好管扫什么与扫描频率，说反了。\n- E：配置合规是 AWS Config 的职责——三工具分工一句话：Config 看配置对不对，Inspector 看漏洞有没有，CloudTrail 看动作谁干的。\n\n**关键概念：** Inspector＝漏洞与暴露面（EC2 系统漏洞与网络可达性、ECR 镜像漏洞）；评估模板管范围与频率。","s":"自编·4.2.3"},{"id":"D4-034","d":4,"t":"single","q":"一家公司的容器平台刚上线，安全团队要求：所有推送到 ECR 的应用镜像在部署前完成漏洞扫描，发现高危漏洞的镜像禁止进入生产环境。团队要选对评估工具并配置扫描策略，让这条要求自动落地。\n\n最贴合的工具与动作是？","o":[{"l":"A","t":"用 AWS Config 规则评估镜像格式——Config 管资源配置合规，不做镜像漏洞扫描，工具选错了。"},{"l":"B","t":"用 Inspector 对 ECR 做镜像漏洞扫描，按评估结果设部署门槛——Inspector 正是镜像漏洞的评估工具，配合评估模板管扫描策略。"},{"l":"C","t":"用 CloudTrail 记录镜像推送动作——CloudTrail 记录的是 API 调用审计，扫不出镜像里的漏洞。"},{"l":"D","t":"让人工抽查镜像里的依赖清单——人工抽查覆盖不了全部镜像，也跟不上推送频率。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文分工明确：Inspector 对 ECR 扫镜像漏洞——推送镜像时触发评估，评估模板管扫什么、多久扫一次。配合流水线把高危扫描结果设为部署门槛，正好满足「部署前完成扫描、高危禁入生产」的要求。\n\n**其他选项为什么错：**\n- A：Config 评估资源配置合规，不做漏洞扫描，职责不对应。\n- C：CloudTrail 是审计通道，记录谁推了镜像，看不到镜像内容里的漏洞。\n- D：人工抽查既不全面也不及时，替代不了自动评估。\n\n**关键概念：** ECR 镜像漏洞扫描＝Inspector；三工具分工：Config 看配置、Inspector 看漏洞、CloudTrail 看动作。","s":"自编·4.2.3"},{"id":"D4-035","d":4,"t":"single","q":"一家公司的安全基线要求：任何安全组不得对全网段放开 22 端口，EBS 卷必须加密。安全团队要一个能持续评估资源配置、偏离基线即标不合规的机制，而不是每次靠人工巡检发现违规。\n\n最贴合的机制是？","o":[{"l":"A","t":"用 AWS Config 规则——规则评估资源配置，安全组与 EBS 加密这类配置偏离即标不合规，持续自动执行。"},{"l":"B","t":"用 Inspector 定期扫漏洞——漏洞扫描与配置基线是两回事，评估对象选错了。"},{"l":"C","t":"用 CloudTrail 审计 API 调用——CloudTrail 记录谁改了什么，判断不了资源配置本身合不合规。"},{"l":"D","t":"每周人工巡检控制台配置——人工巡检既不持续也不可扩展，基线要求要的是自动化评估。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文原话：Config 规则管配置合规——安全组是否放开 22 端口、EBS 是否加密，规则评估资源配置，偏离即标不合规。题干要的「持续评估、偏离即标」正是 Config 规则的工作方式，替代人工巡检。\n\n**其他选项为什么错：**\n- B：Inspector 看漏洞有没有，不看配置对不对，分工不对应。\n- C：CloudTrail 看动作谁干的，是审计通道不是合规评估引擎。\n- D：人工巡检不满足「持续」要求，也覆盖不了多账号规模。\n\n**关键概念：** Config＝配置合规引擎：规则评估资源，偏离即标不合规；安全组开 22 端口、EBS 未加密是典型规则场景。","s":"自编·4.2.4"},{"id":"D4-036","d":4,"t":"single","q":"一个新入职的工程师把三个审计工具的职责背混了：出了配置违规找 Inspector，出了漏洞去翻 CloudTrail，出了越权操作去查 Config——三个方向全部找错。架构师用一个口诀重新给他梳理三个工具的分工，要求他背熟。\n\n正确的分工是？","o":[{"l":"A","t":"Inspector 看配置对不对，Config 看漏洞有没有，CloudTrail 看动作谁干的——三个全部对应错了。"},{"l":"B","t":"三个工具职责相同，查任何问题随便用哪个——分工明确不同，混用会查错方向。"},{"l":"C","t":"CloudTrail 看配置对不对，Inspector 看动作谁干的，Config 看漏洞有没有——又是全错的一组对应。"},{"l":"D","t":"Config 看配置对不对，Inspector 看漏洞有没有，CloudTrail 看动作谁干的——口诀本身，三个职责一一对应。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文给的一句话分工：Config 看配置对不对，Inspector 看漏洞有没有，CloudTrail 看动作谁干的。新工程师的三组对应恰好全部错位——配置违规该查 Config、漏洞该查 Inspector、越权操作该查 CloudTrail。口诀记住，方向就不会错。\n\n**其他选项为什么错：**\n- A：三组对应全错，正好是把口诀背反的版本。\n- B：三工具职责边界清晰，随便用会查错方向。\n- C：同样是全错的对应，与 A 只是顺序不同。\n\n**关键概念：** 一句话分工：Config＝配置合规，Inspector＝漏洞评估，CloudTrail＝API 调用审计。","s":"自编·4.2.4"},{"id":"D4-037","d":4,"t":"multiple","q":"一个团队在配置 CloudTrail 审计策略：审计部门要求「谁在何时从哪个地址调了什么接口」必须有记录；另有一组要求记录 S3 对象级别的读写动作。团队要理解 CloudTrail 的事件类型与默认范围。\n\n以下哪些说法正确？（选两项）","o":[{"l":"A","t":"数据事件与管理事件的记录范围完全相同，都默认开启——默认范围不同，数据事件要单独开启。"},{"l":"B","t":"管理事件默认记录——控制面操作（如创建资源、改配置）默认就在审计范围内。"},{"l":"C","t":"S3 对象级读写属于数据事件，要单独开启——对象级动作不在默认范围，需要显式配置。"},{"l":"D","t":"CloudTrail 只记录失败的操作，成功的调用不记——成功与失败的操作都有记录，这条理解不成立。"},{"l":"E","t":"CloudTrail 记录的是资源配置是否合规——那是 Config 的职责，CloudTrail 记录的是 API 调用动作。"}],"a":["B","C"],"e":"**正确答案：BC。**\n\n**为什么对：** 正文原话：CloudTrail 记录 API 调用——谁在何时从哪个地址调了什么接口，管理事件默认记录，数据事件要单独开启。审计部门的「谁调了什么」由默认的管理事件覆盖（B）；S3 对象级读写属于数据事件，必须显式开启（C）。\n\n**其他选项为什么错：**\n- A：两类事件的默认范围不同，数据事件不开启就没有记录。\n- D：成功与失败的操作都会记录，这条理解与机制相反。\n- E：配置合规判断是 Config 的职责，CloudTrail 只管动作记录。\n\n**关键概念：** CloudTrail 事件两型：管理事件默认记录，数据事件（对象级读写）单独开启；审计「谁在何时调了什么」靠它。","s":"自编·4.2.5"},{"id":"D4-038","d":4,"t":"single","q":"安全团队做了一次审计演练：模拟有人在 S3 桶里读取了一个敏感对象，然后去 CloudTrail 控制台查这次对象级读取的记录，结果一条都没有。而同期的控制台操作（如创建桶、改策略）都有完整记录。团队要弄清为什么缺了这条。\n\n正确的原因是？","o":[{"l":"A","t":"CloudTrail 对 S3 的事件不支持记录——支持，只是对象级读取属于数据事件，没有开启而已。"},{"l":"B","t":"那次读取走的是加密通道，CloudTrail 看不到——加密不影响审计记录，记录在 API 层完成。"},{"l":"C","t":"数据事件要单独开启，默认不记录——对象级读写不在管理事件的默认范围内，没开启就没有这条记录。"},{"l":"D","t":"读取操作不属于 API 调用，CloudTrail 记不了——对象读取同样是 API 动作，只是归类在数据事件里。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文点名的事件类型边界：管理事件默认记录（创建桶、改策略这些控制面动作都有记录），数据事件要单独开启——S3 对象级读写正是数据事件。演练里缺的这条记录，原因就是数据事件没开启，不是 CloudTrail 记不了。\n\n**其他选项为什么错：**\n- A：S3 对象事件支持记录，开启数据事件即可，这个说法否定了能力本身。\n- B：加密与审计记录无关，记录发生在 API 调用层。\n- D：对象读取就是 API 动作，只是被归类为数据事件而非「不可记录」。\n\n**关键概念：** 控制台操作都有记录而对象级读取没有——典型信号就是数据事件未开启；审计对象级动作先开数据事件。","s":"自编·4.2.5"},{"id":"D4-039","d":4,"t":"single","q":"一支运维团队每天早会要过服务状态：轮流登控制台翻指标浪费时间，团队要一面实时更新的状态墙——上半屏放 ALB 5xx 与延迟曲线，下半屏放各环境部署频率与告警状态，投屏在值班室常开自动刷新。\n\n最贴合的工具是？","o":[{"l":"A","t":"CloudWatch 仪表板——折线、数字卡、告警状态等组件拼一面墙，支持自动刷新与投屏，运维盯盘正合适。"},{"l":"B","t":"QuickSight BI 报表——面向业务侧深度分析与管理层报表，不是值班实时盯盘的工具。"},{"l":"C","t":"Logs Insights 手动查询——查询要人去跑，撑不起常开的状态墙。"},{"l":"D","t":"X-Ray 服务地图——画的是调用拓扑与延迟分布，不是运维盯盘的状态墙。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文给的判断：题干要「运维团队实时盯服务健康」——CloudWatch 仪表板。折线图、数字卡、日志查询表格、告警状态都能拼进一块板，投屏场景开着自动刷新，组件刷新间隔可设。正文里的早会场景与题干几乎同型。\n\n**其他选项为什么错：**\n- B：QuickSight 是 BI 层，给管理层与业务出报表，别把 BI 工具塞给值班场景。\n- C：Insights 是交互式查询，人工动作撑不起常开状态墙。\n- D：X-Ray 是链路追踪的服务地图，用途不同。\n\n**关键概念：** 运维盯盘＝CloudWatch 仪表板（自动刷新、投屏、跨账号聚合）；管理层报表＝QuickSight。","s":"自编·4.2.6"},{"id":"D4-040","d":4,"t":"single","q":"公司管理层要求每月出一份跨数据源的业务运营报表：把服务用量、成本与业务指标放在一起做趋势分析，还要支持交互式下钻。运维团队现有的 CloudWatch 仪表板满足不了这种深度分析。\n\n最贴合的工具是？","o":[{"l":"A","t":"再加一块 CloudWatch 仪表板——仪表板是运维盯盘视图，跨数据源深度分析与下钻不是它的强项。"},{"l":"B","t":"用 Logs Insights 写更复杂的查询——查询输出的是控制台结果集，不是面向管理层的报表工具。"},{"l":"C","t":"人工每月从控制台截图拼报表——既不可持续也没有交互能力，管理层要的是可下钻的分析。"},{"l":"D","t":"用 QuickSight 连数据源（直接连 CloudWatch 数据源或经 S3/Athena）做深度分析与报表——BI 层工具，正对管理层与业务受众。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文给的分工：QuickSight 是 BI 层，连数据源（直接连 CloudWatch 数据源或经 S3/Athena）做深度分析与报表，面向业务侧受众；运维盯仪表板，管理层与业务看 QuickSight。题干的跨数据源、下钻、面向管理层三点全部落在 BI 工具上。\n\n**其他选项为什么错：**\n- A：仪表板解决「盯」，解决不了「分析」，再加一块也是盯盘视图。\n- B：Insights 是控制台查询工具，不是报表产品。\n- C：人工截图既不可持续也没有交互，管理层的需求一条都不满足。\n\n**关键概念：** BI 报表与跨数据源分析＝QuickSight（数据经 Athena 出结果集再进报表是常用做法）；别把 BI 工具塞给值班，也别让仪表板去干 BI 的活。","s":"自编·4.2.6"},{"id":"D4-041","d":4,"t":"single","q":"一个队列消费应用的积压深度涨过 1000 并持续三个周期就要扩容，运维要求这个动作全自动完成，而不是发条通知等人处理——夜间的积压高峰尤其等不起人工响应。团队要在自定义指标上配告警并选对触发动作。\n\n正确的配置是？","o":[{"l":"A","t":"告警触发动作只绑 SNS 通知，扩容由值班人员手动执行——「自动处理而不只是通知」的要求没有满足。"},{"l":"B","t":"告警触发动作绑 Auto Scaling 扩容策略——告警不只发通知，直接驱动扩容动作，满足自动处理要求。"},{"l":"C","t":"把阈值改成 500 并提前半小时告警——阈值调整解决不了「通知不等于处理」的问题，人工环节还在。"},{"l":"D","t":"用 Cron 定时任务每小时检查积压并扩容——定时轮询的粒度与实时性都不如告警联动，且逻辑游离在监控体系外。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 告警三要素的第三要素就是触发动作：SNS 通知、Auto Scaling 策略、EC2 恢复或停止等。题干要「自动处理而不只是通知」——触发动作绑 Auto Scaling 扩容策略，积压涨过阈值持续三周期直接扩容。正文的场景举例与题干同型。\n\n**其他选项为什么错：**\n- A：只绑 SNS 是不完整的——正文点名的判断：要自动处理，答案在告警联动 Auto Scaling 或 Lambda。\n- C：阈值与提前量是参数调整，人工处理环节依旧存在。\n- D：定时轮询实时性差，还把扩容逻辑搬出了告警体系。\n\n**关键概念：** 告警触发动作可以直接驱动 Auto Scaling 或 Lambda；「自动处理」场景别停在 SNS 通知。","s":"自编·4.2.7"},{"id":"D4-042","d":4,"t":"single","q":"一次排障中发现：某个关键告警的状态显示为 INSUFFICIENT_DATA 而不是 ALARM，但值班记录里确实发生过指标异常，团队怀疑有一段「静默期」被漏掉了。要弄清这个状态的含义与正确处理方式，避免下次再漏。\n\n正确的理解是？","o":[{"l":"A","t":"INSUFFICIENT_DATA 等同于一切正常，可以忽略——数据不足也是状态，采集中断时告警不会误触发，但也不报警，忽略它会漏掉问题。"},{"l":"B","t":"这个状态说明告警配置写错了，必须删除重建——状态机三态是正常机制，不是配置错误的信号。"},{"l":"C","t":"告警状态机有三个态：OK、ALARM、INSUFFICIENT_DATA——数据不足是第三个态，排障时要查采集链路而不是忽略它。"},{"l":"D","t":"这个状态只会在指标被删除后出现——采集中断、数据延迟都会触发，不止删除这一种原因。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文点名的状态机：告警有三个态——OK、ALARM、INSUFFICIENT_DATA。数据不足也是状态：采集中断时告警不会误触发，但也不报警——这就是「静默期」。排障时看到这个态，正确动作是查采集链路（agent 是否挂了、数据是否延迟），而不是当它不存在。\n\n**其他选项为什么错：**\n- A：正文特别提醒「排障时别忽略它」，当成一切正常会漏掉静默期里的真问题。\n- B：三态是状态机设计，不是配置错误。\n- D：触发原因不止删除一种，采集中断最常见。\n\n**关键概念：** 告警三态：OK、ALARM、INSUFFICIENT_DATA；缺数据不等于没事，排障先查采集链路。","s":"自编·4.2.7"},{"id":"D4-043","d":4,"t":"single","q":"一个团队给某服务的关键指标配了告警，但线上实例 A 的异常始终没触发告警，实例 B 的告警却经常误响。检查发现指标按实例维度分开存储，告警里配的维度组合与目标实例对不上。团队要修正告警配置。\n\n问题出在哪、怎么修？","o":[{"l":"A","t":"告警要挂对维度——同一指标按实例、按环境各有维度组合，维度配错告警就盯错了对象，修正为指向实例 A 的维度组合。"},{"l":"B","t":"告警数量太多导致误判，删掉一半告警——问题在维度错配不在数量，删告警治标不治本。"},{"l":"C","t":"把指标改成无维度再重建告警——丢掉维度等于丢掉按实例拆分的能力，告警会盯到聚合值上。"},{"l":"D","t":"把告警评估周期缩短加快触发——周期再快，盯错了对象就不会响对，根因没被触碰。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文点名的细节：告警要挂对维度——同一指标按实例、按环境各有维度组合，维度配错告警就盯错了对象。题干现象完全符合：A 的异常没响（维度没指向它），B 的告警误响（维度错误指向了它）。修正方向就是把维度组合改对。\n\n**其他选项为什么错：**\n- B：删告警解决不了维度错配，剩下的告警照样盯错。\n- C：无维度指标是聚合值，粒度丢失后按实例定位能力就没了。\n- D：评估周期与盯错对象无关，快慢都响不对。\n\n**关键概念：** 告警挂对维度：维度组合决定告警盯的是哪个对象；A 不响 B 误响的典型根因就是维度错配。","s":"自编·4.2.7"},{"id":"D4-044","d":4,"t":"multiple","q":"一个团队要为 Lambda 函数、API Gateway 与 ECS 容器三类计算形态分别接入 X-Ray 分布式追踪，要求各形态用各自的标准接入开关，不引入多余的常驻组件。平台工程师列了几条接入要点，评审要挑出正确的。\n\n以下哪些说法正确？（选两项）","o":[{"l":"A","t":"Lambda 开启主动追踪即可接入——在函数配置上开主动追踪（环境变量配置），不需要装常驻代理。"},{"l":"B","t":"三种计算形态都要在实例上装 X-Ray 常驻代理——Lambda 与 API Gateway 走各自的开启开关，不需要常驻代理。"},{"l":"C","t":"API Gateway 开启追踪阶段（生产/暂存）即可接入——网关侧按阶段开关追踪。"},{"l":"D","t":"接入失败的常见根因是采样率设太高——最常见的接入失败原因是权限漏配，容器任务角色没授 X-Ray 写权限。"},{"l":"E","t":"Lambda 接入需要在函数内自行安装并常驻一个 X-Ray 代理进程——Lambda 走主动追踪开关，不需要常驻代理。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** 正文给的接入方式按计算形态分：Lambda 开启主动追踪（环境变量配置）（A）；API Gateway 开追踪阶段——生产/暂存（C）；ECS/EKS 用侧车容器或 DaemonSet。三形态各有各的开关，不用都装常驻代理。\n\n**其他选项为什么错：**\n- B：Lambda 与 API Gateway 是配置开关接入，装常驻代理的说法不符合机制。\n- D：正文点名的最常见接入失败原因是权限漏配——容器任务角色没授 X-Ray 写权限；采样率影响开销不是接入成败。\n- E：Lambda 的接入方式是开启主动追踪，不需要也不应该在函数里常驻代理进程，这条与机制相反。\n\n**关键概念：** X-Ray 接入三开关：Lambda 主动追踪、API Gateway 追踪阶段、容器侧车/DaemonSet；接入失败先查权限再查采样。","s":"自编·4.2.8"},{"id":"D4-045","d":4,"t":"single","q":"用户反馈下单接口偶发超时，各单服务的日志都看不出问题——请求要跨七八个微服务，慢在哪一段无从判断。团队怀疑瓶颈藏在跨服务调用的某一段，要引入全链路追踪把每个请求经过的服务与耗时串起来看。\n\n最贴合的工具是？","o":[{"l":"A","t":"CloudWatch Logs Insights——查的是单点日志聚合，串不起跨服务的请求链路。"},{"l":"B","t":"AWS X-Ray——给请求发「通行证」一路盖章记录，服务地图画出调用拓扑，跨服务定位延迟没有替代品。"},{"l":"C","t":"AWS Service Health Dashboard——那是 AWS 服务健康页，跟自己应用的链路无关。"},{"l":"D","t":"CloudWatch 仪表板——展示指标曲线，给不了请求级的跨服务追踪。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文给的判断：题干给「跨服务定位延迟」「分布式追踪」——X-Ray 没有替代品。它从 SDK 或代理收集分段串成追踪，服务地图自动画出调用拓扑；正文场景与题干同型——98 分位延迟集中在下游某段数据库调用，瓶颈锁死不用逐个翻日志。\n\n**其他选项为什么错：**\n- A：Insights 查单点日志，跨不了服务边界——正文点名的干扰项。\n- C：Service Health Dashboard 是 AWS 服务健康页——正文点名的另一个干扰项。\n- D：仪表板是指标视图，请求级链路追踪不在它的能力里。\n\n**关键概念：** 跨服务定位延迟＝X-Ray；Insights 与 Service Health Dashboard 是这条题的两大干扰项。","s":"自编·4.2.8"},{"id":"D4-046","d":4,"t":"single","q":"一个团队给 X-Ray 接入定了成本与检索策略：全量采样太贵，要从低采样率起步按需调整；同时支付类的关键请求要能事后检索出来复盘，不用翻遍全部追踪记录。团队要按这个策略配置采样与检索支持。\n\n正确的配置组合是？","o":[{"l":"A","t":"全量采样保证不漏，事后用服务地图翻——全量采样违背成本策略，开销先爆。"},{"l":"B","t":"从 1% 或 5% 起步按需调采样率，关键请求加注解便于事后检索——采样控开销，注解解决关键请求的检索。"},{"l":"C","t":"关闭采样，只靠日志排查——回到逐服务翻日志的老路，链路视图就没了。"},{"l":"D","t":"把追踪数据保留期调长到一年以便追溯——X-Ray 追踪数据默认保留 30 天，保留期不是这个用途的调节点。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文给的落地细节：采样率决定开销——全量采样贵，从 1% 或 5% 起步按需调；关键请求可加注解便于事后检索。两个动作合起来正好对应成本策略与检索需求。\n\n**其他选项为什么错：**\n- A：全量采样直接违背成本策略，开销先失控。\n- C：关掉采样就没有链路视图，跨服务定位能力直接丢失。\n- D：追踪数据默认保留 30 天，把保留期当检索方案既贵也不对路，注解才是检索手段。\n\n**关键概念：** 采样率起步 1%~5% 控开销；关键请求加注解支持事后检索；追踪数据默认保留 30 天。","s":"自编·4.2.8"},{"id":"D4-047","d":4,"t":"single","q":"一个平台每秒上万条访问日志，安全组与推荐系统两个团队都要消费同一份日志流：安全组要求低延迟读取，推荐组按批消费即可。有人建议继续用订阅过滤器直推 Lambda，架构师指出吞吐与多消费者需求已经超出了这个形态。\n\n正确的管道方案是？","o":[{"l":"A","t":"日志订阅进 Kinesis Data Streams，安全组走增强型扇出低延迟读取，推荐组常规拉取按批消费——量大、多下游就走流式管道，一条流喂两边互不影响。"},{"l":"B","t":"维持订阅直推 Lambda，给两个团队各复制一个 Lambda——Lambda 是单一处理逻辑的形态，复制两份各自翻倍消费，吞吐与互不影响都撑不住。"},{"l":"C","t":"把日志导出到 S3 让两组分别下载分析——批量导出与「每秒上万条、低延迟」的要求差着量级。"},{"l":"D","t":"让两个团队共用一个 Lambda 串行处理——单一函数串行处理两路需求，吞吐瓶颈与耦合都更糟。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文给的判断：与订阅直推 Lambda 的区别在吞吐与多消费者——量小、单一处理逻辑，订阅直推 Lambda 更简单；量大、多个下游，走 Kinesis 流。题干「每秒上万条、两个消费者」正对流式管道，增强型扇出给安全组专属低延迟管道，推荐组常规拉取互不影响。\n\n**其他选项为什么错：**\n- B：Lambda 形态做不了多消费者的独立管道，复制两份也不解决吞吐。\n- C：导出是事后批量动作，与实时流需求差量级。\n- D：串行耦合比并行复制更糟，吞吐瓶颈更明显。\n\n**关键概念：** 「多消费者」「每秒数万条」→ Kinesis Data Streams；增强型扇出＝每消费者专属管道、低延迟。","s":"自编·4.2.9"},{"id":"D4-048","d":4,"t":"multiple","q":"一个团队在设计日志流式管道时梳理 Kinesis Data Streams 的机制细节：分片容量基准、数据保序承诺、保留期上限与多消费者模型都在评审范围内，评审要确认几条关键认知是否正确，错误的当场纠正。\n\n以下哪些说法正确？（选两项）","o":[{"l":"A","t":"分片是容量单位——每分片写入 1 MB/s、读出 2 MB/s 为基准，容量不够就拆分或加片。"},{"l":"B","t":"流内数据不保证顺序，消费端必须全量重排——流按分片保序，这条说法与机制相反。"},{"l":"C","t":"保留期最长只能 1 天，超期数据自动转入 S3 保存——默认 1 天但可延到 7 天，也不存在自动转存机制。"},{"l":"D","t":"热分片要合并而不是拆分——方向反了，热分片的扩容动作是拆分。"},{"l":"E","t":"增强型扇出走专属管道，每个消费者的配额独立——高并发多消费者场景必选它。"}],"a":["A","E"],"e":"**正确答案：AE。**\n\n**为什么对：** 正文给的机制细节：分片是容量单位——每分片写入 1 MB/s、读出 2 MB/s 为基准，不够就拆分或加片（A）；增强型扇出走专属管道，每消费者配额独立，高并发场景必选（E）。两条正是管道设计的核心认知。\n\n**其他选项为什么错：**\n- B：流内数据按写入顺序保序，乱序需求才在消费端重排，说法与机制相反。\n- C：保留期默认 1 天、可延到 7 天，但不存在「超期自动转存 S3」的机制，这条前半对后半编造。\n- D：热分片的扩容动作是拆分，合并是冷分片的收缩动作，方向反了。\n\n**关键概念：** 分片＝1 MB/s 写、2 MB/s 读；热分片拆分、冷分片合并；增强型扇出＝专属管道独立配额。","s":"自编·4.2.9"},{"id":"D4-049","d":4,"t":"single","q":"一个日志流的下游消费者处理变慢，流内出现积压，监控显示分片写入接近上限，值班群里已经有人提议直接拆分扩容。团队要按正确的排查顺序处理，避免一上来就盲目扩容。\n\n正确的排查顺序是？","o":[{"l":"A","t":"直接拆分分片扩容，积压自然消化——下游消费不动才是根因，只扩流不扩消费，积压还会回来。"},{"l":"B","t":"把保留期延长到 7 天，让积压慢慢清——保留期只是缓冲，消费能力不解决积压就一直涨。"},{"l":"C","t":"关闭增强型扇出消费者减少读取争抢——扇出是专属管道不存在争抢，关闭反而伤了低延迟消费者。"},{"l":"D","t":"先查检查点游标是否落后，再谈扩容——下游消费不动导致积压时，先查游标落后再谈扩容，正文给的排查顺序。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文点名的排查顺序：下游消费不动导致积压时，先查检查点游标是否落后，再谈扩容。游标落后可能是消费端卡住或重启导致的重复读取，修好它比扩容便宜得多；盲目拆分分片只治写入侧，消费瓶颈还在。\n\n**其他选项为什么错：**\n- A：跳过游标检查直接扩容，消费端瓶颈没动，积压还会回来。\n- B：延长保留期是给故障留缓冲的手段，不是清积压的手段。\n- C：增强型扇出是专属管道，不存在争抢，关掉它伤及低延迟消费。\n\n**关键概念：** 流积压排查顺序：先查检查点游标，再谈拆分扩容；保留期是缓冲不是解法。","s":"自编·4.2.9"},{"id":"D4-050","d":4,"t":"single","q":"审计部门要「过去一年所有 root 用户操作清单」：日志早已按生命周期规则归档到 S3，需要用 SQL 过滤并导出结果，且不能动原始数据、查询完只按扫描量付一笔费用。团队要选对查询引擎并搭好前置条件。\n\n正确的方案是？","o":[{"l":"A","t":"用 Logs Insights 查——Insights 查的是 CloudWatch 里的日志，查不了 S3 归档件，选址就错了。"},{"l":"B","t":"把日志全部拉回 CloudWatch 再查——一年体量的数据回流既贵又慢，方向完全反了。"},{"l":"C","t":"用 Glue 数据目录建表指向 S3 日志目录，Athena 跑标准 SQL 过滤导出——S3 日志加 SQL 分析的标准组合，按扫描量付费不动原始数据。"},{"l":"D","t":"用 CloudTrail 控制台重新拉取事件历史——控制台事件查询有范围限制，一年跨度撑不住。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文给的选址口诀：日志在 S3 且要 SQL，用 Athena。落地链路是标准动作：Glue 数据目录建表指向日志目录，Athena 无服务器跑标准 SQL，按扫描量计费，查询完付扫描费、不动原始数据——正文场景与题干几乎同型。\n\n**其他选项为什么错：**\n- A：Insights 查不了 S3——正文点名的反向干扰项。\n- B：回流 CloudWatch 与「长期归档在 S3」的现状背道而驰。\n- D：控制台事件历史查询有范围与保留限制，撑不起一年跨度。\n\n**关键概念：** 选址口诀：日志在 CloudWatch 用 Insights，日志在 S3 且要 SQL 用 Athena（Glue 目录是认表前提）。","s":"自编·4.2.10"},{"id":"D4-051","d":4,"t":"single","q":"一个团队的 Athena 查询账单持续走高：成本大头是大表全表扫描，查询也经常超时，分析师抱怨越查越慢、月账单越交越多。团队要按标准优化动作改造表设计与查询习惯，把扫描量降下来。\n\n最有效的组合是？","o":[{"l":"A","t":"把查询全部改成夜间跑错峰——错峰不改变扫描量，按扫描量计费的成本一分不少。"},{"l":"B","t":"表转列式压缩格式（如 Parquet）并按日期分区（切目录）——列式压缩大幅降本提速，分区把扫描范围收窄，双管齐下。"},{"l":"C","t":"把 S3 桶换成更便宜的存储层——存储费用与查询扫描费用是两笔账，扫描量不变查询成本照旧。"},{"l":"D","t":"删除 Glue 数据目录重建一次——目录是认表前提，重建解决不了扫描量问题，还可能查不到表。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文给的优化动作：Athena 按扫描量计费——表设计成列式压缩格式（如 Parquet）能显著降本提速，大表分区（按日期切目录）是标准动作，成本大头是全表扫描，建好分区就是省钱。两个动作合起来直击「全表扫描」这个成本根因。\n\n**其他选项为什么错：**\n- A：按扫描量计费与跑的时间段无关，错峰省不了查询费。\n- C：存储层降价影响的是存储账，扫描费用不变。\n- D：目录错了只会查不到表，与扫描量无关。\n\n**关键概念：** Athena 降本三板斧：Parquet 列式压缩、按日期分区、查询前收窄分区；全表扫描是成本大头。","s":"自编·4.2.10"},{"id":"D4-052","d":4,"t":"single","q":"一个平台的架构评审里，架构师要求把「事件驱动异步架构」的设计思想讲清楚：为什么生产方只管发事件、消费方订阅自己关心的模式，这套松耦合形态的好处与代价分别是什么，评审记录里要把这段写进设计原则。\n\n正确的描述是？","o":[{"l":"A","t":"生产方只管发事件不关心谁消费，消费方订阅自己关心的模式，彼此解耦——好处是松耦合、易扩展，代价是要处理投递失败与重试。"},{"l":"B","t":"生产方要等所有消费方确认收到才能继续——那是同步调用的形态，与事件驱动的异步思想相反。"},{"l":"C","t":"事件驱动意味着消费方必须轮询生产方拿数据——轮询是拉模式，事件驱动是推模式，方向说反了。"},{"l":"D","t":"事件驱动架构没有代价，天然可靠无丢失——投递失败与重试是这套架构必须面对的代价，这个说法回避了它。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文对事件驱动异步架构的描述正是这句：生产方只管发事件，不关心谁消费；消费方订阅自己关心的模式，彼此解耦。好处是松耦合、易扩展，代价是要处理投递失败与重试。S3 事件通知、EventBridge 到 SNS 或 Lambda 都是这个模式的具体形态。\n\n**其他选项为什么错：**\n- B：等所有消费方确认是同步强耦合，恰好是事件驱动要消除的形态。\n- C：轮询是消费方拉数据，事件驱动的本质是事件推给订阅者。\n- D：任何异步架构都要面对投递失败，回避代价的描述不成立。\n\n**关键概念：** 事件驱动＝发事件不管消费、订阅模式各自处理；考试问「解耦的事件通知架构」指名的就是这一套。","s":"自编·4.3.1"},{"id":"D4-053","d":4,"t":"single","q":"一个电商平台的会话表落在 DynamoDB，大促期间请求量暴涨到日常的几十倍，平时又有长时间低谷，流量完全不可预测。团队要为这张表选容量模式，兼顾扛住波动与控制成本，DBA 与应用团队在会上各执一词。\n\n最贴合的选择是？","o":[{"l":"A","t":"预置模式配自动扩缩——预置加扩缩适合可预测的稳定负载，不可预测的暴涨它跟不上节奏。"},{"l":"B","t":"按需模式——请求量随意波动不用管，不可预测流量正对它；代价是单价更高，但大促场景扛得住。"},{"l":"C","t":"手工在大促前手动调大容量——依赖人工预判，预判失误就是事故，且大促结束后忘了调回就浪费。"},{"l":"D","t":"换成一張更大的 RDS 表扛流量——更换数据库是伤筋动骨的迁移，DynamoDB 本身的容量模式就是为这个问题设计的。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文给的判断：DynamoDB 两种容量模式——按需模式请求量随意波动不用管，预置模式配自动扩缩调读写容量；高波动选按需，稳定负载选预置更省。题干「流量完全不可预测」直接命中按需模式的适用条件。\n\n**其他选项为什么错：**\n- A：预置加自动扩缩适合稳定负载，不可预测的尖峰它调节不过来。\n- C：人工预判不可靠，扩缩模式的意义就是去掉人工环节。\n- D：换数据库不解决容量问题，还引入迁移风险，方向全错。\n\n**关键概念：** DynamoDB 容量模式：不可预测流量→按需；稳定负载→预置加自动扩缩；扩缩对象选错是常见陷阱。","s":"自编·4.3.2"},{"id":"D4-054","d":4,"t":"multiple","q":"一个平台团队在梳理各类 AWS 服务的自动扩缩边界，评审会上有人把几个服务的扩缩对象说串了——数据库扩了规格、容器扩了上限。团队要给「谁扩什么」列一张对照清单写进内部文档，杜绝再混。\n\n以下哪些说法正确？（选两项）","o":[{"l":"A","t":"EC2 Auto Scaling 组扩的是实例数量——按告警或目标追踪策略加减机器。"},{"l":"B","t":"RDS 存储自动扩缩会把实例规格一起升配——它只加盘不改实例规格，改规格是另一回事。"},{"l":"C","t":"EKS 的扩缩全靠手工加节点——Cluster Autoscaler 加节点、HPA 调 Pod 副本，都是自动机制。"},{"l":"D","t":"DynamoDB 扩的是读写容量——两种容量模式调整的都是读写吞吐能力。"},{"l":"E","t":"ECS 的 capacity provider 决定扩缩的对象数量上限——它管的是集群从哪拿算力（Fargate 还是 EC2 组）与权重分配。"}],"a":["A","D"],"e":"**正确答案：AD。**\n\n**为什么对：** 正文给的扩缩边界：ASG 扩的是实例数量，按告警或目标追踪策略调整实例数（A）；DynamoDB 扩的是读写容量，两种容量模式调的都是读写吞吐（D）。两张对照正是「谁扩什么」清单的核心行。\n\n**其他选项为什么错：**\n- B：RDS 存储自动扩缩只加盘不改实例规格——正文点名的扩缩对象陷阱。\n- C：EKS 有 Cluster Autoscaler 与 HPA 两层自动机制，不是手工。\n- E：capacity provider 管算力来源与权重，不是数量上限。\n\n**关键概念：** 扩缩对象对照：ASG＝实例数、RDS 存储＝只加盘、DynamoDB＝读写容量、EKS＝节点与副本、ECS provider＝算力来源。","s":"自编·4.3.2"},{"id":"D4-055","d":4,"t":"single","q":"一次故障演练后复盘：某台 EC2 实例上的应用进程崩溃返回 5xx，值班工程师却在群里提议给这台实例配 CloudWatch 的 EC2 自动恢复动作来「自动修复应用」，另一位工程师当场指出这个提议接错了线，要求把两种场景的边界说清。\n\n正确的辨析是？","o":[{"l":"A","t":"自动恢复只适用于实例级硬件故障（如宿主机失联），应用层故障不在它的管辖内——进程崩溃、返回 5xx 要靠 ASG 换实例或健康检查摘流。"},{"l":"B","t":"自动恢复适用于一切故障场景，包括应用层错误——正文点名的骨架失分点，两种场景不能混。"},{"l":"C","t":"应用进程崩溃只能靠人工登录重启，没有任何自动手段——ASG 换实例与健康检查摘流都是自动手段，这个说法太悲观。"},{"l":"D","t":"把自动恢复的告警阈值调低就能覆盖应用故障——自动恢复的动作对象是实例本身，阈值调多低都管不了进程。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文点名的骨架失分点：EC2 自动恢复只适用于 EC2 实例级故障——硬件故障、宿主机失联这类「实例本身挂了」的场景，靠云平台把实例搬到健康宿主机重启。应用层故障（进程崩、返回 5xx）不在它的管辖内——要靠 ASG 换实例或健康检查摘流。\n\n**其他选项为什么错：**\n- A：内容与正确答案一致但标注位不符。\n- B：把两个场景混为一谈正是考试爱设的陷阱，「应用无响应」题干里自动恢复是错误项。\n- C：ASG 与 ALB 健康检查都是应用层故障的自动手段。\n\n**关键概念：** EC2 自动恢复＝只救实例级硬件故障；应用层故障走 ASG 换实例或健康检查摘流——两个场景别接错线。","s":"自编·4.3.3"},{"id":"D4-056","d":4,"t":"single","q":"一个支付服务要求：应用日志里的错误率涨过阈值时自动扩容并通知值班，全程无人工介入。日志里没有现成的错误率指标，应用代码也不允许改动。团队要搭出这条从日志到动作的自动化链路。\n\n正确的链路是？","o":[{"l":"A","t":"指标过滤器从日志统计错误率造自定义指标，告警触发 Auto Scaling 扩容与 SNS 通知值班——造指标、配告警、接动作三段全通。"},{"l":"B","t":"让开发团队改代码直接上报错误率指标——违反了「不允许改动」的约束，能实现但不符合题设。"},{"l":"C","t":"每天导出日志人工统计错误率——人工统计撑不起「涨过阈值自动扩容」的实时要求。"},{"l":"D","t":"给实例配 EC2 自动恢复动作——自动恢复管的是实例级硬件故障，应用错误率根本不在它的管辖内。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文给的链路判断：题干给「监控应用层错误率并自动处理」，链路是指标过滤器造指标 → 告警 → Lambda 或 ASG 动作。正文的场景举例与题干同型——过滤器从日志统计积压深度，告警触发 Auto Scaling 与 SNS 通知，一条链路全自动。\n\n**其他选项为什么错：**\n- B：改代码上报可行但违反题设约束；考试里「不改代码」就指向过滤器。\n- C：导出加人工是事后链路，自动扩容的实时性撑不住。\n- D：自动恢复是实例级动作，与应用错误率无关——正文点名的接错线。\n\n**关键概念：** 应用层指标自动化闭环：指标过滤器→告警→ASG 或 Lambda；EC2 recover 只属于实例级场景。","s":"自编·4.3.6"},{"id":"D4-057","d":4,"t":"single","q":"一个双区域部署的应用出了故障：区域内某台后端实例进程假死但端口还在监听，同时另一个场景里整个主区域网络瘫痪。团队要分清两种故障各由哪层健康检查负责发现与切换。\n\n正确的分工是？","o":[{"l":"A","t":"两层都靠 Route 53 健康检查处理——Route 53 的探针粒度是整个站点，单实例摘除不是它的职责。"},{"l":"B","t":"两层都靠 ALB 目标组健康检查处理——ALB 的检查粒度是单个目标，区域级切换它够不着。"},{"l":"C","t":"实例摘除靠 ALB 目标组健康检查（粒度是单个目标），区域切换靠 Route 53（探针粒度是整个站点）——两层各管各的，考试爱混着问。"},{"l":"D","t":"单实例故障由 Route 53 处理、区域故障由 ALB 处理——粒度正好说反，探针范围与切换对象都颠倒了。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文给的两层分工：ALB 检查的是「这个实例能不能服务」，摘除粒度是单个目标；Route 53 检查的是「这个区域整体可不可用」，切换粒度是整个站点。实例假死由 ALB 探活发现并摘流，区域瘫痪由 Route 53 故障转移切站。\n\n**其他选项为什么错：**\n- A：Route 53 的探针从全球发起、粒度是站点，单实例摘除超出它的能力。\n- B：ALB 管不到区域级 DNS 切换，跨区域的容灾它做不了。\n- D：两层粒度恰好颠倒，按这个配置两层都答不对。\n\n**关键概念：** 两层健康检查：实例摘除靠 ALB 目标组，区域切换靠 Route 53；多区域容灾题两层要配合用。","s":"自编·4.3.4"},{"id":"D4-058","d":4,"t":"single","q":"一个业务库的磁盘用量按周稳定增长，运维预测三个月内写满，届时写入会直接报错。DBA 提议「到时候停机更换更大规格的实例」，但业务方明确要求不许停机，团队要选一个不打断业务的自动加盘方案。\n\n最贴合的方案是？","o":[{"l":"A","t":"更换实例规格——那是停机操作，正文点名这是常见错误选项，业务方的停机红线直接被踩。"},{"l":"B","t":"开启 RDS 存储自动扩缩——给库设存储上限阈值，快满时自动加盘，不打断业务。"},{"l":"C","t":"定期人工清理历史数据腾空间——清理解决不了增长趋势，也依赖人工，业务方要的是自动方案。"},{"l":"D","t":"给 EC2 Auto Scaling 组配扩容策略——ASG 扩的是实例数量，跟数据库磁盘容量没有任何关系。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文给的判断：RDS 存储自动扩缩给库设存储上限阈值，快满时自动加盘，不打断业务。题干「数据库快满」「不许停机」两个条件同时命中它。考试给「数据库快满了怎么办」，答存储自动扩缩。\n\n**其他选项为什么错：**\n- A：改实例类型是停机操作——正文点名这是常见陷阱，与不停机要求直接冲突。\n- C：人工清理既不自动也治标不治本，增长趋势还在。\n- D：ASG 与数据库磁盘无关，扩缩对象选错了。\n\n**关键概念：** RDS 存储自动扩缩＝自动加盘不停机；「停机换规格」是这条题的标准错误项。","s":"自编·4.3.5"},{"id":"D4-059","d":4,"t":"single","q":"一个前端服务要求「CPU 利用率保持在 50% 上下，低了缩高了扩，节奏由系统自动算」，运维不想人工定阶梯也不想按峰值常备容量，成本与弹性要同时满足。团队要选对扩缩策略类型并理解它的工作方式。\n\n最贴合的策略是？","o":[{"l":"A","t":"手工按固定时间表加减实例——时间表应付不了突发流量，「保持恒定」的诉求也没被满足。"},{"l":"B","t":"步进策略按阶梯加减——步进要人工定义每档阈值，目标值驱动不了自动算节奏。"},{"l":"C","t":"预先把实例数固定在峰值规模——容量永远按峰值备着，成本翻倍，「自动算节奏」更无从谈起。"},{"l":"D","t":"目标追踪策略——配一个目标值（CPU 50%），策略自动算扩缩节奏，正文点名「保持某指标恒定」就是它。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文给的判断：扩缩策略里目标追踪最常考——如 CPU 保持在 50%，配一个目标值，策略自动算扩缩节奏。题干「保持恒定」「自动算」正是目标追踪的标志词，考纲重点表也把这条列为高频。\n\n**其他选项为什么错：**\n- A：固定时间表是计划伸缩，突发流量与「恒定」都顾不上。\n- B：步进策略靠人工定义阶梯，自动化程度与目标追踪不同。\n- C：峰值固定既贵又没有弹性，扩缩的意义就没了。\n\n**关键概念：** 「按需自动加实例」「保持某指标恒定」＝目标追踪策略；这是 ASG 扩缩的默认高频答案。","s":"自编·4.3.5"},{"id":"D4-060","d":4,"t":"multiple","q":"一个电商应用的架构方案里写了一组扩缩设计：前端 ASG、DynamoDB 会话表、RDS 主库、ECS 集群四层各自伸缩，互不拖累。评审要逐条确认各层的设计是否与服务的扩缩机制相符，防止扩缩对象写错。\n\n以下哪些设计正确？（选两项）","o":[{"l":"A","t":"前端 ASG 用目标追踪策略扩缩实例——白天流量是夜间十倍，目标值驱动自动加减机器。"},{"l":"B","t":"RDS 主库靠存储自动扩缩提升实例规格扛大促——存储自动扩缩只加盘，不改规格。"},{"l":"C","t":"ECS 集群的 capacity provider 决定任务数上限——它管的是从哪拿算力与权重分配，不是任务数。"},{"l":"D","t":"DynamoDB 会话表开按需模式扛波动——请求量随意波动不用管，正好对大促形态。"},{"l":"E","t":"四层扩缩必须串成一条链，一层触发下一层——正文场景是三层各自伸缩互不拖累，串联反而放大故障面。"}],"a":["A","D"],"e":"**正确答案：AD。**\n\n**为什么对：** 正文场景举例给了标准组合：前端 ASG 用目标追踪扩缩实例（A），DynamoDB 会话表开按需模式扛波动（D），RDS 主库开存储自动扩缩防写爆——三层（四层）各自伸缩，互不拖累。两条设计正是这份组合里的正确行。\n\n**其他选项为什么错：**\n- B：存储自动扩缩只加盘不改实例规格——扩缩对象陷阱的原题。\n- C：capacity provider 管算力来源（Fargate 或 EC2 组）与权重，不是任务数上限。\n- E：各层独立伸缩正是方案的好处，串联会让一层抖动传导到全链。\n\n**关键概念：** 多层各自伸缩互不拖累；RDS 只加盘、provider 管算力来源——扩缩对象对照表要背牢。","s":"自编·4.3.5"},{"id":"D4-061","d":4,"t":"single","q":"一个团队要给内部工具的访问日志建一条「错误次数超阈值就通知」的链路：日志组里已有结构化日志，应用代码不动。团队要在采集与告警之间选对造指标的载体，并接对通知目标。\n\n正确的组合是？","o":[{"l":"A","t":"让应用改造后用 PutMetricData 直接上报——违反不动代码的约束，改造周期也长。"},{"l":"B","t":"建指标流把日志发出去再统计——指标流导出的是现成指标，处理不了日志文本。"},{"l":"C","t":"指标过滤器从日志统计错误次数造自定义指标，告警触发 SNS 通知——过滤器造指标、告警接通知，全程不动代码。"},{"l":"D","t":"用 Logs Insights 定时人工查询——人工查询撑不起自动通知，链路里缺了自动化环节。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文给的两条路：应用直接 PutMetricData 上报，或指标过滤器从日志里抠——过滤器造的指标可直接挂告警；告警触发动作按用途选，SNS 发通知给人。题干「不动代码、日志已有」正对过滤器路线，通知用 SNS。\n\n**其他选项为什么错：**\n- A：改造应用违反约束，能用但不符合题设。\n- B：指标流送的是已有指标，造指标它无能为力。\n- D：人工查询不构成自动链路。\n\n**关键概念：** 自定义指标两条路：PutMetricData 或指标过滤器；通知给人用 SNS，自动处理用 Lambda 或 ASG。","s":"自编·4.3.6"},{"id":"D4-062","d":4,"t":"single","q":"一个团队对比两条自定义指标的上报路线：业务代码里已经有埋点能力，要把内部计数器直接推给 CloudWatch；另一条路线是日志里已有数据但不能改代码。团队要给两条路线分别选对载体。\n\n正确的对应是？","o":[{"l":"A","t":"有埋点能力走 PutMetricData 直接上报；不能改代码走指标过滤器从日志提取——两条路线按「能不能改代码」对号入座。"},{"l":"B","t":"两条路线都走指标过滤器——有埋点能力的场景不需要绕道日志，过滤器是多绕的一层。"},{"l":"C","t":"两条路线都走 PutMetricData——不能改代码的场景推不了数，这条路线走不通。"},{"l":"D","t":"两条路线都走 CloudWatch agent——agent 收的是操作系统级指标，业务计数器与日志提取都不是它的活。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文给的两条路对号入座：应用直接 PutMetricData 上报——有埋点能力的代码路线；指标过滤器从日志里抠——不能改代码、日志里已有数据的路线。两条路线互不替代，按约束选择。\n\n**其他选项为什么错：**\n- B：过滤器路线要多建过滤器配置，能直接上报的场景没必要绕。\n- C：改不了代码就调不了上报接口，这条路线不存在。\n- D：agent 是操作系统层采集器，业务计数器不在它的采集范围。\n\n**关键概念：** 自定义指标双路线：改得了代码用 PutMetricData，改不了用指标过滤器；agent 管的是系统级指标。","s":"自编·4.3.6"},{"id":"D4-063","d":4,"t":"single","q":"一个团队在给告警选触发动作：一批告警只是让值班人员知道即可，另一批要求自动执行一段处理逻辑（如清理临时资源）。团队要按用途把两类告警的动作接对，避免该自动的只发了通知。\n\n正确的接法是？","o":[{"l":"A","t":"两类都只接 SNS 通知——自动处理类的要求没有满足，SNS 只解决「让人知道」。"},{"l":"B","t":"通知人的接 SNS，自动执行处理逻辑的接 Lambda——按用途对号入座，正文给的原话分工。"},{"l":"C","t":"两类都接 Lambda——纯通知类绕一层函数多一套要维护的代码，杀鸡用牛刀。"},{"l":"D","t":"通知类接 EC2 自动恢复，处理类接 SNS——自动恢复是实例级故障动作，跟「让人知道」没有关系。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文原话：告警触发动作按用途选——SNS 发通知给人，Lambda 触发自动处理，Auto Scaling 调容量。两类告警按用途各接各的目标，这正是对号入座的答案。\n\n**其他选项为什么错：**\n- A：自动处理的要求落空，SNS 不能执行逻辑。\n- C：纯通知接 Lambda 是多绕一层，函数还成了运维负担。\n- D：EC2 自动恢复只适用于实例级硬件故障，接到通知场景是接错线。\n\n**关键概念：** 告警动作三分：SNS 给人、Lambda 给逻辑、Auto Scaling 给容量；按用途选不按习惯选。","s":"自编·4.3.3"},{"id":"D4-064","d":4,"t":"single","q":"第三方系统每天把交易日志导出到 S3。审计团队要求文件一落桶当天就能在检索页查到，不等批处理窗口，也不允许人工介入。团队要搭一条事件驱动的日志管道，从落桶到可检索全自动。\n\n正确的链路是？","o":[{"l":"A","t":"用 EventBridge 计划规则每天定时触发批处理——那是「批量定期处理」的形态，正文点名这种场景别选事件通知的反面正是它。"},{"l":"B","t":"人工每天下载文件导入检索系统——人工环节既慢又不可靠，与「当天可查」背道而驰。"},{"l":"C","t":"把文件复制到 CloudWatch Logs 等它自动建索引——日志组不是检索平台，全文检索要落到 OpenSearch。"},{"l":"D","t":"桶上配 S3 事件通知（对象创建触发 Lambda），Lambda 解析日志后写入 OpenSearch 建索引——文件到达即处理，检索当天可用。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文给的判断：题干给「文件到达即处理」——S3 事件通知，没有替代品；目标端「要检索」进 OpenSearch。链路正是正文场景举例的同型：桶上配事件通知监听对象创建，触发 Lambda 解析日志，按分区写入 OpenSearch，审计团队当天可查。\n\n**其他选项为什么错：**\n- A：计划批处理是定时形态，「一落桶就处理」要求的是事件驱动。\n- B：人工导入不满足实时与可靠两个要求。\n- C：CloudWatch Logs 是监控体系不是全文检索平台，目标端选错。\n\n**关键概念：** 文件到达即处理＝S3 事件通知→Lambda→OpenSearch；批量定期处理才用计划任务。","s":"自编·4.3.7"},{"id":"D4-065","d":4,"t":"single","q":"一个团队给 S3 桶的同一前缀配日志处理管道：既要触发 Lambda 做实时解析，又要进 OpenSearch 建索引供审计检索。配置时发现同一前缀的事件通知只能配一个目标，平台限制绕不开，团队要按正确的方式扩成多目标。\n\n正确的做法是？","o":[{"l":"A","t":"把事件通知发到 EventBridge，由它按规则路由到 Lambda 与 OpenSearch 两个目标——多目标走 EventBridge 中转，正文给的标准做法。"},{"l":"B","t":"在同一前缀上硬配两个事件通知——平台限制一个前缀一个目标，硬配配不上。"},{"l":"C","t":"让 Lambda 处理完再顺手写进 OpenSearch——多了一个处理环节的耦合，OpenSearch 的投递与解析逻辑绑死在一起。"},{"l":"D","t":"拆成两个前缀分别配通知——要改上游的日志落桶路径，改动面比加一层路由大得多。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文点名的限制与解法：同一前缀的事件通知只能配一个目标，要多目标走 EventBridge 中转。事件通知发到 EventBridge 后，规则把同一事件路由到 Lambda 与 OpenSearch，两个目标互不耦合。\n\n**其他选项为什么错：**\n- B：平台限制摆在那里，硬配不可能成功。\n- C：把投递耦合进处理函数，失败面扩大，维护也变差。\n- D：改上游路径是更大的手术，与加一层路由的代价不成比例。\n\n**关键概念：** S3 事件通知一前缀一目标；多目标＝EventBridge 中转路由。","s":"自编·4.3.7"},{"id":"D4-066","d":4,"t":"multiple","q":"一个团队在为 S3 事件驱动的日志管道做可靠性设计，评审范围包括交付保证、多目标限制、递归风险与失败处理四条机制细节，评审要确认几条说法是否正确，错误的当场纠正。\n\n以下哪些说法正确？（选两项）","o":[{"l":"A","t":"事件通知不保证交付——Lambda 失败要配重试与死信队列，关键管道留失败记录。"},{"l":"B","t":"事件通知有平台级重试兜底，失败无需额外处理——不保证交付是机制事实，不配失败处理会静默丢数据。"},{"l":"C","t":"处理函数往同一桶写文件会再次触发自己——递归要防，输出写别的桶或别的前缀。"},{"l":"D","t":"函数向同一桶写输出是推荐的落位方式——恰恰是递归触发源，这个做法要避免。"},{"l":"E","t":"同一前缀可以挂多个事件通知目标——限制是一个前缀一个目标，多目标走 EventBridge。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** 正文点名的两条机制细节：事件通知不保证交付——Lambda 失败可配重试与死信队列，关键管道要留失败记录（A）；处理函数往同一桶写文件会再次触发自己——递归要防（C），输出换个桶或前缀。\n\n**其他选项为什么错：**\n- B：不保证交付是正文原话，无兜底的说法会让失败静默丢失。\n- D：向同一桶写输出正是递归的来源，是错误做法不是推荐做法。\n- E：一前缀一目标是平台限制，多目标必须走 EventBridge 中转。\n\n**关键概念：** S3 事件管道四条细节：不保证交付（配重试与 DLQ）、一前缀一目标、防递归、大文件超时按量级给足资源。","s":"自编·4.3.7"},{"id":"D4-067","d":4,"t":"single","q":"合规要求：任何人改动安全组规则要立刻通知安全团队，覆盖所有账号与区域，按事件模式匹配而不是轮询翻日志，通知要分钟级到达安全值班群。团队要用事件路由中枢实现这条要求。\n\n最贴合的方案是？","o":[{"l":"A","t":"安全团队每天人工检索 CloudTrail——事后翻记录，分钟级通知的要求完全落空。"},{"l":"B","t":"EventBridge 规则匹配 CloudTrail 的 AuthorizeSecurityGroupIngress 等事件，目标挂 SNS 推给安全群——事件总线按模式路由，分钟级到达。"},{"l":"C","t":"在每台实例上装代理监控本机防火墙变更——覆盖面散乱，账号级配置变更根本不在实例上发生。"},{"l":"D","t":"用 S3 事件通知监听配置变更——S3 通知管的是桶内对象动作，安全组事件不在它的监听范围。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 正文场景举例与题干同型：EventBridge 规则匹配 CloudTrail 的 AuthorizeSecurityGroupIngress 等事件，目标挂 SNS 主题推给安全群——分钟级到达，比事后翻 CloudTrail 快。题干「按事件模式匹配」正是 EventBridge 的标志词。\n\n**其他选项为什么错：**\n- A：人工检索是事后链路，时效与覆盖都达不到。\n- C：安全组是账号级资源，实例侧代理看不见这类变更。\n- D：S3 事件通知只管桶内对象动作，管不了安全组事件。\n\n**关键概念：** 「按事件模式匹配」「事件总线」＝EventBridge；安全组变更通知是正文的原版场景。","s":"自编·4.3.8"},{"id":"D4-068","d":4,"t":"single","q":"一个团队同时处理两个场景：只关心某个桶的新文件到达（触发一个函数处理）；要按复杂模式跨服务路由（某账号某区域的某类 API 调用推给处理链）。团队要给两个场景选对事件机制，不多绕一层。\n\n正确的分工是？","o":[{"l":"A","t":"两个场景都用 S3 事件通知——桶外的 API 调用事件它根本监听不到。"},{"l":"B","t":"两个场景都用 EventBridge——单桶文件到达绕一层总线没有必要，S3 通知更直接。"},{"l":"C","t":"文件到达用 EventBridge，API 调用用 S3 通知——两个正好选反，机制覆盖面颠倒。"},{"l":"D","t":"单桶文件到达用 S3 事件通知（够用更直接），跨服务复杂模式路由用 EventBridge——正文给的分工口诀。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文给的分工判断：只关心某个桶的文件到达，S3 通知够用；要跨服务按复杂模式路由（如「某账号某区域的某类 API 调用」），EventBridge。题干两个场景一个一个对号，正是这条口诀的应用。\n\n**其他选项为什么错：**\n- A：S3 事件通知只监听桶内动作，跨服务路由它够不着。\n- B：单桶场景绕总线是多加一层依赖与配置，没必要。\n- C：两个机制的能力面恰好被颠倒。\n\n**关键概念：** 单桶文件到达→S3 事件通知；「按事件模式匹配」「跨服务路由」→EventBridge。","s":"自编·4.3.8"},{"id":"D4-069","d":4,"t":"single","q":"一个团队要把两百台实例纳入远程运维：不开 SSH 端口、操作留痕可审计、还能批量执行命令与保持配置不漂移，安全团队已把「关闭 22 端口对外」写进基线并定期核查。平台团队要给出纳管方案。\n\n最贴合的方案是？","o":[{"l":"A","t":"保留 SSH 但收紧来源 IP 白名单——端口还开着，基线的「不开 SSH」要求没有满足。"},{"l":"B","t":"用跳板机中转 SSH——多一层维护，端口与审计问题依旧存在，只是挪了位置。"},{"l":"C","t":"用 SSM：Session Manager 远程会话（不开 SSH 端口、日志可存 S3 或 CloudWatch），Run Command 批量执行，State Manager 保证配置不漂移——纳管三件套一次到位。"},{"l":"D","t":"给每台实例发一把独立密钥人工管理——密钥管理与审计成本随规模线性增长，两百台的规模扛不住。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文给的纳管三件套：SSM Agent 预装在主流 AMI 上，实例挂上带 SSM 权限的角色即可被 Session Manager、Run Command、State Manager 纳管——不用开 SSH 端口，审计还全。Session Manager 会话日志可存 S3 或 CloudWatch，State Manager 关联保证配置不漂移，Run Command 一条命令扫全组。\n\n**其他选项为什么错：**\n- A：基线要求不开 SSH，白名单只是收紧不是关闭。\n- B：跳板机不消除端口暴露，审计链路也变长。\n- D：人工密钥管理在两百台规模下不可维护。\n\n**关键概念：** 「不开 SSH 远程运维」＝SSM Session Manager；批量执行＝Run Command；配置不漂移＝State Manager 关联。","s":"自编·4.3.9"},{"id":"D4-070","d":4,"t":"multiple","q":"一个平台团队在为两百台实例设计代理纳管方案：SSM Agent 与 CloudWatch agent 的安装方式、配置集中化与失联排查要点都要写进方案，评审会上要逐条确认几条机制说法是否正确，错的当场纠正。\n\n以下哪些说法正确？（选两项）","o":[{"l":"A","t":"SSM Agent 需要逐台手工安装——主流 AMI 上是预装的，挂对实例角色即可纳管。"},{"l":"B","t":"CloudWatch agent 的配置文件集中放 SSM Parameter Store，State Manager 关联保证配置不漂移——批量统一口径的标准做法。"},{"l":"C","t":"实例 SSM 失联优先排查应用进程——正文点名优先查实例角色与 VPC 端点，应用进程与此无关。"},{"l":"D","t":"实例失联的优先排查位是实例角色没挂对、VPC 没通 SSM 端点——正文给的两处优先排查位。"},{"l":"E","t":"CloudWatch agent 收不了内存与磁盘指标——内存磁盘正是 agent 的核心价值，默认指标里没有才需要它。"}],"a":["B","D"],"e":"**正确答案：BD。**\n\n**为什么对：** 正文给的机制：CloudWatch agent 配置文件集中放 SSM Parameter Store，State Manager 关联保证每台实例配置不漂移（B）——两百台统一口径的标准做法；实例失联常是两处问题——实例角色没挂对、VPC 没通 SSM 端点，优先查这两处（D）。\n\n**其他选项为什么错：**\n- A：SSM Agent 在主流 AMI 上预装，逐台手工安装的前提就不成立。\n- C：失联排查与应用进程无关，优先排查位是角色与网络端点。\n- E：内存磁盘正是 agent 存在的理由，这条与机制完全相反。\n\n**关键概念：** 代理纳管三件：Parameter Store 存配置、State Manager 防漂移、失联先查角色与 VPC 端点。","s":"自编·4.3.9"},{"id":"D4-071","d":4,"t":"single","q":"安全基线要求所有 S3 桶禁止公开读写，但目前存量桶里有历史遗留的公开桶，且随时可能有人新建公开桶。安全团队要求「发现即自动纠正」，并留下处理记录备审计，不允许人工兜底。\n\n最贴合的方案是？","o":[{"l":"A","t":"配 Config 托管规则 s3-bucket-public-read-prohibited 评估，挂自动修复动作指向 SSM Automation——谁开了公开读，几分钟内自动关掉并留记录。"},{"l":"B","t":"配 Config 规则评估后只发通知，人工去关——「发现即自动纠正」的要求没有满足，人工环节还在。"},{"l":"C","t":"用 Inspector 扫桶的漏洞——Inspector 扫的是漏洞与暴露面，不做配置修复，选型串了。"},{"l":"D","t":"用 GuardDuty 盯威胁事件——GuardDuty 找威胁不做配置纠正，与「自动改回配置」不是一回事。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文给的判断与原版场景：题干给「检测到不合规配置自动纠正」——Config 规则加自动修复（修复动作本体是 SSM Automation 文档）。正文的例子一字不差：配托管规则 s3-bucket-public-read-prohibited，挂自动修复指向对应 SSM Automation——谁开了公开读，几分钟内自动关掉并留下记录。\n\n**其他选项为什么错：**\n- B：只通知不修复，自动纠正的要求落空。\n- C：Inspector 扫漏洞不做配置修复——正文点名的选型别串。\n- D：GuardDuty 是威胁检测，同样不做配置修复。\n\n**关键概念：** Config 自动修复闭环：检测用规则（托管优先），修复用 SSM Automation，修复历史留审计。","s":"自编·4.3.10"},{"id":"D4-072","d":4,"t":"single","q":"一个团队在给 Config 自动修复上线前做评审：有一类修复动作涉及重启数据库，风险较高；另有团队担心修复动作失败后的重跑会产生副作用。评审要对修复策略给出安全配置，两条担心都要有对策。\n\n正确的配置是？","o":[{"l":"A","t":"全部动作直接开全自动，重试次数拉满——高风险动作不设人工确认闸，出事面扩大。"},{"l":"B","t":"所有修复都改为人工执行——自动闭环的价值就没了，低风险动作也被拖慢。"},{"l":"C","t":"把修复动作的资源类型放宽到所有资源——修复对象与规则评估对象不一致时修复不生效，放宽反而更糟。"},{"l":"D","t":"高风险动作（如重启数据库）先走人工确认模式，跑顺再开全自动；修复动作要幂等，重跑不产生副作用——正文给的两条安全配置。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文给的两条落地细节直接对应题干两个担心：有风险的动作（如重启数据库）先走人工确认模式，跑顺再开全自动；修复动作要幂等，重跑不产生副作用。两条合起来正好是高风险场景的安全上线节奏。\n\n**其他选项为什么错：**\n- A：高风险动作直接全自动违背上线节奏，重试拉满还会放大副作用。\n- B：一刀切回人工，低风险动作的自动价值被牺牲。\n- C：修复动作的资源类型必须和规则评估的对象一致——挂错了修复不生效，放宽是反向操作。\n\n**关键概念：** 修复上线节奏：高风险先人工确认、跑顺再全自动；动作要幂等；资源类型与评估对象一致。","s":"自编·4.3.10"},{"id":"D4-073","d":4,"t":"single","q":"一个双区域部署的应用要求：主区域整体故障时自动切到备区域，切换由 DNS 完成、分钟级生效、不用人动手，备区域平时不接任何流量、只在故障时承接主区域业务。团队要配置跨区域的自动切换机制。\n\n最贴合的配置是？","o":[{"l":"A","t":"ALB 目标组健康检查配到两个区域——ALB 管实例摘除，跨区域的 DNS 切换它做不了。"},{"l":"B","t":"人工监控主区域状态，故障时手动改 DNS 解析——人工切换达不到分钟级，与「不用人动手」冲突。"},{"l":"C","t":"Route 53 配主备故障转移记录，各挂对应区域的健康检查——主区域探活失败，DNS 自动解析到备区域，分钟级完成切换。"},{"l":"D","t":"把应用改成同时写两个区域的双活架构——那是更大的架构改造，题干要的是故障转移方案，不是重写。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 正文场景举例与题干同型：Route 53 配主备故障转移记录，各挂对应区域的健康检查——主区域探活失败，DNS 自动解析到备区域，分钟级完成切换，不用人动手。Route 53 健康检查从全球探针发起，检查端点或监控 CloudWatch 告警。\n\n**其他选项为什么错：**\n- A：ALB 的粒度是单个目标，区域级切换超出它的能力。\n- B：人工改 DNS 既慢也违背「不用人动手」。\n- D：双活改造超出题设，故障转移用 DNS 层就能达成。\n\n**关键概念：** 区域级自动切换＝Route 53 故障转移记录加健康检查；实例级摘除才是 ALB 的职责。","s":"自编·4.3.11"},{"id":"D4-074","d":4,"t":"single","q":"一个服务的 ALB 目标组健康检查出现怪相：部分实例明明活着却持续被摘流，另有实例已经挂了却还在接流量，值班群里对根因争论不休。团队检查发现探活路径配置有问题，要按正确原则修正。\n\n正确的修正原则是？","o":[{"l":"A","t":"检查路径要指向真实业务端点（如 /health）——探活路径配错会出现「活着但被摘」或「死了还在接流量」两种怪相，指向真实端点才能反映真实服务能力。"},{"l":"B","t":"把探活路径指向首页即可，越通用越好——首页可能 200 但核心接口已坏，探活结果失真。"},{"l":"C","t":"把探活阈值调到最宽松，减少摘流——宽松阈值让挂掉的实例长时间接流量，怪相更严重。"},{"l":"D","t":"关闭健康检查改用人工监控——摘流自动化就没了，故障响应完全靠人。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文点名的坑：ALB 目标组检查路径要指向真实业务端点（如 /health），探活路径配错会出现「活着但被摘」或「死了还在接流量」两种怪相。题干两种怪相并存，根因正是路径没指向真实端点——有的路径误报失败、有的路径误报成功。\n\n**其他选项为什么错：**\n- B：首页探活反映不了核心链路健康度，误报方向换了但失真依旧。\n- C：宽松阈值把摘除延迟拉长，挂掉的实例继续接流量。\n- D：关掉健康检查等于放弃实例级自愈。\n\n**关键概念：** ALB 探活路径指向真实业务端点；怪相（活着被摘、死了接流）的根因大概率在路径配置。","s":"自编·4.3.11"},{"id":"D5-001","d":5,"t":"single","q":"运维值班流程要补一条自动预案：当 AWS 平台侧的维护或服务异常影响到本账户的生产资源时（例如实例所在宿主机即将维护、某服务在区域内异常），系统要能自动收到通告并触发预案处理，不能靠人盯控制台。\n\n该用哪类事件源承担「账户级健康通告」的获取？","o":[{"l":"A","t":"AWS CloudTrail——它记录的是「谁调用了什么 API」的操作历史，平台侧维护通告不在这条流里。"},{"l":"B","t":"AWS Health——它推送账户级健康通告，宿主机维护、区域服务异常这类「平台侧将要发生、影响我账户」的事件由它告知，可经 EventBridge 联动响应。"},{"l":"C","t":"AWS Config——它评估资源配置是否合规、记录配置状态变化，不产生平台健康通告。"},{"l":"D","t":"Amazon CloudWatch Logs——它收集应用与系统日志，日志要自行埋点写入，不天然携带平台侧通告。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** AWS Health 的定位就是账户级健康通告源——宿主机维护、区域服务降级这类平台侧事件，只有它知道，且只推送给受影响的账户；把它的 Health 事件源接进 EventBridge 规则，就能自动触发预案，把平台通告变成自动响应。\n\n**其他选项为什么错：**\n- A：CloudTrail 记录 API 调用，回答的是「谁做了什么操作」，平台侧维护通告不在这条流里。\n- C：Config 管的是配置合规与状态变化，健康通告不是它的产物。\n- D：CloudWatch Logs 是日志归集，需要应用自行写入，平台通告不等于日志。\n\n**关键概念：** 「影响我账户的平台侧通告」找 AWS Health，「API 操作记录」找 CloudTrail——两类事件源在题干里的关键词不同，别混。","s":"自编·5.1.1"},{"id":"D5-002","d":5,"t":"single","q":"安全复盘会上提出一条硬要求：安全组规则被删除这类控制面操作，要能变成事件流接进自动化链路——事件里要能回答「谁在什么时间调用了哪个 API」，事后审计与实时响应都要靠这条流撑起来。\n\n实现这条要求应依赖哪个事件源？","o":[{"l":"A","t":"AWS Health——它只推送平台侧健康通告，不记录用户发起的 API 操作行为。"},{"l":"B","t":"VPC Flow Logs——它记录网络流量的五元组信息，覆盖不到控制面的 API 调用行为。"},{"l":"C","t":"AWS CloudTrail——API 调用被它记录成事件，经 EventBridge 的 CloudTrail 事件源即可被规则匹配，触发相应自动化。"},{"l":"D","t":"AWS Config——它能发现「规则被改了」这一配置状态变化，但事件里回答不了「谁在何时调用了哪个 API」。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 把管理动作变成事件流的正是 CloudTrail——删除安全组规则这类 API 调用都会被记录成事件，管理事件默认可经 EventBridge 被规则匹配，题干要的「谁、何时、哪个 API」字段它都带，接上规则就能驱动自动化。\n\n**其他选项为什么错：**\n- A：Health 只报平台侧健康通告，与 API 审计无关。\n- B：Flow Logs 记录的是网络层流量，不含控制面操作。\n- D：Config 能告诉你配置变成了什么样，但溯源「谁调用的」要靠 CloudTrail。\n\n**关键概念：** 「谁做了什么 API 操作触发自动化」——CloudTrail 事件经 EventBridge；这与「平台侧通告找 Health」是两条不同的接入线。","s":"自编·5.1.1"},{"id":"D5-003","d":5,"t":"single","q":"一个集成平台的架构评审里，团队要给「统一事件入口」选型：AWS 服务自身产生的事件、应用自定义的业务事件、第三方 SaaS 的事件，三类都要汇到一处，再按事件内容匹配规则路由给不同目标。\n\n哪种服务承担这个角色？","o":[{"l":"A","t":"Amazon EventBridge——作为统一事件总线接收 AWS 服务事件、PutEvents 上报的自定义事件与 SaaS 事件，按模式匹配后路由目标。"},{"l":"B","t":"AWS CloudTrail——它只采集 API 调用记录，自定义业务事件与第三方 SaaS 事件不在其范围内。"},{"l":"C","t":"Amazon SNS——它按订阅关系推送通知，不提供按事件内容做模式匹配的路由能力。"},{"l":"D","t":"Amazon Kinesis——它面向连续数据流的有序采集与消费，不适合作为离散事件的模式匹配总线。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** EventBridge 的定位就是事件总线——AWS 服务事件、自定义事件（应用调 PutEvents 上报）、第三方 SaaS 事件三路汇入，规则按 source 与 detail-type 等字段匹配后路由给目标。题干「三类汇入＋按内容匹配路由」就是它的完整画像。\n\n**其他选项为什么错：**\n- B：CloudTrail 只管 API 审计事件，覆盖不了自定义与 SaaS 事件。\n- C：SNS 能做订阅分发，但没有按事件内容匹配规则再路由的引擎。\n- D：Kinesis 处理的是连续流数据，事件总线按离散事件匹配分发的活它不承担。\n\n**关键概念：** 事件总线＝三源汇入＋规则匹配＋目标路由，EventBridge 的一句话定位就是这三个词。","s":"自编·5.1.1"},{"id":"D5-004","d":5,"t":"single","q":"支付平台里「支付成功」这一事件要同时分发给库存、积分、通知三个下游，三者各自独立处理、互不等待，任何一家故障都不影响其余两家收到事件。\n\n这属于事件驱动架构的哪种形态？对应做法是什么？","o":[{"l":"A","t":"队列形态——三个下游从同一条 SQS 队列取消息，谁先取到谁处理，天然实现分发。"},{"l":"B","t":"事件流形态——事件写入 Kinesis 数据流，三个下游按分片顺序依次消费同一份数据。"},{"l":"C","t":"同步调用形态——由调度方依次调用三个下游的接口并等待返回，全部成功才算完成。"},{"l":"D","t":"扇出形态——EventBridge 规则挂多个目标或 SNS 主题挂多个订阅，一个事件同时发给多个下游。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 一个事件同时发多个下游、彼此独立处理，就是扇出；EventBridge 规则挂多目标、SNS 主题挂多订阅都是标准实现。三个下游互不等待，恰好符合扇出「分发」的定位。\n\n**其他选项为什么错：**\n- A：单条队列里的消息被一个消费者取走后就没了，三个下游各自独立拿到同一事件做不到。\n- B：事件流解决的是保序与吞吐，不是多下游独立分发，且「依次消费」与「互不等待」方向相反。\n- C：同步串行一处失败阻塞全链，正是事件驱动要消除的强耦合形态。\n\n**关键概念：** 分发用扇出（SNS/EventBridge 多目标）、保序吞吐用流、削峰用队列——三形态各答一类题。","s":"自编·5.1.2"},{"id":"D5-005","d":5,"t":"single","q":"大促零点秒杀开始，订单事件瞬时洪峰是平时的几十倍，下游风控服务处理能力有限，上一轮大促就因为洪峰直接打进下游被打崩过一次，业务方要求这次必须从架构上解决。\n\n这次要选一种组件，把瞬时洪峰缓冲成下游能平稳消化的速率，最合适的是？","o":[{"l":"A","t":"SQS 队列——事件先入队缓冲，下游消费者按自身节奏拉取消化，洪峰被摊平。"},{"l":"B","t":"SNS 主题——把事件推送给下游订阅，推送节奏跟随上游生产速率同步起伏。"},{"l":"C","t":"Kinesis 数据流——按分片保序分发数据，下游仍要按流入速率处理。"},{"l":"D","t":"EventBridge 规则——按模式匹配把事件路由到目标，路由动作本身不做持久缓冲与排队。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 队列形态解决的就是削峰填谷——SQS 把瞬时高峰先存下来，消费者按自己的处理能力拉取，生产与消费速率解耦，下游不再被洪峰直接冲击。\n\n**其他选项为什么错：**\n- B：SNS 是推送模型，上游来多少推多少，洪峰原样到达下游，起不到缓冲。\n- C：Kinesis 能扛高吞吐，但它的定位是保序流处理；下游按流入速率消费，缓冲削峰不是它答的题。\n- D：EventBridge 负责按规则路由分发，路由动作本身不做持久化排队。\n\n**关键概念：** 削峰找 SQS、分发找 SNS/EventBridge、保序吞吐找 Kinesis——「缓冲成平稳消费速率」这几个字指向队列。","s":"自编·5.1.2"},{"id":"D5-006","d":5,"t":"single","q":"交易对账系统有一条硬要求：交易事件必须严格按发生顺序处理；且每次对账规则升级后，新上线的分析作业要从两天前的事件重新回放一遍来验证正确性。\n\n哪种组件同时满足「保序」与「可回放」两个条件？","o":[{"l":"A","t":"SQS 标准队列——消息按近似顺序传递，消费者处理完消息即出队删除。"},{"l":"B","t":"SNS 主题——消息推送给订阅方，推送顺序与到达顺序都不做保证。"},{"l":"C","t":"Kinesis 数据流——分片内严格保序，数据按保留期保存，新消费者可从保留期内回放历史数据。"},{"l":"D","t":"SQS FIFO 队列——按消息组保序，但消息消费确认后即删除，无法回到两天前重放。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** Kinesis 两个条件都占：分片内数据严格按写入顺序被消费，满足保序；数据按保留期（可延长）保存，新的消费者可以从保留窗口内的任意位置开始重新读取，满足回放。多个消费者互不干扰地读同一份数据也是它的天然能力。\n\n**其他选项为什么错：**\n- A：标准队列不保证严格顺序，第一条就不过关。\n- B：SNS 既不保序也不存储回放，两个条件都不满足。\n- D：FIFO 保序成立，但消息一旦消费确认就删除，没有「回到两天前重放」的能力，第二个条件落空。\n\n**关键概念：** 「保序＋回放＋多消费者」三词齐出，指向 Kinesis；SQS FIFO 只有保序没有回放。","s":"自编·5.1.2"},{"id":"D5-007","d":5,"t":"single","q":"团队在 EventBridge 建了规则想接 AWS Health 的 EC2 维护事件，目标挂了一个 Lambda 函数，上线一周规则从未命中过一次，Lambda 侧也查不到任何调用记录，函数本身单独测试运行正常。\n\n按教材给的排查思路，最可能的原因与第一步动作是什么？","o":[{"l":"A","t":"Lambda 函数超时设置太短——把函数超时上限调大之后继续观察一周。"},{"l":"B","t":"目标执行角色权限不足——给角色补齐权限后再继续观察是否触发。"},{"l":"C","t":"规则目标挂错了服务——把目标从 Lambda 换成 SNS 通知再观察是否触发。"},{"l":"D","t":"事件模式里 source 或 detail-type 写错——模式与实际事件字段不符时规则永不命中，应先用测试事件验证匹配再挂生产目标。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 骨架点名的失分点就是模式匹配语法——EventBridge 按 source 与 detail-type 精确匹配，例如 Health 事件的 source 前缀拼错一个字母，规则就永远不命中，而且不报任何错误，表现就是「从未触发」。教材给的纪律是：规则建好后先用测试事件验证命中，确认匹配正确再挂生产目标。\n\n**其他选项为什么错：**\n- A：函数从未被调用，谈不到超时问题。\n- B：权限不足会发生在「调用目标」这一步，指标与错误日志可见，不是零命中。\n- C：换目标不解决匹配本身的问题，换完照样不命中。\n\n**关键概念：** 模式写错＝静默不命中；排查第一步永远是测试事件验证匹配，而不是换目标或加资源。","s":"自编·5.1.3"},{"id":"D5-008","d":5,"t":"single","q":"应用要把「支付成功」这条业务事件上报到 EventBridge，让下游规则能按事件内容路由。开发同事写完上报代码联调时发现：事件发出去了，规则却始终匹配不到。\n\n按自定义事件的接入要求，上报时最关键的一步是什么？","o":[{"l":"A","t":"把事件体加密后再上报——EventBridge 不要求事件体加密，加密与否不影响规则匹配。"},{"l":"B","t":"调 PutEvents 上报时，entry 里的 source 与 detail-type 要与规则模式中写的值完全一致，写不齐或不一致规则就匹配不到。"},{"l":"C","t":"把事件同时写入 CloudWatch Logs——日志条目不会进入事件总线，规则匹配不到日志。"},{"l":"D","t":"把事件写入 DynamoDB 并配置规则轮询表——EventBridge 不轮询数据库表，这个链路不成立。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 自定义事件的接入口是 EventBridge 的 PutEvents，规则匹配靠的就是 entry 里的 source 与 detail-type 两个字段——它们必须与规则模式中写的值完全一致，少写、拼错、大小写不一致都会导致匹配不到，这正是「模式语法失分点」在自定义事件侧的形态。\n\n**其他选项为什么错：**\n- A：加密是传输安全话题，与模式匹配无关。\n- C：CloudWatch Logs 是日志存储，不进事件总线，规则看不到日志内容。\n- D：事件总线不提供轮询数据库的能力，这条链路本身不成立。\n\n**关键概念：** 自定义事件三要素——PutEvents 上报、source 与 detail-type 写明、与规则模式一致；规则匹配不到先查这两个字段。","s":"自编·5.1.3"},{"id":"D5-009","d":5,"t":"single","q":"一条事件驱动的自动化链路里，「CreateVolume 这类控制面 API 调用」能被 EventBridge 规则正常匹配并触发后续动作，运行一直稳定。团队想在此基础上加一条「S3 对象级读写（GetObject/PutObject）」的匹配规则来监控数据面操作，却发现始终收不到这类事件。\n\n原因是什么？","o":[{"l":"A","t":"规则模式里的事件名要全部改成大写——事件字段有固定格式，改大小写解决不了问题。"},{"l":"B","t":"S3 对象级操作的事件有较长延迟，多等一段时间即可——这不是延迟问题，事件根本没有进入总线。"},{"l":"C","t":"S3 对象级读写属于数据事件，与默认可收的管理事件不同，默认不进入 EventBridge，需要另行开启数据事件记录后再接入。"},{"l":"D","t":"该区域不支持 S3 数据事件——数据事件能力与区域无关，换区域同样收不到。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** CloudTrail 事件分两类：管理事件（控制面 API 调用）默认可经 EventBridge 被规则匹配；数据事件（S3 对象级读写、Lambda 调用等）默认不进入 EventBridge，需要另行开启数据事件记录（如通过 Trail 配置）之后再接入处理管道。题干里管理事件能匹配、对象级操作收不到，正是两类事件的默认行为差异。\n\n**其他选项为什么错：**\n- A：字段大小写与事件是否送达无关。\n- B：事件压根没进总线，等待多久都不会来。\n- D：这是事件类别问题，不是区域支持问题。\n\n**关键概念：** 管理事件默认可收、数据事件默认不收——两者分界是 S5 事件源接入的高频考点。","s":"自编·5.1.3"},{"id":"D5-010","d":5,"t":"single","q":"多账号环境里，账号 A 事件总线上的事件要路由给账号 B 的 Lambda 处理。试投阶段事件始终没有到达账号 B 的函数，A 侧规则状态显示正常，模式本身也用测试事件确认过命中。\n\n按跨账号事件接入的要求，下列哪项是正确做法？","o":[{"l":"A","t":"源账号规则指向目标侧事件总线，目标账号在总线策略上授权源账号投递，同时函数侧资源策略允许该调用——两侧权限缺一不可。"},{"l":"B","t":"只在源账号规则里填上目标函数的完整 ARN 即可——跨账号投递只取决于源侧配置，目标侧默认放行。"},{"l":"C","t":"把 Lambda 函数设为公开可调用——资源策略应针对事件投递来源精确授权，开放公开调用既不安全也不是解决路径。"},{"l":"D","t":"在两个账号里复用同一个 IAM 角色——跨账号投递的授权靠总线策略与资源策略，不靠共用角色。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 教材在跨账号接入处点名「两边策略缺一不可」：源账号的规则要指向目标侧的总线，目标账号的总线策略要授权源账号投递事件，目标动作（函数）的资源策略还要允许事件投递来源调用——任何一侧缺授权，投递都会被拒，表现为事件到不了函数。\n\n**其他选项为什么错：**\n- B：只配源侧、不配目标侧策略，投递会被目标拒绝。\n- C：公开调用偏离了精确授权的要求，且解决不了总线策略缺失。\n- D：复用角色不是跨账号事件授权的机制。\n\n**关键概念：** 跨账号事件链路＝源侧规则＋目标侧总线策略＋目标资源策略，三件配齐才通。","s":"自编·5.1.3"},{"id":"D5-011","d":5,"t":"single","q":"退款流程要五步：收退款事件、查订单、调支付网关、更新库存、发通知；其中调支付网关要配指数退避重试，查订单失败要走补偿分支，大额退款还要插一个人工审批节点，流程上线后要长期无人值守运行。\n\n这套流程用什么搭最合适？","o":[{"l":"A","t":"五个 Lambda 互相调用串联——调用关系与错误处理都写进函数代码自行维护。"},{"l":"B","t":"单个 Lambda 内写完全部五步——一次调用跑完整个流程，逻辑集中在一处。"},{"l":"C","t":"用 SQS 把五步串成消息链——每步消费完把结果作为消息发给下一段。"},{"l":"D","t":"Step Functions 状态机——重试策略、错误分支、审批等待都声明式写进定义，状态由平台保管。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 选型分水岭就是「流程要不要状态」：多步骤、有分支重试、要人工审批，三个特征全占，正是 Step Functions 的地盘——指数退避重试、失败补偿分支、审批挂起等待都能声明式写进状态机定义，步骤顺序与中间状态由平台保管，流程一目了然。\n\n**其他选项为什么错：**\n- A：函数间传上下文、出错重试的幂等保护全要自己写，步骤一多这套代码就是事故源。\n- B：五步长流程塞进单函数，超时与失败重跑粒度太粗，一步失败全部重来。\n- C：队列只传递消息不编排流程，重试、分支、审批仍要自己实现。\n\n**关键概念：** 「多步骤＋重试分支＋审批」＝Step Functions；单步转换才轮到 Lambda 直挂。","s":"自编·5.1.4"},{"id":"D5-012","d":5,"t":"single","q":"对象存储里新上传的对账文件要做一次字段格式转换，然后转发给下游报表系统，流程就此结束——单步转换、无分支、无重试策略要求，也没有需要跨步骤保留的状态，团队希望链路尽量短、运维面尽量小。\n\n最合适的实现是？","o":[{"l":"A","t":"上传事件直接触发单个 Lambda 完成转换与转发，一条直挂链路完事。"},{"l":"B","t":"用 Step Functions 状态机编排转换与转发两个动作——为无状态的简单转换引入状态机是过度设计。"},{"l":"C","t":"先入 SQS 队列再由消费者调 Lambda——为单步转换额外引入队列与消费者，徒增运维面。"},{"l":"D","t":"EventBridge 规则先路由到中转函数、再由中转函数启动 Step Functions——双层中转比直挂多两跳，没有收益。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 两步以内、无状态需求、无分支重试的转换，教材给的口径就是直接 Lambda——单步处理件一次调用完成，链路最短、运维面最小。事件直接触发函数即可，不需要中间编排层。\n\n**其他选项为什么错：**\n- B：Step Functions 的价值在状态管理与编排，这里没有状态要管，引入状态机徒增成本。\n- C：没有洪峰要缓冲、没有解耦需求，队列在这里是多余的组件。\n- D：双层中转把一条直挂链路人为拉长，每一跳都是新的失败点。\n\n**关键概念：** 与 D5-011 对照记忆——多步有状态上 Step Functions，单步转换 Lambda 直挂；反过来就是过度设计。","s":"自编·5.1.4"},{"id":"D5-013","d":5,"t":"single","q":"计费平台每月生成账单后要通知多个订阅方：多数订阅方处理很快，但报表组处理慢、高峰期服务会被打崩。要选一组组件：既能扇出通知给各订阅方，又能单独给报表组加一层缓冲。\n\n哪种组合正确？","o":[{"l":"A","t":"一条 SQS 队列让所有订阅方共同拉取——多个订阅方会互相取走消息，各自收不到全量。"},{"l":"B","t":"SNS 主题扇出通知给各订阅方，报表组的订阅换成 SQS 队列做缓冲，由它按自身节奏消费。"},{"l":"C","t":"SNS 主题直接推送所有订阅方——报表组仍会被推送节奏打崩，缓冲没有落地。"},{"l":"D","t":"Kinesis 流让所有订阅方共享消费——各订阅方要自行维护消费位点，为通知场景引入过重的机制。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 这是 SNS 与 SQS 的经典组合：SNS 负责扇出——一份事件同时通知多个订阅方；给处理慢的那一路挂上 SQS 订阅，队列把推送节奏与消费节奏解耦，报表组按自身能力拉取消化，洪峰不再直接砸到它的服务上。\n\n**其他选项为什么错：**\n- A：单条队列的消息被一个消费者取走后就没了，做不到各订阅方独立收到全量事件。\n- C：纯 SNS 直推没有缓冲层，报表组的问题原样保留。\n- D：Kinesis 要各订阅方自己管理消费位点与顺序，为「通知」场景引入流处理机制过重。\n\n**关键概念：** 「扇出给多数＋给慢的那路加缓冲」＝SNS 扇出＋SQS 订阅缓冲；两种组件各答一半题。","s":"自编·5.1.4"},{"id":"D5-014","d":5,"t":"single","q":"一条用八个 Lambda 链式互调实现的流程最近出了两起事故：一次函数重试导致下游被重复扣减；另一次失败后中间状态丢失，流程断在半路找不回现场，只能人工从第一步重跑。按教材对这类编排的判断，应该怎么改？","o":[{"l":"A","t":"给每个函数加大内存与超时——资源加码解决不了状态管理缺失与幂等缺失的问题。"},{"l":"B","t":"把中间状态暂存在函数实例的本地盘里——Lambda 实例不持久，跨调用与重试时并不可靠。"},{"l":"C","t":"用 Step Functions 接管编排——重试策略与错误分支声明式定义，状态由状态机保管，函数只写业务逻辑。"},{"l":"D","t":"把链式调用改成同步阻塞等全部完成——超时被拉长、失败面更大，幂等问题依旧。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** Lambda 编排的坑教材写得很直白：自己管状态——函数间传上下文、出错重试的幂等保护都要自己写，步骤一多这套代码就是事故源；题干两起事故（重复扣减、状态丢失）正是这两个坑。Step Functions 把重试策略、错误分支声明式写进状态机定义，状态由它保管，函数退回只写业务逻辑。\n\n**其他选项为什么错：**\n- A：内存与超时不解决幂等与状态，事故会换地方重演。\n- B：实例本地盘跨调用不持久，重试或换实例即丢。\n- D：改成同步阻塞放大超时与失败面，根因一个没碰。\n\n**关键概念：** 编排选型的分水岭是「状态谁保管」——自己写代码保管迟早出事，交给状态机平台保管。","s":"自编·5.1.4"},{"id":"D5-015","d":5,"t":"single","q":"团队要给事件规则的上线定一条强制纪律。之前吃过亏：一条模式写错的规则挂上生产 Lambda 后静默不命中，没有任何报错，直到下游发现数据缺失才回溯到规则头上，中间隔了两天。\n\n按教材给的流程，这条上线纪律应该是？","o":[{"l":"A","t":"直接挂生产目标上线，靠投递失败告警发现问题——告警只覆盖投递失败，覆盖不了「从未命中」。"},{"l":"B","t":"规则建好后先用测试事件验证模式命中，确认路由正确之后再挂生产目标。"},{"l":"C","t":"等生产真实事件来试跑验证——窗口期内所有该触发的事件全部丢失，代价更高。"},{"l":"D","t":"先挂生产目标再逐步调整模式——带着生产流量调整未验证的规则，风险方向反了。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 教材在模式语法失分点处给的纪律就是这条：规则建好后先用测试事件验证命中，再挂生产目标。模式匹配是「命中或不命中、无报错」的静默行为，只有主动喂测试事件才能在上线前暴露模式写错的问题。\n\n**其他选项为什么错：**\n- A：投递失败告警盯的是「投出去了但失败」，模式不命中时事件根本不投递，告警不会响。\n- C：拿生产流量当测试集，验证期的事件全丢，事故重演一遍。\n- D：顺序颠倒，把验证成本转嫁给了生产环境。\n\n**关键概念：** 模式匹配的失败是静默的——测试事件先行，是事件规则上线的唯一安全路径。","s":"自编·5.1.3"},{"id":"D5-016","d":5,"t":"multiple","q":"团队在评审事件驱动架构的三种形态——扇出、事件流、队列，会上几位同事分别讲了自己对三种形态与适用组件的理解，评审人要逐条核对说法是否成立，防止把某项功能安到错的组件上。以下说法正确的有哪些？（多选）","o":[{"l":"A","t":"扇出是一个事件同时发多个下游，EventBridge 规则挂多目标或 SNS 主题多订阅都能实现。"},{"l":"B","t":"SQS 标准队列保证消息严格按发送顺序被处理——所以顺序敏感场景放心用它。"},{"l":"C","t":"事件流是连续数据按顺序流经消费者，Kinesis 数据流是典型实现。"},{"l":"D","t":"队列形态解决削峰填谷，SQS 把瞬时高峰缓冲成平稳的消费速率。"},{"l":"E","t":"SNS 是为下游削峰缓冲设计的推送组件——洪峰经它转发就被摊平了。"}],"a":["A","C","D"],"e":"**正确答案：ACD。**\n\n**为什么对：** 三种形态各解决一类问题：扇出解决分发——一个事件同时发多个下游，EventBridge 多目标与 SNS 多订阅都是标准实现；事件流解决保序吞吐——连续数据按顺序流经消费者，Kinesis 是典型；队列解决缓冲——SQS 把瞬时高峰存下来让下游按节奏消费。\n\n**其他选项为什么错：**\n- B：标准队列保吞吐不保序，顺序敏感要用 FIFO 队列——把标准队列说成严格保序是事实错误。\n- E：SNS 是推送分发通道，推送节奏跟随上游，缓冲削峰是 SQS 这类队列的活——功能安错了对象。\n\n**关键概念：** 分发、保序吞吐、缓冲三词分别对号扇出、事件流、队列；判断说法对错先看功能有没有安到对的组件上。","s":"自编·5.1.2"},{"id":"D5-017","d":5,"t":"multiple","q":"团队要把 AWS Health 的事件接进自动化响应链路，实现「平台侧维护影响本账户生产资源时自动处置」。方案评审里出现了以下几条做法，评审人要求逐条判断是否成立，站不住的直接打回重写。其中正确的有哪些？（多选）","o":[{"l":"A","t":"在 CloudTrail 里开启 Health 的数据事件记录——把 Health 事件当数据事件开启即可接入。"},{"l":"B","t":"在 EventBridge 规则的事件模式里指定 Health 的事件 source 前缀，筛出本账户受影响的事件。"},{"l":"C","t":"用 Config 规则来接收并转发 Health 事件——Config 规则能评估事件是否合规后转发。"},{"l":"D","t":"规则挂生产目标之前，先用测试事件验证模式命中，确认能匹配再上线。"},{"l":"E","t":"确认目标的执行角色具备调用目标 API 的权限——权限不齐链路会静默失败。"}],"a":["B","D","E"],"e":"**正确答案：BDE。**\n\n**为什么对：** Health 事件经 EventBridge 接入的正确三步：规则模式里写对 Health 的 source 前缀（筛「影响我账户」的事件）；上线前用测试事件验证命中（模式不命中是静默的）；确认执行角色权限齐全（目标调用会因权限不足静默失败）。三步对应接入链路的三处失败点。\n\n**其他选项为什么错：**\n- A：Health 事件不是 CloudTrail 数据事件，这个开启动作本身就不成立。\n- C：Config 负责资源配置合规评估，不承担事件接收与路由，角色安错了。\n\n**关键概念：** Health 接入＝EventBridge 规则（source 前缀）＋测试事件先行＋执行角色授权；不是所有事件都走 CloudTrail 数据事件那条路。","s":"自编·5.1.3"},{"id":"D5-018","d":5,"t":"multiple","q":"评审会上讨论「什么情况下事件处理该上 Step Functions 而不是单个 Lambda 直挂」，大家列出了一些流程特征供逐条核对，选型的分水岭在于流程要不要状态、要不要编排能力，判定错了整个实现方向都会跑偏。以下哪些特征出现时应该选 Step Functions？（多选）","o":[{"l":"A","t":"流程超过三步，步骤间有先后依赖，状态要跨步骤传递。"},{"l":"B","t":"需要按错误类型分别配置重试策略，失败之后还要走补偿分支。"},{"l":"C","t":"只做一个字段格式转换就结束——转换逻辑简单，没有后续步骤与重试要求。"},{"l":"D","t":"只需把事件原样转发给唯一一个下游——转发完成后流程即结束，无状态无分支。"},{"l":"E","t":"流程中要插人工审批节点，审批期间流程挂起等待结果，批准后继续执行。"}],"a":["A","B","E"],"e":"**正确答案：ABE。**\n\n**为什么对：** 选型分水岭是「流程要不要状态、要不要编排」：超过三步的状态传递、按错误类型区分的重试与补偿分支、人工审批挂起——三个特征都是状态机的能力位，自己用 Lambda 写这套逻辑就是事故源，Step Functions 声明式定义、平台保管状态。\n\n**其他选项为什么错：**\n- C：单步无状态转换正是 Lambda 直挂的场景，上状态机是过度设计。\n- D：原样转发一个下游用直挂目标即可，连多一步都不需要。\n\n**关键概念：** 多步骤、重试分支、审批挂起三特征指向 Step Functions；单步转换与简单转发指向直挂——两组别对调。","s":"自编·5.1.4"},{"id":"D5-019","d":5,"t":"multiple","q":"入职培训讲到 AWS 三类事件源的接入要点，负责记录的新同事整理了几条笔记发到群里，老员工要求他逐条核实、有错的当场修正，确认无误后再归档进团队的接入要点文档。以下笔记内容正确的有哪些？（多选）","o":[{"l":"A","t":"AWS Health 的事件必须在 Health 控制台手工确认后才能触发自动化——确认之前事件不会进入任何自动化链路。"},{"l":"B","t":"CloudTrail 记录的 API 调用会成为事件，可经 EventBridge 被规则匹配后触发自动化。"},{"l":"C","t":"应用自定义事件通过 PutEvents 上报，entry 里写明 source 与 detail-type 两个字段，供规则按内容匹配。"},{"l":"D","t":"第三方 SaaS 事件只能自建轮询拉取，无法接入统一事件总线。"},{"l":"E","t":"AWS Health 的定位是账户级健康通告源，平台侧维护、服务异常影响本账户的事件由它推送。"}],"a":["B","C","E"],"e":"**正确答案：BCE。**\n\n**为什么对：** 三条正确的笔记对应三源的准确定位：CloudTrail 把 API 调用变成事件、可经 EventBridge 触发自动化；自定义事件走 PutEvents 上报且必须写明 source 与 detail-type；Health 是账户级健康通告源，负责「平台侧影响我账户」事件的推送。\n\n**其他选项为什么错：**\n- A：Health 事件经 EventBridge 规则即可全自动响应，不需要人工确认这道前置，说法凭空加了环节。\n- D：EventBridge 本身支持 SaaS 事件源接入，「只能自建轮询」与事实相反。\n\n**关键概念：** 三源一句话——Health 管平台通告、CloudTrail 管 API 操作、自定义事件管业务上报；接入方式各有差异，这是考点所在。","s":"自编·5.1.1"},{"id":"D5-020","d":5,"t":"single","q":"安全团队刚发布了一条新的内核参数基线，要求立即在几百台实例上执行同一条检查命令，执行范围按生产标签圈定，并收回每台实例的执行结果做合规归档。这是一次性动作，执行完出报告即结束，不需要常驻机制。\n\n用哪个工具执行最合适？","o":[{"l":"A","t":"State Manager——用关联声明期望状态，由平台定时评估并自动纠正漂移，常驻运行。"},{"l":"B","t":"Run Command——按标签圈定目标实例批量执行命令，输出按实例逐台留档可回查。"},{"l":"C","t":"Auto Scaling——调整组的期望容量与放置策略，让新实例带着新配置启动补充进来。"},{"l":"D","t":"Config——评估资源配置是否合规并记录变更历史，供审计与溯源查询。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 题干的三个关键词——「立即执行」「一次性」「收回每台结果」——正对 Run Command 的定位：按标签或资源组圈定目标，一次性批量下发命令，执行输出按实例逐台留档，事后可回查抽查。\n\n**其他选项为什么错：**\n- A：State Manager 是「持续保持」的机制，定时评估自动纠正，题干只要执行一次，用它过重。\n- C：Auto Scaling 管实例数量与放置，不执行实例内的命令。\n- D：Config 评估配置状态并记录，不在实例内执行命令。\n\n**关键概念：** 「变一次」用 Run Command、「一直保持」用 State Manager、「流程化」用 Automation——三个执行件按粒度对号。","s":"自编·5.2.1"},{"id":"D5-021","d":5,"t":"single","q":"运维规范要求：每台实例上的监控 agent 必须始终处于安装状态且版本不低于某基线版本。历史上多次出现 agent 被误卸载或版本落后，都是人工巡检才发现的，希望漂移出现后系统能自己纠正。\n\n最合适的机制是？","o":[{"l":"A","t":"Run Command 定时人工触发安装命令——每次靠值班同学记得跑，漂移窗口内无人兜底。"},{"l":"B","t":"Config 规则评估 agent 是否存在——能发现漂移并报告，但不会执行安装动作。"},{"l":"C","t":"State Manager 建关联，声明「agent 必须在装且版本达标」，平台定时评估，发现漂移自动纠正。"},{"l":"D","t":"Auto Scaling 替换不合规实例——它是容量调节器，实例内软件状态不在它的职责内。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 题干要的是「保持」而不是「变更一次」——State Manager 的关联（association）就是声明这台实例应该是什么状态，平台定时评估，发现漂移即自动纠正，恰好覆盖「误卸载后系统自己装回来」的诉求。\n\n**其他选项为什么错：**\n- A：人工定时触发不是自动纠正，值班忘了跑漂移就一直存在。\n- B：Config 能发现并报告漂移，但不执行安装——它是评估端不是执行端。\n- D：实例数量与放置才是 Auto Scaling 的职责，agent 缺失不在它管的数据里。\n\n**关键概念：** 「持续保持某状态」几个字出现，对号 State Manager 关联；Config 只评不改。","s":"自编·5.2.1"},{"id":"D5-022","d":5,"t":"single","q":"新同事在入职培训后把机群管理相关的服务职责混在了一起，把 Systems Manager 与 Auto Scaling 的活说串了行，速查表差点跟着写错。评审人要求把两者的分工边界讲清楚，写进团队的职责速查表。\n\n下列哪项对两者分工的描述是正确的？","o":[{"l":"A","t":"Systems Manager 管「对实例做什么」——执行命令、保持状态、跑运维流程；Auto Scaling 管实例数量与放置——容量与分布由它调节。"},{"l":"B","t":"Systems Manager 负责实例数量的增减，Auto Scaling 负责在实例内执行命令——两者的职责说反了。"},{"l":"C","t":"两者都是容量调节器，只是触发方式不同——Systems Manager 并不管理容量。"},{"l":"D","t":"Auto Scaling 负责实例内的命令执行与软件状态——执行动作不是它的能力范围。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 机群管理服务两件套的分工教材一句话讲清：Systems Manager 是动作执行器——Run Command 批量执行、State Manager 保持状态、Automation 跑复杂运维流程，管的全是「对实例做什么」；Auto Scaling 是容量调节器，管实例数量与放哪儿。\n\n**其他选项为什么错：**\n- B：两条职责恰好互换，是典型的记忆颠倒项。\n- C：Systems Manager 完全不碰容量，说成另一类容量调节器是事实错误。\n- D：实例内命令执行是 Systems Manager 的地盘，Auto Scaling 只在实例生命周期层面动作。\n\n**关键概念：** 动作执行器（SSM）与容量调节器（Auto Scaling）——一句话记住分工，考试常拿两者混着出干扰项。","s":"自编·5.2.1"},{"id":"D5-023","d":5,"t":"single","q":"机群的证书轮换要按固定剧本走：分批滚动重启、每批之间健康检查、中途插一个审批节点让值班负责人确认、某批失败要自动中止并回退。这套多步骤流程要固化成可反复执行的标准动作。\n\n用哪个工具承载最合适？","o":[{"l":"A","t":"Run Command——一次下发一条命令给全机群执行，命令本身装不下分批与审批逻辑。"},{"l":"B","t":"State Manager 关联——声明期望状态并定时评估，不是编排多步骤流程的载体。"},{"l":"C","t":"单个 Lambda 函数——审批挂起、分批健康检查塞进一个函数里，失败重跑粒度太粗。"},{"l":"D","t":"SSM Automation 文档——把多步骤运维动作写成可参数化剧本，支持审批节点与失败分支。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 分批、健康检查、审批、失败回退——多步骤、有分支、带人工确认，正是 Automation 文档的画像：把运维动作写成可参数化剧本，审批节点卡住等确认，失败分支自动中止回退，剧本可反复执行。\n\n**其他选项为什么错：**\n- A：Run Command 是单步动作执行器，分批与审批逻辑塞不进一条命令。\n- B：State Manager 管「保持状态」，流程编排不是它的职责。\n- C：单函数承载多步长流程，一步失败全部重来，重跑粒度太粗。\n\n**关键概念：** 「变一次」Run Command、「一直保持」State Manager、「流程化带审批」Automation——三件套各答一类题。","s":"自编·5.2.1"},{"id":"D5-024","d":5,"t":"single","q":"合规基线要求所有生产资源的某项配置属性保持达标，团队要搭一条自动链路：资源配置偏离基线时能被发现，并且修复动作自动执行，不用人工逐个处理，全程要可追溯。\n\n这条链路的核心组成应该是什么？","o":[{"l":"A","t":"CloudTrail 记录所有配置变更操作——审计视角能回答谁改的，但不做合规评估与修复。"},{"l":"B","t":"Config 规则持续评估资源是否合规，不合规资源自动挂上 SSM Automation 执行修复动作。"},{"l":"C","t":"CloudWatch 告警通知值班人员，由人工逐个登录修复——链路里没有自动修复环节。"},{"l":"D","t":"Trusted Advisor 给出检查建议清单——建议类输出，不承担合规修复的执行。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 事件驱动的修复闭环就是这条链：Config 规则作为发现与评估端，持续评估资源配置、产出不合规清单；修复动作挂在评估结果上，由 SSM Automation 执行——发现、评估、修复三环齐备，且全程自动。\n\n**其他选项为什么错：**\n- A：CloudTrail 回答「谁改的」，是审计线，不评估合规也不修复。\n- C：人工逐个处理没有闭环，题干明确要自动执行。\n- D：Trusted Advisor 是建议清单，没有修复执行链。\n\n**关键概念：** Config 评估＋SSM Automation 修复是自动修复链的标准组合；评估端与执行端分工明确。","s":"自编·5.2.2"},{"id":"D5-025","d":5,"t":"single","q":"团队在梳理「事件驱动」视角下的配置管理，一位同事认为配置漂移只是个静态状态问题，跟事件响应这套体系没有关系，把两者当成了两条平行线，评审时要把这个观点纠正过来。\n\n按教材的口径，正确的理解是什么？","o":[{"l":"A","t":"配置漂移是静态状态，与事件体系无关——漂移只能靠周期性人工巡检来发现。"},{"l":"B","t":"漂移必须人工逐台核对才能确认——自动化评估的结果不可信。"},{"l":"C","t":"配置漂移本身就可以看作一个事件，修复是被这个事件触发的响应——它与事件驱动体系是一脉的。"},{"l":"D","t":"漂移只能靠重新部署整个环境解决——代价与影响面都被放大了。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 教材在这一节的口径很明确：配置漂移本身就是一个事件，修复是被事件触发的响应——发现端（Config 规则评估）产出漂移事件，修复端（Automation 或 Lambda）被它触发。这与 D4 的 Config 修复、本域的事件驱动闭环是一脉相承的。\n\n**其他选项为什么错：**\n- A：「与事件无关」的判断与教材口径相反，漂移正是靠规则评估变成可响应的事件。\n- B：自动化评估正是为了替代人工核对，说评估结果不可信没有依据。\n- D：重新部署全环境是极端手段，常规修复就是针对偏离项的定点纠正。\n\n**关键概念：** 漂移＝事件，修复＝响应——把配置管理装进事件驱动的框架里理解，是本任务的核心视角。","s":"自编·5.2.2"},{"id":"D5-026","d":5,"t":"single","q":"有同事提议：既然 Config 规则能评估出资源不合规，那就让 Config 在评估不通过时直接把配置改回来，一条服务全包，不用再接其他组件。评审人觉得不对，要他指出这个提议的问题。\n\n按各服务的能力边界，下列哪项判断正确？","o":[{"l":"A","t":"Config 的职责是评估与记录，它不执行变更——修复动作要交给执行件（如 SSM Automation 或 Lambda）完成。"},{"l":"B","t":"Config 规则命中后确实能自己直接修改资源配置——这个提议没有问题。"},{"l":"C","t":"Config 只记录不评估——规则评估本来就是它的核心能力，这个说法与事实相反。"},{"l":"D","t":"评估结果不需要触发任何后续动作——自动修复恰恰是把动作挂在评估结果上。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 能力边界要分清：Config 负责发现与评估——规则持续评估资源配置、产出合规结论；它不执行变更，修复动作要挂到执行件上，标准组合是 SSM Automation 或 Lambda。一条服务全包的提议混淆了评估端与执行端。\n\n**其他选项为什么错：**\n- B：Config 没有修改资源配置的能力，「没有问题」的判断本身错误。\n- C：规则评估正是 Config 的核心能力，这条描述与事实相反。\n- D：评估结果的下游就是修复动作，说不需要动作就丢掉了闭环。\n\n**关键概念：** 评估端（Config）与执行端（Automation/Lambda）分离——自动修复链的分工底线。","s":"自编·5.2.2"},{"id":"D5-027","d":5,"t":"single","q":"一条自动修复链路把某批不合规资源修复完了，修复任务显示全部执行成功，团队准备直接关闭对应工单，有人提出异议认为还差一步。验收环节讨论「怎么才算这条链路真正闭环」，下列哪个说法正确？","o":[{"l":"A","t":"修复任务跑完就算闭环完成——任务成功与资源合规是两回事。"},{"l":"B","t":"随机抽查一台资源人工看一眼——抽查覆盖不了全量，也没有系统化判据。"},{"l":"C","t":"等下一次人工合规审计再确认——审计周期长，闭环被拖到几周之后。"},{"l":"D","t":"修复完成后让规则复评，确认资源回归合规、评估结果转绿，才算闭环。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 闭环四环节是发现、评估、修复、验证——验证这一环就是让 Config 规则对修复后的资源再评估一遍，结果转绿才证明修复真正生效。修复任务「执行成功」只说明动作跑完了，不说明结果达标。\n\n**其他选项为什么错：**\n- A：任务成功不等于资源合规，缺的就是验证这一环。\n- B：人工抽查无系统性，也覆盖不了全量。\n- C：等下轮人工审计，闭环周期被拉长，偏离了自动修复的设计初衷。\n\n**关键概念：** 发现、评估、修复、验证——四环节缺一不可，「验证」的标准动作就是规则复评。","s":"自编·5.2.2"},{"id":"D5-028","d":5,"t":"single","q":"安全基线更新后，要把一条新配置一次性应用到几百台生产实例上，应用完这次变更就结束，之后没有持续保持的需求，团队也不想为此引入常驻机制，执行结果还要逐台留档备查。\n\n选择执行机制时，下列哪项正确？","o":[{"l":"A","t":"Run Command 按标签圈定目标实例一次性下发，输出按实例逐台留档——一次性变更正对它的定位。"},{"l":"B","t":"State Manager 建关联持续评估——题干没有持续保持需求，定时评估是多余的常驻机制。"},{"l":"C","t":"SSM Automation 写多步骤剧本——单条配置变更用不上多步编排，属于过度设计。"},{"l":"D","t":"运维同学逐台登录手工执行——几百台的量级下既不可靠也无留痕，不可接受。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 「一次性变更一个机群」正是 Run Command 的定位——按标签或资源组圈定目标，一次下发，执行完即结束，输出按实例逐台留档方便核对。\n\n**其他选项为什么错：**\n- B：没有持续保持需求时上 State Manager，关联会常驻评估，机制与需求错配。\n- C：单条变更不构成多步骤流程，Automation 的编排能力用不上。\n- D：手工逐台在大机群下不可持续，也没有集中留痕。\n\n**关键概念：** 与 State Manager 的分界就是「变一次还是一直保持」——题干没有保持需求，就不要引入常驻机制。","s":"自编·5.2.3"},{"id":"D5-029","d":5,"t":"single","q":"一条机群级配置变更已经过评审通过，即将铺向几百台生产实例。变更方案讨论「怎么控制变更窗口内的风险，避免问题一次砸到全部实例」，评审人强调要留出验证缓冲。\n\n下列哪种做法符合教材给出的落地纪律？","o":[{"l":"A","t":"变更一次性全量铺开，出了问题再整体回滚——用生产机群当试验场，爆炸半径失控。"},{"l":"B","t":"只在测试环境完整试跑后就铺生产——测试环境与生产的差异可能掩盖问题。"},{"l":"C","t":"先在打了灰度标签的少量生产实例上试跑，验证通过后再铺全量。"},{"l":"D","t":"变更窗口当天直接执行，边执行边观察——没有验证缓冲，问题会同时砸到全量实例。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 教材在变更落地细节里给的纪律就是灰度先行：变更前先在灰度标签的少量实例上试跑，验证通过再铺全量——用最小爆炸半径先验证变更的正确性，再扩大范围。\n\n**其他选项为什么错：**\n- A：全量直铺没有验证缓冲，出问题时影响面就是整个机群。\n- B：测试环境验证是必要的，但不能替代生产灰度——两者环境差异本身可能就是变量。\n- D：边执行边观察等于没有观察，问题发现时已经全量扩散。\n\n**关键概念：** 灰度标签试跑→验证→铺全量，是机群变更的标准风险控制路径。","s":"自编·5.2.3"},{"id":"D5-030","d":5,"t":"single","q":"一条通过 SSM Automation 执行的配置变更在上批次实例上执行失败，需要把已变更的部分恢复到变更前状态，回滚动作本身也要留痕可审计——这要求变更设计阶段就做好准备。讨论回滚手段时，下列哪项符合「可回滚」的设计要求？","o":[{"l":"A","t":"失败后由操作员凭记忆手工把配置改回去——依赖个人记忆的恢复不可靠也不可审计。"},{"l":"B","t":"参数与脚本事先版本化，Automation 文档按版本管理，回滚就是切回上一版本重新执行。"},{"l":"C","t":"对每台实例做整机快照，出事就整机回滚——代价高、影响面大，为一处配置变更付出的成本过重。"},{"l":"D","t":"变更不可回滚，只能向前修复——变更设计阶段就放弃回滚能力，风险敞口敞着。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 教材对变更可回滚的落点是模板化：变更的模板靠参数与文档版本管理，回滚靠版本切换——把上一版本的 Automation 文档重新执行即可恢复，恢复动作本身也是留痕、可审计的。\n\n**其他选项为什么错：**\n- A：凭记忆手工恢复既不可靠也无法作为审计证据。\n- C：整机快照回滚代价与影响面过大，与一次配置变更的量级不匹配。\n- D：放弃回滚等于放弃补救路径，不符合可回滚的设计要求。\n\n**关键概念：** 版本化是回滚的前提——变更前先把参数与剧本纳入版本管理。","s":"自编·5.2.3"},{"id":"D5-031","d":5,"t":"single","q":"机群变更执行完成后，合规团队要求提供「每台实例执行结果」的核查材料，覆盖全部目标实例而不是抽样——上次审计就因为拿不出逐台记录被开过不符合项。\n\n执行环节应该怎么设计才能满足这个要求？","o":[{"l":"A","t":"只看命令有没有整体报错——整体成功可能掩盖个别实例的失败，粒度太粗。"},{"l":"B","t":"靠操作员凭记忆整理执行情况——个人记录不构成可核查的正式材料。"},{"l":"C","t":"事后逐台登录机器翻日志——几百台的人工成本高，且日志可能已被轮转。"},{"l":"D","t":"Run Command 的执行输出按实例逐台留档，核查时按实例逐条调取，天然满足全量核查。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** Run Command 的执行输出天然按实例逐台留档——哪台成功、哪台失败、输出内容是什么都可回查。合规要的全量核查材料直接从执行记录调取，不用事后补做。\n\n**其他选项为什么错：**\n- A：整体报错判断覆盖不了「部分实例失败」的中间态。\n- B：个人记忆不是可核查的正式留痕。\n- C：事后翻机器日志成本高，且实例可能已更换或日志已轮转。\n\n**关键概念：** 「执行输出按实例逐台留档」是机群变更的落地细节，也是合规核查的材料来源。","s":"自编·5.2.3"},{"id":"D5-032","d":5,"t":"single","q":"一条事件驱动的变更链路已上线试运行：EventBridge 规则命中事件后调用 Lambda 修改资源属性。试运行时用测试事件确认了事件能命中规则，但资源始终没有被改动，链路中也没有任何报错。\n\n最可能的原因是什么？","o":[{"l":"A","t":"事件源配置不对——事件已经能命中规则，说明事件源到规则这一段是通的。"},{"l":"B","t":"规则模式写错——模式命中已用测试事件验证过，这条已经排除。"},{"l":"C","t":"执行角色的 IAM 授权缺失——EventBridge 目标角色要能调用对应的资源修改 API，权限不齐链路会静默失败。"},{"l":"D","t":"Lambda 函数代码有逻辑错误——函数根本没被执行，谈不上代码逻辑问题。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 教材把「执行角色授权」列为事件驱动改配置链路的最易漏项——链路四件套是事件源、规则、目标、IAM 权限，前三件通了之后，目标执行角色还要有调用对应 API 的权限；权限不齐的表现恰恰就是静默失败：事件到了、动作没发生、也不报错。\n\n**其他选项为什么错：**\n- A：事件能命中规则，事件源与规则这段已经验证通过。\n- B：模式命中已验证，此项已排除。\n- D：函数没被执行，问题出在调用之前，不是函数内部。\n\n**关键概念：** 「链路画得出来但跑不动」先查执行角色授权——这是四件套里最常被漏的一件。","s":"自编·5.2.4"},{"id":"D5-033","d":5,"t":"single","q":"合规要求「新增的 EBS 卷必须立即检查加密属性，未加密的自动处置并告警」，处置窗口以分钟计，不能等批量评估。团队要把这条要求做成事件驱动的自动链路，让新资源落地的瞬间就被覆盖。\n\n下列哪条链路设计正确？","o":[{"l":"A","t":"Config 规则每周评估一次加密合规性，不合规项汇总成周报人工处理——评估周期长，不是事件驱动的即时响应。"},{"l":"B","t":"EventBridge 规则匹配 CloudTrail 的 CreateVolume 事件，目标 Lambda 检查加密属性，未加密的自动创建加密副本替换并告警。"},{"l":"C","t":"CloudTrail 数据落 S3 后每天批量扫描一次——滞后一天才处置，新资源在窗口期内裸奔。"},{"l":"D","t":"只靠 IAM 策略拦截未加密的创建请求——那是准入控制，不构成对已发生事件的自动响应链路。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 这就是教材里的原型场景：EventBridge 规则匹配 CloudTrail 的 CreateVolume 事件，目标 Lambda 检查加密属性并自动处置——API 调用发生即触发，新资源落地的瞬间就被规则覆盖，链路四件套（事件源、规则、目标、授权）齐备。\n\n**其他选项为什么错：**\n- A：周级评估与「立即检查」的要求相差几个量级。\n- C：天级批量扫描同样滞后，窗口期内不合规资源无人管。\n- D：准入拦截挡住的是「创建」，不是对已创建资源的事件响应，两者是不同的控制面。\n\n**关键概念：** 「某类事件发生后自动改配置」＝EventBridge 规则接 CloudTrail 事件触发动作，链路四件套要答全。","s":"自编·5.2.4"},{"id":"D5-034","d":5,"t":"single","q":"自动扩缩容的组要求：每次新扩出的实例先自动打上业务标签、安装监控组件，全部就绪后才允许承接流量，避免「半成品实例」直接对外服务，也避免流量打到达标之前的实例上。\n\n实现这个要求该用什么机制？","o":[{"l":"A","t":"扩缩事件没有可挂自定义动作的机制——只能靠实例启动脚本碰运气完成。"},{"l":"B","t":"扩容出的实例立即放行承接流量，准备工作由后台异步补做——半成品实例会直接对外服务。"},{"l":"C","t":"用 State Manager 在流量进来之后逐步安装——时序反了，等待期就是不达标期。"},{"l":"D","t":"Auto Scaling 生命周期钩子——实例先执行自定义动作（打标签、装监控），钩子等动作完成再放行实例进入服务。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 教材把生命周期钩子列为按事件修改基础设施的特例：扩缩事件可挂自定义动作，钩子让实例停在新状态等动作完成——打标签、装监控做完再放行，正好实现「就绪才接流量」。\n\n**其他选项为什么错：**\n- A：钩子机制真实存在，这条前提就不成立。\n- B：立即放行与「就绪才服务」的要求正好相反。\n- C：State Manager 能装软件，但时序上流量先进来，等待期实例仍是对外服务的半成品。\n\n**关键概念：** 生命周期钩子＝扩缩事件挂动作＋动作完成再放行；题干「全部就绪后才允许承接流量」就是它的信号词。","s":"自编·5.2.4"},{"id":"D5-035","d":5,"t":"single","q":"一批资源的属性要按新模板统一调整，这批资源由 CloudFormation 栈管理，变更涉及几十个资源且相互关联。团队希望变更前能先看到「改了会影响哪些资源、每个资源怎么改」，确认无误再真正执行。\n\n最合适的做法是什么？","o":[{"l":"A","t":"CloudFormation 变更集——先按新模板生成变更集，预览每个资源的变更内容，确认后再执行。"},{"l":"B","t":"用 Lambda 手写脚本逐个调用资源 API 修改——绕开模板，栈内资源与模板产生漂移。"},{"l":"C","t":"Run Command 在实例上批量执行修改命令——它执行的是实例内命令，改不了模板化资源属性。"},{"l":"D","t":"运维在控制台上手工逐个调整——无预览、无留痕，且与栈模板产生漂移。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 教材在「改模板化资源走哪条路」处的答案就是 CloudFormation 变更集：先按新模板生成变更集，把每个资源将要发生的变更列出来供预览，确认后才执行——「先看再改」正是变更集的设计目的，且资源始终与模板一致。\n\n**其他选项为什么错：**\n- B：脚本逐个改 API 会造成栈内资源与模板漂移，后续栈操作会互相打架。\n- C：Run Command 是实例内命令执行器，不处理模板化资源属性。\n- D：手工调整既无预览也无留痕，同样制造漂移。\n\n**关键概念：** 变更对象选执行路：改实例配置走 SSM、改资源属性走 Lambda、改模板化资源走 CloudFormation 变更集。","s":"自编·5.2.4"},{"id":"D5-036","d":5,"t":"single","q":"评审一条「发现、评估、修复、验证」自动修复闭环的设计稿时，发现稿子里只画了「发现不合规→执行修复」两步，评估与验证两个环节都没有落位，评审人要求对照教材把结构补全。\n\n按闭环的完整设计，正确的结构是什么？","o":[{"l":"A","t":"两步就够——发现后直接修复，评估与验证都是多余环节，可以删掉。"},{"l":"B","t":"发现→评估→修复三步就完整——验证环节可有可无，任务成功即算完成。"},{"l":"C","t":"评估→修复→发现→验证——把发现放在评估之后，起点就错了。"},{"l":"D","t":"完整闭环是发现、评估、修复、验证四环节——评估产出不合规清单与严重度，修复执行纠正，验证确认回归合规。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 教材给的闭环四环节是发现、评估、修复、验证：发现靠 Config 规则或自定义检测；评估产出不合规清单与严重度；修复用 Automation 或 Lambda 执行纠正；验证靠修复后规则复评确认回归合规。四环缺一不可，顺序也不能乱。\n\n**其他选项为什么错：**\n- A：跳过评估就没有严重度分级与修复动作选型依据，跳过验证就无法确认修复生效。\n- B：缺验证的闭环在「修复没修好」时毫无察觉。\n- C：发现是起点，评估在后，顺序颠倒了。\n\n**关键概念：** 发现→评估→修复→验证，四环顺序固定；设计稿少一环都要补上。","s":"自编·5.2.5"},{"id":"D5-037","d":5,"t":"single","q":"一个团队管着几百个 S3 桶，合规基线是「全部桶开启默认加密、禁止公开读」，过去靠人工巡检总是顾不过来。团队希望这两条基线的偏离能被持续发现并自动修复，修复全程留痕，还要能应付桶数量继续增长。\n\n下列哪套设计符合要求？","o":[{"l":"A","t":"Config 两条规则持续评估全部桶，不合规资源挂 SSM Automation 自动修复，修复后规则复评转绿，全程留痕。"},{"l":"B","t":"运维每天人工巡检控制台逐桶核对——量级一大就不可持续，也没有自动修复。"},{"l":"C","t":"CloudTrail 记录全部 API 操作供事后审计——审计能查责任，不构成发现与修复。"},{"l":"D","t":"IAM 策略把所有人改成只读——误伤正常业务操作，且不解决已偏离资源的修复。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 这是教材的原型场景：Config 规则作为发现与评估端持续覆盖全部桶，不合规资源自动挂 Automation 修复——加密缺失的补上、公开读的关掉，修复后规则复评转绿，全程留痕可审计，闭环四环节齐备。\n\n**其他选项为什么错：**\n- B：人工巡检既不持续也不自动，几百桶的量级下不可行。\n- C：CloudTrail 是审计线，回答「谁改的」，不做合规评估与修复。\n- D：一刀切只读误伤业务，也没有修复已偏离的资源。\n\n**关键概念：** 「持续发现＋自动修复＋复评验证」三个词齐出，就是 Config 规则＋Automation 修复闭环。","s":"自编·5.2.5"},{"id":"D5-038","d":5,"t":"single","q":"自动扩缩容组里有一台实例反复不健康，业务要求「实例级故障要自动拉回期望状态」，而不是每次都靠人发现人处理。讨论处理机制时，有同事提议用 Config 规则修复。\n\n按两条线的分工，正确的判断是什么？","o":[{"l":"A","t":"用 Config 规则修复实例故障——配置合规线与实例健康线是同一条，提议成立。"},{"l":"B","t":"用 SSM Automation 定时重启这台实例——重启治标不治本，不健康根因还在。"},{"l":"C","t":"实例级故障归 Auto Scaling 的活——健康检查发现不健康实例后自动替换，把组拉回期望容量，与配置修复是两条线。"},{"l":"D","t":"EventBridge 规则把故障事件转发给值班群——只通知不修复，故障实例仍然挂着。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 教材在修复非期望状态处明确区分两条线：配置偏离走 Config 规则＋自动修复；实例级故障（不健康、宕机）走 Auto Scaling——健康检查发现不健康实例后自动替换，把组拉回期望容量。题干问哪条答哪条，别把两条线混在一起。\n\n**其他选项为什么错：**\n- A：两条线是分开的，Config 管配置合规，不管实例健康。\n- B：定时重启不处理根因，坏实例换个姿态继续坏。\n- D：转发通知只是响应的第一步，替代不了替换机制。\n\n**关键概念：** 实例挂了找 ASG 健康检查替换，配置漂了找 Config＋Automation——考试最爱把两条线混着出。","s":"自编·5.2.5"},{"id":"D5-039","d":5,"t":"single","q":"一条自动修复链路上线后出现怪象：修复动作执行后又触发了新的不合规事件，链路再次修复，如此往复形成循环，资源状态反复翻转。评审人要一个能根治而不是绕开的办法。\n\n按教材给的落地细节，这个问题该怎么防？","o":[{"l":"A","t":"修复死循环无法避免，只能上线后人工盯着——教材明确给出了防范手段，这条判断不成立。"},{"l":"B","t":"在配置上区分「用户操作」与「自动修复」的事件来源，避免修复动作自身再触发修复。"},{"l":"C","t":"把所有自动修复关掉，全部改回人工处理——因噎废食，闭环价值全部丢失。"},{"l":"D","t":"把修复动作改成异步执行，错开时间——时序错开不解决来源不分的根因，循环依旧。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 死循环的根因是修复动作本身触发的新事件又被当成「用户操作」处理，再次进入修复流程。教材给的防法就是在配置上区分事件来源——修复动作产生的事件标记为「自动修复」，链路识别后不再对它触发修复，循环自然断开。\n\n**其他选项为什么错：**\n- A：防范手段明确存在，「无法避免」不成立。\n- C：关掉自动修复是放弃整个闭环，代价远超问题本身。\n- D：异步只是把循环在时间上拉开，每一轮修复照样会触发下一轮。\n\n**关键概念：** 区分事件来源（用户操作 vs 自动修复）是防修复死循环的关键开关。","s":"自编·5.2.5"},{"id":"D5-040","d":5,"t":"multiple","q":"团队在整理机群管理的速查手册，涉及 Systems Manager 的三件套与 Auto Scaling 的定位，手册要求每条描述都与服务的实际职责对得上，写错的条目要当场改掉，定稿之前由评审人逐条核对把关。以下说法正确的有哪些？（多选）","o":[{"l":"A","t":"Run Command 按标签或资源组圈定目标，一次性批量执行命令，输出按实例逐台可回查。"},{"l":"B","t":"State Manager 用关联声明实例的期望状态，定时评估，发现漂移即自动纠正。"},{"l":"C","t":"Run Command 适合「持续保持某状态」的场景——定时批量执行就能相当于持续保持。"},{"l":"D","t":"Automation 文档把多步骤运维动作写成可参数化剧本，支持审批节点与失败分支。"},{"l":"E","t":"Auto Scaling 负责在实例内安装软件组件——实例数量与放置才是它真正的职责。"}],"a":["A","B","D"],"e":"**正确答案：ABD。**\n\n**为什么对：** 三件套的定位各说各的：Run Command 是「变一次」——按目标圈定批量执行、输出留档；State Manager 是「一直保持」——关联声明期望状态、定时评估、漂移即纠正；Automation 是「流程化」——多步骤剧本、审批节点、失败分支。三条正确项与定位一一对应。\n\n**其他选项为什么错：**\n- C：持续保持是 State Manager 的职责，Run Command 定时人工跑替代不了自动评估与纠正。\n- E：Auto Scaling 管实例数量与放置，实例内软件安装不在其能力范围。\n\n**关键概念：** 变一次、一直保持、流程化——三个词分别对号 Run Command、State Manager、Automation；Auto Scaling 管容量不管软件。","s":"自编·5.2.1"},{"id":"D5-041","d":5,"t":"multiple","q":"机群级配置变更的落地纪律评审会上，运维负责人列了几条要求让团队逐条表决，要求每条都能在教材的落地细节里找到出处，表决通过后写进变更制度。以下哪些是教材给出的正确纪律？（多选）","o":[{"l":"A","t":"变更直接全量铺开，出了问题整体回滚——用回滚能力替代事前验证环节。"},{"l":"B","t":"先在灰度标签的少量生产实例上试跑，验证通过后再铺全量。"},{"l":"C","t":"执行输出按实例逐台留档，事后可回查、可抽查，直接作为核查材料。"},{"l":"D","t":"变更清单不需要评审，执行完再补材料——先动手后补票，效率优先。"},{"l":"E","t":"变更安排在维护窗口内执行，窗口外不动生产环境，特殊紧急情况另走审批。"}],"a":["B","C","E"],"e":"**正确答案：BCE。**\n\n**为什么对：** 教材在落地细节处给的纪律就是这三条：灰度先行——先在灰度标签的少量实例试跑再铺全量，控制爆炸半径；留档可查——执行输出按实例逐台留档，事后抽查有据；窗口可控——Run Command 支持维护窗口调度，变更在窗口内执行。变更清单先评审、动作才上机也是同一节的要求。\n\n**其他选项为什么错：**\n- A：回滚是补救手段，替代不了事前验证；全量直铺的爆炸半径不可控。\n- D：变更清单先评审是纪律，先执行后补材料方向反了。\n\n**关键概念：** 灰度试跑、逐台留档、维护窗口、清单评审——四条纪律构成机群变更的安全网。","s":"自编·5.2.3"},{"id":"D5-042","d":5,"t":"multiple","q":"一条「事件发生后自动修改资源配置」的链路即将上线，团队按教材的落点整理了一份上线前检查单，评审人要求逐条核对，站不住的条目直接删掉并写明理由，定稿前还要过一轮演练。以下哪些条目是正确的？（多选）","o":[{"l":"A","t":"链路四件套——事件源、规则、目标、执行角色 IAM 授权——逐项确认，缺一不可。"},{"l":"B","t":"执行角色的授权可以先不配，链路跑通再说——权限问题等出了再补也来得及。"},{"l":"C","t":"修复动作必须幂等——同一事件重复触发时，执行多次与执行一次结果一致。"},{"l":"D","t":"Lambda 调 API 改资源的失败不需要处理——失败就失败，等下条事件来了再说。"},{"l":"E","t":"失败可配死信队列兜底，重试次数设上限，别让事件无声消失。"}],"a":["A","C","E"],"e":"**正确答案：ACE。**\n\n**为什么对：** 检查单三条正确项对应教材的三个落点：四件套齐备——事件源、规则、目标、IAM 授权缺一链路就跑不动；动作幂等——同一事件可能被重复匹配，执行多次结果一致才安全；失败有兜底——重试设上限、死信队列接住失败事件，避免变更半途而废或事件无声消失。\n\n**其他选项为什么错：**\n- B：权限不齐链路静默失败，且最容易被漏——恰恰要上线前配好。\n- D：API 限流与部分失败不处理，变更就会半途而废。\n\n**关键概念：** 四件套、幂等、失败兜底——事件驱动改配置链路的三个安全阀。","s":"自编·5.2.4"},{"id":"D5-043","d":5,"t":"multiple","q":"关于「修复非期望系统状态」闭环的设计原则，评审会上出现了几种说法，负责人要求逐条判断，正确的写进设计规范，错误的当场纠正并说明错在哪，纠正记录一并归档，设计规范下周随版本发布。其中正确的有哪些？（多选）","o":[{"l":"A","t":"修复动作不需要幂等，多跑几次结果不一样也没关系，反正有重试兜底。"},{"l":"B","t":"修复动作要幂等——同一动作跑多次结果一致，否则重试会制造新问题。"},{"l":"C","t":"修复任务执行成功就算闭环完成——不需要再让规则复评资源状态。"},{"l":"D","t":"修复完成后让规则复评，确认资源回归合规，闭环才算走完。"},{"l":"E","t":"自动修复与人工修复按风险分级：低风险全自动，高风险先通知再人工确认。"}],"a":["B","D","E"],"e":"**正确答案：BDE。**\n\n**为什么对：** 三条正确项对应闭环设计的三个原则：幂等——同一动作跑多次结果一致，重试才不会制造新问题；验证——修复后规则复评转绿，闭环才算完成；风险分级——低风险全自动、高风险先通知人工确认，安全与效率兼顾。\n\n**其他选项为什么错：**\n- A：不幂等的修复在重试场景下会反复改变资源状态，制造新问题——说法与要求正好相反。\n- C：任务成功只说明动作跑完，不说明资源达标，缺验证的闭环发现不了「没修好」。\n\n**关键概念：** 幂等、复评验证、风险分级——修复闭环的三大设计原则；「执行成功≠修复达标」是高频陷阱。","s":"自编·5.2.5"},{"id":"D5-044","d":5,"t":"multiple","q":"用 Config 搭建自动修复闭环时，团队在方案会上讨论链路各环节的分工，要求把「谁发现、谁评估、谁执行、谁验证」一张图讲清楚，避免组件职责互相串线，讨论结果要同步给新入职同事。以下说法正确的有哪些？（多选）","o":[{"l":"A","t":"Config 规则负责发现与评估——持续评估资源配置是否合规，产出不合规清单。"},{"l":"B","t":"修复动作由 Config 自己执行——评估出结果后直接修改资源配置，不用其他组件。"},{"l":"C","t":"修复动作挂在评估结果上，由 SSM Automation 或 Lambda 这类执行件去执行纠正动作。"},{"l":"D","t":"修复记录是审计素材，保留期按合规要求确定，事后可以完整回溯。"},{"l":"E","t":"闭环不需要验证环节——规则评估过一次就够，修复后不用再评估。"}],"a":["A","C","D"],"e":"**正确答案：ACD。**\n\n**为什么对：** 闭环分工三条正确项：Config 是发现与评估端——持续评估、产出不合规清单；修复是执行端的事——挂在评估结果上由 Automation 或 Lambda 执行；修复记录是审计素材——保留期按合规要求定，事后可回溯。\n\n**其他选项为什么错：**\n- B：Config 不执行变更，评估端与执行端分离是链路的基本分工。\n- E：验证环节（修复后复评）是闭环四环节之一，缺它就发现不了修复失败。\n\n**关键概念：** 评估端（Config）与执行端（Automation/Lambda）分离＋修复留痕＋复评验证——自动修复链的完整分工图。","s":"自编·5.2.2"},{"id":"D5-045","d":5,"t":"single","q":"发布完成后线上接口的 5xx 错误率明显升高，值班同学要第一时间找到证据：应用自身的指标曲线和相关日志，先判断错误从哪个时间点开始涨、集中在哪些接口上，给后续复盘留下时间线。\n\n这个「第一现场」应该去哪里看？","o":[{"l":"A","t":"CloudWatch——应用的指标与日志都在这里，错误率曲线与日志详情能交叉定位第一现场。"},{"l":"B","t":"AWS CloudTrail——它记录的是控制面 API 调用历史，应用运行期的 5xx 报错不在这条流里。"},{"l":"C","t":"AWS Config——它评估资源配置是否合规，回答不了应用运行期的错误问题。"},{"l":"D","t":"AWS Health——它推送平台侧健康通告，应用自身的报错不属于平台通告范畴。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 排查工具箱的两件主力里，CloudWatch 负责指标与日志——错误率曲线给出「从几点开始涨」，日志给出「具体报了什么错」，两者交叉就能锁定第一现场，这是运行时失败排查的起点。\n\n**其他选项为什么错：**\n- B：CloudTrail 是控制面 API 审计，应用运行期的 5xx 不经过它。\n- C：Config 管配置合规，应用报错与配置评估是两回事。\n- D：Health 只报平台侧事件，应用自己的错不能赖平台。\n\n**关键概念：** 运行时失败先看 CloudWatch 的指标与日志；「平台的问题」才轮到 Health 出场。","s":"自编·5.3.1"},{"id":"D5-046","d":5,"t":"single","q":"微服务架构下某接口延迟突增，链路上有网关、认证、业务、支付四个服务，CloudWatch 里每个服务自己的指标都「看起来正常」，单看谁都像没问题的，要回答「请求到底在哪一段被拖慢、在哪一段报错」。\n\n该用哪个工具建立请求级视角？","o":[{"l":"A","t":"CloudWatch Logs——把四个服务的日志全部导出来逐条比对，人工拼出请求的完整路径。"},{"l":"B","t":"AWS Config——记录资源配置变化，请求在服务间的流转路径不在它的数据里。"},{"l":"C","t":"Amazon EventBridge——按规则把事件路由给目标，不提供请求级的服务间追踪能力。"},{"l":"D","t":"X-Ray——跟踪单个请求穿过哪些服务、各段耗时多少、哪一段抛出错误，跨服务链路一目了然。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 教材给 X-Ray 的定位就是跨服务请求链路——它把一个请求经过的每段服务、每段延迟、每段错误串成一条链路，哪一段延迟异常、哪个下游报错一目了然。各服务指标单独看都正常时，恰恰需要这种请求级视角把链路拼起来。\n\n**其他选项为什么错：**\n- A：日志分散在各服务里，人工比对拼不出完整链路，效率低且容易漏段。\n- B：Config 数据里没有请求流转路径。\n- C：EventBridge 是事件路由组件，与请求追踪无关。\n\n**关键概念：** CloudWatch 看单点指标日志，X-Ray 看跨服务链路——「哪一段拖慢的」这句话指向 X-Ray。","s":"自编·5.3.1"},{"id":"D5-047","d":5,"t":"single","q":"一次故障复盘时，有人怀疑是平台侧区域故障导致，也有人怀疑是应用的变更引入了问题，两派争执不下。组长要求把「我的问题」和「平台的问题」先分开：如果确认是平台侧服务异常导致的故障，责任边界和处理路径完全不同。\n\n判断平台侧是否出事，应该依据什么？","o":[{"l":"A","t":"AWS Health 的控制台与事件通告——平台侧出了什么事、影响到哪些账户，由它权威说明。"},{"l":"B","t":"自己应用的错误率曲线——应用报错只能说明现象，分不清是平台原因还是自身原因。"},{"l":"C","t":"CloudTrail 的 API 调用记录——它是操作审计，不承担平台健康状态的判定。"},{"l":"D","t":"值班同学的个人经验判断——没有权威数据源支撑的判断不能作为责任边界的依据。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 服务健康视角的分界就是 AWS Health——平台侧哪个服务在哪个区域出问题、影响到哪些账户，Health 的控制台与事件通告是权威说明。「我的问题还是平台的问题」这第一刀就靠它切。\n\n**其他选项为什么错：**\n- B：应用曲线是现象层证据，切不了责任边界。\n- C：CloudTrail 管操作审计，与平台健康判定无关。\n- D：经验判断没有数据源支撑，复盘材料里站不住。\n\n**关键概念：** 平台侧看 Health、自己应用看 CloudWatch——两本账分开看，责任边界才切得清。","s":"自编·5.3.2"},{"id":"D5-048","d":5,"t":"single","q":"团队的运维事件散落在各种告警与聊天群里，处理时常常找不到关联的资源清单和处理手册。要把运维事件集中成工单——一条事件关联相关资源与操作手册，作为响应中枢统一跟进。\n\n该用哪个工具承载？","o":[{"l":"A","t":"Amazon SNS——把告警推送到群与邮箱，推送之后没有工单化的跟进载体，处理过程不留痕。"},{"l":"B","t":"Amazon EventBridge——按规则路由事件，路由完成不等于运维事件被工单化管理。"},{"l":"C","t":"SSM OpsCenter——把运维事件集中成 OpsItem 工单，一条事件关联相关资源与操作手册，当响应中枢用。"},{"l":"D","t":"AWS Config——评估配置合规并留痕，不承担运维事件的工单化跟进与闭环。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 教材给 OpsCenter 的定位就是运维事件的响应中枢：一条事件进来生成 OpsItem 工单，工单上关联相关资源与操作手册，处理过程有据可查，适合当统一跟进的载体。\n\n**其他选项为什么错：**\n- A：SNS 是通知通道，推完就没有然后，工单化的「跟进」落不了地。\n- B：EventBridge 负责路由分发，不管事件后续的处理闭环。\n- D：Config 是配置合规线，与运维工单无关。\n\n**关键概念：** 「集中成工单＋关联资源与手册＋响应中枢」三个词齐出，指向 SSM OpsCenter 的 OpsItem。","s":"自编·5.3.2"},{"id":"D5-049","d":5,"t":"single","q":"一个 OpsItem 工单对应的故障处理完了，服务恢复正常，值班同学准备直接把工单关掉、翻篇下班。评审人拦住他，指出按响应纪律还差一步没做，不能就这么关，工单不是告警的转发站。\n\n按教材的口径，这一步是什么？","o":[{"l":"A","t":"把工单再挂一天观察有没有复发——观察有价值，但不是评审人指的那道必做环节。"},{"l":"B","t":"把工单转发给管理层备案——备案不是工单闭环的必要环节。"},{"l":"C","t":"把工单导出成周报附件——留痕方式之一，但不构成闭环动作本身。"},{"l":"D","t":"关闭前做复盘——把根因、影响面、处理过程沉淀下来，工单要关闭复盘，别留尾巴。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 教材对工单的纪律一句话：工单要关闭复盘，别留尾巴——处理完不等于结束，把根因、影响面、处理过程沉淀进复盘，同类问题再来时手册才有据可依，这才是工单闭环的完整形态。\n\n**其他选项为什么错：**\n- A：观察是处理动作的延伸，替代不了复盘这个沉淀环节。\n- B：备案是流转动作，不是知识沉淀。\n- C：导出周报是汇报形式，复盘才是内容本身。\n\n**关键概念：** OpsItem 的完整生命周期是「创建→处理→复盘→关闭」——少了复盘，响应中枢就退化成告警转发站。","s":"自编·5.3.2"},{"id":"D5-050","d":5,"t":"single","q":"一次线上故障，监控曲线显示某天下午两点起错误率爬升。要尽快逼近根因，组长要求先做一件事：把故障起点时间与当时的变更记录对齐，看看那个时间点前后有没有发布或配置变更。\n\n这一步对应的追问链环节是什么？","o":[{"l":"A","t":"影响面判断——先分清全量用户还是部分用户受影响，这一步与时间对齐的目的不同。"},{"l":"B","t":"链路分段验证——从入口逐段往下查每段的异常，与本动作的目的不同。"},{"l":"C","t":"根因定论——把最近的变更直接定为根因，结束排查，不再验证。"},{"l":"D","t":"时间对齐——什么时间开始，对齐变更记录，最近改过什么就是头号嫌疑人。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 教材的追问链第一环就是「什么时间开始，对齐变更记录」——变更即嫌疑人，故障起点与变更时间对上，排查就有了最短路径。组长要求的正是这一环。\n\n**其他选项为什么错：**\n- A：影响面是第二环「影响面多大，全量还是部分」，与本动作目的不同。\n- B：链路分段是第三环，定位链路上哪段先异常。\n- C：直接定论违反「不从最可疑处跳结论」的纪律——变更只是嫌疑人，还要验证。\n\n**关键概念：** 追问链四环：时间→影响面→链路首异常段→最近变更；考试问「最快定位根因的动作」往往就是靠前的一环。","s":"自编·5.3.3"},{"id":"D5-051","d":5,"t":"single","q":"客服陆续反馈有用户投诉某接口报错，但监控大盘的整体错误率看起来平稳，没有明显爬升，值班同学一时判断不了问题的严重程度，影响面不划清，后面的排查也没有边界。\n\n按根因分析的方法论，下一步最该做的动作是什么？","o":[{"l":"A","t":"直接重启全部服务节点——大盘平稳就当偶发处理，重启动作与定位无关。"},{"l":"B","t":"先划清影响面——确认是个别用户、部分地域还是全部用户受影响，把排查范围先收窄。"},{"l":"C","t":"把最近一次发布回滚——还没定位到与发布有关，先回滚是盲目动作。"},{"l":"D","t":"升级成最高优先级事故拉全员——影响面都没划清，先拉全员是资源浪费。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 追问链第二环就是「影响面多大，全量还是部分」——整体错误率平稳但有个别投诉，第一件事是把影响面划清楚：个别用户还是部分地域、哪个接口哪类操作受影响。影响面一划，排查范围立刻收窄，后面的链路分段才有靶子。\n\n**其他选项为什么错：**\n- A：重启是处置动作不是定位动作，影响面不明时连该重启什么都不知道。\n- C：没证据就回滚，把「变更即嫌疑人」当成了「变更即罪犯」。\n- D：升级要有依据，影响面不清就拉全员，排查秩序反而乱。\n\n**关键概念：** 从现象倒推、按链路逐段验证——影响面是第一道收窄范围的关卡。","s":"自编·5.3.3"},{"id":"D5-052","d":5,"t":"single","q":"培训里讲到根因分析的方法论，有同事在笔记里总结成「哪个服务最可疑就直接查哪个，查实了就下结论，这样最快」。组长看到后要求他重写这条笔记，把方法论的原话写上。\n\n按教材给的口径，这套做法的问题在哪？","o":[{"l":"A","t":"方法没问题，可疑服务查实了就是根因——直觉定位是效率最高的路径。"},{"l":"B","t":"应该同时排查所有服务，不分先后——平均用力反而拖慢定位速度。"},{"l":"C","t":"根因分析靠个人经验，没有方法论可循——教材恰恰给了一条可复用的追问链。"},{"l":"D","t":"方法论要求从现象倒推、按链路逐段验证，不从最可疑处直接跳结论——先验证链路上哪段先异常。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 教材的方法论一句话：从现象倒推，按链路逐段验证，不要从最可疑处直接跳结论——「最可疑」是主观判断，链路上「哪段先异常」是证据判断。追问链四环（时间、影响面、首异常段、最近变更）就是替直觉把关的流程。\n\n**其他选项为什么错：**\n- A：跳结论容易冤枉无辜服务，真正肇事的段可能还没查到。\n- B：不分先后的全面排查效率低，教材的追问链本身就是有次序的。\n- C：方法论明确存在，这条说法与事实相反。\n\n**关键概念：** 证据优先于直觉——「哪段先异常」比「哪段最可疑」更接近根因。","s":"自编·5.3.3"},{"id":"D5-053","d":5,"t":"single","q":"一次发布执行到一半流水线标红，发布没有走完，生产环境还停在旧版本上。值班同学要定位发布卡在哪一环、是什么原因导致的，排查要按发布链的顺序一段一段看证据，不能跳段。\n\n第一现场应该看什么？","o":[{"l":"A","t":"CodePipeline 的阶段执行历史与审批状态——先定位卡在哪个阶段、是不是审批卡住，再往下游走。"},{"l":"B","t":"生产环境的运行时指标——发布没完成，运行时还没接上新版本，指标对不上号。"},{"l":"C","t":"CloudTrail 的 API 审计记录——操作审计回答不了流水线内部卡在哪一环。"},{"l":"D","t":"X-Ray 的请求链路——请求还没走到新版本，链路视角与发布卡点无关。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 发布失败的排查沿发布链走：CodePipeline 卡住——先看该阶段的执行历史与审批状态，定位卡在哪一环；转移失败常见是 IAM 权限与制品边界问题。阶段历史是发布链排查的起点。\n\n**其他选项为什么错：**\n- B：发布没完成，运行时指标反映的还是旧版本，证据错位。\n- C：CloudTrail 是控制面审计，不看流水线内部状态。\n- D：请求链路是运行面视角，与发布链卡点无关。\n\n**关键概念：** 发布链证据（阶段历史/构建日志/部署组日志/栈事件）与运行面证据（指标/Pod 事件）起点不同——「流水线标红」从阶段历史看起。","s":"自编·5.3.4"},{"id":"D5-054","d":5,"t":"single","q":"流水线的 Build 阶段反复失败，同一条流水线前两天还是绿的，团队怀疑是构建环境出了问题，比如依赖源或环境组件发生了变化，要找到具体原因才能对症处理。\n\n按发布链排查路径，这一环的第一现场是哪里？","o":[{"l":"A","t":"CodePipeline 的审批记录——Build 阶段失败与审批动作无关，看错了证据位。"},{"l":"B","t":"生产环境的访问日志——构建失败发生在部署之前，生产环境还没接触过新制品。"},{"l":"C","t":"CodeBuild 的构建日志——依赖下载失败、测试不过、环境缺组件都在里面，是第一现场。"},{"l":"D","t":"CloudFormation 的栈事件列表——栈还没部署到 Build 失败的环节，事件列表帮不上忙。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 教材按发布链逐段给证据位：CodeBuild 失败——构建日志是第一现场，依赖下载失败、测试不过、环境缺组件全在里面。沿发布链排查，Build 阶段的问题进构建日志找。\n\n**其他选项为什么错：**\n- A：审批是 Pipeline 阶段的事，Build 失败看审批记录答非所问。\n- B：构建在部署之前，生产日志与新制品无关。\n- D：栈事件属于部署环节的证据，Build 还没走到那一步。\n\n**关键概念：** 发布链证据逐段对位：Pipeline 看阶段历史、Build 看构建日志、Deploy 看部署组事件、栈看事件列表。","s":"自编·5.3.4"},{"id":"D5-055","d":5,"t":"single","q":"CodeDeploy 的部署在多台实例中的部分实例上失败，部署状态显示失败，控制台只能看到整体失败结论，逐台原因要能落到具体机器上。\n\n要回答「哪几台实例失败、每台的失败原因是什么」，第一现场应该看哪里？","o":[{"l":"A","t":"CodeBuild 的构建日志——制品已经构建完成，构建环节与实例级失败无关。"},{"l":"B","t":"CloudWatch 的应用指标——指标反映服务状态，给不出逐台实例的部署失败原因。"},{"l":"C","t":"CodePipeline 的阶段历史——只能看到 Deploy 阶段整体失败，粒度不到单台实例。"},{"l":"D","t":"CodeDeploy 的部署组事件日志——里面给出每台实例的失败原因，钩子脚本退出码、权限、健康检查各是不同方向。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 教材对这一环的落点明确：CodeDeploy 失败——部署组事件日志给出每台实例的失败原因，钩子脚本退出码、权限不足、健康检查超时各是不同方向，还能据此配置自动回滚。逐台原因只有部署组事件日志能给。\n\n**其他选项为什么错：**\n- A：构建已完成，证据与实例级失败无关。\n- B：应用指标是聚合视角，粒度不到单台实例的部署动作。\n- C：阶段历史停在「阶段失败」这一层，往下钻要进部署组日志。\n\n**关键概念：** 部署失败的三段证据位各管一段——构建日志、部署组事件日志、栈事件列表，别看串位。","s":"自编·5.3.4"},{"id":"D5-056","d":5,"t":"single","q":"一次 CloudFormation 栈更新失败触发回滚，模板涉及几十个资源，团队只知道栈失败了，不知道是哪个资源引起的，也不能靠逐个人工排查。\n\n要在几十个资源里快速找到导致失败的根因资源，按排查路径应该怎么看？","o":[{"l":"A","t":"把模板全部重读一遍找语法错误——失败资源已经定位到了具体资源，重读模板效率最低。"},{"l":"B","t":"栈事件列表按资源倒序看——第一个 FAIL 的资源就是根因入口，从它往上追原因。"},{"l":"C","t":"逐个资源登录控制台人工检查——几十个资源的工作量太大，且方向盲目。"},{"l":"D","t":"直接删除栈重建——破坏性动作，根因还没找到就推倒重来，问题会重演。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 教材的口径：CloudFormation 失败——事件列表按资源倒序看，第一个 FAIL 的资源就是根因入口，从它的错误信息往上追原因；回滚策略结合栈状态一起判断。事件列表把失败资源按时间排好了，第一个红灯就是起点。\n\n**其他选项为什么错：**\n- A：失败资源已被事件列表定位，重读全模板是绕远路。\n- C：人工逐个检查方向盲目，事件列表已经给出了答案的位置。\n- D：推倒重来既丢现场也不解决根因。\n\n**关键概念：** 栈事件的「倒序＋第一个 FAIL」就是根因入口——这是部署失败排查里最固定的一条路径。","s":"自编·5.3.4"},{"id":"D5-057","d":5,"t":"single","q":"每次发布完成后都出现过「部署显示成功、但用户马上报错」的情况，部署状态是绿的，业务却不可用，中间隔着一段没人管的空窗。\n\n要在部署完成后立刻从外部验证关键路径可用，发现「上去了但不可用」的情况并自动告警，该用哪个工具实现？","o":[{"l":"A","t":"CloudWatch Synthetics 的 canary——从外部持续探测关键路径，部署后立刻失败即告警，验证「部署成功≠业务可用」。"},{"l":"B","t":"CodeDeploy 的部署组事件日志——它记录部署动作本身的成败，探测不到部署完之后业务可用不可用。"},{"l":"C","t":"AWS Config 规则——评估资源配置合规，探测不了应用的关键路径是否可用。"},{"l":"D","t":"CloudTrail 数据事件——记录数据面的 API 调用明细，不承担外部拨测职责。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 教材对合成监控的定位：canary 从外部持续探测关键路径，部署后立刻失败说明「上去了但不可用」——部署成功与业务可用是两回事，canary 失败自动告警，把这道缝隙补上。\n\n**其他选项为什么错：**\n- B：部署组日志停在部署动作层，测不了部署完之后业务通不通。\n- C：Config 是配置合规线，不做可用性探测。\n- D：CloudTrail 管调用记录，不是主动拨测工具。\n\n**关键概念：** 题干带「外部探测」「定时拨测」「部署后验证」就选 Synthetics——部署成功与业务可用之间隔着一道 canary。","s":"自编·5.3.4"},{"id":"D5-058","d":5,"t":"single","q":"高峰期应用变慢，自动扩缩容的策略明明配置了按负载扩容，告警也显示负载已经越过了阈值，预期的新实例却迟迟没有出现，要先看证据再动手，不能上来就改策略。\n\n按流程失败的排查路径，第一现场应该看哪里？","o":[{"l":"A","t":"应用的错误率指标——它反映服务运行状态，解释不了扩容为什么迟迟没有发生。"},{"l":"B","t":"X-Ray 的请求链路——链路视角看请求延迟与错误，看不到扩缩容的内部决策过程。"},{"l":"C","t":"扩缩活动历史（Scaling Activity History）——每次扩缩成败与原因都记得明明白白。"},{"l":"D","t":"CloudTrail 的 API 记录——控制面审计不含自动扩缩容内部的决策与拒绝原因。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 教材给的排查链第一现场就是扩缩活动历史：里面记着每次扩缩的成败与原因——已达最大容量、指标数据不足、冷却期内被跳过、IAM 不够调 API，原因写得明明白白。扩容没生效，先看它，别急着改策略。\n\n**其他选项为什么错：**\n- A：应用指标是现象，扩缩没发生的原因在扩缩组件内部。\n- B：X-Ray 看请求，不
