看容量决策。\n- D：CloudTrail 审计 API 调用，扩缩组件内部的「为什么没调」不在其中。\n\n**关键概念：** 「扩容没生效」第一动作＝查 Scaling Activity History——平台替你记好的历史，考试考的就是知不知道去哪看。","s":"自编·5.3.5"},{"id":"D5-059","d":5,"t":"single","q":"扩缩活动历史里显示：扩容策略已经正常触发，但扩容请求被拒绝，拒绝原因是「已达组最大容量」。值班同学临时手动加了几台解燃眉之急，但临时手段不能当长效方案。\n\n按教材给的思路，后续该怎么处理？","o":[{"l":"A","t":"把扩缩策略删掉重建——策略本身触发正常，问题出在容量边界，重建没有意义。"},{"l":"B","t":"临时上调最大容量上限解燃眉，回头按真实峰值重新定容量边界。"},{"l":"C","t":"提高扩缩策略的触发灵敏度——触发已经正常，灵敏度不是这次的原因。"},{"l":"D","t":"给扩缩角色加 IAM 权限——历史里的原因是容量上限，不是权限不足。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 这是教材的原型场景：策略已触发但被「已达最大容量」拒绝——说明触发链路健康，卡在容量边界。处理分两步：临时上调上限解燃眉之急，回头按真实峰值重新定容量边界，让边界贴合业务。\n\n**其他选项为什么错：**\n- A：策略触发正常，重建策略不解决问题。\n- C：灵敏度影响「何时触发」，这次已经触发了，不是灵敏度问题。\n- D：活动历史写明的原因是容量上限，不是 IAM。\n\n**关键概念：** 活动历史的原因字段直接指向修法——「已达最大容量」改边界、「数据不足」查指标、「冷却期」调冷却、「IAM 不够」补权限。","s":"自编·5.3.5"},{"id":"D5-060","d":5,"t":"single","q":"ECS 集群里的某个任务反复启动又退出，服务一直起不来，停止与重启循环出现，业务流量全部落在剩余实例上。\n\n要查清每次任务退出的具体原因（镜像拉不到、端口冲突、内存超限还是健康检查杀掉），应该看什么？","o":[{"l":"A","t":"服务的目标组健康检查记录——只有健康与不健康两种结果，给不出退出原因分类。"},{"l":"B","t":"ECS 的任务停止原因（stopped task reason）——每次退出都有明确的停止原因，各类失败各有特征；服务事件流补充调度层的失败。"},{"l":"C","t":"CloudTrail 的事件记录——控制面审计不含容器运行期的退出原因。"},{"l":"D","t":"容器实例的 CPU 内存曲线——资源曲线是背景信息，不回答「为什么退出」。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 教材的口径：ECS 失败看任务停止原因——镜像拉不到、端口冲突、内存超限、健康检查杀掉各有特征，停止原因字段直接写明；服务事件流（service events）再补上调度层面的失败记录。两层证据合起来就是 ECS 侧的第一现场。\n\n**其他选项为什么错：**\n- A：健康检查结果只有两态，分类信息在停止原因里。\n- D：资源曲线是辅助背景，不是结论。\n- C：CloudTrail 是控制面审计，容器运行期退出不经过它。\n\n**关键概念：** 「容器一直重启」→ ECS 看任务停止原因——第一现场永远是平台记好的历史。","s":"自编·5.3.5"},{"id":"D5-061","d":5,"t":"single","q":"EKS 集群里一批 Pod 长时间停在 Pending 状态，没有被调度到任何节点上，业务部署被卡住，团队需要先弄清调度为什么失败——可能是资源不足，也可能是调度约束，不能靠猜，要看平台记下来的证据。\n\n按排查路径，第一步应该看什么？","o":[{"l":"A","t":"Pod 事件——Pending 多是资源不足或调度约束，事件里会写明调度失败的具体原因。"},{"l":"B","t":"应用的容器日志——容器还没被调度启动，日志里根本没有内容可看，此路不通。"},{"l":"C","t":"节点的操作系统日志——问题发生在调度层，还没落到节点上，看节点日志为时过早。"},{"l":"D","t":"CodePipeline 的执行历史——发布链视角与 Pod 调度失败无关，看错了排查线。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 教材的口径：EKS 看 Pod 事件——Pending 多是资源不足或调度约束，事件里写明调度失败的具体原因（节点资源不够、亲和性不满足、污点排斥等），第一步就是读事件。\n\n**其他选项为什么错：**\n- B：容器没启动就没有日志，这条路径走不通。\n- C：Pod 没调度到节点，节点日志与它无关。\n- D：发布链是另一条排查线，与调度失败无关。\n\n**关键概念：** EKS 排查三看：Pending 看 Pod 事件、CrashLoopBackOff 看容器日志与探针、ImagePullBackOff 查镜像与凭证——症状对位证据。","s":"自编·5.3.5"},{"id":"D5-062","d":5,"t":"single","q":"EKS 集群里多个 Pod 显示 ImagePullBackOff 状态，镜像一直拉取失败，Pod 起不来，部署卡在这一步。镜像拉取失败通常有几类常见原因，各类原因在平台上留下的痕迹位置不同，要按对位关系检查而不是全面撒网，这样定位最快。\n\n应该优先检查什么？","o":[{"l":"A","t":"节点的 CPU 使用率——镜像拉取失败与节点负载高低没有直接的因果关系。"},{"l":"B","t":"Pod 的探针配置——探针影响健康检查判定，管不到镜像拉取这一步的动作。"},{"l":"C","t":"镜像名与仓库凭证——镜像名写错、仓库地址不通、凭证失效都是这个症状的常见根因。"},{"l":"D","t":"扩缩容的活动历史——容量视角的证据，与镜像拉取失败没有关系。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 教材按症状给了对位证据：ImagePullBackOff 查镜像名与仓库凭证——名字拼错、tag 不存在、仓库地址不通、拉取凭证失效，都会卡在拉取这一步。症状与检查项是一一对应的。\n\n**其他选项为什么错：**\n- A：节点负载影响调度与运行，不影响镜像仓库的可达性。\n- B：探针是健康检查环节，镜像还没拉下来，探针还没机会跑。\n- D：扩缩历史是容量线证据，与镜像拉取无关。\n\n**关键概念：** 症状对位：Pending→调度、CrashLoopBackOff→日志与探针、ImagePullBackOff→镜像与凭证——背熟对位表考试直接秒答。","s":"自编·5.3.5"},{"id":"D5-063","d":5,"t":"multiple","q":"团队在整理排查工具箱的分工速查卡，涉及 CloudWatch、X-Ray 与其他工具的边界，要求每条描述都能落到服务的实际能力上，速查卡要贴在值班工位上，写错一条误导一批人，定稿前要逐条过一遍。\n\n以下说法正确的有哪些？（多选）","o":[{"l":"A","t":"CloudWatch 看指标与日志——错误率曲线、日志详情都在这里，是运行时排查的第一现场。"},{"l":"B","t":"X-Ray 可以替代 CloudWatch 日志——有了链路追踪就不再需要保留任何日志。"},{"l":"C","t":"X-Ray 看跨服务请求链路——单个请求穿过哪些服务、哪段延迟异常一目了然。"},{"l":"D","t":"两者互补——指标聚合看整体状态，请求级链路看个体请求，排查时常配合使用。"},{"l":"E","t":"CloudTrail 能画出服务间请求链路——把 API 审计记录串起来就是链路数据。"}],"a":["A","C","D"],"e":"**正确答案：ACD。**\n\n**为什么对：** 三条正确项就是工具箱的分工底图：CloudWatch 管指标与日志——整体状态与第一现场；X-Ray 管跨服务请求链路——个体请求的全程视角；两者互补，聚合视角定位异常时段后，用请求级链路钻到具体段落。\n\n**其他选项为什么错：**\n- B：链路追踪与日志是互补不是替代——链路告诉你哪段异常，日志告诉你那段里具体报了什么。\n- E：CloudTrail 是控制面 API 审计，不含服务间请求流转，画不出链路。\n\n**关键概念：** 指标聚合（CloudWatch）＋请求链路（X-Ray）双视角配合；CloudTrail 不在排查链路这个位上。","s":"自编·5.3.1"},{"id":"D5-064","d":5,"t":"multiple","q":"关于服务健康视角与运维事件的响应中枢，团队在培训后总结了几条笔记，涉及 Health 的定位、OpsCenter 的工单能力与工单闭环纪律三块内容，发到群里请大家逐条核对，有错的当场指出修正，核对完再归档。\n\n以下笔记正确的有哪些？（多选）","o":[{"l":"A","t":"AWS Health 记录本账户的 API 操作历史——把操作审计与健康通告捏在一个服务里。"},{"l":"B","t":"平台侧出了什么事，以 AWS Health 的控制台与事件通告为权威依据。"},{"l":"C","t":"SSM OpsCenter 可以被 CloudWatch 告警完全替代——有告警提醒就够了，工单化的跟进是多余的。"},{"l":"D","t":"SSM OpsCenter 把运维事件集中成 OpsItem 工单，一条事件关联相关资源与操作手册，统一跟进。"},{"l":"E","t":"OpsItem 工单要关闭复盘，别留尾巴——根因、影响面与处理过程都要沉淀进故障手册。"}],"a":["B","D","E"],"e":"**正确答案：BDE。**\n\n**为什么对：** 三条正确笔记对应服务健康视角的三块内容：权威依据——平台侧状态以 Health 的控制台与通告为准，它是「平台的问题」的判定源；响应中枢——OpsCenter 把事件集中成 OpsItem，关联资源与操作手册；闭环纪律——工单关闭前复盘，别留尾巴。\n\n**其他选项为什么错：**\n- A：API 操作历史是 CloudTrail 的职责，Health 只推送健康通告——两个服务被捏在一起了。\n- C：告警负责「叫醒」，工单负责「跟进闭环」——关联资源与手册、处理留痕这些告警给不了。\n\n**关键概念：** 平台问题看 Health、自身状态看 CloudWatch、事件跟进看 OpsCenter——三本账各管一段。","s":"自编·5.3.2"},{"id":"D5-065","d":5,"t":"multiple","q":"根因分析追问链的培训结束后，团队整理了几条实践要点，覆盖时间对齐、影响面收窄与链路分段验证三个环节，准备贴进故障处理手册，要求每条都经得起复盘的检验。\n\n以下说法正确的有哪些？（多选）","o":[{"l":"A","t":"先对齐时间——故障从什么时间开始，与变更记录对照，最近改过什么就是头号嫌疑人。"},{"l":"B","t":"从最可疑的服务直接跳结论——直觉往往是对的，逐段验证太慢。"},{"l":"C","t":"按链路逐段验证——定位链路上哪一段先异常，而不是先入为主地锁定某个服务。"},{"l":"D","t":"先划影响面——全量还是部分、哪些接口哪些用户，把排查范围先收窄。"},{"l":"E","t":"影响面判断不重要——直接进链路分段排查效率更高，不用先收窄范围。"}],"a":["A","C","D"],"e":"**正确答案：ACD。**\n\n**为什么对：** 三条正确项就是追问链的前三环：时间对齐——起点与变更记录对照，变更即嫌疑人；链路逐段验证——哪段先异常是证据判断；影响面收窄——全量还是部分决定排查范围。方法论一句话：从现象倒推，按链路逐段验证。\n\n**其他选项为什么错：**\n- B：跳结论是教材点名反对的做法——最可疑是主观判断，首异常段是证据判断。\n- E：影响面不划清，链路分段就没有边界，排查范围失控。\n\n**关键概念：** 追问链四环：时间→影响面→链路首异常段→最近变更；考试问「最快定位」通常指靠前的环。","s":"自编·5.3.3"},{"id":"D5-066","d":5,"t":"multiple","q":"部署失败排查的证据位对号入座，团队把 Pipeline、Build、栈回滚与部署后拨测四个证据位的一一对应关系写进值班手册，组长要求逐条核对后再定稿，定稿前先在组内过一遍评审。\n\n以下对应正确的有哪些？（多选）","o":[{"l":"A","t":"部署失败先查运行时指标——运行时视角优先于发布链证据，这是起点走错的方向。"},{"l":"B","t":"CodePipeline 卡住——看该阶段的执行历史与审批状态，转移失败常见是权限与制品边界问题。"},{"l":"C","t":"CodeBuild 失败——构建日志是第一现场，依赖下载失败、测试不过、环境缺组件都在里面。"},{"l":"D","t":"CloudFormation 回滚不用看事件列表——回滚是自动的，等它自己跑完就行。"},{"l":"E","t":"CloudWatch Synthetics 的 canary——部署后从外部持续拨测关键路径，专门抓「上去了但不可用」的情况。"}],"a":["B","C","E"],"e":"**正确答案：BCE。**\n\n**为什么对：** 三条正确项就是发布链的证据位：Pipeline 卡住看阶段历史与审批状态；Build 失败看构建日志；部署后的可用性缺口由 canary 从外部拨测补上——部署成功与业务可用是两回事。\n\n**其他选项为什么错：**\n- A：起点走错了——部署失败看「发布链」的证据，运行时指标是运行面视角，两套证据别混。\n- D：回滚策略要结合栈状态判断，事件列表里第一个 FAIL 的资源就是根因入口，不看事件等于放弃最短路径。\n\n**关键概念：** 发布链四段证据位：阶段历史→构建日志→部署组事件→栈事件列表；canary 补「部署成功≠业务可用」的缝。","s":"自编·5.3.4"},{"id":"D5-067","d":5,"t":"multiple","q":"运行时流程失败的「第一现场」对号入座，团队整理了几条对应关系，覆盖扩缩、ECS 与 EKS 三类运行时对象，每条都要写清「去哪里看、能看到什么」，方便值班同学直接照着查，不用再翻教材。\n\n以下对应正确的有哪些？（多选）","o":[{"l":"A","t":"扩容没生效——先看扩缩活动历史，每次扩缩的成败与原因都记录得明明白白。"},{"l":"B","t":"ECS 任务反复重启——看任务停止原因，镜像、端口、内存、健康检查各有特征。"},{"l":"C","t":"扩容失败先改扩缩策略——策略是不是正常触发还不清楚，先改策略属于盲动。"},{"l":"D","t":"EKS Pod 异常——看 Pod 事件与容器日志，Pending、CrashLoop、ImagePull 三种症状各自有对位的检查项。"},{"l":"E","t":"容器重启直接重启节点——没看停止原因就重启节点，问题大概率会原样重演。"}],"a":["A","B","D"],"e":"**正确答案：ABD。**\n\n**为什么对：** 三条正确项就是运行时失败的三类第一现场，共同点是「平台替你记好的历史」：扩缩活动历史记每次扩缩成败与原因；ECS 任务停止原因写明退出原因分类；EKS 的 Pod 事件与容器日志按症状对位——Pending 看事件、CrashLoop 看日志与探针、ImagePull 查镜像凭证。\n\n**其他选项为什么错：**\n- C：先看证据再下结论——活动历史没查就改策略，方向可能是错的。\n- E：没看停止原因就重启节点，根因还在，重启只是把问题按了暂停。\n\n**关键概念：** 先看证据，再下结论——运行时失败的第一现场全是平台记好的历史，考试考的就是知不知道去哪看。","s":"自编·5.3.5"},{"id":"D6-002","d":6,"q":"一家公司在 AWS Organizations 下管理着三十多个账号。某团队提交的操作满足三个条件：该账号的 IAM 身份策略明确允许这个动作，目标桶的资源策略也允许，但组织挂在该账号所在 OU 上的 SCP 对这个动作写了显式拒绝。安全评审让大家判断这次调用的最终结果。\n\n按照策略评估规则，结果是什么？","o":[{"l":"A","t":"允许——身份策略与资源策略两层都放行，评估已经通过，SCP 不参与同一账号内的判断。"},{"l":"B","t":"允许——只要存在任意一层允许，策略评估就取最宽结果，显式拒绝只在身份策略内部生效。"},{"l":"C","t":"拒绝——SCP 是账号级天花板，任何一层显式拒绝即生效，允许再多层也压不过拒绝。"},{"l":"D","t":"拒绝——资源策略与身份策略冲突时以资源策略为准，本题里资源策略实际写的是拒绝。"}],"a":["C"],"t":"single","s":"自编·6.1.5","e":"**正确答案：C。**\n\nAWS 的授权判定是各层取交集：身份策略、资源策略、SCP、权限边界任何一层说不允许，最终就是不允许，显式拒绝永远赢。SCP 挂在组织与 OU 上，是账号级天花板，账号内的策略写得再宽也超不出它。\n\n- A：错在以为 SCP 不参与判断，它对账号内所有主体都生效。\n- B：错在「取最宽」这种评估逻辑不存在，必须每一层都允许。\n- D：两者并不冲突，本题的拒绝来自 SCP，与资源策略的内容无关。\n\n记忆点：显式拒绝永远赢，允许要层层都点头。"},{"id":"D6-003","d":6,"q":"平台团队要把权限管理委派给各业务团队的管理员：团队自己维护成员的 IAM 策略，但公司规定所有团队一律不许访问账单与成本数据，这条红线不能依赖团队自觉遵守。评审会上讨论用哪层机制兜住这条线。\n\n最合适的设计是什么？","o":[{"l":"A","t":"在每个成员的身份策略里删掉账单相关动作，红线靠团队自律与定期人工巡检兜底。"},{"l":"B","t":"给每个团队管理员的委派角色挂权限边界，边界里排除账单动作，策略再宽也越不过边界。"},{"l":"C","t":"把账单服务的资源策略改成全部拒绝，身份策略随便写，最终会被资源策略拦住。"},{"l":"D","t":"提高审批门槛，团队每次要开账单权限都走工单，审批通过后由平台团队手动开通。"}],"a":["B"],"t":"single","s":"自编·6.1.5","e":"**正确答案：B。**\n\n权限边界就是给「可委派权限的管理员」用的护栏：被委派的人怎么配策略都超不出边界，这是机制保证而不是流程约束。题干红线要求「不靠自觉」，只有边界、SCP 这类机制层能兜住；单团队范围的落法选边界最贴。\n\n- A：靠自觉与巡检不满足机制保证的要求，巡检总有漏网窗口。\n- C：账单与成本类动作没有对应资源策略可挂，这条路走不通。\n- D：审批是流程控制，挡得住申请挡不住误配，且运营成本高。\n\n记忆点：边界收窄委派权限，红线要落在机制层。"},{"id":"D6-004","d":6,"q":"某开发角色的身份策略里同时写了：对某日志组的一组读动作允许，又对其中一个删除动作写了显式拒绝。该角色所在账号的 SCP 与权限边界对这个动作都没有额外限制。运维新人判断不了这个角色能不能执行删除动作，来问值班同学。\n\n正确的判断是什么？","o":[{"l":"A","t":"不能——显式拒绝在评估里优先级最高，同一层里的允许压不过它。"},{"l":"B","t":"能——显式拒绝只在跨策略类型冲突时才生效，身份策略内部以允许为准。"},{"l":"C","t":"不能——身份策略内部出现拒绝时整条策略作废，该角色的所有动作都会被拦。"},{"l":"D","t":"能——SCP 与权限边界没有限制就代表默认允许，删除动作按允许处理。"}],"a":["A"],"t":"single","s":"自编·6.1.5","e":"**正确答案：A。**\n\n同一条身份策略里允许与拒绝同时命中时，显式拒绝优先，删除动作被拦。SCP 与权限边界本题没有额外限制，不影响这个结论——它们若有限制，也只会更严不会更宽。\n\n- B：显式拒绝在任何策略类型里都最高优先，不存在「同层以允许为准」的规则。\n- C：拒绝只作用于被拒的动作，不会让整条策略作废，读动作照常可用。\n- D：没有额外限制不等于默认允许，允许仍须由策略显式给出。\n\n记忆点：显式拒绝永远赢，无限制不等于默认放行。"},{"id":"D6-005","d":6,"q":"组长让新入职的同学把最小权限三层收敛的要点整理成笔记，说这部分内容新人最容易把「收窄」和「放大」搞反，整理完要在组会上讲一遍，讲错会被老员工当场纠正，笔记定稿后留档。\n\n下列笔记正确的有哪些？（多选）","o":[{"l":"A","t":"第一层用 SCP 划账号级天花板，比如全组织禁用某区域的操作，账号内谁也超不过。"},{"l":"B","t":"第二层用 IAM 身份策略写具体允许的动作与资源 ARN，权限写到动作级而不是服务级。"},{"l":"C","t":"第三层权限边界用来给委派角色追加更高权限，让管理员能突破原本的限制。"},{"l":"D","t":"最终权限是各层取交集，任何一层说不允许，最终结果就是不允许。"},{"l":"E","t":"允许与拒绝同时命中时以允许为准，显式拒绝只对跨账号的访问生效。"}],"a":["A","B","D"],"t":"multiple","s":"自编·6.1.5","e":"**正确答案：ABD。**\n\n三层收敛的要点：SCP 划账号天花板、IAM 策略写具体动作与资源、权限边界封住委派链，最终权限取交集。C 把边界说成放大，E 把评估优先级说反，两处都是新人最易搞混的点，也是骨架点名的失分方向。\n\n- C：权限边界给委派角色做的是封顶，被委派的人写得再宽也越不过边界，不可能用它追加更高权限。\n- E：评估里显式拒绝永远优先，同一层里的允许压不过它，是不是跨账号访问不改变这条规则。\n\n记忆点：边界收窄不放大，判定取交集，拒绝最优先。"},{"id":"D6-006","d":6,"q":"安全审计发现一条挂在数据处理角色上的身份策略写得太宽：动作是对整个 s3 服务的全部操作放行，资源写成通配符，而实际业务只需要读取一个指定前缀下的对象。整改要求把这条策略收敛到最小权限且不影响业务。\n\n最合理的改法是什么？","o":[{"l":"A","t":"动作保持全部放行，把资源收窄到桶级别，桶内所有对象继续可读，业务完全无感。"},{"l":"B","t":"资源保持通配不变，把动作收窄到只读类操作，靠动作收敛兜住访问范围。"},{"l":"C","t":"在策略里追加一条显式拒绝写操作，允许部分原样保留，用拒绝条款压制过宽的允许。"},{"l":"D","t":"动作收窄到对象读取类操作，资源收窄到指定前缀的对象 ARN，两个维度同时收敛。"}],"a":["D"],"t":"single","s":"自编·6.1.5","e":"**正确答案：D。**\n\n最小权限的收敛要动作与资源两个维度同时做：业务只读指定前缀，那就把动作收到读取类、资源收到该前缀的对象 ARN，多一点都不留。只收一维都会留下明显过宽的面。\n\n- A：资源只收到桶级，桶内其他前缀依旧可读，仍明显超出业务需要。\n- B：资源还是通配符，跨桶的同名动作照样放行，面没有收住。\n- C：用拒绝条款压制是打补丁，策略本体还是过宽，审计上仍会被判不合格。\n\n记忆点：最小权限按动作与资源双维收敛，不打拒绝补丁。"},{"id":"D6-007","d":6,"q":"公司合规新规要求：所有账号一律不许在欧洲中部区域创建资源，历史遗留资源限期迁移。这条要求要覆盖组织内全部现有账号与未来新建账号，且不能被账号内管理员绕过或私自关闭。平台团队讨论用哪个机制落地。\n\n最合适的机制是什么？","o":[{"l":"A","t":"在每个账号部署 Config 规则检测该区域的资源，发现后通知管理员手工清理。"},{"l":"B","t":"在组织层面挂 SCP，对该区域的服务动作写显式拒绝，账号内无法绕过也无法关闭。"},{"l":"C","t":"用 IAM 权限边界统一收敛，给每个账号管理员的角色都挂上排除该区域的边界。"},{"l":"D","t":"发公司通知要求各团队遵守，每季度做一次合规审计，违规团队通报并限期整改。"}],"a":["B"],"t":"single","s":"自编·6.1.5","e":"**正确答案：B。**\n\n「全组织、防绕过、防关闭」三个条件指向 SCP：它挂在组织与 OU 上对账号内所有主体生效，账号管理员无权修改或关闭，新建账号挂上组织结构就自动继承。\n\n- A：Config 只做检测，动作照样能发生，不满足「不许创建」的硬约束。\n- C：边界只管被挂了边界的角色，新建角色与未纳管身份不在覆盖面内。\n- D：通知与审计都是管理手段，挡不住即时操作，也不满足防绕过要求。\n\n记忆点：组织级硬禁令落 SCP，检测类机制兜不住「不许做」。"},{"id":"D6-008","d":6,"q":"某团队管理员拿到一个被委派的自治角色，权限边界限定在计算与存储类服务。他希望给自己追加管理员级权限方便日后操作，于是在自己的身份策略里写了全部服务的允许动作，提交后执行时依然被拒。他不明白原因，来问平台团队。\n\n原因是什么？","o":[{"l":"A","t":"身份策略的通配写法不被 IAM 支持，全部服务必须逐个列出，语法修正后即可通过。"},{"l":"B","t":"账号级 SCP 默认拒绝管理类动作，管理员权限在任何账号里都要先走组织审批。"},{"l":"C","t":"权限边界先于他的策略生效，边界没放行的动作写得再宽也越不过去。"},{"l":"D","t":"新策略有生效延迟周期，提交后要等评估刷新，过一段时间重试就能通过。"}],"a":["C"],"t":"single","s":"自编·6.1.5","e":"**正确答案：C。**\n\n权限边界先于实体自己的策略生效：最终权限是身份策略与边界的交集，边界只放行计算与存储，管理员级动作不在其中，身份策略写得再宽也会被边界压住。这正是「边界收窄委派权限」的设计意图——委派链没有失控。\n\n- A：通配符写法是合法语法，问题不在语法而在边界。\n- B：题干没说 SCP 有限制，把原因归到审批属于臆测。\n- D：策略变更基本即时生效，不存在要等待的评估刷新周期。\n\n记忆点：边界先于策略生效，委派权限永远封顶在边界内。"},{"id":"D6-009","d":6,"q":"一家电商公司有几百个资源按项目分组，团队只允许访问本项目的资源。运维负责人不想在每开一个新项目时都改一遍策略文件，希望权限随资源自动生效，减少人工维护。评审会上让大家给方案。\n\n最合适的访问控制模式是什么？","o":[{"l":"A","t":"RBAC——按项目各建一个用户组，权限策略挂组上，新项目开组并挂一份新策略。"},{"l":"B","t":"ABAC——主体与资源都按项目打标签，策略用标签条件匹配，新资源打上标签即被覆盖。"},{"l":"C","t":"资源策略——每个资源单独写资源策略指定允许的团队，新项目逐个资源补策略。"},{"l":"D","t":"ACL——沿用访问控制列表逐条授权，新项目按清单把团队成员加进访问列表。"}],"a":["B"],"t":"single","s":"自编·6.1.6","e":"**正确答案：B。**\n\n题干的关键诉求是「新项目不改策略」：ABAC 的载体是标签，主体与资源标签匹配即放行，新资源打上正确的标签就自动被既有策略覆盖，这正是 ABAC 规模化优势的标准场景。\n\n- A：每个新项目都要开组挂策略，恰恰是要继续改策略，诉求没满足。\n- C：逐资源写资源策略的维护量比组策略更大，规模化更差。\n- D：ACL 逐条维护是更重的老模式，与自动生效背道而驰。\n\n记忆点：资源多、按属性分组、不想改策略，三个特征选 ABAC。"},{"id":"D6-010","d":6,"q":"一个十人小团队维护的内部系统只有十几个资源，岗位分工固定：开发、测试、运维三类角色，权限半年都不变一次。新来的同学提议引入按标签匹配的属性授权把权限做细，老员工提醒他先看规模再选型，别为了先进而先进。\n\n正确的选型判断是什么？","o":[{"l":"A","t":"上 ABAC——标签授权是更先进的模式，小团队也应当尽早对齐行业最佳实践。"},{"l":"B","t":"上 ABAC——先把标签规范立起来，将来资源多了就不用再改，现在的投入算提前还债。"},{"l":"C","t":"上 RBAC——但要用用户组嵌套实现标签语义，两层结构兼顾灵活与规模。"},{"l":"D","t":"上 RBAC——岗位固定、资源不多，按职能分组授权就够，引入 ABAC 是过度设计。"}],"a":["D"],"t":"single","s":"自编·6.1.6","e":"**正确答案：D。**\n\nRBAC 与 ABAC 的选型分界在规模与变化频率：岗位固定、资源少、权限稳定，RBAC 的用户组模式维护成本最低；ABAC 的优势要在资源多、属性变化频繁时才体现，提前引入还要额外背一套标签治理。\n\n- A：模式没有绝对先进，脱离规模谈先进就是过度设计。\n- B：为不存在的规模提前投入标签治理，成本花在不产生收益的地方。\n- C：用户组嵌套造不出标签语义，两层结构只增加维护复杂度。\n\n记忆点：岗位固定规模小用 RBAC 就够，别过度设计。"},{"id":"D6-011","d":6,"q":"团队要把 ABAC 模式落到生产权限管理上，组长要求先把落地的关键点过一遍评审：哪些前提要先立、哪些细节容易踩坑，评审通过的条目写进落地方案，没通过的当场修改再过。\n\n下列说法正确的有哪些？（多选）","o":[{"l":"A","t":"上线前先立标签治理：标签键命名、必打标签清单、打错的纠正流程三样齐了，才敢把权限押在标签上。"},{"l":"B","t":"标签打错也没关系，策略评估会自动忽略不匹配的标签条件，不会造成权限异常。"},{"l":"C","t":"标签条件运算符常用两个就够用：StringEquals 做精确匹配，StringLike 做前缀通配匹配。"},{"l":"D","t":"ABAC 的策略文件每新增一个项目就要新增一份，标签只是辅助备注，不参与权限判定。"},{"l":"E","t":"环境标签可以区分生产与测试，同一个项目的生产库，测试角色的标签不匹配就自然够不着。"}],"a":["A","C","E"],"t":"multiple","s":"自编·6.1.6","e":"**正确答案：ACE。**\n\nABAC 把权限押在标签上，标签质量就是权限质量，所以标签治理必须先行；条件运算符记住精确匹配与前缀通配两个就够；环境标签的隔离效果正是 ABAC 粒度优势的体现。B、D 是两类典型误解，评审时要当场纠。\n\n- B：标签打错权限就错，打错的标签会让人拿到不该拿的权限或丢掉应有权限。\n- D：说反了 ABAC 的核心价值——标签参与权限判定，新项目打标签即可，恰恰不用新增策略文件。\n\n记忆点：标签即权限，治理先行；条件运算符两件套。"},{"id":"D6-012","d":6,"q":"一家公司的权限体系已经按岗位建好了用户组与组策略，运行稳定。后来发现同一岗位的团队之间，环境级细分管不住：开发岗在不同环境里的权限应该不一样，生产环境要额外收窄。架构师要在现有体系上给混用方案。\n\n最合理的混用设计是什么？","o":[{"l":"A","t":"RBAC 管大框架按岗位分组授权不动，资源级的环境细分用 ABAC 标签条件叠加实现。"},{"l":"B","t":"全部推翻改成 ABAC，岗位也做成标签，用户组与组策略全部下线一步到位。"},{"l":"C","t":"保留 RBAC，环境细分用复制用户组实现，每个环境复制一套组，组名带环境后缀。"},{"l":"D","t":"环境细分靠人工审批，开发要碰生产环境时走工单临时开通，用完手动回收。"}],"a":["A"],"t":"single","s":"自编·6.1.6","e":"**正确答案：A。**\n\n混用的标准形态是各管一层：RBAC 按岗位管大框架已经稳定，不推倒；环境级细分是资源属性问题，用标签条件叠加最自然——生产资源打生产标签，策略条件不匹配就进不去。\n\n- B：推翻重来成本大，岗位维度 RBAC 本来就是合适的载体。\n- C：按环境复制用户组，组数量随环境翻倍，维护量爆炸。\n- D：人工审批解决不了系统性收窄，每次开通回收都是风险点。\n\n记忆点：RBAC 管大框架，ABAC 管资源级细分，混用不推翻。"},{"id":"D6-013","d":6,"q":"落地 ABAC 时团队要写标签匹配条件：项目标签做精确匹配，环境前缀类标签要做前缀通配——比如匹配所有以 prod 开头的环境值。负责写策略的同学在选条件运算符时来确认口径，组长要求两种场景都必须用对。\n\n两个场景分别该用什么运算符？","o":[{"l":"A","t":"两个场景都用 StringEquals 做匹配，前缀场景把所有可能的环境值逐个列全写进条件里。"},{"l":"B","t":"两个场景都用 StringLike 做匹配，精确匹配也改用通配符写法，保持风格统一便于后续维护。"},{"l":"C","t":"项目标签精确匹配用 StringEquals，环境前缀通配用 StringLike，两个场景各用各的运算符。"},{"l":"D","t":"精确匹配用 NumericEquals 数值运算符，前缀用 StringLike，数值与字符串各管一类条件场景。"}],"a":["C"],"t":"single","s":"自编·6.1.6","e":"**正确答案：C。**\n\n教材口径就两个运算符：StringEquals 做精确匹配，StringLike 做前缀通配。项目标签值是离散确定的，用精确匹配语义最清晰；环境前缀是一组值，用前缀通配一次覆盖，不需要枚举。\n\n- A：逐个枚举值让条件随命名膨胀，漏一个就漏一片权限，不可维护。\n- B：精确匹配用通配符写法会引入误匹配风险，风格统一不是理由。\n- D：项目标签是字符串，数值类运算符用不上，属于张冠李戴。\n\n记忆点：StringEquals 管精确，StringLike 管前缀。"},{"id":"D6-014","d":6,"q":"某团队把权限完全押在 ABAC 标签匹配上，运行三个月后发现一次越权：一个新资源被打错了项目标签，结果被另一个项目的团队访问到了。复盘会上要定改进措施，杜绝这类问题再次发生，措施要能落到机制上。\n\n最有效的措施是什么？","o":[{"l":"A","t":"废弃 ABAC 改回 RBAC，标签天然不可靠，权限管理不能再依赖标签匹配。"},{"l":"B","t":"在策略里把标签条件删掉，改成按资源 ARN 逐条授权，标签只做备注用途。"},{"l":"C","t":"保留标签匹配不变，把越权事件的当事团队通报批评，要求以后打标签仔细些。"},{"l":"D","t":"立标签治理机制：键命名、必打清单、打错纠正流程，再给关键资源加配置校验。"}],"a":["D"],"t":"single","s":"自编·6.1.6","e":"**正确答案：D。**\n\n越权根因是标签质量失控，对策就是把标签治理补上：键命名统一、必打标签清单明确、打错有纠正流程，关键资源再加配置校验兜底。治理到位后，ABAC 的规模化优势才能安全兑现。\n\n- A：因噎废食，问题出在治理缺失不在模式本身。\n- B：退回逐条授权等于放弃 ABAC 的核心价值，维护量回到解放前。\n- C：通报批评是人的约束，不能防止下一次打错，机制没补上。\n\n记忆点：标签即权限，押权限先押治理。"},{"id":"D6-015","d":6,"q":"某应用对接外部支付网关，用的是对方发放的 API 密钥。安全制度要求密钥每 90 天更换一次，但人工更换老是忘，上季度就有一次超期两周才补上，被安全部门通报。团队要找自动化的根治办法，方案要经评审立项。\n\n最合适的方案是什么？","o":[{"l":"A","t":"把密钥托管进 Secrets Manager，配置 90 天自动轮换，轮换失败触发告警兜底。"},{"l":"B","t":"建一个日历提醒，到期前三天提醒责任人手工更换，更换完成后登记到台账。"},{"l":"C","t":"把密钥写进应用配置中心，每次更换由运维直接改配置并重启应用生效。"},{"l":"D","t":"给密钥申请一个很长的有效期，把更换周期延长到一年，减少忘记更换的次数。"}],"a":["A"],"t":"single","s":"自编·6.1.7","e":"**正确答案：A。**\n\n人工流程忘了就是忘了，根治靠自动化：Secrets Manager 按计划自动轮换，轮换由函数执行建新、验证、切换各步，失败有告警兜底，制度要求的 90 天变成系统行为而不是人的记忆。\n\n- B：提醒仍是人工流程，只是把忘记的概率降低，没有根治。\n- C：换地方存密钥不解决换的自动化，重启窗口还引入新的风险。\n- D：延长周期是降低安全标准来迁就流程，方向反了。\n\n记忆点：外部系统密钥靠 Secrets Manager 自动轮换根治。"},{"id":"D6-016","d":6,"q":"审计发现一台 EC2 上的应用访问 S3 用的是长期 Access Key，密钥放在配置文件里已经两年没换。整改会上有人提议把密钥换成每 30 天自动轮换，架构师指出整改方向本身就不对，要先问能不能消灭静态凭据。\n\n正确的整改方向是什么？","o":[{"l":"A","t":"维持 Access Key 用法不变，把三十天轮换改成七天一轮，轮换得越频繁暴露窗口就越短。"},{"l":"B","t":"把 Access Key 加密存储，配置文件加一层加密，密钥本身不换也不至于泄漏。"},{"l":"C","t":"准备两套 Access Key 轮流使用，一套在用一套备用，轮换时无缝切换不断服。"},{"l":"D","t":"给 EC2 挂实例角色改用临时凭证，从根上消灭静态凭据，而不是把 Key 换得更勤。"}],"a":["D"],"t":"single","s":"自编·6.1.7","e":"**正确答案：D。**\n\n对端是 AWS 服务，就根本不需要静态密钥：挂上实例角色后应用拿临时凭证，自动过期自动续，静态凭据直接从环境里消失。考试爱考这个方向性判断——先问能不能消灭，再谈轮换。\n\n- A：还在用静态凭据，只是泄漏窗口变短，问题本质没变。\n- B：加密存储降低了泄漏后的危害，但密钥仍在环境里，泄漏面还在。\n- C：两套轮流还是静态凭据，管理复杂度翻倍，收益为零。\n\n记忆点：先问能不能换角色拿临时凭证，再谈轮换。"},{"id":"D6-017","d":6,"q":"团队第一次接入 Secrets Manager 的自动轮换，组长把轮换机制讲了一遍，让新人整理成操作笔记发到群里供大家核对，有理解错的当场指出，避免上线后踩坑，核对通过的版本归档进团队知识库备查，才算走完整个流程。\n\n下列笔记正确的有哪些？（多选）","o":[{"l":"A","t":"轮换由运维按季度手工执行，照着四步手册跑一遍命令，运行记录截图留档。"},{"l":"B","t":"轮换由 Lambda 函数执行，按「建新、更新、验证、切旧」四步走完一轮。"},{"l":"C","t":"数据库类密钥有托管轮换模板，常见数据库直接用模板，不必自己写四步逻辑。"},{"l":"D","t":"四步里最容易被忽略的是验证——新密钥要真的连一次对端确认可用，再切换引用。"},{"l":"E","t":"轮换四步里切换引用是第一步，先把应用指向新密钥，再慢慢建新版本补验证。"}],"a":["B","C","D"],"t":"multiple","s":"自编·6.1.7","e":"**正确答案：BCD。**\n\n轮换的正确图景：Lambda 自动执行四步，托管模板覆盖常见数据库，验证步是切引用前必须真连一次对端——跳过它，切换瞬间才暴露密钥不可用，业务直接断连，补救的代价远高于验证一次的几十秒投入。\n\n- A：轮换是平台自动行为，人工按季度执行就没有自动化可言。\n- E：顺序完全颠倒，先切再建等于把未验证的配置推给生产。\n\n记忆点：四步自动跑，验证最易漏，切前必须真连一次。"},{"id":"D6-018","d":6,"q":"架构评审在定密钥管理的选型分界：平台上的应用有的访问 AWS 服务，有的访问公司外部的第三方系统。有人提议所有对端统一用 Secrets Manager 托管密钥，有人提议全部用 IAM 角色，架构师要求按分界线选型，不搞一刀切。\n\n正确的分界是什么？","o":[{"l":"A","t":"全部用 IAM 角色——角色发临时凭证最安全，外部系统通过联合认证也能接入。"},{"l":"B","t":"全部用 Secrets Manager 统一托管——托管便于集中审计，访问 AWS 服务也改走密钥模式。"},{"l":"C","t":"对端是 AWS 服务就用任务角色拿临时凭证，对端是外部系统不认 IAM，才用 Secrets Manager。"},{"l":"D","t":"按数据敏感度分——敏感数据用 Secrets Manager，一般数据用 IAM 角色，与对端类型无关。"}],"a":["C"],"t":"single","s":"自编·6.1.7","e":"**正确答案：C。**\n\n分界线是对端认不认 IAM：认，就用角色拿临时凭证，连轮换问题都不存在；不认，才退一步用 Secrets Manager 托管并自动轮换。一刀切要么把外部系统接不上，要么把 AWS 服务白白背上静态密钥。\n\n- A：外部系统不认 IAM 角色，联合认证接不进去，方案落不了地。\n- B：AWS 服务侧放弃角色改用密钥，凭空制造轮换负担与泄漏面。\n- D：敏感度影响加密与分级，不决定凭据形态，分界维度选错了。\n\n记忆点：认 IAM 用角色，不认才托管轮换。"},{"id":"D6-019","d":6,"q":"运维复查一套支付对接的轮换配置：Secrets Manager 按 90 天自动轮换，密钥名称末尾带日期后缀，轮换失败会发告警到值班群。新人问这两个设计为什么要有，组长要求从设计意图上回答，而不是背配置项。\n\n正确的设计解释是什么？","o":[{"l":"A","t":"日期后缀只为人类可读，删掉不影响功能；告警是可选配置，不开也行，出问题人工发现。"},{"l":"B","t":"日期后缀让轮换时新旧两版共存、回滚有依据；告警兜住轮换失败，避免静默过期。"},{"l":"C","t":"日期后缀用来区分不同对端的密钥，每个对端一个日期；告警替代轮换，失败时人工换。"},{"l":"D","t":"日期后缀是为满足审计对命名规范的要求；告警只通知成功，失败由函数自动重试兜底。"}],"a":["B"],"t":"single","s":"自编·6.1.7","e":"**正确答案：B。**\n\n两个设计都有明确意图：名称含日期是轮换机制的一部分，轮换期间新旧两版共存，哪一版对应哪一轮一目了然，回滚时切回旧版有依据；告警兜的是轮换失败——失败不告警，密钥就会静默超期，等业务断连才发现。\n\n- A：把有意设计当成可删的装饰，把兜底告警当成可选项，理解都偏了。\n- C：日期区分的是版本不是对端，告警也替代不了轮换本身。\n- D：命名不是应付审计的形式，告警兜的是失败不是成功通知。\n\n记忆点：日期后缀管共存回滚，告警管失败不静默。"},{"id":"D6-020","d":6,"q":"应用接入 Secrets Manager 时讨论引用方式：一种做法把密钥明文取出来写进环境变量，应用启动直接读取；另一种做法环境变量里只放密钥的 ARN，应用运行时按 ARN 向 Secrets Manager 取值。评审要定统一口径并说明理由。\n\n正确的做法与理由是什么？","o":[{"l":"A","t":"环境变量只放 ARN，运行时按 ARN 取值，明文不落配置面，泄漏面最小。"},{"l":"B","t":"环境变量放明文，启动读一次性能最好，安全靠主机加固与内网隔离来保障。"},{"l":"C","t":"两种都行按团队习惯选，密钥本身很短，泄漏了立刻轮换，损失也不大。"},{"l":"D","t":"明文放进环境变量但外面再包一层自定义加密，运行时解密使用，兼顾性能与安全。"}],"a":["A"],"t":"single","s":"自编·6.1.7","e":"**正确答案：A。**\n\n引用密钥不用明文是教材明确口径：环境变量、配置文件都是容易随快照、日志、调试信息扩散的地方，只放 ARN 时泄漏的只是一个地址，真正的值留在 Secrets Manager 里，取值链路还可审计。\n\n- B：性能差异微乎其微，却把明文铺到了最易扩散的位置。\n- C：「泄漏了就换」是补救不是设计，轮换窗口内的暴露已经发生。\n- D：自己包一层加密，加密密钥又要存哪，问题只是被推了一层。\n\n记忆点：配置面只放 ARN，明文不出托管服务。"},{"id":"D6-021","d":6,"q":"外部审计整改清单要求：所有员工登录 AWS 控制台必须双因素认证，且不能依赖个人自觉开通。公司用 IAM Identity Center 对接了企业身份源，员工账号由身份源统一管理，员工的控制台访问都统一从这里走，整改必须在机制层闭环。\n\n最合适的落法是什么？","o":[{"l":"A","t":"发通知要求全员本周内自行到控制台开启 MFA，逾期未开的由安全组逐个催办。"},{"l":"B","t":"用脚本每周扫描未开 MFA 的账号，扫出来之后由运维代为开启并发邮件告知本人。"},{"l":"C","t":"在登录页加上二次确认弹窗，提示员工开启 MFA，开启与否由员工自己决定。"},{"l":"D","t":"在 Identity Center 侧统一强制 MFA 策略，不满足条件就不放行控制台会话。"}],"a":["D"],"t":"single","s":"自编·6.1.8","e":"**正确答案：D。**\n\n「不能依赖个人自觉」意味着要把条件做成门禁而不是倡议：Identity Center 统一强制 MFA，不满足就直接进不了控制台，覆盖全员且无例外，整改项一次性闭环，审计复查的时候也拿得出机制层面的证据支撑。\n\n- A：通知加催办还是自觉路径，总有人拖到期末。\n- B：扫出来代开是补丁式治理，扫描间隔内仍有裸奔窗口。\n- C：弹窗只是提醒，选择权还在个人，与整改要求相反。\n\n记忆点：MFA 要做成门禁，不是倡议。"},{"id":"D6-022","d":6,"q":"部署账号里的流水线要跨账号操作生产账号的资源。安全要求：流水线只应拿到本次部署所需的最小权限，会话结束权限即失效，不能给流水线配一把长期可用的钥匙。平台团队给出设计方案。\n\n最合适的设计是什么？","o":[{"l":"A","t":"在生产账号建一个专用 IAM 用户，把长期 Access Key 配给流水线，权限按部署范围写死。"},{"l":"B","t":"流水线用 AssumeRole 代入生产账号的部署角色，再套会话策略把本次会话权限进一步收窄。"},{"l":"C","t":"两个账号之间网络直连互通，流水线用部署账号自己的高权限直接操作，省去跨账号配置。"},{"l":"D","t":"把部署所需的全部动作在生产账号里预先允许给所有外部身份，流水线免配置直接调用。"}],"a":["B"],"t":"single","s":"自编·6.1.8","e":"**正确答案：B。**\n\n跨账号的标准答案是 AssumeRole 换临时凭证：会话有时长，到期自动失效，天然满足「会话结束权限即失效」；再套会话策略把本次会话收窄到部署所需，最小权限两层都落实。\n\n- A：长期 Access Key 与「无长期钥匙」的要求直接冲突。\n- C：网络互通解决不了授权问题，高权限跨账号操作是更大的风险面。\n- D：向所有外部身份开放动作，等于把生产账号敞开，最小权限无从谈起。\n\n记忆点：AssumeRole 加会话策略，临时、收窄、自动过期。"},{"id":"D6-023","d":6,"q":"审计整改会上列出多条与长期密钥相关的整改项，组长让新人把对应的技术落法整理成笔记，口径是「能消灭就消灭、消灭不了就托管轮换」，整理完交架构师逐条把关，通过才进整改方案。\n\n下列笔记正确的有哪些？（多选）","o":[{"l":"A","t":"全员 MFA 用 Identity Center 统一强制，人的访问走联合登录，不持有长期密钥。"},{"l":"B","t":"开发人员的长期 Access Key 应当保留但加密保管，需要时解密使用更加稳妥。"},{"l":"C","t":"开发人员改用联合登录，从企业身份源换临时会话进 AWS，退出身份源会话随之失效。"},{"l":"D","t":"CI 机器人从长期 Access Key 换成角色加权限边界，权限每季度复核一次。"},{"l":"E","t":"实在消灭不了的长期密钥就延长轮换周期到两年，减少频繁变更带来的风险。"}],"a":["A","C","D"],"t":"multiple","s":"自编·6.1.8","e":"**正确答案：ACD。**\n\n整改口径按「先消灭后托管」走：人靠 MFA 加联合登录摆脱长期密钥，联合会话随身份源登出失效；机器换角色加边界。B、E 两条都在给静态凭据续命，与口径相反，把关时会被直接打回。\n\n- B：加密保管仍是长期密钥在环境里，泄漏面没有消失，正确方向是改联合登录。\n- E：延长周期是降低安全标准来减少工作量，托管轮换才是消灭不了时的正解。\n\n记忆点：能消灭就消灭，消灭不了才托管轮换。"},{"id":"D6-024","d":6,"q":"一台位于私有子网的 EC2 挂好了实例角色，但应用启动时报取不到凭证，所有依赖 IAM 的调用全部失败。网络组确认子网路由表与安全组配置正确，出网方向只放行了业务所需的服务端口。故障定位会上讨论最可能的原因。\n\n最可能的原因与修法是什么？","o":[{"l":"A","t":"实例角色的信任策略写错了，改信任策略加上本账号即可，与网络配置没有关系。"},{"l":"B","t":"临时凭证过期太快，把会话时长调大到 12 小时再重启应用，问题就能缓解。"},{"l":"C","t":"私有子网到 IAM 或 STS 端点不可达，补配 VPC 端点后凭证即可正常获取。"},{"l":"D","t":"实例 profile 没有挂上，重新挂一次 profile 就能好，这是这类故障最常见的漏配原因。"}],"a":["C"],"t":"single","s":"自编·6.1.8","e":"**正确答案：C。**\n\n实例角色取凭证要走 IAM 或 STS 端点，私有子网没有公网路径，出网又只放行业务端口——凭证请求根本发不出去。补 VPC 端点让流量走内网到达端点，这是私有子网用角色的高频前提。\n\n- A：题干说角色已挂好，信任策略问题通常连角色都代入不了，与现象不符。\n- B：凭证都拿不到，谈不上过期快慢，调时长是南辕北辙。\n- D：profile 未挂是常见漏配，但题干已明确挂好，应按排除后的网络前提找。\n\n记忆点：私有子网用角色，先看 IAM 与 STS 端点通不通。"},{"id":"D6-025","d":6,"q":"团队给跨账号会话套了两层限制：代入角色本身挂的策略，和本次 AssumeRole 传入的会话策略。新人问：如果会话策略里写了一个角色策略没有允许的动作，能不能靠会话策略把这个动作放开，让本次会话多用一点？\n\n正确的判断是什么？","o":[{"l":"A","t":"不能——会话策略只能收窄不能放宽，最终权限是角色策略与会话策略的交集。"},{"l":"B","t":"能——会话策略在会话期间临时生效，可以临时授予角色策略没有的动作。"},{"l":"C","t":"能——只要会话策略写了允许，评估时它优先于角色策略，动作即放行。"},{"l":"D","t":"不能——任何会话内动作都必须写进 SCP 才生效，会话策略与角色策略都不算数。"}],"a":["A"],"t":"single","s":"自编·6.1.8","e":"**正确答案：A。**\n\n会话策略是本次会话的天花板，它参加交集运算：角色策略没给的动作，会话策略写得再宽也放不开，这个方向只有收窄没有放宽。想让会话多做一点，正路是改角色策略而不是改会话策略。\n\n- B：「临时授予」的说法不成立，会话策略不是独立授权源。\n- C：不存在会话策略优先于角色策略的规则，两层都要允许。\n- D：SCP 是账号层天花板，不是每个动作的生效前提，说法过度引申。\n\n记忆点：会话策略只收窄，天花板叠不出新权限。"},{"id":"D6-026","d":6,"q":"培训后组长把人机两类身份的管控要点出了几道判断题让大家抢答，答错的当场讲解，涉及临时凭证构成、联合登录会话行为、实例 profile 前提三个知识点，答案要求能对应到教材原文，不能凭感觉答。\n\n下列说法正确的有哪些？（多选）","o":[{"l":"A","t":"STS 临时凭证只有访问密钥和过期时间两件东西，会话令牌是可选项。"},{"l":"B","t":"联合登录的用户在 AWS 里映射为临时身份，退出企业身份源，AWS 会话也随之失效。"},{"l":"C","t":"实例 profile 只要挂上就能用，私有子网里不需要考虑能否到达 IAM 或 STS 端点。"},{"l":"D","t":"机器侧的临时凭证由实例角色或任务角色发出，过期自动失效并自动续。"},{"l":"E","t":"人的侧管控靠 MFA 与联合登录，机器侧靠长期密钥加密存储，两条线各自独立。"}],"a":["B","D"],"t":"multiple","s":"自编·6.1.8","e":"**正确答案：BD。**\n\nB、D 是教材原话的两个方向：人的侧联合登录的会话跟着身份源走，登出即失效；机器侧角色发临时凭证，过期自动失效自动续。这两条合起来，长期密钥才被真正赶出环境。\n\n- A：临时凭证三件套——访问密钥、会话令牌、过期时间，令牌不是可选项。\n- C：私有子网必须能到达 IAM 或 STS 端点，不通则凭证拿不到、服务全部不可用。\n- E：机器侧的正解是角色与临时凭证，加密存储长期密钥是退而求其次。\n\n记忆点：三件套齐全，会话跟身份源，机器靠角色。"},{"id":"D6-027","d":6,"q":"一家公司从五个账号扩张到四十个，最让平台团队头疼的不是迁移，而是每开一个新账号都要手工配一遍安全基线：日志、加密、区域限制样样不能漏，配漏一次就是一次审计发现。管理层要求新账号开通即自带基线。\n\n最合适的方案是什么？","o":[{"l":"A","t":"用 Control Tower 的账号工厂开通新账号，守卫护栏与合规基线随开通自动下发，开号即合规。"},{"l":"B","t":"写一份开通手册，每次开账号由运维照手册逐项配置，配置完成后再由第二人复核一遍。"},{"l":"C","t":"做一个开通用的 CloudFormation 模板，开账号后手动执行模板，执行日志留档备查。"},{"l":"D","t":"把基线配置外包给服务商，每次开通前提交工单，由对方远程配置完成后交付验收。"}],"a":["A"],"t":"single","s":"自编·6.2.4","e":"**正确答案：A。**\n\n「开通即自带基线」是 Control Tower 账号工厂的标准能力：账号开通流程走护栏下发，新账号落地就纳入治理，不需要任何人记得配什么。规模越扩，手工路径越不可持续。\n\n- B：手册加复核还是人工流程，漏配风险只降不除，规模上来更跟不上。\n- C：模板解决了「怎么配」，没解决「忘记执行」，开通动作仍是手工触发。\n- D：外包只是把手工换个人做，时效与一致性都不受自己控制。\n\n记忆点：开号即合规找 Control Tower，手工路径撑不起规模。"},{"id":"D6-028","d":6,"q":"安全团队每周要出全公司的安全态势报告，现状是登进四十个账号挨个看各区域的发现结果，抄进表格再汇总，一轮下来大半天，还经常漏掉刚开通的小账号。负责人要求汇总自动化、覆盖不漏账号。\n\n最合适的方案是什么？","o":[{"l":"A","t":"给每个账号装一套脚本，定时把本账号的发现结果导出来，汇总脚本再拼成总表。"},{"l":"B","t":"各账号启用 Security Hub 并配置跨账号跨区域聚合，统一清单与安全分数自动汇到一处。"},{"l":"C","t":"建一个共享的汇总桶，各账号把发现结果定时投递进去，报告脚本从桶里读取生成。"},{"l":"D","t":"开发一个巡检门户，安全团队轮值登账号抽查，把抽查结果录入门户生成周报。"}],"a":["B"],"t":"single","s":"自编·6.2.4","e":"**正确答案：B。**\n\nSecurity Hub 的定位就是「持续看见」：各账号各区域的发现汇成统一格式，跨账号跨区域聚合出统一清单与安全分数，新账号纳入组织聚合后自动进入覆盖面，不依赖任何人记得去收。\n\n- A：脚本矩阵要随账号数维护，新账号漏装就漏报，正是要消除的模式。\n- C：投递桶解决存储不解决聚合与格式统一，汇总逻辑还得自己养。\n- D：轮值抽查是抽样不是覆盖，与「不漏账号」的要求相反。\n\n记忆点：持续看见找 Security Hub，聚合覆盖新账号。"},{"id":"D6-029","d":6,"q":"合规部门定了一条红线：组织内任何账号都不许关闭指定类型的审计日志，包括账号管理员也不行。平台团队评估落地方案，要求这条红线在任何账号、任何操作路径下都生效。\n\n最合适的机制是什么？","o":[{"l":"A","t":"给日志资源的资源策略写拒绝删除的语句，所有账号统一挂同一份资源策略。"},{"l":"B","t":"开通 Config 规则监测日志配置变更，发现关闭动作就告警，由安全组上门恢复。"},{"l":"C","t":"在组织层挂 SCP，对关闭审计日志的 API 动作写显式拒绝，账号内谁也执行不了。"},{"l":"D","t":"把日志管理权限从各账号收回，只留给平台团队一个专用角色，其他人无权操作。"}],"a":["C"],"t":"single","s":"自编·6.2.4","e":"**正确答案：C。**\n\n「任何账号、任何路径、管理员也不行」是硬禁令的完整画像：SCP 挂在组织层，对该账号内所有主体生效，账号管理员自己也无法修改或绕开，是三层里唯一能做到无条件禁止的机制。\n\n- A：资源策略管单个资源，日志服务的配置动作未必有对应资源策略可挂，覆盖不全。\n- B：检测加恢复是事后补救，关闭动作已经发生，红线已被突破。\n- D：收权限防住了普通管理员，平台专用角色本身就是绕过路径。\n\n记忆点：硬性禁令落 SCP，检测与收权都挡不住执行。"},{"id":"D6-030","d":6,"q":"某账号管理员想关闭本账号的配置记录器省一笔费用，执行时被拒绝，工单转到平台团队。平台团队解释：组织的三层安全机制里有一层专门负责这类硬性禁止，这个操作从一开始就不被允许，与费用无关。\n\n按照三层分工，拦住这次操作的是哪一层？","o":[{"l":"A","t":"Control Tower——账号开通时下发的基线里没有放行关闭动作，所以执行时被拦了下来。"},{"l":"B","t":"Security Hub——它发现关闭动作的风险高，直接冻结了账号里的该类操作权限。"},{"l":"C","t":"IAM 权限边界——管理员角色的边界里没写这个动作，边界外的动作一律不可执行。"},{"l":"D","t":"Organizations 的 SCP——账号级硬禁令直接拒绝了关闭动作，这是预防性护栏在生效。"}],"a":["D"],"t":"single","s":"自编·6.2.4","e":"**正确答案：D。**\n\n三层的分工一句话：Control Tower 负责开号即合规，Security Hub 负责持续看见，SCP 负责硬性禁令。「不许做某类操作」属于禁令，由 SCP 的预防性护栏直接拒绝，操作根本不会发生。\n\n- A：基线是开通时下发的配置，不是执行时的否决者，说反了层次。\n- B：Security Hub 汇聚发现不拦截操作，冻结是杜撰出来的能力。\n- C：权限边界管单个角色的上限，题干是组织级禁令，层次不对。\n\n记忆点：按动作类型选层——硬禁令找 SCP，持续看见找 Hub，开号合规找 Tower。"},{"id":"D6-031","d":6,"q":"平台团队要给公司落地多账号安全治理。会上有人主张先把 Security Hub 开起来看数据，账号治理结构以后再说；架构师指出落地顺序有讲究，倒着做会返工，先给出正确顺序再排工期与人力。\n\n正确的落地顺序是什么？","o":[{"l":"A","t":"先 Organizations 立好账号与 OU 结构，再 Control Tower 开治理下护栏，最后 Security Hub 接入发现做跨账号汇聚。"},{"l":"B","t":"先 Security Hub 在全部账号打开看发现结果，再按发现结果设计组织结构，最后补 Control Tower 的护栏。"},{"l":"C","t":"先 Control Tower 开账号工厂出账号，再 Security Hub 汇聚安全发现，最后回头把存量账号收进 Organizations。"},{"l":"D","t":"三者互不依赖，并行上线即可，先上哪个都不会返工，按团队人力排期就行。"}],"a":["A"],"t":"single","s":"自编·6.2.4","e":"**正确答案：A。**\n\n三层有依赖关系：Organizations 先立账号与 OU 结构，Control Tower 治理挂在结构上才有下发对象，Security Hub 的跨账号聚合也要等组织关系就位。顺序对了层层搭上去，每层都有前一层的依赖，倒着做就要拆了重来。\n\n- B：没有结构先看发现，看到的问题没有治理抓手，随后还得重建结构返工。\n- C：Control Tower 本身依赖 Organizations，最后收编等于治理落空一轮。\n- D：三者不是平行组件，是有依赖的栈，并行上线必然互相阻塞。\n\n记忆点：结构、治理、看见，三层顺序不能倒。"},{"id":"D6-032","d":6,"q":"团队在梳理守卫护栏的类型：同样是对付「不该发生的事」，有的护栏让操作根本执行不了，有的护栏是等操作发生后发现并通知处置。组长要求大家能对着场景说出类型，说错的下周补课。\n\n下列哪个场景属于检测性护栏？","o":[{"l":"A","t":"SCP 禁止在全组织创建未加密的桶，创建请求发出时直接被拒绝，资源根本建不出来。"},{"l":"B","t":"Config 规则持续评估资源合规性，发现未加密桶后通知负责人限期整改，桶已经存在。"},{"l":"C","t":"IAM 权限边界把删除生产库的动作挡在边界外，管理员怎么写策略都执行不了删除。"},{"l":"D","t":"登录页强制双因素认证，没有 MFA 的会话进不了控制台，风险登录被挡在门外。"}],"a":["B"],"t":"single","s":"自编·6.2.4","e":"**正确答案：B。**\n\n检测性护栏的定义是「发生后发现再处置」：桶已经建出来了，规则评估后通知人去改。A、C、D 都是让动作根本发生不了的预防性路径，与检测性的分界就在「事情发生没有」。\n\n- A：创建被拒是预防性护栏，SCP 在动作执行前就否决。\n- C：边界拦截属于预防性，越界动作执行不了。\n- D：MFA 门禁把不合规会话挡在入口，同样是预防性控制。\n\n记忆点：预防性让事情根本发生不了，检测性是发生了再发现再抓。"},{"id":"D6-033","d":6,"q":"新同事学完多账号安全治理的三层机制，把三层分工整理成笔记发到群里，请老员工逐条核对，有理解错的当场指出，核对通过后再整理进团队的治理手册初稿，作为后续培训的教材素材。\n\n下列笔记正确的有哪些？（多选）","o":[{"l":"A","t":"Security Hub 发现高危问题之后可以直接阻止账号里的危险操作，发现即拦截处置。"},{"l":"B","t":"Control Tower 在落地时把护栏与合规基线随账号工厂自动下发，新账号开通即纳入治理。"},{"l":"C","t":"Security Hub 汇聚各账号各区域的安全发现，形成统一清单与安全分数，可跨区域聚合。"},{"l":"D","t":"Organizations 的 SCP 做最后兜底，从账号层面禁掉危险动作，账号内部无法绕开。"},{"l":"E","t":"Control Tower 只在账号开通那一下有用，开通之后的日常治理与它无关。"}],"a":["B","C","D"],"t":"multiple","s":"自编·6.2.4","e":"**正确答案：BCD。**\n\nB、C、D 分别对应三层机制各自的定位，一句一个职责，背的时候按「开号、看见、禁令」三个词对号：Tower 管开号即合规，Hub 管持续看见，SCP 管硬性禁令。A 把看见夸成了拦截，E 把持续治理矮化成一次性动作，两处都要当场纠正并给出反例。\n\n- A：Security Hub 只汇聚发现与评分，没有拦截操作的能力，拦截是 SCP 的事。\n- E：Control Tower 的护栏与基线是持续生效的治理机制，不是开通时的一次性配置。\n\n记忆点：Tower 开号、Hub 看见、SCP 禁令，各管一段不越位。"},{"id":"D6-034","d":6,"q":"公司的对外 Web 门户近期在日志里发现多起 SQL 注入尝试，安全组要求在入口处把这类应用层攻击拦下来。会上有人提议直接开 Shield，架构师提醒先分清两层组件各管什么，别开错药方。\n\n正确的组件选型是什么？","o":[{"l":"A","t":"Shield——它就是为大规模攻击防护设计的，开启后注入尝试会在边缘被清洗掉一部分。"},{"l":"B","t":"安全组——在实例入口把来源 IP 加入黑名单规则，注入请求就到不了应用进程。"},{"l":"C","t":"WAF——挂在 CDN 或负载均衡上，用托管规则拦常见注入与扫描，管的就是应用层。"},{"l":"D","t":"Network Firewall——在 VPC 边界做深度包过滤，把所有恶意流量挡在子网外面。"}],"a":["C"],"t":"single","s":"自编·6.2.5","e":"**正确答案：C。**\n\nSQL 注入是应用层攻击，WAF 挂在 CDN 或负载均衡上按 Web 语义检视请求，托管规则覆盖常见注入与扫描，是这一层的对口组件。纵深防御的失分点就在「知道每个组件只管哪一层」，评审时按层对号就不会错。\n\n- A：Shield 挡的是 DDoS 流量冲击，不管 Web 攻击语义，这里属于开错药方。\n- B：安全组按 IP 与端口过滤，没有 Web 语义，注入载荷照样进来。\n- D：Network Firewall 管 VPC 边界的流量过滤，做的是包与状态检查，不解析应用层的攻击载荷。\n\n记忆点：注入找 WAF，DDoS 找 Shield，按层对号。"},{"id":"D6-035","d":6,"q":"安全审计要求：VPC 的出站流量要按域名过滤，只允许访问已批准的外部域名，其余一律拒绝放行。运维同学第一反应是改安全组，架构师指出安全组做不到这件事，要求选对组件并说明理由。\n\n最合适的组件是什么？","o":[{"l":"A","t":"安全组——把已批准域名解析出的 IP 段加进出站放行规则，再靠定期更新维持名单。"},{"l":"B","t":"WAF——出站流量也走 Web 检查，按域名匹配放行，规则与入站防护共用一套管理。"},{"l":"C","t":"网络 ACL——在子网层加域名放行规则，按编号顺序评估，未批准的直接丢弃。"},{"l":"D","t":"Network Firewall——在 VPC 边界做状态检测与域名过滤，出站按域名白名单放行。"}],"a":["D"],"t":"single","s":"自编·6.2.5","e":"**正确答案：D。**\n\n按域名过滤需要理解 DNS 与 TLS 层信息，这是 Network Firewall 在 VPC 边界的能力。安全组只认 IP 与端口——域名背后的 IP 会变，靠解析结果做规则既脆也不安全，这是题干否掉它的原因。\n\n- A：域名与 IP 的对应不稳定，IP 段方案漏放误放都难控，语义也达不到审计要求。\n- B：WAF 挂在入站入口管应用层，出站域名过滤不是它的岗位。\n- C：NACL 同样只认 IP 与端口，写不了域名规则，属于能力杜撰。\n\n记忆点：域名过滤找 Network Firewall，安全组没有 Web 域名语义。"},{"id":"D6-036","d":6,"q":"安全运营中心收到情报：公司某批凭据可能在暗网流通。需要在云端发现「凭据被异常使用」这类恶意行为，并在确认后自动做出响应动作，例如隔离相关资源。团队讨论用哪套组合落地。\n\n最合适的组合是什么？","o":[{"l":"A","t":"GuardDuty 做检测——凭威胁情报与行为分析找恶意活动，发现可触发 Lambda 做自动响应。"},{"l":"B","t":"Inspector 做检测——扫描主机的软件漏洞，扫出风险项后自动打补丁完成响应。"},{"l":"C","t":"Macie 做检测——扫描存储里的敏感数据，发现异常访问后自动加密全部数据。"},{"l":"D","t":"Detective 做检测——把历史日志画成关联图谱，人工看完图谱再决定怎么响应。"}],"a":["A"],"t":"single","s":"自编·6.2.5","e":"**正确答案：A。**\n\n凭据滥用属于恶意行为检测，正落在它的检测画像里，对口 GuardDuty：威胁情报加行为分析发现异常，发现事件可经 EventBridge 触发 Lambda 更新 WAF 或安全组，把检测接到处置上，检测到响应的链路完整。\n\n- B：Inspector 管软件漏洞，不管行为异常，补丁响应也答非所问。\n- C：Macie 管数据内容里的敏感信息，与凭据滥用无关。\n- D：Detective 是事后关联调查工具，不具备实时检测与自动响应。\n\n记忆点：恶意行为找 GuardDuty，发现接处置走联动，窗口压到分钟级。"},{"id":"D6-037","d":6,"q":"对外门户的设计评审会上，架构图从外到内排开五层防线。评审中有人提议把 WAF 的规则加到安全组里，让两层合成一层好维护，架构师当场否掉这个提议并解释了原因，理由要写进评审纪要。\n\n否掉的正确理由是什么？","o":[{"l":"A","t":"WAF 规则属于付费托管内容，合入安全组会触发额外的许可合规问题，成本不可控。"},{"l":"B","t":"安全组按 IP 与端口过滤，没有 Web 语义，放不进也执行不了注入拦截这类规则。"},{"l":"C","t":"两层合并后流量只过一次检查，攻击面变大，纵深防御要求每层至少检查两次。"},{"l":"D","t":"安全组的规则数量上限远低于 WAF，合并后规则放不下，防护规则会被静默截断。"}],"a":["B"],"t":"single","s":"自编·6.2.5","e":"**正确答案：B。**\n\n否掉的根本原因是能力边界：安全组是实例级防火墙，只按 IP 与端口放行拒绝，不理解 HTTP 请求，注入特征、速率限制这些 Web 语义规则在它这里没有落点。防线不是堆出来的，是按层放对的组件。\n\n- A：许可与成本是编造的理由，两类规则的差异不在计费。\n- C：纵深不等于每层检查两次，而是每层各答一个问题，理由曲解了原则。\n- D：规则数量上限不是矛盾点，能力语义不匹配才是。\n\n记忆点：安全组没有 Web 语义，两层各干各的。"},{"id":"D6-038","d":6,"q":"团队的纵深防御已经跑起来，安全组提出进阶目标：把「检测」接到「处置」上——威胁检测服务发现恶意行为后，不用等人值班，自动收紧对应入口的防护规则，把暴露窗口从小时级压到分钟级。\n\n最合适的联动设计是什么？","o":[{"l":"A","t":"让威胁检测服务直接修改安全组，省掉中间环节，检测到即生效，链路最短。"},{"l":"B","t":"把威胁发现导出成日报，值班同学第二天上班按日报手动调整 WAF 与安全组。"},{"l":"C","t":"发现事件经事件总线触发函数，由函数按发现内容更新 WAF 规则或安全组，自动处置。"},{"l":"D","t":"检测与处置保持完全独立，安全组按固定周期全量收紧一次，与检测结果无关。"}],"a":["C"],"t":"single","s":"自编·6.2.5","e":"**正确答案：C。**\n\n标准联动是 GuardDuty 的发现经 EventBridge 触发 Lambda，函数按发现类型更新 WAF 或安全组——检测到处置自动衔接，暴露窗口从小时级压到分钟级。全自动只留给误伤面小的动作，高危仍建议先通知人。\n\n- A：检测服务没有直接改安全组的能力，「省掉中间环节」是杜撰。\n- B：日报加人工处置是小时级起步，暴露窗口没有缩短。\n- D：与检测结果脱钩的周期收紧既浪费也误伤，方向反了。\n\n记忆点：发现走事件总线，函数做处置，链路才闭环。"},{"id":"D6-039","d":6,"q":"组长把纵深防御五层组件的对号入座整理成抢答题，要求每条都说清「哪一层、挡什么」，答错的当场讲解，全部答完把正确版本贴到值班工位，作为日常排查的对号手册。\n\n下列对应正确的有哪些？（多选）","o":[{"l":"A","t":"Shield 在最外层边缘挡 DDoS 流量冲击，标准版自动启用，高级版还可配响应团队支持。"},{"l":"B","t":"WAF 挂在 CDN 或负载均衡入口上，按 Web 语义拦截 SQL 注入这类应用层攻击请求。"},{"l":"C","t":"安全组管到子网一层，NACL 管到单个实例，两层一里一外配合成完整边界。"},{"l":"D","t":"Network Firewall 部署在 VPC 边界，做状态检测与出站域名过滤，管住流量进出。"},{"l":"E","t":"WAF 的速率限制规则专治暴力破解，与注入防护规则互斥，两条规则不能并存生效。"}],"a":["A","B","D"],"t":"multiple","s":"自编·6.2.5","e":"**正确答案：ABD。**\n\nA、B、D 是五层里三个组件的标准对号：Shield 在边缘、WAF 在应用层、Network Firewall 在 VPC 边界。C 把安全组与 NACL 的管辖层级正好写反了，一里一外要对调；E 给两条并存的规则编造了互斥关系，速查卡上不能留。\n\n- C：反了——安全组是实例级防火墙，NACL 才是子网级，一里一外要对调。\n- E：速率限制与注入防护是两类规则，并存互不冲突，互斥说法不成立。\n\n记忆点：Shield 边缘挡 DDoS、WAF 应用层拦注入、NF 管 VPC 边界、安全组管实例、NACL 管子网，五层一条线。"},{"id":"D6-040","d":6,"q":"团队接手一个历史数据桶，里面有上万个对象，没人说得清里面有没有客户个人信息，而合规新规要求敏感数据必须先分级再处置。人工翻桶估计要几周，业务等不起，数据侧要先出清单。\n\n最合适的做法是什么？","o":[{"l":"A","t":"抽一百个对象人工查看，按比例推算整桶的敏感数据占比，当天出估算报告。"},{"l":"B","t":"写脚本按文件名关键词筛一遍，命中手机号字样的对象列入疑似清单人工复核。"},{"l":"C","t":"把整桶数据导到分析库跑一遍正则匹配，命中的行打标后输出统计报表。"},{"l":"D","t":"开 Macie 对桶做自动发现，按发现类型与严重度输出报告，两天出敏感数据清单。"}],"a":["D"],"t":"single","s":"自编·6.2.6","e":"**正确答案：D。**\n\n「几万个对象、要识别身份证号手机号这类敏感内容」是 Macie 的对口场景：机器学习加模式匹配扫描 S3，按发现类型与严重度输出结果，人工几周的活两天出清单，结果直接进分级处置流程。\n\n- A：抽样推算给不出逐条清单，分级处置没有落点。\n- B：文件名不代表内容，正文里的敏感信息全部漏掉。\n- C：导库跑正则工程量大，识别精度与分类能力都不如专用服务。\n\n记忆点：找 S3 里的敏感内容，开 Macie 自动发现。"},{"id":"D6-041","d":6,"q":"安全例会上两个需求被摆在一起讨论：一是发现 S3 桶里有没有存身份证号，二是发现 EC2 主机上有没有未修复的软件漏洞。新同事把两个需求都派给了 Macie，老员工指出其中一个是派错了对象。\n\n正确的分工是什么？","o":[{"l":"A","t":"两个都归 Macie——它既能扫存储里的敏感数据，也能扫主机的软件漏洞，算一专多能。"},{"l":"B","t":"身份证号归 Inspector，软件漏洞归 Macie——前者管内容识别，后者管漏洞扫描。"},{"l":"C","t":"两个都归 Inspector——漏洞与敏感内容都是安全问题，统一由漏洞服务处理。"},{"l":"D","t":"身份证号归 Macie，软件漏洞归 Inspector——一个看数据内容，一个看主机与镜像漏洞。"}],"a":["D"],"t":"single","s":"自编·6.2.6","e":"**正确答案：D。**\n\n这是骨架点名的失分点：Macie 找数据里的敏感内容，Inspector 找软件与系统的漏洞——一个看数据内容，一个看主机与镜像的软件缺陷。两个服务名字都带扫描，但对象完全不同，混选是失分重灾区，做题先看对象是数据还是主机。\n\n- A：Macie 不扫主机漏洞，一专多能是杜撰。\n- B：两个正好说反，是这道辨析题最典型的错误答案。\n- C：Inspector 不做数据内容识别，统一处理不成立。\n\n记忆点：看到漏洞想 Inspector，看到敏感内容想 Macie，先分对象再选服务。"},{"id":"D6-042","d":6,"q":"团队给存量桶开完 Macie 自动发现，看到账单里扫描费用随采样量走，负责人要求把成本管起来：既要摸清存量，又不能不计成本地全量扫。方案要在覆盖与费用之间取得平衡，既不能留死角也不能放任账单膨胀。\n\n最合适的做法是什么？","o":[{"l":"A","t":"关闭自动发现改成季度性人工抽查，每次抽一个前缀看一眼，费用几乎为零。"},{"l":"B","t":"先用采样扫描摸底，对高风险前缀再决定是否全量扫，按发现结果与采样量控制成本。"},{"l":"C","t":"直接对全部桶全量常开扫描，费用统一由安全预算承担，覆盖优先不计成本。"},{"l":"D","t":"只对新建的桶开扫描，历史存量默认无风险不再扫，成本自然降下来。"}],"a":["B"],"t":"single","s":"自编·6.2.6","e":"**正确答案：B。**\n\nMacie 的扫描有成本，按发现结果与采样量计费，标准路径就是先用采样摸底、再对高风险前缀决定全量，把预算花在刀刃上，覆盖与费用都有交代。\n\n- A：人工抽查既慢又漏，放弃了自动发现的能力本身。\n- C：全量常开最省心也最贵，与「管起来」的要求相反。\n- D：存量默认无风险是没有依据的假设，恰好是历史桶最容易藏敏感数据。\n\n记忆点：采样摸底，高风险前缀再全量，成本花在刀刃上。"},{"id":"D6-043","d":6,"q":"存量桶的敏感数据清完之后，团队担心新的桶不断创建，扫描覆盖会慢慢出现缺口——总有人建桶不报备。负责人要求新桶自动纳入扫描，不依赖人工登记，覆盖面要形成闭环，不能留随建随漏的口子。\n\n最合适的机制是什么？","o":[{"l":"A","t":"每周跑一次对账脚本，比对桶清单与扫描配置清单，差集由运维手工补上扫描。"},{"l":"B","t":"在开通流程里加一步「申请扫描」，建桶必须先提交工单，不申请就先冻结桶。"},{"l":"C","t":"桶创建事件触发通知，自动化流程按事件给新桶挂上扫描配置，建桶即覆盖。"},{"l":"D","t":"给每个团队发一份扫描配置文档，要求建桶时照文档自查自配，季度检查落实情况。"}],"a":["C"],"t":"single","s":"自编·6.2.6","e":"**正确答案：C。**\n\n「不依赖人工登记」指向事件驱动：桶创建事件经通知触发自动化，新桶落地即挂扫描配置，覆盖面随建桶动作自动闭环，全程不依赖人工登记，也不靠人记得。\n\n- A：对账加手工补是周级滞后的人工路径，缺口期内扫描是盲区。\n- B：流程加审批挡得住守规矩的，挡不住不报备的，恰恰漏的就是后者。\n- D：自查自配依赖自觉，与 A、B 一样都是人治路径。\n\n记忆点：新桶覆盖靠事件驱动，人治路径总有缺口。"},{"id":"D6-044","d":6,"q":"Macie 上线一周，各桶的发现结果陆续出来。新人把 Macie 的能力边界与处置纪律整理成笔记，准备在班组会上讲一遍，讲之前发群里请老员工核对，有理解错的当场指出，通过后才定稿归档。\n\n下列笔记正确的有哪些？（多选）","o":[{"l":"A","t":"Macie 用机器学习与模式匹配扫描 S3，识别个人身份信息、财务信息、凭证等敏感数据。"},{"l":"B","t":"Macie 也能扫 EC2 主机与容器镜像的软件漏洞，和 Inspector 是分工互补的关系。"},{"l":"C","t":"发现结果可以转发 Security Hub，与其他安全发现统一格式集中处置。"},{"l":"D","t":"全量扫描必须对所有桶常开，否则必有漏报，采样只是省钱的妥协。"},{"l":"E","t":"自动发现按采样扫描桶，也可以对特定前缀配置全量扫描，两者按需选择。"}],"a":["A","C","E"],"t":"multiple","s":"自编·6.2.6","e":"**正确答案：ACE。**\n\nA、C、E 是 Macie 能力与扫描模式的正确描述：识别什么、发现去哪、怎么扫。B 把 Inspector 的活安到 Macie 头上，正是骨架点名的失分点；D 把采样说成妥协，采样摸底本身就是标准用法。\n\n- B：扫主机与镜像漏洞是 Inspector 的职责范围，Macie 只看存储里的数据内容，两个服务别混用。\n- D：采样是覆盖与成本的正常平衡，高风险前缀再全量，不是必有漏报的妥协。\n\n记忆点：Macie 只看数据内容，采样是标准打法不是省钱的妥协，发现统一进 Hub 处置。"},{"id":"D6-045","d":6,"q":"Macie 的发现结果要进入处置环节，组长把处置纪律整理成几条笔记让大家确认：怎么分级、样本片段怎么对待、存量清完算不算完。确认通过的写进处置手册，有异议的当场讨论。\n\n下列笔记正确的有哪些？（多选）","o":[{"l":"A","t":"发现按严重度定流转：高危直接告警，中危进周报清单，低危定期复核。"},{"l":"B","t":"发现结果里带有样本片段，处置时可以把片段转发到工作群，方便大家一起定位。"},{"l":"C","t":"存量清完不是终点，新桶要靠事件通知自动纳入扫描，覆盖才算闭环。"},{"l":"D","t":"按分级处置：高敏数据迁移到加密桶，其余的加上访问控制，处置有先后。"},{"l":"E","t":"Macie 按发现结果与采样量计费，先用采样摸底再决定要不要全量，成本可控。"}],"a":["A","C","D","E"],"t":"multiple","s":"自编·6.2.6","e":"**正确答案：ACDE。**\n\nA、C、D、E 分别对应流转分级、覆盖闭环、处置分级与成本控制四条纪律，四条环环相扣，构成处置手册的主体框架条款。B 是唯一要改的：样本片段本身就是敏感数据，随手扩散等于二次泄漏。\n\n- B：发现结果里的样本片段本身就是敏感数据，要防二次扩散，只允许在处置界面查看，不能转发到聊天群，泄漏一次就是一起事件。\n\n记忆点：片段即敏感数据，处置分级流转，覆盖靠事件闭环。"},{"id":"D6-046","d":6,"q":"公司的对外网站要全站上 HTTPS。运维最头疼的是证书续期：过去手工申请、手工部署，每次到期前都要惦记，有一次差点过期造成服务中断。整改要求传输加密到位且证书不再依赖人工续期。\n\n最合适的方案是什么？","o":[{"l":"A","t":"把证书有效期申请到最长，减少续期次数，再配日历提醒到期前人工换新。"},{"l":"B","t":"自建证书签发体系，内部定期批量签发，部署脚本统一推送各入口替换旧证书。"},{"l":"C","t":"写一个到期巡检脚本，提前三十天发现临期证书并生成工单，人工跟进完成续期。"},{"l":"D","t":"证书改由 ACM 托管，自动续期私钥不出服务，负载均衡与 CDN 直接引用即可。"}],"a":["D"],"t":"single","s":"自编·6.2.7","e":"**正确答案：D。**\n\n「不依赖人工续期」正是 ACM 的核心价值：证书托管加自动续期，续期动作由服务完成，私钥不出服务更减少泄漏面，负载均衡与 CDN 直接引用，人工从续期流程里彻底退出。\n\n- A：拉长有效期只是降低频率，人工惦记的本质没变。\n- B：自建签发体系是把续期问题升级成一套系统要养，成本倒挂。\n- C：巡检加工单仍是人工闭环，只是把忘了变成被提醒。\n\n记忆点：证书上 ACM，续期这件事就不存在了。"},{"id":"D6-047","d":6,"q":"合规整改要求：敏感桶的静态加密不仅要开，密钥还要可审计、可轮换，密钥策略由公司自己管理、密钥材料的使用记录可查，不能只依赖默认配置。数据团队对照整改条款逐项评估加密密钥的选型。\n\n最合适的选型是什么？","o":[{"l":"A","t":"客户托管式 KMS 密钥——密钥策略自己管、可审计可轮换，满足全部整改要求。"},{"l":"B","t":"AWS 托管式密钥——服务默认集成开通即用，审计与轮换都由 AWS 代管最省事。"},{"l":"C","t":"CloudHSM——硬件独占最强，先上最高配，后续合规再有新要求也兜得住。"},{"l":"D","t":"应用层自研加密——数据写进桶前自己加密，密钥存在配置中心，完全自主可控。"}],"a":["A"],"t":"single","s":"自编·6.2.7","e":"**正确答案：A。**\n\n「策略自己管、可审计、可轮换」逐条对上客户托管式 KMS 密钥：密钥策略文件就是审计答案，轮换可配，权限按角色收窄。托管式密钥做不到策略自管，CloudHSM 是合规硬要求才上的重装备。\n\n- B：AWS 托管式密钥的策略不由客户管理，审计口径卡在整改要求之外。\n- C：没有硬件独占的合规硬要求就上 CloudHSM，属于过度配置。\n- D：自研加密绕开托管服务的审计与轮损能力，维护成本高且易出错。\n\n记忆点：可审计可轮换选客户托管密钥，别一步跳到 HSM。"},{"id":"D6-048","d":6,"q":"金融行业客户的合规审查提出硬性条款：加密密钥必须由客户在专用硬件里独占控制，密钥材料不能经过云厂商侧软件。架构师评估满足该条款的方案，并说明与常规做法的差异。\n\n最合适的方案是什么？","o":[{"l":"A","t":"客户托管式 KMS 密钥——密钥策略由客户管理，已经满足密钥自主控制的要求。"},{"l":"B","t":"CloudHSM——单租户专用硬件，密钥不经过 AWS 侧软件，合规硬要求的对口方案。"},{"l":"C","t":"AWS 托管式密钥——密钥由 AWS 专人管理，服务级别协议承诺不接触密钥材料。"},{"l":"D","t":"应用层自研加密——密钥放在自家机房，云端只存密文，绕开云侧密钥管理。"}],"a":["B"],"t":"single","s":"自编·6.2.7","e":"**正确答案：B。**\n\n条款里「专用硬件、独占控制、不经过云侧软件」三个关键词指向 CloudHSM：单租户硬件，密钥材料不出设备。KMS 是托管服务，密钥操作经过 AWS 侧软件，满足不了这种硬要求。\n\n- A：客户托管密钥的策略自管没错，但密钥操作仍在 KMS 服务软件内，条款不满足。\n- C：托管式密钥连策略都不在客户手里，距离条款更远。\n- D：自研加密丢掉托管能力链，审计与可用性都要自己扛，不是对口答案。\n\n记忆点：密钥硬件独占才上 CloudHSM，KMS 是托管路线。"},{"id":"D6-049","d":6,"q":"团队在内部培训里讲 KMS 与 CloudHSM 的选型，课后测验出了一道判断题：一家普通业务要把 S3 敏感桶加密，没有额外的行业合规条款，预算与运维人力有限，该选哪个、为什么，理由要能一句话讲清分界。\n\n正确的选型与理由是什么？","o":[{"l":"A","t":"选 CloudHSM——硬件设备的安全性天然高于软件服务，多花成本买安心值得。"},{"l":"B","t":"两者都不选——敏感数据干脆不做加密，靠桶策略与网络隔离来控制访问也够用了。"},{"l":"C","t":"选 KMS——托管密钥服务够用就选它，CloudHSM 是合规硬要求才需要上的重装备。"},{"l":"D","t":"两个都上——KMS 管日常加密请求，CloudHSM 做备份密钥库，双保险听起来最稳妥。"}],"a":["C"],"t":"single","s":"自编·6.2.7","e":"**正确答案：C。**\n\n分界一句话：KMS 是托管服务、够用就选它，CloudHSM 是合规硬要求才上的重装备。普通业务没有硬件独占条款，上 HSM 只会多出设备运维与成本，安全收益兑现不了，账单倒是先兑现了。\n\n- A：安全不是堆装备，没有对应合规要求的高配是纯负担。\n- B：敏感桶不加密直接违反数据保护基线，方向错误。\n- D：双保险是把两套密钥体系叠着养，运维成本翻倍，不是稳妥是冗余。\n\n记忆点：托管够用选 KMS，合规硬要求才上 CloudHSM。"},{"id":"D6-050","d":6,"q":"A 账号的应用要读取 B 账号里一个加密桶的对象。对方账号已经把桶与密钥的策略都配置完毕，但 A 账号的应用访问时依然被拒绝访问。双方各自检查了自己的配置都说没问题，联合排查开始。\n\n最可能缺的环节是什么？","o":[{"l":"A","t":"桶策略没有给 A 账号的角色放行读取，先补桶策略再谈其他环节。"},{"l":"B","t":"两个账号之间的网络没有打通，先建 VPC 对等连接，流量通了再验证权限。"},{"l":"C","t":"加密桶要改用 AWS 托管式密钥，客户托管密钥天然不支持跨账号访问。"},{"l":"D","t":"跨账号要两边授权都到位：密钥策略放行对方角色，对方 IAM 也要授权，缺一边读不了。"}],"a":["D"],"t":"single","s":"自编·6.2.7","e":"**正确答案：D。**\n\n跨账号读加密数据是常考场景：授权是两层乘法——资源侧密钥策略放行对方角色，访问侧对方的 IAM 也要授权该动作，任何一边缺失都是拒绝。双方「各自都没问题」恰恰说明缺的是对接的另一半。\n\n- A：题干说桶与密钥策略都已配置，再归因桶策略与前提矛盾。\n- B：访问 S3 走服务端点，跨账号授权是身份问题不是网络连通问题。\n- C：客户托管密钥支持跨账号共享，改托管式密钥既无效也倒退。\n\n记忆点：跨账号加密访问，密钥策略与 IAM 两边都要点头。"},{"id":"D6-051","d":6,"q":"数据保护专题培训后，组长把传输与静态加密的要点出成判断题让大家抢答，答错的当场讲解，涉及 ACM 托管、双层授权、密钥删除、桶级强制加密、CloudHSM 定位五个知识点，答案要对得上教材口径。\n\n下列说法正确的有哪些？（多选）","o":[{"l":"A","t":"传输中加密靠 TLS，证书由 ACM 托管并自动续期，负载均衡与 CDN 直接引用。"},{"l":"B","t":"客户托管密钥要配密钥策略与 IAM 双层授权，跨账号共享时缺一边就读不了。"},{"l":"C","t":"删除 KMS 密钥随时可以随时恢复，对已加密数据的读取没有任何影响。"},{"l":"D","t":"S3 桶级强制加密可用桶策略拒绝未加密请求，配合默认加密形成双保险。"},{"l":"E","t":"CloudHSM 是多租户托管服务，成本低够用就选，没有合规条款也能当默认选项。"}],"a":["A","B","D"],"t":"multiple","s":"自编·6.2.7","e":"**正确答案：ABD。**\n\nA、B、D 分别对应传输加密、双层授权与桶级强制加密三个标准口径。C 把删除说成随时可逆，E 把 CloudHSM 的定位整个说反——它是合规硬要求才上的单租户重装备，不是默认选项。\n\n- C：删错密钥等于数据报废，要启用删除保护、按规程设等待期，不存在随时恢复。\n- E：CloudHSM 是单租户专用硬件，没有硬要求不该上，多租户托管说的是 KMS。\n\n记忆点：证书续期找 ACM，密钥删除有等待期，CloudHSM 是合规硬要求的专属装备。"},{"id":"D6-052","d":6,"q":"外部审计对一家多账号公司提出要求：全部账号的 API 调用要有集中记录，且账号内的管理员自己也删不掉这些记录，证据要经得起完整性核验。平台团队要设计一个经得起核验的审计底座。\n\n最合适的设计组合是什么？","o":[{"l":"A","t":"组织级 CloudTrail 覆盖全账号，日志投递到专用账号的桶，桶开对象锁防删改。"},{"l":"B","t":"每个账号各开一条 CloudTrail，日志存在本账号的桶里，桶策略只允许服务写入。"},{"l":"C","t":"各账号的 CloudWatch 日志组统一保留策略设七年，日志组由管理员负责维护。"},{"l":"D","t":"开通 Config 全资源记录并集中查看，配置快照定期归档到各账号自己的存储桶。"}],"a":["A"],"t":"single","s":"自编·6.3.4","e":"**正确答案：A。**\n\n审计证据链完整性三件套正好逐条对上：组织级追踪覆盖全账号，投递到专用账号做隔离存储，对象锁提供防删除的 WORM 保护——账号内人员权限再大也删不掉，证据才立得住。\n\n- B：日志留在本账号，管理员既有权限删日志又有权限删追踪，完整性不成立。\n- C：日志组归各账号维护，保留策略可被改，且日志组不是 API 调用审计的正解。\n- D：Config 记配置形态不记 API 调用，对象锁定也依赖存储侧配合，覆盖错位。\n\n记忆点：集中记录、隔离存储、对象锁，三件套缺一不可。"},{"id":"D6-053","d":6,"q":"审计人员要核查：某生产资源三个月前的配置长什么样，当时的安全组规则、实例类型各是什么。值班同学准备去查 CloudTrail，老员工拦住他说查错了地方，要按「要什么证据」选对服务，别按名字猜。\n\n正确的取证服务是什么？","o":[{"l":"A","t":"CloudTrail——按时间范围过滤该资源相关的事件记录，能还原三个月前的完整配置形态。"},{"l":"B","t":"Config——按资源查配置的时间线，能回到任意时间点看当时的配置快照详情。"},{"l":"C","t":"VPC Flow Logs——把当时的网络流量元数据调出来，从流量往来数据还原资源配置。"},{"l":"D","t":"CloudWatch Logs——检索该资源三个月前的应用运行日志，从日志内容侧面推断配置。"}],"a":["B"],"t":"single","s":"自编·6.3.4","e":"**正确答案：B。**\n\n「当时长什么样」是配置形态问题，Config 的资源时间线就是干这个的：记录配置项及其变更，任意时间点的快照可回放。审计题按「要什么证据」选服务，别按名字熟悉度选。\n\n- A：CloudTrail 记操作不记配置形态，能看到谁改了、看不到改成长什么样。\n- C：Flow Logs 记网络元数据，还原不出安全组规则与实例类型。\n- D：运行日志是应用视角，与资源配置是两回事。\n\n记忆点：查操作记录用 CloudTrail，查配置形态用 Config，两个别查反。"},{"id":"D6-054","d":6,"q":"审计方要求公司证明：过去一年的操作日志没有被篡改过。安全团队提出对 CloudTrail 的日志做文件级完整性校验，并要求校验本身按周期定期执行、结果持续留档，审计方查验时能拿出连续的校验记录。\n\n正确的做法是什么？","o":[{"l":"A","t":"把日志桶的访问权限全部收回，没有人能访问就等于没有人能篡改，无需再校验。"},{"l":"B","t":"比对各账号手工导出的操作清单与日志条数，条数对得上就认定日志完整。"},{"l":"C","t":"用 CloudTrail 的日志文件校验功能，按时间段验证日志是否被改过，结果定期留档。"},{"l":"D","t":"把日志重新导入分析平台再导出，导出成功即证明文件完好，输出导出报告存证。"}],"a":["C"],"t":"single","s":"自编·6.3.4","e":"**正确答案：C。**\n\nCloudTrail 提供日志文件校验能力，按时间段验证日志文件与摘要是否被改动，校验要定期跑、结果留档，审计方查验时才有持续性的证据，这是教材明确的完整性保障手段。\n\n- A：收权限防人删，防不了凭证泄漏或配置失误后的改动，校验不能省。\n- B：条数比对挡不住同数量的篡改，完整性要看内容哈希。\n- D：导入导出只能证明当下可读，不能证明历史未被改动。\n\n记忆点：校验按时间段跑，结果留档才算证据链。"},{"id":"D6-055","d":6,"q":"团队要给生产 VPC 开 Flow Logs 做网络层审计。开在什么粒度上起了争论：网卡级粒度最细，子网级覆盖面大，有人担心子网级会漏掉新增资源。组长要求按运营成本、覆盖完整性与排查粒度三方面综合考虑再定。\n\n正确的建议是什么？","o":[{"l":"A","t":"按网卡逐个开启，新增网卡登记后补开，粒度最细排查最方便，配置量大就大。"},{"l":"B","t":"只给核心业务的主网卡开，非核心网卡不开，靠登记表维护覆盖清单。"},{"l":"C","t":"先全网卡全开一个月采样分析，之后按流量排名只保留前二十的网卡。"},{"l":"D","t":"开在子网级最省心，子网内新增网卡自动纳入，粒度细但配置量大的网卡级不推荐。"}],"a":["D"],"t":"single","s":"自编·6.3.4","e":"**正确答案：D。**\n\n教材口径：Flow Logs 开在子网级最省心——子网内新增网卡自动被覆盖，不存在漏开；网卡级粒度细但配置量大，维护成本高。审计场景优先保证覆盖不漏，粒度够用即可。\n\n- A：逐网卡开要靠登记驱动，漏登记就是漏覆盖，运营负担最重。\n- B：靠排名或登记留白，非核心网卡恰恰是横向移动的通道。\n- C：按流量排名裁撤覆盖，低流量高价值的痕迹会先丢。\n\n记忆点：Flow Logs 子网级覆盖自动闭环，别逐网卡维护。"},{"id":"D6-056","d":6,"q":"新人把审计底座三个记录服务的分工整理成笔记，准备在班组会上讲，讲前发群里请老员工逐条核对，有理解错的当场指出，核对通过后打印贴到值班工位，作为日常速查卡使用。\n\n下列笔记正确的有哪些？（多选）","o":[{"l":"A","t":"CloudTrail 记录 API 调用——谁、在什么时候、调了什么接口，回答的是操作层面的问题。"},{"l":"B","t":"Config 记录资源配置及其变更——资源长什么样、中间改了什么，回答的是形态问题。"},{"l":"C","t":"VPC Flow Logs 记录应用程序的业务日志内容，排查业务报错的时候用它查。"},{"l":"D","t":"CloudFormation 漂移检测用来发现实际资源和模板定义之间不一致的偏差情况。"}],"a":["A","B","D"],"t":"multiple","s":"自编·6.3.4","e":"**正确答案：ABD。**\n\nA、B、D 是三个记录对象的标准分工：操作归 CloudTrail、形态归 Config、漂移归检测——三个服务三本账，审计取证据之前先想清楚要的是哪一类证据，按类找服务就不会错。C 把 Flow Logs 的记录对象说错了，它记的是网络流量元数据，不是应用程序的业务日志内容。\n\n- C：Flow Logs 回答「谁连了谁、包收发量」这类网络问题，业务报错日志归 CloudWatch Logs 管，网络与应用两本账别混在一起。\n\n记忆点：操作、形态、网络元数据，三个服务三本账，别记串了。"},{"id":"D6-057","d":6,"q":"一次变更后有人绕过流水线手工改了生产资源，资源与模板出现了偏差，直到排障时才发现。组长要求把漂移管理立成常态机制，不能再靠排障的时候偶然发现，机制要能主动暴露偏差。\n\n正确的机制设计是什么？","o":[{"l":"A","t":"配合定时任务定期跑漂移检测，漂移早发现早归位，不让偏差过夜积累。"},{"l":"B","t":"冻结所有手工操作权限，从制度上禁止变更，漂移自然就不会再发生。"},{"l":"C","t":"每次大版本发布前跑一次漂移检测，发布间隙的偏差留到下次发布再处理。"},{"l":"D","t":"发现漂移后不声张，由当事人私下把资源改回模板，避免追究责任影响士气。"}],"a":["A"],"t":"single","s":"自编·6.3.4","e":"**正确答案：A。**\n\n漂移检测别当一次性动作，配合定时任务定期扫，早发现早归位——教材原话的落法就是把它变成例行检查，偏差窗口越短，排障与审计的代价越小。\n\n- B：一刀切禁手工既不现实也不必要，正路是发现偏差、引导走流水线。\n- C：按发布节奏扫，间隙里的偏差照样积累，还是漏。\n- D：私下改回掩盖了流程漏洞，审计链也断了，纪律问题更大。\n\n记忆点：漂移要定期扫，早发现早归位，偏差不过夜。"},{"id":"D6-058","d":6,"q":"威胁检测服务上线后每天产出几十条发现，大多是低危误报，安全组担心真正的高危发现被淹没在列表里，没人盯着就等于没检测。要给高危发现配一条「自动找上门」的通道。\n\n最合适的接线方式是什么？","o":[{"l":"A","t":"给发现列表配一个每日汇总邮件，值班同学早上统一过一遍，标记高危项跟进。"},{"l":"B","t":"用 EventBridge 订阅发现事件，按严重度过滤高危项，命中即转发 SNS 通知值班。"},{"l":"C","t":"把发现结果的仪表盘投到大屏，靠值班同学巡屏发现高危项再做处理。"},{"l":"D","t":"把发现结果定时导出到表格，安全组每周开会逐条过一遍，会上分派处理。"}],"a":["B"],"t":"single","s":"自编·6.3.5","e":"**正确答案：B。**\n\n发现类事件走 EventBridge：规则按 severity 过滤，只匹配高危发现并转发 SNS，通知是分钟级的「找上门」，不依赖任何人记得去看列表，高危不会在列表里过夜。低危不进通道，正好不吵。\n\n- A：日频汇总让高危发现要等到第二天早上，窗口太大。\n- C：巡屏还是人盯人的模式，漏看风险没有消除。\n- D：周会逐条过发现是复盘节奏，不是告警节奏，两者不能互相替代。\n\n记忆点：发现类走 EventBridge，指标类走 CloudWatch，按事件源类型接线，不混入口。"},{"id":"D6-059","d":6,"q":"安全制度新增一条：任何 S3 桶变成公开可读必须立刻知道，处置不能过夜。公开化往往来自一次不起眼的桶策略或权限修改，靠人工巡检发现不了这种瞬时变化。团队选实现方案。\n\n最合适的方案是什么？","o":[{"l":"A","t":"安排专人每周检查一遍全部桶策略，输出公开状态台账，异常项当场整改。"},{"l":"B","t":"给桶的存储量指标设 CloudWatch 告警，存储突增时人工核查是否与公开有关。"},{"l":"C","t":"用 Config 规则评估桶的公开状态，一旦不合规即触发告警通知，分钟级发现。"},{"l":"D","t":"开 Macie 扫描桶内容，发现里面有敏感数据时再回头检查桶的公开状态。"}],"a":["C"],"t":"single","s":"自编·6.3.5","e":"**正确答案：C。**\n\n「配置状态变化要立刻知道」是 Config 规则的对口场景：规则持续评估桶是否公开，评估到不合规即出发现，接上告警通知就是分钟级响应，变更发生在中间的任何时刻都逃不掉。\n\n- A：周频巡检与「不能过夜」差着量级，台账也是滞后的。\n- B：存储量与公开状态无关，指标选错了对象。\n- D：Macie 看数据内容，管不了桶的公开配置变化。\n\n记忆点：配置类异动用 Config 规则加告警，配置状态一变就响，分钟级闭环。"},{"id":"D6-060","d":6,"q":"安全运营要盯一类基础指标：控制台连续登录失败的次数——短时间内多次失败往往意味着撞库或暴力尝试。这类告警与安全发现的接线不同，这类告警与安全发现的接线不同，要先想清楚对象再选对监测工具。\n\n最合适的工具是什么？","o":[{"l":"A","t":"EventBridge——订阅控制台的登录事件流，失败事件逐条转发到值班群人工判断。"},{"l":"B","t":"GuardDuty——凭行为分析自动判断登录失败是否恶意，只报它认定的恶意尝试。"},{"l":"C","t":"Config——记录登录配置的变更历史，失败次数多时回查配置有没有被动过。"},{"l":"D","t":"CloudWatch 告警——对失败登录次数指标设阈值，越线即告警，盯的就是指标异动。"}],"a":["D"],"t":"single","s":"自编·6.3.5","e":"**正确答案：D。**\n\n失败登录次数是一个可累计的指标，「次数越线就响」正是 CloudWatch 告警的岗位——补充端盯基础指标，与发现端的 GuardDuty、接线端的 EventBridge 各管一段，三段合起来告警体系才完整。\n\n- A：逐条转发把判断全压给人，量一大就刷屏，次数越线的语义也没了。\n- B：GuardDuty 报的是它识别出来的恶意行为，而阈值告警要的是确定性触发，语义不同。\n- C：Config 记的是配置不盯次数，工具与对象根本错配。\n\n记忆点：次数越线找 CloudWatch，行为异常找 GuardDuty。"},{"id":"D6-061","d":6,"q":"团队梳理告警接线规范：新接入一类告警时先判断事件源属于哪一类，再选对应的接线工具，避免把发现类与指标类混接在一起造成漏报或噪音。组长要求给出判断标准。\n\n正确的分界标准是什么？","o":[{"l":"A","t":"按事件源类型分：安全发现类走 EventBridge 路由，指标异动类走 CloudWatch 告警。"},{"l":"B","t":"全部走 CloudWatch 告警——所有告警统一从一个入口进，值班在同一处查看，管理最简单。"},{"l":"C","t":"全部走 EventBridge——事件驱动是通用模式，指标也能包装成事件来订阅处理。"},{"l":"D","t":"全部直接发 SNS——通知服务就是告警的终点，中间的路由判断层都可以省掉。"}],"a":["A"],"t":"single","s":"自编·6.3.5","e":"**正确答案：A。**\n\n分界在事件源的类型：发现类（GuardDuty、Config 规则等产出的发现）走 EventBridge 订阅路由，可按严重度分级；指标类（次数、利用率、错误率）走 CloudWatch 告警按阈值触发。选错入口要么接不到要么全是噪音。\n\n- B：发现事件不是指标，CloudWatch 告警接不住，接住了也没有严重度语义。\n- C：指标包装成事件要多养一层转换，阈值评估还是 CloudWatch 的活。\n- D：SNS 是通知通道不是判断层，谁来判定「该不该响」没有着落。\n\n记忆点：发现走 EventBridge，指标走 CloudWatch，按源选路。"},{"id":"D6-062","d":6,"q":"告警通道上线一个月后被抱怨太吵：值班电话半夜响的大多是低危发现，真正的高危反而淹没在群消息里。组长要求把告警分层整理成规则笔记，逐条核对后定稿执行。\n\n下列笔记正确的有哪些？（多选）","o":[{"l":"A","t":"EventBridge 匹配发现的模式要按 severity 分级写，不同级别走不同的告警通道。"},{"l":"B","t":"所有发现不分级别全部塞进告警通道，宁可多报一千条也不能漏报一条真事件。"},{"l":"C","t":"只匹配 8 分以上的规则让高危走值班专线，低危不进告警通道免得吵。"},{"l":"D","t":"SNS 通知区分渠道：值班电话与群消息是两条订阅，静默时段谁接收要定清楚。"},{"l":"E","t":"告警规则一旦上线就不能再调，调整 severity 阈值会破坏历史告警的可比性。"}],"a":["A","C","D"],"t":"multiple","s":"自编·6.3.5","e":"**正确答案：ACD。**\n\nA、C、D 正是分层降噪的三板斧口诀：按严重度写匹配、高危走专线、渠道分开定义接收人。B 是「宁可误报」的老路，代价就是这次被抱怨的噪音淹没问题；E 是杜撰的禁令，阈值要随运行情况复盘调整。\n\n- B：全量进通道等于没有分层，噪音淹没高危的教训已经发生过。\n- E：告警规则要定期复盘调整，历史可比性靠留档解决，不是拒绝调整。\n\n记忆点：分级匹配、高危专线、渠道分开，三招治噪音。"},{"id":"D6-063","d":6,"q":"自动响应越做越多，组长担心某天自动动作误伤生产，把响应纪律整理成几条笔记让大家确认：哪些动作可以全自动、哪些必须有人先看一眼，确认通过的写进响应手册。\n\n下列笔记正确的有哪些？（多选）","o":[{"l":"A","t":"高危发现先通知人再处置，全自动只留给误伤面小的动作。"},{"l":"B","t":"隔离一台确认恶意的实例可以全自动，回收整个生产库必须人先确认。"},{"l":"C","t":"高危发现一律自动隔离涉事资源，处置完成后补发通知即可，速度优先。"},{"l":"D","t":"静默时段的接收人要预先定清楚，值班电话与群消息各有人负责盯。"}],"a":["A","B","D"],"t":"multiple","s":"自编·6.3.5","e":"**正确答案：ABD。**\n\nA、B、D 是响应手册的标准条款，逐条都能落到值班动作上：高危先通知人、全自动限于低误伤动作、静默时段责任到人。C 把顺序整个反过来——先处置后通知，一旦误判就是生产事故，恰恰是纪律要防的。\n\n- C：高危动作必须人先确认再执行，速度不能凌驾在误伤风险之上——先处置后通知，一旦误判就是生产事故，这恰恰是纪律要防住的。\n\n记忆点：高危人先看，自动留给低误伤，静默时段责任到人。"},{"id":"D6-064","d":6,"q":"审计要求：某敏感 Lambda 函数的每次调用都要留痕，谁触发、什么时候触发、调用参数摘要都要可查。平台同学默认开了管理事件，结果审计发现查不到调用记录，来问问题出在哪里、怎么修。\n\n正确的解释与修法是什么？","o":[{"l":"A","t":"CloudTrail 对 Lambda 的调用不是不生效，是要在函数里自己写日志代码，把每次调用记进日志组。"},{"l":"B","t":"管理事件只记录配置变更，调用属于数据事件，要为该函数单独开启数据事件才会留痕。"},{"l":"C","t":"调用记录默认不保留，把函数日志的保留策略调大，历史调用记录就会自动补齐。"},{"l":"D","t":"调用属于 VPC Flow Logs 的记录范围，给函数所在的子网开 Flow Logs 就能查到调用。"}],"a":["B"],"t":"single","s":"自编·6.3.6","e":"**正确答案：B。**\n\n日志分类开关题考的是「这个事件属于哪类日志」：Lambda 的配置变更记在管理事件里，而每次调用属于数据事件——数据事件默认不开，要按敏感资源单独开启，开了才能查到调用留痕。\n\n- A：CloudTrail 数据事件对 Lambda 有效，自己写日志是重复造轮子且不可信。\n- C：保留策略只影响存多久，默认没开的数据事件不会有历史可补。\n- D：Flow Logs 记网络元数据，没有调用参数摘要这种应用层信息。\n\n记忆点：Lambda 调用留痕开数据事件，配置变更才是管理事件。"},{"id":"D6-065","d":6,"q":"合规条款要求：审计日志保留七年且期间任何人不能删改。平台同学打算把日志全放在 CloudWatch 日志组里并设七年保留，架构师指出落位不对——日志组管热查，长期防删改归档要另有去处。\n\n正确的落位设计是什么？","o":[{"l":"A","t":"日志组保留七年且禁止删除日志组，靠保留策略与权限同时满足防删改要求。"},{"l":"B","t":"日志按月导出到本地归档服务器，由内网权限控制删改，云端只留三个月。"},{"l":"C","t":"日志组保留七天热查，到期由应用把摘要重新写进数据库长期保存备查。"},{"l":"D","t":"S3 对象锁防删改加生命周期转归档层，日志组只管热数据查最近，两层分工。"}],"a":["D"],"t":"single","s":"自编·6.3.6","e":"**正确答案：D。**\n\n七年防删改的标准落法是 S3 加对象锁：WORM 属性保证任何人删不掉改不了，生命周期把旧对象转入归档存储控成本；日志组保留热数据查最近，两层各管一段才是完整的保留策略。\n\n- A：日志组的保留策略可被有权限者调整，防删改强度达不到合规要求。\n- B：本地归档脱离云端审计链，完整性校验与访问审计都难做。\n- C：摘要替代不了原始日志，合规查证要的是原件。\n\n记忆点：热查在日志组，七年防删改靠对象锁加归档。"},{"id":"D6-066","d":6,"q":"公司要统一各团队的日志落位：现在日志散在各账号的桶与日志组里，权限各管各的，审计取一次证据要跨五个账号协调。架构师给出三条落位原则，要求全公司按原则限期整改到位。\n\n正确的落位原则是什么？","o":[{"l":"A","t":"集中存储、独立权限、长期保留——日志统一进专用日志账号的桶，读写分离。"},{"l":"B","t":"就地存储、谁产生谁保管——日志留在各账号，审计时临时协调授权取证。"},{"l":"C","t":"全部进一个公共桶，全公司可读可写，审计取证不用再协调任何权限。"},{"l":"D","t":"按团队分包存储，各自决定保留期限，只要保证能查到历史日志就行。"}],"a":["A"],"t":"single","s":"自编·6.3.6","e":"**正确答案：A。**\n\n落位原则一句话：集中存储、独立权限、长期保留。日志进专用账号的桶，审计取证据不用跨账号协调；专用账号权限只给写入不给读取，读的侧另开只读角色，读写分离才防得住误删。\n\n- B：就地保管把跨账号协调的成本永久固化，正是现状的痛点。\n- C：公共可读可写等于没有权限边界，日志自身成了最大泄漏面。\n- D：保留期各自为政，七年条款在哪个团队先破防不可控。\n\n记忆点：集中、独立、长期，六个字定落位。"},{"id":"D6-067","d":6,"q":"多账号日志开关的评审会上，组长把各类日志的开法整理成笔记逐条过：哪些全账号必开、哪些按资源开、开到什么粒度，评审通过的进基线配置，有争议的当场议定不留悬案。\n\n下列笔记正确的有哪些？（多选）","o":[{"l":"A","t":"CloudTrail 的管理事件要覆盖全部账号必开，这是审计底座起家的最低配置要求。"},{"l":"B","t":"管理事件会记录 Lambda 的每一次函数调用过程，开了管理事件调用就有留痕了。"},{"l":"C","t":"数据事件按敏感资源来开——S3 的对象级操作、Lambda 调用按实际需要分开开启。"},{"l":"D","t":"日志统一存进各账号自己的桶里就行，各账号自行决定保留期限与加密的方式。"},{"l":"E","t":"VPC Flow Logs 敏感子网必须开，开在子网级，子网里新增的网卡自动被覆盖。"}],"a":["A","C","E"],"t":"multiple","s":"自编·6.3.6","e":"**正确答案：ACE。**\n\nA、C、E 是开关基线的三条主线：管理事件打底、数据事件按敏感资源加开、Flow Logs 盯敏感子网。B 把事件类别搞混了，D 与落位原则正好相反——统一进专用日志账号才叫审计底座，分散在各账号只能算各扫门前雪。\n\n- B：Lambda 调用是数据事件，管理事件只记配置变更，正是上一次审计漏痕的原因。\n- D：分散存储与独立权限原则冲突，保留与加密口径也无法统一。\n\n记忆点：管理打底、数据按需、流日志盯敏感子网。"},{"id":"D6-068","d":6,"q":"一次审计取证时发现：某月的 CloudTrail 日志缺失了三天，事后才查明是投递故障，期间没有任何告警——审计链断了三天没人知道。组长要求给投递链路本身加上监控，让断链在发生的当下就有人知道。\n\n正确的做法是什么？","o":[{"l":"A","t":"每月手工抽查日志文件的条数与日期覆盖，缺口靠人工对比发现并补录。"},{"l":"B","t":"把日志投递失败当成常规故障，等业务反馈查不到日志时再升级处理。"},{"l":"C","t":"订阅 CloudTrail 的投递失败事件，一失败就告警——投递断了必须立刻知道。"},{"l":"D","t":"给存储桶开版本控制，日志缺失时从历史版本里找回缺失时段的记录。"}],"a":["C"],"t":"single","s":"自编·6.3.6","e":"**正确答案：C。**\n\n审计链的连续性要靠监控投递本身：CloudTrail 投递失败会发事件，订阅它接上告警，投递一断立刻有人知道。审计底座自己断了三天才发现，等于这三天对所有问题的答案都是「查不到」。\n\n- A：月度抽查的缺口窗口最长一个月，且补录不回真实历史。\n- B：审计日志没人主动反馈，等发现就是这次事故的复刻。\n- D：版本控制救的是文件误删，投递没发生的日志没有版本可回。\n\n记忆点：投递失败事件要订阅，审计链断了必须当场响。"},{"id":"D6-069","d":6,"q":"团队讨论日志保留的两层配置：CloudWatch 日志组的保留期设多久、S3 的生命周期怎么转，两边要配合成一个完整的保留策略而不是各设各的。组长要求把两层的分工讲清楚，配置写进保留策略文档里存档。\n\n正确的分工是什么？","o":[{"l":"A","t":"日志组与 S3 保留期设成一样的长度，两边同时过期删除，保持对称好记。"},{"l":"B","t":"日志组管热数据查最近，S3 管长期归档，按生命周期分层转存，两层都设。"},{"l":"C","t":"日志组永不过期，S3 只存最近一个月做备份，长期查询直接查日志组。"},{"l":"D","t":"S3 是唯一的权威存储，日志组三天就清空，所有历史查询都去 S3 上做。"}],"a":["B"],"t":"single","s":"自编·6.3.6","e":"**正确答案：B。**\n\n两层分工要分清：日志组保留热数据支撑近期高频查询，S3 按生命周期把旧数据转入标准、归档层做长期保存，两边都设才算完整的保留策略——热查快、冷存省，各司其职。\n\n- A：对称删除让长期保留落空，合规期限一到证据也跟着消失。\n- C：日志组全量长存查询成本高，S3 归档的意义也没了。\n- D：三天清空热层，近期高频排查全压到 S3 查询，又慢又贵。\n\n记忆点：热在日志组，冷在 S3，生命周期串两层。"},{"id":"D6-070","d":6,"q":"GuardDuty 报出一条高危发现：某角色的密钥在异国调用。值班同学确认发现属实后，还要回答审计追问的两个问题：这个异常影响面多大、还有哪些资源被同一个来源波及。单看发现详情回答不了。\n\n该用哪个工具做关联调查？","o":[{"l":"A","t":"CloudWatch Logs Insights——按角色名过滤相关日志记录，把命中的日志行导出来人工梳理关联。"},{"l":"B","t":"Config——查该角色的配置变更时间线，确认密钥是什么时候创建的、后来又改过几轮。"},{"l":"C","t":"Security Hub——把这条发现的严重度调高一档，等更多同类发现进来的时候自动聚合。"},{"l":"D","t":"Detective——把发现相关联的账号、IP、资源关系画成图谱，横向影响一眼看清。"}],"a":["D"],"t":"single","s":"自编·6.3.7","e":"**正确答案：D。**\n\n「影响面多大、还有谁被波及」是横向关联问题，Detective 的定位就是把发现相关联的账号、IP、资源画成图谱做调查——浅查用查询，深查用图谱，分析题按问题的深度选工具，先想清楚问的是什么。\n\n- A：Insights 只能查单类日志，跨源关系要人工拼，效率与完整性都差。\n- B：配置时间线回答「改了什么」，回答不了「波及了谁」。\n- C：等待聚合是被动的，调查要主动铺开关系。\n\n记忆点：横向影响找 Detective，图谱天生就是为关联调查而生的工具。"},{"id":"D6-071","d":6,"q":"安全周会要一份数据：过去二十四小时失败登录的来源分布——按来源 IP 统计次数排前二十。值班同学面对的是已收进 CloudWatch 日志组的登录日志，要求当场直接出统计结果，不能拖到第二天。\n\n最合适的做法是什么？","o":[{"l":"A","t":"用 Logs Insights 写查询语句，按字段过滤失败事件，stats 聚合按 IP 计数排序。"},{"l":"B","t":"把日志全量下载到本地，用表格软件手工筛选统计，结果截图放进周报附件里。"},{"l":"C","t":"让 Detective 出一份来源分布的分析报表，它的关联图谱里自带按 IP 计数排序功能。"},{"l":"D","t":"开 Macie 对日志组内容做扫描，把识别出的失败登录记录输出成统计报告。"}],"a":["A"],"t":"single","s":"自编·6.3.7","e":"**正确答案：A。**\n\n「单类日志按字段统计聚合」是 Logs Insights 的对口题：过滤条件加 stats 聚合一条查询出结果，分钟级交付，结果还能存成查询语句供每周直接复用，周报数据可持续产出。\n\n- B：手工统计不可复现也不可持续，周会要的是每周都能稳定产出的数据。\n- C：Detective 是做关联调查的图谱工具，不是统计报表工具，这里属于用错了对象。\n- D：Macie 扫敏感数据内容，统计登录次数与它无关。\n\n记忆点：浅查统计用 Insights 的 stats，一条查询的事。"},{"id":"D6-072","d":6,"q":"安全团队要做一个跨源分析：把日志组的登录记录、Config 的资源记录、发现数据联在一起，按 SQL 做一次联合查询，回答「异常登录发生时涉事资源处于什么配置」。团队要为这个需求选对分析工具并说明理由。\n\n最合适的工具是什么？","o":[{"l":"A","t":"CloudWatch Logs Insights——把三路数据统统导进同一个日志组，用查询语法做多路联合分析。"},{"l":"B","t":"Athena——对日志、配置快照等多源数据直接跑标准 SQL 语句的跨源联合查询分析。"},{"l":"C","t":"Detective——把三路数据画进同一张关联图谱里，人工沿着图谱节点去找答案。"},{"l":"D","t":"Security Hub——把三路数据统一转成发现格式再聚合，按发现的字段条件做筛选。"}],"a":["B"],"t":"single","s":"自编·6.3.7","e":"**正确答案：B。**\n\n跨源标准 SQL 联合查询是 Athena 的岗位：日志、配置快照这类存储在 S3 的数据都能建表直接查，全程不需要先把数据搬进同一套存储再查。工具选型看数据形态与问题类型。\n\n- A：Insights 只查日志组，跨源联合不在它的能力范围。\n- C：图谱擅长关联调查，SQL 语义的联合统计不是它的用法。\n- D：发现聚合有统一格式限制，配置快照塞不进发现模型。\n\n记忆点：跨源标准 SQL 找 Athena，单类日志查询才用 Insights，先看数据形态再选。"},{"id":"D6-073","d":6,"q":"运维要盯一类趋势问题：某 API 的调用量长期平稳，若某天突然偏离正常区间（无论骤增骤降）都要及时知道，而不是等越过固定阈值——因为正常水位会随业务波动，固定阈值不是误报就是漏报。\n\n最合适的做法是什么？","o":[{"l":"A","t":"把固定阈值每月按上月峰值人工调一次，越线告警，人工调参保持灵敏度。"},{"l":"B","t":"用 CloudWatch 异常检测，按历史模式建动态区间，偏离正常区间即告警。"},{"l":"C","t":"每天出一张调用量报表人工看趋势，发现异常当天口头通知值班处理。"},{"l":"D","t":"用 Config 记录调用量配置的变更，调用量波动时回查是不是配置改动导致。"}],"a":["B"],"t":"single","s":"自编·6.3.7","e":"**正确答案：B。**\n\n「偏离历史正常区间」是异常检测的语义：CloudWatch 异常检测按历史模式学出动态上下界，水位漂移区间跟着走，骤增骤降都触发，正好治固定阈值误报漏报的两头病。\n\n- A：人工按月调阈值是追赶式治理，波动快一步就失效。\n- C：人工看报表节奏是天级，偏离发生到被发现之间全是盲区。\n- D：Config 盯的是配置不盯指标，工具与问题根本错配。\n\n记忆点：趋势偏离用异常检测，固定阈值两头挨打。"},{"id":"D6-074","d":6,"q":"培训后组长把分析工具的分工出成判断题让大家抢答，答错的当场讲解，涉及查询聚合、关联图谱、跨源 SQL、分析产出四个知识点，答案要求对应教材口径，不许凭印象作答，答完还要抽查复述。\n\n下列说法正确的有哪些？（多选）","o":[{"l":"A","t":"Logs Insights 也能做跨账号的横向影响调查，图谱分析它同样能一并替代完成。"},{"l":"B","t":"Logs Insights 按字段查询并聚合日志，快速找出异常模式，浅查用它最顺手。"},{"l":"C","t":"Detective 把发现相关联的账号、IP、资源关系画成关联图谱，深查调查用它。"},{"l":"D","t":"分析产出要回到处置：确认是事件进响应流程，是误报就调发现精度。"},{"l":"E","t":"图谱调查与单类日志查询用同一个工具就可以兼顾，团队只学一个就够了。"}],"a":["B","C","D"],"t":"multiple","s":"自编·6.3.7","e":"**正确答案：BCD。**\n\nB、C、D 分别对应浅查、深查与产出闭环三条主线，环环相扣，其中产出闭环是最容易被忽略的一条：浅查用查询、深查用图谱、分析结果必须落回处置或调优，形成闭环。A、E 都在抹平工具边界——查询替代不了图谱，两个工具各管一段。\n\n- A：横向影响的调查是 Detective 的图谱能力，Insights 只能查单类日志，替代不了。\n- E：问题深度决定用什么工具，浅查深查分工明确，「只学一个」是偷懒的说法。\n\n记忆点：浅查 Insights、深查 Detective、产出要闭环。"},{"id":"D6-075","d":6,"q":"一次安全分析收尾时出现分歧：分析同学认定是真实事件并写完报告就归档了；安全组长指出分析链条还差最后一环没有闭合，要求按教材口径把闭环补上，否则同类误报还会反复打扰。\n\n缺的最后一环是什么？","o":[{"l":"A","t":"把分析报告同步给管理层周知，由管理层签字确认后事件才算正式结案。"},{"l":"B","t":"把涉事资源重建成新实例，资源换新后旧的风险自然消除，无需其他动作。"},{"l":"C","t":"把原始日志再复核一遍，确认统计口径无误后在报告上加盖复核标记存档。"},{"l":"D","t":"分析产出回到处置：确认是事件就进响应流程，是误报就调发现精度。"}],"a":["D"],"t":"single","s":"自编·6.3.7","e":"**正确答案：D。**\n\n分析不是终点：确认是事件就进响应流程处置，是误报就回头调发现精度——教材口径的产出闭环。不做这一环，误报源头没调，下一轮同样的噪音还会来，分析永远在做重复功。\n\n- A：管理层知悉是沟通动作，不是处置闭环本身。\n- B：重建资源是处置的一种动作，但它替代不了「进响应流程或调精度」的判定。\n- C：复核口径是质量动作，与闭环无关。\n\n记忆点：分析的终点是处置或调优，归档不算闭环。"}];
const QUIZ_MOCK_POOL = [];
const QUIZ_MOCK_SCORED = [];
</script>
<script>

/* ================================================================
   ===================== 题库数据（构建注入 QUIZ_META + QUIZ_QUESTIONS） ================
   ================================================================ */
// 模考池隔离（构建注入 QUIZ_MOCK_POOL；无模考池的科目为空集，行为不变）
const MOCK_IDS = (typeof QUIZ_MOCK_POOL !== "undefined" && QUIZ_MOCK_POOL) ? new Set(QUIZ_MOCK_POOL) : new Set();
// 模考池题目（仅全真模考可见；练习模式与统计一律不含）
const MOCK_QUESTIONS = QUIZ_QUESTIONS.filter(q => MOCK_IDS.has(q.id));
// 计分题 id：官方 65 题里 50 题计分、15 题不计分 —— 不计分题只上卷面，不参与判分
const MOCK_SCORED = (typeof QUIZ_MOCK_SCORED !== "undefined" && QUIZ_MOCK_SCORED) ? new Set(QUIZ_MOCK_SCORED) : new Set();
const QUESTIONS = QUIZ_QUESTIONS.filter(q => !MOCK_IDS.has(q.id));
const META = (typeof QUIZ_META !== 'undefined' && QUIZ_META) ? QUIZ_META : {};
const EXAM = META.exam || 'QUIZ';
const LS_PREFIX = META.lsPrefix || EXAM.toLowerCase();

const GLOSSARY = META.glossary || {};

function getGlossaryForQuestion(q) {
  const texts = [q.q];
  if(q.o && Array.isArray(q.o)) q.o.forEach(o => texts.push(o.t));
  if(q.e) texts.push(q.e);
  const fullText = texts.join(' ');
  const found = [];
  const sorted = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
  for(const term of sorted) {
    if(fullText.includes(term)) found.push({term, def: GLOSSARY[term]});
  }
  return found;
}

/* ================================================================
   ===================== 术语高亮 + 弹定义 ================
   ================================================================ */
// 长词优先排序，独立 token 边界匹配，避免 EBS 误标 Amazon EBS 中的 EBS 等
function getGlossarySortedKeys() {
  return Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
}

// 判断术语在文本中是否为独立出现（前后非字母/数字）
function isIndependentToken(text, idx, term) {
  const before = text[idx-1];
  const after = text[idx + term.length];
  const isLetter = c => c && /[A-Za-z0-9]/.test(c);
  return !isLetter(before) && !isLetter(after);
}

// 将解析正文中的术语高亮为可点击 span，返回 HTML
function fmtExp(s){ let t=(s===undefined||s===null)?'':String(s); t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); t=t.replace(/\n/g,'<br>'); t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); return t; }
function highlightGlossaryTerms(text) {
  if(!text) return text;
  const sortedKeys = getGlossarySortedKeys();
  let result = '';
  let i = 0;
  while(i < text.length) {
    let matched = false;
    for(const term of sortedKeys) {
      if(!term) continue;
      const idx = text.indexOf(term, i);
      if(idx === i && isIndependentToken(text, idx, term)) {
        const def = GLOSSARY[term] || '（暂无定义）';
        const termEsc = term.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const defEsc = def.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        result += `<span class="gloss-term" onclick="showGlossTip(event,'${termEsc}','${defEsc}')">${term}</span>`;
        i += term.length;
        matched = true;
        break;
      }
    }
    if(!matched) {
      // 中文等宽字符直接输出，保持原文本
      result += text[i];
      i++;
    }
  }
  return result;
}

// 点击术语弹出定义浮层
function showGlossTip(e, term, def) {
  e.stopPropagation();
  const tip = document.getElementById('glossTip');
  document.getElementById('glossTipTerm').textContent = term;
  document.getElementById('glossTipDef').textContent = def || '（暂无定义）';
  tip.style.display = 'block';
  // 定位：优先在点击位置下方，避免超出视口
  const pad = 12;
  let left = e.clientX + pad;
  let top = e.clientY + pad;
  // 先渲染再量尺寸
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if(left + tw > window.innerWidth - 8) left = e.clientX - tw - pad;
  if(top + th > window.innerHeight - 8) top = e.clientY - th - pad;
  if(left < 8) left = 8;
  if(top < 8) top = 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

/* ================================================================
   ===================== localStorage 操作 =========================
   ================================================================ */
const LS_ANSWERS = LS_PREFIX + '_answers';
const LS_WRONG   = LS_PREFIX + '_wrong';
const LS_PROGRESS = LS_PREFIX + '_progress';

function getAnswers() { return JSON.parse(localStorage.getItem(LS_ANSWERS)||'[]'); }
function setAnswers(a) { localStorage.setItem(LS_ANSWERS,JSON.stringify(a)); }
function getWrong() { return JSON.parse(localStorage.getItem(LS_WRONG)||'[]'); }
function setWrong(w) { localStorage.setItem(LS_WRONG,JSON.stringify(w)); }
function getProgress() { return JSON.parse(localStorage.getItem(LS_PROGRESS)||'{}'); }
function setProgress(p) { localStorage.setItem(LS_PROGRESS,JSON.stringify(p)); }

/* ----------------------------------------------------------------
   作答记录：会话态 / 累计统计态分离（修复）
   旧缺陷：模拟考核误读全局 localStorage 历史 → 进场即显示「已答对/曾答错」、
   题号导航提前染色、成绩单把练习与往场算进本次（实测正确数>题数、未答为负、
   分数超满分、正确率>100%）。
   三态口径：
     · sessionResults()       本场逐题作答（quizState.results）＝「本次」唯一真源
     · sessionScopedAnswers() 视图用作答集：考核=仅本场；练习模式=全局历史（原行为）
     · recordAnswer()         仍写全局 store → 错题集与统计口径不变
   ---------------------------------------------------------------- */
function sessionResults() {
  const r = (quizState && quizState.results) || {};
  return Object.keys(r).map(id => ({id, ua:r[id].ua, ok:r[id].ok, ts:r[id].ts}));
}
function sessionScopedAnswers() {
  return (quizState && quizState.mode === 'exam') ? sessionResults() : getAnswers();
}

function recordAnswer(qId, userAnswer, isCorrect) {
  const answers = getAnswers();
  answers.push({id:qId,ua:userAnswer,ok:isCorrect,ts:Date.now()});
  setAnswers(answers);
  const wrong = getWrong();
  const idx = wrong.findIndex(w=>w.id===qId);
  if(!isCorrect) {
    if(idx>=0) { wrong[idx].count++; wrong[idx].last=Date.now(); }
    else { wrong.push({id:qId,count:1,last:Date.now(),mastered:false}); }
  }
  setWrong(wrong);
}

function markMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=true;
  setWrong(wrong);
}
function unmarkMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=false;
  setWrong(wrong);
}
function removeWrong(qId) {
  setWrong(getWrong().filter(x=>x.id!==qId));
}

/* ================================================================
   ===================== 辅助函数 =================================
   ================================================================ */
const DOMAIN_NAMES = META.domains || {};
const DOMAIN_WEIGHTS = META.weights || {};
const DOMAIN_KEYS = Object.keys(DOMAIN_NAMES).map(Number).sort((a,b)=>a-b);
const EXAM_P = META.examParams || {};
const EXAM_COUNT = EXAM_P.count || 50;
const EXAM_MIN = EXAM_P.minutes || 60;
const EXAM_PASS = EXAM_P.pass || 700;
const TYPE_NAMES = {single:'单选题',multiple:'多选题',hot:'拖拽题'};

// 走全集：模考池题目不在练习池里，但模考错题会进错题集，取题必须能取到
function getQById(id) { return QUIZ_QUESTIONS.find(q=>q.id===id); }
function shuffle(arr) { const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function generateShuffledOptions(questions) {
  const opts = {};
  const newAnswers = {};
  questions.forEach(q => {
    if(q.t==='single'||q.t==='multiple') {
      const shuffled = shuffle([...q.o]);
      const labels = 'ABCDEFGHIJ';
      const relabeled = shuffled.map((item, i) => ({l: labels[i], t: item.t}));
      opts[q.id] = relabeled;
      const contentToNewLabel = {};
      relabeled.forEach(item => { contentToNewLabel[item.t] = item.l; });
      newAnswers[q.id] = q.a.map(oldL => {
        const oldItem = q.o.find(o => o.l === oldL);
        return oldItem ? contentToNewLabel[oldItem.t] : oldL;
      });
    }
  });
  return { opts, newAnswers };
}

function getStats() {
  const answers = getAnswers();
  const wrong = getWrong();
  const totalCorrect = answers.filter(a=>a.ok).length;
  const totalAnswered = answers.length;
  const acc = totalAnswered ? Math.round(totalCorrect/totalAnswered*100) : 0;
  const doneIds = [...new Set(answers.map(a=>a.id))];
  const completion = Math.round(doneIds.length/QUESTIONS.length*100);
  const domainStats = {};
  for(const d of DOMAIN_KEYS) {
    const dQIds = QUESTIONS.filter(q=>q.d===d).map(q=>q.id);
    const dAnswers = answers.filter(a=>dQIds.includes(a.id));
    const dCorrect = dAnswers.filter(a=>a.ok).length;
    const dTotal = dAnswers.length;
    domainStats[d] = {
      total:dQIds.length, answered:dTotal, correct:dCorrect,
      acc: dTotal ? Math.round(dCorrect/dTotal*100) : 0
    };
  }
  const typeStats = {};
  for(const t of ['single','multiple']) {
    const tQIds = QUESTIONS.filter(q=>q.t===t).map(q=>q.id);
    const tAnswers = answers.filter(a=>tQIds.includes(a.id));
    const tCorrect = tAnswers.filter(a=>a.ok).length;
    const tTotal = tAnswers.length;
    typeStats[t] = { answered:tTotal, correct:tCorrect, acc: tTotal ? Math.round(tCorrect/tTotal*100) : 0 };
  }
  const recentWrong = wrong.filter(w=>!w.mastered).sort((a,b)=>b.last-a.last).slice(0,5);
  const recent = answers.slice(-20).reverse();
  let streak = 0;
  for(const a of recent) { if(a.ok) streak++; else break; }
  return {totalCorrect,totalAnswered,acc,completion,domainStats,typeStats,recentWrong,streak,doneIds:doneIds.length};
}

    <button class="btn-primary" onclick="startRealExam()" style="background:#7c3aed;color:#fff">🎯 全真模考（${MOCK_QUESTIONS.length}题 · ${MOCK_SCORED.size}题计分 / ${EXAM_MIN}分钟）</button>` : '') + `
