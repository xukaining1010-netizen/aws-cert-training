<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>学习材料</title>
<style>
/* ===== 页面结构：首页目录 + 章级分页 SPA（非单一长页） ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;font-size:17px;line-height:1.7}
.wrap{max-width:1200px;margin:0 auto;padding:24px 28px 60px}
@media(max-width:768px){.wrap{padding:16px 14px 48px}}

/* ===== 首页 ===== */
.hdr{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:12px;padding:30px 32px 26px;margin-bottom:18px}
.hdr-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:3px 12px;border-radius:20px;margin-bottom:10px}
.hdr h1{font-size:24px;font-weight:800;line-height:1.4}
.hdr-sub{font-size:13px;opacity:.9;margin-top:8px}
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.ov-item{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.ov-num{font-size:28px;font-weight:800;color:#4f46e5;line-height:1.2}
.ov-lbl{font-size:12px;color:#64748b;margin-top:4px}
@media(max-width:768px){.ov{grid-template-columns:repeat(2,1fr)}}

.card-s{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.cs-title{font-size:18px;font-weight:700;color:#374151;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}

/* 章节目录卡 */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ch-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 16px;cursor:pointer;transition:.2s;margin-bottom:0}
.ch-card:hover{border-color:#7c3aed;transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,70,229,.12)}
.ch-card.done{border-color:#16a34a}
.cc-num{font-size:11px;font-weight:700;margin-bottom:3px}
.cc-title{font-size:15px;font-weight:700;color:#1e293b;margin-bottom:6px}
.cc-meta{font-size:13px;color:#64748b}
.cc-prog{margin-top:8px}
.pm{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:3px}
.pbar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .4s}

/* 考试速览 */
.exam-quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.eq-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 10px;text-align:center}
.eq-num{font-size:20px;font-weight:800;color:#4f46e5;line-height:1.2}
.eq-sub{font-size:10.5px;color:#64748b;margin-top:2px}
.eq-lbl{font-size:11px;color:#64748b;margin-top:5px}
.exam-two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:10px}
@media(max-width:768px){.exam-two-col{grid-template-columns:1fr}}
.exam-sub-t{font-size:14px;font-weight:700;color:#374151;margin:4px 0 10px}
.exam-domain-tbl{width:100%;border-collapse:collapse;font-size:15px}
.exam-domain-tbl th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;padding:9px 12px;text-align:left;font-weight:700}
.exam-domain-tbl td{padding:9px 12px;border-bottom:1px solid #e9d5ff;vertical-align:middle}
.exam-domain-tbl tr:nth-child(even) td{background:#faf5ff}
.domain-chip{display:inline-block;border-radius:20px;padding:2px 11px;font-size:12px;font-weight:700;background:#ede9fe;color:#5b21b6;cursor:pointer;border:none;transition:.15s}
.domain-chip:hover{background:#ddd6fe}
.exam-info-list{font-size:15px;color:#374151;margin:0 0 12px 18px}
.exam-info-list li{margin-bottom:6px;line-height:1.7}
.exam-steps{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px;font-size:14px}
.step-block{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;padding:9px 12px;font-size:13px;color:#4338ca;flex:1 1 150px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.step-block b{display:block;font-size:13px}
.step-block span{display:block;font-size:11.5px;color:#6d28d9;margin-top:3px}
.step-arrow{color:#a78bfa;font-weight:700;font-size:16px;padding:0 4px;flex:0 0 auto;align-self:center}
details.exam-faq{margin-top:12px;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;background:#f8fafc}
details.exam-faq summary{font-size:14px;font-weight:700;color:#374151;cursor:pointer}
details.exam-faq p{margin:9px 0 0;font-size:14px;color:#475569;line-height:1.75}

/* 14 天计划 */
.ptbl{width:100%;border-collapse:collapse;font-size:15px}
.ptbl th{background:#f8fafc;padding:11px 12px;text-align:left;font-weight:600;color:#374151;border-bottom:2px solid #e2e8f0;font-size:14px}
.ptbl td{padding:10px 12px;border-bottom:1px solid #f8fafc;vertical-align:middle}
.ptbl tr:last-child td{border-bottom:none}
.day{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.chip-p{background:#ede9fe;color:#5b21b6}.chip-p:hover{background:#ddd6fe}
.focus{font-size:12px;color:#64748b}

/* ===== 章面板 ===== */
.ch-topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);padding:8px 18px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px}
.back-btn{background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:13px;font-weight:600;border-radius:8px;padding:5px 14px;cursor:pointer;white-space:nowrap;transition:.15s}
.back-btn:hover{background:#ede9fe}
.tn-title{font-size:15px;font-weight:700;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-hdr{color:#fff;padding:20px 22px 16px;border-radius:12px 12px 0 0;margin-bottom:0}
.ch-badge{font-size:13px;font-weight:700;opacity:.9;margin-bottom:5px;display:block}
.ch-title{font-size:22px;font-weight:800}
.panel{margin-bottom:14px}
.task-list{padding-left:22px;font-size:16px;color:#374151;line-height:2.0}
.task-list li::marker{color:#a78bfa}
.task-list a{color:#374151;text-decoration:none}
.task-list a:hover{color:#4f46e5}
.tl-id{display:inline-block;min-width:38px;font-weight:700;color:#4f46e5;margin-right:6px}
.panel-hr{border:none;border-top:1px solid #e2e8f0;margin:14px 0}

/* ===== 正文排版（规范 B） ===== */
.mdbody .sec-block h2.mh2{font-size:19px;font-weight:700;color:#4f46e5;margin:4px 0 12px;padding:10px 0 8px;border-top:1px solid #e2e8f0}
.mdbody p{font-size:17px;color:#374151;margin-bottom:14px;line-height:1.9}
.mdbody ul,.mdbody ol{font-size:17px;color:#374151;padding-left:24px;margin-bottom:12px}
.mdbody li{margin-bottom:8px;line-height:1.9}
.mdbody blockquote{border-left:3px solid #a78bfa;padding:10px 16px;background:#f5f3ff;font-size:15px;color:#5b21b6;margin:0 0 14px;border-radius:0 6px 6px 0;line-height:1.8}
.mdbody code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.mdbody h4.sec-h{font-size:17px;font-weight:600;color:#374151;margin:24px 0 10px;padding-left:12px;border-left:3px solid #a78bfa;line-height:1.4}
.mdbody .case-card,.mdbody .mem-card{border-radius:10px;padding:13px 16px;margin-bottom:14px}
.mdbody .case-card{background:#fff8e6;border:1px solid #ecd9a0}
.mdbody .mem-card{background:#eef3ff;border:1px solid #b9c9f7}
.mdbody .case-card h4.sec-h,.mdbody .mem-card h4.sec-h{border-left:none;padding-left:0;margin:0 0 8px;font-size:14px;font-weight:700}
.mdbody .case-card h4.sec-h{color:#9a7b1e}
.mdbody .mem-card h4.sec-h{color:#4361ee}
.mdbody .case-card p,.mdbody .mem-card p{font-size:15px}
.mdbody .case-card ul,.mdbody .mem-card ul{margin-bottom:0;font-size:15px}
/* 表格（规范 C） */
.tbl-wrap{overflow-x:auto;margin:0 0 14px;border:1px solid #e9d5ff;border-radius:10px}
.tbl-wrap table{min-width:480px}
table{border-collapse:collapse;width:100%;font-size:16px}
.mdbody th,.mdbody td{padding:11px 16px;text-align:left;border-bottom:1px solid #e9d5ff;vertical-align:top;line-height:1.6}
.mdbody thead th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;font-weight:700;font-size:15px;white-space:nowrap}
.mdbody tbody tr:nth-child(even) td{background:#faf5ff}
.mdbody tbody tr:last-child td{border-bottom:none}
/* 图块（v2.1 图文同流） */
.fig-block{background:#f8f7ff;border:1px solid #ddd6fe;border-radius:12px;padding:14px 16px;margin:0 0 14px}
.fig-placeholder{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fbfafd;border:1.6px dashed #c4b5fd;border-radius:12px;padding:12px 16px;margin:0 0 14px}
.fig-img{background:#f8f7ff;border:1px solid #ddd6fe;border-radius:12px;padding:10px 12px;margin:0 0 14px;text-align:center}
.fig-img img{max-width:100%;height:auto;border-radius:8px}
.fig-img figcaption{font-size:12px;color:#64748b;margin-top:6px;line-height:1.5}
.mdbody .inline-img{max-width:100%;height:auto;vertical-align:middle;border-radius:6px;margin:0 2px}
.mdbody .img-bad{display:inline-block;background:#fef2f2;border:1px dashed #ef4444;color:#b91c1c;font-size:13px;padding:1px 8px;border-radius:6px}
.fig-placeholder .fp-num{background:#7c3aed;color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.fig-placeholder .fp-type{background:#ede9fe;color:#6d28d9;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.fig-placeholder .fp-alt{color:#334155;font-size:14px;flex:1 1 auto;min-width:120px}
.fig-placeholder .fp-note{color:#94a3b8;font-size:12px;white-space:nowrap;border:1px dashed #cbd5e1;border-radius:6px;padding:2px 8px}
.fig-title{font-size:13px;font-weight:700;color:#4f46e5;text-align:center;margin-bottom:10px}
.fig-body{overflow-x:auto}
.fig-body svg{display:block;margin:0 auto;height:auto}
.fig-caption{font-size:12px;color:#6b7280;text-align:center;margin-top:10px;font-style:italic}
/* 手绘图 CSS 类（兼容） */
.compare-tbl{width:100%;border-collapse:collapse;font-size:13px}
.compare-tbl th{padding:9px 12px;font-weight:700;font-size:12px;text-align:center}
.compare-tbl td{padding:8px 12px;border:1px solid #e2e8f0;font-size:13px;vertical-align:top;line-height:1.5}
.compare-tbl tr:nth-child(even) td{background:#faf9ff}
.flow-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.flow-node{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;text-align:center;min-width:80px}
.flow-node.light{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#4338ca}
.flow-node.green{background:linear-gradient(135deg,#06d6a0,#059669);color:#fff}
.flow-arrow{color:#a78bfa;font-size:18px;font-weight:700;flex-shrink:0}
.cycle-wrap{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.cycle-step{display:flex;flex-direction:column;align-items:center;gap:4px}
.cycle-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.cycle-label{font-size:11px;color:#374151;text-align:center;max-width:70px;line-height:1.3}
.cycle-arrow{color:#a78bfa;font-size:16px;align-self:flex-start;margin-top:6px}
.stair-wrap{display:flex;align-items:flex-end;gap:8px;padding:8px 0;justify-content:center;flex-wrap:wrap}
.stair-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.stair-bar{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:6px 6px 0 0;width:80px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;padding:4px}
.stair-label{font-size:11px;color:#374151;text-align:center;max-width:80px;line-height:1.3}

/* 域尾提示卡 */
.tips-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tips-card .tc-title{font-size:15px;font-weight:700;margin-bottom:10px;color:#374151}
.tips-card table{font-size:14px}
.tips-card th{padding:9px 12px;font-size:13px}
.tips-card td{padding:9px 12px;font-size:14px;line-height:1.6}

/* ===== 章末练习 quiz-box（模块 10） ===== */
.quiz-box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:18px 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);scroll-margin-top:78px}
.quiz-hdr{display:flex;align-items:baseline;gap:14px;font-size:18px;font-weight:700;color:#374151;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}
.quiz-score{font-size:14px;font-weight:700;color:#4f46e5;margin-left:auto;white-space:nowrap}
.qi{border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.qi.done{background:#fafafa}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qbadge{background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:700}
.qtype{font-size:11px;border-radius:12px;padding:1px 9px;font-weight:600}
.qtype-s{background:#e0f2fe;color:#0369a1}
.qtype-m{background:#fce7f3;color:#be185d}
.qstem{font-size:16px;color:#1e293b;margin-bottom:10px;line-height:1.8}
.qstem code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{background:#fff;border:1.5px solid #e2e8f0;border-radius:9px;padding:11px 14px;font-size:15.5px;color:#374151;cursor:pointer;transition:.15s;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:#a78bfa}
.opt .ol{font-weight:700;color:#4f46e5;flex-shrink:0}
.opt.sel{border-color:#4f46e5;background:#ede9fe}
.opt.cor{border-color:#16a34a;background:#dcfce7}
.opt.wrg{border-color:#dc2626;background:#fee2e2}
.opt.shc{border-color:#16a34a;background:#f0fdf4}
.qi.done .opt{cursor:default;pointer-events:none}
.qrow{margin-top:10px;display:flex;align-items:center;gap:12px}
.qbtn{background:#4f46e5;color:#fff;font-size:12px;font-weight:600;border:none;border-radius:7px;padding:7px 18px;cursor:pointer;transition:.15s}
.qbtn:hover{background:#4338ca}
.qbtn:disabled{background:#cbd5e1;cursor:default}
.qres{display:none;flex:1;border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.7}
.qres.ok{background:#dcfce7;color:#15803d}
.qres.err{background:#fee2e2;color:#b91c1c}
.qres.na{background:#fef3c7;color:#b45309}
.qres.show{display:block}
/* 长串防溢出：overflow-wrap:anywhere 仅在 token 放不下时词内断行，普通文本断词行为不变；
   根治 SCP JSON/ARN 等不可断长串撑破移动端面板（SAP-C02 实测 sw=448→390） */
.mdbody,.quiz-box,.qi,.qstem,.opts,.opt{overflow-wrap:anywhere}
.qstem code,.opt code{white-space:pre-wrap;word-break:break-all}
.score-box{display:none;text-align:center;background:#f5f3ff;border-radius:10px;padding:22px 16px;margin-top:16px}
.score-box.show{display:block}
.score-num{font-size:32px;font-weight:700;color:#4f46e5;line-height:1.3}
.score-lbl{font-size:13px;color:#6d28d9;margin-top:4px}
.score-box .sb-tip{font-size:12px;color:#64748b;margin-top:8px;line-height:1.7}

.footer{margin-top:26px;padding:18px 10px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:12.5px;text-align:center;line-height:1.9}
.footer a{color:#4f46e5;text-decoration:none}
@media(max-width:768px){.ptbl th,.ptbl td{font-size:13px}.mdbody th,.mdbody td{font-size:13px}}

/* ===== 章面板 v6 布局：左侧常驻目录槽 + 正文列 =====
   三条布局约定：① 正文 #### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点，见下方 .mh3）
   ② 左侧目录两级（节 ▸ 知识点，单开手风琴 + 滚动自动跟读）③ 左右两侧任何分辨率留白，目录常驻不遮正文：
   ≥1200px：.panel 栅格 [236px 目录槽 | 正文列]，目录 sticky 常驻；<1200px：目录槽变左侧抽屉（☰+遮罩）。 */
body.chapView .wrap{max-width:1420px}
.panel{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start;margin-bottom:14px}
.ch-side{position:sticky;top:14px;min-width:0;z-index:30}
.side-close{display:none}
.toc-open-btn{display:none}
.side-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:85;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.side-mask.show{opacity:1;visibility:visible}
.ch-toc{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 6px 24px rgba(15,23,42,.06);overflow:hidden}
.ch-toc .toc-hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;border-bottom:1px solid #f1f5f9}
.ch-toc .th-title{font-size:13px;font-weight:800;color:#4f46e5;white-space:nowrap}
.ch-toc .th-meta{font-size:11px;color:#94a3b8;font-weight:600;white-space:nowrap}
.ch-toc .toc-body{max-height:calc(100vh - 46px);overflow-y:auto;padding:8px}
.toc-list{list-style:none;margin:0;padding:0}
.toc-list a{display:flex;align-items:baseline;gap:6px;padding:5px 6px;border-radius:7px;color:#475569;text-decoration:none;line-height:1.45;font-size:13px;transition:.12s}
.toc-list a:hover{background:#f5f3ff;color:#4f46e5}
.toc-list a.act{background:#ede9fe;color:#3730a3;font-weight:600}
.toc-list .tl-id{font-size:11.5px;font-weight:700;color:#a78bfa;flex-shrink:0;font-variant-numeric:tabular-nums}
.toc-list a.act .tl-id{color:#4f46e5}
.toc-t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toc-sec>a.toc-sec-link{font-weight:600;color:#334155;padding-top:6px;padding-bottom:6px}
.toc-sec>a .toc-ar{margin-left:auto;flex-shrink:0;font-size:9px;color:#94a3b8;transition:transform .18s}
.toc-sec.open>a .toc-ar{transform:rotate(90deg);color:#4f46e5}
.toc-sub{list-style:none;margin:0;padding:0 0 3px;display:none}
.toc-sec.open>.toc-sub{display:block}
.toc-sub a{padding:3px 6px 3px 20px;font-size:12.5px;color:#64748b;line-height:1.4}
.toc-sub a .tl-id{font-size:11px;color:#c4b5fd}
/* 目录尾【本章练习】入口（v6.2 新增）：独立条目，虚线分隔，点击滚到章末练习区 #quiz-dX */
.toc-quiz{margin-top:7px;padding-top:3px;border-top:1px dashed #ddd6fe}
.toc-quiz>a.toc-quiz-link{font-weight:700;color:#6d28d9;padding-top:6px;padding-bottom:6px}

// 题库数据注入区（构建系统自动注入，含考试元信息与题目全集，勿手改）
const QUIZ_META = {"exam":"DOP-C02","title":"AWS Certified DevOps Engineer - Professional 题库","lang":"zh","updated":"2026-11-09","domains":{"1":"SDLC 自动化（SDLC Automation）","2":"配置管理与基础设施即代码（Configuration Management and IaC）","3":"弹性云方案（Resilient Cloud Solutions）","4":"监控与日志（Monitoring and Logging）","5":"事件与事件响应（Incident and Event Response）","6":"安全与合规（Security and Compliance）"},"weights":{"1":"22%","2":"17%","3":"15%","4":"15%","5":"14%","6":"17%"},"examParams":{"count":65,"minutes":180,"pass":750},"footerNote":"题库建设中：题目按 DOP-C02 官方考纲技能点自建命题；以 AWS 官方文档与考试指南为准；Domain 按官方考纲划分"};
const QUIZ_QUESTIONS = [{"id":"D1-001","d":1,"t":"single","q":"一家公司在 AWS CodeCommit 中管理应用程序的源代码，并通过 AWS CodePipeline 为应用程序创建 CI/CD 流水线。当 CodeCommit 存储库的主分支发生变化时，流水线必须自动启动。每天都会频繁发生变更，流水线必须尽可能地快速响应。\n\nDevOps 工程师应采取什么措施来达到这些要求？","o":[{"l":"A","t":"配置流水线定期检查存储库的主分支是否存在变更，在检测到变更时启动流水线。"},{"l":"B","t":"配置 Amazon EventBridge（Amazon CloudWatch Events）规则以检测存储库主分支的变更，配置流水线响应变更而启动。"},{"l":"C","t":"配置存储库定期运行 AWS Lambda 函数，由该函数检查存储库的主分支并在检测到变更时启动流水线。"},{"l":"D","t":"配置存储库在主分支发生变更时向 Amazon SNS 主题发布通知，并为流水线订阅该 SNS 主题。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** CodeCommit 的仓库事件会直接发布到 Amazon EventBridge，事件规则匹配主分支变更后，可把 CodePipeline 直接设为目标触发启动。变更产生事件、事件直启流水线，中间没有轮询间隔，是给定选项中响应最快的方式，也是官方推荐方案。\n\n**其他选项为什么错：**\n- A：定期检查能用，但不是事件驱动——变更要等下一次轮询才被发现，频繁变更下延迟不可控。\n- C：CodeCommit 不支持由存储库定期运行 Lambda 函数，该功能不存在。\n- D：SNS 通知不是启动流水线的有效途径，CodePipeline 不通过订阅 SNS 主题来启动。\n\n**关键概念：** 仓库变更 → EventBridge 规则 → 流水线启动，是 CI/CD 事件驱动触发的主流模式。","s":"官方样题#1"},{"id":"D1-002","d":1,"t":"single","q":"一家公司正在使用 AWS CodeBuild 构建应用程序。公司策略要求对所有构建工件进行静态加密，并且必须限制工件的访问权限——仅允许操作 IAM 组中有权承担操作 IAM 角色的 IAM 用户访问工件。\n\n哪一种解决方案符合这些要求？","o":[{"l":"A","t":"在 CodeBuild 构建规范中添加构建后命令，将构建工件推送到 Amazon S3 存储桶；设置存储桶策略，防止不含 x-amz-server-side-encryption 标头的请求上传到存储桶；为所有引用操作 IAM 组的 NotPrincipal 元素的操作添加 Deny 语句。"},{"l":"B","t":"在 CodeBuild 构建规范中添加构建后命令，将构建工件推送到 Amazon S3 存储桶；配置 S3 事件通知调用 AWS Lambda 函数，由该函数获取对象、加密后放回存储桶并打上加密标签；设置带 Deny 语句的存储桶策略，NotPrincipal 引用操作 IAM 组，并在条件元素中引用加密标签。"},{"l":"C","t":"在 CodeBuild 构建规范中增加构建后命令，将构建工件推送到启用了 S3 默认加密的 Amazon S3 存储桶；设置存储桶策略，对所有引用操作 IAM 角色的 NotPrincipal 元素的操作包含 Deny 语句。"},{"l":"D","t":"在 CodeBuild 构建规范中添加构建后命令，调用 AWS KMS Encrypt API 操作，将工件用指定的 KMS 密钥加密后推送到 Amazon S3 存储桶；将操作 IAM 组设置为该 KMS 密钥的唯一用户。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** S3 默认加密保证所有上传的对象静态加密，不需要额外的构建逻辑；存储桶策略用 NotPrincipal 指向操作 IAM 角色——只有能承担该角色的请求才被允许访问，其余全部拒绝。权限边界一次配置长期生效，正好对上「通过角色授权访问」的要求。\n\n**其他选项为什么错：**\n- A、B：存储桶策略引用的是 IAM 组而不是角色，与题干「IAM 组中能承担角色的用户访问」的授权模型不符。\n- A：AWS 建议使用默认加密，而不是用存储桶策略强制加密标头。\n- B：事件通知触发加密之间存在时间窗口，工件会短暂以未加密状态落盘。\n- D：KMS Encrypt API 适合加密明文值（如密码），不适合加密构建工件文件、归档或对象。\n\n**关键概念：** S3 默认加密 + 基于 IAM 角色的 NotPrincipal Deny，是制品仓库加密与访问控制的官方推荐组合。","s":"官方样题#3"},{"id":"D1-003","d":1,"t":"multiple","q":"一个 DevOps 工程师需要为 AWS 上的应用程序实施蓝/绿部署流程，必须逐步转移两个环境之间的流量。\n\n该应用程序运行在 Application Load Balancer（ALB）后面的 Amazon EC2 实例上，实例位于 Amazon EC2 Auto Scaling 组中。应用程序将数据存储在 Amazon RDS 多可用区数据库实例中，Amazon Route 53 提供外部 DNS。\n\nDevOps 工程师应采取哪一组步骤以符合这些要求？（请选择三项）","o":[{"l":"A","t":"在同一个 ALB 后面创建第二个 Auto Scaling 组。"},{"l":"B","t":"在第二个 ALB 后面创建第二个 Auto Scaling 组。"},{"l":"C","t":"在 Route 53 中创建指向新环境的第二个别名记录，使用故障转移路由策略在两条记录之间选择。"},{"l":"D","t":"在 Route 53 中创建指向新环境的第二个别名记录，使用加权路由策略在两条记录之间选择。"},{"l":"E","t":"配置新的 EC2 实例以使用主 RDS 数据库实例。"},{"l":"F","t":"配置新的 EC2 实例以使用备用 RDS 数据库实例。"}],"a":["B","D","E"],"e":"**正确答案：BDE。**\n\n**为什么对：** 蓝/绿部署由两个独立环境组成：蓝环境承载现网版本，绿环境承载新版本，各自挂在独立 ALB 后面。Route 53 用加权路由策略在两条别名记录之间逐步调整权重，即可把流量从蓝慢慢切到绿；两套环境都指向同一个主 RDS 数据库，保证割接期间数据一致。\n\n**其他选项为什么错：**\n- A：两个环境共用一个 ALB，就没有两个可被 Route 53 选择的终端节点，无法逐步转移。\n- C：故障转移路由只在健康检查失败时整体切换，做不到按权重渐进放量。\n- F：RDS 多可用区实例的备用库是热备，不接受读写。\n\n**关键概念：** 蓝/绿 = 双环境 + 加权 DNS 渐进切流 + 共享主库；备用实例不承载读写。","s":"官方样题#4"},{"id":"D1-004","d":1,"t":"single","q":"一家公司在公用 Application Load Balancer（ALB）后面的一组 Amazon EC2 实例上运行旧式 API。ALB 启用了访问日志并将日志存储在 Amazon S3 中。该 API 通过主机名 api.example.com 访问，Amazon Route 53 管理该主机名。\n\n开发人员用 AWS Lambda 函数重建了五个 API 终端节点。一位 DevOps 工程师想用有限的随机客户流量测试新 Lambda 函数的功能。为了确保与现有日志处理服务兼容，此次测试不能影响 ALB 访问日志。\n\nDevOps 工程师应如何执行此次测试以达到这些要求？","o":[{"l":"A","t":"将五个 Lambda 函数作为目标添加到 EC2 实例所在的现有目标组中，将每个 Lambda 目标在目标组中的权重设为低于 EC2 实例目标，并修改 ALB 的默认规则以启用目标组级粘性。"},{"l":"B","t":"创建单个目标组，包含全部 Lambda 函数作为目标。在 ALB 上创建带主机标头条件的侦听器规则匹配 API 终端节点的主机名，将目标组加入规则并设置比默认规则目标组更低的权重。"},{"l":"C","t":"为每个 Lambda 函数创建新的 ALB 和新目标组，创建带主机标头条件的侦听器规则转发流量；新建 Route 53 别名记录权重设为 10，把 api.example.com 的现有记录权重设为 90。"},{"l":"D","t":"为每个 Lambda 函数创建一个新的目标组。在 ALB 上创建带路径条件的侦听器规则匹配各终端节点，并在规则内对 Lambda 函数目标组与基于实例的目标组进行加权转发。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 加权分流只能在同一条侦听器规则内的多个目标组之间进行，这正对应金丝雀式小流量测试；五个终端节点各有自己的路径，用路径条件逐一区分。整个方案复用现有 ALB，访问日志仍由同一个 ALB 产生，与现有日志处理服务保持兼容。\n\n**其他选项为什么错：**\n- A、B：一个目标组只能注册一个 Lambda 函数，无法把五个函数放进同一个目标组。\n- A：目标组级粘性会抵消加权分流的小流量测试效果。\n- C：新建 ALB 会因新的负载均衡器 ID 产生不同的访问日志，破坏与现有日志处理的兼容；主机标头条件也做不了 URI 级别的分流。\n\n**关键概念：** ALB 侦听器规则内的加权目标组＝金丝雀测试；一个目标组只能注册一个 Lambda 函数。","s":"官方样题#9"},{"id":"D2-001","d":2,"t":"single","q":"一家公司在 Amazon EC2 实例上运行应用程序，实例使用最新版的 Amazon Linux 2 AMI。当服务器管理员应用新的安全补丁时，需手动将受影响的实例从服务中移除、打上补丁，再重新投入服务。\n\n新的安全政策要求公司在补丁发布后 7 天内应用安全补丁，安全团队必须能验证所有 EC2 实例是否符合补丁政策，修补必须在对用户影响最小的时间内完成。\n\n哪一种解决方案符合这些要求？","o":[{"l":"A","t":"配置一个 AWS CodeBuild 项目，通过 SSH 下载补丁并应用到所有实例；在维护窗口期间使用 Amazon EventBridge 计划规则运行该项目。"},{"l":"B","t":"使用 AWS Systems Manager 补丁管理器创建补丁基准；在 EC2 实例上创建脚本，用 AWS CLI 从补丁管理器拉取最新补丁，并创建 cron 任务安排脚本在维护窗口期间运行。"},{"l":"C","t":"创建脚本应用所有可用的安全补丁，用 cron 任务安排在维护窗口期间运行；把脚本和 cron 任务装进应用程序 AMI，重新部署应用。"},{"l":"D","t":"把所有 EC2 实例列入 AWS Systems Manager 补丁管理器的补丁组，使用补丁管理器创建补丁基准，配置维护窗口来应用补丁基准。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 补丁管理器是 Systems Manager 的功能：按补丁基准定义的批准列表，在维护窗口期间自动给补丁组内实例打补丁。安全团队可在控制台查看实例的补丁合规性，或用 CLI 拉取摘要——验证合规的要求直接满足。实例预先注册进补丁组，全程无需人工逐台操作，用户影响被限制在维护窗口内。\n\n**其他选项为什么错：**\n- A：CodeBuild 的职责是把源代码构建成工件，不是给实例部署补丁。\n- B：Amazon Linux 2 预装的 SSM Agent 本身就能接收补丁指令，不需要自建脚本加 cron 去拉补丁。\n- C：没有给安全团队提供验证补丁合规性的手段，且 cron 任务是单点故障。\n\n**关键概念：** 补丁基准 + 补丁组 + 维护窗口＝Systems Manager 补丁自动化三件套，合规性可直接出报告。","s":"官方样题#5"},{"id":"D3-001","d":3,"t":"multiple","q":"一个 DevOps 团队的应用程序在现有 Amazon S3 存储桶中存储公司关键资产，当前只使用单个 AWS 区域。新的公司策略要求把应用程序部署到多个区域，资产必须始终可用，且用户必须使用相同的终端节点访问资产。\n\n团队应该采取哪一组步骤，才能以最具运营效率的方式达到这些要求？（请选择三项）","o":[{"l":"A","t":"使用 AWS CloudFormation StackSets 在每个所需区域创建启用了版本控制的新 S3 存储桶，把资产从现有存储桶复制到新存储桶，并创建 AWS Lambda 函数把主区域新存储桶的新增文件复制到其他区域。"},{"l":"B","t":"使用 AWS CloudFormation StackSets 在每个所需区域创建启用了版本控制的新 S3 存储桶，在主区域的新存储桶上创建多条 S3 复制规则把全部内容复制到其他区域，并把资产从现有存储桶复制到主区域的新存储桶。"},{"l":"C","t":"创建 Amazon CloudFront 分配，为每个 S3 存储桶配置新的来源，创建包含全部新建来源的来源组，并把分配的默认行为更新为使用该来源组。"},{"l":"D","t":"创建 Amazon CloudFront 分配，为每个 S3 存储桶配置新的来源，创建一个 Lambda@Edge 函数验证来源可用性，并把查看器请求路由到附近的可用来源。"},{"l":"E","t":"创建 Amazon Route 53 别名记录，配置故障转移路由策略，使用新建的 S3 存储桶作为目标。"},{"l":"F","t":"创建 Amazon Route 53 别名记录，配置简单路由策略，把 Amazon CloudFront 分配作为目标。"}],"a":["B","C","F"],"e":"**正确答案：BCF。**\n\n**为什么对：** 这题分三段：多区域部署、单终端节点、DNS 处理。B 用 StackSets 高效地建多区域存储桶，S3 复制规则把主区域的新对象和现有对象复制到其他区域，不需要自写代码；C 用 CloudFront 来源组做源故障转移，让单个终端节点解析到多个来源；F 因为故障转移已由 CloudFront 源配置承担，Route 53 只需简单路由指向分配，提供用户友好域名。\n\n**其他选项为什么错：**\n- A：用 Lambda 自写复制逻辑，运营效率低于原生 S3 复制。\n- D：Lambda@Edge 自定义代码可行但运营效率低，源配置内已有原生故障转移处理。\n- E：只有一条记录可用时，故障转移路由没有意义。\n\n**关键概念：** 多区域＝StackSets + S3 复制；单终端节点＝CloudFront 来源组；DNS＝简单路由。","s":"官方样题#2"},{"id":"D3-002","d":3,"t":"single","q":"一个开发团队正在设计一个客户群分布在三个 AWS 区域的应用程序。为提供低延迟数据访问，应用程序要使用的 Amazon DynamoDB 表必须在三个区域都可用；当一个区域的表被更新时，变更必须无缝传播到其他区域。\n\nDevOps 工程师应该如何配置表，以最低的运营开销达到这些要求？","o":[{"l":"A","t":"在三个区域各创建一个 DynamoDB 表，给每个表取相同的名字。"},{"l":"B","t":"在三个区域分别创建三个 DynamoDB 表，使用 AWS SDK 编写同步逻辑在各表之间同步数据变更。"},{"l":"C","t":"配置一个覆盖三个区域的多区域多活动（multi-Region, multi-active）DynamoDB 全局表。"},{"l":"D","t":"使用 DynamoDB 全局表，在一个区域配置主表，在其他每个区域配置只读副本。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** DynamoDB 全局表从单区域表起步，可直接升级为多区域多活动表：每个区域都可读写，变更自动双向复制，各区域客户就近低延迟访问，全程无需配置或维护任何复制方案——运营开销最低。\n\n**其他选项为什么错：**\n- A：同名表之间没有任何复制关系，数据互不相通。\n- B：自写跨表同步流程是不必要的运营开销，还要自己处理冲突。\n- D：全局表是多区域多活动表，不存在「只读副本」形态，每个区域都是对等的读写端。\n\n**关键概念：** 全局表＝多区域多活动复制，AWS 托管、无主从之分。","s":"官方样题#8"},{"id":"D4-001","d":4,"t":"single","q":"一家公司在所有 AWS 账户上使用 AWS CloudTrail，并把所有跟踪记录发送到一个集中式 Amazon S3 存储桶。公司通过 S3 事件通知和 AWS Lambda 函数把指定事件发送到第三方日志工具。\n\n公司聘请了安全服务商搭建安全运营中心，服务商希望通过 Amazon SQS 队列接收 CloudTrail 日志。公司必须继续使用 S3 事件通知和 Lambda 函数向第三方工具发送事件。\n\n符合这些要求的最具运营效率的方式是什么？","o":[{"l":"A","t":"在 S3 存储桶中为所有对象创建事件再添加一条额外的通知，把所有对象发送到 SQS 队列。"},{"l":"B","t":"把现有 S3 事件通知目的地替换为 Amazon SNS 主题，将 Lambda 函数和 SQS 队列都订阅到该主题。"},{"l":"C","t":"把现有 S3 事件通知目的地替换为 Amazon Kinesis 数据流，为 Lambda 函数和 SQS 队列分别创建消费者。"},{"l":"D","t":"配置跟踪记录把日志发送到 Amazon CloudWatch Logs，把 SQS 队列订阅到 CloudWatch Logs 日志组。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** S3 事件通知对同一种事件只能配一个目的地，要向多个消费者扇出，标准做法是把通知目的地换成 SNS 主题：Lambda 函数和 SQS 队列分别订阅主题。原有 Lambda 链路照常工作，SQS 消费端即插即用，全程不需要改 Lambda 代码，运营效率最高。\n\n**其他选项为什么错：**\n- A：同一事件的前缀与后缀重叠，S3 会判为「配置定义不明确」而拒绝。\n- C：Kinesis 数据流不是 S3 事件通知的合法目的地。\n- D：SQS 队列不能直接订阅 CloudWatch Logs 日志组，方案不成立。\n\n**关键概念：** S3 通知单目的地限制 → SNS 扇出是接入多消费者的标准解法。","s":"官方样题#6"},{"id":"D4-002","d":4,"t":"multiple","q":"一位 DevOps 工程师在 AWS 上管理一个旧式单体 Windows 应用程序，它运行在单个 Amazon EC2 实例上。应用程序的源代码不可用，无法修改应用。应用存在内存泄漏，当实例内存利用率超过 90% 时就会故障。工程师已在实例上配置统一的 Amazon CloudWatch 代理，收集操作系统的内存利用率指标。\n\n工程师需要实施一个方案防止应用程序故障。哪一组步骤能以最高的运营效率达到要求？（请选择两项）","o":[{"l":"A","t":"创建 Amazon EventBridge 规则，在内存利用率超过 80% 时把事件发布到 Amazon SNS 主题。"},{"l":"B","t":"在 Amazon CloudWatch Logs 中为内存利用率日志创建指标过滤器，在过滤器上创建 CloudWatch 告警，配置告警在内存利用率超过 80% 时发布到 SNS 主题。"},{"l":"C","t":"在内存利用率指标上创建 CloudWatch 告警，配置告警在内存利用率超过 80% 时发布到 SNS 主题。"},{"l":"D","t":"配置 AWS Lambda 函数，通过 AWS Systems Manager Run Command 重启应用程序；把该 Lambda 函数订阅到 SNS 主题。"},{"l":"E","t":"配置 EC2 实例运行重启应用程序的脚本，并把 EC2 实例订阅到 SNS 主题。"}],"a":["C","D"],"e":"**正确答案：CD。**\n\n**为什么对：** 统一 CloudWatch 代理已把系统级指标发布为 CloudWatch 指标，可直接在指标上建告警，不需要再从日志里造指标；SNS 主题接到告警后，订阅它的 Lambda 函数可通过 Systems Manager Run Command 向实例下发重启命令——源代码不可改也能自动恢复。\n\n**其他选项为什么错：**\n- A：CloudWatch 告警可以直接通知 SNS，多套一层 EventBridge 规则是多余环节，运营效率更低。\n- B：系统级指标已由代理发布，基于日志的指标过滤器属于重复建设。\n- E：EC2 实例不是 SNS 的合法订阅端点，实例无法「订阅」主题。\n\n**关键概念：** 代理指标直接建告警；SNS → Lambda → Run Command 是免改应用的标准自愈链路。","s":"官方样题#10"},{"id":"D6-001","d":6,"t":"single","q":"一家公司的工作人员分布在不同国家，公司希望监控 AWS 账户中与 IAM 身份相关的异常行为，并向发现异常活动的工作人员及其团队负责人发送通知。通知由外部消息平台发送，该平台要求每个收件人都有一个目标用户 ID。\n\n公司在 AWS 上已有一个 API，可通过 IAM 用户名查询工作人员与团队负责人的用户 ID；公司通过 AWS Organizations 管理 AWS 账户。\n\n哪一种解决方案符合这些要求？","o":[{"l":"A","t":"在企业中指定一个账户作为 Amazon GuardDuty 管理员，把公司 AWS 账户添加为关联的 GuardDuty 成员账户；创建 AWS Lambda 函数执行用户 ID 查询并向外部平台发送通知；在 GuardDuty 管理员账户中创建 Amazon EventBridge 规则，匹配 Impact:IAMUser/AnomalousBehavior 通知类型并调用该函数。"},{"l":"B","t":"在企业中指定一个账户作为 Amazon Detective 管理员，把公司 AWS 账户作为关联的 Detective 成员账户；创建 AWS Lambda 函数执行用户 ID 查询并向外部平台发送通知；在 Detective 管理员账户中创建 Amazon EventBridge 规则，匹配 Impact:IAMUser/AnomalousBehavior 通知类型并调用该函数。"},{"l":"C","t":"在企业中指定一个账户作为 Amazon GuardDuty 管理员，把公司 AWS 账户添加为关联的 GuardDuty 成员账户；创建 AWS Lambda 函数执行用户 ID 查询并向外部平台发送通知；在 GuardDuty 管理员账户中创建 Amazon SNS 主题，按 Impact:IAMUser/AnomalousBehavior 通知类型筛选消息并调用该函数。"},{"l":"D","t":"在企业中指定一个账户作为 Amazon Detective 管理员，把公司 AWS 账户作为关联的 Detective 成员账户；创建 AWS Lambda 函数执行用户 ID 查询并向外部平台发送通知；在管理员账户中创建 Amazon SNS 主题，按 Impact:IAMUser/AnomalousBehavior 通知类型筛选消息并调用该函数。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 监控 IAM 异常行为要用 GuardDuty：它的发现结果会作为事件发布到 EventBridge，规则按发现类型（Impact:IAMUser/AnomalousBehavior）匹配后可直接把 Lambda 设为目标，由函数查 API 得到用户 ID 并推送外部平台。多账户场景下，用管理员/成员关联把各账户发现集中到管理员账户统一处理，与 Organizations 结构天然配合。\n\n**其他选项为什么错：**\n- B、D：Detective 本身不产生异常检测，它只对已有发现提供分析与可视化。\n- C、D：SNS 按消息属性筛选，不能按消息内容匹配发现类型；要用 EventBridge 规则匹配后再转发。\n\n**关键概念：** GuardDuty 出发现 → EventBridge 按类型路由 → Lambda 定制通知；Detective 只做分析不做检测。","s":"官方样题#7"},{"id":"D1-005","d":1,"t":"single","q":"一家公司的 DevOps 团队要为软件交付流程引入自动化：开发人员每次提交代码后，系统自动执行单元测试与代码扫描，全部通过后自动构建容器镜像并推送镜像仓库。\n\n这套自动化主要覆盖 SDLC 的哪两个阶段？","o":[{"l":"A","t":"编码与发布"},{"l":"B","t":"构建与测试"},{"l":"C","t":"测试与运维"},{"l":"D","t":"计划与编码"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 提交后自动跑单元测试与代码扫描属于测试阶段；全部通过后构建镜像并推送镜像仓库属于构建阶段。这两个动作都发生在代码提交与发布之间，对应的自动化工具正是 CodeBuild 与流水线的测试、构建阶段。\n\n**其他选项为什么错：**\n- A：发布指把版本部署到生产环境，题干动作还没有走到发布。\n- C：运维阶段是系统上线后的监控与维护，与提交后的动作无关。\n- D：编码是开发人员写代码本身，计划是需求与方案阶段，都不在提交之后发生。\n\n**关键概念：** SDLC 判断法——先判断动作属于哪个阶段，再选自动化工具，方向就不会错。","s":"自编·1.1.1"},{"id":"D1-006","d":1,"t":"single","q":"一家公司采用多账号布局：开发、测试、生产各一个账号，CI/CD 流水线集中在工具账号。\n\n关于这种布局，下列说法正确的是？","o":[{"l":"A","t":"每个环境账号都应各自搭建流水线，让构建凭据分散在各账号，更安全。"},{"l":"B","t":"流水线应随环境复制三条，每条只部署自己的环境，才能实现权限隔离。"},{"l":"C","t":"一条流水线串多个阶段，各阶段使用对应目标账号的角色执行部署；生产账号不持有源码与构建凭据，爆炸半径更小。"},{"l":"D","t":"工具账号的流水线可以直接使用生产账号 IAM 用户的长期访问密钥完成部署。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 多账号布局的要点是流水线本身不随环境复制——一条流水线的每个阶段用对应目标账号的 IAM 角色执行部署。源码与构建凭据留在工具账号，生产账号只暴露必要的部署角色，权限边界小、爆炸半径小。\n\n**其他选项为什么错：**\n- A：凭据分散恰恰扩大了泄露面，与「收敛凭据」的目标相反。\n- B：复制三条流水线要维护三份配置，也没有解决凭据收敛问题。\n- D：长期访问密钥是 IAM 安全红线，跨账号部署应该用 IAM 角色而不是密钥。\n\n**关键概念：** 流水线集中 + 跨账号角色，是多账号 CI/CD 的主流形态。","s":"自编·1.1.2"},{"id":"D1-007","d":1,"t":"single","q":"一家公司的容器回滚频繁出问题：回滚后运行的镜像不是预期版本。排查发现，同名镜像标签每次构建都会被新镜像覆盖，回滚依据的标签内容已经变了。\n\n为从根本上消除这个隐患，最直接的措施是？","o":[{"l":"A","t":"在 Amazon ECR 开启不可变标签（image tag immutability），并配置生命周期策略自动清理过期镜像。"},{"l":"B","t":"要求每次发布前人工核对镜像摘要（digest）。"},{"l":"C","t":"关闭 ECR 仓库的跨账号访问权限。"},{"l":"D","t":"把镜像改存到 Amazon S3，用对象版本控制替代镜像仓库。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 不可变标签让同名标签一旦推送就不可覆盖——任何重复推送直接失败，标签永远指向同一个镜像内容，回滚依据从此可靠。生命周期策略配合清理过期层与旧镜像，把存储成本一并管住。\n\n**其他选项为什么错：**\n- B：人工核对治标不治本，靠自觉的流程迟早会漏。\n- C：跨账号访问与标签覆盖无关，关掉不解决问题还破坏部署链路。\n- D：镜像仓库的职责 ECR 已原生承担，搬到 S3 失去镜像管理能力。\n\n**关键概念：** 不可变标签是镜像仓库的生产必备配置；生命周期策略管成本。","s":"自编·1.1.3"},{"id":"D1-008","d":1,"t":"single","q":"一支团队用环境分支模式发布：改动先合到 test 分支部署测试环境，发布时再手工把提交摘樱桃（cherry-pick）到 main。团队计划一天多次发布，自动化测试已经成熟，且分支合并冲突越来越频繁。\n\n最匹配的分支策略调整是？","o":[{"l":"A","t":"继续环境分支模式，但提高每个分支的合并频率。"},{"l":"B","t":"改用 Gitflow 长期分支，为每个功能建立长期分支。"},{"l":"C","t":"改为主干开发（trunk-based）：小步提交主干，发布时拉 release 分支或打标签，配合特性开关（feature flag）控制功能露出。"},{"l":"D","t":"取消分支，所有提交直接推到生产环境。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 一天多次发布加测试自动化成熟，正是主干开发的适用条件：合并冲突少、发布依据唯一（标签），环境不一致从源头消失；功能露出控制交给特性开关，发布节奏与功能完整性解耦。\n\n**其他选项为什么错：**\n- A：环境分支的冲突与摘樱桃问题不会因提高频率而缓解，只会更频繁地暴露。\n- B：长期分支让冲突更多、分支更容易腐化，方向正好相反。\n- D：没有任何闸门直接上生产，审查与回滚能力全无。\n\n**关键概念：** 发布节奏与测试成熟度决定分支模式——考试给的约束决定选项。","s":"自编·1.1.4"},{"id":"D1-009","d":1,"t":"single","q":"一家公司要求：只有合并到 main 分支的变更才触发生产流水线，feature 分支的推送一律不触发。Webhook 推送对任何分支变更都会触发，无法按这种条件过滤。\n\n应采用哪种方式落地这个要求？","o":[{"l":"A","t":"保留 Webhook，由流水线第一步人工判断分支后取消执行。"},{"l":"B","t":"改用定时轮询存储库，每小时检查一次 main 分支。"},{"l":"C","t":"在构建脚本内部轮询判断分支名。"},{"l":"D","t":"用 Amazon EventBridge 规则监听仓库事件，按事件内容中的分支名过滤后再触发流水线。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** EventBridge 规则支持按事件内容过滤——事件模式里可以指定分支与事件类型，只有匹配条件的仓库事件才会触发流水线。按事件类型过滤正是它与 Webhook 的分工点：默认低延迟选 Webhook，需要按条件过滤选 EventBridge。\n\n**其他选项为什么错：**\n- A：人工判断违背自动化初衷，触发后取消还要白跑一轮。\n- B：轮询延迟以小时计，频繁变更下响应太慢。\n- C：构建脚本里的判断发生在触发之后，不触发的目标根本没跑起来，逻辑不成立。\n\n**关键概念：** Webhook 管低延迟推送，EventBridge 规则管按事件类型过滤。","s":"自编·1.1.4"},{"id":"D1-010","d":1,"t":"single","q":"一条 CodeBuild 流水线总时长 12 分钟，其中 9 分钟花在安装依赖上，一天要跑几十次。\n\n在不增加人工维护负担的前提下，见效最快的优化是？","o":[{"l":"A","t":"把计算规格调大一档，缩短整体构建时长。"},{"l":"B","t":"把依赖目录（如 node_modules）配置进 buildspec 的 cache 段，让缓存跨构建复用。"},{"l":"C","t":"全部改用 Spot 容量运行构建。"},{"l":"D","t":"迁移到自维护的 Jenkins 集群。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 依赖安装占了 9/12 分钟，cache 段把依赖目录放进 S3 或构建机本地缓存后，命中即跳过安装——实测场景能把 12 分钟压到 4 分钟左右，改一行配置就生效，没有额外维护负担。\n\n**其他选项为什么错：**\n- A：加大规格只加速安装过程本身，重复工作还在；总成本＝单价×时长，盲目加大反而更贵。\n- C：Spot 降的是单价不是时长，还有被中断的风险，要配重试。\n- D：Jenkins 带来的是更大的运维负担，方向相反。\n\n**关键概念：** 构建优化的顺序永远是：先砍重复工作，再谈加资源。","s":"自编·1.1.5"},{"id":"D1-011","d":1,"t":"multiple","q":"关于 AWS CodeBuild 的 buildspec 文件结构，下列哪两项分别决定「密钥注入方式」与「产物输出位置」？（请选择两项）","o":[{"l":"A","t":"env 段——声明环境变量，支持从 Secrets Manager 与 Parameter Store 注入密钥。"},{"l":"B","t":"phases 段——install、pre_build、build、post_build 四个阶段的命令。"},{"l":"C","t":"artifacts 段——定义产物输出位置与文件模式。"},{"l":"D","t":"cache 段——配置缓存路径供构建机之间复用。"},{"l":"E","t":"reports 段——配置测试报告的输出。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** env 段的 secrets-manager 与 parameter-store 子段把密钥直接注入构建环境变量，不经过日志，是密钥进入构建环境的正规入口；artifacts 段定义构建产物输出到哪里、按什么文件模式收口——一个管输入的密钥、一个管输出的产物，正好对应题干两个要求。\n\n**其他选项为什么错：**\n- B：phases 管命令执行顺序，与注入和输出无关。\n- D：cache 管构建提速，不是密钥或产物职责。\n- E：reports 管测试报告呈现，同样不对应题干要求。\n\n**关键概念：** buildspec 四段分工——env 注入、phases 执行、artifacts 输出、cache 提速。","s":"自编·1.1.5"},{"id":"D1-012","d":1,"t":"single","q":"一家公司的流水线要使用一套数据库凭据。安全团队要求：凭据必须每 90 天自动轮换，且读写要有集中审计。\n\n选择哪个托管服务最贴合要求？","o":[{"l":"A","t":"AWS Secrets Manager——原生支持轮换（内置 Lambda 轮换模板），默认加密，审计集中。"},{"l":"B","t":"AWS Systems Manager Parameter Store 标准参数——免费存储，直接够用。"},{"l":"C","t":"把凭据写进 buildspec 的明文环境变量。"},{"l":"D","t":"把凭据存在 Amazon S3，用存储桶策略限制访问。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 「要轮换、要集中审计」正是 Secrets Manager 的适用条件：内置 Lambda 轮换模板支持数据库凭据按计划自动轮换，默认加密、读写审计集中，两个要求都是原生能力，不用自己写代码。\n\n**其他选项为什么错：**\n- B：Parameter Store 无原生轮换，90 天自动轮换要自行实现，不满足要求。\n- C：明文环境变量踩「密钥不进明文」红线，出现即排除。\n- D：S3 不是密钥管理服务，无轮换、无密钥级审计。\n\n**关键概念：** 要轮换选 Secrets Manager；只是配置项、数量大、预算敏感选 Parameter Store。两者不互斥。","s":"自编·1.1.6"},{"id":"D1-013","d":1,"t":"single","q":"一条流水线的 buildspec 用 env 段从 Secrets Manager 注入密钥，构建报访问被拒。CodeBuild 项目角色已授予 secretsmanager:GetSecretValue 权限，密钥使用客户托管的 KMS 密钥加密。\n\n按最小权限原则，下一步应补什么？","o":[{"l":"A","t":"给项目角色附加 AdministratorAccess，一劳永逸。"},{"l":"B","t":"把密钥改成明文 Parameter Store 参数，绕过加密。"},{"l":"C","t":"在 buildspec 命令里硬编码密钥。"},{"l":"D","t":"给项目角色追加该 KMS 密钥的 kms:Decrypt 权限。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 密钥用客户托管 KMS 密钥加密时，完整读取链路是「角色有权读密钥 + 角色有权解密」，两者缺一不可——只给 secretsmanager:GetSecretValue 还解不开密文。追加该密钥的 kms:Decrypt 后链路闭环，且范围只限这一把密钥，符合最小权限。\n\n**其他选项为什么错：**\n- A：管理员权限让爆炸半径失控，违背最小权限原则。\n- B：绕过加密直接违反安全要求。\n- C：硬编码密钥踩「密钥不进代码」红线。\n\n**关键概念：** KMS 加密密钥的读取链＝GetSecretValue + kms:Decrypt，缺一报访问被拒。","s":"自编·1.1.6"},{"id":"D1-014","d":1,"t":"single","q":"一个 AWS Lambda 应用要升级。业务要求：先放一小部分流量验证，逐步放量到 100%，期间发现问题能在几分钟内回到旧版本。\n\n使用 AWS CodeDeploy 部署，最贴合的配置是？","o":[{"l":"A","t":"Canary10Percent5Minutes——先让 10% 流量走 5 分钟，验证通过后逐步放量，失败即回滚。"},{"l":"B","t":"AllAtOnce——一次性全量切换。"},{"l":"C","t":"Linear10PercentEvery1Minutes——每分钟均匀增加 10% 流量。"},{"l":"D","t":"EC2 蓝/绿部署策略。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 金丝雀（Canary）先给小比例流量观察再放量，Canary10Percent5Minutes 的「10%、5 分钟」正是小流量验证窗口；期间发现异常，CodeDeploy 自动把流量切回旧版本，回滚以分钟计，正对业务要求。\n\n**其他选项为什么错：**\n- B：全量切换没有小流量验证窗口，出问题就是全部用户受影响。\n- C：线性放量是均匀爬坡，没有「先小流量集中观察」的语义。\n- D：蓝绿是 EC2/本地平台的策略，不适用于 Lambda 计算平台。\n\n**关键概念：** Lambda 平台两种策略——Canary 与 Linear；要「先小流量验证」选 Canary。","s":"自编·1.1.7"},{"id":"D1-015","d":1,"t":"multiple","q":"一个团队在 Amazon ECS 上用 AWS CodeDeploy 实施蓝绿部署。\n\n关于 ECS 蓝绿部署的机制，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"新版本以新 TaskSet 启动，验证通过后由生产流量监听器把流量切到新 TaskSet。"},{"l":"B","t":"切流期间旧 TaskSet 保留，出现异常可快速回滚到旧版本。"},{"l":"C","t":"ECS 蓝绿部署需要先手动停止旧服务，再启动新服务接管流量。"},{"l":"D","t":"ECS 蓝绿部署只能用于 Lambda 计算平台。"},{"l":"E","t":"切流完成后旧 TaskSet 立即销毁，无法再回滚。"}],"a":["A","B"],"e":"**正确答案：AB。**\n\n**为什么对：** ECS 蓝绿的核心机制是新旧两套 TaskSet 并存：新 TaskSet 启动并验证后，生产流量监听器执行切流；旧 TaskSet 在观察期内保留，异常时把监听器切回即完成回滚。「回滚快」的前提正是「旧环境还在」。\n\n**其他选项为什么错：**\n- C：先停旧再启新是停机部署，与蓝绿「新旧并存」的机制相反。\n- D：CodeDeploy 的 ECS 蓝绿针对 ECS 平台；Lambda 平台用的是 Canary/Linear。\n- E：旧 TaskSet 的销毁时机由部署配置决定，「立即销毁」不是蓝绿的默认行为，销毁时机也不会抹掉观察期内的回滚能力。\n\n**关键概念：** 蓝绿＝新旧并存切流量；回滚快的前提是旧环境仍在。","s":"自编·1.1.7"},{"id":"D1-016","d":1,"t":"single","q":"一家公司的构建需要同时使用公司私有 npm 包与 npm 公共仓库的开源包。团队希望不把公共包全量拷贝进公司仓库，又能统一管控依赖下载。\n\n最合适的托管服务是？","o":[{"l":"A","t":"Amazon ECR——配置上游仓库代理 npm 包。"},{"l":"B","t":"AWS CodeArtifact——创建域与仓库，配置上游仓库代理公共 npm 仓库，私有包与公共依赖统一收口。"},{"l":"C","t":"AWS CodeCommit——把依赖包文件存进代码仓库。"},{"l":"D","t":"Amazon S3——手动上传公共包做备份。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** CodeArtifact 是制品仓库服务：域与仓库层级管私有包，上游仓库（upstream repository）直接代理公共 npm 仓库——构建时统一从 CodeArtifact 拉取，公共包按需经上游缓存，私有包集中管控权限，正是「不拷贝 + 统一收口」的答案。\n\n**其他选项为什么错：**\n- A：ECR 管容器镜像，不代理 npm 依赖包。\n- C：CodeCommit 是代码仓库，不是依赖包仓库，也没有上游代理能力。\n- D：手动上传备份没有版本解析与权限管控，运营负担大。\n\n**关键概念：** CodeArtifact＝依赖包仓库；上游代理让公共包按需缓存，无需全量拷贝。","s":"自编·1.1.3"},{"id":"D1-017","d":1,"t":"single","q":"一家公司的测试团队在梳理自动化测试体系：有的测试验证单个函数的行为，不依赖任何外部服务；有的测试要把多个组件连起来、访问真实的数据库才能跑；还有的测试驱动浏览器模拟用户操作。团队想按「快慢与成本」给测试分类，再决定各自的运行时机。\n\n其中「验证单个函数、不依赖外部服务」的测试属于哪一类？","o":[{"l":"A","t":"集成测试——需要真实依赖服务，比单元测试慢一个量级。"},{"l":"B","t":"单元测试——验证单个函数或类的行为，跑得最快、成本最低。"},{"l":"C","t":"验收测试——站在用户视角验证整个功能是否符合业务预期。"},{"l":"D","t":"UI 测试——驱动浏览器或客户端界面，验证页面操作流程。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 「单个函数 + 不依赖外部服务」正是单元测试的定义特征——不碰数据库、不碰网络，几十秒出结果，是所有测试里跑得最快、成本最低的一层，适合挂在每次提交。\n\n**其他选项为什么错：**\n- A：集成测试恰恰要访问真实数据库等外部依赖，与题干「不依赖外部服务」相反。\n- C：验收测试验证整个功能是否符合业务预期，粒度远大于单个函数。\n- D：UI 测试驱动界面操作，是题干里的第三类，不是函数级验证。\n\n**关键概念：** 测试分类先看两个维度——验证粒度（函数/组件/功能/界面）与外部依赖（有没有真实服务）。","s":"自编·1.2.1"},{"id":"D1-018","d":1,"t":"single","q":"一支团队为电商下单流程编写自动化测试：一类测试直接调用下单函数验证金额计算逻辑；另一类测试必须连接真实的订单数据库与消息队列，验证下单、扣库存、发通知三个组件连起来的行为。负责人要求把第二类测试放到合并之后的环节跑，不要挂在每次提交上。\n\n第二类测试属于哪一类？这样安排的原因是？","o":[{"l":"A","t":"单元测试——不依赖外部服务，其实完全可以挂在每次提交上跑。"},{"l":"B","t":"验收测试——站在用户视角验证业务预期，应放在部署前环境。"},{"l":"C","t":"UI 测试——驱动界面操作，天然需要数据库配合。"},{"l":"D","t":"集成测试——需要真实数据库与依赖服务，比单元测试慢一个量级，挂在合并之后。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 「连接真实数据库与消息队列、验证多个组件连起来的行为」是集成测试的定义特征；它需要真实依赖、比单元测试慢一个量级，挂在合并之后既保证了提交阶段的反馈速度，又让组件级问题在推进环境前暴露。\n\n**其他选项为什么错：**\n- A：单元测试不依赖外部服务，与题干「必须连接真实数据库」矛盾。\n- B：验收测试站在用户视角验证业务预期，题干验证的是组件协作，不是业务功能。\n- C：UI 测试驱动界面操作，题干没有涉及任何界面。\n\n**关键概念：** 集成测试的两个标志——真实依赖服务、多组件协作；运行时机＝合并之后。","s":"自编·1.2.1"},{"id":"D1-019","d":1,"t":"single","q":"一家公司的 Web 应用测试套件越来越难维护：其中一批测试通过自动化脚本驱动浏览器点击页面、填写表单、验证跳转流程，前端只要改一个按钮位置，这批测试就大面积失败。团队在讨论这批测试的定位与维护策略。\n\n这批测试属于哪一类？它最显著的特点是？","o":[{"l":"A","t":"UI 测试——驱动界面操作验证页面流程，脆、慢、维护成本高。"},{"l":"B","t":"单元测试——验证函数行为，运行快且不受界面改动影响。"},{"l":"C","t":"集成测试——验证组件连接，与浏览器界面的 DOM 结构无关。"},{"l":"D","t":"压力测试——持续加压寻找系统崩溃点，对界面改动不敏感。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 驱动浏览器点击、填表、验证跳转，就是 UI 测试的标准形态；正文对它的定性是「脆、慢、维护贵」——界面稍变就失败，正是题干里「改一个按钮位置就大面积失败」的原因。\n\n**其他选项为什么错：**\n- B：单元测试验证函数行为，根本不碰浏览器。\n- C：集成测试验证组件间调用，不依赖界面元素定位。\n- D：压力测试打流量找崩溃点，与页面操作完全无关。\n\n**关键概念：** UI 测试的定位——放在部署前环境少量跑，不挂在每次提交；界面易变性决定了它不适合做高频关卡。","s":"自编·1.2.1"},{"id":"D1-020","d":1,"t":"multiple","q":"一家公司的安全团队要求把安全扫描集成进 CI/CD 流水线：既要在代码提交阶段发现代码缺陷与依赖漏洞，也要在部署前发现运行中应用暴露的问题。开发团队对两类扫描的分工不清楚，需要在评审前统一认知。\n\n关于安全扫描在流水线中的实践，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"静态应用安全测试（SAST）在提交阶段扫描代码本身，能在编码早期发现缺陷与依赖漏洞。"},{"l":"B","t":"动态应用安全测试（DAST）针对运行中的应用扫描，通常放在部署前的环境执行。"},{"l":"C","t":"静态扫描必须等应用部署完成后才能执行，否则没有扫描对象。"},{"l":"D","t":"动态扫描只分析源代码文本，不需要应用处于运行状态。"},{"l":"E","t":"安全扫描只需在年度合规审计时执行一次，不必进入流水线。"}],"a":["A","B"],"e":"**正确答案：AB。**\n\n**为什么对：** 安全扫描两头都放是正文给的标准形态——提交时扫代码（SAST，静态扫源码与依赖），部署前扫运行中的应用（DAST，动态探测真实运行行为）。两个选项正好对应「扫什么」与「什么时候扫」。\n\n**其他选项为什么错：**\n- C：静态扫描的对象就是源代码，提交阶段就有，不需要等部署。\n- D：说反了——动态扫描针对运行中的应用，静态扫描才是只分析代码文本。\n- E：安全扫描进流水线就是为了每次变更都有把关，一年一次等于没有防线。\n\n**关键概念：** SAST 扫代码、DAST 扫运行中的应用；提交与部署前两头都放。","s":"自编·1.2.2"},{"id":"D1-021","d":1,"t":"single","q":"一家公司的流水线按「提交→合并→部署测试环境→部署生产」组织。安全负责人要求：提交阶段就能发现代码里的安全缺陷，部署前还能对运行中的应用做一轮动态检查。平台团队需要把两类扫描挂到正确的环节上。\n\n两类扫描分别应该挂在哪个环节？","o":[{"l":"A","t":"静态扫描（SAST）挂提交阶段，动态扫描（DAST）挂部署前环境——静态扫代码、动态扫运行中的应用。"},{"l":"B","t":"静态扫描挂部署前、动态扫描挂提交——扫描越晚发现，修复成本越低。"},{"l":"C","t":"两类都挂在生产环境运行时——真实流量下发现的问题最准确。"},{"l":"D","t":"两类都只在合并后跑一次——减少对提交反馈速度的影响。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 静态扫描的对象是代码本身，提交阶段代码就存在，越早扫越早发现缺陷；动态扫描需要应用运行起来才有探测对象，挂在部署前环境正合适。「便宜的越早、贵的越后」在安全扫描上同样成立。\n\n**其他选项为什么错：**\n- B：把两类扫描的时机正好写反了。\n- C：生产环境运行时扫描来不及——缺陷已经上线；动态扫描的位置在部署前而不是生产。\n- D：安全缺陷多留一个环节就多一分上线风险，且提交阶段扫描并不拖慢合并后的流程。\n\n**关键概念：** 安全扫描的两头放位——SAST 在提交、DAST 在部署前。","s":"自编·1.2.2"},{"id":"D1-022","d":1,"t":"single","q":"一个团队的 PR 检查项要跑 40 分钟才能出结果，开发人员抱怨评审被拖慢。排查发现：PR 触发的检查里不仅跑了单元测试，还把驱动浏览器的 UI 测试和需要真实数据库的集成测试一并跑了。团队要在守住质量底线的前提下加快 PR 反馈。\n\n最合理的调整是？","o":[{"l":"A","t":"保持现状——PR 上跑的测试越全越保险，慢一点可以接受。"},{"l":"B","t":"PR 阶段只保留单元测试与 lint 这类快速检查，UI 与集成测试移到合并之后跑——便宜的测试早跑、贵的测试后跑。"},{"l":"C","t":"取消 PR 阶段的所有自动化检查，全部依赖合并后的流水线把关。"},{"l":"D","t":"把 PR 检查改成人工执行，由评审人手动跑完测试再点合并。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 分层原则就是「越便宜的测试越早跑、跑得越频繁」：PR 阶段要的是几分钟内的快速反馈，只留单元测试与 lint；UI 与集成测试脆且慢，挂在合并后跑——既有质量关卡，又不拖死评审。\n\n**其他选项为什么错：**\n- A：40 分钟的 PR 检查已经实质拖慢交付，「保险」的代价是开发人员开始绕过流程。\n- C：取消 PR 关卡等于放弃「合并前挡质量」，问题会推迟到合并后才暴露。\n- D：人工执行不可重复、不可审计，倒退回手工作坊。\n\n**关键概念：** PR 挡质量用快测试，合并管流动用重测试。","s":"自编·1.2.2"},{"id":"D1-023","d":1,"t":"single","q":"一家公司的流水线长期全绿：每次提交的单元测试全部通过，但线上频繁出现「组件之间调用失败」的事故——服务 A 调服务 B 的接口参数对不上，单元测试根本测不出来。团队复盘测试体系的覆盖缺口。\n\n缺的是哪一层测试？应该挂在哪个环节？","o":[{"l":"A","t":"缺单元测试——把函数级断言写得更细，继续挂在提交阶段。"},{"l":"B","t":"缺 UI 测试——用浏览器自动化验证页面流程，挂在部署前环境。"},{"l":"C","t":"缺安全扫描——对运行中的应用做动态探测，挂在部署前环境。"},{"l":"D","t":"缺集成测试——验证多个组件连起来的行为，挂在合并之后的环境里跑。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 「单元测试全过、组件之间调用还是出事」是集成测试缺位的典型症状——单元测试各自验证函数，测不出接口参数对不上这类组件协作问题；补集成测试并挂在合并之后，正好在推进环境前拦截。\n\n**其他选项为什么错：**\n- A：单元测试已经在跑且全绿，问题不在函数级粒度。\n- B：UI 测试验证页面流程，接口参数对不上与界面无关。\n- C：安全扫描查漏洞与缺陷，不验证组件间调用正确性。\n\n**关键概念：** 「测试全绿但线上出事」先问缺了哪一层——组件协作问题找集成测试。","s":"自编·1.2.2"},{"id":"D1-024","d":1,"t":"single","q":"一个 SaaS 团队即将发布「批量导出」新功能。产品负责人要求：发布到生产之前，必须站在用户视角完整验证这个功能是否符合业务预期——导出格式、字段完整性、权限限制都要过一遍。团队要把这个验证环节自动化并挂进流水线。\n\n这个验证属于哪类测试？挂在哪个环节最合适？","o":[{"l":"A","t":"验收测试——验证功能是否符合业务预期，挂在部署生产前的环境中执行。"},{"l":"B","t":"单元测试——验证导出函数的输入输出，挂在每次提交。"},{"l":"C","t":"集成测试——验证导出服务与存储组件的连接，挂在合并之后。"},{"l":"D","t":"性能基线测试——对比导出接口的响应指标，挂在每季度压测。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 「站在用户视角验证功能是否符合业务预期」就是验收测试的定义；它验证的是完整功能行为而不是代码单元，需要在接近真实的环境里跑，挂在部署生产前是标准位置——过了验收才准上生产。\n\n**其他选项为什么错：**\n- B：单元测试是函数粒度，验证不了「格式、字段、权限」这类业务预期。\n- C：集成测试验证组件连接行为，不回答「功能符不符合业务要求」。\n- D：性能基线管快慢与吞吐，不管业务正确性。\n\n**关键概念：** 验收测试＝业务预期视角，位置＝部署生产前的最后一道功能关卡。","s":"自编·1.2.2"},{"id":"D1-025","d":1,"t":"multiple","q":"一家公司正在为新建的流水线设计测试分层。平台架构师给团队讲完分层原则后，成员复述时出现了几种不同说法，需要在评审前统一口径。\n\n关于测试分层与运行时机的原则，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"把 UI 测试挂在每次提交——测试越早发现越好，运行成本不是考虑因素。"},{"l":"B","t":"越便宜的测试越早跑、跑得越频繁——单元测试挂在每次提交，几十秒出结果。"},{"l":"C","t":"把所有类型的测试都堆进 PR 检查——一次跑完最省事。"},{"l":"D","t":"把贵的测试放在便宜的测试后面——流水线失败时能最快定位到问题层。"},{"l":"E","t":"单元测试应该挂在生产部署前——因为它最可靠，放在最后把关。"}],"a":["B","D"],"e":"**正确答案：BD。**\n\n**为什么对：** 分层原则就两句话：越便宜的测试越早跑、跑得越频繁（单元测试挂提交）；贵的测试放在便宜的后面（失败时先排除便宜层，最快定位到问题层）。两条合起来就是「这个测试该放哪一环」的判断依据。\n\n**其他选项为什么错：**\n- A：UI 测试脆、慢、维护贵，恰恰不该挂每次提交。\n- C：全部堆进 PR 会让检查拖到几十分钟，评审被拖死。\n- E：单元测试是最快的一层，放最后等于让最便宜的测试占最贵的时机，方向反了。\n\n**关键概念：** 成本决定位置——快测试前置、重测试后置。","s":"自编·1.2.2"},{"id":"D1-026","d":1,"t":"single","q":"一家公司要求「PR 必须全绿才能合并」：每个 PR 打开或更新时自动跑单元测试与代码扫描，结果直接显示在 PR 页面上供评审人查看。目前检查靠开发人员在评论里口头汇报，评审人无法直接看到绿/红状态。团队已用 CodeConnections 连接 GitHub，需要选择落地方式。\n\n最贴合的实现是？","o":[{"l":"A","t":"让评审人每次在本地手动跑测试，把结果截图贴进 PR 评论供后续评审参考。"},{"l":"B","t":"配置 CodePipeline 把 PR 事件当作源阶段直接部署到生产环境，用部署结果代替测试结果。"},{"l":"C","t":"配置 CodeBuild 由 PR 事件（opened、synchronize）触发，跑单元测试与扫描，构建结果经 CodeConnections 自动标回 PR 检查项。"},{"l":"D","t":"给所有开发人员授予生产账号权限，允许他们在本地直连生产环境验证改动。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** PR 触发的标准形态就是 CodeBuild 响应 PR 事件（opened 打开、synchronize 更新）跑快速检查，构建结果经 CodeConnections 自动写回 PR 检查项——评审人在 PR 页面直接看绿/红，合并闸门才有依据。\n\n**其他选项为什么错：**\n- A：人工跑测试不可重复、状态不回写，闸门形同虚设。\n- B：PR 阶段直接部署生产违背基本发布纪律，PR 触发的是检查不是部署。\n- D：授予生产权限既扩大爆炸半径，也没有解决「结果显示在 PR 上」的要求。\n\n**关键概念：** PR 全绿闸门＝CodeBuild 跑检查 + 结果回写 PR 检查项。","s":"自编·1.2.3"},{"id":"D1-027","d":1,"t":"single","q":"一个团队的 PR 页面上，自动化检查项一直显示「等待中」，既不通过也不失败，合并闸门形同虚设；去控制台查，CodeBuild 的构建其实已经跑完且有结果。团队要找出检查项状态不回写的原因。\n\n最可能的原因与修复方向是？","o":[{"l":"A","t":"PR 状态回写链路断了——检查 CodeBuild 构建项目的状态回写配置与 CodeConnections 连接授权，让构建结果正常标回 PR 检查项。"},{"l":"B","t":"构建跑得太快导致状态丢失——在 buildspec 里人为加入等待命令拉长构建时长。"},{"l":"C","t":"PR 页面缓存异常——要求开发人员每次合并前强制刷新浏览器。"},{"l":"D","t":"检查项并发太高——把 PR 检查项从五个减到一个，问题自然消失。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** PR 状态回写依赖构建项目的报告配置与 CodeConnections 的连接授权——控制台里构建有结果、PR 页面却永远「等待中」，说明结果没有写回仓库侧，断点就在回写链路；修好回写，闸门才恢复效力。\n\n**其他选项为什么错：**\n- B：状态丢失与构建时长无关，加等待只是掩耳盗铃。\n- C：缓存刷新不解决服务端没写回状态的问题。\n- D：减少检查项数量与状态回写无关，还削弱了质量把关。\n\n**关键概念：** PR「等待中」卡死＝回写链路故障，先查构建项目回写配置与连接授权。","s":"自编·1.2.3"},{"id":"D1-028","d":1,"t":"single","q":"一个团队把全套测试（含单轮 30 分钟、需要真实环境的集成测试）都挂在 PR 检查里，评审周期被拖长，开发人员开始找借口跳过检查直接合并。质量负责人要求在守住「合并前有质量关卡」底线的同时恢复评审效率。\n\n最合理的调整是？","o":[{"l":"A","t":"取消合并前的所有自动化检查，改为每季度事后审计代码质量。"},{"l":"B","t":"把集成测试拆散塞进每个 PR，靠提高并发把 30 分钟压到 10 分钟。"},{"l":"C","t":"由评审人凭经验决定哪些 PR 可以跳过检查，提高灵活度。"},{"l":"D","t":"PR 检查收敛为单元测试与静态扫描这类快速项；重量级集成测试移到合并后的流水线阶段——PR 挡质量，合并管流动。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正确分工是「PR 挡质量、合并管流动」：PR 保留几分钟级的快速检查守住合并闸门，重量级集成测试移到合并后自动跑——底线没丢，评审恢复效率，开发人员也没有绕过检查的动机。\n\n**其他选项为什么错：**\n- A：取消前置检查与「守住底线」的要求直接冲突。\n- B：拆散塞进 PR 治标不治本，集成测试本来就不属于 PR 阶段，并发调度还会推高成本。\n- C：凭经验跳过检查把质量关卡变成了人情关卡。\n\n**关键概念：** PR 阶段不做重量级测试——几十分钟的检查会把评审拖死，重量级放合并后。","s":"自编·1.2.3"},{"id":"D1-029","d":1,"t":"single","q":"一家公司要求：代码合并进 main 分支后，自动推进「构建镜像→部署测试环境→部署生产」的流程，全程无人值守。目前合并后靠工程师手动到控制台点击部署，经常漏发、迟发，发布窗口不稳定。团队已用 CodeConnections 打通代码仓库，现在要设计合并事件的触发链路。\n\n合并事件应该触发什么？","o":[{"l":"A","t":"触发一封邮件通知，由值班工程师收到后手动点击部署按钮。"},{"l":"B","t":"触发定时任务，等当晚统一批量部署当天所有已合并的代码。"},{"l":"C","t":"触发 CodePipeline 的源阶段，自动推进流水线后续的构建与部署环节。"},{"l":"D","t":"触发 CodeBuild 只重跑一次单元测试，结果写进日志，部署仍然人工执行。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 合并事件的职责是「管流动」：合并进 main 即触发 CodePipeline 源阶段，构建、部署等后续环节自动推进，正好满足「无人值守」的要求——这与 PR 事件「挡质量」的分工相对。\n\n**其他选项为什么错：**\n- A：邮件加人工点击就不是无人值守，触发链路断在人身上。\n- B：定时批量部署既不满足「合并后自动推进」，也拉长了变更交付周期。\n- D：合并后只重跑测试不部署，流程没有流动起来，要求只完成了一半。\n\n**关键概念：** 合并事件接流水线源阶段——PR 事件挡质量，合并事件管流动。","s":"自编·1.2.3"},{"id":"D1-030","d":1,"t":"multiple","q":"一个团队在设计 GitHub 的 CI/CD 触发策略，已用 CodeConnections 连接代码仓库。成员对「PR 事件」与「合并事件」各自该承担什么职责理解不一致——有人主张 PR 阶段直接部署生产，有人主张全部靠本地验证。架构师要求在方案评审前统一口径。\n\n关于 PR 触发与合并触发的分工，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"PR 事件（opened、synchronize）适合配 CodeBuild 跑快速检查，结果标回 PR 供评审人判断能否合并。"},{"l":"B","t":"PR 事件适合用来部署生产环境——合并之前就上生产，验证最充分。"},{"l":"C","t":"合并事件（merge / push to main）适合触发流水线源阶段，自动推进构建与部署环节。"},{"l":"D","t":"合并事件只触发通知邮件，所有构建与测试仍由开发人员在本地手动执行。"},{"l":"E","t":"PR 阶段应该跑几十分钟的重量级集成测试，确保合并前万无一失。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** 两条路各管一段：PR 事件（opened、synchronize）配 CodeBuild 做快速检查并把结果标回 PR，管「合并前挡质量」；合并事件（merge / push to main）触发流水线源阶段，管「合并后自动流动」。这就是正文给的标准分工。\n\n**其他选项为什么错：**\n- B：PR 阶段部署生产是发布纪律红线，PR 只做检查不做部署。\n- D：合并后靠人工执行等于没有自动化流水线。\n- E：重量级测试挂 PR 会把评审拖死，属于上一题修掉的错误形态。\n\n**关键概念：** PR 挡质量、合并管流动——两类事件各司其职。","s":"自编·1.2.3"},{"id":"D1-031","d":1,"t":"single","q":"一家公司的促销系统准备迎接大促，性能团队要回答两个问题：一是预期流量下响应是否达标，二是持续加压到多大流量系统会崩溃。测试报告里这两个测试被混写成一个，负责人要求先给它们正名。\n\n两个问题分别对应哪类测试？","o":[{"l":"A","t":"都是负载测试——只要是对系统打流量，两类测试的目的就没有区别。"},{"l":"B","t":"前者是压力测试、后者是负载测试——两个类型名对调了位置。"},{"l":"C","t":"前者是负载测试（验证预期流量下的表现），后者是压力测试（持续加压找崩溃点）。"},{"l":"D","t":"都是压力测试——本质上都是给系统加压，没有细分的必要。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 负载测试回答「预期流量下表现是否达标」，压力测试回答「持续加压到哪一步崩溃」——一个验证达标、一个找极限，目的不同、判据不同，报告不能混写；混写之后既看不出达标与否，也找不到崩溃点，两问都落空。\n\n**其他选项为什么错：**\n- A、D：把两类混为一谈，恰恰是题干要纠正的问题。\n- B：两者的顺序写反了。\n\n**关键概念：** 负载测试验达标，压力测试找崩溃点；性能基线是第三件事——可比对的指标快照。","s":"自编·1.2.4"},{"id":"D1-032","d":1,"t":"single","q":"一个团队的发布流程里，压测报告每次都有，但评审时没人能回答「这次比上次快了还是慢了」——报告只有单次数据，没有可对比的参照物。质量负责人要求把性能对比变成发布关卡的一部分。\n\n缺的是什么？应该怎么落地？","o":[{"l":"A","t":"缺的是更长压测时长——把每轮压测从 1 小时延长到 8 小时，数据自然充分。"},{"l":"B","t":"缺的是更多压测机——把压测机数量翻倍，结果自然更准。"},{"l":"C","t":"缺的是性能基线——固化 P95 延迟、错误率、吞吐量阈值等指标快照，发布时对比基线，回退超阈值就挡住发布。"},{"l":"D","t":"缺的是人工记忆——安排资深工程师凭印象对比历史报告，在评审会上口头说明。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 「没有基线，压测结果只是跑了一下」——基线就是可对比的指标快照（P95 延迟、错误率、吞吐量阈值）；把基线对比放进发布关卡，性能回退超阈值自动挡发布，评审才有客观依据。\n\n**其他选项为什么错：**\n- A：压得更久解决不了「不可对比」，还是单次数据。\n- B：机器更多只提高施压能力，不提供参照物。\n- D：凭印象对比不可靠也不可审计。\n\n**关键概念：** 性能基线＝可对比的指标快照；基线对比进发布关卡。","s":"自编·1.2.4"},{"id":"D1-033","d":1,"t":"single","q":"一家公司要求每个季度对核心系统做一轮全链路压测，但财务不批常驻压测环境——20 台压测机一年闲置 11 个月太浪费。压测只针对核心下单链路，且不允许影响任何真实用户。平台团队要在满足「定期压测」要求的同时把成本管住。\n\n最贴合的方案是？","o":[{"l":"A","t":"用 CloudFormation 编排压测环境，按季度计划触发压测流水线，压完自动销毁资源——只为实际压测时段付费。"},{"l":"B","t":"长期保留一套压测环境，向财务说明压测的重要性争取预算。"},{"l":"C","t":"直接对生产环境做季度压测，省掉单独压测环境的开销。"},{"l":"D","t":"把季度压测降级为年度压测，环境成本随频率一并降低。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 正文给的标准取舍就是「用完即毁」：CloudFormation 编排把压测环境变成代码，按计划触发、压完自动销毁——既满足定期压测的频率要求，又只在压测时段产生成本，两头都站得住。\n\n**其他选项为什么错：**\n- B：常驻环境闲置 11 个月，正是财务不批的原因。\n- C：压生产要么影响真实用户，要么数据失真，红线不能碰。\n- D：降频是把业务要求打折扣，不是成本优化。\n\n**关键概念：** 压测环境按计划触发、用完即毁；对什么环境压是另一条红线——只压预生产。","s":"自编·1.2.4"},{"id":"D1-034","d":1,"t":"multiple","q":"一个团队第一次组织大规模压测，目标环境是与生产同构的预生产集群。成员对压测实践提出了几种说法，负责人要求把正确的沉淀成团队规范，错误的当众纠正。\n\n关于压测与性能验证的实践，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"对与生产同构的预生产环境压测——压生产要么影响真实用户，要么数据失真。"},{"l":"B","t":"压测前先定性能基线（P95 延迟、错误率、吞吐量阈值）——没有基线，压测结果只是「跑了一下」。"},{"l":"C","t":"直接对生产环境压测——真实流量环境下的结果最有说服力。"},{"l":"D","t":"压测不预设指标，先打满流量看现象——指标会限制发现意外问题。"},{"l":"E","t":"压测环境应该 7×24 常驻，保证随时可测。"}],"a":["A","B"],"e":"**正确答案：AB。**\n\n**为什么对：** 压测三要点里的前两条：「对什么压」——与生产同构的预生产环境，压生产影响真实用户或数据失真；「怎么算达标」——先定基线，没有基线的压测没有结论。这两条是压测实践的地基。\n\n**其他选项为什么错：**\n- C：正是 A 里排除的红线做法。\n- D：没有指标的压测无法判定达标与否，也写不进发布关卡。\n- E：压测环境不能常驻——用完即毁才是成本与安全兼得的标准形态。\n\n**关键概念：** 压测三要点——对预生产压、先定基线、结果进发布关卡。","s":"自编·1.2.4"},{"id":"D1-035","d":1,"t":"single","q":"一条部署流水线长期显示全绿，但线上服务偶发 502。排查发现：CodeDeploy 的 ValidateService 钩子里的健康检查命令末尾加了 `|| true`——服务没起来时脚本照样返回成功，坏版本就这样一次次混过闸门。团队要修复这个问题。\n\n问题的本质与修复方向是？","o":[{"l":"A","t":"健康检查探测点太少——在脚本里再加几条探测命令提高覆盖面。"},{"l":"B","t":"线上 502 是流量问题——扩容服务器就能同时解决 502 与流水线误报。"},{"l":"C","t":"退出码被吞掉——`|| true` 把非 0 失败伪装成成功；去掉吞码写法，让非 0 退出码触发失败与自动回滚。"},{"l":"D","t":"流水线看板展示有误——换一个状态展示工具，让失败能显示出来。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 退出码是流水线判断成败的直接信号，`|| true` 把非 0 失败强行改成 0——脚本「跑完了」不等于「跑成了」，全绿是假的。去掉吞码，非 0 退出码就会触发钩子失败与 CodeDeploy 自动回滚。\n\n**其他选项为什么错：**\n- A：探测点再全，退出码被吞了也一样报成功。\n- B：502 的根因是坏版本没被拦住，扩容治不了部署质量问题。\n- D：展示层没有错，错在信号源头就被伪装了。\n\n**关键概念：** 「脚本末尾加 exit 0」「|| true 吞错」都是把失败伪装成成功的经典错误；退出码被吞，闸门全部失效。","s":"自编·1.2.5"},{"id":"D1-036","d":1,"t":"single","q":"一个团队 review 构建脚本时发现：buildspec 里某条编译命令可能失败，作者为了「不让流水线误报」在命令后追加了 `|| true`。最近一次事故里，这条命令实际失败了，但流水线照样进入下一阶段，产物缺失。团队讨论这条命令的正确处理。\n\n正确处理是？","o":[{"l":"A","t":"保留 `|| true`，另加一条日志命令记录可能发生的失败，两全其美。"},{"l":"B","t":"保留 `|| true`，并在脚本末尾统一加 `exit 0`，保证流水线阶段永远成功。"},{"l":"C","t":"把这条命令挪到 post_build 阶段，失败就不会影响构建结果了。"},{"l":"D","t":"移除 `|| true`，让命令的非 0 退出码如实让构建失败——CodeBuild 判定阶段成败的唯一依据就是退出码。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** CodeBuild 按命令退出码决定阶段成败：非 0 即失败。移除吞码写法后，命令失败会如实让构建失败，产物缺失这类问题在构建阶段就被拦下，而不是流到下游才暴露。\n\n**其他选项为什么错：**\n- A：日志记录了失败但退出码仍是 0，流水线照样全绿，问题原样存在。\n- B：脚本末尾 exit 0 是经典错误项——它把一切失败伪装成成功。\n- C：挪阶段只是换个位置吞失败，失败照样被隐藏。\n\n**关键概念：** 退出码是唯一的诚实信号——任何「保证成功」的写法都是在制造假绿。","s":"自编·1.2.5"},{"id":"D1-037","d":1,"t":"single","q":"一家公司用 CodeDeploy 部署 ECS 服务，部署配置里有 ValidateService 生命周期钩子执行健康检查脚本。过去两次事故都是值班工程师半小时后才发现坏版本，用户已经报障。运维要求：部署后应用起不来时，不要等人发现，系统自己把流量切回旧版本。\n\n怎么让这个要求自动生效？","o":[{"l":"A","t":"在健康检查脚本里输出醒目的告警日志，值班工程师看到后手动执行回滚操作。"},{"l":"B","t":"让健康检查脚本在服务异常时返回非 0 退出码——钩子失败即触发部署失败处理与自动回滚。"},{"l":"C","t":"健康检查永远返回成功，另建一套独立监控告警系统负责发现异常并通知人工处理。"},{"l":"D","t":"把部署时间安排到深夜，给人工检查留出充足的时间窗口。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** CodeDeploy 的生命周期钩子以脚本退出码为判定依据：ValidateService 返回非 0 即部署验证失败，自动触发回滚把流量切回旧版本——「系统自己回滚」正是靠退出码驱动，不需要任何人工介入。\n\n**其他选项为什么错：**\n- A：告警加人工回滚还是人肉闭环，不满足「系统自己切回」的要求。\n- C：永远返回成功等于钩子形同虚设，监控发现异常时坏版本已经在线上。\n- D：深夜部署只是错峰，异常发生时仍然依赖人。\n\n**关键概念：** 部署钩子的健康检查靠非 0 退出码触发自动回滚——见选定部署策略一节的自动回滚机制。","s":"自编·1.2.5"},{"id":"D1-038","d":1,"t":"multiple","q":"一个团队在整理「用退出码判断应用健康」的团队规范——上个月刚发生过健康检查被吞码写法骗过、坏版本混上线的事故。成员提出了几条候选条款，架构师要求把正确的沉淀下来，防止「全绿假象」再次出现。\n\n关于退出码的用法，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"在脚本末尾统一加 `exit 0`，保证流水线阶段不会因为偶发失败而中断。"},{"l":"B","t":"退出码 0 表示成功、非 0 表示失败——这是流水线判断阶段成败的直接依据。"},{"l":"C","t":"健康检查钩子的退出码不重要，看脚本日志内容才能准确判断成败。"},{"l":"D","t":"容器探针只看进程是否存活，与命令退出码完全无关。"},{"l":"E","t":"用 `|| true` 包住可能失败的命令会吞掉失败信号，制造流水线全绿的假象。"}],"a":["B","E"],"e":"**正确答案：BE。**\n\n**为什么对：** 退出码语义是地基——0 成功、非 0 失败，构建判定、部署钩子、容器探针全靠它；而吞码写法（`|| true`）是破坏这套语义的头号杀手，会让所有依赖退出码的机制一起失明。\n\n**其他选项为什么错：**\n- A：统一 exit 0 是把所有失败伪装成成功的经典错误项。\n- C：退出码恰恰是最重要、最直接的判定信号，日志只是辅助。\n- D：容器探针正是通过命令退出码判断健康并决定是否替换实例。\n\n**关键概念：** 守住退出码语义＝守住流水线的诚实性；任何吞错写法都是假绿源头。","s":"自编·1.2.5"},{"id":"D1-039","d":1,"t":"single","q":"一家公司的管理层要求「把代码覆盖率提到 100% 作为发布条件」。执行半年后，覆盖率报表达标，但线上缺陷数不降反升——抽查发现大量测试没有断言，只为凑行数。质量负责人要纠正这个做法。\n\n正确的策略是？","o":[{"l":"A","t":"维持 100% 硬门槛，同时要求测试团队提高写测试的速度。"},{"l":"B","t":"对核心业务模块设高阈值（如 90%）、边缘代码放宽，并盯覆盖率趋势——指标定错行为就变形。"},{"l":"C","t":"取消所有覆盖率要求，回到完全依赖人工测试的把关方式。"},{"l":"D","t":"只统计行覆盖率、不看分支覆盖，把统计口径简化以降低达标难度。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 覆盖率本身不证明质量，指标定错行为就变形——100% 硬门槛逼出了无断言的凑数测试。正解是分级：核心模块高门槛、边缘放宽，同时盯趋势，把测试预算花在业务逻辑上。\n\n**其他选项为什么错：**\n- A：维持错误指标只会让凑数行为继续，写再快也是空测试。\n- C：从「指标错误」跳到「不要指标」，丢掉了趋势预警能力。\n- D：简化口径没有解决「为数字写测试」的激励问题。\n\n**关键概念：** 覆盖率阈值别追 100%——「关键模块设阈值并盯趋势」才是可执行的门槛。","s":"自编·1.2.6"},{"id":"D1-040","d":1,"t":"single","q":"一个团队的覆盖率报表显示：最近三个月代码覆盖率从 78% 一路下滑到 61%，同期需求交付量正常、测试工具运行无异常。测试负责人要在周会上解释这个趋势说明了什么、该采取什么动作。\n\n正确的解读与动作是？","o":[{"l":"A","t":"说明测试工具坏了——重装覆盖率工具后数字会自然回升。"},{"l":"B","t":"说明代码质量变好了——覆盖率下降是重构减少冗余代码的正常结果，不用干预。"},{"l":"C","t":"说明服务器性能下降——覆盖率统计消耗资源，升级构建机即可恢复。"},{"l":"D","t":"说明测试没跟上代码变化——新增代码没带测试；要求新增代码必须带单元测试，遏制下滑趋势。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 覆盖率趋势下滑一定说明测试没跟上代码变化——交付量正常意味着新代码在进，测试没跟着进；要求的动作就是把「新增代码必须带测试」立成规矩，从源头止住下滑。\n\n**其他选项为什么错：**\n- A：工具异常会导致统计失败而不是持续下滑，题干已排除工具问题。\n- B：覆盖率下滑与质量变好没有因果关系，这是自我安慰。\n- C：覆盖率统计与服务器性能无关，升级机器改变不了分子分母。\n\n**关键概念：** 覆盖率看趋势不看单点——趋势下滑＝测试没跟上代码。","s":"自编·1.2.6"},{"id":"D1-041","d":1,"t":"single","q":"一家公司要求单元测试随构建自动执行：测试失败时构建必须失败，覆盖率报告保留历史可查。目前测试全靠开发人员在本地自觉执行，漏跑时有发生，覆盖率数字也无从追溯。平台团队要在 CodeBuild 的 buildspec 里落实这条要求。\n\n最贴合的落地方式是？","o":[{"l":"A","t":"在 build 或 post_build 阶段执行测试命令与覆盖率工具，测试失败让构建中断；报告推送到 CodeBuild 报告组或 S3 留存历史。"},{"l":"B","t":"要求开发人员在本地跑完测试再提交代码，构建阶段不执行任何测试以加快构建。"},{"l":"C","t":"把测试命令用 `|| true` 包住避免阻塞发布，测试结果以日志形式供需要的人查阅。"},{"l":"D","t":"把单元测试挪到生产部署之后执行，验证代码在真实环境下的行为。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 自动化三步就是「构建内跑测试、报告入库、门槛卡关」：build/post_build 阶段执行测试与覆盖率工具，失败即中断构建；报告推到报告组或 S3，历史可查——两个要求一次落齐。\n\n**其他选项为什么错：**\n- B：本地测试不可强制、不可审计，构建内执行才是自动化。\n- C：吞码写法让「测试失败构建失败」变成空话，日志不构成门槛。\n- D：单元测试在生产后执行为时已晚，缺陷已经上线。\n\n**关键概念：** 单元测试自动化＝构建内执行 + 报告入库 + 阈值卡关。","s":"自编·1.2.6"},{"id":"D1-042","d":1,"t":"multiple","q":"一个团队在制定单元测试与覆盖率的自动化规范——背景是团队覆盖率长期在 60% 上下徘徊，还出现过为凑数字写空测试的情况。以下几条候选条款要进评审，架构师要求先把正确的定下来，再讨论阈值数值。\n\n下列做法正确的两项是？（请选择两项）","o":[{"l":"A","t":"把覆盖率 100% 作为全公司统一的发布条件，倒逼测试团队补齐所有代码的测试。"},{"l":"B","t":"覆盖率低于阈值时让构建失败，防止测试越写越少。"},{"l":"C","t":"覆盖率报告只保留最新一次，历史数据对决策没有价值。"},{"l":"D","t":"允许用无断言的空测试先把覆盖行数凑上去，指标好看再逐步补断言。"},{"l":"E","t":"盯覆盖率趋势比只看单次数字更有意义——趋势下滑说明测试没跟上代码变化。"}],"a":["B","E"],"e":"**正确答案：BE。**\n\n**为什么对：** 门槛卡关是防「测试越写越少」的机制——低于阈值构建失败；趋势是质量的预警线——下滑意味着新代码没带测试。两条合起来构成「可执行的覆盖率治理」。\n\n**其他选项为什么错：**\n- A：100% 硬门槛是经典错误项——为凑数字会写大量无断言的空测试。\n- C：没有历史就没有趋势，趋势恰恰是最有价值的信号。\n- D：空测试抬高了数字、掩盖了风险，指标定错行为就变形。\n\n**关键概念：** 阈值卡关 + 趋势预警，配合分级阈值使用；禁追 100%。","s":"自编·1.2.6"},{"id":"D1-043","d":1,"t":"single","q":"一家公司的流水线部署完消息服务后，需要自动验证集成行为：向队列发测试消息、消费并校验内容与顺序。安全团队同时要求：验证脚本只授予完成验证所需的最小权限，且绝不能触碰生产环境的资源。\n\n最贴合的方案是？","o":[{"l":"A","t":"给构建角色附加管理员权限，直接对生产环境的队列做收发验证，结果最真实。"},{"l":"B","t":"让开发人员在本地用个人账号手工验证，把结果截图贴进 PR 评论。"},{"l":"C","t":"跳过队列集成验证，只在单元测试里用模拟对象代替队列行为。"},{"l":"D","t":"在测试环境里现起临时 SQS 队列做收发验证，构建角色只授予测试所需最小权限，资源用完自动清理。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 题干三个要求各有落点：验证集成行为——临时队列真实收发；最小权限——构建角色只授予测试所需权限；不碰生产——临时资源起在测试环境。这正是「临时资源 + 最小权限 + 自动清理」的标准形态。\n\n**其他选项为什么错：**\n- A：管理员权限加生产资源，两条安全红线全踩。\n- B：手工验证不可重复，也没有进入流水线的自动闭环。\n- C：模拟对象测不出真实收发行为，正是要补的集成验证被砍掉了。\n\n**关键概念：** 流水线调 AWS 服务做测试＝测试专用角色 + 临时资源 + 自动清理。","s":"自编·1.2.7"},{"id":"D1-044","d":1,"t":"single","q":"一个团队的流水线在测试阶段会现起临时 SQS 队列做收发验证。半年后测试账号里攒了四千多个残留队列——每次构建失败，清理逻辑就被跳过，没人回头补删。平台团队要根治资源残留。\n\n清理逻辑应该放在哪里？","o":[{"l":"A","t":"放在 build 段测试步骤的末尾——正常路径下测试完就会顺序执行清理。"},{"l":"B","t":"交给值班工程师，每月登录控制台按资源清单手动清理一轮。"},{"l":"C","t":"放在 buildspec 的 post_build 段，并确保无论前面成功失败都执行——临时资源必须自带清理。"},{"l":"D","t":"不需要专门清理——队列留在账号里可以复用，还节省下次的创建时间。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 残留的根因是「清理挂在成功路径上」——构建一失败清理就被跳过。post_build 段无论成败都执行，把清理写成「无论成败都跑」的收尾步骤，临时资源才真正自带清理。\n\n**其他选项为什么错：**\n- A：正是事故里的写法——失败路径下永远轮不到清理。\n- B：人工月度清理是补救不是根治，四千个残留就是这么攒出来的。\n- D：残留资源持续占用配额与成本，还可能干扰下一次测试。\n\n**关键概念：** 临时资源必须自带清理，这是纪律不是建议——清理段要无论成败都执行。","s":"自编·1.2.7"},{"id":"D1-045","d":1,"t":"single","q":"一家公司的流水线测试阶段需要调用多个 AWS 服务做验证。安全审计发现：构建角色被授予了包含删除生产数据表能力的宽泛权限——测试脚本一个 bug 就可能删掉生产数据。安全团队要求立即整改。\n\n整改方向是？","o":[{"l":"A","t":"保留现有宽泛权限，但要求所有测试脚本上线前经过双人评审。"},{"l":"B","t":"按「只授予测试所需的最小权限 + 测试账号与生产账号隔离」收敛权限——权限给大了，脚本一个 bug 就能删生产表。"},{"l":"C","t":"把测试安排到夜间低峰期执行，降低误删生产数据时的影响范围。"},{"l":"D","t":"给构建角色更换一把更长的访问密钥，用密钥强度提升安全性。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 问题的根源是权限远超测试所需——审计点名的风险「脚本一个 bug 删生产表」只有靠收敛权限消除：最小权限让角色只做测试该做的事，账号隔离让测试环境与生产环境物理分开，双保险。\n\n**其他选项为什么错：**\n- A：评审降低的是脚本出错概率，权限本身的风险一分未减。\n- C：夜间执行改变不了「能删生产表」这个事实。\n- D：密钥长度与权限范围无关，换密钥是答非所问。\n\n**关键概念：** 最小权限 + 账号隔离；与制品仓库权限配置是同一条原则。","s":"自编·1.2.7"},{"id":"D1-046","d":1,"t":"multiple","q":"一个团队在总结「流水线调用 AWS 服务做测试」的实践——此前测试账号刚清理出四千多个残留队列，权限审计也发现构建角色权限过宽。以下候选条款要写进团队规范，负责人要求评审时先把正确的定下来。\n\n下列做法正确的两项是？（请选择两项）","o":[{"l":"A","t":"测试用的临时资源（如临时队列、临时数据库）必须自带自动清理逻辑，写在无论成败都执行的收尾段里。"},{"l":"B","t":"验证生产环境数据正确性时，直接用管理员权限操作生产资源最快捷，应作为默认做法。"},{"l":"C","t":"流水线验证用的构建角色应按最小权限授予，且测试账号与生产账号隔离。"},{"l":"D","t":"临时资源在构建失败时不必清理，留给下次构建直接复用更节省时间。"},{"l":"E","t":"集成验证应全部改到开发人员本地执行，流水线只负责构建与部署。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** 两条正是正文的标准实践：临时资源自带清理（写在无论成败都执行的收尾段，杜绝残留）；最小权限加账号隔离（权限给大了，测试脚本一个 bug 就能删生产表）。\n\n**其他选项为什么错：**\n- B：管理员权限加生产资源是双重红线，验证应该在测试环境做。\n- D：失败不清理正是资源残留的根因，「复用」的收益远小于残留的代价。\n- E：验证回到本地等于放弃了流水线的自动集成验证。\n\n**关键概念：** 临时资源自带清理 + 最小权限 + 账号隔离，三条缺一不可。","s":"自编·1.2.7"},{"id":"D1-047","d":1,"t":"single","q":"一家公司发生线上事故后做复盘，审计方要求回答「这次生产发布用的到底是哪份代码」——团队翻遍了聊天记录和发布截图，都对不上。质量负责人意识到这是制品管理缺了某个能力，要求补齐。\n\n最需要补齐的能力是？","o":[{"l":"A","t":"制品可追溯——每个制品能反查到源码提交、构建日志与部署记录，事故复盘才有据可查。"},{"l":"B","t":"制品加密——把所有制品用更强的算法重新加密一遍，提高泄露门槛。"},{"l":"C","t":"制品压缩——把制品体积压小，方便聊天工具传输存档。"},{"l":"D","t":"制品去重——合并相同内容的制品，减少存储份数避免混淆。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 制品在流水线里被部署、审计、回滚三个环节消费；审计要回答「这次发布是哪份代码」，靠的就是制品到源码提交、构建日志、部署记录的反查链——断了一环，事故复盘就断在那，这正是题干翻记录对不上的原因。\n\n**其他选项为什么错：**\n- B：加密管的是泄露风险，与「对不上是哪份代码」无关。\n- C：聊天工具传制品本身就是管理失控，压缩救不了追溯。\n- D：去重减少份数反而增加对不上的概率。\n\n**关键概念：** 制品管理不是存储问题，是可追溯性问题——三环节消费：部署取用、审计追溯、回滚恢复。","s":"自编·1.3.1"},{"id":"D1-048","d":1,"t":"single","q":"一家公司的安全审计发现两个问题：一是镜像仓库的推送权限给了整个开发团队，任何人都能往生产镜像仓库推镜像；二是部分制品存放在未加密的存储桶里。安全团队要求按制品安全管理规范整改。\n\n正确的整改方向是？","o":[{"l":"A","t":"给每位开发人员发放独立的仓库账号并记录操作日志，保留人工推送通道以备急用。"},{"l":"B","t":"只解决加密问题——把未加密制品迁移到加密存储桶，推送权限维持现状方便排障。"},{"l":"C","t":"推送权限最小化——推权只授予流水线角色，人工推送一律关闭；传输与存储全程用 KMS 加密。"},{"l":"D","t":"把制品仓库对全公司只读开放，让所有人共同监督内容合规。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 制品安全管理的两条标准动作：权限最小化——推权只给流水线角色，杜绝人工直推生产仓库；加密——传输与存储全程 KMS 加密。两条正好对应审计发现的两个问题。\n\n**其他选项为什么错：**\n- A：人手一个账号只是把「都能推」变成「都有账号推」，人工推送通道本身就是风险源。\n- B：只修一半，宽泛推权还在，审计的下一次发现已经在路上。\n- D：扩大只读范围与推送权限无关，还扩大了暴露面。\n\n**关键概念：** 制品安全两条线——推权最小化（只给流水线角色）+ 全程加密（KMS）。","s":"自编·1.3.1"},{"id":"D1-049","d":1,"t":"single","q":"一家公司的线上服务出问题需要回滚到上周版本，工程师去制品仓库找上周的制品时发现：同名制品被本周的构建覆盖了，上周版本已不存在，回滚只能重新构建——而重新构建的代码和上周发布时又有差异。团队要根治「回滚找不到制品」。\n\n最直接的措施是？","o":[{"l":"A","t":"让工程师每次发布前把制品手动下载到本地电脑备份一份。"},{"l":"B","t":"建立版本化存储与保留策略——制品按版本留存、同名不覆盖，按策略保留回滚所需的历史窗口。"},{"l":"C","t":"取消回滚机制，出问题时直接向前修复，避免依赖历史制品。"},{"l":"D","t":"把制品仓库的访问权限收紧，减少误覆盖的可能性。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 回滚靠历史版本恢复，前提是历史版本还在且内容没被覆盖——版本化存储加保留策略正是补这两个前提：版本不可变保证「还是那份」，保留窗口保证「还找得到」。\n\n**其他选项为什么错：**\n- A：本地备份不可靠、不可审计，也不在流水线体系内。\n- C：向前修复是策略选择，回滚能力本身必须保留——这不是二选一。\n- D：覆盖不是「误操作」，是同名覆盖的机制问题，收权限挡不住。\n\n**关键概念：** 回滚能力的地基＝版本不可变 + 历史版本按策略保留。","s":"自编·1.3.1"},{"id":"D1-050","d":1,"t":"multiple","q":"一个团队在制定制品安全管理规范——背景是上月安全审计发现开发人员可以直推生产镜像仓库，部分制品还存放在未加密的位置。候选条款有若干条，架构师要求评审时先把与「安全管理」直接相关的正确条款定下来。\n\n下列做法正确的两项是？（请选择两项）","o":[{"l":"A","t":"制品仓库的推送权限只授予流水线角色，开发与运维人员一律不授予推送权限。"},{"l":"B","t":"制品的传输与存储全程加密，密钥由 KMS 托管管理。"},{"l":"C","t":"为方便紧急抢修，给每位高级工程师保留生产仓库的直推权限。"},{"l":"D","t":"制品存储加密可以省略——仓库已有访问控制，内容不会泄露。"},{"l":"E","t":"制品应该对全公司开放可写，众人拾柴火焰高。"}],"a":["A","B"],"e":"**正确答案：AB。**\n\n**为什么对：** 这两条就是制品安全管理的完整口径：推权最小化（只给流水线角色）管住「谁能改」，全程 KMS 加密管住「泄不泄露」——两个维度合起来才是完整的制品安全。\n\n**其他选项为什么错：**\n- C：紧急通道是权限腐化的起点，抢修也应走流水线。\n- D：访问控制与加密是两层防线，砍掉一层就少一层兜底。\n- E：开放可写等于放弃版本可信，制品随时可能被篡改。\n\n**关键概念：** 制品安全＝推权最小化 + 全程加密，缺一不可。","s":"自编·1.3.1"},{"id":"D1-051","d":1,"t":"single","q":"一条流水线的构建阶段需要把编译输出的文件产物（可执行文件与配置包）交给部署阶段使用，目前产物随手放在构建机的临时目录里，部署阶段经常找不到或拿到旧版本。平台团队要确定产物的生成方式与输出位置，保证部署环节能直接引用。\n\n最贴合的生成方式是？","o":[{"l":"A","t":"在 CodeBuild 的 buildspec 中用 artifacts 段定义文件产物，输出到 S3，流水线下一阶段直接引用。"},{"l":"B","t":"把文件产物打成容器镜像推送到 ECR，部署阶段从镜像里解出文件。"},{"l":"C","t":"让部署阶段的脚本从构建机的本地磁盘直接读取产物文件。"},{"l":"D","t":"把文件产物提交回源码仓库的一个专用分支，部署阶段从该分支拉取。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 文件类制品的标准生成路径就是 CodeBuild 按 buildspec 的 artifacts 段输出、落到 S3，流水线下一阶段按位置直接引用——生成、存储、消费三段在一个体系里衔接。\n\n**其他选项为什么错：**\n- B：镜像形态是为运行时准备的，把散文件塞进镜像再解出来是绕远路。\n- C：构建机用完即销毁，本地磁盘上的产物到部署阶段早就不在了。\n- D：制品不该回灌源码仓库——产物与源码混存，追溯与清理都乱。\n\n**关键概念：** 文件制品＝buildspec artifacts 段输出到 S3；镜像制品推 ECR；两条路径别混。","s":"自编·1.3.2"},{"id":"D1-052","d":1,"t":"single","q":"一个团队把应用容器化后改造构建流程：每次构建要把应用连同运行时环境打成容器镜像，供 ECS 部署使用；此前镜像存在 S3 里，取用与管理都不顺手。团队在确定镜像产物的去向与引用方式。\n\n最贴合的做法是？","o":[{"l":"A","t":"把镜像文件上传到 S3 存储桶，部署时下载解压加载。"},{"l":"B","t":"镜像只保留在构建机的本地 Docker 缓存里，部署阶段同机直接启动。"},{"l":"C","t":"把构建命令发给部署服务器，在部署服务器上现场执行构建。"},{"l":"D","t":"构建产出镜像后推送到 Amazon ECR，部署阶段按镜像标签或 ARN 引用。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 容器镜像制品的标准路径就是推送到 ECR——镜像仓库负责存储与版本管理，部署阶段按标签或 ARN 精确引用，与 ECS 的部署机制原生衔接。\n\n**其他选项为什么错：**\n- A：S3 不是镜像仓库，缺少镜像管理能力，解压加载的方式 ECS 也不认。\n- B：构建机即用即毁，本地缓存留不住镜像，部署机也拿不到。\n- C：把构建挪到部署机上执行，等于没有制品——构建与部署耦合，回滚与审计全部失灵。\n\n**关键概念：** 容器制品走 ECR；文件制品走 buildspec artifacts 段到 S3。","s":"自编·1.3.2"},{"id":"D1-053","d":1,"t":"single","q":"一个团队的 Lambda 函数代码更新后要打包交付。团队里两位成员对部署包形态理解不一致：一位坚持所有函数都用 zip，另一位认为应该全部改用容器镜像。团队先要统一认知再定打包规范，避免各函数各自为政。\n\n关于 Lambda 部署包，正确的说法是？","o":[{"l":"A","t":"部署包只能用 zip 形态，容器镜像不被 Lambda 支持。"},{"l":"B","t":"部署包支持 zip 包或容器镜像两种形态：zip 解压后 250 MB 上限，公共依赖可抽到层（layers）里。"},{"l":"C","t":"部署包支持两种形态，且两者都没有任何大小限制，随意打包。"},{"l":"D","t":"部署包必须是容器镜像形态，zip 形态已被淘汰。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** Lambda 部署包（deployment package）就两种形态：zip 包有解压后 250 MB 的上限，公共依赖可以抽到层里给函数共享；镜像形态上限宽松但冷启动更慢——两种形态各有适用。\n\n**其他选项为什么错：**\n- A：容器镜像是 Lambda 官方支持的部署形态。\n- C：250 MB 上限是 zip 形态的硬约束，不是没有限制。\n- D：zip 仍是主流形态，尤其高频改动的小函数。\n\n**关键概念：** Lambda 打包＝zip（250 MB 上限 + layers）或镜像（上限宽松、冷启动慢）；选型先看函数的依赖体积与冷启动敏感度，再定形态。","s":"自编·1.3.2"},{"id":"D1-054","d":1,"t":"multiple","q":"一个团队在梳理「制品从哪里来」的培训材料，面向新入职工程师，表述必须准确。成员总结了几条生成方式的表述，架构师要求把正确的留下来写进材料。\n\n关于制品的生成方式，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"所有类型的制品都统一打包成容器镜像，一条路径最简单。"},{"l":"B","t":"编译出的文件产物由 CodeBuild 按 buildspec 的 artifacts 段输出。"},{"l":"C","t":"文件产物直接留在构建机本地，部署阶段自行取用。"},{"l":"D","t":"容器构建产出的镜像推送到 ECR 存储，供部署阶段引用。"},{"l":"E","t":"Lambda 的部署包只能由开发人员手工 zip 后邮件发送。"}],"a":["B","D"],"e":"**正确答案：BD。**\n\n**为什么对：** 生成方式跟着构建走，正文给出三条标准路径：CodeBuild 按 artifacts 段输出文件产物、容器构建推 ECR、Lambda 打部署包（zip 或镜像）——A、B 正是前两条。\n\n**其他选项为什么错：**\n- A：一刀切打包成镜像会让文件类制品的传递变笨重，路径要看制品类型。\n- C：构建机即用即毁，本地留存等于制品丢失。\n- E：手工打包邮件发送脱离流水线，没有版本管理与追溯。\n\n**关键概念：** 制品生成三路径——artifacts 段出文件、容器出镜像、Lambda 出部署包。","s":"自编·1.3.2"},{"id":"D1-055","d":1,"t":"single","q":"一家公司的制品管理存在隐患：同一版本号的制品在重新构建后内容被替换，旧内容无处可寻。某次安全事件溯源时，团队拿到的「v2.3.1」制品与事发时部署的版本不一致，溯源被迫中断。管理层要求从机制上杜绝。\n\n最核心的机制要求是？","o":[{"l":"A","t":"提高构建频率，让每个版本号停留的时间更短，减少被替换的机会。"},{"l":"B","t":"版本号改用时间戳命名，靠命名规则避开内容覆盖问题。"},{"l":"C","t":"给每个版本号加注释说明，注明内容可能被后续构建替换。"},{"l":"D","t":"版本不可变——同一版本号永远指向同一内容，重新打标签或覆盖等于篡改历史，一律禁止。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 版本不可变是制品生命周期的第一条约束：同一版本号永远指向同一内容——重打标签等于篡改历史。溯源中断的根因就是版本号被复用覆盖，只有不可变机制能从根上杜绝。\n\n**其他选项为什么错：**\n- A：提高频率不改变「可覆盖」的机制，隐患原样存在。\n- B：时间戳只是换个命名，仓库仍允许同时间戳覆盖就没有解决任何问题。\n- C：加注释是承认篡改合法，与溯源要求背道而驰。\n\n**关键概念：** 版本不可变——制品生命周期的第一约束；镜像仓库对应配置是不可变标签。","s":"自编·1.3.3"},{"id":"D1-056","d":1,"t":"single","q":"一家公司的制品存储费用连续三个季度增长，运维想「只留最近三个版本」省成本；但合规部门要求制品至少保留一年备查。两个部门的要求发生了冲突，平台团队要给出兼顾双方的保留策略。\n\n最合理的策略是？","o":[{"l":"A","t":"按运维意见只留最近三个版本，合规检查到来前临时重新构建补齐。"},{"l":"B","t":"按合规意见全部永久保留，存储成本由运维部门自行消化。"},{"l":"C","t":"按策略分层保留——满足合规保留期（如一年）作为下限，在此之上按版本数或天数自动清理，兼顾存储费与合规要求。"},{"l":"D","t":"把制品压缩后全部保留，用压缩率对冲存储成本。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 保留与清理的标准做法就是策略化：合规保留期是硬下限（审计要求留一年就得留一年），在下限之上按「最近 N 个版本或 N 天」自动清理过期制品——存储费与合规要求同时站住。\n\n**其他选项为什么错：**\n- A：临时重建的制品无法证明是当时部署的那份，合规上等于没有。\n- B：只满足合规不谈成本，是放弃治理而非治理。\n- D：压缩能降一点成本，但「全部永久保留」的机制问题还在。\n\n**关键概念：** 保留策略＝合规保留期作下限 + 按版本数或天数自动清理。","s":"自编·1.3.3"},{"id":"D1-057","d":1,"t":"single","q":"一个团队的制品仓库里有成百上千个制品，但没有一个记录它对应的源码提交与构建信息。事故复盘时，工程师拿着制品反查代码版本，只能靠肉眼比对二进制差异，一次复盘要多花两天。团队要补上追溯链。\n\n最直接的措施是？","o":[{"l":"A","t":"给制品仓库扩容，把所有历史制品全部保留下来慢慢比对。"},{"l":"B","t":"要求复盘时重新执行一次构建，用新构建的制品代替事发制品分析。"},{"l":"C","t":"把源码提交 ID 与构建时间写进制品元数据（版本文件或镜像标签），让制品能反查到提交与构建日志。"},{"l":"D","t":"在制品命名里加入工程师姓名，人工追溯时按姓名找人询问。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 可追溯的根就在元数据——把源码提交 ID 与构建时间写进制品（版本文件或镜像标签），制品到提交、构建日志的反查链才能建立起来，复盘从「肉眼比对」变成「直接查」。\n\n**其他选项为什么错：**\n- A：扩容解决「存不存得下」，解决不了「对不对得上」。\n- B：重新构建的制品与事发制品内容可能不同，用它复盘等于破坏证据。\n- D：按姓名找人靠口述还原，不是可审计的追溯链。\n\n**关键概念：** 元数据写入（提交 ID + 构建时间）是可追溯的根。","s":"自编·1.3.3"},{"id":"D1-058","d":1,"t":"single","q":"一家公司配置了自动清理策略治理制品存储成本：策略写得过于激进，上线一周后连续两次回滚失败——回滚目标版本的制品已经被自动清理掉了，值班工程师只能临时手工重推制品救场。平台团队要修正清理策略。\n\n修正的核心原则是？","o":[{"l":"A","t":"彻底关闭自动清理，回到人工判断是否删除的状态。"},{"l":"B","t":"保留策略必须先满足回滚与合规需求，再谈清理——清理只删「回滚窗口外且过合规保留期」的制品。"},{"l":"C","t":"把清理频率调慢，从每天清理改成每月清理一次。"},{"l":"D","t":"清理前给所有制品加锁，锁住后就不会被误删。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 清理策略的边界由需求决定：回滚需要的历史窗口与合规保留期是硬需求，清理只能删这两者之外的过期制品——「先满足需求、再谈清理」正是修正激进策略的核心原则。\n\n**其他选项为什么错：**\n- A：一刀切关闭清理，存储成本问题原样回来。\n- C：调慢频率只是延迟事故，回滚窗口外的制品照样被删。\n- D：全量加锁等于变相永久保留，且锁管理本身成为新负担。\n\n**关键概念：** 保留策略先满足回滚窗口与合规保留期，清理只处理两者之外的过期制品。","s":"自编·1.3.3"},{"id":"D1-059","d":1,"t":"multiple","q":"一个团队在学习制品生命周期管理的培训课上，讲师给出三条现实约束，课后测验要求学员挑出表述正确的两项——答对的人优先获得公司资助的认证考试名额。\n\n关于制品生命周期，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"制品越多越好——存得越多，能回滚到的历史点就越全，成本不用考虑。"},{"l":"B","t":"版本不可变——同一版本号永远指向同一内容，重打标签等于篡改历史。"},{"l":"C","t":"可追溯断了也没关系——复盘时凭记忆还原当时发布的内容即可。"},{"l":"D","t":"版本号允许在紧急情况下复用覆盖，反正内容差不多。"},{"l":"E","t":"保留与清理要在存储费用与合规保留期之间取得平衡，按策略自动执行。"}],"a":["B","E"],"e":"**正确答案：BE。**\n\n**为什么对：** 生命周期三条现实约束是版本不可变、保留与清理（存储费与合规保留期平衡）、可追溯——A、B 是前两条的标准表述，也是考试最爱考的两条。\n\n**其他选项为什么错：**\n- A：制品不是越存越好，成本与合规期要平衡。\n- C：可追溯断一环，事故复盘就断在那——凭记忆还原不可审计。\n- D：版本号复用覆盖等于篡改历史，与不可变约束直接冲突。\n\n**关键概念：** 生命周期三约束——不可变、策略化保留清理、全程可追溯。","s":"自编·1.3.3"},{"id":"D1-060","d":1,"t":"single","q":"一个团队的 CI 构建每天随机失败：排查发现依赖包直接从公共 npm 源拉取，公共源一抖动，构建就取包超时；不同开发者本地配置的镜像源还不一致，问题时好时坏难以定位。平台团队要统一依赖取包入口。\n\n最贴合的方案是？","o":[{"l":"A","t":"要求所有开发人员在本地配置文件里统一写入同一个公共镜像地址，靠约定保持一致。"},{"l":"B","t":"把所有用到的公共包手动下载后上传到 S3，构建时从 S3 取包。"},{"l":"C","t":"用 AWS CodeArtifact 建域与仓库，把 npmjs 配为上游仓库（upstream repository），开发与构建统一指向 CodeArtifact 端点——公共源抖动时有缓存兜底。"},{"l":"D","t":"把构建搬到网络更稳定的海外区域执行，绕开公共源的抖动。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** CodeArtifact 的核心能力就是上游仓库统一代理：内部私有包与公共源（npmjs）代理成统一端点，构建先取内部包、再走上游缓存的外部包——公共源抖一次，缓存挡一次。统一入口不只是整洁，是稳定性。\n\n**其他选项为什么错：**\n- A：约定管不了所有构建环境，本地配置漂移正是现在的问题。\n- B：手动维护公共包拷贝是持续的人肉负担，版本更新就失效。\n- D：换区域治标不治本，公共源的抖动任何区域都可能遇到。\n\n**关键概念：** CodeArtifact 上游仓库＝内部包优先、外部兜底的统一取包端点。","s":"自编·1.3.4"},{"id":"D1-061","d":1,"t":"single","q":"一家公司用 Amazon S3 存放构建产出的文件制品（部署包与 IaC 模板包）。某次回滚时工程师发现同名对象被新构建覆盖，旧版本内容已经取不到了——查操作日志确认不是误删，而是覆盖写入。团队要在 S3 上补齐回滚能力。\n\n最直接的配置是？","o":[{"l":"A","t":"给存储桶配置更严格的存储桶策略，禁止任何人删除对象。"},{"l":"B","t":"把存储桶的存储类别改为归档型，降低成本后自然就能回滚。"},{"l":"C","t":"为存储桶开启加密，加密后对象就不会被覆盖。"},{"l":"D","t":"开启 S3 版本控制（Versioning）——同名对象每次写入都保留历史版本，旧版本可随时取回。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** 正文点明：S3 作制品仓库，配版本控制才有回滚能力——开启 Versioning 后同名对象每次写入都生成新版本、旧版本按版本 ID 保留可取——覆盖写入不再摧毁历史，回滚随时能取到旧内容，问题从机制上消失。\n\n**其他选项为什么错：**\n- A：策略禁删挡不住「写入覆盖」，覆盖不是删除操作。\n- B：存储类别管成本与取回速度，与版本保留无关。\n- C：加密管泄露，不管覆盖。\n\n**关键概念：** S3 制品回滚＝开版本控制；ECR 对应的是不可变标签。","s":"自编·1.3.4"},{"id":"D1-062","d":1,"t":"single","q":"一家公司的安全团队做供应链风险评估时提出：如果公共 npm 源被投毒（恶意版本被发布），团队的构建会直接拉到恶意包——目前所有构建与开发都直连公共源，中间没有任何防护层。团队已在用 CodeArtifact，需要用它的配置能力降低投毒风险。\n\n最贴合的配置是？","o":[{"l":"A","t":"配置上游链（upstream chain）让内部包优先、公共源只作兜底，并配合仓库策略管控取包——公共源被投毒时，内部包不会被动覆盖。"},{"l":"B","t":"把公共 npm 源的地址配置成公司内网 IP，让投毒者无法访问。"},{"l":"C","t":"给每位开发人员发放独立的公共源账号，分散投毒风险。"},{"l":"D","t":"取消依赖包管理，改为全部源码编译，彻底绕开包生态。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** CodeArtifact 的域与仓库层级里，上游链决定取包顺序——内部包优先、外部兜底；再配仓库策略管控，公共源被投毒时内部包不会被动覆盖。正文明确说这是供应链安全的关键配置。\n\n**其他选项为什么错：**\n- B：公共源地址不是内网资源，改成内网 IP 只会让取包全部失败。\n- C：分散账号与投毒防护无关，取包路径没有变。\n- D：放弃包生态成本巨大，也不现实。\n\n**关键概念：** 上游链＝内部优先、外部兜底；这是供应链投毒防护的关键配置。","s":"自编·1.3.4"},{"id":"D1-063","d":1,"t":"single","q":"一个团队同时维护三类制品：npm 依赖包、构建文件产物、容器镜像，目前混放在同一处，已经出现包取不出来、版本历史丢失的问题。团队要为三类制品分别选择正确的仓库并配上各自的关键配置。\n\n正确的选择与配置是？","o":[{"l":"A","t":"三类制品全部放进 ECR，用镜像的分层机制统一管理。"},{"l":"B","t":"依赖包放 CodeArtifact（域与仓库层级）、文件制品放 S3（开版本控制）、容器镜像放 ECR（不可变标签 + 生命周期策略）。"},{"l":"C","t":"三类制品全部放进 S3 一个存储桶，靠目录命名区分。"},{"l":"D","t":"依赖包放 ECR、文件制品放 CodeArtifact、容器镜像放 S3，按字母顺序分配。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 三个服务各管一类货：CodeArtifact 管依赖包（域与仓库层级、上游链），S3 管通用文件制品（开版本控制才有回滚），ECR 管容器镜像（不可变标签与生命周期策略是核心配置）。\n\n**其他选项为什么错：**\n- A：ECR 只管容器镜像，npm 包与散文件不是它的职责。\n- C：S3 单桶混存三类制品，各自的关键配置（上游链、不可变标签）都无从谈起。\n- D：三个服务的能力与制品类型完全错配。\n\n**关键概念：** 仓库对号入座——CodeArtifact 管包、S3 管文件、ECR 管镜像。","s":"自编·1.3.4"},{"id":"D1-064","d":1,"t":"multiple","q":"一个团队在编写制品仓库选型指南，将作为新仓库建设评审的依据。成员写了几条关于三类仓库的表述，架构师要求把正确的挑出来放进指南正文。\n\n关于制品仓库的选型与配置，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"AWS CodeArtifact 适合管理 npm、pip、Maven 等依赖包，域是跨账号共享的顶层容器。"},{"l":"B","t":"ECR 的不可变标签主要用来降低镜像的存储成本。"},{"l":"C","t":"用 S3 存放文件制品时，要开启版本控制（Versioning）才有回滚能力。"},{"l":"D","t":"CodeArtifact 的域必须每个账号各建一个，不能跨账号共享。"},{"l":"E","t":"三类仓库可以随意互换——反正都是存东西的地方。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** CodeArtifact 管依赖包、域是跨账号共享的顶层容器、仓库挂域下——这是它的层级考点；S3 存文件制品必须开版本控制才有回滚——这是 S3 的配置考点。两条都是正文原话级知识点。\n\n**其他选项为什么错：**\n- B：不可变标签管的是版本不被覆盖，降成本靠的是生命周期策略。\n- D：恰恰相反——域就是为跨账号共享设计的顶层容器。\n- E：三类仓库能力各有所长，互换会让关键配置无从落地。\n\n**关键概念：** 域＝跨账号顶层容器；S3 回滚＝版本控制；ECR 防覆盖＝不可变标签。","s":"自编·1.3.4"},{"id":"D1-065","d":1,"t":"single","q":"一个团队的构建产物一直用「latest」这样的固定名字命名，新构建直接覆盖旧产物，下游部署经常拿到不是预期的版本，出了问题也无法定责。平台团队要重新设计版本号策略。\n\n新策略必须满足的核心要求是？","o":[{"l":"A","t":"版本号长度越短越好，方便在控制台展示和口头传达。"},{"l":"B","t":"版本号唯一且单调递增，禁止覆盖——构建号递增（build-123）或语义化版本加构建元数据（1.4.2+build.123）都可行。"},{"l":"C","t":"版本号由部署工程师在部署时现场起名，保证与部署意图一致。"},{"l":"D","t":"版本号使用固定名字（如 latest、stable），靠仓库约定保持稳定。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 版本号策略的关键是唯一且单调、禁止覆盖——构建号递增或语义化版本加构建元数据都满足；只有这样才能保证「看到的版本号就是拿到的那份内容」。\n\n**其他选项为什么错：**\n- A：长度不是考量维度，唯一性才是。\n- C：部署时现场命名让版本号与构建脱钩，追溯链断裂。\n- D：固定名字正是题干问题的根源——覆盖不断，预期落空。\n\n**关键概念：** 版本号唯一且单调，禁止覆盖；构建号或语义化版本+元数据皆可。","s":"自编·1.3.5"},{"id":"D1-066","d":1,"t":"single","q":"一家公司的制品从仓库里看得到版本号，但查不到它对应哪次源码提交、什么时候构建的。审计与复盘都靠人工翻构建历史碰运气。平台团队要在构建环节把追溯信息固化下来。\n\n最直接的做法是？","o":[{"l":"A","t":"把源码提交 ID 与构建时间写进制品（版本文件或镜像标签），制品自带追溯元数据。"},{"l":"B","t":"给每个制品起一个含义丰富的长文件名，把所有信息塞进文件名里。"},{"l":"C","t":"要求审计人员保存每次发布的控制台截图，作为追溯依据。"},{"l":"D","t":"在制品仓库的描述字段里写一句「详见构建记录」，指向语焉不详的外部记录。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 元数据写入是可追溯的根：提交 ID 与构建时间随构建写进制品（版本文件或镜像标签），制品到源码、构建日志的反查链从此自动化成立，不依赖任何人工记录。\n\n**其他选项为什么错：**\n- B：文件名承载的信息有限且易被截断，不是结构化元数据。\n- C：截图不可查询、不可关联，只是人工痕迹。\n- D：一句「详见构建记录」没有建立任何机器可查的关联。\n\n**关键概念：** 把提交 ID 与构建时间写进制品元数据——追溯链的根在这里。","s":"自编·1.3.5"},{"id":"D1-067","d":1,"t":"single","q":"一个团队的 Lambda 函数带着 80 MB 的 PDF 处理依赖，每次改一行业务代码都要重新上传整个 80 MB 的部署包——团队每天发布多次，上传一次要等数分钟，发布慢、回滚也慢。有人建议干脆换成容器镜像形态，但这个函数对冷启动延迟比较敏感。团队想先优化打包方式。\n\n最贴合的优化是？","o":[{"l":"A","t":"把 PDF 处理依赖改成运行时动态从互联网下载，绕开部署包体积。"},{"l":"B","t":"把函数改写成多个更小的函数，让每个部署包都变小。"},{"l":"C","t":"放弃优化，接受 80 MB 包的现状——Lambda 部署包没有大小限制。"},{"l":"D","t":"把公共依赖抽到 Lambda 层（layers）：层版本化、可复用，函数部署包只剩业务代码——发布与回滚都变快。"}],"a":["D"],"e":"**正确答案：D。**\n\n**为什么对：** layers 正是为「常变的」与「不常变的」拆分而生：公共依赖放进层（版本化、可复用），函数包只剩 2 MB 级业务代码——发布快，回滚也快（层不常变，回滚只需换函数代码）。\n\n**其他选项为什么错：**\n- A：运行时从互联网下载依赖不可控也不安全，冷启动还要额外等待。\n- B：拆函数改变的是业务结构，依赖体积问题原样存在。\n- C：zip 部署包解压后 250 MB 上限是硬约束，且大包本身就是发布慢的根因。\n\n**关键概念：** 制品分层＝把常变的（业务代码）与不常变的（公共依赖）拆开。","s":"自编·1.3.5"},{"id":"D1-068","d":1,"t":"multiple","q":"一个团队在评审 Lambda 函数的打包方案：既有高频改动的小型业务函数，也有重依赖的数据处理函数。成员对 zip 与镜像两种形态的选择有分歧，需要按取舍原则统一。\n\n关于 Lambda 打包形态的取舍，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"zip 形态打包快、冷启动快，但体积受解压后 250 MB 的上限约束。"},{"l":"B","t":"镜像形态统一运行时、依赖随便装，上限宽松但冷启动更慢，适合重依赖的函数。"},{"l":"C","t":"镜像形态在所有维度上都优于 zip，应作为默认选择。"},{"l":"D","t":"两种形态没有任何差别，按团队喜好选择即可。"},{"l":"E","t":"zip 形态的体积没有上限，任何大小的依赖都可以打包。"}],"a":["A","B"],"e":"**正确答案：AB。**\n\n**为什么对：** 取舍口吻就是这两条：zip 快（打包快、冷启动快）但体积受限（解压后 250 MB 上限）；镜像统一运行时、依赖随便装但冷启动慢——高频小函数选 zip 加分层，重依赖函数选镜像。\n\n**其他选项为什么错：**\n- C：镜像冷启动更慢是明确劣势，不存在全面优于。\n- D：两种形态的差别正是考点，凭喜好选型会踩上限或冷启动的坑。\n- E：250 MB 是 zip 的硬上限，说反了。\n\n**关键概念：** zip 快而受限、镜像重而全——按函数特征选形态。","s":"自编·1.3.5"},{"id":"D1-069","d":1,"t":"single","q":"一家公司的安全扫描报告显示：生产 EC2 使用的 AMI 一年没更新，累积了 40 个未修复的 CVE。手工重建镜像一次要半天，没人愿意主动做。管理层要求把补丁工作制度化，不再依赖任何人的自觉，安全团队给出的整改窗口是本月内。\n\n最贴合的服务是？","o":[{"l":"A","t":"AWS EC2 Image Builder——定时构建 AMI，自动装组件、跑安全加固与测试，构建完自动分发，补丁不再依赖人工。"},{"l":"B","t":"Amazon EventBridge 定时发通知邮件，提醒工程师每月手动重建一次镜像。"},{"l":"C","t":"AWS Systems Manager 的 Run Command，每周对所有 EC2 实例远程执行一次系统更新脚本。"},{"l":"D","t":"Amazon EC2 Auto Scaling，靠实例自动替换刷新系统环境。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** Image Builder 是托管镜像流水线：schedule 定时触发、组件自动安装与加固、构建后自动测试、分发配置自动复制到多账号多区域——「镜像永远新鲜、审计有据」，正对「不依赖有人记得」的要求。\n\n**其他选项为什么错：**\n- B：提醒邮件的执行者还是人，半天的人肉重建不会因为提醒而消失。\n- C：Run Command 改的是存量实例，没有产出可复用的新 AMI，也不做构建级验证。\n- D：Auto Scaling 只按现有 AMI 替换实例，AMI 本身不更新，替换多少轮都一样。\n\n**关键概念：** 「定期打补丁」「多账号分发」两个关键词想 Image Builder。","s":"自编·1.3.6"},{"id":"D1-070","d":1,"t":"single","q":"一家公司在三个区域运营业务，AMI 构建完成后需要自动出现在三个区域的镜像列表里，供各地的 Auto Scaling 组引用；目前 AMI 只存在于构建所在的区域，其他区域靠人工复制，经常漏。团队已在用 EC2 Image Builder，要配置这个跨区域落地能力。\n\n应该配置 Image Builder 的哪个组件？","o":[{"l":"A","t":"组件（component）——在构建步骤文档里增加跨区域复制的脚本命令。"},{"l":"B","t":"配方（recipe）——在基础镜像清单里登记三个区域的名称。"},{"l":"C","t":"分发配置（distribution）——定义构建完成后自动复制到指定区域与账号的目标清单。"},{"l":"D","t":"计划（schedule）——把定时规则改成每小时一次，加快三个区域的同步。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** Image Builder 四组件各司其职：组件是构建步骤文档、配方是基础镜像加组件清单、计划管定时触发，跨区域跨账号的自动复制由分发配置（distribution）负责——构建完自动出现在指定区域与账号。\n\n**其他选项为什么错：**\n- A：复制不是构建步骤，塞进组件脚本是在托管能力之外自造轮子。\n- B：配方管「用什么基础镜像装什么」，与分发目标无关。\n- D：提高构建频率不改变分发范围，复制目标由分发配置定义。\n\n**关键概念：** 跨区域/跨账号自动复制＝分发配置（distribution）。","s":"自编·1.3.6"},{"id":"D1-071","d":1,"t":"single","q":"一个团队的运维主管提出镜像重建方案：「写一个 shell 脚本，每月 1 号由值班工程师手动运行，脚本里完成基础镜像更新、组件安装和导出。」平台团队认为这个方案达不到生产要求，需要指出差距。\n\n该方案最大的问题是？","o":[{"l":"A","t":"脚本语言过时，应该改用更新的编程语言重写。"},{"l":"B","t":"脚本缺少详细的注释，后续维护者看不懂。"},{"l":"C","t":"它是计划任务加人肉执行——没有托管的自动化与构建后验证，补丁是否生效、服务能否启动都没有机制保障，这正是 EC2 Image Builder 这类托管流水线要解决的问题。"},{"l":"D","t":"执行频率太低，改成每周手动运行一次即可满足要求。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** 考试对镜像重建的要求是托管自动化加验证：定时触发、自动加固、构建后自动测试验证服务能起、自动分发——手工脚本是「计划任务加人肉」，任何一个环节没人盯就断，验证环节更是完全缺失。\n\n**其他选项为什么错：**\n- A：语言新旧不是问题所在，问题在执行模式。\n- B：注释质量与「有没有机制保障」无关。\n- D：提高手动频率放大了人肉依赖，方向反了。\n\n**关键概念：** 镜像重建要托管自动化加验证，不是脚本加人肉——错误项常用「写脚本定期手工运行」。","s":"自编·1.3.6"},{"id":"D1-072","d":1,"t":"multiple","q":"一个团队刚接触 AWS EC2 Image Builder，计划下月上线第一条镜像流水线，成员复述它的四个核心组件时说法不一，架构师要求把正确的表述挑出来，作为评审会前的培训材料。\n\n关于 Image Builder 的组件职责，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"组件（component）是构建步骤文档——装什么包、改什么配置、跑什么验证。"},{"l":"B","t":"配方（recipe）负责把构建结果复制到多个区域与账号。"},{"l":"C","t":"计划（schedule）负责定时触发构建——每月补丁日自动重建全量镜像靠它实现。"},{"l":"D","t":"分发配置（distribution）决定使用哪个基础镜像作为构建起点。"},{"l":"E","t":"计划（schedule）负责定义构建产物分发到哪些账号。"}],"a":["A","C"],"e":"**正确答案：AC。**\n\n**为什么对：** 四组件的职责分工：组件写构建步骤（装包、改配置、跑验证）；配方＝基础镜像加组件清单；分发配置管跨区域跨账号复制；计划管定时触发——A、B 分别对应组件与计划的正确表述。\n\n**其他选项为什么错：**\n- B：跨区域复制是分发配置的职责，配方只管构建起点与步骤清单。\n- D：基础镜像由配方决定，分发配置管的是产物的去向。\n- E：又是张冠李戴——计划管时间，不管目标。\n\n**关键概念：** 四组件记法——组件写步骤、配方定起点、分发管去向、计划管时间。","s":"自编·1.3.6"},{"id":"D1-073","d":1,"t":"single","q":"一个平台团队同时维护三类工作负载：EC2 上的传统服务、ECS 上的容器应用、Lambda 上的 API 函数。新同事经常混淆三类平台的部署单位，导致部署方案评审时驴唇不对马嘴。架构师要求先统一「部署单位」的概念。\n\n三类平台的部署单位分别是？","o":[{"l":"A","t":"三类平台都以容器镜像为部署单位，只是运行环境不同。"},{"l":"B","t":"EC2 是实例（AMI 加部署组）、ECS 是任务定义（镜像加资源配额）、Lambda 是版本与别名。"},{"l":"C","t":"EC2 是任务定义、ECS 是实例、Lambda 是部署组，按资源层级排列。"},{"l":"D","t":"三类平台都以 Auto Scaling 组为部署单位，由负载均衡器统一切流。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** 平台差异是部署落地的主线：EC2 的部署单位是实例（AMI 加部署组）；ECS 是任务定义（镜像加资源配额），服务滚动更新；Lambda 是版本与别名——版本不可变、别名是可移动的流量指针。\n\n**其他选项为什么错：**\n- A：EC2 传统服务与 Lambda 函数不以容器为部署单位。\n- C：三个概念正好张冠李戴，部署组是 EC2 的概念。\n- D：Auto Scaling 组与负载均衡切流是 EC2 蓝绿的具体机制，不是三平台通用的部署单位。\n\n**关键概念：** 平台定部署单位——EC2 实例、ECS 任务定义、Lambda 版本加别名。","s":"自编·1.4.1"},{"id":"D1-074","d":1,"t":"single","q":"一个团队在学 Lambda 的部署模型：有人把「版本」和「别名」混为一谈，有人以为发布新版本会改动旧版本的内容。架构师用两个比喻讲清楚：一个是不可变的快照，一个是可移动的指针。\n\n关于 Lambda 版本与别名，正确的理解是？","o":[{"l":"A","t":"版本发布后仍可修改代码内容，别名则固定指向第一个版本不再变化。"},{"l":"B","t":"别名是不可变的快照，版本是可移动的指针，两者角色正好相反。"},{"l":"C","t":"版本不可变——发布后内容永不改变；别名是可移动的流量指针，指向哪个版本由路由配置决定。"},{"l":"D","t":"发布新版本会自动覆盖旧版本内容，旧流量无法回到旧版本。"}],"a":["C"],"e":"**正确答案：C。**\n\n**为什么对：** Lambda 版本不可变——发布即快照，内容永不改变；别名是可移动的流量指针，指向哪个版本由路由配置决定。「部署即切流」的设计让 Lambda 成为三个平台里最接近金丝雀原生的。\n\n**其他选项为什么错：**\n- A：版本一旦发布就不可变，可改的是别名的指向。\n- B：两个概念的角色说反了。\n- D：版本不覆盖不销毁，别名指回去就回到旧版本。\n\n**关键概念：** 版本＝不可变快照，别名＝可移动指针；回滚就是把指针指回去。","s":"自编·1.4.1"},{"id":"D1-075","d":1,"t":"single","q":"一个容器应用的镜像已推送到 ECR，团队要在 ECS 上发布新版本：更新镜像引用与资源配额后，让服务把存量任务逐步替换成新版本，替换期间服务不可中断。团队要确定发布动作的对象与机制，避免用错平台机制。\n\n这个发布动作的对象与机制是？","o":[{"l":"A","t":"直接登录每台容器实例手动 docker run 新镜像，替换旧进程。"},{"l":"B","t":"更新任务定义（新镜像与资源配额），由服务按滚动更新逐步替换存量任务。"},{"l":"C","t":"把新镜像文件通过 SSH 复制到实例上覆盖旧文件，重启容器进程。"},{"l":"D","t":"删除整个 ECS 集群重建，让所有服务以新镜像重新启动。"}],"a":["B"],"e":"**正确答案：B。**\n\n**为什么对：** ECS 的部署单位是任务定义（镜像加资源配额）：发布新版本就是更新任务定义，服务按滚动更新逐步把存量任务替换为新版本——平台原生机制保证替换过程服务可用。\n\n**其他选项为什么错：**\n- A：手动 docker run 绕开了任务定义与服务编排，ECS 不感知这次「部署」。\n- C：SSH 覆盖文件是可变部署的手工作坊形态，环境一致性无从保证。\n- D：重建集群是推倒重来，存量服务会整体中断。\n\n**关键概念：** ECS 发布＝更新任务定义 + 服务滚动更新。","s":"自编·1.4.1"},{"id":"D1-076","d":1,"t":"multiple","q":"一个团队在编写「三类平台部署方法」的内部培训材料，材料将发给全体交付工程师，表述错误会造成大面积误用。成员写了几条表述，架构师要求把正确的挑出来。\n\n关于各平台的部署方法，下列说法正确的两项是？（请选择两项）","o":[{"l":"A","t":"E
