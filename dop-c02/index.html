aling 生命周期钩子是特例——实例扩缩事件可挂自定义动作（如新实例自动打标签、装监控），钩子等动作完成再放行。\n\n#### 案例\n\n合规要求「新增的 EBS 卷必须立即加密」。他们在 EventBridge 建 CloudTrail 事件规则匹配 CreateVolume，目标 Lambda 检查加密属性——未加密的自动创建加密副本替换并告警。新资源落地的瞬间就被规则覆盖。\n\n**考试判断**：题干给「某类事件发生后自动改配置」——EventBridge 规则接 CloudTrail 事件触发动作，链路四件套要答全：事件源、规则、目标、IAM 权限。漏掉「给执行角色授权」是常见错误项——链路能画出来但跑不动。\n\n**落地细节**：Lambda 调 API 改资源要处理失败——API 限流与部分失败要有重试，否则变更半途而废。事件去重也重要：同一条事件可能被重复匹配，动作必须幂等。易漏项是执行角色授权——EventBridge 目标角色要能调对应 API，权限不齐链路静默失败。失败可配死信队列兜底，别让事件无声消失。重试次数要设上限。\n\n**关联服务**：Amazon EventBridge、AWS Lambda、AWS Systems Manager、AWS CloudFormation、AWS CloudTrail。\n\n#### 修复非期望的系统状态\n\n**这条在问什么**：系统偏离期望状态（配置漂移、违规变更、故障态）后怎么自动拉回来——这是 D4 Config 修复的深化，考完整闭环的设计。\n\n**核心机制**：闭环四环节——发现、评估、修复、验证。发现靠 Config 规则或自定义检测，评估出不合规清单与严重度。修复用 SSM Automation 或 Lambda 执行纠正，验证靠修复后规则复评确认回归合规。修复动作要幂等——同一动作跑多次结果一致，否则重试会制造新问题。自动修复与人工修复按风险分级：低风险全自动，高风险先通知再人工确认。\n\n#### 案例\n\n一个团队管着几百个 S3 桶，合规基线是「全桶开默认加密、禁公开读」。Config 两条规则持续评估，不合规资源挂 Automation 修复——加密缺失的自动补上，公开读的自动关掉。修复完规则复评转绿，全程留痕。\n\n**考试判断**：题干给「发现配置偏离并自动恢复」——Config 规则 + 自动修复。给「实例级故障拉回」——那是 ASG 的活（健康检查替换实例），与配置修复是两条线，题干问哪条答哪条。修复动作选型：改配置类用 Automation 文档，逻辑复杂用 Lambda。\n\n**落地细节**：闭环要防死循环——修复动作本身触发新事件又再修复，配置上要区分「用户操作」与「自动修复」的事件来源。修复记录是审计素材，保留期按合规要求定。\n\n**关联服务**：AWS Config（规则、自动修复）、AWS Systems Manager（Automation）、AWS Lambda、AWS CloudFormation（漂移检测）。\n\n---"},{"h":"排障系统与应用故障","body":"#### 这一节学什么\n这一节对应考纲任务 5.3「排障系统与应用故障」。\n\n**这条任务在问什么**：失败已经发生——部署没上去、扩缩容没生效、容器起不来。这个任务考的是排查路径：从哪类失败入手、用什么工具看什么证据、怎么走到根因。它是 D4 分析能力的实战应用，也是全域的收口：事件响应做得再好，最终都要有人能回答「为什么失败」。\n\n**原理铺垫（本任务 Knowledge 条目并入此处）**：\n\n排查工具箱（5.3.1）两件主力。CloudWatch 看指标与日志，部署相关的构建日志、部署组事件日志都在。X-Ray 看跨服务请求链路，哪一段延迟异常、哪个下游报错一目了然。服务健康视角（5.3.2）要分清「我的问题」和「平台的问题」。AWS Health 的控制台与事件通告说平台侧出了什么事，CloudWatch 综合看自己应用的状态。SSM OpsCenter 把运维事件（OpsItem）集中成工单，一条事件关联相关资源与操作手册，适合当响应中枢。工单要关闭复盘，别留尾巴。\n\n根因分析（5.3.3）的方法论一句话：从现象倒推，按链路逐段验证。不要从最可疑处直接跳结论。常用追问链有四问。什么时间开始，对齐变更记录。影响面多大，全量还是部分。链路上哪段先异常，指标与日志交叉定位。那段最近改过什么，变更即嫌疑人。考试题里「最快定位根因的动作」往往就是这条链上靠前的一步。\n\n#### 分析部署失败（CodePipeline / CodeBuild / CodeDeploy / CloudFormation / 合成监控）\n\n**这条在问什么**：发布没成功——流水线卡住、构建报错、部署组失败、模板回滚。部署失败的排查路径与运行时失败不同，这是骨架点名的失分点：部署失败看「发布链」的证据，运行时失败看「运行面」的证据，起点别走错。\n\n**核心机制**：按发布链逐段看证据。CodePipeline 卡住——看该阶段的执行历史与审批状态，转移失败常见是 IAM 权限与制品边界。CodeBuild 失败——构建日志是第一现场，依赖下载失败、测试不过、环境缺组件都在里面。CodeDeploy 失败，部署组事件日志给出每台实例的失败原因。钩子脚本退出码、权限不足、健康检查超时各是不同方向。部署配置可设自动回滚。\n\nCloudFormation 失败，事件列表按资源倒序看。第一个 FAIL 的资源就是根因入口，回滚策略看栈状态。合成监控（CloudWatch Synthetics）的 canary 从外部持续探测关键路径，部署后立刻失败说明「上去了但不可用」——部署成功与业务可用是两回事。canary 失败自动告警。\n\n#### 案例\n\n一次发布后流水线标红。排查顺序：Pipeline 阶段历史定位卡在哪一环——Build 阶段失败进构建日志，看到某依赖包拉取超时；换国内镜像源重跑通过。全程没动应用代码，是构建环境的外部依赖问题。\n\n**考试判断**：题干给「发布失败、流水线红」——沿发布链排查（Pipeline → Build → Deploy → 栈事件）。给「发布成功但用户报错」——那是运行时失败，转流程失败排查一节（5.3.5）的路径，别在发布链里打转。合成监控的定位是「部署后可用性验证」，题干带「外部探测」「定时拨测」就选它。\n\n**关联服务**：AWS CodePipeline、AWS CodeBuild、AWS CodeDeploy、AWS CloudFormation、Amazon CloudWatch Synthetics。\n\n#### 分析流程失败类事件（自动扩缩、ECS、EKS）\n\n**这条在问什么**：运行时链路失败——扩容没扩出来、容器反复重启、任务调度失败。这类失败的排查靠「期望与实际的差值」：系统想要什么、实际拿到什么、差在哪一步。\n\n**核心机制**：自动扩缩失败的排查链，第一现场是扩缩活动历史（Scaling Activity History）。里面记着每次扩缩成败与原因：已达最大容量、指标数据不足、冷却期内被跳过、IAM 不够调 API。原因写得明明白白。\n\nECS 失败看任务停止原因（stopped task reason）——镜像拉不到、端口冲突、内存超限、健康检查杀掉各有特征；服务事件流（service events）记录调度层面的失败。EKS 看 Pod 事件。Pending 多是资源不足或调度约束。CrashLoopBackOff 看容器日志与探针配置，ImagePullBackOff 查镜像名与仓库凭证。X-Ray 补链路视角：请求级失败定位到具体下游调用。\n\n#### 案例\n\n高峰期应用变慢，预期扩容却没发生。查扩缩活动历史：策略已触发，但扩容请求因「已达组最大容量」被拒。临时上调上限解燃眉，回头按真实峰值重新定容量边界。这类题在考试里就考「能不能想到去看活动历史」。\n\n**考试判断**：题干给「扩容没生效」——先看扩缩活动历史，别急着改策略；给「容器一直重启」——ECS 看任务停止原因，EKS 看 Pod 事件与容器日志。两类失败的第一现场都是「平台替你记好的历史」，考试考的就是知不知道去哪看。先看证据，再下结论。\n\n**关联服务**：Amazon EC2 Auto Scaling、Amazon ECS、Amazon EKS、AWS X-Ray、Amazon CloudWatch。\n\n---"}],"tips":{"points":"| 考点 | 一句话记忆 | 出现频率 |\n|---|---|---|\n| Step Functions vs Lambda 编排 | 有分支重试状态管理上 Step Functions，单步转换直接 Lambda | ⭐⭐⭐ |\n| EventBridge 模式语法 | source 与 detail-type 写错规则永不命中；先测试事件再挂生产 | ⭐⭐⭐ |\n| 部署失败 vs 运行时失败 | 发布链证据（构建日志/栈事件）与运行面证据（扩缩历史/Pod 事件）起点不同 | ⭐⭐⭐ |\n| 扩缩失败第一现场 | Scaling Activity History 写明每次成败与原因 | ⭐⭐⭐ |\n| AWS Health 事件接入 | 经 EventBridge 规则匹配后自动响应「影响我账户」的通告 | ⭐⭐ |\n| 扇出/流/队列三形态 | 分发用 SNS，保序吞吐用 Kinesis，削峰用 SQS | ⭐⭐ |\n| 事件驱动改配置闭环 | 事件源 → 规则 → 目标动作 → IAM 授权，四件缺一不可 | ⭐⭐ |\n| 自动修复幂等 | 重复执行结果一致才安全，防修复死循环 | ⭐ |\n| 根因分析追问链 | 时间 → 影响面 → 链路首异常段 → 最近变更 | ⭐ |\n| 合成监控定位 | 部署后外部拨测验证可用性，部署成功≠业务可用 | ⭐ |","services":"| 服务 | 在本域的角色 |\n|---|---|\n| Amazon EventBridge | 事件总线：三源汇入、模式匹配、路由分发 |\n| AWS Step Functions | 多步骤流程的状态机编排 |\n| AWS Lambda | 单步事件处理与自动化动作执行件 |\n| Amazon SNS / SQS / Kinesis | 扇出通知 / 缓冲队列 / 有序流三形态 |\n| AWS Systems Manager | 机群变更执行（Run Command / State Manager / Automation） |\n| AWS Config | 配置合规评估与事件驱动修复的发现端 |\n| AWS CloudTrail | API 操作事件源 |\n| AWS Health | 平台侧健康通告事件源 |\n| AWS CloudFormation | 模板化变更与栈事件排查 |\n| AWS CodePipeline / CodeBuild / CodeDeploy | 发布链三环节的失败证据所在 |\n| Amazon CloudWatch（含 Synthetics） | 指标日志排查与部署后外部拨测 |\n| AWS X-Ray | 请求级链路定位 |\n| Amazon EC2 Auto Scaling / ECS / EKS | 运行时失败三类对象：扩缩历史 / 任务事件 / Pod 事件 |\n| SSM OpsCenter | 运维事件集中成工单的响应中枢 |"}},{"domain":6,"name":"安全与合规（Security and Compliance）","weight":"17%","practice":[{"id":"D6-001","d":6,"t":"single","q":"一家公司的工作人员分布在不同国家，公司希望监控 AWS 账户中与 IAM 身份相关的异常行为，并向发现异常活动的工作人员及其团队负责人发送通知。通知由外部消息平台发送，该平台要求每个收件人都有一个目标用户 ID。\n\n公司在 AWS 上已有一个 API，可通过 IAM 用户名查询工作人员与团队负责人的用户 ID；公司通过 AWS Organizations 管理 AWS 账户。\n\n哪一种解决方案符合这些要求？","o":[{"l":"A","t":"在企业中指定一个账户作为 Amazon GuardDuty 管理员，把公司 AWS 账户添加为关联的 GuardDuty 成员账户；创建 AWS Lambda 函数执行用户 ID 查询并向外部平台发送通知；在 GuardDuty 管理员账户中创建 Amazon EventBridge 规则，匹配 Impact:IAMUser/AnomalousBehavior 通知类型并调用该函数。"},{"l":"B","t":"在企业中指定一个账户作为 Amazon Detective 管理员，把公司 AWS 账户作为关联的 Detective 成员账户；创建 AWS Lambda 函数执行用户 ID 查询并向外部平台发送通知；在 Detective 管理员账户中创建 Amazon EventBridge 规则，匹配 Impact:IAMUser/AnomalousBehavior 通知类型并调用该函数。"},{"l":"C","t":"在企业中指定一个账户作为 Amazon GuardDuty 管理员，把公司 AWS 账户添加为关联的 GuardDuty 成员账户；创建 AWS Lambda 函数执行用户 ID 查询并向外部平台发送通知；在 GuardDuty 管理员账户中创建 Amazon SNS 主题，按 Impact:IAMUser/AnomalousBehavior 通知类型筛选消息并调用该函数。"},{"l":"D","t":"在企业中指定一个账户作为 Amazon Detective 管理员，把公司 AWS 账户作为关联的 Detective 成员账户；创建 AWS Lambda 函数执行用户 ID 查询并向外部平台发送通知；在管理员账户中创建 Amazon SNS 主题，按 Impact:IAMUser/AnomalousBehavior 通知类型筛选消息并调用该函数。"}],"a":["A"],"e":"**正确答案：A。**\n\n**为什么对：** 监控 IAM 异常行为要用 GuardDuty：它的发现结果会作为事件发布到 EventBridge，规则按发现类型（Impact:IAMUser/AnomalousBehavior）匹配后可直接把 Lambda 设为目标，由函数查 API 得到用户 ID 并推送外部平台。多账户场景下，用管理员/成员关联把各账户发现集中到管理员账户统一处理，与 Organizations 结构天然配合。\n\n**其他选项为什么错：**\n- B、D：Detective 本身不产生异常检测，它只对已有发现提供分析与可视化。\n- C、D：SNS 按消息属性筛选，不能按消息内容匹配发现类型；要用 EventBridge 规则匹配后再转发。\n\n**关键概念：** GuardDuty 出发现 → EventBridge 按类型路由 → Lambda 定制通知；Detective 只做分析不做检测。","s":"官方样题#7"},{"id":"D6-002","d":6,"t":"single","q":"一家公司在 AWS Organizations 下管理着三十多个账号。某团队提交的操作满足三个条件：该账号的 IAM 身份策略明确允许这个动作，目标桶的资源策略也允许，但组织挂在该账号所在 OU 上的 SCP 对这个动作写了显式拒绝。安全评审让大家判断这次调用的最终结果。\n\n按照策略评估规则，结果是什么？","o":[{"l":"A","t":"允许——身份策略与资源策略两层都放行，评估已经通过，SCP 不参与同一账号内的判断。"},{"l":"B","t":"允许——只要存在任意一层允许，策略评估就取最宽结果，显式拒绝只在身份策略内部生效。"},{"l":"C","t":"拒绝——SCP 是账号级天花板，任何一层显式拒绝即生效，允许再多层也压不过拒绝。"},{"l":"D","t":"拒绝——资源策略与身份策略冲突时以资源策略为准，本题里资源策略实际写的是拒绝。"}],"a":["C"],"e":"**正确答案：C。**\n\nAWS 的授权判定是各层取交集：身份策略、资源策略、SCP、权限边界任何一层说不允许，最终就是不允许，显式拒绝永远赢。SCP 挂在组织与 OU 上，是账号级天花板，账号内的策略写得再宽也超不出它。\n\n- A：错在以为 SCP 不参与判断，它对账号内所有主体都生效。\n- B：错在「取最宽」这种评估逻辑不存在，必须每一层都允许。\n- D：两者并不冲突，本题的拒绝来自 SCP，与资源策略的内容无关。\n\n记忆点：显式拒绝永远赢，允许要层层都点头。","s":"自编·6.1.5"},{"id":"D6-003","d":6,"t":"single","q":"平台团队要把权限管理委派给各业务团队的管理员：团队自己维护成员的 IAM 策略，但公司规定所有团队一律不许访问账单与成本数据，这条红线不能依赖团队自觉遵守。评审会上讨论用哪层机制兜住这条线。\n\n最合适的设计是什么？","o":[{"l":"A","t":"在每个成员的身份策略里删掉账单相关动作，红线靠团队自律与定期人工巡检兜底。"},{"l":"B","t":"给每个团队管理员的委派角色挂权限边界，边界里排除账单动作，策略再宽也越不过边界。"},{"l":"C","t":"把账单服务的资源策略改成全部拒绝，身份策略随便写，最终会被资源策略拦住。"},{"l":"D","t":"提高审批门槛，团队每次要开账单权限都走工单，审批通过后由平台团队手动开通。"}],"a":["B"],"e":"**正确答案：B。**\n\n权限边界就是给「可委派权限的管理员」用的护栏：被委派的人怎么配策略都超不出边界，这是机制保证而不是流程约束。题干红线要求「不靠自觉」，只有边界、SCP 这类机制层能兜住；单团队范围的落法选边界最贴。\n\n- A：靠自觉与巡检不满足机制保证的要求，巡检总有漏网窗口。\n- C：账单与成本类动作没有对应资源策略可挂，这条路走不通。\n- D：审批是流程控制，挡得住申请挡不住误配，且运营成本高。\n\n记忆点：边界收窄委派权限，红线要落在机制层。","s":"自编·6.1.5"},{"id":"D6-004","d":6,"t":"single","q":"某开发角色的身份策略里同时写了：对某日志组的一组读动作允许，又对其中一个删除动作写了显式拒绝。该角色所在账号的 SCP 与权限边界对这个动作都没有额外限制。运维新人判断不了这个角色能不能执行删除动作，来问值班同学。\n\n正确的判断是什么？","o":[{"l":"A","t":"不能——显式拒绝在评估里优先级最高，同一层里的允许压不过它。"},{"l":"B","t":"能——显式拒绝只在跨策略类型冲突时才生效，身份策略内部以允许为准。"},{"l":"C","t":"不能——身份策略内部出现拒绝时整条策略作废，该角色的所有动作都会被拦。"},{"l":"D","t":"能——SCP 与权限边界没有限制就代表默认允许，删除动作按允许处理。"}],"a":["A"],"e":"**正确答案：A。**\n\n同一条身份策略里允许与拒绝同时命中时，显式拒绝优先，删除动作被拦。SCP 与权限边界本题没有额外限制，不影响这个结论——它们若有限制，也只会更严不会更宽。\n\n- B：显式拒绝在任何策略类型里都最高优先，不存在「同层以允许为准」的规则。\n- C：拒绝只作用于被拒的动作，不会让整条策略作废，读动作照常可用。\n- D：没有额外限制不等于默认允许，允许仍须由策略显式给出。\n\n记忆点：显式拒绝永远赢，无限制不等于默认放行。","s":"自编·6.1.5"},{"id":"D6-005","d":6,"t":"multiple","q":"组长让新入职的同学把最小权限三层收敛的要点整理成笔记，说这部分内容新人最容易把「收窄」和「放大」搞反，整理完要在组会上讲一遍，讲错会被老员工当场纠正，笔记定稿后留档。\n\n下列笔记正确的有哪些？（多选）","o":[{"l":"A","t":"第一层用 SCP 划账号级天花板，比如全组织禁用某区域的操作，账号内谁也超不过。"},{"l":"B","t":"第二层用 IAM 身份策略写具体允许的动作与资源 ARN，权限写到动作级而不是服务级。"},{"l":"C","t":"第三层权限边界用来给委派角色追加更高权限，让管理员能突破原本的限制。"},{"l":"D","t":"最终权限是各层取交集，任何一层说不允许，最终结果就是不允许。"},{"l":"E","t":"允许与拒绝同时命中时以允许为准，显式拒绝只对跨账号的访问生效。"}],"a":["A","B","D"],"e":"**正确答案：ABD。**\n\n三层收敛的要点：SCP 划账号天花板、IAM 策略写具体动作与资源、权限边界封住委派链，最终权限取交集。C 把边界说成放大，E 把评估优先级说反，两处都是新人最易搞混的点，也是骨架点名的失分方向。\n\n- C：权限边界给委派角色做的是封顶，被委派的人写得再宽也越不过边界，不可能用它追加更高权限。\n- E：评估里显式拒绝永远优先，同一层里的允许压不过它，是不是跨账号访问不改变这条规则。\n\n记忆点：边界收窄不放大，判定取交集，拒绝最优先。","s":"自编·6.1.5"},{"id":"D6-006","d":6,"t":"single","q":"安全审计发现一条挂在数据处理角色上的身份策略写得太宽：动作是对整个 s3 服务的全部操作放行，资源写成通配符，而实际业务只需要读取一个指定前缀下的对象。整改要求把这条策略收敛到最小权限且不影响业务。\n\n最合理的改法是什么？","o":[{"l":"A","t":"动作保持全部放行，把资源收窄到桶级别，桶内所有对象继续可读，业务完全无感。"},{"l":"B","t":"资源保持通配不变，把动作收窄到只读类操作，靠动作收敛兜住访问范围。"},{"l":"C","t":"在策略里追加一条显式拒绝写操作，允许部分原样保留，用拒绝条款压制过宽的允许。"},{"l":"D","t":"动作收窄到对象读取类操作，资源收窄到指定前缀的对象 ARN，两个维度同时收敛。"}],"a":["D"],"e":"**正确答案：D。**\n\n最小权限的收敛要动作与资源两个维度同时做：业务只读指定前缀，那就把动作收到读取类、资源收到该前缀的对象 ARN，多一点都不留。只收一维都会留下明显过宽的面。\n\n- A：资源只收到桶级，桶内其他前缀依旧可读，仍明显超出业务需要。\n- B：资源还是通配符，跨桶的同名动作照样放行，面没有收住。\n- C：用拒绝条款压制是打补丁，策略本体还是过宽，审计上仍会被判不合格。\n\n记忆点：最小权限按动作与资源双维收敛，不打拒绝补丁。","s":"自编·6.1.5"},{"id":"D6-007","d":6,"t":"single","q":"公司合规新规要求：所有账号一律不许在欧洲中部区域创建资源，历史遗留资源限期迁移。这条要求要覆盖组织内全部现有账号与未来新建账号，且不能被账号内管理员绕过或私自关闭。平台团队讨论用哪个机制落地。\n\n最合适的机制是什么？","o":[{"l":"A","t":"在每个账号部署 Config 规则检测该区域的资源，发现后通知管理员手工清理。"},{"l":"B","t":"在组织层面挂 SCP，对该区域的服务动作写显式拒绝，账号内无法绕过也无法关闭。"},{"l":"C","t":"用 IAM 权限边界统一收敛，给每个账号管理员的角色都挂上排除该区域的边界。"},{"l":"D","t":"发公司通知要求各团队遵守，每季度做一次合规审计，违规团队通报并限期整改。"}],"a":["B"],"e":"**正确答案：B。**\n\n「全组织、防绕过、防关闭」三个条件指向 SCP：它挂在组织与 OU 上对账号内所有主体生效，账号管理员无权修改或关闭，新建账号挂上组织结构就自动继承。\n\n- A：Config 只做检测，动作照样能发生，不满足「不许创建」的硬约束。\n- C：边界只管被挂了边界的角色，新建角色与未纳管身份不在覆盖面内。\n- D：通知与审计都是管理手段，挡不住即时操作，也不满足防绕过要求。\n\n记忆点：组织级硬禁令落 SCP，检测类机制兜不住「不许做」。","s":"自编·6.1.5"},{"id":"D6-008","d":6,"t":"single","q":"某团队管理员拿到一个被委派的自治角色，权限边界限定在计算与存储类服务。他希望给自己追加管理员级权限方便日后操作，于是在自己的身份策略里写了全部服务的允许动作，提交后执行时依然被拒。他不明白原因，来问平台团队。\n\n原因是什么？","o":[{"l":"A","t":"身份策略的通配写法不被 IAM 支持，全部服务必须逐个列出，语法修正后即可通过。"},{"l":"B","t":"账号级 SCP 默认拒绝管理类动作，管理员权限在任何账号里都要先走组织审批。"},{"l":"C","t":"权限边界先于他的策略生效，边界没放行的动作写得再宽也越不过去。"},{"l":"D","t":"新策略有生效延迟周期，提交后要等评估刷新，过一段时间重试就能通过。"}],"a":["C"],"e":"**正确答案：C。**\n\n权限边界先于实体自己的策略生效：最终权限是身份策略与边界的交集，边界只放行计算与存储，管理员级动作不在其中，身份策略写得再宽也会被边界压住。这正是「边界收窄委派权限」的设计意图——委派链没有失控。\n\n- A：通配符写法是合法语法，问题不在语法而在边界。\n- B：题干没说 SCP 有限制，把原因归到审批属于臆测。\n- D：策略变更基本即时生效，不存在要等待的评估刷新周期。\n\n记忆点：边界先于策略生效，委派权限永远封顶在边界内。","s":"自编·6.1.5"},{"id":"D6-009","d":6,"t":"single","q":"一家电商公司有几百个资源按项目分组，团队只允许访问本项目的资源。运维负责人不想在每开一个新项目时都改一遍策略文件，希望权限随资源自动生效，减少人工维护。评审会上让大家给方案。\n\n最合适的访问控制模式是什么？","o":[{"l":"A","t":"RBAC——按项目各建一个用户组，权限策略挂组上，新项目开组并挂一份新策略。"},{"l":"B","t":"ABAC——主体与资源都按项目打标签，策略用标签条件匹配，新资源打上标签即被覆盖。"},{"l":"C","t":"资源策略——每个资源单独写资源策略指定允许的团队，新项目逐个资源补策略。"},{"l":"D","t":"ACL——沿用访问控制列表逐条授权，新项目按清单把团队成员加进访问列表。"}],"a":["B"],"e":"**正确答案：B。**\n\n题干的关键诉求是「新项目不改策略」：ABAC 的载体是标签，主体与资源标签匹配即放行，新资源打上正确的标签就自动被既有策略覆盖，这正是 ABAC 规模化优势的标准场景。\n\n- A：每个新项目都要开组挂策略，恰恰是要继续改策略，诉求没满足。\n- C：逐资源写资源策略的维护量比组策略更大，规模化更差。\n- D：ACL 逐条维护是更重的老模式，与自动生效背道而驰。\n\n记忆点：资源多、按属性分组、不想改策略，三个特征选 ABAC。","s":"自编·6.1.6"},{"id":"D6-010","d":6,"t":"single","q":"一个十人小团队维护的内部系统只有十几个资源，岗位分工固定：开发、测试、运维三类角色，权限半年都不变一次。新来的同学提议引入按标签匹配的属性授权把权限做细，老员工提醒他先看规模再选型，别为了先进而先进。\n\n正确的选型判断是什么？","o":[{"l":"A","t":"上 ABAC——标签授权是更先进的模式，小团队也应当尽早对齐行业最佳实践。"},{"l":"B","t":"上 ABAC——先把标签规范立起来，将来资源多了就不用再改，现在的投入算提前还债。"},{"l":"C","t":"上 RBAC——但要用用户组嵌套实现标签语义，两层结构兼顾灵活与规模。"},{"l":"D","t":"上 RBAC——岗位固定、资源不多，按职能分组授权就够，引入 ABAC 是过度设计。"}],"a":["D"],"e":"**正确答案：D。**\n\nRBAC 与 ABAC 的选型分界在规模与变化频率：岗位固定、资源少、权限稳定，RBAC 的用户组模式维护成本最低；ABAC 的优势要在资源多、属性变化频繁时才体现，提前引入还要额外背一套标签治理。\n\n- A：模式没有绝对先进，脱离规模谈先进就是过度设计。\n- B：为不存在的规模提前投入标签治理，成本花在不产生收益的地方。\n- C：用户组嵌套造不出标签语义，两层结构只增加维护复杂度。\n\n记忆点：岗位固定规模小用 RBAC 就够，别过度设计。","s":"自编·6.1.6"},{"id":"D6-011","d":6,"t":"multiple","q":"团队要把 ABAC 模式落到生产权限管理上，组长要求先把落地的关键点过一遍评审：哪些前提要先立、哪些细节容易踩坑，评审通过的条目写进落地方案，没通过的当场修改再过。\n\n下列说法正确的有哪些？（多选）","o":[{"l":"A","t":"上线前先立标签治理：标签键命名、必打标签清单、打错的纠正流程三样齐了，才敢把权限押在标签上。"},{"l":"B","t":"标签打错也没关系，策略评估会自动忽略不匹配的标签条件，不会造成权限异常。"},{"l":"C","t":"标签条件运算符常用两个就够用：StringEquals 做精确匹配，StringLike 做前缀通配匹配。"},{"l":"D","t":"ABAC 的策略文件每新增一个项目就要新增一份，标签只是辅助备注，不参与权限判定。"},{"l":"E","t":"环境标签可以区分生产与测试，同一个项目的生产库，测试角色的标签不匹配就自然够不着。"}],"a":["A","C","E"],"e":"**正确答案：ACE。**\n\nABAC 把权限押在标签上，标签质量就是权限质量，所以标签治理必须先行；条件运算符记住精确匹配与前缀通配两个就够；环境标签的隔离效果正是 ABAC 粒度优势的体现。B、D 是两类典型误解，评审时要当场纠。\n\n- B：标签打错权限就错，打错的标签会让人拿到不该拿的权限或丢掉应有权限。\n- D：说反了 ABAC 的核心价值——标签参与权限判定，新项目打标签即可，恰恰不用新增策略文件。\n\n记忆点：标签即权限，治理先行；条件运算符两件套。","s":"自编·6.1.6"},{"id":"D6-012","d":6,"t":"single","q":"一家公司的权限体系已经按岗位建好了用户组与组策略，运行稳定。后来发现同一岗位的团队之间，环境级细分管不住：开发岗在不同环境里的权限应该不一样，生产环境要额外收窄。架构师要在现有体系上给混用方案。\n\n最合理的混用设计是什么？","o":[{"l":"A","t":"RBAC 管大框架按岗位分组授权不动，资源级的环境细分用 ABAC 标签条件叠加实现。"},{"l":"B","t":"全部推翻改成 ABAC，岗位也做成标签，用户组与组策略全部下线一步到位。"},{"l":"C","t":"保留 RBAC，环境细分用复制用户组实现，每个环境复制一套组，组名带环境后缀。"},{"l":"D","t":"环境细分靠人工审批，开发要碰生产环境时走工单临时开通，用完手动回收。"}],"a":["A"],"e":"**正确答案：A。**\n\n混用的标准形态是各管一层：RBAC 按岗位管大框架已经稳定，不推倒；环境级细分是资源属性问题，用标签条件叠加最自然——生产资源打生产标签，策略条件不匹配就进不去。\n\n- B：推翻重来成本大，岗位维度 RBAC 本来就是合适的载体。\n- C：按环境复制用户组，组数量随环境翻倍，维护量爆炸。\n- D：人工审批解决不了系统性收窄，每次开通回收都是风险点。\n\n记忆点：RBAC 管大框架，ABAC 管资源级细分，混用不推翻。","s":"自编·6.1.6"}],"sections":[{"h":"实施规模化的身份与访问管理技术","body":"这个域考的是安全与合规的**自动化**，权重 17%。注意命题角度：不是考「安全是什么」，是考怎么把安全控制塞进流水线与多账号框架，让它自动生效、自动取证。SCS-C03 考「设计检测与响应体系」，DOP-C02 考「把安全做成工程问题」——两个考试的重叠域，但落点不同，备考时别拿 SCS 的深度来套。学习主线三条：身份与权限规模化、安全控制自动化、审计与告警。三条都要落到「代码化」上，讲成纯策略课就跑题了。\n\n骨架点名的三个失分点都在辨析上。权限边界与 SCP 的叠加效果——两层限制同时生效，取交集。纵深防御里各组件的职责边界——WAF、Shield、Network Firewall、安全组各管一层。Macie 与 Inspector 的用途差别——一个找敏感数据，一个找软件漏洞。每个失分点都会在对应技能点里展开。\n\n#### 这一节学什么\n这一节对应考纲任务 6.1「实施规模化的身份与访问管理技术」。\n\n**任务综述**：身份管理的规模化难点在于「人」和「机器」是两类身份，治理方式完全不同。人要联合认证加 MFA，机器要角色加自动轮换。四条 Knowledge 铺在任务开头讲实体模型，四个技能点分别落在策略设计、访问控制模式、凭据轮换、访问管控上。学员最容易卡的是权限边界与 SCP 的关系——这是本域第一个失分点，放在最小权限一节展开。\n\n**原理铺垫（四条 Knowledge 并入）**：IAM 的实体模型先分两类。给人用的是用户与用户组，给机器用的是角色。身份策略挂在实体上，回答「这个实体能做什么」。资源策略挂在资源上，回答「谁能访问这个资源」。会话策略是临时会话里的天花板，权限再大也超不过它。\n\n身份联合解决「用外部身份登 AWS」：IAM 身份提供方对接 SAML 或 OIDC，IAM Identity Center 把多账号的访问集中管理。权限边界是给「可委派权限的管理员」用的护栏——被委派的人怎么配策略，都超不出边界。SCP 挂在组织 OU 上，是账号级天花板。这四层叠起来的效果见最小权限一节（6.1.5）。\n\n#### 设计强制最小权限的策略\n\n**这条在问什么**：给一批人和一批机器配权限，怎么保证「只给需要的，多的不给」。考试考的不是背策略语法，是考判断哪条策略过宽、哪条够窄。\n\n**核心机制**：最小权限的落法是三层收敛。第一层用 SCP 划账号级天花板，比如全组织禁用某区域的操作。第二层用 IAM 策略写具体允许的动作与资源 ARN。第三层用权限边界封顶，防止被委派的管理员写出过宽策略。判定权限时各层取交集——任何一层说不行，最终就是不行。这就是骨架点名的第一个失分点：**权限边界不是「叠加权限」，是「收窄权限」**。策略评估顺序里，显式拒绝永远赢。\n\n**使用场景与考试判断**：题干给「管理员委派团队自管权限，但要保证团队拿不到账单数据」——答案是权限边界或 SCP 二选一按层级落，而不是改 IAM 策略。题干问「策略 A 允许、资源策略允许、SCP 拒绝，最终结果」——答案是拒绝，SCP 是账号天花板。\n\n#### 案例\n\n一个平台团队要给十几个业务团队开放自建权限。做法是每个团队一个 OU 挂 SCP 禁碰组织级资源，再给每个团队一个权限边界角色，团队管理员在边界内自由配策略。某团队想给自己加管理员权限，被边界拦住——边界先于团队策略生效，委派链没有失控。\n\n**关联服务**：AWS Identity and Access Management（IAM）、AWS Organizations（SCP）、AWS IAM Identity Center。\n\n#### 落地 RBAC 与 ABAC 模式\n\n**这条在问什么**：权限怎么组织才不用逐个维护。RBAC 按角色分组授权，ABAC 按标签属性授权——两者的选型与混用是考点。\n\n**核心机制**：RBAC 的载体是 IAM 用户组或按职能划分的角色，权限策略挂组上，人来来去去不用改策略。ABAC 的载体是标签：主体带标签，资源带标签，策略里用条件判断两边标签是否匹配。ABAC 的优势是规模化——新资源打上对的标签就自动被正确的策略覆盖，不用改任何策略文件。代价是要先立标签规范，标签打错权限就错。\n\n**使用场景与考试判断**：题干给「几百个资源按项目分组，团队只访问本项目的资源，新增项目不想改策略」——答案是 ABAC。题干给「按岗位授权、岗位固定、资源不多」——RBAC 就够，别过度设计。混用形态也常考：RBAC 管大框架，ABAC 管资源级细分。\n\n#### 案例\n\n一个电商公司按「部门-环境」两个标签维度管权限。策略里写 `aws:PrincipalTag/department` 等于 `aws:ResourceTag/department` 且环境标签匹配，才放行。新开一个测试环境，资源打上标签就自动纳入管控——运维没有为它写一行新策略。\n\n**落地细节**：ABAC 上线前先立标签治理——标签键命名、必打标签清单、打错的纠正流程，三样齐了才敢把权限押在标签上。粒度可以做到很细：环境标签区分生产与测试，同一个项目的生产库，测试角色的标签不匹配就自然够不着。IAM 的标签条件运算符记两个就够：StringEquals 做精确匹配，StringLike 做前缀通配。\n\n**关联服务**：AWS Identity and Access Management（IAM）、AWS Resource Access Manager、AWS Organizations。\n\n#### 自动化机器身份的凭据轮换\n\n**这条在问什么**：机器用的密钥与口令怎么保证不长期不变。静态凭据泄漏是安全事故的高发源头，自动化轮换是根治手段。\n\n**核心机制**：Secrets Manager 托管密钥并按计划自动轮换，轮换靠 Lambda 函数执行「建新、更新、验证、切旧」四步，数据库类密钥有托管模板可直接用。更好的做法是根本不用静态密钥：任务角色（IAM role）发临时凭证，自动过期自动续，没有轮换问题。两者的选型分界是「对端认不认 IAM」——对端是 AWS 服务用角色，对端是外部系统才用 Secrets Manager。\n\n**使用场景与考试判断**：题干给「应用连外部 SaaS 的 API key 要定期换，人工换老忘」——答案是 Secrets Manager 自动轮换。题干给「EC2 上的应用访问 S3，还在用 Access Key」——正确改法是挂实例角色，不是把 Key 换得更勤。考试爱考这个「方向性判断」：先问能不能消灭静态凭据，再谈轮换。\n\n#### 案例\n\n一个团队维护着三十多套对接外部支付网关的密钥。接入 Secrets Manager 后按 90 天自动轮换，轮换失败发告警。半年后清理时发现：真正需要静态密钥的只剩三套——其余的都改成了 IAM 角色，轮换负担直接消失了。\n\n**落地细节**：轮换四步里最容易被忽略的是「验证」——新密钥建好要先真的连一次对端确认能用，再切换引用，否则切换瞬间业务断连。引用密钥不用明文：应用从 Secrets Manager 按 ARN 取值，环境变量里只放 ARN。密钥名称含日期是有意设计，轮换时新旧两版共存，回滚有依据。\n\n**关联服务**：AWS Secrets Manager、AWS Identity and Access Management（IAM role）、AWS Lambda（轮换函数）、AWS Key Management Service。\n\n#### 管理人员与机器身份的访问权限\n\n**这条在问什么**：人和机器的访问管控各有一套动作——人靠 MFA 与联合登录，机器靠实例角色与 STS 临时凭证。两边混着问是常态。\n\n**核心机制**：人的侧：MFA 强制开启，IAM Identity Center 联合企业身份源，人不用持有长期密钥。机器的侧：EC2 挂实例 profile 拿角色，容器与 Lambda 挂任务角色，跨账号访问用 STS 的 AssumeRole 换临时凭证。临时凭证三件套——访问密钥、会话令牌、过期时间，过期自动失效。这些机制合起来把「长期密钥」从环境里赶出去。\n\n**使用场景与考试判断**：题干给「审计要求控制台登录必须双因素」——MFA 按账号或 Identity Center 统一强制。题干给「跨账号部署账号要用工具账号的权限」——AssumeRole 加会话策略收窄本次会话权限。会话策略只能收窄不能放宽，这个方向也考过。\n\n#### 案例\n\n一个团队的审计整改清单上有三项：全员 MFA、开发人员不许持长期密钥、CI 机器人的权限每季度复核。落法是 Identity Center 强制 MFA，开发改用联合登录，CI 机器人换角色加权限边界。整改完成后再审计，长期密钥存量归零。\n\n**落地细节**：实例 profile 与任务角色有一个共同前提——所在环境要能到达 IAM 或 STS 端点，私有子网要配 VPC 端点，否则凭证拿不到、服务全部不可用，这是高频故障现象。AssumeRole 的会话时长按需设短，权限边界与会话策略都能套在本次代入上。人的侧还有一条：联合登录的用户在 AWS 里映射为临时身份，退出企业身份源，AWS 会话也随之失效。\n\n**关联服务**：AWS IAM Identity Center、AWS Security Token Service（STS）、AWS Identity and Access Management（IAM）、AWS KMS。\n\n---"},{"h":"为安全控制与数据保护应用自动化","body":"#### 这一节学什么\n这一节对应考纲任务 6.2「为安全控制与数据保护应用自动化」。\n\n**任务综述**：这个任务考「把安全控制铺开并让它们组合生效」。多账号多区域怎么自动施加控制是主轴，纵深防御是组合题，敏感数据发现与加密是数据保护的两个抓手。三条 Knowledge 铺在任务开头：网络组件分层、证书与 PKI、数据管理。学员最容易卡的是纵深防御里各组件的职责边界——骨架点名的失分点，放在组合控制一节展开。\n\n**原理铺垫（三条 Knowledge 并入）**：网络安全组件按层分工。安全组是实例级防火墙，默认拒绝、按需放行，有状态。网络 ACL 是子网级防火墙，无状态，按编号顺序评估规则。路由表决定流量往哪走。Network Firewall 在 VPC 级做深度过滤，WAF 在应用层拦 Web 攻击，Shield 挡 DDoS。\n\n证书与 PKI 解决「信任怎么建立」：ACM 托管证书并自动续期，私钥不出服务。数据管理四件事——分类（哪些数据敏感）、加密（静态与传输中）、密钥管理（KMS 或 CloudHSM）、访问控制（谁碰得到）。这四件事在后面的技能点里逐个落成自动化。\n\n#### 在多账号多区域自动施加安全控制\n\n**这条在问什么**：几十个账号、几个区域，安全基线怎么保证「开新账号就自带」。手工逐账号配是命题人给的错误选项，自动化框架才是正解。\n\n**核心机制**：三层组合。Control Tower 在落地上把护栏与合规基线随账号工厂自动下发，新账号开通即纳入治理。Security Hub 汇聚各账号各区域的安全发现，形成统一清单与安全分数，还能跨区域聚合。Organizations 的 SCP 兜底，从账号层面禁掉危险动作。三层的分工一句话：Control Tower 负责「开号即合规」，Security Hub 负责「持续看见」，SCP 负责「硬性禁令」。\n\n**使用场景与考试判断**：题干给「新建账号自动获得合规基线」——Control Tower 账号工厂。题干给「全组织安全发现统一汇总」——Security Hub 跨账号聚合。题干给「任何账号都不许关闭某类日志」——SCP 硬禁令。三个选项同时出现时按「动作类型」选，别按熟悉度选。\n\n#### 案例\n\n一家公司从五个账号扩张到四十个。落地 Control Tower 后，账号工厂开通的新账号自动带上守卫护栏；Security Hub 聚合视图里，哪个账号哪条基线不合规一眼可见。某团队手工关掉了配置记录器，SCP 直接拒绝操作——三层各自发挥作用，基线没有随规模稀释。\n\n**落地细节**：落地顺序有讲究——先 Organizations 立结构，再 Control Tower 开治理，最后 Security Hub 接发现，倒着做会返工。守卫护栏分预防性与检测性：预防性靠 SCP 直接禁止，检测性靠规则发现后通知处置。SSM 在这里的角色是执行端：发现不合规实例后，用 Run Command 批量纠正。控制生效要验证，开个测试账号走一遍开通流程，比看文档踏实。\n\n**关联服务**：AWS Security Hub、AWS Organizations（SCP）、AWS Control Tower、AWS Systems Manager。\n\n#### 组合安全控制实现纵深防御\n\n**这条在问什么**：给一个业务系统设计多层防护，每层放什么组件。考试考「职责边界」——骨架点名的失分点，谁挡 DDoS、谁拦 Web 攻击、谁做子网过滤，别混。\n\n**核心机制**：纵深防御从外到内五层。Shield 在边缘挡 DDoS，标准版自动启用、高级版配响应团队。WAF 挂在 CDN 或负载均衡上拦应用层攻击，托管规则覆盖常见注入与扫描。Network Firewall 在 VPC 边界做状态检测与域名过滤。安全组管到实例，NACL 管到子网。检测与分析层由 GuardDuty 找恶意行为、Detective 做关联调查、Config 与 Security Hub 做配置合规与汇聚。证书传输加密由 ACM 统一托管。每层各答一个问题，组合起来才叫纵深。\n\n**使用场景与考试判断**：题干给「Web 应用要防 SQL 注入」——WAF，别选 Shield（那是 DDoS）。题干给「VPC 出站流量要按域名过滤」——Network Firewall，别选安全组（安全组按 IP 与端口，不看域名）。题干给「拦截行为可疑的凭据滥用」——GuardDuty 检测加自动响应。失分点就在「知道每个组件只管一层」。\n\n#### 案例\n\n一个对外门户的设计评审会上，架构图从外到内排开：Shield 在边缘、WAF 在分发层、Network Firewall 在 VPC 边界、安全组在实例、GuardDuty 在后台找异常。评审提出「把 WAF 规则加到安全组里」被否——安全组没有 Web 语义，两层各干各的。防线不是堆出来的，是按层放对的组件。\n\n**落地细节**：规则联动是纵深的进阶形态——GuardDuty 的发现可以触发 Lambda 更新 WAF 或安全组，把「检测」接到「处置」上。WAF 的速率限制规则专治暴力破解，与注入防护规则并存互不冲突。分层评审要防「某层空转」：每层都有发现记录才算真的在工作，日志为证。\n\n**关联服务**：AWS WAF、AWS Shield、AWS Network Firewall、AWS Certificate Manager、Amazon GuardDuty、Amazon Detective、AWS Config、AWS Security Hub。\n\n#### 大规模自动发现敏感数据\n\n**这条在问什么**：几万个对象里哪些含个人信息，靠人翻不现实。Macie 自动扫描并给出发现结果，考点是它「干什么、不干什么」。\n\n**核心机制**：Macie 用机器学习与模式匹配扫描 S3，识别个人身份信息、财务信息、凭证等敏感数据，按发现类型与严重度输出，可转发 Security Hub 统一处置。自动发现按采样扫描桶，也可对特定前缀全量扫。数据分类先行的道理在于：先定「什么是敏感数据」的分级，Macie 的发现才有处置依据。\n\n**使用场景与考试判断**：骨架点名的第三个失分点在此。Macie 找**数据里的敏感内容**，Inspector 找**软件与系统的漏洞**——一个看数据，一个看主机与镜像。题干给「发现 S3 里的身份证号」选 Macie，给「发现 EC2 上的软件漏洞」选 Inspector。混选是失分重灾区。\n\n#### 案例\n\n一个团队接手历史数据桶，不知道里面有没有客户个人信息。开 Macie 自动发现，两天后报告显示某前缀下有数千条含手机号的记录。按发现结果分级处置：高敏数据迁移到加密桶，其余加访问控制。人工翻桶要几周的事，两天出了清单。\n\n**落地细节**：扫描有成本，按发现结果与采样量计费，先用采样摸底再决定要不要全量。发现结果里有样本片段，处置时注意别把样本二次扩散。发现可按严重度定流转：高危直接告警，中危进周报清单。存量清完不是终点，新桶要自动纳入——事件通知触发扫描配置，覆盖才闭环。\n\n**关联服务**：Amazon Macie、Amazon S3、AWS Security Hub、AWS Glue（数据目录）。\n\n#### 加密传输中与静态数据\n\n**这条在问什么**：数据「在跑」和「在存」两个状态都要加密，选什么工具。KMS 与 CloudHSM 的选型分界是考点。\n\n**核心机制**：传输中加密靠 TLS，证书由 ACM 托管并自动续期，负载均衡与 CDN 直接引用。静态加密靠 KMS：服务默认集成，密钥分 AWS 托管式与客户托管式，客户托管式的密钥策略自己管、可审计可轮换。合规要求「密钥自己 exclusive 控制」时上 CloudHSM——单租户硬件，密钥不经过 AWS 侧软件。KMS 与 CloudHSM 的分界一句话：KMS 是托管服务、够用就选它，CloudHSM 是合规硬要求才上的重装备。\n\n**使用场景与考试判断**：题干给「网站全站 HTTPS 且证书不用人工续」——ACM。题干给「S3 加密且密钥可审计可轮换」——客户托管式 KMS 密钥。题干给「金融合规要求密钥硬件独占」——CloudHSM。另有一条常考：S3 桶级强制加密可用桶策略拒绝未加密请求，配合默认加密双保险。\n\n#### 案例\n\n一个团队做数据合规整改：传输层把负载均衡证书迁到 ACM，续期问题从此消失；存储层给敏感桶配客户托管密钥，密钥策略按角色收窄，轮换按年自动执行。审计方问「密钥谁能用」，答案就在密钥策略文件里——加密从配置动作变成了可审计的代码。\n\n**落地细节**：客户托管密钥要配密钥策略与 IAM 双层授权，删错密钥等于数据报废——启用删除保护，等待期按规程设。跨账号共享加密数据是常考场景：密钥策略放行对方角色，对方的 IAM 再授权，缺一边读不了。传输加密别漏了服务间调用，内网服务间也建议上 TLS，零信任就是这么落地的。\n\n**关联服务**：AWS Key Management Service、AWS CloudHSM、AWS Certificate Manager、Amazon S3、AWS Lambda（自定义密钥材料场景）。\n\n---"},{"h":"实施安全监控与审计方案","body":"#### 这一节学什么\n这一节对应考纲任务 6.3「实施安全监控与审计方案」。\n\n**任务综述**：安全控制铺好了，还要持续看见。这个任务四条技能点构成一条完整链路：建审计底座、配异常告警、管日志、分析发现。三条 Knowledge 铺在任务开头：审计服务清单、漏洞识别服务、常见威胁画像。学员最容易卡的是「审计用哪个服务」——CloudTrail、Config、Flow Logs 各记什么，考试爱混着问。\n\n**原理铺垫（三条 Knowledge 并入）**：审计服务各有记录对象。CloudTrail 记 API 调用——谁、什么时候、调了什么。Config 记资源配置及其变更——资源长什么样、改了什么。VPC Flow Logs 记网络流量元数据——谁连了谁、包收发量。CloudFormation 漂移检测发现「实际资源和模板不一致」。\n\n漏洞与事件识别侧，GuardDuty 靠威胁情报与行为分析找恶意活动，Inspector 扫 EC2 与镜像的软件漏洞，IAM Access Analyzer 找外部可访问的资源。常见威胁画像三条最常考：不安全 Web 流量（没上 TLS）、访问密钥泄漏、S3 公开或未加密。后面四条技能点就是针对这些威胁的响应链。\n\n#### 实施稳健的安全审计\n\n**这条在问什么**：审计底座怎么建才「证据齐全、不可抵赖」。考点是三类日志的分工与完整性保障。\n\n**核心机制**：审计底座由三层记录构成。CloudTrail 记操作，组织级追踪覆盖全账号，管理事件与数据事件按需开。Config 记配置，记录组间关联，回答「当时长什么样」。Flow Logs 记网络，回答「谁连过来过」。完整性保障三件套：CloudTrail 日志文件校验（哈希验证防篡改）、日志投递到专用账号（隔离存储）、S3 对象锁（WORM 防删除）。三条合起来，审计证据链才立得住。\n\n**使用场景与考试判断**：题干给「所有账号的 API 调用集中记录且不能被账号内人员删除」——组织级 CloudTrail 加跨账号投递加对象锁。题干给「某资源三个月前的配置」——Config 的时间线查询，不是 CloudTrail（它记操作不记配置形态）。按「要什么证据」选服务，别按名字选。\n\n#### 案例\n\n一家公司应对外部审计，要求提供「过去一年的操作与配置证据」。他们的底座是组织级 CloudTrail 投递到日志专用账号、Config 全资源记录、专用桶开对象锁。审计方抽查三个月前的变更，十分钟内给出了操作记录与当时配置——证据链完整，现场通过了核验。\n\n**落地细节**：日志校验要定期跑——CloudTrail 提供校验命令，按时间段验证日志文件是否被改过，结果留档给审计方。专用日志账号的权限只给写入不给读取，读的侧另开只读角色，读写分离。Flow Logs 开在子网级最省心，网卡级粒度细但配置量大。漂移检测别当一次性动作，配合定时任务定期扫，漂移早发现早归位。\n\n**关联服务**：AWS CloudTrail、AWS Config、Amazon VPC（Flow Logs）、Amazon S3（对象锁）、AWS CloudFormation（漂移检测）。\n\n#### 按异常安全事件配置告警\n\n**这条在问什么**：安全事件发生了要「主动知道」，不能靠事后翻日志。考点是发现服务到告警渠道的接线方式。\n\n**核心机制**：告警链路三段式。发现端：GuardDuty 出恶意行为发现，Config 规则出不合规发现，Security Hub 汇总成统一格式。接线端：EventBridge 订阅发现事件，按严重度路由——高危直接进 SNS 通知加 Lambda 处置，中危写工单。补充端：CloudWatch 告警盯基础指标，比如失败登录次数、密钥使用异常。三段合起来，事件从发生到有人响应是分钟级。\n\n**使用场景与考试判断**：题干给「GuardDuty 发现高危事件自动通知」——EventBridge 规则匹配发现事件转 SNS，别选 CloudWatch 告警（那是盯指标不是盯发现）。题干给「S3 桶变公开要立刻知道」——Config 规则加自动告警。按「事件源是什么类型」选接线，发现类走 EventBridge，指标类走 CloudWatch。\n\n#### 案例\n\n一个团队的告警分层表：GuardDuty 高危发现直接打电话值班，Config 的公开桶规则发团队群，密钥异常使用进每日邮件摘要。上线一个月，一次凌晨的异常 IAM 调用被电话叫醒值班员处置——从发现到人工介入不到十分钟，事后复盘证明损失为零。\n\n**落地细节**：EventBridge 匹配发现的模式按 severity 分级写，只匹配 8 分以上的规则让高危走专线，低危不进告警通道免得吵。SNS 通知要区分渠道，值班电话与群消息是两条订阅，静默时段谁接收要定清楚。响应动作也别全自动：高危先通知人再处置，全自动只留给误伤面小的动作。\n\n**关联服务**：Amazon GuardDuty、AWS Config、AWS Security Hub、Amazon EventBridge、Amazon SNS、Amazon CloudWatch。\n\n#### 配置服务与应用日志\n\n**这条在问什么**：日志怎么开、开哪些、存到哪。考点是各服务的日志开关与最佳落位。\n\n**核心机制**：CloudTrail 开组织级追踪，管理事件全账号必开，数据事件按敏感资源开（S3 对象级操作、Lambda 调用）。VPC Flow Logs 按子网或网卡开，敏感子网必开。负载均衡、CloudFront 的访问日志开到专用桶。应用日志经 CloudWatch agent 收进日志组。所有日志统一去向：专用日志账号的 S3 桶，按生命周期归档，加密必开。落位原则一句话：**集中存储、独立权限、长期保留**。\n\n**使用场景与考试判断**：题干给「Lambda 的每次调用要留痕」——CloudTrail 数据事件，不是管理事件（管理事件只有配置变更）。题干给「审计要求日志保留七年且防删改」——S3 对象锁加生命周期转归档。日志开关题考的是「这个事件属于哪类日志」。\n\n#### 案例\n\n一个团队按「资源敏感性」定日志开关：核心业务子网开 Flow Logs，S3 数据事件只对客户数据桶开，负载均衡日志全开。日志统一进日志账号，按 90 天热存、一年标准归档、七年冷归档分层。日志费用比一刀切全开省了六成，审计要求一条不缺。\n\n**落地细节**：日志组保留期与 S3 生命周期分工要分清——日志组管热数据查最近，S3 管长期归档，两层都设才算完整的保留策略。投递中断要监控：CloudTrail 的投递失败会发事件，订阅它才知道审计链是不是断了。日志桶的桶策略只允许服务写入，禁止任何人删除，桶级配置也是审计证据的一部分。\n\n**关联服务**：AWS CloudTrail、Amazon CloudWatch Logs、Amazon VPC（Flow Logs）、Amazon S3、AWS Lambda。\n\n#### 分析日志、指标与安全发现\n\n**这条在问什么**：数据都收上来了，怎么从中找到安全事件的答案。考点是分析工具的选型与联动。\n\n**核心机制**：三类数据三个分析入口。日志用 CloudWatch Logs Insights 按字段查询聚合，快速找异常模式。指标用 CloudWatch 图表与异常检测看趋势偏离。安全发现用 Security Hub 统一看板与 GuardDuty 控制台，按严重度与类型筛选；深度关联调查用 Detective——它把发现相关联的账号、IP、资源关系画成图谱，回答「影响面多大、还有谁被波及」。分析产出要回到处置：确认是事件就进响应流程，是误报就调发现精度。\n\n**使用场景与考试判断**：题干给「调查一个高危发现的横向影响」——Detective 做关联分析，Insights 只能查单类日志。题干给「统计过去一天失败登录的来源分布」——Logs Insights 的 stats 聚合。分析题按「数据类型与问题深度」选工具，浅查用查询，深查用图谱。\n\n#### 案例\n\n一次可疑告警的排查过程：GuardDuty 报某角色的密钥在异国调用。Detective 图谱显示该角色当晚只被一台异常 IP 使用，关联资源仅一个只读桶。处置两步走：禁用密钥、收紧桶策略。全程四十分钟，分析工具的分工让排查没有绕路。\n\n**关联服务**：Amazon CloudWatch（Logs Insights）、AWS Security Hub、Amazon GuardDuty、Amazon Detective、Amazon Athena（跨源 SQL 查询）。\n\n---"}],"tips":{"points":"| 考点 | 出现频率 | 考法要点 |\n|---|---|---|\n| 权限边界与 SCP 叠加效果 | ⭐⭐⭐ | 两者都是收窄不是授予，多层取交集；显式拒绝永远赢 |\n| 纵深防御组件职责边界 | ⭐⭐⭐ | Shield 挡 DDoS、WAF 拦 Web 攻击、Network Firewall 管 VPC 边界、安全组管实例，按层对号 |\n| Macie 与 Inspector 用途差别 | ⭐⭐⭐ | Macie 找数据里的敏感内容，Inspector 找主机与镜像的软件漏洞 |\n| Control Tower / Security Hub / SCP 分工 | ⭐⭐⭐ | 开号即合规、持续汇聚发现、硬性禁令，按动作类型选 |\n| 审计证据链完整性 | ⭐⭐ | 组织级 CloudTrail + 专用账号存储 + 对象锁；Config 记配置形态、CloudTrail 记操作 |\n| 静态凭据消灭路径 | ⭐⭐ | 先问能不能换 IAM 角色拿临时凭证，再谈 Secrets Manager 自动轮换 |\n| RBAC 与 ABAC 选型 | ⭐⭐ | 资源多、按属性分组、不想改策略 → ABAC；岗位固定规模小 → RBAC |\n| KMS 与 CloudHSM 选型 | ⭐⭐ | 托管够用选 KMS，合规要求密钥硬件独占才上 CloudHSM |\n| 发现类与指标类告警接线 | ⭐⭐ | 安全发现走 EventBridge 路由，指标异动走 CloudWatch 告警 |\n| 日志分类开关 | ⭐⭐ | Lambda 调用留痕 = 数据事件；配置变更 = 管理事件；网络元数据 = Flow Logs |\n| Detective 的定位 | ⭐ | 关联图谱调查横向影响，单类日志查询用 Insights 或 Athena |\n| S3 敏感数据自动发现 | ⭐ | Macie 采样摸底加事件驱动纳入新桶，处置分级流转 |","services":"| 服务 | 本域角色 | 高频考点 |\n|---|---|---|\n| AWS Identity and Access Management（IAM） | 身份与策略基座 | 最小权限、边界与 SCP 交集、ABAC 标签条件 |\n| AWS IAM Identity Center | 人的联合访问 | 对接身份源、集中 MFA |\n| AWS Security Token Service（STS） | 临时凭证 | AssumeRole、会话策略收窄 |\n| AWS Organizations | 账号治理结构 | SCP 硬禁令、OU 分层 |\n| AWS Control Tower | 治理落地 | 账号工厂、守卫护栏 |\n| AWS Security Hub | 发现汇聚 | 跨账号聚合、统一格式、安全分数 |\n| Amazon GuardDuty | 威胁检测 | 恶意行为发现、驱动自动响应 |\n| Amazon Macie | 敏感数据发现 | S3 扫描、个人信息识别 |\n| Amazon Inspector | 漏洞扫描 | EC2 与镜像软件漏洞 |\n| Amazon Detective | 关联调查 | 发现图谱、横向影响分析 |\n| AWS CloudTrail | 操作审计 | 组织级追踪、数据事件、日志校验 |\n| AWS Config | 配置审计与合规 | 资源时间线、规则评估、自动修复 |\n| AWS WAF / AWS Shield | 应用与可用性防护 | 注入拦截、DDoS 缓解，职责不混 |\n| AWS Network Firewall | VPC 边界过滤 | 状态检测、域名过滤 |\n| AWS Key Management Service / AWS CloudHSM | 加密与密钥 | 客户托管密钥、硬件独占的合规场景 |\n| AWS Secrets Manager | 机器凭据轮换 | 轮换四步、引用 ARN |\n| Amazon S3（对象锁） | 审计证据保护 | WORM 防删改、生命周期归档 |"}}]};

<script>
(function(){
'use strict';
const DATA = (typeof LEARNING_DATA !== 'undefined' && LEARNING_DATA) ? LEARNING_DATA : null;

// R5: meta.footerNote overrides default footer (AWS default kept when absent)
if (DATA && DATA.meta && DATA.meta.footerNote) {
  var fn = document.getElementById('footNote');
  if (fn) { fn.textContent = DATA.meta.footerNote; }
}

/* ============ 常量与工具 ============ */
const EXAM = DATA ? (DATA.meta.exam || 'CERT').toLowerCase() : 'cert';   // clf-c02
const STORE_KEY = EXAM + '-v2';                                          // 进度键：clf-c02-v2
const COLORS = ['#4f46e5','#7c3aed','#9333ea','#a855f7'];                // 每章主题色（N 章 N 色，N>4 循环）
const home = document.getElementById('home');
const chapBox = document.getElementById('chapters');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function imgSrcOk(src){ return /^(?:[\w.-]+\/)*[\w.-]+\.(?:png|jpe?g|webp|gif|svg)$/i.test(src); }
function inlineMd(s){
  let t = esc(s);
  t = t.replace(/\n/g,'<br>');
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t = t.replace(/!\[([^\]]*)\]\(([^()\s]+)\)/g, function(m0, alt, src){
    if(!imgSrcOk(src)) return '<span class="img-bad" title="非法图源">🖼 非法图源：'+src+'</span>';
    return '<img class="inline-img" loading="lazy" alt="'+alt.replace(/"/g,'&quot;')+'" src="'+src+'">';
  });
  return t;
}
function isTblSep(ln){ const core = ln.replace(/^\s*\|/,'').replace(/\|\s*$/,''); if(!core.includes('-')) return false; return /^[\s:\-|]+$/.test(ln) && /-/.test(ln); }
function loadProg(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveProg(p){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){} }

/* ============ 块级 md 渲染（段落/引用/表格/列表/图占位符） ============ */
function renderBlocks(seg, figs, fctr){
  fctr = fctr || {n:0};
  const lines = seg.replace(/\r/g,'').split('\n');
  let html = ''; let i = 0; const n = lines.length;
  while(i < n){
    const ln = lines[i]; const s = ln.trim();
    if(s === ''){ i++; continue; }
    const fm = s.match(/^\[\[fig:([\w-]+)\]\]$/);
    if(fm){ const f = (figs||{})[fm[1]]; if(f){ if(fctr) fctr.n++; html += figHtml(f); } i++; continue; }
    const fp = s.match(/^【图：(.+?)｜(概念图|截图)】$/);
    if(fp){ fctr.n++; html += '<div class="fig-placeholder" data-figtype="'+fp[2]+'"><span class="fp-num">图 '+fctr.n+'</span><span class="fp-type">'+fp[2]+'</span><span class="fp-alt">'+esc(fp[1])+'</span><span class="fp-note">真图待补</span></div>'; i++; continue; }
    const ib = s.match(/^!\[([^\]]*)\]\(([^()\s]+)\)$/);
    if(ib){
      const ialt = ib[1], isrc = ib[2];
      if(imgSrcOk(isrc)){ html += '<figure class="fig-img"><img loading="lazy" alt="'+ialt.replace(/"/g,'&quot;')+'" src="'+isrc+'"><figcaption>'+esc(ialt)+'</figcaption></figure>'; }
      else { html += '<div class="fig-placeholder"><span class="fp-type">非法图源</span><span class="fp-alt">'+esc(ialt)+' ← '+esc(isrc)+'</span><span class="fp-note">检查路径与扩展名</span></div>'; }
      i++; continue;
    }
    if(s.startsWith('|') && i+1 < n && isTblSep(lines[i+1].trim())){
      let rows = [];
      while(i < n && lines[i].trim().startsWith('|')){ rows.push(lines[i].trim()); i++; }
      const heads = rows[0].replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim()));
      const data = rows.slice(2).map(r => r.replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim())));
      html += '<div class="tbl-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'
        + data.map(r => '<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if(s.startsWith('>')){
      let q = [];
      while(i < n && lines[i].trim().startsWith('>')){ q.push(lines[i].replace(/^\s*>\s?/,'').trim()); i++; }
      html += '<blockquote>'+inlineMd(q.join(' '))+'</blockquote>'; continue;
    }
    if(/^[-*]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^[-*]\s+/.test(t)){ items.push(inlineMd(t.replace(/^[-*]\s+/,''))); i++; } else break; }
      html += '<ul>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; continue;
    }
    if(/^\d+[.、]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^\d+[.、]\s+/.test(t)){ items.push(inlineMd(t.replace(/^\d+[.、]\s+/,''))); i++; } else break; }
      html += '<ol>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ol>'; continue;
    }
    const hm = s.match(/^(#{1,6})\s+(.+)$/);
    if(hm){ html += '<h4 class="sec-h">'+inlineMd(hm[2])+'</h4>'; i++; continue; }
    let para = [];
    while(i < n){
      const t = lines[i].trim();
      if(t === '' || t.startsWith('|') || t.startsWith('>') || /^[-*]\s+/.test(t) || /^\d+[.、]\s+/.test(t) || /^#{1,6}\s/.test(t) || /^\[\[fig:[\w-]+\]\]$/.test(t) || /^【图：[^｜]*｜(?:概念图|截图)】$/.test(t) || /^!\[[^\]]*\]\([^()\s]+\)$/.test(t)) break;
      para.push(t); i++;
    }
    if(para.length) html += '<p>'+inlineMd(para.join(' '))+'</p>';
  }
  return html;
}

/* ===== 节内子块解析与渲染（v6）：#### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点）
   这一节学什么（旧值「本节定位」仍兼容）=弱化引言、案例/记忆要点=卡片、常见误区与易错点=警示小节——均不占编号。
   解析与渲染共用 parseSectionBlocks，保证正文 h3 与左侧目录两级条目 1:1。 ===== */
const SUB_RAW='raw', SUB_LEAD='lead', SUB_KP='kp', SUB_CASE='case', SUB_MIS='mis', SUB_MEM='mem';
function subTypeOf(title){
  if(title === '这一节学什么' || title === '本节定位') return SUB_LEAD;
  if(title === '案例') return SUB_CASE;
  if(title === '记忆要点') return SUB_MEM;
  if(title === '常见误区与易错点') return SUB_MIS;
  return SUB_KP;
}
function parseSectionBlocks(md){
  const parts = (md||'').replace(/\r/g,'').split(/\n(?=####\s)/);
  const out = [];
  parts.forEach(part=>{
    const m = part.match(/^####\s*(.+?)\s*\n([\s\S]*)$/);
    if(!m){ const t = part.trim(); if(t) out.push({ type:SUB_RAW, title:'', body:t }); return; }
    out.push({ type:subTypeOf(m[1].trim()), title:m[1].trim(), body:(m[2]||'').trim() });
  });
  return out;
}
function countKp(body){ let m=0; parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP) m++; }); return m; }
function kpListOf(body){
  const kps=[]; let m=0;
  parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP){ m++; kps.push({ m:m, title:b.title }); } });
  return kps;
}
function renderSectionBody(md, figs, d, n, fctr){
  fctr = fctr || {n:0};
  const blocks = parseSectionBlocks(md);
  let h = ''; let kp = 0;
  for(const b of blocks){
    if(b.type === SUB_RAW){ h += renderBlocks(b.body, figs, fctr); continue; }
    if(b.type === SUB_KP){
      kp++;
      h += '<h3 class="mh3" id="sec-'+d+'-'+n+'-'+kp+'"><span class="h3no">'+d+'.'+n+'.'+kp+'</span><span>'+inlineMd(b.title)+'</span></h3>'
         + renderBlocks(b.body, figs, fctr);
      continue;
    }
    if(b.type === SUB_CASE){ h += '<div class="case-card"><h4 class="sec-h">案例</h4>'+renderBlocks(b.body, figs, fctr)+'</div>'; continue; }
    if(b.type === SUB_MEM){ h += '<div class="mem-card"><h4 class="sec-h">记忆要点</h4>'+renderBlocks(b.body, figs, fctr)+'</div>'; continue; }
    h += '<h4 class="sec-h'+(b.type===SUB_LEAD?' sec-lead-h':'')+'">'+inlineMd(b.title)+'</h4>'+renderBlocks(b.body, figs, fctr);
  }
  return h;
}
function figsById(fs){ const m={}; (fs||[]).forEach(f=>{ m[f.id]=f; }); return m; }
function figHtml(f){
  return '<div class="fig-block"><div class="fig-title">'+esc(f.title)+'</div>'
    + '<div class="fig-body">'+(f.html||'')+'</div>'
    + (f.caption ? '<div class="fig-caption">'+esc(f.caption)+'</div>' : '') + '</div>';
}

    let tocHtml = '<ul class="toc-list">';
    secs.forEach((s,si)=>{
      tocHtml += '<li class="toc-sec" data-ds="'+(si+1)+'">'
        + '<a class="toc-link toc-sec-link" href="#sec-'+d+'-'+(si+1)+'"><span class="tl-id">'+d+'.'+(si+1)+'</span><span class="toc-t">'+esc(s.h)+'</span><span class="toc-ar">▸</span></a>';
      const kps = kpListOf(s.body || '');
      if(kps.length){
        tocHtml += '<ul class="toc-sub">';
        kps.forEach(k=>{
          tocHtml += '<li><a class="toc-link toc-sub-link" href="#sec-'+d+'-'+(si+1)+'-'+k.m+'"><span class="tl-id">'+d+'.'+(si+1)+'.'+k.m+'</span><span class="toc-t">'+esc(k.title)+'</span></a></li>';
        });
        tocHtml += '</ul>';
      }
      tocHtml += '</li>';
    });
    /* 目录尾固定练习入口：滚到章末练习区（视作目录内最后一章，v6.2 新增） */
    tocHtml += '<li class="toc-quiz"><a class="toc-link toc-quiz-link" href="#quiz-d'+d+'"><span class="tl-id">📝</span><span class="toc-t">本章练习</span></a></li>';
    tocHtml += '</ul>';
    let h = '<div class="panel" id="panel-d'+d+'">'
      /* ── 栅格列①：常驻目录槽（窄屏为抽屉） ── */
      + '<aside class="ch-side" id="side-d'+d+'" data-d="'+d+'" aria-label="本章内容目录">'

      +     '<div class="toc-hd"><span class="th-title">📑 本章内容</span><span class="th-meta" id="tocmeta-d'+d+'"></span>'
      +       '<button class="side-close" data-close="1" aria-label="关闭目录">✕</button></div>'
      +     '<div class="toc-body">'+tocHtml+'</div>'
      +   '</div>'
      + '</aside>'
      + '<div class="side-mask" data-mask="1"></div>'
      /* ── 栅格列②：正文列 ── */
      + '<div class="ch-main">'
      +   '<div class="ch-topnav">'
      +     '<button class="back-btn" data-back="1">← 返回目录</button>'
      +     '<button class="toc-open-btn" data-open="1" aria-label="打开本章内容目录" aria-expanded="false">☰ 目录</button>'
      +     '<span class="tn-title">D'+d+' · '+esc(ch.name||'')+'</span>'

    secs.forEach((s,si)=>{
      h += '<section class="sec-block" id="sec-'+d+'-'+(si+1)+'" style="scroll-margin-top:78px">'
        + '<h2 class="mh2">'+d+'.'+(si+1)+'　'+esc(s.h)+'</h2>'
        + renderSectionBody(s.body || '', figsById(s.figures), d, si+1, fctr) + '</section>';

      h += '<div class="tips-card"><div class="tc-title">📌 本领域考试重点提示</div>' + renderBlocks(ch.tips.points||'', null, fctr)

    if(tm){
      let kp = 0; (ch.sections||[]).forEach(s=>{ kp += countKp(s.body||''); });
      tm.textContent = (ch.sections||[]).length + ' 节 · ' + kp + ' 点';
    }
  });
  /* 面板内事件委托：返回/抽屉/遮罩/目录跳转 */
  chapBox.addEventListener('click', e=>{
    if(e.target.closest('.back-btn')){ backHome(); return; }
    const panel = e.target.closest('.panel');
    const d = panel ? parseInt(panel.id.replace('panel-d',''),10) : 0;
    if(e.target.closest('.side-mask') || e.target.closest('[data-close="1"]')){ closeSide(); return; }
    if(e.target.closest('.toc-open-btn')){ openSide(d); return; }
    const tl = e.target.closest('.toc-link');
    if(tl){
      e.preventDefault();
      const href = tl.getAttribute('href');
      if(tl.classList.contains('toc-sec-link')){
        /* 节行：单开手风琴（开当前节收起其它节）+ 滚动到节 */
        const li = tl.closest('.toc-sec');
        const wasOpen = li ? li.classList.contains('open') : false;
        const toc = document.getElementById('toc-d'+d);
        if(toc) toc.querySelectorAll('.toc-sec.open').forEach(x=>x.classList.remove('open'));
        if(li && !wasOpen) li.classList.add('open');
      }
      const el = document.getElementById(href.slice(1));
      if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
      if(window.matchMedia('(max-width:1199px)').matches) closeSide();
    }
  });
  /* 面板内练习渲染与判分绑定 */
  chapters.forEach((ch,di)=>{
    const d = di+1;
    renderQuiz(d, ch.practice || []);
  });
}
/* 窄屏抽屉开合 */
function openSide(d){
  const side = document.getElementById('side-d'+d); if(!side) return;
  side.classList.add('open');
  const btn = document.querySelector('#panel-d'+d+' .toc-open-btn');
  if(btn) btn.setAttribute('aria-expanded','true');
  const mask = document.querySelector('#panel-d'+d+' .side-mask');
  if(mask) mask.classList.add('show');
}
function closeSide(){
  document.querySelectorAll('.ch-side.open').forEach(s=>s.classList.remove('open'));
  document.querySelectorAll('.side-mask.show').forEach(m=>m.classList.remove('show'));
  document.querySelectorAll('.toc-open-btn[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));
}

/* ============ 章内滚动（v6）：几何法 scrollspy + 阅读进度 ============
   同一 rAF 节流的 scroll 监听做两件事：① 顶部细进度条（#rdFill-d / #readPct-d）
   ② 高亮"最新越过吸顶线(READ_LINE)的锚点"（.sec-block 节 / .mh3 知识点），并自动单开其节组。 */
let spyD = 0, spyEls = [], spyTick = null, spyOn = false;
const READ_LINE = 86;      // 吸顶条下方阅读线
const ACT_WIN = 160;       // 节/知识点标题进入线下方窗口即视为"当前"（点击跳转后立即生效）
function setAct(id){
  if(!id) return;
  /* 锚点两类：正文节/知识点 sec-域-序号[-序号]，章末练习 quiz-d域 */
  const mk = id.match(/^(?:sec-|quiz-d)(\d+)/); if(!mk) return;
  const d = +mk[1];
  const toc = document.getElementById('toc-d'+d); if(!toc) return;
  toc.querySelectorAll('.toc-link.act').forEach(a=>a.classList.remove('act'));
  const link = toc.querySelector('a[href="#'+id+'"]');
  if(link){
    link.classList.add('act');
    const li = link.closest('.toc-sec');
    if(li && !li.classList.contains('open')){
      toc.querySelectorAll('.toc-sec.open').forEach(x=>x.classList.remove('open'));
      li.classList.add('open');
    } else if(!li){
      /* 独立条目（练习入口等）：高亮时收起所有展开节组，聚焦本条 */
      toc.querySelectorAll('.toc-sec.open').forEach(x=>x.classList.remove('open'));
    }
  }
}
function computeSpy(){
  const host = document.getElementById('panel-d'+spyD); if(!host) return;
  /* ① 阅读进度：以当前面板总高扣视口高的滚动行程计百分比（+页脚尾距近似） */
  const total = host.offsetHeight - window.innerHeight + 110;
  const p = total > 0 ? Math.max(0, Math.min(100, Math.round(window.scrollY / total * 100))) : 0;
  const fill = document.getElementById('rdFill-'+spyD); if(fill) fill.style.width = p + '%';
  const pct = document.getElementById('readPct-'+spyD); if(pct) pct.textContent = p + '%';
  /* ② 当前锚（三层）：
     视口内(含阅读线下方窗口)：选最靠上者 → 点击跳转/节首即生效；
     视口内无锚(读至章末练习/底部)：取最近滚出视口的锚，保持高亮最后小节；
     首屏未滚：回退最先可见锚 */
  const hi = READ_LINE + ACT_WIN;
  let best = null;
  for(const el of spyEls){
    const r = el.getBoundingClientRect();
    if(r.top <= hi && r.bottom >= 0){ if(!best || r.top > best.r.top) best = { el:el, r:r }; }
  }
  if(!best){
    for(const el of spyEls){
      const r = el.getBoundingClientRect();
      if(r.bottom < 0){ if(!best || r.bottom > best.r.bottom) best = { el:el, r:r }; }
    }
  }
  if(!best){
    for(const el of spyEls){
      const r = el.getBoundingClientRect();
      if(r.top >= 0 && r.top < window.innerHeight * 0.7){ if(!best || r.top < best.r.top) best = { el:el, r:r }; }
    }
    if(!best && spyEls.length) best = { el:spyEls[0], r:null };
  }
  if(best && best.el.id) setAct(best.el.id);
}
function onSpyScroll(){
  if(spyTick) return;
  spyTick = requestAnimationFrame(()=>{ spyTick = null; computeSpy(); });
}
function initSpy(d){
  detachSpy(false);
  spyD = d;
  const host = document.getElementById('panel-d'+d); if(!host) return;
  spyEls = Array.from(host.querySelectorAll('.sec-block, .mh3, .quiz-box'));
  if(!spyOn){ spyOn = true; window.addEventListener('scroll', onSpyScroll, { passive:true }); }
  document.body.classList.add('chapView');
  computeSpy();
}
function detachSpy(resetAct){
  if(spyOn){ window.removeEventListener('scroll', onSpyScroll); spyOn = false; }
  if(spyTick){ cancelAnimationFrame(spyTick); spyTick = null; }
  document.body.classList.remove('chapView');
  spyEls = []; spyD = 0;
  if(resetAct !== false){
    document.querySelectorAll('.toc-link.act').forEach(a=>a.classList.remove('act'));
    document.querySelectorAll('.toc-sec.open').forEach(li=>li.classList.remove('open'));
  }
}

/* ============ 章末练习 ============ */
/* 答案/题型归一化（修复：双科数据格式不一致导致章末练习失效）
   数据真源存在两种历史格式：
     CLF  a = ["C"] / ["B","E"]   t = 'single' / 'multiple'
     AIF  a = "B"   / "AE"        t = '单选' / '多选'
   原实现把 q.a 经 JSON.stringify+esc 写进 data-ans 属性，esc 不转义双引号 →
   属性被 HTML 截断（CLF 抛 JSON 解析错→提交无反应；AIF 读出空→恒判错）。
   现改为：答案只从数据真源按 qid 反查，渲染层统一归一化，不再进 HTML 属性。 */
function normAns(v){
  if(v === null || v === undefined) return [];
  if(Array.isArray(v)) return v.map(x=>String(x).trim().toUpperCase()).filter(x=>/^[A-Z]$/.test(x));
  const raw = String(v).trim();
  /* 严格形态：整串只允许字母与分隔符。防从说明文字里误提字母
     （历史案例：某题答案字段为「⚠️待核（…见源PDF）」→ 误提出 P/D/F） */
  if(!/^[A-Za-z][A-Za-z,，、;；\s]*$/.test(raw)) return [];
  return raw.toUpperCase().replace(/[^A-Z]/g, '').split('').filter(Boolean);
}
/* 可作答判定：答案可解析 + 至少一个选项。不可作答题不渲染交互（防误判） */
function isAnswerable(q){ return !!(q && normAns(q.a).length && (q.o || []).length); }
/* 可答题数（进度分母用，不可作答题不计入） */
function answerableCount(d){
  const ch = (DATA && DATA.chapters) ? DATA.chapters[d-1] : null;
  return ((ch && ch.practice) || []).filter(isAnswerable).length;
}
function isMultiQ(q){
  if(!q) return false;
  if(q.t === 'multiple' || q.t === 'multi' || q.t === '多选') return true;
  return normAns(q.a).length > 1;   // 兜底：答案多字母必为多选
}
function findQ(d, qid){
  const ch = (DATA && DATA.chapters) ? DATA.chapters[d-1] : null;
  const qs = (ch && ch.practice) || [];
  for(let i=0;i<qs.length;i++){ if(String(qs[i].id) === String(qid)) return qs[i]; }
  return null;
}
function renderQuiz(d, qs){
  const host = document.getElementById('quiz-d'+d);
  if(!qs.length){ host.innerHTML = '<div class="quiz-hdr">✅ 本章练习</div><p style="font-size:14px;color:#94a3b8">本章暂无配套练习，可到刷题工具练习。</p>'; return; }
  const nAns = qs.filter(isAnswerable).length;
  const naTip = (nAns < qs.length) ? '（另有 '+(qs.length-nAns)+' 题特殊题型待补充）' : '';
  let h = '<div class="quiz-hdr"><span>✅ 本章练习（'+nAns+' 题）'+naTip+'</span><span class="quiz-score" id="qscore-'+d+'">正确 0/'+nAns+'</span></div>';
  qs.forEach((q,qi)=>{
    const multi = isMultiQ(q);
    /* 不可作答防御：答案或选项缺失时不渲染答题交互，
       避免学员点击后被误判（历史案例：配对题占位形态） */
    if(!isAnswerable(q)){
      h += '<div class="qi qi-na" data-d="'+d+'" data-qid="'+esc(q.id||(d+'-'+qi))+'" data-qi="'+qi+'" data-na="1">'
        + '<div class="qmeta"><span class="qbadge">第 '+(qi+1)+' 题</span><span class="qtype">特殊题型</span></div>'
        + '<div class="qstem">'+inlineMd(q.q||'')+'</div>'
        + '<div class="qrow"><div class="qres show na">⚠️ 本题为配对/特殊题型，暂不支持在线作答（内容待补充）</div></div></div>';
      return;
    }
    h += '<div class="qi" data-d="'+d+'" data-qid="'+esc(q.id||(d+'-'+qi))+'" data-qi="'+qi
      + '" data-multi="'+(multi?'1':'0')+'">'
      + '<div class="qmeta"><span class="qbadge">第 '+(qi+1)+' 题</span><span class="qtype '+(multi?'qtype-m':'qtype-s')+'">'+(multi?'多选':'单选')+'</span></div>'
      + '<div class="qstem">'+inlineMd(q.q||'')+'</div><div class="opts">';
    (q.o||[]).forEach(op=>{
      h += '<div class="opt" data-l="'+esc(op.l)+'"><span class="ol">'+esc(op.l)+'.</span><span>'+inlineMd(op.t||'')+'</span></div>';
    });
    h += '</div><div class="qexp" style="display:none">'+esc(q.e||'')+'</div>'
      + '<div class="qrow"><button class="qbtn">确认答案</button><div class="qres"></div></div></div>';
  });
  h += '<div class="score-box" id="scorebox-'+d+'"><div class="score-num" id="scorenum-'+d+'"></div><div class="score-lbl"></div>'
    + '<div class="sb-tip">完整题库与限时模拟考核见首页「题库刷题」入口；未作答的题目在返回目录再进入后仍可继续作答。</div></div>';
  host.innerHTML = h;
  /* 恢复已作答状态 */
  const prog = loadProg();
  const rec = (prog['quiz_d'+d] && prog['quiz_d'+d].answered) || {};
  host.querySelectorAll('.qi').forEach(qi=>{
    const qid = qi.dataset.qid;
    if(rec[qid] !== undefined){
      applyResult(qi, rec[qid].right === 1, rec[qid].sel || [], normAns((findQ(d, qid) || {}).a), true);
    }
  });
  host.querySelectorAll('.qi').forEach(qi=>{
    const qid = qi.dataset.qid; const prog2 = loadProg();
    const rec2 = (prog2['quiz_d'+d] && prog2['quiz_d'+d].answered) || {};
    if(rec2[qid] !== undefined) return;   // 已答锁题
    const optsBox = qi.querySelector('.opts'), btn = qi.querySelector('.qbtn');
    if(!optsBox || !btn) return;          // 不可作答题（特殊题型占位卡）无交互
    const multi = qi.dataset.multi === '1';
    const opts = qi.querySelectorAll('.opt');
    optsBox.addEventListener('click', e=>{
      const o = e.target.closest('.opt'); if(!o) return;
      if(multi){ o.classList.toggle('sel'); }
      else{ opts.forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); }
    });
    btn.addEventListener('click', ()=>{ judge(qi); });
  });
  updateScore(d);
  checkScoreBox(d);
}

function judge(qi){
  const d = qi.dataset.d;
  const ans = normAns((findQ(d, qi.dataset.qid) || {}).a);
  const sel = Array.from(qi.querySelectorAll('.opt.sel')).map(o=>o.dataset.l);
  /* 防复发：答案数据异常时大声报错，不得静默判错 */
  if(!ans.length){
    const r = qi.querySelector('.qres');
    r.className = 'qres show err';
    r.textContent = '⚠️ 本题答案数据异常，无法判定，请反馈管理员';
    return;
  }
  const right = sel.length === ans.length && ans.every(a=>sel.includes(a));
  applyResult(qi, right, sel, ans, false);
  /* 持久化 */
  const prog = loadProg();
  const key = 'quiz_d'+d;
  if(!prog[key]) prog[key] = { answered:{} };
  prog[key].answered[qi.dataset.qid] = { right: right?1:0, sel: sel };
  saveProg(prog);
  updateScore(d);
  refreshProgress();
  checkScoreBox(d);
}

function applyResult(qi, right, sel, ans, restored){
  qi.classList.add('done');
  const opts = Array.from(qi.querySelectorAll('.opt'));
  opts.forEach(o=>{
    const l = o.dataset.l;
    if(ans.includes(l)) o.classList.add(sel.includes(l) ? 'cor' : 'shc');
    else if(sel.includes(l)) o.classList.add('wrg');
  });
  const qres = qi.querySelector('.qres');
  qres.className = 'qres show ' + (right ? 'ok' : 'err');
  const exp = qi.querySelector('.qexp');
  qres.innerHTML = (right ? '✅ 回答正确' : '❌ 回答错误') + '　<span style="font-weight:400">' + inlineMd(exp ? exp.textContent : '') + '</span>';
  qi.querySelector('.qbtn').disabled = true;
  qi.querySelector('.qbtn').textContent = restored ? '已作答' : '已确认';
}

function updateScore(d){
  const prog = loadProg();
  const key = 'quiz_d'+d;
  const rec = (prog[key] && prog[key].answered) || {};
  let right = 0;
  Object.values(rec).forEach(v=>{ if(v.right === 1) right++; });
  const total = answerableCount(d);   // 分母=可答题数（特殊题型占位卡不计入）
  const sc = document.getElementById('qscore-'+d);
  if(sc) sc.textContent = '正确 ' + right + '/' + total;
}

function checkScoreBox(d){
  const prog = loadProg();
  const key = 'quiz_d'+d;
  const rec = (prog[key] && prog[key].answered) || {};
  const total = answerableCount(d);
  if(Object.keys(rec).length >= total && total > 0){
    let right = 0; Object.values(rec).forEach(v=>{ if(v.right === 1) right++; });
    const box = document.getElementById('scorebox-'+d);
    document.getElementById('scorenum-'+d).textContent = right + ' / ' + total;
    box.querySelector('.score-lbl').textContent = right === total ? '🎉 全对，本章掌握扎实！' : (right >= total*0.7 ? '👍 达到及格线（70%），可进入下一章' : '📖 建议回到正文复习错题对应的知识点');
    box.classList.add('show');
  }
}

/* ============ 视图切换与进度 ============ */
function go(d){
  const chapters = DATA.chapters;
  closeSide();
  home.style.display = 'none';
  chapBox.style.display = '';
  chapBox.querySelectorAll('.panel').forEach(p=>{ p.style.display = (p.id === 'panel-d'+d) ? '' : 'none'; });
  const prog = loadProg();
  prog['read_d'+d] = 1;                 // 已读标记
  saveProg(prog);
  window.scrollTo(0,0);
  document.title = baseTitle() + ' · 第 ' + d + ' 章';
  initSpy(d);                            // 常驻目录/进度条/scrollspy 跟随当前章
}

function backHome(){
  detachSpy();
  closeSide();
  chapBox.style.display = 'none';
  home.style.display = '';
  window.scrollTo(0,0);
  document.title = baseTitle();
  refreshProgress();
}

/* 刷新首页进度看板：统计已完成数 + 章卡状态/进度条 */
function refreshProgress(){
  const prog = loadProg();
  const chapters = DATA.chapters;
  let doneCnt = 0;
  chapters.forEach((ch,di)=>{
    const d = di+1;
    const total = (ch.practice||[]).length;
    const rec = (prog['quiz_d'+d] && prog['quiz_d'+d].answered) || {};
    const nDone = Object.keys(rec).length;
    const right = Object.values(rec).filter(v=>v.right===1).length;
    const read = prog['read_d'+d] === 1;
    const pm = document.getElementById('pm-'+d);
    const pmn = document.getElementById('pmn-'+d);
    const pf = document.getElementById('pf-'+d);
    const card = pm ? pm.closest('.ch-card') : null;
    if(!pm) return;
    let state = '未开始', pct = 0;
    if(nDone >= total && total > 0){ state = '已完成'; doneCnt++; card.classList.add('done'); }
    else if(read || nDone > 0){ state = nDone > 0 ? '学习中 ' + nDone + '/' + total : '学习中'; }
    pm.textContent = state;
    if(card) card.classList.toggle('done', nDone >= total && total > 0);
    pct = total ? Math.round(nDone/total*100) : 0;
    if(pf) pf.style.width = pct + '%';
    if(pmn) pmn.textContent = total ? ('答对 ' + right + '/' + total) : '';
  });
  const od = document.getElementById('ovDone');
  if(od) od.textContent = doneCnt;
}

/* ============ 启动 ============ */
if(!DATA){
  document.body.innerHTML = '<div style="padding:60px 24px;text-align:center;font-size:14px;color:#64748b">学习数据未注入：此模板需经构建脚本注入数据后方可使用。</div>';
} else {
  buildHome();
  buildPanels();
  refreshProgress();
}

/* ============ 合体视图切换：学习区 ↔ 题库刷题区 ============
   quiz-embed 内的「← 返回学习目录」按钮与底部导航「📚 学习」都调用 window.kbShowLearnHome */
function kbShowQuiz(){
  detachSpy();
  closeSide();
  home.style.display = 'none';
  chapBox.style.display = 'none';
  const f = document.querySelector('.footer'); if(f) f.style.display = 'none';
  // 修复：.wrap 外壳仅藏子元素会残留 padding（24+60px），把题库顶栏顶离顶部 84px
  // → 外壳自身一并隐藏，保证进入题库视图即贴顶
  const w = document.querySelector('.wrap'); if(w) w.style.display = 'none';
  const qv = document.getElementById('quizView');
  if(qv){
    qv.style.display = 'block';
    const tt = document.getElementById('qzTopTitle');
    if(tt) tt.textContent = (DATA.meta.cnName ? DATA.meta.exam + ' · ' + DATA.meta.cnName : DATA.meta.exam) + ' 题库刷题';
  }
  window.scrollTo(0,0);
  document.title = baseTitle() + ' · 题库刷题';
}
function kbShowLearnHome(){
  detachSpy();
  closeSide();
  const qv = document.getElementById('quizView');
  if(qv) qv.style.display = 'none';
  const f = document.querySelector('.footer'); if(f) f.style.display = '';
  home.style.display = '';
  const w = document.querySelector('.wrap'); if(w) w.style.display = '';
  window.scrollTo(0,0);
  document.title = baseTitle();
  refreshProgress();
}
window.kbShowQuiz = kbShowQuiz;
window.kbShowLearnHome = kbShowLearnHome;
})();
</script>
<script>
/* 图灯箱（移动适配 P1=A）：正文图当前渲染等效字号 <9.5px 时点击可放大到原始 viewBox 尺寸
   等效字号 = 图内最小 text 字号 × (当前渲染宽 ÷ viewBox 宽)；桌面可读图不触发，不打断阅读 */
(function(){
  'use strict';
  var box = null, stage = null;
  function minFontPx(svg){
    var t = svg.querySelectorAll('text'), mn = Infinity;
    for (var i = 0; i < t.length; i++){
      var v = parseFloat(t[i].getAttribute('font-size'));
      if (isNaN(v)){ var cs = getComputedStyle(t[i]); v = parseFloat(cs.fontSize); }
      if (!isNaN(v) && v < mn) mn = v;
    }
    return isFinite(mn) ? mn : 12;
  }
  function effFont(svg){
    var vb = svg.viewBox && svg.viewBox.baseVal;
    if (!vb || !vb.width) return 99;                 // 无 viewBox：不介入
    var w = svg.getBoundingClientRect().width || vb.width;
    return minFontPx(svg) * (w / vb.width);
  }
  function close(){
    if (box) box.classList.remove('show');
    document.documentElement.style.overflow = '';
  }
  function open(svg){
    if (!box){
      box = document.createElement('div');
      box.className = 'fig-lightbox';
      box.innerHTML = '<button class="lb-close" aria-label="关闭放大图">✕</button><div class="lb-stage"></div>';
      document.body.appendChild(box);
      stage = box.querySelector('.lb-stage');
      box.querySelector('.lb-close').addEventListener('click', close);
      box.addEventListener('click', function(e){ if (e.target === box) close(); });
    }
    var vb = svg.viewBox.baseVal;
    var clone = svg.cloneNode(true);
    clone.style.width = vb.width + 'px';             // 原始 viewBox 尺寸 1:1
    clone.style.maxWidth = 'none';
    clone.style.height = 'auto';
    stage.innerHTML = '';
    stage.appendChild(clone);
    box.classList.add('show');
    document.documentElement.style.overflow = 'hidden';
    stage.scrollTop = 0; stage.scrollLeft = 0;
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
  document.addEventListener('click', function(e){
    var svg = e.target.closest ? e.target.closest('.fig-body svg') : null;
    if (!svg) return;
    if (effFont(svg) >= 9.5) return;                 // 当前渲染下可读 → 不打断
    e.preventDefault();
    open(svg);
  });
})();
</script>
