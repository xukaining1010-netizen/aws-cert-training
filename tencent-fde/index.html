<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>学习材料</title>
<style>
/* ===== 页面结构：首页目录 + 章级分页 SPA（非单一长页） ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;font-size:17px;line-height:1.7}
.wrap{max-width:1200px;margin:0 auto;padding:24px 28px 60px}
@media(max-width:768px){.wrap{padding:16px 14px 48px}}

/* ===== 首页 ===== */
.hdr{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:12px;padding:30px 32px 26px;margin-bottom:18px}
.hdr-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:3px 12px;border-radius:20px;margin-bottom:10px}
.hdr h1{font-size:24px;font-weight:800;line-height:1.4}
.hdr-sub{font-size:13px;opacity:.9;margin-top:8px}
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.ov-item{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.ov-num{font-size:28px;font-weight:800;color:#4f46e5;line-height:1.2}
.ov-lbl{font-size:12px;color:#64748b;margin-top:4px}
@media(max-width:768px){.ov{grid-template-columns:repeat(2,1fr)}}

.card-s{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.cs-title{font-size:18px;font-weight:700;color:#374151;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}

/* 章节目录卡 */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ch-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 16px;cursor:pointer;transition:.2s;margin-bottom:0}
.ch-card:hover{border-color:#7c3aed;transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,70,229,.12)}
.ch-card.done{border-color:#16a34a}
.cc-num{font-size:11px;font-weight:700;margin-bottom:3px}
.cc-title{font-size:15px;font-weight:700;color:#1e293b;margin-bottom:6px}
.cc-meta{font-size:13px;color:#64748b}
.cc-prog{margin-top:8px}
.pm{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:3px}
.pbar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .4s}

/* 考试速览 */
.exam-quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.eq-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 10px;text-align:center}
.eq-num{font-size:20px;font-weight:800;color:#4f46e5;line-height:1.2}
.eq-sub{font-size:10.5px;color:#64748b;margin-top:2px}
.eq-lbl{font-size:11px;color:#64748b;margin-top:5px}
.exam-two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:10px}
@media(max-width:768px){.exam-two-col{grid-template-columns:1fr}}
.exam-sub-t{font-size:14px;font-weight:700;color:#374151;margin:4px 0 10px}
.exam-domain-tbl{width:100%;border-collapse:collapse;font-size:15px}
.exam-domain-tbl th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;padding:9px 12px;text-align:left;font-weight:700}
.exam-domain-tbl td{padding:9px 12px;border-bottom:1px solid #e9d5ff;vertical-align:middle}
.exam-domain-tbl tr:nth-child(even) td{background:#faf5ff}
.domain-chip{display:inline-block;border-radius:20px;padding:2px 11px;font-size:12px;font-weight:700;background:#ede9fe;color:#5b21b6;cursor:pointer;border:none;transition:.15s}
.domain-chip:hover{background:#ddd6fe}
.exam-info-list{font-size:15px;color:#374151;margin:0 0 12px 18px}
.exam-info-list li{margin-bottom:6px;line-height:1.7}
.exam-steps{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px;font-size:14px}
.step-block{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;padding:9px 12px;font-size:13px;color:#4338ca;flex:1 1 150px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.step-block b{display:block;font-size:13px}
.step-block span{display:block;font-size:11.5px;color:#6d28d9;margin-top:3px}
.step-arrow{color:#a78bfa;font-weight:700;font-size:16px;padding:0 4px;flex:0 0 auto;align-self:center}
details.exam-faq{margin-top:12px;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;background:#f8fafc}
details.exam-faq summary{font-size:14px;font-weight:700;color:#374151;cursor:pointer}
details.exam-faq p{margin:9px 0 0;font-size:14px;color:#475569;line-height:1.75}

/* 14 天计划 */
.ptbl{width:100%;border-collapse:collapse;font-size:15px}
.ptbl th{background:#f8fafc;padding:11px 12px;text-align:left;font-weight:600;color:#374151;border-bottom:2px solid #e2e8f0;font-size:14px}
.ptbl td{padding:10px 12px;border-bottom:1px solid #f8fafc;vertical-align:middle}
.ptbl tr:last-child td{border-bottom:none}
.day{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.chip-p{background:#ede9fe;color:#5b21b6}.chip-p:hover{background:#ddd6fe}
.focus{font-size:12px;color:#64748b}

/* ===== 章面板 ===== */
.ch-topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);padding:8px 18px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px}
.back-btn{background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:13px;font-weight:600;border-radius:8px;padding:5px 14px;cursor:pointer;white-space:nowrap;transition:.15s}
.back-btn:hover{background:#ede9fe}
.tn-title{font-size:15px;font-weight:700;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-hdr{color:#fff;padding:20px 22px 16px;border-radius:12px 12px 0 0;margin-bottom:0}
.ch-badge{font-size:13px;font-weight:700;opacity:.9;margin-bottom:5px;display:block}
.ch-title{font-size:22px;font-weight:800}
.panel{margin-bottom:14px}
.task-list{padding-left:22px;font-size:16px;color:#374151;line-height:2.0}
.task-list li::marker{color:#a78bfa}
.task-list a{color:#374151;text-decoration:none}
.task-list a:hover{color:#4f46e5}
.tl-id{display:inline-block;min-width:38px;font-weight:700;color:#4f46e5;margin-right:6px}
.panel-hr{border:none;border-top:1px solid #e2e8f0;margin:14px 0}

/* ===== 正文排版（规范 B） ===== */
.mdbody .sec-block h2.mh2{font-size:19px;font-weight:700;color:#4f46e5;margin:4px 0 12px;padding:10px 0 8px;border-top:1px solid #e2e8f0}
.mdbody p{font-size:17px;color:#374151;margin-bottom:14px;line-height:1.9}
.mdbody ul,.mdbody ol{font-size:17px;color:#374151;padding-left:24px;margin-bottom:12px}
.mdbody li{margin-bottom:8px;line-height:1.9}
.mdbody blockquote{border-left:3px solid #a78bfa;padding:10px 16px;background:#f5f3ff;font-size:15px;color:#5b21b6;margin:0 0 14px;border-radius:0 6px 6px 0;line-height:1.8}
.mdbody code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.mdbody h4.sec-h{font-size:17px;font-weight:600;color:#374151;margin:24px 0 10px;padding-left:12px;border-left:3px solid #a78bfa;line-height:1.4}
.mdbody .case-card,.mdbody .mem-card{border-radius:10px;padding:13px 16px;margin-bottom:14px}
.mdbody .case-card{background:#fff8e6;border:1px solid #ecd9a0}
.mdbody .mem-card{background:#eef3ff;border:1px solid #b9c9f7}
.mdbody .case-card h4.sec-h,.mdbody .mem-card h4.sec-h{border-left:none;padding-left:0;margin:0 0 8px;font-size:14px;font-weight:700}
.mdbody .case-card h4.sec-h{color:#9a7b1e}
.mdbody .mem-card h4.sec-h{color:#4361ee}
.mdbody .case-card p,.mdbody .mem-card p{font-size:15px}
.mdbody .case-card ul,.mdbody .mem-card ul{margin-bottom:0;font-size:15px}
/* 表格（规范 C） */
.tbl-wrap{overflow-x:auto;margin:0 0 14px;border:1px solid #e9d5ff;border-radius:10px}
.tbl-wrap table{min-width:480px}
table{border-collapse:collapse;width:100%;font-size:16px}
.mdbody th,.mdbody td{padding:11px 16px;text-align:left;border-bottom:1px solid #e9d5ff;vertical-align:top;line-height:1.6}
.mdbody thead th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;font-weight:700;font-size:15px;white-space:nowrap}
.mdbody tbody tr:nth-child(even) td{background:#faf5ff}
.mdbody tbody tr:last-child td{border-bottom:none}
/* 图块（v2.1 图文同流） */
.fig-block{background:#f8f7ff;border:1px solid #ddd6fe;border-radius:12px;padding:14px 16px;margin:0 0 14px}
.fig-placeholder{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fbfafd;border:1.6px dashed #c4b5fd;border-radius:12px;padding:12px 16px;margin:0 0 14px}
.fig-img{background:#f8f7ff;border:1px solid #ddd6fe;border-radius:12px;padding:10px 12px;margin:0 0 14px;text-align:center}
.fig-img img{max-width:100%;height:auto;border-radius:8px}
.fig-img figcaption{font-size:12px;color:#64748b;margin-top:6px;line-height:1.5}
.mdbody .inline-img{max-width:100%;height:auto;vertical-align:middle;border-radius:6px;margin:0 2px}
.mdbody .img-bad{display:inline-block;background:#fef2f2;border:1px dashed #ef4444;color:#b91c1c;font-size:13px;padding:1px 8px;border-radius:6px}
.fig-placeholder .fp-num{background:#7c3aed;color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.fig-placeholder .fp-type{background:#ede9fe;color:#6d28d9;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.fig-placeholder .fp-alt{color:#334155;font-size:14px;flex:1 1 auto;min-width:120px}
.fig-placeholder .fp-note{color:#94a3b8;font-size:12px;white-space:nowrap;border:1px dashed #cbd5e1;border-radius:6px;padding:2px 8px}
.fig-title{font-size:13px;font-weight:700;color:#4f46e5;text-align:center;margin-bottom:10px}
.fig-body{overflow-x:auto}
.fig-body svg{display:block;margin:0 auto;height:auto}
.fig-caption{font-size:12px;color:#6b7280;text-align:center;margin-top:10px;font-style:italic}
/* 手绘图 CSS 类（兼容） */
.compare-tbl{width:100%;border-collapse:collapse;font-size:13px}
.compare-tbl th{padding:9px 12px;font-weight:700;font-size:12px;text-align:center}
.compare-tbl td{padding:8px 12px;border:1px solid #e2e8f0;font-size:13px;vertical-align:top;line-height:1.5}
.compare-tbl tr:nth-child(even) td{background:#faf9ff}
.flow-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.flow-node{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;text-align:center;min-width:80px}
.flow-node.light{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#4338ca}
.flow-node.green{background:linear-gradient(135deg,#06d6a0,#059669);color:#fff}
.flow-arrow{color:#a78bfa;font-size:18px;font-weight:700;flex-shrink:0}
.cycle-wrap{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.cycle-step{display:flex;flex-direction:column;align-items:center;gap:4px}
.cycle-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.cycle-label{font-size:11px;color:#374151;text-align:center;max-width:70px;line-height:1.3}
.cycle-arrow{color:#a78bfa;font-size:16px;align-self:flex-start;margin-top:6px}
.stair-wrap{display:flex;align-items:flex-end;gap:8px;padding:8px 0;justify-content:center;flex-wrap:wrap}
.stair-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.stair-bar{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:6px 6px 0 0;width:80px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;padding:4px}
.stair-label{font-size:11px;color:#374151;text-align:center;max-width:80px;line-height:1.3}

/* 域尾提示卡 */
.tips-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tips-card .tc-title{font-size:15px;font-weight:700;margin-bottom:10px;color:#374151}
.tips-card table{font-size:14px}
.tips-card th{padding:9px 12px;font-size:13px}
.tips-card td{padding:9px 12px;font-size:14px;line-height:1.6}

/* ===== 章末练习 quiz-box（模块 10） ===== */
.quiz-box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:18px 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);scroll-margin-top:78px}
.quiz-hdr{display:flex;align-items:baseline;gap:14px;font-size:18px;font-weight:700;color:#374151;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}
.quiz-score{font-size:14px;font-weight:700;color:#4f46e5;margin-left:auto;white-space:nowrap}
.qi{border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.qi.done{background:#fafafa}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qbadge{background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:700}
.qtype{font-size:11px;border-radius:12px;padding:1px 9px;font-weight:600}
.qtype-s{background:#e0f2fe;color:#0369a1}
.qtype-m{background:#fce7f3;color:#be185d}
.qstem{font-size:16px;color:#1e293b;margin-bottom:10px;line-height:1.8}
.qstem code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{background:#fff;border:1.5px solid #e2e8f0;border-radius:9px;padding:11px 14px;font-size:15.5px;color:#374151;cursor:pointer;transition:.15s;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:#a78bfa}
.opt .ol{font-weight:700;color:#4f46e5;flex-shrink:0}
.opt.sel{border-color:#4f46e5;background:#ede9fe}
.opt.cor{border-color:#16a34a;background:#dcfce7}
.opt.wrg{border-color:#dc2626;background:#fee2e2}
.opt.shc{border-color:#16a34a;background:#f0fdf4}
.qi.done .opt{cursor:default;pointer-events:none}
.qrow{margin-top:10px;display:flex;align-items:center;gap:12px}
.qbtn{background:#4f46e5;color:#fff;font-size:12px;font-weight:600;border:none;border-radius:7px;padding:7px 18px;cursor:pointer;transition:.15s}
.qbtn:hover{background:#4338ca}
.qbtn:disabled{background:#cbd5e1;cursor:default}
.qres{display:none;flex:1;border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.7}
.qres.ok{background:#dcfce7;color:#15803d}
.qres.err{background:#fee2e2;color:#b91c1c}
.qres.na{background:#fef3c7;color:#b45309}
.qres.show{display:block}
/* 长串防溢出：overflow-wrap:anywhere 仅在 token 放不下时词内断行，普通文本断词行为不变；
   根治 SCP JSON/ARN 等不可断长串撑破移动端面板（SAP-C02 实测 sw=448→390） */
.mdbody,.quiz-box,.qi,.qstem,.opts,.opt{overflow-wrap:anywhere}
.qstem code,.opt code{white-space:pre-wrap;word-break:break-all}
.score-box{display:none;text-align:center;background:#f5f3ff;border-radius:10px;padding:22px 16px;margin-top:16px}
.score-box.show{display:block}
.score-num{font-size:32px;font-weight:700;color:#4f46e5;line-height:1.3}
.score-lbl{font-size:13px;color:#6d28d9;margin-top:4px}
.score-box .sb-tip{font-size:12px;color:#64748b;margin-top:8px;line-height:1.7}

.footer{margin-top:26px;padding:18px 10px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:12.5px;text-align:center;line-height:1.9}
.footer a{color:#4f46e5;text-decoration:none}
@media(max-width:768px){.ptbl th,.ptbl td{font-size:13px}.mdbody th,.mdbody td{font-size:13px}}

/* ===== 章面板 v6 布局：左侧常驻目录槽 + 正文列 =====
   三条布局约定：① 正文 #### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点，见下方 .mh3）
   ② 左侧目录两级（节 ▸ 知识点，单开手风琴 + 滚动自动跟读）③ 左右两侧任何分辨率留白，目录常驻不遮正文：
   ≥1200px：.panel 栅格 [236px 目录槽 | 正文列]，目录 sticky 常驻；<1200px：目录槽变左侧抽屉（☰+遮罩）。 */
body.chapView .wrap{max-width:1420px}
.panel{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start;margin-bottom:14px}
.ch-side{position:sticky;top:14px;min-width:0;z-index:30}
.side-close{display:none}
.toc-open-btn{display:none}
.side-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:85;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.side-mask.show{opacity:1;visibility:visible}
.ch-toc{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 6px 24px rgba(15,23,42,.06);overflow:hidden}
.ch-toc .toc-hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;border-bottom:1px solid #f1f5f9}
.ch-toc .th-title{font-size:13px;font-weight:800;color:#4f46e5;white-space:nowrap}
.ch-toc .th-meta{font-size:11px;color:#94a3b8;font-weight:600;white-space:nowrap}
.ch-toc .toc-body{max-height:calc(100vh - 46px);overflow-y:auto;padding:8px}
.toc-list{list-style:none;margin:0;padding:0}
.toc-list a{display:flex;align-items:baseline;gap:6px;padding:5px 6px;border-radius:7px;color:#475569;text-decoration:none;line-height:1.45;font-size:13px;transition:.12s}
.toc-list a:hover{background:#f5f3ff;color:#4f46e5}
.toc-list a.act{background:#ede9fe;color:#3730a3;font-weight:600}
.toc-list .tl-id{font-size:11.5px;font-weight:700;color:#a78bfa;flex-shrink:0;font-variant-numeric:tabular-nums}
.toc-list a.act .tl-id{color:#4f46e5}
.toc-t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toc-sec>a.toc-sec-link{font-weight:600;color:#334155;padding-top:6px;padding-bottom:6px}
.toc-sec>a .toc-ar{margin-left:auto;flex-shrink:0;font-size:9px;color:#94a3b8;transition:transform .18s}
.toc-sec.open>a .toc-ar{transform:rotate(90deg);color:#4f46e5}
.toc-sub{list-style:none;margin:0;padding:0 0 3px;display:none}
.toc-sec.open>.toc-sub{display:block}
.toc-sub a{padding:3px 6px 3px 20px;font-size:12.5px;color:#64748b;line-height:1.4}
.toc-sub a .tl-id{font-size:11px;color:#c4b5fd}
/* 目录尾【本章练习】入口（v6.2 新增）：独立条目，虚线分隔，点击滚到章末练习区 #quiz-dX */
.toc-quiz{margin-top:7px;padding-top:3px;border-top:1px dashed #ddd6fe}
.toc-quiz>a.toc-quiz-link{font-weight:700;color:#6d28d9;padding-top:6px;padding-bottom:6px}

const QUIZ_META = {"exam":"TC-FDE","title":"腾讯云 ADP 前沿部署工程师 (FDE) 题库","lang":"zh","updated":"2026-09-29","domains":{"1":"AI 与生成式 AI 基础","2":"ADP 产品定位与能力边界","3":"ADP 核心功能与应用搭建","4":"场景理解与方案设计","5":"行业解决方案与案例落地","6":"交付实施、评测与运维","7":"安全合规与责任 AI"},"weights":{"1":"10%","2":"7%","3":"22%","4":"25%","5":"15%","6":"11%","7":"10%"},"examParams":{"count":60,"minutes":90,"pass":70,"questionTypes":"单选题 40（每题 1.5 分）+ 多选题 20（每题 2 分），线下闭卷机考（Prometric，代码 C1721），满分 100"},"footerNote":"题库为依据腾讯云官方考纲（7 域权重表）与 ADP 官方文档自编（300 题），非官方真题；以腾讯云官方材料为准"};
const QUIZ_QUESTIONS = [{"id":"TF-D1-001","d":1,"t":"single","q":"关于人工智能、机器学习、深度学习三者的关系，下列理解正确的是哪一项？","o":[{"l":"A","t":"人工智能最大，机器学习是其子集，深度学习又是机器学习的子集"},{"l":"B","t":"三者是并列的三种独立技术，互不包含"},{"l":"C","t":"深度学习最大，机器学习和人工智能都是它的分支"},{"l":"D","t":"机器学习最大，人工智能是它的一种实现方式"}],"a":["A"],"e":"三者是层层嵌套关系。人工智能是让机器表现出类似人的智能行为这一整个目标领域，范围最大；机器学习是其中让机器从数据里自己找规律的方法；深度学习是机器学习中用多层神经网络来学习的一支，范围最小。\n【干扰项】\nB：三者并非并列独立的技术，而是外圈套内圈的包含关系，把它们说成互不包含就误解了本质。\nC：把范围最小的深度学习当成最大的圈，包含方向完全颠倒，实际它只是机器学习的一个分支。\nD：人工智能是目标领域而非机器学习的实现方式，此项把两者的主从关系弄反了。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-002","d":1,"t":"single","q":"传统的规则系统在处理快递面单地址识别这类任务时，最主要的局限是什么？","o":[{"l":"A","t":"识别速度太慢，无法满足实时需求"},{"l":"B","t":"格式一旦变化规则就失灵，需要工程师不停打补丁"},{"l":"C","t":"只能处理中文地址，无法处理英文"},{"l":"D","t":"必须联网才能运行"}],"a":["B"],"e":"规则系统靠人手写死的规则运行，一旦面单格式或地址写法发生变化，原有规则就会失灵，工程师必须不断增补规则来打补丁，而地址写法千变万化，补丁永远打不完。这正是后来改用机器学习让系统自学规律的动因。\n【干扰项】\nA：速度不是规则系统的核心短板，规则匹配通常很快，真正的问题在于难以适应格式变化。\nC：语言种类并非规则系统的本质局限，只要写对应规则即可，中英文都能处理。\nD：规则系统在本地即可运行，是否联网与它的核心局限没有任何关系，属于无关项。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-003","d":1,"t":"single","q":"生成式 AI 与传统判断类机器学习模型最本质的区别在于哪里？","o":[{"l":"A","t":"生成式 AI 运行速度更快"},{"l":"B","t":"生成式 AI 不需要训练数据"},{"l":"C","t":"生成式 AI 输出的是全新内容，而非从选项里挑一个标签或分数"},{"l":"D","t":"生成式 AI 只能处理图片"}],"a":["C"],"e":"传统判断类模型做的是判断题，输出是一个标签或分数，比如判断图片是猫还是狗。生成式 AI 的输出是全新的内容，一段文字、一张图或一段代码，它不是从既有选项里挑选，而是无中生有地创造出来。这一差别直接带来了输出无唯一标准答案的评测难题。\n【干扰项】\nA：速度不是两者的本质区别，判断类模型未必更慢，此项没抓住生成与判断的核心差异。\nB：生成式 AI 同样依赖大量训练数据才能学会生成，说它不需要训练数据是明显错误。\nD：生成式 AI 能生成文字、图片、音频、视频等多种内容，把它局限为只能处理图片并不准确。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-004","d":1,"t":"single","q":"某财务团队想直接用大语言模型计算月度报表的合计数，结果发现模型会算错账。对这一现象最准确的理解是什么？","o":[{"l":"A","t":"模型出了故障，需要重装"},{"l":"B","t":"只要换一个更大的模型就一定能算对"},{"l":"C","t":"大语言模型永远无法参与任何和数字有关的任务"},{"l":"D","t":"模型擅长语言理解与生成，不擅长严谨数值计算，属于用错了地方"}],"a":["D"],"e":"大语言模型的强项是语言理解和文字生成，它不是数据库，也不做严谨的数值计算。让它直接精算报表合计，是把擅长写文章的大脑用去做精算，属于用错了地方。正确做法是让模型理解需求、再调度工具来算数，理解与计算各司其职。\n【干扰项】\nA：算错账不是模型故障，而是能力边界所致，重装也解决不了它不擅长精算的本质问题。\nB：换更大的模型也改不了它不擅长精确计算的本质，规模提升并不能补上数值精算这一短板。\nC：模型可以理解数值需求并调度工具来算，说它完全不能沾任何数字任务也过于绝对。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-005","d":1,"t":"single","q":"大语言模型之所以被称为「大」，主要指的是什么？","o":[{"l":"A","t":"它的参数规模和训练数据都极其庞大"},{"l":"B","t":"它的参数量越大，回答就一定越准确"},{"l":"C","t":"它的训练数据一定包含最新发生的事"},{"l":"D","t":"它一次能记住的对话轮数是无限的"}],"a":["A"],"e":"大语言模型的「大」，指的是它的参数规模和训练数据都极其庞大。正是这种规模，让它具备了强大的语言理解和文字生成能力，成为当前绝大多数智能体项目的底座。\n【干扰项】\nB：参数量大不等于回答一定准，模型仍会有幻觉，规模大只是能力基础，不是准确性的保证，学员常把「大」直接等同于「准」。\nC：模型的训练数据有截止时间，不会自动包含最新发生的事，把「大」误解为「实时全知」是常见错误。\nD：模型能记住的对话受上下文窗口限制，并非无限，把「大」理解成「记忆无限」混淆了规模与记忆边界。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-006","d":1,"t":"single","q":"从底层机制看，大语言模型生成一段流畅回答的过程本质上是什么？","o":[{"l":"A","t":"从一个巨大的答案库里检索最匹配的整段文字"},{"l":"B","t":"不断预测下一个最可能出现的词，逐词接龙直到完成"},{"l":"C","t":"把问题翻译成数学公式再求解"},{"l":"D","t":"随机拼凑词语碰运气"}],"a":["B"],"e":"大语言模型的核心动作是预测下一个词。给它一段话，它预测接下来最可能出现的那个词，接上后再预测下一个，如此循环直到生成完整回答。理解这一点，就能解释它为何会一本正经地补出并不真实的内容。\n【干扰项】\nA：模型不是从答案库里检索整段文字，而是逐词生成，此项误解了它的底层运转方式。\nC：它并非把问题转成数学公式再求解，语言生成走的是概率接龙而不是解方程的路子。\nD：接龙受概率分布和上下文约束，方向并非纯随机，说它碰运气忽略了机制的规律性。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-007","d":1,"t":"single","q":"模型「一本正经地胡说」，也就是幻觉现象，其根源与下列哪一点最直接相关？","o":[{"l":"A","t":"模型故意欺骗用户"},{"l":"B","t":"训练数据里全是错误信息"},{"l":"C","t":"模型追求接出最像样的词，而非最真实的词，真实信息缺失时会用通顺表达补完"},{"l":"D","t":"用户的网络不稳定"}],"a":["C"],"e":"模型按预测下一个词的逻辑运转，追求的是接下来最像样、最通顺的词，而不是最真实的词。当真实信息缺失时，它会用最通顺的表达把话补完，于是产生了看似工整却并不存在的内容，这就是幻觉的根源之一。\n【干扰项】\nA：幻觉不是模型的主观欺骗，它没有欺骗意图，而是生成机制在信息缺失时的自然产物。\nB：训练数据并非全是错误信息，幻觉主要源于生成逻辑在信息缺失时的补完，而不是数据全错。\nD：网络状况属于外部环境因素，与模型是否产生幻觉没有关系，此项属于无关干扰。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-008","d":1,"t":"single","q":"注意力机制在大语言模型处理一句话时起到的核心作用是什么？","o":[{"l":"A","t":"让模型按顺序匀速读完每个词"},{"l":"B","t":"把句子翻译成另一种语言"},{"l":"C","t":"压缩句子长度以节省内存"},{"l":"D","t":"动态判断句中哪些词与当前词最相关，给相关词分配更多权重"}],"a":["D"],"e":"一句话里各词分量不同。注意力机制让模型在处理每个词时，动态判断句中哪些词和当前词最相关，给相关的词分配更多注意力权重，从而在长句里抓住真正相关的部分，而不是机械地按顺序匀速读。\n【干扰项】\nA：注意力机制恰恰打破了匀速顺序阅读，它会有重点地在相关词之间关联，而非平均用力。\nB：它不是翻译功能，而是句内的权重分配机制，此项把注意力和翻译两件事混淆了。\nC：它的目的不是压缩句子长度以省内存，而是抓住词与词之间的相关性。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-009","d":1,"t":"single","q":"某法务团队想让智能体一次性读完一份上百页长合同再回答问题，却发现回答不完整。最可能的原因和对策是什么？","o":[{"l":"A","t":"合同太长超出模型上下文窗口，应引入知识库和 RAG 按需检索相关片段"},{"l":"B","t":"把整份合同重复粘贴几遍，模型就能读全"},{"l":"C","t":"换一个参数更大的模型就一定能读完任意长度"},{"l":"D","t":"让模型自己多读几遍合同就能补全遗漏"}],"a":["A"],"e":"模型一次能处理的文字长度有上限，称为上下文窗口，超出窗口的部分模型看不见。上百页长合同若超出窗口，模型只能看到截断的一部分，回答自然不完整。对策是引入知识库和 RAG，把长文档切片、按需检索相关片段喂给模型。\n【干扰项】\nB：重复粘贴只会更快撑爆上下文窗口，超出的部分照样看不见，无法解决篇幅超限问题。\nC：换更大模型只是把窗口撑大一些，仍有上限，不能保证读完任意长度，治标不治本。\nD：多读几遍改变不了「超出窗口的内容根本进不来」这一事实，模型看不见的部分读多少遍都补不上。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-010","d":1,"t":"single","q":"关于 Prompt（提示词）在使用大语言模型时的作用，下列理解最准确的是哪一项？","o":[{"l":"A","t":"Prompt 只是随便打个招呼，对输出质量没有影响"},{"l":"B","t":"Prompt 是给模型的输入指令，写得越清晰具体，模型接龙方向越准，输出质量差别很大"},{"l":"C","t":"Prompt 必须用英文写才有效"},{"l":"D","t":"Prompt 越长输出一定越好"}],"a":["B"],"e":"Prompt 是你给模型的输入指令。模型根据你给的上下文来预测下一个词，因此指令越清晰、越具体，它接龙的方向就越准，输出质量可以天差地别。明确角色、格式、语气和结构，能把模型的输出牢牢框住，这是最轻量高频的调优手段。\n【干扰项】\nA：Prompt 对输出质量影响极大，同一模型指令写得好不好结果天差地别，绝非无关紧要。\nC：中文 Prompt 同样有效，语言种类不是关键，关键在于指令是否清晰具体。\nD：长度不等于质量，堆砌字数反而可能稀释重点，关键在清晰具体而非一味写长。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-011","d":1,"t":"single","q":"智能体（Agent）相比一个纯大语言模型，最关键的增量能力是什么？","o":[{"l":"A","t":"聊天更流畅"},{"l":"B","t":"回答速度更快"},{"l":"C","t":"能理解目标、拆解步骤、调用外部工具并记住上下文，真正把事做完"},{"l":"D","t":"占用资源更少"}],"a":["C"],"e":"如果说大语言模型是很会聊天写字的大脑，智能体就是给这个大脑装上了手脚和记忆。它能理解目标、拆解步骤、调用外部工具、记住上下文，最后交付一个结果，把「说」变成「做」。这套能动手的能力是纯模型不具备的。\n【干扰项】\nA：聊天流畅是大语言模型本身就具备的能力，并不是智能体相比纯模型的增量所在。\nB：回答速度快不是智能体区别于纯模型的关键，智能体的价值在于能调度工具真正做事。\nD：智能体通常需要更多编排和工具调用，资源未必更少，此项与它的核心价值无关。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-012","d":1,"t":"single","q":"你让纯大语言模型「帮我订下周去某城市的机票」，它只能告诉你订票的一般流程却订不了。这说明了什么？","o":[{"l":"A","t":"模型不懂中文"},{"l":"B","t":"模型的训练数据过期了"},{"l":"C","t":"必须付费才能订票"},{"l":"D","t":"纯模型能说不能做，缺少调用工具真正执行的能力"}],"a":["D"],"e":"纯大语言模型只能生成文字，讲得头头是道却无法真正查航班、比价格、填信息、下订单。它能说不能做。要真正完成订票，需要智能体接上外部工具去执行，这正是把语言能力接上手脚的价值。\n【干扰项】\nA：模型完全懂中文，问题不在语言理解，而在于它缺少调用工具真正执行订票的能力。\nB：能否执行订票与训练数据是否过期无关，即便数据很新，纯模型照样只能说不能做。\nC：付费与否不是它订不了票的原因，根本症结在于纯模型缺少连接订票系统的执行能力。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-013","d":1,"t":"single","q":"某连锁门店想要一个能自动回复顾客咨询的助手，顾客问「我上周的订单到哪了」。纯模型与智能体的表现差异说明了什么？","o":[{"l":"A","t":"纯模型只会解释一般查询方式，智能体能接上订单系统查到真实物流再回复"},{"l":"B","t":"两者表现完全一样"},{"l":"C","t":"智能体不需要接任何系统就能知道订单状态"},{"l":"D","t":"纯模型比智能体更适合这个场景"}],"a":["A"],"e":"面对具体订单查询，纯模型只能解释一般查询方式，答不出真实状态。智能体能接上订单系统，查到真实物流信息，再用自然语言回给顾客。差别就在于智能体能动手，而这套能力取决于你为它接了哪些工具。\n【干扰项】\nB：两者表现差异明显，纯模型只能说明一般流程，智能体却能查到真实订单并回复，绝非一样。\nC：智能体也要接上订单系统才能拿到真实状态，说它不接任何系统就能知道订单状态是错的。\nD：需要真实查询的场景恰恰是智能体更合适，纯模型答不出真实物流，此项判断正好相反。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-014","d":1,"t":"single","q":"智能体「能动手」的前提是什么？","o":[{"l":"A","t":"模型参数足够大就会自动获得动手能力"},{"l":"B","t":"你为它接好了工具、划定了权限，它才能真正去操作"},{"l":"C","t":"只要开机它就无所不能"},{"l":"D","t":"必须由顾客亲自授权每一步"}],"a":["B"],"e":"智能体不会凭空长出连接外部系统的能力。它动手的前提，是你在平台上为它接好了工具、划定了权限。它的本事有多大，取决于你给它接了哪些工具、开了哪些权限。把这层讲透，客户对交付范围的预期才会实在。\n【干扰项】\nA：动手能力来自工具接入和权限配置，不是参数够大就会自动获得，此项混淆了规模与能力来源。\nC：开机不等于万能，智能体能做什么由你为它配置的工具和权限决定，并非一开机就无所不能。\nD：权限是在交付时统一配置好的，并非每一步都要顾客现场授权，此项误解了权限的设定方式。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-015","d":1,"t":"single","q":"当客户提出「让 AI 保证百分之百准确」时，交付工程师较为专业的应对方式是什么？","o":[{"l":"A","t":"直接答应，保证做到百分之百"},{"l":"B","t":"告诉客户这个需求太蠢无法实现"},{"l":"C","t":"从生成式 AI 原理出发说明输出天然存在不确定性，把话题引到用评测和约束把风险降到可接受范围"},{"l":"D","t":"回避这个问题不作回应"}],"a":["C"],"e":"生成类输出天然存在不确定性，这是原理决定的。专业做法是从原理出发向客户讲清这一点，既不夸口也不泼冷水，然后把话题引导到如何通过评测和约束把风险降到可接受范围，让客户感到你比他更懂技术边界，因此更值得托付。\n【干扰项】\nA：承诺百分之百准确是做不到的空头承诺，一旦兑现不了后续交付必然陷入被动。\nB：贬低客户需求既不专业也会伤害信任，专业做法是讲清原理而不是指责客户的想法。\nD：回避问题会让客户对你失去信心，专业应对是正面讲清边界并给出可行的风险控制路径。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-016","d":1,"t":"single","q":"深度学习让快递面单地址识别准确率大幅提升，其关键原因是什么？","o":[{"l":"A","t":"工程师写了更多规则"},{"l":"B","t":"面单数量减少了"},{"l":"C","t":"换用了更高清的扫描设备"},{"l":"D","t":"多层网络层数越多，能捕捉的规律越细，认得越准"}],"a":["D"],"e":"深度学习用多层神经网络来学习，层数越多，模型能捕捉到的规律越细致，识别也就越准。它不再依赖工程师手写规则，而是从大量真实面单中自行学习地址规律，这正是它相比规则系统的优势所在。\n【干扰项】\nA：深度学习恰恰摆脱了工程师手写规则的老路，靠的是自学规律而不是写更多规则来提升。\nB：数据量通常越多越有利于模型学习，减少面单数量不会提升准确率，此项方向相反。\nC：把准确率提升归功于扫描硬件是常见误解，识别能力的提升来自模型算法本身，而非采集设备清晰度。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-017","d":1,"t":"single","q":"生成式 AI 让某设计团队一个下午出几十版海报草图，过去要画好几天。这最能说明生成式 AI 改变了什么？","o":[{"l":"A","t":"大幅降低了产出初稿、从零到一的成本"},{"l":"B","t":"彻底取代了设计师"},{"l":"C","t":"让海报质量必然达到最高水平"},{"l":"D","t":"使设计不再需要人参与挑选"}],"a":["A"],"e":"生成式 AI 未必一步到位，但能把从零到一的那段路大幅缩短，显著降低产出初稿的成本。设计团队据此快速出多版草图再挑方向，这正是许多场景值得引入它的理由。\n【干扰项】\nB：它是加速初稿产出而非取代设计师，最终方向仍需人来判断和拍定，此项夸大了它的作用。\nC：几十版草图属于初稿，质量未必最高，还需要人从中挑选并进一步打磨，并非自动达到最优。\nD：恰恰需要人从多版草图里挑方向，人的判断不可或缺，说不再需要人参与挑选是错误的。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-018","d":1,"t":"single","q":"很多客户抱怨大语言模型「转头就忘」上一轮说过的话，根子通常在哪里？","o":[{"l":"A","t":"模型太笨"},{"l":"B","t":"没有把上文一起喂给它，也就是没给它接上对话记忆"},{"l":"C","t":"模型故意装傻"},{"l":"D","t":"用户说话太快"}],"a":["B"],"e":"模型并不会天然记得上一轮说过什么，除非把上文一起喂给它。抱怨它转头就忘，根子不在模型笨，而在没给它接上记忆。接上对话记忆后，助手就能记住用户是谁、之前聊到哪，体验会明显变顺。\n【干扰项】\nA：这不是智力问题，而是记忆是否被接入的问题，把它归为模型太笨没有找准真正原因。\nC：模型没有主观故意装傻，它只是缺少上下文传入，接上记忆后自然就能记住之前的对话。\nD：用户说话快慢与模型是否记得上文无关，此项属于无关干扰，没有触及记忆机制这一关键。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-019","d":1,"t":"single","q":"交付工程师在与客户开场沟通时，先用大白话把 AI 概念图谱画一遍的主要价值是什么？","o":[{"l":"A","t":"显得自己很专业，纯粹为了炫技"},{"l":"B","t":"拖延时间"},{"l":"C","t":"确认双方说的是同一件事，把模糊需求带到能落地的那一层，省掉后面大量扯皮"},{"l":"D","t":"让客户放弃需求"}],"a":["C"],"e":"客户常站在最外层用「我要上 AI」这类空话表达需求。开场先把概念图谱画一遍，能确认双方说的是同一件事，把模糊需求带到能落地的那一层，例如落到一个能自动回订单咨询的助手，从而省掉后面大量来回扯皮。\n【干扰项】\nA：画图谱的目的是对齐双方对需求的理解，而不是为了炫技，此项没抓住这个动作的真正意图。\nB：这是在提高沟通效率、减少后续返工，而非拖延时间，说它拖延正好把作用理解反了。\nD：目的是澄清并顺势承接需求，而不是让客户放弃需求，此项对开场沟通的意图理解有误。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-020","d":1,"t":"single","q":"下列哪一项属于大语言模型的能力短板，需要交付工程师在方案里额外补救？","o":[{"l":"A","t":"读文档并做总结"},{"l":"B","t":"按指令改写文案"},{"l":"C","t":"从文字里抽取信息"},{"l":"D","t":"精确记住某条具体数据并做严谨数值计算"}],"a":["D"],"e":"大语言模型擅长语言理解和文字生成，读文档、写文案、做问答、抽信息都是它的强项。但它不是数据库，不会精确记住具体数据，也不做严谨数值计算，这一侧需要用工具补计算、用知识库补记忆来补救。\n【干扰项】\nA：读文档做总结正是模型的语言强项，不需要在方案里额外补救，此项选反了强弱侧。\nB：按指令改写文案是模型擅长的生成任务，属于可放心承诺的一侧，不是需要补救的短板。\nC：从文字里抽取信息属于模型的语言理解强项，同样不需要额外补救，此项判断有误。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-021","d":1,"t":"multiple","q":"关于生成式 AI 输出「没有唯一标准答案」这一特点，下列哪些说法是成立的？","o":[{"l":"A","t":"同一个问题它可以给出多种都合理的回答"},{"l":"B","t":"这带来了评测难题，无法像判断类模型那样只看准确率"},{"l":"C","t":"因此它的输出完全不可控，无法约束"},{"l":"D","t":"这与后面要讲的幻觉治理问题相关"}],"a":["A","B","D"],"e":"生成类输出无唯一标准答案，同一问题可有多种合理回答，因此不能像判断类模型只看准确率，评测更难，也与幻觉治理相关。这些都是生成式天性带来的连锁问题。\n【干扰项】\nC：无唯一答案不等于完全不可控，可通过 Prompt、评测和约束把风险降到可接受范围。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-022","d":1,"t":"multiple","q":"下列哪些是大语言模型的强项，可以放心承诺给客户？","o":[{"l":"A","t":"读文档并归纳要点"},{"l":"B","t":"写文案、做问答"},{"l":"C","t":"充当精确数据库记住每条具体数值"},{"l":"D","t":"从一段文字里抽取关键信息"}],"a":["A","B","D"],"e":"大语言模型天然擅长语言理解和文字生成，读文档、写文案、做问答、抽信息都是它的强项，落在这一侧的需求可以放心向客户承诺，交付风险也较低。\n【干扰项】\nC：模型不是数据库，不会精确记住每条具体数值，这属于它的短板而非强项。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-023","d":1,"t":"multiple","q":"一个完整的智能体通常具备下列哪些能力？","o":[{"l":"A","t":"理解目标"},{"l":"B","t":"拆解步骤"},{"l":"C","t":"调用外部工具"},{"l":"D","t":"在使用中自动更新底层模型的参数"}],"a":["A","B","C"],"e":"智能体是给大语言模型装上手脚和记忆的封装，能理解目标、拆解步骤、调用外部工具、记住上下文，最后交付一个结果。理解目标、拆解步骤、调用工具三项都是它的典型能力，共同把「说」变成「做」。\n【干扰项】\nD：智能体在运行时并不会自动更新底层模型的参数，它只是在应用层调度模型和工具，改参数属于模型训练环节，学员常把「智能体会学习」误解为「会自动改模型」。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-024","d":1,"t":"multiple","q":"要写好一个 Prompt 让客服助手的回复可用，通常可以在指令里明确哪些要素？","o":[{"l":"A","t":"角色，比如「你是一名资深客服」"},{"l":"B","t":"输出格式，比如不超过三句话"},{"l":"C","t":"语气与结构，比如先共情再给解决方案"},{"l":"D","t":"要求模型保证回复内容百分之百无误"}],"a":["A","B","C"],"e":"Prompt 写得越清晰具体，模型接龙方向越准。在指令里明确角色、输出格式、语气与结构，能把模型输出牢牢框住，让原本空泛客套的回复变得真正可用，这是最轻量也最高频的调优手段。\n【干扰项】\nD：要求保证百分之百无误超出生成式 AI 的能力边界，这不是靠写好 Prompt 就能兑现的承诺。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-025","d":1,"t":"multiple","q":"关于上下文窗口，下列哪些理解是正确的？","o":[{"l":"A","t":"它是模型一次能处理的文字长度上限"},{"l":"B","t":"超出窗口的内容模型就看不见"},{"l":"C","t":"即便在窗口内，内容太长也可能稀释注意力让模型抓不准重点"},{"l":"D","t":"窗口无限大，可以无限往里塞内容"}],"a":["A","B","C"],"e":"上下文窗口是模型一次能处理的文字长度上限，窗口内的内容模型都能看到并参与推理，超出部分看不见。即便在窗口内，内容太长也会稀释注意力，所以喂多少、喂什么本身是一门权衡。\n【干扰项】\nD：窗口有明确上限并非无限，硬塞超长内容会被截断，此项误以为可以无限往里塞是错误的。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-026","d":1,"t":"multiple","q":"下列关于模型幻觉的说法，哪些是正确的？","o":[{"l":"A","t":"幻觉源于模型追求接出最像样的词而非最真实的词"},{"l":"B","t":"真实信息缺失时，模型会用通顺表达把话补完"},{"l":"C","t":"幻觉是模型的主观欺骗行为"},{"l":"D","t":"幻觉可以通过评测和约束把风险降到可接受范围"}],"a":["A","B","D"],"e":"幻觉是生成机制的自然产物，模型追求最像样而非最真实的词，真实信息缺失时会用通顺表达补完，看似工整却不存在。它虽无法根除，但可通过评测和约束把风险降到可接受范围。\n【干扰项】\nC：幻觉不是主观欺骗，模型没有欺骗意图，只是在信息缺失时按生成逻辑把话补完而已。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-027","d":1,"t":"multiple","q":"从大语言模型到智能体这一跳很关键，下列哪些说法成立？","o":[{"l":"A","t":"交付工程师交付的东西几乎都落在这一跳之上"},{"l":"B","t":"这一跳让语言能力接上了工具和记忆"},{"l":"C","t":"这一跳意味着不再需要大语言模型作底座"},{"l":"D","t":"智能体把模型的「说」延伸为「做」"}],"a":["A","B","D"],"e":"从大语言模型到智能体的这一跳，让语言能力接上了工具和记忆，把「说」延伸为「做」，而交付工程师交付的东西几乎都落在这一跳之上，因此最为关键。\n【干扰项】\nC：智能体仍以大语言模型为底座，是在其上封装能力，而非抛弃底座。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-028","d":1,"t":"multiple","q":"理清 AI 概念图谱对交付工程师有哪些实际好处？","o":[{"l":"A","t":"能把客户混用的词快速定位到图谱某一格，避免答非所问"},{"l":"B","t":"能从原理出发管理客户预期"},{"l":"C","t":"报价和排期能估得更准"},{"l":"D","t":"可以让模型的准确率自动提升到百分之百"}],"a":["A","B","C"],"e":"图谱清晰的人能把客户模糊需求快速定位，避免答非所问，能从原理出发管理预期，也因为清楚哪些需求要额外搭工具和知识库而把报价排期估得更准。\n【干扰项】\nD：理清图谱不改变模型本身的准确率，更不可能自动做到百分之百。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-029","d":1,"t":"multiple","q":"关于人工智能、机器学习、深度学习、生成式 AI、大语言模型、智能体这条能力递进链，下列哪些说法正确？","o":[{"l":"A","t":"机器学习让机器从数据里找规律"},{"l":"B","t":"生成式 AI 让机器从判断走向创造"},{"l":"C","t":"大语言模型让创造聚焦在语言上"},{"l":"D","t":"大语言模型本身就能像智能体一样调用工具、完成下单等动作"}],"a":["A","B","C"],"e":"这条递进链每一环踩着上一环的肩膀：机器学习从数据找规律，生成式 AI 从判断走向创造，大语言模型让创造聚焦语言，A、B、C 三项都准确描述了链条环节。\n【干扰项】\nD：大语言模型本身只会生成语言，不能直接调用工具或完成下单等动作，接上工具和记忆去「做事」是智能体这一层的能力，学员常把纯模型和智能体的本事混为一谈。","s":"自编-TCFDE-2026-09"},{"id":"TF-D1-030","d":1,"t":"multiple","q":"某物流公司识别面单地址，从规则系统到机器学习再到深度学习的演进中，下列哪些描述是对的？","o":[{"l":"A","t":"规则系统靠工程师手写死规则，格式一变就要打补丁"},{"l":"B","t":"机器学习让系统看大量真实面单自己学规律，不再手写死规则"},{"l":"C","t":"深度学习用多层网络，层数越多捕捉的规律越细，识别越准"},{"l":"D","t":"三种方法是互相排斥、不能演进的独立技术"}],"a":["A","B","C"],"e":"这条演进线清晰：规则系统手写死规则、格式一变就打补丁；机器学习让系统从大量真实面单自学规律；深度学习用多层网络，层数越多规律捕捉越细、识别越准。三者是层层递进的关系。\n【干扰项】\nD：三种方法并非互斥独立，而是一条从手写规则到自学规律、再到多层网络的演进路径。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-001","d":2,"t":"single","q":"关于腾讯云智能体开发平台（ADP）的定位，最准确的描述是哪一项？","o":[{"l":"A","t":"一个仅提供大语言模型 API 调用的接口服务"},{"l":"B","t":"一个面向企业级智能体（Agent）开发与交付的平台"},{"l":"C","t":"一个通用的网站建设与内容管理系统"},{"l":"D","t":"一个只做数据可视化报表的工具"}],"a":["B"],"e":"ADP 是面向企业级智能体开发与交付的平台，它在大语言模型之上补齐工具、知识库、编排等能力，帮助交付工程师把模型能力封装成可落地的智能体应用。定位落在「开发与交付平台」这一层，而非单一接口或通用建站工具。\n【干扰项】\nA：把 ADP 窄化成模型 API 接口，忽略了它提供的编排、知识库与交付能力。\nC：网站建设与内容管理不是 ADP 的定位，属于完全不同的产品品类。\nD：数据可视化报表只是外围能力，不能代表 ADP 的智能体平台定位。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-002","d":2,"t":"single","q":"交付工程师向客户介绍 ADP 的核心用途时，下列哪种说法最贴合其定位？","o":[{"l":"A","t":"替代企业全部的传统数据库系统"},{"l":"B","t":"一款专门用于个人娱乐聊天的消费级产品"},{"l":"C","t":"帮助企业把大语言模型的能力封装成可落地交付的智能体应用"},{"l":"D","t":"一款完全离线的单机办公软件"}],"a":["C"],"e":"ADP 的核心用途是把大语言模型的能力封装成企业可落地交付的智能体应用，让模型从「会聊天」走向「会做事」。交付工程师据此为客户完成需求判断、方案设计与应用搭建，最终支撑企业级项目上线。\n【干扰项】\nA：ADP 不是数据库产品，也不承担替换企业全部数据库的职能，二者属于完全不同的品类。\nB：ADP 面向企业级交付场景，不是供个人娱乐聊天的消费级产品，用途定位完全不同。\nD：ADP 依托云端能力运转，需要联网使用，并不是完全离线的单机办公软件。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-003","d":2,"t":"single","q":"ADP 为满足不同客户需求，提供了哪两种服务模式？","o":[{"l":"A","t":"试用模式与付费模式"},{"l":"B","t":"单机模式与局域网模式"},{"l":"C","t":"免费模式与广告模式"},{"l":"D","t":"公有云模式与云部署模式"}],"a":["D"],"e":"ADP 提供公有云与云部署两种服务模式。公有云按需使用、无需自己维护底层资源；云部署通过许可证支持客户在自有云资源上自主部署，满足对数据与管控要求更高的场景。两种模式覆盖不同客户诉求。\n【干扰项】\nA：试用与付费只是商业计费维度，不是 ADP 官方划分的两种服务模式，混淆了概念层次。\nB：单机与局域网不符合 ADP 的云端服务形态，属于对产品形态的错误理解。\nC：免费与广告是消费级互联网产品的划分方式，与企业级平台的服务模式无关。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-004","d":2,"t":"multiple","q":"在向客户界定 ADP 能力范围时，下列哪些属于该平台提供的能力？（多选）","o":[{"l":"A","t":"智能体应用的搭建与发布"},{"l":"B","t":"知识库与连接器的接入"},{"l":"C","t":"Workflow 与 Multi-Agent 的任务编排"},{"l":"D","t":"替客户线下架设机房与布线"}],"a":["A","B","C"],"e":"ADP 提供智能体应用的搭建与发布、知识库与连接器的接入，以及 Workflow 与 Multi-Agent 的任务编排等能力，这些都落在平台的能力范围内。线下机房与布线属于基础设施施工，不在其中。\n【干扰项】\nD：线下架设机房与布线是物理施工，超出 ADP 的软件平台能力范围。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-005","d":2,"t":"single","q":"客户希望快速试用、按需使用、无需自己维护底层资源，最匹配 ADP 的哪种模式？","o":[{"l":"A","t":"公有云模式"},{"l":"B","t":"云部署模式"},{"l":"C","t":"纯离线模式"},{"l":"D","t":"无人值守模式"}],"a":["A"],"e":"公有云模式按需使用、开箱即用，客户无需自己维护底层资源，最适合希望快速试用、轻量起步的场景。它把资源与运维都交给平台侧，客户只需聚焦在智能体应用本身的搭建上。\n【干扰项】\nB：云部署需要客户在自有云资源上部署与管理，起步更重，不匹配「快速试用免维护」的诉求。\nC：ADP 是云端服务，需要联网运转，不存在纯离线模式这一选项，属于臆造。\nD：无人值守不是 ADP 的服务模式划分，也回应不了快速试用的诉求，属于无关概念。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-006","d":2,"t":"single","q":"某客户对数据不出自有网络有严格要求，希望把平台部署在自己的云资源上，应推荐 ADP 的哪种模式？","o":[{"l":"A","t":"公有云模式"},{"l":"B","t":"云部署模式"},{"l":"C","t":"匿名访问模式"},{"l":"D","t":"临时沙箱模式"}],"a":["B"],"e":"云部署模式支持客户在自有的腾讯云资源上自主部署与管理平台，核心数据可保留在客户指定的账户与私有网络内，正好回应「数据不出自有网络」的严格要求，是数据管控敏感客户的首选。\n【干扰项】\nA：公有云模式下资源由平台侧承载，不满足数据必须留在自有网络的硬性要求。\nC：匿名访问模式与数据主权诉求无关，也不是 ADP 提供的服务模式，属于臆造概念。\nD：临时沙箱是短期体验概念，无法满足长期部署与严格数据管控的需求。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-007","d":2,"t":"single","q":"ADP 云部署模式主要通过什么方式，支持客户在自有云资源上自主部署与管理平台？","o":[{"l":"A","t":"邮寄一台物理服务器"},{"l":"B","t":"开通一个公有云版在线账号"},{"l":"C","t":"交付软件产品许可证（License）"},{"l":"D","t":"提供一个短期体验账号"}],"a":["C"],"e":"云部署方案通过交付软件产品许可证（License），支持客户在自有的云基础设施资源上自主部署与管理 ADP 平台。许可证是这一模式的核心交付载体，客户凭许可在自有环境中长期运行平台。\n【干扰项】\nA：云部署交付的是软件许可，而不是邮寄物理服务器，硬件由客户自有云资源提供。\nB：开通公有云版在线账号对应的是另一种服务模式，走的是在线托管而非在自有资源上自主部署，二者授权方式不同，学员易混淆。\nD：短期体验账号对应的是轻量试用场景，不是云部署下客户自主部署的长期授权方式。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-008","d":2,"t":"multiple","q":"关于 ADP 云部署模式带来的价值，下列哪些说法成立？（多选）","o":[{"l":"A","t":"核心业务数据可保留在客户指定的云账户与私有网络内"},{"l":"B","t":"相比私有化版本，硬件资源投入可明显降低"},{"l":"C","t":"可复用客户已有的云上中间件资源，避免重复购买"},{"l":"D","t":"从此客户不再需要任何数据安全管理"}],"a":["A","B","C"],"e":"云部署模式让核心数据留在客户指定账户与私有网络内，硬件投入相比私有化版本明显降低，还能复用客户已有的云上中间件资源避免重复购买。数据安全管理仍需持续投入。\n【干扰项】\nD：云部署提升了数据管控力，但不等于不再需要数据安全管理，安全责任依然存在。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-009","d":2,"t":"single","q":"客户最关心「数据主权」，交付工程师应如何用 ADP 云部署模式回应？","o":[{"l":"A","t":"数据会自动同步到多个第三方平台以便备份"},{"l":"B","t":"数据必须上传到公共互联网才能使用"},{"l":"C","t":"数据主权无法通过任何部署方式保障"},{"l":"D","t":"软件运行于客户独占的云资源中，核心数据不出其指定账户与私有网络"}],"a":["D"],"e":"云部署模式下软件完全运行在客户独占的云资源中，核心业务数据不出客户指定的云账户与私有网络，这正是回应数据主权诉求的关键。交付工程师应把这一点讲透，让客户建立信任。\n【干扰项】\nA：自动同步到多个第三方平台会让数据外流，与数据主权诉求背道而驰，反而制造风险。\nB：要求数据必须上传公共互联网才能用，是对云部署模式的错误描述，违背其设计初衷。\nC：说无法保障数据主权，直接否定了云部署模式本身的核心价值，属于错误结论。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-010","d":2,"t":"single","q":"相比传统私有化交付以「周」为单位的周期，ADP 云部署方案在交付速度上的典型改善是什么？","o":[{"l":"A","t":"借助可视化部署，可将交付周期缩短到「分钟」级"},{"l":"B","t":"交付周期反而更长，通常以「季度」计"},{"l":"C","t":"完全无法预估交付时间"},{"l":"D","t":"必须依赖客户自行编写全部部署脚本"}],"a":["A"],"e":"云部署方案借助可视化的部署流程，把传统以「周」为单位的私有化交付周期缩短到「分钟」级，大幅提升业务上线速度。这是它相对传统私有化交付的一个突出优势，对客户很有吸引力。\n【干扰项】\nB：交付周期以季度计与「分钟级交付」的事实完全相反，属于对优势的错误描述。\nC：可视化部署让交付时间变得可预估可控，并非完全无法预估，说法不成立。\nD：可视化部署恰恰降低了脚本门槛，不是要求客户自行编写全部部署脚本。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-011","d":2,"t":"multiple","q":"下列哪些客户诉求更适合优先考虑 ADP 云部署模式？（多选）","o":[{"l":"A","t":"对数据、网络与运维管控有更高要求"},{"l":"B","t":"希望核心业务数据留在自有云环境"},{"l":"C","t":"需要与同环境下其他业务系统低延迟互联"},{"l":"D","t":"只想临时体验几天、用完即走"}],"a":["A","B","C"],"e":"对数据网络运维管控要求高、希望数据留在自有云环境、需要与同环境业务系统低延迟互联的客户，更适合优先考虑云部署模式。临时体验则更适合公有云。\n【干扰项】\nD：只想临时体验、用完即走的诉求更匹配公有云的轻量按需，不适合起步较重的云部署。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-012","d":2,"t":"single","q":"ADP 云部署模式提到的「资产复用」，具体指的是什么？","o":[{"l":"A","t":"复用其他客户的业务数据"},{"l":"B","t":"灵活复用客户已有的云数据库、对象存储等中间件资源"},{"l":"C","t":"复用公开互联网上的任意资源"},{"l":"D","t":"直接复用其他企业调好的智能体应用"}],"a":["B"],"e":"资产复用指云部署模式支持灵活复用客户已有的云数据库、对象存储等中间件资源，避免重复购买，从而进一步降低使用成本。复用范围限于客户自有云资源，既省钱又安全。\n【干扰项】\nA：复用其他客户的业务数据会严重违反数据隔离与安全原则，绝不成立，属于危险表述。\nC：复用公开互联网上的任意资源不是资产复用的含义，也存在明显的安全隐患。\nD：资产复用指的是复用客户自有的云中间件资源，而非直接搬用其他企业调好的应用，跨企业复用既不现实也涉及数据与权属问题。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-013","d":2,"t":"single","q":"关于 ADP 的能力边界，下列哪种表述最准确？","o":[{"l":"A","t":"ADP 能替客户完成一切软硬件采购与机房运维"},{"l":"B","t":"ADP 保证生成式输出百分之百准确无误"},{"l":"C","t":"ADP 聚焦企业级智能体的开发、编排与交付，而非包办客户所有 IT 建设"},{"l":"D","t":"ADP 可以脱离大语言模型独立产生智能"}],"a":["C"],"e":"ADP 的能力边界聚焦在企业级智能体的开发、编排与交付，它不包办客户所有的 IT 建设，也不改变生成式输出的天然不确定性。交付工程师应据此为客户设定合理预期，避免过度承诺。\n【干扰项】\nA：包办一切软硬件采购与机房运维远远超出了 ADP 作为软件平台的能力边界。\nB：生成式输出存在天然不确定性，任何平台都不能承诺百分之百准确，说法不成立。\nD：ADP 依托大语言模型运转，不能脱离底层模型独立产生智能，属于原理性错误。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-014","d":2,"t":"multiple","q":"交付工程师向客户说明 ADP 的能力边界时，下列哪些属于恰当的表达？（多选）","o":[{"l":"A","t":"ADP 提供智能体开发与编排能力，具体效果仍取决于方案设计与调优"},{"l":"B","t":"ADP 依托大语言模型，生成类输出存在天然的不确定性"},{"l":"C","t":"智能体能调用哪些外部能力，取决于接入的工具与连接器"},{"l":"D","t":"只要用了 ADP，任何需求都能零成本立刻实现"}],"a":["A","B","C"],"e":"恰当的边界表达包括：效果取决于方案设计与调优、生成类输出存在天然不确定性、智能体可调用的外部能力取决于接入的工具与连接器。这些都实事求是。\n【干扰项】\nD：宣称任何需求零成本立刻实现是过度承诺，违背能力边界的客观表达。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-015","d":2,"t":"single","q":"与直接调用大语言模型相比，用 ADP 搭建的智能体应用最本质的增益是什么？","o":[{"l":"A","t":"让模型的参数规模自动变大"},{"l":"B","t":"让模型不再需要任何提示词"},{"l":"C","t":"让模型彻底摆脱算力消耗"},{"l":"D","t":"让模型能接上工具、知识库与记忆，从「会说」走向「会做事」"}],"a":["D"],"e":"ADP 最本质的增益是让大语言模型接上工具、知识库与记忆，从只能「会说」走向能「会做事」，支撑真正的任务落地。这是智能体相对裸用模型的核心价值所在，也是交付的意义。\n【干扰项】\nA：ADP 不改变模型的参数规模，参数大小由所选用的大语言模型本身决定。\nB：智能体仍然依赖提示词来引导输出方向，并非不再需要 Prompt，说法错误。\nC：智能体运转依然要消耗算力，不可能彻底摆脱算力消耗，违背基本事实。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-016","d":2,"t":"single","q":"纯大语言模型「不会精确记住某条具体数据」，ADP 主要靠什么来弥补这一短板？","o":[{"l":"A","t":"通过知识库与连接器接入外部数据，按需检索供模型使用"},{"l":"B","t":"靠让模型死记硬背全部数据"},{"l":"C","t":"靠关闭模型的生成能力"},{"l":"D","t":"靠禁止模型访问任何外部信息"}],"a":["A"],"e":"ADP 通过知识库与连接器接入外部数据，按需把相关信息检索出来供模型使用，从而弥补大语言模型不精确记忆具体数据的短板。这正是知识库与 RAG 思路的用武之地，让回答有据可依。\n【干扰项】\nB：让模型死记硬背全部数据既不现实也不可靠，不是 ADP 采用的弥补方式。\nC：关闭生成能力等于放弃智能体的核心价值，答非所问，方向完全错误。\nD：禁止访问外部信息会让不精确记忆的短板更严重，与弥补目标背道而驰。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-017","d":2,"t":"multiple","q":"相比裸用大语言模型，ADP 在其之上补齐了哪些关键能力？（多选）","o":[{"l":"A","t":"工具调用与外部系统连接"},{"l":"B","t":"知识库支撑的检索能力"},{"l":"C","t":"多步骤任务的编排能力"},{"l":"D","t":"让模型输出永远不会出错的保证"}],"a":["A","B","C"],"e":"ADP 在裸模型之上补齐了工具调用与外部系统连接、知识库支撑的检索、多步骤任务编排等关键能力，让模型真正能做事。它并不能消除生成类输出的不确定性。\n【干扰项】\nD：让输出永不出错是无法实现的保证，生成式输出的不确定性无法被彻底消除。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-018","d":2,"t":"single","q":"下列哪个场景最适合用 ADP 搭建智能体来落地？","o":[{"l":"A","t":"仅靠模型直接计算，要求对一组数字做绝对精确、零容错的财务审计"},{"l":"B","t":"让助手接入订单系统，自动回复顾客的物流查询"},{"l":"C","t":"需要一个纯静态、无任何交互的展示页面"},{"l":"D","t":"单纯存储海量文件、不做任何智能处理"}],"a":["B"],"e":"让助手接入订单系统、自动回复物流查询，既用到模型的语言理解，又通过连接器接上真实业务系统，是 ADP 智能体的典型适用场景。它把「说」变成了「做」，直接创造业务价值。\n【干扰项】\nA：绝对精确零容错的财务审计不宜仅靠模型直接算，应交给专门工具，不适合作纯智能体落地。\nC：纯静态无交互的展示页面用不到智能体的任何能力，属于典型的场景错配。\nD：单纯存储海量文件、不做任何智能处理，与智能体要解决的问题毫不相干。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-019","d":2,"t":"single","q":"客户要求「智能体必须保证每次输出都与标准答案逐字一致、零偏差」，交付工程师恰当的处理是什么？","o":[{"l":"A","t":"直接承诺每次输出都能逐字一致"},{"l":"B","t":"隐瞒不确定性，先把单子签下来再说"},{"l":"C","t":"说明生成类输出存在天然不确定性，改用评测与约束把风险控制在可接受范围"},{"l":"D","t":"告诉客户这属于平台缺陷、完全无法解决"}],"a":["C"],"e":"生成类输出存在天然不确定性，交付工程师应据实说明，并把话题引导到用评测与约束把风险降到可接受范围，而不是承诺一个做不到的逐字一致指标。这体现了专业的预期管理能力。\n【干扰项】\nA：承诺每次逐字一致违背生成式原理，是无法兑现的过度承诺，会埋下失败隐患。\nB：隐瞒不确定性先签单，会在交付阶段引爆问题，最终损害信任与口碑。\nD：把它说成完全无法解决的平台缺陷，既不准确，也放弃了评测与约束这条可行路径。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-020","d":2,"t":"multiple","q":"下列哪些属于 ADP 智能体较为适合的落地场景？（多选）","o":[{"l":"A","t":"基于企业知识库的问答助手"},{"l":"B","t":"需要多步骤协作的内容创作助手"},{"l":"C","t":"接入业务系统、能执行操作的客服助手"},{"l":"D","t":"要求绝对精确零误差、且无任何人工复核的高危自动扣款"}],"a":["A","B","C"],"e":"基于知识库的问答助手、多步骤协作的内容创作助手、接入业务系统能执行操作的客服助手，都是 ADP 智能体的适配场景。高危且零人工复核的自动扣款风险过高，不宜。\n【干扰项】\nD：绝对精确零误差且无人工复核的高危自动扣款，风险不可控，应引入审核环节而非直接交给智能体。","s":"自编-TCFDE-2026-09"},{"id":"TF-D2-021","d":2,"t":"multiple","q":"为客户选择 ADP 的服务模式时，下列哪些因素值得纳入考量？（多选）","o":[{"l":"A","t":"客户对数据留存位置与合规的要求"},{"l":"B","t":"客户是否希望复用自有云上的中间件资源"},{"l":"C","t":"客户对交付速度与运维管控的期望"},{"l":"D","t":"客户办公室的桌椅摆放布局"}],"a":["A","B","C"],"e":"选择服务模式应考量客户对数据留存位置与合规的要求、是否希望复用自有云上中间件资源、对交付速度与运维管控的期望。这些直接决定公有云与云部署的取舍。\n【干扰项】\nD：办公室桌椅摆放布局与服务模式选型毫无关联，属于无关因素。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-001","d":3,"t":"single","q":"在 ADP 中，「角色指令」的主要作用是什么？","o":[{"l":"A","t":"记录用户与智能体的每一句对话内容"},{"l":"B","t":"决定智能体底层调用哪个大语言模型"},{"l":"C","t":"设定智能体的身份、职责与回答风格，约束其行为边界"},{"l":"D","t":"管理知识库中文档的上传与更新"}],"a":["C"],"e":"角色指令用于设定智能体的身份、职责与回答风格，把它的行为约束在预期范围内。它相当于给智能体立的「岗位说明书」，是搭建应用时最基础也最关键的配置之一，直接决定智能体面对用户时的表现。\n【干扰项】\nA：记录对话内容属于会话历史或记忆的范畴，角色指令本身不负责存储对话，二者分工不同。\nB：选择底层模型是在应用配置里单独设置的，与角色指令是两回事，写角色指令并不能切换模型。\nD：文档的上传与更新属于知识库管理，角色指令不涉及知识库内容的维护。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-002","d":3,"t":"single","q":"关于 ADP 中的「长期记忆」，下列说法最准确的是？","o":[{"l":"A","t":"让智能体一次能读入更长的文档"},{"l":"B","t":"让智能体回答得更有创意"},{"l":"C","t":"让智能体自动学习并更新自身参数"},{"l":"D","t":"让智能体在多轮甚至跨会话中记住关键信息"}],"a":["D"],"e":"长期记忆让智能体能在多轮对话甚至跨会话中记住用户称呼、偏好等关键信息，从而提供连贯、个性化的体验，弥补大语言模型本身「不记事」的短板，是打造有温度的智能体的重要能力。\n【干扰项】\nA：一次能读多长由上下文窗口决定，属于另一个概念，长期记忆解决的是跨轮次留存而非单次篇幅。\nB：回答的创意度主要受模型和随机性设置影响，长期记忆管的是「记住信息」，不负责创意。\nC：智能体运行时不会自动更新模型自身参数，长期记忆只是在应用层保存信息，不改动底层模型。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-003","d":3,"t":"single","q":"某客户希望智能体在对话中记住用户的称呼和偏好。应主要借助 ADP 的哪项能力？","o":[{"l":"A","t":"长期记忆"},{"l":"B","t":"知识库检索"},{"l":"C","t":"角色指令"},{"l":"D","t":"任务编排"}],"a":["A"],"e":"记住用户的称呼和偏好属于跨轮次、跨会话的信息留存，应借助长期记忆能力来实现，让智能体在后续对话中持续保持个性化，这正是长期记忆的典型用途。\n【干扰项】\nB：知识库检索解决的是「查专有资料」的问题，它不负责记住某个具体用户的个性化偏好。\nC：角色指令设定的是智能体统一的身份和风格，对所有用户一致，不针对单个用户记忆偏好。\nD：任务编排负责组织多个步骤的执行流程，与记住用户偏好不是一回事。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-004","d":3,"t":"single","q":"在 ADP 中，「变量」通常用于下列哪种场景？","o":[{"l":"A","t":"永久保存需要跨会话记住的用户偏好"},{"l":"B","t":"在流程中传递和复用动态信息"},{"l":"C","t":"为智能体提供可检索的专有知识"},{"l":"D","t":"约束智能体的回答风格与边界"}],"a":["B"],"e":"变量用于在智能体的流程中传递和复用动态信息，比如把用户在某一步输入的内容存下来供后续步骤使用，是搭建灵活流程的重要机制，作用范围通常在单次流程内。\n【干扰项】\nA：跨会话永久记住偏好是长期记忆的职责，变量更偏向流程内的临时传递，二者用途不同。\nC：提供可检索的专有知识是知识库的作用，变量本身不存储供检索的知识内容。\nD：约束回答风格与边界是角色指令的职责，变量不负责设定智能体的行为风格。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-005","d":3,"t":"single","q":"下列关于「应用」与「模型」关系的说法，最恰当的是？","o":[{"l":"A","t":"应用和模型是同一个东西的两种叫法"},{"l":"B","t":"模型决定界面，应用决定算法"},{"l":"C","t":"应用是承载具体智能体能力的载体，模型是其底层的语言能力来源"},{"l":"D","t":"应用必须自带一个专属模型且无法更换"}],"a":["C"],"e":"在 ADP 中，应用是承载具体智能体能力的载体，模型为其提供底层的语言理解与生成能力，二者分工不同又协同工作。搭建时通常先建应用，再为它选配合适的模型。\n【干扰项】\nA：应用和模型是不同层次的概念，一个是能力载体、一个是语言能力来源，不能等同视之。\nB：模型提供的是语言能力而非界面，应用承载的是能力组织而非底层算法，此项把两者职责说反了。\nD：应用通常可以选择并更换不同的模型，并非绑定一个无法更换的专属模型。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-006","d":3,"t":"single","q":"在 ADP 中搭建一个基础智能体应用时，下列哪一项属于通常会配置的要素？","o":[{"l":"A","t":"应用要部署到哪个地域与网络环境"},{"l":"B","t":"角色指令、可用模型、必要的变量与记忆设置"},{"l":"C","t":"数据库的索引结构与分区策略"},{"l":"D","t":"前端页面的配色与排版"}],"a":["B"],"e":"搭建一个基础智能体应用，通常需要配置角色指令来定身份职责、选择合适的模型提供语言能力、并按需设置变量与记忆，这几项共同决定了应用面对用户时的实际行为。\n【干扰项】\nA：部署到哪个地域与网络环境属于部署层面的决策，不是在应用层搭建智能体时配置的能力要素。\nC：数据库索引与分区是数据存储的技术细节，搭建智能体应用时无需在这一层操心。\nD：前端配色排版属于界面展示层，不是决定智能体能力与行为的核心配置。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-007","d":3,"t":"single","q":"角色指令写得过于笼统（如只写「你是助手」）可能带来什么问题？","o":[{"l":"A","t":"智能体会拒绝回答任何问题"},{"l":"B","t":"智能体会自动切换到更强的模型"},{"l":"C","t":"智能体会遗忘知识库里的内容"},{"l":"D","t":"智能体行为边界不清、回答容易跑偏"}],"a":["D"],"e":"角色指令过于笼统，会导致智能体的身份和职责边界不清晰，回答容易跑偏或答非所问，因此需要把角色、职责、风格、超范围时如何处理都写具体，才能让智能体表现稳定可控。\n【干扰项】\nA：笼统的角色指令通常导致回答发散，而不是让智能体拒绝回答，方向恰恰相反。\nB：角色指令写得笼统不会触发模型切换，选用哪个模型由应用配置单独决定。\nC：角色指令是否具体与知识库内容留存无关，不会导致智能体遗忘知识库。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-008","d":3,"t":"single","q":"关于「变量」和「长期记忆」的区别，下列说法最恰当的是？","o":[{"l":"A","t":"变量偏向流程内的临时传递，长期记忆偏向跨轮次或跨会话的信息留存"},{"l":"B","t":"变量能永久保存，长期记忆只在单轮有效"},{"l":"C","t":"两者都只用于设定回答风格"},{"l":"D","t":"变量负责检索知识，长期记忆负责调用工具"}],"a":["A"],"e":"变量更偏向在单次流程内临时传递和复用信息，用完即可丢弃；长期记忆更偏向跨轮次甚至跨会话的信息留存，让智能体持续记得用户。二者用途不同，常配合使用。\n【干扰项】\nB：恰好说反了：长期记忆才是用于跨会话留存的，变量更偏向流程内临时使用。\nC：设定回答风格是角色指令的职责，变量和长期记忆都不负责风格设定。\nD：检索知识靠知识库、调用工具靠工具或连接器，与变量、长期记忆不是一回事。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-009","d":3,"t":"single","q":"下列哪一项属于「角色指令」中值得明确的内容？","o":[{"l":"A","t":"应用要部署到哪个地域"},{"l":"B","t":"底层模型的训练数据规模"},{"l":"C","t":"智能体的身份定位、回答风格、职责范围与超范围处理方式"},{"l":"D","t":"知识库文档的存储格式"}],"a":["C"],"e":"角色指令中值得明确身份定位、回答风格与语气、职责范围以及超出范围时如何处理，这些内容共同让智能体的行为可预期、可控制，是写好角色指令的关键着力点。\n【干扰项】\nA：部署到哪个地域属于部署层面的决策，不在角色指令要写的内容范畴内。\nB：训练数据规模由模型本身决定，角色指令无法也无需去设定它。\nD：文档的存储格式属于知识库管理的技术细节，与角色指令要写的内容无关。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-010","d":3,"t":"single","q":"在 ADP 中，「知识库」的主要价值是什么？","o":[{"l":"A","t":"替代大语言模型本身承担语言生成"},{"l":"B","t":"为智能体提供可检索的专有知识，让回答有据可依"},{"l":"C","t":"决定智能体每轮回答的最大长度"},{"l":"D","t":"记录用户的个性化偏好"}],"a":["B"],"e":"知识库为智能体提供可检索的专有知识，让模型基于检索到的真实内容作答，从而弥补模型不掌握专有或最新信息的短板，是减少幻觉、让回答有据可依的关键能力。\n【干扰项】\nA：知识库是模型的补充而非替代，语言的理解与生成仍由大语言模型完成，二者配合工作。\nC：每轮回答的最大长度与模型和参数设置有关，知识库不负责决定回答长度。\nD：记录用户个性化偏好是长期记忆的职责，知识库存的是供检索的专有知识，不是个人偏好。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-011","d":3,"t":"single","q":"「工具」在智能体中的典型作用是？","o":[{"l":"A","t":"增加大语言模型的训练数据量"},{"l":"B","t":"提高智能体的回答速度"},{"l":"C","t":"让智能体能调用外部能力去完成模型自身做不到的事"},{"l":"D","t":"扩大智能体一次能读的篇幅"}],"a":["C"],"e":"工具让智能体能够调用外部能力，比如查实时数据、做精确计算、访问业务系统，去完成模型本身做不到的事，是智能体从「会说」走向「会做」的关键机制。\n【干扰项】\nA：训练数据量是模型训练阶段的事，运行时挂接工具并不会给模型增加训练数据。\nB：回答速度受模型和资源影响，挂接工具的目的是扩展能力而非单纯提速。\nD：一次能读多长由上下文窗口决定，属于另一个概念，不是工具的作用。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-012","d":3,"t":"single","q":"某客户希望智能体能实时查询自己的订单系统。这最需要借助 ADP 的哪项能力？","o":[{"l":"A","t":"长期记忆"},{"l":"B","t":"角色指令"},{"l":"C","t":"上下文窗口扩容"},{"l":"D","t":"连接器或工具"}],"a":["D"],"e":"实时查询外部订单系统，需要通过连接器或工具把智能体与该系统对接起来，让智能体能在对话中调用它、取回真实数据再作答，这正是连接器与工具的典型用途。\n【干扰项】\nA：长期记忆解决的是记住用户信息的问题，它不负责对接和查询外部业务系统。\nB：角色指令约束的是智能体的身份和行为，不提供访问外部系统的能力。\nC：扩大上下文窗口只是让模型一次读得更多，并不能让智能体去查询外部订单系统。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-013","d":3,"t":"single","q":"关于「知识库」与「模型自身知识」的关系，下列说法最准确的是？","o":[{"l":"A","t":"知识库提供专有、可更新的知识，弥补模型训练知识的时效与覆盖不足"},{"l":"B","t":"有了知识库就不再需要大语言模型"},{"l":"C","t":"模型自身知识永远比知识库更及时"},{"l":"D","t":"知识库只能存放图片等非文字内容"}],"a":["A"],"e":"知识库提供专有的、可随时更新的知识，弥补模型训练知识在时效性和覆盖面上的不足。模型负责组织语言、知识库负责提供事实依据，二者配合让回答既流畅又准确。\n【干扰项】\nB：知识库是模型的补充，无法取代模型的语言理解与生成能力，二者缺一不可。\nC：模型的训练知识有截止时间，未必比可随时更新的知识库更及时，此说法不成立。\nD：知识库主要存放可供检索的文字类专有资料，说它只能存图片是明显的误解。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-014","d":3,"t":"single","q":"「Skills」在 ADP 生态中通常指代什么？","o":[{"l":"A","t":"智能体的对话记录归档"},{"l":"B","t":"可复用、可组合的能力单元，供智能体按需调用"},{"l":"C","t":"大语言模型的一种别称"},{"l":"D","t":"知识库的另一种叫法"}],"a":["B"],"e":"Skills 通常指可复用、可组合的能力单元，智能体可以按需调用它们来完成特定任务，从而提升搭建效率和能力扩展性，让常用能力像积木一样被反复拼装使用。\n【干扰项】\nA：对话记录归档属于会话历史管理，与 Skills 作为可复用能力单元的含义不同。\nC：大语言模型是底层的语言能力来源，Skills 是上层可调用的能力单元，二者不是一回事。\nD：知识库是存放专有知识供检索的，Skills 是可调用的能力单元，把两者混为一谈是概念错误。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-015","d":3,"t":"single","q":"为了让智能体的回答既准确又能对接业务，下列哪一项是常被组合使用的能力做法？","o":[{"l":"A","t":"仅靠调大模型参数即可解决一切"},{"l":"B","t":"只需把所有资料塞进一个超长提示词"},{"l":"C","t":"关闭知识库让模型自由发挥"},{"l":"D","t":"知识库提供事实依据、工具或连接器对接系统、角色指令约束边界"}],"a":["D"],"e":"要让智能体的回答既准确又能对接业务，常把知识库、工具或连接器、角色指令组合使用：知识库供事实、工具连系统、角色指令定边界，三者协同才能既可靠又落地。\n【干扰项】\nA：调大参数提升的是模型通用能力，无法替代知识库供事实、工具连系统的作用。\nB：把所有资料塞进超长提示词会超出窗口且稀释注意力，不如用知识库按需检索。\nC：关闭知识库会让回答失去事实依据、更易产生幻觉，与「准确」的目标背道而驰。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-016","d":3,"t":"single","q":"当模型需要「查到真实且最新的专有信息」时，最恰当的做法是？","o":[{"l":"A","t":"让模型仅凭训练记忆直接回答"},{"l":"B","t":"调高模型的随机性让它多给几种说法"},{"l":"C","t":"接入知识库并基于检索结果作答"},{"l":"D","t":"把问题重复问很多遍取多数答案"}],"a":["C"],"e":"需要真实且最新的专有信息时，应接入知识库并让模型基于检索到的内容作答，这样回答有可追溯的来源、准确性高，是应对专有信息类需求的标准做法。\n【干扰项】\nA：仅凭训练记忆回答专有信息，容易过时或出错，正是幻觉高发的场景。\nB：调高随机性只会让说法更发散，不能凭空补上模型不掌握的专有事实。\nD：重复提问取多数并不能产生模型本就不掌握的真实信息，无法保证准确。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-017","d":3,"t":"single","q":"「连接器」的典型用途是？","o":[{"l":"A","t":"决定智能体使用的语种"},{"l":"B","t":"设定智能体的回答风格"},{"l":"C","t":"存储智能体的长期记忆"},{"l":"D","t":"把智能体与外部系统或服务对接起来"}],"a":["D"],"e":"连接器的典型用途是把智能体与外部系统或服务对接起来，使智能体能读取或写入这些系统的数据，从而把模型的语言能力延伸到真实业务动作上。\n【干扰项】\nA：使用哪种语种由模型能力和角色指令等决定，不是连接器负责的事。\nB：设定回答风格是角色指令的职责，连接器不参与风格设定。\nC：存储长期记忆是记忆能力的职责，连接器负责对接外部系统，二者用途不同。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-018","d":3,"t":"single","q":"下列哪一项属于「知识与连接」层面的能力？","o":[{"l":"A","t":"知识库、工具、连接器与 Skills"},{"l":"B","t":"计算资源规格、带宽与网络规划"},{"l":"C","t":"模型的训练与调参流程"},{"l":"D","t":"前端界面的交互设计"}],"a":["A"],"e":"知识库、工具、连接器与 Skills 都属于智能体「知识与连接」层面的能力，分别用于让智能体获取专有知识、调用外部能力、对接业务系统、复用能力单元，共同扩展智能体的本事。\n【干扰项】\nB：计算资源规格、带宽与网络规划属于底层基础设施，不在「知识与连接」这一能力层面。\nC：模型的训练与调参是模型侧的工作，不属于智能体运行时的知识与连接能力。\nD：前端交互设计属于界面展示层，与知识连接能力不是同一范畴。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-019","d":3,"t":"single","q":"在 ADP 中，「Workflow」最适合用于下列哪种场景？","o":[{"l":"A","t":"有明确步骤、可按固定流程推进的任务"},{"l":"B","t":"完全无法拆解、没有任何规律的任务"},{"l":"C","t":"一句问答就能解决的简单咨询"},{"l":"D","t":"只需检索一条知识即可回答的问题"}],"a":["A"],"e":"Workflow 适合有明确步骤、可按固定流程推进的任务，通过把步骤串起来，让智能体沿既定路径稳定地完成较复杂的多步任务，保证过程可控、结果可复现。交付时若发现任务步骤明确且会重复执行，优先考虑用它把流程固化下来。\n【干扰项】\nB：完全无法拆解、毫无规律的任务难以用固定流程表达，不适合用 Workflow。\nC：一句问答就能解决的简单咨询用不上流程编排，直接问答即可，用 Workflow 是过度设计。\nD：只需检索一条知识的问题，用知识库问答就够了，不必动用多步流程编排。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-020","d":3,"t":"single","q":"「Multi-Agent」模式的核心思想是什么？","o":[{"l":"A","t":"把同一个智能体复制成很多份并行跑"},{"l":"B","t":"让多个各有专长的智能体协作完成一个复杂任务"},{"l":"C","t":"让一个智能体反复自问自答"},{"l":"D","t":"把多个知识库合并成一个"}],"a":["B"],"e":"Multi-Agent 的核心思想是让多个各有专长的智能体分工协作，比如一个负责检索、一个负责分析、一个负责撰写，共同完成单个智能体难以独立胜任的复杂任务。\n【干扰项】\nA：复制同一个智能体只是数量增加，各份能力相同，并非「各有专长的协作」，不是该模式的核心。\nC：一个智能体反复自问自答仍是单体行为，缺少多角色分工，不能体现多智能体协作。\nD：合并知识库是知识管理操作，与让多个智能体协作完成任务是完全不同的概念。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-021","d":3,"t":"single","q":"某任务需要「先检索资料、再分析、最后写成报告」三个清晰步骤。最适合的编排方式是？","o":[{"l":"A","t":"单轮问答"},{"l":"B","t":"仅调用一次知识库"},{"l":"C","t":"Workflow"},{"l":"D","t":"随机选择一个动作"}],"a":["C"],"e":"这个任务有「检索资料、分析、写成报告」三个清晰且有先后的步骤，最适合用 Workflow 把它们串成固定流程，稳定地按步骤推进，保证每一步都不遗漏。把多步任务用流程固化后，后续换人维护或复用也更省心。\n【干扰项】\nA：单轮问答难以稳定完成需要多步先后衔接的复杂任务，容易丢步骤。\nB：仅调用一次知识库只完成了检索这一步，无法覆盖分析和写作的后续步骤。\nD：随机选择动作无法保证按检索、分析、写作的正确顺序推进，结果不可控。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-022","d":3,"t":"single","q":"下列关于 Claw 模式的理解，最恰当的是？","o":[{"l":"A","t":"它是一种数据库索引技术"},{"l":"B","t":"它是大语言模型的一个版本号"},{"l":"C","t":"它是知识库的存储格式"},{"l":"D","t":"它是 ADP 提供的一种应用构建模式，适合更灵活自主的任务处理"}],"a":["D"],"e":"Claw 是 ADP 提供的一种应用构建模式，适合较为灵活、自主的任务处理场景，是搭建智能体时可选的模式之一，供交付工程师根据任务特征来选用。选型时可把它与标准问答、单工作流、多智能体等模式放在一起，按任务特征权衡。\n【干扰项】\nA：数据库索引技术属于数据存储层面的概念，与 Claw 作为应用构建模式无关。\nB：Claw 是构建模式而非模型版本号，把它当成模型版本是概念混淆。\nC：知识库的存储格式是数据管理细节，与 Claw 这种应用构建模式不是一回事。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-023","d":3,"t":"multiple","q":"下列哪些是 ADP 中用于「任务编排」的能力或模式？","o":[{"l":"A","t":"Workflow"},{"l":"B","t":"Multi-Agent"},{"l":"C","t":"Claw"},{"l":"D","t":"知识库检索"}],"a":["A","B","C"],"e":"Workflow、Multi-Agent、Claw 都是 ADP 中用于任务编排与应用构建的能力或模式，分别适合不同复杂度和自主度的场景。它们决定的是任务「怎么组织、怎么推进」，是编排层面的核心能力。\n【干扰项】\nD：知识库检索解决的是「从哪查资料」的问题，属于知识与连接层面，不是组织任务流程的编排能力，容易与编排混为一谈。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-024","d":3,"t":"single","q":"当单个智能体难以独立胜任一个既要检索、又要计算、还要多轮决策的复杂任务时，较合适的思路是？","o":[{"l":"A","t":"考虑用 Multi-Agent 让多个专长智能体协作"},{"l":"B","t":"把任务硬塞给单个智能体反复重试"},{"l":"C","t":"关闭工具只靠模型自身能力硬扛"},{"l":"D","t":"把复杂任务简单删减到只剩一步"}],"a":["A"],"e":"当任务复杂到单个智能体难以独立胜任时，可考虑用 Multi-Agent 让多个各有专长的智能体分工协作，比如检索、计算、决策各由擅长的角色承担，共同把复杂任务拆开完成，这比让一个智能体硬扛更稳更可控。\n【干扰项】\nB：硬塞给单个智能体反复重试，并没有解决能力不匹配的根本问题，只会让失败重复发生。\nC：关闭工具会让智能体失去查数、算数等外部能力，面对复杂任务反而更吃力，方向相反。\nD：把任务删减到只剩一步等于回避了真实需求，交付的成果无法满足客户，属于因噎废食。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-025","d":3,"t":"single","q":"关于 Workflow 与 Multi-Agent 的选择，下列说法最恰当的是？","o":[{"l":"A","t":"两者可以随意混用，没有任何选择依据"},{"l":"B","t":"流程明确用 Workflow，需要多角色协作用 Multi-Agent"},{"l":"C","t":"任何任务都必须同时使用两者"},{"l":"D","t":"两者都不能用于复杂任务"}],"a":["B"],"e":"选择的基本依据是任务特征：流程明确、按固定步骤推进的任务用 Workflow；需要多个角色分工协作的任务用 Multi-Agent。抓住「流程固定」还是「多角色协作」这个分界，就能快速判断该用哪种编排方式。\n【干扰项】\nA：选型是有明确依据的，随意混用会让方案失去针对性，增加维护成本。\nC：并非所有任务都要同时用两者，简单任务用其一甚至都不用编排，同时上是过度设计。\nD：两者恰恰都是为复杂任务设计的编排能力，说都不能用于复杂任务与事实相反。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-026","d":3,"t":"multiple","q":"下列关于任务编排模式选择的说法，哪些正确？","o":[{"l":"A","t":"简单问答未必需要复杂编排"},{"l":"B","t":"步骤固定的任务适合 Workflow"},{"l":"C","t":"多角色协作的任务适合 Multi-Agent"},{"l":"D","t":"越复杂的编排永远越好，应无脑选最复杂的"}],"a":["A","B","C"],"e":"简单问答未必需要复杂编排、步骤固定用 Workflow、多角色协作用 Multi-Agent，这些都是合理的选型原则，核心是按任务特征匹配合适的模式，做到既不欠配也不过度设计。\n【干扰项】\nD：编排并非越复杂越好，过度设计会增加搭建和维护成本、拉长交付周期，却未必带来相应价值，因此应按需选择而非无脑求复杂。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-027","d":3,"t":"single","q":"「多渠道交付」指的是什么？","o":[{"l":"A","t":"把一个应用拆成多个独立的智能体"},{"l":"B","t":"为应用准备多套不同的角色指令"},{"l":"C","t":"把智能体应用发布到多个不同的使用入口或平台"},{"l":"D","t":"把知识库复制到多个副本"}],"a":["C"],"e":"多渠道交付指把搭建好的智能体应用发布到多个不同的使用入口或平台，让用户可以从各自习惯的渠道访问同一个智能体，核心是「一个应用、多处可用」，扩大触达而非重复建设。\n【干扰项】\nA：把应用拆成多个独立智能体是任务拆分的思路，与「同一应用多入口发布」不是一回事。\nB：为应用准备多套角色指令改变的是行为设定，不等于把应用交付到多个使用渠道。\nD：复制知识库副本属于数据层面的操作，和把应用发布到多个入口的交付概念无关。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-028","d":3,"t":"single","q":"应用发布前，下列哪项工作通常是必要的？","o":[{"l":"A","t":"不做测试直接发布，出问题上线后再改"},{"l":"B","t":"发布前删除角色指令以提升灵活性"},{"l":"C","t":"发布前关闭知识库以加快速度"},{"l":"D","t":"对应用的回答质量与边界进行测试验证"}],"a":["D"],"e":"应用发布前通常需要对回答质量、行为边界进行测试验证，确保上线后表现符合预期，减少上线后的问题和返工。测试验证是从搭建走向正式交付之间必不可少的一道关口。\n【干扰项】\nA：不测试直接发布会把风险直接暴露给真实用户，出问题后的修复成本远高于事前测试。\nB：删除角色指令会让智能体失去身份和边界约束，行为变得不可控，是错误做法。\nC：关闭知识库会让回答失去事实依据、更易产生幻觉，为了速度牺牲准确性得不偿失。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-029","d":3,"t":"single","q":"某客户希望同一个智能体既能在网页端用、又能在办公工具里用。这体现了哪种能力需求？","o":[{"l":"A","t":"多渠道交付"},{"l":"B","t":"模型重新训练"},{"l":"C","t":"长期记忆"},{"l":"D","t":"知识库扩容"}],"a":["A"],"e":"同一智能体在网页端和办公工具等多个入口都能用，正是多渠道交付能力的体现，通过把同一个应用发布到不同渠道，满足用户在不同场景下的访问需求，而无需为每个入口重建智能体。\n【干扰项】\nB：模型重新训练是模型侧的工作，与把同一应用发布到多个使用入口没有关系。\nC：长期记忆解决的是记住用户信息的问题，不负责把应用铺到多个渠道。\nD：知识库扩容是扩充可检索知识，和多入口交付是两个不同维度的需求。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-030","d":3,"t":"multiple","q":"关于应用发布与多渠道交付，下列说法正确的有哪些？","o":[{"l":"A","t":"发布前应做必要的测试验证"},{"l":"B","t":"可以把应用交付到多个使用入口"},{"l":"C","t":"上线后仍需关注运营与迭代"},{"l":"D","t":"发布后就无需再关心应用表现"}],"a":["A","B","C"],"e":"发布前做测试验证、支持把应用交付到多个使用入口、上线后持续关注运营与迭代，都是应用发布与多渠道交付中的正确做法，体现了从搭建到运营的完整交付意识。\n【干扰项】\nD：发布后仍需持续关注应用表现并按反馈迭代，认为「不再关心」会让应用逐渐失管、效果退化，是错误态度。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-031","d":3,"t":"single","q":"智能体应用上线后，下列哪项做法最恰当？","o":[{"l":"A","t":"上线即完工，从此不再维护"},{"l":"B","t":"持续关注运行表现并按需迭代优化"},{"l":"C","t":"把线上应用长期放着不看反馈"},{"l":"D","t":"一遇到问题就推倒重建整个应用"}],"a":["B"],"e":"应用上线不是终点，而是运营的起点，应持续关注运行表现、收集用户反馈并按需迭代优化，让智能体的效果随真实使用不断改善，这是负责任的交付态度。\n【干扰项】\nA：上线即完工忽视了运营维护的必要性，线上问题得不到跟进，效果会逐渐下滑。\nC：长期不看反馈等于放弃了改进的依据，应用的小问题会累积成大问题。\nD：一遇问题就推倒重建成本极高，多数情况通过迭代优化即可解决，无需整体重来。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-032","d":3,"t":"single","q":"下列哪一项最能体现「从开发到上线」的完整链路意识？","o":[{"l":"A","t":"只搭建不测试就直接上线使用"},{"l":"B","t":"只管发布，上线后不关心效果"},{"l":"C","t":"搭建、测试、发布、运营迭代形成闭环"},{"l":"D","t":"反复搭建打磨却迟迟不发布交付"}],"a":["C"],"e":"完整链路意识体现在把搭建、测试、发布、运营迭代形成闭环，让智能体应用能稳定上线并在使用中持续改进，任何一个环节缺失都会让交付质量或价值打折扣。\n【干扰项】\nA：只搭建不测试直接上线，会把未经验证的风险带到真实用户面前。\nB：只发布不管效果，无法保证应用真正解决问题，也失去了迭代改进的机会。\nD：反复打磨却不发布，价值始终停留在内部，客户拿不到成果，交付等于没完成。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-033","d":3,"t":"multiple","q":"下列哪些属于交付工程师在「应用发布」阶段应关注的事项？","o":[{"l":"A","t":"回答质量是否达标"},{"l":"B","t":"行为边界是否可控"},{"l":"C","t":"上线后如何运营与迭代"},{"l":"D","t":"应用界面用什么主题皮肤"}],"a":["A","B","C"],"e":"发布阶段应关注回答质量是否达标、行为边界是否可控、以及上线后的运营与迭代计划，这三项直接关系交付效果和后续可持续性，是交付工程师在发布环节的核心着力点。\n【干扰项】\nD：界面主题皮肤属于表层的展示美化，虽可锦上添花，但不是发布阶段决定交付成败的核心事项，把它当重点会本末倒置。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-034","d":3,"t":"single","q":"「需求翻译」在智能体交付中的核心含义是？","o":[{"l":"A","t":"把需求文档从一种格式转成另一种格式"},{"l":"B","t":"把客户的口头需求原样记录下来不做加工"},{"l":"C","t":"把复杂需求直接砍成最简单的一句话"},{"l":"D","t":"把客户模糊的业务诉求转化为可落地的智能体方案要素"}],"a":["D"],"e":"需求翻译指把客户模糊、口语化的业务诉求，转化为可落地的智能体方案要素，比如明确使用者、场景、输入输出和验收标准，是交付工程师从需求走向方案的关键一步，考验的是理解和拆解能力。\n【干扰项】\nA：把文档换格式只是形式转换，没有触及「把诉求变成方案要素」的实质，属于望文生义。\nB：原样记录不做加工只完成了收集，没有把模糊诉求拆解成可执行要素，需求翻译还没做。\nC：把需求砍成一句话是简单化处理，可能丢掉关键诉求，与系统拆解的翻译本意背道而驰。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-035","d":3,"t":"single","q":"客户说「我要一个很智能的助手」。作为交付工程师，第一步最应该做的是？","o":[{"l":"A","t":"追问具体场景、使用者和期望效果，把模糊需求问清楚"},{"l":"B","t":"立刻承诺把客户想到的功能全部实现"},{"l":"C","t":"直接套用上一个客户的现成方案"},{"l":"D","t":"以需求太笼统为由拒绝该需求"}],"a":["A"],"e":"面对「很智能的助手」这类笼统需求，第一步应追问具体场景、使用者、期望效果，把模糊需求拆解清楚，才能设计出贴合的方案。先问清再动手，是需求分析阶段最该养成的习惯。\n【干扰项】\nB：未问清就承诺全部实现，容易把做不到的事揽下来，后期交付会陷入被动。\nC：直接套用他人方案忽视了不同客户的场景差异，很可能答非所问、水土不服。\nD：需求笼统正需要澄清而非拒绝，贸然拒绝会失去交付机会，也显得不专业。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-036","d":3,"t":"single","q":"下列哪一项最能体现「把模糊需求翻译成可落地要素」？","o":[{"l":"A","t":"只记录客户说了一句想要 AI"},{"l":"B","t":"明确使用者、场景、输入输出、依赖数据与验收标准"},{"l":"C","t":"不问需求先挑一个最贵的方案报价"},{"l":"D","t":"跳过需求分析直接开始搭建"}],"a":["B"],"e":"把模糊需求翻译成可落地要素，意味着明确使用者是谁、在什么场景用、期望的输入输出、依赖哪些数据以及如何验收，这些要素凑齐了，方案才有据可依、搭建才不会跑偏。\n【干扰项】\nA：仅记录一句「想要 AI」远未完成翻译，关键要素一个都没澄清，无法指导后续搭建。\nC：不问需求先按价格报方案，等于把成本放在需求前面，做出的东西很可能不对路。\nD：跳过需求分析直接搭建，会让方案失去针对性，返工风险极高。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-037","d":3,"t":"single","q":"需求分析阶段，明确「使用者是谁」的意义在于？","o":[{"l":"A","t":"使用者的多少决定要买几台服务器"},{"l":"B","t":"使用者是谁只影响界面好不好看"},{"l":"C","t":"不同使用者对回答风格、权限和内容深度的要求不同"},{"l":"D","t":"使用者信息对方案设计没有影响"}],"a":["C"],"e":"明确使用者是谁很重要，因为不同使用者对回答风格、可访问权限、内容深度的要求各不相同，比如面向专家和面向新手的智能体在措辞和深度上就该不一样，这直接影响方案设计。\n【干扰项】\nA：使用者多少更多影响并发和资源规划，把它简单等同于「买几台服务器」是粗浅误解。\nB：使用者是谁影响的是回答的风格、权限和深度等实质内容，远不止界面美观这一层。\nD：使用者信息是方案设计的重要输入，说它没有影响，等于忽视了需求分析的核心。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-038","d":3,"t":"multiple","q":"在需求分析中，下列哪些维度值得向客户问清楚？","o":[{"l":"A","t":"使用者是谁、在什么场景用"},{"l":"B","t":"期望的输入与输出是什么"},{"l":"C","t":"依赖哪些数据、如何验收"},{"l":"D","t":"客户公司名气大不大"}],"a":["A","B","C"],"e":"使用者与场景、期望的输入输出、依赖数据与验收方式，都是需求分析中值得向客户问清楚的维度，把这些问透，才能把模糊诉求翻译成可落地的方案要素。\n【干扰项】\nD：客户公司名气大不大与如何设计智能体方案没有实质关系，属于无助于需求澄清的干扰信息。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-039","d":3,"t":"single","q":"客户的需求「希望能自动处理客户咨询」比较笼统。下列哪种追问最有价值？","o":[{"l":"A","t":"客户更喜欢什么颜色的界面"},{"l":"B","t":"客户希望项目挂谁的名字"},{"l":"C","t":"客户办公室在第几层"},{"l":"D","t":"咨询主要涉及哪些问题、量有多大、希望自动到什么程度"}],"a":["D"],"e":"最有价值的追问是围绕咨询的具体内容、体量和期望的自动化程度，这些直接决定方案的范围、复杂度和可行性，帮助把「自动处理咨询」这个笼统目标落到可设计的细节上。\n【干扰项】\nA：界面颜色是后期的表层美化，对判断方案范围和复杂度几乎没有帮助。\nB：项目挂谁的名字属于内部事务，与如何设计智能体方案没有关系。\nC：办公室在第几层属于无关的物理位置信息，既不影响方案范围也不影响技术选型，对澄清「自动处理咨询」这一需求毫无帮助。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-040","d":3,"t":"single","q":"需求分析没做扎实就直接搭建，最可能导致什么后果？","o":[{"l":"A","t":"做出的智能体与客户真实需求错位、返工成本高"},{"l":"B","t":"智能体会自动变得更聪明"},{"l":"C","t":"客户会主动降低验收标准"},{"l":"D","t":"搭建过程会自动跳过测试环节"}],"a":["A"],"e":"需求分析不扎实就动手，容易导致做出来的智能体与客户真实需求错位，等发现方向不对时往往已投入大量工作，返工成本很高，因此需求翻译是不可省略的前置步骤。\n【干扰项】\nB：需求分析是否扎实与模型聪明程度无关，不会因为省了分析而让智能体自动变强。\nC：客户不会因为你没做好分析就降低验收标准，反而更可能因不满意而提高要求。\nD：测试是必要环节，不会因为需求分析潦草就自动跳过，这种因果关系并不存在。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-041","d":3,"t":"single","q":"下列关于「需求翻译法」的说法，最恰当的是？","o":[{"l":"A","t":"它是一种自动生成代码的工具"},{"l":"B","t":"它是一套把业务诉求系统拆解为方案要素的方法"},{"l":"C","t":"它是一份固定不变的需求模板"},{"l":"D","t":"它是客户签字确认的验收单"}],"a":["B"],"e":"需求翻译法是一套把客户业务诉求系统性拆解为方案要素的方法，帮助交付工程师从模糊到清晰、从需求到方案。它是一种思考和提问的框架，而非某个具体工具或表单。\n【干扰项】\nA：它是拆解需求的思路方法，不是自动生成代码的工具，二者层面完全不同。\nC：它强调按每个需求灵活提问拆解，而不是套用一份一成不变的固定模板。\nD：验收单是项目后期确认成果的文件，与前期拆解需求的翻译法不是一回事。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-042","d":3,"t":"multiple","q":"把客户口语化需求翻译成方案时，下列哪些做法是恰当的？","o":[{"l":"A","t":"逐项澄清关键维度而非想当然"},{"l":"B","t":"用客户能懂的话复述确认理解一致"},{"l":"C","t":"识别需求中模型擅长与不擅长的部分"},{"l":"D","t":"忽略客户的真实场景直接套模板"}],"a":["A","B","C"],"e":"逐项澄清关键维度、用客户能懂的话复述确认、识别需求中模型的强项与短板，都是把口语化需求翻译成方案的恰当做法，核心是既问得清、又对得准、还能预判技术边界。\n【干扰项】\nD：忽略真实场景直接套模板，会让方案脱离客户的实际情况，是需求翻译中最容易踩的坑，属于反例。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-043","d":3,"t":"single","q":"面对一个「只需根据知识库回答常见问题」的简单需求，较合适的构建模式通常是？","o":[{"l":"A","t":"一上来就用多角色协作的复杂模式"},{"l":"B","t":"把所有高级编排能力都堆上去"},{"l":"C","t":"相对简单的标准问答类模式"},{"l":"D","t":"因为需求简单就干脆不做"}],"a":["C"],"e":"只需根据知识库回答常见问题的简单需求，通常用相对简单的标准问答类模式即可满足，配上知识库检索就能跑起来，不必上复杂编排，按需匹配才经济高效、好维护。\n【干扰项】\nA：简单需求硬用多角色协作是典型的过度设计，徒增搭建和维护成本。\nB：把高级编排能力全堆上去，不仅浪费资源，还会让本可简单的方案变得难以维护。\nD：需求简单且合理时应当高效满足，因为简单就放弃是消极对待，会白白流失价值。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-044","d":3,"t":"single","q":"构建模式选型的基本原则是什么？","o":[{"l":"A","t":"无论什么任务都固定选最复杂的模式"},{"l":"B","t":"只看价格，永远选最便宜的模式"},{"l":"C","t":"不做判断，随机挑一个模式"},{"l":"D","t":"根据任务复杂度与自主度选择匹配的模式，避免过度设计"}],"a":["D"],"e":"构建模式选型应根据任务的复杂度与所需自主度，选择匹配的模式，既不欠配也不过度设计，做到恰到好处。这需要交付工程师先把任务看清，再对号入座地选模式。\n【干扰项】\nA：固定选最复杂模式会造成资源浪费和维护负担，简单任务用重模式是过度设计。\nB：只看价格可能选到满足不了需求的模式，省了成本却做不成事，得不偿失。\nC：随机挑选缺乏依据，选中不合适模式的概率很高，是不负责任的做法。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-045","d":3,"t":"single","q":"某任务需要按固定步骤稳定执行，且步骤之间有明确先后。较合适的构建模式是？","o":[{"l":"A","t":"单工作流类模式"},{"l":"B","t":"把多个步骤揉进一句话让模型自由发挥"},{"l":"C","t":"让智能体每步随机决定下一步"},{"l":"D","t":"不做编排靠人工逐步手动触发"}],"a":["A"],"e":"步骤固定、有明确先后的任务，适合用单工作流类模式把步骤串成固定流程稳定执行，保证每一步都按既定顺序推进，结果可复现，这是流程化任务的标准选型。\n【干扰项】\nB：揉进一句话让模型自由发挥，无法保证多步骤的先后顺序，复杂流程容易乱套。\nC：每步随机决定下一步会让执行路径不可控，与「固定步骤稳定执行」的要求相反。\nD：靠人工逐步手动触发失去了自动化价值，步骤一多就低效且易出错。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-046","d":3,"t":"single","q":"当任务需要多个角色分工、且各角色有不同专长时，较合适的构建模式是？","o":[{"l":"A","t":"用一个智能体串行硬跑所有角色的活"},{"l":"B","t":"Multi-Agent 类模式"},{"l":"C","t":"把多角色需求砍成单一角色"},{"l":"D","t":"不分角色让模型笼统处理"}],"a":["B"],"e":"需要多角色分工协作、各有专长的复杂任务，适合用 Multi-Agent 类模式，让不同智能体各司其职再协同产出，比如一个检索、一个分析、一个撰写，分工清晰、协作高效。\n【干扰项】\nA：用一个智能体硬跑所有角色的活，角色边界模糊，难以发挥各自专长，效果打折。\nC：把多角色需求砍成单一角色是回避问题，牺牲了任务本应有的分工深度。\nD：不分角色笼统处理，等于放弃了多角色协作的优势，复杂任务容易顾此失彼。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-047","d":3,"t":"multiple","q":"构建模式选型时，下列哪些是应考虑的因素？","o":[{"l":"A","t":"任务的复杂度"},{"l":"B","t":"所需的自主与灵活程度"},{"l":"C","t":"是否需要多角色协作"},{"l":"D","t":"客户预算能不能再压一压"}],"a":["A","B","C"],"e":"任务复杂度、所需自主灵活度、是否需要多角色协作，都是构建模式选型时应重点考量的因素，围绕它们才能把模式匹配得恰到好处，既满足需求又不过度设计。\n【干扰项】\nD：压预算是商务谈判层面的事，选型应先看任务本身的技术特征，把砍价当选型依据会导致方案与需求脱节。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-048","d":3,"t":"single","q":"「智能工作台」类模式较适合下列哪种定位？","o":[{"l":"A","t":"只能处理单一固定问题的问答窗口"},{"l":"B","t":"仅用于展示数据不做任何交互"},{"l":"C","t":"为使用者提供一个可综合调用多种能力的工作入口"},{"l":"D","t":"仅用于更换界面皮肤"}],"a":["C"],"e":"智能工作台类模式适合为使用者提供一个综合入口，在其中调用多种能力协同工作，适合任务较综合、需要多种能力搭配使用的场景，让使用者在一个地方把事办完。\n【干扰项】\nA：只处理单一固定问题是标准问答类的定位，工作台强调的恰恰是综合调用多种能力。\nB：仅展示数据不交互无法体现工作台「综合调用能力」的核心价值，定位偏窄。\nD：更换界面皮肤是表层美化，与工作台作为综合能力入口的定位完全不搭边。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-049","d":3,"t":"single","q":"过度设计（简单需求硬上复杂模式）最可能带来什么问题？","o":[{"l":"A","t":"让底层模型的能力自动提升"},{"l":"B","t":"把项目风险彻底降到零"},{"l":"C","t":"对交付没有任何负面影响"},{"l":"D","t":"增加搭建与维护成本、拉长交付周期"}],"a":["D"],"e":"过度设计会增加搭建和维护成本、拉长交付周期，却未必带来相应价值，还会让方案变得臃肿难维护，因此选型要按需匹配、避免为了复杂而复杂。交付工程师应把「够用且好维护」作为选型的落脚点。\n【干扰项】\nA：模式复杂与否不改变底层模型能力，过度设计不会让模型自动变强。\nB：没有任何设计能把风险降到绝对为零，过度设计反而因复杂度上升引入新风险。\nC：过度设计有明确的成本和周期代价，说它没有负面影响与事实不符。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-050","d":3,"t":"multiple","q":"下列关于构建模式选型的说法，哪些正确？","o":[{"l":"A","t":"简单需求可用简单模式"},{"l":"B","t":"流程固定可用工作流类模式"},{"l":"C","t":"多角色协作可用 Multi-Agent 类模式"},{"l":"D","t":"任何需求都应无脑选最复杂模式"}],"a":["A","B","C"],"e":"简单需求用简单模式、流程固定用工作流、多角色协作用 Multi-Agent，都是正确的选型原则，核心是按任务特征匹配合适的模式，让方案既够用又不臃肿。实践中先判断任务特征，再对号入座选模式即可。\n【干扰项】\nD：无脑选最复杂模式属于过度设计，会白白增加成本和维护难度，是选型中的典型错误原则。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-051","d":3,"t":"single","q":"「方案画布」的主要作用是？","o":[{"l":"A","t":"把需求要素结构化地组织成一份可指导搭建的方案蓝图"},{"l":"B","t":"把客户需求原封不动复制一遍"},{"l":"C","t":"只写一句话概括要做个智能体"},{"l":"D","t":"罗列一堆技术名词但不落到需求"}],"a":["A"],"e":"方案画布用于把需求要素结构化地组织起来，形成一份可指导实际搭建的方案蓝图，让从需求到落地有清晰依据，回答「用什么能力、怎么编排、依赖什么数据、如何验收」这些关键问题。\n【干扰项】\nB：原封不动复制需求没有做结构化加工，无法起到指导搭建的蓝图作用。\nC：一句话概括太笼统，缺少能力、编排、数据、验收等要素，指导不了实际搭建。\nD：堆砌技术名词却不对应具体需求，是空架子，方案画布要的是贴合需求的结构化蓝图。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-052","d":3,"t":"single","q":"从模糊需求走向可搭建方案，方案画布通常需要明确下列哪类内容？","o":[{"l":"A","t":"客户公司的历史沿革介绍"},{"l":"B","t":"要用哪些能力、如何编排、依赖什么数据、如何验收"},{"l":"C","t":"与需求无关的技术趋势综述"},{"l":"D","t":"一份笼统的美好愿景描述"}],"a":["B"],"e":"从模糊需求走向可搭建方案，方案画布通常需要明确要调用哪些能力、如何编排流程、依赖哪些数据、以及如何验收，这些要素凑齐了才能真正指导后续搭建，缺一项都可能卡壳。\n【干扰项】\nA：公司历史沿革属于背景介绍，对指导智能体怎么搭建没有实质帮助。\nC：与需求无关的技术趋势综述偏离了具体方案，无法落到本项目的搭建上。\nD：笼统的愿景描述缺少可执行要素，听着好听却指导不了动手，等于没画到位。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-053","d":3,"t":"single","q":"方案画布做扎实，对后续搭建的最大帮助是？","o":[{"l":"A","t":"让搭建过程可以跳过测试环节"},{"l":"B","t":"让项目不需要再做验收"},{"l":"C","t":"让搭建有清晰蓝图、减少反复试错"},{"l":"D","t":"让数据依赖可以完全忽略"}],"a":["C"],"e":"方案画布做扎实能为后续搭建提供清晰蓝图，减少边搭边改的反复试错和返工，让交付更有条理、更可控，团队协作时也能对着同一张蓝图推进，减少理解偏差。\n【干扰项】\nA：方案画布把要素想清楚，但测试仍是必要环节，不会因为画布扎实就可省略测试。\nB：画布不替代验收，验收标准本身就是画布应包含的要素之一，不能因此免掉验收。\nD：画布恰恰要把数据依赖明确写清，说它让数据依赖可忽略与画布用途相反。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-054","d":3,"t":"multiple","q":"一份可指导搭建的方案画布，通常应包含哪些要素？","o":[{"l":"A","t":"目标与使用场景"},{"l":"B","t":"所需能力与编排方式"},{"l":"C","t":"依赖数据与验收标准"},{"l":"D","t":"客户前台的接待话术"}],"a":["A","B","C"],"e":"目标与场景、所需能力与编排方式、依赖数据与验收标准，都是方案画布应包含的要素，它们共同构成一份可落地的蓝图，指导交付工程师把智能体稳稳搭出来。\n【干扰项】\nD：前台接待话术属于客户内部的行政事务，与智能体方案设计的要素毫无关系，属于无关干扰。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-055","d":3,"t":"single","q":"客户需求较复杂时，先画方案画布再动手搭建的好处是？","o":[{"l":"A","t":"可以省掉后续的测试环节"},{"l":"B","t":"可以不与客户确认验收标准"},{"l":"C","t":"可以不管方案依赖哪些数据"},{"l":"D","t":"先想清楚整体结构，避免边搭边改造成的浪费"}],"a":["D"],"e":"复杂需求先画方案画布，能先把整体结构想清楚，避免边搭边改带来的浪费和返工，尤其在多人协作或需求交错时，先有蓝图能让大家步调一致、少走弯路。\n【干扰项】\nA：画布做在前面不等于可以省掉测试，测试仍是保证质量的必要环节。\nB：验收标准恰恰应在画布阶段就与客户确认清楚，跳过确认会埋下交付争议。\nC：方案依赖的数据是画布的重要一环，忽略数据依赖会让方案落地时卡壳。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-056","d":3,"t":"single","q":"下列哪种做法最符合「从模糊到清晰」的方案设计思路？","o":[{"l":"A","t":"先澄清需求、再结构化成画布、最后据此搭建"},{"l":"B","t":"不澄清需求直接上手搭建"},{"l":"C","t":"凭感觉边搭边想边改"},{"l":"D","t":"照抄一个不相关项目的方案"}],"a":["A"],"e":"从模糊到清晰的正确思路是先澄清需求、再把要素结构化成方案画布、最后据此搭建，一步步把不确定收敛为可执行，每一步都为下一步打好基础，交付才稳。\n【干扰项】\nB：不澄清需求直接搭，方向没定就动手，很容易做偏、返工。\nC：凭感觉边搭边想缺乏章法，思路反复，效率低且结果不可控。\nD：照抄不相关项目忽视了本项目的需求差异，很可能水土不服、答非所问。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-057","d":3,"t":"multiple","q":"方案画布阶段，交付工程师识别「模型强项与短板」的意义在于？","o":[{"l":"A","t":"强项部分可直接交给模型"},{"l":"B","t":"短板部分要用工具或知识库补齐"},{"l":"C","t":"据此决定编排与能力组合"},{"l":"D","t":"据此决定用哪家的服务器品牌"}],"a":["A","B","C"],"e":"识别模型强项与短板，能帮助决定哪些直接交给模型、哪些用工具或知识库补齐、以及如何组合能力与编排，是方案画布阶段承上启下的关键判断，直接影响方案是否靠谱。\n【干扰项】\nD：选服务器品牌属于底层基础设施采购，与「识别模型强项短板来设计能力组合」这一方案设计动作没有关系。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-058","d":3,"t":"single","q":"方案画布与需求分析的关系，下列说法最恰当的是？","o":[{"l":"A","t":"两者是毫无关联的独立环节"},{"l":"B","t":"需求分析是输入，方案画布是把输入结构化为可搭建蓝图的产物"},{"l":"C","t":"方案画布应当先于需求分析进行"},{"l":"D","t":"有了方案画布就不再需要需求分析"}],"a":["B"],"e":"需求分析是方案画布的输入，方案画布把分析得到的需求要素结构化为可搭建的蓝图，二者前后衔接、缺一不可，先分析清楚、再结构化成图，方案才有根有据。\n【干扰项】\nA：两者紧密衔接，前者是输入后者是产物，说毫无关联不成立。\nC：顺序应是需求分析在前、方案画布在后，把画布放到分析之前是本末倒置。\nD：方案画布依赖需求分析的结果作为输入，不能替代分析本身，二者不是替代关系。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-059","d":3,"t":"single","q":"「验收指标」在智能体交付中的作用是？","o":[{"l":"A","t":"为智能体挑选回答的语气风格"},{"l":"B","t":"决定项目由团队里的谁来负责"},{"l":"C","t":"为项目成效提供可衡量、可判断的标准"},{"l":"D","t":"决定应用界面的视觉风格"}],"a":["C"],"e":"验收指标为项目成效提供可衡量、可判断的标准，让交付成果好不好有据可依，是方案设计中必不可少的一环，也是交付结束时双方对齐预期、避免争议的依据。\n【干扰项】\nA：挑选回答语气风格是角色指令的职责，与「衡量项目成效」的验收指标不是一回事。\nB：谁来负责项目属于团队分工，与设定衡量成效的标准没有关系。\nD：界面视觉风格是表层展示，验收指标关注的是成效是否达标，二者层面不同。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-060","d":3,"t":"single","q":"「第一期切口」的核心思想是什么？","o":[{"l":"A","t":"一次性把所有需求全部做完再上线"},{"l":"B","t":"先做出来但永远不正式上线"},{"l":"C","t":"专挑最难啃的部分先做"},{"l":"D","t":"从一个范围可控、见效快的小切口先落地，再逐步扩展"}],"a":["D"],"e":"第一期切口强调从一个范围可控、能较快见效的小切口先落地，验证价值后再逐步扩展，这样能降低风险、快速拿到反馈，也更容易赢得客户信任、为后续争取空间。\n【干扰项】\nA：一次性全做完周期长、风险大，等做完才发现方向偏就损失惨重，与切口思想相反。\nB：东西做出来却永远不上线，价值就停留在内部无法交付给客户，真正的第一期切口强调的是尽快让小范围成果落地见效。\nC：专挑最难的部分先做，见效慢、风险高，违背了「小而可控、见效快」的切口原则。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-061","d":3,"t":"single","q":"为什么建议交付先从「小而可控」的第一期切口开始？","o":[{"l":"A","t":"能快速验证价值、积累信任并降低风险"},{"l":"B","t":"因为大项目在技术上根本不可能成功"},{"l":"C","t":"因为模型能力只够做很小的事"},{"l":"D","t":"因为这样可以少收客户的钱"}],"a":["A"],"e":"先从小而可控的切口开始，能快速验证价值、积累客户信任、暴露并降低风险，为后续扩展打好基础。小步快跑拿到正反馈后，再谈扩展就水到渠成。这也是很多成功项目都从小切口起步的原因。\n【干扰项】\nB：大项目并非技术上不可能成功，只是宜分期推进以控风险，说不可能是夸大其词。\nC：模型能力足以支撑较大项目，切口策略是为了控风险而非模型只能做小事。\nD：切口策略关乎风险和节奏，与少收钱无关，把动机说成少收费是误解。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-062","d":3,"t":"single","q":"设计验收指标时，下列哪种指标更可取？","o":[{"l":"A","t":"完全凭主观感受、无法衡量的指标"},{"l":"B","t":"可量化、可观测、与业务价值挂钩的指标"},{"l":"C","t":"与业务毫无关系的技术炫技指标"},{"l":"D","t":"设得高到永远无法达成的指标"}],"a":["B"],"e":"验收指标应尽量可量化、可观测、并与业务价值挂钩，这样才能客观判断交付是否成功、是否带来实际价值，也让客户看得见成效，减少「说不清算不算做成」的扯皮。\n【干扰项】\nA：完全主观、无法衡量的指标失去验收意义，双方各执一词无法定论。\nC：与业务无关的炫技指标衡量不到客户真正关心的价值，属于自娱自乐。\nD：设得永远无法达成的指标不合理，等于给交付判了死刑，无法作为公允的验收依据。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-063","d":3,"t":"multiple","q":"设计「第一期切口」时，下列哪些考虑是恰当的？","o":[{"l":"A","t":"范围可控、见效相对快"},{"l":"B","t":"能验证核心价值"},{"l":"C","t":"为后续扩展留出空间"},{"l":"D","t":"一次性覆盖所有次要场景"}],"a":["A","B","C"],"e":"第一期切口应范围可控、见效较快、能验证核心价值并为后续扩展留出空间，这样既降低风险又能快速拿到反馈，让项目在正反馈中稳步推进。次要场景可留到后续迭代逐步补齐。\n【干扰项】\nD：一次性覆盖所有次要场景会让第一期变得臃肿、周期拉长，违背「小而可控、见效快」的初衷，应把次要场景留到后续迭代。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-064","d":3,"t":"multiple","q":"关于验收指标设计，下列说法正确的有哪些？","o":[{"l":"A","t":"指标应尽量可量化可观测"},{"l":"B","t":"指标应与客户关心的业务价值挂钩"},{"l":"C","t":"验收标准应在交付前与客户达成一致"},{"l":"D","t":"指标越模糊越好，方便交差"}],"a":["A","B","C"],"e":"指标可量化可观测、与业务价值挂钩、并在交付前与客户达成一致，都是验收指标设计的正确做法，它们共同保证验收有据可依、双方预期对齐。三者齐备，验收环节才不会流于形式。\n【干扰项】\nD：指标模糊会让验收失去客观依据，「方便交差」是回避责任的错误动机，最终反而容易引发交付争议。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-065","d":3,"t":"single","q":"客户希望「一步到位做一个覆盖所有部门的超级智能体」。交付工程师较稳妥的建议是？","o":[{"l":"A","t":"立刻答应一次性把所有部门全覆盖"},{"l":"B","t":"一口拒绝，不接这个项目"},{"l":"C","t":"建议先选一个高价值场景做第一期切口，验证后再扩展"},{"l":"D","t":"不做需求分析就直接开工"}],"a":["C"],"e":"面对「一步到位覆盖所有部门」的宏大诉求，稳妥的建议是先选一个高价值场景做第一期切口，验证价值后再逐步扩展，既控制风险又能让客户尽快看到成效，为全面推广铺路。\n【干扰项】\nA：一次性全覆盖周期长、风险高，需求还没吃透就铺大摊子，失败概率很大。\nB：一口拒绝会失去交付机会，分期推进本身就是应对宏大诉求的可行策略，不必回避。\nD：不做需求分析直接开工，方向没定就动手，几乎注定要返工，是大忌。","s":"自编-TCFDE-2026-09"},{"id":"TF-D3-066","d":3,"t":"single","q":"验收指标与第一期切口的关系，下列说法最恰当的是？","o":[{"l":"A","t":"两者互相排斥不能同时存在"},{"l":"B","t":"有了切口就不再需要验收指标"},{"l":"C","t":"验收指标只在最后一期才需要"},{"l":"D","t":"第一期切口需要配套清晰的验收指标来判断是否成功"}],"a":["D"],"e":"第一期切口需要配套清晰的验收指标，用来判断这一期是否成功、是否达到预期价值，二者配合才能形成可评估的闭环，让每一期都有明确的成败标准，指导是否进入下一期。\n【干扰项】\nA：两者是配合关系，切口负责划范围、指标负责判成效，并不排斥。\nB：切口同样需要验收指标来衡量成效，没有指标就无法判断这一期是否做成。\nC：每一期都应有验收指标，只用在最后一期会让前期缺乏评估依据，节奏失控。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-001","d":4,"t":"single","q":"医疗行业用药咨询助手的「交付边界」应当如何设定？","o":[{"l":"A","t":"所有用药问题都由助手直接给出完整答案"},{"l":"B","t":"只做信息查询与流程辅助，专业判断转交给执业药师或医师"},{"l":"C","t":"只回答价格类问题"},{"l":"D","t":"可以主动给出调理方案"}],"a":["B"],"e":"医疗场景的交付边界要写死：不做诊断、不做个体化剂量调整，凡涉及具体患者的专业判断一律转给执业人员，助手只做信息查询与流程辅助。边界清晰，客户反而敢放手用。把边界写死在角色指令里，是这个场景安全运转的前提。\n【干扰项】\nA：直接给完整答案会触碰安全边界，医疗问题必须严谨。智能体只能依据知识库与规则应答，专业判断必须交给人。\nC：只答价格范围过窄，说明书、用法等常识问答都在范围内。用药常识之外，储存要求与注意事项同样是高频咨询。\nD：调理方案属个体化建议，智能体不涉足。这类建议风险高，拒答并转人工才是正确设计。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-002","d":4,"t":"single","q":"客户说「我们企业要上一个智能体」时，交付工程师的第一件事是什么？","o":[{"l":"A","t":"先收集原话，弄清背后的诉求再决定形态"},{"l":"B","t":"立刻把智能体搭出来"},{"l":"C","t":"先选定模型再谈需求"},{"l":"D","t":"直接替换现有系统"}],"a":["A"],"e":"客户原话是线索不是需求，先收集原话、拆解诉求，才能判断场景形态和模式选型。直接照原话开工，容易与真实诉求错位。一句话背后往往藏着几种完全不同的真实诉求，翻译清楚是开工的第一步。\n【干扰项】\nB：未经拆解搭建，容易驴唇不对马嘴。上线后发现方向错了，返工成本远高于先花时间拆解。\nC：先选型后定需求顺序做反了，需求不明时选型没有依据，很容易选错方向。\nD：替换系统是重大变更，要先理解现状和诉求。对现状理解不足就动手，最容易造成业务中断。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-003","d":4,"t":"multiple","q":"一个合格的交付切片，通常要满足哪些条件？","o":[{"l":"A","t":"场景单一，一个切片只服务一个知识域加一个任务"},{"l":"B","t":"效果可度量，上线前就能写出检验指标"},{"l":"C","t":"短周期见效，数据可得、权限可用的优先"},{"l":"D","t":"覆盖尽可能多的功能点，体现交付量"}],"a":["A","B","C"],"e":"合格切片三标准：场景单一、效果可度量、短周期见效。切口小，评测集小、调试快、返工成本低，客户在短周期内看到第一个可用，信任就建立起来。切口小是这一方法的核心，也是控制返工成本的关键。\n【干扰项】\nD：切片追求聚焦而非求多，功能铺开反而难以评测。切片聚焦，指标才清晰可测，评测也才做得起来。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-004","d":4,"t":"single","q":"法务合同比对场景中，智能体最合适的定位是什么？","o":[{"l":"A","t":"直接给出法律意见"},{"l":"B","t":"替代律师做商业谈判"},{"l":"C","t":"代签合同"},{"l":"D","t":"做辅助标注工具，输出差异清单和风险提示，意见由律师把关"}],"a":["D"],"e":"法务场景定位是辅助标注：输出差异、给风险提示，最终法律意见与决定权在律师手里。既提效，又守专业边界。辅助不等于替代，专业判断的权力始终留在人的手里。\n【干扰项】\nA：法律意见是律师职责，智能体不能替代。法律后果由人承担，机器不能替人担责。\nB：商业谈判涉及人的判断，不在智能体范围。谈判依赖人的临场判断与信任关系。\nC：合同签署权属流程与授权，不能交给助手。签署是授权行为，必须走人的审批流程。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-005","d":4,"t":"single","q":"「动词加名词分离法」拆解客户原话，主要能看出什么？","o":[{"l":"A","t":"客户真实的诉求与工作量结构"},{"l":"B","t":"客户公司的组织架构"},{"l":"C","t":"项目的预算金额"},{"l":"D","t":"模型的评分"}],"a":["A"],"e":"动词名词分离法把原话拆成动作加对象，归堆之后，原话背后真实的诉求与工作量就现形了。它是从原话到切片的关键一步。拆得清楚，后面的价值排序与交付节奏才有的放矢。\n【干扰项】\nB：组织架构不是拆解原话的产出。组织结构是管理问题，不是原话拆解的产出。\nC：预算在方案阶段另行评估。预算在方案与定价阶段另行核算。\nD：评分是评测环节的事。模型评分属于评测环节的输出结果。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-006","d":4,"t":"multiple","q":"切片排序的三个价值维度是哪几个？","o":[{"l":"A","t":"频次"},{"l":"B","t":"痛感"},{"l":"C","t":"可行性"},{"l":"D","t":"宣传声量"}],"a":["A","B","C"],"e":"切片排序用三维度打分：频次看每天发生多少次，痛感看不解决多难受，可行性看数据权限条件。三高进第一期，数据不齐的写二期。三个维度合起来打分，切片排序才客观可信。\n【干扰项】\nD：宣传声量不是价值指标，排序要以业务价值为准。对外声量不改变业务价值的大小与优先级。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-007","d":4,"t":"single","q":"传媒内容生产用 Multi-Agent 时，决定整体质量的关键是什么？","o":[{"l":"A","t":"Agent 的数量越多越好"},{"l":"B","t":"把所有环节合并成一个 Agent"},{"l":"C","t":"各 Agent 之间的交接信息质量"},{"l":"D","t":"完全去掉人工审稿"}],"a":["C"],"e":"多 Agent 流水线的瓶颈常出在交接信息，撰写 Agent 拿到的选题提示越具体，产出越不跑偏。交接信息质量决定整体效果，比堆数量更重要。把选题提示写细，整条流水线的质量才真正上得来。\n【干扰项】\nA：数量多不等于质量好，反而增加协调成本。数量堆不出质量，分工清楚才是关键。\nB：合并失去分工优势，复杂任务更難控制。复杂任务合并处理反而更难稳定可控。\nD：媒体签发权归人，不能全自动。内容责任必须由人来承担，机器不背书。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-008","d":4,"t":"single","q":"医疗用药咨询助手最合理的「交付边界」是什么？","o":[{"l":"A","t":"对任何用药问题给出确定性答案"},{"l":"B","t":"只做信息查询与流程辅助，专业判断转给药师"},{"l":"C","t":"接管处方与剂量调整"},{"l":"D","t":"代替药师回答所有问题"}],"a":["B"],"e":"医疗边界是查询与流程辅助：不做诊断、不做个体化剂量调整，涉及具体患者判断一律转给执业人员。边界清楚，客户敢放手。边界设计先于能力设计，这是高敏感场景的通用规律。\n【干扰项】\nA：复杂问题答案可能不安全，应拒答或转人工。高危问题直接给答案，出了事故就没有退路。\nC：剂量调整属于医疗决策，智能体不涉足。剂量属于个体化医疗决策，超出助手职责范围。\nD：代替药师违反安全边界。替代专业人员会触碰行业监管红线。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-009","d":4,"t":"multiple","q":"观察行业时，三个普适的「前置问题」是哪几个？","o":[{"l":"A","t":"知识沉淀在哪里"},{"l":"B","t":"一线重复劳动发生在哪个环节"},{"l":"C","t":"答错一次要付出多大代价"},{"l":"D","t":"公司人数有多少"}],"a":["A","B","C"],"e":"看行业先问三问：知识沉淀决定知识库怎么建，重复劳动决定场景切在哪里，答错代价决定权限引用兜底的力度。三问抓准，行业差异就变成组合差异。三个问题定了知识库、场景与安全力度三件事的设计方向。\n【干扰项】\nD：公司规模与场景设计不直接相关。规模不决定知识库结构与场景设计。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-010","d":4,"t":"single","q":"传媒内容生产场景，如何兼顾时效与质量？","o":[{"l":"A","t":"机器初稿加人工终审"},{"l":"B","t":"完全由机器自动发布"},{"l":"C","t":"去掉全部人工环节"},{"l":"D","t":"只要机器初稿不要审校"}],"a":["A"],"e":"传媒兼顾时效与质量：机器初稿提速，人工终审把关，签发权永远在人。这是内容生产流水线的安全设计。机器提速、人工把关、主编签发，三段缺一不可。\n【干扰项】\nB：自动发布无法保证合规与质量。自动发布绕过把关，内容风险会完全失控。\nC：去掉人工无法把关，敏感内容难拦截。没有人审，敏感与错误内容拦不住。\nD：没有审校，错误会直接暴露。缺审校的流水线，错误会直接见用户。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-011","d":4,"t":"single","q":"「客户原话是线索不是需求」这句话应如何理解？","o":[{"l":"A","t":"客户原话都不重要"},{"l":"B","t":"可以完全忽略客户描述"},{"l":"C","t":"需求只来自会议纪要"},{"l":"D","t":"客户原话不能直接开工，要翻译成可交付的需求"}],"a":["D"],"e":"原话是线索不是需求，要先拆解成诉求再切成切片。直接按原话开工，容易错位，这就是「把模糊变成清晰」的过程。翻译这一步做得越扎实，后面的方案越不容易跑偏。\n【干扰项】\nA：原话是最真实的线索，不能丢。原话里藏着真实痛点，是最宝贵的输入。\nB：忽略描述会丢失重要信息。忽略描述等于丢掉最关键的需求线索。\nC：会议纪要不是唯一来源，现场、记录、吐槽都是渠道。多条渠道并用，素材才完整立体。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-012","d":4,"t":"multiple","q":"收集客户原话的三条主渠道是哪几条？","o":[{"l":"A","t":"现场访谈，跟着一线干一天活"},{"l":"B","t":"历史记录，如工单、咨询记录"},{"l":"C","t":"日常吐槽，抱怨往往是切片的雏形"},{"l":"D","t":"只看高管发言"}],"a":["A","B","C"],"e":"三条主渠道：现场访谈、历史记录、日常吐槽。这些是真实证据，高频问题自己会浮出来。拆解是所有行业项目开工前的基本功，跳过它必然错位。这也是实战反复验证过的规律。\n【干扰项】\nD：只参考高管会漏一线细节，需求判断要一手数据支撑。注意：谈判与判断仍需人工主导。访谈、记录、吐槽才是真实素材的来源。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-013","d":4,"t":"single","q":"合同文本属于高敏内容，法务场景合理的权限安全做法是什么？","o":[{"l":"A","t":"所有合同全部开放给所有人"},{"l":"B","t":"完全不设权限"},{"l":"C","t":"按部门隔离、外部律师单独配置、检索留痕"},{"l":"D","t":"只在登录时校验一次"}],"a":["C"],"e":"合同高敏，知识库按部门隔离、外部访问单独配置、检索留痕，既协同又可控。这是权限与协同的平衡做法。让每一层风险都有对应的防护动作，而不是靠一个总开关。\n【干扰项】\nA：全开放会造成信息暴露。全部开放等于把敏感内容暴露给所有人。\nB：无权限风险极高。不设权限的数据等于公共数据。两者不能混为一谈。\nD：只在登录校验一次，后续动作无法控制。持续校验才能挡住运行中的越权行为。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-014","d":4,"t":"multiple","q":"医疗用药咨询助手的「标准配方」包含哪些部分？","o":[{"l":"A","t":"知识库承载药品说明书与专业指南"},{"l":"B","t":"标准模式或单工作流承载问答"},{"l":"C","t":"回答带出处，答不了引导人工"},{"l":"D","t":"回答可以自由发挥"}],"a":["A","B","C"],"e":"医疗标准配方：知识库装权威资料、模式承载问答、带出处且答不了就转人工。专业、速度、安全都照顾到。安全设计是高敏行业落地的入场券，先于功能设计存在。\n【干扰项】\nD：自由发挥会制造幻觉与风险，医疗必须严谨。高敏场景的输出必须可追溯、可核对。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-015","d":4,"t":"single","q":"在线教育答疑助手，最合理的产品边界是什么？","o":[{"l":"A","t":"代替老师完成授课"},{"l":"B","t":"只答课程内知识点并标注出处，鼓励学生自主思考"},{"l":"C","t":"自动打分并决定学生成绩"},{"l":"D","t":"任何问题都可以自由回答"}],"a":["B"],"e":"教育场景的定位是辅助：知识点答疑、标注出处、引导思考。它不替代授课，不参与成绩评定，边界守住，学校和家长才敢用。边界清楚，学校与家长才愿意把它放进教学流程。\n【干扰项】\nA：授课是教师职责，助手只做补充。授课始终是教师的职责核心。\nC：成绩评定涉及教育公平，不能交给系统。成绩必须由教学评价体系决定。\nD：自由回答没有边界，会出安全风险。无边界回答会带来内容安全风险。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-016","d":4,"t":"single","q":"钢贸行业报价助手，正确的角色定位是什么？","o":[{"l":"A","t":"直接以助手报价对外成交"},{"l":"B","t":"完全自动调价"},{"l":"C","t":"信息聚合与参考，最终报价由业务员确认"},{"l":"D","t":"替业务员与客户谈判"}],"a":["C"],"e":"钢贸场景的价值是把价格、库存、历史成交聚合起来供业务员快速参考，报价的决定权在人。助手提速，不越权。参考与决策分离，是这类交易场景的标准设计。\n【干扰项】\nA：对外成交涉及商业决策，必须由人确认。对外成交必须落在人的授权范围内。\nB：调价是经营决策，风险高。价格决策牵一发而动全身。后果会直接落在项目上。\nD：谈判涉及人的判断，不在助手范围。谈判依赖人的判断与关系积累。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-017","d":4,"t":"multiple","q":"工业设备排障助手建知识库，哪些做法是正确的？","o":[{"l":"A","t":"老师傅口述整理成结构化案例模板"},{"l":"B","t":"每个案例经第二位工程师复核才入库"},{"l":"C","t":"纸质手册原样扫描不做整理"},{"l":"D","t":"即将退休老师傅的经验无需保留"}],"a":["A","B"],"e":"工业知识库的核心是把个人经验变成组织资产：口述整理成模板，双人复核把关，防止把个人的错误姿势固化进库。经验只有变成结构化资产，才能被系统与团队复用。\n【干扰项】\nC：原样扫描不整理，模型没法准确检索。不整理的素材，模型检索不动。\nD：老师傅经验最稀缺，恰恰要优先沉淀。最稀缺的经验要最先抢救沉淀。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-018","d":4,"t":"single","q":"排障场景用单工作流固定流程，主要原因是什么？","o":[{"l":"A","t":"单工作流成本最低"},{"l":"B","t":"排障顺序不能乱：先问现象、再查特征、再给处置建议"},{"l":"C","t":"单工作流功能最丰富"},{"l":"D","t":"客户指定必须用"}],"a":["B"],"e":"排障是强流程任务，信息收集、现象定位、原因判断、处置建议的顺序不能乱。单工作流把骨架固定下来，每一步只做一件事。顺序错了排障就乱，这正是选单工作流的根本原因。\n【干扰项】\nA：成本不是选型的第一依据。选型看场景性质，不看价格高低。别把注意力放错了地方。\nC：丰富与否与场景适配无关。功能多少不等于适配程度。它不在本题的判断范围里。\nD：选型依据是场景性质，不是指定。依据是任务性质，不是谁的指定。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-019","d":4,"t":"single","q":"面向医药企业的「医生学术互动管理」场景，设计上的第一优先级是什么？","o":[{"l":"A","t":"娱乐化表达"},{"l":"B","t":"发送量最大化"},{"l":"C","t":"完全自动化无需审核"},{"l":"D","t":"内容合规与专业严谨"}],"a":["D"],"e":"医药场景面向专业人士，内容必须合规、严谨、可溯源，任何夸大或不当表述都可能触碰行业红线。内容安全是第一设计约束。合规优先级，直接决定这套系统能不能落地。\n【干扰项】\nA：娱乐化损害专业形象。专业场景里娱乐化是明显减分项。这一点要分清楚。\nB：数量不能压过质量。数量再大也补不了质量的漏洞。这点上没有商量余地。\nC：完全自动发送没有把关，风险极大。无人审核的发送链路风险极大。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-020","d":4,"t":"multiple","q":"传媒热点快讯生产流水线，典型的分工包括哪些环节？","o":[{"l":"A","t":"选题 Agent 从素材库和热点线索里提选题清单"},{"l":"B","t":"撰写 Agent 按栏目风格生成快讯初稿"},{"l":"C","t":"审校 Agent 做事实要点核对与敏感词拦截"},{"l":"D","t":"终稿由审校 Agent 直接对外发布，不再需要人工"}],"a":["A","B","C"],"e":"流水线是三段接力：选题、撰写、审校各司其职，但终稿必须由主编人工签发，机器提速不背书。编辑只处理机器标红的存疑段落。机器提速、人工把关、主编签发，这个分工是传媒场景的安全设计。\n【干扰项】\nD：签发权永远在人，审校 Agent 不能直接对外发布，这是传媒场景的安全边界。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-021","d":4,"t":"single","q":"传媒行业智
