过程复盘一遍。从原话到切片，从切片到落地，哪些步骤好用、哪些坑要绕，都记下来。做项目积累的不只是数据，还有方法论。方法越攒越厚，下一个项目就走得越顺。\n\n**切片表，是客户看得见的进度条。**\n\n切片表把项目的进度摊开给客户看：哪些在交付，哪些在排队，哪些已上线。客户随时知道走到哪一步，心里有底。切片既是交付计划，也是沟通工具。\n\n**切片的颗粒度，要恰到好处。**\n\n切得太细，碎片化，管理负担重；切得太粗，周期长，风险大。一个合适的颗粒度，通常是一个切片一到两周能交付。颗粒度合适，项目的节奏才稳得住。\n\n**切片的方法，可以跨行业复用。**\n\n零售、制造、金融，行业千差万别，但「原话到切片」的方法是相通的。掌握了通用方法，换一个行业，只是换一套背景知识。方法一旦通用，交付能力就铺得开。\n\n**每一次切片调整，都要有理由。**\n\n客户提新需求、改范围，要先问清楚：为什么要改、影响哪些切片、代价多大。有依据的调整，可控；没有依据的变更，容易范围失控。把每一次变更都讲到明处，项目才不会越做越偏。切片是承诺，也是边界。\n\n把切片的节奏把住，把边界守住，项目就能稳稳地往前推进，客户也会越来越放心。\n\n这份认真，就是交付里最稳的保障。这份认真，正是交付里最深的保障。"},{"h":"4.3 综合案例实战","body":"这一节用三个完整的合成案例，把背景、需求、方案、交付、复盘五个环节完整走一遍。三个案例分别覆盖标准模式、单工作流与 Multi-Agent 三种构建形态，也分别踩过不同的坑，建议对照前几章的知识逐段拆解，体会每个决策背后的取舍逻辑。\n\n**案例一：连锁药房用药咨询助手。**\n\n背景：一家两百家门店规模的连锁药房，会员服务体系里最重人力的一块是用药常识咨询。店员专业知识参差不齐，会员常问「这个药和那个药能不能一起吃」「这个药饭前吃还是饭后吃」，坐班药师只有三位，覆盖不了全部门店。\n\n需求原话：总部会员服务负责人说，「会员总在问药的常识，店员答不专业，药师不够用，出了答错的事故我们担不起。」这句话翻译过来是三层诉求：高频常识问题需要分流，回答必须专业可信，答错的代价必须被锁死。\n\n方案选型：标准模式加知识库。理由有三：场景是典型的单一知识域问答，不需要复杂流程编排；知识源明确且权威，药品说明书本身就是结构化文本；答错代价高，标准模式便于做引用溯源与拒答设计。具体设计上，知识域包括常用药品说明书、常见配伍禁忌表、储存与服用注意事项；角色指令明确三条铁律——只依据知识库内容作答、每条结论标注来源、无法确认时引导咨询医师或药师；权限上会员端与店员端分开，店员端可以看更多内部备注信息。\n\n交付过程：第一步数据准备，药师团队牵头整理八百份常用药品说明书入库，做了三轮去重与口径统一，药师抽检样本文档的准确性与完整度；第二步评测集建设，从会员咨询记录里挑出三百个真实问题，其中两成是边界题和对抗题，例如故意混用商品名与通用名提问；第三轮评测结果显示整体命中率达到九成二，剩余问题集中在商品名与通用名映射缺失，补一张对照表后二次评测通过；第四步试运行，先在十家门店跑两周，店员每天记录无法回答的问题清单；第五步培训，给店员做了一次两小时的实操培训，重点是「遇到助手拒答时怎么接话转人工」。\n\n复盘：成功点是引用溯源设计让药师团队敢于放行——每个答案可查到说明书原文，责任边界清晰；不足是会员高频的个体化问题，例如合并慢性病的用药调整，助手只能按设计拒答，一部分会员觉得「问不出结果」，二期规划是把这些拒答流量接到药师热线并形成工单回访。这个案例的启示：答错代价高的场景，方案的重心不在「答得多」，而在「答得可查、答不了时体面地转出去」。\n\n**案例二：制造企业设备排障助手。**\n\n背景：一家中型制造企业，售后部门二十四小时接听各地客户的设备故障电话，资深工程师八个人，新工程师排障全靠现场摸索，同一故障的处理时长能差出两倍，老师傅的经验没有沉淀载体，退休一个少一个。\n\n需求原话：售后总监说，「新来的工程师接电话就发怵，老师傅接一个电话十分钟定位，新人四十分钟还在问客户拍照片。能不能把老师傅的脑子装进系统里？」翻译成需求语言：把排障经验文档化、流程化，让新人按图索骥，同时保留处理记录供复盘。\n\n方案选型：单工作流为主干，配 Multi-Agent 做分工。理由：排障是强流程性任务，信息收集、现象定位、原因判断、处置建议的顺序不能乱，适合单工作流固定骨架；但其中检索与报告两个环节工作量大且性质不同，拆成检索 Agent 与报告 Agent 更清晰。整体结构是：问诊 Agent 按工作流逐项确认设备型号、故障现象、环境条件；检索 Agent 拿结构化字段查知识库，返回最可能的三个原因与对应处置步骤；报告 Agent 汇总生成结构化处理建议单。知识库装载设备手册、历史故障案例四十例（由老师傅口述整理）、标准操作规程。\n\n交付过程：知识采集花了整个项目近一半时间——访谈八位资深工程师，把四类主力设备的高频故障整理成案例模板：现象、特征、原因、处置、注意事项，每个案例经第二位工程师复核才入库；调试阶段重点调的是交接字段，问诊 Agent 传给检索 Agent 的信息一开始只有故障现象的原始描述，检索命中率惨淡，改成结构化字段后明显改善，这个细节印证了 Multi-Agent 设计里「交接信息质量决定整体效果」的铁律；评测集用一百二十个历史工单做盲测，处置建议的首条命中率七成五，加上二三条候选的覆盖率达九成；试运行一个月，新旧工程师分两组对照，新人组的平均定位时长下降四成。\n\n复盘：成功点是案例库的复核机制——每个案例两个人把关，避免把个人经验里的错误姿势固化进知识库；不足是部分服役超龄的老设备资料残缺，该型号在知识补齐前一律走人工通道。项目最有价值的产出其实不是助手本身，而是四十个结构化案例——企业第一次把散在老师傅脑子里的资产变成了组织资产，这比省下多少小时都值钱。\n\n**案例三：传媒集团内容生产助手。**\n\n背景：某区域传媒集团新媒体中心八名编辑，承担着多个平台账号的日更任务，热点一来全员透支，日常选题会占用大量时间，多平台改写是纯粹的重复劳动。\n\n需求原话：主编说，「我们不是缺创意，是缺把创意变成十条稿子的人手。热点来了我们要同时喂五个平台，每个人写的调性还不一样。」翻译：初稿生产提速、多平台形态改写、风格一致性保障。\n\n方案选型：Multi-Agent 流水线加智能工作台。选题 Agent 汇总素材库与热点线索生成选题清单；撰写 Agent 按平台各自的角色指令生成对应调性的初稿，风格样例做成了参照样本；审校 Agent 做事实要点核对与敏感信息拦截，拦截规则在生成侧前置。编辑们在智能工作台上领任务、看结果、改终稿，主编的签发动作保留在智能工作台审批流里。\n\n交付过程：风格样例整理是关键前置功课，每个平台挑出十篇标杆稿做拆解，把句式偏好、段落节奏、标题风格提炼成角色指令；审校 Agent 的拦截清单由编辑部与法务共同确认，敏感人物、未核实数据、广告法违禁表述都在内；评测阶段不看命中率看通过率——机器初稿经审校 Agent 自检后，编辑改动量低于三成的稿件比例作为核心指标，首轮只有五成，调整样例与指令后达到八成五。上线后日产量接近翻倍，快讯类稿件从选题到可签发状态平均四十分钟。\n\n复盘：成功点是「机器初稿、人工签发」的分工让主编放心授权，签发权从未离开编辑之手；不足是深度报道的机器参与度天然低，助手在这类稿件上只做资料汇集，团队一度期望过高，靠指标说明会拉平了预期。三个案例合起来看：标准模式解决可信问答，单工作流解决流程引导，Multi-Agent 解决流水线分工——模式选型永远跟着场景性质走，而不是跟着技术热度走。\n\n**综合案例复盘，把方法拎出来。**\n\n三个案例看完，有几条方法是反复出现的。第一条，先锁场景边界，再定方案结构。边界没定，后面全是空谈。第二条，评测集要早建，别等上线再补。第三条，方案要和客户对齐后再动手。第四条，上线不等于结束，运营复盘才是常态。这几条，是所有案例共同的主线。\n\n**案例里的不完美，恰恰最真实。**\n\n三个案例也有不完美的地方。药房助手的个体化问题会拒答，制造案例的老设备资料不全，传媒案例里的敏感选题要人工再核。这些不是瑕疵，而是真实业务的写照。方案的边界要如实告知客户，让客户心里有数。客户记住的，往往不是答得最多，而是该答的答好、该转的转得干净。\n\n**选模式，是在选管理方式。**\n\n三个案例分别用了标准模式、单工作流和 Multi-Agent。选哪个不是靠感觉，而是看场景性质：单一知识问答用标准模式，强流程任务用单工作流，多角色分工用多智能体。模式是手段，场景是依据。选对了模式，等于选对了一套管理方式。\n\n**案例是说服客户最好的语言。**\n\n做方案时，讲清案例，客户才容易理解。案例讲得好，比堆参数更有说服力。讲案例，也是交付能力的一部分。它不只是给客户看，也是给自己团队定心。\n\n**交付之后，案例还在继续。**\n\n案例的结束，不是上线，而是上线后持续运营的开始。跟踪效果、收集反馈、迭代优化，这段过程让案例真正完整。很多项目做完就停，价值反而藏在运营里。把运营做起来，案例的价值才真正放出来。\n\n**综合案例，是最好的教学材料。**\n\n三个案例常用来带新人。新人在案例里练习拆需求、选模式、做评测，比只讲理论更接地气。把案例当教材，团队的方法论就一代代传下去。\n\n**给每个案例，写一段「如果重来」。**\n\n每个案例结束后，复盘一遍如果重来会怎么做，哪里能更快、哪里能更稳。把复盘写成文字，经验就变成看得见的资产。下次再遇相似项目，直接翻出来对照。\n\n**案例的深度，胜过数量。**\n\n把一个案例吃透，胜过浅尝十几个。深挖一个案例，才真正提炼得出方法。案例要少而深，而不是多而浅。沉淀质量，从精选案例开始。\n\n**把案例讲成团队共同的语言。**\n\n当团队用同一个案例对话，沟通成本就低了。提到某个案例，大家就知道说的是什么场景、什么打法。案例一旦成为共同语言，协作和教学都顺手得多。\n\n**方法，是在案例里长出来的。**\n\n好的方法不在书架上，而在一次次案例的复盘里。做透案例，方法自然浮现。多复盘、多沉淀，综合实战的价值才能一茬一茬地收回来。"}]},{"domain":5,"name":"交付实施、评测与运维","weight":"11%","practice":[],"sections":[{"h":"5.1 调试方法论与单次调试五步法","body":"调试是交付工程师最考验手感的一段路。方案画得再漂亮，落地时总会在细节上露出破绽。智能体不是普通软件，它的行为是模型现场生成的，同一个问题在不同时候可能给出不同的答案。这种不确定性，让调试变得比传统开发更难把握。\n\n**先把调试的本质想清楚。**\n\n传统软件调试逻辑是确定的。某段代码报错，顺着调用栈查，原因基本能定位。智能体不一样，它没有固定的执行路径。同一个问题，上午答对了，下午换个措辞就可能答偏。它更像一个能力在线但需要反复确认的实习生，你要不断确认它理解对了没有。\n\n所以调试智能体，本质是把一个不确定的黑盒，重新变成你能看懂、能预测的系统。\n\n**调试对象不是一行代码，而是整套系统。**\n\n这里要先纠正一个常见误解。很多人以为调试就是改提示词，多补两句让它答对。实际上，智能体的最终表现由好几个环节共同决定。指令怎么写，知识库检索到什么，工作流每一步怎么走，模型选哪个，任何一个环节出问题，最终答案都会异常。\n\n某零售客户做过一个商品咨询助手，客户抱怨「价格问题总答错」。第一反应是改提示词，改了几版都没用。后来把日志摊开看，才发现知识库里商品的单位没统一，有的写「瓶」，有的写「箱」，模型检索到混用数据，自然算错价格。真正的问题不在提示词，在数据。\n\n所以要先判断异常出在哪一层，而不是急着改某一处。\n\n**单次调试五步法，让调试不靠运气。**\n\n面对一个异常回答，不要拍脑袋就改。按五步走，每一步都有明确产出，调试才可重复、可积累。\n\n第一步，复现。把出问题的场景固定下来。客户当时问的原文是什么，用了哪个模式，什么时间。把这条输入保存下来，做成固定测试样例。不能复现的问题，无从谈修复。\n\n第二步，定位。顺着链路猜最可能的出错环节。是理解错了，还是检索不到，还是流程断了。这一步不用很准确，先列出两三个最可疑的点。\n\n第三步，假设。针对可疑点给出可检验的假设。例如「可能知识库里没有对应数据」，或「指令对格式要求不够具体」。假设要能被执行，能被证实或证伪。\n\n第四步，修改。一次只改一个变量。这步最容易贪多，一次改三处，答对了也说不清是哪处起的作用。所以一次只动一个环节。\n\n第五步，验证。用固定样例跑一遍，看是否改善。同时要防止「按下葫芦浮起瓢」，一条改好，别把其他本来对的带崩。要回到完整评测集里统一看。\n\n**每一步，都有要防的坑。**\n\n复现阶段最常见的坑，是用同义词乱替换。客户问「退货怎么退」，你复现时改成「退换货怎么操作」，输出可能就变了。复现必须用原文原貌，一字不改。\n\n定位阶段最忌讳瞎猜。一个方法能帮上忙：把中间产物打出来看。很多调试控制台能看到模型理解的意图、检索到的片段、每个环节的输出。数据是最诚实的证词，看中间产物比凭空猜更快。\n\n修改阶段的纪律最关键。一次一改，是调试稳定的前提。某次调一个法务问答助手，工程师一口气把提示词、检索策略、工作流入口全改了，结果问题更乱，退回逐项改，才找到症结。\n\n**调试要养成留痕的习惯。**\n\n调试记录值得沉淀。每次调完，把原始用例、改了什么、效果如何记录下来。这些记录两大用处。第一防返工，两周后客户反馈同类问题，翻记录就知道怎么处理。第二建回归库，每调好一条就加进评测集，后续任何改动先跑一遍老用例，确保不改坏旧的。\n\n某工业排障助手就是这样沉淀出上百条历史用例的。团队每次调试都记一条，三个月形成一份「问题-解法」档案。新人照档案接手，省下大量试错时间。\n\n**调试不是一次性的，而是贯穿始终。**\n\n很多人把调试当成「上线前的事」，上线就结束了。实际上，智能体的真实使用场景永远比测试复杂。客户实际问法、数据变化、业务调整，都会带来新问题。调试要贯穿整个生命周期。\n\n这也说明，调试能力是交付工程师的基本功。会调试的人，面对一个表现平平的助手，能逐步调到稳定好用；不会调试的人，只会反复试错，寄希望于运气。\n\n**中间产物，是调试最诚实的证据。**\n\n复现、定位之后，最有效的下一步是看中间产物。多数调试控制台会展示模型理解到的意图、检索命中的片段、每一步工作流的产出。这些信息是查明真相的钥匙。某客户抱怨「商品检索总不准」，打开中间产物一看，检索阶段命中的片段和用户问题对不上，是知识库切片方式把关键信息切断了。问题立刻从「玄学」变成「数据」，修复就有方向。\n\n这里有个反直觉的地方。很多人不爱看中间产物，觉得内部数据看不懂。其实不用全懂，只要对照正常链路的样子，看哪一步跳了。正常时命中相关片段，异常时命中无关内容，一眼能分辨。\n\n**偶发问题，靠日志把链路串起来。**\n\n单看中间产物，只能解决当下。要追一个偶发问题，得靠日志。日志把输入原文、检索结果、生成输出、各环节耗时记下来，出问题时能还原完整路径。某售后助手偶发答错，现场怎么复现都正常。查日志发现，一批新素材格式不规范，被检索命中后带偏了答案。日志把散落的线索串成一条线。\n\n日志记什么？输入原文、检索片段、生成输出、用到的模式与模型，够了，不用贪多。但要特别注意：日志可能含客户隐私，要脱敏、定期清理、按权限隔离。\n\n**一次完整的五步调试，走一遍给你看。**\n\n某订单类助手，客户反馈查不到今天的订单。第一步复现，用原始订单号跑一遍，确实返回空。第二步定位，怀疑是检索环节查不到数据。第三步假设，可能是订单没同步进知识库，也可能当前角色权限不足。第四步修改，一次只动一处，先放开测试账号权限，仍空，排除权限；再去查数据，确认订单库没同步，补上同步后进入第五步。第五步验证，重跑命中正常，并把这条补进回归集。问题解决，且后续改动都能第一时间发现是否复发。\n\n这个案例有两点提醒。假设要列多个，逐个排除，别单吊一个。定位阶段要用数据说话，别靠猜带节奏。\n\n**常见的调试陷阱，提前绕开。**\n\n一是只改提示词、不动数据。模型答错，根子常在数据，改提示词是隔靴搔痒。二是贪多，一次改一片，出了事说不清是哪处引起。三是只看答案不看路径，答对未必走的对，可能是碰巧。四是不回写回归集，改好没入库，下次被别的改动改回去。\n\n**上线之前，做一次全量体检。**\n\n把评测集完整跑一遍，确认整体达标。边界题和对抗题单独扫一遍，看会不会翻车。再把日志做一次敏感内容扫描。这些前置动作，能把大问题挡在上线之前。体检通过，才能谈稳妥上线。\n\n**调试和评测，是配合着走的。**\n\n单点调试和整体评测，不是两件事，而是配合着走。调好一个问题，回到评测集看整体有没有掉下来。评测暴露的新问题，再回到调试里去处理。两边滚动推进，系统表现才稳步上升。见过有团队把调试和评测各干各的，问题修好了，整体评分没跟上来，两边都对不上。其实它们是一条链上的两环，缺谁都转不圆。\n\n**调试日志，同时是评测集的养料。**\n\n调试时遇到的真问题、边界表现，都是评测集的好素材。把这些问题转进评测集，相当于把调试经验沉淀成了可复用的资产。调试越深入，评测集越丰富，下一轮的优化就越有依据。\n\n**不同场景，评测的严格度不一样。**\n\n高敏感行业，比如医疗、金融，答错代价高，评测要多放对抗题和幻觉题，把关从严。内容创作、客服分流这类场景，可以更看重速度与体验。评测的强度，要匹配业务的风险程度。高风险从严，低风险求快，这个分寸要拿捏好。\n\n**把评测的方法，一起交给客户。**\n\n交付不只是一套能用的助手。把评测集、调试方法、历史问题档案整理清楚，一并交给客户，客户就有了持续维护的能力。很多项目交付完就断线，客户出了问题无从下手。把方法教给客户，客户能自己评测、自己维护，长久的信任和价值才会沉淀下来。\n\n**调试时，别只盯最终答案。**\n\n很多人调试只看答案对不对。其实过程信息更值钱。模型理解到哪一步、检索回了什么、工作流走没走对，这些中间状态常比答案更能说明问题。答案对，可能是碰巧；过程对，才说明系统真的稳。多花一分钟看过程，能省下后面几小时的返工。\n\n**调试和数据质量，是连着的。**\n\n不少调不好的问题，根子都在数据。数据没整理、口径不统一、格式不规范，模型再聪明也答不好。所以调试要常回头看数据。数据质量上去了，很多问题自然消失。数据、模型、流程、提示词，是一体的，别拆开单独治。\n\n**问题档案，是团队的资产。**\n\n调试留下的问题解法档案，是团队的资产。它不仅让个人少踩坑，还能让新人快速上手，让团队经验不随人走。归档要规范，标清现象、原因、改法。归档越认真，价值越滚越大。别把调试记录当草稿，要当文档来维护。\n\n**调试结束，要有一个干净的收尾。**\n\n问题解决了，还有最后一件事：把结论同步出去。知识库要更新吗？提示词要回写吗？回归集要加样本吗？这些收尾动作做干净，这次调试才算完整闭环，而不是临时打补丁。收尾干净，系统才健康，交付才稳当。守住这条调试路径，交付里遇到的再难的问题，也有了可循的解法。"},{"h":"5.2 评测集建设与批量评测","body":"调试解决单点，验证靠整体评测。单次调试能解决一个具体问题，但要判断一个智能体整体好不好用、能不能上线，靠的是系统的评测。这一节讲评测集怎么建、批量评测怎么跑、指标怎么设计。\n\n**没有评测集，就没有客观标准。**\n\n先想一个问题：你说这个助手「不错」，依据是什么？凭感觉的评价不可量化，也没法复现。客户问「准确率多少」，你总不能回答「还可以」。评测集就是把主观评价，变成可量化、可对比、可追踪的客观依据。\n\n一份评测集，本质是「一批有标准答案的问题」。上线前，用它在系统上跑一遍，得出准确率、召回率等数字。调完某个环节，再跑一遍，看数字有没有变好。数字会告诉你，改动是否真的有效。\n\n某金融问答助手做交付前核验时，客户质疑「有没有数据支持」。交付方拿出评测集，两百条历史工单，标注了标准答案，当场跑一遍，命中率九成二。客户亲眼看到过程，比任何口头承诺都更有说服力。\n\n**评测集要有四类题，缺一类都不完整。**\n\n第一类是种子题，也就是正常场景。把客户常见问题选一批，覆盖绝大多数高频使用。种子题决定常规表现。\n\n第二类是边界题，也就是边缘情况。问题里夹错别字、口语、超长句、多轮追问、超长文档。边界题决定扛不扛得住。\n\n第三类是对抗题，也就是故意刁难。张冠李戴、试图绕过限制、混淆概念的表述。对抗题决定会不会被带偏。\n\n第四类是回归题，也就是历史题。把每次调试通过的问题攒起来，形成回归库。回归题决定改旧的是不是把老的弄坏。\n\n四类题的比例没有定死，通常种子题占大头，边界题和对抗题保证一定量。重点是每一类都不能缺，否则评测视角是残缺的。\n\n某医疗用药咨询助手，初期评测集只有种子题，界面看准确率极高。上线后，用户用商品名而不是通用名提问，立刻露馅。补进边界题和对抗题后，才发现并修掉一堆隐患。\n\n**标注标准答案，是评测集最重也最稳的活。**\n\n评测集的价值在答案。没有标准答案，评测无从对照。标注要守几条规矩。\n\n答案要来自权威源。拿官方政策、内部制度、专家确认过的结论做答案，不能自己拍脑袋。多选题要标全，不能只标一个。答案的格式要统一，便于机器比对。\n\n标注要复核。至少两人各核一遍，能过滤掉不少错误。错误的标准答案比没有更糟，它会输出错误的结论。\n\n**批量评测，是把评测集跑起来的过程。**\n\n单条跑一次只能看一条，效率太低。批量评测，就是一次性跑完整套评测集，自动得出汇总数字。这项工作尽量自动化。\n\n批量评测做三件事。第一，准备输入，把评测集按固定格式导入，问题、答案、题型一一对应。第二，跑批，系统逐题回答，记录每题输出。第三，出结果，汇总准确率，把回答与标准答案的差异列出来。\n\n某传媒内容助手，把评测集做成脚本，一次批量跑完，改一处重跑，前后对比。高效的批量评测，让调优有了数据支撑，而不是摸黑前进。\n\n**指标设计，盯住客户真正关心的数字。**\n\n评测集跑完，出的数字很多，但指标不是越多越好。指标要服务业务，让客户能看懂、能认同。\n\n最常见的是准确率，答对的占比。对问答类场景，准确率是核心。\n\n检索类场景，更看重首条命中率：用户第一条搜索命中对不对。首条命中率直接决定体感。\n\n客服类，看机器解决率：常见问题在机器侧就被解决、不必转人工的比例。\n\n生成类，看幻觉率：模型编造不存在的比例。幻觉率越低越安全。\n\n指标一次不要铺太多。先定两三个核心指标，把这几项做准，比堆一堆数字更有价值。某客户要求为售后排障助手定指标，团队只定了三个：首条命中率、处理时长、转人工率。围绕这三个调优，客户每周都能看到数字变化，信任度一路攀升。\n\n**评测集不是一次性产物，要持续生长。**\n\n评测集要随业务长大。上线后遇到的真实问题，随时补进评测集。新业务场景来了，把对应题目加进去。评测集，会越来越像业务的「体检表」。\n\n业务规则变了、产品改版了，评测答案也要跟着更新。不然评测集就过时了，跑出来的数字失真，误判现状。\n\n**评测是决策的支撑，不是走秀。**\n\n有团队为了好看，把评测集做成「能答对的都进、答错的都不放」，跑出来一片高分。这种评测没有意义。真实评测要覆盖难题、对抗题，敢于暴露缺点。暴露的问题，恰恰是下一步的优化方向。\n\n好的评测集，是交付质量的守门员。它把一切量化，也逼着你正视一切。带着它上线，比盲目上线稳妥得多。\n\n**评测数据，要看得见、说得清。**\n\n评测的数字，不能只存在系统里。要给参与方都看得见。客户看结论，工程师看失败样例，负责人看趋势。用表格或报告把关键数字定期汇总，让各方对现状有共同的理解。某个答案之前，大家先对齐「到底现在什么水平」，决策才不会跑偏。\n\n**四类题之外，还要留一条兜底通道。**\n\n评测集不可能穷尽所有情况。总会有没覆盖到的新问题。所以评测体系要留一条兜底通道：线上用户反馈的入口。任何一条新问题，都能快速登记，转入评测集。这条通道让评测集始终能接住现实世界的新变化，不至于越跑越脱节。\n\n**评测的成本要控制住。**\n\n评测不是越重越好。一开始几十条题也能跑起来，边做边扩。随着项目变大、规则变多，再逐步加大样本。成本控制不住，评测容易做成摆设。先跑通，再加大，是评测集务实发育的正确姿势。\n\n**评测与交付流程，要真正连起来。**\n\n评测不是交付流程之外的一摊事，它应该嵌进每个环节。方案阶段设计，交付阶段验证，上线阶段监测。评测结果回流到方案，方案指导评测的下一步。这样才能形成「评估-反馈-优化」的闭环，让评测的价值真正落在交付质量上。\n\n**评测集上线，要先过一段过渡期。**\n\n新评测集不能直接替换旧版。先小规模试跑，和旧评测集对比，确认口径没跑偏，再正式启用。直接整套替换，新旧数据不可比，数字跳变也说不清原因。过渡期跑几轮，换来的是数据口径的连贯，数字才可信。\n\n**评测要固定在固定节奏上。**\n\n评测不能想起来才做。要固定频率，比如每周一次，每季度一次大复盘。节奏固定，数据才能纵向比较，趋势才能被看见。某项目把评测设成每周例会的固定环节，团队养成了用数据说话的习惯，口径一致，决策也快。\n\n**评测结果，要落到具体怎么改。**\n\n数字本身不会改系统，重要的是把数字转成动作。评测暴露的薄弱点，要对应到具体整改项：改提示词、补数据、换检索、加样本。每项整改要有人认领、有时间、有验证。整改闭环了，评测才不是空转，才真正推动系统变好。\n\n**模型升级，评测是不可或缺的裁判。**\n\n模型厂商常推新版本。要不要升，不能只看宣传，要看评测。用完整评测集，在新旧模型上各跑一遍，逐项对比，再决定。新版本快了，但幻觉高了，就得慎重。评测，是模型选型最稳的客观依据，避免凭感觉冒险切换。\n\n**评测集的规模，要跟得上项目阶段。**\n\n项目初期，几十条题就能跑。项目成熟、场景变多，评测集就要相应加厚。判断标准是：遇到新场景有没有题可测，跑完能不能看出哪类问题多。评测集的规模跟着项目复杂度走，既不拖后腿，也不空转。\n\n评测体系，是一套持续运转的机制。它用数字代替印象，用闭环代替感觉，用成长代替一次性。用好这套机制，评测质量就立得住、走远。\n\n**评测集要防好面子。**\n\n有人为了让评测好看，偷偷把答错的题删掉，或者只放能答对的题。这是自欺欺人。评测的价值恰恰在发现问题。敢把难题、对抗题放进来，跑出的数字才真实，才有改进空间。面子挡住的不是分数，是问题本身。\n\n**评测要跟客户一起看。**\n\n评测不能自己躲在后台跑。跟客户一起过评测，讲清楚哪些题过了、哪些没过、为什么，客户对系统能力就有真实预期。某些边界答不上的，提前讲清楚，避免上线后被当成缺陷。透明度带来信任，也减少误会。\n\n**别让评测集变成历史包袱。**\n\n评测集里的题，有些过时就该清理。业务已下线，对应问题就不要再占评测资源。定期清一清，保留有代表性、反映当前状态的题。评测集保持「当前的体检表」而不是「历史的陈列馆」，数字才跟得上现状。\n\n**评测结果，要对齐业务目标。**\n\n评测的指标，要和业务方真实诉求对齐。客户在意的是转化、是减负、是提速，评测就该围绕这些。别拿一个漂亮的准确率，却没回应客户最想要的。指标对齐了，评测才有意义，客户才认账。\n\n**评测集里，留一批硬骨头。**\n\n评测集里永远留一批始终不稳定的硬题。它们不是摆设，而是提醒：系统还有边界没有打通。这批题，恰恰是下一步优化的清单。别因为它们难看就删掉，它们指向的方向，正是你要前进的方向。\n\n**评测是一条持续改进的路。**\n\n评测不是一次考试，是持续运转的机制。随着业务、数据、用户的变化，评测集和指标也要跟着调。它像一把方向盘，照出系统的当前状态。用好它，交付质量就能持续改善，不断逼近客户真正想要的样子。评测越真实可信，交付的方向就越准。把这一套机制建起来，交付质量就有了稳定的尺子，托住每一次改进。数字有据，改进有据，交付自然越做越稳。评测，就是这套机制的坚实底座。"},{"h":"5.3 调优路径：Prompt、RAG、Workflow 与 Multi-Agent","body":"调优，是让系统从「能跑」走向「好用」的必经之路。很多助手上线后能答，但答得不够稳、不够准、不够快。这一节讲四条最常用的调优路径：Prompt、RAG、Workflow 与 Multi-Agent。它们管的是不同层的问题，弄清楚了，调优才能有的放矢。\n\n**先分清四条路径各管哪一段。**\n\nPrompt 管的是「怎么教」。同一个模型，指令写得清楚，回答可能天差地别。RAG 管的是「检索得准不准」。知识库检索不对，模型再会说话也是无米之炊。Workflow 管的是「步骤怎么走」。强流程的任务，靠它把顺序固定下来。Multi-Agent 管的是「角色怎么分工」。复杂的任务拆给不同角色，各管一摊。四条路径不是互相排斥，实际场景里常常要组合着用。\n\n**Prompt 调优，从把话说清楚开始。**\n\nPrompt 调优最容易上手，也最容易出效果。核心是把要做什么、要成什么格式、要守什么边界，一句句写明白。\n\n先看一个反面例子。某客服助手第一版指令只写「你是客服，回答客户问题」。模型答得飘忽，有时啰嗦，有时跑题。改后指令加了三点：只依据知识库回答，答不出就说明并引导人工，每条结论带上依据来源。同一个模型，回答立刻稳了。指令里多一句边界，系统就少一分失控。\n\n格式也要约定。要的是列表、是表格、还是一段文字，提前讲清，输出就整齐，下游解析也省事。\n\n再一个技巧是给示范。想让模型答得规范，就把标准答案的样子放进指令。一个两个范例，比干巴巴的要求管用。\n\n**Prompt 的几个常用套路。**\n\n第一个套路是角色设定。给模型一个清晰的角色和边界，比如「你是资深售后审核员，回答依据知识库」。角色一定位，回答的风格和分寸自然稳。第二个是明确任务。把要完成的事写清楚，别让模型猜。第三个是给约束。把禁区列出来，哪些不答、哪些引导人工，提前定界。第四个是约格式。列表、表格还是段落，写明，输出整齐。\n\n这些套路按需组合。答错多，先查约束；输出乱，先查格式；总跑题，先查角色和任务描述。\n\n**Prompt 优化，要用评测集验证。**\n\n改 Prompt 不能拍脑袋说变好了。改前记基线评分，改完再跑，对比升降。升了就保留，降了说明这次改坏了，回退。每次改都有数据支撑，优化才不靠运气。某团队每次改 Prompt 先记基线、改后再跑，准确率一步步上升，客户也认可。\n\n**RAG 调优，盯住检索这一环。**\n\n检索不对，后面的都是错。RAG 调优的重点在知识这一侧。\n\n第一步，查数据。数据里有没有噪音、有没有格式不统一，直接影响检索。某客户的知识库里新旧两版物料混着，模型总捡到旧版，清掉旧数据，答案立刻准了。\n\n第二步，看切分。切得太碎，上下文割裂，关键信息找不到；切得太粗，无关内容混进来。切分长度按文档形态反复试，条款类短切，长文类长切。\n\n第三步，看召回。命中的候选够不够相关，要不要做重排。某法务助手加了重排后，首条命中率明显上升，客户体感直接变好。\n\n**Workflow 调优，固定强流程的骨架。**\n\n有些任务有固定顺序，先问现象、再查原因、再给建议。用 Workflow 把顺序和字段固定下来，就不会乱。某售后排障助手，把「收集信息-判断原因-给出建议」固化成流程，每个环节只做一件事，流程稳定多了。\n\nWorkflow 调优的重点是字段设计。环节之间的传递字段要清晰、够用。有案例里，问诊环节传下来只是用户原话，检索环节拿去查，命中率惨淡。改成把关键字段提取出来再传，命中率明显上升。字段传得好，流程就顺。\n\n还要考虑异常分支。客户答非所问、信息不齐、中途跳出，都要有处理路径，不能卡死。给 Workflow 配上兜底分支，它才能又稳又灵活。\n\n**Multi-Agent 调优，把分工做清楚。**\n\n复杂任务，一个 Agent 扛不动，就拆给几个角色。谁负责检索，谁负责生成，谁负责把关，分工越清楚，整体越稳。Multi-Agent 调优重点有三。\n\n一是角色界定。每个 Agent 的职责边界要写明，别越界做别的事。二是交接质量。一个 Agent 传给下一个的信息，决定下一环的表现，这是多 Agent 里最影响整体效果的一环。三是决策机制。几个 Agent 意见不一致，由谁决定、怎么合成，要设计好。\n\n某传媒内容流水线，选题、撰写、审校三个 Agent 接力。调优时发现，撰写 Agent 拿到的选题提示不够具体，产出的文章常跑偏。把选题提示写细，整条流水线的质量都上来了。这印证了多 Agent 的质量瓶颈，往往在角色和交接信息，而不在每个 Agent 本身。\n\n**Multi-Agent 的代价，要算清楚。**\n\n多 Agent 强，但慢、贵、难维护。要不要用，先算账。简单问答没必要上多 Agent；复杂、多角色、强分工的任务，才值得。判断标准是收益是否大于成本，别为了「高级」而设计。\n\n**调优要按节奏来，别一上来全动。**\n\n四条路径不是一拥而上。建议先只调 Prompt，成本最低，见效最快。再考虑数据清理与 RAG，把检索提起来。再按需要动 Workflow 或 Multi-Agent。每一步改完，用评测集验证，稳定了再动下一步。一次只动一层，出了问题才说得清是哪层引起的。\n\n某团队接手一个平庸助手，先只调 Prompt，准确率升了一些；再清数据、调切分，命中率上来了；最后把流程固化成 Workflow，稳定性明显增强。一步步走，每步都有数据支撑，没一次瞎折腾。\n\n**一个反直觉的提醒。**\n\n别急着一步到位。调优是渐进的，每次改一点，跑评测，稳了再改下一点。一次动很多，出了问题对不上，反而更慢。慢就是快，是长期调优应有的节奏。四条路径用熟，配合评测与调试，系统的水平就能稳定提升，交付就越做越顺。\n\n从一次真实调优，看四条路径怎么配合。\n\n某排障助手初始表现不佳。团队一步步来：先改 Prompt，把回答口径定成「结论-建议-出处」三段，准确率提升；再清知识库，把重复、过时的故障数据清掉，命中率上来；接着把排障流程固化成 Workflow，字段传清晰，出错下降；最后加检索重排，首条命中率再上一档。每一步都用评测集验证。四条路径顺着问题逐步用，效果才真正看得见。\n\n调优要先记基线。\n\n每次调整前，把当前表现记成一个基线数字。有了基线，后续才有参照，才能判断这次改是变好还是变差。某项目为每个环节都设基线，每次改动都有据可查，客户对过程也更有信心。基线和评测是一套，缺一个都没有。\n\n调优要有全局视角。\n\n调优时容易只盯一个点，在一个指标上反复下功夫。但很多异常，其实是多个环节共同造成的。要在整个链路里整体看，别只看一根柱子。某处反复调不好，可能是别的环节拖累了它，而不是它本身的错。\n\n提示词和数据是连着的。\n\n有时既不是提示词的问题，也不是数据的问题，而是两者互相配合。数据干净但指令含糊，回答还是会飘；指令清楚但数据乱，同样不稳。调优要两者联动着看，必要时先补数据、再调指令，顺序对了才见效。\n\n调优要知道何时收手。\n\n每条路径都能一直往下调，但投入要对应产出。客户要的是「够用且稳」，不是无限精确。当某一路的收益开始小于投入，就该停下来，把精力转回业务本身。判断何时收手，和钻研怎么调，是同样重要的能力。\n\n数据驱动，是四条路径共同的底座。\n\n无论走哪条，都要以数据为准。调了什么、变化多少、和上次比怎样，用数据判断，不凭感觉。数据驱动是 Prompt、RAG、Workflow、Multi-Agent 的共同底座，也是调优不跑偏的根本保障。\n\n把经验沉淀成手册。\n\n调优的心得和方法，值得整理成手册。哪个提示词有效、哪种切分合适、哪类任务该用多智能体，都是团队的资产。有手册，新人上手快，老人不踩坑。调优靠沉淀，不靠记忆。\n\n调优的优先级，跟着客户的痛点走。\n\n不是把每条路径都调到极致，而是先解决客户最痛的几个点。先补短板、再抠细节。优先级对准客户，调优才有效，客户也才感受到进步。调优的落点，永远是客户用得顺不顺、好不好。\n\n借力相似案例，也是捷径。\n\n同类平台、同类业务，很多调优技巧能互相借鉴。遇到瓶颈，先看有没有类似的案例是怎么解的，借力往往比独自摸索快。会借力，调优的节奏就快一大截。孤军奋战不可取。\n\n调优的终点，是业务闭环。\n\n调优的每一步，都要能落到业务价值上。助手快了、准了，是不是真的让客户减了负、提了效？时时回到业务去看，调优才不会跑偏，系统才真正产生价值。\n\n调优方向，要拿数据来验证。\n\n同样一个问题，可能有好几种调法。别凭感觉押一条，要都试试、跑评测，让数字选方向。某团队凭感觉选了多智能体方案，跑了评测反而更差，换成拆流程才见效。调优方向多备几个候选，用评测数字取舍，而不是一上来就认定。数据会替你做判断。\n\n调优要警惕过度复杂。\n\n有的团队越调越复杂，功能越加越多，但效果没同步变好，维护成本却成倍上涨。真正成熟的做法，是在达到目标的前提下，尽量保持简单。能一句话说明白的，不写三页；能一个角色做完的，不拆两个。把「化繁为简」当作调优的一条准则。\n\n调优路径，要「化整为零」。\n\n大问题不要硬扛，拆成小块逐块调、逐块验。每块都可定位、可回退，出了问题也说得清是哪块。整体整体地调，出了问题难追。逐块收敛，是调优里既稳又快的办法。\n\n一次调优，要留一次小结。\n\n每次调完，把积累的经验、留下的坑、下一步的方向写成一则小结。下次迭代翻开就有。调优不是孤立的动作，而是一条不断延伸的线。小结攒得越多，后面的调越有底气。\n\n真正的调优高手，是能同时管好效果和成本的人。让系统好用，又不失稳，才是调优的最终标准。\n\n把握住这几个要点，调优就不再是碰运气，而是一套稳定可靠的方法。\n\n稳定，是调优真正的价值所在。"},{"h":"5.4 上线运营与版本迭代","body":"上线不是终点，而是运营和迭代的起点。很多项目交付完就撒手，以为上线就结束了。实际上，智能体交付后进入运营，才是它真正成长的阶段。这一节讲上线前怎么做准备、上线后怎么监控、怎么按版本迭代。上线是持续优化的开场，而不是句号。\n\n**上线前，先把灰度和准备做足。**\n\n直接一刀切全部上线，风险很大。稳妥的做法是灰度：先小范围用起来，比如先给一部分门店、一部分用户用，观察表现、收集反馈，再逐步放量。灰度能让你在问题造成大影响之前及时发现。\n\n上线前还要做足准备。评测集过一遍，确认整体达标。留出回滚手段，一旦出问题能快速退回旧版本。应急预案要有，比如异常时能不能临时关闭某功能。准备好了再上线，比仓促上阵稳妥得多。\n\n**灰度期间，重点盯三类信号。**\n\n第一是功能是否正常，能不能答对、流程通不通。第二是有没有异常表现，幻觉、乱答、越权。第三是用户是不是愿意用，使用率有没有上来。三类信号正常，才考虑扩大范围。\n\n某订单助手灰度两周，发现部分订单查不到，原来权限没放开。修好再放量，稳定。灰度这个步骤，把真实环境的坑挡住了，避免上线翻车。\n\n**上线之后，运营监控要常开。**\n\n上线不等于完事，之后要持续监控。核心指标就几个：使用量是多少，准确率怎么样，响应快不快，转人工率高不高，有没有新增异常反馈。监控不是摆设，要在异常第一时间拉响。哪个指标跌了，就对应去查、去修，别让问题积压。\n\n**用户反馈，是运营里最值钱的信息。**\n\n运营不能只看系统数据，用户的真实声音更重要。用户说「答得不准」「总是让我重问」，这些都是第一手的调优线索。把反馈收上来、分类、归档，转成改进点。有了真实用户的声音，迭代才有方向，不会闭门造车。\n\n某客服助手上线后，用户反馈集中在「回答太长了」，团队把输出改短、改要点，体验明显提升。一条看似普通的反馈，就是迭代的最大切入点。\n\n**版本迭代，要让变化可控。**\n\n智能体改完功能，都要走版本迭代。版本号要清晰，改动要有记录，上线前要评测、灰度，随时能回滚。不要悄悄改。每一次升级，都对应一个可追踪的版本，改动是什么、为什么改、谁改的，写清楚。这样出了问题，能定位是哪个版本引入的。\n\n**用 A/B 验证，比拍脑袋稳。**\n\n要不要改某个方案，别靠感觉。做一个简单的 A/B 测试：把用户分成两组，一组旧版，一组新版，对比哪个指标好。数据说了算。某团队改了一版 Prompt，看着顺眼，一 A/B 测试指标反而差。没有 A/B，就按感觉上线，可能会退步。\n\n**运营的数据，要回流到评测与调优。**\n\n运营中积累的使用数据、真实问答、用户反馈，是后续调优的养料。把这些转进评测集，转成调优方向，让系统随着数据越用越准。这就是「数据飞轮」：用的人越多，收集的数据越多，系统调得越好，越好用、人越多。版本迭代，就是顺着飞轮不断把系统推得更好。\n\n**运营指标，要按角色分不同的人看。**\n\n不同角色关心的点不一样。老板看转化、看减负、看降本。产品看体验、看准确、看满意。运维看稳定、看报错、看时延。同一个系统，不同人提炼重点各不相同。指标落到各自的关注点，运营的价值才被看见，也才有人愿意持续投入。\n\n**数据，从第一天就要开始积累。**\n\n很多人等系统成熟了才收集数据，其实晚了。上线第一天起，就要把问答记录、用户反馈、异常案例留好。数据攒得多，评测集就丰富，调优就有底气。数据是越用越值钱的资产，越早开始，后期的地基越牢。\n\n**版本管理，要有一套成熟的规矩。**\n\n版本号怎么编、改动谁负责、上线走什么流程、出问题怎么回滚，都要提前定。大事必走全流程。每次版本上线前，评测、灰度、回归走一遍，能一键回退。规矩稳了，频繁迭代才不会乱套。\n\n**迭代优先级，按价值来排。**\n\n需求很多，不能全改。按价值与成本排：收益大、代价小的先做；收益小、代价大的往后排。别被最吵的需求牵着走。优先级排清楚，迭代才花在刀刃上，而不是东一锤西一棒。\n\n**灰度要有节奏，别急着放量。**\n\n灰度不是「小放再大放」一句话，要有明确的阶段。先内部小团队试功能，再给一两家典型用户试真实场景，确认稳定后再逐步全量。每个阶段设一个数据门槛，达标才进下一步。稳着走，质量才保得住。\n\n**上线之后，记得复盘。**\n\n无论顺利还是波折，每次上线都做一次复盘。哪里好、哪里出问题、下一步怎么补。复盘沉淀下来，下一次就少踩坑。复盘不是走过场，是迭代提速最快的工具。\n\n**长期运营，靠沉淀不靠人。**\n\n把方法、文档、记录沉淀下来，运营就不依赖某一个具体的人。团队有人变动，方法还在，流程不断。文档化的运营体系，才是可持续的运营，不会因为人来人往而断裂。\n\n**运营的终点，是让系统长在业务里。**\n\n运营到深处，系统会慢慢懂业务、被业务依赖，使用的人越来越多。它从「一个工具」长成「业务的一部分」。数据和业务互相喂，系统越来越准，业务越来越顺。到这一步，运营和业务就成了一件事。\n\n**把监控变成每天的习惯。**\n\n监控别等出了事才看。固定一个节奏，每天或每周过一遍关键指标，异常早发现，处理成本就低。监控成了日常，风险就被挡在前面。上线之后始终有眼睛盯着，运营才不会脱缰。\n\n运营要建问题台账。\n\n把线上的反馈、异常、投诉统一记进台账，标清现象、状态、处理人。台账一清，问题就不会丢、不烂尾、好交接。某客户用台账管理线上问题，每周清理一轮，解决得快又稳，口碑明显提升。\n\n监控要配好预警。\n\n运营不只是记录，还要会预警。核心指标跌到阈值，系统自动提醒，让问题在扩大前被发现。别等客户投诉了才处理，预警提前介入，把被动变主动，运营的掌控感就出来了。\n\n运营数据要防失真。\n\n看运营指标要谨慎。有时数字好看，是统计口径取巧；有时数字难看，也是口径问题。指标要有清晰统一的口径，别自我安慰，也别误判。用真实口径去运营，结论才靠得住。\n\n迭代要守住质量底线。\n\n节奏可以快，质量不能松。核心改动，评测、灰度、回归一步都不能少。快是节奏，稳是底线，不能为了速度牺牲质量，不然迟早要还债。这个底线，无论迭代多频繁都要守住。\n\n运营看板，让状态人人可见。\n\n把核心指标、灰度进度、处理状态放在一个看板上，人人都能一眼看到。看板透明，对齐就快。哪个环节滞后，一眼点出来。看板是运营沟通的抓手，让运营从「几个关键人懂」变成「全员都懂」。\n\n运营的真价值，在客户成功。\n\n运营做得好不好，不只看系统稳不稳，更看客户有没有把事办成。盯住客户的核心目标有没有达成，而不只是服务跑得顺不顺。以客户成功为中心，运营才做进了客户的心里。\n\n复盘要落成动作。\n\n每次复盘都要有产出，把改进项落到责任人、落到时间。开完会没有后续，等于没开。复盘列成清单，项有着落，才算有效。复盘的价值在行动，不在形式。\n\n指标要少而准。\n\n指标不要贪多，挑最要紧的三五个盯紧，重点就清楚。太多太散反而看不清。指标「少而准」，才能真正反映系统状态，运营才不至于淹没在数字里。\n\n运营要有固定周期。\n\n运营总结要有固定节奏，每周小结、每月复盘。周期固定，数据才能纵向比较、看清趋势。小问题及早发现，大问题不积压。运营的持续，靠的是规律而不是心血。\n\n长期运营，靠制度。\n\n运营不能只靠热情，要靠制度。谁监控、谁评审、异常怎么升级、谁能决定，都要明确。制度清了，运营才不会因为人员变动、情绪起伏而波动。真正稳定的运营，是由制度托着的。\n\n回滚，也要准备。\n\n每次上线前都要备好回滚方案，一旦异常能一键退回。回滚不用到最好，但必须随时能用。紧急的时候能退，就多一层安全。回滚演练，是运营安心的底气。\n\n多听客户的感受。\n\n一线最了解客户，多听一线同事的反馈，往往比看报表更快。客户没说出口的痛点，常在细节里。多听多记，运营才能贴着真实的需求走。\n\n运营的尽头，是系统和客户一起长大。\n\n系统越来越懂业务，客户越来越离不开系统。数据互相喂，价值慢慢沉淀。当系统长成客户业务的一部分，运营就从维护变成了经营，交付也就成了长久的伙伴。\n\n运营日志要好好保存。\n\n运营期会产生大量记录：问答、反馈、异常、灰度表现。这些日志要统一存好，它们是分析依据，也是改进的证据。别等到要用了才想起没存。数据存得全，运营的分析才扎实，迭代才有依据。\n\n运营要有明确的主责。\n\n运营涉及多方，每条线都要有清楚的负责人，谁对接、谁回复、谁担责。职责清楚了，流程才不会空转。最怕互相推诿。把责任落到具体的人，运营才不会打滑。\n\n运营要定期回顾。\n\n给自己定一个回顾周期，比如每月一次，对进度、问题、方法做一次盘点。定期复盘，能及时纠偏，也沉淀方法论。运营走得越久，越要保持回顾的节奏，别让它慢慢偏了方向。\n\n让客户参与到运营中来。\n\n运营不是单方面的事。多邀请客户参与，看进展、提建议、一起体验新版本。客户参与得越深，方案越贴客户，问题也越早被理解。把客户从「被服务」变成「共同运营」，运营的深度和韧性都会不一样。\n\n把这些做到位，运营就真正落进了客户的价值里，交付也不只是一次性的履约，而成了长期的伙伴。"}]},{"domain":6,"name":"安全合规与责任 AI","weight":"10%","practice":[],"sections":[{"h":"6.1 数据权限与隐私保护","body":"数据，是智能体的燃料，也是最需要小心对待的部分。客户把数据放进系统，是把信任交给了你。一旦数据被泄露、被误用、被越权访问，这份信任会立刻崩掉，而且再难弥补。所以数据权限与隐私保护，是整套系统安全的第一道闸门。这一节讲清楚，怎么把数据管好、把权限分好、把隐私守住。\n\n**先给数据分个敏感级。**\n\n不同的数据，敏感程度差得很远。身份证号、手机号、健康信息、银行卡号，属于高度敏感；订单编号、公开价格，属于一般数据。落地第一步，就是给数据贴标签、分等级。敏感等级高的，保护措施要做足；等级低的，相对宽松。分级不清，保护就没法对症下药。\n\n**权限第一原则，是最小够用。**\n\n很多管理者有个误区，觉得权限给得越多越方便。恰恰相反，权限越大，风险越大。正确的原则是最小够用：每个角色，只拿到完成自己工作所必需的最少数据。业务员能看自己名下的客户，就不给全局清单；运营要统计，就给聚合后的数据，而不是原始的明细。最小够用，把风险面压到最小，真出问题也只在很小的范围内。\n\n**用角色和范围双重上锁。**\n\n单靠「谁能进系统」还不够，还要管「能看哪些数据」。角色决定能操作什么，范围决定能接触哪些数据。两者叠加，才锁得住。某客户的设计是这样：销售角色只能看自己名下客户的订单，主管角色能看整个团队的范围，跨部门的客户数据默认不可见。权限既不多给，也不漏给，处处有边界。\n\n**敏感数据，单独加密。**\n\n高度敏感的信息，不能明文存放，要单独加密。哪怕系统某个环节被攻破，看到的是密文，也不容易解读。客户证件号、联系方式、健康数据，一律加密存储，只在必要的流程里解密，其余场景全程只认脱敏后的样子。加密，是敏感数据最后的物理防线。\n\n**脱敏，从源头减少暴露。**\n\n很多时候，并不需要看到完整的原始数据，一个脱敏版本就够用。手机号中间几位打码，姓名只保留姓氏，证件号只留尾号。能脱就脱，能模糊就模糊，从源头减少敏感数据的流通。某项目的一个评测系统，把患者姓名统一处理成「客户」两个汉字，既保护了隐私，又不影响评测效果。\n\n**数据采集，坚持最小化。**\n\n不属于业务必要的数据，就不要去采集。客户不需要提供的信息，系统就不该要求；用户用不上的字段，就不该入库。数据收集得越少，暴露的面越小，合规负担也越轻。某商城助手只采集下单所必需的字段，多余的勾选项一律不设，又省资源又安全。\n\n**访问要留痕，出问题能追溯。**\n\n数据访问必须留痕：谁、在什么时间、读取了哪一块数据，都要有记录。一旦出现安全事件，能顺着时间线定位到人和操作。留痕，既是一种威慑，更是一份查证。某系统的数据访问日志，在发生异常时能够完整还原数据流动的链条，很快锁定是哪一次操作、哪个环节出的问题。\n\n**高风险操作，必须走审批。**\n\n批量导出、批量删除、跨部门访问、权限变更，这些动作风险高，不能一个人说了算。要设审批流程，关键节点必须有人确认。某客户的数据导出功能，要求业务负责人加安全负责人双重审批，从流程上杜绝了随意拷贝、转发的漏洞。审批多一道，风险就低一分。\n\n**隐私，要在设计阶段就考虑。**\n\n隐私保护不该是上线前临时加的功能，而是产品设计一开始就要想到的事。哪些数据必要、谁能看见、默认是否隐藏、能不能选择退出，这些在设计阶段就要定下来。前置做隐私，成本低、漏洞少；事后补救，又慢又容易漏。\n\n**数据授权，要及时回收。**\n\n数据授权不是一次给完就永远有效。员工离职、岗位调整、项目结束，相应的授权要立即收回。不回收的授权，就是隐藏在系统里的风险口。要定期做一次权限对账，看看还有谁握着不该有的权限，该收就收，别让「有权限的人」比「应该看的人」还要多。\n\n**第三方接触，要有协议兜底。**\n\n只要数据涉及到第三方，不管是外包服务、合作系统还是技术供应商，都要签订数据保护协议，明确他们能看什么、不能碰什么、用完怎么销毁。外部数据接口往往是数据出口最容易被钻的空子。有了协议和明确的责任人，这个口子才堵得住。\n\n**权限默认是「拒绝」。**\n\n新开的权限，建议默认先拒绝，需要时再逐个放行。宁可少给后补，不要一次性放一大堆再收紧。默认拒绝的好处是：每一份权限都有明确的理由和审批记录，而不是默认全开、之后出问题才追。权限是长出来的，不是放出来的。\n\n**员工意识，是安全的第一道墙。**\n\n系统再安全，如果人不够谨慎，也会出大纰漏。要培养员工的基本安全意识：不点陌生链接、不随便分享数据、下班锁屏、开会避免屏幕信息外露。人在安全面前是最难的一环，也是最关键的一环。全员有意识，制度才真正落地。\n\n**数据安全，是持续的过程。**\n\n数据、权限、业务、员工，都在不停变化。安全不能是一锤子买卖，要持续评估：权限是否还合理，数据是否还必要，接口是否有新的风险。定期做安全审计、权限复核、风险盘点，发现问题立刻整改。安全是一条动态变化的线，不是一道设好就不动的门。\n\n**出了问题，要有应急方案。**\n\n没有谁能够百分之百杜绝事故，但要准备好应对方案。一旦发生数据问题，要能快速隔离影响、保留证据、通知相关方、及时补救。应急方案平时备着，出事后才不至于手忙脚乱。预案的存在，是安全体系里最容易被忽略却又最关键的一环。\n\n**守住合规这个底线。**\n\n涉及个人信息的处理，要符合国家相关法律法规的要求。处理个人数据要获得授权，使用要限于合法目的，保障用户的知情权。合规不是额外的负担，而是保护客户、也保护自己的底线。底线守住了，长线才能走得稳。很多项目的信任基础，恰恰是「数据安全做得好」这一点建立起来的。\n\n**把隐私当成长期承诺。**\n\n数据安全与隐私保护，不是一次改造能完成的。它需要一套制度、一群人、持续去维护。分级、最小化、加密、脱敏、留痕、审批、审计、应急，把这些能力拧成一套系统，数据才能被真正守好。把隐私当成长期承诺来做，客户才敢把最要紧的数据托付给你，那才是交付里最硬的安全凭证。\n\n**动手前，先画一张数据地图。**\n\n做权限设计，第一步不是急着设权限，而是把数据摸清楚：系统里有哪些数据，存在哪里，谁在负责。把数据、字段、负责人画成一张地图。有了地图，权限才有依据，问题也能快速定位。很多团队权限乱，根子是数据本来就没摸清。\n\n**不同数据，用不同强度的保护。**\n\n分级之后，保护力度要跟着走。最高等级的数据，加密加隔离加审批；一般数据，保持基本访问控制即可。保护的强度，要和数据的敏感程度匹配。既不漏掉重点，也不过度设计，把有限的资源用在刀刃上。\n\n**用真实场景，验一遍权限。**\n\n权限设计完，要拿真实角色走一遍。扮演业务员、主管、管理员，逐一确认他们能不能做该做的、能不能碰不该碰的。实际演练最能暴露漏洞。某团队在上线前模拟了十几种角色场景，提前发现了三处权限越界，及时修掉，避免上线后翻车。\n\n**用户的同意，要看得见。**\n\n涉及个人信息的采集，要让用户看得见、有选择。用大白话告诉用户：收集了什么、用来干什么、要不要给。别藏着掖着，也别默认全要。用户知情同意，是隐私保护最基本也是最重要的一步。\n\n**数据出境，要格外谨慎。**\n\n个人数据如果涉及跨境传输，要严格走国家规定的评估和程序。能不出境就不出境，能在本地处理的就留在本地。跨境这条线政策更严，碰之前先确认清楚，别心存侥幸。\n\n**删除数据，要删得彻底。**\n\n删除不是点一下按钮就完事。备份、缓存、临时副本里都可能残留。要连同各处副本一起清干净。真正敏感的删除，要确认彻底清除、无法恢复。删了还能翻出来，等于没删。\n\n**定期做一次安全演练。**\n\n安全问题不能靠运气。定期模拟一次数据泄露或越权，检验应急流程。看响应快不快、配合顺不顺。演练暴露的问题趁早修。有备无患，安防能力才不是摆设。\n\n**把安全写进交付确认清单。**\n\n数据安全不是交付之外的附加项，而是交付核对的一部分。交付时逐项核对：权限、加密、脱敏、合规、留痕都过关，才算是完整交付。把安全放进核对环节，团队有责任感，客户也更放心。安全做到位，交付才算真正完整。\n\n**重要改动，要有独立复核。**\n\n风险高、牵扯大的改动，最好安排一个独立的人复核。设权限的人和审查权限的人分开，才能看出各自视角都看不到的盲区。一个人经手的环节越少，疏漏的可能就越低。安全多一道复核，比出事后再补救省心得多。\n\n**把安全经验，沉淀成文档。**\n\n踩过的坑、总结的做法，都整理成一份安全规范，供团队共用。新人照着做，老人有依据。安全经验只有散落在个人脑子里，一旦人走了经验就断了。沉淀成文档，才能长期复用。\n\n**安全最终要靠制度兜底。**\n\n单靠个人自觉远远不够。把各项安全责任固化成制度：谁负责、什么标准、怎么检查，写清楚。制度兜底，安全才稳定可预期，不会因为换人、调整而松懈。制度立住了，安全才有长期保障。\n\n**安全和专业，要一起练。**\n\n光有安全意识，没有专业方法，也守不住风险；只有专业技巧，没有安全观念，照样会出漏洞。两者缺一不可。既知道什么是对的，也学会怎么把对的做到位。把安全和专业结合好，数据才能真正被守好。\n\n**把安全当作长期的投资。**\n\n安全不是一次性改造，而是一项需要持续投入的长期工程。今天投入多一点，明天的事故就少一点。守住数据，就是守住信任，也就是守住交付的长期价值。别把它看成成本，而要把它看成最值得的长期投资。"},{"h":"6.2 内容安全与越权访问防控","body":"智能体在真实环境里运转，一定会遇到两类问题：一类是内容可能出格，一类是访问可能越权。前者是内容安不安全，后者是权限控不控得住。这两件事是一体两面，都是在给智能体的行为画边界。这一节把内容安全和越权防护一起讲透。\n\n**先说内容安全是什么。**\n\n内容安全，就是保证智能体的输出不危害用户、不违背法律法规、不传播不良信息。生成式模型能回答很多，但有些内容不该碰。为了合规、为了安全、为了尽到责任，系统要给内容设边界。边界清楚，才不会出大错。\n\n**内容的越界，主要来自几个方向。**\n\n一是模型本身可能生成不受欢迎或不当的内容。二是用户输入里，可能藏着攻击性的引导。三是知识库或外部资料里，可能混进违规内容被引用。四是某些领域本身就不该随意生成，比如医疗诊断、金融断言、司法意见。这几个来源都摸清楚，防护才有的放矢。\n\n**第一道防线，是把红线清单定义出来。**\n\n和业务一起，把「绝不能生成什么」写清楚。哪些内容绝对禁止，哪些需要引导转人工，哪些严格限定。红线越明确，边界越清晰。把这套清单贯彻到系统设计里，模型就不会去碰越线的内容。\n\n**内容过滤，要从输入和输出两端一起抓。**\n\n安全不只管输出，输入也要防。用户输入可能带攻击性、带违规内容，先拦下来。模型生成之后，输出也要过一遍过滤，防止跑偏。两头都设卡，安全才有保障。某客服系统在输入和输出两侧都放了拦截，违规内容两端都被挡下。\n\n**给生成加一道安全闸。**\n\n模型生成之后，用规则或校验模型对输出做一道快速审查：是否敏感、有没有越界、需不需要转人工。有问题的拦下来，交给人处理。这道闸，是内容安全里最常用也最实用的一招。\n\n**敏感词要拦，敏感意图也要拦。**\n\n光匹配敏感词不够，还要判断敏感意图。有些人绕开敏感词，用隐晦的话达到同样目的。单靠关键词抓不到。要同时抓词和意图，才能真正防住绕行的内容。\n\n**上下文隔离，防越权套数据。**\n\n越权最常见的一种，就是用户通过提问，套出不属于自己的数据。比如普通用户问「能不能把客户经理那批合同给我」，系统要能识别出这属于超范围，拒绝并引导。让每个用户，只能看自己范围内的内容。一句话就想套走别人数据的，系统不能上当。\n\n**高风险操作，不能一句话就执行。**\n\n导出、批量操作、权限变更，这类动作不能因为用户说了一句就照办。要有多步确认，甚至审批。把「一句话执行」改成「多步确认」，能挡住很多被误导的请求。\n\n**要防提示注入。**\n\n有一种攻击叫注入：用户故意在提问里塞话，想命令系统忽略设定、执行不该做的事。系统要能识别注入，守住自己设定的边界，不被用户的指令带着跑偏。\n\n**权限要在关键动作前实时校验。**\n\n不是登录时验一次就完了，而是每到一个关键动作，重新判断当前身份和权限是否够。要导出就确认导出权限，要访问就确认访问范围。随时校验，越权才不会被动态漏过去。\n\n**角色和场景，一起决定权限。**\n\n判断权限，不光看「是谁」，还要看「在什么场景」。同样是这个人，经办和在导出场景，权限要求不同。把角色和场景都纳入，权限才精准。比如某系统里，即便管理员，也不允许在公开接口批量导出客户明细。\n\n**越权要能测。**\n\n防护做得好不好，靠测。用不同身份、各种提问去试，看能不能越权。把越权用例做成测试集，反复跑。越权是动态守的，要靠持续测试才能站得住。一测就露，一测就补。\n\n**审计，是越权防护的证。**\n\n每一次访问、每一次被拒的请求，都要记录。被挡下的攻击，是最好的线索。从日志里，能看到新的越权路径，也能找到防护的薄弱点。日志让越权防护有据可查，持续演进。\n\n**边界之内，温和引导。**\n\n安全不等于硬邦邦。用户问到不能答的，友好地告诉他：是权限限制，还是建议转人工。委婉引导，用户也舒服，体验也不受损。安全和体验，可以兼得，就看怎么拿捏。\n\n**内容要分级管理。**\n\n生成内容也分等级。普通的直接放行，敏感一点的加限定，高危的一律不生成、转人工。分级的力度管理，既守得住边界，又不过度干涉。某系统把问答分成三级，普通直接答，涉法引导、涉医拒答，边界清楚又高效。\n\n**对特定群体，格外保护。**\n\n涉及儿童、未成年人的内容，过滤标准要更严。不该出现有害、不当的内容。越是需要保护的受众，越要在安全上加强。这是责任，也是底线。\n\n**第三方的内容，也要把关。**\n\n智能体常会参考第三方知识库、外部工具。第三方回传的内容，也要纳入过滤。别让外部数据绕过内部防线。所有进入系统的内容一视同仁，都要过安全关。\n\n**安全防线，要定期更新。**\n\n新的敏感点、新的攻击手法，不断冒出来。过滤规则、防护边界，要跟着更新。别让安全停留在上线那一天，要让它持续生长，跟上变化。\n\n**盯着生成内容，常态化抽查。**\n\n上线之后，持续监控输出。定期抽查生成的回答，看有没有漏网内容。发现异常立即处理。安全不是上线那一锤，而是每天盯着的一根线。\n\n**风险等级，决定安全力度。**\n\n安全边界紧不紧，要看风险的等级。万一错了，代价高不高。高风险场景必须严，低风险可以松一点。力度跟着代价走，该严的严、该松的松，安全才不至于用力过猛或过分宽松。\n\n**把安全当作长期工程。**\n\n内容安全和越权防护，都不是一次完成的动作，而是一套持续运转的机制。画红线、两头过滤、防止注入、上下文隔离、实时校验、持续审计、定期更新，把这些环节拧成体系，智能体才能既好用又安全。守得住边界，才敢让系统真正放开用。\n\n**用案例库，给内容安全打样。**\n\n把真实出现过的、被判定为有问题的内容，收集成一个案例库。过滤或模型遇到相似情况，就有参照。案例库越丰富，判断越准确，处理口径也越一致。案例库是内容安全里容易被忽略、却极有用的资产。\n\n**越权防护，要和业务规则呼应。**\n\n越权判断，不只靠「谁能不能看」这种通用规则，还要贴合具体业务的规则。比如某业务规定外部人员默认不能进，只有内部项目组可见。把这些业务规则纳入判断，越权防护才真正落地、贴合实际使用。\n\n**敏感信息，静态动态一起管。**\n\n有些敏感点固定不变，比如敏感词；有些则动态变化，比如限时权限、临时开放的数据。静态的用词库和规则拦，动态的用实时校验判。静态和动态结合，覆盖才完整。\n\n**异常的输入，也要警觉。**\n\n超长的提问、堆满特殊符号、频繁地变换操作，这些都可能是异常信号。系统要能识别这些模式，做出相应响应，比如降级、转人工或加强验证。把异常纳入判断，安全防线就更严。\n\n**安全别误伤了正常体验。**\n\n过滤太严，会把正常对话也拦下来，用户平白无故被中断。要在安全和体验之间找平衡。对正常内容尽量放行，只对确认有风险的内容拦截。宁可留一些拿不准的交给人判断，也不可误伤太多正常使用。\n\n**出了安全事件，响应要快。**\n\n一旦发生内容或越权事件，反应速度很关键。第一时间隔离影响、保存证据、及时处理，把损失压在最小。响应快，说明体系成熟；拖得久，影响就会扩大。响应速度，是安全能力的直接体现。\n\n**安全边界，要定期回顾。**\n\n边界设完之后，隔一段时间就要回头看：还合不合理，是不是过严或过松了。边界要跟业务和风险一起变化。定期回顾，安全边界才不会僵化，也不会越来越失真。\n\n**把安全嵌进系统，而不是外加。**\n\n安全不该是一个额外的模块，而应该嵌入系统运行的每一步。每一条交互，安全判断就在其中。把安全做成系统的内生能力，而不是外围的补丁，防护才真正无处不在。\n\n**用系统的人，也要懂安全。**\n\n不只是系统本身安全，使用者也要有安全观。哪些操作有风险、哪些数据不能外发，要让使用者都了解。人懂安全，系统和人的配合才形成闭环，最后一公里才守得住。\n\n**越权防护，靠设计和持续两手。**\n\n没有一劳永逸的越权防护。好的设计给出骨架，持续的审计、更新、复验才能不断加固。设计和持续优化缺一不可。做好这两手，越权漏洞才会被越压越少。\n\n**安全，是系统放胆使用的护栏。**\n\n不要觉得安全是束手束脚。恰恰相反，正是有了可靠的安全防护，系统才敢放开服务业务，客户才敢深度使用。安全是让人放心的护栏，而不是关人的笼子。守住它，智能体才能真正跑得远、用得安心。\n\n**把安全责任，刻进每个环节。**\n\n从设计到开发，从交付到运营，安全责任贯穿始终。每一个环节都把安全放在心上，产品才真正让人放心。把责任落到流程里，安全就不是口号，而是切切实实的兜底。\n\n安全设计，要经得起别人挑刺。设计方案出来，主动请人一起找漏洞，看哪里能被钻空子。被挑出来的，往往正是没堵上的洞。主动找刺，比上线后被攻击再补救，划算得多。\n\n安全，是客户信任的隐形前提。客户敢不敢把系统交出去，先看它安不安全。内容安全、越权防护做得扎实，信任就立得住。守住安全，交付才算真正守住根基。\n\n把边界守住，把信任守住，系统才能走得更远、更久。\n\n安全防线越牢，系统走得越远。把每个环节都做实，安全就不再是某个模块，而是整个系统最可靠的底色。"},{"h":"6.3 模型幻觉治理","body":"生成式模型有个天生的毛病，叫幻觉。它会在回答里，一本正经地讲出不存在的事、编造不存在的出处、给出错误的数字。对聊天来说，幻觉可能只是尴尬；对交付的业务系统来说，幻觉可能是事故。这一节讲清楚幻觉从哪来、怎么防、怎么治。\n\n**先认清幻觉是什么。**\n\n幻觉，就是模型生成了「看起来合理、实则错误或编造」的内容。它可能混淆了事实，可能张冠李戴，也可能纯粹是编的。更麻烦的是，模型说出这些内容时语气坚定，用户很难分辨真假。幻觉是生成式智能体要长期面对的核心风险之一。\n\n**幻觉从哪来？三个源头要看清。**\n\n一是训练本身的限制。模型的训练数据有截止、有缺失，它不知道新情况，就会用自己的方式补。二是推理的局限。模型在生成时依据的是概率，不是精确查证，输出可能与事实不一致。三是上下文或知识的误导。知识库给了错误信息，或检索到的内容本身有误，模型就照着错走。看清源头，治理才能对症。\n\n**先把幻觉的风险定级。**\n\n不是所有幻觉都同样危险。闲聊里的细节错误，影响小；业务数字错误、医疗建议错误，影响大。先把系统涉及的幻觉风险分个等级，高风险场景重点治理，低风险场景适度处理。风险分级，治理才不会眉毛胡子一把抓。\n\n**治理第一步，是让答案有出处。**\n\n最有效的防幻觉手段之一，是让模型「讲理有据」。要求回答带上出处，比如引用知识库的哪份文档、哪一段。有出处的回答，客户能核对，错误也能追溯。某行业问答系统，规定每条结论必须标注出处，查不到出处的宁可不说。这一条，就把大部分幻觉压了下去。\n\n**检索不到的，就明确拒答。**\n\n模型最忌讳不懂装懂。检索不到相关内容，就老老实实说「这个我答不了」，并引导到人工或给出替代方案。把「不知道就拒答」立成规则，幻觉就没有出口。敢于说不，反而是最安全的选择。\n\n**在答之前，先确认范围。**\n\n很多幻觉，是因为模型在并不确定的领域里硬答。可以在流程里加一道「范围判断」：问题是不是知识库覆盖的领域，是就答，不是就拒。先判范围再回答，能拦住大量跑偏。\n\n**用置信度做兜底。**\n\n模型对回答的把握程度，可以作为一个信号。对把握很低的回答，系统可以降级处理：不打保票、加提示、或转人工。让系统知道自己的不确定，是防止「假装自信」的有效手段。\n\n**输出侧，加一道「幻觉审查」。**\n\n回答生成后，还可以过一道审查：检查回答是否和引用的原文一致，有没有多出来的、没有依据的话。审查不过的就返工或拒发。这道后置检查，能把不少漏网的幻觉拦截在发出之前。\n\n**知识库里少放坏数据。**\n\n幻觉的另一半源头在数据。知识库里的错误、过时、冲突信息，会被模型引用出来，产生「看起来有出处、其实是错的」的回答。定期清理知识库，保证数据质量，幻觉自然就少了。数据干净，是防幻觉的根本。\n\n**低温度，不代表没幻觉。**\n\n有人以为把参数调低，幻觉就没有了。其实低温度只能让输出更稳定，减少自由发挥，并不能消除事实错误。幻觉治理要靠机制：引用、检索、校验、拒答，而不是单靠一个参数。\n\n**评测集里，要放幻觉题。**\n\n防幻觉做得好不好，要测。在评测集里专门放一类「幻觉测试题」：无中生有的问题、需要精确数字的问题、容易编造的问题。跑一遍，看幻觉率高不高。把幻觉率当成一个独立的指标来跟踪，才能知道治理有没有效。\n\n**上线前，做一次幻觉专项体检。**\n\n上线之前，用幻觉测试集把系统全面测一遍。把高风险的几类问题重点扫，确认幻觉率在可接受范围。专项体检，能发现平时看不到的隐患。体检不过，就不能贸然上线。\n\n**对高风险回答，直接设限。**\n\n涉及人身安全、财产安全、法律后果的高风险回答，直接设限制：模型不给断言，只给提示或转人工。宁可保守，也不能让模型在关键处乱说。风险越大，边界越要收得紧。\n\n**记录幻觉案例，持续改进。**\n\n每一个被发现的幻觉，都值得记录下来：什么问题、答了什么、错在哪、怎么改。案例攒起来，就成了防幻觉的知识库。用案例持续训练和调优，幻觉会越来越少。改进是积累的，不是一次完成的。\n\n**人工兜底，永远要留。**\n\n即使治理得再严，仍可能出现漏网的幻觉。所以高风险的场景，要保留人工审核的兜底。重要的回答、可疑的回答，走一遍人工确认再发出。人工兜底，是幻觉治理的最终防线。\n\n**把「不知道」做成一种体面的能力。**\n\n对客户来说，答不上来不可怕，可怕的是答错了。教会系统体面地「不知道」，是一种重要的能力。引导客户换一种问法，或者推荐更合适的人。这既保护了客户，也保护了系统。\n\n**幻觉治理没有终点，只能持续。**\n\n模型在升级、知识在更新、场景在扩大，新的幻觉随时可能出现。幻觉治理不是上线前的一次性动作，而是持续的、反复的工程。定期评估、持续优化，让幻觉率保持在可控水平，系统才能长期可靠地运行。守得住可信，智能体才真正经得起业务考验。\n\n从提问这一端，也能防幻觉。\n\n很多幻觉来自问题太模糊、太开放。引导用户把问题问具体，比如先选场景、再填关键信息，模型答得会更稳。在交互设计上做文章，等于在源头拦住了不少幻觉。\n\n多轮对话里，幻觉更容易滚雪球。\n\n对话长了，上下文里的偏差会越滚越大。前一轮答偏，后一轮会顺着偏继续。所以每一轮都要做引用校验，别让错误在对话里蔓延。对话越长，越要盯着别跑偏。\n\n知识库要跟上业务更新。\n\n业务在变、资料在换，知识库也要同步刷新。旧知识没更新，模型按旧信息答，也会被当成幻觉。保持知识更新，是防幻觉的隐性动作。定期刷新一次，就少一批旧数据引发的错答。\n\n单靠模型，不如靠机制。\n\n有些幻觉，模型本身怎么调都难根除。这时候要靠机制兜底：引用、拒答、校验、人工把关。机制比单模型更稳定，也更可复制。把防幻觉的重任，从「模型自觉」升级为「机制兜底」。\n\n幻觉治理，要和评测一起循环。\n\n评测里放幻觉题，跑出幻觉率。幻觉率一高，就回去治理；治理完了，再跑评测验证。评测和治理相互推动，幻觉率才持续下降。别把它们割裂，它们是同一个闭环的两端。\n\n把幻觉的边界，诚实告诉客户。\n\n要坦诚地跟客户讲清楚：生成式模型存在幻觉可能，系统已经通过引用、校验、人工把关做了压制，关键场景仍会保留人工确认。预期先对齐，信任反而更稳。透明，比藏着更让人放心。\n\n别把「像那么回事」当成「对」。\n\n核对的时候，不能只看答案读起来顺不顺。要用数据核对，看有没有依据、对不对得上。拿不准的，一律当作待核验。对不上的宁可返工。严谨是防幻觉的最后一道关。\n\n治理可以分步走，不必一步到位。\n\n幻觉治理不是一锤子。先把引用、拒答、校验这些基本机制搭起来，再逐步收严。每收严一步，都看数字是否变好，稳了再收下一步。循序渐进，既安全又不动摇体验。\n\n把幻觉治理写进交付承诺。\n\n在交付方案里写明幻觉治理的具体手段和控制目标：引用、拒答、校验、人工兜底各管什么。客户看到这些，心里有数，结果对齐也顺畅。承诺写清楚，责任也分得清。\n\n建立幻觉台账，逐项追踪。\n\n每一条发现的幻觉，都进台账：什么问题、什么回答、根因在哪、怎么整改、结果如何。台账在手，问题就不会积压、不会丢。定期清账，既看到治理效果，也发现新的治理方向。\n\n数据干净，幻觉就少一半。\n\n防幻觉要前移。数据入知识库之前，先做一轮质量检查，错误、过时、冲突的一律不进门。数据干净了，后面就少了很多隐患。数据质量，永远是防幻觉的第一块砖。\n\n让答案都可验证，客户才敢放心用。\n\n最终的目标，是重要回答都可以溯源。从哪来的、引的哪一段，一查便知。客户用起来心里有底，系统才真正立得住。可验证，是可信最硬的证据。\n\n多一分核对，就少一分幻觉。\n\n防幻觉的本质，是认真对待每一个字。多核一次、多验一遍，幻觉就被挤出去一点。把这份认真贯彻到每个环节，系统的可信度就扎扎实实垒起来，交付也就经得起检验。\n\n把最坏的情况，先想一遍。\n\n上线之前，先想清楚：如果模型在关键业务上出了严重幻觉，会怎样？把最坏的情况提前推演，再倒推检查系统，就能在要害处加固屏障。先想坏，防护才密。\n\n防幻觉，也要防过度。\n\n治理得太狠，模型会变得畏手畏脚，该答的不敢答，处处转人工，体验被拖垮。要在安全和可用之间找平衡。该答的要能答，该守的要守住。度的把握，是治理的功力所在。\n\n别把所有错答，都归给幻觉。\n\n有时候回答不准，根子是数据、知识库或权限问题，不是幻觉。要分清原因，对症下药。一刀切都当幻觉处理，反而会漏掉真正要修的地方。分类清楚，治理才精准。\n\n把防幻觉，变成全员的习惯。\n\n防幻觉不是某一个角色的事，而是整个团队共有的习惯。评审、测试、运营，都要带着挑剔的眼光看输出。全员把关，可靠性才会无处不在。\n\n用客户反馈，校准治理边界。\n\n客户说答得不对，一定要追查，看是不是幻觉。反馈是最真实的风向标。带着反馈去调整，治理的方向才会越来越准。\n\n治理的终点，是让系统可信赖。\n\n一切防幻觉的手段，目标只有一个：让系统可信赖。客户敢用、愿意用，系统才算真正立住。把可信当底线，防幻觉的努力就有了明确的方向，产品的价值也才能长久兑现。"},{"h":"6.4 生成式 AI 合规边界（国内法规语境）","body":"技术可以跑得快，但合规的底线不能含糊。生成式 AI 在国内有明确的监管要求，涉及内容生成、深度合成、个人信息、数据来源等方方面面。对交付工程师来说，不懂合规不是借口，出了事就是责任。这一节把国内法规语境下的关键合规点讲清楚，让你在设计、交付、运营时都能踩在合规的线上。\n\n**先明白为什么合规这么重要。**\n\n生成式 AI 影响面大，一条内容可能被大量人看到。国家因此出台了一系列管理规定，对生成式人工智能服务的提供与使用提出明确要求。合规，不是限制发展，而是让技术走得更稳、更远。作为交付方，系统跑在谁的平台上，就要遵守谁的法律。\n\n**第一个关键词：备案与登记。**\n\n按照相关管理要求，提供具有舆论属性或者社会动员能力的生成式服务，应当依法履行算法备案等手续。提供深度合成服务的，也有相应的备案义务。很多企业级交付场景，主体是平台方或服务提供方，备案的主体和责任要提前确认清楚，别把备案义务漏了。\n\n**第二个关键词：深度合成标识。**\n\n凡是利用深度合成技术生成或者编辑的图片、音频、视频等信息，应当按照规定作出标识。哪些该标、怎么标、标在哪，都有明确规则。不做标识，就是违规。交付这类场景时，标识能力要作为硬需求做进产品。\n\n**第三个关键词：算法备案与安全评估。**\n\n对用户造成重大影响的算法，要履行备案手续，并做安全评估。算法是怎么运转的、数据来自哪里、有没有偏见风险，都要说清楚。合规文档的沉淀，既是义务，也是交付质量的一部分。\n\n**第四个关键词：个人信息保护。**\n\n智能体处理大量个人信息。收集、使用、共享个人信息，都要遵循合法、正当、必要和诚信原则。要告知用户，获得同意，保障查阅、复制、删除的权利。个人信息保护法要求的事项，在交付设计里都要有对应落点。\n\n**第五个关键词：数据来源合法。**\n\n训练数据、知识库里的数据，都要来源合法。有版权的内容要获得授权，有隐私的数据要脱敏处理，涉密的信息不得使用。数据的来路不清楚，就是合规的大隐患。交付时，数据来源要可溯源、可说明。\n\n**第六个关键词：知识产权。**\n\n生成内容的著作权归属，生成过程使用素材的版权，都是现实问题。客户常常关心：机器生成的内容，版权归谁；模型引用了第三方内容，会不会侵权。这些要在合同中讲清楚，也在方案里做出合理安排。知识产权，不是事后补的，而是事前谈的。\n\n**第七个关键词：内容安全责任。**\n\n提供生成式服务，要对生成内容的合法性负责，要有内容安全的管理机制。违法内容要能及时发现、及时处置。安全责任是持续的，不是发个声明就完事。系统要有监管能力、处置流程、应急响应，合规才不是一句空话。\n\n**第八个关键词：未成年保护。**\n\n生成式服务要重视未成年人保护，避免对未成年人造成不利影响。涉及未成年人的场景，内容过滤要更严格，机制要更周全。这也是合规里容易被忽略、但非常严肃的一条。\n\n**九、负面清单，要心里有数。**\n\n涉及违反法律法规、危害国家安全、宣扬暴力、色情等内容，一律不得生成。这些红线，无论在哪个场景，都不能碰。红线清单要进系统，做到「技术上也不能生成」，而不是「希望别生成」。\n\n**十、责任边界要划清。**\n\n生成式服务的提供者、使用者，责任各有侧重。模型提供方、应用开发方、客户自己，各自担什么责，要在交付合同里写清楚。责任清楚，出问题才知道找谁、怎么处理。划清边界，是对双方的负责。\n\n**十一、合规是持续的动作。**\n\n法律法规在完善，监管要求在细化。合规不是交付那一刻的事，而是长期跟随的。政策一更新，产品就要跟着调整。持续跟踪法规、定期合规评审，才跟得上变化。\n\n**十二、把合规纳入交付流程。**\n\n合规不是额外负担，要纳入交付的标准动作。需求阶段考虑合规，设计阶段落实合规，交付阶段核查合规，运营阶段持续合规。合规进流程，才不会出现「开发完了才发现不合规」的尴尬。\n\n**十三、合规文档要齐。**\n\n与合规相关的材料，比如备案信息、算法说明、数据处理说明、安全管理制度，都要准备齐全。不是只在监管问的时候才找，而是平时就存好。文档齐全，既是合规的证明，也是交付的专业度。\n\n**十四、和客户一起扛合规。**\n\n很多合规义务，需要客户配合。比如备案主体是谁、数据处理授权怎么签、标识怎么展示，要跟客户一起定清楚。把合规当成双方协作的一部分，而不是单方面的要求，落地才顺畅。\n\n**十五、合规不是束缚，是保障。**\n\n可能有人觉得合规束手束脚。其实恰恰相反，合规是保护。合规做得好，企业不怕检查，客户敢用，长期才走得稳。把合规做透，是一种竞争力，一种让人放心的底牌。\n\n**用一张合规清单，把交付管起来。**\n\n把上面这些点整理成一张合规自查清单：备案有没有，标识做没做，数据处理合不合法，内容安全管没管，责任分没分清。交付前逐项打钩，缺哪补哪。清单在手，合规就可执行、可检验。\n\n**合规的终极目的，是负责任的创新。**\n\n守住合规，不是挡住创新，而是让创新更负责任地走。技术发展越快，越要有规则托底。做到合规，交付才不是一时快，而是走得久、走得稳、走得让人放心。\n\n合规要和行业要求叠加看。\n\n生成式 AI 的通用规则，只是基础。落到具体行业，还有各自的门槛。比如金融、医疗、教育，都有专门的监管要求。同一套系统，放到不同行业，要补的合规点不一样。交付之前，先把客户所在行业的规则研究透，把行业合规和生成式合规叠加起来看，才算是完整的合规。\n\n跨境场景，要格外小心。\n\n如果系统面向境外用户，或者数据要出境，就会涉及跨境数据流动的管理要求。该评估的评估，该申报的申报，能本地处理的就留在本地。跨境不是不能做，而是要一步一步走稳妥。拿不准的，先停下来问清楚，别凭感觉上线。\n\n留痕，是合规最好的证明。\n\n合规做没做、做对没做对，拿什么证明？留痕。生成的记录、处理的记录、授权的记录、处置的记录，都保存好。材料还要做成统一模板，命名规范、归档清楚、可检索，监管问询时按清单就能调出来，审起来快，也经得起外部检查。\n\n合规要和业务一起设计。\n\n最怕把合规当成「开发完再补」的动作。应该从一开始就一起设计。哪些能做、哪些不能、怎么标识、怎么留痕，在业务设计阶段就定下来。合规和业务并行设计，成本最低，效果也最好。\n\n拿不准的，先问再动手。\n\n合规规则有时很细，边界也未必清楚。拿不准的时候，不要自己猜。找法务、找服务商、找监管咨询，问清楚再做。宁可多问一句，也别冒着违规的风险往前冲。在合规面前，多问不丢人，出问题才丢人。\n\n把合规意识，融进团队文化。\n\n合规不只是某一个部门的职责，而是整个团队共同的底色。写进评审、写进流程、写进新员工培训。让每一位参与交付的人，都把合规当回事。文化起来了，执行自然就不掉链子。\n\n合规做得好，反而是加分项。\n\n当大家在合规上都马马虎虎，做扎实的你就有了差异化。客户把项目交出去，最怕出合规问题。谁把合规做得干净，谁就更让人放心。合规不是拖后腿的成本，而是实实在在的竞争力。\n\n一个合成的落地例子，看看标识怎么做。\n\n某内容平台用生成能力产出配图，工程上做了三件事：所有生成图片默认带显式水印，标明由人工智能生成；后台保留每张图的生成参数与时间记录，供内部追溯；用户投诉生成内容失实时，运营能在短时间内定位原始生成记录并处置。标识、追溯、投诉响应，一次落地，监管要求与用户体验都不耽误。\n\n和客户谈合作，合规责任要在合同里写清。\n\n至少写三件事：数据怎么处理、谁来负责、出了问题怎么响应。数据处理写明授权范围与用途限制，不留模糊地带；责任写明各方义务，内容安全谁管理、标识谁落实，各有归属；响应写明事件发生时的通报时限与配合义务。条款清清楚楚，后面就不会互相推诿。\n\n遇到监管问询，从容应对靠的是平时。\n\n材料平时就备齐：备案信息、算法说明、数据处理规范，分门别类放好。问询一来，按清单调材料、按事实答问题、按承诺时间反馈。平时功夫到位，问询就是一次例行沟通；平时不准备，问询就是一场手忙脚乱，还容易答错口径。\n\n个人信息场景，三个必做动作。\n\n第一是告知，用大白话讲清收集什么、用来干什么；第二是同意，给用户选择权，能拒绝也能换一种方式；第三是可撤回，用户要求删除时，要连同副本一起删干净。三个动作贯穿设计，个人信息保护才不是口号，而是看得见的体验。\n\n把合规培训，做成常态。\n\n不能只有法务懂合规，做产品、写代码、跑运营的人都要懂基本要求。新政策出台，第一时间组织学习，把容易踩线的地方讲透；每隔一段时间，结合项目实际给产品做一次合规体检，逐项对照最新要求，发现差距就补。学习跟得上，自查跟得上，执行才跟得上。\n\n合规不等于保守。\n\n守住底线，并不等于不敢创新。恰恰相反，把边界摸清楚了，反而可以在边界内大胆尝试。知道自己能走多远，才知道怎么走得更快。合规不是刹车，而是让车跑得更稳的安全带。\n\n让合规成为交付的默认动作。\n\n不是每个项目都要重新研究合规，而是把合规做成默认动作，每次交付都自动带上。习惯成自然，合规就不是负担，而是理所当然的一部分。一次合规不难，难的是长期都合规；把合规当底线、把责任当日常，客户敢托付，监管能放心，交付的路才越走越宽。"}]}]};
const QUIZ_TOTAL = 300;
</script>
<script>
(function(){
'use strict';
const DATA = (typeof LEARNING_DATA !== 'undefined' && LEARNING_DATA) ? LEARNING_DATA : null;

// R5: meta.footerNote overrides default footer (AWS default kept when absent)
if (DATA && DATA.meta && DATA.meta.footerNote) {
  var fn = document.getElementById('footNote');
  if (fn) { fn.textContent = DATA.meta.footerNote; }
}

/* ============ 常量与工具 ============ */
const EXAM = DATA ? (DATA.meta.exam || 'CERT').toLowerCase() : 'cert';   // clf-c02
const STORE_KEY = EXAM + '-v2';                                          // 进度键：clf-c02-v2
const COLORS = ['#4f46e5','#7c3aed','#9333ea','#a855f7'];                // 每章主题色（N 章 N 色，N>4 循环）
const home = document.getElementById('home');
const chapBox = document.getElementById('chapters');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function imgSrcOk(src){ return /^(?:[\w.-]+\/)*[\w.-]+\.(?:png|jpe?g|webp|gif|svg)$/i.test(src); }
function inlineMd(s){
  let t = esc(s);
  t = t.replace(/\n/g,'<br>');
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t = t.replace(/!\[([^\]]*)\]\(([^()\s]+)\)/g, function(m0, alt, src){
    if(!imgSrcOk(src)) return '<span class="img-bad" title="非法图源">🖼 非法图源：'+src+'</span>';
    return '<img class="inline-img" loading="lazy" alt="'+alt.replace(/"/g,'&quot;')+'" src="'+src+'">';
  });
  return t;
}
function isTblSep(ln){ const core = ln.replace(/^\s*\|/,'').replace(/\|\s*$/,''); if(!core.includes('-')) return false; return /^[\s:\-|]+$/.test(ln) && /-/.test(ln); }
function loadProg(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveProg(p){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){} }

/* ============ 块级 md 渲染（段落/引用/表格/列表/图占位符） ============ */
function renderBlocks(seg, figs, fctr){
  fctr = fctr || {n:0};
  const lines = seg.replace(/\r/g,'').split('\n');
  let html = ''; let i = 0; const n = lines.length;
  while(i < n){
    const ln = lines[i]; const s = ln.trim();
    if(s === ''){ i++; continue; }
    const fm = s.match(/^\[\[fig:([\w-]+)\]\]$/);
    if(fm){ const f = (figs||{})[fm[1]]; if(f){ if(fctr) fctr.n++; html += figHtml(f); } i++; continue; }
    const fp = s.match(/^【图：(.+?)｜(概念图|截图)】$/);
    if(fp){ fctr.n++; html += '<div class="fig-placeholder" data-figtype="'+fp[2]+'"><span class="fp-num">图 '+fctr.n+'</span><span class="fp-type">'+fp[2]+'</span><span class="fp-alt">'+esc(fp[1])+'</span><span class="fp-note">真图待补</span></div>'; i++; continue; }
    const ib = s.match(/^!\[([^\]]*)\]\(([^()\s]+)\)$/);
    if(ib){
      const ialt = ib[1], isrc = ib[2];
      if(imgSrcOk(isrc)){ html += '<figure class="fig-img"><img loading="lazy" alt="'+ialt.replace(/"/g,'&quot;')+'" src="'+isrc+'"><figcaption>'+esc(ialt)+'</figcaption></figure>'; }
      else { html += '<div class="fig-placeholder"><span class="fp-type">非法图源</span><span class="fp-alt">'+esc(ialt)+' ← '+esc(isrc)+'</span><span class="fp-note">检查路径与扩展名</span></div>'; }
      i++; continue;
    }
    if(s.startsWith('|') && i+1 < n && isTblSep(lines[i+1].trim())){
      let rows = [];
      while(i < n && lines[i].trim().startsWith('|')){ rows.push(lines[i].trim()); i++; }
      const heads = rows[0].replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim()));
      const data = rows.slice(2).map(r => r.replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim())));
      html += '<div class="tbl-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'
        + data.map(r => '<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if(s.startsWith('>')){
      let q = [];
      while(i < n && lines[i].trim().startsWith('>')){ q.push(lines[i].replace(/^\s*>\s?/,'').trim()); i++; }
      html += '<blockquote>'+inlineMd(q.join(' '))+'</blockquote>'; continue;
    }
    if(/^[-*]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^[-*]\s+/.test(t)){ items.push(inlineMd(t.replace(/^[-*]\s+/,''))); i++; } else break; }
      html += '<ul>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; continue;
    }
    if(/^\d+[.、]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^\d+[.、]\s+/.test(t)){ items.push(inlineMd(t.replace(/^\d+[.、]\s+/,''))); i++; } else break; }
      html += '<ol>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ol>'; continue;
    }
    const hm = s.match(/^(#{1,6})\s+(.+)$/);
    if(hm){ html += '<h4 class="sec-h">'+inlineMd(hm[2])+'</h4>'; i++; continue; }
    let para = [];
    while(i < n){
      const t = lines[i].trim();
      if(t === '' || t.startsWith('|') || t.startsWith('>') || /^[-*]\s+/.test(t) || /^\d+[.、]\s+/.test(t) || /^#{1,6}\s/.test(t) || /^\[\[fig:[\w-]+\]\]$/.test(t) || /^【图：[^｜]*｜(?:概念图|截图)】$/.test(t) || /^!\[[^\]]*\]\([^()\s]+\)$/.test(t)) break;
      para.push(t); i++;
    }
    if(para.length) html += '<p>'+inlineMd(para.join(' '))+'</p>';
  }
  return html;
}

/* ===== 节内子块解析与渲染（v6）：#### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点）
   本节定位=弱化引言、案例/记忆要点=卡片、常见误区与易错点=警示小节——均不占编号。
   解析与渲染共用 parseSectionBlocks，保证正文 h3 与左侧目录两级条目 1:1。 ===== */
const SUB_RAW='raw', SUB_LEAD='lead', SUB_KP='kp', SUB_CASE='case', SUB_MIS='mis', SUB_MEM='mem';
function subTypeOf(title){
  if(title === '本节定位') return SUB_LEAD;
  if(title === '案例') return SUB_CASE;
  if(title === '记忆要点') return SUB_MEM;
  if(title === '常见误区与易错点') return SUB_MIS;
  return SUB_KP;
}
function parseSectionBlocks(md){
  const parts = (md||'').replace(/\r/g,'').split(/\n(?=####\s)/);
  const out = [];
  parts.forEach(part=>{
    const m = part.match(/^####\s*(.+?)\s*\n([\s\S]*)$/);
    if(!m){ const t = part.trim(); if(t) out.push({ type:SUB_RAW, title:'', body:t }); return; }
    out.push({ type:subTypeOf(m[1].trim()), title:m[1].trim(), body:(m[2]||'').trim() });
  });
  return out;
}
function countKp(body){ let m=0; parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP) m++; }); return m; }
function kpListOf(body){
  const kps=[]; let m=0;
  parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP){ m++; kps.push({ m:m, title:b.title }); } });
  return kps;
}
function renderSectionBody(md, figs, d, n, fctr){
  fctr = fctr || {n:0};
  const blocks = parseSectionBlocks(md);
  let h = ''; let kp = 0;
  for(const b of blocks){
    if(b.type === SUB_RAW){ h += renderBlocks(b.body, figs, fctr); continue; }
    if(b.type === SUB_KP){
      kp++;
      h += '<h3 class="mh3" id="sec-'+d+'-'+n+'-'+kp+'"><span class="h3no">'+d+'.'+n+'.'+kp+'</span><span>'+inlineMd(b.title)+'</span></h3>'
         + renderBlocks(b.body, figs, fctr);
      continue;
    }
    if(b.type === SUB_CASE){ h += '<div class="case-card"><h4 class="sec-h">案例</h4>'+renderBlocks(b.body, figs, fctr)+'</div>'; continue; }
    if(b.type === SUB_MEM){ h += '<div class="mem-card"><h4 class="sec-h">记忆要点</h4>'+renderBlocks(b.body, figs, fctr)+'</div>'; continue; }
    h += '<h4 class="sec-h'+(b.type===SUB_LEAD?' sec-lead-h':'')+'">'+inlineMd(b.title)+'</h4>'+renderBlocks(b.body, figs, fctr);
  }
  return h;
}
function figsById(fs){ const m={}; (fs||[]).forEach(f=>{ m[f.id]=f; }); return m; }
function figHtml(f){
  return '<div class="fig-block"><div class="fig-title">'+esc(f.title)+'</div>'
    + '<div class="fig-body">'+(f.html||'')+'</div>'
    + (f.caption ? '<div class="fig-caption">'+esc(f.caption)+'</div>' : '') + '</div>';
}

    let tocHtml = '<ul class="toc-list">';
    secs.forEach((s,si)=>{
      tocHtml += '<li class="toc-sec" data-ds="'+(si+1)+'">'
        + '<a class="toc-link toc-sec-link" href="#sec-'+d+'-'+(si+1)+'"><span class="tl-id">'+d+'.'+(si+1)+'</span><span class="toc-t">'+esc(s.h)+'</span><span class="toc-ar">▸</span></a>';
      const kps = kpListOf(s.body || '');

        tocHtml += '<ul class="toc-sub">';

          tocHtml += '<li><a class="toc-link toc-sub-link" href="#sec-'+d+'-'+(si+1)+'-'+k.m+'"><span class="tl-id">'+d+'.'+(si+1)+'.'+k.m+'</span><span class="toc-t">'+esc(k.title)+'</span></a></li>';
        });

      }
      tocHtml += '</li>';
    });
    /* 目录尾固定练习入口：滚到章末练习区（视作目录内最后一章，v6.2 新增） */
    tocHtml += '<li class="toc-quiz"><a class="toc-link toc-quiz-link" href="#quiz-d'+d+'"><span class="tl-id">📝</span><span class="toc-t">本章练习</span></a></li>';
    tocHtml += '</ul>';
    let h = '<div class="panel" id="panel-d'+d+'">'
      /* ── 栅格列①：常驻目录槽（窄屏为抽屉） ── */

      +     '<button class="toc-open-btn" data-open="1" aria-label="打开本章内容目录" aria-expanded="false">☰ 目录</button>'
      +     '<span class="tn-title">D'+d+' · '+esc(ch.name||'')+'</span>'

      tm.textContent = (ch.sections||[]).length + ' 节 · ' + kp + ' 点';

  });

    if(e.target.closest('.back-btn')){ backHome(); return; }
    const panel = e.target.closest('.panel');
    const d = panel ? parseInt(panel.id.replace('panel-d',''),10) : 0;
    if(e.target.closest('.side-mask') || e.target.closest('[data-close="1"]')){ closeSide(); return; }
    if(e.target.closest('.toc-open-btn')){ openSide(d); return; }
    const tl = e.target.closest('.toc-link');
    if(tl){
      e.preventDefault();
      const href = tl.getAttribute('href');
      if(tl.classList.contains('toc-sec-link')){
        /* 节行：单开手风琴（开当前节收起其它节）+ 滚动到节 */
        const li = tl.closest('.toc-sec');
        const wasOpen = li ? li.classList.contains('open') : false;
        const toc = document.getElementById('toc-d'+d);
        if(toc) toc.querySelectorAll('.toc-sec.open').forEach(x=>x.classList.remove('open'));
        if(li && !wasOpen) li.classList.add('open');

      const el = document.getElementById(href.slice(1));
      if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
      if(window.matchMedia('(max-width:1199px)').matches) closeSide();
    }
  });
  /* 面板内练习渲染与判分绑定 */
  chapters.forEach((ch,di)=>{
    const d = di+1;
    renderQuiz(d, ch.practice || []);
  });
}
/* 窄屏抽屉开合 */
function openSide(d){
  const side = document.getElementById('side-d'+d); if(!side) return;
  side.classList.add('open');
  const btn = document.querySelector('#panel-d'+d+' .toc-open-btn');
  if(btn) btn.setAttribute('aria-expanded','true');
  const mask = document.querySelector('#panel-d'+d+' .side-mask');
  if(mask) mask.classList.add('show');
}
function closeSide(){
  document.querySelectorAll('.ch-side.open').forEach(s=>s.classList.remove('open'));
  document.querySelectorAll('.side-mask.show').forEach(m=>m.classList.remove('show'));
  document.querySelectorAll('.toc-open-btn[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));
}

/* ============ 章内滚动（v6）：几何法 scrollspy + 阅读进度 ============
   同一 rAF 节流的 scroll 监听做两件事：① 顶部细进度条（#rdFill-d / #readPct-d）
   ② 高亮"最新越过吸顶线(READ_LINE)的锚点"（.sec-block 节 / .mh3 知识点），并自动单开其节组。 */
let spyD = 0, spyEls = [], spyTick = null, spyOn = false;
const READ_LINE = 86;      // 吸顶条下方阅读线
const ACT_WIN = 160;       // 节/知识点标题进入线下方窗口即视为"当前"（点击跳转后立即生效）
function setAct(id){
  if(!id) return;
  /* 锚点两类：正文节/知识点 sec-域-序号[-序号]，章末练习 quiz-d域 */
  const mk = id.match(/^(?:sec-|quiz-d)(\d+)/); if(!mk) return;
  const d = +mk[1];
  const toc = document.getElementById('toc-d'+d); if(!toc) return;
  toc.querySelectorAll('.toc-link.act').forEach(a=>a.classList.remove('act'));
  const link = toc.querySelector('a[href="#'+id+'"]');
  if(link){
    link.classList.add('act');
    const li = link.closest('.toc-sec');
    if(li && !li.classList.contains('open')){
      toc.querySelectorAll('.toc-sec.open').forEach(x=>x.classList.remove('open'));
      li.classList.add('open');
    } else if(!li){
      /* 独立条目（练习入口等）：高亮时收起所有展开节组，聚焦本条 */
      toc.querySelectorAll('.toc-sec.open').forEach(x=>x.classList.remove('open'));
    }
  }
}
function computeSpy(){
  const host = document.getElementById('panel-d'+spyD); if(!host) return;
  /* ① 阅读进度：以当前面板总高扣视口高的滚动行程计百分比（+页脚尾距近似） */
  const total = host.offsetHeight - window.innerHeight + 110;
  const p = total > 0 ? Math.max(0, Math.min(100, Math.round(window.scrollY / total * 100))) : 0;
  const fill = document.getElementById('rdFill-'+spyD); if(fill) fill.style.width = p + '%';
  const pct = document.getElementById('readPct-'+spyD); if(pct) pct.textContent = p + '%';
  /* ② 当前锚（三层）：
     视口内(含阅读线下方窗口)：选最靠上者 → 点击跳转/节首即生效；
     视口内无锚(读至章末练习/底部)：取最近滚出视口的锚，保持高亮最后小节；
     首屏未滚：回退最先可见锚 */
  const hi = READ_LINE + ACT_WIN;
  let best = null;
  for(const el of spyEls){
    const r = el.getBoundingClientRect();
    if(r.top <= hi && r.bottom >= 0){ if(!best || r.top > best.r.top) best = { el:el, r:r }; }
  }
  if(!best){
    for(const el of spyEls){
      const r = el.getBoundingClientRect();
      if(r.bottom < 0){ if(!best || r.bottom > best.r.bottom) best = { el:el, r:r }; }
    }
  }
  if(!best){
    for(const el of spyEls){
      const r = el.getBoundingClientRect();
      if(r.top >= 0 && r.top < window.innerHeight * 0.7){ if(!best || r.top < best.r.top) best = { el:el, r:r }; }
    }
    if(!best && spyEls.length) best = { el:spyEls[0], r:null };
  }
  if(best && best.el.id) setAct(best.el.id);
}
function onSpyScroll(){
  if(spyTick) return;
  spyTick = requestAnimationFrame(()=>{ spyTick = null; computeSpy(); });
}
function initSpy(d){
  detachSpy(false);
  spyD = d;
  const host = document.getElementById('panel-d'+d); if(!host) return;
  spyEls = Array.from(host.querySelectorAll('.sec-block, .mh3, .quiz-box'));
  if(!spyOn){ spyOn = true; window.addEventListener('scroll', onSpyScroll, { passive:true }); }
  document.body.classList.add('chapView');
  computeSpy();
}
function detachSpy(resetAct){
  if(spyOn){ window.removeEventListener('scroll', onSpyScroll); spyOn = false; }
  if(spyTick){ cancelAnimationFrame(spyTick); spyTick = null; }
  document.body.classList.remove('chapView');
  spyEls = []; spyD = 0;
  if(resetAct !== false){
    document.querySelectorAll('.toc-link.act').forEach(a=>a.classList.remove('act'));
    document.querySelectorAll('.toc-sec.open').forEach(li=>li.classList.remove('open'));
  }
}

/* ============ 章末练习 ============ */
/* 答案/题型归一化（修复：双科数据格式不一致导致章末练习失效）
   数据真源存在两种历史格式：
     CLF  a = ["C"] / ["B","E"]   t = 'single' / 'multiple'
     AIF  a = "B"   / "AE"        t = '单选' / '多选'
   原实现把 q.a 经 JSON.stringify+esc 写进 data-ans 属性，esc 不转义双引号 →
   属性被 HTML 截断（CLF 抛 JSON 解析错→提交无反应；AIF 读出空→恒判错）。
   现改为：答案只从数据真源按 qid 反查，渲染层统一归一化，不再进 HTML 属性。 */
function normAns(v){
  if(v === null || v === undefined) return [];
  if(Array.isArray(v)) return v.map(x=>String(x).trim().toUpperCase()).filter(x=>/^[A-Z]$/.test(x));
  const raw = String(v).trim();
  /* 严格形态：整串只允许字母与分隔符。防从说明文字里误提字母
     （历史案例：某题答案字段为「⚠️待核（…见源PDF）」→ 误提出 P/D/F） */
  if(!/^[A-Za-z][A-Za-z,，、;；\s]*$/.test(raw)) return [];
  return raw.toUpperCase().replace(/[^A-Z]/g, '').split('').filter(Boolean);
}
/* 可作答判定：答案可解析 + 至少一个选项。不可作答题不渲染交互（防误判） */
function isAnswerable(q){ return !!(q && normAns(q.a).length && (q.o || []).length); }
/* 可答题数（进度分母用，不可作答题不计入） */
function answerableCount(d){
  const ch = (DATA && DATA.chapters) ? DATA.chapters[d-1] : null;
  return ((ch && ch.practice) || []).filter(isAnswerable).length;
}
function isMultiQ(q){
  if(!q) return false;
  if(q.t === 'multiple' || q.t === 'multi' || q.t === '多选') return true;
  return normAns(q.a).length > 1;   // 兜底：答案多字母必为多选
}
function findQ(d, qid){
  const ch = (DATA && DATA.chapters) ? DATA.chapters[d-1] : null;
  const qs = (ch && ch.practice) || [];
  for(let i=0;i<qs.length;i++){ if(String(qs[i].id) === String(qid)) return qs[i]; }
  return null;
}
function renderQuiz(d, qs){
  const host = document.getElementById('quiz-d'+d);
  if(!qs.length){ host.innerHTML = '<div class="quiz-hdr">✅ 本章练习</div><p style="font-size:14px;color:#94a3b8">本章暂无配套练习，可到刷题工具练习。</p>'; return; }
  const nAns = qs.filter(isAnswerable).length;
  const naTip = (nAns < qs.length) ? '（另有 '+(qs.length-nAns)+' 题特殊题型待补充）' : '';
  let h = '<div class="quiz-hdr"><span>✅ 本章练习（'+nAns+' 题）'+naTip+'</span><span class="quiz-score" id="qscore-'+d+'">正确 0/'+nAns+'</span></div>';
  qs.forEach((q,qi)=>{
    const multi = isMultiQ(q);
    /* 不可作答防御：答案或选项缺失时不渲染答题交互，
       避免学员点击后被误判（历史案例：配对题占位形态） */
    if(!isAnswerable(q)){
      h += '<div class="qi qi-na" data-d="'+d+'" data-qid="'+esc(q.id||(d+'-'+qi))+'" data-qi="'+qi+'" data-na="1">'
        + '<div class="qmeta"><span class="qbadge">第 '+(qi+1)+' 题</span><span class="qtype">特殊题型</span></div>'
        + '<div class="qstem">'+inlineMd(q.q||'')+'</div>'
        + '<div class="qrow"><div class="qres show na">⚠️ 本题为配对/特殊题型，暂不支持在线作答（内容待补充）</div></div></div>';
      return;
    }
    h += '<div class="qi" data-d="'+d+'" data-qid="'+esc(q.id||(d+'-'+qi))+'" data-qi="'+qi
      + '" data-multi="'+(multi?'1':'0')+'">'
      + '<div class="qmeta"><span class="qbadge">第 '+(qi+1)+' 题</span><span class="qtype '+(multi?'qtype-m':'qtype-s')+'">'+(multi?'多选':'单选')+'</span></div>'
      + '<div class="qstem">'+inlineMd(q.q||'')+'</div><div class="opts">';
    (q.o||[]).forEach(op=>{
      h += '<div class="opt" data-l="'+esc(op.l)+'"><span class="ol">'+esc(op.l)+'.</span><span>'+inlineMd(op.t||'')+'</span></div>';
    });
    h += '</div><div class="qexp" style="display:none">'+esc(q.e||'')+'</div>'
      + '<div class="qrow"><button class="qbtn">确认答案</button><div class="qres"></div></div></div>';
  });
  h += '<div class="score-box" id="scorebox-'+d+'"><div class="score-num" id="scorenum-'+d+'"></div><div class="score-lbl"></div>'
    + '<div class="sb-tip">完整题库与限时模拟考核见首页「题库刷题」入口；未作答的题目在返回目录再进入后仍可继续作答。</div></div>';
  host.innerHTML = h;
  /* 恢复已作答状态 */
  const prog = loadProg();
  const rec = (prog['quiz_d'+d] && prog['quiz_d'+d].answered) || {};
  host.querySelectorAll('.qi').forEach(qi=>{
    const qid = qi.dataset.qid;
    if(rec[qid] !== undefined){
      applyResult(qi, rec[qid].right === 1, rec[qid].sel || [], normAns((findQ(d, qid) || {}).a), true);
    }
  });
  host.querySelectorAll('.qi').forEach(qi=>{
    const qid = qi.dataset.qid; const prog2 = loadProg();
    const rec2 = (prog2['quiz_d'+d] && prog2['quiz_d'+d].answered) || {};
    if(rec2[qid] !== undefined) return;   // 已答锁题
    const optsBox = qi.querySelector('.opts'), btn = qi.querySelector('.qbtn');
    if(!optsBox || !btn) return;          // 不可作答题（特殊题型占位卡）无交互
    const multi = qi.dataset.multi === '1';
    const opts = qi.querySelectorAll('.opt');
    optsBox.addEventListener('click', e=>{
      const o = e.target.closest('.opt'); if(!o) return;
      if(multi){ o.classList.toggle('sel'); }
      else{ opts.forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); }
    });
    btn.addEventListener('click', ()=>{ judge(qi); });
  });
  updateScore(d);
  checkScoreBox(d);
}

function judge(qi){
  const d = qi.dataset.d;
  const ans = normAns((findQ(d, qi.dataset.qid) || {}).a);
  const sel = Array.from(qi.querySelectorAll('.opt.sel')).map(o=>o.dataset.l);
  /* 防复发：答案数据异常时大声报错，不得静默判错 */
  if(!ans.length){
    const r = qi.querySelector('.qres');
    r.className = 'qres show err';
    r.textContent = '⚠️ 本题答案数据异常，无法判定，请反馈管理员';
    return;
  }
  const right = sel.length === ans.length && ans.every(a=>sel.includes(a));
  applyResult(qi, right, sel, ans, false);
  /* 持久化 */
  const prog = loadProg();
  const key = 'quiz_d'+d;
  if(!prog[key]) prog[key] = { answered:{} };
  prog[key].answered[qi.dataset.qid] = { right: right?1:0, sel: sel };
  saveProg(prog);
  updateScore(d);
  refreshProgress();
  checkScoreBox(d);
}

function applyResult(qi, right, sel, ans, restored){
  qi.classList.add('done');
  const opts = Array.from(qi.querySelectorAll('.opt'));
  opts.forEach(o=>{
    const l = o.dataset.l;
    if(ans.includes(l)) o.classList.add(sel.includes(l) ? 'cor' : 'shc');
    else if(sel.includes(l)) o.classList.add('wrg');
  });
  const qres = qi.querySelector('.qres');
  qres.className = 'qres show ' + (right ? 'ok' : 'err');
  const exp = qi.querySelector('.qexp');
  qres.innerHTML = (right ? '✅ 回答正确' : '❌ 回答错误') + '　<span style="font-weight:400">' + inlineMd(exp ? exp.textContent : '') + '</span>';
  qi.querySelector('.qbtn').disabled = true;
  qi.querySelector('.qbtn').textContent = restored ? '已作答' : '已确认';
}

function updateScore(d){
  const prog = loadProg();
  const key = 'quiz_d'+d;
  const rec = (prog[key] && prog[key].answered) || {};
  let right = 0;
  Object.values(rec).forEach(v=>{ if(v.right === 1) right++; });
  const total = answerableCount(d);   // 分母=可答题数（特殊题型占位卡不计入）
  const sc = document.getElementById('qscore-'+d);
  if(sc) sc.textContent = '正确 ' + right + '/' + total;
}

function checkScoreBox(d){
  const prog = loadProg();
  const key = 'quiz_d'+d;
  const rec = (prog[key] && prog[key].answered) || {};
  const total = answerableCount(d);
  if(Object.keys(rec).length >= total && total > 0){
    let right = 0; Object.values(rec).forEach(v=>{ if(v.right === 1) right++; });
    const box = document.getElementById('scorebox-'+d);
    document.getElementById('scorenum-'+d).textContent = right + ' / ' + total;
    box.querySelector('.score-lbl').textContent = right === total ? '🎉 全对，本章掌握扎实！' : (right >= total*0.7 ? '👍 达到及格线（70%），可进入下一章' : '📖 建议回到正文复习错题对应的知识点');
    box.classList.add('show');
  }
}

/* ============ 视图切换与进度 ============ */
function go(d){
  const chapters = DATA.chapters;
  closeSide();
  home.style.display = 'none';
  chapBox.style.display = '';
  chapBox.querySelectorAll('.panel').forEach(p=>{ p.style.display = (p.id === 'panel-d'+d) ? '' : 'none'; });
  const prog = loadProg();
  prog['read_d'+d] = 1;                 // 已读标记
  saveProg(prog);
  window.scrollTo(0,0);
  document.title = baseTitle() + ' · 第 ' + d + ' 章';
  initSpy(d);                            // 常驻目录/进度条/scrollspy 跟随当前章
}

function backHome(){
  detachSpy();
  closeSide();
  chapBox.style.display = 'none';
  home.style.display = '';
  window.scrollTo(0,0);
  document.title = baseTitle();
  refreshProgress();
}

/* 刷新首页进度看板：统计已完成数 + 章卡状态/进度条 */
function refreshProgress(){
  const prog = loadProg();
  const chapters = DATA.chapters;
  let doneCnt = 0;
  chapters.forEach((ch,di)=>{
    const d = di+1;
    const total = (ch.practice||[]).length;
    const rec = (prog['quiz_d'+d] && prog['quiz_d'+d].answered) || {};
    const nDone = Object.keys(rec).length;
    const right = Object.values(rec).filter(v=>v.right===1).length;
    const read = prog['read_d'+d] === 1;
    const pm = document.getElementById('pm-'+d);
    const pmn = document.getElementById('pmn-'+d);
    const pf = document.getElementById('pf-'+d);
    const card = pm ? pm.closest('.ch-card') : null;
    if(!pm) return;
    let state = '未开始', pct = 0;
    if(nDone >= total && total > 0){ state = '已完成'; doneCnt++; card.classList.add('done'); }
    else if(read || nDone > 0){ state = nDone > 0 ? '学习中 ' + nDone + '/' + total : '学习中'; }
    pm.textContent = state;
    if(card) card.classList.toggle('done', nDone >= total && total > 0);
    pct = total ? Math.round(nDone/total*100) : 0;
    if(pf) pf.style.width = pct + '%';
    if(pmn) pmn.textContent = total ? ('答对 ' + right + '/' + total) : '';
  });
  const od = document.getElementById('ovDone');
  if(od) od.textContent = doneCnt;
}

/* ============ 启动 ============ */
if(!DATA){
  document.body.innerHTML = '<div style="padding:60px 24px;text-align:center;font-size:14px;color:#64748b">学习数据未注入：此模板需经构建脚本注入数据后方可使用。</div>';
} else {
  buildHome();
  buildPanels();
  refreshProgress();
}

/* ============ 合体视图切换：学习区 ↔ 题库刷题区 ============
   quiz-embed 内的「← 返回学习目录」按钮与底部导航「📚 学习」都调用 window.kbShowLearnHome */
function kbShowQuiz(){
  detachSpy();
  closeSide();
  home.style.display = 'none';
  chapBox.style.display = 'none';
  const f = document.querySelector('.footer'); if(f) f.style.display = 'none';
  // 修复：.wrap 外壳仅藏子元素会残留 padding（24+60px），把题库顶栏顶离顶部 84px
  // → 外壳自身一并隐藏，保证进入题库视图即贴顶
  const w = document.querySelector('.wrap'); if(w) w.style.display = 'none';
  const qv = document.getElementById('quizView');
  if(qv){
    qv.style.display = 'block';
    const tt = document.getElementById('qzTopTitle');
    if(tt) tt.textContent = (DATA.meta.cnName ? DATA.meta.exam + ' · ' + DATA.meta.cnName : DATA.meta.exam) + ' 题库刷题';
  }
  window.scrollTo(0,0);
  document.title = baseTitle() + ' · 题库刷题';
}
function kbShowLearnHome(){
  detachSpy();
  closeSide();
  const qv = document.getElementById('quizView');
  if(qv) qv.style.display = 'none';
  const f = document.querySelector('.footer'); if(f) f.style.display = '';
  home.style.display = '';
  const w = document.querySelector('.wrap'); if(w) w.style.display = '';
  window.scrollTo(0,0);
  document.title = baseTitle();
  refreshProgress();
}
window.kbShowQuiz = kbShowQuiz;
window.kbShowLearnHome = kbShowLearnHome;
})();
</script>
<script>
/* 图灯箱（移动适配 P1=A）：正文图当前渲染等效字号 <9.5px 时点击可放大到原始 viewBox 尺寸
   等效字号 = 图内最小 text 字号 × (当前渲染宽 ÷ viewBox 宽)；桌面可读图不触发，不打断阅读 */
(function(){
  'use strict';
  var box = null, stage = null;
  function minFontPx(svg){
    var t = svg.querySelectorAll('text'), mn = Infinity;
    for (var i = 0; i < t.length; i++){
      var v = parseFloat(t[i].getAttribute('font-size'));
      if (isNaN(v)){ var cs = getComputedStyle(t[i]); v = parseFloat(cs.fontSize); }
      if (!isNaN(v) && v < mn) mn = v;
    }
    return isFinite(mn) ? mn : 12;
  }
  function effFont(svg){
    var vb = svg.viewBox && svg.viewBox.baseVal;
    if (!vb || !vb.width) return 99;                 // 无 viewBox：不介入
    var w = svg.getBoundingClientRect().width || vb.width;
    return minFontPx(svg) * (w / vb.width);
  }
  function close(){
    if (box) box.classList.remove('show');
    document.documentElement.style.overflow = '';
  }
  function open(svg){
    if (!box){
      box = document.createElement('div');
      box.className = 'fig-lightbox';
      box.innerHTML = '<button class="lb-close" aria-label="关闭放大图">✕</button><div class="lb-stage"></div>';
      document.body.appendChild(box);
      stage = box.querySelector('.lb-stage');
      box.querySelector('.lb-close').addEventListener('click', close);
      box.addEventListener('click', function(e){ if (e.target === box) close(); });
    }
    var vb = svg.viewBox.baseVal;
    var clone = svg.cloneNode(true);
    clone.style.width = vb.width + 'px';             // 原始 viewBox 尺寸 1:1
    clone.style.maxWidth = 'none';
    clone.style.height = 'auto';
    stage.innerHTML = '';
    stage.appendChild(clone);
    box.classList.add('show');
    document.documentElement.style.overflow = 'hidden';
    stage.scrollTop = 0; stage.scrollLeft = 0;
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
  document.addEventListener('click', function(e){
    var svg = e.target.closest ? e.target.closest('.fig-body svg') : null;
    if (!svg) return;
    if (effFont(svg) >= 9.5) return;                 // 当前渲染下可读 → 不打断
    e.preventDefault();
    open(svg);
  });
})();
</script>
