function renderQuiz() {
  const el = document.getElementById('page-quiz');
  if(!quizState || !quizState.questions.length) {
    el.innerHTML = `<div class="header"><button class="back-btn" onclick="navigate('dashboard')">←</button><h1>刷题</h1></div>
    <p style="text-align:center;margin-top:60px;color:var(--text2)">暂无题目，请从仪表盘选择模式开始练习</p>`;
    return;
  }
  const q = quizState.questions[quizState.currentIdx];
  const isHot = q.t === 'hot';
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  // 考核=仅本场作答；练习模式=全局历史（含本场）——防练习记录串进考核视图
  const answers = sessionScopedAnswers();
  const prevAnswers = answers.filter(a=>a.id===q.id);
  const everCorrect = prevAnswers.some(a=>a.ok);
  const everWrong = prevAnswers.some(a=>!a.ok);
  const answered = quizState.answered || {};
  let userAns = answered[q.id];
  const finished = quizState.submitted && quizState.submitted[q.id];
  const correct = finished && isAnswerCorrect(q, userAns);

  let modeLabel = quizState.mode==='exam'?'📋 模拟考核':quizState.mode==='wrong'?'❌ 错题重练':quizState.mode==='domain'?'📖 章节练习':quizState.mode==='single'?'📝 单题练习':'📝 顺序练习';

  let html = `<div class="quiz-header">
    <button class="back-btn" onclick="exitQuiz()">←</button>
    <span style="font-weight:600;font-size:15px">${modeLabel}</span>
    ${quizState.mode==='exam'?`<span class="timer" id="quizTimer"></span>`:''}
    <span class="quiz-progress">${quizState.currentIdx+1}/${quizState.questions.length}</span>
  </div>`;
  html += `<div class="quiz-meta">
    <span class="domain-tag">Domain ${q.d}</span>
    <span>${DOMAIN_NAMES[q.d]}</span>
    <span>${TYPE_NAMES[q.t]}</span>
    ${everCorrect?'<span style="background:rgba(6,214,160,.15);color:var(--correct)">已答对</span>':''}
    ${everWrong?'<span style="background:rgba(239,71,111,.15);color:var(--wrong)">曾答错</span>':''}
  </div>`;
  html += `<div class="question-text">${q.q}</div>`;

  const renderOpts = getOptionsHTML(q, userAns, finished, correct, getShuffledAnswer(q));
  html += renderOpts;

  if(isHot) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?'▶ 完成返回':'▶ 下一题'}</button>
    </div>`;
  } else if(!finished) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>✅ 确认</button>
    </div>`;
  } else {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?(quizState.mode==='exam'?'📊 交卷查看成绩':'▶ 完成返回'):'▶ 下一题'}</button>
    </div>`;
  }

  if(finished) {
    const badge = correct ? '✅ 回答正确!' : '❌ 回答错误';
    const cls = correct ? 'correct' : 'wrong';
    const gItems = getGlossaryForQuestion(q);
    let gHtml = '';
    if(gItems.length) {
      gHtml = '<div class="glossary"><div class="glossary-title">词汇附录</div>';
      gItems.forEach(g => {
        gHtml += '<div class="glossary-item"><span class="glossary-term">' + g.term + '</span><span class="glossary-def">\u00a0\u2014\u00a0' + g.def.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span></div>';
      });
      gHtml += '</div>';
    }
    html += `<div class="explanation show">
      <div class="result-badge ${cls}">${badge}</div>
      <div class="exp-text"><strong>正确答案：</strong>${formatAnswer(q)}</div>
      <div class="exp-text" style="margin-top:8px"><strong>解析：</strong>${highlightGlossaryTerms(fmtExp(q.e))}</div>
      ${q.s?`<div class="exp-source">来源：${q.s}</div>`:''}
      ${gHtml}
    </div>`;
  }

  html += `<div class="qnav"><h4>题号导航</h4><div class="qnav-grid">`;
  quizState.questions.forEach((qq, i) => {
    const qAnswers = answers.filter(a=>a.id===qq.id);
    const qCor = qAnswers.some(a=>a.ok);
    const qWro = qAnswers.some(a=>!a.ok);
    let cls = '';
    if(i===quizState.currentIdx) cls='current';
    else if(qCor) cls='done-correct';
    else if(qWro) cls='done-wrong';
    html += `<div class="qnav-item ${cls}" onclick="jumpToQuestion(${i})">${i+1}</div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
  if(!finished) updateSubmitButton();
}

function getOptionsHTML(q, userAns, finished, correct, shuffledAns) {
  let html = '';
  const qtype = q.t;
  if(qtype === 'hot') {
    html += `<div class="options-list" style="background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:16px">
      <div style="font-weight:600;color:var(--primary);margin-bottom:8px">🖱 本题为拖拽/操作题（HOTSPOT）</div>
      <div style="font-size:13px;line-height:1.7;color:var(--text2)">本题无标准 A/B/C/D 选项，答题形式为图形拖拽/区域选择。题目与图形见源 PDF 原图，答案请参照源文件。</div>`;
    if(q.e) {
      html += `<div style="margin-top:10px;font-size:13px;line-height:1.7;color:var(--text2);border-top:1px solid var(--border);padding-top:10px"><strong>解析/提示：</strong><br>${highlightGlossaryTerms(fmtExp(q.e))}</div>`;
    }
    html += `</div>`;
    return html;
  }
  if(qtype === 'single' || qtype === 'multiple') {
    const isMulti = qtype === 'multiple';
    html += `<div class="options-list">`;
    const opts = quizState.shuffledOptions && quizState.shuffledOptions[q.id] ? quizState.shuffledOptions[q.id] : q.o;
    opts.forEach(o => {
      const isSelected = userAns && userAns.includes(o.l);
      let cls = 'option-item';
      if(isMulti) cls += ' multi';
      if(isSelected && !finished) cls += ' selected';
      if(finished) {
        if(shuffledAns.includes(o.l)) cls += ' correct';
        else if(isSelected) cls += ' wrong';
      }
      const onclick = finished ? '' : `toggleOption('${o.l}')`;
      html += `<div class="${cls}" onclick="${onclick}">
        <span class="opt-label">${o.l}</span>
        <span>${o.t}</span>
      </div>`;
    });
    html += `</div>`;
    if(isMulti && !finished) html += `<div style="font-size:13px;color:var(--text2);margin-top:-12px;margin-bottom:16px">多选——请选择所有正确答案后提交（至少选2项）</div>`;
  }
  return html;
}

/* ================================================================
   ===================== 交互逻辑 =================================
   ================================================================ */

function toggleOption(label) {
  const q = quizState.questions[quizState.currentIdx];
  if(!quizState.answered) quizState.answered = {};
  if(q.t==='single') {
    quizState.answered[q.id] = [label];
  } else {
    const arr = quizState.answered[q.id] || [];
    const idx = arr.indexOf(label);
    if(idx>=0) arr.splice(idx,1);
    else arr.push(label);
    quizState.answered[q.id] = arr;
  }
  renderQuiz();
}

function updateSubmitButton() {
  const q = quizState.questions[quizState.currentIdx];
  if(q.t === 'hot') return;
  const ans = quizState.answered && quizState.answered[q.id];
  const btn = document.getElementById('submitBtn');
  if(!btn) return;
  if(q.t==='single') btn.disabled = !ans || !ans.length;
  else if(q.t==='multiple') btn.disabled = !ans || ans.length < 2;
}

function getShuffledAnswer(q) {
  if(quizState && quizState.shuffledAnswers && quizState.shuffledAnswers[q.id]) {
    return quizState.shuffledAnswers[q.id];
  }
  return q.a;
}

function isAnswerCorrect(q, userAns) {
  if(!userAns) return false;
  const ca = getShuffledAnswer(q);
  if(q.t==='single') return userAns[0]===ca[0];
  if(q.t==='multiple') { const a=[...userAns].sort(); const b=[...ca].sort(); return JSON.stringify(a)===JSON.stringify(b); }
  return false;
}

function formatAnswer(q) {
  const ca = getShuffledAnswer(q);
  if(q.t==='single'||q.t==='multiple') return ca.join(', ');
  if(q.t==='hot') return '本题为拖拽/操作题，答案为图形区域匹配，见源 PDF 原图';
  return '';
}

function submitAnswer() {
  const q = quizState.questions[quizState.currentIdx];
  let userAns = quizState.answered && quizState.answered[q.id];
  if(!userAns) return;
  if(q.t==='multiple' && userAns.length < 2) {
    alert('多选题至少选择2个答案，当前只选了' + userAns.length + '个');
    return;
  }
  const correct = isAnswerCorrect(q, userAns);
  if(!quizState.submitted) quizState.submitted={};
  quizState.submitted[q.id]=true;
  // 本场作答留痕（考核判分唯一依据；不与全局统计混用）
  if(!quizState.results) quizState.results={};
  quizState.results[q.id]={ua:[...userAns], ok:correct, ts:Date.now()};
  recordAnswer(q.id, userAns, correct);
  renderQuiz();
  updateSubmitButton();
}

function prevQuestion() {
  if(quizState.currentIdx > 0) { quizState.currentIdx--; renderQuiz(); }
}
function nextQuestion() {
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  if(isLast) {
    if(quizState.mode==='exam') renderExamResult();
    else navigate('dashboard');
  } else {
    quizState.currentIdx++;
    renderQuiz();
  }
}
function jumpToQuestion(idx) {
  quizState.currentIdx = idx;
  renderQuiz();
}
function exitQuiz() {
  // 考核中途退出必须停表：否则过期计时器归零时会把之后的练习页改写成「考核成绩单」
  if(quizState && quizState.mode==='exam') stopExamTimer();
  if(quizState && quizState.mode!=='exam') {
    setProgress({mode:quizState.mode,domain:quizState.domain||null,idx:quizState.currentIdx,time:Date.now()});
  }
  quizState = null;
  navigate('dashboard');
}

/* ================================================================
   ===================== 刷题模式启动 ==============================
   ================================================================ */
function startDomain(d) {
  const qs = QUESTIONS.filter(q=>q.d===d);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'domain',domain:d,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startContinue() {
  const p = getProgress();
  if(p.mode && p.mode!=='exam') {
    if(p.mode==='domain' && p.domain) {
      const qs = QUESTIONS.filter(q=>q.d===p.domain);
      const _sr=generateShuffledOptions(qs);
      quizState = {mode:'domain',domain:p.domain,questions:qs,currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    } else {
      const _sr=generateShuffledOptions([...QUESTIONS]);
      quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    }
  } else {
    const _sr=generateShuffledOptions([...QUESTIONS]);
    quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  }
  navigate('quiz');
}
function startWrongReview() {
  const wrong = getWrong().filter(w=>!w.mastered);
  if(!wrong.length) { alert('暂无错题需要复习！'); return; }
  const qs = wrong.map(w=>getQById(w.id)).filter(Boolean);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'wrong',domain:null,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startSingle(id) {
  const q = getQById(id);
  if(!q) return;
  const _sr=generateShuffledOptions([q]);
  quizState = {mode:'single',domain:null,questions:[q],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startExam() {
  // 模拟考核：按 meta 权重 × meta 题数分配各域配额（最大余数法，保证总和=EXAM_COUNT）
  const counts = {};
  let sumInt = 0;
  const raw = {}, rem = {};
  DOMAIN_KEYS.forEach(k => {
    const w = parseFloat(String(DOMAIN_WEIGHTS[k]||'0').replace('%',''))/100;
    raw[k] = w * EXAM_COUNT;
    counts[k] = Math.floor(raw[k]);
    rem[k] = raw[k] - counts[k];
    sumInt += counts[k];
  });
  let deficit = EXAM_COUNT - sumInt;
  const order = [...DOMAIN_KEYS].sort((a,b)=>rem[b]-rem[a]);
  let i = 0;
  while(deficit > 0) { counts[order[i % order.length]]++; deficit--; i++; }
  let selected = [];
  DOMAIN_KEYS.forEach(d => {
    const pool = shuffle(QUESTIONS.filter(q=>q.d===d && q.t!=='hot'));
    selected.push(...pool.slice(0, counts[d]));
  });
  selected = shuffle(selected);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam',domain:null,questions:selected,currentIdx:0,answered:{},submitted:{},results:{},shuffledOptions:_exam.opts,shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  // 场次标识：计时回调据此判定「本场是否仍在进行」，防过期计时器串场
  quizState.examToken = 'ex-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

let examTimerInterval = null;
function stopExamTimer() {
  if(examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
}
function startExamTimer() {
  let secs = quizState.examDuration;
  const token = quizState.examToken;
  const timerEl = document.getElementById('quizTimer');
  if(!timerEl) return;
  stopExamTimer();
  examTimerInterval = setInterval(() => {
    // 场次校验：已退出或已换场（新 token）立即自毁
    if(!quizState || quizState.mode!=='exam' || quizState.examToken!==token) { stopExamTimer(); return; }
    secs--;
    const m = Math.floor(secs/60), s = secs%60;
    const el = document.getElementById('quizTimer');
    if(el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if(secs<=60 && el) el.classList.add('warning');
    if(secs<=0) { stopExamTimer(); finishExam(token); }
  }, 1000);
}

function finishExam(token) {
  stopExamTimer();
  // 只对「发起本场计时」的考核会话生效
  if(quizState && quizState.mode==='exam' && (token===undefined || quizState.examToken===token)) renderExamResult();
}

function renderExamResult() {
  if(!quizState) return;
  stopExamTimer();
  const qs = quizState.questions;
  const results = quizState.results || {};
  const total = qs.length;
  // 逐题按本场作答判分；全局历史与往场作答一律不计
  let correct = 0, wrong = 0, unanswered = 0;
  const domStat = {};
  DOMAIN_KEYS.forEach(d => domStat[d] = {n:0, cor:0});
  qs.forEach(q => {
    if(!domStat[q.d]) domStat[q.d] = {n:0, cor:0};
    domStat[q.d].n++;
    const r = results[q.id];
    if(!r) unanswered++;
    else if(r.ok) { correct++; domStat[q.d].cor++; }
    else wrong++;
  });
  // 不变量自校验：正确 + 错误 + 未答 必须等于试卷题数
  if(correct + wrong + unanswered !== total) console.warn('[exam] 判分不变量异常', {correct, wrong, unanswered, total});
  const el = document.getElementById('page-quiz');
  const pct = total ? Math.round(correct/total*100) : 0;
  // 1000-point scale, 700 to pass
  const scaledScore = total ? Math.round(correct/total*1000) : 0;
  const passed = scaledScore >= EXAM_PASS;
  // Time used
  const timeUsed = quizState.examStartTime ? Math.round((Date.now()-quizState.examStartTime)/1000) : 0;
  const timeM = Math.floor(timeUsed/60), timeS = timeUsed%60;

  // Domain breakdown
  let domainHtml = '';
  for(const d of DOMAIN_KEYS) {
    const dd = domStat[d] || {n:0, cor:0};
    const dPct = dd.n ? Math.round(dd.cor/dd.n*100) : 0;
    domainHtml += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${dd.n}</td><td>${dd.cor}</td><td style="color:${dPct>=70?'var(--correct)':'var(--wrong)'}">${dPct}%</td></tr>`;
  }

  el.innerHTML = `<div class="header"><button class="back-btn" onclick="exitExam()">←</button><h1>📋 考核成绩单</h1></div>
  <div style="text-align:center;padding:30px 20px">
    <div style="font-size:48px;font-weight:700;color:${passed?'var(--correct)':'var(--wrong)'}">${scaledScore}</div>
    <div style="font-size:14px;color:var(--text2);margin:4px 0">满分 1000 分 | 及格线 ${EXAM_PASS} 分</div>
    <div style="font-size:16px;color:var(--text);margin:12px 0;font-weight:600">${passed?'✅ 通过！':'❌ 未通过'}</div>
    <div style="display:flex;justify-content:center;gap:20px;margin:16px 0;flex-wrap:wrap">
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--correct)">${correct}</div><div style="font-size:12px;color:var(--text2)">正确</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--wrong)">${wrong}</div><div style="font-size:12px;color:var(--text2)">错误</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text2)">${unanswered}</div><div style="font-size:12px;color:var(--text2)">未答</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--primary)">${pct}%</div><div style="font-size:12px;color:var(--text2)">正确率</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text)">${timeM}分${timeS.toString().padStart(2,'0')}秒</div><div style="font-size:12px;color:var(--text2)">用时</div></div>
    </div>
  </div>
  <div class="stats-chart">
    <h3>各章节成绩</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>题数</th><th>正确</th><th>正确率</th></tr></thead><tbody>
    ${domainHtml}
    </tbody></table>
  </div>
  <div style="text-align:center;padding:20px">
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn-secondary" onclick="exitExam()" style="width:auto">返回首页</button>
      <button class="btn-primary" onclick="startExam()" style="width:auto;flex:none">再考一次</button>
    </div>
  </div>`;
  quizState = null;
}

function exitExam() {
  quizState = null;
  navigate('dashboard');
}

        <div class="wi-header">

function renderStats() {
  const s = getStats();
  const el = document.getElementById('page-stats');
  let html = `<div class="header"><h1>📊 统计分析</h1></div>`;
  html += `<div class="stats-chart">
    <h3>总进度</h3>
    <div style="height:30px;background:var(--border);border-radius:15px;overflow:hidden">
      <div style="height:100%;width:${s.completion}%;background:var(--primary);border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600">${s.completion}%</div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--text2)">
      <span>已答 ${s.doneIds}/${QUESTIONS.length} 题</span>
      <span>正确率 ${s.acc}%</span>
    </div>
  </div>`;
  html += `<div class="stats-chart"><h3>各章节正确率</h3><canvas id="chartDomain"></canvas></div>`;
  html += `<div class="stats-chart"><h3>各题型正确率</h3><canvas id="chartType"></canvas></div>`;
  html += `<div class="stats-chart"><h3>详细数据</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>总题</th><th>已答</th><th>正确</th><th>正确率</th></tr></thead><tbody>`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${ds.total}</td><td>${ds.answered}</td><td>${ds.correct}</td><td style="color:${ds.acc>=70?'var(--correct)':'var(--wrong)'};font-weight:600">${ds.acc}%</td></tr>`;
  }
  html += `</tbody></table></div>`;
  el.innerHTML = html;
  setTimeout(() => {
    drawDomainChart(s);
    drawTypeChart(s);
  }, 50);
}

function drawDomainChart(s) {
  const c = document.getElementById('chartDomain');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = DOMAIN_KEYS.map(k=>'D'+k);
  const colors = ['#4361ee','#4cc9f0','#06d6a0','#f8961e','#9b5de5'];
  const barW = (W-80) / (labels.length*1.5);
  labels.forEach((l,i)=>{
    const val = s.domainStats[i+1].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(l, x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

function drawTypeChart(s) {
  const c = document.getElementById('chartType');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = ['单选','多选'];
  const keys = ['single','multiple'];
  const colors = ['#4361ee','#4cc9f0'];
  const barW = (W-80) / 4;
  keys.forEach((k,i)=>{
    const val = s.typeStats[k].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

/* roundRect polyfill */
if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(r>w/2) r=w/2;
    if(r>h/2) r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    return this;
  };
}

function exportData() {
  const data = {
    answers: getAnswers(),
    wrong: getWrong(),
    progress: getProgress(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${LS_PREFIX}-quiz-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.answers) setAnswers(data.answers);
        if(data.wrong) setWrong(data.wrong);
        if(data.progress) setProgress(data.progress);
        alert('数据导入成功！');
        navigate(currentPage);
      } catch(err) { alert('数据格式错误，请检查文件。'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetData() {
  showModal('确认重置', '确定要清除所有答题记录、错题集和进度吗？此操作不可恢复！', () => {
    localStorage.removeItem(LS_ANSWERS);
    localStorage.removeItem(LS_WRONG);
    localStorage.removeItem(LS_PROGRESS);
    navigate('dashboard');
  });
}

let modalCallback = null;
function showModal(title, text, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOverlay').classList.add('show');
  modalCallback = onConfirm;

function closeModal() {

  document.getElementById('quizView').classList.toggle('dark');

function init() {
  if(localStorage.getItem(LS_PREFIX+'_theme')==='dark') document.getElementById('quizView').classList.add('dark');
  const pages = ['dashboard','quiz','wrongbook','stats','settings'];
  const app = document.getElementById('app');

    div.className = 'page' + (p==='dashboard'?' active':'');

  document.querySelectorAll('.nav-item').forEach(btn => {

  });
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', init);

const LEARNING_DATA = {"meta":{"exam":"TC-FDE","title":"腾讯云 ADP 前沿部署工程师 (FDE) 学习与刷题","lang":"zh","updated":"2026-09-29","level":"FDE","cnName":"腾讯云 ADP 前沿部署工程师认证","examInfo":{"quickCards":[{"num":"60","label":"考试题数","sub":"40 单选 × 1.5 分 + 20 多选 × 2 分"},{"num":"90min","label":"考试时长","sub":"线下闭卷机考（Prometric，代码 C1721）"},{"num":"70","label":"合格线（满分 100）","sub":"无免费补考，未通过需重购"},{"num":"1200元","label":"考试费用","sub":"证书有效期 2 年"}]},"plan":[{"day":1,"topic":"第1章 AI 与 Agent 基础（域1 10%）","focus":"概念图谱、大语言模型与注意力机制、Agent 架构","domain":1},{"day":2,"topic":"第2章 ADP 平台产品能力（域2 7% + 域3 22%）","focus":"定位边界、基础能力、知识与连接、任务编排、发布交付","domain":2},{"day":3,"topic":"第3章 场景理解与方案设计（域4 25%，最大权重）","focus":"七维度翻译法、构建模式选型、方案画布、验收指标设计","domain":3},{"day":4,"topic":"第4章 行业解决方案与案例落地（域5 15%）","focus":"行业场景图谱、案例拆解方法、综合案例实战","domain":4},{"day":5,"topic":"第5章 交付实施、评测与运维（域6 11%）","focus":"调试五步法、评测集建设、调优路径、上线运营","domain":5},{"day":6,"topic":"第6章 安全合规与责任 AI（域7 10%）+ 全库刷题","focus":"数据权限、内容安全、幻觉治理、国内法规合规边界","domain":6}]},"chapters":[{"domain":1,"name":"AI 与 Agent 基础","weight":"10%","practice":[],"sections":[{"h":"1.1 人工智能与生成式 AI 概念图谱","body":"人工智能这个词，最近几年几乎无处不在。但真要给客户做智能体交付，第一步反而是把这个大词拆开、讲清楚。因为客户口中的「人工智能」，往往和你要交付的东西不是一回事。\n\n这一节我们把概念图谱铺开。目标很实在：让你面对客户时能快速定位，他要的到底在图谱的哪一格。定位准了，后面的方案设计才不会跑偏。\n\n可以先记住一句话：越往图谱内层走，概念越具体，能落地的东西越清晰。客户往往站在最外层说话，而你要能带他走到能交付的那一层。\n\n**人工智能是一个大圈，机器学习是里面的一个圈。**\n\n可以用层层嵌套来理解它们的关系。最外层是人工智能，指让机器表现出类似人的智能行为这一整个目标领域。往里一层是机器学习，指不靠人手写死规则、而是让机器从数据里自己找规律的方法。再往里是深度学习，指用多层神经网络来学习的那一支。\n\n举个场景就清楚了。某物流公司想让系统自动识别快递面单上的地址。早年的做法是工程师一条条写规则，比如遇到「省」字就往前截取，这属于传统人工智能里的规则系统。\n\n规则系统有个天生的毛病。面单格式一变，规则就失灵，工程师得不停打补丁。地址写法千变万化，补丁永远打不完。\n\n后来他们改了思路。给系统看几十万张真实面单，让它自己去学地址的规律，这就是机器学习。工程师不再写死规则，而是准备数据、教它认。\n\n而真正让识别准确率大幅提升的多层网络模型，就是深度学习。层数越多，模型能捕捉的规律越细，认得越准。\n\n所以三者不是并列的对手。它们是一个比一个具体的圈，外圈套着内圈。你跟客户讲清这层嵌套，很多误会当场就化解了。\n\n**生成式 AI 是深度学习结出的新果子，它的特点是「生成」。**\n\n传统的机器学习模型大多在做判断题。这张图是猫还是狗，这笔交易是不是欺诈，它们的输出是一个标签或一个分数。\n\n生成式 AI 不一样。它的输出是全新的内容，一段文字、一张图、一段代码。它不是从选项里挑一个，而是无中生有地造出来。\n\n这个差别对交付工作影响极大。判断类模型你只要评估准确率就行，对错分明。而生成类模型的输出没有唯一标准答案，同一个问题它可以有一百种合理回答。\n\n举个例子。某市场团队让模型写一句活动标语，模型给了十条，条条通顺，风格各异。你没法说哪条「对」、哪条「错」，只能说哪条更合口味。\n\n生成的不只是文字。某设计团队用生成式 AI 快速出海报草图，一个下午能出几十版初稿，再从里面挑方向。放在过去，这几十版要画上好几天。\n\n这说明生成式 AI 真正改变的，是「产出初稿」的成本。它未必一步到位，但能把从零到一的那段路大幅缩短。对交付来说，这正是很多场景值得引入它的理由。\n\n正因为如此，才有了后面章节要反复讲的评测难题和幻觉治理。这两件事都是生成式的天性带来的，绕不开。\n\n换句话说，生成式 AI 把 AI 的能力从「看懂」推进到了「产出」。这一步，也是智能体这种新形态能够出现的前提。\n\n**大语言模型是生成式 AI 里最主流的一支。**\n\n生成式 AI 能生成文字、图片、音频、视频等多种内容。其中专门生成和理解文字的模型，叫大语言模型。之所以叫「大」，是因为它的参数规模和训练数据都极其庞大。\n\n你在客户现场接触到的智能体项目，底座绝大多数都是大语言模型。所以把它的脾气摸清楚，是这一章的重点。\n\n这里要给客户建立一个正确预期。大语言模型的强项是语言理解和文字生成，它天然擅长读文档、写文案、做问答、抽信息。\n\n但它也有明显的短板。它不是数据库，不会精确记住某条具体数据，也不做严谨的数值计算。这一点客户常常误解。\n\n某财务团队就踩过坑。他们希望用大模型直接算月度报表的合计数，结果发现模型会「算错账」。数字看着像那么回事，一核对却对不上。\n\n这不是模型坏了，而是用错了地方。让一个擅长写文章的大脑去做精算，本就是强人所难。\n\n正确的做法是让模型去理解需求，再调度工具来算数。理解交给模型，计算交给工具，各司其职。这一点，正是智能体架构要解决的核心问题之一。\n\n这里再多说一句大语言模型的「记性」。它并不会天然记得你上一轮说过什么，除非你把上文一起喂给它。所以很多客户抱怨「它怎么转头就忘」，根子不在模型笨，而在没给它接上记忆。\n\n某教育机构做过一个问答助手，第一版每轮对话都像初次见面，用户体验很差。后来接上了对话记忆，助手才终于能记住用户是谁、之前聊到哪，体验一下子就顺了。记忆这件事，后面第二章会讲 ADP 是怎么帮你管起来的。\n\n**智能体（Agent）是让大语言模型「会做事」的那层封装。**\n\n如果说大语言模型是一个很会聊天、很会写字的大脑，那么智能体就是给这个大脑装上了手脚和记忆。它不只是回答问题，而是能真正完成一件事。\n\n智能体能理解目标、拆解步骤、调用外部工具、记住上下文，最后交付一个结果。这一连串动作，是纯模型做不到的。\n\n举个直观的对比。你让大语言模型「帮我订下周去某城市的机票」，纯模型只能告诉你订票的一般流程，讲得头头是道，却订不了。\n\n而一个智能体可以真的去查航班、比价格、填信息、下订单。它把「说」变成了「做」。\n\n再看一个客户现场的例子。某连锁门店想要一个能自动回复顾客咨询的助手，顾客问「我上周的订单到哪了」，纯模型只会解释一般查询方式。而智能体能接上订单系统，查到真实物流，再用自然语言回给顾客。\n\n差别就在于智能体能「动手」。而这套能动手的能力，正是企业级智能体开发平台 ADP 要提供的。后面第二章会专门讲 ADP 是怎么把这套能力封装好、交到你手上的。\n\n不过「能动手」也要讲边界。智能体动手的前提，是你给它接好了工具、划定了权限。它不会凭空长出连接订单系统的能力，是你在平台上配好的。\n\n这一点在客户沟通时很有用。客户常以为智能体买来就万能，其实它的本事有多大，取决于你给它接了哪些工具、开了哪些权限。把这层讲透，客户对交付范围的预期就实在了。\n\n还要提醒一句安全的分寸。智能体既然能动手，就意味着它有可能动错手。所以在真正放它去操作关键系统前，往往先让它「只读」或「先审后做」。这类权限和审核的设计，后面第六章会专门展开。\n\n到这里，概念图谱的主线就串起来了。人工智能是大目标，机器学习是主流方法，深度学习是其中的强力分支。生成式 AI 是深度学习结出的、能产出内容的果子，大语言模型是其中主攻文字的一支，而智能体是让大语言模型真正能做事的封装。\n\n**这些概念之间，是一条能力递进的链。**\n\n把链条再走一遍会更有体感。机器学习让机器学会从数据里找规律。深度学习让这种学习能力上了一个台阶。生成式 AI 让机器从判断走向创造。大语言模型让创造聚焦在语言上。智能体则让语言能力接上了工具和记忆。\n\n每一环都踩着上一环的肩膀。你理解了这条递进链，就能回答客户几乎所有的「这跟那有什么区别」的问题。\n\n而对交付工程师最关键的一环，是最后那一跳：从大语言模型到智能体。因为你交付的东西，几乎都落在这一跳之上。\n\n**为什么交付工程师必须先理清这张图谱。**\n\n客户在沟通时经常混用这些词。有的客户说「我要上 AI」，其实他要的是一个能自动回客服消息的智能体。有的客户说「你们的模型能不能学我们的数据」，其实他担心的是数据安全和知识库。\n\n如果你分不清这些概念，就会答非所问，甚至给出无法落地的承诺。承诺一旦落空，后面的交付就会处处被动。\n\n另外，理清图谱还能帮你管理客户预期。当客户提出「让 AI 保证百分之百准确」这类要求时，你要能从生成式 AI 的原理出发讲道理。\n\n具体怎么讲？告诉他生成类输出天然存在不确定性，这是原理决定的，不是能力问题。然后把话题引导到「如何通过评测和约束把风险降到可接受范围」。这样既没有夸口，也没有泼冷水。\n\n需要注意的是，管理预期不等于唱衰技术。你要让客户感到，你比他更懂这项技术的边界，因此更值得托付。这种专业的分寸感，本身就是交付工程师的价值。\n\n还有一点容易被忽略。图谱清晰的人，报价和排期也会更准。因为你知道哪些需求落在模型的能力圈内、哪些要额外搭工具和知识库，工作量自然估得准。\n\n再补一个实战习惯。每次和客户开场，先花几分钟用大白话把这张图谱画一遍，确认双方说的是同一件事。这个小动作，能省掉后面大量的来回扯皮。\n\n怎么画？不必搬术语。你可以顺着问客户三句话：你想让它帮你做什么、这件事现在谁在做、做的时候最头疼哪一步。三句话问下来，需求大致落在图谱哪一格，你心里就有数了。\n\n这套开场法看似简单，却能快速把客户从「我要上 AI」这类空话，带到「我要一个能自动回订单咨询的助手」这类实话。需求越实，方案越好落。\n\n总结这一节。概念图谱不是学术分类练习，而是你和客户对话的通用坐标系。把客户的模糊需求快速定位到图谱的某一格，是需求分析的第一步，也是后面所有交付动作的起点。图谱在你心里越清晰，你在客户面前就越从容。"},{"h":"1.2 大语言模型与注意力机制","body":"上一节我们知道了大语言模型是智能体的底座。这一节往里走一层，看看这个底座到底怎么运转。不需要你会推公式，但你要能用大白话讲清楚两件事：模型为什么能「听懂话」，又为什么会「说错话」。这两点直接决定你在方案设计时的取舍。\n\n**大语言模型的本质，是一个「预测下一个词」的机器。**\n\n听起来简单得让人怀疑。但它做的核心事情确实就是这个。给它一段话，它预测接下来最可能出现的那个词，接上去，再预测下一个，如此循环，直到把回答生成完。\n\n它写出的每一句流畅的话，底层都是一次又一次的「下一个词」接龙。没有魔法，只有概率。\n\n这也解释了为什么同一个问题问两次，模型的回答可能不完全一样。因为每一步的「下一个词」都是从若干个高概率候选里选的，略有随机，结果自然有浮动。\n\n理解这一点非常有用。它能解释模型很多看似奇怪的行为，后面会反复用到。\n\n某咨询团队第一次用大模型写行业报告，发现模型引用了一份根本不存在的文献，格式却工整得像真的。这不是模型故意骗人。它只是在「预测最像样的下一个词」，当真实信息缺位时，就用最通顺的表达把话补完了。\n\n这就引出一个关键认知。模型追求的是「像」，不总是「真」。这条认知，是后面理解幻觉的钥匙。\n\n再看一个场景。某市场团队让模型总结一份产品资料，结果模型「顺手」补了一条资料里没有的卖点。听起来很合理，却是它编的。根子还是那句话：它在补最像样的下一个词，而不是核对事实。\n\n**注意力机制，是模型能「抓重点」的关键。**\n\n一句话里，不是每个词分量都一样。比如「这家开在沿海城市、主营出海业务的公司，去年营收增长很快」，要理解「营收增长」说的是谁，模型得把注意力投回句子开头的「这家公司」。\n\n注意力机制做的就是这件事。处理每一个词时，让模型动态判断句中哪些词和当前词最相关，给相关的词分配更多「注意力」。\n\n正是靠这个机制，模型才能在长句、长文里抓住真正相关的部分，而不是机械地按顺序读。\n\n打个比方。你读一份很长的合同时，眼睛会自动在关键条款之间来回跳，把相关段落联系起来理解，而不是从头匀速扫到尾。模型也是这样「跳读」和「关联」的。\n\n这里藏着一个交付提醒。注意力虽强，却不是万能。当关键信息被埋在大量无关内容里，模型也可能看走眼，漏掉真正要紧的那句。所以与其指望它在长文里大海捞针，不如你先把相关内容筛出来递到它眼前。筛选这一步，常常比换更强的模型更管用。\n\n某法务团队让模型审一份结构复杂的协议，模型能把分散在前后的相关条款联系起来给意见，靠的正是这套注意力机制。\n\n注意力也有代价。句子越长、信息越杂，注意力就越分散。这就像你同时盯十件事，每件都顾不周全。所以给模型的输入不是越多越好，抓重点反而更重要。\n\n**上下文窗口，决定了模型一次能「看」多少内容。**\n\n模型不是无限记忆的。它一次能处理的文字长度有上限，这个上限叫上下文窗口。窗口内的内容模型都能看到并参与推理，超出窗口的部分就看不见了。\n\n这个限制在交付时很关键。某法务团队想让智能体一次读完一份上百页的长合同再回答问题。如果合同长度超出窗口，模型只能看到截断后的一部分，回答自然不完整。\n\n解决办法不是硬塞。而是引入后面章节会讲的知识库和 RAG，把长文档切成片段，按需检索相关部分喂给模型。\n\n需要注意的是，即便在窗口范围内，内容太长也会稀释注意力，让模型抓不准重点。所以方案设计时，喂多少、喂什么，本身就是一门要权衡的手艺。\n\n换句话说，上下文窗口既是容量的边界，也是质量的变量。塞得越满，未必读得越好。\n\n某研究团队做过一个对比。把一份长材料整篇塞给模型，回答含糊；把材料先挑出最相关的两三段再喂，回答立刻精准。同样的模型，喂法不同，效果差很远。\n\n**模型还有个「随机性」旋钮，交付时要心里有数。**\n\n前面说过，同一个问题模型可能给出略有不同的回答。这种随机程度，在很多平台上是可以调的。\n\n调低随机性，模型的回答更稳定、更保守，适合客服问答、合规场景这类要求一致的地方。调高随机性，模型更发散、更有创意，适合写文案、想点子这类要求多样的地方。\n\n某品牌团队做过一个安排。给客服助手用低随机性，保证同样的问题答得一致；给创意助手用高随机性，让它每次都能蹦出新花样。同一个底座模型，两种脾气，各用其长。\n\n作为交付工程师，你要能根据场景给客户建议合适的档位。要一致就调低，要创意就调高，这也是方案设计的一部分。\n\n这个建议看似小，客户却很买账。因为它说明你不是把模型原样丢过去，而是替他把脾气调到了最合适的状态。\n\n**模型不是搜索引擎，这个区别要给客户讲透。**\n\n很多客户第一反应是把模型当搜索引擎用，以为它能实时查到最新信息。这是个常见的误会。\n\n模型的知识来自训练时喂给它的数据，训练之后发生的事情，它并不知道。你问它一件很新的事，它要么说不知道，要么按老知识作答，甚至编一个像样的答案。\n\n某企业想用模型回答「我们公司最新的报销政策」，结果模型答得头头是道，却全是它编的。因为公司的内部政策根本不在它的训练数据里。\n\n正确的做法是把最新的、专有的信息放进知识库，让模型查了再答。这样模型负责组织语言，知识库负责提供事实，两者配合才靠谱。这套配合，正是后面知识库和 RAG 章节的核心。\n\n**提示词（Prompt），是你和模型对话的方向盘。**\n\nPrompt 就是你给模型的输入指令。同样一个模型，Prompt 写得好不好，输出质量可以天差地别。\n\n这不是玄学。模型是根据你给的上下文来预测下一个词的，你的引导越清晰、越具体，它接龙的方向就越准。\n\n举个场景。某客服团队让模型「回复客户投诉」，得到的回答空泛又客套。后来把指令改成「你是一名资深客服，请用不超过三句话，先共情再给解决方案，回复这条投诉」，输出立刻变得可用。\n\n差别在哪？后一条指令明确了角色、格式、语气和结构，把模型的接龙方向牢牢框住了。模型没变，是指令变了。\n\n所以 Prompt 是交付工程师最轻量、也最高频的调优手段。后面第五章会专门讲 Prompt 调优，这里你先记住一句话：模型的表现，很大程度上是被你的指令喂出来的。\n\n这里还有个实用技巧。写 Prompt 时，与其笼统说「写得专业点」，不如给个具体样例或明确约束。模型对具体的引导最敏感，对抽象的形容词反而不敏感。\n\n**把这几点串起来，就得到模型的能力边界。**\n\n先看它擅长什么。理解自然语言、生成流畅文本、按指令改写和总结、从文字里抽取信息，这些都是它的强项。\n\n再看它不擅长什么。精确记忆具体数据、做严谨数值计算、保证事实百分之百准确、处理超出上下文窗口的超长内容，这些都是它的短板。\n\n作为交付工程师，你的价值恰恰在于清楚这条边界。当客户的需求落在擅长的一侧，你可以放心承诺。当需求落在不擅长的一侧，你要能提出补救的架构。\n\n怎么补救？用工具补计算、用知识库补记忆、用评测和约束补准确性。每一种短板，都有对应的解法，这也是后面几章的主线。\n\n把这四种补法记牢，你就有了一套应对短板的工具箱。客户的需求再五花八门，无非是往这四个方向里对号入座。\n\n某零售团队想让智能体既能聊促销活动、又能精确报出库存数字。聊活动是模型的强项，报库存是短板。正确的做法不是让模型硬记库存，而是给它接上库存系统这个工具，实时查了再答。\n\n**为什么这一节的原理，值得交付工程师认真吃透。**\n\n因为你面对客户时的每一个承诺，背后都是这套原理在支撑。你说「能做」，是因为需求落在模型强项内。你说「要加个知识库」，是因为你判断出了它的记忆短板。\n\n如果不懂原理，你就只能鹦鹉学舌地报功能，客户一追问就露怯。懂了原理，你才能因地制宜地设计方案，也能从容地管理客户预期。\n\n**怎么把这些原理讲给不懂技术的客户听。**\n\n你不必搬术语。客户要的不是名词，而是安心。\n\n讲「预测下一个词」，可以说成「它像一个见多识广的写作助手，顺着话头往下写，写得很顺，但不保证每个细节都核对过」。客户一下就懂了为什么会有幻觉。\n\n讲上下文窗口，可以说成「它一次能读的篇幅有限，太长的材料得先切一切、挑重点喂给它」。客户就明白为什么要建知识库。\n\n某次和一位客户沟通，对方非要模型「记住」公司全部历史订单。用大白话把窗口限制一讲，再把知识库方案一摆，客户当场就接受了替代方案。原理讲透，方案才好推。\n\n所以这一节的原理，不只是你自己要懂，更是你和客户之间那座桥。桥搭好了，后面的方案沟通就顺了。\n\n再补一个习惯。每次讲原理，都尽量配一个客户身边的例子。抽象的机制配上具体的场景，客户才真正记得住、信得过。这一点，贯穿你和客户打交道的始终。\n\n总结这一节。大语言模型是一个靠预测下一个词运转、靠注意力机制抓重点、受上下文窗口限制、被 Prompt 引导方向的语言大脑。理解它的运转逻辑，你才能既用好它的长处，又替客户守住它的短板。这份理解，是所有智能体方案设计的地基。"},{"h":"1.3 智能体（Agent）概念与架构","body":"上一章我们讲清了大语言模型是智能体的底座。这一节我们把镜头对准智能体本身。你要能向客户讲明白：智能体到底由哪几块拼成，它又是怎么把一个目标一步步做完的。\n\n**智能体不是一个模型，而是一套「会做事」的系统。**\n\n很多人以为智能体就是换了个名字的大语言模型。这是个常见误解。大语言模型是智能体的大脑，但光有大脑不能做事。智能体是把大脑、手脚、记忆、工具箱组装到一起的完整系统。\n\n打个比方。大语言模型像一个很聪明的人被关在空房间里，他什么都懂，却够不到外面的任何东西。智能体则给这个人配了电话、电脑、记事本和一屋子工具，让他能真正去办事。\n\n某银行网点想做一个业务咨询助手。如果只用大语言模型，它能回答「房贷利率一般怎么算」这类通用问题。但客户真正想问的是「我这笔贷款这个月该还多少」，这就需要智能体去调用系统查真实数据，纯模型答不了。\n\n这里要和客户澄清一个词。有人把智能体和传统的自动化流程混为一谈。传统流程是把每一步都写死的固定管道，遇到没预设的情况就卡住。智能体的不同在于，它能理解意图、临场决定下一步怎么走。\n\n举个对比。传统流程像一条只会直行的传送带，来什么货都按同一条路送。智能体则像一个有判断力的分拣员，看货物情况随时改路线。这种随机应变的能力，是智能体真正值钱的地方。\n\n**智能体的核心，是一个「感知—规划—行动—记忆」的循环。**\n\n要理解智能体怎么运转，记住这四个环节就够了。它先感知任务和环境，再规划要走哪几步，然后逐步行动，最后把过程和结果记下来。\n\n感知，是指智能体读懂用户到底要什么。用户说「帮我整理上周的销售情况」，智能体要先听懂这句话背后的意图，是要一张表，还是要一段总结。\n\n规划，是指把大目标拆成小步骤。整理销售情况这件事，可能要先查数据、再算汇总、最后写成报告。智能体会把这条路径先想清楚。\n\n行动，是指真正动手执行每一步。该查数据就调数据工具，该算数就调计算工具，该写报告就用大语言模型生成文字。\n\n记忆，是指把上下文和中间结果存住。这样多轮对话里，智能体才记得住之前聊过什么，不会每轮都从头再来。\n\n这四步不是走一遍就结束。复杂任务里它会循环很多轮，行动的结果又变成新的感知，再触发新的规划。这个循环，正是智能体比纯模型强的地方。\n\n这个循环里还藏着一个交付要点，就是该在哪一步让人介入。全自动听着美，但风险高的环节最好留个人工确认。\n\n某财务团队的报销助手就设了这样一道关。智能体把单据审完、金额算好，但真正打款前会停下来，等人点一下确认。既享受了自动化的快，又守住了钱的安全。这种「关键一步等人决策」的设计，几乎每个企业级项目都用得上。\n\n**规划能力，决定了智能体能啃下多复杂的任务。**\n\n简单任务一步到位，不需要规划。但真实业务里的任务往往是多步的，步骤之间甚至还有依赖。这时候规划能力就成了胜负手。\n\n某电商团队想让智能体处理售后退货。这件事不是一句话能完成的。要先核对订单、再判断是否符合退货政策、然后生成退货单、最后通知仓库。\n\n如果智能体不会规划，它就会卡在第一步答非所问。会规划的智能体，则能把这四步排好顺序，一步步推进，中间某步出错还能退回来重试。\n\n需要注意的是，规划不是越复杂越好。步骤拆得太碎，反而容易在中间环节累积误差。方案设计时，把任务拆到「刚好能稳定完成」的粒度，是一门需要经验的手艺。\n\n好的智能体还会「反思」。执行完一步，它会回头看看结果对不对，不对就调整再来。这一点在多步任务里尤其重要。\n\n某内容团队用智能体写推广文案。第一版生成后，智能体自己先检查有没有跑题，发现偏了就重写，直到符合要求才交出来。这种自我检查的习惯，能把出错率压下去不少。\n\n**工具调用，是智能体伸向真实世界的手。**\n\n大语言模型本身只会生成文字。它不会查数据库，不会发邮件，不会下订单。智能体要做成事，就得能调用外部工具。\n\n工具可以是一个查询接口，也可以是一个计算函数，还可以是一个业务系统的入口。智能体在行动环节判断该用哪个工具，把参数填好，调用它，再把返回结果接着用。\n\n某物流公司的调度助手就是靠工具干活的。用户问「这批货能不能今天发」，智能体调用库存工具查有没有货，再调用运力工具查有没有车，两个结果一合并，才能给出靠谱的回答。\n\n换句话说，工具让智能体从「会说」变成了「会做」。你给它接的工具越合适，它能办的事就越实在。后面第二章会讲 ADP 是怎么帮你把工具接给智能体的。\n\n不过工具也不是接得越多越好。工具太多，智能体反而会挑花眼，选错工具。合适的做法是按业务需要，精挑几个真正用得上的工具接进去。\n\n某客服团队一开始给助手接了十几个工具，结果它常常调错。后来砍到三四个高频工具，准确率立刻回升。工具在精不在多，这是交付时容易踩的坑。\n\n**记忆，让智能体在多轮对话里不「失忆」。**\n\n大语言模型天然是健忘的。它不会记得你上一句说了什么，除非你把上文再喂一遍。智能体要长期陪着用户干活，就必须有记忆。\n\n记忆分两种。一种是短期记忆，管的是当前这段对话的上下文，让智能体记得刚才聊到哪。另一种是长期记忆，管的是跨越多次对话都要留住的信息，比如用户的偏好和历史。\n\n某在线教育平台的学习助手用到了长期记忆。学生这周问过的薄弱知识点，下周再来时助手还记得，能接着上次的进度辅导。没有长期记忆，每次都像初次见面，体验会很差。\n\n关键限制在于，记忆不是越多越好。把无关的历史全塞进去，反而会干扰当前判断。智能体要挑真正相关的记忆来用，这也是方案设计里要权衡的点。\n\n还要分清记忆和知识库两件事。记忆存的是和某个用户、某段对话相关的动态信息。知识库存的是相对固定的专业资料，比如产品手册和制度文档。\n\n某医疗团队的导诊助手就同时用到两者。它靠知识库记住通用的科室分诊规则，靠记忆记住当前患者已经描述过的症状。两者配合，才答得又准又贴心。\n\n**智能体的架构，可以拆成大脑、记忆、工具和编排四层。**\n\n把前面几块合起来看，智能体的架构就清楚了。最核心是大脑，也就是大语言模型，负责理解和生成。旁边是记忆，负责存上下文和长期信息。再接一圈工具，负责伸向真实系统。最外面是编排，负责把这几块按流程串起来。\n\n编排这一层特别关键。它决定了大脑什么时候该调工具、什么时候该查记忆、多个步骤怎么衔接。简单的编排是一条直线走到底，复杂的编排则会有分支、有循环、甚至多个智能体协作。\n\n某保险公司的理赔助手就用了带分支的编排。遇到简单理赔，走自动流程直接办结。遇到复杂理赔，编排会把它转给人工，智能体只做辅助。这种「简单自动、复杂转人」的设计，正是编排层的价值。\n\n编排还能让多个智能体协作。一个复杂任务可以拆给几个各有专长的智能体，各做一段，再把结果拼起来。这就是后面会讲到的 Multi-Agent 模式。\n\n某传媒机构做选题策划时就这么干。一个智能体负责找热点，一个负责写提纲，一个负责配图建议，最后由编排把三份产出汇总成完整方案。分工协作，比单个智能体硬扛效率高得多。\n\n**理解架构，是为了在方案设计时知道该动哪一块。**\n\n对交付工程师来说，讲清架构不是为了炫技，而是为了对症下药。客户的问题往往能定位到某一层。\n\n如果客户抱怨智能体答不准专业问题，多半是知识不足，要在记忆和知识库这一层补。如果客户说它办不了实际业务，多半是工具没接够，要在工具层补。如果客户说它多步任务老出错，多半是编排没设计好，要在编排层调。\n\n这样一来，架构就成了你排查问题的地图。哪一层出问题，就去调哪一层，不用把整个系统推倒重来。\n\n也要提醒客户一句边界。智能体再能干，也是在你给的工具、知识和权限范围内做事。它不会凭空变出没接过的能力，也不该拿到不该给的权限。\n\n某集团做行政助手时就守住了这条线。助手能查考勤、能订会议室，但碰不到薪资数据，因为那块权限根本没开给它。能力给到位、权限卡到位，智能体才既好用又让人放心。\n\n这张地图还能帮你估工作量。客户提一个需求，你在心里过一遍四层，就知道哪几层要动、动多少。报价和排期自然就有了依据。\n\n某零售集团想升级会员助手，需求听着大。用四层地图一拆，发现只需在工具层多接一个积分查询、在编排层加一条分支，其余不动。工作量一下子就清晰了，客户也更容易决策。\n\n总结这一节。智能体是把大脑、记忆、工具和编排组装到一起的会做事的系统。它靠感知、规划、行动、记忆的循环来完成任务。理解这套架构，你才能在客户现场快速定位问题，也才能在下一章真正读懂 ADP 是怎么把这套架构落地成一个平台的。把这一节的四层框架记牢，它会是你后面所有方案设计的底图。"}]},{"domain":2,"name":"ADP 平台产品能力","weight":"29%（产品定位 7% + 核心功能 22%）","practice":[],"sections":[{"h":"2.1 ADP 定位与能力边界","body":"上一章我们讲清了智能体是什么。这一章走进真正要动手的平台，也就是 ADP。第一节先解决两个最基础的问题：ADP 到底是什么，它的能力边界在哪里。\n\n这两个问题看着简单，却是交付工程师最容易在客户面前答含糊的地方。定位讲不清，客户就摸不准该拿它做什么。边界讲不清，客户就会提一堆平台其实做不到的要求。\n\n**ADP 是一个把智能体从想法做到落地的平台。**\n\nADP 的全称是企业级智能体开发平台。你可以把它理解成一间装修好的厨房。大语言模型是灶台上的火，而 ADP 把料理台、刀具、调料、餐具都配齐了。你不用自己盘炉子，进来就能做菜。\n\n具体来说，ADP 把搭一个智能体需要的零件都备好了。应用、模型、知识库、工具、连接器、Workflow，这些后面几节要细讲的能力，都在平台里现成可用。\n\n举个场景。某零售集团想做一个导购助手，如果从零写代码，光是接大模型、建知识库、连订单系统就要折腾很久。而在 ADP 上，这些能力是拼装式的，把零件配起来就能跑。\n\n所以 ADP 的价值，是把「造轮子」变成「拼积木」。交付工程师的精力，就能从底层技术转到理解客户需求和设计方案上。\n\n这里可以再具体一点，看 ADP 到底替你省了哪些活。第一是模型接入的活。不同大模型接口各不相同，平台把它们统一管起来，你不用逐个对接。\n\n第二是知识管理的活。企业文档要能被模型理解，中间有一整套切分、检索的工序，平台把这套 RAG 能力封装好了，你配一下就能用。\n\n第三是工具连接的活。让智能体能查订单、发通知，得接各种外部系统，平台用连接器把这件事标准化了。\n\n某教育机构的技术负责人算过一笔账。同样一个答疑助手，自己从零搭要好几个工程师忙上几周，在 ADP 上一个人几天就能出可用版本。省下的不只是时间，还有踩坑的成本。\n\n**ADP 提供公有云和云部署两种模式。**\n\n同一个平台，ADP 给了两种用法。一种叫公有云模式，一种叫云部署模式。它们的能力是一致的，区别在于平台跑在哪里、数据放在哪里。\n\n这两种模式对应着客户不同的顾虑。有的客户要快、要省心，有的客户要把数据牢牢攥在自己手里。ADP 用两种模式分别接住这两类需求。\n\n交付时你要做的第一个判断，往往就是帮客户在这两种模式里选一个。选错了，后面的成本和合规都会出问题。\n\n**公有云模式，开箱即用，适合快速验证。**\n\n公有云模式下，平台跑在腾讯云的公共资源上。客户不用自己准备服务器，注册账号就能开始搭智能体。\n\n它的第一个好处是快。某创业团队想验证一个客服助手的想法，用公有云模式，当天就能搭出一个能对话的原型拿给老板看。这种速度，自建环境给不了。\n\n它的第二个好处是省心。底层的资源、扩容、运维都由平台照料，客户只管用。团队小、要快速试错的场景，公有云模式几乎是首选。\n\n需要注意的是，公有云模式下数据会流经平台的公共环境。对数据特别敏感的客户，这一点要提前讲清楚，让他们心里有数。\n\n公有云模式在花钱方式上也更灵活。它按用量计费，用多少算多少，前期不用一大笔投入。对预算有限、想先小步验证的团队，这种方式压力最小。\n\n某内容团队就是这么起步的。他们先用公有云模式花很少的钱跑通了一个写作助手，验证了效果，团队认可后才谈更大规模的投入。先验证再加码，是这类模式的典型玩法。\n\n**云部署模式，把平台装进你自己的云里。**\n\n云部署模式换了个思路。平台以软件许可的形式，装到客户自有的腾讯云资源里运行。数据不出客户自己的账户和私有网络。\n\n这对数据主权要求高的客户很关键。某金融机构的核心业务数据不能离开自己的合规环境，这时公有云模式就不合适，云部署模式才是答案。\n\n云部署还有一个好处，是能复用客户已有的资源。客户在腾讯云上原本就有的数据库、存储，可以直接接进来，不用重复采购。\n\n换句话说，云部署模式牺牲了一点开箱即用的轻便，换来了数据掌控力和合规性。安全合规要求越高的行业，越倾向这种模式。\n\n云部署模式也意味着客户要承担更多的运维责任。平台装在自己的云里，扩容、监控这些活就得自己或伙伴来管。这一点在方案沟通时要说清楚。\n\n某医疗机构选云部署时，就专门为此配了运维支持。他们清楚数据主权换来的是更重的管理担子，提前做好了准备。交付工程师要帮客户把这本账算明白，别让他事后才发现。\n\n**能力边界要划清：ADP 管的是智能体，不是一切。**\n\n讲完是什么，接下来讲不是什么。这一步同样重要。客户常把 ADP 想象成无所不能的系统，而你要替他划清边界。\n\nADP 的核心，是围绕智能体的开发、编排、交付、运维这一条链。它擅长把大模型的能力组织起来，接上企业的知识和工具，做成能对话、能办事的应用。\n\n但 ADP 不是一个通用的数据分析平台，也不是替代企业全部系统的中台。它是智能体这一层的专业工具，不该被当成万金油。\n\n某制造企业曾希望用 ADP 直接管理全厂的设备台账，这其实超出了平台的定位。正确的做法是让 ADP 做智能问答和调度这一层，台账管理仍交给专门的系统。\n\n关键限制在于，ADP 的能力围绕智能体展开。凡是和智能体的理解、编排、交付相关的活，它擅长；凡是纯粹的底层系统建设，就不在它的主场。\n\n实际项目里，边界常有模糊地带。这时有个简单的判断法：看这件事的核心是不是「理解语言、调度工具、生成回应」。是，就落在 ADP 的主场；不是，就要另找工具。\n\n某零售集团想做一个能自动生成营销文案、又能直接改库存数据的系统。前半段生成文案是 ADP 的主场，后半段改库存则该交给库存系统。把这两段拆开，各用各的工具，方案才稳。\n\n这种拆分能力很重要。它让你既不夸大 ADP 的本事，也不埋没它的价值，而是让它待在最擅长的位置上发力。\n\n**ADP 和纯大模型的区别，在于会不会做事。**\n\n上一章我们说过，纯大模型只会「说」，智能体才会「做」。ADP 正是把大模型武装成能做事的智能体的那套平台。\n\n打个比方。纯大模型像一个知识渊博的顾问，你问什么他答什么，但他不会替你去跑腿。ADP 则给这位顾问配了助理、工具和流程，让他能真的把事办完。\n\n某物流公司做过对比。直接用大模型接口，只能回答「快递怎么查」的一般说法。而在 ADP 上搭的智能体，能接上真实的物流系统，查到具体单号的实时状态。\n\n差别就在这里。ADP 提供的是从「能说」到「能做」的整套工程能力，而不只是一个模型接口。\n\n这个区别也决定了你跟客户怎么报价。如果客户以为买个模型接口就够，你要让他明白，真正能落地的是这套工程能力。模型只是其中一味料，平台才是那间厨房。\n\n某快消企业一开始只想买模型接口自己搭，试了一圈发现光对接就填不完坑，最后还是回到 ADP 上来。这段弯路，本可以在前期讲清区别时就避开。\n\n**什么场景适合上 ADP。**\n\n理解了定位和边界，就能判断哪些场景该用 ADP。适合的场景有几个共同特征。\n\n第一类是有大量重复问答的场景。比如客服、导购、内部答疑，这些活靠人回复成本高，用智能体能大幅减负。\n\n第二类是需要接企业自有知识的场景。企业有一堆文档、手册、规章，希望员工或客户能用自然语言问出答案，这正是知识库加智能体的强项。\n\n第三类是需要串起多个系统的场景。一件事要查这个系统、填那个表单，用 Workflow 把步骤编排起来，智能体就能一站式办完。\n\n把这三类场景放一起看，会发现一个共同点。它们都涉及大量的语言理解和流程串联，而这两件事恰好是人做起来累、智能体做起来省的活。\n\n某连锁品牌的加盟商咨询就是典型。加盟商反复问同样的政策问题，人工回复又慢又容易漏。上了智能体后，常见问题自动答，复杂的才转人工，效率一下就上来了。\n\n判断一个场景值不值得上，你可以反问一句：这里是不是有很多重复的问答、要接自有知识、或者要串多个系统。只要中了一条，往往就值得认真评估。\n\n**什么场景先别急着上 ADP。**\n\n反过来，也有一些场景要劝客户缓一缓。看清这些，能帮你避免做砸的项目。\n\n一种是需求还没想清楚的场景。客户只说「我要上 AI」，却讲不出具体要解决什么问题。这时先做需求梳理，别急着搭平台。\n\n另一种是对准确率要求苛刻到不容一点误差的场景。生成式的输出天然有不确定性，如果客户要的是零误差的精确计算，就要先把风险和边界讲透。\n\n需要注意的是，劝客户缓一缓不是推活。恰恰相反，先把不合适的场景挡在门外，才能保住后面交付的成功率。这份判断力，正是交付工程师的专业所在。\n\n还有个实用的开场技巧。第一次跟客户聊 ADP，先用厨房那个比喻把定位讲清，再顺手划出边界。这么一讲，客户对平台的预期立刻就实在了。定位和边界这两件事讲透，往往比堆一堆功能参数更能赢得信任。\n\n总结这一节。ADP 是把智能体从想法做到落地的平台，提供公有云和云部署两种模式，分别对应求快和求数据主权两类需求。它的能力围绕智能体展开，不是万能中台。看清它能做什么、不该做什么，你才能在客户面前既讲得清价值，又守得住边界。"},{"h":"2.2 基础能力：应用、模型、角色指令、变量与长期记忆","body":"上一节我们说清了 ADP 的定位与能力边界。这一节往里走，看看搭一个智能体到底要用到哪几样基础零件。ADP 把这些零件都摆在台面上，你要做的是把它们组装好。\n\n这一节讲五样：应用、模型、角色指令、变量与长期记忆。它们各管一摊，缺一样，智能体就少一块能力。\n\n先记住一个总印象。应用是盛放智能体的容器，模型是它的大脑，角色指令是它的身份说明书，变量是它随机应变的开关，长期记忆是它记住事情的本子。\n\n**应用是智能体的容器。**\n\n在 ADP 里，你搭的每一个智能体，都装在一个叫应用的壳子里。应用是最外层的单位。你给它起名字、选模型、写角色指令、挂知识库，都是在这个壳子里完成的。\n\n可以把应用想成一个员工的工位。工位上摆着他要用的电脑、资料、工具，换个员工就换一套摆设。应用也是这样，一个应用对应一个独立的智能体，各管各的活。\n\n某零售集团想同时上两个智能体。一个回顾客的售后咨询，一个帮内部员工查库存。这两个智能体的职责完全不同，就该建成两个独立的应用，各配各的模型和知识库，互不干扰。\n\n如果把两件事塞进一个应用，麻烦就来了。它一会儿要扮客服、一会儿要扮内勤，角色指令互相打架，回答质量必然下降。一个应用只干好一件事，是搭建的第一条原则。\n\n应用之间也能分工协作。你可以把几个各司其职的应用组合起来，让它们像一个小团队那样配合。这种多个应用协同的玩法，后面讲任务编排时会展开，这里先记住应用是最小的独立单位。\n\n**模型是应用的大脑。**\n\n应用这个壳子里，真正负责思考和生成的，是模型。ADP 支持你为应用挑选合适的大语言模型，模型选得对不对，直接决定智能体聪不聪明。\n\n不同的模型有不同的脾气。有的擅长长文理解，有的响应更快，有的成本更低。这就像招人，岗位不同，要的人也不同。\n\n某在线教育团队做过对比。他们的答疑智能体一开始用了一个响应偏慢的模型，学生等得着急。后来换成响应更快的模型，虽然单次成本略高，但体验明显改善，续费率也跟着涨。\n\n反过来的例子也有。某内容团队要批量生成商品简介，量大但每条都不复杂。他们特意选了成本更低的模型，把预算省下来跑更大的量。场景不追求深度，省钱就是对的选择。\n\n这里要给客户一个正确预期。模型不是越大越好，而是越合适越好。选型时要看场景：追求快就选响应快的，追求省就选成本低的，追求深度理解就选擅长长文的。\n\n需要注意的是，模型能力再强，也得靠后面几样零件来约束和引导。光有大脑，没有身份说明书和记忆，智能体照样跑偏。\n\n还有一个常被忽略的点。同一个应用，未必只能用一个模型。有的场景里，简单问题用便宜快速的模型挡掉大部分，复杂问题再交给能力更强的模型。这种搭配能兼顾成本和效果，是选型时值得考虑的思路。\n\n**角色指令告诉智能体「你是谁」。**\n\n角色指令是你写给智能体的一段话，规定它的身份、语气、职责和边界。它相当于智能体的身份说明书。同一个模型，角色指令不同，表现出来就是两个完全不同的智能体。\n\n举个例子。你写「你是一名严谨的法务助理，只依据提供的合同条款回答，不做法律建议」，它就会谨慎克制。你换成「你是一名热情的导购，多推荐、多互动」，它立刻变得活泼外向。\n\n某银行网点想要一个业务咨询智能体。他们在角色指令里明确写道：语气要专业稳重，遇到不确定的政策一律建议客户到柜台核实，绝不自行编造利率和额度。这几句话，就把智能体的行为框得很稳。\n\n角色指令还有一个隐藏作用，就是划边界。你可以在里面写清楚「哪些问题不回答」，比如涉及隐私、涉及未开放业务的，一律礼貌拒绝。这层约束，是后面第六章讲合规时的重要抓手。\n\n换句话说，角色指令是你对智能体最直接的掌控手段。写得越清楚，它跑偏的空间就越小。\n\n写角色指令也有讲究。太笼统，智能体抓不住重点。太啰嗦，又容易自相矛盾。好的角色指令通常先讲身份，再讲职责，最后划边界，一层一层说清楚。\n\n某政务服务热线的智能体就吃过笼统的亏。第一版指令只写「你是一名热心的客服」，结果它什么都敢答，连没开放的业务也乱指路。后来把职责和边界一条条写明，它才收敛到该管的范围里。\n\n**变量让智能体的回答随场景而变。**\n\n变量是应用里可以动态传入的值。有了变量，同一个智能体就能根据不同的输入，给出因人而异、因时而异的回答，而不是千篇一律。\n\n打个比方。变量就像填空题里的空格。角色指令是印好的题面，变量是每次现填的答案，填的内容不同，整句话的意思就跟着变。\n\n某连锁酒店的迎宾智能体用到了变量。系统把客人的姓名、房型、入住日期作为变量传进来。智能体于是能说出「王女士您好，您预订的高级大床房今天可以入住」这样贴身的话，而不是干巴巴的通用问候。\n\n变量的价值在于个性化。没有变量，智能体只能对所有人说同一套话。有了变量，它能对每个人说贴合当下情况的话，体验立刻不一样。\n\n需要注意的是，变量的内容通常来自外部系统，比如订单库、会员库。这就要靠后面会讲的连接器把数据接进来，变量才有源头活水。\n\n变量还能用来切换智能体的行为。某电商大促期间，运营把「当前活动规则」作为变量传给客服智能体。活动一变，只改变量，智能体的应答口径立刻跟着更新，不用重写角色指令。\n\n这带来一个好习惯。凡是会变的信息，尽量做成变量，而不是写死在角色指令里。写死的东西改起来费劲，变量则灵活得多。\n\n**长期记忆让智能体记得住。**\n\n默认情况下，智能体是「健忘」的。这一轮对话结束，它就不记得你是谁、之前聊过什么。长期记忆这套机制，就是给它配一个能跨对话保存信息的本子。\n\n有了长期记忆，智能体能记住用户的偏好、历史和身份。下次再来，它接着上次的进度聊，不用你从头交代。这对需要多次打交道的场景特别关键。\n\n某健康管理平台的智能体用上了长期记忆。用户第一次说了自己对某类食物过敏，之后每次推荐食谱，智能体都会自动避开，不用用户反复提醒。这种「记得住」的体验，让用户觉得被认真对待。\n\n要区分清楚两个概念。上一章讲的上下文窗口，是模型单次能看到的内容，对话一结束就没了。而长期记忆是主动存下来、下次能取回的信息，跨越了单次对话的限制。\n\n换句话说，上下文窗口是短时的工作台，长期记忆是长期的档案柜。两者配合，智能体才既能应对当下，又能记住过往。\n\n长期记忆也要讲分寸。记得太多、太杂，反而会干扰当下的判断。所以实际搭建时，通常只存对后续对话真正有用的信息，比如偏好和身份，而不是把每句话都存下来。\n\n这里还牵涉到隐私。用户的信息一旦被记住，就要考虑存多久、谁能看、怎么删。这些问题不属于这一节，但要先有意识，后面第六章会专门讲数据权限和隐私保护。\n\n**这五样组合起来，才是一个能用的智能体。**\n\n把五样零件串一遍就清楚了。应用是容器，装下整个智能体。模型是大脑，负责思考生成。角色指令是身份说明书，规定它是谁、怎么说话。变量让它随场景应变，长期记忆让它记得住人和事。\n\n少了任何一样，智能体都会缺一块。没有合适的模型，它不够聪明。没有清晰的角色指令，它容易跑偏。没有变量，它千人一面。没有长期记忆，它转头就忘。\n\n对交付工程师来说，搭建的过程就是把这五样配齐、调好。后面几节会讲知识库、工具、编排这些更进阶的能力，但地基就是这一节的五样基础件。地基打牢，上层才稳。\n\n某物流公司的客服智能体就是这样一步步搭起来的。先建应用、选好响应快的模型、写清客服角色指令，再把订单号作为变量传入、用长期记忆记住老客户，最后才叠加知识库和工具。顺序清楚，搭起来就不乱。\n\n为什么是这个顺序？因为它符合从骨架到血肉的思路。先有应用这个壳，再装大脑，再定身份，最后才是随场景变化的变量和记忆。前面的没定好，后面的就没有依托。\n\n新手常犯的错，是一上来就纠结用哪个模型、挂哪个知识库，却没先想清楚这个应用到底要干什么。结果零件堆了一堆，智能体却四不像。先定职责，再配零件，这个次序能少走很多弯路。\n\n也别指望一次配到位。真实的搭建往往是先搭一个能跑的最简版本，让客户看到效果，再根据反馈逐步加东西。这种小步快跑的做法，后面讲方案画布和交付时还会反复提到。\n\n把这五样记牢，还有一个现场好处。客户描述需求时，你能立刻在心里对号入座：这条要求是改角色指令，那条要挂长期记忆，另一条得靠变量。需求和零件一一对上，报价和排期自然就准了。这种一眼看穿的功夫，正是熟练交付工程师的底气所在。\n\n总结这一节。应用、模型、角色指令、变量与长期记忆，是 ADP 里搭建智能体的五样基础能力。理解它们各管什么、怎么配合，你才能在客户现场快速判断该配哪些、怎么配。这是从需求走向可搭建方案的第一步。"},{"h":"2.3 知识与连接：知识库、工具、连接器与 Skills","body":"智能体光有一个聪明的大脑还不够。它得能查资料、能调工具、能连上外部系统，才能真正把事做成。这一节讲的就是 ADP 里让智能体「长本事」的四块拼图：知识库、工具、连接器和 Skills。\n\n把这四块理清，你在给客户设计方案时才知道每个需求该落在哪一块上。落错了块，方案就会绕远路。\n\n可以先记一个总印象。知识库管「懂什么」，工具管「会做什么」，连接器管「连得上什么」，Skills 管「怎么把这些打包复用」。四块各司其职，缺一不可。你在后面的每一节里，都会不断用到这个划分。\n\n**知识库是给智能体配的一个「随身资料库」。**\n\n大语言模型本身知道很多通用常识，但它不知道你公司的具体情况。它不知道你的产品手册、不知道你的退换货政策、不知道你上个季度的内部规定。这些私有知识，得靠知识库补进来。\n\n知识库的做法，是把你的文档存进一个专门的库。智能体遇到问题时，先去这个库里找相关的段落，再带着找到的资料去回答。这样它的回答就有了依据，而不是全凭模型自己瞎猜。\n\n举个场景。某家电企业想做一个售后问答助手，顾客问「我这型号的空调怎么清洗滤网」。纯模型只能给泛泛的通用步骤。而接上知识库后，助手能查到这个具体型号的说明书，给出对得上型号的清洗步骤。\n\n这就是知识库的价值。它让智能体从「什么都懂一点」变成「懂你这一行、这一家」。\n\n还要提醒一点。知识库里放什么，直接决定助手能答什么。你不放的内容，它就答不上来。所以建库前先想清楚，客户最高频的问题靠哪些资料能答，先把这些资料备齐。\n\n**RAG 是知识库背后的检索机制。**\n\n知识库能工作，靠的是一套叫 RAG 的机制。这个词看着唬人，拆开讲很简单。它做的是两步：先检索，再生成。\n\n第一步检索。智能体拿到用户的问题，先去知识库里搜出最相关的几个片段。第二步生成。它把搜到的片段和用户的问题一起交给大语言模型，让模型基于这些片段来组织答案。\n\n打个比方。这就像一个人回答问题前，先翻了翻手边的参考书，找到相关章节，再合上书用自己的话讲出来。他讲的内容，是有出处的。\n\n某法律咨询团队用这套机制做了一个条款查询助手。用户问一个合同问题，助手先从条款库里检索相关条文，再结合条文给出解释。答案后面还能附上引用的条款，用户一看就知道依据在哪。\n\nRAG 的好处是既用上了模型的语言能力，又用上了你私有资料的准确性。两者一结合，答案才既通顺又靠谱。\n\n需要注意的是，检索这一步是 RAG 的命门。如果搜出来的片段本身就不相关，后面模型讲得再流畅也是错的。所以检索准不准，直接决定了这套机制好不好用。\n\n也正因如此，RAG 还能帮着压幻觉。模型手里有了真实片段，就不容易瞎编。给它靠谱的料，它就少说空话。这一点在对准确性要求高的场景里特别关键。\n\n**知识库的质量，取决于你怎么切、怎么标。**\n\n很多人以为，把文档一股脑塞进知识库就完事了。其实不然。知识库好不好用，关键在两件事：切片和标注。\n\n先说切片。文档要切成一段一段的小片，检索时才好按片匹配。切得太大，一片里混了好几个主题，检索就不准。切得太小，一句话被拦腰截断，意思就丢了。\n\n某保险公司一开始把整份条款文件当成一片存进去，结果助手检索时总是抓不准。后来把文件按条款切成小片，每片只讲一个条款，检索立刻精准了。\n\n再说标注。给每片资料打上标签，比如它属于哪个产品、哪个版本，检索时就能先按标签缩小范围。标注做得细，检索的命中率就高。\n\n某连锁餐饮品牌就靠标注解决了一个乱象。他们的菜品资料按门店区域分了标签，助手回答时先锁定顾客所在区域，再检索该区域的菜单。跨区域的错误推荐一下就没了。\n\n需要注意的是，知识库不是一次建好就不管了。资料会更新，政策会变化。你得定期把过时的片替换掉，否则智能体会拿着旧资料回答新问题。这一点在方案里要提前跟客户讲清楚，明确谁来维护、多久更新一次。\n\n**工具让智能体能「调用外部能力」。**\n\n知识库解决的是「知道」，工具解决的是「会算、会查、会做」。前面讲过，大语言模型不擅长精确计算。那怎么办？给它配一个计算工具，让它把算术交出去。\n\n工具的本质，是一段智能体可以调用的外部能力。可以是一个计算器，可以是一个查天气的接口，也可以是一个查库存的功能。智能体判断需要它时，就调一下，拿回结果再接着往下走。\n\n举个场景。某电商团队的智能体要回答「这两件商品一共多少钱、打完折是多少」。模型自己算容易出错。配上一个计算工具后，模型负责理解问题，工具负责算钱，算完再由模型组织成一句话回给顾客。\n\n换句话说，工具让智能体扬长避短。擅长的语言活自己干，不擅长的精确活交给工具。这种分工，正是可靠交付的基础。\n\n这里有个设计要点。给智能体配工具，不是越多越好。工具太多，模型反而会犹豫该调哪个。只配这个场景真正用得上的几个，判断才利落。\n\n还要给工具写清楚说明。每个工具是干什么的、什么时候该用，都要讲明白。说明写得清楚，模型才知道在对的时机调对的工具。这一步偷懒，后面就会出乱子。\n\n**连接器是智能体通向外部系统的「插头」。**\n\n工具是单个能力，而连接器管的是「怎么接上一整个外部系统」。你的订单系统、你的客户管理系统、你的内部数据库，智能体想用它们，就得先有一个连接器把线接通。\n\n可以把连接器想成插头。系统是电器，智能体是电源，连接器就是那个让两者接上的插头。插头对上了，电才能通，数据才能流。\n\n某连锁零售集团想让智能体查实时库存。库存数据在他们自己的系统里。通过一个连接器，智能体就能在顾客问「这款还有货吗」时，实时查到真实库存，而不是给一个模棱两可的答复。\n\n需要注意的是，连接器一头连着外部系统，就涉及权限和安全。哪些数据能读、哪些能改，都要在连接器这一层管好。这部分的具体防控，后面第六章会专门展开。\n\n再补一个交付经验。接外部系统时，对方系统的稳定性不在你掌控内。所以方案里要考虑，万一外部系统查询超时或没响应，智能体该怎么体面地兜底，而不是卡在那里干等。\n\n**Skills 是把一组能力打包成「技能」。**\n\n当知识库、工具、连接器越配越多，管理就成了问题。Skills 就是用来解决这个的。它把一组相关的能力打包成一个技能单元，让智能体像人学会一项技能那样，成套地掌握和调用。\n\n打个比方。一个新员工入职，你不会零散地教他一百个动作，而是教他「怎么处理一单退货」这样一整套技能。Skills 就是把「处理退货」需要的查订单、算金额、发通知这些动作，打包成一个可复用的技能。\n\n某物流公司把「查件、改地址、催派送」这三个高频动作各自打包成 Skills。之后再做新的智能体，直接调用这些现成的 Skills，不用每次从零搭。开发效率一下就上来了。\n\nSkills 的意义在于复用和沉淀。你把一次做好的能力沉淀成技能，以后反复用。团队的经验，就这样一点点积累进了平台。\n\n换句话说，Skills 让能力不再是一次性的。做一次，处处能用。这对要服务很多相似客户的团队来说，价值尤其大。\n\n从交付角度看，Skills 还降低了后续维护的成本。逻辑集中在一处，要改的时候改一次就行。所有用到它的智能体，都跟着更新了。\n\n**这四块怎么配合，决定了智能体的上限。**\n\n把四块串起来看就清楚了。知识库给智能体私有知识，工具给它单点能力，连接器给它接通外部系统的通道，Skills 把这些打包成可复用的成套技能。\n\n举个综合的场景。某家居品牌做一个导购助手。它用知识库掌握全部商品资料，用工具算价格和优惠，用连接器查实时库存和下单，再把这些打包成「导购」「下单」两个 Skills。顾客一路问下来，助手都能接得住。\n\n反过来想，缺了任何一块会怎样。没有知识库，助手不懂这家的商品。没有工具，它算不准价。没有连接器，它查不到库存。没有 Skills，每个新助手都得从零再搭一遍。\n\n作为交付工程师，你的活就是看懂客户需求，判断每个需求该用哪一块来接。这个判断准了，方案才既不缺料、也不堆砌。\n\n给你一个上手的口诀。要私有知识就想知识库，要单点能力就想工具，要接系统就想连接器，要复用就想 Skills。拿着这个口诀去拆需求，很少会落错块。\n\n这里再点几个常见误区。第一个误区是万事都想塞进知识库。其实要算的、要查实时数据的，该交给工具和连接器，硬塞知识库反而答不好。\n\n第二个误区是工具配得越多越显本事。前面说过，工具太多模型会挑花眼，克制反而更可靠。\n\n第三个误区是 Skills 打包得越大越好。一个 Skills 塞太多动作，复用时就不灵活。颗粒度适中，才好拼装。\n\n这几个误区，新手几乎都会踩。你提前跟客户和团队打好招呼，能少走很多弯路。设计前先照着四块过一遍，往往比事后返工省力得多。\n\n总结这一节。知识库、工具、连接器、Skills 是给智能体长本事的四块拼图。知识库管「知道」，工具管「会算会做」，连接器管「接通系统」，Skills 管「打包复用」。四块配合得好，智能体才能从一个会聊天的大脑，变成一个能在你业务里真正干活的帮手。"},{"h":"2.4 任务编排：Workflow、Multi-Agent 与 Claw","body":"上一节我们讲了知识与连接，让智能体能查资料、用工具。这一节往前再走一步。当一件事需要好几步才能办完，智能体该怎么把这些步骤串起来、按顺序做好？这就是任务编排要解决的问题。\n\nADP 提供了三种编排方式：Workflow、Multi-Agent 和 Claw。它们对应不同复杂度的任务。这一节我们把三者讲清楚，让你在方案设计时知道该选哪一个。\n\n**先想清楚一个问题：为什么需要任务编排。**\n\n简单的问答，一问一答就够了。用户问一句，智能体答一句，不需要编排。\n\n但真实业务往往没这么简单。一件事常常要分好几步，步骤之间还有先后和依赖。\n\n举个场景。某零售集团想做一个「自动处理售后申请」的助手。它要先读懂用户的申请，再查订单状态，然后判断是否符合退换条件，最后生成处理结果。\n\n这四步有严格顺序。前一步的结果，决定后一步怎么走。查不到订单，就没法判断退换条件。\n\n这种多步骤、有依赖的任务，就需要一套机制把步骤组织起来。这套机制，就是任务编排。\n\n如果没有编排会怎样？智能体面对多步任务，容易漏步、乱序，或者一股脑塞在一次回答里。结果就是办不成事。\n\n还是售后的场景。没有编排的智能体，可能还没查订单就下了退款结论。或者把四步揉成一段话回给用户，看着热闹，实际没真正处理。\n\n有了编排，每一步各就各位。该查的查了，该判的判了，最后才出结果。这就是编排带来的秩序。\n\n**Workflow 是把步骤画成一张固定流程图。**\n\nWorkflow 的思路很直白。你把任务拆成一个个节点，用连线规定它们的先后顺序，智能体就照着这张图一步步走。\n\n可以把它想象成一条流水线。原料从这头进，经过一道道工序，成品从那头出。每道工序做什么、下一道是谁，都是提前定好的。\n\n还是刚才的售后场景。用 Workflow 来做，就是画四个节点：读申请、查订单、判条件、出结果。节点之间用箭头连起来，规定必须按这个顺序走。\n\nWorkflow 还能设分支。判断退换条件那一步，符合就走「生成退款单」，不符合就走「回复拒绝理由」。这就像流程图里的一个岔路口。\n\nWorkflow 的最大优点是稳定可控。流程固定，每次执行都走同样的路，结果可预期。出了问题也好排查，你能清楚看到卡在哪个节点。\n\n需要注意的是，Workflow 适合流程明确的任务。如果步骤是固定的、条件是清楚的，Workflow 就是最省心的选择。\n\n反过来说，如果任务经常变、步骤说不准，硬套 Workflow 就会很别扭。你会发现流程图改来改去，怎么都画不全。\n\n再补一个 Workflow 的实用细节。节点之间可以传递数据。前一个节点查到的订单信息，能直接交给下一个节点用。这让每一步都能接上上一步的结果。\n\n某银行网点想做一个「开户预审助手」。用 Workflow 串起来：先收集资料，再校验证件，然后查黑名单，最后给预审结论。每一步的产出，都成了下一步的输入。\n\n这种数据顺着流程往下传的能力，让 Workflow 特别适合表单类、审批类的业务。步骤清楚，数据也接得上，跑起来又稳又准。\n\n**Multi-Agent 是让多个智能体分工协作。**\n\n有些任务一个智能体扛不下来。它可能涉及好几个专业领域，或者要同时干好几件事。这时候，就该让多个智能体组队了。\n\nMulti-Agent 的思路，是把一个大任务拆给几个各有专长的智能体。每个智能体负责自己擅长的那部分，再由一个协调者把它们的产出汇总起来。\n\n打个比方。这就像一个项目团队。有人负责调研，有人负责写方案，有人负责审核，还有一个项目经理统筹。各司其职，配合完成。\n\n举个场景。某传媒公司想做一个「内容创作助手」。写文案是一个智能体，配图建议是另一个智能体，合规审查又是一个智能体。三个智能体分工，最后拼成一篇完整可发布的内容。\n\n这里的协调者很关键。它负责把大任务拆开、分给谁、再把结果收回来拼好。没有这个角色，几个智能体就成了一盘散沙。\n\nMulti-Agent 的优点是能处理复杂任务。单个智能体的能力有上限，多个组合起来，能覆盖更宽的领域、做更重的活。\n\n但它也有代价。智能体之间要沟通协调，设计起来比 Workflow 复杂。所以只有当任务确实需要多方分工时，才值得用它。\n\n多说一句协调者的两种常见做法。一种是主管式，由一个主智能体统一调度，指定谁先干、谁后干。另一种是接力式，几个智能体按顺序把活一个传一个。\n\n还是内容创作的场景。主管式就是主智能体先派文案写初稿，再派配图给建议，最后派合规去审查。接力式则是文案写完直接交给配图，配图完再交给合规。\n\n选哪种，看任务里各部分的关系。关系简单、顺序清楚，接力式就够。需要灵活调度、随时补活，主管式更合适。\n\n**Claw 是给智能体更大的自主发挥空间。**\n\n前面两种方式，路线都是人提前铺好的。Workflow 是固定流程，Multi-Agent 是固定分工。但有些任务，你没法提前把每一步都想清楚。\n\nClaw 模式就是为这种情况准备的。它给智能体一个目标，让智能体自己判断该怎么一步步达成。路怎么走，由智能体在过程中动态决定。\n\n可以这样理解。Workflow 像是给了一张详细地图，每个路口都标好了。Claw 更像是只告诉了目的地，让一个熟路的向导自己找路过去。\n\n举个场景。某咨询团队想做一个「行业调研助手」。调研这件事，很难提前定死步骤。要查哪些资料、往哪个方向深挖，得看查到什么再决定。\n\n这种探索性的任务，就适合用 Claw。让智能体边做边调整，遇到线索就顺藤摸瓜。\n\nClaw 的优点是灵活，能应对开放和多变的任务。但灵活也意味着不确定性更高。你要在方案设计时想清楚，这个任务到底需不需要这么大的自主空间。\n\n关键限制在这里。自主空间越大，越要配好边界和约束。不然智能体可能跑偏，做出你没预期的动作。\n\n边界怎么配？可以从三个方面入手。一是限定它能用的工具，只给完成目标必需的那几样。二是圈定它能碰的数据范围，不让它越界去读无关信息。三是设好步数或时间上限，避免它无休止地绕下去。\n\n还是行业调研的场景。你可以只给它查资料和整理这两类工具，把数据范围圈在公开信息内，再规定最多查二十轮就得出结论。这样它既能自由探索，又不会脱缰。\n\n换句话说，用 Claw 不是把方向盘完全撒手。而是给一条宽一些的车道，让智能体在道里自由跑，但别冲出护栏。\n\n**三种模式怎么选，看任务的确定性。**\n\n把三者放到一起比，选择的关键就一条：任务的步骤有多确定。\n\n步骤完全确定，流程固定，选 Workflow。它稳、可控、好排查。\n\n任务要多方专业分工，选 Multi-Agent。让各有所长的智能体组队，覆盖更宽的领域。\n\n步骤没法提前定死，需要探索，选 Claw。给智能体目标和自主权，让它边做边找路。\n\n举个综合场景。某物流公司要做一套智能客服。查快递到哪了，流程固定，用 Workflow。既要答物流、又要处理投诉、还要推荐服务，多领域分工，用 Multi-Agent。用户提了个从没遇到过的复杂诉求，需要临场判断，用 Claw。\n\n需要注意的是，这三种模式不是互相排斥的。一个复杂方案里，完全可以混着用。哪一段确定就用 Workflow，哪一段要分工就用 Multi-Agent，哪一段要探索就用 Claw。\n\n混用时怎么衔接？可以把复杂方案想成一棵树。主干用 Workflow 定大流程，某个节点内部再嵌一个 Multi-Agent 做分工，另一个节点遇到开放问题就切到 Claw。\n\n还是智能客服的场景。主流程用 Workflow 管接待和分流。分流到复杂咨询时，进 Multi-Agent 让多个专家智能体协作。碰到全新问题，再放 Claw 去临场探索。\n\n这样搭出来的方案，既有 Workflow 的稳，又有 Multi-Agent 的强，还有 Claw 的活。各取所长，才是编排的高级用法。\n\n**编排的核心，是把复杂任务拆成可执行的步骤。**\n\n不管用哪种模式，编排的本质都一样。就是把一件复杂的事，拆成智能体能一步步做的小事，再规定这些小事怎么组织。\n\n拆得好不好，直接决定了智能体好不好用。拆得太粗，每步都塞太多东西，智能体容易出错。拆得太细，节点满天飞，维护起来又累人。\n\n举个场景。某制造企业想做一个「设备报修助手」。如果只拆成「处理报修」一个大步骤，智能体要同时判断故障类型、查维修记录、派单，很容易乱。\n\n拆成「识别故障、查历史、判优先级、生成派单」四步，每步职责清楚，就顺多了。这就是拆解的价值。\n\n所以方案设计时，拆解的颗粒度是门手艺。你要让每一步都足够简单、职责单一，又不能碎到难以维护。\n\n有没有一个简单的判断标准？有。一个好的步骤，应该能用一句话说清它干什么。说不清、或者要用「并且」「同时」才能描述，往往就是塞多了，该拆。\n\n还是设备报修的场景。「判优先级」这一步，一句话就能讲明白：根据故障类型和影响范围定紧急程度。这就是拆得合适。\n\n反过来，如果一步要说成「判优先级并且派单并且通知负责人」，那就是三件事挤在了一起。拆开它们，每步才清爽。\n\n换句话说，编排考的不只是工具，更是你对业务的理解。你越懂这件事该怎么一步步办，就越能把它拆得又清楚又好用。\n\n还有一个实战提醒。选模式前，先把业务流程和客户一起捋一遍。流程越捋越清楚，选型自然水到渠成；流程还没想明白，急着定模式往往会返工。\n\n总结这一节。ADP 提供了三种任务编排方式。Workflow 适合固定流程，Multi-Agent 适合多方分工，Claw 适合探索性任务。选哪个，看任务步骤的确定性。而无论选哪个，把复杂任务合理拆解成可执行的步骤，都是编排的核心功夫。这门功夫练好了，你设计的方案才能真正落地跑起来。"},{"h":"2.5 应用发布与多渠道交付","body":"一个智能体在平台里搭好了，能问能答，看起来很顺。但这还不算交付完成。它得真正到用户手里、在用户日常用的入口跑起来，才算落地。这一节讲的就是最后一公里：怎么把搭好的应用发布出去，又怎么送到不同的渠道。\n\n对交付工程师来说，发布环节最容易被轻视。前面方案设计、应用搭建都做得漂亮，却卡在上线这一步，用户迟迟用不上。所以这一节我们把发布的门道讲透。\n\n**发布，是让智能体从「搭好」走到「能用」的那一步。**\n\n在 ADP 里搭好一个应用，只是完成了开发。这时候它还待在开发环境里，只有你自己能看到、能调。发布，就是把这个应用推上线，让约定范围内的用户能真正访问到它。\n\n打个比方。开发环境像是后厨，你在里面备菜、试味道。发布则是把菜端上桌，客人这才吃得到。菜再好，不端上桌也是白搭。\n\n某零售集团搭了一个导购助手，在开发环境里测得很顺。可因为迟迟没走发布流程，一线门店根本用不上，项目验收也就一直悬着。这就是把开发当成了终点的典型误区。\n\n所以你要记住，搭好不等于交付。发布这一步不推完，前面做的都还浮在半空。\n\n**公有云直接发布，是最快的上线方式。**\n\nADP 提供公有云模式。在这种模式下，你搭好的应用可以直接在平台上一键发布，立刻生成一个可访问的入口。用户拿到链接就能用，不需要你额外准备服务器。\n\n这种方式的好处是快。从搭好到能用，中间几乎没有等待。对赶时间的项目，公有云发布是首选。\n\n某创业团队想快速验证一个市场调研助手的效果，就用了公有云直接发布。当天搭好、当天发布、当天就发给同事试用，第二天就拿到了反馈。这种速度，是公有云模式带来的。\n\n需要注意的是，公有云模式下数据会经过平台。对数据敏感的客户，就要考虑另一种模式，也就是前面章节讲过的云部署。发布方式的选择，本质上和数据要求绑在一起。\n\n再说说公有云发布的具体体感。你在平台上点发布，系统会给应用生成一个独立的访问地址。这个地址你可以直接发给用户，也可以贴到内部通知里。\n\n某咨询团队就把这个地址做成了二维码，贴在会议室墙上。同事扫码就能打开助手，连链接都不用找。发布方式虽简单，用起来的花样却可以很多。\n\n不过公有云发布也有它的适用边界。它适合对外开放、快速验证、数据不敏感的场景。一旦涉及核心业务数据，就得回到云部署那条路上重新权衡。\n\n**API 接入，把智能体嵌进你已有的系统。**\n\n有的时候，用户不希望额外打开一个新页面。他们想在自己天天用的系统里，直接用上智能体的能力。这时候就要靠 API 接入。\n\nAPI 是什么？可以理解成一个接口插座。ADP 把智能体的能力做成一个接口，你已有的系统只要接上这个插座，就能调用智能体，把它的回答显示在自己的界面里。\n\n某物流公司有一套自己的客服工作台，客服每天都在上面接单。他们不想让客服再切到别的页面，于是通过 API 把智能体接进了工作台。客服在原来的界面里，就能一键让智能体草拟回复。\n\n换句话说，API 接入让智能体「隐身」在已有系统背后。用户感觉不到它是个独立产品，只觉得原来的系统突然变聪明了。这种无感的融入，往往体验最好。\n\n不过 API 接入有个前提。对方的系统得留得出接口的位置，也得有人能改动它。如果客户的老系统封闭又没人维护，接入就会卡壳。\n\n某医院想把导诊助手接进挂号系统，结果发现老系统是多年前外包做的，早没人能改。最后只能退而求其次，先用网页版顶上。这提醒我们，评估接入可行性，要早不要晚。\n\n所以在方案设计阶段，你就该问清楚客户系统的底细。能不能接、谁来接、什么时候接，这几个问题越早问清，后面越少踩坑。\n\n**多渠道交付，让用户在熟悉的入口用上智能体。**\n\n用户的入口五花八门。有人习惯用网页，有人天天泡在企业内部的沟通软件里，还有人从对外的服务号进来。多渠道交付，就是把同一个智能体，送到这些不同的入口去。\n\n网页渠道：把智能体做成一个网页应用，用户点链接就能用，适合对外开放或临时分发。\n\n企业内部沟通渠道：把智能体接进企业日常用的沟通工具，员工在聊天窗口里就能直接问它，适合内部办公场景。\n\n网站挂件渠道：把智能体做成一个悬浮窗，嵌在企业官网的角落，访客一进网站就能咨询，适合售前接待。\n\n某中型制造企业就同时用了两个渠道。对内，把设备答疑助手接进了员工沟通软件，一线师傅随手就能问。对外，在官网挂了个咨询挂件，客户进来能自助问产品。同一个智能体，两个入口，覆盖了内外两拨人。\n\n这里的关键是，渠道不是越多越好。你要看用户到底在哪。用户在哪个入口，你就把智能体送到哪，而不是盲目地全渠道铺开。\n\n怎么判断用户在哪？最笨也最有效的办法，是去问、去看。问客户的员工平时在哪个软件里待得最久，看客户的访客一般从哪个入口进来。答案往往一目了然。\n\n某餐饮连锁想上一个内部答疑助手。团队本来打算做网页版，后来发现店长们平时根本不开电脑，全在手机沟通软件里办事。于是改成接入沟通软件，用起来的人一下子就多了。\n\n这个例子说明，渠道选错了，再好的智能体也没人用。渠道选对了，用户才会自然而然地把它用起来。选渠道的功夫，值得多花。\n\n**发布前先在测试环境验证，别把半成品推给用户。**\n\n发布是有风险的。一旦推上线，用户就会真的用。如果这时候智能体还有明显问题，第一批用户的体验就砸了。第一印象砸了，后面再补就很难。\n\n所以稳妥的做法是，先在测试环境里跑一轮。让内部同事或小范围用户先试，把明显的问题挑出来、改掉，再正式对外发布。\n\n某教育机构上线一个报名咨询助手前，先拉了十位老师内测。老师们很快发现助手答错了几条报名政策。团队改完再发布，正式上线后就没再翻车。这一轮内测，省掉了一次公开事故。\n\n内测还有个附带好处。参与内测的人，往往会成为这个助手的第一批推广者。他们试过、提过意见，上线后更愿意主动用、也更愿意帮你去带动别人。\n\n需要强调的是，测试不是走过场。你要设计一些真实用户可能问的刁钻问题去试它，而不是只问那些你知道它答得好的。专挑软肋测，才测得出真问题。\n\n**版本管理，让每次发布都可回退。**\n\n智能体上线后不是一成不变的。你会不断优化它，改 Prompt、更新知识库、调整 Workflow。每一次优化，都可能带来新的发布。\n\n问题在于，新版本未必都比旧版本好。有时候改完反而退步了。这时候你需要一个后悔药，能快速退回上一个稳定版本。\n\n版本管理做的就是这件事。每次发布都留一个版本记录，一旦新版本出问题，你能一键回退，把用户拉回到那个还能用的旧版本。\n\n某银行网点用的政策问答助手，有一次更新知识库后，反而答错了几条常见问题。幸好有版本管理，团队当场回退到上一版，先止住影响，再慢慢排查新版的毛病。没有回退能力，这种时候就只能干着急。\n\n所以每次发布前，先确认版本记录在。这不是麻烦，而是给自己留的退路。\n\n顺带说说发布的节奏。有的团队喜欢攒一大批改动一次发布，觉得省事。可一旦出问题，你很难判断是哪一处改动惹的祸。\n\n更稳的做法是小步快跑。每次只发布少量改动，出了问题范围小、好定位。某电商团队就定了规矩，一次只改一件事再发布，上线后观察一天没问题，才动下一处。\n\n这样做看似慢，其实更快。因为你省掉了大批量翻车后满地找原因的时间。发布的节奏稳了，整体交付反而更顺。\n\n**发布时的权限与访问控制，是必须守住的关卡。**\n\n发布意味着开门。门一开，谁能进、能看到什么、能做什么，都得事先划清楚。这就是权限与访问控制。\n\n同一个智能体，面对不同的人，能力边界应该不一样。给普通员工的版本，可能只能查公开信息。给管理层的版本，才放开更敏感的数据。这条界线，要在发布时就设好。\n\n某集团的人事助手就分了两档。普通员工问它，只能查到假期政策这类公开内容。而人事专员登录后，才能查到涉及个人信息的细项。同一个助手，两种权限，各看各的。\n\n关键限制在于，权限只能收紧、不能图省事放开。宁可一开始设得严一点，用户不够用了再放，也不要一上来全放开，回头出了数据问题追悔莫及。这条底线，后面第六章讲安全合规时还会展开。\n\n**总结这一节。**\n\n发布与交付，是智能体落地的最后一公里，也是最容易被低估的一步。搭好只是开发完成，推上线、送到用户熟悉的入口，才算真正交付。\n\n公有云直接发布图的是快，API 接入图的是无感融入已有系统，多渠道交付则是把智能体送到用户真正在的地方。发布前用测试环境挡住半成品，用版本管理留好退路，用权限控制守住数据的门。\n\n把这几件事做扎实，你的交付才算画上句号。发布不是甩手上线，而是稳稳地把智能体交到用户手里。而这一句号画得漂不漂亮，客户是天天用得到、感受得到的。做好了发布，前面所有的付出才真正兑现成价值。"}]},{"domain":3,"name":"场景理解与方案设计","weight":"25%","practice":[],"sections":[{"h":"3.1 需求分析与七维度翻译法","body":"需求分析是方案设计的第一道关。客户说出口的往往是一句模糊的愿望，而你要交付的是一个能搭建的方案。这中间隔着一层，需要翻译。\n\n这一节讲的七维度翻译法，就是一套提问框架。它帮你把客户的模糊话，一句句问成清晰、可落地的需求。\n\n先记住一个心态。客户不是需求文档，他不会主动把话说全。把话问全、问准，是交付工程师的手艺，不是客户的义务。\n\n很多新手栽在这一步。他们急着展示技术，客户一开口就点头说能做，回头一交付才发现南辕北辙。省掉翻译这步，看着快，其实是把返工的账记到了后面。\n\n**客户的原话，几乎从不等于真正的需求。**\n\n一个常见的开场是这样。客户说「我想要一个智能客服」。这句话听着清楚，其实什么都没定。\n\n谁来用它？回答哪类问题？接不接工单系统？答错了谁负责？这些全没说。你要是照着「智能客服」四个字就开工，八成会返工。\n\n所以第一步不是设计，而是翻译。把「我想要一个智能客服」这句愿望，拆成七个维度逐一问清。七维度问完，模糊的愿望才变成能画方案的需求。\n\n**第一维：用户是谁。**\n\n先问清楚，这个智能体到底给谁用。是企业外部的顾客，还是企业内部的员工？两者差别极大。\n\n给外部顾客用，语气要亲和，回答要克制，权限要收紧。给内部员工用，可以更直接，能查的数据也更多。同样一句「你好」，对顾客要热情周到，对同事就可以简洁利落。用户是谁，定的是整个智能体的性格底色。\n\n举个场景。某零售集团一开始说要做「客服助手」，问到用户是谁才发现，他们真正想要的是给一线导购用的内部话术助手，不是面向顾客的。用户一变，整个方案都要重画。\n\n所以第一维不能含糊带过。你要追问到能报出一个具体人群：是售前顾客、售后顾客，还是某个岗位的员工。人群越具体，后面的语气、权限、数据范围才越好定。\n\n**第二维：什么场景触发。**\n\n再问，用户在什么情况下会用到它。是顾客半夜咨询下单，还是员工上班时随手查资料？\n\n场景决定了很多设计。半夜高频咨询，就得考虑无人值守时的兜底话术。上班时段偶尔查询，就不必为峰值操太多心。\n\n某中型制造企业想做一个售后助手。问清场景后发现，用户多在设备出故障的紧急时刻求助。这个场景对响应速度和答案准确度的要求，比一般咨询高得多。\n\n场景还决定了智能体在哪里出现。是嵌在网页上，还是接在企业内部的办公工具里？出现的地方不同，交付方式也跟着不同。这一点会在后面讲应用发布和多渠道交付时再展开。\n\n**第三维：要办成什么事。**\n\n这一维问的是目标。用户用完这个智能体，希望办成一件什么事？\n\n注意，是「办成事」，不是「聊得爽」。能查到订单是办成事，能生成一份合规的报价单是办成事，只是陪聊则不算。\n\n把目标定清楚，后面验收才有准绳。某物流公司把目标从含糊的「提升效率」，收敛成「让客户自助查到包裹到哪了」，方案立刻就具体了。\n\n有个小技巧能帮你收敛目标。让客户用一句话说完「用户做完这件事，会松一口气说什么」。这句话往往就是真正的目标，比一堆形容词管用。\n\n**第四维：现在这件事怎么做。**\n\n问清现状，是为了找到智能体的切入点。这件事现在由谁做、怎么做、卡在哪一步？\n\n如果现在是人工一条条回，那智能体的价值就是替人回。如果现在是查好几个系统才能拼出答案，那价值就是一站式整合。\n\n某财务团队报销答疑，原来靠一位老员工口头解答。问清现状后，方案的方向就明确了：把她脑子里的规则沉淀成知识库，让智能体来答。\n\n问现状还有一个好处，就是能估准工作量。现状越乱、系统越多，整合的活儿就越重。你把现状摸清了，报价和排期才不会拍脑袋。\n\n**第五维：靠什么知识和数据。**\n\n智能体要答得准，得有料可依。这一维问的是，回答问题需要哪些知识和数据。\n\n有的知识在文档里，那就整理成知识库，配合 RAG 让智能体按需检索。RAG 说白了，就是让智能体答题前先翻一遍资料，找到相关段落再作答，而不是凭记忆硬答。有的数据在业务系统里，那就得靠连接器实时去取。\n\n某教育机构做课程咨询助手，一开始以为把课程手册喂进知识库就够了。问到数据才发现，学员最关心的排课和余位是实时变动的，光靠静态知识库答不了，必须接上排课系统。\n\n这里要分清两类料。一类是相对稳定的知识，比如政策、手册、规则，适合放进知识库。另一类是实时变动的数据，比如库存、余位、订单状态，得靠连接器现取。分不清这两类，方案就容易埋雷。\n\n**第六维：要接哪些系统。**\n\n这一维紧接上一维，问的是连接。智能体要办成事，往往得动别的系统。\n\n查订单要接订单系统，下工单要接工单系统，发通知要接消息渠道。这些都靠连接器或工具来打通。接得越多，智能体能办的事就越多，但要接的口子也越多，调试的活儿也越重。所以接哪些、先接哪个，得排个优先级。\n\n需要注意的是，接系统不只是技术活，还牵涉权限。某连锁门店想让助手帮顾客改订单，问到这一维才意识到，改单是敏感操作，得先想清楚谁有权改、怎么防误操作。这一点会引到后面的安全设计。\n\n接系统还有一个现实约束，就是对方系统给不给接口。有的老系统没有现成接口，接起来费劲。这一维问清楚，能帮你提前发现这类硬骨头，别等方案定了才发现接不进去。\n\n**第七维：怎么算做成了。**\n\n最后一维，也是最容易被跳过的一维。问清楚：这个智能体做到什么程度，客户才认可它成了。\n\n没有这条，验收时就会扯皮。客户觉得不好用，你觉得已达标，各说各话。\n\n所以要把成功标准量化。某零售集团把标准定成「顾客自助解决率达到某个水平、答错率压到某条线以下」。有了这条准绳，交付到没到位，一测便知。这一维会直接接上后面讲的验收指标设计。\n\n定成功标准时，别贪多。挑一两个客户最在意、又测得出来的指标就够了。指标定太多，反而没人认真看，验收时还是扯皮。\n\n**七个维度问完，模糊需求就落了地。**\n\n把七维度串起来看，它其实是一条链。用户是谁、什么场景、要办成什么事，这三维定的是「做什么」。现在怎么做、靠什么知识、接哪些系统，这三维定的是「怎么做」。怎么算做成了，最后一维定的是「做到什么程度」。\n\n一句愿望，被这七问拆开，就成了一张需求清单。清单在手，你才敢往下画方案。\n\n有人问，这七维的顺序能不能打乱。顺序是有讲究的。前三维定「做什么」，是方向；中间三维定「怎么做」，是路径；最后一维定「做到什么程度」，是终点。先有方向，再谈路径，最后定终点，这个次序最顺。\n\n实际聊的时候不必死守顺序。客户话头飘到哪，你就先接哪一维，只要最后七维都覆盖到就行。顺序是提纲的骨架，不是对话的枷锁。\n\n**翻译时的两个常见坑，要提前躲开。**\n\n第一个坑是替客户想当然。客户说「智能客服」，你脑子里立刻浮现一个标准方案，问都不问就开工。结果做出来的，是你以为的需求，不是客户的需求。\n\n第二个坑是七维度问得太生硬。你要是端着一张表一条条念，客户会觉得像在被审问。更好的做法是聊天式地把七维度自然带出来，边聊边记，聊完清单也就有了。\n\n换句话说，七维度是你心里的提纲，不是甩给客户的问卷。提纲在心里，对话在嘴上，这才是熟练交付工程师的样子。\n\n聊完之后，记得把七维度的答案落成文字。哪怕只是简短几行，也比记在脑子里强。这张纸后面画方案、定验收、跟客户对齐，都要反复用到。\n\n某中型制造企业的项目就吃过亏。前期聊得热闹，却没落文字，等到交付时双方对「做成什么样」各执一词。从那以后，七维度答案落纸签字，成了开工前的固定动作。\n\n**用一个完整案例，把七维度走一遍。**\n\n某零售集团想做一个「会员咨询助手」，最初的需求就这七个字。我们用七维度问一遍看看。\n\n用户是谁？问下来是已注册的会员，不是路人顾客。什么场景？会员想查积分、查订单、问退换货政策时用。要办成什么事？让会员不用打电话就能自助查清楚。\n\n现在怎么做？现在是客服电话接，高峰期排队严重。靠什么知识和数据？退换货政策是稳定知识，适合进知识库；积分和订单是实时数据，得接系统。\n\n要接哪些系统？会员系统查积分，订单系统查订单。怎么算做成了？定成会员自助解决大部分常见咨询、电话量明显下降。\n\n七维度一走，「会员咨询助手」这七个字，就变成了一张能直接开工的清单。哪些进知识库、哪些接系统、做到什么算成，全都清清楚楚。这就是翻译法的威力。\n\n**总结这一节。**\n\n需求分析的核心，是把客户的一句愿望翻译成一张清晰的需求清单。七维度翻译法给了你七个固定的提问角度：用户是谁、什么场景、要办成什么事、现在怎么做、靠什么知识和数据、要接哪些系统、怎么算做成了。\n\n七问问完，你既知道了要做什么，也知道了怎么做和做到什么程度。这张清单，就是下一节方案画布的原料。需求翻译得越准，方案画得越稳。反过来说，需求这关没翻译清楚，后面画得再漂亮也是空中楼阁。所以别嫌这一步慢，它是整个交付里最值得花时间的地方。"},{"h":"3.2 构建模式选型：标准、单工作流、Multi-Agent、Claw 与智能工作台","body":"选好构建模式，是方案设计里最见功力的一步。同一个需求，用对了模式事半功倍，用错了模式处处别扭。这一节我们把 ADP 上的几种构建模式摆开，讲清楚各自适合什么、不适合什么，最后给你一套能当场用的选型方法。\n\n先说一个大原则。模式没有高下之分，只有匹配与否。越简单的模式越稳、越好维护，能用简单的就别上复杂的。这句话请你记一辈子，它能帮你躲开大半的返工。\n\n**标准模式，是最轻的一档，适合一问一答的知识场景。**\n\n标准模式的核心，是让智能体基于知识库回答问题。你把资料喂进知识库，配好 Prompt 和角色，它就能针对用户的提问，从知识库里找到依据、组织成答案。它不主动干多步骤的活，就专心做好问答这一件事。\n\n这一档最像一个「懂行的客服」。用户问什么，它答什么，答案有知识库兜底，不容易跑偏。\n\n举个场景。某连锁酒店想要一个内部制度问答助手，员工问「病假怎么请」，它就从制度知识库里找到对应条款，用大白话回给员工。这类需求不涉及多步操作，标准模式就够了，上更复杂的模式反而是浪费。\n\n标准模式的边界也很清楚。一旦需求里出现「查完还要下单」「答完还要走审批」这类多步动作，标准模式就撑不住了，得往上一档走。\n\n还有一个判断窍门。如果客户的需求，用一句「帮我从资料里找到答案」就能概括，那多半是标准模式的活。一旦这句话后面还要接「然后再做什么」，就说明要往上一档考虑了。\n\n标准模式还有个好处，是上手快、维护省。它结构简单，出了问题一眼能看出是知识库的事还是 Prompt 的事。对第一次做智能体的客户，从标准模式起步，是最稳妥的开局。\n\n**单工作流模式，适合步骤固定、照章办事的流程。**\n\n单工作流模式的核心，是用一条预先编排好的 Workflow 把多个步骤串起来。每一步做什么、下一步走哪里，都是你事先画定的。它像一条流水线，来一个任务，就按既定路线跑一遍。\n\n它和标准模式的区别，在于「会做事」而不只是「会回答」。标准模式给你一句话答案，单工作流能帮你把一串动作办完。\n\n举个场景。某电商团队要处理售后退货，流程是固定的：先核对订单、再判断是否符合退货规则、然后生成退货单、最后通知仓库。这四步顺序不变，用一条 Workflow 串起来最合适。\n\n单工作流的长处是稳。因为路线是定死的，它不会自作主张，每次都按同一套流程走，结果可预期、好排查。\n\n它的短板也在这里。遇到流程之外的意外情况，它不会灵活变通，只会卡在那里或报错。所以它只适合那些「步骤清晰、极少例外」的场景。\n\n这里有个实用的对照。你可以先问客户一句：这个流程能不能画成一张固定的流程图。如果能，而且图上几乎没有分叉，那单工作流就很合适。如果客户支支吾吾说「要看情况」，那就得警惕，流程可能没那么固定。\n\n某制造企业的质检报告流程就很典型。取数、比对标准、生成结论、归档，四步几乎从不变。这种铁打的流程，交给单工作流最省心，也最不容易出岔子。\n\n**Multi-Agent 模式，适合需要多个角色分工协作的复杂任务。**\n\nMulti-Agent 模式的核心，是让多个智能体各司其职、协同完成一个大任务。每个 Agent 负责自己擅长的一块，彼此之间传递信息、接力配合。它像一个小团队，而不是一个人。\n\n为什么需要多个 Agent？因为有些任务一个角色扛不下来。把大任务拆成几个专业角色分别处理，每个角色的 Prompt 和知识都更聚焦，整体质量反而更高。\n\n举个场景。某市场团队要做竞品分析报告，可以拆成三个 Agent：一个负责搜集资料，一个负责提炼要点，一个负责润色成文。三个角色接力，最后交出一份完整报告。\n\nMulti-Agent 的长处是能啃硬骨头。面对那种单一角色搞不定的综合任务，多角色分工能显著提升产出质量。\n\n但它也更重。角色越多，编排越复杂，调试也越费劲。所以只有当任务确实复杂到「一个角色扛不动」时，才值得上 Multi-Agent，否则就是自找麻烦。\n\n怎么判断一个角色扛不扛得动？有个简单的信号。如果你发现要给一个智能体写的 Prompt 越来越长，塞进去一堆互相打架的要求，那就是它快扛不住了。这时把职责拆给几个 Agent，每个角色清清爽爽，效果往往更好。\n\n某招聘团队做简历筛选时就体会到这点。一开始想让一个 Agent 又读简历、又打分、又写评语，结果它顾此失彼。拆成读取、评分、点评三个角色后，每一环都稳了。\n\n**Claw 模式，适合需要智能体自主规划、灵活应对的开放任务。**\n\nClaw 模式的核心，是给智能体更大的自主权，让它自己规划步骤、自己决定调用哪些工具，去完成一个目标。你给的不是固定路线，而是一个目标，剩下的路它自己找。\n\n它和单工作流正好相反。单工作流是「路线你定死，它照着走」，Claw 是「目标你给定，路它自己规划」。一个是照章办事，一个是随机应变。\n\n举个场景。某咨询团队想要一个能帮忙做调研的助手，任务是「摸清某个新兴行业的概况」。这个任务没有固定套路，需要智能体自己判断该查什么、该怎么一步步深入。这种开放式任务，正是 Claw 的用武之地。\n\nClaw 的长处是灵活。面对没有标准流程、需要临场判断的任务，它比死板的工作流强得多。\n\n它的代价是可控性下降。既然让它自主规划，它就有可能走弯路，或者做出你没预期的动作。所以用 Claw 时，权限约束和结果检查要格外上心，这一点后面第六章会专门讲。\n\n用 Claw 还有一个心理准备要给客户打好。它的产出不是每次都一模一样，因为它每次的规划路径可能不同。客户如果期待「输入相同就输出相同」，那 Claw 未必合适，或者要在关键环节加上约束。\n\n某投研团队用 Claw 做行业速览时就约定好，让它先列调研提纲、经人确认再展开。这样既保留了 Claw 的灵活，又不至于让它跑太远，是个折中的好办法。\n\n**智能工作台，是把多个能力聚在一个界面里协同使用。**\n\n智能工作台的核心，是给使用者一个统一的操作台，把知识库、工具、多个智能体的能力集中在一处，让人在其中边用边调。它不是一种单独的「自动跑」模式，而更像一个「人机配合的工作间」。\n\n它适合那些「人还要深度参与」的场景。有些工作没法全交给智能体自动完成，需要人一边看、一边改、一边让智能体帮忙，这时智能工作台就很顺手。\n\n举个场景。某内容团队做长文创作，作者需要智能体帮忙查资料、拟提纲、润色段落，但最终的取舍还得人来定。在智能工作台里，作者可以随时调用这些能力，人主导、智能体辅助，配合得很紧密。\n\n智能工作台的价值，在于把「人」放回了流程中心。它承认有些活离不开人的判断，于是把智能体做成趁手的助手，而不是甩手的替代。\n\n判断要不要用智能工作台，看一个信号就够。如果这件事的最终决策权必须在人手里，而且人要频繁介入、反复调整，那就用工作台把能力聚起来，让人坐镇中间。\n\n某设计团队做品牌方案时就是这样。查参考、出草图、改文案，每一步都要设计师亲自定夺，智能体只做副手。这种人唱主角的活，智能工作台比全自动模式贴心得多。\n\n**把五种模式放到一起，选型其实有章可循。**\n\n现在我们把五档摆齐：标准模式管问答，单工作流管固定流程，Multi-Agent 管多角色协作，Claw 管自主开放任务，智能工作台管人机深度配合。看清它们各自的位置，选型就有了地图。\n\n选型的第一问，是「这件事要不要做多步动作」。如果只是问答，标准模式到此为止。如果要办多步的事，才往下看。\n\n选型的第二问，是「步骤是不是固定」。步骤固定、极少例外，用单工作流。步骤不固定、需要临场判断，才考虑 Claw。\n\n选型的第三问，是「一个角色够不够」。一个角色扛得动，就别拆。扛不动、需要多专业分工，才上 Multi-Agent。\n\n还有一个贯穿始终的问题，是「人要不要深度参与」。如果人必须全程盯着、随时插手，那就把智能工作台作为承载，把其他模式的能力嵌进去用。\n\n需要注意一个常见误区。客户和新手都容易一上来就想用最炫的模式，觉得 Multi-Agent 和 Claw 才够高级。这是本末倒置。选型的智慧恰恰在于「够用就好」，能用标准模式解决的，绝不上 Multi-Agent。\n\n换句话说，模式选型比的不是谁用得复杂，而是谁看得准。看准需求的真实复杂度，配上刚好匹配的模式，既省成本又好维护，这才是交付工程师的真本事。\n\n再给你一个落地的小习惯。跟客户过需求时，边听边在心里对号入座，把每个诉求归到某一档模式上。听完一轮，方案的骨架其实就有了。\n\n还要留意需求会长大。今天是标准问答，明天客户可能就想加下单。所以选型时不妨多问一句：这个需求半年后会不会长出新步骤。心里有数，架构就能留好余地，不至于返工重来。\n\n在收尾前，再给你一句好记的口诀。问答用标准，定流程用单工作流，多角色用 Multi-Agent，开放任务用 Claw，人主导用智能工作台。这五句话背下来，现场选型就有了顺手的抓手。\n\n口诀好记，难的是克制。越是能力强的模式越诱人，但交付的口碑是靠稳定攒出来的。宁可用一档稳稳落地，也别用三档华而不实，这份克制本身就是专业。\n\n总结这一节。ADP 提供了从轻到重的多档构建模式，标准、单工作流、Multi-Agent、Claw 各有各的地盘，智能工作台则托底人机配合。选型的核心是三问加一问：要不要多步、步骤是否固定、一个角色够不够、人要不要深度参与。答清这几问，模式自然浮出水面。记住那句老话，能用简单的就别上复杂的。选型选得准，后面的交付就顺了大半。"},{"h":"3.3 方案画布：从模糊需求到可搭建方案","body":"前两节我们做了两件事。一是学会听懂客户的话，二是心里对构建模式有了谱。这一节把它们接起来。\n\n需求听清了，模式也大致定了。接下来的问题很实在：怎么把这些散落的判断，拼成一张能让人照着动手的图纸。\n\n这张图纸，我们叫它方案画布。它是交付工程师最常用的工具之一。\n\n为什么非得有这张图纸？因为不画图就动手，是新手最容易栽的坑。客户一句话，你听着觉得懂了，直接上手搭，搭到一半发现方向偏了。\n\n返工的代价很高。时间耗掉了，客户的信任也磨掉了。而一张画布，花半天填清楚，能省掉后面好几周的来回。\n\n画布还有个隐藏好处：它把你脑子里的判断摊开给客户看。客户看得见，才谈得拢。很多分歧，在填画布的当场就化解了，不必等到交付才爆发。\n\n**方案画布是需求和搭建之间的那座桥。**\n\n客户说的是业务话，平台上搭的是功能件。这两头对不上，是很多项目卡壳的根源。\n\n方案画布做的，就是把业务话翻译成搭建件。它把一个模糊的诉求，拆成几个固定的格子。每个格子只回答一个具体问题。\n\n可以把它想成装修前的户型改造图。客户说「我想要个敞亮的家」，设计师不能直接开工。得先把这句话落到图上：哪面墙拆、厨房挪去哪、采光怎么走。\n\n方案画布就是智能体项目的那张改造图。填完它，你能对着它跟客户逐格确认，也能对着它安排搭建。图在，活就不会跑偏。\n\n**第一格：业务目标，先问清楚到底要解决什么。**\n\n业务目标不是功能清单。它是客户真正想拿到的结果。\n\n很多人一上来就问「你想要什么功能」。这是本末倒置。功能是手段，结果才是目的。\n\n某零售集团找上门，说想要一个会答问题的智能体。你要往下追一层：答谁的问题、答完要达成什么。追下来才发现，他真正要的是让门店店员不用总打电话问总部。\n\n这才是业务目标：减少店员的求助电话，让他们自己就能查到答案。有了这句话，后面每一格都有了准星。\n\n**第二格：用户与场景，谁在什么情况下用它。**\n\n同一个智能体，给不同的人用，做法天差地别。所以第二格要把用户和场景钉死。\n\n用户是谁，决定了说话的方式。给一线员工用，语言要直白；给专业人员用，可以带术语。\n\n场景是什么，决定了交付的形态。某物流公司的调度员在货车驾驶室里用手机查规则，那就得能一句话问、一句话答。要是让他翻长文档，等于没做。\n\n把用户和场景写清，你就知道这个智能体该长什么样、接在哪里、用什么口气说话。\n\n反过来看一个踩坑的例子。某零售集团一开始想做个功能很全的网页版助手，界面漂亮、功能一堆。可店员真正的使用场景，是在货架前用手机随手一问。\n\n网页版在手机上难用，店员宁可继续打电话。功能再全也白搭。后来改成手机上一问一答的轻形态，用的人才多起来。这说明用户场景一旦看错，方案从根上就偏了。\n\n**第三格：能力拆解，把大目标切成一件件小事。**\n\n业务目标往往是一大件。直接搭搭不出来，得先切开。\n\n能力拆解就是把大目标拆成智能体要会的几件小事。每件小事，对应一个能落地的动作。\n\n还是那个零售集团的例子。「让店员自己查到答案」这个目标，可以拆成三件小事：查商品信息、查促销规则、查退换货流程。\n\n三件小事各自清晰，就能分别去想每件怎么实现。大目标一旦拆开，搭建的路就明了。\n\n拆解也有个分寸。拆得太粗，等于没拆，还是无从下手。拆得太细，又会陷进琐碎，抓不住重点。\n\n好的粒度，是每件小事都能对应一个清晰的动作。查商品信息是一件事，查促销规则是另一件事，各自独立、互不缠绕。以这个标准去切，拆出来的小事就好落地。\n\n**第四格：知识与数据，智能体的底气从哪来。**\n\n智能体不是天生什么都懂。它的底气，来自你喂给它的知识和数据。\n\n这一格要回答：要答这些问题，得先准备哪些资料。资料从哪来，是文档、表格，还是要连的系统。\n\n那个零售集团的三件小事里，查促销规则靠的是一份份促销文档。这些文档要整理好、放进知识库，智能体才能查得准。这就是 RAG 要解决的事：让智能体带着资料来回答，而不是凭空编。\n\n需要注意的是，知识的质量直接决定回答的质量。资料乱，答得就乱。所以这一格常常是交付里最花功夫的地方。\n\n举个实在的例子。某零售集团的促销文档散落在好几个人手里，格式五花八门，还有不少过期的旧版本。直接丢进知识库，智能体就会答出互相打架的规则。\n\n正确的做法是先做一轮梳理：删掉过期的，统一格式，标清适用范围。梳理完再入库，回答的准确率立刻上了一个台阶。这道功夫省不得。\n\n**第五格：工具与连接，让智能体能动手。**\n\n光会查还不够。有些事，得让智能体真去做一个动作。这就要用到工具和连接器。\n\n工具让智能体能算、能查实时数据、能调用外部能力。连接器让它接上客户已有的系统。\n\n某财务团队想让智能体查某张发票报销到哪一步了。这个答案不在文档里，在报销系统里。那就得用连接器把系统接上，让智能体去实时查。\n\n这一格要列清楚：哪些问题光靠知识库答不了，得接工具或系统。接什么、怎么接，都写在这格里。\n\n这里有个常见的过度设计。有人一上来就想把所有系统都接上，好像接得越多越厉害。其实不然。\n\n接系统是有成本的。每接一个，就多一分对接和维护的负担。所以原则是按需接：这一期的问题非接不可才接，能靠知识库答的就先不接。省下的力气，留给真正要紧的地方。\n\n**第六格：构建模式，选一条最省力的搭建路线。**\n\n前面几格把要做的事理清了。这一格决定用什么方式把它搭起来。\n\n上一节我们学过几种构建模式：标准模式、单工作流、Multi-Agent、Claw 和智能工作台。选哪种，看事情的复杂度。\n\n如果只是查资料答问题，标准模式配知识库就够。如果要按固定步骤走流程，单工作流更稳。如果一件事要多个角色配合，才上 Multi-Agent。\n\n那个零售集团的查询需求，三件小事都是查，标准模式加知识库就能扛。不必为了显得高级去堆复杂结构。选最省力的那条路，是本事，不是偷懒。\n\n选错模式的代价也不小。某财务团队的一个简单查询需求，被搭成了多角色协作的复杂结构。结果维护起来处处是坑，一点小改动都牵一发动全身。\n\n后来推倒重来，换回标准模式，反而又稳又好改。所以这一格的心法就一句：够用就好，别为复杂而复杂。\n\n**第七格：交付边界与验收，把话说在前面。**\n\n最后一格，也是最容易被跳过的一格。它回答两个问题：这次做到哪、怎么算做成了。\n\n边界要划清。这一期做查询，不做下单，就白纸黑字写下来。不然客户以为什么都包，交付时准扯皮。\n\n验收要能量。「答得准」太虚，得落成能数的指标。比如常见问题的回答准确率达到某个线，就算过。\n\n某中型制造企业的项目里，双方一开始没写边界，客户中途不断加要求，交付一拖再拖。后来补了这一格，范围一清，进度才稳下来。把话说在前面，是保护双方。\n\n验收指标怎么定，也有讲究。指标要能量，还要够得着。定得太高，交付方做不到；定得太虚，客户不认账。\n\n一个实用的办法，是先划一批高频问题作为测试集。让智能体去答这批问题，答对的比例达到双方约定的线，就算通过。测试集摆在明面上，验收时谁都不含糊。\n\n**画布不是填完就锁死的表格。**\n\n新手容易把画布当成一次性的表格，填完就不动了。这是误解。\n\n画布是活的。跟客户逐格过一遍，常常会发现新东西。某一格填不下去，往往说明前面某格没问清。\n\n所以正确的用法是来回走。填到第四格发现知识不够，就退回第一格，重新确认目标是不是太大了。画布的价值，正在这种来回校准里。\n\n换句话说，画布是你和客户共同打磨方案的台面。填的过程，本身就是把需求越谈越实的过程。\n\n还有一点值得记住。同一个客户，不同阶段的画布也会变。这一期的画布只管这一期的事，下一期再开一张新的。别想着一张画布包打天下。\n\n**一个完整的例子：从一句话到一张画布。**\n\n我们把整张画布走一遍。某零售集团的原话是：「想要个会答问题的智能体。」\n\n第一格业务目标：减少门店店员打给总部的求助电话。第二格用户与场景：一线店员，在门店现场用手机随手问。\n\n第三格能力拆解：查商品信息、查促销规则、查退换货流程，三件事。第四格知识与数据：整理三类文档，放进知识库，用 RAG 支撑回答。\n\n第五格工具与连接：这一期都是查文档，暂不接系统。第六格构建模式：标准模式加知识库，够用。\n\n第七格交付边界与验收：这期只做查询、不做下单；三类问题的回答准确率达到约定的线即通过。\n\n你看，一句模糊的话，走完七格，就成了一张能动手的图纸。这就是方案画布的力量。\n\n**总结这一节。**\n\n方案画布是把模糊需求变成可搭建方案的结构化工具。它有七格：业务目标、用户与场景、能力拆解、知识与数据、工具与连接、构建模式、交付边界与验收。\n\n七格逐个填清，客户的一句话就落成了一张图纸。这张图纸让确认有据、搭建有路、结果可量。\n\n记住，画布是活的台面，不是死的表格。你越会用它跟客户来回校准，方案就越实、交付就越稳。"},{"h":"3.4 验收指标设计与第一期切口","body":"方案画出来了，客户也点头了。但项目真正的风险，往往不在方案画得好不好，而在验收时说不清楚。这一节讲两件事：怎么把验收指标定下来，怎么把第一期的范围切好。这两件事定不好，后面交付就会陷进无休止的扯皮。\n\n先说一个常见的坑。很多交付到了尾声才发现，客户心里的「做好了」和你心里的「做好了」根本不是一回事。你觉得助手能答八成问题就算成功，客户却觉得答不出的那两成就是失败。分歧的根子，在开工前没把验收指标讲清。\n\n**验收指标要在方案敲定时就一起定，不能拖到最后。**\n\n指标定得越早，双方的预期就越对齐。等到交付快结束才补指标，等于让客户在看到结果后再定标准，这时候标准往往会被情绪带着走。开工前定，大家都还冷静，标准也更客观。\n\n某零售集团上线一个客服助手时就吃过亏。方案里只写了「提升客服效率」，没有具体数字。上线后客户觉得效率没提上去，交付方却拿不出反驳的依据。双方各执一词，项目验收拖了很久。\n\n后来复盘才明白，「提升效率」这四个字不是指标，是愿望。真正的指标得能被测量、能被双方共同确认。愿望人人会说，指标却要费心思去定。\n\n把愿望翻译成指标，是这一节的核心手艺。客户说想提升效率，你要接着问，效率体现在哪个环节、用哪个数能看出来。一路问下去，模糊的愿望就落成了具体的数。\n\n**好的验收指标，要同时满足可测量、有基准、有目标三个条件。**\n\n可测量，指标必须落到一个能算出来的数上。比如答对率、平均响应时长、人工介入率，这些都能拿数据说话。而像「体验流畅」「回答智能」这类词，没法测量，就不能当指标。\n\n有基准，指要有一个改造前的参照值。你说答对率要到八成，得先知道现在人工客服或旧系统是多少。没有基准，八成到底是进步还是退步，谁也说不清。\n\n有目标，指要有一个双方认可的达标线。这条线不能拍脑袋定，要结合基准和业务实际去谈。目标定得太高交付方够不着，定得太低客户不认账，得找一个双方都能接受的点。\n\n举个场景。某物流公司要做一个单号查询助手，验收指标可以这样定。查询准确率这一项，基准是人工查询的准确率，目标定在不低于人工水平。平均响应时长这一项，基准是人工平均回复时间，目标定在缩短一半。这两个数都能测、都有参照、都有明确的线。\n\n这里要提醒一个常见误区。有些交付方喜欢把目标线定得很漂亮，比如答对率九成九。数字好看，签字时客户也高兴。可一旦实际跑不到，交付方就骑虎难下。\n\n目标线的定法，宁可稳一点，也别冒进。你可以先定一个有把握的达标线，再约定一个更高的冲刺线。达标线保底、冲刺线激励，双方都有台阶。\n\n还要注意指标的测量方式也得写清。同样是答对率，是按条算还是按会话算，人工抽检还是系统自动统计，不同算法结果差很多。测量方式不写死，验收时又是一场扯皮。\n\n**指标不是越多越好，要抓住业务最在意的那两三个。**\n\n有的交付方喜欢在验收表里堆一二十个指标，看着很全，其实很虚。指标一多，考核就散了，客户也记不住到底哪个最重要。\n\n正确的做法是先问客户一个问题。这个项目如果只能用一个数来证明成功，你会看哪个数。这个数，就是核心指标。围绕它再补一两个辅助指标，就够了。\n\n某中型制造企业做一个质检报告助手，核心指标就一个：报告生成的返工率。客户最痛的就是报告反复改，只要返工率降下来，项目就算成。其他的响应速度、格式规范，都是辅助。\n\n抓住核心指标还有一个好处。当交付过程中出现取舍时，你能拿核心指标当准绳。凡是帮助核心指标的就优先做，其他的往后放。目标清楚了，力气就不会白费。\n\n怎么帮客户找出核心指标。有个好用的追问法，反复问客户「如果这个数没变好，这个项目对你还有意义吗」。问到某个数客户说没意义，那个数往往就是核心。\n\n某零售集团一开始列了七八个指标，什么都想要。用这个追问法一轮下来，客户自己发现真正在意的只有一个，就是顾客问题的一次性解决率。核心一旦锁定，方案的重心立刻就清楚了。\n\n**除了效果指标，还要约定几条底线指标。**\n\n效果指标讲的是「做得多好」，底线指标讲的是「不能出什么事」。这两类指标缺一不可。\n\n底线指标通常和安全、合规、稳定相关。比如不能泄露客户隐私数据、不能给出违规内容、关键操作必须留痕。这些事一旦出问题，做得再好也是零分。\n\n某财务团队的报销助手就定了一条硬底线。任何涉及金额修改的操作，都必须留下可追溯的记录。这条指标不追求「多好」，只要求「必须有」。它是项目能上线的前提，不是加分项。\n\n需要注意的是，底线指标要写成明确的红线，不能含糊。写「注意数据安全」等于没写，要写成「用户隐私字段不得出现在日志中」这类能检查、能验证的具体条款。\n\n底线指标还有一个特点，它是一票否决的。效果指标没达到，可以谈补救、谈二期。底线指标一旦破了，项目就得停下来整改，没有商量余地。\n\n所以底线指标不能定太多，但每一条都得是真红线。把最不能出事的两三件事拎出来，写成硬条款，其余的放进效果指标里。红线太多，反而没人当真。\n\n**第一期范围要切小，先啃下最痛也最可控的那一块。**\n\n很多项目失败，不是因为方案不好，而是因为第一期铺得太大。范围一大，周期就长，变量就多，客户还没看到成果就先失去了耐心。\n\n切第一期有个原则。找那个客户最痛、而你最有把握做成的场景。痛，客户才有动力配合。有把握，你才能快速拿出成果。两者叠加，第一期就能打响。\n\n某零售集团想做一整套智能客服体系，覆盖售前、售中、售后所有环节。这个盘子太大，一口吃不下。第一期只切了一个最小的口，就做售后的订单查询这一个高频问题。\n\n为什么选它。因为订单查询占了客服工作量的很大一块，客户最痛。而这个问题答案明确、数据现成，用知识库加连接器很快就能搭出来，交付方最有把握。第一期把这一个口做透、做出数据，客户的信心就建立起来了，后面的扩展才有基础。\n\n反过来看一个切错口的例子。某企业第一期挑了一个听起来最高级的场景，让助手去做复杂的经营分析。结果数据不全、口径又乱，做了很久也拿不出像样的结果，客户信心一点点被磨没。\n\n教训很清楚。第一期不是用来秀技术难度的，而是用来建立信任的。越是花哨、越是依赖复杂数据的场景，越不适合放在第一期。先挑好啃的，把信任攒起来，难的留到后面。\n\n**第一期的切口，要能在短周期内跑出可看的数据。**\n\n第一期最忌讳的是周期太长。周期一长，客户的耐心和预算都会被消耗。理想的第一期，应该在一个较短的窗口内就能上线、就能拿出一组能看的数据。\n\n这组数据是后面一切的敲门砖。它既能证明方案可行，又能给客户信心，还能为第二期的指标提供真实基准。所以第一期哪怕范围很小，也一定要跑到「有数据」这一步，不能停在「搭出来了」。\n\n换句话说，第一期的目标不是功能有多全，而是闭环有多实。哪怕只做一个场景，也要把从需求到上线、再到数据回收的整个环跑通。环通了，项目就活了。\n\n**把验收指标和第一期切口绑在一起，形成一份双方共识。**\n\n指标和切口不是两张分开的表，而是一份共识。这份共识要写清楚，第一期做哪个场景、用哪几个核心指标衡量、基准是多少、目标线在哪、底线是什么。\n\n这份共识最好让客户一起参与制定，而不是交付方单方面拟好让客户签字。客户参与得越深，后面认账的程度就越高。他自己定的目标，验收时就很难反悔。\n\n某教育机构做一个答疑助手，就把双方的人拉到一起，花了半天时间共同敲定。第一期只做数学科目，核心指标是答疑采纳率，基准取自现有答疑记录。这份共识出来后，整个项目的验收几乎没再起过争议。\n\n需要注意的是，共识一旦定下，就要作为整个第一期的准绳，不能中途随意改。如果业务确实变化需要调整，也要双方重新确认，而不是一方说了算。稳定的共识，才是交付方最好的护身符。\n\n共识定好后，最好还配上一个中期检查点。不要等到第一期结束才对一次数，而是在中途设一个小节点，提前看指标走势。走势不对，早发现早调整，别等交付完才发现方向偏了。\n\n某教育机构就在第一期中途设了一次对数。当时发现答疑采纳率低于预期，追下去才知道是知识库覆盖不全。趁早补了知识库，到验收时指标就回到了目标线上。中期检查这一步，帮他们躲过了一次返工。\n\n总结这一节。验收指标要在方案敲定时就定好，满足可测量、有基准、有目标，抓住核心的两三个，再配上不可退让的底线指标。第一期范围要切小，选客户最痛且你最有把握的场景，在短周期内跑出可看的数据。最后把指标和切口绑成一份双方共识，作为整个第一期的准绳。指标清、切口小、共识实，交付自然就稳了。把这三件事做扎实，你就把项目最大的风险，稳稳挡在了开工之前。"}]},{"domain":4,"name":"行业解决方案与案例落地","weight":"15%","practice":[],"sections":[{"h":"4.1 行业场景图谱：医疗、传媒、工业、法务、教育与钢贸","body":"行业落地是前沿部署工程师真正的主战场。平台能力写得再漂亮，不能在具体行业里兑现价值，客户就不会买单。这一章先建立六个行业的场景地图，再给出把客户模糊诉求切成可交付单元的方法，最后用三个完整案例把前面所有章节的知识串起来实战一遍。\n\n**先看行业落地的共同规律。**\n\n任何行业项目动手前都可以先问三个问题：这个行业的知识沉淀在哪里？一线的重复劳动发生在哪个环节？答错一次要付出多大代价？第一个问题决定知识库怎么建，第二个问题决定场景切在哪里，第三个问题决定权限、引用与兜底要做多重。带着这三个问题去看六个行业，你会发现它们的差异远没有想象中大，本质都是「知识+对话+流程」的不同组合。\n\n**医疗：专业严谨是第一约束。**\n\n医疗行业的智能体场景集中在三类：面向患者与会员的用药咨询和健康科普，面向医药企业的医生学术互动管理，面向院内窗口的导诊与随访。它的知识特点是术语体系严格、内容更新快、一条错误答案可能影响用药安全。因此医疗场景的标准配方是：知识库承载药品说明书与专业指南，标准模式或单工作流承载问答，回答必须带出处，答不了就引导人工。以一家三甲医院药剂科的用药咨询助手为例：药师团队把常用药品说明书、常见配伍禁忌、储存要求整理入库，窗口咨询的问题里六成是「这两种药能不能一起吃」这类常识题，助手逐条给出依据并标注来源条款，药师抽检合格后才对外使用，上线后窗口常见问题咨询量下降四成，药师把时间留给了真正复杂的个体化问题。医疗场景的交付边界必须写死：不做诊断建议，不做个体化剂量调整，凡是涉及具体患者的专业判断一律转给执业药师或医师，助手只做信息查询与流程辅助。抓住这条边界，医疗客户反而更敢放手用。\n\n**传媒：拼的是时效与产量。**\n\n传媒行业的痛点来自两端：内容需求爆发式增长，而人工产能有天花板；多平台分发要求同一素材长出多种形态。它的典型场景包括热点洞察、选题辅助、初稿生成、视觉物料、视频拆条等。这类场景对时效的要求压倒一切，一条热点快讯的传播窗口可能只有几个小时，而严谨性的把关可以靠「机器初稿+人工终审」的分工来保住。某都市报融媒体中心的例子很有代表性：新媒体编辑组只有八个人，日更压力大，团队用 Multi-Agent 模式搭了一个内容生产流水线——选题 Agent 负责从素材库和热点线索里提选题清单，撰写 Agent 按栏目风格生成快讯初稿，审校 Agent 做事实要点核对与敏感词拦截，三个 Agent 接力，编辑只处理机器标红的存疑段落，终稿一律由主编人工签发。上线后日产量接近翻倍，快讯类稿件的平均成稿时间从两个小时压缩到四十分钟。传媒场景的关键边界是签发权永远在人：智能体负责提速，不负责背书，把这条写进方案，主编才愿意在流程里给智能体留位置。\n\n**工业：把老师傅的经验装进知识库。**\n\n工业客户最常见的三个场景是质检辅助、设备排障和操作规程问答。它们的共同痛点是：设备资料分散在纸质手册、老旧档案和老师傅的脑子里，新工程师上手慢，夜间值班遇到疑难没人可问，同一个故障在不同班组手里处理时长差三倍。工业场景的标准配方是知识库加单工作流：知识库装设备手册、故障案例、操作规程，单工作流把排障过程固定成「先问现象、再查特征、给处置建议、留处理记录」的引导式流程。一家汽车零部件工厂的售后排障助手就是这么做的：项目组访谈了资深工程师，整理出几十个高频故障案例入库，值班工程师遇到问题先跟助手对话，助手按工作流逐项确认故障特征，检索案例库给出「最可能的三个原因」及对应处置步骤，每条建议都注明出处页码。新员工的排障达标周期从三个月缩短到五周，夜间报修的平均响应时间明显下降。工业场景的边界同样清晰：涉及停机决策、安全操作和现场动手的环节，助手只提供依据，决定权在持证人员手里，方案里要把这句话原样写出来给客户的安全部门看。\n\n**法务：条款比对是最肥沃的场景。**\n\n法务场景天然适合智能体，因为它的知识高度文本化、比对工作高度重复。典型场景有合同起草、合同审查、版本比对、条款检索和知识问答。法务团队的日常痛苦很具体：一份采购合同改到第七版，商务同事只说「改了几个地方」，法务要在两万字里找出那几处改动；审查清单靠个人记忆，不同律师的审查深度不一致。某集团法务部上线的合同比对助手是这样用的：上传新旧两版合同，助手逐段对齐并输出差异清单，标注实质性变更、格式变更与风险新增三类，再按内置审查要点给出风险提示，法务只需复核机器标注过的段落。原来一次比对要半个工作日，现在二十分钟拿到结构化差异表。这个场景的权限设计也有讲究：合同文本属于高敏内容，知识库按部门隔离，外部律师的访问范围单独配置，所有检索留痕。法务场景的边界是定位问题——助手是「辅助标注工具」，法律意见必须由律师出具，方案与产品话术里都不能出现替律师下结论的表述。\n\n**教育：一名助教顶半个教研组。**\n\n教育行业的场景覆盖教、学、管、研、创、赛多条线，落到智能体上最见效的是三件事：课程答疑、备课辅助与校务问答。它的痛点是学生问题重复度极高、教师答疑时间被大量基础问题占用、各类校规与流程问答零散分散。某职业院校的用法值得参考：课程答疑助手把讲义、习题解析、课程大纲装进知识库，学生按章节提问，回答附讲义页码；教师端的智能工作台则被用作备课助手，老师把素材丢进去，由助手整理成结构化教案初稿与随堂测验题。上线一学期后，教师每周花在重复答疑上的时间减少约三分之一，学生满意度问卷里「问题响应及时」一项明显上升。教育场景有两个特殊边界：一是成绩、评语等敏感操作绝不走智能体，涉及个人信息的数据入知识库前必须脱敏；二是面向未成年人的场景内容安全阈值要更高，审核策略要在方案期就单独设计。\n\n**钢贸：把报价经验变成即时响应。**\n\n钢贸听起来离智能体很远，其实是数字化洼地里最容易出效果的场景。钢贸业务的核心动作是询价识别、查货配单、报价生成与采购寻源，痛点是规格表述五花八门、行情随时间波动、报价能力集中在少数老业务员手里，新人接一个询价电话要翻半天库存表和价格本。一家钢贸公司的报价助手是这样搭的：单工作流串起「询价解析、规格匹配、库存核对、报价生成」四步，客户用自然语言报需求，助手识别材质、规格、数量与交货地，通过连接器对接进销存系统查库存，再结合价格策略生成报价单草稿，异常大单与特价申请自动转人工。上线后普通询价的响应时间从小时级降到分钟级，新人也能给出符合公司策略的报价。这个案例的价值在于提醒我们：不要被行业的「土」吓退，只要满足知识可沉淀、动作可拆解、数据可对接三个条件，传统行业一样是智能体的好土壤。\n\n**行业选择的判断框架。**\n\n六个行业看完，可以提炼出一个通用的判断框架，四个维度打分：知识密度，即客户的知识是否已经文本化沉淀，还是散在人脑里；对话频次，即同类问题是否高频重复出现；数据可得性，即客户能否在短期内提供语料、样例与系统接口；合规要求，即答错的代价有多高、行业监管有多严。医疗和法务属于合规权重高的类型，引用溯源与拒答机制要做重；传媒和钢贸属于时效权重高的类型，流程自动化与人工终审的分工要做清；工业的成败手在知识治理，老师傅经验的采集整理往往比平台搭建更花时间。给一个新行业做判断时，建议先按四维各打一到五分，总分低于十分的场景直接放弃，高于十五分的优先立项，中间的放观察池等数据成熟。\n\n**行业经验的迁移与复用。**\n\n跨行业交付是前沿部署工程师的日常，好消息是方法论完全可迁移：先做知识盘点，再切高频场景，最后按评测驱动迭代，这套打法在医疗和在钢贸没有本质区别。同一个标准模式问答能力，换一份药品说明书库就是药师助手，换一份设备手册库就是排障助手，换一份课程讲义库就是答疑助手——这正是平台型智能体开发的价值所在，也是工程师敢于跨行业接项目的底气。要做重的功课只有两块：一是行业知识本身的快速学习，入场前把客户领域的核心术语表过一遍，访谈时才不会被当成外行；二是行业边界意识的重新校准，每个行业的「不能碰」清单都不一样，进场第一件事是让客户把它写下来。\n\n**教育：把个性化答疑做到底。**\n\n教育场景的高频点集中在答疑与辅导。教师资源有限，学生的问题千差万别。某在线教育平台用智能体处理常见题答疑：按知识点搭建知识库，学生随时提问，标准模式即时回答，答不上的自动转给老师。上线后，常见问题的响应时间明显缩短，老师把精力留给了更深的辅导。教育场景的边界很清楚：不做学习替代，只做辅助参考。答案要引教材出处，鼓励学生自己思考，这是教育行业的分寸。\n\n**钢贸：把价格与单据理清楚。**\n\n钢贸行业的信息密度集中在价格、库存、合同和单据。价格一天轮动多次，业务员要翻好几张表才能报一个价。某钢贸公司的报价助手，把每日价格、库存、历史成交价接入知识库，业务员一问就能拿到参考报价和依据。边界是：最终报价由人确认，助手只做信息聚合和参考。把高频查询变辅助，把人工作业变高效，是钢贸场景的核心价值。\n\n**六个行业看完，回到那条主线。**\n\n把六个行业摆在一起看，共性非常清晰：知识沉淀在哪里，重复劳动在哪里，答错的代价在哪里。抓住这三个问题，任何行业都能快速切出可落地的场景结构。行业图谱不是一次定死，而是动态更新的。行业在变、业务在变，图谱也要跟着更新，方案才始终贴近真实。"},{"h":"4.2 案例拆解方法：客户原话到交付切片","body":"客户永远不会把需求说清楚——这不是抱怨，而是所有交付现场的铁律。客户说出来的话是痛点的线索，不是可以直接开工的需求。这一节讲的就是把客户原话一路翻译到交付切片的完整方法，它是方案设计能力在真实项目里的落地形态。\n\n**原话是线索，不是需求。**\n\n先看一个典型场景。客户说：「我们要一个智能客服。」这句话能开工吗？不能。因为它背后可能藏着四种完全不同的诉求：把常见问题挡在人工之前，把工单分对类别，把售前咨询接住促成转化，或者把投诉情绪先安抚住。这四种诉求对应的知识域、评测指标、模式选型完全不同，照着原话直接搭一个聊天机器人，上线后发现驴唇不对马嘴，是行业项目里最常见的翻车方式。前沿部署工程师的价值，恰恰体现在把这句模糊的话变成几张清晰的切片表。\n\n**先收集原话，再谈翻译。**\n\n收集原话有三条主渠道。第一是现场访谈，跟着一线人员干一天活，胜过开三次需求会——你会亲眼看到他们被什么问题打断、在哪个系统里翻找、向谁求助。第二是历史记录，客服工单、咨询记录、热线录音整理稿，这些是最诚实的证据，高频问题会自己浮出来。第三是日常吐槽，「每天都被问一样的问题」「每次都要翻三张表」这类抱怨，往往就是下一个切片的雏形。收集时要立一条纪律：原样记录，不当场翻译。客户嘴里的「查不到」可能是检索问题、可能是数据没入库、也可能是权限没开放，翻译工作是拿到全部素材之后的事。\n\n**从原话到诉求：动词与名词分离法。**\n\n拿到几十上百条原话后，用最笨也最稳的办法拆解：把每句原话拆成「动作+对象」。动词提示客户想要的处理方式——查、比、写、算、提醒、推荐，各不相同；名词提示知识域——价格、库存、条款、政策、排班，一目了然。把动词相同的归一堆，名词相同的归一堆，原话背后的真实工作量就现形了：客户嘴上说的一件事，拆出来往往是五六件独立的事。比如「会员问题太多忙不过来」这一句话，拆出来可能是订单查询（查+订单）、退换政策问答（答+政策）、会员权益计算（算+权益）、活动咨询（答+活动）四件事，它们的数据来源、权限要求、上线难度天差地别，绝不可能用一个场景包圆。\n\n**诉求到切片：第一期切口要小。**\n\n拆出来的事情不能一口气全做，要切成第一期能交付的切片。一个合格的交付切片要同时满足三个标准：场景单一，一个切片只服务一个知识域加一个任务，混了两个场景的切片会在评测期暴露问题；效果可度量，切片上线前就能写出检验指标，比如常见问题一次回答准确率、单次处理时长；短周期见效，数据可得、权限可用的切片优先，需要大规模对接或治理数据的需求放二期。这三条标准的本质是把风险关进笼子：切口小意味着评测集小、调试快、返工成本低，客户在四周内看到第一个可用版本，信任就建立起来了，后面的路会越走越顺。\n\n**价值排序：频次、痛感、可行性。**\n\n切好片还要排序。三个维度打分：频次，这个问题每天发生多少次；痛感，不解决的话业务有多难受；可行性，数据、权限、对接条件是否具备。三高场景直接进第一期，高频高痛但数据暂时拿不到的列进第二期并写明前置条件，低频高危的场景不交给智能体，而是设计人工兜底加知识辅助。排序时有一个常见的直觉陷阱要避开：客户高层往往最爱点名「最先进最智能」的场景，而它们常常是低频场景；频次数据是谈判的最佳武器——把工单统计表往桌上一放，第一期的范围之争往往自然平息。\n\n**预期管理同样要写进方案。**\n\n切片表不只是排期工具，更是预期管理工具。每个项目都要在方案里明确「不做什么」：系统接口拿不到的不做承诺，数据没有沉淀的不做承诺，高风险决策环节不交给智能体、涉及个人信息的数据不入库。这份负面清单看起来是在砍自己的范围，实际上它保护的是双方——客户不会在结果确认时拿一个从未谈过的场景来质问，工程师也不会被「顺手加个功能」拖进无底洞。有经验的工程师会把负面清单写在方案第一页，让客户方负责人签字确认，这一步做得越早，项目后期的沟通成本越低。\n\n**一个完整的翻译示例。**\n\n某零售集团客服负责人说：「会员咨询太多了，客服团队忙不过来，店员也答不好。」按流程走一遍：先收集素材，调出三个月的两千条会员咨询记录，访谈了六家门店的店长和客服坐席；再做动词名词分离，两千条记录聚出四个高频簇——订单与物流查询占四成、退换货政策问答占三成、会员权益与积分规则占两成、活动与商品咨询占一成；然后对照可行性打分：政策问答的知识已经在内部制度文件里齐备、频次高、痛感强，订单查询频次最高但需要打通订单系统接口、周期不可控；最终第一期选定退换货政策问答，两周上线，答案附带制度文件出处，店员端小程序直接可用，客服分流率第一周就达到预期。回头看，如果当初照原话直接做一个「大而全的智能客服」，第一个场景就会陷入接口泥潭，项目大概率在第三个月失去客户耐心。\n\n**切片之后：需求清单怎么写。**\n\n每个切片要写清五件事才算过关：面向谁，使用角色是店员、坐席还是会员本人，权限各不相同；答什么，知识域清单与每份知识的责任人；怎么答，选哪种构建模式、用哪些能力组合、要不要带出处；答成什么样，写得出具体数字的检验指标；答不了怎么办，拒答话术、兜底流程与转人工路径。这份清单在项目里承担「施工图」角色，后续的数据准备、调试、评测、培训全部围绕它展开。把五件事写齐，方案设计阶段的功课就做完了八成，剩下两成是现场临时应变的余量。\n\n切完片，还要排好交付顺序。\n\n切片排好，交付顺序不能随意。先做数据齐、权限通、见效快的，客户能尽早看到反馈，信心就有了。顺序怎么排，不能拍脑袋，要看三件事：数据是否就绪，权限是否打通，周期是否最短。三样都满足的先进一期；数据暂时拿不到的进二期并写明前置条件；风险高的不交给智能体，改为人工加知识辅助。顺序排对了，项目推进就顺了。\n\n每个切片，都要配效果确认指标。\n\n切片要配一个可量化的效果确认标准。比如常见问题解决率不低于七成，平均处理时间压缩到两分钟以内。指标写进方案，客户在结果确认时对照检查，交付效果一目了然。指标是双方的契约。指标定准了，结果确认才不扯皮。\n\n切片的风险，要提前标注。\n\n每个切片都要把风险点亮出来：数据质量有没有保证，接口依赖是否稳定，权限是否可能延期。风险提前写，落地的时候才有准备。把风险摊在明面上，是对客户负责，也是对自己负责。\n\n切片上线后，要回头复盘。\n\n切片交付不是终点。上线后要复盘：效果和预期差距多大，客户用得顺不顺，还有哪些可以再拆。复盘结论带着进下一个切片，才能不断进步。切片之间不是孤立的，前一片的经验是后一片的地基。\n\n客户原话，是最好的沟通桥梁。\n\n交付过程中不要丢掉客户的原话。方案里引用一句客户的原话，客户就知道你真的听懂了。沟通中的信任，往往就建立在这些细节上。原话不是废话，是项目里最真实的锚点。\n\n说不清的场景，也一起列出来。\n\n哪些场景现在说明不了，哪些数据暂时拿不到，哪些接口需要协调。这些待定项，都要清清楚楚列在方案里。列出来，是管理；不列，是埋雷。每个项目都有待定项，把它们放到明面上，项目推进才不会踩空。\n\n把方法沉淀成模板。\n\n客户原话到切片的方法，做上几个项目，就能沉淀成模板。访谈提纲、动词名词分离表、切片排期表，都可以做成现成的工具。模板化，让后面的项目交付更快，也让新人容易上手。把方法变成工具，经验才真正被复用起来。\n\n做一个项目，长一份方法。\n\n每个案例做完，都要把
