能体方案里，最不能省的一条边界是什么？","o":[{"l":"A","t":"签发权永远在人"},{"l":"B","t":"签发可以完全交给机器"},{"l":"C","t":"边界可以事后补"},{"l":"D","t":"编辑不需要参与流程"}],"a":["A"],"e":"智能体负责提速，不负责背书。签发权在人，主编才愿意在流程里给智能体留位置，出了问题责任链也清楚。把签发权写进方案，主编才愿意让智能体进入流程。\n【干扰项】\nB：机器签发无法承担内容责任。这条路本身就走不通。内容出错时机器没法出面担责，签发环节必须落到具体的人身上。\nC：事后补会漏，风险先跑在前面。边界后补等于先裸奔一段时间。\nD：编辑处理机器标红的存疑段落，人必须参与。人机分工里，编辑是关键一环。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-022","d":4,"t":"single","q":"法务团队「审查清单靠个人记忆、不同律师审查深度不一」的痛点，智能体怎么解？","o":[{"l":"A","t":"没有解法，只能靠老带新"},{"l":"B","t":"把审查要点内置到流程，输出统一深度的风险提示"},{"l":"C","t":"完全替代律师出意见"},{"l":"D","t":"只负责排版打印"}],"a":["B"],"e":"智能体把审查要点结构化进流程，逐项输出风险提示，不同律师拿到的辅助材料一致，审查深度就有了统一基线。把个人经验流程化，团队才有一致的交付标准。\n【干扰项】\nA：结构化辅助正是解决经验流失的工具。把要点内置成流程，新人上手不再依赖碰运气的传帮带。\nC：法律意见必须由律师出。专业意见必须由人来签署。这一点要分清楚。\nD：只做排版没发挥价值。排版只是附属功能，价值有限。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-023","d":4,"t":"multiple","q":"收集客户原话时要求「原样记录、不当场翻译」，原因有哪些？","o":[{"l":"A","t":"客户说「查不到」可能是检索、数据、权限等多种问题"},{"l":"B","t":"当场翻译会混入主观判断"},{"l":"C","t":"保留完整素材便于后续系统拆解"},{"l":"D","t":"客户不喜欢被追问细节"}],"a":["A","B","C"],"e":"原话先原样记录，是因为一句话背后可能是多种原因，当场翻译会带着猜测走偏。完整素材到手后再做系统拆解，判断才有据。先记录后翻译，是保住素材价值的纪律。\n【干扰项】\nD：与翻译纪律无关，现场追问是正常动作。追问细节与不当场翻译并不矛盾。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-024","d":4,"t":"single","q":"现场访谈强调「跟着一线干一天活」，它比开三次需求会更有效的原因是什么？","o":[{"l":"A","t":"能顺便完成驻场考勤"},{"l":"B","t":"能认识更多客户员工"},{"l":"C","t":"能增加项目工时记录"},{"l":"D","t":"能亲眼看到一线被什么问题打断、在哪个系统翻找、向谁求助"}],"a":["D"],"e":"跟岗的价值在于看到真实痛点：被打断的瞬间、翻找的动作、求助的对象，这些都是会议室里问不出来的第一手线索。一手观察比二手转述可靠得多。\n【干扰项】\nA：考勤不是访谈目的。跟岗是需求采集动作，不是考勤。别把注意力放错了地方。\nB：认识人是副产品，不是目标。认识人是顺带结果，不是目标。别把注意力放错了地方。\nC：工时记录与需求采集无关。跟岗的产出是需求线索。它不在本题的判断范围里。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-025","d":4,"t":"single","q":"客服工单、咨询记录这类历史记录，在需求分析中的定位是什么？","o":[{"l":"A","t":"最诚实的证据，高频问题会自己浮出来"},{"l":"B","t":"只是存档要求，没有分析价值"},{"l":"C","t":"只能用来考核员工绩效"},{"l":"D","t":"属于隐私数据一律不能看"}],"a":["A"],"e":"历史记录是真实发生过的需求，比访谈更少修饰。统计高频分布，第一批场景常常自己浮出来，是最诚实的证据源。数据先说话，判断再跟上。这条原则要贯穿交付全程。\n【干扰项】\nB：记录的分析价值很高。历史记录的分析价值极高。这一点要分清楚。\nC：绩效考核不是它在需求分析里的用途。需求分析不等于绩效考核。\nD：脱敏后可用于分析，不是一律不看。脱敏合规后即可用于分析。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-026","d":4,"t":"single","q":"零售集团会员咨询案例里，第一期选退换货政策问答而不是订单查询，判断依据是什么？","o":[{"l":"A","t":"政策问答听起来更高科技"},{"l":"B","t":"订单查询业务不重要"},{"l":"C","t":"客户随口提到所以先做"},{"l":"D","t":"政策知识齐备、频次高、痛感强；订单查询需打通接口、周期不可控"}],"a":["D"],"e":"第一期切片按可行性打分：政策问答的知识在内部制度文件里齐备，可立刻做；订单查询虽然频次最高，但要打通订单系统接口，周期不可控，放二期。订单查询进二期并写明接口打通为前置条件，正是可行性排序的用法。\n【干扰项】\nA：先进感不是选型依据。先进感是情绪判断，选型要看数据与条件。\nB：订单查询频次最高，不是不重要，是依赖不同。订单查询依赖接口打通，先把依赖讲清楚再排期。\nC：随口一提不是排序依据，要靠数据。排序靠频次与可行性数据说话。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-027","d":4,"t":"multiple","q":"方案里写「负面清单」（明确不做什么），它的作用有哪些？","o":[{"l":"A","t":"管理双方预期，结果确认时不会拿未谈过的场景质问"},{"l":"B","t":"保护工程师不被顺手加功能拖进无底洞"},{"l":"C","t":"把风险边界提前亮给客户"},{"l":"D","t":"只写进合同条款，不进项目执行过程"}],"a":["A","B","C"],"e":"负面清单看似砍范围，实际保护双方：预期锁定、范围锁定、风险前置。写到方案第一页并让客户确认，后期沟通成本大幅下降。写进方案第一页并让客户确认，负面清单才真正生效。\n【干扰项】\nD：清单必须落进执行过程，只在合同里躺着，范围蔓延照旧发生，管理预期无从谈起。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-028","d":4,"t":"single","q":"客户高层坚持要做「最先进最智能」但频次很低的场景，交付方最有效的应对是什么？","o":[{"l":"A","t":"直接照做免得得罪客户"},{"l":"B","t":"当场拒绝并批评客户外行"},{"l":"C","t":"把工单统计表摆到桌面，用频次数据引导排序"},{"l":"D","t":"口头答应实际不做"}],"a":["C"],"e":"高层常被「先进感」吸引，而这类场景往往低频。频次数据是谈判的最佳武器：真实统计往桌上一放，第一期范围之争往往自然平息。频次统计是事实，比任何争论都更有说服力。\n【干扰项】\nA：照做会浪费第一期资源，交付价值出不来。第一期资源花在低频场景，交付价值出不来。\nB：硬碰硬伤信任，数据比情绪有力。硬顶伤合作，数据是温和而有力的引导。\nD：口头答应不做，埋下后期冲突。拖着不做比拒绝更伤信任。方向反了努力就白费。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-029","d":4,"t":"single","q":"连锁药房用药咨询案例选「标准模式加知识库」，最核心的选型理由是什么？","o":[{"l":"A","t":"单一知识域问答、知识源权威、答错代价高需要引用溯源"},{"l":"B","t":"标准模式是最贵的方案"},{"l":"C","t":"客户点名要求这个模式"},{"l":"D","t":"团队只会用这个模式"}],"a":["A"],"e":"三条理由：场景是典型单一知识域问答；药品说明书是权威结构化文本；答错代价高，标准模式便于做引用溯源与拒答设计。模式跟着场景走，这也是全章反复强调的选型原则。\n【干扰项】\nB：选型不看贵不贵，看合不合适。贵不贵与合不合适是两回事。代价与收益完全不成比例。\nC：客户指定不是核心理由，场景决定。即使客户点名，也要按场景校验。\nD：能力局限不应成为选型理由。团队要为场景补能力，而不是迁就局限。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-030","d":4,"t":"multiple","q":"药房案例的交付过程里，哪些动作是关键环节？","o":[{"l":"A","t":"八百份常用药品说明书入库前做三轮去重与口径统一"},{"l":"B","t":"评测集三百个真实问题里放两成边界题和对抗题"},{"l":"C","t":"先在十家门店试运行两周"},{"l":"D","t":"上线当天直接铺到全部两百家门店"}],"a":["A","B","C"],"e":"数据治理、含边界题的评测、小范围试运行，是这类高敏场景的标准动作：先把数据和评测做实，再小步放量验证。数据、评测、试运行三步做实，放量才有底气。\n【干扰项】\nD：没有试运行直接全量，风险集中爆发不可控。直接全量等于把所有风险一次性暴露给用户。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-031","d":4,"t":"single","q":"药房评测暴露「商品名与通用名映射缺失」导致命中率上不去，正确处理是什么？","o":[{"l":"A","t":"立刻换更大的模型"},{"l":"B","t":"宣布项目失败终止"},{"l":"C","t":"让店员手工翻译顾客问题"},{"l":"D","t":"补一张商品名与通用名对照表后二次评测"}],"a":["D"],"e":"评测定位到缺失的是映射数据而非模型能力，补对照表即可解决，再跑评测验证。这是「定位、假设、修改、验证」的典型闭环。定位到数据缺失就补数据，这正是评测驱动调优的意义。\n【干扰项】\nA：问题在数据不在模型，换模型无效。模型能力足够，缺的只是映射数据。\nB：可修复的问题不值得终止。一个数据问题不值得推翻整个项目。\nC：手工翻译不可持续，治标不治本。人工兜底只能应急，不能当常态。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-032","d":4,"t":"single","q":"药房案例复盘里，被认定为「成功点」的核心是什么？","o":[{"l":"A","t":"回答速度比人工快三倍"},{"l":"B","t":"药师团队规模可以相应缩减"},{"l":"C","t":"引用溯源设计让药师团队敢于放行"},{"l":"D","t":"会聊天气氛好"}],"a":["C"],"e":"答错代价高的场景，重心不在答得多而在答得可查。每个答案可回溯到说明书原文，责任边界清楚，专业团队才敢对外使用。答得可查比答得多更重要，这是高敏场景的价值排序。\n【干扰项】\nA：速度有价值但不是这个案例的成功关键。速度是加分项，可信才是及格线。\nB：分流的目标是把药师留给复杂问题，而不是削减人力，把提效理解成裁人既误读价值也伤信任。\nD：闲聊能力与专业场景无关。闲聊不产生专业价值。它不在本题的判断范围里。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-033","d":4,"t":"single","q":"制造企业排障案例用「单工作流为主干、Multi-Agent 做分工」，理由是什么？","o":[{"l":"A","t":"纯粹为了展示技术能力"},{"l":"B","t":"排障流程性强需要固定骨架，检索与报告性质不同适合拆开"},{"l":"C","t":"不同环节各配一个不同的大模型，能力更强"},{"l":"D","t":"团队人多需要分活"}],"a":["B"],"e":"强流程任务用单工作流锁住顺序，检索与报告两个环节工作量大且性质不同，拆成独立 Agent 各管一摊，整体才既稳又清晰。该紧的地方紧、该拆的地方拆，架构设计就是做取舍。\n【干扰项】\nA：技术展示不是交付目标。交付目标是解决问题，不是展示技术。\nC：选型依据是环节性质与交接成本，堆不同模型徒增协调难度，能力并不因此更强。\nD：排班问题与技术架构无关。分工跟着环节性质走，不跟人手走。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-034","d":4,"t":"multiple","q":"制造案例的知识采集过程，体现了哪些纪律？","o":[{"l":"A","t":"访谈八位资深工程师做口述整理"},{"l":"B","t":"案例按现象、特征、原因、处置、注意事项的模板入库"},{"l":"C","t":"每个案例经第二位工程师复核"},{"l":"D","t":"老师傅随口一句就直接入库使用"}],"a":["A","B","C"],"e":"知识采集占项目近一半时间：访谈、模板化、双人复核，三步把个人经验变成可信的组织资产，避免把个人错误固化进库。双人复核这道闸，决定了知识库的长期可信度。\n【干扰项】\nD：没有复核的口述入库，质量风险极高。没有复核的经验入库，等于把风险也一起存了进去。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-035","d":4,"t":"single","q":"制造排障案例调试时，问诊 Agent 传给检索 Agent 的信息由原始描述改为结构化字段，命中率明显改善，这印证了什么？","o":[{"l":"A","t":"模型必须越大越好"},{"l":"B","t":"原始描述应该保留不用改"},{"l":"C","t":"Agent 数量不够要再加"},{"l":"D","t":"多角色接力中，交接信息质量决定整体效果"}],"a":["D"],"e":"多角色设计里最要紧的一环是交接：上游传下去的字段是否结构化、是否够用，直接决定下游的检索质量。案例的改善靠的不是换模型，而是把交接信息改扎实。\n【干扰项】\nA：与模型大小无关，是信息结构问题。命中率的差异出在交接信息的结构上。\nB：原始描述信息模糊，直接传效果差。模糊的原始描述喂不饱下游。\nC：问题不在数量，在交接质量。数量解决不了质量瓶颈。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-036","d":4,"t":"single","q":"制造案例用一百二十个历史工单做盲测，这种评测方式的价值是什么？","o":[{"l":"A","t":"现场即时编题比旧工单更能考验系统"},{"l":"B","t":"为了凑够评测数量"},{"l":"C","t":"用真实历史问题检验处置建议的命中率，贴近实战"},{"l":"D","t":"历史工单没有参考价值"}],"a":["C"],"e":"历史工单是最贴近实战的评测素材：盲测能反映助手对真实问题的首条命中与候选覆盖，比人工编的题目更能说明效果。盲测的意义就在真实：真实问题、真实命中、真实结论。\n【干扰项】\nA：现场编题带着出题人的预设，容易避开真实盲区，历史工单才是最诚实的试金石。\nB：数量服务于覆盖面，不是凑数。覆盖面靠合理抽样，不靠凑数。别把注意力放错了地方。\nD：真实工单恰恰是价值最高的评测源。真实数据永远是评测的首选。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-037","d":4,"t":"single","q":"制造排障项目复盘认为「最有价值的产出」是什么？","o":[{"l":"A","t":"助手界面获得了好评"},{"l":"B","t":"项目按期完成"},{"l":"C","t":"降低了服务器成本"},{"l":"D","t":"四十个结构化案例，把老师傅脑子里的经验变成组织资产"}],"a":["D"],"e":"比省下多少小时更值钱的是知识资产化：散在个人脑子里的排障经验第一次有了组织级的沉淀载体，人走了经验还在，后续所有系统都能复用。知识资产化比省时间更值钱，这是排障项目的深层回报。\n【干扰项】\nA：界面观感不是复盘核心。界面是表层，资产才是内核。别把注意力放错了地方。\nB：按期完成是项目要求，不是价值亮点。按期是纪律，不是亮点。别把注意力放错了地方。\nC：成本不是这个案例的主目标。成本优化不是这个项目的主线。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-038","d":4,"t":"multiple","q":"面对服役超龄、资料残缺的老设备，制造案例的处理方式包含哪些要点？","o":[{"l":"A","t":"该型号在知识补齐前一律走人工通道"},{"l":"B","t":"在方案里如实写明知识边界"},{"l":"C","t":"让助手对缺资料设备强行给出建议"},{"l":"D","t":"把风险边界提前告知客户"}],"a":["A","B","D"],"e":"知识不全就明确降级：该型号走人工、边界写进方案、风险提前告知。这是「答不了就体面转出去」在知识侧的体现，比硬答安全得多。知识不齐就明说边界，比硬答安全得多。\n【干扰项】\nC：缺依据强行建议等于制造幻觉，高风险。缺依据强答等于主动制造幻觉。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-039","d":4,"t":"single","q":"传媒案例里，编辑在新流程中的角色变化是什么？","o":[{"l":"A","t":"从写稿转为审核所有初稿全文重写"},{"l":"B","t":"完全退出流程"},{"l":"C","t":"只处理机器标红的存疑段落，终稿由主编签发"},{"l":"D","t":"工作内容不变，只是换了个更快的工具"}],"a":["C"],"e":"人机分工的要点是让人只做机器做不了的事：机器出初稿并自标存疑，编辑只复核标红段落，主编签发。人的时间被用在刀刃上。人的时间被解放出来，才叫真的提效。\n【干扰项】\nA：全文重写等于没提效。机器初稿的质量仍需人来兜底。两者不能混为一谈。\nB：人不能退出，签发与把关必须保留。提效靠分工，不靠加班。这点上没有商量余地。\nD：角色确实变了：从逐字写稿转为把关签发，把人机分工理解成换工具，就低估了流程再造的价值。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-040","d":4,"t":"single","q":"传媒案例日产量接近翻倍、成稿时间从两小时压到四十分钟，这主要来自什么？","o":[{"l":"A","t":"模型比人写得好"},{"l":"B","t":"编辑加班变多"},{"l":"C","t":"减少发布数量"},{"l":"D","t":"流水线分工把人从初稿劳动里解放出来，只做把关"}],"a":["D"],"e":"提效来自结构性分工：初稿由机器生成，人只做复核与签发。产能瓶颈从「写不过来」变成「把得住」，产量自然上去。产能瓶颈从写稿移到把关，产量自然就上去了。\n【干扰项】\nA：机器初稿只是提速，质量仍靠人把关。机器负责初稿，不负责定稿。\nB：靠加班提效不可持续。加班提效不可持续也不健康。这一点要分清楚。\nC：产量是上升的，不是靠减量。成稿时长是压缩的，不是靠减量。别把注意力放错了地方。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-041","d":4,"t":"multiple","q":"三个综合案例放在一起看，反复出现的共同方法有哪些？","o":[{"l":"A","t":"先锁场景边界，再定方案结构"},{"l":"B","t":"评测集从项目一开始就建，不等上线再补"},{"l":"C","t":"方案与客户对齐后再动手"},{"l":"D","t":"上线即终点，交付完不再跟踪"}],"a":["A","B","C"],"e":"共性主线：边界先行、评测先行、对齐先行，上线之后持续运营。这三个先行决定项目稳不稳，案例不同但方法相通。这三个先行，是项目稳定推进的底层保障。\n【干扰项】\nD：上线是运营的起点，不跟踪等于把价值做了一半。运营期恰恰是价值兑现的主战场。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-042","d":4,"t":"single","q":"综合案例选模式时的判断顺序，正确的是什么？","o":[{"l":"A","t":"先看场景性质：单一问答用标准模式，强流程用单工作流，多角色分工用 Multi-Agent"},{"l":"B","t":"先挑最复杂的模式显得专业"},{"l":"C","t":"全部用 Multi-Agent"},{"l":"D","t":"跟着别的项目抄"}],"a":["A"],"e":"模式是手段，场景是依据：知识问答、流程任务、多角色接力分别对应不同形态。按场景性质选型，事半功倍。选错模式，后面的努力都在还债。把它记牢，落地就不会跑偏。\n【干扰项】\nB：复杂度不等于适配度，选型看场景。适配度才是选型的唯一标准。\nC：一刀切多角色既慢又贵。一刀切会造成既慢又贵的双重代价。\nD：照抄别人的模式忽略场景差异，容易错配。场景不同，照抄必错。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-043","d":4,"t":"single","q":"案例里「上线不等于结束」指的是什么？","o":[{"l":"A","t":"上线后合同才算生效"},{"l":"B","t":"上线后工程师可以离场不管"},{"l":"C","t":"上线后系统不再变化"},{"l":"D","t":"上线后还要运营：跟踪效果、收反馈、迭代优化"}],"a":["D"],"e":"上线是运营的起点。药房案例的二期规划、制造案例的持续补知识，都说明价值在运营里继续释放。交付完就断线，价值只做了一半。运营让案例价值继续兑现，也是交付责任的一部分。\n【干扰项】\nA：与合同生效无关。上线时间与合同条款生效与否无关。它不在本题的判断范围里。\nB：离场不管会让问题积压。离场会让问题无人认领。这一点要分清楚。\nC：业务在变，系统必须跟着迭代。业务变化必须由迭代来承接。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-044","d":4,"t":"single","q":"「切片的颗粒度」拿捏到什么程度比较合适？","o":[{"l":"A","t":"越大越好，一次做完所有功能"},{"l":"B","t":"一个切片一到两周能交付为宜"},{"l":"C","t":"越细越好，一天切十个"},{"l":"D","t":"颗粒度无所谓"}],"a":["B"],"e":"颗粒度适中：切太细碎片化管理成本高，切太粗周期长风险大。一到两周一个切片，节奏稳、反馈快、客户信心持续。颗粒度是节奏控制器，过大过小都会伤项目。\n【干扰项】\nA：大切片返工代价高。大切片的风险会一次性压上来。后果会直接落在项目上。\nC：过细会拖垮管理成本。这一点要分清楚。一天十个切片会同时压垮验证与反馈的节奏，交付质量没法看。\nD：颗粒度直接决定交付节奏，不是无所谓。节奏是交付体验的直接来源。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-045","d":4,"t":"single","q":"切片表除了排期，还承担什么沟通职能？","o":[{"l":"A","t":"它是客户看得见的进度条，也是双方的结果确认契约"},{"l":"B","t":"只是内部任务清单"},{"l":"C","t":"用来应付检查的形式文件"},{"l":"D","t":"没有沟通职能"}],"a":["A"],"e":"切片表把进度摊开：哪些在交付、哪些在排队、哪些已上线，客户随时看得见。指标写在表里，结果确认就有了共同参照。进度透明，是信任最便宜的来源。\n【干扰项】\nB：它同时是内外沟通工具。它同时服务内外两个受众。这一点要分清楚。\nC：形式文件起不到管理作用。没有管理作用的表只是形式。这一点要分清楚。\nD：它恰恰是重要的沟通载体。沟通正是它的第二职能。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-046","d":4,"t":"single","q":"客户中途要求加场景、改范围时，正确的做法是什么？","o":[{"l":"A","t":"无条件全部照做"},{"l":"B","t":"一律拒绝客户"},{"l":"C","t":"先问清理由、评估代价与影响，再决定是否变更"},{"l":"D","t":"口头答应拖着不做"}],"a":["C"],"e":"变更有据才可控：问清为什么改、影响哪些切片、代价多大。有理由的调整纳入计划，无理由的蔓延要顶住，项目才不越做越偏。变更管理守住的是项目边界与客户信任。\n【干扰项】\nA：全盘照做会让范围失控。范围失控的代价由双方共同承担。这一点要分清楚。\nB：一概拒绝伤合作，评估后再定。一概拒绝会伤合作关系。这一点要分清楚。\nD：拖延答应埋下信任隐患。拖着不做比拒绝更糟。方向反了努力就白费。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-047","d":4,"t":"multiple","q":"零售集团完整翻译示例中，从原话到第一期落地经历了哪些步骤？","o":[{"l":"A","t":"调出三个月两千条会员咨询记录"},{"l":"B","t":"访谈六家门店的店长和客服坐席"},{"l":"C","t":"按频次和可行性给四个高频簇打分"},{"l":"D","t":"照原话直接做一个大而全的智能客服"}],"a":["A","B","C"],"e":"完整链路：先取记录和访谈做素材，再用动词名词法聚出四个高频簇，按可行性打分选定第一期。翻译过程有据，切出来的范围才准。真实素材加系统拆解，才有准确的切片结论。\n【干扰项】\nD：大而全智能客服正是原话直译的典型翻车方式。大而全正是原话直译失败的典型形态。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-048","d":4,"t":"single","q":"医疗场景里「导诊与随访」类智能体的合理定位是什么？","o":[{"l":"A","t":"替医生做诊断决策"},{"l":"B","t":"替护士执行治疗操作"},{"l":"C","t":"管理药品采购"},{"l":"D","t":"做流程引导与随访提醒的窗口辅助"}],"a":["D"],"e":"导诊随访是流程辅助类场景：帮患者找对科室、按计划做提醒，不碰诊断和治疗。定位清楚，院内才愿意放进流程。定位准了，方案才进得了客户的真实流程。\n【干扰项】\nA：诊断属于医生职责。诊断是医生的法定职责。这一点要分清楚。\nB：治疗操作属于护士职责。治疗操作是护理专业行为。这一点要分清楚。\nC：采购管理与该场景无关。采购管理与导诊场景无关。它不在本题的判断范围里。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-049","d":4,"t":"single","q":"传媒行业的「视频拆条」类需求，智能体适合承担的部分是什么？","o":[{"l":"A","t":"从长素材里识别可切分点并生成多平台版本初稿，人复核后再发布"},{"l":"B","t":"直接把未复核的拆条全网自动发布"},{"l":"C","t":"原创整期节目内容"},{"l":"D","t":"决定栏目选题方向"}],"a":["A"],"e":"拆条的价值在「快出多形态初稿」：机器识别切点、产出各平台版本，人复核签发。效率提升靠分工，不是靠去掉把关。快出初稿加人工复核，是这类场景的安全姿势。\n【干扰项】\nB：未复核自动发布是红线。未经复核的发布是内容安全红线。这一点要分清楚。\nC：原创整期内容超出能力与职责边界。原创整期超出助手的能力与职责。\nD：选题方向由人主导，机器只提供线索。选题方向是人的战略判断。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-050","d":4,"t":"single","q":"法务「条款检索」场景，助手相对人工翻文档的优势来自哪里？","o":[{"l":"A","t":"它比律师更懂法律"},{"l":"B","t":"把条款库结构化后按语义检索，秒级返回相关条款及出处"},{"l":"C","t":"检索结果不需要核对"},{"l":"D","t":"可以随意编造条款"}],"a":["B"],"e":"优势在速度与覆盖：条款结构化入库后语义检索直接定位出处，省去人工逐页翻找，律师的时间留给判断。检索提供的是速度，不是专业判断。这是方法层的硬要求。\n【干扰项】\nA：助手不会比律师懂法，它是检索工具。助手是工具，不会替代律师专业。\nC：结果仍需律师核对。检索结果仍要律师核对后采用。这一点要分清楚。\nD：编造条款是幻觉，恰恰是要防的。编造条款正是幻觉治理要防的对象。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-051","d":4,"t":"multiple","q":"行业「三问」分别对应方案里的哪些设计动作？","o":[{"l":"A","t":"知识沉淀在哪里，决定知识库怎么建"},{"l":"B","t":"重复劳动发生在哪，决定场景切在哪里"},{"l":"C","t":"答错代价多大，决定权限、引用与兜底的力度"},{"l":"D","t":"答错代价大就放弃智能化"}],"a":["A","B","C"],"e":"三问就是三条设计主线：知识库结构、场景切口、安全力度的依据都从这三问里来。答完三问，方案的骨架就有了。风险高不等于放弃，而是把防护设计做重。\n【干扰项】\nD：代价高不等于不做，而是把引用、拒答、人工兜底做重。引用、拒答与人工兜底同步加码才是正确响应。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-052","d":4,"t":"single","q":"六个行业的场景差异很大，但教材说它们本质都是什么的不同组合？","o":[{"l":"A","t":"预算与人力成本的组合"},{"l":"B","t":"组织架构的组合"},{"l":"C","t":"知识、对话与流程的不同组合"},{"l":"D","t":"模型参数与算力规格的组合"}],"a":["C"],"e":"行业千差万别，落到智能体方案上都是知识、对话、流程三要素的组合变化。看穿这一层，换行业只是换参数，方法不换。三要素组合的视角，让跨行业交付有了统一方法。\n【干扰项】\nA：成本影响节奏，不影响方案本质。预算高低决定投入多少，方案的知识对话流程骨架不会因此改变。\nB：组织架构不是设计主线。组织架构不在设计主线里。别把注意力放错了地方。\nD：模型算力只是承载工具，换行业不是换模型选型。方案骨架始终由知识、对话、流程三要素决定，方法不随技术栈变。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-053","d":4,"t":"single","q":"行业场景图谱做完之后，正确的维护方式是什么？","o":[{"l":"A","t":"随行业与业务变化持续更新，动态维护"},{"l":"B","t":"一次定稿永不修改"},{"l":"C","t":"只在新项目开始时翻出来看"},{"l":"D","t":"交给客户后就不用管"}],"a":["A"],"e":"图谱是活文档：行业在变、客户业务在变，场景和边界也要跟着更新。定期回看，方案才不会贴着过时的现实走。图谱更新跟着行业变化走，方案才不过时。\n【干扰项】\nB：静态图谱很快失真。不更新的图谱很快脱离现实。方向反了努力就白费。\nC：只在新项目翻看，运营期的问题就没人管。运营期的问题同样要靠图谱定位。\nD：移交给客户后仍需协同更新。移交不是终点，还要协同维护。别把注意力放错了地方。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-054","d":4,"t":"multiple","q":"一次完整的「案例复盘」应该产出什么？","o":[{"l":"A","t":"与预期对照的效果结论"},{"l":"B","t":"客户使用中的真实反馈"},{"l":"C","t":"下一期要修的问题清单"},{"l":"D","t":"一段夸自己的宣传文案"}],"a":["A","B","C"],"e":"复盘的产出是证据和清单：效果对不对得上、客户顺不顺手、下期改什么。把这些写下来，项目经验才能积累成方法论。复盘产出的清单，是下一期的开工依据。\n【干扰项】\nD：复盘讲真话，不是写宣传稿。复盘的产出要能落成具体动作。别把注意力放错了地方。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-055","d":4,"t":"single","q":"教材强调综合案例「不全是成功」，这些不完美之处的作用是什么？","o":[{"l":"A","t":"说明项目做失败了"},{"l":"B","t":"说明方案有根本缺陷，该场景不适合智能化"},{"l":"C","t":"如实呈现边界与兜底设计，帮读者建立真实预期"},{"l":"D","t":"没有作用，应该删掉"}],"a":["C"],"e":"不完美才是真实交付：拒答、缺资料、判不准，恰好说明每个方案都有边界。把边界讲清，客户才不会拿「没谈过的场景」来质疑。把不完美讲在前面，是对客户真正的负责。\n【干扰项】\nA：案例整体是成功交付，不完美不等于失败。案例整体成功，不完美只是边界的一部分。\nB：不完美恰是如实呈现边界，由它推翻整个场景是误读；有边界不等于方案失败。\nD：边界案例是教学价值最高的部分。边界处的教学价值最高。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-056","d":4,"t":"single","q":"每个切片都锁一个可量化的效果确认指标，最重要的作用是什么？","o":[{"l":"A","t":"结果确认时双方有共同参照，交付效果一目了然"},{"l":"B","t":"指标定得越宽松，结果确认越容易通过"},{"l":"C","t":"方便推高报价"},{"l":"D","t":"没有实质作用"}],"a":["A"],"e":"指标是双方的契约：常见问题解决率、单次处理时长写进方案，交付完对照检查，效果好坏不用争，信任建立在数字上。指标即契约，写进方案才算数。理解这一点，后面的动作才顺。\n【干扰项】\nB：宽松口径换来的好看数字经不起真实使用检验，指标失真反而埋下信任风险。\nC：指标与报价无直接关系。指标不直接服务于报价高低。这一点要分清楚。\nD：它恰恰是结果确认的核心依据。它正是结果确认的核心凭据。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-057","d":4,"t":"multiple","q":"给切片提前标注风险，应该写清哪些内容？","o":[{"l":"A","t":"数据质量有没有保证"},{"l":"B","t":"接口依赖是否稳定"},{"l":"C","t":"权限是否可能延期"},{"l":"D","t":"什么都不写，出了事再说"}],"a":["A","B","C"],"e":"风险提前摊开是专业：数据、接口、权限三个最常见的延期源都写清楚，落地时才有准备，客户也不会被突然的延期打个措手不及。风险亮在明处，双方才都有准备。\n【干扰项】\nD：出了事再解释等于把风险转嫁给信任。事后解释等于把风险转嫁给信任。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-058","d":4,"t":"single","q":"「方案里引用一句客户原话」这个细节，真正的价值是什么？","o":[{"l":"A","t":"让客户觉得方案是定制的，可以收更高价格"},{"l":"B","t":"显得做过功课的姿态"},{"l":"C","t":"为了记录客户说过什么备查"},{"l":"D","t":"让客户确认你真的听懂了他，快速建立信任"}],"a":["D"],"e":"原话是最真实的锚点：方案里出现客户自己的话，他知道痛点被听到了。沟通成本一下子降下来，这比任何华丽的表述都有说服力。原话引用是成本最低的信任建设方式。\n【干扰项】\nA：把它当包装话术就走偏了，原话引用的真正价值是确认听懂、对齐痛点。\nB：不是姿态，是听懂的证据。听懂的证据比姿态更重要。别把注意力放错了地方。\nC：备查只是次要作用。备查只是它顺带的用途。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-059","d":4,"t":"single","q":"对「现在还说不清的场景、拿不到的数据」，方案里应该怎么处理？","o":[{"l":"A","t":"先不提，免得显得没底气"},{"l":"B","t":"承诺都能做"},{"l":"C","t":"作为待定项列出来，写明状态与前置条件"},{"l":"D","t":"从方案里删掉相关部分"}],"a":["C"],"e":"待定项透明化是管理预期：说不清的列出来，写明依赖什么才能启动。列出来是管理，藏着是埋雷，等到结果确认时再爆。把待定项摆在明面上，是交付成熟度的体现。\n【干扰项】\nA：回避不等于不存在，反而更没底气。回避掩盖不了依赖的存在。\nB：空头承诺会在交付时反噬信任。这一点要分清楚。兑现不了的场景迟早会在真实使用里露馅，客户信任就此折损。\nD：删掉相关部分会让范围出现缺口。待定项一旦从文档里消失，范围变更时就没人能对得上账。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-060","d":4,"t":"single","q":"把「原话到切片」的翻译方法沉淀成模板工具，主要意义是什么？","o":[{"l":"A","t":"后续项目交付更快，新人也能快速上手"},{"l":"B","t":"模板本身可以卖钱"},{"l":"C","t":"显得团队有方法论"},{"l":"D","t":"替代所有沟通"}],"a":["A"],"e":"访谈提纲、动词名词表、切片模板做成现成工具后，经验就从个人脑子里变成团队资产，项目之间复用，新人照着走也能达线。把方法工具化，交付能力才能规模化复制。\n【干扰项】\nB：模板的价值在复用效率，不是商品。一次沉淀反复使用，省下的是每个项目重复摸索的时间。\nC：方法论要能落地才算数。这一点要分清楚。拿得出可执行的工具与模板，比一句方法论的口号有用得多。\nD：模板不能替代真实沟通。模板是沟通的起点，不是终点。别把注意力放错了地方。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-061","d":4,"t":"single","q":"药房案例把「助手拒答的个体化问题」在二期接到药师热线并形成工单回访，这个设计说明什么？","o":[{"l":"A","t":"拒答说明项目失败"},{"l":"B","t":"拒答流量也是业务信号，要有承接出口而不是干等"},{"l":"C","t":"会员的个体化问题不重要"},{"l":"D","t":"拒答越多越好，说明边界守得严"}],"a":["B"],"e":"答不了体面地转出去只是第一步，转出去的流量还要有人接：接热线、留工单、做回访，边界场景变成服务闭环，体验就完整了。拒答流量有了出口，服务闭环才算完整。\n【干扰项】\nA：拒答是设计好的安全边界，不是失败。拒答是设计出来的安全边界。\nC：个体化问题恰恰是高价值需求，值得人工承接。个体化问题值得人工的高成本承接。\nD：拒答多不等于边界好，健康的设计是能答的答好、该转的转得顺，两个指标要一起看。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-062","d":4,"t":"multiple","q":"药房案例的角色指令里，三条铁律是哪三条？","o":[{"l":"A","t":"只依据知识库内容作答"},{"l":"B","t":"每条结论标注来源"},{"l":"C","t":"无法确认时引导咨询医师或药师"},{"l":"D","t":"尽量给出个性化用药剂量建议"}],"a":["A","B","C"],"e":"三条铁律构成安全闭环：有据可查、有源可溯、边界外转人工。答错代价高的场景，指令把安全写成硬约束。三条铁律把安全要求变成硬约束，不靠模型自觉。\n【干扰项】\nD：剂量建议属于个体化医疗决策，被铁律明确禁止。剂量建议被铁律明确挡在边界之外。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-063","d":4,"t":"single","q":"制造案例试运行一个月后「新人组平均定位时长下降四成」，主要来源是什么？","o":[{"l":"A","t":"新人突然变聪明了"},{"l":"B","t":"问题变少了"},{"l":"C","t":"案例库加引导式流程让新人按图索骥"},{"l":"D","t":"统计口径做了美化"}],"a":["C"],"e":"下降来自结构性改善：高频故障结构化入库、排障流程固定引导，新人照着案例与流程走，不再靠现场瞎摸索。对照实验两组同口径，结论才站得住。这是整个环节的立足点。\n【干扰项】\nA：是工具与知识的功劳，不是人变了。改善来自工具与知识，不是人变聪明。\nB：故障量没有减少，是处理效率提高了。老员工作为对照组同样处理故障，差别只在有没有工具支撑。\nD：对照实验新旧两组同口径，是可信结论。统计方法可信，结论才可信。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-064","d":4,"t":"single","q":"传媒案例把流水线拆成三个角色，划分的依据是什么？","o":[{"l":"A","t":"按编辑人数平均分"},{"l":"B","t":"按工作性质分：找题、成稿、把关是三种不同性质的劳动"},{"l":"C","t":"按团队人手平均分配，每人管一个"},{"l":"D","t":"为了多占服务器"}],"a":["B"],"e":"分工的依据是劳动性质：选题是信息检索、撰写是内容生成、审校是事实核对，性质不同就该分开，各配针对性的角色指令。按劳动性质分工，才叫真正的架构设计。\n【干扰项】\nA：按人头分不等于按能力分配。两者不能混为一谈。三种劳动性质不同，平均分会让搜索型人手去做核对型活。\nC：分工依据是劳动性质，不是人头数量；平均分配会错配能力，交接反而更乱。\nD：服务器成本不是设计依据。成本不是分工的出发点。别把注意力放错了地方。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-065","d":4,"t":"single","q":"药房案例上线后「窗口常见问题咨询量下降四成」，这个数字的正确解读是什么？","o":[{"l":"A","t":"常识类问题被助手分流，药师时间留给复杂问题"},{"l":"B","t":"说明病人不来了"},{"l":"C","t":"说明窗口要裁撤"},{"l":"D","t":"说明咨询质量下降"}],"a":["A"],"e":"分流是设计目标：常识题交给助手、复杂题留给药师，咨询总量下降的是可自动应答的部分，专业人力被用在刀刃上。分流成功的标志，是专业时间用在更难的问题上。\n【干扰项】\nB：是咨询分流，不是客流消失。是咨询量分流，不是客流减少。别把注意力放错了地方。\nC：窗口仍承担复杂咨询与兜底。这一点要分清楚。分流掉的是可自动应答的部分，复杂问题仍然要人来答。\nD：抽检合格才放行，质量有保障。抽检合格是对外使用的前提。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-066","d":4,"t":"multiple","q":"把综合案例用作团队教学材料，正确的用法有哪些？","o":[{"l":"A","t":"让新人在案例上练拆需求、选模式、做评测"},{"l":"B","t":"对照案例复盘团队方法论"},{"l":"C","t":"把案例当成共同语言，讨论时直接引用"},{"l":"D","t":"让新人背诵案例原文"}],"a":["A","B","C"],"e":"案例的教学价值在实操与对齐：练手感、沉淀方法、形成团队共同语言。案例是教材不是考题，死记硬背没有意义。案例是团队的公共教材，方法靠它代代相传。\n【干扰项】\nD：背原文学不到方法，重点是拆解与迁移。背原文学不会拆解与迁移。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-067","d":4,"t":"single","q":"「案例要少而深，不要多而浅」，这句话的核心主张是什么？","o":[{"l":"A","t":"案例数量越少越好"},{"l":"B","t":"把一个案例吃透提炼出方法，胜过浅尝十几个"},{"l":"C","t":"客户不喜欢多看案例"},{"l":"D","t":"写案例浪费时间"}],"a":["B"],"e":"深度决定价值：一个案例从原话到复盘全链路吃透，才能抽出可复用的方法。数量堆不出认知，深挖才出真东西。深挖一个案例，方法论才提炼得出来。\n【干扰项】\nA：少而深不等于越少越好，够用即可。数量够用即可，深度才是关键。\nC：与客户喜好无关，是沉淀质量的要求。沉淀质量是要求，与喜好无关。\nD：案例是方法论的载体，不是浪费。案例是方法的载体，值得投入。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-068","d":4,"t":"single","q":"零售案例里第一期把答案做成「店员端小程序直接可用」，这个设计体现的原则是什么？","o":[{"l":"A","t":"小程序开发最便宜"},{"l":"B","t":"给客户炫技"},{"l":"C","t":"店员不重要，随便给个入口"},{"l":"D","t":"交付要贴一线的真实工作场景，工具好用才会真被用起来"}],"a":["D"],"e":"再好的答案，如果店员用起来别扭就不会被用。把入口放进店员已有的操作动线里，分流率第一周达标就有这层原因。工具贴着一线动线走，落地才有真实分流。\n【干扰项】\nA：成本考量是次要的。成本是次要考虑，体验优先。这一点要分清楚。\nB：贴近场景是务实，不是炫技。务实与炫技是两回事。别把注意力放错了地方。\nC：一线是分流的主战场，入口体验很关键。一线用得顺，数据才好看。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-069","d":4,"t":"single","q":"把「会员咨询太多忙不过来」直接当需求开工，最常见的后果是什么？","o":[{"l":"A","t":"一切顺利"},{"l":"B","t":"做出来的大而全系统与真实痛点错位，使用率上不去"},{"l":"C","t":"客户反而更满意"},{"l":"D","t":"没有任何后果"}],"a":["B"],"e":"一句话背后拆出来是订单查询、政策问答、权益计算、活动咨询好几件事，照原话直接开工必然做偏，上线后没人用是常见结局。不拆解就开工，是这类项目失败的头号原因。\n【干扰项】\nA：不拆解就开工，错位概率极高。错位开工的返工成本极高。这一点要分清楚。\nC：与真实诉求错位的系统很难让客户满意。错位的系统越用越被冷落。\nD：范围失控是实打实的代价。这一点要分清楚。大而全的系统每多一个没人用的模块，后续维护都在替它买单。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-070","d":4,"t":"multiple","q":"工业场景里最适合智能体切入的三个常见场景是哪些？","o":[{"l":"A","t":"质检辅助"},{"l":"B","t":"设备排障"},{"l":"C","t":"操作规程问答"},{"l":"D","t":"车间消防安全值守"}],"a":["A","B","C"],"e":"三个高频场景的共同点是知识密集、重复劳动多、有据可查：质检标准、故障案例、操作规程都是结构化知识的载体，适合先落。三个场景的共同点是知识密集、重复劳动、有据可查，先落它们风险最小。\n【干扰项】\nD：安全值守涉及人身安全，属于高危场景，不交给智能体独立承担。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-071","d":4,"t":"single","q":"教材说法务场景「天然适合」智能体，判断依据是什么？","o":[{"l":"A","t":"律师收入高付得起钱"},{"l":"B","t":"法务行业没有风险"},{"l":"C","t":"知识高度文本化、比对工作高度重复"},{"l":"D","t":"合同都不重要"}],"a":["C"],"e":"文本化知识加重复性劳动，正是智能体最擅长解的组合：条款结构化后比对、检索、问答都能大幅提速，而专业判断仍留给律师。文本化加重复性，正是智能体最擅长解的组合。\n【干扰项】\nA：付费能力不是判断适配度的依据。付费能力与场景适配度无关。\nB：法务恰恰是高风险场景，边界要划清。法务是高风险场景，更要把边界划清。\nD：合同是企业的核心资产。合同是核心资产，恰是价值所在。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-072","d":4,"t":"single","q":"「一个切片只服务一个知识域加一个任务」这条标准，违反它的典型后果是什么？","o":[{"l":"A","t":"评测期问题混在一起，定位难、返工成本高"},{"l":"B","t":"没有任何影响"},{"l":"C","t":"交付速度更快"},{"l":"D","t":"客户更满意"}],"a":["A"],"e":"混场景的切片里数据源、权限、指标全搅在一起，出问题时说不清是哪个环节的锅。场景单一才可定位、可评测、可快速返工。场景单一，才能可定位、可评测、可快速返工。\n【干扰项】\nB：影响直接体现在调试与评测成本上。混场景的调试成本会成倍翻升。\nC：粗快只会换来更大的返工。粗快换来的是更大的返工。方向反了努力就白费。\nD：大杂烩式交付很难让客户满意。大杂烩交付很难让客户满意。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-073","d":4,"t":"single","q":"给每个案例写一段「如果重来会怎么做」，价值在哪里？","o":[{"l":"A","t":"走个形式感"},{"l":"B","t":"把教训显性化，下一个项目直接对照少踩坑"},{"l":"C","t":"承认自己做得差"},{"l":"D","t":"给客户看的姿态"}],"a":["B"],"e":"「如果重来」是复盘里最值钱的部分：哪里能更快、哪里能更省，写成文字就成了可迁移的经验资产，下一个项目开工前翻一遍，能省真金白银。把教训写成文字，经验才能真正复用。\n【干扰项】\nA：它有实际产出，不是形式。复盘有实际产出，不是走流程。别把注意力放错了地方。\nC：复盘不是自我批评会，是提炼方法。复盘的目的是提炼方法。别把注意力放错了地方。\nD：复盘主要给团队内部沉淀。内部沉淀是它的第一用途。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-074","d":4,"t":"multiple","q":"违反交付切片三标准，分别会带来什么问题？","o":[{"l":"A","t":"场景混杂：问题定位难、评测互相干扰"},{"l":"B","t":"不可度量：结果确认时说不清效果"},{"l":"C","t":"周期过长：风险积压、客户信心耗尽"},{"l":"D","t":"没有后果，都一样"}],"a":["A","B","C"],"e":"三标准是风险隔离带：单一保可定位，可度量保可核对，短周期保节奏。任何一条被破坏，都会把风险和沟通成本放大。三条标准互为犄角，共同把风险关进笼子。\n【干扰项】\nD：三条标准各有对应的失败模式，不是无所谓。每条标准都对应一类失败模式。","s":"自编-TCFDE-2026-09"},{"id":"TF-D4-075","d":4,"t":"single","q":"学完行业解决方案这一章，最应该带走的一条主线是什么？","o":[{"l":"A","t":"背熟六个行业的全部案例细节"},{"l":"B","t":"记住哪个行业预算最多"},{"l":"C","t":"从行业规律到客户原话再到交付切片，用方法把模糊变清晰"},{"l":"D","t":"学会模仿别的项目方案"}],"a":["C"],"e":"行业在变、案例会旧，但「三问定方案、原话切片翻译」的方法不变。带走方法而不是细节，才能在任何新行业里快速切出可落地的场景。方法换个行业照样能用，细节换个场景就失效。\n【干扰项】\nA：细节会过时，方法是长久的。这一点要分清楚。换个新行业案例库就清零，方法却可以照常开工。\nB：预算多少与方案能力无关。预算高低不决定方案能力。它不在本题的判断范围里。\nD：照抄方案忽略场景差异，必然错配。这一点要分清楚。每个客户的原话与约束都不同，拿来主义的方案落不了地。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-001","d":5,"t":"single","q":"教材认为调试智能体的本质是什么？","o":[{"l":"A","t":"把代码逐行检查一遍"},{"l":"B","t":"把一个不确定的黑盒，重新变成你能看懂、能预测的系统"},{"l":"C","t":"不断重启服务"},{"l":"D","t":"等模型自己变好"}],"a":["B"],"e":"智能体没有固定执行路径，同一个问题不同时候可能答得不一样。调试的本质，就是通过看懂每一层的行为，把不确定性重新变成可预测。看懂每一层的行为，调试才有下手的地方。\n【干扰项】\nA：智能体调试对象是整套系统行为，不是逐行读代码。调试对象是系统行为，不是源代码。\nC：重启不解决行为问题。行为问题靠重启解决不了。这一点要分清楚。\nD：模型不会自己变好，需要人来调。系统需要人来调，不会自愈。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-002","d":5,"t":"single","q":"客户抱怨「价格问题总答错」，改了几版提示词没用，最后发现是商品单位没统一。这个案例说明什么？","o":[{"l":"A","t":"提示词永远没用"},{"l":"B","t":"模型太笨应该换"},{"l":"C","t":"客户要求太高"},{"l":"D","t":"调试要先判断异常出在哪一层，而不是急着改某一处"}],"a":["D"],"e":"答案异常可能在指令、知识库、流程、模型任何一层。不先定位就动手，会在错误的层上浪费几轮功夫。看日志定位到数据层，问题一次就清楚了。先定位再动手，是所有调试的第一课。\n【干扰项】\nA：提示词有用，但这次问题不在提示词。盲目反复改提示词，只会把真正的问题继续埋着。\nB：数据干净后原模型就能答对。数据修好后，原模型就能答对。这一点要分清楚。\nC：与客户要求无关，是数据问题。客户要求合理，问题出在数据层。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-003","d":5,"t":"multiple","q":"单次调试五步法的正确顺序与要点，对应关系有哪些？","o":[{"l":"A","t":"复现：把出问题的输入固定成测试样例"},{"l":"B","t":"定位：列出两三个最可疑的环节"},{"l":"C","t":"修改：一次只动一个环节"},{"l":"D","t":"验证：只在改过的样例上看一次就算完成"}],"a":["A","B","C"],"e":"五步是复现、定位、假设、修改、验证：固定样例、列出可疑点、给出可检验假设、一次一改、回到评测集整体验证。五步法把「瞎改」变成「有依据的尝试」。这也是实战反复验证过的规律。\n【干扰项】\nD：验证要防止改好一条带崩其他，必须回评测集统一看。整体验证才能防住改好一条带崩一片。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-004","d":5,"t":"single","q":"复现问题时，客户问「退货怎么退」，你改成「退换货怎么操作」再测，这样做的错误是什么？","o":[{"l":"A","t":"没有任何错误"},{"l":"B","t":"只要意思一样就行"},{"l":"C","t":"复现必须用原文原貌，替换措辞后问题可能无法复现"},{"l":"D","t":"意思一样，规范化措辞后测试更规范"}],"a":["C"],"e":"同一意思的不同措辞，模型可能给出不同输出。复现的纪律是一字不改：原文才能稳定触发问题，才能作为修复的基准。复现是修复的地基，样例不固定一切白谈。\n【干扰项】\nA：措辞一换，问题可能就消失了，等于没复现。措辞一换行为就变，等于没复现。\nB：意思近似不等于行为一致。语义近似不能替代原话。这点上没有商量余地。\nD：措辞一变行为可能就变，规范化看似严谨，实则破坏了复现的基准。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-005","d":5,"t":"single","q":"定位阶段「不瞎猜」的最好办法是什么？","o":[{"l":"A","t":"把中间产物打出来看：意图、检索片段、每步输出"},{"l":"B","t":"凭经验直接断定原因"},{"l":"C","t":"把所有设置全部改一遍"},{"l":"D","t":"问同事猜猜看"}],"a":["A"],"e":"中间产物是最诚实的证词：模型理解了什么、检索回了什么、流程走到哪，一眼就能分辨哪一步跳了，比凭空猜快得多。数据不说谎，看中间产物比凭空猜快得多。\n【干扰项】\nB：经验要靠数据验证，直接断定容易错层。直接断定容易修错层。\nC：全部改一遍后出问题更说不清。全改一遍后出问题更难定位。\nD：猜测不如看数据。调试讲证据，不讲猜测。这一点要分清楚。别在这里浪费精力。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-006","d":5,"t":"multiple","q":"调试日志在记录与管理上，符合规范的做法有哪些？","o":[{"l":"A","t":"至少记输入原文、检索片段、生成输出、所用模式与模型"},{"l":"B","t":"日志可能含客户隐私，要脱敏、定期清理、按权限隔离"},{"l":"C","t":"偶发问题靠日志还原完整路径"},{"l":"D","t":"日志越全越好，全量永久保存不设清理"}],"a":["A","B","C"],"e":"日志的核心字段覆盖主要环节即可，偶发问题靠它回放定位；含隐私时必须脱敏限权。日志既帮回放定位，也要为隐私负责，两件事都不可省。这条原则要贯穿交付全程。\n【干扰项】\nD：全量永久保存既有隐私风险也有成本，按需留存才对。留存期限与权限设计，比无限堆日志更能保护客户。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-007","d":5,"t":"single","q":"某工程师一口气把提示词、检索策略、工作流入口全改了，问题反而更乱。教训是什么？","o":[{"l":"A","t":"说明这个系统没法调"},{"l":"B","t":"以后不要一次改三处，改四处"},{"l":"C","t":"修改纪律是一次只改一个变量，否则说不清是哪处起作用"},{"l":"D","t":"改多了总会变好"}],"a":["C"],"e":"一次改多处，答对了也不知道是哪处起效，答错了更定位不了。一次一改、逐项验证，是调试稳定性的前提。一次一改，是效果归因的唯一办法。把它记牢，落地就不会跑偏。\n【干扰项】\nA：系统可以调，是方法问题。方法对了系统就能调稳。这一点要分清楚。\nB：问题在贪多，不是数量的具体数字。贪多才是翻车的真正原因。\nD：改动方向不明时，越多越乱。方向不明时，多改只会更乱。方向反了努力就白费。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-008","d":5,"t":"single","q":"调试记录「防返工」的价值体现在哪？","o":[{"l":"A","t":"记录写得越多越好"},{"l":"B","t":"为了应付检查"},{"l":"C","t":"给客户看工作量"},{"l":"D","t":"两周后同类问题再现，翻记录就能知道当时怎么处理的"}],"a":["D"],"e":"调试记录的第一价值就是复用：同类问题再现时直接照方案处理，不用从头摸索，省下的是真实的时间成本。记录的价值在复用，不在篇幅。这是方法层的硬要求。\n【干扰项】\nA：记录贵在有结构，不在数量。有结构的记录才查得动。代价与收益完全不成比例。\nB：记录是工作工具，不是检查材料。它是工作工具，不是检查材料。\nC：记录主要给团队沉淀用。沉淀主要服务于团队能力。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-009","d":5,"t":"single","q":"按五步法走一个「查不到订单」的调试：先放开权限仍为空，再查数据发现订单库未同步。这个顺序体现的原则是什么？","o":[{"l":"A","t":"把所有可疑环节一次全改，排查更快"},{"l":"B","t":"假设可列多个，逐个排除，用数据说话"},{"l":"C","t":"先改数据再看权限"},{"l":"D","t":"全部同时改"}],"a":["B"],"e":"假设「权限不足」与「数据未同步」并列，逐项排除：先验证权限、排除后再查数据，每次验证都基于实际结果，这正是定位有据的做法。逐项排除、以结果为准，是定位环节的纪律。\n【干扰项】\nA：一次全改后答对了也说不清是哪处起效，归因失效比多花几步排查更糟。\nC：顺序按验证效率，不是固定先改谁。顺序由验证效率决定，不固定。\nD：一次一动是纪律。一次一动是调试铁律。这一点要分清楚。别在这里浪费精力。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-010","d":5,"t":"multiple","q":"常见的调试陷阱有哪些？","o":[{"l":"A","t":"只改提示词不动数据，而根子常在数据"},{"l":"B","t":"一次改一片，出问题说不清是哪处"},{"l":"C","t":"只看答案对不对，不看走的路径"},{"l":"D","t":"调好的问题及时回写回归集"}],"a":["A","B","C"],"e":"四大陷阱：只改提示词、贪多、只看结果不看过程、不回写回归集。前三条让人在错误的层打转，第四条让问题反复复发。这些陷阱的共同点，是在错误的层面用力。\n【干扰项】\nD：回写回归集是正确做法，正是防复发的手段。回写回归集正是防复发的关键动作。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-011","d":5,"t":"single","q":"偶发答错、现场无法复现的问题，最有效的追查手段是什么？","o":[{"l":"A","t":"等客户下次遇到时再现场观察处理"},{"l":"B","t":"每天盯屏幕等它发生"},{"l":"C","t":"查日志，还原当时的完整链路"},{"l":"D","t":"让客户自己再试一次"}],"a":["C"],"e":"偶发问题的关键在证据已经过去，日志把当时的输入、检索、输出留下来，顺着时间线就能找到带偏答案的那一批数据。日志把已经过去的现场重新摊开给你看。\n【干扰项】\nA：被动等待既伤体验又难复现，日志留痕才是把偶发问题变成可查证据的正路。\nB：人肉守候效率太低。守株待兔式的等待效率太低。这一点要分清楚。\nD：客户再试不一定复现，要有留痕。复现靠留痕，不靠客户重试。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-012","d":5,"t":"single","q":"为什么说调试要「贯穿整个生命周期」而不是上线前的一次性动作？","o":[{"l":"A","t":"上线后就不需要调试了"},{"l":"B","t":"真实使用场景永远比测试复杂，新问法、新数据、业务变化会不断带来新问题"},{"l":"C","t":"调试只是形式"},{"l":"D","t":"客户喜欢看团队忙碌"}],"a":["B"],"e":"上线只是暴露在真实环境里：客户的问法、数据的变化、业务的调整都会产生测试期没见过的问题，调试是日常姿势而非一次动作。把调试当日常，系统的稳定才有来源。\n【干扰项】\nA：恰恰是上线后问题更多。方向反了努力就白费。真实用户的问法千奇百怪，测试环境永远模拟不全。\nC：调试决定系统是否能持续稳定。不持续调试的系统，会在业务变化里悄悄跑偏直到出事。\nD：与观感无关。调试是能力建设，与观感无关。它不在本题的判断范围里。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-013","d":5,"t":"multiple","q":"上线之前的「全量体检」应该包含哪些动作？","o":[{"l":"A","t":"把评测集完整跑一遍，确认整体达标"},{"l":"B","t":"边界题和对抗题单独扫一遍"},{"l":"C","t":"对日志做一次敏感内容扫描"},{"l":"D","t":"跳过体检直接全量上线"}],"a":["A","B","C"],"e":"上线前的体检是把风险挡在门内的最后一道闸：整体评测确认水平，边界与对抗题专项扫描验证极端情况，敏感内容检查守住安全线，三件事都过了才谈稳妥上线。\n【干扰项】\nD：跳过体检直接全量，等于把所有风险一次性暴露给真实用户，没有任何缓冲。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-014","d":5,"t":"single","q":"某工业排障助手把每次调试记录沉淀成「问题-解法」档案，新人照档案接手。这说明调试记录的深层价值是什么？","o":[{"l":"A","t":"方便统计加班"},{"l":"B","t":"文档越多越专业"},{"l":"C","t":"让团队经验不随人走，变成可交接的组织资产"},{"l":"D","t":"给老员工留纪念"}],"a":["C"],"e":"调试档案把个人摸索变成组织记忆：新人接手不踩旧坑，经验不因人员流动而清零，这才是沉淀的意义。档案在，经验就不随人走。理解这一点，后面的动作才顺。\n【干扰项】\nA：与考勤统计无关。档案与考勤统计无关。它不在本题的判断范围里。\nB：价值在内容质量，不在文档数量。内容质量比文档数量重要。这一点要分清楚。\nD：档案是工作资产，不是纪念品。它服务的是团队能力沉淀。别把注意力放错了地方。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-015","d":5,"t":"multiple","q":"看中间产物做诊断时，正确的使用姿势有哪些？","o":[{"l":"A","t":"对照正常链路的样子，看哪一步跳了"},{"l":"B","t":"不需要全懂内部细节，能分辨异常即可"},{"l":"C","t":"正常时检索命中相关片段，异常时命中无关内容"},{"l":"D","t":"中间产物太复杂，看了也白看"}],"a":["A","B","C"],"e":"中间产物的用法是比较：拿正常行为做参照，看意图、检索、流程哪一步偏离，不需要逐字段读懂，能分辨异常就够了。有正常行为做参照，异常一眼就现形。\n【干扰项】\nD：能分辨异常就有价值，不是白看。别把注意力放错了地方。对照正常链路走一遍，哪一步不对凭常识也能察觉。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-016","d":5,"t":"single","q":"一份评测集的本质是什么？","o":[{"l":"A","t":"让模型自己生成一批问答充当评测集"},{"l":"B","t":"一批有标准答案的问题，把主观评价变成可量化、可对比的依据"},{"l":"C","t":"给客户看的宣传材料"},{"l":"D","t":"一份越写越长的需求文档"}],"a":["B"],"e":"评测集的价值在于量化：有标准答案才能算准确率，改动能跑出新数字对比，交付好坏从「感觉」变成「证据」。评测集把「好不好用」变成「好到什么程度」。这是整个环节的立足点。\n【干扰项】\nA：拿被测对象自产自评，等于既当选手又当裁判，结论必然虚高。\nC：它是工作工具，不是宣传品。别把注意力放错了地方。它存在的意义是给改动打分，好看与否不是它的职责。\nD：评测集是测试资产，不是需求。测试资产与需求文档是两回事。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-017","d":5,"t":"single","q":"某金融问答助手交付时被质疑「有没有数据支持」，最好的回应方式是什么？","o":[{"l":"A","t":"拿出两百条标注好的历史工单，当场跑评测，命中率九成二"},{"l":"B","t":"口头保证系统很可靠"},{"l":"C","t":"展示界面截图证明做得精细"},{"l":"D","t":"承诺不满意可以退款"}],"a":["A"],"e":"当场可复现的数字比任何承诺都有说服力：标准答案在、过程公开、结果可复算，这就是评测集建立的信任。可复现的过程，比结论更有说服力。这也是实战反复验证过的规律。\n【干扰项】\nB：口头保证无法验证。口头保证需要证据支撑。这条路本身就走不通。\nC：截图证明不了回答效果。这一点要分清楚。界面再精致，答不准照样会被客户当场问倒。\nD：商业承诺不等于技术证据。商业条款不构成技术证据。两者不能混为一谈。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-018","d":5,"t":"multiple","q":"一份完整的评测集应该包含哪四类题？","o":[{"l":"A","t":"种子题：正常场景，覆盖高频使用"},{"l":"B","t":"边界题：错别字、口语、超长句、多轮追问"},{"l":"C","t":"对抗题：张冠李戴、绕限制、混淆概念"},{"l":"D","t":"彩蛋题：开发人员自己感兴趣但业务没人问的问题"}],"a":["A","B","C"],"e":"四类题各有分工：种子决定常规表现，边界决定扛不扛得住，对抗决定会不会被带偏，回归决定改动会不会弄坏旧的，四类齐评测视角才完整。四类题构成完整视角，缺一类就漏一片风险。\n【干扰项】\nD：按个人兴趣出题偏离业务，评测集要贴着真实使用场景来建，不是自娱自乐。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-019","d":5,"t":"single","q":"某用药咨询助手初期评测集只有种子题，上线后用户用商品名提问立刻露馅。这个教训说明什么？","o":[{"l":"A","t":"说明系统彻底失败"},{"l":"B","t":"缺边界题和对抗题的评测是残缺的，会掩盖真实弱点"},{"l":"C","t":"商品名问题无法解决"},{"l":"D","t":"上线时间选错了"}],"a":["B"],"e":"只测常规问法的评测集会给出虚假的高分。补进边界题和对抗题后，才能暴露商品名与通用名映射这类真实缺陷，修完才算稳。评测集的构成，决定了它能提前暴露什么。\n【干扰项】\nA：是评测设计缺陷，不是系统死刑。这是评测缺口，不是系统死刑。\nC：补对照表就能解决。补一张对照表就能解决。这一点要分清楚。\nD：与时间无关，是评测集构成问题。问题在评测构成，与上线时机无关。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-020","d":5,"t":"single","q":"评测集的标准答案，来源上最要紧的一条规矩是什么？","o":[{"l":"A","t":"必须来自权威源：政策文件、内部制度、专家确认"},{"l":"B","t":"写答案的人感觉对就行"},{"l":"C","t":"从模型回答里抄"},{"l":"D","t":"哪个顺手用哪个"}],"a":["A"],"e":"答案错误比没有答案更糟，它会输出错误结论。权威源加交叉复核，才能保证评测的基准本身是对的。基准错了，跑出来的分数再高也是错的。这条原则要贯穿交付全程。\n【干扰项】\nB：凭感觉标注会污染整套评测。这一点要分清楚。一条错答案会让所有基于它的分数失去意义。\nC：拿模型答案当标准等于用被告当法官。标准答案不能来自被测对象本身。\nD：随手取材没有可信度。随手取材经不起追溯与核对。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-021","d":5,"t":"single","q":"评测集标注「至少两人各核一遍」，防的是什么？","o":[{"l":"A","t":"故意拖慢项目进度"},{"l":"B","t":"给新人找活干"},{"l":"C","t":"单人标注的手误与主观偏差，过滤掉大部分标注错误"},{"l":"D","t":"没有什么实际作用"}],"a":["C"],"e":"两双眼睛能看到单人看不到的盲区：手误、口径不一、漏标，交叉复核是评测质量的地基，成本小收益大。两道独立复核，是评测质量的地基。把它记牢，落地就不会跑偏。\n【干扰项】\nA：复核让返工更少，实际更快。方向反了努力就白费。带错误上线的返工代价，远大于标注时多看一眼。\nB：复核是质量动作，不是人力安排。复核是质量设计，不是人力安排。\nD：它直接决定评测结论可不可信。结论的可信度靠它保障。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-022","d":5,"t":"multiple","q":"一次批量评测要做对哪三件事？","o":[{"l":"A","t":"准备输入：评测集按固定格式导入，问题答案题型一一对应"},{"l":"B","t":"跑批：系统逐题回答并记录"},{"l":"C","t":"出结果：汇总准确率，列出与标准答案的差异"},{"l":"D","t":"手动一条条点开看，凭印象记结论"}],"a":["A","B","C"],"e":"批量评测的价值在可复现：固定格式进、逐题记录、汇总出数，改一处重跑一遍，前后对比一目了然。三步闭环让评测可复现、可对比、可追踪。这是方法层的硬要求。\n【干扰项】\nD：人工逐条看无法复现也无法汇总，效率极低。人肉跑批既慢又不可复现。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-023","d":5,"t":"single","q":"评测指标设计的第一原则是什么？","o":[{"l":"A","t":"越多越显专业"},{"l":"B","t":"客户提什么就加什么"},{"l":"C","t":"只看准确率一个数"},{"l":"D","t":"少而准：先定两三个核心指标做准，比堆一摞数字有价值"}],"a":["D"],"e":"指标要服务业务且客户能看懂。两三个核心指标做扎实，调优方向清楚、沟通顺畅；一堆数字反而分散注意力。指标是调优的方向盘，抓住两三个核心就够。\n【干扰项】\nA：数量不代表专业。数量堆不出专业感。这一点要分清楚。别在这里浪费精力。\nB：客户提的指标也要筛选聚焦。客户建议也要筛选聚焦。这一点要分清楚。\nC：不同场景有不同核心，检索看首条命中，生成看幻觉率。场景不同，核心指标也不同。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-024","d":5,"t":"single","q":"检索类场景最该盯的核心指标是什么？","o":[{"l":"A","t":"界面点击量"},{"l":"B","t":"首条命中率：用户搜出来的第一条结果对不对"},{"l":"C","t":"平均会话时长越长越好"},{"l":"D","t":"服务器负载"}],"a":["B"],"e":"检索场景的体感由第一条结果决定：首条命中，用户就觉得好；翻页才找到，指标再漂亮也白搭。首条命中直接决定用户体感，是检索场景的生命线。理解这一点，后面的动作才顺。\n【干扰项】\nA：点击量不反映检索质量。点击量与检索质量无关。它不在本题的判断范围里。\nC：时长长可能是找不到，不是好事。找不到才耗时长，不是好事。别把注意力放错了地方。\nD：负载是运维指标，不是效果指标。负载属于运维视角，不衡量效果。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-025","d":5,"t":"single","q":"生成类场景要单独盯防的指标是什么？","o":[{"l":"A","t":"幻觉率：模型编造不存在内容的比例"},{"l":"B","t":"回答字数"},{"l":"C","t":"回答越长越详尽，质量就越好"},{"l":"D","t":"用户注册量"}],"a":["A"],"e":"生成式的天性就是可能一本正经地编：幻觉率直接决定可信度，越低越安全，是生成类场景的生命线指标。生成场景的可信度，就压在幻觉率这一个数上。\n【干扰项】\nB：字数与质量无关。长度与真实性无关。它不在本题的判断范围里。\nC：长度与质量没有必然关系，冗长反而稀释关键信息，生成场景核心看幻觉率。\nD：注册量是增长指标，不衡量生成质量。注册量衡量增长，不衡量生成质量。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-026","d":5,"t":"multiple","q":"让评测集「持续生长」的正确做法有哪些？","o":[{"l":"A","t":"上线后遇到的真实问题随时补进评测集"},{"l":"B","t":"业务规则变了，标准答案跟着更新"},{"l":"C","t":"定期回访业务方，把没覆盖的新场景补成题目"},{"l":"D","t":"建好一次终身不改"}],"a":["A","B","C"],"e":"评测集是活的：真实问题喂进来、答案随规则更新、新场景定期补题，它才始终像业务的体检表，跑出的数字也才一直值得信任。评测集跟着业务长，数字才一直有参考价值。\n【干扰项】\nD：静态评测集很快失真，数字失去参考价值。静态评测集会让结论逐步失真。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-027","d":5,"t":"single","q":"把「能答对的题放进评测集、答错的偷偷删掉」，这种做法错在哪？","o":[{"l":"A","t":"分数是给客户看的，好看比真实重要"},{"l":"B","t":"评测的价值恰恰在暴露问题，做面子等于自我欺骗"},{"l":"C","t":"删题能提升系统真实能力"},{"l":"D","t":"客户反正看不懂"}],"a":["B"],"e":"评测是决策依据不是走秀：敢把难题和对抗题放进来，跑出的数字才真实，暴露的问题正是下一步的优化清单。评测敢暴露问题，优化才有方向。这是整个环节的立足点。\n【干扰项】\nA：把评测做成给客户看的表演，真实使用会立刻揭穿，信任损失更难挽回。\nC：删题不改变系统能力。删题改变不了系统的真实能力。这一点要分清楚。\nD：客户迟早从真实使用中发现问题。到那时被戳穿的不只是分数，还有整个团队的信誉。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-028","d":5,"t":"single","q":"评测报告给客户看时，最重要的是什么？","o":[{"l":"A","t":"堆满术语显得高深"},{"l":"B","t":"只报喜不报忧"},{"l":"C","t":"讲清楚整体水平、升降对比、薄弱题型和整改方向"},{"l":"D","t":"越厚越好"}],"a":["C"],"e":"报告的意义是对齐：几个关键数字、趋势对比、薄弱点和整改，客户看得懂才参与得了，预期也才对得上。报告是双方对齐预期的公共界面。这也是实战反复验证过的规律。\n【干扰项】\nA：术语墙隔绝了沟通。术语墙挡住的是沟通本身。这一点要分清楚。\nB：藏问题会让客户在真实使用中失去信任。藏问题会掏空长期信任。\nD：厚不等于有用。厚度不等于信息量。两者不能混为一谈。别在这里浪费精力。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-029","d":5,"t":"multiple","q":"运营指标按角色分看，下列对应关系正确的是哪些？","o":[{"l":"A","t":"管理层看转化、减负、降本"},{"l":"B","t":"产品看体验、准确率、满意度"},{"l":"C","t":"运维看稳定、报错、时延"},{"l":"D","t":"所有角色只看同一个总活跃数"}],"a":["A","B","C"],"e":"同一个系统，不同角色提炼不同的重点，各自拿到关心的数字，运营价值才被各方看见，各方投入才持续，运营的价值也才被真正看见。指标对齐角色，运营价值才被各方看见。\n【干扰项】\nD：单一指标无法支撑不同角色的判断。不同判断需要不同维度的数字支撑。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-030","d":5,"t":"single","q":"评测集「过拟合」指的是什么？","o":[{"l":"A","t":"题目太多跑不完"},{"l":"B","t":"评测集文件太大"},{"l":"C","t":"模型参数过多"},{"l":"D","t":"反复跑同一批题太顺，把当时的假设当成现实，掩盖了新问题"}],"a":["D"],"e":"老题跑顺不代表系统真的好：要保持对抗题数量、隔一阵放一批新题，拦住这种退化，数字才持续可信。评测集要跟着现实走，不能一直跟老题过日子。\n【干扰项】\nA：跑不完可以分批，与过拟合无关。分批跑与过拟合是两回事。它不在本题的判断范围里。\nB：文件体积不是问题的本质。别把注意力放错了地方。过拟合的坑在题目老化，与存储大小毫无关系。\nC：那是另一个概念，不是评测集过拟合。模型参数是另一个概念，别混淆。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-031","d":5,"t":"single","q":"Prompt、RAG、Workflow、Multi-Agent 四条调优路径，各自的分工是什么？","o":[{"l":"A","t":"Prompt 管怎么教，RAG 管检索准不准，Workflow 管步骤怎么走，Multi-Agent 管角色怎么分工"},{"l":"B","t":"四条都管同一件事，随便用哪条都一样"},{"l":"C","t":"只有 Prompt 有用，其他三条是摆设"},{"l":"D","t":"按字母顺序依次使用"}],"a":["A"],"e":"四条路径管不同层的问题：指令不清改 Prompt，检索不准调 RAG，流程不稳固化 Workflow，分工乱拆 Multi-Agent，实际常组合使用。症状决定路径，这是四条调优路径的用法总纲。这条原则要贯穿交付全程。\n【干扰项】\nB：各管一层，乱用会事倍功半。各管一层，错配就事倍功半。这一点要分清楚。\nC：四条都有不可替代的作用。四条各有不可替代的作用。这一点要分清楚。\nD：选型看场景症状，与字母顺序无关。调优按症状走，不按顺序走。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-032","d":5,"t":"multiple","q":"Prompt 调优的常用套路包括哪些？","o":[{"l":"A","t":"角色设定：给模型清晰的身份与边界"},{"l":"B","t":"明确任务：把要做的事写清楚"},{"l":"C","t":"给约束：列出禁区与转人工条件"},{"l":"D","t":"故意写得含糊，让模型自己猜想要什么"}],"a":["A","B","C"],"e":"角色、任务、约束、格式四个套路按需组合：答错多先查约束，输出乱先查格式，总跑题先查角色与任务描述，这是一套完整的指令设计方法。四招组合起来用，指令才立得住。\n【干扰项】\nD：含糊指令是 Prompt 反面教材，让模型猜等于把控制权交出去，跑偏概率大增。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-033","d":5,"t":"single","q":"改 Prompt 之前先记基线评分、改完再跑对比，这样做的原因是什么？","o":[{"l":"A","t":"流程要求走个形式"},{"l":"B","t":"让报告页数更多"},{"l":"C","t":"没有基线也完全没关系"},{"l":"D","t":"升降有数据支撑，改坏了能及时发现并回退"}],"a":["D"],"e":"没有基线就无从判断「变好还是变差」。先记基线再对比，改对保留、改坏回退，优化才不靠运气。有基线的优化才叫优化，没基线就是赌博。把它记牢，落地就不会跑偏。\n【干扰项】\nA：它是效果保障机制，不是形式。基线是效果保障机制，不是形式。\nB：与页数无关。报告页数从来不是目的。别把注意力放错了地方。\nC：缺基线的优化就是盲改。没有基线，改好改坏都说不清。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-034","d":5,"t":"single","q":"RAG 调优的第一步应该先做什么？","o":[{"l":"A","t":"查数据：清理重复、过时、冲突的内容"},{"l":"B","t":"先换最大的模型"},{"l":"C","t":"先加更多提示词"},{"l":"D","t":"先扩服务器"}],"a":["A"],"e":"检索不准一半根子在数据：新旧版本混存、口径不一，模型总命中错的。先清数据，再谈切分与召回。先清数据再谈其他，是 RAG 调优的铁律。这是方法层的硬要求。\n【干扰项】\nB：数据不干净，大模型也检索不准。模型再大也带不动脏数据。这一点要分清楚。\nC：提示词解决不了知识库的脏数据。提示词治不了知识库的病。\nD：硬件不解决数据质量问题。硬件升级不解决内容质量。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-035","d":5,"t":"multiple","q":"RAG 调优在数据之外的实操要点有哪些？","o":[{"l":"A","t":"切分长度按文档形态试：条款类短切，长文类长切"},{"l":"B","t":"检索可加关键词权重与重排，把最相关候选提前"},{"l":"C","t":"跑一批样例看命中片段对不对，反复迭代"},{"l":"D","t":"把所有文档切成单字保证精确"}],"a":["A","B","C"],"e":"切分、召回、验证循环是 RAG 调优的主线：切分找平衡点，重排提首条命中，样例驱动迭代。这套循环反复跑下来，检索质量会一层层稳步抬升。循环跑起来，检索质量就能一层层上台阶。\n【干扰项】\nD：切成单字会破坏语义，检索反而失效。单字切分破坏语义，检索会直接失效。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-036","d":5,"t":"single","q":"Workflow 调优里最影响效果的环节是什么？","o":[{"l":"A","t":"流程步骤拆得越细越好"},{"l":"B","t":"节点数量越多越好"},{"l":"C","t":"环节之间的传递字段：清晰、够用才顺"},{"l":"D","t":"异常分支会拖慢流程，全部砍掉"}],"a":["C"],"e":"某案例把问诊环节传下去的原始描述改成结构化字段，检索命中率立刻改善。字段设计是流程调优的重心，还要配好异常分支防卡死。字段是流程的血管，通了整体才顺。\n【干扰项】\nA：过细的步骤会拖垮维护成本，颗粒度以交接清晰为度，不是越细越好。\nB：节点多不等于效果好，反而难维护。节点多只会更难维护。两者不能混为一谈。\nD：砍掉异常分支流程必然卡死，答非所问与信息不齐都需要出口兜底。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-037","d":5,"t":"multiple","q":"Multi-Agent 调优的三个要点是哪些？","o":[{"l":"A","t":"角色界定：每个 Agent 职责边界写明"},{"l":"B","t":"交接质量：一个 Agent 传给下一个的信息决定下一环表现"},{"l":"C","t":"决策机制：意见不一致时由谁决定、怎么合成"},{"l":"D","t":"Agent 数量压到越多越好"}],"a":["A","B","C"],"e":"多 Agent 的质量瓶颈往往在角色与交接，不在每个 Agent 本身；三个要点齐了，整体才稳。三点齐备，多角色协作才有稳定可靠的结构。把分工边界写清楚，多角色协作才有秩序。\n【干扰项】\nD：数量堆高只增加协调成本，与质量无关。堆数量只增加协调成本。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-038","d":5,"t":"multiple","q":"关于调优节奏，下列说法正确的有哪些？","o":[{"l":"A","t":"先只调 Prompt，成本最低见效最快"},{"l":"B","t":"再清数据调 RAG，把检索提起来"},{"l":"C","t":"需要时再动 Workflow 或 Multi-Agent，一次只动一层"},{"l":"D","t":"四条路径一拥而上同时改"}],"a":["A","B","C"],"e":"节奏的本质是可控：一层一层推进，每层用评测集验证后再动下一层，出问题才说得清是哪层引起的。按这个顺序推进，每次改动都归因清晰、代价可控。\n【干扰项】\nD：全部同时改，效果归因完全失效。同时开动，效果就说不清来自哪里。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-039","d":5,"t":"single","q":"「调优的目标是够用且稳，不是越复杂越好」，这句话针对的是什么误区？","o":[{"l":"A","t":"复杂度越高越显得专业"},{"l":"B","t":"把简单问答也做成多角色，又慢又贵又难维护"},{"l":"C","t":"客户喜欢看架构图复杂"},{"l":"D","t":"简单方案拿不出手"}],"a":["B"],"e":"多角色与复杂流程都消耗资源、变慢、难维护。收益配得上代价才值得加复杂度，够用且稳是标准，不是堆技术。复杂度要为收益买单，这是调优的性价比观。\n【干扰项】\nA：复杂度不等于专业，适配才是。适配才是专业的标志。两者不能混为一谈。\nC：客户关心效果不是图。客户要的是效果，不是架构图。别把注意力放错了地方。\nD：交付追求解决问题，不追求花哨。解决问题才是交付的本意。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-040","d":5,"t":"single","q":"灰度期间重点盯的三类信号是什么？","o":[{"l":"A","t":"股价、新闻热度、竞品动向"},{"l":"B","t":"办公室网络带宽"},{"l":"C","t":"团队加班时长"},{"l":"D","t":"功能是否正常、有无异常表现、用户是否愿意用"}],"a":["D"],"e":"灰度的目的就是在小范围内验证：答得对不对、有没有幻觉越权、使用率有没有起来。三类信号正常，才逐步放量。三类信号都稳，放量才不是赌博。理解这一点，后面的动作才顺。\n【干扰项】\nA：与系统验证无关。灰度验证的是系统行为本身。它不在本题的判断范围里。\nB：带宽不是灰度观察重点。带宽不在灰度观察项里。别把注意力放错了地方。\nC：加班时长不反映系统质量。这一点要分清楚。盯的对象应是系统行为与用户反馈，不是人的辛苦程度。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-041","d":5,"t":"multiple","q":"上线前要备好的「退路」包括哪些？","o":[{"l":"A","t":"留出回滚手段，出问题能快速退回旧版本"},{"l":"B","t":"应急预案：异常时能临时关闭某功能"},{"l":"C","t":"评测集过一遍，确认整体达标"},{"l":"D","t":"什么都不准备，边上线边救火"}],"a":["A","B","C"],"e":"准备好了再上线：可回滚、有应急、评测达标，三条退路齐了，风险才有缓冲。有这些准备托底，上线才不是一场豪赌。三条退路齐备，上线才有安全垫。这是整个环节的立足点。\n【干扰项】\nD：无准备上线等于把事故交给运气。没有回滚路径的事故，只能现场硬扛到恢复为止。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-042","d":5,"t":"single","q":"某团队改了一版 Prompt 看着顺眼，A/B 一测指标反而差。这件事的价值是什么？","o":[{"l":"A","t":"用两组对照数据代替感觉做判断，避免凭感觉上线带来的退步"},{"l":"B","t":"说明测试浪费时间"},{"l":"C","t":"说明新版本一定更差，永远不用改"},{"l":"D","t":"纯属偶然，下次不用测"}],"a":["A"],"e":"A/B 的意义是把「要不要改」交给数据：新旧两组真实用户对比，谁好用上谁，主观印象靠边站。感觉会骗人，两组对照数据不会。这也是实战反复验证过的规律。\n【干扰项】\nB：测试恰恰避免了更大的浪费。测试避免的是更大的浪费。方向反了努力就白费。一次小规模对照的成本，挡掉的是带着退步版本上线的损失。\nC：单次结论不绝对，但那次该退回。单次结论有限，但那次确实该退回。\nD：可复现的对照设计是有效证据。别把注意力放错了地方。同样的对照流程可以反复重跑，偶然性恰恰被它排除了。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-043","d":5,"t":"single","q":"「数据飞轮」的含义是什么？","o":[{"l":"A","t":"数据在服务器里转圈"},{"l":"B","t":"数据攒够量系统会自己变好，无需人工调优"},{"l":"C","t":"把数据卖给第三方"},{"l":"D","t":"用的人越多，收集的数据越多，系统调得越好，进而越好用、人更多"}],"a":["D"],"e":"运营数据回流评测与调优，形成正向循环：数据养系统、系统更准、体验更好、用户更多，这是运营迭代的底层逻辑。数据回流越顺畅，系统长得越快。这条原则要贯穿交付全程。\n【干扰项】\nA：飞轮指价值循环，不是物理存储。飞轮是价值循环，不是存储概念。\nB：数据不会自动变成质量，飞轮转动靠运营、评测与调优的持续投入。\nC：数据外售触碰合规红线。这一点要分清楚。运营数据的价值在回流改进，不在对外变现。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-044","d":5,"t":"multiple","q":"版本管理的成熟规矩包含哪些？","o":[{"l":"A","t":"版本号清晰，改动有记录，谁改的写得清"},{"l":"B","t":"每次上线前评测、灰度、回归走一遍"},{"l":"C","t":"出问题能一键回退到上一个版本"},{"l":"D","t":"悄悄改线上，不告诉任何人"}],"a":["A","B","C"],"e":"规矩稳了频繁迭代才不乱：可追踪、有闸门、能回退，三者构成版本管理的安全底座。这些规矩不是负担，而是频繁迭代的底气。可追踪、有闸门、能回退，版本管理就这三件事。\n【干扰项】\nD：悄悄改线上是事故的第一来源。无记录的变更出了问题，连回退到哪个版本都说不清。","s":"自编-TCFDE-2026-09"},{"id":"TF-D5-045","d":5,"t":"multiple","q":"把监控变成日常习惯，正确的做法有哪些？","o":[{"l":"A","t":"固定节奏过一遍关键指标，异常早发现"},{"l":"B","t":"指标跌到阈值自动预警提醒负责人"},{"l":"C","t":"别等客户投诉了才发现问题"},{"l":"D","t":"只在出大事后才看监控"}],"a":["A","B","C"],"e":"监控日常化加自动预警，把风险压在早期：发现越早处理成本越低，运营才不会被动救火。监控成了日常动作，运营才算真正可控。监控常态化，风险就被挡在早期。\n【干扰项】\nD：事后才看等于放弃了预警的全部价值。异常在变成事故前有窗口期，日常巡检要抓的就是这段窗口。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-001","d":6,"t":"single","q":"在为某零售集团交付智能体时，客户要求「核心业务数据不出自有云账户」。作为交付工程师，下列做法最能满足该诉求的是？","o":[{"l":"A","t":"把数据全部上传到公网模型服务再调用"},{"l":"B","t":"把数据导出到本地电脑再手工喂给模型"},{"l":"C","t":"让模型自行记忆全部数据以便随时调用"},{"l":"D","t":"采用数据留在客户自有云资源内、模型就近调用的部署方式"}],"a":["D"],"e":"该诉求的本质是数据主权与隐私边界。让数据留在客户自有云资源内、由模型就近调用，能确保核心数据不流出客户指定的账户与网络，最贴合诉求。\n【干扰项】\nA：把数据传到公网服务恰恰违反了「数据不出自有账户」的要求，方向相反。\nB：导出到本地再手工喂，既不安全也不可持续，且仍存在数据外流风险。\nC：模型不擅长精确记忆数据，且让模型「记住」全部数据既不可靠也不解决权限隔离问题。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-002","d":6,"t":"single","q":"某企业担心员工通过智能体查到本不该看的薪酬数据。下列哪项是防范此类问题的正确设计方向？","o":[{"l":"A","t":"按用户角色对知识库内容做访问权限隔离"},{"l":"B","t":"不做任何限制，相信员工自觉"},{"l":"C","t":"把薪酬数据也放进公开知识库方便检索"},{"l":"D","t":"关闭智能体的所有查询功能"}],"a":["A"],"e":"这是典型的越权访问防控问题。按用户角色对知识库内容做权限隔离，让不同人只能检索到自己有权查看的内容，才能从源头防止越权。在交付中，权限隔离要按角色落到知识库颗粒度，而不是笼统开放。\n【干扰项】\nB：仅靠员工自觉无法构成有效管控，一旦有人越界查询就无从拦截；正确做法是按角色对薪酬等敏感数据设置访问权限，从系统层面阻断越权。\nC：把敏感数据放进公开知识库会扩大泄露面，与目标相悖。\nD：一刀切关闭查询会牺牲正常业务价值，属于因噎废食，不是合理设计。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-003","d":6,"t":"single","q":"关于智能体处理个人信息，下列说法最恰当的是？","o":[{"l":"A","t":"只要是智能体处理就无需考虑合规"},{"l":"B","t":"处理个人信息应遵循最小必要原则并保障数据安全"},{"l":"C","t":"个人信息可以随意跨境传输"},{"l":"D","t":"收集越多个人信息智能体越智能，应尽量多收"}],"a":["B"],"e":"处理个人信息应遵循最小必要原则，只收集实现目的所必需的信息，并采取措施保障数据安全，这是责任 AI 的基本要求。实践中常按部门或岗位划分可见范围，从源头堵住越权查询。\n【干扰项】\nA：无论由谁处理，个人信息合规要求都适用，智能体不豁免。\nC：个人信息跨境有明确的合规前提，需满足安全评估、认证或标准合同等条件，不能随意传输，否则会触碰数据出境的法规红线。\nD：过度收集违反最小必要原则，且增大合规与安全风险，并不会让智能体更智能。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-004","d":6,"t":"single","q":"某医疗客户在知识库里存放了患者相关信息。交付时最应优先落实的是？","o":[{"l":"A","t":"让所有员工都能自由检索患者信息"},{"l":"B","t":"把患者信息公开以方便科研"},{"l":"C","t":"对敏感信息做脱敏并设置严格的访问权限"},{"l":"D","t":"不区分数据类型统一处理"}],"a":["C"],"e":"患者信息属于高度敏感数据，应先做脱敏处理并设置严格的访问权限，确保只有授权人员在授权范围内使用，这是隐私保护的底线。最小必要原则要求只收集实现目的所必需的信息，多收即是风险。\n【干扰项】\nA：让所有人自由检索敏感信息会造成严重的隐私泄露风险。\nB：未经合法依据把患者信息公开会严重侵犯隐私、违反数据保护要求；正确做法是先脱敏再按权限受控使用，科研需求也要走合规路径。\nD：敏感数据与普通数据的处理要求不同，不区分类型会埋下合规隐患。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-005","d":6,"t":"single","q":"下列关于「数据主权」的理解，最准确的是？","o":[{"l":"A","t":"数据主权指数据可以被任意复制"},{"l":"B","t":"数据主权指模型拥有数据的所有权"},{"l":"C","t":"数据主权与合规无关"},{"l":"D","t":"数据主权强调数据的存储与处理受特定主体的掌控、不随意流出其指定范围"}],"a":["D"],"e":"数据主权强调数据的存储与处理应处于特定主体的掌控之下，不流出其指定的账户与网络范围，是安全合规的重要概念。敏感数据一旦泄露影响面大，脱敏加权限是交付时的基本动作。\n【干扰项】\nA：任意复制恰恰是数据主权要防范的失控状态；数据主权强调数据处理受特定主体掌控、不流出其指定范围，与随意复制正好相反。\nB：模型只是处理数据的工具，并不拥有客户数据的所有权；数据的归属与掌控权始终在客户一方，这正是数据主权关注的核心。\nC：数据主权是合规的重要组成部分，直接关系数据存储与跨境是否合法，说它与合规无关就抽掉了这一概念的现实意义。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-006","d":6,"t":"single","q":"客户问：「智能体会不会把我们的机密资料拿去训练别的模型？」交付工程师最恰当的回应方向是？","o":[{"l":"A","t":"说明采用数据不外流的部署方式、客户数据仅在其授权范围内使用"},{"l":"B","t":"含糊其辞，不予正面回答"},{"l":"C","t":"保证绝对不可能有任何风险"},{"l":"D","t":"建议客户不要使用智能体"}],"a":["A"],"e":"应正面说明可采用数据不外流的部署方式，客户数据仅在其授权范围内用于其自身业务，不被用于其他用途，从而消除客户顾虑。数据主权强调核心数据始终处于客户掌控之下、不流出指定范围。\n【干扰项】\nB：含糊其辞会加重客户对数据安全的不信任、拖累交付推进；正确做法是正面说明数据不外流的部署方式，用事实打消疑虑。\nC：轻易保证「绝对无风险」既不专业也不诚实，反而显得不可信。\nD：因担心而劝客户放弃使用，等于放弃交付价值，属于过度反应。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-007","d":6,"t":"multiple","q":"为某金融客户交付智能体时，围绕数据权限与隐私保护，下列哪些做法是恰当的？","o":[{"l":"A","t":"按角色隔离知识库访问权限"},{"l":"B","t":"对敏感字段做脱敏处理"},{"l":"C","t":"采用数据留在客户自有资源内的部署方式"},{"l":"D","t":"把所有数据公开以提升检索效率"}],"a":["A","B","C"],"e":"金融数据敏感度高，按角色隔离权限、对敏感字段脱敏、采用数据不外流的部署方式，都是保护数据与隐私的恰当做法。正面回应并给出数据不外流的方案，比含糊承诺更能建立信任。\n【干扰项】\nD：把所有数据公开会造成严重泄露风险，与隐私保护目标完全相悖，是错误做法。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-008","d":6,"t":"multiple","q":"下列哪些属于智能体交付中「越权访问防控」需要考虑的要点？","o":[{"l":"A","t":"不同角色可检索的知识范围不同"},{"l":"B","t":"对高敏感操作设置审核或只读限制"},{"l":"C","t":"记录访问行为以便追溯"},{"l":"D","t":"让所有用户共享同一套无差别权限"}],"a":["A","B","C"],"e":"越权访问防控需要做到角色化的知识范围隔离、对高敏感操作设限、以及记录访问行为便于追溯，这三项共同构成防护体系。金融等高敏感场景，隔离、脱敏、数据不外流三者往往缺一不可。\n【干扰项】\nD：无差别共享权限正是越权访问的温床，与防控目标相反，属于错误做法。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-009","d":6,"t":"single","q":"关于个人信息的跨境提供，下列说法最恰当的是？","o":[{"l":"A","t":"可以随时随意向境外提供"},{"l":"B","t":"需要满足相应的合规前提和条件"},{"l":"C","t":"只要加密就无需任何合规手续"},{"l":"D","t":"个人信息跨境完全不受约束"}],"a":["B"],"e":"个人信息向境外提供需要满足相应的合规前提与条件，不能随意进行，这是国内法规语境下的明确要求。越权防控要同时覆盖能查什么、能做什么、以及行为可追溯三层。\n【干扰项】\nA：随意向境外提供个人信息不符合合规要求；跨境提供必须先满足安全评估、认证或标准合同等前提条件，不能想传就传。\nC：加密只是保护数据的安全措施之一，不能替代法规要求的合规手续；即便加密，跨境提供仍需履行评估或备案等前提。\nD：个人信息跨境受到明确的法规约束，并非不受限制；必须在满足合规前提的情况下才可进行，否则属于违规出境。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-010","d":6,"t":"single","q":"某客服智能体可能被用户诱导说出不当言论。下列最合适的防护手段是？","o":[{"l":"A","t":"完全不设防，靠模型自觉"},{"l":"B","t":"关闭智能体避免风险"},{"l":"C","t":"设置内容安全过滤与输出审查机制"},{"l":"D","t":"让智能体随意回答任何问题"}],"a":["C"],"e":"面向公众的智能体应设置内容安全过滤与输出审查机制，对输入和输出进行把关，防止产生不当内容，这是内容安全的基本手段。个人信息跨境有明确合规前提，不能以加密或技术手段替代合规手续。\n【干扰项】\nA：完全不设防会让智能体暴露在被诱导的风险中，很容易被套出不当言论；正确做法是在输入输出两端都设置内容安全过滤。\nB：直接关闭智能体虽然消除了风险，却也牺牲了全部业务价值，属于因噎废食；应通过内容审查而非停用来控制风险。\nD：让智能体随意回答任何问题正是内容安全要防范的情形；正确做法是设过滤和审查，对不当请求拒答或转人工。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-011","d":6,"t":"single","q":"「提示词注入」是指下列哪种风险？","o":[{"l":"A","t":"模型运行速度过慢"},{"l":"B","t":"知识库容量不足"},{"l":"C","t":"模型训练数据过多"},{"l":"D","t":"用户通过精心构造的输入诱导模型偏离预设约束"}],"a":["D"],"e":"提示词注入指用户通过精心构造的输入，诱导模型忽略或绕过预设的约束和角色设定，从而做出本不该做的响应，是内容安全的重要风险。面向公众的智能体尤其要在输入和输出两端都设内容安全关卡。\n【干扰项】\nA：运行速度过慢属于性能问题，与提示词注入这类安全风险不是一回事；提示词注入指用构造输入诱导模型绕过约束。\nB：知识库容量不足属于资源配置问题，不是安全风险；提示词注入的本质是通过输入操纵模型行为，与容量无关。\nC：训练数据过多与提示词注入不是同一范畴；注入风险出现在运行时的输入环节，而非模型训练阶段的数据规模。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-012","d":6,"t":"single","q":"为防止智能体输出违规内容，下列哪项设计最直接有效？","o":[{"l":"A","t":"在输出环节加入内容安全审查"},{"l":"B","t":"增大模型参数量"},{"l":"C","t":"扩大上下文窗口"},{"l":"D","t":"提高回答速度"}],"a":["A"],"e":"在输出环节加入内容安全审查，对模型生成的内容进行合规把关后再返回用户，是防止违规输出最直接有效的手段。提示词注入是绕过约束的常见攻击，需在设计阶段就预防。\n【干扰项】\nB：增大参数量提升的是模型通用能力，并不直接解决合规把关；防止违规输出要靠输出环节的内容安全审查，而非堆参数。\nC：扩大上下文窗口影响的是一次能处理的篇幅，与拦截违规内容无关；守合规要在输出侧加审查，而不是加大窗口。\nD：提高回答速度是性能优化，与内容是否合规毫无关系；防违规输出的关键是输出前的合规审查，快慢并不影响合规。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-013","d":6,"t":"single","q":"某政务智能体要求回答严格限定在政策范围内。下列哪种做法最能约束其回答边界？","o":[{"l":"A","t":"让模型自由发挥"},{"l":"B","t":"通过角色指令和知识库限定回答范围，超范围则明确拒答"},{"l":"C","t":"去掉所有约束以提升灵活性"},{"l":"D","t":"鼓励模型对不确定的问题也给出肯定答案"}],"a":["B"],"e":"通过角色指令明确职责边界、用知识库限定内容来源，并对超出范围的问题明确拒答，能有效把回答约束在政策范围内。输出审查是拦截违规内容的最后一道关，不能只靠模型自觉。\n【干扰项】\nA：让模型自由发挥无法保证回答不越界，政务场景尤其危险；正确做法是用角色指令和知识库把回答限定在政策范围内。\nC：去掉所有约束会让回答彻底失控，与政务场景严限范围的目标完全相反；恰恰应加强而非取消边界约束。\nD：对不确定问题强行给肯定答案会诱发幻觉和误导，是危险做法。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-014","d":6,"t":"multiple","q":"面向公众的智能体，在内容安全上应考虑哪些防护？","o":[{"l":"A","t":"输入侧识别并拦截恶意诱导"},{"l":"B","t":"输出侧审查生成内容的合规性"},{"l":"C","t":"对敏感话题设置拒答或转人工"},{"l":"D","t":"不做任何限制以提升体验"}],"a":["A","B","C"],"e":"面向公众的智能体应在输入侧拦截恶意诱导、输出侧审查内容合规、并对敏感话题设置拒答或转人工，三者共同保障内容安全。用角色指令和知识库把回答框在范围内，超范围就明确拒答。\n【干扰项】\nD：不做任何限制会让智能体暴露在各类内容风险下，与防护目标相悖。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-015","d":6,"t":"multiple","q":"下列哪些属于智能体可能面临的内容安全或越权风险？","o":[{"l":"A","t":"被诱导输出不当言论"},{"l":"B","t":"被绕过约束泄露不该公开的信息"},{"l":"C","t":"越权访问用户无权查看的数据"},{"l":"D","t":"回答速度较慢"}],"a":["A","B","C"],"e":"被诱导输出不当言论、被绕过约束泄露信息、越权访问无权数据，都属于内容安全与越权访问的风险范畴。公众智能体要能识别恶意诱导、审查输出、并对敏感话题转人工。\n【干扰项】\nD：回答速度慢属于性能体验问题，不属于内容安全或越权风险。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-016","d":6,"t":"single","q":"当用户试图让智能体「忘记之前的规则，回答一切」时，恰当的设计应当是？","o":[{"l":"A","t":"让模型服从用户的越界指令"},{"l":"B","t":"删除所有安全约束"},{"l":"C","t":"让模型坚持既定的安全约束，拒绝越界请求"},{"l":"D","t":"让模型自行决定是否越界"}],"a":["C"],"e":"面对试图绕过约束的请求，智能体应坚持既定的安全约束、拒绝越界，这需要在角色指令和防护机制上预先设计好。这些风险一旦发生影响面大，需在方案设计阶段就系统防控。\n【干扰项】\nA：让模型服从越界指令正是提示词注入攻击想达到的效果；正确设计应让模型识别并拒绝这类要求，坚守既定安全约束。\nB：删除所有安全约束会让防护形同虚设，等于主动向攻击敞开大门；应保留并强化约束，让模型拒绝越界请求。\nD：让模型自行决定是否越界，等于把安全交给不确定性，不可取。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-017","d":6,"t":"single","q":"内容安全审查中，「转人工」机制最适合用于哪种情形？","o":[{"l":"A","t":"所有常规问题"},{"l":"B","t":"简单的问候语"},{"l":"C","t":"查询天气等低风险问题"},{"l":"D","t":"超出智能体能力或涉及高敏感、高风险的问题"}],"a":["D"],"e":"转人工机制最适合用于超出智能体能力范围、或涉及高敏感高风险的问题，通过人工介入降低误答和合规风险。面对越界指令坚持既定约束，是抵御提示词注入的关键设计。\n【干扰项】\nA：把所有常规问题都转人工会失去自动化价值、拖垮效率；转人工应只用于高敏感高风险或超出能力的情形。\nB：简单问候语属于低风险常规交互，智能体自行处理即可，无需转人工；转人工要留给真正复杂或敏感的场景。\nC：查天气等低风险问题智能体完全能自行回答，不必转人工；把这类问题转人工是对人工资源的浪费。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-018","d":6,"t":"single","q":"模型「幻觉」指的是下列哪种现象？","o":[{"l":"A","t":"模型生成了看似合理但与事实不符的内容"},{"l":"B","t":"模型运行时占用内存过高"},{"l":"C","t":"模型响应速度变慢"},{"l":"D","t":"模型无法接收输入"}],"a":["A"],"e":"幻觉指模型生成了看似合理、表达流畅，但与事实不符甚至完全虚构的内容，其根源在于模型追求「最像样的下一个词」而非「最真实」。转人工适合高敏感高风险场景，用人工介入兜住模型能力边界。\n【干扰项】\nB：内存占用过高属于资源问题，与幻觉无关；幻觉指模型生成看似合理却与事实不符的内容，是内容层面的偏差。\nC：响应速度变慢是性能指标问题，不是幻觉；幻觉的本质是内容失真，而非快慢，两者属于完全不同的范畴。\nD：无法接收输入属于功能故障，与幻觉是不同概念；幻觉发生在模型能正常作答、却把内容编错的情形下。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-019","d":6,"t":"single","q":"下列哪种做法最能降低智能体回答中的事实性幻觉？","o":[{"l":"A","t":"让模型仅凭自身记忆回答专业问题"},{"l":"B","t":"用知识库提供可靠依据、让模型基于检索到的内容作答"},{"l":"C","t":"鼓励模型大胆猜测"},{"l":"D","t":"去掉所有事实核查环节"}],"a":["B"],"e":"用知识库提供可靠依据，让模型基于检索到的真实内容作答（即 RAG 的思路），能显著降低事实性幻觉，因为回答有了可追溯的来源。幻觉源于模型追求表达合理而非事实，是生成式模型的固有特性。\n【干扰项】\nA：仅凭模型记忆回答专业问题正是幻觉高发场景，容易过时或编造；应接入知识库让回答基于检索到的真实内容。\nC：鼓励模型大胆猜测会增加而非降低幻觉；正确方向是让回答有据可依，缺乏依据时明确拒答而不是猜。\nD：去掉事实核查环节会让幻觉无从拦截、直接流向用户；降低幻觉恰恰需要保留核查与知识库佐证。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-020","d":6,"t":"single","q":"某客户抱怨智能体「一本正经地编造了一个不存在的政策条款」。这最可能是什么问题？","o":[{"l":"A","t":"网络故障"},{"l":"B","t":"权限不足"},{"l":"C","t":"模型幻觉"},{"l":"D","t":"上下文窗口过大"}],"a":["C"],"e":"一本正经地编造不存在的内容，是模型幻觉的典型表现——模型用流畅表达把缺失的信息「补」了出来，却与事实不符。用知识库提供可追溯依据，是降低事实性幻觉最有效的手段之一。\n【干扰项】\nA：网络故障通常导致无响应或报错，不会让模型编造出内容；一本正经编造条款是幻觉的典型表现。\nB：权限不足会导致无法访问或被拒绝，而不是编造内容；编造不存在的条款属于模型幻觉，与权限无关。\nD：上下文窗口过大不会直接导致编造条款，方向判断有误；编造内容的根源是模型幻觉，而非窗口大小。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-021","d":6,"t":"single","q":"关于幻觉治理，下列说法最准确的是？","o":[{"l":"A","t":"幻觉完全无法治理"},{"l":"B","t":"只要模型够大就绝不会有幻觉"},{"l":"C","t":"幻觉与数据来源无关"},{"l":"D","t":"幻觉可以通过合理设计被显著降低，但很难做到绝对为零"}],"a":["D"],"e":"幻觉源于生成式模型的天性，可以通过知识库、检索增强、约束和核查等手段被显著降低，但由于原理限制很难做到绝对为零，需要给客户建立正确预期。\n【干扰项】\nA：幻觉可通过知识库、检索增强、核查等手段被有效治理，并非完全无法应对；说它无法治理过于悲观且不符实际。\nB：模型再大也无法根除幻觉，规模不是万灵药；降低幻觉靠的是提供依据和核查，而不是单纯把模型做大。\nC：提供可靠数据来源正是治理幻觉的关键，二者高度相关。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-022","d":6,"t":"single","q":"为高准确性要求的场景交付时，面对幻觉风险，交付工程师应如何管理客户预期？","o":[{"l":"A","t":"说明生成式输出存在不确定性，并介绍降低风险的手段"},{"l":"B","t":"承诺百分之百不出错"},{"l":"C","t":"隐瞒幻觉的存在"},{"l":"D","t":"声称模型没有任何局限"}],"a":["A"],"e":"应如实说明生成式输出存在不确定性，同时介绍知识库、检索增强、审查核查等降低风险的手段，把预期引导到「将风险降到可接受范围」。幻觉可显著降低但难绝对归零，需给客户建立正确的预期。\n【干扰项】\nB：承诺百分之百不出错违背生成式模型的原理，是根本做不到的；应说明不确定性并介绍把风险降到可接受范围的手段。\nC：隐瞒幻觉的存在会在出问题时彻底失去客户信任；正确做法是如实告知并展示降低风险的措施，管理好预期。\nD：声称模型没有任何局限既不诚实也不专业，反而显得不可信；应坦诚边界并给出应对方案，才更让人托付。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-023","d":6,"t":"multiple","q":"下列哪些手段有助于治理模型幻觉？","o":[{"l":"A","t":"引入知识库让回答有据可依"},{"l":"B","t":"对关键结论设置人工或规则核查"},{"l":"C","t":"让模型明确标注不确定或拒答"},{"l":"D","t":"鼓励模型对未知问题也给出确定答案"}],"a":["A","B","C"],"e":"引入知识库提供依据、对关键结论设核查、让模型对不确定内容明确标注或拒答，都是治理幻觉的有效手段。高准确场景要如实说明不确定性，并配套降低风险的手段。\n【干扰项】\nD：对未知问题强行给确定答案会制造幻觉，与治理目标完全相反。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-024","d":6,"t":"multiple","q":"关于模型幻觉的成因与应对，下列哪些说法正确？","o":[{"l":"A","t":"幻觉源于模型追求「最像样的下一个词」而非核对事实"},{"l":"B","t":"提供可靠的检索来源有助于减少幻觉"},{"l":"C","t":"越是缺乏依据的问题越容易触发幻觉"},{"l":"D","t":"幻觉只出现在小模型上，大模型完全没有"}],"a":["A","B","C"],"e":"幻觉的成因是模型追求表达的合理性而非事实性，缺乏依据时更易触发，而提供可靠检索来源能减少幻觉，这些理解都正确。引依据、设核查、让模型对不确定内容拒答，是治理幻觉的组合拳。\n【干扰项】\nD：幻觉是生成式模型的共性，大模型同样会出现，并非小模型独有。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-025","d":6,"t":"single","q":"下列关于「让模型拒答」的说法，最恰当的是？","o":[{"l":"A","t":"拒答是能力不足的表现，应尽量避免"},{"l":"B","t":"对超出依据范围的问题，让模型明确拒答比强行编答更负责任"},{"l":"C","t":"模型永远不应该拒答"},{"l":"D","t":"拒答会降低模型价值，应禁止"}],"a":["B"],"e":"对超出知识依据范围的问题，让模型明确拒答或说明不确定，比强行编造答案更负责任，也更能减少幻觉带来的误导。缺乏依据的问题最易触发幻觉，提供检索来源能明显改善。\n【干扰项】\nA：恰当的拒答是负责任的设计而非能力不足；对超出依据范围的问题拒答，比强行编造更能保护准确性。\nC：模型永远不拒答会逼出编造、放大幻觉，反而有害；对没有把握的问题，明确拒答才是稳妥的做法。\nD：合理拒答保护了回答的准确性、提升而非降低可信价值；把拒答一概禁止会迫使模型硬答，得不偿失。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-026","d":6,"t":"single","q":"在国内法规语境下，提供生成式 AI 服务时，下列做法最恰当的是？","o":[{"l":"A","t":"对生成内容不做任何合规约束"},{"l":"B","t":"随意生成任何内容"},{"l":"C","t":"遵循相关法规要求，对训练数据与生成内容履行合规义务"},{"l":"D","t":"忽视用户权益"}],"a":["C"],"e":"在国内法规语境下，提供生成式 AI 服务应遵循相关法规要求，对训练数据来源与生成内容履行合规义务，并保护用户合法权益。对超范围问题明确拒答，比强行编答更负责任、更少误导。\n【干扰项】\nA：对生成内容不做任何合规约束不符合国内法规要求；提供生成式服务须对训练数据与生成内容履行合规义务。\nB：随意生成任何内容会触碰合规红线、带来法律风险；服务提供者应在法规框架内约束生成范围。\nD：忽视用户权益违反合规与责任 AI 的基本原则；提供服务时应保护用户的知情、隐私等合法权益。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-027","d":6,"t":"single","q":"关于生成式 AI 生成内容的标识，下列说法较为恰当的是？","o":[{"l":"A","t":"生成内容无需任何说明"},{"l":"B","t":"应刻意隐瞒内容由 AI 生成"},{"l":"C","t":"标识会降低体验，应一律去除"},{"l":"D","t":"在适当情形下对 AI 生成内容进行标识有助于合规与透明"}],"a":["D"],"e":"在适当情形下对 AI 生成的内容进行标识，有助于提升透明度、保障用户知情，符合合规与责任 AI 的方向。国内法规下要对训练数据来源与生成内容履行合规义务。\n【干扰项】\nA：完全不作任何说明在某些情形下不符合透明要求；对 AI 生成内容适当标识有助于保障用户知情。\nB：刻意隐瞒内容由 AI 生成属于误导用户、违背透明原则；应在适当情形主动标识，而非藏着掖着。\nC：标识是为了透明与合规，不应以体验为由一律去除；在需要的场景保留标识，才符合责任 AI 的要求。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-028","d":6,"t":"single","q":"某内容平台用智能体自动生成文章。为守住合规边界，下列哪项最重要？","o":[{"l":"A","t":"对生成内容进行合规审查，避免违法违规信息"},{"l":"B","t":"追求生成数量最大化，不管内容"},{"l":"C","t":"关闭所有审查以提升产量"},{"l":"D","t":"让模型自由生成任何主题"}],"a":["A"],"e":"自动生成内容必须经过合规审查，避免产生违法违规信息，这是守住合规边界最重要的一环。在适当情形对 AI 生成内容做标识，有助于透明与用户知情。\n【干扰项】\nB：一味追求生成数量而不管内容会累积合规风险；自动生成内容必须经过合规审查才能守住边界。\nC：关闭所有审查会让违规内容直接流出，风险极高；产量再高也不能以牺牲合规为代价，审查不可省。\nD：不加限制地自由生成任何主题难以守住合规边界；应对生成范围和内容设约束并配合审查。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-029","d":6,"t":"single","q":"下列关于「责任 AI」的理解，最准确的是？","o":[{"l":"A","t":"责任 AI 只关心模型准确率"},{"l":"B","t":"责任 AI 关注安全、隐私、公平、透明与合规等多个维度"},{"l":"C","t":"责任 AI 与数据隐私无关"},{"l":"D","t":"责任 AI 只是口号，无需落地"}],"a":["B"],"e":"责任 AI 是一个综合概念，关注安全、隐私、公平、透明、合规等多个维度，要求在设计与交付中综合考量，而非只看准确率。自动生成内容必须经合规审查，避免违法违规信息流出。\n【干扰项】\nA：准确率只是责任 AI 的一小部分，其内涵还涵盖安全、隐私、公平、透明与合规等多个维度，只看准确率过于狭隘。\nC：数据隐私是责任 AI 的重要组成部分，二者密切相关；说它与隐私无关就抽掉了责任 AI 的关键一环。\nD：责任 AI 需要在具体设计与交付中落地，不是空口号。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-030","d":6,"t":"multiple","q":"在国内法规语境下交付生成式 AI 应用，下列哪些属于应履行的合规考量？","o":[{"l":"A","t":"关注训练数据来源的合法性"},{"l":"B","t":"对生成内容进行合规审查"},{"l":"C","t":"保护用户个人信息与权益"},{"l":"D","t":"刻意隐瞒服务由 AI 提供"}],"a":["A","B","C"],"e":"关注训练数据来源合法性、对生成内容做合规审查、保护用户个人信息与权益，都是应履行的合规考量。责任 AI 是涵盖安全、隐私、公平、透明、合规的综合要求。\n【干扰项】\nD：刻意隐瞒 AI 身份违背透明原则，属于错误做法而非合规考量。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-031","d":6,"t":"multiple","q":"下列哪些属于「责任 AI」在智能体交付中的具体体现？","o":[{"l":"A","t":"对敏感数据做权限隔离与脱敏"},{"l":"B","t":"对生成内容做安全与合规审查"},{"l":"C","t":"对不确定内容明确标注或拒答"},{"l":"D","t":"为追求效果忽略用户隐私"}],"a":["A","B","C"],"e":"权限隔离与脱敏、内容安全合规审查、对不确定内容标注或拒答，都是责任 AI 在交付中的具体体现。服务提供者需在法规框架内履行合规义务，技术中立不免责。\n【干扰项】\nD：为追求效果而牺牲用户隐私违背责任 AI 原则，是典型反例；真正的责任 AI 要在保护隐私的前提下追求效果。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-032","d":6,"t":"single","q":"客户希望智能体生成营销文案，同时担心合规。交付工程师最恰当的建议是？","o":[{"l":"A","t":"不设任何审查，先做出来再说"},{"l":"B","t":"让模型自由生成，出问题再删"},{"l":"C","t":"在生成流程中加入合规审查，对违规表述进行拦截"},{"l":"D","t":"承诺文案绝不会有任何合规问题"}],"a":["C"],"e":"应在生成流程中加入合规审查环节，对夸大、违规等表述进行识别和拦截，把合规风险控制在发布之前。权限隔离、内容审查、不确定拒答，都是责任 AI 的落地抓手。\n【干扰项】\nA：不设任何审查就先做出来，会让违规文案直接流出、埋下合规隐患；应在生成流程中前置合规审查再发布。\nB：让模型自由生成、出问题再删，事后补救成本高且风险大；不如把合规审查前置，在发布前就拦住违规表述。\nD：轻易承诺文案绝不会有任何合规问题既不专业也难以兑现；应说明会通过审查把风险控制在可接受范围。","s":"自编-TCFDE-2026-09"},{"id":"TF-D6-033","d":6,"t":"single","q":"关于生成式 AI 的合规边界，下列说法最恰当的是？","o":[{"l":"A","t":"技术中立，因此无需承担任何合规责任"},{"l":"B","t":"只要是 AI 生成就不受法规约束"},{"l":"C","t":"合规义务只针对用户，与服务提供者无关"},{"l":"D","t":"提供服务者需在法规框架内履行相应合规义务"}],"a":["D"],"e":"生成式 AI 服务提供者需要在法规框架内履行相应的合规义务，技术中立不等于免除责任，这是国内法规语境下的明确要求。营销文案等生成场景，应把合规审查前置到发布之前。\n【干扰项】\nA：技术中立不能作为免除合规责任的理由；生成式服务提供者仍需在法规框架内履行相应的合规义务。\nB：AI 生成的内容同样受法规约束，并不因由 AI 产生就豁免；服务提供者要对生成内容负合规责任。\nC：服务提供者是合规义务的重要主体，并非与己无关；把合规义务只推给用户是对自身责任的误解。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-001","d":7,"t":"single","q":"数据保护的第一步，为什么是「先给数据分敏感级」？","o":[{"l":"A","t":"分级是为了给文件改名"},{"l":"B","t":"分级之后才能对症下药：高级别严防，低级别适度"},{"l":"C","t":"监管要求必须改名，与保护无关"},{"l":"D","t":"所有数据按最高等级保护最省事"}],"a":["B"],"e":"身份证、健康数据与公开价格的风险完全不同。分级之后，保护强度才能与风险匹配，既不漏掉重点，也不过度投入。分级是保护动作的起点，先分清轻重再配资源。\n【干扰项】\nA：改名是形式，不是目的。改名只是外在形式。别把注意力放错了地方。\nC：分级是保护动作，不是文书要求。它服务于保护本身，不是文书工作。\nD：全部按最高级保护成本不可承受，也无法持续。顶格保护既贵又难持续。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-002","d":7,"t":"single","q":"权限设计遵循「最小够用」原则，它的含义是什么？","o":[{"l":"A","t":"每个角色只拿到完成工作所必需的最少数据与操作"},{"l":"B","t":"权限给得越少越好，最好谁都用不了"},{"l":"C","t":"权限越大越方便工作"},{"l":"D","t":"权限先全开再慢慢收"}],"a":["A"],"e":"最小够用是风险与效率的平衡：够完成工作即可，把暴露面压到最小，真出问题也只影响很小的范围。不是不给，是不多给。最小够用，是风险与效率的平衡点。\n【干扰项】\nB：权限卡死会阻断正常业务。卡死权限会阻断正常业务。这一点要分清楚。\nC：权限越大风险越大。权限越大，风险必然越大。后果会直接落在项目上。\nD：先开后收意味着风险窗口期，不可取。先开后收等于给了风险窗口期。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-003","d":7,"t":"multiple","q":"「角色加范围」双重上锁，两层各管什么？","o":[{"l":"A","t":"角色决定能操作什么功能"},{"l":"B","t":"范围决定能接触哪些数据"},{"l":"C","t":"两层叠加才锁得住越权"},{"l":"D","t":"只要角色对了范围可以不看"}],"a":["A","B","C"],"e":"单靠「谁能进系统」不够，还要管「能看哪些数据」。角色定工具边界、范围定数据边界，两层一起用，权限才真正闭环。两层一起设，权限才没有缝可钻。把它记牢，落地就不会跑偏。\n【干扰项】\nD：只看角色不看范围，跨组数据就会被顺手带走。权限的最后一道缝，往往就漏在不设范围这一环。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-004","d":7,"t":"single","q":"高度敏感数据（证件号、银行卡、健康记录）的存储底线是什么？","o":[{"l":"A","t":"明文存放方便查询"},{"l":"B","t":"存在公共网盘靠密码保护"},{"l":"C","t":"打印出来锁进抽屉就行"},{"l":"D","t":"单独加密存储，只在必要流程里解密，其余场景只用脱敏形态"}],"a":["D"],"e":"加密是敏感数据的最后物理防线：即便某个环节被攻破，看到的是密文；日常流程用脱敏形态，明文只在必要环节短暂出现。密文加流程化解密，是敏感数据的双重防线。\n【干扰项】\nA：明文等于裸奔。明文存储等于没有任何防线。两者不能混为一谈。\nB：公共网盘不可控。公共网盘的访问边界完全失控。这一点要分清楚。\nC：纸质锁存不适用于在线系统。纸质方式管不住在线系统里的数据。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-005","d":7,"t":"multiple","q":"脱敏在隐私保护里的价值，正确的理解有哪些？","o":[{"l":"A","t":"很多场景只需要脱敏版本就能完成工作"},{"l":"B","t":"手机号打码、姓名留姓、证件留尾号，从源头减少敏感数据流通"},{"l":"C","t":"某评测系统把患者名统一成「客户」，既保护隐私又不影响评测"},{"l":"D","t":"脱敏之后数据就没有任何用途了"}],"a":["A","B","C"],"e":"脱敏的本质是减少暴露面：功能允许时优先用脱敏形态，敏感信息就不必在全链路流转，风险随暴露面一起缩小。脱敏是隐私保护里性价比最高的一招。\n【干扰项】\nD：脱敏数据仍支撑统计、评测等大量场景。去掉标识信息后，业务分析要用的字段大多还在。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-006","d":7,"t":"multiple","q":"数据采集坚持「最小化」，正确的做法有哪些？","o":[{"l":"A","t":"业务不需要的字段不采集"},{"l":"B","t":"用户没同意的信息不入库"},{"l":"C","t":"收集得越少，暴露面越小，合规负担也越轻"},{"l":"D","t":"先把能想到的全收进来，以后说不定有用"}],"a":["A","B","C"],"e":"最小化采集同时降低风险与成本：不用的不收、未授权的不收，某商城助手只存下单必需字段，又省资源又安全。采集最小化，是风险控制的第一道门。\n【干扰项】\nD：先收后用的思路把无谓的风险先背上了身。先收后用等于先把风险背上身。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-007","d":7,"t":"single","q":"数据访问必须留痕，最直接的价值是什么？","o":[{"l":"A","t":"日志只是给开发排错用的，与数据安全无关"},{"l":"B","t":"方便统计谁的鼠标点得多"},{"l":"C","t":"出安全事件时能顺着时间线定位到人和操作"},{"l":"D","t":"没有任何实际用途"}],"a":["C"],"e":"留痕既威慑也查证：谁、何时、看了哪块数据都有记录，异常发生时能完整还原链条，快速定位是哪一次操作、哪个环节。留痕让安全从承诺变成可查证。\n【干扰项】\nA：留痕首先是安全证据链，出事时定位到人靠的就是它，排错只是顺带用途。\nB：点击统计不是它的目的。留痕不服务于绩效统计。别把注意力放错了地方。\nD：它是事后追责与复盘的依据。它是追责与复盘的共同依据。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-008","d":7,"t":"single","q":"批量导出、批量删除、权限变更这类高风险操作，流程上应该怎么设计？","o":[{"l":"A","t":"信任员工，一点就执行"},{"l":"B","t":"设多级审批，关键节点必须有人确认"},{"l":"C","t":"让系统自动判断免审批"},{"l":"D","t":"谁提需求谁自己确认就行"}],"a":["B"],"e":"高风险动作不能一个人说了算：业务负责人加安全负责人双重审批这类设计，从流程上杜绝随意拷贝转发的漏洞，审批多一道风险低一分。多一道审批，就少一次失控。\n【干扰项】\nA：信任不等于免检，事故常出自善意失误。善意失误同样需要流程拦截。\nC：自动放行等于没有闸门。两者不能混为一谈。高风险动作的不可逆，决定了必须有人在场确认。\nD：单一自确认起不到制衡作用。单人确认起不到制衡作用。这一点要分清楚。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-009","d":7,"t":"multiple","q":"隐私「前置到设计阶段」，而不是上线前补丁，体现在哪些方面？","o":[{"l":"A","t":"哪些数据必要、谁能看见，在设计阶段就定下来"},{"l":"B","t":"默认是否隐藏、可否选择退出，写进产品交互"},{"l":"C","t":"前置做隐私成本低、漏洞少"},{"l":"D","t":"隐私是法务的事，开发不用管"}],"a":["A","B","C"],"e":"隐私前置的核心是当设计约束来做：功能定型时就定数据边界与交互，事后补救又慢又容易漏，成本也高。前置省下的是返工，换来的是安心。这是方法层的硬要求。\n【干扰项】\nD：边界要落在产品与代码里，仅靠法务落不了地。边界必须落在产品与代码里才真正有效。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-010","d":7,"t":"single","q":"普通用户问「能不能把客户经理那批合同发我」，系统正确的反应是什么？","o":[{"l":"A","t":"把合同内容直接发过去"},{"l":"B","t":"提示换个问法再试试"},{"l":"C","t":"识别出超范围请求，拒绝并友好引导"},{"l":"D","t":"假装没听见继续聊别的"}],"a":["C"],"e":"这是典型的越权套数据：上下文隔离要求每个用户只能看自己范围内的内容，一句话想套走别人数据，系统不能上当，拒绝之外还要给出路。拒绝加引导，防护才有温度。\n【干扰项】\nA：直接发送就是一次数据泄露。这一点要分清楚。范围外的数据一旦出手，再撤回也已经泄露出去了。\nB：教用户绕过等于帮助越权。两者不能混为一谈。正确的姿势是拒绝之后引导回其权限内的正当需求。\nD：回避不等于防护。回避不解决风险本身。两者不能混为一谈。别在这里浪费精力。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-011","d":7,"t":"multiple","q":"「红线清单」在内容安全里扮演什么角色？","o":[{"l":"A","t":"和业务一起把绝对不能生成、需要转人工、严格限定的内容写清楚"},{"l":"B","t":"红线写进系统，模型不越线自由发挥"},{"l":"C","t":"红线越明确，边界越清晰"},{"l":"D","t":"红线只写在内部备忘里，不用进系统"}],"a":["A","B","C"],"e":"红线清单是内容安全的第一道防线：把禁区明确成可执行的规则并写进系统，做到技术上生成不了，而不是靠口头希望。红线写进系统，才能从希望变成机制。\n【干扰项】\nD：不进系统的红线拦不住任何一次生成。备忘拦不住模型的输出环节，规则进了系统才算真防线。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-012","d":7,"t":"single","q":"用户在提问里塞指令，想命令系统忽略设定、输出内部数据，这种攻击叫什么、怎么防？","o":[{"l":"A","t":"正常提问，应该照做"},{"l":"B","t":"网络故障，重启即可"},{"l":"C","t":"无法防御，只能听天由命"},{"l":"D","t":"提示注入，系统要识别注入并守住自己的设定边界"}],"a":["D"],"e":"提示注入是针对生成式系统的典型攻击：恶意指令混在输入里试图劫持行为。防线是识别注入意图，指令设定优先级高于用户输入。守住指令设定的优先级，是防注入的关键。\n【干扰项】\nA：照做等于被劫持。照做等于把控制权交给攻击者。两者不能混为一谈。\nB：与网络无关。注入与网络故障完全无关。它不在本题的判断范围里。\nC：识别与防护机制是有效手段。这一点要分清楚。输入侧过滤加指令优先级设定，构成一整套现成的防线。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-013","d":7,"t":"multiple","q":"内容过滤要「输入输出两端都设卡」，正确理解有哪些？","o":[{"l":"A","t":"用户输入可能带攻击性或违规内容，先拦"},{"l":"B","t":"模型生成后再过一遍过滤，防跑偏"},{"l":"C","t":"两头都设卡，安全才有保障"},{"l":"D","t":"只管输出就足够了"}],"a":["A","B","C"],"e":"单侧防线总有缺口：输入侧拦住恶意提问，输出侧拦住漏网生成，两端闭环后违规内容被挡下的概率才足够高。两端设卡，安全才没有单点失效。理解这一点，后面的动作才顺。\n【干扰项】\nD：不管输入，恶意内容会直接进入生成环节。恶意提问一旦进了生成环节，输出侧的拦截就成了孤军。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-014","d":7,"t":"single","q":"越权防护做得好不好，最可靠的检验方式是什么？","o":[{"l":"A","t":"相信自己设计得没问题"},{"l":"B","t":"用不同身份、各种提问反复测试，把越权用例做成测试集持续跑"},{"l":"C","t":"等真实事故发生来验证"},{"l":"D","t":"看界面有没有权限按钮"}],"a":["B"],"e":"越权是动态守出来的：模拟各种角色与话术去试探，发现的漏洞修掉、用例入库反复回归，防线随测试一起持续演进。越权防线是测出来的，不是设完就有的。\n【干扰项】\nA：自信不能代替验证。自信代替不了验证。这点上没有商量余地。\nC：用事故验证代价太大。用事故验证的代价太大。这一点要分清楚。\nD：界面有按钮不等于逻辑挡得住。按钮只是展示层，真正的拦截发生在权限逻辑那一层。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-015","d":7,"t":"multiple","q":"内容分级管理中，对不同内容采用不同力度，正确做法有哪些？","o":[{"l":"A","t":"普通问答直接放行，敏感内容加限定，高危内容不生成转人工"},{"l":"B","t":"涉及未成年人的内容过滤标准从严"},{"l":"C","t":"力度跟着风险等级走，该严的严、该松的松"},{"l":"D","t":"所有内容一律按最高标准过滤"}],"a":["A","B","C"],"e":"分级管理的意义是资源匹配风险：一刀切的高压会造成过度拦截误伤体验，分级之后既守住高危又放行正常。力度跟着风险走，体验与安全才两全。\n【干扰项】\nD：一刀切会大量误伤正常对话，体验无法使用。一刀切高压会大量误伤正常对话。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-016","d":7,"t":"single","q":"防幻觉最有效的第一手段是什么？","o":[{"l":"A","t":"把回答写得更有感情"},{"l":"B","t":"让模型说得越快越好"},{"l":"C","t":"要求回答带出处：引用知识库的哪份文档哪一段，查不到出处宁可不说"},{"l":"D","t":"禁止用户提问"}],"a":["C"],"e":"讲理有据把幻觉压住：每条结论可回溯到原文，错误能核对、责任能界定。某行业问答系统规定查不到出处就不说，大部分幻觉直接没了出口。出处可查，可信才有落点。\n【干扰项】\nA：语气与真实性无关。它不在本题的判断范围里。说得再动听，编造的事实依然是编造的事实。\nB：速度不等于准确，快反而放大风险。求快反而放大错误的风险。\nD：堵住提问等于放弃功能。放弃功能不是治理思路。别把注意力放错了地方。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-017","d":7,"t":"single","q":"检索不到相关内容时，系统应该怎么做？","o":[{"l":"A","t":"根据常识编一个听起来合理的答案"},{"l":"B","t":"把最接近的内容硬套给用户"},{"l":"C","t":"换种说法糊弄过去"},{"l":"D","t":"老实说答不了，引导人工或给替代方案"}],"a":["D"],"e":"不懂装懂是幻觉的温床，敢于拒答才是安全选择。把「不知道就说不」立成规则，用户拿到的每个答案才可信，转出去的路径也保住了体验。拒答不是失败，而是安全设计的一部分。\n【干扰项】\nA：编造是典型幻觉行为。编造是幻觉的直接来源。这一点要分清楚。\nB：硬套等于答非所问。硬套与问题本身不对齐。两者不能混为一谈。\nC：糊弄迟早被识破，信任崩塌。糊弄迟早会穿帮。问题只会越拖越大。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-018","d":7,"t":"multiple","q":"一套完整的幻觉治理机制，通常包含哪些环节？","o":[{"l":"A","t":"引用溯源：结论标注出处"},{"l":"B","t":"拒答规则：拿不准就转人工"},{"l":"C","t":"输出侧校验：检查回答与引用原文是否一致"},{"l":"D","t":"高风险场景让模型放开自由发挥，反正有前三层兜底"}],"a":["A","B","C"],"e":"幻觉治理靠机制不靠运气：引用、拒答、输出校验、人工把关，防线层层叠加，漏网概率被压到最低。四层防线叠加，漏网概率被压到最低。这是整个环节的立足点。\n【干扰项】\nD：高风险场景恰恰要收紧边界，指望其他环节兜住自由发挥，等于主动放大风险。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-019","d":7,"t":"single","q":"「把参数调低就没有幻觉了」这个说法的问题在哪里？","o":[{"l":"A","t":"说法完全正确"},{"l":"B","t":"低参数只让输出更稳定，不能消除事实性错误，治理要靠机制"},{"l":"C","t":"应该把参数调到最高"},{"l":"D","t":"参数与幻觉毫无关系，随便调"}],"a":["B"],"e":"低参数减少的是随机发挥，不是事实错误。幻觉治理要靠引用、检索、校验、拒答这套机制组合，单拧一个参数是安慰剂。机制组合，才是治理幻觉的正道。\n【干扰项】\nA：这是典型误区。这是被反复验证过的误区。这一点要分清楚。别在这里浪费精力。\nC：调高会更发散，风险更大。调高参数会让输出更发散。后果会直接落在项目上。\nD：参数影响输出稳定性，但不是治理手段。参数只影响稳定性，不修正事实。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-020","d":7,"t":"single","q":"对涉及人身安全、财产安全、法律后果的高风险回答，正确的设计是什么？","o":[{"l":"A","t":"让模型大胆给结论显专业"},{"l":"B","t":"风险场景多答几遍总能答对"},{"l":"C","t":"把风险提示藏在长回答里"},{"l":"D","t":"直接设限：模型不给断言，只给提示或转人工，宁可保守"}],"a":["D"],"e":"风险越大边界越紧：高风险场景不做自由断言，模型只提供提示与引导，最终判断交给人。保守不是无能，是责任。风险等级越高，边界收得越紧。这也是实战反复验证过的规律。\n【干扰项】\nA：大胆断言等于把事故概率拉满。高风险场景一次错断言，后果就可能是人身或财产损失。\nB：重复作答不改变风险大小。后果会直接落在项目上。答一百次不会让错误答案变对，只是重复暴露在风险里。\nC：藏着提示等于没提示。提示藏起来等于没提示。两者不能混为一谈。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-021","d":7,"t":"multiple","q":"生成式服务在国内法规语境下的两个关键合规动作是什么？","o":[{"l":"A","t":"具有相应属性的服务依法履行算法备案等手续"},{"l":"B","t":"深度合成生成的图片音视频按规定作出标识"},{"l":"C","t":"备案由客户全权负责，交付方不用过问"},{"l":"D","t":"标识可有可无，看客户喜好"}],"a":["A","B"],"e":"备案与标识是两条硬要求：前者让算法可被监管，后者让用户知道内容由机器生成。交付时还要把责任主体提前和客户确认清楚。这两条是国内合规动作里最常被核查的两项。\n【干扰项】\nC：责任主体要确认，但交付方有协同义务，不能完全不管。责任要双方确认，交付方有协同义务。\nD：标识是规定要求，不是可选项。标识是规定动作，没有可选项。别把注意力放错了地方。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-022","d":7,"t":"single","q":"个人信息场景的三个必做动作是什么？","o":[{"l":"A","t":"告知、同意、可撤回"},{"l":"B","t":"收集、存储、变现"},{"l":"C","t":"加密、备份、外发"},{"l":"D","t":"标注、脱敏、出售"}],"a":["A"],"e":"用大白话告知收什么、用来做什么；给用户选择权能拒绝；要求删除时连副本一起删干净。三个动作贯穿设计，个人信息保护才是体验而非口号。三件事缺一件，用户对产品的信任就塌一角。\n【干扰项】\nB：变现不是必做动作，外发触碰红线。外发变现触碰合规红线。别把注意力放错了地方。\nC：加密备份是对的，但题目问的是面向用户的动作三件套。技术动作是另一套，此题问的是面向用户的。\nD：出售个人信息是违法行为。这一点要分清楚。这套组合把保护动作和违法动作混在了一起。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-023","d":7,"t":"single","q":"知识库数据的「来源合法」底线是什么？","o":[{"l":"A","t":"网上的内容都可以直接搬"},{"l":"B","t":"竞争对手的资料拿来做对比很正常"},{"l":"C","t":"有版权的内容要获得授权，含隐私的要脱敏，涉密的信息不得使用"},{"l":"D","t":"来源不重要，答得出就行"}],"a":["C"],"e":"来路不清是合规的最大隐患：版权要授权、隐私要脱敏、涉密不碰，数据来源可溯源可说明，出任何问题才说得清、扛得住。来源可说明，是数据合规的底线。\n【干扰项】\nA：直接搬运可能侵权。直接搬运有侵权风险。后果会直接落在项目上。\nB：获取手段不正当本身就违规。这一点要分清楚。未经授权获取他人商业资料，本身就是合规事故。\nD：来源不合法，答案再好也不能用。数据一旦被追责，说不清来路的材料就是现成的漏洞。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-024","d":7,"t":"multiple","q":"关于生成内容的知识产权与责任边界，正确的做法有哪些？","o":[{"l":"A","t":"生成内容版权归属、引用第三方素材是否侵权，在合同与方案里提前安排"},{"l":"B","t":"模型提供方、应用开发方、客户各自担什么责写清楚"},{"l":"C","t":"知识产权是事前谈的，不是出事后补的"},{"l":"D","t":"责任全部推给客户承担"}],"a":["A","B","C"],"e":"权责前置是专业：版权归属、素材合规、责任分工写进合同，出了问题才知道找谁、怎么处理，这是对双方的负责。权责前置，是对双方的真正保护。这条原则要贯穿交付全程。\n【干扰项】\nD：单方面甩责条款既不公平也未必有效。甩责条款既不公平也未必有效。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-025","d":7,"t":"single","q":"监管问询时，能证明你「做对了」的底气来自什么？","o":[{"l":"A","t":"平时留痕齐备：备案信息、处理记录、处置日志，按清单就能调出来"},{"l":"B","t":"口才好，现场发挥"},{"l":"C","t":"临时补写材料应付过去"},{"l":"D","t":"请客吃饭搞好关系"}],"a":["A"],"e":"留痕是合规的证明：记录真实存在、随时可调，问询就是一次例行沟通；没有记录，等于没做过，临时补写经不起核对。材料在、口径对，问询就是例行沟通。\n【干扰项】\nB：表达代替不了证据。这一点要分清楚。别在这里浪费精力。监管要看的是记录本身，现场发挥再多也变不出材料。\nC：补写材料时间口径对不上，风险更大。临时补写的口径经不起核对。\nD：关系替代不了合规事实。这一点要分清楚。问询核对的是处理记录，饭桌上拉不出来的东西就是没有。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-026","d":7,"t":"multiple","q":"让合规「持续运转」而不是一次达标，正确的动作有哪些？","o":[{"l":"A","t":"法规更新后同步调整产品，设计时留出标识与规则的调整余地"},{"l":"B","t":"定期合规自查，逐项对照最新要求补差距"},{"l":"C","t":"团队定期培训，把新要求传达到位"},{"l":"D","t":"上线时达标一次就永久有效"}],"a":["A","B","C"],"e":"合规是动态的：法规在细化、产品在迭代，留余量、常自查、勤培训，状态才不会漂移。把这三个动作排进固定节奏，合规才能长期在线。合规跟着法规与产品一起动，状态才不漂移。\n【干扰项】\nD：一次达标会随法规与产品变化失效。不持续跟进的合规状态，会从达标悄悄漂成不达标。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-027","d":7,"t":"single","q":"遇到拿不准的合规边界，正确的处理方式是什么？","o":[{"l":"A","t":"按对自己有利的方式解释"},{"l":"B","t":"先问再动手：找法务或专业机构问清楚，宁可多问一句"},{"l":"C","t":"先上线，被监管再说"},{"l":"D","t":"私下问同行抄他们的做法"}],"a":["B"],"e":"合规规则细且边界有时模糊，拿不准就问专业的人。多问不丢人，出问题才丢人；自我有利解释与侥幸上线都是在赌运气。多问一句，省下的是整改的大成本。\n【干扰项】\nA：有利解释不等于合规事实。自我有利解释不等于合规事实。两者不能混为一谈。\nC：先斩后奏的整改代价远高于事前一问。先斩后奏的代价远高于事前一问。\nD：同行的做法未必适用于你的场景。抄来的结论不经自己场景检验，风险照样落回自己头上。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-028","d":7,"t":"single","q":"与客户合作时，把合规责任写进合同至少要写清哪三件事？","o":[{"l":"A","t":"数据怎么处理、谁来负责、出了问题怎么响应"},{"l":"B","t":"价格、工期、违约金"},{"l":"C","t":"logo 放哪里、宣传怎么写"},{"l":"D","t":"合规条款照搬模板，不结合数据处理实际场景"}],"a":["A"],"e":"数据处理写明授权范围与用途限制，责任写明各方义务归属，响应写明事件通报时限与配合义务。条款清楚，后面才不会互相推诿。条款写清楚，责任才不会悬空。\n【干扰项】\nB：商务条款重要，但题目问的是合规责任三件事。数据处理、责任归属与事件响应，才是这题的落点。\nC：品牌细节不是合规责任的核心。合同里真正防风险的条款，落在数据处理与责任响应上。\nD：照搬通用模板不结合数据处理实际，条款对不上真实风险点，责任仍然悬空。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-029","d":7,"t":"multiple","q":"涉及第三方与跨境的数据场景，正确的姿态有哪些？","o":[{"l":"A","t":"第三方接触数据要签保护协议，明确能碰什么、用完怎么销毁"},{"l":"B","t":"数据出境前按管理要求做评估与申报，能本地处理就留在本地"},{"l":"C","t":"外部接口回传的内容同样纳入安全把关"},{"l":"D","t":"跨境数据先传出去，被问到再补手续"}],"a":["A","B","C"],"e":"外部与跨境是最容易出漏洞的两条线：协议兜住第三方，评估申报管住出境，第三方内容并入统一过滤，三步都不省。外部与跨境两条线，都要提前设卡。\n【干扰项】\nD：先传后补是违规操作，风险不可逆。数据一旦出境就收不回来，事前评估申报这道关省不得。","s":"自编-TCFDE-2026-09"},{"id":"TF-D7-030","d":7,"t":"multiple","q":"把合规做扎实，会带来哪些实际回报？","o":[{"l":"A","t":"客户敢把要紧的数据和业务托付，信任立得住"},{"l":"B","t":"在同行普遍马虎时形成差异化加分"},{"l":"C","t":"应对监管问询从容，不慌不乱"},{"l":"D","t":"可以无视法规自行其是"}],"a":["A","B","C"],"e":"合规不是成本是底牌：信任、差异化、从容应对，都是做扎实之后的自然回报，交付也走得久走得稳。合规做实了，就成了竞争的底牌。把它记牢，落地就不会跑偏。\n【干扰项】\nD：合规的意义恰恰是守住法规边界，与无视相反。合规恰是守住边界，与无视相反。","s":"自编-TCFDE-2026-09"}];

<script>

/* ================================================================
   ===================== 题库数据（构建注入 QUIZ_META + QUIZ_QUESTIONS） ================
   ================================================================ */
const QUESTIONS = QUIZ_QUESTIONS;
const META = (typeof QUIZ_META !== 'undefined' && QUIZ_META) ? QUIZ_META : {};
const EXAM = META.exam || 'QUIZ';
const LS_PREFIX = META.lsPrefix || EXAM.toLowerCase();

const GLOSSARY = META.glossary || {};

function getGlossaryForQuestion(q) {
  const texts = [q.q];
  if(q.o && Array.isArray(q.o)) q.o.forEach(o => texts.push(o.t));
  if(q.e) texts.push(q.e);
  const fullText = texts.join(' ');
  const found = [];
  const sorted = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
  for(const term of sorted) {
    if(fullText.includes(term)) found.push({term, def: GLOSSARY[term]});
  }
  return found;
}

/* ================================================================
   ===================== 术语高亮 + 弹定义 ================
   ================================================================ */
// 长词优先排序，独立 token 边界匹配，避免 EBS 误标 Amazon EBS 中的 EBS 等
function getGlossarySortedKeys() {
  return Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
}

// 判断术语在文本中是否为独立出现（前后非字母/数字）
function isIndependentToken(text, idx, term) {
  const before = text[idx-1];
  const after = text[idx + term.length];
  const isLetter = c => c && /[A-Za-z0-9]/.test(c);
  return !isLetter(before) && !isLetter(after);
}

// 将解析正文中的术语高亮为可点击 span，返回 HTML
function fmtExp(s){ let t=(s===undefined||s===null)?'':String(s); t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); t=t.replace(/\n/g,'<br>'); t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); return t; }
function highlightGlossaryTerms(text) {
  if(!text) return text;
  const sortedKeys = getGlossarySortedKeys();
  let result = '';
  let i = 0;
  while(i < text.length) {
    let matched = false;
    for(const term of sortedKeys) {
      if(!term) continue;
      const idx = text.indexOf(term, i);
      if(idx === i && isIndependentToken(text, idx, term)) {
        const def = GLOSSARY[term] || '（暂无定义）';
        const termEsc = term.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const defEsc = def.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        result += `<span class="gloss-term" onclick="showGlossTip(event,'${termEsc}','${defEsc}')">${term}</span>`;
        i += term.length;
        matched = true;
        break;
      }
    }
    if(!matched) {
      // 中文等宽字符直接输出，保持原文本
      result += text[i];
      i++;
    }
  }
  return result;
}

// 点击术语弹出定义浮层
function showGlossTip(e, term, def) {
  e.stopPropagation();
  const tip = document.getElementById('glossTip');
  document.getElementById('glossTipTerm').textContent = term;
  document.getElementById('glossTipDef').textContent = def || '（暂无定义）';
  tip.style.display = 'block';
  // 定位：优先在点击位置下方，避免超出视口
  const pad = 12;
  let left = e.clientX + pad;
  let top = e.clientY + pad;
  // 先渲染再量尺寸
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if(left + tw > window.innerWidth - 8) left = e.clientX - tw - pad;
  if(top + th > window.innerHeight - 8) top = e.clientY - th - pad;
  if(left < 8) left = 8;
  if(top < 8) top = 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

function closeGlossTip() {
  document.getElementById('glossTip').style.display = 'none';
}

// 点击页面其它区域关闭浮层
document.addEventListener('click', function(e) {
  const tip = document.getElementById('glossTip');
  if(tip && tip.style.display === 'block' && !tip.contains(e.target)) {
    closeGlossTip();
  }
});

// 按 Esc 关闭浮层
document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') closeGlossTip();
});

/* ================================================================
   ===================== localStorage 操作 =========================
   ================================================================ */
const LS_ANSWERS = LS_PREFIX + '_answers';
const LS_WRONG   = LS_PREFIX + '_wrong';
const LS_PROGRESS = LS_PREFIX + '_progress';

function getAnswers() { return JSON.parse(localStorage.getItem(LS_ANSWERS)||'[]'); }
function setAnswers(a) { localStorage.setItem(LS_ANSWERS,JSON.stringify(a)); }
function getWrong() { return JSON.parse(localStorage.getItem(LS_WRONG)||'[]'); }
function setWrong(w) { localStorage.setItem(LS_WRONG,JSON.stringify(w)); }
function getProgress() { return JSON.parse(localStorage.getItem(LS_PROGRESS)||'{}'); }
function setProgress(p) { localStorage.setItem(LS_PROGRESS,JSON.stringify(p)); }

/* ----------------------------------------------------------------
   作答记录：会话态 / 累计统计态分离（修复）
   旧缺陷：模拟考核误读全局 localStorage 历史 → 进场即显示「已答对/曾答错」、
   题号导航提前染色、成绩单把练习与往场算进本次（实测正确数>题数、未答为负、
   分数超满分、正确率>100%）。
   三态口径：
     · sessionResults()       本场逐题作答（quizState.results）＝「本次」唯一真源
     · sessionScopedAnswers() 视图用作答集：考核=仅本场；练习模式=全局历史（原行为）
     · recordAnswer()         仍写全局 store → 错题集与统计口径不变
   ---------------------------------------------------------------- */
function sessionResults() {
  const r = (quizState && quizState.results) || {};
  return Object.keys(r).map(id => ({id, ua:r[id].ua, ok:r[id].ok, ts:r[id].ts}));
}
function sessionScopedAnswers() {
  return (quizState && quizState.mode === 'exam') ? sessionResults() : getAnswers();
}

function recordAnswer(qId, userAnswer, isCorrect) {
  const answers = getAnswers();
  answers.push({id:qId,ua:userAnswer,ok:isCorrect,ts:Date.now()});
  setAnswers(answers);
  const wrong = getWrong();
  const idx = wrong.findIndex(w=>w.id===qId);
  if(!isCorrect) {
    if(idx>=0) { wrong[idx].count++; wrong[idx].last=Date.now(); }
    else { wrong.push({id:qId,count:1,last:Date.now(),mastered:false}); }
  }
  setWrong(wrong);
}

function markMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=true;
  setWrong(wrong);
}
function unmarkMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=false;
  setWrong(wrong);
}
function removeWrong(qId) {
  setWrong(getWrong().filter(x=>x.id!==qId));
}

/* ================================================================
   ===================== 辅助函数 =================================
   ================================================================ */
const DOMAIN_NAMES = META.domains || {};
const DOMAIN_WEIGHTS = META.weights || {};
const DOMAIN_KEYS = Object.keys(DOMAIN_NAMES).map(Number).sort((a,b)=>a-b);
const EXAM_P = META.examParams || {};
const EXAM_COUNT = EXAM_P.count || 50;
const EXAM_MIN = EXAM_P.minutes || 60;
const EXAM_PASS = EXAM_P.pass || 700;
const TYPE_NAMES = {single:'单选题',multiple:'多选题',hot:'拖拽题'};

function getQById(id) { return QUESTIONS.find(q=>q.id===id); }
function shuffle(arr) { const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function generateShuffledOptions(questions) {
  const opts = {};
  const newAnswers = {};
  questions.forEach(q => {
    if(q.t==='single'||q.t==='multiple') {
      const shuffled = shuffle([...q.o]);
      const labels = 'ABCDEFGHIJ';
      const relabeled = shuffled.map((item, i) => ({l: labels[i], t: item.t}));
      opts[q.id] = relabeled;
      const contentToNewLabel = {};
      relabeled.forEach(item => { contentToNewLabel[item.t] = item.l; });
      newAnswers[q.id] = q.a.map(oldL => {
        const oldItem = q.o.find(o => o.l === oldL);
        return oldItem ? contentToNewLabel[oldItem.t] : oldL;
      });
    }
  });
  return { opts, newAnswers };
}

function getStats() {
  const answers = getAnswers();
  const wrong = getWrong();
  const totalCorrect = answers.filter(a=>a.ok).length;
  const totalAnswered = answers.length;
  const acc = totalAnswered ? Math.round(totalCorrect/totalAnswered*100) : 0;
  const doneIds = [...new Set(answers.map(a=>a.id))];
  const completion = Math.round(doneIds.length/QUESTIONS.length*100);
  const domainStats = {};
  for(const d of DOMAIN_KEYS) {
    const dQIds = QUESTIONS.filter(q=>q.d===d).map(q=>q.id);
    const dAnswers = answers.filter(a=>dQIds.includes(a.id));
    const dCorrect = dAnswers.filter(a=>a.ok).length;
    const dTotal = dAnswers.length;
    domainStats[d] = {
      total:dQIds.length, answered:dTotal, correct:dCorrect,
      acc: dTotal ? Math.round(dCorrect/dTotal*100) : 0
    };
  }
  const typeStats = {};
  for(const t of ['single','multiple']) {
    const tQIds = QUESTIONS.filter(q=>q.t===t).map(q=>q.id);
    const tAnswers = answers.filter(a=>tQIds.includes(a.id));
    const tCorrect = tAnswers.filter(a=>a.ok).length;
    const tTotal = tAnswers.length;
    typeStats[t] = { answered:tTotal, correct:tCorrect, acc: tTotal ? Math.round(tCorrect/tTotal*100) : 0 };
  }
  const recentWrong = wrong.filter(w=>!w.mastered).sort((a,b)=>b.last-a.last).slice(0,5);
  const recent = answers.slice(-20).reverse();
  let streak = 0;
  for(const a of recent) { if(a.ok) streak++; else break; }
  return {totalCorrect,totalAnswered,acc,completion,domainStats,typeStats,recentWrong,streak,doneIds:doneIds.length};
}

let currentPage = 'dashboard';

function renderDashboard() {
