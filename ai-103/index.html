  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if(left + tw > window.innerWidth - 8) left = e.clientX - tw - pad;
  if(top + th > window.innerHeight - 8) top = e.clientY - th - pad;
  if(left < 8) left = 8;
  if(top < 8) top = 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

function closeGlossTip() {
  document.getElementById('glossTip').style.display = 'none';
}

// 点击页面其它区域关闭浮层
document.addEventListener('click', function(e) {
  const tip = document.getElementById('glossTip');
  if(tip && tip.style.display === 'block' && !tip.contains(e.target)) {
    closeGlossTip();
  }
});

// 按 Esc 关闭浮层
document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') closeGlossTip();
});

/* ================================================================
   ===================== localStorage 操作 =========================
   ================================================================ */
const LS_ANSWERS = LS_PREFIX + '_answers';
const LS_WRONG   = LS_PREFIX + '_wrong';
const LS_PROGRESS = LS_PREFIX + '_progress';

function getAnswers() { return JSON.parse(localStorage.getItem(LS_ANSWERS)||'[]'); }
function setAnswers(a) { localStorage.setItem(LS_ANSWERS,JSON.stringify(a)); }
function getWrong() { return JSON.parse(localStorage.getItem(LS_WRONG)||'[]'); }
function setWrong(w) { localStorage.setItem(LS_WRONG,JSON.stringify(w)); }
function getProgress() { return JSON.parse(localStorage.getItem(LS_PROGRESS)||'{}'); }
function setProgress(p) { localStorage.setItem(LS_PROGRESS,JSON.stringify(p)); }

/* ----------------------------------------------------------------
   作答记录：会话态 / 累计统计态分离（修复）
   旧缺陷：模拟考核误读全局 localStorage 历史 → 进场即显示「已答对/曾答错」、
   题号导航提前染色、成绩单把练习与往场算进本次（实测正确数>题数、未答为负、
   分数超满分、正确率>100%）。
   三态口径：
     · sessionResults()       本场逐题作答（quizState.results）＝「本次」唯一真源
     · sessionScopedAnswers() 视图用作答集：考核=仅本场；练习模式=全局历史（原行为）
     · recordAnswer()         仍写全局 store → 错题集与统计口径不变
   ---------------------------------------------------------------- */
function sessionResults() {
  const r = (quizState && quizState.results) || {};
  return Object.keys(r).map(id => ({id, ua:r[id].ua, ok:r[id].ok, ts:r[id].ts}));
}
function sessionScopedAnswers() {
  return (quizState && quizState.mode === 'exam') ? sessionResults() : getAnswers();
}

function recordAnswer(qId, userAnswer, isCorrect) {
  const answers = getAnswers();
  answers.push({id:qId,ua:userAnswer,ok:isCorrect,ts:Date.now()});
  setAnswers(answers);
  const wrong = getWrong();
  const idx = wrong.findIndex(w=>w.id===qId);
  if(!isCorrect) {
    if(idx>=0) { wrong[idx].count++; wrong[idx].last=Date.now(); }
    else { wrong.push({id:qId,count:1,last:Date.now(),mastered:false}); }
  }
  setWrong(wrong);
}

function markMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=true;
  setWrong(wrong);
}
function unmarkMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=false;
  setWrong(wrong);
}
function removeWrong(qId) {
  setWrong(getWrong().filter(x=>x.id!==qId));
}

/* ================================================================
   ===================== 辅助函数 =================================
   ================================================================ */
const DOMAIN_NAMES = META.domains || {};
const DOMAIN_WEIGHTS = META.weights || {};
const DOMAIN_KEYS = Object.keys(DOMAIN_NAMES).map(Number).sort((a,b)=>a-b);
const EXAM_P = META.examParams || {};
const EXAM_COUNT = EXAM_P.count || 50;
const EXAM_MIN = EXAM_P.minutes || 60;
const EXAM_PASS = EXAM_P.pass || 700;
const TYPE_NAMES = {single:'单选题',multiple:'多选题',hot:'拖拽题'};

// 走全集：模考池题目不在练习池里，但模考错题会进错题集，取题必须能取到
function getQById(id) { return QUIZ_QUESTIONS.find(q=>q.id===id); }
function shuffle(arr) { const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function generateShuffledOptions(questions) {
  const opts = {};
  const newAnswers = {};
  questions.forEach(q => {
    if(q.t==='single'||q.t==='multiple') {
      const shuffled = shuffle([...q.o]);
      const labels = 'ABCDEFGHIJ';
      const relabeled = shuffled.map((item, i) => ({l: labels[i], t: item.t}));
      opts[q.id] = relabeled;
      const contentToNewLabel = {};
      relabeled.forEach(item => { contentToNewLabel[item.t] = item.l; });
      newAnswers[q.id] = q.a.map(oldL => {
        const oldItem = q.o.find(o => o.l === oldL);
        return oldItem ? contentToNewLabel[oldItem.t] : oldL;
      });
    }
  });
  return { opts, newAnswers };
}

function getStats() {
  const answers = getAnswers();
  const wrong = getWrong();
  const totalCorrect = answers.filter(a=>a.ok).length;
  const totalAnswered = answers.length;
  const acc = totalAnswered ? Math.round(totalCorrect/totalAnswered*100) : 0;
  const doneIds = [...new Set(answers.map(a=>a.id))];
  const completion = Math.round(doneIds.length/QUESTIONS.length*100);
  const domainStats = {};
  for(const d of DOMAIN_KEYS) {
    const dQIds = QUESTIONS.filter(q=>q.d===d).map(q=>q.id);
    const dAnswers = answers.filter(a=>dQIds.includes(a.id));
    const dCorrect = dAnswers.filter(a=>a.ok).length;
    const dTotal = dAnswers.length;
    domainStats[d] = {
      total:dQIds.length, answered:dTotal, correct:dCorrect,
      acc: dTotal ? Math.round(dCorrect/dTotal*100) : 0
    };
  }
  const typeStats = {};
  for(const t of ['single','multiple']) {
    const tQIds = QUESTIONS.filter(q=>q.t===t).map(q=>q.id);
    const tAnswers = answers.filter(a=>tQIds.includes(a.id));
    const tCorrect = tAnswers.filter(a=>a.ok).length;
    const tTotal = tAnswers.length;
    typeStats[t] = { answered:tTotal, correct:tCorrect, acc: tTotal ? Math.round(tCorrect/tTotal*100) : 0 };
  }
  const recentWrong = wrong.filter(w=>!w.mastered).sort((a,b)=>b.last-a.last).slice(0,5);
  const recent = answers.slice(-20).reverse();
  let streak = 0;
  for(const a of recent) { if(a.ok) streak++; else break; }
  return {totalCorrect,totalAnswered,acc,completion,domainStats,typeStats,recentWrong,streak,doneIds:doneIds.length};
}

/* ================================================================
   ===================== 页面渲染 =================================
   ================================================================ */
let currentPage = 'dashboard';
let quizState = null;

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el = document.getElementById('page-'+page);
  if(el) el.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  if(page==='dashboard') renderDashboard();
  else if(page==='quiz') renderQuiz();
  else if(page==='wrongbook') renderWrongBook();
  else if(page==='stats') renderStats();
  else if(page==='settings') renderSettings();
}

function renderDashboard() {
  const s = getStats();
  const el = document.getElementById('page-dashboard');
  let html = `<div class="header"><h1>${EXAM} 刷题工具</h1><button class="theme-btn" onclick="toggleTheme()">${document.getElementById('quizView').classList.contains('dark')?'☀️':'🌙'}</button></div>`;
  html += `<div class="stats-grid">
    <div class="stat-card"><div class="stat-num">${s.doneIds}/${QUESTIONS.length}</div><div class="stat-label">已做题量</div></div>
    <div class="stat-card"><div class="stat-num">${s.acc}%</div><div class="stat-label">总正确率</div></div>
    <div class="stat-card"><div class="stat-num">${s.completion}%</div><div class="stat-label">完成度</div></div>
    <div class="stat-card"><div class="stat-num">${s.streak}</div><div class="stat-label">连续正确</div></div>
  </div>`;
  html += `<div class="domain-grid">`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<div class="domain-card" onclick="startDomain(${d})">
      <div class="d-name">Domain ${d}: ${DOMAIN_NAMES[d]}</div>
      <div class="d-weight">权重 ${DOMAIN_WEIGHTS[d]} | 共${ds.total}题</div>
      <div class="d-bar"><div class="d-bar-fill" style="width:${ds.acc}%"></div></div>
      <div class="d-pct">${ds.answered?ds.acc+'%正确率':'未作答'}</div>
    </div>`;
  }
  html += `</div>`;
  html += `<div class="action-btns">
    <button class="btn-primary" onclick="startContinue()">📝 继续练习</button>
    <button class="btn-primary" onclick="startWrongReview()" style="background:var(--wrong)">🔄 错题重练 (${s.recentWrong.length}题待复习)</button>
    <button class="btn-primary" onclick="startExam()" style="background:var(--correct);color:#fff">📋 模拟考核（${EXAM_COUNT}题/${EXAM_MIN}分钟/${EXAM_PASS}分及格）</button>` + (MOCK_QUESTIONS.length ? `
    <button class="btn-primary" onclick="startRealExam()" style="background:#7c3aed;color:#fff">🎯 全真模考（${MOCK_QUESTIONS.length}题 · ${MOCK_SCORED.size}题计分 / ${EXAM_MIN}分钟）</button>` : '') + `
  </div>`;
  if(s.recentWrong.length) {
    html += `<div class="recent-wrong"><h3>❌ 最近错题</h3><ul>`;
    s.recentWrong.forEach(w=>{
      const q = getQById(w.id);
      if(q) html += `<li onclick="startSingle('${w.id}')">Domain ${q.d} | ${q.q.slice(0,30)}… | 答错${w.count}次</li>`;
    });
    html += `</ul></div>`;
  }
  html += `<div class="footer-note">${META.footerNote || '题库来源：第三方中文整理，以 AWS 官方材料为准'}</div>`;
  el.innerHTML = html;
}

function renderQuiz() {
  const el = document.getElementById('page-quiz');
  if(!quizState || !quizState.questions.length) {
    el.innerHTML = `<div class="header"><button class="back-btn" onclick="navigate('dashboard')">←</button><h1>刷题</h1></div>
    <p style="text-align:center;margin-top:60px;color:var(--text2)">暂无题目，请从仪表盘选择模式开始练习</p>`;
    return;
  }
  const q = quizState.questions[quizState.currentIdx];
  const isHot = q.t === 'hot';
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  // 考核=仅本场作答；练习模式=全局历史（含本场）——防练习记录串进考核视图
  const answers = sessionScopedAnswers();
  const prevAnswers = answers.filter(a=>a.id===q.id);
  const everCorrect = prevAnswers.some(a=>a.ok);
  const everWrong = prevAnswers.some(a=>!a.ok);
  const answered = quizState.answered || {};
  let userAns = answered[q.id];
  const finished = quizState.submitted && quizState.submitted[q.id];
  const correct = finished && isAnswerCorrect(q, userAns);

  let modeLabel = quizState.mode==='exam'?'📋 模拟考核':quizState.mode==='wrong'?'❌ 错题重练':quizState.mode==='domain'?'📖 章节练习':quizState.mode==='single'?'📝 单题练习':'📝 顺序练习';

  let html = `<div class="quiz-header">
    <button class="back-btn" onclick="exitQuiz()">←</button>
    <span style="font-weight:600;font-size:15px">${modeLabel}</span>
    ${quizState.mode==='exam'?`<span class="timer" id="quizTimer"></span>`:''}
    <span class="quiz-progress">${quizState.currentIdx+1}/${quizState.questions.length}</span>
  </div>`;
  html += `<div class="quiz-meta">
    <span class="domain-tag">Domain ${q.d}</span>
    <span>${DOMAIN_NAMES[q.d]}</span>
    <span>${TYPE_NAMES[q.t]}</span>
    ${everCorrect?'<span style="background:rgba(6,214,160,.15);color:var(--correct)">已答对</span>':''}
    ${everWrong?'<span style="background:rgba(239,71,111,.15);color:var(--wrong)">曾答错</span>':''}
  </div>`;
  html += `<div class="question-text">${q.q}</div>`;

  const renderOpts = getOptionsHTML(q, userAns, finished, correct, getShuffledAnswer(q));
  html += renderOpts;

  if(isHot) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?'▶ 完成返回':'▶ 下一题'}</button>
    </div>`;
  } else if(!finished) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>✅ 确认</button>
    </div>`;
  } else {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?(quizState.mode==='exam'?'📊 交卷查看成绩':'▶ 完成返回'):'▶ 下一题'}</button>
    </div>`;
  }

  if(finished) {
    const badge = correct ? '✅ 回答正确!' : '❌ 回答错误';
    const cls = correct ? 'correct' : 'wrong';
    const gItems = getGlossaryForQuestion(q);
    let gHtml = '';
    if(gItems.length) {
      gHtml = '<div class="glossary"><div class="glossary-title">词汇附录</div>';
      gItems.forEach(g => {
        gHtml += '<div class="glossary-item"><span class="glossary-term">' + g.term + '</span><span class="glossary-def">\u00a0\u2014\u00a0' + g.def.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span></div>';
      });
      gHtml += '</div>';
    }
    html += `<div class="explanation show">
      <div class="result-badge ${cls}">${badge}</div>
      <div class="exp-text"><strong>正确答案：</strong>${formatAnswer(q)}</div>
      <div class="exp-text" style="margin-top:8px"><strong>解析：</strong>${highlightGlossaryTerms(fmtExp(q.e))}</div>
      ${q.s?`<div class="exp-source">来源：${q.s}</div>`:''}
      ${gHtml}
    </div>`;
  }

  html += `<div class="qnav"><h4>题号导航</h4><div class="qnav-grid">`;
  quizState.questions.forEach((qq, i) => {
    const qAnswers = answers.filter(a=>a.id===qq.id);
    const qCor = qAnswers.some(a=>a.ok);
    const qWro = qAnswers.some(a=>!a.ok);
    let cls = '';
    if(i===quizState.currentIdx) cls='current';
    else if(qCor) cls='done-correct';
    else if(qWro) cls='done-wrong';
    html += `<div class="qnav-item ${cls}" onclick="jumpToQuestion(${i})">${i+1}</div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
  if(!finished) updateSubmitButton();
}

function getOptionsHTML(q, userAns, finished, correct, shuffledAns) {
  let html = '';
  const qtype = q.t;
  if(qtype === 'hot') {
    html += `<div class="options-list" style="background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:16px">
      <div style="font-weight:600;color:var(--primary);margin-bottom:8px">🖱 本题为拖拽/操作题（HOTSPOT）</div>
      <div style="font-size:13px;line-height:1.7;color:var(--text2)">本题无标准 A/B/C/D 选项，答题形式为图形拖拽/区域选择。题目与图形见源 PDF 原图，答案请参照源文件。</div>`;
    if(q.e) {
      html += `<div style="margin-top:10px;font-size:13px;line-height:1.7;color:var(--text2);border-top:1px solid var(--border);padding-top:10px"><strong>解析/提示：</strong><br>${highlightGlossaryTerms(fmtExp(q.e))}</div>`;
    }
    html += `</div>`;
    return html;
  }
  if(qtype === 'single' || qtype === 'multiple') {
    const isMulti = qtype === 'multiple';
    html += `<div class="options-list">`;
    const opts = quizState.shuffledOptions && quizState.shuffledOptions[q.id] ? quizState.shuffledOptions[q.id] : q.o;
    opts.forEach(o => {
      const isSelected = userAns && userAns.includes(o.l);
      let cls = 'option-item';
      if(isMulti) cls += ' multi';
      if(isSelected && !finished) cls += ' selected';
      if(finished) {
        if(shuffledAns.includes(o.l)) cls += ' correct';
        else if(isSelected) cls += ' wrong';
      }
      const onclick = finished ? '' : `toggleOption('${o.l}')`;
      html += `<div class="${cls}" onclick="${onclick}">
        <span class="opt-label">${o.l}</span>
        <span>${o.t}</span>
      </div>`;
    });
    html += `</div>`;
    if(isMulti && !finished) html += `<div style="font-size:13px;color:var(--text2);margin-top:-12px;margin-bottom:16px">多选——请选择所有正确答案后提交（至少选 2 项）</div>`;
  }
  return html;
}

/* ================================================================
   ===================== 交互逻辑 =================================
   ================================================================ */

function toggleOption(label) {
  const q = quizState.questions[quizState.currentIdx];
  if(!quizState.answered) quizState.answered = {};
  if(q.t==='single') {
    quizState.answered[q.id] = [label];
  } else {
    const arr = quizState.answered[q.id] || [];
    const idx = arr.indexOf(label);
    if(idx>=0) arr.splice(idx,1);
    else arr.push(label);
    quizState.answered[q.id] = arr;
  }
  renderQuiz();
}

function updateSubmitButton() {
  const q = quizState.questions[quizState.currentIdx];
  if(q.t === 'hot') return;
  const ans = quizState.answered && quizState.answered[q.id];
  const btn = document.getElementById('submitBtn');
  if(!btn) return;
  if(q.t==='single') btn.disabled = !ans || !ans.length;
  else if(q.t==='multiple') btn.disabled = !ans || ans.length < 2;
}

function getShuffledAnswer(q) {
  if(quizState && quizState.shuffledAnswers && quizState.shuffledAnswers[q.id]) {
    return quizState.shuffledAnswers[q.id];
  }
  return q.a;
}

function isAnswerCorrect(q, userAns) {
  if(!userAns) return false;
  const ca = getShuffledAnswer(q);
  if(q.t==='single') return userAns[0]===ca[0];
  if(q.t==='multiple') { const a=[...userAns].sort(); const b=[...ca].sort(); return JSON.stringify(a)===JSON.stringify(b); }
  return false;
}

function formatAnswer(q) {
  const ca = getShuffledAnswer(q);
  if(q.t==='single'||q.t==='multiple') return ca.join(', ');
  if(q.t==='hot') return '本题为拖拽/操作题，答案为图形区域匹配，见源 PDF 原图';
  return '';
}

function submitAnswer() {
  const q = quizState.questions[quizState.currentIdx];
  let userAns = quizState.answered && quizState.answered[q.id];
  if(!userAns) return;
  if(q.t==='multiple' && userAns.length < 2) {
    alert('多选题至少选择 2 个答案，当前只选了' + userAns.length + '个');
    return;
  }
  const correct = isAnswerCorrect(q, userAns);
  if(!quizState.submitted) quizState.submitted={};
  quizState.submitted[q.id]=true;
  // 本场作答留痕（考核判分唯一依据；不与全局统计混用）
  if(!quizState.results) quizState.results={};
  quizState.results[q.id]={ua:[...userAns], ok:correct, ts:Date.now()};
  recordAnswer(q.id, userAns, correct);
  renderQuiz();
  updateSubmitButton();
}

function prevQuestion() {
  if(quizState.currentIdx > 0) { quizState.currentIdx--; renderQuiz(); }
}
function nextQuestion() {
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  if(isLast) {
    if(quizState.mode==='exam') renderExamResult();
    else navigate('dashboard');
  } else {
    quizState.currentIdx++;
    renderQuiz();
  }
}
function jumpToQuestion(idx) {
  quizState.currentIdx = idx;
  renderQuiz();
}
function exitQuiz() {
  // 考核中途退出必须停表：否则过期计时器归零时会把之后的练习页改写成「考核成绩单」
  if(quizState && quizState.mode==='exam') stopExamTimer();
  if(quizState && quizState.mode!=='exam') {
    setProgress({mode:quizState.mode,domain:quizState.domain||null,idx:quizState.currentIdx,time:Date.now()});
  }
  quizState = null;
  navigate('dashboard');
}

/* ================================================================
   ===================== 刷题模式启动 ==============================
   ================================================================ */
function startDomain(d) {
  const qs = QUESTIONS.filter(q=>q.d===d);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'domain',domain:d,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startContinue() {
  const p = getProgress();
  if(p.mode && p.mode!=='exam') {
    if(p.mode==='domain' && p.domain) {
      const qs = QUESTIONS.filter(q=>q.d===p.domain);
      const _sr=generateShuffledOptions(qs);
      quizState = {mode:'domain',domain:p.domain,questions:qs,currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    } else {
      const _sr=generateShuffledOptions([...QUESTIONS]);
      quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    }
  } else {
    const _sr=generateShuffledOptions([...QUESTIONS]);
    quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  }
  navigate('quiz');
}
function startWrongReview() {
  const wrong = getWrong().filter(w=>!w.mastered);
  if(!wrong.length) { alert('暂无错题需要复习！'); return; }
  const qs = wrong.map(w=>getQById(w.id)).filter(Boolean);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'wrong',domain:null,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startSingle(id) {
  const q = getQById(id);
  if(!q) return;
  const _sr=generateShuffledOptions([q]);
  quizState = {mode:'single',domain:null,questions:[q],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startExam() {
  // 模拟考核：按 meta 权重 × meta 题数分配各域配额（最大余数法，保证总和=EXAM_COUNT）
  const counts = {};
  let sumInt = 0;
  const raw = {}, rem = {};
  DOMAIN_KEYS.forEach(k => {
    const w = parseFloat(String(DOMAIN_WEIGHTS[k]||'0').replace('%',''))/100;
    raw[k] = w * EXAM_COUNT;
    counts[k] = Math.floor(raw[k]);
    rem[k] = raw[k] - counts[k];
    sumInt += counts[k];
  });
  let deficit = EXAM_COUNT - sumInt;
  const order = [...DOMAIN_KEYS].sort((a,b)=>rem[b]-rem[a]);
  let i = 0;
  while(deficit > 0) { counts[order[i % order.length]]++; deficit--; i++; }
  let selected = [];
  DOMAIN_KEYS.forEach(d => {
    const pool = shuffle(QUESTIONS.filter(q=>q.d===d && q.t!=='hot'));
    selected.push(...pool.slice(0, counts[d]));
  });
  selected = shuffle(selected);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam',domain:null,questions:selected,currentIdx:0,answered:{},submitted:{},results:{},shuffledOptions:_exam.opts,shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  // 场次标识：计时回调据此判定「本场是否仍在进行」，防过期计时器串场
  quizState.examToken = 'ex-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

function startRealExam() {
  // 全真模考：固定用模考池出卷（题数/计分结构/时长按官方口径），每次只重排题序与选项。
  // 与随机模考的区别：题目固定可复现，分数可跨场对比；题目与练习池隔离，平时练不到。
  const pool = MOCK_QUESTIONS.slice();
  if(!pool.length) { alert('本卷未配置模考池，请用随机模考'); return; }
  const selected = shuffle(pool);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam', fullMock:true, domain:null, questions:selected, currentIdx:0, answered:{}, submitted:{}, shuffledOptions:_exam.opts, shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  quizState.examToken = 'mx-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

let examTimerInterval = null;
function stopExamTimer() {
  if(examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
}
function startExamTimer() {
  let secs = quizState.examDuration;
  const token = quizState.examToken;
  const timerEl = document.getElementById('quizTimer');
  if(!timerEl) return;
  stopExamTimer();
  examTimerInterval = setInterval(() => {
    // 场次校验：已退出或已换场（新 token）立即自毁
    if(!quizState || quizState.mode!=='exam' || quizState.examToken!==token) { stopExamTimer(); return; }
    secs--;
    const m = Math.floor(secs/60), s = secs%60;
    const el = document.getElementById('quizTimer');
    if(el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if(secs<=60 && el) el.classList.add('warning');
    if(secs<=0) { stopExamTimer(); finishExam(token); }
  }, 1000);
}

function finishExam(token) {
  stopExamTimer();
  // 只对「发起本场计时」的考核会话生效
  if(quizState && quizState.mode==='exam' && (token===undefined || quizState.examToken===token)) renderExamResult();
}

function renderExamResult() {
  if(!quizState) return;
  stopExamTimer();
  const qs = quizState.questions;
  const results = quizState.results || {};
  const fullMock = !!quizState.fullMock;
  // 全真模考按官方口径只判计分题（50 题）；随机模考与其它模式仍整卷计分
  const counted = fullMock ? qs.filter(q => MOCK_SCORED.has(q.id)) : qs;
  const total = counted.length;
  // 逐题按本场作答判分；全局历史与往场作答一律不计
  let correct = 0, wrong = 0, unanswered = 0;
  const domStat = {};
  DOMAIN_KEYS.forEach(d => domStat[d] = {n:0, cor:0});
  counted.forEach(q => {
    if(!domStat[q.d]) domStat[q.d] = {n:0, cor:0};
    domStat[q.d].n++;
    const r = results[q.id];
    if(!r) unanswered++;
    else if(r.ok) { correct++; domStat[q.d].cor++; }
    else wrong++;
  });
  // 不变量自校验：正确 + 错误 + 未答 必须等于计分题数
  if(correct + wrong + unanswered !== total) console.warn('[exam] 判分不变量异常', {correct, wrong, unanswered, total});
  const el = document.getElementById('page-quiz');
  const pct = total ? Math.round(correct/total*100) : 0;
  // 1000-point scale, 700 to pass
  const scaledScore = total ? Math.round(correct/total*1000) : 0;
  const passed = scaledScore >= EXAM_PASS;
  // Time used
  const timeUsed = quizState.examStartTime ? Math.round((Date.now()-quizState.examStartTime)/1000) : 0;
  const timeM = Math.floor(timeUsed/60), timeS = timeUsed%60;

  // Domain breakdown
  let domainHtml = '';
  for(const d of DOMAIN_KEYS) {
    const dd = domStat[d] || {n:0, cor:0};
    const dPct = dd.n ? Math.round(dd.cor/dd.n*100) : 0;
    domainHtml += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${dd.n}</td><td>${dd.cor}</td><td style="color:${dPct>=70?'var(--correct)':'var(--wrong)'}">${dPct}%</td></tr>`;
  }

  el.innerHTML = `<div class="header"><button class="back-btn" onclick="exitExam()">←</button><h1>${fullMock ? '🎯 全真模考成绩单' : '📋 考核成绩单'}</h1></div>
  <div style="text-align:center;padding:30px 20px">
    <div style="font-size:48px;font-weight:700;color:${passed?'var(--correct)':'var(--wrong)'}">${scaledScore}</div>
    <div style="font-size:14px;color:var(--text2);margin:4px 0">满分 1000 分 | 及格线 ${EXAM_PASS} 分${fullMock ? " | 计分题 " + total + " 题（卷面 " + qs.length + " 题，不计分 " + (qs.length - total) + " 题）" : ""}</div>
    <div style="font-size:16px;color:var(--text);margin:12px 0;font-weight:600">${passed?'✅ 通过！':'❌ 未通过'}</div>
    <div style="display:flex;justify-content:center;gap:20px;margin:16px 0;flex-wrap:wrap">
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--correct)">${correct}</div><div style="font-size:12px;color:var(--text2)">正确</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--wrong)">${wrong}</div><div style="font-size:12px;color:var(--text2)">错误</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text2)">${unanswered}</div><div style="font-size:12px;color:var(--text2)">未答</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--primary)">${pct}%</div><div style="font-size:12px;color:var(--text2)">正确率</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text)">${timeM}分${timeS.toString().padStart(2,'0')}秒</div><div style="font-size:12px;color:var(--text2)">用时</div></div>
    </div>
  </div>
  <div class="stats-chart">
    <h3>各章节成绩</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>题数</th><th>正确</th><th>正确率</th></tr></thead><tbody>
    ${domainHtml}
    </tbody></table>
  </div>
  <div style="text-align:center;padding:20px">
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn-secondary" onclick="exitExam()" style="width:auto">返回首页</button>
      <button class="btn-primary" onclick="${fullMock ? 'startRealExam()' : 'startExam()'}" style="width:auto;flex:none">再考一次</button>
    </div>
  </div>`;
  quizState = null;
}

function exitExam() {
  quizState = null;
  navigate('dashboard');
}

   ===================== 错题集页面 ================================
   ================================================================ */
let wrongFilter = 0;

function renderWrongBook() {
  const wrong = getWrong().filter(w=>!w.mastered);
  const mastered = getWrong().filter(w=>w.mastered);
  const el = document.getElementById('page-wrongbook');
  let html = `<div class="header"><h1>❌ 错题集</h1></div>`;

    <div class="stat-card"><div class="stat-num">${wrong.length}</div><div class="stat-label">待复习</div></div>

  </div>`;

    <button class="wrong-tab ${wrongFilter===0?'active':''}" onclick="wrongFilter=0;renderWrongBook()">全部</button>`;

    html += `<button class="btn-secondary" onclick="if(confirm('确定清空所有已掌握的错题吗？')){setWrong(getWrong().filter(w=>!w.mastered));renderWrongBook();}" style="width:auto">清空已掌握</button></div>`;

}

/* ================================================================
   ===================== 统计页面 ==================================
   ================================================================ */

  html += `<div class="stats-chart">
    <h3>总进度</h3>
    <div style="height:30px;background:var(--border);border-radius:15px;overflow:hidden">

    </div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--text2)">
      <span>已答 ${s.doneIds}/${QUESTIONS.length} 题</span>
      <span>正确率 ${s.acc}%</span>
    </div>
  </div>`;
  html += `<div class="stats-chart"><h3>各章节正确率</h3><canvas id="chartDomain"></canvas></div>`;
  html += `<div class="stats-chart"><h3>各题型正确率</h3><canvas id="chartType"></canvas></div>`;
  html += `<div class="stats-chart"><h3>详细数据</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>总题</th><th>已答</th><th>正确</th><th>正确率</th></tr></thead><tbody>`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${ds.total}</td><td>${ds.answered}</td><td>${ds.correct}</td><td style="color:${ds.acc>=70?'var(--correct)':'var(--wrong)'};font-weight:600">${ds.acc}%</td></tr>`;
  }
  html += `</tbody></table></div>`;
  el.innerHTML = html;
  setTimeout(() => {
    drawDomainChart(s);
    drawTypeChart(s);
  }, 50);
}

function drawDomainChart(s) {
  const c = document.getElementById('chartDomain');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = DOMAIN_KEYS.map(k=>'D'+k);
  const colors = ['#4361ee','#4cc9f0','#06d6a0','#f8961e','#9b5de5'];
  const barW = (W-80) / (labels.length*1.5);
  labels.forEach((l,i)=>{
    const val = s.domainStats[i+1].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(l, x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

function drawTypeChart(s) {
  const c = document.getElementById('chartType');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = ['单选','多选'];
  const keys = ['single','multiple'];
  const colors = ['#4361ee','#4cc9f0'];
  const barW = (W-80) / 4;
  keys.forEach((k,i)=>{
    const val = s.typeStats[k].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

/* roundRect polyfill */
if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(r>w/2) r=w/2;
    if(r>h/2) r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    return this;
  };
}

/* ================================================================
   ===================== 工具函数 ==================================
   ================================================================ */
function exportData() {
  const data = {
    answers: getAnswers(),
    wrong: getWrong(),
    progress: getProgress(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${LS_PREFIX}-quiz-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.answers) setAnswers(data.answers);
        if(data.wrong) setWrong(data.wrong);
        if(data.progress) setProgress(data.progress);
        alert('数据导入成功！');
        navigate(currentPage);
      } catch(err) { alert('数据格式错误，请检查文件。'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetData() {
  showModal('确认重置', '确定要清除所有答题记录、错题集和进度吗？此操作不可恢复！', () => {
    localStorage.removeItem(LS_ANSWERS);
    localStorage.removeItem(LS_WRONG);
    localStorage.removeItem(LS_PROGRESS);
    navigate('dashboard');
  });
}

/* ================================================================
   ===================== 模态框 ====================================
   ================================================================ */
let modalCallback = null;
function showModal(title, text, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOverlay').classList.add('show');
  modalCallback = onConfirm;
  document.getElementById('modalConfirmBtn').onclick = () => {
    closeModal();
    if(modalCallback) modalCallback();
  };
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

/* ================================================================
   ===================== 主题切换 ==================================
   ================================================================ */
function toggleTheme() {
  document.getElementById('quizView').classList.toggle('dark');
  localStorage.setItem(LS_PREFIX+'_theme', document.getElementById('quizView').classList.contains('dark')?'dark':'light');
  navigate(currentPage);
}

/* ================================================================
   ===================== 初始化 ====================================
   ================================================================ */
function init() {
  if(localStorage.getItem(LS_PREFIX+'_theme')==='dark') document.getElementById('quizView').classList.add('dark');
  const pages = ['dashboard','quiz','wrongbook','stats','settings'];
  const app = document.getElementById('app');
  pages.forEach(p => {
    const div = document.createElement('div');
    div.id = 'page-'+p;
    div.className = 'page' + (p==='dashboard'?' active':'');
    app.appendChild(div);
  });
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => { if(btn.dataset.page==='learn'){ if(window.kbShowLearnHome) window.kbShowLearnHome(); } else navigate(btn.dataset.page); });
  });
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', init);

</script>

分析方案 · 实现语音方案","focus":"本章练习 12 题","domain":4},{"day":9,"topic":"D5 实现信息抽取方案 · 构建检索与接地管线","focus":"官方权重 10–15","domain":5},{"day":10,"topic":"D5 实现信息抽取方案 · 从文档抽取内容","focus":"本章练习 12 题","domain":5}],"planAuto":true},"chapters":[{"domain":1,"name":"规划与管理 Azure AI 方案","weight":"25–30%","practice":[{"id":"D1-001","d":1,"t":"single","q":"某团队要为智能客服搭一套分诊：先判断客户来电属于退款、故障还是咨询，再为每类生成不同的回复，客户偶尔还会上传截图问「这个按钮在哪」。按成本与效果，最合适的模型搭配是","o":[{"l":"A","t":"意图分类与回复生成全用同一个大模型，省去切换成本"},{"l":"B","t":"意图分类用小模型、回复生成用大模型、看图提问才上多模态模型"},{"l":"C","t":"三类任务全用 Foundry Tools 的预置能力，不必调用任何模型"},{"l":"D","t":"意图分类与看图都用多模态模型，回复生成交给语音工具"}],"a":["B"],"e":"✅ 正确项：B。分类是固定输出、模式单一，用小模型省钱提速；回复生成需要语言组织与推理，用大模型；看图提问要同时理解文字与图像，才需要多模态模型。关联考点：域 1.1.1「按任务选对模型」。\n\n❌ A：把分类也塞给大模型，成本高且输出未必稳，讲义明确说分类抽取类别用大模型。\n❌ C：Foundry Tools 是语音、翻译这类成品工具，做不了开放式的意图分诊与回复生成。\n❌ D：把语音工具当回复生成器是主体错配，语音工具负责转写与合成，不负责生成文本回复。\n\n📌 关键概念：模型选型按「输出是否固定、要不要看图听音、量大不大」三问，混合场景混合配，不一刀切。","s":"自编·1.1.1"},{"id":"D1-002","d":1,"t":"multiple","q":"一款客服应用上线后频繁返回限流错误，账单也突然翻倍。团队排查配额、缩放、限流、成本四方面，哪些做法是正确的（选所有适用项）","o":[{"l":"A","t":"客户端遇到限流就立刻高频重试，尽快抢到配额"},{"l":"B","t":"上线前盘点容量，配额缺口提前申请，不等撞墙再补"},{"l":"C","t":"按流量峰谷配自动缩放，并把缩放上限对齐配额"},{"l":"D","t":"按部署与项目打标签归集用量，异常波动纳入周会检查"},{"l":"E","t":"为省事把所有环境共用一个订阅，不单独区分成本归属"}],"a":["B","C","D"],"e":"✅ 正确项：B、C、D。配额缺口提前申请、缩放上限对齐配额、按部署打标签归集成本，都是讲义列出的正确管理动作。关联考点：域 1.3.1「管理配额、缩放、速率限制与成本」。\n\n❌ A：限流后立刻高频重试会造成重试风暴、火上浇油，正确做法是退避重试、按等待提示歇够再发。\n❌ E：所有环境共用一个订阅会让成本无法归属，恰恰与「按部署与项目打标签归集」相反。\n\n📌 关键概念：配额是上限、缩放调并发、限流靠退避、成本要归集；限流错误不能用重试硬闯来解。","s":"自编·1.3.1"},{"id":"D1-003","d":1,"t":"single","q":"Fabrikam 电商平台的评论处理每天要跑几万条：先给每条评论打上好评、中评、差评三个固定标签，再由运营每周把标签汇总成一篇数千字的消费趋势分析。按成本与效果给这两步配模型，最合适的是","o":[{"l":"A","t":"两步都交给参数量最大的通用大模型，保证一步到位"},{"l":"B","t":"两步都用小模型，把成本压到最低"},{"l":"C","t":"打标签用小模型，写趋势分析用大模型"},{"l":"D","t":"两步都交给语音转写工具，先把评论读出来再说"}],"a":["C"],"e":"✅ 正确项：C。打标签输出固定为三选一、模式单一、量大，正是小模型的主场，省钱又提速；写趋势分析要汇总数据、组织语言、给出洞察，属于需要语言组织与综合推理的生成任务，交给大模型才稳。关联考点：域 1.1.1「按任务选对模型」。\n\n❌ A：把固定输出的分类也塞给大模型，成本按调用量累积，纯属高射炮打蚊子，输出也未必更稳。\n❌ B：趋势分析需要推理与文字功底，小模型效果不足，周报质量会明显掉档。\n❌ D：语音工具负责转写与合成，跟文本分类和写分析报告是主体错配。\n\n📌 关键概念：选型三问——输出固定吗、量大吗、要不要看图听音；固定大流量配小模型，要组织语言才上大模型。","s":"自编·1.1.1"},{"id":"D1-004","d":1,"t":"single","q":"某团队要给客服应用加四项能力：把英文来信译成中文、把会议录音转成文字纪要、根据客户投诉草拟一封致歉信、把扫描版合同里的印刷文字读出来。其中哪些适合直接交给 Foundry Tools 这类成品工具，而不必动用生成模型","o":[{"l":"A","t":"四项都该用大模型做，成品工具不可靠"},{"l":"B","t":"只有翻译适合工具，转写、草拟、读取都得用大模型"},{"l":"C","t":"致歉信和合同读取用工具，翻译和转写给大模型"},{"l":"D","t":"翻译、转写、合同读取这类确定性任务走成品工具，草拟致歉信这种要语言创造的才交给生成模型"}],"a":["D"],"e":"✅ 正确项：D。翻译、转写、光学字符读取都是输出确定的任务，成品工具稳定省钱；草拟致歉信要拿捏语气、组织语言，属于创造性的生成任务，才值得动用生成模型。关联考点：域 1.1.1「按任务选对模型」。\n\n❌ A：确定性任务用大模型是白花钱，讲义明确固定输出优先走工具。\n❌ B：转写与文档读取正是工具的强项，全推给大模型方向反了。\n❌ C：把两条路正好配反，草拟信要生成模型，读取走工具才对。\n\n📌 关键概念：先问「有没有现成工具」——确定性任务交工具，要变通创造的任务才上生成模型。","s":"自编·1.1.1"},{"id":"D1-005","d":1,"t":"single","q":"Contoso 的产品问答应用要给回答加「接地」能力：答案必须锚在官方产品资料上，不许模型自由发挥。按讲义的五路服务分工，「接地」这一路应该怎么配","o":[{"l":"A","t":"建索引配检索，把相关资料段落先检索出来喂给模型，让回答锚在给定资料上"},{"l":"B","t":"把产品资料微调进模型权重，让资料成为模型的一部分"},{"l":"C","t":"不建任何索引，让模型凭训练时的记忆回答，资料只留档备查"},{"l":"D","t":"用语音工具把产品资料朗读一遍给模型听，听完再作答"}],"a":["A"],"e":"✅ 正确项：A。接地的本意是把回答锚在给定资料上，做法就是索引加检索：先从资料里找出相关段落，连同问题一起交给模型生成，答案自然有据可查。关联考点：域 1.1.2「为生成、接地、向量搜索、智能体工作流或多模态处理选对服务」。\n\n❌ B：微调要动权重、资料一更新就得重训，讲义明确接地靠检索管理资料，不是把资料炼进模型。\n❌ C：凭记忆回答正是接地要解决的老毛病——知识有截止日期、不知道私有资料。\n❌ D：语音工具管转写合成，与锚定资料无关，属于通道错配。\n\n📌 关键概念：五路服务——生成走模型、接地走索引检索、找相似走向量、办事走智能体、看图走多模态。","s":"自编·1.1.2"},{"id":"D1-006","d":1,"t":"single","q":"Fabrikam 的设备报修平台收到这样的工单：用户上传一张设备故障照片，再写两行文字描述。系统要「既看懂图里的故障，又读懂文字描述」，综合判断故障类别后派单。这路需求在五路服务里该配什么","o":[{"l":"A","t":"只配纯文本小模型，分析两行文字描述就够了"},{"l":"B","t":"先用翻译工具把描述译成标准语句，再分类"},{"l":"C","t":"配智能体服务加日历连接器，让它自己安排派单"},{"l":"D","t":"配多模态模型或内容理解工具这条通道，同时处理图像与文字"}],"a":["D"],"e":"✅ 正确项：D。图文混合输入、要一起读懂再决策，属于多模态处理需求，该走多模态模型或内容理解工具这一路：模型同时看图读文，输出故障类别，证据两条腿都站得住。关联考点：域 1.1.2「为生成、接地、向量搜索、智能体工作流或多模态处理选对服务」。\n\n❌ A：只读文字丢掉图像这半边证据，故障类别判断的依据缺了一半。\n❌ B：翻译只改变语言形态，帮不上判断故障，答非所问。\n❌ C：智能体服务管编排与办事，不管图文理解本身，主体错配。\n\n📌 关键概念：多模态处理＝看图听音与文字一起进模型；判断需求先看输入形态，图文混合就得多模态这条路。","s":"自编·1.1.2"},{"id":"D1-007","d":1,"t":"single","q":"Contoso 的内部规章问答上线后，用户问法五花八门：「报销上限」「费用封顶」「差旅最多报多少」其实都指向同一条条款；而规章里又满是精确编号，比如单号、条款号。检索方法选哪种最合适","o":[{"l":"A","t":"纯关键词检索，改了说法也能精确命中"},{"l":"B","t":"混合检索加语义重排：向量路容住同义改写，关键词路保住精确编号"},{"l":"C","t":"纯向量检索，对精确编号查询天然最稳"},{"l":"D","t":"不建索引，每次把整本规章贴进提示词让模型自己找"}],"a":["B"],"e":"✅ 正确项：B。同义改写多、精确编号也多，两路各有强项：向量检索按语义相近度能容住「报销上限」对「费用封顶」这类改写；关键词检索按字面匹配稳吃编号与术语。混合检索两路并发再合并排序，语义重排把最贴题的顶上去，两头都稳。关联考点：域 1.1.3「选对检索与索引方法」。\n\n❌ A：纯关键词最怕同义改写，换了说法就搜不到原词。\n❌ C：纯向量对精确编号没有优势，编号还是字面匹配最稳。\n❌ D：整本贴进提示词会超上下文窗口、成本高，也丢了先查再答的检索逻辑。\n\n📌 关键概念：关键词保精确、向量容改写、混合加语义重排是稳妥默认。","s":"自编·1.1.3"},{"id":"D1-008","d":1,"t":"single","q":"某企业的知识库问答机器人运行三个月后，开始把已经作废的旧报销政策当作现行政策回答，用户投诉不断。排查发现资料源每周都在更新，但索引三个月没动过。最该补的工程动作是","o":[{"l":"A","t":"把生成温度调到最低，重写一遍系统提示词"},{"l":"B","t":"换一个参数量更大的模型重上线"},{"l":"C","t":"给摄取管线配上增量拉取，让索引跟着资料源定期更新"},{"l":"D","t":"把高频答案缓存起来，减少重复检索"}],"a":["C"],"e":"✅ 正确项：C。症状是「索引陈旧」：资料源每周在变、索引三个月没跟，答案引用作废政策就是索引不新鲜的直接后果。正解是配增量摄取——索引器定期自动拉取新资料更新受影响分区，索引保持新鲜，答案才不会停在旧版本。关联考点：域 1.1.3「选对检索与索引方法」。\n\n❌ A：问题在检索侧的资料陈旧，不在生成侧的参数，调温改提示治不了根。\n❌ B：再大的模型也只能从旧索引里检索，换模型方向就错了。\n❌ D：缓存恰恰把旧答案固化得更死，与保鲜背道而驰。\n\n📌 关键概念：索引新鲜度＝摄取管线管更新；索引陈旧，答案必陈旧，别攒到全量重建才动。","s":"自编·1.1.3"},{"id":"D1-009","d":1,"t":"multiple","q":"Fabrikam 要搭一个客户经理助手，希望它「记得住、办得动、查得到」：记住老客户上季度聊过什么，能进客户系统查资料、约会议，答得出产品条款。关于记忆、工具、知识三样的选配，正确的有哪些（选所有适用项）","o":[{"l":"A","t":"短期记忆跟会话历史走；跨会话的偏好与画像落外部存储，用的时候检索回来"},{"l":"B","t":"长期记忆全部塞进上下文窗口，记得越全越好"},{"l":"C","t":"工具优先用现成的连接器与工具箱；独有业务能力才自写函数托管"},{"l":"D","t":"知识库按业务问题域来建，权限敏感的资料带权限过滤"},{"l":"E","t":"记忆、工具、知识三样交给模型运行时自由发挥，不必预先配置"}],"a":["A","C","D"],"e":"✅ 正确项：A、C、D。三样的正确选法：记忆分层——短期跟会话、长期落库检索；工具先现成——连接器能用就不自写，独有能力才托管函数；知识按问题域建索引、权限敏感带权限过滤。这正是「记得住、办得动、查得到」的工程解法。关联考点：域 1.1.4「为智能体方案选对记忆、工具与知识集成服务」。\n\n❌ B：全塞上下文窗口又贵又会截断，长期记忆还要过隐私与保留期两道关，贪全反而失控。\n❌ E：三样都要预先选配，交给模型自由发挥等于没有边界，输出没法保证。\n\n📌 关键概念：记忆分层、工具先现成、知识按问题域——三样各就各位，助手才既答得准又记得住。","s":"自编·1.1.4"},{"id":"D1-010","d":1,"t":"single","q":"Contoso 在多个国家有团队，合规要求客户数据必须留在本地区域处理。现在要在 Foundry 上搭一套 AI 应用，基础设施第一步怎么摆","o":[{"l":"A","t":"Foundry 资源建在本地区域，数据存储与搜索服务同区部署，访问走私网终结点"},{"l":"B","t":"资源建在计费最便宜的区域，数据需要时跨区复制过来"},{"l":"C","t":"开发、测试、生产三个环境共用一套资源与项目，减少管理开销"},{"l":"D","t":"各环境凭据统一写进应用配置文件，方便随时读取"}],"a":["A"],"e":"✅ 正确项：A。数据驻留合规优先于成本：Foundry 资源落在本地区域，数据存储与搜索服务同区就近部署，流量走私网终结点不出公共网络，这套组合才守得住「数据不出区域」的红线。关联考点：域 1.2.1「为 AI 应用与智能体方案设计 Azure 基础设施」。\n\n❌ B：为省钱选异地资源，跨区复制本身就踩了数据驻留红线，方向反了。\n❌ C：环境隔离是变更安全的底线，生产必须独立，共用一套等于裸奔。\n❌ D：凭据写进配置文件就是入库，正确做法是托管标识、密钥只在本地调试临时用。\n\n📌 关键概念：基础设施四步——定资源、分环境、连数据、定凭据；合规场景区域与私网先行。","s":"自编·1.2.1"},{"id":"D1-011","d":1,"t":"single","q":"某连锁门店的智能助手刚立项试点：流量小、走势难以预估，老板要求「先花小钱验证」。模型部署档位选哪种","o":[{"l":"A","t":"直接买预留吞吐容量，独享算力一步到位"},{"l":"B","t":"走无服务器式：平台托管、按调用计费，用量坐实之后再考虑包容量"},{"l":"C","t":"部署到门店收银机的本地形态，断网也能跑"},{"l":"D","t":"不做部署，每次请求现场加载模型再推理"}],"a":["B"],"e":"✅ 正确项：B。冷启动试点的特征就是流量小且不可预期，无服务器式零算力运维、按调用计费，先试水把价值跑通；等用量稳定在高水位，再切预留吞吐档谈容量。关联考点：域 1.2.2「选对部署选项」。\n\n❌ A：试点期就买独享容量，钱花在没坐实的用量上，正是讲义点名的错误顺序。\n❌ C：本地形态是断网或数据不出设备场景的补充，在线服务助手不是它的主场。\n❌ D：部署本来就是把模型配成可调用的终结点，「不部署」就没有稳定访问方式，说法不成立。\n\n📌 关键概念：部署两档——无服务器按调用付费、预留吞吐独享容量；先试水后包容量。","s":"自编·1.2.2"},{"id":"D1-012","d":1,"t":"single","q":"Fabrikam 的生产交互应用跑了半年：流量持续高位、并发稳定，用户对响应延迟敏感，成本账也盘清了。这时部署档位怎么调","o":[{"l":"A","t":"维持无服务器式不变，平台反正会自动扩"},{"l":"B","t":"把应用拆成多个小部署分散到不同模型，降低单点压力"},{"l":"C","t":"切到本地形态省下流量费"},{"l":"D","t":"切预留吞吐档：独享容量，并发与延迟波动更可控，长期算总账更划算"}],"a":["D"],"e":"✅ 正确项：D。持续高并发加延迟敏感加用量坐实，三个条件都指向预留吞吐档：独享容量意味着并发上限与延迟波动都握在自己手里，按容量计费在高水位流量下通常比按调用更划算。关联考点：域 1.2.2「选对部署选项」。\n\n❌ A：高水位流量下无服务器式延迟波动大、单价累计贵，维持不变是把成本与体验都押在平台上。\n❌ B：拆多部署治不了单路容量需求，反而加管理负担，与档位选择无关。\n❌ C：本地形态是断网补充，省流量费的说法不成立。\n\n📌 关键概念：选档三看——看流量、看延迟、看成本；平稳小额无服务器，持续高并发预留吞吐。","s":"自编·1.2.2"}],"sections":[{"h":"为生成式 AI 与智能体选择合适的 Foundry 服务","body":"### 这一域考什么\n\n这一域问的是：动手写代码之前，怎么把方案选对、搭好、管住。领域 2 教你把应用做出来，这一域先教你做对决策。\n\n四条线串起全章：\n\n1. **选服务**：生成、接地、检索、智能体、多模态各配什么 Foundry 能力，对应任务 1.1。\n2. **搭骨架**：基础设施设计、部署选项、模型与智能体部署、管线接入，对应任务 1.2。\n3. **管运行**：配额缩放、监控观测、安全配置，对应任务 1.3。\n4. **守底线**：过滤器、评估埋点、审计与智能体治理，对应任务 1.4。\n\n这门课是助理级（Associate），这一域的动词以 Choose（选择）、Design（设计）、Manage（管理）、Configure（配置）为主。它考的是给你一组需求，你能选出服务、排好架构、定好护栏，并讲出取舍理由。\n\n### 读完这个域要能做什么\n\n这门课写给要主导 AI 方案落地的同事。你写得了代码，也要拿得出方案。读完本域应能：\n\n- 给一个生成式或智能体需求，列出候选服务并讲出取舍理由。\n- 为检索需求选对索引与检索方法，分清关键词、向量与混合的适用面。\n- 画出一套含部署、缩放与凭据管理的 Azure 基础设施轮廓。\n- 给一个上线系统，列出要盯的配额、指标与安全配置。\n- 为涉敏感内容的系统配上过滤器、评估与审计三件。\n\n### 和其他认证怎么接\n\n同一件事在别的学习路径里换了名字，认出来就不必重学。下面两条按「哪里像、哪里不一样」写。\n\n| 其他认证/能力 | 对应的那件事 | 这里有什么不同 | 什么时候该想起它 |\n|---|---|---|---|\n| AZ-104（Azure 管理员） | 都讲 Azure 资源的部署与治理 | AZ-104 管虚机网络存储这类通用资源，这里管模型配额、终结点与 token 成本 | 配额与缩放管不住时 |\n| AZ-900（Azure Fundamentals） | 都讲选型与责任边界 | AZ-900 只要认得服务类别，本课要给出选型决策与治理配置 | 分不清某服务该谁管时 |\n\n对照只用来迁移已有理解。做题以本域官方口径为准。\n\n### 官方口径的三条边界\n\n- 官方 Study Guide 只给技能点，不给题型，也不给题数。\n- 官方考试政策写明：考前不公布具体考试形式或题型。\n- 官方权重是 25–30% 这样的区间，不是精确占比。\n\n凡是官方没说的，表里就写官方未公布，不拿练习印象补空。\n\n#### 这一节学什么\n这一节对应考纲任务 1.1「为生成式 AI 与智能体选择合适的 Foundry 服务」。\n\n> 官方原名：Choose the appropriate Foundry services for generative AI and agents\n\n这一任务是全课的选型总入口：需求进来，先决定用哪类模型、哪路服务、哪种检索、哪套记忆与工具。四个技能点从模型一路选到配套。考题爱给一组场景任务，让你配出一张选型清单。主线是：选模型 → 选服务 → 选检索 → 选记忆与工具。\n\n#### 按任务选对模型：大模型、小模型、多模态模型与 Foundry Tools\n\n> 官方原名：Choose an appropriate model for each task, including large language models (LLMs), small language models, multimodal models, and Foundry Tools\n\n**这条在问什么。** 考题给一组任务——分类、生成、看图、听音——问各配什么模型，Foundry Tools 摆在什么位置。\n\n**定义**：大模型（LLM，large language model）胜在通用与推理；小模型（small language model）胜在省与快；多模态模型能同时处理文字、图像与音频；Foundry Tools（Foundry 工具集）不是模型，是语音、翻译、内容理解这类成品工具，适合确定性任务，不必动用生成模型。\n\n**怎么运作**。选型三问：\n\n1. 任务要生成还是要固定输出？固定输出优先 Foundry Tools。\n2. 需要看图听音吗？需要才上多模态模型。\n3. 量大且模式单一吗？是就配小模型，省钱提速。\n\n**什么时候用，什么时候别用**。分类抽取类任务别用大模型——成本高还可能不稳。创意与推理别硬塞给工具——工具不会变通。混合场景就混合配，别一刀切。\n\n💡 **场景举例**（虚构教学示意）：Contoso 规划智能客服：意图分类走小模型，回复生成走大模型，客户上传截图走多模态模型，语音转写走 Foundry Tools 的语音工具。四路各配，预算比「全大模型」方案省四成。\n\n**最小示例**（教学示意，占位符换成自己的值；生产环境凭据改用托管标识）：\n\n```python\nfrom azure.ai.inference import ChatCompletionsClient\nfrom azure.core.credentials import AzureKeyCredential\n\nclient = ChatCompletionsClient(\n    endpoint=\"https://<项目名>.models.ai.azure.com\",\n    credential=AzureKeyCredential(\"<密钥>\"),\n)\nfor task, dep in [(\"分类\", \"<小模型部署名>\"), (\"草拟\", \"<大模型部署名>\")]:\n    reply = client.complete(\n        messages=[{\"role\": \"user\", \"content\": \"处理这个请求：\" + task}],\n        model=dep,\n    )\n    print(task, reply.choices[0].message.content[:30])\n```\n\n**关联服务**：Microsoft Foundry 模型目录、Foundry Tools、Azure AI Inference SDK。\n\n#### 为生成、接地、向量搜索、智能体工作流或多模态处理选对服务\n\n> 官方原名：Choose the appropriate Foundry services for generative tasks, grounding, vector search, agent workflows, or multimodal processing\n\n**这条在问什么。** 考题给五类需求——生成、接地、向量搜索、智能体工作流、多模态处理——问各配哪路 Foundry 服务。\n\n**定义**：接地（grounding）是把回答锚在给定资料上，不让模型自由发挥；向量搜索（vector search）按语义相近度找内容。Foundry 把五类能力都做成项目里的现成服务，选服务就是给需求配通道。\n\n**怎么运作**。五类需求对五路服务：\n\n1. 生成任务：模型目录选模型，部署成终结点。\n2. 接地需求：索引加检索，把资料喂给模型。\n3. 向量搜索：向量索引配嵌入模型，管「找相似」。\n4. 智能体工作流：智能体服务配工具箱，管「办事」。\n5. 多模态处理：多模态模型或内容理解工具，管「看图听音」。\n\n**什么时候用，什么时候别用**。先问「有没有现成工具」——Foundry Tools 能确定性解决的，别用生成模型；要灵活变通的，别硬套工具。接地与向量搜索常配套出现，但小语料直接拼提示也够，别过度架设。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的产品问答要做接地：资料入库走索引与向量搜索，问答走大模型加检索，图片说明书走多模态模型。全链在 Foundry 项目里连成一条线，各段独立可换。\n\n**关联服务**：Foundry 模型目录与部署、Foundry 索引与向量搜索、Foundry Agent Service、Azure Content Understanding。\n\n#### 选对检索与索引方法\n\n> 官方原名：Choose an appropriate method for retrieval and indexing\n\n**这条在问什么。** 考题给「找资料」的需求，问用关键词、向量还是混合检索，索引怎么建、怎么保持新鲜。\n\n**定义**：关键词检索按字面匹配，精确但怕同义改写；向量检索按语义相近度，容忍改写但可能漏精确词；混合检索（hybrid search）两路并发再合并排序，兼得两边。索引（index）是检索的底座，建得好坏决定找不找得到。\n\n**怎么运作**。选法三步：\n\n1. 看语料：术语精确的行业文档，关键词权重高；口语化问句，向量占优。\n2. 看精度要求：要召回全，就上混合检索加语义排序。\n3. 看更新节奏：资料常变就配增量摄取管线，别靠手工重建。\n\n**什么时候用，什么时候别用**。混合检索是稳妥默认，但小语料直接全文拼提示更快。别给几页文档上全套向量索引——运维负担先吃掉收益。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的规章问答原来用纯关键词，用户问「报销上限」搜不到「费用封顶」。改混合检索后两问都能命中，答准率升两成，工程量只加了嵌入模型一路。\n\n**关联服务**：Azure AI Search（关键词、向量、混合与语义排序）、嵌入模型、Foundry 索引。\n\n#### 为智能体方案选对记忆、工具与知识集成服务\n\n> 官方原名：Choose appropriate memory, tool, and knowledge integration services for agent solutions\n\n**这条在问什么。** 考题给一个智能体需求，问记忆、工具、知识三样分别配什么服务。\n\n**定义**：智能体记忆分短期（会话历史，管当轮上下文）与长期（外部存储，管跨会话画像与偏好）；工具是智能体可调用的外部能力；知识集成把企业资料变成智能体可检索的知识库。三样决定智能体「记得住、办得动、查得到」。\n\n**怎么运作**。三样选法：\n\n- 记忆：短会话用运行时会话历史；要跨会话画像就落外部存储并加检索。\n- 工具：优先工具箱与现成连接器；独有能力才自写函数托管。\n- 知识：小资料拼提示，大资料走索引加检索，权限敏感要带权限过滤。\n\n**什么时候用，什么时候别用**。记忆别全塞上下文窗口——贵且会截断；长期记忆要过隐私与保留期两道关。知识库别求大求全，按业务问题域建，检索质量重于入库量。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的客户经理助手：短期记忆跟会话走，长期偏好落库——客户行业、历史沟通摘要；工具挂客户系统 API 与日历连接器；知识按产品线分索引并带部门权限。三样各就各位，助手答得准也记得住老客户。\n\n**关联服务**：Foundry 工具箱（toolbox）、Azure AI Search（知识库与权限过滤）、Azure Cosmos DB（长期记忆）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「什么都用大模型解决」 | 固定输出优先 Foundry Tools；量大单一的任务配小模型更省 |\n| 2 | 「接地就是把资料塞进提示」 | 接地要靠索引与检索管理资料，不是每次全量拼接 |\n| 3 | 「向量检索万能」 | 术语精确的语料关键词更稳；混合检索才是稳妥默认 |\n| 4 | 「索引建一次管永远」 | 资料常变就配增量摄取；索引陈旧，答案必陈旧 |\n| 5 | 「记忆越全越好」 | 长期记忆要过保留期与隐私两道关，按需建不贪全 |\n| 6 | 「知识库求大求全」 | 按业务问题域建索引，检索质量重于入库量 |\n\n#### 记忆要点\n\n1. **选型三问**：要生成还是固定输出？要看图吗？量大且单一吗？\n2. **五路服务**：生成走模型、接地走检索、找相似走向量、办事走智能体、看图走多模态。\n3. **检索三式**：关键词精确、向量容改写、混合两全，默认选混合。\n4. **索引新鲜**：摄取管线管更新，索引陈旧则答案陈旧。\n5. **三样选法**：记忆分层、工具先现成、知识按问题域。\n6. **工具箱优先**：连接器能用就别自写，独有能力才托管函数。\n\n---"},{"h":"在 Foundry 里搭建 AI 方案","body":"#### 这一节学什么\n这一节对应考纲任务 1.2「在 Foundry 里搭建 AI 方案」。\n\n> 官方原名：Set up AI solutions in Foundry\n\n这一任务把选型结果落到 Azure 上：设计基础设施、选部署选项、配部署、接管线。四个技能点从资源规划走到发布自动化。考题爱给规模与合规约束，让你给出搭建顺序与部署形态。主线是：设计 → 选档 → 配置 → 接管线。\n\n#### 为 AI 应用与智能体方案设计 Azure 基础设施\n\n> 官方原名：Design Azure infrastructure for AI apps and agent-based solutions\n\n**这条在问什么。** 考题给规模、区域与合规约束，问基础设施怎么摆：哪些资源、怎么分区、凭据怎么管。\n\n**定义**：AI 方案的基础设施以 Microsoft Foundry 资源为核心——一个资源统一承载模型、智能体与工具的访问。外围按需配数据存储、搜索服务与网络组件。项目（project）是资源内的管理单元，模型、索引、智能体都在项目里集中管理。\n\n**怎么运作**。设计四步：\n\n1. 定资源：建 Foundry 资源与项目，终结点形如「资源域名加项目路径」。\n2. 分环境：开发、测试、生产各一套，配置隔离、权限隔离。\n3. 连数据：存储放近数据源，搜索服务按区域就近部署。\n4. 定凭据：统一托管标识，密钥只在本地调试临时用。\n\n**什么时候用，什么时候别用**。跨区域团队先考虑区域与数据驻留再定资源位置；合规严格的环境优先专用网络与私网终结点。小团队试点别一上来铺三套环境——先一套跑通，再扩。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的合规要求客户数据不出本地区域。方案：Foundry 资源建在本地区域，数据存储与搜索服务同区，私网终结点出网；开发测试共用一套、生产独立。评审一次通过。\n\n**关联服务**：Microsoft Foundry 资源与项目、Azure 存储、Azure AI Search、虚拟网络与私网终结点。\n\n#### 选对部署选项\n\n> 官方原名：Choose appropriate deployment options\n\n**这条在问什么。** 考题给流量模式与延迟要求，问模型该用哪种部署形态。\n\n**定义**：Foundry 模型部署主要有两档：无服务器式（平台托管、按调用计费、零算力运维）与预留吞吐式（独享容量、并发与延迟更稳、按容量计费）。另有本地形态，把小模型放到终端设备跑，是断网场景的补充。\n\n**怎么运作**。选档三看：\n\n1. 看流量：平稳小额走无服务器式；持续高并发走预留吞吐。\n2. 看延迟：交互类应用对响应敏感，预留档更可控。\n3. 看成本：按调用计费先试水，用量坐实再谈包容量。\n\n**什么时候用，什么时候别用**。长期跑主力的生产交互应用，预留吞吐更划算；冷启动试点别急着买容量。断网或数据不出设备的场景才上本地部署——它是补充，不是主流。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的门店助手先走无服务器式上线试水；三个月后用量稳定在高水位，改预留吞吐档，高峰延迟波动从两秒压到半秒内，成本降了一成。\n\n**关联服务**：Foundry 模型部署（部署类型）、Foundry Local（本地运行）、配额与容量管理。\n\n#### 配置模型与智能体部署\n\n> 官方原名：Configure model and agent deployments\n\n**这条在问什么。** 考题问：模型与智能体部署时具体配哪些项，谁有权部署与调用。\n\n**定义**：模型部署把模型配成可调用的终结点，配置项含部署名、模型版本、算力与缩放参数；智能体部署把角色定义、模型、工具挂成版本化资源。访问靠角色分配管：日常开发用 Foundry 用户（Foundry User）级，管项目用 Foundry 项目管理（Foundry Project Manager）级，建资源才用 Foundry 账户所有者（Foundry Account Owner）级。这组角色刚从 Azure AI 系列名更名，权限不变。\n\n**怎么运作**。配置三件：\n\n- 部署名与版本：部署名固定供应用引用，换模型改部署不改代码。\n- 算力与缩放：按峰值留余量，缩放上限与配额对齐。\n- 权限分配：按最小权限给角色，创建与调用分开授权。\n\n**什么时候用，什么时候别用**。模型版本升级走新部署灰度，别原地改——要能秒回旧版。权限别图省事绑到账户所有者——那是建资源的宽权限，日常开发不该带。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 升级客服模型：建「v2」新部署，两成流量灰度一周，指标达标后全量切过去；出问题一键回切「v1」，全程不停服。\n\n**关联服务**：Foundry 模型部署、Foundry Agent Service（智能体版本化）、Microsoft Entra ID 角色分配。\n\n#### 把 Foundry 项目接入持续集成与持续部署管线\n\n> 官方原名：Integrate Foundry projects with continuous integration and continuous deployment (CI/CD) pipelines\n\n**这条在问什么。** 考题问：Foundry 上的配置怎么进版本管理与自动发布。\n\n**定义**：持续集成与持续部署（CI/CD）指代码与配置改动经自动构建、测试、发布流程落地。Foundry 支持用 SDK 或 REST 声明式创建智能体与项目配置，天然可进管线：定义进版本库，管线负责建版本与发布。\n\n**怎么运作**。接入三步：\n\n1. 定义入库：智能体定义、提示词、索引结构都当配置文件管理。\n2. 管线执行：用 SDK 脚本在目标项目创建或更新版本。\n3. 分环境发布：开发项目先行，测试通过后推生产项目。\n\n**什么时候用，什么时候别用**。正式产品一律进管线——手工在门户改生产等于裸奔。纯探索的沙盒项目别上管线，流程成本会拖慢试验。\n\n💡 **场景举例**（虚构教学示意）：Contoso 把差旅助手定义放进代码库。改提示词都要过代码评审；管线在测试项目自动建新版本、跑固定对话集，达标才发布到生产项目。上线以来配置零手工改动。\n\n**最小示例**（教学示意，占位符换成自己的值；生产环境凭据改用托管标识）：\n\n```yaml\nsteps:\n  - script: |\n      pip install azure-ai-projects azure-identity\n      python scripts/deploy_agent.py --name travel-helper\n    env:\n      FOUNDRY_PROJECT_ENDPOINT: $(FOUNDRY_PROJECT_ENDPOINT)\n```\n\n脚本内容就是把智能体定义用 SDK 提交给项目；触发、评审、发布都交给管线。\n\n**关联服务**：Foundry SDK（声明式创建）、Azure DevOps 与 GitHub Actions（管线托管）、Microsoft Entra ID（管线身份）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「一个资源全环境共用」 | 环境隔离是变更安全的底线；生产必须独立 |\n| 2 | 「无服务器式永远最省」 | 高稳流量下预留吞吐更划算；先试水，后包容量 |\n| 3 | 「换模型就原地改部署」 | 升级走新部署灰度，留得住回退路径 |\n| 4 | 「日常开发绑到账户所有者的权限」 | 账户所有者是建资源的宽权限；日常用项目级角色 |\n| 5 | 「生产配置在门户里手改」 | 手改无记录不可回滚；配置进库、发布进管线 |\n| 6 | 「本地部署要替代云端」 | 本地是断网与数据不出设备场景的补充，不是主流 |\n\n#### 记忆要点\n\n1. **一个核心**：Foundry 资源统一承载模型、智能体与工具的访问。\n2. **部署两档**：无服务器式按调用付费；预留吞吐独享容量。\n3. **升级走灰度**：新部署并行跑，旧版留着回退。\n4. **权限三层**：用户级开发、项目管理管项目、账户所有者建资源。\n5. **定义入库**：智能体与提示词当配置管，评审后自动发布。\n6. **环境三套**：开发、测试、生产隔离；试点阶段可先合并。\n\n---"},{"h":"管理、监控与保护 AI 系统","body":"#### 这一节学什么\n这一节对应考纲任务 1.3「管理、监控与保护 AI 系统」。\n\n> 官方原名：Manage, monitor, and secure AI systems\n\n这一任务讲上线后的四件事：把配额与成本管住、把模型表现盯住、把数据链路看住、把安全边界守住。考题爱给症状——限流、漂移、摄取失败、密钥泄露——让你选处置。主线是：管资源 → 盯模型 → 看链路 → 守边界。\n\n#### 管理配额、缩放、速率限制与成本足迹\n\n> 官方原名：Manage quotas, scaling, rate limits, and cost footprints for model and agent workloads\n\n**这条在问什么。** 考题给「高峰被限流」「账单暴涨」这类症状，问配额、缩放、限流、成本各管什么、怎么配。\n\n**定义**：配额（quota）是订阅与资源级的使用上限；速率限制（rate limit）是单位时间的请求数约束，超了就返回限流错误；缩放（scaling）调整部署的并发能力；成本足迹指按部署、按应用归集的用量账。四样一起决定「跑得动、付得起」。\n\n**怎么运作**。管理四件：\n\n- 配额：上线前盘容量，缺额提前申请，别等撞墙。\n- 缩放：按流量峰谷配自动缩放，上限对齐配额。\n- 限流：客户端做退避重试，按返回的等待提示歇够了再发。\n- 成本：按部署与项目打标签归集，异常波动周会必看。\n\n**什么时候用，什么时候别用**。长尾突发流量用无服务器档让平台弹性扛；固定主力流量买容量。限流别硬闯——重试风暴会火上浇油，退避才是正解。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的营销活动预告了流量洪峰：提前扩容并申请临时配额，客户端把并发压在限流阈值七成。活动当天零限流报错，账单与预估只差百分之三。\n\n**关联服务**：Foundry 配额与容量、Azure 成本管理、Azure Monitor 指标与告警。\n\n#### 监控模型性能、漂移、安全事件与接地质量\n\n> 官方原名：Monitor model performance, drift, safety events, and grounding quality\n\n**这条在问什么。** 考题问：模型上线后要盯哪四类信号，各自说明什么问题。\n\n**定义**：模型性能看延迟与吞吐；漂移（drift）指输入分布或输出质量随时间偏移——用户问法变了、资料库变了，答案跟着变歪；安全事件指内容过滤触发与越界输出；接地质量看回答是否仍锚在检索资料上。\n\n**怎么运作**。监控四挂：\n\n1. 性能挂指标：延迟分位、吞吐、失败率出看板。\n2. 漂移挂对比：定期抽测固定问题集，答分掉了就报警。\n3. 安全挂审计：过滤触发按类目计数，突增即告警。\n4. 接地挂抽检：答案要能溯源到索引片段，抽检贴题率。\n\n**什么时候用，什么时候别用**。四个信号都该常开。抽测集别频繁换——换集子等于换尺子，读数失去可比性。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的问答机器人三个月后答分缓降。回放发现产品资料改版后索引没跟上：接地质量先掉、答分后掉。补一轮增量摄取后答分复原。没有常开的接地抽检，这病要拖到客户投诉才暴露。\n\n**关联服务**：Foundry 追踪与评估、Application Insights、Azure AI Content Safety 事件。\n\n#### 监控数据摄取质量、搜索索引健康与相关性表现\n\n> 官方原名：Monitor data ingestion quality, search index health, and relevance performance\n\n**这条在问什么。** 考题问：RAG 的上游——数据进得来吗、索引活得好吗、检索找得准吗——怎么各配监控。\n\n**定义**：数据摄取（ingestion）指资料进入索引的管道；索引健康看文档量、新鲜度与失败项；相关性表现看检索结果与问题的匹配度。上游三环坏一环，下游模型再好也白搭。\n\n**怎么运作**。三环各配表：\n\n- 摄取环：失败率与重试队列告警，坏文档隔离修复。\n- 索引环：文档计数对账，更新延迟超时即报。\n- 相关环：抽一组问题测命中率，索引变更前后各跑一遍留对比。\n\n**什么时候用，什么时候别用**。摄取失败与索引滞后是慢性病，靠告警早发现。相关性评测别只跑一次——索引结构或嵌入模型每次变动都要重跑。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的知识库每周自动对账：新文档数与索引增量数不齐就告警。某周发现两百份新文档卡在摄取队列，当晚补齐，客服答非所问的工单没有涨起来。\n\n**关联服务**：Azure AI Search 索引器与诊断、Foundry 摄取管线、Azure Monitor。\n\n#### 配置安全：托管标识、专用网络、无密钥凭据与角色策略\n\n> 官方原名：Configure security, including managed identity, private networking, keyless credentials, and role policies\n\n**这条在问什么。** 考题给安全要求——不出现密钥、不出公网、最小权限——问各配什么。\n\n**定义**：托管标识（managed identity）是平台自动管理的应用身份，凭据由平台轮换；无密钥凭据指全程用 Entra 令牌而非 API 密钥；专用网络（private networking）用私网终结点让流量不出公共网络；角色策略（role policy）按岗位给最小权限。\n\n**怎么运作**。四件配置：\n\n1. 身份：应用与管线各配托管标识，代码零密钥。\n2. 网络：资源走私网终结点，公网访问默认关。\n3. 凭据：全链用 Entra 令牌，密钥只留本地调试。\n4. 角色：开发、运维、管线各挂窄角色，授权审批留痕。\n\n**什么时候用，什么时候别用**。生产一律无密钥；本地快速验证可用密钥，但绝不进库。合规环境私网终结点是必选项；成本敏感的试点可后置，上生产前必须补。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的合规审计要求「零密钥入库」：代码库扫描无一处密钥，应用与管线各持托管标识，生产走私网终结点，审计一次通过。\n\n**最小示例**（教学示意，占位符换成自己的值；本地开发先执行 az login）：\n\n```python\nfrom azure.ai.projects import AIProjectClient\nfrom azure.identity import DefaultAzureCredential\n\nproject = AIProjectClient(\n    endpoint=\"https://<资源名>.services.ai.azure.com/api/projects/<项目名>\",\n    credential=DefaultAzureCredential(),  # 托管标识，全程无密钥\n)\nopenai = project.get_openai_client()\nreply = openai.responses.create(\n    model=\"<部署名>\",\n    input=\"用一句话说明无密钥凭据的好处\",\n)\nprint(reply.output_text)\n```\n\n**关联服务**：Microsoft Entra ID（托管标识与角色）、虚拟网络与私网终结点、Foundry 访问控制。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「被限流就加大重试」 | 重试风暴火上浇油；按退避策略歇够了再发 |\n| 2 | 「漂移是模型突然坏了」 | 多是资料与问法在变；先查接地与索引，再怪模型 |\n| 3 | 「摄取失败重跑就完」 | 坏文档要隔离修复；反复重跑会拖垮队列 |\n| 4 | 「密钥藏在配置文件里也算安全」 | 进库即风险；生产用托管标识与 Entra 令牌 |\n| 5 | 「私网是可选项」 | 合规环境必选；试点可后置，上生产必须补 |\n| 6 | 「告警开了就等于监控」 | 信号要能指向动作；只响不看的告警是摆设 |\n\n#### 记忆要点\n\n1. **四管**：配额盘容量、缩放配峰谷、限流走退避、成本打标签。\n2. **四看**：性能看分位、漂移看抽测、安全看触发、接地看溯源。\n3. **三环**：摄取管失败、索引管新鲜、相关管命中。\n4. **尺子别换**：抽测集固定不动，读数才可比。\n5. **安全四件**：托管标识、私网终结点、Entra 令牌、窄角色。\n6. **密钥零库**：生产无密钥，本地密钥不进库。\n\n---"},{"h":"在生成式与智能体系统落地负责任 AI","body":"#### 这一节学什么\n这一节对应考纲任务 1.4「在生成式与智能体系统落地负责任 AI」。\n\n> 官方原名：Implement responsible AI across generative AI and agentic systems\n\n这一任务把「负责任」落到配置：输入输出过滤、评估埋点、审计留痕、智能体治理四层。前两层管内容，后两层管行为。考题爱给事故场景，让你补该有的防线。主线是：过滤 → 评估 → 审计 → 治理。\n\n#### 配置安全过滤器、护栏、风险检测与内容审核\n\n> 官方原名：Configure safety filters, guardrails, risk detection, and content moderation\n\n**这条在问什么。** 考题给「输出违规内容」「用户诱导越界」的场景，问过滤器、护栏、风险检测、审核各拦在哪一层。\n\n**定义**：安全过滤器（safety filter）按类目对输入与输出内容做分级拦截；护栏（guardrail）是更宽的约束集，除内容外还管话题、格式与行为边界；风险检测识别提示注入这类攻击模式；内容审核（content moderation）对存量或流出内容做分类与处置。四层从输入到巡检层层设防。\n\n**怎么运作**。四层各就位：\n\n1. 输入过滤：先拦用户的违规与诱导输入。\n2. 输出过滤：生成结果按严重度分级，越线即截。\n3. 护栏约束：话题与行为边界写进系统层，模型碰线自纠。\n4. 审核巡检：抽检线上内容，处置分级——拦截、标注、放行。\n\n**什么时候用，什么时候别用**。面向公众的生成式应用四层全开。内部低风险工具可减配，但输入输出过滤别省。阈值别一刀切到最严——误拦率伤体验，按业务分级调。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的公共客服开着四层防线：有人诱导它「扮演系统管理员发指令」，输入过滤识别注入意图拦下；客户偶尔的口语粗话按低严重度放行，误拦率控制在一成以内。\n\n**关联服务**：Azure AI Content Safety（过滤与审核）、Foundry 护栏、内容过滤策略。\n\n#### 应用负责任 AI 埋点：评估器、安全评估与解释工具\n\n> 官方原名：Apply responsible AI instrumentation, including evaluators, safety evaluations, and explanation tooling\n\n**这条在问什么。** 考题问：怎么把「负责任」变成可测量的工程信号——评估器、安全评估、解释工具各测什么。\n\n**定义**：评估器（evaluator）是给生成结果打分的可复用组件，按维度产出指标；安全评估（safety evaluation）专跑安全维度——把攻击性提示集打进去，量出被突破的比例；解释工具（explanation tooling）帮人理解模型为什么这么答、依据在哪。三者合成「测得出、看得懂」的埋点。\n\n**怎么运作**。埋点三步：\n\n1. 装评估器：真实性与相关性这类维度先常驻。\n2. 跑安全评估：用攻击性提示集定期测突破率，改版必测。\n3. 挂解释：答案附依据片段与置信说明，供人复核。\n\n**什么时候用，什么时候别用**。面向外部用户或涉敏感内容的应用必配全套。纯内部低风险工具可轻配，但改版跑一轮安全评估是底线。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的保险顾问机器人每次改版先跑两百条攻击提示：诱导推荐免责条款、冒充监管发指令。上线版突破率压到百分之二以下，每条回答都带条款出处，客户可点开核对。\n\n**关联服务**：Foundry 评估工具（评估器与安全评估）、Azure AI Content Safety、解释与透明度文档。\n\n#### 通过轨迹日志、溯源元数据与审批流实现审计\n\n> 官方原名：Implement auditing through trace logging, provenance metadata, and approval workflows\n\n**这条在问什么。** 考题问：出了事要能回答「谁、何时、用了什么资料、谁批的」——审计三件怎么搭。\n\n**定义**：轨迹日志（trace logging）记录每次请求的完整调用链——提示、检索片段、工具调用、输出；溯源元数据（provenance metadata）标注内容的来源与生成方式——是不是模型生成、依据哪份资料；审批流（approval workflow）记录关键动作的人工批准链。三件合起来回答「为什么」。\n\n**怎么运作**。审计三搭：\n\n1. 轨迹留全链：每轮对话存调用链与版本号。\n2. 溯源标内容：输出打上生成方式与依据来源标记。\n3. 审批挂动作：高危操作先批后执行，批准人落记录。\n\n留存期与访问权限按合规要求定，审计数据本身也要最小授权。\n\n**什么时候用，什么时候别用**。涉监管、涉客户权益的场景三件全上。埋点字段别贪多——审计数据越全，隐私与存储压力越大，按「能回答审计问题」的最小集来。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的理赔助手给客户调整费率：轨迹显示它检索了三份保单条款、调了一次报价工具，调整建议挂审批流，主管批准后生效。三个月后客户投诉「凭什么调我的费率」，五分钟调出全链证据。\n\n**最小示例**（教学示意，占位符换成自己的值；日志字段按合规最小集裁剪）：\n\n```python\nimport json\nimport logging\n\naudit = logging.getLogger(\"agent-audit\")\n\ndef run_and_log(step, action, **context):\n    result = action()          # 执行智能体的一步\n    audit.info(json.dumps({\n        \"step\": step,\n        \"result\": bool(result),\n        \"context\": context,\n    }, ensure_ascii=False))\n    return result\n```\n\n每一步的输入摘要、工具与结果都进审计日志，出事时按会话回放即可。\n\n**关联服务**：Foundry 追踪、Application Insights 日志、Azure Logic Apps（审批流）。\n\n#### 用监督模式、约束与工具访问控制治理智能体行为\n\n> 官方原名：Govern agent behavior with oversight modes, constraints, and tool-access controls\n\n**这条在问什么。** 考题问：智能体的「自由度」怎么管——监督模式选哪档、约束加哪些、工具访问怎么卡。\n\n**定义**：监督模式（oversight mode）定自主档位——全自动、关键步人审、全程人审；约束（constraint）是行为边界——话题范围、输出格式、额度上限；工具访问控制（tool-access control）管智能体能调哪些工具、以什么身份调。三样合起来是智能体的「宪法」。\n\n**怎么运作**。治理三配：\n\n1. 定监督档：按风险选自主程度，涉钱涉对外从严。\n2. 加行为约束：禁区写明，越界动作直接拒。\n3. 卡工具权限：白名单窄授权，高危工具单独开卡。\n\n**什么时候用，什么时候别用**。对外发声、动数据、动钱的智能体必须半自主加审批；内部只读分析可以放开跑。约束别全塞提示词——提示词是软约束，权限与白名单才是硬边界。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的营销智能体只挂「查数据」与「草拟文案」两件工具，发布工具不在白名单——文案必须经人审核后由运营手动发布。上线半年零起事故。\n\n**关联服务**：Foundry Agent Service（监督与权限）、工具箱白名单、Microsoft Entra ID（工具身份）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「过滤器全开最安全」 | 误拦率伤业务；阈值按业务分级调 |\n| 2 | 「安全评估上线测一次就够」 | 攻击手段在变；改版必测 |\n| 3 | 「审计就是存日志」 | 要能按会话回放答「为什么」；存了不等于可查 |\n| 4 | 「约束写在提示词里就行」 | 提示词是软约束；权限与白名单才是硬边界 |\n| 5 | 「工具全挂上显得智能体能干」 | 工具越多误用面越大；白名单要窄 |\n| 6 | 「负责任 AI 是文档要求」 | 它是一组可测、可审计的工程配置 |\n\n#### 记忆要点\n\n1. **四层防线**：输入过滤、输出过滤、护栏约束、审核巡检。\n2. **埋点三件**：评估器常驻、安全评估定期、解释随答案。\n3. **审计三问**：谁动、凭什么、谁批的。\n4. **硬边界**：权限与白名单优先于提示词约束。\n5. **监督分档**：涉钱涉对外走半自主，只读分析可放开。\n6. **最小集原则**：埋点与审计字段按能答问题裁剪，不贪多。\n\n---"}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 1.1.1 | 按任务选模型与 Foundry Tools 的分工 | ⭐⭐⭐ | 情景单选/多选 |\n| 1.1.2 | 五类需求对五路服务的匹配 | ⭐⭐⭐ | 情景单选 |\n| 1.1.3 | 关键词、向量、混合检索的选型 | ⭐⭐⭐ | 情景单选 |\n| 1.1.4 | 记忆、工具、知识三件的选配 | ⭐⭐ | 单选/多选 |\n| 1.2.1 | 基础设施设计的环境隔离与凭据 | ⭐⭐ | 情景单选 |\n| 1.2.2 | 无服务器式与预留吞吐的取舍 | ⭐⭐⭐ | 情景单选 |\n| 1.2.3 | 部署配置与角色权限 | ⭐⭐ | 单选/多选 |\n| 1.2.4 | 定义入库与管线发布 | ⭐⭐ | 单选 |\n| 1.3.1 | 配额、缩放、限流与成本处置 | ⭐⭐ | 情景单选 |\n| 1.3.2 | 性能、漂移、安全事件、接地四信号 | ⭐⭐⭐ | 单选/多选 |\n| 1.3.3 | 摄取、索引、相关性三环监控 | ⭐⭐ | 单选 |\n| 1.3.4 | 托管标识、私网、无密钥与角色策略 | ⭐⭐⭐ | 情景单选/多选 |\n| 1.4.1 | 过滤器、护栏、风险检测、审核四层 | ⭐⭐⭐ | 情景单选 |\n| 1.4.2 | 评估器、安全评估与解释工具 | ⭐⭐ | 单选/多选 |\n| 1.4.3 | 轨迹、溯源、审批三件审计 | ⭐⭐ | 单选/排序 |\n| 1.4.4 | 监督模式、约束与工具访问控制 | ⭐⭐⭐ | 情景单选 |","services":"| 服务 | 主要用途 | 涉及知识点 |\n|---|---|---|\n| Microsoft Foundry 模型目录 | 模型与工具选型 | 1.1.1、1.1.2 |\n| Foundry 索引与向量搜索 / Azure AI Search | 接地与检索 | 1.1.2、1.1.3、1.1.4 |\n| Foundry Agent Service / 工具箱 | 智能体工作流与工具治理 | 1.1.2、1.1.4、1.4.4 |\n| Azure Content Understanding / Foundry Tools | 多模态处理与成品工具 | 1.1.1、1.1.2 |\n| Azure Cosmos DB / Azure 存储 | 长期记忆与数据底盘 | 1.1.4、1.2.1 |\n| Foundry 模型部署 / Foundry Local | 部署选项与本地形态 | 1.2.2、1.2.3 |\n| Microsoft Entra ID | 托管标识、无密钥与角色策略 | 1.2.3、1.3.4、1.4.4 |\n| Azure DevOps / GitHub Actions | CI/CD 管线 | 1.2.4 |\n| Azure 成本管理 / Azure Monitor | 配额成本与监控告警 | 1.3.1、1.3.2、1.3.3 |\n| Azure AI Content Safety / Foundry 护栏 | 过滤、审核与安全评估 | 1.3.2、1.4.1、1.4.2 |\n| Application Insights | 追踪与审计日志 | 1.3.2、1.4.3 |\n| Azure Logic Apps | 审批流编排 | 1.4.3 |","furtherReading":"| 页面 | 什么时候去看 | URL |\n|---|---|---|\n| Microsoft Foundry 文档枢纽 | 资源、项目与治理全景 | https://learn.microsoft.com/en-us/azure/foundry/ |\n| Foundry SDK 与端点总览 | 端点形态与角色权限口径 | https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview |\n| Foundry 模型部署类型 | 部署选项的官方口径 | https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types |\n| Azure AI Search 向量搜索总览 | 检索与索引方法官方口径 | https://learn.microsoft.com/en-us/azure/search/vector-search-overview |\n| AI-103 Study Guide | 本域技能点原文与权重区间 | https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/ai-103 |\n\n这些页面都是微软官方公开文档。中文资料与英文原文说法不一致时，以英文原文为准。\n\n\n> AI 生成"}},{"domain":2,"name":"实现生成式 AI 与 agentic 方案","weight":"30–35%","practice":[{"id":"D2-001","d":2,"t":"single","q":"客服机器人要回答客户关于公司产品手册的问题，手册每月更新，回答必须能溯源到具体条款。哪种方案最合适","o":[{"l":"A","t":"把手册内容微调进模型，每次更新就重训一次"},{"l":"B","t":"让模型凭已有知识直接回答，手册更新不影响结果"},{"l":"C","t":"用检索增强生成：先从最新手册检索相关段落，连问题一起交给模型生成并附出处"},{"l":"D","t":"把整本手册塞进每次提示词，不再单独检索"}],"a":["C"],"e":"✅ 正确项：C。RAG 先检索再生成，资料更新只需重建索引、不必重训模型，答案可附来源段落便于核对，正合「每月更新、要能溯源」的需求。关联考点：域 2.1.2「实现检索增强生成」。\n\n❌ A：微调重训成本高、周期长，手册月更就月训不现实，且微调不擅长给出可追溯的出处。\n❌ B：凭模型记忆回答正是 RAG 要解决的老毛病——知识有截止日期、不知道私有数据。\n❌ D：整本塞进提示会超上下文窗口、成本高，也失去了「先查再答、附出处」的检索逻辑。\n\n📌 关键概念：RAG＝检索段加生成段，解决知识截止与私有数据两个硬伤，资料会变、要溯源就用它。","s":"自编·2.1.2"},{"id":"D2-002","d":2,"t":"single","q":"团队要搭一个订单查询助手，动手前梳理设计件。下列哪项不属于讲义要求先定清楚的「四件设计件」","o":[{"l":"A","t":"助手的角色边界与语气禁区"},{"l":"B","t":"可验证的成功判据，比如「给出带出处的答复」"},{"l":"C","t":"每个工具的名称、参数与返回值的结构化描述"},{"l":"D","t":"模型训练时使用的具体 gpu 型号与显存大小"}],"a":["D"],"e":"✅ 正确项：D。本题问「不属于」，智能体动手前要定的是角色、目标、对话跟踪、工具结构四件，模型训练硬件不在其中。关联考点：域 2.2.1「定义智能体的角色、目标、对话跟踪与工具结构」。\n\n❌ A：角色卡属于四件之一，写进系统提示，边界越窄越稳。\n❌ B：目标与可验证的成功判据属于四件之一，给出「怎么算办成」。\n❌ C：工具结构属于四件之一，每个工具一份结构化描述，参数写全。\n\n📌 关键概念：先定四件设计件再动手——角色、目标、对话跟踪、工具结构；角色边界要窄、工具先少后多。","s":"自编·2.2.1"},{"id":"D2-003","d":2,"t":"single","q":"某团队刚在 Foundry 模型目录里选好了模型。接下来「部署」这个动作意味着什么","o":[{"l":"A","t":"把模型资源配置成一个可调用的终结点——一个能被代码访问的地址，应用通过它调用模型"},{"l":"B","t":"把模型文件下载到本地磁盘保存"},{"l":"C","t":"把模型的参数清单打印出来供人查阅"},{"l":"D","t":"给模型建一个展示页面，供网页浏览"}],"a":["A"],"e":"✅ 正确项：A。在 Foundry 里，部署就是把模型配成可用的终结点：定好部署名、算力与访问身份，之后应用通过这个地址调用模型。部署名固定供应用引用，换模型改部署不改代码。关联考点：域 2.1.1「部署并使用大模型、小模型、代码模型与多模态模型」。\n\n❌ B：部署不是下载存档，模型托管在平台上，本地存文件是误解。\n❌ C：查阅参数与调用无关，部署要的是可访问的通道。\n❌ D：展示页面不是程序可调用的接口，方向完全跑偏。\n\n📌 关键概念：部署＝模型变成终结点；部署时定三件事——选哪个模型、多大算力、什么身份访问。","s":"自编·2.1.1"},{"id":"D2-004","d":2,"t":"single","q":"Fabrikam 要给内部代码助手选模型：日常任务是把工程师的自然语言需求转成查询语句、补全代码片段、解释报错。按模型四型分工，最贴切的选型是","o":[{"l":"A","t":"多模态模型，能同时看图听音"},{"l":"B","t":"小模型，只要够便宜就行"},{"l":"C","t":"代码模型，针对代码生成与理解专门优化"},{"l":"D","t":"大模型但只用来聊天，代码另请外包"}],"a":["C"],"e":"✅ 正确项：C。转查询语句、补代码、解释报错都是代码类任务，代码模型正是针对代码生成与理解优化的那一型；按任务选型而不是按名气选型。关联考点：域 2.1.1「部署并使用大模型、小模型、代码模型与多模态模型」。\n\n❌ A：本题纯文本任务，多模态的能力用不上，白付成本。\n❌ B：只看便宜不看匹配，小模型未必擅长代码任务，效果先翻车。\n❌ D：代码助手要嵌入开发流程实时响应，外包流程接不上。\n\n📌 关键概念：模型四型——大模型通用、小模型省、代码模型专代码、多模态能看图；按任务复杂度选型。","s":"自编·2.1.1"},{"id":"D2-005","d":2,"t":"single","q":"某医疗咨询团队发现模型回答用药问题时张嘴就是过时结论，甚至编造不存在的配伍说法，而资料明明都在内部药典库里。最对症的方案是","o":[{"l":"A","t":"给模型加更多创意参数，让回答更丰富"},{"l":"B","t":"上检索增强生成：先从药典检索相关条目，连同问题交给模型生成，答案附出处"},{"l":"C","t":"把药典全部微调进模型"},{"l":"D","t":"换一个更大的模型，大模型记得多"}],"a":["B"],"e":"✅ 正确项：B。症状是「知识过时＋编造」，正是检索增强生成对症的两个硬伤：模型知识有截止日期、不知道私有资料。先从最新药典检索相关条目，再让模型基于资料作答，答案有据可核。关联考点：域 2.1.2「在应用里实现检索增强生成」。\n\n❌ A：加创意参数只会让输出更发散，编造更严重。\n❌ C：微调重训成本高周期长，药典一更新又得重训，且难给出处。\n❌ D：再大的模型知识也有截止日期，私有药典照样不知道。\n\n📌 关键概念：检索增强两段——检索段找资料、生成段据此作答；解决知识截止与私有数据两个硬伤。","s":"自编·2.1.2"},{"id":"D2-006","d":2,"t":"single","q":"Contoso 的合规问答要接一份三千页的行业法规全文。工程师讨论出几种做法，按讲义口径最合理的是","o":[{"l":"A","t":"每次把三千页全文塞进提示词，一步到位"},{"l":"B","t":"让模型凭训练知识回答法规问题"},{"l":"C","t":"把法规摘要后微调进模型"},{"l":"D","t":"建索引切块嵌化，问答时先检索相关条款段落，拼进提示再生成，附条款出处"}],"a":["D"],"e":"✅ 正确项：D。标准检索增强链路：法规切块转向量入索引；用户提问先检索最相关的几段，连同问题交给模型生成，末尾附出处可核对。资料更新只需重建索引，不重训模型。关联考点：域 2.1.2「在应用里实现检索增强生成」。\n\n❌ A：三千页远超上下文窗口，成本也无法承受，且「全量塞」不是检索逻辑。\n❌ B：法规是私有资料且常修订，模型记忆不可靠。\n❌ C：微调不解决时效，法规月月改，月月重训不现实。\n\n📌 关键概念：检索增强＝检索段加生成段；先查再答、附出处，资料会变、要溯源就用它。","s":"自编·2.1.2"},{"id":"D2-007","d":2,"t":"single","q":"某广告公司要用大模型做头脑风暴：一次要一百条产品口号，越多越怪越好，不需要任何外部资料。这种场景该不该加检索增强","o":[{"l":"A","t":"不必加：纯创意发散任务，直接调模型即可，加检索反而引入噪声"},{"l":"B","t":"必须加：一切生成任务都该先检索"},{"l":"C","t":"加检索并用旧案例库当素材，让模型照抄风格"},{"l":"D","t":"用翻译工具先处理口号再生成"}],"a":["A"],"e":"✅ 正确项：A。检索增强解决的是「要外部事实」的任务；纯头脑风暴不需要外部资料，直接调用模型发挥最大发散度。硬加检索反而把生成锚在旧资料上，创新被框死。关联考点：域 2.1.2「在应用里实现检索增强生成」。\n\n❌ B：「一切生成先检索」是过度架设，纯写作与头脑风暴不必检索。\n❌ C：照抄旧案例风格与头脑风暴求新的目标相反。\n❌ D：翻译工具与创意生成无关，答非所问。\n\n📌 关键概念：检索增强适配「要事实、要私有资料、要溯源」的任务；不需要外部事实就直接生成。","s":"自编·2.1.2"},{"id":"D2-008","d":2,"t":"single","q":"Contoso 的报销助手要做四步：读发票抽字段、查报销政策、比对金额是否超标、生成审批结论，每步还要能单独排查。最合适的结构是","o":[{"l":"A","t":"一次调用全包：把四件事写进一个长提示，让模型一口气做完"},{"l":"B","t":"拆成四个独立应用，各自人工传话"},{"l":"C","t":"多步推理管线：抽字段 → 查政策 → 比对 → 出结论，每步结果单独留存"},{"l":"D","t":"用翻译工具逐步转写再人工算"}],"a":["C"],"e":"✅ 正确项：C。多步任务拆成管线：每阶段产出中间结果再进下一步，出错时能定位是抽取偏了还是比对错了。报销助手四步正好对应管线四段，每步留痕可回放。关联考点：域 2.1.3「设计工作流、工具增强流程与多步推理管线」。\n\n❌ A：一口气做完无法分步校验，错一步全错，且长提示效果不稳。\n❌ B：人工传话效率低且引入转录错误，管线本来就是自动化串接。\n❌ D：转写与报销判断无关。\n\n📌 关键概念：流程三档——简单调用、工具增强、多步管线；步骤越多越要留中间状态。","s":"自编·2.1.3"},{"id":"D2-009","d":2,"t":"single","q":"某团队的任务是「把用户一句话的地址补充成标准格式」，输入输出都极简单。架构评审时有人提议上带工具调用的多步智能体管线。按讲义的「够用优先」口径，正确判断是","o":[{"l":"A","t":"智能体管线更高级，一定更好"},{"l":"B","t":"管线复杂度无所谓，反正云上算力管够"},{"l":"C","t":"必须上多步管线，因为智能体是趋势"},{"l":"D","t":"一步简单调用就够：单步任务别拆管线，多一步就多一处故障点"}],"a":["D"],"e":"✅ 正确项：D。地址标准化是典型的单步任务：一个问题一次生成即可。讲义口径明确——能一步说清的别拆成管线，多一步就多一处故障点、多一份状态管理成本。架构按任务复杂度配，不按潮流配。关联考点：域 2.1.3「设计工作流、工具增强流程与多步推理管线」。\n\n❌ A：「更高级」不等于「更合适」，简单任务上多步编排是过度设计。\n❌ B：成本与故障面客观存在，算力管够不代表该浪费。\n❌ C：跟风上智能体与任务需求脱节，正是讲义反对的「为架构好看拆」。\n\n📌 关键概念：简单调用＜工具增强＜多步管线，按任务需要升档，够用优先。","s":"自编·2.1.3"},{"id":"D2-010","d":2,"t":"multiple","q":"Fabrikam 改了一版客服机器人的提示词，上线前要评估。按讲义的评估口径，哪些做法正确（选所有适用项）","o":[{"l":"A","t":"凭工程师感觉：演示看着顺就行"},{"l":"B","t":"准备一组固定测试问题，新旧两版跑同一批，结果才可比"},{"l":"C","t":"维度看全：真实性（有没有编）、相关性（答到点上）、质量与安全都打分"},{"l":"D","t":"自动指标加人工抽查结合，生成内容过安全检查"},{"l":"E","t":"评估集每次跑之前重新生成一批，保持随机"}],"a":["B","C","D"],"e":"✅ 正确项：B、C、D。评估的骨架：固定测试集保证可比；四个维度打分看全——真实性防幻觉、相关性看切题、质量看表达、安全拦违规；自动指标与人工抽查结合，输出过安全检查。这套下来，改版优劣用分数说话。关联考点：域 2.1.4「评估模型与应用，包括发现幻觉、相关性、质量与安全问题」。\n\n❌ A：「感觉变好了」不是工程结论，分数才可比可追溯。\n❌ E：评估集每次换新等于换尺子，前后读数失去可比性。\n\n📌 关键概念：评估四看＋固定测试集；把「感觉」变成「同一批题上的分数」。","s":"自编·2.1.4"},{"id":"D2-011","d":2,"t":"single","q":"某知识库问答应用上线后，用户发现它偶尔「一本正经地胡说」：引用了根本不存在的文档编号。要发现这类问题，按讲义评估四维度，重点盯哪一维","o":[{"l":"A","t":"相关性——回答是否切题"},{"l":"B","t":"真实性——生成内容是否可回指到真实资料"},{"l":"C","t":"质量——表达是否通顺"},{"l":"D","t":"安全——内容是否合规"}],"a":["B"],"e":"✅ 正确项：B。「引用不存在的编号」是典型的幻觉（编造）：听起来合理但不真实。评估维度里的真实性专抓这个——检查生成内容能否回指到真实存在的资料，编号对不对得上原文。关联考点：域 2.1.4「评估模型与应用，包括发现幻觉、相关性、质量与安全问题」。\n\n❌ A：回答可能又切题又流畅，但编号是编的，相关性测不出来。\n❌ C：表达通顺与内容真伪无关，胡说也能说得漂亮。\n❌ D：编编号不涉违规内容，安全维度拦不住。\n\n📌 关键概念：幻觉＝听起来合理但不真实；真实性维度查「能不能回指到真资料」。","s":"自编·2.1.4"},{"id":"D2-012","d":2,"t":"single","q":"某团队改了模型参数与提示词之后直接上线，没跑任何评估。按讲义口径，这个流程错在哪","o":[{"l":"A","t":"错在改了提示词、换模型、调参数之后都必须跑同一评估集，凭分数决定上不上"},{"l":"B","t":"错在应该先跑一次再说，但评估集可以现编"},{"l":"C","t":"没错，只要上线后盯着用户投诉就行"},{"l":"D","t":"错在应该换更大的模型再上线"}],"a":["A"],"e":"✅ 正确项：A。改提示词、换模型、调参数——三类改动之后都必须跑评估：同一评估集上比新旧分数，幻觉率、相关性、安全分变了多少，用数据决定发布。跳过评估直接上线，等于把用户当测试集。关联考点：域 2.1.4「评估模型与应用，包括发现幻觉、相关性、质量与安全问题」。\n\n❌ B：评估集要固定沉淀，现编的集子没有基线可比。\n❌ C：靠投诉发现问题代价最高，评估要在上线前拦住。\n❌ D：换更大的模型同样要先评估，大不等于好。\n\n📌 关键概念：改动必评估——同一评估集、同一口径、分数说话。","s":"自编·2.1.4"}],"sections":[{"h":"用 Foundry 构建生成式应用","body":"### 这一域考什么\n\n这一域问的是：怎么用 Microsoft Foundry 把生成式 AI 和智能体（agent）做成能跑的应用。\n\n三条线串起全章：\n\n1. **做生成式应用**：把模型部署出来、接上去用，再补上「让模型查自家资料」的检索环节，对应任务 2.1（本文件展开）。\n2. **做智能体**：让模型不只会聊天，还能按角色分工、调用工具、多步推理，对应任务 2.2（本文件展开）。\n3. **调优与运维**：把生成效果调稳、把运行过程看清楚，对应任务 2.3（本文件展开）。\n\n这门课是助理级（Associate），考核动词以 Implement（实现）、Design（设计）、Build（构建）、Evaluate（评估）为主。它不考你背概念，考的是给你一个场景，你能说出该用哪个能力、怎么把它搭起来、哪里会踩坑。\n\n### 读完这个域要能做什么\n\n这门课写给有 Python 开发经验、用过 Azure 基础服务的同事。你会写代码，但还没把大模型接进真实应用。读完这个域应能：\n\n- 说清 Foundry 里「模型部署」和「直接调模型」的区别，按任务选对模型类型。\n- 讲出 RAG 解决什么问题，以及一次检索增强的问答是怎么走的。\n- 判断一个需求该用简单调用、工作流还是多步推理管线。\n- 说出怎么发现模型「一本正经地胡说」，怎么评估一版应用比另一版好。\n- 给定一个助手需求，说出智能体的角色、工具与记忆怎么定，多智能体怎么编排。\n- 说出调优生成行为的手段，以及上线后怎么把生成式系统观测清楚。\n\n### 和其他认证怎么接\n\n同一件事在别的学习路径里换了名字，认出来就不必重学。下面两条按「哪里像、哪里不一样」写。\n\n| 其他认证/能力 | 对应的那件事 | 这里有什么不同 | 什么时候该想起它 |\n|---|---|---|---|\n| AZ-900（Azure Fundamentals） | 都讲 Azure 上的 AI 服务 | AZ-900 只要求你认得「有这类服务」，本课要求你用 Python 把它接进应用 | 分不清某个服务是干什么的时候 |\n| AI 基础课（如 AIF-C01） | 都讲大模型、RAG、负责任 AI 的概念 | 基础课停在「是什么」，本课要你能实现和排错 | 概念没吃透、实现卡住时 |\n\n对照只用来迁移已有理解。做题以本域官方口径为准。\n\n### 官方口径的三条边界\n\n- 官方 Study Guide 只给技能点，不给题型，也不给题数。\n- 官方考试政策写明：考前不公布具体考试形式或题型。\n- 官方权重是 30–35% 这样的区间，不是精确占比。\n\n凡是官方没说的，表里就写官方未公布，不拿练习印象补空。\n\n#### 这一节学什么\n这一节对应考纲任务 2.1「用 Foundry 构建生成式应用」。\n\n> 官方原名：Build generative applications by using Foundry\n\n这一任务解决一个问题：怎么把一个大模型，从「模型库里的一个条目」变成「你的应用里能调用的能力」。六个技能点按顺序推进：先把模型部署并调用起来，再补上检索让它读自家资料，然后学会编排多步流程、评估效果，最后讲怎么从代码里接进 Foundry 项目。\n\n考题喜欢给一段应用场景，让你判断该用哪一步。学的时候抓住这条主线：部署 → 调用 → 增强 → 编排 → 评估 → 集成。\n\n#### 部署并使用大模型、小模型、代码模型与多模态模型\n\n> 官方原名：Deploy and consume LLMs, small models, code models, and multimodal models\n\n**这条在问什么。** 考题给你一个任务描述，让你选合适的模型类型，并说出模型部署好后怎么被调用。它同时考两件事：选模型，和「部署」这个动作到底意味着什么。\n\n**定义**：大模型（LLM，large language model）是参数规模很大、擅长通用语言任务的模型；小模型（small language model）体量更小，适合任务单一、要省成本或要在边缘跑的场合；代码模型专门针对代码生成与理解；多模态模型能同时处理文字、图片等多种输入。\n\n在 Foundry 里，「部署」是把模型资源配置成一个可用的终结点（endpoint）——一个能被代码访问的地址。部署之后，你的应用通过这个地址调用模型。\n\n**怎么运作**。部署时你要定三件事：\n\n- 选哪个模型：按任务复杂度、语言、是否需要看图来定。\n- 选多大算力：算力决定并发能力和成本。\n- 用什么身份访问：走密钥还是托管标识，决定凭据怎么管。\n\n**什么时候用，什么时候别用**。任务简单、调用频繁，小模型更划算；通用对话与复杂推理，用大模型。要处理图片，才上多模态模型。别一上来就选最大模型——成本按调用量累积，够用就好。\n\n💡 **场景举例**（虚构教学示意）：Contoso 要做一个客服问答。意图分类这一步很固定，用小模型；生成给客户的回复要用大模型；客户偶尔上传截图，单独走多模态模型。三个模型各自部署，按调用路由，成本和效果都可控。\n\n**关联服务**：Microsoft Foundry 模型目录与部署、Azure AI Inference（调用模型的 SDK）。\n\n#### 在应用里实现检索增强生成（RAG）\n\n> 官方原名：Implement retrieval-augmented generation (RAG) in an application\n\n**这条在问什么。** 考题给你「模型不知道公司内部资料」「回答要能溯源到文档」这类需求，让你认出答案是 RAG，并说出它的步骤。这是本域的高频考点。\n\n**定义**：RAG（retrieval-augmented generation，检索增强生成）是先把相关资料检索出来，再连同你的问题一起交给模型，让模型基于这些资料作答。它解决模型两个硬伤：知识有截止日期、不知道你的私有数据。\n\n**怎么运作**。一次 RAG 问答分两段：\n\n1. **检索段**：把用户问题转成向量（把文本变成数值表示，语义相近的文本数值也接近），到向量索引里找最相关的几段内容。\n2. **生成段**：把找到的内容和原问题拼成提示（prompt），交给模型生成答案。\n\n关键在于「先查再答」，而不是让模型凭记忆编。答案能附上来源片段，也便于人工核对。\n\n**什么时候用，什么时候别用**。资料会变、要能溯源、涉及私有数据，用 RAG。纯写作、头脑风暴这类不需要外部事实的任务，直接调模型即可，加检索反而引入噪声。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 的产品手册每月更新。客服机器人接 RAG：每次回答先从最新手册里检索相关段落，再生成回复，末尾附上出处条款。手册一更新，只需重建索引，不用重训模型。\n\n**关联服务**：Foundry 的索引与向量搜索、Azure AI Search（检索后端）、嵌入模型（把文本转向量）。\n\n#### 设计工作流、工具增强流程与多步推理管线\n\n> 官方原名：Design workflows, tool-augmented flows, and multistep reasoning pipelines\n\n**这条在问什么。** 考题问你：一个任务要分好几步、中间还要查工具，该怎么组织。答案是把流程拆成明确的工作流或推理管线，而不是指望模型一次说完。\n\n**定义**：工作流（workflow）是把多个步骤按固定或条件逻辑串起来的执行结构；工具增强流程指模型在过程中调用外部工具（查数据库、算数、取实时数据）；多步推理管线则是让模型分阶段思考、每阶段产出中间结果再进入下一步。\n\n**怎么运作**。三种形态按复杂度递增：\n\n- 简单调用：一个问题一次生成，适合单步任务。\n- 工具增强：模型在生成中调用工具拿数据，再继续生成。\n- 多步管线：把任务拆成规划、执行、校验等步骤，逐步推进。\n\n步骤越多，越要留中间状态，便于出错时定位是哪一步偏了。\n\n**什么时候用，什么时候别用**。能一步说清的，别拆成管线——多一步就多一处故障点。只有确实需要外部数据、或需要分阶段校验的复杂任务，才上工作流。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的报销助手要读发票、核对金额、查报销政策、再生成结论。做法是多步管线：抽字段 → 查政策 → 比对 → 出结论。每步结果单独留存，金额对不上时能定位到抽取还是比对环节。\n\n**关联服务**：Foundry 工作流编排、Azure Logic Apps（外部流程编排）、函数（Function）作为工具。\n\n#### 评估模型与应用，包括发现幻觉、相关性、质量与安全问题\n\n> 官方原名：Evaluate models and apps, including detecting fabrications, relevance, quality, and safety\n\n**这条在问什么。** 考题给你「怎么知道新版提示词是不是更好」「怎么发现模型在编造」，让你说出评估该看哪些维度、怎么做对比。\n\n**定义**：幻觉（fabrication）指模型生成了听起来合理但不真实的内容。评估就是从多个角度给模型或应用打分，判断它是否达标、是否比上一版更好。评估维度主要有四个：真实性（有没有编）、相关性（是否答到点上）、质量（表达与逻辑）、安全（有无违规内容）。\n\n**怎么运作**。评估通常这样做：\n\n- 准备一组固定测试问题，每次改动后都跑同一组，结果才可比。\n- 用自动指标（如相关性打分）加人工抽查结合。\n- 对生成内容做安全检查，过滤违规输出。\n\n关键是把「感觉变好了」变成「同一批题上分数变了」。\n\n**什么时候用，什么时候别用**。改提示词、换模型、调参数之后都要评估。需求简单、只跑一次的演示，可以只做基本安全检查，不必搭完整评估集。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 改了客服机器人的提示词。上线前用同一批 50 个历史问题跑新旧两版，发现幻觉率从 8% 降到 3%，但平均回答长度翻倍。团队据此判断可以上线，同时提示客户回复变长了。\n\n**关联服务**：Foundry 评估工具、Azure AI Content Safety（内容安全检测）、Application Insights（埋点观测）。\n\n#### 用 Foundry SDK 与连接器把生成式工作流集成进应用\n\n> 官方原名：Integrate generative workflows into applications by using Foundry SDKs and connectors\n\n**这条在问什么。** 考题问你：应用在代码里怎么调起 Foundry 上做好的能力。答案是靠软件开发工具包（SDK，software development kit）和连接器。\n\n**定义**：SDK 是一组封装好的代码库，让你的程序能方便地调用某个服务，而不用自己拼底层请求。连接器（connector）是预置的对接组件，把 Foundry 和你已有的数据源或应用串起来。\n\n**怎么运作**。应用侧大体三步：\n\n- 用 SDK 初始化客户端，带上终结点和凭据。\n- 调用部署好的模型或已发布的工作流。\n- 处理返回结果，接进自己的业务逻辑。\n\nFoundry 项目把模型、索引、工作流集中管理，应用只认项目给的接入点，内部换模型不用改应用代码。\n\n**什么时候用，什么时候别用**。写应用集成，用 SDK；要打通现成的企业数据源，先看有没有连接器，有就别自己写对接。原型阶段可以用 REST 请求直调，正式应用还是用 SDK 更稳。\n\n💡 **场景举例**（虚构教学示意）：Contoso 的门户要在页面上加智能问答。开发用 Foundry SDK 初始化客户端，调用已经发布的工作流；后台把模型从 A 换成 B，前端代码一行没动，因为它只认工作流接入点。\n\n**最小示例**（教学示意，占位符换成自己的值；生产环境凭据改用托管标识）：\n\n```python\nfrom azure.ai.inference import ChatCompletionsClient\nfrom azure.core.credentials import AzureKeyCredential\n\nclient = ChatCompletionsClient(\n    endpoint=\"https://<项目名>.models.ai.azure.com\",\n    credential=AzureKeyCredential(\"<密钥>\"),\n)\nreply = client.complete(\n    messages=[{\"role\": \"user\", \"content\": \"用一句话说明 RAG 的用途\"}],\n    model=\"<部署名>\",\n)\nprint(reply.choices[0].message.content)\n```\n\n**关联服务**：Foundry SDK（Python / .NET）、Foundry 连接器、项目级接入点。\n\n#### 配置应用连接到 Foundry 项目\n\n> 官方原名：Configure an application to connect to a Foundry project\n\n**这条在问什么。** 考题给你应用要连接项目的场景，让你说出连接要配置什么、凭据怎么给才安全。\n\n**定义**：Foundry 项目是把模型、索引、工作流集中管理的基本单元。应用连接项目，本质是配置两样东西：项目终结点（访问地址）和访问凭据（证明你有权限）。\n\n**怎么运作**。连接配置要点：\n\n- 终结点从项目设置里取，填进应用配置。\n- 凭据优先用托管标识（managed identity，由平台自动管理的身份），避免把密钥写进代码或配置文件。\n- 按最小权限原则，只给应用需要的角色。\n\n**什么时候用，什么时候别用**。本地开发图省事可以先用密钥，但密钥不能进代码库。上生产的正式应用一律用托管标识，凭据由平台轮换，人不用碰。\n\n💡 **场景举例**（虚构教学示意）：Fabrikam 把问答应用部署到 Azure 应用服务，给应用开了托管标识，在 Foundry 项目里给这个标识授予调用角色。代码里没有一字密钥，凭据由平台自动提供和轮换，泄露风险大幅降低。\n\n**关联服务**：Microsoft Entra ID（托管标识）、Foundry 项目设置与角色分配、Azure Key Vault（密钥场景下的保管）。\n\n#### 常见误区与易错点\n\n| # | 误区 | 正确理解 |\n|---|---|---|\n| 1 | 「RAG 是把资料塞进模型一起训练」 | RAG 是检索后拼进提示，不动模型权重；换资料只需重建索引 |\n| 2 | 「模型越大越好」 | 按任务选，简单高频任务用小模型更省，够用优先 |\n| 3 | 「一次调用能解决所有问题」 | 多步任务要拆成工作流，中间状态留痕才好排错 |\n| 4 | 「评估就是看回答顺不顺」 | 要按真实性/相关性/安全等维度、在固定测试集上对比 |\n| 5 | 「应用里可以先写死密钥，上线再改」 | 密钥易进代码库泄露；正式环境用托管标识 |\n| 6 | 「部署模型就是上传个文件」 | 部署是把模型配成可访问的终结点，涉及算力与身份配置 |\n\n#### 记忆要点\n\n1. **模型四型**：大模型通用、小模型省成本、代码模型专代码、多模态能看图。\n2. **RAG 两段**：先检索相关资料，再连同问题生成答案，解决私有数据与时效问题。\n3. **流程三档**：简单调用 < 工具增强 < 多步管线，够用优先，别过度编排。\n4. **评估四看**：真实性（防幻觉）、相关性、质量、安全，固定测试集才可比。\n5. **集成两件**：SDK 调用 + 连接器打通，应用只认项目接入点。\n6. **连接安全**：生产用托管标识，最小权限，密钥不进代码库。\n\n---"},{"h":"用 Foundry 构建智能体","body":"#### 这一节学什么\n这一节对应考纲任务 2.2「用 Foundry 构建智能体」。\n\n> 官方原名：Build agents by using Foundry\n\n这一任务把「会聊天」升级成「会办事」：智能体围绕自己的目标决定下一步做什么，必要时调用工具、记住对话、跨步骤推进。六个技能点按搭建顺序走：先定义清楚角色与工具结构；再把检索、函数调用、记忆接进来；然后是工具集成、多智能体编排与自主工作流的护栏；最后是上线后的监控与错误分析。\n\n考题爱给一个「要办成一件事」的需求，让你判断该定义什么角色、接什么工具、哪里要人审批。学的时候抓住主线：定义 → 组装 → 编排 → 设护栏 → 监控。\n\n#### 定义智能体的角色、目标、对话跟踪方式与工具结构\n\n> 官方原名：Define agent roles, goals, conversation-tracking approach, and tool schemas\n\n**这条在问什么。** 考题给你一个待搭建的助手需求，问动手前要先定哪些「设计件」。答案是四样：角色、目标、对话跟踪方式、工具结构。\n\n**定义**：智能体（agent）是能围绕目标自主决定下一步动作的 AI 程序。角色（role）是它的职责边界与人设；目标（goal）是它要达成什么、怎么算办成；对话跟踪（conversation tracking）是它怎么记住多轮上下文；工具结构（tool schema）是每个工具的名称、参数与返回值的正式描述，模型靠它判断何时调哪个工具。\n\n**怎么运作**。动手前把四件定清楚：\n\n- 角色卡：写进系统提示，含职责、语气与禁区，边界越窄越稳。\n- 目标与成功判据：给出可验证的完成标准，如「给出带出处的答复」。\n- 对话跟踪：短期用会话历史，长期用外部记忆存储，跨会话要落库。\n- 工具结构：每个工具一份结构化描述，参数名、类型、含义写全。\n\n**什么时候用，什么时候别用**。角色边界要窄——「万能助手」最容易失控。工具先少后多——每加一个工具就多一处误调用风险，够用即止。对话跟踪别全靠模型记忆，关键状态外置。\n\n💡 **场景举例**（虚构教学示意）：Contoso 要做差旅助手。角色定为「只管差旅申请与政策咨询」；目标定为「三问之内给出合规行程建议」；对话跟踪选会话历史加外部审批记录；工具只挂两个：查航班、查差旅政策。上线后误答率明显低于早期「全知型助手」版本。\n\n**关联服务**：Foundry Agent Service（Foundry 智能体服务）、Foundry SDK、Azure AI Search（长期记忆可检索化）。\n\n#### 构建整合检索、函数调用与对话记忆的智能体\n\n> 官方原名：Build agents that integrate retrieval, function-calling, and conversation memory\n\n**这条在问什么。** 考题问：智能体的三大件——查资料、调函数、记对话——分别怎么接进一个智能体，组合起来怎么跑。\n\n**定义**：检索（retrieval）让智能体能查自有资料；函数调用（function calling）让模型按工具结构决定调用哪个函数并填参数；对话记忆（conversation memory）保存历史消息，让多轮对话连贯。三件合起来，智能体才从「会说」变成「会做」。\n\n**怎么运作**。一轮典型交互走这条环：\n\n1. 用户输入进来，连同历史消息一起交给模型。\n2. 模型决定：直接答复，还是先调工具。\n3. 调工具就把参数交给对应函数执行，结果回填给模型。\n4. 模型结合工具结果继续推理，直到给出最终答复。\n\n每轮的工具调用与结果都记入对话轨迹，出错时能定位在哪一步。\n\n**什么时候用，什么时候别用**。问一句答一句的 FAQ，用普通对话调用即可，不必上智能体。要跨步骤、要外部数据、要保持状态的任务，才值得搭三件套。检索只挂在确实需要私有资料的智能体上，不然白增延迟。
