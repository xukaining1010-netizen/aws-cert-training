function renderQuiz() {
  const el = document.getElementById('page-quiz');
  if(!quizState || !quizState.questions.length) {
    el.innerHTML = `<div class="header"><button class="back-btn" onclick="navigate('dashboard')">←</button><h1>刷题</h1></div>
    <p style="text-align:center;margin-top:60px;color:var(--text2)">暂无题目，请从仪表盘选择模式开始练习</p>`;
    return;
  }
  const q = quizState.questions[quizState.currentIdx];
  const isHot = q.t === 'hot';
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  // 考核=仅本场作答；练习模式=全局历史（含本场）——防练习记录串进考核视图
  const answers = sessionScopedAnswers();
  const prevAnswers = answers.filter(a=>a.id===q.id);
  const everCorrect = prevAnswers.some(a=>a.ok);
  const everWrong = prevAnswers.some(a=>!a.ok);
  const answered = quizState.answered || {};
  let userAns = answered[q.id];
  const finished = quizState.submitted && quizState.submitted[q.id];
  const correct = finished && isAnswerCorrect(q, userAns);

  let modeLabel = quizState.mode==='exam'?'📋 模拟考核':quizState.mode==='wrong'?'❌ 错题重练':quizState.mode==='domain'?'📖 章节练习':quizState.mode==='single'?'📝 单题练习':'📝 顺序练习';

  let html = `<div class="quiz-header">
    <button class="back-btn" onclick="exitQuiz()">←</button>
    <span style="font-weight:600;font-size:15px">${modeLabel}</span>
    ${quizState.mode==='exam'?`<span class="timer" id="quizTimer"></span>`:''}
    <span class="quiz-progress">${quizState.currentIdx+1}/${quizState.questions.length}</span>
  </div>`;
  html += `<div class="quiz-meta">
    <span class="domain-tag">Domain ${q.d}</span>
    <span>${DOMAIN_NAMES[q.d]}</span>
    <span>${TYPE_NAMES[q.t]}</span>
    ${everCorrect?'<span style="background:rgba(6,214,160,.15);color:var(--correct)">已答对</span>':''}
    ${everWrong?'<span style="background:rgba(239,71,111,.15);color:var(--wrong)">曾答错</span>':''}
  </div>`;
  html += `<div class="question-text">${q.q}</div>`;

  const renderOpts = getOptionsHTML(q, userAns, finished, correct, getShuffledAnswer(q));
  html += renderOpts;

  if(isHot) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?'▶ 完成返回':'▶ 下一题'}</button>
    </div>`;
  } else if(!finished) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>✅ 确认</button>
    </div>`;
  } else {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?(quizState.mode==='exam'?'📊 交卷查看成绩':'▶ 完成返回'):'▶ 下一题'}</button>
    </div>`;
  }

  if(finished) {
    const badge = correct ? '✅ 回答正确!' : '❌ 回答错误';
    const cls = correct ? 'correct' : 'wrong';
    const gItems = getGlossaryForQuestion(q);
    let gHtml = '';
    if(gItems.length) {
      gHtml = '<div class="glossary"><div class="glossary-title">词汇附录</div>';
      gItems.forEach(g => {
        gHtml += '<div class="glossary-item"><span class="glossary-term">' + g.term + '</span><span class="glossary-def">\u00a0\u2014\u00a0' + g.def.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span></div>';
      });
      gHtml += '</div>';
    }
    html += `<div class="explanation show">
      <div class="result-badge ${cls}">${badge}</div>
      <div class="exp-text"><strong>正确答案：</strong>${formatAnswer(q)}</div>
      <div class="exp-text" style="margin-top:8px"><strong>解析：</strong>${highlightGlossaryTerms(fmtExp(q.e))}</div>
      ${q.s?`<div class="exp-source">来源：${q.s}</div>`:''}
      ${gHtml}
    </div>`;
  }

  html += `<div class="qnav"><h4>题号导航</h4><div class="qnav-grid">`;
  quizState.questions.forEach((qq, i) => {
    const qAnswers = answers.filter(a=>a.id===qq.id);
    const qCor = qAnswers.some(a=>a.ok);
    const qWro = qAnswers.some(a=>!a.ok);
    let cls = '';
    if(i===quizState.currentIdx) cls='current';
    else if(qCor) cls='done-correct';
    else if(qWro) cls='done-wrong';
    html += `<div class="qnav-item ${cls}" onclick="jumpToQuestion(${i})">${i+1}</div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
  if(!finished) updateSubmitButton();
}

function getOptionsHTML(q, userAns, finished, correct, shuffledAns) {
  let html = '';
  const qtype = q.t;
  if(qtype === 'hot') {
    html += `<div class="options-list" style="background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:16px">
      <div style="font-weight:600;color:var(--primary);margin-bottom:8px">🖱 本题为拖拽/操作题（HOTSPOT）</div>
      <div style="font-size:13px;line-height:1.7;color:var(--text2)">本题无标准 A/B/C/D 选项，答题形式为图形拖拽/区域选择。题目与图形见源 PDF 原图，答案请参照源文件。</div>`;
    if(q.e) {
      html += `<div style="margin-top:10px;font-size:13px;line-height:1.7;color:var(--text2);border-top:1px solid var(--border);padding-top:10px"><strong>解析/提示：</strong><br>${highlightGlossaryTerms(fmtExp(q.e))}</div>`;
    }
    html += `</div>`;
    return html;
  }
  if(qtype === 'single' || qtype === 'multiple') {
    const isMulti = qtype === 'multiple';
    html += `<div class="options-list">`;
    const opts = quizState.shuffledOptions && quizState.shuffledOptions[q.id] ? quizState.shuffledOptions[q.id] : q.o;
    opts.forEach(o => {
      const isSelected = userAns && userAns.includes(o.l);
      let cls = 'option-item';
      if(isMulti) cls += ' multi';
      if(isSelected && !finished) cls += ' selected';
      if(finished) {
        if(shuffledAns.includes(o.l)) cls += ' correct';
        else if(isSelected) cls += ' wrong';
      }
      const onclick = finished ? '' : `toggleOption('${o.l}')`;
      html += `<div class="${cls}" onclick="${onclick}">
        <span class="opt-label">${o.l}</span>
        <span>${o.t}</span>
      </div>`;
    });
    html += `</div>`;
    if(isMulti && !finished) html += `<div style="font-size:13px;color:var(--text2);margin-top:-12px;margin-bottom:16px">多选——请选择所有正确答案后提交（至少选 2 项）</div>`;
  }
  return html;
}

/* ================================================================
   ===================== 交互逻辑 =================================
   ================================================================ */

function toggleOption(label) {
  const q = quizState.questions[quizState.currentIdx];
  if(!quizState.answered) quizState.answered = {};
  if(q.t==='single') {
    quizState.answered[q.id] = [label];
  } else {
    const arr = quizState.answered[q.id] || [];
    const idx = arr.indexOf(label);
    if(idx>=0) arr.splice(idx,1);
    else arr.push(label);
    quizState.answered[q.id] = arr;
  }
  renderQuiz();
}

function updateSubmitButton() {
  const q = quizState.questions[quizState.currentIdx];
  if(q.t === 'hot') return;
  const ans = quizState.answered && quizState.answered[q.id];
  const btn = document.getElementById('submitBtn');
  if(!btn) return;
  if(q.t==='single') btn.disabled = !ans || !ans.length;
  else if(q.t==='multiple') btn.disabled = !ans || ans.length < 2;
}

function getShuffledAnswer(q) {
  if(quizState && quizState.shuffledAnswers && quizState.shuffledAnswers[q.id]) {
    return quizState.shuffledAnswers[q.id];
  }
  return q.a;
}

function isAnswerCorrect(q, userAns) {
  if(!userAns) return false;
  const ca = getShuffledAnswer(q);
  if(q.t==='single') return userAns[0]===ca[0];
  if(q.t==='multiple') { const a=[...userAns].sort(); const b=[...ca].sort(); return JSON.stringify(a)===JSON.stringify(b); }
  return false;
}

function formatAnswer(q) {
  const ca = getShuffledAnswer(q);
  if(q.t==='single'||q.t==='multiple') return ca.join(', ');
  if(q.t==='hot') return '本题为拖拽/操作题，答案为图形区域匹配，见源 PDF 原图';
  return '';
}

function submitAnswer() {
  const q = quizState.questions[quizState.currentIdx];
  let userAns = quizState.answered && quizState.answered[q.id];
  if(!userAns) return;
  if(q.t==='multiple' && userAns.length < 2) {
    alert('多选题至少选择 2 个答案，当前只选了' + userAns.length + '个');
    return;
  }
  const correct = isAnswerCorrect(q, userAns);
  if(!quizState.submitted) quizState.submitted={};
  quizState.submitted[q.id]=true;
  // 本场作答留痕（考核判分唯一依据；不与全局统计混用）
  if(!quizState.results) quizState.results={};
  quizState.results[q.id]={ua:[...userAns], ok:correct, ts:Date.now()};
  recordAnswer(q.id, userAns, correct);
  renderQuiz();
  updateSubmitButton();
}

function prevQuestion() {
  if(quizState.currentIdx > 0) { quizState.currentIdx--; renderQuiz(); }
}
function nextQuestion() {
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  if(isLast) {
    if(quizState.mode==='exam') renderExamResult();
    else navigate('dashboard');
  } else {
    quizState.currentIdx++;
    renderQuiz();
  }
}
function jumpToQuestion(idx) {
  quizState.currentIdx = idx;
  renderQuiz();
}
function exitQuiz() {
  // 考核中途退出必须停表：否则过期计时器归零时会把之后的练习页改写成「考核成绩单」
  if(quizState && quizState.mode==='exam') stopExamTimer();
  if(quizState && quizState.mode!=='exam') {
    setProgress({mode:quizState.mode,domain:quizState.domain||null,idx:quizState.currentIdx,time:Date.now()});
  }
  quizState = null;
  navigate('dashboard');
}

/* ================================================================
   ===================== 刷题模式启动 ==============================
   ================================================================ */
function startDomain(d) {
  const qs = QUESTIONS.filter(q=>q.d===d);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'domain',domain:d,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startContinue() {
  const p = getProgress();
  if(p.mode && p.mode!=='exam') {
    if(p.mode==='domain' && p.domain) {
      const qs = QUESTIONS.filter(q=>q.d===p.domain);
      const _sr=generateShuffledOptions(qs);
      quizState = {mode:'domain',domain:p.domain,questions:qs,currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    } else {
      const _sr=generateShuffledOptions([...QUESTIONS]);
      quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    }
  } else {
    const _sr=generateShuffledOptions([...QUESTIONS]);
    quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  }
  navigate('quiz');
}
function startWrongReview() {
  const wrong = getWrong().filter(w=>!w.mastered);
  if(!wrong.length) { alert('暂无错题需要复习！'); return; }
  const qs = wrong.map(w=>getQById(w.id)).filter(Boolean);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'wrong',domain:null,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startSingle(id) {
  const q = getQById(id);
  if(!q) return;
  const _sr=generateShuffledOptions([q]);
  quizState = {mode:'single',domain:null,questions:[q],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startExam() {
  // 模拟考核：按 meta 权重 × meta 题数分配各域配额（最大余数法，保证总和=EXAM_COUNT）
  const counts = {};
  let sumInt = 0;
  const raw = {}, rem = {};
  DOMAIN_KEYS.forEach(k => {
    const w = parseFloat(String(DOMAIN_WEIGHTS[k]||'0').replace('%',''))/100;
    raw[k] = w * EXAM_COUNT;
    counts[k] = Math.floor(raw[k]);
    rem[k] = raw[k] - counts[k];
    sumInt += counts[k];
  });
  let deficit = EXAM_COUNT - sumInt;
  const order = [...DOMAIN_KEYS].sort((a,b)=>rem[b]-rem[a]);
  let i = 0;
  while(deficit > 0) { counts[order[i % order.length]]++; deficit--; i++; }
  let selected = [];
  DOMAIN_KEYS.forEach(d => {
    const pool = shuffle(QUESTIONS.filter(q=>q.d===d && q.t!=='hot'));
    selected.push(...pool.slice(0, counts[d]));
  });
  selected = shuffle(selected);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam',domain:null,questions:selected,currentIdx:0,answered:{},submitted:{},results:{},shuffledOptions:_exam.opts,shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  // 场次标识：计时回调据此判定「本场是否仍在进行」，防过期计时器串场
  quizState.examToken = 'ex-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

function startRealExam() {
  // 全真模考：固定用模考池出卷（题数/计分结构/时长按官方口径），每次只重排题序与选项。
  // 与随机模考的区别：题目固定可复现，分数可跨场对比；题目与练习池隔离，平时练不到。
  const pool = MOCK_QUESTIONS.slice();
  if(!pool.length) { alert('本卷未配置模考池，请用随机模考'); return; }
  const selected = shuffle(pool);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam', fullMock:true, domain:null, questions:selected, currentIdx:0, answered:{}, submitted:{}, shuffledOptions:_exam.opts, shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  quizState.examToken = 'mx-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

let examTimerInterval = null;
function stopExamTimer() {
  if(examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
}
function startExamTimer() {
  let secs = quizState.examDuration;
  const token = quizState.examToken;
  const timerEl = document.getElementById('quizTimer');
  if(!timerEl) return;
  stopExamTimer();
  examTimerInterval = setInterval(() => {
    // 场次校验：已退出或已换场（新 token）立即自毁
    if(!quizState || quizState.mode!=='exam' || quizState.examToken!==token) { stopExamTimer(); return; }
    secs--;
    const m = Math.floor(secs/60), s = secs%60;
    const el = document.getElementById('quizTimer');
    if(el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if(secs<=60 && el) el.classList.add('warning');
    if(secs<=0) { stopExamTimer(); finishExam(token); }
  }, 1000);
}

function finishExam(token) {
  stopExamTimer();
  // 只对「发起本场计时」的考核会话生效
  if(quizState && quizState.mode==='exam' && (token===undefined || quizState.examToken===token)) renderExamResult();
}

function renderExamResult() {
  if(!quizState) return;
  stopExamTimer();
  const qs = quizState.questions;
  const results = quizState.results || {};
  const fullMock = !!quizState.fullMock;
  // 全真模考按官方口径只判计分题（50 题）；随机模考与其它模式仍整卷计分
  const counted = fullMock ? qs.filter(q => MOCK_SCORED.has(q.id)) : qs;
  const total = counted.length;
  // 逐题按本场作答判分；全局历史与往场作答一律不计
  let correct = 0, wrong = 0, unanswered = 0;
  const domStat = {};
  DOMAIN_KEYS.forEach(d => domStat[d] = {n:0, cor:0});
  counted.forEach(q => {
    if(!domStat[q.d]) domStat[q.d] = {n:0, cor:0};
    domStat[q.d].n++;
    const r = results[q.id];
    if(!r) unanswered++;
    else if(r.ok) { correct++; domStat[q.d].cor++; }
    else wrong++;
  });
  // 不变量自校验：正确 + 错误 + 未答 必须等于计分题数
  if(correct + wrong + unanswered !== total) console.warn('[exam] 判分不变量异常', {correct, wrong, unanswered, total});
  const el = document.getElementById('page-quiz');
  const pct = total ? Math.round(correct/total*100) : 0;
  // 1000-point scale, 700 to pass
  const scaledScore = total ? Math.round(correct/total*1000) : 0;
  const passed = scaledScore >= EXAM_PASS;
  // Time used
  const timeUsed = quizState.examStartTime ? Math.round((Date.now()-quizState.examStartTime)/1000) : 0;
  const timeM = Math.floor(timeUsed/60), timeS = timeUsed%60;

  // Domain breakdown
  let domainHtml = '';
  for(const d of DOMAIN_KEYS) {
    const dd = domStat[d] || {n:0, cor:0};
    const dPct = dd.n ? Math.round(dd.cor/dd.n*100) : 0;
    domainHtml += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${dd.n}</td><td>${dd.cor}</td><td style="color:${dPct>=70?'var(--correct)':'var(--wrong)'}">${dPct}%</td></tr>`;
  }

  el.innerHTML = `<div class="header"><button class="back-btn" onclick="exitExam()">←</button><h1>${fullMock ? '🎯 全真模考成绩单' : '📋 考核成绩单'}</h1></div>
  <div style="text-align:center;padding:30px 20px">
    <div style="font-size:48px;font-weight:700;color:${passed?'var(--correct)':'var(--wrong)'}">${scaledScore}</div>
    <div style="font-size:14px;color:var(--text2);margin:4px 0">满分 1000 分 | 及格线 ${EXAM_PASS} 分${fullMock ? " | 计分题 " + total + " 题（卷面 " + qs.length + " 题，不计分 " + (qs.length - total) + " 题）" : ""}</div>
    <div style="font-size:16px;color:var(--text);margin:12px 0;font-weight:600">${passed?'✅ 通过！':'❌ 未通过'}</div>
    <div style="display:flex;justify-content:center;gap:20px;margin:16px 0;flex-wrap:wrap">
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--correct)">${correct}</div><div style="font-size:12px;color:var(--text2)">正确</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--wrong)">${wrong}</div><div style="font-size:12px;color:var(--text2)">错误</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text2)">${unanswered}</div><div style="font-size:12px;color:var(--text2)">未答</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--primary)">${pct}%</div><div style="font-size:12px;color:var(--text2)">正确率</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text)">${timeM}分${timeS.toString().padStart(2,'0')}秒</div><div style="font-size:12px;color:var(--text2)">用时</div></div>
    </div>
  </div>
  <div class="stats-chart">
    <h3>各章节成绩</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>题数</th><th>正确</th><th>正确率</th></tr></thead><tbody>
    ${domainHtml}
    </tbody></table>
  </div>
  <div style="text-align:center;padding:20px">
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn-secondary" onclick="exitExam()" style="width:auto">返回首页</button>
      <button class="btn-primary" onclick="${fullMock ? 'startRealExam()' : 'startExam()'}" style="width:auto;flex:none">再考一次</button>
    </div>
  </div>`;
  quizState = null;
}

function exitExam() {
  quizState = null;
  navigate('dashboard');
}

    <div class="stat-card"><div class="stat-num">${wrong.length+mastered.length}</div><div class="stat-label">共错题</div></div>
  </div>`;
  html += `<div class="wrong-tabs">
    <button class="wrong-tab ${wrongFilter===0?'active':''}" onclick="wrongFilter=0;renderWrongBook()">全部</button>`;

    html += `<button class="wrong-tab ${wrongFilter===d?'active':''}" onclick="wrongFilter=${d};renderWrongBook()">${DOMAIN_NAMES[d]}</button>`;
  }
  html += `</div>`;
  let items = wrongFilter ? wrong.filter(w=>{const q=getQById(w.id);return q&&q.d===wrongFilter}) : wrong;
  items.sort((a,b)=>b.count-a.count);

        <div class="wi-header">
          <span><strong>Domain ${q.d}</strong> | ${TYPE_NAMES[q.t]}</span>

        </div>
        <div style="font-size:14px;margin-bottom:6px">${q.q.slice(0,60)}${q.q.length>60?'…':''}</div>

        <div class="wi-actions">
          <button onclick="startSingle('${w.id}')">📝 重练本题</button>

    html += `<button class="btn-secondary" onclick="if(confirm('确定清空所有已掌握的错题吗？')){setWrong(getWrong().filter(w=>!w.mastered));renderWrongBook();}" style="width:auto">清空已掌握</button></div>`;

}

function renderStats() {
  const s = getStats();
  const el = document.getElementById('page-stats');
  let html = `<div class="header"><h1>📊 统计分析</h1></div>`;
  html += `<div class="stats-chart">
    <h3>总进度</h3>
    <div style="height:30px;background:var(--border);border-radius:15px;overflow:hidden">
      <div style="height:100%;width:${s.completion}%;background:var(--primary);border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600">${s.completion}%</div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--text2)">
      <span>已答 ${s.doneIds}/${QUESTIONS.length} 题</span>
      <span>正确率 ${s.acc}%</span>
    </div>
  </div>`;
  html += `<div class="stats-chart"><h3>各章节正确率</h3><canvas id="chartDomain"></canvas></div>`;
  html += `<div class="stats-chart"><h3>各题型正确率</h3><canvas id="chartType"></canvas></div>`;
  html += `<div class="stats-chart"><h3>详细数据</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>总题</th><th>已答</th><th>正确</th><th>正确率</th></tr></thead><tbody>`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${ds.total}</td><td>${ds.answered}</td><td>${ds.correct}</td><td style="color:${ds.acc>=70?'var(--correct)':'var(--wrong)'};font-weight:600">${ds.acc}%</td></tr>`;
  }
  html += `</tbody></table></div>`;
  el.innerHTML = html;
  setTimeout(() => {
    drawDomainChart(s);
    drawTypeChart(s);
  }, 50);
}

function drawDomainChart(s) {
  const c = document.getElementById('chartDomain');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = DOMAIN_KEYS.map(k=>'D'+k);
  const colors = ['#4361ee','#4cc9f0','#06d6a0','#f8961e','#9b5de5'];
  const barW = (W-80) / (labels.length*1.5);
  labels.forEach((l,i)=>{
    const val = s.domainStats[i+1].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(l, x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

function drawTypeChart(s) {
  const c = document.getElementById('chartType');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = ['单选','多选'];
  const keys = ['single','multiple'];
  const colors = ['#4361ee','#4cc9f0'];
  const barW = (W-80) / 4;
  keys.forEach((k,i)=>{
    const val = s.typeStats[k].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

/* roundRect polyfill */
if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(r>w/2) r=w/2;
    if(r>h/2) r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    return this;
  };
}

/* ================================================================
   ===================== 工具函数 ==================================
   ================================================================ */
function exportData() {
  const data = {
    answers: getAnswers(),
    wrong: getWrong(),
    progress: getProgress(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${LS_PREFIX}-quiz-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.answers) setAnswers(data.answers);
        if(data.wrong) setWrong(data.wrong);
        if(data.progress) setProgress(data.progress);
        alert('数据导入成功！');
        navigate(currentPage);
      } catch(err) { alert('数据格式错误，请检查文件。'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetData() {
  showModal('确认重置', '确定要清除所有答题记录、错题集和进度吗？此操作不可恢复！', () => {
    localStorage.removeItem(LS_ANSWERS);
    localStorage.removeItem(LS_WRONG);
    localStorage.removeItem(LS_PROGRESS);
    navigate('dashboard');
  });
}

let modalCallback = null;
function showModal(title, text, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOverlay').classList.add('show');
  modalCallback = onConfirm;
  document.getElementById('modalConfirmBtn').onclick = () => {
    closeModal();
    if(modalCallback) modalCallback();
  };
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function toggleTheme() {
  document.getElementById('quizView').classList.toggle('dark');
  localStorage.setItem(LS_PREFIX+'_theme', document.getElementById('quizView').classList.contains('dark')?'dark':'light');
  navigate(currentPage);
}

/* ================================================================
   ===================== 初始化 ====================================
   ================================================================ */
function init() {
  if(localStorage.getItem(LS_PREFIX+'_theme')==='dark') document.getElementById('quizView').classList.add('dark');
  const pages = ['dashboard','quiz','wrongbook','stats','settings'];
  const app = document.getElementById('app');
  pages.forEach(p => {
    const div = document.createElement('div');
    div.id = 'page-'+p;
    div.className = 'page' + (p==='dashboard'?' active':'');
    app.appendChild(div);
  });
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => { if(btn.dataset.page==='learn'){ if(window.kbShowLearnHome) window.kbShowLearnHome(); } else navigate(btn.dataset.page); });
  });
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', init);

const LEARNING_DATA = {"meta":{"exam":"GH-300","title":"GitHub Copilot 学习与刷题","lang":"zh","updated":"2026-11-11","examInfo":{"quickCards":[{"num":"100","label":"考试时长(分钟)"},{"num":"700/1000","label":"及格分数(scaled)"},{"num":"6","label":"考试域数"},{"num":"Pearson VUE","label":"交付方"},{"num":"Intermediate","label":"级别"},{"num":"$99*","label":"费用(美国区·地区浮动)","sub":"🔴 官方无固定价，以预约页为准；*为第三方估计"}],"domains":[{"code":"D1","name":"负责任地使用 Copilot","weight":"15–20%"},{"code":"D2","name":"使用 Copilot 功能","weight":"25–30%"},{"code":"D3","name":"数据与架构","weight":"10–15%"},{"code":"D4","name":"提示工程与上下文","weight":"10–15%"},{"code":"D5","name":"提升开发生产力","weight":"10–15%"},{"code":"D6","name":"隐私、排除与保障","weight":"10–15%"}],"where":["Pearson VUE 考试中心 / 在线监考（OnVUE），自 2025-07-01 起独家交付","考试语言：英语、西班牙语、葡萄牙语(巴西)、韩语、日语","建议经验：GitHub 基础 + 至少一门编程语言；无强制前置考试","🔴 题数官方未公布（第三方估约 60 计分 + 10–15 预试）；时长 100 分钟"],"steps":[{"n":"① 注册","note":"用个人 Microsoft 账户注册（避免组织账户丢失记录）"},{"n":"② 免费练习","note":"认证页 Practice Assessment + Exam Sandbox"},{"n":"③ 预约","note":"Pearson VUE，最多提前 90 天"},{"n":"④ 备考","note":"Microsoft Learn Copilot Fundamentals Part1&2 + 本教材"}],"faq":[{"q":"考试期间能打开 Microsoft Learn 查资料吗？","a":"不能。GitHub 考试不允许考试期间打开 Learn（不同于 Microsoft 角色型考试），且结束不立即显示通过/未通过，正式成绩在 Exam History 查看。"},{"q":"考不过怎么办？","a":"首次未通过 24 小时后可重考；后续每次间隔按 Microsoft 重考政策（通常 14 天）；12 个月内最多 5 次尝试。"},{"q":"证书有效期多久？如何续期？","a":"🔴 口径冲突：GitHub 历史 2 年，正迁移至 Microsoft 角色型 1 年免费在线续期；过渡期过期凭证获 6 个月宽限。以考生凭证账户记录为准，勿套用 Microsoft 年度规则。"},{"q":"费用是多少？","a":"🔴 按地区浮动，官方无固定价；第三方估美国区约 $99。以 Pearson VUE 预约页为准。"},{"q":"数据以官网为准","a":"以上政策核实自 Microsoft Learn GH-300 Study Guide / Exam Details 与 GitHub Docs（核实日 2026-10-10）；有变更以官方页面为准。"}]},"plan":[{"day":1,"domain":2,"topic":"域2 功能使用·IDE触发 + CLI","focus":"权重最高 25–30%，先打触发方式与 CLI 基础"},{"day":2,"domain":2,"topic":"域2·Agent Mode/MCP/Spaces/指令文件","focus":"2026-08 修订重点，密集命名功能"},{"day":3,"domain":2,"topic":"域2·组织级治理(策略/审计/REST API)","focus":"管理员视角，考试必考"},{"day":4,"domain":1,"topic":"域1 负责任AI·验证与责任运营","focus":"15–20%，判断型题目"},{"day":5,"domain":4,"topic":"域4 提示工程·zero/few-shot","focus":"实操型，配合真实 Copilot 练习"},{"day":6,"domain":3,"topic":"域3 数据与架构·生命周期","focus":"10–15%，理解数据边界"},{"day":7,"domain":6,"topic":"域6 隐私·内容排除/公共代码过滤","focus":"10–15%，配置与排障"},{"day":8,"domain":5,"topic":"域5 生产力·测试与安全","focus":"10–15%，场景匹配"},{"day":9,"domain":0,"topic":"全真模拟 + 错题复盘","focus":"100 分钟/700 分；过一遍全部练习题"}],"level":"Intermediate","cnName":"GitHub Copilot 认证"},"chapters":[{"domain":1,"name":"负责任地使用 Copilot","weight":"15–20%","sections":[{"h":"域定位","body":"第二大域（15–20%），考「用得对不对」而非「会不会用」。涵盖负责任 AI 原则、生成式 AI 风险与局限、伦理使用、潜在危害与缓解、AI 产出验证与责任运营。题目偏判断型。"},{"h":"核心要点","body":"- 负责任 AI 原则：公平、可靠安全、隐私、透明、问责。\n- 生成式 AI 局限：训练数据时效、幻觉、概率性不一致。\n- 验证必要性：输出未经运行/测试不可假定正确；人在回路、人负最终责任。\n- 💡 虚构场景：Copilot 生成处理密码的代码未做哈希——责任运营要求改用标准加密库，而非直接合入。"}],"practice":[{"id":"D1-01","q":"为什么 GH-300 强调「必须验证 AI 输出」？","o":[{"l":"A","t":"因为 Copilot 总是返回最优解"},{"l":"B","t":"因为 LLM 是概率性输出，可能产生幻觉或引用已废弃/不存在的 API，未经运行与测试不可假定正确"},{"l":"C","t":"因为 Microsoft 强制要求签署验证声明"},{"l":"D","t":"因为 Copilot 不生成可执行代码"}],"a":"B","e":"✅ LLM 概率性 + 时效局限 → 输出须编译/运行/单测/评审后采用。❌ A/C/D 均错。📌 人在回路是核心。"},{"id":"D1-02","q":"以下哪些属于负责任 AI 的潜在危害缓解措施？（多选）","o":[{"l":"A","t":"人工审查并验证生成代码"},{"l":"B","t":"启用内容排除，防止敏感文件进入上下文"},{"l":"C","t":"直接合入未测试的生成代码以提速"},{"l":"D","t":"建立团队 Copilot 使用规范"}],"a":"A,B,D","e":"✅ A验证/B数据边界/D制度均为缓解手段。❌ C 是高风险的错误做法。"}]},{"domain":2,"name":"使用 Copilot 功能","weight":"25–30%","sections":[{"h":"域定位","body":"最大且最密集的域（25–30%），2026-08-07 修订扩充最多。三子簇：IDE 内使用、Copilot CLI、功能与能力（含组织级治理）。难点在第三簇的 Agent Mode / Sub-Agents / MCP / Spaces / 指令文件与组织治理。"},{"h":"三大子簇","body":"- IDE：启用、触发方式（inline/chat/CLI/agent mode）、内容排除。\n- CLI：gh copilot explain/suggest、安装、交互/会话、生成脚本管理文件。\n- 功能与能力：Agent Mode、Copilot Edits、MCP、Agent Sessions、Sub-Agents、代码评审、Spaces、Spark、PR 摘要、instructions 文件、Copilot Chat 命令与 prompt file 复用；组织策略管理、Code Review 策略、审计日志、REST API 订阅管理。\n- 💡 虚构场景：企业用 copilot-instructions.md 固化规范 + 管理员用审计日志追踪启用情况。"}],"practice":[{"id":"D2-01","q":"在 IDE 中，Copilot Agent Mode 的主要能力是？","o":[{"l":"A","t":"仅做单文件内联补全"},{"l":"B","t":"多文件编辑并访问终端，可将任务委派给 Sub-Agents 以优化上下文使用"},{"l":"C","t":"仅用于解释终端命令"},{"l":"D","t":"仅生成文档字符串"}],"a":"B","e":"✅ Agent Mode = 多文件编辑 + 终端 + 委派 Sub-Agents。❌ A 是 inline；C 是 CLI；D 是文档生成。📌 属 2026-08 修订重点。"},{"id":"D2-03","q":"企业管理员希望统一管控 Copilot 功能可用性与合规，应优先使用？","o":[{"l":"A","t":"仅依赖每位开发者的个人设置"},{"l":"B","t":"组织范围策略管理 + 审计日志事件 + 通过 REST API 管理订阅"},{"l":"C","t":"直接关闭所有 Copilot 功能"},{"l":"D","t":"仅使用内容排除"}],"a":"B","e":"✅ 组织治理三件套 = 策略 + 审计 + REST API。❌ A/C/D 不足。"}]},{"domain":3,"name":"数据与架构","weight":"10–15%","sections":[{"h":"域定位","body":"考 Copilot 如何处理数据：数据流转、输入处理与提示构建、代理过滤与后处理、生命周期与 LLM 局限。与域 6 互为表里，权威源 GitHub Trust Center。"},{"h":"核心要点","body":"- 数据流转：上下文收集 → 提示构建 → 推理 → 代理过滤/后处理 → 呈现；企业/个体在数据共享与 IP 赔偿有差异。\n- 生命周期：触发 → 上下文收集 → 提示构建 → 模型推理 → 代理/后处理 → 呈现 → 接受/拒绝。\n- LLM 局限：概率性、时效、对未打开文件不可见。\n- 💡 虚构场景：Copilot 引用了项目未引入的包——理解生命周期可快速识别「它只看了局部上下文」。"}],"practice":[{"id":"D3-01","q":"关于 Copilot 代码建议生命周期，正确的顺序是？","o":[{"l":"A","t":"触发 → 上下文收集 → 提示构建 → 模型推理 → 代理/后处理 → 呈现建议"},{"l":"B","t":"直接返回训练数据中最常见的片段"},{"l":"C","t":"跳过过滤直接呈现"},{"l":"D","t":"只看当前光标所在的一行"}],"a":"A","e":"✅ 生命周期含上下文收集/提示构建/推理/过滤后处理/呈现。❌ B/C/D 不符合。"}]},{"domain":4,"name":"提示工程与上下文","weight":"10–15%","sections":[{"h":"域定位","body":"考如何把意图说清、帮 Copilot 拿到对的上下文：有效提示（结构/上下文/zero-shot/few-shot/最佳实践）与性能提示（原则/流程/聊天历史）。高度依赖实操。"},{"h":"核心要点","body":"- 有效提示 = 清晰意图 + 充分上下文 + 约束 + 期望格式。\n- 上下文由光标附近代码、打开文件、导入、项目结构决定；可用注释/指令文件主动塑造。\n- zero-shot（直接任务）vs few-shot（给示例模仿格式）。\n- 提示流程：聊天历史构成上下文，合理引用前文、清理无关历史。\n- 💡 虚构场景：Chat 中先说「我们用 FastAPI」，后续无需重复框架背景。"}],"practice":[{"id":"D4-01","q":"以下哪种提示写法最能让 Copilot 给出高质量结果？","o":[{"l":"A","t":"「排序函数」"},{"l":"B","t":"「用 Python 写一个函数，输入用户列表，返回按年龄降序、同龄按姓名升序的列表，要求类型注解」"},{"l":"C","t":"不写任何说明，只给函数名"},{"l":"D","t":"只写变量名不写意图"}],"a":"B","e":"✅ B 提供意图+约束+格式，契合结构化提示。❌ A/C/D 缺乏上下文。"}]},{"domain":5,"name":"提升开发生产力","weight":"10–15%","sections":[{"h":"域定位","body":"考 Copilot 在实际开发中的价值落地：代码生成/重构/文档、加速学习、减少上下文切换、生成样例数据、现代化遗留代码；以及测试与安全支撑（单测/集成测试、边界用例、断言、安全与性能建议）。偏场景匹配。"},{"h":"核心要点","body":"- 生成/重构/文档：内联建议或 Chat 生成函数、重构重复代码、补文档。\n- 加速学习：解释陌生代码/库，少切出去查文档。\n- 现代化遗留代码：造 mock 数据、迁移旧框架。\n- 测试与安全：生成单测/集成测试、边界用例与断言、安全/性能改进建议。\n- 💡 虚构场景：让 Copilot 把 Python2 脚本改写为带类型注解 Python3 并补 pytest。"}],"practice":[{"id":"D5-01","q":"用 Copilot 现代化遗留代码，以下做法恰当的是？","o":[{"l":"A","t":"让它把 Python2 脚本改写为带类型注解的 Python3 并补测试"},{"l":"B","t":"直接合入其输出不验证"},{"l":"C","t":"仅用于生成注释"},{"l":"D","t":"禁止使用 Copilot 处理遗留代码"}],"a":"A","e":"✅ 生成/重构+补测试是认可用法，仍须验证。❌ B 违背验证原则。"}]},{"domain":6,"name":"隐私、排除与保障","weight":"10–15%","sections":[{"h":"域定位","body":"管理员与团队负责人关键域：隐私设置与排除、输出所有权与局限、保障措施与排障。与域 3 互补——域 3 讲 Copilot 怎么处理数据，本域讲你如何控制。"},{"h":"核心要点","body":"- 内容排除：通过配置指定 Copilot 不读取哪些文件/路径作为上下文（各计划能力不同）。\n- 输出所有权与局限：企业版含 IP 赔偿；输出仍须人工审阅。\n- 公共代码匹配过滤：开启后抑制与公开代码高度匹配的建议，降低许可风险。\n- 排障：建议不出现时检查排除规则误伤、扩展状态、网络/代理。\n- 💡 虚构场景：金融仓库将 secrets/、*/.env 加入排除，兼顾隐私与合规。"}],"practice":[{"id":"D6-01","q":"关于内容排除（content exclusions），正确的是？","o":[{"l":"A","t":"指定 Copilot 不读取哪些文件或路径作为上下文"},{"l":"B","t":"让 Copilot 只读取敏感文件"},{"l":"C","t":"仅影响输出文本的字体格式"},{"l":"D","t":"仅个体版可用、企业版不可用"}],"a":"A","e":"✅ 内容排除 = 主动数据边界控制。❌ B 反向；C 无关；D 错。"}]}]};

<script>
(function(){
'use strict';
const DATA = (typeof LEARNING_DATA !== 'undefined' && LEARNING_DATA) ? LEARNING_DATA : null;

// R5: meta.footerNote overrides default footer (AWS default kept when absent)
if (DATA && DATA.meta && DATA.meta.footerNote) {
  var fn = document.getElementById('footNote');
  if (fn) { fn.textContent = DATA.meta.footerNote; }
}

/* ============ 常量与工具 ============ */
const EXAM = DATA ? (DATA.meta.exam || 'CERT').toLowerCase() : 'cert';   // clf-c02
const STORE_KEY = EXAM + '-v2';                                          // 进度键：clf-c02-v2
const COLORS = ['#4f46e5','#7c3aed','#9333ea','#a855f7'];                // 每章主题色（N 章 N 色，N>4 循环）
const home = document.getElementById('home');
const chapBox = document.getElementById('chapters');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function imgSrcOk(src){ return /^(?:[\w.-]+\/)*[\w.-]+\.(?:png|jpe?g|webp|gif|svg)$/i.test(src); }
function inlineMd(s){
  let t = esc(s);
  t = t.replace(/\n/g,'<br>');
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t = t.replace(/!\[([^\]]*)\]\(([^()\s]+)\)/g, function(m0, alt, src){
    if(!imgSrcOk(src)) return '<span class="img-bad" title="非法图源">🖼 非法图源：'+src+'</span>';
    return '<img class="inline-img" loading="lazy" alt="'+alt.replace(/"/g,'&quot;')+'" src="'+src+'">';
  });
  return t;
}
function isTblSep(ln){ const core = ln.replace(/^\s*\|/,'').replace(/\|\s*$/,''); if(!core.includes('-')) return false; return /^[\s:\-|]+$/.test(ln) && /-/.test(ln); }
function loadProg(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveProg(p){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){} }

/* ============ 块级 md 渲染（段落/引用/表格/列表/图占位符） ============ */
function renderBlocks(seg, figs, fctr){
  fctr = fctr || {n:0};
  const lines = seg.replace(/\r/g,'').split('\n');
  let html = ''; let i = 0; const n = lines.length;
  while(i < n){
    const ln = lines[i]; const s = ln.trim();
    if(s === ''){ i++; continue; }
    const fm = s.match(/^\[\[fig:([\w-]+)\]\]$/);
    if(fm){ const f = (figs||{})[fm[1]]; if(f){ if(fctr) fctr.n++; html += figHtml(f); } i++; continue; }
    const fp = s.match(/^【图：(.+?)｜(概念图|截图)】$/);
    if(fp){ fctr.n++; html += '<div class="fig-placeholder" data-figtype="'+fp[2]+'"><span class="fp-num">图 '+fctr.n+'</span><span class="fp-type">'+fp[2]+'</span><span class="fp-alt">'+esc(fp[1])+'</span><span class="fp-note">真图待补</span></div>'; i++; continue; }
    const ib = s.match(/^!\[([^\]]*)\]\(([^()\s]+)\)$/);
    if(ib){
      const ialt = ib[1], isrc = ib[2];
      if(imgSrcOk(isrc)){ html += '<figure class="fig-img"><img loading="lazy" alt="'+ialt.replace(/"/g,'&quot;')+'" src="'+isrc+'"><figcaption>'+esc(ialt)+'</figcaption></figure>'; }
      else { html += '<div class="fig-placeholder"><span class="fp-type">非法图源</span><span class="fp-alt">'+esc(ialt)+' ← '+esc(isrc)+'</span><span class="fp-note">检查路径与扩展名</span></div>'; }
      i++; continue;
    }
    if(s.startsWith('|') && i+1 < n && isTblSep(lines[i+1].trim())){
      let rows = [];
      while(i < n && lines[i].trim().startsWith('|')){ rows.push(lines[i].trim()); i++; }
      const heads = rows[0].replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim()));
      const data = rows.slice(2).map(r => r.replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim())));
      html += '<div class="tbl-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'
        + data.map(r => '<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if(s.startsWith('>')){
      let q = [];
      while(i < n && lines[i].trim().startsWith('>')){ q.push(lines[i].replace(/^\s*>\s?/,'').trim()); i++; }
      html += '<blockquote>'+inlineMd(q.join(' '))+'</blockquote>'; continue;
    }
    if(/^[-*]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^[-*]\s+/.test(t)){ items.push(inlineMd(t.replace(/^[-*]\s+/,''))); i++; } else break; }
      html += '<ul>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; continue;
    }
    if(/^\d+[.、]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^\d+[.、]\s+/.test(t)){ items.push(inlineMd(t.replace(/^\d+[.、]\s+/,''))); i++; } else break; }
      html += '<ol>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ol>'; continue;
    }
    const hm = s.match(/^(#{1,6})\s+(.+)$/);
    if(hm){ html += '<h4 class="sec-h">'+inlineMd(hm[2])+'</h4>'; i++; continue; }
    let para = [];
    while(i < n){
      const t = lines[i].trim();
      if(t === '' || t.startsWith('|') || t.startsWith('>') || /^[-*]\s+/.test(t) || /^\d+[.、]\s+/.test(t) || /^#{1,6}\s/.test(t) || /^\[\[fig:[\w-]+\]\]$/.test(t) || /^【图：[^｜]*｜(?:概念图|截图)】$/.test(t) || /^!\[[^\]]*\]\([^()\s]+\)$/.test(t)) break;
      para.push(t); i++;
    }
    if(para.length) html += '<p>'+inlineMd(para.join(' '))+'</p>';
  }
  return html;
}

/* ===== 节内子块解析与渲染（v6）：#### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点）
   这一节学什么（旧值「本节定位」仍兼容）=弱化引言、案例/记忆要点=卡片、常见误区与易错点=警示小节——均不占编号。
   解析与渲染共用 parseSectionBlocks，保证正文 h3 与左侧目录两级条目 1:1。 ===== */
const SUB_RAW='raw', SUB_LEAD='lead', SUB_KP='kp', SUB_CASE='case', SUB_MIS='mis', SUB_MEM='mem';
function subTypeOf(title){
  if(title === '这一节学什么' || title === '本节定位') return SUB_LEAD;
  if(title === '案例') return SUB_CASE;
  if(title === '记忆要点') return SUB_MEM;
  if(title === '常见误区与易错点') return SUB_MIS;
  return SUB_KP;
}
function parseSectionBlocks(md){
  const parts = (md||'').replace(/\r/g,'').split(/\n(?=####\s)/);
  const out = [];
  parts.forEach(part=>{
    const m = part.match(/^####\s*(.+?)\s*\n([\s\S]*)$/);
    if(!m){ const t = part.trim(); if(t) out.push({ type:SUB_RAW, title:'', body:t }); return; }
    out.push({ type:subTypeOf(m[1].trim()), title:m[1].trim(), body:(m[2]||'').trim() });
  });
  return out;
}
function countKp(body){ let m=0; parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP) m++; }); return m; }
function kpListOf(body){
  const kps=[]; let m=0;
  parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP){ m++; kps.push({ m:m, title:b.title }); } });
  return kps;
}
function renderSectionBody(md, figs, d, n, fctr){
  fctr = fctr || {n:0};
  const blocks = parseSectionBlocks(md);
  let h = ''; let kp = 0;
  for(const b of blocks){
    if(b.type === SUB_RAW){ h += renderBlocks(b.body, figs, fctr); continue; }
    if(b.type === SUB_KP){
      kp++;
      h += '<h3 class="mh3" id="sec-'+d+'-'+n+'-'+kp+'"><span class="h3no">'+d+'.'+n+'.'+kp+'</span><span>'+inlineMd(b.title)+'</span></h3>'
         + renderBlocks(b.body, figs, fctr);
      continue;
    }
    if(b.type === SUB_CASE){ h += '<div class="case-card"><h4 class="sec-h">案例</h4>'+renderBlocks(b.body, figs, fctr)+'</div>'; continue; }
    if(b.type === SUB_MEM){ h += '<div class="mem-card"><h4 class="sec-h">记忆要点</h4>'+renderBlocks(b.body, figs, fctr)+'</div>'; continue; }
    h += '<h4 class="sec-h'+(b.type===SUB_LEAD?' sec-lead-h':'')+'">'+inlineMd(b.title)+'</h4>'+renderBlocks(b.body, figs, fctr);
  }
  return h;
}
function figsById(fs){ const m={}; (fs||[]).forEach(f=>{ m[f.id]=f; }); return m; }
function figHtml(f){
  return '<div class="fig-block"><div class="fig-title">'+esc(f.title)+'</div>'
    + '<div class="fig-body">'+(f.html||'')+'</div>'
    + (f.caption ? '<div class="fig-caption">'+esc(f.caption)+'</div>' : '') + '</div>';
}

/* ============ 章内滚动（v6）：几何法 scrollspy + 阅读进度 ============
   同一 rAF 节流的 scroll 监听做两件事：① 顶部细进度条（#rdFill-d / #readPct-d）
   ② 高亮"最新越过吸顶线(READ_LINE)的锚点"（.sec-block 节 / .mh3 知识点），并自动单开其节组。 */
let spyD = 0, spyEls = [], spyTick = null, spyOn = false;
const READ_LINE = 86;      // 吸顶条下方阅读线
const ACT_WIN = 160;       // 节/知识点标题进入线下方窗口即视为"当前"（点击跳转后立即生效）
function setAct(id){
  if(!id) return;
  /* 锚点两类：正文节/知识点 sec-域-序号[-序号]，章末练习 quiz-d域 */
  const mk = id.match(/^(?:sec-|quiz-d)(\d+)/); if(!mk) return;
  const d = +mk[1];
  const toc = document.getElementById('toc-d'+d); if(!toc) return;
  toc.querySelectorAll('.toc-link.act').forEach(a=>a.classList.remove('act'));
  const link = toc.querySelector('a[href="#'+id+'"]');
  if(link){
    link.classList.add('act');
    const li = link.closest('.toc-sec');
    if(li && !li.classList.contains('open')){
      toc.querySelectorAll('.toc-sec.open').forEach(x=>x.classList.remove('open'));
      li.classList.add('open');
    } else if(!li){
      /* 独立条目（练习入口等）：高亮时收起所有展开节组，聚焦本条 */
      toc.querySelectorAll('.toc-sec.open').forEach(x=>x.classList.remove('open'));
    }
  }
}
function computeSpy(){
  const host = document.getElementById('panel-d'+spyD); if(!host) return;
  /* ① 阅读进度：以当前面板总高扣视口高的滚动行程计百分比（+页脚尾距近似） */
  const total = host.offsetHeight - window.innerHeight + 110;
  const p = total > 0 ? Math.max(0, Math.min(100, Math.round(window.scrollY / total * 100))) : 0;
  const fill = document.getElementById('rdFill-'+spyD); if(fill) fill.style.width = p + '%';
  const pct = document.getElementById('readPct-'+spyD); if(pct) pct.textContent = p + '%';
  /* ② 当前锚（三层）：
     视口内(含阅读线下方窗口)：选最靠上者 → 点击跳转/节首即生效；
     视口内无锚(读至章末练习/底部)：取最近滚出视口的锚，保持高亮最后小节；
     首屏未滚：回退最先可见锚 */
  const hi = READ_LINE + ACT_WIN;
  let best = null;
  for(const el of spyEls){
    const r = el.getBoundingClientRect();
    if(r.top <= hi && r.bottom >= 0){ if(!best || r.top > best.r.top) best = { el:el, r:r }; }
  }
  if(!best){
    for(const el of spyEls){
      const r = el.getBoundingClientRect();
      if(r.bottom < 0){ if(!best || r.bottom > best.r.bottom) best = { el:el, r:r }; }
    }
  }
  if(!best){
    for(const el of spyEls){
      const r = el.getBoundingClientRect();
      if(r.top >= 0 && r.top < window.innerHeight * 0.7){ if(!best || r.top < best.r.top) best = { el:el, r:r }; }
    }
    if(!best && spyEls.length) best = { el:spyEls[0], r:null };
  }
  if(best && best.el.id) setAct(best.el.id);
}
function onSpyScroll(){
  if(spyTick) return;
  spyTick = requestAnimationFrame(()=>{ spyTick = null; computeSpy(); });
}
function initSpy(d){
  detachSpy(false);
  spyD = d;
  const host = document.getElementById('panel-d'+d); if(!host) return;
  spyEls = Array.from(host.querySelectorAll('.sec-block, .mh3, .quiz-box'));
  if(!spyOn){ spyOn = true; window.addEventListener('scroll', onSpyScroll, { passive:true }); }
  document.body.classList.add('chapView');
  computeSpy();
}
function detachSpy(resetAct){
  if(spyOn){ window.removeEventListener('scroll', onSpyScroll); spyOn = false; }
  if(spyTick){ cancelAnimationFrame(spyTick); spyTick = null; }
  document.body.classList.remove('chapView');
  spyEls = []; spyD = 0;
  if(resetAct !== false){
    document.querySelectorAll('.toc-link.act').forEach(a=>a.classList.remove('act'));
    document.querySelectorAll('.toc-sec.open').forEach(li=>li.classList.remove('open'));
  }
}

/* 答案/题型归一化（修复：双科数据格式不一致导致章末练习失效）
   数据真源存在两种历史格式：
     CLF  a = ["C"] / ["B","E"]   t = 'single' / 'multiple'
     AIF  a = "B"   / "AE"        t = '单选' / '多选'
   原实现把 q.a 经 JSON.stringify+esc 写进 data-ans 属性，esc 不转义双引号 →
   属性被 HTML 截断（CLF 抛 JSON 解析错→提交无反应；AIF 读出空→恒判错）。
   现改为：答案只从数据真源按 qid 反查，渲染层统一归一化，不再进 HTML 属性。 */
function normAns(v){
  if(v === null || v === undefined) return [];
  if(Array.isArray(v)) return v.map(x=>String(x).trim().toUpperCase()).filter(x=>/^[A-Z]$/.test(x));
  const raw = String(v).trim();
  /* 严格形态：整串只允许字母与分隔符。防从说明文字里误提字母
     （历史案例：某题答案字段为「⚠️待核（…见源PDF）」→ 误提出 P/D/F） */
  if(!/^[A-Za-z][A-Za-z,，、;；\s]*$/.test(raw)) return [];
  return raw.toUpperCase().replace(/[^A-Z]/g, '').split('').filter(Boolean);
}
/* 可作答判定：答案可解析 + 至少一个选项。不可作答题不渲染交互（防误判） */
function isAnswerable(q){ return !!(q && normAns(q.a).length && (q.o || []).length); }
/* 可答题数（进度分母用，不可作答题不计入） */
function answerableCount(d){
  const ch = (DATA && DATA.chapters) ? DATA.chapters[d-1] : null;
  return ((ch && ch.practice) || []).filter(isAnswerable).length;
}
function isMultiQ(q){
  if(!q) return false;
  if(q.t === 'multiple' || q.t === 'multi' || q.t === '多选') return true;
  return normAns(q.a).length > 1;   // 兜底：答案多字母必为多选
}
function findQ(d, qid){
  const ch = (DATA && DATA.chapters) ? DATA.chapters[d-1] : null;
  const qs = (ch && ch.practice) || [];
  for(let i=0;i<qs.length;i++){ if(String(qs[i].id) === String(qid)) return qs[i]; }
  return null;
}
function renderQuiz(d, qs){
  const host = document.getElementById('quiz-d'+d);
  if(!qs.length){ host.innerHTML = '<div class="quiz-hdr">✅ 本章练习</div><p style="font-size:14px;color:#94a3b8">本章暂无配套练习，可到刷题工具练习。</p>'; return; }
  const nAns = qs.filter(isAnswerable).length;
  const naTip = (nAns < qs.length) ? '（另有 '+(qs.length-nAns)+' 题特殊题型待补充）' : '';
  let h = '<div class="quiz-hdr"><span>✅ 本章练习（'+nAns+' 题）'+naTip+'</span><span class="quiz-score" id="qscore-'+d+'">正确 0/'+nAns+'</span></div>';
  qs.forEach((q,qi)=>{
    const multi = isMultiQ(q);
    /* 不可作答防御：答案或选项缺失时不渲染答题交互，
       避免学员点击后被误判（历史案例：配对题占位形态） */
    if(!isAnswerable(q)){
      h += '<div class="qi qi-na" data-d="'+d+'" data-qid="'+esc(q.id||(d+'-'+qi))+'" data-qi="'+qi+'" data-na="1">'
        + '<div class="qmeta"><span class="qbadge">第 '+(qi+1)+' 题</span><span class="qtype">特殊题型</span></div>'
        + '<div class="qstem">'+inlineMd(q.q||'')+'</div>'
        + '<div class="qrow"><div class="qres show na">⚠️ 本题为配对/特殊题型，暂不支持在线作答（内容待补充）</div></div></div>';
      return;
    }
    h += '<div class="qi" data-d="'+d+'" data-qid="'+esc(q.id||(d+'-'+qi))+'" data-qi="'+qi
      + '" data-multi="'+(multi?'1':'0')+'">'
      + '<div class="qmeta"><span class="qbadge">第 '+(qi+1)+' 题</span><span class="qtype '+(multi?'qtype-m':'qtype-s')+'">'+(multi?'多选':'单选')+'</span></div>'
      + '<div class="qstem">'+inlineMd(q.q||'')+'</div><div class="opts">';
    (q.o||[]).forEach(op=>{
      h += '<div class="opt" data-l="'+esc(op.l)+'"><span class="ol">'+esc(op.l)+'.</span><span>'+inlineMd(op.t||'')+'</span></div>';
    });
    h += '</div><div class="qexp" style="display:none">'+esc(q.e||'')+'</div>'
      + '<div class="qrow"><button class="qbtn">确认答案</button><div class="qres"></div></div></div>';
  });
  h += '<div class="score-box" id="scorebox-'+d+'"><div class="score-num" id="scorenum-'+d+'"></div><div class="score-lbl"></div>'
    + '<div class="sb-tip">完整题库与限时模拟考核见首页「题库刷题」入口；未作答的题目在返回目录再进入后仍可继续作答。</div></div>';
  host.innerHTML = h;
  /* 恢复已作答状态 */
  const prog = loadProg();
  const rec = (prog['quiz_d'+d] && prog['quiz_d'+d].answered) || {};
  host.querySelectorAll('.qi').forEach(qi=>{
    const qid = qi.dataset.qid;
    if(rec[qid] !== undefined){
      applyResult(qi, rec[qid].right === 1, rec[qid].sel || [], normAns((findQ(d, qid) || {}).a), true);
    }
  });
  host.querySelectorAll('.qi').forEach(qi=>{
    const qid = qi.dataset.qid; const prog2 = loadProg();
    const rec2 = (prog2['quiz_d'+d] && prog2['quiz_d'+d].answered) || {};
    if(rec2[qid] !== undefined) return;   // 已答锁题
    const optsBox = qi.querySelector('.opts'), btn = qi.querySelector('.qbtn');
    if(!optsBox || !btn) return;          // 不可作答题（特殊题型占位卡）无交互
    const multi = qi.dataset.multi === '1';
    const opts = qi.querySelectorAll('.opt');
    optsBox.addEventListener('click', e=>{
      const o = e.target.closest('.opt'); if(!o) return;
      if(multi){ o.classList.toggle('sel'); }
      else{ opts.forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); }
    });
    btn.addEventListener('click', ()=>{ judge(qi); });
  });
  updateScore(d);
  checkScoreBox(d);
}

function judge(qi){
  const d = qi.dataset.d;
  const ans = normAns((findQ(d, qi.dataset.qid) || {}).a);
  const sel = Array.from(qi.querySelectorAll('.opt.sel')).map(o=>o.dataset.l);
  /* 防复发：答案数据异常时大声报错，不得静默判错 */
  if(!ans.length){
    const r = qi.querySelector('.qres');
    r.className = 'qres show err';
    r.textContent = '⚠️ 本题答案数据异常，无法判定，请反馈管理员';
    return;
  }
  const right = sel.length === ans.length && ans.every(a=>sel.includes(a));
  applyResult(qi, right, sel, ans, false);
  /* 持久化 */
  const prog = loadProg();
  const key = 'quiz_d'+d;
  if(!prog[key]) prog[key] = { answered:{} };
  prog[key].answered[qi.dataset.qid] = { right: right?1:0, sel: sel };
  saveProg(prog);
  updateScore(d);
  refreshProgress();
  checkScoreBox(d);
}

function applyResult(qi, right, sel, ans, restored){
  qi.classList.add('done');
  const opts = Array.from(qi.querySelectorAll('.opt'));
  opts.forEach(o=>{
    const l = o.dataset.l;
    if(ans.includes(l)) o.classList.add(sel.includes(l) ? 'cor' : 'shc');
    else if(sel.includes(l)) o.classList.add('wrg');
  });
  const qres = qi.querySelector('.qres');
  qres.className = 'qres show ' + (right ? 'ok' : 'err');
  const exp = qi.querySelector('.qexp');
  qres.innerHTML = (right ? '✅ 回答正确' : '❌ 回答错误') + '　<span style="font-weight:400">' + inlineMd(exp ? exp.textContent : '') + '</span>';
  qi.querySelector('.qbtn').disabled = true;
  qi.querySelector('.qbtn').textContent = restored ? '已作答' : '已确认';
}

function updateScore(d){
  const prog = loadProg();
  const key = 'quiz_d'+d;
  const rec = (prog[key] && prog[key].answered) || {};
  let right = 0;
  Object.values(rec).forEach(v=>{ if(v.right === 1) right++; });
  const total = answerableCount(d);   // 分母=可答题数（特殊题型占位卡不计入）
  const sc = document.getElementById('qscore-'+d);
  if(sc) sc.textContent = '正确 ' + right + '/' + total;
}

function checkScoreBox(d){
  const prog = loadProg();
  const key = 'quiz_d'+d;
  const rec = (prog[key] && prog[key].answered) || {};
  const total = answerableCount(d);
  if(Object.keys(rec).length >= total && total > 0){
    let right = 0; Object.values(rec).forEach(v=>{ if(v.right === 1) right++; });
    const box = document.getElementById('scorebox-'+d);
    document.getElementById('scorenum-'+d).textContent = right + ' / ' + total;
    box.querySelector('.score-lbl').textContent = right === total ? '🎉 全对，本章掌握扎实！' : (right >= total*0.7 ? '👍 达到及格线（70%），可进入下一章' : '📖 建议回到正文复习错题对应的知识点');
    box.classList.add('show');
  }
}

/* ============ 视图切换与进度 ============ */
function go(d){
  const chapters = DATA.chapters;
  closeSide();
  home.style.display = 'none';
  chapBox.style.display = '';
  chapBox.querySelectorAll('.panel').forEach(p=>{ p.style.display = (p.id === 'panel-d'+d) ? '' : 'none'; });
  const prog = loadProg();
  prog['read_d'+d] = 1;                 // 已读标记
  saveProg(prog);
  window.scrollTo(0,0);
  document.title = baseTitle() + ' · 第 ' + d + ' 章';
  initSpy(d);                            // 常驻目录/进度条/scrollspy 跟随当前章
}

function backHome(){
  detachSpy();
  closeSide();
  chapBox.style.display = 'none';
  home.style.display = '';
  window.scrollTo(0,0);
  document.title = baseTitle();
  refreshProgress();
}

/* 刷新首页进度看板：统计已完成数 + 章卡状态/进度条 */
function refreshProgress(){
  const prog = loadProg();
  const chapters = DATA.chapters;
  let doneCnt = 0;
  chapters.forEach((ch,di)=>{
    const d = di+1;
    const total = (ch.practice||[]).length;
    const rec = (prog['quiz_d'+d] && prog['quiz_d'+d].answered) || {};
    const nDone = Object.keys(rec).length;
    const right = Object.values(rec).filter(v=>v.right===1).length;
    const read = prog['read_d'+d] === 1;
    const pm = document.getElementById('pm-'+d);
    const pmn = document.getElementById('pmn-'+d);
    const pf = document.getElementById('pf-'+d);
    const card = pm ? pm.closest('.ch-card') : null;
    if(!pm) return;
    let state = '未开始', pct = 0;
    if(nDone >= total && total > 0){ state = '已完成'; doneCnt++; card.classList.add('done'); }
    else if(read || nDone > 0){ state = nDone > 0 ? '学习中 ' + nDone + '/' + total : '学习中'; }
    pm.textContent = state;
    if(card) card.classList.toggle('done', nDone >= total && total > 0);
    pct = total ? Math.round(nDone/total*100) : 0;
    if(pf) pf.style.width = pct + '%';
    if(pmn) pmn.textContent = total ? ('答对 ' + right + '/' + total) : '';
  });
  const od = document.getElementById('ovDone');
  if(od) od.textContent = doneCnt;
}

/* ============ 启动 ============ */
if(!DATA){
  document.body.innerHTML = '<div style="padding:60px 24px;text-align:center;font-size:14px;color:#64748b">学习数据未注入：此模板需经构建脚本注入数据后方可使用。</div>';
} else {
  buildHome();
  buildPanels();
  refreshProgress();
}

/* ============ 合体视图切换：学习区 ↔ 题库刷题区 ============
   quiz-embed 内的「← 返回学习目录」按钮与底部导航「📚 学习」都调用 window.kbShowLearnHome */
function kbShowQuiz(){
  detachSpy();
  closeSide();
  home.style.display = 'none';
  chapBox.style.display = 'none';
  const f = document.querySelector('.footer'); if(f) f.style.display = 'none';
  // 修复：.wrap 外壳仅藏子元素会残留 padding（24+60px），把题库顶栏顶离顶部 84px
  // → 外壳自身一并隐藏，保证进入题库视图即贴顶
  const w = document.querySelector('.wrap'); if(w) w.style.display = 'none';
  const qv = document.getElementById('quizView');
  if(qv){
    qv.style.display = 'block';
    const tt = document.getElementById('qzTopTitle');
    if(tt) tt.textContent = (DATA.meta.cnName ? DATA.meta.exam + ' · ' + DATA.meta.cnName : DATA.meta.exam) + ' 题库刷题';
  }
  window.scrollTo(0,0);
  document.title = baseTitle() + ' · 题库刷题';
}
function kbShowLearnHome(){
  detachSpy();
  closeSide();
  const qv = document.getElementById('quizView');
  if(qv) qv.style.display = 'none';
  const f = document.querySelector('.footer'); if(f) f.style.display = '';
  home.style.display = '';
  const w = document.querySelector('.wrap'); if(w) w.style.display = '';
  window.scrollTo(0,0);
  document.title = baseTitle();
  refreshProgress();
}
window.kbShowQuiz = kbShowQuiz;
window.kbShowLearnHome = kbShowLearnHome;
})();
</script>
<script>
/* 图灯箱（移动适配 P1=A）：正文图当前渲染等效字号 <9.5px 时点击可放大到原始 viewBox 尺寸
   等效字号 = 图内最小 text 字号 × (当前渲染宽 ÷ viewBox 宽)；桌面可读图不触发，不打断阅读 */
(function(){
  'use strict';
  var box = null, stage = null;
  function minFontPx(svg){
    var t = svg.querySelectorAll('text'), mn = Infinity;
    for (var i = 0; i < t.length; i++){
      var v = parseFloat(t[i].getAttribute('font-size'));
      if (isNaN(v)){ var cs = getComputedStyle(t[i]); v = parseFloat(cs.fontSize); }
      if (!isNaN(v) && v < mn) mn = v;
    }
    return isFinite(mn) ? mn : 12;
  }
  function effFont(svg){
    var vb = svg.viewBox && svg.viewBox.baseVal;
    if (!vb || !vb.width) return 99;                 // 无 viewBox：不介入
    var w = svg.getBoundingClientRect().width || vb.width;
    return minFontPx(svg) * (w / vb.width);
  }
  function close(){
    if (box) box.classList.remove('show');
    document.documentElement.style.overflow = '';
  }
  function open(svg){
    if (!box){
      box = document.createElement('div');
      box.className = 'fig-lightbox';
      box.innerHTML = '<button class="lb-close" aria-label="关闭放大图">✕</button><div class="lb-stage"></div>';
      document.body.appendChild(box);
      stage = box.querySelector('.lb-stage');
      box.querySelector('.lb-close').addEventListener('click', close);
      box.addEventListener('click', function(e){ if (e.target === box) close(); });
    }
    var vb = svg.viewBox.baseVal;
    var clone = svg.cloneNode(true);
    clone.style.width = vb.width + 'px';             // 原始 viewBox 尺寸 1:1
    clone.style.maxWidth = 'none';
    clone.style.height = 'auto';
    stage.innerHTML = '';
    stage.appendChild(clone);
    box.classList.add('show');
    document.documentElement.style.overflow = 'hidden';
    stage.scrollTop = 0; stage.scrollLeft = 0;
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
  document.addEventListener('click', function(e){
    var svg = e.target.closest ? e.target.closest('.fig-body svg') : null;
    if (!svg) return;
    if (effFont(svg) >= 9.5) return;                 // 当前渲染下可读 → 不打断
    e.preventDefault();
    open(svg);
  });
})();
</script>
