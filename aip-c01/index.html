转换模板以实现基于请求属性的路由逻辑。将 Amazon Bedrock FM 终端节点存储为 REST API 阶段变量。更新 系统在模型之间切换时的变量。"},{"l":"C","t":"配置 AWS Lambda 函数以针对每个用户请求从 AWS AppConfig 代理获取路由配置。在 Lambda 函数中运行业务逻辑，为每个请求选择适当的 FM。通过单个 Amazon API Gateway REST API 终端节点公开 FM。"},{"l":"D","t":"使用 Amazon API Gateway REST API 的 AWS Lambda 授权方来评估存储在 AWS AppConfig 中的路由规则。根据业务逻辑返回授权上下文。将请求路由到每个 Amazon Bedrock FM 的模型特定 Lambda 函数。"}],"a":["C"],"e":"**正确答案：C。** 通过 AWS AppConfig 集中管理动态路由配置，Lambda 函数在运行时获取配置并执行业务逻辑选择 FM，对外暴露单一 API Gateway 端点。\n\n**为什么对：** AWS AppConfig 专为动态配置管理而设计，支持功能标志（Feature Flags）、JSON Schema 验证、受控部署和快速传播。路由规则、成本阈值和 A/B 权重作为配置存储，更新时只需发布新配置版本而无需推送代码。Lambda 通过 AppConfig Agent 高效获取缓存配置，在高并发下保持低延迟，同时根据请求属性（用户层级、区域、成本指标）动态选择 FM。单一 API Gateway 端点简化了客户端集成。\n\n**其他选项为什么错：**\n- A. Lambda 环境变量：更新环境变量需要函数配置更新并触发冷启动，不支持验证或受控部署，不适合每小时级的高频实时变更。\n- B. API Gateway 请求转换模板 + 阶段变量：模板表达能力有限，无法实现复杂的多维度路由规则评估。\n- D. Lambda Authorizer 评估路由规则：Authorizer 设计用于身份认证和授权，用于高频业务路由决策会增加延迟和架构复杂度。\n\n**关键概念：** AWS AppConfig 支持 Feature Flags、分阶段部署、Schema 验证和回滚，是动态 FM 路由配置的推荐方案。","s":"源#144"},{"id":"D2-055","d":2,"t":"single","q":"一家电商公司运营全球产品推荐系统，需要根据法规、成本优化和性能要求，在 Amazon Bedrock 的多个基础模型（Foundation Model, FM）之间动态切换。公司必须实施基于专有业务逻辑的自定义控制，包括动态成本阈值、AWS 区域特定的合规规则以及跨多个 FM 的实时 A/B 测试。系统必须无需部署新代码即可切换 FM，并根据用户层级、交易金额、监管区域和每小时变化的实时成本指标等复杂规则路由请求，且变更需在数千个并发请求中即时传播。哪种方案能满足这些要求？","o":[{"l":"A","t":"部署一个 AWS Lambda 函数，该函数使用环境变量来存储路由规则和 Amazon Bedrock FM ID。当业务需求发生变化时，使用 Lambda 控制台更新环境变量。配置 Amazon API Gateway REST API 以读取请求参数以做出路由决策。"},{"l":"B","t":"部署 Amazon API Gateway REST API 请求转换模板以实现基于请求属性的路由逻辑。将 Amazon Bedrock FM 终端节点存储为 REST API 阶段变量。更新 系统在模型之间切换时的变量。"},{"l":"C","t":"配置 AWS Lambda 函数以针对每个用户请求从 AWS AppConfig 代理获取路由配置。在 Lambda 函数中运行业务逻辑，为每个请求选择适当的 FM。通过单个 Amazon API Gateway REST API 终端节点公开 FM。"},{"l":"D","t":"使用 Amazon API Gateway REST API 的 AWS Lambda 授权方来评估存储在 AWS AppConfig 中的路由规则。根据业务逻辑返回授权上下文。将请求路由到每个 Amazon Bedrock FM 的模型特定 Lambda 函数。"}],"a":["C"],"e":"**正确答案：C。** 使用 AWS AppConfig 集中管理路由规则，Lambda 函数通过 AppConfig Agent 获取配置并动态选择 FM，对外暴露单一 API Gateway 端点。\n\n**为什么对：** AWS AppConfig 支持功能标志、JSON Schema 验证、分阶段部署和即时传播，完全匹配每小时变更且需跨数千并发请求生效的需求。Lambda 作为策略决策点，在每个请求中评估用户属性、监管约束和实时成本指标来选择合适的 FM。由于路由规则和 FM 标识符均为配置项，公司可通过发布新 AppConfig 版本切换模型，无需重新部署代码。AppConfig Agent 在 Lambda 执行环境内缓存配置，确保高并发下的低延迟。\n\n**其他选项为什么错：**\n- A. Lambda 环境变量：更新需触发函数配置更新，不支持验证或受控部署，操作脆弱。\n- B. API Gateway 映射模板 + 阶段变量：表达能力有限，难以实现复杂的动态规则评估和安全推出。\n- D. Lambda Authorizer：设计用于认证授权而非业务路由，分离决策与执行会增加延迟和可观测性复杂度。","s":"源#145"},{"id":"D2-056","d":2,"t":"single","q":"一家公司正在构建 GenAI 应用，通过 Amazon Bedrock API 处理复杂客户查询。高峰期应用遭遇间歇性 API 超时，导致响应块损坏和数据传输延迟；处理不同长度的查询时，应用难以确保提示词（Prompt）保持在令牌限制内，用户反馈输入被截断、响应不完整，且基础模型调用出现失败。公司需要一种重试策略：能自动处理瞬时服务错误、防止在高峰期压垮 Amazon Bedrock、能适应不断变化的服务可用性，并支持响应流（Response Streaming）和令牌感知（Token-Aware）的请求处理。哪种方案能满足这些要求？","o":[{"l":"A","t":"实施标准重试策略，在尝试之间使用 1 秒固定延迟，并对所有错误使用最多 3 次重试。通过重新启动流来处理流响应超时。每个会话的令牌使用上限。"},{"l":"B","t":"实施自适应重试策略，该策略使用带有抖动的指数退避和断路器模式，当错误率超过预定义阈值时，该模式会暂时禁用重试。实现一个流响应处理程序来监视块传送超时。配置处理程序以缓冲成功接收的块，并在重新建立连接时智能地从最后接收的块恢复流式传输。"},{"l":"C","t":"使用 AWS 开发工具包在标准模式下配置重试策略。将 Amazon Bedrock API 调用包装在处理超时异常的 try-catch 块中。返回失败的流请求的缓存完成结果。对所有用户实施全局令牌限制。为每个请求添加基于抖动的重试逻辑和轻量级令牌修剪。通过仅请求从故障点丢失的块来恢复损坏的流。维护最新块的小型内存缓冲区。"},{"l":"D","t":"将 Amazon Bedrock 客户端请求超时设置为 30 秒。实施客户端减载。当应用程序性能下降时，缓冲部分结果并停止新请求。为所有请求设置静态令牌使用上限。配置指数退避重试、动态块大小调整和上下文感知令牌限制。"}],"a":["B"],"e":"**正确答案：B。** 采用带抖动的指数退避（Exponential Backoff with Jitter）配合断路器模式（Circuit Breaker），并实现流感知的块缓冲与恢复机制。\n\n**为什么对：** 带抖动的指数退避是 AWS 推荐的瞬时故障处理最佳实践，能分散重试请求、避免同步重试风暴。断路器模式在错误率超过阈值时暂停重试，防止级联故障压垮 Bedrock 服务，实现自适应降级。流响应处理器监控块传送超时、缓冲已接收块，并在重连时从最后成功接收的块恢复，避免重新生成整个响应，既节省模型算力又提升用户体验。\n\n**其他选项为什么错：**\n- A. 固定 1 秒延迟 + 最多 3 次重试：固定间隔容易引发同步重试风暴，无断路器保护，无法适应变化的服务可用性。\n- C. 混合多种策略但含矛盾设计：全局令牌限制过于粗暴；「仅请求丢失的块」对流式生成输出不现实，因为生成是顺序依赖的。\n- D. 客户端减载 + 静态令牌上限：静态上限缺乏灵活性；无断路器等自适应重试控制，不如 B 方案健壮。","s":"源#146"},{"id":"D2-057","d":2,"t":"single","q":"一家保险公司使用 Amazon SageMaker AI 基础设施支撑其 Web 应用，允许客户预测保险费。用于训练模型的客户数据存储在 Amazon S3 存储桶中，数据集正在快速增长。公司希望在员工将新的客户数据文件上传到 S3 存储桶时，自动重新训练模型并将其重新部署到应用中。哪种方案能满足这些要求？","o":[{"l":"A","t":"使用 AWS Glue 对每个上传的文件运行 ETL 作业。配置 ETL 作业以使用 AWS 开发工具包调用 SageMaker AI 模型终端节点。在更新的客户数据集上重新训练模型后，使用端点的实时推理来重新部署模型。"},{"l":"B","t":"创建 AWS Lambda 函数和 Webhook 处理程序，以在员工上传新文件时生成事件。配置 SageMaker Pipelines 以在更新的客户数据集上重新训练模型后重新部署模型。使用 Amazon EventBridge 创建事件总线。将 LambdaFunction 事件设置为源，将 SageMaker Pipelines 设置为目标。"},{"l":"C","t":"使用 AWS 开发工具包集成创建 AWS Step Functions Express 工作流程，以便在员工将新文件上传到 S3 存储桶时从 S3 存储桶检索客户数据。使用 SageMaker Data Wrangler 流将数据从 S3 存储桶导出到 SageMaker Autopilot。在更新的客户数据集上重新训练模型后，使用 SageMaker Autopilot 重新部署模型。"},{"l":"D","t":"创建 AWS Step Functions 标准工作流程。配置第一个状态以在员工将新文件上传到 S3 存储桶时调用 AWS Lambda 函数进行响应。在更新的客户数据集上重新训练模型后，使用 SageMaker Pipelines 中的管道重新部署模型。当第一个状态收到响应时，使用工作流中的下一个状态来运行管道。"}],"a":["D"],"e":"**正确答案：D。** 使用 AWS Step Functions Standard 工作流编排：Lambda 响应 S3 上传事件，触发工作流调用 SageMaker Pipelines 完成重新训练和重新部署。\n\n**为什么对：** S3 事件通知触发 Lambda 是标准的事件驱动模式。Lambda 将上下文（存储桶、对象键、数据集版本）传递给 Step Functions Standard 状态机。Standard 工作流支持长时间运行的步骤（训练可能耗时数小时）、持久状态、重试和错误处理，并提供完整的执行历史记录便于审计。SageMaker Pipelines 专为 ML 生命周期管理而设计，支持数据处理、训练、评估和部署的端到端自动化。通过 Step Functions 调用 Pipeline，公司还可以添加治理门控（如仅在评估指标达标时才部署）。\n\n**其他选项为什么错：**\n- A. Glue ETL + SageMaker 端点实时推理：混淆了推理与重训练概念，未提供部署编排能力。\n- B. Lambda + Webhook + EventBridge：Webhook 引入不必要的复杂性，EventBridge 配置中将 LambdaFunction 事件作为源的设计并不规范。\n- C. Step Functions Express + Data Wrangler + Autopilot：Express 工作流有 5 分钟限制，不适合长时间训练任务；引入了过多不必要的组件。","s":"源#147"},{"id":"D2-058","d":2,"t":"single","q":"一家公司正在为 GenAI 应用设计 API，该应用使用托管模型服务上的基础模型（FM）。API 必须流式传输响应以降低延迟，强制执行令牌限制以管理计算资源使用，并实现重试逻辑以处理模型超时和部分响应。哪种方案能以最少的运维开销满足这些要求？","o":[{"l":"A","t":"将 Amazon API Gateway HTTP API 与 AWS Lambda 函数集成以调用 Amazon Bedrock。使用 Lambda 响应流来传输响应。在 Lambda 函数中强制实施令牌限制。使用 Lambda 和 APIGateway 超时配置实现模型超时的重试逻辑。"},{"l":"B","t":"将 Amazon API Gateway HTTP API 直接连接到 Amazon Bedrock。使用客户端轮询模拟流式传输。在前端强制执行令牌限制。使用 APIGateway 集成设置配置重试行为。"},{"l":"C","t":"将 Amazon API Gateway WebSocket API 连接到托管容器化推理服务器的 Amazon ECS 服务。使用 WebSocket 协议流式传输响应。在 Amazon ECS 中实施令牌限制。使用 ECS 任务生命周期挂钩和重启策略处理模型超时。"},{"l":"D","t":"将 Amazon API Gateway REST API 与调用 Amazon Bedrock 的 AWS Lambda 函数集成。使用 Lambda 响应流来传输响应。在 Lambda 函数内实施令牌限制。使用 Lambda 和 APIGateway 超时配置实现重试逻辑。"}],"a":["A"],"e":"**正确答案：A。** 使用 Amazon API Gateway HTTP API 搭配 AWS Lambda 函数调用 Amazon Bedrock，通过 Lambda Response Streaming 传输响应，在 Lambda 中实施令牌限制和重试逻辑。\n\n**为什么对：** API Gateway HTTP API 是轻量级、低成本的托管前门，与 Lambda 无缝集成。Lambda Response Streaming 允许在模型部分输出可用时立即返回给客户端，降低感知延迟。Lambda 作为集成层，可集中实施令牌感知的请求控制（如拒绝超限请求、修剪上下文）和带指数退避的重试逻辑。HTTP API 比 REST API 更轻量且成本更低，适合此场景。整个架构完全无服务器，无需管理基础设施。\n\n**其他选项为什么错：**\n- B. HTTP API 直连 Bedrock + 客户端轮询：客户端轮询不是真正的流式传输，前端令牌限制不安全且不一致。\n- C. WebSocket API + ECS 容器：引入容器管理和扩缩复杂性，运维开销远高于无服务器方案。\n- D. REST API + Lambda：功能上可行，但 REST API 比 HTTP API 更重、成本更高，不满足「最少运维开销」的约束。","s":"源#148"},{"id":"D2-059","d":2,"t":"single","q":"一家公司正在开发客户支持应用，使用 Amazon Bedrock 基础模型为员工提供实时 AI 辅助。应用必须在生成响应时逐字符显示 AI 输出，以最小延迟支持数千个并发用户，且响应通常需要 15–45 秒才能完成。哪种方案能满足这些要求？","o":[{"l":"A","t":"使用 AWS Lambda 集成配置 Amazon API Gateway WebSocket API。配置 WebSocket API 以调用 Amazon Bedrock InvokeModelWithResponseStream API 并通过 WebSocket 连接流式传输部分响应。"},{"l":"B","t":"使用 AWS Lambda 集成配置 Amazon API Gateway REST API。配置 REST API 以调用 Amazon Bedrock 标准 InvokeModel API 并实施前端客户端每 100 毫秒轮询一次以获得完整的响应块。"},{"l":"C","t":"使用 IAM 用户凭证和 InvokeModelWithResponseStream API 实现与 Amazon Bedrock 的直接前端客户端连接，无需任何中间网关或代理层。"},{"l":"D","t":"使用 AWS Lambda 集成配置 Amazon API Gateway HTTP API。配置 HTTP API 将完整响应缓存在 Amazon DynamoDB 表中，并通过多个分页 GET 请求向前端客户端提供响应。"}],"a":["A"],"e":"**正确答案：A。** 使用 Amazon API Gateway WebSocket API 搭配 Lambda，调用 Bedrock InvokeModelWithResponseStream API，通过 WebSocket 连接向客户端流式推送部分响应。\n\n**为什么对：** InvokeModelWithResponseStream API 在生成令牌时逐步输出，实现逐字符显示而非等待 15–45 秒的完整响应。WebSocket API 专为双向、低延迟、服务器主动推送场景设计，能支持数千个并发长连接。Lambda 与 WebSocket API 原生集成并自动扩缩，整个架构完全无服务器且托管。后端通过 API Gateway 集中处理认证、限流和可观测性，安全可控。\n\n**其他选项为什么错：**\n- B. REST API + InvokeModel + 客户端轮询：轮询引入延迟和 API 开销，无法实现真正的流式传输。\n- C. 前端直连 Bedrock + IAM 用户凭证：将凭证暴露给客户端违反 AWS 安全最佳实践，且无法安全扩展。\n- D. HTTP API + DynamoDB 缓存 + 分页 GET：只能提供完整响应的分块传输，无法实现实时生成的逐字符流式显示。","s":"源#149"},{"id":"D2-060","d":2,"t":"single","q":"一家公司使用 AI 助手应用总结网站内容并为客户提供信息，计划使用 Amazon Bedrock 访问基础模型（FM）。公司需要将应用部署到开发和生产两个环境，并在每个环境中测试不同 FM 的效果。方案必须让产品负责人能在各环境中轻松切换 FM 进行测试。哪种方案能满足这些要求？","o":[{"l":"A","t":"创建一个 AWS CDK 应用程序。在 AWS CodePipeline 中创建多个管道。将每个 Pipeline 配置为每个 FM 都有自己的设置。配置应用程序以使用 aws_bedrock.Provisioned Model.fromProvisioned ModelArn() 方法调用 Amazon Bedrock FM。"},{"l":"B","t":"为每个环境创建单独的 AWS CDK 应用程序。配置应用程序以使用 aws_bedrock.Foundation Model.fromFoundation ModelId() 方法调用 Amazon Bedrock FM。在 AWSCodePipeline 中为每个环境创建单独的管道。"},{"l":"C","t":"创建一个 AWS CDK 应用程序。配置应用程序以使用 aws_bedrock.Foundation Model.fromFoundation ModelId() 方法调用 Amazon Bedrock FM。在 AWS CodePipeline 中创建一个管道，该管道为使用 AWS CodeBuild 部署操作的每个环境都有一个部署阶段。"},{"l":"D","t":"为生产环境创建一个 AWS CDK 应用程序。配置应用程序以使用 aws_bedrock.Provisioned Model.fromProvisioned ModelArn() 方法调用 Amazon Bedrock FM。在 AWSCodePipeline 中创建管道。使用 AWS CodeBuild 部署操作配置要部署到生产环境的管道。对于开发环境，请参考生产应用代码手动重新创建资源。"}],"a":["C"],"e":"**正确答案：C。** 使用单个 AWS CDK 应用，通过 FoundationModel.fromFoundationModelId() 按需引用 FM，在 AWS CodePipeline 中创建包含开发和生产部署阶段的单一流水线，使用 CodeBuild 执行部署。\n\n**为什么对：** FoundationModel.fromFoundationModelId() 支持按需调用 FM，无需预配置容量，非常适合频繁切换模型进行实验和 A/B 测试。单个 CDK 应用确保基础设施一致性并减少重复；环境差异（如不同的 FM ID）通过参数或上下文变量外部化，产品负责人可在不修改代码的情况下切换 FM。单一 CodePipeline 包含多个部署阶段是 AWS 多环境部署的最佳实践，兼顾一致性和环境级自定义。\n\n**其他选项为什么错：**\n- A. 多个 Pipeline + ProvisionedModel：多流水线增加管理复杂度；预配置模型适用于稳定高负载场景，不适合频繁切换测试。\n- B. 每环境单独 CDK 应用 + 单独 Pipeline：重复 CDK 应用和流水线带来不必要的运维开销和维护负担。\n- D. 仅生产环境 CDK + 手动重建开发资源：手动重建直接违反基础设施即代码（IaC）最佳实践，易导致配置漂移。","s":"源#150"},{"id":"D2-061","d":2,"t":"single","q":"一家医疗保健公司正在使用 Amazon Bedrock 开发实时患者护理 AI 助手，需要响应来自临床查询、保险验证、预约安排和保险理赔等不同部门的查询。公司希望采用多代理架构（Multi-Agent Architecture），确保助手具备可扩展性并能持续为患者增加新功能。助手必须能处理数千个并行的患者交互，且患者必须收到针对其查询领域的准确回复。哪种方案能满足这些要求？","o":[{"l":"A","t":"使用单独的知识库隔离每个代理的数据。使用 IAM 过滤来控制对每个知识库的访问。部署主管代理对患者询问执行自然语言意图分类。配置主管代理将查询路由到专门的协作代理以响应部门特定的查询。将每个专业协作者代理配置为将检索增强生成 (RAG) 与代理的部门特定知识库结合使用。"},{"l":"B","t":"为每个部门创建一个单独的主管代理。配置单独的协作代理以对每个部门内的每个专业领域执行自然语言意图分类。仅将每个协作代理与特定于部门的知识库集成。在主管代理之间实施手动切换流程。"},{"l":"C","t":"将每个部门的数据隔离在单独的知识库中。使用 IAM 过滤来控制对每个知识库的访问。部署单个通用代理。在通用代理内配置多个操作组以执行特定的部门功能。在通用代理指令中实现基于规则的路由逻辑。"},{"l":"D","t":"实施多个独立的主管代理，并行运行以响应每个部门的患者询问。为每个主管代理配置多个协作者代理。将所有代理与相同的知识库集成。使用外部路由逻辑合并来自多个主管代理的响应。"}],"a":["A"],"e":"**正确答案：A。** 使用主管代理（Supervisor Agent）进行意图分类和路由，将查询分发给专门的协作代理（Collaborator Agent），每个协作代理配备独立的部门知识库并通过 RAG 生成回答，使用 IAM 控制知识库访问权限。\n\n**为什么对：** 主管-协作者模式是 AWS 推荐的多代理编排标准方法：主管代理负责自然语言意图分类和请求路由，协作代理专注于各自领域的任务处理。每个协作代理使用独立的部门知识库执行 RAG，确保回答基于正确的领域数据，避免跨部门信息泄露（如临床回答中混入理赔内容）。独立知识库 + IAM 过滤实现了严格的数据隔离和访问控制。架构天然支持水平扩展——每个代理独立扩缩；新增部门只需添加新的协作代理和知识库，无需重新设计系统。\n\n**其他选项为什么错：**\n- B. 每部门单独主管 + 手动切换：手动切换在大规模并发下不可扩展，且增加操作复杂度。\n- C. 单一通用代理 + 操作组 + 规则路由：随功能增长，单一代理的提示词和规则路由逻辑会变得臃肿脆弱，难以治理。\n- D. 多个并行主管 + 共享知识库 + 外部合并：共享知识库破坏了数据隔离，外部响应合并增加复杂度且可能导致不一致。","s":"源#151"},{"id":"D2-062","d":2,"t":"single","q":"一家公司正在构建 GenAI 应用处理财务报告并为分析师提供摘要。应用必须运行两个计算环境：AWS Lambda 函数使用 Python SDK 按需分析报告；Amazon EKS 容器使用 JavaScript SDK 按计划批量处理多个报告。应用必须在多轮交互中维护对话上下文，跨环境使用相同的基础模型（FM），并确保一致的身份验证。哪种方案能满足这些要求？","o":[{"l":"A","t":"使用 Amazon Bedrock InvokeModel API 以及针对每个环境的单独身份验证方法。将对话状态存储在 Amazon DynamoDB 中。为每种编程语言使用自定义 I/O 格式化逻辑。"},{"l":"B","t":"通过使用 IAM 角色的通用身份验证机制，在两种环境中直接使用 Amazon Bedrock Converse API。将对话状态存储在 Amazon ElastiCache 中。为模型参数创建特定于编程语言的包装器。"},{"l":"C","t":"使用 InvokeModel API 创建集中式 Amazon API Gateway REST API 终端节点来处理所有模型交互。将交互历史记录存储在每个 Lambda 函数或 EKS 容器的应用程序进程内存中。使用环境变量来配置模型参数。"},{"l":"D","t":"使用 Amazon Bedrock Converse API 和 IAM 角色进行身份验证。在请求消息数组中传递先前的消息以维护会话上下文。使用特定于编程语言的 SDK 建立一致的 API 接口。"}],"a":["D"],"e":"**正确答案：D。** 使用 Amazon Bedrock Converse API 和 IAM 角色进行身份验证，通过在请求消息数组中传递历史消息来维护会话上下文，使用各语言的原生 SDK 构建一致的 API 接口。\n\n**为什么对：** Converse API 专为多轮对话交互设计，标准化了消息、角色和上下文的表示方式，确保 Python（Lambda）和 JavaScript（EKS）环境下行为一致。通过在消息数组中显式传递历史消息维护会话上下文，无需外部状态存储，避免了跨环境状态同步的复杂性并保证了确定性模型行为。IAM 角色为 Lambda 和 EKS 提供统一的安全模型，与 AWS SDK 原生集成，符合最小权限原则。\n\n**其他选项为什么错：**\n- A. InvokeModel API + 各环境独立认证 + 自定义 I/O 格式化：认证不一致增加管理复杂度，自定义格式化逻辑增加开发负担。\n- B. Converse API + ElastiCache 存储状态：正确使用 Converse API 时无需外部状态存储，引入 ElastiCache 是不必要的复杂性。\n- C. API Gateway 集中端点 + 进程内存存储：将状态存于 Lambda/容器的进程内存中不可靠——Lambda 是无状态的，容器可能重启。","s":"源#152"},{"id":"D2-063","d":2,"t":"single","q":"一家公司正在为支付处理 API 设计金丝雀部署（Canary Deployment）策略。系统必须支持在多个 Amazon Bedrock 模型版本之间自动逐步转移流量，基于实时推理指标、历史流量模式和服务健康状况做出决策。指标健康时系统须增加流量，性能低于阈值时须减少流量。公司需要全面监控部署阶段的推理延迟和错误率，并且必须能在无需手动干预的情况下停止部署并恢复到之前的模型版本。哪种方案能满足这些要求？","o":[{"l":"A","t":"使用具有预配置吞吐量的 Amazon Bedrock 来托管模型版本。配置 Amazon EventBridge 规则以在发布新模型版本时调用 AWS Step Functions 工作流程。配置工作流程以分阶段转移流量、等待指定时间段并调用 AWS Lambda 函数来检查 Amazon CloudWatch 性能指标。配置工作流以在指标满足阈值时增加流量，并在性能指标低于阈值时触发流量回滚。"},{"l":"B","t":"使用 AWS Lambda 函数调用各种 Amazon Bedrock 模型版本。使用具有阶段变量和加权路由的 Amazon API Gateway HTTP API 来逐渐转移流量。使用 Amazon CloudWatch 监控性能。使用外部逻辑来调整流量并在性能低于阈值时回滚。"},{"l":"C","t":"使用 Amazon SageMaker AI 终端节点变体来表示多个 Amazon Bedrock 模型版本。使用变量权重来转移流量。使用 Amazon CloudWatch 和 SageMakerModel Monitor 触发回滚。如果检测到异常，请使用 EventBridge 回滚部署。"},{"l":"D","t":"使用 Amazon OpenSearch Service 跟踪推理日志。配置 OpenSearch Service 以调用 AWS Systems Manager Automation Runbook 来更新 Amazon Bedrock 模型终端节点，从而根据推理日志转移流量。"}],"a":["A"],"e":"**正确答案：A。** 使用 Amazon Bedrock 预配置吞吐量（Provisioned Throughput）托管模型版本，EventBridge 触发 Step Functions 工作流实现分阶段流量转移，Lambda 检查 CloudWatch 指标决定增加流量或触发回滚。\n\n**为什么对：** Step Functions 非常适合编排具有确定性阶段、等待窗口和条件分支的受控部署流程。工作流在每个阶段暂停并通过 Lambda 评估 CloudWatch 中的推理延迟和错误率指标：达标则递增流量，超限则自动回滚，实现零手动干预。EventBridge 在新模型版本发布时可靠触发部署流程，确保事件驱动且可重复。整体架构全部使用 AWS 托管服务，运维开销低。\n\n**其他选项为什么错：**\n- B. API Gateway 加权路由 + 外部逻辑：依赖「外部逻辑」调整流量和回滚，无法保证自动化和零手动干预。\n- C. SageMaker 端点变体代表 Bedrock 模型版本：SageMaker 端点变体与 Bedrock 模型版本不是预期的集成模式。\n- D. OpenSearch 追踪日志 + Systems Manager Runbook：过于间接和复杂，不是基于度量的直接流量控制。","s":"源#153"},{"id":"D2-064","d":2,"t":"single","q":"一家公司正在使用 Amazon Bedrock 开发 AI 驱动的应用，该基础模型支持跨区域推理（Cross-Region Inference）和预配置吞吐量。应用必须以稳定的低延迟服务欧洲和北美用户，并遵守数据驻留法规——欧洲用户数据须保留在欧洲 AWS 区域内。测试期间，区域流量峰值达到服务配额时应用出现降级。公司需要一种保持弹性且最大限度降低运维复杂性的方案。哪种方案能满足这些要求？","o":[{"l":"A","t":"在北美和欧洲区域部署单独的 Amazon Bedrock 实例。使用自定义路由层根据用户位置引导流量。配置 Amazon CloudWatch 警报以监控区域服务使用情况。当使用量接近指定阈值时，使用 Amazon SNS 向公司发送电子邮件警报。"},{"l":"B","t":"当应用程序调用 InvokeModel API 时，通过在配置文件 ID 中指定地理代码来使用 Amazon Bedrock 跨区域推理配置文件。配置单独的 Amazon API Gateway HTTP API 将欧洲和北美用户引导至适当的区域终端节点。"},{"l":"C","t":"部署多区域 Amazon API Gateway HTTP API 和 AWS Lambda 函数，以实施重试逻辑来处理限制。配置 Lambda 函数，以便当应用程序达到主要区域中的服务配额时调用最近辅助区域中的基础模型。使用智能路由确保符合数据驻留要求。"},{"l":"D","t":"在多个区域中为 Amazon Bedrock 配置预置吞吐量。在应用程序代码中实现故障转移逻辑，以便在发生限制时在 Region 之间进行切换。使用 AWS Global Accelerator 根据用户位置将流量路由到适当的终端节点。"}],"a":["B"],"e":"**正确答案：B。** 使用 Amazon Bedrock 跨区域推理配置文件（Cross-Region Inference Profile），在 InvokeModel API 调用中通过配置文件 ID 指定地理代码，并配置独立的 API Gateway HTTP API 将欧洲和北美用户分别引导至对应的区域端点。\n\n**为什么对：** 跨区域推理配置文件允许在指定地理范围（如「欧洲」或「北美」）内的多个区域之间分发推理请求。欧洲配置文件确保请求仅由欧洲区域处理，满足数据驻留要求；当某区域达到配额或出现瞬时限制时，Bedrock 自动将请求路由到同一地理范围内的其他健康区域，无需自定义故障转移逻辑。独立的 API Gateway HTTP API 为各地理区域提供清晰的路由边界和独立扩缩能力，整体运维复杂度低。\n\n**其他选项为什么错：**\n- A. 自定义路由层 + CloudWatch 告警 + SNS 邮件：手动监控和告警不能解决配额导致的自动降级问题。\n- C. Lambda 重试 + 辅助区域回退：自定义重试和跨区域路由逻辑增加复杂度，且配置错误可能违反数据驻留要求。\n- D. 多区域预配置吞吐量 + 应用层故障转移 + Global Accelerator：应用层故障转移逻辑复杂，且如果故障转移跨越地理边界可能违反驻留法规。","s":"源#154"},{"id":"D2-065","d":2,"t":"single","q":"一家电商公司正在使用 Amazon Bedrock 构建 GenAI 应用，通过 AWS Step Functions 编排多代理工作流生成详细产品描述。工作流包含三个连续状态：描述生成器、技术规格验证器和品牌语调一致性检查器，每个状态产生中间推理轨迹和输出传递给下一个状态。应用使用 Amazon S3 存储流程数据和输出。测试中发现状态之间的输出经常超出 Step Functions 的 256 KB 有效载荷配额，导致工作流失败。开发者需要修改架构以有效处理此配额限制并维护工作流可观测性，同时保留现有的多代理推理和行动（ReAct）模式。哪种方案能以最少运维开销满足要求？","o":[{"l":"A","t":"将中间输出存储在 Amazon DynamoDB 中。仅在状态之间传递引用。创建一个映射状态，以便在每个代理的处理步骤需要时从 DynamoDB 检索完整数据。"},{"l":"B","t":"配置 Amazon Bedrock 集成以在大型输出的输入参数中使用 S3 存储桶 URI。使用 ResultPath 和 ResultSelector 字段在代理步骤之间路由 S3 引用，同时保持顺序验证工作流程。"},{"l":"C","t":"在每个代理状态之前，使用 AWS Lambda 函数将输出压缩到小于 256KB。配置每个代理任务以在处理之前解压缩输出，并在将结果传递到下一个状态之前压缩结果。"},{"l":"D","t":"配置单独的 Step Functions 状态机来处理每个代理的处理。使用 Amazon EventBridge 协调状态机之间的执行流。使用输出的 S3 引用作为事件数据。"}],"a":["B"],"e":"**正确答案：B。** 将大型中间输出存储到 Amazon S3，在状态之间仅传递轻量级 S3 URI 引用，使用 ResultPath 和 ResultSelector 控制传递的字段，保持顺序验证工作流不变。\n\n**为什么对：** 将大型工件外部化到 S3、仅在状态间传递指针值是 AWS 处理 Step Functions 有效载荷配额的标准模式。应用已在使用 S3 存储输出，无需引入新服务。ResultPath 和 ResultSelector 允许每个状态精确控制转发给后续状态的字段（如 S3 URI、对象键、跟踪 ID），保持有效载荷轻量。工作流仍可记录跟踪引用和结构化元数据便于调试，保留了可观测性。顺序验证流程和 ReAct 模式完全不受影响。\n\n**其他选项为什么错：**\n- A. DynamoDB 存储 + 映射状态检索：引入额外的数据库服务和读写模式，增加运维复杂度。\n- C. Lambda 压缩/解压缩：自定义压缩逻辑脆弱、增加延迟，且使故障排查更困难。\n- D. 拆分为多个状态机 + EventBridge 协调：破坏了单一工作流的可观测性和 ReAct 模式的连续性，增加编排开销。","s":"源#155"},{"id":"D2-066","d":2,"t":"single","q":"一家金融服务公司正在开发 GenAI 应用，为高级客户和标准客户提供服务。应用使用 Amazon API Gateway REST API 后面的 AWS Lambda 函数处理请求。公司需要根据用户所属的客户层级动态切换 AI 模型，并在不重新部署代码的情况下对新功能进行 A/B 测试。在应用变更之前，公司需要验证模型参数（如温度和最大令牌数）。哪种方案能以最少运维开销满足这些要求？","o":[{"l":"A","t":"为每个配置创建 AWS Systems Manager Parameter Store 参数。使用 Lambda 函数轮询参数更新。当配置发生更改时，使用 Amazon EventBridge 事件触发重新部署。"},{"l":"B","t":"将模型配置存储在 Amazon DynamoDB 表中。优化访问模式以根据客户层检索配置。配置 Lambda 函数以在每个请求开始时查询 DynamoDB，以确定要使用的模型。"},{"l":"C","t":"使用 AWS AppConfig 管理模型配置。使用功能标志执行 A/B 测试。定义模型参数的 JSON 模式验证规则。配置 Lambda 函数以使用 AWS AppConfig 代理检索配置。"},{"l":"D","t":"创建 Amazon ElastiCache(Redis OSS) 集群来存储模型配置。设置短 TTL 值。在 Lambda 函数中运行自定义验证逻辑。使用 Amazon CloudWatch 指标来监控配置使用情况。"}],"a":["C"],"e":"**正确答案：C。** 使用 AWS AppConfig 管理模型配置，通过功能标志（Feature Flags）执行 A/B 测试，定义 JSON Schema 验证规则校验模型参数，Lambda 通过 AppConfig Agent 获取配置。\n\n**为什么对：** AppConfig 支持功能标志实现无代码部署的 A/B 测试；JSON Schema 验证确保温度、最大令牌数等参数在应用前经过校验，防止无效配置影响生产；AppConfig Agent 在 Lambda 执行环境内缓存配置，高并发下保持低延迟。公司可将客户层级到模型的映射、推理参数等集中管理，更新时发布新配置版本即可，无需修改或重新部署 Lambda 代码。\n\n**其他选项为什么错：**\n- A. Parameter Store + EventBridge 重新部署：配置变更触发重新部署增加了不必要的复杂度，Parameter Store 本身不支持验证或受控推出。\n- B. DynamoDB 存储配置：需自建访问模式和验证逻辑，DynamoDB 本身不支持功能标志或 Schema 验证。\n- D. ElastiCache + 自定义验证逻辑：需管理 Redis 集群和自建验证代码，运维开销显著高于托管的 AppConfig。","s":"源#156"},{"id":"D2-067","d":2,"t":"single","q":"一家医疗保健公司正在使用 Amazon Bedrock 开发实时患者护理 AI 助手，处理来自临床查询、保险验证、预约安排和保险理赔等不同部门的查询。公司希望采用多代理架构，确保助手可扩展并能持续添加新功能。助手须能处理数千个并行患者交互，且患者须收到针对其查询领域的准确回复。哪种方案能满足这些要求？","o":[{"l":"A","t":"使用单独的知识库隔离每个代理的数据。使用 IAM 过滤来控制对每个知识库的访问。部署主管代理对患者询问执行自然语言意图分类。配置主管代理将查询路由到专门的协作者代理，以响应特定于部门的查询。配置每个专门的协作者代理以将检索增强生成 (RAG) 与代理的部门特定知识库结合使用。"},{"l":"B","t":"为每个部门创建一个单独的主管代理。配置单独的协作代理以对每个部门内的每个专业领域执行自然语言意图分类。仅将每个协作代理与特定于部门的知识库集成。在主管代理之间实施手动切换流程。"},{"l":"C","t":"将每个部门的数据隔离在单独的知识库中。使用 IAM 过滤来控制对每个知识库的访问。部署单个通用代理。在通用代理内配置多个操作组以执行特定的部门功能。在通用代理指令中实现基于规则的路由逻辑。"},{"l":"D","t":"实施多个独立的主管代理，并行运行以响应每个部门的患者询问。为每个主管代理配置多个协作者代理。将所有代理与相同的知识库集成。使用外部路由逻辑合并来自多个主管代理的响应。"}],"a":["A"],"e":"**正确答案：A。** 部署主管代理（Supervisor Agent）执行意图分类和路由，将查询分发给配备独立部门知识库的协作代理，各协作代理通过 RAG 生成领域回答，IAM 控制各知识库访问权限。\n\n**为什么对：** 主管-协作者是 AWS 推荐的多代理编排模式。主管代理集中处理意图分类和路由，各协作代理专注于特定领域的 RAG 检索和回答生成。独立知识库确保各代理仅检索本部门数据，提高回答准确性并防止跨部门信息泄露。IAM 过滤强制实施访问控制，支持治理和合规。架构天然支持水平扩展——每个代理独立扩缩；新增部门只需添加协作代理和知识库即可，无需重新设计系统。\n\n**其他选项为什么错：**\n- B. 每部门独立主管 + 手动切换：手动切换不可扩展且增加操作复杂度。\n- C. 单一代理 + 操作组 + 规则路由：随功能增长，单一代理的提示词和路由逻辑变得臃肿脆弱。\n- D. 并行主管 + 共享知识库 + 外部合并：共享知识库破坏数据隔离，合并外部响应增加不一致风险。","s":"源#157"},{"id":"D2-068","d":2,"t":"single","q":"一家公司已为所有开发者设置了 Amazon Q Developer Pro 许可证。公司维护着一份开发者在开发应用时必须使用的已批准资源列表，包括内部库、专有算法技术和具有批准样式的示例代码。新开发团队正在使用 Amazon Q Developer 开发基于 Java 的新应用。公司必须确保新团队使用已批准的资源，且不希望进行项目级别的修改。哪种方案能满足这些要求？","o":[{"l":"A","t":"创建一个包含所有批准的内部库、算法和代码示例的 Git 存储库。将此 Git 存储库作为工作区的一部分包含在本地应用程序项目中。确保开发人员使用工作区上下文从 Git 存储库检索建议。"},{"l":"B","t":"在项目根文件夹中，创建一个名为 amazonq/rules 的文件夹。将批准的内部库、算法和代码示例添加到该文件夹 。"},{"l":"C","t":"在应用程序项目中创建一个名为规则的文件夹。将指南和代码存储在文件夹中，供 Amazon Q Developer 参考代码建议。"},{"l":"D","t":"创建包含批准的数据源的 Amazon Q Developer 自定义。确保开发人员使用定制来开发应用程序。"}],"a":["D"],"e":"**正确答案：D。** 创建包含已批准数据源的 Amazon Q Developer 自定义（Customization），确保开发者使用该自定义进行开发。\n\n**为什么对：** Amazon Q Developer 自定义允许组织将已批准的内部库、编码标准、架构模式和专有技术集中注入 AI 助手的建议中。自定义在组织层面配置，无需对具体项目做任何修改，直接满足「不做项目级修改」的约束。当内部库或准则更新时，更新自定义即可自动传播给所有使用它的开发者，运维开销低且一致性有保障。\n\n**其他选项为什么错：**\n- A. Git 仓库包含在项目工作区：需将仓库添加到每个项目中，属于项目级修改，违反约束。\n- B. 项目中创建 amazonq/rules 文件夹：需在项目根目录添加文件夹，属于项目级修改。\n- C. 项目中创建规则文件夹：同样需要修改项目结构，违反约束。","s":"源#158"},{"id":"D2-069","d":2,"t":"single","q":"一家公司使用 Amazon Bedrock 开发了多模态内容分析应用，将不同内容类型（文本、图像和代码）路由到专门的基础模型（FM）。应用需要处理两种路由决策：基于文件扩展名的简单路由必须具有最小延迟；基于内容语义的复杂路由需要在选择 FM 前进行分析。应用还必须提供详细的执行历史记录，并在主 FM 故障时支持回退。哪种方案能满足这些要求？","o":[{"l":"A","t":"配置为所有路由逻辑调用 Amazon Bedrock FM 的 AWS Lambda 函数。使用条件语句根据内容类型和语义确定适当的 FM。"},{"l":"B","t":"创建混合解决方案。根据应用程序代码中的文件扩展名处理简单路由。通过使用 AWS Step Functions 状态机以及用于内容分析的 JSONata 和用于专门 FM 的 InvokeModel API 来处理复杂的基于内容的路由。"},{"l":"C","t":"使用 AWS Lambda 函数中的路由逻辑为每种内容类型部署单独的 AWS Step Functions 工作流程。当需要回退到备用 FM 时，使用 Amazon EventBridge 在工作流程之间进行协调。"},{"l":"D","t":"将 Amazon SQS 与每种内容类型的不同 SQS 队列结合使用。配置 AWS Lambda 使用者，通过使用 Amazon Bedrock 和 AWS 开发工具包来分析内容并根据消息属性调用适当的 FM。"}],"a":["B"],"e":"**正确答案：B。** 混合方案：在应用代码中直接处理基于文件扩展名的简单路由（最低延迟）；使用 AWS Step Functions 状态机处理复杂的语义路由，结合 JSONata 进行内容分析和 InvokeModel API 调用专门的 FM。\n\n**为什么对：** 简单路由（如 .jpg → 视觉模型，.py → 代码模型）直接在代码中通过条件判断完成，避免不必要的服务调用，延迟最小。复杂的语义路由需要多步分析和条件分支，Step Functions 专为此设计。Step Functions 提供内置的执行历史记录（输入/输出/错误详情），满足审计和调试需求。Step Functions 的原生 Retry 和 Catch 机制在主 FM 调用失败时可自动回退到备用 FM，无需大量自定义代码。JSONata 用于状态间的数据转换和内容特征提取。\n\n**其他选项为什么错：**\n- A. 纯 Lambda 条件语句处理所有路由：缺乏结构化执行历史和内建回退机制，不适合复杂语义路由。\n- C. 多个 Step Functions 工作流 + EventBridge 协调：拆分工作流增加架构复杂度，EventBridge 协调带来额外故障模式。\n- D. SQS 队列分发 + Lambda 消费者：引入队列延迟，工作流可见性有限，不适合需要详细历史记录的场景。","s":"源#159"},{"id":"D2-070","d":2,"t":"single","q":"一家公司正在创建一个工作流，在发送客户通信之前对其进行审查。公司使用预定义的消息模板生成通信并存储在 Amazon S3 存储桶中。工作流需要从模板中提取特定部分并发送到 Amazon Bedrock 模型进行审查，然后将模型响应存储回原始 S3 存储桶。哪种方案能满足这些要求？","o":[{"l":"A","t":"在 Amazon Bedrock Flows 中创建流。在流程的开头和结尾配置 S3 操作节点，以检索和存储通信和模型响应。在流程的中间，配置一个表达式来解析每个通信。配置代理步骤以将解析的输入发送到模型以供审核。"},{"l":"B","t":"创建 AWS Step Functions Express 工作流程状态机。使用 Amazon S3 集成 GetObject 步骤检索原始通信。使用内部函数 Pass 步骤来解析通信并将结果传递给 Amazon Bedrock InvokeModel 步骤。配置 Amazon S3 集成 PutObject 步骤以将模型响应存储回 S3 存储桶。"},{"l":"C","t":"创建具有操作组的 Amazon Bedrock 代理。配置指令以定义代理应如何解析通信。配置操作组以从 S3 存储桶检索通信、调用 Amazon Bedrock 模型并将模型响应存储回 S3 存储桶。"},{"l":"D","t":"创建具有单个操作组的 Amazon Bedrock 代理。在操作组中配置三个 AWS Lambda 函数。配置函数以从 S3 存储桶检索通信、解析通信并调用 Amazon Bedrock 模型，并将模型响应存储回 S3 存储桶。"}],"a":["A"],"e":"**正确答案：A。** 在 Amazon Bedrock Flows 中创建流：配置 S3 操作节点检索和存储通信，使用表达式（Expression）节点解析模板的特定部分，配置代理步骤（Agent Step）将解析后的内容发送到模型审查。\n\n**为什么对：** Amazon Bedrock Flows 专为编排 GenAI 工作流而设计，原生支持 S3 操作节点（读写数据）、表达式节点（确定性解析模板特定部分）和代理步骤（调用 FM 审查内容）。整个工作流在单一托管体验中完成，无需自定义代码。表达式节点确保模板解析是确定性的而非依赖生成逻辑，这对于审查场景至关重要。运维开销最低。\n\n**其他选项为什么错：**\n- B. Step Functions Express 工作流：功能上可行但需更多显式编排，且缺乏 Bedrock Flows 的 GenAI 原生构造（表达式节点、代理步骤）。\n- C. Bedrock Agent + 操作组处理解析和 S3 操作：依赖代理（非确定性的 LLM）进行模板解析，不如表达式节点可靠。\n- D. Bedrock Agent + 三个 Lambda 函数：引入自定义代码和函数管理，运维开销高于 Bedrock Flows 的原生方案。","s":"源#160"},{"id":"D2-071","d":2,"t":"single","q":"一家公司正在开发 GenAI 客户支持应用，使用 Amazon Bedrock 基础模型。应用必须在与同一用户的多次交互中维护对话上下文，并运行澄清工作流（Clarification Workflow）处理不明确的查询。公司须存储每个用户对话的加密记录以用于个性化。应用必须能处理数千个并发用户并快速响应。哪种方案能满足这些要求？","o":[{"l":"A","t":"使用 AWS Step Functions Express 工作流程来编排对话流。调用 AWS Lambda 函数来运行澄清逻辑。将对话历史记录存储在 Amazon RDS 中并使用会话 ID 作为主键。"},{"l":"B","t":"使用 AWS Step Functions Standard 工作流程来编排澄清工作流程。包括等待回调模式来管理工作流程。将对话历史记录存储在 Amazon DynamoDB 中。按需购买容量并配置服务器端加密。"},{"l":"C","t":"通过使用 Amazon API Gateway REST API 将用户请求路由到 AWS Lambda 函数来更新和检索对话上下文来部署应用程序。将对话历史记录存储在 Amazon S3 中并配置服务器端加密。将每个交互保存为单独的 JSON 文件。"},{"l":"D","t":"使用 AWS Lambda 函数调用 Amazon Bedrock 推理 API。使用 Amazon SQS 队列来编排澄清步骤。将对话历史记录存储在 Amazon ElastiCache(Redis OSS) 集群中。配置静态加密。"}],"a":["B"],"e":"**正确答案：B。** 使用 AWS Step Functions Standard 工作流编排澄清流程，采用等待回调模式（Wait for Callback）管理多轮交互，将对话历史存储在 Amazon DynamoDB 中并配置按需容量和服务端加密。\n\n**为什么对：** Step Functions Standard 专为长时间运行的有状态工作流设计，等待回调模式允许工作流在等待用户输入时暂停，非常适合需要多次来回交互的澄清场景而不丢失执行状态。DynamoDB 提供毫秒级延迟的读写操作，按需容量模式随流量自动扩缩，无需容量规划，可支撑数千并发用户。服务端加密确保对话数据静态加密，满足安全和合规要求。\n\n**其他选项为什么错：**\n- A. Step Functions Express + Amazon RDS：Express 工作流有 5 分钟执行限制，不适合长时间会话；RDS 面临连接管理和扩缩挑战。\n- C. API Gateway + Lambda + S3 存储 JSON 文件：将每次交互存为单独 S3 对象增加延迟且使上下文检索复杂化。\n- D. SQS 编排 + ElastiCache (Redis)：ElastiCache 是缓存服务，不适合需要持久化的可审计对话历史记录。","s":"源#161"},{"id":"D2-072","d":2,"t":"single","q":"一家公司正在使用 Amazon Bedrock 开发 AI 驱动的应用，使用支持跨区域推理和预配置吞吐量的基础模型。应用须以稳定低延迟服务欧洲和北美用户，并遵守数据驻留法规——欧洲用户数据须保留在欧洲 AWS 区域内。测试期间，区域流量峰值达到服务配额时应用出现降级。公司需要保持弹性并最大限度降低运维复杂性的方案。哪种方案能满足这些要求？","o":[{"l":"A","t":"在北美和欧洲区域部署单独的 Amazon Bedrock 实例。使用自定义路由层根据用户位置引导流量。配置 Amazon CloudWatch 警报以监控区域服务使用情况。当使用量接近阈值时，使用 Amazon SNS 发送电子邮件警报。"},{"l":"B","t":"通过在调用 InvokeModel API 时在配置文件 ID 中指定地理代码，使用 Amazon Bedrock 跨区域推理配置文件。配置单独的 Amazon API Gateway HTTP API 以将欧洲和北美用户定向到适当的区域终端节点。"},{"l":"C","t":"部署多区域 Amazon API Gateway HTTP API 和 AWS Lambda 函数，以实施重试逻辑来处理限制。配置 Lambda 函数以在达到配额时调用最近的辅助区域中的 FM。"},{"l":"D","t":"在多个区域中为 Amazon Bedrock 配置预置吞吐量。在应用程序代码中实现故障转移逻辑，以在发生限制时切换区域。使用 AWS Global Accelerator 根据用户位置路由流量。"}],"a":["B"],"e":"**正确答案：B。** 使用 Amazon Bedrock 跨区域推理配置文件（Cross-Region Inference Profile），在调用 InvokeModel API 时通过配置文件 ID 指定地理代码，配置独立的 API Gateway HTTP API 将不同地区用户引导至对应端点。\n\n**为什么对：** 跨区域推理配置文件允许在指定地理范围（如欧洲或北美）内自动分发推理请求。欧洲配置文件确保请求仅由欧洲区域处理，满足数据驻留要求。当某区域达到配额时，Bedrock 自动将请求路由到同一地理范围内的其他健康区域，提高可用性而无需自定义故障转移逻辑。独立的 API Gateway 为各地区提供清晰的路由边界和独立扩缩，运维复杂度低。\n\n**其他选项为什么错：**\n- A. 自定义路由层 + CloudWatch 告警 + SNS 邮件：手动监控和告警无法自动解决配额导致的降级问题。\n- C. Lambda 重试 + 辅助区域回退：自定义跨区域路由逻辑增加复杂度，配置错误可能违反数据驻留法规。\n- D. 多区域预配置吞吐量 + 应用层故障转移 + Global Accelerator：应用层故障转移逻辑复杂，跨地理边界切换可能违反驻留法规。","s":"源#162"},{"id":"D2-073","d":2,"t":"single","q":"一家公司正在使用 AWS Lambda 实现无服务器推理 API，动态调用 Amazon Bedrock 上托管的多个 AI 模型。公司需要设计一种方案，能在模型提供者之间切换而无需实时修改或重新部署 Lambda 代码。设计必须包含配置变更的安全推出（Safe Rollout）以及验证和回滚功能。哪种方案能满足这些要求？","o":[{"l":"A","t":"将活动模型提供程序存储在 AWS Systems Manager Parameter Store 中。配置 Lambda 函数以在运行时读取参数以确定要调用哪个模型。"},{"l":"B","t":"将活动模型提供程序存储在 AWS AppConfig 中。配置 Lambda 函数以在运行时读取配置以确定要调用哪个模型。"},{"l":"C","t":"配置 Amazon API Gateway REST API 以将请求路由到单独的 Lambda 函数。将每个 Lambda 函数硬编码到特定的模型提供程序。手动切换集成目标。"},{"l":"D","t":"将活动模型提供程序存储在 Amazon S3 上托管的 JSON 文件中。使用 AWS AppConfig 引用 S3 文件作为托管配置源。配置 Lambda 函数以在运行时通过 AppConfig 读取文件，以确定要调用哪个模型。"}],"a":["B"],"e":"**正确答案：B。** 将活跃模型提供者存储在 AWS AppConfig 中，Lambda 函数在运行时读取 AppConfig 配置来决定调用哪个模型。\n\n**为什么对：** AWS AppConfig 专为支持安全部署、验证和回滚的动态配置管理而设计。AppConfig 支持金丝雀、线性和立即部署等多种策略，实现受控的配置推出；JSON Schema 验证确保模型标识符等配置值在应用前有效；出现问题时支持自动回滚。通过 AppConfig，公司可实时切换 Bedrock 模型提供者而完全无需重新部署 Lambda 代码，满足所有三个核心要求。\n\n**其他选项为什么错：**\n- A. Parameter Store：缺乏原生推出策略、Schema 验证和自动回滚，不适合需要安全推出的场景。\n- C. 每个模型硬编码到独立 Lambda + 手动切换目标：需要手动操作和代码耦合，违反「无需修改代码」的要求。\n- D. S3 JSON 文件 + AppConfig 引用 S3：AppConfig 已支持原生托管配置，通过 S3 间接引入不必要的复杂性。","s":"源#163"},{"id":"D2-074","d":2,"t":"multiple","q":"一家公司正在使用 AWS Lambda 和 REST API 构建推理代理（Inference Agent）以自动化支持工作流。系统必须在交互中保留记忆（Memory），共享相关代理状态，并支持事件驱动调用和同步调用。系统还须强制执行访问控制和基于会话的权限。哪种步骤组合提供了最具可扩展性的方案？（选择两项。）","o":[{"l":"A","t":"使用 Amazon Bedrock AgentCore 管理内存和会话感知推理。部署具有内置身份支持、事件处理和可观察性的代理。"},{"l":"B","t":"使用 Amazon API Gateway 和 Amazon EventBridge 将 Lambda 函数和 REST API 注册为操作。使 Amazon Bedrock AgentCore 能够调用 Lambda 函数和 REST API，而无需自定义编排代码。"},{"l":"C","t":"使用 Amazon Bedrock Agents 进行推理和对话管理。使用 AWS Step Functions 和 Amazon SQS 进行编排。将代理状态存储在 Amazon DynamoDB 中。"},{"l":"D","t":"将推理逻辑部署为 APIGateway 后面的 Amazon ECS 上的容器。使用 Amazon Aurora 来存储内存和身份数据。"},{"l":"E","t":"使用 Amazon Kendra 和 Amazon Bedrock 构建自定义 RAG 管道。使用 AWS Lambda 编排工具调用。将代理状态存储在 Amazon S3 中。"}],"a":["A","B"],"e":"**正确答案：A、B。** 使用 Amazon Bedrock AgentCore 管理记忆和会话感知推理，同时通过 API Gateway 和 EventBridge 将 Lambda 函数和 REST API 注册为可调用操作。\n\n**为什么对：** Amazon Bedrock AgentCore 专为管理代理记忆、会话上下文和身份感知推理而构建，消除了手动实现状态存储、会话生命周期管理或自定义记忆层的需要。AgentCore 原生支持同步请求和事件驱动执行，并内置身份支持和可观测性。选项 B 通过 API Gateway（同步请求响应）和 EventBridge（事件驱动执行）将 Lambda 函数和 REST API 注册为代理操作，使 AgentCore 可无缝调用工具而无需自定义编排代码。两者结合提供了内置的安全性、可观测性和扩展性。\n\n**其他选项为什么错：**\n- C. Bedrock Agents + Step Functions + SQS + DynamoDB：引入不必要的编排复杂性和多个需管理的服务。\n- D. ECS 容器 + Aurora：增加基础设施管理负担和成本，非无服务器方案。\n- E. Kendra + Lambda 编排 + S3 状态存储：S3 不适合低延迟的会话级状态访问。","s":"源#164"},{"id":"D2-075","d":2,"t":"multiple","q":"一家公司正在设计使用基础模型（FM）支持多个 AI 工作负载的方案。部分 FM 须按需实时调用，其他 FM 需要一致的高吞吐量访问来执行批处理。方案必须支持混合部署模式，跨云和本地基础设施运行工作负载，以满足数据驻留和合规要求。哪种步骤组合能满足这些要求？（选择两项。）","o":[{"l":"A","t":"使用 AWS Lambda 通过调用 Amazon SageMaker AI 异步终端节点上托管的 FM 来协调低延迟 FM 推理。"},{"l":"B","t":"在 Amazon Bedrock 中配置预置吞吐量，以确保大容量工作负载的一致性能。"},{"l":"C","t":"使用 Amazon SageMaker Neo 将 FM 部署到 Amazon SageMaker AI 终端节点，并支持边缘部署。使用 AWS Lambda 编排 FM 以支持混合部署。"},{"l":"D","t":"使用具有自动扩展功能的 Amazon Bedrock 来应对不可预测的流量激增。"},{"l":"E","t":"使用 Amazon SageMaker JumpStart 托管和调用 FM。"}],"a":["B","C"],"e":"**正确答案：B、C。** 在 Amazon Bedrock 中配置预配置吞吐量（Provisioned Throughput）确保批处理工作负载的一致性能，同时使用 Amazon SageMaker Neo 将 FM 部署到 SageMaker AI 端点并支持边缘部署，通过 Lambda 编排实现混合部署。\n\n**为什么对：** 选项 B 通过 Bedrock 预配置吞吐量保证可预测的容量和性能，消除按需模式下可能出现的冷启动和限流问题，适合需要持续推理速率的大批量批处理工作负载。选项 C 通过 SageMaker Neo 针对目标硬件编译模型，支持在 AWS 云之外的本地环境高效运行推理，满足混合部署和数据驻留要求。Lambda 编排提供跨环境的一致调用模式。两者结合覆盖了实时按需、批量高吞吐和本地部署三种场景。\n\n**其他选项为什么错：**\n- A. Lambda + SageMaker 异步端点：异步端点不适合实时低延迟推理场景。\n- D. Bedrock 自动扩缩：解决了弹性扩缩但不支持本地/混合部署。\n- E. SageMaker JumpStart：简化模型启动但不解决混合部署或吞吐量保障问题。","s":"源#165"},{"id":"D2-076","d":2,"t":"single","q":"一家公司运行 GenAI 应用，使用来自 Amazon Bedrock 的多个基础模型（FM）生成文本，面向三个 AWS 区域的用户提供服务，运行在 AWS Lambda 函数上。公司需要基于响应质量和延迟指标实现动态模型选择；须无需修改或重新部署代码即可在不同模型之间切换；希望逐步上线新模型，从 20% 流量开始；并需要在错误率超过 1% 时自动回滚。哪种方案能满足这些要求？","o":[{"l":"A","t":"使用 AWSAppConfig 创建用于模型选择标准的特性标志；为错误率设置验证规则；实现 AWS AppConfig Agent Lambda 扩展，以便在函数运行时获取模型配置；定义线性部署策略，逐步发布新模型——可从初始的 20% 流量开始。"},{"l":"B","t":"将模型选择配置存储在 Amazon DynamoDB 中；利用全局表实现多区域复制；配置 Amazon EventBridge 规则以监控 Amazon CloudWatch 指标中的错误，并调用 AWS Lambda 函数来更新 DynamoDB 表中的模型偏好设置；在 Lambda 函数中添加自定义代码，以便在每次调用模型前查询 DynamoDB。"},{"l":"C","t":"为每个模型配置创建 Lambda 函数版本；使用 Lambda 别名并配置路由规则，逐步将流量在不同版本之间迁移——初始阶段可从 20%的流量开始；实施 AWS CodeDeploy 部署流程，该流程会监控 Lambda 函数版本的 Amazon CloudWatch 指标，当错误率超过阈值时，自动回滚部署。"},{"l":"D","t":"创建 Amazon CloudWatch 指数面板，用于监控响应质量与延迟指标；在 Lambda 函数中实现自定义逻辑，根据指标阈值选择模型；使用存储于 AWS Systems Systems Manager Parameter Store 中的环境变量来定义模型选择参数，这些参数可在不同区域间进行更新。"}],"a":["A"],"e":"**正确答案：A。** 使用 AWS AppConfig 创建模型选择标准的功能标志（Feature Flags），设置错误率验证规则，通过 AppConfig Agent Lambda 扩展在运行时获取配置，并定义线性部署策略从 20% 流量开始逐步发布。\n\n**为什么对：** AppConfig 专为动态配置管理设计，支持功能标志实现无代码部署的模型切换。线性部署策略可从 20% 流量起步逐步推出新模型配置，精确匹配题目要求。AppConfig 的验证规则可监控错误率，超过阈值（如 1%）时自动回滚。AppConfig Agent Lambda 扩展允许函数在运行时直接获取配置，无需代码修改。所有要求（动态选择、无代码切换、渐进上线、自动回滚）均由 AppConfig 原生支持。\n\n**其他选项为什么错：**\n- B. DynamoDB 全局表 + EventBridge + Lambda 更新偏好：需要大量自定义代码实现渐进发布和自动回滚逻辑，运维开销高。\n- C. Lambda 版本 + 别名路由 + CodeDeploy：适用于函数代码级别的金丝雀部署，但每个模型配置都需要创建新的函数版本，不是「无需修改代码」的纯配置切换。\n- D. CloudWatch 面板 + 自定义选择逻辑 + Parameter Store：需在 Lambda 中编写自定义模型选择逻辑，Parameter Store 不支持渐进部署或自动回滚。","s":"源#166"},{"id":"D2-077","d":2,"t":"single","q":"一家金融服务公司正在开发 NLP 应用，使用 AWS Lambda 函数通过 Amazon Bedrock 基础模型处理客户交易咨询。Lambda 函数需要生成超过 4 MB 的详尽交易分析回复，处理时间为 15–20 秒。应用必须在 10 秒内响应客户咨询，并符合金融监管要求——需将相关记录保存 10 年。哪种方案能满足这些要求？","o":[{"l":"A","t":"启用响应流处理，以便在应用程序生成部分响应时实时显示这些响应；为 Lambda 函数的执行时间设置 15 秒超时；启用 AWS X-Ray 追踪以监控性能。"},{"l":"B","t":"使用 Amazon SQS 队列实现异步调用。为 Lambda 函数的执行时间设置 30 秒超时值。使用 Amazon CloudWatch 监控响应时间。"},{"l":"C","t":"使用 Amazon API Gateway 对应用程序进行轮询；将应用程序与 Amazon ElastiCache 集成，以缓存响应；为 Lambda 函数的执行时间设置 30 秒超时；并收集有关应用程序性能的详细 Amazon CloudWatch 日志。"},{"l":"D","t":"实现响应流处理，以便在应用程序生成部分响应时即可显示该响应；为 Lambda 函数的执行时间设置 30 秒超时；并将完整的响应记录存储至 Amazon S3。"}],"a":["D"],"e":"**正确答案：D。** 实现响应流处理（Response Streaming），在生成部分响应时即刻显示；为 Lambda 设置 30 秒超时；将完整响应记录存储到 Amazon S3。\n\n**为什么对：** 响应流处理允许在模型生成过程中逐步向客户端推送部分结果，使首字节到达时间远低于 10 秒，满足响应时间要求，同时支持超过 4 MB 的大型输出。30 秒超时为 15–20 秒的处理时间提供了充足裕量。将完整响应存储到 Amazon S3 满足 10 年记录保留的金融监管要求——S3 支持生命周期策略、合规模式的对象锁定（Object Lock）和低成本归档存储层。\n\n**其他选项为什么错：**\n- A. 响应流 + 15 秒超时 + X-Ray：15 秒超时不足以覆盖 15–20 秒的处理时间，且无记录保留方案。\n- B. SQS 异步调用 + CloudWatch 监控：异步调用不满足 10 秒内响应的实时要求。\n- C. API Gateway 轮询 + ElastiCache 缓存 + 30 秒超时：轮询增加延迟，ElastiCache 不满足 10 年持久存储要求。","s":"源#167"},{"id":"D2-078","d":2,"t":"single","q":"一家公司使用 Amazon Bedrock 开发了多模态内容分析应用，将不同内容类型（文本、图像和代码）路由至对应的基础模型（FM）。应用需处理两种路由决策：基于文件扩展名的简单路由须具备极低延迟；基于内容语义的复杂路由须在选择 FM 前进行分析。应用还须提供详尽的日志记录，并在主 FM 故障时支持回退。哪种方案能满足这些要求？","o":[{"l":"A","t":"配置用于调用 Amazon Bedrock FMs 的 AWS Lambda 函数，以处理所有路由逻辑；使用条件语句根据内容类型和语义来确定相应的 FM。"},{"l":"B","t":"构建混合解决方案：在应用程序代码中处理基于文件扩展名的简单路由；通过使用 AWS Step Functions 状态机，并结合 JSONata 进行内容分析、以及 InvokeModel API 处理特定功能模型（FM），来实现复杂的基于内容的路由。"},{"l":"C","t":"为每种内容类型部署独立的 AWS Step Functions 工作流，并在 AWS Lambda 函数中配置路由逻辑；当需要切换至备用 FM 时，可使用 Amazon EventBridge 来协调各工作流之间的交互。"},{"l":"D","t":"为不同内容类型分别使用不同的 Amazon SQS 队列。配置 AWS Lambda 消费者，用于分析内容，并利用 Amazon Bedrock 配合 AWS SDK 根据消息属性调用相应的 FM。"}],"a":["B"],"e":"**正确答案：B。** 构建混合方案：在应用代码中直接处理基于文件扩展名的简单路由；对于复杂的语义路由，使用 AWS Step Functions 状态机结合 JSONata 进行内容分析、InvokeModel API 调用专门的 FM。\n\n**为什么对：** 简单路由（如按 .jpg、.py 等扩展名分发）直接在代码中完成，避免额外服务调用，延迟最低。复杂语义路由需要多步分析和条件分支，Step Functions 专为此场景设计，JSONata 用于数据转换和内容特征提取。Step Functions 提供内置执行历史记录（输入/输出/错误详情），满足详尽日志记录需求。原生 Retry 和 Catch 机制在主 FM 调用失败时可自动回退到备用 FM。两种路由策略在同一架构中各取所长。\n\n**其他选项为什么错：**\n- A. Lambda 条件语句处理所有路由：缺乏结构化执行历史和内建回退机制，不适合复杂语义路由。\n- C. 多个 Step Functions 工作流 + EventBridge 协调：拆分工作流增加架构复杂度和故障模式。\n- D. SQS 队列 + Lambda 消费者：队列引入延迟，工作流可见性有限，不提供详尽的执行历史记录。","s":"源#168"},{"id":"D3-001","d":3,"t":"single","q":"一个社交媒体平台需要跨 50+ 种语言对用户生成的提示和 AI 响应进行内容审核。哪种方法提供全面覆盖？","o":[{"l":"A","t":"Amazon Bedrock Guardrails，带多语言内容过滤和自定义主题检测"},{"l":"B","t":"Amazon Comprehend，带自定义分类模型和语言特定规则"},{"l":"C","t":"第三方内容审核 API，带集成投票和置信度阈值"},{"l":"D","t":"带多语言训练数据和实时推理管道的自定义 ML 模型"}],"a":["A"],"e":"**正确答案：A。** 用 Amazon Bedrock Guardrails（Bedrock 护栏）的内容过滤，再配上自定义 denied topics（拒绝主题）。\n\n**为什么对：** 题干两个要求——覆盖 50+ 种语言、还要能按平台自己的规则拦特定话题。Guardrails 的多语言过滤是托管能力，不用为每种语言各准备一个模型；denied topics 则让你自定义要拦哪些话题。\n\n**其他选项为什么错：**\n- B. Amazon Comprehend + 自定义分类模型：Comprehend 支持的语种有限，50+ 种语言要逐语种训练和调参，工作量不可行。\n- C. 第三方审核 API + 投票：引入外部依赖，多语言覆盖和响应延迟都不可控，内容还要出境。\n- D. 自训 ML 模型 + 实时推理管道：50+ 种语言的训练数据和推理管道，自建成本极高。","s":"源#169"},{"id":"D3-002","d":3,"t":"single","q":"你的护栏系统有 5% 的误报率，阻止了合法业务内容。哪种优化能在保持安全的同时减少误报？","o":[{"l":"A","t":"带业务上下文感知和白名单管理的置信度阈值调整"},{"l":"B","t":"带渐进式细化和人工审核集成的多阶段过滤"},{"l":"C","t":"带领域特定训练和自适应阈值的上下文感知过滤"},{"l":"D","t":"带多种检测算法和加权决策的集成方法"}],"a":["C"],"e":"**正确答案：C。** 换成能理解上下文的过滤方式，用本领域的语料做适配，并让阈值随实际情况自适应。\n\n**为什么对：** 误报的根因是\"只看关键词不看语境\"——业务里的正常术语被当成违规词。上下文感知让判定基于整句语义而不是单词，领域训练让它认识本行业的正常表达，自适应阈值则把拦截线调到合适的松紧度。\n\n**其他选项为什么错：**\n- A. 调置信度阈值 + 白名单管理：白名单只能救已知的误报，新词一出现又拦错；单纯调松阈值会同时放过真违规。\n- B. 多阶段过滤 + 人工审核：人工审核能兜底，但 GenAI 的调用量人手审不过来，而且没降低误报本身。\n- D. 集成多种算法加权决策：如果每个算法都不理解上下文，加权投票的改善也很有限。","s":"源#170"},{"id":"D3-003","d":3,"t":"single","q":"一个医疗保健 AI 系统需要阻止医疗建议，同时允许一般健康信息。哪种护栏配置能达到此平衡？","o":[{"l":"A","t":"带医疗建议检测和一般健康信息白名单的主题过滤"},{"l":"B","t":"带医疗建议阻止和信息内容批准的意图分类"},{"l":"C","t":"带医疗领域专业知识和合规检查的自定义护栏"},{"l":"D","t":"带医疗免责声明注入和保险责任措施的层级过滤"}],"a":["A"],"e":"**正确答案：A。** 用 topic filtering（主题过滤）把\"医疗建议\"设成拒绝主题，同时把一般健康科普类内容放进允许范围。\n\n**为什么对：** 题干要的是\"一条精确的边界\"——同一领域内，给建议要拦、做科普要放。Guardrails 的 denied topics 直接按主题判定而不是按关键词，配合允许范围就能把这条线划清楚。\n\n**其他选项为什么错：**\n- B. 意图分类 + 内容批准：意图分类要在\"建议\"和\"科普\"之间做判断，这两者语义高度接近，分类边界很难做准。\n- C. 自定义护栏 + 领域专业知识：方向没错，但没说清用什么机制区分两类内容，缺乏可落地性。\n- D. 免责声明注入 + 层级过滤：免责声明只是加一句话，并不阻止内容输出，起不到拦截作用。","s":"源#171"},{"id":"D3-004","d":3,"t":"single","q":"你的护栏需要基于新出现的威胁和政策变更进行实时调整。哪种架构支持动态更新？","o":[{"l":"A","t":"带热替换配置和政策变更 A/B 测试的规则引擎"},{"l":"B","t":"带持续学习和模型更新的基于 ML 的检测"},{"l":"C","t":"带版本控制和渐进式发布机制的策略管理系统"},{"l":"D","t":"带威胁情报集成和自动策略调整的事件驱动更新"}],"a":["A"],"e":"**正确答案：A。** 把护栏规则放进支持热替换的规则引擎，改策略即时生效，并用 A/B 测试先验证再全量。\n\n**为什么对：** \"实时调整\"的核心是改完立刻生效，不用重新训练或重新部署。规则引擎支持热替换满足即时性；A/B 测试保证新规则在全量前先在小流量上验证，避免一改就误伤线上。\n\n**其他选项为什么错：**\n- B. 基于 ML 的检测 + 持续学习：模型更新要重新训练再上线，做不到实时。\n- C. 策略管理系统 + 版本控制和渐进发布：版本管理能保证可回滚，但没有解决即时生效和上线前验证。\n- D. 事件驱动更新 + 威胁情报集成：能自动触发更新动作，但更新内容仍要走部署流程，且缺少上线前验证。","s":"源#172"},{"id":"D3-005","d":3,"t":"single","q":"你的内容安全系统需要处理旨在绕过过滤器的对抗性提示。哪种防御策略最有效？","o":[{"l":"A","t":"带提示注入检测和输入清理的对抗训练"},{"l":"B","t":"带提示分析、意图检测和输出验证的多层防御"},{"l":"C","t":"带用户模式识别和异常检测的行为分析"},{"l":"D","t":"带多种检测方法和基于置信度阻止的集成防御"}],"a":["B"],"e":"**正确答案：B。** 输入侧做提示分析、处理过程做意图检测、输出侧再做一次验证，三层叠加。\n\n**为什么对：** 对抗性提示的特点是\"只要有一层被绕过就成功\"。多层防御要求攻击者同时突破输入、处理、输出三道关，任意一层拦住即失败，这是针对绕过类攻击的纵深防御标准思路。\n\n**其他选项为什么错：**\n- A. 对抗训练 + 注入检测 + 输入清洗：三招都在输入侧，输出侧完全没有验证，一旦绕过输入层就直接失守。\n- C. 行为分析 + 用户模式识别：针对的是异常用户的行为特征，防不住单次精心构造的提示。\n- D. 集成防御 + 置信度阻止：多种检测方法如果都部署在同一层，本质上还是单层防御。","s":"源#173"},{"id":"D3-006","d":3,"t":"single","q":"一个全球 AI 系统需要跨不同区域进行文化敏感的内容过滤。哪种方法能处理文化细微差异？","o":[{"l":"A","t":"带文化上下文意识和本地合规要求的区域特定护栏"},{"l":"B","t":"带文化敏感度训练和区域自定义选项的通用过滤"},{"l":"C","t":"带文化专家验证和社区反馈的众包内容指南"},{"l":"D","t":"在多样化文化数据集上训练并带区域微调的 ML 模型"}],"a":["A"],"e":"**正确答案：A。** 按区域各配一套护栏，各自纳入当地的文化语境和监管要求。\n\n**为什么对：** \"文化敏感\"没有全球统一标准——同一句话在不同地区的接受度差别很大。按区域分别配置，才能让每个区域按自己的尺度判定，同时把当地法规要求一并纳入。\n\n**其他选项为什么错：**\n- B. 通用过滤 + 区域自定义选项：底座是统一的，文化差异只作为\"选项\"存在，覆盖不到深层的语境差别。\n- C. 众包内容指南 + 文化专家验证：能产出规则但无法实时执行，众包结果的一致性也难保证。\n- D. ML 模型 + 区域微调：微调需要各区域的标注数据，且模型判定不可解释，合规场景难以举证。","s":"源#174"},{"id":"D3-007","d":3,"t":"single","q":"你的护栏系统需要为内容阻止决策提供详细解释。哪种实现能确保透明度？","o":[{"l":"A","t":"带决策推理和政策参考文档的可解释 AI"},{"l":"B","t":"带详细日志和决策理由捕获的审计追踪系统"},{"l":"C","t":"带解释生成和申诉流程集成的用户反馈系统"},{"l":"D","t":"带策略映射和违规类别识别的基于规则的解释"}],"a":["A"],"e":"**正确答案：A。** 让护栏在拦截时给出人类可读的判定理由，并指明触发的是哪一条策略。\n\n**为什么对：** 题干要\"详细解释\"和\"透明度\"。解释得让人看得懂（不是甩一个分数），还要能追溯到具体规则——\"为什么拦\"加\"依据哪条\"这两样合起来才构成透明。\n\n**其他选项为什么错：**\n- B. 审计追踪 + 决策理由捕获：审计日志面向合规取证、事后查阅，不是给当下被拦住的用户看的解释。\n- C. 用户反馈系统 + 申诉流程：申诉是争议处理流程，它的前提是已经给过解释了，本身不产生解释。\n- D. 基于规则的解释 + 违规类别识别：只告诉用户命中了哪个类别，说不清\"这句话为什么算这一类\"。","s":"源#175"},{"id":"D3-008","d":3,"t":"single","q":"一个内容审核系统需要在自动化与人工监督之间取得平衡，处理边缘案例。哪种混合方法是最优的？","o":[{"l":"A","t":"基于置信度的路由：高置信度自动决策，不确定案例人工审查"},{"l":"B","t":"带自动预过滤和策略违规人工验证的分阶段审核流程"},{"l":"C","t":"带人工反馈集成和模型改进循环的主动学习系统"},{"l":"D","t":"带自动处理和复杂案例专家审查的升级框架"}],"a":["A"],"e":"**正确答案：A。** 按模型给出的置信度分流：高置信度的自动判定，落在中间地带的转人工审核。\n\n**为什么对：** 题干要的是\"平衡\"——全自动省人力但边缘案例容易错，全人工又审不过来。按置信度分流正好把两者结合：确定的部分让机器吃掉，只有真模糊的才占用人工，人力花在刀刃上。\n\n**其他选项为什么错：**\n- B. 分阶段审核 + 自动预过滤 + 人工验证：预过滤之后仍要走人工的范围没界定，大量本来明确的内容也可能进人工队列。\n- C. 主动学习 + 模型改进循环：重点在让模型越用越准，是长期优化手段，不是当下的分流机制。\n- D. 升级框架 + 专家审查：升级通常靠用户申诉或固定规则触发，缺少\"按不确定度自动识别边缘案例\"的能力。","s":"源#176"},{"id":"D3-009","d":3,"t":"single","q":"一个 GenAI 系统处理敏感客户数据，需要端到端加密和密钥管理。哪种方法提供全面保护？","o":[{"l":"A","t":"带客户管理密钥和信封加密的 AWS KMS，覆盖静态和传输中数据"},{"l":"B","t":"带应用管理密钥和安全密钥分发的客户端加密"},{"l":"C","t":"带专用密钥存储和加密处理的硬件安全模块"},{"l":"D","t":"对不同数据敏感度级别使用不同密钥的多层加密"}],"a":["A"],"e":"**正确答案：A。** 用 AWS KMS（Key Management Service，密钥管理服务）配 CMK（customer managed key，客户托管密钥），对静态和传输中的数据做信封加密。\n\n**为什么对：** 题干要\"端到端加密\"加\"密钥管理\"两件事。KMS 管的是密钥的生命周期——生成、轮换、授权、审计；信封加密则解决大数据量下的效率问题：数据用数据密钥加密，数据密钥再用 CMK 保护。静态和传输中都覆盖到了。\n\n**其他选项为什么错：**\n- B. 客户端加密 + 应用自管密钥：密钥的生成、轮换、权限、审计全要自己实现，风险集中在应用这一层。\n- C. 硬件安全模块（HSM）：HSM 提供密钥的物理级保护，但密钥的分发和日常使用管理还得靠配套服务。\n- D. 多层加密 + 按敏感度分级密钥：分级是策略设计，没有回答\"密钥由谁管、怎么轮换\"这个核心问题。","s":"源#177"},{"id":"D3-010","d":3,"t":"single","q":"你的 AI 系统需要检测并防止输入和输出中的 PII 泄漏。哪种全面方法能解决此问题？","o":[{"l":"A","t":"Amazon Bedrock Guardrails，对输入和输出进行 PII 检测和掩码"},{"l":"B","t":"Amazon Macie 数据发现，实时 PII 检测和阻止"},{"l":"C","t":"带 PII 模式识别和数据丢失防护集成的自定义 NLP 模型"},{"l":"D","t":"带 PII 替换和安全令牌管理的令牌化系统"}],"a":["A"],"e":"**正确答案：A。** 用 Amazon Bedrock Guardrails（Bedrock 护栏）的敏感信息过滤，对输入和输出两侧都做 PII（Personally Identifiable Information，个人身份信息）检测和掩码。\n\n**为什么对：** 题干的关键词是\"输入和输出\"两端。Guardrails 挂在模型调用的前后，两侧都能拦——用户把 PII 发进来会被识别，模型把 PII 吐出去也会被掩码，一套配置覆盖两端。\n\n**其他选项为什么错：**\n- B. Amazon Macie：Macie 用来发现存放在 Amazon S3 里的敏感数据，是存储侧扫描工具，拦不住实时进出的提示和输出。\n- C. 自定义 NLP 模型 + DLP 集成：识别模型要自己训练和运维，接入点也得自己搭，两端是否都覆盖没有保障。\n- D. 令牌化系统 + 安全令牌管理：令牌化做的是\"用假数据替换真数据\"，前提是已经识别出哪里是 PII，检测这一环是空的。","s":"源#178"},{"id":"D3-011","d":3,"t":"single","q":"一个多租户 AI 系统需要数据隔离，防止跨租户数据访问。哪种架构确保完全隔离？","o":[{"l":"A","t":"租户特定加密密钥，带隔离数据处理和访问控制"},{"l":"B","t":"带租户特定模式和行级安全的数据库级隔离"},{"l":"C","t":"带租户上下文验证和数据分区的应用级隔离"},{"l":"D","t":"带租户特定 VPC 和网络分段的基础设施隔离"}],"a":["A"],"e":"**正确答案：A。** 每个租户配一把独立的加密密钥，数据处理和访问也按租户分开。\n\n**为什么对：** 题干要\"完全隔离\"。加密隔离的特点是——就算权限配错、应用出漏洞，拿到的数据没有该租户的密钥也只是一堆解不开的密文。这层防线不依赖代码写对。\n\n**其他选项为什么错：**\n- B. 数据库级隔离（独立 schema + 行级安全）：隔离靠数据库的权限规则，规则配错或被查询绕过就失效。\n- C. 应用级隔离（租户上下文校验 + 数据分区）：完全依赖应用代码每次都校验正确，是四个选项里最脆弱的一层。\n- D. 基础设施隔离（独立 VPC + 网络分段）：能挡住网络层的横向访问，但落到存储层的数据本身仍是明文可读的。","s":"源#179"},{"id":"D3-012","d":3,"t":"single","q":"你的 AI 系统需要与外部 API 安全通信，同时防止数据外泄。哪些安全措施是必要的？","o":[{"l":"A","t":"带网络 ACL 和数据丢失防护监控的 VPC 端点"},{"l":"B","t":"带认证、授权和流量检查的 API 网关"},{"l":"C","t":"带内容过滤和加密通信通道的代理服务器"},{"l":"D","t":"带微分段和持续验证的零信任架构"}],"a":["A"],"e":"**正确答案：A。** 通过 VPC endpoint（VPC 端点）走 AWS 内网，用 NACL（网络访问控制列表）收紧访问范围，再加 DLP（data loss prevention，数据防泄漏）监控外发内容。\n\n**为什么对：** 两个要求对应两层防护。安全通信——VPC 端点让流量留在 AWS 骨干网内，不暴露到公网；防外泄——NACL 限制能往哪发，DLP 检查发出去的内容里有没有敏感数据，一个管通路一个管内容。\n\n**其他选项为什么错：**\n- B. API 网关 + 认证授权 + 流量检查：网关主要面向入站 API 管理，对\"内部数据往外发\"这条路径覆盖不到。\n- C. 代理服务器 + 内容过滤 + 加密通道：思路接近，但代理层要自己搭和维护，也没有 VPC 端点那种原生内网通路。\n- D. 零信任架构 + 微分段 + 持续验证：零信任是整体安全理念，题干问的是具体措施，而且它不直接解决内容级的外泄检测。","s":"源#180"},{"id":"D3-013","d":3,"t":"single","q":"一个 GenAI 应用需要符合 GDPR 的\"被遗忘权\"要求。哪种实现支持数据删除？","o":[{"l":"A","t":"带自动删除工作流和验证过程的数据血缘追踪"},{"l":"B","t":"带数据掩码和保留策略执行的不可变审计日志"},{"l":"C","t":"带墓碑记录和级联删除机制的版本化数据存储"},{"l":"D","t":"带加密删除证明的基于区块链的数据溯源"}],"a":["A"],"e":"**正确答案：A。** 先靠 data lineage（数据血缘）定位某个用户的数据散落在哪些位置，再用自动删除工作流清掉，最后验证确实删干净。\n\n**为什么对：** 被遗忘权的难点不在\"删\"而在\"删全\"——同一份用户数据可能同时存在于日志、检索索引、备份和向量库里。血缘追踪负责找全，自动工作流负责执行，验证环节负责确认，三步缺一不可。\n\n**其他选项为什么错：**\n- B. 不可变审计日志 + 数据掩码：不可变日志的设计初衷就是不能删，跟删除要求直接冲突。\n- C. 版本化存储 + 墓碑记录 + 级联删除：版本化会保留历史版本，反而增加删除难度；墓碑只是打标记，不等于真删。\n- D. 区块链溯源 + 加密删除证明：区块链不可篡改的特性，跟\"把数据删掉\"天然矛盾。","s":"源#181"},{"id":"D3-014","d":3,"t":"single","q":"你的 AI 系统需要运行时安全监控，检测异常行为和潜在攻击。哪种监控方法最有效？","o":[{"l":"A","t":"带基线建立和异常检测算法的行为分析"},{"l":"B","t":"带模式识别和威胁情报集成的实时日志分析"},{"l":"C","t":"带深度包检测和入侵检测的网络流量监控"},{"l":"D","t":"带安全指标和告警系统的应用性能监控"}],"a":["A"],"e":"**正确答案：A。** 先给系统建立正常行为基线，再持续比对，明显偏离基线的判定为异常。\n\n**为什么对：** 题干关键词是\"异常行为\"和\"潜在攻击\"——尤其是此前没见过的攻击。基于规则的检测只能识别已知特征；行为分析靠\"跟平时不一样\"来发现没有先例的手法。\n\n**其他选项为什么错：**\n- B. 实时日志分析 + 威胁情报：依赖已知攻击特征库，识别不了没有先例的新手法。\n- C. 网络流量监控 + 深度包检测：看的是网络层，GenAI 应用层的异常（比如提示注入）在流量里看不出来。\n- D. 应用性能监控 + 安全指标告警：APM 盯的是延迟、错误率这类性能指标，不是安全行为。","s":"源#182"},{"id":"D3-015","d":3,"t":"single","q":"你的系统需要安全提示处理，防止提示注入和数据外泄。哪些安全措施是必要的？","o":[{"l":"A","t":"带提示清理和注入模式检测的输入验证"},{"l":"B","t":"带隔离处理和输出验证的沙箱执行"},{"l":"C","t":"带恶意意图检测和阻止机制的内容分析"},{"l":"D","t":"带提示分析和响应验证的多阶段过滤"}],"a":["A"],"e":"**正确答案：A。** 在提示送进模型之前做输入验证：清理可疑内容，并匹配已知的注入模式。\n\n**为什么对：** 题干两个威胁——注入和外泄，防线都该尽量往前推。入口验证能在恶意提示到达模型之前就把它拦下，成本最低，也避免模型被带偏之后再把数据带出去。\n\n**其他选项为什么错：**\n- B. 沙箱执行 + 输出验证：沙箱和效果验证都在模型调用之后，这时候注入其实已经发生了。\n- C. 内容分析 + 恶意意图检测：方向跟 A 接近，但没说清楚在哪个环节执行，也缺少\"清理\"这个具体动作。\n- D. 多阶段过滤 + 提示分析和响应验证：听着更全面，但重点落在响应侧，入口这一道没有明确保障。","s":"源#183"},{"id":"D3-016","d":3,"t":"single","q":"一个医疗保健聊天机器人必须在向 FM 提交提示前检测个人健康信息。哪个服务能帮助识别敏感文本？","o":[{"l":"A","t":"AWS CodeBuild"},{"l":"B","t":"Amazon CloudFront"},{"l":"C","t":"Amazon Comprehend Medical"},{"l":"D","t":"Amazon Route 53"}],"a":["C"],"e":"**正确答案：C。** 用 Amazon Comprehend Medical 识别文本里的医疗健康实体。\n\n**为什么对：** 题干有两个限定——\"提交给 FM 之前\"说明是在线实时检测，\"个人健康信息 PHI\"说明不是普通 PII。Comprehend Medical 是专门面向医疗文本的实体识别服务，能认出疾病、药物、剂量这些常规 PII 检测器识别不出的医疗实体。\n\n**其他选项为什么错：**\n- A. AWS CodeBuild：持续集成构建服务，不做文本分析。\n- B. Amazon CloudFront：CDN 内容分发服务，跟文本检测无关。\n- D. Amazon Route 53：DNS 解析服务，跟文本检测无关。","s":"源#184"},{"id":"D3-017","d":3,"t":"single","q":"一个 GenAI 应用必须加密存储用于审计的提示和生成输出。哪个 AWS 服务应管理加密密钥？","o":[{"l":"A","t":"Amazon CloudFront"},{"l":"B","t":"Amazon Route 53"},{"l":"C","t":"AWS CodeBuild"},{"l":"D","t":"AWS KMS"}],"a":["D"],"e":"**正确答案：D。** 用 AWS KMS（Key Management Service，密钥管理服务）来管理加密密钥。\n\n**为什么对：** 题干问的就是\"哪个服务管理加密密钥\"。KMS 的职责正是这件事——密钥的生成、存储、轮换、使用授权都归它管，存储侧做静态加密时直接调用它即可。\n\n**其他选项为什么错：**\n- A. Amazon CloudFront：CDN 分发服务，不管密钥。\n- B. Amazon Route 53：DNS 解析服务，不管密钥。\n- C. AWS CodeBuild：持续集成构建服务，不管密钥。","s":"源#185"},{"id":"D3-018","d":3,"t":"single","q":"一家公司需要限制开发团队在 Amazon Bedrock 中可以调用的基础模型。应使用哪种控制？","o":[{"l":"A","t":"IAM 权限"},{"l":"B","t":"DNS 别名"},{"l":"C","t":"S3 生命周期规则"},{"l":"D","t":"EBS 卷标签"}],"a":["A"],"e":"**正确答案：A。** 用 AWS IAM 权限策略限定哪些角色可以调用哪些基础模型。\n\n**为什么对：** 题干是\"谁能用什么\"的授权问题，这正是 IAM 的职责。在 Amazon Bedrock 上可以针对具体模型的 ARN 写允许或拒绝策略，把可调用范围精确收窄到指定模型。\n\n**其他选项为什么错：**\n- B. DNS 别名：域名解析层面的配置，不做访问授权。\n- C. S3 生命周期规则：对象存储的过期与转储规则，跟模型访问无关。\n- D. EBS 卷标签：云硬盘的标记，跟模型访问无关。","s":"源#186"},{"id":"D3-019","d":3,"t":"single","q":"一个开发者需要确保上传到 GenAI 管道的文档在摄取前不含恶意软件。应添加哪种控制？","o":[{"l":"A","t":"恶意软件扫描步骤"},{"l":"B","t":"更高的模型温度"},{"l":"C","t":"公共对象访问"},{"l":"D","t":"随机分块大小"}],"a":["A"],"e":"**正确答案：A。** 在摄取管道里加一步恶意软件扫描，扫过才允许进入下游。\n\n**为什么对：** 题干要求\"摄取之前\"拦截。加一道扫描，带毒文件在进入分块、嵌入、入索引这些环节之前就被挡住，既不会污染知识库，也没有机会在后续处理中被触发。\n\n**其他选项为什么错：**\n- B. 更高的模型温度：温度控制的是输出随机性，跟安全扫描毫无关系，调高反而让输出更不可控。\n- C. 公共对象访问：把对象设成公开访问是放大风险，不是控制措施。\n- D. 随机分块大小：分块策略影响的是检索质量，跟恶意软件检测无关。","s":"源#187"},{"id":"D3-020","d":3,"t":"single","q":"某企业计划在五个独立业务部门部署多个生成式 AI 应用，这些部门分布在欧洲和美洲多国。各应用采用 Bedrock RAG 模式，配有存储 TB 级非结构化数据的部门专属知识库。公司须为全部 GenAI 应用建立符合良好架构框架的标准组件，涵盖安全控制、可观测性实践和部署模式，且须可复用、版本化并一致治理。哪项方案可满足需求？","o":[{"l":"A","t":"为各应用配置 API Gateway REST API 端点。基于 Well-Architected Generative AI Lens 将通用安全、可观测性和 RAG 模式部署在标准化 CloudFormation 模板中。部署后用 CloudFormation Guard 验证各部门策略合规性"},{"l":"B","t":"基于 Well-Architected Generative AI Lens 创建标准化 CloudFormation 模板，实现安全、可观测性和 RAG 模式。建立版本控制中央存储库。将 CI/CD 管道与 CloudFormation Guard 集成，跨部门强制一致且可重复的部署"},{"l":"C","t":"使用 Service Catalog 为各部门定义标准化产品组合和版本化产品。用这些产品组合强制执行基于 Well-Architected Lens 的安全、可观测性和 RAG 模式。要求部门通过 Service Catalog 控制台部署资源"},{"l":"D","t":"在共享设计文档中记录基于 Well-Architected Lens 的安全控制、可观测性需求和 RAG 模式。使用 Macie 强制执行部署。将实施责任委托给各部门"}],"a":["B"],"e":"**正确答案：B。** 标准化 CloudFormation 模板+中央存储库+CI/CD Guard。\n\n**为什么对：**CloudFormation 模板将安全控制、可观测性和 RAG 模式编码为可复用 IaC，中央存储库提供版本控制确保组件一致性和可追溯性。CI/CD 管道集成 CloudFormation Guard 在部署前自动验证策略合规，跨部门强制一致且可重复的部署。这套做法将框架要求转化为自动化执行的代码级标准。\n\n**其他选项为什么错：**\n- A.API Gateway 端点+部署后验证：部署后验证无法阻止不合规资源上线，API Gateway 非核心治理组件\n- C.Service Catalog：虽可行但侧重产品目录管理，不如 CI/CD 集成 Guard 的自动化合规验证\n- D.共享文档+Macie 强制执行：文档缺乏强制力，Macie 用于数据分类非部署治理\n\n**关键概念：**CloudFormation 模板将 Well-Architected 框架编码为可版本控制的 IaC，CI/CD 集成 CloudFormation Guard 实现部署前自动化合规验证。","s":"源#188"},{"id":"D3-021","d":3,"t":"single","q":"某媒体企业须借助 Bedrock 建立严谨的内容生成管控机制。企业需统一管控上百份提示词模板，跨不同 AWS 可用区域由各业务组调用执行。方案须支持含审批流程的版本管理并附带待审核提醒，同时留存完整的操作审计轨迹以追踪提示词使用情况，并通过参数化模板统一质量基线。哪项方案可满足需求？","o":[{"l":"A","t":"配置 Bedrock Studio 提示模板。用 CloudWatch 仪表板显示提示使用指标。审批状态存入 DynamoDB。用 Lambda 函数强制审批"},{"l":"B","t":"使用 Bedrock Prompt Management 实施版本控制。配置 CloudTrail 进行审计日志记录。用 IAM 策略控制审批权限。通过指定变量创建参数化提示模板"},{"l":"C","t":"使用 Step Functions 创建审批工作流。提示存入 S3。用标签实施版本控制。用 EventBridge 发送通知"},{"l":"D","t":"部署 SageMaker Canvas，提示模板存入 S3。用 CloudFormation 进行版本控制。用 Config 强制审批策略"}],"a":["B"],"e":"**正确答案：B。** Prompt Management 版本控制+CloudTrail+IAM+参数化。\n\n**为什么对：**Prompt Management 原生支持提示版本控制和参数化变量，确保跨团队一致的提示标准化。CloudTrail 提供跨服务 API 活动的不可变审计日志。IAM 策略控制审批权限实现细粒度访问管理。参数化模板强制质量标准并支持跨区域一致使用。全部利用 Bedrock 原生能力，无需自定义工作流。\n\n**其他选项为什么错：**\n- A.Studio+CloudWatch+DynamoDB+Lambda：需自定义审批逻辑和存储，非 Prompt Management 原生功能\n- C.Step Functions+S3+标签：S3 标签版本控制不如原生 Prompt Management 精确，需自定义编排\n- D.SageMaker Canvas+CloudFormation：Canvas 非Prompt Management（提示管理）工具，CloudFormation 非用于提示版本控制\n\n**关键概念：**Bedrock Prompt Management 原生提供提示版本控制和参数化变量，配合 CloudTrail 审计和 IAM 权限管理实现完整的提示治理流程。","s":"源#189"},{"id":"D3-022","d":3,"t":"single","q":"某企业在 AWS 上搭建视频分析平台，借助 Rekognition 和 Bedrock 对海量视频档案进行智能分析。平台须遵循既定隐私规范，确保模型输入输出的安全性、管控 FM 的调用行为，并留存完整的操作审计日志以记录每个用户对每项资源的访问时间与内容。哪项方案可满足需求？","o":[{"l":"A","t":"为 Bedrock API 调用配置 VPC 端点。实施 Bedrock 护栏过滤有害内容。用 Bedrock 跟踪事件审计。将跟踪导出到 CloudWatch Logs。将提示和输出存入启用 SSE-KMS 的 S3"},{"l":"B","t":"使用带 ABAC 的 IAM 定义访问控制，将部门映射到特定权限。为 Bedrock API 调用配置 VPC 端点。用 IAM 条件键强制指定 GuardrailIdentifier 和 ModelId 值。配置 CloudTrail 捕获管理和数据事件。启用 S3 服务器访问日志。将日志发送到 CloudTrail Lake。设置 CloudWatch 告警检测意外活动"},{"l":"C","t":"使用 VPC 端点策略限制访问。用 Config 跟踪资源更改和合规性。用 SSE-KMS 加密静态数据。将模型输入输出存入单独 S3 存储桶。启用 S3 服务器访问日志"},{"l":"D","t":"配置 CloudTrail Insights 分析跨账户 API 调用模式。部署 Macie 扫描视频档案。用 SSE-KMS 加密所有存储数据。配置 EventBridge 规则处理异常和发现"}],"a":["B"],"e":"**正确答案：B。** ABAC IAM+VPC 端点+IAM 条件键+CloudTrail+CloudTrail Lake。\n\n**为什么对：**ABAC 通过部门属性动态映射权限，IAM 条件键强制每次 Bedrock 调用指定 GuardrailIdentifier 和 ModelId，确保仅已批准的Guardrails（护栏）和模型被使用。VPC 端点保持 API 调用在私有网络路径上。CloudTrail 捕获管理和数据事件提供完整审计记录，S3 服务器访问日志记录文件级交互，CloudTrail Lake 提供可查询的审计存储。CloudWatch 告警实现实时异常检测。\n\n**其他选项为什么错：**\n- A.VPC 端点+护栏+跟踪事件：缺乏 IAM 条件键强制指定护栏和模型，审计覆盖不全面\n- C.VPC 端点策略+Config：Config 跟踪配置变更但非 API 调用审计，缺乏条件键强制\n- D.CloudTrail Insights+Macie：Insights 为异常检测而非完整审计，Macie 扫描数据但不控制模型访问\n\n**关键概念：**ABAC 配合 IAM 条件键强制指定护栏和模型标识符，VPC 端点保障私有网络路径，CloudTrail 和 CloudTrail Lake 提供完整可查询的审计记录。","s":"源#190"},{"id":"D3-023","d":3,"t":"single","q":"某公司创建使用 Bedrock 基础模型的生成式 AI 应用。应用须使用 Microsoft Entra ID 进行身份验证，所有 FM API 调用须保持在私有网络路径上。对应用的访问须按部门限制到特定模型系列，且须提供模型交互的全面审计跟踪。哪项方案可满足需求？","o":[{"l":"A","t":"在 Entra ID 和 IAM 间配置 SAML 联合。创建仅允许所需 ModelId 值的部门特定 IAM 角色。为 Bedrock 运行时服务创建 PrivateLink 接口 VPC 端点。启用 CloudTrail 捕获 Bedrock API 调用。配置 Bedrock 模型调用日志记录详细交互"},{"l":"B","t":"在 IAM 中创建 IdP 连接使用 Entra ID 验证。分配部门权限集控制特定模型系列访问。在私有子网部署 Lambda 并设 NAT 网关出站到 Bedrock 公共端点。启用 CloudWatch Logs 捕获交互"},{"l":"C","t":"在 IAM 中创建 SAML IdP 使用 Entra ID 验证。用 IAM 权限边界限制部门角色模型访问。配置公共 Bedrock 端点并通过 VPC 路由保持私有连接。设 CloudTrail 管理审计日志"},{"l":"D","t":"在 Entra ID 和 IAM 间配置 OIDC 联合。用 ABAC 将部门属性映射到特定模型访问权限。应用 SCP 按部门限制 Bedrock FM 系列访问。用 Entra ID 内置日志记录维护审计"}],"a":["A"],"e":"**正确答案：A。** SAML 联合+部门 IAM 角色+PrivateLink VPC 端点+CloudTrail。\n\n**为什么对：**SAML 联合实现 Entra ID 与 IAM 的身份集成，部门特定 IAM 角色通过 ModelId 条件精确限制各部门可用模型。PrivateLink 接口 VPC 端点确保所有 API 调用经私有网络路径，不经过公网。CloudTrail 捕获 API 调用审计，Bedrock 模型调用日志记录提供详细的输入输出交互审计。\n\n**其他选项为什么错：**\n- B.NAT 网关出站到公共端点：NAT 网关流量经公网，违反私有网络路径要求\n- C.公共端点+VPC 路由：公共端点不符合私有连接要求，权限边界不如角色策略精确\n- D.OIDC+SCP+Entra ID 日志：SCP 为账户级控制非部门级，Entra ID 内置日志不覆盖 AWS 侧 API 调用\n\n**关键概念：**SAML 联合实现企业身份与 IAM 集成，PrivateLink VPC 端点保障 API 调用私有化，部门 IAM 角色通过 ModelId 条件实现模型级访问控制。","s":"源#191"},{"id":"D3-024","d":3,"t":"multiple","q":"某大学构建包含多个子应用的 AI 驱动应用平台，子应用包括 AI 助手、作业评分器和内部分析工具。大学使用多种基础模型定义和测试多个提示，希望比较提示变体并选出最佳输出版本。须实现提示版本控制、变体测试和审计跟踪，同时保持一致性并允许提示集成到主应用中。哪组方案组合能以最少运营开销满足需求？（选择两项）","o":[{"l":"A","t":"使用 Bedrock Prompt Management 创建版本化提示。为每个用例包含参数化变量"},{"l":"B","t":"将提示存入 S3。使用 Step Functions 编排模型交互和服务集成"},{"l":"C","t":"使用 Bedrock Flows 创建工作流，结合 FM 和 AWS 服务"},{"l":"D","t":"配置 Config 记录提示更改。用 CloudTrail 跟踪提示使用"},{"l":"E","t":"配置 Bedrock 智能提示路由"}],"a":["A","C"],"e":"**正确答案：A、C。**\n\n**为什么对：**\n- A.Prompt Management 版本化提示+参数化变量：原生提供提示版本控制、变体管理和参数化能力，支持跨用例测试和审计跟踪，无需自定义存储或编排\n- C.Bedrock Flows 工作流：将提示集成到工作流中与 FM 和 AWS 服务结合，实现提示在主应用中的一致部署和测试编排\n\n**其他选项为什么错：**\n- B.S3 存储提示+Step Functions：需自定义版本控制和编排逻辑，运营开销高于原生方案\n- D.Config+CloudTrail：Config 跟踪资源配置变更非提示版本，CloudTrail 记录 API 调用非提示内容审计\n- E.智能提示路由：路由用于模型选择优化，非版本控制和变体测试工具\n\n**关键概念：**Prompt Management 提供原生提示版本控制和参数化变体管理，Flows 将提示集成到编排工作流中实现测试和部署一致性。","s":"源#192"},{"id":"D3-025","d":3,"t":"multiple","q":"某公司在 AWS Organizations 中管理多个 AWS 账户，员工跨账户使用 Bedrock。公司须防止特定主题和专有信息出现在对模型的提示中，须确保员工仅使用已批准的模型，并希望集中管理这些控制措施。哪组方案组合可满足需求？（选择两项）","o":[{"l":"A","t":"为每个员工 IAM 角色创建权限边界，要求使用已批准护栏标识符调用模型。创建 SCP 允许仅使用已批准模型"},{"l":"B","t":"创建 SCP 允许仅使用已批准模型。配置 SCP 要求员工调用已批准模型时指定护栏标识符"},{"l":"C","t":"创建 SCP，若调用模型时未指定集中部署的护栏标识符则阻止调用。在每个员工 IAM 角色上创建权限边界，允许仅调用已批准模型"},{"l":"D","t":"使用 CloudFormation 创建具有阻止过滤策略的自定义 Bedrock 护栏。使用堆栈集将护栏部署到组织中每个账户"},{"l":"E","t":"借助 CloudFormation 构建采用遮蔽过滤策略的定制 Bedrock 护栏，以堆栈集方式推送到组织内各个账户"}],"a":["C","D"],"e":"**正确答案：C、D。**\n\n**为什么对：**\n- C.SCP 强制Guardrails（护栏）标识符+IAM 权限边界：SCP 在组织层强制调用模型时须指定护栏标识符，权限边界在账户层限定仅可用已批准模型，双层控制实现集中治理\n- D.CloudFormation 阻止过滤护栏+堆栈集：堆栈集将护栏部署到所有账户，阻止过滤策略在护栏层拦截禁止主题和专有信息\n\n**其他选项为什么错：**\n- A.权限边界要求护栏+SCP 允许模型：权限边界无法强制指定护栏标识符，需 SCP 条件键，且 SCP 仅允许模型不强制护栏\n- B.SCP 允许模型+SCP 要求护栏：SCP 无法在同一策略中既允许又附加条件要求护栏，需权限边界配合\n- E.遮蔽策略护栏+堆栈集：遮蔽过滤适合处理敏感输出而非拦截提示中禁止主题，与防泄漏需求不匹配\n\n**关键概念：**SCP 在组织层通过条件键强制护栏标识符指定，权限边界在账户层限定已批准模型，堆栈集实现护栏集中部署和一致管理。","s":"源#193"},{"id":"D3-026","d":3,"t":"multiple","q":"某公司在 Control Tower 中配置了着陆区，处理须保留在欧盟境内的敏感数据，仅可使用 eu-central-1 区域。公司使用 SCP 强制数据驻留策略。GenAI 开发人员被分配具有 Bedrock 完全权限的 IAM 角色。公司须确保开发人员仅通过跨区域推理在 eu-central-1 中使用 Nova Pro 模型。开发人员通过 Playground 调用模型时收到 SCP 拒绝错误。哪组方案组合可解决该错误并保留现有治理控制？（选择两项）","o":[{"l":"A","t":"向开发人员 IAM 角色添加 AdministratorAccess 策略"},{"l":"B","t":"扩展现有 SCP，为 eu.amazon.nova-pro-v1:0 推理配置文件启用 CRI"},{"l":"C","t":"在 eu-west-3 区域启用 Nova Pro 的 Bedrock 模型访问"},{"l":"D","t":"验证开发人员 IAM 角色是否有权限通过欧盟区域中的推理配置文件调用 Nova Pro"},{"l":"E","t":"扩展现有 SCP，为 eu-* 推理配置文件启用 CRI"}],"a":["B","E"],"e":"**正确答案：B、E。**\n\n**为什么对：**\n- B.扩展 SCP 为特定推理配置文件启用 CRI：精确允许 eu.amazon.nova-pro-v1:0 配置文件的Cross-Region Inference（跨区域推理），使开发人员可通过 CRI 在 eu-central-1 使用 Nova Pro 而不违反Data Residency（数据驻留）\n- E.扩展 SCP 为 eu-* 推理配置文件启用 CRI：为所有欧洲区域推理配置文件启用 CRI，确保跨区域推理请求不被 SCP 拒绝，同时保持在欧盟境内符合数据驻留策略\n\n**其他选项为什么错：**\n- A.AdministratorAccess：过度授权违反最小权限原则，不解决 SCP 拒绝问题\n- C.在 eu-west-3 启用模型访问：问题在于 SCP 拒绝非模型访问未启用，且 eu-west-3 非数据驻留区域\n- D.验证 IAM 权限：SCP 拒先于 IAM 权限评估，IAM 权限不解决 SCP 层面的阻塞\n\n**关键概念：**SCP 通过条件键控制跨区域推理配置文件的访问，扩展 SCP 为 eu-* 推理配置文件启用 CRI 可在保持数据驻留合规的同时解决 Playground 调用被拒绝的问题。","s":"源#194"},{"id":"D3-027","d":3,"t":"multiple","q":"某银行构建生成式 AI 应用，使用 Bedrock 通过扫描的财务文档评估贷款申请。应用须从文档中提取结构化数据、在推理前编辑 PII、用 FM 生成批准结果，并将低置信度提取结果路由到与申请人同区域的人工审核员。须符合严格的区域数据驻留和可审计性要求，每天处理 25000 份申请并提供 99.9% 可用性。哪组方案组合可满足需求？（选择三项）","o":[{"l":"A","t":"在同一区域内部署 Textract 和 Augmented AI 从扫描文档提取数据。将低置信度页面路由到人工审核员"},{"l":"B","t":"使用 Lambda 在推理前检测并编辑文档中的 PII。应用 Bedrock 护栏防止不当内容。配置区域特定 IAM 角色强制数据驻留"},{"l":"C","t":"在推理前使用 Kendra 和 OpenSearch Service 从文档语义提取字段级值"},{"l":"D","t":"将上传文档存入 S3 并应用对象元数据。配置 IAM 策略将原始文档存储在申请人所在同区域。为审计启用对象标记"},{"l":"E","t":"使用 Glue Data Quality 验证结构化数据。用 Step Functions 编排包含提示工程步骤的审核工作流"},{"l":"F","t":"使用 SageMaker Clarify 基于 Bedrock 模型评分决策生成公平性和偏见报告"}],"a":["A","B","D"],"e":"**正确答案：A、B、D。**\n\n**为什么对：**\n- A.同区域 Textract+Augmented AI：Textract 提取扫描文档数据，Augmented AI 将低置信度页面路由到同区域人工审核员，满足Data Residency（数据驻留）和人工兜底需求\n- B.Lambda 编辑 PII+Bedrock Guardrails（护栏）+区域 IAM 角色：推理前 Lambda 检测编辑 PII，护栏防止不当输出，区域特定 IAM 角色强制数据驻留\n- D.S3 存储同区域+对象元数据+标记：原始文档存储在申请人同区域满足驻留要求，对象元数据和标记支持审计可追溯性\n\n**其他选项为什么错：**\n- C.Kendra+OpenSearch 语义提取：需求为结构化数据提取非语义搜索，引入不必要服务\n- E.Glue Data Quality+Step Functions 编排：Glue Data Quality 非用于文档提取验证，Step Functions 编排增加运营开销\n- F.SageMaker Clarify 公平性报告：需求未提及公平性评估，Clarify 非核心需求组件\n\n**关键概念：**Textract 配合 Augmented AI 实现同区域文档提取和人工兜底，Lambda 编辑 PII 配合护栏保障安全，S3 同区域存储和元数据标记满足数据驻留和审计要求。","s":"源#195"},{"id":"D3-028","d":3,"t":"single","q":"某零售企业运营一款基于 Bedrock 的商品推荐系统，依据用户的浏览轨迹与人口特征数据为其推送商品。企业须跨多个受众群体开展公平性测评，对比两种提示词策略在推荐结果中的偏差情况，并实时采集和跟踪公平性指标。若各群体间指标偏差超过 15% 须触发告警，同时每周生成两套策略的绩效对比报告。哪项方案在最少自定义开发的前提下满足需求？","o":[{"l":"A","t":"配置 CloudWatch 仪表板显示 Bedrock API 调用默认指标。基于模型输出创建自定义指标。设 EventBridge 规则调用 Lambda 执行后处理分析并发布公平性指标"},{"l":"B","t":"在 Prompt Management 中创建两个提示变体。使用 Bedrock Flows 部署具有流量分配的变体。配置护栏监控人口统计公平性。用 InvocationsIntervened 指标设 CloudWatch 告警检测差异阈值违规"},{"l":"C","t":"设置 SageMaker Clarify 分析模型输出。将公平性指标发布到 CloudWatch。创建结合 Clarify 偏见指标和 Bedrock 延迟指标的复合告警"},{"l":"D","t":"创建 Bedrock 模型评估作业比较两变体间的公平性。在 CloudWatch 中启用模型调用日志。为每个人口统计群体设 InvocationsIntervened 指标告警"}],"a":["B"],"e":"**正确答案：B。** Prompt Management 变体+Flows 流量分配+Guardrails（护栏）+InvocationsIntervened 告警。\n\n**为什么对：**Prompt Management 创建两个提示变体，Flows 分配流量实现 A/B 测试。护栏监控人口统计公平性，InvocationsIntervened 指标记录护栏干预事件，通过 GuardrailContentSource 维度可按人口统计群体分组检测差异。设 CloudWatch 告警在差异超 15% 时触发，全部使用 Bedrock 原生能力，自定义开发量最小。\n\n**其他选项为什么错：**\n- A.CloudWatch 默认指标+Lambda 后处理：需自定义 Lambda 分析逻辑，开发量大且非实时\n- C.SageMaker Clarify+复合告警：Clarify 为批量分析工具非实时监控，复合告警配置复杂\n- D.Model Evaluation（模型评估）作业：评估作业为离线批量比较非实时监控，无法满足 15% 差异实时告警需求\n\n**关键概念：**Prompt Management 变体配合 Flows 流量分配实现 A/B 测试，护栏 InvocationsIntervened 指标按 GuardrailContentSource 维度监控人口统计公平性，CloudWatch 告警实现实时阈值检测。","s":"源#196"},{"id":"D3-029","d":3,"t":"multiple","q":"某金融机构正在研发一款智能助手，为客户的投资规划和资产配置提供辅助。风控团队已标定若干高风险交互场景——例如索取个股推荐或承诺收益保证——若缺乏有效管控将触发合规风险。团队须保证助手不输出违规的理财指导、不产出涉及竞品的评价内容、不做出超出已审核投资指引依据的事实断言。团队计划借助 Bedrock 护栏构建防护体系。哪组步骤组合可满足需求？（选择三项）","o":[{"l":"A","t":"将高风险对话模式添加到拒绝主题护栏中"},{"l":"B","t":"配置内容过滤器护栏，过滤包含高风险对话模式的提示"},{"l":"C","t":"配置内容过滤器护栏，过滤包含竞争对手名称的提示"},{"l":"D","t":"将竞争对手名称添加为自定义词过滤器。将输入和输出操作设为阻止"},{"l":"E","t":"设置低基础事实分数阈值"},{"l":"F","t":"设置高基础事实分数阈值"}],"a":["A","D","F"],"e":"**正确答案：A、D、F。**\n\n**为什么对：**\n- A.Denied Topics（拒绝主题）Guardrails（护栏）：将高风险场景（个股推荐、收益保证）添加为拒绝主题，直接阻断助手进入相关对话路径\n- D.自定义Word Filters（词过滤器）+阻止：将竞品名称添加为词过滤器并设输入输出阻止，确保双向均不出现竞品信息\n- F.高基础事实分数阈值：设高阈值确保响应仅基于已审核投资指引中的事实，低分内容被拦截\n\n**其他选项为什么错：**\n- B.Content Filter（内容过滤器）过滤高风险提示：内容过滤器针对有害内容非主题控制，不适合过滤投资建议模式\n- C.内容过滤器过滤竞品名称：内容过滤器非精确词汇匹配工具，自定义词过滤器更合适\n- E.低基础事实分数阈值：低阈值允许更多未验证内容通过，无法防止不实声明\n\n**关键概念：**拒绝主题护栏阻断高风险场景，自定义词过滤器精确屏蔽竞品词汇，高基础事实分数阈值确保响应基于已验证事实。","s":"源#197"},{"id":"D3-030","d":3,"t":"single","q":"某野生动物保护组织在多国运营动物园，借助传感设备、追踪器和影音记录装置监测动物活动。组织计划上线一款 AI 助手，可接入多种模态的数据用于动物行为学分析。助手须允许用自然语言进行查询、规避对动物行为的臆测性解读，并为伦理审查留存完整的操作日志。哪项方案可满足需求？","o":[{"l":"A","t":"将原始视频摄取到 Rekognition 检测动物姿态。用 Data Firehose 将传感器和 GPS 数据流式传输到 S3。用 Systems Manager Parameter Store 中的模板提示 Bedrock FM。用 IAM 访问控制和 CloudTrail 审计"},{"l":"B","t":"使用 SageMaker Processing 和 Transcribe 预处理多模态数据。将精选摘要摄取到 Bedrock 知识库中。应用护栏限制推测性输出。用 AppConfig 管理提示模板。用 CloudTrail 记录研究活动用于审计"},{"l":"C","t":"使用 OpenSearch Serverless 索引行为日志和遥测数据。用 Comprehend 提取实体。用 Bedrock 回答索引数据问题。用 IAM 访问控制和 CloudTrail 审计"},{"l":"D","t":"配置 Q Business 跨 S3、Kinesis 和 SageMaker Feature Store 整合数据。用 EventBridge 编排摄取。用自定义 Lambda 函数过滤 LLM 输出的伦理合规性"}],"a":["B"],"e":"**正确答案：B。** SageMaker Processing+Transcribe+Knowledge Bases（知识库）+Guardrails（护栏）+AppConfig+CloudTrail。\n\n**为什么对：**SageMaker Processing 预处理多模态数据（传感器、音视频），Transcribe 将音频转为文本。精选摘要摄入知识库支持自然语言查询。护栏限制推测性输出满足避免推测性行为解释的要求。AppConfig 管理提示模板确保一致性。CloudTrail 记录所有研究活动用于伦理审计。\n\n**其他选项为什么错：**\n- A.Rekognition+Firehose+Parameter Store：Parameter Store 非Prompt Management（提示管理）工具，缺乏推测性输出控制\n- C.OpenSearch+Comprehend+Bedrock：缺乏推测性输出限制机制，Comprehend 实体提取非多模态预处理\n- D.Q Business+自定义 Lambda：自定义 Lambda 伦理过滤不如护栏原生安全控制可靠\n\n**关键概念：**SageMaker Processing 预处理多模态数据，知识库支持自然语言查询，护栏限制推测性输出，AppConfig 管理提示模板，CloudTrail 维护审计日志。","s":"源#198"},{"id":"D3-031","d":3,"t":"single","q":"某银行开发使用 Bedrock 的 AI 助手，帮助网站用户处理账户咨询和财务指导。银行须确保助手不在客户交互中泄露 PII、不在提示中包含 PII、不响应投资建议请求，并须收集所有客户交互的审计日志（含传输的图像或文档）。哪项方案运营工作量最小？","o":[{"l":"A","t":"使用 Macie 检测并编辑 PII。用提示工程避免投资建议主题。用 CloudTrail 捕获对话日志"},{"l":"B","t":"用 Lambda 和 Comprehend 检测编辑 PII。用 Comprehend 主题建模防止投资建议。在 CloudWatch 中设自定义指标捕获对话"},{"l":"C","t":"配置 Bedrock 护栏应用敏感信息策略检测过滤 PII。设主题策略确保助手避免投资建议主题。用 Converse API 记录模型调用。启用投递日志和图像日志记录到 S3"},{"l":"D","t":"用正则表达式匹配 PII 模式。用提示工程避免返回 PII 或投资建议。启用模型调用日志、投递日志和图像日志记录到 S3"}],"a":["C"],"e":"**正确答案：C。** Bedrock Guardrails（护栏） PII 过滤+主题策略+Converse API+日志记录。\n\n**为什么对：**护栏的敏感信息策略原生检测和过滤 PII，无需自定义 Lambda 或正则表达式。主题策略直接阻止投资建议话题，无需提示工程。Converse API 记录模型调用，投递日志和图像日志记录将完整交互内容（含图像和文档）存储到 S3 用于审计。全部使用 Bedrock 原生能力，运营工作量最小。\n\n**其他选项为什么错：**\n- A.Macie+提示工程+CloudTrail：Macie 用于数据扫描非实时交互过滤，提示工程不可靠，CloudTrail 不记录对话内容\n- B.Lambda+Comprehend+主题建模：需自定义 Lambda 管道，Comprehend 主题建模非为投资建议主题控制设计\n- D.正则表达式+提示工程：正则表达式无法覆盖所有 PII 变体，提示工程不可靠\n\n**关键概念：**Bedrock 护栏敏感信息策略原生过滤 PII，主题策略阻止特定话题，Converse API 配合投递日志和图像日志记录提供完整的交互审计追踪。","s":"源#199"},{"id":"D3-032","d":3,"t":"single","q":"某公司使用 Bedrock 构建面向客户的 AI 助手，处理敏感客户咨询。公司须用纵深防御安全控制阻止复杂的提示注入攻击，保留所有安全干预的审计日志，且助手须具备跨区域故障转移能力。哪项方案可满足需求？","o":[{"l":"A","t":"配置 Bedrock 护栏将内容过滤器设为高以防范提示注入。使用护栏配置文件实施跨区域护栏推理。用 CloudWatch Logs 配合自定义指标捕获详细的护栏干预事件"},{"l":"B","t":"配置 Bedrock 护栏将内容过滤器设为高。用 WAF 阻止可疑输入。用 CloudTrail 记录 API 调用"},{"l":"C","t":"部署 Comprehend 自定义分类器检测提示注入。用 API Gateway 请求验证。用 CloudWatch Logs 捕获干预事件"},{"l":"D","t":"配置 Bedrock 护栏将自定义内容过滤器和词过滤器设为高。配置跨区域护栏复制实现故障转移。将日志存入 CloudTrail 供合规审计"}],"a":["A"],"e":"**正确答案：A。** Guardrails（护栏）高过滤器+护栏配置文件跨区域+CloudWatch Logs。\n\n**为什么对：**护栏Content Filter（内容过滤器）设为高提供对提示注入的纵深防御。护栏配置文件实现跨区域护栏推理，当主区域不可用时自动故障转移。CloudWatch Logs 配合自定义指标捕获详细的护栏干预事件，提供安全干预的完整审计记录。方案将安全控制、跨区域弹性和审计追踪整合在 Bedrock 原生能力中。\n\n**其他选项为什么错：**\n- B.护栏+WAF+CloudTrail：WAF 阻止可疑输入但缺乏跨区域故障转移能力，CloudTrail 不记录护栏干预详情\n- C.Comprehend 分类器+API Gateway：Comprehend 非为提示注入检测设计，缺乏跨区域弹性\n- D.自定义过滤器+跨区域复制：跨区域护栏复制非标准功能，CloudTrail 不记录护栏干预详情\n\n**关键概念：**Bedrock 护栏配置文件实现跨区域护栏推理和自动故障转移，高内容过滤器防范提示注入，CloudWatch Logs 自定义指标记录安全干预审计。","s":"源#200"},{"id":"D3-033","d":3,"t":"single","q":"某金融服务企业上线了一款基于 Bedrock 的智能应用，辅助客服人员为客户提供个性化理财建议。企业须建立全方位治理框架，践行负责任 AI 原则并符合监管标准。方案须识别和遏制建议中的幻觉现象、对客户交互施加安全管控、动态监测模型行为偏移，并留存全部提示与响应对的审计轨迹。须在 60 天内完成部署、对接既有合规看板，且客户响应延迟不超过 200 毫秒。哪项方案运营开销最小？","o":[{"l":"A","t":"配置 Bedrock 护栏应用自定义内容过滤器和毒性检测。用 Bedrock Model Evaluation 检测幻觉。将提示响应对存入 DynamoDB 并设 TTL。将 CloudWatch 自定义指标与现有合规仪表板集成"},{"l":"B","t":"部署 Bedrock 并用 PrivateLink 安全访问。用 Lambda 实施自定义提示验证。将提示响应对存入 S3 并配生命周期策略。创建自定义 CloudWatch 仪表板监控"},{"l":"C","t":"使用 Bedrock Agents 和知识库基于事实生成响应。用护栏强制内容安全。用 OpenSearch Service 存储索引提示响应对。将 OpenSearch 与 QuickSight 集成创建合规报告"},{"l":"D","t":"使用 SageMaker Model Monitor 检测行为漂移。用 WAF 过滤内容。将交互存入加密 RDS。用 API Gateway 创建自定义 HTTP API 与合规仪表板集成"}],"a":["A"],"e":"**正确答案：A。** Guardrails（护栏）+Model Evaluation+DynamoDB+CloudWatch。\n\n**为什么对：**护栏的自定义Content Filter（内容过滤器）和毒性检测提供安全控制。Model Evaluation 检测幻觉确保建议质量。DynamoDB 存储提示响应对并设 TTL 实现审计追踪的自动管理。CloudWatch 自定义指标与现有合规仪表板集成实现实时监控。全部使用 Bedrock 和 AWS 原生服务，60 天内部署可行且运营开销最小。\n\n**其他选项为什么错：**\n- B.PrivateLink+Lambda+S3：自定义 Lambda 验证增加开发量和维护负担，S3 生命周期非为实时审计设计\n- C.Agents+Knowledge Bases（知识库）+OpenSearch+QuickSight：多服务集成增加复杂性和部署时间，QuickSight 为 BI 工具非实时监控\n- D.SageMaker Model Monitor+WAF+RDS：引入 SageMaker 管理和 RDS 运维开销，WAF 非内容安全控制\n\n**关键概念：**Bedrock 护栏提供安全控制和毒性检测，Model Evaluation 检测幻觉，DynamoDB 配 TTL 管理审计追踪，CloudWatch 自定义指标集成合规仪表板实现实时监控。","s":"源#201"},{"id":"D3-034","d":3,"t":"single","q":"某公司使用 Bedrock 开发客户支持 AI 助手，助手须回答客户账户问题且不在响应中暴露个人信息。公司须遵守数据驻留策略确保所有处理在每个客户所在同一 AWS 区域进行。公司希望在上线前评估助手在防止信息暴露方面的有效性。哪项方案可满足需求？","o":[{"l":"A","t":"配置跨区域 Bedrock 护栏应用敏感信息过滤器。开发和测试期间设为检测模式。生产时切换到阻止模式"},{"l":"B","t":"配置 Bedrock 护栏应用敏感信息过滤器。开发和测试期间设为掩码模式。生产时切换到阻止模式。在公司运营的每个区域部署护栏副本"},{"l":"C","t":"配置 Bedrock 护栏应用内容和主题过滤器。开发测试和生产期间设为检测模式。禁用模型调用日志记录"},{"l":"D","t":"配置跨区域 Bedrock 护栏应用内容和词过滤器。开发和测试期间设为检测模式。生产时切换到掩码模式"}],"a":["B"],"e":"**正确答案：B。** 区域Guardrails（护栏）副本+掩码→阻止模式。\n\n**为什么对：**Data Residency（数据驻留）要求处理在同一区域进行，在各运营区域部署护栏副本确保本地评估不跨区域。掩码模式在开发测试期用占位符替换敏感信息，允许观察助手行为同时不暴露真实数据。生产切换阻止模式直接拦截含个人信息的响应。检测模式仅记录不处理，不足以评估防护效果。\n\n**其他选项为什么错：**\n- A.跨区域护栏+检测模式：跨区域将数据路由到其他区域违反驻留策略，检测模式仅记录不阻止\n- C.内容主题过滤器+检测+禁用日志：检测模式不阻止暴露，禁用日志违反审计要求\n- D.跨区域护栏+检测→掩码：跨区域违反驻留，掩码在生产中仍允许部分信息通过\n\n**关键概念：**各区域部署独立护栏副本满足驻留要求，掩码模式用于开发测试评估防护，阻止模式用于生产完全拦截敏感信息。","s":"源#202"},{"id":"D3-035","d":3,"t":"single","q":"某电梯服务公司使用 Bedrock 开发 AI 助手应用，生成电梯维护建议支持技术人员。公司用 Kinesis Data Streams 收集电梯传感器数据。新法规要求人工技术人员须审核所有 AI 生成的建议。公司须建立人工监督工作流审核和批准 AI 建议，并存储所有审核决定供审计。哪项方案可满足需求？","o":[{"l":"A","t":"用 Lambda 和 SQS 队列创建自定义审批工作流。审核决定存入 DynamoDB 供审计"},{"l":"B","t":"创建具有 waitForTaskToken API 暂停执行的人工审批步骤的 Step Functions 工作流。技术人员完成审核后用 Lambda 调用 SendTaskSuccess API 附上审批决定。审核决定存入 DynamoDB"},{"l":"C","t":"创建具有人工审批步骤的 Glue 工作流。审核后用 Lambda 调用 SendTaskSuccess API。审核决定存入 DynamoDB"},{"l":"D","t":"配置自定义事件模式的 EventBridge 规则将 AI 建议路由到技术人员审核。创建 Glue 作业处理审批队列。用 ElastiCache 缓存审核决定"}],"a":["B"],"e":"**正确答案：B。** Step Functions waitForTaskToken+Lambda SendTaskSuccess+DynamoDB。\n\n**为什么对：**Step Functions 的 waitForTaskToken 模式使工作流暂停等待人工审批完成后继续执行，天然适合人工监督场景。技术人员审核后 Lambda 调用 SendTaskSuccess API 携带审批决定恢复工作流。DynamoDB 持久化存储所有审核决定供审计追踪。这套做法提供完整的等待-审批-恢复-记录链路，无需自定义队列管理。\n\n**其他选项为什么错：**\n- A.Lambda+SQS：需自定义审批编排和队列管理，缺乏工作流状态跟踪和暂停恢复机制\n- C.Glue 工作流：Glue 为 ETL 工具非为人工审批编排设计，不支持 waitForTaskToken 模式\n- D.EventBridge+Glue+ElastiCache：ElastiCache 为临时缓存不适合持久审计存储，Glue 非审批编排工具\n\n**关键概念：**Step Functions waitForTaskToken 模式实现工作流暂停等待人工审批后恢复执行，Lambda SendTaskSuccess API 传递审批结果，DynamoDB 持久化审计记录。","s":"源#203"},{"id":"D3-036","d":3,"t":"single","q":"某企业搭建客户沟通平台，由 Bedrock FM 驱动的 AI 助手负责归纳客户消息并起草回复。企业计划借助 Comprehend 构建多层内容过滤机制，须杜绝违规冒犯性信息的传播、保障客户隐私安全，并识别潜在的不良请求倾向（涵盖不道德行为诉求、危险活动邀约或操纵性提议等）。全部预处理过滤步骤须在数据抵达 FM 之前执行完毕，且不显著影响响应延迟。哪项方案可满足需求？","o":[{"l":"A","t":"使用带异步 API 调用的并行处理。对冒犯性内容用毒性检测。对不当建议索取用提示安全分类。用 PII 检测但不编辑"},{"l":"B","t":"用自定义分类构建检测冒犯性内容和不当建议索取的 FM。仅在通过分类器后应用 PII 检测为次要过滤器"},{"l":"C","t":"部署多阶段流程。先用提示安全分类，然后仅对安全提示进行毒性检测，最后以流式模式进行 PII 检测。将标记消息通过 EventBridge 路由到人工审核"},{"l":"D","t":"使用阈值配置为 0.5 的毒性检测覆盖所有类别。对提示安全分类和 PII 检测均使用并行处理并编辑实体。应用 CloudWatch 告警过滤指标"}],"a":["D"],"e":"**正确答案：D。** 毒性检测 0.5 阈值+并行处理+PII 编辑+CloudWatch 告警。\n\n**为什么对：**阈值 0.5 的毒性检测覆盖所有冒犯性内容类别，与提示安全分类和 PII 检测并行执行确保全部预处理在 FM 之前完成。PII 检测配合实体编辑保护客户隐私。并行处理避免多阶段串行Latency（延迟），保持可接受响应时间。CloudWatch 告警监控过滤指标提供运营可见性。\n\n**其他选项为什么错：**\n- A.异步并行+PII 检测不编辑：PII 不编辑违反保护客户隐私要求，异步 API 引入不可控延迟\n- B.自定义 FM 分类器+串行 PII：构建自定义 FM 分类器开发量大，串行处理增加延迟\n- C.多阶段串行+流式 PII：多阶段串行处理延迟高，流式 PII 检测在 FM 处理过程中而非之前\n\n**关键概念：**Comprehend 毒性检测覆盖冒犯性内容，提示安全分类检测不当索取，PII 检测配合实体编辑保护隐私，并行处理确保全部预处理在 FM 之前完成。","s":"源#204"},{"id":"D3-037","d":3,"t":"single","q":"某医疗公司使用 Bedrock 创建生成式 AI 系统，处理来自多个来源的数据，须维护端到端数据血缘。系统还须使用实时 PII 过滤和审计追踪以自动报告合规性。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Glue Data Catalog 注册所有数据源并跟踪血缘。使用 Bedrock 护栏 PII 过滤器。为所有 Bedrock API 调用启用带 S3 集成的 CloudTrail 日志。用 Macie 扫描存储数据中敏感信息并发布到 CloudWatch Logs。创建 CloudWatch 仪表板可视化并生成自动合规报告"},{"l":"B","t":"使用 Config 跟踪数据源配置和更改。用带自定义规则的 WAF 在应用层过滤 PII。配置 EventBridge 捕获审计事件路由到 S3。用 Comprehend Medical 配合 Lambda 定期分析存储的输出检测违规"},{"l":"C","t":"使用 DataSync 复制数据源跟踪血缘。配置 Macie 扫描 Bedrock 输出中敏感信息。用 Systems Manager Session Manager 记录交互。部署 Textract 配合 Step Functions 从报告中识别编辑 PII"},{"l":"D","t":"配置 Athena 查询数据源分析和报告血缘。用 CloudWatch 自定义指标监控 PII 暴露。用 X-Ray 追踪生成审计。用 Rekognition Custom Labels 检测敏感信息"}],"a":["A"],"e":"**正确答案：A。** Glue Data Catalog 血缘+Guardrails（护栏） PII+CloudTrail+Macie+CloudWatch。\n\n**为什么对：**Glue Data Catalog 注册和跟踪数据源血缘提供端到端可追溯性。Bedrock 护栏 PII 过滤器在推理时实时检测编辑敏感信息。CloudTrail 配合 S3 集成记录所有 Bedrock API 调用提供不可变审计日志。Macie 扫描存储数据中的敏感信息发现残留风险。CloudWatch 仪表板可视化发现结果并生成自动合规报告。\n\n**其他选项为什么错：**\n- B.Config+WAF+Comprehend Medical：Config 跟踪配置变更非数据血缘，WAF 非实时 PII 过滤工具\n- C.DataSync+Macie+Textract：DataSync 为数据迁移工具非血缘跟踪，Textract 非实时 PII 过滤\n- D.Athena+X-Ray+Rekognition：Athena 为查询工具非血缘管理，X-Ray 为应用追踪非合规审计\n\n**关键概念：**Glue Data Catalog 提供数据血缘跟踪，Bedrock 护栏实现实时 PII 过滤，CloudTrail 和 Macie 提供审计和敏感数据扫描，CloudWatch 仪表板自动生成合规报告。","s":"源#205"},{"id":"D3-038","d":3,"t":"single","q":"某 GenAI 开发者正在评估 Bedrock 基础模型以增强欧洲公司内部应用。公司在 Control Tower 中有多账户着陆区，SCP 仅允许使用 eu-north-1 和 eu-west-1 区域。所有客户数据须保留在已批准区域的私有网络中。开发者选定的 FM 托管在 eu-central-1 和 eu-west-3。开发者须为公司员工启用 FM 访问，确保请求私有且保持在 FM 同区域内。哪项方案可满足需求？","o":[{"l":"A","t":"部署通过私有 API Gateway REST API 向 eu-north-1 中 VPC 公开的 Lambda 函数。在 eu-central-1 和 eu-west-3 中为 FM 创建 VPC 端点。扩展 SCP 允许使用 FM。将 REST API 与应用集成"},{"l":"B","t":"在 eu-north-1 中的 EC2 实例上部署 FM。在 EC2 前部署私有 API Gateway REST API。配置 Bedrock VPC 端点。将 REST API 与应用集成"},{"l":"C","t":"通过欧洲范围端点配置 FM 使用跨区域推理。配置 Bedrock VPC 端点。扩展 SCP 允许员工通过 FM 可用的欧洲区域中的推理配置文件使用 FM。使用推理配置文件将 Bedrock 与应用集成"},{"l":"D","t":"在 eu-north-1 中的 SageMaker 中部署 FM。配置 SageMaker VPC 端点。扩展 SCP 允许使用 SageMaker 端点。将 SageMaker 中的 FM 与应用集成"}],"a":["C"],"e":"**正确答案：C。** Cross-Region Inference（跨区域推理）+Bedrock VPC 端点+SCP 扩展+推理配置文件。\n\n**为什么对：**跨区域推理通过欧洲范围端点将请求路由到 FM 所在区域（eu-central-1 和 eu-west-3），同时保持请求在私有网络内。Bedrock VPC 端点确保 API 调用不经公网。扩展 SCP 允许通过推理配置文件访问使员工可在已批准区域调用托管在其他欧洲区域的 FM。推理配置文件将跨区域路由抽象为单一端点，应用集成简洁。\n\n**其他选项为什么错：**\n- A.Lambda+多区域 VPC 端点：跨区域 API Gateway 调用复杂，SCP 限制 eu-north-1 但 FM 在其他区域\n- B.EC2 部署 FM：FM 已在 Bedrock 托管无需自行部署，EC2 管理增加运营开销\n- D.SageMaker 部署 FM：FM 已在 Bedrock 可用，SageMaker 增加额外托管和管理\n\n**关键概念：**跨区域推理通过欧洲范围端点将请求路由到 FM 所在区域，VPC 端点保障私有网络，SCP 扩展允许推理配置文件访问使已批准区域员工可用 FM。","s":"源#206"},{"id":"D3-039","d":3,"t":"single","q":"某媒体企业上线了一个内容创作平台，每小时有数以千计的用户上传图片与文字素材。平台借助 Bedrock 对上传素材进行加工并产出创意作品。企业须保障平台既不处理也不输出违规内容、不在作品中泄露 PII，且方案须兼容既有的 S3 存储工作流。哪项方案在基础设施运维成本最低的前提下满足需求？","o":[{"l":"A","t":"启用 Enhanced Monitoring。用 CloudWatch 告警过滤流量。用 Comprehend PII 检测预处理。创建 CloudWatch 告警监控 PII 检测事件。创建含 Rekognition 图像审核步骤的 Step Functions 工作流"},{"l":"B","t":"使用 API Gateway HTTP API 和请求验证模板在存入 S3 前筛选内容。用 SageMaker AI 构建自定义审核模型在发送到 Bedrock 前处理内容"},{"l":"C","t":"创建 Cognito 用户池，用预认证 Lambda 运行内容审核。用 Textract 过滤文本，用 Rekognition 过滤图像后再允许上传"},{"l":"D","t":"创建 Step Functions 工作流使用内置 Bedrock 护栏过滤内容。用 Comprehend PII 检测预处理内容。使用 Rekognition 图像审核功能"}],"a":["D"],"e":"**正确答案：D。** Step Functions+Bedrock Guardrails（护栏）+Comprehend PII+Rekognition 图像审核。\n\n**为什么对：**Step Functions 编排内容审核工作流，Bedrock 护栏原生过滤不当内容无需自定义模型。Comprehend PII 检测预处理文本中的敏感信息。Rekognition 图像审核检测不当图像内容。三者配合覆盖文本和图像两种模态，全部使用托管服务且与 S3 工作流集成，基础设施管理开销最少。\n\n**其他选项为什么错：**\n- A.CloudWatch 告警过滤流量：CloudWatch 告警为监控工具非内容过滤，Rekognition 步骤缺乏文本审核\n- B.API Gateway+SageMaker 自定义模型：构建自定义审核模型开发量大，SageMaker 管理增加运营开销\n- C.Cognito+预认证 Lambda+Textract：Cognito 预认证用于身份验证非内容审核，Textract 为文档提取非内容审核\n\n**关键概念：**Step Functions 编排 Bedrock 护栏（不当内容过滤）、Comprehend（PII 检测）和 Rekognition（图像审核）的多模态内容审核工作流，全部托管服务最少运维。","s":"源#207"},{"id":"D3-040","d":3,"t":"single","q":"某金融服务企业借助 Bedrock 打造客服 AI 助手。助手不得与用户讨论投资理财话题，须拦截有害信息、遮蔽 PII 并留存合规审计轨迹。助手须基于内容敏感程度对输入和输出双向实施差异化过滤。企业须配置策略执行有效且误报率最低的 Bedrock 护栏，为各类敏感信息提供差异化的处理手段。哪项方案可满足需求？","o":[{"l":"A","t":"配置单个护栏将所有类别内容过滤器设为高。设投资建议拒绝主题含示例短语。设敏感信息过滤器对所有 PII 实体应用阻止。将护栏应用于所有推理调用"},{"l":"B","t":"用分层策略配置多个护栏。一个护栏内容过滤器设为高并在公共交互中阻止 PII。第二个护栏内容过滤器设为中并在内部使用中屏蔽 PII。配置多个特定主题护栏阻止投资建议并设上下文基础检查"},{"l":"C","t":"配置一个护栏将有害内容过滤器设为中。设投资建议拒绝主题含清晰定义和示例短语。配置敏感信息过滤器在响应中屏蔽 PII、在输入中阻止财务信息。启用输入和输出评估并使用自定义阻止消息进行审计"},{"l":"D","t":"为每个用例创建单独护栏。一个应用有害内容过滤器。一个应用投资建议主题过滤器。一个应用敏感信息过滤器阻止 PII。用 Step Functions 顺序链接"}],"a":["C"],"e":"**正确答案：C。** 单Guardrails（护栏）中过滤器+Denied Topics（拒绝主题）+差异化 PII+输入输出评估。\n\n**为什么对：**有害Content Filter（内容过滤器）设为中（非高）减少误报同时仍拦截有害内容。拒绝主题含清晰定义和示例短语精确匹配投资建议。Sensitive Information Filter（敏感信息过滤）器对响应中的 PII 使用屏蔽（部分遮盖保留上下文），对输入中的财务信息使用阻止（完全拒绝），实现差异化处理。启用输入输出双向评估配合自定义阻止消息提供审计追踪。\n\n**其他选项为什么错：**\n- A.全高过滤器+阻止所有 PII：全高过滤器增加误报，阻止所有 PII 过于严格\n- B.多护栏分层策略：多护栏配置管理复杂且策略可能冲突\n- D.每用例单独护栏+Step Functions：顺序链接多护栏增加Latency（延迟）和编排复杂性\n\n**关键概念：**单护栏配合中等强度过滤器减少误报，拒绝主题精确匹配投资建议，敏感信息过滤器对输入输出差异化处理，自定义阻止消息支持审计。","s":"源#208"},{"id":"D3-041","d":3,"t":"single","q":"某精品咖啡品牌运营一款移动应用，借助 Bedrock 以三段式提示链路为客户定制咖啡烘焙建议。该链路先将用户输入转化为结构化元数据，继而检索关联的烘焙记录，最终输出个性化的烘焙推荐。跨区域用户反馈同一输入产出的推荐结果不统一、检索环节推理迟缓，且偶现不安全建议（如推荐异常高温冲泡）。公司须将输出一致性提升至 99.5%、推理延迟压降至 1 秒以内，并拦截不安全或凭空生成的推荐。哪项方案可满足需求？","o":[{"l":"A","t":"使用预置吞吐量部署 Bedrock 以稳定推理延迟。应用带语义拒绝规则的护栏阻止不安全输出。使用 Prompt Management 通过审批工作流管理提示"},{"l":"B","t":"使用 Bedrock Agents 管理链式调用。将模型输入输出记录到 CloudWatch Logs。用 CloudWatch 日志对提示版本进行 A/B 测试"},{"l":"C","t":"将提示结果缓存在 ElastiCache 中。用 Lambda 预处理元数据并跟踪端到端延迟。用 X-Ray 识别和修复性能瓶颈"},{"l":"D","t":"使用 Kendra 提高烘焙日志检索准确性。将标准化提示元数据存入 DynamoDB。用 Step Functions 编排多步骤提示"}],"a":["A"],"e":"**正确答案：A。** Provisioned Throughput（预置吞吐量）+Guardrails（护栏）语义拒绝+Prompt Management 审批。\n\n**为什么对：**预置吞吐量提供稳定的推理容量和Latency（延迟），消除按需调用的Cold Start（冷启动）和限流，使相同输入产生一致的推理结果达到 99.5% 一致性。护栏的语义拒绝规则阻止不安全推荐（如过高温度），确保输出安全。Prompt Management 的审批工作流管理提示版本确保提示变更经过审核防止虚构推荐。\n\n**其他选项为什么错：**\n- B.Agents+CloudWatch A/B 测试：Agents 管理链式调用但不解决一致性和延迟问题，CloudWatch 日志非 A/B 测试工具\n- C.ElastiCache 缓存+Lambda+X-Ray：缓存仅对重复输入有效，不解决推理一致性和安全性问题\n- D.Kendra+DynamoDB+Step Functions：Kendra 检索改进不解决推理一致性和延迟，增加多服务管理开销\n\n**关键概念：**预置吞吐量保障推理延迟稳定和输出一致性，护栏语义拒绝规则阻止不安全内容，Prompt Management 审批工作流管控提示变更防止虚构推荐。","s":"源#209"},{"id":"D3-042","d":3,"t":"single","q":"某跨国医疗保健企业在 Bedrock 上运行 GenAI 应用以产出诊疗建议。各国监管要求存在差异：部分国家须将全部模型输入输出留存 2 年，另一些国家则须上报数据供当地审查。医疗从业者要求各地统一使用标准化医学术语，但诊疗建议需结合当地患者人群特征进行适配。方案须对接既有 EHR 系统，日均承载上限 10000 次查询（响应低于 1 秒），支持部署前审核和批准提示词变更，并生成涵盖提示、响应及用户上下文的完整日志。哪项方案可满足需求？","o":[{"l":"A","t":"用 CloudTrail 记录 API 调用。在 Prompt Management 中创建含患者人口统计变量的标准提示。实施 IAM 策略确保仅批准用户可访问提示"},{"l":"B","t":"用 CloudWatch Logs 收集详细模型调用日志并存入 S3。在 Prompt Management 中创建含治疗选项变量的参数化提示。启用提示版本控制并设审批工作流"},{"l":"C","t":"创建 Lambda 动态生成提示强制临床语言要求。用 CloudWatch Logs 跟踪模型调用。用 SQS 队列实现提示审批工作流"},{"l":"D","t":"将提示模板存入 S3。用 S3 Object Lock 实现版本控制。用 EventBridge 跟踪模型调用。用 Config 监控提示模板变更"}],"a":["B"],"e":"**正确答案：B。** CloudWatch Logs+S3+Prompt Management 参数化提示+版本控制+审批。\n\n**为什么对：**CloudWatch Logs 收集详细的模型调用日志（含提示、响应和用户上下文），存入 S3 可设保留策略满足 2 年合规要求。Prompt Management 参数化提示通过变量注入治疗选项和患者人口统计数据，实现术语一致性和本地适配。版本控制和审批工作流确保部署前审查提示变更。日志覆盖全面满足审计和当地审计提交需求。\n\n**其他选项为什么错：**\n- A.CloudTrail+标准提示：CloudTrail 记录 API 调用非模型输入输出内容，标准提示缺乏版本控制审批\n- C.Lambda+SQS 审批：自定义 Lambda 提示生成缺乏版本控制，SQS 非审批工作流工具\n- D.S3 Object Lock+EventBridge：S3 Object Lock 为对象保留非提示版本控制，EventBridge 非模型调用日志工具\n\n**关键概念：**CloudWatch Logs 配合 S3 保留满足合规日志要求，Prompt Management 参数化提示实现术语一致性与本地适配，版本控制和审批工作流确保提示变更审查。","s":"源#210"},{"id":"D3-043","d":3,"t":"single","q":"某企业基于 Lake Formation 构建数据湖，涵盖跨区域的各业务线数据库与数据表。企业计划借助 Bedrock 调用 FM 执行欺诈识别分析。FM 须从数据湖中读取敏感财务数据，其中部分客户信息包含 PII。企业须设计访问管控方案以确保 PII 不进入生产环节，FM 仅能访问已授权的数据子集且 PII 所在列已移除，同时须记录全部数据访问的审计轨迹。哪项方案可满足需求？","o":[{"l":"A","t":"为每个部门和区域组合在单独 S3 存储桶中创建数据集。配置 S3 存储桶策略基于 IAM 角色控制访问。用 S3 访问日志跟踪数据访问"},{"l":"B","t":"配置 FM 使用 IAM 角色和基于 LF-Tag 表达式的 Lake Formation 权限验证。将业务部门和区域定义为分配给数据库和表的 LF-Tag。用 CloudTrail 收集数据访问审计跟踪"},{"l":"C","t":"在 Lake Formation 中使用直接 IAM 主体授权到特定数据库和表。创建自定义应用层记录访问请求并在发送到 FM 前过滤敏感列"},{"l":"D","t":"配置 FM 从 STS 请求临时凭证。通过预签名 S3 URL 访问数据。用 CloudTrail 收集审计跟踪"}],"a":["B"],"e":"**正确答案：B。** IAM 角色+LF-Tag 表达式权限+CloudTrail。\n\n**为什么对：**Lake Formation 的 LF-Tag 表达式权限支持基于标签的细粒度列级访问控制，可精确指定 FM 可访问哪些数据库和表的哪些列（排除 PII 列）。将业务部门和区域定义为 LF-Tag 实现跨区域多部门的权限管理。IAM 角色提供 FM 的身份验证。CloudTrail 捕获所有数据访问活动提供完整审计跟踪。\n\n**其他选项为什么错：**\n- A.多 S3 存储桶+存储桶策略：存储桶策略为对象级非列级控制，无法精确排除 PII 列\n- C.直接 IAM 授权+自定义应用层：需自定义应用层过滤增加开发量和运维风险\n- D.STS 临时凭证+预签名 URL：预签名 URL 为对象级访问非列级控制，无法排除 PII 列\n\n**关键概念：**Lake Formation LF-Tag 表达式权限实现基于标签的列级访问控制，精确排除 PII 列同时授权数据子集访问，CloudTrail 提供完整数据访问审计。","s":"源#211"},{"id":"D3-044","d":3,"t":"single","q":"某企业借助 Bedrock 构建 GenAI 应用以分析企业数据中的模式与关联。应用日均处理数百万条新增数据记录，数据源遍布欧洲、北美及亚洲各 AWS 可用区，结果存入 S3 存储桶。应用须遵循各所在地的数据保护与留存法规，数据驻留与处理过程均须限制在同一大洲范围内。应用还须留存决策流程的审计轨迹并具备数据分类能力。哪项方案可满足需求？","o":[{"l":"A","t":"在每个区域部署应用并配置本地 IAM 策略。用 Bedrock 跨区域推理分布工作负载。用 CloudWatch 记录决策过程。手动跟踪各区域合规认证"},{"l":"B","t":"用 Organizations SCP 管理位置权限。用 CloudTrail 不可变日志审计决策过程。将自定义模型导入 Bedrock 并部署到每个区域"},{"l":"C","t":"使用 S3 Object Lock 和特定区域的 S3 存储桶策略。在将数据点发送到 Bedrock 前根据地理来源在区域内预处理。用 Macie 对数据分类。用 CloudTrail 不可变日志审计决策过程"},{"l":"D","t":"为每个区域创建独立 AWS 账户配置各自合规框架。用 SageMaker AI 和自定义监控。为每个辖区创建手动合规报告"}],"a":["C"],"e":"**正确答案：C。** S3 Object Lock+区域存储桶策略+区域内预处理+Macie+CloudTrail。\n\n**为什么对：**S3 Object Lock 提供数据不可变性满足存储法规，特定区域存储桶策略强制数据保留在所属大洲。区域内预处理确保数据在发送到 Bedrock 前不跨大洲传输，满足驻留要求。Macie 自动分类数据中的敏感信息。CloudTrail 不可变日志审计决策过程提供合规证据。这套做法在数据层实现驻留控制，无需多账户或自定义模型部署。\n\n**其他选项为什么错：**\n- A.多区域部署+Cross-Region Inference（跨区域推理）+手动合规：跨区域推理可能跨大洲违反驻留要求，手动合规跟踪不可靠\n- B.SCP+自定义模型导入：自定义模型导入到每个区域增加管理开销，SCP 管理位置但不处理数据分类\n- D.多账户+SageMaker+手动报告：多账户管理复杂，SageMaker 自定义监控增加运维，手动报告不可靠\n\n**关键概念：**S3 Object Lock 和区域存储桶策略实现数据层驻留控制，区域内预处理确保不跨大洲传输，Macie 提供数据分类，CloudTrail 不可变日志审计决策过程。","s":"源#212"},{"id":"D3-045","d":3,"t":"single","q":"某公司使用 Lambda 函数构建 AI 代理解决方案。GenAI 开发者须设置访问用户信息的 MCP 服务器，配置 AI 代理使用该服务器，并确保仅授权用户可访问 MCP 服务器。哪项方案可满足需求？","o":[{"l":"A","t":"用 Lambda 托管 MCP 服务器。授予 AI 代理 Lambda 调用 MCP 服务器函数的权限。配置 AI 代理 MCP 客户端异步调用 MCP 服务器"},{"l":"B","t":"用 Lambda 托管 MCP 服务器。授予 AI 代理 Lambda 调用权限。配置 AI 代理使用 STDIO 传输与 MCP 服务器通信"},{"l":"C","t":"用 Lambda 托管 MCP 服务器。创建 API Gateway HTTP API 代理请求到 Lambda 函数。配置 AI 代理使用 Streamable HTTP 传输通过 HTTP API 发出请求。用 Cognito 强制执行 OAuth 2.1"},{"l":"D","t":"用 Lambda 层托管 MCP 服务器。将 Lambda 层添加到 AI 代理 Lambda 函数。配置 AI 代理使用 STDIO 传输发送请求。在 MCP 配置中将 Lambda 层 ARN 指定为命令"}],"a":["C"],"e":"**正确答案：C。** Lambda+API Gateway HTTP API+Streamable HTTP+Cognito OAuth 2.1。\n\n**为什么对：**Lambda 托管 MCP 服务器提供无服务器执行环境。API Gateway HTTP API 代理请求到 Lambda 并提供 HTTP 端点，Streamable HTTP 传输是 MCP 协议支持的网络传输方式，适合跨进程通信。Cognito 强制执行 OAuth 2.1 认证确保仅授权用户可访问 MCP 服务器。这套做法将 MCP 服务器暴露为受保护的 HTTP 端点，AI 代理通过标准 HTTP 协议安全调用。\n\n**其他选项为什么错：**\n- A.Lambda+异步调用：异步调用不提供请求响应模式，MCP 需要同步通信\n- B.Lambda+STDIO 传输：STDIO 为本地进程间传输，Lambda 函数间无法通过 STDIO 通信\n- D.Lambda 层+STDIO：Lambda 层为代码依赖非独立服务，STDIO 同样不适用于跨函数通信\n\n**关键概念：**MCP 服务器通过 Lambda 和 API Gateway HTTP API 暴露为受保护端点，Streamable HTTP 传输实现跨进程通信，Cognito OAuth 2.1 确保仅授权用户可访问。","s":"源#213"},{"id":"D3-046","d":3,"t":"single","q":"一家媒体公司正在上线一个内容创作平台，每小时有数千名用户上传图片和文字。平台使用 Amazon Bedrock 处理上传内容并生成创意作品。公司需要确保平台既不处理也不生成不当内容，且作品中不得暴露个人身份信息（PII，Personally Identifiable Information）。该方案还须与公司现有的 Amazon S3 存储工作流集成。哪种方案能以最少的基础设施管理开销满足这些要求？","o":[{"l":"A","t":"启用增强监控工具。使用 Amazon CloudWatch 警报来过滤流向平台的流量。使用 Amazon Comprehend PII 检测来预处理数据。创建 CloudWatch 警报以监控 Amazon Comprehend PII 检测事件。创建包含 Amazon Rekognition 图像审核步骤的 AWS Step Functions 工作流程。"},{"l":"B","t":"在将上传的内容存储在 Amazon S3 中之前，使用带有请求验证模板的 Amazon API Gateway HTTP API 来筛选内容。使用 Amazon SageMaker AI 构建自定义内容审核模型，在将处理后的内容发送到 Amazon Bedrock 之前处理内容。"},{"l":"C","t":"创建一个 Amazon Cognito 用户池，使用预身份验证 AWS Lambda 函数来运行内容审核检查。在允许用户将内容上传到平台之前，使用 Amazon Textract 过滤文本内容并使用 Amazon Rekognition 过滤图像内容。"},{"l":"D","t":"创建使用内置 Amazon Bedrock 护栏来过滤内容的 AWS Step Functions 工作流程。使用 Amazon Comprehend PII 检测来预处理内容。使用 Amazon Rekognition Image 审核。"}],"a":["D"],"e":"**正确答案：D。** 使用 Amazon Bedrock Guardrails（护栏）内置内容过滤 + Amazon Comprehend PII 检测 + Amazon Rekognition 图片审核，通过 AWS Step Functions 编排。\n\n**为什么对：** Amazon Bedrock Guardrails 提供原生、可配置的内容安全控制，可在模型推理前后拦截或编辑不当内容，无需自建审核模型。Amazon Comprehend PII 检测是全托管服务，可在内容进入 Bedrock 前自动检测和编辑文本中的 PII。Amazon Rekognition 图片审核专门用于检测不安全的视觉内容。Step Functions 提供无服务器编排，可将文本和图片审核步骤集成到清晰、可审计的流水线中，与 S3 工作流无缝对接。\n\n**其他选项为什么错：**\n- A. CloudWatch 警报过滤流量：CloudWatch 警报用于监控而非内容安全执行，引入冗余逻辑且不直接拦截不当内容。\n- B. SageMaker AI 自定义审核模型：需要构建和维护自定义模型，显著增加运营复杂度和开发成本，不符合\"最少基础设施管理\"要求。\n- C. Cognito 预认证 + Textract/Rekognition：在身份认证阶段进行审核时机不当；Textract 用于文档文字提取而非内容审核，服务选择错误。\n\n**关键概念：** Amazon Bedrock Guardrails 是对 Bedrock 模型输入/输出实施内容安全策略的首选托管机制；Amazon Comprehend 提供实时 PII 检测与编辑；Step Functions 适合编排多步骤内容审核流水线。","s":"源#214"},{"id":"D3-047","d":3,"t":"single","q":"一位 GenAI 开发人员正在为一家欧洲公司评估 Amazon Bedrock 基础模型（FM，Foundation Model），以增强内部业务应用。公司在 AWS Control Tower 中拥有多账户着陆区（Landing Zone），通过服务控制策略（SCP，Service Control Policy）仅允许使用 eu-north-1 和 eu-west-1 区域。所有客户数据必须留在批准的 AWS 区域内的私有网络中。开发人员经分析测试后选定了 FM，模型部署在 eu-central-1 和 eu-west-3 区域。开发人员须让员工能够访问 FM，同时确保请求走私有路径且在 FM 所在区域内处理。哪种方案可以满足这些要求？","o":[{"l":"A","t":"将私有 Amazon API Gateway REST API 公开的 AWS Lambda 函数部署到 eu-north-1 中的 VPC。在 eu-central-1 和 eu-west-3 中为选定的 FM 创建 VPC 终端节点。扩展现有 SCP 以允许员工使用 FM。将 REST API 与业务应用程序集成。"},{"l":"B","t":"在 eu-north-1 中的 AmazonEC2 实例上部署 FM。在 EC2 实例前面部署私有 Amazon API Gateway REST API。配置 Amazon Bedrock VPC 终端节点。将 REST API 与业务应用程序集成。"},{"l":"C","t":"将 FM 配置为通过欧洲范围的端点使用跨区域推理。配置 Amazon Bedrock VPC 终端节点。扩展现有 SCP，以允许员工在可使用 FM 的欧洲区域通过推理配置文件使用 FM。使用推理配置文件将 Amazon Bedrock 与业务应用程序集成。"},{"l":"D","t":"在 eu-north-1 中的 Amazon SageMaker 中部署 FM。配置 SageMaker VPC 终端节点。扩展现有 SCP 以允许员工使用 SageMaker 端点。将 SageMaker 中的 FM 与业务应用程序集成。"}],"a":["C"],"e":"**正确答案：C。** 使用 Amazon Bedrock 跨区域推理（Cross-Region Inference）的欧洲范围端点 + VPC 端点 + 扩展 SCP 允许推理配置文件。\n\n**为什么对：** Amazon Bedrock 跨区域推理配置文件（Inference Profile）专为区域数据驻留和弹性设计，可将推理请求限定在部署 FM 的欧洲区域（如 eu-central-1、eu-west-3）内路由，满足数据驻留要求。配置 Amazon Bedrock VPC 端点确保流量始终走 AWS 私有网络，不经过公网。通过扩展 SCP 允许推理配置文件的使用，员工只能在批准区域通过推理配置文件访问 FM，维护治理控制。\n\n**其他选项为什么错：**\n- A. Lambda + VPC 端点跨区域调用：在 eu-north-1 部署 Lambda 再跨区域连接 FM，引入不必要的自定义路由层和运维复杂度。\n- B. EC2 部署 FM：在 eu-north-1 的 EC2 上部署 FM 完全脱离 Bedrock 托管服务，增加大量运维负担。\n- D. SageMaker 部署 FM：同样脱离 Bedrock 生态，需自行管理模型托管，增加运营复杂度。\n\n**关键概念：** Amazon Bedrock 跨区域推理配置文件允许在指定地理范围内弹性路由推理请求，同时确保数据驻留合规；VPC 端点保证私有连接。","s":"源#215"},{"id":"D3-048","d":3,"t":"single","q":"一家金融服务公司使用 Amazon Bedrock 开发客服 AI 助手。该助手不得讨论投资建议，须阻止有害内容、屏蔽个人身份信息（PII），并为合规报告维护审计跟踪。助手还须根据内容敏感度对用户输入和模型响应分别应用不同的内容过滤策略。公司需要一套 Amazon Bedrock Guardrails（护栏）配置，既能有效执行策略，又能尽量减少误报。方案须针对多种敏感内容提供差异化处理策略。哪种方案满足这些要求？","o":[{"l":"A","t":"配置单个护栏并将所有类别的内容过滤器设置为高。设置投资建议的拒绝主题，并包含要阻止的示例短语。设置敏感信息过滤器，对所有 PII 实体应用阻止操作。将护栏应用于所有模型推理调用。"},{"l":"B","t":"使用分层策略配置多个护栏。创建一根护栏并将内容过滤器设置为高。配置护栏以阻止 PII 进行公共交互。配置第二个 Guardrail 并将内容过滤器设置为中。配置第二个护栏以屏蔽 PII 以供内部使用。配置多个特定主题的护栏来阻止投资建议并设置上下文接地检查。"},{"l":"C","t":"配置护栏并将内容过滤器设置为中有害内容。设置投资建议的拒绝主题，并包含要阻止的明确定义和示例短语。配置敏感信息过滤器以屏蔽响应中的 PII 并阻止输入中的财务信息。启用使用自定义阻止消息进行审核的输入和输出评估。"},{"l":"D","t":"为每个用例创建单独的护栏。创建一个应用有害内容过滤器的护栏。创建护栏以应用主题过滤器来获取投资建议。创建护栏以应用敏感信息过滤器来阻止 PII。使用 AWS Step Functions 按顺序链接护栏。"}],"a":["C"],"e":"**正确答案：C。** 配置单个护栏：内容过滤器设为\"中\"、设置投资建议拒绝主题（含定义和示例短语）、敏感信息过滤器对响应中 PII 屏蔽并对输入中财务信息阻止、启用带自定义拦截消息的输入/输出评估。\n\n**为什么对：** 将内容过滤器设为\"中\"而非\"高\"，可在防御有害内容的同时减少对正常客户对话的过度拦截，降低误报率。拒绝主题配合明确定义和示例短语可精准阻止投资建议讨论。敏感信息过滤器支持按上下文差异化操作——响应中屏蔽 PII 保留对话实用性，输入中阻止财务信息防止其到达模型。启用输入和输出评估确保护栏在交互每个阶段一致执行，自定义拦截消息和审核日志为监管审计提供合规证据。\n\n**其他选项为什么错：**\n- A. 所有过滤器设为\"高\" + 阻止所有 PII：过滤器全设\"高\"会对良性对话过度阻止、大幅增加误报；对所有 PII 一律阻止会影响正常客服对话的可用性。\n- B. 多个护栏分层策略：Amazon Bedrock 护栏的设计理念是在单个护栏中组合多种策略，多护栏分层并非推荐用法，增加不必要的管理复杂度。\n- D. 为每个用例建单独护栏 + Step Functions 串联：用 Step Functions 串联多个护栏增加编排复杂度，且护栏原生支持在同一配置中处理多种策略类型。","s":"源#216"},{"id":"D3-049","d":3,"t":"single","q":"一家精品咖啡公司的移动应用使用 Amazon Bedrock 和三阶段提示链（Prompt Chain）生成个性化咖啡烘焙方案：先将用户输入转为结构化元数据，再检索烘焙日志，最后为客户生成个性化烘焙建议。多个 AWS 区域的用户反馈相同输入的建议不一致、检索步骤推理缓慢、以及不安全建议（如过高温度冲泡）。公司须将相同输入的输出一致性提升至 99.5%，推理延迟低于 1 秒，并通过经验证的安全控制阻止不安全或幻觉建议。哪种方案满足这些要求？","o":[{"l":"A","t":"使用预配置吞吐量部署 Amazon Bedrock 以稳定推理延迟。应用具有语义拒绝规则的 Amazon Bedrock 护栏来阻止不安全的输出。使用 Amazon Bedrock Prompt Management 通过审批工作流程来管理提示。"},{"l":"B","t":"使用 Amazon Bedrock Agents 管理链接。将模型输入和输出记录到 Amazon CloudWatch Logs。使用 CloudWatch 中的日志对提示版本执行 A/B 测试。"},{"l":"C","t":"在 Amazon ElastiCache 中缓存提示结果。
