使用 AWS Lambda 函数预处理元数据并跟踪端到端延迟。使用 AWS X-Ray 识别并修复性能瓶颈。"},{"l":"D","t":"使用 Amazon Kendra 提高烘焙日志检索准确性。在 Amazon DynamoDB 中存储标准化提示元数据。使用 AWS Step Functions 编排多步骤提示。"}],"a":["A"],"e":"**正确答案：A。** 使用预配置吞吐量（Provisioned Throughput）稳定延迟 + Amazon Bedrock Guardrails 语义拒绝规则阻止不安全输出 + Amazon Bedrock Prompt Management 管理提示版本和审批。\n\n**为什么对：** 预配置吞吐量为模型预留容量，消除高峰期因争用导致的延迟波动，助力实现亚秒级响应。Bedrock Guardrails 的语义拒绝规则可拦截危险冲泡指导（如超高温度），在模型输出层提供统一安全屏障。Prompt Management 支持提示版本控制和审批工作流，通过固定推理参数（如 temperature）标准化提示，减少因提示编辑引起的输出漂移，提升输出一致性。三者结合同时满足性能、安全和稳定性要求。\n\n**其他选项为什么错：**\n- B. Bedrock Agents + CloudWatch A/B 测试：提升可观测性和实验能力，但不提供安全执行或延迟稳定化机制。\n- C. ElastiCache 缓存 + Lambda 预处理 + X-Ray：缓存可加速但无法保证安全控制，也不直接解决跨区域输出一致性问题。\n- D. Kendra 检索 + DynamoDB + Step Functions：可改善检索准确性，但不提供安全控制或可重复输出保证。","s":"源#217"},{"id":"D3-050","d":3,"t":"single","q":"一家公司使用 Amazon Bedrock 构建面向客户的 AI 助手，处理敏感查询。公司须使用深度防御（Defense-in-Depth）安全控制阻止复杂的提示注入（Prompt Injection）攻击，保留所有安全干预的审计日志，且 AI 助手须具备跨区域故障转移能力。哪种方案满足这些要求？","o":[{"l":"A","t":"配置 Amazon Bedrock 护栏，将内容过滤器设置为高，以防止即时注入攻击。使用护栏配置文件实现跨 Region 的护栏推理。将 Amazon CloudWatch Logs 与自定义指标结合使用来捕获详细的护栏干预事件。"},{"l":"B","t":"配置 Amazon Bedrock 护栏，并将内容过滤器设置为高。使用 AWS WAF 阻止可疑输入。使用 AWS CloudTrail 记录 API 调用。"},{"l":"C","t":"部署 Amazon Comprehend 自定义分类器来检测提示注入攻击。使用 Amazon API Gateway 请求验证。使用 CloudWatch Logs 捕获干预事件。"},{"l":"D","t":"配置 Amazon Bedrock 护栏，将自定义内容过滤器和文字过滤器设置为高。配置跨区域 Guardrail 复制以进行故障转移。将日志存储在 AWS CloudTrail 中以进行合规性审核。"}],"a":["A"],"e":"**正确答案：A。** 配置 Amazon Bedrock Guardrails 内容过滤器设为\"高\" + Guardrail 配置文件实现跨区域推理 + CloudWatch Logs 自定义指标捕获护栏干预事件。\n\n**为什么对：** Bedrock Guardrails 专为防御提示注入和越狱攻击设计，内容过滤器设为\"高\"可提高对恶意输入的检测灵敏度。Guardrail 配置文件允许同一护栏配置在多个区域一致应用，实现跨区域推理和故障转移而不产生配置漂移。CloudWatch Logs 捕获详细的护栏干预事件（如内容被阻止/修改/标记的时间），结合自定义指标可实现细粒度审计和告警，比仅依赖 API 级日志提供更详尽的安全干预追踪。\n\n**其他选项为什么错：**\n- B. Guardrails + WAF + CloudTrail：WAF 在网络层过滤，无法识别模型特定的注入模式；CloudTrail 只记录 API 调用级别，缺少详细的护栏干预日志。\n- C. Comprehend 自定义分类器 + API Gateway 验证：引入额外服务和自定义逻辑，增加复杂度，且自定义分类器可能遗漏模型特定的注入模式。\n- D. 跨区域 Guardrail 复制 + 字词过滤器：Bedrock Guardrails 不支持\"跨区域复制\"概念，字词过滤器无法有效对抗复杂的提示注入技术。\n\n**关键概念：** Guardrail 配置文件（Guardrail Profile）支持跨区域一致应用护栏配置；深度防御需要护栏 + 审计 + 区域弹性多层保护。","s":"源#218"},{"id":"D3-051","d":3,"t":"single","q":"一家公司正在 AWS 上构建视频分析平台，使用 Amazon Rekognition 和 Amazon Bedrock 分析大型视频档案。平台须遵守预定义的隐私标准，使用安全的模型 I/O、控制基础模型（FM）访问模式，并提供“谁在何时访问了什么”的审计能力。哪种方案满足这些要求？","o":[{"l":"A","t":"为 Amazon Bedrock 模型 API 调用配置 VPC 终端节点。实施 Amazon Bedrock 护栏 过滤提示和响应中的有害或未经授权的内容。使用 Amazon Bedrock 跟踪事件 跟踪所有代理和模型调用以进行审计。将跟踪导出到 Amazon CloudWatch Logs 作为模型使用情况的审核记录。将所有提示和输出存储在 Amazon S3 中，并使用 AWS KMS 密钥 (SSE-KMS) 进行服务器端加密。"},{"l":"B","t":"通过使用 IAM 和基于属性的访问控制 (ABAC) 来定义访问控制，将部门映射到特定权限。为 Amazon Bedrock 模型 API 调用配置 VPC 终端节点。使用 IAM 条件键强制执行特定的 Guardrail Identifier 和 ModelId 值。配置 AWS CloudTrail 以捕获 S3 对象和 KMS 密钥使用活动的管理和数据事件。启用 S3 服务器访问日志记录以记录与视频档案的详细文件级交互。将所有 CloudTrail 日志发送到 AWS CloudTrail Lake。设置 Amazon CloudWatch 警报以检测来自 Amazon Bedrock、Amazon Rekognition 和 AWS KMS 的意外活动并发出警报。"},{"l":"C","t":"使用 VPC 终端节点策略限制对服务的访问。使用 AWS Config 跟踪资源更改以及安全规则的合规性。使用带有 AWS KMS 密钥的服务器端加密 (SSE-KMS) 对静态数据进行加密。将模型的 I/O 存储在单独的 Amazon S3 存储桶中。启用 S3 服务器访问日志记录以跟踪文件级交互。"},{"l":"D","t":"配置 AWS CloudTrail Insights 以分析跨账户的 API 调用模式并检测 Amazon Bedrock、Amazon Rekognition、Amazon S3 和 AWS KMS 中的异常活动。部署 Amazon Macie 对视频存档进行扫描和分类。使用带有 AWS KMS 密钥 (SSE-KMS) 的服务器端加密来加密所有存储的数据。配置 CloudTrail 以捕获 KMS API 使用事件以用于审计目的。配置 Amazon EventBridge 规则以处理 CloudTrail Insights 异常和 Macie 调查结果。当检测到潜在安全问题时，使用 CloudWatch 警报触发自动通知和安全响应。"}],"a":["B"],"e":"**正确答案：B。** 使用 IAM + ABAC 定义部门级权限 + VPC 端点 + IAM 条件键强制绑定 Guardrail 和 ModelId + CloudTrail 管理/数据事件 + CloudTrail Lake + S3 访问日志 + CloudWatch 告警。\n\n**为什么对：** IAM ABAC（基于属性的访问控制，Attribute-Based Access Control）允许根据部门、角色等属性动态控制 FM 和数据访问，适合大规模 FM 访问治理。IAM 条件键强制每次调用必须指定批准的 ModelId 和 Guardrail Identifier，确保安全模型 I/O。VPC 端点保证所有模型调用走私有网络。CloudTrail 捕获管理和数据事件提供完整审计链，发送至 CloudTrail Lake 实现跨服务集中查询。S3 访问日志提供文件级可见性，CloudWatch 告警近实时检测异常活动。\n\n**其他选项为什么错：**\n- A. 跟踪事件 + 护栏 + KMS 加密：主要关注模型级跟踪，缺少全面的 IAM 治理、S3 访问审计和身份感知的访问控制。\n- C. VPC 端点策略 + Config + KMS 加密：提供部分控制但缺乏身份感知审计和模型治理（无 ABAC 或条件键强制）。\n- D. CloudTrail Insights + Macie + EventBridge：侧重异常检测和数据分类，未明确控制 FM 访问模式和身份级权限。\n\n**关键概念：** IAM 条件键 bedrock:GuardrailIdentifier 和 bedrock:ModelId 可强制每次推理调用绑定指定护栏和模型；ABAC 适合大规模多部门的 FM 访问治理。","s":"源#219"},{"id":"D3-052","d":3,"t":"single","q":"一家公司计划在欧洲和美洲多国运营的五个独立业务部门部署多个 GenAI 应用，每个应用均使用 Amazon Bedrock RAG 模式，并拥有 TB 级非结构化数据的业务部门专用知识库。公司须为所有 GenAI 应用建立架构良好（Well-Architected）的标准化安全控制、可观测性实践和部署模式组件，这些组件须可复用、版本化且一致治理。哪种方案满足这些要求？","o":[{"l":"A","t":"为 GenAI 应用程序配置 Amazon API Gateway REST API 终端节点。基于标准化 AWS CloudFormation 模板中的 AWS 架构完善的生成式 AI 镜头，部署常见的安全性、可观察性和 RAG 模式。部署后使用 CloudFormation Guard 验证每个业务部门的策略合规性。"},{"l":"B","t":"创建标准化的 AWS CloudFormation 模板，以基于 AWS Well-Well-Architected Generative AI Lens 实施安全性、可观察性和 RAG 模式。建立集中存储库以进行版本控制。将 CI/CD 管道与 CloudFormation Guard 集成，以在各个业务部门实施一致且可重复的部署。"},{"l":"C","t":"使用 AWS Service Catalog 为每个业务部门定义标准化产品组合和版本化产品。使用该组合基于 AWSWell-Generative AILens 来实施安全性、可观察性和 RAG 模式。要求业务部门使用 Service Catalog 控制台来部署资源。"},{"l":"D","t":"在共享设计文档中记录基于 AWS Well-Well-Architected Generative AI Lens 的安全控制、可观测性要求和 RAG 模式。使用 Amazon Macie 强制部署。将实施责任委托给各业务部门。"}],"a":["B"],"e":"**正确答案：B。** 创建标准化 CloudFormation 模板（基于 Well-Architected Generative AI Lens）实现安全/可观测/RAG 模式 + 集中代码仓库版本控制 + CI/CD 管道集成 CloudFormation Guard 部署前合规检查。\n\n**为什么对：** 标准化 CloudFormation 模板为安全控制、可观测性和 RAG 部署提供可复用构建块，通过基础设施即代码操作化 Well-Architected 最佳实践。集中仓库支持模板版本控制和变更审查，满足版本化和可复用要求，提供单一事实来源。CI/CD 管道确保部署一致性和自动化，CloudFormation Guard 在部署前作为预防性控制，在不合规变更到达生产环境前将其阻止。\n\n**其他选项为什么错：**\n- A. CloudFormation 模板 + 部署后 Guard 验证：部署后才做合规检查意味着违规配置已进入生产环境，需事后修复。\n- C. Service Catalog 产品组合 + 控制台部署：Service Catalog 提供受管配置但要求控制台部署，降低自动化程度，妨碍标准化 CI/CD 采用。\n- D. 共享设计文档 + Macie 强制 + 委托各部门实施：文档不可强制执行，Macie 用于敏感数据发现而非部署合规；委托实施导致不一致。","s":"源#220"},{"id":"D3-053","d":3,"t":"single","q":"一家公司使用 AWS Lambda 构建 AI Agent（代理）方案。GenAI 开发人员须搭建一个访问用户信息的 MCP（Model Context Protocol，模型上下文协议）服务器，并配置 AI Agent 使用该 MCP 服务器，同时确保仅授权用户可以访问。哪种方案满足这些要求？","o":[{"l":"A","t":"使用 Lambda 函数托管 MCP 服务器。授予 AI 代理 Lambda 函数调用托管 MCP 服务器的 Lambda 函数的权限。配置 AI 代理的 MCP 客户端以异步调用 MCP 服务器。"},{"l":"B","t":"使用 Lambda 函数托管 MCP 服务器。授予 AI 代理 Lambda 函数调用托管 MCP 服务器的 Lambda 函数的权限。配置 AI 代理以将 STDIO 传输与 MCP 服务器结合使用。"},{"l":"C","t":"使用 Lambda 函数托管 MCP 服务器。创建一个 Amazon API Gateway HTTP API，用于代理对 Lambda 函数的请求。配置 AI 代理解决方案以使用可流式 HTTP 传输通过 HTTP API 发出请求。使用 Amazon Cognito 强制执行 OAuth2.1。"},{"l":"D","t":"使用 Lambda 层托管 MCP 服务器。将 Lambda 层添加到 AI 代理 LambdaFunctions。配置代理 AI 解决方案以使用 STDIO 传输将请求发送到 MCP 服务器。在 AI 代理的 MCP 配置中，指定 Lambda 层 ARN 作为命令。将用户凭据指定为环境变量。"}],"a":["C"],"e":"**正确答案：C。** Lambda 托管 MCP 服务器 + Amazon API Gateway HTTP API 代理请求 + 可流式 HTTP 传输 + Amazon Cognito 强制 OAuth 2.1 认证。\n\n**为什么对：** MCP 协议支持远程服务器的 HTTP 传输方式，当 MCP 服务器作为托管服务（而非本地进程）运行时，可流式 HTTP（Streamable HTTP）是合适的传输选择。Lambda 托管 MCP 服务器实现自动扩展和按用量计费。API Gateway 作为托管 HTTP 端点提供安全入口，与 Amazon Cognito 原生集成实现 OAuth 2.1 认证授权，无需自定义认证逻辑。这种架构清晰分离了传输层、认证层和业务逻辑，符合 AWS 无服务器最佳实践。\n\n**其他选项为什么错：**\n- A. Lambda 直接调用 + 异步模式：缺少用户级授权控制，无法确保仅授权用户访问。\n- B. Lambda 直接调用 + STDIO 传输：STDIO 传输适用于本地或紧耦合进程，不适合分布式无服务器架构。\n- D. Lambda Layer 托管 + STDIO + 环境变量存凭据：STDIO 不适合远程调用；通过环境变量处理凭据引入安全风险。\n\n**关键概念：** MCP 远程服务器应使用 HTTP 传输（而非 STDIO）；OAuth 2.1 是 MCP 远程服务器授权的推荐方式。","s":"源#221"},{"id":"D3-054","d":3,"t":"single","q":"一家金融服务公司部署 GenAI 应用，使用 Amazon Bedrock 协助客服代表向客户提供个性化投资建议。公司须实施全面治理：检测和防止建议中的幻觉（Hallucination）、对客户交互实施安全控制、实时监控模型行为漂移，并维护所有提示-响应对的审计跟踪以供监管审查。方案须在 60 天内部署完成，与现有合规仪表板集成，且响应时间在 200 毫秒以内。哪种方案以最少运营开销满足这些要求？","o":[{"l":"A","t":"配置 Amazon Bedrock 护栏以应用自定义内容过滤器和毒性检测。使用 Amazon Bedrock 模型评估来检测幻觉。在 Amazon DynamoDB 中存储提示-响应对以捕获审核跟踪并设置 TTL。将 Amazon CloudWatch 自定义指标与现有合规性仪表板集成。"},{"l":"B","t":"部署 Amazon Bedrock 并使用 AWS PrivateLink 安全地访问应用程序。使用 AWS Lambda 函数实施自定义提示验证。将提示-响应对存储在 Amazon S3 存储桶中并配置 S3 生命周期策略。创建自定义 Amazon CloudWatch 控制面板来监控模型性能指标。"},{"l":"C","t":"使用 Amazon Bedrock Agents 和 Amazon Bedrock 知识库来进行响应。使用 Amazon Bedrock Guardrails 加强内容安全。使用 Amazon OpenSearch Service 存储提示响应对并为其编制索引。将 OpenSearch Service 与 Amazon QuickSight 集成以创建合规性报告并检测模型行为偏差。"},{"l":"D","t":"使用 Amazon SageMaker Model Monitor 检测模型行为漂移。使用 AWSWAF 过滤内容。将客户交互存储在加密的 Amazon RDS 数据库中。使用 Amazon API Gateway 创建自定义 HTTP API 以与合规性仪表板集成。"}],"a":["A"],"e":"**正确答案：A。** Bedrock Guardrails 自定义内容过滤器和毒性检测 + Bedrock 模型评估检测幻觉 + DynamoDB 存储提示-响应对（设 TTL）+ CloudWatch 自定义指标对接合规仪表板。\n\n**为什么对：** Bedrock Guardrails 内联运行、低延迟执行内容安全策略，助力满足 200 毫秒响应要求。Bedrock 模型评估支持 LLM-as-a-Judge 技术大规模自动检测幻觉，无需自建评估管道。DynamoDB 提供低延迟、高可扩展的审计存储，TTL 自动管理数据保留。CloudWatch 自定义指标无缝对接现有合规仪表板，支持近实时监控安全干预率、幻觉率和漂移指标。全部采用托管服务，可在 60 天内完成部署。\n\n**其他选项为什么错：**\n- B. PrivateLink + Lambda 自定义验证 + S3 审计：自定义 Lambda 验证逻辑增加延迟和运维复杂度。\n- C. Bedrock Agents/知识库 + OpenSearch + QuickSight：引入多个额外服务，设置时间可能超过 60 天。\n- D. SageMaker Model Monitor + WAF + RDS + API Gateway：WAF 和 SageMaker Model Monitor 均非 Bedrock 原生工具，增加不必要的基础设施层。","s":"源#222"},{"id":"D3-055","d":3,"t":"single","q":"一家银行开发 GenAI 驱动的 AI 助手，使用 Amazon Bedrock 协助网站用户进行账户查询和财务指导。银行须确保：AI 助手不得在交互中泄露 PII（个人身份信息，Personally Identifiable Information），不得在提示中向模型发送 PII，不得回应投资建议请求。银行还须收集所有客户交互（包括图片和文档）的审计日志。哪种方案以最少运营工作满足这些要求？","o":[{"l":"A","t":"使用 Amazon Macie 检测和编辑用户输入和模型响应中的 PII。应用即时工程技术强制模型避免投资建议主题。使用 AWS CloudTrail 捕获对话日志。"},{"l":"B","t":"使用 AWS Lambda 函数和 Amazon Comprehend 检测和编辑 PII。使用 Amazon Comprehend 主题建模来防止 AI 助手讨论投资建议主题。在 Amazon CloudWatch 中设置自定义指标以捕获客户对话。"},{"l":"C","t":"配置 Amazon Bedrock 护栏以应用敏感信息策略来检测和过滤 PII。设置话题策略，确保 AI 助手避开投资建议话题。使用 Converse API 记录模型调用。启用到 Amazon S3 的传输和图像记录。"},{"l":"D","t":"使用正则表达式控件来匹配 PII 的模式。应用及时的工程技术以避免向客户返回 PII 或投资建议主题。启用模型调用日志记录、传输日志记录和图像日志记录到 Amazon S3。"}],"a":["C"],"e":"**正确答案：C。** 配置 Bedrock Guardrails 敏感信息策略检测和过滤 PII + 话题策略阻止投资建议 + Converse API 记录模型调用 + 启用到 S3 的传输日志和图片日志。\n\n**为什么对：** Bedrock Guardrails 敏感信息策略在提示发送到模型前和响应生成后都运行，可自动检测和编辑输入/输出中的 PII。话题策略明确阻止投资建议主题，比提示工程更可靠、更可审计。Converse API 提供标准化模型交互和一致日志记录。启用 S3 传输日志和图片日志确保所有交互（含图片和文档）持久化存储，支持合规审计。\n\n**其他选项为什么错：**\n- A. Macie 检测 PII + 提示工程：Macie 用于静态数据发现而非实时会话过滤；提示工程无法可靠阻止投资建议。\n- B. Lambda + Comprehend PII 编辑 + 主题建模：需自建 Lambda 管道增加运维复杂度；主题建模不等于话题阻止。\n- D. 正则匹配 PII + 提示工程：正则和提示工程均不够可靠，不满足金融级合规标准。","s":"源#223"},{"id":"D3-056","d":3,"t":"single","q":"一家医疗公司使用 Amazon Bedrock 创建 GenAI 系统，处理来自多种来源的数据。系统须维护端到端数据血缘（Data Lineage），使用实时 PII 过滤和审计跟踪来自动生成合规报告。哪种方案满足这些要求？","o":[{"l":"A","t":"使用 AWS Glue 数据目录注册所有数据源并跟踪沿袭。使用 Amazon Bedrock Guardrails PII 过滤器。通过 Amazon S3 集成为所有 Amazon Bedrock API 调用启用 AWSCloudTrail 日志记录。使用 Amazon Macie 扫描存储的数据中的敏感信息并将结果发布到 Amazon CloudWatch Logs。创建 CloudWatch 仪表板以可视化结果并生成自动合规性报告。"},{"l":"B","t":"使用 AWS Config 跟踪数据源配置和更改。将 AWSWAF 与自定义规则结合使用 在 Amazon Bedrock 处理数据之前在应用程序层过滤 PII。配置 Amazon EventBridge 以捕获审核事件并将其路由到 Amazon S3。将 Amazon Comprehend Medical 与计划的 AWS Lambda 函数结合使用来分析存储的输出是否存在合规性违规行为。"},{"l":"C","t":"使用 AWS DataSync 复制数据源以跟踪沿袭。配置 Amazon Macie 以扫描 Amazon Bedrock 输出以获取敏感信息。使用 AWS Systems Manager 会话管理器记录用户交互。使用 AWS Step Functions 工作流程部署 Amazon Textract，以从生成的报告中识别和编辑 PII。"},{"l":"D","t":"配置 Amazon Athena 以查询数据源以分析和报告数据沿袭。使用 Amazon CloudWatch 自定义指标监控 Amazon Bedrock 响应中的 PII 暴露情况并建立 AWS X-Ray 跟踪以生成审核跟踪。使用 Amazon Rekognition 自定义标签模型检测 Amazon Bedrock 处理的数据中的敏感信息。"}],"a":["A"],"e":"**正确答案：A。** AWS Glue Data Catalog 注册数据源并跟踪血缘 + Bedrock Guardrails PII 过滤器 + CloudTrail 日志存 S3 + Amazon Macie 扫描存储数据 + CloudWatch 仪表板可视化合规报告。\n\n**为什么对：** Glue Data Catalog 跨多源集中注册数据集和管理元数据，支持血缘跟踪，这对医疗环境的监管审计至关重要。Bedrock Guardrails PII 过滤器在推理时内联运行，实现实时 PII 检测和过滤。CloudTrail 提供所有 Bedrock API 调用的完整审计跟踪。Macie 持续扫描存储数据中的敏感信息。Macie 结果发布到 CloudWatch Logs 并通过仪表板可视化，支持近实时合规状态感知和自动化报告。\n\n**其他选项为什么错：**\n- B. Config + WAF PII 过滤 + EventBridge + Comprehend Medical：WAF 在应用层过滤而非推理时执行；依赖定时分析而非实时执行。\n- C. DataSync + Macie + Session Manager + Textract：DataSync 用于数据复制而非血缘跟踪；Textract 用于文档提取而非实时 PII 过滤。\n- D. Athena + CloudWatch 自定义指标 + X-Ray + Rekognition：Athena 不提供原生血缘管理；Rekognition 用于图像分析而非文本 PII 检测。","s":"源#224"},{"id":"D3-057","d":3,"t":"single","q":"一家金融服务公司开发客服 AI 助手应用，使用 Amazon Bedrock 基础模型（FM）。应用须通过记录推理过程和引用 RAG 来源提供透明响应，捕获所有用户响应的全面审计跟踪，支持最多 10,000 并发用户，且每次查询须在 2 秒内响应。哪种方案以最少运营开销满足这些要求？","o":[{"l":"A","t":"启用 Amazon Bedrock 代理的跟踪。配置结构化提示，指导 FM 提供证据演示。将 Amazon Bedrock 知识库与数据源集成以启用 RAG。配置应用程序以引用和引用权威内容。在多可用区架构中部署应用程序。使用 Amazon API Gateway 和 AWS Lambda 函数来扩展应用程序。使用 Amazon CloudFront 提供低延迟交付。"},{"l":"B","t":"启用 Amazon Bedrock 代理的跟踪。将自定义 RAG 管道与 Amazon OpenSearch Service 集成以检索和引用源。配置结构化提示以呈现检索到的证据。在 Amazon API Gateway REST API 后面部署应用程序。使用 AWS Lambda 函数和 Amazon CloudFront 来扩展应用程序并提供低延迟。将日志存储在 Amazon S3 中并使用 AWSCloudTrail 捕获审计跟踪。"},{"l":"C","t":"使用 Amazon CloudWatch 监控延迟和错误率。直接在应用程序后端嵌入模型提示以引用来源。在 Amazon RDS for Audits 中存储应用程序与用户的交互。"},{"l":"D","t":"将生成的响应和支持证据存储在 Amazon S3 存储桶中。在存储桶上启用版本控制以进行审核。使用 AWS Glue 对检索到的文档进行编目。在 Amazon Athena 中处理检索到的文档以生成定期合规性报告。"}],"a":["A"],"e":"**正确答案：A。** 启用 Bedrock Agents 跟踪 + 结构化提示引导 FM 展示证据 + Bedrock 知识库启用 RAG + 多 AZ 架构 + API Gateway + Lambda 扩展 + CloudFront 低延迟交付。\n\n**为什么对：** Bedrock 知识库提供全托管 RAG 实现，自动处理文档摄取、嵌入、检索和来源归属，无需自建管道。Bedrock Agents 跟踪提供代理推理步骤、工具使用和模型交互的端到端可见性，满足审计跟踪要求。API Gateway + Lambda 自动扩展支持万级并发用户，CloudFront 缓存和加速交付助力满足 2 秒响应要求。\n\n**其他选项为什么错：**\n- B. 自定义 RAG 管道 + OpenSearch：引入自建 RAG 管道，增加运维复杂度和维护工作量。\n- C. CloudWatch 监控 + 后端直接嵌入提示 + RDS 存审计：缺乏原生 RAG 集成，不提供透明推理或引文管理。\n- D. S3 存储响应 + Glue 编目 + Athena 报告：侧重离线合规报告，不满足实时透明度和低延迟响应要求。","s":"源#225"},{"id":"D3-058","d":3,"t":"single","q":"一家公司构建 GenAI 应用，根据多种内部和外部数据源生成内容。公司须确保生成的输出完全可追溯。应用须支持数据源注册并启用元数据标记，将内容归因到其原始来源，并维护整个管道中数据访问和使用的审计日志。哪种方案满足这些要求？","o":[{"l":"A","t":"使用 AWS Lake Formation 对数据源进行编目并控制访问。直接在 Amazon S3 中应用元数据标签。使用 AWS CloudTrail 监控 API 活动。"},{"l":"B","t":"使用 AWS Glue 数据目录注册和标记数据源。使用 Amazon CloudWatch Logs 监控访问模式和应用程序行为。"},{"l":"C","t":"将数据存储在 Amazon S3 中并使用对象标记进行归因。使用 AWS Glue 数据目录来管理架构信息。使用 AWS CloudTrail 记录对 S3 存储桶的访问。"},{"l":"D","t":"使用 AWS Glue 数据目录注册所有数据源。将元数据标签应用于属性数据源。使用 AWSCloudTrail 记录跨服务的访问和活动。"}],"a":["D"],"e":"**正确答案：D。** 使用 AWS Glue Data Catalog 注册所有数据源 + 应用元数据标签归因数据来源 + AWS CloudTrail 记录跨服务的访问和活动。\n\n**为什么对：** Glue Data Catalog 是集中注册数据集和管理元数据的 AWS 原生服务，支持不同数据源的结构化注册和一致标记，可将生成内容归因到原始来源。元数据标签确保一致的归因框架，下游系统（如 RAG 管道）可引用而无需在应用代码中嵌入归因逻辑。CloudTrail 提供跨 AWS 服务的 API 活动不可变审计日志，满足整个管道的审计要求。\n\n**其他选项为什么错：**\n- A. Lake Formation 编目 + S3 元数据 + CloudTrail：Lake Formation 主要用于细粒度数据湖权限而非可追溯性；S3 元数据仅限于存储层。\n- B. Glue Data Catalog + CloudWatch Logs：CloudWatch Logs 不提供跨服务的权威审计日志记录。\n- C. S3 对象标记 + Glue Data Catalog + CloudTrail 仅记录 S3：审计范围限于 S3 访问，未全面覆盖所有数据源。","s":"源#226"},{"id":"D3-059","d":3,"t":"single","q":"一家媒体公司须为 AI 生成的内容实施健全的治理流程，使用 Amazon Bedrock。公司需管理数百个提示模板，多个团队跨多个 AWS 区域使用这些模板。方案须提供包含审批工作流（含待审核通知）的版本控制、记录提示活动的详细审计跟踪，以及一致的提示参数化以执行质量标准。哪种方案满足这些要求？","o":[{"l":"A","t":"配置 Amazon Bedrock Studio 提示模板。使用 Amazon CloudWatch 控制面板显示提示使用情况指标。将审批状态存储在 Amazon DynamoDB 中。使用 AWS Lambda 函数强制执行批准。"},{"l":"B","t":"使用 Amazon Bedrock Prompt Management 实施版本控制。配置 AWSCloudTrail 以进行审核日志记录。使用 AWS Identity and Access Management 策略来控制审批权限。通过指定变量创建参数化提示模板。"},{"l":"C","t":"使用 AWS Step Functions 创建审批工作流程。将提示存储在 Amazon S3 中。使用标签来实现版本控制。使用 Amazon EventBridge 发送通知。"},{"l":"D","t":"使用 Amazon S3 中存储的提示模板部署 Amazon SageMaker Canvas。使用 AWS CloudFormation 进行版本控制。使用 AWS Config 强制执行审批策略。"}],"a":["B"],"e":"**正确答案：B。** 使用 Amazon Bedrock Prompt Management 实现版本控制 + CloudTrail 审计日志 + IAM 策略控制审批权限 + 通过变量创建参数化提示模板。\n\n**为什么对：** Bedrock Prompt Management 专为跨团队和区域大规模管理提示而设计，提供原生版本控制和审批工作流。通过 IAM 策略强制审批权限，仅授权审阅者可批准或发布提示版本，无需自建工作流引擎。参数化提示模板通过定义变量实现一致的提示结构，同时允许受控变化，减少提示漂移。CloudTrail 与 Bedrock 原生集成，提供提示创建、更新、审批和使用的不可变审计日志。\n\n**其他选项为什么错：**\n- A. Bedrock Studio + CloudWatch + DynamoDB 存审批状态：需大量定制开发来编排审批和维护状态。\n- C. Step Functions 审批 + S3 存提示 + 标签版本控制：依赖通用工作流服务和手动版本控制，容易出错且难以扩展。\n- D. SageMaker Canvas + CloudFormation 版本控制 + Config 审批：服务选择不当，非为 GenAI 提示治理设计。","s":"源#227"},{"id":"D3-060","d":3,"t":"single","q":"一家零售公司的 GenAI 产品推荐应用使用 Amazon Bedrock，根据浏览历史和人口统计数据推荐产品。公司须对多个人口群体实施公平性评估，检测两种提示方法之间的推荐偏差。方案须实时收集和监控公平性指标，当群体间差异超过 15% 时发出告警，并提供每周报告比较两种提示方法的表现。哪种方案以最少定制开发满足这些要求？","o":[{"l":"A","t":"配置 Amazon CloudWatch 控制面板以显示来自 Amazon Bedrock API 调用的默认指标。根据模型输出创建自定义指标。设置 Amazon EventBridge 规则以调用 AWS Lambda 函数，这些函数对模型响应执行后处理分析并发布自定义公平性指标。"},{"l":"B","t":"在 Amazon Bedrock Prompt Management 中创建两个提示变体。使用 Amazon Bedrock Flows 部署具有定义的流量分配的提示变体。配置 Amazon Bedrock 护栏以监控人口统计公平性。通过使用 InvocationsIntervened 指标在 Guardrail Content Source 维度上设置 Amazon CloudWatch 警报来检测推荐差异阈值违规。"},{"l":"C","t":"设置 Amazon SageMaker Clarify 来分析模型输出。将公平指标发布到 Amazon CloudWatch。创建将 SageMaker Clarify 偏差指标与 Amazon Bedrock 延迟指标相结合的 CloudWatch 复合警报。"},{"l":"D","t":"创建 Amazon Bedrock 模型评估作业以比较两个提示变体之间的公平性。在 Amazon CloudWatch 中启用模型调用日志记录。使用每个人口统计组的维度，为 InvocationsIntervened 指标设置 CloudWatch 警报。"}],"a":["B"],"e":"**正确答案：B。** Bedrock Prompt Management 创建两个提示变体 + Bedrock Flows 部署流量分配 + Bedrock Guardrails 监控人口统计公平性 + CloudWatch 告警（InvocationsIntervened 指标按 Content Source 维度）。\n\n**为什么对：** Bedrock Prompt Management 无需改代码即可定义和管理提示变体，适合比较推荐策略。Bedrock Flows 支持提示变体间受控流量分配，实现生产环境下实时 A/B 测试，无需自建实验框架。Bedrock Guardrails 提供内置监控和干预机制，InvocationsIntervened 指标直接与 CloudWatch 集成，支持实时仪表板和阈值告警。可从 CloudWatch 指标生成每周报告，无需自建分析管道。\n\n**其他选项为什么错：**\n- A. CloudWatch 默认指标 + EventBridge + Lambda 后处理：需要大量自定义后处理逻辑进行公平性分析。\n- C. SageMaker Clarify + CloudWatch 复合告警：引入额外服务增加运维开销，且未针对实时监控优化。\n- D. Bedrock 模型评估作业比较公平性：侧重离线评估，不提供持续的实时公平性监控。","s":"源#228"},{"id":"D3-061","d":3,"t":"single","q":"一家公司在应用账户中运行基于 Amazon Bedrock 的 GenAI 摘要应用。架构包括 API Gateway REST API 将请求转发到私有 VPC 子网中的 Lambda 函数。应用汇总的是集中数据存储账户中 AWS Lake Formation 托管数据湖里的敏感客户记录。数据存储账户已启用 Amazon S3、Amazon Athena 和 AWS Glue。公司须确保应用对 Bedrock 的调用仅使用应用 VPC 与 Bedrock 之间的私有连接，且数据湖须跨账户提供细粒度的列级访问控制。哪种方案满足这些要求？","o":[{"l":"A","t":"在应用程序账户中，为 Amazon Bedrock 运行时创建接口 VPC 终端节点。在私有子网中运行 Lambda 函数。在推理和数据平面策略上使用 IAM 条件以仅允许调用经批准的终端节点和角色。在数据存储账户中，使用基于 AWS Lake Formation 标签的访问控制来创建表级和列级跨账户授权。"},{"l":"B","t":"在私有子网中运行 Lambda 函数。配置 NAT 网关以提供对 Amazon Bedrock 和数据湖的访问。使用 S3 存储桶策略和 ACL 来管理权限。将 AWS CloudTrail 日志导出到 Amazon S3 以执行每周审核。"},{"l":"C","t":"在应用程序账户中仅为 Amazon S3 创建网关终端节点。通过公共终端节点调用 Amazon Bedrock。使用 AWS Lake Formation 中的数据库级授权来管理数据访问。将 AWS CloudTrail 日志流式传输到 Amazon CloudWatch Logs。不要设置指标过滤器或警报。"},{"l":"D","t":"使用 VPC 终端节点提供对应用程序账户中的 Amazon Bedrock 和 Amazon S3 的访问。仅使用 IAM 基于路径的策略来管理数据湖访问。将 AWS CloudTrail 日志发送到 Amazon CloudWatch Logs。定期创建仪表板并允许跨区域读取的公共回退以减少设置时间。"}],"a":["A"],"e":"**正确答案：A。** 在应用账户为 Bedrock 运行时创建接口 VPC 端点 + 私有子网运行 Lambda + IAM 条件限制端点和角色 + 数据存储账户使用 Lake Formation LF-Tag 跨账户列级授权。\n\n**为什么对：** 接口 VPC 端点（AWS PrivateLink）确保 Lambda 通过私有网络调用 Bedrock，不经公网。IAM 条件约束仅允许通过授权端点和角色调用。Lake Formation 的 LF-Tag 访问控制（Tag-Based Access Control）支持跨账户表级和列级授权，是 AWS 推荐的细粒度数据湖权限方案。\n\n**其他选项为什么错：**\n- B. NAT 网关 + S3 桶策略/ACL：NAT 网关出口到公网，违反私有连接要求；S3 桶策略/ACL 无法实现列级访问控制。\n- C. 仅 S3 网关端点 + 公共 Bedrock 端点 + 数据库级授权：公共端点违反私有连接要求；数据库级授权粒度不够。\n- D. VPC 端点 + IAM 路径策略 + 公共回退：路径策略无法实现列级控制；公共回退违反私有连接要求。","s":"源#229"},{"id":"D3-062","d":3,"t":"single","q":"一家公司使用 Amazon Bedrock 开发 GenAI 应用，分析数据中的模式和关系。应用每天在欧洲、北美和亚洲的 AWS 区域处理数百万个数据点，存储在 Amazon S3 中。应用须遵守当地数据保护和存储法规：数据驻留和处理必须在同一大陆内完成。应用还须维护决策过程的审计跟踪并提供数据分类功能。哪种方案满足这些要求？","o":[{"l":"A","t":"使用本地 IAM 策略在每个区域部署应用程序。使用 Amazon Bedrock 跨区域推理来分配工作负载。使用 Amazon CloudWatch 记录 AI 决策过程。手动跟踪跨区域的合规认证。"},{"l":"B","t":"将 SCP 与 AWS Organizations 结合使用来管理特定于位置的权限。使用 AWS CloudTrail 日志来审核决策流程。将自定义模型导入 Amazon Bedrock 并将模型部署到每个区域。"},{"l":"C","t":"将 Amazon S3 对象锁定与区域特定的 S3 存储桶策略结合使用。在将数据点发送到 Amazon Bedrock 之前，根据地理来源预处理区域内的数据点。使用 Amazon Macie 对数据进行分类。使用 AWS CloudTrail 不可变日志来审核决策流程。"},{"l":"D","t":"使用单独的合规性框架为每个区域创建单独的 AWS 账户。使用 Amazon SageMaker AI 进行自定义监控。为每个监管管辖区创建手动合规报告。"}],"a":["C"],"e":"**正确答案：C。** 区域特定 S3 桶 + S3 对象锁定 + 同区域内预处理数据后再发送到 Bedrock + Amazon Macie 数据分类 + CloudTrail 不可变日志审计。\n\n**为什么对：** 区域特定 S3 桶强制实施地理数据边界。S3 对象锁定确保存储数据和日志的不可变性，满足监管保留要求。在同区域内预处理数据后再调用 Bedrock 确保推理和处理不跨越大陆边界。Amazon Macie 提供托管、自动化的敏感数据分类（如 PII、财务记录）。CloudTrail 不可变日志提供所有 API 和模型调用的全面审计跟踪。\n\n**其他选项为什么错：**\n- A. 本地 IAM 策略 + 跨区域推理：跨区域推理（Cross-Region Inference）可能将数据路由到其他大陆，违反数据驻留规则。\n- B. SCP + CloudTrail + 自定义模型导入各区域：不提供数据分类功能，且自定义模型导入增加运维复杂度。\n- D. 每区域单独账户 + SageMaker 监控 + 手动合规报告：运营开销高，手动合规报告不可扩展。","s":"源#230"},{"id":"D3-063","d":3,"t":"single","q":"一家公司开发客户沟通平台，使用 Amazon Bedrock FM 驱动的 AI 助手汇总客户消息并生成回复草稿。公司希望用 Amazon Comprehend 实施分层内容过滤：防止共享攻击性内容、保护客户隐私、检测不当建议征求（如要求不道德做法、有害活动或操纵行为）。所有预处理过滤器须在内容到达 FM 之前完成，以保持可接受的响应时间。哪种方案满足这些要求？","o":[{"l":"A","t":"使用异步 API 调用的并行处理。对令人反感的内容使用毒性检测。使用及时的安全分类来征求不适当的建议。使用个人身份信息 (PII) 检测而不进行编辑。"},{"l":"B","t":"使用自定义分类构建可检测攻击性内容和不当建议征求的 FM。仅当邮件通过自定义分类器时，才将个人身份信息 (PII) 检测应用为辅助筛选器。"},{"l":"C","t":"部署多阶段流程。将流程配置为首先使用提示安全分类，然后仅在安全提示上进行毒性检测，最后以流模式进行个人身份信息 (PII) 检测。通过 Amazon EventBridge 路由标记的消息以供人工审核。"},{"l":"D","t":"使用毒性检测，所有类别的阈值配置为 0.5。使用并行处理进行即时安全分类和个人身份信息 (PII) 检测以及实体编辑。应用 Amazon CloudWatch 警报来筛选指标。"}],"a":["D"],"e":"**正确答案：D。** 毒性检测（所有类别阈值 0.5）+ 并行处理提示安全分类和 PII 检测（含实体编辑）+ CloudWatch 告警监控过滤指标。\n\n**为什么对：** Amazon Comprehend 支持毒性检测、提示安全分类和 PII 检测/编辑等托管功能。并行运行这些过滤器可确保低端到端延迟，避免顺序管道的累积延迟。毒性检测识别攻击性内容。提示安全分类检测不道德、有害或操纵性建议请求。PII 检测含实体编辑在发送 FM 前保护隐私。阈值配置提供灵敏度的细粒度控制。CloudWatch 告警持续监控过滤行为，无需自定义路由或人工审核管道。\n\n**其他选项为什么错：**\n- A. 异步 API + 毒性检测 + PII 检测不编辑：异步处理可能延迟执行；不编辑 PII 无法保护隐私。\n- B. 自定义分类 FM + 延迟 PII 检测：引入不必要的模型构建复杂度；PII 检测延后增加风险。\n- C. 多阶段顺序处理 + EventBridge 人工审核：顺序处理增加累积延迟；人工审核路由违反响应时间要求。","s":"源#231"},{"id":"D3-064","d":3,"t":"single","q":"一家软件公司使用 Amazon Q Business 构建 AI 助手，让员工通过自然语言访问公司和个人信息。信息存储在 Amazon S3 桶中，每个部门在桶内有专用前缀，对象名含部门前缀。每个部门在 IAM Identity Center 中对应一个组，每位员工属于一个部门。Amazon Q Business 已配置 S3 桶为数据源。公司须确保 AI 助手根据用户的 IAM Identity Center 组成员身份实施访问控制。哪种方案以最少运营开销满足这一要求？","o":[{"l":"A","t":"在每个部门文件夹中创建一个名为 acl.json 的 JSON 文件。在每个文件中，创建访问控制条目，指定应有权访问该部门数据的 IAM 身份中心组。在数据源设置的访问控制部分中指示 JSON 文件的位置。"},{"l":"B","t":"在 S3 存储桶的顶层创建一个名为 acl.json 的 JSON 文件。添加访问控制条目，将每个部门的 S3 前缀映射到其相应的 IAM 身份中心组。在数据源设置的访问控制部分中指示 JSON 文件的位置。"},{"l":"C","t":"对于每个 IAMIdentity Center 组，创建一个单独的权限集，拒绝访问 S3 存储桶中的所有前缀。将 StringNotEquals 条件键添加到每个组的权限集，指定每个组关联的部门。将权限集附加到 Identity Center 组。"},{"l":"D","t":"在 S3 存储桶的顶层创建一个名为 metadata.json 的元数据文件。将 Access Control List 对象添加到指定每个部门前缀的 S3 路径的文件中。指定应有权访问每个部门的前缀的 IAM 身份中心组。引用数据源元数据设置中的文件位置。"}],"a":["B"],"e":"**正确答案：B。** 在 S3 桶顶层创建 acl.json 文件，添加访问控制条目将各部门 S3 前缀映射到对应 IAM Identity Center 组，在数据源的访问控制设置中指定该文件位置。\n\n**为什么对：** Amazon Q Business 原生支持 S3 数据源的访问控制列表（ACL），使用单个集中 JSON 文件将 S3 前缀映射到 Identity Center 组。桶根一个 acl.json 文件集中管理访问控制逻辑，管理员更新部门映射无需修改各文件夹或 IAM 权限，简化治理并降低配置漂移风险。查询时 Amazon Q Business 自动评估用户的 Identity Center 组成员身份并过滤可访问文档。\n\n**其他选项为什么错：**\n- A. 每个部门文件夹放单独 acl.json：分散管理增加运营复杂度，部门或前缀变更时维护困难。\n- C. IAM Identity Center 权限集 + 条件键：Amazon Q Business 的 S3 数据源访问控制并非通过 IAM 条件逻辑管理，显著增加复杂度。\n- D. metadata.json 元数据文件：自定义元数据结构不是 Amazon Q Business 访问控制支持的机制。","s":"源#232"},{"id":"D3-065","d":3,"t":"single","q":"一家公司使用 AWS Lake Formation 搭建数据湖，包含跨多个 AWS 区域和业务部门的数据库与表。公司希望通过 Amazon Bedrock FM 执行欺诈检测，FM 须从数据湖获取包含客户 PII 的敏感财务数据。公司须设计访问控制方案，防止 PII 出现在生产环境——FM 仅能访问已从特定列编辑 PII 的授权数据子集。公司还须捕获所有数据访问的审计跟踪。哪种方案满足这些要求？","o":[{"l":"A","t":"在单独的 Amazon S3 存储桶中为每个业务部门和区域组合创建单独的数据集。配置 S3 存储桶策略以根据分配给 FM 训练实例的 IAM 角色控制访问。使用 S3 访问日志来跟踪数据访问。"},{"l":"B","t":"配置 FM 以使用 AWS Identity and Access Management 角色和基于 LF-Tag 表达式的 Lake Formation 权限进行身份验证。将业务单位和区域定义为分配给数据库和表的 LF 标签。使用 AWS CloudTrail 收集数据访问的全面审计跟踪。"},{"l":"C","t":"对 Lake Formation 中的特定数据库和表使用直接 IAM 主体授权。创建一个自定义应用程序层，用于记录访问请求并在将数据发送到 FM 之前进一步过滤敏感列。"},{"l":"D","t":"配置 FM 以从 AWS Security Token Service 请求临时凭证。使用由应用业务部门和区域过滤器的 API 生成的预签名 S3URL 访问数据。使用 AWS CloudTrail 收集数据访问的全面审计跟踪。"}],"a":["B"],"e":"**正确答案：B。** FM 使用 IAM 角色 + Lake Formation 基于 LF-Tag 表达式的权限认证 + 将业务部门和区域定义为 LF 标签 + CloudTrail 审计跟踪。\n\n**为什么对：** Lake Formation 专为数据湖细粒度权限设计，支持列级访问控制。LF-Tag 实现可扩展的基于属性的访问控制策略——通过标记数据库、表和列的业务部门和区域元数据，确保 FM 仅访问 PII 已编辑列的批准数据集，消除敏感数据泄漏到生产推理工作流的风险。IAM 角色确保最低权限凭证，与 Bedrock 无缝集成。CloudTrail 为所有访问尝试提供不可变审计日志。\n\n**其他选项为什么错：**\n- A. 每部门/区域单独 S3 桶 + IAM 角色 + S3 访问日志：引入不必要的数据重复，S3 桶策略无法实现列级控制。\n- C. 直接 IAM 主体授权 + 自定义应用层过滤：依赖自定义逻辑增加操作风险和复杂度，缺乏原生列级权限。\n- D. STS 临时凭证 + 预签名 URL：绕过 Lake Formation 细粒度控制，降低治理可见性。\n\n**关键概念：** Lake Formation LF-Tag 支持跨账户、跨区域的可扩展列级访问控制；结合 IAM 角色实现 FM 的最低权限数据访问。","s":"源#233"},{"id":"D3-066","d":3,"t":"single","q":"一家医疗设备公司希望将使用其设备的医疗程序报告输入 AI 助手。为保护患者隐私，AI 助手仅向外科医生展示患者 PII，而须为工程师编辑 PII。AI 助手只能引用 3 年内的医疗报告。每份报告发布后存储在 Amazon S3 桶中。公司已建立 Amazon Bedrock 知识库，AI 助手通过 Amazon Cognito 认证用户。哪种方案满足这些要求？","o":[{"l":"A","t":"在 S3 存储桶上启用 Amazon Macie PII 检测。使用 S3 触发器调用 AWS Lambda 函数，该函数从报告中编辑 PII。配置 Lambda 函数以删除过时的文档并调用知识库同步。"},{"l":"B","t":"上传新报告时调用 AWS Lambda 函数以同步 S3 存储桶和知识库。使用第二个 Lambda 函数与 Amazon Comprehend 为工程师编辑 PII。使用 S3 生命周期规则删除超过 3 年的报告。"},{"l":"C","t":"设置 S3 生命周期配置以删除超过 3 年的报告。安排 AWS Lambda 函数在存储桶和知识库之间运行每日同步。当用户与 AI 助手交互时，应用根据用户的 Cognito 用户组选择的护栏配置，以便在需要时从响应中编辑 PII。"},{"l":"D","t":"创建第二个知识库。在同步到第二个知识库之前，使用 Lambda 和 Amazon Comprehend 编辑 PII。根据 Cognito 组成员资格将用户路由到适当的知识库。"}],"a":["C"],"e":"**正确答案：C。** S3 生命周期配置删除超 3 年报告 + Lambda 每日同步桶与知识库 + 推理时根据 Cognito 用户组选择不同 Guardrail 配置（外科医生不编辑/工程师编辑 PII）。\n\n**为什么对：** S3 生命周期配置自动删除过期文档，确保知识库仅引用合规的最新报告。Lambda 定时同步保持知识库与桶内容一致。最关键的是基于角色的 PII 暴露：Bedrock Guardrails 支持推理时动态应用，系统根据 Cognito 用户组选择护栏配置——外科医生收到完整回复，工程师收到 PII 被屏蔽的回复。这保留了医疗报告的单一数据源，通过响应级控制强制隐私保护。\n\n**其他选项为什么错：**\n- A. Macie PII 检测 + Lambda 编辑 + 删除过时文档：永久删除 PII 使外科医生也无法查看，违反要求。\n- B. Lambda 上传同步 + Comprehend 为工程师编辑 + S3 生命周期：在摄取时编辑 PII 不够灵活，无法按角色差异化。\n- D. 第二个知识库（编辑版）+ 按 Cognito 组路由：双倍存储增加成本，引入数据漂移风险。","s":"源#234"},{"id":"D3-067","d":3,"t":"single","q":"一家电梯服务公司使用 Amazon Bedrock 开发 AI 助手，为电梯技术人员生成维护建议。公司通过 Amazon Kinesis Data Streams 收集电梯传感器数据。新监管规则要求技术人员必须审核所有 AI 生成的建议。公司须建立人工监督工作流来审核和批准 AI 建议，并存储所有审核决定以供审计。哪种方案满足这些要求？","o":[{"l":"A","t":"使用 AWS Lambda 函数和 Amazon SQS 队列创建自定义审批工作流程，以对 AI 建议进行人工审核。将所有审核决策存储在 Amazon DynamoDB 中以供审计之用。"},{"l":"B","t":"创建一个 AWS Step Functions 工作流程，其中包含人工批准步骤，该步骤使用 WaitForTaskToken API 来暂停执行。技术人员完成审核后，使用 AWS Lambda 函数调用 SendTaskSuccess API 并做出批准决定。将所有审核决策存储在 Amazon DynamoDB 中。"},{"l":"C","t":"创建具有人工批准步骤的 AWS Glue 工作流程。技术人员审核后，将应用程序与调用 SendTaskSuccess API 的 AWS Lambda 函数集成。将所有技术人员审核决策存储在 Amazon DynamoDB 中。"},{"l":"D","t":"使用自定义事件模式配置 Amazon EventBridge 规则，将 AI 建议发送给技术人员进行审核。创建 AWS Glue 作业来处理技术人员审批队列。使用 Amazon ElastiCache 缓存所有技术人员审核决策。"}],"a":["B"],"e":"**正确答案：B。** AWS Step Functions 工作流含人工批准步骤，使用 WaitForTaskToken API 暂停执行；技术人员完成审核后，Lambda 调用 SendTaskSuccess API 携带审批决定；审核决定存入 DynamoDB。\n\n**为什么对：** Step Functions 的 WaitForTaskToken 集成模式专为人机交互工作流设计，可暂停工作流直到外部参与者完成任务。AI 建议发送给技术人员后，工作流以任务令牌暂停。技术人员批准或拒绝后，Lambda 调用 SendTaskSuccess/SendTaskFailure，工作流确定性继续。Step Functions 记录每个状态转换和时间戳，确保完全可审计。DynamoDB 存储审核结果提供持久、可查询的审计记录。\n\n**其他选项为什么错：**\n- A. Lambda + SQS 自定义审批工作流：需自建编排逻辑，缺乏原生工作流状态管理和审计能力。\n- C. Glue 工作流人工审批：AWS Glue 为 ETL 服务，非为审批工作流设计。\n- D. EventBridge + Glue 作业 + ElastiCache 缓存决定：ElastiCache 为缓存而非持久审计存储；Glue 不适合处理审批队列。\n\n**关键概念：** Step Functions WaitForTaskToken 是 AWS 推荐的人工审批等待模式；DynamoDB 适合存储需快速查询的审计记录。","s":"源#235"},{"id":"D3-068","d":3,"t":"single","q":"一家公司使用 Amazon Bedrock 开发客户支持 AI 助手，回答客户账户相关问题。AI 助手不得在回复中暴露个人信息。公司须遵守数据驻留策略，确保所有处理在客户所在的同一 AWS 区域内进行。公司希望在正式上线前评估 AI 助手防止个人信息泄露的有效性。哪种方案满足这些要求？","o":[{"l":"A","t":"配置跨区域 Amazon Bedrock 护栏以应用敏感信息过滤器。在开发和测试期间将护栏设置为检测模式。切换到块模式进行生产部署。"},{"l":"B","t":"配置 Amazon Bedrock 护栏以应用敏感信息过滤器。在开发和测试期间将护栏设置为屏蔽模式。切换到块模式进行生产部署。将护栏副本部署到公司运营的每个区域。"},{"l":"C","t":"配置 Amazon Bedrock 护栏以应用内容和主题过滤器。在开发、测试和生产过程中将护栏设置为检测模式。禁用 Amazon Bedrock 模型的调用日志记录。"},{"l":"D","t":"配置跨区域 Amazon Bedrock 护栏以应用一组内容和文字过滤器。在开发和测试过程中将护栏设置为检测模式。切换到掩码模式进行生产部署。"}],"a":["B"],"e":"**正确答案：B。** 配置 Bedrock Guardrails 敏感信息过滤器；开发测试期间设为屏蔽模式（Mask Mode），生产环境切换为阻止模式（Block Mode）；将护栏副本部署到公司运营的每个区域。\n\n**为什么对：** 屏蔽模式在开发/测试阶段自动编辑检测到的个人信息但仍生成响应，让开发人员清楚看到 PII 出现的位置和方式，便于验证护栏配置是否正确——这是发布前评估的理想方式。生产环境切换到阻止模式完全阻止含个人信息的响应返回用户，提供最强保护。在每个运营区域部署护栏副本确保推理、过滤和执行都在客户数据同一区域内完成，满足数据驻留要求。\n\n**其他选项为什么错：**\n- A. 跨区域护栏 + 检测模式转阻止模式：跨区域护栏可能违反数据驻留约束；检测模式仅标记而不编辑，无法有效评估防护效果。\n- C. 内容/话题过滤器 + 生产检测模式 + 禁用日志：使用内容和话题过滤器而非敏感信息过滤器，类型不对；生产环境仅检测模式不会主动阻止 PII 暴露。\n- D. 跨区域护栏 + 内容/字词过滤器 + 检测转屏蔽：跨区域护栏违反数据驻留；生产环境用屏蔽模式（编辑但仍返回）保护力度不如阻止模式。","s":"源#236"},{"id":"D3-069","d":3,"t":"single","q":"一家野生动物保护机构在全球运营动物园，使用传感器、追踪器和视听记录器监测动物行为。机构希望推出 GenAI 助手，摄取多模态数据研究动物行为。助手须支持自然语言查询、避免推测性行为解读，并维护用于伦理研究审计的审计日志。哪种方案满足这些要求？","o":[{"l":"A","t":"将原始视频提取到 Amazon Rekognition 中以检测动物姿势和表情。使用 Amazon Data Firehose 将传感器和 GPS 数据流式传输到 Amazon S3。使用 AWS Systems Manager Parameter Store 中存储的基本模板提示 Amazon Bedrock FM。使用 IAM 进行访问控制。使用 AWS CloudTrail 进行审核日志记录。"},{"l":"B","t":"使用 Amazon SageMaker Processing 和 Amazon Transcribe 预处理多模式数据。将精选摘要纳入 Amazon Bedrock 知识库。应用 Amazon Bedrock 护栏来限制投机产出。使用 AWS AppConfig 管理提示模板。使用 AWS CloudTrail 记录研究活动以进行审核。"},{"l":"C","t":"使用 Amazon OpenSearch Serverless 为行为日志和遥测建立索引。使用 Amazon Comprehend 提取实体。使用 Amazon Bedrock 回答有关索引数据的问题。使用 IAM 进行访问控制，使用 CloudTrail 进行审核日志记录。"},{"l":"D","t":"配置 Amazon Q Business 以跨 Amazon S3、Amazon Kinesis 和 Amazon SageMaker Feature Store 联合数据。使用 EventBridge 进行摄取编排。使用自定义 AWS Lambda 函数来过滤 LLM 输出以确保道德合规性。"}],"a":["B"],"e":"**正确答案：B。** SageMaker Processing + Amazon Transcribe 预处理多模态数据 + 将精选摘要纳入 Bedrock 知识库 + Bedrock Guardrails 限制推测输出 + AWS AppConfig 管理提示模板 + CloudTrail 审计日志。\n\n**为什么对：** 音视频、传感器等多模态数据须先整理和汇总才能被 FM 使用。SageMaker Processing 和 Transcribe 提供可扩展的托管预处理。将经验证的汇总观察结果存入 Bedrock 知识库，GenAI 助手可基于有依据、循证的上下文回答查询，显著降低推测或拟人化解读风险。Bedrock Guardrails 在推理时执行科学和伦理约束，防止推测性行为主张。AppConfig 支持受控提示管理。CloudTrail 记录所有访问和查询，支持伦理审计。\n\n**其他选项为什么错：**\n- A. Rekognition + Firehose + Parameter Store 提示 + CloudTrail：缺乏知识库基础和推测性内容保障措施。\n- C. OpenSearch Serverless 索引 + Comprehend 实体提取 + Bedrock：侧重文本分析，无法正确处理多模态推理或安全执行。\n- D. Amazon Q Business 联合数据 + EventBridge + Lambda 自定义过滤：严重依赖自定义逻辑，引入不必要的操作风险。","s":"源#237"},{"id":"D3-070","d":3,"t":"single","q":"一家公司创建基于 Amazon Bedrock FM 的 GenAI 应用。应用须使用 Microsoft Entra ID 进行身份认证，所有 FM API 调用须走私有网络路径，各部门须将访问限制到特定模型系列，公司还需完整的模型交互审计跟踪。哪种方案满足这些要求？","o":[{"l":"A","t":"配置 Microsoft Entra ID 与 AWS Identity and Access Management 之间的 SAML 联合。创建仅允许所需 ModelId 值的部门特定 IAM 角色。为 Amazon Bedrock 运行时服务创建 AWS PrivateLink 接口 VPC 终端节点。启用 AWS CloudTrail 以捕获 Amazon Bedrock API 调用。配置 Amazon Bedrock 模型调用日志记录以记录详细的模型交互。"},{"l":"B","t":"在 IAM 中创建身份提供商 (IdP) 连接以使用 Microsoft Entra ID 进行身份验证。分配部门权限集以控制对特定模型系列的访问。在私有子网中部署 AWS Lambda 函数，并使用 NAT 网关出口到 Amazon Bedrock 公共终端节点。启用 CloudWatch Logs 来捕获模型交互以进行审计。"},{"l":"C","t":"在 IAM 中创建 SAML 身份提供商 (IdP)，以使用 Microsoft Entra ID 进行身份验证。使用 IAM 权限边界来限制部门角色对特定模型系列的访问。使用 VPC 路由配置公共 Amazon Bedrock API 终端节点以维护专用网络连接。使用 Amazon S3 生命周期规则设置 CloudTrail 以管理模型交互的审核日志。"},{"l":"D","t":"配置 Microsoft Entra ID 和 IAM 之间的 OpenID Connect(OIDC) 联合。使用基于属性的访问控制将部门属性映射到特定模型访问权限。应用 SCP 策略以根据部门限制对 Amazon Bedrock FM 系列的访问。使用 Microsoft Entra ID 的内置日志记录功能来维护模型交互的审核跟踪。"}],"a":["A"],"e":"**正确答案：A。** 配置 Microsoft Entra ID 与 IAM 之间的 SAML 联邦 + 部门特定 IAM 角色仅允许指定 ModelId + 为 Bedrock 运行时创建 PrivateLink 接口 VPC 端点 + CloudTrail 捕获 API 调用 + Bedrock 模型调用日志记录详细交互。\n\n**为什么对：** SAML 联邦是 Entra ID 与 AWS 集成的成熟方案。部门特定 IAM 角色精确控制可调用的 Bedrock ModelId，实现模型系列级访问限制。PrivateLink 接口 VPC 端点确保所有推理流量走私有 AWS 网络路径。CloudTrail 提供所有 Bedrock API 调用的权威审计日志，Bedrock 模型调用日志补充记录详细的提示和响应元数据。\n\n**其他选项为什么错：**\n- B. IdP 连接 + NAT 网关出公网：NAT 网关走公网违反私有路径要求；CloudWatch Logs 不提供全面 API 审计。\n- C. SAML IdP + 权限边界 + 公共端点 VPC 路由：公共端点无法确保私有连接，即使配置 VPC 路由也不符合要求。\n- D. OIDC 联邦 + ABAC + SCP + Entra ID 日志：Entra ID 原生通过 SAML 认证 AWS；Entra ID 日志无法捕获 Bedrock API 活动。","s":"源#238"},{"id":"D3-071","d":3,"t":"multiple","q":"一家公司使用 AWS Organizations（启用所有功能）管理多个 AWS 账户，员工在多账户中使用 Amazon Bedrock。公司须防止特定主题和专有信息出现在 Bedrock 模型提示中，并确保员工只能使用经批准的 Bedrock 模型。公司希望集中管理这些控制。哪种方案组合满足这些要求？（选两项。）","o":[{"l":"A","t":"为每个员工的 IAM 角色创建 IAM 权限边界。配置权限边界以需要经过批准的 Amazon Bedrock 护栏标识符才能调用 Amazon Bedrock 模型。创建一个 SCP，允许员工仅使用经批准的模型。"},{"l":"B","t":"创建一个 SCP，允许员工仅使用经批准的模型。配置 SCP 以要求员工在调用中指定护栏标识符以调用批准的模型。"},{"l":"C","t":"创建一个 SCP，如果在模型调用中未指定集中部署的护栏标识符，该 SCP 会阻止员工调用模型。在每个员工的 IAM 角色上创建权限边界，允许每个员工仅调用批准的模型。"},{"l":"D","t":"使用 AWS CloudFormation 创建具有块过滤策略的自定义 Amazon Bedrock 护栏。使用堆栈集将防护栏部署到组织中的每个帐户。"},{"l":"E","t":"使用 AWS CloudFormation 创建具有掩码过滤策略的自定义 Amazon Bedrock 护栏。使用堆栈集将防护栏部署到组织中的每个帐户。"}],"a":["C","D"],"e":"**正确答案：C、D。** C: 创建 SCP，未指定集中部署护栏标识符时阻止模型调用 + IAM 权限边界限制员工仅调用批准模型；D: 用 CloudFormation StackSets 向所有账户部署含阻止（Block）过滤策略的自定义 Bedrock Guardrails。\n\n**为什么对：** SCP 是 Organizations 中最强的控制机制，可强制每次 Bedrock 调用必须指定集中批准的护栏标识符（Guardrail Identifier）。IAM 权限边界进一步确保员工仅能调用明确批准的 FM。Bedrock Guardrails 在模型调用时内联运行，阻止过滤策略可在提示到达模型前完全拦截禁止内容。CloudFormation StackSets 集中管理和一致部署相同护栏配置到所有账户。两者结合实现模型访问 + 提示内容的集中治理。\n\n**其他选项为什么错：**\n- A. IAM 权限边界要求护栏标识符 + SCP 限制模型：权限边界不是验证请求参数（如护栏标识符）的设计用途。\n- B. SCP 允许批准模型 + SCP 要求护栏标识符：仅靠 SCP 不能强制护栏的实际部署和内容过滤。\n- E. StackSets 部署屏蔽（Mask）策略护栏：屏蔽策略仅编辑内容而非完全阻止，不适用于必须阻止禁止主题出现在提示中的场景。","s":"源#239"},{"id":"D3-072","d":3,"t":"multiple","q":"一家银行构建 GenAI 应用，使用 Amazon Bedrock 通过扫描的财务文档评估贷款申请。应用须：从文档提取结构化数据、推理前编辑 PII、使用 FM 生成审批、将低置信度提取结果发送给与申请人同区域的人工审核员。公司须满足严格的区域数据驻留和可审计要求，应用须扩展到每天处理 25,000 份申请并提供 99.9% 可用性。哪种方案组合满足这些要求？（选三项。）","o":[{"l":"A","t":"在同一区域内部署 Amazon Textract 和 Amazon Augmented AI，以从扫描的文档中提取相关数据。将低置信度页面发送给人工审阅者。"},{"l":"B","t":"在推理之前，使用 AWS Lambda 函数从提交的文档中检测并编辑 PII。应用 Amazon Bedrock 护栏以防止模型输出中出现不当或未经授权的内容。配置区域特定的 IAM 角色以强制执行数据驻留要求并控制对提取的数据的访问。"},{"l":"C","t":"使用 Amazon Kendra 和 Amazon OpenSearch Service 在推理之前从上传的文档中按语义提取字段级值。"},{"l":"D","t":"将上传的文档存储在 Amazon S3 中并应用对象元数据。配置 IAM 策略以将原始文档存储在与每个申请人相同的区域中。为将来的审核启用对象标记。"},{"l":"E","t":"使用 AWSGlue 数据质量来验证结构化文档数据。使用 AWS Step Functions 协调审核工作流程，其中包括提示工程步骤，该步骤在调用 Amazon Bedrock 评估贷款申请之前将经过验证的数据转换为优化的提示。"},{"l":"F","t":"使用 Amazon SageMaker Clarify 根据 Amazon Bedrock 做出的模型评分决策生成公平性和偏见报告。"}],"a":["A","B","D"],"e":"**正确答案：A、B、D。** A: 同区域部署 Textract + A2I 提取数据并将低置信度页面发给人工审核；B: Lambda 推理前检测/编辑 PII + Bedrock Guardrails 防不当输出 + 区域特定 IAM 角色；D: 文档存入同区域 S3 + 对象元数据和标记支持审计。\n\n**为什么对：** Textract 从扫描文档提取结构化数据并提供置信度分数，A2I 将低置信度结果路由给人工审核——同区域部署满足数据驻留。Lambda 预处理编辑 PII，Bedrock Guardrails 对模型输出实施安全控制。区域特定 IAM 角色强制驻留执行和可审计性。S3 提供持久存储和高可用性，对象元数据和标记支持合规追溯。三者共同满足提取、PII 编辑、人工审核、驻留和审计要求。\n\n**其他选项为什么错：**\n- C. Kendra + OpenSearch 语义提取：不是从扫描文档进行结构化提取的正确方法。\n- E. Glue 数据质量 + Step Functions 编排：有用但非核心必需，与 ABD 相比不严格满足规定要求。\n- F. SageMaker Clarify 公平性/偏见报告：与提取/编辑/驻留工作流要求无关。","s":"源#240"},{"id":"D3-073","d":3,"t":"multiple","q":"公司在 AWS Control Tower 中配置着陆区，处理须留在欧盟的敏感数据，仅使用 eu-central-1 区域，通过 SCP 执行数据驻留策略。GenAI 开发人员拥有 Bedrock 完全权限的 IAM 角色。公司须确保开发人员仅通过跨区域推理（CRI，Cross-Region Inference）在 eu-central-1 中使用 Amazon Nova Pro 模型。开发人员通过 Bedrock 聊天/文本游乐场调用模型时收到错误：SCP 明确拒绝了对 eu-west-3 的 InvokeModelWithResponseStream 操作。公司须解决该错误，同时保留现有治理控制和数据驻留策略。哪种方案组合满足这些要求？（选两项。）","o":[{"l":"A","t":"将 AdministratorAccess 策略添加到 GenAI 开发人员 IAM 角色"},{"l":"B","t":"扩展现有 SCP 以启用 eu.amazon.nova-pro-v1:0 推理配置文件的 CRI"},{"l":"C","t":"在 eu-west-3 区域中启用 Amazon Nova Pro 的 Amazon Bedrock 模型访问"},{"l":"D","t":"验证 GenAI 开发人员 IAM 角色是否有权通过可以为模型提供服务的所有欧盟 AWS 区域上的 eu.amazon.nova-pro-v1:0 推理配置文件调用 Amazon Nova Pro"},{"l":"E","t":"扩展现有 SCP 以启用 eu-∗ 推理配置文件的 CRI"}],"a":["B","E"],"e":"**正确答案：B、E。** B: 扩展 SCP 以启用 eu.amazon.nova-pro-v1:0 推理配置文件的 CRI；E: 扩展 SCP 以启用 eu-* 推理配置文件的 CRI。\n\n**为什么对：** 错误原因是 Amazon Nova Pro 未托管在 eu-central-1，Bedrock 通过 CRI 推理配置文件将请求透明路由到支持区域（如 eu-west-3），但 SCP 阻止了该路由。选项 B 在 SCP 中明确允许 eu.amazon.nova-pro-v1:0 推理配置文件，这是保留数据驻留保证的同时启用 CRI 的 Bedrock 抽象层。选项 E 允许欧盟范围内的推理配置文件（eu-*），保留精确治理的同时允许 Bedrock 在欧盟边界内路由，确保数据不离开欧洲。\n\n**其他选项为什么错：**\n- A. 添加 AdministratorAccess 策略：违反最小权限原则，且 SCP 覆盖 IAM 权限，添加管理员策略不会绕过 SCP 拒绝。\n- C. 在 eu-west-3 启用 Nova Pro 模型访问：启用直接 eu-west-3 访问破坏仅使用 eu-central-1 的数据驻留策略。\n- D. 验证 IAM 角色跨欧盟区域推理权限：不能解决 SCP 拒绝问题，问题根源在 SCP 而非 IAM 权限。","s":"源#241"},{"id":"D3-074","d":3,"t":"multiple","q":"一家金融公司开发 AI 助手帮助客户规划投资和管理投资组合。公司识别了几种高风险对话模式（如请求特定股票推荐或保证回报），可能导致违规。公司须确保 AI 助手不提供不当财务建议、不生成竞争对手相关内容、不做出与公司批准的财务指导无事实依据的声明。公司希望用 Amazon Bedrock Guardrails 实施方案。哪些步骤组合满足这些要求？（选三项。）","o":[{"l":"A","t":"将高风险对话模式添加到拒绝的主题护栏中。"},{"l":"B","t":"配置内容过滤器防护栏以过滤包含高风险对话模式的提示。"},{"l":"C","t":"配置内容过滤器护栏以过滤包含竞争对手名称的提示。"},{"l":"D","t":"添加竞争对手的姓名作为自定义单词过滤器。将输入和输出操作设置为阻止。"},{"l":"E","t":"设置较低的接地分数阈值。"},{"l":"F","t":"设置较高的接地分数阈值。"}],"a":["A","D","F"],"e":"**正确答案：A、D、F。** A: 将高风险对话模式添加到拒绝主题（Denied Topics）护栏；D: 将竞争对手名称添加为自定义字词过滤器（输入/输出均阻止）；F: 设置较高的接地分数（Grounding Score）阈值。\n\n**为什么对：** 拒绝主题护栏专为阻止整个请求类别设计，如保证回报或股票推荐——这些监管敏感场景须完全阻止。自定义字词过滤器精确阻止特定竞争对手名称引用，内容过滤器（按仇恨/性/暴力等类别工作）不适合此目的。高接地分数阈值强制模型输出须有批准来源材料的强力支持，防止 AI 做出与公司财务指导不符的投机或无依据声明。\n\n**其他选项为什么错：**\n- B. 内容过滤器过滤高风险对话：内容过滤器按预定义类别工作，不针对特定领域的财务建议模式。\n- C. 内容过滤器过滤竞争对手名称：竞争对手名称不是内容过滤器的预定义类别。\n- E. 设置较低接地分数阈值：低阈值会削弱事实基础，增加产生幻觉的风险。","s":"源#242"},{"id":"D3-075","d":3,"t":"multiple","q":"一家公司使用 Amazon Bedrock 设计帮助研究人员申请资助的应用，基于 Amazon Nova Pro FM。应用有四个必需输入，须以一致文本格式提供响应。如果响应含欺凌语言，公司希望收到通知但不希望阻止所有被标记的响应。公司已创建 Bedrock Flow（流）接受输入提示并发送到 Nova Pro。公司还须采取哪些额外步骤？（选两项。）","o":[{"l":"A","t":"使用 Amazon Bedrock Prompt Management 将所需输入指定为变量。选择 Amazon Nova Pro。指定响应的输出格式。将提示添加到流程的提示节点。"},{"l":"B","t":"创建应用仇恨内容过滤器的 Amazon Bedrock 护栏。将过滤器响应设置为阻止。将护栏添加到流程的提示节点。"},{"l":"C","t":"创建 Amazon Bedrock 提示路由器。指定 Amazon Nova Pro。将所需的输入作为变量添加到流的输入节点。将提示路由器添加到提示节点。将输出格式添加到输出节点。"},{"l":"D","t":"创建应用侮辱内容过滤器的 Amazon Bedrock 护栏。设置要检测的过滤器响应。将护栏添加到流程的提示节点。"},{"l":"E","t":"创建指定 Amazon Nova Pro 的 Amazon Bedrock 应用程序推理配置文件。在描述中指定响应的输出格式。为每个输入变量包含一个标签。将配置文件添加到流程的提示节点。"}],"a":["A","D"],"e":"**正确答案：A、D。** A: 使用 Bedrock Prompt Management 将所需输入指定为变量、选择 Nova Pro、指定输出格式，将提示添加到流的提示节点；D: 创建应用侮辱（Insults）内容过滤器的 Bedrock Guardrails、设过滤器响应为检测（Detect）模式，将护栏添加到流的提示节点。\n\n**为什么对：** Bedrock Prompt Management 支持带显式输入变量和输出格式的提示模板——将四个必需输入定义为变量确保每次调用结构正确，指定输出格式确保响应一致。Bedrock Guardrails 的侮辱内容过滤器覆盖欺凌语言。设置为检测（Detect）模式时系统标记含侮辱性语言的响应但仍允许返回，实现监控、告警和审计而不中断应用功能，满足“通知但不阻止”的要求。\n\n**其他选项为什么错：**\n- B. 仇恨内容过滤器 + 阻止模式：阻止模式会阻止所有标记响应，与“不阻止所有标记响应”的要求矛盾。\n- C. Prompt Router（提示路由器）：应用仅使用单一 Nova Pro 模型，不需要路由器。\n- E. 应用推理配置文件指定输出格式和变量：推理配置文件不提供提示级变量强制或格式保证。","s":"源#243"},{"id":"D3-076","d":3,"t":"single","q":"一家公司开发基于 Amazon Bedrock FM 的 GenAI 应用，须满足以下要求：使用 Microsoft Entra ID 进行身份认证；所有 FM API 调用走私有网络路径；按部门限制对特定模型系列的访问；建立完整的模型交互审计日志。哪种方案满足这些要求？","o":[{"l":"A","t":"配置 Microsoft Entra ID 与 IAM 之间的 SAML 联邦。创建适用于特定部门的 IAM 角色，仅允许使用所需的 ModelId 值。为 Amazon Bedrock 运行时服务创建 AWS PrivateLink 接口 VPC 端点。启用 AWS CloudTrail 以捕获 Amazon Bedrock API 调用。配置 Amazon Bedrock 模型调用日志，记录详细的模型交互信息。"},{"l":"B","t":"在 IAM 中创建身份提供者（IdP）连接，以便使用 Microsoft Entra ID 进行身份验证；分配部门权限集以控制对特定模型系列的访问；在私有子网中部署 AWS Lambda 函数，并配置 NAT 网关用于向 Amazon Bedrock 公共端点进行出站流量；启用 CloudWatch Logs 以捕获模型交互数据，用于审计目的。"},{"l":"C","t":"在 IAM 中创建 SAML 身份提供者（IdP），用于通过 MicrosoftEntra ID 进行身份验证；使用 IAM 权限边界限制部门角色对特定模型家族的访问；配置公共 Amazon Bedrock API 端点，采用 VPC 路由以保持私有网络连接；设置 AWSCloudTrail 并结合 Amazon S3 生命周期规则，用于管理模型交互的审计日志。"},{"l":"D","t":"配置 Microsoft Entra ID 与 IAM 之间的 OpenID Connect（OIDC）联邦机制；使用基于属性的访问控制，将部门属性映射到特定模型的访问权限；应用 SCP 策略，根据部门限制对 Amazon Bedrock FM 系列的访问；利用 Microsoft Entra ID 内置的日志功能，维护模型交互的审计记录。"}],"a":["A"],"e":"**正确答案：A。** 配置 Entra ID 与 IAM 之间的 SAML 联邦 + 部门特定 IAM 角色限制 ModelId + PrivateLink 接口 VPC 端点 + CloudTrail 审计 API 调用 + Bedrock 模型调用日志记录详细交互。\n\n**为什么对：** SAML 联邦是 Entra ID（原 Azure AD）与 AWS 集成身份认证的标准方式。部门 IAM 角色通过限定 ModelId 值实现按部门的模型系列访问控制。PrivateLink 接口 VPC 端点确保所有 Bedrock API 调用走私有网络。CloudTrail 捕获 API 调用级审计，Bedrock 模型调用日志记录详细的提示和响应元数据，两者互补形成完整审计跟踪。\n\n**其他选项为什么错：**\n- B. IdP 连接 + NAT 网关出公网 + CloudWatch 审计：NAT 网关出口到公共端点违反私有网络要求；CloudWatch Logs 不等于全面 API 审计。\n- C. SAML IdP + 权限边界 + 公共端点 VPC 路由 + CloudTrail + S3 生命周期：公共端点无法确保私有连接，即使配置 VPC 路由也不符合要求。\n- D. OIDC 联邦 + ABAC + SCP + Entra ID 日志：Entra ID 对 AWS 认证应使用 SAML 而非 OIDC；Entra ID 日志无法捕获 Bedrock API 活动详情。","s":"源#244"},{"id":"D3-077","d":3,"t":"single","q":"一家金融服务公司开发 GenAI 应用，允许业务分析师通过自然语言查询敏感客户数据。GenAI 开发人员须实现内容安全框架：在执行文本转 SQL（Text-to-SQL）转换的同时防止有害输出。方案须检测并拦截提示中的 SQL 注入尝试、对生成的 SQL 查询进行预定义模式验证、并为查询转换过程创建审计日志。哪种方案满足这些要求？","o":[{"l":"A","t":"使用集成内容过滤系统的 Amazon Bedrock；部署采用自定义 SQL 威胁检测规则的 Amazon GuardDuty；利用 AWS Lambda 函数，将生成的查询与 AWS Systems Systems Manager Parameter Store 中的模式定义进行比对；使用 Amazon EventBridge 将所有转换记录存储至 Amazon S3。"},{"l":"B","t":"实施一个多阶段验证流水线，该流水线利用 Amazon Bedrock Guardrails 对输入数据进行过滤；配置 AWS Lambda 函数，使其与 SQL 解析库配合使用，以验证查询语法；并利用 Amazon RDS Data API 在流水线执行每条查询之前，对查询内容进行与定义的模式匹配验证，并收集审计日志。"},{"l":"C","t":"配置 AWS CloudTrail 以记录所有数据库 API 调用；实施对应用程序具有最小权限的 IAM 角色；使用 AWS WAF 对发送至应用程序的恶意输入进行过滤。"},{"l":"D","t":"训练一个自定义的 Amazon SageMaker AI 模型，用于安全地将文本转换为 SQL；配置 VPC 端点以隔离客户数据数据库；并将查询历史存储在 Amazon DynamoDB 中。"}],"a":["B"],"e":"**正确答案：B。** 多阶段验证流水线：Bedrock Guardrails 过滤输入 + Lambda 配合 SQL 解析库验证查询语法 + Amazon RDS Data API 执行前进行模式匹配验证并收集审计日志。\n\n**为什么对：** Bedrock Guardrails 设计用于过滤有害输入，包括 SQL 注入尝试，在提示到达模型前拦截恶意内容。Lambda + SQL 解析库验证生成的 SQL 查询语法正确性。RDS Data API 在执行每条查询前进行预定义模式匹配验证，确保查询仅访问允许的表和列。审计日志在流水线各阶段收集，形成完整的查询转换审计跟踪。\n\n**其他选项为什么错：**\n- A. Bedrock 内容过滤 + GuardDuty SQL 威胁检测 + Lambda + EventBridge：GuardDuty 不原生支持自定义 SQL 威胁检测规则，方案未稳健地解决 SQL 注入防护和模式验证。\n- C. CloudTrail + IAM 最小权限 + WAF：CloudTrail 记录 API 调用但无法防止 SQL 注入或验证查询；WAF 非为 SQL 验证设计。\n- D. 自定义 SageMaker 文本转 SQL 模型 + VPC 端点 + DynamoDB：自定义模型不能从根本上防止 SQL 注入或进行模式验证。","s":"源#245"},{"id":"D3-078","d":3,"t":"single","q":"一家社交消息服务公司使用 Amazon Bedrock 构建 AI 聊天助手。公司须确保每次推理均符合已批准的安全策略：调用模型前拦截有害提示、实时过滤流式传输的模型输出、将标记为可疑的案例路由至人工审核。哪种方案满足这些要求？","o":[{"l":"A","t":"配置 AWS Step Functions 工作流。配置一个步骤，使用 AWS Lambda 函数通过 ApplyGuardrail API 对输入进行预检查。使用带有 guardrail 的 InvokeModelWith ResponseStream API 步骤。配置第二个 Lambda 函数步骤，通过 ApplyGuardrail API 对输出进行后检查。将标记项路由至 Amazon SQS 队列。通过使用 bedrock:Guardrail Identifier 条件来强制执行 guardrail 的使用。"},{"l":"B","t":"配置一个 AWS Step Functions 工作流：配置一个步骤，用于在推理之前调用 ApplyGuardrail API；随后调用 InvokeModel API（不使用流式传输），并利用该 guardrail；将结果存储至 Amazon S3；最后，使用客户端 UI 隐藏有问题的令牌。"},{"l":"C","t":"配置一个 AWS Step Functions 工作流。配置一个步骤，使用带有用于流内过滤的护栏功能的“Invoke ModelWithResponseStream”API；通过调用“ApplyGuardrail”API 运行 AWS Lambda 后续检查步骤，以检查标记过的案例；请勿执行预推理操作。"},{"l":"D","t":"配置一个 AWS Step Functions 工作流，其中包含通过调用 ApplyGuardrail API 和 InvokeModelWithResponseStream API 来执行预检查与后检查的步骤；将防护措施附加至这些检查步骤；并采用代码审查等流程控制手段，而非依赖 IAM 策略强制执行，以确保始终应用这些防护措施。"}],"a":["A"],"e":"**正确答案：A。** Step Functions 工作流：Lambda 通过 ApplyGuardrail API 对输入预检查 + 带 Guardrail 的 InvokeModelWithResponseStream API 实时过滤流式输出 + Lambda 通过 ApplyGuardrail API 对输出后检查 + 标记项路由至 SQS 队列 + IAM 条件 bedrock:GuardrailIdentifier 强制护栏使用。\n\n**为什么对：** ApplyGuardrail API 对输入预检查在模型调用前拦截有害提示。InvokeModelWithResponseStream 配合护栏在流式处理中实时过滤输出。输出后检查进一步验证最终响应，标记的可疑案例路由至 SQS 队列供人工审核。IAM 条件键 bedrock:GuardrailIdentifier 以策略级别强制护栏的使用，确保合规性不依赖代码审查等流程控制。\n\n**其他选项为什么错：**\n- B. 预检查 + 非流式 InvokeModel + S3 存储 + 客户端隐藏：未使用流式推理无法实时过滤输出；客户端隐藏不满足服务端安全要求。\n- C. 仅流式过滤 + 后检查，无预推理检查：省略预推理检查意味着有害提示可到达模型，方案不完整。\n- D. 预/后检查 + 流式推理，但依赖代码审查而非 IAM 强制：代码审查是流程控制而非技术强制，不如 IAM 条件可靠和自动化。","s":"源#246"},{"id":"D4-001","d":4,"t":"single","q":"你的 GenAI 应用月度成本因低效提示设计和模型使用增加了 300%。哪种优化能带来最大成本降低？","o":[{"l":"A","t":"带语义保留的提示压缩和响应缓存策略"},{"l":"B","t":"带任务特定模型选择和批处理的模型正确调整大小"},{"l":"C","t":"带成本分配和优化建议的使用分析"},{"l":"D","t":"带需求预测和容量优化的预留容量规划"}],"a":["A"],"e":"**正确答案：A。** 一边压缩提示、减少每次请求消耗的 token，一边把重复查询的结果缓存下来直接复用。\n\n**为什么对：** 成本大致等于\"单次 token 数 × 调用次数\"。提示压缩砍的是前一个乘数，响应缓存砍的是后一个，两者同时作用在两个因子上，合起来的降幅最大。\n\n**其他选项为什么错：**\n- B. 模型选型 + 批处理：换小模型确实省钱，但批处理不适合交互式场景，而且没有减少调用次数。\n- C. 使用分析 + 优化建议：分析只告诉你钱花在哪，本身不产生节省。\n- D. 预留容量规划：预留买的是容量确定性和折扣，不改变 token 的实际消耗量。","s":"源#247"},{"id":"D4-002","d":4,"t":"single","q":"一个 RAG 系统尽管实现了响应缓存，仍有 60% 的缓存未命中率。哪种缓存策略能提高命中率？","o":[{"l":"A","t":"基于嵌入的键生成的语义相似性缓存"},{"l":"B","t":"带提示模板和基于参数的失效的多级缓存"},{"l":"C","t":"带用户行为分析和预计算策略的预测性缓存"},{"l":"D","t":"带一致性哈希和智能缓存预热的分布式缓存"}],"a":["A"],"e":"**正确答案：A。** 改用语义缓存：把查询转成嵌入当作缓存键，按语义相似度而不是文本精确匹配来判定命中。\n\n**为什么对：** 未命中率高的常见原因是\"同一个意思换了个说法\"。精确匹配用原文做键，说法一变就 miss；用嵌入做键则按语义相近判定，措辞不同也能命中。\n\n**其他选项为什么错：**\n- B. 多级缓存 + 按模板和参数失效：多级改的是缓存架构，键的匹配方式没变，该 miss 还是 miss。\n- C. 预测性缓存 + 用户行为分析：预测能提前把结果准备好，但能不能命中仍取决于键怎么匹配。\n- D. 分布式缓存 + 一致性哈希 + 预热：解决的是容量、分布和冷启动，跟匹配逻辑无关。","s":"源#248"},{"id":"D4-003","d":4,"t":"single","q":"你的模型推理成本主要来自大上下文窗口。哪种优化能在保持质量的同时降低成本？","o":[{"l":"A","t":"带关键信息提取和滑动窗口技术的上下文压缩"},{"l":"B","t":"带摘要生成和按需细节策略的层级上下文"},{"l":"C","t":"带可重用上下文段和智能缓存管理的上下文缓存"},{"l":"D","t":"带基于相关性内容选择和剪枝的动态上下文大小"}],"a":["A"],"e":"**正确答案：A。** 对上下文做压缩：先提取出真正关键的信息，再配合滑动窗口处理超长内容。\n\n**为什么对：** 成本直接等于送进模型的 token 数，而大上下文就是大头。压缩直接减少这部分 token；关键信息提取保证挤掉的是水分而不是要点，所以质量能保住。\n\n**其他选项为什么错：**\n- B. 层级上下文 + 先摘要 + 按需取细节：生成摘要本身也要先把全文读一遍，这一步的 token 成本照样要付。\n- C. 上下文缓存：缓存解决的是重复查询，单次请求里那段长上下文的 token 一个也没少。\n- D. 动态上下文大小 + 相关性剪枝：思路接近，但缺少\"提取关键信息\"这个保障质量的环节，压缩比通常也不如 A。","s":"源#249"},{"id":"D4-004","d":4,"t":"single","q":"你的应用需要针对 10,000+ 并发用户和亚秒响应时间进行性能优化。哪种方法能有效扩展？","o":[{"l":"A","t":"带连接池、负载均衡和基于性能指标自动扩展"},{"l":"B","t":"带 CDN 集成和边缘计算的缓存层，降低延迟"},{"l":"C","t":"带队列管理和结果流式传输的异步处理"},{"l":"D","t":"带独立扩展和性能优化的微服务架构"}],"a":["B"],"e":"**正确答案：B。** 在靠近用户的一侧加缓存，用 CDN（内容分发网络）和边缘计算就近返回结果。\n\n**为什么对：** 万人并发下瓶颈往往不在算力，而在\"每个请求都要回源\"。把可缓存的响应推到边缘节点，用户请求就近命中，省掉回源那一段往返，延迟和源站压力同时降下来。\n\n**其他选项为什么错：**\n- A. 连接池 + 负载均衡 + 按指标自动扩展：优化的是服务端承载能力，但每个请求仍要回源，物理距离带来的延迟省不掉。\n- C. 异步处理 + 队列 + 结果流式：异步能削峰填谷，但对\"亚秒级即时响应\"这个要求其实是反向的。\n- D. 微服务 + 独立扩展：拆分解决的是部署和扩容粒度，解决不了就近返回。","s":"源#250"},{"id":"D4-005","d":4,"t":"single","q":"一个批处理系统每月需要处理 100TB 文档，需优化成本。哪种方法能最小化处理成本？","o":[{"l":"A","t":"在 EC2 上的文档预处理阶段，使用带检查点和容错工作流的 Spot 实例"},{"l":"B","t":"带预留容量和批量优化的非高峰调度"},{"l":"C","t":"带自动扩展和按使用付费定价模型的无服务器处理"},{"l":"D","t":"带本地预处理和基于云推理的混合处理"}],"a":["A"],"e":"**正确答案：A。** 在 EC2 上做文档预处理这一段用 Spot 实例，并配 checkpoint（检查点）做容错。\n\n**为什么对：** 要\"最小化成本\"，得看清哪一段能真打折——计算侧和推理侧是两套不同的计价逻辑。\n- 计算侧（本题的答案落点）：文档预处理这类容错性强的批作业，Spot 实例价格比按需实例低得多；代价是实例可能被回收，所以用检查点把处理进度存下来，被回收后从断点续跑，100TB 的作业不会因为一次回收全部白跑。\n- 推理侧：Amazon Bedrock 的模型调用**按 token 计费，没有实例概念**，也就谈不上 Spot；推理侧唯一的价格折扣是 Batch inference（批量推理），按需价格打 5 折。\n100TB 量级里文档预处理通常是占比最大的一块成本，选项 A 正好压在这一段上。\n\n**其他选项为什么错：**\n- B. 预留容量 + 非高峰调度：预留容量买的是确定性而不是最低单价，单位成本高于 Spot；\"非高峰调度\"本身不构成价格折扣。\n- C. 无服务器 + 按量付费：按量付费是标准单价，拿不到 Spot 那种折扣；100TB 量级还要考虑运行时长与资源上限。\n- D. 混合处理（本地预处理 + 云上推理）：本地要投硬件，云上推理按 token 计费省不掉，总成本反而更高。\n\n**关键概念：** 本题最大的混淆点是\"Spot 属于 EC2，不属于 Bedrock\"。Amazon Bedrock 是按 token 计费的托管推理服务，pricing 页没有实例/EC2 计费项；批处理省钱的两个抓手要分开用——推理侧用 **Batch inference（按需价 50%）**，计算侧才用 **Spot 实例**。参考：Amazon Bedrock Pricing 页与 Batch inference 文档。","s":"源#251"},{"id":"D4-006","d":4,"t":"single","q":"一个产品团队希望用户跨多次会话对政策问题获得一致的答案。应首先控制哪个提示设置？","o":[{"l":"A","t":"温度（Temperature）"},{"l":"B","t":"子网大小"},{"l":"C","t":"DNS TTL"},{"l":"D","t":"构建超时"}],"a":["A"],"e":"**正确答案：A。** 把 temperature（温度）调低。\n\n**为什么对：** 温度控制的是采样环节的随机性。温度越高，模型越可能选到概率不那么高的词，每次输出就不一样；调到接近 0，模型几乎总是选概率最高的那个词，同一个问题反复问得到的答案就基本一致。政策类问答要的正是这种确定性。\n\n**其他选项为什么错：**\n- B. 子网大小：网络配置，不影响模型输出。\n- C. DNS TTL：域名解析记录的缓存时间，不影响模型输出。\n- D. 构建超时：CI/CD 的配置项，不影响模型输出。","s":"源#252"},{"id":"D4-007","d":4,"t":"single","q":"某医疗机构借助 Bedrock 部署了一款临床文档摘要生成应用。该应用输出质量波动较大，间或出现脱离事实的幻觉现象，且月度费用超出预算 40%。开发人员须实施近实时监控方案以检测幻觉、识别异常 Token 消耗并提前预警成本偏差，同时将自定义开发和维护工作量降至最低。哪项方案可满足需求？","o":[{"l":"A","t":"配置 CloudWatch 告警监控 InputTokenCount 与 OutputTokenCount 指标。将模型调用日志存入 S3，用 Glue 和 Athena 识别潜在幻觉"},{"l":"B","t":"运行以 LLM 作为评判模型的 Bedrock 评估任务检测幻觉。配置 CloudWatch 跟踪 Token 用量。创建 Lambda 函数处理指标并发送通知"},{"l":"C","t":"配置 Bedrock 将模型调用日志存入 S3 并启用文本输出日志。配置 Bedrock 护栏执行上下文基础检查检测幻觉。创建 CloudWatch 异常检测告警监控 Token 使用指标"},{"l":"D","t":"用 CloudTrail 记录 Bedrock API 调用。在 QuickSight 中创建自定义仪表盘可视化 Token 使用模式。用 SageMaker Model Monitor 检测摘要质量漂移"}],"a":["C"],"e":"**正确答案：C。** Bedrock 调用日志+Guardrails（护栏）上下文基础检查+CloudWatch 异常检测。\n\n**为什么对：**调用日志含文本输出存入 S3 提供持久审计数据。护栏的上下文基础检查验证摘要是否基于临床文档，是 RAG 场景中检测幻觉的推荐方式，无需自建评估管道。CloudWatch 异常检测为 Token 指标动态建模基线，自动适应使用趋势检测异常消耗，比静态阈值更有效。全部利用 Bedrock 和 CloudWatch 原生能力，自定义开发最少。\n\n**其他选项为什么错：**\n- A.Glue+Athena 批处理分析：非近实时且增加运维开销\n- B.LLM 评估任务+Lambda：需管理评估任务和自定义通知逻辑\n- D.CloudTrail+QuickSight+Model Monitor：CloudTrail 记录 API 调用非内容，QuickSight 为 BI 工具非实时监控\n\n**关键概念：**Bedrock 调用日志记录提供审计数据，护栏上下文基础检查检测幻觉，CloudWatch 异常检测自动建模 Token 使用基线实现成本预警。","s":"源#253"},{"id":"D4-008","d":4,"t":"single","q":"某金融企业通过 Bedrock 为其 GenAI 应用使用多个 FM。为符合一项针对敏感金融数据的监管新规，企业须实现 Token 管理方案。方案须在应用接近各模型 Token 上限时主动告警，每分钟处理超过 5000 个请求，并将 Token 使用指标按业务部门拆分以分配成本。哪项方案可满足需求？","o":[{"l":"A","t":"在 Lambda 中开发模型特定分词器。调用 Bedrock 前估算 Token 用量。将指标发布到 CloudWatch，接近阈值时触发告警。详细数据存入 DynamoDB 用于成本报告"},{"l":"B","t":"实施带 Token 配额策略的 Bedrock 护栏。捕获被拒请求指标。用 EventBridge 规则触发通知。用 CloudWatch 仪表盘可视化各模型 Token 趋势"},{"l":"C","t":"为失败请求部署 SQS 死信队列。用 Lambda 分析 Token 相关失败。用 CloudWatch Logs Insights 生成使用模式报告"},{"l":"D","t":"用 API Gateway 为 Bedrock 调用创建代理。基于自定义使用计划配置限流。配置拒绝超过 Token 限制的请求"}],"a":["A"],"e":"**正确答案：A。** Lambda 分词器+CloudWatch 告警+DynamoDB 成本。\n\n**为什么对：**Bedrock 调用后暴露 Token 指标但无法主动强制限制。Lambda 中实现模型特定分词器可在调用前估算输入输出 Token，提前检测接近上限的请求。CloudWatch 支持实时监控告警，轻松处理每分钟 5000+ 请求。DynamoDB 存储详细使用数据实现按业务部门的成本归因，满足法规报告和内部成本分摊需求。\n\n**其他选项为什么错：**\n- B.Guardrails（护栏） Token 配额：护栏当前不提供 Token 配额执行或主动告警\n- C.SQS 死信队列：被动分析失败后的问题，非主动管理\n- D.API Gateway 限流：按请求限流非按 Token 限制，无法提供按模型成本归属\n\n**关键概念：**Lambda 分词器在调用前估算 Token 实现主动管理，CloudWatch 告警实时监控，DynamoDB 存储按部门成本归因数据。","s":"源#254"},{"id":"D4-009","d":4,"t":"multiple","q":"某出版企业正在开发一款聊天助手，使用运行在 SageMaker AI 上的容器化 LLM。架构含 API Gateway REST API 将用户请求路由到 Lambda，再由 Lambda 调用托管 LLM 的 SageMaker 实时端点。用户反馈响应时间不均匀。分析显示大量对话在等待首个 Token 超过 2 秒后被放弃。企业希望确保交互式聊天请求的 p95 延迟低于 800 毫秒。哪组方案组合可满足需求？（选择两项）","o":[{"l":"A","t":"在容器启动时启用模型预加载。实现动态批处理将多个请求合并到一次推理中处理"},{"l":"B","t":"为端点选择更大 GPU 实例。将最小实例数设为 0。按请求处理。首个请求时延迟加载模型权重"},{"l":"C","t":"切换到多模型端点。使用延迟加载，不进行请求批处理"},{"l":"D","t":"将最小实例数设为大于 0。启用响应流式传输"},{"l":"E","t":"将全部请求转用 SageMaker 异步推理，请求先存入 S3，并把最小实例数设为 0"}],"a":["A","D"],"e":"**正确答案：A、D。**\n\n**为什么对：**\n- D.最小实例数大于 0+响应流式传输：消除Cold Start（冷启动）Latency（延迟），端点始终保持预热容量，流式传输尽快返回首个 Token 直接解决用户放弃问题\n- A.容器启动预加载+动态批处理：预加载确保模型在流量到达前就绪，批处理合并请求提高 GPU 利用率并降低每请求开销\n\n**其他选项为什么错：**\n- B.最小实例数 0+延迟加载：保证冷启动延迟，使首个 Token 性能不可预测\n- C.多模型端点+延迟加载：延迟加载增加冷启动，无批处理收益\n- E.异步推理+S3 存储+最小实例 0：异步推理引入排队和存储延迟，与交互式聊天 800 毫秒 p95 要求冲突\n\n**关键概念：**最小实例数大于 0 消除冷启动，响应流式传输加速首个 Token 返回，容器预加载和动态批处理进一步提升吞吐和降低 p95 延迟。","s":"源#255"},{"id":"D4-010","d":4,"t":"single","q":"某精品咖啡品牌运营移动应用，借助 Bedrock 以三段式提示链路为客户定制咖啡烘焙档案。链路先将用户输入转为结构化元数据，继而检索关联烘焙记录并输出个性化推荐。跨区域用户反馈同输入产出不统一、检索环节推理迟缓，且偶现不安全建议（如异常高温冲泡）。企业须将输出一致性提至 99.5%、推理延迟压降至 1 秒内，并以经验证的安全控制拦截不安全或幻觉推荐。哪项方案可满足需求？","o":[{"l":"A","t":"部署带预置吞吐量的 Bedrock 稳定推理延迟。应用带语义拒绝规则的护栏拦截不安全输出。用 Prompt Management 通过审批工作流管控提示版本"},{"l":"B","t":"用 Bedrock Agents 管理链式调用。将模型输入输出记入 CloudWatch Logs。用日志对提示版本做 A/B 测试"},{"l":"C","t":"将提示结果缓存到 ElastiCache。用 Lambda 预处理元数据并跟踪延迟。用 X-Ray 识别瓶颈"},{"l":"D","t":"用 Kendra 改善烘焙记录检索精度。将标准化元数据存入 DynamoDB。用 Step Functions 编排多步提示"}],"a":["A"],"e":"**正确答案：A。** Provisioned Throughput（预置吞吐量）+Guardrails（护栏）语义拒绝+Prompt Management 审批。\n\n**为什么对：**预置吞吐量为模型预留推理容量，提供可预测的性能和稳定Latency（延迟），跨区域消除按需容量波动。护栏语义拒绝规则在模型边界拦截不安全指导（如危险温度），提供经验证的安全控制。Prompt Management 版本控制和审批工作流确保跨区域一致使用经批准的提示模板，通过控制提示版本实现 99.5% 一致性。\n\n**其他选项为什么错：**\n- B.Agents+CloudWatch A/B 测试：改善可观测性但不强制安全控制或稳定延迟\n- C.ElastiCache 缓存+X-Ray：缓存仅对重复输入有效，不解决安全性和一致性问题\n- D.Kendra+DynamoDB+Step Functions：改善检索和编排但不解决核心的延迟稳定性和安全控制需求\n\n**关键概念：**预置吞吐量稳定推理延迟，护栏语义拒绝规则拦截不安全输出，Prompt Management 审批工作流管控提示版本确保跨区域一致性。","s":"源#256"},{"id":"D4-011","d":4,"t":"single","q":"某企业构建基于 Bedrock API 的 GenAI 应用处理复杂客户咨询。高峰期遭遇间歇性 API 超时，导致响应块损坏和数据交付延迟。处理不同长度咨询时难以确保提示在 Token 限制内，用户反馈输入被截断和响应不完整。FM 调用也出现失败。企业须实现重试策略以自动处理瞬态错误并防止高峰期压垮 Bedrock，须适应服务可用性变化，并支持响应流式传输和 Token 感知请求处理。哪项方案可满足需求？","o":[{"l":"A","t":"实现固定 1 秒间隔重试，最多 3 次。通过重启流处理超时。限制每会话 Token 用量"},{"l":"B","t":"实现带抖动指数退避和断路器的自适应重试，错误率超阈值时暂停重试。实现流式响应处理器监控块交付超时，缓冲已接收块并在连接恢复时从断点续传"},{"l":"C","t":"用 SDK 标准模式重试。try-catch 处理超时。为失败流请求返回缓存结果。全局 Token 限制。从失败点请求缺失块恢复中断流"},{"l":"D","t":"将客户端超时设为 30 秒。实现客户端负载丢弃。性能下降时停止新请求。静态 Token 上限。指数退避重试和动态块大小调整"}],"a":["B"],"e":"**正确答案：B。** 抖动指数退避+断路器+流式续传。\n\n**为什么对：**抖动指数退避是 AWS 推荐的瞬态故障处理模式，分散重试避免同步重试风暴。断路器在错误率超阈值时暂停重试，防止级联故障压垮 Bedrock。流式响应处理器缓冲已接收块并在连接恢复后从断点续传，避免重启整个流，减少冗余生成和对模型的额外负载。这套做法将自适应重试与流感知处理整合。\n\n**其他选项为什么错：**\n- A.固定Latency（延迟）重试：存在重试风暴风险，重启流造成冗余生成\n- C.SDK 标准+缓存结果+全局限制：元素冲突，缓存返回非实时响应\n- D.30 秒超时+负载丢弃：引入不必要复杂性，静态限制不适应变化\n\n**关键概念：**抖动指数退避分散重试避免风暴，断路器防止级联故障，流式响应处理器缓冲续传最小化冗余生成。","s":"源#257"},{"id":"D4-012","d":4,"t":"single","q":"某企业为支付处理 API 设计金丝雀发布方案。系统须依据实时推理指标、过往流量规律及服务健康度，在多个 Bedrock 模型版本间自动渐进地调配流量。指标达标时递增流量，性能不达标时缩减。企业还须在发布阶段全方位监控推理延迟与错误率，且可在零人工干预下中止发布并回退到前序版本。哪项方案可满足需求？","o":[{"l":"A","t":"用 Bedrock 预置吞吐量托管模型版本。配置 EventBridge 规则在新版本发布时调用 Step Functions 工作流。工作流分阶段转移流量，等待观察窗口后调用 Lambda 检查 CloudWatch 指标。指标达标增加流量，低于阈值触发回滚"},{"l":"B","t":"用 Lambda 调用各 Bedrock 模型版本。用 API Gateway 阶段变量和加权路由逐步转移流量。用 CloudWatch 监控。用外部逻辑调整流量和回滚"},{"l":"C","t":"用 SageMaker 端点变体表示 Bedrock 模型版本。用变体权重转移流量。用 CloudWatch 和 Model Monitor 触发回滚"},{"l":"D","t":"用 OpenSearch 跟踪推理日志。配置 OpenSearch 调用 Systems Manager Automation 运行手册更新模型端点转移流量"}],"a":["A"],"e":"**正确答案：A。** Provisioned Throughput（预置吞吐量）+EventBridge+Step Functions+Lambda+CloudWatch。\n\n**为什么对：**Step Functions 编排含确定性阶段、观察窗口和条件分支的自动化发布流程。分阶段调配流量并设观察窗口，在推进前评估实时Latency（延迟）与错误率。Lambda 评估 CloudWatch 指标实现动态逻辑：达标递增流量，异常触发回退。Step Functions 可暂停推进或立即触发回退，满足无人工干预自动回退。EventBridge 在新版本发布时自动触发发布流程。\n\n**其他选项为什么错：**\n- B.外部逻辑：引入操作风险，无法保证自动回退\n- C.SageMaker 端点变体：非 Bedrock 模型版本的预期集成模式\n- D.OpenSearch+Automation 运行手册：间接且复杂，非直接的基于指标的流量控制\n\n**关键概念：**Step Functions 编排分阶段金丝雀发布，Lambda 评估 CloudWatch 指标实现动态流量决策，EventBridge 自动触发发布流程，无需人工干预即可回退。","s":"源#258"},{"id":"D4-013","d":4,"t":"single","q":"某企业运行 RAG 应用，使用 Bedrock Knowledge Bases 执行法规合规查询，通过 RetrieveAndGenerateStream API 从含 5 万余份法规文件的知识库中检索文档。应用输出质量不佳，因初始检索常返回语义相近但上下文不相关的文档，导致模型幻觉和错误法规指导。企业须改进 RAG 性能以返回更相关文档，运营开销最小。哪项方案可满足需求？","o":[{"l":"A","t":"部署 SageMaker 端点运行微调排序模型。用 API Gateway 路由请求。通过 REST API 对结果重新排序"},{"l":"B","t":"用 Comprehend 对文档分类并评分。将重排序过程与 Textract 集成做文档分析。用 Neptune 执行图相关性计算"},{"l":"C","t":"实现用 Retrieve API 做初始检索的管道。调用 Bedrock Rerank API 重排序。调用 InvokeModelWithResponseStream 生成响应"},{"l":"D","t":"通过 Bedrock Knowledge Bases 中的重新排序配置使用最新的 Amazon 重排序模型。基于上下文评估改进文档相关性评分和重排序"}],"a":["D"],"e":"**正确答案：D。** Knowledge Bases 内置重排序配置。\n\n**为什么对：**Knowledge Bases 原生支持 Amazon 管理的重排序模型，专为在初始向量检索后改进上下文相关性设计。启用重排序配置后，基于更深入的上下文理解自动重排序检索文档，无需额外基础设施或自定义编排。与现有 RetrieveAndGenerateStream 工作流无缝集成，运营开销最低。\n\n**其他选项为什么错：**\n- A.SageMaker 端点+API Gateway：需自定义端点管理和路由，增加运维复杂性\n- B.Comprehend+Textract+Neptune：组合多个非 RAG 专用服务，复杂性高\n- C.Retrieve API+Rerank API：需显式调用并修改应用管道，增加集成工作\n\n**关键概念：**Bedrock Knowledge Bases 内置重排序配置利用 Amazon 管理的模型在向量检索后改进上下文相关性，无需额外基础设施或自定义编排。","s":"源#259"},{"id":"D4-014","d":4,"t":"single","q":"某企业使用 Bedrock 和 Anthropic Claude 3 Haiku 开发 AI 助手。助手平时每小时处理 10000 个请求，高峰期激增至每小时 30000 个。须在 2 秒内响应且跨多个 AWS 区域运行。高峰期遭遇吞吐瓶颈导致延迟增加和偶发超时。企业须解决性能问题。哪项方案可满足需求？","o":[{"l":"A","t":"在单区域购买预置吞吐量和足够模型单元。用指数退避重试失败请求"},{"l":"B","t":"实施令牌批处理减少 API 开销。使用跨区域推理配置文件自动在可用区域间分配流量"},{"l":"C","t":"在各区域设置自动扩缩 Lambda。实施客户端轮询分发。购买一个模型单元预置吞吐量作为备份"},{"l":"D","t":"通过跨区域 S3 存储桶实施批处理推理。用 SQS 设置异步检索流程"}],"a":["B"],"e":"**正确答案：B。** 令牌批处理+Cross-Region Inference（跨区域推理）配置文件。\n\n**为什么对：**跨区域推理配置文件将推理请求透明路由到多个区域，高峰期自动分配到有容量的区域，减少节流和超时风险。令牌批处理将多个推理请求合并为单次模型调用，减少每请求开销提高 Throughput（吞吐量）。Claude 3 Haiku 为轻量低Latency（延迟）模型，批处理和跨区域分配尤其有效。方案使用 Bedrock 原生性能优化功能，无需自定义架构。\n\n**其他选项为什么错：**\n- A.单区域Provisioned Throughput（预置吞吐量）：创建区域瓶颈，重试增加负载和延迟\n- C.Lambda 自动扩缩+客户端轮询：解决应用层扩缩但不解决模型侧吞吐限制\n- D.批处理推理+SQS 异步：为离线工作负载设计，无法满足 2 秒交互响应\n\n**关键概念：**跨区域推理配置文件自动在多区域分配推理请求消除吞吐瓶颈，令牌批处理减少 API 开销提升吞吐量。","s":"源#260"},{"id":"D4-015","d":4,"t":"single","q":"某企业开发 GenAI 应用，实时分析客服通话并为人工坐席生成建议回复。高峰期须处理 50 万并发通话，每条建议端到端延迟低于 200 毫秒。企业使用现有架构转录通话音频。应用不得超出月度计算预算并须保持自动扩展。哪项方案可满足需求？","o":[{"l":"A","t":"在 Bedrock 上部署大型复杂推理模型。购买预置吞吐量并针对批量处理优化"},{"l":"B","t":"在 Bedrock 上部署低延迟实时优化模型。购买预置吞吐量并设自动扩展策略"},{"l":"C","t":"在 SageMaker 实时端点上部署大型 LLM，使用专用 GPU 实例"},{"l":"D","t":"在 SageMaker 无服务器端点上部署中型 LLM，针对批量处理优化"}],"a":["B"],"e":"**正确答案：B。** 低Latency（延迟）模型+Provisioned Throughput（预置吞吐量）+自动扩展。\n\n**为什么对：**Bedrock 低延迟实时优化模型以最小每请求开销处理高请求速率。预置吞吐量预留模型容量处理峰值负载，消除Cold Start（冷启动）减少排队。自动扩展策略根据需求动态调整容量，非高峰期成本高效同时保持高峰性能。方案在性能、可扩展性、成本控制和运营简洁性间取得最佳平衡。\n\n**其他选项为什么错：**\n- A.大型复杂模型+批量处理：引入更高延迟，不适合实时建议场景\n- C.SageMaker 专用 GPU：运营和成本开销显著更高，手动扩展职责\n- D.无服务器端点+批量优化：批量工作负载无法满足 200 毫秒延迟要求\n\n**关键概念：**Bedrock 低延迟模型处理高并发实时推理，预置吞吐量消除冷启动和排队，自动扩展策略控制成本同时保障峰值性能。","s":"源#261"},{"id":"D4-016","d":4,"t":"single","q":"某企业构建无服务器应用，帮助全球学生汇总学习笔记。应用通过 Bedrock 使用 Anthropic Claude。企业观察到大部分流量集中在各时区晚间，用户反馈高峰时段遭遇节流错误。企业须确保应用持续运行且不降低性能质量，且低流量时段不产生固定小时费用。哪项方案可满足需求？","o":[{"l":"A","t":"创建自定义 CloudWatch 指标监控错误。将预置吞吐量设为高于峰值流量的值"},{"l":"B","t":"创建自定义 CloudWatch 指标监控错误。设故障转移机制在错误超阈值时重定向到备份区域"},{"l":"C","t":"启用 Bedrock 调用日志记录。监控 Invocations、InputTokenCount、OutputTokenCount 和 InvocationThrottles 指标。将流量分布到跨区域推理端点"},{"l":"D","t":"启用 Bedrock 调用日志记录。监控 InvocationLatency、InvocationClientErrors 和 InvocationServerErrors。将流量分布到同模型多版本"}],"a":["C"],"e":"**正确答案：C。** 调用日志+关键指标监控+Cross-Region Inference（跨区域推理）端点。\n\n**为什么对：**跨区域推理将请求分布到多区域，减少争用防止节流，无需预留容量，按需定价避免低流量时段固定成本。调用日志和原生指标（InvocationThrottles、TokenCount）提供使用模式可视性，验证流量分布和性能一致性。方案以按需定价满足持续运行需求且无固定小时费用。\n\n**其他选项为什么错：**\n- A.Provisioned Throughput（预置吞吐量）：引入固定小时成本，违反低流量时段避免不必要支出要求\n- B.故障转移机制：被动行为而非主动负载分配，增加复杂性\n- D.同区域多版本：不增加可用容量，未解决节流根本原因\n\n**关键概念：**跨区域推理端点自动分布请求到多区域消除节流，按需定价避免固定成本，调用日志和原生指标提供使用可视性。","s":"源#262"},{"id":"D4-017","d":4,"t":"single","q":"某金融企业通过 Bedrock 处理财务文档的 AI 应用在工作时间每小时处理约 1 万请求，需一致吞吐量。企业用 CreateProvisionedModelThroughput API 购买了预置吞吐量。CloudWatch 显示预置容量未被使用而按需请求被节流。应用代码中使用 modelId 指定基础模型标识符。企业须让应用使用预置吞吐量并解决节流。哪项方案可满足需求？","o":[{"l":"A","t":"增加预置吞吐量配置中的模型单元数量"},{"l":"B","t":"将模型 ID 参数替换为 CreateProvisionedModelThroughput API 返回的预置模型 ARN"},{"l":"C","t":"添加指数退避重试逻辑处理高峰时段节流异常"},{"l":"D","t":"修改应用使用 InvokeModelWithResponseStream API 替代 InvokeModel API"}],"a":["B"],"e":"**正确答案：B。** 替换为预置模型 ARN。\n\n**为什么对：**Bedrock Provisioned Throughput（预置吞吐量）仅在应用显式调用预置模型 ARN 时生效，而非Foundation Model（基础模型） ID。代码使用基础模型标识符将请求路由到按需容量池而非已购买的预置资源。CreateProvisionedModelThroughput API 返回的 ARN 代表预留容量，替换 modelId 参数后流量正确路由到预置资源，解决节流并使预置容量生效。\n\n**其他选项为什么错：**\n- A.增加模型单元：不解决根本原因，应用根本未使用预置资源\n- C.退避重试：增加Latency（延迟）且仍浪费预置容量，不保证一致吞吐\n- D.切换流式 API：改变响应投递机制但不影响容量路由\n\n**关键概念：**Bedrock 预置吞吐量附加到 CreateProvisionedModelThroughput 返回的预置 ARN，须在 modelId 参数中引用该 ARN 而非基础模型 ID 才能使用预留容量。","s":"源#263"},{"id":"D4-018","d":4,"t":"single","q":"某企业为 500 名开发者购买了 Amazon Q Developer Pro 订阅以提升代码质量和生产力。企业须建立可观测性系统跟踪全公司采用指标，识别活跃订阅用户与未充分利用的订阅，每季度识别高级用户并确定需额外培训的团队，同时提供对使用模式的可视性（如每用户已接受的 Q 生成代码行数）。哪项方案可满足需求？","o":[{"l":"A","t":"为 Q Developer 创建使用量仪表板。用使用量仪表板跟踪汇总采用指标"},{"l":"B","t":"使用 Q Developer 内置管理员仪表板，跟踪 Organizations 中全公司用户采用指标"},{"l":"C","t":"在 Q Developer 中收集用户级指标。存入 S3。用 QuickSight 可视化。创建仪表板"},{"l":"D","t":"配置 CloudTrail 跟踪 Organizations 中所有 Q Developer API 调用。用 Lambda 处理日志。存入 DynamoDB。在 Managed Grafana 创建仪表板"}],"a":["B"],"e":"**正确答案：B。** Q Developer 内置管理员仪表板。\n\n**为什么对：**内置管理员仪表板专为 Q Developer Pro 管理员组织可观测性设计，提供 Organizations 中用户级指标原生可视性。可识别活跃与未充分利用的订阅，识别高级用户，跟踪高级使用模式含代码接受指标（生成代码和被接受代码行数），这是衡量 ROI 和确定培训需求的关键。无需构建自定义数据管道或日志处理架构，运营开销最小。\n\n**其他选项为什么错：**\n- A.使用量仪表板：仅汇总指标，缺乏用户级可视性和高级模式跟踪\n- C.S3+QuickSight：需构建自定义数据管道，增加运维开销\n- D.CloudTrail+Lambda+DynamoDB+Grafana：复杂的日志处理架构，运维负担高\n\n**关键概念：**Q Developer Pro 内置管理员仪表板提供 Organizations 中用户级采用指标和代码接受模式跟踪，无需自定义数据管道。","s":"源#264"},{"id":"D4-019","d":4,"t":"single","q":"某金融企业须构建基于 Bedrock 的文档分析系统处理季度报告。系统须分析财务数据、执行情感分析并跨批验证合规性。每批 5 份报告，每份需多次 FM 调用。须在每批 10 秒内完成分析。当前顺序处理每批需 45 秒。哪项方案可满足需求？","o":[{"l":"A","t":"用带预置并发的 Lambda 顺序处理各分析类型。超时设为 10 秒。配置自动重试带指数退避"},{"l":"B","t":"用 Step Functions Parallel 状态同时调用各分析类型的独立 Lambda。配置 Bedrock 客户端超时。用 CloudWatch 跟踪执行时间和推理延迟"},{"l":"C","t":"创建 SQS 队列缓冲请求。部署多个带预留并发的 Lambda。每个 Lambda 顺序处理报告不同方面后合并"},{"l":"D","t":"部署 ECS 集群运行容器，每个容器顺序处理报告。用负载均衡器分发。基于 CPU 自动扩展"}],"a":["B"],"e":"**正确答案：B。** Step Functions Parallel+独立 Lambda+客户端超时+CloudWatch。\n\n**为什么对：**各分析类型（财务提取、情感分析、合规验证）不相互依赖，Parallel 状态同时调用独立 Lambda 将每批时间从 45 秒大幅压缩至 10 秒内。Step Functions 提供内置错误处理、重试和状态跟踪。客户端超时确保缓慢调用不阻塞整批。CloudWatch 监控执行时间和推理Latency（延迟）支持调优。\n\n**其他选项为什么错：**\n- A.顺序处理+预置并发：仍顺序执行无法满足延迟要求\n- C.SQS+多 Lambda+顺序处理：引入队列延迟和报告内顺序处理\n- D.ECS+容器顺序处理：增加容器运维开销，非事件驱动\n\n**关键概念：**Step Functions Parallel 状态并行化独立 FM 推理任务，将顺序 45 秒压缩至 10 秒内，内置错误处理和可观测性。","s":"源#265"},{"id":"D4-020","d":4,"t":"single","q":"某金融企业 AI 应用通过 Bedrock 处理财务文档，工作时间每小时约 1 万请求需稳定吞吐。企业已通过 CreateProvisionedModelThroughput API 购买预置吞吐量，但 CloudWatch 显示预置容量闲置而按需请求遭节流。检查代码发现 invoke_model 调用中 modelId 参数使用基础模型标识符。企业须使应用正确使用预置资源并消除节流。哪项方案可满足需求？","o":[{"l":"A","t":"增加预置吞吐量配置中的模型单元数量"},{"l":"B","t":"将 modelId 参数替换为 CreateProvisionedModelThroughput API 返回的预置模型 ARN"},{"l":"C","t":"添加指数退避重试逻辑应对高峰时段节流"},{"l":"D","t":"改用 InvokeModelWithResponseStream API 替代 InvokeModel API"}],"a":["B"],"e":"**正确答案：B。** 替换为预置模型 ARN。\n\n**为什么对：**代码使用Foundation Model（基础模型）标识符将流量路由到按需容量池。Provisioned Throughput（预置吞吐量）附加到通过 API 创建的特定预置资源 ARN，须在 modelId 参数中引用该 ARN 才能使用预留容量。替换后流量正确导向预置资源，模型单元提供工作时间所需一致吞吐量，预置容量不再闲置，按需路径节流消除。\n\n**其他选项为什么错：**\n- A.增加模型单元：不解决根本问题，应用未使用预置资源\n- C.退避重试：增加Latency（延迟）且仍浪费预置容量，不保证一致吞吐\n- D.切换流式 API：改变投递机制但不影响容量路由和配额\n\n**关键概念：**预置吞吐量 ARN 代表预留容量，须在 modelId 中引用该 ARN 而非基础模型 ID，否则请求路由到按需路径而非预置资源。","s":"源#266"},{"id":"D4-021","d":4,"t":"single","q":"某金融企业开发 GenAI 应用同时服务高级和标准客户，使用 API Gateway REST API 后的 Lambda 处理请求。须根据客户层级动态切换 AI 模型，且在不重新部署代码的情况下对新功能做 A/B 测试。还须在应用变更前验证模型参数（如 temperature 和最大 Token 限制）。哪项方案以最少运维开销满足需求？","o":[{"l":"A","t":"为每个配置创建 Systems Manager Parameter Store 参数。用 Lambda 轮询参数更新。用 EventBridge 触发重新部署"},{"l":"B","t":"将模型配置存入 DynamoDB。按客户层级检索配置。Lambda 每次请求开始时查询"},{"l":"C","t":"用 AppConfig 管理模型配置。用功能标志做 A/B 测试。为模型参数定义 JSON 模式验证。Lambda 通过 AppConfig Agent 检索配置"},{"l":"D","t":"创建 ElastiCache 集群存储配置。设较短 TTL。在 Lambda 中运行自定义验证逻辑。用 CloudWatch 监控"}],"a":["C"],"e":"**正确答案：C。** AppConfig+功能标志+JSON 验证+AppConfig Agent。\n\n**为什么对：**AppConfig 专为动态应用配置管理设计，集中管理模型选择、推理参数和客户层级路由，无需重新部署 Lambda。功能标志支持 A/B 测试逐步推送变更。JSON 模式验证在应用前校验 temperature、Token 限制等参数防止无效配置。AppConfig Agent 提供内置缓存和轮询机制高效检索配置，Latency（延迟）最小。\n\n**其他选项为什么错：**\n- A.Parameter Store+轮询+EventBridge：引入不必要的重新部署逻辑和轮询复杂性\n- B.DynamoDB：需自定义配置访问模式，不原生支持功能标志或模式验证\n- D.ElastiCache：需管理集群和自定义验证逻辑，运维开销高\n\n**关键概念：**AppConfig 管理动态模型配置，功能标志支持 A/B 测试，JSON 模式验证确保参数安全，Agent 内置缓存低延迟检索。","s":"源#267"},{"id":"D4-022","d":4,"t":"single","q":"某零售企业使用 Bedrock 开发客服 AI 助手。分析显示 70% 咨询为简单产品问题可由较小模型高效处理，30% 为复杂退换货政策问题需高级推理能力。企业须实施经济高效的模型选择框架，按咨询复杂度自动路由到合适模型，保持较高客户满意度并最小化响应延迟。哪项方案以最少实施工作量满足需求？","o":[{"l":"A","t":"创建多阶段架构用小型 FM 对咨询分类。简单咨询路由到小模型，复杂咨询路由到大模型。用 Lambda 处理路由逻辑"},{"l":"B","t":"使用 Bedrock 智能提示路由自动分析咨询。简单产品咨询路由到小模型，复杂退换货咨询路由到大型模型"},{"l":"C","t":"实现单模型方案用 Bedrock 中型 FM 配合按需定价。在提示中包含特殊指令处理简单和复杂咨询"},{"l":"D","t":"为简单和复杂咨询创建独立 Bedrock 端点。实现基于关键词检测的规则路由。小模型用按需定价，大模型用预置吞吐量"}],"a":["B"],"e":"**正确答案：B。** Bedrock 智能提示路由。\n\n**为什么对：**智能提示路由自动分析传入提示并按复杂度选择最合适的 FM，无需自定义分类逻辑或编排代码。70% 简单咨询路由到小成本模型降低推理成本和Latency（延迟），30% 复杂咨询路由到大型模型保持响应质量。路由由 Bedrock 内联处理，相比多阶段架构减少额外分类调用，响应延迟更低。实施工作量最少。\n\n**其他选项为什么错：**\n- A.多阶段+Lambda 路由：引入额外推理步骤和自定义逻辑，实施工作量大\n- C.单中型模型+按需：为所有咨询过度使用中型模型增加成本\n- D.独立端点+关键词规则：规则脆弱且端点管理增加运维开销\n\n**关键概念：**Bedrock 智能提示路由自动按提示复杂度选择模型，无需自定义分类逻辑，实现成本效率和响应质量平衡。","s":"源#268"},{"id":"D4-023","d":4,"t":"single","q":"某医疗机构开发处理医疗咨询的应用。须以高准确性回答复杂查询、降低语义稀释、引用医疗文档中的领域术语以减少歧义，且每分钟响应 1000 个查询、延迟低于 2 秒。哪项方案以最少运维开销满足需求？","o":[{"l":"A","t":"用 API Gateway 将查询路由到 Bedrock 代理。配置代理用 Claude 分解查询、用 Titan 扩展查询。创建知识库存放医疗文档"},{"l":"B","t":"配置 Bedrock 知识库存放医疗文档。在知识库中启用查询分解。配置使用 FM 和知识库的 Bedrock Flows 支持应用"},{"l":"C","t":"用 SageMaker AI 托管自定义 ML 模型做查询分解和扩展。配置知识库存放文档。对文档加密"},{"l":"D","t":"创建 Bedrock 代理编排多个 Lambda 分解查询。创建知识库存放文档。用代理内置知识库功能。添加深度研究推理能力"}],"a":["B"],"e":"**正确答案：B。** Knowledge Bases（知识库）+查询分解+Bedrock Flows。\n\n**为什么对：**知识库通过摄取医疗文档、分块、生成嵌入并运行时检索相关段落，直接满足领域术语引用和减少歧义需求。查询分解将复杂医疗查询拆分为更有针对性的子查询，提高检索精度和召回率。Bedrock Flows 托管编排多步骤工作流（预处理、检索、调用 FM、格式化），无需维护自定义状态机或多个 Lambda。全部在 Bedrock 托管功能内，运维开销最小。\n\n**其他选项为什么错：**\n- A.代理+API Gateway+多模型：增加配置和运行时复杂性\n- C.SageMaker AI 自定义模型：增加托管扩展和运维负担\n- D.代理+多 Lambda：多个自定义组件增加编排复杂性\n\n**关键概念：**Bedrock 知识库提供领域文档检索，查询分解降低语义稀释，Flows 托管编排多步骤工作流无需自定义状态机。","s":"源#269"},{"id":"D4-024","d":4,"t":"single","q":"某企业推荐系统运行在 EC2 实例上，调用 Bedrock FM 的 API 分析客户行为并生成个性化商品推荐。系统出现间歇性问题——部分推荐与客户偏好不符。企业须建立可观测性方案监控运维指标并检测相对已建立基线的性能退化模式，当 FM 行为偏离预期时在 10 分钟内生成含相关性数据的告警。哪项方案可满足需求？","o":[{"l":"A","t":"配置 CloudWatch Container Insights。设延迟阈值告警。用嵌入式指标格式添加 Token 自定义指标。创建仪表板"},{"l":"B","t":"实施 X-Ray 跟踪请求组件。启用 CloudWatch Logs Insights 检测错误模式。设 CloudTrail 监控 Bedrock API 调用。在 QuickSight 创建仪表板"},{"l":"C","t":"启用 CloudWatch Application Insights。用嵌入式指标格式创建推荐质量、Token 使用和响应延迟自定义指标含请求类型和用户分段维度。配置 CloudWatch 异常检测。用 Logs Insights 做模式分析"},{"l":"D","t":"用带可观测性插件的 OpenSearch Service。通过 Kinesis 摄取指标和日志。创建自定义 PPL 查询分析行为模式。建立运维仪表板"}],"a":["C"],"e":"**正确答案：C。** Application Insights+嵌入式指标+异常检测+Logs Insights。\n\n**为什么对：**Application Insights 自动分析 EC2 工作负载的指标日志事件识别异常模式。嵌入式指标格式发布推荐质量、Token 使用和响应Latency（延迟）自定义指标，添加请求类型和用户分段维度实现精细关联。CloudWatch 异常检测为时间Sequence（序列）自动建模正常行为基线并标记偏差，几分钟内触发告警满足 10 分钟要求。Logs Insights 补充指标分析日志模式识别推荐质量下降根因。\n\n**其他选项为什么错：**\n- A.Container Insights：侧重基础设施指标，缺乏行为基线化\n- B.X-Ray+CloudTrail+QuickSight：提供跟踪但不提供自动异常检测\n- D.OpenSearch+Kinesis：增加摄取复杂性和运维开销\n\n**关键概念：**Application Insights 自动监控 EC2 应用健康，嵌入式指标格式发布 FM 行为自定义指标，CloudWatch 异常检测自动建模基线并在 10 分钟内触发告警。","s":"源#270"},{"id":"D4-025","d":4,"t":"single","q":"某企业开发三个专用 NLP 模型支撑客服应用：一个对客户具体问题分类，一个从互动中提取关键信息，一个生成响应。须确保所有任务达 95% 以上准确率，处理最多 500 个并发请求并在每日 2 小时高峰期内 500 毫秒内响应，同时在非高峰低需求期间优化资源使用。哪项方案可满足需求？","o":[{"l":"A","t":"将三个模型部署到单个 SageMaker 多模型端点。启用动态扩展。用计算优化型实例。基于调用指标自动扩展"},{"l":"B","t":"将每个模型部署到独立 SageMaker Serverless Inference 端点。设预置并发处理峰值。按各模型需求配置最大并发和内存"},{"l":"C","t":"用带预置吞吐量的 Bedrock 部署模型。按预期 Token 吞吐量配置模型单元。为每个模型实施请求批处理"},{"l":"D","t":"将每个模型部署到独立 SageMaker 端点。用异步推理配置。将请求响应存入 S3。用 SNS 发送告警"}],"a":["B"],"e":"**正确答案：B。** SageMaker Serverless Inference+预置并发。\n\n**为什么对：**Serverless Inference 专为间歇性或突发流量设计，按请求数自动扩缩，无流量时缩减到零满足低需求期间优化资源。预置并发保持指定数量执行环境预热就绪，避免Cold Start（冷启动）Latency（延迟）满足高峰期 500 毫秒响应要求。按各模型需求独立配置最大并发和内存，避免多模型端点的嘈杂邻居问题。在 Serverless 成本效益和预置实例性能可预测性间取得平衡。\n\n**其他选项为什么错：**\n- A.多模型端点：可能引入嘈杂邻居问题和延迟峰值\n- C.Bedrock Provisioned Throughput（预置吞吐量）+批处理：批处理增加延迟不满足 500 毫秒要求\n- D.异步推理：为长时间运行工作负载设计，无法满足 500 毫秒要求\n\n**关键概念：**SageMaker Serverless Inference 按需扩缩到零优化低需求期资源，预置并发消除冷启动满足高峰 500 毫秒延迟要求。","s":"源#271"},{"id":"D4-026","d":4,"t":"single","q":"某企业开发基于 Bedrock FM 的 GenAI 应用，含多个自定义工具集成。尽管用户流量稳定，应用遭遇意外 Token 消耗激增。企业须用 Bedrock 模型调用日志记录监控 InputTokenCount 和 OutputTokenCount 指标，检测工具使用中的异常模式并识别哪些工具集成导致异常消耗。方案须随流量模式变化自动调整阈值。哪项方案可满足需求？","o":[{"l":"A","t":"用 CloudWatch Logs 捕获调用日志。为 Token 指标创建仪表板。为每个工具配置固定阈值静态告警"},{"l":"B","t":"将调用日志存入 S3。用 Glue 和 Athena 分析 Token 使用趋势"},{"l":"C","t":"用 CloudWatch Logs 捕获调用日志。创建指标过滤器提取工具特定调用模式。为每个工具的 Token 指标应用自动调整基线的异常检测告警"},{"l":"D","t":"将调用日志存入 S3。用 Lambda 实时处理日志。根据 Lambda 识别的趋势手动更新告警阈值"}],"a":["C"],"e":"**正确答案：C。** CloudWatch Logs+指标过滤器+异常检测告警。\n\n**为什么对：**调用日志直接发送到 CloudWatch Logs 含 InputTokenCount、OutputTokenCount 和工具调用元数据。指标过滤器从日志中提取工具特定的 Token 消耗模式，按工具隔离识别异常来源。CloudWatch 异常检测基于历史流量模式自动建模基线和动态阈值，随使用模式变化自适应调整，无需手动调阈值。全部使用托管服务，运维开销最小。\n\n**其他选项为什么错：**\n- A.固定阈值静态告警：无法适应变化的流量模式\n- B.Glue+Athena：批量分析引入Latency（延迟），非实时监控\n- D.Lambda+S3+手动阈值：需自定义代码和手动干预，维护负担高\n\n**关键概念：**CloudWatch 指标过滤器从调用日志提取工具特定 Token 模式，异常检测自动建模基线并随流量变化动态调整阈值实现自适应告警。","s":"源#272"},{"id":"D4-027","d":4,"t":"single","q":"某企业使用 Bedrock 开发 AI 应用，FM 支持跨区域推理和预置吞吐量。须为欧洲和北美用户提供持续低延迟服务，且遵守数据驻留法规确保欧洲用户数据留在欧洲区域。测试中区域流量达服务配额时出现服务降级。企业须保持应用弹性并最小化运维复杂性。哪项方案可满足需求？","o":[{"l":"A","t":"在北美和欧洲部署独立 Bedrock 实例。用自定义路由层按用户位置引导流量。用 CloudWatch 告警和 SNS 通知"},{"l":"B","t":"用 Bedrock 跨区域推理配置文件，调用 InvokeModel 时在配置文件 ID 中指定地理代码。配置独立 API Gateway HTTP API 将欧洲和北美用户引导到相应区域端点"},{"l":"C","t":"部署多区域 API Gateway 和 Lambda 实现重试逻辑。在达配额时调用次区域 FM"},{"l":"D","t":"在多区域配置 Bedrock 预置吞吐量。在应用代码中实现故障转移逻辑。用 Global Accelerator 路由流量"}],"a":["B"],"e":"**正确答案：B。** Cross-Region Inference（跨区域推理）配置文件+地理代码+独立 API Gateway。\n\n**为什么对：**跨区域推理配置文件在定义的区域边界内将请求分布到多个区域，在配置文件 ID 中指定地理代码确保欧洲数据仅在欧洲处理满足驻留法规。流量激增或达配额时 Bedrock 自动路由到同地理区域内健康区域提高可用性。独立 API Gateway 为欧洲和北美提供简单路由层引导到相应配置文件，避免自定义故障转移逻辑，运维复杂性最低。\n\n**其他选项为什么错：**\n- A.自定义路由层+手动监控：增加复杂性，不提供自动弹性\n- C.多区域 Lambda 重试：配置不当可能违反Data Residency（数据驻留）要求\n- D.应用级故障转移+Global Accelerator：大量应用代码和运维负担\n\n**关键概念：**跨区域推理配置文件在地理边界内自动分布请求保障驻留合规和弹性，独立 API Gateway 提供简单区域路由无需自定义逻辑。","s":"源#273"},{"id":"D4-028","d":4,"t":"multiple","q":"某企业在多个业务部门部署了基于 Bedrock 的 GenAI 应用，用于客服、内容生成和文档分析。部分应用出现不可预测的 Token 消耗模式。企业须建立全面可观测性方案，提供跨多模型 Token 使用模式的实时可见性，支持为多类利益相关者创建自定义仪表板，并为所有 FM 提供 Token 消耗告警能力。哪组方案组合以最少运维开销满足需求？（选择两项）","o":[{"l":"A","t":"用 CloudWatch 指标作为数据源，创建 QuickSight 仪表板显示跨 FM Token 使用趋势"},{"l":"B","t":"用 CloudWatch Logs Insights 分析调用日志中 Token 消耗模式。创建自定义查询识别高使用场景。向仪表板添加日志小部件"},{"l":"C","t":"创建自定义 CloudWatch 仪表板结合 Bedrock 原生 Token 和调用指标。设置 CloudWatch 告警监控 Token 阈值"},{"l":"D","t":"通过 Bedrock 零 ETL 集成与 Managed Grafana，创建显示 FM Token 使用趋势和模式的仪表板"},{"l":"E","t":"实施 EventBridge 规则捕获调用事件。通过 Data Firehose 路由到 OpenSearch Serverless。用 OpenSearch 仪表板分析"}],"a":["C","D"],"e":"**正确答案：C、D。**\n\n**为什么对：**\n- C.CloudWatch 仪表板+原生指标+告警：Bedrock 发布内置 CloudWatch 指标用于调用和 Token 使用，直接利用无需额外数据管道构建集中仪表板，CloudWatch 告警提供基于阈值的 Token 消耗告警\n- D.Managed Grafana 零 ETL 集成：零 ETL 集成使 Bedrock 和 CloudWatch 指标直接在 Grafana 可视化，无需构建摄取管道，Grafana 仪表板适合为不同受众（工程、财务、产品）定制视图\n\n**其他选项为什么错：**\n- A.QuickSight 仪表板：更适合历史分析而非实时运维监控\n- B.Logs Insights 查询：需查询维护，不高效提供大规模实时仪表板\n- E.EventBridge+Firehose+OpenSearch：多服务和自定义数据流显著增加运维开销\n\n**关键概念：**CloudWatch 原生指标配合自定义仪表板和告警提供实时监控，Managed Grafana 零 ETL 集成实现针对不同利益相关者的定制化可视化。","s":"源#274"},{"id":"D4-029","d":4,"t":"single","q":"某企业推荐系统基于 EC2 实例运行，通过调用 Bedrock FM 的 API 分析客户行为并生成个性化商品推荐。系统间歇性出现部分推荐与客户偏好不匹配的问题。企业须建立可观测性方案监控运维指标并检测相对已建立基线的性能退化模式，当 FM 行为偏离预期时在 10 分钟内生成含相关性数据的告警。哪项方案可满足需求？","o":[{"l":"A","t":"配置 CloudWatch Container Insights。设延迟阈值告警。用嵌入式指标格式添加 Token 自定义指标"},{"l":"B","t":"实施 X-Ray 跟踪请求组件。启用 CloudWatch Logs Insights。设 CloudTrail 并在 QuickSight 创建仪表板"},{"l":"C","t":"启用 CloudWatch Application Insights。用嵌入式指标格式创建推荐质量、Token 使用和响应延迟自定义指标含请求类型和用户分段维度。配置异常检测。用 Logs Insights 做模式分析"},{"l":"D","t":"用带可观测性插件的 OpenSearch Service。通过 Kinesis 摄取指标和日志。用自定义查询分析行为模式"}],"a":["C"],"e":"**正确答案：C。** Application Insights+嵌入式指标+异常检测+Logs Insights。\n\n**为什么对：**Application Insights 为 EC2 应用提供自动可观测性识别异常行为模式。嵌入式指标格式发布推荐质量、Token 使用和响应Latency（延迟）自定义指标，添加请求类型和用户分段维度实现精细关联。CloudWatch 异常检测从历史数据建立动态基线自动检测偏差，几分钟内触发告警满足 10 分钟要求。Logs Insights 快速分析日志模式识别推荐质量下降根因。指标日志告警关联直接且运维高效。\n\n**其他选项为什么错：**\n- A.Container Insights：侧重基础设施指标，缺乏行为基线化和自动异常检测\n- B.X-Ray+CloudTrail+QuickSight：提供跟踪但不提供自动异常检测\n- D.OpenSearch+Kinesis：增加摄取复杂性和运维开销\n\n**关键概念：**Application Insights 自动监控 EC2 应用健康，嵌入式指标格式发布 FM 行为自定义指标，CloudWatch 异常检测自动建模基线并在 10 分钟内告警。","s":"源#275"},{"id":"D4-030","d":4,"t":"single","q":"某企业使用 Bedrock 为客户查询提供实时响应的 GenAI 应用。高峰流量期间对 FM 的 API 调用出现间歇性失败。企业须实现方案处理瞬态错误并为 FM 性能提供详细可观测性，防止限流期间级联故障，提供跨服务边界分布式跟踪以识别延迟贡献因素，且能将性能问题与特定 FM 特征关联。哪项方案可满足需求？","o":[{"l":"A","t":"实现自定义重试机制固定 1 秒间隔。配置 CloudWatch 告警监控错误率和延迟"},{"l":"B","t":"配置 SDK 标准重试模式带抖动指数退避。用 X-Ray 跟踪配合注释识别和过滤服务组件"},{"l":"C","t":"实现所有 FM 响应客户端缓存。在应用代码中添加自定义日志记录调用时长"},{"l":"D","t":"配置 SDK 自适应重试模式。用 CloudTrail 分布式跟踪监控限流事件"}],"a":["B"],"e":"**正确答案：B。** SDK 标准重试+抖动退避+X-Ray 跟踪+注释。\n\n**为什么对：**SDK 标准重试模式提供抖动指数退避，减少同步重试风暴防止级联故障，是 AWS 推荐的瞬态限流失效处理方式。X-Ray 提供分布式跟踪，跟踪请求通过组件和应用服务到 Bedrock 调用，识别Latency（延迟）引入位置和下游贡献最大的调用。X-Ray 注释用模型 ID、推理参数和区域标注跟踪，实现按 FM 特征过滤分析延迟和错误模式，无需单独遥测系统。\n\n**其他选项为什么错：**\n- A.固定 1 秒重试：同步重试行为不提供分布式跟踪\n- C.客户端缓存+自定义日志：不防止级联故障，无跨服务跟踪\n- D.SDK 自适应+CloudTrail：CloudTrail 为审计日志非分布式跟踪，不提供延迟分析\n\n**关键概念：**SDK 标准重试抖动退避防止级联故障，X-Ray 分布式跟踪识别延迟贡献因素，注释实现按 FM 特征关联性能问题。","s":"源#276"},{"id":"D4-031","d":4,"t":"single","q":"某企业处理客服工单，希望通过 Bedrock 集成 AI 情感分析和自动回复生成。须优先处理紧急问题，将初始响应时间相比手动回复降低 40%。方案须处理 100 个并发 webhook 请求，响应低于 500 毫秒，跨多区域保持 99.9% 可用性并验证所有请求身份。企业不希望修改现有基础设施（含多种 webhook 认证方式的多个工单系统），且须支持高峰期偶尔达 25 万日工单的扩展。哪项方案可满足需求？","o":[{"l":"A","t":"用带 Regional 端点的 API Gateway REST API 接收 webhook 并调用 Lambda。配置 Lambda 授权器验证所有认证方式。Lambda 调用 Bedrock 做情感分析和生成响应。结果存入 DynamoDB 全局表提供多区域可用性"},{"l":"B","t":"为每个工单系统创建 Lambda 函数 URL。用 NONE 认证类型。独立 Lambda 用 HMAC 验证签名。部署多区域用 Global Accelerator 路由。用 Bedrock 做分析和生成"},{"l":"C","t":"在各区域设 SQS 队列接收 webhook。用 SQS 调用 Lambda，调用 Comprehend 做情感分析，Lex 生成响应。用 EventBridge 重试传递"},{"l":"D","t":"部署多区域 AppSync GraphQL API。配置 API 令牌验证。创建变更解析器发布到 EventBridge。EventBridge 调用 Lambda 用 Bedrock 分析生成。用 CloudFront 降低延迟"}],"a":["A"],"e":"**正确答案：A。** API Gateway+Lambda 授权器+Bedrock+DynamoDB 全局表。\n\n**为什么对：**API Gateway Regional 端点处理高并发 webhook 请求（100+），Lambda 授权器集中评估多种认证方式防止未授权流量。Lambda 和 Bedrock 集成提供工单激增（25 万日）的可扩展性。DynamoDB 全局表跨多区域存储结果确保 99.9% 可用性和最小Latency（延迟）访问。无需修改现有基础设施，Lambda 授权器统一处理多种 webhook 认证。\n\n**其他选项为什么错：**\n- B.NONE 认证+HMAC：安全性较低，NONE 认证类型风险高\n- C.SQS 队列：引入队列延迟可能超过 500 毫秒目标\n- D.AppSync+EventBridge+CloudFront：复杂架构增加运维开销\n\n**关键概念：**API Gateway Lambda 授权器集中验证多种 webhook 认证方式，DynamoDB 全局表提供多区域 99.9% 可用性，Bedrock 处理高峰扩展。","s":"源#277"},{"id":"D4-032","d":4,"t":"single","q":"某大型电商企业部署 FM 生成产品描述。工程团队通过 CloudWatch 监控 Token 用量、延迟和错误率等技术指标。营销团队在自有系统中跟踪转化率和收入影响等业务指标。企业须建立统一可观测性方案将技术性能与业务结果关联，当运维指标显示性能下滑时自动向利益相关方发出告警，并提供跨技术与业务指标的全面可见性。哪项方案可满足需求？","o":[{"l":"A","t":"创建含技术指标和导入业务指标的 CloudWatch 仪表板。配置复合告警结合技术数据和业务数据。用 SNS 通知利益相关者"},{"l":"B","t":"用 Managed Grafana 可视化 CloudWatch 技术指标和外部业务指标。配置 Grafana 告警调用 Lambda 自动修复"},{"l":"C","t":"通过 CloudWatch 指标流将指标流式传输到 S3。创建 QuickSight 仪表板可视化组合指标。设 EventBridge 规则发通知"},{"l":"D","t":"配置集成运维指标与导入业务指标的 CloudWatch 自定义仪表板。设置带异常检测的 CloudWatch 复合告警。用 SNS 创建告警操作在关联指标指示问题时通知利益相关者"}],"a":["D"],"e":"**正确答案：D。** CloudWatch 自定义仪表板+复合告警+异常检测+SNS。\n\n**为什么对：**将业务指标导入 CloudWatch 后构建统一视图将系统健康与转化表现并排展示。复合告警仅在多条件同时满足时（如高Latency（延迟）加转化率下滑）通知，减少告警疲劳。异常检测对 GenAI 工作负载至关重要——性能基线可能微妙变化，CloudWatch 自动发现偏差并通过 SNS 触发告警。运维复杂性低于管理外部可视化服务器或多服务分析管道。\n\n**其他选项为什么错：**\n- A.复合告警无异常检测：缺乏自动基线建模，告警依赖静态阈值\n- B.Managed Grafana+Lambda 自动修复：需管理外部可视化服务器和自定义修复逻辑\n- C.CloudWatch 指标流+S3+QuickSight：多服务分析管道运维复杂性高\n\n**关键概念：**CloudWatch 自定义仪表板统一技术和业务指标，复合告警多条件关联减少告警疲劳，异常检测自动发现基线偏差并通过 SNS 通知。","s":"源#278"},{"id":"D4-033","d":4,"t":"single","q":"一家金融服务公司使用 AI 应用程序通过 Amazon Bedrock 处理财务文档。工作时间内，应用程序每小时处理约 10,000 个请求，需要稳定的吞吐量（Throughput）。该公司通过 CreateProvisionedModelThroughput API 购买了预置吞吐量（Provisioned Throughput）。Amazon CloudWatch 指标显示：按需请求被限流（Throttled）的同时，预置容量却处于空闲状态。该公司在应用程序代码中发现如下调用：\nResponse=bedrock_runtime.invoke_model(modelId=\"anthropic.claude-v2\", body=json.dumps(payload))\n该公司需要让应用程序使用已购买的预置吞吐量，从而解决限流问题。以下哪种方案能满足该需求？","o":[{"l":"A","t":"增加预配置吞吐量配置中的模型单元 (MU) 数量。"},{"l":"B","t":"将模型 ID 参数替换为 CreateProvisionedModelThroughput API 返回的预配置模型的 ARN。"},{"l":"C","t":"添加指数退避重试逻辑以处理高峰时段的限制异常。"},{"l":"D","t":"修改应用程序以使用 invokeModelWithResponseStream API 而不是 invokeModel API。"}],"a":["B"],"e":"**正确答案：B。** 将 modelId 参数替换为预置模型的 ARN，即可让请求路由到已购买的预置吞吐量。\n\n**为什么对：** 在 Amazon Bedrock 中，预置吞吐量绑定在通过 CreateProvisionedModelThroughput API 创建的专用资源上。只有当推理请求的 modelId 指向该预置资源的 ARN 时，流量才会使用预留容量。当前代码使用的 anthropic.claude-v2 是按需模型标识符，所有请求都被路由到按需容量池，因此预置容量空闲而按需请求被限流。\n\n**其他选项为什么错：**\n- A. 增加模型单元（MU）数量：问题根因在于请求未指向预置资源，增加 MU 不会改变路由行为。\n- C. 添加指数退避重试逻辑：重试只能缓解限流的影响，不能解决请求未使用预置吞吐量的根本问题。\n- D. 改用 InvokeModelWithResponseStream API：切换为流式响应 API 不影响请求路由到按需还是预置容量。\n\n**关键概念：** Amazon Bedrock 预置吞吐量需要在 modelId 中显式指定预置模型 ARN，否则请求默认走按需通道。","s":"源#279"},{"id":"D4-034","d":4,"t":"single","q":"一家金融服务公司通过 Amazon Bedrock 将多个基础模型（Foundation Model, FM）用于其生成式 AI 应用程序。为满足敏感财务数据使用方面的新合规要求，该公司需要一套令牌（Token）管理方案。该方案必须在应用程序接近特定模型的令牌上限时主动告警，还必须每分钟处理超过 5,000 个请求，并维护令牌使用指标以便在各业务部门之间分摊成本。以下哪种方案能满足这些需求？","o":[{"l":"A","t":"在 AWS Lambda 函数中开发特定于模型的标记器。将 Lambda 函数配置为在向 Amazon Bedrock 发送请求之前估计令牌使用情况。配置 Lambda 函数以将指标发布到 Amazon CloudWatch 并在请求接近阈值时触发警报。将详细的令牌使用情况存储在 Amazon DynamoDB 中以报告成本。"},{"l":"B","t":"使用令牌配额策略实施 Amazon Bedrock Guardrails。捕获被拒绝请求的指标。配置 Amazon EventBridge 规则以根据 Amazon Bedrock Guardrails 指标触发通知。使用 Amazon CloudWatch 仪表板可视化跨模型的令牌使用趋势。"},{"l":"C","t":"为失败的请求部署 Amazon SQS 死信队列。配置 AWS Lambda 函数来分析与令牌相关的故障。使用 Amazon CloudWatch Logs Insights 根据 Amazon Bedrock API 响应的错误日志生成有关令牌使用模式的报告。"},{"l":"D","t":"使用 Amazon API Gateway 为所有 Amazon Bedrock API 调用创建代理。根据具有预定义令牌配额的自定义使用计划配置请求限制。配置 APIGateway 以拒绝超出令牌限制的请求。"}],"a":["A"],"e":"**正确答案：A。** 在 AWS Lambda 中实现特定于模型的分词器，在请求发送至 Amazon Bedrock 之前估算令牌用量，并通过 CloudWatch 告警与 DynamoDB 实现成本分摊。\n\n**为什么对：** Amazon Bedrock 在调用后会暴露令牌使用指标，但本身不提供跨应用或业务部门的主动令牌限制。在 Lambda 中运行特定模型的分词器可以在请求发送前估算输入/输出令牌数，从而实现主动拦截或截断。将令牌指标发布到 Amazon CloudWatch 可实现大规模实时监控和基于阈值的告警。将详细令牌用量存入 DynamoDB 则为按部门分摊成本提供了可审计的数据基础。\n\n**其他选项为什么错：**\n- B. 使用 Bedrock Guardrails 的令牌配额策略：Guardrails 主要用于内容安全过滤，不提供针对令牌限额的主动告警和细粒度分摊功能。\n- C. 部署 SQS 死信队列分析失败请求：这是被动的事后分析，无法在令牌接近上限时主动告警。\n- D. 通过 API Gateway 设置使用计划和请求限制：API Gateway 按请求数量限流，无法感知或管理令牌级别的配额。\n\n**关键概念：** 对于需要主动、细粒度令牌管控的场景，应在调用前通过自定义分词器估算令牌数，并配合 CloudWatch 告警实现预警。","s":"源#280"},{"id":"D4-035","d":4,"t":"single","q":"一家公司正在开发基于 Amazon Bedrock 基础模型的生成式 AI 应用程序，该应用集成了多个自定义工具。尽管用户流量保持稳定，令牌消耗却出现了意外激增。该公司需要使用 Amazon Bedrock 模型调用日志（Model Invocation Logging）监控 InputTokenCount 和 OutputTokenCount 指标，检测各工具使用中的异常模式，识别哪些工具集成导致了异常令牌消耗，并且方案必须能随流量模式变化自动调整告警阈值。以下哪种方案能满足这些需求？","o":[{"l":"A","t":"使用 Amazon CloudWatch Logs 捕获模型调用日志。为令牌指标创建 CloudWatch 控制面板。为每个工具集成配置具有固定阈值的静态 CloudWatch 警报。"},{"l":"B","t":"将模型调用日志存储在 Amazon S3 中。使用 AWS Glue 和 Amazon Athena 分析令牌使用趋势。"},{"l":"C","t":"使用 Amazon CloudWatch Logs 捕获模型调用日志。创建 CloudWatch 指标筛选器 提取特定于工具的调用模式。应用 CloudWatch 异常检测警报，自动调整每个工具的令牌指标的基线。"},{"l":"D","t":"将模型调用日志存储在 Amazon S3 存储桶中。使用 AWS Lambda 实时处理日志。根据 Lambda 函数识别的趋势手动更新 CloudWatch 警报阈值。"}],"a":["C"],"e":"**正确答案：C。** 通过 CloudWatch Logs 采集日志、指标筛选器提取工具级令牌指标、CloudWatch 异常检测自动调整基线，三者组合实现自适应监控。\n\n**为什么对：** Amazon Bedrock 模型调用日志可直接发送到 CloudWatch Logs，其中包含每次请求的 InputTokenCount、OutputTokenCount 及工具调用元数据。CloudWatch 指标筛选器能从日志中提取结构化指标，为每个工具集成创建独立筛选器即可隔离令牌消耗来源。CloudWatch 异常检测基于历史流量自动建模基线并生成动态阈值，无需手动维护，满足随流量模式变化自动调整的要求。\n\n**其他选项为什么错：**\n- A. 使用 CloudWatch Logs + 固定阈值静态告警：固定阈值无法随流量变化自动调整，违背题目要求。\n- B. 日志存储至 S3 后用 Glue + Athena 分析：属于批量分析，无法实现近实时检测，也不具备自动阈值调整能力。\n- D. 用 Lambda 实时处理日志并手动更新告警阈值：手动更新阈值运维开销大，不具备自适应能力。","s":"源#281"},{"id":"D4-036","d":4,"t":"single","q":"一家公司正在使用 Amazon Bedrock 和 Anthropic Claude 3 Haiku 开发 AI 助手。该助手日常每小时处理约 10,000 个请求，高峰期可激增至 30,000 个。AI 助手需跨多个 AWS 区域运行并在 2 秒内响应。公司发现高峰期出现吞吐量瓶颈，导致延迟升高和偶发的请求超时。以下哪种方案能解决该性能问题？","o":[{"l":"A","t":"在单个区域中购买预配置吞吐量和足够的模型单元 (MU)。配置应用程序以使用指数退避重试失败的请求。"},{"l":"B","t":"实施令牌批处理以减少 API 开销。使用跨区域推理配置文件在可用区域之间自动分配流量。"},{"l":"C","t":"在每个区域中设置自动扩展 AWS Lambda 函数。实现客户端循环请求分发。购买一个预配置吞吐量的模型单元 (MU) 作为备份。"},{"l":"D","t":"使用跨多个区域的 Amazon S3 存储桶对所有请求实施批量推理。使用 Amazon SQS 设置异步检索流程。"}],"a":["B"],"e":"**正确答案：B。** 通过令牌批处理减少 API 开销，并使用跨区域推理配置文件（Cross-Region Inference Profile）在可用区域间自动分配流量。\n\n**为什么对：** Amazon Bedrock 支持跨区域推理配置文件，允许应用程序将推理请求透明路由到多个 AWS 区域。高峰期流量自动分配到有可用容量的区域，减少限流和超时风险。令牌批处理将多个推理请求合并为单次模型调用，降低 API 开销并提高吞吐效率。两者结合可在不增加预置容量固定成本的前提下解决峰值瓶颈。\n\n**其他选项为什么错：**\n- A. 在单区域购买预置吞吐量 + 指数退避重试：单区域容量有上限，退避重试会增加延迟，无法从根本上解决跨区域高峰瓶颈。\n- C. 每区域部署 Lambda + 客户端轮询分发：客户端轮询无法感知各区域实时容量，且只购买一个 MU 的预置吞吐量不足以应对高峰流量。\n- D. 使用 S3 + SQS 实现批量推理：批量推理是异步模式，不满足 2 秒实时响应要求。","s":"源#282"},{"id":"D4-037","d":4,"t":"single","q":"一家公司正在开发一款生成式 AI 应用程序，用于实时分析客户服务通话并为人工坐席生成建议回复。该应用必须在高峰时段处理 500,000 个并发调用，每条建议的端到端延迟低于 200 毫秒。公司已有转录客户通话音频流的架构。应用不得超出预定义的月度计算预算，并且必须保持自动扩展能力。以下哪种方案能满足这些需求？","o":[{"l":"A","t":"在 Amazon Bedrock 上部署大型、复杂的推理模型。购买预配置吞吐量并优化批处理。"},{"l":"B","t":"在 Amazon Bedrock 上部署低延迟、实时优化的模型。购买预配置吞吐量并设置自动扩展策略。"},{"l":"C","t":"在使用专用 GPU 实例的 Amazon SageMaker 实时终端节点上部署大型语言模型 (LLM)。"},{"l":"D","t":"在针对批处理进行优化的 Amazon SageMaker 无服务器终端节点上部署中型语言模型。"}],"a":["B"],"e":"**正确答案：B。** 在 Amazon Bedrock 上部署低延迟、实时优化的模型，购买预置吞吐量并设置自动扩展策略。\n\n**为什么对：** Amazon Bedrock 提供专为实时推理优化的基础模型，能以极低的单请求开销处理超高请求速率。购买预置吞吐量可保留足够的模型容量来承载 500,000 并发调用的峰值负载，消除冷启动并减少排队。自动扩展策略在非高峰时段按需缩减容量，确保成本可控且不超出月度预算。\n\n**其他选项为什么错：**\n- A. 部署大型复杂推理模型 + 预置吞吐量：大型模型推理延迟高，难以在 200 毫秒内完成响应。\n- C. 在 SageMaker 实时端点上部署 LLM：需自行管理 GPU 实例的扩缩容，运维开销大，且难以在 200 毫秒内稳定响应。\n- D. 在 SageMaker 无服务器端点上部署中型模型并优化批处理：无服务器端点存在冷启动延迟，批处理优化不适合实时低延迟场景。","s":"源#283"},{"id":"D4-038","d":4,"t":"single","q":"一家金融服务公司需要构建一个使用 Amazon Bedrock 处理季度报告的文档分析系统。系统需对财务数据进行分析、执行情绪分析并验证合规性。每批包含 5 份报告，每份报告需要多次基础模型（FM）调用。每批分析必须在 10 秒内完成，而当前的顺序处理每批需要 45 秒。以下哪种方案能满足该需求？","o":[{"l":"A","t":"使用具有预配置并发性的 AWS Lambda 函数来按顺序处理每种分析类型。将 Lambda 函数超时配置为 10 秒。使用指数退避配置自动重试。"},{"l":"B","t":"将 AWS Step Functions 与并行状态结合使用，同时为每种分析类型调用单独的 AWS Lambda 函数。配置 Amazon Bedrock 客户端超时。使用 Amazon CloudWatch Metrics 跟踪执行时间和模型推理延迟。"},{"l":"C","t":"创建 Amazon SQS 队列来缓冲分析请求。使用预留并发部署多个 AWS Lambda 函数。配置每个 Lambda 函数以按顺序处理每个报告的不同方面，然后合并结果。"},{"l":"D","t":"部署运行按顺序处理每个报告的容器的 Amazon ECS 集群。使用负载均衡器来分配批量工作负载。根据 CPU 利用率配置自动伸缩策略。"}],"a":["B"],"e":"**正确答案：B。** 使用 AWS Step Functions 的并行状态（Parallel State）同时为每种分析类型调用独立的 Lambda 函数，并通过 CloudWatch 指标跟踪执行时间。\n\n**为什么对：** 每份报告的财务提取、情绪分析和合规验证彼此独立，非常适合并行执行。AWS Step Functions 的并行状态可同时调用多个 Lambda 函数，每个函数独立调用 Amazon Bedrock，将总处理时间从顺序执行的 45 秒大幅压缩到 10 秒以内。配置客户端超时可防止单次推理调用阻塞整个批次，CloudWatch 指标则提供执行时间和延迟的可观测性。\n\n**其他选项为什么错：**\n- A. 用预置并发的 Lambda 按顺序处理各分析类型：仍然是顺序执行，无法在 10 秒内完成。\n- C. 通过 SQS 队列 + 多个 Lambda 顺序处理再合并：引入了消息队列开销，且仍为顺序处理各分析环节。\n- D. 部署 ECS 集群按顺序处理每份报告：顺序处理加上容器管理开销，无法满足时间约束。","s":"源#284"},{"id":"D4-039","d":4,"t":"single","q":"一家公司在 Amazon EC2 实例上运行推荐系统，通过调用 Amazon Bedrock 基础模型（FM）分析客户行为并生成个性化产品推荐。系统出现间歇性问题：部分推荐与客户偏好不匹配。公司需要一套可观测性方案来监控运营指标、检测与既定基线相比的性能下降模式，并在 FM 行为偏离预期时于 10 分钟内生成包含相关数据的告警。以下哪种方案能满足这些需求？","o":[{"l":"A","t":"配置 Amazon CloudWatch Container Insights。设置延迟阈值警报。使用 CloudWatch 嵌入式指标格式添加自定义令牌指标。"},{"l":"B","t":"实施 AWS X-Ray。启用 CloudWatch Logs Insights。设置 AWS CloudTrail 并在 Amazon QuickSight 中创建控制面板。"},{"l":"C","t":"启用 Amazon CloudWatch Application Insights。使用 CloudWatch 嵌入式指标格式以及请求类型和用户细分的维度，为推荐质量、令牌使用情况和响应延迟创建自定义指标。在模型指标上配置 CloudWatch 异常检测。使用 CloudWatch Logs Insights 进行模式分析。"},{"l":"D","t":"将 Amazon OpenSearch Service 与 Observability 插件结合使用。通过 Amazon Kinesis 提取指标和日志并使用自定义查询分析行为。"}],"a":["C"],"e":"**正确答案：C。** 启用 CloudWatch Application Insights，使用嵌入式指标格式发布推荐质量、令牌使用和延迟
