等自定义指标，并配置 CloudWatch 异常检测实现动态基线告警。\n\n**为什么对：** CloudWatch Application Insights 能自动发现 EC2 应用组件并识别异常行为模式。通过 CloudWatch 嵌入式指标格式（Embedded Metric Format）发布带有请求类型和用户细分维度的自定义指标，可直接监控 FM 行为而非仅监控基础设施。CloudWatch 异常检测根据历史数据建立动态基线并自动检测偏差，满足 10 分钟内告警的要求。Logs Insights 进一步支持日志模式分析，帮助定位间歇性质量问题的根因。\n\n**其他选项为什么错：**\n- A. 使用 Container Insights + 延迟阈值告警：Container Insights 面向容器化工作负载，不适用于 EC2 应用；静态阈值无法动态适应基线变化。\n- B. 使用 X-Ray + Logs Insights + CloudTrail + QuickSight：涉及多个服务的拼凑方案，缺乏自动基线异常检测能力，运维开销大。\n- D. 使用 OpenSearch + Kinesis：引入额外基础设施，运维复杂度高，且不具备内置异常检测。","s":"源#285"},{"id":"D4-040","d":4,"t":"single","q":"一家医疗保健公司使用 Amazon Bedrock 部署了一个生成临床文档摘要的应用程序。该应用的响应质量不稳定，偶尔出现事实幻觉（Hallucination）。每月成本超出预期 40%。GenAI 开发人员需要实施近实时监控方案以检测幻觉、识别异常令牌消耗，并提供成本异常的早期预警。该方案必须将定制开发和维护开销降至最低。以下哪种方案能满足这些需求？","o":[{"l":"A","t":"配置 Amazon CloudWatch 警报以监控 InputTokenCount 和 OutputTokenCount 指标以检测异常。将模型调用日志存储在 Amazon S3 存储桶中。使用 AWS Glue 和 Amazon Athena 识别潜在的幻觉。"},{"l":"B","t":"运行 Amazon Bedrock 评估作业，使用基于 LLM 的判断来检测幻觉。配置 Amazon CloudWatch 以跟踪令牌使用情况。创建 AWS Lambda 函数来处理 CloudWatch 指标。配置 Lambda 函数以发送使用模式通知。"},{"l":"C","t":"配置 Amazon Bedrock 以将模型调用日志存储在 Amazon S3 存储桶中。启用文本输出日志记录。配置 Amazon Bedrock 护栏以运行上下文接地检查以检测幻觉。为令牌使用指标创建 Amazon CloudWatch 异常检测警报。"},{"l":"D","t":"使用 AWS CloudTrail 记录所有 Amazon Bedrock API 调用。在 Amazon QuickSight 中创建自定义控制面板以可视化令牌使用模式。使用 Amazon SageMaker ModelMonitor 检测生成的摘要中的质量漂移。"}],"a":["C"],"e":"**正确答案：C。** 配置 Amazon Bedrock 将模型调用日志（含文本输出）存储至 S3，启用 Bedrock Guardrails 的上下文接地检查（Contextual Grounding Check）检测幻觉，并为令牌使用指标创建 CloudWatch 异常检测告警。\n\n**为什么对：** 启用文本输出日志记录可捕获详细的提示和响应数据，无需构建自定义日志管道。Bedrock Guardrails 的上下文接地检查能自动验证生成的摘要是否与源文档一致，从而在推理时检测幻觉。CloudWatch 异常检测基于历史模式自动建模基线，当令牌消耗出现异常时即触发告警，为成本超支提供早期预警。整个方案利用原生功能，定制开发最少。\n\n**其他选项为什么错：**\n- A. CloudWatch 告警监控令牌指标 + Glue/Athena 分析幻觉：Glue/Athena 是批量分析工具，不满足近实时检测幻觉的需求。\n- B. Bedrock 评估作业 + Lambda 处理 CloudWatch 指标：评估作业是离线运行的，不适合近实时监控。\n- D. CloudTrail 记录 API 调用 + QuickSight + SageMaker Model Monitor：Model Monitor 针对传统 ML 模型漂移而非 LLM 幻觉，QuickSight 不提供实时告警。","s":"源#286"},{"id":"D4-041","d":4,"t":"single","q":"一家公司构建了一个无服务器应用程序，使用 AWS Lambda 和 Amazon Bedrock 上的 Anthropic Claude 帮助全球学生总结笔记。公司发现每个时区的流量高峰集中在晚间，用户在高峰时段报告了限流（Throttling）错误。公司需要解决限流问题以确保应用持续可用，同时保持性能质量，且在低流量时段不产生固定的每小时成本。以下哪种方案能满足这些需求？","o":[{"l":"A","t":"创建自定义 Amazon CloudWatch 指标来监控模型错误。将预置吞吐量设置为安全高于观察到的峰值流量的值。"},{"l":"B","t":"创建自定义 Amazon CloudWatch 指标来监控模型错误。设置故障转移机制，以便在错误超过指定阈值时将调用重定向到备份 AWS 区域。"},{"l":"C","t":"在 Amazon Bedrock 中启用调用日志记录。监视关键指标，例如调用、InputTokenCount、OutputTokenCount 和 InvocationThrottles。跨跨区域推理端点分配流量。"},{"l":"D","t":"在 Amazon Bedrock 中启用调用日志记录。监控 InvocationLatency、InvocationClientErrors 和 InvocationServerErrors 指标。在同一模型的多个版本之间分配流量。"}],"a":["C"],"e":"**正确答案：C。** 在 Amazon Bedrock 中启用调用日志记录，监控 InvocationThrottles 等关键指标，并使用跨区域推理端点（Cross-Region Inference）分配流量。\n\n**为什么对：** 跨区域推理允许 Amazon Bedrock 将请求自动分发到多个 AWS 区域，减少单区域容量争用并防止限流，无需预留或预置容量。按需推理按使用量计费，低流量时段不产生固定成本。启用调用日志记录并监控 InvocationThrottles、InputTokenCount 和 OutputTokenCount 指标，提供使用模式的完整可见性。\n\n**其他选项为什么错：**\n- A. 自定义 CloudWatch 指标 + 预置吞吐量设为安全高值：预置吞吐量在低流量期产生固定的每小时成本，违背题目要求。\n- B. 自定义 CloudWatch 指标 + 故障转移到备份区域：手动故障转移机制复杂且响应不及时，不如跨区域推理的自动分配高效。\n- D. 调用日志记录 + 在同一模型的多个版本间分配流量：在多个版本间分配流量不能有效增加区域级容量，无法解决限流根因。","s":"源#287"},{"id":"D4-042","d":4,"t":"single","q":"一家公司的生成式 AI 应用程序使用 Amazon Bedrock 对客户查询提供实时响应。公司发现高峰流量期间对基础模型（FM）的 API 调用出现间歇性故障。公司需要一套方案来处理瞬态错误并提供 FM 性能的详细可观测性。该方案必须防止限流事件期间的级联故障，提供跨服务边界的分布式追踪以识别延迟来源，并能将性能问题与具体的 FM 特征关联。以下哪种方案能满足这些需求？","o":[{"l":"A","t":"实现自定义重试机制，重试之间的固定延迟为 1 秒。配置 Amazon CloudWatch 警报以监控应用程序的错误率和延迟指标。"},{"l":"B","t":"使用标准重试模式和带抖动的指数退避配置 AWS 开发工具包。使用带有注释的 AWS X-Ray 跟踪来识别和筛选服务组件。"},{"l":"C","t":"对所有 FM 响应实施客户端缓存。在应用程序代码中添加自定义日志记录语句以记录 API 调用持续时间。"},{"l":"D","t":"使用自适应重试模式配置 AWS 开发工具包。使用 AWS CloudTrail 分布式跟踪来监控限制事件。"}],"a":["B"],"e":"**正确答案：B。** 使用 AWS SDK 标准重试模式（含抖动的指数退避），并通过 AWS X-Ray 注解实现跨服务的分布式追踪。\n\n**为什么对：** AWS SDK 标准重试模式提供带抖动（Jitter）的指数退避，可在限流期间分散重试请求，避免同步重试风暴引发级联故障。AWS X-Ray 提供跨 API Gateway、Lambda 和 Amazon Bedrock 等服务边界的分布式追踪，可精确识别延迟来源。使用 X-Ray 注解（Annotations）可对追踪数据按 FM 特征进行筛选和关联，帮助定位特定模型相关的性能问题。\n\n**其他选项为什么错：**\n- A. 固定 1 秒延迟的自定义重试 + CloudWatch 告警：固定延迟重试无法分散负载，容易加剧限流；CloudWatch 告警无法提供分布式追踪。\n- C. 客户端缓存 FM 响应 + 自定义日志：缓存不适合实时动态查询场景，自定义日志缺乏分布式追踪能力。\n- D. 自适应重试模式 + CloudTrail 分布式跟踪：CloudTrail 记录的是管理事件而非推理调用的性能追踪，不具备 X-Ray 的链路分析能力。","s":"源#288"},{"id":"D4-043","d":4,"t":"single","q":"一家金融服务公司使用 AI 应用程序通过 Amazon Bedrock 处理财务文档。工作时间内每小时约处理 10,000 个请求，需要稳定的吞吐量。该公司已通过 CreateProvisionedModelThroughput API 购买了预置吞吐量（Provisioned Throughput）。然而 Amazon CloudWatch 指标表明：按需请求被限流时，预置容量却未被使用。代码如下：\nResponse=bedrock_runtime.invoke_model(modelId=\"anthropic.claude-v2\", body=json.dumps(payload))\n该公司需要让应用程序正确使用预置吞吐量以解决限流问题。以下哪种方案能满足需求？","o":[{"l":"A","t":"增加预配置吞吐量配置中的模型单元 (MU) 数量。"},{"l":"B","t":"将模型 ID 参数替换为 CreateProvisionedModelThroughput API 返回的预配置模型的 ARN。"},{"l":"C","t":"添加指数退避重试逻辑以处理高峰时段的限制异常。"},{"l":"D","t":"修改应用程序以使用 InvokeModelWithResponseStream API 而不是 InvokeModel API。"}],"a":["B"],"e":"**正确答案：B。** 将 modelId 参数替换为 CreateProvisionedModelThroughput API 返回的预置模型 ARN。\n\n**为什么对：** 在 Amazon Bedrock 中，预置吞吐量绑定到通过预置吞吐量 API 创建的特定资源。要使用预留容量，推理请求的 modelId 必须指向预置资源标识符。代码中的 anthropic.claude-v2 是按需端点标识符，因此所有请求都走按需通道，被限流的同时预置容量空闲。改为预置模型 ARN 后，请求将正确路由到预留容量。\n\n**其他选项为什么错：**\n- A. 增加模型单元（MU）数量：问题不在于容量不足，而在于请求根本没有路由到预置资源。\n- C. 添加指数退避重试逻辑：重试仅缓解限流症状，不解决路由根因。\n- D. 改用 InvokeModelWithResponseStream API：API 类型的变更不影响请求是走按需还是预置通道。\n\n**关键概念：** 使用预置吞吐量时，必须将 modelId 设为预置模型 ARN，否则请求默认路由到按需容量。","s":"源#289"},{"id":"D4-044","d":4,"t":"single","q":"一家公司在 Amazon EC2 实例上运行推荐系统，通过调用 Amazon Bedrock 基础模型分析客户行为并生成个性化产品推荐。系统间歇性地出现推荐与客户偏好不匹配的问题。公司需要一套可观测性方案来监控运营指标、检测相对于基线的性能下降模式，并在 FM 行为偏离预期时于 10 分钟内生成附带相关数据的告警。以下哪种方案能满足需求？","o":[{"l":"A","t":"为应用程序基础设施配置 Amazon CloudWatch Container Insights。设置 CloudWatch 延迟阈值警报。使用 CloudWatch 嵌入式指标格式添加令牌计数的自定义指标。创建 CloudWatch 仪表板以可视化数据。"},{"l":"B","t":"实施 AWS X-Ray 以跟踪通过应用程序组件的请求。启用 CloudWatch Logs Insights 以进行错误模式检测。设置 AWS CloudTrail 以监控对 Amazon Bedrock 的所有 API 调用。在 Amazon QuickSight 中创建自定义控制面板。"},{"l":"C","t":"为应用程序资源启用 Amazon CloudWatch Application Insights。使用具有请求类型和用户细分维度的 CloudWatch Embedded 指标格式，创建推荐质量、令牌使用情况和响应延迟的自定义指标。在模型指标上配置 CloudWatch 异常检测。使用 CloudWatch Logs Insights 建立日志模式分析。"},{"l":"D","t":"将 Amazon OpenSearch Service 与 Observability 插件结合使用。使用 Amazon Kinesis 提取模型指标和日志。创建自定义管道处理语言 (PPL) 查询来分析模型行为模式。建立操作仪表板以实时可视化异常情况。"}],"a":["C"],"e":"**正确答案：C。** 启用 CloudWatch Application Insights 监控应用资源，使用嵌入式指标格式发布推荐质量、令牌使用和响应延迟等自定义指标，配置 CloudWatch 异常检测并通过 Logs Insights 进行日志模式分析。\n\n**为什么对：** CloudWatch Application Insights 针对 EC2 工作负载提供自动化的应用级可观测性。嵌入式指标格式支持携带请求类型和用户细分等维度的自定义指标，实现 FM 行为的细粒度监控。CloudWatch 异常检测基于历史数据自动建立动态基线并检测偏差，满足 10 分钟告警时限。Logs Insights 则支持对日志的深入模式分析，定位间歇性推荐质量问题的根因。\n\n**其他选项为什么错：**\n- A. Container Insights + 延迟阈值告警 + 嵌入式指标：Container Insights 面向容器工作负载，不适用于 EC2 应用；静态阈值告警不具备动态基线能力。\n- B. X-Ray + Logs Insights + CloudTrail + QuickSight：多服务拼凑，缺乏自动异常检测能力，运维复杂。\n- D. OpenSearch + Kinesis + 自定义 PPL 查询：引入了额外的基础设施管理，运营开销大且缺少内置异常检测。","s":"源#290"},{"id":"D4-045","d":4,"t":"single","q":"一家公司正在开发一款生成式 AI 应用程序，用于实时分析客户服务通话并为人工坐席生成建议回复。该应用必须在高峰时段处理 500,000 个并发调用，每条建议端到端延迟低于 200 毫秒。公司已有转录通话音频流的架构。应用不得超出预定义的月度计算预算，且必须具备自动扩展能力。以下哪种方案能满足这些需求？","o":[{"l":"A","t":"在 Amazon Bedrock 上部署大型、复杂的推理模型。购买预配置吞吐量并优化批处理。"},{"l":"B","t":"在 Amazon Bedrock 上部署低延迟、实时优化的模型。购买预配置吞吐量并设置自动扩展策略。"},{"l":"C","t":"在使用专用 GPU 实例的 Amazon SageMaker 实时终端节点上部署大型语言模型 (LLM)。"},{"l":"D","t":"在针对批处理进行优化的 Amazon SageMaker 无服务器终端节点上部署中型语言模型。"}],"a":["B"],"e":"**正确答案：B。** 在 Amazon Bedrock 上部署低延迟、实时优化的模型，购买预置吞吐量（Provisioned Throughput）并配置自动扩展策略。\n\n**为什么对：** Amazon Bedrock 的低延迟模型专为实时推理场景优化，能以极低的单请求开销处理高并发。预置吞吐量保留了足够容量以承载 500,000 并发调用的峰值，消除冷启动和排队延迟。自动扩展策略在非高峰时段自动缩减容量，确保不超月度预算，兼顾了成本可控和高峰性能。\n\n**其他选项为什么错：**\n- A. 部署大型复杂推理模型 + 预置吞吐量 + 批处理：大型模型单次推理延迟高，难以在 200 毫秒内响应。\n- C. 在 SageMaker 实时端点上部署 LLM + 专用 GPU 实例：需自行管理扩缩容，运维复杂，且难以稳定达到 200 毫秒延迟。\n- D. 在 SageMaker 无服务器端点上部署模型并优化批处理：无服务器端点冷启动延迟高，批处理优化不适合实时低延迟场景。","s":"源#291"},{"id":"D4-046","d":4,"t":"multiple","q":"一家公司在多个业务部门部署了多个基于 Amazon Bedrock 的生成式 AI 应用程序，涵盖客户服务、内容生成和文档分析。部分应用的令牌消耗模式不可预测。公司需要一套全面的可观测性方案，提供跨多个模型的令牌使用模式的实时可见性，支持面向不同利益相关方的自定义仪表板，并为所有基础模型的令牌消耗提供告警能力。以下哪种方案组合能以最低运营开销满足这些需求？（选择两项。）","o":[{"l":"A","t":"使用 Amazon CloudWatch 指标作为数据源来创建自定义 Amazon QuickSight 仪表板，以显示跨 FM 的令牌使用趋势和使用模式。"},{"l":"B","t":"使用 CloudWatch Logs Insights 分析 Amazon Bedrock 调用日志，了解令牌消耗模式和应用程序的使用归因。创建自定义查询来识别高使用率场景。将日志小部件添加到仪表板以实现持续监控。"},{"l":"C","t":"创建结合了本机 Amazon Bedrock 令牌和调用 CloudWatch 指标的自定义 Amazon CloudWatch 控制面板。设置 CloudWatch 警报以监控令牌使用阈值。"},{"l":"D","t":"通过使用 An Amazon Bedrock 与 Amazon Managed Grafana 的零 ETL 集成，创建仪表板来显示公司 FM 中的代币使用趋势和模式。"},{"l":"E","t":"实施 Amazon EventBridge 规则以捕获 Amazon Bedrock 模型调用事件。使用 Amazon Data Firehose 将令牌使用数据路由到 Amazon OpenSearch Serverless。使用 OpenSearch 仪表板来分析使用模式。"}],"a":["C","D"],"e":"**正确答案：C、D。** 使用 CloudWatch 原生指标构建集中仪表板和告警（C），同时通过 Amazon Managed Grafana 与 Amazon Bedrock 的零 ETL 集成创建面向不同角色的高级仪表板（D）。\n\n**为什么对：** Amazon Bedrock 原生发布模型调用和令牌使用的 CloudWatch 指标。选项 C 直接利用这些指标构建集中式仪表板和基于阈值的告警，无需额外的数据管道。选项 D 通过 Amazon Managed Grafana 与 Bedrock 的零 ETL 集成，为不同利益相关方创建定制化的高级可视化仪表板，运维开销极低。两者组合既满足告警需求又满足多角色仪表板需求。\n\n**其他选项为什么错：**\n- A. 用 QuickSight 从 CloudWatch 指标创建仪表板：QuickSight 更适合商业智能分析，不如 Managed Grafana 与 CloudWatch 的实时监控集成紧密。\n- B. 用 Logs Insights 分析调用日志中的令牌消耗模式：日志分析可作为补充，但不提供原生的多利益相关方仪表板和告警功能，运维开销更高。\n- E. 用 EventBridge + Firehose + OpenSearch Serverless：引入完整的自定义数据管道，运营开销远高于利用原生集成。","s":"源#292"},{"id":"D4-047","d":4,"t":"multiple","q":"一家出版公司正在开发一款聊天助手，使用在 Amazon SageMaker AI 上运行的容器化大语言模型（LLM）。架构为：Amazon API Gateway REST API 将用户请求路由至 AWS Lambda 函数，Lambda 再调用托管 LLM 的 SageMaker AI 实时端点。用户反映响应时间不均匀，分析显示大量聊天会话在等待首个令牌超过 2 秒后被放弃。公司希望将交互请求的 p95 延迟降至 800 毫秒以下。以下哪种方案组合能满足该需求？（选择两项。）","o":[{"l":"A","t":"在容器启动时启用模型预加载。实现动态批处理以在单个推理过程中一起处理多个用户请求。"},{"l":"B","t":"为 SageMaker AI 终端节点选择更大的 GPU 实例类型。将最小实例数设置为 0。继续执行每个请求的处理。在第一个请求上延迟加载模型权重。"},{"l":"C","t":"切换到多模型端点。使用延迟加载而不进行请求批处理。"},{"l":"D","t":"将最小实例数设置为大于 0。启用响应流。"},{"l":"E","t":"针对所有请求切换到 Amazon SageMaker 异步推理。将请求存储在 Amazon S3 存储桶中。将最小实例数设置为 0。"}],"a":["A","D"],"e":"**正确答案：A、D。** 容器启动时预加载模型并启用动态批处理（A），同时将最小实例数设为大于 0 并启用响应流式传输（D）。\n\n**为什么对：** 选项 D 解决了延迟不均匀的最大因素——冷启动。将最小实例数设为大于 0 可确保端点始终有热实例，消除首次请求的冷启动惩罚。启用响应流式传输使首个令牌生成后即开始返回，大幅降低用户感知的等待时间。选项 A 通过容器启动时预加载模型权重消除推理时的加载开销，动态批处理将多个请求合并处理以提高 GPU 利用率和吞吐量，进一步压缩 p95 延迟。\n\n**其他选项为什么错：**\n- B. 选择更大 GPU 实例 + 最小实例数设为 0 + 延迟加载模型权重：最小实例数为 0 意味着冷启动仍存在，延迟加载会增加首次请求延迟。\n- C. 切换至多模型端点 + 延迟加载：多模型端点在模型切换时产生额外加载延迟，不利于低延迟交互场景。\n- E. 切换至异步推理 + S3 存储请求 + 最小实例数为 0：异步推理不支持实时交互，无法满足 800 毫秒 p95 延迟要求。","s":"源#293"},{"id":"D4-048","d":4,"t":"multiple","q":"一家出版公司正在开发聊天助手，采用在 Amazon SageMaker AI 上运行的容器化大语言模型（LLM）。架构由 Amazon API Gateway REST API 将用户请求路由至 AWS Lambda 函数，Lambda 调用托管 LLM 的 SageMaker AI 实时端点。用户反馈响应时间参差不齐。分析数据显示，有大量聊天会话在等待首个令牌 2 秒内即被放弃。公司需要一个方案确保交互请求的 p95 延迟低于 800 毫秒。以下哪些方案组合能满足该需求？（选择两项。）","o":[{"l":"A","t":"启用容器启动时的模型预加载功能；实现动态批处理，以便在单次推理过程中处理多个用户请求。"},{"l":"B","t":"为 SageMaker AI 端点选择更大的 GPU 实例类型，将最小实例数设置为 0。继续执行每请求处理流程；在首次请求时，采用惰性加载方式加载模型权重。"},{"l":"C","t":"切换至多模型端点。采用无请求批处理的延迟加载方式。"},{"l":"D","t":"将最小实例数设置为大于 0，并启用响应流式传输。"},{"l":"E","t":"将所有请求切换至 Amazon SageMaker 异步推理服务：将请求存储在 Amazon S3 存储桶中；将最小实例数设置为 0。"}],"a":["A","D"],"e":"**正确答案：A、D。** 启用容器启动时的模型预加载并实现动态批处理（A），同时将最小实例数设为大于 0 并启用响应流式传输（D）。\n\n**为什么对：** 选项 D 通过保持最小实例数大于 0 消除冷启动，确保端点始终有热实例待命；启用响应流式传输让首个令牌生成后即开始返回，直接解决用户因等待首令牌超时而放弃会话的问题。选项 A 在容器启动时预加载模型权重，避免推理时的额外加载延迟；动态批处理将并发请求合并为单次推理，提升 GPU 利用率并降低整体延迟。两者组合将 p95 延迟压至 800 毫秒以下。\n\n**其他选项为什么错：**\n- B. 更大 GPU 实例 + 最小实例数为 0 + 惰性加载：实例数为 0 时仍有冷启动，惰性加载增加首次请求延迟，与延迟目标矛盾。\n- C. 多模型端点 + 延迟加载无批处理：模型切换加载导致额外延迟，不适合低延迟实时聊天。\n- E. 异步推理 + S3 存储 + 最小实例数为 0：异步推理无法支持实时对话交互。","s":"源#294"},{"id":"D4-049","d":4,"t":"single","q":"一家金融服务公司基于 Amazon Bedrock AgentCore 构建了一套多智能体（Multi-Agent）生成式 AI 应用，每日处理超过 10,000 条客户咨询。应用中的智能体调用多个自定义工具，高峰期这些工具的故障率高达 40%，且在不同团队间表现不一致。GenAI 开发人员需要实现一套可观测性方案，要求：提供代理交互和工具行为的端到端可见性；利用 Amazon Bedrock 的内置功能，不需要自定义指标采集组件；性能开销极低。以下哪种方案能满足这些需求？","o":[{"l":"A","t":"启用 AgentCore 的可观测性与追踪收集功能：使用 AWS X-Ray 为自定义工具捕获分布式追踪数据；构建 Amazon CloudWatch 指数面板，以可视化展示峰值使用期间的错误、限流及延迟指标。"},{"l":"B","t":"使用 Amazon CloudWatch Container Insights 监控代理；配置一个 AWS Lambda 函数，用于轮询 Amazon Bedrock API 以获取工具使用指标；并配置该函数将结果存储至 CloudWatch，从而生成告警。"},{"l":"C","t":"构建一个自定义的 ETL 流水线，该流水线利用 AWS Lambda 函数处理来自 Amazon Bedrock 的 Amazon CloudWatch 日志，将处理后的数据存储在 Amazon DynamoDB 中，并使用 Amazon QuickSight 对跨团队绩效模式进行可视化。"},{"l":"D","t":"启用 AgentCore 可观测性功能，并将追踪数据发送至 Amazon CloudWatch Logs；使用自定义 AWS Lambda 函数从日志中提取工具性能指标；并利用 Amazon Managed Grafana 对趋势进行可视化展示。"}],"a":["A"],"e":"**正确答案：A。** 启用 AgentCore 的可观测性与追踪收集功能，使用 AWS X-Ray 捕获自定义工具的分布式追踪数据，并通过 CloudWatch 仪表板可视化错误、限流和延迟指标。\n\n**为什么对：** AgentCore 内置可观测性功能，启用后即可采集代理交互和工具调用的追踪数据，无需自定义指标采集组件。AWS X-Ray 专为分布式追踪设计，能捕获每次工具调用的延迟、错误和依赖关系链路，直接满足端到端可见性要求。CloudWatch 仪表板利用原生指标可视化高峰期的错误率和限流情况。整个方案开销极低，符合生产环境的性能要求。\n\n**其他选项为什么错：**\n- B. CloudWatch Container Insights + Lambda 轮询 Bedrock API 获取指标：需要自定义 Lambda 轮询组件，违背不需要自定义指标采集组件的要求。\n- C. 自定义 ETL 管道 + DynamoDB + QuickSight：完全自定义的方案，开发和维护开销高，未利用内置功能。\n- D. AgentCore 可观测性 + 日志发送至 CloudWatch Logs + Lambda 提取指标 + Managed Grafana：需要自定义 Lambda 从日志中提取指标，违背内置功能要求。","s":"源#295"},{"id":"D4-050","d":4,"t":"single","q":"一家金融服务公司基于 Amazon Bedrock AgentCore 构建了多智能体生成式 AI 应用，日均处理超 10,000 条客户咨询。智能体调用的自定义工具在高峰期故障率高达 40%，且跨团队表现不一致。GenAI 开发人员需实现可观测性方案，要求提供代理交互与工具行为的端到端可见性，必须利用 Amazon Bedrock 内置功能，不得引入自定义指标采集组件，且性能开销极低。以下哪种方案能满足需求？","o":[{"l":"A","t":"启用 AgentCore 可观测性与追踪收集功能；使用 AWSX-Ray 为自定义工具捕获分布式追踪数据；构建 Amazon CloudWatch 指数面板，以可视化展示峰值使用期间的错误、限流及延迟指标。"},{"l":"B","t":"使用 Amazon CloudWatch Container Insights 对代理进行监控；配置一个 AWS Lambda 函数，用于轮询 Amazon Bedrock API 以获取工具使用指标；并配置该函数将结果存储至 CloudWatch，从而生成告警。"},{"l":"C","t":"构建一个自定义的 ETL 流水线，该流水线利用 AWS Lambda 函数处理来自 Amazon Bedrock 的 Amazon CloudWatch 日志，并将处理后的数据存储在 Amazon DynamoDB 中；同时使用 Amazon QuickSight 对跨团队绩效模式进行可视化呈现。"},{"l":"D","t":"启用 AgentCore 可观测性功能，并将追踪数据发送至 Amazon CloudWatch Logs；使用自定义 AWS Lambda 函数从日志中提取工具性能指标；并利用 Amazon Managed Grafana 对趋势进行可视化展示。"}],"a":["A"],"e":"**正确答案：A。** 启用 AgentCore 可观测性与追踪收集功能，通过 AWS X-Ray 为自定义工具捕获分布式追踪数据，构建 CloudWatch 仪表板展示高峰期的错误、限流与延迟指标。\n\n**为什么对：** AgentCore 原生支持可观测性功能，启用后无需额外组件即可采集代理和工具调用的追踪信息。AWS X-Ray 提供分布式追踪能力，可精确定位故障率高的工具及其调用链路，满足端到端可见性需求。CloudWatch 仪表板直接消费原生指标，开销极低，适合生产环境。\n\n**其他选项为什么错：**\n- B. CloudWatch Container Insights + Lambda 轮询 API 获取指标：引入自定义 Lambda 轮询组件，违背不使用自定义指标采集的要求。\n- C. 自定义 ETL 管道 + DynamoDB + QuickSight：全部为自定义组件，开发维护开销大，未利用内置功能。\n- D. AgentCore 可观测性 + CloudWatch Logs + 自定义 Lambda 提取指标 + Managed Grafana：虽然启用了 AgentCore 可观测性，但仍依赖自定义 Lambda 提取指标，不符合要求。","s":"源#296"},{"id":"D4-051","d":4,"t":"single","q":"一家媒体公司正使用 Amazon Bedrock 构建 AI 内容审核系统。系统先用小型低延迟模型对文本分类，当置信度低于 0.65 时升级至更大、更贵的模型处理。系统要求：高置信度结果近实时响应；低置信度请求异步处理；具备良好的可扩展性以应对流量激增。公司希望仅在需要时调用大型模型以优化成本，并采用解耦组件提升容错能力。以下哪种方案能满足这些需求？","o":[{"l":"A","t":"使用 Amazon API Gateway 同步调用小型模型；若小型模型的置信度分数低于 0.65，则同步调用大型模型。可采用预分配并发量来应对流量激增。"},{"l":"B","t":"使用一个具有并行分支的 AWS Step Functions 工作流，为每个请求同时运行小型模型和大型模型；当置信度分数值不一致时，选择大型模型的输出结果。"},{"l":"C","t":"将请求发送至 Amazon SQS 队列，使用 AWS Fargate 处理消息。首先调用小型模型；若置信度分数低于 0.65，则将该请求放入第二个 SQS 队列，通过使用大型模型进行异步处理。"},{"l":"D","t":"将两个模型部署在 AmazonEC2 实例上，并启用自动扩展功能；同时，使用自定义应用程序启发式算法，根据短语长度和关键词规则将请求路由至相应的实例。"}],"a":["C"],"e":"**正确答案：C。** 将请求发送至 Amazon SQS 队列，使用 AWS Fargate 处理消息并调用小型模型；若置信度低于 0.65 则放入第二个 SQS 队列，由大型模型异步处理。\n\n**为什么对：** SQS 队列作为解耦层，将请求的接收与处理分离，提供高容错能力和流量削峰。Fargate 按需启动容器处理消息，具备良好的扩展性。两级队列架构实现了分层处理：高置信度请求仅调用小型模型即可快速返回；低置信度请求异步转入第二队列由大型模型处理，仅在需要时才产生大型模型的推理成本，实现成本优化。\n\n**其他选项为什么错：**\n- A. API Gateway 同步调用小型模型 + 条件同步调用大型模型：低置信度请求也是同步处理，不满足异步处理低置信度请求的要求；同步链路也缺乏解耦和容错。\n- B. Step Functions 并行分支同时运行两个模型：每个请求都调用大型模型，无法实现仅在需要时调用大型模型的成本优化目标。\n- D. 将模型部署在 EC2 + 自定义路由规则：自行管理 EC2 实例和自定义路由增加运维复杂度，且基于短语长度和关键词的规则不如置信度评分准确。","s":"源#297"},{"id":"D5-001","d":5,"t":"single","q":"你的 GenAI 应用需要评估 FM 输出的质量，关注\"生成的回答是否与事实一致\"。应重点评估哪个指标？","o":[{"l":"A","t":"流畅性（Fluency）"},{"l":"B","t":"事实准确率（Factual Accuracy）"},{"l":"C","t":"相关性（Relevance）"},{"l":"D","t":"一致性（Consistency）"}],"a":["B"],"e":"**正确答案：B。** 看 factual accuracy（事实准确率）——输出内容与已知事实是否吻合。\n\n**为什么对：** 题干给的定义就是\"生成的回答是否与事实一致\"，这正好是事实准确率衡量的对象。它也是发现 hallucination（幻觉，模型编造不存在的信息）最直接的那个指标。\n\n**其他选项为什么错：**\n- A. 流畅性（Fluency）：衡量句子通不通顺、像不像人话，跟内容真假无关——一句编得很顺的假话，流畅性照样满分。\n- C. 相关性（Relevance）：衡量回答有没有对上问题。答非所问才叫相关性差，但对题也可能全答错。\n- D. 一致性（Consistency）：衡量同一问题多次回答是否稳定。每次都错得一模一样，一致性也能很高。","s":"源#298"},{"id":"D5-002","d":5,"t":"single","q":"一家公司想在生产部署前系统评估两个基础模型（Claude 和 Nova）在客服场景中的表现。哪种方法最合适？","o":[{"l":"A","t":"人工快速浏览两个模型的随机输出"},{"l":"B","t":"使用 Amazon Bedrock 模型评估 + A/B 测试"},{"l":"C","t":"只根据模型文档的基准分数决定"},{"l":"D","t":"先部署到生产再观察用户反馈"}],"a":["B"],"e":"**正确答案：B。** 用 Amazon Bedrock Model Evaluations（Bedrock 模型评估）跑自动评估与人工评估，再配合 A/B 对比。\n\n**为什么对：** 题干两个限定——\"系统评估\"和\"生产部署前\"。Model Evaluations 能让两个模型在同一批客服场景数据上各跑一遍，给出可比分维度的结果；需要人判断的部分也支持人工评审工作流，上线前就能拿到结论。\n\n**其他选项为什么错：**\n- A. 人工快速浏览随机输出：抽样随意、样本量小，结论既不可比也没法复现。\n- C. 只看模型文档的基准分数：公开基准是通用场景，反映不了你自己客服业务的实际表现。\n- D. 先上生产再观察用户反馈：等于拿真实用户做实验，出问题直接由业务承担代价。","s":"源#299"},{"id":"D5-003","d":5,"t":"single","q":"你的 RAG 应用需要评估\"检索到的文档是否真的帮助模型回答正确\"。应使用哪种评估方法？","o":[{"l":"A","t":"RAG 评估（检索质量 + 生成质量）"},{"l":"B","t":"只评估生成文本的 BLEU 分数"},{"l":"C","t":"只统计 API 调用次数"},{"l":"D","t":"人工抽查 5 个回答"}],"a":["A"],"e":"**正确答案：A。** 做 RAG 评估：检索侧看相关性和召回率，生成侧看最终答案质量，两段分开评。\n\n**为什么对：** 题干问的是\"检索到的文档有没有帮上忙\"，这个问题横跨两段——既要知道检索本身好不好，也要知道最终答案对不对。只有拆成两段分别评，才能判断问题出在\"没检索到\"还是\"检索到了却没用好\"。\n\n**其他选项为什么错：**\n- B. 只看生成文本的 BLEU 分数：BLEU 衡量的是与参考文本的用词重合度，既不看检索质量，也不适合开放式问答。\n- C. 只统计 API 调用次数：这是用量指标，跟效果好坏没有关系。\n- D. 人工抽查 5 个回答：样本量太小，而且只看到最终结果，定位不到是检索的锅还是生成的锅。","s":"源#300"},{"id":"D5-004","d":5,"t":"single","q":"你想验证一个 AI 代理（Agent）是否真的完成了用户的任务。应重点评估哪个指标？","o":[{"l":"A","t":"任务完成率"},{"l":"B","t":"模型推理延迟"},{"l":"C","t":"嵌入维度"},{"l":"D","t":"上下文窗口大小"}],"a":["A"],"e":"**正确答案：A。** 看任务完成率（task success rate）——在评测集里，Agent 真正把事情办成的比例。\n\n**为什么对：** 题干问的是\"是否真的完成了用户的任务\"，这是结果导向的判断。任务完成率直接数\"办成了多少件\"，是 Agent 类系统最核心的指标。\n\n**其他选项为什么错：**\n- B. 模型推理延迟：这是性能指标，回答\"快不快\"，不是\"做没做成\"。\n- C. 嵌入维度：这是向量表示的尺寸参数，跟任务是否完成无关。\n- D. 上下文窗口大小：这是模型的容量上限，同样不反映任务完成情况。","s":"源#301"},{"id":"D5-005","d":5,"t":"single","q":"用户报告长文档问答时模型报错\"输入超出最大长度\"。最可能的原因是什么？应如何解决？","o":[{"l":"A","t":"上下文窗口溢出；使用动态分块策略或摘要"},{"l":"B","t":"模型温度过高；调低温度"},{"l":"C","t":"嵌入维度不匹配；重新生成嵌入"},{"l":"D","t":"API 密钥过期；更换密钥"}],"a":["A"],"e":"**正确答案：A。** 输入超过了模型的 context window（上下文窗口）上限；改用动态分块，或先做摘要把输入压短。\n\n**为什么对：** \"超出最大长度\"这个报错本身就是 token 超限的提示——提示词加上输入内容超过了单次调用的上限。分块把长文档切开分别处理，摘要则先把内容压短，两条路都是把输入降到窗口以内。\n\n**其他选项为什么错：**\n- B. 模型温度过高：温度影响的是输出随机性，不会产生长度超限的报错。\n- C. 嵌入维度不匹配：维度不匹配报的是向量相关的错误，跟输入长度无关。\n- D. API 密钥过期：密钥失效会报认证或权限错误（通常是 403），不是长度超限。","s":"源#302"},{"id":"D5-006","d":5,"t":"single","q":"你的 RAG 系统检索结果质量下降，怀疑是文档更新后嵌入未同步。应优先检查什么？","o":[{"l":"A","t":"嵌入质量诊断和漂移监控"},{"l":"B","t":"模型温度设置"},{"l":"C","t":"API 网关限流配置"},{"l":"D","t":"前端页面样式"}],"a":["A"],"e":"**正确答案：A。** 先做嵌入质量诊断，并检查有没有发生 embedding drift（嵌入漂移）。\n\n**为什么对：** 题干的怀疑方向是\"文档更新了但向量没跟上\"，属于检索侧问题。诊断嵌入质量能确认新文档的向量是否生成正确、有没有同步进索引；漂移监控则能看出新旧向量的分布是否已经明显偏离。\n\n**其他选项为什么错：**\n- B. 模型温度设置：温度管的是生成阶段的随机性，不影响检索结果。\n- C. API 网关限流配置：限流会导致请求被拒或变慢，不会让检索结果变差。\n- D. 前端页面样式：纯展示层，跟检索质量无关。","s":"源#303"},{"id":"D5-007","d":5,"t":"single","q":"你想追踪每个提示在系统中的完整处理链路，定位是\"提示有问题\"还是\"模型调用有问题\"。应使用什么工具？","o":[{"l":"A","t":"AWS X-Ray（提示可观测性管道）"},{"l":"B","t":"S3 生命周期策略"},{"l":"C","t":"Amazon Route 53"},{"l":"D","t":"AWS WAF"}],"a":["A"],"e":"**正确答案：A。** 用 AWS X-Ray 搭提示可观测性，把提示从进入系统到模型调用的整条链路串起来。\n\n**为什么对：** 题干要的是\"完整链路\"和\"定位是哪一环出问题\"。X-Ray 做的就是分布式追踪——每个环节耗时多少、在哪一步失败都能看到，配合日志就能区分是提示本身写得有问题，还是模型调用环节出的错。\n\n**其他选项为什么错：**\n- B. S3 生命周期策略：对象存储的过期与转储规则，不做链路追踪。\n- C. Amazon Route 53：DNS 解析服务，不做链路追踪。\n- D. AWS WAF：Web 应用防火墙，拦的是恶意流量，不做链路追踪。","s":"源#304"},{"id":"D5-008","d":5,"t":"single","q":"你在发布模型新版本前，想验证它不会比旧版本产生更多幻觉。应如何验证？","o":[{"l":"A","t":"使用合成用户工作流 + 幻觉率验证 + 回复一致性检查"},{"l":"B","t":"随机部署到生产观察"},{"l":"C","t":"只检查代码能否编译"},{"l":"D","t":"查看模型参数量"}],"a":["A"],"e":"**正确答案：A。** 用合成的用户工作流模拟真实交互，量化幻觉率，并检查回复的一致性。\n\n**为什么对：** 题干要\"发布前验证不比旧版本差\"。合成工作流能在不上线的前提下复现真实交互；幻觉率给出可比的量化数字；一致性检查确认输出没有明显漂移。三者合起来才是一次可比的上线前验证。\n\n**其他选项为什么错：**\n- B. 随机部署到生产观察：拿真实用户试错，出问题的代价直接由业务承担。\n- C. 只检查代码能否编译：编译通过只说明没有语法错误，跟模型输出质量毫无关系。\n- D. 查看模型参数量：参数量反映的是模型规模，推不出幻觉率高低。","s":"源#305"},{"id":"D5-009","d":5,"t":"single","q":"你想量化 RAG 检索组件的性能——\"检索到的内容是否与用户问题相关\"。应测量哪个指标？","o":[{"l":"A","t":"相关性评分 + 检索延迟"},{"l":"B","t":"模型输出 Token 数"},{"l":"C","t":"嵌入向量维度"},{"l":"D","t":"冷启动时间"}],"a":["A"],"e":"**正确答案：A。** 测相关性评分（retrieval relevance），同时记录检索延迟。\n\n**为什么对：** 题干问的是\"检索到的内容是否与问题相关\"，对应的量化指标就是相关性评分——它直接给检索结果和问题之间的匹配程度打分。配上延迟一起看，才知道质量提升有没有以变慢为代价。\n\n**其他选项为什么错：**\n- B. 模型输出 token 数：这是生成侧的输出量，不反映检索结果好不好。\n- C. 嵌入向量维度：这是向量的尺寸参数，跟检索相关性无关。\n- D. 冷启动时间：这是服务启动的性能指标，不反映检索质量。","s":"源#306"},{"id":"D5-010","d":5,"t":"single","q":"应用调用 Bedrock API 时返回 400 错误。最可能的原因是什么？应如何排查？","o":[{"l":"A","t":"请求格式错误；检查错误日志、请求验证、回复分析"},{"l":"B","t":"磁盘空间不足；清理磁盘"},{"l":"C","t":"DNS 解析失败；检查域名"},{"l":"D","t":"网络断连；重启路由器"}],"a":["A"],"e":"**正确答案：A。** 400 表示请求本身有问题；查错误日志里返回的具体信息，检查请求体结构和参数取值。\n\n**为什么对：** HTTP 400 Bad Request 的含义就是服务端解析不了这个请求——最常见的是 JSON 结构不对、必填参数缺失、或参数取值超出允许范围。Amazon Bedrock 的错误响应里会给出具体字段，照着查最快。\n\n**其他选项为什么错：**\n- B. 磁盘空间不足：这是本地或实例的资源问题，不会让 API 返回 400。\n- C. DNS 解析失败：域名解析不通会在建立连接阶段就失败，根本拿不到 HTTP 状态码。\n- D. 网络断连：同样是在建立连接阶段失败，不会产生 400 这个响应码。","s":"源#307"},{"id":"D5-011","d":5,"t":"single","q":"你想让用户对 AI 的回答质量持续反馈，并据此改进模型。应实施什么机制？","o":[{"l":"A","t":"反馈界面 + 模型输出评级系统 + 注释工作流"},{"l":"B","t":"提高模型温度"},{"l":"C","t":"增加上下文窗口"},{"l":"D","t":"使用更大的嵌入模型"}],"a":["A"],"e":"**正确答案：A。** 在界面上加反馈入口，让用户给回答打分，再把有问题的样本沉淀成标注数据。\n\n**为什么对：** 题干要\"持续反馈\"并且\"据此改进\"。反馈界面让意见收得上来，评级把主观感受变成可统计的分数，标注工作流则把问题样本整理成后续可用于微调或评测的数据集——三步串起来才形成闭环。\n\n**其他选项为什么错：**\n- B. 提高模型温度：温度越高输出越随机，只会让质量更不稳定。\n- C. 增加上下文窗口：能让模型看到更多内容，但跟\"收集用户反馈\"完全是两回事。\n- D. 使用更大的嵌入模型：改善的是向量表示质量，同样不解决反馈收集的问题。","s":"源#308"},{"id":"D5-012","d":5,"t":"single","q":"你需要确保模型更新后输出质量不回退。应建立什么机制？","o":[{"l":"A","t":"持续评估工作流 + 模型输出回归测试"},{"l":"B","t":"删除旧版本模型"},{"l":"C","t":"只记录 API 调用量"},{"l":"D","t":"关闭监控"}],"a":["A"],"e":"**正确答案：A。** 建一套持续评估流程，每次更新都跑一遍回归测试，跟上一版对比。\n\n**为什么对：** \"不回退\"本质是个对比问题——必须有一个固定评测集，新旧版本各跑一次，指标不下降才算通过。持续评估工作流保证每次更新都会跑，回归测试则提供可比的结果。\n\n**其他选项为什么错：**\n- B. 删除旧版本模型：删掉旧版本反而失去了对比基线，更没法判断是否回退。\n- C. 只记录 API 调用量：调用量是用量数据，反映不了输出质量。\n- D. 关闭监控：关掉监控就完全失去发现回退的能力。","s":"源#309"},{"id":"D5-013","d":5,"t":"single","q":"模型的回答时好时坏，同样的提示有时准确有时错误。应如何系统排查提示问题？","o":[{"l":"A","t":"使用提示测试框架 + 版本比较 + 系统化改进"},{"l":"B","t":"随机修改提示词碰运气"},{"l":"C","t":"更换模型提供商"},{"l":"D","t":"提高温度增加多样性"}],"a":["A"],"e":"**正确答案：A。** 用提示测试框架在固定用例集上反复跑，比较不同版本的提示，再针对性改进。\n\n**为什么对：** \"时好时坏\"说明输出不稳定，要找出规律就得有可复现的测试——固定用例集加上多次运行才能看出失败模式；版本比较则定位是哪一次改动引入的变化。靠感觉改是改不出来的。\n\n**其他选项为什么错：**\n- B. 随机修改提示词碰运气：没有对照和记录，改好了不知道为什么好，改坏了也回不去。\n- C. 更换模型提供商：还没定位是不是提示的问题就换模型，成本和风险都高，问题还可能原样存在。\n- D. 提高温度增加多样性：温度调高只会让输出更随机，\"时好时坏\"反而更严重。","s":"源#310"},{"id":"D5-014","d":5,"t":"single","q":"业务方需要了解 GenAI 项目的模型表现和成本趋势。应如何高效汇报？","o":[{"l":"A","t":"可视化工具 + 自动报告机制 + 模型比较可视化"},{"l":"B","t":"口头总结"},{"l":"C","t":"不发报告"},{"l":"D","t":"只发原始日志"}],"a":["A"],"e":"**正确答案：A。** 用可视化看板呈现指标，配自动报告定期输出，并把不同模型版本放在一起对比。\n\n**为什么对：** 题干要\"高效汇报\"以及\"模型表现和成本趋势\"。趋势这类信息用图表比文字直观得多；自动报告省掉每次手工拉数的重复劳动；多版本并排则让业务方直接看到改动带来了什么变化。\n\n**其他选项为什么错：**\n- B. 口头总结：没有数据支撑，也留不下可追溯的记录。\n- C. 不发报告：业务方失去决策依据。\n- D. 只发原始日志：日志是给工程排查用的，业务方看不懂也看不过来。","s":"源#311"},{"id":"D5-015","d":5,"t":"single","q":"某企业使用 Bedrock 构建 RAG 系统，以 S3 存储桶为数据源的 Knowledge Base 存储紧急新闻视频内容。系统从 S3 检索转录文本、存档报告和相关文档。尽管使用了先进嵌入模型和高性能检索配置，用户反馈响应迟缓且结果不相关。企业发现向量搜索在过多内容类型和过长时间范围内评估了过多文档，微调底层模型无济于事。企业须通过更智能的约束提升检索准确性，且对现有架构改动最小。哪项方案可满足需求？","o":[{"l":"A","t":"用针对紧急新闻内容训练的领域自适应模型增强嵌入以改进向量相似性"},{"l":"B","t":"迁移到 OpenSearch Service。用向量字段和元数据过滤器限定检索范围"},{"l":"C","t":"在 Bedrock Knowledge Base 中启用元数据感知过滤，通过索引 S3 对象元数据约束检索"},{"l":"D","t":"迁移到 Q Business 索引，在检索时执行结构化元数据过滤和文档分类"}],"a":["C"],"e":"**正确答案：C。** Knowledge Base 元数据感知过滤。\n\n**为什么对：**元数据感知过滤允许基于索引元数据（内容类型、发布日期、来源、类别）约束检索查询，将向量搜索限制在语料库相关子集（如最近紧急报告或特定格式），显著减少评估文档数量改善Latency（延迟）和相关性。无需更改Embedding Model（嵌入模型）或检索基础设施，架构改动最小。当嵌入已足够强时，缩小候选集而非增加模型复杂度是 AWS 推荐的 RAG 优化方式。\n\n**其他选项为什么错：**\n- A.领域自适应模型：需重新训练嵌入模型，企业已确定微调无益\n- B.迁移到 OpenSearch：增加运营开销，偏离现有 Knowledge Base 架构\n- D.迁移到 Q Business：增加复杂性和实施工作量\n\n**关键概念：**Bedrock Knowledge Base 元数据感知过滤通过索引 S3 对象元数据缩小向量搜索范围，在不更改嵌入模型或基础设施的前提下提升检索精度。","s":"源#312"},{"id":"D5-016","d":5,"t":"single","q":"某企业升级了 Bedrock 驱动的 FM，该 FM 支撑一款多语言客服助手。升级后助手在不同语言间表现出行为不一致——相同问题在不同语言中生成不同响应。企业须实现方案以检测和应对未来更新中的类似问题。评估须在 45 分钟内覆盖所有支持语言，并行处理至少 15000 个测试对话，完全自动化并集成到 CI/CD 管道中。未达质量阈值时须阻止部署。哪项方案可满足需求？","o":[{"l":"A","t":"创建分布式流量模拟框架同时发送多语言翻译密集型工作负载。用 CloudWatch 监控延迟和吞吐量。发布前运行模拟识别瓶颈"},{"l":"B","t":"部署到多区域用 Route 53 延迟路由和 Global Accelerator。将多语言日志存入 S3。每周审计一致性"},{"l":"C","t":"创建预处理管道将传入消息规范化为一致格式。用规则检查标记幻觉。评估重点放在规范化文本上"},{"l":"D","t":"设置同义标准化多语言测试对话。用 Bedrock 模型评估任务并行运行测试。应用相似性和幻觉阈值。集成到 CI/CD 阻止未通过版本发布"}],"a":["D"],"e":"**正确答案：D。** 标准化多语言测试+Bedrock 评估任务+阈值+CI/CD 门控。\n\n**为什么对：**Bedrock Model Evaluation（模型评估）任务专为大规模可重复评估设计，并行化运行可在 45 分钟内处理 15000+ 对话。标准化测试对话每种语言表达相同意图，通过相似性指标比较不同语言输出可揭示语义回归。幻觉阈值确保答案有依据不引入虚构细节。集成到 CI/CD 管道实现全自动执行和硬性质量门控，未达阈值阻止部署防止回归进入生产。\n\n**其他选项为什么错：**\n- A.流量模拟：侧重基础设施瓶颈而非多语言响应质量\n- B.多区域+每周审计：部署后且太慢，无法防止回归\n- C.规范化输入：不衡量多语言输出等价性，无稳健量化指标\n\n**关键概念：**Bedrock 模型评估任务并行运行标准化多语言测试对话，通过相似性和幻觉阈值检测跨语言行为回归，CI/CD 集成实现自动化质量门控。","s":"源#313"},{"id":"D5-017","d":5,"t":"single","q":"某金融科技公司使用 Bedrock 为客服 AI 助手构建评估系统。助手须提供事实准确、符合金融法规且对话得体的理财建议。企业须将大规模自动化质量评估与对关键交互的有针对性人工审核相结合。哪项方案可满足需求？","o":[{"l":"A","t":"配置由金融专家手动对所有响应的准确性、合规性和对话质量评分的管道。用 SageMaker 笔记本分析结果"},{"l":"B","t":"配置用 Claude Sonnet 作为评判模型的 Bedrock 评估评估响应准确性和恰当性。配置护栏检查响应是否符合金融政策。为被标记的关键交互添加 A2I 人工审核"},{"l":"C","t":"创建 Lex 机器人管理交互。配置 Lambda 检查静态合规数据库。添加意图收集最终用户反馈"},{"l":"D","t":"配置 CloudWatch 监控响应模式。为潜在合规违规设告警。建立人工评估团队审核被标记交互"}],"a":["B"],"e":"**正确答案：B。** Bedrock 评估 LLM 评判+Guardrails（护栏）合规+A2I 人工审核。\n\n**为什么对：**Bedrock 评估用 LLM 作为评判模型对事实准确性、对话恰当性和策略一致性进行大规模自动评分。护栏提供策略执行层在响应违反合规约束时拦截或干预，防止不允许的金融指导模式。A2I 是托管人工审核服务，基于规则或置信度阈值将高风险或策略标记的交互路由给金融专家审核，将人工精力集中在最重要的事项上。三者组合实现可扩展评估加针对性人工监督。\n\n**其他选项为什么错：**\n- A.全手动评分：不可扩展，人工审核所有响应成本高\n- C.Lex+静态规则：静态规则不足以满足监管合规和事实准确性\n- D.CloudWatch 监控：提供监控但不提供结构化质量评估或策略执行\n\n**关键概念：**Bedrock 评估用 LLM 评判实现大规模自动化质量评分，护栏执行合规策略拦截违规响应，A2I 将高风险交互路由给人工审核实现针对性监督。","s":"源#314"},{"id":"D5-018","d":5,"t":"single","q":"某医疗机构计划开发概念验证应用，使用 Bedrock 自动汇总医疗文档。企业有 3 周时间验证应用准确性。应用须符合数据隐私政策，并包含评估汇总准确性和处理时间的指标。哪项方案可满足需求？","o":[{"l":"A","t":"创建含 50-100 份匿名患者记录的数据集。用安全 Knowledge Base 实施 RAG。用评判模型评估三个 FM 的准确性指标"},{"l":"B","t":"在患者记录上微调单个 FM。在 Bedrock 上部署。用 AgentCore 配置为代理。对 500 名员工做用户测试"},{"l":"C","t":"选择最强可用 FM。用 Converse API 创建聊天界面。仅用定性反馈在 50-100 份实际患者记录上测试。用自定义 Web 界面收集性能指标"},{"l":"D","t":"用 Strands SDK 部署连接多个含专业医疗文档 Knowledge Base 的多个代理。比较各代理响应。评估与现有系统集成"}],"a":["A"],"e":"**正确答案：A。** 匿名数据集+RAG+评判Model Evaluation（模型评估）三 FM。\n\n**为什么对：**RAG 在受监管医疗领域比微调更高效安全，使用匿名患者记录不将敏感数据泄露到模型永久记忆中。评判模型模式用强评估模型对多个候选 FM 的输出评分，提供事实一致性和完整性等客观指标，在 3 周时间内可定量快速评估准确性。安全 Knowledge Base 实施确保数据隐私合规。\n\n**其他选项为什么错：**\n- B.微调 FM：通常需超过 3 周准备数据并验证临床准确性\n- C.仅定性反馈+实际记录：定性反馈在时间限制内无法规模化，使用实际患者记录有隐私风险\n- D.Strands SDK+多代理：过于复杂不适合 3 周概念验证\n\n**关键概念：**RAG 配合匿名记录在受监管领域安全高效，评判模型对多 FM 输出定量评分实现快速准确评估，3 周内可完成概念验证。","s":"源#315"},{"id":"D5-019","d":5,"t":"single","q":"某企业希望为 AI 助手选择新 FM。开发人员须生成评估报告帮助数据科学家评估各 FM 的质量和安全性。数据科学家提供了示例提示用于评估。开发人员希望用 Bedrock 自动化报告生成和评估。哪项方案可满足需求？","o":[{"l":"A","t":"将示例提示合并为 JSON 文档。创建含该文档的 Knowledge Base。编写提示要求 FM 为每个示例生成响应。用 RetrieveAndGenerate API 为每个模型生成报告"},{"l":"B","t":"将示例提示合并为 JSONL 文档存入 S3。创建使用评估模型的 Bedrock 评估作业。S3 为输入，另一个 S3 为输出。为每个 FM 运行作业并将该 FM 选为生成器"},{"l":"C","t":"将示例提示合并为 JSONL 文档存入 S3。创建 Bedrock 评估作业。S3 为输入，QuickSight 为输出。为每个 FM 运行作业并将该 FM 选为评估器"},{"l":"D","t":"将示例提示合并为 JSON 文档创建 Knowledge Base。创建使用检索和响应生成评估类型的评估作业。S3 为输出。为每个 FM 运行"}],"a":["B"],"e":"**正确答案：B。** JSONL+S3+Bedrock 评估作业+FM 为生成器。\n\n**为什么对：**Bedrock 评估作业专为用一致提示集比较 FM 设计，JSONL 格式每行代表一条评估记录存入 S3 支持大规模读取。评估模型对生成输出按定义标准评分，候选 FM 配置为生成器——每次作业用选定 FM 为相同提示集生成答案后由评估模型评分。标准化输出写回 S3 供分析，支持可重复同类比较生成结构化评估报告。\n\n**其他选项为什么错：**\n- A.Knowledge Base+RetrieveAndGenerate：是 RAG 模式非评估框架，不产生标准化评分\n- C.QuickSight 为输出+FM 为评估器：评估输出传送到 S3 而非 BI 目标，候选 FM 应为生成器而非评估器\n- D.Knowledge Base+检索评估：要求是基于提示的Model Evaluation（模型评估）非检索质量评估\n\n**关键概念：**Bedrock 评估作业用 JSONL 数据集和评估模型对候选 FM 生成的输出评分，候选 FM 配置为生成器实现可重复同类比较。","s":"源#316"},{"id":"D5-020","d":5,"t":"single","q":"某医疗机构使用 Bedrock 构建 RAG 应用辅助临床决策。应用需确保病历数据召回的高精确度、自动侦测模型编造内容，同时削减人工复核开销。哪项方案可满足需求？","o":[{"l":"A","t":"用 Comprehend 分析分类 RAG 响应并提取医疗实体。用 Step Functions 编排评估。用 CloudWatch 跟踪实体识别置信度。低于阈值时告警"},{"l":"B","t":"实施用医疗微调模型评估所有响应的自动化 LLM 评估。部署 Lambda 并行化评估。结果发布到 CloudWatch"},{"l":"C","t":"配置 CloudWatch Synthetics 定期生成已知答案测试查询并跟踪成功率。设仪表板比较结果"},{"l":"D","t":"部署混合评估系统用 LLM 评判初步筛选响应，对边缘情况做针对性人工审查。用 Bedrock 内置评估跟踪检索精确度和幻觉率"}],"a":["D"],"e":"**正确答案：D。** LLM 评判初筛+针对性人工审查+Bedrock 内置评估。\n\n**为什么对：**AWS 推荐在高风险医疗领域采用分层评估策略。LLM 评判实现可扩展一致的自动化评估含事实依据、相关性和幻觉风险，显著减少需人工检查的响应数量。仅低于质量阈值或表现模糊的响应升级到人工审查，优化审核工作和成本。Bedrock 内置评估提供 RAG 专用标准化指标（检索精确度、源文档忠实度、幻觉率），与 Knowledge Base 和模型直接集成无需自建管道。\n\n**其他选项为什么错：**\n- A.Comprehend 实体置信度：无法可靠检测生成文本中的幻觉\n- B.微调评估模型+Lambda：需维护和扩缩单独的微调模型，增加复杂性和成本\n- C.CloudWatch Synthetics：回归测试有用但无法检测真实开放查询中的幻觉\n\n**关键概念：**LLM 评判自动筛选减少人工审核量，Bedrock 内置评估提供 RAG 专用指标（检索精确度、幻觉率），针对性人工审查处理边缘情况降低成本。","s":"源#317"},{"id":"D5-021","d":5,"t":"single","q":"某企业应用使用 Bedrock FM 处理和分析 50 至 200 页技术文档。当文档超过 FM 上下文窗口限制时，用户收到不一致响应和被截断的输出。哪项方案可解决此问题？","o":[{"l":"A","t":"将每个数据块配置为固定 4000 Token、20% 重叠。用应用逻辑顺序链接数据块直到达到 200000 Token 上下文窗口再做推理"},{"l":"B","t":"使用分层分块父块 8000 Token、子块 2000 Token。用 Knowledge Base 内置检索根据查询自动选择相关父块。配置重叠 Token"},{"l":"C","t":"使用语义分块断点百分位阈值 95%、缓冲区 3 句子。用 RetrieveAndGenerate API 根据嵌入相似度分数动态选择最相关数据块"},{"l":"D","t":"创建 Lambda 用分词器分析文档 Token 数。将文档分割为适合上下文窗口 80% 的等长段。独立处理每段后汇总"}],"a":["C"],"e":"**正确答案：C。** 语义分块+RetrieveAndGenerate 动态选择。\n\n**为什么对：**语义分块按含义而非固定 Token 数分割文档，通过断点百分位阈值和句子缓冲区保持内容连贯和语义完整，降低重要概念被分割的可能性。RetrieveAndGenerate API 为数据块生成嵌入并按与查询的相似度动态选择最相关数据块，确保 FM 只接收高价值上下文同时保持在窗口限制内，从根本上解决截断和不一致问题。\n\n**其他选项为什么错：**\n- A.顺序链接固定块：不符合 FM 处理上下文方式，有超出限制或引入无关信息风险\n- B.分层分块+大父块：改进结构但处理超大型文档时大父块可能导致效率低下\n- D.独立处理各段：导致全局上下文丢失和摘要不一致\n\n**关键概念：**语义分块按含义分割保持语义完整，RetrieveAndGenerate API 按嵌入相似度动态选择最相关数据块，确保 FM 接收高价值上下文且不超出窗口限制。","s":"源#318"},{"id":"D5-022","d":5,"t":"single","q":"某医疗企业使用 Bedrock 支撑临床文档摘要系统。系统在处理复杂临床文档时产生不一致的摘要，但在简单文档上表现良好。企业须实现方案以诊断不一致性、按既定指标比较提示性能并维护提示版本历史。哪项方案可满足需求？","o":[{"l":"A","t":"用 Prompt Management 创建多个提示变体。用简单文档手动测试。通过控制台部署性能最高版本"},{"l":"B","t":"在代码仓库中对提示实施版本控制并附含复杂文档和可量化评估指标的测试套件。用自动化测试框架比较提示版本并记录性能模式"},{"l":"C","t":"将每个新提示版本部署到单独 Bedrock API 端点。在端点间分配流量。用 CloudWatch 捕获指标和反馈自动选择版本"},{"l":"D","t":"在 Bedrock Flows 中创建自定义提示评估流将相同文档输入应用到不同变体。用 Comprehend Medical 分析评分事实准确性"}],"a":["B"],"e":"**正确答案：B。** 代码仓库版本控制+测试套件+自动化测试。\n\n**为什么对：**版本控制下的提示附带含复杂临床文档和可量化评估指标（事实准确性、完整性、一致性）的测试套件，可一致重现问题、跟踪回归并比较提示行为。自动化测试确保可扩展性和可重复性，版本历史保留提示演变过程。系统化诊断、可衡量比较和历史可追溯性三者兼备。\n\n**其他选项为什么错：**\n- A.Prompt Management+手动测试：缺乏客观指标，未处理复杂文档问题\n- C.多端点+流量分配：侧重实时实验但不诊断不一致性或保存详细历史评估\n- D.Flows+Comprehend Medical：引入不必要服务耦合，无稳健版本历史或自动化比较基准\n\n**关键概念：**代码仓库版本控制配合含复杂文档和量化指标的测试套件，自动化测试框架实现提示版本比较、回归跟踪和历史可追溯。","s":"源#319"},{"id":"D5-023","d":5,"t":"single","q":"某企业使用 Bedrock 实施基于 RAG 的系统向用户提供医疗信息。需对比不同文本切分方案、衡量两个 FM 的输出优劣，并在上线前设定量化达标门槛。哪种 Bedrock 评测配置可达成此目标？","o":[{"l":"A","t":"创建仅检索评估作业用 Claude Sonnet 为评估模型。配置上下文相关性和覆盖率指标。在单独 CI/CD 管道定义部署阈值"},{"l":"B","t":"创建检索并生成评估作业用自定义精确度-at-k 和 1-5 分 LLM 评判指标。在评估数据集中包含每种分块策略。用 Claude Sonnet 评估两个 FM 响应"},{"l":"C","t":"为每种分块策略和 FM 组合创建单独评估作业。用 Bedrock 内置指标评估正确性和完整性。部署前手动评审"},{"l":"D","t":"设置多个仅检索评估作业评估检索质量。为两个 FM 创建单独作业用 Nova Pro 为 LLM 评判。基于忠实度和引用精确度评估"}],"a":["B"],"e":"**正确答案：B。** 检索并生成评估+精确度-at-k+LLM 评判+多分块策略。\n\n**为什么对：**检索并生成评估作业评估完整 RAG 管道（检索和生成），将不同切分方案纳入评测数据集后可在统一条件下做横向对比。自定义精确度-at-k 衡量检索组件有效呈现相关数据块，LLM 评判为生成响应提供定性评分。用相同评估Model Evaluation（模型评估）两个 FM 确保评分一致性消除评估者偏见。数字评分支持自动化质量门禁，通过 CI/CD 实现部署阈值强制。\n\n**其他选项为什么错：**\n- A.仅检索评估：无法评估生成质量\n- C.手动评审：不可扩展且Latency（延迟）部署\n- D.分离检索和生成评估：难以将分块策略与最终输出质量关联\n\n**关键概念：**检索并生成评估作业评估完整 RAG 管道，评估数据集含多分块策略实现并排比较，LLM 评判提供一致性评分支持自动化质量门禁。","s":"源#320"},{"id":"D5-024","d":5,"t":"multiple","q":"某企业使用 Bedrock 为客户生成技术内容。最近在模型生成长篇技术文档摘要时出现大量虚构输出，包含不准确或编造的细节。当前方案使用大型 FM 配合基本单次提示将完整文档包含在单次输入中。企业须减少幻觉并达到事实准确性目标，每小时处理超过 1000 份文档且每份 3 秒内生成摘要。哪组方案组合可满足需求？（选择两项）","o":[{"l":"A","t":"实施零样本思维链指令要求模型逐步推理和事实验证"},{"l":"B","t":"使用带 Knowledge Base 的 RAG。应用语义分块和调优嵌入将摘要基于源内容"},{"l":"C","t":"配置 Bedrock 护栏阻止与幻觉内容模式匹配的输出"},{"l":"D","t":"在 Bedrock 中提高 temperature 参数"},{"l":"E","t":"提示 Bedrock 模型一次性对每份完整文档进行摘要"}],"a":["B","C"],"e":"**正确答案：B、C。**\n\n**为什么对：**\n- B.RAG+语义分块+调优嵌入：将长文档分割为有意义段落，模型只需检索最相关段落而非一次处理整份文档，从源头减少幻觉并提高事实准确性。高效扩展支持每小时 1000+ 份文档\n- C.Guardrails（护栏）阻止幻觉模式：在推理时检测并阻止类似幻觉的输出模式，性能开销极小适合 3 秒低Latency（延迟）要求，为 B 的基于源内容生成添加深度防御层\n\n**其他选项为什么错：**\n- A.思维链推理：显式推理步骤增加延迟和成本，不适合高Throughput（吞吐量）\n- D.提高 temperature：增加随机性使幻觉更严重\n- E.一次性摘要完整文档：重复现有有缺陷的方法\n\n**关键概念：**RAG 语义分块从源头基于源内容减少幻觉，护栏在推理时检测阻止幻觉模式，两者组合实现可扩展的准确生成和运行时保护。","s":"源#321"},{"id":"D5-025","d":5,"t":"single","q":"某企业将 AI 助手部署为使用 Amplify、AppSync GraphQL API 和 Bedrock Knowledge Bases 的 React 应用。应用通过 GraphQL API 调用 RetrieveAndGenerate API 进行知识库交互，配置 Lambda 解析器使用 RequestResponse 调用类型。使用者常反映请求超时与回复迟滞，复杂问题更频繁。企业须修复性能问题并改善用户体验。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Amplify AI Kit 从 GraphQL API 实现流式响应并优化客户端渲染"},{"l":"B","t":"增加 Lambda 解析器超时值。实现带指数退避的重试逻辑"},{"l":"C","t":"更新应用向 SQS 队列发送请求。更新 AppSync 解析器轮询和处理队列"},{"l":"D","t":"将 RetrieveAndGenerate API 改为 InvokeModelWithResponseStream API。用 API Gateway WebSocket API 支持流式响应"}],"a":["A"],"e":"**正确答案：A。** Amplify AI Kit 流式响应+客户端渲染优化。\n\n**为什么对：**当前 Lambda 解析器配置为同步 RequestResponse 行为，客户端在整个检索生成完成前不收到任何内容。使用 Amplify AI Kit 实现流式响应允许应用在模型生成 Token 时增量返回部分输出，改善感知响应性——用户立即看到答案形成。流式传输减轻可变模型Latency（延迟）和检索时间影响，客户端无需等待单个最终负载。区分「生成缓慢」和「无响应」，复杂问题反馈更快。\n\n**其他选项为什么错：**\n- B.增加超时+重试：可能恶化负载和成本，界面仍停滞，重试有重复Knowledge Bases（知识库）请求风险\n- C.SQS 轮询：引入笨拙的轮询模型增加运维复杂性，不改善交互性\n- D.替换 API+WebSocket：重大架构变更，当目标仅是修复超时和改善体验时不必要\n\n**关键概念：**Amplify AI Kit 从 GraphQL API 实现流式响应，模型生成 Token 时增量返回部分输出改善用户感知延迟，解决同步 RequestResponse 超时问题。","s":"源#322"},{"id":"D5-026","d":5,"t":"single","q":"某企业使用 Bedrock 生成客户查询的个性化响应。须搭建一套品质管控机制，在版本迭代时衡量提示词效能与模型参数表现。该机制需自动化对比若干提示方案的产出、甄别回复中的质量缺陷、输出可量化评测数据，同时支持审核人员对结果给出意见。未达到既定达标线的配置不得推送上线。哪项方案可满足需求？","o":[{"l":"A","t":"创建 Lambda 将示例查询发送到多个 Bedrock 配置并存入 S3。用 QuickSight 可视化。每日手动审查。用 CodePipeline 部署达标配置"},{"l":"B","t":"使用 Bedrock 评估任务比较模型输出，用自定义提示数据集。配置 CodePipeline 在提示模板更改时运行评估。仅部署超过预定义阈值的配置"},{"l":"C","t":"设置 CloudWatch 告警监控延迟和错误率。用 EventBridge 通知。在 Systems Manager 配置手动审批工作流"},{"l":"D","t":"用 Lambda 创建自动化测试框架采样生产流量路由到更新版本。用 Comprehend 情感分析比较。情感分下降则阻止"}],"a":["B"],"e":"**正确答案：B。** Bedrock 评估任务+自定义数据集+CodePipeline 门控。\n\n**为什么对：**评估任务专为可重复自动化评估提示有效性、模型行为和响应质量设计，支持定量指标和 LLM 评判检测细微质量退化。自定义提示数据集一致测试多个提示模板和配置消除实时流量变异性。集成到 CodePipeline 在提示模板或配置更改时自动触发质量检查，创建门控部署工作流——仅超过预定义阈值的配置被部署。人工审核人员通过审查评估结果和分数参与，无需手动数据收集。\n\n**其他选项为什么错：**\n- A.Lambda+S3+QuickSight+手动：自定义框架和间接信号增加复杂性降低可靠性\n- C.CloudWatch 告警+手动审批：侧重运维健康而非响应质量\n- D.Lambda+生产流量+情感分析：情感分数非质量指标，间接且不可靠\n\n**关键概念：**Bedrock 评估任务用自定义数据集可重复评估提示和模型质量，CodePipeline 集成实现自动触发质量门控，仅达标配置被部署。","s":"源#323"},{"id":"D5-027","d":5,"t":"multiple","q":"某电商企业构建内部平台，使用 Bedrock FM 开发 GenAI 应用。开发人员须基于与电商用例对齐的评估选择模型。平台须展示文本生成和摘要的准确性指标仪表板。企业拥有自定义电商数据集作为标准化评估输入。哪组步骤组合以最少运维开销满足需求？（选择两项）","o":[{"l":"A","t":"将数据集导入 S3。提供 IAM 权限和跨域资源共享权限使评估任务访问数据集"},{"l":"B","t":"将数据集导入 S3。提供 IAM 权限和 VPC 端点配置使评估任务访问数据集"},{"l":"C","t":"配置 Lambda 按计划在 Bedrock 控制台创建模型评估任务。提供含数据集的 S3 URI 为输入。配置评估任务测量文本生成 RWK 分数和摘要 BERTScore。配置第二个 Lambda 检查状态并发布日志到 CloudWatch。创建 Logs Insights 仪表板"},{"l":"D","t":"按计划用 SageMaker Clarify 创建评估任务。用开源框架运行标准化评估。结果发布到 CloudWatch 命名空间。用 Lambda 检查状态。创建仪表板"},{"l":"E","t":"按计划用 SageMaker AI 笔记本作业用 fmvelos 或 ragas 框架运行评估。在笔记本中编写直接 InvokeModel 调用处理响应。结果发布到 CloudWatch Logs。创建仪表板"}],"a":["B","C"],"e":"**正确答案：B、C。**\n\n**为什么对：**\n- B.S3 导入+IAM 权限+VPC 端点：将标准化评估输入放置在 S3 并授予评估工作流正确读取权限，VPC 端点配置符合企业网络要求，避免为评估者构建自定义存储\n- C.Lambda 调度评估任务+RWK/BERTScore+CloudWatch 仪表板：Lambda 按计划启动 Bedrock 评估任务用 S3 数据集为输入，第二个 Lambda 检查状态推送结果到 CloudWatch，CloudWatch 指标和日志可在仪表板可视化，运维开销最小\n\n**其他选项为什么错：**\n- A.CORS 权限：CORS 主要是浏览器访问问题，不解决服务到服务模式中评估任务安全访问 S3\n- D.SageMaker Clarify+开源框架：需更多环境管理、依赖控制和长期维护\n- E.SageMaker AI 笔记本+自定义代码：环境管理和依赖控制运维负担高\n\n**关键概念：**Bedrock Model Evaluation（模型评估）托管工作流配合 S3 数据集和 Lambda 调度实现标准化评估，结果发布到 CloudWatch 供仪表板可视化，运维开销最小。","s":"源#324"},{"id":"D5-028","d":5,"t":"single","q":"一家公司使用 Amazon Bedrock 构建了基于 Retrieval-Augmented Generation（RAG，检索增强生成）的系统，向用户提供医疗信息。该公司需要比较多种分块策略（chunking strategy），评估两个 Foundation Model（FM，基础模型）的生成质量，并为部署设定质量阈值（quality threshold）。哪种 Amazon Bedrock 评估配置可以满足这些要求？","o":[{"l":"A","t":"创建仅检索评估作业，该作业使用受支持的 Anthropic Claude Sonnet 版本作为评估器模型。配置上下文相关性和上下文覆盖范围的指标。在单独的 CI/CD 管道中定义部署阈值。"},{"l":"B","t":"创建一个检索和生成评估作业，该作业使用自定义的 precision-at-k 指标和范围为 1-5 的 LLM-as-a-judge 指标。将每个分块策略包含在评估数据集中。使用受支持的 Anthropic Claude Sonnet 版本来评估两个 FM 的响应。"},{"l":"C","t":"为每个分块策略和 FM 组合创建单独的评估作业。使用 Amazon Bedrock 内置指标来确保正确性和完整性。在部署批准之前手动审核分数。"},{"l":"D","t":"设置使用多个仅检索评估作业来评估检索质量的管道。为使用 Amazon Nova Pro 作为 LLM-as-a-judge 模型的两个 FM 创建单独的评估作业。根据忠实度和引用精度指标进行评估。"}],"a":["B"],"e":"**正确答案：B。** 创建一个同时涵盖检索与生成的评估作业，在同一数据集中纳入多种分块策略，使用同一评判模型对两个 FM 进行评分。\n\n**为什么对：** Amazon Bedrock 的\"检索和生成\"评估作业可端到端评估整条 RAG 管道——既衡量检索到的上下文是否相关，也衡量生成回答是否准确。将多种分块策略纳入同一评估数据集，就能在相同条件下并排对比；自定义 precision-at-k 指标衡量检索组件，LLM-as-a-judge 指标（范围 1-5）衡量生成质量；使用同一个受支持的 Anthropic Claude Sonnet 版本作为评判模型，可消除评分偏差并支持量化阈值。\n\n**其他选项为什么错：**\n- A. 仅创建检索评估作业：只衡量检索环节，无法评估生成质量；且\"在单独 CI/CD 管道中定义部署阈值\"与 Bedrock 评估作业的内置阈值功能脱节。\n- C. 为每种组合分别创建评估作业并手动审核：手动审核无法扩展，也会延迟部署，且缺少统一的量化比较基线。\n- D. 将检索和生成评估分开运行：拆开后很难把分块策略与最终输出质量关联起来，失去端到端视角。\n\n**关键概念：** Amazon Bedrock Evaluation Job 支持\"Retrieval and Generation\"类型，可同时评估检索精度与生成忠实度；LLM-as-a-judge 提供可重复的定性评分。","s":"源#325"},{"id":"D5-029","d":5,"t":"single","q":"一家公司想为其 AI 助手选择一个新的 Foundation Model（FM，基础模型）。GenAI 开发人员需要生成评估报告，帮助数据科学家评估各候选 FM 的质量与安全性。数据科学家已为开发人员提供了用于评估的示例 Prompt（提示词）。开发人员希望使用 Amazon Bedrock 来自动化报告生成与评估流程。哪种方案可以满足这一要求？","o":[{"l":"A","t":"将示例提示合并到单个 JSON 文档中。使用该文档创建 Amazon Bedrock 知识库。编写一个提示，要求 FM 生成对每个示例提示的响应。使用 RetrieveAndGenerate API 为每个模型生成报告。"},{"l":"B","t":"将示例提示合并到单个 JSONL 文档中。将文档存储在 Amazon S3 存储桶中。创建使用判断模型的 Amazon Bedrock 评估作业。将 S3 位置指定为输入，并将不同的 S3 位置指定为输出。为每个 FM 运行评估作业并选择 FM 作为生成器。"},{"l":"C","t":"将示例提示合并到单个 JSONL 文档中。将文档存储在 Amazon S3 存储桶中。创建使用判断模型的 Amazon Bedrock 评估作业。将 S3 位置指定为输入，将 Amazon QuickSight 指定为输出。为每个 FM 运行评估作业并选择 FM 作为评估者。"},{"l":"D","t":"将示例提示合并到单个 JSON 文档中。根据文档创建 Amazon Bedrock 知识库。创建使用检索和响应生成评估类型的 Amazon Bedrock 评估作业。指定 Amazon S3 存储桶作为输出。为每个 FM 运行评估作业。"}],"a":["B"],"e":"**正确答案：B。** 将示例提示词合并为 JSONL 文件并存入 Amazon S3，创建使用判别模型（judge model）的 Amazon Bedrock 评估作业，分别以每个候选 FM 作为生成器运行评估，输出写回另一个 S3 位置。\n\n**为什么对：** Amazon Bedrock 评估作业原生支持此工作流：输入须为 JSONL 格式，每行对应一条评估记录，存放在 S3 中；判别模型对各候选 FM 生成的回答按统一标准打分，产出结构化评估报告；为每个 FM 各运行一次并指定其为生成器（generator），可实现可重复的同类比较；输出自动写入 S3 供下游分析和共享。\n\n**其他选项为什么错：**\n- A. 创建知识库并使用 RetrieveAndGenerate API：这是 RAG 模式，只能产生回答，不能产出适合模型选择的标准化评分报告。\n- C. 将输出指向 Amazon QuickSight、FM 作为评估器：Bedrock 评估作业的输出目标只能是 S3，不能直接写入 QuickSight；而且应让候选 FM 做生成器、用稳定的判别模型做评估器，角色不应反转。\n- D. 创建知识库并使用\"检索和响应生成\"评估类型：本场景是基于提示词的模型评估，而非检索质量评估，知识库和检索评估类型均不适用。","s":"源#326"},{"id":"D5-030","d":5,"t":"single","q":"一家公司将 AI 助手部署为 React 应用，该应用使用 AWS Amplify、AWS AppSync GraphQL API 以及 Amazon Bedrock Knowledge Bases（Bedrock 知识库）。应用通过 GraphQL API 调用 Amazon Bedrock 的 RetrieveAndGenerate API 与知识库交互，Lambda 解析器（resolver）配置为 RequestResponse（同步）调用类型。用户反馈频繁超时和响应缓慢，复杂问题尤甚。需要一个方案来解决这些性能问题并提升用户体验。哪种方案可以满足要求？","o":[{"l":"A","t":"使用 AWS Amplify AI Kit 实现来自 GraphQL API 的流式响应并优化客户端渲染。"},{"l":"B","t":"增加 Lambda 解析器的超时值。使用指数退避实现重试逻辑。"},{"l":"C","t":"更新应用程序以将 API 请求发送到 Amazon SQS 队列。更新 AWSAppSync Resolver 以轮询和处理队列。"},{"l":"D","t":"将 RetrieveAndGenerate API 更改为 InvokeModelWithResponseStream API。更新应用程序以使用 Amazon API Gateway WebSocket API 来支持流式响应。"}],"a":["A"],"e":"**正确答案：A。** 使用 AWS Amplify AI Kit 实现来自 GraphQL API 的流式响应（streaming response），并优化客户端渲染。\n\n**为什么对：** 当前架构使用同步 RequestResponse 调用，客户端必须等到整个检索和生成流程完成才能收到数据；对耗时较长的知识库查询，这很容易触发超时且用户界面会出现停顿。Amplify AI Kit 在现有 AppSync + Amplify 架构内原生支持流式传输，让模型生成的 token 逐步返回客户端；用户可以立即看到回答逐步形成，感知延迟大幅降低，同时避免了同步路径的超时风险。\n\n**其他选项为什么错：**\n- B. 增加 Lambda 超时并加重试：超时增大只是推迟问题，重试还会放大调用量和成本，用户仍然看到停顿的界面。\n- C. 将请求发到 Amazon SQS 队列并让解析器轮询：为 GraphQL 交互引入轮询模型，复杂度显著增加却没有从根本上改善交互体验。\n- D. 改用 InvokeModelWithResponseStream API 并引入 API Gateway WebSocket API：绕开知识库的 RetrieveAndGenerate 调用路径并额外引入 WebSocket 层，属于重大架构改造，远超\"修复超时并改进 UX\"的目标。","s":"源#327"},{"id":"D5-031","d":5,"t":"single","q":"一家医疗公司使用 Amazon Bedrock 为临床文档摘要系统提供支持。处理复杂临床文档时，系统生成不一致的摘要；而在简单文档上表现良好。公司需要一种方案来诊断不一致问题、将即时性能与既定指标进行比较，并维护提示词（prompt）版本的历史记录。哪种方案可以满足这些要求？","o":[{"l":"A","t":"使用 Amazon Bedrock 中的提示管理创建多个提示变体。使用简单的临床文档手动测试提示。使用 Amazon Bedrock 控制台部署性能最高的版本。"},{"l":"B","t":"使用包含复杂临床文档和可量化评估指标的测试套件对代码存储库中的提示实施版本控制。使用自动化测试框架来比较提示版本和文档性能模式。"},{"l":"C","t":"将每个新提示版本部署到单独的 Amazon Bedrock API 终端节点。在端点之间分割生产流量。配置 Amazon CloudWatch 以捕获响应指标和用户反馈以自动选择版本。"},{"l":"D","t":"在 Amazon Bedrock Flows 中创建自定义提示评估流程，将相同的临床文档输入应用于不同的提示变体。使用 Amazon Comprehend Medical 对每个版本的事实准确性进行分析和评分。"}],"a":["B"],"e":"**正确答案：B。** 在代码仓库中对提示词实施版本控制，并用包含复杂临床文档和可量化评估指标的测试套件进行自动化测试，使用自动化测试框架比较不同提示词版本在各类文档上的性能表现。\n\n**为什么对：** 将提示词纳入版本控制后，可追踪每次变更并随时回溯到历史版本——满足\"维护历史记录\"的要求。针对复杂临床文档编写测试套件并使用可量化指标（如事实准确率、完整性、一致性），可系统性地重现问题和诊断回归——满足\"诊断不一致\"的要求。自动化测试框架确保评估可扩展、可重复，并能将即时性能与既定基线比较。\n\n**其他选项为什么错：**\n- A. 创建多个提示词变体并手动测试：缺乏客观量化指标，且仅用简单文档测试无法暴露复杂文档上的问题。\n- C. 为每个版本部署独立端点并分割生产流量：侧重实时流量实验，但本身不诊断提示词级别的不一致，也不保留详细的历史评估记录。\n- D. 在 Bedrock Flows 中创建评估流程并用 Amazon Comprehend Medical 评分：引入了不必要的服务耦合，且不提供提示词版本历史或自动化基线比较。","s":"源#328"},{"id":"D5-032","d":5,"t":"single","q":"一家金融科技公司正在使用 Amazon Bedrock 为其客服 AI 助手构建评估体系。助手必须提供事实准确、符合金融法规且对话得体的财务建议。公司需要将大规模自动化质量评估与对关键交互的针对性人工审核结合起来。哪种方案可以满足这些要求？","o":[{"l":"A","t":"配置一个管道，让财务专家手动对所有回复的准确性、合规性和对话质量进行评分。使用 Amazon SageMaker 笔记本分析结果以确定改进领域。"},{"l":"B","t":"配置 Amazon Bedrock 评估，使用 Anthropic Claude Sonnet 作为判断模型来评估响应的准确性和适当性。配置自定义 Amazon Bedrock 护栏以检查响应是否符合财务政策。添加 Amazon Augmented AI(AmazonA2I) 人工评论以标记关键交互。"},{"l":"C","t":"创建 Amazon Lex 机器人来管理客户服务交互。配置 AWS LambdaFunctions 以根据静态合规性数据库检查响应。配置调用 Lambda 函数的意图。添加额外的意图来收集最终用户评论。"},{"l":"D","t":"配置 Amazon CloudWatch 以监控 AI 助手的响应模式。配置 CloudWatch 警报以发现潜在的合规性违规行为。建立一个人类评估员团队来审查标记的交互。"}],"a":["B"],"e":"**正确答案：B。** 配置 Amazon Bedrock 评估（使用 Anthropic Claude Sonnet 作为判别模型评估准确性和适当性）、配置自定义 Amazon Bedrock Guardrails（护栏）检查回答是否符合财务政策、添加 Amazon Augmented AI（Amazon A2I）人工评论以标记关键交互。\n\n**为什么对：** Bedrock 评估作业可大规模、可重复地对回答的事实准确性和对话适当性进行自动评分——满足\"大规模自动化质量评估\"。Bedrock Guardrails 提供专用策略执行层，可在回答违反合规约束时阻止或干预——满足\"符合金融法规\"。Amazon A2I 是托管人工审阅服务，可根据规则或置信阈值将特定交互路由给合格的财务专家——满足\"对关键交互的针对性人工审核\"。三者组合完整覆盖所有要求。\n\n**其他选项为什么错：**\n- A. 财务专家手动对所有回复评分：完全手动无法扩展，违反\"大规模自动化\"要求。\n- C. 使用 Amazon Lex 和 Lambda 基于静态合规数据库检查：静态规则不足以保证事实准确性和语义合规性，且最终用户反馈不能替代专家审核。\n- D. 使用 CloudWatch 监控响应模式并设警报：只提供运营监控，不提供结构化的质量评估或策略执行。","s":"源#329"},{"id":"D5-033","d":5,"t":"single","q":"一家电商公司正在开发一款生成式 AI 应用，使用 Amazon Bedrock 和 Anthropic Claude 向客户推荐产品。客户反馈某些推荐产品在网站上无法购买或与自身无关；部分推荐的响应时间也很长。公司调查后发现多数客户交互都是独特的（unique），且系统推荐的产品不在公司产品目录中。公司需要解决这些问题。哪种方案可以满足要求？","o":[{"l":"A","t":"增加亚马逊基岩护栏内的接地。启用自动推理检查。设置预置吞吐量。"},{"l":"B","t":"使用即时工程来限制模型对相关产品的响应。使用 InvokeModelWithResponseStream 操作等流技术来减少客户感知的延迟。"},{"l":"C","t":"创建 Amazon Bedrock 知识库。实施检索增强生成 RAG。将 PerformanceConfigLatency 参数设置为优化。"},{"l":"D","t":"将产品目录数据存储在 Amazon OpenSearch Service 中。根据产品目录验证模型的产品推荐。使用 Amazon DynamoDB 实施响应缓存。"}],"a":["C"],"e":"**正确答案：C。** 创建 Amazon Bedrock Knowledge Bases（Bedrock 知识库），实施 Retrieval-Augmented Generation（RAG，检索增强生成），并将 PerformanceConfigLatency 参数设置为 optimized。\n\n**为什么对：** 模型推荐了目录中不存在的产品——这是典型的\"幻觉\"问题，根源在于模型仅依赖参数记忆而非真实产品数据。将产品目录导入 Bedrock 知识库并实施 RAG，模型在推理时只能基于检索到的目录条目生成回答，从根本上避免虚构产品。PerformanceConfigLatency 设为 optimized 后，Bedrock 可优先走低延迟推理路径，直接改善响应速度。多数交互是独特的，说明缓存命中率极低，因此缓存方案效果有限，改进检索和推理路径才是更优方向。\n\n**其他选项为什么错：**\n- A. 添加 Guardrails 中的 Grounding（接地）+ 自动推理检查 + 预置吞吐量：Guardrails 能检测或阻止某些不安全输出，但无法确保每条推荐都来自产品目录；预置吞吐量改善延迟的方式是预留容量而非优化检索路径。\n- B. 使用 Prompt Engineering（提示词工程）限制回答范围 + 流式推理：提示词约束不足以防止幻觉，模型仍可能编造产品；流式推理改善感知延迟但不解决准确性。\n- D. 将产品目录存入 Amazon OpenSearch Service 并用 DynamoDB 缓存：自建验证和缓存层增加了运维复杂度，且缓存对大量独特交互效果有限，不如 RAG 直接从源头解决相关性和准确性。","s":"源#330"},{"id":"D5-034","d":5,"t":"single","q":"一家公司升级了其由 Amazon Bedrock 驱动的 Foundation Model（FM，基础模型），该模型支持多语言客服助手。升级后，助手在不同语言中表现出不一致的行为——对相同问题用某些语言给出了不同的回答。公司需要一种方案来检测和解决此类问题，以便后续更新时使用。评估必须在 45 分钟内完成所有语言、并行处理至少 15,000 个测试对话、完全自动化并集成到 CI/CD 管道中，且在未满足质量阈值时阻止部署。哪种方案可以满足这些要求？","o":[{"l":"A","t":"创建一个分布式交通模拟框架，以多种语言同时向助手发送翻译繁重的工作负载。使用 Amazon CloudWatch 指标监控延迟、并发性和吞吐量。在生产发布之前运行模拟以识别基础设施瓶颈。"},{"l":"B","t":"使用 Amazon Route 53 基于延迟的路由和 AWS Global Accelerator 在多个 AWS 区域部署助手，以提高全局性能。将多语言对话日志存储在 Amazon S3 中。每周执行部署后审核以审查一致性。"},{"l":"C","t":"创建一个预处理管道，在将消息发送给助手之前将所有传入消息规范化为一致的格式。应用基于规则的检查来标记输出中潜在的幻觉。将评估重点放在规范化文本上，以简化跨语言的测试。"},{"l":"D","t":"建立具有相同含义的标准化多语言测试对话。使用 Amazon Bedrock 模型评估作业并行运行测试对话。应用相似性和幻觉阈值。将流程集成到 CI/CD 管道中以阻止失败的发布。"}],"a":["D"],"e":"**正确答案：D。** 建立具有相同语义的标准化多语言测试对话，使用 Amazon Bedrock 模型评估作业（Model Evaluation Job）并行运行测试对话，应用相似度和幻觉阈值，并将流程集成到 CI/CD 管道中以阻止失败的发布。\n\n**为什么对：** 核心问题是等效输入在不同语言间产生了语义不一致的输出。标准化多语言测试对话确保每种语言版本表达相同意图，通过 Bedrock 评估作业并行运行可满足 15,000 个对话和 45 分钟的吞吐要求。相似度指标可量化跨语言输出的一致性，幻觉阈值防止模型编造细节。集成到 CI/CD 管道后可在每次更新时自动执行，质量不达标即阻止部署。\n\n**其他选项为什么错：**\n- A. 创建分布式流量模拟框架并用 CloudWatch 监控延迟：侧重性能和基础设施瓶颈，不评估多语言响应的语义质量。\n- B. 多区域部署 + 基于延迟的路由 + 每周部署后审核：属于部署后的手动审核，速度太慢且无法在部署前阻止回归。\n- C. 将传入消息规范化为统一格式并用规则检查幻觉：规范化输入不能衡量多语言输出的等效性，基于规则的检查也不提供稳健的量化门控。","s":"源#331"},{"id":"D5-035","d":5,"t":"single","q":"一个企业应用使用 Amazon Bedrock Foundation Model（FM，基础模型）处理和分析 50 至 200 页的技术文档。当文档超出 FM 的 Context Window（上下文窗口）限制时，用户会遇到不一致的响应和截断的输出。哪种方案可以解决这个问题？","o":[{"l":"A","t":"为每个块配置 4,000 个标记的固定大小分块，重叠率为 20%。使用应用程序级逻辑按顺序链接多个块，直到在进行推理调用之前达到 FM 的最大上下文窗口 200,000 个令牌。"},{"l":"B","t":"使用分层分块，父块包含 8,000 个令牌，子块包含 2,000 个令牌。使用 Amazon Bedrock 知识库内置检索根据查询上下文自动选择相关父块。配置重叠标记以保持语义连续性。"},{"l":"C","t":"使用语义分块，断点百分位阈值为 95%，缓冲区大小为 3 个句子。使用 RetrieveAndGenerate API 根据嵌入的相似度分数动态选择最相关的块。"},{"l":"D","t":"创建一个预处理 AWS Lambda 函数，使用 FM 的标记生成器分析文档标记计数。配置 Lambda 函数以将文档分割为适合上下文窗口 80% 范围内的相等片段。配置 Lambda 函数以在聚合结果之前独立处理每个段。"}],"a":["C"],"e":"**正确答案：C。** 使用语义分块（semantic chunking），设置断点百分位阈值为 95%、缓冲区大小为 3 个句子，并通过 RetrieveAndGenerate API 根据嵌入相似度分数动态选择最相关的块。\n\n**为什么对：** 截断和不一致的根源在于输入超出 FM 的上下文窗口。语义分块按含义而非固定 token 数来切分文档，95% 断点阈值加 3 句缓冲区确保每个块语义完整且连贯，降低了重要概念被割裂到多个块的风险。RetrieveAndGenerate API 专为处理超出上下文窗口的大型文档而设计——它先生成块的向量嵌入，再根据与用户查询的相似度动态选取最相关的块送入 FM，确保模型只接收高价值上下文且不超出窗口限制。\n\n**其他选项为什么错：**\n- A. 固定 4,000 token 分块并按顺序链接至 200K token 上限：顺序拼接方式与 FM 处理上下文的机制不匹配，存在超出限制或引入大量无关信息的风险。\n- B. 分层分块（父块 8,000 token、子块 2,000 token）+ Bedrock 知识库内置检索：结构有所改善，但较大的父块在处理超长文档时仍可能效率低下。\n- D. 用 Lambda 函数按 80% 窗口分割文档并独立处理每段后聚合：独立处理各段会丢失全局上下文，汇总结果往往不一致。","s":"源#332"},{"id":"D5-036","d":5,"t":"single","q":"一家电商公司正在开发一款生成式 AI 解决方案，使用 Amazon Bedrock 和 Anthropic Claude 向客户推荐产品。客户反馈某些推荐产品无法购买或不相关，部分建议的响应时间也很长。公司确认多数客户交互是独特的，且系统推荐了产品目录中不存在的产品。哪种方案可以满足要求？","o":[{"l":"A","t":"增加亚马逊基岩护栏内的接地。启用自动推理检查。设置预置吞吐量。"},{"l":"B","t":"使用即时工程来限制模型对相关产品的响应。使用流推理来减少感知延迟。"},{"l":"C","t":"创建 Amazon Bedrock 知识库并实施检索增强生成 (RAG)。将 PerformanceConfigLatency 参数设置为优化。"},{"l":"D","t":"将产品目录数据存储在 Amazon OpenSearch Service 中。根据目录验证模型建议。使用 Amazon DynamoDB 进行响应缓存。"}],"a":["C"],"e":"**正确答案：C。** 创建 Amazon Bedrock Knowledge Bases（Bedrock 知识库）并实施 Retrieval-Augmented Generation（RAG，检索增强生成），将 PerformanceConfigLatency 参数设为 optimized。\n\n**为什么对：** 推荐了目录中不存在的产品是典型的模型幻觉问题。将产品目录导入 Bedrock 知识库并通过 RAG 实现检索增强后，FM 在推理时仅基于实际存在的目录条目生成回答，从根本上防止虚构产品。PerformanceConfigLatency 设为 optimized 可让 Bedrock 优先选择低延迟的检索和推理路径，直接改善响应速度。由于多数交互是独特的，缓存命中率极低，因此缓存方案效果有限。\n\n**其他选项为什么错：**\n- A. 添加 Guardrails 中的 Grounding + 自动推理检查 + 预置吞吐量：Guardrails 无法保证每条推荐都来自产品目录，预置吞吐量改善延迟的方式不如优化检索路径直接。\n- B. 用 Prompt Engineering（提示词工程）限制回答 + 流式推理减少感知延迟：提示词约束不足以防止幻觉，流式推理改善感知但不解决准确性。\n- D. 将目录存入 Amazon OpenSearch Service 并用 DynamoDB 缓存：自建验证和缓存层增加复杂度，且缓存对大量独特交互无效。","s":"源#333"},{"id":"D5-037","d":5,"t":"single","q":"一家公司正在使用 Amazon Bedrock 和 Agent Squad 构建一个多云生成式 AI 密钥解析（secrets resolution）应用。该应用从多个来源（包括密钥库和硬件安全模块 HSM）解析密钥，使用 AWS Lambda 函数检索密钥，通过 AWS AppConfig 实现动态功能开关，支持密钥链式传递并检测密钥漂移（drift）。应用还处理短期和过期密钥，并支持模板化指令的 Prompt Flow（提示词流）。应用使用 AWS Step Functions 编排代理以解析密钥并管理密钥验证和漂移检测。测试中发现以下问题：应用未及时刷新过期密钥供代理使用；应用发送了密钥漂移警报但代理仍使用陈旧数据；应用内的提示词流复用了过时的模板导致级联故障。公司必须解决这些性能问题。哪种方案可以满足要求？","o":[{"l":"A","t":"使用 Step Functions 映射状态并行运行代理工作流。通过 Lambda 函数输出传递更新的秘密元数据。使用 AWS AppConfig 对所有提示流进行版本控制，以控制和回滚错误模板。"},{"l":"B","t":"仅使用 Amazon Bedrock 代理。配置 Amazon Bedrock 护栏以限制即时变化。对单个代理的工作流定义使用内联 JSON 架构来链接工具调用。"},{"l":"C","t":"使用集中式 Amazon EventBridge 管道来调用每个代理。将中间提示存储在 Amazon DynamoDB 中。通过使用基于 TTL 的退避和重试来解决代理排序问题。"},{"l":"D","t":"使用 Amazon EventBridge Pipes 根据 Amazon CloudWatch 日志模式调用解析器。使用 TTL 和版本化写入将响应元数据存储在 DynamoDB 中。使用 AmazonQ Developer 动态生成后备提示。"}],"a":["A"],"e":"**正确答案：A。** 使用 Step Functions Map 状态并行运行代理工作流，通过 Lambda 函数输出传递更新后的密钥元数据，并使用 AWS AppConfig 对所有提示词流进行版本控制以便控制和回滚错误模板。\n\n**为什么对：** 三个问题逐一对应解决。Step Functions Map 状态可并行执行密钥解析工作流，缩短刷新延迟，确保代理使用前密钥已刷新。通过 Lambda 输出传递更新后的密钥元数据，保证后续步骤始终使用最新解析值，防止代理在漂移警报后仍用旧数据。AWS AppConfig 原生支持配置工件的版本控制、验证、分阶段部署和回滚——通过它管理提示词流，可立即回滚有缺陷的模板并防止级联故障。整个方案保留了现有的 Step Functions 编排架构，改动最小。\n\n**其他选项为什么错：**\n- B. 仅使用 Amazon Bedrock 代理 + Guardrails + 内联 JSON 架构：过度简化了架构，且未解决密钥生命周期或漂移问题，也没有提示词版本控制。\n- C. 使用集中式 EventBridge 管道调用代理 + DynamoDB 存中间提示词 + 基于 TTL 的退避重试：引入了事件驱动排序的复杂性，但未解决提示词版本控制问题。\n- D. 使用 EventBridge Pipes 按日志模式调用解析器 + DynamoDB 存响应 + Amazon Q Developer 动态生成备用提示词：引入了不必要的工具和动态提示词生成风险。","s":"源#334"},{"id":"D5-038","d":5,"t":"single","q":"一家公司有一个客服应用，使用 Amazon Bedrock 生成对客户查询的个性化回复。公司需要建立质量保证流程来评估提示词（prompt）更新后的有效性和模型配置。该流程必须自动比较多个提示词模板的输出、检测响应质量问题、提供定量指标、允许人工审阅者提供反馈，并防止部署不满足预定义质量阈值的配置。哪种方案可以满足这些要求？","o":[{"l":"A","t":"创建一个 AWS Lambda 函数，将示例客户查询发送到多个 Amazon Bedrock 模型配置并将响应存储在 Amazon S3 中。使用 Amazon QuickSight 可视化响应模式。每天手动检查输出。使用 AWS CodePipeline 部署满足质量阈值的配置。"},{"l":"B","t":"使用 Amazon Bedrock 评估作业通过自定义提示数据集来比较模型输出。配置 AWS CodePipeline 以在提示模板更改时运行评估作业。配置 CodePipeline 以仅部署超出预定义质量阈值的配置。"},{"l":"C","t":"设置 Amazon CloudWatch 警报以监控 Amazon Bedrock 的响应延迟和错误率。使用 Amazon EventBridge 规则在超过阈值时通知团队。在 AWS Systems Manager 中配置手动审批工作流程。"},{"l":"D","t":"使用 AWS Lambda 函数创建一个自动化测试框架，对生产流量进行采样并将重复请求路由到更新的模型版本。使用 Amazon Comprehend 情绪分析来比较结果。如果情绪分数下降，则阻止部署。"}],"a":["B"],"e":"**正确答案：B。** 使用 Amazon Bedrock 评估作业（Evaluation Job）通过自定义提示词数据集比较模型输出，配置 AWS CodePipeline 在提示词模板变更时运行评估作业，并仅部署超出预定义质量阈值的配置。\n\n**为什么对：** Amazon Bedrock 评估作业专为以可重复、自动化的方式评估提示词有效性和模型行为而构建。它支持定量指标和基于 LLM 的判别，可检测简单情绪分析或延迟指标无法捕获的微妙响应质量回归。通过自定义提示词数据集，可在相同输入上一致地测试多个模板和模型配置。直接集成到 CodePipeline 后，每当模板或配置变更时自动触发评估，仅升级达标的配置，形成门控部署工作流——满足\"防止低质量配置部署\"的要求。人工审阅者可通过审查评估报告和分数来提供反馈。\n\n**其他选项为什么错：**\n- A. Lambda 发送查询到多模型配置 + QuickSight 可视化 + 每天手动检查：依赖手动审核，不满足自动化要求；QuickSight 是可视化工具，不提供自动化质量度量。\n- C. CloudWatch 警报监控延迟和错误率 + EventBridge 通知 + Systems Manager 手动审批：关注运营状况而非响应质量。\n- D. Lambda 采样生产流量路由到新模型版本 + Comprehend 情感分析比较：仅靠情感分析不足以检测响应质量问题，也无法提供全面的 GenAI 定量指标。","s":"源#335"},{"id":"D5-039","d":5,"t":"single","q":"一家公司使用 Amazon Bedrock 构建了一个 Retrieval-Augmented Generation（RAG，检索增强生成）系统。该系统使用基于 Amazon S3 存储桶的 Amazon Bedrock Knowledge Bases（Bedrock 知识库）作为紧急新闻视频内容的数据源，从 S3 检索文字记录、存档报告和相关文档。系统已使用先进的嵌入模型（embedding model）和高性能检索配置。但用户反馈响应缓慢且结果不相关，用户满意度下降。公司注意到向量搜索正在评估太多内容类型和较长时间跨度的文档，确认基础模型不会从额外微调中受益。公司需要通过施加更智能的约束来提高检索精度，且希望对现有架构进行最小更改。哪种方案可以满足这些要求？","o":[{"l":"A","t":"通过使用专门针对紧急新闻内容进行训练的领域适应模型来增强嵌入，以提高矢量相似性。"},{"l":"B","t":"迁移到 Amazon OpenSearch 服务。使用向量字段和元数据过滤器来定义结果检索的范围。"},{"l":"C","t":"通过对 S3 对象元数据建立索引，在 Amazon Bedrock 知识库中启用元数据感知过滤。"},{"l":"D","t":"迁移到 Amazon Q Business 索引以在检索期间执行结构化元数据过滤和文档分类。"}],"a":["C"],"e":"**正确答案：C。** 通过对 S3 对象元数据建立索引，在 Amazon Bedrock Knowledge Bases 中启用元数据感知过滤（metadata-aware filtering）。\n\n**为什么对：** 问题根源是检索范围过于宽泛——向量搜索扫描了所有内容类型和时间跨度的文档。Bedrock 知识库原生支持元数据感知过滤，可在检索时根据索引元数据（如内容类型、发布日期、来源、类别）限制查询范围。对 S3 对象元数据建立索引后，公司可将向量搜索范围限定在相关子集（如最近的紧急报告或特定内容格式），从而在不改变嵌入模型或检索基础设施的前提下同时改善延迟和结果相关性。这符合 AWS 优化 RAG 系统的最佳实践：当嵌入已足够好时，通常应通过缩小候选集而非增加模型复杂度来提升检索质量。\n\n**其他选项为什么错：**\n- A. 用领域适应模型增强嵌入：公司已确认基础模型不会从额外微调中受益，方向不对。\n- B. 迁移到 Amazon OpenSearch Service 并定义过滤器：引入了额外的服务迁移，偏离了现有 Bedrock 知识库架构，增加运营开销。\n- D. 迁移到 Amazon Q Business 索引：同样需要迁移到不同的索引服务，增加复杂度和实施工作量。","s":"源#336"},{"id":"D5-040","d":5,"t":"single","q":"一家医疗保健公司正在使用 Amazon Bedrock 构建 Retrieval-Augmented Generation（RAG，检索增强生成）应用，帮助临床从业人员做出决策。应用必须实现患者信息检索的高精度、识别生成内容中的幻觉（hallucination），并降低人工审核成本。哪种方案可以满足这些要求？","o":[{"l":"A","t":"使用 Amazon Comprehend 对 RAG 响应进行分析和分类并提取医疗实体和关系。使用 AWS Step Functions 协调自动化评估。配置 Amazon CloudWatch 指标以跟踪实体识别置信度分数。配置 CloudWatch 以在准确性低于指定阈值时发送警报。"},{"l":"B","t":"实施基于大语言模型 (LLM) 的自动化评估，该评估使用专门的模型，该模型针对医疗内容进行了微调，以评估所有响应。部署 AWS Lambda 函数以并行化评估。将结果发布到跟踪相关性和事实准确性的 Amazon CloudWatch 指标。"},{"l":"C","t":"配置 Amazon CloudWatch Synthetics 以定期生成具有已知答案的测试查询，并跟踪模型成功率。设置仪表板，将综合测试结果与预期结果进行比较。"},{"l":"D","t":"部署一个混合评估系统，该系统使用自动化的法学硕士作为法官评估来初步筛选回答并针对边缘情况进行有针对性的人工审查。使用内置的 Amazon Bedrock 评估来跟踪检索精度和幻觉率。"}],"a":["D"],"e":"**正确答案：D。** 部署混合评估系统——使用自动化的 LLM-as-a-judge（LLM 充当评判者）评估初步筛选回答，并对边缘情况进行针对性的人工审核；同时使用内置的 Amazon Bedrock 评估来跟踪检索精度和幻觉率。\n\n**为什么对：** 三个要求一一对应。自动化 LLM-as-a-judge 可对生成的回答进行可扩展、一致的评估，衡量事实依据、相关性和幻觉风险——以可扩展的方式检测幻觉。自动筛选后，仅将低于质量阈值或表现不明确的回答升级为人工审核——大幅减少需要手动检查的数量，从而降低人工审核成本。Amazon Bedrock 内置评估提供了专为 RAG 系统设计的标准化指标（检索精度、源文档忠实度和幻觉率），与 Bedrock 知识库和模型直接集成，无需构建和维护自定义评估管道——覆盖\"高检索精度\"的要求。\n\n**其他选项为什么错：**\n- A. Amazon Comprehend 分析和提取医疗实体 + CloudWatch 跟踪置信度：实体提取的置信度不能可靠地检测生成文本中的幻觉。\n- B. 用微调模型做 LLM 评估 + Lambda 并行化 + CloudWatch 指标：需要维护和扩展独立的微调评估模型，增加复杂度和成本。\n- C. CloudWatch Synthetics 定期生成已知答案的测试查询并比较结果：适合回归测试，但无法检测真实的开放式临床查询中的幻觉。","s":"源#337"},{"id":"D5-041","d":5,"t":"multiple","q":"一家公司使用 Amazon Bedrock 为客户生成技术内容。在为长技术文档生成摘要时，公司最近经历了幻觉（hallucination）输出激增——模型输出包含不准确或捏造的细节。当前方案使用大型 Foundation Model（FM，基础模型）和基本的单次提示词（one-shot prompt），将完整文档作为单个输入传入。公司需要一种能减少幻觉并达成事实准确性目标的方案，该方案每小时须处理超过 1,000 个文档，并在 3 秒内为每个文档提供摘要。哪两种方案的组合可以满足这些要求？（选择两项。）","o":[{"l":"A","t":"实施需要逐步推理的零样本思想链 (CoT) 指令，在模型生成每个摘要之前进行明确的事实验证。"},{"l":"B","t":"将检索增强生成 (RAG) 与 Amazon Bedrock 知识库结合使用。将语义分块和调整嵌入应用于源内容中的基本摘要。"},{"l":"C","t":"配置 Amazon Bedrock 护栏以阻止任何与幻觉内容关联的模式匹配的生成输出。"},{"l":"D","t":"增加 Amazon Bedrock 中的温度参数。"},{"l":"E","t":"提示 Amazon Bedrock 模型一次性总结每个完整文档。"}],"a":["B","C"],"e":"**正确答案：B、C。** 将 RAG 与 Bedrock 知识库结合使用，并配置 Bedrock Guardrails 阻止类幻觉输出模式。\n\n**为什么对：** B——使用 Retrieval-Augmented Generation（RAG，检索增强生成）配合 Amazon Bedrock Knowledge Bases（Bedrock 知识库），将长技术文档进行语义分块并生成嵌入后，仅检索最相关的块送入 FM，而非将整个文档一次性塞入上下文窗口。这从源头减少幻觉，因为模型基于检索到的验证内容而非参数记忆生成摘要。此方法可有效扩展以支持每小时超过 1,000 个文档。C——配置 Amazon Bedrock Guardrails（护栏）在推理时检测并阻止类似幻觉的输出模式，添加纵深防御安全层。Guardrails 在推理时以最小性能开销运行，适合低延迟要求。\n\n**其他选项为什么错：**\n- A. 实施零样本 Chain-of-Thought（CoT，思维链）指令进行逐步事实验证：显式推理步骤增加延迟和成本，对高吞吐量工作负载扩展性差。\n- D. 增加 Amazon Bedrock 中的 Temperature（温度）参数：提高温度会增加输出随机性，反而加剧幻觉。\n- E. 让 FM 一次性总结完整文档：这正是当前的有缺陷做法，重复它不会改善幻觉。","s":"源#338"},{"id":"D5-042","d":5,"t":"multiple","q":"一家电商公司正在构建一个内部平台，用于使用 Amazon Bedrock Foundation Model（FM，基础模型）开发生成式 AI 应用。开发人员需要根据与电商用例一致的评估来选择模型。平台须在仪表板中展示文本生成和摘要的准确性指标。公司拥有自定义电商数据集，可用作标准化评估输入。哪两个步骤的组合能以最少的运营开销满足这些要求？（选择两项。）","o":[{"l":"A","t":"将数据集导入 Amazon S3 存储桶。提供适当的 IAM 权限和跨源资源共享 (CORS) 权限，以便评估作业能够访问数据集。"},{"l":"B","t":"将数据集导入 Amazon S3 存储桶。提供适当的 IAM 权限和 VPC 终端节点配置，以使评估作业能够访问数据集。"},{"l":"C","t":"配置 AWS Lambda 函数以在 Amazon Bedrock 控制台中按计划创建模型评估作业。提供包含数据集的 S3 存储桶的 URI 作为输入。配置评估作业以测量文本生成的现实世界知识 (RWK) 分数和摘要的 BERTScore。配置第二个 Lambda 函数来检查作业的状态并将自定义日志发布到 Amazon CloudWatch。创建自定义 Amazon CloudWatch Logs Insights 控制面板。"},{"l":"D","t":"按计划使用 Amazon SageMaker Clarify 创建模型评估作业。使用开源框架创建和运行标准化评估。将结果发布到 Amazon CloudWatch 命名空间。使用 AWS Lambda 函数检查作业的状态并将自定义日志发布到 Amazon CloudWatch。创建自定义 Amazon CloudWatch Logs Insights 控制面板。"},{"l":"E","t":"使用 fmvelos 或 ragas 框架按计划运行 Amazon SageMaker AI 笔记本作业 运行使用 S3 存储桶中的数据集的评估。在笔记本中编写 Python 代码，直接调用 FM 的 InvokeModel API 并处理它们的响应以进行评估。将作业状态和结果发布到 Amazon CloudWatch Logs，以衡量文本生成的真实世界知识 (RWK) 分数和摘要毒性，作为准确性指标。创建自定义 CloudWatch Logs Insights 仪表板。"}],"a":["B","C"],"e":"**正确答案：B、C。** 将数据集导入 S3 并配置 IAM 权限和 VPC 端点（步骤 B），然后使用 Lambda 按计划创建 Bedrock 模型评估作业并将结果发布到 CloudWatch 仪表板（步骤 C）。\n\n**为什么对：** B——将标准化评估数据集存储在 Amazon S3 中，是 Bedrock 评估作业读取输入的标准方式。配置 IAM 权限和 VPC 端点确保评估工作流以安全的服务间模式访问 S3 数据，符合企业网络安全要求且无需自建数据分发系统。C——使用 Lambda 函数按计划启动 Bedrock 评估作业，指定 S3 数据集作为输入；评估作业可配置 Real-World Knowledge（RWK）分数衡量文本生成、BERTScore 衡量摘要准确性；第二个 Lambda 检查作业状态并将结果推送到 CloudWatch。CloudWatch Logs Insights 仪表板满足在仪表板展示准确性指标的要求，且支持跨模型持续标准化比较。\n\n**其他选项为什么错：**\n- A. 导入 S3 并配置 CORS 权限：CORS 主要解决浏览器跨域访问问题，Bedrock 托管的评估作业以服务间模式访问 S3，不需要 CORS。\n- D. 使用 Amazon SageMaker Clarify 创建评估作业：需要更多环境管理、依赖控制和持续维护，运营开销更大。\n- E. 使用 SageMaker AI Notebook 运行开源框架评估：同样需要管理笔记本环境和开源依赖，运营负担高于 Bedrock 原生评估。","s":"源#339"},{"id":"D5-043","d":5,"t":"multiple","q":"一家金融服务公司正在开发一款基于 AI 的搜索助手应用，帮助投资顾问快速检索投资数据。应用以 AWS Lambda 函数运行，使用 Amazon Bedrock 开发，其中 Amazon Bedrock Knowledge Bases（Bedrock 知识库）基于 Amazon OpenSearch Serverless 作为数据源。应用代理须支持大规模集合管理——即自动为符合特定模式的集合和索引分配访问权限。公司使用 Amazon Bedrock 工具对知识库进行测试时，同步过程顺利完成；但测试中发现当尝试访问 OpenSearch Serverless 时，会收到来自 Bedrock Agent Runtime API 的 400 BadAuthorization 错误和 403 Forbidden 错误。公司需要解决此权限问题。哪两种方案的组合可以满足要求？（选择两项。）","o":[{"l":"A","t":"更新 Lambda 函数执行角色，使其包含`bedrock:InvokeAgent`权限；同时向 Lambda 函数执行角色中添加`aoss:APIAccessAll`权限。"},{"l":"B","t":"创建一个 OpenSearch Serverless 数据访问策略，其中包含基于模式的资源规则。"},{"l":"C","t":"为 OpenSearch Serverless 配置 VPC 端点策略。将该端点添加到 Lambda 函数的 VPC 配置中。"},{"l":"D","t":"配置 AWS Secrets Manager 以存储 OpenSearch Serverless 认证凭证；并授予 Lambda 函数访问权限，以便检索这些凭证。"},{"l":"E","t":"为 OpenSearch Serverless 域启用 IAM 认证；将 `es:ESHttp∗ ` 权限添加至 Lambda 函数执行角色。"}],"a":["A","B"],"e":"**正确答案：A、B。** 更新 Lambda 函数执行角色以包含 bedrock:InvokeAgent 和 aoss:APIAccessAll 权限（步骤 A），并创建包含基于模式的资源规则的 OpenSearch Serverless 数据访问策略（步骤 B）。\n\n**为什么对：** A——Lambda 函数要与 Bedrock Agent Runtime API 交互需要 bedrock:InvokeAgent 权限；要查询 OpenSearch Serverless API 需要 aoss:APIAccessAll 权限。这两个 IAM 权限解决了 400 BadAuthorization 错误。B——OpenSearch Serverless 使用数据访问策略（data access policy）控制对集合和索引的访问。基于模式的资源规则可实现权限的可扩展管理，正好符合自动为符合特定模式的集合和索引分配权限的要求，从而解决 403 Forbidden 错误。\n\n**其他选项为什么错：**\n- C. 配置 VPC 端点策略并将端点添加到 Lambda VPC 配置：题目中的错误均与 IAM 权限相关，而非网络访问问题。\n- D. 用 AWS Secrets Manager 存储 OpenSearch Serverless 认证凭证：OpenSearch Serverless 与 IAM 集成进行身份验证和授权，无需额外存储凭证。\n- E. 启用 IAM 认证并添加 es:ESHttp* 权限：OpenSearch Serverless 不使用 es:ESHttp* 权限（那是传统 OpenSearch 域的），而是使用 aoss:* 权限。","s":"源#340"},{"id":"D5-044","d":5,"t":"multiple","q":"一家电商公司正在 Amazon Bedrock 上使用 Anthropic Claude Sonnet 模型生成产品推荐。一个 AWS Lambda 函数从 Amazon DynamoDB 检索客户购买数据、从 Amazon S3 检索产品评论、从 Amazon RDS 检索客户个人资料信息，然后通过 API 调用将这些数据直接发送到 Amazon Bedrock 模型。近期，购买记录较多的客户开始收到不完整的推荐结果。Lambda 函数的 Amazon CloudWatch 日志显示执行超时；Amazon Bedrock API 调用的 CloudWatch 日志显示间歇性错误。公司审查日志后发现部分请求因上下文长度超出（context length exceeded）错误而失败，其他请求虽完成但似乎忽略了输入数据的部分内容。公司希望推荐系统在生成推荐时综合考虑所有客户数据，并利用 Amazon Bedrock Knowledge Bases（Bedrock 知识库）优化数据的组织与检索流程。哪两种方案的组合可以满足要求？（选择两项。）","o":[{"l":"A","t":"实施一种分块策略，将客户数据划分为更小的片段；配置模型以分别处理每个片段；最后调用该模型一次，将各独立响应综合为全面的建议。"},{"l":"B","t":"修改提示结构，将最关键的信息置于上下文窗口的开头和结尾；并实现令牌计数逻辑，在交互接近模型最大上下文长度时，截断次要数据。"},{"l":"C","t":"将 Claude Sonnet 替换为具有更大上下文窗口容量的模型。增加 Lambda 函数超时时间，以适应较大输入数据所需的更长处理时间。"},{"l":"D","t":"配置推荐系统以使用 Converse API。修改“额外模型请求字段”参数，将最大令牌限制设置为超过模型默认上下文窗口大小的值。"},{"l":"E","t":"通过使用知识库对客户数据进行向量嵌入索引，实现 RAG；根据当前客户上下文，仅从每个推荐请求中检索出语义上最相关的信息。"}],"a":["A","E"],"e":"**正确答案：A、E。** 实施分块策略将客户数据分为更小的片段并逐段处理后合成完整建议（步骤 A），以及通过知识库对客户数据进行向量嵌入索引实现 RAG、仅检索语义最相关的信息（步骤 E）。\n\n**为什么对：** A——分块处理是应对上下文长度限制的有效策略。将输入数据分为较小的片段，模型逐段处理后再合成完整的推荐建议，确保每段都在上下文窗口范围内，直接解决上下文长度超出错误和推荐不完整的问题。E——Retrieval-Augmented Generation（RAG，检索增强生成）配合 Bedrock 知识库对客户数据建立向量嵌入索引，每次推荐请求时仅检索与当前客户上下文语义最相关的信息。这与公司利用 Bedrock 知识库优化数据组织与检索的目标一致，且避免了将全部数据塞入上下文窗口。\n\n**其他选项为什么错：**\n- B. 将关键信息放在上下文窗口首尾并在接近最大长度时截断次要数据：截断意味着部分数据被丢弃，仍可能导致推荐不完整。\n- C. 替换为更大上下文窗口的模型并增加 Lambda 超时：不能保证所有客户数据都适配更大窗口，增加超时也不解决根本的上下文限制。\n- D. 使用 Converse API 并将最大 token 限制设为超过模型默认上下文窗口：模型上下文窗口是架构决定的硬限制，无法通过 API 参数突破。","s":"源#341"},{"id":"D5-045","d":5,"t":"single","q":"一家公司拥有一款客服应用，利用 Amazon Bedrock 生成针对客户咨询的个性化回复。公司需要建立一套质量保证流程，用于评估提示词（prompt）更新和模型配置的有效性。该流程必须能自动比较多个提示词模板的输出结果、检测回复中的质量问题、提供定量指标、允许人工评审员提供反馈，并防止不符合预定义质量阈值的配置被部署。哪种方案能满足这些要求？","o":[{"l":"A","t":"创建一个 AWS Lambda 函数，用于向多个 Amazon Bedrock 模型配置发送示例客户咨询请求，并将响应存储至 Amazon S3；使用 Amazon QuickSight 对响应模式进行可视化分析；每日手动审核输出结果；并利用 AWSCodePipeline 部署质量评分高于指定质量阈值的配置。"},{"l":"B","t":"可使用 Amazon Bedrock 评估作业，通过自定义提示数据集来比较模型输出结果；可配置 AWS CodePipeline，在提示模板发生变化时运行这些评估作业；还可配置 CodePipeline，将质量评分高于指定质量阈值的配置进行部署。"},{"l":"C","t":"配置 Amazon CloudWatch 告警，用于监控 Amazon Bedrock 的响应延迟和错误率；使用 Amazon EventBridge 规则，在延迟和错误率指标超过阈值时通知公司；在 AWS Systems Manager 中配置审批工作流，以执行人工质量检查。"},{"l":"D","t":"使用 AWS Lambda 函数构建一个自动化测试框架，该框架可对生产流量进行采样，并将重复请求路由至更新后的模型版本；利用 Amazon Comprehend 情感分析功能对比分析结果；若情感评分下降，则阻止部署。"}],"a":["B"],"e":"**正确答案：B。** 使用 Amazon Bedrock 评估作业（Evaluation Job）通过自定义提示词数据集比较模型输出；配置 AWS CodePipeline 在提示词模板变更时运行评估作业；仅部署超出预定义质量阈值的配置。\n\n**为什么对：** Amazon Bedrock 评估作业专为以可重复、自动化的方式评估提示词有效性和模型行为而构建，支持定量指标和基于 LLM 的判别评分，能检测微妙的响应质量回归。通过自定义提示词数据集，可在相同输入上一致地测试多个模板和配置。集成到 CodePipeline 后，每次模板变更自动触发评估；仅当质量分数超过阈值时允许部署，形成门控工作流。人工评审员可通过审查评估报告提供反馈。\n\n**其他选项为什么错：**\n- A. Lambda 发送查询 + QuickSight 可视化 + 每日手动审核 + CodePipeline 部署：依赖每日手动审核，不满足自动化要求。\n- C. CloudWatch 警报监控延迟和错误率 + EventBridge 通知 + Systems Manager 审批：关注运营指标而非回复质量。\n- D. Lambda 采样生产流量 + Comprehend 情感分析 + 情感下降则阻止部署：仅靠情感分析不足以全面评估提示词效果和回复质量。","s":"源#342"},{"id":"D5-046","d":5,"t":"single","q":"一家医疗保健公司希望开发一款概念验证（PoC）应用，利用 Amazon Bedrock 自动对医疗文档进行摘要。公司有 3 周时间验证应用的准确性；应用必须符合公司的数据隐私政策，并包含用于评估摘要准确率和处理时间的指标。哪种方案能满足这些要求？","o":[{"l":"A","t":"创建包含 50 至 100 条匿名化患者记录的数据集；采用基于安全知识库的检索增强生成（RAG）技术；并使用评估模型对三种基础模型（FMs）的准确率指标进行评估。"},{"l":"B","t":"基于患者病历对单个基础模型（FM）进行微调；将该 FM 部署至 Amazon Bedrock；利用 Amazon Bedrock AgentCore 将 FM 配置为智能体；对 500 名公司员工开展用户测试。"},{"l":"C","t":"Select the most powerful available AWS foundation model (FM). Create a chat interface by using Converse APIs. Test the application on 50-100 actual patient records by using only qualitative feedback from stakeholders. Use a custom web interface to gather real-world performance metrics."},{"l":"D","t":"使用 Strands SDK 部署多个智能代理，这些代理可连接至包含专业医学文档的多个知识库；比较各代理的响应结果；评估这些代理与公司现有系统的集成情况。"}],"a":["A"],"e":"**正确答案：A。** 创建包含 50 至 100 条匿名化患者记录的数据集，采用基于安全知识库的 Retrieval-Augmented Generation（RAG，检索增强生成）技术，并使用评估模型对三种 Foundation Model（FM，基础模型）的准确率指标进行评估。\n\n**为什么对：** 使用匿名化患者记录确保符合数据隐私政策。RAG 通过安全知识库将 FM 的输出锚定在可信源文档上，提升摘要准确性。对三种 FM 进行准确率指标评估可提供稳健的量化比较依据。50-100 条记录的规模足以进行概念验证且在 3 周内完全可行。\n\n**其他选项为什么错：**\n- B. 对单个 FM 进行微调 + AgentCore 配置 + 500 名员工测试：微调耗时较长难以契合 3 周周期；AgentCore 面向代理编排而非摘要评估；500 人测试对 PoC 不现实。\n- C. 选最强 FM + Converse API 聊天界面 + 真实患者记录测试 + 仅定性反馈：在真实记录上测试可能违反隐私政策；仅定性反馈不满足量化指标要求。\n- D. 用 Strands SDK 部署多代理并比较响应：Strands SDK 并非 AWS 原生服务，在 PoC 阶段部署多代理过于复杂，也无法直接解决准确率指标问题。","s":"源#343"},{"id":"D5-047","d":5,"t":"single","q":"一家公司希望为其 AI 助手选择新的 Foundation Model（FM，基础模型）。一位 GenAI 开发人员需要生成评估报告，协助数据科学家评估各类 FM 的质量与安全性。数据科学家向开发人员提供了用于评估的示例提示词（prompt）。开发人员希望利用 Amazon Bedrock 实现报告生成与评估过程的自动化。哪种方案能满足此要求？","o":[{"l":"A","t":"将样本提示整合至单个 JSON 文档中；利用该文档创建 Amazon Bedrock 知识库；编写一个提示，要求 FM 针对每个样本提示生成响应；使用 RetrieveAndGenerate API 为每个模型生成报告。"},{"l":"B","t":"将样本提示合并为一个单一的 JSONL 文档，将其存储在 Amazon S3 存储桶中。创建一个使用判别模型的 Amazon Bedrock 评估作业，指定 S3 存储位置作为输入，另设不同的 S3 存储位置作为输出。为每个 FM 运行一次评估作业，并选择该 FM 作为生成器。"},{"l":"C","t":"将样本提示合并为一个 JSONL 文档，将该文档存储在 Amazon S3 存储桶中。创建一个使用判别模型的 Amazon Bedrock 评估任务，指定 S3 存储位置作为输入，Amazon QuickSight 作为输出。为每个 FM 运行一次评估任务，并选择该 FM 作为评估器。"},{"l":"D","t":"将样本提示合并为一个单一的 JSON 文档；基于该文档创建 Amazon Bedrock 知识库；创建一个使用检索与响应生成评估类型的 Amazon Bedrock 评估作业，并指定 Amazon S3 存储桶作为输出路径；为每个 FM 运行一次评估作业。"}],"a":["B"],"e":"**正确答案：B。** 将示例提示词合并为一个 JSONL 文件，存储在 Amazon S3 存储桶中。创建使用判别模型（judge model）的 Amazon Bedrock 评估作业，指定 S3 位置作为输入，另设不同的 S3 位置作为输出。为每个 FM 运行一次评估作业并选择该 FM 作为生成器（generator）。\n\n**为什么对：** Amazon Bedrock 评估作业的标准工作流要求输入数据集为 JSONL 格式并存储在 S3 中。判别模型按统一标准对各候选 FM 生成的回答进行质量和安全性评分。为每个 FM 分别运行评估并指定其为生成器，可在相同提示词集上实现可重复的同类比较，输出以结构化评估报告的形式自动写入 S3。\n\n**其他选项为什么错：**\n- A. 合并为 JSON 文件 + 创建知识库 + RetrieveAndGenerate API：知识库加 RetrieveAndGenerate 是 RAG 模式，产出的是回答而非标准化评分报告。\n- C. 合并为 JSONL + 输出指向 QuickSight + FM 作为评估器：Bedrock 评估作业输出只能写入 S3；且候选 FM 应做生成器，评估器应用稳定的判别模型。\n- D. 合并为 JSON + 创建知识库 + 检索和响应生成评估类型：本场景是基于提示词的模型评估，不涉及检索质量评估。","s":"源#344"},{"id":"D5-048","d":5,"t":"single","q":"一家公司正在构建一款基于多云生成式 AI 的密钥解析（secrets resolution）应用，采用 Amazon Bedrock 和 Agent Squad 技术。应用可从多个来源（密钥库和硬件安全模块 HSM）解析密钥，使用 AWS Lambda 函数检索密钥，借助 AWS AppConfig 实现动态功能开关，支持密钥链式传递并能检测密钥漂移（drift），处理短期有效及即将过期的密钥，还支持针对模板化指令的 Prompt Flow（提示词流）。应用利用 AWS Step Functions 编排代理以解析密钥并管理密钥验证和漂移检测。测试中发现多个问题：应用未及时刷新过期密钥供代理使用；应用虽发送了密钥漂移警报但代理仍使用陈旧数据；应用内的提示词流复用了过时的模板导致级联故障。公司必须解决这些性能问题。哪种方案可以满足要求？","o":[{"l":"A","t":"可利用步进函数映射状态来并行运行代理工作流；通过 Lambda 函数的输出传递更新后的密钥元数据；可使用 AWS AppConfig 对所有提示流程进行版本管理，以实现准入控制及故障模板回滚。"},{"l":"B","t":"仅使用 Amazon Bedrock AgentCore。配置 Amazon Bedrock 的护栏机制以限制提示词变体；为单个代理的工作流定义使用 inline JSON 模式，以串联工具调用。"},{"l":"C","t":"使用集中式 Amazon EventBridge 流水线来调用每个事件代理；将中间提示信息存储在 Amazon DynamoDB 中；通过基于 TTL 的退避与重试机制解决代理顺序问题。"},{"l":"D","t":"使用 Amazon EventBridge Pipes 根据 Amazon CloudWatch 日志模式调用解析器；将响应元数据存储在 Amazon DynamoDB 中；配置 TTL 和版本化写入机制；使用 Amazon Q Developer 动态生成回退提示，这些提示将通过 Lambda 协调器进行路由。"}],"a":["A"],"e":"**正确答案：A。** 利用 Step Functions Map 状态并行运行代理工作流；通过 Lambda 函数的输出传递更新后的密钥元数据；使用 AWS AppConfig 对所有提示词流进行版本控制，以实现准入控制及故障模板回滚。\n\n**为什么对：** Step Functions Map 状态支持并行执行，可缩短密钥刷新延迟，确保代理使用前密钥已完成刷新。通过 Lambda 输出传递更新后的密钥元数据，保证后续步骤始终使用最新的解析值，避免代理在漂移警报后仍用旧数据。AppConfig 原生支持配置工件的版本控制、验证、分阶段部署和回滚——通过它管理提示词流，可立即回滚有缺陷的模板并防止级联故障。方案保留了现有 Step Functions 架构，改动最小。\n\n**其他选项为什么错：**\n- B. 仅用 Amazon Bedrock AgentCore + Guardrails + 内联 JSON 模式：过度简化架构，未解决密钥生命周期或提示词版本控制。\n- C. 集中式 EventBridge 管道 + DynamoDB 存中间提示词 + TTL 退避重试：引入事件驱动排序复杂性，未解决提示词版本控制。\n- D. EventBridge Pipes 按日志模式触发 + DynamoDB 存响应 + Amazon Q Developer 动态生成备用提示词：引入不必要的工具和动态提示词生成风险。","s":"源#345"},{"id":"D5-049","d":5,"t":"single","q":"一家公司正在开发一款客户支持聊天助手，采用 Amazon Bedrock Foundation Model（FM，基础模型）。公司希望升级到更新的 FM 版本，但需部署验证系统以检测响应中的语义漂移（semantic drift），并确保最终用户的性能与功能保持一致。公司需要一套方案：在 500 个测试用例中对比现有与新 FM 版本的响应结果，检测响应含义的变化、生成定量相似度评分、完成验证流程并记录详细测试结果以供历史对比。哪种方案能以最低运维复杂度满足这些要求？","o":[{"l":"A","t":"配置 Amazon CloudWatch Synthetics Canary 测试，可使用自定义 JavaScript 代码向新版本和现有 FM 版本发送相同的提示；将响应存储于 Amazon S3 中；并通过手动审核来识别不同 FM 版本之间的语义差异。"},{"l":"B","t":"配置一个 AWSStep Functions 工作流，用于向新和现有 FM 版本发送测试提示；使用 Amazon Bedrock 嵌入模型计算余弦相似度得分；并将结果存储在 Amazon DynamoDB 中，采用复合键模式。"},{"l":"C","t":"可使用 Amazon Bedrock 模型评估任务，利用 500 个测试用例将新 FM 版本与当前版本进行对比；可配置评估任务以计算语义相似度指标，并将评估结果存储至 Amazon S3 用于历史比对。"},{"l":"D","t":"利用 Amazon SageMaker AI 对历史响应数据进行分类器模型训练，以构建定制化解决方案：该方案通过将新 FM 版本的响应与先前模式进行比对，从而检测异常情况。"}],"a":["C"],"e":"**正确答案：C。** 使用 Amazon Bedrock 模型评估作业（Model Evaluation Job），利用 500 个测试用例将新 FM 版本与当前版本进行对比，配置评估作业计算语义相似度指标，并将评估结果存储到 Amazon S3 用于历史对比。\n\n**为什么对：** Amazon Bedrock 模型评估作业专为使用测试用例对比 FM 版本而设计，可配置语义相似度指标以检测响应含义的变化，并将结构化评估结果自动存入 S3 便于历史分析。这是最直接的方案——充分利用针对此用例的内置功能，运维复杂度最低。\n\n**其他选项为什么错：**\n- A. CloudWatch Synthetics Canary 发送提示词 + 手动审核：手动审核引入显著运维复杂度，Synthetics 不是为语义相似度分析设计的。\n- B. Step Functions 工作流 + Bedrock 嵌入模型计算余弦相似度 + DynamoDB 存结果：虽技术可行，但需自建工作流和存储方案，运维复杂度高于原生评估作业。\n- D. 用 SageMaker AI 训练分类器模型检测异常：需训练和维护自定义模型，引入显著运维复杂度。","s":"源#346"}];
</script>
<script>

/* ================================================================
   ===================== 题库数据（构建注入 QUIZ_META + QUIZ_QUESTIONS） ================
   ================================================================ */
const QUESTIONS = QUIZ_QUESTIONS;
const META = (typeof QUIZ_META !== 'undefined' && QUIZ_META) ? QUIZ_META : {};
const EXAM = META.exam || 'QUIZ';
const LS_PREFIX = META.lsPrefix || EXAM.toLowerCase();

const GLOSSARY = META.glossary || {};

function getGlossaryForQuestion(q) {
  const texts = [q.q];
  if(q.o && Array.isArray(q.o)) q.o.forEach(o => texts.push(o.t));
  if(q.e) texts.push(q.e);
  const fullText = texts.join(' ');
  const found = [];
  const sorted = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
  for(const term of sorted) {
    if(fullText.includes(term)) found.push({term, def: GLOSSARY[term]});
  }
  return found;
}

/* ================================================================
   ===================== 术语高亮 + 弹定义 ================
   ================================================================ */
// 长词优先排序，独立 token 边界匹配，避免 EBS 误标 Amazon EBS 中的 EBS 等
function getGlossarySortedKeys() {
  return Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
}

// 判断术语在文本中是否为独立出现（前后非字母/数字）
function isIndependentToken(text, idx, term) {
  const before = text[idx-1];
  const after = text[idx + term.length];
  const isLetter = c => c && /[A-Za-z0-9]/.test(c);
  return !isLetter(before) && !isLetter(after);
}

// 将解析正文中的术语高亮为可点击 span，返回 HTML
function fmtExp(s){ let t=(s===undefined||s===null)?'':String(s); t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); t=t.replace(/\n/g,'<br>'); t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); return t; }
function highlightGlossaryTerms(text) {
  if(!text) return text;
  const sortedKeys = getGlossarySortedKeys();
  let result = '';
  let i = 0;
  while(i < text.length) {
    let matched = false;
    for(const term of sortedKeys) {
      if(!term) continue;
      const idx = text.indexOf(term, i);
      if(idx === i && isIndependentToken(text, idx, term)) {
        const def = GLOSSARY[term] || '（暂无定义）';
        const termEsc = term.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const defEsc = def.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        result += `<span class="gloss-term" onclick="showGlossTip(event,'${termEsc}','${defEsc}')">${term}</span>`;
        i += term.length;
        matched = true;
        break;
      }
    }
    if(!matched) {
      // 中文等宽字符直接输出，保持原文本
      result += text[i];
      i++;
    }
  }
  return result;
}

// 点击术语弹出定义浮层
function showGlossTip(e, term, def) {
  e.stopPropagation();
  const tip = document.getElementById('glossTip');
  document.getElementById('glossTipTerm').textContent = term;
  document.getElementById('glossTipDef').textContent = def || '（暂无定义）';
  tip.style.display = 'block';
  // 定位：优先在点击位置下方，避免超出视口
  const pad = 12;
  let left = e.clientX + pad;
  let top = e.clientY + pad;
  // 先渲染再量尺寸
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if(left + tw > window.innerWidth - 8) left = e.clientX - tw - pad;
  if(top + th > window.innerHeight - 8) top = e.clientY - th - pad;
  if(left < 8) left = 8;
  if(top < 8) top = 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

function closeGlossTip() {
  document.getElementById('glossTip').style.display = 'none';
}

// 点击页面其它区域关闭浮层
document.addEventListener('click', function(e) {
  const tip = document.getElementById('glossTip');
  if(tip && tip.style.display === 'block' && !tip.contains(e.target)) {
    closeGlossTip();
  }
});

// 按 Esc 关闭浮层
document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') closeGlossTip();
});

/* ================================================================
   ===================== localStorage 操作 =========================
   ================================================================ */
const LS_ANSWERS = LS_PREFIX + '_answers';
const LS_WRONG   = LS_PREFIX + '_wrong';
const LS_PROGRESS = LS_PREFIX + '_progress';

function getAnswers() { return JSON.parse(localStorage.getItem(LS_ANSWERS)||'[]'); }
function setAnswers(a) { localStorage.setItem(LS_ANSWERS,JSON.stringify(a)); }
function getWrong() { return JSON.parse(localStorage.getItem(LS_WRONG)||'[]'); }
function setWrong(w) { localStorage.setItem(LS_WRONG,JSON.stringify(w)); }
function getProgress() { return JSON.parse(localStorage.getItem(LS_PROGRESS)||'{}'); }
function setProgress(p) { localStorage.setItem(LS_PROGRESS,JSON.stringify(p)); }

/* ----------------------------------------------------------------
   作答记录：会话态 / 累计统计态分离（修复）
   旧缺陷：模拟考核误读全局 localStorage 历史 → 进场即显示「已答对/曾答错」、
   题号导航提前染色、成绩单把练习与往场算进本次（实测正确数>题数、未答为负、
   分数超满分、正确率>100%）。
   三态口径：
     · sessionResults()       本场逐题作答（quizState.results）＝「本次」唯一真源
     · sessionScopedAnswers() 视图用作答集：考核=仅本场；练习模式=全局历史（原行为）
     · recordAnswer()         仍写全局 store → 错题集与统计口径不变
   ---------------------------------------------------------------- */
function sessionResults() {
  const r = (quizState && quizState.results) || {};
  return Object.keys(r).map(id => ({id, ua:r[id].ua, ok:r[id].ok, ts:r[id].ts}));
}
function sessionScopedAnswers() {
  return (quizState && quizState.mode === 'exam') ? sessionResults() : getAnswers();
}

function recordAnswer(qId, userAnswer, isCorrect) {
  const answers = getAnswers();
  answers.push({id:qId,ua:userAnswer,ok:isCorrect,ts:Date.now()});
  setAnswers(answers);
  const wrong = getWrong();
  const idx = wrong.findIndex(w=>w.id===qId);
  if(!isCorrect) {
    if(idx>=0) { wrong[idx].count++; wrong[idx].last=Date.now(); }
    else { wrong.push({id:qId,count:1,last:Date.now(),mastered:false}); }
  }
  setWrong(wrong);
}

function markMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=true;
  setWrong(wrong);
}
function unmarkMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=false;
  setWrong(wrong);
}
function removeWrong(qId) {
  setWrong(getWrong().filter(x=>x.id!==qId));
}

/* ================================================================
   ===================== 辅助函数 =================================
   ================================================================ */
const DOMAIN_NAMES = META.domains || {};
const DOMAIN_WEIGHTS = META.weights || {};
const DOMAIN_KEYS = Object.keys(DOMAIN_NAMES).map(Number).sort((a,b)=>a-b);
const EXAM_P = META.examParams || {};
const EXAM_COUNT = EXAM_P.count || 50;
const EXAM_MIN = EXAM_P.minutes || 60;
const EXAM_PASS = EXAM_P.pass || 700;
const TYPE_NAMES = {single:'单选题',multiple:'多选题',hot:'拖拽题'};

function getQById(id) { return QUESTIONS.find(q=>q.id===id); }
function shuffle(arr) { const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function generateShuffledOptions(questions) {
  const opts = {};
  const newAnswers = {};
  questions.forEach(q => {
    if(q.t==='single'||q.t==='multiple') {
      const shuffled = shuffle([...q.o]);
      const labels = 'ABCDEFGHIJ';
      const relabeled = shuffled.map((item, i) => ({l: labels[i], t: item.t}));
      opts[q.id] = relabeled;
      const contentToNewLabel = {};
      relabeled.forEach(item => { contentToNewLabel[item.t] = item.l; });
      newAnswers[q.id] = q.a.map(oldL => {
        const oldItem = q.o.find(o => o.l === oldL);
        return oldItem ? contentToNewLabel[oldItem.t] : oldL;
      });
    }
  });
  return { opts, newAnswers };
}

function getStats() {
  const answers = getAnswers();
  const wrong = getWrong();
  const totalCorrect = answers.filter(a=>a.ok).length;
  const totalAnswered = answers.length;
  const acc = totalAnswered ? Math.round(totalCorrect/totalAnswered*100) : 0;
  const doneIds = [...new Set(answers.map(a=>a.id))];
  const completion = Math.round(doneIds.length/QUESTIONS.length*100);
  const domainStats = {};
  for(const d of DOMAIN_KEYS) {
    const dQIds = QUESTIONS.filter(q=>q.d===d).map(q=>q.id);
    const dAnswers = answers.filter(a=>dQIds.includes(a.id));
    const dCorrect = dAnswers.filter(a=>a.ok).length;
    const dTotal = dAnswers.length;
    domainStats[d] = {
      total:dQIds.length, answered:dTotal, correct:dCorrect,
      acc: dTotal ? Math.round(dCorrect/dTotal*100) : 0
    };
  }
  const typeStats = {};
  for(const t of ['single','multiple']) {
    const tQIds = QUESTIONS.filter(q=>q.t===t).map(q=>q.id);
    const tAnswers = answers.filter(a=>tQIds.includes(a.id));
    const tCorrect = tAnswers.filter(a=>a.ok).length;
    const tTotal = tAnswers.length;
    typeStats[t] = { answered:tTotal, correct:tCorrect, acc: tTotal ? Math.round(tCorrect/tTotal*100) : 0 };
  }
  const recentWrong = wrong.filter(w=>!w.mastered).sort((a,b)=>b.last-a.last).slice(0,5);
  const recent = answers.slice(-20).reverse();
  let streak = 0;
  for(const a of recent) { if(a.ok) streak++; else break; }
  return {totalCorrect,totalAnswered,acc,completion,domainStats,typeStats,recentWrong,streak,doneIds:doneIds.length};
}

function renderQuiz() {
  const el = document.getElementById('page-quiz');
  if(!quizState || !quizState.questions.length) {
    el.innerHTML = `<div class="header"><button class="back-btn" onclick="navigate('dashboard')">←</button><h1>刷题</h1></div>
    <p style="text-align:center;margin-top:60px;color:var(--text2)">暂无题目，请从仪表盘选择模式开始练习</p>`;
    return;
  }
  const q = quizState.questions[quizState.currentIdx];
  const isHot = q.t === 'hot';
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  // 考核=仅本场作答；练习模式=全局历史（含本场）——防练习记录串进考核视图
  const answers = sessionScopedAnswers();
  const prevAnswers = answers.filter(a=>a.id===q.id);
  const everCorrect = prevAnswers.some(a=>a.ok);
  const everWrong = prevAnswers.some(a=>!a.ok);
  const answered = quizState.answered || {};
  let userAns = answered[q.id];
  const finished = quizState.submitted && quizState.submitted[q.id];
  const correct = finished && isAnswerCorrect(q, userAns);

  let modeLabel = quizState.mode==='exam'?'📋 模拟考核':quizState.mode==='wrong'?'❌ 错题重练':quizState.mode==='domain'?'📖 章节练习':quizState.mode==='single'?'📝 单题练习':'📝 顺序练习';

  let html = `<div class="quiz-header">
    <button class="back-btn" onclick="exitQuiz()">←</button>
    <span style="font-weight:600;font-size:15px">${modeLabel}</span>
    ${quizState.mode==='exam'?`<span class="timer" id="quizTimer"></span>`:''}
    <span class="quiz-progress">${quizState.currentIdx+1}/${quizState.questions.length}</span>
  </div>`;
  html += `<div class="quiz-meta">
    <span class="domain-tag">Domain ${q.d}</span>
    <span>${DOMAIN_NAMES[q.d]}</span>
    <span>${TYPE_NAMES[q.t]}</span>
    ${everCorrect?'<span style="background:rgba(6,214,160,.15);color:var(--correct)">已答对</span>':''}
    ${everWrong?'<span style="background:rgba(239,71,111,.15);color:var(--wrong)">曾答错</span>':''}
  </div>`;
  html += `<div class="question-text">${q.q}</div>`;

  const renderOpts = getOptionsHTML(q, userAns, finished, correct, getShuffledAnswer(q));
  html += renderOpts;

  if(isHot) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?'▶ 完成返回':'▶ 下一题'}</button>
    </div>`;
  } else if(!finished) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>✅ 确认</button>
    </div>`;
  } else {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?(quizState.mode==='exam'?'📊 交卷查看成绩':'▶ 完成返回'):'▶ 下一题'}</button>
    </div>`;
  }

  if(finished) {
    const badge = correct ? '✅ 回答正确!' : '❌ 回答错误';
    const cls = correct ? 'correct' : 'wrong';
    const gItems = getGlossaryForQuestion(q);
    let gHtml = '';
    if(gItems.length) {
      gHtml = '<div class="glossary"><div class="glossary-title">词汇附录</div>';
      gItems.forEach(g => {
        gHtml += '<div class="glossary-item"><span class="glossary-term">' + g.term + '</span><span class="glossary-def">\u00a0\u2014\u00a0' + g.def.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span></div>';
      });
      gHtml += '</div>';
    }
    html += `<div class="explanation show">
      <div class="result-badge ${cls}">${badge}</div>
      <div class="exp-text"><strong>正确答案：</strong>${formatAnswer(q)}</div>
      <div class="exp-text" style="margin-top:8px"><strong>解析：</strong>${highlightGlossaryTerms(fmtExp(q.e))}</div>
      ${q.s?`<div class="exp-source">来源：${q.s}</div>`:''}
      ${gHtml}
    </div>`;
  }

  html += `<div class="qnav"><h4>题号导航</h4><div class="qnav-grid">`;
  quizState.questions.forEach((qq, i) => {
    const qAnswers = answers.filter(a=>a.id===qq.id);
    const qCor = qAnswers.some(a=>a.ok);
    const qWro = qAnswers.some(a=>!a.ok);
    let cls = '';
    if(i===quizState.currentIdx) cls='current';
    else if(qCor) cls='done-correct';
    else if(qWro) cls='done-wrong';
    html += `<div class="qnav-item ${cls}" onclick="jumpToQuestion(${i})">${i+1}</div>`;

  html += `</div></div>`;
