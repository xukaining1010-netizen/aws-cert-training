系统每天须处理超过 10,000 个内容源，峰值负载为 500 个并发上传。系统还须从文档和多媒体文件中提取关键概念并创建上下文准确的摘要。生成的学习材料必须支持带版本控制的实时协作。应选择哪种方案？","o":[{"l":"A","t":"将 Amazon Bedrock Data Automation(BDA) 与 AWS Lambda 函数结合使用来编排文档文件处理。使用 Amazon Bedrock 知识库处理所有多媒体。通过复制将内容存储在 Amazon DocumentDB 中。使用 Amazon SNS 主题订阅进行协作。使用 Amazon Bedrock Agent 跟踪更改。"},{"l":"B","t":"将 Amazon Bedrock Data Automation(BDA) 与基础模型 (FM) 结合使用来处理文档文件。将 BDA 与 Amazon Textract 集成以提取 PDF，并与 Amazon Transcribe 集成以提取多媒体文件。将处理后的内容存储在启用版本控制的 Amazon S3 中。将元数据存储在 Amazon DynamoDB 中。使用 AWS AppSync GraphQL 订阅和 DynamoDB 进行实时协作。"},{"l":"C","t":"将 Amazon Bedrock Data Automation(BDA) 与 Amazon SageMaker AI 终端节点结合使用来托管内容提取和摘要模型。使用 Amazon Bedrock Guardrails 从所有文件类型中提取内容。将文档文件存储在 Amazon Neptune 中以进行时间序列分析。使用 Amazon Bedrock Chat 进行实时消息传递进行协作。"},{"l":"D","t":"将 Amazon Bedrock Data Automation(BDA) 与 AWS Lambda 函数结合使用来处理批量内容文件。微调 Amazon Bedrock 中的基础模型 (FM)，以对所有内容类型的文档进行分类。使用带有分片的集群模式将处理后的数据存储在 Amazon ElastiCache(Redis OSS) 中。使用 Amazon Bedrock 中的提示管理进行版本控制。"}],"a":["B"],"e":"**正确答案：B。** 使用 Amazon Bedrock Data Automation（BDA）与 Foundation Model（FM，基础模型）处理文档文件，集成 Amazon Textract 提取 PDF、Amazon Transcribe 处理多媒体文件，将内容存储在启用版本控制的 Amazon S3 中，元数据存储在 DynamoDB 中，通过 AWS AppSync GraphQL 订阅实现实时协作。\n\n**为什么对：** BDA 专为编排大规模多模态数据处理管道设计，与 FM 自然集成以进行摘要和概念提取，适合日处理 10,000+ 源的高并发场景。Textract 针对 PDF 文档的结构化/非结构化文本提取优化，Transcribe 可将视频转为文本用于下游语义分析。S3 版本控制提供不可变的对象历史和回滚功能。DynamoDB 支持高吞吐、低延迟访问，可自动扩展处理峰值并发。AppSync GraphQL 订阅与 DynamoDB 流无缝集成，实现实时协作同步。\n\n**其他选项为什么错：**\n- A. BDA + Lambda + Bedrock 知识库处理多媒体 + DocumentDB + SNS：SNS 不支持协作状态同步，DocumentDB 未针对版本化文档存储优化。\n- C. BDA + SageMaker 端点 + Guardrails 提取 + Neptune + Bedrock Chat：Guardrails 用于内容安全而非内容提取，Neptune 不适合文档工作负载。\n- D. BDA + Lambda + 微调 FM 分类 + ElastiCache(Redis) + 提示管理版本控制：ElastiCache 不适合持久存储或版本控制，提示管理不等于文档版本控制。","s":"源#65"},{"id":"D1-066","d":1,"t":"single","q":"一家法律研究公司拥有 1,500 万份法律文件，包括法规、法院裁决和案件摘要。当前分块策略将文本分割为 500 个 token 的固定长度块，经常将上下文相关的信息（如法律论证、法院意见或法规引用）拆分到不同块中。研究人员报告生成的输出经常忽略关键上下文或引用过时的法律信息。近期日志显示响应时间增加了 40%，p95 延迟超过 2 秒。存储需求预计一年内从 90 GB 增长到 360 GB。公司需要大规模提升检索相关性和系统性能。应选择哪种方案？","o":[{"l":"A","t":"将嵌入向量维度从 768 增加到 4,096，而不改变现有的分块或预处理策略。"},{"l":"B","t":"将动态检索替换为存储在 Amazon S3 中的静态、预先编写的摘要。使用 Amazon CloudFront 提供摘要以减少计算需求并提高可预测性。"},{"l":"C","t":"更新分块策略以使用语义边界，例如完整的法律论证、条款或部分，而不是固定的标记限制。重新生成向量嵌入以与新块结构对齐。"},{"l":"D","t":"从 OpenSearch Service 迁移到 Amazon DynamoDB。实施基于关键字的索引，以更快地查找法律概念。"}],"a":["C"],"e":"**正确答案：C。** 将分块策略更新为基于语义边界（如完整的法律论证、条款或章节）进行分块，并重新生成向量嵌入以对齐新的块结构。\n\n**为什么对：** 固定 token 分块破坏了法律文本的语义连续性，导致法律论点和引用被拆散，检索到表面匹配但上下文不完整的片段。基于语义边界的分块可保留完整的法律论证和引用上下文，提升检索准确性并减少幻觉。重新生成与新块结构对齐的嵌入可提高向量搜索效率，减少不必要的比较，帮助在数据集从 90 GB 扩展到 360 GB 时控制延迟。\n\n**其他选项为什么错：**\n- A. 仅增加向量维度到 4,096：增加计算成本和延迟，但未解决分块策略导致的上下文断裂核心问题。\n- B. 用 S3 静态摘要 + CloudFront 替代动态检索：去除了动态推理能力，违背 RAG 系统的核心目的。\n- D. 迁移到 DynamoDB + 关键字索引：完全放弃向量语义搜索，基于关键字的索引无法满足细致的法律研究需求。","s":"源#66"},{"id":"D1-067","d":1,"t":"single","q":"一家金融服务公司需要预处理非结构化数据（客户记录、财务报告和文档），将其存储在 Amazon S3 中以支持 Amazon Bedrock 应用。公司必须验证数据质量、创建可审计的元数据、监控数据指标，并自定义文本分块以优化 Foundation Model（FM，基础模型）性能。应以最少的开发工作满足需求，应选择哪种方案？","o":[{"l":"A","t":"使用 Amazon SageMaker Data Wrangler 创建数据流。配置 Amazon CloudWatch 指标和警报以监控数据质量。使用自定义 AWS Lambda 函数预处理数据。将处理后的数据加载到 Amazon Bedrock 中。"},{"l":"B","t":"设置 AWS Glue 爬网程序来对数据源进行编目。创建 AWS Glue ETL 作业以运行自定义转换脚本。使用 AWSGlue 数据质量来验证和监控数据质量。将处理后的数据加载到 Amazon Bedrock 中。"},{"l":"C","t":"使用 Amazon Comprehend 提取实体。创建一个 AWS Lambda 函数来对文本进行分块。运行 Amazon Athena 来查询和验证数据质量。将处理后的数据加载到 Amazon Bedrock 中。"},{"l":"D","t":"创建 AWS Step Functions 工作流程来编排数据预处理任务。在 AmazonEC2 实例上运行自定义代码。使用 Amazon SageMaker Model Monitor 监控数据质量。将处理后的数据加载到 Amazon Bedrock 中。"}],"a":["B"],"e":"**正确答案：B。** 使用 AWS Glue Crawlers（爬网程序）对数据源编目，通过 AWS Glue ETL 作业运行自定义转换脚本，使用 AWS Glue Data Quality（数据质量）验证和监控数据质量，最后将处理后的数据加载到 Amazon Bedrock。\n\n**为什么对：** AWS Glue 专为大规模数据准备设计，与 S3 无缝集成。Glue Crawlers 自动推断架构并填充 Glue Data Catalog，为所有数据集创建可审计、可查询的元数据。Glue ETL 作业允许实现自定义转换逻辑，包括针对 FM 上下文窗口优化的文本分块策略。Glue Data Quality 提供内置规则集验证完整性、准确性和一致性，并发布可监控的质量指标。作为完全托管服务，无需管理基础设施，开发工作量最低。\n\n**其他选项为什么错：**\n- A. SageMaker Data Wrangler + CloudWatch + 自定义 Lambda：需要自定义逻辑进行验证、监控和分块，增加开发复杂度。\n- C. Comprehend 提取实体 + Lambda 分块 + Athena 查询验证：需要多个自定义组件进行验证和分块，开发工作量大。\n- D. Step Functions + EC2 自定义代码 + SageMaker Model Monitor：引入不必要的基础设施管理，Model Monitor 针对的是模型漂移而非数据预处理质量。","s":"源#67"},{"id":"D1-068","d":1,"t":"single","q":"一家零售公司正在使用 Amazon Bedrock 开发客户服务 AI 助手。分析表明 70% 的客户查询是简单的产品问题，较小模型即可处理；30% 是复杂的退货政策问题，需要高级推理。公司希望实施一个经济高效的模型选择框架，根据查询复杂度自动将客户查询路由到合适的模型。框架须保持高客户满意度并最大限度减少响应延迟。应以最少的实施工作满足需求，应选择哪种方案？","o":[{"l":"A","t":"创建一个多阶段架构，使用小型基础模型 (FM) 对每个查询的复杂性进行分类。将简单的查询转至更小、更具成本效益的模型。将复杂的查询路由到更大、更强大的模型。使用 AWS Lambda 函数来处理路由逻辑。"},{"l":"B","t":"使用 Amazon Bedrock 智能提示路由自动分析查询。将简单的产品查询路由至较小的型号，将复杂的退货政策查询路由至功能更强大的大型型号。"},{"l":"C","t":"实施使用 Amazon Bedrock 中型基础模型 (FM) 并按需定价的单一模型解决方案。在模型提示中包含特殊说明，以使用同一模型处理简单和复杂查询。"},{"l":"D","t":"为简单和复杂的查询创建单独的 Amazon Bedrock 终端节点。实施基于关键字检测的基于规则的路由系统。对较小的模型使用按需定价，对较大的模型使用预配置吞吐量。"}],"a":["B"],"e":"**正确答案：B。** 使用 Amazon Bedrock Intelligent Prompt Routing（智能提示路由）自动分析查询，将简单产品查询路由至较小模型、复杂退货政策查询路由至更强大的大型模型。\n\n**为什么对：** Bedrock 智能提示路由是原生功能，自动分析传入提示的特征和复杂度并选择最合适的 FM，无需自定义分类逻辑或编排代码。这直接满足\"最少实施工作\"的要求。路由决策由 Bedrock 内联处理，无需额外的 Lambda、分类模型调用或路由规则维护。70% 的简单查询路由到小型低成本模型可最大化节省成本和降低延迟，30% 的复杂查询自动路由到大型模型保证推理质量。\n\n**其他选项为什么错：**\n- A. 小型 FM 分类 + Lambda 路由 + 大小模型分流：引入额外推理步骤和自定义逻辑，增加延迟和实施工作。\n- C. 单一中型 FM + 按需定价：对所有查询使用同一模型，简单查询成本过高，无法实现差异化路由。\n- D. 独立端点 + 关键字检测规则路由 + 预配置吞吐量：基于关键字的规则脆弱且不准确，端点管理增加运营开销。","s":"源#68"},{"id":"D1-069","d":1,"t":"single","q":"一家金融服务公司正在创建一个 Retrieval Augmented Generation（RAG，检索增强生成）应用，使用 Amazon Bedrock 生成市场活动摘要。该应用依赖向量数据库存储索引计数较低的小型专有数据集，须执行相似性搜索。Amazon Bedrock 模型的响应须最大化准确性并保持高性能。公司需要配置向量数据库并与应用集成。应选择哪种方案？","o":[{"l":"A","t":"启动 Amazon MemoryDB 集群并使用 Flat 算法配置索引。根据性能指标配置水平扩展策略。"},{"l":"B","t":"启动 Amazon MemoryDB 集群并使用分层可导航小世界 (HNSW) 算法配置索引。根据性能指标配置垂直扩展策略。"},{"l":"C","t":"启动 Amazon Aurora PostgreSQL 集群并使用平面压缩倒排文件 (IVFFlat) 算法配置索引。配置实例类以在负载增加时扩展到更大的尺寸。"},{"l":"D","t":"启动具有 IVFFlat 索引和高探测值的 Amazon DocumentDB 集群。将与集群的连接配置为副本集。将读取分发到副本实例。"}],"a":["B"],"e":"**正确答案：B。** 启动 Amazon MemoryDB 集群，使用 HNSW（Hierarchical Navigable Small World，分层可导航小世界）算法配置索引，并配置垂直扩展策略。\n\n**为什么对：** Amazon MemoryDB 是完全托管的内存数据库，可提供微秒级延迟，非常适合需要快速向量相似性搜索的实时 RAG 工作负载。对于索引计数较低的小型数据集，HNSW 算法具有较高的召回率和准确性，能以最小的精度损失返回语义最相关的向量，直接提升 Bedrock FM 生成响应的质量。MemoryDB 的垂直扩展足以满足有限数据集的需求，可增加内存和计算容量而无需管理分布式索引或分片策略，简化运维。\n\n**其他选项为什么错：**\n- A. MemoryDB + Flat 算法 + 水平扩展：Flat 算法对每个向量执行暴力搜索，计算量大、效率低，即使中等查询量也会产生性能问题。\n- C. Aurora PostgreSQL + IVFFlat 算法 + 实例扩展：关系数据库未针对内存向量搜索优化，延迟更高，运营开销更大。\n- D. DocumentDB + IVFFlat + 副本集读分发：DocumentDB 并非专为高性能向量相似性工作负载设计，副本管理增加不必要的复杂性。","s":"源#69"},{"id":"D1-070","d":1,"t":"single","q":"一家医疗公司正在构建一个生成式 AI 应用，使用 Retrieval Augmented Generation（RAG，检索增强生成）提供基于证据的医疗信息。应用使用 Amazon OpenSearch Service 检索向量嵌入。用户报告搜索经常遗漏包含精确医学术语和首字母缩略词的结果，且返回过多语义相似但不相关的文档。即使文档集增长到数百万级别，公司也需要提升检索质量并保持低延迟。应以最少运营开销满足需求，应选择哪种方案？","o":[{"l":"A","t":"通过将向量相似性与关键字匹配相结合来配置混合搜索，以提高语义理解以及精确的术语和首字母缩略词匹配。"},{"l":"B","t":"将向量嵌入的维度从 384 增加到 1536。使用后处理 AWS Lambda 函数在检索后过滤掉不相关的结果。"},{"l":"C","t":"将 OpenSearch 服务替换为 Amazon Kendra。在预处理过程中使用查询扩展来处理医学首字母缩略词和术语变体。"},{"l":"D","t":"实施一个两阶段检索架构，其中初始向量搜索结果由 Amazon SageMaker 上托管的 ML 模型重新排名。"}],"a":["A"],"e":"**正确答案：A。** 配置 Hybrid Search（混合搜索），将向量相似性搜索与关键字匹配相结合，同时提升语义理解和精确术语/缩略词匹配。\n\n**为什么对：** 医学领域中精确的术语、缩写和首字母缩略词（如药物名称、诊断代码）至关重要。纯向量搜索往往低估精确匹配的权重，导致遗漏结果和过多不相关文档。Amazon OpenSearch Service 原生支持混合搜索，将 BM25 关键字检索与向量相似性搜索结合：关键字搜索确保精确匹配术语和缩略词，向量搜索捕获语义含义和上下文相似性。混合搜索在同一 OpenSearch 索引和查询路径中运行，无需额外基础设施，在百万级文档规模下仍保持低延迟。\n\n**其他选项为什么错：**\n- B. 增加向量维度到 1536 + Lambda 后处理过滤：增加计算成本和延迟，但未解决精确术语召回问题。\n- C. 替换为 Amazon Kendra + 查询扩展：引入新服务和摄取管道，增加运营开销和延迟。\n- D. 两阶段架构 + SageMaker 托管重排序模型：添加模型托管和重排序基础设施，OpenSearch 已提供原生混合检索时不必要的复杂度。","s":"源#70"},{"id":"D1-071","d":1,"t":"single","q":"一位 GenAI 开发人员正在构建基于 Retrieval Augmented Generation（RAG，检索增强生成）的客户支持应用，使用 Amazon Bedrock Foundation Model（FM，基础模型）。应用须处理存储在 Amazon S3 中的 50 GB 历史客户对话（JSON 格式），并将处理后的数据作为检索语料库。数据处理工作流须从文档中提取相关数据、删除客户个人身份信息（PII），并生成用于向量存储的嵌入。处理流程须具有成本效益且须在 4 小时内完成。应以最低运营开销满足需求，应选择哪种方案？","o":[{"l":"A","t":"使用 AWS Lambda 和 Amazon Comprehend 并行处理文件、删除 PII 并调用 Amazon Bedrock API 生成向量。配置 Lambda 并发限制和内存设置以优化吞吐量。"},{"l":"B","t":"创建 AWS Glue ETL 作业以对数据运行 PII 检测脚本。使用 Amazon SageMaker Processing 运行 Hugging Face Processor 以通过预训练模型生成嵌入。将嵌入存储在 Amazon OpenSearch Service 中。"},{"l":"C","t":"部署一个运行 Apache Spark 的 Amazon EMR 集群，该集群具有调用 Amazon Comprehend 来检测 PII 的用户定义函数 (UDF)。使用 Amazon Bedrock API 生成矢量。使用 pgvector 扩展将输出存储在 Amazon Aurora PostgreSQL 中。"},{"l":"D","t":"实施一个数据处理管道，该管道使用 AWS Step Functions 来编排工作负载，该工作负载使用 Amazon Comprehend 检测 PII 并使用 Amazon Bedrock 生成嵌入。直接将工作流程与 Amazon OpenSearch Serverless 集成以存储向量并提供相似性搜索功能。"}],"a":["D"],"e":"**正确答案：D。** 使用 AWS Step Functions（步骤函数）编排工作负载，通过 Amazon Comprehend 检测并删除 PII，使用 Amazon Bedrock 生成嵌入，直接与 Amazon OpenSearch Serverless 集成存储向量并提供相似性搜索。\n\n**为什么对：** Step Functions 提供无服务器编排层，可协调并行处理步骤、重试和错误处理，无需管理集群或调整长时运行计算。Comprehend 以托管方式执行 PII 检测和删除。Bedrock 生成嵌入使整个工作流保持在 AWS 托管服务内。OpenSearch Serverless 提供低运营的向量存储，无需调整集群大小、节点维护或分片管理。Step Functions 可批量并行写入 OpenSearch Serverless，通过控制并发和块大小满足 4 小时内完成 50 GB 处理的目标。\n\n**其他选项为什么错：**\n- A. Lambda + Comprehend 并行处理：在 4 小时内调度 50 GB 的 Lambda 并发性和每次调用开销可能复杂且成本高。\n- B. Glue ETL + SageMaker Processing + Hugging Face 模型：引入 SageMaker 处理和自定义嵌入模型管理，增加运营复杂性。\n- C. EMR + Spark + Comprehend UDF + Aurora PostgreSQL：需要 EMR 集群管理和调优，与最低运营开销要求相悖。","s":"源#71"},{"id":"D1-072","d":1,"t":"single","q":"一家制药公司正在开发使用 Amazon Bedrock Knowledge Bases（Bedrock 知识库）的 RAG 应用。知识库以 Amazon OpenSearch Service 为数据源，包含超过 2,500 万篇科学论文。用户报告当查询跨越论文的方法、结果和讨论部分时，应用会产生不一致的答案，引用论文中不相关的部分。公司需要改进知识库，以在整个数据集规模上保留相关段落的语义上下文。应选择哪种方案？","o":[{"l":"A","t":"配置知识库以使用固定大小的分块。设置 300 个令牌的最大块大小和块之间的 10.% 重叠。使用适当的 Amazon Bedrock 嵌入模型。"},{"l":"B","t":"配置知识库以使用分层分块。使用包含 1,000 个令牌的父块和包含 200 个令牌的子块。设置块之间 50 个令牌的重叠。"},{"l":"C","t":"配置知识库以使用语义分块。使用缓冲区大小 1 和断点百分比阈值 85% 来根据内容含义确定块边界。"},{"l":"D","t":"配置知识库不使用分块。在摄取之前手动将每个文档拆分为单独的文件。在检索期间应用后处理重新排序。"}],"a":["B"],"e":"**正确答案：B。** 配置知识库使用 Hierarchical Chunking（分层分块），设置包含 1,000 个 token 的父块和 200 个 token 的子块，块间 50 个 token 重叠。\n\n**为什么对：** 科学论文中相关信息通常分布在方法、结果和讨论等多个部分。分层分块创建较大的父块（捕获更广泛的上下文窗口）和较小的子块（保留检索精度）。当检索器识别到相关子块时，还可引入关联的父上下文，使基础模型看到完整的方法或讨论框架。块间重叠进一步降低了关键转折或引用跨块分割的风险。此方案在知识库级别配置，无需自定义代码，运营高效。\n\n**其他选项为什么错：**\n- A. 固定 300 token 分块 + 10% 重叠：扁平的固定分块会将逻辑相连的论述拆散，导致检索到与术语匹配但不匹配完整意图的表面片段。\n- C. 语义分块（缓冲区 1 + 阈值 85%）：改善了边界放置，但本质上不提供帮助保持跨部分连续性的多分辨率结构。\n- D. 不使用分块 + 手动拆分 + 后处理重排序：对 2,500 万篇论文手动处理带来高运营复杂度和不一致性。","s":"源#72"},{"id":"D1-073","d":1,"t":"single","q":"一家图书出版公司希望建立一个使用 AI 助手的图书推荐系统。AI 助手将使用机器学习从公司图书目录中生成推荐书籍列表，须根据与客户的对话内容推荐书籍。公司将书籍文本、客户和编辑评论以及提取的书籍元数据存储在 Amazon S3 中。系统须支持低延迟响应并有效扩展以处理超过 10,000 个并发用户。应选择哪种方案？","o":[{"l":"A","t":"使用 Amazon Bedrock 知识库生成嵌入。将嵌入作为向量存储存储在 Amazon OpenSearch Service 中。创建查询知识库的 AWS Lambda 函数。配置 Amazon API Gateway 以在处理用户请求时调用 Lambda 函数。"},{"l":"B","t":"使用 Amazon Bedrock 知识库生成嵌入。将嵌入作为向量存储存储在 Amazon DynamoDB 中。创建查询知识库的 AWS Lambda 函数。配置 Amazon API Gateway 以在处理用户请求时调用 Lambda 函数。"},{"l":"C","t":"使用 Amazon SageMaker AI 部署预训练模型来构建个性化图书推荐引擎。将模型部署为 SageMaker AI 端点。使用 Amazon API Gateway 调用模型终端节点。"},{"l":"D","t":"创建 Amazon Kendra GenAI Enterprise Edition 索引，该索引使用 S3 连接器对 Amazon S3 中存储的图书目录数据建立索引。在 Kendra 索引中配置内置常见问题解答。开发一个 AWS Lambda 函数，根据用户对话查询 Kendra 索引。部署 Amazon API Gateway 以公开此功能并调用 Lambda 函数。"}],"a":["A"],"e":"**正确答案：A。** 使用 Amazon Bedrock Knowledge Bases（Bedrock 知识库）生成嵌入，将嵌入作为向量存储在 Amazon OpenSearch Service 中，创建 Lambda 函数查询知识库，配置 API Gateway 处理用户请求时调用 Lambda。\n\n**为什么对：** 公司源数据已在 S3 中，与 Bedrock 知识库的摄取工作流自然对齐。知识库自动提取文本、评论和元数据，使用嵌入模型生成向量并存储在 OpenSearch Service 中。OpenSearch 提供可扩展的向量搜索和 k-NN 相似性检索，支持低延迟响应。基于对话推荐的要求意味着系统须理解自然语言意图进行语义检索，知识库为此提供托管编排。API Gateway + Lambda 是标准的可扩展前端模式，支持 10,000+ 并发用户。\n\n**其他选项为什么错：**\n- B. Bedrock 知识库 + DynamoDB 向量存储：DynamoDB 不是 Bedrock 知识库支持的标准向量存储后端，向量索引和相似性搜索需额外实现。\n- C. SageMaker 预训练模型 + 端点 + API Gateway：需要大量 ML 生命周期管理、模型托管和调优工作。\n- D. Amazon Kendra GenAI Edition + S3 连接器 + FAQ：侧重于检索和问答，而非基于嵌入和对话上下文的生成式 RAG 推荐工作流。","s":"源#73"},{"id":"D1-074","d":1,"t":"single","q":"一家医疗保健公司正在开发处理医疗查询的应用程序。应用须通过减少语义稀释来高精度回答复杂查询，引用医疗文档中特定领域的术语以减少医学术语的歧义。应用须每分钟处理 1,000 个查询，响应时间小于 2 秒。应以最低运营开销满足需求，应选择哪种方案？","o":[{"l":"A","t":"使用 Amazon API Gateway 将传入查询路由到 Amazon Bedrock 代理。配置代理以使用 Anthropic Claude 模型来分解查询，并使用 Amazon Titan 模型来扩展查询。创建 Amazon Bedrock 知识库来存储参考医疗文档。"},{"l":"B","t":"配置 Amazon Bedrock 知识库来存储参考医疗文档。在知识库中启用查询分解。配置使用基础模型和知识库来支持应用程序的 Amazon Bedrock 流。"},{"l":"C","t":"使用 Amazon SageMaker AI 托管自定义 ML 模型以进行查询分解和查询扩展。配置 Amazon Bedrock 知识库以存储参考医疗文档。对知识库中的文档进行加密。"},{"l":"D","t":"创建 Amazon Bedrock 代理来协调多个 AWS Lambda 函数来分解查询。创建 Amazon Bedrock 知识库来存储参考医疗文档。使用代理的内置知识库功能。为代理添加深入的研究和推理功能，以减少医学术语中的歧义。"}],"a":["B"],"e":"**正确答案：B。** 配置 Amazon Bedrock Knowledge Bases（Bedrock 知识库）存储参考医疗文档，在知识库中启用 Query Decomposition（查询分解），配置使用基础模型和知识库支撑应用的 Amazon Bedrock Flows（流）。\n\n**为什么对：** 减少复杂医疗查询的语义稀释，关键在于改进检索查询的精准度。知识库中的查询分解功能可将复杂查询拆分为更小、更有针对性的子查询，提升每个子问题的检索精度和召回率，帮助模型生成更准确的综合响应。Bedrock Flows 以托管方式编排多步生成式 AI 工作流（预处理、检索、模型调用、格式化），无需维护自定义状态机或多个 Lambda 函数。整个方案保持在 Bedrock 托管功能内，运营足迹最小。\n\n**其他选项为什么错：**\n- A. API Gateway + Bedrock Agent + Claude 分解 + Titan 扩展 + 知识库：引入代理加 API 路由和多模型选择，增加配置和运行时复杂性。\n- C. SageMaker AI 托管自定义 ML 模型 + Bedrock 知识库 + 加密：需要托管和扩展自定义模型端点，显著增加运营负担和延迟风险。\n- D. Bedrock Agent 编排多个 Lambda + 知识库 + 深度推理：依赖代理编排多个 Lambda，增加冷启动和集成开销。","s":"源#74"},{"id":"D1-075","d":1,"t":"single","q":"一所大学最近对一系列档案文件、学术期刊和手稿进行了数字化，存储在 AWS Lake Formation 数据湖中。大学聘请了一位 GenAI 开发人员来构建解决方案，允许用户使用文本查询搜索数字化文件。方案须返回与用户查询语义相似的期刊摘要，用户须能根据与摘要相关的文本和元数据搜索数字化馆藏。数字化文件的元数据不包含关键字。方案须根据文本的相似性将相似的摘要相互匹配。数据湖包含不到 100 万个文件。应以最低运营开销满足需求，应选择哪种方案？","o":[{"l":"A","t":"使用 Amazon Bedrock 中的 Amazon Titan Embeddings 创建数字化文件的矢量表示。将嵌入存储在 Amazon OpenSearch Service 的 OpenSearch Neural 插件中。"},{"l":"B","t":"使用 Amazon Comprehend 从数字化文件中提取主题。将主题和文件元数据存储在 Amazon Aurora PostgreSQL 数据库中。根据 Aurora 数据库中的数据查询抽象元数据。"},{"l":"C","t":"使用 Amazon SageMaker AI 部署句子转换器模型。使用该模型创建数字化文件的矢量表示。将嵌入存储在具有 pgvector 扩展名的 Amazon Aurora PostgreSQL 数据库中。"},{"l":"D","t":"使用 Amazon Bedrock 中的 Amazon Titan Embeddings 创建数字化文件的矢量表示。将嵌入存储在具有 pgvector 扩展的 Amazon Aurora PostgreSQL 无服务器数据库中。"}],"a":["D"],"e":"**正确答案：D。** 使用 Amazon Bedrock 中的 Amazon Titan Embeddings 创建数字化文件的向量表示，将嵌入存储在带有 pgvector 扩展的 Amazon Aurora PostgreSQL Serverless 数据库中。\n\n**为什么对：** 元数据不包含关键字且须按含义相似性匹配摘要，明确需要基于嵌入的语义搜索。Amazon Titan Embeddings 提供托管嵌入生成，无需托管或维护 ML 模型，消除模型预置、补丁和生命周期管理的运营工作。Aurora PostgreSQL Serverless 带 pgvector 扩展支持向量存储和相似性搜索，同时自动调整容量适应工作负载变化，减少容量规划和扩展任务。数据量不到 100 万个文件，基于 PostgreSQL 的向量存储在运营上通常比专用搜索集群更简单，同时满足语义相似性和元数据过滤查询的需求。\n\n**其他选项为什么错：**\n- A. Titan Embeddings + OpenSearch Neural 插件：运营 OpenSearch 域需要处理域大小、分片策略和性能调优等额外工作。\n- B. Comprehend 主题提取 + Aurora PostgreSQL 查询：主题提取不等于基于嵌入的语义匹配，特别是在无关键字且须按含义比较摘要时不可靠。\n- C. SageMaker 部署句子转换器模型 + Aurora pgvector：需要在 SageMaker 中部署和管理模型端点，包括扩展、监控和模型管理，运营开销最大。","s":"源#75"},{"id":"D1-076","d":1,"t":"single","q":"一家金融服务公司希望开发一个 Amazon Bedrock 应用，使分析师能够查询季度收益报告和财务报表。财务文档通常有 5-100 页，包含表格数据和文本。应用须提供上下文准确的响应，保留财务指标与其解释文本之间的关系。为支持准确且可扩展的检索，应用须结合文档分段和上下文管理策略。应选择哪种方案？","o":[{"l":"A","t":"使用直接模型调用方法，该方法使用 Anthropic Claude 将每个财务文档作为单个输入进行处理。使用微调的提示指示模型分别解析表格和文本。"},{"l":"B","t":"使用 Amazon Bedrock 知识库创建检索增强生成 (RAG) 应用程序，该应用程序从财务文档的上下文分块部分中检索相关信息。根据文档的结构布局对文档进行分段。包括引用原始来源材料的引文。"},{"l":"C","t":"部署一个 Amazon Bedrock 代理，该代理具有一个调用自定义 AWS Lambda 函数的操作组来分析财务文档。配置 Lambda 函数以在用户提交有关财务指标的查询时执行固定大小的分块。"},{"l":"D","t":"创建一款专门针对结构化数据进行优化的 Amazon Bedrock 应用程序。创建针对非结构化数据优化的第二个应用程序。配置每个应用程序以使用适合应用程序内容类型的定制分块策略。实施逻辑以将查询链接到适当的源。"}],"a":["B"],"e":"**正确答案：B。** 使用 Amazon Bedrock Knowledge Bases（Bedrock 知识库）创建 RAG 应用，根据文档的结构布局对文档进行分段，从上下文分块部分中检索相关信息，并包含引用原始来源材料的引文。\n\n**为什么对：** 财务报告经常将表格与解释性叙述交织在一起，准确分析取决于保持这些元素的逻辑关联。根据结构布局（如节、小节、表格及其周围注释）分段，知识库可检索在推理过程中维持财务指标与解释文本关系的语义相关块。Bedrock 知识库支持上下文分块策略而非简单的固定大小分割，对财务文件至关重要。包含引文提升分析师的信任度和可审计性。知识库作为托管服务管理嵌入生成、索引和检索编排，支持跨大型文档集的扩展。\n\n**其他选项为什么错：**\n- A. 直接模型调用处理整个文档：对 5-100 页文档增加 token 使用、延迟和成本，且面临上下文截断风险，扩展性差。\n- C. Bedrock Agent + Lambda + 固定大小分块：固定大小分块通常会破坏财务内容中表格与文本的语义关系。\n- D. 结构化/非结构化数据分两个应用 + 自定义分块 + 查询路由：增加不必要的架构复杂性和运营开销，统一 RAG 方案已可处理混合内容。","s":"源#76"},{"id":"D1-077","d":1,"t":"single","q":"一家医疗保健公司正在开发一个文档管理系统，将医学研究论文存储在 Amazon S3 存储桶中。公司需要一个全面的元数据框架来提高 GenAI 应用的搜索精度。元数据须包括文档时间戳、作者信息和研究领域分类。方案须在所有上传文档中保持一致的元数据结构，并允许 Foundation Model（FM，基础模型）在不访问完整内容的情况下了解文档上下文。应选择哪种方案？","o":[{"l":"A","t":"将文档时间戳存储在 Amazon S3 系统元数据中。使用 S3 对象标签进行域分类。实现自定义用户定义的元数据来存储作者信息。"},{"l":"B","t":"设置具有合法保留的 S3 对象锁来跟踪文档时间戳。使用 S3 对象标签获取作者信息。实施 S3 访问点进行域分类。"},{"l":"C","t":"使用 S3 清单报告来跟踪时间戳。为域分类创建 S3 访问点。将作者信息存储在 S3 Storage Lens 仪表板中。"},{"l":"D","t":"使用自定义的用户定义元数据来存储作者信息。使用 S3 对象锁定保留期作为时间戳。使用 S3 事件通知进行域分类。"}],"a":["A"],"e":"**正确答案：A。** 将文档时间戳存储在 Amazon S3 系统元数据中，使用 S3 对象标签进行研究领域分类，使用自定义用户定义的元数据存储作者信息。\n\n**为什么对：** S3 系统元数据自动记录对象创建和修改时间戳，提供可靠一致的时间上下文，无需额外处理。自定义用户定义元数据适合存储结构化属性（如作者信息），这些键值对直接与对象存储、在上传时保持一致，并可通过下游索引或检索系统编程访问。S3 对象标签专为轻量级分类、过滤和访问控制设计，可在组织内标准化研究领域标签。三者结合，FM 可仅基于元数据推断文档上下文（新近度、领域相关性、作者身份），而无需访问完整正文。\n\n**其他选项为什么错：**\n- B. S3 对象锁定（合规保留）跟踪时间戳 + 标签获取作者 + 接入点分类：滥用对象锁定（设计用于合规保留而非时间戳）和接入点（设计用于访问控制而非分类）。\n- C. S3 清单报告跟踪时间戳 + 接入点分类 + Storage Lens 存储作者：Storage Lens 用于存储分析仪表板，不适合存储作者信息。\n- D. 用户定义元数据存作者 + 对象锁定保留期作时间戳 + 事件通知分类：同样滥用对象锁定，事件通知用于触发工作流而非分类标记。","s":"源#77"},{"id":"D1-078","d":1,"t":"single","q":"一家医疗保健公司正在使用 Amazon Bedrock 构建一个系统，帮助从业人员做出临床决策。系统须仅根据已批准的医疗文档向医生提供治疗建议，并须引用特定来源。系统不得产生幻觉或事实不正确的信息。应以最低运营开销满足需求，应选择哪种方案？","o":[{"l":"A","t":"将 Amazon Bedrock 与 Amazon Kendra 集成以检索批准的文档。实施自定义后处理，将生成的响应与源文档进行比较并包含引用。"},{"l":"B","t":"部署 Amazon Bedrock 知识库并将其连接到批准的临床源文档。使用 Amazon Bedrock RetrieveAndGenerate API 从知识库返回引文。"},{"l":"C","t":"使用 Amazon Bedrock 和 Amazon Comprehend Medical 提取医疗实体。针对医学术语数据库实施验证逻辑。"},{"l":"D","t":"使用 Amazon Bedrock 知识库以及 Retrieve API 调用和 InvokeModel API 调用来检索批准的临床源文档。实施验证逻辑以与检索到的来源进行比较并引用来源。"}],"a":["B"],"e":"**正确答案：B。** 部署 Amazon Bedrock Knowledge Bases（Bedrock 知识库），连接已批准的临床源文档，使用 RetrieveAndGenerate API 从知识库返回带引文的响应。\n\n**为什么对：** Bedrock 知识库的 RetrieveAndGenerate API 提供完全托管的 RAG 功能，自动管理文档提取、分块、嵌入、检索和排序。模型仅根据检索到的已批准临床文档生成响应，显著降低幻觉风险。API 还返回显式来源引用，满足监管和临床透明度要求，无需自定义比较或验证逻辑。检索与生成紧密集成，避免了多步骤编排带来的延迟和维护负担。\n\n**其他选项为什么错：**\n- A. Amazon Kendra + 自定义后处理比较引用：引入 Kendra 和自定义后处理逻辑，增加运营复杂性。\n- C. Comprehend Medical 提取实体 + 医学术语库验证：侧重实体提取而非受控知识基础，不保证引用或幻觉预防。\n- D. Bedrock 知识库 + Retrieve API + InvokeModel + 自定义验证逻辑：需要在检索和生成之间手动编排以及自定义验证逻辑，增加开发和维护工作量。","s":"源#78"},{"id":"D1-079","d":1,"t":"single","q":"一家金融服务公司正在构建客户支持应用，根据语义相似性从数据库中检索相关的金融监管文档。应用须与 Amazon Bedrock 集成以生成响应，须搜索英语、西班牙语和葡萄牙语文档，并按元数据（如发布日期、监管机构和文档类型）过滤。数据库存储约 1,000 万个文档嵌入。公司希望最大限度减少管理和维护工作，同时为实时客户交互提供低延迟响应。应选择哪种方案？","o":[{"l":"A","t":"使用 Amazon OpenSearch Serverless 提供矢量搜索功能和元数据过滤。与 Amazon Bedrock 知识库集成，以使用 Anthropic Claude 基础模型启用检索增强生成(RAG)。"},{"l":"B","t":"使用 pgvector 扩展部署 Amazon Aurora PostgreSQL 数据库。将嵌入和元数据存储在表中。使用 SQL 查询进行相似性搜索，并将结果发送到 Amazon Bedrock 以生成响应。"},{"l":"C","t":"使用 Amazon S3 矢量来配置矢量索引和不可过滤的元数据字段。将 S3 矢量与 RAG 的 Amazon Bedrock 集成。"},{"l":"D","t":"设置具有矢量索引的 Amazon Neptune Analytics 数据库。使用基于图形的检索和 Amazon Bedrock 来生成响应。"}],"a":["A"],"e":"**正确答案：A。** 使用 Amazon OpenSearch Serverless 提供向量搜索和元数据过滤功能，与 Amazon Bedrock Knowledge Bases（Bedrock 知识库）集成，使用 Anthropic Claude 基础模型启用 RAG。\n\n**为什么对：** OpenSearch Serverless 专为大容量、低延迟搜索工作负载设计，无需管理集群、容量规划或扩展策略，支持向量搜索和结构化元数据过滤。对于 1,000 万嵌入的多语言数据集，OpenSearch Serverless 可按发布日期、监管机构和文档类型过滤，同时执行跨语言的语义相似性搜索。与 Bedrock 知识库集成提供托管 RAG 工作流，使用 Claude 模型生成准确的响应。Serverless 模式最大限度减少运维工作。\n\n**其他选项为什么错：**\n- B. Aurora PostgreSQL + pgvector + SQL 查询：关系数据库在 1,000 万嵌入规模下向量搜索性能和运维复杂度不如专用搜索服务。\n- C. Amazon S3 Vectors + 不可过滤元数据：S3 Vectors 配置了不可过滤的元数据字段，无法满足按发布日期/机构/类型过滤的要求。\n- D. Neptune Analytics + 图检索：图数据库非向量相似性搜索的最优选择，增加不必要的架构复杂性。","s":"源#79"},{"id":"D1-080","d":1,"t":"single","q":"一家公司提供全球餐厅发现服务，月活跃用户 5,000 万。公司希望在包含 2,000 万家餐厅和 2 亿条评论的数据库中实施语义搜索。数据当前存储在 PostgreSQL 数据库中。方案须支持复杂的自然语言查询，在 500 毫秒内返回至少 95% 的查询结果，保持每小时更新的餐厅详情数据新鲜度，并在高峰期经济高效地扩展。应以最少的开发工作满足需求，应选择哪种方案？","o":[{"l":"A","t":"将餐厅数据迁移到 Amazon OpenSearch Service。实施基于关键字的搜索规则，使用自定义分析器和相关性调整来根据菜品类型、特色和位置等属性查找餐厅。创建 Amazon API Gateway HTTP API 终端节点以将用户查询转换为结构化搜索参数。"},{"l":"B","t":"将餐厅数据迁移到 Amazon OpenSearch Service。使用 Amazon Bedrock 中的基础模型 (FM) 从餐厅描述、评论和菜单项生成矢量嵌入。当用户提交自然语言查询时，使用相同的 FM 将查询转换为嵌入。执行 k 最近邻 (k-NN) 搜索以查找语义相似的结果。"},{"l":"C","t":"将餐厅数据保存在 PostgreSQL 中并实现 pgvector 扩展。使用 Amazon Bedrock 中的基础模型 (FM) 从餐厅数据生成矢量嵌入。将向量嵌入直接存储在 PostgreSQL 中。创建一个 AWS Lambda 函数，以使用相同的 FM 将自然语言查询转换为矢量表示。配置 Lambda 函数以在数据库中执行相似性搜索。"},{"l":"D","t":"使用自定义摄取管道将餐厅数据迁移到 Amazon Bedrock 知识库。配置知识库以自动从餐厅信息生成嵌入。使用具有内置矢量搜索功能的 Amazon Bedrock Retrieve API，通过自然语言输入直接查询知识库。"}],"a":["D"],"e":"**正确答案：D。** 使用自定义摄取管道将餐厅数据迁移到 Amazon Bedrock Knowledge Bases（Bedrock 知识库），配置知识库自动生成嵌入，使用 Bedrock Retrieve API 通过自然语言输入直接查询。\n\n**为什么对：** Bedrock 知识库捆绑了语义搜索最耗时的部分：嵌入生成、向量索引和自然语言检索，应用无需实现单独的服务来生成嵌入、管理向量、构建查询时嵌入转换逻辑或实施 k-NN 搜索编排。自定义摄取管道可配置为每小时同步，满足数据新鲜度要求。Retrieve API 直接处理自然语言查询，无需查询转换代码。作为托管服务，可自动扩展处理高峰负载。在所有选项中，开发工作量最少。\n\n**其他选项为什么错：**\n- A. OpenSearch + 关键字搜索 + API Gateway 转换查询参数：基于关键字搜索而非语义搜索，不支持复杂自然语言查询。\n- B. OpenSearch + Bedrock 嵌入 + k-NN 搜索：需要自行构建嵌入生成管道、向量管理和 k-NN 查询逻辑，开发工作量大。\n- C. PostgreSQL + pgvector + Lambda 查询转换：需要构建嵌入生成管道、Lambda 查询函数和相似性搜索逻辑，开发工作最多。","s":"源#80"},{"id":"D1-081","d":1,"t":"single","q":"一家精品咖啡公司有一款移动应用，通过 Amazon Bedrock 和三阶段提示链生成个性化的咖啡烘焙方案。提示链将用户输入转为结构化元数据、检索烘焙日志，并为每位客户生成个性化烘焙推荐。多个 AWS 区域的用户报告了三个问题：相同输入的烘焙建议不一致、检索步骤推理缓慢、以及不安全的建议（如过高温度冲泡）。公司须提高相同输入的输出一致性至 99.5%，实现推理延迟低于 1 秒，并通过经过验证的安全控制阻止不安全或幻觉的建议。应选择哪种方案？","o":[{"l":"A","t":"使用预配置吞吐量部署 Amazon Bedrock 以稳定推理延迟。应用具有语义拒绝规则的 Amazon Bedrock 护栏来阻止不安全的输出。使用 Amazon Bedrock Prompt Management 通过审批工作流程来管理提示。"},{"l":"B","t":"使用 Amazon Bedrock Agents 管理链接。将模型输入和输出记录到 Amazon CloudWatch Logs。使用 Amazon CloudWatch 中的日志对提示版本执行 A/B 测试。"},{"l":"C","t":"在 Amazon ElastiCache 中缓存提示结果。使用 AWS Lambda 函数预处理元数据并跟踪端到端延迟。使用 AWS X-Ray 识别并修复性能瓶颈。"},{"l":"D","t":"使用 Amazon Kendra 提高烘焙日志检索准确性。在 Amazon DynamoDB 中存储标准化提示元数据。使用 AWS Step Functions 编排多步骤提示。"}],"a":["A"],"e":"**正确答案：A。** 使用 Provisioned Throughput（预配置吞吐量）部署 Amazon Bedrock 以稳定推理延迟，应用带有语义拒绝规则的 Amazon Bedrock Guardrails（护栏）阻止不安全输出，使用 Amazon Bedrock Prompt Management（提示管理）通过审批工作流管理提示。\n\n**为什么对：** 延迟目标低于 1 秒且存在高峰性能下降，说明需要稳定的推理容量。预配置吞吐量为模型保留推理能力，降低限流风险，稳定负载下的响应时间。Bedrock Guardrails 的语义拒绝规则可阻止不安全输出（如危险温度建议），提供经过验证的安全控制。Prompt Management 支持提示版本化和审批工作流，确保相同输入使用相同的审批提示，提高 99.5% 一致性目标。三个组件均为 Bedrock 原生功能，直接对应三个问题。\n\n**其他选项为什么错：**\n- B. Bedrock Agents + CloudWatch 日志 + A/B 测试：日志和 A/B 测试用于观察而非安全控制，不直接解决延迟、一致性或安全问题。\n- C. ElastiCache 缓存 + Lambda 预处理 + X-Ray 追踪：缓存可能返回过时数据，X-Ray 用于诊断而非安全控制，不满足安全阻止要求。\n- D. Kendra 检索 + DynamoDB 元数据 + Step Functions 编排：引入多个额外服务但不解决延迟稳定性或安全控制问题。","s":"源#81"},{"id":"D1-082","d":1,"t":"single","q":"一家制药公司正在开发使用 Amazon Bedrock Knowledge Bases（Bedrock 知识库）的检索增强生成应用。知识库使用 Amazon OpenSearch Service 作为数据源，包含超过 2,500 万篇科学论文。用户报告当查询跨越论文的方法、结果和讨论部分时，应用会产生不一致的答案，引用论文中不相关的部分。公司需要改进知识库，以在整个数据集规模上保留相关段落的语义上下文。应选择哪种方案？","o":[{"l":"A","t":"配置知识库以使用固定大小的分块。设置 300 个令牌的最大块大小和块之间的 10.% 重叠。使用适当的 Amazon Bedrock 嵌入模型。"},{"l":"B","t":"配置知识库以使用分层分块。使用包含 1,000 个令牌的父块和包含 200 个令牌的子块。设置块之间 50 个令牌的重叠。"},{"l":"C","t":"配置知识库以使用语义分块。使用缓冲区大小 1 和断点百分比阈值 85% 来根据内容含义确定块边界。"},{"l":"D","t":"配置知识库不使用分块。在摄取之前手动将每个文档拆分为单独的文件。在检索期间应用后处理重新排序。"}],"a":["B"],"e":"**正确答案：B。** 配置知识库使用 Hierarchical Chunking（分层分块），设置包含 1,000 个 token 的父块和 200 个 token 的子块，块间 50 个 token 重叠。\n\n**为什么对：** 问题的根源是块太小或太\"扁平\"，检索到与术语匹配但缺少完整上下文的孤立片段。科学论文中，完整答案通常依赖方法、结果和讨论之间的链接段落。分层分块创建较大的父块（提供广泛上下文窗口）和较小的子块（保持检索精度）。当检索器识别到相关子块时，可引入关联的父上下文，使基础模型看到完整的方法或讨论框架。块间重叠降低关键转折跨块分割的风险。此方案在知识库级别配置，无需自定义代码。\n\n**其他选项为什么错：**\n- A. 固定 300 token + 10% 重叠：扁平固定分块会将逻辑相连的论述拆散，无法提供多分辨率上下文结构。\n- C. 语义分块（缓冲区 1 + 85% 阈值）：改善边界放置但缺乏帮助保持跨部分连续性的层级结构。\n- D. 不分块 + 手动拆分 + 后处理重排序：对 2,500 万篇论文手动处理的运营复杂度极高。","s":"源#82"},{"id":"D1-083","d":1,"t":"single","q":"一家公司正在构建法律研究 AI 助手，使用 Amazon Bedrock 和 Anthropic Claude Foundation Model（FM，基础模型）。AI 助手须检索高度相关的判例法文件以增强 FM 的响应，须识别法律概念、特定法律术语和引文之间的语义关系，并须快速执行返回精确结果。应选择哪种方案？","o":[{"l":"A","t":"配置 Amazon Bedrock 知识库以使用默认矢量搜索配置。使用 Amazon Bedrock 扩展查询，以改进基于特定术语和引文的法律文档检索。"},{"l":"B","t":"使用 Amazon OpenSearch Service 部署将矢量搜索与关键字搜索相结合的混合搜索架构。应用 Amazon Bedrock 重新排序模型来优化结果相关性。"},{"l":"C","t":"为最终用户启用 Amazon Kendra 查询建议功能。使用 Amazon Bedrock 对搜索结果执行后处理，以识别文档中的语义相似性并生成精确的结果。"},{"l":"D","t":"使用 Amazon OpenSearch Service 与矢量搜索和 Amazon Bedrock Titan Embeddings 来索引和搜索法律文档。使用自定义 AWS Lambda 函数将结果与存储在 Amazon RDS 数据库中的基于关键字的筛选器合并。"}],"a":["B"],"e":"**正确答案：B。** 使用 Amazon OpenSearch Service 部署将向量搜索与关键字搜索相结合的 Hybrid Search（混合搜索）架构，应用 Amazon Bedrock Reranking Model（重排序模型）优化结果相关性。\n\n**为什么对：** 法律研究需要语义理解和精确的词汇精度并重。仅靠向量搜索不足以精确匹配法规引文、案件编号和司法管辖区特定术语。混合搜索将关键字检索（确保引文和术语的高精度）与向量搜索（捕获法律概念和论点间的深层语义关系）结合。Bedrock 重排序模型在初始检索后根据更深层上下文理解对结果重新排序，进一步提升结果与查询意图的匹配度，满足\"精确结果\"要求。\n\n**其他选项为什么错：**\n- A. 默认向量搜索 + Bedrock 查询扩展：仅依赖向量搜索无法精确匹配法律引文和术语，查询扩展不能替代关键字精确匹配。\n- C. Amazon Kendra 查询建议 + Bedrock 后处理：Kendra 的查询建议功能侧重搜索辅助而非法律语义关系的精确检索。\n- D. OpenSearch 向量搜索 + Titan Embeddings + Lambda 合并 RDS 关键字过滤：需要自定义 Lambda 合并逻辑和 RDS 关键字存储，运营开销大且架构复杂。","s":"源#83"},{"id":"D1-084","d":1,"t":"single","q":"ExampleCorp 提供数百万企业客户使用的个性化视频生成服务。客户通过向公司专有的 GenAI 模型提交提示生成营销视频。为提高输出相关性和个性化程度，ExampleCorp 希望使用客户特定的上下文（如产品偏好、客户属性和业务历史记录）来增强提示。客户对数据治理有严格要求：须保留对自身数据的完全所有权和控制权。客户不需要实时访问，但语义准确性须很高，检索延迟须较低以支持客户体验用例。ExampleCorp 希望最小化架构复杂性，非必要时不在每个客户环境中部署和管理服务。应选择哪种方案？","o":[{"l":"A","t":"确保每个客户都设置一个包含客户内部数据的 Amazon Q Business 索引。确保每个客户指定 ExampleCorp 作为数据访问者，以允许 ExampleCorp 使用安全 API 检索相关内容，以丰富运行时的提示。"},{"l":"B","t":"通过为每个客户部署实时 MCP 服务器，将联合搜索与模型上下文协议 (MCP) 结合使用。在提示生成期间实时检索数据。"},{"l":"C","t":"确保每个客户都配置一个 Amazon Bedrock 知识库。允许跨账户查询，以便示例公司可以检索结构化数据以进行及时扩充。"},{"l":"D","t":"配置 Amazon Kendra 以抓取客户数据源。跨账户共享生成的索引，以便示例公司可以查询每个客户的 Amazon Kendra 索引以检索增强数据。"}],"a":["A"],"e":"**正确答案：A。** 确保每个客户设置包含其内部数据的 Amazon Q Business 索引，指定 ExampleCorp 作为数据访问者，通过安全 API 在运行时检索相关内容以丰富提示。\n\n**为什么对：** Amazon Q Business 明确设计为提供对企业数据的安全、受管控访问，同时保留客户所有权。每个客户维护自己的索引，数据不会离开客户控制边界，除非通过数据访问者机制显式共享。ExampleCorp 无需在每个客户环境中部署服务，仅通过安全 API 检索内容即可丰富提示，最小化架构复杂性。Q Business 提供语义搜索能力以满足高语义准确性要求，且不要求实时访问时延迟可控。\n\n**其他选项为什么错：**\n- B. 每客户部署 MCP 服务器实时联合搜索：需要在每个客户环境中部署和管理服务，架构复杂度高，且客户不需要实时访问。\n- C. 每客户 Bedrock 知识库 + 跨账户查询：需要在每个客户账户中部署知识库，增加管理负担；且跨账户查询需要复杂的权限配置。\n- D. Kendra 抓取客户数据源 + 跨账户索引共享：Kendra 抓取客户数据源意味着数据离开客户控制，违反数据治理要求。","s":"源#84"},{"id":"D1-085","d":1,"t":"single","q":"一家金融服务公司正在开发 RAG 应用，帮助投资分析师查询跨多种投资工具、市场部门和监管环境的复杂财务关系。数据集包含具有多跳关系的高度互连实体。分析师须全面审视关系以提供准确的投资指导。应用须提供捕获金融实体间接关系的全面答案，并在 3 秒内响应。应以最少运营开销满足需求，应选择哪种方案？","o":[{"l":"A","t":"将 Amazon Bedrock 知识库与 GraphRAG 和 Amazon Neptune Analytics 结合使用来存储财务数据。分析实体之间的多跳关系并自动识别跨文档的相关信息。"},{"l":"B","t":"使用 Amazon Bedrock 知识库和 Amazon OpenSearch Service 矢量存储来实现自定义关系识别逻辑，该逻辑使用 AWS Lambda 按顺序查询多个矢量嵌入。"},{"l":"C","t":"使用带有 k 最近邻 (k-NN) 的 Amazon OpenSearch Serverless 矢量搜索。在 AmazonEC2AutoScaling 上运行的应用程序层中实施手动关系映射。"},{"l":"D","t":"使用 Amazon DynamoDB 将财务数据存储在自定义索引系统中。使用 AWS Lambda 查询相关记录。使用 Amazon SageMaker 生成响应。"}],"a":["A"],"e":"**正确答案：A。** 将 Amazon Bedrock Knowledge Bases（Bedrock 知识库）与 GraphRAG 和 Amazon Neptune Analytics 结合使用，存储财务数据，分析实体间的多跳关系并自动识别跨文档的相关信息。\n\n**为什么对：** 传统向量相似性搜索擅长查找语义相似文本，但未针对实体间显式关系推理（特别是多跳间接连接，如基金→持股→发行人→部门→监管）进行优化。GraphRAG 将 RAG 与图感知上下文选择结合，通过图存储表示实体及关系，系统可遍历多个跳跃组装上下文。Amazon Neptune Analytics 是完全托管的图数据库，支持高性能关系遍历。与 Bedrock 知识库集成后，检索层同时利用图结构和语义相似性，提供全面的多跳答案。托管服务无需运维图基础设施。\n\n**其他选项为什么错：**\n- B. Bedrock 知识库 + OpenSearch + Lambda 顺序查询多个嵌入：向量搜索无法有效捕获多跳关系，顺序 Lambda 查询增加延迟和复杂性。\n- C. OpenSearch Serverless k-NN + EC2 手动关系映射：需要管理 EC2 Auto Scaling 和手动构建关系映射逻辑，运营开销大。\n- D. DynamoDB 自定义索引 + Lambda 查询 + SageMaker 生成：完全自定义方案，无法有效执行图遍历，开发和运营工作量最大。","s":"源#85"},{"id":"D1-086","d":1,"t":"single","q":"一家法律研究公司拥有使用 Amazon Bedrock 和 Amazon OpenSearch Service 的 RAG 应用，存储了 1,500 万份法律文件的 768 维向量嵌入（包括法规、法院裁决和案件摘要）。当前分块策略将文本分割为 500 个 token 的固定长度块，经常将法律论证、法院意见或法规引用等上下文相关信息拆分到不同块中。研究人员报告生成的输出经常忽略关键上下文或引用过时的法律信息。日志显示响应时间增加了 40%，p95 延迟超过 2 秒。存储需求预计一年内从 90 GB 增长到 360 GB。公司需要大规模提升检索相关性和系统性能。应选择哪种方案？","o":[{"l":"A","t":"将嵌入向量维数从 768 增加到 4,096，而不更改现有的分块或预处理策略。"},{"l":"B","t":"将动态检索替换为存储在 Amazon S3 中的静态、预先编写的摘要。使用 Amazon CloudFront 提供摘要以减少计算需求并提高可预测性。"},{"l":"C","t":"将分块策略更新为使用语义边界，例如完整的法律参数、条款或部分，而不是固定的标记限制。重新生成向量嵌入以与新块结构对齐。"},{"l":"D","t":"从 OpenSearch Service 迁移到 Amazon DynamoDB。实施基于关键字的索引，以便更快地查找法律概念。"}],"a":["C"],"e":"**正确答案：C。** 将分块策略更新为使用语义边界（如完整的法律论证、条款或章节）而非固定 token 限制，并重新生成向量嵌入以对齐新的块结构。\n\n**为什么对：** 固定 token 分块破坏了法律文本的语义连续性，导致法律论点和引用被拆散，检索时返回与术语匹配但上下文不完整的片段。切换到基于语义边界的分块可保留完整的法律论证和引用上下文，提升检索准确性并减少幻觉。重新生成对齐的嵌入可提高向量搜索效率，在数据从 90 GB 扩展到 360 GB 时帮助控制延迟。\n\n**其他选项为什么错：**\n- A. 仅增加向量维度到 4,096：增加成本和延迟但未解决分块导致的上下文断裂核心问题。\n- B. 静态摘要 + CloudFront：去除动态推理能力，违背 RAG 系统目的。\n- D. 迁移到 DynamoDB + 关键字索引：完全放弃向量语义搜索，不适合法律研究的精细需求。","s":"源#86"},{"id":"D1-087","d":1,"t":"multiple","q":"一所大学正在开发一款基于 AI 的应用程序，包含 AI 助手、作业批改系统和内部分析应用等多个子应用。大学正在使用多种 Foundation Model（FM，基础模型）定义和测试多个提示词，并希望对每个提示词的不同变体进行比较，选出能生成最符合特定用例输出的变体。大学需要一套提示词版本控制方案，能够测试不同版本的提示词、收集提示词变更和使用情况的审计日志，并在确保提示词与主应用程序无缝集成的前提下维持一致性。应以最低运营开销满足需求。（选择两项。）","o":[{"l":"A","t":"使用 Amazon Bedrock Prompt Management 创建版本化的提示词，并为每个用例配置参数化变量。"},{"l":"B","t":"在 Amazon S3 中存储提示信息。使用 AWSStep Functions 来协调模型交互与服务集成。"},{"l":"C","t":"使用 Amazon Bedrock Flows 创建可结合 FMs 与 AWS 服务的工作流。"},{"l":"D","t":"配置 AWS Config 以记录提示项变更；使用 AWS CloudTrail 追踪提示项的使用情况。"},{"l":"E","t":"配置 Amazon Bedrock 智能提示路由。"}],"a":["A","C"],"e":"**正确答案：A、C。** 使用 Amazon Bedrock Prompt Management（提示管理）创建版本化提示词并配置参数化变量（A），使用 Amazon Bedrock Flows（流）创建结合 FM 与 AWS 服务的工作流（C）。\n\n**为什么对：** Bedrock Prompt Management 专为管理提示词设计，支持版本控制、参数化和变体测试，并提供变更审计追踪，直接满足版本管理和测试需求。Bedrock Flows 简化了将 FM 与 AWS 服务结合的工作流创建，支持提示词测试和应用集成，所需运营开销极小。两者配合可覆盖版本控制、测试、审计和集成的全部需求。\n\n**其他选项为什么错：**\n- B. S3 存储提示 + Step Functions 编排：S3 和 Step Functions 本身不具备版本控制、审计追踪或提示测试功能，实现这些需大量定制开发。\n- D. AWS Config 记录变更 + CloudTrail 追踪使用：这些是通用追踪工具，非专为提示管理或测试设计，实施需要大量定制以满足需求。\n- E. Bedrock 智能提示路由：用于将提示动态路由到最合适的模型，但不提供版本控制、测试或审计功能。","s":"源#87"},{"id":"D1-088","d":1,"t":"single","q":"一家零售公司运营着一款应用，在公司网站上为客户提供产品推荐。应用使用 Amazon Bedrock 通过动态构建提示词并发送至 Foundation Model（FM，基础模型）来生成推荐。一位 GenAI 开发者更新了应用，指示 FM 在响应中包含一段特定的促销信息。测试时发现促销信息并非总能出现在响应中，且即使出现，与其余文本的衔接也并非总是顺畅。开发者须确保促销信息始终出现在 FM 响应中。应选择哪种方案？","o":[{"l":"A","t":"在提示词上应用 Amazon Bedrock Guardrails 过滤器，并将输入过滤强度设置为“HIGH”。"},{"l":"B","t":"生成多个响应变体，这些变体以不同方式包含促销信息；随后，使用重排序模型，根据其与原始提示的关联度，筛选出最连贯的版本。"},{"l":"C","t":"将提示词输入 Amazon Bedrock 进行处理；随后，使用 Amazon Bedrock Agents 对响应结果进行处理，以添加促销信息；最后，利用原始提示词及所需促销信息作为上下文，对搜索结果进行重新排序。"},{"l":"D","t":"通过在向 FM 发送提示信息时使用输出指标，强化要求将新的促销信息纳入产品推荐内容的规定。"}],"a":["D"],"e":"**正确答案：D。** 通过在向 FM 发送提示时使用 Output Indicators（输出指示符），强制要求将促销信息纳入产品推荐内容。\n\n**为什么对：** 在提示词中使用输出指示符属于 Prompt Engineering（提示工程）技术，是引导 FM 行为的最直接、最有效的方法。通过在提示中明确指示 FM 必须包含促销信息及其格式要求，可以最大化促销信息一致出现在响应中的可能性。这是一种零基础设施、零额外成本的方案，仅需优化提示词本身。\n\n**其他选项为什么错：**\n- A. Bedrock Guardrails 输入过滤设为 HIGH：Guardrails 用于过滤或审核内容以保障安全与合规，而非强制 FM 在响应中包含特定内容。\n- B. 生成多个变体 + 重排序模型筛选：不能保证促销信息总会出现在每个响应中，且引入不必要的计算复杂性和成本。\n- C. Bedrock 处理 + Agents 后处理添加促销 + 重排序：Agents 并非为通过附加特定内容来修改 FM 响应而设计，无法保证促销信息无缝融入响应文本。","s":"源#88"},{"id":"D1-089","d":1,"t":"single","q":"一家医疗健康公司正在开发一款 AI 应用，用于检索医学文献以辅助医生研究。公司希望将应用部署到多个国家/地区。应用须对 50,000 份富含文本且包含英语、法语及德语专业术语的医学文档建立索引，并为医学术语提供高搜索准确率。公司寻求所需定制代码极少且无需持续维护的方案。应选择哪种方案？","o":[{"l":"A","t":"可使用 Amazon Titan Text Embeddings 对所有文档进行原语言处理，无需翻译；并在医疗领域层面应用语义分块技术，以保留医学术语的上下文关系，并维持适度的向量维度。"},{"l":"B","t":"使用 Amazon Titan Text Embeddings 将所有非英文文档在处理前翻译为英文；并采用基于逻辑章节的文档分块策略，以提升检索准确性。"},{"l":"C","t":"可使用 Amazon Titan 多模态嵌入技术将文档页面转换为图像，并为这些图像生成文本描述，从而构建一个能够处理医学内容的多模态知识库。"},{"l":"D","t":"使用 Amazon Bedrock 知识库作为向量存储，使用 Amazon Kendra 进行多语言文档处理，并配置向量存储以自动处理每个查询的语言检测与翻译。"}],"a":["A"],"e":"**正确答案：A。** 使用 Amazon Titan Text Embeddings 对所有文档进行原语言处理（无需翻译），并在医疗领域层面应用语义分块技术以保留医学术语的上下文关系，同时维持适度的向量维度。\n\n**为什么对：** Amazon Titan Text Embeddings 支持多语言文本的向量化处理，可直接对英语、法语和德语文档生成嵌入而无需预先翻译，避免翻译错误导致医学术语失真。在医疗领域层面应用语义分块可保留医学术语之间的上下文关系，提升检索准确性。维持适度的向量维度平衡了搜索精度和计算成本。整个方案使用托管嵌入服务，定制代码和维护量最少。\n\n**其他选项为什么错：**\n- B. 先将非英文文档翻译为英文再处理：翻译可能导致专业医学术语失真，且需要额外的翻译管道，增加定制开发和维护工作。\n- C. Titan 多模态嵌入将文档页面转为图像：对文本为主的医学文档而言低效且不必要，无法直接满足医学术语搜索准确率要求。\n- D. Bedrock 知识库 + Kendra 多语言处理 + 自动语言检测翻译：架构复杂度高，涉及多个服务的集成配置，且 Kendra 并非作为向量存储使用的标准模式。\n\n**关键概念：** Amazon Titan Text Embeddings 原生支持多语言文本嵌入，可直接处理多种语言的文档而无需翻译。","s":"源#89"},{"id":"D1-090","d":1,"t":"single","q":"一家公司需要一套从多个内容源自动生成学习材料的系统。内容源包括文档文件（PDF、PowerPoint 演示文稿和 Word 文档）和多媒体文件（录制的视频）。系统须每日处理超过 10,000 个内容源，峰值负载 500 个并发上传，从文档和多媒体文件中提取关键概念并生成上下文准确的摘要。生成的学习材料须支持实时协作和版本控制。应选择哪种方案？","o":[{"l":"A","t":"可使用 Amazon Bedrock Data Automation（BDA）与 AWS Lambda 函数协同调度文档文件处理流程；利用 Amazon Bedrock Knowledge Bases 处理所有多媒体内容；将内容存储于支持复制的 Amazon DocumentDB 中；通过 Amazon SNS 主题订阅实现协作；借助 Amazon Bedrock Agents 追踪变更。"},{"l":"B","t":"使用 Amazon Bedrock Data Automation（BDA）与基础模型（FMs）处理文档文件。将 BDA 与 Amazon Textract 集成以提取 PDF 文件，再与 Amazon Transcribe 集成以处理多媒体文件。将处理后的内容存储在启用版本控制的 Amazon S3 中。通过使用 AWS AppSync 的 GraphQL 订阅功能结合 DynamoDB，实时将元数据存储在 Amazon DynamoDB Collaborate 中。"},{"l":"C","t":"可将 Amazon Bedrock Data Automation（BDA）与 Amazon SageMaker AI 端点结合，用于托管内容提取和摘要生成模型；利用 Amazon Bedrock Guardrails 从所有文件类型中提取内容；将文档文件存储于 Amazon Neptune 以进行时间序列分析；通过 Amazon Bedrock Chat 实现实时消息协作。"},{"l":"D","t":"使用 Amazon Bedrock 数据自动化（BDA）与 AWS Lambda 函数来处理批量内容文件；在 Amazon Bedrock 中微调基础模型（FMs），以对所有类型的内容进行文档分类；通过采用集群模式下的分片技术，将处理后的数据存储于 Amazon ElastiCache（Redis OSS）中；使用 Amazon Bedrock 提示管理功能实现版本控制。"}],"a":["B"],"e":"**正确答案：B。** 使用 Amazon Bedrock Data Automation（BDA）与 Foundation Model（FM，基础模型）处理文档文件，集成 Amazon Textract 提取 PDF、Amazon Transcribe 处理多媒体文件，将内容存储在启用版本控制的 Amazon S3 中，元数据存储在 DynamoDB 中，通过 AWS AppSync GraphQL 订阅实现实时协作。\n\n**为什么对：** BDA 与 FM 集成可编排大规模文档处理和摘要生成。Textract 针对 PDF 的结构化和非结构化文本提取优化，Transcribe 将视频音频转为文本用于下游分析，两者分别针对各自媒体类型优化。S3 版本控制直接满足版本控制要求。DynamoDB 高吞吐低延迟、可自动扩展处理 500 并发峰值。AppSync GraphQL 订阅与 DynamoDB 流集成，在学习材料创建或修改时实时更新客户端，适合协作编辑和同步。\n\n**其他选项为什么错：**\n- A. BDA + Lambda + Bedrock 知识库处理多媒体 + DocumentDB + SNS + Bedrock Agents：SNS 是消息服务而非协作工具，DocumentDB 不适合版本化文档存储。\n- C. BDA + SageMaker 端点 + Guardrails 提取 + Neptune + Bedrock Chat：Guardrails 用于内容安全而非内容提取，Neptune 是图数据库不适合文档存储。\n- D. BDA + Lambda + 微调 FM 分类 + ElastiCache(Redis) 分片 + 提示管理版本控制：ElastiCache 是缓存服务不适合持久存储和版本控制。","s":"源#90"},{"id":"D2-001","d":2,"t":"single","q":"一个客服系统需要处理订单处理、技术支持和账单查询的 Agent，并实现无缝交接。哪种架构提供最佳用户体验？","o":[{"l":"A","t":"带专业化动作组和上下文管理的单一多功能 Agent"},{"l":"B","t":"带 Amazon Bedrock Multi-Agent Collaboration（多智能体协作）和对话路由的专业化 Agent"},{"l":"C","t":"带主管 Agent 和任务特定子 Agent 的层级 Agent 系统"},{"l":"D","t":"带 Agent-per-service 和 API 编排的微服务架构"}],"a":["B"],"e":"**正确答案：B。** 订单处理、技术支持、账单查询各由一个专门的 Agent 负责，中间用对话路由判断该转给谁并完成交接——对应 Amazon Bedrock 的 Multi-Agent Collaboration（多智能体协作）能力。\n\n**为什么对：** 题干两个要求——\"专业化\"和\"无缝交接\"。一个 Agent 只管一个领域，系统提示和动作组都能针对性设计，判断更准；路由层负责识别当前请求属于哪一类，交接时把上下文一起带过去，用户不用重复描述，这正是题干说的\"最佳用户体验\"。官方 Multi-Agent Collaboration 里 supervisor（主管）Agent 的职责就是分析请求并路由给合适的 collaborator（协作）Agent，与选项描述一致。\n\n**其他选项为什么错：**\n- A. 单一多功能 Agent + 专业化动作组：一个 Agent 同时扛三类业务，系统提示越写越长，意图判断容易串，谈不上专业化。\n- C. 主管 Agent + 任务专属子 Agent 的层级系统：形态上更接近多层委派，每个请求都要先过一层主管再下派，交接链路比直接路由更长，与题干\"无缝交接\"的取向相反。\n- D. Agent-per-service 微服务 + API 编排：强调的是服务拆分和部署形态，没回答\"对话怎么在 Agent 之间交接\"。\n\n**关键概念：** Amazon Bedrock 上对应的官方能力是 Multi-Agent Collaboration（多智能体协作），形态为 supervisor（主管）+ collaborator（协作）两层 Agent。注意 \"Agent Squad\" 不是 AWS 托管服务——它是 AWS Labs 的开源编排框架，原名 Multi-Agent Orchestrator，2025-05 更名 Agent Squad，2026-04 已迁出 AWS Labs 由 2FastLabs 维护；官方考纲中仍写作 \"AWS Agent Squad\"，属考纲滞后，不代表它是 Bedrock 的能力名。","s":"源#91"},{"id":"D2-002","d":2,"t":"single","q":"你的 Agent 系统需要处理 10,000+ 并发对话，且响应时间小于 1 秒。哪种扩展方法最有效？","o":[{"l":"A","t":"带负载均衡和 Agent 实例池的水平扩展"},{"l":"B","t":"带专用 Agent 容量和连接池的预置吞吐量"},{"l":"C","t":"基于 Lambda 的 Agent 和自动扩展的无服务器架构"},{"l":"D","t":"基于容器的部署，带 Kubernetes 自动扩展和资源优化"}],"a":["B"],"e":"**正确答案：B。** 给模型买 Provisioned Throughput（预置吞吐量）锁定专用容量，同时保持连接池复用。\n\n**为什么对：** 高并发下响应时间主要被两件事拖住——排队等推理容量、反复建立连接。预置吞吐量保证有专属算力，请求不用排队；连接池复用已有连接，省掉建连开销。这两条正好对上\"10000+ 并发 + 亚秒级响应\"。\n\n**其他选项为什么错：**\n- A. 水平扩展 + 负载均衡 + Agent 实例池：扩的是你自己的应用这一层，模型侧的推理容量没锁住，突发流量照样排队。\n- C. Lambda 无服务器 + 自动扩展：Lambda 有冷启动，并发还受账户配额限制，亚秒级响应保证不了。\n- D. 容器 + Kubernetes 自动扩缩：扩容有滞后，Pod 启动期间延迟会飙，同样锁不住模型侧容量。","s":"源#92"},{"id":"D2-003","d":2,"t":"single","q":"一个 Agent 需要访问 15 个不同 API，这些 API 具有不同的认证方法和速率限制。哪种集成模式能处理这种复杂性？","o":[{"l":"A","t":"带 Lambda 函数的动作组，为每个 API 处理认证和速率限制"},{"l":"B","t":"带统一认证和跨所有服务速率限制的 API 网关"},{"l":"C","t":"带连接池和断路器模式的自定义中间件层"},{"l":"D","t":"直接 API 集成，带 Agent 级认证和重试机制"}],"a":["A"],"e":"**正确答案：A。** 用 action group（动作组）配 AWS Lambda：每个 API 对应一个函数，在各自的函数里处理认证和限流。\n\n**为什么对：** 15 个 API 的认证方式各不相同，硬塞进统一层反而要写一堆分支。动作组把每个 API 的调用细节各自封装，Agent 侧只看到统一的工具定义，复杂度和维护边界都清楚了。\n\n**其他选项为什么错：**\n- B. API 网关统一认证和限流：各 API 认证方式不同，强行统一意味着网关里要适配所有类型，反而更重。\n- C. 自定义中间件 + 连接池 + 断路器：能提升可靠性，但要自己维护一整层中间件，而且跟 Agent 的工具定义是脱节的。\n- D. 直接 API 集成 + Agent 级认证重试：把 15 套认证逻辑全压进 Agent 配置，Agent 定义会变得难以维护。","s":"源#93"},{"id":"D2-004","d":2,"t":"single","q":"当多个 Agent 处理相关任务时，一个多 Agent 系统出现协调失败。哪种协调机制能改善协作？","o":[{"l":"A","t":"带 Agent 状态同步和冲突解决的共享内存系统"},{"l":"B","t":"带事件驱动协调和任务队列的消息传递架构"},{"l":"C","t":"带任务分配和依赖管理的集中式编排器"},{"l":"D","t":"带 Agent 投票和决策同步的分布式共识协议"}],"a":["A"],"e":"**正确答案：A。** 建一块共享内存，各 Agent 把状态写进去、实时读到彼此的进度，并配好冲突解决规则。\n\n**为什么对：** \"协调失败\"通常是因为各 Agent 看不到对方在做什么。共享状态让所有 Agent 有同一份事实来源；冲突解决规则则处理\"两个 Agent 同时要改同一份数据\"这类情况。\n\n**其他选项为什么错：**\n- B. 事件驱动 + 消息队列：消息是异步的，Agent 之间只能\"事后知道\"，做不到实时协调。\n- C. 集中式编排器：编排器能派活和管依赖，但 Agent 之间仍不共享中间状态，遇到冲突还得回来问编排器。\n- D. 分布式共识协议：共识是让多个节点就一个值达成一致，通信开销大，用在业务协调上属于杀鸡用牛刀。","s":"源#94"},{"id":"D2-005","d":2,"t":"single","q":"你的 Agent 系统需要跨多个会话和渠道维护对话上下文。哪种状态管理方法是最优的？","o":[{"l":"A","t":"基于会话的 DynamoDB 存储和跨渠道上下文同步"},{"l":"B","t":"带持久存储和上下文检索机制的 Agent 记忆"},{"l":"C","t":"带 Redis 分布式缓存和会话亲和性的上下文一致性"},{"l":"D","t":"带对话历史重建和状态重放的事件溯源"}],"a":["B"],"e":"**正确答案：B。** 启用 Agent 的 memory（记忆）能力，把关键上下文持久化保存，需要时再检索出来。\n\n**为什么对：** 题干两个要求——\"跨会话\"和\"跨渠道\"。会话级状态（session state）在会话结束就失效，只有持久化的记忆才能在下次会话、另一个渠道里把上下文取回来。\n\n**其他选项为什么错：**\n- A. DynamoDB 按会话存 + 跨渠道同步：按会话存的数据跨不过会话边界，同步逻辑还要自己写。\n- C. Redis 缓存 + 会话亲和性：缓存是易失的；会话亲和性把请求绑在特定节点上，反而妨碍跨渠道。\n- D. 事件溯源重放：能重建历史，但每次都要重放全部事件才能恢复上下文，延迟和复杂度都不划算。","s":"源#95"},{"id":"D2-006","d":2,"t":"single","q":"一个 Agent 需要执行带回溯能力的复杂多步推理。哪种实现模式支持此功能？","o":[{"l":"A","t":"带显式状态转换和回滚机制的状态机"},{"l":"B","t":"带分支探索和剪枝策略的树搜索"},{"l":"C","t":"带步骤验证和错误纠正循环的思维链"},{"l":"D","t":"带目标分解和执行监控的规划算法"}],"a":["C"],"e":"**正确答案：C。** 用 chain-of-thought（思维链）把推理拆成显式步骤，每步做验证，验证不过就纠正或回退。\n\n**为什么对：** 回溯的前提是\"知道错在哪一步\"。思维链把推理过程显式写出来，才可能定位到具体某一步；步骤验证提供对错判断；纠错循环就是回溯动作本身。三者串起来才构成完整能力。\n\n**其他选项为什么错：**\n- A. 状态机 + 显式状态转换和回滚：状态机的状态要预先定义，而复杂推理的中间步骤没法穷举。\n- B. 树搜索 + 分支探索剪枝：搜索的是解空间，适合有明确目标函数的场景，不适配开放式推理。\n- D. 规划算法 + 目标分解：规划解决\"先做什么后做什么\"，不解决\"某一步做错了怎么退回来\"。","s":"源#96"},{"id":"D2-007","d":2,"t":"single","q":"一个金融服务 Agent 必须满足决策透明度的监管要求。哪种方法能确保可解释 AI？","o":[{"l":"A","t":"带逐步推理捕获和审计追踪的决策树日志"},{"l":"B","t":"Amazon Bedrock Agent tracing，带推理透明度和来源归属"},{"l":"C","t":"带决策理由和置信度评分的自定义解释生成"},{"l":"D","t":"带显式逻辑文档和验证的基于规则的决策叠加层"}],"a":["B"],"e":"**正确答案：B。** 打开 Amazon Bedrock 的 trace（追踪），把 Agent 的推理过程、工具调用和引用来源都记录下来。\n\n**为什么对：** 监管要的\"可解释\"是事后能还原\"这个结论是怎么得出的\"。Trace 记录每一步推理、每一次工具调用、每一处引用来源，串起来就是一条完整的审计证据链。\n\n**其他选项为什么错：**\n- A. 决策树日志 + 审计追踪：决策树是确定性规则模型，而 Agent 基于大模型做推理，套不进决策树结构。\n- C. 自定义解释生成 + 置信度评分：让模型解释自己的决策，解释未必忠实于真实推理过程，不能当作审计依据。\n- D. 基于规则的决策叠加层：等于在 Agent 外面再包一层规则，改变的是决策方式，不是提供可解释性。","s":"源#97"},{"id":"D2-008","d":2,"t":"single","q":"你的 Agent 系统需要根据任务复杂度和可用资源动态选择工具。哪种架构支持自适应行为？","o":[{"l":"A","t":"带能力匹配和运行时动态绑定的工具注册表"},{"l":"B","t":"基于机器学习的工具选择，带性能预测和优化"},{"l":"C","t":"基于规则的工具选择，带上下文分析和资源可用性检查"},{"l":"D","t":"带自动升级和回退机制的层级工具组织"}],"a":["A"],"e":"**正确答案：A。** 建一个工具注册表，登记每个工具的能力描述，运行时按任务需求和资源情况匹配并动态绑定。\n\n**为什么对：** 动态选择的前提是\"工具可被检索和匹配\"。注册表把工具能力元数据化，运行时才能按当前任务挑一个出来；新增工具只需登记，不用改 Agent 逻辑。\n\n**其他选项为什么错：**\n- B. 机器学习预测选工具：要训练数据和持续迭代，且预测结果不可解释，不如规则化匹配可控。\n- C. 基于规则 + 上下文分析：规则是硬编码的，工具一多规则就膨胀，也难以覆盖资源动态变化的情况。\n- D. 层级工具组织 + 自动升降级：层级解决的是工具归类，不是\"按当前任务和资源选哪一个\"。","s":"源#98"},{"id":"D2-009","d":2,"t":"single","q":"一个 Agent 在处理需要多次工具调用的复杂查询时性能下降。哪种优化策略最有效？","o":[{"l":"A","t":"带依赖分析和结果聚合的并行工具执行"},{"l":"B","t":"带智能缓存失效和预热策略的工具结果缓存"},{"l":"C","t":"带子任务优化和结果组合的查询分解"},{"l":"D","t":"带按需工具调用和结果流式传输的惰性求值"}],"a":["A"],"e":"**正确答案：A。** 先分析多次工具调用之间的依赖关系，没有依赖的一起并发执行，最后汇总结果。\n\n**为什么对：** 性能下降的原因是串行等待——明明互不相关的调用却一个个排队。依赖分析找出哪些能并行，把总耗时从\"各次相加\"压到\"最慢的那一次\"。\n\n**其他选项为什么错：**\n- B. 工具结果缓存 + 失效策略：命中缓存才有效，题干说的是\"复杂查询要调多次工具\"，不是重复调同一个。\n- C. 查询分解 + 子任务优化：分解是前提，但分解完如果仍然串行执行，耗时不会降下来。\n- D. 惰性求值 + 按需调用：按需调用减少的是调用次数，不改变多次调用之间的串行关系。","s":"源#99"},{"id":"D2-010","d":2,"t":"single","q":"一个多租户 Agent 系统需要在共享通用能力的同时隔离客户数据。哪种架构提供安全的多租户？","o":[{"l":"A","t":"每租户独立 Agent，共享工具库和隔离数据访问"},{"l":"B","t":"共享 Agent，带租户特定上下文隔离和数据分区"},{"l":"C","t":"微服务架构，带租户特定服务实例和共享工具"},{"l":"D","t":"基于容器的隔离，带租户特定 Agent 部署和共享资源"}],"a":["B"],"e":"**正确答案：B。** Agent 实例共用一套，但每个租户的上下文和数据访问严格分区。\n\n**为什么对：** 题干要\"共享通用能力\"和\"隔离客户数据\"同时成立。共享 Agent 让提示、动作组这些通用能力只维护一份；隔离放在上下文和数据访问这两层，成本和安全性就都照顾到了。\n\n**其他选项为什么错：**\n- A. 每租户一个独立 Agent：隔离够了，但每个租户都要重复部署和维护一套 Agent，能力与成本都不划算。\n- C. 微服务 + 租户特定服务实例：把隔离做在服务实例层面，同样带来实例数量膨胀和运维负担。\n- D. 容器隔离 + 租户特定部署：也是靠\"一租户一部署\"实现隔离，运维复杂度和成本在四个选项里最高。","s":"源#100"},{"id":"D2-011","d":2,"t":"single","q":"你的 Agent 系统需要与现有企业工作流和审批流程集成。哪种集成模式能最小化干扰？","o":[{"l":"A","t":"基于 API 的集成，带工作流引擎和审批系统连接器"},{"l":"B","t":"带工作流触发器和状态同步的事件驱动架构"},{"l":"C","t":"带工作流状态管理和通知系统的直接数据库集成"},{"l":"D","t":"带异步处理和回调机制的队列集成"}],"a":["A"],"e":"**正确答案：A。** 通过 API 调用现有的工作流引擎和审批系统，用连接器做对接。\n\n**为什么对：** \"最小化干扰\"就是不改动现有系统。走 API 加连接器是在系统外围对接，工作流引擎和审批流程本身的逻辑、数据表都不用动。\n\n**其他选项为什么错：**\n- B. 事件驱动 + 工作流触发器：要求现有系统能发事件，通常要改造才能支持，干扰更大。\n- C. 直接数据库集成：绕过应用层直接读写库，破坏封装，还容易和现有业务逻辑打架，干扰最大。\n- D. 队列集成 + 异步回调：要引入新的中间件和异步链路，现有系统得配合改造，也不是最小改动。","s":"源#101"},{"id":"D2-012","d":2,"t":"single","q":"一个交易应用需要市场分析查询的响应时间小于 100ms。哪种部署配置满足此要求？","o":[{"l":"A","t":"带专用容量和边缘缓存的预置吞吐量"},{"l":"B","t":"带响应缓存和 CDN 分发的按需推理"},{"l":"C","t":"在 GPU 实例上托管自定义模型，带优化推理管道"},{"l":"D","t":"本地模型推理和云回退的混合部署"}],"a":["A"],"e":"**正确答案：A。** 买 Provisioned Throughput（预置吞吐量）锁定专用容量，再配合边缘缓存。\n\n**为什么对：** 100ms 是极紧的延迟预算，耗时主要来自两处——排队等推理容量、重复查询重复计算。预置吞吐量让请求不必排队；边缘缓存让重复查询就近直接返回，不再走一遍模型。\n\n**其他选项为什么错：**\n- B. 按需推理 + 响应缓存 + CDN：按需推理用的是共享容量，流量高峰会排队，延迟不可控。\n- C. GPU 实例自托管模型 + 优化管道：自托管要自己搞定扩缩容和模型优化，也不等于就能做到 100ms。\n- D. 本地推理 + 云回退混合：本地部署能降网络延迟，但硬件与运维成本高，回退路径还会带来延迟跳变。","s":"源#102"},{"id":"D2-013","d":2,"t":"single","q":"你的应用需要根据查询复杂度和成本约束在模型之间切换。哪种路由策略是最优的？","o":[{"l":"A","t":"Amazon Bedrock Intelligent Prompt Routing（智能提示路由），优化成本和性能"},{"l":"B","t":"带查询分析和模型能力匹配的自定义路由逻辑"},{"l":"C","t":"带健康检查和基于性能路由决策的负载均衡器"},{"l":"D","t":"带请求分类和模型端点选择的 API 网关"}],"a":["A"],"e":"**正确答案：A。** 用 Amazon Bedrock 的 Intelligent Prompt Routing（智能提示路由，简称 IPR），在同一个模型族内按请求自动选模型。\n\n**为什么对：** 它做的事正是题干描述的——对每个请求预测复杂度，简单请求路由到更小更便宜的模型、复杂请求路由到更强的模型，并在你设定的质量目标内做成本与性能权衡，路由规则不用自己写。两个值得记住的边界：一是它只在**同一个模型族内、恰好两个模型**之间路由，不是任意模型之间随意切；二是按路由请求数计费，**$1.00 / 1,000 次请求**（模型调用本身的 token 费用另计）。\n\n**其他选项为什么错：**\n- B. 自定义路由逻辑：复杂度判断和模型能力匹配都要自己实现，阈值还得持续调，维护成本高。\n- C. 负载均衡器 + 健康检查：负载均衡按容量和健康状态分发，不理解请求内容，做不到按复杂度选模型。\n- D. API 网关 + 请求分类：网关能按路径或参数分流，但请求复杂度是语义层面的，网关判断不了。\n\n**关键概念：** 官方全名是 Intelligent Prompt Routing（智能提示路由），缩写 IPR；\"Intelligent Routing\" 只是简称，正式文档与产品页均用全名。参考：Amazon Bedrock 官方产品页《Intelligent prompt routing》。","s":"源#103"},{"id":"D2-014","d":2,"t":"single","q":"一个批处理作业需要处理 100 万份文档并使用基础模型，需优化成本。哪种方法能最小化成本？","o":[{"l":"A","t":"在非高峰时段调度的批量推理"},{"l":"B","t":"带容错处理和检查点机制的 Spot 实例"},{"l":"C","t":"带批量优化和并行处理的预留容量"},{"l":"D","t":"带自动扩展和按使用付费定价的无服务器处理"}],"a":["A"],"e":"**正确答案：A。** 用 Batch Inference（批量推理）提交这批作业，并安排在非高峰时段执行。\n\n**为什么对：** 成本由两部分决定：单价和时段。批量推理本身比实时调用便宜（AWS 对 Bedrock 批量推理有折扣），100 万文档又不要求立刻出结果，排到非高峰时段还能再压一层。\n\n**其他选项为什么错：**\n- B. Spot 实例 + 容错检查点：Spot 省的是计算实例的钱，而 Bedrock 是按 token 计费的托管服务，用不上 Spot。\n- C. 预留容量 + 批量优化：预留容量买的是确定性，跟\"把成本压到最低\"方向相反。\n- D. 无服务器 + 按量付费：按量付费就是实时调用的价格，比批量推理贵。","s":"源#104"},{"id":"D2-015","d":2,"t":"single","q":"你的模型部署需要蓝绿部署能力和自动回滚。哪种实现提供此功能？","o":[{"l":"A","t":"带流量转移和自动监控的 Amazon SageMaker 端点"},{"l":"B","t":"带 Kubernetes 蓝绿部署策略的容器部署"},{"l":"C","t":"基于 Lambda 的模型服务，带别名流量路由和回滚"},{"l":"D","t":"带加权路由和基于健康检查故障转移的 API 网关"}],"a":["A"],"e":"**正确答案：A。** 用 Amazon SageMaker endpoints（SageMaker 端点）：新版本先部署成独立的 production variant（生产变体），再逐步切流量，配 Amazon CloudWatch 告警触发自动回滚。\n\n**为什么对：** 蓝绿需要两件事——新旧并存、流量可切可回。SageMaker 端点原生支持一个端点挂多个 variant 并分配流量比例，回滚就是把权重切回旧 variant，不需要重新部署。\n\n**其他选项为什么错：**\n- B. Kubernetes 蓝绿部署策略：K8s 能做蓝绿，但部署策略、流量切换和回滚逻辑都要自己写，不是开箱即用。\n- C. Lambda 别名 + 流量路由回滚：Lambda 受部署包大小和运行时长限制，不适合多数模型服务场景。\n- D. API 网关加权路由 + 健康检查：网关层的切换解决不了模型版本管理，蓝绿的两套环境还得另搭。","s":"源#105"},{"id":"D2-016","d":2,"t":"single","q":"一个模型服务系统出现冷启动延迟问题，影响用户体验。哪种优化能减少冷启动影响？","o":[{"l":"A","t":"带持久模型加载和预热策略的连接池"},{"l":"B","t":"带预预热实例和预测性扩展的预置并发"},{"l":"C","t":"带内存存储和懒加载机制的模型缓存"},{"l":"D","t":"带减小镜像大小和更快启动时间的容器优化"}],"a":["B"],"e":"**正确答案：B。** 配 provisioned concurrency（预置并发）让实例常驻预热，再叠加 predictive scaling（预测性扩展）提前扩容。\n\n**为什么对：** 冷启动的本质是\"请求来了才开始准备环境\"。预置并发让实例提前备好、模型已经加载，请求直接命中；预测性扩展则在可预见的峰值前把容量加上，避免临时扩容又制造新的冷启动。\n\n**其他选项为什么错：**\n- A. 连接池 + 预热策略：连接池复用的是网络连接，解决不了实例/容器层面的冷启动。\n- C. 模型缓存 + 懒加载：懒加载本身就是等用到才加载，等于没解决冷启动。\n- D. 精简镜像 + 加快启动时间：能缩短冷启动时长但消除不了，也没有提前备好容量的机制。","s":"源#106"},{"id":"D2-017","d":2,"t":"single","q":"你的部署需要支持跨多个模型版本的系统性质量对比，并得到可用于决策的评估结论。哪个框架支持此功能？","o":[{"l":"A","t":"带流量拆分和统计分析管道的自定义 A/B 测试"},{"l":"B","t":"Amazon Bedrock Model Evaluations（Bedrock 模型评估），支持跨模型对比评估与自动报告"},{"l":"C","t":"带模型版本控制和实验跟踪的功能标志系统"},{"l":"D","t":"带加权路由和指标收集分析的负载均衡器"}],"a":["B"],"e":"**正确答案：B。** 用 Amazon Bedrock Model Evaluations（Bedrock 模型评估）对多个模型版本做系统性对比评估并生成自动报告。\n\n**为什么对：** 题干要的是\"跨模型版本对比 + 可用于决策的评估结论\"。Model Evaluations 把候选模型在同一评测集上跑一遍，自动给出各维度得分与差异对比并输出报告——评测集、指标计算、结果汇总都不用自己实现，结论可以直接拿来做决策。\n\n**其他选项为什么错：**\n- A. 自建 A/B 测试 + 统计分析管道：流量拆分、指标采集、显著性检验全部要自己搭，工作量和长期维护成本都远高于用托管能力。\n- C. 功能标志系统 + 实验跟踪：功能标志管的是开关与灰度发布，不负责质量评分和结果对比。\n- D. 负载均衡器 + 加权路由 + 指标收集：能按比例分流，但收集到的指标要自己分析，也不产出评估结论。\n\n**关键概念：** 区分三件容易混的事——\n- **Model Evaluations**：离线/批量的跨模型对比评估，产出指标与报告（本题答案）。\n- **A/B testing**：线上真实流量的分流对比，官方路径是 Prompt Management（提示管理）+ Prompt Flows（提示流），不是在 Model Evaluations 里点一下就有的。\n- **统计显著性检验**（p 值 / 置信区间）：Amazon Bedrock 原生提供该能力的是 AgentCore 的 A/B testing 组件，不在 AIP-C01 考纲范围内。\n考纲把这几项**并列**举例（\"by using Model Evaluations, A/B testing and canary testing of FMs, multi-model evaluation, cost-performance analysis\"），是几类不同手段，不是包含关系。","s":"源#107"},{"id":"D2-018","d":2,"t":"single","q":"一个模型部署需要满足跨多个区域的数据驻留合规要求。哪种架构确保合规？","o":[{"l":"A","t":"带数据本地性强制和合规监控的多区域部署"},{"l":"B","t":"带数据处理限制和审计追踪的区域模型副本"},{"l":"C","t":"带本地处理和基于云推理的混合部署"},{"l":"D","t":"带本地处理和集中模型管理的边缘部署"}],"a":["A"],"e":"**正确答案：A。** 在需要的每个区域各部署一套，强制数据留在本区域处理，并持续做合规校验。\n\n**为什么对：** 数据驻留的要求是\"某区域的数据必须在该区域内处理完\"。逐区域部署让每个区域都能本地闭环；持续监控则是在配置漂移导致越界时能立刻发现并纠正。\n\n**其他选项为什么错：**\n- B. 区域模型副本 + 处理限制和审计追踪：模型复制到各地只是部署形态，\"处理限制\"还要另外强制，不如逐区域部署完整。\n- C. 混合部署（本地处理 + 云上推理）：数据最终仍要上云做推理，跨区域边界的问题没有解决。\n- D. 边缘部署 + 集中模型管理：集中管理意味着存在统一控制面，数据流向反而更容易跨区。","s":"源#108"},{"id":"D2-019","d":2,"t":"single","q":"你的系统需要基于实时需求进行动态模型扩展，并优化成本。哪种自动扩展策略最有效？","o":[{"l":"A","t":"带需求预测和主动容量调整的预测性扩展"},{"l":"B","t":"带 CloudWatch 指标和基于阈值扩展策略的响应式扩展"},{"l":"C","t":"带历史使用模式和峰值容量规划的定时扩展"},{"l":"D","t":"结合预测和响应方法的混合扩展并优化成本"}],"a":["A"],"e":"**正确答案：A。** 用 predictive scaling（预测性扩展），基于历史负载模式预测未来需求，提前调整容量。\n\n**为什么对：** 题干要\"按实时需求伸缩\"和\"优化成本\"两头兼顾。响应式扩展是等负载上来才扩，这段时间里要么延迟上升、要么为保险多留冗余；预测性扩展提前动作，正好同时压掉这两块损耗。\n\n**其他选项为什么错：**\n- B. CloudWatch 阈值响应式扩展：触发有滞后，扩容完成前请求已经在排队了。\n- C. 定时扩展 + 峰值容量规划：按固定时间表走，遇到非常规波动就失准，还容易为峰值长期多留容量。\n- D. 混合扩展（预测 + 响应）：听起来更全面，但它是组合方案，阈值和预测模型要同时调，复杂度高，不是\"最有效\"的单一策略。","s":"源#109"},{"id":"D2-020","d":2,"t":"single","q":"你的部署管道需要在生产部署前进行自动化模型验证。哪种验证方法最全面？","o":[{"l":"A","t":"带单元测试、集成测试和性能基准的多阶段验证"},{"l":"B","t":"带合成数据生成和质量门执行的自动化测试"},{"l":"C","t":"带逐步流量增加和自动回滚触发的金丝雀部署"},{"l":"D","t":"带生产流量重放和结果比较分析的影子部署"}],"a":["C"],"e":"**正确答案：C。** 用金丝雀（canary）方式：先放一小部分真实流量给新模型，指标正常就逐步加量，一有异常自动回滚。\n\n**为什么对：** 合成测试再全，也覆盖不了真实用户的提问方式。金丝雀用真实流量做最终验证，能抓到离线测试发现不了的问题；只放小比例流量则把影响范围控制住，配合自动回滚就不至于酿成事故。\n\n**其他选项为什么错：**\n- A. 多阶段验证（单元/集成/性能基准）：都是部署前的离线测试，碰不到真实流量的分布。\n- B. 合成数据 + 质量门：数据是人造的，覆盖面和真实分布都有差距。\n- D. 影子部署（生产流量重放比较）：影子模式只比对不真正生效，能发现问题但不会触发回滚，少了自动回滚这一环。","s":"源#110"},{"id":"D2-021","d":2,"t":"single","q":"一个 GenAI 系统需要与现有企业 SSO 和 RBAC 系统集成。哪种方法提供无缝认证？","o":[{"l":"A","t":"带 SAML 联合和自定义授权逻辑的 Amazon Cognito"},{"l":"B","t":"带企业目录集成和细粒度权限的 IAM Identity Center"},{"l":"C","t":"带 JWT 令牌和基于角色访问控制的自定义认证服务"},{"l":"D","t":"带 Lambda 授权器和企业身份提供商集成的 API 网关"}],"a":["B"],"e":"**正确答案：B。** 用 AWS IAM Identity Center（原 AWS SSO）对接企业目录，并配置细粒度权限集。\n\n**为什么对：** SSO 的关键是不再单独维护一套账号。IAM Identity Center 直接连到企业已有的身份源（比如 Active Directory），用户在目录里的归属映射成 AWS 侧的权限，一次登录全打通。\n\n**其他选项为什么错：**\n- A. Amazon Cognito + SAML 联合 + 自定义授权：Cognito 主要面向应用自建用户池，企业 SSO 场景下授权逻辑要自己实现。\n- C. 自建认证服务 + JWT + RBAC：等于自己造一套身份体系，维护成本最高，也谈不上\"无缝\"。\n- D. API 网关 + Lambda 授权器：解决的是 API 这一层的鉴权，不是统一的企业身份接入。","s":"源#111"},{"id":"D2-022","d":2,"t":"single","q":"你的 GenAI 应用需要与 20+ 个不同数据格式的企业系统集成。哪种集成模式能处理这种复杂性？","o":[{"l":"A","t":"带转换层和协议适配的 API 网关"},{"l":"B","t":"带消息转换和路由能力的企业服务总线"},{"l":"C","t":"带专用适配器的微服务架构"},{"l":"D","t":"带标准化消息格式和转换服务的事件驱动架构"}],"a":["A"],"e":"**正确答案：A。** 在 API 网关后面加一层转换，统一做协议和数据格式适配。\n\n**为什么对：** 20 多个系统格式各异，逐个适配会让集成点爆炸。把转换集中在网关这一层，GenAI 应用侧只面对一种统一格式，以后新增系统也只是加一条转换规则。\n\n**其他选项为什么错：**\n- B. 企业服务总线（ESB）：传统重中间件，运维复杂，也和云原生体系割裂。\n- C. 微服务 + 专用适配器：一个系统一个适配器，20 多个适配器的开发和维护量很大。\n- D. 事件驱动 + 标准化消息格式：要求各系统都能发出标准事件，改造量比加一层转换大得多。","s":"源#112"},{"id":"D2-023","d":2,"t":"single","q":"一个 GenAI 系统需要与企业数据库实时同步数据，同时保持一致性。哪种方法确保数据完整性？","o":[{"l":"A","t":"带事件流和最终一致性保证的变更数据捕获"},{"l":"B","t":"带实时同步和冲突解决机制的数据库触发器"},{"l":"C","t":"带事务管理和回滚能力的 API 同步"},{"l":"D","t":"带顺序处理和交付保证的队列集成"}],"a":["A"],"e":"**正确答案：A。** 用 CDC（Change Data Capture，变更数据捕获）把数据库的变更转成事件流往外发。\n\n**为什么对：** CDC 直接读数据库的变更日志，变更一发生就能捕获，延迟低；以事件流投递后消费端按序处理即可达到最终一致。而且它读的是日志，不占用源库的事务资源。\n\n**其他选项为什么错：**\n- B. 数据库触发器：触发器在业务事务里同步执行，会拖慢源库写入，触发器逻辑出错还会直接影响业务事务。\n- C. API 同步 + 事务管理：要在写入侧改造调用方式，跨库事务的一致性很难保证。\n- D. 队列集成 + 顺序处理：队列只负责传递，变更从哪来、怎么捕获这个根本问题没解决。","s":"源#113"},{"id":"D2-024","d":2,"t":"single","q":"你的 GenAI 应用需要遵守企业数据访问和使用的治理策略。哪个框架确保合规？","o":[{"l":"A","t":"带自动合规检查和违规检测的 Policy-as-code"},{"l":"B","t":"带审计追踪和合规文档的手动审批流程"},{"l":"C","t":"带细粒度权限和活动监控的基于角色的访问控制"},{"l":"D","t":"带自动策略执行和报告的数据分类系统"}],"a":["A"],"e":"**正确答案：A。** 把治理规则写成代码（policy-as-code），由系统自动执行检查并检出违规行为。\n\n**为什么对：** 治理要能规模化，靠人工审是走不通的。策略代码化之后，每次访问和使用都由同一套规则自动判定；规则变更可版本化、可回溯，也不会有人为疏漏。\n\n**其他选项为什么错：**\n- B. 手动审批 + 审计追踪：人工审批有瓶颈，GenAI 的调用量根本审不过来。\n- C. RBAC + 活动监控：RBAC 管的是\"谁能访问\"，覆盖不了\"访问之后怎么用\"这类使用侧策略。\n- D. 数据分类系统 + 自动执行和报告：分类是治理的基础数据，但分类本身不定义规则，也不构成策略框架。","s":"源#114"},{"id":"D2-025","d":2,"t":"single","q":"一个企业 GenAI 部署需要跨多个服务的集中日志和监控。哪种方法提供全面可观测性？","o":[{"l":"A","t":"带 ELK 堆栈和自定义仪表板的集中日志"},{"l":"B","t":"带 CloudWatch、X-Ray 和自定义指标收集的 AWS 原生监控"},{"l":"C","t":"带企业集成和告警能力的第三方监控工具"},{"l":"D","t":"带关联 ID 和服务网格可观测性功能的分布式追踪"}],"a":["B"],"e":"**正确答案：B。** 用 Amazon CloudWatch 收日志和指标、AWS X-Ray 做分布式追踪，再按需补自定义指标。\n\n**为什么对：** 题干前提是\"跨多个 AWS 服务的企业 GenAI 部署\"。CloudWatch 和 X-Ray 与 AWS 各项服务原生打通，日志、指标、调用链能关联到同一个请求上，不用额外做接入适配。\n\n**其他选项为什么错：**\n- A. ELK 堆栈 + 自定义仪表板：要自己搭建和维护一整套集群，跟 AWS 服务的集成也要自己做。\n- C. 第三方监控工具：引入外部依赖和数据出境问题，接入成本也高。\n- D. 分布式追踪 + 关联 ID + 服务网格：追踪只是可观测性的一块，日志和指标还得另外解决。","s":"源#115"},{"id":"D2-026","d":2,"t":"single","q":"一个代理式 AI 解决方案必须调用库存 API、检查支付状态，然后决定是否创建货件。什么应协调这些步骤？","o":[{"l":"A","t":"Amazon EBS 快照"},{"l":"B","t":"Amazon CloudFront"},{"l":"C","t":"AWS Config 规则"},{"l":"D","t":"AWS Step Functions"}],"a":["D"],"e":"**正确答案：D。** 用 AWS Step Functions 把这几步编排成一个状态机。\n\n**为什么对：** 题干是典型的\"多步骤、有先后顺序、中间还要根据结果判断\"的流程。Step Functions 用状态机描述步骤顺序和分支走向，每一步的重试、超时、失败处理都是现成机制，比写在应用代码里更清楚也更好排查。\n\n**其他选项为什么错：**\n- A. Amazon EBS 快照：云硬盘的备份功能，跟工作流编排毫无关系。\n- B. Amazon CloudFront：CDN 内容分发服务，不做流程编排。\n- C. AWS Config 规则：用来评估资源配置是否合规，不是执行编排的服务。","s":"源#116"},{"id":"D2-027","d":2,"t":"single","q":"一个聊天应用必须在生成时返回部分模型输出。开发人员应使用哪种集成模式？","o":[{"l":"A","t":"静态网站托管"},{"l":"B","t":"批量文件处理"},{"l":"C","t":"流式响应交付"},{"l":"D","t":"定时日志导出"}],"a":["C"],"e":"**正确答案：C。** 用流式（streaming）方式交付，模型边生成边把增量结果送回来。\n\n**为什么对：** 长回答如果等全部生成完再返回，用户要干等好几秒。流式让第一个 token 出来就显示，用户感知到的等待时间大幅缩短。在 Amazon Bedrock 上对应的接口是 InvokeModelWithResponseStream（带响应流的模型调用）。\n\n**其他选项为什么错：**\n- A. 静态网站托管：只负责托管页面文件，跟模型输出的传输方式无关。\n- B. 批量文件处理：批量是离线跑大批量任务，不是实时返回。\n- D. 定时日志导出：这是日志运维动作，和响应交付不沾边。","s":"源#117"},{"id":"D2-028","d":2,"t":"single","q":"一个 GenAI 应用必须将长时间运行的摘要任务发送给工作进程，并立即返回作业 ID。哪个服务应缓冲任务请求？","o":[{"l":"A","t":"Amazon Route 53"},{"l":"B","t":"AWS CloudTrail"},{"l":"C","t":"Amazon SQS"},{"l":"D","t":"AWS Backup"}],"a":["C"],"e":"**正确答案：C。** 用 Amazon SQS（Simple Queue Service，简单队列服务）缓冲任务请求。\n\n**为什么对：** 题干的模式是\"接请求 → 立刻返回作业 ID → 后台慢慢处理\"。SQS 正好承担这个缓冲：应用把任务丢进队列就返回，工作进程按自己的节奏取走处理，两边解耦，任务也不会因为进程忙而丢失。\n\n**其他选项为什么错：**\n- A. Amazon Route 53：DNS 域名解析服务，不存任务。\n- B. AWS CloudTrail：记录 API 操作的审计服务，不是队列。\n- D. AWS Backup：备份服务，跟任务缓冲无关。","s":"源#118"},{"id":"D2-029","d":2,"t":"single","q":"某企业正在搭建审核流水线，用于在面向客户的通信内容发出前进行合规审查。公司利用预设消息模板生成通信文稿，并将成品存放在 S3 存储桶中。流水线须从模板中提取指定片段并提交给 Bedrock 模型审核，再将审核结果写回 S3。哪项方案运营开销最低？","o":[{"l":"A","t":"在 Bedrock Flows 中创建流程。在流程起始和末尾分别配置 S3 操作节点用于读取和保存通信文稿及模型回复。在中间节点用表达式解析每条通信内容，再用代理步骤将解析后的输入发送给模型执行审核"},{"l":"B","t":"创建 Step Functions Express 状态机。用 S3 GetObject 集成步骤读取原始通信内容，用 Pass 步骤解析内容，将结果传递给 Bedrock InvokeModel 步骤，最后用 S3 PutObject 步骤将模型回复写回存储桶"},{"l":"C","t":"创建带操作组的 Bedrock 代理。配置指令定义代理如何解析通信内容，配置操作组从 S3 读取通信文稿、调用 Bedrock 模型并将回复写回 S3"},{"l":"D","t":"创建仅含一个操作组的 Bedrock 代理。在操作组中配置三个 Lambda 函数分别负责读取 S3 通信文稿、解析并调用模型、将回复写回 S3"}],"a":["A"],"e":"**正确答案：A。** Bedrock Flows 流程。\n\n**为什么对：**Bedrock Flows 专为编排生成式 AI 工作流而构建，将数据访问、确定性转换和模型调用整合在单一托管服务中。在流程内直接配置 S3 操作节点和表达式解析步骤，无需额外服务或自定义代码即可完成从读取到审核再到写回的完整链路，运营开销最低。\n\n**其他选项为什么错：**\n- B.Step Functions Express：虽可行但需手动编排多个集成步骤，且 Express 类型不支持完整审计\n- C.Bedrock 代理+操作组：代理设计面向自主决策场景，对固定审核流水线而言引入不必要的灵活性和复杂度\n- D.代理+三个 Lambda：需为简单线性流程编写和维护三个自定义函数，过度工程化\n\n**关键概念：**Bedrock Flows 提供托管式生成式 AI 工作流编排，内置 S3 数据访问和模型调用节点，适合线性审核流水线的低运营开销场景。","s":"源#119"},{"id":"D2-030","d":2,"t":"single","q":"某公司正在构建实时语音助手系统，在客户通话过程中为客服代表提供辅助。系统须将通话音频转写为文本，端到端延迟低于 500 毫秒，并利用生成式 AI 实时生成建议回复。人工主管须能在通话进行中对系统建议进行评分，评分数据需持久化存储。哪项方案可满足需求？","o":[{"l":"A","t":"使用标准设置的 Transcribe 流式 API 将语音转为文字。使用 Bedrock 批处理推理生成建议。将通话录音和元数据存入 S3，用 S3 生命周期策略管理存储"},{"l":"B","t":"使用 100 毫秒音频块的 Transcribe 流式 API 优化语音助手延迟。调用 Bedrock InvokeModelWithResponseStream 实时处理客户查询。将主管评分存储在 DynamoDB 表中"},{"l":"C","t":"使用 Transcribe 批处理进行通话后分析。配置 Lambda 函数使用 Bedrock InvokeModel 生成建议。用 CloudWatch 记录主管反馈"},{"l":"D","t":"使用 Transcribe 将语音转为文字并进行实时分析。使用 Comprehend 进行情感分析。使用 SQS 排队处理任务。运行 Bedrock InvokeModel 生成建议"}],"a":["B"],"e":"**正确答案：B。** 100ms 块 Transcribe 流式+Bedrock 流式推理。\n\n**为什么对：**为满足低于 500 毫秒的端到端Latency（延迟），系统必须在每个阶段使用流式传输。100 毫秒音频块使 Transcribe 在客户说话时即开始转录，极大缩短首字延迟。Bedrock 的 InvokeModelWithResponseStream 在 Token 生成时即推送部分输出，使建议在模型推理过程中就逐步呈现。DynamoDB 提供低延迟的评分数据持久化。\n\n**其他选项为什么错：**\n- A.标准 Transcribe+批处理推理：批处理模式无法满足实时性要求，延迟远超 500 毫秒\n- C.Transcribe 批处理+Lambda：批处理转录需等待完整音频上传，不满足实时通话场景\n- D.Transcribe+Comprehend+SQS：引入多个非流式服务，SQS 排队增加延迟\n\n**关键概念：**Transcribe 流式 API 配合小音频块实现即时转录，Bedrock 流式推理在 Token 生成时推送部分响应，两者协同可实现亚秒级端到端延迟。","s":"源#120"},{"id":"D2-031","d":2,"t":"single","q":"某电商企业运营全球产品推荐系统，须依据法规、成本优化和性能要求在 Bedrock 上的多个基础模型间动态切换。公司须基于专有业务逻辑施加自定义控制，包括动态成本阈值、特定 AWS 区域合规规则和 A/B 测试参数。路由决策须在不重新部署代码的情况下实时调整。哪项方案可满足需求？","o":[{"l":"A","t":"部署使用环境变量存储路由规则和 FM ID 的 Lambda 函数。业务需求变化时通过 Lambda 控制台更新环境变量。配置 API Gateway REST API 读取请求参数做路由决策"},{"l":"B","t":"部署 API Gateway REST API 请求转换模板，基于请求属性实现路由逻辑。将 FM 端点存为 API 阶段变量，模型切换时更新变量"},{"l":"C","t":"配置 Lambda 函数为每个请求从 AppConfig Agent 获取路由配置。在函数内执行业务逻辑选择适当 FM。通过单个 API Gateway REST API 端点暴露 FM"},{"l":"D","t":"为 API Gateway 使用 Lambda 授权者，评估存储在 AppConfig 中的路由规则。基于业务逻辑返回授权上下文。将请求路由到每个 FM 对应的模型特定 Lambda 函数"}],"a":["C"],"e":"**正确答案：C。** Lambda+AppConfig 实时路由配置。\n\n**为什么对：**AppConfig 专为实时、经验证的集中化配置变更而设计，支持安全灰度发布、即时传播和回滚。将路由规则、成本阈值、合规约束和 A/B 测试逻辑存入 AppConfig 后，公司可在不重新部署 Lambda 代码的情况下实时切换 FM。Lambda 为每个请求动态读取最新配置，确保路由决策反映当前业务规则。\n\n**其他选项为什么错：**\n- A.环境变量存储路由：需手动更新环境变量并触发新版本，无法实时传播且不支持灰度\n- B.API Gateway 模板+阶段变量：模板逻辑表达能力有限，阶段变量更新影响所有路由\n- D.Lambda 授权者+多函数：授权者模式增加额外调用层，且需为每个 FM 维护独立函数\n\n**关键概念：**AppConfig 提供动态配置管理支持安全发布与即时回滚，Lambda 运行时读取配置实现无需重部署的实时模型路由切换。","s":"源#121"},{"id":"D2-032","d":2,"t":"single","q":"某电商平台运行全球商品推荐服务，需要按照法规约束、成本控制和性能指标在 Bedrock 多个基础模型间灵活切换。企业须运用自有业务逻辑实施精细化管控，涵盖动态费用阈值、区域合规策略及 A/B 测试变量。路由规则须支持不改动代码即可即时更新。哪项方案最合适？","o":[{"l":"A","t":"部署 Lambda 函数并以环境变量保存路由规则和 FM 标识。规则变更时在控制台手动修改环境变量。通过 API Gateway 读取请求参数执行路由"},{"l":"B","t":"在 API Gateway REST API 中配置请求转换模板实现路由逻辑。将 FM 端点设为阶段变量，切换模型时更新变量值"},{"l":"C","t":"设置 Lambda 函数在每次请求时从 AppConfig Agent 拉取路由配置。在函数内运行业务逻辑选定匹配的 FM。经统一 API Gateway 端点对外提供模型访问"},{"l":"D","t":"为 API Gateway 配置 Lambda 授权者评估 AppConfig 中的路由规则。按业务逻辑返回授权上下文。将请求分发到各 FM 对应的专用 Lambda 函数"}],"a":["C"],"e":"**正确答案：C。** Lambda 从 AppConfig 拉取路由配置。\n\n**为什么对：**AppConfig 为集中管理动态配置而生，支持受控部署、验证和快速传播配置变更，完全匹配成本阈值每小时变化、数千并发请求须即时响应的场景需求。Lambda 在运行时读取最新路由规则，无需代码重部署即可切换 FM，同时保持单端点架构简洁性。\n\n**其他选项为什么错：**\n- A.环境变量方案：变更需手动操作且无法即时传播，不支持灰度和回滚\n- B.API Gateway 模板+阶段变量：模板逻辑受限，阶段变量全局影响难以独立管理\n- D.Lambda 授权者+多函数：增加授权者调用开销，且需为每个 FM 维护独立函数\n\n**关键概念：**AppConfig 支持动态配置的安全灰度发布与即时回滚，Lambda 运行时动态读取实现无代码重部署的 FM 路由切换，适合频繁变化的业务逻辑场景。","s":"源#122"},{"id":"D2-033","d":2,"t":"multiple","q":"某企业正在设计基于多个基础模型的 AI 解决方案，需支持多种工作负载模式。部分 FM 须按需实时调用，另一些需持续高吞吐量以支撑批处理。方案须支持混合部署模式，在云基础设施和本地设施上均可运行工作负载以满足数据驻留与合规要求。哪组方案组合可满足需求？（选择两项）","o":[{"l":"A","t":"使用 Lambda 调用 SageMaker AI 异步端点上的 FM 来编排低延迟推理"},{"l":"B","t":"在 Bedrock 中配置预置吞吐量以确保高容量工作负载的一致性能"},{"l":"C","t":"将 FM 部署到 SageMaker AI 端点并通过 SageMaker Neo 支持边缘部署。使用 Lambda 编排 FM 以支持混合部署"},{"l":"D","t":"使用带自动扩缩的 Bedrock 来处理不可预测的流量激增"},{"l":"E","t":"使用 SageMaker JumpStart 托管和调用 FM"}],"a":["B","C"],"e":"**正确答案：B、C。**\n\n**为什么对：**\n- B.Bedrock Provisioned Throughput（预置吞吐量）：为高容量批处理工作负载提供一致性能保证，消除按需调用可能出现的Cold Start（冷启动）和限流问题，确保持续推理速率\n- C.SageMaker AI 端点+Neo 边缘部署：SageMaker 支持自定义 FM 托管和混合部署，Neo 使模型可在边缘设备运行满足Data Residency（数据驻留）和合规要求，Lambda 提供编排层\n\n**其他选项为什么错：**\n- A.SageMaker AI 异步端点：异步模式引入排队Latency（延迟），不适合低延迟实时调用需求\n- D.Bedrock 自动扩缩：按需模式无法保证吞吐量一致性，冷启动影响批处理性能\n- E.SageMaker JumpStart：仅提供预训练模型库，不直接解决吞吐量保证和混合部署需求\n\n**关键概念：**Bedrock 预置吞吐量保障高吞吐批处理性能，SageMaker AI 配合 Neo 实现混合云与边缘部署满足数据驻留合规，二者组合覆盖工作负载多样性和部署灵活性。","s":"源#123"},{"id":"D2-034","d":2,"t":"single","q":"某公司为全部开发者购买了 Q Developer Pro 许可证。公司维护一份经审批的资源清单，涵盖内部库、专有算法技术和合规示例代码。一个新开发团队使用 Amazon Q Developer 开发应用，须确保助手推荐仅引用已审批资源。哪项方案运营开销最小？","o":[{"l":"A","t":"创建包含所有已审批内部库、算法和示例代码的 Git 仓库。将仓库作为工作空间本地包含在项目中。确保开发者使用工作空间上下文获取建议"},{"l":"B","t":"在项目根目录创建名为 amazonq/rules 的文件夹。将已审批的内部库、算法和示例代码添加到该文件夹中"},{"l":"C","t":"在项目中创建名为 rules 的文件夹。将指南和代码存入该文件夹供 Q Developer 参考以获取代码建议"},{"l":"D","t":"创建包含已审批数据源的 Q Developer 定制项。确保开发者使用该定制项开发应用"}],"a":["D"],"e":"**正确答案：D。** Q Developer 定制项。\n\n**为什么对：**定制项专用于整合组织审批的知识和编码指引，无需逐项目修改即可让助手推荐与公司政策保持一致。定制项将 Q Developer 指向精选内部来源（已审批库、编码标准、架构模式和专有技术），使建议自动符合公司规范。管理员统一维护定制项内容，新团队直接关联即可使用。\n\n**其他选项为什么错：**\n- A.Git 仓库+工作空间上下文：需在每个项目中手动包含仓库，管理分散且难以统一更新\n- B.amazonq/rules 文件夹：非 Q Developer 的标准定制化机制，范围仅限单个项目\n- C.rules 文件夹：同样为项目级方案，缺乏跨项目的集中管理和版本控制\n\n**关键概念：**Q Developer 定制项提供组织级的已审批知识集成，开发者关联定制项后助手推荐自动遵循公司标准，运维开销最低。","s":"源#124"},{"id":"D2-035","d":2,"t":"single","q":"某医疗保健机构使用 Bedrock 开发实时患者护理 AI 助手，需响应来自不同科室（临床咨询、保险核验、预约安排、保险理赔）的查询。公司希望采用多智能体架构，须确保系统可扩展且能快速为新科室上线服务。哪项方案最能满足需求？","o":[{"l":"A","t":"用独立知识库隔离各智能体数据。用 IAM 过滤控制每个知识库的访问。部署监督智能体对询问执行自然语言意图分类，将查询路由到专门协作者智能体响应特定科室。配置各协作者智能体使用 RAG 连接所属科室知识库"},{"l":"B","t":"为每个科室创建独立监督智能体。配置协作者智能体在各科室内执行意图分类。仅将协作者与对应科室知识库集成。在监督智能体间实施手动交接流程"},{"l":"C","t":"用独立知识库隔离各科室数据。用 IAM 过滤控制访问。部署通用智能体并在其中配置多个操作组执行特定科室功能。在指令中实现基于规则的路由逻辑"},{"l":"D","t":"实施多个独立监督智能体并行运行响应各科室询问。为每个配置多个协作者智能体。将所有智能体与同一知识库集成。使用外部路由逻辑合并响应"}],"a":["A"],"e":"**正确答案：A。** 独立Knowledge Bases（知识库）+监督Agent（智能体）+协作者智能体。\n\n**为什么对：**监督智能体模式是 AWS 推荐的多智能体架构方法——一个智能体负责意图分类和路由，专门智能体处理领域特定任务。独立知识库确保各协作者仅检索本科室相关数据，提高准确性和安全性。新科室只需添加协作者智能体和知识库即可扩展，无需改动整体架构。IAM 过滤保障数据访问边界。\n\n**其他选项为什么错：**\n- B.每科室独立监督智能体+手动交接：手动交接增加Latency（延迟）和错误风险，多监督智能体管理复杂\n- C.通用智能体+操作组：单智能体内集中所有功能违反关注点分离原则，扩展性差\n- D.并行监督智能体+共享知识库：共享知识库导致数据混淆，并行响应增加成本\n\n**关键概念：**监督智能体+协作者智能体模式实现意图分类与领域处理的清晰分离，独立知识库配合 IAM 过滤保障数据隔离，支持按科室独立扩展。","s":"源#125"},{"id":"D2-036","d":2,"t":"single","q":"某医疗保健企业利用 Bedrock 构建实时患者护理智能助手，须处理来自多个科室的咨询，涵盖临床问诊、保险验证、排程管理和理赔处理。企业拟引入多智能体架构，要求系统具备良好扩展能力并可便捷地为新科室开通服务。哪项设计最为合适？","o":[{"l":"A","t":"以独立知识库隔离各智能体数据。以 IAM 过滤管控各知识库访问权限。部署一个监督智能体执行自然语言意图分类，将查询路由至对应科室的协作者智能体。各协作者智能体通过 RAG 访问其科室专属知识库"},{"l":"B","t":"为每个科室设独立监督智能体。为各科室内的细分领域配置协作者智能体执行意图分类。协作者仅与本科室知识库集成。监督智能体间通过手动交接流程协作"},{"l":"C","t":"以独立知识库隔离各科室数据。以 IAM 过滤管控访问。部署单个通用智能体，在其中配置多个操作组执行各科室功能。在指令中实现规则化路由逻辑"},{"l":"D","t":"部署多个独立监督智能体并行响应各科室咨询。为每个监督智能体配置多个协作者。全部智能体连接同一知识库。以外部路由逻辑合并多监督智能体的响应"}],"a":["A"],"e":"**正确答案：A。** 独立Knowledge Bases（知识库）+监督+协作者Agent（智能体）模式。\n\n**为什么对：**这套做法具备可伸缩的多智能体调度能力、清晰的领域边界划分和完善的治理，运营复杂度最低。监督智能体执行意图分类和路由编排，协作者智能体处理领域任务，独立知识库确保数据隔离。新科室上线仅需新增协作者智能体和对应知识库。IAM 过滤保障各科室间的数据安全。\n\n**其他选项为什么错：**\n- B.多监督智能体+手动交接：手动交接增加Latency（延迟）且易出错，多监督智能体增加管理成本\n- C.通用智能体+操作组：单智能体承载所有功能缺乏职责分离，扩展受限\n- D.并行监督智能体+共享知识库：共享知识库造成跨科室数据混淆，并行处理增加资源开销\n\n**关键概念：**监督智能体模式实现意图路由与领域处理的解耦，独立知识库配合 IAM 过滤保障数据隔离，支持按需为新科室独立扩展智能体和知识库。","s":"源#126"},{"id":"D2-037","d":2,"t":"single","q":"某电商平台正在开发使用 Bedrock 和 Claude 向客户推荐产品的生成式 AI 应用。用户反馈部分推荐商品不可售或不相关，且某些推荐响应耗时过长。公司确认大多数客户交互具有唯一性，模型推荐了不在商品目录中的商品。哪项方案可解决这些问题？","o":[{"l":"A","t":"在 Bedrock 护栏中增加接地性并启用自动推理检查。设置预置吞吐量"},{"l":"B","t":"使用提示工程限制模型仅推荐相关产品。使用流式推理降低感知延迟"},{"l":"C","t":"创建 Bedrock Knowledge Bases 并实施 RAG。将 PerformanceConfigLatency 参数设为优化"},{"l":"D","t":"将产品目录数据存入 OpenSearch Service。验证模型推荐与目录匹配性。使用 DynamoDB 做响应缓存"}],"a":["C"],"e":"**正确答案：C。** Knowledge Bases+RAG+PerformanceConfigLatency。\n\n**为什么对：**防止推荐虚构商品的最直接方法是基于权威目录进行接地生成。Knowledge Bases 摄取目录后仅检索实际存在的条目，确保模型输出基于检索到的事实。PerformanceConfigLatency 设为优化可优先低延迟推理路径。大多数交互具有唯一性，缓存策略效果有限，改进检索和推理路径更有效。\n\n**其他选项为什么错：**\n- A.接地性+Provisioned Throughput（预置吞吐量）：提高安全性但不确保推荐限于有效产品\n- B.提示工程+流式：提示约束不足以可靠防止幻觉，流式仅改善感知延迟\n- D.OpenSearch+缓存：增加验证和缓存层但增加复杂度，缓存对唯一交互无效\n\n**关键概念：**Knowledge Bases 通过 RAG 将模型输出约束在权威数据源内，PerformanceConfigLatency 优化推理延迟，适合防止产品推荐幻觉的场景。","s":"源#127"},{"id":"D2-038","d":2,"t":"single","q":"某公司提供全球餐厅发现服务，拥有 5000 万月活用户。公司希望在收录两千万店铺档案及两亿用户点评的数据集上完成语义检索。数据当前存储在 PostgreSQL 中。方案须支持复杂自然语言查询，在 500 毫秒内为至少 95% 的查询返回结果，每小时更新数据新鲜度，并在高峰期经济高效扩展。哪项方案开发工作量最小？","o":[{"l":"A","t":"将数据迁移到 OpenSearch Service。实施基于关键字的搜索规则和自定义分析器，按菜系、特色和位置查找餐厅。创建 API Gateway 将查询转换为结构化搜索参数"},{"l":"B","t":"将数据迁移到 OpenSearch Service。使用 Bedrock FM 从餐厅描述、评价和菜单项生成向量嵌入。用户提交自然语言查询时用同一 FM 转换为嵌入。执行 k-NN 搜索查找语义相似结果"},{"l":"C","t":"将数据保留在 PostgreSQL 中实施 pgvector。使用 Bedrock FM 从餐厅数据生成嵌入并直接存入 PostgreSQL。创建 Lambda 函数执行相似性搜索"},{"l":"D","t":"将嵌入直接存入 PostgreSQL。创建 Lambda 函数将自然语言查询转为向量。在数据库内执行相似性搜索"},{"l":"E","t":"通过自定义摄取管道将数据迁移到 Bedrock Knowledge Bases。配置自动嵌入生成。使用 Retrieve API 内置向量搜索以自然语言查询"}],"a":["B"],"e":"**正确答案：B。** OpenSearch Service+Bedrock FM 嵌入+k-NN。\n\n**为什么对：**OpenSearch Service 提供托管式 k-NN 向量搜索，配合 Bedrock FM 生成嵌入可实现语义匹配——按含义而非关键词检索结果。迁移到 OpenSearch 将搜索工作负载与运营数据库分离，避免高峰期过度配置 PostgreSQL。OpenSearch 原生支持大规模Vector Index（向量索引）和低Latency（延迟）查询，满足 95% 查询 500ms 的要求。每小时更新可通过计划重新摄取实现。\n\n**其他选项为什么错：**\n- A.关键字搜索：不提供语义搜索能力，仅依赖关键词匹配\n- C.PostgreSQL+pgvector：在 2000 万+2 亿规模下事务数据库内运行相似性搜索难以满足 500ms 延迟\n- D.PostgreSQL 嵌入+Lambda：同样受限于 PostgreSQL 的向量搜索性能\n- E.Knowledge Bases+Retrieve API：疑点：源 id 43 同题在 D1-051 中答案为 D，此处照录源答案 B\n\n**关键概念：**OpenSearch Service 配合 Bedrock FM 嵌入实现托管式语义搜索，将搜索负载与运营数据库分离满足高并发低延迟需求。疑点：与 D1-051（src 68）同题但答案不同。","s":"源#128"},{"id":"D2-039","d":2,"t":"single","q":"某企业构建处理财务报告并为分析师提供摘要的生成式 AI 应用。应用须在两种计算环境中运行：Lambda 函数使用 Python SDK 按需分析报告，以及 EKS 集群使用 JavaScript SDK 批量处理报告。方案须在两个环境间维护多轮对话上下文并使用一致的 API 接口。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Bedrock InvokeModel API 为每个环境配置独立身份验证。对话状态存入 DynamoDB。为每种语言编写自定义 I/O 格式化逻辑"},{"l":"B","t":"在两个环境中直接使用 Bedrock Converse API，用 IAM 角色统一身份验证。对话状态存入 ElastiCache。为模型参数创建语言特定的包装器"},{"l":"C","t":"创建集中式 API Gateway REST API 端点用 InvokeModel API 处理所有交互。交互历史存储在函数或容器进程内存中。用环境变量配置模型参数"},{"l":"D","t":"使用 Bedrock Converse API 和 IAM 角色进行身份验证。在请求消息数组中传递历史消息以维护对话上下文。使用语言特定 SDK 建立一致的 API 接口"}],"a":["D"],"e":"**正确答案：D。** Converse API+IAM 角色+消息数组。\n\n**为什么对：**Converse API 为多轮对话交互而设计，在不同 SDK 和计算环境间保持一致工作方式。它标准化了消息、角色和上下文表示，确保 Lambda（Python）和 EKS（JavaScript）使用相同的对话接口。在请求消息数组中传递历史消息实现无状态对话上下文维护，无需外部状态存储。IAM 角色提供跨环境的统一身份验证。\n\n**其他选项为什么错：**\n- A.InvokeModel+独立验证+自定义格式化：InvokeModel 非为对话设计，需自定义格式化增加开发量\n- B.Converse+ElastiCache+语言包装器：ElastiCache 引入额外状态管理，语言包装器增加维护负担\n- C.集中 API Gateway+内存存储：进程内存存储不跨环境持久化，环境变量配置缺乏灵活性\n\n**关键概念：**Converse API 标准化多轮对话的消息和上下文表示，跨 SDK 一致工作，消息数组传递历史实现无状态对话上下文维护。","s":"源#129"},{"id":"D2-040","d":2,"t":"single","q":"某电商企业使用 Bedrock 构建生成式 AI 应用，通过 Step Functions 编排多智能体工作流生成详细产品描述。工作流含三个顺序状态：描述生成器、技术规格验证和 SEO 优化器。中间输出超出 Step Functions 256KB 负载限制。公司须在保持顺序验证的同时解决负载限制。哪项方案最佳？","o":[{"l":"A","t":"将中间输出存入 DynamoDB。在状态间仅传递引用。创建 Map 状态在各智能体处理时从 DynamoDB 检索完整数据"},{"l":"B","t":"配置 Bedrock 集成在输入参数中使用 S3 存储桶 URI 处理大型输出。用 ResultPath 和 ResultSelector 在智能体步骤间路由 S3 引用，同时保持顺序验证工作流"},{"l":"C","t":"用 Lambda 函数将输出压缩到 256KB 以下后传递。各智能体处理前解压，传递前再次压缩"},{"l":"D","t":"为每个智能体配置独立 Step Functions 状态机。用 EventBridge 协调状态机间的执行流程。以 S3 引用作为事件数据传递输出"}],"a":["B"],"e":"**正确答案：B。** Bedrock 集成+S3 URI+ResultPath。\n\n**为什么对：**Step Functions 256KB 负载限制可通过将大型中间产物外部化到 S3 并仅在状态间传递轻量级引用（URI/键）来解决。Bedrock 集成原生支持在输入参数中使用 S3 URI，无需自定义代码读取或写入。ResultPath 和 ResultSelector 在步骤间精确路由 S3 引用，保持顺序验证工作流的完整性。这是 AWS 推荐的大负载工作流处理模式。\n\n**其他选项为什么错：**\n- A.DynamoDB+Map 状态：引入额外数据库增加运营开销，Map 状态用于并行而非顺序流程\n- C.Lambda 压缩/解压：增加自定义代码和Latency（延迟），压缩可能损坏数据\n- D.多状态机+EventBridge：拆分状态机增加编排复杂性，EventBridge 事件不保证顺序\n\n**关键概念：**Step Functions 通过 S3 URI 引用处理超 256KB 负载，Bedrock 集生原生支持 S3 URI 输入，ResultPath/ResultSelector 保持顺序工作流的数据路由。","s":"源#130"},{"id":"D2-041","d":2,"t":"single","q":"某金融服务公司开发实时生成式 AI 助手辅助呼叫中心客服人员。助手须即时将客户语音转为文字、解析对话语境，并在客户讲话过程中向客服人员逐步推送建议。为确保响应速度，从语音输入到首条建议呈现的端到端延迟须低于 1 秒。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Transcribe 流式传输转录通话。将文本传递给 Comprehend 进行情感分析。将结果通过 InvokeModel API 输入到 Bedrock 上的 Claude。将结果存入 DynamoDB。用 WebSocket API 显示结果"},{"l":"B","t":"使用启用部分结果的 Transcribe 流式传输，在客户说完前投递转录文本片段。将片段通过 InvokeModelWithResponseStream API 转发到 Bedrock。通过 API Gateway WebSocket API 将响应流式传输给客服人员"},{"l":"C","t":"使用 Transcribe 批处理将通话转为文字。将完整转录通过 ConverseStream API 传递给 Bedrock 上的 Claude。通过 Lex 聊天机器人界面返回响应"},{"l":"D","t":"使用 Transcribe 流式 API 配合 Lambda 函数转录每个音频段。在 Bedrock 上用 InvokeModel API 调用 Titan Embeddings 模型。将结果发布到 SNS"}],"a":["B"],"e":"**正确答案：B。** Transcribe 流式部分结果+InvokeModelWithResponseStream。\n\n**为什么对：**Transcribe 流式配合部分结果允许在说话者完成句子前投递转录片段，极大缩短感知Latency（延迟）使下游处理即时启动。InvokeModelWithResponseStream 在 Token 生成时推送部分输出，实现模型推理的流式传输。API Gateway WebSocket API 提供双向实时通道将流式响应推送到客服界面。三段流式管道协同满足低于 1 秒端到端延迟。\n\n**其他选项为什么错：**\n- A.Transcribe+Comprehend+InvokeModel：Comprehend 引入额外非流式步骤增加延迟，InvokeModel 非流式推理\n- C.Transcribe 批处理+ConverseStream：批处理需等待完整音频，无法实时转录\n- D.Transcribe+Lambda+Titan Embeddings：Lambda 逐段处理增加延迟，Embeddings 模型不生成建议\n\n**关键概念：**Transcribe 流式部分结果+Bedrock 流式推理+WebSocket API 三段全流式管道实现亚秒级端到端延迟，满足实时增量建议需求。","s":"源#131"},{"id":"D2-042","d":2,"t":"single","q":"某公司构建使用 Bedrock 和 Agent Squad 的多云生成式 AI 密钥解析应用。应用从多个源（密钥存储和 HSM）解析密钥，使用 Lambda 函数从这些源获取密钥元数据。系统通过 Step Functions 编排智能体工作流。为提高可靠性，公司须并行运行密钥解析工作流并对所有提示流进行版本控制以支持回滚。哪项方案以最小改动满足需求？","o":[{"l":"A","t":"使用 Step Functions Map 状态并行运行智能体工作流。通过 Lambda 输出传递更新的密钥元数据。使用 AppConfig 对所有提示流进行版本控制以门控和回滚故障模板"},{"l":"B","t":"仅使用 Bedrock Agents。配置 Bedrock 护栏限制提示变化。使用内联 JSON 模式为单个智能体定义工作流来链式调用工具"},{"l":"C","t":"使用集中式 EventBridge 管道调用每个智能体。中间提示存入 DynamoDB。使用基于 TTL 的回退和重试解析智能体顺序"},{"l":"D","t":"使用 EventBridge Pipes 基于 CloudWatch 日志模式调用解析器。响应元数据存入 DynamoDB 带 TTL 和版本化写入。使用 Q Developer 动态生成回退提示"}],"a":["A"],"e":"**正确答案：A。** Step Functions Map 状态+Lambda+AppConfig。\n\n**为什么对：**Map 状态支持密钥解析工作流的并行执行，改善短生命周期和即将过期密钥的刷新Latency（延迟），确保密钥在下游Agent（智能体）需要前及时刷新。Lambda 输出传递更新的密钥元数据保持现有架构。AppConfig 为提示流提供版本控制和回滚能力，故障模板可安全门控和恢复。方案以最小重设计保留了既有 Step Functions 架构。\n\n**其他选项为什么错：**\n- B.仅 Bedrock Agents+Guardrails（护栏）：护栏限制内容安全但不提供提示版本控制和回滚\n- C.EventBridge+DynamoDB+TTL：放弃 Step Functions 编排改为事件驱动，改动较大且 TTL 回退不可靠\n- D.EventBridge Pipes+Q Developer：动态生成回退提示引入不可预测性，日志模式触发增加复杂性\n\n**关键概念：**Step Functions Map 状态实现并行工作流执行加速密钥刷新，AppConfig 提供提示模板版本控制与安全回滚，最小改动复用现有架构。","s":"源#132"},{"id":"D2-043","d":2,"t":"single","q":"某公司为基于托管模型服务的生成式 AI 应用设计 API。API 须流式传输响应以降低延迟、强制令牌限制以管理计算资源、并内置重试机制以应对模型超时与不完整响应。哪项方案运营开销最低？","o":[{"l":"A","t":"将 API Gateway HTTP API 与 Lambda 函数集成以调用 Bedrock。使用 Lambda 响应流式传输推送响应。在 Lambda 内强制令牌限制。通过 Lambda 和 API Gateway 超时配置实现模型超时的重试逻辑"},{"l":"B","t":"将 API Gateway HTTP API 直接连接到 Bedrock。通过客户端轮询模拟流式传输。在前端强制令牌限制。通过 API Gateway 集成设置配置重试行为"},{"l":"C","t":"将 API Gateway WebSocket API 连接到托管容器化推理服务器的 ECS 服务。通过 WebSocket 流式传输响应。在 ECS 内强制令牌限制。用 ECS 任务生命周期钩子处理超时"},{"l":"D","t":"将 API Gateway REST API 与调用 Bedrock 的 Lambda 集成。使用 Lambda 响应流式传输。在 Lambda 内强制令牌限制。通过超时配置实现重试"}],"a":["A"],"e":"**正确答案：A。** HTTP API+Lambda+响应流式+超时重试。\n\n**为什么对：**HTTP API 提供轻量经济的前端，与 Lambda 干净集成进行请求处理。Lambda 响应流式传输在 Token 生成时推送部分输出满足流式需求。令牌限制在 Lambda 内实施确保资源管控。Lambda 和 API Gateway 的超时配置组合提供模型超时的重试机制。全部使用托管无服务器服务，运营开销最低。\n\n**其他选项为什么错：**\n- B.HTTP API 直连 Bedrock+客户端轮询：轮询非真正流式传输，前端强制令牌限制不可靠\n- C.WebSocket API+ECS 容器：需管理 ECS 集群和容器化推理服务器，运营开销高\n- D.REST API+Lambda：REST API 比 HTTP API 更重且成本更高，非最佳轻量选择\n\n**关键概念：**API Gateway HTTP API 配合 Lambda 响应流式传输实现轻量流式推理，超时配置组合提供重试机制，全部无服务器架构运营开销最低。","s":"源#133"},{"id":"D2-044","d":2,"t":"single","q":"某公司使用 Lambda 实现无服务器推理 API，动态调用 Bedrock 上的多个 AI 模型。须在不改动或重发布函数代码的前提下随时切换模型供应方，且须包含安全发布和回滚机制。哪项方案可满足需求？","o":[{"l":"A","t":"将活跃模型提供商存入 Systems Manager Parameter Store。配置 Lambda 运行时读取参数决定调用哪个模型"},{"l":"B","t":"将活跃模型提供商存入 AppConfig。配置 Lambda 运行时读取配置决定调用哪个模型"},{"l":"C","t":"配置 API Gateway 将请求路由到不同 Lambda 函数。每个函数硬编码特定模型提供商。手动切换集成目标"},{"l":"D","t":"将活跃模型提供商存入 S3 上的 JSON 文件。使用 AppConfig 引用 S3 文件作为配置源。Lambda 运行时通过 AppConfig 读取文件"}],"a":["B"],"e":"**正确答案：B。** AppConfig 存储模型配置。\n\n**为什么对：**AppConfig 专为动态配置管理设计，支持安全推出、验证和回滚功能——正是本场景的明确要求。将活跃模型提供商配置存入 AppConfig 后，公司可实时在 Bedrock 模型间切换而无需重部署 Lambda 代码。AppConfig 的部署策略支持灰度发布和自动回滚，降低配置变更风险。\n\n**其他选项为什么错：**\n- A.Parameter Store：提供参数存储但不支持安全灰度发布和自动回滚等部署策略\n- C.多 Lambda 函数+手动切换：需维护多个函数且手动切换无法实时进行\n- D.S3 JSON+AppConfig 引用：引入 S3 作为中间层增加复杂性，不如直接存入 AppConfig 简洁\n\n**关键概念：**AppConfig 提供动态配置管理与安全发布策略（灰度、验证、回滚），Lambda 运行时读取配置实现无需代码重部署的实时模型切换。","s":"源#134"},{"id":"D2-045","d":2,"t":"single","q":"某公司使用 Bedrock 开发多模态内容分析应用，将不同模态的内容（文本、图片及代码）分发到专属的基础模型。应用须应对多种分发逻辑：按文件后缀的快速分流要求极低时延，基于内容语义的复杂路由须支持条件逻辑和错误处理。哪项方案最合适？","o":[{"l":"A","t":"配置 Lambda 函数对所有路由逻辑调用 Bedrock FM。用条件语句根据内容类型和语义确定合适的 FM"},{"l":"B","t":"创建混合方案。在应用代码中处理基于文件扩展名的简单路由。使用带 JSONata 的 Step Functions 状态机处理基于内容的复杂路由，并用 InvokeModel API 调用专门 FM"},{"l":"C","t":"为每种内容类型部署独立 Step Functions 工作流，路由逻辑在 Lambda 中。用 EventBridge 在工作流间协调回退"},{"l":"D","t":"为每种内容类型使用不同 SQS 队列。配置 Lambda 消费者根据消息属性分析内容并调用合适 FM"}],"a":["B"],"e":"**正确答案：B。** 混合方案：应用代码简单路由+Step Functions 复杂路由。\n\n**为什么对：**需求明确区分了简单和复杂路由。按文件后缀的快速分流对时延要求极高，直接在应用代码中处理避免不必要的编排开销和状态管理Latency（延迟）。基于语义的复杂路由需要条件逻辑和错误处理，Step Functions 配合 JSONata 提供可视化编排、内置重试和错误捕获能力。InvokeModel API 调用专门 FM 完成处理。这套做法符合 AWS 可扩展生成式 AI 应用的推荐架构模式。\n\n**其他选项为什么错：**\n- A.Lambda 全路由：将所有逻辑放入单一函数，简单路由也承受不必要的状态管理开销\n- C.每类型独立状态机+EventBridge：多状态机协调增加复杂性，EventBridge 不保证顺序\n- D.SQS 队列+Lambda：队列引入延迟不适合实时路由，缺乏复杂条件逻辑支持\n\n**关键概念：**混合路由架构将延迟敏感的简单路由留在应用代码、复杂语义路由交给 Step Functions 编排，按延迟和复杂度匹配处理方式。","s":"源#135"},{"id":"D2-046","d":2,"t":"single","q":"某保险公司使用现有 SageMaker AI 基础设施支持 Web 应用，允许客户预测保险费用。训练数据存储在 S3 中且快速增长。每当新文件上传到 S3 时系统须自动重新训练并重新部署模型。方案须提供可靠编排、可审计性和错误处理。哪项方案最佳？","o":[{"l":"A","t":"使用 Glue 对每个上传文件运行 ETL 作业。配置 ETL 用 SDK 调用 SageMaker AI 端点。使用实时推理在模型基于更新数据集重训练后重新部署"},{"l":"B","t":"创建 Lambda 和 Webhook 处理器在文件上传时生成事件。配置 SageMaker Pipelines 在重训练后重新部署。用 EventBridge 创建事件总线"},{"l":"C","t":"创建 Step Functions Express 工作流，用 SDK 集成从 S3 检索数据。用 Data Wrangler 导出到 Autopilot。用 Autopilot 重训练后重新部署"},{"l":"D","t":"创建 Step Functions Standard 工作流。配置首个状态调用 Lambda 响应文件上传事件。使用 SageMaker Pipelines 中的流水线在重训练后重新部署。下一状态在收到响应时运行流水线"}],"a":["D"],"e":"**正确答案：D。** Step Functions Standard+SageMaker Pipelines。\n\n**为什么对：**Step Functions Standard 工作流为长时间运行的有状态流程提供高可靠编排，适合模型重训练和部署周期。Lambda 响应 S3 上传事件触发工作流，SageMaker Pipelines 管理重训练和重新部署的完整流水线。Standard 工作流支持完整执行历史审计和结构化错误处理（Catch/Retry），满足可审计性和错误处理要求。\n\n**其他选项为什么错：**\n- A.Glue ETL+实时推理：Glue 非为模型训练编排设计，实时推理不适合重训练场景\n- B.Lambda+Webhook+EventBridge：Webhook 非标准 AWS 模式，缺乏完整编排和审计\n- C.Express 工作流+Autopilot：Express 不支持完整执行历史审计，Autopilot 自动化程度高但灵活性低\n\n**关键概念：**Step Functions Standard 工作流提供可靠编排和完整审计追踪，配合 SageMaker Pipelines 实现自动化重训练与重新部署，适合 MLOps 事件驱动场景。","s":"源#136"},{"id":"D2-047","d":2,"t":"single","q":"某公司开发客户支持应用，使用 Bedrock 基础模型为员工提供实时 AI 辅助。应用须逐字符显示 AI 生成的响应，支持数千并发用户且延迟最低。响应通常需 15 到 45 秒完成。哪项方案可满足需求？","o":[{"l":"A","t":"配置带 Lambda 集成的 API Gateway WebSocket API。配置 WebSocket API 调用 Bedrock InvokeModelWithResponseStream API 并通过 WebSocket 连接流式传输部分响应"},{"l":"B","t":"配置带 Lambda 集成的 API Gateway REST API。配置 REST API 调用标准 InvokeModel API 并实现前端每 100 毫秒轮询完整响应块"},{"l":"C","t":"实现前端直接连接 Bedrock，使用 IAM 用户凭证和 InvokeModelWithResponseStream API，不经中间网关"},{"l":"D","t":"配置带 Lambda 集成的 API Gateway HTTP API。将完整响应缓存在 DynamoDB 中并通过分页 GET 请求提供给前端"}],"a":["A"],"e":"**正确答案：A。** WebSocket API+Lambda+InvokeModelWithResponseStream。\n\n**为什么对：**需求要求逐字符流式传输、长时间运行响应、低Latency（延迟）和大规模并发。InvokeModelWithResponseStream 在 Token 生成时流式推送部分输出，无需等待完整响应。API Gateway WebSocket API 提供持久双向连接，适合长时间流式会话。Lambda 在 WebSocket 与 Bedrock 间处理请求逻辑和安全控制。这套做法满足逐字符显示和数千并发需求。\n\n**其他选项为什么错：**\n- B.REST API+轮询：轮询非真正流式传输，100ms 间隔无法实现逐字符显示\n- C.前端直连 Bedrock+IAM 用户凭证：暴露模型端点和凭证给前端，安全隐患大\n- D.HTTP API+DynamoDB 缓存+分页：缓存完整响应后分页返回，不满足逐字符流式需求\n\n**关键概念：**WebSocket API 提供持久双向连接适合长时流式会话，InvokeModelWithResponseStream 实现 Token 级流式推送，Lambda 处理中间逻辑和安全控制。","s":"源#137"},{"id":"D2-048","d":2,"t":"single","q":"某零售公司在网站上向客户提供产品推荐，应用使用 Bedrock 通过动态构建提示并发送给基础模型来生成推荐。开发者部署更新后指示 FM 在响应中包含特定促销信息，但 FM 未能在推荐中纳入该信息。哪项方案可最有效地解决此问题？","o":[{"l":"A","t":"在提示上使用 Bedrock 护栏过滤器。将输入过滤器强度设为高"},{"l":"B","t":"生成多个包含不同促销方式的响应变体。使用重排序模型按与原始提示的相关性选择最连贯版本"},{"l":"C","t":"通过 Bedrock 运行提示。通过 AgentCore 处理响应以添加促销信息。用原始提示和期望消息作为上下文重新排序结果"},{"l":"D","t":"通过在给 FM 的提示中使用输出指示符，强化在推荐中包含新促销信息的要求"}],"a":["D"],"e":"**正确答案：D。** 提示中使用输出指示符。\n\n**为什么对：**当 FM 未包含特定内容或未将其连贯整合时，提示工程技术最为有效。输出指示符通过明确定义促销信息应出现的位置（如「响应须以以下信息结尾：[促销文本]」）或提供示例输出结构，在模型生成路径中强化约束。这比生成多变体重排序或添加后处理层更简洁直接，无需额外服务或自定义代码。\n\n**其他选项为什么错：**\n- A.Guardrails（护栏）过滤器：护栏用于内容安全过滤，非用于强制包含特定促销信息\n- B.多变体+重排序：增加推理成本和Latency（延迟），且不保证促销信息被包含\n- C.AgentCore 后处理：引入额外处理层增加复杂性和延迟\n\n**关键概念：**输出指示符是提示工程技术，通过在提示中明确约束输出格式和必含内容来引导模型行为，无需额外服务或后处理。","s":"源#138"},{"id":"D2-049","d":2,"t":"single","q":"某公司使用 AI 助手应用汇总网站内容并向客户提供信息。公司计划使用 Bedrock 访问基础模型，须将应用部署到开发环境和生产环境。方案须在每个环境中灵活测试不同 FM 且运营复杂度最低。哪项方案最佳？","o":[{"l":"A","t":"创建 CDK 应用。在 CodePipeline 中创建多个流水线，每个配置针对各 FM 的设置。使用 ProvisionedModel.fromProvisionedModelArn 调用 FM"},{"l":"B","t":"为每个环境创建独立 CDK 应用。使用 FoundationModel.fromFoundationModelId 调用 FM。为每个环境创建独立 CodePipeline 流水线"},{"l":"C","t":"创建单个 CDK 应用。使用 FoundationModel.fromFoundationModelId 调用 FM。在 CodePipeline 中创建含各环境部署阶段的单一流水线，用 CodeBuild 部署"},{"l":"D","t":"创建生产环境 CDK 应用。使用 ProvisionedModel.fromProvisionedModelArn 调用 FM。在 CodePipeline 中创建流水线部署到生产。开发环境手动参考生产代码重新创建资源"}],"a":["C"],"e":"**正确答案：C。** 单 CDK 应用+fromFoundationModelId+单流水线多阶段。\n\n**为什么对：**FoundationModel 抽象支持按需调用Foundation Model（基础模型），使应用能动态引用不同 FM 而无需预置容量，适合开发和生产环境中的实验与 A/B 测试。单个 CDK 应用和单条 CodePipeline 含多环境部署阶段最小化运维复杂度，符合 AWS 推荐的部署实践。CodeBuild 部署操作支持各环境差异化配置。\n\n**其他选项为什么错：**\n- A.多流水线+ProvisionedModel：预置容量限制灵活性且成本高，多流水线增加维护负担\n- B.多 CDK 应用+多流水线：代码重复，环境间一致性难以维护\n- D.生产 CDK+手动开发环境：手动创建资源易出错且不一致，违反 IaC 原则\n\n**关键概念：**FoundationModel.fromFoundationModelId 支持按需动态引用 FM，单 CDK 应用配合单 CodePipeline 多环境阶段实现最低运维复杂度的灵活 FM 测试。","s":"源#139"},{"id":"D2-050","d":2,"t":"multiple","q":"某金融机构拟用 Bedrock FM 处理客服中心录音。录音完成后以 MP3 格式存入 S3 存储桶。公司须在文件入库后即刻产出结构化的录音摘要及情感分析结果。哪组方案组合可提供最少的代码和运维开销？（选择两项）","o":[{"l":"A","t":"使用 Step Functions 编排工作流。配置步骤调用 Transcribe 转换音频为文本、验证完成后调用 Lambda 使用 Bedrock FM 处理文本生成结构化分析"},{"l":"B","t":"使用 Step Functions 编排工作流。配置步骤调用 Transcribe 转换音频为文本、验证完成后直接调用 Bedrock FM 生成 JSON 格式的摘要和情感分析"},{"l":"C","t":"使用 Step Functions 编排工作流。配置步骤调用 Transcribe 转换音频为文本、验证完成后调用 Lambda 创建提示以调用 Bedrock FM 生成结构化分析"},{"l":"D","t":"配置源 S3 存储桶向 EventBridge 发送事件。创建 EventBridge 规则在存储桶中创建对象时调用 Step Functions 工作流"},{"l":"E","t":"配置源 S3 存储桶在创建对象时向 Step Functions 工作流发送通知"}],"a":["B","D"],"e":"**正确答案：B、D。**\n\n**为什么对：**\n- B.Step Functions+Transcribe+Bedrock 直调 JSON：Step Functions 原生集成 Transcribe 和 Bedrock，直接调用 FM 生成 JSON 输出无需中间 Lambda，减少代码和维护。现代 FM 可直接按 JSON 格式返回结构化摘要和情感分析\n- D.S3→EventBridge→Step Functions：EventBridge 规则在 S3 对象创建时触发工作流，提供可靠的事件驱动入口，无需自定义通知代码\n\n**其他选项为什么错：**\n- A.Step Functions+Lambda 处理：引入额外 Lambda 函数处理文本，增加代码和运维开销\n- C.Step Functions+Lambda 创建提示：同样引入不必要的 Lambda 中间层\n- E.S3 直接通知 Step Functions：S3 事件通知直接发送到 Step Functions 的集成不如经 EventBridge 灵活可靠\n\n**关键概念：**Step Functions 原生集成 Transcribe 和 Bedrock 实现无代码编排，EventBridge 规则提供可靠的 S3 事件触发，FM 直接输出 JSON 减少中间处理层。","s":"源#140"},{"id":"D2-051","d":2,"t":"single","q":"某公司开发基于生成式 AI 的客户支持应用，使用 Bedrock 基础模型。应用须跨同一用户的多次交互维护对话上下文，须运行澄清工作流处理模糊查询，并须持久化存储每个用户的对话历史。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Step Functions Express 工作流编排对话流程。调用 Lambda 运行澄清逻辑。对话历史存入 RDS 以会话 ID 为主键"},{"l":"B","t":"使用 Step Functions Standard 工作流编排澄清工作流。包含等待回调模式管理工作流。对话历史存入 DynamoDB 并购买按需容量配置服务器端加密"},{"l":"C","t":"使用 API Gateway REST API 部署应用，将请求路由到 Lambda 更新和检索对话上下文。对话历史存入 S3 配置服务器端加密。每次交互保存为独立 JSON 文件"},{"l":"D","t":"使用 Lambda 调用 Bedrock 推理 API。使用 SQS 编排澄清步骤。对话历史存入 ElastiCache 集群配置静态加密"}],"a":["B"],"e":"**正确答案：B。** Step Functions Standard+等待回调+DynamoDB。\n\n**为什么对：**Standard 工作流专为长时间运行的有状态流程设计，高可靠性适合需要多轮往返沟通的澄清环节。等待回调机制使工作流可在等待外部输入时暂停并随后恢复执行。DynamoDB 按需容量提供低Latency（延迟）的对话历史持久化，服务器端加密满足安全要求。SQS 和 ElastiCache 不适合持久化对话状态存储。\n\n**其他选项为什么错：**\n- A.Express 工作流+RDS：Express 不支持完整审计和长时间运行场景，RDS 引入关系数据库管理开销\n- C.API Gateway+Lambda+S3 JSON：S3 非为低延迟对话历史检索设计，JSON 文件管理碎片化\n- D.Lambda+SQS+ElastiCache：SQS 队列编排缺乏状态管理能力，ElastiCache 为临时缓存不适合持久存储\n\n**关键概念：**Step Functions Standard 工作流支持长时间有状态流程和等待回调模式，DynamoDB 按需容量提供持久化对话历史存储，适合多轮澄清场景。","s":"源#141"},{"id":"D2-052","d":2,"t":"multiple","q":"某公司使用 Lambda 和 REST API 构建推理代理以自动化支持工作流。系统须跨交互保留记忆、共享关联的代理状态，并兼容事件驱动式与同步式两种调用模式。系统还须执行访问控制和基于会话的权限管理。哪组方案组合可提供最具可扩展性的架构？（选择两项）","o":[{"l":"A","t":"使用 Bedrock AgentCore 管理记忆和会话感知推理。使用内置身份支持、事件处理和可观测性部署代理"},{"l":"B","t":"通过 API Gateway 和 EventBridge 将 Lambda 和 REST API 注册为操作。使 AgentCore 能调用 Lambda 和 REST API 而无需自定义编排代码"},{"l":"C","t":"使用 Bedrock Agents 进行推理和对话管理。使用 Step Functions 和 SQS 编排。代理状态存入 DynamoDB"},{"l":"D","t":"将推理逻辑作为容器部署在 API Gateway 后的 ECS 上。使用 Aurora 存储记忆和身份数据"},{"l":"E","t":"使用 Kendra 和 Bedrock 构建自定义 RAG 流水线。使用 Lambda 编排工具调用。代理状态存入 S3"}],"a":["A","B"],"e":"**正确答案：A、B。**\n\n**为什么对：**\n- A.AgentCore 管理记忆和会话推理：AgentCore 专为管理跨会话的代理记忆存储、上下文延续及身份鉴权推理而设计，内置身份支持和可观测性消除手动状态管理需求\n- B.API Gateway+EventBridge 注册操作：将 Lambda 和 REST API 注册为 AgentCore 操作后无需自定义编排代码即可调用，EventBridge 支持事件驱动调用，API Gateway 支持同步调用\n\n**其他选项为什么错：**\n- C.Agents+Step Functions+SQS+DynamoDB：需手动构建编排和状态管理，不如 AgentCore 托管方案简洁\n- D.ECS 容器+Aurora：需管理容器集群和数据库，运营开销大\n- E.Kendra+自定义 RAG+S3：需构建完整自定义流水线，代码量和运维开销最大\n\n**关键概念：**AgentCore 提供托管式代理记忆、会话上下文和身份感知推理，配合 API Gateway 和 EventBridge 注册操作实现无自定义编排的事件驱动与同步调用。","s":"源#142"},{"id":"D2-053","d":2,"t":"single","q":"一家金融服务公司正在开发实时 GenAI 助手，为呼叫中心的人工坐席提供支持。该助手需要实时转录客户语音、分析上下文，并在客户仍在通话时向坐席提供增量建议。从语音输入到初始响应显示的端到端延迟（End-to-End Latency）必须低于 1 秒。架构只能使用 AWS 托管服务，并且必须支持双向流（Bidirectional Streaming），确保坐席能实时接收更新。哪种方案能满足这些要求？","o":[{"l":"A","t":"使用 Amazon Transcribe 流式传输来转录呼叫。将文本传递给 Amazon Comprehend 进行情感分析。使用 InvokeModel API 将结果提供给 Amazon Bedrock 上的 Anthropic Claude。将结果存储在 Amazon DynamoDB 中。使用 WebSocket API 显示结果。"},{"l":"B","t":"使用启用了部分结果的 Amazon Transcribe 流式传输，可以在客户说完之前传送转录文本的片段。使用 InvokeModelWithResponseStream API 将文本片段转发到 Amazon Bedrock。通过 Amazon API Gateway WebSocket API 将响应流式传输至呼叫中心代理。"},{"l":"C","t":"使用 Amazon Transcribe 批处理将呼叫转换为文本。使用 ConverseStream API 将完整的转录本传递给 Amazon Bedrock 上的 Anthropic Claude。通过 Amazon Lex 聊天机器人界面返回响应。"},{"l":"D","t":"将 Amazon Transcribe 流 API 与 AWS Lambda 函数结合使用来转录每个音频片段。使用 InvokeModel API 调用 Amazon Bedrock 上的 Amazon Titan Embeddings 模型。将结果发布到 Amazon SNS。"}],"a":["B"],"e":"**正确答案：B。** 启用部分结果的 Amazon Transcribe Streaming 配合 InvokeModelWithResponseStream API 和 WebSocket API，能端到端地实现流式低延迟架构。\n\n**为什么对：** Amazon Transcribe Streaming 的部分结果（Partial Results）功能允许在说话者说完整句之前就发送转录片段，显著降低感知延迟。InvokeModelWithResponseStream API 支持令牌级流式输出，让助手可以逐步生成建议而非等待完整响应。Amazon API Gateway WebSocket API 提供完全托管的双向通信通道，实现后端到前端的实时推送，无需自建 Socket 基础设施。三者串联确保端到端延迟可控在 1 秒以内。\n\n**其他选项为什么错：**\n- A. 引入 Comprehend 情感分析和 DynamoDB 写入：增加了同步处理层和存储延迟，无法满足 1 秒延迟要求。\n- C. 使用 Transcribe 批处理（Batch）：批处理是呼叫结束后才转录，完全不满足实时性要求。\n- D. 使用 Titan Embeddings 模型和 SNS：Embeddings 模型用于向量生成而非文本生成，SNS 是异步消息服务，不适合实时增量建议场景。\n\n**关键概念：** Transcribe Streaming Partial Results → InvokeModelWithResponseStream → WebSocket API 是 AWS 实时 GenAI 辅助的标准流式架构模式。","s":"源#143"},{"id":"D2-054","d":2,"t":"single","q":"一家电商公司运营全球产品推荐系统，需要根据法规、成本优化和性能要求，在 Amazon Bedrock 的多个基础模型（Foundation Model, FM）之间动态切换。公司必须实施专有业务逻辑控制，包括动态成本阈值、区域合规规则以及跨多个 FM 的实时 A/B 测试。系统必须无需部署新代码即可在 FM 之间切换，并基于用户层级、交易金额、监管区域和每小时变化的实时成本指标等复杂规则路由请求，且配置变更需在数千个并发请求中立即生效。哪种方案能满足这些要求？","o":[{"l":"A","t":"部署一个 AWS Lambda 函数，该函数使用环境变量来存储路由规则和 Amazon Bedrock FM ID。当业务需求发生变化时，使用 Lambda 控制台更新环境变量。配置 Amazon API Gateway REST API 以读取请求参数以做出路由决策。"},{"l":"B","t":"部署 Amazon API Gateway REST API 请求
