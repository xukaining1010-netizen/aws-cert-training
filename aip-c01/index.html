function getOptionsHTML(q, userAns, finished, correct, shuffledAns) {
  let html = '';
  const qtype = q.t;
  if(qtype === 'hot') {
    html += `<div class="options-list" style="background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:16px">
      <div style="font-weight:600;color:var(--primary);margin-bottom:8px">🖱 本题为拖拽/操作题（HOTSPOT）</div>
      <div style="font-size:13px;line-height:1.7;color:var(--text2)">本题无标准 A/B/C/D 选项，答题形式为图形拖拽/区域选择。题目与图形见源 PDF 原图，答案请参照源文件。</div>`;
    if(q.e) {
      html += `<div style="margin-top:10px;font-size:13px;line-height:1.7;color:var(--text2);border-top:1px solid var(--border);padding-top:10px"><strong>解析/提示：</strong><br>${highlightGlossaryTerms(fmtExp(q.e))}</div>`;
    }
    html += `</div>`;
    return html;
  }
  if(qtype === 'single' || qtype === 'multiple') {
    const isMulti = qtype === 'multiple';
    html += `<div class="options-list">`;
    const opts = quizState.shuffledOptions && quizState.shuffledOptions[q.id] ? quizState.shuffledOptions[q.id] : q.o;
    opts.forEach(o => {
      const isSelected = userAns && userAns.includes(o.l);
      let cls = 'option-item';
      if(isMulti) cls += ' multi';
      if(isSelected && !finished) cls += ' selected';
      if(finished) {
        if(shuffledAns.includes(o.l)) cls += ' correct';
        else if(isSelected) cls += ' wrong';
      }
      const onclick = finished ? '' : `toggleOption('${o.l}')`;
      html += `<div class="${cls}" onclick="${onclick}">
        <span class="opt-label">${o.l}</span>
        <span>${o.t}</span>
      </div>`;
    });
    html += `</div>`;
    if(isMulti && !finished) html += `<div style="font-size:13px;color:var(--text2);margin-top:-12px;margin-bottom:16px">多选——请选择所有正确答案后提交（至少选2项）</div>`;
  }
  return html;
}

/* ================================================================
   ===================== 交互逻辑 =================================
   ================================================================ */

function toggleOption(label) {
  const q = quizState.questions[quizState.currentIdx];
  if(!quizState.answered) quizState.answered = {};
  if(q.t==='single') {
    quizState.answered[q.id] = [label];
  } else {
    const arr = quizState.answered[q.id] || [];
    const idx = arr.indexOf(label);
    if(idx>=0) arr.splice(idx,1);
    else arr.push(label);
    quizState.answered[q.id] = arr;
  }
  renderQuiz();
}

function updateSubmitButton() {
  const q = quizState.questions[quizState.currentIdx];
  if(q.t === 'hot') return;
  const ans = quizState.answered && quizState.answered[q.id];
  const btn = document.getElementById('submitBtn');
  if(!btn) return;
  if(q.t==='single') btn.disabled = !ans || !ans.length;
  else if(q.t==='multiple') btn.disabled = !ans || ans.length < 2;
}

function getShuffledAnswer(q) {
  if(quizState && quizState.shuffledAnswers && quizState.shuffledAnswers[q.id]) {
    return quizState.shuffledAnswers[q.id];
  }
  return q.a;
}

function isAnswerCorrect(q, userAns) {
  if(!userAns) return false;
  const ca = getShuffledAnswer(q);
  if(q.t==='single') return userAns[0]===ca[0];
  if(q.t==='multiple') { const a=[...userAns].sort(); const b=[...ca].sort(); return JSON.stringify(a)===JSON.stringify(b); }
  return false;
}

function formatAnswer(q) {
  const ca = getShuffledAnswer(q);
  if(q.t==='single'||q.t==='multiple') return ca.join(', ');
  if(q.t==='hot') return '本题为拖拽/操作题，答案为图形区域匹配，见源 PDF 原图';
  return '';
}

function submitAnswer() {
  const q = quizState.questions[quizState.currentIdx];
  let userAns = quizState.answered && quizState.answered[q.id];
  if(!userAns) return;
  if(q.t==='multiple' && userAns.length < 2) {
    alert('多选题至少选择2个答案，当前只选了' + userAns.length + '个');
    return;
  }
  const correct = isAnswerCorrect(q, userAns);
  if(!quizState.submitted) quizState.submitted={};
  quizState.submitted[q.id]=true;
  // 本场作答留痕（考核判分唯一依据；不与全局统计混用）
  if(!quizState.results) quizState.results={};
  quizState.results[q.id]={ua:[...userAns], ok:correct, ts:Date.now()};
  recordAnswer(q.id, userAns, correct);
  renderQuiz();
  updateSubmitButton();
}

function prevQuestion() {
  if(quizState.currentIdx > 0) { quizState.currentIdx--; renderQuiz(); }
}
function nextQuestion() {
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  if(isLast) {
    if(quizState.mode==='exam') renderExamResult();
    else navigate('dashboard');
  } else {
    quizState.currentIdx++;
    renderQuiz();
  }
}
function jumpToQuestion(idx) {
  quizState.currentIdx = idx;
  renderQuiz();
}
function exitQuiz() {
  // 考核中途退出必须停表：否则过期计时器归零时会把之后的练习页改写成「考核成绩单」
  if(quizState && quizState.mode==='exam') stopExamTimer();
  if(quizState && quizState.mode!=='exam') {
    setProgress({mode:quizState.mode,domain:quizState.domain||null,idx:quizState.currentIdx,time:Date.now()});
  }
  quizState = null;
  navigate('dashboard');
}

/* ================================================================
   ===================== 刷题模式启动 ==============================
   ================================================================ */
function startDomain(d) {
  const qs = QUESTIONS.filter(q=>q.d===d);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'domain',domain:d,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startContinue() {
  const p = getProgress();
  if(p.mode && p.mode!=='exam') {
    if(p.mode==='domain' && p.domain) {
      const qs = QUESTIONS.filter(q=>q.d===p.domain);
      const _sr=generateShuffledOptions(qs);
      quizState = {mode:'domain',domain:p.domain,questions:qs,currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    } else {
      const _sr=generateShuffledOptions([...QUESTIONS]);
      quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    }
  } else {
    const _sr=generateShuffledOptions([...QUESTIONS]);
    quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  }
  navigate('quiz');
}
function startWrongReview() {
  const wrong = getWrong().filter(w=>!w.mastered);
  if(!wrong.length) { alert('暂无错题需要复习！'); return; }
  const qs = wrong.map(w=>getQById(w.id)).filter(Boolean);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'wrong',domain:null,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startSingle(id) {
  const q = getQById(id);
  if(!q) return;
  const _sr=generateShuffledOptions([q]);
  quizState = {mode:'single',domain:null,questions:[q],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startExam() {
  // 模拟考核：按 meta 权重 × meta 题数分配各域配额（最大余数法，保证总和=EXAM_COUNT）
  const counts = {};
  let sumInt = 0;
  const raw = {}, rem = {};
  DOMAIN_KEYS.forEach(k => {
    const w = parseFloat(String(DOMAIN_WEIGHTS[k]||'0').replace('%',''))/100;
    raw[k] = w * EXAM_COUNT;
    counts[k] = Math.floor(raw[k]);
    rem[k] = raw[k] - counts[k];
    sumInt += counts[k];
  });
  let deficit = EXAM_COUNT - sumInt;
  const order = [...DOMAIN_KEYS].sort((a,b)=>rem[b]-rem[a]);
  let i = 0;
  while(deficit > 0) { counts[order[i % order.length]]++; deficit--; i++; }
  let selected = [];
  DOMAIN_KEYS.forEach(d => {
    const pool = shuffle(QUESTIONS.filter(q=>q.d===d && q.t!=='hot'));
    selected.push(...pool.slice(0, counts[d]));
  });
  selected = shuffle(selected);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam',domain:null,questions:selected,currentIdx:0,answered:{},submitted:{},results:{},shuffledOptions:_exam.opts,shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  // 场次标识：计时回调据此判定「本场是否仍在进行」，防过期计时器串场
  quizState.examToken = 'ex-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

let examTimerInterval = null;
function stopExamTimer() {
  if(examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
}
function startExamTimer() {
  let secs = quizState.examDuration;
  const token = quizState.examToken;
  const timerEl = document.getElementById('quizTimer');
  if(!timerEl) return;
  stopExamTimer();
  examTimerInterval = setInterval(() => {
    // 场次校验：已退出或已换场（新 token）立即自毁
    if(!quizState || quizState.mode!=='exam' || quizState.examToken!==token) { stopExamTimer(); return; }
    secs--;
    const m = Math.floor(secs/60), s = secs%60;
    const el = document.getElementById('quizTimer');
    if(el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if(secs<=60 && el) el.classList.add('warning');
    if(secs<=0) { stopExamTimer(); finishExam(token); }
  }, 1000);
}

function finishExam(token) {
  stopExamTimer();
  // 只对「发起本场计时」的考核会话生效
  if(quizState && quizState.mode==='exam' && (token===undefined || quizState.examToken===token)) renderExamResult();
}

function renderExamResult() {
  if(!quizState) return;
  stopExamTimer();
  const qs = quizState.questions;
  const results = quizState.results || {};
  const total = qs.length;
  // 逐题按本场作答判分；全局历史与往场作答一律不计
  let correct = 0, wrong = 0, unanswered = 0;
  const domStat = {};
  DOMAIN_KEYS.forEach(d => domStat[d] = {n:0, cor:0});
  qs.forEach(q => {
    if(!domStat[q.d]) domStat[q.d] = {n:0, cor:0};
    domStat[q.d].n++;
    const r = results[q.id];
    if(!r) unanswered++;
    else if(r.ok) { correct++; domStat[q.d].cor++; }
    else wrong++;
  });
  // 不变量自校验：正确 + 错误 + 未答 必须等于试卷题数
  if(correct + wrong + unanswered !== total) console.warn('[exam] 判分不变量异常', {correct, wrong, unanswered, total});
  const el = document.getElementById('page-quiz');
  const pct = total ? Math.round(correct/total*100) : 0;
  // 1000-point scale, 700 to pass
  const scaledScore = total ? Math.round(correct/total*1000) : 0;
  const passed = scaledScore >= EXAM_PASS;
  // Time used
  const timeUsed = quizState.examStartTime ? Math.round((Date.now()-quizState.examStartTime)/1000) : 0;
  const timeM = Math.floor(timeUsed/60), timeS = timeUsed%60;

  // Domain breakdown
  let domainHtml = '';
  for(const d of DOMAIN_KEYS) {
    const dd = domStat[d] || {n:0, cor:0};
    const dPct = dd.n ? Math.round(dd.cor/dd.n*100) : 0;
    domainHtml += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${dd.n}</td><td>${dd.cor}</td><td style="color:${dPct>=70?'var(--correct)':'var(--wrong)'}">${dPct}%</td></tr>`;
  }

  el.innerHTML = `<div class="header"><button class="back-btn" onclick="exitExam()">←</button><h1>📋 考核成绩单</h1></div>
  <div style="text-align:center;padding:30px 20px">
    <div style="font-size:48px;font-weight:700;color:${passed?'var(--correct)':'var(--wrong)'}">${scaledScore}</div>
    <div style="font-size:14px;color:var(--text2);margin:4px 0">满分 1000 分 | 及格线 ${EXAM_PASS} 分</div>
    <div style="font-size:16px;color:var(--text);margin:12px 0;font-weight:600">${passed?'✅ 通过！':'❌ 未通过'}</div>
    <div style="display:flex;justify-content:center;gap:20px;margin:16px 0;flex-wrap:wrap">
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--correct)">${correct}</div><div style="font-size:12px;color:var(--text2)">正确</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--wrong)">${wrong}</div><div style="font-size:12px;color:var(--text2)">错误</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text2)">${unanswered}</div><div style="font-size:12px;color:var(--text2)">未答</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--primary)">${pct}%</div><div style="font-size:12px;color:var(--text2)">正确率</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text)">${timeM}分${timeS.toString().padStart(2,'0')}秒</div><div style="font-size:12px;color:var(--text2)">用时</div></div>
    </div>
  </div>
  <div class="stats-chart">
    <h3>各章节成绩</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>题数</th><th>正确</th><th>正确率</th></tr></thead><tbody>
    ${domainHtml}
    </tbody></table>
  </div>
  <div style="text-align:center;padding:20px">
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn-secondary" onclick="exitExam()" style="width:auto">返回首页</button>
      <button class="btn-primary" onclick="startExam()" style="width:auto;flex:none">再考一次</button>
    </div>
  </div>`;
  quizState = null;
}

function exitExam() {
  quizState = null;
  navigate('dashboard');
}

/* ================================================================
   ===================== 错题集页面 ================================
   ================================================================ */
let wrongFilter = 0;

function renderWrongBook() {
  const wrong = getWrong().filter(w=>!w.mastered);
  const mastered = getWrong().filter(w=>w.mastered);
  const el = document.getElementById('page-wrongbook');
  let html = `<div class="header"><h1>❌ 错题集</h1></div>`;
  html += `<div class="wrong-stats">
    <div class="stat-card"><div class="stat-num">${wrong.length}</div><div class="stat-label">待复习</div></div>
    <div class="stat-card"><div class="stat-num">${mastered.length}</div><div class="stat-label">已掌握</div></div>
    <div class="stat-card"><div class="stat-num">${wrong.length+mastered.length}</div><div class="stat-label">共错题</div></div>
  </div>`;
  html += `<div class="wrong-tabs">
    <button class="wrong-tab ${wrongFilter===0?'active':''}" onclick="wrongFilter=0;renderWrongBook()">全部</button>`;
  for(const d of DOMAIN_KEYS) {
    html += `<button class="wrong-tab ${wrongFilter===d?'active':''}" onclick="wrongFilter=${d};renderWrongBook()">${DOMAIN_NAMES[d]}</button>`;
  }
  html += `</div>`;
  let items = wrongFilter ? wrong.filter(w=>{const q=getQById(w.id);return q&&q.d===wrongFilter}) : wrong;
  items.sort((a,b)=>b.count-a.count);
  if(!items.length) {
    html += `<p style="text-align:center;margin-top:40px;color:var(--text2)">🎉 暂无错题！</p>`;
  } else {
    items.forEach(w=>{
      const q = getQById(w.id);
      if(!q) return;
      html += `<div class="wrong-item">
        <div class="wi-header">
          <span><strong>Domain ${q.d}</strong> | ${TYPE_NAMES[q.t]}</span>
          <span style="color:var(--wrong)">答错${w.count}次</span>
        </div>
        <div style="font-size:14px;margin-bottom:6px">${q.q.slice(0,60)}${q.q.length>60?'…':''}</div>
        <div style="font-size:12px;color:var(--text2)">最近答错：${new Date(w.last).toLocaleString()}</div>
        <div class="wi-actions">
          <button onclick="startSingle('${w.id}')">📝 重练本题</button>
          <button onclick="markMastered('${w.id}');renderWrongBook()">✅ 标记已掌握</button>
          <button onclick="removeWrong('${w.id}');renderWrongBook()">🗑️ 移除</button>
        </div>
      </div>`;
    });
  }
  if(mastered.length) {
    html += `<div style="margin-top:20px"><h3 style="font-size:14px;margin-bottom:8px;color:var(--text2)">已掌握 (${mastered.length})</h3>`;
    html += `<button class="btn-secondary" onclick="if(confirm('确定清空所有已掌握的错题吗？')){setWrong(getWrong().filter(w=>!w.mastered));renderWrongBook();}" style="width:auto">清空已掌握</button></div>`;
  }
  el.innerHTML = html;
}

/* ================================================================
   ===================== 统计页面 ==================================
   ================================================================ */
function renderStats() {
  const s = getStats();
  const el = document.getElementById('page-stats');
  let html = `<div class="header"><h1>📊 统计分析</h1></div>`;
  html += `<div class="stats-chart">
    <h3>总进度</h3>
    <div style="height:30px;background:var(--border);border-radius:15px;overflow:hidden">
      <div style="height:100%;width:${s.completion}%;background:var(--primary);border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600">${s.completion}%</div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--text2)">
      <span>已答 ${s.doneIds}/${QUESTIONS.length} 题</span>
      <span>正确率 ${s.acc}%</span>
    </div>
  </div>`;
  html += `<div class="stats-chart"><h3>各章节正确率</h3><canvas id="chartDomain"></canvas></div>`;
  html += `<div class="stats-chart"><h3>各题型正确率</h3><canvas id="chartType"></canvas></div>`;
  html += `<div class="stats-chart"><h3>详细数据</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>总题</th><th>已答</th><th>正确</th><th>正确率</th></tr></thead><tbody>`;
  for(const d of DOMAIN_KEYS) {
    const ds = s.domainStats[d];
    html += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${ds.total}</td><td>${ds.answered}</td><td>${ds.correct}</td><td style="color:${ds.acc>=70?'var(--correct)':'var(--wrong)'};font-weight:600">${ds.acc}%</td></tr>`;
  }
  html += `</tbody></table></div>`;
  el.innerHTML = html;
  setTimeout(() => {
    drawDomainChart(s);
    drawTypeChart(s);
  }, 50);
}

function drawDomainChart(s) {
  const c = document.getElementById('chartDomain');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = DOMAIN_KEYS.map(k=>'D'+k);
  const colors = ['#4361ee','#4cc9f0','#06d6a0','#f8961e','#9b5de5'];
  const barW = (W-80) / (labels.length*1.5);
  labels.forEach((l,i)=>{
    const val = s.domainStats[i+1].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(l, x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

function drawTypeChart(s) {
  const c = document.getElementById('chartType');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = ['单选','多选'];
  const keys = ['single','multiple'];
  const colors = ['#4361ee','#4cc9f0'];
  const barW = (W-80) / 4;
  keys.forEach((k,i)=>{
    const val = s.typeStats[k].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

/* roundRect polyfill */
if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(r>w/2) r=w/2;
    if(r>h/2) r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    return this;
  };
}

/* ================================================================
   ===================== 工具函数 ==================================
   ================================================================ */
function exportData() {
  const data = {
    answers: getAnswers(),
    wrong: getWrong(),
    progress: getProgress(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${LS_PREFIX}-quiz-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.answers) setAnswers(data.answers);
        if(data.wrong) setWrong(data.wrong);
        if(data.progress) setProgress(data.progress);
        alert('数据导入成功！');
        navigate(currentPage);
      } catch(err) { alert('数据格式错误，请检查文件。'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetData() {
  showModal('确认重置', '确定要清除所有答题记录、错题集和进度吗？此操作不可恢复！', () => {
    localStorage.removeItem(LS_ANSWERS);
    localStorage.removeItem(LS_WRONG);
    localStorage.removeItem(LS_PROGRESS);
    navigate('dashboard');
  });
}

/* ================================================================
   ===================== 模态框 ====================================
   ================================================================ */
let modalCallback = null;
function showModal(title, text, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOverlay').classList.add('show');
  modalCallback = onConfirm;
  document.getElementById('modalConfirmBtn').onclick = () => {
    closeModal();
    if(modalCallback) modalCallback();
  };
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

/* ================================================================
   ===================== 主题切换 ==================================
   ================================================================ */
function toggleTheme() {
  document.getElementById('quizView').classList.toggle('dark');
  localStorage.setItem(LS_PREFIX+'_theme', document.getElementById('quizView').classList.contains('dark')?'dark':'light');
  navigate(currentPage);
}

/* ================================================================
   ===================== 初始化 ====================================
   ================================================================ */
function init() {
  if(localStorage.getItem(LS_PREFIX+'_theme')==='dark') document.getElementById('quizView').classList.add('dark');
  const pages = ['dashboard','quiz','wrongbook','stats','settings'];
  const app = document.getElementById('app');
  pages.forEach(p => {
    const div = document.createElement('div');
    div.id = 'page-'+p;
    div.className = 'page' + (p==='dashboard'?' active':'');
    app.appendChild(div);
  });
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => { if(btn.dataset.page==='learn'){ if(window.kbShowLearnHome) window.kbShowLearnHome(); } else navigate(btn.dataset.page); });
  });
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', init);

"focus":"官方权重第二 26%"},{"day":4,"topic":"实施与集成 · 企业集成架构 / FM API / 应用集成模式","focus":"本章练习 12 题"},{"day":5,"topic":"AI 安全 · 输入输出安全控制 / 数据安全与隐私","focus":"官方权重 20%"},{"day":6,"topic":"AI 安全 · 治理合规 / 负责任 AI 原则","focus":"本章练习 12 题"},{"day":7,"topic":"运营效率 · 成本优化与资源效率 / 应用性能优化","focus":"官方权重 12%"},{"day":8,"topic":"运营效率 · GenAI 应用监控体系","focus":"本章练习 12 题"},{"day":9,"topic":"测试验证 · GenAI 评估体系","focus":"官方权重 11%"},{"day":10,"topic":"测试验证 · GenAI 应用故障排除","focus":"本章练习 12 题"}]},"chapters":[{"domain":1,"name":"基础模型集成、数据管理与合规性","weight":"31%","practice":[{"id":"D1-001","d":1,"t":"single","q":"一家媒体公司需要对 50TB 的视频转录文本实现 RAG，并支持实时更新。哪种方法能提供最佳性能？","o":[{"l":"A","t":"Amazon Bedrock Knowledge Bases 配合增量同步和 OpenSearch Serverless"},{"l":"B","t":"使用 SageMaker Processing 作业和 Amazon Neptune 的自定义管道"},{"l":"C","t":"使用 Kinesis Data Streams 和 DynamoDB 向量存储的实时流式处理"},{"l":"D","t":"使用 AWS Glue 和自管理 Elasticsearch 的批处理"}],"a":["A"],"e":"**正确答案：A。** 用 Amazon Bedrock Knowledge Bases（Bedrock 知识库）托管整套 RAG，数据源开启增量同步，向量库选 Amazon OpenSearch Serverless（OpenSearch 无服务器版）。\n\n**为什么对：** 题干两个硬约束——50TB 规模、支持实时更新。增量同步只处理新增和变更的对象，不用每次全量重建索引，正对上\"实时\"；OpenSearch Serverless 按容量自动伸缩，扛得住 50TB 量级的向量检索，集群不用你自己管。\n\n**其他选项为什么错：**\n- B. SageMaker Processing + Neptune：Neptune 是图数据库，不做向量相似度检索，用它做 RAG 得自己写嵌入生成和近邻搜索，属于全自建管道。\n- C. Kinesis Data Streams + DynamoDB 存向量：DynamoDB 没有原生的向量相似度检索能力，近邻搜索要在应用层自己实现，这个数据规模下撑不住。\n- D. AWS Glue + 自管理 Elasticsearch：Glue 是批处理 ETL，做不到实时更新；自管理 Elasticsearch 还要自己运维集群。","s":"源#1"},{"id":"D1-002","d":1,"t":"single","q":"你的 RAG 系统需要处理 15 种语言的文档，并支持按语言检索。哪种嵌入策略最佳？","o":[{"l":"A","t":"使用单一多语言嵌入模型，配合语言元数据过滤"},{"l":"B","t":"使用按语言区分的嵌入模型，每种语言使用独立的向量索引"},{"l":"C","t":"先翻译成英文再嵌入，并追踪源语言"},{"l":"D","t":"使用 Multilingual BERT 进行跨语言对齐和统一搜索"}],"a":["B"],"e":"**正确答案：B。** 每种语言配一个专门的嵌入模型，各自建一条独立的向量索引。\n\n**为什么对：** 题干要求\"按语言检索\"。单语嵌入模型在自家语种上的语义刻画比多语言模型更准；分索引存放之后，检索天然落在同一语种内，不会跨语种串召回，也省掉额外的过滤步骤。\n\n**其他选项为什么错：**\n- A. 单一多语言模型 + 语言元数据过滤：多语言模型为兼容多语种会压缩语义空间，单语精度不如专用模型；元数据过滤是事后筛，候选池里仍然混着别的语种。\n- C. 先翻译成英文再嵌入：多一道翻译就多一层误差和延迟，而且翻译会把原语种特有的术语翻没了。\n- D. Multilingual BERT 跨语言对齐：mBERT 做的是跨语言对齐，目标是\"用中文查英文\"这类跨语种检索，跟本题\"按语言隔离\"的方向正好相反。","s":"源#2"},{"id":"D1-003","d":1,"t":"single","q":"一家律师事务所要求 RAG 在 EU 区域内实现严格的数据驻留，并为所有查询提供审计追踪。哪种配置满足这些要求？","o":[{"l":"A","t":"在 eu-west-1 部署 Bedrock Knowledge Bases，配合 CloudTrail 和 VPC 端点"},{"l":"B","t":"在 eu-central-1 使用自管理方案和自定义审计日志"},{"l":"C","t":"多区域部署，带数据复制和集中式日志"},{"l":"D","t":"在 us-east-1 使用 Bedrock，带数据加密和访问日志"}],"a":["A"],"e":"**正确答案：A。** 把 Amazon Bedrock Knowledge Bases（Bedrock 知识库）部署在 EU 区域（eu-west-1），用 AWS CloudTrail 记录审计，通过 VPC endpoint（VPC 端点）走私有网络。\n\n**为什么对：** 三个要求一一对应。数据驻留——Bedrock 在 eu-west-1 内完成推理，数据不出 EU；审计追踪——CloudTrail 记录所有 API 调用；私有访问——VPC 端点让流量走 AWS 骨干网，不经公网。\n\n**其他选项为什么错：**\n- B. eu-central-1 自管理 + 自定义审计日志：区域合规，但自己写的日志不能替代平台级审计凭证，而且自建 RAG 的成本和复杂度都上去了。\n- C. 多区域部署 + 数据复制：把数据复制到 EU 之外的数据中心，直接违反数据驻留，多加日志也补不回来。\n- D. us-east-1 + 加密和访问日志：区域在美国，第一条就不满足；加密和访问日志解决不了\"数据在哪里处理\"。","s":"源#3"},{"id":"D1-004","d":1,"t":"single","q":"你的分块（chunking）策略在不同文档类型（PDF、Word、HTML）之间产生不一致的结果。哪种方法是最优的？","o":[{"l":"A","t":"按文档类型定制分块，统一生成嵌入"},{"l":"B","t":"基于内容结构的语义分块，不依赖文档格式"},{"l":"C","t":"固定大小分块，按文档类型调整重叠"},{"l":"D","t":"层级分块，带父子关系和元数据"}],"a":["B"],"e":"**正确答案：B。** 按内容自身的语义结构切块（semantic chunking），不看文件是 PDF、Word 还是 HTML。\n\n**为什么对：** 不一致的根源是\"按格式切\"——PDF 按页、Word 按段落、HTML 按标签，规则天生不同。语义分块按标题层级、段落主题和句子边界来切，切法与文件类型无关，三种格式出来的块才可能一致。\n\n**其他选项为什么错：**\n- A. 按文档类型分别定制分块：等于给每种格式写一套规则，恰恰是\"不一致\"的来源，而且规则越多越难维护。\n- C. 固定大小分块 + 按类型调重叠：差异只是被参数掩盖，跨类型的一致性没有真正解决。\n- D. 层级分块（父子块）：解决的是\"召回粒度小、上下文不够\"的矛盾，不是跨格式一致性；父子关系在三种格式里同样难统一。","s":"源#4"},{"id":"D1-005","d":1,"t":"single","q":"一个 RAG 系统出现 40% 的不相关检索结果。当前配置使用 512-token 块和 50-token 重叠。哪种优化能带来最大改进？","o":[{"l":"A","t":"将块大小增加到 1024 token，重叠减少到 25 token"},{"l":"B","t":"实现语义分块并保留句子边界"},{"l":"C","t":"添加元数据丰富化和混合搜索（语义+关键词匹配）"},{"l":"D","t":"改用更小的块（256 token）并增加重叠（100 token）"}],"a":["C"],"e":"**正确答案：C。** 给每个块补上元数据（来源、时间、业务线等）用于检索前过滤，同时把语义检索和关键词检索一起用（hybrid search，混合搜索）。\n\n**为什么对：** 40% 不相关，说明问题出在召回这一跳，不是块大小。混合搜索同时用\"语义相近\"和\"关键词命中\"两个信号，能把纯向量检索漏掉的精确术语捞回来；元数据过滤则在检索前就收窄范围。两条加起来才动到根因。\n\n**其他选项为什么错：**\n- A. 块调大到 1024 token、重叠降到 25：块越大塞进的无关内容越多，重叠变小还会切断跨块语义，通常让相关性更差。\n- B. 语义分块 + 保留句子边界：能改善块本身的质量，但对\"检索到语义相近却答非所问\"这类问题帮助有限。\n- D. 块调小到 256 token、重叠加到 100：小块丢上下文，存储冗余还变多，不解决召回错。","s":"源#5"},{"id":"D1-006","d":1,"t":"single","q":"你需要为包含复杂图表和代码片段的技术文档实现 RAG。哪种方法最适合处理多模态内容？","o":[{"l":"A","t":"仅提取文本，使用传统 RAG 并配合代码语法高亮"},{"l":"B","t":"使用 Amazon Bedrock Data Automation 配合 Nova 模型进行统一处理"},{"l":"C","t":"对文本、图像和代码分别处理，并建立交叉引用"},{"l":"D","t":"使用 Amazon Textract 的自定义 OCR 管道和手动内容关联"}],"a":["B"],"e":"**正确答案：B。** 用 Amazon Bedrock Data Automation（BDA，Bedrock 数据自动化）配合 Amazon Nova 模型统一抽取。\n\n**为什么对：** BDA 是托管的内容抽取服务，带多模态理解能力，能把正文、图表和代码块一次性转成结构化内容再入索引，不用自己拼三条管道。\n\n**其他选项为什么错：**\n- A. 只抽文本 + 代码语法高亮：图表信息直接丢了，题干明确要求处理多模态内容。\n- C. 文本/图像/代码分别处理再交叉引用：能做，但要自建三套管道加一套对齐逻辑，工作量和一致性风险都高。\n- D. Amazon Textract 自定义 OCR + 手工关联：Textract 主要做文字和表单抽取，理解不了图表的含义，\"手工关联\"也不可扩展。","s":"源#6"},{"id":"D1-007","d":1,"t":"single","q":"一个金融服务 RAG 系统需要维护监管文档的版本控制，并支持历史查询。哪种架构支持此需求？","o":[{"l":"A","t":"带版本控制的 Amazon S3 存储桶，配合基于时间 metadata 过滤的 Knowledge Bases 检索配置"},{"l":"B","t":"基于 Git 的文档管理，自动更新 Knowledge Base"},{"l":"C","t":"Knowledge Bases 中的文档版本管理，带时间查询参数"},{"l":"D","t":"每个文档版本使用独立的 Knowledge Base，统一查询接口"}],"a":["A"],"e":"**正确答案：A。** 数据源用开启 versioning（版本控制）的 Amazon S3 存储桶保存每个历史版本，再让各版本分别同步进 Amazon Bedrock Knowledge Bases（Bedrock 知识库），并给每份文档打上时间 metadata；检索时用 metadata filtering（元数据过滤）按时间条件筛出目标版本。\n\n**为什么对：** 题干两个要求——\"版本控制\"和\"历史查询\"，分别对应两侧的机制。\n- 版本控制：S3 versioning 把每次覆盖和删除都留成历史对象，旧版本一直在，这是\"旧内容还在不在\"的前提。\n- 历史查询：Knowledge Bases 本身没有版本概念，Retrieve / RetrieveAndGenerate API 也没有时间点参数；能做到的路径是——各版本文档分别入库，用文档级 `.metadata.json` 写入生效时间，检索时按 metadata 范围条件（`greaterThan` / `lessThan` 等，接受 ISO-8601 时间值）过滤出目标版本。\n两段合起来，历史时点的文档可以被精确召回。\n\n**其他选项为什么错：**\n- B. Git 管文档 + 自动更新知识库：Git 只保留源文件的历史，同步进知识库的永远是最新版，检索不到历史时点的内容。\n- C. 知识库内建文档版本管理 + 时间查询参数：Knowledge Bases 不提供文档版本管理，检索 API 也没有时间点参数，这个选项描述的能力不存在。\n- D. 每个文档版本建独立知识库：版本一多知识库数量就膨胀，同步、成本和维护都不现实；用 metadata 区分版本不需要多建知识库。\n\n**关键概念：** 版本控制由数据源侧（Amazon S3 versioning）保证，时间维度由 metadata 侧（文档级 `.metadata.json` + metadata filtering 范围运算符）实现——内置字段 `epoch_modification_time` 记录文档最后更新时间，可直接作过滤条件。参考：Amazon Bedrock User Guide《Knowledge Bases》metadata filtering 章节。","s":"源#7"},{"id":"D1-008","d":1,"t":"single","q":"你的 RAG 检索延迟在 1000 万文档语料上平均为 3 秒。哪种优化能显著降低延迟？","o":[{"l":"A","t":"实现近似最近邻搜索，降低精度"},{"l":"B","t":"为频繁访问的嵌入添加 Redis 缓存层"},{"l":"C","t":"优化向量数据库配置并增加计算资源"},{"l":"D","t":"为常见查询模式预先计算并缓存嵌入"}],"a":["D"],"e":"**正确答案：D。** 把高频出现的查询先算好嵌入缓存起来，命中时直接跳过嵌入生成这一步。\n\n**为什么对：** 3 秒的构成里，查询侧调用嵌入模型是固定开销且完全可以省掉。预计算并缓存等于把这一跳拿掉，对高频查询模式是见效最快的办法。\n\n**其他选项为什么错：**\n- A. 换近似最近邻（ANN）牺牲精度：千万级向量库基本已经在用 ANN，再降精度是拿召回质量换时间，而且不是延迟的大头。\n- B. 加 Redis 缓存频繁访问的嵌入：缓存的是文档侧嵌入，省下的是读取开销，查询侧那次模型调用还在。\n- C. 优化向量库配置 + 加资源：能摊薄但治标，成本还直线上升。","s":"源#8"},{"id":"D1-009","d":1,"t":"single","q":"一个医疗保健 RAG 系统需要处理患者记录，并严格符合 HIPAA 合规要求。哪种数据处理方法确保合规？","o":[{"l":"A","t":"本地处理，通过加密传输到 Bedrock"},{"l":"B","t":"在专用 VPC 中使用 AWS PrivateLink 连接 Bedrock，并进行静态加密"},{"l":"C","t":"处理前进行数据匿名化，并维护审计追踪"},{"l":"D","t":"混合方案：仅在本地处理敏感数据"}],"a":["B"],"e":"**正确答案：B。** 在专有 VPC 内通过 AWS PrivateLink 访问 Amazon Bedrock，并对静态数据做加密（encryption at rest）。\n\n**为什么对：** 三条都落在合规硬要求上。PrivateLink 让流量走 AWS 内网，不经公网；VPC 做网络隔离；静态加密覆盖存储层。这是 AWS 上做 HIPAA 场景的标准网络加加密组合。\n\n**其他选项为什么错：**\n- A. 本地处理 + 加密传输到 Bedrock：数据最终还是要送到 Bedrock 做推理，本地处理改变不了这一点，而且\"加密传输\"只覆盖传输这一段。\n- C. 处理前匿名化 + 审计追踪：匿名化是数据侧手段，没解决传输和存储的隔离；去标识化后的数据也仍存在被重识别的可能。\n- D. 混合方案只在本地处理敏感数据：等于放弃用 Bedrock 处理核心数据，跟题干\"用 RAG 处理患者记录\"的目标冲突。","s":"源#9"},{"id":"D1-010","d":1,"t":"single","q":"你正在为多租户 SaaS 应用实现 RAG。每个租户需要隔离的数据访问。哪种架构提供安全的租户隔离？","o":[{"l":"A","t":"单一 Knowledge Base，配合租户特定元数据过滤"},{"l":"B","t":"每个租户独立的 Knowledge Base，配合 IAM 访问控制"},{"l":"C","t":"共享 Knowledge Base，应用层访问控制"},{"l":"D","t":"租户特定 S3 桶，配合统一 Knowledge Base 和行级安全"}],"a":["B"],"e":"**正确答案：B。** 每个租户一套独立的 Amazon Bedrock Knowledge Bases（Bedrock 知识库），用 AWS IAM 做访问控制。\n\n**为什么对：** 隔离强度上，一个租户一套资源再加 IAM 策略，是从基础设施层切断跨租户访问——A 租户的凭证根本拿不到 B 租户的数据，不依赖应用代码写对。\n\n**其他选项为什么错：**\n- A. 单一知识库 + 租户元数据过滤：过滤在应用层做，条件写错或漏写一次就是越权，隔离完全依赖代码正确性。\n- C. 共享知识库 + 应用层访问控制：同上，而且连元数据这一层强制边界都没有，风险比 A 更高。\n- D. 租户独立 S3 桶 + 统一知识库 + 行级安全：桶分开了但知识库是统一的，检索时仍靠行级规则区分，隔离点还是在应用层。","s":"源#10"},{"id":"D1-011","d":1,"t":"single","q":"你的向量数据库在对超过 1 亿个嵌入进行相似性搜索时性能下降。哪种优化策略最有效？","o":[{"l":"A","t":"实现分层可导航小世界（HNSW）索引"},{"l":"B","t":"使用乘积量化降低嵌入维度"},{"l":"C","t":"按内容类型分区向量，并行执行搜索"},{"l":"D","t":"实现局部敏感哈希（LSH）进行近似搜索"}],"a":["A"],"e":"**正确答案：A。** 换成 HNSW（Hierarchical Navigable Small World，分层可导航小世界）索引。\n\n**为什么对：** HNSW 用多层近邻图做导航，检索时只在图上做局部遍历，复杂度接近对数级。亿级向量下仍能保持高召回和毫秒级响应，是大规模向量检索的主流索引类型。\n\n**其他选项为什么错：**\n- B. 乘积量化（PQ）降维：PQ 是压缩向量的手段，主要省内存和带宽，代价是精度损失，本身不改善检索速度的量级。\n- C. 按内容类型分区并行搜索：要求查询能预先确定落在哪个分区，而且分区数据不均时收益很不稳定，通用性差。\n- D. 局部敏感哈希（LSH）：同为近似检索方案，但在需要高召回的区间里，HNSW 的速度与精度平衡明显更好。","s":"源#11"},{"id":"D1-012","d":1,"t":"single","q":"一个 RAG 系统需要同时支持语义搜索和关键词搜索，并融合结果。哪种实现提供最佳相关性？","o":[{"l":"A","t":"独立的向量和关键词索引，加权组合得分"},{"l":"B","t":"同时编码语义和词法信息的混合嵌入"},{"l":"C","t":"并行搜索，基于机器学习进行结果排序"},{"l":"D","t":"顺序搜索，按关键词相关性过滤语义结果"}],"a":["A"],"e":"**正确答案：A。** 语义走向量索引、关键词走全文索引，两路结果的排名做加权合并，典型做法是 RRF（Reciprocal Rank Fusion，倒数排名融合）。\n\n**为什么对：** 两种检索的分数不在同一量纲，直接相加没有意义，用排名融合才合理；两路索引还能各自独立调优，语义侧换模型、关键词侧调分词互不影响。\n\n**其他选项为什么错：**\n- B. 混合嵌入同时编码语义和词法信息：这类模型确实存在，但把两种信号压进同一个向量后权重不可调，做不到题干要求的\"融合结果\"。\n- C. 并行搜索 + 机器学习重排序：等于引入一个需要训练和持续维护的排序模型，成本高，也不是必须的。\n- D. 顺序搜索、先语义后关键词过滤：第二路是在第一路结果上做减法，会漏掉那些语义不近但关键词精确命中的文档。","s":"源#12"}],"sections":[{"h":"分析需求并设计 GenAI 解决方案","body":"这一域讲的是「把 GenAI 应用搭起来」的地基工作，从需求分析一路到提示词治理，中间穿过模型选型、数据处理、向量存储、检索机制四道关口。\n\n**为什么它权重最高？** 因为 GenAI 应用出问题，绝大多数时候不是败在算法上，而是败在这一域的六件事里的某一件。典型的是这四类：模型选错了、喂进去的数据没洗、向量库检索不出正确内容、提示词没人管。域 2（实施与集成）和域 3（安全与治理）都是在这层地基上盖的楼——地基歪了，上面怎么修都没用。所以官方把将近三分之一的分数押在这里。\n\n**它和 AIF-C01（基础级）的根本差别在哪？** AIF 会问「RAG 是什么」，答出定义就能得分；AIP 不会这么问。AIP 的问法是「给定这样一个业务场景，你的 RAG 架构该怎么设计，为什么这么设计，代价是什么」。也就是说，这一域**不满足于你认识这些组件，它要你能做技术决策**。同一个技术点，能说出「它是什么」只够答对干扰项，能说出「什么时候该用它、什么时候不该」才够答对正确项。\n\n**学这一域时建议抓住一条主线**：把每个知识点都往「我会怎么选」上靠。看到一个服务或技术，习惯性地问自己三句话——它解决什么问题？什么场景该用它？用它要付出什么代价？这三问，正是本域最高频的考法。\n\n> 📌 **本域内部还有一个学习顺序建议**：先看「分析需求与方案设计」（1.1），再看「模型选择与配置」（1.2）。然后从「数据处理管道」（1.3）到「向量存储」（1.4）再到「检索机制」（1.5），是一条数据流线：数据进来 → 存进向量库 → 被检索出来。最后是「提示工程与治理」（1.6），处理交互层。按这个顺序读，后面的任务会不断用到前面的概念。\n\n#### 本节定位\n本节对应考纲任务声明 1.1「分析需求并设计 GenAI 解决方案」。\n\n> 官方原名：Analyze requirements and design GenAI solutions.\n\n这个任务考的是动手之前的功夫——把问题想清楚再写代码。三个技能点对应三个层次：整体怎么设计、怎么小步验证、怎么沉淀成可复用的东西。\n\n#### 创建与特定业务需求和技术约束相匹配的全面架构设计\n\n**这条在问什么。** 官方给的三个例子（合适的基础模型、集成模式、部署策略）其实就是架构设计必须回答的三个问题：\n\n**用哪个模型？** —— 不是「哪个最强」，而是「哪个最匹配这个任务」。任务类型（摘要、对话、代码生成、分类）、成本预算、延迟要求、语言支持，四项一起看。\n**模型怎么接进业务流？** —— 这条决定了后面一半的工作量。常见的集成模式有四种：\n   - **提示工程**：最简单，只改输入。\n   - **RAG**（检索增强生成）：让模型能读到你的私有资料。\n   - **智能体（Agent）**：让模型能自己调工具、分步完成任务。\n   - **微调（Fine-tuning）**：拿你的数据改造模型的「脾气」。\n\n选择依据看三条：\n\n   - 知识要不要更新得快——要就选 RAG。\n   - 任务要不要多步推理和调用外部系统——要就选 Agent。\n   - 模型的输出风格和领域术语要不要高度统一——要就选微调。\n\n**模型跑在哪里？** —— 托管 API（如 Amazon Bedrock）还是自建端点（如 SageMaker AI）。托管省事、按量付费、无需运维；自建可控、可深度定制、但你要管 GPU 和扩缩容。\n\n**取舍判断（这是考试最容易出题的地方）。** 这四种集成模式不是替代关系，而是**成本与复杂度的递进**：\n\n- 提示工程零额外基础设施，但模型对你的私有知识一无所知\n- RAG 增加一套向量存储和检索链路，换来「知识可更新、答案可溯源」\n- Agent 再增加工具定义和执行编排，换来「能办事而不只是会说话」\n- 微调最重，要先准备标注数据、跑训练、管版本，换来的是「风格稳定、指令跟随好」。\n\n考试里典型的问法是「某团队需要 XX，且希望最低成本/最快上线，应该选哪种」——**答案往往是把最轻的那层用足，而不是一上来就微调**。\n\n**关联服务**：Amazon Bedrock（快速验证集成模式）、Amazon SageMaker AI（自建端点与微调）、AWS Well-Architected Framework（架构评审基准）。\n\n#### 案例\n\n一家做设备维保的公司想把三千份维修手册变成「能问答的助手」。工程师提问「XX 型号液压泵异响，先查什么」。这里第一步不该是选模型，而是先判断集成模式——手册内容会更新（每月新增），且要求答案能指回具体手册页码，所以直接锁定 RAG，而不是微调；模型用托管 API 即可，没有自建 GPU 集群的必要。把这个判断写清楚，架构设计就完成了一半。\n\n#### 在进入全规模部署前，开发技术概念验证（POC）实现\n\n**这条在问什么。** POC（Proof of Concept，概念验证）是用最小代价回答「这条路走不走得通」。官方点出了它的三个验证目标：可行性、性能特征、业务价值。\n\n- **可行性**：模型能不能完成这个任务？给几段真实输入，看输出质量是否达到可用门槛。\n- **性能特征**：延迟多少？每千次调用花多少钱？并发上去以后会不会退化？\n- **业务价值**：省下的工时、提升的准确率，能不能折算成钱，值不值得投。\n\n**最容易做错的地方（也是考点）。** 很多人做 POC 用一堆人造的「漂亮样本」，跑出来效果很好，一上生产就崩。官方明确指向用 Amazon Bedrock 这类服务快速搭 POC，但**关键纪律是用真实数据、小规模**：几十条真实工单，比几百条编造的样本有价值得多。另一个纪律是**先定验收标准再做**——准确率要达到多少、延迟上限是多少、单次成本上限是多少，写下来，跑完对着表看，而不是跑完凭感觉说「好像还行」。\n\n**取舍判断。** POC 的时间投入要匹配决策风险：如果这个方案一旦选定就要投几十万，那 POC 值得做扎实；如果只是试一个内部小工具的提示词效果，做个把小时的就够了。**别把 POC 做成「小规模的生产系统」**——那是常见的时间黑洞。\n\n**关联服务**：Amazon Bedrock（最快路径拿到模型调用能力，无需自建基础设施）。\n\n#### 创建标准化技术组件，确保跨多个部署场景的一致实施\n\n**这条在问什么。** POC 跑通之后，如果每个项目都从头搭一遍，团队会陷入重复劳动，而且质量参差。这条要求的是把验证过的做法沉淀成**可复用的标准件**：统一的模型调用封装、统一的提示词模板结构、统一的日志与评测流程。\n\n官方点了两个工具：\n\n- **AWS Well-Architected Framework**：架构评审的六大支柱——卓越运营、安全性、可靠性、性能效率、成本优化、可持续性。\n- **AWS WA Tool 的 Generative AI Lens**：针对 GenAI 场景的补充检查项。比如「你有没有评估过模型的幻觉风险」「提示词有没有版本管理」。\n\n**为什么这条重要。** 它把「一个项目做成」升级成「组织能重复做成」。企业级考试喜欢考这种「从单点到规模化」的思维——因为真实的大公司确实会卡在这里：第一个 AI 应用做得挺好，第二个又要重新踩一遍坑。\n\n**取舍判断。** 标准化的时机很关键：**做成两三次之后再抽象，而不是第一次就设计一套框架**。一次性的经验抽取不出真正的共性，过早标准化反而会造出一套没人愿意用的「内部框架」。这条的考点往往落在「什么时候该沉淀」而不是「怎么沉淀」。\n\n**关联服务**：AWS Well-Architected Framework、AWS Well-Architected Tool（Generative AI Lens）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「选模型就看排行榜，挑最强的」 | 最强不等于最匹配 | 先看限制、再看能力、最后才比性能；成本敏感场景里，「够用且最便宜」往往才是答案 |\n| 「POC 用漂亮的样本跑一遍就行」 | 人造样本跑得好，一上生产就崩 | 用**真实数据、小规模**；几十条真实工单胜过几百条编造样本 |\n| 「POC 跑完再定验收标准」 | 跑完凭感觉说「好像还行」，无法判断 | **先写标准再跑**：准确率、延迟上限、单次成本上限，跑完对着表看 |\n| 「第一个项目就把框架设计出来」 | 一次性的经验抽不出共性，框架没人用 | **做成两三次之后再抽象** |\n| 「要让效果更好，先上微调」 | 微调最重，还有长期维护成本 | 先把最轻的那层用足：提示工程 → RAG → Agent，微调留到最后 |\n\n#### 记忆要点\n\n1. **集成模式四层递进**：提示工程 → RAG → Agent → 微调。成本与复杂度递增，**按需选最轻的一层**。\n2. **架构设计三问**：用哪个模型 / 怎么接进业务流 / 跑在哪。\n3. **POC 三条纪律**：真实数据、小规模、**先定验收标准**。\n4. **标准化时机**：做成两三次再抽象，不是第一次就搭框架。\n5. **模型选择顺序**：限制评估（否决）→ 能力分析（筛）→ 性能基准（择优）。\n\n---"},{"h":"选择并配置基础模型","body":"#### 本节定位\n本节对应考纲任务声明 1.2「选择并配置基础模型」。\n\n> 官方原名：Select and configure FMs.\n\n任务 1.1 定了「用什么模式」，任务 1.2 定「用哪个模型、怎么让它不容易挂」。四个技能点分别是：怎么选、怎么让换模型不改代码、怎么抗故障、怎么把定制模型管起来。\n\n#### 评估并选择基础模型\n\n**这条在问什么。** 官方给了三个评估维度：性能基准（performance benchmarks）、能力分析（capability analysis）、限制评估（limitation evaluation）。翻译成人话就是三张清单：\n\n| 维度 | 要问的问题 | 典型指标/考虑项 |\n|---|---|---|\n| **性能基准** | 这个模型在这个任务上表现如何？ | ROUGE / BLEU / BERTScore（自动评估指标）；更贴近实际的是「拿我的测试集跑分」 |\n| **能力分析** | 它支持我要的输入输出吗？ | 模态（文本/图像/音频/视频）、语言支持、上下文窗口大小 |\n| **限制评估** | 用它有什么硬约束？ | 合规与数据驻留要求、成本、延迟、可用区域 |\n\n**一个容易忽略的点**：这三个维度是**递进筛选**的关系，不是并列打分。先用「限制评估」做否决——如果数据不能出境，那这个模型再强也不能用；再用「能力分析」筛掉不支持的；最后才用「性能基准」在剩下的里面挑最好的。**先排除，再择优**，这个顺序能省掉大量无效对比。\n\n**关于自动指标要知道的一件事**：ROUGE、BLEU 这类指标衡量的是「生成文本和参考文本的字面重合度」。它对摘要类任务有用，但对开放式问答、创意生成就不太靠得住。所以实践中更看重「用自己业务数据构造的评测集 + 人工或 LLM 打分」。考试考的是你知不知道这些指标**用在哪、什么时候不够用**，而不是背公式。\n\n**关联服务**：Amazon Bedrock（模型目录与评测）、Amazon Bedrock Model Evaluations。\n\n#### 案例\n\n某团队要在「成本敏感、只做中文合同要素抽取」的场景选模型。按递进筛选走一遍：\n\n1. **限制评估**：合同是客户机密，必须走已签约的合规通道，排除了几个第三方直连选项。\n2. **能力分析**：任务只需文本输入、输出结构化字段，不需要多模态，上下文窗口要求不高。\n3. **性能基准**：在两个候选模型上跑 200 条历史合同，看字段抽取准确率。\n\n最后选中的可能不是「排行榜第一名」，而是准确率够用、单价最低的那个——这就是匹配，而不是最强。\n\n#### 创建灵活架构模式：让换模型不用改代码\n\n**先说它解决什么问题。** 你今年选了个模型跑得挺好，明年出了更便宜更好的；或者客户是受监管行业，要求数据必须走某个特定模型。如果代码里到处都是写死的模型标识（比如直接调 `invoke_model` 时把模型 ID 硬编码在几十个地方），换一次模型就意味着全局搜索替换、回归测试、重新上线。这条考的就是**怎么把模型选择从「写死在代码里」变成「改一个配置就生效」**。\n\n**官方给的三个组件分别管什么：**\n\n- **Amazon API Gateway** —— 统一入口。所有调用都先到这里，业务代码不直接连模型，而是连自己的网关。网关后面挂什么模型，业务代码不关心。\n- **AWS Lambda** —— 执行体。把「组装请求 → 调模型 → 处理响应」这段逻辑放进函数，换模型只改这个函数。\n- **AWS AppConfig** —— 配置中心。模型名、参数、路由规则存这里。运行时动态读取，**改配置不用重新部署代码**。\n\n**这就是所谓的「模型抽象层（Model Abstraction Layer）」**：所有调用走统一接口，模型成为一个可替换的实现细节。\n\n**取舍判断。**\n\n这层抽象不是白来的——多一个网关意味着多一跳延迟、多一份运维、多一处可能故障。\n\n所以：**预期会频繁换模型、或者要服务多个客户各用各的模型，就值得加这层；如果只是内部一个小工具、一年也不会换模型，硬编码反而更简单直接**。\n\n考试常在这里设陷阱：题目描述「团队需要快速支持新模型上线」，正确项是引入配置驱动的抽象层；但如果题目说「团队只有一个小型内部工具，追求最低复杂度」，那引入完整网关架构就是过度设计。\n\n**关联服务**：AWS Lambda、Amazon API Gateway、AWS AppConfig。\n\n#### 设计具备韧性的 AI 系统\n\n**这条在问什么。** 模型服务会不可用——区域故障、限流、模型临时下线，这些都会发生。韧性设计就是让「模型挂了」不等于「你的应用挂了」。官方点了四类手段：\n\n- **断路器模式（Circuit Breaker）**：用 AWS Step Functions 实现。当下游持续报错，自动「跳闸」停止继续调用，避免雪崩式重试把问题放大；过一段时间再放少量请求试探，恢复了就合闸。\n- **跨区域推理（Amazon Bedrock Cross-Region Inference）**：当某个模型在你所在区域没有部署，或者本区域容量紧张时，把请求路由到有容量的区域。这解决的是「模型区域可用性有限」这个很现实的问题。\n- **跨区域模型部署**：主动在多个区域部署，主区域故障时切到备用区域。\n- **优雅降级（Graceful Degradation）**：模型完全不可用时，返回缓存结果、返回预设的兜底话术，或者退到一个更小更稳的模型——总之不让用户看到报错页。\n\n**一个必须理解的权衡**：跨区域推理会引入额外的网络延迟，而且要考虑数据合规——请求被路由到另一个区域处理，那个区域的数据法规你得能接受。**韧性和合规、延迟、成本之间是要权衡的**，不是无脑开满。\n\n**关联服务**：AWS Step Functions（断路器编排）、Amazon Bedrock（Cross-Region Inference）、AWS Lambda。\n\n#### 案例\n\n某电商把 GenAI 用在商品问答上，大促当天流量翻十倍。没有韧性设计的版本会在模型限流时大面积报错，用户看到的是空白页；有韧性设计的版本会这样表现：\n\n- 主区域限流 → 自动路由到备用区域\n- 备用区域也满 → 返回该商品的高频问答缓存\n- 缓存没有 → 回退到「这个问题我暂时答不上来，帮你转人工」。\n\n**用户感受到的是「稍微慢一点」，而不是「坏了」**。\n\n#### 实施 FM 定制化部署与生命周期管理\n\n**这条在问什么。** 有些场景必须用「改造过的模型」——比如要让它稳定输出某个行业的术语体系，或者跟随特定的回复格式。这条覆盖从「怎么改造」到「改造完怎么管」的全过程。\n\n**先分清两种改造思路（这是本节最容易混的地方）：**\n\n- **微调（Fine-tuning）**：拿标注数据继续训练模型参数。效果好，但要数据、要算力、要重训。\n- **参数高效适配（PEFT）**：不动原模型大部分参数，只训练一小块附加结构。官网点名的 **LoRA（Low-Rank Adaptation，低秩适配）** 和 **适配器（Adapters）** 都是这一类。\n\n**为什么 PEFT 是主流做法？** 因为它把「定制」的成本降了一个数量级。\n\n要训练的参数量可能只有全量微调的千分之一到百分之一，所以更快、更便宜。而且**一个基础模型可以挂载多个适配器**——服务不同客户时切换适配器即可，不用为每个客户存一份完整模型。代价是效果上限通常不如全量微调。\n\n**模型管起来的部分（生命周期管理）**，官方点了几件事：用 **SageMaker Model Registry（模型注册表）** 管版本、用自动化管道做部署更新、准备**回滚策略**、以及**退役与替换**机制。\n\n**这几件事为什么被单独列出来考？** 因为「模型更新」在生产环境是个高风险动作。新版本可能在某些输入上表现更差，而你未必立刻发现。所以标准做法是：新版本先小流量灰度（canary）→ 观察指标 → 逐步放量 → 出问题能一键回滚到上一个版本。**没有回滚能力的模型更新，等于在走钢丝。**\n\n**取舍判断。** 什么时候值得定制模型？只有当「提示工程 + RAG 都用足了还是达不到要求」时才考虑。因为微调有长期维护成本——基础模型换代，你的微调版本可能就要重做。**先用最轻的手段，把定制留到确实需要的时候**。\n\n**关联服务**：Amazon SageMaker AI（模型部署与微调）、SageMaker Model Registry（版本管理）、Amazon Bedrock（自定义模型与托管）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「三个评估维度是并列打分」 | 顺序错了会做大量无效对比 | 是**递进筛选**：限制（否决）→ 能力（筛）→ 性能（择优），**先排除再择优** |\n| 「ROUGE/BLEU 分高就是好模型」 | 这类指标衡量的是字面重合度 | 对摘要有用，对开放式问答、创意生成不可靠；实践中更看重自家评测集 |\n| 「模型 ID 硬编码在代码里没什么问题」 | 换模型要全局搜索替换加回归测试 | 预期频繁换模型就上**模型抽象层**（API Gateway + Lambda + AppConfig） |\n| 「模型强就行，不用管区域可用性」 | 模型可能在你所在区域没有部署 | 用**跨区域推理**，但要权衡延迟与数据合规 |\n| 「新模型版本直接替换上线」 | 新版本可能在某些输入上更差，且不易察觉 | 必须走**灰度 → 观察 → 放量 → 可回滚** |\n\n#### 记忆要点\n\n1. **选择三维递进**：限制评估 → 能力分析 → 性能基准。\n2. **换模型不改代码**＝模型抽象层：API Gateway（统一入口）+ Lambda（执行体）+ AppConfig（配置中心）。\n3. **韧性四手段**：断路器 / 跨区域推理 / 多区域部署 / 优雅降级。韧性与合规、延迟、成本要**权衡**。\n4. **定制手段**：微调 vs PEFT（LoRA / Adapters）。**先用最轻的手段**，把定制留到确实需要时。\n5. **模型生命周期**：版本管理 + 灰度 + **回滚能力**——没有回滚的模型更新等于走钢丝。\n\n---"},{"h":"实施供 FM 使用的数据验证与处理管道","body":"#### 本节定位\n本节对应考纲任务声明 1.3「实施供 FM 使用的数据验证与处理管道」。\n\n> 官方原名：Implement data validation and processing pipelines for FM consumption.\n\n模型再好，喂进去的数据不对，输出就是错的。这个任务讲「数据从原始形态变成模型能吃的形态」这中间要做哪些事：验证、处理多模态、格式化、提质。\n\n#### 创建全面的数据验证工作流\n\n**这条在问什么。** 在数据进入模型之前，先确认它「合格」——完整、格式正确、没有明显缺失和异常。\n\n官方给了几个层次的手段：\n\n- **AWS Glue Data Quality**：在数据管道里内建质量规则和监控。\n- **SageMaker Data Wrangler**：可视化数据准备与探查。\n- **自定义 Lambda 函数**：写自己的校验逻辑。\n- **CloudWatch 指标**：把质量指标当监控项持续盯。\n\n**为什么不能跳过这一步。** 模型不会告诉你「你给的数据有问题」，它只会照着有问题的数据给出看起来很正常的错误答案。这类错误比报错更危险——**报错你能发现，静默的错误输出可能要等业务方投诉才知道**。所以数据验证的价值是把问题挡在进入模型之前。\n\n**实践中要建立的观念**：验证规则要能回答「什么算合格」。比如知识库文档，合格的定义可能包括：文件能解析出正文（不是扫描图片且没 OCR）、字符数不为零、语言符合预期、没有大量乱码。这些规则写下来、自动化跑，比人工抽查可靠。\n\n**关联服务**：AWS Glue Data Quality、SageMaker Data Wrangler、AWS Lambda、Amazon CloudWatch。\n\n#### 案例\n\n某公司把两千份历史项目文档灌进知识库做「项目经验助手」。上线后有人问「XX 项目的验收标准是什么」，助手回答得像模像样，但引用的是**另一份文档里的表格碎片**。\n\n排查后发现问题出在入库环节。\n\n其中三百多份是扫描件，OCR 识别质量参差，产生了大量乱码和错行。\n\n这些脏数据被照常切分、照常转向量，检索时依然「语义相近」被命中，于是模型拿一段乱码当依据编出了答案。\n\n**如果入库前跑一遍数据验证（能解析出正文吗？字符数正常吗？乱码比例是否超阈值？），这三百份会在进库前就被拦下，而不是在用户用了两个月之后才被发现。**\n\n这就是数据验证最实际的价值——它拦掉的不是报错，是那种「看起来一切正常」的慢性错误。\n\n#### 创建处理复杂数据类型的数据处理工作流\n\n**这条在问什么。** GenAI 应用的数据往往不止文本——还有图像、音频、表格。这些类型各有各的处理要求：音频要先转成文本、图像要么被多模态模型直接处理、要么先做描述提取，表格需要结构化解析。\n\n官方给的组件：**Amazon Bedrock 多模态模型**（直接接受图文混排输入）、**SageMaker Processing**（批量数据预处理作业）、**AWS Transcribe**（语音转文字）。\n\n**一个实务判断**：多模态处理有两个思路。\n\n- **原生多模态**：把图片直接交给支持视觉的模型。链路短、语义保留好，但成本高、模型选择受限。\n- **先转换再处理**：先用 OCR 或语音转写把非文本变成文本，再走纯文本链路。链路长、可能丢失视觉信息，但便宜、可复用现有的文本处理链路。**考试常在这里给场景问选择**：如果文档里有大量图表需要理解，原生多模态更合适；如果只是把扫描合同变成可检索文本，OCR 转写就够了。\n\n**关联服务**：Amazon Bedrock（多模态模型）、SageMaker Processing、AWS Transcribe。\n\n#### 按模型特定要求格式化输入数据\n\n**这条在问什么。** 不同的调用方式要求不同的输入格式，格式不对就是直接报错。官方列了三种典型：**Amazon Bedrock API 请求用 JSON**、**SageMaker AI 端点要结构化数据准备**、**对话类应用要用多轮对话格式（用户/助手消息序列）**。\n\n**这里有一个特别值得记住的点**：对话格式看起来简单（不就是按顺序排消息吗），但它在生产里很容易出问题。\n\n- **长度怎么算**：算所有历史消息的总和，还是只算最新一条？\n- **历史怎么截断**：截掉最早的那些，会不会丢掉关键上下文？\n- **角色怎么标记**：哪些是用户说的，哪些是模型说的？\n\n这些细节在「上下文窗口溢出诊断」（5.2.1）还会再考一次。\n\n**关联服务**：Amazon Bedrock、Amazon SageMaker AI。\n\n#### 提升输入数据质量，以改善 FM 响应的质量与一致性\n\n**这条和上一节「创建全面的数据验证工作流」的区别在哪？** 上一节是「筛掉不合格的」，这一节是「把合格的变得更适合模型理解」。前者是守门，后者是加工。\n\n官方给的手段有三条：\n\n- **用 Amazon Bedrock 重新格式化文本**：把冗长的原始文本整理成清晰的结构。\n- **用 Amazon Comprehend 抽取实体**：把散落在文本里的关键信息抽成结构化字段。\n- **用 Lambda 函数做数据规范化**：统一日期格式、统一大小写、去掉多余空白。\n\n**为什么这能提升响应质量？** 因为模型对输入的「整洁度」很敏感。同一份内容，一段满是页眉页脚和乱换行的 PDF 提取文本，和一段清理干净的正文，模型给出的答案质量差距明显。这不是玄学——噪声会占用宝贵的上下文窗口，也会干扰模型判断哪部分是重点。\n\n**取舍判断。** 数据加工有成本，要判断加工到什么程度。经验法则是：**影响到模型理解的加工要做（去噪、分句、统一编码），纯美学层面的加工可以不做**。过度加工反而可能丢掉对任务有用的信息（比如把表格拍扁成流水文本，结构信息就没了）。\n\n**关联服务**：Amazon Bedrock、Amazon Comprehend、AWS Lambda。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「数据有问题模型会报错」 | 模型不报错，它会照着脏数据给出看起来正常的错答案 | **静默的错误比报错更危险**——验证的价值就是把问题挡在进模型之前 |\n| 「扫描件和普通文档一样入库」 | OCR 质量参差，乱码会被当正文切分、转向量 | 入库前跑数据验证：能解析正文吗？字符数正常吗？乱码比例超阈值吗？ |\n| 「多模态一律先转成文本」 | 有大量图表要理解时，转文本会丢视觉信息 | 图表理解 → 原生多模态；扫描件转可检索文本 → OCR 就够 |\n| 「对话历史全塞给模型」 | 上下文窗口有限且昂贵 | 保留最近几轮加关键早期信息，中间的摘要压缩 |\n| 「数据加工越彻底越好」 | 过度加工会丢掉对任务有用的结构信息 | **影响模型理解的加工要做，纯美学层面的可以不做** |\n\n#### 记忆要点\n\n1. **数据验证的价值**：把问题挡在进入模型之前。模型不会报错，只会静默答错。\n2. **验证规则要能回答「什么算合格」**，并且自动化跑，不靠人工抽查。\n3. **多模态两条路**：原生多模态（链路短、贵、模型受限）vs 先转换再处理（便宜、可能丢视觉信息）。\n4. **对话格式三个坑**：长度怎么算 / 历史怎么截 / 角色怎么标。\n5. **加工原则**：影响理解的做，纯美学的省。\n\n---"},{"h":"设计和实施向量存储解决方案","body":"#### 本节定位\n本节对应考纲任务声明 1.4「设计和实施向量存储解决方案」。\n\n> 官方原名：Design and implement vector store solutions.\n\n任务 1.3 把数据整理成了模型能吃的形态，但这个任务的产物——**向量**——需要一个专门的地方存起来，并且能被高效地找回来。这就是向量存储（vector store）要解决的事。五个技能点从「怎么设计架构」一路走到「怎么让它不过期」。\n\n#### 为 FM 增强创建高级向量数据库架构\n\n**这条在问什么。** 传统搜索按关键词匹配：你搜「液压泵异响」，它只去找含这几个字的文档。语义检索找的是「意思相近」的内容：你问「液压泵有怪声」，它能把写着「噪声异常」的段落也翻出来。要做到这一点，就得先把文本转成向量（一串数字），再存进专门的数据库做近邻查找。\n\n**这条的考点在「架构怎么选」，不在「会用某个库」。** 官方给的四个例子正好代表四种典型架构：\n\n| 架构 | 组成 | 适用情形 |\n|---|---|---|\n| **托管知识库** | Amazon Bedrock Knowledge Bases | 快速上线、不想自己管索引（可做主题分层组织） |\n| **搜索引擎兼做向量库** | Amazon OpenSearch Service + Neural 插件 | 已有搜索集群，或需要按主题分片 |\n| **关系库 + 对象存储** | Amazon RDS + Amazon S3 文档库 | 团队已有关系库运维经验，数据量中等 |\n| **NoSQL 存元数据 + 向量库** | Amazon DynamoDB + 向量数据库 | 元数据查询频繁，要按属性做精细过滤 |\n\n**取舍判断。** 选择的依据不是「哪个最强」，而是**团队现有能力和数据规模**：团队没有搜索集群运维经验，托管方案省下的是长期运维成本；已有 OpenSearch 集群，复用它通常比新建一套划算。考试里，题目强调「尽快上线、尽量减少运维」，指向托管方案；强调「对已有搜索基础设施做最小改动」，指向 OpenSearch + Neural 插件。\n\n**关联服务**：Amazon Bedrock Knowledge Bases、Amazon OpenSearch Service、Amazon RDS、Amazon S3、Amazon DynamoDB。\n\n#### 构建元数据框架以提升检索精度与上下文感知\n\n**这条在问什么。** 光有向量还不够。同样一句「保修政策是什么」，你希望它优先返回**当前有效**的那份，而不是 2019 年的旧版。元数据（metadata）就是贴在每段内容上的「标签」，让检索能带上条件。\n\n官方给的三个例子很典型：**S3 对象元数据记时间戳**、**自定义属性记作者信息**、**标签体系做领域分类**。\n\n**为什么这能提升精度。** 向量相似度算的是「意思像不像」，它不知道哪份更新、哪份更权威。带上元数据之后，检索可以做**预过滤**：先按「部门=法务 且 年份≥2025」缩小范围，再在范围内做语义匹配。这比「先搜出一堆再人工挑」要准得多，也快得多。\n\n**一个实务判断**：元数据要在**入库的时候就打上**，不能等检索时再补——因为检索时手上只有向量和原文，很多属性已经无从判断了。所以数据管道（1.3）里就该包含「抽取并写入元数据」这一步。\n\n**关联服务**：Amazon S3（对象元数据）、Amazon OpenSearch Service（过滤查询）、Amazon DynamoDB（属性存储）。\n\n#### 案例\n\n某公司的知识库里有三个版本的《差旅报销标准》（2022、2024、2026）。员工问「出差住宿标准是多少」，纯向量检索很可能把三个版本混杂返回，模型据此整合出一个中间值——听起来合理，其实错误。加上元数据（生效年份、状态）后，检索层先过滤出「状态=现行」，再语义匹配，返回的就是唯一正确的那份。**这就是元数据最实在的价值：让「哪份算数」在检索层就解决掉，而不是交给模型去猜。**\n\n#### 实施高性能向量数据库架构以优化大规模语义搜索\n\n**这条和「创建高级向量数据库架构」的区别在哪？** 前一节是「选哪种架构」，这一节是「架构定了之后，怎么让它在大规模下不慢」。数据量从十万条涨到一亿条，检索的代价会完全不同。\n\n官方点了三类手段：**OpenSearch 分片策略（sharding）**、**多索引架构（multi-index）**、**分层索引（hierarchical indexing）**。\n\n- **分片**：把一个大索引切成多片分布到不同节点，查询并行执行。分片数要提前规划——分太少单分片过大，分太多则每次查询要等的分片数变多。\n- **多索引**：按领域把数据拆成多个独立索引，查询时只打相关的那个。比如「产品手册」和「人事制度」分属两个索引，问报销就去人事索引，不必在整个大库里搜。\n- **分层索引**：先粗后细——先在一层「摘要向量」里定位大致范围，再进具体分片精查。这是拿少量精度换大量速度的经典做法。\n\n**取舍判断。** 三种手段都在**用复杂度换性能**：分片要规划容量、多索引要维护路由、分层索引要多养一层。所以判据是**数据规模和延迟要求**：万级数据不需要这些；到百万级以上、又要求毫秒级响应，才成为必需。考试里若题目没提规模问题，答案通常不该是「引入复杂索引架构」。\n\n**关联服务**：Amazon OpenSearch Service（分片与索引策略）、Amazon Aurora（pgvector 索引）。\n\n#### 使用 AWS 服务创建集成组件以连接各类资源\n\n**这条在问什么。** 向量库里的数据不是凭空来的——它来自公司已有的各种系统：文档管理系统、知识库、内部 wiki。这条考的是**怎么把这些散落的数据源接进来**，让它们能持续供给 GenAI 应用。\n\n**为什么单独列一条。** 因为在真实项目里，这一步的工作量常被严重低估。\n\n纸面上是「把文档导进来」，实际要做的事包括：定位数据源、拿到访问凭证、处理各种格式、建立增量机制，还要处理权限。**有些文档不是所有人都能看的，检索层必须继承原有的权限体系**，否则 GenAI 会变成一个越权信息泄露的入口。\n\n**取舍判断。** 集成方式有两种：**批量导入**（一次性灌存量数据，简单但会过期）和**增量同步连接器**（持续跟随源系统变化，复杂但保持新鲜）。知识更新慢（如制度文件），批量导入 + 定期重跑就够；工单、案例库这类每天都在变的内容，就必须做增量同步——这正是「设计并部署数据维护系统」（1.4.5）要解决的。\n\n**关联服务**：Amazon Bedrock Knowledge Bases（数据源连接器）、AWS Lambda（自定义拉取逻辑）、Amazon S3（中转存储）。\n\n#### 设计并部署数据维护系统，确保向量存储信息始终最新\n\n**这条在问什么。** 上一条解决「怎么进来」，这条解决「进来之后怎么不变馊」。知识库最常见的失败方式不是搭不起来，而是**搭起来之后没人维护，三个月后里面全是过期内容，用户问两次发现答得不对，就再也不用了**。\n\n官方给了四种机制，按「数据变化的时效要求」选：\n\n| 机制 | 时效 | 成本 | 适用 |\n|---|---|---|---|\n| **定时刷新管道** | 小时~天级 | 最低 | 制度文件、产品手册 |\n| **增量更新** | 分钟~小时级 | 中 | 大多数业务文档 |\n| **自动同步工作流** | 事件驱动，近实时 | 较高 | 与源系统强关联的内容 |\n| **实时变更检测** | 秒级 | 最高 | 价格、库存这类高频变更数据 |\n\n**一个必须处理的细节：删除。** 源系统里删掉的文档，向量库里的对应向量也必须删，否则模型还会引用一份已经不存在的材料。删除同步常被漏做，是这类系统的典型隐患。\n\n**关联服务**：AWS Lambda、Amazon EventBridge（事件触发）、AWS Step Functions（同步编排）、Amazon S3（变更事件源）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「向量库就该用专门的，上 OpenSearch」 | 团队没有搜索运维经验，学一套集群运维就是净成本 | 按**团队现有能力加数据规模**选；有 PG 背景时 pgvector 往往更快上线 |\n| 「元数据等检索时再补」 | 检索时手上只有向量和原文，很多属性已无从判断 | 元数据必须**在入库时打上**，写进数据管道 |\n| 「数据量大就上分片和多索引」 | 万级数据不需要，上了只是增加复杂度 | 分片 / 多索引 / 分层索引**到百万级以上、又要毫秒响应**才成必需 |\n| 「导入一次就完事」 | 知识会过期，用户问两次发现答错就再也不用了 | 要有维护机制，**尤其别漏「删除同步」** |\n| 「权限在应用层管就行」 | 检索层不继承原权限，GenAI 就成了越权泄露入口 | 检索层必须**继承原有的权限体系** |\n\n#### 记忆要点\n\n1. **四种向量库架构**按「团队能力 + 数据规模」选，不是按技术先进程度选。\n2. **元数据要在入库时打**——预过滤（部门、年份、状态）靠它。\n3. **规模优化手段**（分片 / 多索引 / 分层索引）**只在百万级以上才必需**。\n4. **集成两方式**：批量导入（简单、会过期）vs 增量同步（复杂、保鲜）。按知识更新速度选。\n5. **维护四机制**按数据变化时效选（小时级到秒级）；**删除同步最容易被漏做**。\n\n---"},{"h":"设计面向 FM 增强的检索机制","body":"#### 本节定位\n本节对应考纲任务声明 1.5「设计面向 FM 增强的检索机制」。\n\n> 官方原名：Design retrieval mechanisms for FM augmentation.\n\n数据存好了，接下来是「怎么把它准确地取出来」。这个任务从最基础的切分和嵌入讲起，一路走到混合检索、重排序和查询改写——**这六个技能点合起来，就是一套完整 RAG 检索链路的搭建指南**。\n\n#### 开发有效的文档分割方法\n\n**这条在问什么。** 一份 50 页的手册不能整篇塞给模型（上下文装不下，也不经济），必须切成小块（chunk），每块单独转向量。切法直接决定检索质量——**切得不好，就会「明明有这段内容却搜不出来」**。\n\n官方给了三种切法：\n\n| 切法 | 做法 | 特点 |\n|---|---|---|\n| **固定长度切分** | 按固定字数/Token 数硬切（用 Lambda 实现） | 实现最简单；但可能在句子中间切断，语义被割裂 |\n| **Bedrock 内置切分** | 用 Amazon Bedrock 的切分能力 | 省事，适合快速上线；可调空间有限 |\n| **按内容结构分层切分** | 识别标题、章节等结构，按语义单元切（自定义处理） | 效果最好；要针对文档格式做开发 |\n\n**关键概念：重叠（overlap）。** 固定切分时通常让相邻块**重叠一小段**（比如块长 500 字、重叠 50 字），防止一个完整的句子被切断后两边都读不通。这是很实用的经验做法。\n\n**取舍判断。** 切分粒度是个双向权衡：**块太大**，一块里混着多个主题，检索命中后给模型的是一大段废话，还挤占上下文；**块太小**，一块里信息不完整，模型看不全，答案会缺斤少两。经验起点是「一个块大致对应一个完整的论述单元」。**考试常考这个权衡，而不是让你背具体数值。**\n\n**关联服务**：Amazon Bedrock（内置切分能力）、AWS Lambda（自定义切分逻辑）。\n\n#### 选择并配置最优的嵌入方案\n\n**这条在问什么。** 嵌入（embedding）就是「把文本变成向量」这个动作本身。这条考的是怎么选嵌入模型，以及怎么批量生成向量。\n\n官方给的三个方向：**按维度和领域匹配度选 Amazon Titan 嵌入模型**、**评估 Bedrock 各嵌入模型的性能特征**、**用 Lambda 批量生成向量**。\n\n**选嵌入模型看什么？** 两个容易被忽略的维度：\n\n- **维度（dimensionality）**：向量的长度。维度高，理论上能表达更细腻的语义差异，但存储和计算成本也同步上涨。**够用就好，不是越高越好**——很多场景 1024 维和 1536 维的实际效果差别，还比不上换一个更贴领域的模型明显。\n- **领域匹配度（domain fit）**：通用嵌入模型在通用语料上训练，遇到法律条文、医疗术语、行业黑话时，可能把两个完全不同意思的词判成相似。**有专业语料的场景，优先用在该领域表现更好的模型，或在自家数据上做过适配的模型**。\n\n**为什么要用 Lambda 批量生成？** 因为入库时往往是成千上万条文本要转向量。逐条同步调用会非常慢，必须并发批处理。这里有个实务约束：嵌入调用有速率限制，批量任务要处理限流重试，不能简单循环就完事。\n\n**取舍判断。** **一旦选定嵌入模型，全库的向量都要用它重新生成**——换模型意味着整个向量库重建。所以这个决策要在建库之前定，不能边跑边换。这也是为什么「用同一套嵌入模型覆盖整个知识库」是一条硬纪律。\n\n**关联服务**：Amazon Bedrock（嵌入模型）、Amazon Titan Embeddings、AWS Lambda（批量生成）。\n\n#### 部署并配置向量搜索方案\n\n**这条在问什么。** 向量存进去了，现在要让它能被搜。这条考的是三种部署形态的选择。\n\n官方给了三条路径：\n\n| 路径 | 特点 | 适用 |\n|---|---|---|\n| **Amazon OpenSearch Service**（向量搜索能力） | 功能强、可调项多 | 有搜索运维能力，需要细粒度调优 |\n| **Amazon Aurora + pgvector 扩展** | 复用已有的关系库，SQL 就能查 | 团队熟悉 PostgreSQL，向量是辅助需求 |\n| **Amazon Bedrock Knowledge Bases**（托管向量存储） | 全托管，不碰底层 | 快速上线，不想管索引运维 |\n\n**取舍判断。** 三者的差别本质是**「谁承担运维」**：托管方案把索引运维交给 AWS，代价是可调空间小；自建方案能精细调优，代价是你要有人盯集群。**考试里最常见的陷阱是「过度工程」**——题目描述一个内部小工具、数据量不大，正确项往往是托管方案；若题目明确说「已有 Aurora 集群和熟练的 DBA 团队」，那 pgvector 反而是最省成本的选择。\n\n**一个容易忽略的点**：pgvector 走的是「在关系库里顺手加向量能力」。\n\n它的强项是**向量检索和结构化条件能写在同一条 SQL 里**——比如「在这个部门、这个时间段、语义相近」一次查完。这在业务过滤条件复杂的场景反而比专用向量库更顺手。\n\n**关联服务**：Amazon OpenSearch Service、Amazon Aurora（pgvector）、Amazon Bedrock Knowledge Bases。\n\n#### 案例\n\n一家做 SaaS 的公司要加「文档问答」功能，数据量只有几万条，团队是清一色的后端工程师、没有搜索集群经验。如果按「向量库就该用专门的」这个直觉上 OpenSearch，团队要多学一套集群运维；而选 Aurora + pgvector，他们用熟悉的 SQL 就能把功能做出来，向量检索和租户隔离条件写在同一条查询里，反而更快上线。**这不是「哪个技术更先进」的问题，是「哪个更匹配这个团队」的问题。**\n\n#### 创建高级搜索架构以提升检索相关性与准确性\n\n**这条在问什么。** 基础向量检索有个众所周知的短板：**它在「找意思相近的内容」上很强，但在「精确匹配专有名词」上很弱**。比如零件编号 `HYD-3000-AB`，向量检索可能给你返回一堆「型号相近」的段落，却没有真正含这个编号的那条。这条考的就是怎么补救。\n\n官方给了三件武器：\n\n- **OpenSearch 语义搜索**：把语义检索能力接入常规搜索基础设施，统一管理。\n- **混合检索（hybrid search）**：**关键词检索 + 向量检索同时跑，再把两路结果融合**。关键词那路保证「编号、专名这类精确匹配不丢」，向量那路保证「近义表达也能召回」。**这是目前工业界最常用的做法，因为它同时补上了两边的短板。**\n- **Amazon Bedrock 重排序模型（reranker）**：初步检索往往一次召回几十条，不可能全给模型。重排序就是用更精细（也更慢、更贵）的模型给这几十条重新打分，把最相关的几条排到前面。**「粗检索多召回 + 精重排取前几条」是标准的两段式架构。**\n\n**取舍判断。** 这三样都是**用复杂度和成本换准确率**：混合检索要维护两套检索逻辑并调融合权重；重排序要多跑一次模型调用，增加延迟。所以判据是**业务对「答错」的容忍度**：客服、法务这类答错代价高的场景值得上；内部检索工具可以先不做。考试里若题目强调「商品编号、合同条款号这类精确信息必须准确命中」，正确项就是引入混合检索。\n\n**关联服务**：Amazon OpenSearch Service、Amazon Bedrock（重排序模型）。\n\n#### 开发精细的查询处理系统\n\n**这条在问什么。** 用户提的问题本身往往「不好搜」。要么太短（「报销」两个字，什么意图都看不出来），要么太复杂（一句话里塞了三个不同的问法）。这条考的是**在检索之前先加工用户的问题**。\n\n官方给了三种加工方式：\n\n| 方式 | 做法 | 解决什么问题 |\n|---|---|---|\n| **查询扩展（query expansion）** | 用 Amazon Bedrock 把问题改写成多个同义表达 | 用户用词和文档用词不一致（问「报销标准」、文档写「费用限额」） |\n| **查询分解（query decomposition）** | 用 Lambda 把复合问题拆成多个子问题 | 「A 和 B 的区别，以及 C 的情况下该用哪个」——一次检索答不全 |\n| **查询改写（query transformation）** | 用 Step Functions 编排多步改写流程 | 需要多轮加工（先补全指代，再扩展，再分解） |\n\n**「查询分解」在 RAG 里特别值得掌握。** 用户问「新员工报销标准和老员工有什么不同，出差和市内交通分别怎么算」，这是一个包含多个独立信息需求的问题。\n\n直接拿去检索，很可能只召回到一部分内容，模型就会用不完整的信息编出一个看似合理的答案。\n\n**正确做法是先拆成「新员工标准」「老员工标准」「出差标准」「市内交通标准」几个子问题，分别检索，再合并上下文交给模型。**\n\n这能明显减少「答一半漏一半」的情况。\n\n**取舍判断。** 每种加工都增加一次（或多次）模型调用，也就增加延迟和成本。**简单明确的问题不必要做加工**——「公司年假多少天」这种问题直接检索又快又准。所以实务上常见的做法是**按问题复杂度分流**：短而明确的问题走快速通道，长而复合的问题才做分解。\n\n**关联服务**：Amazon Bedrock（查询扩展）、AWS Lambda（查询分解）、AWS Step Functions（改写编排）。\n\n#### 创建一致的访问机制以实现与 FM 的无缝集成\n\n**这条在问什么。** 到这一步，检索链路本身已经能用了。最后这条解决的是**「怎么让模型方便地调用它」**——把检索能力包装成一个规范、统一的接口，让不同的应用都能用同一套方式访问。\n\n官方给了三个方向：**面向向量搜索的函数调用接口（function calling）**、**Model Context Protocol（MCP）客户端**、**标准化的检索增强 API 模式**。\n\n**这三者在说什么？** 本质是同一件事的三个层次：\n\n- **函数调用接口**：把「检索」定义成一个模型可以调用的工具。模型判断需要查资料时，自己发起调用，拿到结果再继续生成。这是 Agent 式 RAG 的基础。\n- **MCP 客户端**：Model Context Protocol 是一套标准协议，让模型能以统一方式接入外部数据源和工具。**它的价值在于「一次实现，多处复用」**——检索服务按 MCP 标准暴露，任何支持该协议的客户端都能接上，不用为每个应用单独写适配。\n- **标准化 API 模式**：把检索接口的参数、返回结构、错误约定统一起来，让多个应用、多个团队用同一套契约对接。\n\n**为什么「一致」被单独强调？** 因为在多应用环境里，**不统一的接口会带来重复建设和行为不一致**。\n\nA 团队写的检索接口返回带分数，B 团队的返回带高亮片段，模型拿到的上下文结构不同，最终答复质量就参差不齐。定一套契约，是把「碰运气」变成「可预期」。\n\n**取舍判断。** 接口标准化的投入要和「消费方数量」匹配：只有一个应用在用，直接写个函数最省事；有三个以上的应用、或者要对外开放，才值得投入做标准化接口和协议适配。**又一次回到「先有重复、再抽象」这条原则。**\n\n**关联服务**：Amazon Bedrock（函数调用）、Model Context Protocol（MCP）、AWS Lambda（检索服务封装）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「有了向量检索就够了」 | 向量检索对专有名词、编号的精确匹配很弱 | 精确信息必须命中时，用**混合检索**（关键词 + 向量） |\n| 「块切得越大信息越全」 | 一块混着多个主题，检索命中后给模型一大段废话 | 经验起点是「**一个块对应一个完整的论述单元**」 |\n| 「嵌入模型可以边跑边换」 | 换模型意味着整个向量库要重建 | **决策要在建库之前定**，全库统一一个嵌入模型 |\n| 「所有问题都值得做查询改写」 | 简单问题做改写只是白加一次调用和延迟 | **按问题复杂度分流**：短而明确的走快速通道 |\n| 「初次召回的结果直接给模型」 | 一次召回几十条，全给模型既贵又不准 | 标准架构是**粗召回 + 精重排**，只把最相关的几条给模型 |\n\n#### 记忆要点\n\n1. **切分权衡**：太大混主题、挤上下文；太小信息不全。**经验起点＝一个完整论述单元**。\n2. **重叠（overlap）**：相邻块重叠一小段，防止完整句子被切断。\n3. **嵌入模型一旦选定，全库都要重建**——所以要在建库前定，且全库统一。\n4. **混合检索补专名短板，重排序取前几条**（粗召回 + 精重排）。\n5. **访问接口标准化**按「消费方数量」决定：一个应用直接写函数，三个以上才值得定契约。\n\n---"},{"h":"实施提示工程策略与治理","body":"#### 本节定位\n本节对应考纲任务声明 1.6「实施提示工程策略与治理」。\n\n> 官方原名：Implement prompt engineering strategies and governance for FM interactions.\n\n这是域 1 的最后一个任务，也是**离「应用题」最近的一个**。前面五个任务搭好了数据链路，这个任务解决的是「怎么跟模型说话，以及怎么管住这些说话方式」。六个技能点分两部分：前三个偏「怎么做 + 怎么管」，后三个偏「怎么越做越好」。\n\n#### 创建有效的模型指令框架\n\n**这条在问什么。** 提示词不是随便写一句话丢给模型——企业环境里它是一件需要设计的东西。这条考的是**用结构化的方式定义模型该扮演什么角色、遵守什么边界、输出什么格式**。\n\n官方给了三个组件：\n\n| 组件 | 作用 |\n|---|---|\n| **Amazon Bedrock Prompt Management**（角色定义） | 把「你是一个 XX 助手」这类指令集中管理，而不是散落在代码里 |\n| **Amazon Bedrock Guardrails** | 强制执行负责任 AI 的边界——过滤有害内容、拦截敏感信息、阻止越界话题 |\n| **模板配置** | 规定输出的格式（JSON、表格、固定字段），让下游系统能稳定解析 |\n\n**为什么要把「角色定义」和「输出格式」分开管？** 因为它们的变化频率不同：**角色设定可能半年不变，输出格式却常因下游系统调整而改**。混在一段大提示词里，改一处就要整体重测；分开管理，改动范围可控。这是很实际的工程考量。\n\n**关于 Guardrails 要理解的一点**：它和「提示词里写一句『请不要输出敏感信息』」有本质区别。写在提示词里是**请求**，模型可能不遵守；Guardrails 是在模型输出之后**独立执行**的检查层，拦得住。**安全要求高的场景，不能只靠提示词里的君子协定。**\n\n**取舍判断。** Guardrails 会增加延迟，也可能误拦（把正常内容判定为敏感）。所以它的规则要按场景调：面向公众的应用要严，内部工具可以放宽。**这也是考试的一个常见判断点——不是「有安全需求就无脑开最严」。**\n\n**关联服务**：Amazon Bedrock Prompt Management、Amazon Bedrock Guardrails。\n\n#### 构建维持上下文的交互式 AI 系统\n\n**这条在问什么。** 前面讲的都是「一次问答」。真实场景里用户是**多轮交互**的：先问「这个合同有什么风险」，再问「那第二条具体怎么改」。第二句里的「那第二条」是什么意思，完全依赖上一轮的上下文。这条考的就是**怎么把多轮对话接起来，以及怎么处理「用户没说清」的情况**。\n\n官方给了三个组件：**Step Functions 做澄清工作流**、**Amazon Comprehend 做意图识别**、**DynamoDB 存对话历史**。\n\n- **对话历史存储**：每轮问答都要存下来，下轮调用时把相关历史一起送给模型。用 DynamoDB 是因为它按会话 ID 存取快、能自动过期（设 TTL），成本也可控。\n- **意图识别**：先判断用户这句话到底想干什么（查询、抱怨、下单、问路由），再决定怎么处理。用 Amazon Comprehend 做分类，可以在进入昂贵的大模型调用之前先分流。\n- **澄清工作流**：用户的问题模糊时，**反问一句比瞎猜要好**。比如「帮我改一下那个」——对方到底指哪个，系统应该问清楚，而不是随便编一个。用 Step Functions 编排「判断是否需要澄清 → 追问 → 收到补充信息 → 继续处理」这条流程。\n\n**一个实务判断**：对话历史不能无限往里塞——**上下文窗口是有限且昂贵的**。所以工程上必须处理「截断策略」：保留最近几轮 + 关键的早期信息（如用户一开始表达的总体诉求），中间的可以摘要压缩。这个点和「上下文窗口溢出诊断」（5.2.1）是同一个知识点的两面。\n\n**关联服务**：AWS Step Functions、Amazon Comprehend、Amazon DynamoDB。\n\n#### 案例\n\n某企业的 IT 支持助手上线后遇到一类投诉。\n\n用户问「我的账号登不上」，助手直接给出「请重置密码」的标准答案。但用户其实是**新入职、账号还没开通**——问题出在缺少澄清环节。加上澄清工作流后的表现是：助手先判断意图（登录故障）→ 检查话术库中该意图分支是否信息不足 → 追问一句「你是新员工还是已有账号？」→ 按回答分流。**多问一句话，就把「答非所问」变成了「对症下药」。**\n\n#### 实施提示管理与治理系统\n\n**这条在问什么。** 提示词一旦上了生产，就变成了**需要版本管理、需要审批、需要审计**的资产。谁能改、改了什么、什么时候改的、改完之后谁在用——这些都必须留痕。这条考的是「提示词的治理」。\n\n官方给的四个组件正好覆盖治理的四个面：\n\n| 组件 | 管的什么 |\n|---|---|\n| **Amazon Bedrock Prompt Management**（参数化模板 + 审批工作流） | 提示词的**版本与发布**——模板复用，改动走审批 |\n| **Amazon S3**（模板仓库） | 提示词的**集中存储**，统一存放而不是散落各处 |\n| **AWS CloudTrail**（追踪使用） | **谁调用了什么**——审计追踪 |\n| **Amazon CloudWatch Logs**（记录访问） | **运行时的访问与异常**——监控与排障 |\n\n**为什么提示词治理值得单列一条？** 因为它是**最容易失控的一环**。数据管道有代码、模型有版本号，唯独提示词常常是「谁在线上一改，全公司的输出风格就变了」，而且没人知道是谁改的。在受监管行业，这直接构成合规问题：**你无法向审计证明「这个回答是由哪个版本的指令产生的」。**\n\n**取舍判断。** 治理强度应随场景敏感度分级：**面向客户、涉及合规的场景，提示词变更必须走审批 + 留痕 + 可回滚；内部实验性工具可以轻量处理**。全部上重流程，会拖慢创新；全部不上流程，出事时查不清。这也是考试喜欢考的「分级治理」思路。\n\n**关联服务**：Amazon Bedrock Prompt Management、Amazon S3、AWS CloudTrail、Amazon CloudWatch Logs。\n\n#### 开发质量保证系统\n\n**这条在问什么。** 提示词改了一版，你怎么知道它是变好了还是变坏了？**靠感觉是不行的**——必须有一套「跑一遍、对着标准看」的机制。这条考的就是提示词的质量保证。\n\n官方给了三种手段：**Lambda 验证期望输出**、**Step Functions 测试边界情况**、**CloudWatch 做提示词回归测试**。\n\n- **验证期望输出**：写程序自动检查模型的返回是否符合预期——格式对不对、必填字段有没有、是不是该拒答的拒答了。**这是把「人工看一眼」变成「自动跑一遍」的关键一步。**\n- **测试边界情况**：正常问题答得好，不代表异常输入也稳。空输入、超长输入、恶意诱导、语言混杂——这些「边界情况」恰恰是上线后最容易翻车的地方。用 Step Functions 把这一批用例编排起来批量跑。\n- **回归测试**：**每次改提示词都重跑一遍历史用例，对比改动前后的结果**。这是软件工程里的老规矩（改了代码要跑回归测试），搬到提示词上同样成立——而且更重要，因为提示词的变化比代码更难用肉眼看出来。\n\n**取舍判断。** 建这套测试体系有前期成本（要攒用例、写校验脚本）。**判据是「提示词的变更频率」和「答错的代价」**：一个季度都不改一次的提示词，做重流程不划算；每天在调、又要面向客户，那这套体系是必需品。一个务实做法是**把线上出过的 bad case 攒成固定用例集**，它比凭空设计的用例更贴近真实风险。\n\n**关联服务**：AWS Lambda、AWS Step Functions、Amazon CloudWatch。\n\n#### 迭代优化提示以提升响应质量\n\n**这条在问什么。** 前面都在讲「怎么管」，这条回到「怎么写」。当基础提示（直接把问题丢给模型）已经用上，怎么让输出质量再上一个台阶？\n\n官方给了四个抓手：**结构化输入组件**、**输出格式规范**、**思维链（chain-of-thought）指令模式**、**反馈闭环**。\n\n**为什么这些有效？**\n\n- **结构化输入**：不是把一堆文字堆给模型，而是明确分区——「以下是背景资料」「以下是用户问题」「以下是输出要求」。**分区让模型知道哪部分是资料、哪部分是指令**，混淆这两者是很多提示失效的根因。\n- **输出格式规范**：明确要求「以 JSON 输出，包含 `summary`、`risk_level`、`actions` 三个字段」。这既是给模型约束，也是给下游程序留接口。\n- **思维链**：让模型**先推理再给结论**（「请先逐步分析，再给出最终判断」）。在需要多步推理的任务上（如判断一个架构是否满足合规要求），这能明显改善正确率——因为模型不再是一步跳到答案。\n- **反馈闭环**：把用户的反馈（点赞/否定/修正）收集起来，用来改进下一版提示。**这是让提示词持续变好的机制，而不是一次性写完就放着。**\n\n**取舍判断。** 思维链会增加输出长度和延迟，**不是所有任务都该用**。简单的事实提取，加了思维链反而变慢变啰嗦；需要推理和权衡的复杂任务，它才发挥作用。**「按任务复杂度选提示策略」是这条的核心判断。**\n\n**关联服务**：Amazon Bedrock（提示编排）。\n\n#### 设计复杂提示系统\n\n**这条在问什么。** 单条提示解决不了的任务，就要把多条提示组织起来——这就是「提示系统」。这条是提示工程里最靠「设计」的一层。\n\n官方给的四个组件：\n\n| 组件 | 作用 |\n|---|---|\n| **Amazon Bedrock Prompt Flows** | 把多条提示串成流程（顺序链） |\n| **基于模型响应的条件分支** | 上一步的结果决定下一步走哪条路 |\n| **可复用提示组件** | 把常用片段抽成积木，避免重复维护 |\n| **内置的前处理与后处理步骤** | 在提示链的两端加上数据准备与结果加工 |\n\n**这套东西在解决什么真实问题？** 举个典型的业务场景：自动审合同。流程是——先抽取合同要素（第一条提示）→ 判断风险等级（第二条提示）→ **如果是高风险，走「逐条给出修改建议」的详细分支；如果是低风险，走「生成一句话结论」的快速分支**（这就是条件分支）→ 最后把结果格式化成报告（后处理）。\n\n拆成多步的好处很实在：**每一步都能单独测试、单独优化、单独替换**。一坨巨型提示出问题时你根本不知道是哪段写坏了；拆成链之后，哪一步的输入输出不对，一眼就能定位。\n\n**取舍判断。** 多步链路的代价是**延迟叠加**（每步都要调一次模型）和**错误传播**（第一步抽要素错了，后面全错）。所以判据是**任务是否真的需要分解**：如果一条提示能稳定完成，就不该拆成五步——那是为了架构好看而牺牲性能。**只有当任务本身包含「必须先得到 A 才能决定 B」这种依赖关系时，拆链路才是必要的。**\n\n**关联服务**：Amazon Bedrock Prompt Flows、AWS Lambda（前后处理）。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「提示词里写一句不要输出敏感信息就够了」 | 那是**请求**，模型可能不遵守 | Guardrails 是输出之后**独立执行的检查层**，拦得住 |\n| 「有安全需求就把 Guardrails 开到最严」 | 会增加延迟，也可能误拦正常内容 | 按场景调：面向公众要严，内部工具可放宽 |\n| 「提示词不用版本管理」 | 谁改的、改了什么、哪个回答出自哪个版本，全查不清 | 受监管场景下这直接构成合规问题，必须留痕 |\n| 「提示词改完看一眼就行」 | 提示词的变化比代码更难用肉眼看出来 | 要**回归测试加边界用例**，把线上 bad case 攒成固定用例集 |\n| 「多步提示链总比单条好」 | 每步都加延迟，第一步错了后面全错 | **只有当任务包含「先得到 A 才能决定 B」的依赖时才拆** |\n\n#### 记忆要点\n\n1. **Guardrails 与提示词的本质区别**：**强制 vs 请求**。安全要求高时不能只靠君子协定。\n2. **角色定义与输出格式分开管**——两者变化频率不同，混在一段提示里改一处就要整体重测。\n3. **提示词治理四要素**：版本 / 存储 / 审计 / 监控。按场景敏感度**分级治理**。\n4. **质量保证三件**：验证期望输出 / 边界用例 / 回归测试。\n5. **提示链只在该拆的时候拆**——判断依据是有没有「先 A 才能 B」的依赖关系。\n\n---"}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 1.1.1 | 四种集成模式（提示工程/RAG/Agent/微调）的适用判断 | ⭐⭐⭐ | 场景选择题——给需求问选哪种 |\n| 1.1.2 | POC 的正确做法（真实数据、小规模、先定验收标准） | ⭐⭐ | 判断「哪种 POC 做法更合适」 |\n| 1.2.1 | 模型选择的三维递进筛选（限制→能力→性能） | ⭐⭐⭐ | 场景题——先排除再择优的顺序 |\n| 1.2.2 | 模型抽象层的取舍（何时值得加、何时是过度设计） | ⭐⭐ | 正反两向——既考「该加」也考「不该加」 |\n| 1.2.3 | 韧性四手段的适用（断路器/跨区域推理/多区域部署/优雅降级） | ⭐⭐⭐ | 故障场景题——问该用哪种容错 |\n| 1.2.4 | 微调 vs PEFT 的成本效果权衡 | ⭐⭐ | 对比题——什么时候才该定制模型 |\n| 1.3.1 | 数据验证的价值：把问题挡在进模型之前 | ⭐⭐ | 概念题——为什么不能省这一步 |\n| 1.3.2 | 原生多模态 vs 先转换再处理 | ⭐⭐ | 场景题——按文档类型选路径 |\n| 1.3.3 | 对话格式的输入要求（长度计算、历史截断） | ⭐⭐ | 细节题——与「上下文窗口溢出诊断」（5.2.1）联动 |\n| 1.4.1 | 四种向量库架构的适用场景 | ⭐⭐⭐ | 场景选择题——按团队能力与规模选 |\n| 1.4.2 | 元数据的预过滤价值 | ⭐⭐ | 场景题——多版本文档如何保证取到现行版 |\n| 1.4.3 | 大规模下的索引优化手段（分片/多索引/分层） | ⭐ | 判断题——何时才需要 |\n| 1.4.5 | 数据维护四种机制的时效选择 + 删除同步 | ⭐⭐ | 场景题——按变更频率选机制 |\n| 1.5.1 | 切分粒度的双向权衡 + 重叠的作用 | ⭐⭐⭐ | 判断题——块太大/太小的后果 |\n| 1.5.2 | 嵌入模型选择（维度、领域匹配）与全库一致性 | ⭐⭐ | 概念题——换模型的代价 |\n| 1.5.4 | 混合检索弥补向量检索的专名短板；重排序两段式架构 | ⭐⭐⭐ | 场景题——编号/条款号必须精确命中 |\n| 1.5.5 | 查询分解处理复合问题；按复杂度分流 | ⭐⭐ | 场景题——多信息需求的问题怎么处理 |\n| 1.5.6 | 访问机制标准化（函数调用/MCP/统一 API）的适用条件 | ⭐ | 判断题——消费方数量决定投入 |\n| 1.6.1 | 角色定义 vs Guardrails 的本质区别（请求 vs 强制） | ⭐⭐⭐ | 概念题——安全边界怎么才拦得住 |\n| 1.6.3 | 提示词治理四要素（版本/存储/审计/监控）与分级治理 | ⭐⭐ | 场景题——受监管行业的合规要求 |\n| 1.6.4 | 提示词回归测试与边界用例 | ⭐⭐ | 判断题——怎么验证改动是变好还是变坏 |\n| 1.6.5 | 思维链的适用条件（复杂推理有效、简单提取反而变差） | ⭐⭐ | 对比题——按任务复杂度选策略 |\n| 1.6.6 | 提示链路的拆分判据（有依赖才拆） | ⭐⭐ | 判断题——多步链路的代价 |","services":"| 服务 | 主要用途 | 涉及 Task |\n|---|---|---|\n| Amazon Bedrock | 模型调用、知识库、Prompt Management / Flows、Guardrails、重排序、查询扩展 | 1.1 / 1.2 / 1.3 / 1.4 / 1.5 / 1.6 |\n| Amazon Bedrock Knowledge Bases | 托管知识库与向量存储、数据源连接器、内置切分 | 1.4 / 1.5 |\n| Amazon Bedrock Guardrails | 输出侧安全边界强制执行 | 1.6 |\n| Amazon SageMaker AI | 自建端点、微调、批量处理 | 1.1 / 1.2 / 1.3 |\n| SageMaker Model Registry | 模型版本管理与回滚 | 1.2 |\n| Amazon OpenSearch Service | 向量检索、分片策略、混合检索 | 1.4 / 1.5 |\n| Amazon Aurora（pgvector） | 关系库内做向量检索，可与结构化条件同查 | 1.4 / 1.5 |\n| Amazon RDS / Amazon DynamoDB | 元数据与对话历史存储 | 1.4 / 1.6 |\n| Amazon S3 | 文档存储、元数据、模板仓库、变更事件源 | 1.3 / 1.4 / 1.6 |\n| AWS Lambda | 数据校验、切分、批量嵌入、查询分解、质量验证 | 1.3 / 1.4 / 1.5 / 1.6 |\n| AWS Step Functions | 断路器编排、澄清流程、查询改写、边界用例测试 | 1.2 / 1.5 / 1.6 |\n| Amazon API Gateway | 统一调用入口（模型抽象层） | 1.2 |\n| AWS AppConfig | 配置中心，实现不改代码换模型 | 1.2 |\n| Amazon Comprehend | 实体抽取、意图识别 | 1.3 / 1.6 |\n| AWS Glue Data Quality | 数据管道内建质量规则 | 1.3 |\n| SageMaker Data Wrangler | 可视化数据准备与探查 | 1.3 |\n| AWS Transcribe | 语音转文本 | 1.3 |\n| Amazon CloudWatch / Logs | 质量指标监控、提示词回归测试、访问日志 | 1.3 / 1.6 |\n| AWS CloudTrail | 提示词使用审计追踪 | 1.6 |\n| Amazon EventBridge | 事件触发的数据同步 | 1.4 |\n| AWS Well-Architected Framework / Tool | 架构评审基准、GenAI Lens 检查项 | 1.1 |"}},{"domain":2,"name":"实施和集成","weight":"26%","practice":[{"id":"D2-001","d":2,"t":"single","q":"一个客服系统需要处理订单处理、技术支持和账单查询的 Agent，并实现无缝交接。哪种架构提供最佳用户体验？","o":[{"l":"A","t":"带专业化动作组和上下文管理的单一多功能 Agent"},{"l":"B","t":"带 Amazon Bedrock Multi-Agent Collaboration（多智能体协作）和对话路由的专业化 Agent"},{"l":"C","t":"带主管 Agent 和任务特定子 Agent 的层级 Agent 系统"},{"l":"D","t":"带 Agent-per-service 和 API 编排的微服务架构"}],"a":["B"],"e":"**正确答案：B。** 订单处理、技术支持、账单查询各由一个专门的 Agent 负责，中间用对话路由判断该转给谁并完成交接——对应 Amazon Bedrock 的 Multi-Agent Collaboration（多智能体协作）能力。\n\n**为什么对：** 题干两个要求——\"专业化\"和\"无缝交接\"。一个 Agent 只管一个领域，系统提示和动作组都能针对性设计，判断更准；路由层负责识别当前请求属于哪一类，交接时把上下文一起带过去，用户不用重复描述，这正是题干说的\"最佳用户体验\"。官方 Multi-Agent Collaboration 里 supervisor（主管）Agent 的职责就是分析请求并路由给合适的 collaborator（协作）Agent，与选项描述一致。\n\n**其他选项为什么错：**\n- A. 单一多功能 Agent + 专业化动作组：一个 Agent 同时扛三类业务，系统提示越写越长，意图判断容易串，谈不上专业化。\n- C. 主管 Agent + 任务专属子 Agent 的层级系统：形态上更接近多层委派，每个请求都要先过一层主管再下派，交接链路比直接路由更长，与题干\"无缝交接\"的取向相反。\n- D. Agent-per-service 微服务 + API 编排：强调的是服务拆分和部署形态，没回答\"对话怎么在 Agent 之间交接\"。\n\n**关键概念：** Amazon Bedrock 上对应的官方能力是 Multi-Agent Collaboration（多智能体协作），形态为 supervisor（主管）+ collaborator（协作）两层 Agent。注意 \"Agent Squad\" 不是 AWS 托管服务——它是 AWS Labs 的开源编排框架，原名 Multi-Agent Orchestrator，2025-05 更名 Agent Squad，2026-04 已迁出 AWS Labs 由 2FastLabs 维护；官方考纲中仍写作 \"AWS Agent Squad\"，属考纲滞后，不代表它是 Bedrock 的能力名。","s":"源#91"},{"id":"D2-002","d":2,"t":"single","q":"你的 Agent 系统需要处理 10,000+ 并发对话，且响应时间小于 1 秒。哪种扩展方法最有效？","o":[{"l":"A","t":"带负载均衡和 Agent 实例池的水平扩展"},{"l":"B","t":"带专用 Agent 容量和连接池的预置吞吐量"},{"l":"C","t":"基于 Lambda 的 Agent 和自动扩展的无服务器架构"},{"l":"D","t":"基于容器的部署，带 Kubernetes 自动扩展和资源优化"}],"a":["B"],"e":"**正确答案：B。** 给模型买 Provisioned Throughput（预置吞吐量）锁定专用容量，同时保持连接池复用。\n\n**为什么对：** 高并发下响应时间主要被两件事拖住——排队等推理容量、反复建立连接。预置吞吐量保证有专属算力，请求不用排队；连接池复用已有连接，省掉建连开销。这两条正好对上\"10000+ 并发 + 亚秒级响应\"。\n\n**其他选项为什么错：**\n- A. 水平扩展 + 负载均衡 + Agent 实例池：扩的是你自己的应用这一层，模型侧的推理容量没锁住，突发流量照样排队。\n- C. Lambda 无服务器 + 自动扩展：Lambda 有冷启动，并发还受账户配额限制，亚秒级响应保证不了。\n- D. 容器 + Kubernetes 自动扩缩：扩容有滞后，Pod 启动期间延迟会飙，同样锁不住模型侧容量。","s":"源#92"},{"id":"D2-003","d":2,"t":"single","q":"一个 Agent 需要访问 15 个不同 API，这些 API 具有不同的认证方法和速率限制。哪种集成模式能处理这种复杂性？","o":[{"l":"A","t":"带 Lambda 函数的动作组，为每个 API 处理认证和速率限制"},{"l":"B","t":"带统一认证和跨所有服务速率限制的 API 网关"},{"l":"C","t":"带连接池和断路器模式的自定义中间件层"},{"l":"D","t":"直接 API 集成，带 Agent 级认证和重试机制"}],"a":["A"],"e":"**正确答案：A。** 用 action group（动作组）配 AWS Lambda：每个 API 对应一个函数，在各自的函数里处理认证和限流。\n\n**为什么对：** 15 个 API 的认证方式各不相同，硬塞进统一层反而要写一堆分支。动作组把每个 API 的调用细节各自封装，Agent 侧只看到统一的工具定义，复杂度和维护边界都清楚了。\n\n**其他选项为什么错：**\n- B. API 网关统一认证和限流：各 API 认证方式不同，强行统一意味着网关里要适配所有类型，反而更重。\n- C. 自定义中间件 + 连接池 + 断路器：能提升可靠性，但要自己维护一整层中间件，而且跟 Agent 的工具定义是脱节的。\n- D. 直接 API 集成 + Agent 级认证重试：把 15 套认证逻辑全压进 Agent 配置，Agent 定义会变得难以维护。","s":"源#93"},{"id":"D2-004","d":2,"t":"single","q":"当多个 Agent 处理相关任务时，一个多 Agent 系统出现协调失败。哪种协调机制能改善协作？","o":[{"l":"A","t":"带 Agent 状态同步和冲突解决的共享内存系统"},{"l":"B","t":"带事件驱动协调和任务队列的消息传递架构"},{"l":"C","t":"带任务分配和依赖管理的集中式编排器"},{"l":"D","t":"带 Agent 投票和决策同步的分布式共识协议"}],"a":["A"],"e":"**正确答案：A。** 建一块共享内存，各 Agent 把状态写进去、实时读到彼此的进度，并配好冲突解决规则。\n\n**为什么对：** \"协调失败\"通常是因为各 Agent 看不到对方在做什么。共享状态让所有 Agent 有同一份事实来源；冲突解决规则则处理\"两个 Agent 同时要改同一份数据\"这类情况。\n\n**其他选项为什么错：**\n- B. 事件驱动 + 消息队列：消息是异步的，Agent 之间只能\"事后知道\"，做不到实时协调。\n- C. 集中式编排器：编排器能派活和管依赖，但 Agent 之间仍不共享中间状态，遇到冲突还得回来问编排器。\n- D. 分布式共识协议：共识是让多个节点就一个值达成一致，通信开销大，用在业务协调上属于杀鸡用牛刀。","s":"源#94"},{"id":"D2-005","d":2,"t":"single","q":"你的 Agent 系统需要跨多个会话和渠道维护对话上下文。哪种状态管理方法是最优的？","o":[{"l":"A","t":"基于会话的 DynamoDB 存储和跨渠道上下文同步"},{"l":"B","t":"带持久存储和上下文检索机制的 Agent 记忆"},{"l":"C","t":"带 Redis 分布式缓存和会话亲和性的上下文一致性"},{"l":"D","t":"带对话历史重建和状态重放的事件溯源"}],"a":["B"],"e":"**正确答案：B。** 启用 Agent 的 memory（记忆）能力，把关键上下文持久化保存，需要时再检索出来。\n\n**为什么对：** 题干两个要求——\"跨会话\"和\"跨渠道\"。会话级状态（session state）在会话结束就失效，只有持久化的记忆才能在下次会话、另一个渠道里把上下文取回来。\n\n**其他选项为什么错：**\n- A. DynamoDB 按会话存 + 跨渠道同步：按会话存的数据跨不过会话边界，同步逻辑还要自己写。\n- C. Redis 缓存 + 会话亲和性：缓存是易失的；会话亲和性把请求绑在特定节点上，反而妨碍跨渠道。\n- D. 事件溯源重放：能重建历史，但每次都要重放全部事件才能恢复上下文，延迟和复杂度都不划算。","s":"源#95"},{"id":"D2-006","d":2,"t":"single","q":"一个 Agent 需要执行带回溯能力的复杂多步推理。哪种实现模式支持此功能？","o":[{"l":"A","t":"带显式状态转换和回滚机制的状态机"},{"l":"B","t":"带分支探索和剪枝策略的树搜索"},{"l":"C","t":"带步骤验证和错误纠正循环的思维链"},{"l":"D","t":"带目标分解和执行监控的规划算法"}],"a":["C"],"e":"**正确答案：C。** 用 chain-of-thought（思维链）把推理拆成显式步骤，每步做验证，验证不过就纠正或回退。\n\n**为什么对：** 回溯的前提是\"知道错在哪一步\"。思维链把推理过程显式写出来，才可能定位到具体某一步；步骤验证提供对错判断；纠错循环就是回溯动作本身。三者串起来才构成完整能力。\n\n**其他选项为什么错：**\n- A. 状态机 + 显式状态转换和回滚：状态机的状态要预先定义，而复杂推理的中间步骤没法穷举。\n- B. 树搜索 + 分支探索剪枝：搜索的是解空间，适合有明确目标函数的场景，不适配开放式推理。\n- D. 规划算法 + 目标分解：规划解决\"先做什么后做什么\"，不解决\"某一步做错了怎么退回来\"。","s":"源#96"},{"id":"D2-007","d":2,"t":"single","q":"一个金融服务 Agent 必须满足决策透明度的监管要求。哪种方法能确保可解释 AI？","o":[{"l":"A","t":"带逐步推理捕获和审计追踪的决策树日志"},{"l":"B","t":"Amazon Bedrock Agent tracing，带推理透明度和来源归属"},{"l":"C","t":"带决策理由和置信度评分的自定义解释生成"},{"l":"D","t":"带显式逻辑文档和验证的基于规则的决策叠加层"}],"a":["B"],"e":"**正确答案：B。** 打开 Amazon Bedrock 的 trace（追踪），把 Agent 的推理过程、工具调用和引用来源都记录下来。\n\n**为什么对：** 监管要的\"可解释\"是事后能还原\"这个结论是怎么得出的\"。Trace 记录每一步推理、每一次工具调用、每一处引用来源，串起来就是一条完整的审计证据链。\n\n**其他选项为什么错：**\n- A. 决策树日志 + 审计追踪：决策树是确定性规则模型，而 Agent 基于大模型做推理，套不进决策树结构。\n- C. 自定义解释生成 + 置信度评分：让模型解释自己的决策，解释未必忠实于真实推理过程，不能当作审计依据。\n- D. 基于规则的决策叠加层：等于在 Agent 外面再包一层规则，改变的是决策方式，不是提供可解释性。","s":"源#97"},{"id":"D2-008","d":2,"t":"single","q":"你的 Agent 系统需要根据任务复杂度和可用资源动态选择工具。哪种架构支持自适应行为？","o":[{"l":"A","t":"带能力匹配和运行时动态绑定的工具注册表"},{"l":"B","t":"基于机器学习的工具选择，带性能预测和优化"},{"l":"C","t":"基于规则的工具选择，带上下文分析和资源可用性检查"},{"l":"D","t":"带自动升级和回退机制的层级工具组织"}],"a":["A"],"e":"**正确答案：A。** 建一个工具注册表，登记每个工具的能力描述，运行时按任务需求和资源情况匹配并动态绑定。\n\n**为什么对：** 动态选择的前提是\"工具可被检索和匹配\"。注册表把工具能力元数据化，运行时才能按当前任务挑一个出来；新增工具只需登记，不用改 Agent 逻辑。\n\n**其他选项为什么错：**\n- B. 机器学习预测选工具：要训练数据和持续迭代，且预测结果不可解释，不如规则化匹配可控。\n- C. 基于规则 + 上下文分析：规则是硬编码的，工具一多规则就膨胀，也难以覆盖资源动态变化的情况。\n- D. 层级工具组织 + 自动升降级：层级解决的是工具归类，不是\"按当前任务和资源选哪一个\"。","s":"源#98"},{"id":"D2-009","d":2,"t":"single","q":"一个 Agent 在处理需要多次工具调用的复杂查询时性能下降。哪种优化策略最有效？","o":[{"l":"A","t":"带依赖分析和结果聚合的并行工具执行"},{"l":"B","t":"带智能缓存失效和预热策略的工具结果缓存"},{"l":"C","t":"带子任务优化和结果组合的查询分解"},{"l":"D","t":"带按需工具调用和结果流式传输的惰性求值"}],"a":["A"],"e":"**正确答案：A。** 先分析多次工具调用之间的依赖关系，没有依赖的一起并发执行，最后汇总结果。\n\n**为什么对：** 性能下降的原因是串行等待——明明互不相关的调用却一个个排队。依赖分析找出哪些能并行，把总耗时从\"各次相加\"压到\"最慢的那一次\"。\n\n**其他选项为什么错：**\n- B. 工具结果缓存 + 失效策略：命中缓存才有效，题干说的是\"复杂查询要调多次工具\"，不是重复调同一个。\n- C. 查询分解 + 子任务优化：分解是前提，但分解完如果仍然串行执行，耗时不会降下来。\n- D. 惰性求值 + 按需调用：按需调用减少的是调用次数，不改变多次调用之间的串行关系。","s":"源#99"},{"id":"D2-010","d":2,"t":"single","q":"一个多租户 Agent 系统需要在共享通用能力的同时隔离客户数据。哪种架构提供安全的多租户？","o":[{"l":"A","t":"每租户独立 Agent，共享工具库和隔离数据访问"},{"l":"B","t":"共享 Agent，带租户特定上下文隔离和数据分区"},{"l":"C","t":"微服务架构，带租户特定服务实例和共享工具"},{"l":"D","t":"基于容器的隔离，带租户特定 Agent 部署和共享资源"}],"a":["B"],"e":"**正确答案：B。** Agent 实例共用一套，但每个租户的上下文和数据访问严格分区。\n\n**为什么对：** 题干要\"共享通用能力\"和\"隔离客户数据\"同时成立。共享 Agent 让提示、动作组这些通用能力只维护一份；隔离放在上下文和数据访问这两层，成本和安全性就都照顾到了。\n\n**其他选项为什么错：**\n- A. 每租户一个独立 Agent：隔离够了，但每个租户都要重复部署和维护一套 Agent，能力与成本都不划算。\n- C. 微服务 + 租户特定服务实例：把隔离做在服务实例层面，同样带来实例数量膨胀和运维负担。\n- D. 容器隔离 + 租户特定部署：也是靠\"一租户一部署\"实现隔离，运维复杂度和成本在四个选项里最高。","s":"源#100"},{"id":"D2-011","d":2,"t":"single","q":"你的 Agent 系统需要与现有企业工作流和审批流程集成。哪种集成模式能最小化干扰？","o":[{"l":"A","t":"基于 API 的集成，带工作流引擎和审批系统连接器"},{"l":"B","t":"带工作流触发器和状态同步的事件驱动架构"},{"l":"C","t":"带工作流状态管理和通知系统的直接数据库集成"},{"l":"D","t":"带异步处理和回调机制的队列集成"}],"a":["A"],"e":"**正确答案：A。** 通过 API 调用现有的工作流引擎和审批系统，用连接器做对接。\n\n**为什么对：** \"最小化干扰\"就是不改动现有系统。走 API 加连接器是在系统外围对接，工作流引擎和审批流程本身的逻辑、数据表都不用动。\n\n**其他选项为什么错：**\n- B. 事件驱动 + 工作流触发器：要求现有系统能发事件，通常要改造才能支持，干扰更大。\n- C. 直接数据库集成：绕过应用层直接读写库，破坏封装，还容易和现有业务逻辑打架，干扰最大。\n- D. 队列集成 + 异步回调：要引入新的中间件和异步链路，现有系统得配合改造，也不是最小改动。","s":"源#101"},{"id":"D2-012","d":2,"t":"single","q":"一个交易应用需要市场分析查询的响应时间小于 100ms。哪种部署配置满足此要求？","o":[{"l":"A","t":"带专用容量和边缘缓存的预置吞吐量"},{"l":"B","t":"带响应缓存和 CDN 分发的按需推理"},{"l":"C","t":"在 GPU 实例上托管自定义模型，带优化推理管道"},{"l":"D","t":"本地模型推理和云回退的混合部署"}],"a":["A"],"e":"**正确答案：A。** 买 Provisioned Throughput（预置吞吐量）锁定专用容量，再配合边缘缓存。\n\n**为什么对：** 100ms 是极紧的延迟预算，耗时主要来自两处——排队等推理容量、重复查询重复计算。预置吞吐量让请求不必排队；边缘缓存让重复查询就近直接返回，不再走一遍模型。\n\n**其他选项为什么错：**\n- B. 按需推理 + 响应缓存 + CDN：按需推理用的是共享容量，流量高峰会排队，延迟不可控。\n- C. GPU 实例自托管模型 + 优化管道：自托管要自己搞定扩缩容和模型优化，也不等于就能做到 100ms。\n- D. 本地推理 + 云回退混合：本地部署能降网络延迟，但硬件与运维成本高，回退路径还会带来延迟跳变。","s":"源#102"}],"sections":[{"h":"实施代理式 AI 解决方案与工具集成","body":"域 1 解决的是「方案长什么样」。域 2 解决的是「怎么把它真的搭起来」。\n\n同一套架构，选对了组件但接错了方式，照样跑不出想要的效果。这一域考的就是接的过程：智能体怎么编排、模型怎么部署、企业系统怎么接进来、API 怎么调、开发工具怎么用。\n\n**为什么它权重第二（26%）？** 因为这门考试的全名是「生成式 AI **开发者**」，而这一域最贴近开发者的日常工作。\n\n域 1 里你选了一个向量库、一套切分策略，那是纸面设计。到了域 2，你要回答的是另一类问题：\n\n- 这个智能体运行时怎么保存上下文？\n- 这个工作流怎么在第三步停下来等人审批？\n- 模型在晚高峰撑不住时怎么办？\n\n这些问题的共同点是：**答案不在服务清单里，而在服务之间的接法里**。\n\n**它和域 1 的分工是什么？** 域 1 是「选什么」（选模型、选向量库、选切分策略），域 2 是「怎么连」（把选好的东西连成一条能跑、能扛、能查的链路）。\n\n举个具体的例子。域 1 决定用 RAG。域 2 负责三件事：让检索这一步真正接到智能体的工具列表里；让它的超时有地方兜住；让它的调用能被追踪到。\n\n两域相邻，考法也常常连在一起出——一道场景题的前半段考架构选型，后半段考实施方式。\n\n**学这一域建议抓住一条主线**：始终问「**这条链路上出错了，会怎么样**」。\n\n智能体会不会陷入死循环？模型响应超时了谁来重试？工具返回了错误格式怎么办？审批的人一直不点同意怎么办？\n\n把这条「故障想象」的习惯带进去，你会发现这一域几乎所有知识点都在回答同一个问题——**让系统在不确定的环境里继续给出可接受的结果**。\n\n> 📌 **本域内部的学习顺序建议**：按 2.1 → 2.2 → 2.3 → 2.4 → 2.5 读。2.1 讲智能体与工具集成，是本域第一大任务，也是 AIP-C01 相对 AIF-C01 新增的考点，先读它。2.2 接着讲模型怎么部署。2.3 到 2.5 从「企业内部系统」往「对外接口」再往「开发工具」铺开，是一条由内向外、由粗到细的线。\n\n> ⚠️ **一处名词口径提示**：考纲在「记忆与状态管理」（2.1.1）与「高级 GenAI 应用」（2.5.5）两处示例里，写的是「Strands Agents and AWS Agent Squad」。这两个名字的归属要分清：\n> - **Strands Agents** 是 AWS 发起的开源 SDK。\n> - **Agent Squad** 原名 Multi-Agent Orchestrator，是 AWS Labs 时期开源的轻量多智能体框架。**2026 年该项目已从 AWS Labs 迁出，由 2FastLabs 维护，并非 AWS 托管服务。**\n>\n> 考纲沿用旧归属，考试时按考纲的措辞答；理解上要清楚它是开源框架，与 Amazon Bedrock 上的托管能力（如 Multi-Agent Collaboration）不是一回事。正文详见「让智能体记得住事：记忆与状态管理」（2.1.1）。\n\n#### 本节定位\n本节对应考纲任务声明 2.1「实施代理式 AI 解决方案与工具集成」。\n\n> 官方原名：Implement agentic AI solutions and tool integrations.\n\n这是本域最大的任务，一共 7 个技能点。它也是整门考试里最「新」的一块——考纲配套资料明确写了：任务 2 的代理式 AI（agentic AI）与 MCP 是新考点，AIF-C01 未覆盖。\n\n它回答的核心问题是：**怎么让 AI 从「回答问题」变成「做事」**。\n\n「做事」比「回答」多出三件事。记住这三件，七个技能点就有地方挂了：\n\n| 多出来的事 | 具体是什么 | 对应知识点 |\n|---|---|---|\n| **要记住** | 多步任务的上下文和进度得留得住 | 记忆与状态（2.1.1） |\n| **要想清楚** | 复杂任务要拆步骤、边做边看结果 | 结构化推理（2.1.2） |\n| **要动手** | 调工具、改数据、发消息，风险随之而来 | 安全护栏（2.1.3）/ 人机协作（2.1.5）/ 工具集成（2.1.6）/ MCP（2.1.7） |\n\n中间还夹着一个**模型协同**（2.1.4），它解决的是「用哪个模型做哪件事」。\n\n#### 让智能体记得住事：记忆与状态管理\n\n**这条在问什么。** 一次普通的大模型调用是**无状态**的：你问一句，它答一句，答完就忘。\n\n智能体（agent）不一样。它要自己决定调哪些工具、按什么顺序调，中间会经过好几轮。这就带出两个必须解决的问题。\n\n**问题一：它能记住什么（记忆，memory）。** 记忆按时间尺度分两种：\n\n- **短期记忆**：当前这次会话里的对话上下文。用户刚说了什么、前面查到了什么，都算。\n- **长期记忆**：跨会话保留的信息。比如这个用户偏好简短回答，这个客户的项目编号规则是什么。\n\n**问题二：它走到哪一步了（状态管理，state management）。** 多步任务要记录进度和中间结果。\n\n第一个工具查到了订单号，第二个工具才能拿这个订单号去查物流。**状态一丢，任务就得从第一步重来。**\n\n**考纲点的实现路径是两条：**\n\n- **Strands Agents 和 Agent Squad**，用于多智能体系统。这两个名字经常被混着说，实际定位不同：\n  - **Strands Agents** 是 AWS 发起的**开源 SDK**（Python / TypeScript）。它的设计思路是「模型驱动」：你给模型一段指令和一组工具，由模型自己判断什么时候调哪个工具。SDK 帮你处理智能体循环、工具调用和多步推理这些重复劳动。**它管的是「怎么写一个智能体」。**\n  - **Agent Squad**（原名 **Multi-Agent Orchestrator**）是一个**轻量级开源框架**。它解决的是另一件事：多个各有所长的智能体，怎么根据用户意图把对话分派给对的那个，同时共享同一份上下文。**它管的是「多个智能体之间怎么分工和交接」。**\n    > ⚠️ **归属已变更（2026 年）**：Agent Squad 最初托管在 AWS Labs 名下，2026 年已迁出，由 2FastLabs 继续维护。**它是开源框架，不是 AWS 托管服务。**\n    > 这一点在概念题里常被设成干扰项——选项把它写成「Amazon Bedrock Agent Squad」之类的托管服务名，就是错的。考纲里仍写作「AWS Agent Squad」是沿用旧归属：**答题按考纲措辞，理解上按事实。**\n- **MCP（Model Context Protocol，模型上下文协议）**，用于智能体与工具之间的交互。它把「工具怎么接进来」标准化，具体机制见「用 MCP 统一接法：模型扩展框架」（2.1.7）。\n\n**一个容易混的点**：记忆和 MCP 不是一个层次的东西。\n\n记忆回答「信息存在哪、留多久」，MCP 回答「工具用什么方式接入」。前者是数据问题，后者是接口问题。考试里如果把 MCP 说成「用来保存对话历史的协议」，那是概念挪用。\n\n> 📌 **一个 2026 年的官方变化（超出考纲，仅供参考）**：官方现在把智能体的「生产运行层」收拢进了 **Amazon Bedrock AgentCore**。\n> - **AgentCore Memory** 提供托管的短期与长期记忆，支持跨会话保留、多智能体共享同一份记忆。\n> - **AgentCore Runtime** 提供每次会话独立隔离的运行环境。\n>\n> **AIP-C01 考纲发布于 2025 年，里面完全没有出现 AgentCore**，考试仍以考纲列的组件为准。但理解 AgentCore 的模块划分（Runtime / Memory / Gateway / Identity / Observability），能帮你把「智能体从原型走到生产还缺什么」想明白。其中 Gateway 的作用与 MCP 直接相关。\n\n**取舍判断。** 记忆要不要自己做？判断标准是「**这些记忆值不值得单独管**」。\n\n如果只是保留一次会话的对话历史，用模型自带的上下文窗口加一张 DynamoDB 表就够了。如果需要跨会话积累用户偏好，或者多个智能体要共享同一份记忆，那才值得引入专门的记忆层（自建或托管）。\n\n**为了一次性会话去搭一套长期记忆架构，是过度设计**——这和域 1 里「模型抽象层」那类取舍是同一个逻辑。\n\n**关联服务**：AWS Strands Agents（开源智能体 SDK）、Agent Squad（开源多智能体路由框架）、Amazon Bedrock（模型与多智能体协作能力）、Amazon DynamoDB（会话状态与记忆存储）。\n\n#### 让它分步想：结构化推理\n\n**这条在问什么。** 复杂任务一次性交给模型，它容易漏步骤、算错中间结果。解决办法是让它按结构化的推理步骤走。\n\n考纲点的是用 **AWS Step Functions** 来实现 **ReAct 模式**和**思维链（chain-of-thought）推理**。先把两个概念分清楚，这是本节最容易混的地方：\n\n- **思维链（chain-of-thought，CoT）**：让模型在给出结论前，先把推理过程一步步写出来。它**纯粹发生在模型内部**，不接触外部系统。适合需要多步推导、但不需要外部信息的问题，比如算一笔带条件的折扣。\n- **ReAct 模式（Reason + Act，推理加行动）**：模型推理一步 → 决定调用某个工具 → 看到工具返回的真实结果 → 基于结果继续推理。它是一个**循环**，每轮都包含「想」和「做」两部分。适合需要外部信息才能推进的任务，比如先查库存、再算可交付日期、再生成回复。\n\n**为什么考纲点名用 Step Functions 来做这件事？** 因为 Step Functions 的状态机天然表达了三件事：\n\n- **循环**：推理 → 行动 → 观察 → 再推理。\n- **条件分支**：结果符合预期就继续，不符合就换路径。\n- **等待**：等一个异步工具返回。\n\n用代码写这个循环当然也行。但状态机的好处是**每一步都可见、可重试、可审计**。这正好对应「安全护栏」（2.1.3）与「韧性 FM 系统」（2.4.3）关心的那些东西。\n\n换句话说，用 Step Functions 实现 ReAct，不只是「能跑」，还顺带拿到了可观测性和容错能力。\n\n**一个必须理解的边界**：ReAct 的循环**必须能被叫停**。\n\n模型有可能在两三个工具之间来回跳，每次都「觉得还差一点」。这时候就需要停止条件——详见「带安全护栏的 AI 工作流」（2.1.3）。**推理框架和护栏是配套出现的**，只讲 ReAct 不讲停止条件，是这一节最典型的漏项。\n\n**关联服务**：AWS Step Functions（状态机编排推理循环与分支）、AWS Lambda（具体工具实现）、Amazon Bedrock（模型调用）。\n\n#### 案例\n\n某团队做一个「查订单能不能加急」的智能助手。\n\n用**思维链**的做法是：把订单信息、库存规则、加急政策一次性塞进提示词，让模型直接算出结论。信息都在手里时，这条路最快。\n\n但「能不能加急」还取决于承运商今天的运力，这个信息模型不知道。于是改用 **ReAct**：\n\n1. 推理：我需要知道承运商运力。\n2. 行动：调运力查询接口。\n3. 观察：今天已满。\n4. 再推理：已满就没有加急可能，但可以给替代方案。\n5. 给出结论。\n\n**判断用哪种，就看「要不要外部信息」。**\n\n#### 给它装刹车：带安全护栏的 AI 工作流\n\n**这条在问什么。** 智能体能自己循环、自己调工具。这是它的价值，也是它的风险。\n\n普通问答出错，顶多答得不对。智能体出错，可能反复调接口烧钱，或者改了不该改的数据。所以必须给它装「刹车」，让它的行为可控。\n\n考纲点了四类手段。它们管的其实是四件不同的事：\n\n| 手段 | 拦的是什么 | 实现方式 | 不装会怎样 |\n|---|---|---|---|\n| **停止条件（stopping conditions）** | 无限循环 | Step Functions 工作流中设置判定逻辑 | 智能体自己「觉得还差一点」，一直循环下去 |\n| **超时（timeout）** | 单步卡死 | Lambda 函数超时配置 | 一个工具调用挂住，整个流程永远等在那 |\n| **IAM 策略** | 越权访问 | IAM policy 限定可访问的资源 | 智能体调到了它不该碰的资源 |\n| **断路器（circuit breaker）** | 故障放大 | Step Functions 编排跳闸逻辑 | 下游持续报错时反复重试，把对方打垮 |\n\n**一个容易被当成「细节」、其实是本节核心的点**：这四类手段里，**只有 IAM 策略是服务端强制的硬边界**。\n\n其余三类都是应用层的工程手段——写得对才拦得住，写错了就形同虚设。所以「最小权限原则（least privilege）」不是一个合规口号，而是智能体安全的**最后一道防线**。\n\n提示词可能被绕过，判定逻辑可能有漏洞，但 IAM 说不行就是不行。这也是为什么「安全护栏」（2.1.3）与「安全访问框架」（2.3.3）经常连着考。\n\n**另一个要理解的取舍**：刹车装得越密，能跑完的任务越少。\n\n停止条件设得太严（比如三轮就停），复杂任务会被拦腰截断；设得太松，又挡不住死循环。**合理做法是按任务类型分别设**——简单查询三轮就够，多步数据分析可以放宽到十轮——而不是全局一个数。\n\n**关联服务**：AWS Step Functions（停止条件、断路器编排）、AWS Lambda（超时配置）、AWS IAM（资源边界）、Amazon Bedrock Guardrails（内容侧护栏，与本节手段互补：本节管「行为」，Guardrails 管「内容」）。\n\n#### 让多个模型分工：模型协同系统\n\n**这条在问什么。** 不是所有请求都值得动用最贵最大的模型。\n\n一个只有几十个字的意图分类，用大模型是浪费。反过来，一个需要多步推理的合同条款分析，用最便宜的模型又做不好。这条讲的是**怎么让多个模型协同，把整体表现和成本同时优化**。\n\n考纲给了三种形态：\n\n- **专用 FM 执行复杂任务**：把一个大任务拆成若干子任务，每个子任务交给最擅长它的模型。\n- **自定义聚合逻辑做模型集成（model ensembles）**：让多个模型对同一个问题各出一版答案，再用一套规则把结果合起来。\n  - 规则可以是投票：多数一致才采纳。\n  - 可以是加权：按历史准确率给权重。\n  - 也可以让一个「裁判模型」来评判哪版更好。\n  - **这么做的理由是：单模型的错误有随机性，多个模型同时犯同一个错的概率更低。**\n- **模型选择框架**：把「什么请求该用哪个模型」这套判断沉淀成可维护的规则或配置，而不是散落在各处代码里。\n\n**它和「智能模型路由」（2.4.4）怎么区分？** 这两条容易看串。分法是看**「有没有结合」**：\n\n- 「智能模型路由」（2.4.4）是「**选一个**」——把请求分给最适合的那个模型，一个请求一个模型。\n- 「模型协同」可以包含「**合起来**」——多个模型的输出被聚合、被比较、被拼接。\n\n前者是分派，后者是组合。考试里如果题干强调「提升准确率、降低单点误判」，那是协同；如果强调「按复杂度分流、控制成本」，那是路由。\n\n**取舍判断。** 协同是有代价的：多调一次模型就多一份延迟和费用，聚合逻辑本身也是要维护的。所以判断标准很直白——**只有当「答错的代价」明显高于「多调一次的成本」时才值得协同**。\n\n- 典型场景：合规条款判读、财务数据核对。\n- 反面场景：客服闲聊、文案生成。一个模型足够，硬上多模型协同纯属给系统加复杂度。\n\n**关联服务**：Amazon Bedrock（多模型统一调用）、AWS Step Functions（协同流程编排）、AWS Lambda（聚合逻辑与选择框架）。\n\n#### 什么时候必须人点头：人机协作系统\n\n**这条在问什么。** 有些动作不能让机器单独决定。\n\n金额超过阈值的退款、对外发布的公告、动生产数据的操作——这类事情无论模型多有把握，都要有一个人按下确认。这条讲的是**怎么把「人」正式编进工作流里**，而不是让人在旁边看着。\n\n按人介入的位置，有三种模式。这是本节最值得记住的分类：\n\n- **事前审批（human-in-the-loop）**：流程走到关键节点**停下来**，等人确认后再继续。适用于高风险、不可逆的动作。\n- **事中协作**：人和智能体一起推进同一件事。人补充模型判断不了的信息（比如「这个客户情况特殊」），模型接着往下做。\n- **事后复核（human-on-the-loop）**：先让智能体做完，人抽查结果，发现偏差就反馈修正。适用于低风险、高频、需要规模化处理的场景。**这是把「人工把关」和「处理效率」折中的办法。**\n\n**考纲点的技术实现是两件**：\n\n- 用 **Step Functions 编排审核与审批流程**。工作流停在等待状态，等一个回调信号，或等人工任务的完成事件，才能继续。\n- 用 **API Gateway 实现反馈收集机制**。把人的判断和修正收集回来，成为后续优化或重训的输入。\n\n官方统称这类设计为 **human augmentation patterns（人机增强模式）**。注意这个词的立场：**人的作用是增强机器，不是替代机器。**\n\n**一个容易忽略的点**：人工环节是流程里**最慢的一环**，而且会成为瓶颈。\n\n如果每一单都要人点，那「自动化」就没带来任何效率提升。所以关键判断是「**在哪里设卡**」，判断依据是「**这一步做错了，代价有多大、能不能撤回来**」。\n\n可撤回的低风险动作放手让机器做，不可撤回的高风险动作才设人工卡点。这个判断逻辑与域 3 的治理要求相通，也是场景题的常见考法。\n\n**关联服务**：AWS Step Functions（审批流编排、等待人工回调）、Amazon API Gateway（反馈收集接口）、Amazon Bedrock（协作式交互）、Amazon SNS / Amazon SES（通知审批人，常见配套）。\n\n#### 案例\n\n某金融机构做费用报销初审助手。\n\n智能体负责读发票、核对差旅标准、算应报金额——这些都能自动做。分歧点在于「**判定通过后自动打款**」这一步：\n\n- 金额小（比如 500 元以下）且完全符合标准的，自动通过。\n- 金额超过阈值、或触发了「发票疑似重复」这类规则的，流程停在审批节点，推给财务同事确认。\n\n这样设计的结果是：**九成的单子不用人碰，剩下那一成困难单子有人看**——效率提升和风险控制同时拿到了。\n\n#### 把工具接好：智能工具集成\n\n**这条在问什么。** 模型本身只会生成文本。要「做事」，它就得调工具——工具可以是一个 Lambda 函数、一个 API、一段数据库查询。\n\n这条讲的是**怎么把工具接得能让模型正确、可靠地
