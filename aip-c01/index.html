程。\n\n**关联服务**：AWS X-Ray（跨服务调用链追踪）、Amazon CloudWatch Logs（API 调用模式分析）、Amazon OpenSearch Service（向量查询优化）。\n\n#### 案例\n\n某 RAG 应用端到端延迟 6.5 秒。用 X-Ray 拆解后发现：API Gateway 0.1 秒，向量检索 2.8 秒，模型推理 3.2 秒，安全过滤 0.4 秒。向量检索的延迟几乎占了一半。优化索引参数并把返回文档数从 10 降到 5 后，检索延迟降到 0.9 秒，整体延迟降到 4.6 秒。\n\n#### 案例\n\n**💡 综合案例：一个实时翻译服务的性能调优**\n\n某公司用 GenAI 做实时文档翻译。用户上传文档，系统翻译后返回。上线后平均响应时间 12 秒，用户抱怨太慢。\n\n**降延迟。** 启用流式传输，用户上传后 1.5 秒就能看到第一段译文开始出现。虽然整篇翻译还是要 12 秒，但用户不用盯着空白页等了。\n\n**提检索速度。** 翻译系统用 RAG 检索术语表保持专业术语一致。术语表有 5 万条，检索延迟 1.8 秒。把向量索引参数从默认值调优后降到 0.6 秒。\n\n**调参数。** 翻译要求准确、不要创意发挥。把温度从默认 0.7 降到 0.1，top-p 从 0.95 降到 0.8。翻译一致性提升，术语漂移减少。\n\n**并行处理。** 长文档拆成段落，多段并行翻译，最后拼接。10 段的文档从串行 12 秒降到并行 3 秒。\n\n**端到端。** 用 X-Ray 确认瓶颈已从检索转移到模型推理。下一步计划对高频文档类型启用预计算。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「流式传输能降低总响应时间」 | 流式传输降低的是首字延迟（体感延迟），总生成时间不变 | 流式改善用户体验，不减少计算量 |\n| 「温度越低越好」 | 温度低到 0 输出完全确定，但创意场景需要多样性 | 温度按场景调：事实查询低温、创意生成高温 |\n| 「传统 Auto Scaling 直接用」 | GenAI 请求处理时间差异极大，CPU 使用率不能反映真实负载 | 按 Token 吞吐量或推理队列深度做伸缩策略 |\n| 「向量搜索总是比模型推理快」 | 大规模向量库的检索延迟可能比模型推理还长 | 检索优化（索引参数、结果数量、缓存）是性能优化的必做项 |\n| 「参数调好了就不用管了」 | 数据分布和用户行为会变化，参数需要持续 A/B 测试 | 参数优化是持续过程，不是一次性工作 |\n\n#### 记忆要点\n\n1. **流式传输**降体感延迟、**预计算**降真实延迟——两者组合使用效果最好。\n2. **温度**控制随机性、**top-p** 控制候选范围——先选模型再调参数。\n3. **Token 吞吐量**是 GenAI 伸缩的正确指标，CPU 使用率不可靠。\n4. **混合搜索**比单一搜索更准——语义搜索补意图、关键词搜索补精确匹配。\n5. **端到端优化**用 X-Ray 拆解——先找瓶颈在哪一段，再针对性优化。\n\n---"},{"h":"为 GenAI 应用实施监控系统","body":"#### 本节定位\n本节对应考纲任务声明 4.3「为 GenAI 应用实施监控系统」。\n\n> 官方原名：Implement monitoring systems for GenAI applications.\n\n前两个任务讲的是「怎么优化」。这个任务讲的是「怎么看到需要优化什么」。\n\nGenAI 应用的监控和传统应用有本质区别。传统应用看的是**系统指标**——CPU、内存、错误率。GenAI 应用还要看**模型行为指标**——幻觉率、回复偏差、Token 爆发模式。这些指标没有现成的监控工具，需要自己建。\n\n六个技能点按三个层次展开：先建全局视图（4.3.1~4.3.3），再监控工具和向量库（4.3.4~4.3.5），最后讲 GenAI 特有的故障模式（4.3.6）。\n\n#### 让所有指标都看得到：全面可观测性系统\n\n**这条在问什么。** GenAI 应用的可观测性要覆盖五个维度，不能只看其中一两个。\n\n| 维度 | 看什么 | 怎么看 |\n|---|---|---|\n| 运营指标 | 请求量、错误率、限流次数 | CloudWatch Metrics |\n| 性能跟踪 | 延迟分布（P50/P90/P99） | CloudWatch + X-Ray |\n| FM 交互跟踪 | 每次模型调用的输入输出详情 | Bedrock 模型调用日志 |\n| 业务影响指标 | 用户满意度、任务完成率 | 自定义 CloudWatch 指标 |\n| 自定义控制面板 | 把上述指标放到一个视图里 | CloudWatch Dashboard |\n\n**五个维度缺一个都不完整。** 只看运营指标（请求量、错误率），系统看起来一切正常。但用户可能投诉回复越来越差——这需要 FM 交互跟踪才能发现。只看性能（延迟），不看业务影响（用户满意度），可能延迟达标了但回复质量不行。**可观测性的核心不是「指标多」，而是「维度全」。**\n\n**自定义控制面板怎么设计？** 按角色分。运维看延迟和错误率——系统有没有问题。业务看任务完成率和用户满意度——花的钱值不值。安全看异常访问和内容违规——有没有被滥用。一个面板塞所有指标，谁都看不明白。给每个角色一个专属视图，每个视图不超过六组核心指标。\n\nCloudWatch Dashboard 支持跨账户和跨区域聚合。多区域部署的 GenAI 应用可以在一个面板里看到所有区域的指标，不用逐个区域切换。\n\n**重点是 FM 交互跟踪。** 传统应用不需要记录每次 API 调用的请求体和响应体。但 GenAI 应用需要——因为模型行为不确定，出问题时你需要回看「它收到了什么、给出了什么」才能定位原因。Bedrock 的模型调用日志（Model Invocation Logging）正是做这件事的：记录每次请求的完整提示词和完整回复。\n\n**关联服务**：Amazon CloudWatch（指标、仪表板）、AWS X-Ray（调用链追踪）、Amazon Bedrock 模型调用日志（Model Invocation Logging）。\n\n#### 看到传统监控看不到的东西：GenAI 专属监控系统\n\n**这条在问什么。** 传统监控工具看 CPU 正常、错误率为零，但用户投诉回复质量变差了——问题出在哪？\n\n这条讲的是 GenAI 独有的监控维度：\n\n- **Token 使用跟踪**：按时间、按业务线、按模型维度看 Token 消耗。发现某一天某条业务线的 Token 用量突然翻倍，可能是提示词模板被改了。\n- **提示有效性**：同一个提示模板，生成质量稳不稳定。质量波动说明提示词有边界情况没覆盖到。\n- **幻觉率**：模型生成了不在知识库里的事实的频率。需要自建检测逻辑（通常用另一个模型或规则检查）。\n- **回复偏差**：模型的回复风格或内容是否偏离了预期。比如客服助手突然开始用非正式语气。\n- **Token 爆发异常检测**：某个时段 Token 用量异常飙升，可能是恶意用户在做提示注入攻击。\n- **Bedrock 模型调用日志**：记录每次请求和回复的详细内容，供事后分析。\n- **成本异常检测**：FM 调用费用突然上涨，用 CloudWatch Anomaly Detection 自动告警。\n\n**怎么检测幻觉率？** 没有一个现成的指标叫「幻觉率」——需要自建检测逻辑。常见做法有两种：一是用另一个模型（LLM-as-a-Judge）检查回复是否和检索到的文档一致；二是用规则检查回复里是否包含知识库中不存在的实体或数字。检测结果作为自定义指标推到 CloudWatch，设阈值告警。\n\n**关联服务**：Amazon CloudWatch（自定义指标、异常检测、告警）、Amazon Bedrock（模型调用日志、使用配额指标）。\n\n#### 案例\n\n某天运维团队收到 CloudWatch 告警：Bedrock 调用费用比前一天高 4 倍。查模型调用日志发现，一个新上线的功能在循环里反复调用模型（智能体没有设停止条件）。修复后费用恢复正常。\n\n#### 不只是看数据，还要能行动：集成可观测性解决方案\n\n**这条在问什么。** 指标收集了一堆，还要能变成可执行的决策。\n\n这条讲的是把运营数据、业务数据、合规数据整合到一个可操作的视图里：\n\n- **运营指标控制面板**：一屏看到所有关键指标。按角色定制——运维看延迟和错误率，业务看任务完成率，安全看异常访问。\n- **业务影响力可视化**：把 FM 的技术指标翻译成业务语言。比如「模型准确率从 92% 降到 85%」对应的是「客服一次解决率从 78% 降到 65%」。\n- **合规性监控**：持续检查模型行为是否符合内部政策和外部法规。\n- **取证可追溯性和审计日志**：出事后能追溯到每一步的决策过程。CloudTrail 记录谁在什么时候改了什么配置，模型调用日志记录模型给了什么回复。\n- **用户互动跟踪和模型行为模式跟踪**：发现模型行为随时间变化的趋势。\n\n**为什么强调「可执行」？** 仪表板上一堆曲线，看到了又怎样？关键是每个指标异常时都有明确的行动路径。比如：Token 用量突增 → 检查是否有新功能上线或提示词模板变更；幻觉率上升 → 检查知识库最近是否有文档更新；延迟飙升 → 检查是否触发了限流或模型版本变更。把「指标 → 原因 → 行动」的映射关系写进运维手册，仪表板才能真正发挥作用。\n\n**合规性监控**也是这一层要做的事。有些行业法规要求能追溯每一次 AI 决策的依据。CloudTrail 记录了谁在什么时候改了什么配置（模型版本、提示词模板、Guardrails 规则）。模型调用日志记录了模型给了什么回复。两者结合，就能还原「这个回复是基于什么版本的模型、什么版本的提示词、什么版本的知识库生成的」。\n\n**关联服务**：Amazon CloudWatch Dashboard（多维度仪表板）、AWS CloudTrail（审计日志）、Amazon S3（日志长期存储）。\n\n#### 工具也要被监控：工具性能框架\n\n**这条在问什么。** 智能体调用外部工具是域 2 讲的重点。这条补上了运营视角：工具调得好不好、快不快、有没有问题。\n\n四个监控维度：\n\n- **调用模式跟踪**：哪些工具被调用最多、什么时间段调用最密集、有没有工具从来没被调用过（可能是描述写得不对，模型不知道什么时候该用）。\n- **性能指标收集**：每个工具的延迟、成功率、超时率。一个工具经常超时，会拖慢整个智能体链路。\n- **工具调用可观测性和多智能体协调跟踪**：多个智能体协同工作时，追踪每个智能体调了哪些工具、顺序是什么、结果怎么传递的。\n- **使用率基准的异常检测**：某个工具的调用频率突然变化，可能说明模型行为发生了偏移。\n\n**为什么要单独监控工具？** 智能体的回复质量取决于工具返回的数据。一个工具延迟变高了，智能体超时放弃调用，回复就缺了一块信息。一个工具返回了过期数据，智能体基于过期数据回复，用户拿到的就是错的。这类问题不会在模型层面报错，只有单独监控每个工具才能发现。\n\n**多智能体协调跟踪**是另一个重点。多个智能体协同工作时，每个智能体调了哪些工具、顺序是什么、一个智能体的输出怎么传给下一个——这条链路要能在 X-Ray 里看到。如果某个智能体的工具调用失败了，后续智能体拿到的是空数据，最终回复就是错的。追踪链路能快速定位是哪个环节、哪个工具出了问题。\n\n**关联服务**：AWS X-Ray（工具调用链追踪）、Amazon CloudWatch（工具延迟和成功率指标）。\n\n#### 向量库也需要运维：向量存储操作管理\n\n**这条在问什么。** 向量库不是建完就不用管了。文档在更新，索引在膨胀，查询性能在下降。\n\n三件要做的事：\n\n- **向量数据库性能监控**：跟踪查询延迟、吞吐量、索引大小。随着文档量增长，性能会逐渐下降——需要提前发现。\n- **自动化索引优化例程**：定期重建或优化索引。比如删除已过期文档的向量、合并碎片化的索引段。\n- **数据质量验证流程**：定期抽样检查向量质量。文档更新后对应的向量有没有同步更新？嵌入模型换了之后旧向量还有没有意义？\n\n**什么时候需要重建索引？** 三种情况：一是文档大批量更新后（比如季度合规文档换版），旧向量和新文档不匹配；二是换了嵌入模型（不同模型生成的向量不兼容，必须全量重算）；三是索引碎片化严重导致查询变慢。重建索引的成本不低（要重新算所有文档的向量），所以平时做好增量维护（新增文档算向量、删除文档清向量）比定期全量重建更经济。\n\n**数据质量验证**具体怎么做？定期从向量库里随机抽一批向量，用对应的源文档重新生成向量，对比两者的相似度。如果相似度低于阈值，说明这些向量已经过期或损坏。另一种做法是建一组测试查询，定期跑检索，检查返回的文档是否仍然相关。\n\n**一个必须理解的点**：**向量库的数据质量直接决定 RAG 的效果。** 向量过期了、损坏了、和源文档不一致了，检索出来的都是错的——模型拿着错的上下文生成回复，幻觉率必然上升。所以向量库运维不是可选的，是必做的。\n\n**关联服务**：Amazon OpenSearch Service（向量库性能指标）、Amazon CloudWatch（自定义监控告警）、AWS Lambda（定时索引维护任务）。\n\n#### 这些问题传统监控发现不了：FM 专属故障排除框架\n\n**这条在问什么。** GenAI 系统有一类故障是传统 ML 和传统 Web 应用里不存在的。系统没崩、API 没报错、延迟正常——但回复质量悄悄变差了。\n\n考纲点了四种 GenAI 独有的排查手段：\n\n- **黄金数据集（Golden Dataset）检测幻觉**：准备一批已知正确答案的测试问题，定期用系统回答。如果回答和标准答案的偏差超过阈值，说明模型行为出了问题。这是最直接的幻觉检测方法。\n- **输出差异对比**：对比同一个问题在不同时间点的回复。如果回复大幅变化，可能是提示词模板被改了、知识库数据更新了、或者模型版本变了。\n- **推理路径跟踪**：对于智能体系统，追踪它的每一步推理和工具调用。发现逻辑错误的位置——是推理出了问题，还是工具返回了错误数据。\n- **专用可观测性管道**：把以上三种检测手段自动化，形成持续运行的监控流程。\n\n**这条和「GenAI 专属监控」（4.3.2）的区别**：前者是「持续盯着看」，这条是「发现异常后怎么查」。一个是监控，一个是排障。\n\n**专用可观测性管道**怎么建？把黄金数据集测试、输出差异对比、推理路径跟踪三件事用 Step Functions 编排成一个自动化流程。每天凌晨跑一次，结果推到 CloudWatch。任何一项指标超过阈值就触发告警，同时把详细的对比报告存到 S3 供人工排查。这样就把人工排障变成了半自动化——系统帮你发现问题和缩小范围，人来做最终判断。\n\n**关联服务**：Amazon Bedrock 模型评估（自动化评估框架）、AWS Lambda（定时触发黄金数据集测试）、Amazon CloudWatch Logs（输出差异分析）、AWS X-Ray（推理路径追踪）。\n\n#### 案例\n\n某法律助手上线两周后用户投诉增多。错误率和延迟指标一切正常。运维用黄金数据集跑了一遍测试，发现合同条款类问题的准确率从 91% 降到 72%。追查后发现知识库做了一次文档更新，但旧文档的向量没有被清除，导致检索经常混入过期条款。\n\n#### 案例\n\n**💡 综合案例：一个客服系统的可观测性建设**\n\n某客服系统上线两个月，老板问了三个问题：这个系统每月花多少钱？用户满不满意？比人工客服好在哪？运维团队一个都答不上来。\n\n**第一步，建全局视图。** 在 CloudWatch 上建了一个仪表板，放五组指标：日请求量和错误率（运营）、P50/P90 延迟（性能）、每次调用的 Token 数（FM 交互）、用户评分（业务影响）。老板每周看这一个页面就够了。\n\n**第二步，开 GenAI 专属监控。** 启用 Bedrock 模型调用日志，按 10% 采样。建了三个自定义指标：Token 日消耗量、回复中出现「我不确定」的比例（间接幻觉指标）、单次对话平均轮次。设了一个成本异常告警——日费用超过前七天均值两倍就报警。\n\n**第三步，工具和向量库监控。** 客服系统调用三个工具（查订单、查物流、查退货政策）。给每个工具加了延迟和成功率指标。向量库（知识库文档 8000 篇）加了查询延迟和索引大小监控。\n\n**第四步，建黄金数据集。** 准备了 50 个常见问题和标准答案。每天凌晨自动跑一遍，对比当天回复和标准答案的偏差。偏差超过 15% 就触发告警。\n\n上线一周后，黄金数据集告警触发——退货政策类问题准确率从 88% 降到 67%。查模型调用日志发现知识库刚更新了退货条款，但旧条款的向量没清除，检索经常混入过期内容。清除后恢复正常。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「传统 APM 工具能监控 GenAI」 | 传统 APM 看系统指标，看不到幻觉率、Token 爆发、回复偏差 | GenAI 需要专属监控维度，在传统 APM 之上额外建 |\n| 「模型调用日志太贵，不用开」 | 没有日志就无法回溯问题。出事后才发现没有日志，代价更大 | 日志可以按采样率控制成本，但不能完全关闭 |\n| 「向量库建好就不用管了」 | 文档更新后向量不同步会导致检索质量下降 | 向量库需要持续维护：索引优化、过期清理、质量验证 |\n| 「黄金数据集测一次就够了」 | 模型行为会随时间漂移（数据更新、模型版本变化、提示词修改） | 黄金数据集测试要持续自动运行，不是一次性的 |\n| 「工具从来不报错，就不用监控」 | 工具可能没报错但返回了不完整或过期的数据 | 工具监控不只看成功率，还要看数据质量和调用模式变化 |\n\n#### 记忆要点\n\n1. **GenAI 可观测性五维度**：运营指标、性能跟踪、FM 交互跟踪、业务影响、自定义仪表板。\n2. **Bedrock 模型调用日志**是 GenAI 专属监控的核心——记录每次请求的完整输入输出。\n3. **黄金数据集**是检测幻觉和质量漂移的最直接手段——定期自动运行，不是一次性的。\n4. **向量库运维三件事**：性能监控、索引优化、数据质量验证——向量过期是幻觉率上升的常见原因。\n5. **域 4 监控 vs 域 5 排障**：「盯着看」是域 4，「出了问题查」是域 5。\n\n---"}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| Token 效率系统（4.1.1） | 六种省 Token 手段的适用场景 | ⭐⭐⭐ | 场景题——给一个提示词膨胀场景，选哪种手段 |\n| 经济高效模型选择（4.1.2） | 分级使用的判据与分级本身的成本 | ⭐⭐ | 对比题——按日调用量和复杂度选策略 |\n| 智能缓存系统（4.1.4） | 语义缓存 vs 提示缓存的分工 | ⭐⭐⭐ | 概念题——两种缓存的适用条件和边界 |\n| 响应灵敏 AI 系统（4.2.1） | 流式传输降体感延迟、预计算降真实延迟 | ⭐⭐ | 场景题——按「用户在不在线等」选方案 |\n| FM 性能增强（4.2.4） | 温度 / top-k / top-p 的作用及取舍 | ⭐⭐ | 参数配置题——按场景选参数值 |\n| GenAI 专属监控（4.3.2） | Bedrock 模型调用日志 + 成本异常检测 | ⭐⭐⭐ | 场景题——问该看哪个指标 |\n| FM 专属故障排除（4.3.6） | 黄金数据集检测幻觉 + 推理路径跟踪 | ⭐⭐⭐ | 排障题——系统指标正常但回复变差，怎么查 |","services":"| 服务 | 主要用途 | 涉及 Task |\n|---|---|---|\n| Amazon Bedrock | 按需推理、预置吞吐量、流式响应、提示缓存、批量推理、模型调用日志、模型评估 | 4.1 / 4.2 / 4.3 |\n| Amazon CloudWatch | Token 用量监控、延迟基准、异常检测、成本告警、自定义仪表板 | 4.1 / 4.2 / 4.3 |\n| AWS X-Ray | 跨服务调用链追踪、推理路径分析、工具调用可观测性 | 4.2 / 4.3 |\n| Amazon SageMaker | 自托管端点、Auto Scaling、模型评估 | 4.1 / 4.2 |\n| Amazon OpenSearch Service | 向量搜索优化、混合搜索、向量库性能监控 | 4.2 / 4.3 |\n| AWS Lambda | 批处理编排、定时任务（黄金数据集测试、索引维护）、工具实现 | 4.1 / 4.2 / 4.3 |\n| AWS CloudTrail | 配置变更审计日志 | 4.3 |\n| Amazon S3 | 日志长期存储、批量推理数据 | 4.1 / 4.3 |\n| Amazon ElastiCache | 语义缓存后端存储 | 4.1 |\n| AWS Cost Explorer | 成本分析与趋势 | 4.1 |"}},{"domain":5,"name":"测试、验证与故障排除","weight":"11%","practice":[{"id":"D5-001","d":5,"t":"single","q":"你的 GenAI 应用需要评估 FM 输出的质量，关注\"生成的回答是否与事实一致\"。应重点评估哪个指标？","o":[{"l":"A","t":"流畅性（Fluency）"},{"l":"B","t":"事实准确率（Factual Accuracy）"},{"l":"C","t":"相关性（Relevance）"},{"l":"D","t":"一致性（Consistency）"}],"a":["B"],"e":"**正确答案：B。** 看 factual accuracy（事实准确率）——输出内容与已知事实是否吻合。\n\n**为什么对：** 题干给的定义就是\"生成的回答是否与事实一致\"，这正好是事实准确率衡量的对象。它也是发现 hallucination（幻觉，模型编造不存在的信息）最直接的那个指标。\n\n**其他选项为什么错：**\n- A. 流畅性（Fluency）：衡量句子通不通顺、像不像人话，跟内容真假无关——一句编得很顺的假话，流畅性照样满分。\n- C. 相关性（Relevance）：衡量回答有没有对上问题。答非所问才叫相关性差，但对题也可能全答错。\n- D. 一致性（Consistency）：衡量同一问题多次回答是否稳定。每次都错得一模一样，一致性也能很高。","s":"源#298"},{"id":"D5-002","d":5,"t":"single","q":"一家公司想在生产部署前系统评估两个基础模型（Claude 和 Nova）在客服场景中的表现。哪种方法最合适？","o":[{"l":"A","t":"人工快速浏览两个模型的随机输出"},{"l":"B","t":"使用 Amazon Bedrock 模型评估 + A/B 测试"},{"l":"C","t":"只根据模型文档的基准分数决定"},{"l":"D","t":"先部署到生产再观察用户反馈"}],"a":["B"],"e":"**正确答案：B。** 用 Amazon Bedrock Model Evaluations（Bedrock 模型评估）跑自动评估与人工评估，再配合 A/B 对比。\n\n**为什么对：** 题干两个限定——\"系统评估\"和\"生产部署前\"。Model Evaluations 能让两个模型在同一批客服场景数据上各跑一遍，给出可比分维度的结果；需要人判断的部分也支持人工评审工作流，上线前就能拿到结论。\n\n**其他选项为什么错：**\n- A. 人工快速浏览随机输出：抽样随意、样本量小，结论既不可比也没法复现。\n- C. 只看模型文档的基准分数：公开基准是通用场景，反映不了你自己客服业务的实际表现。\n- D. 先上生产再观察用户反馈：等于拿真实用户做实验，出问题直接由业务承担代价。","s":"源#299"},{"id":"D5-003","d":5,"t":"single","q":"你的 RAG 应用需要评估\"检索到的文档是否真的帮助模型回答正确\"。应使用哪种评估方法？","o":[{"l":"A","t":"RAG 评估（检索质量 + 生成质量）"},{"l":"B","t":"只评估生成文本的 BLEU 分数"},{"l":"C","t":"只统计 API 调用次数"},{"l":"D","t":"人工抽查 5 个回答"}],"a":["A"],"e":"**正确答案：A。** 做 RAG 评估：检索侧看相关性和召回率，生成侧看最终答案质量，两段分开评。\n\n**为什么对：** 题干问的是\"检索到的文档有没有帮上忙\"，这个问题横跨两段——既要知道检索本身好不好，也要知道最终答案对不对。只有拆成两段分别评，才能判断问题出在\"没检索到\"还是\"检索到了却没用好\"。\n\n**其他选项为什么错：**\n- B. 只看生成文本的 BLEU 分数：BLEU 衡量的是与参考文本的用词重合度，既不看检索质量，也不适合开放式问答。\n- C. 只统计 API 调用次数：这是用量指标，跟效果好坏没有关系。\n- D. 人工抽查 5 个回答：样本量太小，而且只看到最终结果，定位不到是检索的锅还是生成的锅。","s":"源#300"},{"id":"D5-004","d":5,"t":"single","q":"你想验证一个 AI 代理（Agent）是否真的完成了用户的任务。应重点评估哪个指标？","o":[{"l":"A","t":"任务完成率"},{"l":"B","t":"模型推理延迟"},{"l":"C","t":"嵌入维度"},{"l":"D","t":"上下文窗口大小"}],"a":["A"],"e":"**正确答案：A。** 看任务完成率（task success rate）——在评测集里，Agent 真正把事情办成的比例。\n\n**为什么对：** 题干问的是\"是否真的完成了用户的任务\"，这是结果导向的判断。任务完成率直接数\"办成了多少件\"，是 Agent 类系统最核心的指标。\n\n**其他选项为什么错：**\n- B. 模型推理延迟：这是性能指标，回答\"快不快\"，不是\"做没做成\"。\n- C. 嵌入维度：这是向量表示的尺寸参数，跟任务是否完成无关。\n- D. 上下文窗口大小：这是模型的容量上限，同样不反映任务完成情况。","s":"源#301"},{"id":"D5-005","d":5,"t":"single","q":"用户报告长文档问答时模型报错\"输入超出最大长度\"。最可能的原因是什么？应如何解决？","o":[{"l":"A","t":"上下文窗口溢出；使用动态分块策略或摘要"},{"l":"B","t":"模型温度过高；调低温度"},{"l":"C","t":"嵌入维度不匹配；重新生成嵌入"},{"l":"D","t":"API 密钥过期；更换密钥"}],"a":["A"],"e":"**正确答案：A。** 输入超过了模型的 context window（上下文窗口）上限；改用动态分块，或先做摘要把输入压短。\n\n**为什么对：** \"超出最大长度\"这个报错本身就是 token 超限的提示——提示词加上输入内容超过了单次调用的上限。分块把长文档切开分别处理，摘要则先把内容压短，两条路都是把输入降到窗口以内。\n\n**其他选项为什么错：**\n- B. 模型温度过高：温度影响的是输出随机性，不会产生长度超限的报错。\n- C. 嵌入维度不匹配：维度不匹配报的是向量相关的错误，跟输入长度无关。\n- D. API 密钥过期：密钥失效会报认证或权限错误（通常是 403），不是长度超限。","s":"源#302"},{"id":"D5-006","d":5,"t":"single","q":"你的 RAG 系统检索结果质量下降，怀疑是文档更新后嵌入未同步。应优先检查什么？","o":[{"l":"A","t":"嵌入质量诊断和漂移监控"},{"l":"B","t":"模型温度设置"},{"l":"C","t":"API 网关限流配置"},{"l":"D","t":"前端页面样式"}],"a":["A"],"e":"**正确答案：A。** 先做嵌入质量诊断，并检查有没有发生 embedding drift（嵌入漂移）。\n\n**为什么对：** 题干的怀疑方向是\"文档更新了但向量没跟上\"，属于检索侧问题。诊断嵌入质量能确认新文档的向量是否生成正确、有没有同步进索引；漂移监控则能看出新旧向量的分布是否已经明显偏离。\n\n**其他选项为什么错：**\n- B. 模型温度设置：温度管的是生成阶段的随机性，不影响检索结果。\n- C. API 网关限流配置：限流会导致请求被拒或变慢，不会让检索结果变差。\n- D. 前端页面样式：纯展示层，跟检索质量无关。","s":"源#303"},{"id":"D5-007","d":5,"t":"single","q":"你想追踪每个提示在系统中的完整处理链路，定位是\"提示有问题\"还是\"模型调用有问题\"。应使用什么工具？","o":[{"l":"A","t":"AWS X-Ray（提示可观测性管道）"},{"l":"B","t":"S3 生命周期策略"},{"l":"C","t":"Amazon Route 53"},{"l":"D","t":"AWS WAF"}],"a":["A"],"e":"**正确答案：A。** 用 AWS X-Ray 搭提示可观测性，把提示从进入系统到模型调用的整条链路串起来。\n\n**为什么对：** 题干要的是\"完整链路\"和\"定位是哪一环出问题\"。X-Ray 做的就是分布式追踪——每个环节耗时多少、在哪一步失败都能看到，配合日志就能区分是提示本身写得有问题，还是模型调用环节出的错。\n\n**其他选项为什么错：**\n- B. S3 生命周期策略：对象存储的过期与转储规则，不做链路追踪。\n- C. Amazon Route 53：DNS 解析服务，不做链路追踪。\n- D. AWS WAF：Web 应用防火墙，拦的是恶意流量，不做链路追踪。","s":"源#304"},{"id":"D5-008","d":5,"t":"single","q":"你在发布模型新版本前，想验证它不会比旧版本产生更多幻觉。应如何验证？","o":[{"l":"A","t":"使用合成用户工作流 + 幻觉率验证 + 回复一致性检查"},{"l":"B","t":"随机部署到生产观察"},{"l":"C","t":"只检查代码能否编译"},{"l":"D","t":"查看模型参数量"}],"a":["A"],"e":"**正确答案：A。** 用合成的用户工作流模拟真实交互，量化幻觉率，并检查回复的一致性。\n\n**为什么对：** 题干要\"发布前验证不比旧版本差\"。合成工作流能在不上线的前提下复现真实交互；幻觉率给出可比的量化数字；一致性检查确认输出没有明显漂移。三者合起来才是一次可比的上线前验证。\n\n**其他选项为什么错：**\n- B. 随机部署到生产观察：拿真实用户试错，出问题的代价直接由业务承担。\n- C. 只检查代码能否编译：编译通过只说明没有语法错误，跟模型输出质量毫无关系。\n- D. 查看模型参数量：参数量反映的是模型规模，推不出幻觉率高低。","s":"源#305"},{"id":"D5-009","d":5,"t":"single","q":"你想量化 RAG 检索组件的性能——\"检索到的内容是否与用户问题相关\"。应测量哪个指标？","o":[{"l":"A","t":"相关性评分 + 检索延迟"},{"l":"B","t":"模型输出 Token 数"},{"l":"C","t":"嵌入向量维度"},{"l":"D","t":"冷启动时间"}],"a":["A"],"e":"**正确答案：A。** 测相关性评分（retrieval relevance），同时记录检索延迟。\n\n**为什么对：** 题干问的是\"检索到的内容是否与问题相关\"，对应的量化指标就是相关性评分——它直接给检索结果和问题之间的匹配程度打分。配上延迟一起看，才知道质量提升有没有以变慢为代价。\n\n**其他选项为什么错：**\n- B. 模型输出 token 数：这是生成侧的输出量，不反映检索结果好不好。\n- C. 嵌入向量维度：这是向量的尺寸参数，跟检索相关性无关。\n- D. 冷启动时间：这是服务启动的性能指标，不反映检索质量。","s":"源#306"},{"id":"D5-010","d":5,"t":"single","q":"应用调用 Bedrock API 时返回 400 错误。最可能的原因是什么？应如何排查？","o":[{"l":"A","t":"请求格式错误；检查错误日志、请求验证、回复分析"},{"l":"B","t":"磁盘空间不足；清理磁盘"},{"l":"C","t":"DNS 解析失败；检查域名"},{"l":"D","t":"网络断连；重启路由器"}],"a":["A"],"e":"**正确答案：A。** 400 表示请求本身有问题；查错误日志里返回的具体信息，检查请求体结构和参数取值。\n\n**为什么对：** HTTP 400 Bad Request 的含义就是服务端解析不了这个请求——最常见的是 JSON 结构不对、必填参数缺失、或参数取值超出允许范围。Amazon Bedrock 的错误响应里会给出具体字段，照着查最快。\n\n**其他选项为什么错：**\n- B. 磁盘空间不足：这是本地或实例的资源问题，不会让 API 返回 400。\n- C. DNS 解析失败：域名解析不通会在建立连接阶段就失败，根本拿不到 HTTP 状态码。\n- D. 网络断连：同样是在建立连接阶段失败，不会产生 400 这个响应码。","s":"源#307"},{"id":"D5-011","d":5,"t":"single","q":"你想让用户对 AI 的回答质量持续反馈，并据此改进模型。应实施什么机制？","o":[{"l":"A","t":"反馈界面 + 模型输出评级系统 + 注释工作流"},{"l":"B","t":"提高模型温度"},{"l":"C","t":"增加上下文窗口"},{"l":"D","t":"使用更大的嵌入模型"}],"a":["A"],"e":"**正确答案：A。** 在界面上加反馈入口，让用户给回答打分，再把有问题的样本沉淀成标注数据。\n\n**为什么对：** 题干要\"持续反馈\"并且\"据此改进\"。反馈界面让意见收得上来，评级把主观感受变成可统计的分数，标注工作流则把问题样本整理成后续可用于微调或评测的数据集——三步串起来才形成闭环。\n\n**其他选项为什么错：**\n- B. 提高模型温度：温度越高输出越随机，只会让质量更不稳定。\n- C. 增加上下文窗口：能让模型看到更多内容，但跟\"收集用户反馈\"完全是两回事。\n- D. 使用更大的嵌入模型：改善的是向量表示质量，同样不解决反馈收集的问题。","s":"源#308"},{"id":"D5-012","d":5,"t":"single","q":"你需要确保模型更新后输出质量不回退。应建立什么机制？","o":[{"l":"A","t":"持续评估工作流 + 模型输出回归测试"},{"l":"B","t":"删除旧版本模型"},{"l":"C","t":"只记录 API 调用量"},{"l":"D","t":"关闭监控"}],"a":["A"],"e":"**正确答案：A。** 建一套持续评估流程，每次更新都跑一遍回归测试，跟上一版对比。\n\n**为什么对：** \"不回退\"本质是个对比问题——必须有一个固定评测集，新旧版本各跑一次，指标不下降才算通过。持续评估工作流保证每次更新都会跑，回归测试则提供可比的结果。\n\n**其他选项为什么错：**\n- B. 删除旧版本模型：删掉旧版本反而失去了对比基线，更没法判断是否回退。\n- C. 只记录 API 调用量：调用量是用量数据，反映不了输出质量。\n- D. 关闭监控：关掉监控就完全失去发现回退的能力。","s":"源#309"}],"sections":[{"h":"为生成式人工智能实施评估系统","body":"前四个域把一个 GenAI 应用从设计、集成、安全、优化全走了一遍。这个域问的是最后两件事：**你怎么知道它跑得好不好？跑出问题了你怎么查？**\n\n**为什么权重只有 11%，但不能跳过？** 因为这个域的知识点是前四域的「检验层」。你在域 1 选了 RAG 架构，在域 2 接好了检索链路，在域 3 加了 Guardrails，在域 4 做了缓存——到了域 5，你要回答：RAG 检索回来的文档真的相关吗？Guardrails 有没有误杀正常内容？缓存有没有返回过时答案？\n\n**本域和传统 ML 测试的核心区别是什么？** 传统 ML 有标准答案：预测准确率、F1、AUC 这些数字摆在那里。GenAI 的输出是自由文本，没有唯一正解。你问它「总结这份合同的风险」，一百个人给一百种答案，哪个算对？\n\n所以 GenAI 评估需要新方法——让另一个模型来打分、让人来标注、用检索质量反推生成质量。这正是本域前半部分讲的内容。\n\n**后半部分讲故障排除。** GenAI 应用的故障模式和传统服务不同。传统服务报 500 错误你看日志就知道哪行代码崩了。GenAI 应用的典型故障是：模型没报错，但回答越来越离谱——可能是上下文窗口塞满了，可能是嵌入模型漂移了，可能是提示词被改坏了。这类故障不会触发告警，只有用户反馈才暴露。\n\n**学这个域建议抓一条线：先搞清「什么算好」，再搞清「坏了怎么查」。** 任务 5.1 回答前者，任务 5.2 回答后者。两者的共同底层是可观测性——看不到的东西你既评不了也查不了。\n\n> 📌 **本域内部的学习顺序建议**：按 5.1 → 5.2 读。5.1 的九个技能点按「评什么 → 怎么评 → 谁来评 → 持续评 → 上线前验」的逻辑串起来。5.2 的五个技能点按故障类型排列：内容处理 → API 集成 → 提示 → 检索 → 提示维护。先建立「什么是好的」的判断框架，排障时才知道偏离了什么。\n\n#### 本节定位\n本节对应考纲任务声明 5.1「为生成式人工智能实施评估系统」。\n\n> 官方原名：Implement evaluation systems for GenAI.\n\n这个任务有九个技能点，是本域的大头。它回答的核心问题是：**怎么量化一个 GenAI 应用的「好」？**\n\n传统 ML 的评估链路很清晰：有测试集、有标签、有指标公式，算一遍就出数字。GenAI 不一样——生成的文本没有唯一标准答案，评估本身就是一件需要设计的事。\n\n本任务的九个技能点可以分成四组理解：\n\n| 组 | 解决什么问题 | 对应技能点 |\n|---|---|---|\n| **评什么** | 定义评估维度和指标 | 全面评估框架（5.1.1） |\n| **怎么评** | 自动评估、人工评估、混合评估 | 系统化模型评估（5.1.2）/ 全面评估系统（5.1.5）/ 检索质量测试（5.1.6）/ 智能体性能（5.1.7） |\n| **谁来评** | 用户反馈、质量保证团队 | 用户中心评估（5.1.3）/ 质量保证流程（5.1.4） |\n| **报给谁、上线前查什么** | 结果可视化、部署验证 | 报告系统（5.1.8）/ 部署验证（5.1.9） |\n\n#### 超越传统指标：全面评估框架\n\n**这条在问什么。** 传统 ML 用准确率（Accuracy）和 F1 就能判好坏。GenAI 的输出是自然语言，一道题可以有无数种正确回答。你需要一套新维度来衡量「生成质量」。\n\n考纲给了四个核心维度。它们分别衡量输出的不同方面：\n\n- **相关性（Relevance）**：回答和用户问题相关吗？有没有跑题？这是最基础的维度——答非所问的输出，再流畅也没用。\n- **事实准确率（Factual Accuracy）**：回答里的事实正确吗？有没有编造？这是幻觉（Hallucination）检测的基础指标。\n- **一致性（Consistency）**：同一类问题，模型的回答风格、质量、口径是否稳定？还是说今天说 A、明天说 B？一致性差意味着模型输出不可预测，用户无法信赖。\n- **流畅性（Fluency）**：回答的语言是否自然通顺？有没有断句、重复、逻辑不连贯？\n\n**为什么不能只看一个维度？** 一个幻觉严重但语言流畅的回答，会被用户当成正确答案——这比不流畅但正确的回答危害更大。所以四个维度必须一起看。\n\n**和传统 ML 指标的关系。** 传统指标（Accuracy、F1、AUC）衡量的是「选对了没有」，适用于分类和回归。GenAI 的指标衡量的是「说得好不好」，需要语义层面的判断。两套指标不互相替代——如果你的 GenAI 应用有分类子任务（比如意图识别），那分类子任务仍然用传统指标。\n\n**关联服务**：Amazon Bedrock 模型评估（Model Evaluation，提供自动化和人工两种评估模式）。\n\n#### 案例\n\n某法律咨询平台用 GenAI 生成合同摘要。只看流畅性会漏掉关键条款被遗漏的问题；只看事实准确率会忽略摘要跑题的情况。四维度一起看，才能发现「流畅但遗漏了免责条款」这类隐蔽缺陷。\n\n**怎么把这四个维度落成工程实践？** 每个维度需要不同的评估手段。相关性和流畅性可以用自动化指标初筛——BERTScore 能衡量语义相似度，困惑度（Perplexity）能衡量语言自然程度。但事实准确率和一致性很难纯自动化判断——需要人工标注或让另一个模型做裁判。\n\n实际操作时，建议先把四个维度落成评分卡（Evaluation Rubric）。每个维度定义 1~5 分的评分标准。比如事实准确率：5 分＝全部事实有据可查；3 分＝部分事实无法验证但不矛盾；1 分＝包含明显编造。有了评分卡，无论是人工评审还是 LLM-as-a-Judge，判断口径才能一致。\n#### 找到最佳配置：系统化模型评估\n\n**这条在问什么。** 选了一个模型之后，你还要决定温度设多少、上下文窗口开多大、用不用缓存、要不要加 Guardrails。这些配置的组合空间很大，不能凭感觉选。这条讲的是怎么**系统化地**找到最优配置。\n\n考纲给了四条路径：\n\n**Amazon Bedrock 模型评估。** 这是 AWS 的托管评估服务。它支持两种模式：自动化评估（用内置指标跑基准数据集）和人工评估（组建评估团队对输出打分）。自动化模式适合大批量初筛；人工模式适合语义层面的精细判断，比如「这个回答是否专业」。\n\n**A/B 测试和金丝雀测试（Canary）。** A/B 测试把流量分成两组，一组走旧配置，一组走新配置，对比业务指标。金丝雀测试是先把 5% 的流量切到新配置，观察没问题再全量切。两者的区别：A/B 测试看「哪个更好」，金丝雀测试看「新的会不会炸」。\n\n**多模型评估。** 不确定该用哪个模型时，让几个候选模型在同一批测试数据上跑，横向比较。Amazon Bedrock 支持在同一个评估任务里跑多个模型。\n\n**成本性能分析。** 评估不只看质量——Token 效率、延迟-质量比率、业务成果（比如客服满意度提升了多少）都要纳入。选一个质量稍低但成本只有十分之一的模型，在很多场景下是更优解。\n\n**取舍判断。** A/B 测试需要足够的流量才有统计意义。日均请求量只有几百的应用，用 A/B 测试得不出可靠结论。这种情况下，先用自动化评估缩小候选范围，再让领域专家人工评估少量样本，反而更实际。\n\n**关联服务**：Amazon Bedrock 模型评估（自动化+人工评估）、Amazon CloudWatch（指标对比看板）。\n\n**什么时候用哪种评估方式？** 如果你有足够流量（日均万级请求以上），用 A/B 测试——结论最可靠。如果流量不够但候选模型多，用 Bedrock 模型评估的自动化模式大批量跑——先排除明显不行的。如果最终候选只剩两三个，用人工评估精细判断。\n\n金丝雀测试适合一个特定场景：你已经确定要换新版本，但怕大规模上线出问题。先放 5% 的流量跑一天，盯着错误率和质量指标。没异常就逐步放量。它不是选型工具，是上线保险。\n#### 让用户说了算：用户中心评估\n\n**这条在问什么。** 模型质量最终由用户体验决定。自动化指标再好看，用户觉得不好用就是不好用。这条讲的是怎么把用户反馈系统化地收进评估循环。\n\n三条实现路径：\n\n**反馈界面。** 最直接的做法——在每个回答下面放「有用/没用」按钮。关键是反馈要能和原始请求关联：用户点了「没用」，你得知道他问的是什么、模型答的是什么、当时用的是哪个模型版本和哪组参数。\n\n**模型输出评级系统。** 比二选一更精细的反馈。让用户给回答打分（1~5 星），或者标注具体问题（「答非所问」「太长了」「事实不对」）。收集到足够样本后，就能按维度分析模型的薄弱环节。\n\n**注释工作流。** 把模型输出送进标注队列，由专人逐条评审并打标签。Amazon SageMaker Ground Truth 可以用来管理这类标注任务。这条路径成本最高但质量最好，适合高风险场景（医疗、法律）。\n\n**关联服务**：Amazon API Gateway（反馈收集接口）、Amazon SageMaker Ground Truth（标注工作流）。\n\n**反馈收集的一个常见坑**：收到的反馈样本有偏。只有特别满意或特别不满意的用户才会主动反馈。中间那一大批「还行」的用户不会按按钮。这导致你看到的反馈分布是 U 型的：极好和极差占比远高于实际。\n\n怎么修正？两个办法。第一个是主动弹窗：在每 N 次交互后随机弹出评分请求，而不是等用户主动点。第二个是埋隐式信号：用户复制了回答内容＝可能觉得有用；用户看完后立刻重新搜索同一个问题＝可能觉得没用。把隐式信号和显式反馈结合起来看，样本偏差就小很多。\n\n**关联服务**的选择取决于反馈精度需求。简单的「赞/踩」用 API Gateway 加 DynamoDB 就够了。需要领域专家逐条标注的，上 SageMaker Ground Truth——它能管理标注队列、分配任务、合并多人标注结果。\n#### 不让质量滑坡：质量保证流程\n\n**这条在问什么。** 模型上线第一天可能表现不错。但随着数据分布变化、提示词被修改、依赖服务更新，质量会悄悄下滑。这条讲的是怎么保证质量**持续达标**。\n\n三个机制：\n\n**持续评估工作流。** 不是上线前评一次就完事——要定期（比如每天或每周）自动抽取一批请求-回复对，跑一遍评估管道。质量低于阈值就触发告警。\n\n**回归测试。** 每次改了提示词、换了模型版本、升级了检索组件，都要在一组固定的「黄金测试集」上跑回归。这批测试用例的期望输出是事先标好的——类似传统软件的单元测试，只不过判断标准是语义相似度而不是精确匹配。\n\n**自动化质量控制。** 用 AWS Lambda 实现自动化检查：每个输出在返回用户之前过一遍质量检查器。检查器可以是规则（比如回答必须包含来源引用）也可以是模型（用一个小模型判断输出是否通顺、是否幻觉）。不通过的走降级路径。\n\n**关联服务**：AWS Lambda（自动化检查）、AWS Step Functions（评估工作流编排）、Amazon CloudWatch（质量指标监控）。\n\n#### 案例\n\n某客服系统上线后第三周，用户满意度突然下降。回查发现是知识库更新了一批文档，但嵌入索引没有同步刷新，导致检索结果和新文档不匹配。如果有持续评估工作流，第三天就能发现检索相关性指标下滑，而不是等用户投诉。\n\n**回归测试最关键的一步是维护黄金测试集。** 黄金测试集不是随便从生产日志里捞的——它需要覆盖各种边界情况：长输入、短输入、多语言、含敏感信息的请求、容易触发幻觉的问题。每条测试用例都要有人工标注的期望输出方向（不要求精确匹配，但要标注「正确回答应包含这些关键要素」）。\n\n黄金测试集也需要维护。业务变了、知识库更新了，之前的期望输出可能过时。建议每季度审查一次，剔除过时用例、补充新场景。\n\n#### 案例\n\n某保险问答系统每月更新一次产品条款。每次更新后跑回归测试，发现有三道黄金问题的期望输出和新条款矛盾——因为去年的条款说「等待期 30 天」，今年改成了「等待期 15 天」。如果不更新测试集，回归测试会把正确的新回答标为「退化」。\n#### 5.1.5 多角度把关：全面评估系统\n\n**这条在问什么。** 单一评估方式有盲区。自动化指标可能漏掉语义层面的问题；人工评估成本高、覆盖面窄。这条讲的是怎么**把多种评估方式组合起来**，从不同角度交叉验证。\n\n三种评估方式和各自的适用范围：\n\n**RAG 评估。** 专门针对检索增强生成的架构。它分成两段评估——检索阶段看「召回的文档相不相关」，生成阶段看「基于文档的回答准不准确」。两段都通过才算好。只看生成质量会漏掉「检索对了但模型没用上」的情况；只看检索质量会漏掉「文档对了但模型答歪了」。\n\n**LLM-as-a-Judge（让大模型当评委）。** 用一个能力更强的模型来评判另一个模型的输出。评委模型按预设的评估标准打分，相当于自动化的专家评审。优点是成本比人工低、速度快、可以覆盖大量样本。缺点是评委模型本身也会犯错，尤其在评估标准含糊时。\n\n**人员反馈收集界面。** 前面用户中心评估（5.1.3）讲了反馈怎么收。这里强调的是——把人的反馈和自动化指标**放在同一个看板上比较**。如果自动化指标说好、但人反馈说差，说明自动化指标有盲区，需要调校。\n\n**关联服务**：Amazon Bedrock 知识库（RAG 评估基础设施）、Amazon Bedrock 模型评估（LLM-as-a-Judge 实现）。\n\n**三种方式怎么组合？** 一个成熟的评估体系通常是三层叠加：\n\n- **底层**：RAG 评估自动跑——检索和生成质量的指标每天刷新，成本低、覆盖广。\n- **中层**：LLM-as-a-Judge 定期跑——对自动化指标无法覆盖的语义维度打分，一周跑一次就够。\n- **上层**：人工抽样评审——每月请领域专家看一批样本，重点看 LLM-as-a-Judge 给了高分但用户反馈差的案例——那些就是评委模型的盲区。\n\n**LLM-as-a-Judge 的一个操作细节**：评委模型和被评模型不要用同一个。如果你用 Claude 3.5 生成回答，再用 Claude 3.5 评分——它倾向于给自己的输出风格打高分。换一个不同系列的模型当评委，评估结果更客观。\n#### 检索够不够好：检索质量测试\n\n**这条在问什么。** RAG 应用的第一步是检索。如果检索回来的文档不相关，后面的生成再好也救不了。这条专门讲怎么评估和优化检索组件。\n\n三个核心指标：\n\n**相关性评分。** 检索回来的 Top-K 文档，有多少和用户问题真正相关？用一组带标注的查询-文档对做测试，计算命中率。\n\n**上下文匹配验证。** 更细粒度的检查——检索到的文档片段，是否包含回答问题所需的关键信息？有时候文档整体相关，但具体的分块（chunk）恰好没有覆盖关键事实。\n\n**检索延迟测量。** 向量搜索的延迟直接影响整体响应时间。如果检索就花了两秒，加上模型推理，总延迟可能超标。要监控 P50 和 P99 延迟，不只看平均值。\n\n**一个容易忽略的点**：检索质量会随时间衰减。新文档加入知识库后，如果嵌入模型没有更新，新旧文档的向量分布可能不一致。这就是嵌入漂移（Embedding Drift），排障详见内容处理问题（5.2.1）和检索系统问题排障（5.2.4）。\n\n**关联服务**：Amazon Bedrock 知识库（检索基础设施）、Amazon OpenSearch Service（向量搜索性能监控）。\n\n**怎么做检索质量测试？** 标准做法是准备一组测试查询，每条查询标注了「理想的检索结果应包含哪些文档」。跑一遍检索，计算召回率（标注文档被召回了多少）和精确率（召回的文档中有多少是标注的）。\n\n上下文匹配验证更细。不只看文档级别，还要看分块级别：检索到的那个 chunk 里是否真的包含回答问题所需的事实？有时候整篇文档是对的，但恰好被切到的那个 chunk 不包含关键信息。\n\n检索延迟不能只看平均值——P99 延迟才是真正影响用户体验的。如果平均延迟 200ms 但 P99 是 3 秒，意味着每一百个用户里有一个要等很久。\n#### 智能体做对了吗：智能体性能框架\n\n**这条在问什么。** 智能体不只是回答问题——它要做决策、调工具、执行多步骤任务。评估它不能只看最终输出，还要看过程。\n\n四个评估维度：\n\n**任务完成率。** 给智能体一批测试任务，看它有多大比例能完成。「完成」的定义要事先标好——比如「退款流程走到底且金额正确」才算完成，「给了一段回复但没真的执行退款」不算。\n\n**工具使用有效性。** 智能体调了哪些工具、调了多少次？有没有重复调用或无效调用？一个任务调了八次工具才完成，可能说明推理策略有问题。\n\n**Amazon Bedrock 智能体评估。** 这是 Bedrock 的托管功能，可以在受控环境下运行智能体并记录每一步的推理和工具调用。你可以拿到完整的执行轨迹（Trace），逐步分析哪里做对了、哪里走偏了。\n\n**多步骤工作流推理质量。** 不只看结果，还看推理链路是否合理。比如智能体先查库存再查价格再生成报价——步骤顺序对吗？每步的判断依据合理吗？这需要人审核执行轨迹（Trace），或用 LLM-as-a-Judge 做自动评估。\n\n**关联服务**：Amazon Bedrock Agents（智能体运行与评估）、AWS Step Functions（多步骤工作流编排）。\n\n#### 案例\n\n一个采购助手智能体在测试中任务完成率只有 60%。分析执行轨迹发现，失败案例的共同点是智能体在查库存时收到「无库存」响应后直接终止，没有尝试查替代品。修复办法是在工具描述里补充「无库存时应查询替代品」的指引。\n\n**智能体评估和单纯的模型评估有什么不同？** 模型评估只看输入和输出。智能体评估要看整条执行链路——它选了哪些工具、按什么顺序调用、每步的推理是否合理、最终结果是否正确。\n\n一个常见做法是在 Bedrock 智能体评估中开启轨迹记录（Trace），然后对轨迹做两类分析。第一类是自动化的：统计平均步数、工具调用成功率、超时比例。第二类是人工的：让领域专家审查失败案例的轨迹，判断智能体在哪一步做了错误决策。\n#### 给管理层看什么：报告系统\n\n**这条在问什么。** 评估做完了，结果要传递给不同的受众。技术团队要看细节，管理层要看趋势，合规团队要看风险。这条讲的是怎么把评估结果包装成可消费的形式。\n\n三类输出：\n\n**可视化工具。** 用 Amazon CloudWatch 仪表板把关键指标做成图表。技术团队看延迟分布、Token 使用、错误率；业务团队看客户满意度、任务完成率、成本。\n\n**自动报告机制。** 按固定周期（每天或每周）自动生成评估报告并分发。报告里包含指标变化趋势、异常事件、需要关注的退化。\n\n**模型比较可视化。** 把多个模型或多个版本的评估结果并排展示。帮助决策者快速看出哪个配置在哪个维度更好。\n\n**关联服务**：Amazon CloudWatch（仪表板和指标）、Amazon QuickSight（高级可视化）。\n\n**报告不是「做给自己看的仪表板」。** 不同受众需要不同信息。技术团队关心 P99 延迟和错误分布；产品经理关心任务完成率和用户满意度；合规团队关心幻觉率和敏感信息泄露事件数。一份报告如果试图满足所有人，结果是谁都看不完。\n\n建议按受众分三份看板。技术看板放在 CloudWatch 仪表板上，实时更新。业务看板每周自动生成一份摘要邮件。合规看板按季度出，重点放风险事件和整改措施。\n\n**模型比较可视化的一个实用技巧**：把多个模型的评估结果画成雷达图——四个维度（相关性、准确率、一致性、流畅性）各占一个轴。一眼就能看出哪个模型在哪个维度领先。比表格直观得多。\n\n**一个容易忽视的报告需求是历史对比。** 不只展示本周的指标，还要展示和上周、上月的变化。一条「幻觉率从 3% 升到 5%」的趋势线比一个「幻觉率 5%」的静态数字有用得多。CloudWatch 的指标保留周期默认 15 个月，足够做季度趋势分析。\n\n#### 案例\n\n某电商平台的 AI 搜索助手每季度出一份评估报告。技术看板显示 P99 延迟在阈值内，但业务报告发现退货咨询的满意度比商品推荐低 20%。分开看两类场景后发现，退货流程涉及多步工具调用，总延迟虽然达标，但回答准确率偏低。这个洞察只有在业务维度报告里才能看出来。\n\n#### 上线前最后一关：部署验证系统\n\n**这条在问什么。** 模型版本升级、提示词修改、知识库更新——每一次变更都可能引入新问题。这条讲的是**变更上线前的自动化验证**，确保不把问题带到生产环境。\n\n三个机制：\n\n**合成用户工作流。** 用脚本模拟真实用户的请求模式，对新版本做端到端测试。不是随便发几个请求——要覆盖各种边界情况：超长输入、多语言、含敏感信息的请求等。\n\n**AI 特定输出验证。** 这是 GenAI 部署验证的独有环节。要检查两件事：**幻觉率有没有升高**，以及**语义漂移有没有发生**。幻觉率用黄金数据集（Golden Dataset）检查——一批答案已知的问题，看新版本的回答有没有偏离事实。语义漂移用嵌入相似度检查——同样的问题，新旧版本的回答在语义空间里距离远不远。\n\n**自动质量检查。** 新版本上线前，在金丝雀环境里跑一段时间，自动检查回复一致性。如果新版本的输出和旧版本的差异超过阈值，自动回滚。\n\n**一个必须注意的边界**：部署验证不等于评估。评估是「打分」，部署验证是「放不放行」。验证只关心「和上一个版本比有没有变差」，不关心绝对质量高不高。\n\n**关联服务**：AWS CodePipeline（CI/CD 管道集成验证步骤）、Amazon Bedrock 模型评估（黄金数据集验证）、Amazon CloudWatch（漂移检测告警）。\n\n**部署验证和评估的区别在于判据。** 评估问的是「这个模型好不好」——看绝对分数。部署验证问的是「新版本比旧版本差了吗」——看相对变化。一个模型绝对分数不算高，但和上个版本比没有退化，那就可以放行。\n\n幻觉率检测用黄金数据集。准备 50~100 个答案已知的问题，让新版本回答一遍。如果正确率从 92% 降到 85%，不放行。语义漂移用嵌入距离检测。把同一批问题在新旧版本上各回答一遍，计算回答向量之间的余弦距离。如果平均距离超过阈值，说明输出风格或内容发生了显著变化——需要人工复查再决定放不放行。\n#### 案例\n\n**💡 综合案例：一套内部知识问答系统的评估全链路**\n\n某企业用 RAG 架构搭了一套内部知识问答系统。上线前和上线后各走一套评估。\n\n**上线前。** 先用全面评估框架（5.1.1）定义四个维度的基线指标。然后在 Bedrock 模型评估上跑自动化评估，同时请五位领域专家用人工评估模式打分。两种方式的结果对比发现：自动化指标里流畅性得分很高，但专家反馈「回答太笼统、没有引用具体文档」。于是调整了提示词，强制要求模型在回答末尾附上引用来源。\n\n**上线后。** 每天自动抽取 200 对请求-回复，跑 RAG 评估（5.1.5）检查检索相关性和生成准确性。每周出一份报告（5.1.8）给技术负责人。用户每次问完都能点「有用/没用」（5.1.3），反馈数据每月汇总一次做趋势分析。\n\n**版本升级时。** 知识库每月刷新一次。每次刷新后先在灰度环境跑部署验证（5.1.9）：用 50 个黄金问题检查幻觉率，用语义漂移检测比较新旧回答。通过才全量切换。\n\n**评估链路上每一环解决一个问题**：上线前定基线，上线后持续看，升级前不放水。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「用 BLEU/ROUGE 就能评估 GenAI 输出」 | BLEU/ROUGE 基于词汇重叠，无法捕捉语义正确性 | GenAI 评估需要语义级指标（相关性、事实准确率等）；BLEU/ROUGE 只适用于翻译和摘要的参考比对 |\n| 「LLM-as-a-Judge 可以完全替代人工评估」 | 评委模型本身也有偏差，标准含糊时判断不可靠 | LLM-as-a-Judge 适合大批量初筛；关键决策场景仍需人工 |\n| 「RAG 评估只看生成质量就够了」 | 生成质量好可能是因为模型自己编的，不是基于检索结果 | RAG 评估必须分两段：检索阶段和生成阶段各自评估 |\n| 「上线后不用再评估」 | 数据分布变化、知识库更新、模型漂移都会导致质量退化 | 持续评估工作流是必备项，不是可选项 |\n| 「部署验证就是再跑一遍评估」 | 部署验证的判据是「有没有变差」，不是「绝对质量高不高」 | 验证用的是对比（新版 vs 旧版），不是绝对打分 |\n\n#### 记忆要点\n\n1. **四维度评估**：相关性、事实准确率、一致性、流畅性。**四个都看，只看一个会漏判。**\n2. **评估三条线**：自动化（Bedrock 模型评估）/ 人工（专家标注）/ 用户反馈。覆盖面递减，精度递增。\n3. **RAG 必须分两段评**：检索质量和生成质量分开看。一段好不代表另一段好。\n4. **持续评估 ≠ 上线前评一次**：质量会随数据和配置变化滑坡，必须定期自动抽检。\n5. **部署验证的判据是对比，不是绝对值**：和上一个版本比有没有退化。用黄金数据集查幻觉率，用语义漂移查输出偏移。\n\n---"},{"h":"对生成式人工智能应用程序进行故障排除","body":"#### 本节定位\n本节对应考纲任务声明 5.2「对生成式人工智能应用程序进行故障排除」。\n\n> 官方原名：Troubleshoot GenAI applications.\n\n任务 5.1 解决「评」，任务 5.2 解决「修」。评估发现质量下降了，或者用户投诉了——接下来你要定位问题出在哪、怎么修。\n\nGenAI 应用的故障排除比传统服务难在一个地方：**很多故障不会报错**。模型不会返回 500 状态码告诉你「我幻觉了」。它会自信地给出一个看起来合理但完全错误的答案。你需要主动检测。\n\n本任务的五个技能点覆盖五类故障：\n\n| 故障类型 | 典型表现 | 对应技能点 |\n|---|---|---|\n| **内容溢出** | 长文档被截断，回答丢失后半段信息 | 5.2.1 |\n| **API 集成出错** | 调用报错、响应格式不对 | 5.2.2 |\n| **提示质量退化** | 回答变得不稳定或不切题 | 5.2.3 |\n| **检索失效** | 召回文档不相关或漂移 | 5.2.4 |\n| **提示维护断裂** | 版本混乱、格式不一致 | 5.2.5 |\n\n#### 文档塞不下了：内容处理问题\n\n**这条在问什么。** 每个模型有上下文窗口上限。用户输入 + 系统提示 + 检索到的文档如果加在一起超过上限，内容会被截断。截断后模型只能看到一部分信息，回答自然不完整。\n\n四个处理手段：\n\n**上下文窗口溢出诊断。** 第一步是确认是不是溢出了。查 API 响应里的 Token 计数，和模型的上限做比较。如果输入 Token 数接近或超过上限，就是这个问题。\n\n**动态分块策略。** 长文档不能整段塞进去——要按内容重新分块。关键是分块粒度要动态调整：法律文档按条款切，技术文档按章节切，聊天记录按轮次切。固定长度分块容易把一个概念劈成两半。\n\n**提示设计优化。** 系统提示能短就短。把冗余的指令去掉，只留必要部分。一个 2000 Token 的系统提示，往往能压缩到 500 Token 而不损失效果。省下来的空间留给用户输入和检索结果。\n\n**截断相关错误分析。** 如果回答在某个位置突然中断，或者回答提到了「根据上文」但上文其实被截掉了——这些都是截断的信号。用日志分析具体是哪一段被截了，才能针对性修复。\n\n**关联服务**：Amazon CloudWatch Logs（Token 计数日志分析）、Amazon Bedrock 知识库（分块策略配置）。\n\n#### 案例\n\n一个合同分析应用对 50 页合同的分析结果总是漏掉最后几页的条款。查日志发现输入 Token 数为 195,000，模型上下文窗口是 200,000——虽然没超限，但加上系统提示和回复空间就溢出了。修复：把系统提示压缩 300 Token，同时把合同拆成 10 页一组分批处理。\n\n**上下文溢出的一个隐蔽变体**：输入没有超限，但输出被压缩了。模型的上下文窗口是输入和输出共用的。如果你的输入占了 190,000 Token（上限 200,000），模型只剩 10,000 Token 的空间来回答——如果需要 20,000 Token 才能说清楚，回答就被迫截断。\n\n修复不只是压缩输入那么简单。要在请求时设置 `maxTokens` 参数，给输出预留足够空间。同时监控实际输出长度和 `maxTokens` 的比值——如果经常用满了限额，说明输出空间不够。\n#### API 调不通：FM 集成问题诊断\n\n**这条在问什么。** GenAI 应用不是一个模型在那独立跑——它要通过 API 和其他服务交互。API 调用可能失败、超时、返回意外格式。这条讲的是怎么定位和修复 API 层面的问题。\n\n三个排障手段：\n\n**错误日志记录。** 在每个 API 调用前后记录请求体和响应体。用 CloudWatch Logs 集中存储。常见的错误类型：429（限流）、503（服务不可用）、超时。\n\n**请求验证。** API 返回错误时，先检查请求本身：参数格式对吗？权限够吗？模型 ID 写对了吗？很多「503」其实是请求格式不对被拒绝。\n\n**响应分析。** 模型返回了 200 但内容不对——这比报错更难查。需要检查响应里的完成原因（Finish Reason）：是正常结束还是被截断？Token 使用是否异常？输出格式是否符合预期？\n\n**关联服务**：Amazon CloudWatch Logs（错误日志）、AWS X-Ray（API 调用链追踪）。\n\n**GenAI API 的错误和传统 API 不太一样。** 传统 API 返回 400 就是参数错、500 就是服务端崩了。GenAI API 多了一类「软错误」：返回 200 但内容不对。比如模型返回了空字符串、返回了和请求语言不一致的内容、或者返回了被 Guardrails 截断的不完整响应。\n\n查这类问题要看响应里的元数据字段。Bedrock 的响应包含 `stopReason`：`end_turn` 是正常结束，`max_tokens` 是被截断，`guardrail_intervened` 是被护栏拦截。把 `stopReason` 记进日志，很多「回答不好」的投诉一查就知道原因了。\n\n**限流（429）的正确处理不是无限重试。** 要用指数退避（Exponential Backoff）加上最大重试次数。超过最大次数后走降级路径——比如返回缓存结果或提示用户稍后再试。无限重试只会让限流更严重。\n\n**另一个容易踩坑的地方是并发限制。** Bedrock 的每个模型有并发请求配额。如果你的应用在高峰时段同时发出 100 个请求但配额只有 50，一半会被限流。解决办法有两条：一是申请提升配额；二是在应用层加请求队列，用令牌桶（Token Bucket）算法平滑请求速率。后者对突发流量更友好。\n\n#### 案例\n\n某内容审核系统每天下午五点收到大量用户举报，导致 Bedrock API 调用集中爆发。查日志发现 60% 的 429 错误集中在 17:00~17:30。修复：加了一个 SQS 队列做请求缓冲，用 Lambda 按固定速率消费——峰值被拉平，429 错误降为零。\n\n**一个重要的排障习惯是区分客户端错误和服务端错误。** Bedrock API 的错误响应码遵循 HTTP 标准：4xx 是你的请求有问题（格式错、权限不足、超配额），5xx 是服务端出了问题。对 4xx，检查请求参数和 IAM 权限；对 5xx，检查 AWS 服务健康仪表板（Service Health Dashboard）确认是否有区域性故障。大部分「调不通」的问题最终都是 4xx——尤其是 403（权限不足）和 422（参数不合规）。\n\n**关联服务**：Amazon CloudWatch Logs（错误日志集中存储）、AWS X-Ray（API 调用链追踪与延迟分析）、Amazon SQS（请求缓冲与削峰）。\n\n#### 回答越来越差：提示工程问题排障\n\n**这条在问什么。** 提示是模型行为的「说明书」。如果回答质量下降但模型没换、数据没变，大概率是提示出了问题——可能被改坏了，可能和新数据不适配了。\n\n三个排障路径：\n\n**提示测试框架。** 建一组标准测试用例，每次修改提示后都跑一遍。如果某类问题的回答质量突然下降，对比前后两版提示的差异就能定位原因。\n\n**版本比较。** 把提示词做版本管理（Amazon Bedrock Prompt Management 支持版本控制）。回答变差时，对比当前版本和上一个正常版本的差异。\n\n**系统化改进。** 不要凭感觉改提示。记录每次修改的意图、改了什么、效果如何。积累下来就能形成一套提示优化的方法论。\n\n**关联服务**：Amazon Bedrock Prompt Management（提示版本控制）、Amazon CloudWatch Logs（回答质量日志对比）。\n\n**提示退化最常见的三个原因。** 第一个是「修改连锁反应」——改了 A 功能的提示，意外影响了共用同一模板的 B 功能。第二个是「数据分布变化」——用户问的问题类型变了，原来的提示不再适配。第三个是「模型升级不兼容」——换了模型版本后，原来的提示效果变差。\n\n**系统化改进的关键是隔离变量。** 每次只改一个地方，改完跑测试。如果同时改了模板结构和示例内容，质量变了你不知道是哪个改动导致的。用 Bedrock Prompt Management 的版本功能做 A/B 对比——把旧版本和新版本同时跑在一部分流量上，数据说话。\n\n#### 案例\n\n某客服助手在模型从 v3 升级到 v4 后，回答开始频繁包含英文段落。排查发现 v4 对系统提示里「请用中文回答」这条指令的遵从度比 v3 低。修复：把指令从系统提示移到用户消息开头，并加粗重复一次。\n#### 5.2.4 查出来的东西不对：检索系统问题排障\n\n**这条在问什么。** RAG 应用的回答质量很大程度上取决于检索的质量。如果检索回来的文档不相关，模型只能凭空编造。这条讲的是六种常见检索故障及对应修复手段。\n\n**模型回复相关性分析。** 发现回答跑题时，先查检索到的文档块（chunk）。如果文档块本身就和问题不相关，问题在检索层。\n\n**嵌入质量诊断。** 嵌入模型把文本转成向量。如果嵌入质量差——比如同义词的向量距离很远，或者不相关的词向量距离很近——检索结果自然不好。修复办法是换一个更适合你领域的嵌入模型。\n\n**漂移监控。** 嵌入模型和数据分布都会随时间变化。新加入的文档如果风格或术语和老文档差异大，向量空间里的分布就会不均匀，导致检索结果偏向老文档。需要定期监控嵌入分布。\n\n**向量化问题解决。** 有时候问题更基础——文档在向量化之前没有做好预处理。比如 PDF 里的表格被解析成乱码，向量化后的表示毫无意义。\n\n**分块和预处理补救。** 分块策略不合理会导致关键信息被劈开。修复办法是调整分块大小、增加重叠区域（overlap），或者换成按语义切分。\n\n**向量搜索性能优化。** 检索本身太慢也是故障。索引参数不对、数据量暴增、查询未优化——都可能导致延迟飙升。\n\n**关联服务**：Amazon Bedrock 知识库（分块与检索配置）、Amazon OpenSearch Service（向量搜索性能调优）、Amazon CloudWatch（检索延迟监控）。\n\n#### 案例\n\n某客服系统的 RAG 回答越来越不准。检查发现上月新增了一批产品手册，但这批手册用了大量缩写和表格。嵌入模型对缩写的表示很差，导致查询「如何配置 X 功能」时召回的是旧版手册。修复：对新文档做预处理，把缩写展开，表格转成自然语言描述后再向量化。\n\n#### 提示词版本一团糟：提示维护问题排障\n\n**这条在问什么。** 提示词在生产环境里不是写一次就定的——业务变了要改，效果不好要调，新模型来了要适配。改多了，版本就乱了。这条讲的是怎么用工程化手段维护提示词的健康状态。\n\n四个手段：\n\n**模板测试和 CloudWatch Logs 诊断提示混淆。** 提示混淆是指：多个功能共用一个提示模板，改了一个功能的指令影响了另一个。用 CloudWatch Logs 分析每个请求实际使用的提示内容，和预期对比，能发现模板变量注入错误的问题。\n\n**X-Ray 实施提示可观测性管道。** 把提示词的版本号和内容哈希作为 X-Ray 追踪的元数据（metadata）注入。这样出了问题时，你不仅知道「这个请求调了哪个模型」，还知道「用的是哪个版本的提示词」。这对多版本并行灰度的场景尤其关键。\n\n**架构验证检测格式不一致。** 提示词经常要求模型以特定格式输出（JSON、Markdown、固定字段）。格式不一致是常见故障——模型有时候会忽略格式要求。用 JSON Schema 或正则表达式自动校验输出格式，格式不合规的走重试或降级。\n\n**系统化提示优化工作流。** 建一套提示词的全生命周期管理：草案 → 测试 → 灰度 → 全量 → 监控 → 下一轮优化。每个阶段都有检查点和回滚机制。\n\n**关联服务**：AWS X-Ray（提示可观测性追踪）、Amazon CloudWatch Logs（提示内容日志分析）、Amazon Bedrock Prompt Management（版本控制与灰度）。\n\n**提示维护和提示工程不是一回事。** 提示工程是「写一个好提示」；提示维护是「在生产环境里管好一堆提示的版本、灰度、监控和回滚」。后者是工程问题，不是创作问题。\n\n用 X-Ray 做提示可观测性的具体做法是这样的。在每个 API 调用时，把当前使用的提示模板 ID 和内容哈希注入 X-Ray 追踪的自定义注释（annotation）里。出了问题时，在 X-Ray 里按提示模板 ID 过滤，就能看到某个版本的提示是不是比其他版本出错更多。\n\n格式验证是另一个被低估的环节。如果你要求模型输出 JSON，它有时候会在 JSON 前面加一句「好的，以下是结果：」——导致下游解析直接失败。用 JSON Schema 验证器或正则表达式在输出返回前拦一道。不通过的走重试（让模型重新生成，加强格式要求）或降级（返回结构化错误提示给用户）。\n#### 案例\n\n**💡 综合案例：一次 RAG 回答质量骤降的排障全链路**\n\n某金融问答系统的用户反馈分数在某周三突然从 4.2 降到 3.1。\n\n**第一步：确认现象。** CloudWatch 仪表板显示回答相关性指标下降 35%，但延迟和错误率都正常——不是 API 层的问题。\n\n**第二步：定位故障层。** 用 RAG 评估拆成两段看：检索相关性从 0.82 降到 0.54，但生成忠实度（Faithfulness）没变。问题在检索层。\n\n**第三步：深挖检索问题。** 分析检索日志发现，周二晚上知识库刷新了 200 篇新文档。这批文档的分块平均长度比老文档大三倍——因为用了新的 PDF 解析工具，段落没有正确切分。过大的分块导致向量表示模糊，相似度匹配失准。\n\n**第四步：修复。** 对新文档重新分块（缩小块大小并增加 overlap）后重新向量化。检索相关性回到 0.80。\n\n**第五步：防复发。** 在知识库刷新管道里加一步自动化检查——分块大小超出阈值的文档自动标记并暂缓入库。\n\n#### 常见误区与易错点\n\n| 错误说法 | 为什么错 | 正确理解 |\n|---|---|---|\n| 「模型回答变差一定是模型的问题」 | 更常见的原因是检索质量下降或提示被改坏 | 排障从外到内：先查检索和提示，再怀疑模型本身 |\n| 「上下文窗口没超限就不会截断」 | 输入 Token 接近上限时，输出空间被压缩，回答被迫缩短 | 要为输出预留足够的 Token 空间，不能把窗口塞满 |\n| 「提示词改了效果不好就改回来」 | 如果没有版本管理，可能改回的不是原始版本 | 提示词必须做版本控制，每次变更记录意图和效果 |\n| 「检索延迟高就加机器」 | 可能是索引参数不优化或查询未预处理 | 先检查索引配置和查询质量，再考虑扩容 |\n| 「X-Ray 只用来看 API 调用链」 | 在 GenAI 场景里还要注入提示版本和内容哈希 | X-Ray 是提示可观测性的关键工具，不只是传统链路追踪 |\n\n#### 记忆要点\n\n1. **GenAI 故障最大特点**：不报错但答错。**没有 500 状态码的退化，只有用户反馈才能暴露。**\n2. **排障从外到内**：先查检索 → 再查提示 → 最后才怀疑模型。最常见的原因是检索和提示层。\n3. **上下文溢出三步**：诊断（查 Token 数）→ 压缩（优化提示和分块）→ 拆分（分批处理）。\n4. **嵌入漂移是隐形杀手**：新文档风格变了、嵌入模型分布不均，检索质量悄悄下滑。需要定期监控。\n5. **X-Ray + 提示版本号 = 提示可观测性**。出了问题不仅知道调了哪个模型，还知道用了哪版提示。\n\n---"}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 5.1.1 | 四维评估指标（相关性/事实准确率/一致性/流畅性）及其适用场景 | ⭐⭐⭐ | 概念题——传统 ML 指标 vs GenAI 指标的适用边界 |\n| 5.1.2 | Bedrock 模型评估（自动化+人工）+ A/B 测试 + 金丝雀 | ⭐⭐⭐ | 场景题——按流量和需求选评估方式 |\n| 5.1.5 | RAG 评估两段论 + LLM-as-a-Judge 的适用边界 | ⭐⭐⭐ | 判断题——检索质量和生成质量要分开评 |\n| 5.1.7 | 智能体评估四维度（任务完成率/工具使用/执行轨迹/推理质量） | ⭐⭐ | 场景题——智能体完成率低时查什么 |\n| 5.1.9 | 幻觉率 + 语义漂移的部署验证 | ⭐⭐ | 判断题——部署验证是对比而非绝对打分 |\n| 5.2.1 | 上下文窗口溢出诊断 + 动态分块策略 | ⭐⭐⭐ | 故障场景题——长文档回答不完整怎么排查 |\n| 5.2.4 | 检索排障六件套（嵌入质量/漂移/分块/预处理/向量搜索） | ⭐⭐⭐ | 场景题——RAG 回答不准时从哪查 |\n| 5.2.5 | X-Ray 提示可观测性 + 提示版本管理 | ⭐⭐ | 概念题——X-Ray 在 GenAI 场景的额外作用 |","services":"| 服务 | 主要用途 | 涉及 Task |\n|---|---|---|\n| Amazon Bedrock 模型评估 | 自动化和人工模型评估、LLM-as-a-Judge | 5.1 |\n| Amazon Bedrock 知识库 | RAG 评估基础设施、分块策略 | 5.1 / 5.2 |\n| Amazon Bedrock Agents | 智能体运行与评估（执行轨迹） | 5.1 |\n| Amazon Bedrock Prompt Management | 提示版本控制与灰度 | 5.2 |\n| Amazon CloudWatch / Logs Insights | 指标监控、质量仪表板、Token 分析、提示内容日志 | 5.1 / 5.2 |\n| AWS X-Ray | 提示可观测性管道、API 调用链追踪 | 5.2 |\n| AWS Lambda | 自动化质量检查、输出格式校验 | 5.1 / 5.2 |\n| AWS Step Functions | 评估工作流编排 | 5.1 |\n| Amazon OpenSearch Service | 向量搜索性能监控与调优 | 5.1 / 5.2 |\n| Amazon SageMaker Ground Truth | 人工标注工作流 | 5.1 |\n| AWS CodePipeline | CI/CD 管道集成部署验证 | 5.1 |"}}]};

<script>
(function(){
'use strict';
const DATA = (typeof LEARNING_DATA !== 'undefined' && LEARNING_DATA) ? LEARNING_DATA : null;

/* ============ 常量与工具 ============ */
const EXAM = DATA ? (DATA.meta.exam || 'CERT').toLowerCase() : 'cert';   // clf-c02
const STORE_KEY = EXAM + '-v2';                                          // 进度键：clf-c02-v2
const COLORS = ['#4f46e5','#7c3aed','#9333ea','#a855f7'];                // 每章主题色（N 章 N 色，N>4 循环）
const home = document.getElementById('home');
const chapBox = document.getElementById('chapters');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inlineMd(s){
  let t = esc(s);
  t = t.replace(/\n/g,'<br>');
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
  return t;
}
function isTblSep(ln){ const core = ln.replace(/^\s*\|/,'').replace(/\|\s*$/,''); if(!core.includes('-')) return false; return /^[\s:\-|]+$/.test(ln) && /-/.test(ln); }
function loadProg(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveProg(p){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){} }

/* ============ 块级 md 渲染（段落/引用/表格/列表/图占位符） ============ */
function renderBlocks(seg, figs){
  const lines = seg.replace(/\r/g,'').split('\n');
  let html = ''; let i = 0; const n = lines.length;
  while(i < n){
    const ln = lines[i]; const s = ln.trim();
    if(s === ''){ i++; continue; }
    const fm = s.match(/^\[\[fig:([\w-]+)\]\]$/);
    if(fm){ const f = (figs||{})[fm[1]]; if(f) html += figHtml(f); i++; continue; }
    if(s.startsWith('|') && i+1 < n && isTblSep(lines[i+1].trim())){
      let rows = [];
      while(i < n && lines[i].trim().startsWith('|')){ rows.push(lines[i].trim()); i++; }
      const heads = rows[0].replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim()));
      const data = rows.slice(2).map(r => r.replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim())));
      html += '<div class="tbl-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'
        + data.map(r => '<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if(s.startsWith('>')){
      let q = [];
      while(i < n && lines[i].trim().startsWith('>')){ q.push(lines[i].replace(/^\s*>\s?/,'').trim()); i++; }
      html += '<blockquote>'+inlineMd(q.join(' '))+'</blockquote>'; continue;
    }
    if(/^[-*]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^[-*]\s+/.test(t)){ items.push(inlineMd(t.replace(/^[-*]\s+/,''))); i++; } else break; }
      html += '<ul>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; continue;
    }
    if(/^\d+[.、]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^\d+[.、]\s+/.test(t)){ items.push(inlineMd(t.replace(/^\d+[.、]\s+/,''))); i++; } else break; }
      html += '<ol>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ol>'; continue;
    }
    const hm = s.match(/^(#{1,6})\s+(.+)$/);
    if(hm){ html += '<h4 class="sec-h">'+inlineMd(hm[2])+'</h4>'; i++; continue; }
    let para = [];
    while(i < n){
      const t = lines[i].trim();
      if(t === '' || t.startsWith('|') || t.startsWith('>') || /^[-*]\s+/.test(t) || /^\d+[.、]\s+/.test(t) || /^#{1,6}\s/.test(t) || /^\[\[fig:[\w-]+\]\]$/.test(t)) break;
      para.push(t); i++;
    }
    if(para.length) html += '<p>'+inlineMd(para.join(' '))+'</p>';
  }
  return html;
}

/* ===== 节内子块解析与渲染（v6）：#### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点）
   本节定位=弱化引言、案例/记忆要点=卡片、常见误区与易错点=警示小节——均不占编号。
   解析与渲染共用 parseSectionBlocks，保证正文 h3 与左侧目录两级条目 1:1。 ===== */
const SUB_RAW='raw', SUB_LEAD='lead', SUB_KP='kp', SUB_CASE='case', SUB_MIS='mis', SUB_MEM='mem';
function subTypeOf(title){
  if(title === '本节定位') return SUB_LEAD;
  if(title === '案例') return SUB_CASE;
  if(title === '记忆要点') return SUB_MEM;
  if(title === '常见误区与易错点') return SUB_MIS;
  return SUB_KP;
}
function parseSectionBlocks(md){
  const parts = (md||'').replace(/\r/g,'').split(/\n(?=####\s)/);
  const out = [];
  parts.forEach(part=>{
    const m = part.match(/^####\s*(.+?)\s*\n([\s\S]*)$/);
    if(!m){ const t = part.trim(); if(t) out.push({ type:SUB_RAW, title:'', body:t }); return; }
    out.push({ type:subTypeOf(m[1].trim()), title:m[1].trim(), body:(m[2]||'').trim() });
  });
  return out;
}
function countKp(body){ let m=0; parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP) m++; }); return m; }
function kpListOf(body){
  const kps=[]; let m=0;
  parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP){ m++; kps.push({ m:m, title:b.title }); } });
  return kps;
}
function renderSectionBody(md, figs, d, n){
  const blocks = parseSectionBlocks(md);
  let h = ''; let kp = 0;
  for(const b of blocks){
    if(b.type === SUB_RAW){ h += renderBlocks(b.body, figs); continue; }
    if(b.type === SUB_KP){
      kp++;
      h += '<h3 class="mh3" id="sec-'+d+'-'+n+'-'+kp+'"><span class="h3no">'+d+'.'+n+'.'+kp+'</span><span>'+inlineMd(b.title)+'</span></h3>'
         + renderBlocks(b.body, figs);
      continue;
    }
    if(b.type === SUB_CASE){ h += '<div class="case-card"><h4 class="sec-h">案例</h4>'+renderBlocks(b.body, figs)+'</div>'; continue; }
    if(b.type === SUB_MEM){ h += '<div class="mem-card"><h4 class="sec-h">记忆要点</h4>'+renderBlocks(b.body, figs)+'</div>'; continue; }
    h += '<h4 class="sec-h'+(b.type===SUB_LEAD?' sec-lead-h':'')+'">'+inlineMd(b.title)+'</h4>'+renderBlocks(b.body, figs);
  }
  return h;
}
function figsById(fs){ const m={}; (fs||[]).forEach(f=>{ m[f.id]=f; }); return m; }
function figHtml(f){
  return '<div class="fig-block"><div class="fig-title">'+esc(f.title)+'</div>'
    + '<div class="fig-body">'+(f.html||'')+'</div>'
    + (f.caption ? '<div class="fig-caption">'+esc(f.caption)+'</div>' : '') + '</div>';
}

/* ============ 章内滚动（v6）：几何法 scrollspy + 阅读进度 ============
   同一 rAF 节流的 scroll 监听做两件事：① 顶部细进度条（#rdFill-d / #readPct-d）
   ② 高亮"最新越过吸顶线(READ_LINE)的锚点"（.sec-block 节 / .mh3 知识点），并自动单开其节组。 */
let spyD = 0, spyEls = [], spyTick = null, spyOn = false;
const READ_LINE = 86;      // 吸顶条下方阅读线
const ACT_WIN = 160;       // 节/知识点标题进入线下方窗口即视为"当前"（点击跳转后立即生效）
function setAct(id){
  if(!id) return;
  /* 锚点两类：正文节/知识点 sec-域-序号[-序号]，章末练习 quiz-d域 */
  const mk = id.match(/^(?:sec-|quiz-d)(\d+)/); if(!mk) return;
  const d = +mk[1];
  const toc = document.getElementById('toc-d'+d); if(!toc) return;
  toc.querySelectorAll('.toc-link.act').forEach(a=>a.classList.remove('act'));
  const link = toc.querySelector('a[href="#'+id+'"]');
  if(link){
    link.classList.add('act');
    const li = link.closest('.toc-sec');
    if(li && !li.classList.contains('open')){
      toc.querySelectorAll('.toc-sec.open').forEach(x=>x.classList.remove('open'));
      li.classList.add('open');
    } else if(!li){
      /* 独立条目（练习入口等）：高亮时收起所有展开节组，聚焦本条 */
      toc.querySelectorAll('.toc-sec.open').forEach(x=>x.classList.remove('open'));
    }
  }
}
function computeSpy(){
  const host = document.getElementById('panel-d'+spyD); if(!host) return;
  /* ① 阅读进度：以当前面板总高扣视口高的滚动行程计百分比（+页脚尾距近似） */
  const total = host.offsetHeight - window.innerHeight + 110;
  const p = total > 0 ? Math.max(0, Math.min(100, Math.round(window.scrollY / total * 100))) : 0;
  const fill = document.getElementById('rdFill-'+spyD); if(fill) fill.style.width = p + '%';
  const pct = document.getElementById('readPct-'+spyD); if(pct) pct.textContent = p + '%';
  /* ② 当前锚（三层）：
     视口内(含阅读线下方窗口)：选最靠上者 → 点击跳转/节首即生效；
     视口内无锚(读至章末练习/底部)：取最近滚出视口的锚，保持高亮最后小节；
     首屏未滚：回退最先可见锚 */
  const hi = READ_LINE + ACT_WIN;
  let best = null;
  for(const el of spyEls){
    const r = el.getBoundingClientRect();
    if(r.top <= hi && r.bottom >= 0){ if(!best || r.top > best.r.top) best = { el:el, r:r }; }
  }
  if(!best){
    for(const el of spyEls){
      const r = el.getBoundingClientRect();
      if(r.bottom < 0){ if(!best || r.bottom > best.r.bottom) best = { el:el, r:r }; }
    }
  }
  if(!best){
    for(const el of spyEls){
      const r = el.getBoundingClientRect();
      if(r.top >= 0 && r.top < window.innerHeight * 0.7){ if(!best || r.top < best.r.top) best = { el:el, r:r }; }
    }
    if(!best && spyEls.length) best = { el:spyEls[0], r:null };
  }
  if(best && best.el.id) setAct(best.el.id);
}
function onSpyScroll(){
  if(spyTick) return;
  spyTick = requestAnimationFrame(()=>{ spyTick = null; computeSpy(); });
}
function initSpy(d){
  detachSpy(false);
  spyD = d;
  const host = document.getElementById('panel-d'+d); if(!host) return;
  spyEls = Array.from(host.querySelectorAll('.sec-block, .mh3, .quiz-box'));
  if(!spyOn){ spyOn = true; window.addEventListener('scroll', onSpyScroll, { passive:true }); }
  document.body.classList.add('chapView');
  computeSpy();
}
function detachSpy(resetAct){
  if(spyOn){ window.removeEventListener('scroll', onSpyScroll); spyOn = false; }
  if(spyTick){ cancelAnimationFrame(spyTick); spyTick = null; }
  document.body.classList.remove('chapView');
  spyEls = []; spyD = 0;
  if(resetAct !== false){
    document.querySelectorAll('.toc-link.act').forEach(a=>a.classList.remove('act'));
    document.querySelectorAll('.toc-sec.open').forEach(li=>li.classList.remove('open'));
  }
}

/* ============ 章末练习 ============ */
/* 答案/题型归一化（修复：双科数据格式不一致导致章末练习失效）
   数据真源存在两种历史格式：
     CLF  a = ["C"] / ["B","E"]   t = 'single' / 'multiple'
     AIF  a = "B"   / "AE"        t = '单选' / '多选'
   原实现把 q.a 经 JSON.stringify+esc 写进 data-ans 属性，esc 不转义双引号 →
   属性被 HTML 截断（CLF 抛 JSON 解析错→提交无反应；AIF 读出空→恒判错）。
   现改为：答案只从数据真源按 qid 反查，渲染层统一归一化，不再进 HTML 属性。 */
function normAns(v){
  if(v === null || v === undefined) return [];
  if(Array.isArray(v)) return v.map(x=>String(x).trim().toUpperCase()).filter(x=>/^[A-Z]$/.test(x));
  const raw = String(v).trim();
  /* 严格形态：整串只允许字母与分隔符。防从说明文字里误提字母
     （历史案例：某题答案字段为「⚠️待核（…见源PDF）」→ 误提出 P/D/F） */
  if(!/^[A-Za-z][A-Za-z,，、;；\s]*$/.test(raw)) return [];
  return raw.toUpperCase().replace(/[^A-Z]/g, '').split('').filter(Boolean);
}
/* 可作答判定：答案可解析 + 至少一个选项。不可作答题不渲染交互（防误判） */
function isAnswerable(q){ return !!(q && normAns(q.a).length && (q.o || []).length); }
/* 可答题数（进度分母用，不可作答题不计入） */
function answerableCount(d){
  const ch = (DATA && DATA.chapters) ? DATA.chapters[d-1] : null;
  return ((ch && ch.practice) || []).filter(isAnswerable).length;
}
function isMultiQ(q){
  if(!q) return false;
  if(q.t === 'multiple' || q.t === 'multi' || q.t === '多选') return true;
  return normAns(q.a).length > 1;   // 兜底：答案多字母必为多选
}
function findQ(d, qid){
  const ch = (DATA && DATA.chapters) ? DATA.chapters[d-1] : null;
  const qs = (ch && ch.practice) || [];
  for(let i=0;i<qs.length;i++){ if(String(qs[i].id) === String(qid)) return qs[i]; }
  return null;
}
function renderQuiz(d, qs){
  const host = document.getElementById('quiz-d'+d);
  if(!qs.length){ host.innerHTML = '<div class="quiz-hdr">✅ 本章练习</div><p style="font-size:14px;color:#94a3b8">本章暂无配套练习，可到刷题工具练习。</p>'; return; }
  const nAns = qs.filter(isAnswerable).length;
  const naTip = (nAns < qs.length) ? '（另有 '+(qs.length-nAns)+' 题特殊题型待补充）' : '';
  let h = '<div class="quiz-hdr"><span>✅ 本章练习（'+nAns+' 题）'+naTip+'</span><span class="quiz-score" id="qscore-'+d+'">正确 0/'+nAns+'</span></div>';
  qs.forEach((q,qi)=>{
    const multi = isMultiQ(q);
    /* 不可作答防御：答案或选项缺失时不渲染答题交互，
       避免学员点击后被误判（历史案例：配对题占位形态） */
    if(!isAnswerable(q)){
      h += '<div class="qi qi-na" data-d="'+d+'" data-qid="'+esc(q.id||(d+'-'+qi))+'" data-qi="'+qi+'" data-na="1">'
        + '<div class="qmeta"><span class="qbadge">第 '+(qi+1)+' 题</span><span class="qtype">特殊题型</span></div>'
        + '<div class="qstem">'+inlineMd(q.q||'')+'</div>'
        + '<div class="qrow"><div class="qres show na">⚠️ 本题为配对/特殊题型，暂不支持在线作答（内容待补充）</div></div></div>';
      return;
    }
    h += '<div class="qi" data-d="'+d+'" data-qid="'+esc(q.id||(d+'-'+qi))+'" data-qi="'+qi
      + '" data-multi="'+(multi?'1':'0')+'">'
      + '<div class="qmeta"><span class="qbadge">第 '+(qi+1)+' 题</span><span class="qtype '+(multi?'qtype-m':'qtype-s')+'">'+(multi?'多选':'单选')+'</span></div>'
      + '<div class="qstem">'+inlineMd(q.q||'')+'</div><div class="opts">';
    (q.o||[]).forEach(op=>{
      h += '<div class="opt" data-l="'+esc(op.l)+'"><span class="ol">'+esc(op.l)+'.</span><span>'+inlineMd(op.t||'')+'</span></div>';
    });
    h += '</div><div class="qexp" style="display:none">'+esc(q.e||'')+'</div>'
      + '<div class="qrow"><button class="qbtn">确认答案</button><div class="qres"></div></div></div>';
  });
  h += '<div class="score-box" id="scorebox-'+d+'"><div class="score-num" id="scorenum-'+d+'"></div><div class="score-lbl"></div>'
    + '<div class="sb-tip">完整题库与限时模拟考核见首页「题库刷题」入口；未作答的题目在返回目录再进入后仍可继续作答。</div></div>';
  host.innerHTML = h;
  /* 恢复已作答状态 */
  const prog = loadProg();
  const rec = (prog['quiz_d'+d] && prog['quiz_d'+d].answered) || {};
  host.querySelectorAll('.qi').forEach(qi=>{
    const qid = qi.dataset.qid;
    if(rec[qid] !== undefined){
      applyResult(qi, rec[qid].right === 1, rec[qid].sel || [], normAns((findQ(d, qid) || {}).a), true);
    }
  });
  host.querySelectorAll('.qi').forEach(qi=>{
    const qid = qi.dataset.qid; const prog2 = loadProg();
    const rec2 = (prog2['quiz_d'+d] && prog2['quiz_d'+d].answered) || {};
    if(rec2[qid] !== undefined) return;   // 已答锁题
    const optsBox = qi.querySelector('.opts'), btn = qi.querySelector('.qbtn');
    if(!optsBox || !btn) return;          // 不可作答题（特殊题型占位卡）无交互
    const multi = qi.dataset.multi === '1';
    const opts = qi.querySelectorAll('.opt');
    optsBox.addEventListener('click', e=>{
      const o = e.target.closest('.opt'); if(!o) return;
      if(multi){ o.classList.toggle('sel'); }
      else{ opts.forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); }
    });
    btn.addEventListener('click', ()=>{ judge(qi); });
  });
  updateScore(d);
  checkScoreBox(d);
}

function judge(qi){
  const d = qi.dataset.d;
  const ans = normAns((findQ(d, qi.dataset.qid) || {}).a);
  const sel = Array.from(qi.querySelectorAll('.opt.sel')).map(o=>o.dataset.l);
  /* 防复发：答案数据异常时大声报错，不得静默判错 */
  if(!ans.length){
    const r = qi.querySelector('.qres');
    r.className = 'qres show err';
    r.textContent = '⚠️ 本题答案数据异常，无法判定，请反馈管理员';
    return;
  }
  const right = sel.length === ans.length && ans.every(a=>sel.includes(a));
  applyResult(qi, right, sel, ans, false);
  /* 持久化 */
  const prog = loadProg();
  const key = 'quiz_d'+d;
  if(!prog[key]) prog[key] = { answered:{} };
  prog[key].answered[qi.dataset.qid] = { right: right?1:0, sel: sel };
  saveProg(prog);
  updateScore(d);
  refreshProgress();
  checkScoreBox(d);
}

function applyResult(qi, right, sel, ans, restored){
  qi.classList.add('done');
  const opts = Array.from(qi.querySelectorAll('.opt'));
  opts.forEach(o=>{
    const l = o.dataset.l;
    if(ans.includes(l)) o.classList.add(sel.includes(l) ? 'cor' : 'shc');
    else if(sel.includes(l)) o.classList.add('wrg');
  });
  const qres = qi.querySelector('.qres');
  qres.className = 'qres show ' + (right ? 'ok' : 'err');
  const exp = qi.querySelector('.qexp');
  qres.innerHTML = (right ? '✅ 回答正确' : '❌ 回答错误') + '　<span style="font-weight:400">' + inlineMd(exp ? exp.textContent : '') + '</span>';
  qi.querySelector('.qbtn').disabled = true;
  qi.querySelector('.qbtn').textContent = restored ? '已作答' : '已确认';
}

function updateScore(d){
  const prog = loadProg();
  const key = 'quiz_d'+d;
  const rec = (prog[key] && prog[key].answered) || {};
  let right = 0;
  Object.values(rec).forEach(v=>{ if(v.right === 1) right++; });
  const total = answerableCount(d);   // 分母=可答题数（特殊题型占位卡不计入）
  const sc = document.getElementById('qscore-'+d);
  if(sc) sc.textContent = '正确 ' + right + '/' + total;
}

function checkScoreBox(d){
  const prog = loadProg();
  const key = 'quiz_d'+d;
  const rec = (prog[key] && prog[key].answered) || {};
  const total = answerableCount(d);
  if(Object.keys(rec).length >= total && total > 0){
    let right = 0; Object.values(rec).forEach(v=>{ if(v.right === 1) right++; });
    const box = document.getElementById('scorebox-'+d);
    document.getElementById('scorenum-'+d).textContent = right + ' / ' + total;
    box.querySelector('.score-lbl').textContent = right === total ? '🎉 全对，本章掌握扎实！' : (right >= total*0.7 ? '👍 达到及格线（70%），可进入下一章' : '📖 建议回到正文复习错题对应的知识点');
    box.classList.add('show');
  }
}

/* ============ 视图切换与进度 ============ */
function go(d){
  const chapters = DATA.chapters;
  closeSide();
  home.style.display = 'none';
  chapBox.style.display = '';
  chapBox.querySelectorAll('.panel').forEach(p=>{ p.style.display = (p.id === 'panel-d'+d) ? '' : 'none'; });
  const prog = loadProg();
  prog['read_d'+d] = 1;                 // 已读标记
  saveProg(prog);
  window.scrollTo(0,0);
  document.title = baseTitle() + ' · 第 ' + d + ' 章';
  initSpy(d);                            // 常驻目录/进度条/scrollspy 跟随当前章
}

function backHome(){
  detachSpy();
  closeSide();
  chapBox.style.display = 'none';
  home.style.display = '';
  window.scrollTo(0,0);
  document.title = baseTitle();
  refreshProgress();
}

/* 刷新首页进度看板：统计已完成数 + 章卡状态/进度条 */
function refreshProgress(){
  const prog = loadProg();
  const chapters = DATA.chapters;
  let doneCnt = 0;
  chapters.forEach((ch,di)=>{
    const d = di+1;
    const total = (ch.practice||[]).length;
    const rec = (prog['quiz_d'+d] && prog['quiz_d'+d].answered) || {};
    const nDone = Object.keys(rec).length;
    const right = Object.values(rec).filter(v=>v.right===1).length;
    const read = prog['read_d'+d] === 1;
    const pm = document.getElementById('pm-'+d);
    const pmn = document.getElementById('pmn-'+d);
    const pf = document.getElementById('pf-'+d);
    const card = pm ? pm.closest('.ch-card') : null;
    if(!pm) return;
    let state = '未开始', pct = 0;
    if(nDone >= total && total > 0){ state = '已完成'; doneCnt++; card.classList.add('done'); }
    else if(read || nDone > 0){ state = nDone > 0 ? '学习中 ' + nDone + '/' + total : '学习中'; }
    pm.textContent = state;
    if(card) card.classList.toggle('done', nDone >= total && total > 0);
    pct = total ? Math.round(nDone/total*100) : 0;
    if(pf) pf.style.width = pct + '%';
    if(pmn) pmn.textContent = total ? ('答对 ' + right + '/' + total) : '';
  });
  const od = document.getElementById('ovDone');
  if(od) od.textContent = doneCnt;
}

/* ============ 启动 ============ */
if(!DATA){
  document.body.innerHTML = '<div style="padding:60px 24px;text-align:center;font-size:14px;color:#64748b">学习数据未注入：此模板需经构建脚本注入数据后方可使用。</div>';
} else {
  buildHome();
  buildPanels();
  refreshProgress();
}

/* ============ 合体视图切换：学习区 ↔ 题库刷题区 ============
   quiz-embed 内的「← 返回学习目录」按钮与底部导航「📚 学习」都调用 window.kbShowLearnHome */
function kbShowQuiz(){
  detachSpy();
  closeSide();
  home.style.display = 'none';
  chapBox.style.display = 'none';
  const f = document.querySelector('.footer'); if(f) f.style.display = 'none';
  // 修复：.wrap 外壳仅藏子元素会残留 padding（24+60px），把题库顶栏顶离顶部 84px
  // → 外壳自身一并隐藏，保证进入题库视图即贴顶
  const w = document.querySelector('.wrap'); if(w) w.style.display = 'none';
  const qv = document.getElementById('quizView');
  if(qv){
    qv.style.display = 'block';
    const tt = document.getElementById('qzTopTitle');
    if(tt) tt.textContent = (DATA.meta.cnName ? DATA.meta.exam + ' · ' + DATA.meta.cnName : DATA.meta.exam) + ' 题库刷题';
  }
  window.scrollTo(0,0);
  document.title = baseTitle() + ' · 题库刷题';
}
function kbShowLearnHome(){
  detachSpy();
  closeSide();
  const qv = document.getElementById('quizView');
  if(qv) qv.style.display = 'none';
  const f = document.querySelector('.footer'); if(f) f.style.display = '';
  home.style.display = '';
  const w = document.querySelector('.wrap'); if(w) w.style.display = '';
  window.scrollTo(0,0);
  document.title = baseTitle();
  refreshProgress();
}
window.kbShowQuiz = kbShowQuiz;
window.kbShowLearnHome = kbShowLearnHome;
})();
</script>
<script>
/* 图灯箱（移动适配 P1=A）：正文图当前渲染等效字号 <9.5px 时点击可放大到原始 viewBox 尺寸
   等效字号 = 图内最小 text 字号 × (当前渲染宽 ÷ viewBox 宽)；桌面可读图不触发，不打断阅读 */
(function(){
  'use strict';
  var box = null, stage = null;
  function minFontPx(svg){
    var t = svg.querySelectorAll('text'), mn = Infinity;
    for (var i = 0; i < t.length; i++){
      var v = parseFloat(t[i].getAttribute('font-size'));
      if (isNaN(v)){ var cs = getComputedStyle(t[i]); v = parseFloat(cs.fontSize); }
      if (!isNaN(v) && v < mn) mn = v;
    }
    return isFinite(mn) ? mn : 12;
  }
  function effFont(svg){
    var vb = svg.viewBox && svg.viewBox.baseVal;
    if (!vb || !vb.width) return 99;                 // 无 viewBox：不介入
    var w = svg.getBoundingClientRect().width || vb.width;
    return minFontPx(svg) * (w / vb.width);
  }
  function close(){
    if (box) box.classList.remove('show');
    document.documentElement.style.overflow = '';
  }
  function open(svg){
    if (!box){
      box = document.createElement('div');
      box.className = 'fig-lightbox';
      box.innerHTML = '<button class="lb-close" aria-label="关闭放大图">✕</button><div class="lb-stage"></div>';
      document.body.appendChild(box);
      stage = box.querySelector('.lb-stage');
      box.querySelector('.lb-close').addEventListener('click', close);
      box.addEventListener('click', function(e){ if (e.target === box) close(); });
    }
    var vb = svg.viewBox.baseVal;
    var clone = svg.cloneNode(true);
    clone.style.width = vb.width + 'px';             // 原始 viewBox 尺寸 1:1
    clone.style.maxWidth = 'none';
    clone.style.height = 'auto';
    stage.innerHTML = '';
    stage.appendChild(clone);
    box.classList.add('show');
    document.documentElement.style.overflow = 'hidden';
    stage.scrollTop = 0; stage.scrollLeft = 0;
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
  document.addEventListener('click', function(e){
    var svg = e.target.closest ? e.target.closest('.fig-body svg') : null;
    if (!svg) return;
    if (effFont(svg) >= 9.5) return;                 // 当前渲染下可读 → 不打断
    e.preventDefault();
    open(svg);
  });
})();
</script>
