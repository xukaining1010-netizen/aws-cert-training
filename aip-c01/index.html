<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>学习材料</title>
<style>
/* ===== KB-074 页面规范：首页目录 + 章级分页 SPA（非单一长页） ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;font-size:17px;line-height:1.7}
.wrap{max-width:1200px;margin:0 auto;padding:24px 28px 60px}
@media(max-width:768px){.wrap{padding:16px 14px 48px}}

/* ===== 首页 ===== */
.hdr{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:12px;padding:30px 32px 26px;margin-bottom:18px}
.hdr-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:3px 12px;border-radius:20px;margin-bottom:10px}
.hdr h1{font-size:24px;font-weight:800;line-height:1.4}
.hdr-sub{font-size:13px;opacity:.9;margin-top:8px}
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.ov-item{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.ov-num{font-size:28px;font-weight:800;color:#4f46e5;line-height:1.2}
.ov-lbl{font-size:12px;color:#64748b;margin-top:4px}
@media(max-width:768px){.ov{grid-template-columns:repeat(2,1fr)}}

.card-s{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.cs-title{font-size:18px;font-weight:700;color:#374151;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}

/* 章节目录卡 */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ch-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 16px;cursor:pointer;transition:.2s;margin-bottom:0}
.ch-card:hover{border-color:#7c3aed;transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,70,229,.12)}
.ch-card.done{border-color:#16a34a}
.cc-num{font-size:11px;font-weight:700;margin-bottom:3px}
.cc-title{font-size:15px;font-weight:700;color:#1e293b;margin-bottom:6px}
.cc-meta{font-size:13px;color:#64748b}
.cc-prog{margin-top:8px}
.pm{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:3px}
.pbar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .4s}

/* 考试速览 */
.exam-quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.eq-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 10px;text-align:center}
.eq-num{font-size:20px;font-weight:800;color:#4f46e5;line-height:1.2}
.eq-sub{font-size:10.5px;color:#64748b;margin-top:2px}
.eq-lbl{font-size:11px;color:#64748b;margin-top:5px}
.exam-two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:10px}
@media(max-width:768px){.exam-two-col{grid-template-columns:1fr}}
.exam-sub-t{font-size:14px;font-weight:700;color:#374151;margin:4px 0 10px}
.exam-domain-tbl{width:100%;border-collapse:collapse;font-size:15px}
.exam-domain-tbl th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;padding:9px 12px;text-align:left;font-weight:700}
.exam-domain-tbl td{padding:9px 12px;border-bottom:1px solid #e9d5ff;vertical-align:middle}
.exam-domain-tbl tr:nth-child(even) td{background:#faf5ff}
.domain-chip{display:inline-block;border-radius:20px;padding:2px 11px;font-size:12px;font-weight:700;background:#ede9fe;color:#5b21b6;cursor:pointer;border:none;transition:.15s}
.domain-chip:hover{background:#ddd6fe}
.exam-info-list{font-size:15px;color:#374151;margin:0 0 12px 18px}
.exam-info-list li{margin-bottom:6px;line-height:1.7}
.exam-steps{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px;font-size:14px}
.step-block{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;padding:9px 12px;font-size:13px;color:#4338ca;flex:1 1 150px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.step-block b{display:block;font-size:13px}
.step-block span{display:block;font-size:11.5px;color:#6d28d9;margin-top:3px}
.step-arrow{color:#a78bfa;font-weight:700;font-size:16px;padding:0 4px;flex:0 0 auto;align-self:center}
details.exam-faq{margin-top:12px;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;background:#f8fafc}
details.exam-faq summary{font-size:14px;font-weight:700;color:#374151;cursor:pointer}
details.exam-faq p{margin:9px 0 0;font-size:14px;color:#475569;line-height:1.75}

/* 14 天计划 */
.ptbl{width:100%;border-collapse:collapse;font-size:15px}
.ptbl th{background:#f8fafc;padding:11px 12px;text-align:left;font-weight:600;color:#374151;border-bottom:2px solid #e2e8f0;font-size:14px}
.ptbl td{padding:10px 12px;border-bottom:1px solid #f8fafc;vertical-align:middle}
.ptbl tr:last-child td{border-bottom:none}
.day{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.chip-p{background:#ede9fe;color:#5b21b6}.chip-p:hover{background:#ddd6fe}
.focus{font-size:12px;color:#64748b}

/* ===== 章面板 ===== */
.ch-topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);padding:8px 18px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px}
.back-btn{background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:13px;font-weight:600;border-radius:8px;padding:5px 14px;cursor:pointer;white-space:nowrap;transition:.15s}
.back-btn:hover{background:#ede9fe}
.tn-title{font-size:15px;font-weight:700;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-hdr{color:#fff;padding:20px 22px 16px;border-radius:12px 12px 0 0;margin-bottom:0}
.ch-badge{font-size:13px;font-weight:700;opacity:.9;margin-bottom:5px;display:block}
.ch-title{font-size:22px;font-weight:800}
.panel{margin-bottom:14px}
.task-list{padding-left:22px;font-size:16px;color:#374151;line-height:2.0}
.task-list li::marker{color:#a78bfa}
.task-list a{color:#374151;text-decoration:none}
.task-list a:hover{color:#4f46e5}
.tl-id{display:inline-block;min-width:38px;font-weight:700;color:#4f46e5;margin-right:6px}
.panel-hr{border:none;border-top:1px solid #e2e8f0;margin:14px 0}

/* ===== 正文排版（规范 B） ===== */
.mdbody .sec-block h2.mh2{font-size:19px;font-weight:700;color:#4f46e5;margin:4px 0 12px;padding:10px 0 8px;border-top:1px solid #e2e8f0}
.mdbody p{font-size:17px;color:#374151;margin-bottom:14px;line-height:1.9}
.mdbody ul,.mdbody ol{font-size:17px;color:#374151;padding-left:24px;margin-bottom:12px}
.mdbody li{margin-bottom:8px;line-height:1.9}
.mdbody blockquote{border-left:3px solid #a78bfa;padding:10px 16px;background:#f5f3ff;font-size:15px;color:#5b21b6;margin:0 0 14px;border-radius:0 6px 6px 0;line-height:1.8}
.mdbody code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.mdbody h4.sec-h{font-size:17px;font-weight:600;color:#374151;margin:24px 0 10px;padding-left:12px;border-left:3px solid #a78bfa;line-height:1.4}
.mdbody .case-card,.mdbody .mem-card{border-radius:10px;padding:13px 16px;margin-bottom:14px}
.mdbody .case-card{background:#fff8e6;border:1px solid #ecd9a0}
.mdbody .mem-card{background:#eef3ff;border:1px solid #b9c9f7}
.mdbody .case-card h4.sec-h,.mdbody .mem-card h4.sec-h{border-left:none;padding-left:0;margin:0 0 8px;font-size:14px;font-weight:700}
.mdbody .case-card h4.sec-h{color:#9a7b1e}
.mdbody .mem-card h4.sec-h{color:#4361ee}
.mdbody .case-card p,.mdbody .mem-card p{font-size:15px}
.mdbody .case-card ul,.mdbody .mem-card ul{margin-bottom:0;font-size:15px}
/* 表格（规范 C） */
.tbl-wrap{overflow-x:auto;margin:0 0 14px;border:1px solid #e9d5ff;border-radius:10px}
.tbl-wrap table{min-width:480px}
table{border-collapse:collapse;width:100%;font-size:16px}
.mdbody th,.mdbody td{padding:11px 16px;text-align:left;border-bottom:1px solid #e9d5ff;vertical-align:top;line-height:1.6}
.mdbody thead th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;font-weight:700;font-size:15px;white-space:nowrap}
.mdbody tbody tr:nth-child(even) td{background:#faf5ff}
.mdbody tbody tr:last-child td{border-bottom:none}
/* 图块（v2.1 图文同流） */
.fig-block{background:#f8f7ff;border:1px solid #ddd6fe;border-radius:12px;padding:14px 16px;margin:0 0 14px}
.fig-title{font-size:13px;font-weight:700;color:#4f46e5;text-align:center;margin-bottom:10px}
.fig-body{overflow-x:auto}
.fig-body svg{display:block;margin:0 auto;height:auto}
.fig-caption{font-size:12px;color:#6b7280;text-align:center;margin-top:10px;font-style:italic}
/* 手绘图 CSS 类（兼容） */
.compare-tbl{width:100%;border-collapse:collapse;font-size:13px}
.compare-tbl th{padding:9px 12px;font-weight:700;font-size:12px;text-align:center}
.compare-tbl td{padding:8px 12px;border:1px solid #e2e8f0;font-size:13px;vertical-align:top;line-height:1.5}
.compare-tbl tr:nth-child(even) td{background:#faf9ff}
.flow-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.flow-node{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;text-align:center;min-width:80px}
.flow-node.light{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#4338ca}
.flow-node.green{background:linear-gradient(135deg,#06d6a0,#059669);color:#fff}
.flow-arrow{color:#a78bfa;font-size:18px;font-weight:700;flex-shrink:0}
.cycle-wrap{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.cycle-step{display:flex;flex-direction:column;align-items:center;gap:4px}
.cycle-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.cycle-label{font-size:11px;color:#374151;text-align:center;max-width:70px;line-height:1.3}
.cycle-arrow{color:#a78bfa;font-size:16px;align-self:flex-start;margin-top:6px}
.stair-wrap{display:flex;align-items:flex-end;gap:8px;padding:8px 0;justify-content:center;flex-wrap:wrap}
.stair-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.stair-bar{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:6px 6px 0 0;width:80px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;padding:4px}
.stair-label{font-size:11px;color:#374151;text-align:center;max-width:80px;line-height:1.3}

/* 域尾提示卡 */
.tips-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tips-card .tc-title{font-size:15px;font-weight:700;margin-bottom:10px;color:#374151}
.tips-card table{font-size:14px}
.tips-card th{padding:9px 12px;font-size:13px}
.tips-card td{padding:9px 12px;font-size:14px;line-height:1.6}

/* ===== 章末练习 quiz-box（模块 10） ===== */
.quiz-box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:18px 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);scroll-margin-top:78px}
.quiz-hdr{display:flex;align-items:baseline;gap:14px;font-size:18px;font-weight:700;color:#374151;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}
.quiz-score{font-size:14px;font-weight:700;color:#4f46e5;margin-left:auto;white-space:nowrap}
.qi{border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.qi.done{background:#fafafa}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qbadge{background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:700}
.qtype{font-size:11px;border-radius:12px;padding:1px 9px;font-weight:600}
.qtype-s{background:#e0f2fe;color:#0369a1}
.qtype-m{background:#fce7f3;color:#be185d}
.qstem{font-size:16px;color:#1e293b;margin-bottom:10px;line-height:1.8}
.qstem code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{background:#fff;border:1.5px solid #e2e8f0;border-radius:9px;padding:11px 14px;font-size:15.5px;color:#374151;cursor:pointer;transition:.15s;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:#a78bfa}
.opt .ol{font-weight:700;color:#4f46e5;flex-shrink:0}
.opt.sel{border-color:#4f46e5;background:#ede9fe}
.opt.cor{border-color:#16a34a;background:#dcfce7}
.opt.wrg{border-color:#dc2626;background:#fee2e2}
.opt.shc{border-color:#16a34a;background:#f0fdf4}
.qi.done .opt{cursor:default;pointer-events:none}
.qrow{margin-top:10px;display:flex;align-items:center;gap:12px}
.qbtn{background:#4f46e5;color:#fff;font-size:12px;font-weight:600;border:none;border-radius:7px;padding:7px 18px;cursor:pointer;transition:.15s}
.qbtn:hover{background:#4338ca}
.qbtn:disabled{background:#cbd5e1;cursor:default}
.qres{display:none;flex:1;border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.7}
.qres.ok{background:#dcfce7;color:#15803d}
.qres.err{background:#fee2e2;color:#b91c1c}
.qres.na{background:#fef3c7;color:#b45309}
.qres.show{display:block}
.score-box{display:none;text-align:center;background:#f5f3ff;border-radius:10px;padding:22px 16px;margin-top:16px}
.score-box.show{display:block}
.score-num{font-size:32px;font-weight:700;color:#4f46e5;line-height:1.3}
.score-lbl{font-size:13px;color:#6d28d9;margin-top:4px}
.score-box .sb-tip{font-size:12px;color:#64748b;margin-top:8px;line-height:1.7}

.footer{margin-top:26px;padding:18px 10px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:12.5px;text-align:center;line-height:1.9}
.footer a{color:#4f46e5;text-decoration:none}
@media(max-width:768px){.ptbl th,.ptbl td{font-size:13px}.mdbody th,.mdbody td{font-size:13px}}

/* ===== 章面板 v6 布局：左侧常驻目录槽 + 正文列（KB-074 模块 13 升级，2026-09-09 CLF v6 落地） =====
   拍板三要（老徐 2026-09-09）：① 正文 #### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点，见下方 .mh3）
   ② 左侧目录两级（节 ▸ 知识点，单开手风琴 + 滚动自动跟读）③ 左右两侧任何分辨率留白，目录常驻不遮正文：
   ≥1200px：.panel 栅格 [236px 目录槽 | 正文列]，目录 sticky 常驻；<1200px：目录槽变左侧抽屉（☰+遮罩）。 */
body.chapView .wrap{max-width:1420px}
.panel{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start;margin-bottom:14px}
.ch-side{position:sticky;top:14px;min-width:0;z-index:30}
.side-close{display:none}
.toc-open-btn{display:none}
.side-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:85;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.side-mask.show{opacity:1;visibility:visible}
.ch-toc{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 6px 24px rgba(15,23,42,.06);overflow:hidden}
.ch-toc .toc-hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;border-bottom:1px solid #f1f5f9}
.ch-toc .th-title{font-size:13px;font-weight:800;color:#4f46e5;white-space:nowrap}
.ch-toc .th-meta{font-size:11px;color:#94a3b8;font-weight:600;white-space:nowrap}
.ch-toc .toc-body{max-height:calc(100vh - 46px);overflow-y:auto;padding:8px}
.toc-list{list-style:none;margin:0;padding:0}
.toc-list a{display:flex;align-items:baseline;gap:6px;padding:5px 6px;border-radius:7px;color:#475569;text-decoration:none;line-height:1.45;font-size:13px;transition:.12s}
.toc-list a:hover{background:#f5f3ff;color:#4f46e5}
.toc-list a.act{background:#ede9fe;color:#3730a3;font-weight:600}
.toc-list .tl-id{font-size:11.5px;font-weight:700;color:#a78bfa;flex-shrink:0;font-variant-numeric:tabular-nums}
.toc-list a.act .tl-id{color:#4f46e5}
.toc-t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toc-sec>a.toc-sec-link{font-weight:600;color:#334155;padding-top:6px;padding-bottom:6px}
.toc-sec>a .toc-ar{margin-left:auto;flex-shrink:0;font-size:9px;color:#94a3b8;transition:transform .18s}
.toc-sec.open>a .toc-ar{transform:rotate(90deg);color:#4f46e5}
.toc-sub{list-style:none;margin:0;padding:0 0 3px;display:none}
.toc-sec.open>.toc-sub{display:block}
.toc-sub a{padding:3px 6px 3px 20px;font-size:12.5px;color:#64748b;line-height:1.4}
.toc-sub a .tl-id{font-size:11px;color:#c4b5fd}
/* 目录尾【本章练习】入口（v6.2 新增）：独立条目，虚线分隔，点击滚到章末练习区 #quiz-dX */
.toc-quiz{margin-top:7px;padding-top:3px;border-top:1px dashed #ddd6fe}
.toc-quiz>a.toc-quiz-link{font-weight:700;color:#6d28d9;padding-top:6px;padding-bottom:6px}
.toc-quiz>a .tl-id{color:#a78bfa}
.toc-quiz>a.act .tl-id{color:#6d28d9}
@media(max-width:1199px){
  .panel{display:block}
  .ch-side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:90;background:#fff;border-right:1px solid #e2e8f0;box-shadow:0 0 44px rgba(15,23,42,.18);transform:translateX(-102%);transition:transform .22s ease;padding:10px;overflow-y:auto}
  .ch-side.open{transform:none}
  .ch-side .ch-toc{border:none;box-shadow:none;border-radius:0}
  .ch-toc .toc-body{max-height:none;padding-right:4px}
  .toc-open-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:12.5px;font-weight:600;border-radius:8px;padding:4px 10px;cursor:pointer;transition:.15s;white-space:nowrap}
  .toc-open-btn:hover{background:#ede9fe}
  .side-close{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:none;background:#f1f5f9;color:#64748b;border-radius:7px;font-size:12px;cursor:pointer;font-weight:700;flex-shrink:0}
  .side-close:hover{background:#e2e8f0;color:#1e293b}
}
/* 阅读进度（吸顶条底部细线 + 百分比）：v6 新增
   注意：此处不再声明 position，78 行的 .ch-topnav{position:sticky;top:0} 保持生效——
   v6 曾误加 position:relative 覆盖导致吸顶丢失（2026-09-09 老徐反馈窄屏换章节要滚回顶，v6.1 修复） */

const QUIZ_QUESTIONS = [{"id":"D1-001","d":1,"t":"single","q":"一家媒体公司需要对 50TB 的视频转录文本实现 RAG，并支持实时更新。哪种方法能提供最佳性能？","o":[{"l":"A","t":"Amazon Bedrock Knowledge Bases 配合增量同步和 OpenSearch Serverless"},{"l":"B","t":"使用 SageMaker Processing 作业和 Amazon Neptune 的自定义管道"},{"l":"C","t":"使用 Kinesis Data Streams 和 DynamoDB 向量存储的实时流式处理"},{"l":"D","t":"使用 AWS Glue 和自管理 Elasticsearch 的批处理"}],"a":["A"],"e":"Bedrock Knowledge Bases 的增量同步原生支持实时更新能力，OpenSearch Serverless 可大规模处理向量搜索，且无需管理底层基础设施。","s":"源#1"},{"id":"D1-002","d":1,"t":"single","q":"你的 RAG 系统需要处理 15 种语言的文档，并支持按语言检索。哪种嵌入策略最佳？","o":[{"l":"A","t":"使用单一多语言嵌入模型，配合语言元数据过滤"},{"l":"B","t":"使用按语言区分的嵌入模型，每种语言使用独立的向量索引"},{"l":"C","t":"先翻译成英文再嵌入，并追踪源语言"},{"l":"D","t":"使用 Multilingual BERT 进行跨语言对齐和统一搜索"}],"a":["B"],"e":"按语言使用独立模型和独立索引，可避免多语言模型或翻译方法带来的质量损失，每种语言的检索准确率最高。","s":"源#2"},{"id":"D1-003","d":1,"t":"single","q":"一家律师事务所要求 RAG 在 EU 区域内实现严格的数据驻留，并为所有查询提供审计追踪。哪种配置满足这些要求？","o":[{"l":"A","t":"在 eu-west-1 部署 Bedrock Knowledge Bases，配合 CloudTrail 和 VPC 端点"},{"l":"B","t":"在 eu-central-1 使用自管理方案和自定义审计日志"},{"l":"C","t":"多区域部署，带数据复制和集中式日志"},{"l":"D","t":"在 us-east-1 使用 Bedrock，带数据加密和访问日志"}],"a":["A"],"e":"Bedrock 部署在 EU 区域满足数据驻留要求；CloudTrail 提供审计追踪；VPC 端点确保私有网络访问，数据不离开该区域。","s":"源#3"},{"id":"D1-004","d":1,"t":"single","q":"你的分块（chunking）策略在不同文档类型（PDF、Word、HTML）之间产生不一致的结果。哪种方法是最优的？","o":[{"l":"A","t":"按文档类型定制分块，统一生成嵌入"},{"l":"B","t":"基于内容结构的语义分块，不依赖文档格式"},{"l":"C","t":"固定大小分块，按文档类型调整重叠"},{"l":"D","t":"层级分块，带父子关系和元数据"}],"a":["B"],"e":"语义分块关注语义边界而非格式特定规则，无论源文档类型如何都能提供一致的结果。","s":"源#4"},{"id":"D1-005","d":1,"t":"single","q":"一个 RAG 系统出现 40% 的不相关检索结果。当前配置使用 512-token 块和 50-token 重叠。哪种优化能带来最大改进？","o":[{"l":"A","t":"将块大小增加到 1024 token，重叠减少到 25 token"},{"l":"B","t":"实现语义分块并保留句子边界"},{"l":"C","t":"添加元数据丰富化和混合搜索（语义+关键词匹配）"},{"l":"D","t":"改用更小的块（256 token）并增加重叠（100 token）"}],"a":["C"],"e":"混合搜索结合语义和关键词匹配，配合元数据丰富化，通过多个相关性信号提高了精度，从根本上解决检索不相关问题。","s":"源#5"},{"id":"D1-006","d":1,"t":"single","q":"你需要为包含复杂图表和代码片段的技术文档实现 RAG。哪种方法最适合处理多模态内容？","o":[{"l":"A","t":"仅提取文本，使用传统 RAG 并配合代码语法高亮"},{"l":"B","t":"使用 Amazon Bedrock Data Automation 配合 Nova 模型进行统一处理"},{"l":"C","t":"对文本、图像和代码分别处理，并建立交叉引用"},{"l":"D","t":"使用 Amazon Textract 的自定义 OCR 管道和手动内容关联"}],"a":["B"],"e":"Bedrock Data Automation 配合 Nova 模型原生支持多模态理解，在统一管道中处理文本、图像和代码，无需自定义集成。","s":"源#6"},{"id":"D1-007","d":1,"t":"single","q":"一个金融服务 RAG 系统需要维护监管文档的版本控制，并支持历史查询。哪种架构支持此需求？","o":[{"l":"A","t":"带版本控制的 S3 存储桶，配合基于时间戳的 Knowledge Base 配置"},{"l":"B","t":"基于 Git 的文档管理，自动更新 Knowledge Base"},{"l":"C","t":"Knowledge Bases 中的文档版本管理，带时间查询参数"},{"l":"D","t":"每个文档版本使用独立的 Knowledge Base，统一查询接口"}],"a":["A"],"e":"S3 版本控制配合基于时间戳的 KB 配置，原生提供版本控制能力，并可针对特定文档版本进行查询。","s":"源#7"},{"id":"D1-008","d":1,"t":"single","q":"你的 RAG 检索延迟在 1000 万文档语料上平均为 3 秒。哪种优化能显著降低延迟？","o":[{"l":"A","t":"实现近似最近邻搜索，降低精度"},{"l":"B","t":"为频繁访问的嵌入添加 Redis 缓存层"},{"l":"C","t":"优化向量数据库配置并增加计算资源"},{"l":"D","t":"为常见查询模式预先计算并缓存嵌入"}],"a":["D"],"e":"预计算常见查询的嵌入可完全省去嵌入生成步骤，为高频模式提供最大的延迟降低。","s":"源#8"},{"id":"D1-009","d":1,"t":"single","q":"一个医疗保健 RAG 系统需要处理患者记录，并严格符合 HIPAA 合规要求。哪种数据处理方法确保合规？","o":[{"l":"A","t":"本地处理，通过加密传输到 Bedrock"},{"l":"B","t":"在专用 VPC 中使用 AWS PrivateLink 连接 Bedrock，并进行静态加密"},{"l":"C","t":"处理前进行数据匿名化，并维护审计追踪"},{"l":"D","t":"混合方案：仅在本地处理敏感数据"}],"a":["B"],"e":"PrivateLink 确保数据不经过公共互联网；专用 VPC 提供网络隔离；静态加密满足 AWS 内的 HIPAA 要求。","s":"源#9"},{"id":"D1-010","d":1,"t":"single","q":"你正在为多租户 SaaS 应用实现 RAG。每个租户需要隔离的数据访问。哪种架构提供安全的租户隔离？","o":[{"l":"A","t":"单一 Knowledge Base，配合租户特定元数据过滤"},{"l":"B","t":"每个租户独立的 Knowledge Base，配合 IAM 访问控制"},{"l":"C","t":"共享 Knowledge Base，应用层访问控制"},{"l":"D","t":"租户特定 S3 桶，配合统一 Knowledge Base 和行级安全"}],"a":["B"],"e":"独立 Knowledge Base 配合 IAM 提供最强的隔离保证，从基础设施层面防止跨租户数据泄漏。","s":"源#10"},{"id":"D1-011","d":1,"t":"single","q":"你的向量数据库在对超过 1 亿个嵌入进行相似性搜索时性能下降。哪种优化策略最有效？","o":[{"l":"A","t":"实现分层可导航小世界（HNSW）索引"},{"l":"B","t":"使用乘积量化降低嵌入维度"},{"l":"C","t":"按内容类型分区向量，并行执行搜索"},{"l":"D","t":"实现局部敏感哈希（LSH）进行近似搜索"}],"a":["A"],"e":"HNSW 在搜索速度和召回质量之间提供了最佳平衡，通过多层图结构在 1 亿+向量下仍能保持高精度。","s":"源#11"},{"id":"D1-012","d":1,"t":"single","q":"一个 RAG 系统需要同时支持语义搜索和关键词搜索，并融合结果。哪种实现提供最佳相关性？","o":[{"l":"A","t":"独立的向量和关键词索引，加权组合得分"},{"l":"B","t":"同时编码语义和词法信息的混合嵌入"},{"l":"C","t":"并行搜索，基于机器学习进行结果排序"},{"l":"D","t":"顺序搜索，按关键词相关性过滤语义结果"}],"a":["A"],"e":"独立索引配合加权得分融合（如 Reciprocal Rank Fusion）允许对每种搜索类型独立优化，同时结合其优势。","s":"源#12"},{"id":"D1-013","d":1,"t":"single","q":"你需要将 5 亿个嵌入从 Pinecone 迁移到 OpenSearch Serverless，且零停机。最佳迁移策略是什么？","o":[{"l":"A","t":"双写方法，逐步迁移流量并验证一致性"},{"l":"B","t":"批量导出/导入，迁移期间临时只读模式"},{"l":"C","t":"实时复制，最终一致性，支持回滚"},{"l":"D","t":"蓝绿部署，全量数据同步后通过 DNS 切换"}],"a":["A"],"e":"双写确保零停机，同时写入两个系统，逐步切换流量并通过验证发现不一致，在完全切换前捕获问题。","s":"源#13"},{"id":"D1-014","d":1,"t":"single","q":"你的嵌入模型产生 1536 维向量，但存储成本过高。哪种降维方法能保持检索质量？","o":[{"l":"A","t":"使用主成分分析（PCA）降至 768 维"},{"l":"B","t":"使用更小的 384 维嵌入模型并微调"},{"l":"C","t":"使用 8-bit 精度编码的向量量化"},{"l":"D","t":"稀疏嵌入，选择 top-k 特征并压缩"}],"a":["C"],"e":"8-bit 向量量化可将存储减少 75%，同时保持接近原始的检索质量，因为量化误差对相似性比较影响很小。","s":"源#14"},{"id":"D1-015","d":1,"t":"single","q":"一个多模态 RAG 系统需要跨文本、图像和音频嵌入进行统一搜索。哪种架构支持跨模态检索？","o":[{"l":"A","t":"独立的嵌入空间，学习跨模态相似性"},{"l":"B","t":"使用多模态基础模型的统一嵌入空间"},{"l":"C","t":"模态特定索引，查询时使用学习权重融合"},{"l":"D","t":"层级嵌入结构，带模态特定子空间"}],"a":["B"],"e":"多模态基础模型将所有模态投射到单一嵌入空间，无需复杂的融合逻辑即可直接进行跨模态相似性搜索。","s":"源#15"},{"id":"D1-016","d":1,"t":"single","q":"你的向量搜索返回语义相似但上下文不相关的结果。哪种技术能改善上下文相关性？","o":[{"l":"A","t":"实现带文档级信息的上下文嵌入"},{"l":"B","t":"基于文档新近度和相关性添加时间权重"},{"l":"C","t":"使用查询扩展和上下文关键词过滤"},{"l":"D","t":"使用交叉编码器模型进行重排序以匹配上下文"}],"a":["D"],"e":"交叉编码器重排序同时评估查询-文档对（而非独立评估），能捕获双编码器嵌入无法捕捉的上下文关系。","s":"源#16"},{"id":"D1-017","d":1,"t":"single","q":"一个 RAG 系统在模型更新后出现嵌入漂移。哪种监控方法能检测并缓解漂移？","o":[{"l":"A","t":"监控新旧嵌入之间的余弦相似性并告警"},{"l":"B","t":"使用评估数据集和质量指标比较查询结果"},{"l":"C","t":"使用统计漂移检测方法分析嵌入分布"},{"l":"D","t":"跨模型版本比较检索质量的 A/B 测试框架"}],"a":["C"],"e":"对嵌入分布进行统计漂移检测，可在检索质量下降前捕捉到系统性偏移，从而进行主动缓解。","s":"源#17"},{"id":"D1-018","d":1,"t":"single","q":"你需要对 5000 万嵌入语料实现增量更新，且无需完全重建索引。哪种方法最有效？","o":[{"l":"A","t":"带版本化嵌入的增量更新，延迟删除过期向量"},{"l":"B","t":"流式更新，实时维护索引并做一致性检查"},{"l":"C","t":"批处理，局部重建索引并热切换"},{"l":"D","t":"预写日志，定期整合和优化索引"}],"a":["A"],"e":"带版本化嵌入的增量更新无需重建整个索引即可进行增量变更，延迟删除避免了昂贵的即时清理。","s":"源#18"},{"id":"D1-019","d":1,"t":"single","q":"一个向量数据库需要同时支持精确搜索和近似搜索，并允许配置精度-召回权衡。哪种实现提供这种灵活性？","o":[{"l":"A","t":"可配置的 HNSW 参数，运行时调整精度"},{"l":"B","t":"多种索引类型，查询时按需选择"},{"l":"C","t":"自适应搜索算法，根据查询复杂度调整精度"},{"l":"D","t":"层级搜索，高精度查询时回退到精确搜索"}],"a":["A"],"e":"带可配置 ef_search 参数的 HNSW 允许运行时调整精度-召回，无需维护多个索引或复杂路由逻辑。","s":"源#19"},{"id":"D1-020","d":1,"t":"single","q":"你的 RAG 系统需要处理 100+ 种语言的嵌入，并支持跨语言检索。哪种嵌入策略是最优的？","o":[{"l":"A","t":"语言特定模型，使用平行语料进行跨语言对齐"},{"l":"B","t":"多语言句子变换器，统一嵌入空间"},{"l":"C","t":"基于翻译的方法，使用英文嵌入和查询翻译"},{"l":"D","t":"语言无关嵌入，使用字符级编码和注意力机制"}],"a":["B"],"e":"多语言句子变换器将所有语言映射到单一嵌入空间，无需翻译开销即可直接进行跨语言检索。","s":"源#20"},{"id":"D1-021","d":1,"t":"single","q":"一个文档处理管道每天需要处理 10,000 份包含复杂布局和表格的 PDF。哪种方法能确保准确的文本提取？","o":[{"l":"A","t":"Amazon Textract 配合自定义后处理以保留表格结构"},{"l":"B","t":"基于机器学习的 OCR 布局分析和内容重建"},{"l":"C","t":"Amazon Bedrock Data Automation，理解文档结构"},{"l":"D","t":"多阶段处理，不同内容类型使用专用工具"}],"a":["C"],"e":"Bedrock Data Automation 提供端到端的文档理解，包括复杂布局和表格，无需自定义后处理管道。","s":"源#21"},{"id":"D1-022","d":1,"t":"single","q":"你的提示工程流程缺乏版本控制和 A/B 测试能力。哪个框架提供全面的提示管理？","o":[{"l":"A","t":"Amazon Bedrock Prompt Management，带版本化和评估工作流"},{"l":"B","t":"基于 Git 的提示版本控制和自定义 A/B 测试基础设施"},{"l":"C","t":"MLflow 提示跟踪，自动评估和部署"},{"l":"D","t":"自定义提示注册表，带元数据跟踪和性能分析"}],"a":["A"],"e":"Bedrock Prompt Management 原生提供版本化、评估工作流和 A/B 测试能力，无需构建自定义基础设施。","s":"源#22"},{"id":"D1-023","d":1,"t":"single","q":"一个 RAG 系统对相似查询产生不一致的响应。哪种提示工程技术能改善一致性？","o":[{"l":"A","t":"少样本提示，带多样示例和一致的格式模板"},{"l":"B","t":"思维链提示，带显式推理步骤和验证"},{"l":"C","t":"带变量替换和标准化指令的提示模板"},{"l":"D","t":"带自我反思和一致性检查机制的元提示"}],"a":["C"],"e":"标准化提示模板配合变量替换可确保一致的指令框架，减少因提示措辞差异导致的响应变化。","s":"源#23"},{"id":"D1-024","d":1,"t":"single","q":"你需要优化提示以降低成本，同时保持质量。当前提示平均为 2000 token。哪种策略能带来最大节省？","o":[{"l":"A","t":"使用学习压缩模型和关键信息提取进行提示压缩"},{"l":"B","t":"根据查询复杂度和所需细节动态生成提示"},{"l":"C","t":"基于模板的提示，带变量内容插入和上下文剪枝"},{"l":"D","t":"层级提示，根据初始响应质量逐步添加细节"}],"a":["A"],"e":"学习型提示压缩可将 token 数量减少 50-70%，同时保留语义含义，提供最大的直接成本降低。","s":"源#24"},{"id":"D1-025","d":1,"t":"single","q":"一个多步骤推理任务需要带错误处理的复杂提示链。哪种实现模式最稳健？","o":[{"l":"A","t":"Amazon Bedrock Flows，带条件逻辑和错误恢复机制"},{"l":"B","t":"Step Functions 编排，配合 Lambda 提示执行和重试逻辑"},{"l":"C","t":"带断路器机制和回退提示策略的自定义编排"},{"l":"D","t":"带工具调用和自主错误纠正的 Agent 方法"}],"a":["A"],"e":"Bedrock Flows 原生提供提示链、内置条件逻辑和错误恢复，专为多步骤 GenAI 工作流设计。","s":"源#25"},{"id":"D1-026","d":1,"t":"single","q":"你的提示注入检测系统有 15% 的误报率。哪种方法能提高检测准确性？","o":[{"l":"A","t":"基于规则和 ML 分类器的多层检测"},{"l":"B","t":"带用户意图分类和异常检测的上下文分析"},{"l":"C","t":"Amazon Bedrock Guardrails，识别自定义提示攻击模式"},{"l":"D","t":"结合多种检测算法和置信度评分的集成方法"}],"a":["C"],"e":"Bedrock Guardrails 提供托管提示攻击检测，AWS 持续更新以识别新出现的模式，通过 AWS 维护的模型减少误报。","s":"源#26"},{"id":"D1-027","d":1,"t":"single","q":"一个 RAG 系统需要根据检索上下文质量和用户专业水平动态调整提示。哪种架构支持此功能？","o":[{"l":"A","t":"带上下文质量评估和用户画像的自适应提示"},{"l":"B","t":"多层提示模板，根据上下文分析自动选择"},{"l":"C","t":"基于强化学习的提示优化，集成用户反馈"},{"l":"D","t":"使用元学习和上下文感知模板的动态提示生成"}],"a":["A"],"e":"自适应提示动态评估上下文质量和用户专业水平，调整提示策略，提供个性化且上下文适当的响应。","s":"源#27"},{"id":"D1-028","d":1,"t":"single","q":"你需要为高流量应用实现提示缓存，该应用有 80% 的查询相似度。哪种缓存策略优化性能？","o":[{"l":"A","t":"基于语义相似性的缓存，带可配置相似度阈值"},{"l":"B","t":"精确匹配缓存，带查询规范化和参数提取"},{"l":"C","t":"带提示模板和变量替换的层级缓存"},{"l":"D","t":"带一致性哈希和缓存预热策略的分布式缓存"}],"a":["A"],"e":"语义相似性缓存即使措辞不同也能捕获 80% 的相似查询，通过嵌入匹配最大化缓存命中率。","s":"源#28"},{"id":"D1-029","d":1,"t":"single","q":"提示优化过程需要跨多个质量维度进行自动评估。哪个框架提供全面评估？","o":[{"l":"A","t":"自定义评估管道，带多个指标和人工反馈集成"},{"l":"B","t":"Amazon Bedrock Model Evaluations，带自动质量评估工作流"},{"l":"C","t":"带持续评估和自动提示改进的 MLOps 管道"},{"l":"D","t":"带统计显著性测试和质量门的 A/B 测试框架"}],"a":["B"],"e":"Bedrock Model Evaluations 原生提供多维质量评估和自动化工作流，无需构建自定义评估基础设施。","s":"源#29"},{"id":"D1-030","d":1,"t":"single","q":"你的系统需要为 50+ 个用例生成领域特定提示，并保持一致质量。哪种方法能有效扩展？","o":[{"l":"A","t":"基于模板的生成，带领域特定知识库和验证"},{"l":"B","t":"带领域示例和自动提示合成的少样本学习"},{"l":"C","t":"带提示生成模型和质量评估的元学习方法"},{"l":"D","t":"带领域特定模块和组合规则的层级提示结构"}],"a":["A"],"e":"基于模板的生成配合领域知识库，可跨 50+ 个用例提供一致、可扩展的提示创建，同时通过验证保持质量。","s":"源#30"},{"id":"D1-031","d":1,"t":"single","q":"一个 RAG 应用检索到太多来自同一文档的重复段落。哪种技术能改善上下文多样性？","o":[{"l":"A","t":"输出 Token 扩展"},{"l":"B","t":"结果去重"},{"l":"C","t":"提示随机化"},{"l":"D","t":"公有存储桶访问"}],"a":["B"],"e":"结果去重确保上下文包含来自不同文档的多样化信息，避免同一来源的冗余段落挤占上下文窗口。","s":"样题#10"},{"id":"D1-032","d":1,"t":"single","q":"某企业为数百万商业客户提供定制化视频生成服务。客户通过向专属生成式AI模型提交提示词来制作营销视频。为提升输出相关性与个性化水平，该公司计划融入客户上下文信息（产品偏好、客户属性及业务历史）。该客户有严格数据治理要求，须对自身数据保持完全所有权与控制权，无需实时数据访问，但要求较高语义准确率与较低检索延迟。该公司希望尽量降低架构复杂度，且不愿在各客户环境中部署服务。哪项方案可满足上述需求？","o":[{"l":"A","t":"让各客户建立自有 Amazon Q Business 索引以容纳内部数据，并将该公司指定为数据访问者，使其可通过安全 API 检索内容来增强提示"},{"l":"B","t":"借助 Model Context Protocol 的联合检索能力，在各客户处部署实时 MCP 服务器，在生成提示时即时获取数据"},{"l":"C","t":"让各客户配置 Amazon Bedrock Knowledge Bases，开启跨账户查询使该公司可检索结构化数据用于提示增强"},{"l":"D","t":"配置 Amazon Kendra 爬取客户数据源，跨账户共享索引供该公司查询各客户的 Kendra 索以获取增强数据"}],"a":["A"],"e":"**✅ 为什么 A.让各客户建立自有 Amazon Q Business 索引 对**：Amazon Q Business 专为企业级安全数据访问而设计，各客户维护自有索引确保数据不脱离其控制边界。将该公司指定为数据访问者后可通过安全 API 实现受控可审计的检索，满足数据治理与所有权要求，无需在客户环境中部署基础设施。\n\n**❌ 为什么其他选项错**：\n- B.部署实时 MCP 服务器：需在各客户处维护实时服务，引入不必要的运营复杂度\n- C.配置 Bedrock Knowledge Bases 跨账户：增加集成复杂度与治理风险，管理负担较重\n- D.共享 Kendra 索引：跨账户共享使访问控制与数据所有权边界复杂化\n\n**📌 关键概念**：Amazon Q Business 提供托管式企业数据索引与安全检索能力，支持数据访问者模式实现受控的提示增强，适合数据治理严格的场景。","s":"第三方#1"},{"id":"D1-033","d":1,"t":"single","q":"某金融机构正在搭建基于 Amazon Bedrock 的检索增强生成应用，用于生成市场动态摘要。该应用依赖一个向量数据库存储索引数量较少的小型专有数据集，需执行相似性搜索。模型响应须最大化准确率并保持高性能。该公司应如何配置向量数据库并将其与应用集成？","o":[{"l":"A","t":"启动 Amazon MemoryDB 集群并使用 Flat 算法配置索引，根据性能指标配置水平扩展策略"},{"l":"B","t":"启动 Amazon MemoryDB 集群并使用分层可导航小世界（HNSW）算法配置索引，根据性能指标配置垂直扩展策略"},{"l":"C","t":"启动 Amazon Aurora PostgreSQL 集群并使用 IVFFlat 算法配置索引，配置实例类在负载增加时扩展到更大规格"},{"l":"D","t":"启动带 IVFFlat 索引和高探测值的 Amazon DocumentDB 集群，将连接配置为副本集并将读取分发到副本实例"}],"a":["B"],"e":"**✅ 为什么 B.MemoryDB 集群配合 HNSW 算法 对**：Amazon MemoryDB 是全托管内存数据库，提供微秒级延迟，适合需要快速向量相似性搜索的实时 RAG 场景。对于索引量少的小型数据集，HNSW 算法以高召回率著称，优于针对海量数据优化的近似方法。垂直扩展在该数据规模下已足够，无需管理分布式索引的复杂性。\n\n**❌ 为什么其他选项错**：\n- A.Flat 算法：计算开销大且效率低，即使对中等查询量也不经济\n- C.Aurora PostgreSQL：关系型数据库未针对内存向量搜索优化，引入较高延迟\n- D.DocumentDB：非为高性能向量工作负载设计，副本管理增加不必要复杂性\n\n**📌 关键概念**：Amazon MemoryDB 配合 HNSW 算法适合小型数据集的高精度向量搜索；垂直扩展在有限数据规模下可简化运维。","s":"第三方#3"},{"id":"D1-034","d":1,"t":"single","q":"某金融企业正在构建客户支持应用，需根据用户查询的语义相似度从数据库检索相关金融法规文档，并与 Amazon Bedrock 集成生成响应。该应用须搜索英文、西班牙文和葡萄牙文文档，并按元数据（如发布日期、监管机构、文档类型）进行过滤。底库容纳约一千万条文档向量。为削减管理负担，该公司希望尽量减少管理工作同时为实时客户交互提供低延迟响应。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Amazon OpenSearch Serverless 提供向量搜索和元数据过滤，与 Amazon Bedrock Knowledge Bases 集成以启用检索增强生成"},{"l":"B","t":"部署带 pgvector 扩展的 Amazon Aurora PostgreSQL，将嵌入和元数据存储在表中，使用 SQL 查询进行相似性搜索后将结果发送到 Amazon Bedrock"},{"l":"C","t":"使用 Amazon S3 Vectors 配置向量索引和不可过滤的元数据字段，与 Amazon Bedrock 集成用于 RAG"},{"l":"D","t":"设置带向量索引的 Amazon Neptune Analytics 数据库，使用基于图的检索和 Amazon Bedrock 生成响应"}],"a":["A"],"e":"**✅ 为什么 A.OpenSearch Serverless 配合 Bedrock Knowledge Bases 对**：OpenSearch Serverless 专为高容量低延迟搜索工作负载设计，无需管理集群或容量规划，支持向量搜索与结构化元数据过滤，可在 1000 万嵌入中高效检索。与 Bedrock Knowledge Bases 集成实现全托管 RAG 工作流，多语言支持在嵌入和检索层处理。\n\n**❌ 为什么其他选项错**：\n- B.Aurora PostgreSQL：需数据库调优和向量化扩展，增加运营开销\n- C.S3 Vectors：不支持高级元数据过滤这一关键需求\n- D.Neptune Analytics：引入不必要的复杂性，未针对大规模语义文档检索优化\n\n**📌 关键概念**：OpenSearch Serverless 提供无服务器向量搜索与元数据过滤，配合 Bedrock Knowledge Bases 可实现低运维的托管 RAG。","s":"第三方#8"},{"id":"D1-035","d":1,"t":"single","q":"某医疗机构正在搭建论文管理平台，将学术文献存放在 Amazon S3 存储桶。该机构需要一个全面的元数据框架以提高 GenAI 应用的搜索精度。元数据须包含文档时间戳、作者信息和研究领域分类，且在所有上传文档中保持一致结构。该方案须允许基础模型在无需读取全文的前提下把握文档背景信息。哪项方案可满足需求？","o":[{"l":"A","t":"将文档时间戳存储在 S3 系统元数据中，使用 S3 对象标签进行领域分类，通过自定义用户定义元数据存储作者信息"},{"l":"B","t":"设置带法律保留的 S3 Object Lock 跟踪时间戳，使用 S3 对象标签存储作者信息，配置 S3 接入点进行领域分类"},{"l":"C","t":"使用 S3 Inventory 报告跟踪时间戳，创建 S3 接入点进行领域分类，将作者信息存储在 S3 Storage Lens 仪表盘中"},{"l":"D","t":"使用自定义用户定义元数据存储作者信息，使用 S3 Object Lock 保留期限作为时间戳，使用 S3 事件通知进行领域分类"}],"a":["A"],"e":"**✅ 为什么 A.S3 系统元数据+用户定义元数据+对象标签 对**：S3 系统元数据自动记录创建和修改时间戳，提供可靠的时间上下文。用户定义元数据以键值对形式直接与对象存储，适合保存作者等结构化属性。S3 对象标签专为轻量级分类和过滤设计，可标准化研究领域标记。三者组合实现了清晰的责任分离，让模型仅凭元数据即可推断文档上下文。\n\n**❌ 为什么其他选项错**：\n- B.Object Lock+接入点：将特性用于非设计用途，增加复杂性无益于元数据质量\n- C.Inventory+Storage Lens：报告和仪表盘不是存储可查询元数据的合适数据源\n- D.Object Lock+事件通知：保留期限和事件通知非用于元数据管理的标准机制\n\n**📌 关键概念**：S3 元数据体系包括系统元数据（时间戳）、用户定义元数据（自定义属性）和对象标签（分类标记），组合使用可为 GenAI 提供丰富的文档上下文。","s":"第三方#9"},{"id":"D1-036","d":1,"t":"single","q":"某金融企业希望开发一个基于 Amazon Bedrock 的应用，使分析师能查询季度收益报告和财务报表。这些文档通常 5-100 页，包含表格和文本。应用须提供上下文准确的响应，维护财务数据指标和对应说明文字之间的关联。为支持准确且可扩展的检索，应用须包含文档分段和上下文管理策略。哪项方案可满足需求？","o":[{"l":"A","t":"采用直接模型调用方式，利用 Claude 将每份财务文档作为单个输入处理，用微调提示指示模型分别解析表格和文本"},{"l":"B","t":"使用 Amazon Bedrock Knowledge Bases 创建 RAG 应用，从按上下文分段的财务文档部分检索信息，根据文档结构布局进行分段并包含来源引用"},{"l":"C","t":"部署带操作组的 Amazon Bedrock 代理，调用自定义 Lambda 函数分析财务文档，配置函数执行固定大小分块"},{"l":"D","t":"创建分别针对结构化和非结构化数据优化的两个 Bedrock 应用，各自使用定制分块策略，并实现查询路由逻辑"}],"a":["B"],"e":"**✅ 为什么 B.Bedrock Knowledge Bases 按结构分段 对**：Bedrock Knowledge Bases 专为处理大型复杂文档而设计，支持上下文感知的分块策略。根据文档结构布局（章节、子章节、表格和评论）进行分段，可在检索时保持表格指标与解释性叙述的语义连接。来源引用支持可审计性，这在金融场景中是常见要求。托管服务自动管理嵌入生成和索引编排，无需自定义基础设施。\n\n**❌ 为什么其他选项错**：\n- A.直接模型调用：单提示处理整篇文档增加 Token 用量和延迟，存在上下文截断风险\n- C.代理+固定大小分块：查询时触发固定分块易破坏结构化内容中的语义关系\n- D.双应用架构：引入不必要的复杂性和运营开销\n\n**📌 关键概念**：Bedrock Knowledge Bases 支持基于文档结构的上下文分块，能保留表格与解释文本的语义关联，适合财务文档的精准 RAG 检索。","s":"第三方#11"},{"id":"D1-037","d":1,"t":"single","q":"某 GenAI 开发者正在构建基于 RAG 的客户支持应用，使用 Amazon Bedrock 基础模型。该应用需处理存储在 Amazon S3 中作为 JSON 文件的 50 GB 历史客户对话数据。数据处理工作流须从文档中提取相关数据、删除个人身份信息并生成向量嵌入。该工作流须具成本效益并在 4 小时内完成。哪项方案的运营开销最低？","o":[{"l":"A","t":"使用 Lambda 和 Amazon Comprehend 并行处理文件、删除 PII 并调用 Bedrock API 生成向量，配置 Lambda 并发限制和内存设置"},{"l":"B","t":"创建 Glue ETL 作业运行 PII 检测脚本，使用 SageMaker Processing 运行 HuggingFaceProcessor 生成嵌入并存储到 OpenSearch Service"},{"l":"C","t":"部署运行 Apache Spark 的 EMR 集群，使用 UDF 调用 Comprehend 检测 PII 并用 Bedrock API 生成向量，存储到 Aurora PostgreSQL"},{"l":"D","t":"使用 Step Functions 编排工作流，用 Comprehend 检测 PII 并用 Bedrock 生成嵌入，直接与 OpenSearch Serverless 集成存储向量和相似性搜索"}],"a":["D"],"e":"**✅ 为什么 D.Step Functions+Comprehend+Bedrock+OpenSearch Serverless 对**：Step Functions 提供无服务器编排层，协调并行处理、重试和错误处理而无需管理集群。Comprehend 以托管方式满足 PII 删除要求。Bedrock 生成嵌入使工作流保持在 AWS 托管服务范围内。与 OpenSearch Serverless 的直接集成提供低运维的向量存储和相似性搜索，无需集群调整或分片管理。\n\n**❌ 为什么其他选项错**：\n- A.Lambda+Comprehend：50 GB 规模下 Lambda 并发和每次调用开销使调优复杂且成本高\n- B.Glue+SageMaker Processing：引入模型管理和额外处理层，增加运营复杂性\n- C.EMR 集群：需集群管理和调优，与最低运维开销目标相反\n\n**📌 关键概念**：Step Functions 配合 Comprehend 和 Bedrock 构建全托管 PII 清理与嵌入生成管道，OpenSearch Serverless 提供无运维的向量存储。","s":"第三方#17"},{"id":"D1-038","d":1,"t":"single","q":"某公司正在构建法律研究 AI 助手，使用 Amazon Bedrock 和 Anthropic Claude 基础模型。该助手须检索高度相关的判例法文档以增强模型响应，须识别法律概念、专有法务术语及引用文献彼此间的语义联系，且须快速执行并返回精确结果。哪项方案可满足需求？","o":[{"l":"A","t":"配置 Bedrock Knowledge Bases 使用默认向量搜索，使用 Bedrock 扩展查询改进对特定术语和引文的检索"},{"l":"B","t":"使用 OpenSearch Service 部署结合向量搜索与关键词搜索的混合搜索架构，并应用 Bedrock 重排序模型优化结果相关性"},{"l":"C","t":"为最终用户启用 Amazon Kendra 查询建议，使用 Bedrock 对搜索结果进行后处理以识别语义相似性"},{"l":"D","t":"使用 OpenSearch Service 向量搜索和 Titan Embeddings 索引法律文档，使用自定义 Lambda 将结果与 RDS 中关键词过滤器合并"}],"a":["B"],"e":"**✅ 为什么 B.OpenSearch 混合搜索+Bedrock 重排序 对**：法律研究既需语义理解也需精确词法匹配，尤其是法规条文、引文和领域术语。混合搜索结合向量相似性与关键词检索，确保精确短语匹配和高语义召回。Bedrock 重排序模型基于更深层上下文理解优化结果排序，在传递给 Claude 前提高答案准确性并减少幻觉。OpenSearch 原生支持混合搜索，无需外部编排。\n\n**❌ 为什么其他选项错**：\n- A.默认向量搜索：无法可靠处理引文和精确术语匹配\n- C.Kendra 查询建议+后处理：侧重查询建议而非检索质量\n- D.自定义 Lambda 合并：跨多系统合并结果引入不必要的操作复杂性\n\n**📌 关键概念**：OpenSearch 混合搜索融合向量语义与关键词精确匹配，配合 Bedrock 重排序模型可优化法律文献检索的相关性。","s":"第三方#28"},{"id":"D1-039","d":1,"t":"single","q":"某公司正在构建 GenAI 应用，基于多种内外部数据源生成内容。该公司希望确保输出完全可追溯：支持数据源注册、通过元数据标记将内容归因到原始来源，并在整个管道中维护数据访问和使用的审计日志。哪项方案可满足需求？","o":[{"l":"A","t":"使用 AWS Lake Formation 编目数据源并控制访问，直接在 S3 中应用元数据标签，使用 CloudTrail 监控 API 活动"},{"l":"B","t":"使用 Glue Data Catalog 注册和标记数据源，使用 CloudWatch Logs 监控访问模式和应用行为"},{"l":"C","t":"将数据存储在 S3 中并使用对象标签归因，使用 Glue Data Catalog 管理模式信息，使用 CloudTrail 记录 S3 访问"},{"l":"D","t":"使用 Glue Data Catalog 注册所有数据源，应用元数据标签归因数据来源，使用 CloudTrail 记录跨服务的访问和活动"}],"a":["D"],"e":"**✅ 为什么 D.Glue Data Catalog+元数据标签+CloudTrail 对**：Glue Data Catalog 是集中注册数据集和管理元数据的 AWS 原生服务，支持结构化注册和一致标记，可将生成内容归因到原始来源。CloudTrail 提供跨 AWS 服务 API 活动的不可变审计日志，捕获谁在何时通过哪个服务访问了哪些数据，满足端到端审计要求。两者组合实现了数据源注册、元数据归因和跨服务审计的完整覆盖。\n\n**❌ 为什么其他选项错**：\n- A.Lake Formation：主要用于细粒度数据湖权限，并非实现可追溯性所必需\n- B.CloudWatch Logs：不提供跨服务的权威审计日志记录能力\n- C.S3 对象标签+CloudTrail：审计范围仅限 S3 访问，未全面注册所有数据源\n\n**📌 关键概念**：Glue Data Catalog 提供数据源编目与元数据管理，CloudTrail 提供跨服务不可变审计日志，组合实现 GenAI 数据管道的可追溯治理。","s":"第三方#33"},{"id":"D1-040","d":1,"t":"single","q":"某医疗企业正在构建 GenAI 应用，使用 RAG 提供基于证据的医疗信息。该应用使用 Amazon OpenSearch Service 检索向量嵌入。用户反映搜索经常错过含有精准医学名词及缩略语的结果，同时返回过多语义相似但不相关的文档。公司需在文档增长到百万级时仍保持较低延迟和最少运营开销。哪项方案可满足需求？","o":[{"l":"A","t":"配置混合搜索，结合向量相似性与关键词匹配，改进语义理解及精确术语和缩写的匹配"},{"l":"B","t":"将向量嵌入维度从 384 增加到 1536，使用后处理 Lambda 函数在检索后过滤不相关结果"},{"l":"C","t":"用 Amazon Kendra 替换 OpenSearch Service，使用查询扩展在预处理阶段处理医学术语和缩写变体"},{"l":"D","t":"实施两阶段检索架构，初始向量搜索结果由 SageMaker 上托管的 ML 模型重新排序"}],"a":["A"],"e":"**✅ 为什么 A.OpenSearch 混合搜索 对**：在医疗领域，精确术语、缩写和首字母缩略词至关重要。纯向量搜索常低估精确匹配，导致遗漏结果。OpenSearch 原生支持混合搜索，结合 BM25 关键词检索与向量相似性搜索，确保精确术语匹配的同时捕捉语义含义。混合搜索在同一索引和查询路径内运行，即使大规模也保持低延迟，无需额外基础设施。\n\n**❌ 为什么其他选项错**：\n- B.增加维度+后处理 Lambda：增加计算成本和延迟，未解决精确术语召回问题\n- C.迁移到 Kendra：引入新服务和摄取管道，增加运营开销和延迟\n- D.两阶段+SageMaker 重排序：增加模型托管和编排复杂性，OpenSearch 已提供原生混合检索\n\n**📌 关键概念**：OpenSearch 混合搜索在同一引擎内融合关键词精确匹配与向量语义检索，适合医疗 RAG 中对术语精度和语义理解的双重需求。","s":"第三方#34"},{"id":"D1-041","d":1,"t":"single","q":"某电商企业正在开发使用 Amazon Bedrock 和 Anthropic Claude 向客户推荐产品的 GenAI 应用。客户反映部分推荐产品不可售或不相关，且某些推荐生成耗时过长。公司调查发现大多数客户交互是唯一的，且模型推荐了不在产品目录中的商品。该公司须解决这些问题。哪项方案可满足需求？","o":[{"l":"A","t":"在 Bedrock Guardrails 中增加接地性并启用自动推理检查，设置预置吞吐量"},{"l":"B","t":"使用提示工程限制模型对相关产品的响应，使用流式推理降低感知延迟"},{"l":"C","t":"创建 Amazon Bedrock Knowledge Bases 并实施 RAG，将 PerformanceConfigLatency 参数设置为优化"},{"l":"D","t":"将产品目录数据存储在 OpenSearch Service 中，验证模型推荐与目录匹配性，使用 DynamoDB 实现响应缓存"}],"a":["C"],"e":"**✅ 为什么 C.Bedrock Knowledge Bases+RAG+PerformanceConfigLatency 对**：防止推荐虚构产品的最直接方法是基于权威产品目录进行接地生成。Knowledge Bases 摄取目录数据后仅检索实际存在的条目，确保模型输出基于检索到的事实而非参数化记忆。PerformanceConfigLatency 设为优化可优先低延迟推理路径。由于大多数交互唯一，缓存策略效果有限，改进检索和推理路径更为有效。\n\n**❌ 为什么其他选项错**：\n- A.增加接地性+预置吞吐量：提高安全性和延迟可预测性，但无法确保推荐限于有效产品\n- B.提示工程+流式：提示约束不足以可靠防止幻觉，流式仅改善感知延迟\n- D.OpenSearch+缓存：增加验证和缓存层但增加复杂性，缓存对唯一交互无效\n\n**📌 关键概念**：Bedrock Knowledge Bases 通过 RAG 将模型输出约束在权威数据源范围内，PerformanceConfigLatency 参数可优化推理延迟，适合产品推荐场景。","s":"第三方#35"},{"id":"D1-042","d":1,"t":"single","q":"某大学将档案文件、学术期刊和手稿数字化后存储在 AWS Lake Formation 数据湖中。该校需构建解决方案让用户通过文本查询搜索数字化藏品，返回语义相似的期刊摘要，并可基于与摘要关联的文本和元数据进行搜索。数字化文件元数据不含关键词。方案须基于文本相似性将相似摘要相互匹配。数据湖包含少于 100 万个文件。哪项方案以最少运营开销满足需求？","o":[{"l":"A","t":"使用 Bedrock 中 Titan Embeddings 创建向量表示，将嵌入存储在 OpenSearch Service 的 Neural 插件中"},{"l":"B","t":"使用 Comprehend 从文件中提取主题，将主题和元数据存储在 Aurora PostgreSQL 中并查询摘要元数据"},{"l":"C","t":"使用 SageMaker AI 部署句子转换模型创建向量表示，将嵌入存储在带 pgvector 的 Aurora PostgreSQL 中"},{"l":"D","t":"使用 Bedrock 中 Titan Embeddings 创建向量表示，将嵌入存储在带 pgvector 的 Aurora PostgreSQL Serverless 中"}],"a":["D"],"e":"**✅ 为什么 D.Titan Embeddings+Aurora PostgreSQL Serverless pgvector 对**：需求是纯语义搜索（元数据无关键词），适合基于嵌入的方法。Titan Embeddings 提供托管向量生成，无需维护 ML 模型。Aurora PostgreSQL Serverless 配合 pgvector 支持向量存储和相似性搜索，自动扩缩减少了容量规划工作。文件少于 100 万，PostgreSQL 向量存储操作上比专用搜索集群更简单。\n\n**❌ 为什么其他选项错**：\n- A.OpenSearch Neural 插件：运营 OpenSearch 域需考虑域大小调整、分片策略和集群调优\n- B.Comprehend 主题提取：主题提取不等同于基于嵌入的语义匹配，无法处理无关键词元数据\n- C.SageMaker AI 句子转换：需部署和管理端点，包括扩缩和模型生命周期管理，运维开销最大\n\n**📌 关键概念**：Titan Embeddings 提供托管嵌入生成，Aurora PostgreSQL Serverless 配合 pgvector 实现自动扩缩的向量存储与相似性搜索，适合中小规模语义检索。","s":"第三方#40"},{"id":"D1-043","d":1,"t":"single","q":"某金融企业需对非结构化数据（客户通话记录、财务报告和文档）进行预处理，数据存储在 Amazon S3 中以支持 Amazon Bedrock 应用。公司须验证数据质量、创建可审计元数据、跟踪数据质量指标，并制定专属文本切分策略以提升模型表现。哪项方案在开发工作量最小的情况下满足需求？","o":[{"l":"A","t":"使用 SageMaker Data Wrangler 创建数据流，配置 CloudWatch 指标和告警监控数据质量，使用自定义 Lambda 预处理数据"},{"l":"B","t":"设置 Glue 爬网程序对数据源编目，创建 Glue ETL 作业运行自定义转换脚本，使用 Glue Data Quality 验证和监控数据质量"},{"l":"C","t":"使用 Comprehend 提取实体，创建 Lambda 函数对文本分块，运行 Athena 查询验证数据质量"},{"l":"D","t":"创建 Step Functions 工作流编排预处理任务，在 EC2 实例上运行自定义代码，使用 SageMaker Model Monitor 监控数据质量"}],"a":["B"],"e":"**✅ 为什么 B.Glue 爬网程序+ETL+Data Quality 对**：Glue 专为大规模数据准备设计，与 S3 无缝集成。爬网程序自动推断模式并填充 Glue Data Catalog，创建可审计的可查询元数据。ETL 作业允许实施自定义转换逻辑包括文本规范化和分块策略。Glue Data Quality 提供内置规则集验证完整性、准确性和一致性，并发布可监控的质量指标。全托管服务消除了基础设施管理需求。\n\n**❌ 为什么其他选项错**：\n- A.SageMaker Data Wrangler+Lambda：需自定义 Lambda 管道，开发和运维工作量较大\n- C.Comprehend+Lambda+Athena：组合零散，缺乏统一的数据质量验证和元数据编目能力\n- D.Step Functions+EC2：EC2 自定义代码需管理基础设施，与最小开发量目标矛盾\n\n**📌 关键概念**：AWS Glue 提供爬网程序（自动编目）、ETL 作业（自定义转换）和 Data Quality（内置验证）的全栈数据预处理能力，适合 GenAI 数据准备。","s":"第三方#44"},{"id":"D1-044","d":1,"t":"single","q":"某制药企业正在开发基于 Amazon Bedrock Knowledge Bases 的 RAG 应用，数据源为 Amazon OpenSearch Service，存储超过 2500 万篇科学论文。用户反映当检索请求涉及论文中方法、结果与讨论多个章节时，应用产生不一致的答案并引用不相关段落。公司需在全语料库层面维持关联段落间的语义连贯。哪项方案可满足需求？","o":[{"l":"A","t":"配置知识库使用固定大小分块，最大块 300 个令牌，块间重叠 10%，使用适当嵌入模型"},{"l":"B","t":"配置知识库使用分层分块，父块 1000 个令牌、子块 200 个令牌，块间 50 个令牌重叠"},{"l":"C","t":"配置知识库使用语义分块，缓冲区大小 1、断点百分位阈值 85%，根据内容含义确定块边界"},{"l":"D","t":"配置知识库不使用分块，摄取前手动将每篇文档分割为独立文件，检索时应用后处理重排序"}],"a":["B"],"e":"**✅ 为什么 B.分层分块（父块1000+子块200） 对**：分层分块专为保留更广泛语义上下文同时支持段落级精确检索而设计。子块（200 令牌）用于高精度向量匹配，关联的父块（1000 令牌）保留周围章节上下文。当检索器识别相关子块时可引入父级上下文，使模型看到方法、结果和讨论之间的关联框架。重叠降低了关键声明被分割到不同块的风险。\n\n**❌ 为什么其他选项错**：\n- A.固定大小分块：可能将逻辑关联的段落分割到不同块，缺乏父级上下文关联机制\n- C.语义分块：改善边界放置但不提供分层分块的父级上下文检索能力\n- D.不分块+手动分割：运营负担大，在 2500 万篇论文规模下不实用\n\n**📌 关键概念**：分层分块通过父子块结构在精确检索与上下文保留之间取得平衡，适合跨章节查询的科学论文 RAG 场景。","s":"第三方#47"},{"id":"D1-045","d":1,"t":"single","q":"某公司在应用程序账户中运行 GenAI 摘要应用，架构包括 API Gateway REST API 将请求转发到私有 VPC 子网中的 Lambda 函数。该应用摘要存储在集中式数据存储账户受管数据湖中的敏感客户记录。数据存储账户已启用 S3、Athena 和 Glue。公司须确保对 Bedrock 的调用仅使用私有连接，且数据湖须提供跨账户的细粒度列级访问。哪项方案可满足需求？","o":[{"l":"A","t":"在应用账户创建 Bedrock 运行时接口 VPC 端点，在私有子网运行 Lambda，使用 Lake Formation LF 标签创建表级和列级跨账户授权"},{"l":"B","t":"在私有子网运行 Lambda，配置 NAT 网关提供对 Bedrock 和数据湖的访问，使用 S3 存储桶策略和 ACL 管理权限"},{"l":"C","t":"在应用账户仅为 S3 创建网关端点，通过公共端点调用 Bedrock，使用 Lake Formation 数据库级授权管理数据访问"},{"l":"D","t":"在应用账户使用 VPC 端点提供对 Bedrock 和 S3 的访问，仅使用 IAM 基于路径的策略管理数据湖访问"}],"a":["B"],"e":"**✅ 为什么 B.私有子网+NAT 网关+S3 策略 对**：在私有子网运行 Lambda 确保网络隔离，NAT 网关提供对外部服务的出站访问路径。S3 存储桶策略和 ACL 用于管理跨账户的数据访问权限。该方案利用现有 AWS 网络和安全机制实现了应用与数据湖的集成。\n\n**❌ 为什么其他选项错**：\n- A.Bedrock VPC 端点+Lake Formation LF 标签：VPC 端点确保私有连接，LF 标签实现列级跨账户授权，但与源答案不符\n- C.S3 网关端点+公共 Bedrock：公共端点违反私有连接要求，数据库级授权不够细粒度\n- D.VPC 端点+IAM 路径策略：IAM 基于路径的策略无法强制执行列级访问控制\n\n**📌 关键概念**：私有子网配合 NAT 网关提供出站访问，S3 存储桶策略管理跨账户权限。疑点：源解析称选项 A 为正确选项但源答案标注为 B，二者矛盾，照录源答案 B。","s":"第三方#57"},{"id":"D1-046","d":1,"t":"single","q":"某制药公司开发 RAG 应用，使用 Amazon Bedrock Knowledge Bases，以 Amazon OpenSearch Service 作为超过 2500 万篇科学论文的数据源。用户反馈当检索涉及论文中方法、结果与讨论多个章节的查询时，系统给出不连贯的答案且引用了不相关的论文部分。公司需在整库范围内维护相关段落的语义连贯性。哪项方案可满足需求？","o":[{"l":"A","t":"设置知识库为固定大小分块，最大 300 令牌、10% 重叠率，搭配适配的 Bedrock 嵌入模型"},{"l":"B","t":"设置知识库为分层分块，父块 1000 令牌、子块 200 令牌，块间设置 50 令牌重叠"},{"l":"C","t":"设置知识库为语义分块，缓冲区 1、断点百分位 85%，依内容语义确定分块边界"},{"l":"D","t":"设置知识库不分块，摄取前手动拆分每篇论文为独立文件，检索阶段添加后处理重排序"}],"a":["B"],"e":"**✅ 为什么 B.分层分块（父块1000+子块200+重叠50） 对**：科学论文中关键信息常分布在方法、结果和讨论多个章节。分层分块创建小粒度子块用于精准向量匹配，同时关联更大粒度的父块保留章节级上下文。检索到相关子块时自动引入父级上下文，使模型获得跨章节的推理框架。重叠设置进一步防止关键论述被截断到不同块中。\n\n**❌ 为什么其他选项错**：\n- A.固定大小分块：将逻辑关联的论述分割到不同块，缺乏上下文关联机制\n- C.语义分块：改善边界质量但不提供分层分块的父级上下文检索\n- D.不分块+手动拆分：2500 万篇论文规模下手动处理不切实际，运营负担极高\n\n**📌 关键概念**：分层分块通过父子结构在精确匹配与上下文保留间取得平衡，重叠令牌防止跨章节关键信息被截断，适合大规模科学文献 RAG。","s":"第三方#58"},{"id":"D1-047","d":1,"t":"single","q":"某医疗设备制造商计划将使用其产品的手术操作报告导入 AI 助手。为保护患者隐私，助手须对外科医生暴露 PII 但为工程师编辑 PII。助手须仅引用不超过 3 年的医疗报告。新报告发布后立即存入 S3 存储桶。公司已设置 Bedrock Knowledge Bases 并使用 Amazon Cognito 验证用户身份。哪项方案可满足需求？","o":[{"l":"A","t":"在 S3 上启用 Macie PII 检测，用 S3 触发器调用 Lambda 从报告中编辑 PII，配置 Lambda 删除过期文档并同步知识库"},{"l":"B","t":"新报告上传时调用 Lambda 同步 S3 和知识库，使用第二个 Lambda 配合 Comprehend 为工程师编辑 PII，用 S3 生命周期规则删除超 3 年报告"},{"l":"C","t":"设置 S3 生命周期配置删除超 3 年报告，安排 Lambda 每日同步存储桶与知识库，根据 Cognito 用户组选择应用的护栏配置以按需编辑 PII"},{"l":"D","t":"创建第二个知识库，使用 Lambda 和 Comprehend 在同步前编辑 PII，根据 Cognito 组成员身份将用户路由到相应知识库"}],"a":["C"],"e":"**✅ 为什么 C.S3 生命周期+Lambda 同步+Cognito 组护栏 对**：在推理时而非摄取时执行隐私控制，使不同角色对同一底层数据具有不同可视性。S3 生命周期配置自动删除超 3 年文档保证合规。Lambda 每日同步使知识库与存储桶内容一致。Bedrock Guardrails 支持推理时动态应用——根据 Cognito 用户组选择护栏配置，外科医生获得完整响应，工程师获得 PII 被屏蔽的响应，无需冗余复制底层数据或搭建并行的知识库实例。\n\n**❌ 为什么其他选项错**：\n- A.Macie 永久删除 PII：违反外科医生需访问 PII 的要求\n- B.摄取时编辑 PII：数据编辑与摄取耦合，不一致地为所有用户编辑\n- D.创建第二个知识库：增加存储成本和数据漂移风险，维护两份数据副本\n\n**📌 关键概念**：Bedrock Guardrails 支持基于用户身份的动态 PII 控制，配合 S3 生命周期实现合规过期管理，在推理时按角色差异化暴露信息。","s":"第三方#61"},{"id":"D1-048","d":1,"t":"single","q":"某软件公司使用 Amazon Q Business 构建 AI 助手，让员工通过自然语言访问公司信息和个人信息。信息存储在 S3 存储桶中，每个部门有专用前缀，每个对象名称包含所属部门的 S3 前缀。每个部门对应 IAM Identity Center 中的一个组，每位员工属于一个部门。公司已配置 Q Business 访问 S3 数据源，需确保助手遵循用户所属用户组的权限边界。哪项方案运营开销最小？","o":[{"l":"A","t":"在每个部门文件夹创建 acl.json 文件，指定有权访问该部门数据的 Identity Center 组，在数据源设置中指明 JSON 文件位置"},{"l":"B","t":"在 S3 存储桶根目录创建单个 acl.json 文件，将每个部门 S3 前缀映射到对应 Identity Center 组，在数据源设置中指明文件位置"},{"l":"C","t":"为每个 Identity Center 组创建单独权限集，拒绝访问所有前缀并添加 StringNotEquals 条件键指定关联部门"},{"l":"D","t":"在存储桶根目录创建 metadata.json 元数据文件，添加 AccessControlList 对象指定部门前缀路径和对应组，在数据源元数据设置中引用"}],"a":["B"],"e":"**✅ 为什么 B.根目录单个 acl.json 对**：Amazon Q Business 原生支持使用单一集中式 JSON 文件为 S3 数据源提供 ACL，将 S3 前缀映射到 IAM Identity Center 组。在根目录使用单个文件集中管理访问控制逻辑，管理员可更新部门映射而无需触及各文件夹或更改 IAM 权限，降低配置漂移风险。Q Business 在查询时自动评估用户组成员资格并过滤可访问文档。\n\n**❌ 为什么其他选项错**：\n- A.每部门单独 acl.json：需在各文件夹维护独立文件，部门变化时难以管理\n- C.IAM 权限集+条件键：Q Business 的 S3 数据源访问控制非通过 IAM 条件逻辑管理\n- D.metadata.json+AccessControlList：自定义元数据结构非 Q Business 访问执行的支持机制\n\n**📌 关键概念**：Amazon Q Business 支持通过 S3 根目录单个 acl.json 文件将前缀映射到 Identity Center 组，实现基于部门的访问控制，运维开销最低。","s":"第三方#65"},{"id":"D1-049","d":1,"t":"multiple","q":"某金融企业开发 AI 搜索助手，帮助投资顾问快速检索投资数据。应用以 Lambda 函数运行，使用 Amazon Bedrock 知识库（以 OpenSearch Serverless 为数据源）。智能体需借助按模式匹配自动分配集合及索引访问权限来管理大规模集合。知识库同步成功，但测试显示 BedrockAgentRuntime API 返回 400 Bad Authorization 错误，访问 OpenSearch Serverless 时出现 403 Forbidden。公司须解决权限问题。哪组方案组合可满足需求？（选择两项）","o":[{"l":"A","t":"更新 Lambda 执行角色包含 bedrock:InvokeAgent 权限，向角色添加 aoss:APIAccessAll 权限"},{"l":"B","t":"创建包含基于模式的资源规则的 OpenSearch Serverless 数据访问策略"},{"l":"C","t":"为 OpenSearch Serverless 配置 VPC 端点策略，将端点添加到 Lambda 的 VPC 配置中"},{"l":"D","t":"配置 Secrets Manager 存储 OpenSearch Serverless 凭证，授予 Lambda 检索凭证的访问权限"},{"l":"E","t":"为 OpenSearch Serverless 域启用 IAM 身份验证，向 Lambda 角色添加 es:ESHttp* 权限"}],"a":["A","B"],"e":"**✅ 为什么 A、B 对**：\n- A.更新 Lambda 角色权限：400 Bad Authorization 表明 Lambda 执行角色缺少调用智能体的身份权限，添加 bedrock:InvokeAgent 和 aoss:APIAccessAll 是必需的\n- B.创建基于模式的数据访问策略：403 Forbidden 与 OpenSearch Serverless 数据平面权限相关，Serverless 使用数据访问策略而非传统 IAM，基于模式的规则确保新集合和索引自动获得访问权限\n\n**❌ 为什么其他选项错**：\n- C.VPC 端点策略：解决网络连接问题而非数据访问授权问题\n- D.Secrets Manager 凭证：OpenSearch Serverless 使用 IAM 授权而非凭证认证\n- E.es:ESHttp* 权限：该权限适用于传统 OpenSearch 而非 Serverless 的数据访问策略模型\n\n**📌 关键概念**：OpenSearch Serverless 使用数据访问策略（非传统 IAM）管理数据平面权限，基于模式的资源规则支持大规模集合的自动权限分配。","s":"第三方#66"},{"id":"D1-050","d":1,"t":"single","q":"某研究公司正在开发 GenAI 系统用于生成技术文档摘要。公司须在中心位置对所有数据源编目，需自动发现和更新数据源。方案须用引用元数据标记每个生成的摘要以供查询，须为每一笔模型请求留存不可篡改的审计凭证并保存 I/O 记录。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Comprehend 识别数据源，将摘要存储在 S3 中并启用 S3 Object Lock，使用 CloudWatch 指标生成报告但不包含每次调用日志"},{"l":"B","t":"使用带爬网程序的 Glue Data Catalog 维护数据源，将摘要存储在 S3 中并写入源 ID 对象标签，将 Bedrock 调用日志存储在启用 S3 Object Lock 的 S3 中，使用 CloudTrail 日志完整性验证提供不可变性"},{"l":"C","t":"将输出存储在 DynamoDB 中并添加来源归因标签，将事件写入 CloudWatch Logs，使用 IAM 角色提供审计可追溯性"},{"l":"D","t":"使用 AppConfig 功能标志实施数据版本控制，使用 IAM 条件键限制模型访问，在 S3 中维护版本化映射文件"}],"a":["B"],"e":"**✅ 为什么 B.Glue Data Catalog+S3 Object Lock+CloudTrail 对**：Glue Data Catalog 及爬网程序是自动发现和集中编目数据集的标准 AWS 工具。摘要存储在 S3 中可用对象标签作为元数据（如源 ID）供查询。防篡改不可变审计日志通过将 Bedrock 调用日志存储到受 S3 Object Lock（合规模式）保护的 S3 存储桶实现，CloudTrail 日志完整性验证使用加密哈希提供不可否认性。\n\n**❌ 为什么其他选项错**：\n- A.Comprehend+CloudWatch：不包含每次调用的审计日志，CloudWatch 指标无法满足防篡改要求\n- C.DynamoDB+CloudWatch Logs：CloudWatch Logs 不提供防篡改不可变性保证\n- D.AppConfig+IAM 条件键：功能标志和条件键非用于数据编目和审计日志管理\n\n**📌 关键概念**：Glue Data Catalog 爬网程序实现数据源自动编目，S3 Object Lock 配合 CloudTrail 完整性验证提供防篡改的模型调用审计日志。","s":"第三方#67"},{"id":"D1-051","d":1,"t":"single","q":"某公司提供全球餐厅发现服务，拥有 5000 万月活用户。公司希望在收录两千万店铺档案及两亿用户点评的数据集上完成语义检索。数据当前存储在 PostgreSQL 中。方案须支持复杂自然语言查询，在 500 毫秒内为至少 95% 的查询返回结果，保持每小时更新的数据新鲜度，并在高峰期经济高效地扩展。哪项方案开发工作量最小？","o":[{"l":"A","t":"将数据迁移到 OpenSearch Service，实施基于关键字的自定义分析器和相关性调优，创建 API Gateway 将查询转换为结构化搜索参数"},{"l":"B","t":"将数据迁移到 OpenSearch Service，使用 Bedrock FM 从餐厅描述和评价生成向量嵌入，用 k-NN 搜索查找语义相似结果"},{"l":"C","t":"将数据保留在 PostgreSQL 中并实施 pgvector，使用 Bedrock FM 生成嵌入并直接存储在 PostgreSQL 中，用 Lambda 执行相似性搜索"},{"l":"D","t":"将数据通过自定义摄取管道迁移到 Bedrock Knowledge Bases，配置自动嵌入生成，使用 Retrieve API 的内置向量搜索直接以自然语言查询"}],"a":["D"],"e":"**✅ 为什么 D.Bedrock Knowledge Bases+Retrieve API 对**：Knowledge Bases 一站式封装了向量化、索引构建及自然语言查询等开发中最繁杂的环节——无需构建独立服务。Retrieve API 接受自然语言输入并自动执行向量搜索，开发工作量最小。每小时新鲜度可通过计划重新摄取更新数据实现。高峰扩展由托管检索层承担，将检索工作负载与运营数据库分离，避免为峰值流量过度配置 PostgreSQL。\n\n**❌ 为什么其他选项错**：\n- A.关键字搜索：不提供语义搜索能力，仅依赖关键字匹配\n- B.OpenSearch+FM 嵌入：可行但需构建和维护嵌入管道、查询嵌入生成和向量索引管理\n- C.PostgreSQL+pgvector：在此规模下事务数据库内运行相似性搜索难以满足 95% 查询 500ms 的延迟目标\n\n**📌 关键概念**：Bedrock Knowledge Bases 提供托管的端到端 RAG 检索能力，自动处理嵌入生成和向量搜索，适合大规模语义搜索场景的低开发量需求。疑点：源 id 43 同题答案为 B，本题为 D，答案不一致，照录源答案 D。","s":"第三方#68"},{"id":"D1-052","d":1,"t":"single","q":"某公司正在使用 Amazon Bedrock 构建 AI 咨询应用，向客户提供决策建议。应用须解释其推理过程并引用具体数据来源，从公司数据源检索信息并展示逐步推理。应用还须将数据声明链接到源文档，并将响应延迟控制在 3 秒以内。哪项方案运营开销最小？","o":[{"l":"A","t":"使用启用来源归因的 Bedrock Knowledge Bases，配合 RAG 和 Claude Messages API 为源文档设置高相关性阈值，将推理和引用存储在 S3 中用于审计"},{"l":"B","t":"使用 Bedrock 配合 Claude 模型和扩展思考，配置 4000 令牌思考预算，将推理轨迹和引用存储在 DynamoDB 中"},{"l":"C","t":"配置 SageMaker AI 配合自定义 Claude 模型，使用推理参数和 Lambda 处理响应，从 RDS 添加源引用"},{"l":"D","t":"使用 Bedrock 配合 Claude 模型和思维链推理，通过 Knowledge Bases API 配置自定义检索跟踪，用 CloudWatch 监控延迟"}],"a":["A"],"e":"**✅ 为什么 A.Bedrock Knowledge Bases 来源归因+RAG 对**：Knowledge Bases 是托管 RAG 能力，自动完成文档摄取、切分、向量化、检索与上下文拼接。启用来源归因后，RAG 管道返回用于生成的底层文档和段落引用，使可追踪引用呈现给用户并用于审计。设置相关性阈值减少噪声检索以兼顾准确率与延迟。将推理过程及引用存入 S3 以满足审计留存，运营负担最小。\n\n**❌ 为什么其他选项错**：\n- B.扩展思考：增加延迟且不确保来源链接，思考预算消耗额外 Token\n- C.SageMaker+自定义模型：自定义模型托管和独立引用系统增加显著运营开销\n- D.思维链+自定义跟踪：需更多自定义跟踪工作，检索归因方面不如 Knowledge Bases 原生方案\n\n**📌 关键概念**：Bedrock Knowledge Bases 原生支持来源归因，RAG 管道可返回引用并链接到源文档段落，实现可审计的基于事实的推理输出。","s":"第三方#73"},{"id":"D1-053","d":1,"t":"single","q":"某医疗企业使用 Amazon Bedrock 构建系统，帮助从业者做出临床决策。系统须严格依据经审批的临床文档为医师给出治疗建议并提供来源出处，严禁出现幻觉或产生与事实不符的内容。哪项方案运营开销最小？","o":[{"l":"A","t":"将 Bedrock 与 Amazon Kendra 集成检索已批准文档，实施自定义后处理将响应与源文档比较并包含引用"},{"l":"B","t":"部署 Bedrock Knowledge Bases 连接到已批准临床源文档，使用 RetrieveAndGenerate API 返回知识库中的引用"},{"l":"C","t":"使用 Bedrock 和 Comprehend Medical 提取医疗实体，针对医学术语数据库实施验证逻辑"},{"l":"D","t":"使用 Knowledge Bases 配合 Retrieve API 和 InvokeModel API，检索临床源文档并实施自定义验证逻辑引用来源"}],"a":["B"],"e":"**✅ 为什么 B.Knowledge Bases+RetrieveAndGenerate API 对**：Knowledge Bases 配合 RetrieveAndGenerate API 提供全托管 RAG 能力，自动管理文档摄取、分块、嵌入、检索和排序。模型输出被限定在已检索的审批临床文档范围内，大幅降低幻觉风险。API 返回显式来源引用，满足合规审查与诊疗透明性需求，无需自行编写比对或校验逻辑。检索和生成紧密集成，避免多步骤编排的延迟和维护负担。\n\n**❌ 为什么其他选项错**：\n- A.Kendra+自定义后处理：引入额外服务和自定义逻辑，增加运营复杂性\n- C.Comprehend Medical+验证逻辑：侧重实体提取而非受控知识基础，不保证引用或幻觉预防\n- D.Retrieve+InvokeModel+自定义验证：需检索和生成间手动编排及自定义验证，增加开发工作量\n\n**📌 关键概念**：Bedrock Knowledge Bases 配合 RetrieveAndGenerate API 实现端到端托管 RAG，自动返回来源引用，以最低运维开销提供基于事实的临床建议。","s":"第三方#74"},{"id":"D1-054","d":1,"t":"single","q":"某酒店集团希望在原有基于 Java 的物业管理系统上添加 AI 能力。公司计划使用 Bedrock Knowledge Bases 为员工提供房间可用性信息和酒店详情。方案须为每家酒店维护独立访问控制，提供近实时房间可用性信息，并在高峰期保持一致性能。哪项方案可满足需求？","o":[{"l":"A","t":"部署包含所有酒店合并数据的单个 Knowledge Bases，配置 Lambda 从各酒店 PMS 数据库同步数据，实施酒店特定过滤器审计访问"},{"l":"B","t":"为每家酒店创建由 PMS 数据库变更触发的 EventBridge 规则，将更新发送到集中式 Knowledge Bases，配置基于资源的策略执行酒店特定访问"},{"l":"C","t":"在多账户结构中为每家酒店实施独立 Knowledge Bases，使用直接数据摄取提供近实时可用性，为非关键信息安排定期同步"},{"l":"D","t":"构建使用多个知识库的集中式 Bedrock Agents 解决方案，实施带酒店特定权限集的 IAM Identity Center 控制员工访问"}],"a":["C"],"e":"**✅ 为什么 C.多账户结构每酒店独立 Knowledge Bases 对**：为每家酒店实施独立知识库确保数据和权限的严格分离，自然强制执行酒店级访问控制，免除了繁复的策略逻辑与查询后过滤。多账户架构进一步强化安全治理，AWS 推荐具有强合规边界的工作负载使用账户级隔离。直接数据摄取使关键数据（如房间可用性）近实时更新，非关键信息定期同步降低摄取成本。每个知识库独立扩展，避免集中式设计的噪声邻居问题。\n\n**❌ 为什么其他选项错**：\n- A.集中式知识库+过滤器：策略复杂性和访问控制配置错误风险高\n- B.EventBridge+集中式知识库：集中式设计增加策略管理复杂性\n- D.集中式 Agents+权限集：编排复杂性增加，且不解决实时数据新鲜度要求\n\n**📌 关键概念**：多账户结构中每酒店独立 Knowledge Bases 实现数据隔离与访问控制的天然分离，混合摄取模式（实时+定期）平衡新鲜度与运营效率。","s":"第三方#75"},{"id":"D1-055","d":1,"t":"multiple","q":"某公司使用 Amazon Bedrock 设计资助申请助手，基于 Amazon Nova Pro 基础模型。应用包含四个必填输入，须以一致文本格式提供响应。公司希望在响应包含霸凌语言时收到通知但不阻止所有被标记响应。公司已创建 Bedrock Flow 接收输入提示并发送到 Nova Pro。还需哪些额外步骤？（选择两项）","o":[{"l":"A","t":"使用 Bedrock Prompt Management 将必填输入指定为变量，选择 Nova Pro FM，指定响应输出格式，将提示添加到流的提示节点"},{"l":"B","t":"创建应用仇恨内容过滤器的 Bedrock Guardrails，将过滤器响应设为阻止，添加到流的提示节点"},{"l":"C","t":"创建 Bedrock 提示路由器，指定 Nova Pro FM，将必填输入作为变量添加到输入节点"},{"l":"D","t":"创建应用侮辱内容过滤器的 Bedrock Guardrails，将过滤器响应设为检测，添加到流的提示节点"},{"l":"E","t":"创建指定 Nova Pro FM 的 Bedrock 应用推理配置文件，在描述中指定输出格式"}],"a":["A","D"],"e":"**✅ 为什么 A、D 对**：\n- A.Prompt Management 变量+输出格式：将四个必填输入定义为变量确保每次调用获得正确结构化输入，指定输出格式确保一致响应，将托管提示添加到流的提示节点实现标准化配置\n- D.侮辱内容过滤器+检测模式：将过滤器响应设为检测使系统标记包含霸凌语言的响应同时仍允许返回，满足「收到通知但不阻止」的要求\n\n**❌ 为什么其他选项错**：\n- B.仇恨过滤器+阻止模式：阻止模式违反「不阻止所有被标记响应」的要求\n- C.提示路由器：应用仅使用单个 Nova Pro FM，路由器不必要\n- E.推理配置文件：错误地以推理配置文件来约束输入变量与输出格式，无法实现提示级变量管控\n\n**📌 关键概念**：Bedrock Prompt Management 支持变量化提示模板和输出格式定义，Guardrails 检测模式可在不阻止响应的情况下标记不当内容，实现非阻断式安全监控。","s":"第三方#77"},{"id":"D1-056","d":1,"t":"single","q":"某图书出版公司希望构建 AI 助手图书推荐系统，根据与客户的对话从图书目录中推荐图书。公司将图书文本、读者和编辑评论及提取的元数据存储在 S3 中。系统须支持低延迟响应，并能高效扩展以处理超过 10000 个并发用户。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Bedrock Knowledge Bases 生成嵌入，将向量存储在 OpenSearch Service 中，创建 Lambda 查询知识库，配置 API Gateway 调用 Lambda 处理请求"},{"l":"B","t":"使用 Bedrock Knowledge Bases 生成嵌入，将向量存储在 DynamoDB 中，创建 Lambda 查询知识库，配置 API Gateway 调用 Lambda"},{"l":"C","t":"使用 SageMaker AI 部署预训练模型构建推荐引擎，部署为端点并通过 API Gateway 调用"},{"l":"D","t":"创建 Amazon Kendra GenAI Enterprise Edition 索引，使用 S3 连接器索引目录数据，配置内置 FAQ，开发 Lambda 查询 Kenda 索引"}],"a":["A"],"e":"**✅ 为什么 A.Knowledge Bases+OpenSearch+API Gateway+Lambda 对**：Bedrock Knowledge Bases 摄取 S3 中的图书数据生成嵌入，OpenSearch Service 提供可扩展的向量搜索和 k-NN 相似性检索，支持基于对话意图的语义匹配。API Gateway 配合 Lambda 实现随需求水平扩展的入口层，将计算扩展与向量存储扩展分离，在负载下保持延迟可预测。这符合 AWS 对高并发 GenAI 应用的推荐架构模式。\n\n**❌ 为什么其他选项错**：\n- B.DynamoDB 向量存储：非 Knowledge Bases 的标准原生向量存储目标，引入额外实现复杂性\n- C.SageMaker AI 端点：需大量机器学习生命周期管理工作，运维开销高\n- D.Kendra 索引：虽然可行但面向企业搜索而非对话式推荐，开发模式不同\n\n**📌 关键概念**：Knowledge Bases 配合 OpenSearch Service 提供托管向量索引与 k-NN 搜索，API Gateway+Lambda 实现可水平扩展的请求入口，适合高并发对话式推荐场景。","s":"第三方#82"},{"id":"D1-057","d":1,"t":"single","q":"某金融企业开发 RAG 应用，帮助投资分析师查询跨多类投资工具、市场板块及监管领域的复杂金融关联。数据集涵盖高度互联实体与多跳关系，分析师须全面审视关系以提供准确投资指导。应用须捕捉金融实体间的间接关系，响应时间小于 3 秒。哪项方案运维开销最小？","o":[{"l":"A","t":"使用带 GraphRAG 的 Bedrock Knowledge Bases 和 Neptune Analytics 存储金融数据，分析多跳关系并自动识别跨文档相关信息"},{"l":"B","t":"使用 Bedrock Knowledge Bases 和 OpenSearch Service 向量存储，实现自定义关系识别逻辑用 Lambda 按序查询多个向量嵌入"},{"l":"C","t":"使用 OpenSearch Serverless 向量搜索和 k-NN，在 EC2 Auto Scaling 应用层实现手动关系映射"},{"l":"D","t":"使用 DynamoDB 在自定义索引系统中存储金融数据，用 Lambda 查询记录并用 SageMaker 生成响应"}],"a":["A"],"e":"**✅ 为什么 A.GraphRAG+Neptune Analytics 对**：传统向量相似性搜索擅长查找语义相似文本但不适合对显式实体间关系进行推理。基于图的检索专为关系遍历设计，GraphRAG 结合 RAG 和图感知上下文选择，通过在图中表示实体及关系可遍历多跳汇集完整相关事实。Neptune Analytics 提供托管图分析环境高效遍历复杂关系网络。与 Knowledge Bases 集成减少自定义工程，图优化引擎可高效执行多跳遍历满足亚 3 秒要求。\n\n**❌ 为什么其他选项错**：\n- B.OpenSearch+自定义关系逻辑：需大量自定义逻辑和编排，增加复杂性和延迟\n- C.OpenSearch Serverless+EC2 手动映射：EC2 手动关系映射增加运维开销和延迟\n- D.DynamoDB+自定义索引：非为图式多跳探索设计，需大量自定义索引和检索逻辑\n\n**📌 关键概念**：GraphRAG 配合 Neptune Analytics 通过图遍历实现多跳关系推理，Knowledge Bases 提供托管摄取和编排，适合高度互联金融实体的复杂关系查询。","s":"第三方#84"},{"id":"D1-058","d":1,"t":"single","q":"某金融企业开发客户服务 AI 助手，使用 Amazon Bedrock 基础模型。应用须提供透明响应，记录推理过程并引用 RAG 所用来源，为所有用户响应捕获全面审计跟踪。应用须服务于多达 10000 个并发用户并在 2 秒内响应每个查询。哪项方案运维开销最小？","o":[{"l":"A","t":"为 Bedrock Agents 启用跟踪，将 Knowledge Bases 与数据源集成启用 RAG 并引用权威内容，以多可用区部署，使用 API Gateway 和 Lambda 扩展应用，用 CloudFront 提供低延迟交付"},{"l":"B","t":"为 Agents 启用跟踪，集成自定义 RAG 管道与 OpenSearch Service 检索引用来源，部署在 API Gateway 后，用 Lambda 和 CloudFront 扩展，日志存储在 S3 中用 CloudTrail 审计"},{"l":"C","t":"使用 CloudWatch 监控延迟和错误率，在后端直接嵌入提示以引用来源，将交互存储在 RDS 中供审计"},{"l":"D","t":"将响应和证据存储在 S3 中启用版本控制供审计，用 Glue 编目检索文档，用 Athena 生成定期合规报告"}],"a":["A"],"e":"**✅ 为什么 A.Bedrock Agents 跟踪+Knowledge Bases+API Gateway+Lambda+CloudFront 对**：Knowledge Bases 提供全托管 RAG 实现并自动处理来源归属，使应用无需构建自定义管道即可引用权威内容。为 Agents 启用跟踪提供推理步骤和模型交互的端到端可见性，满足审计跟踪要求。API Gateway 和 Lambda 自动扩展到数千并发用户，CloudFront 通过缓存和加速内容交付减少延迟帮助满足 2 秒要求。全部使用原生 Bedrock 功能，运维开销最小。\n\n**❌ 为什么其他选项错**：\n- B.自定义 RAG+OpenSearch：自定义 RAG 管道增加运维复杂性和维护工作量\n- C.CloudWatch+RDS：缺乏原生 RAG 集成，不提供透明推理或引用管理\n- D.S3 版本控制+Glue+Athena：侧重离线合规报告而非实时透明性和低延迟响应\n\n**📌 关键概念**：Bedrock Agents 跟踪提供推理过程审计，Knowledge Bases 原生 RAG 支持来源引用，API Gateway+Lambda+CloudFront 组合实现高并发低延迟的可扩展架构。","s":"第三方#86"},{"id":"D1-059","d":1,"t":"single","q":"某公司需构建系统从多类素材源自动产出学习资料。素材涵盖文档文件（PDF、PPT、Word）及多媒体文件（录制视频）。系统须每天处理超过 10000 个内容源，峰值 500 个并发上传，须从各类文件中抽取核心知识点并产出贴合语境的精要概括。产出的学习资料须支持实时协作和版本控制。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Bedrock Data Automation 和 Lambda 编排文档处理，用 Knowledge Bases 处理多媒体，存储在 DocumentDB 中通过 SNS 订阅协作"},{"l":"B","t":"使用 Bedrock Data Automation 配合 FM 处理文档，集成 Textract 提取 PDF 和 Transcribe 处理多媒体，将内容存储在启用版本控制的 S3 中，元数据存 DynamoDB，通过 AppSync 订阅实现实时协作"},{"l":"C","t":"使用 Bedrock Data Automation 配合 SageMaker AI 端点托管提取和摘要模型，用 Guardrails 从文件中提取内容，存储在 Neptune 中"},{"l":"D","t":"使用 Bedrock Data Automation 配合 Lambda 处理批量文件，在 Bedrock 中微调 FM 分类内容类型，存储在 ElastiCache 中用提示管理版本控制"}],"a":["B"],"e":"**✅ 为什么 B.BDA+Textract+Transcribe+S3 版本控制+AppSync 对**：BDA 专为编排大规模多模态数据处理而设计，配合 FM 实现摘要和概念提取。Textract 从 PDF 准确提取结构化和非结构化文本，Transcribe 将视频转换为文本。启用版本控制的 S3 直接满足版本控制要求，DynamoDB 存储元数据支持高吞吐低延迟访问。AppSync GraphQL 订阅配合 DynamoDB 流实现实时协作编辑，内容变更时向连接客户端推送更新。\n\n**❌ 为什么其他选项错**：\n- A.DocumentDB+SNS：DocumentDB 非为实时协作设计，SNS 不支持持续订阅模式\n- C.SageMaker AI 端点+Neptune：增加模型托管运维负担，Neptune 非用于时间序列分析\n- D.ElastiCache+微调 FM：ElastiCache 为临时缓存而非持久存储，微调 FM 增加不必要复杂性\n\n**📌 关键概念**：Bedrock Data Automation 编排多模态数据处理，配合 Textract 和 Transcribe 处理不同媒体类型，S3 版本控制+AppSync 订阅实现协作与版本管理。","s":"第三方#91"},{"id":"D1-060","d":1,"t":"single","q":"某法律研究公司有基于 Amazon Bedrock 和 OpenSearch Service 的 RAG 应用，存储 1500 万份法律文档的 768 维向量嵌入。当前分块策略将文本分割为固定 500 令牌块，常将上下文关联的法律论证、法院意见或法规引用分割到不同块中。研究人员反映输出遗漏关键上下文或引用过时法律信息，响应时间增加 40%，p95 延迟超 2 秒。存储需求预计一年内从 90GB 增长到 360GB。公司需改进检索相关性和大规模系统性能。哪项方案可满足需求？","o":[{"l":"A","t":"在不改变分块策略的情况下将嵌入维度从 768 增加到 4096"},{"l":"B","t":"用存储在 S3 中的静态预写摘要替换动态检索，使用 CloudFront 提供摘要以减少计算需求"},{"l":"C","t":"更新分块策略使用基于完整法律论证、条款或章节的语义边界而非固定令牌限制，重新生成向量嵌入"},{"l":"D","t":"从 OpenSearch Service 迁移到 DynamoDB，实现基于关键词的索引支持快速查询"}],"a":["C"],"e":"**✅ 为什么 C.基于法律论证语义边界分块 对**：固定令牌分割会割裂法规条文内在的语义连贯，使得检索时上下文残缺、回答品质下滑。改用基于法律论证、条款或章节的语义边界分块可保持上下文完整性，提高检索准确性并减少幻觉。重新生成与新分块对齐的嵌入也提高向量搜索效率，降低无谓的比较开销，有助于数据集增长时控制延迟。该方案直接解决检索相关性和性能可扩展性两个核心问题。\n\n**❌ 为什么其他选项错**：\n- A.增加嵌入维度：增加成本和延迟而未解决核心分块问题\n- B.静态预写摘要：移除动态推理违背法律 RAG 系统的目的\n- D.迁移到 DynamoDB：完全丢弃向量语义搜索，不适合细致的法律研究\n\n**📌 关键概念**：基于文档语义结构（法律论证、条款、章节）的分块策略保持上下文完整性，配合嵌入重新生成可同时提升检索相关性和系统性能。","s":"第三方#98"},{"id":"D1-061","d":1,"t":"single","q":"某公司正在使用 Amazon Bedrock 开发应用，采用具备跨区域推理与预置吞吐能力的基础模型。应用须为欧洲及北美用户提供持续低延迟服务，须符合数据驻留法规，确保欧洲用户数据仅在欧洲区域的 AWS 节点处理。测试中当区域流量达到服务配额时应用出现降级。公司需保持应用弹性并最小化运维复杂性。哪项方案可满足需求？","o":[{"l":"A","t":"在北美和欧洲部署独立 Bedrock 实例，使用自定义路由层按用户位置引导流量，配置 CloudWatch 告警和 SNS 通知"},{"l":"B","t":"使用 Bedrock 跨区域推理配置文件在 InvokeModel API 调用时指定地理代码，配置独立 API Gateway HTTP API 将欧洲和北美用户引导到相应区域端点"},{"l":"C","t":"部署多区域 API Gateway 和 Lambda 实现重试逻辑处理限流，配置 Lambda 在主区域达配额时调用次要区域的 FM"},{"l":"D","t":"在多区域配置 Bedrock 预置吞吐量，在应用代码中实现故障转移逻辑，用 Global Accelerator 按用户位置路由流量"}],"a":["B"],"e":"**✅ 为什么 B.跨区域推理配置文件+地理代码+独立 API Gateway 对**：跨区域推理配置文件允许在区域边界内分布推理请求到多个区域，无需自定义故障转移逻辑。指定地理代码确保欧洲用户数据仅在欧洲区域处理，满足法规要求。流量激增或达配额时 Bedrock 自动路由到同地理区域内健康区域。独立 API Gateway 提供简洁路由层，避免自定义路由复杂性。\n\n**❌ 为什么其他选项错**：\n- A.自定义路由层+手动监控：增加复杂性，不提供自动弹性解决配额降级问题\n- C.Lambda 重试+跨区域回退：自定义重试和回退逻辑增加复杂性，可能违反数据驻留\n- D.应用级故障转移+Global Accelerator：需大量应用级故障转移逻辑，增加运维负担\n\n**📌 关键概念**：Bedrock 跨区域推理配置文件通过地理代码在区域边界内自动分布推理请求，配合独立 API Gateway 实现简洁的地理路由，满足数据驻留和弹性需求。","s":"第三方#107"},{"id":"D2-001","d":2,"t":"single","q":"一个客服系统需要处理订单处理、技术支持和账单查询的 Agent，并实现无缝交接。哪种架构提供最佳用户体验？","o":[{"l":"A","t":"带专业化动作组和上下文管理的单一多功能 Agent"},{"l":"B","t":"带 Amazon Bedrock Agent Squad 和对话路由的专业化 Agent"},{"l":"C","t":"带主管 Agent 和任务特定子 Agent 的层级 Agent 系统"},{"l":"D","t":"带 Agent-per-service 和 API 编排的微服务架构"}],"a":["B"],"e":"Bedrock Agent Squad 使专业化 Agent 能熟练处理各自领域，同时提供 Agent 之间的无缝对话路由和交接。","s":"源#31"},{"id":"D2-002","d":2,"t":"single","q":"你的 Agent 系统需要处理 10,000+ 并发对话，且响应时间小于 1 秒。哪种扩展方法最有效？","o":[{"l":"A","t":"带负载均衡和 Agent 实例池的水平扩展"},{"l":"B","t":"带专用 Agent 容量和连接池的预置吞吐量"},{"l":"C","t":"基于 Lambda 的 Agent 和自动扩展的无服务器架构"},{"l":"D","t":"基于容器的部署，带 Kubernetes 自动扩展和资源优化"}],"a":["B"],"e":"预置吞吐量通过消除冷启动并确保专用容量始终可用，在高并发下保证亚秒级响应。","s":"源#32"},{"id":"D2-003","d":2,"t":"single","q":"一个 Agent 需要访问 15 个不同 API，这些 API 具有不同的认证方法和速率限制。哪种集成模式能处理这种复杂性？","o":[{"l":"A","t":"带 Lambda 函数的动作组，为每个 API 处理认证和速率限制"},{"l":"B","t":"带统一认证和跨所有服务速率限制的 API 网关"},{"l":"C","t":"带连接池和断路器模式的自定义中间件层"},{"l":"D","t":"直接 API 集成，带 Agent 级认证和重试机制"}],"a":["A"],"e":"带 Lambda 函数的动作组为每个 API 提供认证和速率限制的自定义配置，同时保持 Agent 架构干净、可维护。","s":"源#33"},{"id":"D2-004","d":2,"t":"single","q":"当多个 Agent 处理相关任务时，一个多 Agent 系统出现协调失败。哪种协调机制能改善协作？","o":[{"l":"A","t":"带 Agent 状态同步和冲突解决的共享内存系统"},{"l":"B","t":"带事件驱动协调和任务队列的消息传递架构"},{"l":"C","t":"带任务分配和依赖管理的集中式编排器"},{"l":"D","t":"带 Agent 投票和决策同步的分布式共识协议"}],"a":["A"],"e":"带状态同步的共享内存使 Agent 能实时了解彼此的进度并解决冲突。","s":"源#34"},{"id":"D2-005","d":2,"t":"single","q":"你的 Agent 系统需要跨多个会话和渠道维护对话上下文。哪种状态管理方法是最优的？","o":[{"l":"A","t":"基于会话的 DynamoDB 存储和跨渠道上下文同步"},{"l":"B","t":"带持久存储和上下文检索机制的 Agent 记忆"},{"l":"C","t":"带 Redis 分布式缓存和会话亲和性的上下文一致性"},{"l":"D","t":"带对话历史重建和状态重放的事件溯源"}],"a":["B"],"e":"带持久存储的 Agent 记忆原生提供跨会话上下文管理，使 Agent 无论渠道如何都能回忆之前的交互。","s":"源#35"},{"id":"D2-006","d":2,"t":"single","q":"一个 Agent 需要执行带回溯能力的复杂多步推理。哪种实现模式支持此功能？","o":[{"l":"A","t":"带显式状态转换和回滚机制的状态机"},{"l":"B","t":"带分支探索和剪枝策略的树搜索"},{"l":"C","t":"带步骤验证和错误纠正循环的思维链"},{"l":"D","t":"带目标分解和执行监控的规划算法"}],"a":["C"],"e":"带步骤验证的思维链使 Agent 逐步推理、验证每一步，并在验证失败时纠正错误或回溯。","s":"源#36"},{"id":"D2-007","d":2,"t":"single","q":"一个金融服务 Agent 必须满足决策透明度的监管要求。哪种方法能确保可解释 AI？","o":[{"l":"A","t":"带逐步推理捕获和审计追踪的决策树日志"},{"l":"B","t":"Amazon Bedrock Agent tracing，带推理透明度和来源归属"},{"l":"C","t":"带决策理由和置信度评分的自定义解释生成"},{"l":"D","t":"带显式逻辑文档和验证的基于规则的决策叠加层"}],"a":["B"],"e":"Bedrock Agent tracing 原生提供推理透明度和来源归属，满足决策可解释性的监管要求。","s":"源#37"},{"id":"D2-008","d":2,"t":"single","q":"你的 Agent 系统需要根据任务复杂度和可用资源动态选择工具。哪种架构支持自适应行为？","o":[{"l":"A","t":"带能力匹配和运行时动态绑定的工具注册表"},{"l":"B","t":"基于机器学习的工具选择，带性能预测和优化"},{"l":"C","t":"基于规则的工具选择，带上下文分析和资源可 合和自定义授权逻辑的 Amazon Cognito"},{"l":"B","t":"带企业目录集成和细粒度权限的 IAM Identity Center"},{"l":"C","t":"带 JWT 令牌和基于角色访问控制的自定义认证服务"},{"l":"D","t":"带 Lambda 授权器和企业身份提供商集成的 API 网关"}],"a":["B"],"e":"IAM Identity Center 原生提供企业目录集成和细粒度权限，无需自定义认证基础设施即可实现无缝 SSO。","s":"源#51"},{"id":"D2-022","d":2,"t":"single","q":"你的 GenAI 应用需要与 20+ 个不同数据格式的企业系统集成。哪种集成模式能处理这种复杂性？","o":[{"l":"A","t":"带转换层和协议适配的 API 网关"},{"l":"B","t":"带消息转换和路由能力的企业服务总线"},{"l":"C","t":"带专用适配器的微服务架构"},{"l":"D","t":"带标准化消息格式和转换服务的事件驱动架构"}],"a":["A"],"e":"带转换层的 API 网关为不同企业系统提供集中式协议适配，无需为每个系统构建自定义基础设施。","s":"源#52"},{"id":"D2-023","d":2,"t":"single","q":"一个 GenAI 系统需要与企业数据库实时同步数据，同时保持一致性。哪种方法确保数据完整性？","o":[{"l":"A","t":"带事件流和最终一致性保证的变更数据捕获"},{"l":"B","t":"带实时同步和冲突解决机制的数据库触发器"},{"l":"C","t":"带事务管理和回滚能力的 API 同步"},{"l":"D","t":"带顺序处理和交付保证的队列集成"}],"a":["A"],"e":"变更数据捕获配合事件流提供实时同步和最终一致性保证，同时最小化对源数据库的影响。","s":"源#53"},{"id":"D2-024","d":2,"t":"single","q":"你的 GenAI 应用需要遵守企业数据访问和使用的治理策略。哪个框架确保合规？","o":[{"l":"A","t":"带自动合规检查和违规检测的 Policy-as-code"},{"l":"B","t":"带审计追踪和合规文档的手动审批流程"},{"l":"C","t":"带细粒度权限和活动监控的基于角色的访问控制"},{"l":"D","t":"带自动策略执行和报告的数据分类系统"}],"a":["A"],"e":"Policy-as-code 实现自动化、持续合规检查，可随应用扩展，无手动瓶颈或人为错误。","s":"源#54"},{"id":"D2-025","d":2,"t":"single","q":"一个企业 GenAI 部署需要跨多个服务的集中日志和监控。哪种方法提供全面可观测性？","o":[{"l":"A","t":"带 ELK 堆栈和自定义仪表板的集中日志"},{"l":"B","t":"带 CloudWatch、X-Ray 和自定义指标收集的 AWS 原生监控"},{"l":"C","t":"带企业集成和告警能力的第三方监控工具"},{"l":"D","t":"带关联 ID 和服务网格可观测性功能的分布式追踪"}],"a":["B"],"e":"AWS 原生监控（CloudWatch 和 X-Ray）在所有 AWS 服务间提供集成可观测性，支持自定义指标，无需第三方依赖。","s":"源#55"},{"id":"D2-026","d":2,"t":"single","q":"一个代理式 AI 解决方案必须调用库存 API、检查支付状态，然后决定是否创建货件。什么应协调这些步骤？","o":[{"l":"A","t":"Amazon EBS 快照"},{"l":"B","t":"Amazon CloudFront"},{"l":"C","t":"AWS Config 规则"},{"l":"D","t":"AWS Step Functions"}],"a":["D"],"e":"Step Functions 用于编排多步骤工作流，非常适合代理式 AI 中的多步骤协调（调用API→检查状态→决策）。","s":"样题#5"},{"id":"D2-027","d":2,"t":"single","q":"一个聊天应用必须在生成时返回部分模型输出。开发人员应使用哪种集成模式？","o":[{"l":"A","t":"静态网站托管"},{"l":"B","t":"批量文件处理"},{"l":"C","t":"流式响应交付"},{"l":"D","t":"定时日志导出"}],"a":["C"],"e":"流式响应交付（Streaming）允许模型在生成过程中逐步返回输出，改善用户感知延迟。AWS 中通过 Bedrock 流式传输 API 实现。","s":"样题#6"},{"id":"D2-028","d":2,"t":"single","q":"一个 GenAI 应用必须将长时间运行的摘要任务发送给工作进程，并立即返回作业 ID。哪个服务应缓冲任务请求？","o":[{"l":"A","t":"Amazon Route 53"},{"l":"B","t":"AWS CloudTrail"},{"l":"C","t":"Amazon SQS"},{"l":"D","t":"AWS Backup"}],"a":["C"],"e":"SQS（消息队列）用于异步任务缓冲——生产者快速入队并返回作业ID，消费者异步处理，实现解耦。","s":"样题#3"},{"id":"D2-029","d":2,"t":"single","q":"某企业正在搭建审核流水线，用于在面向客户的通信内容发出前进行合规审查。公司利用预设消息模板生成通信文稿，并将成品存放在 S3 存储桶中。流水线须从模板中提取指定片段并提交给 Bedrock 模型审核，再将审核结果写回 S3。哪项方案运营开销最低？","o":[{"l":"A","t":"在 Bedrock Flows 中创建流程。在流程起始和末尾分别配置 S3 操作节点用于读取和保存通信文稿及模型回复。在中间节点用表达式解析每条通信内容，再用代理步骤将解析后的输入发送给模型执行审核"},{"l":"B","t":"创建 Step Functions Express 状态机。用 S3 GetObject 集成步骤读取原始通信内容，用 Pass 步骤解析内容，将结果传递给 Bedrock InvokeModel 步骤，最后用 S3 PutObject 步骤将模型回复写回存储桶"},{"l":"C","t":"创建带操作组的 Bedrock 代理。配置指令定义代理如何解析通信内容，配置操作组从 S3 读取通信文稿、调用 Bedrock 模型并将回复写回 S3"},{"l":"D","t":"创建仅含一个操作组的 Bedrock 代理。在操作组中配置三个 Lambda 函数分别负责读取 S3 通信文稿、解析并调用模型、将回复写回 S3"}],"a":["A"],"e":"**✅ 为什么 A.Bedrock Flows 流程 对**：Bedrock Flows 专为编排生成式 AI 工作流而构建，将数据访问、确定性转换和模型调用整合在单一托管服务中。在流程内直接配置 S3 操作节点和表达式解析步骤，无需额外服务或自定义代码即可完成从读取到审核再到写回的完整链路，运营开销最低。\n\n**❌ 为什么其他选项错**：\n- B.Step Functions Express：虽可行但需手动编排多个集成步骤，且 Express 类型不支持完整审计\n- C.Bedrock 代理+操作组：代理设计面向自主决策场景，对固定审核流水线而言引入不必要的灵活性和复杂度\n- D.代理+三个 Lambda：需为简单线性流程编写和维护三个自定义函数，过度工程化\n\n**📌 关键概念**：Bedrock Flows 提供托管式生成式 AI 工作流编排，内置 S3 数据访问和模型调用节点，适合线性审核流水线的低运营开销场景。","s":"第三方#2"},{"id":"D2-030","d":2,"t":"single","q":"某公司正在构建实时语音助手系统，在客户通话过程中为客服代表提供辅助。系统须将通话音频转写为文本，端到端延迟低于 500 毫秒，并利用生成式 AI 实时生成建议回复。人工主管须能在通话进行中对系统建议进行评分，评分数据需持久化存储。哪项方案可满足需求？","o":[{"l":"A","t":"使用标准设置的 Transcribe 流式 API 将语音转为文字。使用 Bedrock 批处理推理生成建议。将通话录音和元数据存入 S3，用 S3 生命周期策略管理存储"},{"l":"B","t":"使用 100 毫秒音频块的 Transcribe 流式 API 优化语音助手延迟。调用 Bedrock InvokeModelWithResponseStream 实时处理客户查询。将主管评分存储在 DynamoDB 表中"},{"l":"C","t":"使用 Transcribe 批处理进行通话后分析。配置 Lambda 函数使用 Bedrock InvokeModel 生成建议。用 CloudWatch 记录主管反馈"},{"l":"D","t":"使用 Transcribe 将语音转为文字并进行实时分析。使用 Comprehend 进行情感分析。使用 SQS 排队处理任务。运行 Bedrock InvokeModel 生成建议"}],"a":["B"],"e":"**✅ 为什么 B.100ms 块 Transcribe 流式+Bedrock 流式推理 对**：为满足低于 500 毫秒的端到端延迟，系统必须在每个阶段使用流式传输。100 毫秒音频块使 Transcribe 在客户说话时即开始转录，极大缩短首字延迟。Bedrock 的 InvokeModelWithResponseStream 在 Token 生成时即推送部分输出，使建议在模型推理过程中就逐步呈现。DynamoDB 提供低延迟的评分数据持久化。\n\n**❌ 为什么其他选项错**：\n- A.标准 Transcribe+批处理推理：批处理模式无法满足实时性要求，延迟远超 500 毫秒\n- C.Transcribe 批处理+Lambda：批处理转录需等待完整音频上传，不满足实时通话场景\n- D.Transcribe+Comprehend+SQS：引入多个非流式服务，SQS 排队增加延迟\n\n**📌 关键概念**：Transcribe 流式 API 配合小音频块实现即时转录，Bedrock 流式推理在 Token 生成时推送部分响应，两者协同可实现亚秒级端到端延迟。","s":"第三方#10"},{"id":"D2-031","d":2,"t":"single","q":"某电商企业运营全球产品推荐系统，须依据法规、成本优化和性能要求在 Bedrock 上的多个基础模型间动态切换。公司须基于专有业务逻辑施加自定义控制，包括动态成本阈值、特定 AWS 区域合规规则和 A/B 测试参数。路由决策须在不重新部署代码的情况下实时调整。哪项方案可满足需求？","o":[{"l":"A","t":"部署使用环境变量存储路由规则和 FM ID 的 Lambda 函数。业务需求变化时通过 Lambda 控制台更新环境变量。配置 API Gateway REST API 读取请求参数做路由决策"},{"l":"B","t":"部署 API Gateway REST API 请求转换模板，基于请求属性实现路由逻辑。将 FM 端点存为 API 阶段变量，模型切换时更新变量"},{"l":"C","t":"配置 Lambda 函数为每个请求从 AppConfig Agent 获取路由配置。在函数内执行业务逻辑选择适当 FM。通过单个 API Gateway REST API 端点暴露 FM"},{"l":"D","t":"为 API Gateway 使用 Lambda 授权者，评估存储在 AppConfig 中的路由规则。基于业务逻辑返回授权上下文。将请求路由到每个 FM 对应的模型特定 Lambda 函数"}],"a":["C"],"e":"**✅ 为什么 C.Lambda+AppConfig 实时路由配置 对**：AppConfig 专为实时、经验证的集中化配置变更而设计，支持安全灰度发布、即时传播和回滚。将路由规则、成本阈值、合规约束和 A/B 测试逻辑存入 AppConfig 后，公司可在不重新部署 Lambda 代码的情况下实时切换 FM。Lambda 为每个请求动态读取最新配置，确保路由决策反映当前业务规则。\n\n**❌ 为什么其他选项错**：\n- A.环境变量存储路由：需手动更新环境变量并触发新版本，无法实时传播且不支持灰度\n- B.API Gateway 模板+阶段变量：模板逻辑表达能力有限，阶段变量更新影响所有路由\n- D.Lambda 授权者+多函数：授权者模式增加额外调用层，且需为每个 FM 维护独立函数\n\n**📌 关键概念**：AppConfig 提供动态配置管理支持安全发布与即时回滚，Lambda 运行时读取配置实现无需重部署的实时模型路由切换。","s":"第三方#12"},{"id":"D2-032","d":2,"t":"single","q":"某电商平台运行全球商品推荐服务，需要按照法规约束、成本控制和性能指标在 Bedrock 多个基础模型间灵活切换。企业须运用自有业务逻辑实施精细化管控，涵盖动态费用阈值、区域合规策略及 A/B 测试变量。路由规则须支持不改动代码即可即时更新。哪项方案最合适？","o":[{"l":"A","t":"部署 Lambda 函数并以环境变量保存路由规则和 FM 标识。规则变更时在控制台手动修改环境变量。通过 API Gateway 读取请求参数执行路由"},{"l":"B","t":"在 API Gateway REST API 中配置请求转换模板实现路由逻辑。将 FM 端点设为阶段变量，切换模型时更新变量值"},{"l":"C","t":"设置 Lambda 函数在每次请求时从 AppConfig Agent 拉取路由配置。在函数内运行业务逻辑选定匹配的 FM。经统一 API Gateway 端点对外提供模型访问"},{"l":"D","t":"为 API Gateway 配置 Lambda 授权者评估 AppConfig 中的路由规则。按业务逻辑返回授权上下文。将请求分发到各 FM 对应的专用 Lambda 函数"}],"a":["C"],"e":"**✅ 为什么 C.Lambda 从 AppConfig 拉取路由配置 对**：AppConfig 为集中管理动态配置而生，支持受控部署、验证和快速传播配置变更，完全匹配成本阈值每小时变化、数千并发请求须即时响应的场景需求。Lambda 在运行时读取最新路由规则，无需代码重部署即可切换 FM，同时保持单端点架构简洁性。\n\n**❌ 为什么其他选项错**：\n- A.环境变量方案：变更需手动操作且无法即时传播，不支持灰度和回滚\n- B.API Gateway 模板+阶段变量：模板逻辑受限，阶段变量全局影响难以独立管理\n- D.Lambda 授权者+多函数：增加授权者调用开销，且需为每个 FM 维护独立函数\n\n**📌 关键概念**：AppConfig 支持动态配置的安全灰度发布与即时回滚，Lambda 运行时动态读取实现无代码重部署的 FM 路由切换，适合频繁变化的业务逻辑场景。","s":"第三方#13"},{"id":"D2-033","d":2,"t":"multiple","q":"某企业正在设计基于多个基础模型的 AI 解决方案，需支持多种工作负载模式。部分 FM 须按需实时调用，另一些需持续高吞吐量以支撑批处理。方案须支持混合部署模式，在云基础设施和本地设施上均可运行工作负载以满足数据驻留与合规要求。哪组方案组合可满足需求？（选择两项）","o":[{"l":"A","t":"使用 Lambda 调用 SageMaker AI 异步端点上的 FM 来编排低延迟推理"},{"l":"B","t":"在 Bedrock 中配置预置吞吐量以确保高容量工作负载的一致性能"},{"l":"C","t":"将 FM 部署到 SageMaker AI 端点并通过 SageMaker Neo 支持边缘部署。使用 Lambda 编排 FM 以支持混合部署"},{"l":"D","t":"使用带自动扩缩的 Bedrock 来处理不可预测的流量激增"},{"l":"E","t":"使用 SageMaker JumpStart 托管和调用 FM"}],"a":["B","C"],"e":"**✅ 为什么 B、C 对**：\n- B.Bedrock 预置吞吐量：为高容量批处理工作负载提供一致性能保证，消除按需调用可能出现的冷启动和限流问题，确保持续推理速率\n- C.SageMaker AI 端点+Neo 边缘部署：SageMaker 支持自定义 FM 托管和混合部署，Neo 使模型可在边缘设备运行满足数据驻留和合规要求，Lambda 提供编排层\n\n**❌ 为什么其他选项错**：\n- A.SageMaker AI 异步端点：异步模式引入排队延迟，不适合低延迟实时调用需求\n- D.Bedrock 自动扩缩：按需模式无法保证吞吐量一致性，冷启动影响批处理性能\n- E.SageMaker JumpStart：仅提供预训练模型库，不直接解决吞吐量保证和混合部署需求\n\n**📌 关键概念**：Bedrock 预置吞吐量保障高吞吐批处理性能，SageMaker AI 配合 Neo 实现混合云与边缘部署满足数据驻留合规，二者组合覆盖工作负载多样性和部署灵活性。","s":"第三方#22"},{"id":"D2-034","d":2,"t":"single","q":"某公司为全部开发者购买了 Q Developer Pro 许可证。公司维护一份经审批的资源清单，涵盖内部库、专有算法技术和合规示例代码。一个新开发团队使用 Amazon Q Developer 开发应用，须确保助手推荐仅引用已审批资源。哪项方案运营开销最小？","o":[{"l":"A","t":"创建包含所有已审批内部库、算法和示例代码的 Git 仓库。将仓库作为工作空间本地包含在项目中。确保开发者使用工作空间上下文获取建议"},{"l":"B","t":"在项目根目录创建名为 amazonq/rules 的文件夹。将已审批的内部库、算法和示例代码添加到该文件夹中"},{"l":"C","t":"在项目中创建名为 rules 的文件夹。将指南和代码存入该文件夹供 Q Developer 参考以获取代码建议"},{"l":"D","t":"创建包含已审批数据源的 Q Developer 定制项。确保开发者使用该定制项开发应用"}],"a":["D"],"e":"**✅ 为什么 D.Q Developer 定制项 对**：定制项专用于整合组织审批的知识和编码指引，无需逐项目修改即可让助手推荐与公司政策保持一致。定制项将 Q Developer 指向精选内部来源（已审批库、编码标准、架构模式和专有技术），使建议自动符合公司规范。管理员统一维护定制项内容，新团队直接关联即可使用。\n\n**❌ 为什么其他选项错**：\n- A.Git 仓库+工作空间上下文：需在每个项目中手动包含仓库，管理分散且难以统一更新\n- B.amazonq/rules 文件夹：非 Q Developer 的标准定制化机制，范围仅限单个项目\n- C.rules 文件夹：同样为项目级方案，缺乏跨项目的集中管理和版本控制\n\n**📌 关键概念**：Q Developer 定制项提供组织级的已审批知识集成，开发者关联定制项后助手推荐自动遵循公司标准，运维开销最低。","s":"第三方#23"},{"id":"D2-035","d":2,"t":"single","q":"某医疗保健机构使用 Bedrock 开发实时患者护理 AI 助手，需响应来自不同科室（临床咨询、保险核验、预约安排、保险理赔）的查询。公司希望采用多智能体架构，须确保系统可扩展且能快速为新科室上线服务。哪项方案最能满足需求？","o":[{"l":"A","t":"用独立知识库隔离各智能体数据。用 IAM 过滤控制每个知识库的访问。部署监督智能体对询问执行自然语言意图分类，将查询路由到专门协作者智能体响应特定科室。配置各协作者智能体使用 RAG 连接所属科室知识库"},{"l":"B","t":"为每个科室创建独立监督智能体。配置协作者智能体在各科室内执行意图分类。仅将协作者与对应科室知识库集成。在监督智能体间实施手动交接流程"},{"l":"C","t":"用独立知识库隔离各科室数据。用 IAM 过滤控制访问。部署通用智能体并在其中配置多个操作组执行特定科室功能。在指令中实现基于规则的路由逻辑"},{"l":"D","t":"实施多个独立监督智能体并行运行响应各科室询问。为每个配置多个协作者智能体。将所有智能体与同一知识库集成。使用外部路由逻辑合并响应"}],"a":["A"],"e":"**✅ 为什么 A.独立知识库+监督智能体+协作者智能体 对**：监督智能体模式是 AWS 推荐的多智能体架构方法——一个智能体负责意图分类和路由，专门智能体处理领域特定任务。独立知识库确保各协作者仅检索本科室相关数据，提高准确性和安全性。新科室只需添加协作者智能体和知识库即可扩展，无需改动整体架构。IAM 过滤保障数据访问边界。\n\n**❌ 为什么其他选项错**：\n- B.每科室独立监督智能体+手动交接：手动交接增加延迟和错误风险，多监督智能体管理复杂\n- C.通用智能体+操作组：单智能体内集中所有功能违反关注点分离原则，扩展性差\n- D.并行监督智能体+共享知识库：共享知识库导致数据混淆，并行响应增加成本\n\n**📌 关键概念**：监督智能体+协作者智能体模式实现意图分类与领域处理的清晰分离，独立知识库配合 IAM 过滤保障数据隔离，支持按科室独立扩展。","s":"第三方#26"},{"id":"D2-036","d":2,"t":"single","q":"某医疗保健企业利用 Bedrock 构建实时患者护理智能助手，须处理来自多个科室的咨询，涵盖临床问诊、保险验证、排程管理和理赔处理。企业拟引入多智能体架构，要求系统具备良好扩展能力并可便捷地为新科室开通服务。哪项设计最为合适？","o":[{"l":"A","t":"以独立知识库隔离各智能体数据。以 IAM 过滤管控各知识库访问权限。部署一个监督智能体执行自然语言意图分类，将查询路由至对应科室的协作者智能体。各协作者智能体通过 RAG 访问其科室专属知识库"},{"l":"B","t":"为每个科室设独立监督智能体。为各科室内的细分领域配置协作者智能体执行意图分类。协作者仅与本科室知识库集成。监督智能体间通过手动交接流程协作"},{"l":"C","t":"以独立知识库隔离各科室数据。以 IAM 过滤管控访问。部署单个通用智能体，在其中配置多个操作组执行各科室功能。在指令中实现规则化路由逻辑"},{"l":"D","t":"部署多个独立监督智能体并行响应各科室咨询。为每个监督智能体配置多个协作者。全部智能体连接同一知识库。以外部路由逻辑合并多监督智能体的响应"}],"a":["A"],"e":"**✅ 为什么 A.独立知识库+监督+协作者智能体模式 对**：该方案具备可伸缩的多智能体调度能力、清晰的领域边界划分以及完善的治理，运营复杂度最低。监督智能体执行意图分类和路由编排，协作者智能体处理领域任务，独立知识库确保数据隔离。新科室上线仅需新增协作者智能体和对应知识库。IAM 过滤保障各科室间的数据安全。\n\n**❌ 为什么其他选项错**：\n- B.多监督智能体+手动交接：手动交接增加延迟且易出错，多监督智能体增加管理成本\n- C.通用智能体+操作组：单智能体承载所有功能缺乏职责分离，扩展受限\n- D.并行监督智能体+共享知识库：共享知识库造成跨科室数据混淆，并行处理增加资源开销\n\n**📌 关键概念**：监督智能体模式实现意图路由与领域处理的解耦，独立知识库配合 IAM 过滤保障数据隔离，支持按需为新科室独立扩展智能体和知识库。","s":"第三方#38"},{"id":"D2-037","d":2,"t":"single","q":"某电商平台正在开发使用 Bedrock 和 Claude 向客户推荐产品的生成式 AI 应用。用户反馈部分推荐商品不可售或不相关，且某些推荐响应耗时过长。公司确认大多数客户交互具有唯一性，模型推荐了不在商品目录中的商品。哪项方案可解决这些问题？","o":[{"l":"A","t":"在 Bedrock 护栏中增加接地性并启用自动推理检查。设置预置吞吐量"},{"l":"B","t":"使用提示工程限制模型仅推荐相关产品。使用流式推理降低感知延迟"},{"l":"C","t":"创建 Bedrock Knowledge Bases 并实施 RAG。将 PerformanceConfigLatency 参数设为优化"},{"l":"D","t":"将产品目录数据存入 OpenSearch Service。验证模型推荐与目录匹配性。使用 DynamoDB 做响应缓存"}],"a":["C"],"e":"**✅ 为什么 C.Knowledge Bases+RAG+PerformanceConfigLatency 对**：防止推荐虚构商品的最直接方法是基于权威目录进行接地生成。Knowledge Bases 摄取目录后仅检索实际存在的条目，确保模型输出基于检索到的事实。PerformanceConfigLatency 设为优化可优先低延迟推理路径。大多数交互具有唯一性，缓存策略效果有限，改进检索和推理路径更有效。\n\n**❌ 为什么其他选项错**：\n- A.接地性+预置吞吐量：提高安全性但不确保推荐限于有效产品\n- B.提示工程+流式：提示约束不足以可靠防止幻觉，流式仅改善感知延迟\n- D.OpenSearch+缓存：增加验证和缓存层但增加复杂度，缓存对唯一交互无效\n\n**📌 关键概念**：Knowledge Bases 通过 RAG 将模型输出约束在权威数据源内，PerformanceConfigLatency 优化推理延迟，适合防止产品推荐幻觉的场景。","s":"第三方#39"},{"id":"D2-038","d":2,"t":"single","q":"某公司提供全球餐厅发现服务，拥有 5000 万月活用户。公司希望在收录两千万店铺档案及两亿用户点评的数据集上完成语义检索。数据当前存储在 PostgreSQL 中。方案须支持复杂自然语言查询，在 500 毫秒内为至少 95% 的查询返回结果，每小时更新数据新鲜度，并在高峰期经济高效扩展。哪项方案开发工作量最小？","o":[{"l":"A","t":"将数据迁移到 OpenSearch Service。实施基于关键字的搜索规则和自定义分析器，按菜系、特色和位置查找餐厅。创建 API Gateway 将查询转换为结构化搜索参数"},{"l":"B","t":"将数据迁移到 OpenSearch Service。使用 Bedrock FM 从餐厅描述、评价和菜单项生成向量嵌入。用户提交自然语言查询时用同一 FM 转换为嵌入。执行 k-NN 搜索查找语义相似结果"},{"l":"C","t":"将数据保留在 PostgreSQL 中实施 pgvector。使用 Bedrock FM 从餐厅数据生成嵌入并直接存入 PostgreSQL。创建 Lambda 函数执行相似性搜索"},{"l":"D","t":"将嵌入直接存入 PostgreSQL。创建 Lambda 函数将自然语言查询转为向量。在数据库内执行相似性搜索"},{"l":"E","t":"通过自定义摄取管道将数据迁移到 Bedrock Knowledge Bases。配置自动嵌入生成。使用 Retrieve API 内置向量搜索以自然语言查询"}],"a":["B"],"e":"**✅ 为什么 B.OpenSearch Service+Bedrock FM 嵌入+k-NN 对**：OpenSearch Service 提供托管式 k-NN 向量搜索，配合 Bedrock FM 生成嵌入可实现语义匹配——按含义而非关键词检索结果。迁移到 OpenSearch 将搜索工作负载与运营数据库分离，避免高峰期过度配置 PostgreSQL。OpenSearch 原生支持大规模向量索引和低延迟查询，满足 95% 查询 500ms 的要求。每小时更新可通过计划重新摄取实现。\n\n**❌ 为什么其他选项错**：\n- A.关键字搜索：不提供语义搜索能力，仅依赖关键词匹配\n- C.PostgreSQL+pgvector：在 2000 万+2 亿规模下事务数据库内运行相似性搜索难以满足 500ms 延迟\n- D.PostgreSQL 嵌入+Lambda：同样受限于 PostgreSQL 的向量搜索性能\n- E.Knowledge Bases+Retrieve API：疑点：源 id 43 同题在 D1-051 中答案为 D，此处照录源答案 B\n\n**📌 关键概念**：OpenSearch Service 配合 Bedrock FM 嵌入实现托管式语义搜索，将搜索负载与运营数据库分离满足高并发低延迟需求。疑点：与 D1-051（src 68）同题但答案不同。","s":"第三方#43"},{"id":"D2-039","d":2,"t":"single","q":"某企业构建处理财务报告并为分析师提供摘要的生成式 AI 应用。应用须在两种计算环境中运行：Lambda 函数使用 Python SDK 按需分析报告，以及 EKS 集群使用 JavaScript SDK 批量处理报告。方案须在两个环境间维护多轮对话上下文并使用一致的 API 接口。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Bedrock InvokeModel API 为每个环境配置独立身份验证。对话状态存入 DynamoDB。为每种语言编写自定义 I/O 格式化逻辑"},{"l":"B","t":"在两个环境中直接使用 Bedrock Converse API，用 IAM 角色统一身份验证。对话状态存入 ElastiCache。为模型参数创建语言特定的包装器"},{"l":"C","t":"创建集中式 API Gateway REST API 端点用 InvokeModel API 处理所有交互。交互历史存储在函数或容器进程内存中。用环境变量配置模型参数"},{"l":"D","t":"使用 Bedrock Converse API 和 IAM 角色进行身份验证。在请求消息数组中传递历史消息以维护对话上下文。使用语言特定 SDK 建立一致的 API 接口"}],"a":["D"],"e":"**✅ 为什么 D.Converse API+IAM 角色+消息数组 对**：Converse API 为多轮对话交互而设计，在不同 SDK 和计算环境间保持一致工作方式。它标准化了消息、角色和上下文表示，确保 Lambda（Python）和 EKS（JavaScript）使用相同的对话接口。在请求消息数组中传递历史消息实现无状态对话上下文维护，无需外部状态存储。IAM 角色提供跨环境的统一身份验证。\n\n**❌ 为什么其他选项错**：\n- A.InvokeModel+独立验证+自定义格式化：InvokeModel 非为对话设计，需自定义格式化增加开发量\n- B.Converse+ElastiCache+语言包装器：ElastiCache 引入额外状态管理，语言包装器增加维护负担\n- C.集中 API Gateway+内存存储：进程内存存储不跨环境持久化，环境变量配置缺乏灵活性\n\n**📌 关键概念**：Converse API 标准化多轮对话的消息和上下文表示，跨 SDK 一致工作，消息数组传递历史实现无状态对话上下文维护。","s":"第三方#45"},{"id":"D2-040","d":2,"t":"single","q":"某电商企业使用 Bedrock 构建生成式 AI 应用，通过 Step Functions 编排多智能体工作流生成详细产品描述。工作流含三个顺序状态：描述生成器、技术规格验证和 SEO 优化器。中间输出超出 Step Functions 256KB 负载限制。公司须在保持顺序验证的同时解决负载限制。哪项方案最佳？","o":[{"l":"A","t":"将中间输出存入 DynamoDB。在状态间仅传递引用。创建 Map 状态在各智能体处理时从 DynamoDB 检索完整数据"},{"l":"B","t":"配置 Bedrock 集成在输入参数中使用 S3 存储桶 URI 处理大型输出。用 ResultPath 和 ResultSelector 在智能体步骤间路由 S3 引用，同时保持顺序验证工作流"},{"l":"C","t":"用 Lambda 函数将输出压缩到 256KB 以下后传递。各智能体处理前解压，传递前再次压缩"},{"l":"D","t":"为每个智能体配置独立 Step Functions 状态机。用 EventBridge 协调状态机间的执行流程。以 S3 引用作为事件数据传递输出"}],"a":["B"],"e":"**✅ 为什么 B.Bedrock 集成+S3 URI+ResultPath 对**：Step Functions 256KB 负载限制可通过将大型中间产物外部化到 S3 并仅在状态间传递轻量级引用（URI/键）来解决。Bedrock 集成原生支持在输入参数中使用 S3 URI，无需自定义代码读取或写入。ResultPath 和 ResultSelector 在步骤间精确路由 S3 引用，保持顺序验证工作流的完整性。这是 AWS 推荐的大负载工作流处理模式。\n\n**❌ 为什么其他选项错**：\n- A.DynamoDB+Map 状态：引入额外数据库增加运营开销，Map 状态用于并行而非顺序流程\n- C.Lambda 压缩/解压：增加自定义代码和延迟，压缩可能损坏数据\n- D.多状态机+EventBridge：拆分状态机增加编排复杂性，EventBridge 事件不保证顺序\n\n**📌 关键概念**：Step Functions 通过 S3 URI 引用处理超 256KB 负载，Bedrock 集生原生支持 S3 URI 输入，ResultPath/ResultSelector 保持顺序工作流的数据路由。","s":"第三方#60"},{"id":"D2-041","d":2,"t":"single","q":"某金融服务公司开发实时生成式 AI 助手辅助呼叫中心客服人员。助手须即时将客户语音转为文字、解析对话语境，并在客户讲话过程中向客服人员逐步推送建议。为确保响应速度，从语音输入到首条建议呈现的端到端延迟须低于 1 秒。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Transcribe 流式传输转录通话。将文本传递给 Comprehend 进行情感分析。将结果通过 InvokeModel API 输入到 Bedrock 上的 Claude。将结果存入 DynamoDB。用 WebSocket API 显示结果"},{"l":"B","t":"使用启用部分结果的 Transcribe 流式传输，在客户说完前投递转录文本片段。将片段通过 InvokeModelWithResponseStream API 转发到 Bedrock。通过 API Gateway WebSocket API 将响应流式传输给客服人员"},{"l":"C","t":"使用 Transcribe 批处理将通话转为文字。将完整转录通过 ConverseStream API 传递给 Bedrock 上的 Claude。通过 Lex 聊天机器人界面返回响应"},{"l":"D","t":"使用 Transcribe 流式 API 配合 Lambda 函数转录每个音频段。在 Bedrock 上用 InvokeModel API 调用 Titan Embeddings 模型。将结果发布到 SNS"}],"a":["B"],"e":"**✅ 为什么 B.Transcribe 流式部分结果+InvokeModelWithResponseStream 对**：Transcribe 流式配合部分结果允许在说话者完成句子前投递转录片段，极大缩短感知延迟使下游处理即时启动。InvokeModelWithResponseStream 在 Token 生成时推送部分输出，实现模型推理的流式传输。API Gateway WebSocket API 提供双向实时通道将流式响应推送到客服界面。三段流式管道协同满足低于 1 秒端到端延迟。\n\n**❌ 为什么其他选项错**：\n- A.Transcribe+Comprehend+InvokeModel：Comprehend 引入额外非流式步骤增加延迟，InvokeModel 非流式推理\n- C.Transcribe 批处理+ConverseStream：批处理需等待完整音频，无法实时转录\n- D.Transcribe+Lambda+Titan Embeddings：Lambda 逐段处理增加延迟，Embeddings 模型不生成建议\n\n**📌 关键概念**：Transcribe 流式部分结果+Bedrock 流式推理+WebSocket API 三段全流式管道实现亚秒级端到端延迟，满足实时增量建议需求。","s":"第三方#71"},{"id":"D2-042","d":2,"t":"single","q":"某公司构建使用 Bedrock 和 Agent Squad 的多云生成式 AI 密钥解析应用。应用从多个源（密钥存储和 HSM）解析密钥，使用 Lambda 函数从这些源获取密钥元数据。系统通过 Step Functions 编排智能体工作流。为提高可靠性，公司须并行运行密钥解析工作流并对所有提示流进行版本控制以支持回滚。哪项方案以最小改动满足需求？","o":[{"l":"A","t":"使用 Step Functions Map 状态并行运行智能体工作流。通过 Lambda 输出传递更新的密钥元数据。使用 AppConfig 对所有提示流进行版本控制以门控和回滚故障模板"},{"l":"B","t":"仅使用 Bedrock Agents。配置 Bedrock 护栏限制提示变化。使用内联 JSON 模式为单个智能体定义工作流来链式调用工具"},{"l":"C","t":"使用集中式 EventBridge 管道调用每个智能体。中间提示存入 DynamoDB。使用基于 TTL 的回退和重试解析智能体顺序"},{"l":"D","t":"使用 EventBridge Pipes 基于 CloudWatch 日志模式调用解析器。响应元数据存入 DynamoDB 带 TTL 和版本化写入。使用 Q Developer 动态生成回退提示"}],"a":["A"],"e":"**✅ 为什么 A.Step Functions Map 状态+Lambda+AppConfig 对**：Map 状态支持密钥解析工作流的并行执行，改善短生命周期和即将过期密钥的刷新延迟，确保密钥在下游智能体需要前及时刷新。Lambda 输出传递更新的密钥元数据保持现有架构。AppConfig 为提示流提供版本控制和回滚能力，故障模板可安全门控和恢复。方案以最小重设计保留了既有 Step Functions 架构。\n\n**❌ 为什么其他选项错**：\n- B.仅 Bedrock Agents+护栏：护栏限制内容安全但不提供提示版本控制和回滚\n- C.EventBridge+DynamoDB+TTL：放弃 Step Functions 编排改为事件驱动，改动较大且 TTL 回退不可靠\n- D.EventBridge Pipes+Q Developer：动态生成回退提示引入不可预测性，日志模式触发增加复杂性\n\n**📌 关键概念**：Step Functions Map 状态实现并行工作流执行加速密钥刷新，AppConfig 提供提示模板版本控制与安全回滚，最小改动复用现有架构。","s":"第三方#72"},{"id":"D2-043","d":2,"t":"single","q":"某公司为基于托管模型服务的生成式 AI 应用设计 API。API 须流式传输响应以降低延迟、强制令牌限制以管理计算资源、并内置重试机制以应对模型超时与不完整响应。哪项方案运营开销最低？","o":[{"l":"A","t":"将 API Gateway HTTP API 与 Lambda 函数集成以调用 Bedrock。使用 Lambda 响应流式传输推送响应。在 Lambda 内强制令牌限制。通过 Lambda 和 API Gateway 超时配置实现模型超时的重试逻辑"},{"l":"B","t":"将 API Gateway HTTP API 直接连接到 Bedrock。通过客户端轮询模拟流式传输。在前端强制令牌限制。通过 API Gateway 集成设置配置重试行为"},{"l":"C","t":"将 API Gateway WebSocket API 连接到托管容器化推理服务器的 ECS 服务。通过 WebSocket 流式传输响应。在 ECS 内强制令牌限制。用 ECS 任务生命周期钩子处理超时"},{"l":"D","t":"将 API Gateway REST API 与调用 Bedrock 的 Lambda 集成。使用 Lambda 响应流式传输。在 Lambda 内强制令牌限制。通过超时配置实现重试"}],"a":["A"],"e":"**✅ 为什么 A.HTTP API+Lambda+响应流式+超时重试 对**：HTTP API 提供轻量经济的前端，与 Lambda 干净集成进行请求处理。Lambda 响应流式传输在 Token 生成时推送部分输出满足流式需求。令牌限制在 Lambda 内实施确保资源管控
