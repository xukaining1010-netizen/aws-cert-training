式。为潜在合规违规设告警。建立人工评估团队审核被标记交互"}],"a":["B"],"e":"**✅ 为什么 B.Bedrock 评估 LLM 评判+护栏合规+A2I 人工审核 对**：Bedrock 评估用 LLM 作为评判模型对事实准确性、对话恰当性和策略一致性进行大规模自动评分。护栏提供策略执行层在响应违反合规约束时拦截或干预，防止不允许的金融指导模式。A2I 是托管人工审核服务，基于规则或置信度阈值将高风险或策略标记的交互路由给金融专家审核，将人工精力集中在最重要的事项上。三者组合实现可扩展评估加针对性人工监督。\n\n**❌ 为什么其他选项错**：\n- A.全手动评分：不可扩展，人工审核所有响应成本高\n- C.Lex+静态规则：静态规则不足以满足监管合规和事实准确性\n- D.CloudWatch 监控：提供监控但不提供结构化质量评估或策略执行\n\n**📌 关键概念**：Bedrock 评估用 LLM 评判实现大规模自动化质量评分，护栏执行合规策略拦截违规响应，A2I 将高风险交互路由给人工审核实现针对性监督。","s":"第三方#15"},{"id":"D5-018","d":5,"t":"single","q":"某医疗机构计划开发概念验证应用，使用 Bedrock 自动汇总医疗文档。企业有 3 周时间验证应用准确性。应用须符合数据隐私政策，并包含评估汇总准确性和处理时间的指标。哪项方案可满足需求？","o":[{"l":"A","t":"创建含 50-100 份匿名患者记录的数据集。用安全 Knowledge Base 实施 RAG。用评判模型评估三个 FM 的准确性指标"},{"l":"B","t":"在患者记录上微调单个 FM。在 Bedrock 上部署。用 AgentCore 配置为代理。对 500 名员工做用户测试"},{"l":"C","t":"选择最强可用 FM。用 Converse API 创建聊天界面。仅用定性反馈在 50-100 份实际患者记录上测试。用自定义 Web 界面收集性能指标"},{"l":"D","t":"用 Strands SDK 部署连接多个含专业医疗文档 Knowledge Base 的多个代理。比较各代理响应。评估与现有系统集成"}],"a":["A"],"e":"**✅ 为什么 A.匿名数据集+RAG+评判模型评估三 FM 对**：RAG 在受监管医疗领域比微调更高效安全，使用匿名患者记录不将敏感数据泄露到模型永久记忆中。评判模型模式用强评估模型对多个候选 FM 的输出评分，提供事实一致性和完整性等客观指标，在 3 周时间内可定量快速评估准确性。安全 Knowledge Base 实施确保数据隐私合规。\n\n**❌ 为什么其他选项错**：\n- B.微调 FM：通常需超过 3 周准备数据并验证临床准确性\n- C.仅定性反馈+实际记录：定性反馈在时间限制内无法规模化，使用实际患者记录有隐私风险\n- D.Strands SDK+多代理：过于复杂不适合 3 周概念验证\n\n**📌 关键概念**：RAG 配合匿名记录在受监管领域安全高效，评判模型对多 FM 输出定量评分实现快速准确评估，3 周内可完成概念验证。","s":"第三方#19"},{"id":"D5-019","d":5,"t":"single","q":"某企业希望为 AI 助手选择新 FM。开发人员须生成评估报告帮助数据科学家评估各 FM 的质量和安全性。数据科学家提供了示例提示用于评估。开发人员希望用 Bedrock 自动化报告生成和评估。哪项方案可满足需求？","o":[{"l":"A","t":"将示例提示合并为 JSON 文档。创建含该文档的 Knowledge Base。编写提示要求 FM 为每个示例生成响应。用 RetrieveAndGenerate API 为每个模型生成报告"},{"l":"B","t":"将示例提示合并为 JSONL 文档存入 S3。创建使用评估模型的 Bedrock 评估作业。S3 为输入，另一个 S3 为输出。为每个 FM 运行作业并将该 FM 选为生成器"},{"l":"C","t":"将示例提示合并为 JSONL 文档存入 S3。创建 Bedrock 评估作业。S3 为输入，QuickSight 为输出。为每个 FM 运行作业并将该 FM 选为评估器"},{"l":"D","t":"将示例提示合并为 JSON 文档创建 Knowledge Base。创建使用检索和响应生成评估类型的评估作业。S3 为输出。为每个 FM 运行"}],"a":["B"],"e":"**✅ 为什么 B.JSONL+S3+Bedrock 评估作业+FM 为生成器 对**：Bedrock 评估作业专为用一致提示集比较 FM 设计，JSONL 格式每行代表一条评估记录存入 S3 支持大规模读取。评估模型对生成输出按定义标准评分，候选 FM 配置为生成器——每次作业用选定 FM 为相同提示集生成答案后由评估模型评分。标准化输出写回 S3 供分析，支持可重复同类比较生成结构化评估报告。\n\n**❌ 为什么其他选项错**：\n- A.Knowledge Base+RetrieveAndGenerate：是 RAG 模式非评估框架，不产生标准化评分\n- C.QuickSight 为输出+FM 为评估器：评估输出传送到 S3 而非 BI 目标，候选 FM 应为生成器而非评估器\n- D.Knowledge Base+检索评估：要求是基于提示的模型评估非检索质量评估\n\n**📌 关键概念**：Bedrock 评估作业用 JSONL 数据集和评估模型对候选 FM 生成的输出评分，候选 FM 配置为生成器实现可重复同类比较。","s":"第三方#24"},{"id":"D5-020","d":5,"t":"single","q":"某医疗机构使用 Bedrock 构建 RAG 应用辅助临床决策。应用需确保病历数据召回的高精确度、自动侦测模型编造内容，同时削减人工复核开销。哪项方案可满足需求？","o":[{"l":"A","t":"用 Comprehend 分析分类 RAG 响应并提取医疗实体。用 Step Functions 编排评估。用 CloudWatch 跟踪实体识别置信度。低于阈值时告警"},{"l":"B","t":"实施用医疗微调模型评估所有响应的自动化 LLM 评估。部署 Lambda 并行化评估。结果发布到 CloudWatch"},{"l":"C","t":"配置 CloudWatch Synthetics 定期生成已知答案测试查询并跟踪成功率。设仪表板比较结果"},{"l":"D","t":"部署混合评估系统用 LLM 评判初步筛选响应，对边缘情况做针对性人工审查。用 Bedrock 内置评估跟踪检索精确度和幻觉率"}],"a":["D"],"e":"**✅ 为什么 D.LLM 评判初筛+针对性人工审查+Bedrock 内置评估 对**：AWS 推荐在高风险医疗领域采用分层评估策略。LLM 评判实现可扩展一致的自动化评估含事实依据、相关性和幻觉风险，显著减少需人工检查的响应数量。仅低于质量阈值或表现模糊的响应升级到人工审查，优化审核工作和成本。Bedrock 内置评估提供 RAG 专用标准化指标（检索精确度、源文档忠实度、幻觉率），与 Knowledge Base 和模型直接集成无需自建管道。\n\n**❌ 为什么其他选项错**：\n- A.Comprehend 实体置信度：无法可靠检测生成文本中的幻觉\n- B.微调评估模型+Lambda：需维护和扩缩单独的微调模型，增加复杂性和成本\n- C.CloudWatch Synthetics：回归测试有用但无法检测真实开放查询中的幻觉\n\n**📌 关键概念**：LLM 评判自动筛选减少人工审核量，Bedrock 内置评估提供 RAG 专用指标（检索精确度、幻觉率），针对性人工审查处理边缘情况降低成本。","s":"第三方#37"},{"id":"D5-021","d":5,"t":"single","q":"某企业应用使用 Bedrock FM 处理和分析 50 至 200 页技术文档。当文档超过 FM 上下文窗口限制时，用户收到不一致响应和被截断的输出。哪项方案可解决此问题？","o":[{"l":"A","t":"将每个数据块配置为固定 4000 Token、20% 重叠。用应用逻辑顺序链接数据块直到达到 200000 Token 上下文窗口再做推理"},{"l":"B","t":"使用分层分块父块 8000 Token、子块 2000 Token。用 Knowledge Base 内置检索根据查询自动选择相关父块。配置重叠 Token"},{"l":"C","t":"使用语义分块断点百分位阈值 95%、缓冲区 3 句子。用 RetrieveAndGenerate API 根据嵌入相似度分数动态选择最相关数据块"},{"l":"D","t":"创建 Lambda 用分词器分析文档 Token 数。将文档分割为适合上下文窗口 80% 的等长段。独立处理每段后汇总"}],"a":["C"],"e":"**✅ 为什么 C.语义分块+RetrieveAndGenerate 动态选择 对**：语义分块按含义而非固定 Token 数分割文档，通过断点百分位阈值和句子缓冲区保持内容连贯和语义完整，降低重要概念被分割的可能性。RetrieveAndGenerate API 为数据块生成嵌入并按与查询的相似度动态选择最相关数据块，确保 FM 只接收高价值上下文同时保持在窗口限制内，从根本上解决截断和不一致问题。\n\n**❌ 为什么其他选项错**：\n- A.顺序链接固定块：不符合 FM 处理上下文方式，有超出限制或引入无关信息风险\n- B.分层分块+大父块：改进结构但处理超大型文档时大父块可能导致效率低下\n- D.独立处理各段：导致全局上下文丢失和摘要不一致\n\n**📌 关键概念**：语义分块按含义分割保持语义完整，RetrieveAndGenerate API 按嵌入相似度动态选择最相关数据块，确保 FM 接收高价值上下文且不超出窗口限制。","s":"第三方#41"},{"id":"D5-022","d":5,"t":"single","q":"某医疗企业使用 Bedrock 支撑临床文档摘要系统。系统在处理复杂临床文档时产生不一致的摘要，但在简单文档上表现良好。企业须实现方案以诊断不一致性、按既定指标比较提示性能并维护提示版本历史。哪项方案可满足需求？","o":[{"l":"A","t":"用 Prompt Management 创建多个提示变体。用简单文档手动测试。通过控制台部署性能最高版本"},{"l":"B","t":"在代码仓库中对提示实施版本控制并附含复杂文档和可量化评估指标的测试套件。用自动化测试框架比较提示版本并记录性能模式"},{"l":"C","t":"将每个新提示版本部署到单独 Bedrock API 端点。在端点间分配流量。用 CloudWatch 捕获指标和反馈自动选择版本"},{"l":"D","t":"在 Bedrock Flows 中创建自定义提示评估流将相同文档输入应用到不同变体。用 Comprehend Medical 分析评分事实准确性"}],"a":["B"],"e":"**✅ 为什么 B.代码仓库版本控制+测试套件+自动化测试 对**：版本控制下的提示附带含复杂临床文档和可量化评估指标（事实准确性、完整性、一致性）的测试套件，可一致重现问题、跟踪回归并比较提示行为。自动化测试确保可扩展性和可重复性，版本历史保留提示演变过程。系统化诊断、可衡量比较和历史可追溯性三者兼备。\n\n**❌ 为什么其他选项错**：\n- A.Prompt Management+手动测试：缺乏客观指标，未处理复杂文档问题\n- C.多端点+流量分配：侧重实时实验但不诊断不一致性或保存详细历史评估\n- D.Flows+Comprehend Medical：引入不必要服务耦合，无稳健版本历史或自动化比较基准\n\n**📌 关键概念**：代码仓库版本控制配合含复杂文档和量化指标的测试套件，自动化测试框架实现提示版本比较、回归跟踪和历史可追溯。","s":"第三方#46"},{"id":"D5-023","d":5,"t":"single","q":"某企业使用 Bedrock 实施基于 RAG 的系统向用户提供医疗信息。需对比不同文本切分方案、衡量两个 FM 的输出优劣，并在上线前设定量化达标门槛。哪种 Bedrock 评测配置可达成此目标？","o":[{"l":"A","t":"创建仅检索评估作业用 Claude Sonnet 为评估模型。配置上下文相关性和覆盖率指标。在单独 CI/CD 管道定义部署阈值"},{"l":"B","t":"创建检索并生成评估作业用自定义精确度-at-k 和 1-5 分 LLM 评判指标。在评估数据集中包含每种分块策略。用 Claude Sonnet 评估两个 FM 响应"},{"l":"C","t":"为每种分块策略和 FM 组合创建单独评估作业。用 Bedrock 内置指标评估正确性和完整性。部署前手动评审"},{"l":"D","t":"设置多个仅检索评估作业评估检索质量。为两个 FM 创建单独作业用 Nova Pro 为 LLM 评判。基于忠实度和引用精确度评估"}],"a":["B"],"e":"**✅ 为什么 B.检索并生成评估+精确度-at-k+LLM 评判+多分块策略 对**：检索并生成评估作业评估完整 RAG 管道（检索和生成），将不同切分方案纳入评测数据集后可在统一条件下做横向对比。自定义精确度-at-k 衡量检索组件有效呈现相关数据块，LLM 评判为生成响应提供定性评分。用相同评估模型评估两个 FM 确保评分一致性消除评估者偏见。数字评分支持自动化质量门禁，通过 CI/CD 实现部署阈值强制。\n\n**❌ 为什么其他选项错**：\n- A.仅检索评估：无法评估生成质量\n- C.手动评审：不可扩展且延迟部署\n- D.分离检索和生成评估：难以将分块策略与最终输出质量关联\n\n**📌 关键概念**：检索并生成评估作业评估完整 RAG 管道，评估数据集含多分块策略实现并排比较，LLM 评判提供一致性评分支持自动化质量门禁。","s":"第三方#55"},{"id":"D5-024","d":5,"t":"multiple","q":"某企业使用 Bedrock 为客户生成技术内容。最近在模型生成长篇技术文档摘要时出现大量虚构输出，包含不准确或编造的细节。当前方案使用大型 FM 配合基本单次提示将完整文档包含在单次输入中。企业须减少幻觉并达到事实准确性目标，每小时处理超过 1000 份文档且每份 3 秒内生成摘要。哪组方案组合可满足需求？（选择两项）","o":[{"l":"A","t":"实施零样本思维链指令要求模型逐步推理和事实验证"},{"l":"B","t":"使用带 Knowledge Base 的 RAG。应用语义分块和调优嵌入将摘要基于源内容"},{"l":"C","t":"配置 Bedrock 护栏阻止与幻觉内容模式匹配的输出"},{"l":"D","t":"在 Bedrock 中提高 temperature 参数"},{"l":"E","t":"提示 Bedrock 模型一次性对每份完整文档进行摘要"}],"a":["B","C"],"e":"**✅ 为什么 B、C 对**：\n- B.RAG+语义分块+调优嵌入：将长文档分割为有意义段落，模型只需检索最相关段落而非一次处理整份文档，从源头减少幻觉并提高事实准确性。高效扩展支持每小时 1000+ 份文档\n- C.护栏阻止幻觉模式：在推理时检测并阻止类似幻觉的输出模式，性能开销极小适合 3 秒低延迟要求，为 B 的基于源内容生成添加深度防御层\n\n**❌ 为什么其他选项错**：\n- A.思维链推理：显式推理步骤增加延迟和成本，不适合高吞吐量\n- D.提高 temperature：增加随机性使幻觉更严重\n- E.一次性摘要完整文档：重复现有有缺陷的方法\n\n**📌 关键概念**：RAG 语义分块从源头基于源内容减少幻觉，护栏在推理时检测阻止幻觉模式，两者组合实现可扩展的准确生成和运行时保护。","s":"第三方#85"},{"id":"D5-025","d":5,"t":"single","q":"某企业将 AI 助手部署为使用 Amplify、AppSync GraphQL API 和 Bedrock Knowledge Bases 的 React 应用。应用通过 GraphQL API 调用 RetrieveAndGenerate API 进行知识库交互，配置 Lambda 解析器使用 RequestResponse 调用类型。使用者常反映请求超时与回复迟滞，复杂问题更频繁。企业须修复性能问题并改善用户体验。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Amplify AI Kit 从 GraphQL API 实现流式响应并优化客户端渲染"},{"l":"B","t":"增加 Lambda 解析器超时值。实现带指数退避的重试逻辑"},{"l":"C","t":"更新应用向 SQS 队列发送请求。更新 AppSync 解析器轮询和处理队列"},{"l":"D","t":"将 RetrieveAndGenerate API 改为 InvokeModelWithResponseStream API。用 API Gateway WebSocket API 支持流式响应"}],"a":["A"],"e":"**✅ 为什么 A.Amplify AI Kit 流式响应+客户端渲染优化 对**：当前 Lambda 解析器配置为同步 RequestResponse 行为，客户端在整个检索生成完成前不收到任何内容。使用 Amplify AI Kit 实现流式响应允许应用在模型生成 Token 时增量返回部分输出，改善感知响应性——用户立即看到答案形成。流式传输减轻可变模型延迟和检索时间影响，客户端无需等待单个最终负载。区分「生成缓慢」和「无响应」，复杂问题反馈更快。\n\n**❌ 为什么其他选项错**：\n- B.增加超时+重试：可能恶化负载和成本，界面仍停滞，重试有重复知识库请求风险\n- C.SQS 轮询：引入笨拙的轮询模型增加运维复杂性，不改善交互性\n- D.替换 API+WebSocket：重大架构变更，当目标仅是修复超时和改善体验时不必要\n\n**📌 关键概念**：Amplify AI Kit 从 GraphQL API 实现流式响应，模型生成 Token 时增量返回部分输出改善用户感知延迟，解决同步 RequestResponse 超时问题。","s":"第三方#109"},{"id":"D5-026","d":5,"t":"single","q":"某企业使用 Bedrock 生成客户查询的个性化响应。须搭建一套品质管控机制，在版本迭代时衡量提示词效能与模型参数表现。该机制需自动化对比若干提示方案的产出、甄别回复中的质量缺陷、输出可量化评测数据，同时支持审核人员对结果给出意见。未达到既定达标线的配置不得推送上线。哪项方案可满足需求？","o":[{"l":"A","t":"创建 Lambda 将示例查询发送到多个 Bedrock 配置并存入 S3。用 QuickSight 可视化。每日手动审查。用 CodePipeline 部署达标配置"},{"l":"B","t":"使用 Bedrock 评估任务比较模型输出，用自定义提示数据集。配置 CodePipeline 在提示模板更改时运行评估。仅部署超过预定义阈值的配置"},{"l":"C","t":"设置 CloudWatch 告警监控延迟和错误率。用 EventBridge 通知。在 Systems Manager 配置手动审批工作流"},{"l":"D","t":"用 Lambda 创建自动化测试框架采样生产流量路由到更新版本。用 Comprehend 情感分析比较。情感分下降则阻止"}],"a":["B"],"e":"**✅ 为什么 B.Bedrock 评估任务+自定义数据集+CodePipeline 门控 对**：评估任务专为可重复自动化评估提示有效性、模型行为和响应质量设计，支持定量指标和 LLM 评判检测细微质量退化。自定义提示数据集一致测试多个提示模板和配置消除实时流量变异性。集成到 CodePipeline 在提示模板或配置更改时自动触发质量检查，创建门控部署工作流——仅超过预定义阈值的配置被部署。人工审核人员通过审查评估结果和分数参与，无需手动数据收集。\n\n**❌ 为什么其他选项错**：\n- A.Lambda+S3+QuickSight+手动：自定义框架和间接信号增加复杂性降低可靠性\n- C.CloudWatch 告警+手动审批：侧重运维健康而非响应质量\n- D.Lambda+生产流量+情感分析：情感分数非质量指标，间接且不可靠\n\n**📌 关键概念**：Bedrock 评估任务用自定义数据集可重复评估提示和模型质量，CodePipeline 集成实现自动触发质量门控，仅达标配置被部署。","s":"第三方#113"},{"id":"D5-027","d":5,"t":"multiple","q":"某电商企业构建内部平台，使用 Bedrock FM 开发 GenAI 应用。开发人员须基于与电商用例对齐的评估选择模型。平台须展示文本生成和摘要的准确性指标仪表板。企业拥有自定义电商数据集作为标准化评估输入。哪组步骤组合以最少运维开销满足需求？（选择两项）","o":[{"l":"A","t":"将数据集导入 S3。提供 IAM 权限和跨域资源共享权限使评估任务访问数据集"},{"l":"B","t":"将数据集导入 S3。提供 IAM 权限和 VPC 端点配置使评估任务访问数据集"},{"l":"C","t":"配置 Lambda 按计划在 Bedrock 控制台创建模型评估任务。提供含数据集的 S3 URI 为输入。配置评估任务测量文本生成 RWK 分数和摘要 BERTScore。配置第二个 Lambda 检查状态并发布日志到 CloudWatch。创建 Logs Insights 仪表板"},{"l":"D","t":"按计划用 SageMaker Clarify 创建评估任务。用开源框架运行标准化评估。结果发布到 CloudWatch 命名空间。用 Lambda 检查状态。创建仪表板"},{"l":"E","t":"按计划用 SageMaker AI 笔记本作业用 fmvelos 或 ragas 框架运行评估。在笔记本中编写直接 InvokeModel 调用处理响应。结果发布到 CloudWatch Logs。创建仪表板"}],"a":["B","C"],"e":"**✅ 为什么 B、C 对**：\n- B.S3 导入+IAM 权限+VPC 端点：将标准化评估输入放置在 S3 并授予评估工作流正确读取权限，VPC 端点配置符合企业网络要求，避免为评估者构建自定义存储\n- C.Lambda 调度评估任务+RWK/BERTScore+CloudWatch 仪表板：Lambda 按计划启动 Bedrock 评估任务用 S3 数据集为输入，第二个 Lambda 检查状态推送结果到 CloudWatch，CloudWatch 指标和日志可在仪表板可视化，运维开销最小\n\n**❌ 为什么其他选项错**：\n- A.CORS 权限：CORS 主要是浏览器访问问题，不解决服务到服务模式中评估任务安全访问 S3\n- D.SageMaker Clarify+开源框架：需更多环境管理、依赖控制和长期维护\n- E.SageMaker AI 笔记本+自定义代码：环境管理和依赖控制运维负担高\n\n**📌 关键概念**：Bedrock 模型评估托管工作流配合 S3 数据集和 Lambda 调度实现标准化评估，结果发布到 CloudWatch 供仪表板可视化，运维开销最小。","s":"第三方#119"}];

<script>

/* ================================================================
   ===================== 题库数据（构建注入 QUIZ_META + QUIZ_QUESTIONS） ================
   ================================================================ */
const QUESTIONS = QUIZ_QUESTIONS;
const META = (typeof QUIZ_META !== 'undefined' && QUIZ_META) ? QUIZ_META : {};
const EXAM = META.exam || 'QUIZ';
const LS_PREFIX = META.lsPrefix || EXAM.toLowerCase();

const GLOSSARY = META.glossary || {};

function getGlossaryForQuestion(q) {
  const texts = [q.q];
  if(q.o && Array.isArray(q.o)) q.o.forEach(o => texts.push(o.t));
  if(q.e) texts.push(q.e);
  const fullText = texts.join(' ');
  const found = [];
  const sorted = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
  for(const term of sorted) {
    if(fullText.includes(term)) found.push({term, def: GLOSSARY[term]});
  }
  return found;
}

/* ================================================================
   ===================== 术语高亮 + 弹定义 ================
   ================================================================ */
// 长词优先排序，独立 token 边界匹配，避免 EBS 误标 Amazon EBS 中的 EBS 等
function getGlossarySortedKeys() {
  return Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
}

// 判断术语在文本中是否为独立出现（前后非字母/数字）
function isIndependentToken(text, idx, term) {
  const before = text[idx-1];
  const after = text[idx + term.length];
  const isLetter = c => c && /[A-Za-z0-9]/.test(c);
  return !isLetter(before) && !isLetter(after);
}

// 将解析正文中的术语高亮为可点击 span，返回 HTML
function highlightGlossaryTerms(text) {
  if(!text) return text;
  const sortedKeys = getGlossarySortedKeys();
  let result = '';
  let i = 0;
  while(i < text.length) {
    let matched = false;
    for(const term of sortedKeys) {
      if(!term) continue;
      const idx = text.indexOf(term, i);
      if(idx === i && isIndependentToken(text, idx, term)) {
        const def = GLOSSARY[term] || '（暂无定义）';
        const termEsc = term.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const defEsc = def.replace(/\\/g,'\\\\').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        result += `<span class="gloss-term" onclick="showGlossTip(event,'${termEsc}','${defEsc}')">${term}</span>`;
        i += term.length;
        matched = true;
        break;
      }
    }
    if(!matched) {
      // 中文等宽字符直接输出，保持原文本
      result += text[i];
      i++;
    }
  }
  return result;
}

// 点击术语弹出定义浮层
function showGlossTip(e, term, def) {
  e.stopPropagation();
  const tip = document.getElementById('glossTip');
  document.getElementById('glossTipTerm').textContent = term;
  document.getElementById('glossTipDef').textContent = def || '（暂无定义）';
  tip.style.display = 'block';
  // 定位：优先在点击位置下方，避免超出视口
  const pad = 12;
  let left = e.clientX + pad;
  let top = e.clientY + pad;
  // 先渲染再量尺寸
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if(left + tw > window.innerWidth - 8) left = e.clientX - tw - pad;
  if(top + th > window.innerHeight - 8) top = e.clientY - th - pad;
  if(left < 8) left = 8;
  if(top < 8) top = 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

function closeGlossTip() {
  document.getElementById('glossTip').style.display = 'none';
}

// 点击页面其它区域关闭浮层
document.addEventListener('click', function(e) {
  const tip = document.getElementById('glossTip');
  if(tip && tip.style.display === 'block' && !tip.contains(e.target)) {
    closeGlossTip();
  }
});

// 按 Esc 关闭浮层
document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') closeGlossTip();
});

const LS_ANSWERS = LS_PREFIX + '_answers';
const LS_WRONG   = LS_PREFIX + '_wrong';
const LS_PROGRESS = LS_PREFIX + '_progress';

function getAnswers() { return JSON.parse(localStorage.getItem(LS_ANSWERS)||'[]'); }
function setAnswers(a) { localStorage.setItem(LS_ANSWERS,JSON.stringify(a)); }

/* ----------------------------------------------------------------
   作答记录：会话态 / 累计统计态分离（2026-09-11 修复）
   旧缺陷：模拟考核误读全局 localStorage 历史 → 进场即显示「已答对/曾答错」、
   题号导航提前染色、成绩单把练习与往场算进本次（实测正确数>题数、未答为负、
   分数超满分、正确率>100%）。
   三态口径：
     · sessionResults()       本场逐题作答（quizState.results）＝「本次」唯一真源
     · sessionScopedAnswers() 视图用作答集：考核=仅本场；练习模式=全局历史（原行为）
     · recordAnswer()         仍写全局 store → 错题集与统计口径不变
   ---------------------------------------------------------------- */
function sessionResults() {
  const r = (quizState && quizState.results) || {};
  return Object.keys(r).map(id => ({id, ua:r[id].ua, ok:r[id].ok, ts:r[id].ts}));
}
function sessionScopedAnswers() {
  return (quizState && quizState.mode === 'exam') ? sessionResults() : getAnswers();
}

function recordAnswer(qId, userAnswer, isCorrect) {
  const answers = getAnswers();
  answers.push({id:qId,ua:userAnswer,ok:isCorrect,ts:Date.now()});
  setAnswers(answers);
  const wrong = getWrong();
  const idx = wrong.findIndex(w=>w.id===qId);
  if(!isCorrect) {
    if(idx>=0) { wrong[idx].count++; wrong[idx].last=Date.now(); }
    else { wrong.push({id:qId,count:1,last:Date.now(),mastered:false}); }
  }
  setWrong(wrong);
}

function markMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=true;
  setWrong(wrong);
}
function unmarkMastered(qId) {
  const wrong = getWrong();
  const w = wrong.find(x=>x.id===qId);
  if(w) w.mastered=false;
  setWrong(wrong);
}
function removeWrong(qId) {
  setWrong(getWrong().filter(x=>x.id!==qId));
}

/* ================================================================
   ===================== 辅助函数 =================================
   ================================================================ */
const DOMAIN_NAMES = META.domains || {};
const DOMAIN_WEIGHTS = META.weights || {};
const DOMAIN_KEYS = Object.keys(DOMAIN_NAMES).map(Number).sort((a,b)=>a-b);
const EXAM_P = META.examParams || {};
const EXAM_COUNT = EXAM_P.count || 50;
const EXAM_MIN = EXAM_P.minutes || 60;
const EXAM_PASS = EXAM_P.pass || 700;
const TYPE_NAMES = {single:'单选题',multiple:'多选题',hot:'拖拽题'};

function getQById(id) { return QUESTIONS.find(q=>q.id===id); }
function shuffle(arr) { const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function generateShuffledOptions(questions) {
  const opts = {};
  const newAnswers = {};
  questions.forEach(q => {
    if(q.t==='single'||q.t==='multiple') {
      const shuffled = shuffle([...q.o]);
      const labels = 'ABCDEFGHIJ';
      const relabeled = shuffled.map((item, i) => ({l: labels[i], t: item.t}));
      opts[q.id] = relabeled;
      const contentToNewLabel = {};
      relabeled.forEach(item => { contentToNewLabel[item.t] = item.l; });
      newAnswers[q.id] = q.a.map(oldL => {
        const oldItem = q.o.find(o => o.l === oldL);
        return oldItem ? contentToNewLabel[oldItem.t] : oldL;
      });
    }
  });
  return { opts, newAnswers };
}

function getStats() {
  const answers = getAnswers();
  const wrong = getWrong();
  const totalCorrect = answers.filter(a=>a.ok).length;
  const totalAnswered = answers.length;
  const acc = totalAnswered ? Math.round(totalCorrect/totalAnswered*100) : 0;
  const doneIds = [...new Set(answers.map(a=>a.id))];
  const completion = Math.round(doneIds.length/QUESTIONS.length*100);
  const domainStats = {};
  for(const d of DOMAIN_KEYS) {
    const dQIds = QUESTIONS.filter(q=>q.d===d).map(q=>q.id);
    const dAnswers = answers.filter(a=>dQIds.includes(a.id));
    const dCorrect = dAnswers.filter(a=>a.ok).length;
    const dTotal = dAnswers.length;
    domainStats[d] = {
      total:dQIds.length, answered:dTotal, correct:dCorrect,
      acc: dTotal ? Math.round(dCorrect/dTotal*100) : 0
    };
  }
  const typeStats = {};
  for(const t of ['single','multiple']) {
    const tQIds = QUESTIONS.filter(q=>q.t===t).map(q=>q.id);
    const tAnswers = answers.filter(a=>tQIds.includes(a.id));
    const tCorrect = tAnswers.filter(a=>a.ok).length;
    const tTotal = tAnswers.length;
    typeStats[t] = { answered:tTotal, correct:tCorrect, acc: tTotal ? Math.round(tCorrect/tTotal*100) : 0 };
  }
  const recentWrong = wrong.filter(w=>!w.mastered).sort((a,b)=>b.last-a.last).slice(0,5);
  const recent = answers.slice(-20).reverse();
  let streak = 0;
  for(const a of recent) { if(a.ok) streak++; else break; }
  return {totalCorrect,totalAnswered,acc,completion,domainStats,typeStats,recentWrong,streak,doneIds:doneIds.length};
}

function renderQuiz() {
  const el = document.getElementById('page-quiz');
  if(!quizState || !quizState.questions.length) {
    el.innerHTML = `<div class="header"><button class="back-btn" onclick="navigate('dashboard')">←</button><h1>刷题</h1></div>
    <p style="text-align:center;margin-top:60px;color:var(--text2)">暂无题目，请从仪表盘选择模式开始练习</p>`;

  }
  const q = quizState.questions[quizState.currentIdx];
  const isHot = q.t === 'hot';
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  // 考核=仅本场作答；练习模式=全局历史（含本场）——防练习记录串进考核视图
  const answers = sessionScopedAnswers();
  const prevAnswers = answers.filter(a=>a.id===q.id);
  const everCorrect = prevAnswers.some(a=>a.ok);
  const everWrong = prevAnswers.some(a=>!a.ok);
  const answered = quizState.answered || {};
  let userAns = answered[q.id];
  const finished = quizState.submitted && quizState.submitted[q.id];
  const correct = finished && isAnswerCorrect(q, userAns);

  let modeLabel = quizState.mode==='exam'?'📋 模拟考核':quizState.mode==='wrong'?'❌ 错题重练':quizState.mode==='domain'?'📖 章节练习':quizState.mode==='single'?'📝 单题练习':'📝 顺序练习';

  let html = `<div class="quiz-header">
    <button class="back-btn" onclick="exitQuiz()">←</button>
    <span style="font-weight:600;font-size:15px">${modeLabel}</span>
    ${quizState.mode==='exam'?`<span class="timer" id="quizTimer"></span>`:''}
    <span class="quiz-progress">${quizState.currentIdx+1}/${quizState.questions.length}</span>
  </div>`;
  html += `<div class="quiz-meta">
    <span class="domain-tag">Domain ${q.d}</span>
    <span>${DOMAIN_NAMES[q.d]}</span>
    <span>${TYPE_NAMES[q.t]}</span>
    ${everCorrect?'<span style="background:rgba(6,214,160,.15);color:var(--correct)">已答对</span>':''}
    ${everWrong?'<span style="background:rgba(239,71,111,.15);color:var(--wrong)">曾答错</span>':''}
  </div>`;
  html += `<div class="question-text">${q.q}</div>`;

  const renderOpts = getOptionsHTML(q, userAns, finished, correct, getShuffledAnswer(q));
  html += renderOpts;

  if(isHot) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?'▶ 完成返回':'▶ 下一题'}</button>
    </div>`;
  } else if(!finished) {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>✅ 确认</button>
    </div>`;
  } else {
    html += `<div class="quiz-buttons">
      <button class="btn-secondary" onclick="prevQuestion()" ${quizState.currentIdx===0?'disabled':''}>◀ 上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">${isLast?(quizState.mode==='exam'?'📊 交卷查看成绩':'▶ 完成返回'):'▶ 下一题'}</button>
    </div>`;
  }

  if(finished) {
    const badge = correct ? '✅ 回答正确!' : '❌ 回答错误';
    const cls = correct ? 'correct' : 'wrong';
    const gItems = getGlossaryForQuestion(q);
    let gHtml = '';
    if(gItems.length) {
      gHtml = '<div class="glossary"><div class="glossary-title">词汇附录</div>';
      gItems.forEach(g => {
        gHtml += '<div class="glossary-item"><span class="glossary-term">' + g.term + '</span><span class="glossary-def">\u00a0\u2014\u00a0' + g.def.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span></div>';
      });
      gHtml += '</div>';
    }
    html += `<div class="explanation show">
      <div class="result-badge ${cls}">${badge}</div>

    const qAnswers = answers.filter(a=>a.id===qq.id);

    let cls = '';
    if(i===quizState.currentIdx) cls='current';
    else if(qCor) cls='done-correct';
    else if(qWro) cls='done-wrong';
    html += `<div class="qnav-item ${cls}" onclick="jumpToQuestion(${i})">${i+1}</div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;

}

function getOptionsHTML(q, userAns, finished, correct, shuffledAns) {
  let html = '';
  const qtype = q.t;
  if(qtype === 'hot') {
    html += `<div class="options-list" style="background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:16px">
      <div style="font-weight:600;color:var(--primary);margin-bottom:8px">🖱 本题为拖拽/操作题（HOTSPOT）</div>
      <div style="font-size:13px;line-height:1.7;color:var(--text2)">本题无标准 A/B/C/D 选项，答题形式为图形拖拽/区域选择。题目与图形见源 PDF 原图，答案请参照源文件。</div>`;
    if(q.e) {
      html += `<div style="margin-top:10px;font-size:13px;line-height:1.7;color:var(--text2);border-top:1px solid var(--border);padding-top:10px"><strong>解析/提示：</strong><br>${highlightGlossaryTerms(q.e)}</div>`;
    }
    html += `</div>`;
    return html;
  }
  if(qtype === 'single' || qtype === 'multiple') {
    const isMulti = qtype === 'multiple';
    html += `<div class="options-list">`;
    const opts = quizState.shuffledOptions && quizState.shuffledOptions[q.id] ? quizState.shuffledOptions[q.id] : q.o;
    opts.forEach(o => {
      const isSelected = userAns && userAns.includes(o.l);
      let cls = 'option-item';
      if(isMulti) cls += ' multi';
      if(isSelected && !finished) cls += ' selected';
      if(finished) {
        if(shuffledAns.includes(o.l)) cls += ' correct';
        else if(isSelected) cls += ' wrong';
      }
      const onclick = finished ? '' : `toggleOption('${o.l}')`;
      html += `<div class="${cls}" onclick="${onclick}">
        <span class="opt-label">${o.l}</span>
        <span>${o.t}</span>
      </div>`;
    });
    html += `</div>`;
    if(isMulti && !finished) html += `<div style="font-size:13px;color:var(--text2);margin-top:-12px;margin-bottom:16px">多选——请选择所有正确答案后提交（至少选2项）</div>`;
  }
  return html;
}

/* ================================================================
   ===================== 交互逻辑 =================================
   ================================================================ */

function toggleOption(label) {
  const q = quizState.questions[quizState.currentIdx];
  if(!quizState.answered) quizState.answered = {};
  if(q.t==='single') {
    quizState.answered[q.id] = [label];
  } else {
    const arr = quizState.answered[q.id] || [];
    const idx = arr.indexOf(label);
    if(idx>=0) arr.splice(idx,1);
    else arr.push(label);
    quizState.answered[q.id] = arr;
  }
  renderQuiz();
}

function updateSubmitButton() {
  const q = quizState.questions[quizState.currentIdx];
  if(q.t === 'hot') return;
  const ans = quizState.answered && quizState.answered[q.id];
  const btn = document.getElementById('submitBtn');
  if(!btn) return;
  if(q.t==='single') btn.disabled = !ans || !ans.length;
  else if(q.t==='multiple') btn.disabled = !ans || ans.length < 2;
}

function getShuffledAnswer(q) {
  if(quizState && quizState.shuffledAnswers && quizState.shuffledAnswers[q.id]) {
    return quizState.shuffledAnswers[q.id];
  }
  return q.a;
}

function isAnswerCorrect(q, userAns) {
  if(!userAns) return false;
  const ca = getShuffledAnswer(q);
  if(q.t==='single') return userAns[0]===ca[0];
  if(q.t==='multiple') { const a=[...userAns].sort(); const b=[...ca].sort(); return JSON.stringify(a)===JSON.stringify(b); }
  return false;
}

function formatAnswer(q) {
  const ca = getShuffledAnswer(q);
  if(q.t==='single'||q.t==='multiple') return ca.join(', ');
  if(q.t==='hot') return '本题为拖拽/操作题，答案为图形区域匹配，见源 PDF 原图';
  return '';
}

function submitAnswer() {
  const q = quizState.questions[quizState.currentIdx];
  let userAns = quizState.answered && quizState.answered[q.id];
  if(!userAns) return;
  if(q.t==='multiple' && userAns.length < 2) {
    alert('多选题至少选择2个答案，当前只选了' + userAns.length + '个');
    return;
  }
  const correct = isAnswerCorrect(q, userAns);
  if(!quizState.submitted) quizState.submitted={};
  quizState.submitted[q.id]=true;
  // 本场作答留痕（考核判分唯一依据；不与全局统计混用）
  if(!quizState.results) quizState.results={};
  quizState.results[q.id]={ua:[...userAns], ok:correct, ts:Date.now()};
  recordAnswer(q.id, userAns, correct);
  renderQuiz();
  updateSubmitButton();
}

function prevQuestion() {
  if(quizState.currentIdx > 0) { quizState.currentIdx--; renderQuiz(); }
}
function nextQuestion() {
  const isLast = quizState.currentIdx === quizState.questions.length-1;
  if(isLast) {
    if(quizState.mode==='exam') renderExamResult();
    else navigate('dashboard');
  } else {
    quizState.currentIdx++;
    renderQuiz();
  }
}
function jumpToQuestion(idx) {
  quizState.currentIdx = idx;
  renderQuiz();
}
function exitQuiz() {
  // 考核中途退出必须停表：否则过期计时器归零时会把之后的练习页改写成「考核成绩单」
  if(quizState && quizState.mode==='exam') stopExamTimer();
  if(quizState && quizState.mode!=='exam') {
    setProgress({mode:quizState.mode,domain:quizState.domain||null,idx:quizState.currentIdx,time:Date.now()});
  }
  quizState = null;
  navigate('dashboard');
}

/* ================================================================
   ===================== 刷题模式启动 ==============================
   ================================================================ */
function startDomain(d) {
  const qs = QUESTIONS.filter(q=>q.d===d);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'domain',domain:d,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startContinue() {
  const p = getProgress();
  if(p.mode && p.mode!=='exam') {
    if(p.mode==='domain' && p.domain) {
      const qs = QUESTIONS.filter(q=>q.d===p.domain);
      const _sr=generateShuffledOptions(qs);
      quizState = {mode:'domain',domain:p.domain,questions:qs,currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    } else {
      const _sr=generateShuffledOptions([...QUESTIONS]);
      quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:p.idx||0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
    }
  } else {
    const _sr=generateShuffledOptions([...QUESTIONS]);
    quizState = {mode:'sequential',domain:null,questions:[...QUESTIONS],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  }
  navigate('quiz');
}
function startWrongReview() {
  const wrong = getWrong().filter(w=>!w.mastered);
  if(!wrong.length) { alert('暂无错题需要复习！'); return; }
  const qs = wrong.map(w=>getQById(w.id)).filter(Boolean);
  const _sr=generateShuffledOptions(qs);
  quizState = {mode:'wrong',domain:null,questions:qs,currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startSingle(id) {
  const q = getQById(id);
  if(!q) return;
  const _sr=generateShuffledOptions([q]);
  quizState = {mode:'single',domain:null,questions:[q],currentIdx:0,answered:{},submitted:{},shuffledOptions:_sr.opts,shuffledAnswers:_sr.newAnswers};
  navigate('quiz');
}
function startExam() {
  // 模拟考核：按 meta 权重 × meta 题数分配各域配额（最大余数法，保证总和=EXAM_COUNT）
  const counts = {};
  let sumInt = 0;
  const raw = {}, rem = {};
  DOMAIN_KEYS.forEach(k => {
    const w = parseFloat(String(DOMAIN_WEIGHTS[k]||'0').replace('%',''))/100;
    raw[k] = w * EXAM_COUNT;
    counts[k] = Math.floor(raw[k]);
    rem[k] = raw[k] - counts[k];
    sumInt += counts[k];
  });
  let deficit = EXAM_COUNT - sumInt;
  const order = [...DOMAIN_KEYS].sort((a,b)=>rem[b]-rem[a]);
  let i = 0;
  while(deficit > 0) { counts[order[i % order.length]]++; deficit--; i++; }
  let selected = [];
  DOMAIN_KEYS.forEach(d => {
    const pool = shuffle(QUESTIONS.filter(q=>q.d===d && q.t!=='hot'));
    selected.push(...pool.slice(0, counts[d]));
  });
  selected = shuffle(selected);
  const _exam = generateShuffledOptions(selected);
  quizState = {mode:'exam',domain:null,questions:selected,currentIdx:0,answered:{},submitted:{},results:{},shuffledOptions:_exam.opts,shuffledAnswers:_exam.newAnswers};
  quizState.examStartTime = Date.now();
  quizState.examDuration = EXAM_MIN * 60;
  // 场次标识：计时回调据此判定「本场是否仍在进行」，防过期计时器串场
  quizState.examToken = 'ex-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  navigate('quiz');
  startExamTimer();
}

let examTimerInterval = null;
function stopExamTimer() {
  if(examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
}
function startExamTimer() {
  let secs = quizState.examDuration;
  const token = quizState.examToken;
  const timerEl = document.getElementById('quizTimer');
  if(!timerEl) return;
  stopExamTimer();
  examTimerInterval = setInterval(() => {
    // 场次校验：已退出或已换场（新 token）立即自毁
    if(!quizState || quizState.mode!=='exam' || quizState.examToken!==token) { stopExamTimer(); return; }
    secs--;
    const m = Math.floor(secs/60), s = secs%60;
    const el = document.getElementById('quizTimer');
    if(el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if(secs<=60 && el) el.classList.add('warning');
    if(secs<=0) { stopExamTimer(); finishExam(token); }
  }, 1000);
}

function finishExam(token) {
  stopExamTimer();
  // 只对「发起本场计时」的考核会话生效
  if(quizState && quizState.mode==='exam' && (token===undefined || quizState.examToken===token)) renderExamResult();
}

function renderExamResult() {
  if(!quizState) return;
  stopExamTimer();
  const qs = quizState.questions;
  const results = quizState.results || {};
  const total = qs.length;
  // 逐题按本场作答判分；全局历史与往场作答一律不计
  let correct = 0, wrong = 0, unanswered = 0;
  const domStat = {};
  DOMAIN_KEYS.forEach(d => domStat[d] = {n:0, cor:0});
  qs.forEach(q => {
    if(!domStat[q.d]) domStat[q.d] = {n:0, cor:0};
    domStat[q.d].n++;
    const r = results[q.id];
    if(!r) unanswered++;
    else if(r.ok) { correct++; domStat[q.d].cor++; }
    else wrong++;
  });
  // 不变量自校验：正确 + 错误 + 未答 必须等于试卷题数
  if(correct + wrong + unanswered !== total) console.warn('[exam] 判分不变量异常', {correct, wrong, unanswered, total});
  const el = document.getElementById('page-quiz');
  const pct = total ? Math.round(correct/total*100) : 0;
  // 1000-point scale, 700 to pass
  const scaledScore = total ? Math.round(correct/total*1000) : 0;
  const passed = scaledScore >= EXAM_PASS;
  // Time used
  const timeUsed = quizState.examStartTime ? Math.round((Date.now()-quizState.examStartTime)/1000) : 0;
  const timeM = Math.floor(timeUsed/60), timeS = timeUsed%60;

  // Domain breakdown
  let domainHtml = '';
  for(const d of DOMAIN_KEYS) {
    const dd = domStat[d] || {n:0, cor:0};
    const dPct = dd.n ? Math.round(dd.cor/dd.n*100) : 0;
    domainHtml += `<tr><td>Domain ${d}: ${DOMAIN_NAMES[d]}</td><td>${dd.n}</td><td>${dd.cor}</td><td style="color:${dPct>=70?'var(--correct)':'var(--wrong)'}">${dPct}%</td></tr>`;
  }

  el.innerHTML = `<div class="header"><button class="back-btn" onclick="exitExam()">←</button><h1>📋 考核成绩单</h1></div>
  <div style="text-align:center;padding:30px 20px">
    <div style="font-size:48px;font-weight:700;color:${passed?'var(--correct)':'var(--wrong)'}">${scaledScore}</div>
    <div style="font-size:14px;color:var(--text2);margin:4px 0">满分 1000 分 | 及格线 ${EXAM_PASS} 分</div>
    <div style="font-size:16px;color:var(--text);margin:12px 0;font-weight:600">${passed?'✅ 通过！':'❌ 未通过'}</div>
    <div style="display:flex;justify-content:center;gap:20px;margin:16px 0;flex-wrap:wrap">
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--correct)">${correct}</div><div style="font-size:12px;color:var(--text2)">正确</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--wrong)">${wrong}</div><div style="font-size:12px;color:var(--text2)">错误</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text2)">${unanswered}</div><div style="font-size:12px;color:var(--text2)">未答</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--primary)">${pct}%</div><div style="font-size:12px;color:var(--text2)">正确率</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:var(--text)">${timeM}分${timeS.toString().padStart(2,'0')}秒</div><div style="font-size:12px;color:var(--text2)">用时</div></div>
    </div>
  </div>
  <div class="stats-chart">
    <h3>各章节成绩</h3>
    <table class="stats-table"><thead><tr><th>章节</th><th>题数</th><th>正确</th><th>正确率</th></tr></thead><tbody>
    ${domainHtml}
    </tbody></table>
  </div>
  <div style="text-align:center;padding:20px">
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn-secondary" onclick="exitExam()" style="width:auto">返回首页</button>
      <button class="btn-primary" onclick="startExam()" style="width:auto;flex:none">再考一次</button>
    </div>
  </div>`;
  quizState = null;
}

function exitExam() {
  quizState = null;
  navigate('dashboard');
}

function drawDomainChart(s) {
  const c = document.getElementById('chartDomain');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = DOMAIN_KEYS.map(k=>'D'+k);
  const colors = ['#4361ee','#4cc9f0','#06d6a0','#f8961e','#9b5de5'];
  const barW = (W-80) / (labels.length*1.5);
  labels.forEach((l,i)=>{
    const val = s.domainStats[i+1].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(l, x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

function drawTypeChart(s) {
  const c = document.getElementById('chartType');
  if(!c) return;
  const ctx = c.getContext('2d');
  const W = c.offsetWidth || 600;
  const H = 200;
  c.width = W * 2; c.height = H * 2;
  ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const labels = ['单选','多选'];
  const keys = ['single','multiple'];
  const colors = ['#4361ee','#4cc9f0'];
  const barW = (W-80) / 4;
  keys.forEach((k,i)=>{
    const val = s.typeStats[k].acc || 0;
    const x = 40 + barW * (i*1.5 + 0.5);
    const h = (val/100) * (H-50);
    ctx.fillStyle = colors[i];
    ctx.beginPath();
    ctx.roundRect(x-barW/2+2, H-30-h, barW-4, h, 4);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.getElementById('quizView')).getPropertyValue('--text').trim();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x, H-8);
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(val+'%', x, H-35-h);
  });
}

/* roundRect polyfill */
if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(r>w/2) r=w/2;
    if(r>h/2) r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    return this;
  };
}

function exportData() {
  const data = {
    answers: getAnswers(),
    wrong: getWrong(),
    progress: getProgress(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${LS_PREFIX}-quiz-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.answers) setAnswers(data.answers);
        if(data.wrong) setWrong(data.wrong);
        if(data.progress) setProgress(data.progress);
        alert('数据导入成功！');
        navigate(currentPage);
      } catch(err) { alert('数据格式错误，请检查文件。'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

  showModal('确认重置', '确定要清除所有答题记录、错题集和进度吗？此操作不可恢复！', () => {
    localStorage.removeItem(LS_ANSWERS);
    localStorage.removeItem(LS_WRONG);
    localStorage.removeItem(LS_PROGRESS);
    navigate('dashboard');

}

题"}]},"chapters":[{"domain":1,"name":"基础模型集成、数据管理与合规性","weight":"31%","syllabusFile":"syllabus/aip-c01-kb-domain1.md","practiceCount":12,"practice":[{"id":"D1-001","d":1,"t":"单选","q":"一家媒体公司需要对 50TB 的视频转录文本实现 RAG，并支持实时更新。哪种方法能提供最佳性能？","o":[{"l":"A","t":"Amazon Bedrock Knowledge Bases 配合增量同步和 OpenSearch Serverless"},{"l":"B","t":"使用 SageMaker Processing 作业和 Amazon Neptune 的自定义管道"},{"l":"C","t":"使用 Kinesis Data Streams 和 DynamoDB 向量存储的实时流式处理"},{"l":"D","t":"使用 AWS Glue 和自管理 Elasticsearch 的批处理"}],"a":"A","e":"Bedrock Knowledge Bases 的增量同步原生支持实时更新能力，OpenSearch Serverless 可大规模处理向量搜索，且无需管理底层基础设施。","src":1},{"id":"D1-002","d":1,"t":"单选","q":"你的 RAG 系统需要处理 15 种语言的文档，并支持按语言检索。哪种嵌入策略最佳？","o":[{"l":"A","t":"使用单一多语言嵌入模型，配合语言元数据过滤"},{"l":"B","t":"使用按语言区分的嵌入模型，每种语言使用独立的向量索引"},{"l":"C","t":"先翻译成英文再嵌入，并追踪源语言"},{"l":"D","t":"使用 Multilingual BERT 进行跨语言对齐和统一搜索"}],"a":"B","e":"按语言使用独立模型和独立索引，可避免多语言模型或翻译方法带来的质量损失，每种语言的检索准确率最高。","src":2},{"id":"D1-003","d":1,"t":"单选","q":"一家律师事务所要求 RAG 在 EU 区域内实现严格的数据驻留，并为所有查询提供审计追踪。哪种配置满足这些要求？","o":[{"l":"A","t":"在 eu-west-1 部署 Bedrock Knowledge Bases，配合 CloudTrail 和 VPC 端点"},{"l":"B","t":"在 eu-central-1 使用自管理方案和自定义审计日志"},{"l":"C","t":"多区域部署，带数据复制和集中式日志"},{"l":"D","t":"在 us-east-1 使用 Bedrock，带数据加密和访问日志"}],"a":"A","e":"Bedrock 部署在 EU 区域满足数据驻留要求；CloudTrail 提供审计追踪；VPC 端点确保私有网络访问，数据不离开该区域。","src":3},{"id":"D1-004","d":1,"t":"单选","q":"你的分块（chunking）策略在不同文档类型（PDF、Word、HTML）之间产生不一致的结果。哪种方法是最优的？","o":[{"l":"A","t":"按文档类型定制分块，统一生成嵌入"},{"l":"B","t":"基于内容结构的语义分块，不依赖文档格式"},{"l":"C","t":"固定大小分块，按文档类型调整重叠"},{"l":"D","t":"层级分块，带父子关系和元数据"}],"a":"B","e":"语义分块关注语义边界而非格式特定规则，无论源文档类型如何都能提供一致的结果。","src":4},{"id":"D1-005","d":1,"t":"单选","q":"一个 RAG 系统出现 40% 的不相关检索结果。当前配置使用 512-token 块和 50-token 重叠。哪种优化能带来最大改进？","o":[{"l":"A","t":"将块大小增加到 1024 token，重叠减少到 25 token"},{"l":"B","t":"实现语义分块并保留句子边界"},{"l":"C","t":"添加元数据丰富化和混合搜索（语义+关键词匹配）"},{"l":"D","t":"改用更小的块（256 token）并增加重叠（100 token）"}],"a":"C","e":"混合搜索结合语义和关键词匹配，配合元数据丰富化，通过多个相关性信号提高了精度，从根本上解决检索不相关问题。","src":5},{"id":"D1-006","d":1,"t":"单选","q":"你需要为包含复杂图表和代码片段的技术文档实现 RAG。哪种方法最适合处理多模态内容？","o":[{"l":"A","t":"仅提取文本，使用传统 RAG 并配合代码语法高亮"},{"l":"B","t":"使用 Amazon Bedrock Data Automation 配合 Nova 模型进行统一处理"},{"l":"C","t":"对文本、图像和代码分别处理，并建立交叉引用"},{"l":"D","t":"使用 Amazon Textract 的自定义 OCR 管道和手动内容关联"}],"a":"B","e":"Bedrock Data Automation 配合 Nova 模型原生支持多模态理解，在统一管道中处理文本、图像和代码，无需自定义集成。","src":6},{"id":"D1-007","d":1,"t":"单选","q":"一个金融服务 RAG 系统需要维护监管文档的版本控制，并支持历史查询。哪种架构支持此需求？","o":[{"l":"A","t":"带版本控制的 S3 存储桶，配合基于时间戳的 Knowledge Base 配置"},{"l":"B","t":"基于 Git 的文档管理，自动更新 Knowledge Base"},{"l":"C","t":"Knowledge Bases 中的文档版本管理，带时间查询参数"},{"l":"D","t":"每个文档版本使用独立的 Knowledge Base，统一查询接口"}],"a":"A","e":"S3 版本控制配合基于时间戳的 KB 配置，原生提供版本控制能力，并可针对特定文档版本进行查询。","src":7},{"id":"D1-008","d":1,"t":"单选","q":"你的 RAG 检索延迟在 1000 万文档语料上平均为 3 秒。哪种优化能显著降低延迟？","o":[{"l":"A","t":"实现近似最近邻搜索，降低精度"},{"l":"B","t":"为频繁访问的嵌入添加 Redis 缓存层"},{"l":"C","t":"优化向量数据库配置并增加计算资源"},{"l":"D","t":"为常见查询模式预先计算并缓存嵌入"}],"a":"D","e":"预计算常见查询的嵌入可完全省去嵌入生成步骤，为高频模式提供最大的延迟降低。","src":8},{"id":"D1-009","d":1,"t":"单选","q":"一个医疗保健 RAG 系统需要处理患者记录，并严格符合 HIPAA 合规要求。哪种数据处理方法确保合规？","o":[{"l":"A","t":"本地处理，通过加密传输到 Bedrock"},{"l":"B","t":"在专用 VPC 中使用 AWS PrivateLink 连接 Bedrock，并进行静态加密"},{"l":"C","t":"处理前进行数据匿名化，并维护审计追踪"},{"l":"D","t":"混合方案：仅在本地处理敏感数据"}],"a":"B","e":"PrivateLink 确保数据不经过公共互联网；专用 VPC 提供网络隔离；静态加密满足 AWS 内的 HIPAA 要求。","src":9},{"id":"D1-010","d":1,"t":"单选","q":"你正在为多租户 SaaS 应用实现 RAG。每个租户需要隔离的数据访问。哪种架构提供安全的租户隔离？","o":[{"l":"A","t":"单一 Knowledge Base，配合租户特定元数据过滤"},{"l":"B","t":"每个租户独立的 Knowledge Base，配合 IAM 访问控制"},{"l":"C","t":"共享 Knowledge Base，应用层访问控制"},{"l":"D","t":"租户特定 S3 桶，配合统一 Knowledge Base 和行级安全"}],"a":"B","e":"独立 Knowledge Base 配合 IAM 提供最强的隔离保证，从基础设施层面防止跨租户数据泄漏。","src":10},{"id":"D1-011","d":1,"t":"单选","q":"你的向量数据库在对超过 1 亿个嵌入进行相似性搜索时性能下降。哪种优化策略最有效？","o":[{"l":"A","t":"实现分层可导航小世界（HNSW）索引"},{"l":"B","t":"使用乘积量化降低嵌入维度"},{"l":"C","t":"按内容类型分区向量，并行执行搜索"},{"l":"D","t":"实现局部敏感哈希（LSH）进行近似搜索"}],"a":"A","e":"HNSW 在搜索速度和召回质量之间提供了最佳平衡，通过多层图结构在 1 亿+向量下仍能保持高精度。","src":11},{"id":"D1-012","d":1,"t":"单选","q":"一个 RAG 系统需要同时支持语义搜索和关键词搜索，并融合结果。哪种实现提供最佳相关性？","o":[{"l":"A","t":"独立的向量和关键词索引，加权组合得分"},{"l":"B","t":"同时编码语义和词法信息的混合嵌入"},{"l":"C","t":"并行搜索，基于机器学习进行结果排序"},{"l":"D","t":"顺序搜索，按关键词相关性过滤语义结果"}],"a":"A","e":"独立索引配合加权得分融合（如 Reciprocal Rank Fusion）允许对每种搜索类型独立优化，同时结合其优势。","src":12}],"sections":[{"h":"分析需求并设计 GenAI 解决方案","body":"这一域讲的是「把 GenAI 应用搭起来」的地基工作，从需求分析一路到提示词治理，中间穿过模型选型、数据处理、向量存储、检索机制四道关口。\n\n**为什么它权重最高？** 因为 GenAI 应用出问题，绝大多数时候不是败在算法上，而是败在这六件事里的某一件：模型选错了、喂进去的数据没洗、向量库检索不出正确内容、提示词没人管。域 2（实施与集成）和域 3（安全与治理）都是在这层地基上盖的楼——地基歪了，上面怎么修都没用。所以官方把将近三分之一的分数押在这里。\n\n**它和 AIF-C01（基础级）的根本差别在哪？** AIF 会问「RAG 是什么」，答出定义就能得分；AIP 不会这么问。AIP 的问法是「给定这样一个业务场景，你的 RAG 架构该怎么设计，为什么这么设计，代价是什么」。也就是说，这一域**不满足于你认识这些组件，它要你能做技术决策**。同一个技术点，能说出「它是什么」只够答对干扰项，能说出「什么时候该用它、什么时候不该」才够答对正确项。\n\n**学这一域时建议抓住一条主线**：把每个知识点都往「我会怎么选」上靠。看到一个服务或技术，习惯性地问自己三句话——它解决什么问题？什么场景该用它？用它要付出什么代价？这三问，正是本域最高频的考法。\n\n> 📌 **本域内部还有一个学习顺序建议**：先看 1.1（怎么设计），再看 1.2（怎么选模型），然后 1.3→1.4→1.5 是一条数据流线（数据进来 → 存进向量库 → 被检索出来），最后 1.6 处理交互层。按这个顺序读，后面的任务会不断用到前面的概念。\n\n---\n\n#### 本节定位\n本节对应考纲任务声明 1.1「分析需求并设计 GenAI 解决方案」。\n\n> 官方原名：Analyze requirements and design GenAI solutions.\n\n这个任务考的是动手之前的功夫——把问题想清楚再写代码。三个技能点对应三个层次：整体怎么设计、怎么小步验证、怎么沉淀成可复用的东西。\n\n#### 创建与特定业务需求和技术约束相匹配的全面架构设计\n\n**这条在问什么。** 官方给的三个例子（合适的基础模型、集成模式、部署策略）其实就是架构设计必须回答的三个问题：\n\n1. **用哪个模型？** —— 不是「哪个最强」，而是「哪个最匹配这个任务」。任务类型（摘要、对话、代码生成、分类）、成本预算、延迟要求、语言支持，四项一起看。\n2. **模型怎么接进业务流？** —— 这条决定了后面一半的工作量。常见四种集成模式：**提示工程**（最简单，只改输入）、**RAG**（检索增强生成，让模型能读到你的私有资料）、**智能体（Agent）**（让模型能自己调工具、分步完成任务）、**微调（Fine-tuning）**（拿你的数据改造模型的「脾气」）。选择依据是：知识要不要更新得快（要→RAG）、任务要不要多步推理和调用外部系统（要→Agent）、模型的输出风格和领域术语要不要高度统一（要→微调）。\n3. **模型跑在哪里？** —— 托管 API（如 Amazon Bedrock）还是自建端点（如 SageMaker AI）。托管省事、按量付费、无需运维；自建可控、可深度定制、但你要管 GPU 和扩缩容。\n\n**取舍判断（这是考试最容易出题的地方）。** 这四种集成模式不是替代关系，而是**成本与复杂度的递进**：提示工程零额外基础设施，但模型对你的私有知识一无所知；RAG 增加一套向量存储和检索链路，换来「知识可更新、答案可溯源」；Agent 再增加工具定义和执行编排，换来「能办事而不只是会说话」；微调最重，要先准备标注数据、跑训练、管版本，换来的是「风格稳定、指令跟随好」。考试里典型的问法是「某团队需要 XX，且希望最低成本/最快上线，应该选哪种」——**答案往往是把最轻的那层用足，而不是一上来就微调**。\n\n**关联服务**：Amazon Bedrock（快速验证集成模式）、Amazon SageMaker AI（自建端点与微调）、AWS Well-Architected Framework（架构评审基准）。\n\n#### 案例\n一家做设备维保的公司想把三千份维修手册变成「能问答的助手」。工程师提问「XX 型号液压泵异响，先查什么」。这里第一步不该是选模型，而是先判断集成模式——手册内容会更新（每月新增），且要求答案能指回具体手册页码，所以直接锁定 RAG，而不是微调；模型用托管 API 即可，没有自建 GPU 集群的必要。把这个判断写清楚，架构设计就完成了一半。\n\n#### 在进入全规模部署前，开发技术概念验证（POC）实现\n\n**这条在问什么。** POC（Proof of Concept，概念验证）是用最小代价回答「这条路走不走得通」。官方点出了它的三个验证目标：可行性、性能特征、业务价值。\n\n- **可行性**：模型能不能完成这个任务？给几段真实输入，看输出质量是否达到可用门槛。\n- **性能特征**：延迟多少？每千次调用花多少钱？并发上去以后会不会退化？\n- **业务价值**：省下的工时、提升的准确率，能不能折算成钱，值不值得投。\n\n**最容易做错的地方（也是考点）。** 很多人做 POC 用一堆人造的「漂亮样本」，跑出来效果很好，一上生产就崩。官方明确指向用 Amazon Bedrock 这类服务快速搭 POC，但**关键纪律是用真实数据、小规模**：几十条真实工单，比几百条编造的样本有价值得多。另一个纪律是**先定验收标准再做**——准确率要达到多少、延迟上限是多少、单次成本上限是多少，写下来，跑完对着表看，而不是跑完凭感觉说「好像还行」。\n\n**取舍判断。** POC 的时间投入要匹配决策风险：如果这个方案一旦选定就要投几十万，那 POC 值得做扎实；如果只是试一个内部小工具的提示词效果，做个把小时的就够了。**别把 POC 做成「小规模的生产系统」**——那是常见的时间黑洞。\n\n**关联服务**：Amazon Bedrock（最快路径拿到模型调用能力，无需自建基础设施）。\n\n#### 创建标准化技术组件，确保跨多个部署场景的一致实施\n\n**这条在问什么。** POC 跑通之后，如果每个项目都从头搭一遍，团队会陷入重复劳动，而且质量参差。这条要求的是把验证过的做法沉淀成**可复用的标准件**：统一的模型调用封装、统一的提示词模板结构、统一的日志与评测流程。\n\n官方点了两个工具：**AWS Well-Architected Framework**（架构评审的六大支柱：卓越运营、安全性、可靠性、性能效率、成本优化、可持续性）和 **AWS WA Tool 的 Generative AI Lens**（针对 GenAI 场景的补充检查项，比如「你有没有评估过模型的幻觉风险」「提示词有没有版本管理」）。\n\n**为什么这条重要。** 它把「一个项目做成」升级成「组织能重复做成」。企业级考试喜欢考这种「从单点到规模化」的思维——因为真实的大公司确实会卡在这里：第一个 AI 应用做得挺好，第二个又要重新踩一遍坑。\n\n**取舍判断。** 标准化的时机很关键：**做成两三次之后再抽象，而不是第一次就设计一套框架**。一次性的经验抽取不出真正的共性，过早标准化反而会造出一套没人愿意用的「内部框架」。这条的考点往往落在「什么时候该沉淀」而不是「怎么沉淀」。\n\n**关联服务**：AWS Well-Architected Framework、AWS Well-Architected Tool（Generative AI Lens）。\n\n---","figures":[]},{"h":"选择并配置基础模型","body":"#### 本节定位\n本节对应考纲任务声明 1.2「选择并配置基础模型」。\n\n> 官方原名：Select and configure FMs.\n\n任务 1.1 定了「用什么模式」，任务 1.2 定「用哪个模型、怎么让它不容易挂」。四个技能点分别是：怎么选、怎么让换模型不改代码、怎么抗故障、怎么把定制模型管起来。\n\n#### 评估并选择基础模型\n\n**这条在问什么。** 官方给了三个评估维度：性能基准（performance benchmarks）、能力分析（capability analysis）、限制评估（limitation evaluation）。翻译成人话就是三张清单：\n\n| 维度 | 要问的问题 | 典型指标/考虑项 |\n|---|---|---|\n| **性能基准** | 这个模型在这个任务上表现如何？ | ROUGE / BLEU / BERTScore（自动评估指标）；更贴近实际的是「拿我的测试集跑分」 |\n| **能力分析** | 它支持我要的输入输出吗？ | 模态（文本/图像/音频/视频）、语言支持、上下文窗口大小 |\n| **限制评估** | 用它有什么硬约束？ | 合规与数据驻留要求、成本、延迟、可用区域 |\n\n**一个容易忽略的点**：这三个维度是**递进筛选**的关系，不是并列打分。先用「限制评估」做否决——如果数据不能出境，那这个模型再强也不能用；再用「能力分析」筛掉不支持的；最后才用「性能基准」在剩下的里面挑最好的。**先排除，再择优**，这个顺序能省掉大量无效对比。\n\n**关于自动指标要知道的一件事**：ROUGE、BLEU 这类指标衡量的是「生成文本和参考文本的字面重合度」，对摘要类任务有用，但对开放式问答、创意生成就不太靠得住。所以实践中更看重「用自己业务数据构造的评测集 + 人工或 LLM 打分」。考试考的是你知不知道这些指标**用在哪、什么时候不够用**，而不是背公式。\n\n**关联服务**：Amazon Bedrock（模型目录与评测）、Amazon Bedrock Model Evaluations。\n\n#### 案例\n某团队要在「成本敏感、只做中文合同要素抽取」的场景选模型。按递进筛选走一遍——限制评估：合同是客户机密，必须走已签约的合规通道，排除了几个第三方直连选项；能力分析：任务只需文本输入、输出结构化字段，不需要多模态，上下文窗口要求不高；性能基准：在两个候选模型上跑 200 条历史合同，看字段抽取准确率。最后选中的可能不是「排行榜第一名」，而是准确率够用、单价最低的那个——这就是匹配，而不是最强。\n\n#### 创建灵活架构模式：让换模型不用改代码\n\n**先说它解决什么问题。** 你今年选了个模型跑得挺好，明年出了更便宜更好的；或者客户是受监管行业，要求数据必须走某个特定模型。如果代码里到处都是写死的模型标识（比如直接调 `invoke_model` 时把模型 ID 硬编码在几十个地方），换一次模型就意味着全局搜索替换、回归测试、重新上线。这条考的就是**怎么把模型选择从「写死在代码里」变成「改一个配置就生效」**。\n\n**官方给的三个组件分别管什么：**\n\n- **Amazon API Gateway** —— 统一入口。所有调用都先到这里，业务代码不直接连模型，而是连自己的网关。网关后面挂什么模型，业务代码不关心。\n- **AWS Lambda** —— 执行体。把「组装请求 → 调模型 → 处理响应」这段逻辑放进函数，换模型只改这个函数。\n- **AWS AppConfig** —— 配置中心。模型名、参数、路由规则存这里。运行时动态读取，**改配置不用重新部署代码**。\n\n**这就是所谓的「模型抽象层（Model Abstraction Layer）」**：所有调用走统一接口，模型成为一个可替换的实现细节。\n\n**取舍判断。** 这层抽象不是白来的——多一个网关意味着多一跳延迟、多一份运维、多一处可能故障。所以：**预期会频繁换模型、或者要服务多个客户各用各的模型，就值得加这层；如果只是内部一个小工具、一年也不会换模型，硬编码反而更简单直接**。考试常在这里设陷阱：题目描述「团队需要快速支持新模型上线」，正确项是引入配置驱动的抽象层；但如果题目说「团队只有一个小型内部工具，追求最低复杂度」，那引入完整网关架构就是过度设计。\n\n**关联服务**：AWS Lambda、Amazon API Gateway、AWS AppConfig。\n\n#### 设计具备韧性的 AI 系统\n\n**这条在问什么。** 模型服务会不可用——区域故障、限流、模型临时下线，这些都会发生。韧性设计就是让「模型挂了」不等于「你的应用挂了」。官方点了四类手段：\n\n- **断路器模式（Circuit Breaker）**：用 AWS Step Functions 实现。当下游持续报错，自动「跳闸」停止继续调用，避免雪崩式重试把问题放大；过一段时间再放少量请求试探，恢复了就合闸。\n- **跨区域推理（Amazon Bedrock Cross-Region Inference）**：当某个模型在你所在区域没有部署，或者本区域容量紧张时，把请求路由到有容量的区域。这解决的是「模型区域可用性有限」这个很现实的问题。\n- **跨区域模型部署**：主动在多个区域部署，主区域故障时切到备用区域。\n- **优雅降级（Graceful Degradation）**：模型完全不可用时，返回缓存结果、返回预设的兜底话术，或者退到一个更小更稳的模型——总之不让用户看到报错页。\n\n**一个必须理解的权衡**：跨区域推理会引入额外的网络延迟，而且要考虑数据合规——请求被路由到另一个区域处理，那个区域的数据法规你得能接受。**韧性和合规、延迟、成本之间是要权衡的**，不是无脑开满。\n\n**关联服务**：AWS Step Functions（断路器编排）、Amazon Bedrock（Cross-Region Inference）、AWS Lambda。\n\n#### 案例\n某电商把 GenAI 用在商品问答上，大促当天流量翻十倍。没有韧性设计的版本会在模型限流时大面积报错，用户看到的是空白页；有韧性设计的版本会这样表现：主区域限流 → 自动路由到备用区域；备用区域也满 → 返回该商品的高频问答缓存；缓存没有 → 回退到「这个问题我暂时答不上来，帮你转人工」。**用户感受到的是「稍微慢一点」，而不是「坏了」**。\n\n#### 实施 FM 定制化部署与生命周期管理\n\n**这条在问什么。** 有些场景必须用「改造过的模型」——比如要让它稳定输出某个行业的术语体系，或者跟随特定的回复格式。这条覆盖从「怎么改造」到「改造完怎么管」的全过程。\n\n**先分清两种改造思路（这是本节最容易混的地方）：**\n\n- **微调（Fine-tuning）**：拿标注数据继续训练模型参数。效果好，但要数据、要算力、要重训。\n- **参数高效适配（PEFT）**：不动原模型大部分参数，只训练一小块附加结构。官网点名的 **LoRA（Low-Rank Adaptation，低秩适配）** 和 **适配器（Adapters）** 都是这一类。\n\n**为什么 PEFT 是主流做法？** 因为它把「定制」的成本降了一个数量级：要训练的参数量可能只有全量微调的千分之一到百分之一，所以更快、更便宜，而且**一个基础模型可以挂载多个适配器**——服务不同客户时切换适配器即可，不用为每个客户存一份完整模型。代价是效果上限通常不如全量微调。\n\n**模型管起来的部分（生命周期管理）**，官方点了几件事：用 **SageMaker Model Registry（模型注册表）** 管版本、用自动化管道做部署更新、准备**回滚策略**、以及**退役与替换**机制。\n\n**这几件事为什么被单独列出来考？** 因为「模型更新」在生产环境是个高风险动作。新版本可能在某些输入上表现更差，而你未必立刻发现。所以标准做法是：新版本先小流量灰度（canary）→ 观察指标 → 逐步放量 → 出问题能一键回滚到上一个版本。**没有回滚能力的模型更新，等于在走钢丝。**\n\n**取舍判断。** 什么时候值得定制模型？只有当「提示工程 + RAG 都用足了还是达不到要求」时才考虑。因为微调有长期维护成本——基础模型换代，你的微调版本可能就要重做。**先用最轻的手段，把定制留到确实需要的时候**。\n\n**关联服务**：Amazon SageMaker AI（模型部署与微调）、SageMaker Model Registry（版本管理）、Amazon Bedrock（自定义模型与托管）。\n\n---","figures":[]},{"h":"实施供 FM 使用的数据验证与处理管道","body":"#### 本节定位\n本节对应考纲任务声明 1.3「实施供 FM 使用的数据验证与处理管道」。\n\n> 官方原名：Implement data validation and processing pipelines for FM consumption.\n\n模型再好，喂进去的数据不对，输出就是错的。这个任务讲「数据从原始形态变成模型能吃的形态」这中间要做哪些事：验证、处理多模态、格式化、提质。\n\n#### 创建全面的数据验证工作流\n\n**这条在问什么。** 在数据进入模型之前，先确认它「合格」——完整、格式正确、没有明显缺失和异常。官方给了几个层次的手段：**AWS Glue Data Quality**（在数据管道里内建质量规则和监控）、**SageMaker Data Wrangler**（可视化数据准备与探查）、**自定义 Lambda 函数**（写自己的校验逻辑）、**CloudWatch 指标**（把质量指标当监控项持续盯）。\n\n**为什么不能跳过这一步。** 模型不会告诉你「你给的数据有问题」，它只会照着有问题的数据给出看起来很正常的错误答案。这类错误比报错更危险——**报错你能发现，静默的错误输出可能要等业务方投诉才知道**。所以数据验证的价值是把问题挡在进入模型之前。\n\n**实践中要建立的观念**：验证规则要能回答「什么算合格」。比如知识库文档，合格的定义可能包括：文件能解析出正文（不是扫描图片且没 OCR）、字符数不为零、语言符合预期、没有大量乱码。这些规则写下来、自动化跑，比人工抽查可靠。\n\n**关联服务**：AWS Glue Data Quality、SageMaker Data Wrangler、AWS Lambda、Amazon CloudWatch。\n\n#### 案例\n某公司把两千份历史项目文档灌进知识库做「项目经验助手」。上线后有人问「XX 项目的验收标准是什么」，助手回答得像模像样，但引用的是**另一份文档里的表格碎片**。排查后发现问题出在入库环节：其中有三百多份是扫描件，OCR 识别质量参差，产生了大量乱码和错行——这些脏数据被照常切分、照常转向量，检索时依然「语义相近」被命中，于是模型拿一段乱码当依据编出了答案。**如果入库前跑一遍数据验证（能解析出正文吗？字符数正常吗？乱码比例是否超阈值？），这三百份会在进库前就被拦下，而不是在用户用了两个月之后才被发现。** 这就是数据验证最实际的价值——它拦掉的不是报错，是那种「看起来一切正常」的慢性错误。\n\n#### 创建处理复杂数据类型的数据处理工作流\n\n**这条在问什么。** GenAI 应用的数据往往不止文本——还有图像、音频、表格。这些类型各有各的处理要求：音频要先转成文本、图像要么被多模态模型直接处理、要么先做描述提取，表格需要结构化解析。\n\n官方给的组件：**Amazon Bedrock 多模态模型**（直接接受图文混排输入）、**SageMaker Processing**（批量数据预处理作业）、**AWS Transcribe**（语音转文字）。\n\n**一个实务判断**：多模态处理有两个思路——**原生多模态**（把图片直接交给支持视觉的模型）和**先转换再处理**（先用 OCR 或语音转写把非文本变成文本，再走纯文本链路）。前者链路短、语义保留好，但成本高、模型选择受限；后者链路长、可能丢失视觉信息，但便宜、可复用现有的文本处理链路。**考试常在这里给场景问选择**：如果文档里有大量图表需要理解，原生多模态更合适；如果只是把扫描合同变成可检索文本，OCR 转写就够了。\n\n**关联服务**：Amazon Bedrock（多模态模型）、SageMaker Processing、AWS Transcribe。\n\n#### 按模型特定要求格式化输入数据\n\n**这条在问什么。** 不同的调用方式要求不同的输入格式，格式不对就是直接报错。官方列了三种典型：**Amazon Bedrock API 请求用 JSON**、**SageMaker AI 端点要结构化数据准备**、**对话类应用要用多轮对话格式（用户/助手消息序列）**。\n\n**这里有一个特别值得记住的点**：对话格式看起来简单（不就是按顺序排消息吗），但它在生产里很容易出问题——长度怎么算（是算所有历史消息的总和还是只算最新一条）、历史怎么截断（截掉最早的那些会不会丢掉关键上下文）、角色怎么标记。这些细节在 5.2.1（上下文窗口溢出诊断）还会再考一次。\n\n**关联服务**：Amazon Bedrock、Amazon SageMaker AI。\n\n#### 提升输入数据质量，以改善 FM 响应的质量与一致性\n\n**这条和 1.3.1 的区别在哪？** 1.3.1 是「筛掉不合格的」，1.3.4 是「把合格的变得更适合模型理解」。前者是守门，后者是加工。\n\n官方给的手段：**用 Amazon Bedrock 重新格式化文本**（比如把冗长的原始文本整理成清晰的结构）、**用 Amazon Comprehend 抽取实体**（把散落在文本里的关键信息抽成结构化字段）、**用 Lambda 函数做数据规范化**（统一日期格式、统一大小写、去掉多余空白）。\n\n**为什么这能提升响应质量？** 因为模型对输入的「整洁度」很敏感。同一份内容，一段满是页眉页脚和乱换行的 PDF 提取文本，和一段清理干净的正文，模型给出的答案质量差距明显。这不是玄学——噪声会占用宝贵的上下文窗口，也会干扰模型判断哪部分是重点。\n\n**取舍判断。** 数据加工有成本，要判断加工到什么程度。经验法则是：**影响到模型理解的加工要做（去噪、分句、统一编码），纯美学层面的加工可以不做**。过度加工反而可能丢掉对任务有用的信息（比如把表格拍扁成流水文本，结构信息就没了）。\n\n**关联服务**：Amazon Bedrock、Amazon Comprehend、AWS Lambda。\n\n---","figures":[]},{"h":"设计和实施向量存储解决方案","body":"#### 本节定位\n本节对应考纲任务声明 1.4「设计和实施向量存储解决方案」。\n\n> 官方原名：Design and implement vector store solutions.\n\n任务 1.3 把数据整理成了模型能吃的形态，但这个任务的产物——**向量**——需要一个专门的地方存起来，并且能被高效地找回来。这就是向量存储（vector store）要解决的事。五个技能点从「怎么设计架构」一路走到「怎么让它不过期」。\n\n#### 为 FM 增强创建高级向量数据库架构\n\n**这条在问什么。** 传统搜索按关键词匹配：你搜「液压泵异响」，它只去找含这几个字的文档。语义检索找的是「意思相近」的内容：你问「液压泵有怪声」，它能把写着「噪声异常」的段落也翻出来。要做到这一点，就得先把文本转成向量（一串数字），再存进专门的数据库做近邻查找。\n\n**这条的考点在「架构怎么选」，不在「会用某个库」。** 官方给的四个例子正好代表四种典型架构：\n\n| 架构 | 组成 | 适用情形 |\n|---|---|---|\n| **托管知识库** | Amazon Bedrock Knowledge Bases | 快速上线、不想自己管索引（可做主题分层组织） |\n| **搜索引擎兼做向量库** | Amazon OpenSearch Service + Neural 插件 | 已有搜索集群，或需要按主题分片 |\n| **关系库 + 对象存储** | Amazon RDS + Amazon S3 文档库 | 团队已有关系库运维经验，数据量中等 |\n| **NoSQL 存元数据 + 向量库** | Amazon DynamoDB + 向量数据库 | 元数据查询频繁，要按属性做精细过滤 |\n\n**取舍判断。** 选择的依据不是「哪个最强」，而是**团队现有能力和数据规模**：团队没有搜索集群运维经验，托管方案省下的是长期运维成本；已有 OpenSearch 集群，复用它通常比新建一套划算。考试里，题目强调「尽快上线、尽量减少运维」，指向托管方案；强调「对已有搜索基础设施做最小改动」，指向 OpenSearch + Neural 插件。\n\n**关联服务**：Amazon Bedrock Knowledge Bases、Amazon OpenSearch Service、Amazon RDS、Amazon S3、Amazon DynamoDB。\n\n#### 构建元数据框架以提升检索精度与上下文感知\n\n**这条在问什么。** 光有向量还不够。同样一句「保修政策是什么」，你希望它优先返回**当前有效**的那份，而不是 2019 年的旧版。元数据（metadata）就是贴在每段内容上的「标签」，让检索能带上条件。\n\n官方给的三个例子很典型：**S3 对象元数据记时间戳**、**自定义属性记作者信息**、**标签体系做领域分类**。\n\n**为什么这能提升精度。** 向量相似度算的是「意思像不像」，它不知道哪份更新、哪份更权威。带上元数据之后，检索可以做**预过滤**：先按「部门=法务 且 年份≥2025」缩小范围，再在范围内做语义匹配。这比「先搜出一堆再人工挑」要准得多，也快得多。\n\n**一个实务判断**：元数据要在**入库的时候就打上**，不能等检索时再补——因为检索时手上只有向量和原文，很多属性已经无从判断了。所以数据管道（1.3）里就该包含「抽取并写入元数据」这一步。\n\n**关联服务**：Amazon S3（对象元数据）、Amazon OpenSearch Service（过滤查询）、Amazon DynamoDB（属性存储）。\n\n#### 案例\n某公司的知识库里有三个版本的《差旅报销标准》（2022、2024、2026）。员工问「出差住宿标准是多少」，纯向量检索很可能把三个版本混杂返回，模型据此整合出一个中间值——听起来合理，其实错误。加上元数据（生效年份、状态）后，检索层先过滤出「状态=现行」，再语义匹配，返回的就是唯一正确的那份。**这就是元数据最实在的价值：让「哪份算数」在检索层就解决掉，而不是交给模型去猜。**\n\n#### 实施高性能向量数据库架构以优化大规模语义搜索\n\n**这条和 1.4.1 的区别在哪？** 1.4.1 是「选哪种架构」，1.4.3 是「架构定了之后，怎么让它在大规模下不慢」。数据量从十万条涨到一亿条，检索的代价会完全不同。\n\n官方点了三类手段：**OpenSearch 分片策略（sharding）**、**多索引架构（multi-index）**、**分层索引（hierarchical indexing）**。\n\n- **分片**：把一个大索引切成多片分布到不同节点，查询并行执行。分片数要提前规划——分太少单分片过大，分太多则每次查询要等的分片数变多。\n- **多索引**：按领域把数据拆成多个独立索引，查询时只打相关的那个。比如「产品手册」和「人事制度」分属两个索引，问报销就去人事索引，不必在整个大库里搜。\n- **分层索引**：先粗后细——先在一层「摘要向量」里定位大致范围，再进具体分片精查。这是拿少量精度换大量速度的经典做法。\n\n**取舍判断。** 三种手段都在**用复杂度换性能**：分片要规划容量、多索引要维护路由、分层索引要多养一层。所以判据是**数据规模和延迟要求**：万级数据不需要这些；到百万级以上、又要求毫秒级响应，才成为必需。考试里若题目没提规模问题，答案通常不该是「引入复杂索引架构」。\n\n**关联服务**：Amazon OpenSearch Service（分片与索引策略）、Amazon Aurora（pgvector 索引）。\n\n#### 使用 AWS 服务创建集成组件以连接各类资源\n\n**这条在问什么。** 向量库里的数据不是凭空来的——它来自公司已有的各种系统：文档管理系统、知识库、内部 wiki。这条考的是**怎么把这些散落的数据源接进来**，让它们能持续供给 GenAI 应用。\n\n**为什么单独列一条。** 因为在真实项目里，这一步的工作量常被严重低估。纸面上是「把文档导进来」，实际要做的是：定位数据源、拿到访问凭证、处理各种格式、建立增量机制，还要处理权限——**有些文档不是所有人都能看的，检索层必须继承原有的权限体系**，否则 GenAI 会变成一个越权信息泄露的入口。\n\n**取舍判断。** 集成方式有两种：**批量导入**（一次性灌存量数据，简单但会过期）和**增量同步连接器**（持续跟随源系统变化，复杂但保持新鲜）。知识更新慢（如制度文件），批量导入 + 定期重跑就够；工单、案例库这类每天都在变的内容，就必须做增量同步（这正是 1.4.5 的内容）。\n\n**关联服务**：Amazon Bedrock Knowledge Bases（数据源连接器）、AWS Lambda（自定义拉取逻辑）、Amazon S3（中转存储）。\n\n#### 设计并部署数据维护系统，确保向量存储信息始终最新\n\n**这条在问什么。** 上一条解决「怎么进来」，这条解决「进来之后怎么不变馊」。知识库最常见的失败方式不是搭不起来，而是**搭起来之后没人维护，三个月后里面全是过期内容，用户问两次发现答得不对，就再也不用了**。\n\n官方给了四种机制，按「数据变化的时效要求」选：\n\n| 机制 | 时效 | 成本 | 适用 |\n|---|---|---|---|\n| **定时刷新管道** | 小时~天级 | 最低 | 制度文件、产品手册 |\n| **增量更新** | 分钟~小时级 | 中 | 大多数业务文档 |\n| **自动同步工作流** | 事件驱动，近实时 | 较高 | 与源系统强关联的内容 |\n| **实时变更检测** | 秒级 | 最高 | 价格、库存这类高频变更数据 |\n\n**一个必须处理的细节：删除。** 源系统里删掉的文档，向量库里的对应向量也必须删，否则模型还会引用一份已经不存在的材料。删除同步常被漏做，是这类系统的典型隐患。\n\n**关联服务**：AWS Lambda、Amazon EventBridge（事件触发）、AWS Step Functions（同步编排）、Amazon S3（变更事件源）。\n\n---","figures":[]},{"h":"设计面向 FM 增强的检索机制","body":"#### 本节定位\n本节对应考纲任务声明 1.5「设计面向 FM 增强的检索机制」。\n\n> 官方原名：Design retrieval mechanisms for FM augmentation.\n\n数据存好了，接下来是「怎么把它准确地取出来」。这个任务从最基础的切分和嵌入讲起，一路走到混合检索、重排序和查询改写——**这六个技能点合起来，就是一套完整 RAG 检索链路的搭建指南**。\n\n#### 开发有效的文档分割方法\n\n**这条在问什么。** 一份 50 页的手册不能整篇塞给模型（上下文装不下，也不经济），必须切成小块（chunk），每块单独转向量。切法直接决定检索质量——**切得不好，就会「明明有这段内容却搜不出来」**。\n\n官方给了三种切法：\n\n| 切法 | 做法 | 特点 |\n|---|---|---|\n| **固定长度切分** | 按固定字数/Token 数硬切（用 Lambda 实现） | 实现最简单；但可能在句子中间切断，语义被割裂 |\n| **Bedrock 内置切分** | 用 Amazon Bedrock 的切分能力 | 省事，适合快速上线；可调空间有限 |\n| **按内容结构分层切分** | 识别标题、章节等结构，按语义单元切（自定义处理） | 效果最好；要针对文档格式做开发 |\n\n**关键概念：重叠（overlap）。** 固定切分时通常让相邻块**重叠一小段**（比如块长 500 字、重叠 50 字），防止一个完整的句子被切断后两边都读不通。这是很实用的经验做法。\n\n**取舍判断。** 切分粒度是个双向权衡：**块太大**，一块里混着多个主题，检索命中后给模型的是一大段废话，还挤占上下文；**块太小**，一块里信息不完整，模型看不全，答案会缺斤少两。经验起点是「一个块大致对应一个完整的论述单元」。**考试常考这个权衡，而不是让你背具体数值。**\n\n**关联服务**：Amazon Bedrock（内置切分能力）、AWS Lambda（自定义切分逻辑）。\n\n#### 选择并配置最优的嵌入方案\n\n**这条在问什么。** 嵌入（embedding）就是「把文本变成向量」这个动作本身。这条考的是怎么选嵌入模型，以及怎么批量生成向量。\n\n官方给的三个方向：**按维度和领域匹配度选 Amazon Titan 嵌入模型**、**评估 Bedrock 各嵌入模型的性能特征**、**用 Lambda 批量生成向量**。\n\n**选嵌入模型看什么？** 两个容易被忽略的维度：\n\n- **维度（dimensionality）**：向量的长度。维度高，理论上能表达更细腻的语义差异，但存储和计算成本也同步上涨。**够用就好，不是越高越好**——很多场景 1024 维和 1536 维的实际效果差别，还比不上换一个更贴领域的模型明显。\n- **领域匹配度（domain fit）**：通用嵌入模型在通用语料上训练，遇到法律条文、医疗术语、行业黑话时，可能把两个完全不同意思的词判成相似。**有专业语料的场景，优先用在该领域表现更好的模型，或在自家数据上做过适配的模型**。\n\n**为什么要用 Lambda 批量生成？** 因为入库时往往是成千上万条文本要转向量。逐条同步调用会非常慢，必须并发批处理。这里有个实务约束：嵌入调用有速率限制，批量任务要处理限流重试，不能简单循环就完事。\n\n**取舍判断。** **一旦选定嵌入模型，全库的向量都要用它重新生成**——换模型意味着整个向量库重建。所以这个决策要在建库之前定，不能边跑边换。这也是为什么「用同一套嵌入模型覆盖整个知识库」是一条硬纪律。\n\n**关联服务**：Amazon Bedrock（嵌入模型）、Amazon Titan Embeddings、AWS Lambda（批量生成）。\n\n#### 部署并配置向量搜索方案\n\n**这条在问什么。** 向量存进去了，现在要让它能被搜。这条考的是三种部署形态的选择。\n\n官方给了三条路径：\n\n| 路径 | 特点 | 适用 |\n|---|---|---|\n| **Amazon OpenSearch Service**（向量搜索能力） | 功能强、可调项多 | 有搜索运维能力，需要细粒度调优 |\n| **Amazon Aurora + pgvector 扩展** | 复用已有的关系库，SQL 就能查 | 团队熟悉 PostgreSQL，向量是辅助需求 |\n| **Amazon Bedrock Knowledge Bases**（托管向量存储） | 全托管，不碰底层 | 快速上线，不想管索引运维 |\n\n**取舍判断。** 三者的差别本质是**「谁承担运维」**：托管方案把索引运维交给 AWS，代价是可调空间小；自建方案能精细调优，代价是你要有人盯集群。**考试里最常见的陷阱是「过度工程」**——题目描述一个内部小工具、数据量不大，正确项往往是托管方案；若题目明确说「已有 Aurora 集群和熟练的 DBA 团队」，那 pgvector 反而是最省成本的选择。\n\n**一个容易忽略的点**：pgvector 走的是「在关系库里顺手加向量能力」，它的强项是**向量检索和结构化条件能写在同一条 SQL 里**（比如「在这个部门、这个时间段、语义相近」一次查完），这在业务过滤条件复杂的场景反而比专用向量库更顺手。\n\n**关联服务**：Amazon OpenSearch Service、Amazon Aurora（pgvector）、Amazon Bedrock Knowledge Bases。\n\n#### 案例\n一家做 SaaS 的公司要加「文档问答」功能，数据量只有几万条，团队是清一色的后端工程师、没有搜索集群经验。如果按「向量库就该用专门的」这个直觉上 OpenSearch，团队要多学一套集群运维；而选 Aurora + pgvector，他们用熟悉的 SQL 就能把功能做出来，向量检索和租户隔离条件写在同一条查询里，反而更快上线。**这不是「哪个技术更先进」的问题，是「哪个更匹配这个团队」的问题。**\n\n#### 创建高级搜索架构以提升检索相关性与准确性\n\n**这条在问什么。** 基础向量检索有个众所周知的短板：**它在「找意思相近的内容」上很强，但在「精确匹配专有名词」上很弱**。比如零件编号 `HYD-3000-AB`，向量检索可能给你返回一堆「型号相近」的段落，却没有真正含这个编号的那条。这条考的就是怎么补救。\n\n官方给了三件武器：\n\n- **OpenSearch 语义搜索**：把语义检索能力接入常规搜索基础设施，统一管理。\n- **混合检索（hybrid search）**：**关键词检索 + 向量检索同时跑，再把两路结果融合**。关键词那路保证「编号、专名这类精确匹配不丢」，向量那路保证「近义表达也能召回」。**这是目前工业界最常用的做法，因为它同时补上了两边的短板。**\n- **Amazon Bedrock 重排序模型（reranker）**：初步检索往往一次召回几十条，不可能全给模型。重排序就是用更精细（也更慢、更贵）的模型给这几十条重新打分，把最相关的几条排到前面。**「粗检索多召回 + 精重排取前几条」是标准的两段式架构。**\n\n**取舍判断。** 这三样都是**用复杂度和成本换准确率**：混合检索要维护两套检索逻辑并调融合权重；重排序要多跑一次模型调用，增加延迟。所以判据是**业务对「答错」的容忍度**：客服、法务这类答错代价高的场景值得上；内部检索工具可以先不做。考试里若题目强调「商品编号、合同条款号这类精确信息必须准确命中」，正确项就是引入混合检索。\n\n**关联服务**：Amazon OpenSearch Service、Amazon Bedrock（重排序模型）。\n\n#### 开发精细的查询处理系统\n\n**这条在问什么。** 用户提的问题本身往往「不好搜」。要么太短（「报销」两个字，什么意图都看不出来），要么太复杂（一句话里塞了三个不同的问法）。这条考的是**在检索之前先加工用户的问题**。\n\n官方给了三种加工方式：\n\n| 方式 | 做法 | 解决什么问题 |\n|---|---|---|\n| **查询扩展（query expansion）** | 用 Amazon Bedrock 把问题改写成多个同义表达 | 用户用词和文档用词不一致（问「报销标准」、文档写「费用限额」） |\n| **查询分解（query decomposition）** | 用 Lambda 把复合问题拆成多个子问题 | 「A 和 B 的区别，以及 C 的情况下该用哪个」——一次检索答不全 |\n| **查询改写（query transformation）** | 用 Step Functions 编排多步改写流程 | 需要多轮加工（先补全指代，再扩展，再分解） |\n\n**「查询分解」在 RAG 里特别值得掌握。** 用户问「新员工报销标准和老员工有什么不同，出差和市内交通分别怎么算」，这是一个包含多个独立信息需求的问题。直接拿去检索，很可能只召回到一部分内容，模型就会用不完整的信息编出一个看似合理的答案。**正确做法是先拆成「新员工标准」「老员工标准」「出差标准」「市内交通标准」几个子问题，分别检索，再合并上下文交给模型。** 这能明显减少「答一半漏一半」的情况。\n\n**取舍判断。** 每种加工都增加一次（或多次）模型调用，也就增加延迟和成本。**简单明确的问题不必要做加工**——「公司年假多少天」这种问题直接检索又快又准。所以实务上常见的做法是**按问题复杂度分流**：短而明确的问题走快速通道，长而复合的问题才做分解。\n\n**关联服务**：Amazon Bedrock（查询扩展）、AWS Lambda（查询分解）、AWS Step Functions（改写编排）。\n\n#### 创建一致的访问机制以实现与 FM 的无缝集成\n\n**这条在问什么。** 到这一步，检索链路本身已经能用了。最后这条解决的是**「怎么让模型方便地调用它」**——把检索能力包装成一个规范、统一的接口，让不同的应用都能用同一套方式访问。\n\n官方给了三个方向：**面向向量搜索的函数调用接口（function calling）**、**Model Context Protocol（MCP）客户端**、**标准化的检索增强 API 模式**。\n\n**这三者在说什么？** 本质是同一件事的三个层次：\n\n- **函数调用接口**：把「检索」定义成一个模型可以调用的工具。模型判断需要查资料时，自己发起调用，拿到结果再继续生成。这是 Agent 式 RAG 的基础。\n- **MCP 客户端**：Model Context Protocol 是一套标准协议，让模型能以统一方式接入外部数据源和工具。**它的价值在于「一次实现，多处复用」**——检索服务按 MCP 标准暴露，任何支持该协议的客户端都能接上，不用为每个应用单独写适配。\n- **标准化 API 模式**：把检索接口的参数、返回结构、错误约定统一起来，让多个应用、多个团队用同一套契约对接。\n\n**为什么「一致」被单独强调？** 因为在多应用环境里，**不统一的接口会带来重复建设和行为不一致**：A 团队写的检索接口返回带分数、B 团队的返回带高亮片段，模型拿到的上下文结构不同，最终答复质量就参差不齐。定一套契约，是把「碰运气」变成「可预期」。\n\n**取舍判断。** 接口标准化的投入要和「消费方数量」匹配：只有一个应用在用，直接写个函数最省事；有三个以上的应用、或者要对外开放，才值得投入做标准化接口和协议适配。**又一次回到「先有重复、再抽象」这条原则。**\n\n**关联服务**：Amazon Bedrock（函数调用）、Model Context Protocol（MCP）、AWS Lambda（检索服务封装）。\n\n---","figures":[]},{"h":"实施提示工程策略与治理","body":"#### 本节定位\n本节对应考纲任务声明 1.6「实施提示工程策略与治理」。\n\n> 官方原名：Implement prompt engineering strategies and governance for FM interactions.\n\n这是域 1 的最后一个任务，也是**离「应用题」最近的一个**。前面五个任务搭好了数据链路，这个任务解决的是「怎么跟模型说话，以及怎么管住这些说话方式」。六个技能点分两部分：前三个偏「怎么做 + 怎么管」，后三个偏「怎么越做越好」。\n\n#### 创建有效的模型指令框架\n\n**这条在问什么。** 提示词不是随便写一句话丢给模型——企业环境里它是一件需要设计的东西。这条考的是**用结构化的方式定义模型该扮演什么角色、遵守什么边界、输出什么格式**。\n\n官方给了三个组件：\n\n| 组件 | 作用 |\n|---|---|\n| **Amazon Bedrock Prompt Management**（角色定义） | 把「你是一个 XX 助手」这类指令集中管理，而不是散落在代码里 |\n| **Amazon Bedrock Guardrails** | 强制执行负责任 AI 的边界——过滤有害内容、拦截敏感信息、阻止越界话题 |\n| **模板配置** | 规定输出的格式（JSON、表格、固定字段），让下游系统能稳定解析 |\n\n**为什么要把「角色定义」和「输出格式」分开管？** 因为它们的变化频率不同：**角色设定可能半年不变，输出格式却常因下游系统调整而改**。混在一段大提示词里，改一处就要整体重测；分开管理，改动范围可控。这是很实际的工程考量。\n\n**关于 Guardrails 要理解的一点**：它和「提示词里写一句『请不要输出敏感信息』」有本质区别。写在提示词里是**请求**，模型可能不遵守；Guardrails 是在模型输出之后**独立执行**的检查层，拦得住。**安全要求高的场景，不能只靠提示词里的君子协定。**\n\n**取舍判断。** Guardrails 会增加延迟，也可能误拦（把正常内容判定为敏感）。所以它的规则要按场景调：面向公众的应用要严，内部工具可以放宽。**这也是考试的一个常见判断点——不是「有安全需求就无脑开最严」。**\n\n**关联服务**：Amazon Bedrock Prompt Management、Amazon Bedrock Guardrails。\n\n#### 构建维持上下文的交互式 AI 系统\n\n**这条在问什么。** 前面讲的都是「一次问答」。真实场景里用户是**多轮交互**的：先问「这个合同有什么风险」，再问「那第二条具体怎么改」。第二句里的「那第二条」是什么意思，完全依赖上一轮的上下文。这条考的就是**怎么把多轮对话接起来，以及怎么处理「用户没说清」的情况**。\n\n官方给了三个组件：**Step Functions 做澄清工作流**、**Amazon Comprehend 做意图识别**、**DynamoDB 存对话历史**。\n\n- **对话历史存储**：每轮问答都要存下来，下轮调用时把相关历史一起送给模型。用 DynamoDB 是因为它按会话 ID 存取快、能自动过期（设 TTL），成本也可控。\n- **意图识别**：先判断用户这句话到底想干什么（查询、抱怨、下单、问路由），再决定怎么处理。用 Amazon Comprehend 做分类，可以在进入昂贵的大模型调用之前先分流。\n- **澄清工作流**：用户的问题模糊时，**反问一句比瞎猜要好**。比如「帮我改一下那个」——对方到底指哪个，系统应该问清楚，而不是随便编一个。用 Step Functions 编排「判断是否需要澄清 → 追问 → 收到补充信息 → 继续处理」这条流程。\n\n**一个实务判断**：对话历史不能无限往里塞——**上下文窗口是有限且昂贵的**。所以工程上必须处理「截断策略」：保留最近几轮 + 关键的早期信息（如用户一开始表达的总体诉求），中间的可以摘要压缩。这个点和 5.2.1（上下文窗口溢出诊断）是同一个知识点的两面。\n\n**关联服务**：AWS Step Functions、Amazon Comprehend、Amazon DynamoDB。\n\n#### 案例\n某企业的IT支持助手上线后遇到一类投诉——用户问「我的账号登不上」，助手直接给出「请重置密码」的标准答案，但用户其实是**新入职、账号还没开通**。问题出在缺少澄清环节。加上澄清工作流后的表现是：助手先判断意图（登录故障）→ 检查话术库中该意图分支是否信息不足 → 追问一句「你是新员工还是已有账号？」→ 按回答分流。**多问一句话，就把「答非所问」变成了「对症下药」。**\n\n#### 实施提示管理与治理系统\n\n**这条在问什么。** 提示词一旦上了生产，就变成了**需要版本管理、需要审批、需要审计**的资产。谁能改、改了什么、什么时候改的、改完之后谁在用——这些都必须留痕。这条考的是「提示词的治理」。\n\n官方给的四个组件正好覆盖治理的四个面：\n\n| 组件 | 管的什么 |\n|---|---|\n| **Amazon Bedrock Prompt Management**（参数化模板 + 审批工作流） | 提示词的**版本与发布**——模板复用，改动走审批 |\n| **Amazon S3**（模板仓库） | 提示词的**集中存储**，统一存放而不是散落各处 |\n| **AWS CloudTrail**（追踪使用） | **谁调用了什么**——审计追踪 |\n| **Amazon CloudWatch Logs**（记录访问） | **运行时的访问与异常**——监控与排障 |\n\n**为什么提示词治理值得单列一条？** 因为它是**最容易失控的一环**。数据管道有代码、模型有版本号，唯独提示词常常是「谁在线上一改，全公司的输出风格就变了」，而且没人知道是谁改的。在受监管行业，这直接构成合规问题：**你无法向审计证明「这个回答是由哪个版本的指令产生的」。**\n\n**取舍判断。** 治理强度应随场景敏感度分级：**面向客户、涉及合规的场景，提示词变更必须走审批 + 留痕 + 可回滚；内部实验性工具可以轻量处理**。全部上重流程，会拖慢创新；全部不上流程，出事时查不清。这也是考试喜欢考的「分级治理」思路。\n\n**关联服务**：Amazon Bedrock Prompt Management、Amazon S3、AWS CloudTrail、Amazon CloudWatch Logs。\n\n#### 开发质量保证系统\n\n**这条在问什么。** 提示词改了一版，你怎么知道它是变好了还是变坏了？**靠感觉是不行的**——必须有一套「跑一遍、对着标准看」的机制。这条考的就是提示词的质量保证。\n\n官方给了三种手段：**Lambda 验证期望输出**、**Step Functions 测试边界情况**、**CloudWatch 做提示词回归测试**。\n\n- **验证期望输出**：写程序自动检查模型的返回是否符合预期——格式对不对、必填字段有没有、是不是该拒答的拒答了。**这是把「人工看一眼」变成「自动跑一遍」的关键一步。**\n- **测试边界情况**：正常问题答得好，不代表异常输入也稳。空输入、超长输入、恶意诱导、语言混杂——这些「边界情况」恰恰是上线后最容易翻车的地方。用 Step Functions 把这一批用例编排起来批量跑。\n- **回归测试**：**每次改提示词都重跑一遍历史用例，对比改动前后的结果**。这是软件工程里的老规矩（改了代码要跑回归测试），搬到提示词上同样成立——而且更重要，因为提示词的变化比代码更难用肉眼看出来。\n\n**取舍判断。** 建这套测试体系有前期成本（要攒用例、写校验脚本）。**判据是「提示词的变更频率」和「答错的代价」**：一个季度都不改一次的提示词，做重流程不划算；每天在调、又要面向客户，那这套体系是必需品。一个务实做法是**把线上出过的 bad case 攒成固定用例集**，它比凭空设计的用例更贴近真实风险。\n\n**关联服务**：AWS Lambda、AWS Step Functions、Amazon CloudWatch。\n\n#### 迭代优化提示以提升响应质量\n\n**这条在问什么。** 前面都在讲「怎么管」，这条回到「怎么写」。当基础提示（直接把问题丢给模型）已经用上，怎么让输出质量再上一个台阶？\n\n官方给了四个抓手：**结构化输入组件**、**输出格式规范**、**思维链（chain-of-thought）指令模式**、**反馈闭环**。\n\n**为什么这些有效？**\n\n- **结构化输入**：不是把一堆文字堆给模型，而是明确分区——「以下是背景资料」「以下是用户问题」「以下是输出要求」。**分区让模型知道哪部分是资料、哪部分是指令**，混淆这两者是很多提示失效的根因。\n- **输出格式规范**：明确要求「以 JSON 输出，包含 `summary`、`risk_level`、`actions` 三个字段」。这既是给模型约束，也是给下游程序留接口。\n- **思维链**：让模型**先推理再给结论**（「请先逐步分析，再给出最终判断」）。在需要多步推理的任务上（如判断一个架构是否满足合规要求），这能明显改善正确率——因为模型不再是一步跳到答案。\n- **反馈闭环**：把用户的反馈（点赞/否定/修正）收集起来，用来改进下一版提示。**这是让提示词持续变好的机制，而不是一次性写完就放着。**\n\n**取舍判断。** 思维链会增加输出长度和延迟，**不是所有任务都该用**。简单的事实提取，加了思维链反而变慢变啰嗦；需要推理和权衡的复杂任务，它才发挥作用。**「按任务复杂度选提示策略」是这条的核心判断。**\n\n**关联服务**：Amazon Bedrock（提示编排）。\n\n#### 设计复杂提示系统\n\n**这条在问什么。** 单条提示解决不了的任务，就要把多条提示组织起来——这就是「提示系统」。这条是提示工程里最靠「设计」的一层。\n\n官方给的四个组件：\n\n| 组件 | 作用 |\n|---|---|\n| **Amazon Bedrock Prompt Flows** | 把多条提示串成流程（顺序链） |\n| **基于模型响应的条件分支** | 上一步的结果决定下一步走哪条路 |\n| **可复用提示组件** | 把常用片段抽成积木，避免重复维护 |\n| **内置的前处理与后处理步骤** | 在提示链的两端加上数据准备与结果加工 |\n\n**这套东西在解决什么真实问题？** 举个典型的业务场景：自动审合同。流程是——先抽取合同要素（第一条提示）→ 判断风险等级（第二条提示）→ **如果是高风险，走「逐条给出修改建议」的详细分支；如果是低风险，走「生成一句话结论」的快速分支**（这就是条件分支）→ 最后把结果格式化成报告（后处理）。\n\n拆成多步的好处很实在：**每一步都能单独测试、单独优化、单独替换**。一坨巨型提示出问题时你根本不知道是哪段写坏了；拆成链之后，哪一步的输入输出不对，一眼就能定位。\n\n**取舍判断。** 多步链路的代价是**延迟叠加**（每步都要调一次模型）和**错误传播**（第一步抽要素错了，后面全错）。所以判据是**任务是否真的需要分解**：如果一条提示能稳定完成，就不该拆成五步——那是为了架构好看而牺牲性能。**只有当任务本身包含「必须先得到 A 才能决定 B」这种依赖关系时，拆链路才是必要的。**\n\n**关联服务**：Amazon Bedrock Prompt Flows、AWS Lambda（前后处理）。\n\n---","figures":[]}],"tips":{"points":"| 考点编号 | 考点内容 | 出现频率 | 常见题型 |\n|---|---|---|---|\n| 1.1.1 | 四种集成模式（提示工程/RAG/Agent/微调）的适用判断 | ⭐⭐⭐ | 场景选择题——给需求问选哪种 |\n| 1.1.2 | POC 的正确做法（真实数据、小规模、先定验收标准） | ⭐⭐ | 判断「哪种 POC 做法更合适」 |\n| 1.2.1 | 模型选择的三维递进筛选（限制→能力→性能） | ⭐⭐⭐ | 场景题——先排除再择优的顺序 |\n| 1.2.2 | 模型抽象层的取舍（何时值得加、何时是过度设计） | ⭐⭐ | 正反两向——既考「该加」也考「不该加」 |\n| 1.2.3 | 韧性四手段的适用（断路器/跨区域推理/多区域部署/优雅降级） | ⭐⭐⭐ | 故障场景题——问该用哪种容错 |\n| 1.2.4 | 微调 vs PEFT 的成本效果权衡 | ⭐⭐ | 对比题——什么时候才该定制模型 |\n| 1.3.1 | 数据验证的价值：把问题挡在进模型之前 | ⭐⭐ | 概念题——为什么不能省这一步 |\n| 1.3.2 | 原生多模态 vs 先转换再处理 | ⭐⭐ | 场景题——按文档类型选路径 |\n| 1.3.3 | 对话格式的输入要求（长度计算、历史截断） | ⭐⭐ | 细节题——与 5.2.1 联动 |\n| 1.4.1 | 四种向量库架构的适用场景 | ⭐⭐⭐ | 场景选择题——按团队能力与规模选 |\n| 1.4.2 | 元数据的预过滤价值 | ⭐⭐ | 场景题——多版本文档如何保证取到现行版 |\n| 1.4.3 | 大规模下的索引优化手段（分片/多索引/分层） | ⭐ | 判断题——何时才需要 |\n| 1.4.5 | 数据维护四种机制的时效选择 + 删除同步 | ⭐⭐ | 场景题——按变更频率选机制 |\n| 1.5.1 | 切分粒度的双向权衡 + 重叠的作用 | ⭐⭐⭐ | 判断题——块太大/太小的后果 |\n| 1.5.2 | 嵌入模型选择（维度、领域匹配）与全库一致性 | ⭐⭐ | 概念题——换模型的代价 |\n| 1.5.4 | 混合检索弥补向量检索的专名短板；重排序两段式架构 | ⭐⭐⭐ | 场景题——编号/条款号必须精确命中 |\n| 1.5.5 | 查询分解处理复合问题；按复杂度分流 | ⭐⭐ | 场景题——多信息需求的问题怎么处理 |\n| 1.5.6 | 访问机制标准化（函数调用/MCP/统一 API）的适用条件 | ⭐ | 判断题——消费方数量决定投入 |\n| 1.6.1 | 角色定义 vs Guardrails 的本质区别（请求 vs 强制） | ⭐⭐⭐ | 概念题——安全边界怎么才拦得住 |\n| 1.6.3 | 提示词治理四要素（版本/存储/审计/监控）与分级治理 | ⭐⭐ | 场景题——受监管行业的合规要求 |\n| 1.6.4 | 提示词回归测试与边界用例 | ⭐⭐ | 判断题——怎么验证改动是变好还是变坏 |\n| 1.6.5 | 思维链的适用条件（复杂推理有效、简单提取反而变差） | ⭐⭐ | 对比题——按任务复杂度选策略 |\n| 1.6.6 | 提示链路的拆分判据（有依赖才拆） | ⭐⭐ | 判断题——多步链路的代价 |","services":"| 服务 | 主要用途 | 涉及 Task |\n|---|---|---|\n| Amazon Bedrock | 模型调用、知识库、Prompt Management / Flows、Guardrails、重排序、查询扩展 | 1.1 / 1.2 / 1.3 / 1.4 / 1.5 / 1.6 |\n| Amazon Bedrock Knowledge Bases | 托管知识库与向量存储、数据源连接器、内置切分 | 1.4 / 1.5 |\n| Amazon Bedrock Guardrails | 输出侧安全边界强制执行 | 1.6 |\n| Amazon SageMaker AI | 自建端点、微调、批量处理 | 1.1 / 1.2 / 1.3 |\n| SageMaker Model Registry | 模型版本管理与回滚 | 1.2 |\n| Amazon OpenSearch Service | 向量检索、分片策略、混合检索 | 1.4 / 1.5 |\n| Amazon Aurora（pgvector） | 关系库内做向量检索，可与结构化条件同查 | 1.4 / 1.5 |\n| Amazon RDS / Amazon DynamoDB | 元数据与对话历史存储 | 1.4 / 1.6 |\n| Amazon S3 | 文档存储、元数据、模板仓库、变更事件源 | 1.3 / 1.4 / 1.6 |\n| AWS Lambda | 数据校验、切分、批量嵌入、查询分解、质量验证 | 1.3 / 1.4 / 1.5 / 1.6 |\n| AWS Step Functions | 断路器编排、澄清流程、查询改写、边界用例测试 | 1.2 / 1.5 / 1.6 |\n| Amazon API Gateway | 统一调用入口（模型抽象层） | 1.2 |\n| AWS AppConfig | 配置中心，实现不改代码换模型 | 1.2 |\n| Amazon Comprehend | 实体抽取、意图识别 | 1.3 / 1.6 |\n| AWS Glue Data Quality | 数据管道内建质量规则 | 1.3 |\n| SageMaker Data Wrangler | 可视化数据准备与探查 | 1.3 |\n| AWS Transcribe | 语音转文本 | 1.3 |\n| Amazon CloudWatch / Logs | 质量指标监控、提示词回归测试、访问日志 | 1.3 / 1.6 |\n| AWS CloudTrail | 提示词使用审计追踪 | 1.6 |\n| Amazon EventBridge | 事件触发的数据同步 | 1.4 |\n| AWS Well-Architected Framework / Tool | 架构评审基准、GenAI Lens 检查项 | 1.1 |"}}]};

'use strict';
const DATA = (typeof LEARNING_DATA !== 'undefined' && LEARNING_DATA) ? LEARNING_DATA : null;

/* ============ 常量与工具 ============ */
const EXAM = DATA ? (DATA.meta.exam || 'CERT').toLowerCase() : 'cert';   // clf-c02
const STORE_KEY = EXAM + '-v2';                                          // 进度键：clf-c02-v2
const COLORS = ['#4f46e5','#7c3aed','#9333ea','#a855f7'];                // 每章主题色（N 章 N 色，N>4 循环）
const home = document.getElementById('home');
const chapBox = document.getElementById('chapters');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inlineMd(s){
  let t = esc(s);
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
  return t;
}
function isTblSep(ln){ const core = ln.replace(/^\s*\|/,'').replace(/\|\s*$/,''); if(!core.includes('-')) return false; return /^[\s:\-|]+$/.test(ln) && /-/.test(ln); }
function loadProg(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveProg(p){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){} }

/* ============ 块级 md 渲染（段落/引用/表格/列表/图占位符） ============ */
function renderBlocks(seg, figs){
  const lines = seg.replace(/\r/g,'').split('\n');
  let html = ''; let i = 0; const n = lines.length;
  while(i < n){
    const ln = lines[i]; const s = ln.trim();
    if(s === ''){ i++; continue; }
    const fm = s.match(/^\[\[fig:([\w-]+)\]\]$/);
    if(fm){ const f = (figs||{})[fm[1]]; if(f) html += figHtml(f); i++; continue; }
    if(s.startsWith('|') && i+1 < n && isTblSep(lines[i+1].trim())){
      let rows = [];
      while(i < n && lines[i].trim().startsWith('|')){ rows.push(lines[i].trim()); i++; }
      const heads = rows[0].replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim()));
      const data = rows.slice(2).map(r => r.replace(/^\||\|$/g,'').split('|').map(x=>inlineMd(x.trim())));
      html += '<div class="tbl-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'
        + data.map(r => '<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if(s.startsWith('>')){
      let q = [];
      while(i < n && lines[i].trim().startsWith('>')){ q.push(lines[i].replace(/^\s*>\s?/,'').trim()); i++; }
      html += '<blockquote>'+inlineMd(q.join(' '))+'</blockquote>'; continue;
    }
    if(/^[-*]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^[-*]\s+/.test(t)){ items.push(inlineMd(t.replace(/^[-*]\s+/,''))); i++; } else break; }
      html += '<ul>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; continue;
    }
    if(/^\d+[.、]\s+/.test(s)){
      let items = [];
      while(i < n){ const t = lines[i].trim(); if(/^\d+[.、]\s+/.test(t)){ items.push(inlineMd(t.replace(/^\d+[.、]\s+/,''))); i++; } else break; }
      html += '<ol>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ol>'; continue;
    }
    const hm = s.match(/^(#{1,6})\s+(.+)$/);
    if(hm){ html += '<h4 class="sec-h">'+inlineMd(hm[2])+'</h4>'; i++; continue; }
    let para = [];
    while(i < n){
      const t = lines[i].trim();
      if(t === '' || t.startsWith('|') || t.startsWith('>') || /^[-*]\s+/.test(t) || /^\d+[.、]\s+/.test(t) || /^#{1,6}\s/.test(t) || /^\[\[fig:[\w-]+\]\]$/.test(t)) break;
      para.push(t); i++;
    }
    if(para.length) html += '<p>'+inlineMd(para.join(' '))+'</p>';
  }
  return html;
}

/* ===== 节内子块解析与渲染（v6）：#### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点）
   本节定位=弱化引言、案例/记忆要点=卡片、常见误区与易错点=警示小节——均不占编号。
   解析与渲染共用 parseSectionBlocks，保证正文 h3 与左侧目录两级条目 1:1。 ===== */
const SUB_RAW='raw', SUB_LEAD='lead', SUB_KP='kp', SUB_CASE='case', SUB_MIS='mis', SUB_MEM='mem';
function subTypeOf(title){
  if(title === '本节定位') return SUB_LEAD;
  if(title === '案例') return SUB_CASE;
  if(title === '记忆要点') return SUB_MEM;
  if(title === '常见误区与易错点') return SUB_MIS;
  return SUB_KP;
}
function parseSectionBlocks(md){
  const parts = (md||'').replace(/\r/g,'').split(/\n(?=####\s)/);
  const out = [];
  parts.forEach(part=>{
    const m = part.match(/^####\s*(.+?)\s*\n([\s\S]*)$/);
    if(!m){ const t = part.trim(); if(t) out.push({ type:SUB_RAW, title:'', body:t }); return; }
    out.push({ type:subTypeOf(m[1].trim()), title:m[1].trim(), body:(m[2]||'').trim() });
  });
  return out;
}
function countKp(body){ let m=0; parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP) m++; }); return m; }
function kpListOf(body){
  const kps=[]; let m=0;
  parseSectionBlocks(body).forEach(b=>{ if(b.type===SUB_KP){ m++; kps.push({ m:m, title:b.title }); } });
  return kps;
}
function renderSectionBody(md, figs, d, n){
  const blocks = parseSectionBlocks(md);
  let h = ''; let kp = 0;
  for(const b of blocks){
    if(b.type === SUB_RAW){ h += renderBlocks(b.body, figs); continue; }
    if(b.type === SUB_KP){
      kp++;
      h += '<h3 class="mh3" id="sec-'+d+'-'+n+'-'+kp+'"><span class="h3no">'+d+'.'+n+'.'+kp+'</span><span>'+inlineMd(b.title)+'</span></h3>'
         + renderBlocks(b.body, figs);
      continue;
    }
    if(b.type === SUB_CASE){ h += '<div class="case-card"><h4 class="sec-h">案例</h4>'+renderBlocks(b.body, figs)+'</div>'; continue; }
    if(b.type === SUB_MEM){ h += '<div class="mem-card"><h4 class="sec-h">记忆要点</h4>'+renderBlocks(b.body, figs)+'</div>'; continue; }
    h += '<h4 class="sec-h'+(b.type===SUB_LEAD?' sec-lead-h':'')+'">'+inlineMd(b.title)+'</h4>'+renderBlocks(b.body, figs);
  }
  return h;
}
function figsById(fs){ const m={}; (fs||[]).forEach(f=>{ m[f.id]=f; }); return m; }
function figHtml(f){
  return '<div class="fig-block"><div class="fig-title">'+esc(f.title)+'</div>'
    + '<div class="fig-body">'+(f.html||'')+'</div>'
    + (f.caption ? '<div class="fig-caption">'+esc(f.caption)+'</div>' : '') + '</div>';
}
