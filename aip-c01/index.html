<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>学习材料</title>
<style>
/* ===== 页面结构：首页目录 + 章级分页 SPA（非单一长页） ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;font-size:17px;line-height:1.7}
.wrap{max-width:1200px;margin:0 auto;padding:24px 28px 60px}
@media(max-width:768px){.wrap{padding:16px 14px 48px}}

/* ===== 首页 ===== */
.hdr{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:12px;padding:30px 32px 26px;margin-bottom:18px}
.hdr-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:3px 12px;border-radius:20px;margin-bottom:10px}
.hdr h1{font-size:24px;font-weight:800;line-height:1.4}
.hdr-sub{font-size:13px;opacity:.9;margin-top:8px}
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.ov-item{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.ov-num{font-size:28px;font-weight:800;color:#4f46e5;line-height:1.2}
.ov-lbl{font-size:12px;color:#64748b;margin-top:4px}
@media(max-width:768px){.ov{grid-template-columns:repeat(2,1fr)}}

.card-s{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.cs-title{font-size:18px;font-weight:700;color:#374151;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}

/* 章节目录卡 */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ch-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 16px;cursor:pointer;transition:.2s;margin-bottom:0}
.ch-card:hover{border-color:#7c3aed;transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,70,229,.12)}
.ch-card.done{border-color:#16a34a}
.cc-num{font-size:11px;font-weight:700;margin-bottom:3px}
.cc-title{font-size:15px;font-weight:700;color:#1e293b;margin-bottom:6px}
.cc-meta{font-size:13px;color:#64748b}
.cc-prog{margin-top:8px}
.pm{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:3px}
.pbar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .4s}

/* 考试速览 */
.exam-quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.eq-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 10px;text-align:center}
.eq-num{font-size:20px;font-weight:800;color:#4f46e5;line-height:1.2}
.eq-sub{font-size:10.5px;color:#64748b;margin-top:2px}
.eq-lbl{font-size:11px;color:#64748b;margin-top:5px}
.exam-two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:10px}
@media(max-width:768px){.exam-two-col{grid-template-columns:1fr}}
.exam-sub-t{font-size:14px;font-weight:700;color:#374151;margin:4px 0 10px}
.exam-domain-tbl{width:100%;border-collapse:collapse;font-size:15px}
.exam-domain-tbl th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;padding:9px 12px;text-align:left;font-weight:700}
.exam-domain-tbl td{padding:9px 12px;border-bottom:1px solid #e9d5ff;vertical-align:middle}
.exam-domain-tbl tr:nth-child(even) td{background:#faf5ff}
.domain-chip{display:inline-block;border-radius:20px;padding:2px 11px;font-size:12px;font-weight:700;background:#ede9fe;color:#5b21b6;cursor:pointer;border:none;transition:.15s}
.domain-chip:hover{background:#ddd6fe}
.exam-info-list{font-size:15px;color:#374151;margin:0 0 12px 18px}
.exam-info-list li{margin-bottom:6px;line-height:1.7}
.exam-steps{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px;font-size:14px}
.step-block{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;padding:9px 12px;font-size:13px;color:#4338ca;flex:1 1 150px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.step-block b{display:block;font-size:13px}
.step-block span{display:block;font-size:11.5px;color:#6d28d9;margin-top:3px}
.step-arrow{color:#a78bfa;font-weight:700;font-size:16px;padding:0 4px;flex:0 0 auto;align-self:center}
details.exam-faq{margin-top:12px;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;background:#f8fafc}
details.exam-faq summary{font-size:14px;font-weight:700;color:#374151;cursor:pointer}
details.exam-faq p{margin:9px 0 0;font-size:14px;color:#475569;line-height:1.75}

/* 14 天计划 */
.ptbl{width:100%;border-collapse:collapse;font-size:15px}
.ptbl th{background:#f8fafc;padding:11px 12px;text-align:left;font-weight:600;color:#374151;border-bottom:2px solid #e2e8f0;font-size:14px}
.ptbl td{padding:10px 12px;border-bottom:1px solid #f8fafc;vertical-align:middle}
.ptbl tr:last-child td{border-bottom:none}
.day{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.chip-p{background:#ede9fe;color:#5b21b6}.chip-p:hover{background:#ddd6fe}
.focus{font-size:12px;color:#64748b}

/* ===== 章面板 ===== */
.ch-topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);padding:8px 18px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px}
.back-btn{background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:13px;font-weight:600;border-radius:8px;padding:5px 14px;cursor:pointer;white-space:nowrap;transition:.15s}
.back-btn:hover{background:#ede9fe}
.tn-title{font-size:15px;font-weight:700;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-hdr{color:#fff;padding:20px 22px 16px;border-radius:12px 12px 0 0;margin-bottom:0}
.ch-badge{font-size:13px;font-weight:700;opacity:.9;margin-bottom:5px;display:block}
.ch-title{font-size:22px;font-weight:800}
.panel{margin-bottom:14px}
.task-list{padding-left:22px;font-size:16px;color:#374151;line-height:2.0}
.task-list li::marker{color:#a78bfa}
.task-list a{color:#374151;text-decoration:none}
.task-list a:hover{color:#4f46e5}
.tl-id{display:inline-block;min-width:38px;font-weight:700;color:#4f46e5;margin-right:6px}
.panel-hr{border:none;border-top:1px solid #e2e8f0;margin:14px 0}

/* ===== 正文排版（规范 B） ===== */
.mdbody .sec-block h2.mh2{font-size:19px;font-weight:700;color:#4f46e5;margin:4px 0 12px;padding:10px 0 8px;border-top:1px solid #e2e8f0}
.mdbody p{font-size:17px;color:#374151;margin-bottom:14px;line-height:1.9}
.mdbody ul,.mdbody ol{font-size:17px;color:#374151;padding-left:24px;margin-bottom:12px}
.mdbody li{margin-bottom:8px;line-height:1.9}
.mdbody blockquote{border-left:3px solid #a78bfa;padding:10px 16px;background:#f5f3ff;font-size:15px;color:#5b21b6;margin:0 0 14px;border-radius:0 6px 6px 0;line-height:1.8}
.mdbody code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.mdbody h4.sec-h{font-size:17px;font-weight:600;color:#374151;margin:24px 0 10px;padding-left:12px;border-left:3px solid #a78bfa;line-height:1.4}
.mdbody .case-card,.mdbody .mem-card{border-radius:10px;padding:13px 16px;margin-bottom:14px}
.mdbody .case-card{background:#fff8e6;border:1px solid #ecd9a0}
.mdbody .mem-card{background:#eef3ff;border:1px solid #b9c9f7}
.mdbody .case-card h4.sec-h,.mdbody .mem-card h4.sec-h{border-left:none;padding-left:0;margin:0 0 8px;font-size:14px;font-weight:700}
.mdbody .case-card h4.sec-h{color:#9a7b1e}
.mdbody .mem-card h4.sec-h{color:#4361ee}
.mdbody .case-card p,.mdbody .mem-card p{font-size:15px}
.mdbody .case-card ul,.mdbody .mem-card ul{margin-bottom:0;font-size:15px}
/* 表格（规范 C） */
.tbl-wrap{overflow-x:auto;margin:0 0 14px;border:1px solid #e9d5ff;border-radius:10px}
.tbl-wrap table{min-width:480px}
table{border-collapse:collapse;width:100%;font-size:16px}
.mdbody th,.mdbody td{padding:11px 16px;text-align:left;border-bottom:1px solid #e9d5ff;vertical-align:top;line-height:1.6}
.mdbody thead th{background:linear-gradient(180deg,#f5f3ff,#ede9fe);color:#4338ca;font-weight:700;font-size:15px;white-space:nowrap}
.mdbody tbody tr:nth-child(even) td{background:#faf5ff}
.mdbody tbody tr:last-child td{border-bottom:none}
/* 图块（v2.1 图文同流） */
.fig-block{background:#f8f7ff;border:1px solid #ddd6fe;border-radius:12px;padding:14px 16px;margin:0 0 14px}
.fig-title{font-size:13px;font-weight:700;color:#4f46e5;text-align:center;margin-bottom:10px}
.fig-body{overflow-x:auto}
.fig-body svg{display:block;margin:0 auto;height:auto}
.fig-caption{font-size:12px;color:#6b7280;text-align:center;margin-top:10px;font-style:italic}
/* 手绘图 CSS 类（兼容） */
.compare-tbl{width:100%;border-collapse:collapse;font-size:13px}
.compare-tbl th{padding:9px 12px;font-weight:700;font-size:12px;text-align:center}
.compare-tbl td{padding:8px 12px;border:1px solid #e2e8f0;font-size:13px;vertical-align:top;line-height:1.5}
.compare-tbl tr:nth-child(even) td{background:#faf9ff}
.flow-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.flow-node{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;text-align:center;min-width:80px}
.flow-node.light{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#4338ca}
.flow-node.green{background:linear-gradient(135deg,#06d6a0,#059669);color:#fff}
.flow-arrow{color:#a78bfa;font-size:18px;font-weight:700;flex-shrink:0}
.cycle-wrap{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.cycle-step{display:flex;flex-direction:column;align-items:center;gap:4px}
.cycle-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.cycle-label{font-size:11px;color:#374151;text-align:center;max-width:70px;line-height:1.3}
.cycle-arrow{color:#a78bfa;font-size:16px;align-self:flex-start;margin-top:6px}
.stair-wrap{display:flex;align-items:flex-end;gap:8px;padding:8px 0;justify-content:center;flex-wrap:wrap}
.stair-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.stair-bar{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:6px 6px 0 0;width:80px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;padding:4px}
.stair-label{font-size:11px;color:#374151;text-align:center;max-width:80px;line-height:1.3}

/* 域尾提示卡 */
.tips-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tips-card .tc-title{font-size:15px;font-weight:700;margin-bottom:10px;color:#374151}
.tips-card table{font-size:14px}
.tips-card th{padding:9px 12px;font-size:13px}
.tips-card td{padding:9px 12px;font-size:14px;line-height:1.6}

/* ===== 章末练习 quiz-box（模块 10） ===== */
.quiz-box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px;margin:18px 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);scroll-margin-top:78px}
.quiz-hdr{display:flex;align-items:baseline;gap:14px;font-size:18px;font-weight:700;color:#374151;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}
.quiz-score{font-size:14px;font-weight:700;color:#4f46e5;margin-left:auto;white-space:nowrap}
.qi{border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.qi.done{background:#fafafa}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qbadge{background:#ede9fe;color:#5b21b6;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:700}
.qtype{font-size:11px;border-radius:12px;padding:1px 9px;font-weight:600}
.qtype-s{background:#e0f2fe;color:#0369a1}
.qtype-m{background:#fce7f3;color:#be185d}
.qstem{font-size:16px;color:#1e293b;margin-bottom:10px;line-height:1.8}
.qstem code{font-size:13px;color:#4f46e5;background:#f1f5f9;padding:2px 7px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{background:#fff;border:1.5px solid #e2e8f0;border-radius:9px;padding:11px 14px;font-size:15.5px;color:#374151;cursor:pointer;transition:.15s;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:#a78bfa}
.opt .ol{font-weight:700;color:#4f46e5;flex-shrink:0}
.opt.sel{border-color:#4f46e5;background:#ede9fe}
.opt.cor{border-color:#16a34a;background:#dcfce7}
.opt.wrg{border-color:#dc2626;background:#fee2e2}
.opt.shc{border-color:#16a34a;background:#f0fdf4}
.qi.done .opt{cursor:default;pointer-events:none}
.qrow{margin-top:10px;display:flex;align-items:center;gap:12px}
.qbtn{background:#4f46e5;color:#fff;font-size:12px;font-weight:600;border:none;border-radius:7px;padding:7px 18px;cursor:pointer;transition:.15s}
.qbtn:hover{background:#4338ca}
.qbtn:disabled{background:#cbd5e1;cursor:default}
.qres{display:none;flex:1;border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.7}
.qres.ok{background:#dcfce7;color:#15803d}
.qres.err{background:#fee2e2;color:#b91c1c}
.qres.na{background:#fef3c7;color:#b45309}
.qres.show{display:block}
.score-box{display:none;text-align:center;background:#f5f3ff;border-radius:10px;padding:22px 16px;margin-top:16px}
.score-box.show{display:block}
.score-num{font-size:32px;font-weight:700;color:#4f46e5;line-height:1.3}
.score-lbl{font-size:13px;color:#6d28d9;margin-top:4px}
.score-box .sb-tip{font-size:12px;color:#64748b;margin-top:8px;line-height:1.7}

.footer{margin-top:26px;padding:18px 10px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:12.5px;text-align:center;line-height:1.9}
.footer a{color:#4f46e5;text-decoration:none}
@media(max-width:768px){.ptbl th,.ptbl td{font-size:13px}.mdbody th,.mdbody td{font-size:13px}}

/* ===== 章面板 v6 布局：左侧常驻目录槽 + 正文列 =====
   三条布局约定：① 正文 #### 知识点块提升为 h3 三级标题（d.n.m 编号+锚点，见下方 .mh3）
   ② 左侧目录两级（节 ▸ 知识点，单开手风琴 + 滚动自动跟读）③ 左右两侧任何分辨率留白，目录常驻不遮正文：
   ≥1200px：.panel 栅格 [236px 目录槽 | 正文列]，目录 sticky 常驻；<1200px：目录槽变左侧抽屉（☰+遮罩）。 */
body.chapView .wrap{max-width:1420px}
.panel{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start;margin-bottom:14px}
.ch-side{position:sticky;top:14px;min-width:0;z-index:30}
.side-close{display:none}
.toc-open-btn{display:none}
.side-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:85;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.side-mask.show{opacity:1;visibility:visible}
.ch-toc{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 6px 24px rgba(15,23,42,.06);overflow:hidden}
.ch-toc .toc-hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;border-bottom:1px solid #f1f5f9}
.ch-toc .th-title{font-size:13px;font-weight:800;color:#4f46e5;white-space:nowrap}
.ch-toc .th-meta{font-size:11px;color:#94a3b8;font-weight:600;white-space:nowrap}
.ch-toc .toc-body{max-height:calc(100vh - 46px);overflow-y:auto;padding:8px}
.toc-list{list-style:none;margin:0;padding:0}
.toc-list a{display:flex;align-items:baseline;gap:6px;padding:5px 6px;border-radius:7px;color:#475569;text-decoration:none;line-height:1.45;font-size:13px;transition:.12s}
.toc-list a:hover{background:#f5f3ff;color:#4f46e5}
.toc-list a.act{background:#ede9fe;color:#3730a3;font-weight:600}
.toc-list .tl-id{font-size:11.5px;font-weight:700;color:#a78bfa;flex-shrink:0;font-variant-numeric:tabular-nums}
.toc-list a.act .tl-id{color:#4f46e5}
.toc-t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toc-sec>a.toc-sec-link{font-weight:600;color:#334155;padding-top:6px;padding-bottom:6px}
.toc-sec>a .toc-ar{margin-left:auto;flex-shrink:0;font-size:9px;color:#94a3b8;transition:transform .18s}
.toc-sec.open>a .toc-ar{transform:rotate(90deg);color:#4f46e5}
.toc-sub{list-style:none;margin:0;padding:0 0 3px;display:none}
.toc-sec.open>.toc-sub{display:block}
.toc-sub a{padding:3px 6px 3px 20px;font-size:12.5px;color:#64748b;line-height:1.4}
.toc-sub a .tl-id{font-size:11px;color:#c4b5fd}
/* 目录尾【本章练习】入口（v6.2 新增）：独立条目，虚线分隔，点击滚到章末练习区 #quiz-dX */
.toc-quiz{margin-top:7px;padding-top:3px;border-top:1px dashed #ddd6fe}
.toc-quiz>a.toc-quiz-link{font-weight:700;color:#6d28d9;padding-top:6px;padding-bottom:6px}
.toc-quiz>a .tl-id{color:#a78bfa}
.toc-quiz>a.act .tl-id{color:#6d28d9}
@media(max-width:1199px){
  .panel{display:block}
  .ch-side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:90;background:#fff;border-right:1px solid #e2e8f0;box-shadow:0 0 44px rgba(15,23,42,.18);transform:translateX(-102%);transition:transform .22s ease;padding:10px;overflow-y:auto}
  .ch-side.open{transform:none}
  .ch-side .ch-toc{border:none;box-shadow:none;border-radius:0}
  .ch-toc .toc-body{max-height:none;padding-right:4px}
  .toc-open-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid #4f46e5;color:#4f46e5;font-size:12.5px;font-weight:600;border-radius:8px;padding:4px 10px;cursor:pointer;transition:.15s;white-space:nowrap}
  .toc-open-btn:hover{background:#ede9fe}
  .side-close{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:none;background:#f1f5f9;color:#64748b;border-radius:7px;font-size:12px;cursor:pointer;font-weight:700;flex-shrink:0}
  .side-close:hover{background:#e2e8f0;color:#1e293b}
}
/* 阅读进度（吸顶条底部细线 + 百分比）：v6 新增
   注意：此处不再声明 position，78 行的 .ch-topnav{position:sticky;top:0} 保持生效——
   早前版本曾误加 position:relative 覆盖导致吸顶丢失（窄屏换章节要滚回顶），v6.1 已修复 */
.ch-topnav{overflow:hidden}

x;color:var(--primary)}#quizView .glossary-item{padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;line-height:1.6}#quizView .glossary-item:last-child{border:none;padding-bottom:0}#quizView .glossary-term{font-weight:600;color:var(--text)}#quizView .glossary-def{color:var(--text2)}#quizView .explanation.show{display:block}#quizView .explanation .result-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-weight:600;font-size:14px;margin-bottom:10px}#quizView .explanation .result-badge.correct{background:rgba(6,214,160,.15);color:var(--correct)}#quizView .explanation .result-badge.wrong{background:rgba(239,71,111,.15);color:var(--wrong)}#quizView .explanation .exp-text{font-size:14px;line-height:1.7;color:var(--text2)}#quizView .explanation .exp-source{font-size:12px;color:var(--text2);margin-top:8px;font-style:italic}#quizView .qnav{background:var(--card);border-radius:12px;padding:12px;border:1px solid var(--border);margin-top:12px}#quizView .qnav h4{font-size:13px;color:var(--text2);margin-bottom:8px}#quizView .qnav-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}#quizView .qnav-item{aspect-ratio:1;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;transition:.2s;background:var(--bg)}#quizView .qnav-item:hover{border-color:var(--primary)}#quizView .qnav-item.done-correct{background:var(--correct);color:#fff;border-color:var(--correct)}#quizView .qnav-item.done-wrong{background:var(--wrong);color:#fff;border-color:var(--wrong)}#quizView .qnav-item.current{border-color:var(--primary);border-width:2px;font-weight:700}#quizView .wrong-stats{display:flex;gap:12px;margin-bottom:16px}#quizView .wrong-stats .stat-card{flex:1}#quizView .wrong-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}#quizView .wrong-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:13px;cursor:pointer}#quizView .wrong-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}#quizView .wrong-item{padding:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px}#quizView .wrong-item .wi-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}#quizView .wrong-item .wi-domain{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--border)}#quizView .wrong-item .wi-actions{display:flex;gap:8px;margin-top:8px}#quizView .wrong-item .wi-actions button{font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--text)}#quizView .wrong-item .wi-actions button:hover{background:var(--border)}#quizView .stats-chart{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}#quizView .stats-chart h3{font-size:14px;margin-bottom:12px}#quizView canvas{width:100%!important;height:200px!important;border-radius:8px}#quizView .stats-table{width:100%;border-collapse:collapse;font-size:13px}#quizView .stats-table th, #quizView .stats-table td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--border)}#quizView .stats-table th{color:var(--text2);font-weight:500}#quizView .settings-section{margin-bottom:20px}#quizView .settings-section h3{font-size:15px;margin-bottom:12px;color:var(--text2)}#quizView .setting-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;cursor:pointer;width:100%;font-size:14px;color:var(--text);margin-bottom:8px;transition:.2s}#quizView .setting-btn:hover{border-color:var(--primary)}#quizView .setting-btn.danger{color:var(--wrong)}#quizView .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:.3s}#quizVi // 题库数据注入区（构建系统自动注入，含考试元信息与题目全集，勿手改）
const QUIZ_META = {"exam":"AIP-C01","title":"AWS Certified Generative AI Developer 题库","lang":"zh","updated":"2026-09-13","domains":{"1":"基础模型集成、数据管理与合规性","2":"实施与集成","3":"AI 安全、保障与治理","4":"GenAI 应用的运营效率与优化","5":"测试、验证与故障排除"},"weights":{"1":"31%","2":"26%","3":"20%","4":"12%","5":"11%"},"examParams":{"count":65,"minutes":180,"pass":750},"footerNote":"题库来源：自建题库（98 题）+ 第三方公开练习题整理改写（248 题），共 346 题；以 AWS 官方学习材料为准；Domain 按官方考纲划分","glossary":{"基础模型":"Foundation Model (FM) - 基础模型。在海量数据上预训练的大规模模型，可针对多种下游任务微调或直接使用。","FM":"Foundation Model (FM) - 基础模型。在海量数据上预训练的大规模模型。","RAG":"Retrieval Augmented Generation - 检索增强生成。生成前从外部知识库检索相关信息，减少幻觉、提升准确性与时效性。","向量嵌入":"Vector Embedding - 向量嵌入。把文本/图像转成高维数值向量，语义相近者距离更近。","提示工程":"Prompt Engineering - 提示工程。通过设计角色/上下文/示例/约束来引导模型输出。","微调":"Fine-tuning - 微调。在预训练模型基础上用特定数据集继续训练，以适配特定任务。","Agent":"Agent - 智能体。能感知环境、自主规划并调用工具完成目标任务的 AI 系统。","分块":"Chunking - 分块。把长文档切成检索单元，是 RAG 检索质量的第一个决定因素。"},"version":"v1.4（题库 346 题）"};
const QUIZ_QUESTIONS = [{"id":"D1-001","d":1,"t":"single","q":"一家媒体公司需要对 50TB 的视频转录文本实现 RAG，并支持实时更新。哪种方法能提供最佳性能？","o":[{"l":"A","t":"Amazon Bedrock Knowledge Bases 配合增量同步和 OpenSearch Serverless"},{"l":"B","t":"使用 SageMaker Processing 作业和 Amazon Neptune 的自定义管道"},{"l":"C","t":"使用 Kinesis Data Streams 和 DynamoDB 向量存储的实时流式处理"},{"l":"D","t":"使用 AWS Glue 和自管理 Elasticsearch 的批处理"}],"a":["A"],"e":"**正确答案：A。** 用 Amazon Bedrock Knowledge Bases（Bedrock 知识库）托管整套 RAG，数据源开启增量同步，向量库选 Amazon OpenSearch Serverless（OpenSearch 无服务器版）。\n\n**为什么对：** 题干两个硬约束——50TB 规模、支持实时更新。增量同步只处理新增和变更的对象，不用每次全量重建索引，正对上\"实时\"；OpenSearch Serverless 按容量自动伸缩，扛得住 50TB 量级的向量检索，集群不用你自己管。\n\n**其他选项为什么错：**\n- B. SageMaker Processing + Neptune：Neptune 是图数据库，不做向量相似度检索，用它做 RAG 得自己写嵌入生成和近邻搜索，属于全自建管道。\n- C. Kinesis Data Streams + DynamoDB 存向量：DynamoDB 没有原生的向量相似度检索能力，近邻搜索要在应用层自己实现，这个数据规模下撑不住。\n- D. AWS Glue + 自管理 Elasticsearch：Glue 是批处理 ETL，做不到实时更新；自管理 Elasticsearch 还要自己运维集群。","s":"源#1"},{"id":"D1-002","d":1,"t":"single","q":"你的 RAG 系统需要处理 15 种语言的文档，并支持按语言检索。哪种嵌入策略最佳？","o":[{"l":"A","t":"使用单一多语言嵌入模型，配合语言元数据过滤"},{"l":"B","t":"使用按语言区分的嵌入模型，每种语言使用独立的向量索引"},{"l":"C","t":"先翻译成英文再嵌入，并追踪源语言"},{"l":"D","t":"使用 Multilingual BERT 进行跨语言对齐和统一搜索"}],"a":["B"],"e":"**正确答案：B。** 每种语言配一个专门的嵌入模型，各自建一条独立的向量索引。\n\n**为什么对：** 题干要求\"按语言检索\"。单语嵌入模型在自家语种上的语义刻画比多语言模型更准；分索引存放之后，检索天然落在同一语种内，不会跨语种串召回，也省掉额外的过滤步骤。\n\n**其他选项为什么错：**\n- A. 单一多语言模型 + 语言元数据过滤：多语言模型为兼容多语种会压缩语义空间，单语精度不如专用模型；元数据过滤是事后筛，候选池里仍然混着别的语种。\n- C. 先翻译成英文再嵌入：多一道翻译就多一层误差和延迟，而且翻译会把原语种特有的术语翻没了。\n- D. Multilingual BERT 跨语言对齐：mBERT 做的是跨语言对齐，目标是\"用中文查英文\"这类跨语种检索，跟本题\"按语言隔离\"的方向正好相反。","s":"源#2"},{"id":"D1-003","d":1,"t":"single","q":"一家律师事务所要求 RAG 在 EU 区域内实现严格的数据驻留，并为所有查询提供审计追踪。哪种配置满足这些要求？","o":[{"l":"A","t":"在 eu-west-1 部署 Bedrock Knowledge Bases，配合 CloudTrail 和 VPC 端点"},{"l":"B","t":"在 eu-central-1 使用自管理方案和自定义审计日志"},{"l":"C","t":"多区域部署，带数据复制和集中式日志"},{"l":"D","t":"在 us-east-1 使用 Bedrock，带数据加密和访问日志"}],"a":["A"],"e":"**正确答案：A。** 把 Amazon Bedrock Knowledge Bases（Bedrock 知识库）部署在 EU 区域（eu-west-1），用 AWS CloudTrail 记录审计，通过 VPC endpoint（VPC 端点）走私有网络。\n\n**为什么对：** 三个要求一一对应。数据驻留——Bedrock 在 eu-west-1 内完成推理，数据不出 EU；审计追踪——CloudTrail 记录所有 API 调用；私有访问——VPC 端点让流量走 AWS 骨干网，不经公网。\n\n**其他选项为什么错：**\n- B. eu-central-1 自管理 + 自定义审计日志：区域合规，但自己写的日志不能替代平台级审计凭证，而且自建 RAG 的成本和复杂度都上去了。\n- C. 多区域部署 + 数据复制：把数据复制到 EU 之外的数据中心，直接违反数据驻留，多加日志也补不回来。\n- D. us-east-1 + 加密和访问日志：区域在美国，第一条就不满足；加密和访问日志解决不了\"数据在哪里处理\"。","s":"源#3"},{"id":"D1-004","d":1,"t":"single","q":"你的分块（chunking）策略在不同文档类型（PDF、Word、HTML）之间产生不一致的结果。哪种方法是最优的？","o":[{"l":"A","t":"按文档类型定制分块，统一生成嵌入"},{"l":"B","t":"基于内容结构的语义分块，不依赖文档格式"},{"l":"C","t":"固定大小分块，按文档类型调整重叠"},{"l":"D","t":"层级分块，带父子关系和元数据"}],"a":["B"],"e":"**正确答案：B。** 按内容自身的语义结构切块（semantic chunking），不看文件是 PDF、Word 还是 HTML。\n\n**为什么对：** 不一致的根源是\"按格式切\"——PDF 按页、Word 按段落、HTML 按标签，规则天生不同。语义分块按标题层级、段落主题和句子边界来切，切法与文件类型无关，三种格式出来的块才可能一致。\n\n**其他选项为什么错：**\n- A. 按文档类型分别定制分块：等于给每种格式写一套规则，恰恰是\"不一致\"的来源，而且规则越多越难维护。\n- C. 固定大小分块 + 按类型调重叠：差异只是被参数掩盖，跨类型的一致性没有真正解决。\n- D. 层级分块（父子块）：解决的是\"召回粒度小、上下文不够\"的矛盾，不是跨格式一致性；父子关系在三种格式里同样难统一。","s":"源#4"},{"id":"D1-005","d":1,"t":"single","q":"一个 RAG 系统出现 40% 的不相关检索结果。当前配置使用 512-token 块和 50-token 重叠。哪种优化能带来最大改进？","o":[{"l":"A","t":"将块大小增加到 1024 token，重叠减少到 25 token"},{"l":"B","t":"实现语义分块并保留句子边界"},{"l":"C","t":"添加元数据丰富化和混合搜索（语义+关键词匹配）"},{"l":"D","t":"改用更小的块（256 token）并增加重叠（100 token）"}],"a":["C"],"e":"**正确答案：C。** 给每个块补上元数据（来源、时间、业务线等）用于检索前过滤，同时把语义检索和关键词检索一起用（hybrid search，混合搜索）。\n\n**为什么对：** 40% 不相关，说明问题出在召回这一跳，不是块大小。混合搜索同时用\"语义相近\"和\"关键词命中\"两个信号，能把纯向量检索漏掉的精确术语捞回来；元数据过滤则在检索前就收窄范围。两条加起来才动到根因。\n\n**其他选项为什么错：**\n- A. 块调大到 1024 token、重叠降到 25：块越大塞进的无关内容越多，重叠变小还会切断跨块语义，通常让相关性更差。\n- B. 语义分块 + 保留句子边界：能改善块本身的质量，但对\"检索到语义相近却答非所问\"这类问题帮助有限。\n- D. 块调小到 256 token、重叠加到 100：小块丢上下文，存储冗余还变多，不解决召回错。","s":"源#5"},{"id":"D1-006","d":1,"t":"single","q":"你需要为包含复杂图表和代码片段的技术文档实现 RAG。哪种方法最适合处理多模态内容？","o":[{"l":"A","t":"仅提取文本，使用传统 RAG 并配合代码语法高亮"},{"l":"B","t":"使用 Amazon Bedrock Data Automation 配合 Nova 模型进行统一处理"},{"l":"C","t":"对文本、图像和代码分别处理，并建立交叉引用"},{"l":"D","t":"使用 Amazon Textract 的自定义 OCR 管道和手动内容关联"}],"a":["B"],"e":"**正确答案：B。** 用 Amazon Bedrock Data Automation（BDA，Bedrock 数据自动化）配合 Amazon Nova 模型统一抽取。\n\n**为什么对：** BDA 是托管的内容抽取服务，带多模态理解能力，能把正文、图表和代码块一次性转成结构化内容再入索引，不用自己拼三条管道。\n\n**其他选项为什么错：**\n- A. 只抽文本 + 代码语法高亮：图表信息直接丢了，题干明确要求处理多模态内容。\n- C. 文本/图像/代码分别处理再交叉引用：能做，但要自建三套管道加一套对齐逻辑，工作量和一致性风险都高。\n- D. Amazon Textract 自定义 OCR + 手工关联：Textract 主要做文字和表单抽取，理解不了图表的含义，\"手工关联\"也不可扩展。","s":"源#6"},{"id":"D1-007","d":1,"t":"single","q":"一个金融服务 RAG 系统需要维护监管文档的版本控制，并支持历史查询。哪种架构支持此需求？","o":[{"l":"A","t":"带版本控制的 Amazon S3 存储桶，配合基于时间 metadata 过滤的 Knowledge Bases 检索配置"},{"l":"B","t":"基于 Git 的文档管理，自动更新 Knowledge Base"},{"l":"C","t":"Knowledge Bases 中的文档版本管理，带时间查询参数"},{"l":"D","t":"每个文档版本使用独立的 Knowledge Base，统一查询接口"}],"a":["A"],"e":"**正确答案：A。** 数据源用开启 versioning（版本控制）的 Amazon S3 存储桶保存每个历史版本，再让各版本分别同步进 Amazon Bedrock Knowledge Bases（Bedrock 知识库），并给每份文档打上时间 metadata；检索时用 metadata filtering（元数据过滤）按时间条件筛出目标版本。\n\n**为什么对：** 题干两个要求——\"版本控制\"和\"历史查询\"，分别对应两侧的机制。\n- 版本控制：S3 versioning 把每次覆盖和删除都留成历史对象，旧版本一直在，这是\"旧内容还在不在\"的前提。\n- 历史查询：Knowledge Bases 本身没有版本概念，Retrieve / RetrieveAndGenerate API 也没有时间点参数；能做到的路径是——各版本文档分别入库，用文档级 `.metadata.json` 写入生效时间，检索时按 metadata 范围条件（`greaterThan` / `lessThan` 等，接受 ISO-8601 时间值）过滤出目标版本。\n两段合起来，历史时点的文档可以被精确召回。\n\n**其他选项为什么错：**\n- B. Git 管文档 + 自动更新知识库：Git 只保留源文件的历史，同步进知识库的永远是最新版，检索不到历史时点的内容。\n- C. 知识库内建文档版本管理 + 时间查询参数：Knowledge Bases 不提供文档版本管理，检索 API 也没有时间点参数，这个选项描述的能力不存在。\n- D. 每个文档版本建独立知识库：版本一多知识库数量就膨胀，同步、成本和维护都不现实；用 metadata 区分版本不需要多建知识库。\n\n**关键概念：** 版本控制由数据源侧（Amazon S3 versioning）保证，时间维度由 metadata 侧（文档级 `.metadata.json` + metadata filtering 范围运算符）实现——内置字段 `epoch_modification_time` 记录文档最后更新时间，可直接作过滤条件。参考：Amazon Bedrock User Guide《Knowledge Bases》metadata filtering 章节。","s":"源#7"},{"id":"D1-008","d":1,"t":"single","q":"你的 RAG 检索延迟在 1000 万文档语料上平均为 3 秒。哪种优化能显著降低延迟？","o":[{"l":"A","t":"实现近似最近邻搜索，降低精度"},{"l":"B","t":"为频繁访问的嵌入添加 Redis 缓存层"},{"l":"C","t":"优化向量数据库配置并增加计算资源"},{"l":"D","t":"为常见查询模式预先计算并缓存嵌入"}],"a":["D"],"e":"**正确答案：D。** 把高频出现的查询先算好嵌入缓存起来，命中时直接跳过嵌入生成这一步。\n\n**为什么对：** 3 秒的构成里，查询侧调用嵌入模型是固定开销且完全可以省掉。预计算并缓存等于把这一跳拿掉，对高频查询模式是见效最快的办法。\n\n**其他选项为什么错：**\n- A. 换近似最近邻（ANN）牺牲精度：千万级向量库基本已经在用 ANN，再降精度是拿召回质量换时间，而且不是延迟的大头。\n- B. 加 Redis 缓存频繁访问的嵌入：缓存的是文档侧嵌入，省下的是读取开销，查询侧那次模型调用还在。\n- C. 优化向量库配置 + 加资源：能摊薄但治标，成本还直线上升。","s":"源#8"},{"id":"D1-009","d":1,"t":"single","q":"一个医疗保健 RAG 系统需要处理患者记录，并严格符合 HIPAA 合规要求。哪种数据处理方法确保合规？","o":[{"l":"A","t":"本地处理，通过加密传输到 Bedrock"},{"l":"B","t":"在专用 VPC 中使用 AWS PrivateLink 连接 Bedrock，并进行静态加密"},{"l":"C","t":"处理前进行数据匿名化，并维护审计追踪"},{"l":"D","t":"混合方案：仅在本地处理敏感数据"}],"a":["B"],"e":"**正确答案：B。** 在专有 VPC 内通过 AWS PrivateLink 访问 Amazon Bedrock，并对静态数据做加密（encryption at rest）。\n\n**为什么对：** 三条都落在合规硬要求上。PrivateLink 让流量走 AWS 内网，不经公网；VPC 做网络隔离；静态加密覆盖存储层。这是 AWS 上做 HIPAA 场景的标准网络加加密组合。\n\n**其他选项为什么错：**\n- A. 本地处理 + 加密传输到 Bedrock：数据最终还是要送到 Bedrock 做推理，本地处理改变不了这一点，而且\"加密传输\"只覆盖传输这一段。\n- C. 处理前匿名化 + 审计追踪：匿名化是数据侧手段，没解决传输和存储的隔离；去标识化后的数据也仍存在被重识别的可能。\n- D. 混合方案只在本地处理敏感数据：等于放弃用 Bedrock 处理核心数据，跟题干\"用 RAG 处理患者记录\"的目标冲突。","s":"源#9"},{"id":"D1-010","d":1,"t":"single","q":"你正在为多租户 SaaS 应用实现 RAG。每个租户需要隔离的数据访问。哪种架构提供安全的租户隔离？","o":[{"l":"A","t":"单一 Knowledge Base，配合租户特定元数据过滤"},{"l":"B","t":"每个租户独立的 Knowledge Base，配合 IAM 访问控制"},{"l":"C","t":"共享 Knowledge Base，应用层访问控制"},{"l":"D","t":"租户特定 S3 桶，配合统一 Knowledge Base 和行级安全"}],"a":["B"],"e":"**正确答案：B。** 每个租户一套独立的 Amazon Bedrock Knowledge Bases（Bedrock 知识库），用 AWS IAM 做访问控制。\n\n**为什么对：** 隔离强度上，一个租户一套资源再加 IAM 策略，是从基础设施层切断跨租户访问——A 租户的凭证根本拿不到 B 租户的数据，不依赖应用代码写对。\n\n**其他选项为什么错：**\n- A. 单一知识库 + 租户元数据过滤：过滤在应用层做，条件写错或漏写一次就是越权，隔离完全依赖代码正确性。\n- C. 共享知识库 + 应用层访问控制：同上，而且连元数据这一层强制边界都没有，风险比 A 更高。\n- D. 租户独立 S3 桶 + 统一知识库 + 行级安全：桶分开了但知识库是统一的，检索时仍靠行级规则区分，隔离点还是在应用层。","s":"源#10"},{"id":"D1-011","d":1,"t":"single","q":"你的向量数据库在对超过 1 亿个嵌入进行相似性搜索时性能下降。哪种优化策略最有效？","o":[{"l":"A","t":"实现分层可导航小世界（HNSW）索引"},{"l":"B","t":"使用乘积量化降低嵌入维度"},{"l":"C","t":"按内容类型分区向量，并行执行搜索"},{"l":"D","t":"实现局部敏感哈希（LSH）进行近似搜索"}],"a":["A"],"e":"**正确答案：A。** 换成 HNSW（Hierarchical Navigable Small World，分层可导航小世界）索引。\n\n**为什么对：** HNSW 用多层近邻图做导航，检索时只在图上做局部遍历，复杂度接近对数级。亿级向量下仍能保持高召回和毫秒级响应，是大规模向量检索的主流索引类型。\n\n**其他选项为什么错：**\n- B. 乘积量化（PQ）降维：PQ 是压缩向量的手段，主要省内存和带宽，代价是精度损失，本身不改善检索速度的量级。\n- C. 按内容类型分区并行搜索：要求查询能预先确定落在哪个分区，而且分区数据不均时收益很不稳定，通用性差。\n- D. 局部敏感哈希（LSH）：同为近似检索方案，但在需要高召回的区间里，HNSW 的速度与精度平衡明显更好。","s":"源#11"},{"id":"D1-012","d":1,"t":"single","q":"一个 RAG 系统需要同时支持语义搜索和关键词搜索，并融合结果。哪种实现提供最佳相关性？","o":[{"l":"A","t":"独立的向量和关键词索引，加权组合得分"},{"l":"B","t":"同时编码语义和词法信息的混合嵌入"},{"l":"C","t":"并行搜索，基于机器学习进行结果排序"},{"l":"D","t":"顺序搜索，按关键词相关性过滤语义结果"}],"a":["A"],"e":"**正确答案：A。** 语义走向量索引、关键词走全文索引，两路结果的排名做加权合并，典型做法是 RRF（Reciprocal Rank Fusion，倒数排名融合）。\n\n**为什么对：** 两种检索的分数不在同一量纲，直接相加没有意义，用排名融合才合理；两路索引还能各自独立调优，语义侧换模型、关键词侧调分词互不影响。\n\n**其他选项为什么错：**\n- B. 混合嵌入同时编码语义和词法信息：这类模型确实存在，但把两种信号压进同一个向量后权重不可调，做不到题干要求的\"融合结果\"。\n- C. 并行搜索 + 机器学习重排序：等于引入一个需要训练和持续维护的排序模型，成本高，也不是必须的。\n- D. 顺序搜索、先语义后关键词过滤：第二路是在第一路结果上做减法，会漏掉那些语义不近但关键词精确命中的文档。","s":"源#12"},{"id":"D1-013","d":1,"t":"single","q":"你需要将 5 亿个嵌入从 Pinecone 迁移到 OpenSearch Serverless，且零停机。最佳迁移策略是什么？","o":[{"l":"A","t":"双写方法，逐步迁移流量并验证一致性"},{"l":"B","t":"批量导出/导入，迁移期间临时只读模式"},{"l":"C","t":"实时复制，最终一致性，支持回滚"},{"l":"D","t":"蓝绿部署，全量数据同步后通过 DNS 切换"}],"a":["A"],"e":"**正确答案：A。** 迁移期间同时写两边（双写），读流量按比例逐步从 Pinecone 切到 Amazon OpenSearch Serverless（OpenSearch 无服务器版），每一步都做一致性校验。\n\n**为什么对：** 零停机的关键是\"任何时刻两边都能对外服务\"。双写保证切流过程中的新数据两边都有；灰度切流量让问题在小比例时暴露；一致性校验是切之前发现差异的兜底手段。\n\n**其他选项为什么错：**\n- B. 批量导出/导入 + 临时只读：只读就是停机，5 亿向量的导入时长根本不可接受。\n- C. 实时复制 + 最终一致性 + 支持回滚：一致性窗口内两边结果不同，灰度期间用户会看到结果跳变；\"支持回滚\"也没说清写入怎么处理。\n- D. 蓝绿全量同步后 DNS 切换：全量同步完成前的增量写入会丢，切换又是瞬时的，一旦出问题影响的是全量流量。","s":"源#13"},{"id":"D1-014","d":1,"t":"single","q":"你的嵌入模型产生 1536 维向量，但存储成本过高。哪种降维方法能保持检索质量？","o":[{"l":"A","t":"使用主成分分析（PCA）降至 768 维"},{"l":"B","t":"使用更小的 384 维嵌入模型并微调"},{"l":"C","t":"使用 8-bit 精度编码的向量量化"},{"l":"D","t":"稀疏嵌入，选择 top-k 特征并压缩"}],"a":["C"],"e":"**正确答案：C。** 把 32 位浮点向量压成 8 位整数，也就是 scalar quantization（标量量化）。\n\n**为什么对：** 从 32 位降到 8 位，存储直接省约 75%，而向量之间的相对距离关系基本保持不变，检索质量损失很小。这是在\"尽量保住质量\"的前提下最直接的降本手段。\n\n**其他选项为什么错：**\n- A. PCA 降到 768 维：PCA 是有损的线性投影，会丢掉原始嵌入空间里的一部分语义信息，而且所有历史向量都要重新算一遍。\n- B. 换 384 维模型并微调：等于换嵌入模型，全部文档必须重新生成嵌入，成本远高于量化，效果还不确定。\n- D. 稀疏嵌入取 top-k 压缩：这会把稠密检索变成稀疏检索，不是同一条质量基线上的优化，不可直接比较。","s":"源#14"},{"id":"D1-015","d":1,"t":"single","q":"一个多模态 RAG 系统需要跨文本、图像和音频嵌入进行统一搜索。哪种架构支持跨模态检索？","o":[{"l":"A","t":"独立的嵌入空间，学习跨模态相似性"},{"l":"B","t":"使用多模态基础模型的统一嵌入空间"},{"l":"C","t":"模态特定索引，查询时使用学习权重融合"},{"l":"D","t":"层级嵌入结构，带模态特定子空间"}],"a":["B"],"e":"**正确答案：B。** 用一个多模态基础模型，把文本、图像、音频都映射到同一个嵌入空间。\n\n**为什么对：** 跨模态检索的前提是\"不同模态之间可比\"。在统一嵌入空间里，一张图和一句准确描述它的文字落在相近的位置，直接算余弦相似度就能互查，不需要额外的映射层。\n\n**其他选项为什么错：**\n- A. 各自独立的嵌入空间 + 学习跨模态相似性：等于自己训练一个对齐层，工作量不小且效果难保证，题干问的是架构选型不是自研方案。\n- C. 分模态索引 + 查询时加权融合：要为每种模态组合设定权重，权重既不可学习也难调优，而且不是真正的统一搜索。\n- D. 层级嵌入结构 + 模态子空间：子空间之间依然是隔离的，跨模态比较前还是要做一次映射，本质上回到了 A。","s":"源#15"},{"id":"D1-016","d":1,"t":"single","q":"你的向量搜索返回语义相似但上下文不相关的结果。哪种技术能改善上下文相关性？","o":[{"l":"A","t":"实现带文档级信息的上下文嵌入"},{"l":"B","t":"基于文档新近度和相关性添加时间权重"},{"l":"C","t":"使用查询扩展和上下文关键词过滤"},{"l":"D","t":"使用交叉编码器模型进行重排序以匹配上下文"}],"a":["D"],"e":"**正确答案：D。** 先用向量检索召回候选集，再用 cross-encoder（交叉编码器）对\"查询-文档\"逐对打分重排。\n\n**为什么对：** 双编码器把查询和文档各自独立编码，算的是\"整体像不像\"，抓不住\"这个文档到底有没有回答这个问题\"。交叉编码器把两者拼在一起过一遍模型，直接判断相关性，所以能修掉\"语义相近但答非所问\"。\n\n**其他选项为什么错：**\n- A. 带文档级信息的上下文嵌入：改善的是\"块本身缺上下文\"（比如块里没有标题），不是\"检索到了不相关的块\"。\n- B. 按新近度和相关性加时间权重：只调整排序偏好，不改变相关性判断本身。\n- C. 查询扩展 + 上下文关键词过滤：查询扩展会引入更多语义相近的词，反而可能加重\"相似但不相关\"的情况。","s":"源#16"},{"id":"D1-017","d":1,"t":"single","q":"一个 RAG 系统在模型更新后出现嵌入漂移。哪种监控方法能检测并缓解漂移？","o":[{"l":"A","t":"监控新旧嵌入之间的余弦相似性并告警"},{"l":"B","t":"使用评估数据集和质量指标比较查询结果"},{"l":"C","t":"使用统计漂移检测方法分析嵌入分布"},{"l":"D","t":"跨模型版本比较检索质量的 A/B 测试框架"}],"a":["C"],"e":"**正确答案：C。** 对嵌入向量的分布本身做统计漂移检测（drift detection），持续比较新旧嵌入的分布差异。\n\n**为什么对：** 换模型之后整个向量空间都变了，这是分布层面的系统性偏移。盯住分布本身，能在检索质量指标还没明显下滑时就发现苗头，留出主动处理的时间。\n\n**其他选项为什么错：**\n- A. 监控新旧嵌入的余弦相似性并告警：换模型后两个向量空间不可比，相似度低不代表检索质量差，告警会全是噪音。\n- B. 用评估数据集比较查询结果：这属于质量监控，能发现\"结果变差了\"，但发现得晚，也定位不到是分布漂移。\n- D. 跨模型版本做 A/B 测试：A/B 是上线前的对比手段，不是持续运行的漂移检测机制。","s":"源#17"},{"id":"D1-018","d":1,"t":"single","q":"你需要对 5000 万嵌入语料实现增量更新，且无需完全重建索引。哪种方法最有效？","o":[{"l":"A","t":"带版本化嵌入的增量更新，延迟删除过期向量"},{"l":"B","t":"流式更新，实时维护索引并做一致性检查"},{"l":"C","t":"批处理，局部重建索引并热切换"},{"l":"D","t":"预写日志，定期整合和优化索引"}],"a":["A"],"e":"**正确答案：A。** 增量写入带版本号的新向量，过期向量先打删除标记，攒到一定量再统一清理。\n\n**为什么对：** 增量更新只动变更部分，绕开了全量重建；给向量带版本号能区分新旧，避免读到替换到一半的中间态；延迟删除把零散的删除操作攒成批量，省掉反复整理索引的开销。\n\n**其他选项为什么错：**\n- B. 流式更新 + 实时维护索引 + 一致性检查：实时维护索引的代价就是频繁整理，5000 万量级下写入放大很明显。\n- C. 批处理 + 局部重建 + 热切换：局部重建仍然是重建，还要维护新旧两套索引并存，成本更高。\n- D. 预写日志（WAL）+ 定期整合：WAL 解决的是写入可靠性，整合阶段还是得动索引，没绕开重建。","s":"源#18"},{"id":"D1-019","d":1,"t":"single","q":"一个向量数据库需要同时支持精确搜索和近似搜索，并允许配置精度-召回权衡。哪种实现提供这种灵活性？","o":[{"l":"A","t":"可配置的 HNSW 参数，运行时调整精度"},{"l":"B","t":"多种索引类型，查询时按需选择"},{"l":"C","t":"自适应搜索算法，根据查询复杂度调整精度"},{"l":"D","t":"层级搜索，高精度查询时回退到精确搜索"}],"a":["A"],"e":"**正确答案：A。** 用 HNSW 索引，把 ef_search（检索时的候选队列长度）这类参数做成可运行时调整的配置。\n\n**为什么对：** HNSW 的检索精度不是建索引时定死的——ef_search 越大，遍历的候选越多、召回越高、延迟越大。把它做成运行时参数，同一套索引就能在\"要精确\"和\"要快\"之间滑动，不必维护两套索引。\n\n**其他选项为什么错：**\n- B. 建多种索引类型、查询时选一种：要维护多份索引，存储和维护成本翻倍，还得自己写路由规则。\n- C. 自适应算法按查询复杂度调精度：复杂度很难准确预估，行为不可预测，调用方也无法明确指定要什么精度。\n- D. 层级搜索、高精度时回退到精确搜索：精确搜索在大数据量下是线性扫描，一回退就等于放弃性能。","s":"源#19"},{"id":"D1-020","d":1,"t":"single","q":"你的 RAG 系统需要处理 100+ 种语言的嵌入，并支持跨语言检索。哪种嵌入策略是最优的？","o":[{"l":"A","t":"语言特定模型，使用平行语料进行跨语言对齐"},{"l":"B","t":"多语言句子变换器，统一嵌入空间"},{"l":"C","t":"基于翻译的方法，使用英文嵌入和查询翻译"},{"l":"D","t":"语言无关嵌入，使用字符级编码和注意力机制"}],"a":["B"],"e":"**正确答案：B。** 用多语言句子嵌入模型（multilingual sentence embedding model），把 100 多种语言映射到同一个嵌入空间。\n\n**为什么对：** 跨语言检索要的是\"用中文提问、召回英文文档\"。统一嵌入空间里，语义相同的内容不管什么语言都落在相近位置，直接算相似度就能跨语言召回，中间不需要翻译这一步。\n\n**其他选项为什么错：**\n- A. 语言特定模型 + 平行语料对齐：光做对齐就要准备大量平行语料，100 多种语言的语种组合根本铺不开。\n- C. 基于翻译、统一用英文嵌入：查询和文档都要过一遍翻译，成本和延迟都扛不住，翻译误差还会累积。\n- D. 字符级编码 + 注意力机制：字符级模型对长文本语义的刻画远不如句子级嵌入，不是主流做法。","s":"源#20"},{"id":"D1-021","d":1,"t":"single","q":"一个文档处理管道每天需要处理 10,000 份包含复杂布局和表格的 PDF。哪种方法能确保准确的文本提取？","o":[{"l":"A","t":"Amazon Textract 配合自定义后处理以保留表格结构"},{"l":"B","t":"基于机器学习的 OCR 布局分析和内容重建"},{"l":"C","t":"Amazon Bedrock Data Automation，理解文档结构"},{"l":"D","t":"多阶段处理，不同内容类型使用专用工具"}],"a":["C"],"e":"**正确答案：C。** 用 Amazon Bedrock Data Automation（BDA，Bedrock 数据自动化）做文档理解。\n\n**为什么对：** 题干的难点是\"复杂布局和表格\"——不只是把字认出来，还得知道哪一块是表格、单元格怎么归属。BDA 直接用模型理解文档结构、输出结构化结果，不用你再写一套后处理去拼表格。\n\n**其他选项为什么错：**\n- A. Amazon Textract + 自定义后处理保留表格结构：Textract 能抽出表格，但还原成结构化数据得自己写后处理，1 万份/天的量级下维护成本很高。\n- B. 机器学习 OCR + 布局分析重建：等于自研一套文档理解系统，投入远超必要。\n- D. 多阶段、不同内容类型用专用工具：管道一长，中间格式的衔接和错误处理会越来越复杂。","s":"源#21"},{"id":"D1-022","d":1,"t":"single","q":"你的提示工程流程缺乏版本控制和 A/B 测试能力。哪个框架提供全面的提示管理？","o":[{"l":"A","t":"Amazon Bedrock Prompt Management，带版本化和评估工作流"},{"l":"B","t":"基于 Git 的提示版本控制和自定义 A/B 测试基础设施"},{"l":"C","t":"MLflow 提示跟踪，自动评估和部署"},{"l":"D","t":"自定义提示注册表，带元数据跟踪和性能分析"}],"a":["A"],"e":"**正确答案：A。** 用 Amazon Bedrock Prompt Management（Bedrock 提示管理）做提示的版本化、评估和 A/B 对比。\n\n**为什么对：** 题干要的三件事——版本控制、A/B 测试、评估，Prompt Management 是原生一起提供的：提示可以存多个版本随时回滚，评估工作流负责跑分，A/B 直接对比版本差异。\n\n**其他选项为什么错：**\n- B. Git 管提示版本 + 自建 A/B 基础设施：Git 只能管文本版本，A/B 的流量分配和指标收集全得自己搭。\n- C. MLflow 提示跟踪：MLflow 主要是实验跟踪工具，跟 Bedrock 上的提示没有原生集成，评估流程还得自己接。\n- D. 自定义提示注册表：版本和元数据能存下来，但评估工作流和 A/B 仍是空白，要自己补。","s":"源#22"},{"id":"D1-023","d":1,"t":"single","q":"一个 RAG 系统对相似查询产生不一致的响应。哪种提示工程技术能改善一致性？","o":[{"l":"A","t":"少样本提示，带多样示例和一致的格式模板"},{"l":"B","t":"思维链提示，带显式推理步骤和验证"},{"l":"C","t":"带变量替换和标准化指令的提示模板"},{"l":"D","t":"带自我反思和一致性检查机制的元提示"}],"a":["C"],"e":"**正确答案：C。** 把提示做成固定模板，只替换变量部分，指令和输出格式的描述保持逐字一致。\n\n**为什么对：** 不一致的根源是\"每次送进去的提示本身就不一样\"。模板化后，指令、约束、输出格式每次都完全相同，只有变量在变，模型的输出分布自然就稳定了。\n\n**其他选项为什么错：**\n- A. 少样本提示 + 格式模板：示例能引导输出风格，但提示骨架不固定，措辞漂移这个根因还在。\n- B. 思维链提示（chain-of-thought）：提升的是推理正确率不是一致性，而且推理路径每次还可能不同。\n- D. 元提示 + 自我反思：多一轮模型调用，自我反思本身又会引入新的不确定性。","s":"源#23"},{"id":"D1-024","d":1,"t":"single","q":"你需要优化提示以降低成本，同时保持质量。当前提示平均为 2000 token。哪种策略能带来最大节省？","o":[{"l":"A","t":"使用学习压缩模型和关键信息提取进行提示压缩"},{"l":"B","t":"根据查询复杂度和所需细节动态生成提示"},{"l":"C","t":"基于模板的提示，带变量内容插入和上下文剪枝"},{"l":"D","t":"层级提示，根据初始响应质量逐步添加细节"}],"a":["A"],"e":"**正确答案：A。** 用学习式压缩方法对提示做压缩，只保留对任务真正关键的信息。\n\n**为什么对：** 成本直接跟 token 数挂钩。2000 token 的提示里通常有大量对结果无差别的冗余表述，压缩直接减少每次调用的输入 token，而且对所有请求都生效，是最直接的省钱方式。\n\n**其他选项为什么错：**\n- B. 按查询复杂度动态生成提示：只对简单查询有效，复杂查询该长还是长，省多少不稳定。\n- C. 模板化 + 上下文剪枝：剪枝是在已有上下文里删减，压缩比通常不如学习式压缩，而且模板化本身不减 token。\n- D. 层级提示、按响应质量逐步加细节：只有第一层短，一旦要补细节，累计 token 反而更多。","s":"源#24"},{"id":"D1-025","d":1,"t":"single","q":"一个多步骤推理任务需要带错误处理的复杂提示链。哪种实现模式最稳健？","o":[{"l":"A","t":"Amazon Bedrock Flows，带条件逻辑和错误恢复机制"},{"l":"B","t":"Step Functions 编排，配合 Lambda 提示执行和重试逻辑"},{"l":"C","t":"带断路器机制和回退提示策略的自定义编排"},{"l":"D","t":"带工具调用和自主错误纠正的 Agent 方法"}],"a":["A"],"e":"**正确答案：A。** 用 Amazon Bedrock Flows（Bedrock 流程）编排：提示串成流程节点，节点之间用条件分支控制走向，并配置错误处理。\n\n**为什么对：** 多步骤链条真正需要的是\"某一步失败了该走哪条路\"这种编排能力。Flows 把提示串成可视化流程，条件节点和错误处理都是内置的，不用自己写状态机。\n\n**其他选项为什么错：**\n- B. Step Functions + Lambda：能做，但每个提示步骤都要配一个 Lambda 和一段状态定义，编排代码比提示本身还长。\n- C. 自定义编排 + 断路器：断路器和回退策略都要自己实现，稳定性和可观测性也得自己补。\n- D. Agent 自主纠错：Agent 的行为不可完全预测，题干要的是\"稳健的多步骤链\"，自主纠错反而增加不确定性。","s":"源#25"},{"id":"D1-026","d":1,"t":"single","q":"你的提示注入检测系统有 15% 的误报率。哪种方法能提高检测准确性？","o":[{"l":"A","t":"基于规则和 ML 分类器的多层检测"},{"l":"B","t":"带用户意图分类和异常检测的上下文分析"},{"l":"C","t":"Amazon Bedrock Guardrails，识别自定义提示攻击模式"},{"l":"D","t":"结合多种检测算法和置信度评分的集成方法"}],"a":["C"],"e":"**正确答案：C。** 用 Amazon Bedrock Guardrails（Bedrock 护栏）的提示攻击检测（prompt attack detection）能力。\n\n**为什么对：** 误报高多半是自写规则太粗。Guardrails 的提示攻击检测由 AWS 托管维护，会随新型攻击手法持续更新，在检出率和误报率之间比自维护规则集更容易取得平衡。\n\n**其他选项为什么错：**\n- A. 规则 + ML 分类器多层检测：叠加层数确实能提准确率，但每层的阈值都要自己调，维护成本随层数上升。\n- B. 上下文分析 + 意图分类：需要自己训练或调校意图分类模型，误报未必比现在低。\n- D. 集成多种算法 + 置信度评分：工程复杂度最高，集成权重的调优本身又是一个新难题。","s":"源#26"},{"id":"D1-027","d":1,"t":"single","q":"一个 RAG 系统需要根据检索上下文质量和用户专业水平动态调整提示。哪种架构支持此功能？","o":[{"l":"A","t":"带上下文质量评估和用户画像的自适应提示"},{"l":"B","t":"多层提示模板，根据上下文分析自动选择"},{"l":"C","t":"基于强化学习的提示优化，集成用户反馈"},{"l":"D","t":"使用元学习和上下文感知模板的动态提示生成"}],"a":["A"],"e":"**正确答案：A。** 先给检索回来的上下文打个质量分，再结合用户画像，据此选择或拼装不同的提示策略。\n\n**为什么对：** 题干给了两个输入变量——上下文质量、用户专业水平。自适应提示就是把这两个变量当作提示选择的依据：上下文差就多给约束、专家用户就少写背景。这正是\"按输入动态决策\"的架构。\n\n**其他选项为什么错：**\n- B. 多层模板按上下文分析自动选择：只考虑了上下文，没把\"用户专业水平\"这个维度纳入。\n- C. 强化学习 + 用户反馈优化：需要长期收集反馈并训练，属于持续优化手段，不是即时的动态适配架构。\n- D. 元学习 + 上下文感知模板：同样偏重学习方法，工程复杂度高，不是首选方案。","s":"源#27"},{"id":"D1-028","d":1,"t":"single","q":"你需要为高流量应用实现提示缓存，该应用有 80% 的查询相似度。哪种缓存策略优化性能？","o":[{"l":"A","t":"基于语义相似性的缓存，带可配置相似度阈值"},{"l":"B","t":"精确匹配缓存，带查询规范化和参数提取"},{"l":"C","t":"带提示模板和变量替换的层级缓存"},{"l":"D","t":"带一致性哈希和缓存预热策略的分布式缓存"}],"a":["A"],"e":"**正确答案：A。** 按语义相似度做缓存匹配，命中阈值可配置。\n\n**为什么对：** 题干的关键数字是\"80% 的查询相似\"——相似不等于相同。语义缓存能把\"措辞不同但意思一样\"的查询也命中，这是精确匹配做不到的；阈值可调则用来把握\"多像才算命中\"。\n\n**其他选项为什么错：**\n- B. 精确匹配 + 查询规范化：规范化只能消掉大小写、空格这类表面差异，换个说法就失效，命中率上不去。\n- C. 层级缓存 + 模板变量替换：缓存粒度是模板级，判断不了两次查询是否语义相同。\n- D. 分布式缓存 + 一致性哈希 + 预热：解决的是容量和分布问题，不解决\"能不能命中\"。","s":"源#28"},{"id":"D1-029","d":1,"t":"single","q":"提示优化过程需要跨多个质量维度进行自动评估。哪个框架提供全面评估？","o":[{"l":"A","t":"自定义评估管道，带多个指标和人工反馈集成"},{"l":"B","t":"Amazon Bedrock Model Evaluations，带自动质量评估工作流"},{"l":"C","t":"带持续评估和自动提示改进的 MLOps 管道"},{"l":"D","t":"带统计显著性测试和质量门的 A/B 测试框架"}],"a":["B"],"e":"**正确答案：B。** 用 Amazon Bedrock Model Evaluations（Bedrock 模型评估）跑自动化的多维质量评估。\n\n**为什么对：** 题干要的是\"跨多个质量维度 + 自动评估\"。Model Evaluations 内置了相关性、正确性、有害性等多个维度，配好数据集就能自动跑，指标不用自己实现。\n\n**其他选项为什么错：**\n- A. 自定义评估管道 + 人工反馈：指标要自己定义和实现，人工反馈也没法规模化。\n- C. MLOps 管道持续评估：MLOps 讲的是流程和集成，评估指标本身还得另找，而且它不具备自动改提示的能力。\n- D. A/B 测试 + 显著性检验：A/B 只能告诉你\"哪个版本更好\"，给不出多个维度各自的质量分。","s":"源#29"},{"id":"D1-030","d":1,"t":"single","q":"你的系统需要为 50+ 个用例生成领域特定提示，并保持一致质量。哪种方法能有效扩展？","o":[{"l":"A","t":"基于模板的生成，带领域特定知识库和验证"},{"l":"B","t":"带领域示例和自动提示合成的少样本学习"},{"l":"C","t":"带提示生成模型和质量评估的元学习方法"},{"l":"D","t":"带领域特定模块和组合规则的层级提示结构"}],"a":["A"],"e":"**正确答案：A。** 用统一模板生成提示，模板里的变量从领域知识库取值，生成后再跑一遍校验。\n\n**为什么对：** 用例一多，一致性只能靠模板保证；领域之间的差异交给知识库——同一个骨架，不同领域填各自的术语和示例。最后加一道验证，拦住生成不合格的提示。\n\n**其他选项为什么错：**\n- B. 少样本学习 + 自动合成：靠示例驱动生成的提示结构不固定，50 个用例之间很难保持写法一致。\n- C. 元学习用模型生成提示：多了一层生成模型的不确定性，质量一致性更难保证。\n- D. 层级结构 + 组合规则：规则组合的分支会随用例数膨胀，维护成本高。","s":"源#30"},{"id":"D1-031","d":1,"t":"single","q":"一个 RAG 应用检索到太多来自同一文档的重复段落。哪种技术能改善上下文多样性？","o":[{"l":"A","t":"输出 Token 扩展"},{"l":"B","t":"结果去重"},{"l":"C","t":"提示随机化"},{"l":"D","t":"公有存储桶访问"}],"a":["B"],"e":"**正确答案：B。** 对召回结果做去重（deduplication），同一来源只保留最有代表性的块。\n\n**为什么对：** 题干描述的现象就是\"同一篇文档的多个相邻块同时被召回\"。去重直接针对这个现象——按文档 ID 或内容相似度合并重复块，把上下文窗口让给不同来源的内容。\n\n**其他选项为什么错：**\n- A. 扩展输出 token：只是让回答更长，重复内容照样占着上下文窗口，问题没解决。\n- C. 提示随机化：随机改提示只会增加输出的不可控性，跟去重毫无关系。\n- D. 公有存储桶访问：这是 Amazon S3 权限相关的选项，跟检索结果多样性完全不相干。","s":"源#31"},{"id":"D1-032","d":1,"t":"single","q":"某企业为数百万商业客户提供定制化视频生成服务。客户通过向专属生成式AI模型提交提示词来制作营销视频。为提升输出相关性与个性化水平，该公司计划融入客户上下文信息（产品偏好、客户属性及业务历史）。该客户有严格数据治理要求，须对自身数据保持完全所有权与控制权，无需实时数据访问，但要求较高语义准确率与较低检索延迟。该公司希望尽量降低架构复杂度，且不愿在各客户环境中部署服务。哪项方案可满足上述需求？","o":[{"l":"A","t":"让各客户建立自有 Amazon Q Business 索引以容纳内部数据，并将该公司指定为数据访问者，使其可通过安全 API 检索内容来增强提示"},{"l":"B","t":"借助 Model Context Protocol 的联合检索能力，在各客户处部署实时 MCP 服务器，在生成提示时即时获取数据"},{"l":"C","t":"让各客户配置 Amazon Bedrock Knowledge Bases，开启跨账户查询使该公司可检索结构化数据用于提示增强"},{"l":"D","t":"配置 Amazon Kendra 爬取客户数据源，跨账户共享索引供该公司查询各客户的 Kendra 索以获取增强数据"}],"a":["A"],"e":"**正确答案：A。** 让各客户建立自有 Amazon Q Business 索引。\n\n**为什么对：**Amazon Q Business 专为企业级安全数据访问而设计，各客户维护自有索引确保数据不脱离其控制边界。将该公司指定为数据访问者后可通过安全 API 实现受控可审计的检索，满足数据治理与所有权要求，无需在客户环境中部署基础设施。\n\n**其他选项为什么错：**\n- B.部署实时 MCP 服务器：需在各客户处维护实时服务，引入不必要的运营复杂度\n- C.配置 Bedrock Knowledge Bases 跨账户：增加集成复杂度与治理风险，管理负担较重\n- D.共享 Kendra 索引：跨账户共享使访问控制与数据所有权边界复杂化\n\n**关键概念：**Amazon Q Business 提供托管式企业数据索引与安全检索能力，支持数据访问者模式实现受控的提示增强，适合数据治理严格的场景。","s":"源#32"},{"id":"D1-033","d":1,"t":"single","q":"某金融机构正在搭建基于 Amazon Bedrock 的检索增强生成应用，用于生成市场动态摘要。该应用依赖一个向量数据库存储索引数量较少的小型专有数据集，需执行相似性搜索。模型响应须最大化准确率并保持高性能。该公司应如何配置向量数据库并将其与应用集成？","o":[{"l":"A","t":"启动 Amazon MemoryDB 集群并使用 Flat 算法配置索引，根据性能指标配置水平扩展策略"},{"l":"B","t":"启动 Amazon MemoryDB 集群并使用分层可导航小世界（HNSW）算法配置索引，根据性能指标配置垂直扩展策略"},{"l":"C","t":"启动 Amazon Aurora PostgreSQL 集群并使用 IVFFlat 算法配置索引，配置实例类在负载增加时扩展到更大规格"},{"l":"D","t":"启动带 IVFFlat 索引和高探测值的 Amazon DocumentDB 集群，将连接配置为副本集并将读取分发到副本实例"}],"a":["B"],"e":"**正确答案：B。** MemoryDB 集群配合 HNSW 算法。\n\n**为什么对：**Amazon MemoryDB 是全托管内存数据库，提供微秒级Latency（延迟），适合需要快速向量相似性搜索的实时 RAG 场景。对于索引量少的小型数据集，HNSW 算法以高召回率著称，优于针对海量数据优化的近似方法。垂直扩展在该数据规模下已足够，无需管理分布式索引的复杂性。\n\n**其他选项为什么错：**\n- A.Flat 算法：计算开销大且效率低，即使对中等查询量也不经济\n- C.Aurora PostgreSQL：关系型数据库未针对内存向量搜索优化，引入较高延迟\n- D.DocumentDB：非为高性能向量工作负载设计，副本管理增加不必要复杂性\n\n**关键概念：**Amazon MemoryDB 配合 HNSW 算法适合小型数据集的高精度向量搜索；垂直扩展在有限数据规模下可简化运维。","s":"源#33"},{"id":"D1-034","d":1,"t":"single","q":"某金融企业正在构建客户支持应用，需根据用户查询的语义相似度从数据库检索相关金融法规文档，并与 Amazon Bedrock 集成生成响应。该应用须搜索英文、西班牙文和葡萄牙文文档，并按元数据（如发布日期、监管机构、文档类型）进行过滤。底库容纳约一千万条文档向量。为削减管理负担，该公司希望尽量减少管理工作同时为实时客户交互提供低延迟响应。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Amazon OpenSearch Serverless 提供向量搜索和元数据过滤，与 Amazon Bedrock Knowledge Bases 集成以启用检索增强生成"},{"l":"B","t":"部署带 pgvector 扩展的 Amazon Aurora PostgreSQL，将嵌入和元数据存储在表中，使用 SQL 查询进行相似性搜索后将结果发送到 Amazon Bedrock"},{"l":"C","t":"使用 Amazon S3 Vectors 配置向量索引和不可过滤的元数据字段，与 Amazon Bedrock 集成用于 RAG"},{"l":"D","t":"设置带向量索引的 Amazon Neptune Analytics 数据库，使用基于图的检索和 Amazon Bedrock 生成响应"}],"a":["A"],"e":"**正确答案：A。** OpenSearch Serverless 配合 Bedrock Knowledge Bases。\n\n**为什么对：**OpenSearch Serverless 专为高容量低Latency（延迟）搜索工作负载设计，无需管理集群或容量规划，支持向量搜索与结构化元数据过滤，可在 1000 万嵌入中高效检索。与 Bedrock Knowledge Bases 集成实现全托管 RAG 工作流，多语言支持在嵌入和检索层处理。\n\n**其他选项为什么错：**\n- B.Aurora PostgreSQL：需数据库调优和向量化扩展，增加运营开销\n- C.S3 Vectors：不支持高级元数据过滤这一关键需求\n- D.Neptune Analytics：引入不必要的复杂性，未针对大规模语义文档检索优化\n\n**关键概念：**OpenSearch Serverless 提供无服务器向量搜索与元数据过滤，配合 Bedrock Knowledge Bases 可实现低运维的托管 RAG。","s":"源#34"},{"id":"D1-035","d":1,"t":"single","q":"某医疗机构正在搭建论文管理平台，将学术文献存放在 Amazon S3 存储桶。该机构需要一个全面的元数据框架以提高 GenAI 应用的搜索精度。元数据须包含文档时间戳、作者信息和研究领域分类，且在所有上传文档中保持一致结构。该方案须允许基础模型在无需读取全文的前提下把握文档背景信息。哪项方案可满足需求？","o":[{"l":"A","t":"将文档时间戳存储在 S3 系统元数据中，使用 S3 对象标签进行领域分类，通过自定义用户定义元数据存储作者信息"},{"l":"B","t":"设置带法律保留的 S3 Object Lock 跟踪时间戳，使用 S3 对象标签存储作者信息，配置 S3 接入点进行领域分类"},{"l":"C","t":"使用 S3 Inventory 报告跟踪时间戳，创建 S3 接入点进行领域分类，将作者信息存储在 S3 Storage Lens 仪表盘中"},{"l":"D","t":"使用自定义用户定义元数据存储作者信息，使用 S3 Object Lock 保留期限作为时间戳，使用 S3 事件通知进行领域分类"}],"a":["A"],"e":"**正确答案：A。** S3 系统元数据+用户定义元数据+对象标签。\n\n**为什么对：**S3 系统元数据自动记录创建和修改时间戳，提供可靠的时间上下文。用户定义元数据以键值对形式直接与对象存储，适合保存作者等结构化属性。S3 对象标签专为轻量级分类和过滤设计，可标准化研究领域标记。三者组合各司其职，责任分明确，让模型仅凭元数据即可推断文档上下文。\n\n**其他选项为什么错：**\n- B.Object Lock+接入点：将特性用于非设计用途，增加复杂性无益于元数据质量\n- C.Inventory+Storage Lens：报告和仪表盘不是存储可查询元数据的合适数据源\n- D.Object Lock+事件通知：保留期限和事件通知非用于元数据管理的标准机制\n\n**关键概念：**S3 元数据体系包括系统元数据（时间戳）、用户定义元数据（自定义属性）和对象标签（分类标记），组合使用可为 GenAI 提供丰富的文档上下文。","s":"源#35"},{"id":"D1-036","d":1,"t":"single","q":"某金融企业希望开发一个基于 Amazon Bedrock 的应用，使分析师能查询季度收益报告和财务报表。这些文档通常 5-100 页，包含表格和文本。应用须提供上下文准确的响应，维护财务数据指标和对应说明文字之间的关联。为支持准确且可扩展的检索，应用须包含文档分段和上下文管理策略。哪项方案可满足需求？","o":[{"l":"A","t":"采用直接模型调用方式，利用 Claude 将每份财务文档作为单个输入处理，用微调提示指示模型分别解析表格和文本"},{"l":"B","t":"使用 Amazon Bedrock Knowledge Bases 创建 RAG 应用，从按上下文分段的财务文档部分检索信息，根据文档结构布局进行分段并包含来源引用"},{"l":"C","t":"部署带操作组的 Amazon Bedrock 代理，调用自定义 Lambda 函数分析财务文档，配置函数执行固定大小分块"},{"l":"D","t":"创建分别针对结构化和非结构化数据优化的两个 Bedrock 应用，各自使用定制分块策略，并实现查询路由逻辑"}],"a":["B"],"e":"**正确答案：B。** Bedrock Knowledge Bases 按结构分段。\n\n**为什么对：**Bedrock Knowledge Bases 专为处理大型复杂文档而设计，支持上下文感知的分块策略。根据文档结构布局（章节、子章节、表格和评论）进行分段，可在检索时保持表格指标与解释性叙述的语义连接。来源引用支持可审计性，这在金融场景中是常见要求。托管服务自动管理嵌入生成和索引编排，无需自定义基础设施。\n\n**其他选项为什么错：**\n- A.直接模型调用：单提示处理整篇文档增加 Token 用量和Latency（延迟），存在上下文截断风险\n- C.代理+固定大小分块：查询时触发固定分块易破坏结构化内容中的语义关系\n- D.双应用架构：引入不必要的复杂性和运营开销\n\n**关键概念：**Bedrock Knowledge Bases 支持基于文档结构的上下文分块，能保留表格与解释文本的语义关联，适合财务文档的精准 RAG 检索。","s":"源#36"},{"id":"D1-037","d":1,"t":"single","q":"某 GenAI 开发者正在构建基于 RAG 的客户支持应用，使用 Amazon Bedrock 基础模型。该应用需处理存储在 Amazon S3 中作为 JSON 文件的 50 GB 历史客户对话数据。数据处理工作流须从文档中提取相关数据、删除个人身份信息并生成向量嵌入。该工作流须具成本效益并在 4 小时内完成。哪项方案的运营开销最低？","o":[{"l":"A","t":"使用 Lambda 和 Amazon Comprehend 并行处理文件、删除 PII 并调用 Bedrock API 生成向量，配置 Lambda 并发限制和内存设置"},{"l":"B","t":"创建 Glue ETL 作业运行 PII 检测脚本，使用 SageMaker Processing 运行 HuggingFaceProcessor 生成嵌入并存储到 OpenSearch Service"},{"l":"C","t":"部署运行 Apache Spark 的 EMR 集群，使用 UDF 调用 Comprehend 检测 PII 并用 Bedrock API 生成向量，存储到 Aurora PostgreSQL"},{"l":"D","t":"使用 Step Functions 编排工作流，用 Comprehend 检测 PII 并用 Bedrock 生成嵌入，直接与 OpenSearch Serverless 集成存储向量和相似性搜索"}],"a":["D"],"e":"**正确答案：D。** Step Functions+Comprehend+Bedrock+OpenSearch Serverless。\n\n**为什么对：**Step Functions 提供无服务器编排层，协调并行处理、重试和错误处理而无需管理集群。Comprehend 以托管方式满足 PII 删除要求。Bedrock 生成嵌入使工作流保持在 AWS 托管服务范围内。与 OpenSearch Serverless 的直接集成提供低运维的Vector Store（向量存储）和相似性搜索，无需集群调整或分片管理。\n\n**其他选项为什么错：**\n- A.Lambda+Comprehend：50 GB 规模下 Lambda 并发和每次调用开销使调优复杂且成本高\n- B.Glue+SageMaker Processing：引入模型管理和额外处理层，增加运营复杂性\n- C.EMR 集群：需集群管理和调优，与最低运维开销目标相反\n\n**关键概念：**Step Functions 配合 Comprehend 和 Bedrock 构建全托管 PII 清理与嵌入生成管道，OpenSearch Serverless 提供无运维的向量存储。","s":"源#37"},{"id":"D1-038","d":1,"t":"single","q":"某公司正在构建法律研究 AI 助手，使用 Amazon Bedrock 和 Anthropic Claude 基础模型。该助手须检索高度相关的判例法文档以增强模型响应，须识别法律概念、专有法务术语及引用文献彼此间的语义联系，且须快速执行并返回精确结果。哪项方案可满足需求？","o":[{"l":"A","t":"配置 Bedrock Knowledge Bases 使用默认向量搜索，使用 Bedrock 扩展查询改进对特定术语和引文的检索"},{"l":"B","t":"使用 OpenSearch Service 部署结合向量搜索与关键词搜索的混合搜索架构，并应用 Bedrock 重排序模型优化结果相关性"},{"l":"C","t":"为最终用户启用 Amazon Kendra 查询建议，使用 Bedrock 对搜索结果进行后处理以识别语义相似性"},{"l":"D","t":"使用 OpenSearch Service 向量搜索和 Titan Embeddings 索引法律文档，使用自定义 Lambda 将结果与 RDS 中关键词过滤器合并"}],"a":["B"],"e":"**正确答案：B。** OpenSearch 混合搜索+Bedrock 重排序。\n\n**为什么对：**法律研究既需语义理解也需精确词法匹配，尤其是法规条文、引文和领域术语。混合搜索结合向量相似性与关键词检索，确保精确短语匹配和高语义召回。Bedrock 重排序模型基于更深层上下文理解优化结果排序，在传递给 Claude 前提高答案准确性并减少幻觉。OpenSearch 原生支持混合搜索，无需外部编排。\n\n**其他选项为什么错：**\n- A.默认向量搜索：无法可靠处理引文和精确术语匹配\n- C.Kendra 查询建议+后处理：侧重查询建议而非检索质量\n- D.自定义 Lambda 合并：跨多系统合并结果引入不必要的操作复杂性\n\n**关键概念：**OpenSearch 混合搜索融合向量语义与关键词精确匹配，配合 Bedrock 重排序模型可优化法律文献检索的相关性。","s":"源#38"},{"id":"D1-039","d":1,"t":"single","q":"某公司正在构建 GenAI 应用，基于多种内外部数据源生成内容。该公司希望确保输出完全可追溯：支持数据源注册、通过元数据标记将内容归因到原始来源，并在整个管道中维护数据访问和使用的审计日志。哪项方案可满足需求？","o":[{"l":"A","t":"使用 AWS Lake Formation 编目数据源并控制访问，直接在 S3 中应用元数据标签，使用 CloudTrail 监控 API 活动"},{"l":"B","t":"使用 Glue Data Catalog 注册和标记数据源，使用 CloudWatch Logs 监控访问模式和应用行为"},{"l":"C","t":"将数据存储在 S3 中并使用对象标签归因，使用 Glue Data Catalog 管理模式信息，使用 CloudTrail 记录 S3 访问"},{"l":"D","t":"使用 Glue Data Catalog 注册所有数据源，应用元数据标签归因数据来源，使用 CloudTrail 记录跨服务的访问和活动"}],"a":["D"],"e":"**正确答案：D。** Glue Data Catalog+元数据标签+CloudTrail。\n\n**为什么对：**Glue Data Catalog 是集中注册数据集和管理元数据的 AWS 原生服务，支持结构化注册和一致标记，可将生成内容归因到原始来源。CloudTrail 提供跨 AWS 服务 API 活动的不可变审计日志，捕获谁在何时通过哪个服务访问了哪些数据，满足端到端审计要求。两者组合覆盖数据源注册、元数据归因和跨服务审计三个环节。\n\n**其他选项为什么错：**\n- A.Lake Formation：主要用于细粒度数据湖权限，并非实现可追溯性所必需\n- B.CloudWatch Logs：不提供跨服务的权威审计日志记录能力\n- C.S3 对象标签+CloudTrail：审计范围仅限 S3 访问，未全面注册所有数据源\n\n**关键概念：**Glue Data Catalog 提供数据源编目与元数据管理，CloudTrail 提供跨服务不可变审计日志，组合实现 GenAI 数据管道的可追溯治理。","s":"源#39"},{"id":"D1-040","d":1,"t":"single","q":"某医疗企业正在构建 GenAI 应用，使用 RAG 提供基于证据的医疗信息。该应用使用 Amazon OpenSearch Service 检索向量嵌入。用户反映搜索经常错过含有精准医学名词及缩略语的结果，同时返回过多语义相似但不相关的文档。公司需在文档增长到百万级时仍保持较低延迟和最少运营开销。哪项方案可满足需求？","o":[{"l":"A","t":"配置混合搜索，结合向量相似性与关键词匹配，改进语义理解及精确术语和缩写的匹配"},{"l":"B","t":"将向量嵌入维度从 384 增加到 1536，使用后处理 Lambda 函数在检索后过滤不相关结果"},{"l":"C","t":"用 Amazon Kendra 替换 OpenSearch Service，使用查询扩展在预处理阶段处理医学术语和缩写变体"},{"l":"D","t":"实施两阶段检索架构，初始向量搜索结果由 SageMaker 上托管的 ML 模型重新排序"}],"a":["A"],"e":"**正确答案：A。** OpenSearch 混合搜索。\n\n**为什么对：**在医疗领域，精确术语、缩写和首字母缩略词至关重要。纯向量搜索常低估精确匹配，导致遗漏结果。OpenSearch 原生支持混合搜索，结合 BM25 关键词检索与向量相似性搜索，确保精确术语匹配的同时捕捉语义含义。混合搜索在同一索引和查询路径内运行，即使大规模也保持低Latency（延迟），无需额外基础设施。\n\n**其他选项为什么错：**\n- B.增加维度+后处理 Lambda：增加计算成本和延迟，未解决精确术语召回问题\n- C.迁移到 Kendra：引入新服务和摄取管道，增加运营开销和延迟\n- D.两阶段+SageMaker 重排序：增加模型托管和编排复杂性，OpenSearch 已提供原生混合检索\n\n**关键概念：**OpenSearch 混合搜索在同一引擎内融合关键词精确匹配与向量语义检索，适合医疗 RAG 中对术语精度和语义理解的双重需求。","s":"源#40"},{"id":"D1-041","d":1,"t":"single","q":"某电商企业正在开发使用 Amazon Bedrock 和 Anthropic Claude 向客户推荐产品的 GenAI 应用。客户反映部分推荐产品不可售或不相关，且某些推荐生成耗时过长。公司调查发现大多数客户交互是唯一的，且模型推荐了不在产品目录中的商品。该公司须解决这些问题。哪项方案可满足需求？","o":[{"l":"A","t":"在 Bedrock Guardrails 中增加接地性并启用自动推理检查，设置预置吞吐量"},{"l":"B","t":"使用提示工程限制模型对相关产品的响应，使用流式推理降低感知延迟"},{"l":"C","t":"创建 Amazon Bedrock Knowledge Bases 并实施 RAG，将 PerformanceConfigLatency 参数设置为优化"},{"l":"D","t":"将产品目录数据存储在 OpenSearch Service 中，验证模型推荐与目录匹配性，使用 DynamoDB 实现响应缓存"}],"a":["C"],"e":"**正确答案：C。** Bedrock Knowledge Bases+RAG+PerformanceConfigLatency。\n\n**为什么对：**防止推荐虚构产品的最直接方法是基于权威产品目录进行接地生成。Knowledge Bases 摄取目录数据后仅检索实际存在的条目，确保模型输出基于检索到的事实而非参数化记忆。PerformanceConfigLatency 设为优化可优先低延迟推理路径。由于大多数交互唯一，缓存策略效果有限，改进检索和推理路径更为有效。\n\n**其他选项为什么错：**\n- A.增加接地性+Provisioned Throughput（预置吞吐量）：提高安全性和延迟可预测性，但无法确保推荐限于有效产品\n- B.提示工程+流式：提示约束不足以可靠防止幻觉，流式仅改善感知延迟\n- D.OpenSearch+缓存：增加验证和缓存层但增加复杂性，缓存对唯一交互无效\n\n**关键概念：**Bedrock Knowledge Bases 通过 RAG 将模型输出约束在权威数据源范围内，PerformanceConfigLatency 参数可优化推理延迟，适合产品推荐场景。","s":"源#41"},{"id":"D1-042","d":1,"t":"single","q":"某大学将档案文件、学术期刊和手稿数字化后存储在 AWS Lake Formation 数据湖中。该校需构建解决方案让用户通过文本查询搜索数字化藏品，返回语义相似的期刊摘要，并可基于与摘要关联的文本和元数据进行搜索。数字化文件元数据不含关键词。方案须基于文本相似性将相似摘要相互匹配。数据湖包含少于 100 万个文件。哪项方案以最少运营开销满足需求？","o":[{"l":"A","t":"使用 Bedrock 中 Titan Embeddings 创建向量表示，将嵌入存储在 OpenSearch Service 的 Neural 插件中"},{"l":"B","t":"使用 Comprehend 从文件中提取主题，将主题和元数据存储在 Aurora PostgreSQL 中并查询摘要元数据"},{"l":"C","t":"使用 SageMaker AI 部署句子转换模型创建向量表示，将嵌入存储在带 pgvector 的 Aurora PostgreSQL 中"},{"l":"D","t":"使用 Bedrock 中 Titan Embeddings 创建向量表示，将嵌入存储在带 pgvector 的 Aurora PostgreSQL Serverless 中"}],"a":["D"],"e":"**正确答案：D。** Titan Embeddings+Aurora PostgreSQL Serverless pgvector。\n\n**为什么对：**需求是纯语义搜索（元数据无关键词），适合基于嵌入的方法。Titan Embeddings 提供托管向量生成，无需维护 ML 模型。Aurora PostgreSQL Serverless 配合 pgvector 支持Vector Store（向量存储）和相似性搜索，自动扩缩减少了容量规划工作。文件少于 100 万，PostgreSQL 向量存储操作上比专用搜索集群更简单。\n\n**其他选项为什么错：**\n- A.OpenSearch Neural 插件：运营 OpenSearch 域需考虑域大小调整、分片策略和集群调优\n- B.Comprehend 主题提取：主题提取不等同于基于嵌入的语义匹配，无法处理无关键词元数据\n- C.SageMaker AI 句子转换：需部署和管理端点，包括扩缩和模型生命周期管理，运维开销最大\n\n**关键概念：**Titan Embeddings 提供托管嵌入生成，Aurora PostgreSQL Serverless 配合 pgvector 实现自动扩缩的向量存储与相似性搜索，适合中小规模语义检索。","s":"源#42"},{"id":"D1-043","d":1,"t":"single","q":"某金融企业需对非结构化数据（客户通话记录、财务报告和文档）进行预处理，数据存储在 Amazon S3 中以支持 Amazon Bedrock 应用。公司须验证数据质量、创建可审计元数据、跟踪数据质量指标，并制定专属文本切分策略以提升模型表现。哪项方案在开发工作量最小的情况下满足需求？","o":[{"l":"A","t":"使用 SageMaker Data Wrangler 创建数据流，配置 CloudWatch 指标和告警监控数据质量，使用自定义 Lambda 预处理数据"},{"l":"B","t":"设置 Glue 爬网程序对数据源编目，创建 Glue ETL 作业运行自定义转换脚本，使用 Glue Data Quality 验证和监控数据质量"},{"l":"C","t":"使用 Comprehend 提取实体，创建 Lambda 函数对文本分块，运行 Athena 查询验证数据质量"},{"l":"D","t":"创建 Step Functions 工作流编排预处理任务，在 EC2 实例上运行自定义代码，使用 SageMaker Model Monitor 监控数据质量"}],"a":["B"],"e":"**正确答案：B。** Glue 爬网程序+ETL+Data Quality。\n\n**为什么对：**Glue 专为大规模数据准备设计，与 S3 无缝集成。爬网程序自动推断模式并填充 Glue Data Catalog，创建可审计的可查询元数据。ETL 作业允许实施自定义转换逻辑包括文本规范化和分块策略。Glue Data Quality 提供内置规则集验证完整性、准确性和一致性，并发布可监控的质量指标。全托管服务消除了基础设施管理需求。\n\n**其他选项为什么错：**\n- A.SageMaker Data Wrangler+Lambda：需自定义 Lambda 管道，开发和运维工作量较大\n- C.Comprehend+Lambda+Athena：组合零散，缺乏统一的数据质量验证和元数据编目能力\n- D.Step Functions+EC2：EC2 自定义代码需管理基础设施，与最小开发量目标矛盾\n\n**关键概念：**AWS Glue 提供爬网程序（自动编目）、ETL 作业（自定义转换）和 Data Quality（内置验证）的全栈数据预处理能力，适合 GenAI 数据准备。","s":"源#43"},{"id":"D1-044","d":1,"t":"single","q":"某制药企业正在开发基于 Amazon Bedrock Knowledge Bases 的 RAG 应用，数据源为 Amazon OpenSearch Service，存储超过 2500 万篇科学论文。用户反映当检索请求涉及论文中方法、结果与讨论多个章节时，应用产生不一致的答案并引用不相关段落。公司需在全语料库层面维持关联段落间的语义连贯。哪项方案可满足需求？","o":[{"l":"A","t":"配置知识库使用固定大小分块，最大块 300 个令牌，块间重叠 10%，使用适当嵌入模型"},{"l":"B","t":"配置知识库使用分层分块，父块 1000 个令牌、子块 200 个令牌，块间 50 个令牌重叠"},{"l":"C","t":"配置知识库使用语义分块，缓冲区大小 1、断点百分位阈值 85%，根据内容含义确定块边界"},{"l":"D","t":"配置知识库不使用分块，摄取前手动将每篇文档分割为独立文件，检索时应用后处理重排序"}],"a":["B"],"e":"**正确答案：B。** 分层分块（父块1000+子块200）。\n\n**为什么对：**分层分块专为保留更广泛语义上下文同时支持段落级精确检索而设计。子块（200 令牌）用于高精度向量匹配，关联的父块（1000 令牌）保留周围章节上下文。当检索器识别相关子块时可引入父级上下文，使模型看到方法、结果和讨论之间的关联框架。重叠降低了关键声明被分割到不同块的风险。\n\n**其他选项为什么错：**\n- A.固定大小分块：可能将逻辑关联的段落分割到不同块，缺乏父级上下文关联机制\n- C.语义分块：改善边界放置但不提供分层分块的父级上下文检索能力\n- D.不分块+手动分割：运营负担大，在 2500 万篇论文规模下不实用\n\n**关键概念：**分层分块通过父子块结构在精确检索与上下文保留之间取得平衡，适合跨章节查询的科学论文 RAG 场景。","s":"源#44"},{"id":"D1-045","d":1,"t":"single","q":"某公司在应用程序账户中运行 GenAI 摘要应用，架构包括 API Gateway REST API 将请求转发到私有 VPC 子网中的 Lambda 函数。该应用摘要存储在集中式数据存储账户受管数据湖中的敏感客户记录。数据存储账户已启用 S3、Athena 和 Glue。公司须确保对 Bedrock 的调用仅使用私有连接，且数据湖须提供跨账户的细粒度列级访问。哪项方案可满足需求？","o":[{"l":"A","t":"在应用账户创建 Bedrock 运行时接口 VPC 端点，在私有子网运行 Lambda，使用 Lake Formation LF 标签创建表级和列级跨账户授权"},{"l":"B","t":"在私有子网运行 Lambda，配置 NAT 网关提供对 Bedrock 和数据湖的访问，使用 S3 存储桶策略和 ACL 管理权限"},{"l":"C","t":"在应用账户仅为 S3 创建网关端点，通过公共端点调用 Bedrock，使用 Lake Formation 数据库级授权管理数据访问"},{"l":"D","t":"在应用账户使用 VPC 端点提供对 Bedrock 和 S3 的访问，仅使用 IAM 基于路径的策略管理数据湖访问"}],"a":["B"],"e":"**正确答案：B。** 私有子网+NAT 网关+S3 策略。\n\n**为什么对：**在私有子网运行 Lambda 确保网络隔离，NAT 网关提供对外部服务的出站访问路径。S3 存储桶策略和 ACL 用于管理跨账户的数据访问权限。这套做法利用现有 AWS 网络和安全机制，完成应用与数据湖的集成。\n\n**其他选项为什么错：**\n- A.Bedrock VPC 端点+Lake Formation LF 标签：VPC 端点确保私有连接，LF 标签实现列级跨账户授权，但与源答案不符\n- C.S3 网关端点+公共 Bedrock：公共端点违反私有连接要求，数据库级授权不够细粒度\n- D.VPC 端点+IAM 路径策略：IAM 基于路径的策略无法强制执行列级访问控制\n\n**关键概念：**私有子网配合 NAT 网关提供出站访问，S3 存储桶策略管理跨账户权限。疑点：源解析称选项 A 为正确选项但源答案标注为 B，二者矛盾，照录源答案 B。","s":"源#45"},{"id":"D1-046","d":1,"t":"single","q":"某制药公司开发 RAG 应用，使用 Amazon Bedrock Knowledge Bases，以 Amazon OpenSearch Service 作为超过 2500 万篇科学论文的数据源。用户反馈当检索涉及论文中方法、结果与讨论多个章节的查询时，系统给出不连贯的答案且引用了不相关的论文部分。公司需在整库范围内维护相关段落的语义连贯性。哪项方案可满足需求？","o":[{"l":"A","t":"设置知识库为固定大小分块，最大 300 令牌、10% 重叠率，搭配适配的 Bedrock 嵌入模型"},{"l":"B","t":"设置知识库为分层分块，父块 1000 令牌、子块 200 令牌，块间设置 50 令牌重叠"},{"l":"C","t":"设置知识库为语义分块，缓冲区 1、断点百分位 85%，依内容语义确定分块边界"},{"l":"D","t":"设置知识库不分块，摄取前手动拆分每篇论文为独立文件，检索阶段添加后处理重排序"}],"a":["B"],"e":"**正确答案：B。** 分层分块（父块1000+子块200+重叠50）。\n\n**为什么对：**科学论文中关键信息常分布在方法、结果和讨论多个章节。分层分块创建小粒度子块用于精准向量匹配，同时关联更大粒度的父块保留章节级上下文。检索到相关子块时自动引入父级上下文，使模型获得跨章节的推理框架。重叠设置进一步防止关键论述被截断到不同块中。\n\n**其他选项为什么错：**\n- A.固定大小分块：将逻辑关联的论述分割到不同块，缺乏上下文关联机制\n- C.语义分块：改善边界质量但不提供分层分块的父级上下文检索\n- D.不分块+手动拆分：2500 万篇论文规模下手动处理不切实际，运营负担极高\n\n**关键概念：**分层分块通过父子结构在精确匹配与上下文保留间取得平衡，重叠令牌防止跨章节关键信息被截断，适合大规模科学文献 RAG。","s":"源#46"},{"id":"D1-047","d":1,"t":"single","q":"某医疗设备制造商计划将使用其产品的手术操作报告导入 AI 助手。为保护患者隐私，助手须对外科医生暴露 PII 但为工程师编辑 PII。助手须仅引用不超过 3 年的医疗报告。新报告发布后立即存入 S3 存储桶。公司已设置 Bedrock Knowledge Bases 并使用 Amazon Cognito 验证用户身份。哪项方案可满足需求？","o":[{"l":"A","t":"在 S3 上启用 Macie PII 检测，用 S3 触发器调用 Lambda 从报告中编辑 PII，配置 Lambda 删除过期文档并同步知识库"},{"l":"B","t":"新报告上传时调用 Lambda 同步 S3 和知识库，使用第二个 Lambda 配合 Comprehend 为工程师编辑 PII，用 S3 生命周期规则删除超 3 年报告"},{"l":"C","t":"设置 S3 生命周期配置删除超 3 年报告，安排 Lambda 每日同步存储桶与知识库，根据 Cognito 用户组选择应用的护栏配置以按需编辑 PII"},{"l":"D","t":"创建第二个知识库，使用 Lambda 和 Comprehend 在同步前编辑 PII，根据 Cognito 组成员身份将用户路由到相应知识库"}],"a":["C"],"e":"**正确答案：C。** S3 生命周期+Lambda 同步+Cognito 组Guardrails（护栏）。\n\n**为什么对：**在推理时而非摄取时执行隐私控制，使不同角色对同一底层数据具有不同可视性。S3 生命周期配置自动删除超 3 年文档保证合规。Lambda 每日同步使Knowledge Bases（知识库）与存储桶内容一致。Bedrock Guardrails 支持推理时动态应用——根据 Cognito 用户组选择护栏配置，外科医生获得完整响应，工程师获得 PII 被屏蔽的响应，无需冗余复制底层数据或搭建并行的知识库实例。\n\n**其他选项为什么错：**\n- A.Macie 永久删除 PII：违反外科医生需访问 PII 的要求\n- B.摄取时编辑 PII：数据编辑与摄取耦合，不一致地为所有用户编辑\n- D.创建第二个知识库：增加存储成本和数据漂移风险，维护两份数据副本\n\n**关键概念：**Bedrock Guardrails 支持基于用户身份的动态 PII 控制，配合 S3 生命周期实现合规过期管理，在推理时按角色差异化暴露信息。","s":"源#47"},{"id":"D1-048","d":1,"t":"single","q":"某软件公司使用 Amazon Q Business 构建 AI 助手，让员工通过自然语言访问公司信息和个人信息。信息存储在 S3 存储桶中，每个部门有专用前缀，每个对象名称包含所属部门的 S3 前缀。每个部门对应 IAM Identity Center 中的一个组，每位员工属于一个部门。公司已配置 Q Business 访问 S3 数据源，需确保助手遵循用户所属用户组的权限边界。哪项方案运营开销最小？","o":[{"l":"A","t":"在每个部门文件夹创建 acl.json 文件，指定有权访问该部门数据的 Identity Center 组，在数据源设置中指明 JSON 文件位置"},{"l":"B","t":"在 S3 存储桶根目录创建单个 acl.json 文件，将每个部门 S3 前缀映射到对应 Identity Center 组，在数据源设置中指明文件位置"},{"l":"C","t":"为每个 Identity Center 组创建单独权限集，拒绝访问所有前缀并添加 StringNotEquals 条件键指定关联部门"},{"l":"D","t":"在存储桶根目录创建 metadata.json 元数据文件，添加 AccessControlList 对象指定部门前缀路径和对应组，在数据源元数据设置中引用"}],"a":["B"],"e":"**正确答案：B。** 根目录单个 acl.json。\n\n**为什么对：**Amazon Q Business 原生支持使用单一集中式 JSON 文件为 S3 数据源提供 ACL，将 S3 前缀映射到 IAM Identity Center 组。在根目录使用单个文件集中管理访问控制逻辑，管理员可更新部门映射而无需触及各文件夹或更改 IAM 权限，降低配置漂移风险。Q Business 在查询时自动评估用户组成员资格并过滤可访问文档。\n\n**其他选项为什么错：**\n- A.每部门单独 acl.json：需在各文件夹维护独立文件，部门变化时难以管理\n- C.IAM 权限集+条件键：Q Business 的 S3 数据源访问控制非通过 IAM 条件逻辑管理\n- D.metadata.json+AccessControlList：自定义元数据结构非 Q Business 访问执行的支持机制\n\n**关键概念：**Amazon Q Business 支持通过 S3 根目录单个 acl.json 文件将前缀映射到 Identity Center 组，实现基于部门的访问控制，运维开销最低。","s":"源#48"},{"id":"D1-049","d":1,"t":"multiple","q":"某金融企业开发 AI 搜索助手，帮助投资顾问快速检索投资数据。应用以 Lambda 函数运行，使用 Amazon Bedrock 知识库（以 OpenSearch Serverless 为数据源）。智能体需借助按模式匹配自动分配集合及索引访问权限来管理大规模集合。知识库同步成功，但测试显示 BedrockAgentRuntime API 返回 400 Bad Authorization 错误，访问 OpenSearch Serverless 时出现 403 Forbidden。公司须解决权限问题。哪组方案组合可满足需求？（选择两项）","o":[{"l":"A","t":"更新 Lambda 执行角色包含 bedrock:InvokeAgent 权限，向角色添加 aoss:APIAccessAll 权限"},{"l":"B","t":"创建包含基于模式的资源规则的 OpenSearch Serverless 数据访问策略"},{"l":"C","t":"为 OpenSearch Serverless 配置 VPC 端点策略，将端点添加到 Lambda 的 VPC 配置中"},{"l":"D","t":"配置 Secrets Manager 存储 OpenSearch Serverless 凭证，授予 Lambda 检索凭证的访问权限"},{"l":"E","t":"为 OpenSearch Serverless 域启用 IAM 身份验证，向 Lambda 角色添加 es:ESHttp* 权限"}],"a":["A","B"],"e":"**正确答案：A、B。**\n\n**为什么对：**\n- A.更新 Lambda 角色权限：400 Bad Authorization 表明 Lambda 执行角色缺少调用智能体的身份权限，添加 bedrock:InvokeAgent 和 aoss:APIAccessAll 是必需的\n- B.创建基于模式的数据访问策略：403 Forbidden 与 OpenSearch Serverless 数据平面权限相关，Serverless 使用数据访问策略而非传统 IAM，基于模式的规则确保新集合和索引自动获得访问权限\n\n**其他选项为什么错：**\n- C.VPC 端点策略：解决网络连接问题而非数据访问授权问题\n- D.Secrets Manager 凭证：OpenSearch Serverless 使用 IAM 授权而非凭证认证\n- E.es:ESHttp* 权限：该权限适用于传统 OpenSearch 而非 Serverless 的数据访问策略模型\n\n**关键概念：**OpenSearch Serverless 使用数据访问策略（非传统 IAM）管理数据平面权限，基于模式的资源规则支持大规模集合的自动权限分配。","s":"源#49"},{"id":"D1-050","d":1,"t":"single","q":"某研究公司正在开发 GenAI 系统用于生成技术文档摘要。公司须在中心位置对所有数据源编目，需自动发现和更新数据源。方案须用引用元数据标记每个生成的摘要以供查询，须为每一笔模型请求留存不可篡改的审计凭证并保存 I/O 记录。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Comprehend 识别数据源，将摘要存储在 S3 中并启用 S3 Object Lock，使用 CloudWatch 指标生成报告但不包含每次调用日志"},{"l":"B","t":"使用带爬网程序的 Glue Data Catalog 维护数据源，将摘要存储在 S3 中并写入源 ID 对象标签，将 Bedrock 调用日志存储在启用 S3 Object Lock 的 S3 中，使用 CloudTrail 日志完整性验证提供不可变性"},{"l":"C","t":"将输出存储在 DynamoDB 中并添加来源归因标签，将事件写入 CloudWatch Logs，使用 IAM 角色提供审计可追溯性"},{"l":"D","t":"使用 AppConfig 功能标志实施数据版本控制，使用 IAM 条件键限制模型访问，在 S3 中维护版本化映射文件"}],"a":["B"],"e":"**正确答案：B。** Glue Data Catalog+S3 Object Lock+CloudTrail。\n\n**为什么对：**Glue Data Catalog 及爬网程序是自动发现和集中编目数据集的标准 AWS 工具。摘要存储在 S3 中可用对象标签作为元数据（如源 ID）供查询。防篡改不可变审计日志通过将 Bedrock 调用日志存储到受 S3 Object Lock（合规模式）保护的 S3 存储桶实现，CloudTrail 日志完整性验证使用加密哈希提供不可否认性。\n\n**其他选项为什么错：**\n- A.Comprehend+CloudWatch：不包含每次调用的审计日志，CloudWatch 指标无法满足防篡改要求\n- C.DynamoDB+CloudWatch Logs：CloudWatch Logs 不提供防篡改不可变性保证\n- D.AppConfig+IAM 条件键：功能标志和条件键非用于数据编目和审计日志管理\n\n**关键概念：**Glue Data Catalog 爬网程序实现数据源自动编目，S3 Object Lock 配合 CloudTrail 完整性验证提供防篡改的模型调用审计日志。","s":"源#50"},{"id":"D1-051","d":1,"t":"single","q":"某公司提供全球餐厅发现服务，拥有 5000 万月活用户。公司希望在收录两千万店铺档案及两亿用户点评的数据集上完成语义检索。数据当前存储在 PostgreSQL 中。方案须支持复杂自然语言查询，在 500 毫秒内为至少 95% 的查询返回结果，保持每小时更新的数据新鲜度，并在高峰期经济高效地扩展。哪项方案开发工作量最小？","o":[{"l":"A","t":"将数据迁移到 OpenSearch Service，实施基于关键字的自定义分析器和相关性调优，创建 API Gateway 将查询转换为结构化搜索参数"},{"l":"B","t":"将数据迁移到 OpenSearch Service，使用 Bedrock FM 从餐厅描述和评价生成向量嵌入，用 k-NN 搜索查找语义相似结果"},{"l":"C","t":"将数据保留在 PostgreSQL 中并实施 pgvector，使用 Bedrock FM 生成嵌入并直接存储在 PostgreSQL 中，用 Lambda 执行相似性搜索"},{"l":"D","t":"将数据通过自定义摄取管道迁移到 Bedrock Knowledge Bases，配置自动嵌入生成，使用 Retrieve API 的内置向量搜索直接以自然语言查询"}],"a":["D"],"e":"**正确答案：D。** Bedrock Knowledge Bases+Retrieve API。\n\n**为什么对：**Knowledge Bases 一站式封装了向量化、索引构建及自然语言查询等开发中最繁杂的环节——无需构建独立服务。Retrieve API 接受自然语言输入并自动执行向量搜索，开发工作量最小。每小时新鲜度可通过计划重新摄取更新数据实现。高峰扩展由托管检索层承担，将检索工作负载与运营数据库分离，避免为峰值流量过度配置 PostgreSQL。\n\n**其他选项为什么错：**\n- A.关键字搜索：不提供语义搜索能力，仅依赖关键字匹配\n- B.OpenSearch+FM 嵌入：可行但需构建和维护嵌入管道、查询嵌入生成和Vector Index（向量索引）管理\n- C.PostgreSQL+pgvector：在此规模下事务数据库内运行相似性搜索难以满足 95% 查询 500ms 的Latency（延迟）目标\n\n**关键概念：**Bedrock Knowledge Bases 提供托管的端到端 RAG 检索能力，自动处理嵌入生成和向量搜索，适合大规模语义搜索场景的低开发量需求。疑点：源 id 43 同题答案为 B，本题为 D，答案不一致，照录源答案 D。","s":"源#51"},{"id":"D1-052","d":1,"t":"single","q":"某公司正在使用 Amazon Bedrock 构建 AI 咨询应用，向客户提供决策建议。应用须解释其推理过程并引用具体数据来源，从公司数据源检索信息并展示逐步推理。应用还须将数据声明链接到源文档，并将响应延迟控制在 3 秒以内。哪项方案运营开销最小？","o":[{"l":"A","t":"使用启用来源归因的 Bedrock Knowledge Bases，配合 RAG 和 Claude Messages API 为源文档设置高相关性阈值，将推理和引用存储在 S3 中用于审计"},{"l":"B","t":"使用 Bedrock 配合 Claude 模型和扩展思考，配置 4000 令牌思考预算，将推理轨迹和引用存储在 DynamoDB 中"},{"l":"C","t":"配置 SageMaker AI 配合自定义 Claude 模型，使用推理参数和 Lambda 处理响应，从 RDS 添加源引用"},{"l":"D","t":"使用 Bedrock 配合 Claude 模型和思维链推理，通过 Knowledge Bases API 配置自定义检索跟踪，用 CloudWatch 监控延迟"}],"a":["A"],"e":"**正确答案：A。** Bedrock Knowledge Bases 来源归因+RAG。\n\n**为什么对：**Knowledge Bases 是托管 RAG 能力，自动完成文档摄取、切分、向量化、检索与上下文拼接。启用来源归因后，RAG 管道返回用于生成的底层文档和段落引用，使可追踪引用呈现给用户并用于审计。设置相关性阈值减少噪声检索以兼顾准确率与Latency（延迟）。将推理过程及引用存入 S3 以满足审计留存，运营负担最小。\n\n**其他选项为什么错：**\n- B.扩展思考：增加延迟且不确保来源链接，思考预算消耗额外 Token\n- C.SageMaker+自定义模型：自定义模型托管和独立引用系统增加显著运营开销\n- D.思维链+自定义跟踪：需更多自定义跟踪工作，检索归因方面不如 Knowledge Bases 原生方案\n\n**关键概念：**Bedrock Knowledge Bases 原生支持来源归因，RAG 管道可返回引用并链接到源文档段落，实现可审计的基于事实的推理输出。","s":"源#52"},{"id":"D1-053","d":1,"t":"single","q":"某医疗企业使用 Amazon Bedrock 构建系统，帮助从业者做出临床决策。系统须严格依据经审批的临床文档为医师给出治疗建议并提供来源出处，严禁出现幻觉或产生与事实不符的内容。哪项方案运营开销最小？","o":[{"l":"A","t":"将 Bedrock 与 Amazon Kendra 集成检索已批准文档，实施自定义后处理将响应与源文档比较并包含引用"},{"l":"B","t":"部署 Bedrock Knowledge Bases 连接到已批准临床源文档，使用 RetrieveAndGenerate API 返回知识库中的引用"},{"l":"C","t":"使用 Bedrock 和 Comprehend Medical 提取医疗实体，针对医学术语数据库实施验证逻辑"},{"l":"D","t":"使用 Knowledge Bases 配合 Retrieve API 和 InvokeModel API，检索临床源文档并实施自定义验证逻辑引用来源"}],"a":["B"],"e":"**正确答案：B。** Knowledge Bases+RetrieveAndGenerate API。\n\n**为什么对：**Knowledge Bases 配合 RetrieveAndGenerate API 提供全托管 RAG 能力，自动管理文档摄取、分块、嵌入、检索和排序。模型输出被限定在已检索的审批临床文档范围内，大幅降低幻觉风险。API 返回显式来源引用，满足合规审查与诊疗透明性需求，无需自行编写比对或校验逻辑。检索和生成紧密集成，避免多步骤编排的Latency（延迟）和维护负担。\n\n**其他选项为什么错：**\n- A.Kendra+自定义后处理：引入额外服务和自定义逻辑，增加运营复杂性\n- C.Comprehend Medical+验证逻辑：侧重实体提取而非受控知识基础，不保证引用或幻觉预防\n- D.Retrieve+InvokeModel+自定义验证：需检索和生成间手动编排及自定义验证，增加开发工作量\n\n**关键概念：**Bedrock Knowledge Bases 配合 RetrieveAndGenerate API 实现端到端托管 RAG，自动返回来源引用，以最低运维开销提供基于事实的临床建议。","s":"源#53"},{"id":"D1-054","d":1,"t":"single","q":"某酒店集团希望在原有基于 Java 的物业管理系统上添加 AI 能力。公司计划使用 Bedrock Knowledge Bases 为员工提供房间可用性信息和酒店详情。方案须为每家酒店维护独立访问控制，提供近实时房间可用性信息，并在高峰期保持一致性能。哪项方案可满足需求？","o":[{"l":"A","t":"部署包含所有酒店合并数据的单个 Knowledge Bases，配置 Lambda 从各酒店 PMS 数据库同步数据，实施酒店特定过滤器审计访问"},{"l":"B","t":"为每家酒店创建由 PMS 数据库变更触发的 EventBridge 规则，将更新发送到集中式 Knowledge Bases，配置基于资源的策略执行酒店特定访问"},{"l":"C","t":"在多账户结构中为每家酒店实施独立 Knowledge Bases，使用直接数据摄取提供近实时可用性，为非关键信息安排定期同步"},{"l":"D","t":"构建使用多个知识库的集中式 Bedrock Agents 解决方案，实施带酒店特定权限集的 IAM Identity Center 控制员工访问"}],"a":["C"],"e":"**正确答案：C。** 多账户结构每酒店独立 Knowledge Bases。\n\n**为什么对：**为每家酒店实施独立Knowledge Bases（知识库）确保数据和权限的严格分离，自然强制执行酒店级访问控制，免除了繁复的策略逻辑与查询后过滤。多账户架构进一步强化安全治理，AWS 推荐具有强合规边界的工作负载使用账户级隔离。直接数据摄取使关键数据（如房间可用性）近实时更新，非关键信息定期同步降低摄取成本。每个知识库独立扩展，避免集中式设计的噪声邻居问题。\n\n**其他选项为什么错：**\n- A.集中式知识库+过滤器：策略复杂性和访问控制配置错误风险高\n- B.EventBridge+集中式知识库：集中式设计增加策略管理复杂性\n- D.集中式 Agents+权限集：编排复杂性增加，且不解决实时数据新鲜度要求\n\n**关键概念：**多账户结构中每酒店独立 Knowledge Bases 实现数据隔离与访问控制的天然分离，混合摄取模式（实时+定期）平衡新鲜度与运营效率。","s":"源#54"},{"id":"D1-055","d":1,"t":"multiple","q":"某公司使用 Amazon Bedrock 设计资助申请助手，基于 Amazon Nova Pro 基础模型。应用包含四个必填输入，须以一致文本格式提供响应。公司希望在响应包含霸凌语言时收到通知但不阻止所有被标记响应。公司已创建 Bedrock Flow 接收输入提示并发送到 Nova Pro。还需哪些额外步骤？（选择两项）","o":[{"l":"A","t":"使用 Bedrock Prompt Management 将必填输入指定为变量，选择 Nova Pro FM，指定响应输出格式，将提示添加到流的提示节点"},{"l":"B","t":"创建应用仇恨内容过滤器的 Bedrock Guardrails，将过滤器响应设为阻止，添加到流的提示节点"},{"l":"C","t":"创建 Bedrock 提示路由器，指定 Nova Pro FM，将必填输入作为变量添加到输入节点"},{"l":"D","t":"创建应用侮辱内容过滤器的 Bedrock Guardrails，将过滤器响应设为检测，添加到流的提示节点"},{"l":"E","t":"创建指定 Nova Pro FM 的 Bedrock 应用推理配置文件，在描述中指定输出格式"}],"a":["A","D"],"e":"**正确答案：A、D。**\n\n**为什么对：**\n- A.Prompt Management 变量+输出格式：将四个必填输入定义为变量确保每次调用获得正确结构化输入，指定输出格式确保一致响应，将托管提示添加到流的提示节点实现标准化配置\n- D.侮辱Content Filter（内容过滤器）+检测模式：将过滤器响应设为检测使系统标记包含霸凌语言的响应同时仍允许返回，满足「收到通知但不阻止」的要求\n\n**其他选项为什么错：**\n- B.仇恨过滤器+阻止模式：阻止模式违反「不阻止所有被标记响应」的要求\n- C.提示路由器：应用仅使用单个 Nova Pro FM，路由器不必要\n- E.推理配置文件：错误地以推理配置文件来约束输入变量与输出格式，无法实现提示级变量管控\n\n**关键概念：**Bedrock Prompt Management 支持变量化提示模板和输出格式定义，Guardrails 检测模式可在不阻止响应的情况下标记不当内容，实现非阻断式安全监控。","s":"源#55"},{"id":"D1-056","d":1,"t":"single","q":"某图书出版公司希望构建 AI 助手图书推荐系统，根据与客户的对话从图书目录中推荐图书。公司将图书文本、读者和编辑评论及提取的元数据存储在 S3 中。系统须支持低延迟响应，并能高效扩展以处理超过 10000 个并发用户。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Bedrock Knowledge Bases 生成嵌入，将向量存储在 OpenSearch Service 中，创建 Lambda 查询知识库，配置 API Gateway 调用 Lambda 处理请求"},{"l":"B","t":"使用 Bedrock Knowledge Bases 生成嵌入，将向量存储在 DynamoDB 中，创建 Lambda 查询知识库，配置 API Gateway 调用 Lambda"},{"l":"C","t":"使用 SageMaker AI 部署预训练模型构建推荐引擎，部署为端点并通过 API Gateway 调用"},{"l":"D","t":"创建 Amazon Kendra GenAI Enterprise Edition 索引，使用 S3 连接器索引目录数据，配置内置 FAQ，开发 Lambda 查询 Kenda 索引"}],"a":["A"],"e":"**正确答案：A。** Knowledge Bases+OpenSearch+API Gateway+Lambda。\n\n**为什么对：**Bedrock Knowledge Bases 摄取 S3 中的图书数据生成嵌入，OpenSearch Service 提供可扩展的向量搜索和 k-NN 相似性检索，支持基于对话意图的语义匹配。API Gateway 配合 Lambda 实现随需求水平扩展的入口层，将计算扩展与Vector Store（向量存储）扩展分离，在负载下保持Latency（延迟）可预测。这符合 AWS 对高并发 GenAI 应用的推荐架构模式。\n\n**其他选项为什么错：**\n- B.DynamoDB 向量存储：非 Knowledge Bases 的标准原生向量存储目标，引入额外实现复杂性\n- C.SageMaker AI 端点：需大量机器学习生命周期管理工作，运维开销高\n- D.Kendra 索引：虽然可行但面向企业搜索而非对话式推荐，开发模式不同\n\n**关键概念：**Knowledge Bases 配合 OpenSearch Service 提供托管Vector Index（向量索引）与 k-NN 搜索，API Gateway+Lambda 实现可水平扩展的请求入口，适合高并发对话式推荐场景。","s":"源#56"},{"id":"D1-057","d":1,"t":"single","q":"某金融企业开发 RAG 应用，帮助投资分析师查询跨多类投资工具、市场板块及监管领域的复杂金融关联。数据集涵盖高度互联实体与多跳关系，分析师须全面审视关系以提供准确投资指导。应用须捕捉金融实体间的间接关系，响应时间小于 3 秒。哪项方案运维开销最小？","o":[{"l":"A","t":"使用带 GraphRAG 的 Bedrock Knowledge Bases 和 Neptune Analytics 存储金融数据，分析多跳关系并自动识别跨文档相关信息"},{"l":"B","t":"使用 Bedrock Knowledge Bases 和 OpenSearch Service 向量存储，实现自定义关系识别逻辑用 Lambda 按序查询多个向量嵌入"},{"l":"C","t":"使用 OpenSearch Serverless 向量搜索和 k-NN，在 EC2 Auto Scaling 应用层实现手动关系映射"},{"l":"D","t":"使用 DynamoDB 在自定义索引系统中存储金融数据，用 Lambda 查询记录并用 SageMaker 生成响应"}],"a":["A"],"e":"**正确答案：A。** GraphRAG+Neptune Analytics。\n\n**为什么对：**传统向量相似性搜索擅长查找语义相似文本但不适合对显式实体间关系进行推理。基于图的检索专为关系遍历设计，GraphRAG 结合 RAG 和图感知上下文选择，通过在图中表示实体及关系可遍历多跳汇集完整相关事实。Neptune Analytics 提供托管图分析环境高效遍历复杂关系网络。与 Knowledge Bases 集成减少自定义工程，图优化引擎可高效执行多跳遍历满足亚 3 秒要求。\n\n**其他选项为什么错：**\n- B.OpenSearch+自定义关系逻辑：需大量自定义逻辑和编排，增加复杂性和Latency（延迟）\n- C.OpenSearch Serverless+EC2 手动映射：EC2 手动关系映射增加运维开销和延迟\n- D.DynamoDB+自定义索引：非为图式多跳探索设计，需大量自定义索引和检索逻辑\n\n**关键概念：**GraphRAG 配合 Neptune Analytics 通过图遍历实现多跳关系推理，Knowledge Bases 提供托管摄取和编排，适合高度互联金融实体的复杂关系查询。","s":"源#57"},{"id":"D1-058","d":1,"t":"single","q":"某金融企业开发客户服务 AI 助手，使用 Amazon Bedrock 基础模型。应用须提供透明响应，记录推理过程并引用 RAG 所用来源，为所有用户响应捕获全面审计跟踪。应用须服务于多达 10000 个并发用户并在 2 秒内响应每个查询。哪项方案运维开销最小？","o":[{"l":"A","t":"为 Bedrock Agents 启用跟踪，将 Knowledge Bases 与数据源集成启用 RAG 并引用权威内容，以多可用区部署，使用 API Gateway 和 Lambda 扩展应用，用 CloudFront 提供低延迟交付"},{"l":"B","t":"为 Agents 启用跟踪，集成自定义 RAG 管道与 OpenSearch Service 检索引用来源，部署在 API Gateway 后，用 Lambda 和 CloudFront 扩展，日志存储在 S3 中用 CloudTrail 审计"},{"l":"C","t":"使用 CloudWatch 监控延迟和错误率，在后端直接嵌入提示以引用来源，将交互存储在 RDS 中供审计"},{"l":"D","t":"将响应和证据存储在 S3 中启用版本控制供审计，用 Glue 编目检索文档，用 Athena 生成定期合规报告"}],"a":["A"],"e":"**正确答案：A。** Bedrock Agents 跟踪+Knowledge Bases+API Gateway+Lambda+CloudFront。\n\n**为什么对：**Knowledge Bases 提供全托管 RAG 实现并自动处理来源归属，使应用无需构建自定义管道即可引用权威内容。为 Agents 启用跟踪提供推理步骤和模型交互的端到端可见性，满足审计跟踪要求。API Gateway 和 Lambda 自动扩展到数千并发用户，CloudFront 通过缓存和加速内容交付减少Latency（延迟）帮助满足 2 秒要求。全部使用原生 Bedrock 功能，运维开销最小。\n\n**其他选项为什么错：**\n- B.自定义 RAG+OpenSearch：自定义 RAG 管道增加运维复杂性和维护工作量\n- C.CloudWatch+RDS：缺乏原生 RAG 集成，不提供透明推理或引用管理\n- D.S3 版本控制+Glue+Athena：侧重离线合规报告而非实时透明性和低延迟响应\n\n**关键概念：**Bedrock Agents 跟踪提供推理过程审计，Knowledge Bases 原生 RAG 支持来源引用，API Gateway+Lambda+CloudFront 组合实现高并发低延迟的可扩展架构。","s":"源#58"},{"id":"D1-059","d":1,"t":"single","q":"某公司需构建系统从多类素材源自动产出学习资料。素材涵盖文档文件（PDF、PPT、Word）及多媒体文件（录制视频）。系统须每天处理超过 10000 个内容源，峰值 500 个并发上传，须从各类文件中抽取核心知识点并产出贴合语境的精要概括。产出的学习资料须支持实时协作和版本控制。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Bedrock Data Automation 和 Lambda 编排文档处理，用 Knowledge Bases 处理多媒体，存储在 DocumentDB 中通过 SNS 订阅协作"},{"l":"B","t":"使用 Bedrock Data Automation 配合 FM 处理文档，集成 Textract 提取 PDF 和 Transcribe 处理多媒体，将内容存储在启用版本控制的 S3 中，元数据存 DynamoDB，通过 AppSync 订阅实现实时协作"},{"l":"C","t":"使用 Bedrock Data Automation 配合 SageMaker AI 端点托管提取和摘要模型，用 Guardrails 从文件中提取内容，存储在 Neptune 中"},{"l":"D","t":"使用 Bedrock Data Automation 配合 Lambda 处理批量文件，在 Bedrock 中微调 FM 分类内容类型，存储在 ElastiCache 中用提示管理版本控制"}],"a":["B"],"e":"**正确答案：B。** BDA+Textract+Transcribe+S3 版本控制+AppSync。\n\n**为什么对：**BDA 专为编排大规模多模态数据处理而设计，配合 FM 实现摘要和概念提取。Textract 从 PDF 准确提取结构化和非结构化文本，Transcribe 将视频转换为文本。启用版本控制的 S3 直接满足版本控制要求，DynamoDB 存储元数据支持高吞吐低Latency（延迟）访问。AppSync GraphQL 订阅配合 DynamoDB 流实现实时协作编辑，内容变更时向连接客户端推送更新。\n\n**其他选项为什么错：**\n- A.DocumentDB+SNS：DocumentDB 非为实时协作设计，SNS 不支持持续订阅模式\n- C.SageMaker AI 端点+Neptune：增加模型托管运维负担，Neptune 非用于时间Sequence（序列）分析\n- D.ElastiCache+微调 FM：ElastiCache 为临时缓存而非持久存储，微调 FM 增加不必要复杂性\n\n**关键概念：**Bedrock Data Automation 编排多模态数据处理，配合 Textract 和 Transcribe 处理不同媒体类型，S3 版本控制+AppSync 订阅实现协作与版本管理。","s":"源#59"},{"id":"D1-060","d":1,"t":"single","q":"某法律研究公司有基于 Amazon Bedrock 和 OpenSearch Service 的 RAG 应用，存储 1500 万份法律文档的 768 维向量嵌入。当前分块策略将文本分割为固定 500 令牌块，常将上下文关联的法律论证、法院意见或法规引用分割到不同块中。研究人员反映输出遗漏关键上下文或引用过时法律信息，响应时间增加 40%，p95 延迟超 2 秒。存储需求预计一年内从 90GB 增长到 360GB。公司需改进检索相关性和大规模系统性能。哪项方案可满足需求？","o":[{"l":"A","t":"在不改变分块策略的情况下将嵌入维度从 768 增加到 4096"},{"l":"B","t":"用存储在 S3 中的静态预写摘要替换动态检索，使用 CloudFront 提供摘要以减少计算需求"},{"l":"C","t":"更新分块策略使用基于完整法律论证、条款或章节的语义边界而非固定令牌限制，重新生成向量嵌入"},{"l":"D","t":"从 OpenSearch Service 迁移到 DynamoDB，实现基于关键词的索引支持快速查询"}],"a":["C"],"e":"**正确答案：C。** 基于法律论证语义边界分块。\n\n**为什么对：**固定令牌分割会割裂法规条文内在的语义连贯，导致检索时上下文残缺、回答品质下滑。改用基于法律论证、条款或章节的语义边界分块可保持上下文完整性，提高检索准确性并减少幻觉。重新生成与新分块对齐的嵌入也提高向量搜索效率，降低无谓的比较开销，有助于数据集增长时控制Latency（延迟）。这套做法直接解决检索相关性和性能可扩展性两个核心问题。\n\n**其他选项为什么错：**\n- A.增加嵌入维度：增加成本和延迟而未解决核心分块问题\n- B.静态预写摘要：移除动态推理违背法律 RAG 系统的目的\n- D.迁移到 DynamoDB：完全丢弃向量语义搜索，不适合细致的法律研究\n\n**关键概念：**基于文档语义结构（法律论证、条款、章节）的分块策略保持上下文完整性，配合嵌入重新生成可同时提升检索相关性和系统性能。","s":"源#60"},{"id":"D1-061","d":1,"t":"single","q":"某公司正在使用 Amazon Bedrock 开发应用，采用具备跨区域推理与预置吞吐能力的基础模型。应用须为欧洲及北美用户提供持续低延迟服务，须符合数据驻留法规，确保欧洲用户数据仅在欧洲区域的 AWS 节点处理。测试中当区域流量达到服务配额时应用出现降级。公司需保持应用弹性并最小化运维复杂性。哪项方案可满足需求？","o":[{"l":"A","t":"在北美和欧洲部署独立 Bedrock 实例，使用自定义路由层按用户位置引导流量，配置 CloudWatch 告警和 SNS 通知"},{"l":"B","t":"使用 Bedrock 跨区域推理配置文件在 InvokeModel API 调用时指定地理代码，配置独立 API Gateway HTTP API 将欧洲和北美用户引导到相应区域端点"},{"l":"C","t":"部署多区域 API Gateway 和 Lambda 实现重试逻辑处理限流，配置 Lambda 在主区域达配额时调用次要区域的 FM"},{"l":"D","t":"在多区域配置 Bedrock 预置吞吐量，在应用代码中实现故障转移逻辑，用 Global Accelerator 按用户位置路由流量"}],"a":["B"],"e":"**正确答案：B。** Cross-Region Inference（跨区域推理）配置文件+地理代码+独立 API Gateway。\n\n**为什么对：**跨区域推理配置文件允许在区域边界内分布推理请求到多个区域，无需自定义故障转移逻辑。指定地理代码确保欧洲用户数据仅在欧洲区域处理，满足法规要求。流量激增或达配额时 Bedrock 自动路由到同地理区域内健康区域。独立 API Gateway 提供简洁路由层，避免自定义路由复杂性。\n\n**其他选项为什么错：**\n- A.自定义路由层+手动监控：增加复杂性，不提供自动弹性解决配额降级问题\n- C.Lambda 重试+跨区域回退：自定义重试和回退逻辑增加复杂性，可能违反Data Residency（数据驻留）\n- D.应用级故障转移+Global Accelerator：需大量应用级故障转移逻辑，增加运维负担\n\n**关键概念：**Bedrock 跨区域推理配置文件通过地理代码在区域边界内自动分布推理请求，配合独立 API Gateway 实现简洁的地理路由，满足数据驻留和弹性需求。","s":"源#61"},{"id":"D1-062","d":1,"t":"single","q":"一家公司运行基于 Retrieval Augmented Generation（RAG，检索增强生成）的应用程序，使用 Amazon Bedrock Knowledge Bases（Bedrock 知识库）执行法规合规性查询。该应用使用 RetrieveAndGenerateStream API。知识库包含超过 50,000 份监管文件、法律先例和政策更新。RAG 应用的响应质量欠佳，原因是初始检索经常返回语义相似但上下文不相关的文档，导致模型产生幻觉并给出不正确的监管指导。公司需要提高 RAG 应用的检索相关性，同时以最低的运营开销满足需求。应选择哪种方案？","o":[{"l":"A","t":"部署 Amazon SageMaker 终端节点以运行微调的排名模型。使用 Amazon API Gateway REST API 路由请求。配置应用程序以通过 REST API 发出请求以对结果进行重新排名。"},{"l":"B","t":"使用 Amazon Comprehend 对文档进行分类并应用相关性评分。将 RAG 应用程序的重新排名流程与 Amazon Textract 集成以运行文档分析。使用 Amazon Neptune 执行基于图形的相关性计算。"},{"l":"C","t":"实施使用 Amazon Bedrock 知识库检索 API 的检索管道来执行初始文档检索。调用 Amazon Bedrock Rerank API 对结果进行重新排名。调用 InvokeModelWithResponseStream 操作生成响应。"},{"l":"D","t":"通过 Amazon Bedrock 知识库中的重新排名配置使用最新的 Amazon 重新排名模型。使用该模型改进文档相关性评分并根据上下文评估对结果重新排序。"}],"a":["D"],"e":"**正确答案：D。** 在 Amazon Bedrock Knowledge Bases 中启用重排序（Reranking）配置，使用 Amazon 托管的重排序模型对检索结果进行上下文评估和重新排序。\n\n**为什么对：** 题目核心问题是\"语义相似但上下文不相关\"的文档被送入基础模型。Bedrock 知识库原生支持重排序配置，在初始向量检索之后由 Amazon 托管的重排序模型根据更深层的上下文理解（如监管范围、法律适用性）自动对文档重新排序，显著提升检索精度。此方案无需额外基础设施、自定义编排逻辑或单独的模型托管，与现有 RetrieveAndGenerateStream 工作流无缝集成，运营开销最低。\n\n**其他选项为什么错：**\n- A. 部署 SageMaker 端点 + API Gateway：需要自定义端点、API 路由和模型生命周期管理，运营复杂度高。\n- B. Comprehend + Textract + Neptune：组合了多个非 RAG 专用服务，架构复杂且不是为检索重排序设计的。\n- C. Retrieve API + Rerank API + InvokeModelWithResponseStream：虽然能提升相关性，但需要显式调用 Rerank API 并修改应用管道，运营和集成工作量大于内置重排序。","s":"源#62"},{"id":"D1-063","d":1,"t":"single","q":"一家公司正在使用 Amazon Bedrock 构建 AI 咨询应用程序，为客户提供建议。应用必须能解释推理过程并引用特定的数据来源，从公司数据源中检索信息并展示建议的逐步推理，同时将数据声明链接到源文档。响应延迟须保持在 3 秒以内。应以最低运营开销满足需求，应选择哪种方案？","o":[{"l":"A","t":"使用启用来源归因的 Amazon Bedrock 知识库。将 Anthropic Claude Messages API 与 RAG 结合使用，为源文档设置高相关性阈值。将推理和引文存储在 Amazon S3 中以供审核之用。"},{"l":"B","t":"将 Amazon Bedrock 与 Anthropic Claude 模型和扩展思维结合使用。配置 4,000 代币的 Thinking 预算。将推理跟踪和引文存储在 Amazon DynamoDB 中以用于审计目的。"},{"l":"C","t":"使用自定义 Anthropic Claude 模型配置 Amazon SageMaker AI。使用模型的推理参数和 AWS Lambda 来处理响应。添加来自单独 Amazon RDS 数据库的来源引用。"},{"l":"D","t":"将 Amazon Bedrock 与 Anthropic Claude 模型和思维链推理结合使用。使用 Amazon Bedrock 知识库 API 配置自定义检索跟踪。使用 Amazon CloudWatch 监控响应延迟指标。"}],"a":["A"],"e":"**正确答案：A。** 使用启用来源归因（Source Attribution）的 Amazon Bedrock Knowledge Bases（Bedrock 知识库），配合 Anthropic Claude Messages API 进行 RAG 检索与生成，并设置高相关性阈值。\n\n**为什么对：** Bedrock 知识库是托管 RAG 服务，自动处理文档摄取、分块、嵌入、检索和上下文组装，无需自建检索基础设施。启用来源归因后，RAG 管道可返回底层文档和用于生成的段落引用，满足\"将声明链接到源文档\"的要求。设置高相关性阈值有助于减少噪声检索，控制传递给模型的上下文量，支持 3 秒延迟目标。将推理和引文存储在 S3 中可满足审计需求且运营负担最低。\n\n**其他选项为什么错：**\n- B. 扩展思维（Extended Thinking）：会显著增加延迟，且不能确保返回来源链接。\n- C. SageMaker AI 自定义模型托管 + Lambda + RDS：需要管理自定义模型端点和独立引文系统，运营开销大幅增加。\n- D. 思维链推理 + 自定义检索跟踪 + CloudWatch：比 A 需要更多的自定义跟踪工作，且未超越知识库已提供的归因能力。","s":"源#63"},{"id":"D1-064","d":1,"t":"single","q":"一家酒店公司希望为基于 Java 的传统物业管理系统（PMS）添加 AI 功能，使用 Amazon Bedrock Knowledge Bases（Bedrock 知识库）为员工提供客房可用性信息和酒店特定详情。方案必须为每家酒店维护独立的访问控制，近乎实时地提供房间可用性信息，并在高峰期保持一致的性能。应选择哪种方案？","o":[{"l":"A","t":"部署一个包含所有酒店组合数据的 Amazon Bedrock 知识库。配置 AWS Lambda 函数以通过直接 API 连接同步每个酒店的 PMS 数据库的数据。使用特定于酒店的过滤器实施 AWS CloudTrail 日志记录，以审核每个酒店数据的访问日志。"},{"l":"B","t":"为 PMS 数据库更改调用的每家酒店创建一个 Amazon EventBridge 规则。配置规则以将更新发送到管理 AWS 账户中的集中式 Amazon Bedrock 知识库。配置基于资源的策略以实施特定于酒店的访问控制。"},{"l":"C","t":"为多账户结构中的每家酒店实施一个 Amazon Bedrock 知识库。使用直接数据摄取来提供近乎实时的房间可用性信息。安排定期同步不太重要的信息。"},{"l":"D","t":"构建使用多个知识库的集中式 Amazon Bedrock Agents 解决方案。使用特定于酒店的权限集实施 AWS IAMIdentity Center 以控制员工访问。"}],"a":["C"],"e":"**正确答案：C。** 在多账户结构中为每家酒店实施独立的 Amazon Bedrock Knowledge Bases，使用直接数据摄取实现近乎实时的房间可用性更新，定期同步不太重要的信息。\n\n**为什么对：** 为每家酒店部署独立知识库可在数据和权限层面实现严格隔离，天然强制执行酒店级访问控制，无需复杂的策略逻辑。多账户结构进一步增强安全性与治理。直接数据摄取可实现关键数据（如房间可用性）的近乎实时更新，定期同步可降低非关键信息的摄取成本。Bedrock 知识库为完全托管服务，高峰期性能保持一致，且每个知识库独立扩展，避免集中式设计的\"噪音邻居\"问题。\n\n**其他选项为什么错：**\n- A. 单一集中知识库 + Lambda 同步 + CloudTrail 审计：集中式知识库增加了策略复杂性，存在跨酒店数据泄露风险。\n- B. EventBridge + 集中知识库 + 基于资源策略的访问控制：同样依赖集中式知识库，策略配置容易出错。\n- D. 集中式 Bedrock Agents + IAM Identity Center：增加了不必要的编排复杂性，且本身不解决实时数据新鲜度需求。","s":"源#64"},{"id":"D1-065","d":1,"t":"single","q":"一家公司需要一个系统，从多个内容源自动生成学习材料。内容源包括文档文件（PDF、PowerPoint 演示文稿和 Word 文档）及多媒体文件（录制的视频）。
