。Lambda 和 API Gateway 的超时配置组合提供模型超时的重试机制。全部使用托管无服务器服务，运营开销最低。\n\n**❌ 为什么其他选项错**：\n- B.HTTP API 直连 Bedrock+客户端轮询：轮询非真正流式传输，前端强制令牌限制不可靠\n- C.WebSocket API+ECS 容器：需管理 ECS 集群和容器化推理服务器，运营开销高\n- D.REST API+Lambda：REST API 比 HTTP API 更重且成本更高，非最佳轻量选择\n\n**📌 关键概念**：API Gateway HTTP API 配合 Lambda 响应流式传输实现轻量流式推理，超时配置组合提供重试机制，全部无服务器架构运营开销最低。","s":"第三方#87"},{"id":"D2-044","d":2,"t":"single","q":"某公司使用 Lambda 实现无服务器推理 API，动态调用 Bedrock 上的多个 AI 模型。须在不改动或重发布函数代码的前提下随时切换模型供应方，且须包含安全发布和回滚机制。哪项方案可满足需求？","o":[{"l":"A","t":"将活跃模型提供商存入 Systems Manager Parameter Store。配置 Lambda 运行时读取参数决定调用哪个模型"},{"l":"B","t":"将活跃模型提供商存入 AppConfig。配置 Lambda 运行时读取配置决定调用哪个模型"},{"l":"C","t":"配置 API Gateway 将请求路由到不同 Lambda 函数。每个函数硬编码特定模型提供商。手动切换集成目标"},{"l":"D","t":"将活跃模型提供商存入 S3 上的 JSON 文件。使用 AppConfig 引用 S3 文件作为配置源。Lambda 运行时通过 AppConfig 读取文件"}],"a":["B"],"e":"**✅ 为什么 B.AppConfig 存储模型配置 对**：AppConfig 专为动态配置管理设计，支持安全推出、验证和回滚功能——正是本场景的明确要求。将活跃模型提供商配置存入 AppConfig 后，公司可实时在 Bedrock 模型间切换而无需重部署 Lambda 代码。AppConfig 的部署策略支持灰度发布和自动回滚，降低配置变更风险。\n\n**❌ 为什么其他选项错**：\n- A.Parameter Store：提供参数存储但不支持安全灰度发布和自动回滚等部署策略\n- C.多 Lambda 函数+手动切换：需维护多个函数且手动切换无法实时进行\n- D.S3 JSON+AppConfig 引用：引入 S3 作为中间层增加复杂性，不如直接存入 AppConfig 简洁\n\n**📌 关键概念**：AppConfig 提供动态配置管理与安全发布策略（灰度、验证、回滚），Lambda 运行时读取配置实现无需代码重部署的实时模型切换。","s":"第三方#88"},{"id":"D2-045","d":2,"t":"single","q":"某公司使用 Bedrock 开发多模态内容分析应用，将不同模态的内容（文本、图片及代码）分发到专属的基础模型。应用须应对多种分发逻辑：按文件后缀的快速分流要求极低时延，基于内容语义的复杂路由须支持条件逻辑和错误处理。哪项方案最合适？","o":[{"l":"A","t":"配置 Lambda 函数对所有路由逻辑调用 Bedrock FM。用条件语句根据内容类型和语义确定合适的 FM"},{"l":"B","t":"创建混合方案。在应用代码中处理基于文件扩展名的简单路由。使用带 JSONata 的 Step Functions 状态机处理基于内容的复杂路由，并用 InvokeModel API 调用专门 FM"},{"l":"C","t":"为每种内容类型部署独立 Step Functions 工作流，路由逻辑在 Lambda 中。用 EventBridge 在工作流间协调回退"},{"l":"D","t":"为每种内容类型使用不同 SQS 队列。配置 Lambda 消费者根据消息属性分析内容并调用合适 FM"}],"a":["B"],"e":"**✅ 为什么 B.混合方案：应用代码简单路由+Step Functions 复杂路由 对**：需求明确区分了简单和复杂路由。按文件后缀的快速分流对时延要求极高，直接在应用代码中处理避免不必要的编排开销和状态管理延迟。基于语义的复杂路由需要条件逻辑和错误处理，Step Functions 配合 JSONata 提供可视化编排、内置重试和错误捕获能力。InvokeModel API 调用专门 FM 完成处理。该方案符合 AWS 可扩展生成式 AI 应用的推荐架构模式。\n\n**❌ 为什么其他选项错**：\n- A.Lambda 全路由：将所有逻辑放入单一函数，简单路由也承受不必要的状态管理开销\n- C.每类型独立状态机+EventBridge：多状态机协调增加复杂性，EventBridge 不保证顺序\n- D.SQS 队列+Lambda：队列引入延迟不适合实时路由，缺乏复杂条件逻辑支持\n\n**📌 关键概念**：混合路由架构将延迟敏感的简单路由留在应用代码、复杂语义路由交给 Step Functions 编排，按延迟和复杂度匹配处理方式。","s":"第三方#90"},{"id":"D2-046","d":2,"t":"single","q":"某保险公司使用现有 SageMaker AI 基础设施支持 Web 应用，允许客户预测保险费用。训练数据存储在 S3 中且快速增长。每当新文件上传到 S3 时系统须自动重新训练并重新部署模型。方案须提供可靠编排、可审计性和错误处理。哪项方案最佳？","o":[{"l":"A","t":"使用 Glue 对每个上传文件运行 ETL 作业。配置 ETL 用 SDK 调用 SageMaker AI 端点。使用实时推理在模型基于更新数据集重训练后重新部署"},{"l":"B","t":"创建 Lambda 和 Webhook 处理器在文件上传时生成事件。配置 SageMaker Pipelines 在重训练后重新部署。用 EventBridge 创建事件总线"},{"l":"C","t":"创建 Step Functions Express 工作流，用 SDK 集成从 S3 检索数据。用 Data Wrangler 导出到 Autopilot。用 Autopilot 重训练后重新部署"},{"l":"D","t":"创建 Step Functions Standard 工作流。配置首个状态调用 Lambda 响应文件上传事件。使用 SageMaker Pipelines 中的流水线在重训练后重新部署。下一状态在收到响应时运行流水线"}],"a":["D"],"e":"**✅ 为什么 D.Step Functions Standard+SageMaker Pipelines 对**：Step Functions Standard 工作流为长时间运行的有状态流程提供高可靠编排，适合模型重训练和部署周期。Lambda 响应 S3 上传事件触发工作流，SageMaker Pipelines 管理重训练和重新部署的完整流水线。Standard 工作流支持完整执行历史审计和结构化错误处理（Catch/Retry），满足可审计性和错误处理要求。\n\n**❌ 为什么其他选项错**：\n- A.Glue ETL+实时推理：Glue 非为模型训练编排设计，实时推理不适合重训练场景\n- B.Lambda+Webhook+EventBridge：Webhook 非标准 AWS 模式，缺乏完整编排和审计\n- C.Express 工作流+Autopilot：Express 不支持完整执行历史审计，Autopilot 自动化程度高但灵活性低\n\n**📌 关键概念**：Step Functions Standard 工作流提供可靠编排和完整审计追踪，配合 SageMaker Pipelines 实现自动化重训练与重新部署，适合 MLOps 事件驱动场景。","s":"第三方#92"},{"id":"D2-047","d":2,"t":"single","q":"某公司开发客户支持应用，使用 Bedrock 基础模型为员工提供实时 AI 辅助。应用须逐字符显示 AI 生成的响应，支持数千并发用户且延迟最低。响应通常需 15 到 45 秒完成。哪项方案可满足需求？","o":[{"l":"A","t":"配置带 Lambda 集成的 API Gateway WebSocket API。配置 WebSocket API 调用 Bedrock InvokeModelWithResponseStream API 并通过 WebSocket 连接流式传输部分响应"},{"l":"B","t":"配置带 Lambda 集成的 API Gateway REST API。配置 REST API 调用标准 InvokeModel API 并实现前端每 100 毫秒轮询完整响应块"},{"l":"C","t":"实现前端直接连接 Bedrock，使用 IAM 用户凭证和 InvokeModelWithResponseStream API，不经中间网关"},{"l":"D","t":"配置带 Lambda 集成的 API Gateway HTTP API。将完整响应缓存在 DynamoDB 中并通过分页 GET 请求提供给前端"}],"a":["A"],"e":"**✅ 为什么 A.WebSocket API+Lambda+InvokeModelWithResponseStream 对**：需求要求逐字符流式传输、长时间运行响应、低延迟和大规模并发。InvokeModelWithResponseStream 在 Token 生成时流式推送部分输出，无需等待完整响应。API Gateway WebSocket API 提供持久双向连接，适合长时间流式会话。Lambda 在 WebSocket 与 Bedrock 间处理请求逻辑和安全控制。该方案满足逐字符显示和数千并发需求。\n\n**❌ 为什么其他选项错**：\n- B.REST API+轮询：轮询非真正流式传输，100ms 间隔无法实现逐字符显示\n- C.前端直连 Bedrock+IAM 用户凭证：暴露模型端点和凭证给前端，安全隐患大\n- D.HTTP API+DynamoDB 缓存+分页：缓存完整响应后分页返回，不满足逐字符流式需求\n\n**📌 关键概念**：WebSocket API 提供持久双向连接适合长时流式会话，InvokeModelWithResponseStream 实现 Token 级流式推送，Lambda 处理中间逻辑和安全控制。","s":"第三方#95"},{"id":"D2-048","d":2,"t":"single","q":"某零售公司在网站上向客户提供产品推荐，应用使用 Bedrock 通过动态构建提示并发送给基础模型来生成推荐。开发者部署更新后指示 FM 在响应中包含特定促销信息，但 FM 未能在推荐中纳入该信息。哪项方案可最有效地解决此问题？","o":[{"l":"A","t":"在提示上使用 Bedrock 护栏过滤器。将输入过滤器强度设为高"},{"l":"B","t":"生成多个包含不同促销方式的响应变体。使用重排序模型按与原始提示的相关性选择最连贯版本"},{"l":"C","t":"通过 Bedrock 运行提示。通过 AgentCore 处理响应以添加促销信息。用原始提示和期望消息作为上下文重新排序结果"},{"l":"D","t":"通过在给 FM 的提示中使用输出指示符，强化在推荐中包含新促销信息的要求"}],"a":["D"],"e":"**✅ 为什么 D.提示中使用输出指示符 对**：当 FM 未包含特定内容或未将其连贯整合时，提示工程技术最为有效。输出指示符通过明确定义促销信息应出现的位置（如「响应须以以下信息结尾：[促销文本]」）或提供示例输出结构，在模型生成路径中强化约束。这比生成多变体重排序或添加后处理层更简洁直接，无需额外服务或自定义代码。\n\n**❌ 为什么其他选项错**：\n- A.护栏过滤器：护栏用于内容安全过滤，非用于强制包含特定促销信息\n- B.多变体+重排序：增加推理成本和延迟，且不保证促销信息被包含\n- C.AgentCore 后处理：引入额外处理层增加复杂性和延迟\n\n**📌 关键概念**：输出指示符是提示工程技术，通过在提示中明确约束输出格式和必含内容来引导模型行为，无需额外服务或后处理。","s":"第三方#96"},{"id":"D2-049","d":2,"t":"single","q":"某公司使用 AI 助手应用汇总网站内容并向客户提供信息。公司计划使用 Bedrock 访问基础模型，须将应用部署到开发环境和生产环境。方案须在每个环境中灵活测试不同 FM 且运营复杂度最低。哪项方案最佳？","o":[{"l":"A","t":"创建 CDK 应用。在 CodePipeline 中创建多个流水线，每个配置针对各 FM 的设置。使用 ProvisionedModel.fromProvisionedModelArn 调用 FM"},{"l":"B","t":"为每个环境创建独立 CDK 应用。使用 FoundationModel.fromFoundationModelId 调用 FM。为每个环境创建独立 CodePipeline 流水线"},{"l":"C","t":"创建单个 CDK 应用。使用 FoundationModel.fromFoundationModelId 调用 FM。在 CodePipeline 中创建含各环境部署阶段的单一流水线，用 CodeBuild 部署"},{"l":"D","t":"创建生产环境 CDK 应用。使用 ProvisionedModel.fromProvisionedModelArn 调用 FM。在 CodePipeline 中创建流水线部署到生产。开发环境手动参考生产代码重新创建资源"}],"a":["C"],"e":"**✅ 为什么 C.单 CDK 应用+fromFoundationModelId+单流水线多阶段 对**：FoundationModel 抽象支持按需调用基础模型，使应用能动态引用不同 FM 而无需预置容量，适合开发和生产环境中的实验与 A/B 测试。单个 CDK 应用和单条 CodePipeline 含多环境部署阶段最小化运维复杂度，符合 AWS 推荐的部署实践。CodeBuild 部署操作支持各环境差异化配置。\n\n**❌ 为什么其他选项错**：\n- A.多流水线+ProvisionedModel：预置容量限制灵活性且成本高，多流水线增加维护负担\n- B.多 CDK 应用+多流水线：代码重复，环境间一致性难以维护\n- D.生产 CDK+手动开发环境：手动创建资源易出错且不一致，违反 IaC 原则\n\n**📌 关键概念**：FoundationModel.fromFoundationModelId 支持按需动态引用 FM，单 CDK 应用配合单 CodePipeline 多环境阶段实现最低运维复杂度的灵活 FM 测试。","s":"第三方#100"},{"id":"D2-050","d":2,"t":"multiple","q":"某金融机构拟用 Bedrock FM 处理客服中心录音。录音完成后以 MP3 格式存入 S3 存储桶。公司须在文件入库后即刻产出结构化的录音摘要及情感分析结果。哪组方案组合可提供最少的代码和运维开销？（选择两项）","o":[{"l":"A","t":"使用 Step Functions 编排工作流。配置步骤调用 Transcribe 转换音频为文本、验证完成后调用 Lambda 使用 Bedrock FM 处理文本生成结构化分析"},{"l":"B","t":"使用 Step Functions 编排工作流。配置步骤调用 Transcribe 转换音频为文本、验证完成后直接调用 Bedrock FM 生成 JSON 格式的摘要和情感分析"},{"l":"C","t":"使用 Step Functions 编排工作流。配置步骤调用 Transcribe 转换音频为文本、验证完成后调用 Lambda 创建提示以调用 Bedrock FM 生成结构化分析"},{"l":"D","t":"配置源 S3 存储桶向 EventBridge 发送事件。创建 EventBridge 规则在存储桶中创建对象时调用 Step Functions 工作流"},{"l":"E","t":"配置源 S3 存储桶在创建对象时向 Step Functions 工作流发送通知"}],"a":["B","D"],"e":"**✅ 为什么 B、D 对**：\n- B.Step Functions+Transcribe+Bedrock 直调 JSON：Step Functions 原生集成 Transcribe 和 Bedrock，直接调用 FM 生成 JSON 输出无需中间 Lambda，减少代码和维护。现代 FM 可直接按 JSON 格式返回结构化摘要和情感分析\n- D.S3→EventBridge→Step Functions：EventBridge 规则在 S3 对象创建时触发工作流，提供可靠的事件驱动入口，无需自定义通知代码\n\n**❌ 为什么其他选项错**：\n- A.Step Functions+Lambda 处理：引入额外 Lambda 函数处理文本，增加代码和运维开销\n- C.Step Functions+Lambda 创建提示：同样引入不必要的 Lambda 中间层\n- E.S3 直接通知 Step Functions：S3 事件通知直接发送到 Step Functions 的集成不如经 EventBridge 灵活可靠\n\n**📌 关键概念**：Step Functions 原生集成 Transcribe 和 Bedrock 实现无代码编排，EventBridge 规则提供可靠的 S3 事件触发，FM 直接输出 JSON 减少中间处理层。","s":"第三方#112"},{"id":"D2-051","d":2,"t":"single","q":"某公司开发基于生成式 AI 的客户支持应用，使用 Bedrock 基础模型。应用须跨同一用户的多次交互维护对话上下文，须运行澄清工作流处理模糊查询，并须持久化存储每个用户的对话历史。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Step Functions Express 工作流编排对话流程。调用 Lambda 运行澄清逻辑。对话历史存入 RDS 以会话 ID 为主键"},{"l":"B","t":"使用 Step Functions Standard 工作流编排澄清工作流。包含等待回调模式管理工作流。对话历史存入 DynamoDB 并购买按需容量配置服务器端加密"},{"l":"C","t":"使用 API Gateway REST API 部署应用，将请求路由到 Lambda 更新和检索对话上下文。对话历史存入 S3 配置服务器端加密。每次交互保存为独立 JSON 文件"},{"l":"D","t":"使用 Lambda 调用 Bedrock 推理 API。使用 SQS 编排澄清步骤。对话历史存入 ElastiCache 集群配置静态加密"}],"a":["B"],"e":"**✅ 为什么 B.Step Functions Standard+等待回调+DynamoDB 对**：Standard 工作流专为长时间运行的有状态流程设计，高可靠性适合需要多轮往返沟通的澄清环节。等待回调机制使工作流可在等待外部输入时暂停并随后恢复执行。DynamoDB 按需容量提供低延迟的对话历史持久化，服务器端加密满足安全要求。SQS 和 ElastiCache 不适合持久化对话状态存储。\n\n**❌ 为什么其他选项错**：\n- A.Express 工作流+RDS：Express 不支持完整审计和长时间运行场景，RDS 引入关系数据库管理开销\n- C.API Gateway+Lambda+S3 JSON：S3 非为低延迟对话历史检索设计，JSON 文件管理碎片化\n- D.Lambda+SQS+ElastiCache：SQS 队列编排缺乏状态管理能力，ElastiCache 为临时缓存不适合持久存储\n\n**📌 关键概念**：Step Functions Standard 工作流支持长时间有状态流程和等待回调模式，DynamoDB 按需容量提供持久化对话历史存储，适合多轮澄清场景。","s":"第三方#115"},{"id":"D2-052","d":2,"t":"multiple","q":"某公司使用 Lambda 和 REST API 构建推理代理以自动化支持工作流。系统须跨交互保留记忆、共享关联的代理状态，并兼容事件驱动式与同步式两种调用模式。系统还须执行访问控制和基于会话的权限管理。哪组方案组合可提供最具可扩展性的架构？（选择两项）","o":[{"l":"A","t":"使用 Bedrock AgentCore 管理记忆和会话感知推理。使用内置身份支持、事件处理和可观测性部署代理"},{"l":"B","t":"通过 API Gateway 和 EventBridge 将 Lambda 和 REST API 注册为操作。使 AgentCore 能调用 Lambda 和 REST API 而无需自定义编排代码"},{"l":"C","t":"使用 Bedrock Agents 进行推理和对话管理。使用 Step Functions 和 SQS 编排。代理状态存入 DynamoDB"},{"l":"D","t":"将推理逻辑作为容器部署在 API Gateway 后的 ECS 上。使用 Aurora 存储记忆和身份数据"},{"l":"E","t":"使用 Kendra 和 Bedrock 构建自定义 RAG 流水线。使用 Lambda 编排工具调用。代理状态存入 S3"}],"a":["A","B"],"e":"**✅ 为什么 A、B 对**：\n- A.AgentCore 管理记忆和会话推理：AgentCore 专为管理跨会话的代理记忆存储、上下文延续及身份鉴权推理而设计，内置身份支持和可观测性消除手动状态管理需求\n- B.API Gateway+EventBridge 注册操作：将 Lambda 和 REST API 注册为 AgentCore 操作后无需自定义编排代码即可调用，EventBridge 支持事件驱动调用，API Gateway 支持同步调用\n\n**❌ 为什么其他选项错**：\n- C.Agents+Step Functions+SQS+DynamoDB：需手动构建编排和状态管理，不如 AgentCore 托管方案简洁\n- D.ECS 容器+Aurora：需管理容器集群和数据库，运营开销大\n- E.Kendra+自定义 RAG+S3：需构建完整自定义流水线，代码量和运维开销最大\n\n**📌 关键概念**：AgentCore 提供托管式代理记忆、会话上下文和身份感知推理，配合 API Gateway 和 EventBridge 注册操作实现无自定义编排的事件驱动与同步调用。","s":"第三方#117"},{"id":"D3-001","d":3,"t":"single","q":"一个社交媒体平台需要跨 50+ 种语言对用户生成的提示和 AI 响应进行内容审核。哪种方法提供全面覆盖？","o":[{"l":"A","t":"Amazon Bedrock Guardrails，带多语言内容过滤和自定义主题检测"},{"l":"B","t":"Amazon Comprehend，带自定义分类模型和语言特定规则"},{"l":"C","t":"第三方内容审核 API，带集成投票和置信度阈值"},{"l":"D","t":"带多语言训练数据和实时推理管道的自定义 ML 模型"}],"a":["A"],"e":"Bedrock Guardrails 提供托管多语言内容过滤和自定义主题检测，无需构建自定义 ML 管道即可扩展到 50+ 种语言。","s":"源#56"},{"id":"D3-002","d":3,"t":"single","q":"你的护栏系统有 5% 的误报率，阻止了合法业务内容。哪种优化能在保持安全的同时减少误报？","o":[{"l":"A","t":"带业务上下文感知和白名单管理的置信度阈值调整"},{"l":"B","t":"带渐进式细化和人工审核集成的多阶段过滤"},{"l":"C","t":"带领域特定训练和自适应阈值的上下文感知过滤"},{"l":"D","t":"带多种检测算法和加权决策的集成方法"}],"a":["C"],"e":"带领域特定训练的上下文感知过滤适应业务领域，通过理解合法内容模式减少误报。","s":"源#57"},{"id":"D3-003","d":3,"t":"single","q":"一个医疗保健 AI 系统需要阻止医疗建议，同时允许一般健康信息。哪种护栏配置能达到此平衡？","o":[{"l":"A","t":"带医疗建议检测和一般健康信息白名单的主题过滤"},{"l":"B","t":"带医疗建议阻止和信息内容批准的意图分类"},{"l":"C","t":"带医疗领域专业知识和合规检查的自定义护栏"},{"l":"D","t":"带医疗免责声明注入和保险责任措施的层级过滤"}],"a":["A"],"e":"带白名单的主题过滤可精确控制被阻止的医疗建议和允许的一般健康信息之间的边界。","s":"源#58"},{"id":"D3-004","d":3,"t":"single","q":"你的护栏需要基于新出现的威胁和政策变更进行实时调整。哪种架构支持动态更新？","o":[{"l":"A","t":"带热替换配置和政策变更 A/B 测试的规则引擎"},{"l":"B","t":"带持续学习和模型更新的基于 ML 的检测"},{"l":"C","t":"带版本控制和渐进式发布机制的策略管理系统"},{"l":"D","t":"带威胁情报集成和自动策略调整的事件驱动更新"}],"a":["A"],"e":"热替换规则配置可即时更新策略，通过 A/B 测试在完整部署前验证变更，无需模型重训练延迟。","s":"源#59"},{"id":"D3-005","d":3,"t":"single","q":"你的内容安全系统需要处理旨在绕过过滤器的对抗性提示。哪种防御策略最有效？","o":[{"l":"A","t":"带提示注入检测和输入清理的对抗训练"},{"l":"B","t":"带提示分析、意图检测和输出验证的多层防御"},{"l":"C","t":"带用户模式识别和异常检测的行为分析"},{"l":"D","t":"带多种检测方法和基于置信度阻止的集成防御"}],"a":["B"],"e":"多层防御提供纵深防御，在输入、处理过程中和输出阶段进行验证，对抗对抗性提示。","s":"源#60"},{"id":"D3-006","d":3,"t":"single","q":"一个全球 AI 系统需要跨不同区域进行文化敏感的内容过滤。哪种方法能处理文化细微差异？","o":[{"l":"A","t":"带文化上下文意识和本地合规要求的区域特定护栏"},{"l":"B","t":"带文化敏感度训练和区域自定义选项的通用过滤"},{"l":"C","t":"带文化专家验证和社区反馈的众包内容指南"},{"l":"D","t":"在多样化文化数据集上训练并带区域微调的 ML 模型"}],"a":["A"],"e":"区域特定护栏通过在每个区域结合文化上下文意识和本地监管合规，提供精确的文化敏感度。","s":"源#61"},{"id":"D3-007","d":3,"t":"single","q":"你的护栏系统需要为内容阻止决策提供详细解释。哪种实现能确保透明度？","o":[{"l":"A","t":"带决策推理和政策参考文档的可解释 AI"},{"l":"B","t":"带详细日志和决策理由捕获的审计追踪系统"},{"l":"C","t":"带解释生成和申诉流程集成的用户反馈系统"},{"l":"D","t":"带策略映射和违规类别识别的基于规则的解释"}],"a":["A"],"e":"带决策推理的可解释 AI 提供透明、人类可读的阻止决策理由，并直接引用相关政策。","s":"源#62"},{"id":"D3-008","d":3,"t":"single","q":"一个内容审核系统需要在自动化与人工监督之间取得平衡，处理边缘案例。哪种混合方法是最优的？","o":[{"l":"A","t":"基于置信度的路由：高置信度自动决策，不确定案例人工审查"},{"l":"B","t":"带自动预过滤和策略违规人工验证的分阶段审核流程"},{"l":"C","t":"带人工反馈集成和模型改进循环的主动学习系统"},{"l":"D","t":"带自动处理和复杂案例专家审查的升级框架"}],"a":["A"],"e":"基于置信度的路由通过自动处理清晰决策并将不确定的边缘案例导向人工审核，优化资源。","s":"源#63"},{"id":"D3-009","d":3,"t":"single","q":"一个 GenAI 系统处理敏感客户数据，需要端到端加密和密钥管理。哪种方法提供全面保护？","o":[{"l":"A","t":"带客户管理密钥和信封加密的 AWS KMS，覆盖静态和传输中数据"},{"l":"B","t":"带应用管理密钥和安全密钥分发的客户端加密"},{"l":"C","t":"带专用密钥存储和加密处理的硬件安全模块"},{"l":"D","t":"对不同数据敏感度级别使用不同密钥的多层加密"}],"a":["A"],"e":"带客户管理密钥的 AWS KMS 提供集中式密钥管理和信封加密，原生覆盖静态和传输中数据。","s":"源#64"},{"id":"D3-010","d":3,"t":"single","q":"你的 AI 系统需要检测并防止输入和输出中的 PII 泄漏。哪种全面方法能解决此问题？","o":[{"l":"A","t":"Amazon Bedrock Guardrails，对输入和输出进行 PII 检测和掩码"},{"l":"B","t":"Amazon Macie 数据发现，实时 PII 检测和阻止"},{"l":"C","t":"带 PII 模式识别和数据丢失防护集成的自定义 NLP 模型"},{"l":"D","t":"带 PII 替换和安全令牌管理的令牌化系统"}],"a":["A"],"e":"Bedrock Guardrails 在单一托管服务中为输入和输出提供集成 PII 检测和掩码，无需自定义 ML 管道。","s":"源#65"},{"id":"D3-011","d":3,"t":"single","q":"一个多租户 AI 系统需要数据隔离，防止跨租户数据访问。哪种架构确保完全隔离？","o":[{"l":"A","t":"租户特定加密密钥，带隔离数据处理和访问控制"},{"l":"B","t":"带租户特定模式和行级安全的数据库级隔离"},{"l":"C","t":"带租户上下文验证和数据分区的应用级隔离"},{"l":"D","t":"带租户特定 VPC 和网络分段的基础设施隔离"}],"a":["A"],"e":"租户特定加密密钥确保数据在密码学层面隔离——即使访问控制失败，没有正确的租户密钥，数据仍不可访问。","s":"源#66"},{"id":"D3-012","d":3,"t":"single","q":"你的 AI 系统需要与外部 API 安全通信，同时防止数据外泄。哪些安全措施是必要的？","o":[{"l":"A","t":"带网络 ACL 和数据丢失防护监控的 VPC 端点"},{"l":"B","t":"带认证、授权和流量检查的 API 网关"},{"l":"C","t":"带内容过滤和加密通信通道的代理服务器"},{"l":"D","t":"带微分段和持续验证的零信任架构"}],"a":["A"],"e":"VPC 端点保持流量在 AWS 网络内，网络 ACL 控制访问，DLP 监控检测任何未经授权的数据外泄尝试。","s":"源#67"},{"id":"D3-013","d":3,"t":"single","q":"一个 GenAI 应用需要符合 GDPR 的\"被遗忘权\"要求。哪种实现支持数据删除？","o":[{"l":"A","t":"带自动删除工作流和验证过程的数据血缘追踪"},{"l":"B","t":"带数据掩码和保留策略执行的不可变审计日志"},{"l":"C","t":"带墓碑记录和级联删除机制的版本化数据存储"},{"l":"D","t":"带加密删除证明的基于区块链的数据溯源"}],"a":["A"],"e":"数据血缘追踪确保识别用户数据的所有实例，自动删除工作流完全移除数据，验证确认合规性。","s":"源#68"},{"id":"D3-014","d":3,"t":"single","q":"你的 AI 系统需要运行时安全监控，检测异常行为和潜在攻击。哪种监控方法最有效？","o":[{"l":"A","t":"带基线建立和异常检测算法的行为分析"},{"l":"B","t":"带模式识别和威胁情报集成的实时日志分析"},{"l":"C","t":"带深度包检测和入侵检测的网络流量监控"},{"l":"D","t":"带安全指标和告警系统的应用性能监控"}],"a":["A"],"e":"带基线的行为分析可检测基于规则的系统无法发现的新的攻击，识别偏离既定正常行为的异常模式。","s":"源#69"},{"id":"D3-015","d":3,"t":"single","q":"你的系统需要安全提示处理，防止提示注入和数据外泄。哪些安全措施是必要的？","o":[{"l":"A","t":"带提示清理和注入模式检测的输入验证"},{"l":"B","t":"带隔离处理和输出验证的沙箱执行"},{"l":"C","t":"带恶意意图检测和阻止机制的内容分析"},{"l":"D","t":"带提示分析和响应验证的多阶段过滤"}],"a":["A"],"e":"带提示清理的输入验证可在入口点捕获注入尝试，防止恶意提示首先到达模型。","s":"源#70"},{"id":"D3-016","d":3,"t":"single","q":"一个医疗保健聊天机器人必须在向 FM 提交提示前检测个人健康信息。哪个服务能帮助识别敏感文本？","o":[{"l":"A","t":"AWS CodeBuild"},{"l":"B","t":"Amazon CloudFront"},{"l":"C","t":"Amazon Comprehend Medical"},{"l":"D","t":"Amazon Route 53"}],"a":["C"],"e":"Comprehend Medical 专用于识别医疗健康领域的敏感实体（PHI），在提交给FM前做PII/PHI检测。","s":"样题#9"},{"id":"D3-017","d":3,"t":"single","q":"一个 GenAI 应用必须加密存储用于审计的提示和生成输出。哪个 AWS 服务应管理加密密钥？","o":[{"l":"A","t":"Amazon CloudFront"},{"l":"B","t":"Amazon Route 53"},{"l":"C","t":"AWS CodeBuild"},{"l":"D","t":"AWS KMS"}],"a":["D"],"e":"KMS（密钥管理服务）管理加密密钥，用于对存储的提示和输出做静态加密。","s":"样题#8"},{"id":"D3-018","d":3,"t":"single","q":"一家公司需要限制开发团队在 Amazon Bedrock 中可以调用的基础模型。应使用哪种控制？","o":[{"l":"A","t":"IAM 权限"},{"l":"B","t":"DNS 别名"},{"l":"C","t":"S3 生命周期规则"},{"l":"D","t":"EBS 卷标签"}],"a":["A"],"e":"IAM 权限可限制特定用户/角色对 Bedrock 特定模型或模型的访问——模型级权限控制。","s":"样题#1"},{"id":"D3-019","d":3,"t":"single","q":"一个开发者需要确保上传到 GenAI 管道的文档在摄取前不含恶意软件。应添加哪种控制？","o":[{"l":"A","t":"恶意软件扫描步骤"},{"l":"B","t":"更高的模型温度"},{"l":"C","t":"公共对象访问"},{"l":"D","t":"随机分块大小"}],"a":["A"],"e":"在数据摄取管道中增加恶意软件扫描步骤（如使用 GuardDuty Malware Protection 或第三方扫描器），防止恶意文件进入下游处理。","s":"样题#7"},{"id":"D3-020","d":3,"t":"single","q":"某企业计划在五个独立业务部门部署多个生成式 AI 应用，这些部门分布在欧洲和美洲多国。各应用采用 Bedrock RAG 模式，配有存储 TB 级非结构化数据的部门专属知识库。公司须为全部 GenAI 应用建立符合良好架构框架的标准组件，涵盖安全控制、可观测性实践和部署模式，且须可复用、版本化并一致治理。哪项方案可满足需求？","o":[{"l":"A","t":"为各应用配置 API Gateway REST API 端点。基于 Well-Architected Generative AI Lens 将通用安全、可观测性和 RAG 模式部署在标准化 CloudFormation 模板中。部署后用 CloudFormation Guard 验证各部门策略合规性"},{"l":"B","t":"基于 Well-Architected Generative AI Lens 创建标准化 CloudFormation 模板，实现安全、可观测性和 RAG 模式。建立版本控制中央存储库。将 CI/CD 管道与 CloudFormation Guard 集成，跨部门强制一致且可重复的部署"},{"l":"C","t":"使用 Service Catalog 为各部门定义标准化产品组合和版本化产品。用这些产品组合强制执行基于 Well-Architected Lens 的安全、可观测性和 RAG 模式。要求部门通过 Service Catalog 控制台部署资源"},{"l":"D","t":"在共享设计文档中记录基于 Well-Architected Lens 的安全控制、可观测性需求和 RAG 模式。使用 Macie 强制执行部署。将实施责任委托给各部门"}],"a":["B"],"e":"**✅ 为什么 B.标准化 CloudFormation 模板+中央存储库+CI/CD Guard 对**：CloudFormation 模板将安全控制、可观测性和 RAG 模式编码为可复用 IaC，中央存储库提供版本控制确保组件一致性和可追溯性。CI/CD 管道集成 CloudFormation Guard 在部署前自动验证策略合规，跨部门强制一致且可重复的部署。该方案将框架要求转化为自动化执行的代码级标准。\n\n**❌ 为什么其他选项错**：\n- A.API Gateway 端点+部署后验证：部署后验证无法阻止不合规资源上线，API Gateway 非核心治理组件\n- C.Service Catalog：虽可行但侧重产品目录管理，不如 CI/CD 集成 Guard 的自动化合规验证\n- D.共享文档+Macie 强制执行：文档缺乏强制力，Macie 用于数据分类非部署治理\n\n**📌 关键概念**：CloudFormation 模板将 Well-Architected 框架编码为可版本控制的 IaC，CI/CD 集成 CloudFormation Guard 实现部署前自动化合规验证。","s":"第三方#20"},{"id":"D3-021","d":3,"t":"single","q":"某媒体企业须借助 Bedrock 建立严谨的内容生成管控机制。企业需统一管控上百份提示词模板，跨不同 AWS 可用区域由各业务组调用执行。方案须支持含审批流程的版本管理并附带待审核提醒，同时留存完整的操作审计轨迹以追踪提示词使用情况，并通过参数化模板统一质量基线。哪项方案可满足需求？","o":[{"l":"A","t":"配置 Bedrock Studio 提示模板。用 CloudWatch 仪表板显示提示使用指标。审批状态存入 DynamoDB。用 Lambda 函数强制审批"},{"l":"B","t":"使用 Bedrock Prompt Management 实施版本控制。配置 CloudTrail 进行审计日志记录。用 IAM 策略控制审批权限。通过指定变量创建参数化提示模板"},{"l":"C","t":"使用 Step Functions 创建审批工作流。提示存入 S3。用标签实施版本控制。用 EventBridge 发送通知"},{"l":"D","t":"部署 SageMaker Canvas，提示模板存入 S3。用 CloudFormation 进行版本控制。用 Config 强制审批策略"}],"a":["B"],"e":"**✅ 为什么 B.Prompt Management 版本控制+CloudTrail+IAM+参数化 对**：Prompt Management 原生支持提示版本控制和参数化变量，确保跨团队一致的提示标准化。CloudTrail 提供跨服务 API 活动的不可变审计日志。IAM 策略控制审批权限实现细粒度访问管理。参数化模板强制质量标准并支持跨区域一致使用。全部利用 Bedrock 原生能力，无需自定义工作流。\n\n**❌ 为什么其他选项错**：\n- A.Studio+CloudWatch+DynamoDB+Lambda：需自定义审批逻辑和存储，非 Prompt Management 原生功能\n- C.Step Functions+S3+标签：S3 标签版本控制不如原生 Prompt Management 精确，需自定义编排\n- D.SageMaker Canvas+CloudFormation：Canvas 非提示管理工具，CloudFormation 非用于提示版本控制\n\n**📌 关键概念**：Bedrock Prompt Management 原生提供提示版本控制和参数化变量，配合 CloudTrail 审计和 IAM 权限管理实现完整的提示治理流程。","s":"第三方#27"},{"id":"D3-022","d":3,"t":"single","q":"某企业在 AWS 上搭建视频分析平台，借助 Rekognition 和 Bedrock 对海量视频档案进行智能分析。平台须遵循既定隐私规范，确保模型输入输出的安全性、管控 FM 的调用行为，并留存完整的操作审计日志以记录每个用户对每项资源的访问时间与内容。哪项方案可满足需求？","o":[{"l":"A","t":"为 Bedrock API 调用配置 VPC 端点。实施 Bedrock 护栏过滤有害内容。用 Bedrock 跟踪事件审计。将跟踪导出到 CloudWatch Logs。将提示和输出存入启用 SSE-KMS 的 S3"},{"l":"B","t":"使用带 ABAC 的 IAM 定义访问控制，将部门映射到特定权限。为 Bedrock API 调用配置 VPC 端点。用 IAM 条件键强制指定 GuardrailIdentifier 和 ModelId 值。配置 CloudTrail 捕获管理和数据事件。启用 S3 服务器访问日志。将日志发送到 CloudTrail Lake。设置 CloudWatch 告警检测意外活动"},{"l":"C","t":"使用 VPC 端点策略限制访问。用 Config 跟踪资源更改和合规性。用 SSE-KMS 加密静态数据。将模型输入输出存入单独 S3 存储桶。启用 S3 服务器访问日志"},{"l":"D","t":"配置 CloudTrail Insights 分析跨账户 API 调用模式。部署 Macie 扫描视频档案。用 SSE-KMS 加密所有存储数据。配置 EventBridge 规则处理异常和发现"}],"a":["B"],"e":"**✅ 为什么 B.ABAC IAM+VPC 端点+IAM 条件键+CloudTrail+CloudTrail Lake 对**：ABAC 通过部门属性动态映射权限，IAM 条件键强制每次 Bedrock 调用指定 GuardrailIdentifier 和 ModelId，确保仅已批准的护栏和模型被使用。VPC 端点保持 API 调用在私有网络路径上。CloudTrail 捕获管理和数据事件提供完整审计记录，S3 服务器访问日志记录文件级交互，CloudTrail Lake 提供可查询的审计存储。CloudWatch 告警实现实时异常检测。\n\n**❌ 为什么其他选项错**：\n- A.VPC 端点+护栏+跟踪事件：缺乏 IAM 条件键强制指定护栏和模型，审计覆盖不全面\n- C.VPC 端点策略+Config：Config 跟踪配置变更但非 API 调用审计，缺乏条件键强制\n- D.CloudTrail Insights+Macie：Insights 为异常检测而非完整审计，Macie 扫描数据但不控制模型访问\n\n**📌 关键概念**：ABAC 配合 IAM 条件键强制指定护栏和模型标识符，VPC 端点保障私有网络路径，CloudTrail 和 CloudTrail Lake 提供完整可查询的审计记录。","s":"第三方#29"},{"id":"D3-023","d":3,"t":"single","q":"某公司创建使用 Bedrock 基础模型的生成式 AI 应用。应用须使用 Microsoft Entra ID 进行身份验证，所有 FM API 调用须保持在私有网络路径上。对应用的访问须按部门限制到特定模型系列，且须提供模型交互的全面审计跟踪。哪项方案可满足需求？","o":[{"l":"A","t":"在 Entra ID 和 IAM 间配置 SAML 联合。创建仅允许所需 ModelId 值的部门特定 IAM 角色。为 Bedrock 运行时服务创建 PrivateLink 接口 VPC 端点。启用 CloudTrail 捕获 Bedrock API 调用。配置 Bedrock 模型调用日志记录详细交互"},{"l":"B","t":"在 IAM 中创建 IdP 连接使用 Entra ID 验证。分配部门权限集控制特定模型系列访问。在私有子网部署 Lambda 并设 NAT 网关出站到 Bedrock 公共端点。启用 CloudWatch Logs 捕获交互"},{"l":"C","t":"在 IAM 中创建 SAML IdP 使用 Entra ID 验证。用 IAM 权限边界限制部门角色模型访问。配置公共 Bedrock 端点并通过 VPC 路由保持私有连接。设 CloudTrail 管理审计日志"},{"l":"D","t":"在 Entra ID 和 IAM 间配置 OIDC 联合。用 ABAC 将部门属性映射到特定模型访问权限。应用 SCP 按部门限制 Bedrock FM 系列访问。用 Entra ID 内置日志记录维护审计"}],"a":["A"],"e":"**✅ 为什么 A.SAML 联合+部门 IAM 角色+PrivateLink VPC 端点+CloudTrail 对**：SAML 联合实现 Entra ID 与 IAM 的身份集成，部门特定 IAM 角色通过 ModelId 条件精确限制各部门可用模型。PrivateLink 接口 VPC 端点确保所有 API 调用经私有网络路径，不经过公网。CloudTrail 捕获 API 调用审计，Bedrock 模型调用日志记录提供详细的输入输出交互审计。\n\n**❌ 为什么其他选项错**：\n- B.NAT 网关出站到公共端点：NAT 网关流量经公网，违反私有网络路径要求\n- C.公共端点+VPC 路由：公共端点不符合私有连接要求，权限边界不如角色策略精确\n- D.OIDC+SCP+Entra ID 日志：SCP 为账户级控制非部门级，Entra ID 内置日志不覆盖 AWS 侧 API 调用\n\n**📌 关键概念**：SAML 联合实现企业身份与 IAM 集成，PrivateLink VPC 端点保障 API 调用私有化，部门 IAM 角色通过 ModelId 条件实现模型级访问控制。","s":"第三方#30"},{"id":"D3-024","d":3,"t":"multiple","q":"某大学构建包含多个子应用的 AI 驱动应用平台，子应用包括 AI 助手、作业评分器和内部分析工具。大学使用多种基础模型定义和测试多个提示，希望比较提示变体并选出最佳输出版本。须实现提示版本控制、变体测试和审计跟踪，同时保持一致性并允许提示集成到主应用中。哪组方案组合能以最少运营开销满足需求？（选择两项）","o":[{"l":"A","t":"使用 Bedrock Prompt Management 创建版本化提示。为每个用例包含参数化变量"},{"l":"B","t":"将提示存入 S3。使用 Step Functions 编排模型交互和服务集成"},{"l":"C","t":"使用 Bedrock Flows 创建工作流，结合 FM 和 AWS 服务"},{"l":"D","t":"配置 Config 记录提示更改。用 CloudTrail 跟踪提示使用"},{"l":"E","t":"配置 Bedrock 智能提示路由"}],"a":["A","C"],"e":"**✅ 为什么 A、C 对**：\n- A.Prompt Management 版本化提示+参数化变量：原生提供提示版本控制、变体管理和参数化能力，支持跨用例测试和审计跟踪，无需自定义存储或编排\n- C.Bedrock Flows 工作流：将提示集成到工作流中与 FM 和 AWS 服务结合，实现提示在主应用中的一致部署和测试编排\n\n**❌ 为什么其他选项错**：\n- B.S3 存储提示+Step Functions：需自定义版本控制和编排逻辑，运营开销高于原生方案\n- D.Config+CloudTrail：Config 跟踪资源配置变更非提示版本，CloudTrail 记录 API 调用非提示内容审计\n- E.智能提示路由：路由用于模型选择优化，非版本控制和变体测试工具\n\n**📌 关键概念**：Prompt Management 提供原生提示版本控制和参数化变体管理，Flows 将提示集成到编排工作流中实现测试和部署一致性。","s":"第三方#32"},{"id":"D3-025","d":3,"t":"multiple","q":"某公司在 AWS Organizations 中管理多个 AWS 账户，员工跨账户使用 Bedrock。公司须防止特定主题和专有信息出现在对模型的提示中，须确保员工仅使用已批准的模型，并希望集中管理这些控制措施。哪组方案组合可满足需求？（选择两项）","o":[{"l":"A","t":"为每个员工 IAM 角色创建权限边界，要求使用已批准护栏标识符调用模型。创建 SCP 允许仅使用已批准模型"},{"l":"B","t":"创建 SCP 允许仅使用已批准模型。配置 SCP 要求员工调用已批准模型时指定护栏标识符"},{"l":"C","t":"创建 SCP，若调用模型时未指定集中部署的护栏标识符则阻止调用。在每个员工 IAM 角色上创建权限边界，允许仅调用已批准模型"},{"l":"D","t":"使用 CloudFormation 创建具有阻止过滤策略的自定义 Bedrock 护栏。使用堆栈集将护栏部署到组织中每个账户"},{"l":"E","t":"借助 CloudFormation 构建采用遮蔽过滤策略的定制 Bedrock 护栏，以堆栈集方式推送到组织内各个账户"}],"a":["C","D"],"e":"**✅ 为什么 C、D 对**：\n- C.SCP 强制护栏标识符+IAM 权限边界：SCP 在组织层强制调用模型时须指定护栏标识符，权限边界在账户层限定仅可用已批准模型，双层控制实现集中治理\n- D.CloudFormation 阻止过滤护栏+堆栈集：堆栈集将护栏部署到所有账户，阻止过滤策略在护栏层拦截禁止主题和专有信息\n\n**❌ 为什么其他选项错**：\n- A.权限边界要求护栏+SCP 允许模型：权限边界无法强制指定护栏标识符，需 SCP 条件键，且 SCP 仅允许模型不强制护栏\n- B.SCP 允许模型+SCP 要求护栏：SCP 无法在同一策略中既允许又附加条件要求护栏，需权限边界配合\n- E.遮蔽策略护栏+堆栈集：遮蔽过滤适合处理敏感输出而非拦截提示中禁止主题，与防泄漏需求不匹配\n\n**📌 关键概念**：SCP 在组织层通过条件键强制护栏标识符指定，权限边界在账户层限定已批准模型，堆栈集实现护栏集中部署和一致管理。","s":"第三方#36"},{"id":"D3-026","d":3,"t":"multiple","q":"某公司在 Control Tower 中配置了着陆区，处理须保留在欧盟境内的敏感数据，仅可使用 eu-central-1 区域。公司使用 SCP 强制数据驻留策略。GenAI 开发人员被分配具有 Bedrock 完全权限的 IAM 角色。公司须确保开发人员仅通过跨区域推理在 eu-central-1 中使用 Nova Pro 模型。开发人员通过 Playground 调用模型时收到 SCP 拒绝错误。哪组方案组合可解决该错误并保留现有治理控制？（选择两项）","o":[{"l":"A","t":"向开发人员 IAM 角色添加 AdministratorAccess 策略"},{"l":"B","t":"扩展现有 SCP，为 eu.amazon.nova-pro-v1:0 推理配置文件启用 CRI"},{"l":"C","t":"在 eu-west-3 区域启用 Nova Pro 的 Bedrock 模型访问"},{"l":"D","t":"验证开发人员 IAM 角色是否有权限通过欧盟区域中的推理配置文件调用 Nova Pro"},{"l":"E","t":"扩展现有 SCP，为 eu-* 推理配置文件启用 CRI"}],"a":["B","E"],"e":"**✅ 为什么 B、E 对**：\n- B.扩展 SCP 为特定推理配置文件启用 CRI：精确允许 eu.amazon.nova-pro-v1:0 配置文件的跨区域推理，使开发人员可通过 CRI 在 eu-central-1 使用 Nova Pro 而不违反数据驻留\n- E.扩展 SCP 为 eu-* 推理配置文件启用 CRI：为所有欧洲区域推理配置文件启用 CRI，确保跨区域推理请求不被 SCP 拒绝，同时保持在欧盟境内符合数据驻留策略\n\n**❌ 为什么其他选项错**：\n- A.AdministratorAccess：过度授权违反最小权限原则，不解决 SCP 拒绝问题\n- C.在 eu-west-3 启用模型访问：问题在于 SCP 拒绝非模型访问未启用，且 eu-west-3 非数据驻留区域\n- D.验证 IAM 权限：SCP 拒先于 IAM 权限评估，IAM 权限不解决 SCP 层面的阻塞\n\n**📌 关键概念**：SCP 通过条件键控制跨区域推理配置文件的访问，扩展 SCP 为 eu-* 推理配置文件启用 CRI 可在保持数据驻留合规的同时解决 Playground 调用被拒绝的问题。","s":"第三方#49"},{"id":"D3-027","d":3,"t":"multiple","q":"某银行构建生成式 AI 应用，使用 Bedrock 通过扫描的财务文档评估贷款申请。应用须从文档中提取结构化数据、在推理前编辑 PII、用 FM 生成批准结果，并将低置信度提取结果路由到与申请人同区域的人工审核员。须符合严格的区域数据驻留和可审计性要求，每天处理 25000 份申请并提供 99.9% 可用性。哪组方案组合可满足需求？（选择三项）","o":[{"l":"A","t":"在同一区域内部署 Textract 和 Augmented AI 从扫描文档提取数据。将低置信度页面路由到人工审核员"},{"l":"B","t":"使用 Lambda 在推理前检测并编辑文档中的 PII。应用 Bedrock 护栏防止不当内容。配置区域特定 IAM 角色强制数据驻留"},{"l":"C","t":"在推理前使用 Kendra 和 OpenSearch Service 从文档语义提取字段级值"},{"l":"D","t":"将上传文档存入 S3 并应用对象元数据。配置 IAM 策略将原始文档存储在申请人所在同区域。为审计启用对象标记"},{"l":"E","t":"使用 Glue Data Quality 验证结构化数据。用 Step Functions 编排包含提示工程步骤的审核工作流"},{"l":"F","t":"使用 SageMaker Clarify 基于 Bedrock 模型评分决策生成公平性和偏见报告"}],"a":["A","B","D"],"e":"**✅ 为什么 A、B、D 对**：\n- A.同区域 Textract+Augmented AI：Textract 提取扫描文档数据，Augmented AI 将低置信度页面路由到同区域人工审核员，满足数据驻留和人工兜底需求\n- B.Lambda 编辑 PII+Bedrock 护栏+区域 IAM 角色：推理前 Lambda 检测编辑 PII，护栏防止不当输出，区域特定 IAM 角色强制数据驻留\n- D.S3 存储同区域+对象元数据+标记：原始文档存储在申请人同区域满足驻留要求，对象元数据和标记支持审计可追溯性\n\n**❌ 为什么其他选项错**：\n- C.Kendra+OpenSearch 语义提取：需求为结构化数据提取非语义搜索，引入不必要服务\n- E.Glue Data Quality+Step Functions 编排：Glue Data Quality 非用于文档提取验证，Step Functions 编排增加运营开销\n- F.SageMaker Clarify 公平性报告：需求未提及公平性评估，Clarify 非核心需求组件\n\n**📌 关键概念**：Textract 配合 Augmented AI 实现同区域文档提取和人工兜底，Lambda 编辑 PII 配合护栏保障安全，S3 同区域存储和元数据标记满足数据驻留和审计要求。","s":"第三方#51"},{"id":"D3-028","d":3,"t":"single","q":"某零售企业运营一款基于 Bedrock 的商品推荐系统，依据用户的浏览轨迹与人口特征数据为其推送商品。企业须跨多个受众群体开展公平性测评，对比两种提示词策略在推荐结果中的偏差情况，并实时采集和跟踪公平性指标。若各群体间指标偏差超过 15% 须触发告警，同时每周生成两套策略的绩效对比报告。哪项方案在最少自定义开发的前提下满足需求？","o":[{"l":"A","t":"配置 CloudWatch 仪表板显示 Bedrock API 调用默认指标。基于模型输出创建自定义指标。设 EventBridge 规则调用 Lambda 执行后处理分析并发布公平性指标"},{"l":"B","t":"在 Prompt Management 中创建两个提示变体。使用 Bedrock Flows 部署具有流量分配的变体。配置护栏监控人口统计公平性。用 InvocationsIntervened 指标设 CloudWatch 告警检测差异阈值违规"},{"l":"C","t":"设置 SageMaker Clarify 分析模型输出。将公平性指标发布到 CloudWatch。创建结合 Clarify 偏见指标和 Bedrock 延迟指标的复合告警"},{"l":"D","t":"创建 Bedrock 模型评估作业比较两变体间的公平性。在 CloudWatch 中启用模型调用日志。为每个人口统计群体设 InvocationsIntervened 指标告警"}],"a":["B"],"e":"**✅ 为什么 B.Prompt Management 变体+Flows 流量分配+护栏+InvocationsIntervened 告警 对**：Prompt Management 创建两个提示变体，Flows 分配流量实现 A/B 测试。护栏监控人口统计公平性，InvocationsIntervened 指标记录护栏干预事件，通过 GuardrailContentSource 维度可按人口统计群体分组检测差异。设 CloudWatch 告警在差异超 15% 时触发，全部使用 Bedrock 原生能力，自定义开发量最小。\n\n**❌ 为什么其他选项错**：\n- A.CloudWatch 默认指标+Lambda 后处理：需自定义 Lambda 分析逻辑，开发量大且非实时\n- C.SageMaker Clarify+复合告警：Clarify 为批量分析工具非实时监控，复合告警配置复杂\n- D.模型评估作业：评估作业为离线批量比较非实时监控，无法满足 15% 差异实时告警需求\n\n**📌 关键概念**：Prompt Management 变体配合 Flows 流量分配实现 A/B 测试，护栏 InvocationsIntervened 指标按 GuardrailContentSource 维度监控人口统计公平性，CloudWatch 告警实现实时阈值检测。","s":"第三方#52"},{"id":"D3-029","d":3,"t":"multiple","q":"某金融机构正在研发一款智能助手，为客户的投资规划和资产配置提供辅助。风控团队已标定若干高风险交互场景——例如索取个股推荐或承诺收益保证——若缺乏有效管控将触发合规风险。团队须保证助手不输出违规的理财指导、不产出涉及竞品的评价内容、不做出超出已审核投资指引依据的事实断言。团队计划借助 Bedrock 护栏构建防护体系。哪组步骤组合可满足需求？（选择三项）","o":[{"l":"A","t":"将高风险对话模式添加到拒绝主题护栏中"},{"l":"B","t":"配置内容过滤器护栏，过滤包含高风险对话模式的提示"},{"l":"C","t":"配置内容过滤器护栏，过滤包含竞争对手名称的提示"},{"l":"D","t":"将竞争对手名称添加为自定义词过滤器。将输入和输出操作设为阻止"},{"l":"E","t":"设置低基础事实分数阈值"},{"l":"F","t":"设置高基础事实分数阈值"}],"a":["A","D","F"],"e":"**✅ 为什么 A、D、F 对**：\n- A.拒绝主题护栏：将高风险场景（个股推荐、收益保证）添加为拒绝主题，直接阻断助手进入相关对话路径\n- D.自定义词过滤器+阻止：将竞品名称添加为词过滤器并设输入输出阻止，确保双向均不出现竞品信息\n- F.高基础事实分数阈值：设高阈值确保响应仅基于已审核投资指引中的事实，低分内容被拦截\n\n**❌ 为什么其他选项错**：\n- B.内容过滤器过滤高风险提示：内容过滤器针对有害内容非主题控制，不适合过滤投资建议模式\n- C.内容过滤器过滤竞品名称：内容过滤器非精确词汇匹配工具，自定义词过滤器更合适\n- E.低基础事实分数阈值：低阈值允许更多未验证内容通过，无法防止不实声明\n\n**📌 关键概念**：拒绝主题护栏阻断高风险场景，自定义词过滤器精确屏蔽竞品词汇，高基础事实分数阈值确保响应基于已验证事实。","s":"第三方#53"},{"id":"D3-030","d":3,"t":"single","q":"某野生动物保护组织在多国运营动物园，借助传感设备、追踪器和影音记录装置监测动物活动。组织计划上线一款 AI 助手，可接入多种模态的数据用于动物行为学分析。助手须允许用自然语言进行查询、规避对动物行为的臆测性解读，并为伦理审查留存完整的操作日志。哪项方案可满足需求？","o":[{"l":"A","t":"将原始视频摄取到 Rekognition 检测动物姿态。用 Data Firehose 将传感器和 GPS 数据流式传输到 S3。用 Systems Manager Parameter Store 中的模板提示 Bedrock FM。用 IAM 访问控制和 CloudTrail 审计"},{"l":"B","t":"使用 SageMaker Processing 和 Transcribe 预处理多模态数据。将精选摘要摄取到 Bedrock 知识库中。应用护栏限制推测性输出。用 AppConfig 管理提示模板。用 CloudTrail 记录研究活动用于审计"},{"l":"C","t":"使用 OpenSearch Serverless 索引行为日志和遥测数据。用 Comprehend 提取实体。用 Bedrock 回答索引数据问题。用 IAM 访问控制和 CloudTrail 审计"},{"l":"D","t":"配置 Q Business 跨 S3、Kinesis 和 SageMaker Feature Store 整合数据。用 EventBridge 编排摄取。用自定义 Lambda 函数过滤 LLM 输出的伦理合规性"}],"a":["B"],"e":"**✅ 为什么 B.SageMaker Processing+Transcribe+知识库+护栏+AppConfig+CloudTrail 对**：SageMaker Processing 预处理多模态数据（传感器、音视频），Transcribe 将音频转为文本。精选摘要摄入知识库支持自然语言查询。护栏限制推测性输出满足避免推测性行为解释的要求。AppConfig 管理提示模板确保一致性。CloudTrail 记录所有研究活动用于伦理审计。\n\n**❌ 为什么其他选项错**：\n- A.Rekognition+Firehose+Parameter Store：Parameter Store 非提示管理工具，缺乏推测性输出控制\n- C.OpenSearch+Comprehend+Bedrock：缺乏推测性输出限制机制，Comprehend 实体提取非多模态预处理\n- D.Q Business+自定义 Lambda：自定义 Lambda 伦理过滤不如护栏原生安全控制可靠\n\n**📌 关键概念**：SageMaker Processing 预处理多模态数据，知识库支持自然语言查询，护栏限制推测性输出，AppConfig 管理提示模板，CloudTrail 维护审计日志。","s":"第三方#54"},{"id":"D3-031","d":3,"t":"single","q":"某银行开发使用 Bedrock 的 AI 助手，帮助网站用户处理账户咨询和财务指导。银行须确保助手不在客户交互中泄露 PII、不在提示中包含 PII、不响应投资建议请求，并须收集所有客户交互的审计日志（含传输的图像或文档）。哪项方案运营工作量最小？","o":[{"l":"A","t":"使用 Macie 检测并编辑 PII。用提示工程避免投资建议主题。用 CloudTrail 捕获对话日志"},{"l":"B","t":"用 Lambda 和 Comprehend 检测编辑 PII。用 Comprehend 主题建模防止投资建议。在 CloudWatch 中设自定义指标捕获对话"},{"l":"C","t":"配置 Bedrock 护栏应用敏感信息策略检测过滤 PII。设主题策略确保助手避免投资建议主题。用 Converse API 记录模型调用。启用投递日志和图像日志记录到 S3"},{"l":"D","t":"用正则表达式匹配 PII 模式。用提示工程避免返回 PII 或投资建议。启用模型调用日志、投递日志和图像日志记录到 S3"}],"a":["C"],"e":"**✅ 为什么 C.Bedrock 护栏 PII 过滤+主题策略+Converse API+日志记录 对**：护栏的敏感信息策略原生检测和过滤 PII，无需自定义 Lambda 或正则表达式。主题策略直接阻止投资建议话题，无需提示工程。Converse API 记录模型调用，投递日志和图像日志记录将完整交互内容（含图像和文档）存储到 S3 用于审计。全部使用 Bedrock 原生能力，运营工作量最小。\n\n**❌ 为什么其他选项错**：\n- A.Macie+提示工程+CloudTrail：Macie 用于数据扫描非实时交互过滤，提示工程不可靠，CloudTrail 不记录对话内容\n- B.Lambda+Comprehend+主题建模：需自定义 Lambda 管道，Comprehend 主题建模非为投资建议主题控制设计\n- D.正则表达式+提示工程：正则表达式无法覆盖所有 PII 变体，提示工程不可靠\n\n**📌 关键概念**：Bedrock 护栏敏感信息策略原生过滤 PII，主题策略阻止特定话题，Converse API 配合投递日志和图像日志记录提供完整的交互审计追踪。","s":"第三方#62"},{"id":"D3-032","d":3,"t":"single","q":"某公司使用 Bedrock 构建面向客户的 AI 助手，处理敏感客户咨询。公司须用纵深防御安全控制阻止复杂的提示注入攻击，保留所有安全干预的审计日志，且助手须具备跨区域故障转移能力。哪项方案可满足需求？","o":[{"l":"A","t":"配置 Bedrock 护栏将内容过滤器设为高以防范提示注入。使用护栏配置文件实施跨区域护栏推理。用 CloudWatch Logs 配合自定义指标捕获详细的护栏干预事件"},{"l":"B","t":"配置 Bedrock 护栏将内容过滤器设为高。用 WAF 阻止可疑输入。用 CloudTrail 记录 API 调用"},{"l":"C","t":"部署 Comprehend 自定义分类器检测提示注入。用 API Gateway 请求验证。用 CloudWatch Logs 捕获干预事件"},{"l":"D","t":"配置 Bedrock 护栏将自定义内容过滤器和词过滤器设为高。配置跨区域护栏复制实现故障转移。将日志存入 CloudTrail 供合规审计"}],"a":["A"],"e":"**✅ 为什么 A.护栏高过滤器+护栏配置文件跨区域+CloudWatch Logs 对**：护栏内容过滤器设为高提供对提示注入的纵深防御。护栏配置文件实现跨区域护栏推理，当主区域不可用时自动故障转移。CloudWatch Logs 配合自定义指标捕获详细的护栏干预事件，提供安全干预的完整审计记录。方案将安全控制、跨区域弹性和审计追踪整合在 Bedrock 原生能力中。\n\n**❌ 为什么其他选项错**：\n- B.护栏+WAF+CloudTrail：WAF 阻止可疑输入但缺乏跨区域故障转移能力，CloudTrail 不记录护栏干预详情\n- C.Comprehend 分类器+API Gateway：Comprehend 非为提示注入检测设计，缺乏跨区域弹性\n- D.自定义过滤器+跨区域复制：跨区域护栏复制非标准功能，CloudTrail 不记录护栏干预详情\n\n**📌 关键概念**：Bedrock 护栏配置文件实现跨区域护栏推理和自动故障转移，高内容过滤器防范提示注入，CloudWatch Logs 自定义指标记录安全干预审计。","s":"第三方#63"},{"id":"D3-033","d":3,"t":"single","q":"某金融服务企业上线了一款基于 Bedrock 的智能应用，辅助客服人员为客户提供个性化理财建议。企业须建立全方位治理框架，践行负责任 AI 原则并符合监管标准。方案须识别和遏制建议中的幻觉现象、对客户交互施加安全管控、动态监测模型行为偏移，并留存全部提示与响应对的审计轨迹。须在 60 天内完成部署、对接既有合规看板，且客户响应延迟不超过 200 毫秒。哪项方案运营开销最小？","o":[{"l":"A","t":"配置 Bedrock 护栏应用自定义内容过滤器和毒性检测。用 Bedrock Model Evaluation 检测幻觉。将提示响应对存入 DynamoDB 并设 TTL。将 CloudWatch 自定义指标与现有合规仪表板集成"},{"l":"B","t":"部署 Bedrock 并用 PrivateLink 安全访问。用 Lambda 实施自定义提示验证。将提示响应对存入 S3 并配生命周期策略。创建自定义 CloudWatch 仪表板监控"},{"l":"C","t":"使用 Bedrock Agents 和知识库基于事实生成响应。用护栏强制内容安全。用 OpenSearch Service 存储索引提示响应对。将 OpenSearch 与 QuickSight 集成创建合规报告"},{"l":"D","t":"使用 SageMaker Model Monitor 检测行为漂移。用 WAF 过滤内容。将交互存入加密 RDS。用 API Gateway 创建自定义 HTTP API 与合规仪表板集成"}],"a":["A"],"e":"**✅ 为什么 A.护栏+Model Evaluation+DynamoDB+CloudWatch 对**：护栏的自定义内容过滤器和毒性检测提供安全控制。Model Evaluation 检测幻觉确保建议质量。DynamoDB 存储提示响应对并设 TTL 实现审计追踪的自动管理。CloudWatch 自定义指标与现有合规仪表板集成实现实时监控。全部使用 Bedrock 和 AWS 原生服务，60 天内部署可行且运营开销最小。\n\n**❌ 为什么其他选项错**：\n- B.PrivateLink+Lambda+S3：自定义 Lambda 验证增加开发量和维护负担，S3 生命周期非为实时审计设计\n- C.Agents+知识库+OpenSearch+QuickSight：多服务集成增加复杂性和部署时间，QuickSight 为 BI 工具非实时监控\n- D.SageMaker Model Monitor+WAF+RDS：引入 SageMaker 管理和 RDS 运维开销，WAF 非内容安全控制\n\n**📌 关键概念**：Bedrock 护栏提供安全控制和毒性检测，Model Evaluation 检测幻觉，DynamoDB 配 TTL 管理审计追踪，CloudWatch 自定义指标集成合规仪表板实现实时监控。","s":"第三方#64"},{"id":"D3-034","d":3,"t":"single","q":"某公司使用 Bedrock 开发客户支持 AI 助手，助手须回答客户账户问题且不在响应中暴露个人信息。公司须遵守数据驻留策略确保所有处理在每个客户所在同一 AWS 区域进行。公司希望在上线前评估助手在防止信息暴露方面的有效性。哪项方案可满足需求？","o":[{"l":"A","t":"配置跨区域 Bedrock 护栏应用敏感信息过滤器。开发和测试期间设为检测模式。生产时切换到阻止模式"},{"l":"B","t":"配置 Bedrock 护栏应用敏感信息过滤器。开发和测试期间设为掩码模式。生产时切换到阻止模式。在公司运营的每个区域部署护栏副本"},{"l":"C","t":"配置 Bedrock 护栏应用内容和主题过滤器。开发测试和生产期间设为检测模式。禁用模型调用日志记录"},{"l":"D","t":"配置跨区域 Bedrock 护栏应用内容和词过滤器。开发和测试期间设为检测模式。生产时切换到掩码模式"}],"a":["B"],"e":"**✅ 为什么 B.区域护栏副本+掩码→阻止模式 对**：数据驻留要求处理在同一区域进行，在各运营区域部署护栏副本确保本地评估不跨区域。掩码模式在开发测试期用占位符替换敏感信息，允许观察助手行为同时不暴露真实数据。生产切换阻止模式直接拦截含个人信息的响应。检测模式仅记录不处理，不足以评估防护效果。\n\n**❌ 为什么其他选项错**：\n- A.跨区域护栏+检测模式：跨区域将数据路由到其他区域违反驻留策略，检测模式仅记录不阻止\n- C.内容主题过滤器+检测+禁用日志：检测模式不阻止暴露，禁用日志违反审计要求\n- D.跨区域护栏+检测→掩码：跨区域违反驻留，掩码在生产中仍允许部分信息通过\n\n**📌 关键概念**：各区域部署独立护栏副本满足驻留要求，掩码模式用于开发测试评估防护，阻止模式用于生产完全拦截敏感信息。","s":"第三方#69"},{"id":"D3-035","d":3,"t":"single","q":"某电梯服务公司使用 Bedrock 开发 AI 助手应用，生成电梯维护建议支持技术人员。公司用 Kinesis Data Streams 收集电梯传感器数据。新法规要求人工技术人员须审核所有 AI 生成的建议。公司须建立人工监督工作流审核和批准 AI 建议，并存储所有审核决定供审计。哪项方案可满足需求？","o":[{"l":"A","t":"用 Lambda 和 SQS 队列创建自定义审批工作流。审核决定存入 DynamoDB 供审计"},{"l":"B","t":"创建具有 waitForTaskToken API 暂停执行的人工审批步骤的 Step Functions 工作流。技术人员完成审核后用 Lambda 调用 SendTaskSuccess API 附上审批决定。审核决定存入 DynamoDB"},{"l":"C","t":"创建具有人工审批步骤的 Glue 工作流。审核后用 Lambda 调用 SendTaskSuccess API。审核决定存入 DynamoDB"},{"l":"D","t":"配置自定义事件模式的 EventBridge 规则将 AI 建议路由到技术人员审核。创建 Glue 作业处理审批队列。用 ElastiCache 缓存审核决定"}],"a":["B"],"e":"**✅ 为什么 B.Step Functions waitForTaskToken+Lambda SendTaskSuccess+DynamoDB 对**：Step Functions 的 waitForTaskToken 模式使工作流暂停等待人工审批完成后继续执行，天然适合人工监督场景。技术人员审核后 Lambda 调用 SendTaskSuccess API 携带审批决定恢复工作流。DynamoDB 持久化存储所有审核决定供审计追踪。该方案提供完整的等待-审批-恢复-记录链路，无需自定义队列管理。\n\n**❌ 为什么其他选项错**：\n- A.Lambda+SQS：需自定义审批编排和队列管理，缺乏工作流状态跟踪和暂停恢复机制\n- C.Glue 工作流：Glue 为 ETL 工具非为人工审批编排设计，不支持 waitForTaskToken 模式\n- D.EventBridge+Glue+ElastiCache：ElastiCache 为临时缓存不适合持久审计存储，Glue 非审批编排工具\n\n**📌 关键概念**：Step Functions waitForTaskToken 模式实现工作流暂停等待人工审批后恢复执行，Lambda SendTaskSuccess API 传递审批结果，DynamoDB 持久化审计记录。","s":"第三方#76"},{"id":"D3-036","d":3,"t":"single","q":"某企业搭建客户沟通平台，由 Bedrock FM 驱动的 AI 助手负责归纳客户消息并起草回复。企业计划借助 Comprehend 构建多层内容过滤机制，须杜绝违规冒犯性信息的传播、保障客户隐私安全，并识别潜在的不良请求倾向（涵盖不道德行为诉求、危险活动邀约或操纵性提议等）。全部预处理过滤步骤须在数据抵达 FM 之前执行完毕，且不显著影响响应延迟。哪项方案可满足需求？","o":[{"l":"A","t":"使用带异步 API 调用的并行处理。对冒犯性内容用毒性检测。对不当建议索取用提示安全分类。用 PII 检测但不编辑"},{"l":"B","t":"用自定义分类构建检测冒犯性内容和不当建议索取的 FM。仅在通过分类器后应用 PII 检测为次要过滤器"},{"l":"C","t":"部署多阶段流程。先用提示安全分类，然后仅对安全提示进行毒性检测，最后以流式模式进行 PII 检测。将标记消息通过 EventBridge 路由到人工审核"},{"l":"D","t":"使用阈值配置为 0.5 的毒性检测覆盖所有类别。对提示安全分类和 PII 检测均使用并行处理并编辑实体。应用 CloudWatch 告警过滤指标"}],"a":["D"],"e":"**✅ 为什么 D.毒性检测 0.5 阈值+并行处理+PII 编辑+CloudWatch 告警 对**：阈值 0.5 的毒性检测覆盖所有冒犯性内容类别，与提示安全分类和 PII 检测并行执行确保全部预处理在 FM 之前完成。PII 检测配合实体编辑保护客户隐私。并行处理避免多阶段串行延迟，保持可接受响应时间。CloudWatch 告警监控过滤指标提供运营可见性。\n\n**❌ 为什么其他选项错**：\n- A.异步并行+PII 检测不编辑：PII 不编辑违反保护客户隐私要求，异步 API 引入不可控延迟\n- B.自定义 FM 分类器+串行 PII：构建自定义 FM 分类器开发量大，串行处理增加延迟\n- C.多阶段串行+流式 PII：多阶段串行处理延迟高，流式 PII 检测在 FM 处理过程中而非之前\n\n**📌 关键概念**：Comprehend 毒性检测覆盖冒犯性内容，提示安全分类检测不当索取，PII 检测配合实体编辑保护隐私，并行处理确保全部预处理在 FM 之前完成。","s":"第三方#78"},{"id":"D3-037","d":3,"t":"single","q":"某医疗公司使用 Bedrock 创建生成式 AI 系统，处理来自多个来源的数据，须维护端到端数据血缘。系统还须使用实时 PII 过滤和审计追踪以自动报告合规性。哪项方案可满足需求？","o":[{"l":"A","t":"使用 Glue Data Catalog 注册所有数据源并跟踪血缘。使用 Bedrock 护栏 PII 过滤器。为所有 Bedrock API 调用启用带 S3 集成的 CloudTrail 日志。用 Macie 扫描存储数据中敏感信息并发布到 CloudWatch Logs。创建 CloudWatch 仪表板可视化并生成自动合规报告"},{"l":"B","t":"使用 Config 跟踪数据源配置和更改。用带自定义规则的 WAF 在应用层过滤 PII。配置 EventBridge 捕获审计事件路由到 S3。用 Comprehend Medical 配合 Lambda 定期分析存储的输出检测违规"},{"l":"C","t":"使用 DataSync 复制数据源跟踪血缘。配置 Macie 扫描 Bedrock 输出中敏感信息。用 Systems Manager Session Manager 记录交互。部署 Textract 配合 Step Functions 从报告中识别编辑 PII"},{"l":"D","t":"配置 Athena 查询数据源分析和报告血缘。用 CloudWatch 自定义指标监控 PII 暴露。用 X-Ray 追踪生成审计。用 Rekognition Custom Labels 检测敏感信息"}],"a":["A"],"e":"**✅ 为什么 A.Glue Data Catalog 血缘+护栏 PII+CloudTrail+Macie+CloudWatch 对**：Glue Data Catalog 注册和跟踪数据源血缘提供端到端可追溯性。Bedrock 护栏 PII 过滤器在推理时实时检测编辑敏感信息。CloudTrail 配合 S3 集成记录所有 Bedrock API 调用提供不可变审计日志。Macie 扫描存储数据中的敏感信息发现残留风险。CloudWatch 仪表板可视化发现结果并生成自动合规报告。\n\n**❌ 为什么其他选项错**：\n- B.Config+WAF+Comprehend Medical：Config 跟踪配置变更非数据血缘，WAF 非实时 PII 过滤工具\n- C.DataSync+Macie+Textract：DataSync 为数据迁移工具非血缘跟踪，Textract 非实时 PII 过滤\n- D.Athena+X-Ray+Rekognition：Athena 为查询工具非血缘管理，X-Ray 为应用追踪非合规审计\n\n**📌 关键概念**：Glue Data Catalog 提供数据血缘跟踪，Bedrock 护栏实现实时 PII 过滤，CloudTrail 和 Macie 提供审计和敏感数据扫描，CloudWatch 仪表板自动生成合规报告。","s":"第三方#79"},{"id":"D3-038","d":3,"t":"single","q":"某 GenAI 开发者正在评估 Bedrock 基础模型以增强欧洲公司内部应用。公司在 Control Tower 中有多账户着陆区，SCP 仅允许使用 eu-north-1 和 eu-west-1 区域。所有客户数据须保留在已批准区域的私有网络中。开发者选定的 FM 托管在 eu-central-1 和 eu-west-3。开发者须为公司员工启用 FM 访问，确保请求私有且保持在 FM 同区域内。哪项方案可满足需求？","o":[{"l":"A","t":"部署通过私有 API Gateway REST API 向 eu-north-1 中 VPC 公开的 Lambda 函数。在 eu-central-1 和 eu-west-3 中为 FM 创建 VPC 端点。扩展 SCP 允许使用 FM。将 REST API 与应用集成"},{"l":"B","t":"在 eu-north-1 中的 EC2 实例上部署 FM。在 EC2 前部署私有 API Gateway REST API。配置 Bedrock VPC 端点。将 REST API 与应用集成"},{"l":"C","t":"通过欧洲范围端点配置 FM 使用跨区域推理。配置 Bedrock VPC 端点。扩展 SCP 允许员工通过 FM 可用的欧洲区域中的推理配置文件使用 FM。使用推理配置文件将 Bedrock 与应用集成"},{"l":"D","t":"在 eu-north-1 中的 SageMaker 中部署 FM。配置 SageMaker VPC 端点。扩展 SCP 允许使用 SageMaker 端点。将 SageMaker 中的 FM 与应用集成"}],"a":["C"],"e":"**✅ 为什么 C.跨区域推理+Bedrock VPC 端点+SCP 扩展+推理配置文件 对**：跨区域推理通过欧洲范围端点将请求路由到 FM 所在区域（eu-central-1 和 eu-west-3），同时保持请求在私有网络内。Bedrock VPC 端点确保 API 调用不经公网。扩展 SCP 允许通过推理配置文件访问使员工可在已批准区域调用托管在其他欧洲区域的 FM。推理配置文件将跨区域路由抽象为单一端点，应用集成简洁。\n\n**❌ 为什么其他选项错**：\n- A.Lambda+多区域 VPC 端点：跨区域 API Gateway 调用复杂，SCP 限制 eu-north-1 但 FM 在其他区域\n- B.EC2 部署 FM：FM 已在 Bedrock 托管无需自行部署，EC2 管理增加运营开销\n- D.SageMaker 部署 FM：FM 已在 Bedrock 可用，SageMaker 增加额外托管和管理\n\n**📌 关键概念**：跨区域推理通过欧洲范围端点将请求路由到 FM 所在区域，VPC 端点保障私有网络，SCP 扩展允许推理配置文件访问使已批准区域员工可用 FM。","s":"第三方#80"},{"id":"D3-039","d":3,"t":"single","q":"某媒体企业上线了一个内容创作平台，每小时有数以千计的用户上传图片与文字素材。平台借助 Bedrock 对上传素材进行加工并产出创意作品。企业须保障平台既不处理也不输出违规内容、不在作品中泄露 PII，且方案须兼容既有的 S3 存储工作流。哪项方案在基础设施运维成本最低的前提下满足需求？","o":[{"l":"A","t":"启用 Enhanced Monitoring。用 CloudWatch 告警过滤流量。用 Comprehend PII 检测预处理。创建 CloudWatch 告警监控 PII 检测事件。创建含 Rekognition 图像审核步骤的 Step Functions 工作流"},{"l":"B","t":"使用 API Gateway HTTP API 和请求验证模板在存入 S3 前筛选内容。用 SageMaker AI 构建自定义审核模型在发送到 Bedrock 前处理内容"},{"l":"C","t":"创建 Cognito 用户池，用预认证 Lambda 运行内容审核。用 Textract 过滤文本，用 Rekognition 过滤图像后再允许上传"},{"l":"D","t":"创建 Step Functions 工作流使用内置 Bedrock 护栏过滤内容。用 Comprehend PII 检测预处理内容。使用 Rekognition 图像审核功能"}],"a":["D"],"e":"**✅ 为什么 D.Step Functions+Bedrock 护栏+Comprehend PII+Rekognition 图像审核 对**：Step Functions 编排内容审核工作流，Bedrock 护栏原生过滤不当内容无需自定义模型。Comprehend PII 检测预处理文本中的敏感信息。Rekognition 图像审核检测不当图像内容。三者配合覆盖文本和图像两种模态，全部使用托管服务且与 S3 工作流集成，基础设施管理开销最少。\n\n**❌ 为什么其他选项错**：\n- A.CloudWatch 告警过滤流量：CloudWatch 告警为监控工具非内容过滤，Rekognition 步骤缺乏文本审核\n- B.API Gateway+SageMaker 自定义模型：构建自定义审核模型开发量大，SageMaker 管理增加运营开销\n- C.Cognito+预认证 Lambda+Textract：Cognito 预认证用于身份验证非内容审核，Textract 为文档提取非内容审核\n\n**📌 关键概念**：Step Functions 编排 Bedrock 护栏（不当内容过滤）、Comprehend（PII 检测）和 Rekognition（图像审核）的多模态内容审核工作流，全部托管服务最少运维。","s":"第三方#81"},{"id":"D3-040","d":3,"t":"single","q":"某金融服务企业借助 Bedrock 打造客服 AI 助手。助手不得与用户讨论投资理财话题，须拦截有害信息、遮蔽 PII 并留存合规审计轨迹。助手须基于内容敏感程度对输入和输出双向实施差异化过滤。企业须配置策略执行有效且误报率最低的 Bedrock 护栏，为各类敏感信息提供差异化的处理手段。哪项方案可满足需求？","o":[{"l":"A","t":"配置单个护栏将所有类别内容过滤器设为高。设投资建议拒绝主题含示例短语。设敏感信息过滤器对所有 PII 实体应用阻止。将护栏应用于所有推理调用"},{"l":"B","t":"用分层策略配置多个护栏。一个护栏内容过滤器设为高并在公共交互中阻止 PII。第二个护栏内容过滤器设为中并在内部使用中屏蔽 PII。配置多个特定主题护栏阻止投资建议并设上下文基础检查"},{"l":"C","t":"配置一个护栏将有害内容过滤器设为中。设投资建议拒绝主题含清晰定义和示例短语。配置敏感信息过滤器在响应中屏蔽 PII、在输入中阻止财务信息。启用输入和输出评估并使用自定义阻止消息进行审计"},{"l":"D","t":"为每个用例创建单独护栏。一个应用有害内容过滤器。一个应用投资建议主题过滤器。一个应用敏感信息过滤器阻止 PII。用 Step Functions 顺序链接"}],"a":["C"],"e":"**✅ 为什么 C.单护栏中过滤器+拒绝主题+差异化 PII+输入输出评估 对**：有害内容过滤器设为中（非高）减少误报同时仍拦截有害内容。拒绝主题含清晰定义和示例短语精确匹配投资建议。敏感信息过滤器对响应中的 PII 使用屏蔽（部分遮盖保留上下文），对输入中的财务信息使用阻止（完全拒绝），实现差异化处理。启用输入输出双向评估配合自定义阻止消息提供审计追踪。\n\n**❌ 为什么其他选项错**：\n- A.全高过滤器+阻止所有 PII：全高过滤器增加误报，阻止所有 PII 过于严格\n- B.多护栏分层策略：多护栏配置管理复杂且策略可能冲突\n- D.每用例单独护栏+Step Functions：顺序链接多护栏增加延迟和编排复杂性\n\n**📌 关键概念**：单护栏配合中等强度过滤器减少误报，拒绝主题精确匹配投资建议，敏感信息过滤器对输入输出差异化处理，自定义阻止消息支持审计。","s":"第三方#83"},{"id":"D3-041","d":3,"t":"single","q":"某精品咖啡品牌运营一款移动应用，借助 Bedrock 以三段式提示链路为客户定制咖啡烘焙建议。该链路先将用户输入转化为结构化元数据，继而检索关联的烘焙记录，最终输出个性化的烘焙推荐。跨区域用户反馈同一输入产出的推荐结果不统一、检索环节推理迟缓，且偶现不安全建议（如推荐异常高温冲泡）。公司须将输出一致性提升至 99.5%、推理延迟压降至 1 秒以内，并拦截不安全或凭空生成的推荐。哪项方案可满足需求？","o":[{"l":"A","t":"使用预置吞吐量部署 Bedrock 以稳定推理延迟。应用带语义拒绝规则的护栏阻止不安全输出。使用 Prompt Management 通过审批工作流管理提示"},{"l":"B","t":"使用 Bedrock Agents 管理链式调用。将模型输入输出记录到 CloudWatch Logs。用 CloudWatch 日志对提示版本进行 A/B 测试"},{"l":"C","t":"将提示结果缓存在 ElastiCache 中。用 Lambda 预处理元数据并跟踪端到端延迟。用 X-Ray 识别和修复性能瓶颈"},{"l":"D","t":"使用 Kendra 提高烘焙日志检索准确性。将标准化提示元数据存入 DynamoDB。用 Step Functions 编排多步骤提示"}],"a":["A"],"e":"**✅ 为什么 A.预置吞吐量+护栏语义拒绝+Prompt Management 审批 对**：预置吞吐量提供稳定的推理容量和延迟，消除按需调用的冷启动和限流，使相同输入产生一致的推理结果达到 99.5% 一致性。护栏的语义拒绝规则阻止不安全推荐（如过高温度），确保输出安全。Prompt Management 的审批工作流管理提示版本确保提示变更经过审核防止虚构推荐。\n\n**❌ 为什么其他选项错**：\n- B.Agents+CloudWatch A/B 测试：Agents 管理链式调用但不解决一致性和延迟问题，CloudWatch 日志非 A/B 测试工具\n- C.ElastiCache 缓存+Lambda+X-Ray：缓存仅对重复输入有效，不解决推理一致性和安全性问题\n- D.Kendra+DynamoDB+Step Functions：Kendra 检索改进不解决推理一致性和延迟，增加多服务管理开销\n\n**📌 关键概念**：预置吞吐量保障推理延迟稳定和输出一致性，护栏语义拒绝规则阻止不安全内容，Prompt Management 审批工作流管控提示变更防止虚构推荐。","s":"第三方#89"},{"id":"D3-042","d":3,"t":"single","q":"某跨国医疗保健企业在 Bedrock 上运行 GenAI 应用以产出诊疗建议。各国监管要求存在差异：部分国家须将全部模型输入输出留存 2 年，另一些国家则须上报数据供当地审查。医疗从业者要求各地统一使用标准化医学术语，但诊疗建议需结合当地患者人群特征进行适配。方案须对接既有 EHR 系统，日均承载上限 10000 次查询（响应低于 1 秒），支持部署前审核和批准提示词变更，并生成涵盖提示、响应及用户上下文的完整日志。哪项方案可满足需求？","o":[{"l":"A","t":"用 CloudTrail 记录 API 调用。在 Prompt Management 中创建含患者人口统计变量的标准提示。实施 IAM 策略确保仅批准用户可访问提示"},{"l":"B","t":"用 CloudWatch Logs 收集详细模型调用日志并存入 S3。在 Prompt Management 中创建含治疗选项变量的参数化提示。启用提示版本控制并设审批工作流"},{"l":"C","t":"创建 Lambda 动态生成提示强制临床语言要求。用 CloudWatch Logs 跟踪模型调用。用 SQS 队列实现提示审批工作流"},{"l":"D","t":"将提示模板存入 S3。用 S3 Object Lock 实现版本控制。用 EventBridge 跟踪模型调用。用 Config 监控提示模板变更"}],"a":["B"],"e":"**✅ 为什么 B.CloudWatch Logs+S3+Prompt Management 参数化提示+版本控制+审批 对**：CloudWatch Logs 收集详细的模型调用日志（含提示、响应和用户上下文），存入 S3 可设保留策略满足 2 年合规要求。Prompt Management 参数化提示通过变量注入治疗选项和患者人口统计数据，实现术语一致性和本地适配。版本控制和审批工作流确保部署前审查提示变更。日志覆盖全面满足审计和当地审计提交需求。\n\n**❌ 为什么其他选项错**：\n- A.CloudTrail+标准提示：CloudTrail 记录 API 调用非模型输入输出内容，标准提示缺乏版本控制审批\n- C.Lambda+SQS 审批：自定义 Lambda 提示生成缺乏版本控制，SQS 非审批工作流工具\n- D.S3 Object Lock+EventBridge：S3 Object Lock 为对象保留非提示版本控制，EventBridge 非模型调用日志工具\n\n**📌 关键概念**：CloudWatch Logs 配合 S3 保留满足合规日志要求，Prompt Management 参数化提示实现术语一致性与本地适配，版本控制和审批工作流确保提示变更审查。","s":"第三方#104"},{"id":"D3-043","d":3,"t":"single","q":"某企业基于 Lake Formation 构建数据湖，涵盖跨区域的各业务线数据库与数据表。企业计划借助 Bedrock 调用 FM 执行欺诈识别分析。FM 须从数据湖中读取敏感财务数据，其中部分客户信息包含 PII。企业须设计访问管控方案以确保 PII 不进入生产环节，FM 仅能访问已授权的数据子集且 PII 所在列已移除，同时须记录全部数据访问的审计轨迹。哪项方案可满足需求？","o":[{"l":"A","t":"为每个部门和区域组合在单独 S3 存储桶中创建数据集。配置 S3 存储桶策略基于 IAM 角色控制访问。用 S3 访问日志跟踪数据访问"},{"l":"B","t":"配置 FM 使用 IAM 角色和基于 LF-Tag 表达式的 Lake Formation 权限验证。将业务部门和区域定义为分配给数据库和表的 LF-Tag。用 CloudTrail 收集数据访问审计跟踪"},{"l":"C","t":"在 Lake Formation 中使用直接 IAM 主体授权到特定数据库和表。创建自定义应用层记录访问请求并在发送到 FM 前过滤敏感列"},{"l":"D","t":"配置 FM 从 STS 请求临时凭证。通过预签名 S3 URL 访问数据。用 CloudTrail 收集审计跟踪"}],"a":["B"],"e":"**✅ 为什么 B.IAM 角色+LF-Tag 表达式权限+CloudTrail 对**：Lake Formation 的 LF-Tag 表达式权限支持基于标签的细粒度列级访问控制，可精确指定 FM 可访问哪些数据库和表的哪些列（排除 PII 列）。将业务部门和区域定义为 LF-Tag 实现跨区域多部门的权限管理。IAM 角色提供 FM 的身份验证。CloudTrail 捕获所有数据访问活动提供完整审计跟踪。\n\n**❌ 为什么其他选项错**：\n- A.多 S3 存储桶+存储桶策略：存储桶策略为对象级非列级控制，无法精确排除 PII 列\n- C.直接 IAM 授权+自定义应用层：需自定义应用层过滤增加开发量和运维风险\n- D.STS 临时凭证+预签名 URL：预签名 URL 为对象级访问非列级控制，无法排除 PII 列\n\n**📌 关键概念**：Lake Formation LF-Tag 表达式权限实现基于标签的列级访问控制，精确排除 PII 列同时授权数据子集访问，CloudTrail 提供完整数据访问审计。","s":"第三方#106"},{"id":"D3-044","d":3,"t":"single","q":"某企业借助 Bedrock 构建 GenAI 应用以分析企业数据中的模式与关联。应用日均处理数百万条新增数据记录，数据源遍布欧洲、北美及亚洲各 AWS 可用区，结果存入 S3 存储桶。应用须遵循各所在地的数据保护与留存法规，数据驻留与处理过程均须限制在同一大洲范围内。应用还须留存决策流程的审计轨迹并具备数据分类能力。哪项方案可满足需求？","o":[{"l":"A","t":"在每个区域部署应用并配置本地 IAM 策略。用 Bedrock 跨区域推理分布工作负载。用 CloudWatch 记录决策过程。手动跟踪各区域合规认证"},{"l":"B","t":"用 Organizations SCP 管理位置权限。用 CloudTrail 不可变日志审计决策过程。将自定义模型导入 Bedrock 并部署到每个区域"},{"l":"C","t":"使用 S3 Object Lock 和特定区域的 S3 存储桶策略。在将数据点发送到 Bedrock 前根据地理来源在区域内预处理。用 Macie 对数据分类。用 CloudTrail 不可变日志审计决策过程"},{"l":"D","t":"为每个区域创建独立 AWS 账户配置各自合规框架。用 SageMaker AI 和自定义监控。为每个辖区创建手动合规报告"}],"a":["C"],"e":"**✅ 为什么 C.S3 Object Lock+区域存储桶策略+区域内预处理+Macie+CloudTrail 对**：S3 Object Lock 提供数据不可变性满足存储法规，特定区域存储桶策略强制数据保留在所属大洲。区域内预处理确保数据在发送到 Bedrock 前不跨大洲传输，满足驻留要求。Macie 自动分类数据中的敏感信息。CloudTrail 不可变日志审计决策过程提供合规证据。该方案在数据层实现驻留控制，无需多账户或自定义模型部署。\n\n**❌ 为什么其他选项错**：\n- A.多区域部署+跨区域推理+手动合规：跨区域推理可能跨大洲违反驻留要求，手动合规跟踪不可靠\n- B.SCP+自定义模型导入：自定义模型导入到每个区域增加管理开销，SCP 管理位置但不处理数据分类\n- D.多账户+SageMaker+手动报告：多账户管理复杂，SageMaker 自定义监控增加运维，手动报告不可靠\n\n**📌 关键概念**：S3 Object Lock 和区域存储桶策略实现数据层驻留控制，区域内预处理确保不跨大洲传输，Macie 提供数据分类，CloudTrail 不可变日志审计决策过程。","s":"第三方#108"},{"id":"D3-045","d":3,"t":"single","q":"某公司使用 Lambda 函数构建 AI 代理解决方案。GenAI 开发者须设置访问用户信息的 MCP 服务器，配置 AI 代理使用该服务器，并确保仅授权用户可访问 MCP 服务器。哪项方案可满足需求？","o":[{"l":"A","t":"用 Lambda 托管 MCP 服务器。授予 AI 代理 Lambda 调用 MCP 服务器函数的权限。配置 AI 代理 MCP 客户端异步调用 MCP 服务器"},{"l":"B","t":"用 Lambda 托管 MCP 服务器。授予 AI 代理 Lambda 调用权限。配置 AI 代理使用 STDIO 传输与 MCP 服务器通信"},{"l":"C","t":"用 Lambda 托管 MCP 服务器。创建 API Gateway HTTP API 代理请求到 Lambda 函数。配置 AI 代理使用 Streamable HTTP 传输通过 HTTP API 发出请求。用 Cognito 强制执行 OAuth 2.1"},{"l":"D","t":"用 Lambda 层托管 MCP 服务器。将 Lambda 层添加到 AI 代理 Lambda 函数。配置 AI 代理使用 STDIO 传输发送请求。在 MCP 配置中将 Lambda 层 ARN 指定为命令"}],"a":["C"],"e":"**✅ 为什么 C.Lambda+API Gateway HTTP API+Streamable HTTP+Cognito OAuth 2.1 对**：Lambda 托管 MCP 服务器提供无服务器执行环境。API Gateway HTTP API 代理请求到 Lambda 并提供 HTTP 端点，Streamable HTTP 传输是 MCP 协议支持的网络传输方式，适合跨进程通信。Cognito 强制执行 OAuth 2.1 认证确保仅授权用户可访问 MCP 服务器。该方案将 MCP 服务器暴露为受保护的 HTTP 端点，AI 代理通过标准 HTTP 协议安全调用。\n\n**❌ 为什么其他选项错**：\n- A.Lambda+异步调用：异步调用不提供请求响应模式，MCP 需要同步通信\n- B.Lambda+STDIO 传输：STDIO 为本地进程间传输，Lambda 函数间无法通过 STDIO 通信\n- D.Lambda 层+STDIO：Lambda 层为代码依赖非独立服务，STDIO 同样不适用于跨函数通信\n\n**📌 关键概念**：MCP 服务器通过 Lambda 和 API Gateway HTTP API 暴露为受保护端点，Streamable HTTP 传输实现跨进程通信，Cognito OAuth 2.1 确保仅授权用户可访问。","s":"第三方#114"},{"id":"D4-001","d":4,"t":"single","q":"你的 GenAI 应用月度成本因低效提示设计和模型使用增加了 300%。哪种优化能带来最大成本降低？","o":[{"l":"A","t":"带语义保留的提示压缩和响应缓存策略"},{"l":"B","t":"带任务特定模型选择和批处理的模型正确调整大小"},{"l":"C","t":"带成本分配和优化建议的使用分析"},{"l":"D","t":"带需求预测和容量优化的预留容量规划"}],"a":["A"],"e":"提示压缩降低每次请求的 token 成本，响应缓存消除冗余 API 调用，两者共同解决两大成本驱动因素。","s":"源#71"},{"id":"D4-002","d":4,"t":"single","q":"一个 RAG 系统尽管实现了响应缓存，仍有 60% 的缓存未命中率。哪种缓存策略能提高命中率？","o":[{"l":"A","t":"基于嵌入的键生成的语义相似性缓存"},{"l":"B","t":"带提示模板和基于参数的失效的多级缓存"},{"l":"C","t":"带用户行为分析和预计算策略的预测性缓存"},{"l":"D","t":"带一致性哈希和智能缓存预热的分布式缓存"}],"a":["A"],"e":"语义相似性缓存按含义而非精确文本匹配查询，显著提高语义等价但措辞不同的查询的命中率。","s":"源#72"},{"id":"D4-003","d":4,"t":"single","q":"你的模型推理成本主要来自大上下文窗口。哪种优化能在保持质量的同时降低成本？","o":[{"l":"A","t":"带关键信息提取和滑动窗口技术的上下文压缩"},{"l":"B","t":"带摘要生成和按需细节策略的层级上下文"},{"l":"C","t":"带可重用上下文段和智能缓存管理的上下文缓存"},{"l":"D","t":"带基于相关性内容选择和剪枝的动态上下文大小"}],"a":["A"],"e":"上下文压缩提取关键信息并减少 token 数量，直接减少最大的成本组成，且不牺牲响应质量。","s":"源#73"},{"id":"D4-004","d":4,"t":"single","q":"你的应用需要针对 10,000+ 并发用户和亚秒响应时间进行性能优化。哪种方法能有效扩展？","o":[{"l":"A","t":"带连接池、负载均衡和基于性能指标自动扩展"},{"l":"B","t":"带 CDN 集成和边缘计算的缓存层，降低延迟"},{"l":"C","t":"带队列管理和结果流式传输的异步处理"},{"l":"D","t":"带独立扩展和性能优化的微服务架构"}],"a":["B"],"e":"带 CDN 和边缘计算的缓存可从最近位置提供响应，避免往返源服务器，在大规模下实现亚秒延迟。","s":"源#74"},{"id":"D4-005","d":4,"t":"single","q":"一个批处理系统每月需要处理 100TB 文档，需优化成本。哪种方法能最小化处理成本？","o":[{"l":"A","t":"带检查点和容错处理工作流的 Spot 实例利用"},{"l":"B","t":"带预留容量和批量优化的非高峰调度"},{"l":"C","t":"带自动扩展和按使用付费定价模型的无服务器处理"},{"l":"D","t":"带本地预处理和基于云推理的混合处理"}],"a":["A"],"e":"Spot 实例为容错批处理工作负载提供高达 90% 的成本节省，检查点确保实例被回收时工作不丢失。","s":"源#75"},{"id":"D4-006","d":4,"t":"single","q":"一个产品团队希望用户跨多次会话对政策问题获得一致的答案。应首先控制哪个提示设置？","o":[{"l":"A","t":"温度（Temperature）"},{"l":"B","t":"子网大小"},{"l":"C","t":"DNS TTL"},{"l":"D","t":"构建超时"}],"a":["A"],"e":"温度控制输出随机性——将温度调低（接近0）可获得更确定、可重复的答案，适合政策类一致性要求高的场景。","s":"样题#4"},{"id":"D4-007","d":4,"t":"single","q":"某医疗机构借助 Bedrock 部署了一款临床文档摘要生成应用。该应用输出质量波动较大，间或出现脱离事实的幻觉现象，且月度费用超出预算 40%。开发人员须实施近实时监控方案以检测幻觉、识别异常 Token 消耗并提前预警成本偏差，同时将自定义开发和维护工作量降至最低。哪项方案可满足需求？","o":[{"l":"A","t":"配置 CloudWatch 告警监控 InputTokenCount 与 OutputTokenCount 指标。将模型调用日志存入 S3，用 Glue 和 Athena 识别潜在幻觉"},{"l":"B","t":"运行以 LLM 作为评判模型的 Bedrock 评估任务检测幻觉。配置 CloudWatch 跟踪 Token 用量。创建 Lambda 函数处理指标并发送通知"},{"l":"C","t":"配置 Bedrock 将模型调用日志存入 S3 并启用文本输出日志。配置 Bedrock 护栏执行上下文基础检查检测幻觉。创建 CloudWatch 异常检测告警监控 Token 使用指标"},{"l":"D","t":"用 CloudTrail 记录 Bedrock API 调用。在 QuickSight 中创建自定义仪表盘可视化 Token 使用模式。用 SageMaker Model Monitor 检测摘要质量漂移"}],"a":["C"],"e":"**✅ 为什么 C.Bedrock 调用日志+护栏上下文基础检查+CloudWatch 异常检测 对**：调用日志含文本输出存入 S3 提供持久审计数据。护栏的上下文基础检查验证摘要是否基于临床文档，是 RAG 场景中检测幻觉的推荐方式，无需自建评估管道。CloudWatch 异常检测为 Token 指标动态建模基线，自动适应使用趋势检测异常消耗，比静态阈值更有效。全部利用 Bedrock 和 CloudWatch 原生能力，自定义开发最少。\n\n**❌ 为什么其他选项错**：\n- A.Glue+Athena 批处理分析：非近实时且增加运维开销\n- B.LLM 评估任务+Lambda：需管理评估任务和自定义通知逻辑\n- D.CloudTrail+QuickSight+Model Monitor：CloudTrail 记录 API 调用非内容，QuickSight 为 BI 工具非实时监控\n\n**📌 关键概念**：Bedrock 调用日志记录提供审计数据，护栏上下文基础检查检测幻觉，CloudWatch 异常检测自动建模 Token 使用基线实现成本预警。","s":"第三方#4"},{"id":"D4-008","d":4,"t":"single","q":"某金融企业通过 Bedrock 为其 GenAI 应用使用多个 FM。为符合一项针对敏感金融数据的监管新规，企业须实现 Token 管理方案。方案须在应用接近各模型 Token 上限时主动告警，每分钟处理超过 5000 个请求，并将 Token 使用指标按业务部门拆分以分配成本。哪项方案可满足需求？","o":[{"l":"A","t":"在 Lambda 中开发模型特定分词器。调用 Bedrock 前估算 Token 用量。将指标发布到 CloudWatch，接近阈值时触发告警。详细数据存入 DynamoDB 用于成本报告"},{"l":"B","t":"实施带 Token 配额策略的 Bedrock 护栏。捕获被拒请求指标。用 EventBridge 规则触发通知。用 CloudWatch 仪表盘可视化各模型 Token 趋势"},{"l":"C","t":"为失败请求部署 SQS 死信队列。用 Lambda 分析 Token 相关失败。用 CloudWatch Logs Insights 生成使用模式报告"},{"l":"D","t":"用 API Gateway 为 Bedrock 调用创建代理。基于自定义使用计划配置限流。配置拒绝超过 Token 限制的请求"}],"a":["A"],"e":"**✅ 为什么 A.Lambda 分词器+CloudWatch 告警+DynamoDB 成本 对**：Bedrock 调用后暴露 Token 指标但无法主动强制限制。Lambda 中实现模型特定分词器可在调用前估算输入输出 Token，提前检测接近上限的请求。CloudWatch 支持实时监控告警，轻松处理每分钟 5000+ 请求。DynamoDB 存储详细使用数据实现按业务部门的成本归因，满足法规报告和内部成本分摊需求。\n\n**❌ 为什么其他选项错**：\n- B.护栏 Token 配额：护栏当前不提供 Token 配额执行或主动告警\n- C.SQS 死信队列：被动分析失败后的问题，非主动管理\n- D.API Gateway 限流：按请求限流非按 Token 限制，无法提供按模型成本归属\n\n**📌 关键概念**：Lambda 分词器在调用前估算 Token 实现主动管理，CloudWatch 告警实时监控，DynamoDB 存储按部门成本归因数据。","s":"第三方#5"},{"id":"D4-009","d":4,"t":"multiple","q":"某出版企业正在开发一款聊天助手，使用运行在 SageMaker AI 上的容器化 LLM。架构含 API Gateway REST API 将用户请求路由到 Lambda，再由 Lambda 调用托管 LLM 的 SageMaker 实时端点。用户反馈响应时间不均匀。分析显示大量对话在等待首个 Token 超过 2 秒后被放弃。企业希望确保交互式聊天请求的 p95 延迟低于 800 毫秒。哪组方案组合可满足需求？（选择两项）","o":[{"l":"A","t":"在容器启动时启用模型预加载。实现动态批处理将多个请求合并到一次推理中处理"},{"l":"B","t":"为端点选择更大 GPU 实例。将最小实例数设为 0。按请求处理。首个请求时延迟加载模型权重"},{"l":"C","t":"切换到多模型端点。使用延迟加载，不进行请求批处理"},{"l":"D","t":"将最小实例数设为大于 0。启用响应流式传输"},{"l":"E","t":"将全部请求转用 SageMaker 异步推理，请求先存入 S3，并把最小实例数设为 0"}],"a":["A","D"],"e":"**✅ 为什么 A、D 对**：\n- D.最小实例数大于 0+响应流式传输：消除冷启动延迟，端点始终保持预热容量，流式传输尽快返回首个 Token 直接解决用户放弃问题\n- A.容器启动预加载+动态批处理：预加载确保模型在流量到达前就绪，批处理合并请求提高 GPU 利用率并降低每请求开销\n\n**❌ 为什么其他选项错**：\n- B.最小实例数 0+延迟加载：保证冷启动延迟，使首个 Token 性能不可预测\n- C.多模型端点+延迟加载：延迟加载增加冷启动，无批处理收益\n- E.异步推理+S3 存储+最小实例 0：异步推理引入排队和存储延迟，与交互式聊天 800 毫秒 p95 要求冲突\n\n**📌 关键概念**：最小实例数大于 0 消除冷启动，响应流式传输加速首个 Token 返回，容器预加载和动态批处理进一步提升吞吐和降低 p95 延迟。","s":"第三方#7"},{"id":"D4-010","d":4,"t":"single","q":"某精品咖啡品牌运营移动应用，借助 Bedrock 以三段式提示链路为客户定制咖啡烘焙档案。链路先将用户输入转为结构化元数据，继而检索关联烘焙记录并输出个性化推荐。跨区域用户反馈同输入产出不统一、检索环节推理迟缓，且偶现不安全建议（如异常高温冲泡）。企业须将输出一致性提至 99.5%、推理延迟压降至 1 秒内，并以经验证的安全控制拦截不安全或幻觉推荐。哪项方案可满足需求？","o":[{"l":"A","t":"部署带预置吞吐量的 Bedrock 稳定推理延迟。应用带语义拒绝规则的护栏拦截不安全输出。用 Prompt Management 通过审批工作流管控提示版本"},{"l":"B","t":"用 Bedrock Agents 管理链式调用。将模型输入输出记入 CloudWatch Logs。用日志对提示版本做 A/B 测试"},{"l":"C","t":"将提示结果缓存到 ElastiCache。用 Lambda 预处理元数据并跟踪延迟。用 X-Ray 识别瓶颈"},{"l":"D","t":"用 Kendra 改善烘焙记录检索精度。将标准化元数据存入 DynamoDB。用 Step Functions 编排多步提示"}],"a":["A"],"e":"**✅ 为什么 A.预置吞吐量+护栏语义拒绝+Prompt Management 审批 对**：预置吞吐量为模型预留推理容量，提供可预测的性能和稳定延迟，跨区域消除按需容量波动。护栏语义拒绝规则在模型边界拦截不安全指导（如危险温度），提供经验证的安全控制。Prompt Management 版本控制和审批工作流确保跨区域一致使用经批准的提示模板，通过控制提示版本实现 99.5% 一致性。\n\n**❌ 为什么其他选项错**：\n- B.Agents+CloudWatch A/B 测试：改善可观测性但不强制安全控制或稳定延迟\n- C.ElastiCache 缓存+X-Ray：缓存仅对重复输入有效，不解决安全性和一致性问题\n- D.Kendra+DynamoDB+Step Functions：改善检索和编排但不解决核心的延迟稳定性和安全控制需求\n\n**📌 关键概念**：预置吞吐量稳定推理延迟，护栏语义拒绝规则拦截不安全输出，Prompt Management 审批工作流管控提示版本确保跨区域一致性。","s":"第三方#16"},{"id":"D4-011","d":4,"t":"single","q":"某企业构建基于 Bedrock API 的 GenAI 应用处理复杂客户咨询。高峰期遭遇间歇性 API 超时，导致响应块损坏和数据交付延迟。处理不同长度咨询时难以确保提示在 Token 限制内，用户反馈输入被截断和响应不完整。FM 调用也出现失败。企业须实现重试策略以自动处理瞬态错误并防止高峰期压垮 Bedrock，须适应服务可用性变化，并支持响应流式传输和 Token 感知请求处理。哪项方案可满足需求？","o":[{"l":"A","t":"实现固定 1 秒间隔重试，最多 3 次。通过重启流处理超时。限制每会话 Token 用量"},{"l":"B","t":"实现带抖动指数退避和断路器的自适应重试，错误率超阈值时暂停重试。实现流式响应处理器监控块交付超时，缓冲已接收块并在连接恢复时从断点续传"},{"l":"C","t":"用 SDK 标准模式重试。try-catch 处理超时。为失败流请求返回缓存结果。全局 Token 限制。从失败点请求缺失块恢复中断流"},{"l":"D","t":"将客户端超时设为 30 秒。实现客户端负载丢弃。性能下降时停止新请求。静态 Token 上限。指数退避重试和动态块大小调整"}],"a":["B"],"e":"**✅ 为什么 B.抖动指数退避+断路器+流式续传 对**：抖动指数退避是 AWS 推荐的瞬态故障处理模式，分散重试避免同步重试风暴。断路器在错误率超阈值时暂停重试，防止级联故障压垮 Bedrock。流式响应处理器缓冲已接收块并在连接恢复后从断点续传，避免重启整个流，减少冗余生成和对模型的额外负载。该方案将自适应重试与流感知处理整合。\n\n**❌ 为什么其他选项错**：\n- A.固定延迟重试：存在重试风暴风险，重启流造成冗余生成\n- C.SDK 标准+缓存结果+全局限制：元素冲突，缓存返回非实时响应\n- D.30 秒超时+负载丢弃：引入不必要复杂性，静态限制不适应变化\n\n**📌 关键概念**：抖动指数退避分散重试避免风暴，断路器防止级联故障，流式响应处理器缓冲续传最小化冗余生成。","s":"第三方#18"},{"id":"D4-012","d":4,"t":"single","q":"某企业为支付处理 API 设计金丝雀发布方案。系统须依据实时推理指标、过往流量规律及服务健康度，在多个 Bedrock 模型版本间自动渐进地调配流量。指标达标时递增流量，性能不达标时缩减。企业还须在发布阶段全方位监控推理延迟与错误率，且可在零人工干预下中止发布并回退到前序版本。哪项方案可满足需求？","o":[{"l":"A","t":"用 Bedrock 预置吞吐量托管模型版本。配置 EventBridge 规则在新版本发布时调用 Step Functions 工作流。工作流分阶段转移流量，等待观察窗口后调用 Lambda 检查 CloudWatch 指标。指标达标增加流量，低于阈值触发回滚"},{"l":"B","t":"用 Lambda 调用各 Bedrock 模型版本。用 API Gateway 阶段变量和加权路由逐步转移流量。用 CloudWatch 监控。用外部逻辑调整流量和回滚"},{"l":"C","t":"用 SageMaker 端点变体表示 Bedrock 模型版本。用变体权重转移流量。用 CloudWatch 和 Model Monitor 触发回滚"},{"l":"D","t":"用 OpenSearch 跟踪推理日志。配置 OpenSearch 调用 Systems Manager Automation 运行手册更新模型端点转移流量"}],"a":["A"],"e":"**✅ 为什么 A.预置吞吐量+EventBridge+Step Functions+Lambda+CloudWatch 对**：Step Functions 编排含确定性阶段、观察窗口和条件分支的自动化发布流程。分阶段调配流量并设观察窗口，在推进前评估实时延迟与错误率。Lambda 评估 CloudWatch 指标实现动态逻辑：达标递增流量，异常触发回退。Step Functions 可暂停推进或立即触发回退，满足无人工干预自动回退。EventBridge 在新版本发布时自动触发发布流程。\n\n**❌ 为什么其他选项错**：\n- B.外部逻辑：引入操作风险，无法保证自动回退\n- C.SageMaker 端点变体：非 Bedrock 模型版本的预期集成模式\n- D.OpenSearch+Automation 运行手册：间接且复杂，非直接的基于指标的流量控制\n\n**📌 关键概念**：Step Functions 编排分阶段金丝雀发布，Lambda 评估 CloudWatch 指标实现动态流量决策，EventBridge 自动触发发布流程，无需人工干预即可回退。","s":"第三方#21"},{"id":"D4-013","d":4,"t":"single","q":"某企业运行 RAG 应用，使用 Bedrock Knowledge Bases 执行法规合规查询，通过 RetrieveAndGenerateStream API 从含 5 万余份法规文件的知识库中检索文档。应用输出质量不佳，因初始检索常返回语义相近但上下文不相关的文档，导致模型幻觉和错误法规指导。企业须改进 RAG 性能以返回更相关文档，运营开销最小。哪项方案可满足需求？","o":[{"l":"A","t":"部署 SageMaker 端点运行微调排序模型。用 API Gateway 路由请求。通过 REST API 对结果重新排序"},{"l":"B","t":"用 Comprehend 对文档分类并评分。将重排序过程与 Textract 集成做文档分析。用 Neptune 执行图相关性计算"},{"l":"C","t":"实现用 Retrieve API 做初始检索的管道。调用 Bedrock Rerank API 重排序。调用 InvokeModelWithResponseStream 生成响应"},{"l":"D","t":"通过 Bedrock Knowledge Bases 中的重新排序配置使用最新的 Amazon 重排序模型。基于上下文评估改进文档相关性评分和重排序"}],"a":["D"],"e":"**✅ 为什么 D.Knowledge Bases 内置重排序配置 对**：Knowledge Bases 原生支持 Amazon 管理的重排序模型，专为在初始向量检索后改进上下文相关性设计。启用重排序配置后，基于更深入的上下文理解自动重排序检索文档，无需额外基础设施或自定义编排。与现有 RetrieveAndGenerateStream 工作流无缝集成，运营开销最低。\n\n**❌ 为什么其他选项错**：\n- A.SageMaker 端点+API Gateway：需自定义端点管理和路由，增加运维复杂性\n- B.Comprehend+Textract+Neptune：组合多个非 RAG 专用服务，复杂性高\n- C.Retrieve API+Rerank API：需显式调用并修改应用管道，增加集成工作\n\n**📌 关键概念**：Bedrock Knowledge Bases 内置重排序配置利用 Amazon 管理的模型在向量检索后改进上下文相关性，无需额外基础设施或自定义编排。","s":"第三方#25"},{"id":"D4-014","d":4,"t":"single","q":"某企业使用 Bedrock 和 Anthropic Claude 3 Haiku 开发 AI 助手。助手平时每小时处理 10000 个请求，高峰期激增至每小时 30000 个。须在 2 秒内响应且跨多个 AWS 区域运行。高峰期遭遇吞吐瓶颈导致延迟增加和偶发超时。企业须解决性能问题。哪项方案可满足需求？","o":[{"l":"A","t":"在单区域购买预置吞吐量和足够模型单元。用指数退避重试失败请求"},{"l":"B","t":"实施令牌批处理减少 API 开销。使用跨区域推理配置文件自动在可用区域间分配流量"},{"l":"C","t":"在各区域设置自动扩缩 Lambda。实施客户端轮询分发。购买一个模型单元预置吞吐量作为备份"},{"l":"D","t":"通过跨区域 S3 存储桶实施批处理推理。用 SQS 设置异步检索流程"}],"a":["B"],"e":"**✅ 为什么 B.令牌批处理+跨区域推理配置文件 对**：跨区域推理配置文件将推理请求透明路由到多个区域，高峰期自动分配到有容量的区域，减少节流和超时风险。令牌批处理将多个推理请求合并为单次模型调用，减少每请求开销提高吞吐量。Claude 3 Haiku 为轻量低延迟模型，批处理和跨区域分配尤其有效。方案使用 Bedrock 原生性能优化功能，无需自定义架构。\n\n**❌ 为什么其他选项错**：\n- A.单区域预置吞吐量：创建区域瓶颈，重试增加负载和延迟\n- C.Lambda 自动扩缩+客户端轮询：解决应用层扩缩但不解决模型侧吞吐限制\n- D.批处理推理+SQS 异步：为离线工作负载设计，无法满足 2 秒交互响应\n\n**📌 关键概念**：跨区域推理配置文件自动在多区域分配推理请求消除吞吐瓶颈，令牌批处理减少 API 开销提升吞吐量。","s":"第三方#31"},{"id":"D4-015","d":4,"t":"single","q":"某企业开发 GenAI 应用，实时分析客服通话并为人工坐席生成建议回复。高峰期须处理 50 万并发通话，每条建议端到端延迟低于 200 毫秒。企业使用现有架构转录通话音频。应用不得超出月度计算预算并须保持自动扩展。哪项方案可满足需求？","o":[{"l":"A","t":"在 Bedrock 上部署大型复杂推理模型。购买预置吞吐量并针对批量处理优化"},{"l":"B","t":"在 Bedrock 上部署低延迟实时优化模型。购买预置吞吐量并设自动扩展策略"},{"l":"C","t":"在 SageMaker 实时端点上部署大型 LLM，使用专用 GPU 实例"},{"l":"D","t":"在 SageMaker 无服务器端点上部署中型 LLM，针对批量处理优化"}],"a":["B"],"e":"**✅ 为什么 B.低延迟模型+预置吞吐量+自动扩展 对**：Bedrock 低延迟实时优化模型以最小每请求开销处理高请求速率。预置吞吐量预留模型容量处理峰值负载，消除冷启动减少排队。自动扩展策略根据需求动态调整容量，非高峰期成本高效同时保持高峰性能。方案在性能、可扩展性、成本控制和运营简洁性间取得最佳平衡。\n\n**❌ 为什么其他选项错**：\n- A.大型复杂模型+批量处理：引入更高延迟，不适合实时建议场景\n- C.SageMaker 专用 GPU：运营和成本开销显著更高，手动扩展职责\n- D.无服务器端点+批量优化：批量工作负载无法满足 200 毫秒延迟要求\n\n**📌 关键概念**：Bedrock 低延迟模型处理高并发实时推理，预置吞吐量消除冷启动和排队，自动扩展策略控制成本同时保障峰值性能。","s":"第三方#42"},{"id":"D4-016","d":4,"t":"single","q":"某企业构建无服务器应用，帮助全球学生汇总学习笔记。应用通过 Bedrock 使用 Anthropic Claude。企业观察到大部分流量集中在各时区晚间，用户反馈高峰时段遭遇节流错误。企业须确保应用持续运行且不降低性能质量，且低流量时段不产生固定小时费用。哪项方案可满足需求？","o":[{"l":"A","t":"创建自定义 CloudWatch 指标监控错误。将预置吞吐量设为高于峰值流量的值"},{"l":"B","t":"创建自定义 CloudWatch 指标监控错误。设故障转移机制在错误超阈值时重定向到备份区域"},{"l":"C","t":"启用 Bedrock 调用日志记录。监控 Invocations、InputTokenCount、OutputTokenCount 和 InvocationThrottles 指标。将流量分布到跨区域推理端点"},{"l":"D","t":"启用 Bedrock 调用日志记录。监控 InvocationLatency、InvocationClientErrors 和 InvocationServerErrors。将流量分布到同模型多版本"}],"a":["C"],"e":"**✅ 为什么 C.调用日志+关键指标监控+跨区域推理端点 对**：跨区域推理将请求分布到多区域，减少争用防止节流，无需预留容量，按需定价避免低流量时段固定成本。调用日志和原生指标（InvocationThrottles、TokenCount）提供使用模式可视性，验证流量分布和性能一致性。方案以按需定价满足持续运行需求且无固定小时费用。\n\n**❌ 为什么其他选项错**：\n- A.预置吞吐量：引入固定小时成本，违反低流量时段避免不必要支出要求\n- B.故障转移机制：被动行为而非主动负载分配，增加复杂性\n- D.同区域多版本：不增加可用容量，未解决节流根本原因\n\n**📌 关键概念**：跨区域推理端点自动分布请求到多区域消除节流，按需定价避免固定成本，调用日志和原生指标提供使用可视性。","s":"第三方#48"},{"id":"D4-017","d":4,"t":"single","q":"某金融企业通过 Bedrock 处理财务文档的 AI 应用在工作时间每小时处理约 1 万请求，需一致吞吐量。企业用 CreateProvisionedModelThroughput API 购买了预置吞吐量。CloudWatch 显示预置容量未被使用而按需请求被节流。应用代码中使用 modelId 指定基础模型标识符。企业须让应用使用预置吞吐量并解决节流。哪项方案可满足需求？","o":[{"l":"A","t":"增加预置吞吐量配置中的模型单元数量"},{"l":"B","t":"将模型 ID 参数替换为 CreateProvisionedModelThroughput API 返回的预置模型 ARN"},{"l":"C","t":"添加指数退避重试逻辑处理高峰时段节流异常"},{"l":"D","t":"修改应用使用 InvokeModelWithResponseStream API 替代 InvokeModel API"}],"a":["B"],"e":"**✅ 为什么 B.替换为预置模型 ARN 对**：Bedrock 预置吞吐量仅在应用显式调用预置模型 ARN 时生效，而非基础模型 ID。代码使用基础模型标识符将请求路由到按需容量池而非已购买的预置资源。CreateProvisionedModelThroughput API 返回的 ARN 代表预留容量，替换 modelId 参数后流量正确路由到预置资源，解决节流并使预置容量生效。\n\n**❌ 为什么其他选项错**：\n- A.增加模型单元：不解决根本原因，应用根本未使用预置资源\n- C.退避重试：增加延迟且仍浪费预置容量，不保证一致吞吐\n- D.切换流式 API：改变响应投递机制但不影响容量路由\n\n**📌 关键概念**：Bedrock 预置吞吐量附加到 CreateProvisionedModelThroughput 返回的预置 ARN，须在 modelId 参数中引用该 ARN 而非基础模型 ID 才能使用预留容量。","s":"第三方#50"},{"id":"D4-018","d":4,"t":"single","q":"某企业为 500 名开发者购买了 Amazon Q Developer Pro 订阅以提升代码质量和生产力。企业须建立可观测性系统跟踪全公司采用指标，识别活跃订阅用户与未充分利用的订阅，每季度识别高级用户并确定需额外培训的团队，同时提供对使用模式的可视性（如每用户已接受的 Q 生成代码行数）。哪项方案可满足需求？","o":[{"l":"A","t":"为 Q Developer 创建使用量仪表板。用使用量仪表板跟踪汇总采用指标"},{"l":"B","t":"使用 Q Developer 内置管理员仪表板，跟踪 Organizations 中全公司用户采用指标"},{"l":"C","t":"在 Q Developer 中收集用户级指标。存入 S3。用 QuickSight 可视化。创建仪表板"},{"l":"D","t":"配置 CloudTrail 跟踪 Organizations 中所有 Q Developer API 调用。用 Lambda 处理日志。存入 DynamoDB。在 Managed Grafana 创建仪表板"}],"a":["B"],"e":"**✅ 为什么 B.Q Developer 内置管理员仪表板 对**：内置管理员仪表板专为 Q Developer Pro 管理员组织可观测性设计，提供 Organizations 中用户级指标原生可视性。可识别活跃与未充分利用的订阅，识别高级用户，跟踪高级使用模式含代码接受指标（生成代码和被接受代码行数），这是衡量 ROI 和确定培训需求的关键。无需构建自定义数据管道或日志处理架构，运营开销最小。\n\n**❌ 为什么其他选项错**：\n- A.使用量仪表板：仅汇总指标，缺乏用户级可视性和高级模式跟踪\n- C.S3+QuickSight：需构建自定义数据管道，增加运维开销\n- D.CloudTrail+Lambda+DynamoDB+Grafana：复杂的日志处理架构，运维负担高\n\n**📌 关键概念**：Q Developer Pro 内置管理员仪表板提供 Organizations 中用户级采用指标和代码接受模式跟踪，无需自定义数据管道。","s":"第三方#56"},{"id":"D4-019","d":4,"t":"single","q":"某金融企业须构建基于 Bedrock 的文档分析系统处理季度报告。系统须分析财务数据、执行情感分析并跨批验证合规性。每批 5 份报告，每份需多次 FM 调用。须在每批 10 秒内完成分析。当前顺序处理每批需 45 秒。哪项方案可满足需求？","o":[{"l":"A","t":"用带预置并发的 Lambda 顺序处理各分析类型。超时设为 10 秒。配置自动重试带指数退避"},{"l":"B","t":"用 Step Functions Parallel 状态同时调用各分析类型的独立 Lambda。配置 Bedrock 客户端超时。用 CloudWatch 跟踪执行时间和推理延迟"},{"l":"C","t":"创建 SQS 队列缓冲请求。部署多个带预留并发的 Lambda。每个 Lambda 顺序处理报告不同方面后合并"},{"l":"D","t":"部署 ECS 集群运行容器，每个容器顺序处理报告。用负载均衡器分发。基于 CPU 自动扩展"}],"a":["B"],"e":"**✅ 为什么 B.Step Functions Parallel+独立 Lambda+客户端超时+CloudWatch 对**：各分析类型（财务提取、情感分析、合规验证）不相互依赖，Parallel 状态同时调用独立 Lambda 将每批时间从 45 秒大幅压缩至 10 秒内。Step Functions 提供内置错误处理、重试和状态跟踪。客户端超时确保缓慢调用不阻塞整批。CloudWatch 监控执行时间和推理延迟支持调优。\n\n**❌ 为什么其他选项错**：\n- A.顺序处理+预置并发：仍顺序执行无法满足延迟要求\n- C.SQS+多 Lambda+顺序处理：引入队列延迟和报告内顺序处理\n- D.ECS+容器顺序处理：增加容器运维开销，非事件驱动\n\n**📌 关键概念**：Step Functions Parallel 状态并行化独立 FM 推理任务，将顺序 45 秒压缩至 10 秒内，内置错误处理和可观测性。","s":"第三方#59"},{"id":"D4-020","d":4,"t":"single","q":"某金融企业 AI 应用通过 Bedrock 处理财务文档，工作时间每小时约 1 万请求需稳定吞吐。企业已通过 CreateProvisionedModelThroughput API 购买预置吞吐量，但 CloudWatch 显示预置容量闲置而按需请求遭节流。检查代码发现 invoke_model 调用中 modelId 参数使用基础模型标识符。企业须使应用正确使用预置资源并消除节流。哪项方案可满足需求？","o":[{"l":"A","t":"增加预置吞吐量配置中的模型单元数量"},{"l":"B","t":"将 modelId 参数替换为 CreateProvisionedModelThroughput API 返回的预置模型 ARN"},{"l":"C","t":"添加指数退避重试逻辑应对高峰时段节流"},{"l":"D","t":"改用 InvokeModelWithResponseStream API 替代 InvokeModel API"}],"a":["B"],"e":"**✅ 为什么 B.替换为预置模型 ARN 对**：代码使用基础模型标识符将流量路由到按需容量池。预置吞吐量附加到通过 API 创建的特定预置资源 ARN，须在 modelId 参数中引用该 ARN 才能使用预留容量。替换后流量正确导向预置资源，模型单元提供工作时间所需一致吞吐量，预置容量不再闲置，按需路径节流消除。\n\n**❌ 为什么其他选项错**：\n- A.增加模型单元：不解决根本问题，应用未使用预置资源\n- C.退避重试：增加延迟且仍浪费预置容量，不保证一致吞吐\n- D.切换流式 API：改变投递机制但不影响容量路由和配额\n\n**📌 关键概念**：预置吞吐量 ARN 代表预留容量，须在 modelId 中引用该 ARN 而非基础模型 ID，否则请求路由到按需路径而非预置资源。","s":"第三方#70"},{"id":"D4-021","d":4,"t":"single","q":"某金融企业开发 GenAI 应用同时服务高级和标准客户，使用 API Gateway REST API 后的 Lambda 处理请求。须根据客户层级动态切换 AI 模型，且在不重新部署代码的情况下对新功能做 A/B 测试。还须在应用变更前验证模型参数（如 temperature 和最大 Token 限制）。哪项方案以最少运维开销满足需求？","o":[{"l":"A","t":"为每个配置创建 Systems Manager Parameter Store 参数。用 Lambda 轮询参数更新。用 EventBridge 触发重新部署"},{"l":"B","t":"将模型配置存入 DynamoDB。按客户层级检索配置。Lambda 每次请求开始时查询"},{"l":"C","t":"用 AppConfig 管理模型配置。用功能标志做 A/B 测试。为模型参数定义 JSON 模式验证。Lambda 通过 AppConfig Agent 检索配置"},{"l":"D","t":"创建 ElastiCache 集群存储配置。设较短 TTL。在 Lambda 中运行自定义验证逻辑。用 CloudWatch 监控"}],"a":["C"],"e":"**✅ 为什么 C.AppConfig+功能标志+JSON 验证+AppConfig Agent 对**：AppConfig 专为动态应用配置管理设计，集中管理模型选择、推理参数和客户层级路由，无需重新部署 Lambda。功能标志支持 A/B 测试逐步推送变更。JSON 模式验证在应用前校验 temperature、Token 限制等参数防止无效配置。AppConfig Agent 提供内置缓存和轮询机制高效检索配置，延迟最小。\n\n**❌ 为什么其他选项错**：\n- A.Parameter Store+轮询+EventBridge：引入不必要的重新部署逻辑和轮询复杂性\n- B.DynamoDB：需自定义配置访问模式，不原生支持功能标志或模式验证\n- D.ElastiCache：需管理集群和自定义验证逻辑，运维开销高\n\n**📌 关键概念**：AppConfig 管理动态模型配置，功能标志支持 A/B 测试，JSON 模式验证确保参数安全，Agent 内置缓存低延迟检索。","s":"第三方#93"},{"id":"D4-022","d":4,"t":"single","q":"某零售企业使用 Bedrock 开发客服 AI 助手。分析显示 70% 咨询为简单产品问题可由较小模型高效处理，30% 为复杂退换货政策问题需高级推理能力。企业须实施经济高效的模型选择框架，按咨询复杂度自动路由到合适模型，保持较高客户满意度并最小化响应延迟。哪项方案以最少实施工作量满足需求？","o":[{"l":"A","t":"创建多阶段架构用小型 FM 对咨询分类。简单咨询路由到小模型，复杂咨询路由到大模型。用 Lambda 处理路由逻辑"},{"l":"B","t":"使用 Bedrock 智能提示路由自动分析咨询。简单产品咨询路由到小模型，复杂退换货咨询路由到大型模型"},{"l":"C","t":"实现单模型方案用 Bedrock 中型 FM 配合按需定价。在提示中包含特殊指令处理简单和复杂咨询"},{"l":"D","t":"为简单和复杂咨询创建独立 Bedrock 端点。实现基于关键词检测的规则路由。小模型用按需定价，大模型用预置吞吐量"}],"a":["B"],"e":"**✅ 为什么 B.Bedrock 智能提示路由 对**：智能提示路由自动分析传入提示并按复杂度选择最合适的 FM，无需自定义分类逻辑或编排代码。70% 简单咨询路由到小成本模型降低推理成本和延迟，30% 复杂咨询路由到大型模型保持响应质量。路由由 Bedrock 内联处理，相比多阶段架构减少额外分类调用，响应延迟更低。实施工作量最少。\n\n**❌ 为什么其他选项错**：\n- A.多阶段+Lambda 路由：引入额外推理步骤和自定义逻辑，实施工作量大\n- C.单中型模型+按需：为所有咨询过度使用中型模型增加成本\n- D.独立端点+关键词规则：规则脆弱且端点管理增加运维开销\n\n**📌 关键概念**：Bedrock 智能提示路由自动按提示复杂度选择模型，无需自定义分类逻辑，实现成本效率和响应质量平衡。","s":"第三方#94"},{"id":"D4-023","d":4,"t":"single","q":"某医疗机构开发处理医疗咨询的应用。须以高准确性回答复杂查询、降低语义稀释、引用医疗文档中的领域术语以减少歧义，且每分钟响应 1000 个查询、延迟低于 2 秒。哪项方案以最少运维开销满足需求？","o":[{"l":"A","t":"用 API Gateway 将查询路由到 Bedrock 代理。配置代理用 Claude 分解查询、用 Titan 扩展查询。创建知识库存放医疗文档"},{"l":"B","t":"配置 Bedrock 知识库存放医疗文档。在知识库中启用查询分解。配置使用 FM 和知识库的 Bedrock Flows 支持应用"},{"l":"C","t":"用 SageMaker AI 托管自定义 ML 模型做查询分解和扩展。配置知识库存放文档。对文档加密"},{"l":"D","t":"创建 Bedrock 代理编排多个 Lambda 分解查询。创建知识库存放文档。用代理内置知识库功能。添加深度研究推理能力"}],"a":["B"],"e":"**✅ 为什么 B.知识库+查询分解+Bedrock Flows 对**：知识库通过摄取医疗文档、分块、生成嵌入并运行时检索相关段落，直接满足领域术语引用和减少歧义需求。查询分解将复杂医疗查询拆分为更有针对性的子查询，提高检索精度和召回率。Bedrock Flows 托管编排多步骤工作流（预处理、检索、调用 FM、格式化），无需维护自定义状态机或多个 Lambda。全部在 Bedrock 托管功能内，运维开销最小。\n\n**❌ 为什么其他选项错**：\n- A.代理+API Gateway+多模型：增加配置和运行时复杂性\n- C.SageMaker AI 自定义模型：增加托管扩展和运维负担\n- D.代理+多 Lambda：多个自定义组件增加编排复杂性\n\n**📌 关键概念**：Bedrock 知识库提供领域文档检索，查询分解降低语义稀释，Flows 托管编排多步骤工作流无需自定义状态机。","s":"第三方#97"},{"id":"D4-024","d":4,"t":"single","q":"某企业推荐系统运行在 EC2 实例上，调用 Bedrock FM 的 API 分析客户行为并生成个性化商品推荐。系统出现间歇性问题——部分推荐与客户偏好不符。企业须建立可观测性方案监控运维指标并检测相对已建立基线的性能退化模式，当 FM 行为偏离预期时在 10 分钟内生成含相关性数据的告警。哪项方案可满足需求？","o":[{"l":"A","t":"配置 CloudWatch Container Insights。设延迟阈值告警。用嵌入式指标格式添加 Token 自定义指标。创建仪表板"},{"l":"B","t":"实施 X-Ray 跟踪请求组件。启用 CloudWatch Logs Insights 检测错误模式。设 CloudTrail 监控 Bedrock API 调用。在 QuickSight 创建仪表板"},{"l":"C","t":"启用 CloudWatch Application Insights。用嵌入式指标格式创建推荐质量、Token 使用和响应延迟自定义指标含请求类型和用户分段维度。配置 CloudWatch 异常检测。用 Logs Insights 做模式分析"},{"l":"D","t":"用带可观测性插件的 OpenSearch Service。通过 Kinesis 摄取指标和日志。创建自定义 PPL 查询分析行为模式。建立运维仪表板"}],"a":["C"],"e":"**✅ 为什么 C.Application Insights+嵌入式指标+异常检测+Logs Insights 对**：Application Insights 自动分析 EC2 工作负载的指标日志事件识别异常模式。嵌入式指标格式发布推荐质量、Token 使用和响应延迟自定义指标，添加请求类型和用户分段维度实现精细关联。CloudWatch 异常检测为时间序列自动建模正常行为基线并标记偏差，几分钟内触发告警满足 10 分钟要求。Logs Insights 补充指标分析日志模式识别推荐质量下降根因。\n\n**❌ 为什么其他选项错**：\n- A.Container Insights：侧重基础设施指标，缺乏行为基线化\n- B.X-Ray+CloudTrail+QuickSight：提供跟踪但不提供自动异常检测\n- D.OpenSearch+Kinesis：增加摄取复杂性和运维开销\n\n**📌 关键概念**：Application Insights 自动监控 EC2 应用健康，嵌入式指标格式发布 FM 行为自定义指标，CloudWatch 异常检测自动建模基线并在 10 分钟内触发告警。","s":"第三方#99"},{"id":"D4-025","d":4,"t":"single","q":"某企业开发三个专用 NLP 模型支撑客服应用：一个对客户具体问题分类，一个从互动中提取关键信息，一个生成响应。须确保所有任务达 95% 以上准确率，处理最多 500 个并发请求并在每日 2 小时高峰期内 500 毫秒内响应，同时在非高峰低需求期间优化资源使用。哪项方案可满足需求？","o":[{"l":"A","t":"将三个模型部署到单个 SageMaker 多模型端点。启用动态扩展。用计算优化型实例。基于调用指标自动扩展"},{"l":"B","t":"将每个模型部署到独立 SageMaker Serverless Inference 端点。设预置并发处理峰值。按各模型需求配置最大并发和内存"},{"l":"C","t":"用带预置吞吐量的 Bedrock 部署模型。按预期 Token 吞吐量配置模型单元。为每个模型实施请求批处理"},{"l":"D","t":"将每个模型部署到独立 SageMaker 端点。用异步推理配置。将请求响应存入 S3。用 SNS 发送告警"}],"a":["B"],"e":"**✅ 为什么 B.SageMaker Serverless Inference+预置并发 对**：Serverless Inference 专为间歇性或突发流量设计，按请求数自动扩缩，无流量时缩减到零满足低需求期间优化资源。预置并发保持指定数量执行环境预热就绪，避免冷启动延迟满足高峰期 500 毫秒响应要求。按各模型需求独立配置最大并发和内存，避免多模型端点的嘈杂邻居问题。在 Serverless 成本效益和预置实例性能可预测性间取得平衡。\n\n**❌ 为什么其他选项错**：\n- A.多模型端点：可能引入嘈杂邻居问题和延迟峰值\n- C.Bedrock 预置吞吐量+批处理：批处理增加延迟不满足 500 毫秒要求\n- D.异步推理：为长时间运行工作负载设计，无法满足 500 毫秒要求\n\n**📌 关键概念**：SageMaker Serverless Inference 按需扩缩到零优化低需求期资源，预置并发消除冷启动满足高峰 500 毫秒延迟要求。","s":"第三方#101"},{"id":"D4-026","d":4,"t":"single","q":"某企业开发基于 Bedrock FM 的 GenAI 应用，含多个自定义工具集成。尽管用户流量稳定，应用遭遇意外 Token 消耗激增。企业须用 Bedrock 模型调用日志记录监控 InputTokenCount 和 OutputTokenCount 指标，检测工具使用中的异常模式并识别哪些工具集成导致异常消耗。方案须随流量模式变化自动调整阈值。哪项方案可满足需求？","o":[{"l":"A","t":"用 CloudWatch Logs 捕获调用日志。为 Token 指标创建仪表板。为每个工具配置固定阈值静态告警"},{"l":"B","t":"将调用日志存入 S3。用 Glue 和 Athena 分析 Token 使用趋势"},{"l":"C","t":"用 CloudWatch Logs 捕获调用日志。创建指标过滤器提取工具特定调用模式。为每个工具的 Token 指标应用自动调整基线的异常检测告警"},{"l":"D","t":"将调用日志存入 S3。用 Lambda 实时处理日志。根据 Lambda 识别的趋势手动更新告警阈值"}],"a":["C"],"e":"**✅ 为什么 C.CloudWatch Logs+指标过滤器+异常检测告警 对**：调用日志直接发送到 CloudWatch Logs 含 InputTokenCount、OutputTokenCount 和工具调用元数据。指标过滤器从日志中提取工具特定的 Token 消耗模式，按工具隔离识别异常来源。CloudWatch 异常检测基于历史流量模式自动建模基线和动态阈值，随使用模式变化自适应调整，无需手动调阈值。全部使用托管服务，运维开销最小。\n\n**❌ 为什么其他选项错**：\n- A.固定阈值静态告警：无法适应变化的流量模式\n- B.Glue+Athena：批量分析引入延迟，非实时监控\n- D.Lambda+S3+手动阈值：需自定义代码和手动干预，维护负担高\n\n**📌 关键概念**：CloudWatch 指标过滤器从调用日志提取工具特定 Token 模式，异常检测自动建模基线并随流量变化动态调整阈值实现自适应告警。","s":"第三方#102"},{"id":"D4-027","d":4,"t":"single","q":"某企业使用 Bedrock 开发 AI 应用，FM 支持跨区域推理和预置吞吐量。须为欧洲和北美用户提供持续低延迟服务，且遵守数据驻留法规确保欧洲用户数据留在欧洲区域。测试中区域流量达服务配额时出现服务降级。企业须保持应用弹性并最小化运维复杂性。哪项方案可满足需求？","o":[{"l":"A","t":"在北美和欧洲部署独立 Bedrock 实例。用自定义路由层按用户位置引导流量。用 CloudWatch 告警和 SNS 通知"},{"l":"B","t":"用 Bedrock 跨区域推理配置文件，调用 InvokeModel 时在配置文件 ID 中指定地理代码。配置独立 API Gateway HTTP API 将欧洲和北美用户引导到相应区域端点"},{"l":"C","t":"部署多区域 API Gateway 和 Lambda 实现重试逻辑。在达配额时调用次区域 FM"},{"l":"D","t":"在多区域配置 Bedrock 预置吞吐量。在应用代码中实现故障转移逻辑。用 Global Accelerator 路由流量"}],"a":["B"],"e":"**✅ 为什么 B.跨区域推理配置文件+地理代码+独立 API Gateway 对**：跨区域推理配置文件在定义的区域边界内将请求分布到多个区域，在配置文件 ID 中指定地理代码确保欧洲数据仅在欧洲处理满足驻留法规。流量激增或达配额时 Bedrock 自动路由到同地理区域内健康区域提高可用性。独立 API Gateway 为欧洲和北美提供简单路由层引导到相应配置文件，避免自定义故障转移逻辑，运维复杂性最低。\n\n**❌ 为什么其他选项错**：\n- A.自定义路由层+手动监控：增加复杂性，不提供自动弹性\n- C.多区域 Lambda 重试：配置不当可能违反数据驻留要求\n- D.应用级故障转移+Global Accelerator：大量应用代码和运维负担\n\n**📌 关键概念**：跨区域推理配置文件在地理边界内自动分布请求保障驻留合规和弹性，独立 API Gateway 提供简单区域路由无需自定义逻辑。","s":"第三方#103"},{"id":"D4-028","d":4,"t":"multiple","q":"某企业在多个业务部门部署了基于 Bedrock 的 GenAI 应用，用于客服、内容生成和文档分析。部分应用出现不可预测的 Token 消耗模式。企业须建立全面可观测性方案，提供跨多模型 Token 使用模式的实时可见性，支持为多类利益相关者创建自定义仪表板，并为所有 FM 提供 Token 消耗告警能力。哪组方案组合以最少运维开销满足需求？（选择两项）","o":[{"l":"A","t":"用 CloudWatch 指标作为数据源，创建 QuickSight 仪表板显示跨 FM Token 使用趋势"},{"l":"B","t":"用 CloudWatch Logs Insights 分析调用日志中 Token 消耗模式。创建自定义查询识别高使用场景。向仪表板添加日志小部件"},{"l":"C","t":"创建自定义 CloudWatch 仪表板结合 Bedrock 原生 Token 和调用指标。设置 CloudWatch 告警监控 Token 阈值"},{"l":"D","t":"通过 Bedrock 零 ETL 集成与 Managed Grafana，创建显示 FM Token 使用趋势和模式的仪表板"},{"l":"E","t":"实施 EventBridge 规则捕获调用事件。通过 Data Firehose 路由到 OpenSearch Serverless。用 OpenSearch 仪表板分析"}],"a":["C","D"],"e":"**✅ 为什么 C、D 对**：\n- C.CloudWatch 仪表板+原生指标+告警：Bedrock 发布内置 CloudWatch 指标用于调用和 Token 使用，直接利用无需额外数据管道构建集中仪表板，CloudWatch 告警提供基于阈值的 Token 消耗告警\n- D.Managed Grafana 零 ETL 集成：零 ETL 集成使 Bedrock 和 CloudWatch 指标直接在 Grafana 可视化，无需构建摄取管道，Grafana 仪表板适合为不同受众（工程、财务、产品）定制视图\n\n**❌ 为什么其他选项错**：\n- A.QuickSight 仪表板：更适合历史分析而非实时运维监控\n- B.Logs Insights 查询：需查询维护，不高效提供大规模实时仪表板\n- E.EventBridge+Firehose+OpenSearch：多服务和自定义数据流显著增加运维开销\n\n**📌 关键概念**：CloudWatch 原生指标配合自定义仪表板和告警提供实时监控，Managed Grafana 零 ETL 集成实现针对不同利益相关者的定制化可视化。","s":"第三方#105"},{"id":"D4-029","d":4,"t":"single","q":"某企业推荐系统基于 EC2 实例运行，通过调用 Bedrock FM 的 API 分析客户行为并生成个性化商品推荐。系统间歇性出现部分推荐与客户偏好不匹配的问题。企业须建立可观测性方案监控运维指标并检测相对已建立基线的性能退化模式，当 FM 行为偏离预期时在 10 分钟内生成含相关性数据的告警。哪项方案可满足需求？","o":[{"l":"A","t":"配置 CloudWatch Container Insights。设延迟阈值告警。用嵌入式指标格式添加 Token 自定义指标"},{"l":"B","t":"实施 X-Ray 跟踪请求组件。启用 CloudWatch Logs Insights。设 CloudTrail 并在 QuickSight 创建仪表板"},{"l":"C","t":"启用 CloudWatch Application Insights。用嵌入式指标格式创建推荐质量、Token 使用和响应延迟自定义指标含请求类型和用户分段维度。配置异常检测。用 Logs Insights 做模式分析"},{"l":"D","t":"用带可观测性插件的 OpenSearch Service。通过 Kinesis 摄取指标和日志。用自定义查询分析行为模式"}],"a":["C"],"e":"**✅ 为什么 C.Application Insights+嵌入式指标+异常检测+Logs Insights 对**：Application Insights 为 EC2 应用提供自动可观测性识别异常行为模式。嵌入式指标格式发布推荐质量、Token 使用和响应延迟自定义指标，添加请求类型和用户分段维度实现精细关联。CloudWatch 异常检测从历史数据建立动态基线自动检测偏差，几分钟内触发告警满足 10 分钟要求。Logs Insights 快速分析日志模式识别推荐质量下降根因。指标日志告警关联直接且运维高效。\n\n**❌ 为什么其他选项错**：\n- A.Container Insights：侧重基础设施指标，缺乏行为基线化和自动异常检测\n- B.X-Ray+CloudTrail+QuickSight：提供跟踪但不提供自动异常检测\n- D.OpenSearch+Kinesis：增加摄取复杂性和运维开销\n\n**📌 关键概念**：Application Insights 自动监控 EC2 应用健康，嵌入式指标格式发布 FM 行为自定义指标，CloudWatch 异常检测自动建模基线并在 10 分钟内告警。","s":"第三方#110"},{"id":"D4-030","d":4,"t":"single","q":"某企业使用 Bedrock 为客户查询提供实时响应的 GenAI 应用。高峰流量期间对 FM 的 API 调用出现间歇性失败。企业须实现方案处理瞬态错误并为 FM 性能提供详细可观测性，防止限流期间级联故障，提供跨服务边界分布式跟踪以识别延迟贡献因素，且能将性能问题与特定 FM 特征关联。哪项方案可满足需求？","o":[{"l":"A","t":"实现自定义重试机制固定 1 秒间隔。配置 CloudWatch 告警监控错误率和延迟"},{"l":"B","t":"配置 SDK 标准重试模式带抖动指数退避。用 X-Ray 跟踪配合注释识别和过滤服务组件"},{"l":"C","t":"实现所有 FM 响应客户端缓存。在应用代码中添加自定义日志记录调用时长"},{"l":"D","t":"配置 SDK 自适应重试模式。用 CloudTrail 分布式跟踪监控限流事件"}],"a":["B"],"e":"**✅ 为什么 B.SDK 标准重试+抖动退避+X-Ray 跟踪+注释 对**：SDK 标准重试模式提供抖动指数退避，减少同步重试风暴防止级联故障，是 AWS 推荐的瞬态限流失效处理方式。X-Ray 提供分布式跟踪，跟踪请求通过组件和应用服务到 Bedrock 调用，识别延迟引入位置和下游贡献最大的调用。X-Ray 注释用模型 ID、推理参数和区域标注跟踪，实现按 FM 特征过滤分析延迟和错误模式，无需单独遥测系统。\n\n**❌ 为什么其他选项错**：\n- A.固定 1 秒重试：同步重试行为不提供分布式跟踪\n- C.客户端缓存+自定义日志：不防止级联故障，无跨服务跟踪\n- D.SDK 自适应+CloudTrail：CloudTrail 为审计日志非分布式跟踪，不提供延迟分析\n\n**📌 关键概念**：SDK 标准重试抖动退避防止级联故障，X-Ray 分布式跟踪识别延迟贡献因素，注释实现按 FM 特征关联性能问题。","s":"第三方#111"},{"id":"D4-031","d":4,"t":"single","q":"某企业处理客服工单，希望通过 Bedrock 集成 AI 情感分析和自动回复生成。须优先处理紧急问题，将初始响应时间相比手动回复降低 40%。方案须处理 100 个并发 webhook 请求，响应低于 500 毫秒，跨多区域保持 99.9% 可用性并验证所有请求身份。企业不希望修改现有基础设施（含多种 webhook 认证方式的多个工单系统），且须支持高峰期偶尔达 25 万日工单的扩展。哪项方案可满足需求？","o":[{"l":"A","t":"用带 Regional 端点的 API Gateway REST API 接收 webhook 并调用 Lambda。配置 Lambda 授权器验证所有认证方式。Lambda 调用 Bedrock 做情感分析和生成响应。结果存入 DynamoDB 全局表提供多区域可用性"},{"l":"B","t":"为每个工单系统创建 Lambda 函数 URL。用 NONE 认证类型。独立 Lambda 用 HMAC 验证签名。部署多区域用 Global Accelerator 路由。用 Bedrock 做分析和生成"},{"l":"C","t":"在各区域设 SQS 队列接收 webhook。用 SQS 调用 Lambda，调用 Comprehend 做情感分析，Lex 生成响应。用 EventBridge 重试传递"},{"l":"D","t":"部署多区域 AppSync GraphQL API。配置 API 令牌验证。创建变更解析器发布到 EventBridge。EventBridge 调用 Lambda 用 Bedrock 分析生成。用 CloudFront 降低延迟"}],"a":["A"],"e":"**✅ 为什么 A.API Gateway+Lambda 授权器+Bedrock+DynamoDB 全局表 对**：API Gateway Regional 端点处理高并发 webhook 请求（100+），Lambda 授权器集中评估多种认证方式防止未授权流量。Lambda 和 Bedrock 集成提供工单激增（25 万日）的可扩展性。DynamoDB 全局表跨多区域存储结果确保 99.9% 可用性和最小延迟访问。无需修改现有基础设施，Lambda 授权器统一处理多种 webhook 认证。\n\n**❌ 为什么其他选项错**：\n- B.NONE 认证+HMAC：安全性较低，NONE 认证类型风险高\n- C.SQS 队列：引入队列延迟可能超过 500 毫秒目标\n- D.AppSync+EventBridge+CloudFront：复杂架构增加运维开销\n\n**📌 关键概念**：API Gateway Lambda 授权器集中验证多种 webhook 认证方式，DynamoDB 全局表提供多区域 99.9% 可用性，Bedrock 处理高峰扩展。","s":"第三方#116"},{"id":"D4-032","d":4,"t":"single","q":"某大型电商企业部署 FM 生成产品描述。工程团队通过 CloudWatch 监控 Token 用量、延迟和错误率等技术指标。营销团队在自有系统中跟踪转化率和收入影响等业务指标。企业须建立统一可观测性方案将技术性能与业务结果关联，当运维指标显示性能下滑时自动向利益相关方发出告警，并提供跨技术与业务指标的全面可见性。哪项方案可满足需求？","o":[{"l":"A","t":"创建含技术指标和导入业务指标的 CloudWatch 仪表板。配置复合告警结合技术数据和业务数据。用 SNS 通知利益相关者"},{"l":"B","t":"用 Managed Grafana 可视化 CloudWatch 技术指标和外部业务指标。配置 Grafana 告警调用 Lambda 自动修复"},{"l":"C","t":"通过 CloudWatch 指标流将指标流式传输到 S3。创建 QuickSight 仪表板可视化组合指标。设 EventBridge 规则发通知"},{"l":"D","t":"配置集成运维指标与导入业务指标的 CloudWatch 自定义仪表板。设置带异常检测的 CloudWatch 复合告警。用 SNS 创建告警操作在关联指标指示问题时通知利益相关者"}],"a":["D"],"e":"**✅ 为什么 D.CloudWatch 自定义仪表板+复合告警+异常检测+SNS 对**：将业务指标导入 CloudWatch 后构建统一视图将系统健康与转化表现并排展示。复合告警仅在多条件同时满足时（如高延迟加转化率下滑）通知，减少告警疲劳。异常检测对 GenAI 工作负载至关重要——性能基线可能微妙变化，CloudWatch 自动发现偏差并通过 SNS 触发告警。运维复杂性低于管理外部可视化服务器或多服务分析管道。\n\n**❌ 为什么其他选项错**：\n- A.复合告警无异常检测：缺乏自动基线建模，告警依赖静态阈值\n- B.Managed Grafana+Lambda 自动修复：需管理外部可视化服务器和自定义修复逻辑\n- C.CloudWatch 指标流+S3+QuickSight：多服务分析管道运维复杂性高\n\n**📌 关键概念**：CloudWatch 自定义仪表板统一技术和业务指标，复合告警多条件关联减少告警疲劳，异常检测自动发现基线偏差并通过 SNS 通知。","s":"第三方#118"},{"id":"D5-001","d":5,"t":"single","q":"你的 GenAI 应用需要评估 FM 输出的质量，关注\"生成的回答是否与事实一致\"。应重点评估哪个指标？","o":[{"l":"A","t":"流畅性（Fluency）"},{"l":"B","t":"事实准确率（Factual Accuracy）"},{"l":"C","t":"相关性（Relevance）"},{"l":"D","t":"一致性（Consistency）"}],"a":["B"],"e":"事实准确率专门衡量输出与已知事实的一致性，是评估幻觉问题的最直接指标。流畅性衡量语言通顺度，相关性衡量与问题匹配度，一致性衡量多轮输出稳定性。","s":"自编#85"},{"id":"D5-002","d":5,"t":"single","q":"一家公司想在生产部署前系统评估两个基础模型（Claude 和 Nova）在客服场景中的表现。哪种方法最合适？","o":[{"l":"A","t":"人工快速浏览两个模型的随机输出"},{"l":"B","t":"使用 Amazon Bedrock 模型评估 + A/B 测试"},{"l":"C","t":"只根据模型文档的基准分数决定"},{"l":"D","t":"先部署到生产再观察用户反馈"}],"a":["B"],"e":"Bedrock 模型评估提供自动化和人工评估工作流，配合 A/B 测试可在生产前系统比较模型性能；金丝雀测试可小流量验证。凭文档分数或生产盲试都不够严谨。","s":"自编#86"},{"id":"D5-003","d":5,"t":"single","q":"你的 RAG 应用需要评估\"检索到的文档是否真的帮助模型回答正确\"。应使用哪种评估方法？","o":[{"l":"A","t":"RAG 评估（检索质量 + 生成质量）"},{"l":"B","t":"只评估生成文本的 BLEU 分数"},{"l":"C","t":"只统计 API 调用次数"},{"l":"D","t":"人工抽查 5 个回答"}],"a":["A"],"e":"RAG 评估同时衡量检索组件的相关性/召回率和生成组件的质量，是评估 RAG 应用的标准方法。仅看生成分数或调用量都无法定位是\"检索不好\"还是\"生成不好\"。","s":"自编#87"},{"id":"D5-004","d":5,"t":"single","q":"你想验证一个 AI 代理（Agent）是否真的完成了用户的任务。应重点评估哪个指标？","o":[{"l":"A","t":"任务完成率"},{"l":"B","t":"模型推理延迟"},{"l":"C","t":"嵌入维度"},{"l":"D","t":"上下文窗口大小"}],"a":["A"],"e":"任务完成率衡量 Agent 成功完成指定任务的百分比，是 Agent 性能的核心指标。还可配合工具使用有效性评估、多步骤工作流推理质量评估。","s":"自编#88"},{"id":"D5-005","d":5,"t":"single","q":"用户报告长文档问答时模型报错\"输入超出最大长度\"。最可能的原因是什么？应如何解决？","o":[{"l":"A","t":"上下文窗口溢出；使用动态分块策略或摘要"},{"l":"B","t":"模型温度过高；调低温度"},{"l":"C","t":"嵌入维度不匹配；重新生成嵌入"},{"l":"D","t":"API 密钥过期；更换密钥"}],"a":["A"],"e":"\"超出最大长度\"=上下文窗口溢出——输入超过模型限制。解决：动态分块策略、提示设计优化、截断相关错误分析。","s":"自编#89"},{"id":"D5-006","d":5,"t":"single","q":"你的 RAG 系统检索结果质量下降，怀疑是文档更新后嵌入未同步。应优先检查什么？","o":[{"l":"A","t":"嵌入质量诊断和漂移监控"},{"l":"B","t":"模型温度设置"},{"l":"C","t":"API 网关限流配置"},{"l":"D","t":"前端页面样式"}],"a":["A"],"e":"文档更新后嵌入未同步属于检索系统问题——先做嵌入质量诊断、漂移监控，检查分块/预处理是否需要补救。","s":"自编#90"},{"id":"D5-007","d":5,"t":"single","q":"你想追踪每个提示在系统中的完整处理链路，定位是\"提示有问题\"还是\"模型调用有问题\"。应使用什么工具？","o":[{"l":"A","t":"AWS X-Ray（提示可观测性管道）"},{"l":"B","t":"S3 生命周期策略"},{"l":"C","t":"Amazon Route 53"},{"l":"D","t":"AWS WAF"}],"a":["A"],"e":"X-Ray 可实施提示可观测性管道——跟踪提示从入口到模型调用的完整链路，配合 CloudWatch Logs 诊断提示混淆、架构验证检测格式不一致。","s":"自编#91"},{"id":"D5-008","d":5,"t":"single","q":"你在发布模型新版本前，想验证它不会比旧版本产生更多幻觉。应如何验证？","o":[{"l":"A","t":"使用合成用户工作流 + 幻觉率验证 + 回复一致性检查"},{"l":"B","t":"随机部署到生产观察"},{"l":"C","t":"只检查代码能否编译"},{"l":"D","t":"查看模型参数量"}],"a":["A"],"e":"部署验证系统：用合成用户工作流模拟真实交互，对幻觉率和语义漂移做 AI 特定输出验证，通过自动质量检查确保回复一致性。","s":"自编#92"},{"id":"D5-009","d":5,"t":"single","q":"你想量化 RAG 检索组件的性能——\"检索到的内容是否与用户问题相关\"。应测量哪个指标？","o":[{"l":"A","t":"相关性评分 + 检索延迟"},{"l":"B","t":"模型输出 Token 数"},{"l":"C","t":"嵌入向量维度"},{"l":"D","t":"冷启动时间"}],"a":["A"],"e":"检索质量测试关注相关性评分（检索内容与问题匹配度）、上下文匹配验证、检索延迟测量——这些都是任务5.1.6的核心。","s":"自编#93"},{"id":"D5-010","d":5,"t":"single","q":"应用调用 Bedrock API 时返回 400 错误。最可能的原因是什么？应如何排查？","o":[{"l":"A","t":"请求格式错误；检查错误日志、请求验证、回复分析"},{"l":"B","t":"磁盘空间不足；清理磁盘"},{"l":"C","t":"DNS 解析失败；检查域名"},{"l":"D","t":"网络断连；重启路由器"}],"a":["A"],"e":"400=请求格式错误（如 JSON 结构、参数错误）。排查：错误日志记录、请求验证、回复分析——任务5.2.2的FM集成问题诊断。","s":"自编#94"},{"id":"D5-011","d":5,"t":"single","q":"你想让用户对 AI 的回答质量持续反馈，并据此改进模型。应实施什么机制？","o":[{"l":"A","t":"反馈界面 + 模型输出评级系统 + 注释工作流"},{"l":"B","t":"提高模型温度"},{"l":"C","t":"增加上下文窗口"},{"l":"D","t":"使用更大的嵌入模型"}],"a":["A"],"e":"以用户为中心的评估：反馈界面收集用户意见、评级系统打分、注释工作流评估回复质量——持续改进FM性能（任务5.1.3）。","s":"自编#95"},{"id":"D5-012","d":5,"t":"single","q":"你需要确保模型更新后输出质量不回退。应建立什么机制？","o":[{"l":"A","t":"持续评估工作流 + 模型输出回归测试"},{"l":"B","t":"删除旧版本模型"},{"l":"C","t":"只记录 API 调用量"},{"l":"D","t":"关闭监控"}],"a":["A"],"e":"系统化质量保证：持续评估工作流监控输出质量、回归测试对比新旧版本、自动化质量控制机制——维护一致的性能标准（任务5.1.4）。","s":"自编#96"},{"id":"D5-013","d":5,"t":"single","q":"模型的回答时好时坏，同样的提示有时准确有时错误。应如何系统排查提示问题？","o":[{"l":"A","t":"使用提示测试框架 + 版本比较 + 系统化改进"},{"l":"B","t":"随机修改提示词碰运气"},{"l":"C","t":"更换模型提供商"},{"l":"D","t":"提高温度增加多样性"}],"a":["A"],"e":"提示工程排障：用提示测试框架系统验证、版本比较定位差异、系统化改进提示——而非盲目调整或换模型（任务5.2.3）。","s":"自编#97"},{"id":"D5-014","d":5,"t":"single","q":"业务方需要了解 GenAI 项目的模型表现和成本趋势。应如何高效汇报？","o":[{"l":"A","t":"可视化工具 + 自动报告机制 + 模型比较可视化"},{"l":"B","t":"口头总结"},{"l":"C","t":"不发报告"},{"l":"D","t":"只发原始日志"}],"a":["A"],"e":"报告系统：用可视化工具展示绩效指标、自动报告机制定期输出、模型比较可视化对比不同版本——高效向利益攸关方传递（任务5.1.8）。","s":"自编#98"},{"id":"D5-015","d":5,"t":"single","q":"某企业使用 Bedrock 构建 RAG 系统，以 S3 存储桶为数据源的 Knowledge Base 存储紧急新闻视频内容。系统从 S3 检索转录文本、存档报告和相关文档。尽管使用了先进嵌入模型和高性能检索配置，用户反馈响应迟缓且结果不相关。企业发现向量搜索在过多内容类型和过长时间范围内评估了过多文档，微调底层模型无济于事。企业须通过更智能的约束提升检索准确性，且对现有架构改动最小。哪项方案可满足需求？","o":[{"l":"A","t":"用针对紧急新闻内容训练的领域自适应模型增强嵌入以改进向量相似性"},{"l":"B","t":"迁移到 OpenSearch Service。用向量字段和元数据过滤器限定检索范围"},{"l":"C","t":"在 Bedrock Knowledge Base 中启用元数据感知过滤，通过索引 S3 对象元数据约束检索"},{"l":"D","t":"迁移到 Q Business 索引，在检索时执行结构化元数据过滤和文档分类"}],"a":["C"],"e":"**✅ 为什么 C.Knowledge Base 元数据感知过滤 对**：元数据感知过滤允许基于索引元数据（内容类型、发布日期、来源、类别）约束检索查询，将向量搜索限制在语料库相关子集（如最近紧急报告或特定格式），显著减少评估文档数量改善延迟和相关性。无需更改嵌入模型或检索基础设施，架构改动最小。当嵌入已足够强时，缩小候选集而非增加模型复杂度是 AWS 推荐的 RAG 优化方式。\n\n**❌ 为什么其他选项错**：\n- A.领域自适应模型：需重新训练嵌入模型，企业已确定微调无益\n- B.迁移到 OpenSearch：增加运营开销，偏离现有 Knowledge Base 架构\n- D.迁移到 Q Business：增加复杂性和实施工作量\n\n**📌 关键概念**：Bedrock Knowledge Base 元数据感知过滤通过索引 S3 对象元数据缩小向量搜索范围，在不更改嵌入模型或基础设施的前提下提升检索精度。","s":"第三方#6"},{"id":"D5-016","d":5,"t":"single","q":"某企业升级了 Bedrock 驱动的 FM，该 FM 支撑一款多语言客服助手。升级后助手在不同语言间表现出行为不一致——相同问题在不同语言中生成不同响应。企业须实现方案以检测和应对未来更新中的类似问题。评估须在 45 分钟内覆盖所有支持语言，并行处理至少 15000 个测试对话，完全自动化并集成到 CI/CD 管道中。未达质量阈值时须阻止部署。哪项方案可满足需求？","o":[{"l":"A","t":"创建分布式流量模拟框架同时发送多语言翻译密集型工作负载。用 CloudWatch 监控延迟和吞吐量。发布前运行模拟识别瓶颈"},{"l":"B","t":"部署到多区域用 Route 53 延迟路由和 Global Accelerator。将多语言日志存入 S3。每周审计一致性"},{"l":"C","t":"创建预处理管道将传入消息规范化为一致格式。用规则检查标记幻觉。评估重点放在规范化文本上"},{"l":"D","t":"设置同义标准化多语言测试对话。用 Bedrock 模型评估任务并行运行测试。应用相似性和幻觉阈值。集成到 CI/CD 阻止未通过版本发布"}],"a":["D"],"e":"**✅ 为什么 D.标准化多语言测试+Bedrock 评估任务+阈值+CI/CD 门控 对**：Bedrock 模型评估任务专为大规模可重复评估设计，并行化运行可在 45 分钟内处理 15000+ 对话。标准化测试对话每种语言表达相同意图，通过相似性指标比较不同语言输出可揭示语义回归。幻觉阈值确保答案有依据不引入虚构细节。集成到 CI/CD 管道实现全自动执行和硬性质量门控，未达阈值阻止部署防止回归进入生产。\n\n**❌ 为什么其他选项错**：\n- A.流量模拟：侧重基础设施瓶颈而非多语言响应质量\n- B.多区域+每周审计：部署后且太慢，无法防止回归\n- C.规范化输入：不衡量多语言输出等价性，无稳健量化指标\n\n**📌 关键概念**：Bedrock 模型评估任务并行运行标准化多语言测试对话，通过相似性和幻觉阈值检测跨语言行为回归，CI/CD 集成实现自动化质量门控。","s":"第三方#14"},{"id":"D5-017","d":5,"t":"single","q":"某金融科技公司使用 Bedrock 为客服 AI 助手构建评估系统。助手须提供事实准确、符合金融法规且对话得体的理财建议。企业须将大规模自动化质量评估与对关键交互的有针对性人工审核相结合。哪项方案可满足需求？","o":[{"l":"A","t":"配置由金融专家手动对所有响应的准确性、合规性和对话质量评分的管道。用 SageMaker 笔记本分析结果"},{"l":"B","t":"配置用 Claude Sonnet 作为评判模型的 Bedrock 评估评估响应准确性和恰当性。配置护栏检查响应是否符合金融政策。为被标记的关键交互添加 A2I 人工审核"},{"l":"C","t":"创建 Lex 机器人管理交互。配置 Lambda 检查静态合规数据库。添加意图收集最终用户反馈"},{"l":"D","t":"配置 CloudWatch 监控响应模
